[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyloop"
version = "0.1.0"
description = "AI自動リサーチ→有料ニュースレター配信による収益化パイプライン"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
moneyloop = "moneyloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
