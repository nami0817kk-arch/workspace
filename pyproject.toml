[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ailab"
version = "0.3.0"
description = "画像生成・フリー素材取得・外部サービス連携のツール群"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ailab = "ailab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
