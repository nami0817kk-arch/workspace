[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsite"
version = "0.1.0"
description = "広告収益型の実用ツールサイト・ジェネレータ"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
adsite = "adsite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
