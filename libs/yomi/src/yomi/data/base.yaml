# yomi の共通の一覧（どのチャンネルでも使うもの）。チャンネル固有の語は、チャンネル側の yaml で同じ形に足す
# （Lexicon.load(extra=...)。同じキーは足し合わせ、rules は後ろに足す）。
# カナはカタカナ。長音は「ー」でも母音でもよい（比べるときにそろえる）。
#
# 2026-10-10 に作った。rekishi-chiso の10/12〜13 の4本で、聞いて分かる誤読が約50か所あったのがきっかけ。
# 一覧と規則は、そのときの4本と過去の11本に流して、正しく読めている所で止めないことを確かめた。

# --- 読みが割れる語（1語として出たとき）-----------------------------------------------------
# 読み替え辞書で決めていなければ、エンジンの読みと一緒に一覧に出す（人が kana で確かめる）。読みは候補。
ambiguous:
  家: [ケ, カ, イエ, ヤ]
  方: [カタ, ホウ, ガタ]
  表: [オモテ, ヒョウ]
  上: [ウエ, ジョウ, カミ, ウワ]
  下: [シタ, ゲ, シモ, カ, モト]
  行: [ギョウ, コウ, イ, ユ, オコナ, クダリ]
  行っ: [イッ, オコナッ]
  行う: [オコナウ]
  生: [セイ, ショウ, ナマ, イ, ウ]
  日: [ヒ, ニチ, カ, ジツ]
  月: [ツキ, ゲツ, ガツ]
  中: [ナカ, チュウ, ジュウ]
  石: [イシ, コク, セキ]
  床: [トコ, ユカ, ショウ]
  米: [コメ, ベイ, マイ]
  戦: [イクサ, セン, タタカ]
  正: [セイ, ショウ, タダシ, マサ]
  年: [トシ, ネン]
  間: [アイダ, マ, カン, ケン]
  主: [アルジ, ヌシ, シュ, オモ]
  銭: [ゼニ, セン]
  頭: [アタマ, カシラ, トウ, ズ, カミ]
  市: [イチ, シ]
  末: [スエ, マツ]
  側: [ガワ, ソク, カワ]
  風: [カゼ, フウ]
  値: [ネ, アタイ, チ]
  重: [ジュウ, オモ, エ, チョウ]
  幸: [サチ, コウ, ユキ]
  辛: [カラ, ツラ, シン]

# --- 文脈で読みが決まる型（当たったら止める。エンジンが want のどれかで読んでいれば止めない）---------------
# surface：当たる語（fugashi の1語）。when：前後の語の条件（-1 は1つ前、+1 は1つ後）。リストならどれか1つ。
# unless：当たったら外す。条件は surface（語のどれか）・end（語の最後の字がこの中）・pos1/pos2/pos3（品詞）・
# any（条件のどれか）。
rules:
  - name: 名字＋家
    surface: [家]
    want: [ケ]
    when: {-1: {pos2: 固有名詞}}
  - name: 数字＋石
    surface: [石]
    want: [コク, ゴク]
    when:
      - {-1: {pos2: 数詞}}
      - {-1: {end: 〇一二三四五六七八九十百千万億}}
  - name: 数字＋石
    surface: [十石, 百石, 千石, 万石]
    want: [ジュッコク, ジッコク, ヒャッコク, ヒャクゴク, センゴク, マンゴク]
    when: {-1: {pos2: 数詞}}
  - name: 名前＋の方
    surface: [方]
    want: [カタ]
    when:
      - {-1: {surface: [の]}, -2: {pos2: 固有名詞, pos3: 人名}}
      - {-1: {surface: [の]}, -3: {surface: [お, 於]}}
      - {-1: {surface: [の]}, -2: {pos2: 固有名詞}, +1: {surface: [と, 」, 』, は, が, も, って]}}
  - name: 表＋の/に/と
    surface: [表]
    want: [オモテ]
    when: {+1: {surface: [の, に, と]}}
    unless: {-1: {surface: [この, その, あの, 次, 下, 上, 右, 左, 年]}}

