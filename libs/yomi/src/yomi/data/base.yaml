# 語ごとに、エンジンがこう読めば誤りではない（辞書のほうが外す・揺れの範囲）。[] はどう読んでも知らせない
alike:
  兄ちゃん: [ニイチャン]
  姉ちゃん: [ネエチャン]
  日当: [ニットウ]
  入ら: [イラ]
  翌朝: [ヨクアサ]
  明日: [アシタ]
  明日の: [アシタノ]
  通っ: [トオッ]
  重そう: [オモソウ]
  線引: [センヒ]
  主だっ: [シュダッ]
  日本: [ニホン]
  年が: [トシガ]
  か〜: []

# 数字の直後の数え方の読み（「1日＝ツイタチ」「5人＝ゴニン」）。頭の濁り・半濁りは別に足す
counters:
  日: [ニチ, カ, ヒ, ジツ, ッカ]
  人: [ニン, リ, ジン]
  月: [ガツ, ゲツ, ツキ]
  年: [ネン]
  石: [コク]
  間: [カン, ケン, マ]
  歳: [サイ]

# 辞書の書きのカナに無いが、そう読んで正しい形（「言う」の pron はユー、エンジンはイウ）
extra:
  言う: [イウ]
  いう: [イウ]
  言っ: [イッ]
  いっ: [イッ]
