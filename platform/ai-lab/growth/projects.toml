# 成長ループの管理対象。モノレポ化（2026-09-01）に伴い、対象は workspace 1つ。
# projects/* と libs/* が subprojects として個別に点検される。

[config]
max_proposals_per_project = 3
max_proposals_total = 12
nag_decay_after = 3
publish_issues = false
summary_issue_repo = "nami0817kk-arch/workspace"

[[project]]
key = "workspace"
repo = "nami0817kk-arch/workspace"
title = "開発モノレポ（全PJT）"
tags = ["monorepo"]
weight = 1.0
subprojects = ["projects/*", "libs/*"]
