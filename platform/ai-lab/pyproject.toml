[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab"
version = "0.5.0"
description = "PJT で使う機能・仕組みの開発基盤 - 画像生成と音声合成(imagegen)・動画合成(videogen)・広告収益サイト(adsite)・成長ループ(growth)・音素材生成(audiogen)・ブラウザ操作(browser)"
requires-python = ">=3.11"
# 既定の実行時依存はゼロ。adsite / growth / audiogen は標準ライブラリだけで動く。
# 定期実行されるものが多いので、依存が増えるほど勝手に壊れる確率が上がるため、
# 依存が要るものは extras に切り出してある。
dependencies = []

[project.optional-dependencies]
# imagegen（画像生成・素材取得・レシピ）の実行に必要
image = ["requests>=2.31", "Pillow>=10.0", "PyYAML>=6.0"]
# 実際に Claude を呼ぶときだけ必要（テストには不要）
llm = ["anthropic>=1.0.0"]
# browser（Chrome の自動操作）の実行に必要
browser = ["playwright>=1.55"]
# videogen の書き出しに必要な ffmpeg 本体（Python の依存ではなく実行ファイルの同梱）。
# システムに ffmpeg が入っているなら要らない。テストは ffmpeg を起動しないので dev には入れない。
video = ["imageio-ffmpeg>=0.4"]
# docparse（PDF から本文と表を抜く）の実行に必要。
# このリポジトリで唯一、標準ライブラリだけでは代替できない処理なので依存を認めている。
docs = ["pdfplumber>=0.11"]
dev = ["ai-lab[image]", "ai-lab[browser]", "pytest>=8.0.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
imagegen = "imagegen.cli:main"
adsite = "adsite.cli:main"
growth = "growth.cli:main"
audiogen = "audiogen.cli:main"
videogen = "videogen.cli:main"
docparse = "docparse.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 既定(E4/E7/E9/F)に、import順(I)・古い書き方(UP)・よくある落とし穴(B)を足す
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests をパスに入れているのは、共有ヘルパ(helpers.py / fakes.py)を
# ツール別サブディレクトリのテストから import できるようにするため。
pythonpath = ["src", "tests"]
addopts = "-q"
