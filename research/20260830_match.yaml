  - id: turning
    heading: 何が起きていないのか
    tier: 報道
    telop: 2試合続けて無得点。ホームでの敗戦は監督就任後はじめて
    say:
      - ここからが問題です。トッテナムは、この試合も得点できませんでした。開幕から2試合、まだ1点も取れていません。
      - デゼルビ監督にとっては、就任してからホームでの初黒星です。解説者のジェイミー・キャラガー氏は、この立ち上がりを厳しく批判したと伝えられています。
