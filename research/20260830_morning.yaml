# 朝の一報 の取材メモ（2026年8月30日）
# 1本＝1テーマ。見出しに書いてあることだけを使う
slot: morning
date: "2026年8月30日"

theme:
  id: alvarez
  prefix: 速報
  title: アルバレスに突きつけられた「日曜まで」
  hook: 移籍期限まであと2日。ヨーロッパで最大の焦点になっている移籍に、期限が切られました。
  question: 金額で折り合えるのに、なぜアトレティコは売らないのか

thumbnail:
  line1: アルバレスに決断の期限
  line2: アトレティコ「バルサには売らない」
  tags: [移籍期限まで2日, アーセナル]

answer: 問題は金額ではなく「誰に売るか」。ライバルに主力を渡すこと自体を拒んでいる
watch: 本人がアーセナル行きを受け入れるかどうか。期限は日本時間9月2日の朝7時

sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: アトレティコが本人に決断の期限を提示
    say:
      - アトレティコ・マドリードに所属する、フリアン・アルバレス選手の去就です。クラブが本人に対し、残留するか、アーセナル行きを受け入れるか、決断の期限を示したと報じられています。
      - アルバレス選手は、直近のセビージャ戦に出場していません。移籍のうわさが理由だと伝えられています。
    sources:
      - https://www.espn.com/soccer/story/_/id/49750822/julian-alvarez-sits-latest-atletico-madrid-training-session-amid-transfer-links
      - https://www.skysports.com/football/news/11095/13578318/julian-alvarez-transfer-news-atletico-madrid-set-deadline-for-striker-to-decide-whether-he-stays-or-joins-arsenal
    card:
      type: quote
      color: "#e2495a"
      text: "Atletico Madrid set deadline for striker to decide whether he stays or joins Arsenal"
      translation: アトレティコは、残留かアーセナル行きかを決めるための期限を本人に設定した

  - id: why
    heading: なぜ売らないのか
    tier: 報道
    telop: 金額ではなく「誰に売るか」が問題
    say:
      - ここが今回の核心です。本人が望んでいるのはバルセロナ。ところがアトレティコは、バルセロナとは交渉のテーブルにすら着かないという姿勢を崩していません。
      - バルセロナのラポルタ会長は、獲得にまだ期待を持っていると話したと伝えられています。それでもアトレティコの態度は変わっていません。
      - 一方で、アーセナル相手なら話は動くと報じられています。金額はいちおくごせんまんユーロ規模。同じ選手、同じ規模の金額でも、相手がバルセロナかどうかで扱いが変わる。つまり、これは金の問題ではないということです。
    sources:
      - https://www.espn.com/soccer/story/_/id/49741017/atletico-madrid-julian-alvarez-transfer-barcelona
      - https://www.skysports.com/football/news/11670/13577751/julian-alvarez-transfer-news-atletico-madrid-wont-sell-striker-to-barcelona-with-arsenal-the-only-option
      - https://www.espn.com/soccer/story/_/id/49731730/barcelona-hopeful-signing-julian-alvarez-atletico-madrid-joan-laporta
    card:
      type: points
      title: 争点の整理
      color: "#e2495a"
      items:
        - 金額では合意できる可能性がある
        - バルセロナへの売却だけは拒否
        - アーセナルなら交渉に応じる姿勢

  - id: numbers
    heading: 残された時間
    tier: 確定
    telop: "英国の移籍期限: 9/1 23:00 BST（日本時間 9/2 7:00）"
    official: true
    say:
      - 時間の話をします。イングランドの移籍期限は、現地じかんくがつついたちの、よるじゅういちじ。日本時間では、くがつふつかの朝しちじです。
      - 書類を出し終えていれば、そのあと2時間の猶予があります。それでも、残された時間はごくわずかです。
    sources:
      - https://www.espn.com/soccer/story/_/id/48944912/premier-league-efl-summer-transfer-window-2026-dates-does-open-deadline-day
      - https://www.skysports.com/football/news/11095/13546220/summer-transfer-window-2026-dates-when-is-deadline-day-for-premier-league-and-efl-clubs-to-sign-players

  - id: next
    heading: これからどうなる
    tier: 未確認
    telop: 決めるのはクラブではなく本人
    say:
      - ここからは未確認の情報です。本拠地では、サポーターが自軍のストライカーにブーイングを浴びせる場面まで報じられました。
      - 本人がアーセナル行きを受け入れれば、移籍は動く。受け入れなければ、このまま残る。決めるのはクラブではなく本人だ、というのが各紙の見方です。
    sources:
      - https://www.skysports.com/football/news/11095/13576511/julian-alvarez-does-atletico-madrid-fans-booing-their-own-striker-increase-his-chances-of-an-arsenal-or-barcelona-move
