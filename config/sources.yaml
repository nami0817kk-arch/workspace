# 取材の計画。「いつ・どこから・どの情報を取るか」をここに書く。
#
#   python -m src.cli plan --routine morning     その枠の取材リスト
#   python -m src.cli plan --routine all         今日の3本ぶんまとめて
#   python -m src.cli plan --routine morning --write   取材メモの雛形も作る
#   python -m src.cli draft research/xxx.yaml    取材メモ→台本（確度と重複を検証）

cadence:
  per_day: 3
  slots: [morning, noon, evening]   # 1日の並び

# 使ってよい情報源。ここに無いサイトは検索対象にしない（docs/news-sources.md の実測結果）
# 情報源の網。すべて実測で確認したもの（最終確認 2026-08-30）。
# max_tier … その群だけを根拠に置ける最大の確度。超えるなら別の群で裏を取る
domains:
  # クラブ・リーグの公式。声明そのものを引ける
  official: [en.atleticodemadrid.com, atleticodemadrid.com, fcbarcelona.com,
             arsenal.com, premierleague.com, laliga.com, uefa.com]

  # 英語の報道機関
  english: [skysports.com, espn.com, goal.com, 90min.com, football365.com,
            si.com, cbssports.com]

  # 日本語の報道機関。訳す手間が要らないぶん速い
  japanese: [soccer-king.jp, footballchannel.jp, web.ultra-soccer.jp,
             theworldmagazine.jp, football-tribe.com]

  # 複数媒体を横断できる。見出しに媒体名が入る
  aggregator: [news.yahoo.co.jp]

  german: [kicker.de]
  italian: [football-italia.net]
  social: [x.com]

  # 噂まとめ。単独では根拠にしない
  rumour: [caughtoffside.com, givemesport.com, tribalfootball.com]

  # 恒久的に取得できないサイト。ここを検索しても結果は返らない
  blocked: [bbc.com, theguardian.com, theathletic.com, nytimes.com, marca.com,
            as.com, mundodeportivo.com, lequipe.fr, gazzetta.it, bild.de,
            telegraph.co.uk, independent.co.uk, mirror.co.uk, standard.co.uk,
            talksport.com, transfermarkt.com, football.london]

# 群ごとに置ける確度の上限。draft のときに突き合わせる
domain_tiers:
  official: 確定
  english: 報道
  japanese: 報道
  aggregator: 報道
  german: 報道
  italian: 報道
  social: 未確認
  rumour: 未確認

# Xで追うアカウント。x.com は直接開けないが、検索結果に投稿本文が出る。
# ここに無いアカウントの投稿は「未確認」より上に上げない
#   tier … その人の投稿だけで置ける最大の確度
#   note … 何に強いか
accounts:
  - {handle: FabrizioRomano, name: Fabrizio Romano, tier: 未確認, note: 移籍全般。完了案件は here we go}
  - {handle: David_Ornstein, name: David Ornstein, tier: 未確認, note: プレミア・The Athletic}
  - {handle: MatteMoretto, name: Matteo Moretto, tier: 未確認, note: スペイン・イタリア}
  - {handle: DiMarzio, name: Gianluca Di Marzio, tier: 未確認, note: セリエA}
  - {handle: TheAthleticFC, name: The Athletic Football, tier: 報道, note: 媒体の公式}

# 記者の投稿をどう扱うか
social:
  # search … WebSearch で拾う。無料。ただし索引が1〜2日遅れ、本文が切れることがある
  # api  … X API v2 から取る。有料。遅れず、本文も切れず、なりすましも引かない
  #        トークンは環境変数 X_BEARER_TOKEN で渡す。料金は docs.x.com/x-api で確認
  backend: search
  api:
    max_results: 10       # 1回の検索で取る件数。読み取りは課金対象なので絞る
    exclude_retweets: true
  # 検索でXの投稿を引くと、いちばん新しいもので1〜2日前になる（実測）。
  # 検索の索引がそこまでしか追いついていないため、こちらでは短くできない。
  # → Xは「速報」には使えない。背景・反応・裏取りに使う
  index_lag_hours: 48
  # これより古い投稿は、続報が出ていないか確認してから使う
  stale_hours: 72
  check: |
    投稿本文は検索結果のタイトルから取る。x.com のページは開けない。
    末尾が … で切れている投稿は、切れたまま引用するか使わないかのどちらか。
    足りない部分を推測で補わない。
    なりすましアカウントが検索に出る（例: fabrizioromab0）。ハンドルを1文字ずつ確認する

# 収集は2段階にする。
#   1. スキャン … 1日1回、候補テーマを広く拾う（枠ごとに探すより速い）
#   2. 深掘り　 … 選んだテーマについて、節を埋めるための検索
#
#   python -m src.cli scan            候補探しの検索リスト＋候補ファイルの雛形
#   python -m src.cli pick <候補file>  採点して枠に割り振り、深掘りの検索リストを出す

# 候補の採点。どれを動画にするかの判断を、毎回同じものさしで行う
scoring:
  weights:
    freshness: 3      # 新しさ。速報性がそのまま再生に効く
    japanese: 1       # 日本人選手が絡む。多少の後押しにとどめる（縛りにはしない）
    reaction: 3       # 賛否が割れる・驚きがある。コメントが伸びる
    big_club: 2       # ビッグクラブが絡む
    numbers: 1        # 金額・記録など、数字が立つ
  freshness_hours:    # 何時間前なら何点か
    6: 3
    12: 2
    24: 1
  big_clubs:
    - レアル・マドリード
    - バルセロナ
    - マンチェスター・シティ
    - マンチェスター・ユナイテッド
    - リバプール
    - アーセナル
    - チェルシー
    - バイエルン
    - パリ・サンジェルマン
    - インテル
    - ミラン
    - ユヴェントス
    - アトレティコ・マドリード
  # 枠ごとの選び方。上から順に条件を見て、合うものを割り当てる
  # 同じ話題（topic）を1日に2枠へ入れない。大きい話が1つあると
  # 3本ともそれになりがちなので、枠をまたいだ重複を止める
  spread_topics: true
  slots:
    morning: {prefer: freshness, require_tier: [確定, 報道]}
    noon: {prefer: reaction}
    evening: {prefer: total}

# テーマが決まったあとの深掘り検索。{theme} に選んだテーマが入る
# {theme} には候補の見出し、{en} には候補の en（英語の語）が入る。
# {en} を使う行は、候補に en が書かれているときだけ出る
deep:
  - {q: "{theme} 詳細", label: 何が起きたか}
  - {q: "{en} latest news", domains: english, label: 何が起きたか（英語）}
  - {q: "{en} why explained", domains: english, label: なぜそうなったか}
  - {q: "{en}", domains: social, label: 反応}
  - {q: "{en} fee OR record OR stats", domains: english, label: 数字}

# 1本の作り方。まとめではなく、1テーマを掘る
policy:
  one_theme_per_video: true
  min_sections: 3             # これ未満は「深掘り」と呼べないので draft で止める
  require_question: true      # 動画が答える問いを必ず立てる

# 確度の判定基準。draft のときに機械的にチェックする
tiers:
  確定:
    needs_sources: 1
    needs_official: true      # クラブ・リーグ・当事者の発表であること
    description: クラブ・リーグ・当事者が発表した
  報道:
    needs_sources: 2          # 2社以上で一致していること
    needs_official: false
    description: 報道機関が報じた
  未確認:
    needs_sources: 1
    needs_official: false
    description: SNS・単一ソース・噂の段階
  背景:
    needs_sources: 0
    needs_official: false
    description: 経緯・前提の説明。新規の報道ではないことを画面で明示する

# 同じ話題を繰り返さないための設定
coverage:
  ledger: research/covered.yaml
  repeat_within_hours: 36     # この時間内に扱った話題は draft で止める
  show_recent: 12             # plan のときに直近いくつを表示するか

# 1日1回のスキャン。ここで候補を広く拾う
scan:
  when: 05:30（朝の枠に間に合わせる）
  # 日本語サイトを日付で引くと一覧ページしか返らない（実測）。話題の語で引く。
  # 日付が効くのは英語サイトだけ
  queries:
    - {q: "移籍 発表 OR 決定 OR 公式", domains: japanese, label: 日本語（決まったもの）}
    - {q: "移籍 交渉 OR 関心 OR 浮上", domains: japanese, label: 日本語（動いているもの）}
    - {q: "日本人選手 移籍 OR ゴール OR デビュー", domains: japanese, label: 日本人選手}
    - {q: "Jリーグ 移籍 OR 監督 OR 首位", domains: japanese, label: Jリーグ}
    - {q: "football news {today_en}", domains: english, label: 英語の総覧}
    - {q: "transfer news {today_en}", domains: english, label: 移籍（英語）}
    - {q: "official statement OR announcement transfer", domains: official, label: クラブの公式発表}
    - {q: "Fabrizio Romano here we go", domains: social, label: 記者（移籍の完了）}
    - {q: "David Ornstein exclusive", domains: social, label: 記者（プレミア）}
  check: |
    1件ずつ candidates に書き出す。この時点では深掘りしない。
    見出しから拾えるものだけを埋め、判断は pick に任せる。
    日本語サイトは日付で引かない。選手名・クラブ名・動詞（発表/交渉/移籍）で引く。
    確定として出すなら official 群まで辿る。報道の又聞きでは確定にしない。
    拾ったURLを python -m src.cli fresh に流すと、新しい順に並ぶ。
    soccer-king / footballchannel はURLに日付が入るので、経過時間が正確に出る

routines:
  # ---------------------------------------------------------------- 朝
  morning:
    name: 朝の一報
    when: 07:00 公開（06:00 収録）
    cover_hours: 12
    target_minutes: 2
    angle: |
      欧州は日本の深夜に動く。夜のあいだに出た発表のうち
      いちばん大きいもの1件を選び、それだけを扱う。速報だが薄くはしない。
    structure:
      - {id: what, heading: 何が起きたか, tier: 確定}
      - {id: why, heading: なぜ動いたのか, tier: 報道}
      - {id: next, heading: これからどうなる, tier: 報道}
    steps:
      - id: overnight
        what: 夜のあいだに出た公式発表（この中から1件を選ぶ）
        tier: 確定
        queries:
          - {q: "official announcement transfer {today_en}", domains: english}
          - {q: "海外サッカー 発表 {date_ja}"}
        check: クラブの発表か。発表の日時を控える

      - id: results
        what: 夜の試合結果と日本人選手
        tier: 報道
        queries:
          - {q: "海外日本人選手 試合結果 {date_ja}"}
          - {q: "results {today_en}", domains: english}
        check: スコアと得点者は2ソースで突き合わせる

  # ---------------------------------------------------------------- 昼
  noon:
    name: 昼の話題
    when: 12:00 公開（11:00 収録）
    cover_hours: 24
    target_minutes: 2
    angle: |
      昼休みに見られる枠。賛否が割れている話・驚きのある話を1件選んで掘る。
      題材は問わない。欧州でも日本人選手でもJリーグでもよい。
      朝の枠とは別の話題にする（同じ話を1日2回出さない）。
    structure:
      - {id: what, heading: 何が起きたか, tier: 報道}
      - {id: background, heading: なぜ割れているのか, tier: 背景}
      - {id: next, heading: 次の焦点, tier: 報道}
    steps:
      - id: talking_point
        what: いま賛否が割れている話（この中から1件を選ぶ）
        tier: 報道
        queries:
          - {q: "criticism OR backlash OR pressure {today_en}", domains: english}
          - {q: "海外サッカー 批判 OR 議論 {date_ja}"}
        check: 誰が言ったのかを特定する。「ファンの声」で済ませない

      - id: japanese
        what: 日本人選手・Jリーグ（あれば。無ければ無理に入れない）
        tier: 報道
        queries:
          - {q: "海外日本人選手 {date_ja}"}
          - {q: "Jリーグ {date_ja}"}
        check: 2社以上で内容が一致しているか

  # ---------------------------------------------------------------- 夜
  evening:
    name: 夜のまとめ・深掘り
    when: 19:00 公開（18:00 収録）
    cover_hours: 24
    target_minutes: 3
    angle: |
      その日いちばん大きいテーマを1つ選び、正面から掘る枠。
      「なぜそうなったか」「争点はどこか」を必ず入れる。図解を使う。
      朝と昼で速報した話題を掘り直してよい（follow_up: true を書く）。
    structure:
      - {id: what, heading: 何が起きたか, tier: 報道}
      - {id: background, heading: ここに至る経緯, tier: 背景}
      - {id: point, heading: 争点はどこか, tier: 報道}
      - {id: numbers, heading: 数字で見ると, tier: 確定}
      - {id: next, heading: これからどうなる, tier: 未確認}
    steps:
      - id: biggest
        what: その日いちばん大きかった話題（この中から1つを選ぶ）
        tier: 報道
        queries:
          - {q: "biggest story {today_en}", domains: english}
          - {q: "海外サッカー 話題 {date_ja}"}
        check: 朝・昼で扱っていれば follow_up として深掘りに回す

      - id: rumours
        what: 交渉中の案件・噂
        tier: 未確認
        topics: []            # 追いたい選手名をここに足す
        queries:
          - {q: "{topic} latest", domains: english}
          - {q: "{topic} transfer", domains: social}
        check: |
          SNSは投稿日が取れない。内容に日付や文脈があるものだけ採用する。
          公式アカウントか実績のある記者か、ファンアカウントかを見分ける

      - id: numbers
        what: 数字で見せられるもの（順位・得点ランキング）
        tier: 確定
        queries:
          - {q: "Premier League table {period_en}", domains: english}
          - {q: "top scorers {period_en}", domains: english}
        check: 表カード(type table)や棒グラフ(type bars)にする。出典を明記

  # ---------------------------------------------------------------- 特別編
  deadline_day:
    name: 移籍期限日（特別編）
    when: 各国の移籍期限の当日と翌日
    cover_hours: 24
    target_minutes: 4
    steps:
      - id: done_deals
        what: 期限までに成立した移籍
        tier: 確定
        queries:
          - {q: "deadline day confirmed transfers {today_en}", domains: english}
      - id: collapsed
        what: 破談・不成立になった案件
        tier: 報道
        queries:
          - {q: "deadline day collapsed transfer {today_en}", domains: english}
