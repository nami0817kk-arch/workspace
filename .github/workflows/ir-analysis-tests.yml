name: ir-analysis tests

on:
  push:
    branches: [master]
    paths: ["projects/ir-analysis/**", ".github/workflows/ir-analysis-tests.yml"]
  pull_request:
    paths: ["projects/ir-analysis/**", ".github/workflows/ir-analysis-tests.yml"]
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/ir-analysis"
      install: "pip install -r requirements.txt pytest"
