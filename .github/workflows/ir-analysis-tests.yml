name: ir-analysis tests

on:
  push:
    branches: ["**"]
    paths: ["projects/ir-analysis/**", ".github/workflows/ir-analysis-tests.yml"]
  pull_request:
    paths: ["projects/ir-analysis/**", ".github/workflows/ir-analysis-tests.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/ir-analysis"
      install: "pip install -r requirements.txt pytest"
