name: stickfigure tests

on:
  push:
    branches: ["**"]
    paths: ["projects/stickfigure/**", ".github/workflows/stickfigure-tests.yml"]
  pull_request:
    paths: ["projects/stickfigure/**", ".github/workflows/stickfigure-tests.yml"]
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # 動きの計算(補間・バネ・順運動学・接触の逆算・点検のゲート)を見る。
    # Blender での書き出しと合成(画像)は CI に Blender が無いので対象外。
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/stickfigure"
      cache-dependency-path: "projects/stickfigure/requirements.txt"
