name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にしておく。
permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # README が Windows 前提なので Windows でも回す
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ailab tests

      - name: Run tests
        # 網羅率が下がったら気づけるようにしておく
        run: pytest -q --cov=ailab --cov-report=term-missing --cov-fail-under=90

      - name: CLI smoke test
        run: |
          ailab --version
          ailab connectors
