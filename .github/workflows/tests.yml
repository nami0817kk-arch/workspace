name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pywin32 は sys_platform マーカーで Windows 以外では入らない
      - run: pip install -r requirements.txt pytest
      - run: pytest
