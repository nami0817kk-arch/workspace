name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にしておく。
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
