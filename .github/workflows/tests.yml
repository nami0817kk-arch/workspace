# 実体は ai-lab の共通ワークフロー（python-tests.yml）。
# actions の更新や手順の変更は ai-lab 側1箇所で済む。
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    uses: nami0817kk-arch/ai-lab/.github/workflows/python-tests.yml@master
    with:
      install: "pip install -r requirements.txt pytest"
