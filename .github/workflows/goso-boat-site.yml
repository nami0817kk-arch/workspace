# 護送ボートの公開ページ（法務ページ・app-ads.txt・紹介）を Cloudflare Pages の goso-boat に出す。
# アプリの設定画面は https://goso-boat.pages.dev/privacy.html と support.html を開く（lib/app/links.dart）。
# ストアの「マーケティング URL」もここにするので、AdMob は直下の app-ads.txt を読みに来る。
#
# テスト用の Web版（goso-boat-web-test.yml → goso-boat-test）とは別のプロジェクト。
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（soccer-pages.yml と同じ値）
name: 護送ボートの公開ページ

on:
  push:
    branches: [master]
    paths:
      - "projects/goso-boat/legal/**"
      - "projects/goso-boat/site/**"
      - ".github/workflows/goso-boat-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: goso-boat-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/goso-boat
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p dist
          cp site/* dist/
          cp legal/*.html dist/
          ls -la dist

      # 無ければ作る。既にあれば重複エラーが返るだけ。production_branch を master に固定する
      # （デプロイの --branch とずれると、本番ではなくプレビューの別URLに出て法務リンクが404になる）
      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"goso-boat","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/goso-boat
          command: pages deploy dist --project-name=goso-boat --branch=master

      # 自分のドメイン goso.dailyquarry.com を付ける（2026-10-02）。ストアのマーケティング URL が *.pages.dev だと、
      # AdMob は pages.dev/app-ads.txt を読みに行って「アプリを確認」が通らない。何度回しても同じ結果になる（冪等）
      - name: Ensure custom domain goso.dailyquarry.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CF_TOKEN"
          echo "Pages にドメインを足す:"
          curl -s -X POST "$API/accounts/$CF_ACCOUNT/pages/projects/goso-boat/domains" -H "$H" -H "Content-Type: application/json" \
            --data '{"name":"goso.dailyquarry.com"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(' success' if d.get('success') else ' '+str(d.get('errors')))"
          zone=$(curl -s "$API/zones?name=dailyquarry.com" -H "$H" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$zone" ]; then
            echo "::warning::dailyquarry.com のゾーンが読めません（トークンに DNS の権限が無い）。DNS は Cloudflare のダッシュボードで Pages の Custom domains から足す"
          else
            n=$(curl -s "$API/zones/$zone/dns_records?name=goso.dailyquarry.com" -H "$H" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('result') or []))")
            if [ "$n" = "0" ]; then
              echo "DNS に CNAME を足す:"
              curl -s -X POST "$API/zones/$zone/dns_records" -H "$H" -H "Content-Type: application/json" \
                --data '{"type":"CNAME","name":"goso","content":"goso-boat.pages.dev","proxied":true}' \
                | python3 -c "import sys,json;d=json.load(sys.stdin);print(' success' if d.get('success') else ' '+str(d.get('errors')))"
            else
              echo "DNS の CNAME は既にある"
            fi
          fi
          echo "ドメインの状態:"
          curl -s "$API/accounts/$CF_ACCOUNT/pages/projects/goso-boat/domains/goso.dailyquarry.com" -H "$H" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or {};print(' status=',r.get('status'),' validation=',(r.get('validation_data') or {}).get('status'))"

      # アプリが開く URL で本当に見えるか（プロジェクト名が取られていて別の URL になった場合もここで分かる）
      - name: Check the public URLs
        run: |
          sleep 20
          for p in privacy.html support.html terms.html app-ads.txt; do
            curl -fsSL "https://goso-boat.pages.dev/$p" -o /tmp/page || { echo "::error::https://goso-boat.pages.dev/$p が開けません"; exit 1; }
          done
          grep -q "護送ボート" <(curl -fsSL https://goso-boat.pages.dev/privacy.html) || { echo "::error::goso-boat.pages.dev が護送ボートのページではありません"; exit 1; }
          curl -fsSL https://goso-boat.pages.dev/app-ads.txt
