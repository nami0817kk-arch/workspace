name: price-tracker daily

# 運用: 取得は手元PC（run-daily.ps1、毎日10:10）が行い data/ を push する。
# 楽天は Backend Service 型で許可IPからのリクエストしか受け付けず、Actions の
# ランナーはIPを固定できないため、CI からは取得しない。
# この CI は push された data/ の検証と、取得が止まっていないかの監視を行う。
on:
  push:
    branches: [master]
    paths:
      - "projects/price-tracker/data/**"
      - "projects/price-tracker/src/**"
      - ".github/workflows/price-tracker-daily.yml"
  schedule:
    # 13:00 JST = 04:00 UTC。手元PCの取得（10:10）が済んだ頃に見る。
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/price-tracker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

      # 手元PCの取得タスクが止まっていないかの監視。
      #
      # 以前はここで「履歴が1件も無い」場合に警告だけ出して成功させていた。
      # 記録開始前を赤くしない意図だったが、結果として**一度も動き始めて
      # いない状態が永久に緑のまま**になった（2026-09-04 に発覚。設定した
      # 09-03 から丸1日、genres が空・データ0件・取得タスク未登録のまま
      # 誰も気づかなかった）。「まだ始まっていない」と「止まった」を
      # 区別できないなら、監視として機能していない。
      #
      # 段階ごとに別のことを言う。どれも黙って通さない。
      - name: Check data freshness
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import date, datetime
          from pathlib import Path

          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          genres = cfg.get("genres") or []
          snap_dir = Path("data/snapshots")
          snaps = sorted(snap_dir.glob("*.csv.gz")) if snap_dir.is_dir() else []

          if not genres:
              print("::error::config.json の genres が空のままです。価格の記録が"
                    "一度も始まっていません。手元PCで .env に RAKUTEN_ACCESS_KEY を"
                    "入れ、explore.py でジャンルを決め、取得タスク(run-daily.ps1)を"
                    "タスクスケジューラに登録してください。")
              sys.exit(1)

          if not snaps:
              print("::error::ジャンルは決まっているのに価格履歴が1件もありません。"
                    "手元PCの取得タスク(run-daily.ps1)が登録されていないか、"
                    "一度も成功していない可能性があります。run-daily.log を見てください。")
              sys.exit(1)

          latest = snaps[-1].name.removesuffix(".csv.gz")
          age = (date.today() - datetime.strptime(latest, "%Y-%m-%d").date()).days
          print(f"最新の記録 {latest}（{age}日前） / 通算 {len(snaps)}日分")
          if age > 3:
              print("::error::価格履歴が3日以上更新されていません。"
                    "手元PCの取得タスク(run-daily.ps1)と、楽天アプリの許可IPを確認してください。"
                    "自宅のグローバルIPが変わると 403 で止まります。")
              sys.exit(1)
          PY

      # GitHub は定期ジョブの失敗を通知しないので、Issue を立てて明示的に鳴らす。
      # 既に開いている失敗 Issue があれば、増やさずコメントを足す。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') の price-tracker 監視が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "price-tracker の価格取得が止まっています" --label ci-failure --body "$body"
          fi
