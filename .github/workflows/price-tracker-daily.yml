name: price-tracker daily

# 運用: 取得は手元PC（run-daily.ps1、毎日10:10）が行い data/ を push する。
# 楽天は Backend Service 型で許可IPからのリクエストしか受け付けず、Actions の
# ランナーはIPを固定できないため、CI からは取得しない。
# この CI は push された data/ を検証し、静的サイトを作って Cloudflare Pages に
# 公開する。あわせて取得が止まっていないかを監視する。
on:
  push:
    branches: [master]
    paths:
      - "projects/price-tracker/**"
      - ".github/workflows/price-tracker-daily.yml"
  schedule:
    # 13:00 JST = 04:00 UTC。手元PCの取得（10:10）が済んだ頃に見る。
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/price-tracker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

      # 手元PCの取得タスクが止まっていないかの監視。
      # 記録開始前は「まだ0日」なので、失敗させず警告だけにする。
      # ここで毎日赤くすると、本物の停止に気づけなくなる。
      - name: Check data freshness
        run: |
          python - <<'PY'
          import sys
          from datetime import date, datetime
          from pathlib import Path

          snaps = sorted(Path("data/snapshots").glob("*.csv.gz"))
          if not snaps:
              print("::warning::まだ価格履歴がありません。"
                    "config.json の genres を決め、手元PCの取得タスクを登録してください。")
              sys.exit(0)

          latest = snaps[-1].name.removesuffix(".csv.gz")
          age = (date.today() - datetime.strptime(latest, "%Y-%m-%d").date()).days
          print(f"最新の記録 {latest}（{age}日前） / 通算 {len(snaps)}日分")
          # 毎日走る前提なので、1日空いた時点で異常。3日猶予にしていた間に
          # IP変更で2日分を静かに取り逃した（2026-09-06, 09-07）。価格は
          # 後から取り直せないため、猶予を置く意味がない。
          if age > 1:
              print(f"::error::価格履歴が{age}日前で止まっています。"
                    "手元PCの取得タスク(run-daily.ps1)と、楽天アプリの許可IPを確認してください。"
                    "自宅のグローバルIPが変わると 403 で止まります。")
              sys.exit(1)
          PY

      # 記録済みデータから静的サイトを作る。build.py は通信せず data/ だけを見る。
      - name: Build site
        run: python build.py

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"price-tracker","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/price-tracker
          command: pages deploy dist --project-name=price-tracker --branch=master

      # GitHub は定期ジョブの失敗を通知しないので、Issue を立てて明示的に鳴らす。
      # 既に開いている失敗 Issue があれば、増やさずコメントを足す。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') の price-tracker 監視が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "price-tracker の価格取得が止まっています" --label ci-failure --body "$body"
          fi
