name: price-tracker daily fetch

# このPJTの価値は文章ではなく履歴の蓄積にある（後から買い直せない）。
# 毎日1回 楽天から価格を取得し、data/ に追記して commit する。
on:
  schedule:
    # 10:00 JST = 01:00 UTC。土日も価格は動くので毎日。
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/price-tracker
    # 楽天が応答しないまま既定の6時間走り続けるのを防ぐ。通常は数分。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # 壊れたパーサのまま取得すると、その日の記録が丸ごと無駄になる。
      # 履歴は後から取り直せないので、取得の前に落とす。
      - name: Run tests
        run: pytest

      # 準備が済むまでは「失敗」ではなく「スキップ」にする。
      # 毎日赤くして通知を鳴らすと、本物の異常に気づけなくなるため。
      - name: Check prerequisites
        id: gate
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: |
          ready=true
          if [ -z "$RAKUTEN_APP_ID" ]; then
            echo "::warning::RAKUTEN_APP_ID が未登録です。取得をスキップします。"
            ready=false
          fi
          if ! python -c "import json,sys; sys.exit(0 if json.load(open('config.json',encoding='utf-8')).get('genres') else 1)"; then
            echo "::warning::config.json の genres が空です。explore ワークフローで対象ジャンルを決めてください。"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Fetch prices
        if: steps.gate.outputs.ready == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch.py

      - name: Commit price history if changed
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new price data to commit."
          else
            git commit -m "chore(price-tracker): 価格履歴を記録"
            git push
          fi

      # GitHub は定期ジョブの失敗を通知しないので、Issue を立てて明示的に鳴らす。
      # 既に開いている失敗 Issue があれば、増やさずコメントを足す。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') の price-tracker 取得が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "price-tracker の価格取得が失敗しています" --label ci-failure --body "$body"
          fi
