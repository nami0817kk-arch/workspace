# soccer-career の検証。公開系のワークフローとは分けてある
# （公開設定のミスでテストまで赤くならないように）。
name: soccer-career CI

on:
  push:
    paths:
      - "projects/soccer-career/**"
      - ".github/workflows/soccer-career-ci.yml"
  pull_request:
    paths:
      - "projects/soccer-career/**"
      - ".github/workflows/soccer-career-ci.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "テスト対象を絞る（例: test/game_test.dart）"
        type: string
        default: ""
      skip_analyze:
        description: "analyze を飛ばす"
        type: boolean
        default: false

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/soccer-career
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.skip_analyze != true }}
        run: flutter analyze

      - name: Run tests
        run: flutter test ${{ inputs.target }}
