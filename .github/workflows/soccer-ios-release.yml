# App Store 提出用の iOS リリースビルド。
#
# macOS ランナー上で署名済み IPA を生成するので、手元に Mac がなくても
# App Store に出せる。証明書・プロビジョニングプロファイルはすべて
# GitHub Secrets から復元し、ジョブ終了時にランナーから消す。
# 鍵の作り方 (Mac なしで CSR を作る手順を含む) と Secrets の一覧は
# docs/RELEASE_GUIDE.md を参照。
name: Build Soccer Manager (iOS Release)

on:
  push:
    tags:
      - "soccer-manager-v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号の上書き (空なら pubspec.yaml の +N を使う)。App Store Connect は同じビルド番号を二度受け付けない"
        required: false
        default: ""
      upload_to_testflight:
        description: "ビルド後に TestFlight へアップロードする"
        type: boolean
        required: false
        default: false

# 途中で止めると害がある（公開・リリース・通知）。重複は避けるが打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Apple のツールチェーンは macOS でしか動かないため、ここだけ macOS ランナー。
    # 非公開リポジトリのため macOS ランナーは無料枠の対象外（分単位で消費する）。
    runs-on: macos-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/soccer-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Verify signing secrets are present
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CERT_BASE64" ]     || missing="$missing IOS_DIST_CERT_BASE64"
          [ -n "$CERT_PASSWORD" ]   || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE_BASE64" ]  || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$TEAM_ID" ]         || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です:$missing"
            echo "::error::登録手順は docs/RELEASE_GUIDE.md の「GitHub Secrets の登録」を参照してください。"
            exit 1
          fi

      # 署名と同じ扱いにする。テスト用の広告IDのまま公開すると、広告は出るのに
      # 収益がゼロになる。しかも審査は通ってしまうので、気づくのが遅れる。
      #
      # iOS のアプリIDは Info.plist に直接書いてあり、ビルド時に渡す口が無い。
      # $(VAR) 展開に頼ると、展開に失敗したとき文字列がそのまま残って実機で
      # 広告SDKが落ちる。ここで置換し、置換できたことを確かめる方が確実。
      - name: Verify AdMob production IDs and apply them
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED_IOS }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_IOS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ADMOB_APP_ID" ]   || missing="$missing ADMOB_APP_ID_IOS"
          [ -n "$ADMOB_REWARDED" ] || missing="$missing ADMOB_REWARDED_IOS"
          [ -n "$ADMOB_INTERSTITIAL" ] || missing="$missing ADMOB_INTERSTITIAL_IOS"
          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です:$missing"
            echo "::error::未設定のままだと Google のテスト用IDで公開され、広告収益が発生しません。"
            exit 1
          fi
          case "$ADMOB_APP_ID$ADMOB_REWARDED$ADMOB_INTERSTITIAL" in
            *ca-app-pub-3940256099942544*)
              echo "::error::Google のテスト用IDが登録されています。自分の AdMob のIDに置き換えてください。"
              exit 1 ;;
          esac
          plutil -replace GADApplicationIdentifier -string "$ADMOB_APP_ID" ios/Runner/Info.plist
          # 置換できたことを確かめる。見逃すとテスト用IDのまま出る。
          if grep -q "ca-app-pub-3940256099942544" ios/Runner/Info.plist; then
            echo "::error::Info.plist にテスト用IDが残っています。置換に失敗しました。"
            exit 1
          fi
          echo "Info.plist の GADApplicationIdentifier を本番IDに置き換えました。"

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # ランナー使い捨ての専用キーチェーンを作る。既定の login.keychain は
          # 触らないので、他のジョブや後続ステップに証明書が残らない。
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # これを入れないと codesign のたびに GUI のパスワード入力を求められ、
          # ヘッドレスなランナーではその場でハングする。
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # 検索パスに加えないと xcodebuild から見えない。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "インポートされた署名 ID:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode はプロファイルを UUID 名のファイルとして探すので、
          # 中身の UUID を読み出してその名前で置く。
          PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          # 変数は必ず {} で囲むこと。囲まずに直後へ非ASCII文字(鉤括弧など)を
          # 続けると、macOS ランナーのロケールではそのバイトが識別子の一部と
          # 見なされ、存在しない変数名になって set -u で落ちる(実際に落ちた)。
          echo "プロファイル「${NAME}」(${UUID}) を配置しました"

      - name: Configure manual code signing
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # プロジェクトは CODE_SIGN_STYLE = Automatic だが、Automatic は
          # Xcode に Apple ID でサインインした状態を前提にしていて CI では成立しない。
          # Release ビルドだけ Manual に上書きする。xcconfig への追記なので
          # pbxproj は書き換わらず、この変更はランナー内にしか残らない。
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROVISIONING_PROFILE_NAME
          EOF
          echo "--- Release.xcconfig ---"
          cat ios/Flutter/Release.xcconfig

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Info.plist の CFBundleIdentifier は $(PRODUCT_BUNDLE_IDENTIFIER) という
          # 変数参照なので、実体は pbxproj 側にある。そちらから読む。
          # pbxproj には Runner と RunnerTests の 2 つが並んでいて Runner が先に来るが、
          # 取り違えると署名対象がズレるので念のため確認する。
          BUNDLE_ID=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' ios/Runner.xcodeproj/project.pbxproj \
            | sed 's/PRODUCT_BUNDLE_IDENTIFIER = //; s/;//; s/"//g')
          echo "バンドル ID: $BUNDLE_ID"
          case "$BUNDLE_ID" in
            ""|*.RunnerTests)
              echo "::error::Runner ターゲットのバンドル ID を特定できませんでした (取得値: '$BUNDLE_ID')。"
              exit 1
              ;;
          esac
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - name: Build IPA
        env:
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED_IOS }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_IOS }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            EXTRA="--build-number=${{ github.event.inputs.build_number }}"
          fi
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist $EXTRA \
            --dart-define=ADMOB_REWARDED_IOS="$ADMOB_REWARDED" \
            --dart-define=ADMOB_INTERSTITIAL_IOS="$ADMOB_INTERSTITIAL"
          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_BASE64" ]; then
            echo "::error::TestFlight へのアップロードには APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_KEY_BASE64 が必要です。"
            exit 1
          fi
          # altool は固定の場所に置かれた AuthKey_<KeyID>.p8 を探す。
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Remove signing material from the runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf ~/.appstoreconnect/private_keys
          rm -f ios/ExportOptions.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: soccer-manager-ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
