name: puzzle-book tests

on:
  push:
    branches: ["**"]
    paths:
      - "projects/puzzle-book/**"
      - "libs/puzzle-generator/**"
      - ".github/workflows/puzzle-book-tests.yml"
  pull_request:
    paths:
      - "projects/puzzle-book/**"
      - "libs/puzzle-generator/**"
      - ".github/workflows/puzzle-book-tests.yml"
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/puzzle-book"
      install: "pip install -r requirements.txt pypdf pytest fonttools pymupdf"
