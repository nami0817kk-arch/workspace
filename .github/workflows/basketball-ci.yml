name: basketball-ci

# basketball-career の検証(analyze + test)。テストの合否は CI で判断する。

on:
  push:
    branches:
      - master
      - main
    paths:
      - "projects/basketball-career/**"
      - ".github/workflows/basketball-ci.yml"
  pull_request:
    paths:
      - "projects/basketball-career/**"
      - ".github/workflows/basketball-ci.yml"
  # 手で回すとき用。テストの反復はローカルではなくここで行う方針のため
  # (docs/session-faq.md「テストはクラウドで回す」)、対象を絞れるようにして
  # ある。1ファイルだけ直しては回す、という使い方で全件を待たずに済む。
  workflow_dispatch:
    inputs:
      target:
        description: "回すテスト(例 test/game_test.dart)。空なら全件"
        required: false
        default: ""
      skip_analyze:
        description: "analyze を省く(テストの反復だけしたいとき)"
        type: boolean
        default: false

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/basketball-career
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 静的解析。手で対象を絞って回すときだけ省ける。push/PR では必ず走る。
      - name: Analyze
        if: ${{ inputs.skip_analyze != true }}
        run: flutter analyze

      - name: Run tests
        env:
          # 入力を run の中へ直接展開しない(スクリプト注入を避ける)。
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$TARGET" ]; then
            flutter test
            exit $?
          fi
          # 素直な test/ 配下のパスだけ通す。
          case "$TARGET" in
            test|test/|test/*) ;;
            *)
              echo "::error::target は test/ 配下を指定してください: $TARGET"
              exit 1 ;;
          esac
          case "$TARGET" in
            *[!A-Za-z0-9_/.-]*)
              echo "::error::target に使えない文字が含まれています: $TARGET"
              exit 1 ;;
          esac
          echo "対象を絞って実行: $TARGET"
          flutter test "$TARGET"
