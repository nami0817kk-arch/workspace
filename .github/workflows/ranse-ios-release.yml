# 乱世下剋上の iOS リリースビルド（goso-boat-ios-release.yml を写したもの）。
#
# 広告・課金はまだ入れていないので、AdMob の ID と法務ページの確かめは省いてある。
# 入れるときは goso-boat-ios-release.yml の該当のステップを写し、docs/app-pitfalls.md を先に読む。
#
# 配信用証明書（IOS_DIST_CERT_*）・チームID・App Store Connect API キーは、ほかのアプリと共用。
# このアプリだけのものは、プロビジョニングプロファイル（RANSE_IOS_PROVISIONING_PROFILE_BASE64）だけ。
name: Build 乱世下剋上 (iOS Release)

on:
  # このブランチは master に入っていないので、手動実行だけだと GitHub にワークフローとして見つけてもらえない。
  # タグ ranse-v* を push すると、ビルドして TestFlight へ上げる。
  push:
    tags:
      - "ranse-v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号の上書き (空なら pubspec.yaml の +N を使う)。App Store Connect は同じビルド番号を二度受け付けない"
        required: false
        default: ""
      upload_to_testflight:
        description: "ビルド後に TestFlight へアップロードする"
        type: boolean
        required: false
        default: false

# 途中で止めると害がある（アップロード）。重複は避けるが打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Xcode 27（iOS 27 SDK）の入ったランナー。macos-latest は 2026-11 時点で Xcode 26 までしか無く、
    # ITMS-90725（2027年4月から iOS 27 SDK 以降が必要）の警告が出た。xcode-27 は arm64 の macOS 27 で動く。
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/ranse

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ITMS-90725: 2027年4月から、iOS 27 SDK（Xcode 27）以降でビルドしたものでないと App Store Connect に上げられない。
      # ランナーの既定の Xcode は古いことがある（2026-11-23 は 26.5 だった）ので、入っている中でいちばん新しい
      # 正式版の Xcode（ベータ・RC は除く）を選ぶ。27 以降が無ければ、既定のまま警告を出して続ける。
      - name: Select the newest Xcode
        run: |
          echo "ランナーの Xcode:"
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
          fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo "::warning::iOS SDK が $SDK です。2027年4月からは iOS 27 SDK（Xcode 27）以降でないと App Store Connect に上げられません（ITMS-90725）。"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Verify signing secrets are present
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.RANSE_IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CERT_BASE64" ]     || missing="$missing IOS_DIST_CERT_BASE64"
          [ -n "$CERT_PASSWORD" ]   || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE_BASE64" ]  || missing="$missing RANSE_IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$TEAM_ID" ]         || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です:$missing"
            exit 1
          fi

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # 公開ログに証明書の持ち主の名前を出さない。件数だけ出す
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution" \
            || { echo "::error::署名用の証明書が見つかりません。"; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.RANSE_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          # 変数は必ず {} で囲む（直後の非ASCII文字が識別子の一部と見なされて落ちる）
          echo "プロファイル「${NAME}」(${UUID}) を配置しました"

      - name: Configure manual code signing
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROVISIONING_PROFILE_NAME
          EOF

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_ID=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' ios/Runner.xcodeproj/project.pbxproj \
            | sed 's/PRODUCT_BUNDLE_IDENTIFIER = //; s/;//; s/"//g')
          echo "バンドル ID: $BUNDLE_ID"
          case "$BUNDLE_ID" in
            ""|*.RunnerTests)
              echo "::error::Runner ターゲットのバンドル ID を特定できませんでした (取得値: '$BUNDLE_ID')。"
              exit 1
              ;;
          esac
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      # 広告の本番のID（2026-11-25 に広告と課金を入れた）。Secrets がまだ無いうちは Google のテスト用IDのままビルドする
      # （TestFlight ではテスト広告が出る）。App Store に出す前に RANSE_ADMOB_* の3つを登録すること。
      - name: Use production AdMob IDs if present
        env:
          ADMOB_APP_ID: ${{ secrets.RANSE_ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED: ${{ secrets.RANSE_ADMOB_REWARDED_IOS }}
          ADMOB_INTERSTITIAL: ${{ secrets.RANSE_ADMOB_INTERSTITIAL_IOS }}
        run: |
          set -euo pipefail
          if [ -z "$ADMOB_APP_ID$ADMOB_REWARDED$ADMOB_INTERSTITIAL" ]; then
            echo "::warning::RANSE_ADMOB_* の Secrets が無いので、テスト用の広告IDのままビルドします（App Store には出さないこと）。"
            exit 0
          fi
          [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_REWARDED" ] && [ -n "$ADMOB_INTERSTITIAL" ]             || { echo "::error::RANSE_ADMOB_APP_ID_IOS / _REWARDED_IOS / _INTERSTITIAL_IOS の3つをそろえて登録してください。"; exit 1; }
          case "$ADMOB_APP_ID$ADMOB_REWARDED$ADMOB_INTERSTITIAL" in
            *3940256099942544*) echo "::error::Secrets に Google のテスト用IDが入っています。"; exit 1;;
          esac
          echo "$ADMOB_APP_ID" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$' || { echo "::error::RANSE_ADMOB_APP_ID_IOS がアプリIDの形（ca-app-pub-…~…）ではありません。"; exit 1; }
          for v in "$ADMOB_REWARDED" "$ADMOB_INTERSTITIAL"; do
            echo "$v" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$' || { echo "::error::広告ユニットIDの形（ca-app-pub-…/…）ではありません。"; exit 1; }
          done
          pub() { echo "$1" | sed -E 's/^ca-app-pub-([0-9]{16}).*/\1/'; }
          [ "$(pub "$ADMOB_APP_ID")" = "$(pub "$ADMOB_REWARDED")" ] && [ "$(pub "$ADMOB_APP_ID")" = "$(pub "$ADMOB_INTERSTITIAL")" ]             || { echo "::error::アプリIDと広告ユニットIDの発行元が一致しません。"; exit 1; }
          [ "$ADMOB_REWARDED" != "$ADMOB_INTERSTITIAL" ] || { echo "::error::動画と全画面に同じ広告ユニットIDが入っています。"; exit 1; }
          plutil -replace GADApplicationIdentifier -string "$ADMOB_APP_ID" ios/Runner/Info.plist
          [ "$(plutil -extract GADApplicationIdentifier raw -o - ios/Runner/Info.plist)" = "$ADMOB_APP_ID" ]             || { echo "::error::Info.plist の GADApplicationIdentifier が Secret と一致しません。"; exit 1; }
          {
            echo "ADMOB_DEFINES=--dart-define=ADMOB_REWARDED_IOS=$ADMOB_REWARDED --dart-define=ADMOB_INTERSTITIAL_IOS=$ADMOB_INTERSTITIAL"
          } >> "$GITHUB_ENV"
          echo "本番の広告IDに置き換えました。"

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          EXTRA="${ADMOB_DEFINES:-}"
          if [ -n "$BUILD_NUMBER" ]; then
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::ビルド番号は数字だけで入れてください。"; exit 1; }
            EXTRA="$EXTRA --build-number=$BUILD_NUMBER"
          fi
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist $EXTRA
          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_testflight == 'true' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_BASE64" ]; then
            echo "::error::TestFlight へのアップロードには APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_KEY_BASE64 が必要です。"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Remove signing material from the runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf ~/.appstoreconnect/private_keys
          rm -f ios/ExportOptions.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ranse-ios
          path: projects/ranse/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1
