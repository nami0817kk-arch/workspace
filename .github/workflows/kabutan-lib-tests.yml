name: kabutan-lib tests

on:
  push:
    branches: [master]
    paths: ["libs/kabutan/**", ".github/workflows/kabutan-lib-tests.yml"]
  pull_request:
    paths: ["libs/kabutan/**", ".github/workflows/kabutan-lib-tests.yml"]
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "libs/kabutan"
      install: "pip install -e .[dev]"
