name: stock-investment tests

# projects/stock-investment を触ったときだけ走らせる。
# モノレポなので、無関係な変更でCIが回らないようにパスで絞っている。
on:
  push:
    paths:
      - "projects/stock-investment/**"
      - ".github/workflows/stock-investment-tests.yml"
  pull_request:
    paths:
      - "projects/stock-investment/**"
      - ".github/workflows/stock-investment-tests.yml"
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にする。
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/stock-investment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 本体の requirements.txt は Windows 前提のパッケージを含むため、
      # Linux ランナーでは requirements-test.txt（テスト用の最小セット）を使う。
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest
