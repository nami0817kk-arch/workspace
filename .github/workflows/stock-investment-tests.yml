name: stock-investment tests

# projects/stock-investment を触ったときだけ走らせる。
# モノレポなので、無関係な変更でCIが回らないようにパスで絞っている。
on:
  push:
    paths:
      - "projects/stock-investment/**"
      - ".github/workflows/stock-investment-tests.yml"
  pull_request:
    paths:
      - "projects/stock-investment/**"
      - ".github/workflows/stock-investment-tests.yml"
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にする。
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/stock-investment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 本番と同じ requirements.txt を入れる。Windows 専用のものは
      # requirements.txt 側の環境マーカーで外れる。
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest
