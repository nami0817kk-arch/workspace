# ひかりの七席の「テスト用」Web版を Cloudflare Pages に出す（2026-10-01 ユーザー選択:
# 護送ボートの goso-boat-test と同じ形のテスト用Web版）。
#
# 本番は iOS アプリ。この Web版は試してもらうためだけのもので、
# 検索に出さない（index.html の meta robots・_headers の X-Robots-Tag・robots.txt）、
# 画面に「テスト版」の札を出す、どこからもリンクしない。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（goso-boat-web-test.yml と同じもの）
name: hikari7 テスト用Web版を出す

on:
  push:
    branches: [master]
    paths:
      - "projects/hikari7/**"
      - ".github/workflows/hikari7-web-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hikari7-web-test
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/hikari7
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build web
        run: python tool/build_web_test.py

      - name: 検索に出さない設定と中身が入っているか
        run: |
          grep -q 'noindex' build/web/index.html
          grep -q 'X-Robots-Tag: noindex' build/web/_headers
          grep -q 'Disallow: /' build/web/robots.txt
          grep -q 'テスト版' build/web/index.html
          ! grep -q 'DATAURI' build/web/index.html
          node -e "const s=require('fs').readFileSync('build/web/index.html','utf8');new Function(s.split('<script>')[1].split('</script>')[0]);"

      # 無ければ作る。既にあれば重複エラーが返るだけ。
      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"hikari7-test","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/hikari7
          command: pages deploy build/web --project-name=hikari7-test --branch=master
