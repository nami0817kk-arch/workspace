# ひかりの七席の公開ページ（プライバシーポリシー・サポート・利用規約・app-ads.txt）を
# Cloudflare Pages の hikari7 に出す。App Store の提出とアプリ内のリンクが、この URL を指す。
# 護送ボートの goso-boat-site.yml と同じ形。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: ひかりの七席の公開ページ

on:
  push:
    branches: [master]
    paths:
      - "projects/hikari7/legal/**"
      - "projects/hikari7/site/**"
      - ".github/workflows/hikari7-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hikari7-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/hikari7
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p dist
          cp site/* dist/
          cp legal/*.html dist/
          ls -la dist

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"hikari7","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/hikari7
          command: pages deploy dist --project-name=hikari7 --branch=master

      # アプリの中のリンクは https://hikari7.pages.dev/ を指している。別の名前で作られていたら止める
      - name: Check the public URLs
        run: |
          sleep 20
          for p in privacy.html support.html terms.html app-ads.txt robots.txt; do
            curl -fsSL "https://hikari7.pages.dev/$p" -o /tmp/page || { echo "::error::https://hikari7.pages.dev/$p が開けません"; exit 1; }
          done
          grep -q "ひかりの七席" <(curl -fsSL https://hikari7.pages.dev/privacy.html) || { echo "::error::hikari7.pages.dev がひかりの七席のページではありません"; exit 1; }
          curl -fsSL https://hikari7.pages.dev/app-ads.txt
