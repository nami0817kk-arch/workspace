# 塔の意志（仮題）の CI。projects/tounoishi を触ったときだけ動く。
name: tounoishi CI

on:
  push:
    paths:
      - "projects/tounoishi/**"
      - ".github/workflows/tounoishi-ci.yml"
  pull_request:
    paths:
      - "projects/tounoishi/**"
      - ".github/workflows/tounoishi-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/tounoishi
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
