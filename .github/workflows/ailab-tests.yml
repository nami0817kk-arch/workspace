name: tests

on:
  push:
    branches: ["**"]
    paths:
      - "platform/ai-lab/**"
      - ".github/workflows/ailab-tests.yml"
  pull_request:
    paths:
      - "platform/ai-lab/**"
      - ".github/workflows/ailab-tests.yml"
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にしておく。
permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/ai-lab
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        # ruff を入れて運用しているのは ailab だけなので、範囲を合わせている
        run: python -m ruff check src/ailab tests/ailab

      - name: Run tests
        # ailab の網羅率が下がったら気づけるようにしておく
        run: pytest --cov=ailab --cov-report=term-missing --cov-fail-under=90

  # README が Windows 前提で書かれているので、ailab だけ Windows でも回す。
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ailab tests
        run: pytest tests/ailab

      - name: CLI smoke test
        run: |
          ailab --version
          ailab connectors
