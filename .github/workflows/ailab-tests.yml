name: tests

on:
  push:
    branches: [master]
    paths:
      - "platform/ai-lab/**"
      - ".github/workflows/ailab-tests.yml"
  pull_request:
    paths:
      - "platform/ai-lab/**"
      - ".github/workflows/ailab-tests.yml"
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にしておく。
# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/ai-lab
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        # ruff を入れて運用しているのは imagegen / videogen / docparse。範囲を合わせている
        run: >-
          python -m ruff check
          src/imagegen tests/imagegen
          src/videogen tests/videogen
          src/docparse tests/docparse

      - name: Run tests
        # imagegen の網羅率が下がったら気づけるようにしておく
        run: pytest --cov=imagegen --cov-report=term-missing --cov-fail-under=90

  # README が Windows 前提で書かれているので、imagegen だけ Windows でも回す。
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform/ai-lab
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run imagegen tests
        run: pytest tests/imagegen

      - name: CLI smoke test
        run: |
          imagegen --version
          imagegen connectors
