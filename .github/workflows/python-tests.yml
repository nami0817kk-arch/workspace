# Python プロジェクト共通のテストワークフロー（workflow_call 用）。
#
# ほぼ同一の tests.yml が各リポジトリに複製されていたのを一本化した。
# actions のバージョン更新（checkout / setup-python のバンプ）はこのファイル
# 1箇所で済み、Dependabot の PR が全リポジトリに1本ずつ届く状態を解消する。
# 同一リポジトリ内からの参照なので、リポジトリが private でも使える。
#
# トレードオフ: 参照は @master なので、ここを壊すと利用側のテスト CI が
# 一斉に赤くなる。影響はテスト CI のみで、各リポジトリの公開・デプロイ系
# ワークフローは意図的に自己完結のまま（収益サイトを他リポジトリの変更で
# 巻き込まないため）。
name: python-tests (reusable)

on:
  workflow_call:
    inputs:
      install:
        description: "依存のインストールコマンド"
        type: string
        default: "pip install -r requirements.txt pytest"
      python-version:
        type: string
        default: "3.12"
      workdir:
        description: "テストを実行するディレクトリ（モノレポ内のPJTパス）"
        type: string
        default: "." 
      cache-dependency-path:
        description: >
          pip のキャッシュに使う依存ファイル（例: projects/foo/requirements.txt）。
          **省略時はキャッシュしない**。存在しないパスを渡すと setup-python が
          失敗するため、利用側が明示したときだけ有効にする。
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          # 空文字を渡すとキャッシュ無効。既存の利用側は何も変わらない。
          cache: ${{ inputs.cache-dependency-path != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - run: ${{ inputs.install }}
      - run: pytest
