name: Deploy Soccer Manager (Cloudflare Pages)

# Web版の公開。GitHub Pages から Cloudflare Pages へ移した。
# 理由: このリポジトリは非公開で、Free プランでは Pages サイトを作成できず
# configure-pages が毎回 "Resource not accessible by integration" で失敗して
# いた。Cloudflare Pages は非公開リポジトリのままでも無料で使える。
#
# 連携方式は direct upload。GitHub 連携ではなく、ここでビルドした成果物を
# wrangler で送る。Cloudflare にリポジトリの読み取り権限を渡さずに済む。
#
# テストは ci.yml が同じコミットに対して回すので、ここでは重複させない。

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

env:
  # Cloudflare Pages のプロジェクト名。公開URLは https://<ここ>.pages.dev。
  CF_PAGES_PROJECT: soccer-manager
  # そのプロジェクトの「本番ブランチ」。direct upload では --branch は
  # デプロイに付くラベルでしかなく、ここがプロジェクト設定の本番ブランチと
  # 一致したときだけ https://<project>.pages.dev に反映される。ずれていると
  # プレビュー用の別URLに出てしまい、アプリ内の法務リンクが 404 になる。
  CF_PAGES_PRODUCTION_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Cloudflare Pages はプロジェクトのルートで配信するため base-href は "/"。
      # GitHub Pages 時代の "/soccer-manager/" のままだと資産を一段深い階層から
      # 探しに行き、真っ白な画面になる。
      - name: Build web
        run: flutter build web --release --base-href "/"

      - name: Assemble site
        run: |
          mkdir -p dist/legal
          cp -r build/web/* dist/
          cp legal/*.html dist/legal/
          # 紹介ページ。コミュニティやSNSからのリンク先として、
          # アプリ本体より先に「どんなゲームか」を見せるために置く。
          mkdir -p dist/lp/shots
          cp marketing/landing/index.html dist/lp/
          cp marketing/screenshots/*.png dist/lp/shots/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=${{ env.CF_PAGES_PRODUCTION_BRANCH }}
