name: gemini-api tests

on:
  push:
    branches: ["**"]
    paths: ["projects/gemini-api/**", ".github/workflows/gemini-api-tests.yml"]
  pull_request:
    paths: ["projects/gemini-api/**", ".github/workflows/gemini-api-tests.yml"]
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/gemini-api"
      # 上流はスタブ化してあるので GEMINI_API_KEY なしで通る
      install: "pip install -r requirements-dev.txt"
