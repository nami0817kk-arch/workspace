# つるはし採掘の App Store 提出用 iOS リリースビルド（ひかりの七席の iOS リリースビルドを写したもの）。
#
# サカマネ・護送ボート・ひかりの七席と同じチームなので、配信用証明書（IOS_DIST_CERT_*）・チームID・App Store Connect API キーは共用。
# アプリごとに違うのは、プロビジョニングプロファイルと AdMob のIDだけ（TSURUHASHI_ で始まる Secrets）。
# 広告は報酬型動画だけ（全画面広告は無い）なので、広告ユニットIDは1つ。
# ゲーム本体（prototype/game.html）は、ビルドの前に tool/build_app_web.py でアプリ用に組み立てる（絵と BGM も入る）。
# 鍵の作り方と Secrets の一覧は projects/tsuruhashi/docs/RELEASE.md を参照。
name: Build つるはし採掘 (iOS Release)

on:
  push:
    tags:
      - "tsuruhashi-v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号の上書き (空なら pubspec.yaml の +N を使う)。App Store Connect は同じビルド番号を二度受け付けない"
        required: false
        default: ""
      upload_to_testflight:
        description: "ビルド後に TestFlight へアップロードする"
        type: boolean
        required: false
        default: false

# 途中で止めると害がある（公開・リリース・通知）。重複は避けるが打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Apple のツールチェーンは macOS でしか動かないため、ここだけ macOS ランナー。
    # このリポジトリは 2026-09-08 から public なので、macOS ランナーも無料枠で動く
    # （非公開だった頃は分単位で消費していた。その前提で書かれた注記を訂正）。
    runs-on: macos-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 60
    env:
      # 法務ページ（プライバシーポリシー・サポート）の置き場所。アプリへの埋め込みと公開の確認の両方がここを見る
      LEGAL_BASE_URL: https://tsuruhashi.dailyquarry.com
    defaults:
      run:
        working-directory: projects/tsuruhashi/app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # macOS の Python は pip で入れられないことがあるので、ここで用意する
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ゲーム本体をアプリ用に組み立てる（絵を埋め込んだ1枚と BGM。通信なしで動く）
      - name: Build the game page for the app
        working-directory: projects/tsuruhashi
        run: python3 tool/build_app_web.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Verify signing secrets are present
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.TSURUHASHI_IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CERT_BASE64" ]     || missing="$missing IOS_DIST_CERT_BASE64"
          [ -n "$CERT_PASSWORD" ]   || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE_BASE64" ]  || missing="$missing TSURUHASHI_IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$TEAM_ID" ]         || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です:$missing"
            echo "::error::登録手順は projects/tsuruhashi/docs/RELEASE.md を参照してください。"
            exit 1
          fi

      # 署名と同じ扱いにする。テスト用の広告IDのまま公開すると、広告は出るのに
      # 収益がゼロになる。しかも審査は通ってしまうので、気づくのが遅れる。
      #
      # iOS のアプリIDは Info.plist に直接書いてあり、ビルド時に渡す口が無い。
      # $(VAR) 展開に頼ると、展開に失敗したとき文字列がそのまま残って実機で
      # 広告SDKが落ちる。ここで置換し、置換できたことを確かめる方が確実。
      - name: Verify AdMob production IDs and apply them
        env:
          ADMOB_APP_ID: ${{ secrets.TSURUHASHI_ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED: ${{ secrets.TSURUHASHI_ADMOB_REWARDED_IOS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ADMOB_APP_ID" ]   || missing="$missing TSURUHASHI_ADMOB_APP_ID_IOS"
          [ -n "$ADMOB_REWARDED" ] || missing="$missing TSURUHASHI_ADMOB_REWARDED_IOS"
          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です:$missing"
            echo "::error::未設定のままだと Google のテスト用IDで公開され、広告収益が発生しません。"
            exit 1
          fi
          case "$ADMOB_APP_ID$ADMOB_REWARDED" in
            *ca-app-pub-3940256099942544*)
              echo "::error::Google のテスト用IDが登録されています。自分の AdMob のIDに置き換えてください。"
              exit 1 ;;
          esac
          # アプリIDは「~」、広告ユニットIDは「/」で区切る。取り違えると広告が1本も出ない
          echo "$ADMOB_APP_ID" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$' \
            || { echo "::error::TSURUHASHI_ADMOB_APP_ID_IOS がアプリIDの形（ca-app-pub-…~…）ではありません。"; exit 1; }
          echo "$ADMOB_REWARDED" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$' \
            || { echo "::error::TSURUHASHI_ADMOB_REWARDED_IOS が広告ユニットIDの形（ca-app-pub-…/…）ではありません。"; exit 1; }
          pub() { echo "$1" | sed -E 's/^ca-app-pub-([0-9]{16}).*/\1/'; }
          [ "$(pub "$ADMOB_APP_ID")" = "$(pub "$ADMOB_REWARDED")" ] \
            || { echo "::error::アプリIDと広告ユニットIDが別の AdMob アカウントのものです。"; exit 1; }
          plutil -replace GADApplicationIdentifier -string "$ADMOB_APP_ID" ios/Runner/Info.plist
          # 置換できたことを確かめる。見逃すとテスト用IDのまま出る。
          if grep -q "ca-app-pub-3940256099942544" ios/Runner/Info.plist; then
            echo "::error::Info.plist にテスト用IDが残っています。置換に失敗しました。"
            exit 1
          fi
          [ "$(plutil -extract GADApplicationIdentifier raw -o - ios/Runner/Info.plist)" = "$ADMOB_APP_ID" ] \
            || { echo "::error::Info.plist の GADApplicationIdentifier が Secret と一致しません。"; exit 1; }
          echo "Info.plist の GADApplicationIdentifier を本番IDに置き換えました。"
          # 設定のリンク先（プライバシーポリシー・サポート）が開けて、中身が本物か（404 や別のページのまま出すと審査で却下される）。
          # ページは master に入れたときに tsuruhashi-site.yml が公開する。公開前はここで止まる
          for page in privacy support; do
            body=$(curl -fsSL "$LEGAL_BASE_URL/$page.html") \
              || { echo "::error::$LEGAL_BASE_URL/$page.html が開けません。法務ページを公開してから出してください。"; exit 1; }
            grep -q "つるはし採掘" <<<"$body" \
              || { echo "::error::$LEGAL_BASE_URL/$page.html の中身がつるはし採掘のページではありません。"; exit 1; }
          done

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # ランナー使い捨ての専用キーチェーンを作る。既定の login.keychain は
          # 触らないので、他のジョブや後続ステップに証明書が残らない。
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # これを入れないと codesign のたびに GUI のパスワード入力を求められ、
          # ヘッドレスなランナーではその場でハングする。
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # 検索パスに加えないと xcodebuild から見えない。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "インポートされた署名 ID:"
          # 公開ログに証明書の持ち主の名前を出さない。件数だけ出す
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution" \
            || { echo "::error::署名用の証明書が見つかりません。"; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.TSURUHASHI_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode はプロファイルを UUID 名のファイルとして探すので、
          # 中身の UUID を読み出してその名前で置く。
          PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          # 変数は必ず {} で囲むこと。囲まずに直後へ非ASCII文字(鉤括弧など)を
          # 続けると、macOS ランナーのロケールではそのバイトが識別子の一部と
          # 見なされ、存在しない変数名になって set -u で落ちる(実際に落ちた)。
          echo "プロファイル「${NAME}」(${UUID}) を配置しました"

      - name: Configure manual code signing
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # プロジェクトは CODE_SIGN_STYLE = Automatic だが、Automatic は
          # Xcode に Apple ID でサインインした状態を前提にしていて CI では成立しない。
          # Release ビルドだけ Manual に上書きする。xcconfig への追記なので
          # pbxproj は書き換わらず、この変更はランナー内にしか残らない。
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROVISIONING_PROFILE_NAME
          EOF
          echo "--- Release.xcconfig ---"
          cat ios/Flutter/Release.xcconfig

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Info.plist の CFBundleIdentifier は $(PRODUCT_BUNDLE_IDENTIFIER) という
          # 変数参照なので、実体は pbxproj 側にある。そちらから読む。
          # pbxproj には Runner と RunnerTests の 2 つが並んでいて Runner が先に来るが、
          # 取り違えると署名対象がズレるので念のため確認する。
          BUNDLE_ID=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' ios/Runner.xcodeproj/project.pbxproj \
            | sed 's/PRODUCT_BUNDLE_IDENTIFIER = //; s/;//; s/"//g')
          echo "バンドル ID: $BUNDLE_ID"
          case "$BUNDLE_ID" in
            ""|*.RunnerTests)
              echo "::error::Runner ターゲットのバンドル ID を特定できませんでした (取得値: '$BUNDLE_ID')。"
              exit 1
              ;;
          esac
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - name: Build IPA
        env:
          ADMOB_REWARDED: ${{ secrets.TSURUHASHI_ADMOB_REWARDED_IOS }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "$BUILD_NUMBER" ]; then
            # 入力欄の値をそのままシェルに埋め込まない。数字だけ受け付ける
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::ビルド番号は数字だけで入れてください。"; exit 1; }
            EXTRA="--build-number=$BUILD_NUMBER"
          fi
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist $EXTRA \
            --dart-define=ADMOB_REWARDED_IOS="$ADMOB_REWARDED"
          ls -la build/ios/ipa/
          # 成果物を開いて中身を見る（docs/app-pitfalls.md「直したはず」で終わらせない）。日本語の言語欄・ゲーム本体・BGM・本番の AdMob ID
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q build/ios/ipa/*.ipa -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/Runner.app"
          ls -d "$APP/ja.lproj" || { echo "::error::IPA に ja.lproj が無い（ストアの言語が英語だけになる）。"; exit 1; }
          ls -la "$APP/Frameworks/App.framework/flutter_assets/assets/web/index.html" "$APP/Frameworks/App.framework/flutter_assets/assets/audio/bgm/"
          [ "$(plutil -extract GADApplicationIdentifier raw -o - "$APP/Info.plist")" != "ca-app-pub-3940256099942544~1458002511" ] \
            || { echo "::error::IPA の AdMob アプリIDがテスト用のまま。"; exit 1; }

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_BASE64" ]; then
            echo "::error::TestFlight へのアップロードには APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_KEY_BASE64 が必要です。"
            exit 1
          fi
          # altool は固定の場所に置かれた AuthKey_<KeyID>.p8 を探す。
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Remove signing material from the runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf ~/.appstoreconnect/private_keys
          rm -f ios/ExportOptions.plist

      # upload-artifact は defaults.run.working-directory に従わない。
      # パスはリポジトリのルートから書く必要がある。
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsuruhashi-ios
          path: projects/tsuruhashi/app/build/ios/ipa/*.ipa
          if-no-files-found: error
          # public リポジトリの成果物は誰でも取れるので、置いておく期間を短くする
          retention-days: 1
