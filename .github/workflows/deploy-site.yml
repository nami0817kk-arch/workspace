name: deploy-site

on:
  push:
    branches: ["main", "master"]
    paths:
      - "site/**"
      - "src/adsite/**"
      - "src/moneyloop/pricing.py"
      - "config/site.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 公開前チェック。説明文の欠落など、後から直すと順位に響くものをここで止める。
      - name: Check
        env:
          PYTHONPATH: src
        run: python -m adsite.cli check || echo "警告あり（ビルドは継続します）"

      - name: Build
        env:
          PYTHONPATH: src
        run: python -m adsite.cli build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
