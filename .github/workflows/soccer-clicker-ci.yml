name: soccer-clicker CI

# 検証のみ。公開(デプロイ)を足すときは soccer-pages.yml に倣って別ファイルにする
# （公開設定のミスでテストまで赤くなると、壊れているのがどちらか分からなくなる）。

on:
  push:
    branches: ["**"]
    paths:
      - "projects/soccer-clicker/**"
      - ".github/workflows/soccer-clicker-ci.yml"
  pull_request:
    paths:
      - "projects/soccer-clicker/**"
      - ".github/workflows/soccer-clicker-ci.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "回すテスト(例 test/engine_test.dart)。空なら全件"
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/soccer-clicker
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        env:
          # 入力を run に直接展開しない(スクリプト注入を避ける)。
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$TARGET" ]; then
            flutter test
            exit $?
          fi
          case "$TARGET" in
            test|test/|test/*) ;;
            *)
              echo "::error::target は test/ 配下を指定してください: $TARGET"
              exit 1
              ;;
          esac
          flutter test "$TARGET"
