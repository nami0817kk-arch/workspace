# Web版を Cloudflare Pages に公開する（soccer-pages.yml と同じ方針）。
# リポジトリは private のまま公開できる。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# トークンは「アカウント / Cloudflare Pages / 編集」の権限が要る。
# 画像生成(Workers AI)用のトークンでは Pages API が 403 になる（docs/session-faq.md）。
#
# 検証(analyze + test)は soccer-career-ci.yml が同じコミットに対して回すので、
# ここでは重複させない。公開設定のミスでテストまで赤くならないよう分けてある。
name: soccer-career Web版を公開する

on:
  push:
    branches: [master]
    paths:
      - "projects/soccer-career/**"
      - ".github/workflows/soccer-career-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soccer-career-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/soccer-career
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Cloudflare Pages はプロジェクトのルートで配信するため base-href は "/"。
      #
      # **管理画面は入れない。** 2026-09-10 に実機で確認するため一時的に
      # `--dart-define=SOCCER_ADMIN=true` を付けていたが、収益化を入れた
      # 2026-09-26 に外した（公開サイトを開いた誰でも右上の ⋮ → 管理 から
      # 能力もお金も書き換えられる状態だった）。
      # 入っていないことは `python tool/check_release.py` で確かめる。
      - name: Build web
        run: flutter build web --release --base-href "/"

      # 管理画面が公開ビルドに混ざっていないか。**テストでは見えない**
      # （`kAdmin` は const なので、入るかどうかはビルド時に決まる）。
      - name: Check release build
        working-directory: projects/soccer-career
        run: python3 tool/check_release.py

      # 無ければ作る。既にあれば重複エラーが返るだけで、後続には影響しない。
      # production_branch を master に固定するのが要点。デプロイ時の --branch と
      # ずれると本番ではなくプレビュー用の別URLに出てしまう。
      # 法務ページ。**アプリから開く先なので、本番と同じ所に無いと404になる。**
      # `flutter build web` は build/web を作り直すので、ビルドの後に足す。
      # （web/ に置いてある app-ads.txt はビルドがそのまま運ぶ。）
      - name: Add legal pages
        working-directory: projects/soccer-career
        run: |
          mkdir -p build/web/legal
          cp legal/*.html build/web/legal/

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"soccer-career","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/soccer-career
          command: pages deploy build/web --project-name=soccer-career --branch=master
