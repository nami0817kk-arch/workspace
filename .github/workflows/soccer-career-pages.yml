# Web版を Cloudflare Pages に公開する（soccer-pages.yml と同じ方針）。
# リポジトリは private のまま公開できる。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# トークンは「アカウント / Cloudflare Pages / 編集」の権限が要る。
# 画像生成(Workers AI)用のトークンでは Pages API が 403 になる（docs/session-faq.md）。
#
# 検証(analyze + test)は soccer-career-ci.yml が同じコミットに対して回すので、
# ここでは重複させない。公開設定のミスでテストまで赤くならないよう分けてある。
name: soccer-career Web版を公開する

on:
  push:
    branches: [master]
    paths:
      - "projects/soccer-career/**"
      - ".github/workflows/soccer-career-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soccer-career-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/soccer-career
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Cloudflare Pages はプロジェクトのルートで配信するため base-href は "/"。
      #
      # SOCCER_ADMIN=true の間は、公開サイトにも管理画面（右上の ⋮ → 管理）が入る。
      # **公開サイトを開いた誰でも触れる**ので、本来は入れない前提の機能。
      # 2026-09-10 にユーザーの指示で一時的に有効化した（実機で確認するため）。
      # **戻すときはこの1行から `--dart-define` を消すだけ**。
      # 入っているかどうかは `python tool/check_release.py` で確かめられる
      # （有効な間は「入っています」と出るのが正しい）。
      - name: Build web
        run: flutter build web --release --base-href "/" --dart-define=SOCCER_ADMIN=true

      # 無ければ作る。既にあれば重複エラーが返るだけで、後続には影響しない。
      # production_branch を master に固定するのが要点。デプロイ時の --branch と
      # ずれると本番ではなくプレビュー用の別URLに出てしまう。
      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"soccer-career","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/soccer-career
          command: pages deploy build/web --project-name=soccer-career --branch=master
