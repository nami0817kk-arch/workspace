name: tabi tests

on:
  push:
    branches: ["**"]
    paths: ["projects/tabi-kion/**", ".github/workflows/tabi-tests.yml", ".github/workflows/python-tests.yml"]
  pull_request:
    paths: ["projects/tabi-kion/**", ".github/workflows/tabi-tests.yml", ".github/workflows/python-tests.yml"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/tabi-kion"
      cache-dependency-path: "projects/tabi-kion/requirements.txt"
