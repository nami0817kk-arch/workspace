name: working-holiday deploy

# 外部データの取得が無い静的サイト。push のたびにビルドし直して公開する。
# 各国の条件（data/countries/）は公式ページで確かめて手で push する（projects/working-holiday/CLAUDE.md）。
on:
  push:
    branches: [master]
    paths:
      - "projects/working-holiday/src/**"
      - "projects/working-holiday/templates/**"
      - "projects/working-holiday/static/**"
      - "projects/working-holiday/data/**"
      - "projects/working-holiday/requirements.txt"
      - ".github/workflows/working-holiday-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/working-holiday
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

      - name: Build site
        run: python src/render.py

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"working-holiday","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/working-holiday
          command: pages deploy output --project-name=working-holiday --branch=master

      - name: Notify search engines (IndexNow)
        # Bing・Yandex・Naver などに sitemap の URL を知らせる。失敗しても公開は止めない（スクリプト側で握る）
        # 毎日の作り直しでは送らない（中身が変わっていない URL を毎日送ると送りすぎになる）
        if: github.event_name != 'schedule'
        run: python tools/indexnow.py

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') のビルド・公開が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --search "working-holiday" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "working-holiday の公開が失敗しています" --label ci-failure --body "$body"
          fi
