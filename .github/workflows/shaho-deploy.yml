name: shaho deploy

# 外部データの取得が無い静的サイトなので、kabu-daily.yml と違って日次の取得ジョブは無い。
# push のたびにビルドし直して公開する。判定ロジックは eligibility.SCHEDULE（法定の日程）が
# 正で、日々の再取得は不要（「今日」はビルド時刻を埋め込まずクライアント側で解決している。
# 詳しくは projects/shaho-tekiyo/CLAUDE.md）。保険料率（data/）は年1回、手で取り込んで push する。
on:
  push:
    branches: [master]
    paths:
      - "projects/shaho-tekiyo/src/**"
      - "projects/shaho-tekiyo/templates/**"
      - "projects/shaho-tekiyo/static/**"
      - "projects/shaho-tekiyo/data/**"
      - "projects/shaho-tekiyo/requirements.txt"
      - ".github/workflows/shaho-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/shaho-tekiyo
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

      - name: Build site
        run: python src/render.py

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"shaho-tekiyo","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/shaho-tekiyo
          command: pages deploy output --project-name=shaho-tekiyo --branch=master

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') のビルド・公開が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --search "shaho-tekiyo" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "shaho-tekiyo の公開が失敗しています" --label ci-failure --body "$body"
          fi
