# 護送ボートの「テスト用」Web版（Cloudflare Pages の goso-boat-test）を閉じる。
# 2026-10-01 ユーザー指示「web版は閉じて良いよ」。iOS 版を公開したので、全面が開いたテスト版は役目を終えた。
#
# 手で1回だけ回す（自動では走らない）。プロジェクトごと消すので、URL は開けなくなる。
# 済んだらこのファイルも消す。Web版を出していた頃の中身は git の履歴にある。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: goso-boat テスト用Web版を閉じる

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/goso-boat-test
      AUTH: "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
    steps:
      - name: Delete the Pages project goso-boat-test
        run: |
          set -u
          try_delete() {
            curl -s -X DELETE "$API" -H "$AUTH" | python3 -c "import sys,json;d=json.load(sys.stdin);print('success' if d.get('success') else d.get('errors'))"
          }
          r=$(try_delete); echo "1回目: $r"
          if [ "$r" != "success" ]; then
            # デプロイが多いとプロジェクトごと消せないので、先にデプロイを消す
            for page in 1 2 3 4 5; do
              ids=$(curl -s "$API/deployments?per_page=25&page=$page" -H "$AUTH" | python3 -c "import sys,json;print(' '.join(x['id'] for x in json.load(sys.stdin).get('result') or []))")
              [ -z "$ids" ] && break
              for id in $ids; do curl -s -o /dev/null -X DELETE "$API/deployments/$id?force=true" -H "$AUTH"; done
            done
            r=$(try_delete); echo "2回目: $r"
            [ "$r" = "success" ] || { echo "::error::goso-boat-test を消せませんでした"; exit 1; }
          fi

      - name: Check the site is gone
        run: |
          sleep 30
          code=$(curl -s -o /dev/null -w "%{http_code}" https://goso-boat-test.pages.dev/ || true)
          echo "goso-boat-test.pages.dev: $code"
