name: kabu closed page

# kabu-agari-ranking は 2026-10-07 に終了した（ユーザー判断）。
# 取得（手元PCのタスク kabu-daily-fetch）は無効化し、定期の鮮度監視も外した。
# kabu.dailyquarry.com には終了の案内だけを置く。旧URLは 404.html（同じ案内）で返し、
# 検索エンジンから順に外れるようにする。広告のスクリプトと ads.txt は置かない。
on:
  push:
    branches: [master]
    paths:
      - "projects/kabu-agari-ranking/closed/**"
      - ".github/workflows/kabu-daily.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy closed page to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/kabu-agari-ranking
          command: pages deploy closed --project-name=kabu-agari-ranking --branch=master
