name: Daily Gainers Site

# 運用: 取得は手元PC（run-daily.ps1、毎平日16:10）が行い data/ を push する。
# kabutan が GitHub Actions の IP を 405 でブロックしているため、CI からは取得しない。
# この CI は push された data/ からのビルド・X投稿・公開と、鮮度の監視だけを行う。
on:
  push:
    branches: [master]
    paths:
      - "projects/kabu-agari-ranking/data/**"
      - "projects/kabu-agari-ranking/src/**"
      - "libs/kabutan/**"
      - ".github/workflows/kabu-daily.yml"
  schedule:
    # 17:00 JST = 08:00 UTC、平日のみ。手元PCの取得が止まっていないかの監視役。
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/kabu-agari-ranking
    # 取得先が応答しないまま既定の6時間走り続けるのを防ぐ。
    # 通常は数分で終わる。超えたら失敗として通知が飛ぶ。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ../../libs/kabutan -r requirements.txt pytest

      # 壊れたパーサのまま取得・デプロイまで進むと、空のランキングで
      # サイトを上書きしてしまう。その前に落とす。
      - name: Run tests
        run: pytest

      - name: Build site (data/ から。取得はしない)
        run: python src/build_site.py --no-fetch

      # 手元PCの取得タスクが止まっていないかの監視。
      # 失敗そのものは run-daily.ps1 がデスクトップ通知で知らせる。ここが拾うのは
      # 「PCが起動していない」「タスクが実行されなかった」など、手元で通知すら
      # 出ない止まり方。1営業日ぶん遅れたら鳴らす（2026-09-06 に4日→1営業日）。
      #
      # 祝日は考慮していない。休場日を挟むと1回だけ空振りするが、祝日表を
      # 抱えて誤って「鳴らさない」より、空振りする側に倒す。空振りかどうかは
      # 下のメッセージで判断できるようにしてある。
      - name: Check data freshness
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          d = json.load(open("data/latest.json", encoding="utf-8"))
          rec = datetime.strptime(d["rec_date"], "%Y-%m-%d").date()
          # 相場の日付なので JST で数える
          today = datetime.now(timezone(timedelta(hours=9))).date()

          business_days = 0
          cur = rec
          while cur < today:
              cur += timedelta(days=1)
              if cur.weekday() < 5:
                  business_days += 1

          print(f"latest rec_date={rec} / today={today} / 営業日で{business_days}日ぶん遅れ")
          if business_days > 1:
              print(
                  f"::error::ランキングデータが{business_days}営業日ぶん古いままです"
                  f"（最新 {rec}）。手元PCの取得タスク run-daily.ps1 が動いたか、"
                  "同ディレクトリの run-daily.log を確認してください。"
                  "この間に東証の休場日があったなら空振りです。"
              )
              sys.exit(1)
          PY

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"kabu-agari-ranking","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/kabu-agari-ranking
          command: pages deploy output --project-name=kabu-agari-ranking --branch=master

      # GitHub は定期ジョブの失敗を通知しないので、Issue を立てて明示的に鳴らす。
      # 既に開いている失敗 Issue があれば、増やさずコメントを足す。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') の実行が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "日次ランキングの取得・公開が失敗しています" --label ci-failure --body "$body"
          fi
