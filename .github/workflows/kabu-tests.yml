name: kabu tests

on:
  push:
    branches: [master]
    paths: ["projects/kabu-agari-ranking/**", "libs/kabutan/**", ".github/workflows/kabu-tests.yml", ".github/workflows/python-tests.yml"]
  pull_request:
    paths: ["projects/kabu-agari-ranking/**", "libs/kabutan/**", ".github/workflows/kabu-tests.yml", ".github/workflows/python-tests.yml"]
  workflow_dispatch: {}

# 同じブランチで新しい実行が始まったら、古い方は打ち切る。
# 連続で push したとき、途中の版のテストに時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: ./.github/workflows/python-tests.yml
    with:
      workdir: "projects/kabu-agari-ranking"
      install: "pip install -e ../../libs/kabutan -r requirements.txt pytest"
