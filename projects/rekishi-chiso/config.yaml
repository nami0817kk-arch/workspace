# 歴史の地層 — 制作の設定
#
# 注意（10-08）：ここの値を1つでも変えると、本編・ショートの前景のコマが全部描き直しになる
# （コマの控えの名前に設定全体のハッシュが入るため。コメントだけの変更は描き直しにならない）。
# 点検の目安の数字（背景40秒など）はここではなく chiso/check.py の頭。
#
# 素材（立ち絵・絵画）はリポジトリに入れない。立ち絵は規約で再配布が禁止されていて、
# workspace は public なので。置き場は assets_dir（環境変数 CHISO_ASSETS で上書きできる）。
assets_dir: ../../../output/rekishi-chiso/assets

voicevox_url: http://127.0.0.1:50021

# 掛け合いの2人。key は台本の話者名。
cast:
  語り:
    name: 剣崎雌雄            # クレジットに出す名前（VOICEVOX:剣崎雌雄）
    style_id: 21
    speed: 1.08
    pitch: 0.0
    # 10-04「男性側は、抑揚はかなり控えめ」：素の抑揚に戻し、調子の効きを3割、上限1.15に
    intonation: 1.0
    tone_strength: 0.3
    max_intonation: 1.15
    max_speed: 1.1
    # 10-05「剣崎が色文字の時におかしな話かたになる」：《》の強調（高さ・伸ばし・音量）を3割に。聞き比べで「控えめ」
    emphasis: 0.3
    volume: 1.0
    image: characters/kenzaki_helmet.png
    faces: characters/kenzaki_faces   # 口パク（chiso/jaw.py で口を開けた絵を描き足す）
    side: left
    bust: 0.40                # 立ち絵の上から何割を見せるか
    height: 1250              # 立ち絵全体を何pxに縮めてから切るか
  聞き:
    name: 春日部つむぎ
    style_id: 8
    speed: 1.0
    pitch: 0.0
    # 10-04「女の子の声がおかしい」「かなり抑えて」：抑揚が上限に張りつき早口でキンキンしていた。
    # 基本を素の値に戻し、調子の効きを4割に、抑揚と速さに上限を置く
    intonation: 1.0
    tone_strength: 0.4
    max_intonation: 1.3
    max_speed: 1.08
    volume: 1.0
    image: characters/tsumugi_helmet.png
    faces: characters/tsumugi_faces   # 表情・口パク・まばたき（chiso/faces.py で作る）
    side: right
    bust: 0.40
    height: 1150

