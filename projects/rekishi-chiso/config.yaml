fonts:
  serif: C:/Windows/Fonts/NotoSerifJP-VF.ttf
  gothic: C:/Windows/Fonts/YuGothB.ttc

video:
  bg_workers: 5      # 背景を同時に作る本数（止まった背景は絵1枚ずつ・溶け合いのコマ）。10 だと空きメモリ5GB台で ffmpeg が落ちた（10-05）
  width: 1920
  height: 1080
  fps: 30
  bg_motion: false   # 背景の絵をゆっくり寄せたり流したりしない（10-06 ユーザー「背景を微妙に動かさないで」）

short:
  width: 1080
  height: 1920
  max_seconds: 60
  # 10-08：新しく作るショートは、頭の約2秒に問い（shorts.sN.hook か title）を上半分に特大で出して縮め、
  # 最後は「続きは本編で」を2秒にして、頭と同じ画を1秒置く（最後のコマ＝最初のコマでループがつながる）。
  # 切るときは hook_intro: false / loop: false（書かなければ入。ここに書くと描き方の控えが変わり作り直しになる）
  # 10-08 夕：台本に hook・tease を書いたショートは、hook をつむぎの声でも読み（hook_say: false で声だけ切る）、
