# 歴史の地層だけの読みの一覧（共通の一覧 libs/yomi/src/yomi/data/base.yaml に足す。形は同じ）。
# chiso/reading.py が読み、check の「読み：」に使う。足すときは scripts/ の全部に流して、正しく読めている所で
# 止めないことを確かめる（tests/test_reading.py の RULE_HITS）。2026-10-10 に作った。

# 歴史の題材で読みが割れる字（10/12〜13 の4本で「斉＝ヒトシ」「都へ＝ト」「坑＝アナ」など）
ambiguous:
  斉: [セイ, ヒトシ]
  都: [ミヤコ, ト, ツ]
  明: [ミン, メイ, アカ, アキラ]
  坑: [コウ, アナ]
  后: [キサキ, コウ]
  漢: [カン, オトコ]
  宴: [ウタゲ, エン]
  錦: [ニシキ, キン]

rules:
  # 「都へ向けて」をトエと読んだ（秀吉の回）。「首都」「京都」は1語なので当たらない
  - name: 都＋助詞
    surface: [都]
    want: [ミヤコ]
    when: {+1: {pos1: 助詞}}

# 歴史の語で、辞書（UniDic）と違っても誤りではない読み（10-10 に過去の回の kana で確かめた）。[] はどう読んでも知らせない
