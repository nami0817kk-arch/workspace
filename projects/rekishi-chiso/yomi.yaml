  女官: [ニョカン]
  有為: [ユウイ]
  内々: [ウチウチ]
  小刀: [コガタナ]
  近衛兵: [コノエヘイ]
  守り役: [モリヤク]
  名香: [メイコウ]
  太政: [ダジョウ]
  嫁: [トツ]
  御方: [オカタ]
  高次: [タカツグ]
  高次の: [タカツグノ]
  荒野: [アラノ]
  匕首: [ヒシュ]
  万世: [バンセイ]
  退き: [ノキ]
  高台寺: [コウタイジ]
  火薬づくり: [カヤクヅクリ]
