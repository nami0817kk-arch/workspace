sections:
  # ================================================================ 序章。答えの席：なぜ祟る神と恐れられたのか
  - title: 学問の神様は、なぜ祟り神と恐れられたのか
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 930
    lines:
      # fact: michizane-14
      - 語り: 学問の神様、菅原道真。けれど、死んだあとの道真が、最初に恐れられたのは、都に祟る、怨霊としてでした。
      # fact: michizane-16
      - 語り: 930年の夏。都の内裏の、清涼殿に、雷が落ちます。
        tone: 重い
      # fact: michizane-16
      - 語り: 天皇のすぐそばで、大納言の藤原清貫と、右中弁の平希世が、雷に焼かれて、命を落としました。
        tone: 重い
      # fact: michizane-09, michizane-01
      - 語り: その27年前、道真は、都から遠い大宰府で、罪人として死んでいます。右大臣から突然流されて、わずか2年あまりでした。
      # fact: michizane-12, michizane-14
      - 語り: 道真が死んだあと、都では、道真を流した側の人々や、その血を引く皇子が、次々に亡くなっていきます。
      # fact: michizane-14
      - 語り: 皇太子が21歳で亡くなったとき、『日本紀略』は、世の人々が、道真の霊の恨みだと言った、と書きました。
        tone: 重い
      # fact: michizane-15
      - 語り: そして朝廷は、道真を流した、あの詔書を、捨てさせます。
        tone: 重い
      - 語り: 学問の神様は、なぜ、祟る神と恐れられたのか。流された道真は、大宰府の荒れた屋敷で、都を恨む言葉を、書き残したのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 左遷
  - title: 901年正月、右大臣の左遷　宇多法皇は門の前に座り込んだ
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 901
    lines:
      # fact: michizane-01, michizane-06
      - 語り: 昌泰4年、901年の正月25日。右大臣の菅原道真は、突然、大宰権帥に落とされます。九州の大宰府の、長官に当たる職です。けれど、政務には一切関わらせない、名ばかりの職でした。
        card: {head: "昌泰4年（901）正月25日", body: "右大臣から大宰権帥へ"}
      # fact: michizane-12
      - 語り: 学者の家に生まれ、右大臣まで上った道真。左大臣は、藤原時平。道真より、26歳も若い、藤原基経の跡継ぎでした。
      - 語り: 時の天皇は、醍醐天皇。道真を取り立ててきた、宇多法皇の子です。
      # fact: michizane-02
      - 語り: 『政事要略』に残る、左遷の宣命、つまり天皇の言い渡しの文は、道真の罪を、こう挙げます。
      # fact: michizane-02
      - 語り: 低い家から、にわかに大臣に取り立てられたのに、身のほどを知らず、権力をほしいままにする心があった。
        tone: 重い
      # fact: michizane-02
      - 語り: そして、宇多法皇の御心を欺き、醍醐天皇を廃して、別の皇子を立てようとした。その皇子、斉世親王の妃は、道真の娘でした。
        card: {head: "左遷の宣命", body: "天皇を廃して別の皇子を立てようとした"}
      # fact: michizane-03
      - 語り: 宇多法皇は、知らせを聞いて、内裏へ駆けつけました。
      # fact: michizane-03
      - 語り: 『扶桑略記』によれば、法皇は、門の前の陣に、草の敷物を敷いて座り、一日じゅう、そこにいました。けれど、中へは入れてもらえません。
        tone: 重い
      # fact: michizane-30
      - 語り: 警固の者たちは、腰かけから下りもしなかった。日が暮れて、法皇は、御所へ帰っていきました。
        tone: しみじみ
      # fact: michizane-03
      - 語り: ところが、『日本紀略』では、法皇が陣に来たのは、5日後の30日。しかも、夜通し、帰らなかった、と書かれています。
      - 語り: 同じ場面が、記録によって、日付も、待った長さも、違うのです。
        figure: {type: table, title: 宇多法皇は内裏の門の前で待った　記録の違い, cols: [日付, 待った長さ], rows: [[『扶桑略記』, 左遷の当日 正月25日, 一日じゅう 日暮れに帰る], [『日本紀略』, 5日後の30日, 夜通し帰らない]], upto: 2}
      # fact: michizane-39, michizane-04
      - 語り: 『北野天神縁起』によれば、道真の子は、男と女で23人。そのうち男の子4人が、ばらばらの国へ流されました。長男の高視は、土佐へ。
        figure: null
      # fact: michizane-28
      - 語り: 2日後に朝廷が出した命令の文書は、道中の国々に、こう命じています。山城でも、摂津でも、道真に、食べ物も、馬も、与えてはならない。
        tone: 重い
        card: {head: "太政官符 正月27日", body: "道中の国は食べ物も馬も出すな"}
      # fact: michizane-29
      - 語り: 送っていった役人、藤原真興は、摂津の国まで来たところで、馬を下り、道真の前で、涙を流した、と『扶桑略記』は書きます。
        tone: しみじみ
      # fact: michizane-05
      - 語り: 都を出る前、道真が庭の梅に詠んだ、とされる歌があります。東風吹かば、匂ひおこせよ、梅の花。あるじなしとて、春を忘るな。
      # fact: michizane-05
      - 語り: 『拾遺和歌集』でも、『大鏡』の本文でも、結びは、春を忘るな。よく知られた、春な忘れそ、は、『大鏡』の一部の写本に見える形です。
      - 語り: 大宰府に着いた、もとの右大臣は、そこで、どんな日々を送ったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 大宰府の2年
  - title: 大宰府の南館　門を出ずに過ごした2年
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 901
    lines:
      # fact: michizane-06
      - 語り: 道真が住んだのは、大宰府の役所の南にあった、南館と呼ばれる、荒れた屋敷です。いまの榎社のあたり、とされます。
      # fact: michizane-06
      - 語り: 朝廷の命令は、道真を、大宰府の政務に、あずからせない、と定めていました。することは、何もありません。
      # fact: michizane-07
      - 語り: 道真が大宰府で作った詩は、のちに『菅家後集』と呼ばれる詩集に、残っています。その中の、門を出でず、という詩です。
      # fact: michizane-07
      - 語り: 都府楼は、わずかに、瓦の色を看る。観音寺は、ただ、鐘の声を聴く。
        tone: しみじみ
        card: {head: "『菅家後集』門を出でず", body: "都府楼は瓦の色を看る　観音寺は鐘の声を聴く"}
      # fact: michizane-07
      - 語り: 都府楼は、大宰府の役所の建物。観音寺は、すぐ近くの寺。いまの観世音寺です。どちらも、道真は、門の外へ出て見に行かない。屋根の瓦を眺め、鐘の音を聞くだけでした。
      # fact: michizane-56
      - 語り: その鐘は、7世紀の終わりに作られた国宝として、いまも観世音寺に残っています。道真が聞いた鐘、とされるものです。
      # fact: michizane-08
      - 語り: 大宰府に来て、半年あまり。9月10日の夜、道真は、1年前の今夜を、思い出します。
      # fact: michizane-08
      - 語り: 去年の今夜は、清涼殿で、天皇のそばにいた。そのとき賜った御衣は、いまも、ここにある。毎日、捧げ持って、残り香を拝んでいる。
        tone: しみじみ
        card: {head: "『菅家後集』九月十日", body: "恩賜の御衣は今ここにあり"}
      # fact: michizane-08
      - 語り: 自分を流した天皇の、恩を拝む詩。この詩に、都を恨む言葉はありません。
      - 語り: 道真が思い出した、その清涼殿に、29年後、雷が落ちることになります。
        tone: 重い
      # fact: michizane-41
      - 語り: 都の家には、姉たちが残り、兄たちの多くは、流されました。大宰府へ連れて来られたのは、幼い男の子と、女の子だけでした。
      # fact: michizane-41
      - 語り: 道真は、その2人を慰める詩も、残しています。
        tone: しみじみ
      # fact: michizane-55
      - 語り: いまも榎社の近くには、その男の子、隈麿の墓と伝わる場所があります。
      # fact: michizane-55
      - 語り: 榎社には、もう1つ、伝わる話があります。浄妙尼という老女が、梅の枝に餅を刺して、貧しい道真に差し入れた。
      # fact: michizane-53
      - 語り: 『菅家後集』を調べた、熊本大学に出された論文では、延喜2年の詩に、仏の教えの言葉が、急に増えていく、と指摘されています。
      - 語り: そして、903年の2月。大宰府に、梅の咲くころが、もう一度めぐってきます。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 死
  - title: 903年2月25日、59歳の死　動かなくなった車
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 903
    lines:
      # fact: michizane-09
      - 語り: 延喜3年、903年の2月25日。菅原道真は、大宰府で亡くなります。数えで59歳。西暦では、3月26日のことでした。
        tone: しみじみ
        card: {head: "延喜3年（903）2月25日", body: "大宰府で死去　数え59歳"}
      # fact: michizane-01, michizane-09
      - 語り: 都を追われてから、2年と1か月あまり。道真が、都へ戻ることは、ありませんでした。
        tone: しみじみ
      # fact: michizane-11
      - 語り: 『菅家後集』の後書きによれば、道真は、死を前に、大宰府の詩を1巻にまとめ、封をして、都の紀長谷雄に送りました。
      # fact: michizane-11
      - 語り: 長谷雄は、それを見て、天を仰ぎ、嘆いた。
        tone: 重い
      # fact: michizane-10
      - 語り: 遺骸は、三笠郡の、四堂のあたりに、葬られるはずでした。
      # fact: michizane-10
      - 語り: ところが、『北野天神縁起』によれば、運ぶ車が、途中で止まり、動かなくなった。そこで、その場所に葬った。
        tone: 重い
      # fact: michizane-10
      - 語り: よく知られた話では、車を引く牛が、座り込んで動かなかった、とされます。けれど、この場面の本文に、牛は、出てきません。
        figure: {type: table, title: 葬る途中で止まったのは　記録の違い, cols: [止まったもの, 書き方], rows: [[『北野天神縁起』, 車, 止まって動かなかった], [『歴代編年集成』, 車, 途中で止まって動かなかった], [よく知られた話, 牛, 座り込んで動かなかった]], upto: 3}
      # fact: michizane-10
      - 語り: 牛が横たわる姿は、のちの縁起の絵巻に、描かれているものです。
      # fact: michizane-10
      - 語り: その墓の上に建ったのが、安楽寺。いまの、太宰府天満宮です。
        figure: null
      # fact: michizane-09
      - 語り: このとき、道真は、まだ神ではありません。大宰権帥のまま、罪を負って死んだ人でした。
        tone: しみじみ
      # fact: michizane-04
      - 語り: 土佐へ流された長男の高視は、延喜6年の冬、都へ呼び戻され、もとの官に戻された、と『北野天神御伝』は書きます。道真の死から、3年後です。
      # fact: michizane-12
      - 語り: そして、道真の死から6年後。都で、道真を流した側の、いちばん上にいた男が、亡くなります。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 都で続いた死
  - title: 909年、時平39歳の死から　源光、そして2人の皇太子
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 909
    lines:
      # fact: michizane-12
      - 語り: 延喜9年、909年の4月4日。左大臣、藤原時平が亡くなります。39歳でした。
        tone: 重い
        card: {head: "延喜9年（909）4月4日", body: "藤原時平が死去　39歳"}
      # fact: michizane-13
      - 語り: その4年後、延喜13年。道真と入れ替わりに右大臣となった源光が、狩りの最中に、馬で、泥の中へ駆け込みました。
        tone: 重い
      # fact: michizane-31
      - 語り: 『日本紀略』は、その遺骸は、見つからなかった、と書いています。
        tone: 重い
      # fact: michizane-14
      - 語り: そして、延喜23年、923年の3月21日。醍醐天皇の皇太子、保明親王が、21歳で亡くなります。母は、時平の妹でした。
        card: {head: "延喜23年（923）3月21日", body: "保明親王が死去　21歳"}
      # fact: michizane-14
      - 語り: 『日本紀略』は、こう記しました。天下の人々は、泣き悲しみ、その声は、雷のようだった。世を挙げて言った。菅帥の霊魂の、恨みのしわざだ。
        tone: 重い
      - 語り: 菅帥とは、大宰権帥だった、道真のことです。死の理由として、道真の名が、記録に書かれたのです。
      # fact: michizane-15
      - 語り: 1か月後の4月20日。醍醐天皇は、詔を出します。道真を、もとの右大臣に戻し、位を1つ上げて、正二位を贈る。
        card: {head: "延喜23年（923）4月20日", body: "右大臣に戻し、正二位を贈る"}
      # fact: michizane-15
      - 語り: そして、901年に道真を流した、あの言い渡しの文書を、捨てさせました。
        tone: 重い
      - 語り: 流されてから22年。死んでから、20年後のことです。流した天皇が、自分で、その罪を取り消したのです。
      # fact: michizane-32
      - 語り: けれど、死は止まりません。次に皇太子となったのは、保明親王の子で、わずか3歳の慶頼王。母は、時平の娘でした。
      # fact: michizane-32
      - 語り: その慶頼王も、延長3年、925年の6月に、5歳で亡くなります。
        tone: 重い
      # fact: michizane-14, michizane-32
      - 語り: 2代続けて亡くなった皇太子は、時平の甥と、時平の孫でした。そして5年後、今度は、天皇の住まいそのものが、襲われます。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 清涼殿の雷
  - title: 930年6月26日、清涼殿の雷　醍醐天皇の最期
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 930
    lines:
      # fact: michizane-16, michizane-42
      - 語り: 延長8年、930年の6月26日。午後3時ごろ、都の空に、雷が鳴りはじめます。
      # fact: michizane-16
      - 語り: 『日本紀略』によれば、雷は、清涼殿の、南西の柱の上に落ち、火が出ました。
        tone: 重い
        card: {head: "延長8年（930）6月26日", body: "清涼殿の南西の柱に雷"}
      # fact: michizane-16
      - 語り: 殿上にいた、大納言の藤原清貫は、衣を焼かれて、亡くなりました。64歳でした。
        tone: 重い
      # fact: michizane-16
      - 語り: 右中弁の平希世も、顔を焼かれて倒れ、命を落としました。
      # fact: michizane-34
      - 語り: となりの紫宸殿でも、美努忠包が、髪を焼かれて、亡くなっています。
      # fact: michizane-33
      - 語り: その場で、無事だったのが、左大臣の藤原忠平。時平の弟です。忠平は、のちに、子の師輔に、この日のことを語っています。
      # fact: michizane-33
      - 語り: 周りの者は、色を失った。わたしは、心の中で、仏に帰依していたので、少しも恐れなかった。清貫と希世は、ふだん、仏法を敬わなかった。
      - 語り: 助かった左大臣が語った、自分なりの理由です。この言葉に、道真の名は、出てきません。
      # fact: michizane-17
      - 語り: 『日本紀略』は、この日から、醍醐天皇が、病に伏した、と書いています。
        tone: 重い
      # fact: michizane-17
      - 語り: 9月22日。醍醐天皇は、皇太子に、位を譲ります。このとき、46歳。
      # fact: michizane-35
      - 語り: その7日後の、9月29日。醍醐上皇は、内裏ではなく、右近衛府で、亡くなりました。死の直前に、出家していました。
        tone: しみじみ
        card: {head: "延長8年（930）9月29日", body: "醍醐上皇が死去　46歳"}
      - 語り: 清涼殿の落雷から、およそ3か月。道真を流した天皇も、世を去りました。
        tone: しみじみ
      # fact: michizane-18
      - 語り: そして11年後。地獄で、醍醐天皇に会った、という1人の僧の話が、都に現れます。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 冥途記と託宣
  - title: 941年、地獄の醍醐天皇　僧が会った「太政威徳天」と北野の託宣
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 941
    lines:
      # fact: michizane-18
      - 語り: 天慶4年、941年。山で修行していた僧、道賢が、息が絶え、よみがえって語った話が、『扶桑略記』に引かれています。『道賢上人冥途記』です。
      # fact: michizane-18
      - 語り: 道賢は、ある宮殿で、1人の神に会います。神は、名乗りました。わたしは、そなたの国の、昔の大臣だ。天上では、日本太政威徳天と呼ばれている。
        tone: 重い
        card: {head: "『道賢上人冥途記』941年", body: "昔の大臣＝日本太政威徳天"}
      # fact: michizane-18
      - 語り: 道賢は、地獄も見ます。そこには、衣を着た1人と、裸の3人が、苦しみを受けていました。
        tone: 重い
      # fact: michizane-18
      - 語り: 衣を着た1人は、延喜の帝王。醍醐天皇でした。君も臣も、ともに苦しんでいた、と冥途記は書きます。
        tone: 重い
      # fact: michizane-36
      - 語り: 地獄の醍醐天皇は、自分の罪を、数え上げます。父の法皇に、けわしい道を歩かせ、心を苦しめた。自分は高い殿にいて、父を、地べたに座らせた。
      # fact: michizane-36
      - 語り: そして、罪の無い、賢い臣を、誤って流した。
        tone: 重い
        card: {head: "冥途記の醍醐天皇", body: "罪の無い、賢い臣を誤って流した"}
      - 語り: 40年前、内裏の門の前で、草の上に座り込んだ宇多法皇。あの場面を思わせる罪が、地獄の天皇の口から、語られています。
        tone: しみじみ
      # fact: michizane-19
      - 語り: その翌年、天慶5年、942年の7月12日。都の右京七条に住む女に、神が乗り移った、と北野の縁起は伝えます。
      # fact: michizane-19
      - 語り: 道真の霊は、女の口を借りて、こう告げた、と縁起は書きます。昔、遊んだ、北野の右近の馬場に、わたしを祀れ。
        tone: 重い
      # fact: michizane-20
      - 語り: 5年後の947年。今度は、近江の比良の宮の、禰宜、良種の子で、7歳の太郎丸に、託宣が下ります。
      # fact: michizane-38
      - 語り: 『天満宮託宣記』の託宣で、道真の霊は、こう語っています。雷神も、鬼も、みな、わたしの従者となった。その数は、合わせて、十万五千。
        tone: 重い
        card: {head: "『天満宮託宣記』947年", body: "従う雷神と鬼は十万五千"}
      # fact: michizane-20, michizane-38
      - 語り: この年、北野に、社殿が建てられます。一夜のうちに、松が、何千本も、生えた、という話も、『菅家御伝記』に残っています。
      # fact: michizane-20
      - 語り: これが、いまの北野天満宮のはじまりです。道真の死から、44年後でした。
      - 語り: 雷と鬼を従える、恐ろしい神。その神は、そのあと、どうなったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 学問の神様へ
  - title: 993年、太政大臣を贈られた道真　青い紙に現れた詩
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    year: 986
    lines:
      # fact: michizane-48
      - 語り: 寛和2年、986年。出家した文人、慶滋保胤は、北野に捧げた願文で、天神を、文道の祖、詩境の主、と書いています。
        card: {head: "慶滋保胤の願文 986年", body: "文道の祖　詩境の主"}
      - 語り: 雷と鬼を従える神は、死から83年で、もう、詩と学問の祖としても、拝まれはじめていたのです。
      # fact: michizane-27, michizane-48
      - 語り: 北野天満宮は、江戸時代、寺子屋が広まると、天神さまが、学問の神様として広く信仰されるようになった、と紹介しています。詩と文の神としては平安から、子どもの学びの神としては江戸から、ということです。
        figure: {type: table, title: 学問の神様はいつからか, cols: [時代, 書き方], rows: [[慶滋保胤の願文, 986年 平安, 文道の祖 詩境の主], [北野天満宮の紹介, 江戸時代, 寺子屋が広まり学問の神に]], upto: 2}
      # fact: michizane-26
      - 語り: 永延元年、987年。一条天皇の朝廷は、初めて、北野の祭りを行います。
        figure: null
      # fact: michizane-26, michizane-47
      - 語り: 北野天満宮の由緒によれば、このとき、北野天満大自在天神、という神の名が贈られました。
      # fact: michizane-21
      - 語り: そして、正暦4年、993年。朝廷は、道真に、左大臣、正一位を贈ります。
        card: {head: "正暦4年（993）", body: "左大臣 正一位を贈る"}
      # fact: michizane-37
      - 語り: 大宰府の報告によれば、勅使が安楽寺で宣命を読むと、廟の前の机に、青い紙に書かれた詩が、現れました。
      # fact: michizane-37
      - 語り: 詩の結びは、こうです。ただ恥じるのは、生きても、死んでも、左遷の名が残ること。
        tone: しみじみ
      # fact: michizane-21
      - 語り: その年のうちに、朝廷は、道真に、太政大臣も贈りました。
        card: {head: "正暦4年（993）", body: "太政大臣を贈る"}
      - 語り: 流されて、92年。罪人の名は、ここで、太政大臣の名に変わりました。
        tone: しみじみ
        pause: 0.8
      - 語り: 最後に、はじめの問いに戻ります。学問の神様は、なぜ、祟る神と恐れられたのか。
        tone: 疑問
        hook: true

  - title: まとめ：菅原道真は、なぜ祟り神と恐れられたのか
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所"}
    lines:
      # fact: michizane-01, michizane-09
      - 語り: 901年の正月、道真は、罪人として、大宰府へ流されることになりました。そして2年あまりののち、数え59歳で、その地で亡くなります。
        tone: しみじみ
      # fact: michizane-08
      - 語り: 大宰府で書いた、九月十日の詩に、都を恨む言葉はありません。天皇から賜った衣を、毎日拝んでいました。
        tone: しみじみ
      # fact: michizane-12, michizane-14, michizane-32, michizane-16
      - 語り: 死が続いたのは、道真を流した醍醐天皇と、時平の一族のまわりでした。時平が亡くなり、2代の皇太子も亡くなり、清涼殿には、雷が落ちました。
        tone: しみじみ
      # fact: michizane-15
      - 語り: 朝廷は、道真を右大臣に戻し、左遷の言い渡しを、捨てさせました。
        tone: しみじみ
      # fact: michizane-36
      - 語り: そして、地獄を見たという僧の話は、醍醐天皇の口から、罪の無い、賢い臣を誤って流した、と語らせました。
        tone: しみじみ
        pause: 0.8
      - 語り: 祟りを生んだのは、道真の恨みの言葉ではなく、罪の無い人を流したのではないか、という、残された側の恐れだった、と読めます。
        tone: しみじみ
        pause: 0.8
      # fact: michizane-48, michizane-27
      - 語り: 恐れられた神は、やがて、詩と学問の祖として拝まれ、江戸の寺子屋で、子どもたちの神様になっていきました。
        tone: しみじみ
      # fact: michizane-44, michizane-46
      - 語り: 太宰府天満宮の本殿は、2026年の5月、124年ぶりの大きな修理を終えました。来年、2027年には、道真の1125年の祭りが、北野天満宮でも、太宰府天満宮でも行われます。
        tone: しみじみ
      - 語り: 門の外へ出ずに、都を思っていた詩人は、いま、毎年、多くの人が願いをかけに訪ねてくる、学問の神様です。
        tone: しみじみ
        pause: 0.8
      - 語り: 道真を、祟る神にしたのは、誰だったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
