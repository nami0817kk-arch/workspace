# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。菅原道真の最期（903年・延喜3年2月25日）と、死後に祟る神・天神となるまで。2026-11-26 作成。公開の予定は 11/30 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「学問の神様は、なぜ祟り神と恐れられたのか」。答えの席＝道真自身は恨みの言葉を残していない（九月十日の詩は恩を拝む）。
#   死が続いたのは、道真を流した醍醐天皇と時平の一族のまわり。朝廷は自分で左遷を取り消し（詔書を棄てさせる。日本紀略「宜棄」）、冥途記は地獄の醍醐天皇に「罪の無い、賢い臣を誤って流した」と言わせた。
#   祟りを生んだのは、残された側の「罪の無い人を流した」という恐れ、と読める（まとめで「読めます」と言う。言い切らない）。題名で答えを言わない。
# 共通の決まり5つ：①題名は問いで、答え（なぜ）を明かさない ②主語は道真1人、最後まで道真 ③誰でも知る「学問の神様」を入口に、祟り神へ裏返し、今（2026年の本殿の修理・2027年の1125年祭）へ届かせる
#   ④道真の最期はこのチャンネルで初めて（posted.json に無い） ⑤数字は「右大臣から流されて2年あまりで死」「死から20年で詔書を焼く」。
# 冒頭（10秒以内）＝誰でも知る一点「学問の神様」→ 最初は都に祟る怨霊として恐れられた（michizane-14）。
#   注意：930年の落雷を、同時代の記録が道真と結びつけたとは言わない（カードに無い）。雷の神の姿は冥途記（941）・託宣（947）から。
# 記録の食い違い（3つ）：①宇多法皇が陣で待った日と長さ（扶桑略記＝正月25日・終日・晩に帰る／日本紀略＝30日・夜通し。michizane-03・30）
#   ②葬地で止まったのは「車」（北野天神縁起・歴代編年集成）／よく知られた「牛が座り込んだ」は本文に無い（絵巻の絵にあるとされる。michizane-10）
#   ③学問の神になった時期（北野天満宮＝江戸の寺子屋から／986年の慶滋保胤の願文はすでに「文道の祖」。michizane-27・48）
#   （小）東風吹かば：拾遺和歌集と大鏡の本文は「春を忘るな」、「春な忘れそ」は大鏡の一部の写本の形（michizane-05）。
# 伝説の扱い：飛梅・天拝山・薩摩の生存の伝え・刺客の話は使わない。浄妙尼の餅・隈麿の墓は「伝わる話」と言ってから。
# 計算（自分で計算し直した。国立天文台 暦日DB。西暦はユリウス暦。グレゴリオ暦に直すと903年3月31日になるので「今の暦」とは言わず「西暦では」と言う）：
#   生 承和12年6月25日＝845年8月1日 → 死 延喜3年2月25日＝903年3月26日。数え 903−845+1＝59（公卿補任・大鏡の59と合う）。満57。
#   左遷 昌泰4年正月25日＝901年2月16日 → 死まで 2年と1か月あまり。官符は正月27日＝左遷の2日後。
#   時平 延喜9年4月4日、39歳（扶桑略記・大鏡）→ 生まれ 871 → 道真（845）より26歳若い。道真の死から 6年後。高視の召還 延喜6年＝906年＝死から3年後。
#   源光 延喜13年（913）＝時平の死の4年後。保明親王 延喜23年3月21日、21歳＝道真の死から20年後。保明は903年生まれ（流したことに関わっていない）。母 穏子＝時平の妹 → 保明は時平の甥。
#   本官に戻す詔 延喜23年4月20日（改元前なので延喜23年と言う）＝保明の死の約1か月後。左遷から22年。
#   慶頼王 延喜23年に皇太子、3歳（日本紀略・立坊次第。扶桑略記だけ2歳）→ 延長3年（925）6月、5歳で死去。慶頼の母は時平の娘 → 時平の孫。
#   清涼殿の落雷 延長8年6月26日（930年7月24日）＝道真の死から27年後。九月十日の詩（901年）から29年後。清貫・希世とも「震死」（大日本史料の綱文）。
#   醍醐の譲位 9月22日・崩御 9月29日＝7日後、46歳（扶桑略記）。日本紀略「自是天皇不豫」。落雷から崩御まで およそ3か月。
#   道賢上人冥途記 天慶4年＝941年＝901年の陣の場面から40年後。多治比文子の託宣 天慶5年＝942年。北野に社殿 947年＝死から44年後。
#   保胤の願文 寛和2年7月20日＝986年（本朝文粋「賽菅丞相廟願文」、大日本史料 第2編之1）＝死から83年後。北野の祭り 永延元年（987）。贈太政大臣 正暦4年（993）＝左遷から92年後。
#   北野天満宮の1125年の半萬燈祭 2027年（903+1124。公開日 2026-11-30 から見て「来年」）。
# 事実は事実カード（dev/output/rekishi-chiso/research/菅原道真_facts_20261126.yaml）にあるものだけ。行の上に `# fact: michizane-xx`。
#   使わないこと：飛梅・天拝山（初出が確かめられない）／隈麿の死（墓と伝わる場所だけ言う）／安楽寺の最初の社殿の年（905／919で割れる）／
#   三善清行の辞職の勧め（本文未見）／時平の耳から青竜（浄蔵伝）／薩摩の伝え・刺客の話（論文の本文未見）／正暦4年の贈位の月日（5月20日〜6月26日で割れる）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
