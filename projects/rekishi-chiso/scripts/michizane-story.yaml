# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  学問の神様、菅原道真。けれど、死んだあとの道真が、最初に恐れられたのは、都に祟る怨霊としてでした。
  右大臣から大宰府へ流され、2年あまりで死んだ道真。そのあと都では、道真を流した醍醐天皇と藤原時平の一族のまわりで死が続き、内裏の清涼殿には雷が落ちます。朝廷は、道真を流した詔書を捨てさせました。
  大宰府の荒れた屋敷での2年、59歳の死、都で続いた死と雷、地獄を見た僧の話と北野の託宣、そして学問の神様へ。当時の記録で並べました。
  この動画でわかること
  ・左遷の日、宇多法皇は内裏の門の前で何をしたのか（記録ごとに日付が違う）
  ・大宰府の道真は、都を恨む言葉を残したのか
  ・葬る途中で止まったのは「牛」だったのか
  ・皇太子の死と清涼殿の雷のあと、朝廷は何をしたのか
  ・祟る神は、いつ、学問の神様になったのか
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  当時の記録は、『日本紀略』『扶桑略記』（『道賢上人冥途記』を含む）『政事要略』『公卿補任』『大鏡』『拾遺和歌集』『菅家後集』（『群書類従』）『北野天神縁起』『歴代編年集成』『天満宮託宣記』『九条殿遺誡』『本朝文粋』、大宰府解（正暦4年）によります（『大日本史料』第1編・第2編・『国史大系』ほか、国立国会図書館デジタルコレクション）。
  研究と紹介は、熊本大学に出された『菅家後集』の研究の論文、太宰府天満宮・北野天満宮の由緒、観光庁の多言語解説、共同通信（2026年5月）によります。
  年齢は数え年。日付は当時の暦で、西暦の年を添えています（延喜3年2月25日は、西暦（ユリウス暦）で903年3月26日）。年数の差は、記録の年から計算し直したものです。記録によって日付や書き方が違うところは、記録ごとに並べました。飛梅などの伝説は扱っていません。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Sugawara no Michizane: Why Was the God of Learning First Feared as a Vengeful Spirit?"
  description: |-
    Sugawara no Michizane is worshipped today as the god of learning. Yet after his death, he was first feared as a vengeful spirit haunting the capital.
    Exiled from the post of Minister of the Right to Dazaifu, he died there two years later. In the capital, deaths followed one after another around Emperor Daigo and the family of Fujiwara no Tokihira, who had exiled him, and lightning struck the Seiryoden in the imperial palace. The court ordered the edict that had banished him to be discarded.
    From his two years at Dazaifu and his death at 59, to the deaths and the lightning in Kyoto, a monk's vision of hell, the oracles at Kitano and his road to becoming the god of learning, we follow the records of the time.
    In this video you will learn:
    - What Retired Emperor Uda did at the palace gate on the day of the exile (records differ on the date)
    - Did Michizane leave words of resentment at Dazaifu?
    - Was it really an ox that stopped on the way to his grave?
    - What the court did after the crown prince's death and the lightning at the Seiryoden
    - When the feared god became the god of learning
    Dates in the video follow the old Japanese calendar. Records differ on dates and wording. Legends such as the flying plum tree are not covered. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Why Was the God of Learning Feared?"
    - "901: The Minister of the Right Is Banished"
    - "Two Years at Dazaifu Without Leaving the Gate"
    - "903: Death at 59, and the Cart That Would Not Move"
    - "Tokihira at 39, Minamoto no Hikaru, and Two Crown Princes"
    - "930: Lightning Strikes the Seiryoden"
    - "941: Emperor Daigo in Hell, and the Oracles at Kitano"
    - "993: Minister of State, and the Poem on Blue Paper"
    - "Summary: Why Was Michizane Feared?"

