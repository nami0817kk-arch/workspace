# 日本語の概要欄の頭（いまの describe は読まない。describe に足す仕様は報告に書いた）
description_head: |-
  1583年4月、最期の夜を迎える北ノ庄城に、ひとりの女がいました。織田信長の妹、お市の方です。
  十年前、夫の城が落ちたとき、お市は娘たちと城を出ています。今度は、城を出るよう勧められても、断りました。
  なぜお市は、二度目は逃げなかったのか。
  この動画でわかること
  ・1573年 小谷城の落城で、お市と三人の娘に何が起きたか
  ・1583年 北ノ庄城の最後の夜と、お市の辞世
  ・「逃げなかった理由」を書き留めた記録と、後から作られた話の見分け方
  ・三人の娘のその後と、徳川家光・明正天皇へ続く血筋
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（『渓心院文』『柴田合戦記』『信長公記』など）を語りで示してから読んでいます。

en:
  title: "Oichi: Why She Did Not Flee the Second Time"
  description: |-
    April 1583, Kitanosho Castle, on its last night. Inside was a woman: Oichi, sister of Oda Nobunaga. Ten years earlier, when her husband's castle fell, she left with her daughters. This time, urged to leave, she refused.
    Why did Oichi not flee the second time?
    In this video you will learn:
    - What happened to Oichi and her three daughters at the fall of Odani Castle in 1573
    - The last night of Kitanosho Castle and Oichi's farewell poem
    - The record that kept her reason, and which famous stories were added later
    - Her daughters' lives, and the line that reached the shogun Tokugawa Iemitsu and Empress Meisho
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Did Oichi Not Flee the Second Time? Kitanosho, 1583"
    - "c. 1567: A Bride for an Alliance at Odani Castle"
    - "1573: The Fall of Odani. Her Husband Stayed, She Left"
    - "1582: From Honno-ji to Kiyosu, and a Second Marriage"
    - "April 1583: The Last Night of Kitanosho Castle"
    - "Why She Did Not Flee: Reading the Records"
    - "Three Daughters on Opposite Sides: Chacha, Hatsu and Go"
    - "Where Did Her Blood Go? Iemitsu, Kazuko and Empress Meisho"

