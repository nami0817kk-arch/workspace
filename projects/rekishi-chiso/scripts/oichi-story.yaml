# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml を写した）。お市の方。2026-10-24 初稿。投稿日は未定。
# 型（ユーザーと決めた）：1本に1つの「なぜ」＝「なぜお市は、二度目の落城で逃げなかったのか」を、再現ドラマ（場面を語りで描き、台詞も入れる）で掘る。
#   最後の章で「その後」（娘たち・徳川将軍家・天皇家）まで語り、冒頭の場面に戻って閉じる。語り手は剣崎1人（つむぎは出ない）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（10-24 ユーザー決定。check は story: true で見分ける）。
# 冒頭は research/opening_benchmark_1024.md の手順：場面（0〜10秒）→ずれ（十年前は逃げた）→「なぜ」1文→答えのかけら（小谷城）→約束の1文→橋渡し（およそ16年前）。
# 通説の検証は第5章だけ（小豆袋・取り合いの話・柴田合戦記の書き手・生存説）。
#
# 事実の土台は scripts/oichi.yaml と dev/output/rekishi-chiso/research/oichi_facts.md（出典の略記 [W市][黒田109393] などはそこと同じ）。
#   足した事実（今回確かめたもの）は、その行のコメントに出典を書いた。主なもの：
#   - 徳川家光：1604年生まれ（慶長9年7月17日）、母は崇源院（江）、1623年（元和9年）に3代将軍 ― Wikipedia「徳川家光」（2026-10-24 閲覧）
#   - 徳川和子：1607年生まれ、秀忠と江の娘、1620年（元和6年6月18日）に後水尾天皇のもとへ入内、のちに中宮（寛永元年11月28日）、東福門院 ― Wikipedia「徳川和子」
#   - 明正天皇：父 後水尾天皇・母 和子、寛永6年（1629）に数え7歳で位につく（践祚）、奈良時代の称徳天皇以来の女性の天皇、子女なし
#       ― コトバンク「明正天皇」（日本大百科全書・日本人名大辞典+Plus・世界大百科事典・山川 日本史小辞典）、Wikipedia「明正天皇」（「859年ぶり」）
#   - 家綱・綱吉が家光の子 ― oichi_facts.md 5章 [W江]
#
# 台詞の決まり（ユーザー決定 10-24）：記録の言葉＋想像の台詞。
#   記録＝出どころを語りで言ってから `- 人物:`（who: お市・勝家）。現代語にした所は語りで「今の言葉にすると」と言う。
#   想像＝ (1)記録と食い違わない (2)新しい事実を足さない（気持ち・決意の言葉だけ） (3)1本8か所まで（この台本は7か所） (4)画面に「想像」と分かる札 (5)人を貶めない。
#   想像の行の書き方（この台本で決めたキー）：
#     - 人物: 「…」
#       who: お市想像            # roles の「〇〇想像」＝字幕の名札が「お市の方（想像）」になる（IF と同じ仕組み）
#       imagined: true           # 想像の台詞の印。字幕の上に小さく「想像」の札が出る（メモ欄には積まない。10-24）
#   各台詞のコメントに【記録】／【想像】と、食い違わない記録を書いた。
#
# 絵：paintings/ の既存の絵で仮置き（素材の置き場にあるものだけ）。AI の絵は out/story/oichi3/gem/ の名前、足りない場面は「AI絵：<英語の指示>」をコメントに。
# 広告の配慮（oichi.yaml と同じ）：万福丸は「命を奪われました」まで。最期は「生涯を閉じた」「最期を迎えた」。薄濃は使わない。
