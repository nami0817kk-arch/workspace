      - 語り: 将軍の娘が、天皇の后になる。和子は、のちに東福門院と呼ばれ、1678年まで生きました。子どもは、2人の男の子と、5人の女の子です。
      # 明正天皇：寛永6年（1629）数え7歳で位につく、称徳天皇以来の女性の天皇、子女なし ― コトバンク・Wikipedia「明正天皇」
