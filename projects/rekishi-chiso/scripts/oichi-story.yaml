        card: {head: "次女・初", body: 1633年、64歳で亡くなる}
      # コトバンク「明正天皇」：1643年に弟の後光明天皇に譲位。子女なし
      - 語り: 明正天皇は、1643年に、弟の後光明天皇に位をゆずりました。明正天皇には、子がありませんでした。天皇の位を通じた、この線は、ここで終わります。
        background: {image: paintings/oichi_hidetada.jpg, credit: "《徳川秀忠像》江戸時代"}
      # 完子→九条家→貞明皇后（[八幡]、留保つき）
      - 語り: 一方で、江が2度目の夫とのあいだに産んだ娘、完子は、公家の九条家に嫁ぎました。その家系から、のちに大正天皇の皇后が出ています。たどりきれるか心もとない、と断る研究者もいる線です。
        background: {image: paintings/oichi_go_sugenin.jpg, credit: "《崇源院（江）像》17世紀"}
