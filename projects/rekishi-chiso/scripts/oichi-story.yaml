thumbnail:
  layout: face
  side: right
  image: paintings/oichi_portrait_jimyoin_bust.jpg
  crop: [125, 380, 925, 1180]
  name: お市の方
  lead: 二度目の落城で
  main: 逃げなかった

sections:
  # ================================================================ 導入（冒頭 約2分）
  - title: なぜお市は、二度目は逃げなかったのか　1583年 北ノ庄城
    background: {image: paintings/oichi_retsujoden_1668.jpg, credit: "黒沢弘忠『全像本朝古今列女伝』柴田勝家孺人（1668年刊）"}
    # AI絵：gem/S1.jpg（篝火に囲まれた夜の天守）を背景に使う案。いまは列女伝の挿絵で仮置き
    year: 1583
    lines:
      # 0〜10秒：場面から（あいさつ・チャンネル名なし）。日付は当時のまま。「最期」で結末を予告
      - 語り: 1583年4月、最期の夜を迎える北ノ庄城に、ひとりの女がいました。
        tone: 重い
        card: {head: "1583年4月", body: 北ノ庄城の最後の夜}
      # フロイスの手紙（[和田]）：城外の兵は、中から武器の音がせず陽気な歌声が聞こえるのに驚いた
      - 語り: 城を囲む兵たちは、驚いたといいます。城の中から聞こえてくるのは、武器の音ではなく、歌声だったからです。
        tone: しみじみ
      - 語り: 城の主は、柴田勝家。女は、その妻でした。名は、お市。織田信長の妹です。
        portrait: {image: paintings/oichi_portrait_jimyoin_bust.jpg, caption: "お市の方（高野山持明院蔵）"}
      # 『柴田合戦記』（[小林][W市]）：勝家は城を出るよう勧めた
      - 語り: 勝家は、お市に、城を出るよう勧めたと伝わります。信長の身内なら、敵も手荒には扱わない、と。
        portrait: null
        background: {image: paintings/oichi_katsuie_utamaro.jpg, credit: "喜多川歌麿《柴田修理進勝家と小谷の方》1803〜04年ごろ"}
      # 10〜40秒：ずれ
      - 語り: 実は、お市が城の落ちる日を迎えるのは、これが2度目です。
        tone: 強調
        card: {head: "2度目の落城", body: 1度目は十年前}
      - 語り: 十年前、最初の夫の城が落ちたとき、お市は、娘たちを連れて、城の外へ出ています。
        background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
      - 語り: ところが今度は、城を出るよう勧められても、お市は《断りました》。
        tone: 強調
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 語り: 三人の娘だけを城の外へ送り出し、自分は、夫とともに残りました。37歳でした。
        tone: 重い
        card: {head: "37歳", body: 娘3人を送り出し、城に残る}
      - 語り: 長女の茶々は、15歳。いちばん下の江は、まだ11歳でした。
        tone: しみじみ
      # 40〜80秒：「なぜ」を1文
      - 語り: なぜお市は、二度目は、逃げなかったのか。
        tone: 疑問
        pause: 0.8
      - 語り: 一度目に城を出た人が、二度目には、出なかった。そのあいだの十年に、何があったのでしょうか。
        tone: 疑問
      # 答えのかけら（名詞1つ）：渓心院文の言葉は小谷を出たことの悔い（[クレインス][小林]）。答えそのものは言わない
      - 語り: その答えは、十年前の、《小谷城》にあります。
        tone: 強調
        background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
        card: {head: "答えは", body: 十年前の小谷城に}
      - 語り: そして、お市が城に残る前に口にした言葉を、娘の側に仕えた人たちが、書き留めていました。
      - 語り: それは、お市が、十年前の自分について語った言葉です。
        tone: しみじみ
      # その後の予告（第6・7章）：娘3人が敵と味方に／江→家光・和子→明正天皇（[W江]・コトバンク）
      - 語り: お市が送り出した三人の娘は、やがて、敵と味方に分かれます。
        background: {image: paintings/oichi_chacha_yodo_portrait.jpg, credit: "伝 淀殿（茶々）像（奈良県立美術館蔵）17世紀"}
      - 語り: そして、お市の血は、将軍の家と、天皇の家にまで入っていきます。
        card: {head: "その後", body: 将軍の家と天皇の家へ}
      # 約束の1文
      - 語り: これは、二度の落城を生きた女と、三人の娘の記録です。
        tone: しみじみ
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        pause: 0.6
      # 橋渡し：1583年からおよそ16年前（結婚は1567〜68年ごろ。[W市][黒田109392]）
      - 語り: 話は、およそ16年前にさかのぼります。尾張の織田家の娘が、北近江の城へ、嫁いでいく日からです。
        pause: 0.6

  # ================================================================ 第1章 結婚と金ヶ崎（1567〜1570）
  - title: 1567年ごろ、小谷城へ　同盟のしるしの花嫁
    background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
    year: 1567
    lines:
      # [W市][黒田109392][コト]：1567〜68年ごろ、近江・小谷城の浅井長政に嫁ぐ（以前は1564年説）
      - 語り: 1567年から68年ごろ。お市は、近江の北、小谷城へ嫁ぎました。今の滋賀県長浜市です。
        card: {head: "1567年ごろ", body: 近江の小谷城へ嫁ぐ}
      - 語り: 小谷城は、山の尾根に沿って、いくつもの曲輪が並ぶ城です。城の下には、琵琶湖の北の平野が広がっていました。
        detail: {box: [0.2, 0.05, 0.85, 0.75], label: 尾根に曲輪が並ぶ小谷城（江戸時代の絵図）}
      # 生年は享年37からの逆算（[W市][濱田]）。結婚時21か22。父 織田信秀、信長より13歳下（通説）
      - 語り: このとき、お市は数えで21か22歳。生まれた年を書いた記録はなく、37歳で亡くなったことから数えた年齢です。
      - 語り: お市は、尾張の織田信秀の娘として生まれました。兄の信長とは、13歳ちがいの妹、というのが通説です。
        background: {image: paintings/nobunaga_kuniyoshi_musha.png, credit: "歌川国芳《太平記英勇伝》（信長を名を変えて描いた武者絵）1848〜49年ごろ"}
        card: {head: "1547年ごろ", body: 尾張に生まれる。信長の13歳下}
      - 語り: お市が数えで14歳のとき、その兄は、桶狭間で今川義元を破ります。お市は、兄が一気に名を上げていくのを、そばで見て育ちました。
        background: {image: paintings/nobunaga_okehazama_toyonobu.jpg, credit: "歌川豊宣《尾州桶狭間合戦》1882年"}
        card: {head: "1560年", body: 兄・信長が桶狭間で勝つ}
        year: 1560
      - 語り: 子どものころのお市の話は、記録にはほとんど残っていません。お市が、はっきり姿を見せるのは、この小谷へ嫁いでからです。
        background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
        year: 1567
      - 語り: 夫になったのは、浅井長政。お市より2つ年上の、北近江の若い大名でした。
        portrait: {image: paintings/oichi_nagamasa_portrait_full.jpg, caption: "浅井長政（高野山持明院蔵）"}
      - 語り: この長政の肖像は、高野山の持明院に、お市の肖像と対で伝わっています。誰が、なぜ描かせたのかは、この物語の終わりのほうで分かります。
      # [W市]：1567年9月、長政側が美濃の市橋長利を通じて同盟を申し入れ
      # [W市]：1565年12月 六角承禎が和田惟政に斡旋させる（頓挫）、1567年9月 市橋長利を通じ申し入れ
      - 語り: この結婚には、はっきりした目的がありました。両家の縁組の話は、1565年の暮れに一度持ち上がり、そのときは流れています。
      - 語り: そして1567年の9月。長政の側から、美濃の市橋長利を通して、信長に同盟を申し入れました。結婚は、このあとと見られています。
        card: {head: "1567年9月", body: 浅井から信長へ同盟の申し入れ}
      - 語り: 兄の信長は、この年、美濃を手に入れていました。美濃から京都へ向かう道の途中に、浅井の北近江があります。
        portrait: null
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）"}
        figure: {type: map, title: 尾張・美濃から京都へ, bounds: [135.3, 137.0, 34.8, 36.2], places: [[岐阜, 136.76, 35.42], [小谷, 136.28, 35.46], [京都, 135.77, 35.01], [北ノ庄, 136.22, 36.06]], route: [岐阜, 小谷, 京都], note: 京都への道の途中に浅井の北近江}
      - 語り: 二つの家の約束の、しるし。お市は、その真ん中に置かれたんです。
        figure: {type: map, title: 尾張・美濃から京都へ, bounds: [135.3, 137.0, 34.8, 36.2], places: [[岐阜, 136.76, 35.42], [小谷, 136.28, 35.46], [京都, 135.77, 35.01], [北ノ庄, 136.22, 36.06]], route: [岐阜, 小谷, 京都], note: 京都への道の途中に浅井の北近江}
        mark: {type: circle, at: 2}
      # [W淀][W初]：茶々1569、初1570
      - 語り: 小谷で、娘が生まれます。1569年に長女の茶々。翌年に、次女の初。
        figure: null
        background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
        card: {head: "1569年", body: 長女・茶々が生まれる}
      # [W万福]：万福丸1564生、お市の子ではないとされる
      - 語り: 城には、もう1人、子どもがいました。長政の長男、万福丸です。母は分かっていませんが、お市の子ではないと考えられています。
      - 語り: 夫婦の仲がどうだったのかは、記録からは分かりません。分かるのは、この結婚が、兄と夫を結ぶ糸だった、ということです。
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      # 1568 上洛（[黒田109392]）
      - 語り: 1568年、信長は、足利義昭を立てて京都に上ります。兄は、一気に天下の中心に近づきました。
        background: {image: paintings/nobunaga_rakuchu_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        card: {head: "1568年", body: 兄・信長が京都に上る}
      # [W金ヶ崎]：1570年4月、朝倉攻めの最中に浅井が背く
      - 語り: その糸が切れたのは、結婚から3年ほどのちのことです。
        tone: 重い
      - 語り: 1570年4月。信長は、越前の朝倉義景を攻めていました。その途中、金ヶ崎の陣に、知らせが届きます。
        background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
        card: {head: "1570年4月", body: 金ヶ崎に届いた知らせ}
      - 語り: 妹の夫、浅井長政が、背いた。前は朝倉、後ろは浅井。信長は、はさみ撃ちになる所にいました。
