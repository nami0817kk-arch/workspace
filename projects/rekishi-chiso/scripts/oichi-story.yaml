      - 語り: 江は、娘も産んでいます。1607年に生まれた、和子です。
        figure: {type: people, title: お市から将軍の家・天皇の家へ, nodes: [[お市の方, 本人], [江, 三女], [徳川家光, 3代将軍], [徳川和子, 天皇の后], [明正天皇, 女性の天皇]], edges: [[お市の方, 江, 母], [江, 徳川家光, 母], [江, 徳川和子, 母], [徳川和子, 明正天皇, 母]], upto: 4}
