      - 語り: 遺言。死因の謎は、ここで、もう一つの謎につながります。
        hook: true
      - 語り: 謙信は、本当に、跡継ぎを言い残したのか。
        hook: true
        tone: 疑問

  # ================================================================ 第7章 遺言と御館の乱（記録の食い違い②）
