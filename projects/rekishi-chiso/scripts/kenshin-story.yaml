  # サムネは別に作る（out/kenshin-story_thumbnail.png。名前を特大に、問い1つが主役。和服の絵は反転しない）。この欄は check のための仮。

sections:
  # ================================================================ 序章（冒頭 約2分）。答えはまとめまで言わない
  - title: 厠で倒れた越後の龍　天正6年3月 春日山城
    background: {image: paintings/shingen_kenshin_yoshitoshi.jpg, credit: "月岡芳年《芳年武者无類 弾正少弼上杉謙信入道輝虎》1883年"}
    year: 1578
    lines:
      - 語り: 上杉謙信は、春日山城の《厠》で倒れた。よく、そう語られます。
        tone: 重い
      # fact: kenshin-17
      - 語り: ところが、亡くなった11日後に、跡を継いだ景勝が書いた手紙には、厠という言葉も、卒中という言葉も、出てきません。
        card: {head: "景勝の手紙", body: 厠も卒中も出てこない}
      # fact: kenshin-17
      - 語り: 書かれているのは、ただ、「不慮の《虫気》」。思いがけない、体の中の病。それだけです。
      - 語り: では、厠の話は、いったい、どこから来たのか。
        tone: 疑問
      # fact: kenshin-36, kenshin-24
      - 語り: 天正6年、1578年の春。謙信は、3月15日に春日山を発って、遠征に出ると決めていました。
        card: {head: "出陣の予定", body: 3月15日}
      # fact: kenshin-22, kenshin-23
      - 語り: 家の記録では、その出陣の6日前に、越後の龍は倒れます。そして4日後、49歳で亡くなりました。
        tone: 重い
      # fact: kenshin-35, kenshin-70, kenshin-34, kenshin-25
      - 語り: 死因は脳卒中だ、酒の飲みすぎだ、いや、腹の病だ。信長が送った刺客だ、という話まであります。
      - 語り: 越後の龍は、なぜ倒れたのか。そして、本当に厠だったのか。
        tone: 疑問
        pause: 0.8
      # fact: kenshin-18
      - 語り: その答えは、死因の言葉だけでは終わりません。景勝の手紙は、もう一つ、大切なことを書いていました。謙信の、《遺言》です。
      # fact: kenshin-13
      - 語り: その跡継ぎをめぐって、越後は、謙信の2人の養子が争う、大きな内乱に入っていきます。
        hook: true
      - 語り: 謙信の最後の半年は、北陸の、ひとつの城から始まります。
        hook: true

  # ================================================================ 第1章 七尾城
  - title: 難攻不落の七尾城は、なぜ1日で落ちたのか　天正5年9月 能登
    background: {image: paintings/toshiie_hiroshige_noto_takinoura.jpg, credit: "歌川広重《六十余州名所図会 能登 滝之浦》1853年"}
    year: 1577
    lines:
      - 語り: 謙信は、越後の大名です。若いころから、甲斐の武田信玄と、川中島で何度も戦ったことで知られています。
        background: {image: paintings/shingen_kawanakajima_yukai_bm_trim.jpg, credit: "歌川国芳《勇魁三十六合戦 川中島》1851-52年ごろ（大英博物館蔵）"}
      - 語り: その信玄は、謙信より5年早く、世を去りました。謙信の晩年の目は、西の北陸へ向いていきます。
      # fact: kenshin-59
      - 語り: 天正5年、1577年。謙信が攻めていたのは、能登の七尾城です。山の上の城で、広さは、およそ250ヘクタール。全国でも指折りの、大きな山城でした。
        background: {image: paintings/toshiie_hiroshige_noto_takinoura.jpg, credit: "歌川広重《六十余州名所図会 能登 滝之浦》1853年"}
        card: {head: "七尾城", body: 約250ヘクタールの山城}
      # fact: kenshin-59
      - 語り: 観光庁の解説によれば、この城は、謙信の手に落ちるまで、まず攻め落とされることは無い、と考えられていました。
      # fact: kenshin-58
      - 語り: 七尾城は、内側から崩れた、と言われます。城の重臣の遊佐続光が、ひそかに謙信と通じ、筆頭の家臣、長続連を殺して、門を開いた、というのです。
      # fact: kenshin-40
      - 語り: 9月15日。謙信は、味方の武将の親子に、手紙を送ります。七尾城は、この15日、1日のうちに落ちた。
        card: {head: "謙信の手紙（9月15日）", body: 七尾城、1日で落ちる}
      # fact: kenshin-40
      - 語り: 同じ手紙には、織田信長が出陣した、とも書かれています。でも、信長本人は出てきていません。誤った知らせでした。
      # fact: kenshin-40
      - 語り: そして手紙は、北国は、あとは越前だけだ、と続けます。謙信の目は、もう、その先を見ていました。
      # fact: kenshin-29
      - 語り: このころ、9月13日の夜に、謙信が陣中で月を見て作ったと伝わる漢詩があります。霜は陣営に満ちて、秋の気は清し。
        tone: しみじみ
      # fact: kenshin-29
      - 語り: ただ、この詩の古い出どころは、江戸の中ごろの書物、『常山紀談』です。明治の本は、作った年を、天正2年とも、天正5年とも書いています。
      - 語り: 七尾城を落とした謙信は、さらに南の、加賀へ進みます。そこへ、織田の大軍が近づいていました。
        hook: true
      - 語り: 謙信が織田に勝った、と語られる戦い。その場に、謙信自身はいなかったかもしれないのです。
        hook: true

  # ================================================================ 第2章 手取川
  - title: 謙信は手取川で戦ったのか　天正5年9月23日の夜
    background: {image: paintings/shingen_kawanakajima_yukai_bm_trim.jpg, credit: "歌川国芳《勇魁三十六合戦 川中島》1851-52年ごろ（大英博物館蔵）"}
    year: 1577
    lines:
      # fact: kenshin-38
      - 語り: 天正5年9月23日の夜。加賀の手取川の河口のあたりで、上杉の軍勢が、織田の軍勢を破りました。手取川の戦いです。
        figure: {type: map, title: 春日山から七尾・湊川へ, bounds: [135.8, 139.2, 36.0, 38.0], places: [[春日山城, 138.2, 37.14], [七尾城, 136.97, 37.02], [湊川（手取川の河口）, 136.47, 36.5]], route: [春日山城, 七尾城, 湊川（手取川の河口）]}
      # fact: kenshin-38
      - 語り: 2025年に、福井の郷土史の雑誌に載った論文は、この場所を、手取川ではなく、《湊川》と呼んでいます。湊川は、手取川の河口のあたりの呼び名です。
      # fact: kenshin-37
      - 語り: 歴史家の乃至政彦さんは、2024年の記事で、こう書きます。織田の兵を討ったのは、先に送られた上杉の軍勢で、謙信が着いたのは、翌朝だった。
        figure: null
        card: {head: "乃至政彦さん", body: 謙信は翌朝に着いた}
      # fact: kenshin-37
      - 語り: そのとき、織田の軍勢は、もう戦いを続けるのをやめて、引き揚げ始めていた、と乃至さんは見ています。
      # fact: kenshin-41
      - 語り: 織田の側の記録はどうか。信長の家臣、太田牛一の『信長公記』には、手取川を越えて、村々を焼いたことが出てきます。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
      # fact: kenshin-41
      - 語り: そして、羽柴秀吉が、届けも出さずに陣を引き払って帰ってしまい、信長が、けしからぬことだと怒ったことも。
      # fact: kenshin-41
      - 語り: ところが、上杉の軍勢との合戦そのものは、『信長公記』には書かれていません。
      # fact: kenshin-39
      - 語り: 日付の食い違いもあります。大坂の本願寺の重臣、下間頼廉は、9月26日付の手紙で、去る11日に一戦して、敵を800人ほど討ち取った、と伝えています。
        card: {head: "本願寺の手紙", body: 「去る11日」に一戦}
      # fact: kenshin-39
      - 語り: 11日は、七尾城が落ちるより前の日です。本願寺に、誤った日が伝わったのか。それとも、別の戦いのことなのか。論文は、両方の読みを挙げています。
      # fact: kenshin-43
      - 語り: 能登の人々にとって、謙信は、義の英雄だったのか。歴史研究者の萩原大輔さんは、2020年の本、『謙信襲来』で、そうではなかった、と書きます。
      # fact: kenshin-43
      - 語り: 輪島市の、ある寺には、人をさらうことを禁じる、禁制が残っています。萩原さんは、これを、上杉の軍勢が人の売り買いをしていた跡と見ています。
        card: {head: "輪島の寺の禁制", body: 人をさらうことを禁じる}
      - 語り: 能登を手にした謙信は、やがて、越後へ引き揚げます。
        hook: true
      - 語り: 次の春、謙信は、新しい遠征を計画していました。
        hook: true

  # ================================================================ 第3章 春日山と出陣の支度
  - title: 出陣は関東か、上洛か　天正6年の春 春日山城
    background: {image: paintings/shingen_kenshin_rinsenji.jpg, credit: "《上杉謙信像》（林泉寺蔵とされる）"}
    year: 1578
    lines:
      # fact: kenshin-45
      - 語り: 謙信の居城、春日山城。今の新潟県上越市にある、山の城です。文化庁の解説では、山の上に本丸を構え、その下に、二ノ丸と三ノ丸を置いています。
      # fact: kenshin-46
      - 語り: 本丸の跡の後ろ、一段低い所には、大きな井戸があります。夏でも水が涸れることはない、とあります。
        card: {head: "春日山城の大井戸", body: 夏も涸れない}
      # fact: kenshin-46
      - 語り: 本丸の西には、毘沙門丸と御花畑。ただ、この国の解説には、厠という言葉は出てきません。
      # fact: kenshin-36
      - 語り: 年が明けて、天正6年。正月に、謙信は、兵を集めよという陣触れを出し、3月15日を、出陣の日と決めた、と伝えられています。
      # fact: kenshin-36
      - 語り: その行き先は、どこだったのか。実は、同じ書き手の中でも、言い方が揺れています。
        tone: 疑問
      # fact: kenshin-36
      - 語り: 乃至政彦さんは、2023年の記事では、上洛、つまり京へ上る戦の準備の最中に倒れた、としました。
      # fact: kenshin-36
      - 語り: ところが2024年の記事では、3月に、関東への大遠征を計画していた、とします。関東を攻めたあとで、信長を倒すつもりだった、という筋です。
        card: {head: "遠征の行き先", body: 上洛か、関東か}
      # fact: kenshin-24
      - 語り: 江戸幕府の側でまとめた歴史書、『武徳編年集成』は、15日に春日山を発って、信長と戦うつもりだった、としています。
      # fact: kenshin-05
