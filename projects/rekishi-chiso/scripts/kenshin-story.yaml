# 型：docs/story-main.md「00. 伸びる型」の D 最期（ユーザー決定）。語りは剣崎1人。想像の台詞は入れない（imagined なし）。
# 1本に1つの問い＝「春日山城の厠で倒れた、と語られる謙信。本当は、なぜ倒れたのか」。題名で死因を言い切らない。
#   冒頭（10秒以内）＝「厠で倒れた」とよく語られるのに、死の11日後の景勝の書状には厠も卒中も出てこない（kenshin-17）。
#   答え（まとめ）：同時代の言葉は「不慮之虫気」だけ。厠と卒中風は江戸の軍記（北越軍記）の筋で、しかも厠は「一説」。脳溢血は近代の読み替え。
#     言えること＝急な病で、数日で亡くなった。言えないこと＝病名（腹の病か、頭の病か）。暗殺は明治の本がすでに「謬伝」とした。
# 記録の食い違い（parts の versus3 で並べる3つ）：
#   ①死因の言葉と倒れた日（景勝書状「不慮之虫気」／北越軍記「9日から腹痛、一説に11日に厠、昼から卒中風」／武徳編年集成「11日夜陰に卒中」）
#   ②遺言の場面（景勝書状「遺言」で実城へ・刀を形見に／上杉家家譜附録：口のきけない謙信が頷いた／北越軍記：老臣の内談で決めた）
#   ③遺骸の納め方（北越軍記系：瓶に塩／旧米沢藩士の談：瓦棺に朱漆／大正6年の伝記：甲冑を着せて甕に）
#   ほかに小さく：亡くなった時刻（家譜附録「未の刻」／日本史蹟大系「黄昏」）、手取川の日（下間頼廉の書状「去る十一日」／23日夜）、辞世の形、米沢へ移した年（慶長6年／8年）。
# 計算（自分で計算し直した）：1530年生まれ→1578年は数え49歳（家譜附録「御年四十九」）／9日に倒れ13日に没＝4日後／出陣の予定15日＝倒れて6日後・死の2日後／
#   景勝の書状3月24日＝死の11日後／七尾の落城9月15日→湊川の戦い9月23日＝8日後／天正5年9月→天正6年3月＝半年足らず／
#   1578→1598年（会津へ）＝20年、春日山城の中に置かれたまま／慶長6年＝1601年、慶長8年＝1603年／1898年→1917年→1944年。
# 事実は事実カード（dev/output/rekishi-chiso/research/上杉謙信_facts_20261107.yaml、kenshin-05〜73）にあるものだけ。行の上に `# fact: kenshin-NN`。
#   カードに無い「誰でも知っている前置き」（越後の大名・川中島で信玄と戦った・景勝と景虎は養子）は短く使い、# fact を付けない。
#   使わないこと：「大虫」（出どころが見つからなかった）・名字尽の人数（81名は翻刻で確かめられず）・宇佐美定祐の「閑所」説（書誌だけ）・
#     杉浦守邦の食道がん説（未見）・明治9年の廟所への移転（書誌だけ）・毘沙門天像の行方（書誌だけ）・樋口晴彦の論考（題だけ）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
# 広告の配慮：死は「亡くなった」。遺骸の扱いは淡々と。景虎の最期は「自ら命を絶った、と伝えられる」まで。
