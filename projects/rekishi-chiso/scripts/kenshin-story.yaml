# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  上杉謙信は、春日山城の厠で倒れた。よく、そう語られます。
  ところが、亡くなった11日後に、跡を継いだ景勝が書いた手紙には、厠という言葉も、卒中という言葉も、出てきません。
  書かれていたのは、「不慮の虫気」の数文字だけでした。
  越後の龍は、関東への出陣を目の前にして、なぜ倒れたのか。そして本当に、厠だったのか。
  この動画でわかること
  ・七尾城の落城と、手取川（湊川）の戦いの記録の食い違い
  ・景勝の書状・『上杉家家譜』・『北越軍記』で、死因の言葉と倒れた日が違うこと
  ・脳卒中・腹の病・暗殺――死因の説が、いつ、誰によって書かれたのか
  ・「遺言」と御館の乱、そして墓に入らないまま旅をした遺骸
description_note: |-
  記録の言葉は、出どころ（上杉景勝の書状、『上杉家家譜』附録、『北越軍記』、『武徳編年集成』など）を語りで示してから、今の言葉に直して読んでいます。原文は『越佐史料』『大日本古文書 上杉家文書』『越後史料叢書』などの翻刻（国立国会図書館デジタルコレクション）で読みました。
  画面の情景・人物の画像の多くは、画像生成AIで作った想像上のイメージで、記録映像・実在の写真や肖像ではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Uesugi Kenshin: Why Did He Really Collapse at Kasugayama Castle? The Dragon of Echigo's End"
  description: |-
    Uesugi Kenshin collapsed in the privy of Kasugayama Castle - or so the story is often told.
    Yet the letter his heir Kagekatsu wrote eleven days after his death mentions neither a privy nor a stroke. It says only "an unexpected illness of the bowels" (mushike).
    Why did the Dragon of Echigo fall, just days before a great campaign? And was it really in the privy?
    In this video you will learn:
    - The fall of Nanao Castle and the conflicting records of the battle at the Tedori (Minato) River
    - How Kagekatsu's letter, the Uesugi family chronicle and the Hokuetsu Gunki differ on the cause and the day he collapsed
    - Stroke, stomach illness, assassination: when and by whom each theory was written
    - The "last will," the Otate Rebellion, and a body that traveled without a grave
    Recorded words are read with their sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "He Collapsed in the Privy - or Did He?"
    - "Nanao Castle Falls in a Single Day, 1577"
    - "Did Kenshin Fight at the Tedori River?"
    - "Six Days Before the Campaign: Kasugayama, Spring 1578"
    - "March 9 to 13: What the Letter Says"
    - "Where Did the Privy Come From?"
    - "Stroke, Stomach, or Assassin?"
    - "Did Kenshin Leave a Will? The Otate Rebellion"
    - "Where Did His Body Go? Kasugayama, Aizu and Yonezawa"
    - "Summary: Why Did the Dragon of Echigo Fall?"

