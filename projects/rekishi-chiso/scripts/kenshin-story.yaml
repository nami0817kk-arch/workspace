        figure: {type: map, title: 謙信の遺骸の旅, bounds: [137.4, 141.0, 36.6, 38.4], places: [[春日山城, 138.2, 37.14], [会津若松城, 139.93, 37.49], [米沢城, 140.12, 37.91]], route: [春日山城, 会津若松城, 米沢城]}
