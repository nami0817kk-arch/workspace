# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1615年、燃える大坂城から救い出された千姫。豊臣秀頼の妻で、徳川家康の孫。数えで19歳でした。
  その1年あまりあと、千姫の嫁入りの輿を奪ってみせると言った大名が、江戸の屋敷に立てこもります。後の世には、御殿に男を招き入れた姫という話まで広まりました。
  千姫は、大坂城から救い出されたあと、50年をどう生きたのか。当時の日記や書状、幕府の記録、寺の記録、明治から昭和の本を並べてたどりました。
  この動画でわかること
  ・坂崎出羽守の事件と、記録で食い違う理由と死に方
  ・姫路の10年と、「秀頼の恨み」と言われた日々
  ・天樹院として江戸で過ごした40年
  ・秀頼の娘・天秀尼と、鎌倉の東慶寺
  ・「吉田御殿」の伝説は、どこから来たのか
description_note: |-
  坂崎出羽守の事件は、東京大学史料編纂所『大日本史料』第12編之25（1925年）に収められたリチャード・コックスの日記・金地院崇伝の書状・『東武実録』『元和年録』『元寛日記』『柳生家譜』などによります。天樹院の暮らしと最期は『徳川実紀』と幕府の記録『年録』、天秀尼と東慶寺は東慶寺の寺例書と東京大学の博士論文、吉田御殿の伝説は明治から昭和の本と、三鷹市山本有三記念館の館報（奥野久美子、2023年）によります。
  年月日・年齢・年数は、自分で計算し直したものです。生まれは慶長2年4月11日（1597年5月26日）として、数え年で言っています。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。千姫姿絵（弘経寺蔵）ほかの古い絵は、パブリックドメインのものです。サムネイルの絵も、AI による想像図です。

en:
  title: "Princess Sen: How Did She Live for 50 Years After Being Rescued from Osaka Castle?"
  description: |-
    In 1615, Princess Sen, wife of Toyotomi Hideyori and granddaughter of Tokugawa Ieyasu, was rescued from the burning Osaka Castle at the age of eighteen.
    About a year later, a lord declared he would seize her bridal palanquin, and barricaded himself in his Edo mansion. In later generations, stories even claimed she lured men into her palace.
    How did she live for the next fifty years? We follow a diary and letters of the time, shogunate records, temple records, and later books.
    In this video you will learn:
    - The Sakazaki Dewa no Kami incident, and how records disagree on his motive and on how he died
    - Ten years at Himeji, and the days when her misfortune was blamed on Hideyori's spirit
    - Forty years as Tenjuin in Edo
    - Hideyori's daughter Tenshu-ni and Tokeiji temple in Kamakura
    - Where the "Yoshida Palace" legend came from
    Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Rescued from Osaka Castle"
    - "Why Did Sakazaki Try to Seize Her? 1616"
    - "Ten Years at Himeji, 1616-1626"
    - "Tenjuin at Takebashi, Edo"
    - "Hideyori's Daughter and Tokeiji Temple"
    - "Where Did the Yoshida Palace Legend Come From?"
    - "Summary: Her Death in 1666"

