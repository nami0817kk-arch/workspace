sections:
  # ================================================================ 序章（冒頭30秒：燃える大坂城→1年後の立てこもり→死に方が違う→50年→伝説→記録に無い→問い）
  - title: 燃える大坂城から救い出された姫　慶長20年5月
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1615
    lines:
      - 語り: 1615年、燃える大坂城から、ひとりの若い妻が、救い出されました。豊臣秀頼の妻で、徳川家康の孫。千姫、数えで19歳です。
        tone: 重い
      # fact: senhime-10
      - 語り: その1年あまりあと。千姫の嫁入りの輿を、途中で奪ってみせる、と言い放った大名が、江戸の屋敷に立てこもります。
      # fact: senhime-12, senhime-13
      - 語り: 屋敷は兵に囲まれ、その大名は死にました。けれど、どう死んだのかは、残った記録には、まるで違う形で出てきます。
        tone: 強調
      - 語り: 千姫は、そのあと、50年あまりを生きました。
        tone: しみじみ
      # fact: senhime-50
      - 語り: やがて世間は、千姫を、御殿の二階から若い男を招き入れた姫として、講談で語るようになります。
      # fact: senhime-29
      - 語り: けれど、幕府の記録には、その御殿の名は、出てきません。
        tone: 強調
      - 語り: 千姫は、大坂城から救い出されたあと、50年を、どう生きたのか。
        tone: 疑問
        pause: 0.5
      # fact: senhime-26
      - 語り: 姫路の城で産んだ男の子を、数えで3歳で亡くし、そのあとの不幸を、秀頼の恨みのせいだ、と言われます。
      - 語り: 2人目の夫を亡くしてからは、髪を下ろして天樹院と名乗り、江戸で、およそ40年を過ごします。
      # fact: senhime-43
      - 語り: そして、ある尼寺を、自分が施主となって、建て直しています。誰のためだったのか。
        tone: しみじみ
        pause: 0.6
      - 語り: 落城の翌年。千姫の再婚が、決まります。
        pause: 0.6

  # ================================================================ 第1章 坂崎出羽守の事件（1616、食い違い①理由・②死に方）
  - title: 坂崎出羽守は、なぜ千姫を奪おうとしたのか　元和2年、江戸
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1616
    lines:
      - 語り: 元和2年、1616年。病に伏した家康を、桑名の城主の息子、本多忠刻が、母とともに駿府へ見舞います。
      # fact: senhime-20
      - 語り: 江戸幕府がまとめた系譜集、『寛政重修諸家譜』によれば、このとき、千姫との縁組が命じられた、といいます。
        card: {head: "1616年 駿府", body: 千姫と本多忠刻の縁組}
      - 語り: 忠刻は、徳川四天王のひとり、本多忠勝の孫。数えで21歳。千姫は、数えで20歳でした。
      - 語り: その年の7月19日。家康の側近の僧、金地院崇伝が、大名に宛てた手紙の控えには、こんな一文があります。
      # fact: senhime-09
      - 語り: 大坂の姫君様は、桑名の平八郎殿、つまり忠刻のもとへ、9月に祝言と決まった、とあります。
        tone: 強調
        card: {head: "崇伝の手紙の控え", body: 9月に祝言と決まる}
      - 語り: その9月。日本に来ていたイギリス商館長、リチャード・コックスの日記に、江戸で起きた騒ぎが書き留められています。
      # fact: senhime-10
      - 語り: 元和2年9月10日にあたる日。出羽殿と呼ばれる武士が、明日嫁ぐ将軍の娘、千姫を、途中で奪ってみせる、と言い放った、とあります。
        tone: 強調
        card: {head: "コックスの日記", body: 嫁ぐ姫を途中で奪う}
      - 語り: 出羽殿とは、坂崎出羽守、直盛。石見の津和野の城主で、大坂の陣では、徳川方として戦った大名です。
      # fact: senhime-10
      - 語り: 日記によれば、その理由は、こうです。亡くなった家康が、大坂での働きの褒美に、千姫を与えると約束した。それを、今の将軍の秀忠が、認めなかった、といいます。
      # fact: senhime-18
      - 語り: ただ、千姫を城から連れ出したのが坂崎だったのかも、はっきりしません。堀内家の系譜には、堀内主水が姫君を背負って城を出て、坂崎に渡した、とあります。
        card: {head: "堀内家の系譜", body: 背負って出て坂崎に渡す}
      - 語り: そして、坂崎が千姫を奪おうとした理由は、記録によって、3つに分かれます。
        tone: 強調
      # fact: senhime-15
      - 語り: コックスの日記のほか、江戸の聞き書きにも、家康の約束が出てきます。城から無事に連れ出した者に、妻として与える、という話です。
        figure: {type: stats, title: 坂崎が千姫を奪おうとした理由, items: [[及聞秘録ほか, 家康の約束, 連れ出した者に妻として], [柳生家譜, 千姫が嫌った, 本多忠刻に嫁ぐ], [元和年録, 一番手柄の争い, 約束の話は無い]], upto: 1}
      # fact: senhime-15
      - 語り: 柳生家の家譜には、千姫が坂崎を嫌って、本多忠刻に嫁いだので、坂崎がひどく怒った、とあります。
        figure: {type: stats, title: 坂崎が千姫を奪おうとした理由, items: [[及聞秘録ほか, 家康の約束, 連れ出した者に妻として], [柳生家譜, 千姫が嫌った, 本多忠刻に嫁ぐ], [元和年録, 一番手柄の争い, 約束の話は無い]], upto: 2}
      # fact: senhime-15
      - 語り: そして『元和年録』には、約束の話が出てきません。大坂で一番に手柄を立てたのは自分で、本多などは、はるかあとだ。坂崎は、そう言って怒った、とあります。
        figure: {type: stats, title: 坂崎が千姫を奪おうとした理由, items: [[及聞秘録ほか, 家康の約束, 連れ出した者に妻として], [柳生家譜, 千姫が嫌った, 本多忠刻に嫁ぐ], [元和年録, 一番手柄の争い, 約束の話は無い]], upto: 3}
      # fact: senhime-16
      - 語り: よく知られた、坂崎が救出のときに顔にやけどを負い、千姫に嫌われた、という話。これは、今回たどった江戸時代の記録には、見つかりませんでした。
        figure: null
      # fact: senhime-16, senhime-56
      - 語り: 江戸の記録『焼残反古』は、千姫が、坂崎の顔立ちのよくないのを嫌った、と書くだけ。やけどの場面は、明治から大正の講談に出てくるものです。
      # fact: senhime-11
      - 語り: コックスの日記に戻ると、坂崎は、髪を剃った家臣1000人と、女たち50人とともに屋敷に立てこもり、1万あまりの兵が、それを囲んだ、といいます。
        tone: 重い
        card: {head: "コックスが聞いた噂", body: 1000人で立てこもる}
      - 語り: そして、坂崎の死に方も、記録ごとに、まるで違います。
        tone: 強調
      # fact: senhime-12
      - 語り: 『東武実録』では、坂崎が酒に酔って蔵で寝ている間に、家臣が蔵の口を閉じ、最後は自ら命を絶った、とあります。
      # fact: senhime-12
      - 語り: 『元和年録』では、柳生宗矩が家老たちに話をつけ、坂崎は、土蔵を出て、行水をしていたところで、命を落とした、という話です。
      # fact: senhime-13
      - 語り: 『元寛日記』では、老臣の遠藤という者が寝返って、主の首を斬り、取り囲む兵に差し出した。その遠藤も、主を殺した罪で、首をはねられた、とあります。
        tone: 重い
      - 語り: 同じひとつの死が、蔵での自害にも、行水の場にも、家臣の裏切りにもなっています。
        tone: しみじみ
      - 語り: 幕府は、坂崎の領地を、取り上げました。
      # fact: senhime-20
      - 語り: そして本多家の系譜によれば、その騒ぎのさなかの9月13日、千姫の輿は、江戸を発っていた、といいます。
      - 語り: 行き先は、伊勢の桑名。そこで千姫を待っていたのは、思いがけないほどの祝いでした。
        hook: true

  # ================================================================ 第2章 姫路の10年（1616〜1626）
  - title: 姫路の10年は、幸せだったのか　元和2年から寛永3年
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1616
    lines:
      - 語り: コックスは、ちょうどそのころ、桑名を通っています。宿の主人は、毎日、祝いの品が届いている、と話しました。
      # fact: senhime-21
      - 語り: 中には、大判100枚と、同じ数の着物を、贈った者もいる。人が集まりすぎて、コックスは、馬を借りることもできなかった、といいます。
        card: {head: "桑名の祝い", body: 大判100枚と着物100着}
      # fact: senhime-24
      - 語り: 再婚の前には、千姫が、上州の尼寺、満徳寺に入って、豊臣家との縁を切った、という話も伝わります。
      # fact: senhime-24
      - 語り: けれど、群馬県太田市の説明は、千姫本人は寺に入らず、身代わりの者が入った、と書いています。寺の言い伝えだ、とも断っています。
      # fact: senhime-22
      - 語り: 夫の忠刻には、千姫のための化粧料として、10万石が与えられました。『元和年録』には、姫君様の御知行、10万石、とあります。
        card: {head: "千姫の化粧料", body: 10万石}
      # fact: senhime-22
      - 語り: 翌年、本多家は、播磨の姫路に移ります。父の忠政が15万石。忠刻の10万石は、それとは別でした。
      # fact: senhime-23
      - 語り: 姫路城の西の丸には、今も、化粧櫓が残っています。千姫の化粧料で建てた、と伝わる建物です。
      # fact: senhime-23
      - 語り: 姫路市の解説によれば、千姫は、ここを、着替えの部屋や、向かいの山の天満宮を拝むときの、休み所に使いました。
      # fact: senhime-25
      - 語り: 元和4年、1618年。千姫は、娘の勝姫を産みます。翌年には、男の子、幸千代が生まれました。
        card: {head: "1618年・1619年", body: 勝姫と幸千代}
      - 語り: 秀頼の妻として、子のないまま城を出た千姫が、はじめて、自分の子を産みました。
        tone: しみじみ
      # fact: senhime-25
      - 語り: ところが、元和7年、1621年。幸千代は、数えで3歳で、亡くなります。
        tone: 重い
      # fact: senhime-26
      - 語り: 姫路市の解説によれば、千姫は、そのあと、流産を繰り返しました。占い師は、それを、秀頼の恨みの魂のせいだ、と言った。
        tone: 重い
      # fact: senhime-26
      - 語り: 千姫は、観音像を作らせ、その中に、秀頼の祟りから解かれるよう願う、自分で書いた祈りの文を、納めたといいます。
      # fact: senhime-26
      - 語り: 元和9年、1623年には、姫路城から見える男山に、天満宮を建てさせ、西の丸から、毎日、手を合わせた、と伝わります。
        card: {head: "1623年", body: 男山に天満宮}
      - 語り: 大坂城で別れた最初の夫の影は、姫路まで、ついてきていました。
        tone: しみじみ
      # fact: senhime-27
      - 語り: そして寛永3年、1626年5月7日。夫の忠刻が、数えで31歳で、病に倒れて亡くなります。
        tone: 重い
        card: {head: "寛永3年5月", body: 本多忠刻 31歳で死去}
      # fact: senhime-27
      - 語り: 書写山円教寺にある本多家の墓所では、忠刻の石塔の後ろに、あとを追って死んだ3人の武士の墓が、並んでいます。
      - 語り: 同じ年の9月には、千姫の母の江も、江戸で亡くなりました。
      - 語り: 夫と、息子と、母と。千姫は、数えで30歳になっていました。
        tone: しみじみ
      - 語り: 千姫は、娘の勝姫を連れて、姫路を離れ、江戸へ向かいます。
        hook: true
      - 語り: そこで待っていたのは、天樹院としての、40年でした。
        tone: 重い
        hook: true

  # ================================================================ 第3章 竹橋の天樹院（1626〜1651）
  - title: 竹橋の御殿で、天樹院は何をしていたのか　寛永3年から
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1626
    lines:
      # fact: senhime-28
      - 語り: 『徳川実紀』によれば、千姫は、その年の11月27日に江戸に着き、12月20日に、竹橋の屋敷へ移った、といいます。
      - 語り: 髪を下ろして、天樹院と名乗ります。
        tone: しみじみ
      # fact: senhime-29
      - 語り: 竹橋の御殿は、江戸城の北の丸にありました。正保年間の江戸の絵図には、竹橋の内に、天樹院様、と書かれています。
      # fact: senhime-29
      - 語り: 幕府の御殿の書き上げには、寛永3年のころから、寛文6年の2月6日まで、天樹院様、とあります。亡くなるまで、およそ40年です。
        card: {head: "竹橋御殿", body: およそ40年の住まい}
      # fact: senhime-28
      - 語り: ただ、のちに飯田町の御殿へ移った、と書く系譜もあります。
      - 語り: 将軍は、弟の家光。千姫は、その姉になりました。
      # fact: senhime-30
      - 語り: 寛永5年、1628年。天樹院は、娘の勝姫を、鳥取の殿様、池田光政に嫁がせます。『徳川実紀』には、大御所秀忠の子として嫁いだ、と書かれています。
        card: {head: "1628年", body: 勝姫が池田光政に嫁ぐ}
      # fact: senhime-31
      - 語り: 寛永8年、1631年。行いを責められた弟の徳川忠長は、尾張と水戸の叔父たちとともに、天樹院も頼って、家光にとりなしを願った、といいます。
      # fact: senhime-32
      - 語り: 寛永12年、1635年の正月。天樹院が病に倒れると、家光は、自分で見舞いに行きました。病は天然痘。大名たちも、次々に見舞いに、城へ上がった、とあります。
        card: {head: "1635年正月", body: 天然痘に家光が見舞う}
      - 語り: このとき天樹院は、数えで39歳。病は、癒えました。
        tone: しみじみ
      - 語り: 正保元年、1644年。家光に、また男の子が生まれます。のちの甲府の殿様、徳川綱重です。
      # fact: senhime-34
      - 語り: 翌年、家光は、数えで42歳の厄年。その年に2歳の子を持つのは縁起が悪い、という言い習わしから、生まれた子は、天樹院の養子になった、と記録には書かれています。
        card: {head: "1644年", body: 家光の子・綱重が養子に}
      # fact: senhime-35
      - 語り: やがて綱重と、天樹院に仕えた松坂局の女中との間に、男の子が生まれます。のちの6代将軍、徳川家宣だ、という話が、系譜に残っています。
      # fact: senhime-33
      - 語り: 慶安4年、1651年。家光が亡くなります。形見として、天樹院には、金1万両。ほかの女性たちは、5千両ずつだった、と記録にはあります。
        card: {head: "家光の形見", body: 天樹院に金1万両}
      - 語り: 将軍の姉として、天樹院は、徳川の家の中に、確かな場所を持っていました。
        tone: しみじみ
      - 語り: けれど、その力を、天樹院がいちばん使ったのは、徳川の人のためでは、ありませんでした。
        hook: true
      - 語り: 大坂城で、命を助けた、あの子のためです。
        tone: 重い
        hook: true

  # ================================================================ 第4章 天秀尼と東慶寺（1615〜1645）
  - title: 秀頼の娘を、なぜ守り続けたのか　鎌倉の東慶寺
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1634
    lines:
      # fact: senhime-42
      - 語り: 秀頼には、ほかの女性との間に生まれた娘がいました。大坂城が落ちたあと、この娘は、千姫の養女として、命を助けられた、と東慶寺は説明しています。
      # fact: senhime-42
      - 語り: 娘は、鎌倉の尼寺、東慶寺に入って、天秀と名乗りました。のちに、この寺の住職になります。
        card: {head: "天秀尼", body: 秀頼の娘・千姫の養女}
      - 語り: 東慶寺は、夫と別れたい女性が駆け込めば、離縁ができる、縁切寺として知られる寺です。
      # fact: senhime-42
      - 語り: 寺に伝わる『寺例書』には、天秀が寺に入るとき、家康に、望みがあれば申せ、と言われ、古くからの寺の決まりが絶えないことを願った、とあります。
      # fact: senhime-42
      - 語り: ただ、この書き出しは、明和5年、1768年のもの。天秀が寺に入ってから、150年あまりあとの、寺の申し立てです。
      # fact: senhime-43
      - 語り: 寛永11年、1634年。天樹院は、天秀のために、自分が施主となって、東慶寺の堂を、建て直します。
        card: {head: "1634年", body: 天樹院が東慶寺を建て直す}
      # fact: senhime-43
      - 語り: 東京大学の博士論文によれば、その棟札の裏には、家光の乳母、春日局が取り仕切った、と記されています。
      # fact: senhime-43
      - 語り: 同じ論文は、弟の忠長が住んでいた屋敷の建物が、東慶寺に移され、修理のお金、100両が付けられた、とも書いています。
      - 語り: やがて、この寺が、大名とぶつかります。会津の大名、加藤明成のもとを、家老の堀主水が、一族を連れて飛び出しました。寛永16年、1639年のことです。
        tone: 重い
      # fact: senhime-44
      - 語り: 正徳6年、1716年に出た逸話集『武将感状記』には、こんな話があります。主水の妻子は、鎌倉の尼寺に逃げ込み、明成は、引き渡せ、と迫った、という話です。
      # fact: senhime-44
      - 語り: 尼寺の主は、明成を滅ぼすか、この寺をつぶすか、二つに一つだ、と言って、天樹院に訴えた、といいます。
        tone: 強調
        card: {head: "武将感状記", body: 明成か寺か二つに一つ}
      - 語り: 寛永20年、1643年。加藤明成は、会津40万石を幕府に返し、領地を失いました。
      # fact: senhime-44
      - 語り: けれど、幕府の歴史書『徳川実紀』の本文には、東慶寺も、天秀も、天樹院も、出てきません。尼寺が大名を倒した、という話は、70年あまりあとの、逸話集にあるものです。
        tone: しみじみ
        figure: {type: stats, title: 会津の一件　記録の違い, items: [[武将感状記（1716年）, 尼寺の主が天樹院に訴える, 明成か寺か], [徳川実紀, 寺の名は出てこない, 明成は病で国を返す]], upto: 2}
      # fact: senhime-45
      - 語り: 正保2年の2月7日、西暦では1645年。天秀は、東慶寺で亡くなりました。幕府は、すぐに目付を鎌倉へ送って、寺を改めさせた、と記録にはあります。
        figure: null
        card: {head: "正保2年2月", body: 天秀尼が亡くなる}
      - 語り: 幕府が認めた縁切寺は、2つだけ。鎌倉の東慶寺と、上州の満徳寺です。
      # fact: senhime-24
      - 語り: 東慶寺は、千姫が建て直した寺。満徳寺には、千姫の身代わりが入った、と伝わります。
        tone: しみじみ
      - 語り: 夫と別れたい女性を守る、2つの寺。そのどちらにも、2度、夫を失った千姫の名が、残っています。
        tone: しみじみ
      - 語り: ところが、千姫の死から50年あまりのころには、もう、ある御殿の噂が、芝居の種になっていました。
        hook: true
      - 語り: 若い男を、二階から招き入れる、という噂です。
        tone: 重い
        hook: true

  # ================================================================ 第5章 吉田御殿の伝説（食い違い③。古い順に）
  - title: 「吉田御殿」の千姫は、どこから来たのか　後の世の伝説
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1719
    lines:
      - 語り: 「吉田通れば、二階から招く。しかも、鹿の子の振袖で」。
        tone: しみじみ
      # fact: senhime-50
      - 語り: この歌とともに語られたのが、吉田御殿の千姫です。御殿の二階から、通りの若い男を招き入れた、という話でした。
      # fact: senhime-47
      - 語り: けれど、昭和11年の本によれば、この歌は、もともと、東海道の吉田の宿、いまの愛知県豊橋の、宿場の女を歌ったものだった、といいます。
        tone: 強調
      # fact: senhime-47
      - 語り: 江戸時代の流行り歌の本『松の落葉』に、吉田小女郎という題で載っていて、それが、のちに千姫の話にかこつけられた、と書かれています。
      - 語り: 近松門左衛門の浄瑠璃『平家女護島』には、物見の座敷から、通る男たちを呼び入れる、という場面があります。初めて演じられたのは、享保4年、1719年。
      # fact: senhime-49
      - 語り: 近松の研究者、木谷蓬吟によれば、この場面は、世間で名高い、吉田御殿の噂をあてこんだものだ、といいます。千姫が亡くなって、50年あまりのころです。
      # fact: senhime-50
      - 語り: 2023年、文学研究者の奥野久美子さんは、千姫を吉田御殿の女主人にする筋の原型が、江戸の中ごろの講釈師、馬場文耕の『皿屋舗弁疑録』に、すでにある、と書いています。
      # fact: senhime-51
      - 語り: ところが、肝心の吉田御殿が、どこにあったのかは、本によって違います。明治の端唄の注には、麹町の番町、と書かれています。大正の東京案内では、牛込の御門のあたり。
        tone: 強調
        figure: {type: stats, title: 吉田御殿はどこにあったか, items: [[明治の端唄の注, 麹町の番町, 1911年], [大正の東京案内, 牛込の御門のあたり, 1918年], [幕府の記録, 竹橋の御殿, 天樹院の住まい]], upto: 2}
      # fact: senhime-29
      - 語り: そして、幕府の記録には、天樹院の住まいとして、竹橋の御殿が出てきます。吉田という名の御殿に住んだ記録は、見つかりません。
        figure: {type: stats, title: 吉田御殿はどこにあったか, items: [[明治の端唄の注, 麹町の番町, 1911年], [大正の東京案内, 牛込の御門のあたり, 1918年], [幕府の記録, 竹橋の御殿, 天樹院の住まい]], upto: 3}
      # fact: senhime-55
      - 語り: 大正10年、1921年。作家の山本有三は、戯曲『坂崎出羽守』を書きます。有三は、吉田御殿の千姫は、淫婦の代表だが、この千姫は、近代的な女性だ、と語っています。
        figure: null
        card: {head: "山本有三", body: 戯曲『坂崎出羽守』1921年}
      # fact: senhime-50
      - 語り: 大正11年に出た講談の本『番町皿屋敷』には、天樹院乱行の事、という章まであります。
        card: {head: "講談『番町皿屋敷』", body: 天樹院乱行の事}
      # fact: senhime-54
      - 語り: それでも、昭和の初めには、吉田御殿は、男を引き込む女の屋敷を指す、決まり文句になっていました。
        tone: しみじみ
      # fact: senhime-53
      - 語り: 昭和12年に出た、歴史家の竜居松之助の本には、千姫の法名などを挙げて、吉田御殿での最期のような話は、あり得べき話ではない、と書かれています。
      - 語り: 救い出された姫の物語は、こうして、記録を離れて、生き続けました。
        tone: しみじみ
      - 語り: では、本当の千姫は、どんな最期を迎えたのか。
        hook: true
      - 語り: 70年の人生が、静かに、終わりに近づいていました。
        tone: 重い
        hook: true

  # ================================================================ まとめ（1666年の最期→残ったもの→答え→冒頭に戻る）
  - title: まとめ：千姫は、救い出されたあとの50年を、どう生きたのか
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1666
    lines:
      - 語り: 寛文6年、1666年の、2月6日。夜明け前の寅の刻に、天樹院は亡くなりました。
        tone: 重い
        card: {head: "寛文6年2月6日", body: 天樹院が亡くなる}
      # fact: senhime-36
      - 語り: 幕府の記録、『年録』。その記録には、こうあります。この春まで、日に日に、よくなっていた。けれど、年のため、にわかに、容体が改まった。御年、70。
        tone: しみじみ
      # fact: senhime-37
      - 語り: 亡くなった年は、記録や解説によって、「69歳」「70歳」「71歳」「73歳」と分かれます。生まれから数え直すと、数えで70歳。満では68歳でした。
        figure: {type: stats, title: 千姫が亡くなった年齢　記録の違い, items: [[年録（幕府の記録）, 70歳, 数え年で合う], [本朝武家諸姓分脈系図, 71歳, 江戸の写本], [諸家系譜, 73歳, 江戸の写本]], upto: 3}
      - 語り: その日の夕方、亡きがらは、小石川の伝通院へ送られました。
        figure: null
      # fact: senhime-36
      - 語り: 養子の綱重には、養母の死として、将軍から使いが遣わされた。江戸の町では、7日のあいだ、鳴り物が止められた、とあります。
      # fact: senhime-39
      - 語り: 2か月後の4月3日。天樹院の屋敷は、取り壊され、その建物は、茨城の弘経寺など、いくつかの寺に、分け与えられました。
        card: {head: "寛文6年4月", body: 屋敷を寺へ分け与える}
      # fact: senhime-38
      - 語り: 千姫の墓は、今、小石川の伝通院、茨城県常総市の弘経寺、京都の知恩院の、少なくとも3か所にあります。
        card: {head: "千姫の墓", body: 伝通院・弘経寺・知恩院}
      # fact: senhime-40
      - 語り: 弘経寺には、髪を下ろしたあとの千姫を描いた、と伝わる姿絵が、残っています。描いたのが誰かも、いつかも、分かっていません。
        tone: しみじみ
      - 語り: 千姫は、大坂城から救い出されたあと、50年を、どう生きたのか。
        tone: 疑問
        pause: 0.6
      - 語り: 救い出されて1年あまりで、千姫をめぐって、ひとりの大名が死んだ。姫路では、子を失い、それを、最初の夫の恨みだと言われた。
        tone: しみじみ
      - 語り: 江戸に戻ってからは、天樹院として、およそ40年。将軍の姉の力を使って、秀頼の娘の寺を、建て直した。
        tone: しみじみ
      - 語り: 後の世が作った、吉田御殿の千姫とは、まるで違う。千姫は、豊臣と徳川の、両方の家を背負ったまま、生きた人でした。
        tone: しみじみ
        pause: 0.6
      - 語り: 1615年、燃える大坂城から救い出された、数えで19歳の妻。その先には、まだ、50年あまりの道が、続いていました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
