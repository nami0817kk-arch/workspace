# 1本に1つの問い＝「千姫は、大坂城から救い出されたあと、50年をどう生きたのか」。主役は千姫1人。答えの席＝50年の生き方（題名でもサムネでも明かさない）。
#   冒頭＝誰でも知る一点（燃える大坂城から救い出された千姫）→意外な一点（1年後、嫁入りの輿を奪うと言った大名が立てこもる・死に方が記録で違う）→吉田御殿の歌のもとは宿場の歌→問い→かけら（怨霊・竹橋の40年・尼寺の建て直し）。
# 既出と重ねない：大坂の陣と落城（scripts/hideyori-if.yaml・yodo-story.yaml・sanada.yaml）は冒頭の1行だけ。hideyori-if の天秀尼の助命・37歳の死は1行にとどめ、寺法・再建・会津の一件・幕府の検分の新しい話にする。
