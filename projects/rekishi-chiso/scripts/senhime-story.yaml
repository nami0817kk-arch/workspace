# 型の作り：序章／第1章 坂崎出羽守の事件（1616、食い違い①理由・②死に方）／第2章 姫路の10年（1616〜1626）／第3章 竹橋の天樹院（1626〜1651）／
#   第4章 天秀尼と東慶寺（1615〜1645）／第5章 吉田御殿の伝説（後世の作り話、食い違い③住まい）／まとめ 1666年の最期（年齢の食い違いは1行）→答え→冒頭に戻る。
# 計算（自分で計算し直した）：生まれ 慶長2年4月11日＝1597年5月26日。慶長20年（1615）5月に数え19。元和2年（1616）に数え20。忠刻は慶長元年（1596）生まれ → 1616年に数え21、寛永3年（1626）に数え31。
#   千姫は1626年に数え30。1635年に数え39。死 寛文6年2月6日＝1666年3月11日 → 数え70（1666−1597＋1）・満68（誕生日の5月26日の前）。1615→1666＝51年（50年あまり）。1626→1666＝40年。
#   幸千代 1619生→1621没＝数え3。家光 慶長9年（1604）生 → 1644年に数え41。綱重 1644年生 → 慶安元年（1648）に数え5。『平家女護島』享保4年（1719）は千姫の死から53年（50年あまり）。
#   『武将感状記』正徳6年（1716）は会津の一件（1639〜1643）から70年あまり。東慶寺の寺例書 明和5年（1768）は天秀の入寺（1615）から153年（150年あまり）。山本有三『坂崎出羽守』1921年。
#   コックスの日記の日付は大日本史料の換算で元和2年9月10日。和暦→西暦：元和2年＝1616、元和3年＝1617、元和4年＝1618、元和5年＝1619、元和7年＝1621、元和9年＝1623、寛永3年＝1626、寛永5年＝1628、寛永8年＝1631、寛永11年＝1634、寛永12年＝1635、寛永16年＝1639、寛永20年＝1643、正保元年＝1644、正保2年＝1645、慶安元年＝1648、慶安4年＝1651、寛文6年＝1666。
# 記録の食い違い：①坂崎が千姫を奪おうとした理由（及聞秘録・元寛日記＝家康の約束／柳生家譜＝千姫が嫌った／元和年録＝一番手柄の争い）
