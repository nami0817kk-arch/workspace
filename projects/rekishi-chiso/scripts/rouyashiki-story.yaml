sections:
  # ================================================================ 序章
  - title: 「畳を積んだ牢名主」　江戸の牢屋敷
    lines:
      - 語り: 時代劇の牢名主は、畳を高く積んで、その上に座ります。
        tone: 重い
      # fact: rouya-23
      - 語り: ところが幕府は、1777年に、役付きの囚人が、畳の数や厚さで差を付けることを、わざわざ禁じていました。
        card: {head: "1777年", body: 畳の数と厚さの差を禁じる}
      # fact: rouya-23, rouya-24
      - 語り: 禁じたということは、それが当たり前だったことをうかがわせます。江戸の牢の様子を書いた写本、牢獄秘録では、新入りは、畳1枚に、7人か8人。
        tone: 重い
      - 語り: ほとんどの囚人が、1人に畳1枚もない、その牢の中で、何が決まっていたのか。
        tone: 疑問
      # fact: rouya-74
      - 語り: 舞台は、江戸の小伝馬町の牢屋敷。中央区の解説によると、ふだん300人から400人、多いときは、その倍が入っていました。
        card: {head: "小伝馬町の牢屋敷", body: ふだん300人から400人}
      # fact: rouya-04, rouya-22
      - 語り: 実は、この牢の中を、細かい数字で書き残した囚人がいます。吉田松陰です。
      # fact: rouya-41, rouya-43, rouya-38
      - 語り: 松陰は、1854年と1859年の二度、この牢に入りました。1854年の、5か月あまりの見聞を書いた、野山雑著には、飯の盛り方から、病で死ぬ人の数まで、書かれています。
        card: {head: "吉田松陰", body: 二度この牢に入る}
      # fact: rouya-06
      - 語り: 牢屋敷では、身分によって、入る牢が分かれていました。
        hook: true
      # fact: rouya-06
      - 語り: では、身分の高い旗本は、どこに入ったのか。
        hook: true

  # ================================================================ 第1章 身分の牢
  - title: 「誰がどの牢に入る？」　身分で分けた牢
    lines:
      # fact: rouya-01
      - 語り: 牢屋敷は、はじめ常盤橋御門の外にあり、慶長年間に、小伝馬町へ移ってきました。中央区は、幕府の地誌、御府内備考の記事として、そう紹介しています。
      # fact: rouya-02, rouya-03
      - 語り: 広さは2600坪あまり。南を除く三方は、堀と土手。牢の建物は、練塀で囲まれていました。
      # fact: rouya-06
      - 語り: 牢は、身分で分かれました。将軍にお目見えできる旗本で、500石に満たない者は、揚座敷。500石以上の旗本は、牢屋敷には入れず、大名などに預けました。
        figure: {type: table, title: 身分で分けた牢, cols: [入る人, 牢], rows: [[お目見え以上の旗本（500石未満）, 揚座敷], [御家人・大名の家来・医師など, 揚屋], [町人などの庶民, 大牢], [家も籍もない無宿の者, 二間牢]], upto: 1}
      # fact: rouya-06
      - 語り: お目見えできない御家人や、大名の家来は、揚屋。僧侶や神官は、格式によって、揚座敷か揚屋に分けられ、医師も揚屋に入りました。
        figure: {type: table, title: 身分で分けた牢, cols: [入る人, 牢], rows: [[お目見え以上の旗本（500石未満）, 揚座敷], [御家人・大名の家来・医師など, 揚屋], [町人などの庶民, 大牢], [家も籍もない無宿の者, 二間牢]], upto: 2}
      # fact: rouya-06
      - 語り: 町人などの庶民は、大牢。家も籍もない、無宿の者は、二間牢です。
        figure: {type: table, title: 身分で分けた牢, cols: [入る人, 牢], rows: [[お目見え以上の旗本（500石未満）, 揚座敷], [御家人・大名の家来・医師など, 揚屋], [町人などの庶民, 大牢], [家も籍もない無宿の者, 二間牢]], upto: 4}
      # fact: rouya-10
      - 語り: 揚座敷の番は、牢屋同心が2人ずつ、昼も夜も、交代で務めました。
        figure: null
      # fact: rouya-07
      - 語り: では、揚屋なら楽だったのか。世界大百科事典によれば、揚屋は、食事も、牢名主の支配も、庶民の牢と、それほど違いませんでした。
        tone: 疑問
      # fact: rouya-08
      - 語り: 女の牢は、別の建物ではありません。西口の揚屋の一部屋を、女牢としていました。
      # fact: rouya-09
      - 語り: 百姓のための牢は、1775年に、新しく建てられます。そのとき、見張りの同心も、8人増やされました。
        card: {head: "1775年", body: 百姓牢を新しく建てる}
      # fact: rouya-04
      - 語り: 1854年に松陰が入ったとき、東側には、4つの牢が並んでいました。1つ目の東口揚屋に、松陰。2つ目の東奥揚屋には、佐久間象山がいました。
        card: {head: "1854年", body: 松陰が東口揚屋に入る}
      # fact: rouya-04
      - 語り: 3つ目の東大牢は、松陰の記録では、仮の百姓牢と呼ばれていました。そこには、松陰と一緒に、異国の船に乗り込もうとした、金子重輔が入れられていました。
      # fact: rouya-05
      - 語り: 松陰の手紙では、牢ごとの人数は、東の大牢が、30人から50人。東の二間牢が、70人から90人。
        figure: {type: bars, title: 松陰が書いた牢ごとの人数, bars: [[東の大牢, 50], [東の二間牢, 90], [西の二間牢, 100]], labels: [30〜50人, 70〜90人, ときに100人], upto: 2}
      # fact: rouya-05
      - 語り: 西の二間牢は、ときに100人にも及ぶ、と江戸獄記にあります。
        figure: {type: bars, title: 松陰が書いた牢ごとの人数, bars: [[東の大牢, 50], [東の二間牢, 90], [西の二間牢, 100]], labels: [30〜50人, 70〜90人, ときに100人], upto: 3}
      # fact: rouya-38
      - 語り: 牢屋敷の出入りは、1日に10数人を下らなかった、といいます。
      # fact: rouya-11
      - 語り: この牢屋敷を預かったのは、代々、同じ名を名乗る一家でした。
        hook: true
        figure: null
      # fact: rouya-11
      - 語り: その一家の主は、江戸城に、上がらなかったといわれます。
        hook: true

  # ================================================================ 第2章 石出帯刀
  - title: 「牢屋奉行は誰？」　代々の石出帯刀
    lines:
      # fact: rouya-11
      - 語り: 牢屋敷の長は、牢屋奉行。役の名は囚獄で、町奉行の下に置かれました。代々、石出帯刀を名乗る、石出家が務めました。
        card: {head: "牢屋奉行", body: 代々の石出帯刀}
      # fact: rouya-11
      - 語り: 禄は300俵に、役の手当てが10人扶持。格は与力と同じで、将軍にお目見えできない身分です。
      # fact: rouya-11
      - 語り: 江戸城には上がらず、ほかの幕臣とも付き合わなかった、といわれます。
      # fact: rouya-12
      - 語り: 石出家の由緒書は、先祖を本多図書とします。関東の盗賊を鎮めよと命じられて下り、それから牢を預かった、と伝えます。
      # fact: rouya-13
      - 語り: なかでも名高いのが、石出吉深、号を常軒といいます。1615年に生まれ、1689年に亡くなりました。
      # fact: rouya-13
      - 語り: 牢を預かる一方で、国学や和歌に親しみ、源氏物語の注釈書、窺原抄を書いています。
        card: {head: "石出吉深", body: 源氏物語の注釈書を書く}
      # fact: rouya-14, rouya-54
      - 語り: 1657年の明暦の大火では、町奉行に断りなく、戻ることを条件に、囚人を放ちました。
      # fact: rouya-54, rouya-14
      - 語り: 徳川実紀には、囚人はみな戻った、とあります。これが、のちに切り放ちと呼ばれる決まりの、始まりです。
      # fact: rouya-15
      - 語り: 石出帯刀の下で、牢の番をしたのが、牢屋同心です。その数は、のちに58人になりました。
      # fact: rouya-15, rouya-17
      - 語り: なかでも、鍵を預かる鍵役は、重い役でした。松陰のころには、6人いました。
      # fact: rouya-16
      - 語り: さらに、下男が38人。給金は、1年に1両2分と、1人扶持です。
        card: {head: "牢屋下男 38人", body: 給金は1年に1両2分}
      # fact: rouya-16
      - 語り: 牢獄秘録によると、下男は、囚人の家へ、金品をもらいに行くことがあり、半年勤めれば、20両から30両の金がたまったといいます。
      - 語り: 半年で、1年の給金の、13倍から20倍です。
        figure: {type: calc, title: 牢屋下男の半年, terms: [[20〜30両, 半年でたまる金], [1両2分, 1年の給金], [13〜20倍]], ops: [÷, ＝]}
      # fact: rouya-27
      - 語り: 牢のまわりで、お金が回っていたのは、下男だけではありません。
        hook: true
        figure: null
      # fact: rouya-27
      - 語り: 新入りが、こっそり持ち込むお金がありました。
        hook: true

  # ================================================================ 第3章 入牢とツル
  - title: 「新入りは何を持ち込んだ？」　ツルと入牢の作法
    lines:
      # fact: rouya-21
      - 語り: ここからは、牢獄秘録が手がかりです。法制史家の尾佐竹猛が、江戸の牢の写本をもとに語った内容を、1939年にまとめた本です。
      # fact: rouya-28
      - 語り: 牢に入る日。鍵役が、金銀や刃物や書物や火道具は、持ち込んではならぬぞ、と申し渡します。
      # fact: rouya-28
      - 語り: 着物も、ふんどしも、結った髪までほどいて、改めました。新入りは、裸のまま着物を抱えて、留口という入り口をくぐります。
      # fact: rouya-28
      - 語り: 中では、牢名主と一番役が、両側に控え、「サアコイ」と声をかけて、新入りの尻を叩きました。
      # fact: rouya-28
      - 語り: ただし、入墨のある者、つまり前にも罪を犯した者には、「マケテやるぞ」と言って、叩かなかったといいます。
      # fact: rouya-27
      - 語り: それでも、新入りは、お金を持ち込みました。ツル、つる金と呼ばれます。着物に縫い込んだり、綿にくるんで、体の中に隠したりしました。
        card: {head: "ツル", body: 新入りが持ち込むお金}
      # fact: rouya-27
      - 語り: 持ち込んだツルは、牢名主に差し出され、五番役までの役付きで、分けました。
      # fact: rouya-27
      - 語り: ツルの多い少ないで、牢の中の扱いは、大きく変わりました。
        tone: 重い
      # fact: rouya-27
      - 語り: 1914年の古事類苑の概説にも、ツルを持ってこない者は、こき使われる悪い習わしがあった、とあります。
      # fact: rouya-29
      - 語り: 牢には、キメ板と呼ぶ、桐の板もありました。囚人の名や、買い物の願いを、錐で刻んで出す道具です。
      # fact: rouya-29
      - 語り: その板は、牢名主が罰として、背中を打つのにも使われました。
      # fact: rouya-23
      - 語り: 1777年の掟書は、新入りを、キメ板で強く叩くことも、禁じています。
      # fact: rouya-21
      - 語り: 牢の中には、囚人どうしの役がありました。
        hook: true
      # fact: rouya-24
      - 語り: その役によって、1枚の畳に座る人の数まで、違いました。
        hook: true

  # ================================================================ 第4章 畳と役付き
  - title: 「畳1枚に何人？」　牢名主と12人の役付き
    lines:
      # fact: rouya-21
      - 語り: 牢の中の役付きを、牢内役人といいます。役人といっても、囚人の中から選ばれた、囚人です。
      # fact: rouya-21
      - 語り: 牢名主を頭に、添役、角役に二番役と続き、食事を扱う、五器口番という役までありました。
        card: {head: "牢内役人", body: 牢名主を頭に、囚人から選ぶ}
      # fact: rouya-22
      - 語り: 松陰によると、役付きは、揚屋に6人、牢に12人。
      # fact: rouya-22
      - 語り: 役付きは、飯の盛り方で分かりました。物相という器の飯を、役付きには高く盛り、ほかの者には平らに盛りました。
        card: {head: "物相の飯", body: 役付きは高く盛る}
      # fact: rouya-24
      - 語り: 畳の割り当ても、役で決まりました。牢名主ら上の役付きは、畳1枚に1人。その下の三番役と四番役は、1枚に2人。
        figure: {type: bars, title: 畳1枚に座った人数, bars: [[牢名主ら上の役, 1], [三番役・四番役, 2], [差し入れで繰り上げ, 4], [新入り, 8]], labels: [1人, 2人, 4人ほど, 7〜8人], upto: 2}
      # fact: rouya-24
      - 語り: 新入りは、「向こう通り」と呼ばれる所で、畳1枚に、7人か8人。
        tone: 重い
        figure: {type: bars, title: 畳1枚に座った人数, bars: [[牢名主ら上の役, 1], [三番役・四番役, 2], [差し入れで繰り上げ, 4], [新入り, 8]], labels: [1人, 2人, 4人ほど, 7〜8人], upto: 4}
      # fact: rouya-24
      - 語り: 外から差し入れが届くと、順に繰り上がり、1枚に4人ほどの所へ、移されました。
        figure: null
      # fact: rouya-25
      - 語り: 松陰の書く数は、もっと多くなります。無宿の牢では、畳1枚に、15人から18人を座らせるに至る、と書いています。
        tone: 疑問
      # fact: rouya-74
      - 語り: ちなみに、世界大百科事典では、30畳敷きの大牢に、100人以上。1畳に3人あまりで、数は、記録によってばらばらです。
      - 語り: では、時代劇のように、畳を高く積み上げた牢名主は、記録にあるのか。
        tone: 疑問
      # fact: rouya-26
      - 語り: 今回開いた、江戸時代の記録には、牢名主が畳を何枚重ねたかは、見当たりませんでした。10枚ほど、という数が出てくるのは、明治より後の本です。
      # fact: rouya-23
      - 語り: 江戸の記録にあるのは、1777年の掟書の言葉です。役付きが、名を付けて、畳の数や厚さ、居場所の広さを、思うままにしてきた、とあります。
      # fact: rouya-23
      - 語り: 掟書は、牢名主には、牢に長くいる者から順に申し付けよ、とも定めました。
      # fact: rouya-23, rouya-24
      - 語り: つまり、座る場所の広さは、牢の中の役で決まっていたのです。
        tone: しみじみ
      # fact: rouya-39
      - 語り: 座る所の話には、もっと重い記録もあります。尾佐竹の解説には、夜のうちに同じ牢の者を殺して、病死と届ける、作造りがあった、とあります。
        tone: 重い
      # fact: rouya-32
      - 語り: その牢の食事にも、細かい決まりがありました。
        hook: true
      # fact: rouya-32
      - 語り: 差し入れの飯は、白い飯では、いけませんでした。
        hook: true

  # ================================================================ 第5章 食事と差し入れ
  - title: 「何を食べた？」　物相の飯と差し入れ
    lines:
      # fact: rouya-30
      - 語り: 食事は、1日に2回。朝の五つは、今の目安で午前8時ごろ。夕方の七つは、午後4時ごろです。
        card: {head: "食事は1日2回", body: 朝五つと夕七つ}
      # fact: rouya-30
      - 語り: 飯は、物相に盛ったまま、人数分が入れられました。汁は手桶で、香の物は、糠漬けの大根。そのたびに、飲み湯も出ました。
      # fact: rouya-31
      - 語り: 1人がどれだけ食べられたのか。江戸の牢の飯の量は、確かめられる記録が、見つかりませんでした。
      # fact: rouya-31
      - 語り: 参考までに、京都の牢の書き上げでは、1人1日5合の見積もりで、1日平均77人ほどを養っています。これは江戸ではなく、京都の数字です。
      # fact: rouya-32
      - 語り: 外からの差し入れは、届物、俗に牢見舞といいました。
      # fact: rouya-32
      - 語り: ただの白い飯は、牢でも出るので、差し入れはできません。茶飯や菜飯や、海苔めしなど、色の付いた飯にしました。
        card: {head: "差し入れの飯", body: 白い飯はだめ}
      # fact: rouya-32
      - 語り: 届いた飯は、牢の見張りの張番が、十文字に割って、中に何も隠していないかを、確かめました。
      # fact: rouya-32
      - 語り: 強飯と餅は、牢の中ではもたれて熱病になる、として禁じられました。唐辛子も、だめでした。
      # fact: rouya-32
      - 語り: 蕎麦も届きました。鉄砲町あたりのそば屋に頼み、四斗樽に入れて送り、つゆは手桶で届けたといいます。
      # fact: rouya-33
      - 語り: 湯の回数は、記録で違います。牢獄秘録では、20日に1度ほど。1度に、5人か6人ずつ入りました。
        figure: {type: stats, title: 湯に入れた回数, items: [[牢獄秘録, 20日に1度ほど, 1度に5人か6人], [松陰, 夏は月に6度, 春と秋は5度　冬は4度], [古事類苑の概説, 月に数度, 行水]], upto: 1}
      # fact: rouya-33
      - 語り: 松陰は、湯の日が、夏は月に6度、春と秋は5度、冬は4度だった、としています。
        figure: {type: stats, title: 湯に入れた回数, items: [[牢獄秘録, 20日に1度ほど, 1度に5人か6人], [松陰, 夏は月に6度, 春と秋は5度　冬は4度], [古事類苑の概説, 月に数度, 行水]], upto: 2}
      # fact: rouya-33
      - 語り: 古事類苑の概説は、行水は1か月に数度。
        figure: {type: stats, title: 湯に入れた回数, items: [[牢獄秘録, 20日に1度ほど, 1度に5人か6人], [松陰, 夏は月に6度, 春と秋は5度　冬は4度], [古事類苑の概説, 月に数度, 行水]], upto: 3}
      # fact: rouya-34
      - 語り: 牢獄秘録では、髪は年に1度、7月に、そろって剃りました。松陰も、その日を、7月12日と書いています。ただ、古事類苑は、7月と12月の2度、としています。
        card: {head: "髪は7月にそろって剃る", body: 牢獄秘録と松陰}
        figure: null
      # fact: rouya-34
      - 語り: その日は、江戸中の髪結が、町ごとに1人ずつ、家主に付き添われて出てきました。囚人は、30人ほどずつ、手錠をかけて、牢の庭へ出されました。
      # fact: rouya-34
      - 語り: 牢名主と一番役ほか、2人ほどは、月に1度、剃ってもらえました。
      # fact: rouya-35
      - 語り: けれど、牢の中には、もう一つ、命にかかわるものがありました。病です。
        hook: true
      # fact: rouya-38
      - 語り: 松陰は、牢で死んでいく人を、自分の目で見ていました。
        hook: true

  # ================================================================ 第6章 病と死
  - title: 「牢で何人が死んだ？」　牢疫病と溜
    lines:
      # fact: rouya-35
      - 語り: 牢の中の病は、牢疫病と呼ばれました。
      # fact: rouya-35
      - 語り: 牢獄秘録によると、風が通らず、人の臭いが、板や柱にまで染みつき、新入りは、その臭いに当たって病んだ、といいます。
      # fact: rouya-35
      - 語り: 獄中の病は、たいてい熱病なので、昼すぎの八つ時には、小豆の粥が出た、と松陰は書きます。内科の医者が1人、泊まり込んでいました。
      # fact: rouya-38
      - 語り: そして、1854年に入牢した松陰が、自分の目で見た数です。東と西の二間牢と、西の大牢。この3つの牢だけで、病で死ぬ人は、毎日3人を下らない。
        tone: 重い
        card: {head: "毎日3人を下らない", body: 3つの牢の病死（松陰）}
      # fact: rouya-38
      - 語り: 一方で、揚屋と女牢と百姓牢では、牢で死ぬ人は、ごく少ない、とも書いています。
      # fact: rouya-38
      - 語り: 幕府も、数を見ていました。1719年には、毎月の、牢で死んだ人と病人の数を、月番の老中へ書き出すよう、命じています。
      # fact: rouya-74
      - 語り: 世界大百科事典は、牢で死ぬ人が、1年に2,000人に及んだこともある、と書きます。
        tone: 重い
      # fact: rouya-36
      - 語り: 重い病の囚人は、溜へ移されました。浅草の溜は、非人頭の車善七が、品川の溜は、松右衛門が、預かりました。
        figure: {type: map, title: 牢屋敷と2つの溜, bounds: [139.70, 139.83, 35.60, 35.74], places: [[伝馬町の牢屋敷, 139.779, 35.690], [浅草の溜, 139.793, 35.723], [品川の溜, 139.738, 35.616], [江戸城, 139.752, 35.685]], reveal: true}
      # fact: rouya-36
      - 語り: 浅草の溜の始まりは、1687年の3月26日。囚人2人を、善七に預けたのが、最初でした。
        figure: null
      # fact: rouya-37, rouya-65
      - 語り: のちに、1742年の御定書百箇条は、牢に入ってから重い病になった者は、溜へ移す、と定めます。
      # fact: rouya-57
      - 語り: では、牢を生きて出る道は、どこにあったのか。
        hook: true
      # fact: rouya-69, rouya-71
      - 語り: 出る道は、1つではありませんでした。
        hook: true

  # ================================================================ 第7章 出る道
  - title: 「牢を出る道は？」　吟味・刑・赦・切り放ち
    lines:
      # fact: rouya-57
      - 語り: 江戸時代の牢屋は、刑を受ける所ではなく、裁きを待つ人を留めておく所でした。世界大百科事典は、拘置所の性格をもつもの、としています。
        card: {head: "牢屋敷", body: 裁きを待つ人を留める所}
      # fact: rouya-58
      - 語り: 牢に入れておく刑も、あるにはありました。終わりのない、永牢です。ただ、費用がかさみ、ほかの囚人にも悪い、として、あまり使われませんでした。
      # fact: rouya-60
      - 語り: 裁きのための調べを、吟味といいます。
      # fact: rouya-59
      - 語り: 吟味は、奉行が、本人かどうかを確かめるところから始まります。重いときは牢へ入れ、軽いときは、手鎖をかけて、町などに預けました。
      # fact: rouya-60
      - 語り: 有罪にするには、本人の自白が要りました。しかも、自白だけで足りました。
      # fact: rouya-61
      - 語り: 6か月たっても決まらない事件は、7か月目に、老中へ届け出る決まりでした。六か月届です。
      # fact: rouya-62, rouya-63
      - 語り: 自白させるために、牢屋敷の中で、痛めつけることもありました。ただ、それを使わずに自白させるのが、役人の腕とされました。
      # fact: rouya-66
      - 語り: 刑が決まると、軽い者は、牢屋敷の門前に、むしろを敷いて、叩きの刑を受けました。軽い叩きは50回、重い叩きは100回です。
      # fact: rouya-66, rouya-58
      - 語り: 叩きの刑は、1720年、耳や鼻をそぐ刑に代えて始まりました。女には、叩きの代わりに、30日か50日、牢に入れる過怠牢を科しました。
      # fact: rouya-68
      - 語り: 遠島の船は、春と秋の、年に2回。流人は、出る前の日に、牢の中の遠島部屋へ移され、当日の朝、裏門から、船の番所へ連れて行かれました。
        card: {head: "遠島", body: 船は春と秋の年2回}
      # fact: rouya-68
      - 語り: 船は鉄砲洲に3日とどまり、家族は、役人の計らいで、食べ物や飲み物を渡すことができました。
      # fact: rouya-67
      - 語り: 死罪は、牢屋敷の中で行われました。中央区によると、その場所は、敷地の南東の角でした。
      # fact: rouya-69
      - 語り: もう1つの道が、赦です。幕府や朝廷のお祝いや、将軍家の法事のときに出されました。
      # fact: rouya-69
      - 語り: 法事の赦では、寛永寺と増上寺が、許す者の名を書いた帳面を、幕府に回しました。
      # fact: rouya-69
      - 語り: 赦は、裁きを待つ者にも及びました。これを、当座の赦と呼びます。
      # fact: rouya-70
      - 語り: 赦の決まりは、1862年に、赦律として、33か条にまとめられます。遠島の者が許されるには、原則として、29年以上が要りました。
        card: {head: "赦律", body: 遠島は原則29年以上}
      # fact: rouya-72
      - 語り: 無宿の者や、刑を終えても引き取り手のない者もいました。1790年、火付盗賊改の長谷川平蔵の建言で、石川島に、人足寄場が置かれます。
      # fact: rouya-72
      - 語り: 寄場では、大工などの手業をさせ、賃金の3分の1を積み立てさせて、出るときに、元手として渡しました。
      # fact: rouya-71
      - 語り: そして、火事です。牢が焼けそうになると、囚人を外に放つ、切り放ちがありました。3日のうちに戻れば、罪を1段軽くしました。
      # fact: rouya-52
      - 語り: 1844年、牢屋敷の火事で、戻らなかった囚人がいます。蘭学者の、高野長英です。
      # fact: rouya-52, rouya-71
      - 語り: 長英は、蛮社の獄で、永牢となっていました。幕府の記録によると、その年の6月、長英は、牢屋敷に出入りする栄蔵という男に、金11両を渡しました。
      # fact: rouya-52
      - 語り: 幕府の記録では、栄蔵に火を付けさせ、その火事にまぎれて、逃げた、とされています。
        card: {head: "1844年", body: 高野長英、11両で火を付けさせる}
      # fact: rouya-71
      - 語り: 長英が永牢を言い渡されたのは、1839年。牢を出るまで、およそ5年がたっていました。
      # fact: rouya-52
      - 語り: 捕まった栄蔵が、長英に頼まれた、と申し立てたため、長英の人相書が、諸国に回されました。
      # fact: rouya-53
      - 語り: 火を付けた栄蔵は、1846年、永牢を言い渡されています。
      # fact: rouya-43
      - 語り: 長英の脱獄から15年後。松陰が、再びこの牢に入ります。
        hook: true
      # fact: rouya-50
      - 語り: 彼が牢で書いた遺書は、同じものが、2部ありました。
        hook: true

  # ================================================================ 第8章 松陰と沼崎
  - title: 「最後の文はどこへ？」　吉田松陰と名主代
    lines:
      # fact: rouya-43
      - 語り: 1859年の7月9日。吉田松陰は、評定所で取り調べを受け、その日のうちに、伝馬町の牢に入りました。
      # fact: rouya-44
      - 語り: 入ったのは、西奥揚屋。松陰は手紙に、思いのほか安楽な世界で、大いに喜んだ、と書いています。
      # fact: rouya-45
      - 語り: 同じ手紙によると、西奥揚屋は、長く空いていた牢でした。前の年の冬、11月15日に、牢屋敷が焼け、それからは、仮の牢だったといいます。
      # fact: rouya-46
      - 語り: 牢の中で、松陰が恩を受けた人がいます。名主代、つまり牢名主の代わりを務めた囚人の、沼崎吉五郎。もとは、奥州の福島藩の武士でした。
        card: {head: "沼崎吉五郎", body: 牢名主の代わりを務めた囚人}
      # fact: rouya-46
      - 語り: 松陰は、沼崎を、篤志の人、と書き、自分の首を葬ることを、沼崎たちに頼み、その代金は3両ほど、と書き残しました。
      # fact: rouya-49
      - 語り: その年の10月7日、越前の橋本左内が処刑されます。左内は東の揚屋に、わずか5日か6日いただけでした。松陰は西の牢にいました。左内は東の牢です。2人は、顔を合わせないままだった、といいます。
      # fact: rouya-47
      - 語り: 10月25日、松陰は、留魂録を書き始め、26日の夕暮れに、筆を止めました。
      # fact: rouya-47
      - 語り: 冒頭の歌は、身はたとひ、武蔵の野辺に朽ちぬとも、留め置かまし、大和魂。
        tone: しみじみ
      # fact: rouya-48
      - 語り: 翌日の10月27日、松陰は処刑されました。
        tone: 重い
      # fact: rouya-50
      - 語り: 留魂録の1部は、処刑のあとまもなく、牢の役人を経て、仲間の手に渡り、萩の高杉晋作や久坂玄瑞らへ送られました。
      # fact: rouya-51
      - 語り: もう1部は、沼崎が、そのまま手もとに持ち続けました。
      # fact: rouya-46
      - 語り: 沼崎は、のちに遠島となり、島から戻ってからも、その1部を手放しませんでした。
      # fact: rouya-51
      - 語り: 1876年。神奈川の役人、野村靖のもとへ、1人の老人が訪ねてきました。老人は、懐から小さな冊子を出します。
        card: {head: "1876年", body: 沼崎が留魂録を届ける}
      # fact: rouya-51
      - 語り: 自分は、吉田先生と同じ牢にいた、沼崎吉五郎だ。そう名乗った、と野村自身が書いています。
      - 語り: 松陰の死から、17年がたっていました。
        tone: しみじみ
      # fact: rouya-51
      - 語り: いま、その留魂録は、萩の松陰神社にあります。
      # fact: rouya-18
      - 語り: では、その牢屋敷は、明治になって、どうなったのか。
        hook: true
      # fact: rouya-18
      - 語り: 跡地には、しばらく、人が寄りつきませんでした。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：1777年の掟書と、牢の中の決まり
    lines:
      # fact: rouya-18
      - 語り: 1875年の5月。牢屋敷は取り壊され、市谷へ移りました。
      # fact: rouya-18
      - 語り: 跡地は、しばらく草原でした。小さな遊園にしても、人が嫌って入らなかった、と明治の東京案内は書きます。
      # fact: rouya-19
      - 語り: 1882年か83年ごろ、有志が、大安楽寺などの寺を、跡地に建てました。
      - 語り: ほとんどの囚人が、1人に畳1枚もない牢の中で、決まっていたこと。
        tone: しみじみ
      # fact: rouya-06, rouya-24
      - 語り: 入る牢は、身分で決まりました。座る広さは、牢の中の役で決まりました。
      # fact: rouya-23
      - 語り: 幕府が1777年に禁じたあとも、牢の中の役は残り、松陰が1854年に書き留めています。
      # fact: rouya-27
      - 語り: そして扱いは、持ち込んだツルで変わりました。
      # fact: rouya-30, rouya-33, rouya-34
      - 語り: 食事は1日2回。湯の日と、髪を剃る日も、決まっていました。
      # fact: rouya-57, rouya-69, rouya-71, rouya-38
      - 語り: 出る道は、吟味の末の刑か、赦か、火事の切り放ち。そして、二間牢や大牢では、病で亡くなる人が、毎日のように出ていました。
      # fact: rouya-46, rouya-51
      - 語り: 時代劇では、畳を積んで座る牢名主。その代わりを務めた囚人が、松陰の遺書の、留魂録を、17年のあいだ、手放さずに持ち続けていました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
