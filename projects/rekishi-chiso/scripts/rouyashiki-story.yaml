# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  時代劇の牢名主は、畳を高く積んで座ります。ところが幕府は1777年、牢の中で役の名を付けて、畳の数や厚さに差を付けることを、わざわざ禁じていました。
  江戸の写本『牢獄秘録』では、新入りは畳1枚に7人か8人。ほとんどの囚人が、1人に畳1枚もない牢の中で、何が決まっていたのか。
  牢に二度入った吉田松陰の見聞録と、江戸の写本『牢獄秘録』、幕府の決まりから、江戸の小伝馬町の牢屋敷の暮らしを、入る所から出る所までたどります。
  この動画でわかること
  ・身分によって、誰がどの牢に入ったか
  ・牢屋奉行の石出帯刀と、牢の番をした人の数
  ・新入りの持ち込んだお金「ツル」と、牢の中の役付き12人
  ・食事・差し入れ・湯・髪の決まりと、牢の病
  ・牢を出る道（吟味・刑・赦・切り放ち）と、留魂録を守った囚人
description_note: |-
  この動画に、想像の台詞や作った話はありません。牢の中の様子は、吉田松陰『野山雑著』（『松陰先生遺著』1909）・『江戸獄記』と書簡（『吉田松陰全集』）、尾佐竹猛 述『牢獄秘録』（1939）、『古事類苑』法律部（1914。牢内掟書・『徳川禁令考』ほかを引く）、『徳川実紀』、中央区の文化財の解説、世界大百科事典・日本大百科全書・日本国語大辞典などから取りました。
  牢の人数、畳1枚に座らせた人数、湯の回数、牢屋同心の人数は、記録によって違います。牢名主が畳を何枚重ねたかは、今回開いた江戸時代の記録には見つかりませんでした。
  年の換算と割り算は、自分で計算したものです。時刻は目安です。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵は、AI による想像図です。

en:
  title: "Inside Edo's Kodenmacho Prison: When One Tatami Mat Was Shared by Seven, What Were the Rules?"
  description: |-
    In period dramas, the cell boss sits on a tall stack of tatami mats. Yet in 1777 the shogunate formally banned cell officers from claiming extra or thicker mats by rank.
    The Edo-era manuscript "Rougoku Hiroku" says newcomers sat seven or eight to a single mat. What rules governed life in a cell where no one had a whole mat?
    Using the prison notes of Yoshida Shoin, who was jailed there twice, the manuscript "Rougoku Hiroku", and shogunate rules, we follow life in Edo's Kodenmacho prison from entry to release.
    In this video you will learn:
    - Who was put in which cell, by social rank
    - The hereditary prison warden Ishide Tatewaki and his staff
    - The smuggled money called "tsuru" and the twelve inmate officers
    - Rules on meals, gifts from outside, baths and haircuts, and prison sickness
    - The ways out (trial, punishment, amnesty, fire release) and the inmate who kept Shoin's last testament
    Japanese-language history video (Japanese audio). No invented dialogue.
  chapters:
    - "The Cell Boss and the Stack of Mats"
    - "Who Went into Which Cell?"
    - "The Hereditary Warden"
    - "What Did Newcomers Bring In?"
    - "How Many to a Mat?"
    - "What Did Prisoners Eat?"
    - "How Many Died in Prison?"
    - "The Ways Out"
    - "Where Did Shoin's Last Words Go?"
    - "Summary: What Was Decided Inside the Cell"

