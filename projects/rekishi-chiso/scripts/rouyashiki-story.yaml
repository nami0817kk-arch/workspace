# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と shogun-story.yaml・nagaya-if-story.yaml の型）。江戸の小伝馬町の牢屋敷の暮らし。2026-11-20 下書き。
# 公開の予定は 11/26 12:00。型は docs/story-main.md「00. 伸びる型」の E 暮らし型。主語は「小伝馬町の牢屋敷」という1つの場所で、最後まで主役。
#   誰でも持つ像＝時代劇の、畳を高く積んで座る牢名主。裏返す一点＝幕府は1777年に、役の名で畳の数や厚さに差を付けることを禁じていた（rouya-23）。
#   問い＝「1人に畳1枚もない牢の中で、何が決まっていたのか」。答え＝入る牢は身分、座る広さは牢の中の役、扱いは持ち込んだ金（ツル）、食事・湯・髪の日、出る道は吟味の末の刑・赦・切り放ち。
#   背骨の記録は2つ：吉田松陰『野山雑著』（1854年4月15日〜9月18日の在牢の見聞。『松陰先生遺著』第2巻 1909）と『牢獄秘録』（尾佐竹猛 述、1939。江戸の写本＋解説）。
#   想像の台詞なし。語りは剣崎1人。拷問・処刑・作造りは事実として短く（描写しない）。
# 既出と重ねない：明暦の大火（meireki-story）は台本に切り放ちを書いていない（grep で確認）が、ここでも2行で済ませる。長屋（nagaya-if-story）の暮らしの数字は使わない。
#   安政の大獄そのもの（ii-naosuke-story で扱った）は説明しない。松陰の回はまだ無い（posted.json に無し）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/小伝馬町牢屋敷_facts_20261120.yaml、rouya-01〜74。担当A=建物と身分・B=しきたりと食事と病・C=人物・D=出る道）にあるものだけ。
# 記録の食い違い（並べたもの3つ）：①畳1枚の人数（牢獄秘録 新入り7〜8人／松陰 無宿牢で15〜18人／世界大百科 30畳に100人以上）
#   ②湯の回数（牢獄秘録 20日に1度／松陰 夏6度・春秋5度・冬4度／古事類苑 月に数度）③留魂録（明治9年＝1876年に沼崎から野村へ／明治24年＝1891年に村塾へ納まる）。
#   照合で削った食い違い（11-20、流れの点検で「並べすぎ」）：石出の禄（300俵／300石）、同心の人数（40・50・56・58人。明暦の「二年丁酉」は干支が合わない）、浅草溜（1687／1689）、キメ板の寸法、牢の総人数。
# 照合で直したこと（11-20、事実2人・流れ1人）：牢獄秘録は年代不詳の写本（「そのころの記録」と言わない）・500石以上は「牢屋敷に入れず大名などに預けた」・堀は南を除く三方・
#   揚座敷の「7畳」は図の OCR で不確か（言わない）・「仮百姓牢」の呼び名は松陰のころ（1775年より前とは言えない）・二間牢の数は松陰の手紙の数と出どころを言う・
#   唐辛子に熱病の理由は無い・髪は牢獄秘録の数（古事類苑は7月と12月）・1718年の大岡らの報告は年が確かめられないので使わない・
#   留魂録のもう1部は処刑の前日に沼崎に託した（野村の跋）・沼崎の遠島は処刑前の手紙に既に書いてある。字幕で和暦と西暦が続くと数字がつながるので、語りは西暦だけにした。
# 自分で計算した数（全部計算し直した）：
#   2600坪×3.3058＝8,595㎡（中央区の数と合う）。480坪×3.3058＝1,587㎡（中央区は約1586㎡）。
#   安永6年＝1777年、安永4年＝1775年、貞享4年＝1687年、元禄2年＝1689年、享保3年＝1718年、享保4年＝1719年、寛保2年＝1742年、享保5年＝1720年、
#   文久2年＝1862年、弘化元年＝1844年、弘化3年＝1846年、天保10年＝1839年、明暦3年＝1657年、明暦2年＝1656年、寛文2年＝1662年、安政元年＝1854年、安政5年＝1858年、安政6年＝1859年、
#   明治8年＝1875年、明治9年＝1876年、明治15〜16年＝1882〜83年、明治24年＝1891年、元和元年＝1615年、元禄2年＝1689年（吉深の没年）。
#   松陰の1854年の在牢：4月15日〜9月18日＝5か月あまり。1859年：7月9日〜10月27日＝3か月あまり。留魂録 1859年→1876年＝17年。
#   下男：給金1両2分＝1.5両。半年で20両〜30両 → 20÷1.5＝13.3、30÷1.5＝20 →「1年の給金の13倍から20倍」。
#   30畳に100人 → 100÷30＝3.33 →「1畳に3人あまり」。 長英：天保10年（1839）の判決→弘化元年（1844）＝5年。
#   朝五つ≒午前8時、七つ≒午後4時（目安と言う）。
# 確かめられなかったこと（台本では言わない）：牢名主が畳を何枚重ねたかの江戸期の記録（明治以降の本に「十畳」「十枚ばかり」、時代劇用語の解説に「10枚ほど」）、
#   ツルの相場額、江戸の牢の飯の量、年ごとの牢死の数（世界大百科の「1年に2000人に及んだことも」は年が無いので、事典の言葉として言うだけ）、1854年の松陰の牢の種類（東口揚屋は松陰全集の書簡で確認）、
#   松陰の処刑の場所の言い方（小塚原とする本がある。台本では場所を言わない）、長英の脱獄の日（6月中／6月4日夜／翌年とする年表）、大安楽寺の名の由来。
# 絵：AI 絵（Gemini。一覧は scripts/story/rouyashiki_main_look.yaml の頭）だけ。実在の人物の顔は描かない（松陰は後ろ姿）。字・紋・鉄格子・血は描かない。
