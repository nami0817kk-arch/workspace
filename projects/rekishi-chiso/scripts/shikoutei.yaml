tags: [始皇帝, 秦の始皇帝, 嬴政, 焚書坑儒, 万里の長城, 兵馬俑, 荊軻, 徐福, 史記, 秦, 中国史, 世界史, 歴史, 歴史解説, 歴史の地層]
en:
  title: "Qin Shi Huang: Was He Really a Tyrant? | Mercury Rivers, Book Burning and the Great Wall"
  description: |-
    Qin Shi Huang is often said to have died from drinking mercury in search of immortality. But the Records of the Grand Historian (Shiji) never says so. What it describes is a river of mercury flowing inside his tomb, and a study published in 2020 found mercury above the mound higher than in the surroundings.
    We follow his life from his birth in Handan in 259 BC: becoming king at 13, the assassination attempt by Jing Ke, unifying six states in about ten years, the title "Emperor", standard weights, measures, script and coins, the search for the elixir with Xu Fu, the walls he joined into the Great Wall, the burning of books, and his death at Shaqiu in 210 BC.
    The image of the cruel tyrant was written mostly in the Han dynasty, which overthrew Qin. The name "Ten-Thousand-Li Wall" comes from the Shiji, and the claim that he died from elixirs is a later allegation, although at least five Tang emperors really did die from them. Excavated Qin bamboo texts show a state run by detailed laws and paperwork, while heavy labor and punishments also brought it down only 15 years after unification.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "The Surface: Mercury, Book Burning and the Great Wall"
    - "259 BC: A Hostage's Son Born in Handan"
    - "247 BC: King at 13, His Mother and Lu Buwei"
    - "227 BC: Jing Ke's Assassination Attempt"
    - "221 BC: Unification and the First Emperor"
    - "219 BC: Five Tours, the Elixir and the Great Wall"
    - "213 BC: What Really Happened in the Burning of Books"
    - "210 BC: Death at Shaqiu and the Mercury Rivers"
    - "Verdict: Who Wrote the Tyrant?"

