    yt_title: "始皇帝は水銀を飲んで死んだのか｜『史記』に書いてある水銀の正体"
    lead: "『史記』に出てくる水銀は、始皇帝の墓の中の「百の川と大海」。2016年の測定でも、墳丘の上の水銀は周りより高く出ました。"
