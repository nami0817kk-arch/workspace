sections:
  # ---------------------------------------------------------------- 1 地表
  - title: 地表：水銀・焚書坑儒・万里の長城
    background: {image: paintings/shikoutei_terracotta_pit1_todd.jpg, credit: "兵馬俑1号坑（秦代。写真 Gary Lee Todd、CC0）"}
    portrait: {image: paintings/shikoutei_portrait_19c_b.jpg, caption: "始皇帝（清代の画帖、19世紀の想像画）"}
    year: -210
    lines:
      - 語り: 水銀を飲んで死んだ、と言われる始皇帝。しかし『史記』に、そうは書いてありません。書いてあるのは、墓の中を流れる、水銀の川です。
        tone: 重い
        card: {head: 『史記』秦始皇本紀, body: 墓の中に水銀の百の川と大海}
      - 聞き: 水銀の川！？ お墓の中に？ でも、不老不死の薬で水銀を飲んだって、あーし、何かで見たよ。
        tone: 驚き
      - 語り: その話は、後の時代に言われるようになった推測です。『史記』が書くのは、紀元前210年、旅の途中で病で亡くなったこと。死因は書かれていません。
        card: {head: 紀元前210年, body: 旅の途中で亡くなる}
      - 聞き: じゃあ、焚書坑儒は？ 本を焼いて、学者を埋めた暴君って、学校で習ったじゃん。
        tone: 疑問
      - 語り: それも、半分は本当で、半分は後の時代の語り方です。それから、万里の長城を作った人、というのも言い過ぎです。
        background: {image: paintings/shikoutei_greatwall_allom_1845.jpg, credit: "トマス・アロム《中国の長城》1845年（描かれているのは明代の長城）"}
      - 聞き: 長城も！？ 3つとも、始皇帝の名前とセットで覚えてたやつなんだけど。
      - 語り: 今日の地表は、この3つです。水銀、焚書坑儒、長城。そしてもう一つ。私たちの知っている暴君の姿は、そもそも誰が書き残したのか。
        background: {image: paintings/shikoutei_portrait_18c.jpg, credit: "《始皇帝像》『歴代帝王像』より（18世紀の想像画）"}
        portrait: null
      - 聞き: 誰が書いたか？ 始皇帝本人の記録じゃないの？
        tone: 疑問
      - 語り: そこを確かめに、生まれた町から、49年を順に掘っていきます。始まりは、人質の子です。

  # ---------------------------------------------------------------- 2 誕生
  - title: 紀元前259年 邯鄲に生まれた人質の子
    background: {image: paintings/shikoutei_map_warring_states_herrmann.jpg, credit: "アルベルト・ヘルマン《戦国時代の中国》（Atlas of China、1935年）"}
    year: -259
    lines:
      - 語り: 紀元前259年の正月、趙の国の都、邯鄲。のちの始皇帝が生まれます。名は《政》。正月の「正」から取った、と言われます。
        card: {head: 紀元前259年, body: 趙の都・邯鄲に生まれる}
      - 聞き: お正月生まれだから「政」。名前の付け方、けっこうシンプルなんだ。
      - 語り: 当時の中国は、大きな7つの国が争う戦国時代です。秦は、いちばん西の国でした。
        detail: {box: [0.08, 0.04, 0.92, 0.46], label: 戦国時代の国々（1935年の地図）}
      - 聞き: 秦の王族なのに、なんで敵の国の都で生まれたの？
        detail: {box: [0.08, 0.04, 0.92, 0.46], label: 戦国時代の国々（1935年の地図）}
      - 語り: 父の子楚は秦の王族ですが、趙に人質として出されていました。母は趙姫といいます。
      - 聞き: 人質の子ども……。王子さまのスタートとしては、かなりハードじゃん。
      - 語り: その父に目を付けた商人がいました。呂不韋です。「奇貨居くべし」、珍しい品は買っておけ、と言ったと『史記』は書きます。
        background: {image: paintings/shikoutei_lubuwei_1736.jpg, credit: "『廿一史通俗衍義』挿絵「暴秦以呂易嬴」（1736年）"}
        card: {head: 呂不韋, body: 「奇貨居くべし」}
        icon: coins
      - 聞き: 人質の王子を、値上がりする品物あつかい！？ 今でいう、先物買いの投資だね。
      - 語り: 呂不韋は財産をつぎ込み、子楚を秦の跡継ぎに押し上げます。紀元前257年ごろ、秦が邯鄲を囲むと、子楚は秦へ逃げ帰りました。
        background: {image: paintings/shikoutei_map_warring_states_herrmann.jpg, credit: "アルベルト・ヘルマン《戦国時代の中国》（Atlas of China、1935年）"}
        card: {head: 紀元前257年ごろ, body: 父が秦へ逃げ帰る}
      - 聞き: 政くんとお母さんは？ まさか、置いていかれたの？
        tone: 疑問
      - 語り: はい。2人は趙に残され、隠れて暮らしたと伝えられています。秦に戻れたのは、8歳か9歳のころです。
      - 聞き: 敵の国の都で、隠れて暮らした子ども時代。それは、人を信じにくくなりそう。
        tone: しみじみ
      - 語り: そして、ここに有名な噂があります。始皇帝の本当の父は、呂不韋だった、という話です。
        background: {image: paintings/shikoutei_lubuwei_1736.jpg, credit: "『廿一史通俗衍義』挿絵「暴秦以呂易嬴」（1736年）"}
        detail: {box: [0.0, 0.3, 1.0, 0.95], label: 呂不韋と趙姫の宴（1736年の挿絵）}
      - 聞き: 出た、ドラマっぽいやつ。それ、どこに書いてあるの？
        detail: {box: [0.0, 0.3, 1.0, 0.95], label: 呂不韋と趙姫の宴（1736年の挿絵）}
      - 語り: 同じ『史記』の、呂不韋の伝記です。ところが、始皇帝の本紀のほうは、はっきり「荘襄王の子」と書いています。
        figure: {type: people, title: 父は誰？ 『史記』の中の2つの記述, nodes: [[政, のちの始皇帝], [荘襄王（子楚）, 本紀が書く父], [呂不韋, 列伝が書く父]], edges: [[荘襄王（子楚）, 政, 秦始皇本紀], [呂不韋, 政, 呂不韋列伝]]}
      - 聞き: 同じ本の中で食い違ってるの？ それ、どっちかが間違ってるってことでしょ。
        figure: {type: people, title: 父は誰？ 『史記』の中の2つの記述, nodes: [[政, のちの始皇帝], [荘襄王（子楚）, 本紀が書く父], [呂不韋, 列伝が書く父]], edges: [[荘襄王（子楚）, 政, 秦始皇本紀], [呂不韋, 政, 呂不韋列伝]]}
      - 語り: 研究者の多くは、呂不韋の子という話に否定的です。後から書き足された文だという指摘や、2人をおとしめる作り話だという見方があります。
        figure: null
      - 聞き: 生まれたときから、もう悪い噂つき。あーし、ちょっと同情するかも。
      - 語り: やがて、その父が、王になって3年で亡くなります。跡を継いだのは、まだ13歳の少年でした。
        card: {head: 紀元前247年, body: 父の荘襄王が亡くなる}
        background: {image: paintings/shikoutei_portrait_dongzhou_1785.jpg, credit: "『繡像東周列国全志』挿絵「秦始王」（1785年）"}
        hook: true

  # ---------------------------------------------------------------- 3 13歳の王
  - title: 紀元前247〜235年 13歳の秦王と、母と呂不韋
    background: {image: paintings/shikoutei_portrait_dongzhou_1785.jpg, credit: "『繡像東周列国全志』挿絵「秦始王」（1785年）"}
    year: -247
    lines:
      - 語り: 紀元前247年、政は13歳で秦王になります。実権を握ったのは、相国となった呂不韋でした。政は、呂不韋を「仲父」と呼びます。
        card: {head: 紀元前247年, body: 13歳で秦王に}
      - 聞き: 13歳って、中学1年生だよ。仲父って、お父さんの次くらいに大事な人ってこと？
        tone: 疑問
      - 語り: そういう、敬った呼び方です。そして同じ年、ある工事が始まりました。王自身の墓です。
        background: {image: paintings/shikoutei_terracotta_horses_todd.jpg, credit: "兵馬俑1号坑の陶馬（秦代。写真 Gary Todd、CC0）"}
        card: {head: 紀元前247年, body: 自分の墓の工事が始まる}
      - 聞き: 中1なのに、お墓の工事！？ さすがに気が早すぎない？
        tone: 驚き
      - 語り: 工事は、亡くなるまで約37年続きます。天下を統一してからは、70万人あまりが送られた、と『史記』は書いています。
      - 聞き: 中学生のときに始めて、大人になってもずっと工事中。70万人って、ちょっと想像できない人数。
      - 語り: 当時の世界の、どんな都市の人口よりも多い数だ、という指摘があります。土台だけなら、1万6千人で2年という見積もりも。
        figure: {type: numberline, title: 墓の工事の人手, items: [[土台だけの見積もり（2年）, 16000], [『史記』, 700000]], unit: 人, focus: 『史記』}
      - 語り: 紀元前238年、政は成人の儀式のため、都を離れて雍の町に向かいます。その留守に、反乱が起きました。
        figure: null
        background: {image: paintings/shikoutei_terracotta_warrior_todd.jpg, credit: "兵馬俑の鎧を着た俑（秦代。写真 Gary Lee Todd、CC0）"}
        card: {head: 紀元前238年, body: 王の留守に反乱}
      - 聞き: 王さまの留守をねらうなんて。誰がそんなこと？
      - 語り: ろうあい、という男です。母の太后に仕え、2人の子までもうけていました。反乱は鎮められ、ろうあいは厳しく処罰され、一族も罪に問われました。
        card: {head: 紀元前238年, body: ろうあいの乱}
        background: {image: paintings/shikoutei_portrait_dongzhou_1785.jpg, credit: "『繡像東周列国全志』挿絵「秦始王」（1785年）"}
      - 聞き: お母さんの相手が、反乱を起こしたの？ 21歳で、それはきつすぎる。
        tone: 重い
      - 語り: しかも、ろうあいを母のもとへ送り込んだのは、呂不韋だったと分かります。紀元前237年、呂不韋は役を解かれ、領地へ退きました。
        background: {image: paintings/shikoutei_lubuwei_1736.jpg, credit: "『廿一史通俗衍義』挿絵「暴秦以呂易嬴」（1736年）"}
        card: {head: 紀元前237年, body: 呂不韋を退ける}
      - 聞き: 仲父って呼んでた人が、裏で関わってた。あーしなら、もう誰も信じられなくなる。
      - 語り: 同じ年、秦では、よその国から来た者を追い出せ、という命令が出ます。止めたのは、よその国から来ていた李斯の手紙でした。
        background: {image: paintings/shikoutei_yishan_rubbing_met1.jpg, credit: "嶧山刻石の拓本（李斯の小篆。原碑は紀元前219年、宋代の模刻。メトロポリタン美術館）"}
        card: {head: 紀元前237年, body: 李斯の手紙で命令を取り消す}
        icon: envelope-simple
      - 聞き: 追い出される側の人が、手紙一本で、王さまの命令をひっくり返したんだ。
      - 語り: はい。王はその手紙を読み、命令を取り消しました。この李斯が、のちに始皇帝の右腕になります。
      - 聞き: 暴君のイメージと、ちょっと違う。人の意見、ちゃんと聞くタイプなんだ。
      - 語り: 紀元前235年、蜀へ移れと命じられた呂不韋は、自ら世を去りました。王は24歳。ここから、自分で国を動かしていきます。
        background: {image: paintings/shikoutei_portrait_dongzhou_1785.jpg, credit: "『繡像東周列国全志』挿絵「秦始王」（1785年）"}
        card: {head: 紀元前235年, body: 呂不韋が世を去る}
      - 聞き: 13歳で王になって、大人たちの争いをくぐり抜けて、やっと自分の番なんだ。
        tone: しみじみ
      - 語り: その王が、6つの国を次々に攻めていきます。ところが途中で、命をねらう男が、地図を抱えてやって来ます。
        hook: true

  # ---------------------------------------------------------------- 4 荊軻
  - title: 紀元前227年 荊軻の暗殺未遂
    background: {image: paintings/shikoutei_map_warring_states_herrmann.jpg, credit: "アルベルト・ヘルマン《戦国時代の中国》（Atlas of China、1935年）"}
    year: -228
    lines:
      - 語り: 紀元前230年、秦は韓を滅ぼします。紀元前228年には、趙の都、邯鄲も落ちました。始皇帝が生まれた町です。
        card: {head: 紀元前228年, body: 生まれた町・邯鄲を落とす}
        detail: {box: [0.08, 0.04, 0.92, 0.46], label: 戦国時代の国々（1935年の地図）}
      - 語り: このとき政は自ら邯鄲に入り、昔の恨みのある人々を処罰した、と『史記』は書いています。
      - 聞き: 子どものころ隠れて暮らした町に、王として戻ったんだ。どんな気持ちだったんだろう。
        tone: しみじみ
      - 語り: 紀元前227年、秦に攻められそうになった燕の国の太子が、秦王のもとへ刺客を送り出します。荊軻です。
        background: {image: paintings/shikoutei_jingke_dongzhou_njlib.jpg, credit: "『東周列国志』繡像「荊軻」（清代刊）"}
        card: {head: 紀元前227年, body: 燕の太子丹が荊軻を送る}
        short: s2
      - 聞き: 暗殺者！ でも、秦王のそばまでどうやって近づくの？ 普通は会えないでしょ。
        tone: 疑問
      - 語り: 手土産は、燕の肥えた土地、督亢の地図。
        short: s2
      - 語り: それに、秦が賞金をかけて追っていた将軍、樊於期の首でした。
      - 聞き: 土地の地図を差し出すって、今なら「この土地をお譲りします」の書類を持っていく感じか。それなら会ってくれそう。
      - 語り: 易水のほとりで見送られるとき、荊軻はこう歌ったと伝えられます。風蕭蕭として易水寒し、壮士ひとたび去って復た還らず。
        background: {image: paintings/shikoutei_jingke_dongzhou_1785.jpg, credit: "『繡像東周列国全志』「荊軻」（1785年）"}
      - 聞き: もう帰らないつもりで出ていったんだ。でも、1人で行ったの？
      - 語り: 相棒が1人いました。13歳ですでに恐れられたという勇者、秦舞陽です。
      - 聞き: 付き添いの勇者がいるなら、ちょっと安心じゃん。
      - 語り: ところが宮殿に入ると、秦舞陽は顔色を変えて、震え出しました。
        background: {image: paintings/shikoutei_jingke_lieguo_ming.jpg, credit: "『春秋列国志伝』挿絵「荊軻入秦行刺」（明代刊、国立公文書館）"}
      - 語り: 荊軻は1人で進み出て、地図を広げていきます。広げきったところに、隠していた匕首が現れました。
        card: {head: 紀元前227年, body: 図窮まりて匕首見わる}
        short: s2
      - 聞き: 地図の中に刃物！ それで、秦王は？
        tone: 驚き
      - 語り: 秦王は身を引いて、つかまれた袖がちぎれます。剣は長すぎて抜けず、柱の周りを逃げ回りました。
        background: {image: paintings/shikoutei_jingke_han_rubbing.jpg, credit: "荊軻の秦王刺殺未遂（後漢の画像石の拓本、2〜3世紀）"}
        short: s2
      - 聞き: 家来は？ まわりに兵隊がいっぱいいるでしょ。助けに行かないの？
        short: s2
      - 語り: 行けなかったんです。秦の法では、王のいる御殿の上に、臣下は小さな刃物も持って上がれません。兵は階段の下で、命令が無ければ上がれませんでした。
        short: s2
        icon: lock
      - 聞き: 自分の国の決まりで、自分がピンチに！？ あーしなら、その決まり、その場で変える。
        short: s2
        tone: 驚き
      - 語り: そのとき、侍医の夏無且が、薬の袋を投げつけます。誰かが「剣を背負って」と叫び、秦王は剣を背に回して、やっと抜けました。
        background: {image: paintings/shikoutei_jingke_rom_relief.jpg, credit: "荊軻の秦王刺殺未遂（画像石の拓本、2世紀。ロイヤル・オンタリオ博物館）"}
      - 語り: 秦王は剣で反撃し、荊軻の投げた匕首は外れて、柱に突き刺さります。暗殺は失敗に終わりました。
        background: {image: paintings/shikoutei_jingke_han_rubbing.jpg, credit: "荊軻の秦王刺殺未遂（後漢の画像石の拓本、2〜3世紀）"}
        detail: {box: [0.28, 0.0, 0.62, 1.0], label: 柱に刺さった匕首（後漢の画像石の拓本）}
      - 聞き: 薬の袋で時間かせぎ。お医者さんが、いちばんのお手柄じゃん。
        detail: {box: [0.28, 0.0, 0.62, 1.0], label: 柱に刺さった匕首（後漢の画像石の拓本）}
      - 語り: 実際、夏無且は、黄金200溢の褒美をもらっています。そして中国には今も、「図窮まりて匕首見わる」という言葉が残っています。
        background: {image: paintings/shikoutei_jingke_lieguo_ming.jpg, credit: "『春秋列国志伝』挿絵「荊軻入秦行刺」（明代刊、国立公文書館）"}
      - 聞き: 2千年以上前の暗殺の場面が、ことわざになって残ってるんだ。
      - 語り: 秦王は燕を攻め、翌年には都を落とします。そして紀元前221年、最後に残った斉が、ほとんど戦わずに降伏しました。
        background: {image: paintings/shikoutei_map_warring_states_herrmann.jpg, credit: "アルベルト・ヘルマン《戦国時代の中国》（Atlas of China、1935年）"}
      - 語り: 統一を果たした王は、まず、自分の呼び名を変えます。
        hook: true

  # ---------------------------------------------------------------- 5 統一と皇帝
  - title: 紀元前221年 六国の統一と「皇帝」の誕生
    background: {image: paintings/shikoutei_map_qin_herrmann.jpg, credit: "アルベルト・ヘルマン《秦代の中国》（Atlas of China、1935年）"}
    year: -221
    lines:
      - 語り: 紀元前230年の韓から、紀元前221年の斉まで。秦は、10年ほどで6つの国を滅ぼしました。
        card: {head: 紀元前221年, body: 6つの国を滅ぼし統一}
        figure: {type: map, title: 秦が6つの国を滅ぼした順（紀元前230〜221年）, bounds: [104, 124, 29, 42], places: [[秦, 108.7, 34.3], [韓, 112.8, 34.2], [趙, 114.5, 37.3], [魏, 115.0, 35.2], [楚, 115.5, 31.5], [燕, 116.4, 39.9], [斉, 118.5, 36.6]], route: [秦, 韓, 趙, 魏, 楚, 燕, 斉], note: 約10年で6か国（国の位置はおおよそ）, upto: 3}
      - 聞き: 10年で6か国！ 13歳で王になってから数えると、何年目？
        figure: {type: map, title: 秦が6つの国を滅ぼした順（紀元前230〜221年）, bounds: [104, 124, 29, 42], places: [[秦, 108.7, 34.3], [韓, 112.8, 34.2], [趙, 114.5, 37.3], [魏, 115.0, 35.2], [楚, 115.5, 31.5], [燕, 116.4, 39.9], [斉, 118.5, 36.6]], route: [秦, 韓, 趙, 魏, 楚, 燕, 斉], note: 約10年で6か国（国の位置はおおよそ）, upto: 5}
      - 語り: 王になってから、26年目です。このとき、38歳でした。
        figure: {type: map, title: 秦が6つの国を滅ぼした順（紀元前230〜221年）, bounds: [104, 124, 29, 42], places: [[秦, 108.7, 34.3], [韓, 112.8, 34.2], [趙, 114.5, 37.3], [魏, 115.0, 35.2], [楚, 115.5, 31.5], [燕, 116.4, 39.9], [斉, 118.5, 36.6]], route: [秦, 韓, 趙, 魏, 楚, 燕, 斉], note: 約10年で6か国（国の位置はおおよそ）, upto: 7}
      - 聞き: 中学生で王になって、38歳で天下統一。人生の半分以上、ずっと国と国の争いの中にいたんだ。
        figure: {type: map, title: 秦が6つの国を滅ぼした順（紀元前230〜221年）, bounds: [104, 124, 29, 42], places: [[秦, 108.7, 34.3], [韓, 112.8, 34.2], [趙, 114.5, 37.3], [魏, 115.0, 35.2], [楚, 115.5, 31.5], [燕, 116.4, 39.9], [斉, 118.5, 36.6]], route: [秦, 韓, 趙, 魏, 楚, 燕, 斉], note: 約10年で6か国（国の位置はおおよそ）, upto: 7}
      - 語り: そこで、さっきの呼び名です。政が新しく作らせたのは、《皇帝》。
        figure: null
        background: {image: paintings/shikoutei_weight_edict_cc0.jpg, credit: "始皇帝の詔を刻んだ銅権の拓本（紀元前221年ごろ。写真 ReijiYamashina777、CC0）"}
        portrait: {image: paintings/shikoutei_portrait_c1850.jpg, caption: "始皇帝（1850年ごろの想像画）"}
        card: {head: 紀元前221年, body: 「皇帝」の称号を作る}
      - 語り: 自分は最初の皇帝、始皇帝。次は二世、その次は三世と数えて、万世まで続けるはずでした。自分を「朕」と呼ぶのも、このとき決めました。
      - 聞き: 皇帝って言葉、この人が作ったの！？ あーし、ずっと昔からある言葉だと思ってた。
        tone: 驚き
      - 語り: 国の治め方も変えます。天下を36の郡に分け、都から役人を送って治めさせました。《郡県制》です。
        background: {image: paintings/shikoutei_portrait_18c.jpg, credit: "《始皇帝像》『歴代帝王像』より（18世紀の想像画）"}
        card: {head: 紀元前221年, body: 天下を36の郡に分ける}
        icon: map-trifold
      - 語り: 王族に土地を分ける案も出ましたが、李斯の反対で退けられました。
      - 聞き: 親戚に土地を配るんじゃなくて、国が役人を送る。会社でいうと、支店長を本社から送り込む感じだ。
      - 語り: さらに、天下の武器を都の咸陽に集めて溶かし、銅の像を12体作らせます。1体の重さは千石、およそ30トン。別の記録では、その倍ほどとも言われます。
        background: {image: paintings/shikoutei_map_qin_herrmann.jpg, credit: "アルベルト・ヘルマン《秦代の中国》（Atlas of China、1935年）"}
        figure: {type: stats, title: 統一した年の数字, items: [[滅ぼした国, 6か国, 約10年で], [郡, 36, のち40あまり], [銅の像, 12体, 1体およそ30トン]]}
      - 聞き: 武器を溶かして像にしちゃう。もう戦はしないって宣言？ それとも、反乱させないため？
        figure: {type: stats, title: 統一した年の数字, items: [[滅ぼした国, 6か国, 約10年で], [郡, 36, のち40あまり], [銅の像, 12体, 1体およそ30トン]]}
        tone: 疑問
      - 語り: 漢の賈誼は、民の力を弱めるため、と書いています。この賈誼の名前、覚えておいてください。
        figure: null
      - 語り: そして始皇帝は、もっと地味なものにも手をつけます。ものさしと、ますと、おもりです。
        background: {image: paintings/shikoutei_weight_bronze_todd.jpg, credit: "始皇帝の詔を刻んだ銅の権（秦代、秦始皇帝陵博物院。写真 Gary Todd、CC0）"}
      - 聞き: 地味！ 天下を取って、そろえるのがものさし？
        tone: 驚き
      - 語り: 国ごとに、長さも重さも違っていたからです。『史記』は、度量衡を一つにし、車の幅を同じにし、書く文字を同じにした、と書きます。
        card: {head: 紀元前221年, body: 度量衡・車の幅・文字をそろえる}
      - 語り: 秦の1尺はおよそ23センチ、1斤はおよそ250グラム、ますの1升はおよそ200ミリリットル。出土した物差しや、ますから分かります。
        background: {image: paintings/shikoutei_measure_quanliang_todd.jpg, credit: "秦の銅の量（秦代、台北・故宮博物院。写真 Gary Todd、CC0）"}
        figure: {type: stats, title: 秦の単位（出土品からの目安）, items: [[1尺, 約23cm, 長さ], [1斤, 約250g, 重さ], [1升, 約200ml, かさ]]}
      - 聞き: 200ミリって、小さい牛乳パックくらいだ。急に身近になった。
        figure: {type: stats, title: 秦の単位（出土品からの目安）, items: [[1尺, 約23cm, 長さ], [1斤, 約250g, 重さ], [1升, 約200ml, かさ]]}
      - 語り: これは、統一より120年ほど前に、秦の改革者、商鞅が定めたますです。その底に、始皇帝は統一の詔を刻ませました。
        figure: null
        background: {image: paintings/shikoutei_shang_measure_todd.jpg, credit: "商鞅方升（紀元前344年。原品は上海博物館。陝西歴史博物館の展示を撮影、写真 Gary Todd、CC0）"}
        card: {head: 商鞅方升, body: 商鞅のますに統一の詔}
      - 聞き: 秦のますが、そのまま全国の基準になったんだ。勝った国のルールに、みんなが合わせる感じ。
      - 語り: 文字は、秦の字体《小篆》にそろえます。これは、度量衡をそろえよ、という詔を、秦の字で刻んだものの拓本です。
        background: {image: paintings/shikoutei_weight_edict_cc0.jpg, credit: "始皇帝の詔を刻んだ銅権の拓本（紀元前221年ごろ。写真 ReijiYamashina777、CC0）"}
      - 聞き: 漢字なのに、ほとんど読めない。でも、これで国じゅう同じ字になったんだ。
      - 語り: お金も、丸い形に四角い穴の《半両銭》にそろえました。この形は、その後2千年ほど、東アジアの銭の基本の形になります。
        background: {image: paintings/shikoutei_banliang_todd.jpg, credit: "秦の半両銭（紀元前221〜208年。写真 Gary Lee Todd、CC0）"}
      - 聞き: 丸に四角い穴！ 日本の昔の小銭も、この形だよね。ルーツはここなんだ。
        tone: 納得
      - 語り: ただ、統一から亡くなるまでは、11年しかありません。その11年の多くを、始皇帝は旅に使いました。
        hook: true

  # ---------------------------------------------------------------- 6 巡行・徐福・長城
  - title: 紀元前219年 5回の巡行と不老不死の薬、そして長城
    background: {image: paintings/shikoutei_imperial_tour_18c.jpg, credit: "《始皇帝の巡行》清代の画帖（18世紀）"}
    year: -220
    lines:
      - 語り: 統一の翌年から、始皇帝は国じゅうを回る旅に出ます。《巡行》です。亡くなるまでに5回。
        card: {head: 紀元前220年, body: 1回目の巡行}
        figure: {type: map, title: 統一後5回の巡行で訪れた主な地, bounds: [102, 126, 28, 42], places: [[咸陽, 108.7, 34.3], [隴西, 104.6, 35.0], [泰山, 117.1, 36.3], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [碣石, 119.5, 39.9], [会稽, 120.6, 30.0]], note: 紀元前220〜210年に5回}
      - 聞き: 5回も！ 車も電車もない時代に。ずっと出張してる社長みたい。
        figure: {type: map, title: 統一後5回の巡行で訪れた主な地, bounds: [102, 126, 28, 42], places: [[咸陽, 108.7, 34.3], [隴西, 104.6, 35.0], [泰山, 117.1, 36.3], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [碣石, 119.5, 39.9], [会稽, 120.6, 30.0]], note: 紀元前220〜210年に5回}
        tone: 笑い
      - 語り: 紀元前219年の2回目の旅では、東の泰山に登り、天と地を祭る儀式、《封禅》を行いました。
        figure: null
        background: {image: paintings/shikoutei_kangxi_tour_taishan_a.jpg, credit: "王翬ほか《康熙南巡図》巻三（1698年ごろ。泰山へ向かう清の康熙帝の行列）"}
        card: {head: 紀元前219年, body: 泰山で封禅}
      - 語り: この年、旅の先々には、自分の功績を刻んだ石碑を建てさせます。泰山の石碑は、かけらが今も残っていて、これはそれを納めた祠の、100年ほど前の写真です。
        background: {image: paintings/shikoutei_taishan_qin_stele_photo.jpg, credit: "泰山・岱廟の秦碑を納めた祠（島崎役治『亜細亜大観』、1929年ごろ）"}
      - 聞き: 旅行先に、自分をほめる石碑。あーしがやったら、ちょっと引かれるやつ。
        tone: 笑い
      - 語り: 紀元前219年、始皇帝は徐福という《方士》に、童男童女数千人をつけて、海へ送り出しました。
        background: {image: paintings/shikoutei_xufu_kuniyoshi.jpg, credit: "歌川国芳《唐土の始皇帝長生不老の仙薬を求めんため》1843年ごろ"}
        card: {head: 紀元前219年, body: 徐福を海へ送り出す}
        short: s5
      - 聞き: 子どもを何千人も連れて、海へ？ 何を探しに行ったの？
        short: s5
        tone: 疑問
      - 語り: 海の向こうの三つの神山、蓬莱などに住む仙人です。不老不死の薬を手に入れるためでした。
        background: {image: paintings/shikoutei_penglai_yuanyao.jpg, credit: "袁耀《蓬莱仙境図》18世紀"}
        short: s5
      - 聞き: 不老不死！ 天下を取った人が最後にほしくなるもの、それなんだ。
        short: s5
      - 語り: 『史記』の別の巻にも、ある家臣の話として、徐福が出てきます。
        short: s5
      - 語り: 三千人と職人を連れ、五穀の種を持って海を渡り、広い平野と沼地を得て王となり、帰らなかった。
        card: {head: 『史記』淮南衡山列伝, body: 徐福は王となり帰らなかった}
        short: s5
      - 聞き: 帰ってこなかったの！？ 薬じゃなくて、自分の国を作っちゃったってこと？
        short: s5
        tone: 驚き
      - 語り: 日本にも、徐福がたどり着いたという言い伝えが各地に残っています。ただ、それを裏づける記録はありません。
        background: {image: paintings/shikoutei_xufu_kuniyoshi.jpg, credit: "歌川国芳《唐土の始皇帝長生不老の仙薬を求めんため》1843年ごろ"}
        short: s5
      - 聞き: だから江戸の浮世絵にも、徐福の大きな船団が描かれてるんだ。日本の人も、この話が好きだったんだね。
      - 語り: 薬探しは、海の上だけではありません。2002年、湖南省の古い井戸から、秦の役所の文書が3万枚以上見つかりました。《里耶秦簡》です。
        background: {image: paintings/shikoutei_weight_edict_cc0.jpg, credit: "始皇帝の詔を刻んだ銅権の拓本（紀元前221年ごろ。写真 ReijiYamashina777、CC0）"}
        card: {head: 2002年, body: 里耶秦簡が見つかる}
        icon: scroll
      - 語り: その中に、不死の薬を探せという命令への、地方からの返事が見つかった、と報じられています。まだ見つからないが、探し続けている、と。
      - 聞き: 遠くの村の役所まで、薬を探せって命令が届いてたの！？ 本気度がすごい。
        tone: 驚き
      - 語り: 紀元前218年の旅では、博浪沙という所で、重い鉄の槌が投げつけられます。でも当たったのは、お供の車でした。
        background: {image: paintings/shikoutei_imperial_tour_18c.jpg, credit: "《始皇帝の巡行》清代の画帖（18世紀）"}
        card: {head: 紀元前218年, body: 博浪沙で鉄の槌に襲われる}
      - 聞き: また、ねらわれてる。荊軻のときから、まだ10年もたってないのに。
      - 語り: 槌を投げさせたのは、張良という若者です。のちに、秦を倒す劉邦の軍師になります。
      - 聞き: 秦を倒す側の人が、ここで一回出てくるんだ。なんだか伏線っぽい。
      - 語り: 紀元前215年、始皇帝は将軍の蒙恬に30万の兵を預けて、北の匈奴を攻めさせます。そして、壁を築かせました。長城です。
        background: {image: paintings/shikoutei_greatwall_allom_1845.jpg, credit: "トマス・アロム《中国の長城》1845年（描かれているのは明代の長城）"}
        card: {head: 紀元前215年, body: 蒙恬が30万の兵で北へ}
        short: s3
      - 聞き: 来た、万里の長城！ ゼロから全部、始皇帝が作らせたんでしょ？
        short: s3
      - 語り: 実は、壁はその前からありました。戦国時代の国々が、それぞれ壁を築いていたんです。始皇帝は、北の壁をつないで、延ばしました。
        short: s3
      - 聞き: 作ったんじゃなくて、つないだんだ。でも、この絵みたいなレンガの長城でしょ？
        short: s3
        tone: 疑問
      - 語り: いいえ。秦の壁は、土を突き固めて造ったものです。観光地で見るレンガの長城は、約1,700年後の明の時代のもので、この絵も明の長城です。
        card: {head: 明の時代, body: いま見るレンガの長城}
        short: s3
      - 聞き: じゃあ、写真の長城を見て「始皇帝だ」って言うのは、ちょっと違うんだ。
        background: {image: paintings/shikoutei_greatwall_termination_1858.jpg, credit: "トマス・アロム画《長城の終わり》1858年（明代の長城）"}
        short: s3
        tone: 納得
      - 語り: 『史記』は秦の長城を、「延々一万余里」と書きます。1里をおよそ415メートルとして数えると、4,000キロあまりです。
        background: {image: paintings/shikoutei_map_qin_herrmann.jpg, credit: "アルベルト・ヘルマン《秦代の中国》（Atlas of China、1935年）"}
        figure: {type: bars, title: 長城の長さ, bars: [[秦（一万余里を計算）, 4000], [明の長城, 8850], [すべての時代の合計, 21196]], labels: [約4千km, 約8千850km, 約2万1千km], upto: 1}
      - 語り: 明の長城は、およそ8,850キロ。すべての時代の長城を足すと、2万1千キロあまりです。
        figure: {type: bars, title: 長城の長さ, bars: [[秦（一万余里を計算）, 4000], [明の長城, 8850], [すべての時代の合計, 21196]], labels: [約4千km, 約8千850km, 約2万1千km], upto: 3}
      - 聞き: 始皇帝の長城って、全体から見ると一部なんだ。「万里」の万は、とにかく長いって意味？
        figure: {type: bars, title: 長城の長さ, bars: [[秦（一万余里を計算）, 4000], [明の長城, 8850], [すべての時代の合計, 21196]], labels: [約4千km, 約8千850km, 約2万1千km], upto: 3}
      - 語り: そういう意味でも使われます。秦の壁の正確な長さや道筋は、記録に残っていません。
        figure: null
        background: {image: paintings/shikoutei_greatwall_allom_1845.jpg, credit: "トマス・アロム《中国の長城》1845年（描かれているのは明代の長城）"}
      - 語り: 多くの人が工事に駆り出され、命を落とした人も少なくなかったとされます。
      - 語り: 同じころ南では、川と川をつなぐ運河、《霊渠》も開かせました。長さは約36キロです。
        background: {image: paintings/shikoutei_map_qin_herrmann.jpg, credit: "アルベルト・ヘルマン《秦代の中国》（Atlas of China、1935年）"}
        detail: {box: [0.25, 0.5, 0.85, 0.95], label: 秦の南の地方（1935年の地図）}
      - 聞き: 北に壁、南に運河。見えない所で、たくさんの人が働かされてたんだ。そこは、暴君って言われても仕方ないかも。
        tone: 重い
      - 語り: その2年後、都の宴での、ある学者の一言から、あの出来事が始まります。
        hook: true

  # ---------------------------------------------------------------- 7 焚書坑儒
  - title: 紀元前213年 焚書坑儒で本当に起きたこと
    background: {image: paintings/shikoutei_burning_books_hutchinson.jpg, credit: "焚書の想像図（『Hutchinson's Story of the Nations』1920年ごろ。服装は清朝風で時代考証は不正確）"}
    year: -213
    lines:
      - 語り: 紀元前213年、咸陽の宮殿の宴。博士の淳于越が、昔にならって王族に土地を分けるべきだ、と言いました。
        card: {head: 紀元前213年, body: 宴での淳于越の意見}
        short: s4
      - 聞き: それ、統一のときに李斯が反対した案だよね。また出てきたんだ。
      - 語り: 丞相の李斯が反論します。学者たちが古い本を持ち出して、今の政治を批判している。そして、本を焼く案を出しました。
        short: s4
      - 聞き: それで焚書。国じゅうの本を、全部燃やしちゃったんでしょ？
        short: s4
        tone: 疑問
      - 語り: 全部ではありません。焼かせたのは、秦以外の国の歴史書や、詩や書、諸子百家の本で、民間の人が持つものです。
        card: {head: 紀元前213年, body: 焚書}
        icon: fire
        short: s4
      - 語り: 医薬と占いと農業の本は、残されました。朝廷の博士の役所が持つ本も、対象の外です。
        background: {image: paintings/shikoutei_yishan_rubbing_met1.jpg, credit: "嶧山刻石の拓本（李斯の小篆。原碑は紀元前219年、宋代の模刻。メトロポリタン美術館）"}
        short: s4
        icon: book-open-text
      - 聞き: 役に立つ本と、国の本は残したんだ。あーしの思ってた「全部燃やす」とは、だいぶ違う。
        short: s4
        tone: 納得
      - 語り: 命令から30日たっても焼かない者には、重い罰が科されました。本を持つことを禁じる法は、漢の時代まで続きます。
        background: {image: paintings/shikoutei_burning_books_hutchinson.jpg, credit: "焚書の想像図（『Hutchinson's Story of the Nations』1920年ごろ。服装は清朝風で時代考証は不正確）"}
      - 聞き: 秦が滅んだあとも、続いてたの？ じゃあ漢も、同じ決まりを使ってたんじゃん。
      - 語り: 漢の初めまでは、そうです。そして翌年、紀元前212年。きっかけは、不老不死の薬を約束していた、盧生と侯生という2人の方士でした。
        background: {image: paintings/shikoutei_penglai_yuanjiang.png, credit: "袁江《蓬莱仙島図》1708年"}
        card: {head: 紀元前212年, body: 方士の盧生と侯生}
      - 聞き: さっきの徐福と同じ、薬を探す人たちだ。
      - 語り: 2人は始皇帝の悪口を言って、逃げ出します。怒った始皇帝は、都の学者たちを調べさせました。
        card: {head: 紀元前212年, body: 盧生と侯生が逃げ出す}
      - 語り: 学者たちは互いに名を挙げ合い、460人あまりが処罰された、と『史記』は伝えます。
      - 聞き: 460人……。それが「坑儒」の、儒者を生き埋めにしたっていう、あの話？
        tone: 重い
      - 語り: 『史記』は、彼らを「諸生」、学者たちと書きます。儒者だけを選んでねらった、とは書いていません。きっかけも、方士でした。
        background: {image: paintings/shikoutei_portrait_18c.jpg, credit: "《始皇帝像》『歴代帝王像』より（18世紀の想像画）"}
      - 聞き: じゃあ「儒者」って言葉は、どこから来たの？
        tone: 疑問
      - 語り: 漢の時代に、儒学が国の学問になります。そのあとで、殉じた儒者の話として語られるようになりました。焚書坑儒という四文字も、漢より後に定着したものです。
      - 語り: 「生き埋め」と訳されてきた「坑」という字も、もとは「命を奪う」という意味だった、という説があります。
      - 聞き: 書いた人の立場で、話の形が変わっちゃうんだ。でも、460人が処罰されたのは記録にあるんだよね。
      - 語り: そうです。そこは消えません。長男の扶蘇は、学者たちはみな孔子を手本にしている人々です、と処罰に反対しました。
        background: {image: paintings/shikoutei_terracotta_warrior_todd.jpg, credit: "兵馬俑の鎧を着た俑（秦代。写真 Gary Lee Todd、CC0）"}
        card: {head: 紀元前212年, body: 長男の扶蘇が処罰に反対}
      - 聞き: 孔子を手本にって、それ、儒者だよね。じゃあ、儒者もたくさん入ってたんだ。
      - 語り: はい。『史記』自身が、そう書いています。そして扶蘇は、北の蒙恬のもとへ送られました。
        card: {head: 紀元前212年, body: 扶蘇が北の蒙恬のもとへ}
      - 聞き: 反対した息子を、遠くへやっちゃうの……。これ、あとで効いてきそう。
        tone: 重い
      - 語り: 2年後、5回目の旅に出た始皇帝は、生きて都へ帰ることができませんでした。
        hook: true

  # ---------------------------------------------------------------- 8 沙丘と水銀
  - title: 紀元前210年 沙丘での死と、墓の中の水銀の川
    background: {image: paintings/shikoutei_kangxi_tour_taishan_b.jpg, credit: "王翬ほか《康熙南巡図》巻三（1698年ごろ。描かれているのは清の康熙帝の行列）"}
    year: -210
    lines:
      - 語り: 紀元前210年、始皇帝は5回目の旅に出ます。末の子の胡亥、丞相の李斯、宦官の趙高が付き従いました。
        card: {head: 紀元前210年, body: 5回目の巡行}
        figure: {type: map, title: 紀元前210年 最後の巡行, bounds: [104, 126, 28, 41], places: [[咸陽, 108.7, 34.3], [雲夢, 113.0, 30.6], [会稽, 120.6, 30.0], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [沙丘, 115.2, 37.1]], route: [咸陽, 雲夢, 会稽, 琅邪, 之罘, 沙丘], upto: 3}
      - 聞き: 49歳での長旅かあ。体は大丈夫だったの？
        figure: {type: map, title: 紀元前210年 最後の巡行, bounds: [104, 126, 28, 41], places: [[咸陽, 108.7, 34.3], [雲夢, 113.0, 30.6], [会稽, 120.6, 30.0], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [沙丘, 115.2, 37.1]], route: [咸陽, 雲夢, 会稽, 琅邪, 之罘, 沙丘], upto: 3}
        tone: 疑問
      - 語り: この旅の之罘の海で、始皇帝は自ら連弩を持ち、大きな魚を射止めました。『史記』の記録です。徐福が、大魚に邪魔されて行けない、と言ったからです。
        figure: {type: map, title: 紀元前210年 最後の巡行, bounds: [104, 126, 28, 41], places: [[咸陽, 108.7, 34.3], [雲夢, 113.0, 30.6], [会稽, 120.6, 30.0], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [沙丘, 115.2, 37.1]], route: [咸陽, 雲夢, 会稽, 琅邪, 之罘, 沙丘], upto: 5}
      - 聞き: 魚のせいにする徐福も徐福だけど、本当に射ちに行く始皇帝もすごい。本気で信じてたんだね。
        figure: {type: map, title: 紀元前210年 最後の巡行, bounds: [104, 126, 28, 41], places: [[咸陽, 108.7, 34.3], [雲夢, 113.0, 30.6], [会稽, 120.6, 30.0], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [沙丘, 115.2, 37.1]], route: [咸陽, 雲夢, 会稽, 琅邪, 之罘, 沙丘], upto: 5}
      - 語り: その帰り道、平原津という渡し場で、始皇帝は病にかかります。
        figure: null
        portrait: {image: paintings/shikoutei_portrait_19c_b.jpg, caption: "始皇帝（清代の画帖、19世紀の想像画）"}
        background: {image: paintings/shikoutei_imperial_tour_18c.jpg, credit: "《始皇帝の巡行》清代の画帖（18世紀）"}
      - 語り: 病が重くなると、北にいる扶蘇へ、封をした手紙を書かせました。咸陽で、わたしの葬儀を迎えよ、と。
        icon: envelope-simple
      - 聞き: それって、扶蘇に跡を継がせるってことだよね。遠くにやった息子を、最後は頼りにしたんだ。
        tone: しみじみ
      - 語り: そう読めます。ところが、手紙は封をしたまま、趙高の手もとにありました。使者に渡る前に、始皇帝は沙丘の平台という所で亡くなります。満49歳。暑い季節のことでした。
        background: {image: paintings/shikoutei_kangxi_tour_taishan_b.jpg, credit: "王翬ほか《康熙南巡図》巻三（1698年ごろ。描かれているのは清の康熙帝の行列）"}
        figure: {type: map, title: 紀元前210年 最後の巡行, bounds: [104, 126, 28, 41], places: [[咸陽, 108.7, 34.3], [雲夢, 113.0, 30.6], [会稽, 120.6, 30.0], [琅邪, 119.9, 35.6], [之罘, 121.4, 37.6], [沙丘, 115.2, 37.1]], route: [咸陽, 雲夢, 会稽, 琅邪, 之罘, 沙丘], upto: 6}
        card: {head: 紀元前210年, body: 沙丘で亡くなる}
        tone: 重い
      - 語り: 『史記』によれば、死は伏せられ、一行は何事もなかったように都へ向かいました。におい消しに、塩漬けの魚を積ませています。
        figure: null
      - 聞き: 皇帝が亡くなったことを、誰にも言えなかったんだ。それって、何かを隠したかったから？
        tone: 疑問
      - 語り: 『史記』によれば、この間に、趙高と李斯が遺言を書き換えます。跡継ぎは胡亥に。そして扶蘇には、死を命じる偽の手紙が届きました。
        portrait: null
        background: {image: paintings/shikoutei_portrait_c1850.jpg, credit: "《始皇帝像》1850年ごろ（想像画）"}
        figure: {type: people, title: 沙丘のあと（『史記』の書く筋）, nodes: [[始皇帝, 沙丘で亡くなる], [趙高, 宦官], [李斯, 丞相], [胡亥, 二世皇帝に], [扶蘇, 北にいた長男]], edges: [[趙高, 胡亥, 跡継ぎに推す], [李斯, 胡亥, 書き換えに加わる], [趙高, 扶蘇, 偽の手紙]]}
      - 聞き: 本物の手紙は止められて、偽の手紙が届く……。さっきの嫌な予感、当たっちゃった。
        figure: {type: people, title: 沙丘のあと（『史記』の書く筋）, nodes: [[始皇帝, 沙丘で亡くなる], [趙高, 宦官], [李斯, 丞相], [胡亥, 二世皇帝に], [扶蘇, 北にいた長男]], edges: [[趙高, 胡亥, 跡継ぎに推す], [李斯, 胡亥, 書き換えに加わる], [趙高, 扶蘇, 偽の手紙]]}
        tone: 重い
      - 語り: ただ、2009年に北京大学が受け入れた漢の時代の竹簡、『趙正書』には、別の話が書かれています。
        figure: null
        card: {head: 2009年, body: 竹簡『趙正書』を北京大学へ}
        icon: scroll
      - 語り: 死の床の始皇帝が李斯たちを呼び、李斯らが胡亥を跡継ぎに推すと、始皇帝が「よし」と認めた、というのです。
        background: {image: paintings/shikoutei_yishan_rubbing_met2.jpg, credit: "嶧山刻石の拓本・後半（原碑は紀元前219年、宋代の模刻。メトロポリタン美術館）"}
      - 聞き: 書き換え、無し！？ 全然ちがう話じゃん。どっちが本当なの？
        tone: 驚き
      - 語り: 決着していません。物語として書かれたもので、歴史の材料にはならない、という研究者もいます。
      - 語り: 言えるのは、漢の時代に、すでに違う語り方が並んでいた、ということです。
      - 語り: 始皇帝は驪山の墓に葬られ、『史記』は、その中のようすを書き残しています。
        background: {image: paintings/shikoutei_terracotta_pit1_todd.jpg, credit: "兵馬俑1号坑（秦代。写真 Gary Lee Todd、CC0）"}
        year: -210
        card: {head: 『史記』秦始皇本紀, body: 驪山の墓の中のようす}
        short: s1
      - 聞き: お墓って、13歳のときから作ってた、あの？
      - 語り: はい。37年がかりの墓です。
      - 語り: 地下水が出るまで深く掘り、宮殿の模型と宝を詰める。水銀で百の川と大海をつくり、仕掛けで流し巡らせる。天井には星空、床には地形。
        short: s1
      - 聞き: 水銀の川って、ここで出てくるんだ！ 飲んだんじゃなくて、お墓に流したの？
        short: s1
        tone: 驚き
      - 語り: はい。『史記』に出てくる水銀は、この墓の中の川と海です。水銀を飲んで死んだ、とはどこにも書かれていません。
        short: s1
      - 語り: では、その川は本当にあるのか。2016年の夏、墳丘の上の空気の水銀をレーザーで測ると、最大で1立方メートルあたり27ナノグラム。
        background: {image: paintings/shikoutei_terracotta_horses_todd.jpg, credit: "兵馬俑1号坑の陶馬（秦代。写真 Gary Todd、CC0）"}
        card: {head: 2016年, body: 墳丘の上の水銀を測る}
        figure: {type: bars, title: 空気中の水銀（ng/m³、2016年の測定）, bars: [[墳丘の上（最大）, 27], [周りのふつうの値, 10]], labels: ["27", 5〜10], upto: 1}
        short: s1
      - 語り: 周りのふつうの値は、5から10ナノグラムです。
        figure: {type: bars, title: 空気中の水銀（ng/m³、2016年の測定）, bars: [[墳丘の上（最大）, 27], [周りのふつうの値, 10]], labels: ["27", 5〜10], upto: 2}
        short: s1
      - 聞き: 周りよりずっと高い。じゃあ水銀の川の話、むしろ本当っぽいってこと？
        figure: {type: bars, title: 空気中の水銀（ng/m³、2016年の測定）, bars: [[墳丘の上（最大）, 27], [周りのふつうの値, 10]], labels: ["27", 5〜10], upto: 2}
        mark: {type: circle, at: 1}
        tone: 疑問
      - 語り: 以前の土の調査でも、同じ場所で水銀が多く出ています。墓の本体は、まだ掘られていません。
        figure: null
        short: s1
      - 聞き: 開けたら、本当に水銀の川が流れてるかもしれないんだ。あーし、見たいけど、近づきたくない。
      - 語り: その墓の東、約1.5キロ。1974年、井戸を掘っていた農民が、焼き物のかけらを見つけます。兵馬俑の始まりです。
        background: {image: paintings/shikoutei_terracotta_warrior_todd.jpg, credit: "兵馬俑の鎧を着た俑（秦代。写真 Gary Lee Todd、CC0）"}
        card: {head: 1974年, body: 井戸掘りで兵馬俑が見つかる}
      - 聞き: 兵馬俑！ 社会の資料集で見た、ずらっと並んだ兵隊の焼き物だ。
        tone: 明るい
      - 語り: 3つの坑に、推計で8,000体あまりの兵士、戦車130台、その馬520頭。顔は一体ずつ違うとされ、もとは色が塗られていました。
        background: {image: paintings/shikoutei_terracotta_pit1_todd.jpg, credit: "兵馬俑1号坑（秦代。写真 Gary Lee Todd、CC0）"}
        figure: {type: stats, title: 兵馬俑の3つの坑（2007年の推計）, items: [[兵士, "8,000体あまり"], [戦車, 130台], [戦車の馬, 520頭]]}
      - 聞き: 8千体って、ちょっとした町の人口だよ。それ全部、お墓を守るため？
        figure: {type: stats, title: 兵馬俑の3つの坑（2007年の推計）, items: [[兵士, "8,000体あまり"], [戦車, 130台], [戦車の馬, 520頭]]}
        tone: 疑問
      - 語り: そう考えられています。死んだあとの皇帝を守る軍団です。
        figure: null
      - 語り: 一方、秘密を守るため、工事をした職人たちは墓の中から出られなかった、と『史記』は記しています。
      - 聞き: 守る兵隊は外に、作った人は中に。なんだか寒くなる。
        tone: 重い
      - 語り: 墓の中には、まだ分からないことが眠っています。
      - 語り: そして、始皇帝の死から、わずか4年。秦は滅びます。
        hook: true

  # ---------------------------------------------------------------- 9 見立て
  - title: 見立て：「暴君」始皇帝の姿は、誰が書いたのか
    background: {image: paintings/shikoutei_liubang_portrait.jpg, credit: "《劉邦像》『歴代名人像』画帖（19〜20世紀初めの想像画）"}
    year: -209
    lines:
      - 語り: 始皇帝の死の翌年、紀元前209年に、陳勝・呉広の乱が起こります。反乱は、各地に広がりました。
        card: {head: 紀元前209年, body: 陳勝・呉広の乱}
      - 語り: 趙高は李斯を陥れ、二世皇帝も追いつめます。紀元前206年、最後の王の子嬰が劉邦に降伏し、秦は滅びました。統一から、わずか15年です。
        card: {head: 紀元前206年, body: 秦が滅ぶ}
        figure: {type: calc, title: 統一から滅亡まで, terms: [[紀元前221年, 統一], [紀元前206年, 滅亡], [15年]], ops: [→, ＝]}
      - 聞き: 10年かけて統一して、15年で終わり！？ あっけなさすぎる。
        figure: {type: calc, title: 統一から滅亡まで, terms: [[紀元前221年, 統一], [紀元前206年, 滅亡], [15年]], ops: [→, ＝]}
        tone: 驚き
      - 語り: まもなく項羽が咸陽を焼き、宮殿の書庫の本も失われたとされます。本が本当に消えたのは、焚書よりもこの火だった、と見る研究者もいます。
        figure: null
        background: {image: paintings/shikoutei_epang_fire_buzan.jpg, credit: "木村武山《阿房劫火》1907年（茨城県近代美術館蔵）"}
        card: {head: 紀元前206年, body: 項羽が咸陽を焼く}
      - 聞き: 焚書のせいにされてた分も、ここで燃えてたかもしれないんだ。
        tone: 納得
      - 語り: では、暴君の始皇帝の姿は、誰が書いたのか。いちばん詳しい『史記』は、漢の司馬遷の本です。完成は、紀元前91年ごろでした。
        background: {image: paintings/shikoutei_portrait_18c.jpg, credit: "《始皇帝像》『歴代帝王像』より（18世紀の想像画）"}
        card: {head: 紀元前91年ごろ, body: 司馬遷の『史記』が完成}
        figure: {type: calc, title: 始皇帝の死から『史記』まで, terms: [[紀元前210年, 始皇帝の死], [紀元前91年ごろ, 『史記』の完成], [約120年後]], ops: [→, ＝]}
      - 聞き: 120年後って、今から見たら、明治の終わりごろの話を書く感じ？ 本人を見た人、もういないじゃん。
        figure: {type: calc, title: 始皇帝の死から『史記』まで, terms: [[紀元前210年, 始皇帝の死], [紀元前91年ごろ, 『史記』の完成], [約120年後]], ops: [→, ＝]}
      - 語り: しかも漢は、秦を倒してできた国です。さっきの賈誼は、漢の初めに《過秦論》という文を書き、秦は仁義を施さなかったから滅んだ、としました。
        figure: null
        background: {image: paintings/shikoutei_yishan_rubbing_met2.jpg, credit: "嶧山刻石の拓本・後半（原碑は紀元前219年、宋代の模刻。メトロポリタン美術館）"}
        card: {head: 賈誼『過秦論』, body: 仁義を施さず滅んだ}
      - 語り: 『史記』も、秦の本紀の終わりに、この文を引いています。
      - 聞き: 倒した側が、前の国の悪いところを書く。自分たちが正しいって言いたいもんね。
      - 語り: そう見る人は多いです。焚書坑儒が、漢の時代に「儒者の話」になったのは、さっき見たとおり。残りの2つも、ここでつながります。
      - 語り: まず長城。「万里の長城」という呼び名は、『史記』の「一万余里」という書き方がもとになった、と言われます。
        background: {image: paintings/shikoutei_greatwall_allom_1845.jpg, credit: "トマス・アロム《中国の長城》1845年（描かれているのは明代の長城）"}
        card: {head: 地表の回収1, body: 「万里」は『史記』の一万余里から}
      - 聞き: 名前のほうが、『史記』から来てたんだ。だから、セットで覚えちゃう。
      - 語り: 水銀のほうは、もっと後の話です。のちの唐の時代には、不老不死の薬で亡くなった皇帝が、少なくとも5人出ます。
        background: {image: paintings/shikoutei_penglai_yuanjiang.png, credit: "袁江《蓬莱仙島図》1708年"}
        card: {head: 地表の回収2, body: 薬で死んだ皇帝は後の唐に}
      - 語り: 薬を探させた始皇帝にも、後の時代に、薬で死んだのでは、という疑いが向けられました。
      - 聞き: 薬で亡くなった皇帝は、本当にいたんだ。始皇帝のは、その疑いのほう。
        tone: 納得
      - 語り: もう一つ、今日出てきた話のうち、記録どうしで食い違うものを数えてみました。
        background: {image: paintings/shikoutei_lubuwei_1736.jpg, credit: "『廿一史通俗衍義』挿絵「暴秦以呂易嬴」（1736年）"}
      - 語り: 1つ目は父。同じ『史記』の中で、本紀は荘襄王の子、列伝は呂不韋の子。
        card: {head: 記録のずれ1, body: 父は荘襄王か、呂不韋か}
      - 聞き: 本紀と列伝で、お父さんが違うって、さっきのやつだ。
      - 語り: 2つ目は跡継ぎ。『史記』は遺言の書き換え。『趙正書』は、始皇帝が自分で胡亥を認めた、という筋です。
        background: {image: paintings/shikoutei_portrait_c1850.jpg, credit: "《始皇帝像》1850年ごろ（想像画）"}
        card: {head: 記録のずれ2, body: 遺言の書き換えか、本人の承認か}
      - 語り: 3つ目は徐福。本紀では、薬が見つからないまま。別の巻では、海の向こうで王になって帰らなかった。
        background: {image: paintings/shikoutei_xufu_kuniyoshi.jpg, credit: "歌川国芳《唐土の始皇帝長生不老の仙薬を求めんため》1843年ごろ"}
        card: {head: 記録のずれ3, body: 徐福は見つけられなかったか、王になったか}
      - 聞き: 2つは同じ『史記』の中で、1つは別の竹簡と食い違ってるのか。
        tone: 納得
      - 語り: はい。『史記』は、食い違う話を消さずに、両方とも残しています。聞いた話を並べて残した本、とも言えるでしょう。
      - 語り: そして、秦の側の記録も見つかっています。
        background: {image: paintings/shikoutei_weight_edict_cc0.jpg, credit: "始皇帝の詔を刻んだ銅権の拓本（紀元前221年ごろ。写真 ReijiYamashina777、CC0）"}
      - 語り: 1975年、湖北省の役人の墓から出た《睡虎地秦簡》。喜という地方の役人が、法律の条文と役所の手引きを、墓に入れていました。
        card: {head: 1975年, body: 睡虎地秦簡が見つかる}
      - 聞き: 仕事のマニュアルを、お墓に！？ 真面目すぎる。
      - 語り: 役人が仕事でしくじれば、よろいや盾で罰金を払う。争いごとは、細かい手続きを踏んで調べる。書類と手続きで動く国の姿です。
        icon: gavel
      - 聞き: 気分で決める暴君の国じゃなくて、ルールでがちがちの国だ。荊軻のときの「刃物を持って上がれない」も、そうだったね。
        tone: 納得
      - 語り: そうです。ただ、労役と刑罰が重かったのも確かです。その重さに耐えかねた人々が立ち上がり、統一から15年で崩れた。ここも消えません。
        background: {image: paintings/shikoutei_greatwall_allom_1845.jpg, credit: "トマス・アロム《中国の長城》1845年（描かれているのは明代の長城）"}
      - 聞き: きっちりしたルールは、人を守りもするし、追いつめもする。
        tone: しみじみ
      - 語り: 最後に、人柄の場面を一つ。逃げた方士の盧生と侯生は、始皇帝のことをこう言っていました。
        background: {image: paintings/shikoutei_portrait_19c_b.jpg, credit: "《始皇帝像》清代の画帖（19世紀の想像画）"}
      - 語り: 天下のことは、大きなことも小さなことも、すべて自分で決める。竹の書類を秤で量り、決めた量を読み終えるまで休まない。
        card: {head: 盧生と侯生の陰口, body: 書類を秤で量って読む}
        icon: scales
      - 語り: その量は、1日1石、およそ30キロとも読まれます。
      - 聞き: それ、悪口のつもり？ 毎日30キロの書類って、ただの働きすぎじゃん。
        tone: 驚き
      - 語り: 暴君と呼ばれた人の、いちばん人間らしい姿が、悪口の中に残っているんです。
        tone: しみじみ
      - 語り: 今日の地層をまとめます。1つ目。水銀を飲んで死んだ、とは『史記』に書かれていません。書かれているのは、墓の中の水銀の川です。
        background: {image: paintings/shikoutei_terracotta_pit1_todd.jpg, credit: "兵馬俑1号坑（秦代。写真 Gary Lee Todd、CC0）"}
      - 聞き: 飲んだんじゃなくて、流したほう。しかも測ったら、本当に水銀が多かった。
      - 語り: 2つ目。焚書は実際にあり、460人あまりの処罰も記録にあります。でも、儒者だけをねらった話という形は、漢より後のものです。
      - 聞き: 半分本当で、半分は後から付いた話。あーし、教科書の四文字だけで覚えてた。
      - 語り: 3つ目。長城は、国々の壁をつないで延ばしたもの。いま見るレンガの長城は、明の時代のものです。
        background: {image: paintings/shikoutei_greatwall_termination_1858.jpg, credit: "トマス・アロム画《長城の終わり》1858年（明代の長城）"}
      - 聞き: 始皇帝の長城は、土の壁。写真の長城を見たら、それは明だよって言える。
        tone: 明るい
      - 語り: そして、暴君の姿をいちばん詳しく書き残したのは、秦を倒した漢の時代の人々でした。
        background: {image: paintings/shikoutei_portrait_19c_b.jpg, credit: "《始皇帝像》清代の画帖（19世紀の想像画）"}
      - 聞き: 始皇帝って、13歳で王になって、国じゅうのものさしまでそろえた、働きすぎの皇帝。でも、その重たいルールで、15年で国が崩れちゃった人、かな。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 次回は、豊臣秀長。秀吉を支えた補佐役って言われてるけど、その姿を広めたのは、1985年の小説なんだって。
      - 語り: 始皇帝の話で、最初に聞いたのはどれでしたか。水銀、焚書坑儒、長城。コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
