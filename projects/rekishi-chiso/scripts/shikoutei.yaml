terms:
  方士: 不老不死の術や薬を説いて回った人々
  郡県制: 国を郡と県に分け、都から役人を送って治める仕組み
  度量衡: 長さ・かさ・重さの単位。秦が国じゅうでそろえた
  小篆: 秦が国じゅうでそろえた漢字の字体
  半両銭: 秦がそろえた、丸い形に四角い穴の銅の銭
  封禅: 皇帝が泰山で天と地を祭る儀式
  巡行: 皇帝が国じゅうを回る旅。始皇帝は統一後に5回
  匕首: つばの無い短い刀
  里耶秦簡: 2002年に湖南省の古井戸から出た、秦の県の役所の文書
  霊渠: 始皇帝の時代に南で開かれた運河。長さ約36km
  趙正書: 北京大学が2009年に受け入れた漢の時代の竹簡。50枚
  睡虎地秦簡: 1975年に湖北省の役人の墓から出た、秦の法律などの竹簡
  過秦論: 漢の初めの賈誼が、秦の滅んだわけを論じた文

shorts:
