# 始皇帝（10/12 12時公開）。型：通説型（地表＝「水銀を飲んで死んだ」「焚書坑儒の暴君」「長城を作った」→ 生涯 → 見立て：暴君の姿を書いたのは秦を倒した漢、地表の3つがなぜそう語られたか）
# 事実の出どころは dev/output/rekishi-chiso/research/shikoutei_facts.md（確実／有力／説の言い分けを守る）と、確認の記録 dev/output/rekishi-chiso/review/shikoutei/round1.md。絵は research/shikoutei_assets.md。
# 年は紀元前。年齢は満（前259年1月生まれ）。お金には換算しない。処刑・坑儒・殉葬は下調べ9章の言い換えで、細部は描写しない。現代の人物と比べない。
# 年表・この時○歳は紀元前を負の年で書く（PR #633）。「嫪毐」の毐はフォントに無いので、画面に出す所は「ろうあい」とかなで書く。
title: 始皇帝は本当に暴君だったのか｜水銀の川・焚書坑儒・長城を『史記』と出土した竹簡で掘る
series: ""
