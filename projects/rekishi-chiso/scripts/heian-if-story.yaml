  # サムネは別に作る（Gemini の絵に字を載せた1枚。out/heian-if-story_thumbnail.png）。ここは check のための仮。

sections:
  # ================================================================ 序章
  - title: 「お風呂は5日に1度」　道長の祖父の家訓
    lines:
      # fact: heianif-05
      - 語り: 毎月1日に、お風呂に入ると、早死にする。18日に入ると、盗賊に遭う。
        tone: 重い
        card: {head: "1日の風呂は早死に", body: 18日は盗賊に遭う}
      # fact: heianif-05
      - 語り: 藤原道長の祖父が、子孫に書き残した心得です。お風呂は、5日に1度。日を選べ。
      # fact: heianif-04
      - 語り: 髪をとかすのは、3日に1度。手の爪を切るのは、丑の日。足の爪は、寅の日。
      - 語り: もしも、今の私たちが、この家に生まれたら。毎日は、和歌と恋だけでは、終わりません。
        tone: 疑問
      # fact: heianif-17
      - 語り: 道長の日記には、占いに従って家にこもる日、物忌みが、1年に何十回も書かれた年があります。
      - 語り: いちばん多い年は、何回だったのか。答えは、この先で分かります。
      - 語り: その決まりごとは、生まれる前から、始まっていました。
        hook: true
      # fact: heianif-33
      - 語り: 生まれる前の日、部屋は、白一色に、しつらえ替えられたのです。
        hook: true

  # ================================================================ 第1章 生まれた日
  - title: 「部屋は白一色」　1008年、皇子が生まれた日
    lines:
      # fact: heianif-41
      - 語り: 道長の娘で、一条天皇の后、中宮の彰子が、天皇の子を身ごもったとき、まわりは、それを伏せました。
      # fact: heianif-41
      - 語り: 1008年の3月の記録には、まだ定まらないので秘す、とあります。4月13日、彰子は、内裏から、道長の屋敷、土御門殿に移りました。
      # fact: heianif-33
      - 語り: そして、1008年の秋、9月10日の明け方。部屋のしつらえが、すっかり替えられます。
      # fact: heianif-33
      - 語り: 彰子は、白い帳台に移りました。
        card: {head: "産室は白一色", body: 白い帳台に移る}
      # fact: heianif-33, heianif-35
      - 語り: この様子を書き残したのは、彰子に仕えていた、紫式部です。紫式部日記には、こうあります。
      # fact: heianif-35
      - 語り: 陰陽師は、世にいる限り、呼び集められた。
        tone: 重い
      # fact: heianif-35
      - 語り: 僧たちは、彰子に取りついた物の怪を、別の人に移そうと、祈り、大声を上げ続けます。
      # fact: heianif-36
      - 語り: お産が長引くと、彰子は、頭のてっぺんの髪を、少しだけ下ろして、仏の戒めを受けました。出家の形をとって、仏の守りを願ったのです。
      # fact: heianif-34
      - 語り: 9月11日の昼ごろ、男の子が生まれます。のちの後一条天皇、敦成親王です。
        card: {head: "1008年9月11日", body: 敦成親王が生まれる}
      # fact: heianif-34
      - 語り: 狭い部屋には、あとで数えると、40人あまりが、詰めていた、と紫式部は書いています。
      # fact: heianif-34
      - 語り: けれど、藤原行成の日記、権記には、短く、こうあります。昼ごろ、男の皇子が生まれた。仏法の霊験だ。
        tone: 疑問
      # fact: heianif-34
      - 語り: 物の怪との戦いを、細かく書いたのは、紫式部のほう。同じ日でも、書き手によって、残る姿は大きく違います。
      # fact: heianif-37
      - 語り: へその緒を切ったのは、祖母の倫子。道長の妻です。
      # fact: heianif-33, heianif-37
      - 語り: その日の夕方は、最初の湯あみの儀式です。湯の桶も、それを置く台も、みな白い覆い。女房たちは、白い元結をしていました。
      # fact: heianif-37
      - 語り: 学者の藤原広業が、欄干のそばに立って、中国の歴史書、史記を、読み上げました。
        card: {head: "産湯の儀式", body: 史記を読み上げる}
      # fact: heianif-38
      - 語り: 生まれて3日目、5日目、7日目、9日目の夜には、産養という祝いが開かれます。主催は、夜ごとに替わりました。
      # fact: heianif-38
      - 語り: 3日目は、中宮に仕える役所の人々。5日目は、道長。7日目は、朝廷。9日目は、道長の息子の、頼通です。
        card: {head: "産養の主催", body: 夜ごとに替わる}
      # fact: heianif-39
      - 語り: 祖父の道長は、孫を抱いていて、おしっこをかけられました。
      # fact: heianif-39
      - 語り: 濡れた衣を、火で乾かさせながら、道長が言った言葉を、紫式部日記は、こう書きます。この宮の、おしっこに濡れるのは、うれしいことだなあ。
        tone: しみじみ
      # fact: heianif-40
      - 語り: 生まれて50日目の祝いは、1008年の冬、11月1日。酔った藤原公任が、女房の席に来て、紫式部が書いた源氏物語の、若紫は、このあたりにいませんか、と紫式部に声をかけました。
      - 語り: もしもあなたが、こうして生まれたら。いつ、大人になるのか。
        hook: true
      # fact: heianif-42
      - 語り: 道長の娘が、大人とされたのは、今なら、まだ小学生の年でした。
        hook: true

  # ================================================================ 第2章 大人になる
  - title: 「12歳で大人？」　裳着・元服と最初の位
    lines:
      # fact: heianif-42
      - 語り: 999年の春、2月9日。道長の娘の彰子は、裳着を済ませます。女の子が、初めて裳を着ける、大人の儀式です。
      # fact: heianif-42
      - 語り: このとき、数えで12歳。それでも、これで、大人とされました。
        card: {head: "数え12歳の裳着", body: 999年2月9日}
      # fact: heianif-42
      - 語り: 同じ年の冬、11月1日。彰子は、一条天皇のもとへ入りました。
      # fact: heianif-43
      - 語り: 裳着で、いちばん重い役は、裳の腰ひもを結ぶ、腰結です。権力のある人や、一族の長老が務めました。
      # fact: heianif-43
      - 語り: 国立国会図書館の解説によれば、父や祖父の後ろ盾がない娘は、裳着が、18歳ごろまで遅れ、行われないこともありました。
        tone: 重い
      # fact: heianif-43
      - 語り: 三条天皇の娘、禎子内親王は、11歳で裳着をしました。栄花物語には、夜がふけて、とても眠そうだった、とあります。
      # fact: heianif-44
      - 語り: 男の子が大人になる儀式は、元服です。冠をかぶせる役は、子どもの髪を取って、冠の中に引き入れるので、引入とも呼ばれました。
      # fact: heianif-50
      - 語り: 貴族の子は、位をもらいます。律令の決まり、蔭位の制では、父や祖父の位によって、21歳以上で、最初の位が決まりました。
      # fact: heianif-50
      - 語り: 一位の家の跡継ぎなら、いきなり、従五位下。貴族の入り口です。
        card: {head: "蔭位の制", body: 一位の跡継ぎは従五位下から}
      # fact: heianif-51
      - 語り: けれど、摂関家の子は、21歳を、待ちませんでした。道長は、980年、15歳で、従五位下になっています。
      # fact: heianif-52
      - 語り: 道長の息子の頼通は、さらに早い。1003年、12歳で、従五位下を飛ばして、正五位下から始まりました。
      # fact: heianif-52
      - 語り: そして1006年、15歳で、従三位。朝廷のいちばん上の貴族、公卿の仲間入りです。
        figure: {type: bars, title: 公卿（従三位）になった年齢, bars: [[藤原頼通, 15], [藤原道長, 22], [藤原道隆（道長の兄）, 32]], labels: [15歳, 22歳, 32歳]}
      # fact: heianif-51, heianif-55
      - 語り: 父の道長が、従三位になったのは、22歳。道長の兄の、道隆は、32歳で、ようやくでした。
      # fact: heianif-52
      - 語り: ただ、頼通が1006年に上った位を、事典は、従三位とも、正三位とも書いていて、そろっていません。
        figure: null
      # fact: heianif-46
      - 語り: 大人になれば、結婚です。平安の貴族の結婚は、夫が、妻の家に通うか、移り住む形が、多くありました。
      # fact: heianif-46
      - 語り: 通い始めて3日目の夜に、露顕という、お披露目をします。妻の家が用意した餅を、夫に食べさせる、三日夜餅という習わしもありました。
        card: {head: "三日夜餅", body: 3日目の夜、妻の家の餅を食べる}
      - 語り: では、大人になった貴族は、毎朝、起きたら、まず何をするのか。
        hook: true
      # fact: heianif-01
      - 語り: 道長の祖父の家訓には、手を洗うより先に、することが、書かれていました。
        hook: true

  # ================================================================ 第3章 1日の決まり
  - title: 「朝起きたら何をする？」　九条殿遺誡と出勤の日数
    lines:
      # fact: heianif-01
      - 語り: 道長の祖父、藤原師輔は、子孫への家訓、九条殿遺誡を残しました。まず、朝の決まりです。
      # fact: heianif-01
      - 語り: 起きたら、まず、自分の星の名を、小さな声で、7回唱えよ。生まれた年で決まる、北斗七星の一つです。
        card: {head: "起きたらまず", body: 自分の星の名を7回}
      # fact: heianif-03
      - 語り: 次に、鏡で顔を見る。次に、暦を見て、その日の吉凶を知る。
      # fact: heianif-03
      - 語り: 次に、楊枝を使い、西を向いて、手を洗う。仏の名を唱え、ふだん信じる神社を、心に念じる。
      # fact: heianif-06
      - 語り: その次は、日記です。昨日のことを、暦に書き付けよ。忘れないためだ、と。
      # fact: heianif-12
      - 語り: 孫の道長も、そうしました。道長の日記、御堂関白記は、具注暦という暦の、空いた所に書かれました。日ごとの吉凶に、日の出と日の入りの時刻まで書かれた暦です。
      # fact: heianif-13
      - 語り: もとは、半年で1巻、36巻あったと考えられています。道長の自筆のまま残るのは、998年から1021年までのうちの、14巻です。
      # fact: heianif-14
      - 語り: 平安貴族が自分の手で書いた日記の原本として、いちばん古いもので、2013年には、ユネスコの、世界の記憶に登録されました。
      # fact: heianif-06
      - 語り: ただし家訓は、大事な朝廷の仕事や、主君と父のことは、暦とは別に書いて、後の手本に備えよ、とも言います。
      # fact: heianif-03, heianif-07
      - 語り: そこまで済ませて、ようやく、粥を食べます。食事は、朝と夕の、2回。決まった時刻を待たずに食べるな、食べ過ぎるな、と家訓は言います。
      # fact: heianif-07
      - 語り: 歴史学者の朧谷寿さんは、朝の食事は、午前10時ごろ、夕の食事は、午後4時ごろだった、と書いています。
        card: {head: "食事は1日2回", body: 午前10時ごろと午後4時ごろ}
      # fact: heianif-15
      - 語り: 平安の貴族の宴の料理には、味がついていませんでした。国立歴史民俗博物館の小倉慈司さんによれば、食べる人が、塩や酢などを、自分でつけて食べたのです。
      # fact: heianif-16
      - 語り: 道長は、晩年、しきりに水を飲みました。同じ時代の藤原実資は、日記の小右記に、口が渇いて、力が出ない、という道長の様子を書いています。今の糖尿病と見られる病です。
      - 語り: では、朝の決まりを終えたら、仕事です。
      # fact: heianif-08
      - 語り: 927年にできた、朝廷の決まりの本、延喜式には、宮中の門を開ける太鼓の時刻が、季節ごとに決めてあります。
      # fact: heianif-08
      - 語り: 夏至のころは、朝の4時台に、門を開ける太鼓。仕事を終えて帰る太鼓は、朝の9時台です。冬至のころでも、門は、日の出より前に開きました。
        card: {head: "延喜式の太鼓", body: 夏至は朝4時台に門が開く}
      # fact: heianif-09
      - 語り: 朝早く出て、昼前には帰る。ところが、これは、決まりの上の話です。
        tone: 疑問
      # fact: heianif-09
      - 語り: 平安貴族の仕事を調べた、井上幸治さんによれば、実際の公卿は、夕方の6時前後に帰るのが、ふつうでした。実資の小右記には、夜中の2時ごろに、帰った日もあります。
      # fact: heianif-10
      - 語り: 出勤した日は、上日と呼ばれ、数えられていました。常勤の役人は、1年に240日以上出ないと、毎年の勤めの評価を、受けられません。
      # fact: heianif-11
      - 語り: 平安中期の法令や記録を集めた本、政事要略には、950年から1年分の、出勤の日数が残っています。
      # fact: heianif-11
      - 語り: 公卿の多くは、200日以下。ところが、記録係の下級の役人、少外記の紀理綱は、351日。休んだのは、1年に、わずか3日ほどでした。
        tone: 重い
        figure: {type: stats, title: 1年の出勤の日数（950〜951年）, items: [[少外記の紀理綱, 351日, 休みは約3日], [決まりの最低（常勤）, 240日], [公卿の多く, 200日以下]]}
      # fact: heianif-63
      - 語り: 行事も、山ほどあります。実資がまとめた、年中行事の本では、主な行事だけで、およそ100。正月は、人事の会議を含めて、20以上で、ほとんど毎日が、行事でした。
        figure: null
      - 語り: もしもあなたの家で、怪しいことが起きたら。
        hook: true
      # fact: heianif-21
      - 語り: 門を閉じて、家にこもるのです。
        hook: true

  # ================================================================ 第4章 物忌み
  - title: 「家から出られない日」　道長の日記の物忌み
    lines:
      # fact: heianif-19
      - 語り: 物忌みは、怪しいことが起きたとき、陰陽師が占って決めました。慎むべきと出た2日が、物忌みの日になります。
      # fact: heianif-19
      - 語り: 平安文学の研究者、中島和歌子さんの、2014年の論文によれば、御堂関白記の物忌みは、ほとんどが、占いによる、2日続きです。
        card: {head: "物忌みは2日続き", body: 陰陽師の占いで決まる}
      # fact: heianif-21
      - 語り: 1010年の8月24日。道長は、日記に書きます。物忌みは、今日と明日。だから、西の門を、閉じた。
      # fact: heianif-21
      - 語り: 重い物忌みの間は、外の人には会いません。ただ、同じ家に泊まっている人には会えて、夫婦が一緒に寝ることも、できました。
      # fact: heianif-17
      - 語り: では、道長は、どれほど物忌みを、日記に書いたのか。深澤瞳さんが、2005年の論文で、御堂関白記の、物忌みの記事を、年ごとに数えています。
      # fact: heianif-17
      - 語り: いちばん多い年は、1013年。1年に、60回。
        tone: 重い
        card: {head: "1年に60回", body: 道長の日記の物忌み（1013年）}
      # fact: heianif-17
      - 語り: 1か月で、いちばん多いのは、1004年の2月で、17回。残る日記の全部で、410回です。
        figure: {type: bars, title: 日記に書かれた物忌みの数, bars: [[道長（1013年）, 60], [道長（1004年の1年）, 51], [実資（いちばん多い年）, 24]], labels: [60回, 51回, 24回]}
      # fact: heianif-18
      - 語り: 同じ時代に、細かい日記を残した藤原実資は、いちばん多い年でも、24回でした。道長は、その2倍以上、物忌みを書いていたのです。
      # fact: heianif-17
      - 語り: ただ、これは、日記に物忌みと書いた回数で、こもった日数と、同じではありません。
        figure: null
      # fact: heianif-22
      - 語り: 物忌みでも、出かけることは、ありました。1004年の2月24日、道長は、今日は物忌み。けれど軽いので、呼ばれて内裏に参った、と書いています。
      # fact: heianif-22
      - 語り: 1013年の5月20日は、重い物忌みの日でした。それでも道長は、孫の敦成親王が、重い病と聞いて、駆けつけます。
        tone: 重い
      # fact: heianif-22
      - 語り: 第1章で、道長におしっこをかけた、あの孫です。日も悪いのに、夜には、お経を読ませ始めました。中島さんは、道長が、物忌みを破った例だ、と書いています。
      # fact: heianif-25
      - 語り: 夢でも、物忌みをしました。1011年の11月7日、道長は、人の夢見が悪いので、こもって物忌み、と書いています。
      # fact: heianif-25
      - 語り: 夢のときは、陰陽師に占わせず、自分で決めて、1日だけ、こもりました。
      # fact: heianif-23
      - 語り: 天皇にも、物忌みがありました。天皇の物忌みの日は、殿上の間の壁に貼られた暦に、書き込まれます。
      # fact: heianif-23
      - 語り: 家臣は、前の晩の夜中に内裏に入り、泊まり込みました。
      # fact: heianif-24
      - 語り: 物忌み中の天皇には、会えません。999年の9月10日には、道長たちが作った詩が、簾の外から、読み上げられました。
      # fact: heianif-20
      - 語り: ところで、物忌みといえば、柳の木の札に、物忌みと書いて、冠や簾に掛けた、と辞典は説明します。
        tone: 疑問
      # fact: heianif-20
      - 語り: 中島さんが調べると、御堂関白記には、物忌みの札は、1つも、出てきません。
        card: {head: "物忌みの札", body: 道長の日記には1つも無い}
      # fact: heianif-20
      - 語り: 日記に出てくる札は、どれも、死や血のけがれに触れたとき、庭に立てたものでした。
      - 語り: もしもあなたが、物忌みの日でなくても、出かける先の方角が、悪かったら。
        hook: true
      # fact: heianif-26
      - 語り: 前の晩に、わざと、別の家に、泊まりに行くのです。
        hook: true

  # ================================================================ 第5章 方違えと陰陽師
  - title: 「わざと遠回りして泊まる」　方違えと安倍晴明
    lines:
      # fact: heianif-27
      - 語り: 方角をふさぐ神の一つが、天一神です。決まった日に天から降り、北東に6日、東に5日、と方角を変えながら、44日間、地上を回ります。
      # fact: heianif-27
      - 語り: そのあと16日間は、天に上がって、どの方角も、ふさぎません。合わせて60日で、ひと回りです。
        figure: {type: stats, title: 天一神のひと回り, items: [[地上を回る, 44日], [天に上がる, 16日], [合わせて, 60日]]}
      # fact: heianif-27
      - 語り: 神のいる方角へ行くのが、方ふさがり。そこで、前の晩に、別の家に泊まって、方角を変えてから出かけます。これが、方違えです。
        figure: null
      # fact: heianif-26
      - 語り: 1008年の2月12日。道長は、日記に書きます。明日、法性寺へ行くので、受領の藤原伊祐の家で、方を違える。
      # fact: heianif-26
      - 語り: 泊まる先は、道長の別の屋敷のほか、地方の長官を務める、受領の家でした。
      # fact: heianif-28
      - 語り: 季節の分かれ目、節分の夜にも、方違えをしました。早い例は、936年の正月。道長の曽祖父の藤原忠平が、息子の師輔の家で、方を違えています。
      # fact: heianif-29
      - 語り: 泊められる側も、大変です。清少納言は、枕草子の、興ざめなものに、こう書きました。
      # fact: heianif-29
      - 語り: 方違えに行ったのに、もてなしのない家。まして、節分の方違えなら、本当に興ざめだ。
        card: {head: "枕草子", body: もてなしのない方違えの家}
      # fact: heianif-29
      - 語り: 別の段には、節分の方違えをして、夜が深いうちに帰る、寒さはたまらない、ともあります。
      # fact: heianif-31
      - 語り: 日取りと方角を占ったのが、陰陽師です。いちばん名高いのが、安倍晴明でした。
      # fact: heianif-31
      - 語り: 1004年の6月20日、道長が仏像を作らせようとすると、晴明は、今日は、滅門日という、暦の悪い日で、よくない、と止めました。道長は、やめています。
      # fact: heianif-31
      - 語り: 同じ年の7月14日。雨を願う祭り、五龍祭を、晴明が務めると、夜に、大雨が降りました。効き目があったとして、晴明は、褒美の衣を与えられた、と道長は書いています。
        card: {head: "1004年7月14日", body: 晴明の祭りのあと大雨}
      # fact: heianif-30
      - 語り: 1005年の2月10日。道長が、新しい屋敷、東三条殿に移った夜。陰陽師の晴明は、遅れて来ました。道長は、供の者をやって、呼びに行かせています。
      # fact: heianif-30
      - 語り: このとき、晴明は、85歳。この年のうちに、亡くなります。
        tone: しみじみ
      # fact: heianif-32
      - 語り: 実は、御堂関白記に、いちばん多く名前が出る陰陽師は、晴明ではなく、息子の吉平です。日取りの相談や、お祓い、新しい家の作法を、任されました。
      # fact: heianif-32
      - 語り: しかも、晴明が日記に初めて出た、1000年の正月の記事を、道長は、自分で、消しています。
      - 語り: では、占いに従って勤める貴族の出世は、誰が、どう決めるのか。
        hook: true
      # fact: heianif-58
      - 語り: 清少納言の父が、国の長官になれたのは、何歳のときだったのか。
        hook: true

  # ================================================================ 第6章 出世
  - title: 「出世は誰が決める？」　除目の夜
    lines:
      # fact: heianif-60
      - 語り: 井上幸治さんによれば、道長や紫式部の時代、公卿は、20人前後。その下の、中ほどの位の貴族は、およそ800人いた、と見られます。
        card: {head: "公卿は20人前後", body: その下の貴族はおよそ800人}
      # fact: heianif-60
      - 語り: 正月の人事だけで、数十人が、従五位下になります。1年で、50人以上が、貴族の仲間入りをしました。上の席は、空きません。
      # fact: heianif-61
      - 語り: 役目を決めるのが、除目という会議です。春の除目は、地方の長官などを決め、正月から3夜続きました。
      # fact: heianif-61
      - 語り: 最後の夜に、受領と公卿が決まります。首席の大臣が、決まった人の名を、大きな紙に書き込んでいきました。
      # fact: heianif-62
      - 語り: 名前が書かれなかった家は、どうなるのか。清少納言は、枕草子の、方違えと同じ、興ざめなものの段に、書いています。
      # fact: heianif-62
      - 語り: 今年は必ず、と聞いて、昔の使用人や、田舎の者まで集まり、飲み食いして、知らせを待つ。けれど、明け方まで、門をたたく音はしない。
        tone: 重い
      # fact: heianif-62
      - 語り: 集まった人は、一人、二人と、抜け出していく。去れない古株は、来年空く国を、指を折って数えて、歩き回る。
        card: {head: "除目に漏れた家", body: 明け方まで知らせは来ない}
      # fact: heianif-58
      - 語り: その清少納言の父、清原元輔は、低い役から勤め、986年に、79歳で、肥後の国の長官になりました。
      # fact: heianif-58
      - 語り: そして990年、任地の肥後で、83歳で亡くなります。
        tone: しみじみ
      # fact: heianif-59
      - 語り: 一条天皇に学問を教えた、学者の大江匡衡でさえ、地方の長官になったのは、晩年のことでした。公卿には、なれないまま、61歳で亡くなっています。
      # fact: heianif-56
      - 語り: 紫式部の父、藤原為時も、長く、役目のない身でした。
      # fact: heianif-56
      - 語り: 996年の正月の除目で、越前の国の長官に決まったのは、源国盛だった、と伝わります。けれど、3日後、為時に、差し替えられた、といいます。為時にとって、10年ぶりの役目でした。
      # fact: heianif-57
      - 語り: 為時が、寒い夜に学問に励み、涙で襟を濡らした、という詩を出し、それを見た天皇が嘆き、道長が差し替えた。そんな話が、よく語られます。
      # fact: heianif-57
      - 語り: けれど、その話が載るのは、今昔物語集など、100年以上あとの、説話集です。同じ時代の記録で確かめられるのは、996年に、為時が越前の長官になったことです。
        tone: 疑問
        card: {head: "為時の詩の話", body: 載るのは後の時代の説話集}
      # fact: heianif-54
      - 語り: 一方、道長は、15歳で従五位下。22歳で公卿。そして995年、30歳で、天皇に出す文書を、先に見る、内覧と、右大臣に就きます。
      # fact: heianif-55
      - 語り: その年、関白になった兄の道兼は、わずかな日数で、35歳で亡くなり、七日関白と呼ばれました。
      # fact: heianif-55
      - 語り: 生まれた家と、兄たちの運命が、道長の出世を、決めたのです。
        tone: しみじみ
      - 語り: もしもあなたが、平安貴族の家に生まれたら。いちばん縛られていたのは、何だったのか。
        hook: true
      # fact: heianif-17
      - 語り: 答えは、道長が日記を書き付けた、あの暦の中に、あります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも平安貴族の家に生まれたら
    lines:
      - 語り: もしも、今の私たちが、平安貴族の家に生まれたら。
      # fact: heianif-33, heianif-37
      - 語り: 生まれる前の日、部屋は、白一色。産湯のそばでは、学者が、史記を読み上げる。
      # fact: heianif-42, heianif-51
      - 語り: 娘なら、12歳で大人に。息子なら、15歳で、もう貴族の位。
      # fact: heianif-01, heianif-05
      - 語り: 朝は、星の名を7回唱え、暦で吉凶を見る。お風呂は、5日に1度、日を選んで。
      # fact: heianif-11
      - 語り: 記録係のある役人は、休みが、1年に3日ほど。
      # fact: heianif-17, heianif-27
      - 語り: 占いで凶と出れば、門を閉じてこもり、悪い方角へは、前の晩に、よその家に泊まって出かける。
      # fact: heianif-12, heianif-17
      - 語り: 道長は、その暦の上に、毎日を書き付けました。物忌み、と書いたのは、いちばん多い年で、1年に60回。
        tone: しみじみ
      # fact: heianif-05, heianif-12
      - 語り: お風呂の日まで、暦の吉凶で決める。千年前の貴族は、そうして、毎日を、暦に預けて生きていました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
