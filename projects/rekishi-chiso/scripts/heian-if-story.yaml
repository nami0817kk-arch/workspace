# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と ashigaru-if-story.yaml・nagaya-if-story.yaml の型）。もしも現代人が平安貴族の家に生まれたら。2026-11-26 下書き。
# 公開の予定は 12/3 12:00（12時の もしも 枠）。型は docs/story-main.md「00. 伸びる型」の もしも×暮らし（「もしあなたが江戸に」の形。長屋・足軽の回と同じ）。
#   歴史の分岐の if ではない。「もしも」は入口と章の頭の問いだけで、中身は記録と研究だけ（想像の台詞・作った筋・架空の人物なし）。
#   主語は「平安貴族の家に生まれた子」＝道長の家（九条流）。背骨は道長の祖父・藤原師輔の家訓『九条殿遺誡』（群書類従本の翻刻）と、道長の日記『御堂関白記』（研究者の引用・集計）。
#   冒頭（10秒以内）＝毎月1日に風呂に入ると早死に、18日は盗賊に遭う（九条殿遺誡の割注）。答えの席＝道長が日記に「物忌」と書いた、いちばん多い年の回数（第4章で60回）。
#   序章 風呂の日は暦で決める／第1章 生まれた日、部屋は白一色／第2章 何歳で大人になる（裳着・元服・最初の位・婿取り）／第3章 朝起きたら何をする（九条殿遺誡・出勤）／
#   第4章 家から出られない日（物忌み）／第5章 わざと遠回りして泊まる（方違えと陰陽師）／第6章 出世は誰が決める（除目）／まとめ。締めは余韻の一文＋登録のお願い（story: true）。
# 共通の決まり5つ：①題名で答え（物忌の回数）を明かさない ②主語は平安貴族の家の子（道長の家）が最後まで ③「優雅な平安貴族」の像を、暦と占いと出勤に縛られた毎日に裏返す
#   ④他チャンネルは見ていない（11-18 指示）。自分のチャンネルでは平安貴族の暮らしは初めて ⑤数字は中身そのもの（1年に60回・休みは年3日・79歳で初めての大国の守）。
# 既出と重ねない：五摂家の家系図（gosekke-kakeizu-story）で使った「この世をば」・道長が関白にならなかったこと・陽明文庫・法成寺の呼び名・一家立三后は使わない。
#   菅原道真（michizane-story）は出さない。清盛（kiyomori-fukuhara-if）・義経（yoshitsune-if）・三種の神器（jingi-story）とは時代も話も重ならない（scripts/ を grep で確認）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/平安貴族if_facts_20261126.yaml、担当A=1日と日記・B=物忌みと方違え・C=誕生から結婚・D=出世）にあるものだけ。行の上に `# fact: heianif-05`。
# 記録の食い違い（3つ）：①敦成親王の誕生（『紫式部日記』は物の怪と祈りを詳しく／『権記』は「仏法の霊験」とだけ）
#   ②物忌の札（辞典は柳の札を冠や簾に掛ける／中島和歌子 2014：『御堂関白記』に物忌の札は1例も無く、札は全部が穢れのときに庭に立てたもの）
#   ③藤原為時の越前守（同じ時代の記録で分かるのは996年の任官だけ／申文の詩で天皇が泣いた話は『今昔物語集』など後の説話集）。
#   ほかに決まりと実際のずれ（延喜式の退朝の太鼓は昼前後／実際の公卿は夕方〜夜まで）も第3章で並べる。
# 自分で計算した数（全部計算し直した）：
#   年齢は数え年。道長 966年生：980年＝15歳、987年＝22歳、995年＝30歳。道隆 953年生：984年＝32歳（道長より10歳遅い）。頼通 992年生：1003年＝12歳、1006年＝15歳。
#   彰子 988年生：999年＝12歳。晴明 921年生：1005年＝85歳。清原元輔 908年生：986年＝79歳、990年＝83歳。大江匡衡 952年生：1012年没＝61歳。為時 986→996年＝10年。
#   物忌：道長の最多 60回（1013年）、実資の最多 24回（1023年）→ 60÷24＝2.5 →「2倍以上」。深澤 2005 の年計を足すと 410（担当B が足し直して一致）。
#   天一神：己酉から癸巳まで 44日（干支の番号 46→30、30−46+60＝44）＋天に上がる16日＝60日でひと回り。
#   出勤：紀理綱 351日。当時の1年は354〜355日 → 休みはおよそ3日（井上幸治の題「年3日しか休めない」）。決まりの最低は常勤で240日。
#   季節は旧暦で：1008年9月＝秋、1008年11月1日＝冬、999年2月9日＝春、999年11月＝冬。1004年7月14日の五龍祭は季節を言わない。年の分からない『九条殿遺誡』は年の流れに入れない（「道長の祖父の家訓」とだけ言う）。
# 確かめられなかったこと（台本では言わない）：物忌の日数（研究は「物忌と書いた回数」。日数には直さない）・「公家の物忌は1年に1か月」（辞典の本文未見）・道長と倫子の結婚の日と年齢・
#   『類聚雑要抄』の品数・飲水の記事の年（1016年説と1018年説）・間明き暦の空きの行数・元服前叙爵の論文の本文・道長の元服の年・平安貴族の寿命。
# 絵：AI 絵（Gemini。一覧は scripts/story/heian_if_main_look.yaml の頭）だけ。実在の人物の顔は似せない。字・家紋は描かない。中国風・江戸風の建物と服は作り直す。
