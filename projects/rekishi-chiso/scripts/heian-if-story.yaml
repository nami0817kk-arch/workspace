# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  毎月1日にお風呂に入ると、早死にする。18日に入ると、盗賊に遭う。藤原道長の祖父が、子孫に書き残した毎日の心得です。
  もしも今の私たちが、平安貴族の家に生まれたら。生まれた日、大人になる日、毎朝の決まり、家から出られない日、そして出世の夜まで。道長の日記『御堂関白記』と、同じ時代の記録でたどります。
  この動画でわかること
  ・平安貴族の子が生まれた日、部屋で何が行われたか
  ・何歳で大人になり、最初の位をもらったか
  ・朝起きてから寝るまでの決まりと、本当の出勤の日数
  ・道長が日記に「物忌」と書いた回数と、方違え・陰陽師の仕事
description_note: |-
  この動画に、想像の台詞や作った話はありません。「もしも」は入口の問いだけで、中身は記録（藤原師輔『九条殿遺誡』〈群書類従〉、藤原道長『御堂関白記』、紫式部『紫式部日記』、藤原実資『小右記』、藤原行成『権記』、清少納言『枕草子』、『延喜式』、『政事要略』、『今昔物語集』など）と研究（中島和歌子、深澤瞳、井上幸治、倉本一宏、小倉慈司、国立天文台、文化庁、文部科学省、国立国会図書館、各種の歴史事典）から取りました。
  『御堂関白記』の物忌の数は、深澤瞳の研究（大妻国文36、2005）が数えた「日記に物忌と書いた回数」で、こもった日数ではありません。年齢は数え年です。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "What If You Were Born a Heian Noble? Even Bath Days Were Set by the Calendar"
  description: |-
    Bathe on the first day of the month, and you will die young. Bathe on the eighteenth, and you will meet thieves. These are rules a Heian-period minister left to his descendants.
    What if you were born into a noble family of Heian Japan, around the year 1000? We follow the diary of Fujiwara no Michinaga and other records of his time, from the day of birth to the night of promotions.
    In this video you will learn:
    - What happened in the room on the day a noble child was born
    - At what age children became adults and received their first court rank
    - The morning rules, and how many days court officials really worked
    - How often Michinaga wrote "monoimi" (days of seclusion) in his diary, and what the yin-yang masters did
    Japanese-language history video (Japanese audio). "What if" is only the question; everything else comes from records.
  chapters:
    - "Bath Days Were Chosen by the Calendar"
    - "The Day of Birth: A Room in White"
    - "When Do You Become an Adult?"
    - "What to Do After Waking Up"
    - "Days You Cannot Leave the House"
    - "A Detour to Sleep Elsewhere"
    - "Who Decides Promotions?"
    - "Summary: If You Were Born a Heian Noble"

