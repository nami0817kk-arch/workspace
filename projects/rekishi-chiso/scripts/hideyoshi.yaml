sections:
  # ---------------------------------------------------------------- 1 導入：はげねずみ
  - title: 1576年ごろ 信長の手紙に残る「はげねずみ」
    background: {image: paintings/nobunaga_letter_to_nene.jpg, credit: "織田信長の書状（ねね宛）1576年ごろと見られる"}
    portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵、1601年ごろ）", age: false}
    year: 1576
    lines:
      - 語り: 織田信長が書いた、1576年ごろと見られる手紙です。宛てた相手は、家臣の妻。その夫のことを、信長は《はげねずみ》と書きました。
        card: {head: "1576年ごろ", body: 信長の手紙に「はげねずみ」}
        short: s1
      - 聞き: はげねずみ？ 信長の家臣で、ねずみって呼ばれた人がいるの？
        tone: 疑問
        short: s1
      - 語り: その家臣が、のちの豊臣秀吉です。手紙の宛先は、秀吉の妻のねねでした。
        short: s1
      - 聞き: 秀吉って「猿」じゃないの？ 申年生まれだから猿、って聞いたことあるよ。
        short: s1
      - 語り: 実は、信長の手紙に「猿」と出てくるものが、1通だけあります。1578年ごろの手紙で、猿が帰ってきて、様子を詳しく話した、と書かれています。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        portrait: null
      - 聞き: あるんじゃん！ やっぱり猿って呼んでたんだ。
        tone: 驚き
      - 語り: ところが、そのころ秀吉は、播磨で三木城攻めに取りかかっていました。わざわざ戻って報告したとは考えにくい、と見る研究者もいます。この猿が秀吉かどうかは、見方が分かれているんです。
      - 語り: はっきり秀吉を指した呼び名として手紙に残るのは、はげねずみのほうです。
        short: s1
      - 聞き: 有名なあだ名がはっきりしなくて、知らないほうが残ってるんだ。あーし、ずっと猿だと思ってた。
      - 語り: 手紙は、夫婦のことで悩むねねへの返事です。信長は、今の言葉にすると、こう書いています。
        background: {image: paintings/nobunaga_letter_to_nene.jpg, credit: "織田信長の書状（ねね宛）1576年ごろと見られる"}
        detail: {box: [0.12, 0.0, 0.62, 1.0], label: 信長がねねに宛てた手紙}
        short: s1
      - 人物: 「そなたほどの女性を、あのはげねずみが、二度と見つけられるはずがない」
        who: 信長
        short: s1
      - 聞き: 主君が、家臣の奥さんの味方をしてる。面倒見のいい上司じゃん。
      - 語り: 捕虜として日本にいた朝鮮の儒者、姜沆の『看羊録』にも、様子が猿のようだった、と書かれています。ただ、信長がそう呼んだ証拠ではありません。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        card: {head: 『看羊録』, body: 「様子が猿のよう」}
      - 聞き: 今年は大河ドラマの『豊臣兄弟！』もやってるし、草履取りとか一夜城とか、秀吉の名場面って、いっぱい知ってる気がする。
        background: {image: paintings/hideyoshi_portrait_seisho_1599.jpg, credit: "《豊臣秀吉像》西笑承兌の賛（1599年）"}
      - 語り: そこには、記録に残ることと、あとから付いた言い伝えが、混ざっているんです。
      - 語り: 名のある家の出ではない若者が、数えで49歳で関白になり、62歳で伏見城で亡くなるまで。その生涯を、生まれた順に、記録と言い伝えに分けて掘っていきます。
      - 聞き: 記録の秀吉と、言い伝えの秀吉。どっちが面白いか、勝負だね。

  # ---------------------------------------------------------------- 2 生まれ〜藤吉郎
  - title: 1537年〜1565年 尾張の中村から木下藤吉郎へ
    background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉の母）"}
    year: 1537
    lines:
      - 語り: 秀吉が生まれたのは、尾張の国の中村。今の名古屋市中村区です。母は、のちに大政所と呼ばれる女性でした。
        card: {head: 1537年, body: 尾張の中村に生まれる（有力説）}
      - 聞き: 生まれた年は？ 天下人なんだから、そこははっきりしてるよね。
        tone: 疑問
      - 語り: それが、2つに分かれます。江戸時代の本は、1536年の元日生まれ。秀吉の《右筆》、大村由己の記録は、酉の年の2月6日。今は、1537年とする説が有力です。
        figure: {type: stats, title: 秀吉の生まれた年（2つの説）, items: [[江戸時代の本, 1536年, 元日生まれ・申年], [大村由己の記録, 1537年, 2月6日・酉年（有力）]]}
      - 聞き: 元日生まれって、いかにも物語っぽい。それに1537年って、酉年でしょ？ 申年じゃないじゃん。
      - 語り: そこなんです。申年生まれだから猿、という話は、1536年の説に乗った話でした。
        figure: null
      - 語り: 幼い名の「日吉丸」も、江戸時代の太閤記の本に出てくる名前で、同じ時代の記録にはありません。
        background: {image: paintings/hideyoshi_yahagibashi_yoshitoshi_1886.jpg, credit: "月岡芳年 矢作橋で日吉丸が蜂須賀小六と出会う場面（1886年、後世の伝説）"}
        card: {head: 日吉丸, body: 同じ時代の記録にない名前}
      - 聞き: この絵も、その日吉丸？ 橋の上で、大人たちに囲まれてるけど。
        tone: 疑問
      - 語り: はい。矢作橋で、日吉丸が蜂須賀小六と出会う、という明治の絵です。ただ、矢作橋が初めて架けられたのは、秀吉が亡くなった3年あと。小六も、もう世を去っていました。
        detail: {box: [0.66, 0.35, 1.0, 0.95], label: 「日吉丸」の名札（明治の想像図）}
      - 聞き: 橋がないのに、橋の上の出会い。伝説あるあるだね。
        tone: 笑い
      - 語り: 父親は、鉄砲足軽だったとも、百姓だったとも書かれます。父の説は、昨日の秀長の回で掘りました。確かなのは、名のある家の出ではなかったことです。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
      - 聞き: 秀長さんとお父さんが同じかどうかも、まだ分かってないんだよね。昨日、それ聞いた。
      - 語り: 少年のころは、今の静岡県、遠江で、松下之綱に仕えたと伝わります。今川家の家臣の、そのまた家来です。
        background: {image: paintings/hideyoshi_matsushita_kahei_toyonobu_1884.jpg, credit: "歌川豊宣《新撰太閤記》木下藤吉郎と松下嘉兵衛（1884年、後世の場面）"}
      - 聞き: 家来の家来って、かなり下からのスタートだね。あーしなら、心折れてるかも。
      - 語り: のちに秀吉は、この松下家を、家臣として取り立てています。
      - 語り: やがて秀吉は、織田信長に仕えます。役目は《小者》、つまり雑用係でした。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）若いころの秀吉を描いた絵"}
        card: {head: "1554年ごろ", body: 信長の小者になる}
      - 聞き: 雑用係？ それって、信長の草履を懐で温めた、あの話でしょ？
        tone: 疑問
      - 語り: その話は、秀吉の死から約200年後の読み物、『絵本太閤記』で広まりました。江戸の初めの太閤記の本には、出てきません。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        card: {head: "1797年〜", body: 『絵本太閤記』で草履の話が広まる}
      - 聞き: 200年後って、今の人が、江戸時代の人の名場面を新しく作るようなもんじゃん。
      - 語り: 雑用係として仕えたことは、多くの解説が一致しています。草履取りだったかどうかは、後の時代の本だけの話です。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）若いころの秀吉を描いた絵"}
      - 語り: 1562年、盗賊を捕らえた手柄で信長の直臣になり、30貫文を与えられた、という話があります。出どころは、江戸時代の『明智軍記』という本です。
        figure: {type: money, title: 盗賊を捕らえた手柄（江戸時代の本の話）, then: "30貫文", yen: 3000000, basis: "京都の大工の日当100文を今の1万円とした目安（1貫は約10万円）。数え方で大きく変わる"}
      - 語り: 京都の大工の日当100文を、今の1万円として数えてみます。
      - 聞き: 30貫文で、約300万円。雑用係から、いきなり給料取りになったってこと？
      - 語り: 直臣としての、毎年の取り分です。数え方で大きく変わる目安ですし、元の本も、あまり信用されていない本です。
      - 語り: それでも研究者の黒田基樹さんは、当時のしきたりに合う話だ、と見ています。
        background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
        figure: null
      - 語り: 確かな記録に名前が出るのは、1565年11月。美濃の武士、坪内利定に土地を認める書状に、《木下藤吉郎秀吉》と名を書き添えています。数えで29歳でした。
        background: {image: paintings/hideyoshi_horio_toyonobu_1884.jpg, credit: "歌川豊宣《新撰太閤記》堀尾吉晴が秀吉を稲葉山へ案内する（1884年、後世の場面）"}
        card: {head: "1565年11月", body: 初めて文書に「木下藤吉郎」}
      - 聞き: 29歳で、やっと初登場。けっこう遅咲きなんだ。
      - 語り: 歴史家の磯田道史さんは、若いころの秀吉の手紙に、誤字や当て字が多いことに注目しています。学ぶ機会がなかった人が、懸命に書類を作る姿が見える、と。
      - 聞き: 字が苦手でも、自分で書いてたんだ。それ、応援したくなる。
      - 語り: 姿の記録もあります。宣教師フロイスは、背が低く、ひげが少なかったと書きました。右手の指が6本あった、という記録も、日本と宣教師の両方にあります。
        background: {image: paintings/hideyoshi_portrait_date_1599.jpg, credit: "《豊臣秀吉像》1599年（宇和島伊達文化保存会蔵）"}
      - 聞き: 別々の人が同じことを書いてるなら、本当だったのかもね。
      - 語り: 前田利家の言行録には、信長が秀吉を「六ツめ」と呼んでいた、ともあります。
      - 聞き: はげねずみに、六ツめ。記録に残る呼び名って、猿じゃないのばっかり。
      - 語り: では、墨俣の一夜城はどうでしょう。信長の家臣が書いた『信長公記』は、1561年に、《信長が》墨俣の砦を直した、と書きます。秀吉の名前は出てきません。
        background: {image: paintings/nobunaga_inabayama_fall_yoshitsuya.jpg, credit: "一英斎芳艶《瓢軍談五十四場》稲葉山落城（幕末、名を変えて描いた木下勢）"}
        detail: {box: [0.15, 0.1, 0.85, 0.85], label: 美濃攻めを描いた幕末の絵（後世の場面）}
      - 聞き: じゃあ一夜城って、誰が言い出したの？
        tone: 疑問
      - 語り: 一夜で築いた細かい話は、1959年に愛知県で見つかった《武功夜話》という文書によります。この文書には、偽物ではないか、という見方が根強くあります。
        card: {head: 1959年, body: 『武功夜話』が見つかる}
      - 聞き: 1959年って、昭和の新発見じゃん。それで戦国の話が増えるの、なんだか怖い。
      - 語り: 美濃を手に入れた信長のもとで、藤吉郎は、やがて、ある町の名前まで変えることになります。
        hook: true

  # ---------------------------------------------------------------- 3 長浜と中国攻め
  - title: 1573年 長浜城主・羽柴秀吉と中国攻め
    background: {image: paintings/hideyoshi_portrait_kiyomasa_museum.jpg, credit: "《豊臣秀吉像》江戸時代（名古屋市秀吉清正記念館蔵）"}
    year: 1573
    lines:
      - 語り: 1573年、信長は近江の浅井氏を滅ぼします。その領地だった北近江の3つの郡、約12万石が、秀吉に与えられました。数えで37歳です。
        card: {head: 1573年, body: 北近江12万石の城持ちに}
      - 聞き: 12万石。1石が、大人1人が1年に食べるお米の量だから、12万人分ってこと？
        tone: 疑問
      - 語り: そのとおりです。
        figure: {type: stats, title: 長浜の秀吉, items: [[与えられた土地, 約12万石, 北近江の3郡], [1年食べられる人, 約12万人, 1石＝1人1年分], [秀吉の歳, 数え37歳, 1573年]]}
      - 聞き: 12万人分！ 雑用係から、ここまで来たんだ。あーし、泣きそう。
      - 語り: 秀吉は、今浜という土地の名を《長浜》に改め、城と城下町を築きました。近くの小谷城の城下から、商人を呼び集めています。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》江戸時代"}
        figure: null
        card: {head: 1573年, body: 今浜を「長浜」に改める}
      - 聞き: 地名ごと変えて、町を作り直す。今も長浜って名前で残ってるもんね。
      - 語り: 名字も、このころ《羽柴》に変わります。丹羽長秀の「羽」と、柴田勝家の「柴」を取った、という話が有名ですね。
        background: {image: paintings/hideyoshi_portrait_kiyomasa_museum.jpg, credit: "《豊臣秀吉像》江戸時代（名古屋市秀吉清正記念館蔵）"}
        card: {head: "1573年7月ごろ", body: 木下から「羽柴」へ}
      - 聞き: 先輩2人から1字ずつ。気配りの人っぽい。
      - 語り: ただ、そう名付けた理由を書いた、同じ時代の記録はありません。よく知られた話、という段階です。
      - 語り: 長浜では、早くから始めたことが、もう一つあります。田んぼの広さと、取れる米の量を測り直す、《検地》です。のちの太閤検地の出発点でした。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》江戸時代"}
      - 聞き: 測り直せば、年貢の取りこぼしがなくなる。経営者みたいな考え方だね。
      - 語り: 1577年10月、秀吉は播磨へ出陣します。西の大名、毛利氏と戦う、中国攻めの司令官でした。
        background: {image: paintings/hideyoshi_banshu_departure_sadahide.jpg, credit: "歌川貞秀《真柴久吉播州発向之図》19世紀（名を変えて描いた秀吉）"}
        card: {head: "1577年10月", body: 中国攻めの司令官に}
      - 聞き: この絵の「真柴久吉」って、もしかして秀吉のこと？ 字がちょっと違うけど。
        tone: 疑問
      - 語り: そうです。江戸時代には、戦国の終わりごろからの武将を、本当の名前で描くことを禁じる決まりがありました。それで、名前を少し変えて描いたんです。明智の回の「武智光秀」と同じしくみです。
      - 語り: 播磨の三木城、因幡の鳥取城では、城を囲んで食べ物の道を断つ、長い包囲戦になりました。城の中は食べ物が尽きて、ひどい状態になったと伝わります。
        background: {image: paintings/hanbei_miki_siege_map.jpg, credit: "《羽柴秀吉三木城包囲図》江戸時代"}
        card: {head: "1578〜81年", body: 三木城・鳥取城を長く囲む}
      - 聞き: この図、城のまわりに小さい陣がぐるっと並んでる。戦うより、相手が持たなくなるのを待つんだ。
      - 語り: こちらの明治の絵は、地図を前にした、秀吉と黒田官兵衛の軍議の場面です。官兵衛は、17日の回で掘ります。
        background: {image: paintings/hideyoshi_kuroda_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》地図を前にした羽柴秀吉の軍議（1883年）"}
      - 語り: そして1582年5月、備中の高松城。秀吉は堤を築いて川をせき止め、城を水に沈めます。《水攻め》です。
        background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
        card: {head: "1582年5月", body: 備中高松城の水攻め}
        year: 1582
      - 聞き: 城を水に沈めるって、発想がほぼダムじゃん。
      - 語り: 毛利の軍も助けに来て、両軍がにらみ合いになりました。その最中、秀吉のもとに、京都から急ぎの知らせが届きます。
        hook: true

  # ---------------------------------------------------------------- 4 中国大返し
  - title: 1582年 本能寺の知らせと中国大返し・山崎の戦い
    background: {image: paintings/akechi_honnoji_nobukazu_1896.jpg, credit: "楊斎延一《本能寺焼討之図》1896年（後世の想像図）"}
    year: 1582
    lines:
      - 語り: 1582年6月2日、本能寺で、信長が明智光秀に討たれました。本能寺の変です。変そのものは、信長の回で掘りましたね。
        card: {head: "1582年6月2日", body: 本能寺の変}
      - 語り: 知らせが備中の秀吉に届いたのは、6月3日の夜と言われます。この明治の絵は、その場面です。
        background: {image: paintings/hideyoshi_takamatsu_news_yoshitoshi_1885.jpg, credit: "月岡芳年《教導立志基》信長の死を知る秀吉（1885年）"}
      - 聞き: 主君が討たれて、目の前には毛利の大軍。あーしなら、どっちに逃げるかで迷う。
      - 語り: 秀吉は、まず和睦を急ぎます。6月4日、城主の清水宗治が、自らの命と引き換えに城兵を助けることを条件に、毛利との和睦が成りました。
        background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
        card: {head: "6月4日", body: 毛利と和睦}
      - 語り: その翌日、6月5日付の秀吉の手紙が残っています。味方の武将に、上様も殿様もご無事で、近江の膳所に退かれた、と書きました。
        background: {image: paintings/hideyoshi_takamatsu_news_yoshitoshi_1885.jpg, credit: "月岡芳年《教導立志基》信長の死を知る秀吉（1885年）"}
        card: {head: "6月5日", body: 「上様も殿様も御無事」の手紙}
      - 聞き: え、信長は討たれてるのに？ それ、うそじゃん。
        tone: 驚き
      - 語り: 事実と違う知らせです。味方が明智の側につかないよう、引きとめたものと見られています。
      - 聞き: いちばん大変なときに、まず情報戦。ずる賢いけど、頭はめちゃくちゃ回ってる。
      - 語り: 1582年6月、秀吉は備中高松から、都へ向けて引き返します。《中国大返し》です。
        background: {image: paintings/hanbei_harima_map.jpg, credit: "《播磨国絵図》江戸時代（フランス国立図書館蔵）"}
        figure: {type: map, title: 中国大返し, bounds: [133.4, 136.1, 34.3, 35.3], route: [備中高松, 姫路, 尼崎, 山崎], places: [[備中高松, 133.82, 34.69], [姫路, 134.69, 34.83], [尼崎, 135.42, 34.73], [山崎, 135.68, 34.89], [京都, 135.77, 35.01]], note: およそ230km}
        short: s2
      - 語り: 備中高松から山崎まで、およそ230キロ。かかった日数は、およそ10日です。
        figure: {type: calc, title: 中国大返し, terms: [[約230km, 備中高松→山崎], [約10日], [約23km, 1日あたり]], ops: [÷, ＝]}
        short: s2
      - 聞き: 1日23キロって、毎日ハーフマラソンより長く歩くってこと？ しかも鎧つきで？
        short: s2
      - 語り: 速かったのは確かです。いちばん速いのは、沼城から姫路までの約70キロで、1日か2日で駆け抜けました。
        figure: null
        short: s2
      - 聞き: 70キロを1日か2日！？ 部活の合宿でも、そんなに走らない。
        tone: 驚き
        reaction: {number: 約70km, lead: 沼城から姫路まで, say: 1日か2日で！？}
        short: s2
      - 語り: ただ、ずっと走り続けたわけではありません。姫路に着いたのは6月7日ごろ。日付は記録で割れますが、秀吉はここで休んで、兵を整えています。
        background: {image: paintings/hideyoshi_kokoku24ko_yoshitoshi_1887.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
        card: {head: "6月7日ごろ", body: 姫路で休み、兵を整える}
        short: s2
      - 聞き: 休むのも作戦のうちか。そういえば姫路で、城のお金やお米を家来に全部配った、って話も聞いたことある。
      - 語り: その話は、出どころがはっきりしない言い伝えです。
      - 語り: 速さの話が広まったのには、わけがあります。秀吉の右筆、大村由己が、変の4か月後に書いた《惟任退治記》です。惟任は、光秀が信長から与えられた名字です。
        background: {image: paintings/hideyoshi_portrait_kiyomasa_museum.jpg, credit: "《豊臣秀吉像》江戸時代（名古屋市秀吉清正記念館蔵）"}
        card: {head: "1582年10月", body: 『惟任退治記』が書かれる}
      - 聞き: 秀吉の書記が書いたなら、それ、秀吉の自慢話じゃん。
      - 語り: そう見る研究者もいます。奇跡の大返しは、秀吉自身の宣伝でもあった、というわけです。明智の回で触れた、光秀を逆臣として描いた記録も、この本でした。
      - 語り: 秀吉は変を前もって知っていた、という説もあります。ただ、根拠になった手紙は年が分からず、今も説の段階です。
      - 聞き: 黒幕説は、ロマンはあるけど決め手なし、ってことね。
      - 語り: 6月13日、京都の南の山崎で、両軍はぶつかりました。数は諸説ありますが、明智の回と同じく、秀吉の軍がおよそ2万7千、明智軍がおよそ1万7千です。
        background: {image: paintings/akechi_yamazaki_sadahide_met.jpg, credit: "歌川貞秀《山崎大合戦之図》19世紀中ごろ"}
        card: {head: "6月13日", body: 山崎の戦い}
        figure: {type: bars, title: 山崎の戦いの兵の数（諸説）, bars: [[秀吉の軍, 27000], [明智軍, 17000]], labels: [約2万7千, 約1万7千]}
      - 聞き: 1万も多い。そのうえ戻ってくるのが早すぎて、光秀さんは味方も集めきれなかったんだよね。
      - 語り: 秀吉が勝ち、光秀は退く途中で命を落としました。変から、およそ11日後のことです。
        figure: null
      - 語り: 主君の仇を討ったのは秀吉。でも織田家には、まだ跡継ぎも、古くからの重臣たちもいました。
        hook: true

  # ---------------------------------------------------------------- 5 清洲・賤ヶ岳・大坂城
  - title: 1582年〜1585年 清洲会議・賤ヶ岳の戦い・大坂城
    background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』清洲会議で三法師を抱く秀吉（1797〜1802年、後世の場面）"}
    year: 1582
    lines:
      - 語り: 1582年6月27日、尾張の清洲城。柴田勝家、丹羽長秀、池田恒興、そして秀吉の4人が集まりました。《清洲会議》です。
        card: {head: "1582年6月27日", body: 清洲会議}
      - 聞き: 知ってる。秀吉が信長の孫の赤ちゃんを抱っこして出てきて、みんながひれ伏したやつ。
      - 語り: この『絵本太閤記』の挿絵が、まさにその場面です。ただ、これは江戸時代の『川角太閤記』に出てくる話で、後から作られた可能性があります。
      - 聞き: やっぱり、あとから付いた話だったか。
      - 語り: 会議で決まったのは、信長の孫で3歳の三法師が、家督を継ぐことでした。
        background: {image: paintings/hideyoshi_daitokuji_funeral_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（三法師を抱く秀吉、後世の場面）"}
        card: {head: "1582年6月", body: 三法師（3歳）が家督を継ぐ}
      - 語り: 研究者の柴裕之さんは、これは信長の生前からの方針だった、と見ています。話し合いの中心は、代わりに誰が政治を見るかだった、というんです。
      - 聞き: じゃあ、秀吉の機転で決まったわけじゃないんだ。この明治の絵も、また赤ちゃんを抱っこしてるけど。
      - 語り: こちらは、その秋の、信長の葬儀の場面です。明治の絵描きにとっても、三法師を抱く秀吉は、外せない名場面だったんですね。
      - 語り: 秀吉が得たのは、山城や河内など、28万石の加増でした。一方、勝家には、秀吉の長浜が渡ります。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》江戸時代"}
      - 聞き: 長浜を取られちゃうの？ せっかく名前まで付けた町なのに。
      - 語り: その勝家とは、翌1583年4月、近江の賤ヶ岳でぶつかります。この絵は、法螺貝を吹く秀吉を描いた、明治の作品です。
        background: {image: paintings/hideyoshi_shizugatake_moon_yoshitoshi_1888.jpg, credit: "月岡芳年《月百姿》志津か嶽月（1888年）"}
        card: {head: "1583年4月", body: 賤ヶ岳の戦い}
        year: 1583
      - 語り: 秀吉は、そのとき美濃の大垣にいました。砦が落ちたと聞くと、午後2時に大垣を出て、木之本まで約52キロを、5時間で戻ったと言われています。
        card: {head: "1583年4月20日", body: 大垣から木之本へ 約52km}
      - 聞き: 52キロを5時間って、時速10キロ。先頭は、ジョギングの速さで動いてる。
      - 語り: 「美濃大返し」と呼ばれる強行軍です。戦いは、秀吉の軍5万から7万に対し、勝家の軍は3万ほどでした。
        background: {image: paintings/hideyoshi_shizugatake_screen_1.jpg, credit: "《賤ヶ岳合戦図屏風》右隻（江戸時代）"}
      - 語り: 1583年の賤ヶ岳の戦いで活躍した若い家臣たちが、《賤ヶ岳の七本槍》です。福島正則や、加藤清正たち7人ですね。
        background: {image: paintings/hideyoshi_shizugatake_chikanobu.jpg, credit: "楊洲周延《賤ヶ嶽合戦》加藤虎之助（清正）の場面（1897年ごろ）"}
        short: s5
      - 聞き: 七本槍って、名前がかっこいい。戦国の推しグループ、って感じ。
        short: s5
      - 語り: ところが、この戦いの手柄で、秀吉から感状、つまり褒める書状をもらったのは、9人でした。
        card: {head: 1583年, body: 感状をもらったのは9人}
        short: s5
      - 聞き: 9人なのに七本槍？ あとの2人、どこ行ったの。
        tone: 疑問
        short: s5
      - 語り: 桜井家一と、石川一光です。石川は、この戦いで命を落とし、感状は弟に渡されました。
        short: s5
      - 語り: 七本槍という呼び名が出てくるのは、江戸の初めの『甫庵太閤記』から。
        background: {image: paintings/hidenaga_shizugatake_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》賤ヶ岳の戦い（1883年）"}
        short: s5
      - 語り: 秀吉の右筆が書いたと伝わる『柴田合戦記』には、9人が並んでいます。7は、語呂のよさで決まった、と見られています。
        short: s5
      - 聞き: 推しグループから外されたメンバー、切ない。今からでも九本槍にしてあげて。
        short: s5
      - 語り: 敗れた勝家は越前に退き、お市の方とともに最期を迎えました。
        background: {image: paintings/hideyoshi_shizugatake_screen_2.jpg, credit: "《賤ヶ岳合戦図屏風》左隻（江戸時代）"}
      - 聞き: そこは、今日のお昼のお市さんの回で掘ったところだね。『柴田合戦記』も、そこで出てきた。
      - 語り: 同じ1583年、秀吉は大坂で、新しい城を築き始めます。かつて石山本願寺があった場所です。
        background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
        card: {head: 1583年, body: 大坂城を築き始める}
      - 語り: 天守は1585年に完成しました。外から見て5重、地面から高さ約40メートル。この屏風の左のほうに、その天守が描かれています。
        detail: {box: [0.12, 0.12, 0.32, 0.6], label: 屏風に描かれた大坂城の天守}
      - 聞き: 40メートルって、ビルの13階くらい？ 当時なら、町のどこからでも見えたね。
        detail: {box: [0.12, 0.12, 0.32, 0.6], label: 屏風に描かれた大坂城の天守}
      - 語り: ただ、この豊臣の大坂城は、30年ほどあとの大坂の陣で焼けました。徳川が上に土を盛って、新しい城を築いたんです。
        background: {image: paintings/nene_osaka_castle_summer_screen_detail.jpg, credit: "《大坂夏の陣図屏風》部分（17世紀前半、大阪城天守閣蔵）"}
      - 聞き: 今の大阪城の天守閣って、昭和の初めに建て直したもの、って聞いたことある。
      - 語り: はい、1931年の再建です。でも豊臣の城は、徳川の盛り土の下に残っていました。1959年、地下約7メートルで豊臣の石垣が見つかります。
        card: {head: 1959年, body: 地下約7mで豊臣の石垣}
      - 語り: 1984年に掘り出された石垣は、2025年から「豊臣石垣館」で見られます。
      - 聞き: 地下7メートル。まさに地層の下から出てきたんだ。あーしたちの出番じゃん。
      - 語り: 1584年には、小牧・長久手で、徳川家康と織田信雄を相手に戦います。長久手では甥の秀次たちの軍が敗れました。
        background: {image: paintings/hideyoshi_komaki_chikanobu.jpg, credit: "楊洲周延《小牧山 康政秀吉追ふ》明治時代"}
        card: {head: 1584年, body: 小牧・長久手の戦い}
      - 語り: それでも秀吉は、信雄と和睦して、家康が戦う理由をなくします。
      - 語り: のちに秀吉は、妹の朝日を家康に嫁がせ、さらに母の大政所を、人質として家康のもとへ送りました。
        background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉の母）"}
      - 聞き: お母さんを人質に！？ そこまでして、家康を味方にしたかったんだ。
        tone: 驚き
      - 語り: 戦で勝ちきれない相手は、家族まで使って取り込む。そのころ秀吉は、もう、武士が誰も就いたことのない職に就いていました。
        hook: true

  # ---------------------------------------------------------------- 6 関白・豊臣・天下一統
  - title: 1585年〜1590年 関白・豊臣の姓・刀狩と天下一統
    background: {image: paintings/hideyoshi_sokutai_1832.jpg, credit: "『豊公遺宝図略』秀吉が着たと伝わる束帯の図（1832年）"}
    year: 1585
    lines:
      - 語り: 1584年10月、秀吉は朝廷から位を受けます。そこから、わずか1年足らず。1585年7月11日、《関白》になりました。数えで49歳です。
        card: {head: "1585年7月11日", body: 武家で初めて関白に}
      - 聞き: 1年で一番上まで！？ 部長が、1年で会長になるくらいの話じゃん。
        tone: 驚き
      - 語り: 関白は、本来、藤原氏の5つの家だけが就く職です。秀吉は、公家の近衛前久の《猶子》、つまり形だけの養子になって、その道を開きました。
        detail: {box: [0.08, 0.08, 0.92, 0.7], label: 秀吉が着たと伝わる束帯の図（江戸時代の本）}
      - 聞き: 資格がないなら、資格のある家の子になっちゃえ、と。発想がやわらかい。
      - 語り: 翌1586年9月には、天皇から《豊臣》という姓を賜ります。源・平・藤原・橘に並ぶ、新しい姓です。
        background: {image: paintings/hideyoshi_portrait_seisho_1599.jpg, credit: "《豊臣秀吉像》西笑承兌の賛（1599年）"}
        card: {head: "1586年9月", body: 豊臣の姓を賜る}
      - 語り: ここで一つ、ややこしい話を。豊臣は姓、羽柴は名字で、秀吉は羽柴の名字も使い続けました。
        figure: {type: stats, title: 秀吉の2つの名前, items: [[姓, 豊臣, 1586年に天皇から], [名字, 羽柴, 1573年ごろから]]}
      - 聞き: 姓と名字が別？ 豊臣は朝廷での家の名前で、羽柴はふだんの名字、みたいな感じ？
        tone: 疑問
      - 語り: その理解で近いと思います。
      - 語り: 同じ1586年、京都に、関白の屋敷を兼ねた城、《聚楽第》を築き始めます。
        figure: null
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        card: {head: "1586年2月", body: 聚楽第を築き始める}
      - 語り: 1588年4月には、後陽成天皇が、この聚楽第を訪れました。
        card: {head: "1588年4月14日", body: 後陽成天皇が聚楽第へ}
      - 聞き: 天皇が、自分の家に来てくれる。まわりの大名への、すごい見せつけだね。
      - 語り: 1992年の工事では、聚楽第の跡から、金箔の瓦が約600点も見つかっています。江戸時代の平面図には、まわりに大名の屋敷が並んで描かれました。
        background: {image: paintings/hideyoshi_jurakudai_3.jpg, credit: "《聚楽古城之図》江戸時代中期〜末期"}
      - 聞き: 金の瓦が600点。屋根が、お日さまでピカピカ光ってたのかな。
      - 語り: 1588年7月8日、秀吉は、もう一つ有名な命令を出します。《刀狩令》です。この写しの左に、その日付と朱印があります。
        background: {image: paintings/hideyoshi_katanagari_p2.jpg, credit: "刀狩令（天正16年7月8日）の写し（早稲田大学図書館蔵）"}
        card: {head: "1588年7月8日", body: 刀狩令}
        short: s3
      - 聞き: 刀狩って、百姓から刀を全部取り上げて、丸腰にしたやつでしょ？
        detail: {box: [0.2, 0.25, 0.4, 0.75], label: 「天正十六年七月八日」と朱印}
        short: s3
      - 語り: 中身は3か条です。1つ目は、百姓が武器を持つことの禁止。刀に脇差、弓、槍、鉄砲です。
        figure: {type: stats, title: 刀狩令の3か条, items: [[1つ目, 武器の禁止, 刀・脇差・弓・槍・鉄砲], [2つ目, 大仏の釘に, 方広寺の大仏], [3つ目, 農具で耕す, 子孫まで栄える]], upto: 1}
        short: s3
      - 語り: 2つ目は、集めた武器を、京都の方広寺に造る大仏の、釘やかすがいにする。そうすれば、来世まで救われる、という理屈です。
        background: {image: paintings/hideyoshi_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》1796年以前（方広寺の大仏殿、江戸時代に建て直した姿）"}
        figure: {type: stats, title: 刀狩令の3か条, items: [[1つ目, 武器の禁止, 刀・脇差・弓・槍・鉄砲], [2つ目, 大仏の釘に, 方広寺の大仏], [3つ目, 農具で耕す, 子孫まで栄える]], upto: 2}
        short: s3
      - 聞き: 刀が大仏の釘になって、来世までお得。うまいこと言うなあ。
        figure: null
      - 語り: そして3つ目。
        short: s3
      - 聞き: 百姓は農具だけ持って耕していれば、子孫まで長く栄える、でしょ？ 教科書で読んだ気がする。
        figure: {type: stats, title: 刀狩令の3か条, items: [[1つ目, 武器の禁止, 刀・脇差・弓・槍・鉄砲], [2つ目, 大仏の釘に, 方広寺の大仏], [3つ目, 農具で耕す, 子孫まで栄える]], upto: 3}
        short: s3
      - 語り: はい。ただ、研究者の藤木久志さんは、完全な武装解除ではなかったと見ています。村には鉄砲なども残りました。取り上げたのは、刀を差すという身分の印だった、というわけです。
        background: {image: paintings/hideyoshi_katanagari_p2.jpg, credit: "刀狩令（天正16年7月8日）の写し（早稲田大学図書館蔵）"}
        figure: null
        short: s3
      - 聞き: 武器を全部じゃなくて、刀を差すのは武士だけ、っていう線引きか。
      - 語り: その少し前から、秀吉は全国の田畑を測り直していました。《太閤検地》です。
        background: {image: paintings/hanbei_harima_map.jpg, credit: "《播磨国絵図》江戸時代（フランス国立図書館蔵）"}
        figure: {type: stats, title: 太閤検地のものさし, items: [[長さ, 1間＝6尺3寸], [広さ, 300歩＝1反], [量, 京枡にそろえる]]}
      - 語り: 長さも、広さも、お米を量る枡も、全国で同じものにそろえました。田畑は上・中・下に分けて、取れる米の量を決め、耕す人を1人ずつ帳面に載せています。
      - 聞き: ものさしを全国でそろえる。地味だけど、あーしはこういうの好き。今の計量のルールみたいな話じゃん。
      - 語り: こうして数えた全国の石高は、1598年の数字で、約1850万石です。
        background: {image: paintings/hideyoshi_portrait_date_1599.jpg, credit: "《豊臣秀吉像》1599年（宇和島伊達文化保存会蔵）"}
        figure: {type: line, title: 全国の石高, points: [[1598年, 1850], [天保のころ, 3055], [1872年, 3237]], unit: 万石, upto: 1}
        card: {head: 1598年, body: 全国の石高 約1850万石}
      - 聞き: 1850万人が、1年食べられる量。国をまるごと、お米で数えたんだ。
        tone: 驚き
        reaction: {number: 約1850万石, lead: 全国の石高（1598年）, say: 国ぜんぶをお米で数えた！}
      - 語り: 土地の大きさを米の量で表すしくみは、このあと約300年続きます。新しい田を開いたことなどで、明治の初めには約3200万石まで増えました。
        figure: {type: line, title: 全国の石高, points: [[1598年, 1850], [天保のころ, 3055], [1872年, 3237]], unit: 万石, upto: 3}
      - 語り: 1590年、秀吉は関東の小田原城を囲み、7月、北条氏が降伏します。続いて東北の大名の扱いを決め、全国が一つにまとまりました。数えで54歳です。
        background: {image: paintings/hideyoshi_portrait_kiyomasa_museum.jpg, credit: "《豊臣秀吉像》江戸時代（名古屋市秀吉清正記念館蔵）"}
        figure: {type: map, title: 1590年 天下一統, bounds: [134.8, 141.0, 33.8, 37.6], route: [京都, 小田原, 宇都宮], places: [[京都, 135.77, 35.01], [小田原, 139.15, 35.25], [宇都宮, 139.88, 36.56]], note: 小田原の北条氏が降伏}
        card: {head: "1590年7月", body: 北条氏が降伏し天下一統}
      - 聞き: 尾張の中村から、54歳で天下一統。ここが、てっぺんだね。
        figure: null
      - 語り: てっぺんに着いた、その翌年。秀吉は、関白の座を手放すことになります。
        hook: true

  # ---------------------------------------------------------------- 7 喪失・朝鮮への出兵・ひろい・秀次
  - title: 1591〜97年 秀長・利休の死と朝鮮出兵・秀頼誕生
    background: {image: paintings/hideyoshi_portrait_osaka_city_1600.jpg, credit: "《豊臣秀吉像》1600年（大阪市立美術館蔵）"}
    year: 1591
    lines:
      - 語り: 1591年1月、弟の秀長が、大和の郡山城で病のため亡くなります。数えで52歳。昨日の回で掘った、政権の支え役です。
        card: {head: "1591年1月", body: 弟・秀長が亡くなる}
      - 語り: 2月には、茶人の千利休が、秀吉の命で自ら命を絶ちました。
        card: {head: "1591年2月", body: 千利休が亡くなる}
      - 聞き: 表のことは秀長、内々のことは利休。昨日の回で、そう言われてた2人だよね。
      - 語り: そうです。8月には、3歳の長男、鶴松も病で亡くなりました。
        card: {head: "1591年8月", body: 長男・鶴松が亡くなる}
      - 聞き: 年の初めに弟、秋には息子。その年の秀吉、どんな顔で過ごしてたんだろう。
        tone: しみじみ
      - 語り: この年の12月、秀吉は関白を甥の秀次に譲ります。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        card: {head: "1591年12月", body: 関白を秀次に譲り「太閤」に}
      - 聞き: それで《太閤》って呼ばれるようになったんだ。太閤って名前じゃなくて、関白を譲った人の呼び方なんだよね。
      - 語り: 同じ1591年の8月、秀吉は、肥前、今の佐賀県に、名護屋城を築くよう命じていました。工事が始まったのは10月です。
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
        card: {head: "1591年8月", body: 名護屋城を築くよう命じる}
      - 聞き: 名護屋って、名古屋とは字が違うんだ。九州の、海の近くなんだね。
      - 語り: 目指したのは、朝鮮を通って、明、つまり当時の中国を従えるという構想です。《唐入り》と呼ばれます。なぜそこまでしたのか、研究者のあいだでも結論は出ていません。
      - 聞き: 天下一統のすぐあとに、海の向こうまで。その理由、本人に聞いてみたい。
      - 語り: 1592年4月、日本の軍、約15万8千人が朝鮮に渡ります。文禄の役です。韓国では、壬辰倭乱と呼ばれています。
        portrait: {image: paintings/hideyoshi_nagoya_castle_screen.jpg, caption: "肥前名護屋城図屏風（伝 狩野光信、1590年代）", age: false}
        card: {head: "1592年4月", body: 文禄の役}
      - 語り: 名護屋にいた1592年7月、母の大政所が重い病だと、知らせが届きます。秀吉は急いで戻りますが、間に合いませんでした。
        background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉の母）"}
        portrait: null
        card: {head: "1592年7月", body: 母・大政所が亡くなる}
      - 語り: 母は、京都の聚楽第で亡くなっていました。
      - 聞き: 海の向こうの戦を始めたその年に、お母さんを見送れなかったんだ。
        tone: しみじみ
      - 語り: 1593年8月3日、側室の淀殿が、大坂城で男の子を産みます。秀吉は、数えで57歳。のちの秀頼です。
        background: {image: paintings/hideyoshi_hideyori_1914copy.jpg, credit: "《伝 豊臣秀頼像》の模写（1914年、原本は養源院蔵）"}
        card: {head: "1593年8月3日", body: 秀頼が生まれる}
        short: s4
      - 聞き: 57歳で、また子どもを。鶴松くんのことがあったから、うれしかっただろうね。
        short: s4
      - 語り: 知らせを聞いた秀吉は、おねに自筆の手紙を書きました。
        icon: envelope-simple
        short: s4
      - 語り: 丈夫に育つように、いったん捨てて、家臣に拾わせる習わしにした。だから名前は、《ひろい》にする、と。
        background: {image: paintings/hideyoshi_hideyori_edo.jpg, credit: "伝 花野光明《豊臣秀頼像》17世紀"}
        short: s4
      - 聞き: 拾ったから、ひろい。名前の付け方、まっすぐすぎる。
        short: s4
      - 語り: 続きを、今の言葉にすると、こうです。
        short: s4
      - 人物: 「下々の者まで、『お』の字は付けずに、ひろい、ひろいと呼ぶように。すぐに、すぐに帰ります。安心してください」
        who: 秀吉
        short: s4
      - 語り: 署名は「たいこう」。ところが、「お」を付けるなと命じた本人が、すぐに自分で「おひろい」と呼んで、かわいがり始めます。
        background: {image: paintings/hideyoshi_hideyori_1914copy.jpg, credit: "《伝 豊臣秀頼像》の模写（1914年、原本は養源院蔵）"}
        short: s4
      - 聞き: 自分で決めたルールを、自分がいちばんに破ってる。完全に親ばかだ。あーし、こういう秀吉なら好きかも。
        tone: 笑い
      - 語り: この手紙は今、京都の高台寺にある重要文化財です。ほかの手紙は、22日のねねの回で掘ります。
      - 語り: ただ、この子が生まれたあと、跡継ぎをめぐって、悲しい出来事が起きます。
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      - 聞き: 悲しい出来事って……ひろいくんが生まれたこと、関係あるの？
        tone: 疑問
      - 語り: 1595年の夏、関白の秀次に謀反の噂が立ち、高野山へ移されます。秀頼が生まれて、2年後のことでした。そして7月、秀次は、そこで自ら命を絶ちます。
        card: {head: "1595年7月", body: 秀次が高野山で亡くなる}
      - 語り: 秀吉の命令だったのか、秀次が自ら選んだのか。研究者の説は分かれています。
      - 聞き: どっちにしても、秀吉が追いつめたことには変わりない気がする。
        tone: 重い
      - 語り: 秀次の妻や子どもたちも、命を奪われました。見物人からも、むごい、という声が上がったと記録されています。
        background: {image: paintings/hidenaga_jurakudai_mitsui.jpg, credit: "聚楽第を描いた屏風の部分（17世紀中ごろ）"}
      - 語り: 秀次が住んだ聚楽第も壊され、今の京都には、ほとんど跡が残っていません。江戸時代には、古い城の跡として、図に描かれるだけになりました。
        background: {image: paintings/hideyoshi_jurakudai_3.jpg, credit: "《聚楽古城之図》江戸時代中期〜末期"}
      - 聞き: さっき天皇を迎えた、あの聚楽第が。ひろいくんが生まれて、ここまで変わっちゃうんだ。
        tone: しみじみ
      - 語り: 朝鮮との戦いは長引き、講和もまとまりません。1597年、秀吉は再び兵を送ります。慶長の役です。朝鮮の人々にも、大きな犠牲が出ました。
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
        card: {head: "1597年", body: 慶長の役}
      - 語り: 決着がつかないまま、日本の軍が引き揚げたのは、秀吉の死のあとでした。
        figure: {type: bars, title: 朝鮮に渡った日本の軍（記録で幅がある）, bars: [[文禄の役（1592年）, 158000], [慶長の役（1597年）, 140000]], labels: [約15万8千人, 約14万人]}
      - 聞き: 始めた本人が亡くなるまで、終わらなかったんだ。
        figure: null
      - 語り: その戦いのさなか、秀吉自身に残された時間も、あと1年ほどでした。
        hook: true

  # ---------------------------------------------------------------- 8 醍醐の花見と最期
  - title: 1598年 醍醐の花見と伏見城の最期
    background: {image: paintings/hideyoshi_daigo_hanami_screen.jpg, credit: "《醍醐花見図屏風》部分（桃山時代、国立歴史民俗博物館蔵）"}
    year: 1598
    lines:
      - 語り: 1598年3月15日、京都の醍醐寺で、秀吉は花見を開きます。《醍醐の花見》です。この屏風の右、傘の下にいるのが秀吉。そばの女性が北政所、つまりねねと見られています。
        card: {head: "1598年3月15日", body: 醍醐の花見}
        detail: {box: [0.42, 0.25, 1.0, 0.95], label: 傘の下の秀吉（醍醐花見図屏風）}
      - 聞き: 天下人のお花見。どれくらいの人を呼んだの？
        tone: 疑問
      - 語り: 秀吉は、各地から700本の桜を集めて、植えさせました。招かれたのは、女房や女中など約1300人と伝わります。男性は、秀吉と秀頼、前田利家くらいだったそうです。
      - 聞き: 女性ばっかり1300人。あーしも呼ばれたかった。
      - 語り: これが、秀吉の生涯で最後の、大きな催しになりました。
        background: {image: paintings/nene_hana_zue_1896.jpg, credit: "尾形月耕《日本花図絵 醍醐の花》1896年"}
      - 聞き: 桜の下を歩く秀吉の絵。きれいなのに、最後って聞くと、少しさみしく見える。
        tone: しみじみ
      - 語り: その夏、秀吉は伏見城で病に倒れます。7月、五大老と五奉行に遺言の覚え書きを与え、誓いの書を出させました。
        background: {image: paintings/hideyoshi_portrait_osaka_city_1600.jpg, credit: "《豊臣秀吉像》1600年（大阪市立美術館蔵）"}
        portrait: {image: paintings/hideyoshi_hideyori_edo.jpg, caption: "豊臣秀頼（伝 花野光明画、17世紀）", age: false}
        card: {head: "1598年7月", body: 五大老・五奉行に遺言}
      - 語り: 8月5日付の、秀吉自筆の遺言状の下書きも残っています。宛先は、徳川家康たち5人です。
        card: {head: "1598年8月5日", body: 遺言状「秀頼のことを頼む」}
      - 聞き: 家康も入ってるんだ。このあとのことを考えると、複雑。
      - 語り: 今の言葉にすると、秀頼のことを頼みます、ほかに思い残すことはありません、という中身です。
        background: {image: paintings/hideyoshi_hideyori_1914copy.jpg, credit: "《伝 豊臣秀頼像》の模写（1914年、原本は養源院蔵）"}
        portrait: null
      - 聞き: 天下のことより、最後は息子のことなんだ。
      - 語り: 最後に書き足した部分でも、くり返し頼んでいます。秀頼のことを頼む。五人の方々、頼みます、と。
      - 聞き: 2回も頼むって、よっぽど心配だったんだね。秀頼くん、まだ数えで6歳だもん。
      - 語り: 1598年8月18日、秀吉は伏見城で亡くなりました。数えで62歳。病の名前は、記録に残っていません。
        background: {image: paintings/hideyoshi_portrait_date_1599.jpg, credit: "《豊臣秀吉像》1599年（宇和島伊達文化保存会蔵）"}
        portrait: null
        card: {head: "1598年8月18日", body: 伏見城で亡くなる（数え62歳）}
        tone: 重い
      - 聞き: 天下人でも、最後は何の病気か書き残されないんだ。
      - 語り: その死はしばらく伏せられ、そのあいだに、朝鮮からの撤兵が進められました。
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
      - 語り: 秀吉の辞世の歌が、本人の筆で残っています。大阪城天守閣にある、重要文化財です。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        card: {head: 辞世, body: 「露と落ち 露と消えにし我が身かな」}
      - 人物: 「露と落ち、露と消えにし我が身かな。なにわのことも、夢のまた夢」
        who: 秀吉
      - 語り: なにわは、大坂のこと。大坂で天下を治めたことも、夢の中の夢だった、という歌です。
        background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
        tone: しみじみ
      - 聞き: 露って、朝の草にできて、お昼には消えちゃう、あの露でしょ？ 天下を取った人の最後の歌が、それなんだ。
      - 語り: 文化庁の解説には、死を前に詠んだ歌で、ややかすれた文字で書かれている、とあります。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        icon: pen-nib
      - 聞き: かすれた字って、筆を持つのも、しんどかったのかな。
        tone: しみじみ
      - 語り: 亡くなったあと、秀吉は朝廷から豊国大明神という神の名を贈られ、まつられました。この屏風は、そのお祭りのにぎわいを描いたものです。
        background: {image: paintings/nene_toyokuni_festival_honolulu.jpg, credit: "《豊国祭礼図屏風》1604年ごろ（ホノルル美術館蔵）"}
      - 語り: では、この62年の生涯は、どうやって、私たちの知る秀吉の物語になったのでしょうか。
        hook: true

  # ---------------------------------------------------------------- 9 まとめ
  - title: まとめ：豊臣秀吉とは何者だったのか
    background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』三法師を抱く秀吉（1797〜1802年、後世の場面）"}
    year: 1797
    lines:
      - 語り: 秀吉の死から約200年後の1797年、《絵本太閤記》が出始めます。84冊にもなる、大当たりの読み物でした。この、三法師を抱く秀吉の挿絵も、その本のものです。
        card: {head: 1797年, body: 『絵本太閤記』が出始める}
      - 聞き: 草履を温めた話も、ここからだったよね。
      - 語り: はい。墨俣の一夜城もです。今日見てきた名場面の多くが、この本で、痛快な物語になりました。
        detail: {box: [0.25, 0.2, 0.75, 0.6], label: 三法師を抱く秀吉（『絵本太閤記』）}
      - 聞き: 農民の子が天下人に、っていう出世物語は、江戸時代の読み物で形になったってこと？
      - 語り: そう言えます。ところが1804年、この本は、幕府によって突然、絶版にされました。理由ははっきりしません。のちには、この本を持っていた人が、遠くの島へ流された例もあります。
        background: {image: paintings/hideyoshi_five_wives_utamaro_met.jpg, credit: "喜多川歌麿《太閤五妻洛東遊観之図》1804年（メトロポリタン美術館）"}
        card: {head: 1804年, body: 『絵本太閤記』が絶版に}
      - 語り: 同じ1804年、喜多川歌麿も、この絵で罰を受けています。禁じられていた秀吉の名前と紋を、そのまま描いていたからです。
      - 聞き: 真柴久吉の、あの決まりだ。名前を出すだけで罰なのに、江戸の人たち、それでも秀吉の話が読みたかったんだね。
      - 語り: では、記録から見えた秀吉を、3つにまとめます。1つ目。名のある家の出ではない人が、29歳で初めて記録に名を残し、49歳で関白になりました。
        background: {image: paintings/hideyoshi_portrait_seisho_1599.jpg, credit: "《豊臣秀吉像》西笑承兌の賛（1599年）"}
        figure: {type: line, title: 出来事と秀吉の歳（数え）, points: [[1565年, 29], [1573年, 37], [1585年, 49], [1590年, 54], [1598年, 62]], unit: 歳}
      - 聞き: 記録に出てから、関白まで20年。で、2つ目は、ものさしをそろえた人でしょ？ 検地で国じゅうをお米で数えて、刀狩で武士と百姓の線を引いた。
      - 語り: そのとおりです。そのしくみは、江戸時代まで続きました。
        background: {image: paintings/hideyoshi_katanagari_p2.jpg, credit: "刀狩令（天正16年7月8日）の写し（早稲田大学図書館蔵）"}
        figure: null
      - 語り: その一方で、晩年の朝鮮への出兵と秀次の事件は、多くの人を苦しめ、豊臣家の力も弱めました。
      - 語り: 3つ目。秀吉は、自分の物語を書かせた人でもありました。『惟任退治記』の大返しから、200年後の『絵本太閤記』まで、その姿は、語られるたびに大きくなっていきます。
        background: {image: paintings/hideyoshi_kokoku24ko_yoshitoshi_1887.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
      - 聞き: 宣伝上手な人の物語が、死んだあとも、ずっと大きくなっていったんだ。
      - 語り: そして記録の最後に残るのは、57歳で授かった子に、ひろいと名付けた父親の姿です。「お」を付けるなと言いながら、自分で「おひろい」と呼んでいました。
        background: {image: paintings/hideyoshi_hideyori_1914copy.jpg, credit: "《伝 豊臣秀頼像》の模写（1914年、原本は養源院蔵）"}
        tone: しみじみ
      - 聞き: あーし的には、秀吉は出世の天才っていうより、最後まで「頼む、頼む」って書いた心配性のお父さん、って覚えとく。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
      - 聞き: 次回は新選組。幕末の京都を見回った人たち、って聞くけど……どんな人たちだったの？
        tone: 疑問
      - 語り: あなたが最初に聞いた秀吉の話は、草履ですか、一夜城ですか。コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
