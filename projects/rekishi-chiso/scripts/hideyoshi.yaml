en:
  title: "Toyotomi Hideyoshi: 62 Years in Records and Legends | Nobunaga Called Him \"Bald Rat\""
  description: |-
    In a letter to Hideyoshi's wife Nene, Oda Nobunaga called Hideyoshi a "bald rat." No letter shows for certain that Nobunaga called him "monkey."
    We follow Hideyoshi's life from his birth in Nakamura, Owari (1537 is the leading theory) to his first appearance in a document at 29, the castle town of Nagahama, the march back from Takamatsu (about 230 km in about 10 days), the Kiyosu meeting, Shizugatake, Osaka Castle, becoming kampaku at 49, the sword hunt and the land surveys, the letter naming his baby son "Hiroi," and his death at Fushimi Castle in 1598.
    Along the way we separate records from later legends, such as warming Nobunaga's sandals and the one-night castle at Sunomata, many of which took shape in the Ehon Taikōki, published about 200 years after his death.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "Nobunaga's Letter and the \"Bald Rat\""
    - "1537-1565: From Nakamura in Owari to Kinoshita Tōkichirō"
    - "1573: Lord of Nagahama and the Chūgoku Campaign"
    - "1582: News of Honnō-ji, the March Back and Yamazaki"
    - "1582-1585: Kiyosu, Shizugatake and Osaka Castle"
    - "1585-1590: Kampaku, the Toyotomi Name, the Sword Hunt and Unification"
    - "1591-1597: Hidenaga and Rikyū Die, the Korean Campaigns, Hideyori Is Born"
    - "1598: Cherry Blossoms at Daigo and the End at Fushimi"
    - "Summary: Who Was Toyotomi Hideyoshi?"

