# 豊臣秀吉（10/13 19時公開）。型：掘り下げ型（見どころ → 生まれから順に → まとめ：豊臣秀吉とは何者だったのか）
# 事実の出どころは dev/output/rekishi-chiso/research/hideyoshi_facts.md（確実／有力／説の言い分けもそこ）。絵は research/hideyoshi_assets.md
#   （足りない場面は半兵衛・秀長・ねねの回の一覧の絵も使う：長浜町絵図・三木城包囲図・播磨国絵図・大政所像・聚楽第の部分・醍醐の花・夏の陣図の天守・豊国祭礼図）。
# 通説（草履・猿・一夜城・三法師を抱く場面）は主題にせず、各節で「記録」と「言い伝え」を分けて見せる。
# 前後の回と重ねない：父の諸説・大返しの秀長・四国攻め・郡山は秀長の回（10/12）、北ノ庄の最期はお市の回（同じ日の昼）、
#   ねねへの手紙の多く・高台院の晩年はねねの回（10/22）、本能寺・桶狭間は信長の回（10/9）。山崎の兵の数は明智の回にそろえる。
# お金は前の回と同じ「京都の大工の日当100文＝今の1万円」（1貫＝1000文≒10万円）。目安と言う。大きな石高は「何万人が1年食べる米」で。
# 年齢は数え（1537年生まれの説）で語り、「数えで」と断る。肖像の「この時○歳」（満）は出さない（age: false）。
# 広告の点：清水宗治・利休・秀次・朝鮮への出兵は facts の9章の言い換え。犠牲の数は出さない。首実検・切腹・処刑の絵は使わない。
# 辞世は文化庁の解説で第4句「なにわのことも」まで確かめたので、全句を秀吉の声で読む。「前もって用意していた」は二次の解説だけなので使わない。
# 遺言状の原文は確かめていないので、意味で言う（語り）。ひろいの手紙は大阪城天守閣の解説の現代語に沿って秀吉の声で読む。
# 弱めて言うもの：30貫文（出どころは『明智軍記』、黒田基樹は当時のしきたりに合うと見る）・美濃大返しの5時間（と言われています）・醍醐の約1300人（と伝わります）。
# 「猿帰候て」の黒印状（1578年3月15日ごろ）は秀吉か分かれる（髙山宗東）。七本槍は『甫庵太閤記』が初見、『柴田合戦記』（大村由己の作と伝わる）に9人。
title: 豊臣秀吉の62年｜信長の手紙では「はげねずみ」 記録と言い伝えを掘る
