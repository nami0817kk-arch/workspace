terms:
  小者: 武家で雑用をする、身分の低い奉公人
  右筆: 主君の手紙や記録を書く役目の家臣
  武功夜話: 1959年に愛知県で見つかった前野家の文書。偽書説が根強い
  検地: 田畑の広さと取れる米の量を測り、帳面に載せること
  猶子: 家を継がせない、形だけの養子
  刀狩令: 1588年、百姓が刀や鉄砲を持つことを禁じた秀吉の命令
  太閤: 関白を譲った人の呼び名。秀吉は1591年から
  唐入り: 朝鮮を通って明（中国）を従えようとした秀吉の構想
  惟任退治記: 秀吉の右筆・大村由己が1582年に書いた山崎の戦いの記録
  絵本太閤記: 1797年から出た秀吉の読み物。84冊。1804年に絶版

