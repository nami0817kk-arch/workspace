sections:
  # ================================================================ 導入（冒頭 約2分30秒）。答え（曹丕の終制の理由）は第2章まで言わない
  - title: 曹操の墓の上の御殿は、息子の詔で壊された　222年 高陵
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S01（夕暮れの黄土の野原に、柱の穴が並ぶ平らな地面。人物なし）
    year: 222
    lines:
      # 0〜10秒：知らない事実（御殿は息子の詔で壊された）
      # fact: sosou-05
      - 語り: 曹操の墓の上にあった御殿は、息子の命令で、《取り壊されて》いました。
        tone: 強調
        card: {head: "曹操の墓", body: 上の御殿は息子が壊した}
      # fact: sosou-05
      - 語り: 唐の時代に編まれた歴史書『晋書』は、理由を、こう書きます。亡き父の、倹約の志に、従うため。
      - 語り: 命じたのは、息子の曹丕。西暦222年。曹操が亡くなってから、2年後のことです。
        tone: 重い
        card: {head: "222年", body: 曹丕が御殿を壊す詔}
      # fact: sosou-03
      - 語り: その墓が見つかった、と発表されたのは、2009年。中国の河南省、安陽でした。
      # fact: sosou-15
      - 語り: 発掘は、およそ1年。盗まれたあとの墓から出た、銭は、たった3枚でした。
        card: {head: "出土した銭", body: たった3枚}
      # fact: sosou-16
      - 語り: 石の札には、副葬品の名と数が、刻まれていました。「黄豆二升」。大豆が、二升。
      # fact: sosou-04
      - 語り: 「魏武王」と刻まれた、圭の形の石の札は、8枚。そのうち1枚は、盗掘した者から、取り戻した品です。
      # fact: sosou-06
      - 語り: 墓の中の骨は、3体。男性は、60歳ほどと、鑑定されました。曹操が亡くなった年齢は、66歳です。
        portrait: {image: paintings/sosou_portrait_sancai_tuhui_1607.jpg, caption: "魏太祖（曹操）の像（『三才図会』1607年ごろ）"}
      # fact: sosou-01
      - 語り: 曹操は、遺令で、こう命じていました。『三国志』の武帝紀によれば、「斂むるに時服を以てし、金玉珍宝を蔵むること無かれ」。
        portrait: null
        card: {head: "曹操の遺令", body: 金玉珍宝を墓に入れるな}
      - 語り: ふだんの服で納め、金も、玉も、宝物も、入れるな、という意味です。
        tone: しみじみ
      # fact: sosou-15
      - 語り: ところが、墓からは、金の糸や、銀の環、玉やメノウの飾りも、出てきました。
      # fact: sosou-08
      - 語り: 2023年に開館した博物館について、新華社は、「天子の礼制を象徴する12件の陶鼎」が、展示された、と伝えています。
        card: {head: "2023年", body: 天子の礼を象徴する鼎が12件}
      - 語り: 簡素に葬れ、と命じた人の墓は、なぜ、隠されなければならなかったのか。そして、なぜ、息子は、御殿を壊したのか。
        tone: 疑問
        pause: 0.8
      - 語り: 実は曹操は、墓を隠す側に立ちながら、墓を掘ったと責められた人でもありました。話は、遺言から始まります。
        tone: 疑問
        pause: 0.6

  # ================================================================ 第1章 金も玉も入れるな（205〜220）
  - title: 「金玉珍宝を蔵むること無かれ」　曹操の遺令　220年 洛陽
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S03（夜の洛陽の城壁と灯。人物なし）
    year: 220
    lines:
      # fact: sosou-01
      - 語り: 建安25年、西暦220年の正月。曹操は、洛陽で亡くなります。『三国志』は、66歳、と書きます。
        card: {head: "220年", body: 洛陽で亡くなる　66歳}
      # fact: sosou-01
      - 語り: 3世紀の終わりに、陳寿が書いた『三国志』の武帝紀には、遺令が、載っています。短い言葉です。
      # fact: sosou-01
      - 語り: 天下は、まだ安定していないから、昔の礼には、従えない。葬儀が終われば、喪服は脱げ。兵を率いる者は、持ち場を離れるな。
      # fact: sosou-01
      - 語り: そして、最後に、「斂むるに時服を以てし、金玉珍宝を蔵むること無かれ」。
        tone: 重い
      # 【想像1】曹操。記録：ふだんの服で納め、金玉珍宝を蔵めるなと遺令した（武帝紀）。気持ちの言葉だけ
      - 人物: 「……飾りは、いらぬ」
        who: 曹操想像
        imagined: true
        tone: 重い
      # fact: sosou-01
      - 語り: 謚は、武王。2月の丁卯の日に、高陵に葬られました。
        tone: しみじみ
      # fact: sosou-10
      - 語り: この遺令には、前ぶれがあります。建安10年、205年。袁氏を破って、冀州を平らげた年に、曹操は、厚葬を禁じる令を出していました。
        card: {head: "205年", body: 厚葬を禁じる令}
      # fact: sosou-10
      - 語り: 5世紀の終わりに、沈約が書いた『宋書』の礼志は、このとき、碑を立てることも、禁じた、と書きます。理由は、天下が疲れ果てていたから、とあります。
      # fact: sosou-11
      - 語り: 218年6月には、自分の墓の場所まで、決めました。『三国志』によれば、西門豹の祠の、西の原。高い所を土台にして、「封せず、樹ゑず」。
        card: {head: "218年6月", body: 西門豹の祠の西に寿陵を定める}
      - 語り: 土を盛らず、木も植えるな。そういう意味です。
        tone: しみじみ
      - 語り: ところが、遺令には、もうひとつの姿があります。
        tone: 疑問
      # fact: sosou-02
      - 語り: 西暦298年。文人の陸機が、宮中の書庫で、曹操の遺令を目にします。曹操の死から、78年後です。陸機は、「弔魏武帝文」の序に、その遺令を引きました。『文選』に収められています。
        card: {head: "298年", body: 陸機が秘閣で遺令を読む}
      # fact: sosou-02
      - 語り: そこに引かれた遺令は、ずっと、家の中の言葉です。余った香は、夫人たちで、分けなさい。
      # fact: sosou-02
      - 語り: 屋敷の中で、することのない者は、靴の組紐の作り方を学んで、売りなさい。そう書かれています。
        tone: しみじみ
      # fact: sosou-02
      - 語り: 官職についたときに受けた、印の組紐も、すべて蔵に納めておくように、とあります。
      # fact: sosou-28
      - 語り: 陸機の引く遺令は、さらに続きます。側室や、歌い手の女性たちは、銅爵台に住まわせよ、と。銅雀台とも書く台です。
      # fact: sosou-28
      - 語り: 台の上の堂には、八尺の寝台と、薄い帳を置く。朝夕には、干し肉や干し飯を供える。毎月の1日と15日には、帳に向かって、歌と舞を。
      # fact: sosou-28
      - 語り: そして、こう言い残します。「おまえたちは、ときどき銅爵台に登って、わが西陵の墓の地を、望みなさい」。
        tone: しみじみ
      # 【想像2】曹操。記録：陸機が引く遺令に、香を分けよ・組紐を売れ・印の組紐は蔵へとある。家の者への気持ちの言葉だけ
      - 人物: 「……あとは、頼む」
        who: 曹操想像
        imagined: true
        tone: しみじみ
      # 食い違い①：遺令の姿（『三国志』武帝紀／陸機の序）
      # fact: sosou-01, sosou-02
      - 語り: 同じ遺令でも、『三国志』と陸機とでは、長さも、顔つきも、違います。
        figure: {type: stats, title: 曹操の遺令　2つの姿, items: [[『三国志』武帝紀　3世紀末, 公の言葉, 金玉を入れるな・兵は持ち場を離れるな], [陸機『弔魏武帝文』序　298年, 家の中の言葉, 香を分けよ・靴の組紐を売れ]], upto: 2}
      - 語り: 短い、公の言葉と、長い、家の中の言葉。どちらも、曹操の遺令として、残っているんです。
        tone: しみじみ
        figure: null
      # fact: sosou-29
      - 語り: 陸機は、この遺令を読んで、ため息をついた、と序に書いています。思いを外の物につなぎ、細かな心を、奥の部屋に残す。賢い人なら、これは、捨てるべきではないか、と。
      # fact: sosou-29
      - 語り: そして、問いかけます。亡くなった人は、求めなくてよい。残った人は、背かなくてよい。求めることと背くことは、どちらも、傷つけ合うではないか、と。
      # fact: sosou-29
      - 語り: 香は、そのあと、実際に分けられました。陸機は、そう書いています。
        tone: しみじみ
      - 語り: では、この遺令は、守られたのか。答えは、息子の代に、出ます。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 息子が壊した陵（222）
  - title: 曹丕は、なぜ父の陵の御殿を壊させたのか　222年 魏
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S06（丘の上の瓦屋根の祭りの御殿。人物なし）
    year: 222
    lines:
      - 語り: 曹操が亡くなった、その年の冬。息子の曹丕は、漢の献帝から位を譲られて、魏の皇帝になります。
      # fact: sosou-05
      - 語り: 『晋書』の礼志は、高陵の、その後を、こう書きます。魏武を高陵に葬ると、役人たちは、漢の例にならって、陵の上に、祭りの御殿を建てた。
        card: {head: "陵の上の祭殿", body: 役人が漢の例にならって建てる}
      # fact: sosou-05
      - 語り: ところが、黄初3年。曹丕は、詔を出します。「高陵の上の御殿は、すべて取り壊せ。車馬は、厩に返し、衣服は、蔵に収めよ。先帝の、倹約を尊ぶ志に、従うためだ」。
        tone: 強調
        card: {head: "黄初3年（222年）", body: 高陵の上の殿を皆壊せ}
      - 語り: 御殿を建てたのは、役人たち。それを壊させたのが、息子の曹丕、という筋です。
        tone: しみじみ
      # fact: sosou-12
      - 語り: 同じ年の10月、曹丕は、自分の墓について、「終制」という文を書きます。『三国志』の文帝紀に、載っています。
        card: {head: "222年10月", body: 曹丕が「終制」を書く}
      # fact: sosou-12
      - 語り: そこには、こうあります。「昔から今まで、滅びなかった国はなく、掘られなかった墓も、ない」。
        tone: 重い
      # fact: sosou-12
      - 語り: 「世が乱れて以来、漢の皇帝たちの墓は、掘られないものが、なかった。玉の箱や、金の糸を、焼いて取るほどで、骨まで、尽きた」。
        tone: 重い
      # fact: sosou-30
      - 語り: 終制は、昔の2人の皇帝を、引き合いに出します。漢の文帝の陵は、掘られなかった。副葬品を、求めなかったからだ、と。
      # fact: sosou-30
      - 語り: 後漢の光武帝の陵は、掘られた。土を盛り、木を植えて、目立つ墓にしたからだ、と曹丕は言います。
      # fact: sosou-30
      - 語り: そして、こう命じます。この詔に背いて、勝手に墓を作り変えるなら、わたしは、地下で屍を斬られる。斬られて、また斬られる。死んで、また死ぬ、と。
        tone: 重い
      # fact: sosou-12
      - 語り: だから自分の墓には、金銀銅鉄を入れず、器は瓦にする。そして、代が替わったあとも、場所を知られないようにしたい、と。
      - 語り: 曹丕の言葉では、墓に何も入れないのは、倹約のためだけではなく、掘られないための、備えでもありました。
        tone: しみじみ
      - 語り: それから、1800年近く。2016年の11月から、2017年の5月にかけて、高陵が、発掘されました。
      # fact: sosou-20
      - 語り: 河南省文物考古研究院の発掘で、墓の上から、千平方メートルを超える、地上建築の跡が見つかりました。
        card: {head: "2016〜17年の発掘", body: 地上建築の跡が千㎡超}
      # fact: sosou-21, sosou-05
      - 語り: 発掘を主導した周立剛さんは、紅星新聞の取材に、こう説明しています。瓦の破片は、ほとんど残っていない。柱の穴は楕円形で、柱を抜くときに、掘って、こじった跡だ、と。
      # fact: sosou-05
      - 語り: 恨みで壊したなら、破片が、大量に残るはず。これは、報復ではなく、計画的な解体だ、というのです。
        tone: 強調
      - 語り: 『晋書』の、壊せ、という詔と、土から出てきた、柱の穴。文献と発掘が、ここで、重なりました。
        tone: しみじみ
      # 食い違い②：御殿を壊した意味（周立剛／潘偉斌）
      # fact: sosou-20
      - 語り: ただし、その意味は、発掘した側でも、割れています。周さんは、建物があった以上、曹丕は、「封せず、樹ゑず」の遺言を、守らなかった、と見ます。
        figure: {type: stats, title: 壊された御殿の意味　発掘した側の2つの見方, items: [[周立剛さん, 遺言に背いた, 建物があった以上、遺言は守られていない], [潘偉斌さん, 遺言は墳丘と碑のこと, 壊したのは盗掘を防ぐため]], upto: 1}
      # fact: sosou-20
      - 語り: 一方、発掘隊長の潘偉斌さんは、「封せず、樹ゑず」は、墳丘と碑のことで、建物とは関係がない、と言います。曹丕が壊したのは、盗掘を防ぐためだ、と推しています。
        figure: {type: stats, title: 壊された御殿の意味　発掘した側の2つの見方, items: [[周立剛さん, 遺言に背いた, 建物があった以上、遺言は守られていない], [潘偉斌さん, 遺言は墳丘と碑のこと, 壊したのは盗掘を防ぐため]], upto: 2}
      - 語り: 同じ柱の穴を見て、遺言に背いた、とも、遺言のとおりだ、とも、読めるんです。
        tone: しみじみ
        figure: null
        hook: true
      - 語り: ところで、この曹操という人は、墓を、守る側だったのでしょうか。それとも。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 通説の検証（曹操は墓を掘った人か、隠した人か）
  - title: 曹操は墓を掘った人か、隠した人か　七十二疑塚の話
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S09（軍営の幕の中で、筆を執る文人の後ろ姿。人物は後ろ姿だけ）
    year: 200
    lines:
      - 語り: ここで、2つの通説を、確かめます。曹操は、墓を荒らした人だったのか。それとも、偽の墓をたくさん作って、本物を隠した人だったのか。
        tone: 疑問
      # fact: sosou-13
      - 語り: 前者の出どころは、曹操が、袁紹と争っていたころに書かれた、檄文です。書いたのは、袁紹の側の、陳琳。『文選』に収められています。
        card: {head: "陳琳の檄文", body: 袁紹の側が書いた、曹操を責める文}
      # fact: sosou-13
      - 語り: 檄文は、曹操を、こう責めます。梁の孝王の墓を、自ら兵を率いて発掘し、棺を破り、屍を裸にして、金や宝を奪った。
        tone: 強調
      # fact: sosou-13
      - 語り: さらに、「発丘中郎将」、「摸金校尉」という役職を、特別に置いた。通ったところは、骸骨が、むき出しにならないことは、なかった、とも。
      - 語り: ただしこれは、敵方が、曹操を責めるために書いた文書です。そのまま事実とは、言えません。
        tone: しみじみ
      # fact: sosou-14
      - 語り: ところが、2009年に曹操墓の発掘を説明した、河南省の張志清副所長は、梁の孝王の墓を、自ら発掘した人でした。中国新聞網は、曹操が兵を出して盗んだとされる墓、と書いています。
        card: {head: "張志清副所長", body: 梁王の墓の発掘を主導した人}
      - 語り: 梁王の墓を掘った考古学者が、曹操の墓の発掘を、説明する側に立った。そういう巡り合わせです。
        tone: しみじみ
      - 語り: もうひとつの通説は、「七十二疑塚」。曹操は、盗掘を恐れて、偽の墓を、72も作らせた、という話です。
      # fact: sosou-25
      - 語り: 記録をたどると、南宋の初めごろ、范成大の旅行記『攬轡録』に、「操の疑塚、七十二」と出てきます。
        card: {head: "南宋の『攬轡録』", body: 「操の疑塚、七十二」}
      # fact: sosou-25
      - 語り: 同じ頃、兪応符という人は、「七十二の塚を、掘り尽くせば、必ず、その一つに、君の屍がある」と、詠みました。
      - 語り: 同じ頃の空気を、北京青年報は、こう整理しています。曹操を悪者にする見方が、広まっていた、と。
      # fact: sosou-27
      - 語り: 曹操が、悪者にされたのは、いつからか。「治世の能臣、乱世の姦雄」という評は、『三国志』の本文には、ありません。5世紀に、裴松之が付けた注が、孫盛の『異同雑語』から引いたものです。
      # fact: sosou-31
      - 語り: 蘇軾の『東坡志林』にも、その空気が出てきます。町の子どもたちが、三国志の語りを聞いて、劉備が負けると、泣き、曹操が負けると、喜んだ、といいます。
      # fact: sosou-32
      - 語り: その後も、曹操の墓が掘られた話は、語られ続けます。清の王士禎の『居易録』は、明の正徳年間、飢饉の流民が、曹操の疑塚を13か所掘った、と書きます。
      # fact: sosou-32
      - 語り: ある墓では、土の寝台に、遺体が横たわり、青い頭巾に、黄色い衣で、まるで生きているようだった、と。ただし、著者自身も、曹操の疑塚かどうかは、確かめようがない、と認めています。
      # fact: sosou-33
      - 語り: 蒲松齢の『聊斎志異』にも、「曹操の塚」という話があります。北京青年報は、こうした話は、民間の伝説として扱うべきだ、と整理しています。
      # fact: sosou-11
      - 語り: 史書に残る、曹操の墓は、ひとつだけ。218年に、自分で決めた、西門豹の祠の、西の原です。
        tone: しみじみ
      - 語り: 墓を掘った、と書かれ、墓を隠した、と語られ、そして、自分の墓は、掘られた。曹操と墓の話は、いつも、盗むことと、隠すことの間にあります。
        tone: しみじみ
        hook: true
      - 語り: 話を、その墓が見つかるところへ、進めます。
        hook: true

  # ================================================================ 第4章 1800年後の発見（2008〜2009）
  - title: 3枚の銭と、「魏武王」の石の札　2009年 河南省安陽
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S11（黄土の台地の長い墓道と石の入口。人物なし）
    year: 2008
    lines:
      # fact: sosou-03
      - 語り: 墓は、河南省安陽市の、西高穴村にあります。2008年の12月中旬から、救済のための発掘が始まりました。中国新聞網が伝える、潘偉斌さんの説明です。
        card: {head: "2008年12月", body: 西高穴の大墓の救済発掘が始まる}
      # fact: sosou-03
      - 語り: 発掘は、2009年の12月下旬まで、およそ1年。12月27日、河南省文物局が、「魏武王曹操高陵が、見つかった」と、発表します。
        card: {head: "2009年12月27日", body: 河南省文物局が曹操高陵の発見を発表}
      - 語り: では、墓は、いつから、盗まれていたのか。ここでも、書き方が、そろいません。
        tone: 疑問
      # 食い違い③：盗掘が始まった年（潘偉斌の説明／中国新聞網の説明会の報道／北京青年報）
      # fact: sosou-23
      - 語り: 潘偉斌さんは、2006年から2008年に、何度も盗掘された、と説明しました。
        figure: {type: stats, title: 墓はいつから盗まれたか, items: [[潘偉斌さん　2010年, 2006〜2008年], [中国新聞網　2010年, 2004年の末以降], [北京青年報　2023年, 2005年の末]], upto: 1}
      # fact: sosou-23
      - 語り: ところが、発掘の説明会を伝えた、別の報道は、2004年の末から、と書き、2023年の北京青年報は、2005年の末には、もう盗まれていた、と書きます。
        figure: {type: stats, title: 墓はいつから盗まれたか, items: [[潘偉斌さん　2010年, 2006〜2008年], [中国新聞網　2010年, 2004年の末以降], [北京青年報　2023年, 2005年の末]], upto: 3}
      # fact: sosou-15
      - 語り: それでも、墓には、250点あまりの副葬品が、残っていました。盗まれたあとの墓の、銭は、わずか3枚。
        figure: null
        card: {head: "銭は3枚", body: 副葬品は250点あまり}
      # fact: sosou-15
      - 語り: 潘さんの説明では、ほかに、玉石の飾り、金の糸、銀の環、雲母の薄片が、出ています。
      # fact: sosou-04
      - 語り: 決め手に挙げられたのは、石の札です。「魏武王常所用挌虎大戟」。魏武王が、ふだん使った、虎と戦う、大きな戟、と刻まれています。
        tone: 強調
      # fact: sosou-04
      - 語り: 「魏武王」と刻まれた、圭の形の石牌は、8件。7件は、発掘で出て、1件は、盗掘した者から、取り戻したものです。
      # fact: sosou-04
      - 語り: 石の枕にも、「魏武王常所用慰項石」、首を慰める石、と刻まれていました。これは、警察が、取り戻した品です。
      # fact: sosou-34
      - 語り: 圭の形の石牌は、長さ10.8センチ、幅3.2センチ、厚さ0.6センチ。尖った先に穴があり、銅の鎖で、つなげてあった、と北京青年報は書きます。
      # fact: sosou-16
      - 語り: ほかの石牌には、副葬品の名と数が、刻まれています。「黄豆二升」。「刀尺一」。専門家は、副葬品の目録、遣冊の役目だと、説明しました。
        card: {head: "石牌の刻銘", body: 「黄豆二升」「刀尺一」}
      # fact: sosou-06
      - 語り: 骨は、3体。男性は、60歳ほど。女性は、50歳ほどと、20歳ほどと、鑑定されています。
      # fact: sosou-08
      - 語り: 2023年に開館した博物館は、400点あまりを展示しました。新華社は、その最初に、「天子の礼制を象徴する、12件の陶鼎」を、挙げています。
      # fact: sosou-20
      - 語り: 2018年の報道によれば、発掘隊長の潘さんは、この墓は、帝王の格で、葬られたものだ、と述べています。
      - 語り: 簡素に葬れ、と命じた人の墓は、金も玉も、わずかに、残っていた。そして、格は、帝王に並ぶ。遺言と、墓の姿は、簡単には、そろいません。
        tone: しみじみ
        hook: true
      - 語り: ところが、この墓は、本当に、曹操の墓なのか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 墓の主はほんとうに曹操か
  - title: この墓は、本当に曹操の墓なのか　発表後の異論と答え
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S13（何も刻まれていない石牌。人物なし）
    year: 2009
    lines:
      - 語り: 発表の決め手は、「魏武王」と刻まれた、石の札でした。しかし、疑問も、すぐに出ました。
      # fact: sosou-18
      - 語り: 中国人民大学の袁済喜さんは、発表の直後、重慶晩報に、こう語っています。公表された証拠は、第一手の材料では、ない。
        card: {head: "袁済喜さん（人民大学）", body: 証拠は第一手の材料ではない}
      # fact: sosou-18
      - 語り: 盗掘された墓なので、遺物は、あとから、置かれた可能性もある、と。
      # fact: sosou-19
      - 語り: 日本でも、渡邉義浩さんは、日本語版『曹操墓の真相』で、石牌の書きぶりに疑問を示し、半信半疑だった、とされています。大橋修一さんの2013年の論文の、英文抄録が、そう紹介しています。
      # fact: sosou-19
      - 語り: これに対して、大橋さんは、石牌の文字は、漢の隷書から魏の隷書へ移る、過渡期の書体で、曹操の時代として矛盾しない、と論じた、とされています。
      - 語り: もう一つの疑問は、墓誌が、ないことでした。
        tone: 疑問
      # fact: sosou-17
      - 語り: 河南省文物考古研究所の張志清さんは、こう説明しました。後漢では、墓の前に碑を立てた。墓の中に、文字を刻んだ石を入れるのは、珍しい。墓誌が、定着するのは、北魏のあとだ、と。
      # fact: sosou-10
      - 語り: しかも、曹操は、205年に、碑を立てることを、禁じています。墓誌が出ないほうが、むしろ、自然だ、という説明です。
      # fact: sosou-26
      - 語り: もう一つ、手がかりがあります。1998年、西高穴村で、後趙の魯潜という人の墓誌が、見つかりました。「魏武帝の陵の、西北の隅から、西へ43歩」。北京青年報は、そう書きます。
        card: {head: "1998年", body: 魯潜の墓誌に「魏武帝の陵」とある}
      # fact: sosou-22
      - 語り: 女性の骨にも、謎があります。『三国志』によれば、曹操の夫人、卞氏は、曹操と合葬されました。卞氏の没年は、70歳ほど。ところが、墓の女性は、50歳ほどと、20歳ほどです。
        tone: 疑問
      - 語り: 発掘した側は、男性の骨を、曹操と確認できる、としています。この墓を、曹操の墓と認めるのは、発掘した側と、多くの専門家の見方です。
      - 語り: 異論が出た、という事実も、記録に残っています。決着がついた、とは、言えないんです。
        tone: しみじみ
        hook: true
      - 語り: 最後に、最初の問いへ戻ります。なぜ、曹操は、金も玉も、入れるな、と命じたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：柱の穴が語ること　222年と2017年 高陵
    background: {image: paintings/sosou_xigaoxue_tomb2_front_2013.jpg, credit: "西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）"}
    # AI絵：S01（夕暮れの野原に並ぶ柱の穴。人物なし）
    year: 2017
    lines:
      # 答え
      - 語り: 記録には、答えが、2つあります。
      # fact: sosou-10
      - 語り: ひとつは、倹約。『宋書』は、天下が疲れ果てていたから、と書きます。
      # fact: sosou-12
      - 語り: もうひとつは、守るため。曹丕は、漢の陵が皆掘られた、と書き、代が替わっても、場所を知られないように、と書きました。
      - 語り: ただ、どちらの理由も、曹操本人の遺令の本文には、書かれていません。曹操の胸の内までは、記録から、分かりません。
        tone: 重い
      # fact: sosou-05
      - 語り: 確かなのは、息子が壊させた、御殿の柱の穴が、1800年近く経って、土の中から、出てきたことです。
        tone: しみじみ
      # fact: sosou-25
      - 語り: 北京青年報は、歴史上、曹操の墓は、ひとつだけで、疑塚は、なかった、と書きます。墓は、218年に、自分で選んだ、あの原にありました。
      - 語り: 掘られないように、隠そうとした墓は、結局、掘られました。墓の中に、残っていたのは、わずかな金や玉石の飾りと、3枚の銭でした。
        tone: しみじみ
        portrait: {image: paintings/sosou_portrait_sancai_tuhui_1607.jpg, caption: "魏太祖（曹操）の像（『三才図会』1607年ごろ）"}
      # 結び：なぜの答え
      - 語り: 「金玉珍宝を、蔵むること無かれ」。そう命じた人の墓の上には、息子が壊させた、御殿の柱の穴が、並んでいました。
        tone: しみじみ
        pause: 0.8
        portrait: null

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
