# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と takasugi-story.yaml・hideaki-story.yaml の型）。曹操。2026-10-29 下書き。
# 公開の予定は 11/01 19:00（世界史枠）。
# 型：1本に1つの「なぜ」＝「なぜ、金も玉も入れるなと命じた曹操の墓の上の御殿は、息子の詔で壊されたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝曹操の墓の上にあった御殿は、息子の曹丕の詔で取り壊された（『晋書』礼志。2016〜17年の発掘で柱穴が出て、計画的な解体と判断された）。
#   導入では答え（曹丕の終制の「漢の陵は皆掘られた」・倹約）を言わず、第2章と最後の章で出す。
#   第1章 金も玉も入れるな（205年の禁厚葬・禁碑／218年の寿陵の令／220年の遺令／陸機が298年に読んだ長い遺令＝記録の食い違い①：公の遺令と家の中の遺令）／
#   第2章 息子が壊した陵（黄初3年の詔／曹丕の終制／2016〜17年の発掘／記録の食い違い②：周立剛と潘偉斌の解釈）／
#   第3章 通説の検証「曹操は墓を掘った人か、隠した人か」（陳琳の檄文・梁王の墓・張志清副所長・七十二疑塚）／
#   第4章 1800年後の発見（2008〜09年の発掘・記録の食い違い③：盗掘が始まった年・銭3枚・石牌・慰項石・黄豆二升・遺骨・陶鼎）／
#   第5章 墓の主はほんとうに曹操か（異論：袁済喜・渡邉義浩／反論：墓誌・大橋修一・魯潜の墓誌・卞氏の謎）／
#   第6章 まとめ（2つの答え → 冒頭に戻る：柱の穴）。締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを並べたのは3か所：①遺令の姿（『三国志』武帝紀の短い公の遺令／陸機『弔魏武帝文』の序が引く長い遺令）
#   ②曹丕が御殿を壊した意味（周立剛：遺言に背いた／潘偉斌：不封不樹は墳丘と碑のこと、壊したのは盗掘を防ぐため）
#   ③盗掘が始まった年（潘偉斌の説明 2006〜2008／中国新聞網の説明会の報道 2004年末／北京青年報 2023年 2005年末）。
#   ほかに語りだけで：石牌の数（59／62）は入れず、袁済喜・渡邉義浩の異論と墓誌の有無の説明を「異論」の章に置いた。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/曹操_facts_20261029.yaml、sosou-01〜）にあるものだけ。行の上に `# fact: sosou-NN`。
#   カードに無い「誰でも知っている前置き」（曹操が魏の基礎を築いた・曹丕が献帝から位を譲られ魏の皇帝になった）は短く使い、# fact を付けない。
#   中国語の原文は日本語に訳して引く。原典名・成立の時代・誰が書いたかを言う（『三国志』＝3世紀末に陳寿、『宋書』＝5世紀末に沈約、『晋書』＝7世紀に唐で編まれた、『文選』＝6世紀の詞華集）。
#   発掘の数字・説明は中国新聞網・紅星新聞＝澎湃新聞（人民政協網転載）・北京青年報（中国作家網）・新華社の報道。発掘報告書『曹操高陵』（2016）は開いていない。報道の中で誰が述べたかを必ず言う。
#   墓の主の認定には異論がある。発掘した側の見方と異論の両方を第5章に並べ、「決着した」とは言わない。
#   遺伝子（復旦大学の研究）はカードが書誌だけ（論文本体は開けず）なので台本に入れない。向井佑介・森下章司の研究（石牌銘校注・2023）も書誌だけなので入れない。
#   最期の場面は描かない。曹操が亡くなる所は「洛陽で亡くなった」まで。AI 絵の人物は手もと・後ろ姿・遠景。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（遺令・令・詔・終制・檄文。声は作らない）。
#   想像の台詞は2か所（曹操想像。config の roles に足した）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の sosou_portrait_sancai_tuhui_1607（『三才図会』の魏太祖像）・sosou_portrait_romance_qing（清の『三国志演義』の挿絵）・
#   sosou_xigaoxue_tomb2_front_2013（西高穴2号墓の墓道。CC BY-SA 3.0）＋ AI 絵（S01〜S15、一覧は dev/output/rekishi-chiso/research/sosou_ai_images.md）。
#   AI 絵に曹操の顔は描かない。実在の俳優・ドラマ・ゲームの曹操に似せない。戦闘・遺体・骨は描かない。
