# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  三国志の英雄、曹操。その墓の上にあった御殿は、息子の曹丕の詔で、取り壊されていました。唐の時代に編まれた『晋書』は、そう書きます。
  2016年から2017年の発掘では、地上建築の柱の穴が出て、発掘にあたった研究者は、計画的な解体だったと判断しました。
  「金も玉も入れるな」と遺言した曹操の墓は、なぜ、跡形もなく隠されなければならなかったのか。
  この動画でわかること
  ・『三国志』と、陸機が読んだもう一つの遺令――同じ遺言の2つの姿
  ・曹丕が「漢の陵は皆掘られた」と書いた終制と、御殿を壊した詔
  ・曹操は墓を掘った人だったのか、七十二疑塚の話はいつ現れたのか
  ・2009年に発表された墓から出た、3枚の銭と「魏武王」の石牌
  ・墓の主は本当に曹操なのか――認定した側と、異論を述べた側の言い分
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（『三国志』、『晋書』、『宋書』、陸機「弔魏武帝文」、陳琳の檄文、中国新聞網・紅星新聞（澎湃新聞転載）・北京青年報・新華社の報道など）を語りで示してから読んでいます。
  発掘の説明は、中国の報道で伝えられた研究者の発言によります。墓を曹操の墓とする認定には、異論もあります。
  肖像は『三才図会』（1607年ごろ）の魏太祖像（ウィキメディア・コモンズ、パブリックドメイン）です。

en:
  title: "Cao Cao: Why His Son Pulled Down the Hall Above His Tomb, After He Ordered No Gold or Jade"
  description: |-
    The tomb of Cao Cao, the warlord who laid the foundation of the state of Wei, once had a ceremonial hall standing above it. The Book of Jin says that his son Cao Pi ordered it torn down in 222.
    Excavations in 2016-17 found the post holes of the hall, and the excavation leader judged that it had been dismantled on purpose.
    Cao Cao had ordered that no gold, jade or treasure be buried with him. Why did his tomb have to be hidden?
    In this video you will learn:
    - Two versions of the same will: the short one in the Records of the Three Kingdoms and the longer one Lu Ji read
    - Cao Pi's "final regulation": "there is no tomb that is never dug up"
    - Was Cao Cao a tomb robber? Where did the "72 decoy tombs" story come from?
    - The tomb announced in 2009: three coins, and stone tablets reading "King Wu of Wei"
    - Is it really Cao Cao's tomb? The case for it, and the doubts
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Was the Hall Above Cao Cao's Tomb Pulled Down? Anyang, 222"
    - "No Gold, No Jade: What Did Cao Cao Order? Luoyang, 220"
    - "Cao Pi's Edict: The Hall Above the Tomb Is Dismantled, 222"
    - "Tomb Robber or Tomb Hider? The Story of the 72 Decoy Tombs"
    - "The Tomb Found After 1,800 Years: Xigaoxue, Anyang, 2009"
    - "Is It Really Cao Cao's Tomb? The Doubts and the Replies"
    - "Summary: The Post Holes Left in the Earth"

