# 竹中半兵衛（10/15 19時公開予定）。型：掘り下げ型（生まれから順に・節ごとに1つの山場・最後は「まとめ：竹中半兵衛とは何者だったのか」）
# 冒頭の一点：「死んだのは三木城の開城の前年」（日付の差だけで言える確実な並び）。「16人」と「6人」は別の数、を稲葉山城の節で出す。
# 事実の出どころは dev/output/rekishi-chiso/research/hanbei_facts.md（確実／有力／説／未確認の区分もそこ）。素材は research/hanbei_assets.md。
# 決まり：①日付は当時の暦（和暦）の月日で言う。西暦は6月13日→7月6日（ユリウス暦）のみ最初に断る。稲葉山城事件の2月6日は西暦を言わない。
#   ②「16人」は軍記の数、「6人」は討たれた側の数。「7人」は使わない。③三顧の礼・軍配・遺言・長持の武器・美濃半国の話は事実として言わない（後世の話・未確認）。
#   ④人物のセリフは入れない（記録に残る本人の言葉が無い）。⑤返還の時期は「10月には龍興が城に戻っている」だけを事実として言う。
#   ⑥年齢は数え（1544年生まれで数える）。肖像の「この時○歳」は出さない（満と数えが混ざるため）。
