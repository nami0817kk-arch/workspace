sections:
  # ---------------------------------------------------------------- 1 導入
  - title: 1579年6月13日 三木城を囲む陣と「天才軍師」の像
    background: {image: paintings/hanbei_miki_siege_map.jpg, credit: "《羽柴秀吉三木城包囲図》（江戸時代）"}
    portrait: {image: paintings/hanbei_portrait_full.jpg, caption: "竹中半兵衛（竹中家旧蔵の肖像画）", age: false}
    year: 1579
    lines:
      - 語り: 天正7年6月13日。豊臣秀吉に仕えた「天才軍師」竹中半兵衛は、播磨の三木城を囲む陣のなかで、数えで36歳で亡くなりました。三木城が開城するのは、その翌年の1月です。
        card: {head: 天正7年6月13日, body: 半兵衛、陣中で病死}
        short: s1
      - 聞き: え、城が落ちるのを見ずに？ 軍師って、勝つところまで見届けるものだと思ってた。
        tone: 驚き
        short: s1
      - 語り: 後の本は、半兵衛を「天才軍師」と呼びます。ところが、同じ時代の史料に残る半兵衛は、驚くほど少ないのです。
        short: s1
      - 聞き: 少ない？ あんなに有名なのに？
        background: {image: paintings/hanbei_hiraiyama.jpg, credit: "《平井山》諸国古城之図（江戸時代）"}
        tone: 疑問
        short: s1
      - 語り: 有名な話の多くは、息子が書いた本と、江戸時代の軍記や小説が作りました。今日は、記録で言える半兵衛と、物語で語られてきた半兵衛を、分けて掘ります。
        short: s1
      - 聞き: 稲葉山城を昼に乗っ取った、って話は、聞いたことある。それも、記録と物語を分けると変わるの？
      - 語り: 日付は、当時の暦の月日で言います。この6月13日は、ユリウス暦で、7月6日にあたります。では、半兵衛が生まれた、美濃から掘りましょう。

  # ---------------------------------------------------------------- 2 生まれ
  - title: 1544年 美濃の小さな山城で
    background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
    year: 1544
    lines:
      - 語り: 半兵衛は、天文13年、西暦1544年に、美濃で生まれたとされます。父は竹中重元。不破郡を地盤にした、小さな国衆の家でした。
        card: {head: 1544年, body: 美濃の国衆の長男に生まれる}
      - 聞き: 国衆って、大名の下にいる、地元の小さなボスみたいな感じ？
        tone: 疑問
      - 語り: そのとおりです。当時の美濃は、斎藤道三から息子の義龍、孫の龍興へと、主が移っていく国でした。竹中家は、その斎藤家に仕えていました。
        portrait: {image: paintings/hanbei_dosan_portrait.jpg, caption: "斎藤道三（常在寺蔵とされる肖像画）", age: false}
      - 語り: 道三は、「美濃のマムシ」と呼ばれた人物です。そして、弘治2年の長良川の戦いで、息子の義龍に討たれます。
      - 聞き: マムシの道三が、息子に討たれるなんて。美濃って、親子でもめる国だったんだ。
      - 語り: 半兵衛の居城は、父が築いた、と伝わる菩提山城。標高400メートルあまりの山の上です。2024年の発掘では、碁石や茶器の破片が出ました。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
        portrait: null
      - 聞き: 山の上の城から、碁石と茶器。戦うだけの家じゃなくて、教養のある家だったんだね。
      - 語り: 若いころの話で有名なのが、13歳の逸話です。弘治2年、長良川の戦いで道三が討たれたとき、半兵衛が母と弟と城を守り、義龍の軍を退けた、と竹中家の家譜は伝えます。
        background: {image: paintings/hanbei_tatsuoki_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 斎藤竜興》1867年（後世の想像図）"}
      - 聞き: 13歳で城を守った！ すごい天才少年だ。
        tone: 驚き
      - 語り: ただ、この話は、竹中家の家譜が伝える話で、実際にあったかは分かりません。ライターの川合章子さんは、竹中家の誇りだったのだろう、と書いています。
      - 聞き: 家の自慢話か。名家の家譜って、ちょっと盛りがちだよね。
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
      - 語り: 体が弱く、女性のような顔つきだった、という描写も、江戸時代の本に出てくるものです。確かなのは、斎藤家に仕える小さな城主の長男だった、ということです。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
      - 語り: そして、数えで21歳のとき、半兵衛は、美濃を揺るがす事件を起こします。
        hook: true
      - 聞き: 21歳で事件？ 何をしたの？
        hook: true

  # ---------------------------------------------------------------- 3 乗っ取り
  - title: 1564年 稲葉山城 白昼の乗っ取り
    background: {image: paintings/hanbei_gifu_castle_zu.jpg, credit: "《岐阜城図》（江戸時代）"}
    portrait: {image: paintings/hanbei_tatsuoki_yoshiiku.jpg, caption: "斎藤龍興（後世の想像図）", age: false}
    year: 1564
    lines:
      - 語り: 永禄7年、西暦1564年。当時の暦で2月6日の昼、半兵衛は、舅の安藤守就とともに、稲葉山城を乗っ取りました。のちの岐阜城です。
        card: {head: 1564年2月, body: 稲葉山城の乗っ取り}
        short: s2
      - 聞き: 昼間に、主君の城を！？
        tone: 驚き
        short: s2
      - 語り: 舅の安藤守就は、西美濃三人衆の一人で、斎藤家を支えた重臣です。古文書には、この事件を「竹中半兵衛と安藤守就が奪い取った」とあります。
      - 聞き: 主役は半兵衛だけじゃなくて、安藤とセットなんだ。義理の父と組んだ、ってことだね。
      - 語り: 主君の斎藤龍興は、城を出ました。乗っ取った側の人数として有名なのが、《16人》です。
        figure: {type: stats, title: 稲葉山城事件の「人数」, items: [[16人, 軍記, 半兵衛が率いた、という数], [6人, 有力, 討たれた側の数]], upto: 1}
        short: s2
      - 聞き: 16人！ 少人数で城を落とした、って話だよね。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
        short: s2
      - 語り: その《16人》は、江戸時代の軍記『甫庵信長記』にある数字で、書き方が揺れています。同じ時代の史料の人数は、確かめられていません。
        figure: {type: stats, title: 稲葉山城事件の「人数」, items: [[16人, 軍記, 半兵衛が率いた、という数], [6人, 有力, 討たれた側の数]], upto: 1}
        short: s2
      - 語り: 討たれたのは、斎藤飛騨守ら《6人》です。こちらは、討たれた側の人数で、別の数です。
        figure: {type: stats, title: 稲葉山城事件の「人数」, items: [[16人, 軍記, 半兵衛が率いた、という数], [6人, 有力, 討たれた側の数]], upto: 2}
        short: s2
      - 聞き: じゃあ、6と16を、混ぜちゃだめなんだ。
        background: {image: paintings/hanbei_gifu_castle_zu.jpg, credit: "《岐阜城図》（江戸時代）"}
        short: s2
      - 語り: では、なぜ乗っ取ったのか。昔からの説は、酒色にふける龍興を諫めるため、です。これも、『甫庵信長記』の筋です。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
        figure: null
        card: {head: 従来の説, body: 龍興を諫めるため（軍記の筋）}
      - 聞き: 主君をいさめる、忠義の人。すごくきれいな話だよね。
      - 語り: 近年は、斎藤家の家中の争いだった、という見方が有力です。歴史学者の呉座勇一さんは、織田と武田との関係をめぐる派閥争い、つまりクーデターだと見ています。
      - 聞き: クーデター！ 急に生々しくなった。
        background: {image: paintings/hanbei_tatsuoki_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 斎藤竜興》1867年（後世の想像図）"}
        tone: 驚き
      - 語り: もう一つ、占拠の長さがあります。『敬念寺文書』から、7月29日ごろまで占拠が続いていたことが分かります。半年近くです。
        card: {head: 1564年7月29日ごろ, body: このころまで占拠が続く}
      - 聞き: 一日二日の騒ぎじゃなかったんだ。城を半年も持ってたなんて、本気だったってこと？
        tone: 疑問
      - 語り: 本気だったかどうかは、分かりません。この占拠のあと、半兵衛は城をどうしたのか。ここも、説が割れています。
        hook: true
      - 聞き: 城を返した、って聞いたことがある。それとは違う話があるの？
        hook: true

  # ---------------------------------------------------------------- 4 返したのか
  - title: 1564年 城を返したのか 追い出されたのか
    background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
    year: 1564
    lines:
      - 語り: 通説では、半兵衛は龍興を諫めたあと、自分から城を返して、隠れ住んだことになっています。きれいな話です。
      - 聞き: それが、ちがうの？
        tone: 疑問
      - 語り: 確かなのは、この年の10月の書状で、龍興が稲葉山城に戻っていることです。いつ、どう返したのかは、説が割れています。
        card: {head: 1564年10月, body: 龍興は稲葉山城に戻っている}
      - 語り: 1つ目は、半兵衛が諫めて、自分から返した、という通説。2つ目は、龍興を支える勢力の攻撃で、城を捨てた、という説です。
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
      - 聞き: 返したのと、追い出されたのとでは、半兵衛のイメージが、だいぶ違うよね。「自分で返した」のほうが、かっこいい。
      - 語り: 3つ目は、安藤の息子がのちに斎藤家の重臣になっていることから、周りは「私的な野心」とは見なかったのでは、という推測です。確かな史料はありません。
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
      - 聞き: 説が3つ。決め手は、ないんだね。あーし的には、「追い出された」説がいちばん現実的に聞こえるけど。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山を登る秀吉 1885年ごろ（後世の想像図）"}
      - 語り: そして、この数年の半兵衛が何をしていたのかは、史料からは、ほとんど分かりません。
      - 語り: このあとの半兵衛については、信長の誘いを断った話、栗原山に隠れ住んだ話、浅井長政に仕えた話が語られます。どれも後の本の話で、時期も確かではありません。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
      - 聞き: 空白の期間、ってことか。かっこいい話ばっかり出てくるのは、そのぶん作られた感じもするね。
      - 語り: 1567年、稲葉山城は信長の手に落ちました。西美濃三人衆が信長に内応したためです。三人衆の一人は、半兵衛の舅の、安藤守就でした。龍興は長島へ逃れます。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山を登る秀吉 1885年ごろ（後世の想像図）"}
        card: {head: 1567年, body: 稲葉山城が落ちる}
      - 聞き: え、同じ安藤？ 自分たちが占拠した城を、3年後に信長に渡す側にいたの？
      - 語り: 信長は、落とした稲葉山城を岐阜城と改め、ここを拠点に、天下を目指します。
      - 聞き: 半兵衛が奪った城が、信長の天下取りの拠点になるんだ。
        background: {image: paintings/hanbei_gifu_atsumi_map.jpg, credit: "《濃州厚見郡岐阜図》（江戸時代）"}
      - 語り: 半兵衛が信長に仕えたのは、この前後とされますが、時期は割れています。信長に付いた半兵衛は、やがて、秀吉の下に配されます。その経緯に、有名な「三顧の礼」の話があります。
        hook: true
      - 聞き: 秀吉が三度も頭を下げて迎えた、あの話だよね。
        hook: true

  # ---------------------------------------------------------------- 5 与力
  - title: 1570年 秀吉の与力になる 三顧の礼は本当か
    background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》（江戸時代）"}
    portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵、1601年ごろ）", age: false}
    year: 1570
    lines:
      - 語り: 『豊鑑』によると、元亀元年、1570年の夏。浅井攻めのなかで、秀吉は信長に、竹中ら美濃の国衆を与力に加えたい、と願い出て、許されました。
        card: {head: 1570年夏, body: 秀吉の与力に（『豊鑑』の記述）}
      - 聞き: 与力って、家臣とは違うの？
        tone: 疑問
      - 語り: 与力は、主君は信長のまま、一時的に秀吉の指揮下に入る人です。つまり半兵衛は、秀吉の家臣ではなかった、と見られています。
        figure: {type: people, title: 半兵衛の立場, nodes: [[織田信長, 主君], [羽柴秀吉, 指揮する], [竹中半兵衛, 与力]], edges: [[織田信長, 竹中半兵衛, 主従], [羽柴秀吉, 竹中半兵衛, 指揮]]}
      - 聞き: え、秀吉の家来じゃなかったんだ。会社で言ったら、出向してきた社員みたいな立場かな。「秀吉の軍師」って言い方は、ちょっとちがうんだね。
        tone: 驚き
        figure: null
      - 語り: 『豊鑑』を書いたのは、半兵衛の息子の重門です。『松平記』の天正元年、1573年ごろの記述にも、秀吉の与力8人の一人として、竹中半兵衛の名が見えます。
        background: {image: paintings/hanbei_tokichiro_matsushita.jpg, credit: "歌川豊宣《新撰太閤記》木下藤吉郎と松下嘉兵衛 1884年（後世の想像図）"}
      - 聞き: 息子の本が、与力の根拠にもなってるんだ。物語のもとでもあるのに、ちょっと不思議。
      - 語り: さて、《三顧の礼》です。秀吉が三度、半兵衛の庵を訪ねて口説いた、という話。これは、中国の『三国志演義』の型です。劉備が諸葛亮を、三度訪ねて迎えた話ですね。
        background: {image: paintings/hanbei_sanko_yoshitoshi.jpg, credit: "月岡芳年《玄徳三顧孔明》（明治期。三国志の場面）"}
        card: {head: 三顧の礼, body: 劉備と諸葛亮の話の型}
        short: s3
      - 聞き: 劉備と諸葛亮が、秀吉と半兵衛に置き換わったんだ。三国志の名場面を、日本の話にした、ってこと？
        short: s3
      - 語り: そう見る研究者がいます。呉座勇一さんは、幕末の『真書太閤記』で、三度の訪問がはっきりした、と整理しています。隠者の像は、その前の『絵本太閤記』からあります。
        short: s3
      - 聞き: 「欲のない賢者」っていうイメージは、江戸から少しずつ、作られていったんだね。
        short: s3
      - 語り: 呉座さんは、半兵衛の実像を、国衆と見ます。美濃と近江の国境に人脈を持ち、案内役と、調略の取次役だった、という見方です。秀吉に策を授けた、同じ時代の史料は、見当たらないそうです。
        background: {image: paintings/hanbei_hachisuka_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 八須賀与六正勝》1867年（後世の想像図）"}
      - 聞き: 軍師っていうより、地元に顔が利く案内役か。それはそれで、戦では頼りになる人だよね。
      - 語り: 後の『名将言行録』は、半兵衛を「神のようだ」と称えます。ただ、これも後世の本です。
      - 語り: 「軍師」という言葉そのものも、戦国時代にはあまり使われず、元禄のころ、『通俗三国志』で広まった、と言われます。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》（江戸時代）"}
      - 聞き: 軍師って呼び方も、三国志ブームの産物なんだ。あとから貼られたラベルなのかも。
      - 語り: では、実際の半兵衛の最後の10年は、どんな仕事だったのか。舞台は、播磨です。
        hook: true
      - 聞き: 播磨って、何があったの？ あんまり、イメージがないかも。
        hook: true

  # ---------------------------------------------------------------- 6 播磨と三木
  - title: 1577年 播磨と三木城 両兵衛と松寿丸
    background: {image: paintings/hanbei_harima_map.jpg, credit: "《播磨国の古地図》（江戸時代、フランス国立図書館蔵）"}
    portrait: {image: paintings/hanbei_kanbei_josui_portrait.jpg, caption: "黒田如水（官兵衛）の肖像（江戸初期）", age: false}
    year: 1577
    lines:
      - 語り: 天正5年、1577年。信長は秀吉に、毛利氏を攻める命令を出します。中国攻めです。
      - 聞き: 毛利っていう、中国地方の大きなライバルが相手なんだ。
      - 語り: 秀吉は播磨に入り、半兵衛は、黒田孝高、通称官兵衛と、福原城を攻めます。『信長公記』による記録とされます。
        card: {head: 1577年11月, body: 福原城攻め 官兵衛と共に}
      - 語り: 二人は、《両兵衛》と並べて呼ばれます。ただ、同じ時代にそう呼ばれたのか、後の呼び名なのかは、確かめられていません。
      - 聞き: 両兵衛って、当時からそう呼ばれてたんだと思ってた。
      - 語り: 翌年の2月、三木城の別所長治が、織田方から離れて、城に籠もります。秀吉は平井山に本陣を置き、付城を並べて城を囲みました。三木合戦です。
        background: {image: paintings/hanbei_miki_siege_map.jpg, credit: "《羽柴秀吉三木城包囲図》（江戸時代）"}
        card: {head: 1578年2月, body: 別所長治が三木城に籠城}
      - 聞き: 山に本陣を作って、周りに砦を並べて、ぐるっと囲んだんだね。
      - 語り: 食べ物の道を断つこの戦いは、「三木の干殺し」と呼ばれます。籠城は、1年10か月から2年ほど続きました。
        background: {image: paintings/hanbei_miki_castle_map.jpg, credit: "《播磨三木城》諸国古城之図（江戸時代）"}
      - 聞き: 1年10か月も！ 城の中は、食べ物がもたなかったよね。
        tone: 驚き
      - 語り: ここで、半兵衛の「手柄」を一つ見ます。天正6年5月、半兵衛は備前の八幡山城を調略で落とし、京で信長から銀100両を受けた、と『信長公記』を根拠に書かれます。
      - 聞き: 戦わずに城を落とす調略。軍師らしいお仕事だ。
      - 語り: そこへ、織田方だった荒木村重の謀反が重なります。天正6年10月。説得に行った官兵衛は、有岡城に捕らえられました。
        background: {image: paintings/hanbei_araki_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 荒木摂津守村重》1867年（後世の想像図）"}
      - 聞き: 官兵衛、そのあとどうなるの？
      - 語り: 説得に行った官兵衛が戻らず、信長は裏切りを疑いました。そして、人質の松寿丸、のちの黒田長政の殺害を命じた、と『黒田家譜』は伝えます。
        short: s4
      - 語り: 半兵衛が偽の首を出させて助けた、とも。ただ、江戸時代に編まれた書物の話です。
        background: {image: paintings/hanbei_nagamasa_kuroda2.jpg, credit: "《黒田長政像》（1911年の模写）"}
        short: s4
      - 聞き: 偽の首で命を救ったなんて、映画みたいな話。でも、これも「後の本」なんだ。
        short: s4
      - 語り: ただ、確かな史料も残っています。天正6年11月の秀吉の書状は、半兵衛が信長に黒田家の忠節を伝え、信長が喜んだ、と記します。
        background: {image: paintings/hanbei_itami_map.jpg, credit: "《文禄伊丹之図》（江戸時代）"}
        card: {head: 1578年11月, body: 秀吉の書状に半兵衛の取りなし}
        short: s4
      - 聞き: 偽の首の話は作りでも、半兵衛が黒田家の忠節を信長に伝えたのは、本当だったんだ。
        short: s4
      - 語り: さらに、天正7年4月9日付の、半兵衛自身の書状です。『竹中家文書』に残るこの書状に、松寿丸のことで涙を流した、とあります。ここは、記録で言える半兵衛の人柄です。
        card: {head: 1579年4月9日, body: 半兵衛の書状に「松寿丸に涙」}
      - 聞き: ……偽の首の話より、手紙の涙のほうが、ずっと本当っぽいね。
        background: {image: paintings/hanbei_harima_map.jpg, credit: "《播磨国の古地図》（江戸時代、フランス国立図書館蔵）"}
        tone: しみじみ
      - 語り: そのころ半兵衛は、すでに病に倒れていました。そして、この書状のおよそ2か月後に、世を去ります。
        hook: true
      - 聞き: 陣中で、病死……だったよね。
        hook: true

  # ---------------------------------------------------------------- 7 陣中の死
  - title: 1579年6月13日 陣中の死と二つの墓
    background: {image: paintings/hanbei_hiraiyama.jpg, credit: "《平井山》諸国古城之図（江戸時代）"}
    year: 1579
    lines:
      - 語り: 天正7年4月ごろ、半兵衛は病に倒れます。そして6月13日、播磨の陣中で亡くなりました。数えで36歳。西暦では7月6日です。
        card: {head: 1579年6月13日, body: 播磨の陣中で病死（数え36）}
      - 聞き: 病気は、何だったの？ 結核って、聞いたことがある。
        tone: 疑問
      - 語り: 病名を記した同じ時代の史料は、見つかっていません。結核は、後の人の推定です。医学史の早川智さんも、後に国民病と呼ばれた感染症の可能性が高い、と言うにとどめています。
      - 聞き: 結核っていう病名も、はっきりしないんだ。
        background: {image: paintings/hanbei_bessho_nagaharu.jpg, credit: "《別所長治像》（部分、年不詳）"}
      - 語り: 半兵衛の最期には、こんな話もあります。秀吉が京での療養を勧めたが、半兵衛は、陣中で死ぬのが武士の本望だと断った、という話です。これは竹中家の家譜の話で、後の世のものです。
        short: s5
      - 聞き: 軍師の最期らしい名場面だけど、それも家の記録なんだ。
        short: s5
      - 語り: 主な墓所は二つあります。一つは三木市の平井山の麓、もう一つは、息子の重門が移したという、岐阜県垂井町の禅幢寺です。
        short: s5
      - 語り: ほかにも、墓があると言われる寺があります。
        card: {head: 主な墓は2か所, body: 三木の平井山と垂井の禅幢寺}
        short: s5
      - 聞き: 三木と、故郷と、二つのお墓なんだ。お墓が二つあるのは、それだけ大事にされた、ってことなのかな。
        background: {image: paintings/hanbei_hiraiyama.jpg, credit: "《平井山》諸国古城之図（江戸時代）"}
        short: s5
      - 語り: 半兵衛が亡くなったとき、息子の重門は、6歳か7歳でした。従弟の竹中重利が、後見を務めたとされます。
      - 聞き: 他人の子のために涙を流した人が、自分の子を、6、7歳で残して逝ったんだ……。
      - 語り: そして、半兵衛が亡くなった翌年、天正8年1月17日。三木城が開城します。別所長治は自害し、籠城は終わりました。
        background: {image: paintings/hanbei_bessho_nagaharu.jpg, credit: "《別所長治像》（部分、年不詳）"}
        figure: {type: numberline, title: 半兵衛の死と三木城の開城, items: [[半兵衛の死, 1579], [三木城の開城, 1580]], unit: 年, focus: 三木城の開城, note: 同じ戦いの結末は、翌年に来た}
      - 聞き: 半兵衛は、三木城が落ちるのを、見られなかったんだ。最初に言ってた意味が、やっと分かった。
        figure: null
      - 語り: 開城の条件は、長治らが切腹する代わりに、城兵の命を助けることでした。
      - 聞き: 籠城の終わり方まで、半兵衛は知らないままなんだね。
      - 語り: 官兵衛が有岡城から助け出されるのも、同じ年の秋とされます。半兵衛は、三木合戦の結末も、官兵衛の救出も、見ていません。
        background: {image: paintings/hanbei_kanbei_hideyoshi_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》羽柴秀吉と黒田孝高 1883年（後世の想像図）"}
      - 聞き: 結果を見ないで終わる仕事も、あるんだね。しかも、それが自分の最後の仕事だなんて。
        tone: しみじみ
      - 語り: では、そんな半兵衛が、どうして「天才軍師」と呼ばれるようになったのか。最後に、その像をつくった本を、見ていきましょう。
        hook: true
      - 聞き: 息子が書いた本、って言ってたやつだね。
        hook: true

  # ---------------------------------------------------------------- 8 まとめ
  - title: まとめ：竹中半兵衛とは何者だったのか
    background: {image: paintings/hanbei_portrait_full.jpg, credit: "《竹中重治像》（竹中家旧蔵）"}
    year: 1579
    lines:
      - 語り: 半兵衛の像をつくった本を、順に並べます。最初は、1631年ごろ。息子の竹中重門が、秀吉の伝記『豊鑑』を書きました。歴史学者の呉座勇一さんは、これを、父をたたえる話のもとと見ます。
        figure: {type: stats, title: 半兵衛の像をつくった本, items: [[1631年ごろ, 豊鑑, 息子・重門の本], [江戸時代, 絵本太閤記, 隠者の像], [幕末, 真書太閤記, 三顧の礼], [戦後, 司馬遼太郎の小説, 欲のない芸術家]], upto: 1}
      - 聞き: 重門って、父が死んだとき、6、7歳だったよね。父をほとんど知らない子が、父を偉人にしたの？
        tone: 疑問
      - 語り: そう読む見方がある、ということです。断定はできません。重門が『豊鑑』を書き上げたのは、半兵衛の死から、50年あまりあとです。
      - 語り: 次に、江戸時代の『絵本太閤記』が、隠者の像を作ります。幕末の『真書太閤記』が、三顧の礼をはっきりさせます。
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
        figure: {type: stats, title: 半兵衛の像をつくった本, items: [[1631年ごろ, 豊鑑, 息子・重門の本], [江戸時代, 絵本太閤記, 隠者の像], [幕末, 真書太閤記, 三顧の礼], [戦後, 司馬遼太郎の小説, 欲のない芸術家]], upto: 3}
      - 語り: 戦後は、司馬遼太郎さんの小説が、欲のない芸術家という像を作った、と呉座さんは整理します。
        figure: {type: stats, title: 半兵衛の像をつくった本, items: [[1631年ごろ, 豊鑑, 息子・重門の本], [江戸時代, 絵本太閤記, 隠者の像], [幕末, 真書太閤記, 三顧の礼], [戦後, 司馬遼太郎の小説, 欲のない芸術家]], upto: 4}
      - 聞き: 本ごとに、半兵衛が少しずつ違う人になってる。賢者、三顧の礼で迎えられた人、欲のない芸術家……。
        figure: null
      - 語り: では、記録で言える半兵衛を、まとめます。1つ目。美濃の小さな山城に生まれた、国衆の長男でした。
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
      - 語り: 2つ目。1564年、舅の安藤守就と稲葉山城を乗っ取り、半年近く占拠しました。動機が、諫言か、家中の争いかは、割れています。
        background: {image: paintings/hanbei_gifu_castle_zu.jpg, credit: "《岐阜城図》（江戸時代）"}
      - 聞き: 動機が割れてるのに、半年も占拠した。そこが、ずっと引っかかるなあ。
      - 語り: 3つ目。信長が付けた与力として、秀吉の下で働きました。秀吉の家臣ではなかった、と見られています。
      - 聞き: 与力だから、秀吉の家来じゃない。この違いは、覚えとかなきゃ。
      - 語り: 調略と案内の取次役、というのが、呉座さんが見る実像です。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》（江戸時代）"}
      - 聞き: 「軍師」っていう肩書きを外すと、頼りにされた、地元の実務家って感じだね。
      - 語り: 重門は、秀吉に仕えたあと、関ヶ原では、最初は西軍に付き、井伊直政の仲介で東軍に転じます。
      - 語り: 黒田長政に説得された、という見方もあります。和樂webは、松寿丸を救ってもらった恩返しではないか、と読みます。ただし、これは解釈です。
      - 聞き: 偽の首の話が本当かどうかは分からなくても、二人の縁は、息子の代まで続いたのかもしれないんだね。
      - 語り: 4つ目。三木城の陣で、1579年6月13日に亡くなりました。結末を見ずに。それでも、書状に残る涙は、確かな半兵衛です。
        background: {image: paintings/hanbei_hiraiyama.jpg, credit: "《平井山》諸国古城之図（江戸時代）"}
      - 聞き: 「天才軍師」っていうより、ずっと人を気にかけてた、まじめな人。あーしは、そう覚えとく。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 次回は、徳川家康。「待つのが得意な人」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
