en:
  title: "Takenaka Hanbei: The 'Genius Strategist' Who Died Before Miki Castle Fell | Records vs. Legend"
  description: |-
    On the 13th day of the 6th month of 1579 (July 6 in the Julian calendar), Takenaka Hanbei died in camp at the siege of Miki Castle, aged 36 by East Asian reckoning. Miki Castle fell the following January.
    Hanbei is remembered as Toyotomi Hideyoshi's "genius strategist". But the sources from his own time say little. Much of the familiar story comes from a book by his son and from Edo-period war tales and novels.
    This video separates what the records show from what the stories say: the seizure of Inabayama Castle in 1564 (the "16 men" is a number from a later war tale, and the "6" is the number of men killed on the other side), whether he gave the castle back or was driven out, the "three visits" legend that follows the Romance of the Three Kingdoms, his role as a yoriki assigned by Oda Nobunaga, the siege of Miki, his letter that mentions Kuroda Kanbei's son, and his two main graves.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "June 1579: Dying Before Miki Castle Fell"
    - "1544: Born in a Small Mountain Castle in Mino"
    - "1564: The Daylight Seizure of Inabayama Castle"
    - "1564: Did He Return the Castle, or Was He Driven Out?"
    - "1570: Becoming Hideyoshi's Yoriki - The Three-Visits Legend"
    - "1577: Harima, Miki Castle and the Two Hyōe"
    - "June 13, 1579: Death in Camp and Two Main Graves"
    - "Summary: Who Was Takenaka Hanbei?"

