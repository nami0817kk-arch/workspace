- title: 近江屋事件は誰がやったのか 分かれる説
  background:
    image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
    credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
  year: 1867
  lines:
  - 語り: 誰が襲ったのか。決め手になる史料は、ありません。主な説を並べます。確かさは、画面の札で示します。
    portrait: null
    card:
      head: 誰がやったのか
      body: 決め手になる史料はない
  - 語り: いちばん有力なのは、京都見廻組の説です。箱館戦争のあと、元新選組の大石鍬次郎が見廻組の犯行だと話し、今井信郎が、1870年に取り調べで供述しました。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    figure:
      type: stats
      title: 近江屋事件の主な説（その1）
      items:
      - - 見廻組説
        - 有力
        - 今井信郎の口上書
      - - 新選組説
        - 説
        - 中岡の推測など
      - - 紀州藩の報復説
        - 説
        - いろは丸の恨み
      upto: 1
  - 語り: 口上書によると、佐々木只三郎ら7人が近江屋へ向かい、4人が実行、2人が見張りでした。動機は、寺田屋で龍馬が同心を撃ったことへの報復、という話です。
    background:
      image: paintings/ryoma_fushimi_teradaya_modern.jpg
      credit: Saigen Jiro 寺田屋の外観（現在の写真、2020年）
    figure:
      type: stats
      title: 近江屋事件の主な説（その1）
      items:
