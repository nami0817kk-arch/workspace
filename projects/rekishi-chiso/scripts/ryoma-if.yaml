      type: stats
      title: 近江屋事件の主な説（その2）
      items:
      - - 薩摩藩の陰謀説
        - 説
        - 裏付けは乏しい
  - 聞き: ドラマだと、黒幕がいたほうが面白いけど、証拠がなければ、そこまでは言えないんだね。
  - 語り: ほかにも説はありますが、どれも根拠が弱い。この回では、見廻組説が有力、ここまでを言います。犯人は、断定しません。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    figure: null
  - 聞き: 犯人が分からないまま、龍馬だけがいなくなったんだ。……もし、あの夜、違う選択をしていたら？
    tone: 疑問
    hook: true
  - 語り: 次の節から、《ここから想像》の札を出します。
    hook: true
- title: 想像① 薩摩藩邸に移っていたら 政変までの24日間
  background:
    image: paintings/yoshinobu_kimbei_mikado_garden.jpg
    credit: 日下部金兵衛 京都御所（1890年ごろ）
  year: 1867
  lines:
  - 語り: ここから先は、想像です。仮定は、ひとつだけ。11月15日の昼、龍馬は、吉井幸輔の勧めに応じて、薩摩藩邸へ移ります。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: ここから想像
      body: 龍馬は薩摩藩邸へ移る
    short: s3
  - 聞き: それだけで、あの夜は変わるの？
    tone: 疑問
  - 語り: 少なくとも、近江屋の二階には、龍馬はいません。避難の申し出は、記録に残っています。ここは、高い想像です。
    background:
      image: paintings/ryoma_satsuma_hiroshige2_sakurajima.jpg
      credit: 二代歌川広重《諸国六十八景 大隅 桜島》1862年
    card:
      head: 高い
      body: あの夜、近江屋の二階にいない
  - 聞き: じゃあ、助かった龍馬は、その24日間、何をするの？
    tone: 疑問
  - 語り: 想像劇場、第1幕です。11月16日の朝、京都の薩摩藩邸。龍馬のもとへ、中岡慎太郎が顔を出します。
    background:
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
    card:
      head: 想像劇場 第1幕
      body: 11月16日 薩摩藩邸
    short: s3
  - 人物: 「慎太郎、世話になる。二階に閉じこもっていては、話が進まんでの」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    short: s3
  - 人物: 「龍馬さん。大政奉還は成った。じゃが、薩摩は兵を上げる気じゃ。もう止められんぜよ」
    who: 中岡想像
    portrait:
      image: paintings/ryoma_nakaoka_shintaro.jpg
      caption: 中岡慎太郎（1866年ごろ）
      age: false
    short: s3
  - 人物: 「戦で決めれば、また血が流れる。わしは、話し合いの席を、ぎりぎりまで探す」
    who: 龍馬想像
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    short: s3
  - 人物: 「その席が開く前に、兵が動く。そこが、わしと龍馬さんの違いじゃ」
    who: 中岡想像
    portrait:
      image: paintings/ryoma_nakaoka_shintaro.jpg
      caption: 中岡慎太郎（1866年ごろ）
      age: false
    short: s3
  - 人物: 「風邪の身で、また走り回る気か」
    who: 中岡想像
    portrait:
      image: paintings/ryoma_nakaoka_shintaro.jpg
      caption: 中岡慎太郎（1866年ごろ）
      age: false
  - 人物: 「寝ておる間に、世が決まる。走らにゃならん」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 聞き: 二人とも同じ土佐の仲間なのに、見てるものが違うんだ。
    portrait: null
  - 語り: 二人の立場は、史実でも同じではなかった、と見られています。中岡は倒幕を、龍馬は話し合いを、最後まで求める。札は、ありうる。
    card:
      head: ありうる
      body: 龍馬と中岡の立場は分かれる
    short: s3
  - 語り: では、龍馬は24日で何ができたか。動かせる線は、3本あります。土佐の山内容堂と後藤象二郎。越前の松平春嶽と三岡八郎。そして、慶喜の側近の永井尚志です。
    background:
      image: paintings/ryoma_tosa_kuniezu_1837.jpg
      credit: 江戸の絵図師《天保国絵図 土佐国》1837年（国立公文書館蔵）
    figure:
      type: stats
      title: 龍馬が動かせた3本の線
      items:
      - - 土佐
        - 容堂・後藤
        - 12月8日に容堂が入京
      - - 越前
        - 春嶽・三岡
        - 12月8日に春嶽が議定に
      - - 幕府
        - 永井尚志
        - 慶喜の最も信頼する側近
  - 聞き: 土佐と越前と、慶喜の側近。三方向に、一人で糸を張るんだ。
  - 語り: このうち、容堂が入京するのは12月8日。春嶽が議定に任じられるのも、同じ8日です。それまでの京都は、偉い人が不在でした。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    figure:
      type: stats
      title: 龍馬が動かせた3本の線
      items:
      - - 土佐
        - 容堂・後藤
        - 12月8日に容堂が入京
      - - 越前
        - 春嶽・三岡
        - 12月8日に春嶽が議定に
      - - 幕府
        - 永井尚志
        - 慶喜の最も信頼する側近
  - 聞き: 偉い人がいない空白に、龍馬だけがいる、ってことか。
    tone: しみじみ
  - 語り: 想像です。龍馬は、福井と土佐と永井のあいだを走り、容堂の入京までに、話をつなぎます。近いところの想像です。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    card:
      head: ありうる
      body: 容堂の入京前に線をつなぐ
    figure: null
  - 聞き: でも、政変は12月9日に起きるんだよね。それは、止まるの？
    tone: 疑問
    hook: true
  - 語り: 政変を実行した藩の兵は、5つの藩から出ていました。
    hook: true
- title: 想像② 12月9日の政変は止まったか 辞官納地と取引
  background:
    image: paintings/yoshinobu_kimbei_mikado_garden.jpg
    credit: 日下部金兵衛 京都御所（1890年ごろ）
  year: 1868
  lines:
  - 語り: 12月9日、1868年1月3日の朝。薩摩や土佐など5つの藩の兵が、御所の九門を固めます。
    portrait: null
    card:
      head: 1868年1月3日
      body: 王政復古の大号令
  - 語り: 5藩は、薩摩と土佐、安芸、尾張、越前。二条斉敬ら、親幕府の公家は、参内を止められました。王政復古の大号令です。
  - 聞き: ここに龍馬がいたら、止められたのかな？
    tone: 疑問
  - 語り: 材料を見ます。薩摩は、密勅を名分に、兵3,000の動員を計画していました。11月29日、12月24日には、島津茂久が藩兵を率いて上洛しています。
    background:
      image: paintings/ryoma_satsuma_hiroshige_bonoura.jpg
      credit: 歌川広重《六十余州名所図会 薩摩 坊ノ浦 双剣石》1856年
    portrait:
      image: paintings/yoshinobu_okubo_toshimichi.jpg
      caption: 大久保利通（1872年）
      age: false
    card:
      head: 11月29日（12月24日）
      body: 島津茂久が上洛
  - 聞き: 兵は、もう動いてたんだ。
  - 語り: 大久保と西郷は、武力倒幕で藩論をまとめ、12月9日へ進みました。龍馬が薩摩藩邸にいても、この流れは止まりません。札は、ありうるにします。
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
    card:
      head: ありうる
      body: 政変そのものは止まらない
  - 聞き: 止められないなら、龍馬がいても意味ない？
    tone: 疑問
  - 語り: 変わるのは、政変の中身です。小御所会議で、辞官納地が決まりました。要求は400万石で、春嶽らの働きかけで、200万石の半納になります。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    portrait: null
    figure:
      type: bars
      title: 辞官納地の要求（万石）
      bars:
      - - 当初の要求
        - 400
      - - 緩和後
        - 200
      labels:
      - 400万石
      - 200万石
    year: 1867
  - 聞き: 半分にまけてもらった、ってことだね。春嶽たちのおかげで。
  - 語り: 想像劇場、第2幕です。12月8日の夜、京都の土佐藩邸。容堂が入京した夜に、龍馬が、後藤象二郎を訪ねます。
    background:
      image: paintings/ryoma_kochi_castle_kurogane_gate_modern.jpg
      credit: Drivephotographer 高知城・黒鉄門（現在の写真、2022年）
    card:
      head: 想像劇場 第2幕
      body: 12月8日 土佐藩邸
    figure: null
  - 人物: 「龍馬、明日は朝から御所が固められる。薩摩も岩倉卿も、もう後には引かん」
    who: 後藤想像
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
  - 人物: 「後藤さん、慶喜公を外してはいかん。納地は半分にして、残りは、慶喜公が新政府に出す金にすればええ」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「それは取引じゃな。じゃが、慶喜公が、うんと言うか」
    who: 後藤想像
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
  - 人物: 「永井様を通して、話してみるぜよ。頼んだぜよ」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 聞き: 全部取り上げるんじゃなくて、取引にして、顔も立てるのか。龍馬らしいかも。
    portrait: null
  - 語り: 似た見立てを書く人がいます。評論家の八幡和郎さんは、龍馬が生きていれば、慶喜が新政府の財源として100万石以上を出す取引をまとめたかもしれない、と書きます。
    background:
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
  - 語り: 史料名は示されていない、筆者の見立てです。想像で言えば、龍馬の案は、史実の半納へ向かう流れの中の、一つの案にすぎません。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
  - 語り: 慶喜がそれを呑んだ記録も、龍馬が慶喜に会った記録も、見つかっていません。
    card:
      head: ほぼ妄想
      body: 龍馬が慶喜を動かす
  - 聞き: 慶喜と龍馬は、会ったこともないかもしれないんだ。そこをつなぐのが、永井尚志、ってことか。
    hook: true
  - 語り: では、その先の戦争は、避けられたのでしょうか。
    background:
      image: paintings/yoshinobu_osaka_palace_butt_1868.jpg
      credit: J.H.バット《Tycoon's Palace, Osaka》1868年1月（水彩）
    hook: true
- title: 想像③ 12月13日の薩摩藩邸 戊辰戦争は起きたか
  background:
    image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
    credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
  year: 1868
  lines:
  - 語り: 史実では、12月13日に、岩倉と西郷が妥協案を示します。辞官納地に応じれば、慶喜を議定に任じ、前内大臣の待遇を認める、という案です。
    portrait:
      image: paintings/yoshinobu_iwakura_tomomi.jpg
      caption: 岩倉具視
      age: false
    card:
      head: 12月13日（1月7日）
      body: 慶喜を議定に迎える妥協案
    short: s5
  - 聞き: 慶喜も、新政府に入れる道があったんだ。
  - 語り: 想像劇場、第3幕です。12月13日、薩摩藩邸。龍馬は、西郷隆盛と向き合います。
    background:
      image: paintings/ryoma_satsuma_hiroshige2_sakurajima.jpg
      credit: 二代歌川広重《諸国六十八景 大隅 桜島》1862年
    portrait: null
    card:
      head: 想像劇場 第3幕
      body: 12月13日 薩摩藩邸
  - 人物: 「龍馬どん。岩倉卿と、慶喜公を議定に迎える案を出した。辞官納地に応じれば、じゃ」
    who: 西郷想像
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 人物: 「西郷さん、約束は文にしてくれ。口だけでは、大坂の兵が信じん」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「考えておきもす。ただし、大坂の兵が動かぬ間は、じゃ」
    who: 西郷想像
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 人物: 「火種は、江戸にもある。そこも、わしが見ておく」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 聞き: 約束を文にする、って、やっぱり商売人っぽい。……でも、これで戦は避けられるの？
    tone: 疑問
    portrait: null
  - 語り: 史実では、12月16日に慶喜が大坂城で6か国の公使と会い、外交権を認めさせます。
    background:
      image: paintings/yoshinobu_osaka_palace_butt_1868.jpg
      credit: J.H.バット《Tycoon's Palace, Osaka》1868年1月（水彩）
  - 聞き: そこまでは、落ち着いて見えるけど。
  - 語り: 12月25日、江戸で薩摩藩邸が焼き討ちされます。28日に報せが大坂に届くと、「薩摩を討つべし」の声が一気に高まりました。
    background:
      image: paintings/yoshinobu_beato_yedo_inner_moat.jpg
      credit: F.ベアト 江戸城の内濠（1863〜73年）
    card:
      head: 12月25日（1月19日）
      body: 江戸の薩摩藩邸を焼き討ち
    short: s5
  - 語り: 想像です。龍馬が京都にいても、江戸の焼き討ちは止められません。大坂の兵が上京する流れも、変わりません。鳥羽・伏見の戦いは、起きます。
    background:
      image: paintings/yoshinobu_toba_fushimi_screen.jpg
      credit: 鳥羽伏見の戦いの黒白図（1868年）
    card:
      head: ありうる
      body: 鳥羽・伏見は起きる
    short: s5
  - 聞き: 龍馬一人じゃ、戦争の流れは変えられないの？ 海援隊は？
    tone: 疑問
    short: s5
  - 語り: 海援隊は、土佐藩の外郭組織です。藩の兵も、金も、官位もありません。人数は、今回の調査では見つかりませんでした。軍勢を止める力は、ありません。
    background:
      image: paintings/ryoma_nagasaki_hiroshige2_ships.jpg
      credit: 二代歌川広重《諸国名所百景 肥前長崎唐船の津》1860年ごろ
    portrait:
      image: paintings/ryoma_kaientai_group.jpg
      caption: 海援隊の集合写真（左から3人目が龍馬とされる、1867年1月ごろ）
      age: false
    card:
      head: 海援隊
      body: 兵も官位も持たない
    short: s5
  - 聞き: 船と商いの会社だったんだもんね。軍隊の代わりにはならないか。
  - 語り: 歴史家の加来耕三さんは、龍馬が目指したのは、徳川中心でも薩長中心でもない、第三の道だった、と書きます。
    background:
      image: paintings/yoshinobu_kaiyo_maru_konb_4519.jpg
      credit: 開陽丸の石版画（1866年）
    portrait: null
  - 語り: 東日本には徳川を支持する藩が多く、多数決なら、慶喜が有利だった、とも言います。
    background:
      image: paintings/yoshinobu_tokugawa_warships_shinagawa.png
      credit: 小杉雅之進 幕府軍艦八隻の品川沖出帆の図（1868年）
  - 聞き: 第三の道が開けば、戦争は起きなかったかもしれない、ってこと？
    tone: 疑問
  - 語り: ただし加来さんは、龍馬の功績は過大評価で、歴史学の見解としては、日本史にさほど影響しなかった、とも書いています。
    background:
      image: paintings/yoshinobu_osaka_palace_butt_1868.jpg
      credit: J.H.バット《Tycoon's Palace, Osaka》1868年1月（水彩）
    card:
      head: 歴史学の見方
      body: 影響は大きくなかった、とも
  - 語り: 生きていたら歴史が変わった、とは、研究者が支持する見方ではありません。戊辰戦争が起きない世界は、ほぼ妄想です。材料は人の評価だけで、事実の足場がありません。
    background:
      image: paintings/yoshinobu_beato_yokohama_1865.jpg
      credit: F.ベアト 横浜の運河と家並（1865年）
    card:
      head: ほぼ妄想
      body: 戊辰戦争が起きない世界
  - 聞き: じゃあ、その世界で、龍馬は、どこにいたの？
    tone: 疑問
