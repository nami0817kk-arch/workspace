terms:
  海援隊: 龍馬が隊長を務めた土佐藩の外郭組織。船で運輸と商いをした
  亀山社中: 龍馬が長崎でつくった結社。のち海援隊になる
  船中八策: 船の中で龍馬が示した、と語られる八つの案。原本は見つかっていない
  職制案: 新政府の人事の案。尾崎三良の回想などに版が分かれて伝わる
  討幕の密勅: 慶応3年10月、薩摩宛13日付・長州宛14日付の討幕の命令。偽勅の疑い
  万国公法: 当時の国際法の本。いろは丸事件の交渉で龍馬が持ち出した
  辞官納地: 官職と領地を朝廷に返すこと
  王政復古: 慶応3年12月9日（1868年1月3日）、天皇中心の政府に戻すと宣言
  見廻組: 京都の治安を守った幕府の組織。近江屋事件の有力な説
