      body: 神戸海軍操練所が発足
    year: 1864
  - 語り: 龍馬は長崎に亀山社中をつくり、1867年の4月、土佐藩の外郭組織、海援隊の隊長になります。船で荷を運び、商いもする組織です。
    background:
