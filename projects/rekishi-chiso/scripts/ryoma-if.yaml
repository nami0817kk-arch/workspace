        - 中岡の推測など
      - - 紀州藩の報復説
        - 説
        - いろは丸の恨み
  - 語り: よっつ目は、薩摩藩の陰謀説です。映像作品ではよく採られますが、裏付けは乏しい。歴史学では、大政奉還路線と武力倒幕路線の対立を強調しすぎだ、という見方が、おおむね一致しています。
    background:
      image: paintings/ryoma_satsuma_hiroshige2_sakurajima.jpg
      credit: 二代歌川広重《諸国六十八景 大隅 桜島》1862年
