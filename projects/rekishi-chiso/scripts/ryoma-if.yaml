      age: false
    card:
      head: 慶応3年4月
      body: 海援隊の隊長に
    year: 1867
  - 聞き: 藩の兵を率いる人、ってわけじゃなかったんだね。兵も金も、持ってなかったってこと？
    tone: 疑問
  - 語り: そうです。藩の兵も、金も、官位も、ありません。約規の目的は、運輸と射利、投機と開拓、そして本藩の応援でした。射利は、利益を取る、という意味です。
    background:
      image: paintings/ryoma_nagasaki_beato_boats_river.jpg
      credit: F.ベアト《長崎の川の舟》1865年ごろ
    card:
      head: 海援隊約規
      body: 運輸・射利・投機・開拓
  - 聞き: 船の会社と、政治の顔、両方持ってたんだ。会社でいうと、社員はいるけど、株は持ってない社長、みたいな感じかな。
  - 語り: 4月23日、1867年5月26日。海援隊のいろは丸が、紀州藩の明光丸とぶつかって沈みます。いろは丸は160トン、明光丸は約880トン。
    background:
      image: paintings/ryoma_irohamaru_collision_diagram.jpg
      credit: いろは丸と明光丸の衝突の位置図（土佐藩の記録を後世に図にしたもの）
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年4月23日
      body: いろは丸が沈む
    figure:
      type: bars
      title: 船の大きさ（トン）
      bars:
      - - いろは丸
        - 160
      - - 明光丸
        - 880
      labels:
      - 160トン
      - 約880トン
  - 語り: 龍馬は、万国公法を持ち出して交渉し、賠償金は、請求した8万3千両余から、7万両に減って決まりました。画面は、現在の鞆の浦の宿です。
    background:
      image: paintings/ryoma_tomonoura_masuya_modern.jpg
      credit: Saigen Jiro 鞆の浦の旧街並み・枡屋清右衛門宅（現在の写真、2020年）
    figure: null
  - 聞き: 5倍以上も大きい船に当てられて、それでも、ルールで勝負したんだ。剣じゃなくて、法律で戦う人だったんだね。……でも、薩長同盟は、龍馬が成立させたんでしょ？
    tone: 疑問
  - 語り: 龍馬は、桂小五郎との会談に同席しました。ただ、決定的だったのは小松帯刀だ、と書く歴史家もいます。画面は、京都にある現在の石碑です。
    background:
      image: paintings/ryoma_satcho_alliance_stone_modern.jpg
      credit: ぽかぶーぶー 薩長同盟所縁之地の石碑（現在の写真、2023年）
    portrait:
      image: paintings/ryoma_komatsu_tatewaki.jpg
      caption: 小松帯刀（1870年以前）
      age: false
    card:
      head: 薩長同盟 1866年
      body: 決定的だったのは小松帯刀、とも
  - 聞き: 龍馬の手柄って、盛られてる部分もあるってこと？
    tone: 疑問
  - 語り: あります。のちの伝記や小説が、龍馬像を大きくした、とも言われます。だからこの回は、龍馬が確かに書き残したものと、動いた線だけを材料にします。
    background:
      image: paintings/ryoma_tosa_hiroshige_bonito.jpg
      credit: 歌川広重《六十余州名所図会 土佐 海上松魚釣》1855年
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: この回の材料
      body: 書き残したものと、動いた線
  - 聞き: 確かな材料だけで、線をたどるんだね。どこからたどるの？
    tone: 疑問
    hook: true
  - 語り: いちばん大きな分かれ目。大政奉還までです。
    hook: true
- title: 慶応3年 船中八策と大政奉還
  background:
    image: paintings/ryoma_ship_kanrin_maru_rough_seas.jpg
    credit: 宮本元道《咸臨丸の荒海》1861年ごろ
  year: 1867
  lines:
  - 語り: 慶応3年の6月。長崎から京都へ向かう土佐の船の中で、龍馬が後藤象二郎に8つの案を示した、と語られてきました。船中八策です。絵は、同じ時代の洋式帆船、咸臨丸です。
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
    card:
      head: 船中八策
      body: 6月9日ごろ。日付は割れる
  - 聞き: 8つの案、って、どんな中身なの？
    tone: 疑問
  - 語り: 政権を朝廷に返す。上下の議政所、つまり議会をつくる。人材を登用する。外交は公議で決める。新しい法典。海軍の拡張。親兵。貨幣を外国と釣り合わせる。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 船中八策の柱
      body: 政権を朝廷に返す・議会をつくる
  - 語り: ただし、この八策は、原本が見つかっていません。後藤や陸奥宗光の回想にも、長岡謙吉の日記にも記述が無く、文言は、明治以降の伝記で形づくられた、と研究は見ています。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
    card:
      head: 船中八策
      body: 原本は見つかっていない
  - 聞き: 原本が無いのに、あったことになってたの？ あんなに有名な話なのに。
    tone: 驚き
  - 語り: 日付も、6月9日と15日で割れます。だからこの回では、船中八策は、あったとして語られてきた話、として扱います。
  - 語り: では、大政奉還はどうか。10月3日、1867年10月29日。山内容堂の名で、後藤象二郎らが、老中の板倉勝静に建白書を出します。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    portrait:
      image: paintings/yoshinobu_yamauchi_yodo.jpg
      caption: 山内容堂（幕末）
      age: false
    card:
      head: 慶応3年10月3日
      body: 土佐藩が大政奉還を建白
  - 聞き: 龍馬が考えた案を、土佐藩が出した、って流れでしょ？
    tone: 疑問
  - 語り: 通説は、そうです。ただ、研究は割れています。知野文哉さんは、龍馬が後藤に建言した可能性は高い、とみます。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    portrait: null
  - 聞き: 割れてるってことは、反対の見方もあるんだ。
    tone: 疑問
  - 語り: 青山忠正さんは、龍馬が建白したことは、史料で論証されたことがない、と言います。
  - 聞き: 発案者は、決まってないんだ。じゃあ、はっきりしてるのは？
    tone: 疑問
  - 語り: 10月14日、1867年11月9日。慶喜が大政奉還の上表を出し、翌日、朝廷が許します。前日には、約40藩の重臣、およそ50人が、二条城に集まっていました。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
    portrait:
      image: paintings/yoshinobu_portrait_shogun.jpg
      caption: 徳川慶喜（将軍時代）
      age: false
    card:
      head: 慶応3年10月14日
      body: 慶喜が大政奉還の上表を出す
  - 聞き: 戦わずに、政権を返したんだ。これで、一件落着？
    tone: 疑問
  - 語り: 同じ10月14日、薩摩と長州には、討幕の密勅が出ていました。偽の勅書だった疑いが濃い、といわれます。大政奉還と、討幕の命令が、同じ日に動いていたのです。
    background:
      image: paintings/ryoma_doc_tobaku_micchoku_1867.jpg
      credit: 討幕の密勅（毛利家蔵、慶応3年10月14日）
    portrait: null
    card:
      head: 同じ10月14日
      body: 薩長に討幕の密勅も出る
  - 語り: 薩摩3,000、長州2,500の兵を動かす計画があった、と佐々木克さんは述べます。計画の数で、実際に動いた数ではありません。
    figure:
      type: bars
      title: 密勅を名分にした動員計画（計画の数）
      bars:
      - - 薩摩藩
        - 3000
      - - 長州藩
        - 2500
      labels:
      - 3,000
      - 2,500
  - 聞き: 計画の数、ね。龍馬は、そのあいだで、何をしてたの？
    tone: 疑問
    figure: null
    hook: true
  - 語り: 大政奉還のあと龍馬が手がけたのは、新しい政府の人事の案でした。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    hook: true
- title: 龍馬が考えた新政府 職制案・綱領八策・福井行き
  background:
    image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
    credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
  year: 1867
  lines:
  - 語り: 10月中旬ごろ、龍馬は、職制案という人事の案を作った、と伝わります。相棒は、三条家に仕えた戸田雅楽、のちの尾崎三良です。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 職制案
      body: 10月中旬ごろ。日付は不明
    short: s4
  - 聞き: 新しい政府の、人事案……。龍馬が、役人を決めるリストを作ってたの？
    tone: 疑問
  - 語り: 関白に三条実美、内大臣に徳川慶喜。議奏には山内容堂や松平春嶽ら。参議には、西郷や大久保、木戸、後藤、三岡八郎らが並びます。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    portrait:
      image: paintings/ryoma_sanjo_sanetomi.jpg
      caption: 三条実美（晩年）
      age: false
    card:
      head: 職制案の顔ぶれ
      body: 関白に三条、内大臣に慶喜
    short: s4
  - 聞き: 慶喜まで入ってる！ 薩長だけの政府じゃなくて、みんなで、って案なんだ。
    tone: 驚き
  - 語り: ただし、慶喜がこの案を知っていたかは、確かめられていません。原史料の所在も不明で、尾崎の回想や、のちの伝記に、版が分かれて伝わっています。
    background:
      image: paintings/ryoma_kyoto_arashiyama_hiroshige.jpg
      credit: 歌川広重《六十余州名所図会 山城 嵐山渡月橋》1853年
    portrait: null
    card:
      head: 原史料の所在
      body: 分かっていない
  - 聞き: 版が分かれてるって、中身が違うバージョンがあるの？
    tone: 疑問
  - 語り: あるのです。尾崎の一部の版には、参議に「坂本」の名が入っています。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    short: s4
  - 語り: ところが、坂崎紫瀾が編んだ『海援隊始末』では、龍馬の名も慶喜の名も外れている。初稿の写本では、「阪本」の字が朱で見消されています。
    card:
      head: 龍馬の名
      body: 版によって入る・外れる
    short: s4
  - 聞き: 自分で作った人事案から、自分の名前が消えてる……。誰が、いつ消したの？
  - 語り: 消した人も時期も、分かっていません。ここで語られるのが、西郷の話です。名の無いのを訝しんだ西郷に、役人嫌いの龍馬は、「世界の海援隊」をやる、と答えたそうです。
    background:
      image: paintings/ryoma_nagasaki_beato_panorama.jpg
      credit: F.ベアト《長崎の部分パノラマ》1867〜68年
  - 語り: ただし、この話が初めて本に載るのは、龍馬の死の47年後、1914年です。裏付けは弱く、説として聞いてください。
    card:
      head: 「世界の海援隊」
      body: 説。初出は1914年
  - 聞き: 本当なら、龍馬は最初から、政府の外に出るつもりだった、ってことだよね。でも、説なんだ。
  - 語り: 次は、龍馬の自筆です。11月に書いた、新政府綱領八策。自筆が2枚、いまも残っていて、署名は、本名の直柔です。画面は、同じ年の1月に姉へ書いた手紙です。
    background:
      image: paintings/ryoma_doc_letter_1867.jpg
      credit: 坂本龍馬 姉・乙女宛の手紙 1867年1月（京都国立博物館蔵）
    card:
      head: 新政府綱領八策
      body: 11月。自筆が2枚残る
  - 聞き: 船中八策と、同じような中身？
    tone: 疑問
  - 語り: 似ています。人材を顧問に招く。名ばかりの官職を廃す。議政所をつくる。海軍と、御親兵。通貨を外国と釣り合わせる。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1848.jpg
      credit: 歌川広重《東海道五十三次 京 三条大はし》1848年ごろ
  - 語り: 「自ら盟主となり」の主語が、伏せ字になっています。誰かは、慶喜、容堂、春嶽などの説があり、定説はありません。人名の名簿も、ありません。
    card:
      head: 伏せ字の主語
      body: ○○○は定説なし
  - 聞き: 似た名前の文書が3つもあって、ごちゃごちゃするなあ。船中八策は原本なし、職制案は人事の案で、綱領八策は自筆で名簿なし、か。
  - 語り: そのとおりです。龍馬は、財政も考えました。10月24日、1867年11月19日に京都を出て福井へ向かい、謹慎中の三岡八郎と、新政府の財政を話し合ったそうです。
    background:
      image: paintings/ryoma_kyoto_arashiyama_hiroshige.jpg
      credit: 歌川広重《六十余州名所図会 山城 嵐山渡月橋》1853年
    portrait:
      image: paintings/ryoma_matsudaira_shungaku.jpg
      caption: 松平春嶽（幕末の肖像）
      age: false
    card:
      head: 慶応3年10月24日
      body: 福井へ。三岡八郎に会う
    figure:
      type: map
      title: 龍馬の福井行き
      bounds:
      - 135.0
      - 137.4
      - 34.5
      - 36.6
      places:
      - - 京都
        - 135.77
        - 35.01
      - - 福井
        - 136.22
        - 36.06
      - - 大坂
        - 135.52
        - 34.69
      route:
      - 京都
      - 福井
      note: 10月24日に出発し、11月5日に戻る
  - 語り: 三岡は、福井藩で藩札を出して成功した人で、紙幣の発行を提案した、と伝わります。のちに新政府は、実際に太政官札を出しました。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1848.jpg
      credit: 歌川広重《東海道五十三次 京 三条大はし》1848年ごろ
    portrait: null
    figure: null
  - 聞き: 刀や兵より先に、お金の設計を考えてたんだ。その龍馬が、京都に戻ったのは？
    tone: 疑問
    hook: true
  - 語り: 11月5日、1867年11月30日。運命の夜まで、あと10日でした。
    card:
      head: 慶応3年11月5日
      body: 京都に戻る。事件まで10日
    hook: true
- title: 11月15日の夜 近江屋の二階
  background:
    image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1848.jpg
    credit: 歌川広重《東海道五十三次 京 三条大はし》1848年ごろ
  year: 1867
  lines:
  - 語り: 話を、慶応3年11月15日に戻します。福井から戻った龍馬は、風邪をひいて、近江屋の二階に移っていました。用心のために、山田藤吉が雇われていたそうです。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 11月中旬
      body: 風邪で近江屋の二階に
    short: s2
  - 聞き: 風邪で、寝込んでたんだ。守りは、その藤吉さん一人だけ？
    tone: 疑問
    short: s2
  - 語り: 薩摩の吉井幸輔は、薩摩藩邸に避難するよう勧めました。龍馬は、応じませんでした。御陵衛士の伊東甲子太郎が、新選組と見廻組が狙っている、と告げたとも伝わります。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    portrait:
      image: paintings/ryoma_yoshii_tomozane.jpg
      caption: 吉井友実（幸輔、晩年の姿）
      age: false
    card:
      head: 薩摩藩邸への避難
      body: 勧められたが、応じなかった
    short: s2
  - 聞き: 逃げて、って言われてたのに……。それでも、断ったんだ。
    tone: しみじみ
    short: s2
  - 語り: 11月15日の夜、午後9時ごろ。近江屋で、龍馬と、訪ねていた中岡慎太郎が襲われました。龍馬は、その夜のうちに亡くなります。満31歳でした。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年11月15日
      body: 近江屋事件。龍馬は夜に没
    short: s2
  - 語り: 従僕の藤吉は16日の夕方、中岡は17日の夕方に亡くなりました。この事件の犠牲者は、3人です。
    portrait:
      image: paintings/ryoma_nakaoka_shintaro.jpg
      caption: 中岡慎太郎（1866年ごろ）
      age: false
    card:
      head: 11月16日・17日
      body: 藤吉と中岡慎太郎も没
  - 聞き: 3人も……。龍馬の誕生日と、同じ日だったんだよね。
    tone: しみじみ
  - 語り: 18日、1867年12月13日に、海援隊と陸援隊の仲間が葬儀を営みました。墓碑銘は、木戸孝允が書いています。画面は、京都霊山にある現在の墓の写真です。
    background:
      image: paintings/ryoma_ryozen_tomb.jpg
      credit: PHGCOM 京都霊山の坂本龍馬・中岡慎太郎の墓（現在の写真、2009年）
    portrait: null
    card:
      head: 11月18日
      body: 海援隊・陸援隊が葬儀
  - 語り: 岩倉具視は、二人の死を、こう嘆いたと伝わります。
    portrait:
      image: paintings/yoshinobu_iwakura_tomomi.jpg
      caption: 岩倉具視
      age: false
  - 人物: 「両腕を奪い去る」
    who: 岩倉の言葉
  - 語り: 三条実美は、慟哭して、祭壇を設けた、といいます。
    background:
      image: paintings/ryoma_ryozen_tomb_torii.jpg
      credit: 龍馬の墓の鳥居と灯籠（現在の写真、2009年）
    portrait: null
  - 聞き: 討幕を進めた岩倉まで、両腕、って言うんだ。それだけ、いろんな人のあいだを結んでたんだね。……じゃあ、誰が、やったの？
    tone: 疑問
    hook: true
  - 語り: それが今も、決め手が無いのです。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
