  - 語り: みっつ目は、紀州藩士の報復説です。いろは丸の恨み、という見方で、陸奥陽之助らが唱えました。この噂を背景に、のちに天満屋事件が起きます。
    background:
      image: paintings/ryoma_nagasaki_beato_boats_river.jpg
      credit: F.ベアト《長崎の川の舟》1865年ごろ
    figure:
      type: stats
