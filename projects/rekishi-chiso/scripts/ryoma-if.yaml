en:
  title: What If Sakamoto Ryoma Had Survived the Omiya Incident? | Japan 24 Days Before the Restoration
  description: 'On the night of the 15th day of the 11th month of Keio 3 (December 10, 1867), Sakamoto Ryoma was attacked at the Omiya inn in Kyoto and died that night, aged 31. That was 31 days after the Restoration of Imperial Rule was proposed by Tokugawa Yoshinobu (Taisei Hokan) and 24 days before the Imperial Restoration of January 3, 1868. This video asks: what if he had survived that night?


    We keep records, theories and imagination apart. First, what the sources say: Ryoma''s role, which scholars disagree on; the Senchu Hassaku, whose original has never been found; the personnel plan (Shokusei-an) whose versions differ on whether his own name appears; his handwritten eight-point program; his trip to Fukui to talk finance with Mioka Hachiro; the night of the attack; and the competing theories about who did it.


    Then, clearly marked imagination with reasons: moving to the Satsuma residence, whether the coup of December 9 could be stopped, whether the Boshin War could be avoided, a table of what becomes of Nakaoka, Goto, Yoshinobu, Saigo and others, how Japan would differ, and the chains to modern Japan.


    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'December 10, 1867: 24 Days Before the Restoration'
  - 'From Tosa to Nagasaki: Ryoma and the Kaientai'
  - '1867: The Senchu Hassaku and the Return of Power'
  - 'Ryoma''s Plan for a New Government: Personnel Plan, Eight Points, Fukui'
  - 'The Night of the 15th: The Second Floor of the Omiya'
  - Who Did It? The Competing Theories
  - 'Imagination 1: Moving to the Satsuma Residence - 24 Days to the Coup'
  - 'Imagination 2: Could the Coup of December 9 Be Stopped?'
  - 'Imagination 3: Would the Boshin War Still Happen?'
  - 'Imagination 4: A Table of Fates - Who Becomes What?'
  - 'Imagination 5: How Japan Changes, and the Chains to Today'
  - 'Summary: A Map of the Afternoon of the 15th'
