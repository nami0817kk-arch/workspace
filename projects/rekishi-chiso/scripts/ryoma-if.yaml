# B（歴史の転換点の if ストーリー）の3本目。型：事実（近江屋の夜・龍馬の構想・大政奉還・新政府の人事案）→ 史料に残る別の道 → 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/ryoma_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は ryoma_assets.md。既存：yoshinobu_if_facts.md・akechi_if_facts.md
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の龍馬想像・中岡想像・後藤想像・西郷想像）
#   ③記録のセリフ（第4節の岩倉具視「両腕を奪い去る」＝roles の岩倉の言葉）と同じ節では混ぜない（想像の節に記録のセリフは置かない）
#   同じ幕で声が重ならない：第1幕＝龍馬（白上虎太郎）と中岡（青山龍星）／第2幕＝龍馬と後藤（玄野武宏）／第3幕＝龍馬と西郷（麒ヶ島宗麟）
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。事実の部分は「分かっていません」「と伝わります」を使い分ける。
# 冒頭の強い一点：下調べの候補A「龍馬が殺されたのは王政復古のわずか24日前」（日数は西暦で数えた自分の計算。大政奉還→近江屋31日／近江屋→王政復古24日／近江屋→鳥羽・伏見48日）。
#   C「身を隠せと言われて断った夜」は第4節の山と想像①の仮定に、B「人事案から龍馬の名が消えた版がある」は第3節に回した（Bの名の有無は断定しない。版で割れる）。
# 範囲は 史実（龍馬の役割は割れる→船中八策は原本なし→大政奉還→職制案・綱領八策・福井→近江屋の夜→犯人の諸説）→ 想像（薩摩藩邸・政変・戊辰戦争）→ 運命表 → 日本の変化点 → 現代の鎖 → まとめ。
# 数字は「何の数か」を言う（動員の計画の数／契約の数ではなく船のトン数／要求の石高）。日付は和暦の月日、西暦は換算。慶応3年11月15日＝1867年12月10日、同12月9日＝1868年1月3日。
# 使わない話：襲撃の場面の描写・流血／黒幕説（薩摩・後藤・大久保・外国）を事実として／犯人の断定／船中八策を大政奉還の原案として／「龍馬が薩長同盟を成立させた」「龍馬がいなければ維新は無かった」／
#   「世界の海援隊」を事実として（と伝わる・初出1914年と断る）／龍馬が慶喜のために命を捨てると誓った台詞／昭憲皇后の夢枕／小説（竜馬がゆく・汗血千里駒）の場面／いろは丸を「詐欺」と言うこと／
#   「生きていれば戊辰戦争・西南戦争が防げた」「初代首相」を事実として（八幡の見立ては筆者の見立てと断る）／ネット掲示板・個人ブログ／お龍・脱藩・寺田屋の細部／土佐の上士・郷士の差別的な言い回し。
# 決めた札の理由：
#   高い＝あの夜、近江屋の二階にいない（吉井幸輔の避難の勧めが記録にある）／三岡八郎の登用と財政（史実の登用は事実）。
#   ありうる＝政変そのものは止まらない（薩摩の動員計画・藩論統一は龍馬と無関係に進んだ）／鳥羽・伏見は起きる（江戸の焼き討ちは京都の龍馬の手が届かない）／中岡との立場の分かれ・西郷の動員・海援隊と龍馬の居場所（約規に射利）。
#   ほぼ妄想＝龍馬が慶喜を動かして100万石以上の取引（接点の記録が無い。八幡の見立てのみ）／戊辰戦争が起きない世界（加来の「第三の道」は評価で、事実の足場が無い）／本人が語り直す。
#   研究は見つからない（正面から論じたもの）と、歴史学の側の「影響は大きくなかった」見方（加来の紹介）を、冒頭と第8節で断った。
# 画面の決まり：背景に人物の肖像を使わない（肖像は額）／極端に横長の絵（新政府綱領八策の写し・約規・議事之体大意）は使わない／暗殺の絵・血・遺体は使わない／現代の写真（鞆の浦・神戸の碑・石碑・龍馬の墓）は credit に「現在の〜」と書き、語りでも断る。
title: もし坂本龍馬が近江屋で暗殺されなかったら｜王政復古の24日前、日本はどうなったか
