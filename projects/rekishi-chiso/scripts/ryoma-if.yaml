sections:
- title: 1867年12月10日の夜 王政復古の24日前
  background:
    image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
    credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
  year: 1867
  lines:
  - 語り: 坂本龍馬が近江屋で襲われ、亡くなったのは、慶応3年11月15日。王政復古の大号令が出る、わずか24日前でした。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年11月15日
      body: 近江屋で襲われる（西暦12月10日）
    short: s1
  - 語り: 王政復古は、幕府に代わる新しい政府が宣言された日です。この回の日付は旧暦で、必要なときだけ西暦を添えます。
    short: s1
  - 聞き: 24日前……。ほんとに、ぎりぎりだ。龍馬って、新しい政府を作る側の人だったよね？
    tone: 驚き
    short: s1
  - 語り: 大政奉還から31日。誕生日と同じ11月15日でした。
    figure:
      type: stats
      title: 龍馬の死と、そのあとの日数
      items:
      - - 大政奉還から
        - 31日
        - 近江屋の夜まで
      - - 近江屋の夜から
        - 24日
        - 王政復古まで
      upto: 1
  - 語り: そこから24日後に、王政復古です。龍馬が、もしあの夜を越えていたら。今日は、その先を掘ります。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    figure:
      type: stats
      title: 龍馬の死と、そのあとの日数
      items:
      - - 大政奉還から
        - 31日
        - 近江屋の夜まで
      - - 近江屋の夜から
        - 24日
        - 王政復古まで
    short: s1
  - 聞き: 歴史に「もしも」はない、ってよく言うけど……龍馬が生きてたら、って、誰でも一回は考えるよね。ちゃんと掘れるの？
    tone: 疑問
    short: s1
  - 語り: 掘れます。問いは3つ。12月9日の政変は、止められたのか。戊辰戦争は、起きなかったのか。龍馬は、新しい政府の中にいたのか。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1848.jpg
      credit: 歌川広重《東海道五十三次 京 三条大はし》1848年ごろ
    card:
      head: 今日の3つの問い
      body: 政変は？ 戊辰戦争は？ 龍馬は？
    figure: null
  - 聞き: 3つ目、政府の中にいたのか、って……いたに決まってない？
    tone: 疑問
  - 語り: それは、あとで出します。約束が2つ。事実と想像は分けます。想像のあいだは《ここから想像》の札を出し、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background:
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
  - 聞き: 研究者は、この「もしも」を論じてないの？
    tone: 疑問
  - 語り: 龍馬が近江屋で殺されなかった場合を、正面から論じた学術研究は、今回の調査では見つかりませんでした。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
  - 語り: もう一つ、最初に断ります。龍馬が維新で実際に何をしたのかは、研究者の間でも、見方が割れています。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    card:
      head: 最初の断り
      body: 龍馬の役割は研究で割れる
  - 聞き: 龍馬が主役じゃない、ってこと？ それで、何を材料に掘るの？ 全部、妄想にならない？
    tone: 疑問
  - 語り: 材料は、当時の人が実際に考えていた選択肢と、史料に残る動きだけです。龍馬の新政府の構想。薩摩の武力倒幕。慶喜の側の動き。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
  - 聞き: うん、本物の材料だけで考えるんだね。まず、どんな人か知りたいな。
- title: 土佐から長崎へ 海援隊と坂本龍馬
  background:
    image: paintings/ryoma_tosa_kuniezu_1837.jpg
    credit: 江戸の絵図師《天保国絵図 土佐国》1837年（国立公文書館蔵）
  year: 1836
  lines:
  - 語り: 坂本龍馬は、天保6年11月15日、西暦でいう1836年の1月3日、土佐に生まれました。命日と誕生日が、同じ日です。のちに土佐藩を出て、勝海舟のもとで、船を学びます。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 天保6年11月15日
      body: 土佐に生まれる（西暦1836年1月3日）
  - 聞き: 藩を飛び出して、船の勉強を始めたんだ。行動力、すごいなあ。
  - 語り: 龍馬は長崎に亀山社中をつくり、慶応3年の4月、土佐藩の外郭組織、海援隊の隊長になります。写真は、改称前の亀山社中です。
    background:
      image: paintings/ryoma_nagasaki_beato_panorama.jpg
      credit: F.ベアト《長崎の部分パノラマ》1867〜68年
    portrait:
      image: paintings/ryoma_kaientai_group.jpg
      caption: 亀山社中の集合写真（左から3人目が龍馬とされる、1867年1月ごろ。のち海援隊）
      age: false
    card:
      head: 慶応3年4月
      body: 海援隊の隊長に
    year: 1867
  - 聞き: 藩の兵を率いる人、ってわけじゃなかったんだね。兵も金も、持ってなかったってこと？
    tone: 疑問
  - 語り: そうです。兵も官位も持たず、後ろ盾は土佐藩の支援でした。約規は、海援隊の規則です。目的は、運輸と射利、投機と開拓、そして本藩の応援でした。射利は、利益を取る、という意味です。
    background:
      image: paintings/ryoma_nagasaki_beato_boats_river.jpg
      credit: F.ベアト《長崎の川の舟》1865年ごろ
    card:
      head: 海援隊約規
      body: 運輸・射利・投機・開拓
  - 聞き: 船の会社と、政治の顔、両方持ってたんだ。会社でいうと、社員はいるけど、株は持ってない社長、みたいな感じかな。
  - 語り: 4月23日、西暦の1867年5月26日。海援隊のいろは丸が、紀州藩の明光丸とぶつかって沈みます。160トンと、約880トン。画面は、現在の鞆の浦です。
    background:
      image: paintings/ryoma_tomonoura_masuya_modern.jpg
      credit: Saigen Jiro 鞆の浦の旧街並み・枡屋清右衛門宅（現在の写真、2020年）
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年4月23日
      body: いろは丸が沈む
    figure:
      type: bars
      title: 船の大きさ（トン）
      bars:
      - - いろは丸
        - 160
      - - 明光丸
        - 880
      labels:
      - 160トン
      - 約880トン
  - 聞き: あーし、いろは丸は名前しか知らなかったなあ。海の上の交渉だったの？
    tone: 疑問
  - 語り: 龍馬は、万国公法を持ち出して交渉し、賠償金は、請求した8万3千両余から、7万両に減って決まりました。
    background:
      image: paintings/ryoma_nagasaki_beato_street.jpg
      credit: F.ベアト《長崎の町通り》1863〜65年ごろ
    figure: null
  - 聞き: 5倍以上も大きい船に当てられて、それでも、ルールで勝負したんだ。剣じゃなくて、法律で戦う人だったんだね。……でも、薩長同盟は、龍馬が成立させたんでしょ？
    tone: 疑問
  - 語り: 薩摩と長州が手を結んだ薩長同盟で、龍馬は、長州の桂小五郎との会談に同席しました。画面は、現在の石碑です。
    background:
      image: paintings/ryoma_satcho_alliance_stone_modern.jpg
      credit: ぽかぶーぶー 薩長同盟所縁之地の石碑（現在の写真、2023年）
    card:
      head: 薩長同盟 1866年
      body: 龍馬は桂小五郎との会談に同席
  - 語り: ただ、決定的だったのは薩摩の小松帯刀だ、と書く歴史家もいます。
    portrait:
      image: paintings/ryoma_komatsu_tatewaki.jpg
      caption: 小松帯刀（1870年以前）
      age: false
    card:
      head: 決定的だったのは
      body: 小松帯刀、とも
  - 聞き: 龍馬の手柄って、盛られてる部分もあるってこと？
    tone: 疑問
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 語り: あります。のちの伝記や小説が、龍馬像を大きくした、とも言われます。だからこの回は、史料に残る龍馬の言動だけを材料にします。
    background:
      image: paintings/ryoma_tosa_hiroshige_bonito.jpg
      credit: 歌川広重《六十余州名所図会 土佐 海上松魚釣》1855年
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: この回の材料
      body: 史料に残る言動だけ
  - 聞き: 確かな材料だけで、線をたどるんだね。どこからたどるの？
    tone: 疑問
    hook: true
  - 語り: いちばん大きな分かれ目。大政奉還までです。
    hook: true
- title: 慶応3年 船中八策と大政奉還
  background:
    image: paintings/ryoma_ship_kanrin_maru_rough_seas.jpg
    credit: 宮本元道《咸臨丸の荒海》1861年ごろ
  year: 1867
  lines:
  - 語り: 慶応3年の6月。長崎から京都へ向かう土佐の船の中で、龍馬が、土佐藩の重臣の後藤象二郎に、8つの案を示した、と語られてきました。
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
    card:
      head: 船中八策
      body: 6月9日ごろ。日付は割れる
  - 語り: 船中八策です。絵は、同じ時代の洋式帆船、咸臨丸です。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 聞き: 8つの案、って、どんな中身なの？
    tone: 疑問
  - 語り: 政権を朝廷に返す。上下の議政所、つまり議会をつくる。人材を登用する。外交は公議で決める。新しい法典。海軍の拡張。親兵。貨幣を外国と釣り合わせる。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 船中八策の柱
      body: 政権を朝廷に返す・議会をつくる
  - 語り: ただし、この八策は、原本が見つかっていません。後藤や陸奥宗光の回想にも、長岡謙吉の日記にも記述が無く、文言は、明治以降の伝記で形づくられた、と研究は見ています。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
    card:
      head: 船中八策
      body: 原本は見つかっていない
  - 聞き: 原本が無いのに、あったことになってたの？ あんなに有名な話なのに。
    tone: 驚き
  - 語り: 日付も、6月9日と15日で割れます。この回では、語られてきた話として扱います。
  - 語り: では、大政奉還はどうか。10月3日、西暦の1867年10月29日。土佐藩主の山内容堂の名で、後藤象二郎らが、幕府の老中、板倉勝静に建白書を出します。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    portrait:
      image: paintings/yoshinobu_yamauchi_yodo.jpg
      caption: 山内容堂（幕末）
      age: false
    card:
      head: 慶応3年10月3日
      body: 土佐藩が大政奉還を建白
  - 聞き: 龍馬が考えた案を、土佐藩が出した、って流れでしょ？
    tone: 疑問
  - 語り: 通説は、そうです。ただ、研究は割れています。知野文哉さんは、龍馬が後藤に建言した可能性は高い、とみます。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    portrait: null
  - 聞き: 割れてるってことは、反対の見方もあるんだ。
    tone: 疑問
  - 語り: 青山忠正さんは、龍馬が建白したことは、史料で論証されたことがない、と言います。
  - 聞き: 発案者は、決まってないんだ。じゃあ、はっきりしてるのは？
    tone: 疑問
  - 語り: 10月14日、西暦の1867年11月9日。慶喜が大政奉還の上表を出し、翌日、朝廷が許します。前日には、約40藩の重臣、およそ50人が、二条城に集まっていました。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
    portrait:
      image: paintings/yoshinobu_portrait_shogun.jpg
      caption: 徳川慶喜（将軍時代）
      age: false
    card:
      head: 慶応3年10月14日
      body: 慶喜が大政奉還の上表を出す
  - 聞き: 戦わずに、政権を返したんだ。これで、一件落着？
    tone: 疑問
  - 語り: ところが、薩摩には13日付、長州には14日付で、討幕の密勅が出ていました。偽の勅書だった疑いが濃い、といわれます。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    portrait:
      image: paintings/ryoma_doc_tobaku_micchoku_1867.jpg
      caption: 討幕の密勅（毛利家蔵、慶応3年10月14日付）
      age: false
    card:
      head: 10月13日・14日付
      body: 薩長に討幕の密勅も出る
  - 語り: 薩摩3,000、長州2,500の兵を動かす計画があった、と佐々木克さんは述べます。計画の数で、実際に動いた数ではありません。
    figure:
      type: bars
      title: 密勅を名分にした動員計画（計画の数）
      bars:
      - - 薩摩藩
        - 3000
      - - 長州藩
        - 2500
      labels:
      - 3,000
      - 2,500
  - 聞き: 計画の数、ね。龍馬は、そのあいだで、何をしてたの？
    tone: 疑問
    figure: null
    hook: true
  - 語り: 龍馬は、そのあいだに、新しい政府の中身も考えていました。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    hook: true
- title: 龍馬が考えた新政府 職制案・福井行き・綱領八策
  background:
    image: paintings/nene_kyoto_map_1696.jpg
    credit: 《京都の地図》元禄9年（1696年）
  year: 1867
  lines:
  - 語り: 10月中旬ごろ、龍馬は、職制案という人事の案を作った、と伝わります。相棒は、三条家に仕えた戸田雅楽、のちの尾崎三良です。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 職制案
      body: 10月中旬ごろ。日付は不明
    short: s4
  - 聞き: 新しい政府の、人事案……。龍馬が、役人を決めるリストを作ってたの？
    tone: 疑問
  - 語り: 尾崎の回想の版では、関白に三条実美、内大臣に徳川慶喜。議奏には山内容堂や松平春嶽ら。参議には、西郷や大久保、木戸、後藤、福井藩の三岡八郎らが並びます。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    portrait:
      image: paintings/ryoma_sanjo_sanetomi.jpg
      caption: 三条実美（晩年）
      age: false
    card:
      head: 職制案の顔ぶれ
      body: 関白に三条、内大臣に慶喜
    short: s4
  - 聞き: 慶喜まで入ってる！ 薩長だけの政府じゃなくて、みんなで、って案なんだ。
    tone: 驚き
  - 語り: ただし、慶喜がこの案を知っていたかは、確かめられていません。原史料の所在も不明で、尾崎の回想や、のちの伝記に、版が分かれて伝わっています。
    background:
      image: paintings/ryoma_kyoto_arashiyama_hiroshige.jpg
      credit: 歌川広重《六十余州名所図会 山城 嵐山渡月橋》1853年
    portrait: null
    card:
      head: 原史料の所在
      body: 分かっていない
  - 聞き: 版が分かれてるって、中身が違うバージョンがあるの？
    tone: 疑問
    short: s4
  - 語り: あるのです。尾崎の一部の版には、参議に「坂本」の名が入っています。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    short: s4
  - 語り: ところが、坂崎紫瀾が編んだ『海援隊始末』では、龍馬の名も慶喜の名も外れている。初稿の写本では、「阪本」の字が朱で見消されています。
    card:
      head: 龍馬の名
      body: 版によって入る・外れる
    short: s4
  - 聞き: 自分で作った人事案から、自分の名前が消えてる……。誰が、いつ消したの？
  - 語り: 消した人も時期も、分かっていません。ここで語られるのが、西郷の話です。名の無いのを訝しんだ西郷に、役人嫌いの龍馬は、「世界の海援隊」をやる、と答えたそうです。
    background:
      image: paintings/ryoma_satsuma_hiroshige_bonoura.jpg
      credit: 歌川広重《六十余州名所図会 薩摩 坊ノ浦 双剣石》1856年
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 語り: ただし、この話が本に見えるのは、龍馬の死の47年後、1914年の本です。裏付けは弱く、説として聞いてください。
    card:
      head: 「世界の海援隊」
      body: 説。初出は1914年
  - 聞き: 本当なら、龍馬は最初から、政府の外に出るつもりだった、ってことだよね。でも、説なんだ。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 語り: もう一つ、龍馬は財政も考えました。10月24日、西暦の1867年11月19日に、京都を出て福井へ向かいます。謹慎中の三岡八郎と、新政府の財政を話し合った、と伝わります。
    background:
      image: paintings/ryoma_kyoto_arashiyama_hiroshige.jpg
      credit: 歌川広重《六十余州名所図会 山城 嵐山渡月橋》1853年
    portrait: null
    card:
      head: 慶応3年10月24日
      body: 福井へ。三岡八郎に会う
    figure:
      type: map
      title: 龍馬の福井行き
      bounds:
      - 135.0
      - 137.4
      - 34.2
      - 36.6
      places:
      - - 京都
        - 135.77
        - 35.01
      - - 福井
        - 136.22
        - 36.06
      - - 大坂
        - 135.52
        - 34.69
      route:
      - 京都
      - 福井
      note: 10月24日に出発し、11月5日に戻る
  - 語り: 三岡は、福井藩で藩札を出して成功した人です。紙幣の発行を提案した、という話です。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    portrait: null
    figure: null
  - 聞き: 刀や兵より先に、お金の設計を考えてたんだ。それで、龍馬の自筆は残ってないの？
    tone: 疑問
  - 語り: 残っています。福井から戻ったあとの11月に書いた、新政府綱領八策。自筆が2枚、いまも残っています。画面は、約1年前に姉へ書いた手紙です。
    background:
      image: paintings/ryoma_doc_letter_1867.jpg
      credit: 坂本龍馬 姉・乙女宛の手紙 1867年1月（京都国立博物館蔵）
    card:
      head: 新政府綱領八策
      body: 11月。自筆が2枚残る
  - 語り: 署名は、実名の直柔です。手紙は、慶応2年12月のものです。
  - 聞き: 署名が本名だと、ほんとに龍馬が書いたって感じがするね。
  - 語り: 「自ら盟主となり」の主語が、伏せ字になっています。誰かは、慶喜、容堂、春嶽などの説があり、定説はありません。人名の名簿も、ありません。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
    card:
      head: 伏せ字の主語
      body: ○○○は定説なし
  - 聞き: 似た名前の文書が3つもあって、ごちゃごちゃするなあ。船中八策は原本なし、職制案は人事の案、綱領八策は自筆で名簿なし、か。……ところで、龍馬が京都に戻ったのは、いつ？
    tone: 疑問
    hook: true
  - 語り: 11月5日、西暦の11月30日。運命の夜まで、あと10日でした。
    card:
      head: 慶応3年11月5日
      body: 京都に戻る。事件まで10日
    hook: true
- title: 11月15日の夜 近江屋の二階
  background:
    image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
    credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
  year: 1867
  lines:
  - 語り: 話を、慶応3年11月15日に戻します。福井から戻った龍馬は、風邪をひいて、近江屋の二階に移っていました。用心のために、山田藤吉が雇われていたそうです。
    short: s2
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 11月中旬
      body: 風邪で近江屋の二階に
  - 聞き: 風邪で、寝込んでたんだ。守りは、その藤吉さん一人だけ？
    tone: 疑問
  - 語り: 薩摩の吉井幸輔は、薩摩藩邸に避難するよう勧めました。御陵衛士の伊東甲子太郎が、新選組と見廻組が狙っている、と告げたとも伝わります。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    portrait:
      image: paintings/ryoma_yoshii_tomozane.jpg
      caption: 吉井友実（幸輔、晩年の姿）
      age: false
    card:
      head: 薩摩藩邸への避難
      body: 吉井幸輔が勧めた
    short: s2
  - 聞き: 逃げて、って言われてたんだ……。
    tone: しみじみ
    short: s2
  - 語り: 記録では、龍馬は、薩摩藩邸には移りませんでした。11月15日の夜、午後9時ごろ。近江屋で、龍馬と、訪ねていた中岡慎太郎が襲われます。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年11月15日
      body: 近江屋事件。龍馬は夜に没
    short: s2
  - 語り: 龍馬は、その夜のうちに亡くなりました。満31歳でした。中岡は土佐出身の同志で、陸援隊の隊長です。陸援隊は、中岡が京都で率いた隊です。
    portrait:
      image: paintings/ryoma_nakaoka_shintaro.jpg
