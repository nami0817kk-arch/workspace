        - 有力
        - 今井信郎の口上書
      - - 新選組説
        - 説
        - 中岡の推測など
      - - 紀州藩の報復説
        - 説
        - いろは丸の恨み
      upto: 1
  - 聞き: ほぼ決まりじゃないの？ 本人が話してるんでしょ？
    tone: 疑問
  - 語り: そこが難しいのです。今井の話は、誇張だとする見方があり、菊地明さんは、生きている人をかばう嘘だった可能性を挙げます。元見廻組の渡辺篤の系図とは、人数も鞘の持ち主も食い違います。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    card:
      head: 見廻組説
      body: 有力だが、断定はできない
    figure:
      type: stats
      title: 近江屋事件の主な説（その1）
      items:
      - - 見廻組説
        - 有力
        - 今井信郎の口上書
      - - 新選組説
        - 説
        - 中岡の推測など
      - - 紀州藩の報復説
        - 説
        - いろは丸の恨み
