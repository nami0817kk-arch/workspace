- title: 想像② 12月9日の政変は止まったか 辞官納地と取引
  background:
    image: paintings/yoshinobu_kimbei_mikado_garden.jpg
    credit: 日下部金兵衛 京都御所（1890年ごろ）
  year: 1868
  lines:
  - 語り: 旧暦12月9日、西暦の1868年1月3日の朝。薩摩や土佐など5つの藩の兵が、御所の九門を固めます。
    portrait: null
    card:
      head: 1868年1月3日
      body: 王政復古の大号令
  - 語り: 二条斉敬ら、親幕府の公家は、参内を止められました。
  - 聞き: 5つの藩が御所を固めたんだよね。ここに龍馬がいたら、止められたのかな？
    tone: 疑問
  - 語り: 政変を止められたかを論じた研究は、見つかっていません。材料を見ます。薩摩は、密勅を名分に、兵3,000の動員を計画していました。
    background:
      image: paintings/ryoma_satsuma_hiroshige_bonoura.jpg
      credit: 歌川広重《六十余州名所図会 薩摩 坊ノ浦 双剣石》1856年
  - 語り: 旧暦の11月29日、いまの暦で12月24日には、島津茂久が藩兵を率いて上洛しています。
    card:
      head: 旧11月29日（12月24日）
      body: 島津茂久が上洛
    year: 1867
  - 聞き: 兵は、もう動いてたんだ。3,000人の計画って、かなり本気じゃん。
  - 語り: 大久保と西郷は、武力倒幕で藩論をまとめ、12月9日へ進みました。龍馬が薩摩藩邸にいても、この流れは止まりません。可能性は、ありうる、です。
    portrait:
      image: paintings/yoshinobu_okubo_toshimichi.jpg
      caption: 大久保利通（1872年）
      age: false
    card:
      head: ありうる
      body: 政変そのものは止まらない
    year: 1868
  - 聞き: 止められないなら、龍馬がいても意味ない？
    tone: 疑問
    portrait: null
  - 語り: 変えられるとすれば、政変の中身です。政変の日の御所の会議、小御所会議で、辞官納地が決まりました。慶喜に、官職と領地を返させる決定です。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    figure: null
  - 語り: 要求は400万石で、春嶽らの働きかけで、200万石の半納になりました。
