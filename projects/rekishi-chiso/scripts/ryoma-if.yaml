sections:
- title: 1867年12月10日の夜 王政復古の24日前
  background:
    image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
    credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
  year: 1867
  lines:
  - 語り: 坂本龍馬が近江屋で襲われ、亡くなったのは、慶応3年11月15日。王政復古の大号令が出る、わずか24日前でした。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 慶応3年11月15日
      body: 近江屋で襲われる（12月10日）
    short: s1
  - 聞き: 24日前……。ほんとに、ぎりぎりだ。龍馬って、新しい政府を作る側の人だったよね？
    tone: 驚き
    short: s1
  - 語り: 大政奉還から31日。誕生日と同じ11月15日で、満31歳でした。
    figure:
      type: stats
      title: 龍馬の死と、そのあとの日数
      items:
      - - 大政奉還から
        - 31日
        - 近江屋の夜まで
      - - 近江屋の夜から
        - 24日
        - 王政復古まで
      - - 近江屋の夜から
        - 48日
        - 鳥羽・伏見まで
      upto: 1
    short: s1
  - 語り: そこから24日後に王政復古、48日後に、鳥羽・伏見の戦いが始まります。
    figure:
      type: stats
      title: 龍馬の死と、そのあとの日数
      items:
      - - 大政奉還から
        - 31日
        - 近江屋の夜まで
      - - 近江屋の夜から
        - 24日
        - 王政復古まで
      - - 近江屋の夜から
        - 48日
        - 鳥羽・伏見まで
    short: s1
  - 語り: 龍馬が、もしあの夜を越えていたら。今日は、その先を掘ります。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
    short: s1
  - 聞き: 歴史に「もしも」はない、ってよく言うけど……龍馬が生きてたら、って、誰でも一回は考えるよね。ちゃんと掘れるの？
    tone: 疑問
    short: s1
  - 語り: 掘れます。問いは3つ。12月9日の政変は、止められたのか。戊辰戦争は、起きなかったのか。龍馬は、どこにいたのか。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1848.jpg
      credit: 歌川広重《東海道五十三次 京 三条大はし》1848年ごろ
    card:
      head: 今日の3つの問い
      body: 政変は？ 戊辰戦争は？ 龍馬は？
    figure: null
  - 聞き: 3つ目の「どこにいたのか」って、新しい政府の中、じゃないの？
    tone: 疑問
  - 語り: それは、あとで出します。先に、約束が2つ。事実と想像は分ける。想像のあいだは《ここから想像》の札を出して、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background:
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
  - 聞き: 研究者は、この「もしも」を論じてないの？
    tone: 疑問
  - 語り: 龍馬が近江屋で殺されなかった場合を、正面から論じた学術研究は、今回の調査では、見つかりませんでした。
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
  - 語り: もう一つ、最初に断ります。龍馬が維新で実際に何をしたのかは、研究者の間でも、見方が割れています。
    background:
      image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ
    card:
      head: 最初の断り
      body: 龍馬の役割は研究で割れる
  - 聞き: 龍馬が主役じゃない、ってこと？ それで、何を材料に掘るの？ 全部、妄想にならない？
    tone: 疑問
  - 語り: 材料は、当時の人が実際に考えていた選択肢だけです。龍馬が書いた新政府の構想。薩摩の武力倒幕。慶喜の側の動き。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
      credit: 二代歌川広重《諸国名所百景 京都四条夕涼み》1860年ごろ
  - 聞き: つまり、龍馬が実際に書いたものと、実際に動いた線だけで考えるんだね。材料が本物なら、安心して妄想できる。まず、龍馬がどんな人だったのかから、掘ろう。
- title: 土佐から長崎へ 海援隊と坂本龍馬
  background:
    image: paintings/ryoma_tosa_kuniezu_1837.jpg
    credit: 江戸の絵図師《天保国絵図 土佐国》1837年（国立公文書館蔵）
  year: 1836
  lines:
  - 語り: 坂本龍馬は、1836年の1月3日、土佐に生まれました。のちに土佐藩を出て、勝海舟の神戸海軍操練所で、船を学びます。
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
    card:
      head: 1836年1月3日
      body: 土佐に生まれる
  - 聞き: 藩を飛び出して、船の勉強を始めたんだ。行動力、すごいなあ。
  - 語り: 神戸海軍操練所は、1864年5月に発足し、1865年3月に廃止されました。1年足らずの学校です。画面は、現在の跡地の碑です。
    background:
      image: paintings/ryoma_kobe_navy_school_monument_modern.jpg
      credit: Saigen Jiro 神戸海軍操練所跡の碑（現在の写真、2020年）
