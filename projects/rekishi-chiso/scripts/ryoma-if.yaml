        - 200
      labels:
      - 400万石
      - 200万石
  - 聞き: 半分にまけてもらった、ってことだね。春嶽たちのおかげで。小御所会議、名前は聞いたことあるけど、その日のうちに決まっちゃったのか。
  - 語り: 想像劇場、第2幕です。旧暦12月8日の夜、京都の土佐藩邸。辞官納地が決まる前の晩に、龍馬が、後藤象二郎を訪ねます。この幕の可能性は、ほぼ妄想、です。
    background:
      image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg
      credit: 竹原好兵衛《文久改正新撰都之図》1864年（フランス国立図書館蔵）
    card:
      head: 想像劇場 第2幕
      body: ほぼ妄想・12月8日 土佐藩邸
    figure: null
  - 人物: 「龍馬、明日は朝から御所が固められる。薩摩も岩倉卿も、もう後には引かん。容堂公は、慶喜公を会議に入れよと言うちょるがの」
    who: 後藤想像
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
  - 人物: 「後藤さん、慶喜公を外してはいかん。納地の額は、会議の前に決めておかんといかん。慶喜公が自分から出す形にすればええ」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「それは取引じゃな。じゃが、慶喜公が、うんと言うか」
    who: 後藤想像
    portrait:
      image: paintings/yoshinobu_goto_shojiro_1866.png
      caption: 後藤象二郎（後から彩色、1866年ごろ）
      age: false
  - 人物: 「慶喜公の顔も立つ。薩摩も呑める。それが、取引じゃ」
    who: 龍馬想像
    background:
      image: paintings/ryoma_tosa_kuniezu_1837.jpg
      credit: 江戸の絵図師《天保国絵図 土佐国》1837年（国立公文書館蔵）
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「永井様を通して、話してみる。頼んだぜよ」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 聞き: 全部取り上げるんじゃなくて、取引にして、顔も立てるのか。龍馬らしいかも。
    portrait: null
  - 語り: 似た見立てを書く人がいます。評論家の八幡和郎さんは、龍馬が生きていれば、慶喜が新政府の財源として100万石以上を出す取引をまとめたかもしれない、と書きます。
    background:
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
  - 語り: 史料名は示されていません。ここまでは、書き手の見立てです。想像に戻ります。龍馬の案は、実際の半納へ向かう流れの一つにすぎません。
    background:
      image: paintings/yoshinobu_kimbei_nijo_castle.jpg
      credit: 日下部金兵衛《二条城》1890年ごろ（明治の写真）
  - 語り: 慶喜がそれを呑んだ記録も、龍馬が慶喜に会った記録も、見つかっていません。可能性は、ほぼ妄想、です。
    card:
      head: ほぼ妄想
      body: 龍馬が慶喜を動かす
  - 聞き: 慶喜と龍馬は、会ったこともないかもしれないんだ。永井を通す線も、出どころは一人の評論家だけ、だったよね。
    hook: true
  - 語り: では、その先の戦争は、避けられたのでしょうか。
    background:
      image: paintings/yoshinobu_kaiyo_maru_konb_4519.jpg
      credit: 開陽丸の石版画（1866年）
    hook: true
- title: 想像③ 12月13日の薩摩藩邸 戊辰戦争は起きたか
  background:
    image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
    credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
  year: 1868
  lines:
  - 語り: 史実では、旧暦の12月13日、西暦では年が明けて1月7日に、岩倉と西郷が妥協案を示します。
    portrait:
      image: paintings/yoshinobu_iwakura_tomomi.jpg
      caption: 岩倉具視
      age: false
    card:
      head: 12月13日（西暦1月7日）
      body: 慶喜を議定に迎える妥協案
    short: s5
  - 語り: 辞官納地に応じれば、慶喜を議定に任じ、前内大臣の待遇を認める、という案です。
  - 聞き: 慶喜も、新政府に入れる道があったんだ。
  - 語り: 想像劇場、第3幕です。旧暦12月13日、薩摩藩邸。龍馬は、西郷隆盛と向き合います。この幕の可能性は、ほぼ妄想、です。
    background:
      image: paintings/ryoma_satsuma_hiroshige2_sakurajima.jpg
      credit: 二代歌川広重《諸国六十八景 大隅 桜島》1862年
    portrait: null
    card:
      head: 想像劇場 第3幕
      body: ほぼ妄想・12月13日 薩摩藩邸
  - 人物: 「龍馬どん。岩倉卿と、慶喜公を議定に迎える案を出した。辞官納地に応じれば、じゃ」
    who: 西郷想像
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 人物: 「西郷さん、約束は文にしてくれ。口だけでは、慶喜公の兵が信じん」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「考えておきもす。ただし、慶喜公の兵が動かぬ間は、じゃ」
    who: 西郷想像
    background:
      image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
      credit: 《二条城の隅櫓と石垣》1902年以前（明治の写真）
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 人物: 「江戸のことは、わしの手が届かん。せめて、そこだけは頼む」
    who: 龍馬想像
    portrait:
      image: paintings/ryoma_portrait_standing_ueno.jpg
      caption: 坂本龍馬（立像、上野彦馬撮影とされる、1866〜67年ごろ）
      age: false
  - 人物: 「頼みごとの多い男じゃ。文にすれば、動かせるとでも思うちょるのか」
    who: 西郷想像
    portrait:
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 聞き: 約束を文にする、って、やっぱり商売人っぽい。……でも、これで戦は避けられるの？
    tone: 疑問
    portrait: null
  - 語り: 旧暦12月25日、江戸で薩摩藩邸が焼き討ちされます。28日に報せが大坂に届くと、「薩摩を討つべし」の声が一気に高まりました。
    background:
      image: paintings/yoshinobu_beato_yedo_inner_moat.jpg
      credit: F.ベアト 江戸城の内濠（1863〜73年）
    card:
      head: 12月25日（西暦1月19日）
      body: 江戸の薩摩藩邸を焼き討ち
    short: s5
  - 語り: 想像です。龍馬が京都にいても、江戸の焼き討ちは止められません。大坂の兵が上京する流れも、変わりません。
    background:
      image: paintings/yoshinobu_toba_koedabashi.jpg
      credit: 小枝橋の写真（鳥羽、1867年）
    short: s5
  - 語り: 鳥羽・伏見の戦いは、近江屋の夜から48日目に、起きます。可能性は、ありうる、です。
    card:
      head: ありうる
      body: 鳥羽・伏見は起きる
    short: s5
  - 聞き: 48日って、数えるとあっという間だ。……龍馬一人じゃ、戦争の流れは変えられないの？ 海援隊は？
    tone: 疑問
  - 語り: 海援隊は、土佐藩の外郭組織です。兵も官位も持たず、後ろ盾は土佐藩の支援でした。人数は、今回の調査では見つかっていません。
    background:
      image: paintings/ryoma_nagasaki_hiroshige2_ships.jpg
      credit: 二代歌川広重《諸国名所百景 肥前長崎唐船の津》1860年ごろ
    portrait:
      image: paintings/ryoma_kaientai_group.jpg
      caption: 亀山社中の集合写真（左から3人目が龍馬とされる、1867年1月ごろ。のち海援隊）
      age: false
    card:
      head: 海援隊
      body: 兵も官位も持たない
    short: s5
  - 聞き: 船と商いの会社だったんだもんね。軍隊の代わりにはならないか。
  - 語り: 戊辰戦争が避けられたかを論じた研究も、見つかっていません。
    background:
      image: paintings/yoshinobu_kaiyo_maru_konb_4519.jpg
      credit: 開陽丸の石版画（1866年）
    portrait: null
  - 語り: 歴史家の加来耕三さんは、龍馬が目指したのは、徳川中心でも薩長中心でもない、第三の道だった、と書きます。東日本には徳川を支持する藩が多い、とも言います。
  - 聞き: 第三の道が開けば、戦争は起きなかったかもしれない、ってこと？
    tone: 疑問
  - 語り: ただし加来さんは、龍馬の功績は過大評価で、歴史学の見解としては、日本史にさほど影響しなかった、とも書いています。
    background:
      image: paintings/yoshinobu_tokugawa_warships_shinagawa.png
      credit: 小杉雅之進 幕府軍艦八隻の品川沖出帆の図（1868年）
    card:
      head: 歴史学の見方
      body: 影響は大きくなかった、とも
  - 語り: 生きていたら歴史が変わった、という見方は、研究者が支持しない可能性が高いものです。戊辰戦争が起きない世界は、可能性は、ほぼ妄想、です。材料は人の評価だけで、事実の足場がありません。
    background:
      image: paintings/yoshinobu_toba_aizu_fushimi.jpg
      credit: 会津藩兵、伏見に上陸（1868年1月）
    card:
      head: ほぼ妄想
      body: 戊辰戦争が起きない世界
