  - 聞き: 本人の証言が、いちばん怪しいなんて。……そういえば、新選組が犯人、っていう話も聞くけど、そっちは？
    tone: 疑問
  - 語り: ふたつ目は、新選組説です。中岡が、新選組だと言ったと伝わり、土佐の寺村左膳の日記や、大久保利通の書状にも、新選組を疑う記述があります。近藤勇は、否定しています。
    background:
      image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg
