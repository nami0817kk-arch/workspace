terms:
  同朋衆: 主君のそばで雑用や芸能を務めた人
  笄: 髪を整えるために刀の鞘に差す、細い金具
  赤母衣衆: 信長の親衛隊の精鋭。赤い母衣を背負った
  母衣: 武士が背に負う、風をはらんでふくらむ布
  与力: 有力な武将の下に付けられ、戦に従う武士
  傅役: 幼い主君の養育係・後見人
  五大老: 秀吉が死後の政治を任せた、有力な大名5人
  誓紙: 約束を神仏に誓って書いた文書
  石高: 領地の大きさを、米の収穫量で表したもの
  山崎の戦い: 本能寺の変のあと、秀吉が明智光秀を破った戦い

