sections:
  # ---------------------------------------------------------------- 1 導入
  - title: 1599年 大坂での死と、百万石の問い
    background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
    portrait: {image: paintings/toshiie_portrait_toshiie_png.jpg, caption: "前田利家の肖像（後世の肖像画）", age: false}
    year: 1599
    lines:
      - 語り: 慶長4年閏3月3日。前田利家が、大坂の屋敷で亡くなります。秀吉の死から約8か月。関ヶ原の約1年半前でした。
        card: {head: 慶長4年閏3月3日, body: 前田利家が大坂の自邸で亡くなる}
        tone: 重い
        short: s1
      - 聞き: 関ヶ原の前に、亡くなってたんだ。でも利家って、「加賀百万石の祖」と呼ばれる人だよね？
        figure: {type: numberline, title: 秀吉の死から関ヶ原まで, items: [[秀吉の死, 1598], [利家の死, 1599], [関ヶ原の戦い, 1600]], unit: 年, focus: 利家の死, note: 利家は関ヶ原の約1年半前に没}
        tone: 疑問
        short: s1
      - 語り: そう呼ばれます。けれど、利家が生きている間の前田家の石高は、いちばん多いときで、83万石余。百万石には、届いていません。
        figure: null
        card: {head: 文禄4年, body: 前田家の石高は生涯で最大の83万石余}
        short: s1
      - 聞き: え、百万石じゃなかったの？ じゃあ、百万石になったのは、いつなの？
        tone: 驚き
        short: s1
      - 語り: 関ヶ原のあと、息子の利長の代です。「加賀百万石の祖」は、あとから付いた呼び名なのです。画面は、現在の金沢城です。
        background: {image: paintings/toshiie_photo_kanazawa_castle_14.jpg, credit: "金沢城の石川門（現在の写真、撮影 Balon Greyjoy、CC0）"}
        short: s1
      - 語り: 利家の話は、《三つの層》でできています。同じ時代の文書、前田家が残した記録、江戸時代の逸話集。今日は、確かめられることと、後の話を分けて、掘ります。
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        card: {head: 三つの層, body: 同時代の文書・前田家の記録・江戸の逸話集}
      - 聞き: 浪人とか、退却とか、秀頼の後見人とか、聞いたことはあるよ。まずは、生まれから見ていくんだ。

  # ---------------------------------------------------------------- 2 生まれと小姓
  - title: 1539年 荒子に生まれ、信長の小姓になった「槍の又左」
    background: {image: paintings/toshiie_owari_atsuta_zue.jpg, credit: "岡田啓・野口道直『尾張名所図会』熱田大宮全図（1880年刊）"}
    year: 1539
    lines:
      - 語り: 利家は、尾張の荒子で生まれました。いまの名古屋市中川区です。荒子城主、前田利春の四男。幼い名は、犬千代。前田家側の記録では、天文7年の12月です。
        card: {head: 天文7年12月, body: 尾張の荒子に生まれる（生年は割れる）}
      - 聞き: 四男かあ。家を継ぐ立場じゃなかった、ってことだよね。
      - 語り: 生まれた年は、割れています。天文5年、6年とする説もあり、秀吉と同い年だった、という説も出ています。だから、この回では、年齢は言いません。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
      - 聞き: 秀吉と同い年なら、ちょっと面白いね。ふたりとも、足軽と四男から、天下の中心まで行くんだ。
      - 語り: 天文20年、利家は織田信長に仕えます。小姓です。元服して、孫四郎利家と名乗りました。
        year: 1551
        portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
        card: {head: 天文20年, body: 織田信長に小姓として仕える}
      - 語り: 若いころの利家は、短気で喧嘩っ早い、派手な身なりのかぶき者だった、と伝わります。長さ三間半、約6メートルの槍を持ち歩き、人々は避けた、と前田家の逸話にあります。
        portrait: null
        background: {image: paintings/nobunaga_anegawa_screen.jpg, credit: "姉川合戦図屏風（部分、江戸時代）"}
        card: {head: 前田家の逸話, body: 三間半柄（約6メートル）の槍を持ち歩く}
      - 聞き: 6メートルって、大型バスの半分くらいあるじゃん。持ち歩くの、大変そう。
      - 語り: 初陣は、天文21年の萱津の戦いです。目立つように朱色に塗った槍を持ち、首を1つ挙げた、と言われます。
        year: 1552
        card: {head: 天文21年, body: 萱津の戦いで初陣 首を1つ挙げる}
      - 聞き: 初陣から、派手に目立つ槍だったんだ。若いころの利家、けっこう、目立ちたがりだったのかな。
      - 語り: 長さも色も逸話ですが、槍の名手として知られたのは確かです。弘治2年の稲生の戦いでは、顔に矢を受けながら、敵将を討ち取った、といいます。
        background: {image: paintings/hanbei_gifu_castle_ezu.jpg, credit: "《岐阜城絵図》（江戸時代）"}
        year: 1556
        card: {head: 弘治2年, body: 稲生の戦い 顔に矢を受けても敵将を討つ}
      - 聞き: 顔に矢が刺さったまま戦ったの！？ 痛くないのかな。
        tone: 驚き
      - 語り: 「槍の又左」と呼ばれるようになったのは、永禄元年の浮野の戦いのころから、といいます。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        card: {head: 永禄元年, body: 浮野の戦いのころから「槍の又左」と呼ばれる}
      - 語り: 同じ年、又左衛門と名を改め、永禄のはじめごろ、信長の親衛隊の精鋭、赤母衣衆の筆頭に抜擢されました。
        year: 1558
        card: {head: 永禄のはじめ, body: 赤母衣衆の筆頭に抜擢される}
      - 語り: 同じ年、従妹のまつを妻にします。のちの芳春院です。
        background: {image: paintings/toshiie_owari_atsuta_zue.jpg, credit: "岡田啓・野口道直『尾張名所図会』熱田大宮全図（1880年刊）"}
        portrait: {image: paintings/toshiie_portrait_matsu_hoshunin_1892.jpg, caption: "芳春院（まつ）の肖像（1892年の模写）", age: false}
      - 聞き: 槍の名手で、エリートの親衛隊で、結婚もして。順調じゃん。
        portrait: null
      - 語り: その翌年、順調だった道が、突然、途切れます。
        hook: true
      - 聞き: え、何があったの？
        hook: true

  # ---------------------------------------------------------------- 3 笄斬りと浪人
  - title: 1559年 笄斬りで浪人になり、無断の桶狭間で帰参を目指す
    background: {image: paintings/hanbei_gifu_castle_zu.jpg, credit: "《岐阜城図》（江戸時代）"}
    year: 1559
    lines:
      - 語り: 永禄2年。利家は、信長のお気に入りだった同朋衆、拾阿弥を斬り殺して、織田家から出奔します。のちに、笄斬りと呼ばれる事件です。
        card: {head: 永禄2年, body: 拾阿弥を斬り、織田家から出奔する}
        short: s2
      - 聞き: 主君のお気に入りを、斬っちゃったの？ 普通は、死刑じゃない？
        tone: 疑問
        short: s2
      - 語り: 本来なら死罪のところ、柴田勝家や森可成らの取りなしで、出仕停止になります。侍のお役目を取り上げられた、浪人です。
        card: {head: 出仕停止, body: 柴田勝家・森可成の取りなしで死罪を免れる}
        short: s2
      - 語り: きっかけは、笄を盗まれたことだ、という話があります。ただ、これは逸話の形で、事件の細かい経緯は、確かめられません。
        short: s2
      - 聞き: 笄って、刀についてる小さな道具だよね。そんなことで、って思うけど、当時は面子が大事だったのかな。
        short: s2
      - 語り: 浪人のあいだ、利家は、熱田神宮の社家、松岡家のもとに身を寄せた、と言われます。
        background: {image: paintings/toshiie_owari_atsuta_zue.jpg, credit: "岡田啓・野口道直『尾張名所図会』熱田大宮全図（1880年刊）"}
      - 聞き: 収入も、主君も、なくなったんだよね。きつそう。
      - 語り: この浪人で、利家は金の大切さを知った、とされます。金があれば世間は恐ろしくないが、貧しいと恐ろしい。そういう趣旨のことを、よく口にしたそうです。
        card: {head: 金の大切さ, body: 浪人の2年で知った、と伝わる}
      - 聞き: じゃあ、大名になってからも、お金には細かかったのかな。
      - 語り: 実際、利家は家の決済を自分で行い、愛用の算盤は、家宝として残っています。
        figure: {type: stats, title: 浪人から帰参まで, items: [[浪人の期間, 約2年, 笄斬りから帰参まで], [桶狭間で挙げた首, 3つ, 朝の合戦で1・本戦で2], [帰参の加増, 300貫, 450貫文になる]]}
      - 語り: 永禄3年。出仕を止められていた利家は、信長に無断で、桶狭間の戦いに加わった、と伝わります。首を3つ挙げましたが、帰参は許されませんでした。
        year: 1560
        figure: null
        background: {image: paintings/nobunaga_okehazama_toyonobu.jpg, credit: "歌川豊宣《尾州桶狭間合戦》1882年"}
        card: {head: 永禄3年, body: 無断で桶狭間に参戦 首3つ 帰参は許されず}
      - 聞き: 無断で出陣！？ 追い出されてるのに、勝手に戦いに行ったの？ すごい根性。
        tone: 驚き
      - 語り: 翌年の森部の戦いにも、無断で加わった、と言われます。斎藤方の足立六兵衛らの首を挙げ、信長が戦功を認めて、帰参を許しました。300貫を加増されて、450貫文になった、とされます。
        year: 1561
        background: {image: paintings/hanbei_gifu_castle_ezu.jpg, credit: "《岐阜城絵図》（江戸時代）"}
        card: {head: 永禄4年, body: 森部の戦いの功で帰参 450貫文に}
      - 聞き: 2年かけて、戦場の手柄で、許してもらったのか。実力で、居場所を取り戻したわけか。
      - 語り: それから8年後の永禄12年。信長は、利家に、さらに大きな役目を命じます。まず、兄の家督についてです。
        hook: true
      - 聞き: 兄の家督？ お兄さんのものを、利家が？
        hook: true

  # ---------------------------------------------------------------- 4 府中と能登
  - title: 1569年 家督を継ぎ、越前府中と能登一国の主になる
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
    year: 1569
    lines:
      - 語り: 永禄12年。信長は、利家に、前田家の家督を継ぐよう命じます。長兄の利久に実子がなく、病弱で、武者働きが十分でない、というのが理由でした。『村井重頼覚書』の話です。
        card: {head: 永禄12年, body: 信長の命で、兄に代わり前田家を継ぐ}
      - 聞き: お兄さんから、弟に？ お兄さん、どう思ったんだろう。
      - 語り: そこは分かりません。ただ、利家は荒子の家を継いで、信長の戦に出続けます。元亀元年の金ヶ崎では、撤退する信長の護衛を務め、姉川の戦いでも、敵を討ち取りました。
        year: 1570
        background: {image: paintings/nobunaga_anegawa_screen.jpg, credit: "姉川合戦図屏風（部分、江戸時代）"}
        card: {head: 元亀元年, body: 金ヶ崎で信長の護衛 姉川で敵を討つ}
      - 聞き: 金ヶ崎の撤退って、信長がいちばん危なかったときでしょ？ そこで護衛を任されるなんて、信頼されてたってことか。
      - 語り: 天正2年から、利家は柴田勝家の与力となり、越前の一向一揆を鎮める戦いに加わっています。鎮圧が激しかったことは、出土した瓦の刻字にも残っています。
        background: {image: paintings/toshiie_maruoka_castle_ndl224_trim.jpg, credit: "『日本古城絵図』越前丸岡城図の部分（江戸時代、国立国会図書館蔵）"}
        year: 1574
        card: {head: 柴田勝家の与力, body: 越前の一向一揆の鎮圧に加わる}
      - 聞き: 一揆の鎮圧で、柴田勝家の下について、北陸を任されたんだ。ここから、北陸との縁が始まるのか。
      - 語り: 天正3年の長篠の戦いでは、佐々成政らと並んで、鉄砲奉行を務めたことが確認されています。槍の名手が、鉄砲の部隊も受け持ったのです。
        year: 1575
        background: {image: paintings/nobunaga_nagashino_teppo_ashigaru.jpg, credit: "長篠合戦図屏風（部分、江戸時代）"}
        card: {head: 天正3年, body: 長篠の戦いで鉄砲奉行を務める}
      - 聞き: 槍の達人が、鉄砲奉行？ 時代の変わり目って感じだね。
      - 語り: 天正3年9月、越前の府中で、3万3000石。佐々成政、不破光治とともに、「府中三人衆」と呼ばれます。
        background: {image: paintings/toshiie_fukui_castle_ndl222_trim.jpg, credit: "『日本古城絵図』越前福井城図の部分（江戸時代、国立国会図書館蔵）"}
        card: {head: 天正3年9月, body: 越前府中で3万3000石 府中三人衆}
      - 語り: 三人衆の佐々成政と不破光治は、利家と同じ、柴田勝家の下で北陸を戦った仲間です。のちに利家は、成政と戦うことになります。
      - 語り: 石高は、領地の大きさを、米の収穫量で表したものです。1石が、大人1人の1年分の米。3万3000石なら、約3万3000人が1年食べられる米です。
        background: {image: paintings/toshiie_maruoka_castle_ndl224_trim.jpg, credit: "『日本古城絵図』越前丸岡城図の部分（江戸時代、国立国会図書館蔵）"}
      - 聞き: 3万人分のごはんが取れる領地か。もう立派な殿様だね。浪人から、たった14年くらいで。
      - 語り: 天正9年、信長は、利家に能登一国を任せます。利家は七尾城に入り、翌年、港を望む小丸山に、新しい城を築きました。
        background: {image: paintings/toshiie_hiroshige_noto_takinoura_crop.jpg, credit: "歌川広重《六十余州名所図会 能登 滝之浦》1853年"}
        year: 1581
        card: {head: 天正9年8月, body: 能登一国を任される 七尾城に入る}
      - 聞き: 一国を任されたってことは、信長からの信頼も、かなり厚かったってことだよね。
      - 語り: 能登一国は、約23万石と書く解説があります。石高は、数え方が史料や解説で違うので、目安です。
        figure: {type: bars, title: 前田家の石高（目安・石）, bars: [[府中（天正3年）, 33000], [能登一国（天正9年）, 230000], [前田家の最大（文禄4年）, 830000]], labels: [約3万3千, 約23万, 83万余]}
      - 聞き: 府中の3万3千石から、能登の23万石。しかも、まだ生涯の最大じゃないのか。
      - 語り: そして天正10年。信長が本能寺で討たれると、利家は、人生でいちばん苦しい選択を迫られます。
        figure: null
        hook: true
      - 聞き: 選択？ 誰につくか、ってこと？
        hook: true

  # ---------------------------------------------------------------- 5 賤ヶ岳
  - title: 1583年 賤ヶ岳の戦いで戦線を離れた理由
    background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《真書太閤記 本能寺焼討之図》1893年（後世の想像図）"}
    year: 1582
    lines:
      - 語り: 天正10年6月、本能寺の変。利家は、柴田勝家に従って、越中の魚津城を攻めている最中でした。山崎の戦いには、加われません。
        card: {head: 天正10年6月, body: 本能寺の変 利家は越中の魚津城を攻めていた}
      - 聞き: 秀吉は急いで引き返したのに、勝家たちは動けなかったんだ。
      - 語り: 勝家から出馬を催促されても、利家は、領内に不安があると断り、逆に、能登への加勢を求めました。
      - 語り: 6月27日、清洲会議。織田家の跡継ぎをめぐって、秀吉と勝家が対立します。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        card: {head: 天正10年6月27日, body: 清洲会議 秀吉と勝家が対立する}
      - 聞き: でも、秀吉とは仲がよかったんでしょ？ どうするの？
      - 語り: 勝家の与力だった利家は、そのまま勝家の側に立ちます。ウィキペディアによれば、利家は清洲で秀吉と隣同士に住み、子のいない秀吉夫婦に、四女の豪姫を授けていました。
        card: {head: 豪姫, body: 利家の四女 秀吉夫婦の養女になったとされる}
      - 聞き: 親友と、上司に挟まれたんだ。それはきついよ。
      - 語り: 11月、勝家は、利家と金森長近、不破勝光を、秀吉との和睦の交渉に送ります。しかし秀吉は、この三人を、逆に調略したといいます。
        year: 1582
      - 語り: 天正11年4月、賤ヶ岳の戦い。利家は、約5,000の兵で、茂山に布陣しました。
        year: 1583
        background: {image: paintings/hidenaga_shizugatake_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》賤ヶ岳の戦い（1883年）"}
        card: {head: 天正11年4月, body: 賤ヶ岳の戦い 利家は茂山に布陣}
        figure: {type: stats, title: 賤ヶ岳の戦い（ウィキペディアの数字）, items: [[柴田方の軍勢, 約3万, 利家らを含む], [利家の隊, 約5000, 茂山に布陣], [利家の動き, 戦線離脱, 佐久間盛政の撤退のさなか]]}
        short: s3
      - 語り: 戦いの途中、佐久間盛政の部隊が撤退するさなか、利家の隊が、戦線を離れます。柴田軍に動揺が広がり、羽柴軍の勝利が決まった、と説明されます。
        figure: null
        short: s3
      - 聞き: 味方を見捨てて、逃げたの？ それとも、秀吉と前から話がついてたの？
        tone: 疑問
        short: s3
      - 語り: 「秀吉の誘いに、早くから応じていたからだ」というのが、従来の通説です。ただ、利家父子を逃がす殿で、家臣の横山長隆が討死したことと、食い違う面があり、諸説あります。
        detail: {box: [0.0, 0.0, 0.5, 1.0], label: 賤ヶ岳合戦図屏風の一部}
        background: {image: paintings/hidenaga_shizugatake_screen_1.jpg, credit: "《賤ヶ岳合戦図屏風》（江戸時代）"}
        card: {head: 通説と食い違い, body: 内通は推測 家臣は殿で討死している}
        short: s3
      - 聞き: 裏切る約束があったなら、家来が命がけで守る必要、あるのかな？ どっちなんだろう。
        detail: {box: [0.0, 0.0, 0.5, 1.0], label: 賤ヶ岳合戦図屏風の一部}
        short: s3
      - 語り: 確かなのは、そのあとです。利家は越前の府中城に戻り、堀秀政の勧告で降伏。柴田勝家の北ノ庄城を攻める先鋒を務めました。勝家は、お市の方とともに、自害します。
        background: {image: paintings/toshiie_fukui_castle_ndl222_trim.jpg, credit: "『日本古城絵図』越前福井城図の部分（江戸時代、国立国会図書館蔵）"}
        year: 1583
        card: {head: 北ノ庄城攻め, body: 降伏した利家が先鋒を務める}
      - 語り: 画面は、現在の福井市の柴田神社、北ノ庄城跡のあたりです。
        background: {image: paintings/toshiie_photo_shibata_jinja.jpg, credit: "福井市の柴田神社、北ノ庄城跡（現在の写真、撮影 nnh、パブリックドメイン）"}
      - 聞き: 昨日まで同じ陣にいた人の城を、攻める側に回ったのか。戦国って、きびしいね。
      - 語り: 敗れて北ノ庄へ逃げる途中の勝家が、府中城に立ち寄り、利家は湯漬けを出した、という話もあります。『賤岳合戦記』にある逸話です。
        card: {head: 『賤岳合戦記』, body: 敗走中の勝家に湯漬けを出した逸話}
      - 聞き: 裏切ったのに、最後は勝家に湯漬けを出したの？ 複雑だったんだろうな。
      - 語り: 戦のあと、利家は本領を認められ、加賀の二郡を加増されます。拠点を、能登の小丸山城から、加賀の金沢城に移しました。画面は、現在の金沢城の石川門です。
        background: {image: paintings/toshiie_photo_kanazawa_castle_14.jpg, credit: "金沢城の石川門（現在の写真、撮影 Balon Greyjoy、CC0）"}
        card: {head: 天正11年, body: 加賀二郡を加増 金沢城に移る}
      - 聞き: 金沢に拠点を置くのは、この賤ヶ岳のあとからなんだ。加賀の前田家の、始まりの場所だね。
      - 語り: 加賀を得た利家。その隣の越中から、昔の同僚が攻めてきます。
        hook: true
      - 聞き: 昔の同僚が、敵に？ 誰のこと？
        hook: true

  # ---------------------------------------------------------------- 6 末森城から朝鮮
  - title: 1584年 末森城の戦いから、小田原征伐と朝鮮出兵へ
    background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
    year: 1584
    lines:
      - 語り: 天正12年、小牧・長久手の戦い。秀吉と家康が向き合います。この機に、越中の佐々成政が、家康の側に立って、加賀と能登へ攻め込みました。成政は、かつての府中三人衆の仲間です。
        card: {head: 天正12年, body: 佐々成政が加賀・能登へ攻め込む}
      - 語り: 9月、末森城。城将は奥村永福らで、城兵は約300人。囲む佐々軍は、約1万5千。利家が率いた救援の軍勢は、約2,500。数字は、ウィキペディアの記事に書かれたものです。
        card: {head: 天正12年9月, body: 末森城の戦い 佐々軍1万5千 利家2500}
        figure: {type: bars, title: 末森城の戦いの兵の数（ウィキペディアの記事）, bars: [[佐々成政軍, 15000], [利家の軍勢, 2500], [城内の兵, 300]], labels: [約1万5千, 約2500, 約300]}
        short: s4
      - 聞き: 1万5千と2,500！？ 6倍じゃん。普通に考えたら、利家は勝てなくない？
        tone: 驚き
        reaction: {number: 約6倍, lead: 末森城の兵力差, say: ほんとに6倍？}
        short: s4
      - 語り: 利家は、金沢城で急報を受けて、すぐ出陣します。地元の農民の案内で、佐々軍の手薄な海沿いの道を進み、11日の明け方、城を囲む佐々軍の背後を突きました。
        background: {image: paintings/toshiie_maruoka_castle_ndl224_trim.jpg, credit: "『日本古城絵図』越前丸岡城図の部分（江戸時代、国立国会図書館蔵）"}
        figure: null
        short: s4
      - 語り: この戦いで、利家は佐々軍を破ります。損害は、両軍とも、750人余りと伝えられています。
        short: s4
      - 聞き: 城に気を取られてる大軍の、後ろに回ったのか。これは奇襲だね。
      - 語り: 天正13年8月。秀吉が10万の大軍で越中へ攻め込み、利家が先導を務めます。成政は降伏。嫡子の利長は、越中の3郡を与えられ、前田一族の領地は、76万5千石に達しました。
        year: 1585
        background: {image: paintings/toshiie_toyama_castle_ndl226_trim.jpg, credit: "『日本古城絵図』越中富山城図の部分（江戸時代、国立国会図書館蔵）"}
        card: {head: 天正13年8月, body: 成政が降伏 前田一族は76万5千石に}
      - 聞き: 昔の仲間を、自分の手で降参させたのか。もう立場が、全然違う。
      - 語り: 天正14年、秀吉は利家に、羽柴の名字を許し、筑前守に任じます。天正16年には、豊臣の姓も与えられました。
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        card: {head: 天正14年, body: 羽柴の名字を許され 筑前守に}
      - 語り: 天正14年から15年の九州征伐では、利家は約8,000の兵で、畿内の守りを受け持ちました。息子の利長は、九州まで従軍しています。
        card: {head: 天正14年〜15年, body: 九州征伐 利家は畿内の守り 利長が従軍}
      - 聞き: 利家は留守番で、息子が前線か。世代交代の準備も、始まってたのかな。
      - 語り: 天正18年、小田原征伐。利家は北国勢の総指揮として、上杉景勝や真田昌幸らと上野に入り、松井田城を落とし、鉢形城、八王子城も攻め落としました。
        year: 1590
        background: {image: paintings/shingen_odawara_castle_map.jpg, credit: "《小田原城絵図》（江戸時代）"}
        card: {head: 天正18年, body: 小田原征伐 北国勢の総指揮}
        figure: {type: map, title: 小田原征伐での北国勢, bounds: [136.3, 139.7, 35.1, 36.9], route: [金沢, 松井田, 鉢形, 八王子], places: [[金沢, 136.66, 36.56], [松井田, 138.80, 36.33], [鉢形, 139.19, 36.11], [八王子, 139.25, 35.65], [小田原, 139.15, 35.26]], note: 道のりは目安}
      - 聞き: 金沢から関東まで、軍勢を連れて動いたのか。しかも総指揮。
      - 語り: 利家には、もう一つの顔がありました。秀吉の禁教令で領地を失ったキリシタン大名、高山右近を、庇護したのです。屋敷と3万石の禄を与え、築城の知識を買った、とされます。
        figure: null
        card: {head: 高山右近, body: 禁教令で領地を失った右近を庇護した}
      - 聞き: 追放された人を引き取って、しっかり働かせたのか。利家自身が、浪人の苦労を知ってたからかな。
      - 語り: 文禄元年、朝鮮出兵。利家は諸将に先んじて京を出て、名護屋へ向かいます。従う兵は約8,000と言われます。秀吉が自ら海を渡ろうとすると、利家は家康とともに、止めました。
        detail: {box: [0.01, 0.02, 0.335, 0.98], label: 名護屋出陣図の一部}
        year: 1592
        figure: null
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
        card: {head: 文禄元年, body: 秀吉の渡海を家康とともに止める}
      - 語り: 秀吉が母の危篤で大坂に戻った、約3か月。名護屋で諸将を指揮し、政務を取ったのは、家康と利家でした。これを「五大老の原型」と評する見方があります。
        detail: {box: [0.01, 0.02, 0.335, 0.98], label: 名護屋出陣図の一部}
        card: {head: 家康と利家, body: 秀吉の留守に諸将を指揮 五大老の原型}
      - 聞き: 家康と利家が、ふたりで留守を守ったんだ。この頃から、もう並んでたってことか。
        detail: {box: [0.01, 0.02, 0.335, 0.98], label: 名護屋出陣図の一部}
      - 語り: 文禄3年には、従三位・権中納言。官位の序列で、毛利輝元や上杉景勝を追い越します。秀吉が、利家を家康に対抗させるために引き上げた、と見る説があります。
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        year: 1594
        card: {head: 文禄3年, body: 従三位・権中納言 輝元・景勝を追い越す}
      - 聞き: 家康と並ぶ位置に、引き上げられたのか。秀吉は、家康のことが、そんなに気になってたのかな。
      - 語り: 家康と並ぶ位置に立った利家。その秀吉に、やがて、最後の頼みごとをされます。
        hook: true
      - 聞き: 最後の頼み？ 何を頼まれたの？
        hook: true

  # ---------------------------------------------------------------- 7 五大老と秀頼
  - title: 1598年 五大老の一人になり、秀吉に秀頼を託される
    background: {image: paintings/nene_rakuchu_funaki_1.jpg, credit: "《洛中洛外図屏風》（江戸時代初期）"}
    year: 1598
    lines:
      - 語り: 慶長3年3月15日。醍醐の花見に、利家は、妻のまつとともに招かれます。秀吉が催した、盛大な花見でした。
        card: {head: 慶長3年3月15日, body: 醍醐の花見にまつとともに招かれる}
      - 語り: 利家は、能が好きでした。三日に一度は稽古をするほどで、茶の湯は、千利休や織田有楽に学んだ、と言われます。
      - 聞き: 槍の人が、能と茶の湯か。強いだけじゃなくて、芸事もできる人だったのか。
      - 語り: ただ、秀吉も利家も、体の衰えが見え始めていました。4月20日、利家は嫡子の利長に家督を譲って隠居し、草津へ湯治に出かけます。
        card: {head: 慶長3年4月20日, body: 利長に家督を譲り 草津へ湯治}
      - 聞き: 隠居して、温泉かあ。のんびりできたの？
      - 語り: できませんでした。草津から戻ると、利家は、五大老の1人に命じられます。しかも、家康と並ぶ、上首の地位でした。
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        card: {head: 五大老, body: 家康と並ぶ上首の大老に}
      - 語り: 五大老は、徳川家康と前田利家、毛利輝元、上杉景勝、宇喜多秀家の5人です。有力な大名が、秀吉の死後の政治を支える仕組みです。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: 5人のなかで、いちばん上に並ぶのが、家康と利家だったのか。この二人の力関係で、国の行き先が決まりそう。
      - 語り: 慶長3年8月18日、秀吉が亡くなります。死の間際、秀吉は、利家らに、幼い秀頼の将来を、繰り返し頼みました。
        year: 1598
        background: {image: paintings/nene_rakuchu_funaki_2.jpg, credit: "《洛中洛外図屏風》（江戸時代初期）"}
        card: {head: 慶長3年8月18日, body: 秀吉没 利家らに秀頼を繰り返し頼む}
      - 聞き: 秀吉が最後に頼ったのが、利家だったんだ。
      - 語り: 遺言の覚書で、秀吉は利家を「律義者」と呼んでいる、とウィキペディアは書きます。だから、秀頼の後見人を任せたのだろう、という見方です。
        card: {head: 律義者, body: 秀吉の遺言覚書の呼びかけ（ウィキペディア）}
      - 聞き: 律義者って、真面目で約束を守る人、だよね。信頼されてたんだ。
      - 語り: 慶長4年の元旦。伏見で、諸大名が、新しい主、秀頼に年賀の挨拶をしました。利家は、病をおして出席し、秀頼を抱いて、席につきます。
        year: 1599
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        card: {head: 慶長4年元旦, body: 病をおして出席し 秀頼を抱いて着席}
      - 聞き: 病気をおして、幼い秀頼を抱いて座ったのか。約束を守ろうとする姿が、目に浮かぶよ。
      - 語り: 1月10日、秀頼は大坂城へ移り、利家が付き従って、大坂城に入ります。家康は、伏見城に残りました。
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        card: {head: 慶長4年1月10日, body: 利家は秀頼に付き従い大坂城へ 家康は伏見城}
        figure: {type: people, title: 秀吉の死後の配置, nodes: [[豊臣秀頼, 秀吉の子], [前田利家, 傅役 大坂城], [徳川家康, 大老 伏見城], [石田三成, 五奉行]], edges: [[前田利家, 豊臣秀頼, 傅役], [徳川家康, 豊臣秀頼, 大老]]}
      - 聞き: 利家は大坂城で秀頼のそば、家康は伏見。役割が、分かれたってことか。
      - 語り: 秀吉の側近、大野治長は、こう語ったと伝わります。官位も領地も、利家は家康より下。でも、城での人々の信頼は、利家のほうが5倍も強い、と。
        card: {head: 大野治長の評, body: 利家の信頼は家康より5倍強いと伝わる}
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      - 聞き: 5倍って、すごい差だね。数字は例えだろうけど、利家が頼られてたのは、本当っぽい。
      - 語り: 傅役は、幼い主君の養育係で、後見人でもあります。秀頼を守る役目が、病を抱えた利家の肩にのしかかりました。そこへ、家康が動きます。
        card: {head: 傅役, body: 幼い主君の養育係・後見人}
        figure: null
        hook: true
      - 聞き: 家康が？ 何をしたの？
        hook: true

  # ---------------------------------------------------------------- 8 最期
  - title: 1599年 家康との誓紙、利家の死と翌日の騒ぎ
    background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
    year: 1599
    lines:
      - 語り: 慶長4年の年明け。家康は、秀吉の定めた法度に背いて、無断で婚姻を進めます。相手は、伊達政宗、蜂須賀家政、福島正則らです。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        card: {head: 慶長4年, body: 家康が無断で婚姻を進める}
        short: s5
      - 語り: 利家はこれに反発します。諸大名が、家康の屋敷と、利家の屋敷に分かれて集まる騒ぎになりました。
        short: s5
      - 聞き: 家康と利家が、真っ二つに割れそうになったんだ。そのとき、利家はどうしたの？
        short: s5
      - 語り: 家康のもとを訪ねる前、利家は、利長に、こう言い置いた、という話があります。話が決裂したら家康を斬る。自分が斬られたら、弔い合戦をしろ、と。前田家の『利家公御夜話』にある話です。
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        card: {head: 『利家公御夜話』, body: 家康を斬る覚悟の話は前田家の記録}
        figure: null
        short: s5
      - 聞き: 刀で斬るなんて、すごい覚悟。でも前田家の本の話なんだよね。家の人を、よく書いてるのかも。
      - 語り: 2月2日。利家を含む四大老と五奉行の9人と、家康が、誓紙を交わします。
        background: {image: paintings/nene_rakuchu_funaki_1.jpg, credit: "《洛中洛外図屏風》（江戸時代初期）"}
        card: {head: 慶長4年2月2日, body: 9人と家康が誓紙を交わす}
        figure: {type: stats, title: 慶長4年の大坂と伏見, items: [[誓紙の交換, 2月2日, 四大老・五奉行の9人と家康], [利家が没する, 閏3月3日, 大坂の自邸], [三成に押しかける, 閏3月3日夜〜4日, 七将と呼ばれる武断派]], upto: 1}
      - 語り: その後の日付は分かりませんが、利家が家康を訪ね、家康は三成の屋敷に近い自分の屋敷から、向かい側の向島城へ移りました。
        figure: null
        card: {head: 向島城, body: 家康が三成の屋敷近くから移る（日付不明）}
      - 聞き: 9人と誓紙を交わして、家康も三成の屋敷の近くから離れたのか。ひとまず、ぶつからずに収まったってことだね。
      - 語り: 見舞いに来た家康に、利家が布団の下に抜き身の太刀を隠していた、という『浅川聞書』の話もあります。一方で、家康に利長を頼んだ、という話も残ります。
        card: {head: 『浅川聞書』, body: 布団の下に抜き身の太刀を隠した話}
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      - 聞き: 刀を隠して、頼みごと？ 真逆の話が、両方残ってるの？
      - 語り: こうした話は、江戸時代に幕府へ出すために作られた二次の史料の話だ、とウィキペディアは書きます。前田家が徳川に気を遣った創作とも言われ、真偽は分からない、と。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        card: {head: 後世の話, body: 刀の話は江戸の二次史料 真偽は分からない}
      - 聞き: 本当かどうか分からない話が、こんなに残ってる。それだけ、みんな利家の最期が気になったんだろうね。
      - 語り: 慶長4年閏3月3日。利家は、大坂の自邸で亡くなります。享年62と記されます。
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        year: 1599
        figure: {type: stats, title: 慶長4年の大坂と伏見, items: [[誓紙の交換, 2月2日, 四大老・五奉行の9人と家康], [利家が没する, 閏3月3日, 大坂の自邸], [三成に押しかける, 閏3月3日夜〜4日, 七将と呼ばれる武断派]], upto: 2}
        card: {head: 慶長4年閏3月3日, body: 大坂の自邸で没 享年62}
        tone: 重い
      - 聞き: 秀吉の死から、まだ8か月かあ。頼まれたことを、最後まで見届けられなかったのか。
        tone: しみじみ
      - 語り: 最期の話も、残っています。まつが経帷子を着せようとすると、利家は断り、地獄で閻魔と戦をしてやる、という趣旨のことを言った。家康はこれを聞いて、「天晴れ」と褒めた、とされます。
        background: {image: paintings/nene_rakuchu_funaki_1.jpg, credit: "《洛中洛外図屏風》（江戸時代初期）"}
        figure: null
        card: {head: 後世の話, body: 経帷子を断った話 『越富賀三州志』などに}
      - 聞き: 閻魔と戦をするって、最後まで、槍の又左だね。
      - 語り: 利家が亡くなった閏3月3日の夜から、4日にかけて。七将と呼ばれる武断派の武将たちが、石田三成のもとへ押しかけた、と伝わります。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        year: 1599
        figure: {type: stats, title: 慶長4年の大坂と伏見, items: [[誓紙の交換, 2月2日, 四大老・五奉行の9人と家康], [利家が没する, 閏3月3日, 大坂の自邸], [三成に押しかける, 閏3月3日夜〜4日, 七将と呼ばれる武断派]], upto: 3}
        card: {head: 閏3月3日夜〜4日, body: 武断派が三成のもとへ押しかけたと伝わる}
      - 聞き: 亡くなったその夜から？ 利家がいなくなったとたんに？
        tone: 驚き
      - 語り: 人数は、七人とも十人とも言われ、襲撃だったのか訴えだったのかにも、異説があります。
      - 聞き: 七人か十人か、襲撃か訴えか。ここまで割れてると、聞いた話をそのまま信じるのは、危ないね。
      - 語り: 利家は、武断派と文治派の争いを、仲裁する役でした。加藤清正ら武断派は、利家を尊敬していた、とされます。並びは、そうなっています。ただ、因果は、断言できません。
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        figure: null
        card: {head: 利家の死と同じ夜, body: 同じ夜に騒ぎが起きた（因果は不明）}
      - 聞き: 争いを止める人が、いなくなったその夜に、か。これって、偶然なのかな？
      - 語り: 同じ年の8月、利長は金沢へ帰国します。遺言では、3年は上方を離れるな、と言われていたのに。画面は、現在の金沢城です。
        year: 1599
        background: {image: paintings/toshiie_photo_kanazawa_castle_14.jpg, credit: "金沢城の石川門（現在の写真、撮影 Balon Greyjoy、CC0）"}
      - 語り: 翌月、利長に異心があると告げる者が出て、家康の加賀征伐が取り沙汰されました。
        card: {head: 加賀征伐の風聞, body: 利長の帰国のあと 家康が討伐を取り沙汰}
      - 語り: この風聞に、利長は、母の芳春院、つまりまつを、人質として江戸へ差し出す約束をして、戦を避けました。約束の時期は、ここでは確かめていません。
        background: {image: paintings/ieyasu_edo_keicho_ezu_1608.jpg, credit: "《慶長江戸図》1608年（東京都立中央図書館蔵）"}
        card: {head: 芳春院, body: 人質として江戸へ（時期は未確認）}
      - 語り: 近年は、加賀征伐の計画そのものが風聞にすぎなかった、という見方もあります。
      - 聞き: まつさんが、人質に。夫が家康と向き合った家を、今度は妻が江戸に行って、守ったのか。
      - 語り: 関ヶ原のあと、利長は能登や西加賀を加え、前田家は、日本最大の藩になります。その百万石は、どう決まったのか。まとめで、数字を並べてみましょう。
        detail: {box: [0.0, 0.0, 0.45, 1.0], label: 関ヶ原合戦図屏風の一部}
        background: {image: paintings/ieyasu_sekigahara_zubyobu.jpg, credit: "《関ヶ原合戦図屏風》（江戸時代）"}
        hook: true
      - 聞き: 百万石の数字を、もう一度見るのか。
        detail: {box: [0.0, 0.0, 0.45, 1.0], label: 関ヶ原合戦図屏風の一部}
        hook: true

  # ---------------------------------------------------------------- 9 まとめ
  - title: まとめ：前田利家とは何者だったのか
    background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
    portrait: {image: paintings/toshiie_portrait_toshiie_png.jpg, caption: "前田利家の肖像（後世の肖像画）", age: false}
    year: 1599
    lines:
      - 語り: 利家の像を、三つの層で振り返ります。1つ目、記録で言えること。浪人の2年から這い上がり、府中、能登、そして加賀へと領地を広げ、秀吉に最も頼られる大名の一人になりました。
        card: {head: 1つ目 記録で言えること, body: 浪人から五大老・秀頼の傅役へ}
      - 聞き: 浪人から五大老だもんね。会社をクビになった人が、最後は役員で、社長の子どもを預かるところまで来たみたい。
      - 語り: 2つ目、分からないこと。賤ヶ岳の退却は、秀吉への内通と言われてきましたが、確かめられていません。家臣が殿で討死した話とも、食い違う面があります。
        background: {image: paintings/hidenaga_shizugatake_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》賤ヶ岳の戦い（1883年）"}
        card: {head: 2つ目 分からないこと, body: 賤ヶ岳の退却は内通と決められない}
      - 聞き: 裏切り者って言い切るのは、早いよね。分からないところは、分からないままにしておくんだ。
      - 語り: 3つ目、後の話です。家康を斬る覚悟も、布団の下の太刀も、経帷子の話も、前田家や江戸の書に出てきます。そこから忠臣の像ができた面があり、徳川に気を遣った創作の疑いも残ります。
        card: {head: 3つ目 後の話, body: 刀と経帷子の話は前田家・江戸の書}
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: 同じ人なのに、本によって、忠臣にも、世渡り上手にも見えるのか。
      - 語り: 冒頭の問いに戻ります。利家の石高は、生きている間、最大で83万石余。百万石を超えたのは、関ヶ原のあと、利長の代でした。
        background: {image: paintings/ieyasu_sekigahara_zubyobu.jpg, credit: "《関ヶ原合戦図屏風》（江戸時代）"}
        figure: {type: bars, title: 前田家の石高（石）, bars: [[利家の最大（文禄4年）, 830000], [利長の朱印高（関ヶ原のあと）, 1192760]], labels: [約83万, 約119万]}
        card: {head: 冒頭の問い, body: 百万石を超えたのは利長の代}
      - 語り: 朱印高は、119万石余です。利家の最大より、約36万石、およそ4割多い計算です。
        detail: {box: [0.0, 0.0, 0.45, 1.0], label: 関ヶ原合戦図屏風の一部}
      - 聞き: 百万石の祖と呼ばれたのは、子の利長の代で百万石を超えたからか。利家の最大より、4割も多いんだ。
        detail: {box: [0.0, 0.0, 0.45, 1.0], label: 関ヶ原合戦図屏風の一部}
      - 語り: 最後に、人柄の分かる遺言を。貸したお金の催促はするな、返せない者の借金は、なかったことにせよ。そう利長に命じた、とあります。
        figure: null
        background: {image: paintings/toshiie_osaka_zu_crop.jpg, credit: "《豊臣期大坂図屏風》の部分、1607〜1615年ごろ（エッゲンベルク城蔵）"}
        card: {head: 利家の遺言, body: 貸した金の催促はするな}
      - 聞き: 算盤を自分ではじいてた人が、最後は、そう言ったのか。浪人で、お金の怖さを知ってたからかな。
        tone: しみじみ
      - 語り: では、層の下にある、記録で言える利家は、どんな人だったのか。
        card: {head: 記録で言える利家, body: 浪人から五大老・秀頼の傅役まで}
        background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      - 聞き: 槍の名手で、浪人して、迷って、最後は秀頼を託されて。あーしには、強い人っていうより、約束を背負い続けた人、に見えたよ。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 明日の夜は、石田三成。利家が亡くなった夜、武断派の武将たちに押しかけられた人だよね。三成の像も、後の本が作ったの？
        card: {head: 明日 19時, body: 石田三成}
        portrait: {image: paintings/toshiie_portrait_ishida_mitsunari.jpg, caption: "石田三成の肖像（17世紀）", age: false}
        tone: 疑問
