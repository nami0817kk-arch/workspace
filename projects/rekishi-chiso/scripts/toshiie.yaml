# 前田利家（A作品・10/20 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：前田利家とは何者だったのか」）
# 冒頭の一点：「加賀百万石の祖」と呼ばれるが、利家が生きている間の前田家の石高は最大で83万石余（文禄4年）。百万石を超えるのは関ヶ原のあと、子の利長の代
#   （検地高122万5千石・朱印高119万2760石。ウィキペディア「前田利長」）。利家は関ヶ原の約1年半前（慶長4年閏3月3日）に亡くなっている。答えは第8節、まとめで冒頭に戻る。
# 事実の出どころは dev/output/rekishi-chiso/research/toshiie_facts.md（確実／有力／説／後世の話の区分もそこ）。素材は research/toshiie_assets.md。
# 決まり：①日付は和暦で言う。西暦は年表・card の年（year:）にだけ出す。生年は天文5・6・7年と割れる（前田家の記録は天文7年12月）ので、年齢は言わず、肖像の「この時○歳」は出さない（age: false）。
#   ②使わない話（入れない）：一向一揆の磔・釜茹で、石動山の首の数／小姓時代の衆道の話（鶴の汁）／前田慶次との不仲・水風呂／大坂城の幽霊と大典太の話／「花の慶次」・大河「利家とまつ」の場面／
#     ネットの個人ブログ／関ヶ原の「もしも」（別の回の領分。「利家が生きていれば関ヶ原は起きなかった」とは言わない）。
#   ③後世の話（出典名を言う）：槍の長さ・朱塗り・又左衛門の槍を避けた話（『亜相公御夜話』、前田家の逸話）／笄を盗まれた話／賤ヶ岳の湯漬け（『賤岳合戦記』）／
#     家康を斬る覚悟（『利家公御夜話』）／布団の下の太刀（『浅川聞書』）／経帷子を拒んだ話（『古心堂叢書利家公夜話首書』・『越富賀三州志』）。ウィキペディア経由の情報は「ウィキペディアの整理では」と断る。
#     賤ヶ岳の退却は「秀吉への内通」が通説だが推測で、家臣・横山長隆の殿での討死と食い違う面がある（ウィキペディアの注記）。断定しない。
#   ④数字は何の数かを言う。末森城の1万5千・2,500・300・750人余はウィキペディアの記事の数字（出典名の記載なし）。賤ヶ岳の約5,000・約3万も二次の数字。能登一国の約23万石は解説による。
#   ⑤人物のセリフは入れない（家康を斬る趣旨の言葉・経帷子の言葉は「という話」と出典名つきの趣旨だけ）。⑥背景に人物の肖像・拡大絵を使わない。NDL 系は detail で枠内だけ。血・遺体・首・切腹の絵は使わない。
#   ⑦現代の写真は「画面は現在の〜」とその行で断る。城の絵図・肖像はすべて後世のもの。⑧B作品（昼）の内容を先取りしない。
#   読みの注意：前田利家＝まえだとしいえ／荒子＝あらこ／犬千代＝いぬちよ／利春＝としはる／拾阿弥＝しゅうあみ／笄＝こうがい／松岡＝まつおか／森部＝もりべ／足立六兵衛＝あだちろくべえ／赤母衣衆＝あかほろしゅう／
#     府中＝ふちゅう／七尾＝ななお／小丸山＝こまるやま／石動山＝せきどうさん／魚津＝うおづ／末森＝すえもり／奥村永福＝おくむらながとみ／佐々成政＝さっさなりまさ／不破光治＝ふわみつはる／金森長近＝かなもりながちか／
#     茂山＝しげやま／横山長隆＝よこやまながたか／豪姫＝ごうひめ／芳春院＝ほうしゅんいん／醍醐＝だいご／傅役＝もりやく／利長＝としなが／利政＝としまさ／鉢形＝はちがた／松井田＝まついだ／名護屋＝なごや／
#     誓紙＝せいし／向島城＝むかいじまじょう／蜂須賀家政＝はちすかいえまさ／経帷子＝きょうかたびら／『亜相公御夜話』＝あしょうこうおんやわ／『利家公御夜話』＝としいえこうおんやわ／『三壺記』＝さんこき／
#     『賤岳合戦記』＝しずがたけかっせんき／『浅川聞書』＝あさかわききがき／『村井重頼覚書』＝むらいしげよりおぼえがき／『信長公記』＝しんちょうこうき。
