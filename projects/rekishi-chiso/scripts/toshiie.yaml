en:
  title: "Maeda Toshiie: The Founder of the 'Million-Koku Kaga' Never Held a Million Koku in His Lifetime"
  description: |-
    Maeda Toshiie is known as the founder of the "one million koku Kaga domain", but the largest holding of the Maeda family while he was alive was a little over 830,000 koku (1595, according to Wikipedia). The domain passed one million koku only after Sekigahara, under his son Toshinaga, and Toshiie himself died on the 3rd day of the intercalary 3rd month of Keicho 4 (April 27, 1599), about a year and a half before the battle.
    This video digs into Toshiie's life from his birth in Arako, Owari, and separates what records show from what later books say: the Kogai-giri incident that made him a ronin, his unauthorized appearance at Okehazama and Morube, the three-man group of Fuchu, his rule of Noto, the retreat at Shizugatake (the "secret deal with Hideyoshi" is a guess), the battle of Suemori Castle, his role among the Five Elders and as guardian of Hideyori, the standoff with Ieyasu in 1599, and stories such as the sword under the futon that come from later Maeda or Edo-period sources.
    We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1599: Death in Osaka, and the Million-Koku Question"
    - "1539: Born in Arako, the Spear Called Mata-za"
    - "1559: The Kogai-giri Incident, Two Years as a Ronin"
    - "1569: Head of the Family, Fuchu and the Rule of Noto"
    - "1583: The Retreat at Shizugatake"
    - "1584: Suemori Castle, Odawara and Korea"
    - "1598: One of the Five Elders and Guardian of Hideyori"
    - "1599: The Oath to Ieyasu and Toshiie's Death"
    - "Summary: Who Was Maeda Toshiie?"

