sections:
  # ================================================================ 序章（冒頭30秒＝1〜5行目）
  - title: 道長の日記は、千年あまりたった今も子孫の家にある　1018年から今まで
    background: {image: paintings/gosekke_midokanpaku_diary.jpg, credit: "藤原道長自筆『御堂関白記』（陽明文庫蔵。パブリックドメイン）"}
    year: 1018
    lines:
      # fact: gosekke-03, gosekke-39
      - 語り: 道長が自分の手で書いた日記は、千年あまり、子孫の家に伝わっています。では、その家々は、今どうなっているのでしょうか。
        tone: 疑問
        card: {head: "藤原道長", body: 自筆の日記が子孫の家に}
      # fact: gosekke-06, gosekke-03
      - 語り: 国宝、『御堂関白記』。ところが道長は、天皇を助ける最高の役、関白に、生涯一度も、なっていません。
        tone: 重い
      # fact: gosekke-11, gosekke-17
      - 語り: 道長の子孫は、五つの家に分かれ、一度絶えた家を、織田信長がよみがえらせました。
      - 語り: では、その五つの家に、今も家を率いる当主はいるのか。名前が分かる家は、いくつあるのか。
        tone: 疑問
        card: {head: "五つの家", body: 今、当主の名前が分かる家は？}
      - 語り: 答えは、「この世をば」と詠んだ夜から、順にたどると見えてきます。
      - 語り: 五つの家の名は、近衛、九条、二条、一条、鷹司。摂政や関白になれる家柄を、摂関家といい、この五つが、五摂家です。
        figure: {type: people, title: 道長から五つの家へ, nodes: [[藤原道長, 栄華の頂点], [近衛家, 基実の系統], [松殿家, 基房の系統], [九条家, 兼実の系統], [鷹司家, 近衛から分かれる], [二条家, 九条から分かれる], [一条家, 九条から分かれる]], edges: [[藤原道長, 近衛家, 子孫], [藤原道長, 松殿家, 子孫], [藤原道長, 九条家, 子孫], [近衛家, 鷹司家, 分家], [九条家, 二条家, 分家], [九条家, 一条家, 分家]]}
      - 語り: 摂政は、幼い天皇に代わって政治をする役。関白は、大人の天皇を助けて、政治を動かす最高の役です。
        figure: null
      # fact: gosekke-03, gosekke-19
      - 語り: 日記を守っているのは、五家の筆頭、近衛家に伝わる宝物を預かる、京都の陽明文庫です。道長の自筆の日記が、14巻、伝わっています。
      - 語り: 1000年あまりの家系図を、消えた枝から、順にたどります。
        hook: true
      - 語り: 始まりは、1018年、寛仁2年の10月です。
        hook: true

  # ================================================================ 第1章 「この世をば」の夜
  - title: 「一家立三后、未曾有なり」　「この世をば」の夜　1018年10月16日
    background: {image: paintings/gosekke_murasaki_emaki_fujita.jpg, credit: "《紫式部日記絵巻》（藤田美術館蔵。パブリックドメイン）"}
    year: 1018
    lines:
      # fact: gosekke-01
      - 語り: 1018年、寛仁2年の10月16日。道長の三女、威子が、後一条天皇の、中宮に立ちました。
        year: 1018
        card: {head: "1018年10月16日", body: 威子が中宮に}
      # fact: gosekke-01
      - 語り: 彰子と妍子は、すでに、后になっていました。威子で、3人目です。一つの家から、后が3人、立ったのです。
      # fact: gosekke-02
      - 語り: 道長と同じ時代の貴族、藤原実資は、日記『小右記』に、書きました。一家立三后、未曾有なり。一つの家から、三人の后が立つのは、前代未聞だ、と。
        tone: しみじみ
      # fact: gosekke-20
      - 語り: この年の2月、道長は太政大臣を辞めて、表向きは、引退していました。それでも、宴の座では、大殿として、場を仕切っていた、といいます。
      # fact: gosekke-04
      - 語り: その夜の宴で、道長は、座にいた実資に、持ちかけます。和歌を詠もうと思う。返歌をしてほしい。自慢めいた歌だが、前もって、用意したものではない。
      # fact: gosekke-03
      - 語り: 詠まれたのが、あの歌です。この世をば、わが世とぞ思ふ、望月の、欠けたることも、なしと思へば。
        tone: 重い
        card: {head: "道長の歌", body: この世をば わが世とぞ思ふ}
      # fact: gosekke-04
      - 語り: 実資は、返歌をしませんでした。かわりに、唐の詩人、白居易の故事を挙げ、皆で、この歌を吟じましょう、と言って、その場をおさめます。
      # fact: gosekke-04
      - 語り: 1995年に、『詞林』という雑誌に載った論文は、白居易のこの故事が、調べた詩話や類書には見当たらない、と書いています。
      # fact: gosekke-03
      - 語り: しかも、この歌を書き残したのは、道長ではありません。道長の『御堂関白記』の、この日の記事には、歌を詠んだことと、皆が吟じたことだけが書かれ、歌の本文はありません。
        tone: 重い
        card: {head: "歌を書き残したのは", body: 道長ではなく、実資}
      # fact: gosekke-05
      - 語り: 同じ論文は、この夜の月を、満月ではなく、十六夜の月とみています。ただ、16日が望の日だったとする説も、あります。
      # fact: gosekke-06
      - 語り: 道長が、摂政を務めたのは、後一条天皇が即位した1016年から、1年あまり。関白には、一度も、なっていません。
        year: 1016
      # fact: gosekke-06
      - 語り: 御堂関白、という呼び名は、道長が建てた御堂、法成寺からきた、後の世の呼び名です。
      - 語り: 道長の栄華は、家の栄華でした。では、その家は、どうやって、五つに分かれたのか。
        tone: 疑問
        hook: true
      - 語り: 分かれ目は、あの夜から、およそ150年後に来ます。
        hook: true

  # ================================================================ 第2章 一つの家が三つに割れた
  - title: 「基実は24歳で急死した」　一つの家が三つに　1166年から1184年
    background: {image: paintings/gosekke_murasaki_emaki_gotoh6.jpg, credit: "《紫式部日記絵巻》（五島美術館蔵。パブリックドメイン）"}
    year: 1166
    lines:
      # fact: gosekke-07
      - 語り: 1166年、永万2年の7月。近衛基実が、赤痢で亡くなりました。数えで、24歳でした。
        year: 1166
        card: {head: "1166年7月", body: 近衛基実が24歳で急死}
      # fact: gosekke-07
      - 語り: 基実の遺領は、平清盛の娘で、基実の妻だった、盛子が、いったん、受け継ぎました。摂政の座は、弟の基房が、継ぎます。
      # fact: gosekke-07
      - 語り: これが、摂関家が割れていく、きっかけだったとされます。基実の系統は近衛家。基房の系統は、松殿家。兼実の系統は、九条家になりました。
        figure: {type: people, title: 摂関家は三つに割れた, nodes: [[藤原忠通, 道長の子孫], [基実, 近衛家の祖], [基房, 松殿家の祖], [兼実, 九条家の祖]], edges: [[藤原忠通, 基実, 子], [藤原忠通, 基房, 子], [藤原忠通, 兼実, 子]]}
      # fact: gosekke-08
      - 語り: 1183年、寿永2年の11月。木曽義仲が、後白河法皇のいる法住寺殿を攻めて、京を押さえます。その2日後の21日、基房の子の師家が、数えで12歳で、摂政になりました。
        figure: null
        year: 1183
        card: {head: "1183年11月21日", body: 師家が12歳で摂政に}
      # fact: gosekke-08
      - 語り: けれど、翌年の寿永3年1月22日には、罷免されます。摂政だったのは、2か月あまりでした。
      # fact: gosekke-08
      - 語り: 師家は、のちに出家し、1238年、嘉禎4年に、数えで67歳で、亡くなったとされます。
      # fact: gosekke-09
      - 語り: 松殿家は、その後も、摂政を出せませんでした。摂政になれたのは、基房と師家の、2人だけ。あとは、大納言どまりです。
      # fact: gosekke-09
      - 語り: 三つに割れた家の中で、のちに絶えてしまったのは、この松殿家です。戦国時代の中ごろには、絶えたと、考えられています。
        tone: 重い
        card: {head: "松殿家", body: 戦国の中ごろに絶える}
      # fact: gosekke-09
      - 語り: 名前が出てくる最後の記録は、1508年。従三位だった、松殿忠顕です。最後の当主が誰かは、はっきりしていません。
      - 語り: 残ったのは、近衛家と、九条家。この二つが、さらに、分かれていきます。
        tone: 疑問
        hook: true
      - 語り: その分かれ方は、親子の争いと、無縁ではありませんでした。
        hook: true

  # ================================================================ 第3章 子孫とは認めない
  - title: 「自らの子孫とは認めない」　二条家と、五摂家のそろう日　1226年から1273年
    background: {image: paintings/gosekke_hananogosho.png, credit: "上杉本洛中洛外図屏風 花の御所（京都アスニー収蔵。パブリックドメイン）"}
    year: 1226
    lines:
      # fact: gosekke-18
      - 語り: 九条家の道家は、子の頼経を、鎌倉幕府の将軍にしました。1226年、頼経は、数えで9歳でした。
        year: 1226
        card: {head: "1226年", body: 九条頼経が将軍に（数え9歳）}
      # fact: gosekke-18
      - 語り: 頼経は、1244年に将軍を辞め、1246年の宮騒動で、京へ送り返されます。1256年、数えで39歳で、亡くなりました。
      # fact: gosekke-14
      - 語り: その道家には、息子への、はっきりした差がありました。二条家の祖となる良実を、道家は、幼いころから、疎んじた、と、三田武繁さんは書いています。
      # fact: gosekke-14, gosekke-15
      - 語り: 元服も、祖父のとりなしで、やっと、実現しました。1246年には、関白の座を、弟に譲るよう、道家に強いられます。
        year: 1246
      # fact: gosekke-14
      - 語り: 1250年、道家は、財産を分ける文書を作りました。惣処分状です。良実と、その子孫には、財産を渡さない、と定めました。
        year: 1250
      # fact: gosekke-14
      - 語り: その2年後には、良実を、自分の子孫とは認めない、という文書まで、作っています。
        tone: 重い
        card: {head: "1250年・1252年", body: 道家が良実を義絶}
      # fact: gosekke-15
      - 語り: 良実に代わって関白になった実経は、一条室町の邸を、受け継ぎました。ここから、一条家が始まります。
      # fact: gosekke-11
      - 語り: 一方、近衛家では、1252年、兄が弟に摂政を譲り、その弟の子孫が、鷹司家になりました。
        year: 1252
      # fact: gosekke-12
      - 語り: 同じ1252年、九条家の当主が失脚し、九条家は、摂関家の格を、失います。取り戻したのは、1273年。九条家の人が、関白になった年です。21年かかりました。
        year: 1273
      # fact: gosekke-12
      - 語り: 五摂家が、いつそろったのか。三田さんは、この1273年とみます。けれど、1252年とみる見方もあり、研究者のあいだでも、1つには決まっていません。
        card: {head: "五摂家の成立", body: 1252年説と1273年説}
      # fact: gosekke-13
      - 語り: 二条家は、出遅れました。初代の良実が、1242年に関白になってから、2人目の摂関が出たのは、1287年。45年も、待たされました。
        figure: {type: stats, title: 摂関家が復活・再興するまで, items: [[九条家が家格を取り戻す, 21年, 1252年から1273年], [二条家に2人目の摂関, 45年, 初代から数えて], [鷹司家が途絶える, 33年, 1546年から1579年]], upto: 2}
      # fact: gosekke-16
      - 語り: 一条家も、綱渡りでした。関白に近い役、内覧の宣旨を受けた、その日に、亡くなった当主がいます。その子も、35歳で亡くなりました。
        figure: null
      # fact: gosekke-11
      - 語り: 五つの家の名は、住んでいた邸の場所に、由来します。二条は二条京極、一条は一条室町、鷹司は鷹司室町。九条は、兼実の邸の名からです。近衛は、近衛大路に面した、近衛殿からきています。
      - 語り: こうして、五つの家は、そろいました。けれど、戦国の世は、その家々を、容赦なく襲います。
        hook: true
      - 語り: 家が絶えるのは、松殿家だけでは、ありませんでした。
        hook: true

  # ================================================================ 第4章 33年途絶えた家
  - title: 「織田信長の口添えで再興」　33年途絶えた鷹司家と、一代かぎりの松殿家　1546年から1646年
    background: {image: paintings/gosekke_hananogosho.png, credit: "上杉本洛中洛外図屏風 花の御所（京都アスニー収蔵。パブリックドメイン）"}
    year: 1546
    lines:
      # fact: gosekke-17
      - 語り: 1546年、天文15年。鷹司家の当主、忠冬に、跡継ぎがいないまま、家が絶えました。
        year: 1546
        card: {head: "1546年", body: 鷹司家が絶える}
      - 語り: 近衛家から分かれた、五摂家の一つが、公家の世界から、消えたのです。
        tone: 重い
      # fact: gosekke-17
      - 語り: それから、33年後の、1579年、天正7年。織田信長の口添えで、信房という人が、鷹司の家名を、再興します。
        year: 1579
        card: {head: "1579年", body: 信長の口添えで鷹司家が再興}
      - 語り: 摂関家をよみがえらせたのは、武家の信長の、口添えでした。
      # fact: gosekke-24
      - 語り: 鷹司家をよみがえらせたのは、二条家の生まれの人です。五つの家のあいだでは、養子が、行き来していました。
      # fact: gosekke-10
      - 語り: 松殿家も、江戸時代に、もう一度、よみがえります。1634年、寛永11年。幕府は、九条幸家の子の道基に、松殿家の相続を許しました。
        year: 1634
      # fact: gosekke-10
      - 語り: ただし、1641年には、一代摂家、という言葉が出てきます。道基、1人かぎりの扱いでした。
      # fact: gosekke-10
      - 語り: 道基は、1646年、跡継ぎのないまま亡くなり、松殿家は、再び絶えました。再興から、12年でした。
        tone: 重い
        card: {head: "1646年", body: 松殿家が再び絶える}
      - 語り: 道長の子孫の枝は、こうして、1つ、消えていきました。残った五つの家に、江戸時代は、何を用意していたのか。
        tone: 疑問
        hook: true
      - 語り: まず、幕府が作った決まりです。
        hook: true

  # ================================================================ 第5章 江戸
  - title: 「器用なき者は任ずべからず」　見張られた五つの家　1615年から1858年
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "京都御所 小御所（Ray in Manila 撮影、CC BY 2.0）"}
    year: 1615
    lines:
      # fact: gosekke-26
      - 語り: 1615年、幕府は、禁中並公家諸法度を定めました。その第4条は、摂家であっても、器量のない者は、三公と摂関に任じてはならない、と定めています。
        year: 1615
        card: {head: "1615年", body: 禁中並公家諸法度}
      # fact: gosekke-26
      - 語り: 摂政と関白は、五つの家に限られていきますが、それを、幕府が見張る形になりました。
      # fact: gosekke-24
      - 語り: 五家のあいだでは、養子が行き来しました。一条兼香は、鷹司房輔の末子に生まれ、一条家に養子に入り、1737年に、関白になります。
      # fact: gosekke-25
      - 語り: 家の暮らしぶりには、差がありました。2017年の、東京大学史料編纂所の紀要の論文によれば、一条家の家臣は、3名から6名。ほかの四家は10名を超え、幕末の近衛家は、20名を超えました。
      # fact: gosekke-31
      - 語り: 幕末の旧高旧領取調帳から数えると、領地は九条家がおよそ3000石、近衛家がおよそ2900石。九条家は、尚忠が1000石を加増され、公家で最大になった、といわれます。
        figure: {type: bars, title: 幕末の領地（石）, bars: [[九条家, 3052], [近衛家, 2862]], labels: [3052石余, 2862石余]}
      # fact: gosekke-27
      - 語り: 1858年、通商条約の勅許をめぐる問題をきっかけに、孝明天皇は、前の関白の鷹司政通と、関白の九条尚忠を、遠ざけた、といわれます。関白や摂家の権威は、下がりました。
        year: 1858
      # fact: gosekke-28
      - 語り: 一方、1856年。篤姫が、近衛忠煕の養女となり、その年の旧暦12月18日、13代将軍の家定に、嫁ぎました。
        year: 1856
      - 語り: その五つの家の仕事そのものが、1867年に、終わります。
        tone: 重い
        hook: true
      - 語り: 道長が「この世をば」と詠んだ夜から、およそ850年目の冬でした。
        hook: true

  # ================================================================ 第6章 摂関廃絶と皇后たち
  - title: 「摂関、幕府等廃絶」　最後の摂政と皇后　1867年から
    background: {image: paintings/gosekke_kujo_michitaka.jpg, credit: "九条道孝の肖像（パブリックドメイン。ウィキメディア・コモンズ）"}
    year: 1867
    lines:
      # fact: gosekke-21
      - 語り: 慶応3年12月9日。旧暦です。王政復古の大号令が出て、今から、摂関、幕府などを、廃止する、と宣言されました。
        year: 1867
        card: {head: "1867年12月9日（旧暦）", body: 摂関・幕府を廃止}
      # fact: gosekke-21
      - 語り: 同じ日、摂政の二条斉敬は、その職を失い、参内を止められました。九条道孝も、参朝を止められています。
      # fact: gosekke-22
      - 語り: 二条斉敬は、人臣として、最後の摂政とも、書かれます。道長が摂政になった1016年から数えても、およそ850年。それほど長く続いた役目が、ここで終わりました。
        figure: {type: stats, title: 摂政の始まりと終わり, items: [[道長が摂政に, 1016年], [摂関の廃止, 1867年, およそ850年あと]]}
      # fact: gosekke-23
      - 語り: 藤氏長者と呼ばれた、藤原氏の代表も、最後は、九条道孝でした。1871年まで務めた、とされます。
        figure: null
      # fact: gosekke-32
      - 語り: 1884年、華族令。貴族の身分、華族のうち、旧五摂家は、そろって、いちばん上の位、公爵になりました。
        year: 1884
        card: {head: "1884年", body: 五摂家は公爵に}
      # fact: gosekke-32
      - 語り: 華族の制度は、1869年から1947年まで、78年続きました。
      # fact: gosekke-29
      - 語り: 一条家の忠香の娘は、明治天皇の皇后、昭憲皇太后になりました。
      # fact: gosekke-29
      - 語り: 生まれは、嘉永3年、1850年と、明治神宮は書きます。英語圏の資料には、1849年とあり、公式の生年を、1850年に改めた、という記述もあります。
      # fact: gosekke-30
      - 語り: 九条家の道孝の娘、節子は、大正天皇の皇后、貞明皇后となり、昭和天皇の母になります。
        portrait: {image: paintings/gosekke_teimei.jpg, caption: "貞明皇后（九條節子）"}
      # fact: gosekke-30
      - 語り: その節子は、生まれて7日目から、5年間、東京の高円寺村の農家に、里子に出されて、育ちました。杉並区の広報資料に、あります。
        portrait: null
      # fact: gosekke-03
      - 語り: 近衛家では、文麿が、1937年、45歳で、初めて内閣をつくりました。
        year: 1937
      # fact: gosekke-35
      - 語り: 1947年、日本国憲法が施行され、華族その他の貴族の制度は、認められなくなりました。公爵の身分は、ここで、消えます。
        year: 1947
        card: {head: "1947年", body: 華族制度が終わる}
      - 語り: 摂政も、関白も、公爵も、なくなった。では、五つの家は、今、どこにいるのか。
        tone: 疑問
        hook: true
      - 語り: 手がかりは、道長の日記を守る、陽明文庫です。
        hook: true

  # ================================================================ 第7章 現代
  - title: 五つの家の今　陽明文庫と神社　2026年
    background: {image: paintings/gosekke_konoe_fumimaro.jpg, credit: "近衛文麿（内閣情報部。パブリックドメイン。ウィキメディア・コモンズ）"}
    year: 2026
    lines:
      # fact: gosekke-37
      - 語り: 陽明文庫は、1938年、近衛文麿が、京都に作りました。設立から、88年です。
        year: 1938
        card: {head: "陽明文庫", body: 1938年に設立}
      # fact: gosekke-38
      - 語り: 近衛家に伝わる古文書や宝物を、10万点あまり、収めています。国宝が、御堂関白記のほかに7件、重要文化財が60点あまり、と、杉並区が紹介しています。
      # fact: gosekke-39
      - 語り: 道長の自筆の『御堂関白記』も、その国宝の一つ。2013年に、世界の記憶への登録が決まりました。
        figure: {type: stats, title: 道長の日記と、今, items: [[陽明文庫の設立, 1938年, 88年前], [世界の記憶に登録, 2013年, 13年前], [「この世をば」の夜から, 1008年]]}
      # fact: gosekke-41
      - 語り: 近衛家の当主は、2026年8月の、Forbes JAPANの対談記事で、33代当主の近衞忠大さん、と紹介されています。
        figure: null
        card: {head: "近衛家", body: 33代当主の近衞忠大さん}
      # fact: gosekke-34, gosekke-43
      - 語り: 鷹司家の28代当主、鷹司尚武さんは、2018年に、全国の神社をまとめる、神社本庁の、統理に選ばれました。
        card: {head: "鷹司家", body: 28代当主の鷹司尚武さん}
      # fact: gosekke-34
      - 語り: 戦後の鷹司家には、昭和天皇の三女、和子さまが、1950年に、当主の平通さんと結婚して、迎えられました。
        portrait: {image: paintings/gosekke_takatsukasa_wedding_1950.jpg, caption: "鷹司平通と和子内親王（1950年）"}
      # fact: gosekke-44
      - 語り: 九条家の当主とされる、九條道成さんは、明治神宮の宮司を務め、儀礼文化学会の会長でもあります。
        portrait: null
        card: {head: "九条家", body: 当主とされる九條道成さんは明治神宮の宮司}
      # fact: gosekke-29
      - 語り: 昭憲皇太后は、一条家の生まれ。明治神宮は、その昭憲皇太后を、明治天皇とともに、まつる神社です。
      # fact: gosekke-45, gosekke-46
      - 語り: 二条家と一条家については、当主の名前が、公の発表には、見つかりません。系図の本に名前はありますが、本人や団体の発表は、ないのです。
        card: {head: "二条家・一条家", body: 公の発表に当主の名前は見つからず}
      - 語り: 当主の名前が、公に確かめられるのは、近衛家と鷹司家の2家。九条家は、当主とされる人が、公の役職に就いています。残る2家が絶えた、という意味では、ありません。
        figure: {type: people, title: 五つの家の今, nodes: [[五摂家, 2026年], [近衛家, 当主の名が公に出る], [鷹司家, 当主の名が公に出る], [九条家, 当主とされる人が公職に], [二条家, 公の発表に見つからず], [一条家, 公の発表に見つからず]], edges: [[五摂家, 近衛家, ○], [五摂家, 鷹司家, ○], [五摂家, 九条家, △], [五摂家, 二条家, ？], [五摂家, 一条家, ？]]}
      # fact: gosekke-36
      - 語り: 四つの家の邸の跡が、京都御苑に、今も並んでいます。一條家跡、近衞邸跡、鷹司邸跡、九條邸跡。駒札が立っています。
        figure: null
        portrait: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, caption: "京都御所（京都御苑の中）"}
      # fact: gosekke-36
      - 語り: 九条邸の跡には、茶室の拾翠亭と、池の九条池が、残っています。駒札は20基ありますが、二条邸のものは、ありません。
        portrait: null
      - 語り: 道長が、この世をば、と詠んだ夜から、1008年。その日記は、まだ、子孫の家に、あります。
        tone: しみじみ
        hook: true
      - 語り: では、なぜ、道長の日記は、今も、その家にあるのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：道長の日記は、なぜ今も子孫の家にあるのか
    background: {image: paintings/gosekke_midokanpaku_diary.jpg, credit: "藤原道長自筆『御堂関白記』（陽明文庫蔵。パブリックドメイン）"}
    lines:
      - 語り: 道長の子孫は、五つの家に分かれました。松殿家は、よみがえってもまた絶え、鷹司家は33年途絶え、二条家は45年待たされ、九条家は、家の格を取り戻すのに21年かかりました。
        tone: しみじみ
      # fact: gosekke-19, gosekke-47
      - 語り: 道長の日記が、今も子孫の家にあるのは、近衛家が代々これを伝え、1938年に、近衛文麿が陽明文庫を作って、まとめて守る形にしたからです。
        tone: しみじみ
      - 語り: 役目も、身分も、なくなったあとに、残ったものがあります。道長が自分の手で書いた日記と、それを守る、子孫の家です。
        tone: しみじみ
        pause: 0.8
      - 語り: この世をば、わが世とぞ思ふ。1008年たった今、その歌を詠んだ人の日記を、子孫の家が、静かに伝えています。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
