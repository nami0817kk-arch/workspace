#   1938→2026＝88年（陽明文庫）。2013→2026＝13年（世界の記憶）。華族 1869→1947＝78年。1884→1947＝63年。近衛文麿 1891年10月生→1937年6月＝45歳。
#   師家 1172年生→1183年＝数え12歳。罷免 1184/1/22−就任 1183/11/21＝約2か月。頼経 1218年生→1226年＝数え9歳。
