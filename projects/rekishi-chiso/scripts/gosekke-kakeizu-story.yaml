description_head: |-
  道長が自分の手で書いた日記は、千年あまり、子孫の家に伝わっています。では、その家々は、今どうなっているのでしょうか。
  国宝の『御堂関白記』。ところが道長は、生涯一度も、関白になっていません。道長の子孫は五つの家に分かれ、一度絶えて、織田信長の力でよみがえった家もあります。
  では、その五つの家に、今も家を率いる当主はいるのか。名前が分かる家は、いくつあるのか。
  この動画でわかること
  ・「この世をば」の夜に、道長が実資に持ちかけたことと、歌を書き残したのが道長ではない理由
  ・近衛・松殿・九条の三つに割れた1166年からの経緯と、のちに絶えた松殿家
  ・父に子孫と認められなかった二条家、33年途絶えた鷹司家
  ・1867年に摂政・関白が廃止されたあと、五つの家が皇后や首相、華族の公爵として歩んだ道
  ・今、五つの家の当主の名前が公に分かる家と、道長の日記がある陽明文庫
description_note: |-
  事実は、田島智子「道長詠『この世をば』歌の背景」（『詞林』17号、1995）、三田武繁「家格の秩序と二条家」（東海大学紀要文学部109輯、2018）、田中暁龍の論文（東京大学史料編纂所研究紀要27号、2017）、青山忠正の論文（佛教大学歴史学部論集10号、2020）、国立公文書館・国立国会図書館・京都府立京都学・歴彩館・杉並区・明治神宮の公開資料、報道などで確かめました。
  五摂家の成立の年は研究者のあいだで1つに決まっていません（1252年とみる見方と、1273年とみる三田武繁さんの説）。鷹司家の断絶と再興、松殿家の断絶の年は、出どころが少ない項目です。
  今の当主については、本人の出た記事、団体の公式ページ、報道に出ている肩書きと役割だけを取り上げました。九条家の当主とされる方、二条家・一条家の当主は、団体の公式な発表を探しましたが確かめられておらず、「当主がいない」という意味ではありません。
  画面の風景・室内・人物の後ろ姿は、画像生成AIで作った想像上のイメージで、実在の写真・記録映像ではありません（画面の右上に「AI生成画像」と出しています）。道長・九条道孝・近衛文麿・昭憲皇太后・貞明皇后・天璋院の肖像と写真、鷹司平通と和子内親王の結婚の記念写真（1950年）、紫式部日記絵巻、御堂関白記の図版は、パブリックドメインのものです（ウィキメディア・コモンズなど）。サムネイルは、これらの肖像と写真を丸く切り抜いて並べたものです。

en:
  title: "Family Tree: What Became of Michinaga's Five Regent Houses? Vanished Branches and a Diary"
  description: |-
    Michinaga's own handwritten diary has been handed down in his descendants' house for more than a thousand years. So what has become of those houses today?
    The diary is a national treasure, the Midō Kanpakuki, yet Michinaga never once served as kampaku. His line split into five houses, and one of them, after dying out, was revived by Oda Nobunaga.
    Do those five houses still have a head today? How many can be named from public sources?
    In this video you will learn:
    - What Michinaga asked of Fujiwara no Sanesuke on the night of "this world is mine", and why Michinaga did not record the poem himself
    - How the regent family split into three in 1166, and which branch vanished first
    - The Nijō house, disowned by its own father, and the Takatsukasa house that disappeared for 33 years
    - What the five houses became after the regency was abolished in 1867
    - Which houses have a head named in public sources today, and the Yōmei Bunko that holds Michinaga's diary
    Japanese-language history video (Japanese audio).
  chapters:
    - "Michinaga's Diary Is Still With His Descendants"
    - "\"Three Empresses From One House\", 1018"
    - "One House Splits Into Three, 1166 to 1184"
    - "\"Not My Descendant\": The Nijō House and the Five, 1226 to 1273"
    - "The House That Vanished for 33 Years, 1546 to 1646"
    - "\"Unless Fit for Office\": The Edo Period, 1615 to 1858"
    - "\"Regency and Regents Abolished\", 1867 to 1947"
    - "The Five Houses Today, 2026"
    - "Summary: Why Is Michinaga's Diary Still With His Descendants?"

