#   答えの席＝「五家のうち、今、当主の名前が公に分かる家はいくつか」。題名・サムネで空け、冒頭では「いくつあるのか」と問うだけ。答えは第7章。
#   1本に1つの「なぜ」＝「道長の自筆の日記は、なぜ今も子孫の家にあるのか」（まとめで戻る）。語りは剣崎1人。想像の台詞なし。
#   既出の徳川将軍家の回（11/7）は近衛泰子の縁などに触れていない。篤姫は近衛家の養女の点だけ1行。
#   他チャンネルの同題材：チーム日本史が「五摂家はその後どうなった？」（約9.3万回・21分）を出している。こちらは「消えた枝」と「道長の日記が今も近衛家にある」を軸にし、別の切り口にした。
#   存命の人（近衞忠大・鷹司尚武・九條道成）は、本人の出た記事・団体の公式ページ・報道に出ている肩書きと役割だけ。私生活・家族・住所・健康には触れない。
# 冒頭30秒（1〜5行目。2回目の見直しで1行目を「日記は千年あまり子孫の家に伝わる。ではその家々は今」に）：①1行目で題名の問い＋意外な一点（道長の自筆日記が今も子孫の家に）②知らない事実3つ（自筆日記が今も子孫の家／道長は一度も関白になっていない／信長がよみがえらせた家）
#   ③答えの席（当主の名前が分かる家はいくつ）④約束（道長が栄華を誇ったあの夜から順にたどる）。挨拶・告知・人物紹介・年表は30秒より後。
# 記録の食い違い：①五摂家の成立（1252年説と1273年説）②昭憲皇太后の生年（1850年／英語圏の1849年）③国宝の数（杉並区は御堂関白記のほかに7件、筆の里の展示は6点）④九条・二条・一条の当主は団体の公式発表が無い
# 計算（自分で計算し直した）：
#   1018→2026＝1008年（「千年あまり」）。1018→1166＝148年（「およそ150年」）。1016→1867＝851年。1018→1867＝849年。
