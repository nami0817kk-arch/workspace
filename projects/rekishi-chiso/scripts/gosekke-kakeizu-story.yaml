terms:
  摂政: 幼い天皇に代わって政治をする役。道長も就いた
  関白: 大人の天皇を助けて政治をする最高の役
  摂関家: 摂政・関白になれる家柄
  五摂家: 近衛・九条・二条・一条・鷹司の五つの家
  当主: 家を代表する人。家長
  内覧: 天皇に出す書類を先に見る役。関白に近い役目
  中宮: 天皇の后の位の1つ
  藤氏長者: 藤原氏の長
  華族: 明治から戦後までの特別な身分
  公爵: 華族の位のいちばん上
  陽明文庫: 近衛家に伝わる宝物を守る文庫。京都にある
  統理: 全国の神社をまとめる神社本庁の、いちばん上の役

