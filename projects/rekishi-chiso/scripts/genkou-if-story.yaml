      - 語り: 竹崎季長は、文永の役の翌年、鎌倉へ赴き、御恩奉行の安達泰盛に直訴しました。そして、肥後の海東郷の地頭職を、恩賞として得ます。
        card: {head: "文永の役の翌年", body: 季長が鎌倉で直訴}
      # fact: genkou-if-59
      - 語り: 『世界大百科事典』は、戦後の恩賞は数次にわたって行われたが、十分なものではなく、武士や寺社は不満をつのらせた、と書きます。
      # fact: genkou-if-59
      - 語り: 『日本大百科全書』の「元寇」の項も、戦後の恩賞配分が十分でなく、参戦者の要求を満たすことができなかった、と書いています。
      - 語り: 防衛戦だったので、配るべき新しい領地が、乏しかったのです。
        tone: しみじみ
      # 【想像】季長の気持ち。記録：絵詞は季長の依頼で作られた（呉座勇一）。新しい事実は足さない
      - 人物: 「この戦いのことは、きちんと、残しておかねば。」
        who: 季長想像
        imagined: true
        tone: しみじみ
      # fact: genkou-if-58
      - 語り: 季長が作らせた『蒙古襲来絵詞』は、実際に戦った季長の証言にもとづくので、史料としての価値が高い、と呉座勇一さんは書きます。
      # fact: genkou-if-56
      - 語り: 作った理由は、地頭職を得たのは氏神・甲佐大明神の神恩によるとして、その報恩と、子孫に伝えるため、と推定されています。
      # fact: genkou-if-57
      - 語り: ただし、完成した年は、はっきりしません。巻末の「永仁元年2月9日」の日付は、後世に書き入れられたものだと、『世界大百科事典』は書きます。
        card: {head: "永仁元年", body: 巻末の日付は後世の記入}
      # fact: genkou-if-33
      - 語り: 絵詞は、熊本の大矢野家に伝わり、1890年に皇室へ献納されて御物となり、1989年から国の所有、いまは宮内庁の三の丸尚蔵館にあります。2021年に国宝になりました。
      # fact: genkou-if-38
      - 語り: 先ほどの『八幡愚童訓』には、甲本と乙本の2系統があり、甲本の菊大路家本は、石清水八幡宮が所蔵し、全4巻が現存する、という研究がある、とされます。
      - 語り: 「神風」は、誰の言葉だったのか。
        tone: 疑問
      # fact: genkou-if-21
      - 語り: 服部英雄さんは、寺社が神風を主張して恩賞を求めた面があり、戦った武士には、そうした感覚はなかった、と指摘しているとされます。nippon.com の記事の紹介です。
        tone: 疑問
      # fact: genkou-if-05
      - 語り: 1285年、霜月騒動。平頼綱が、安達泰盛を滅ぼします。『世界大百科事典』は、この乱で、得宗専制が確立した、と書きます。
        card: {head: "1285年", body: 霜月騒動で安達泰盛が滅ぶ}
      # fact: genkou-if-65
      - 語り: 泰盛は、御家人を保護する「弘安徳政」という改革を進めていました。『山川 日本史小辞典』の霜月騒動の項は、その御家人保護の政策に、触れています。
      # fact: genkou-if-66
      - 語り: 1297年の永仁の徳政令は、売ったり質に入れたりした所領を、無償で取り戻させる法です。
      # fact: genkou-if-66
      - 語り: 元寇のあとに貧しくなった御家人の救済が目的でしたが、かえって経済の混乱を招いた、と『旺文社日本史事典』は書きます。
      # fact: genkou-if-67
      - 語り: ただ、元寇の負担と恩賞不足は、幕府が御家人の支持を失う一因とされますが、辞典は「一因」と書くにとどまり、因果を言い切ってはいません。
        tone: しみじみ
      - 語り: 台風がなくても、この恩賞の問題は、起きていたのか。それは、史料からは、言い切れません。
        tone: 重い
        hook: true
      - 語り: 最後に、冒頭の夜に、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：台風が来なかったら、何が言えるのか　1274年と1281年
    background: {image: paintings/genkou_ekotoba_tnm_copy.jpg, credit: "『蒙古襲来絵詞』の模写（福田太華、1846年。東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: 台風が来なかったら、日本は負けたのか。史料と研究から言えるのは、そこまで単純ではない、ということです。
        tone: しみじみ
      # fact: genkou-if-11, genkou-if-12
      - 語り: 1274年の夜の風は、記録が割れ、「撤退を決めたあとに、風に遭った」と読める書き方も、元軍の側の史料にありました。
      - 語り: 夜の風も、帰らなかった数も、船の評価も。この回で並べたのは、割れたままの記録でした。
        tone: しみじみ
        pause: 0.8
      # fact: genkou-if-61, genkou-if-71
      - 語り: 1281年の台風は、本当に吹きました。けれど、その前から、防塁と日本軍の防戦が元軍を阻み、東路軍には疫病が広がっていました。
      - 語り: 台風が来なかった場合の、その先は、研究者も、言い切っていません。言えるのは、ここまでです。
        tone: 重い
      # fact: genkou-if-34, genkou-if-55
      - 語り: 言い切れないものの前で、確かなものが、ひとつあります。博多湾に石を積んだ人たちがいたこと。恩賞を求めて、鎌倉へ向かった人がいたことです。
        tone: しみじみ
      # 余韻の一文：冒頭の夜に戻る。締めは登録のお願いを短く
      - 語り: 新暦の11月26日の夜、波の上から船団が消えた理由は、いまも、ひとつには決まっていません。
        tone: しみじみ
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
