# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  元寇で日本を救った「神風」。その台風が吹いたとされる夜は、今の暦にすると、11月26日ごろです。
  台風の季節ではない。1958年、荒川秀俊さんは、新聞への寄稿でそう指摘しました。
  ところが、1281年の台風は、本当に吹いています。疑われたのは、その7年前、1274年の夜のほうでした。
  同じ夜を、『元史』は風に触れずに書き、『高麗史』は大風雨と書きます。
  もし、あの台風が来なかったら。日本は、どうなっていたのでしょうか。
  この動画でわかること
  ・1274年の夜について、『元史』『高麗史』『八幡愚童訓』の書き方が割れている点
  ・台風の前に、博多湾の石の壁（元寇防塁）と東路軍の疫病が、元軍に何をしたか
  ・1281年の船の数や帰らなかった数が、記録ごとに食い違う点
  ・鷹島の海の底から出てきた船・木の板・矢の部品
  ・台風がなかったら何が言えるのか、研究者が言い切っていないこと
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（長崎県文化財データベース、文化庁の文化遺産オンライン、九州大学、長崎県美術館、nippon.com、共同通信配信の記事、HistoryNet、Archaeology 誌などの記事、世界大百科事典・日本大百科全書・山川 日本史小辞典）を語りで示してから読んでいます。
  『元史』『高麗史』の原文は、中国語版ウィキソース所載の本文をもとにしています。台風がなかったら日本がどうなったかは、史料から言い切れません。
  絵は、『蒙古襲来絵詞』（竹崎季長の依頼で作られた絵巻。パブリックドメイン）の一部と、1846年の模写（東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）です。

en:
  title: "The Mongol Invasions: If No Typhoon Had Come. The 'Divine Wind' Night Was Late November"
  description: |-
    The "divine wind" that is said to have saved Japan from the Mongols blew, by today's calendar, around November 26.
    That is not typhoon season. In 1958, Arakawa Hidetoshi pointed this out in a newspaper article.
    Yet the typhoon of 1281 really did blow. What was doubted was the night of 1274, seven years earlier.
    The Yuan Shi says nothing of wind that night. The Goryeo-sa writes of a great storm.
    If that typhoon had not come, what would have happened to Japan?
    In this video you will learn:
    - How the Yuan Shi, the Goryeo-sa and the Hachiman Gudokun differ on the night of 1274
    - What the stone wall around Hakata Bay and an epidemic did to the Mongol fleet before the typhoon
    - How the records disagree on the number of ships and the number who did not return in 1281
    - The ships, the wooden board and the arrow part that came out of the sea floor off Takashima
    - What can be said, and what researchers have not claimed, about a Japan without the typhoon
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Did a Typhoon Come on a November Night? 1274"
    - "What Did the Mongol Fleet See in Hakata Bay? October 1274"
    - "A Stone Wall Along the Bay: 1275-1276"
    - "The Number of Ships Differed by Record: 1281"
    - "Did the Typhoon Really Blow? 1281"
    - "The Ships That Came Out of the Sea Floor: 2011-2026"
    - "Without the Typhoon, What Can Be Said?"
    - "'The Rewards Fell Short': Takezaki Suenaga"
    - "Summary: What Can Be Said Without the Typhoon?"

