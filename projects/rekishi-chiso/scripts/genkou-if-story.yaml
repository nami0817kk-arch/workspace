  # ================================================================ 第3章 船の数は記録ごとに違った
  - title: 「3500隻か、4400隻か、9000隻か」　1281年
    background: {image: paintings/genkou_ekotoba_tnm_copy.jpg, credit: "『蒙古襲来絵詞』の模写（福田太華、1846年。東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G06（水平線を埋める、数えきれない帆の影の遠景。人物なし）／G07（浜に並ぶ造りかけの大きな木の船体。無人。人物なし）
    year: 1281
    lines:
      # fact: genkou-if-43
      - 語り: 1281年。元は、日本に再び来ました。アメリカの考古学雑誌 Archaeology は、船が3500隻、兵が10万人だったと書きます。
        card: {head: "1281年", body: 3500隻・兵10万人とする数え方}
        figure: {type: bars, title: 1281年の船の数（記録ごと）, bars: [[Archaeology誌, 3500], [英語の解説記事, 4400], [高麗史の金方慶伝, 9000]], labels: [3500隻, 4400隻, 9000隻]}
      # fact: genkou-if-43
      - 語り: 英語の解説記事 The Conversation には、4400隻、14万人以上という数え方があります。HistoryNet の記事では、モンゴルと高麗の兵が4万、水夫が1万7千です。
      # fact: genkou-if-16
      - 語り: 『高麗史』は、同じ江南軍の船を、世家の巻では3500艘、金方慶の伝では9000艘と書いています。1つの歴史書の中でも、数が割れているのです。
        tone: 疑問
      # fact: genkou-if-51
      - 語り: ランドール・ササキさんは、船は、福建のV字底の貨物船、長江流域の船、高麗の平底の上陸用の舟が混ざり、4000隻を超える、と書きます。
        figure: null
      # fact: genkou-if-51
      - 語り: ただし、高麗製と確認できる木材は、無いとも言います。
      # fact: genkou-if-63
      - 語り: 日本に降伏を求める使者は、1279年にも送られました。『世界大百科事典』によると、その使者は、博多で斬首されています。
      # fact: genkou-if-44
      - 語り: 高麗には、二度とも、造船が課されたと伝わります。1279年の使者処刑のあとにも、新たに900隻の建造を命じられた、と HistoryNet の記事にあります。
      # fact: genkou-if-72
      - 語り: 東路軍は、壱岐へ向かいました。『高麗史』の金方慶の伝には、皇帝の命令が、「その月の15日に、壱岐島で会え」と、江南軍と東路軍に出ていた、と書かれています。
        card: {head: "東路軍と江南軍", body: 壱岐島で会う約束だった}
      # fact: genkou-if-71
      - 語り: 台風の前に、東路軍では、疫病が広がりました。『高麗史』は、「軍中、また大いに疫病が広がり、死者は、およそ3000人あまり」と書きます。
        tone: 重い
        card: {head: "約3000人", body: 台風の前に疫病で亡くなる}
      # fact: genkou-if-72
      - 語り: 将軍たちは、戦いの不利と、江南軍の遅れから、撤退を話し合いました。金方慶は、兵糧は足りるので、江南軍を待つべきだと主張した、と『高麗史』にあります。
      # fact: genkou-if-61
      - 語り: 台風の前に、東路軍は、日本の防衛に阻まれ、疫病に苦しみ、将軍たちが撤退を議論していたのです。
        tone: しみじみ
      - 語り: それでも、船団は、日本の海にとどまりました。
        tone: 重い
        hook: true
      - 語り: そして、嵐の日が来ます。
        hook: true

  # ================================================================ 第4章 台風は本当に吹いたのか（通説の検証）
  - title: 「台風は、本当に吹いたのか」　1281年
    background: {image: paintings/genkou_ekotoba_tnm_copy.jpg, credit: "『蒙古襲来絵詞』の模写（福田太華、1846年。東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G08（荒れた灰色の海。大きな波と暗い雲。船は描かない。人物なし）／G09（嵐のあとの、朝の静かな浜。流木と砂だけ。人物なし）
    year: 1281
    lines:
      # fact: genkou-if-15
      - 語り: 『元史』は、1281年8月1日、風が船を破った、と書きます。
        tone: 重い
      # fact: genkou-if-08
      - 語り: 荒川さんも、弘安の役には、確かに神風のお助けがあった、と書いています。
      # fact: genkou-if-15
      - 語り: 5日、范文虎ら将軍たちは、それぞれ堅くて良い船を選んで乗り、兵士10万余りを山の下に捨てて去った、とあります。
      # fact: genkou-if-15
      - 語り: 10万の兵のうち、帰ることができたのは、《3人》だけ。『元史』は、そう書いています。
        tone: 重い
      # fact: genkou-if-16
      - 語り: 『高麗史』も、范文虎の軍は、船3500艘、兵10万余りで来て、大風に遭い、皆、溺れ死んだと書きます。帰らなかった者は、10万余りです。
      # fact: genkou-if-20
      - 語り: 台風の跡を、池の底に探した研究もあります。熊本県の天草にある池で、13世紀の、厚さ63cmの堆積層が見つかりました。
        card: {head: "厚さ63cm", body: 13世紀の堆積層が見つかる}
      # fact: genkou-if-20
      - 語り: 原口強さんらは、2016年の調査で、少なくともかなり大規模な台風に襲われた跡とみて、1281年のものではないか、と結論づけています。
      # fact: genkou-if-17
      - 語り: 『高麗史』が書く東路軍の数字は、少し違います。東征軍9960人と、水夫1万7029人。そのうち、生きて帰った者が、1万9397人です。
        figure: {type: stats, title: 帰らなかった数は、記録ごとに違う, items: [[『元史』（江南軍）, 10万人のうち帰還3人], [『高麗史』（江南軍）, 帰らなかった者10万余], [『高麗史』（東路軍）, 約8割が生還]], upto: 3}
      # fact: genkou-if-17
      - 語り: 計算すると、帰らなかったのは7592人。東路軍の約8割は、生きて帰った計算になります。池田榮史さんも、2024年の記事で、「8割方は生還した」と話した、と伝わります。
        figure: null
      # fact: genkou-if-15, genkou-if-17
      - 語り: 『元史』では、10万人のうち3人。『高麗史』では、東路軍の8割が帰る。同じ台風の被害が、記録によって、これほど違います。
        tone: 疑問
      - 語り: どちらの数字が実態に近いのか、私たちの調べでは、決められませんでした。
        tone: しみじみ
      - 語り: 台風は、本当に吹いた。ただ、その被害をどう数えるかは、記録の側で、割れていたのです。
        tone: しみじみ
      - 語り: 台風は、本当に吹きました。では、台風が来なかったら、あの数字は、どうなっていたのか。
        tone: 疑問
        hook: true
      - 語り: その手がかりは、海の底から出てきました。
        hook: true

  # ================================================================ 第5章 海の底から出てきた船
  - title: 「海の底から出てきた船」　鷹島　2011年から2026年
    background: {image: paintings/genkou_ekotoba_tnm_copy.jpg, credit: "『蒙古襲来絵詞』の模写（福田太華、1846年。東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G10（青い海中。砂の底に、横たわる古い木の骨組みの影。人物なし）／G11（朝の入り江と小さな島の静かな遠景。人物なし）
    year: 2011
    lines:
      # fact: genkou-if-27
      - 語り: 2011年度、琉球大学の調査で、長崎県の鷹島の沖から、竜骨と外板が残る元軍の船の船体が見つかりました。確認された船体の長さは、12mです。
        card: {head: "2011年度", body: 鷹島沖で元軍の船体が見つかる}
      # fact: genkou-if-28
      - 語り: 長崎県の文化財データベースは、約4000点の遺物が出土し、これまで文献と絵画でしか知られなかった蒙古襲来の様子が、明らかになった、と書きます。
      # fact: genkou-if-28
      - 語り: 中国産の陶磁器、木の碇、武器や武具などが、出土しました。
      # fact: genkou-if-26
      - 語り: 2012年3月27日、鷹島神崎遺跡は、水中遺跡として初めて、国の史跡になりました。
      # fact: genkou-if-18
      - 語り: 池田榮史さんによると、1号船と2号船は、船底がV字か丸みを帯び、船室を仕切る隔壁があります。江南軍の船と判断した、と2024年の記事にあります。
      # fact: genkou-if-19
      - 語り: その池田さんは、2012年、鷹島の船の底板について、「見たことがない構造で、丁寧な組み方をしており、粗製乱造ではなかったのでは」と話したと、読売新聞の記事を引いた記事にあります。
        tone: 疑問
      # fact: genkou-if-49
      - 語り: いっぽう、2003年の Archaeology 誌は、鷹島の遺物の貯蔵用の壺は急ごしらえで粗く、錨も粗い二石式で、モンゴル製の出土品は約1%だった、と伝えています。
      # fact: genkou-if-49
      - 語り: 同じ記事は、これは名ばかりのモンゴル軍の侵攻だった、と結論づけています。
      - 語り: 船は、頑丈だったのか、粗末だったのか。研究者のあいだでも、言い方が割れています。
        tone: しみじみ
      # fact: genkou-if-29
      - 語り: 沈没船は、2011年に1号、2015年に2号が確認されています。長崎県美術館の資料にある数え方です。
      # fact: genkou-if-29, genkou-if-30
      - 語り: 3隻目は、2024年10月に確認されました。その船底の木の板には、墨で、「至元十二年」か「至元十三年」と読める文字があった、と報じられています。
        card: {head: "至元十二年か十三年", body: 3号船の木の板に墨書き}
      # fact: genkou-if-30
      - 語り: 松浦市が、2026年4月30日までに発表し、共同通信が配信した記事です。
      # fact: genkou-if-30
      - 語り: 板は、縦12.0cm、横25.2cm、厚さ0.9cm。見出しには、乗員向けの掲示の可能性がある、とあります。
      # fact: genkou-if-31
      - 語り: 2026年8月には、船底の泥から、長さ約3cmの竹の矢筈が見つかった、と報じられました。南宋の矢の特徴と一致し、奈良文化財研究所と高知大学が分析しています。
      - 語り: 見出しは、「南宋から接収し日本戦に転用か」と報じられています。南宋は、1279年に、元に滅ぼされた国です。
        tone: しみじみ
      # fact: genkou-if-32
      - 語り: てつはうは、鷹島で出土したものが、2025年に、長崎県美術館で、国宝『蒙古襲来絵詞』と並べて展示されました。
      # fact: genkou-if-39
      - 語り: 不知火美術館の展覧会の紹介には、鷹島沖の海底から、絵詞に描かれたものとまったく同じ船が発見された、とあります。
      - 語り: 船と、矢と、てつはう。それらが、日本に上陸していたら。
        tone: 疑問
        hook: true
      - 語り: 研究者は、その問いに、どこまで答えているのでしょうか。
        hook: true

  # ================================================================ 第6章 台風がなかったら、何が言えるのか
  - title: 「台風がなかったら、何が言えるのか」
    background: {image: paintings/genkou_ekotoba1_takezaki.jpg, credit: "『蒙古襲来絵詞』の一部（ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G12（夕暮れの博多湾。沖に船影。浜に石の壁。人物なし）／G13（夜の浜の石の壁の上で揺れる、かがり火。人物は後ろ姿の小さな影のみ・顔なし）
    year: 1281
    lines:
      # fact: genkou-if-22
      - 語り: トーマス・コンランさんは、2001年の著書で、日本の武士は、神風の助けがなくても、モンゴル軍を膠着に持ち込めた、と論じました。
      # fact: genkou-if-47
      - 語り: コンランさんは、嵐が来る前に、すでに膠着していたと考え、侵攻軍の規模も、通説よりずっと小さかったとみています。
      # fact: genkou-if-48
      - 語り: これに、杉山正明さんは、異を唱えます。第1次の元軍を、約2万7千人と見積もりました。ただし、日本側が激しく戦った点は、一致している、とされます。書評の要約です。
      # fact: genkou-if-50
      - 語り: いっぽう、ジェームズ・デルガードさんは、嵐が本当にあったのは明らかだが、艦隊の状態が大損害の一因だった可能性を示す証拠がある、としています。これも書評の要約です。
      # fact: genkou-if-52
      - 語り: 元は、日本のあとも、遠くへ兵を出しました。1287年から88年のベトナムでは、白藤江で、川底の杭の罠にかかって、約100隻が沈み、400隻が奪われます。
        card: {head: "1288年3月", body: ベトナムから撤退}
      # fact: genkou-if-52
      - 語り: トガンは、1288年3月に撤退しました。
      # fact: genkou-if-54
      - 語り: 1285年のベトナムからの撤退は、公式には、気候と疫病のためとされました。研究者は、補給線の崩壊のような、直接の原因も重く見ている、とされます。
      # fact: genkou-if-53
      - 語り: 1293年のジャワでは、同盟したラデン・ウィジャヤに裏切られ、占領した土地から追われて、失敗しました。ベトナムやチャンパの遠征も、実りが薄かった、とロッサビさんは概説しています。
      # fact: genkou-if-45
      - 語り: 日本への3度目の遠征も、準備されていました。1286年に、フビライが突然中止した、と Archaeology 誌は書きます。
      # fact: genkou-if-68
      - 語り: 中止の理由は、辞典によって違います。『世界大百科事典』は「中国人の反抗や周囲の反対」。『山川 日本史小辞典』は「フビライの死」です。
        figure: {type: stats, title: 3度目の遠征が止まった理由, items: [[『世界大百科事典』, 中国人の反抗や周囲の反対], [『山川 日本史小辞典』, フビライの死], [世界史の窓, ナヤンの反乱], [Archaeology誌, 1286年に突然中止]], upto: 4}
      # fact: genkou-if-70
      - 語り: 日本の側も、弘安の役のあと、警固の体制を鎌倉末期まで続け、九州に鎮西探題を置きました。
        figure: null
      - 語り: ここで、言えることと、言えないことを、分けます。
        tone: 重い
      # fact: genkou-if-61, genkou-if-22
      - 語り: 言えること。防塁と日本軍の激しい防戦で、元軍は、上陸を阻まれていました。コンランさんのような見方もあります。台風がなければ、日本が負けた、とは言い切れません。
      - 語り: 《言えないこと》。台風がなければ、元が日本を支配したのか、日本が守りきったのか。元軍が上陸して定着した場合を論じた文は、私たちの調べでは、見つかりませんでした。
        tone: 重い
      # 【想像】防塁の上の御家人の気持ち。記録：九州の御家人が国ごとに博多を守った（世界大百科事典）。新しい事実は足さない
      - 人物: 「風が吹かなくても、ここから先へは、行かせない。」
        who: 御家人想像
        imagined: true
        tone: 重い
      - 語り: 台風が来ても、来なくても、変わらなかったことが、ひとつあります。
        hook: true
      - 語り: それは、戦いのあとの、約束でした。
        hook: true

  # ================================================================ 第7章 恩賞が足りない
  - title: 「恩賞が、足りない」　竹崎季長の直訴
    background: {image: paintings/genkou_ekotoba1_takezaki.jpg, credit: "『蒙古襲来絵詞』の一部（竹崎季長。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G14（朝の山道を行く、小さな後ろ姿の旅人の遠景。顔は見えない）／G15（夕暮れの鎌倉の谷と、遠くの屋根。人物なし）
    year: 1275
