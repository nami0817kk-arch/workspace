# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と yoritomo-story.yaml・jeanne-story.yaml の型）。元寇（もしもシリーズ）。2026-10-30 下書き。
# 公開の予定は 11/3 12:00。
# 型：1本に1つの「なぜ」＝「もしも元寇で台風が来なかったら、日本はどうなったのか。そもそも、台風は本当に吹いたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝元寇で日本を救った「神風」が吹いたとされる1274年10月20日の夜は、今の暦にすると11月26日ごろで、台風の季節ではない（荒川秀俊 1958）。
#     ただし1281年の台風は本当に吹いた。疑われたのは7年前の1274年の夜のほう。同じ夜を『元史』は風に触れず、『高麗史』は大風雨と書く。
#   導入では答えを言い切らない。最後に「言えること／言えないこと」を分けて出す。
#   第1章 1274年10月20日、博多湾の元軍は何を見たのか＝記録の食い違い①（元史は風なし・高麗史は大風雨・愚童訓は船が消えた。高麗史の順番は撤退が先で大風雨があと）／
#   第2章 1275〜1276年、使者が斬られ、博多湾に石の壁が築かれた（防塁・異国警固番役・九州大学の2016年の発見）／
#   第3章 1281年、船の数は記録ごとに違った（3500隻・4400隻・9000隻。東路軍の疫病。江南軍の遅れと撤退の議論）＝記録の食い違い②（船の数）／
#   第4章 台風は本当に吹いたのか（元史・高麗史・大蛇池の堆積層・帰らなかった数が割れる）＝記録の食い違い③（帰還の数。通説の検証はこの1章）／
#   第5章 海の底から出てきた船（鷹島。2011年の船体・2012年の国史跡・池田榮史さんと Archaeology 誌で船の評価が割れる・2024年の3号船・2026年の墨書と矢筈）／
#   第6章 台風がなかったら、何が言えるのか（コンラン・杉山・デルガード・ベトナム・ジャワ・第三次遠征・言えること／言えないこと）／
#   第7章 恩賞が足りない（竹崎季長・絵詞・服部英雄さんの指摘・霜月騒動・永仁の徳政令）／まとめ（言えること／言えないこと→冒頭に戻る）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/元寇_facts_20261030.yaml、genkou-if-01〜72）にあるものだけ。行の上に `# fact: genkou-if-NN`。
#   カードに無い「誰でも知っている前置き」（元寇・神風・鎌倉幕府）は短く使い、# fact を付けない。
#   『元史』『高麗史』の原文は、中国語版ウィキソース所載の本文（版本との照合はしていない）。台本では「今の言葉にすると」と言う。
#   WebFetch の要約から取った引用（長崎県文化財データベース・文化遺産オンライン・共同通信の配信記事）は要約。公開前に原文で再確認する。
#   確かめられなかったこと：服部英雄『蒙古襲来と神風』の本文／『八幡愚童訓』『勘仲記』の原文（荒川説の引用を通して）／コンラン・デルガードの本の本文／
#     元軍が上陸・定着していたらどうなったかを論じた研究／てつはうの X 線 CT／文永の役の風の有無を決める日本側の確かな史料。台本では「確かめられなかった」と言う。
#   YouTube の既出の測定は API の上限（429・単位）で測れなかった（カードの youtube 欄が「測れなかった」）。
#   弘安の役の台風の日は『元史』8月1日、荒川・山口は七月晦日夜〜閏七月一日。換算は確かめていないので台本では日付を言わない。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（元史・高麗史・愚童訓）。声は作らない。
#   想像の台詞は3か所（時宗想像・御家人想像・季長想像。config の roles に足した）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の genkou_ekotoba1_takezaki（蒙古襲来絵詞、竹崎季長。パブリックドメイン）・genkou_ekotoba_tnm_copy（蒙古襲来絵詞の1846年の模写。東京国立博物館蔵。パブリックドメイン）＋ AI 絵（G01〜G15、一覧は dev/output/rekishi-chiso/research/genkou_ai_images.md）。
#   AI 絵の人物は遠景・後ろ姿だけ。戦闘・負傷・遺体は描かない。実在の誰か・俳優に似せない。顔が分かるのは実在の絵だけ。
# 広告の配慮：戦闘・負傷・死の場面は描かない（絵詞の戦いの絵は部分だけ・額）。
