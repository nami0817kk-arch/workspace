sections:
  # ================================================================ 序章（冒頭 約2分30秒）
  - title: 「新暦11月26日の夜に、台風は来たのか」　1274年
    background: {image: paintings/genkou_ekotoba_tnm_copy.jpg, credit: "『蒙古襲来絵詞』の模写（福田太華、1846年。東京国立博物館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G01（夜明けの博多湾。沖に霧と船影の遠景。人物なし）
    year: 1274
    lines:
      # fact: genkou-if-07
      - 語り: 元寇で日本を救った「神風」。その台風が吹いたと言われる夜は、今の暦にすると、《11月26日》ごろです。
        tone: 重い
        card: {head: "1274年10月20日", body: 今の暦で11月26日ごろ}
      # fact: genkou-if-07
      - 語り: 台風の季節では、ありません。1958年、荒川秀俊さんが、新聞への寄稿で、そう指摘しました。
      # fact: genkou-if-08
      - 語り: ただし、1281年の台風は、本当に吹きました。荒川さん自身も、そこは認めています。疑われたのは、その7年前、1274年の夜のほうです。
        tone: 疑問
      # fact: genkou-if-13
      - 語り: この夜について、元の歴史書『元史』には、風の話がありません。官軍はまとまらず、矢も尽きたので、四方を荒らして帰った、とだけ書いてあります。
        card: {head: "『元史』", body: 風の話は書かれていない}
      # fact: genkou-if-11
      - 語り: 同じ夜を、高麗の歴史書『高麗史』は、今の言葉にすると、こう書きます。「夜、大風雨があり、戦艦は岩や崖に触れて、多く壊れた」。
        card: {head: "『高麗史』", body: 夜に大風雨があった}
      # fact: genkou-if-09
      - 語り: 日本側の『八幡愚童訓』が書くのは、昨日の夕方まで海にひしめいていた賊の船が、《一艘もなかった》、ということだけです。
      - 語り: 風が吹いたのか。それとも、船団が、自分で引き揚げたのか。同じ夜の答えが、記録によって割れています。
        tone: 疑問
      # fact: genkou-if-14
      - 語り: しかも、この夜のあと、高麗の軍は、1万3500人あまりが帰らなかったと、『高麗史』は書いています。
        tone: 重い
        card: {head: "1万3500人あまり", body: 帰らなかった軍の数}
      # fact: genkou-if-40
      - 語り: 英語の記事には、この夜の嵐での損失を、最大300隻、1万3500人と伝えるものもあります。
      - 語り: もし、あの夜、風が吹かなかったら。日本は、どうなっていたのか。
        tone: 疑問
        hook: true
      - 語り: その答えを考える前に、博多湾では、何が起きていたのでしょうか。
        hook: true

  # ================================================================ 第1章 博多湾の元軍は何を見たのか
  - title: 「博多湾の元軍は、何を見たのか」　1274年10月20日
    background: {image: paintings/genkou_ekotoba1_takezaki.jpg, credit: "『蒙古襲来絵詞』の一部（竹崎季長が戦う場面。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G02（朝の博多湾。浜に並ぶ小さな船影の遠景。人物なし）／G03（夜の海の暗い波。船の影が遠くに消えていく遠景。人物なし）
    year: 1274
    lines:
      # fact: genkou-if-40
      - 語り: 1274年、元と高麗の連合軍が、博多湾に来ました。史料によって、最大900隻、兵2万3000人と伝わります。
        card: {head: "1274年", body: 最大900隻・2万3000人}
      # fact: genkou-if-24
      - 語り: 研究者の見積もりも割れています。池内宏さんは約3万3千人、相田二郎さんは『高麗史』にもとづいて約3万9700人とし、どちらも4万以下です。
      # fact: genkou-if-41
      - 語り: いっぽう、日本の側は、約6000人と、日本の歴史家は見積もっています。アメリカの歴史雑誌 HistoryNet の記事は、そう書いています。
      # fact: genkou-if-69
      - 語り: 戦いは、元軍が優勢でした。『山川 日本史小辞典』は、日本軍は元の兵器や集団戦法に苦戦して、大宰府へ退いた、と書きます。
      # fact: genkou-if-12
      - 語り: ここから、元軍の将軍たちの夜です。『高麗史』によると、元軍の司令官は、兵法の句を引いて、戦いを続けず、兵を引くように主張しました。
      # fact: genkou-if-12
      - 語り: 元の将軍の1人は、流れ矢に当たって、先に舟に登りました。軍は、そのまま引き上げた、とあります。
      # fact: genkou-if-11, genkou-if-12
      - 語り: 『高麗史』の順番では、引き上げが先で、大風雨は、そのあとです。ある人が、水に落ちて亡くなった、とあります。
        tone: 重い
      - 語り: 「風が吹いたから、撤退した」のではなく、「撤退のあとに、風に遭った」と読める書き方が、元軍の側の史料にあるのです。
        tone: 疑問
      # fact: genkou-if-08
      - 語り: 荒川さんが挙げた根拠は、3つ。季節。確かな文書に、大風雨の記載がないこと。そして、1281年の台風と、混ざった可能性です。
        figure: {type: stats, title: 荒川秀俊さんの3つの根拠, items: [[季節, 新暦11月26日ごろ, 台風は考えにくい], [記録, 確かな文書に大風雨の記載がない], [混同, 1281年の台風と混ざった可能性]], upto: 3}
      # fact: genkou-if-10
      - 語り: 荒川さんの新説を論じた山口秀樹さんは、1961年、「文永の役の神風には、どうも腑に落ちない点を持ち続けている」と書きました。
        figure: null
      # fact: genkou-if-10
      - 語り: ただし、その論文も、結論は、軍議で引き揚げを決めた、という荒川さんの見方に寄っています。
      # fact: genkou-if-14
      - 語り: 荒川さんは、1万3500人あまりの大部分を、流行病で亡くなった人と見ていた、と山口さんの論文は書いています。
        tone: 重い
      # fact: genkou-if-23
      - 語り: 戦後の学説は、大きく2つに分かれる、とされます。台風ではないが大嵐はあった、という説と、天気に関係なく、威力偵察で早く引き揚げた、という説です。
      # fact: genkou-if-42
      - 語り: 英語圏の記事にも、同じ迷いがあります。Archaeology 誌は、元軍は、日本の援軍と、慣れない浜辺の天気を、警戒したのかもしれない、と書きます。
      - 語り: 風は、あったのか、なかったのか。私たちの調べでは、日本側の確かな記録は、確かめられませんでした。
        tone: しみじみ
      - 語り: ただ、船団が去ったあとも、日本は、これで終わりだとは思いませんでした。
        tone: 重い
        hook: true
      - 語り: 1275年、鎌倉に、元から使者が来ます。
        hook: true

  # ================================================================ 第2章 石の壁
  - title: 「石を積め」　1275年から1276年、博多湾の石の壁
    background: {image: paintings/genkou_ekotoba1_takezaki.jpg, credit: "『蒙古襲来絵詞』の一部（ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：G04（朝の砂浜に続く、積みかけの低い石の壁。人物なし）／G05（松林の海岸線に、長く続く石の壁の遠景。人物なし）
    year: 1275
    lines:
      # fact: genkou-if-62
      - 語り: 1275年4月15日、元の使者・杜世忠らは、長門の室津に着きました。そのまま鎌倉へ送られ、竜口で首を斬られます。
        card: {head: "1275年", body: 元の使者が竜口で斬られる}
      # fact: genkou-if-62
      - 語り: 『世界大百科事典』の北条時宗の項は、時宗が、使者を竜ノ口に斬るなど、一貫して対モンゴル強硬政策をとった、と書きます。
      # 【想像】時宗の気持ち。記録：時宗が一貫して強硬策をとった（世界大百科事典）。新しい事実は足さない
      - 人物: 「ここで引けば、次は、もっと大きな船で来る。」
        who: 時宗想像
        imagined: true
        tone: 重い
      # fact: genkou-if-64
      - 語り: 時宗は、九州に所領を持つ御家人に、九州へ下るよう命じました。西国の守護職や重要な所領は、北条一門で占めます。
      # fact: genkou-if-60
      - 語り: 九州の御家人は、国ごとに交代で、博多を守る役を負いました。「異国警固番役」です。1年のうち3か月ずつ、九州の国が分担した、と『世界大百科事典』にあります。
      # fact: genkou-if-61
      - 語り: 1276年3月ごろ、博多湾の浜辺で、石の壁の築造が始まります。負担は、地域ごとに九州の領主たちに課され、8月ごろに完成した、とされます。
        card: {head: "1276年3月ごろ", body: 博多湾に石の壁の築造が始まる}
      # fact: genkou-if-34
      - 語り: 文化庁の「文化遺産オンライン」の解説では、鎌倉幕府は、1276年以降、九州9か国に命じて、所領の広さに応じた長さを割り当てて、築かせました。
      # fact: genkou-if-34
      - 語り: この石の壁は、1931年3月30日に、国の史跡に指定されました。管理団体は、福岡市です。
      # fact: genkou-if-35
      - 語り: 福岡市の今津地区では、毘沙門山と柑子岳のあいだ、約3.9kmにわたって築かれ、現存するのは約2.7kmです。高さ約3m、下の幅約3m、上の幅約2mの台形でした。
      # fact: genkou-if-37
      - 語り: 2016年9月、九州大学の箱崎キャンパスで、南北17m以上の石積みが見つかりました。薩摩国が分担した防塁の一部の可能性が高い、と九州大学が発表しています。
        card: {head: "2016年9月", body: 九州大学で石積みが見つかる}
      # fact: genkou-if-61
