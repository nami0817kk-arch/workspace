sections:
  # ================================================================ 序章。答えの席：なぜ切腹ではなく斬首だったのか
  - title: 近藤勇は、なぜ切腹ではなく斬首だったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      - 語り: 新選組の局長、近藤勇の最期は、切腹ではなく、板橋での斬首でした。
      # fact: kondo-01, kondo-43
      - 語り: ところが、捕まったとき、近藤は、自分を近藤勇とは名乗っていません。名乗った名は、《大久保大和》。
        tone: 重い
      # fact: kondo-16
      - 語り: 土佐の記録によれば、正体を確かめるため、官軍は、かつての新選組の仲間を呼び、戸の隙間から、のぞかせました。
      # fact: kondo-26, kondo-29
      - 語り: そして、取り調べの場で近藤をかばったのは、意外にも、敵の薩摩でした。
        tone: 重い
      # fact: kondo-29
      - 語り: 薩摩の案は、近藤を、そのまま京都へ送る。死罪さえ免れるかもしれないほど、寛大なものでした。
      # fact: kondo-78
      - 語り: 幕府に取り立てられた侍なら、切腹という道もあったはずです。それなのに、なぜ、首を斬られたのか。
        tone: 疑問
      # fact: kondo-54, kondo-55
      - 語り: その答えに近い言葉が、処刑の場に立てられた札に、残っています。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 勝沼
  - title: 1868年3月、甲州勝沼　170人の隊は「1万人」を名乗った
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      - 語り: 慶応4年、1868年の春。鳥羽・伏見の戦いに敗れた幕府の側は、江戸へ引き揚げていました。
      # fact: kondo-78
      - 語り: 近藤は、甲府へ向かう隊を任され、名を変えます。大久保剛。のちに名乗る、大久保大和の、もとになった名です。
      # fact: kondo-78
      - 語り: 1903年の伝記、松村巌の『近藤勇』は、このとき、金3,000両と、大砲8門、小銃300挺が渡された、と書いています。
      # fact: kondo-80
      - 語り: 日野市が紹介した、当時の村々への回し文によれば、隊が甲州の鶴瀬のあたりまで来たときには、もう、官軍が甲府城に入っていました。
        tone: 重い
      # fact: kondo-76
      - 語り: 明治21年、1888年の山梨の本、『峡中沿革史』は、勝沼に着いた隊の様子を、こう書きます。
      # fact: kondo-76
      - 語り: 兵は170人。それなのに、1万人と称して、勝沼の宿場の、すべての家に、隊の宿の札を掲げた。
        tone: 重い
        card: {head: "『峡中沿革史』1888年", body: "兵は170人で「1万人」と称した"}
      # fact: kondo-77, kondo-48
      - 語り: 隊の人数は、170人とも、200人あまりとも書かれます。迎え撃つ官軍は、1,200人ほどという記録もあります。
      # fact: kondo-74
      - 語り: 土佐藩の届は、戦いを、3月6日の正午ごろ、勝沼の鳥居坂、と書きます。今の暦では、3月29日です。
        card: {head: "1868年3月6日", body: "勝沼・柏尾の戦い"}
      # fact: kondo-82
      - 語り: 甲州市の教育委員会は、これを、山梨県でただ1つの、戊辰戦争の地上戦としています。戦いは、2時間ほどだったとされます。
      - 語り: 隊は崩れ、江戸の方へ退きます。
      # fact: kondo-51
      - 語り: この一戦は、のちに、近藤の罪として、名指しで数えられることになります。
      # fact: kondo-79
      - 語り: 勝沼で、なぜ官軍に手向かったのか。のちに問われた近藤は、ある男の名を挙げます。その男は、記録の中で、近藤自身の影と重なっていきます。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 五兵衛新田
  - title: 五兵衛新田の19日間　近藤が自由に過ごした最後の場所
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-84
      - 語り: 3月13日の夜。近藤たちは、江戸の北の、五兵衛新田という村に入ります。今の東京都足立区の、綾瀬です。
      # fact: kondo-84
      - 語り: 足立区立郷土博物館によれば、着いたときは48人。土方歳三が来た15日には100人を超え、4月1日には、227人になっていました。
        card: {head: "五兵衛新田", body: "48人 → 227人"}
      # fact: kondo-85
      - 語り: 名主見習いの屋敷だけでは入りきらず、村の家や、観音寺にも、分かれて泊まります。
      # fact: kondo-87
      - 語り: この村での日々が分かったのは、昭和50年。金子家から、当時の文書が見つかったからです。
      # fact: kondo-87
      - 語り: それまで、隊は、会津へ向かう途中に、流山に2週間ほどとどまった、と見られていました。その前の19日間を、隊は、この村で過ごしていたのです。
      # fact: kondo-86
      - 語り: 金子家に伝わる3月29日の書状では、幕府の代官が、流山へ移ろうとする大久保大和に、五兵衛新田にとどまるよう、伝えています。
      # fact: kondo-88
      - 語り: 近藤は、村を去るとき、金子家に、礼金と、自分の写真を残したと伝わります。
      # fact: kondo-88
      - 語り: 足立区の解説は、五兵衛新田を、近藤勇が自由な生活を過ごした、最後の場所、と呼んでいます。
        tone: しみじみ
      # fact: kondo-89
      - 語り: 4月1日。官軍の一部が、千住の宿場に現れます。隊は、その夜のうちに動き出し、2日の朝には、下総の流山にいました。
      # fact: kondo-91, kondo-90
      - 語り: 流山の本陣は、長岡屋という酒屋。司馬遼太郎の『燃えよ剣』以来そう言われてきましたが、別の家だという説もありました。
      # fact: kondo-90
      - 語り: 地元の恩田家に残る記録で、本陣は、その長岡屋、長岡七郎兵衛の家だと確かめられています。
      # fact: kondo-92
      - 語り: その翌日。流山の宿場から、住む人たちの姿が消えます。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 流山
  - title: 4月3日、流山　近藤はなぜ自分から官軍の陣へ出ていったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-90
      - 語り: 4月3日。恩田家の記録によれば、彦根、長州、薩摩、大村の兵、870人から880人が、鳩ヶ谷の宿場から出てきました。
      # fact: kondo-90
      - 語り: 兵は、宿場の大坂屋の前で3つに分かれ、本陣に大砲を向けます。
        card: {head: "1868年4月3日", body: "官軍 870〜880人が流山を囲む"}
      # fact: kondo-92
      - 語り: 宿場の人たちは、大人も子どもも、近くの村へ逃げ去りました。
        tone: 重い
      # fact: kondo-93
      - 語り: 彦根藩の届では、官軍が流山へ向かったのは、申の刻。今の夕方4時ごろです。
      # fact: kondo-93
      - 語り: 隊の長を呼び出すと、まず出てきたのは、内藤と名乗る者と、ほか2人。土方歳三は、このころ、内藤隼人と名乗っていました。
      # fact: kondo-12
      - 語り: そのあとに出てきた、大久保大和と名乗る男が、大砲3門と、小銃118挺を差し出します。
        card: {head: "彦根藩の届", body: "大砲3門・小銃118挺を差し出す"}
      # fact: kondo-17
      - 語り: 土佐の記録では、大和は、こう答えました。身分の低い者たちが、勝手に武器を持って逃げ出した。それを取り締まりに来た。官軍に逆らう気は無い。
      - 語り: では、近藤は、なぜ、隊を残して、官軍の陣へ出ていったのか。この理由が、記録ごとに違います。
        tone: 疑問
      # fact: kondo-35
      - 語り: 明治9年、1876年の『文明史略』。近藤は、自分ひとりの死で囲みを解こうと、馬で、ひとりで官軍の陣に来た。
      # fact: kondo-36
      - 語り: 1903年の、松村巌の伝記。近藤は、その場で自害しようとした。それを、土方が止めた。鎮撫に来たと言えば、言い逃れの道はある。今死ぬのは早い。
      # fact: kondo-38
      - 語り: 明治の漢学者、依田学海の書いた話は、逆です。土方は、官軍はうそが多い、行くな、と止めた。近藤は聞かずに、ひとりで向かい、待ち伏せに捕らえられた。
      # fact: kondo-38
      - 語り: 松村巌は、この話を、おそらく事実ではない、と退けています。
      # fact: kondo-15
      - 語り: そして、官軍の土佐藩の家の記録。流山では、証拠が無いので、捕らえなかった。
      # fact: kondo-15
      - 語り: 土佐の上田楠次が、こう言って連れ出した。あなたは隊長なのだから、総督府へ出て、事情を話し、お詫びをするように。わたしも一緒に行こう。
        tone: 重い
        figure: {type: table, title: 近藤はなぜ官軍の陣へ出ていったのか　記録の違い, cols: [書かれた時期, 書き方], rows: [[『文明史略』, 1876年, ひとりの死で囲みを解こうとした], [松村巌『近藤勇』, 1903年, 自害しようとして土方が止めた], [依田学海の文, 明治, 土方は行くなと止めた], [土佐藩の家の記録, 官軍の側, 上田楠次が一緒に行こうと連れ出した]], upto: 4}
      # fact: kondo-41
      - 語り: 昭和3年、1928年に東京日日新聞が連載した『戊辰物語』は、これを、官軍の参謀、香川敬三の、ペテンと書きました。
        figure: null
      # fact: kondo-32
      - 語り: 官軍にいた土佐の侍、谷干城。のちに、この時のことを書き残した人です。
      # fact: kondo-32
      - 語り: 長州の記録は、近藤を縛って、檻で送った、と書きました。谷は、これを、大きな誤りだ、と打ち消しています。谷によれば、近藤は、縛られずに、連れて行かれたのです。
      # fact: kondo-97
      - 語り: 1903年の伝記では、近藤について行ったのは、相馬肇、野村利三郎ら、2人か3人だけでした。
      # fact: kondo-98
      - 語り: 流山に残った隊士たちは、4月6日、会津へ向けて出発します。
      # fact: kondo-99
      - 語り: 土方は、4月の半ば、国府台で、大鳥圭介の軍に加わります。近藤と土方が、ふたたび会うことは、ありませんでした。
        tone: しみじみ
      - 語り: 陣に着いた近藤は、大久保大和で通そうとします。けれど、それを許さない目が、官軍の中にありました。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 正体
  - title: 1868年4月、大久保大和の正体は誰が見破ったのか　戸の隙間からのぞいた元の仲間
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-13
      - 語り: 誰が、どこで、大久保大和を、近藤勇だと見破ったのか。ここでも、記録の書き方は食い違います。
      # fact: kondo-13, kondo-95
      - 語り: 彦根の井伊家の記録では、見破ったのは、彦根の小隊長、渡辺九郎左衛門。渡辺は、かつて京都の会議の場で、近藤の顔を見ていました。
      # fact: kondo-13
      - 語り: 大和は、その夜のうちに越谷へ。翌日には、板橋の本陣へ差し出された、と書きます。
      # fact: kondo-16
      - 語り: 伊東甲子太郎は、前の年に、新選組に殺された男です。その一派だった者が、薩摩の軍にいました。
      # fact: kondo-16
      - 語り: 谷干城の記録、『東征私記』では、確かめたのは板橋です。その者を呼び、戸の隙間から、のぞかせた。思ったとおり、近藤勇だった。すぐに縛らせた。
        tone: 重い
      # fact: kondo-35
      - 語り: 明治9年の『文明史略』では、見つけたのは、伊東の弟子だった、加納鷲雄です。
      # fact: kondo-35
      - 語り: 加納は、官軍の有馬藤太に知らせたうえで、近藤の前に来て、久しぶりのあいさつをした。近藤は驚いて、本当の名を明かした。
      # fact: kondo-40
      - 語り: 1928年の『戊辰物語』は、もっと芝居がかっています。加納が、やあ珍しや近藤氏、と声をかけ、近藤は、君がいたのでは仕方がない、と苦笑いした。
      # fact: kondo-40
      - 語り: 加納は、のちのちまで、この時くらい愉快なことはなかった、と言っていたそうです。
        figure: {type: table, title: 正体を見破ったのは誰か　記録の違い, cols: [見破った人, 場所・確かめ方], rows: [[彦根の井伊家の記録, 渡辺九郎左衛門, 京都で顔を見知っていた], [谷干城『東征私記』, 元の伊東派の者, 板橋で戸の隙間から], [『文明史略』, 加納鷲雄, 官軍の陣であいさつ]], upto: 3}
      # fact: kondo-96
      - 語り: 官軍の総督府の日記は、淡々としています。4月4日、上田楠次が戻り、流山の大久保大和守は、新撰組の隊長、近藤勇だ、と報告した。
        figure: null
      # fact: kondo-18
      - 語り: 翌5日、近藤を問いただし、牢に入れた。江戸から近藤への手紙を届けに来た、隊士の相馬肇も、捕らえた。
      # fact: kondo-22
      - 語り: 近藤は、取り調べで、幕府の重臣、大久保一翁の命令で、鎮撫に出た、と言いました。大久保一翁は、大久保大和とは、別の人です。
      # fact: kondo-22
      - 語り: けれど、呼ばれた徳川の目付は、大久保大和という家来はいない。近藤なら、とうに脱走した者だ、と答えます。
        tone: 重い
      # fact: kondo-79
      - 語り: 勝沼で、なぜ官軍に手向かったのか。そう問われると、近藤は、近田勇平という、過激な浪士が、しきりに戦いを唱えた、と答えました。
      # fact: kondo-79
      - 語り: 谷干城は、その近田勇平も、勇自身かもしれない、と書き添えています。1929年の『近藤勇ト土佐勤王党』は、はっきり、近藤の仮の名だとしています。
        card: {head: "勝沼で手向かったのは？", body: "「近田勇平」＝近藤自身の仮の名か"}
      - 語り: 名を変え、名を借りて、近藤は、生きる道を探していました。その近藤の扱いをめぐって、総督府では、意外な者が、近藤をかばいます。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 斬首の決定
  - title: 薩摩と土佐が割れた板橋の総督府　なぜ切腹ではなく斬首に決まったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-24
      - 語り: 谷干城の『東征私記』によれば、近藤は、縁側の下に、むしろを敷いて座らされ、問いただされました。
      # fact: kondo-24
      - 語り: 近藤は、古い傷を理由に、寛大な扱いを願います。鳥羽・伏見の戦いの少し前に、京都の竹田街道で、伊東の一派に撃たれた傷でした。願いは、聞き入れられませんでした。
      # fact: kondo-25
      - 語り: 流山に出たのは、勝安房、つまり勝海舟の命令ではないか。そう問われると、近藤は、決して、そのようなことはない、と打ち消しました。
      # fact: kondo-30
      - 語り: 弾薬は、江戸を出るとき、ひとり千発ずつ受け取ったが、途中で、400発か500発に減った、とも答えています。
      # fact: kondo-26
      - 語り: 土佐の谷たちは、勝や大久保との関わりを吐かせるため、拷問してでも問い詰めたい、と考えました。
      # fact: kondo-26
      - 語り: ところが、同じ席にいた薩摩の平田が、これを止めます。近藤も、卑しい者ではない。数十人の隊長を命じられたほどの者だ。拷問は、よくない。
      # fact: kondo-27
      - 語り: 谷たちは、言い返します。近藤には、位も無い。徳川から隊長に任じられたのでもない。ほとんど、博徒の頭と同じだ。拷問を遠慮することはない。
        tone: 重い
        card: {head: "谷干城『東征私記』", body: "ほとんど博徒の頭と同じ"}
      # fact: kondo-26
      - 語り: 谷は、こう記しました。勝海舟たちとの関わりを問われないよう、薩摩の参謀、伊地知正治が、平田に言い含めたに違いない。
      # fact: kondo-28
      - 語り: 話は総督のもとへ持ち込まれ、伊地知は、この論を採らないなら、兵を率いて帰る、と言うほどの勢いで、総督に迫りました。
        tone: 重い
      # fact: kondo-28
      - 語り: 総督は、土佐の側に、こらえてくれ、と頼みました。谷たちは、歯ぎしりして、涙をぬぐい、黙りました。
      # fact: kondo-29
      - 語り: そのうえ、薩摩の案は、近藤を、そのまま京都へ送る、というものでした。谷の言葉では、すこぶる寛大で、死さえ免れるかもしれないほどだった。
      # fact: kondo-29
      - 語り: この件は、江戸へ向かう全軍の総大将、大総督の宮に伺うことになり、こう決まりました。斬首して、京都へ送る。
        tone: 重い
        card: {head: "大総督の宮に伺って決まる", body: "斬首して京都へ送る"}
      # fact: kondo-23
      - 語り: 総督の名で太政官にあてた書には、官軍の参謀、香川敬三の名があります。諸藩の兵は、前から、近藤の肉を食いたいほど憎んでいる。京都で、さらし首にしてほしい。
      # fact: kondo-23
      - 語り: 明治政府がまとめた記録集、『復古記』の編者は、議論が途中で変わったので、この書は、出されなかったらしい、と注を付けています。
      # fact: kondo-31
      - 語り: 谷は、言い逃れを重ねる近藤を、名にも、評判にも似ない、卑しい男、と書き捨てました。
      - 語り: では、なぜ、切腹ではなかったのか。
        tone: 疑問
      - 語り: 斬首と決めた理由を、そのまま書いた記録は、今回たどった中には、ありません。
      # fact: kondo-22, kondo-27
      - 語り: けれど、手がかりはあります。徳川の目付は、大久保大和という家来はいない、と言いました。谷は、博徒の頭と同じだ、と言いました。
      # fact: kondo-33
      - 語り: 土佐は、近藤を、坂本龍馬と中岡慎太郎を斬った者だと、にらんでいた、という話もあります。
      # fact: kondo-33
      - 語り: けれど、今回たどった記録では、この理由を書くのは、1929年の、土佐の側の本です。谷自身の『東征私記』には、書かれていません。
      # fact: kondo-54, kondo-55
      - 語り: そして、もう1つの手がかりは、処刑の場に立てられた札です。4月25日。近藤は、板橋の宿場のはずれへ、連れ出されます。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 板橋
  - title: 慶応4年4月25日、板橋　投降から22日と、辞世とされる詩
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-58
      - 語り: 近藤が置かれていたのは、板橋の平尾宿の脇本陣、名主の豊田市右衛門の家でした。
      # fact: kondo-101
      - 語り: 投降から斬首までの、22日の間に、近藤が託したという直筆の短冊が、2026年の9月、長野県の下諏訪町で、初めて公開されると報じられました。
        card: {head: "2026年9月の報道", body: "近藤が託した直筆の短冊"}
      # fact: kondo-101
      - 語り: 託された相手は、岩倉具視の部下、市岡晋一郎。面会か護送の役目で、近藤のもとを訪れたとみられています。
      # fact: kondo-34
      - 語り: 4月25日。1929年の本によれば、近藤は、役人に頼んで床屋を呼び、ひげを剃らせてから、刑に就きました。
        tone: 重い
      # fact: kondo-34
      - 語り: 見物の人だかりの中には、おいの勇五郎が、たまたま居合わせた、ともあります。
      # fact: kondo-59
      - 語り: 場所は、板橋の平尾宿の一里塚のあたり。北区の解説は、一里塚で斬首の刑を受けた、と書き、板橋の郷土史の会は、一里塚近くの、馬捨て場だった、としています。
      # fact: kondo-20
      - 語り: 刀を振るったのは、美濃の岡田将監の隊の、元家来の横倉。岡田自身の、従軍の記録にある名です。
      # fact: kondo-19
      - 語り: 総督府の日記は、この日、近藤と一緒に、付き従っていた新撰組の1人も斬った、と記します。
      # fact: kondo-102
      - 語り: 近藤勇、数えで35歳。満では33歳でした。今の暦では、1868年5月17日のことです。
        tone: しみじみ
        card: {head: "慶応4年4月25日", body: "板橋で斬首　数え35歳"}
      # fact: kondo-54
      - 語り: その場に立てられた札の写しが、当時の江湖新聞に載っています。札は、近藤を、こう書き出していました。
      # fact: kondo-55
      - 語り: 元来、浮浪の者。
        tone: 重い
      # fact: kondo-55
      - 語り: 大久保大和と名を変え、徳川の内々の命令だと偽った。その罪は、数えきれない。
      - 語り: 札の言葉は、近藤を、侍としては扱っていない、と読めます。切腹は、侍に許された死に方でした。
        figure: {type: table, title: なぜ斬首だったのか　記録に残る手がかり, cols: [書かれた言葉, 時期], rows: [[徳川の目付, 大久保大和という家来はいない, 取り調べ], [谷干城『東征私記』, ほとんど博徒の頭と同じ, 取り調べ], [処刑の場の札, 元来、浮浪の者, 処刑の日]], upto: 3}
      # fact: kondo-43
      - 語り: 江戸の中外新聞は、板橋で死刑になった、と伝え、実に惜しむべし、と書きました。
        figure: null
      - 語り: 近藤の辞世として、よく知られる漢詩があります。孤軍、援け絶えて、俘囚となる。味方の助けが絶え、捕らわれの身となった、という句です。
      # fact: kondo-45
      - 語り: ところが、当時の中外新聞は、この詩を、作者不詳として載せていました。近藤が刑に臨んだときの詩だ、ともいう、と添えて。
      # fact: kondo-46
      - 語り: 明治13年、1880年の詩集、『明治回天集』では、同じ詩が、辞世ではなく、甲斐へ向かう途中の作、として載っています。
        card: {head: "『明治回天集』1880年", body: "辞世ではなく「甲斐へ向かう途中の作」"}
      # fact: kondo-45
      - 語り: 昭和13年、1938年、歴史学者の徳重浅吉は、誰かが近藤になぞらえて作ったものだろう、と見ています。
      - 語り: 辞世だったのか、旅の途中の詩だったのか。ここでも、記録は食い違います。
      # fact: kondo-61, kondo-66, kondo-68, kondo-69
      - 語り: そして、斬られた首は、京都へ向かいます。いま、近藤勇の墓や首塚とされる場所は、各地にあります。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 首と墓
  - title: 近藤勇の首はどこへ行ったのか　京都の河原と、各地に残る墓
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1868
    lines:
      # fact: kondo-100, kondo-21
      - 語り: 首は、樽に納められ、京都へ運ばれました。北島秀朝の記録では、強い酒に浸してありました。
      # fact: kondo-56
      - 語り: 塩漬けだった、という話も、明治39年、1906年の本に残っています。板橋で、京都へ運ばれる首に出会った、という女性の話です。
      # fact: kondo-21
      - 語り: 京都の刑法官で樽を開けると、首は、まだ生きているようで、役人たちは不思議がった、と記録は書きます。
      # fact: kondo-50
      - 語り: 太政官日誌によれば、首は、京都の三条河原で、3日間、さらされました。
        card: {head: "太政官日誌", body: "三条河原に3日間"}
      # fact: kondo-51
      - 語り: そばの札は、閏4月7日の日付で、甲州勝沼と武州流山で官軍に敵対した、大逆だ、と記します。勝沼の一戦が、ここで名指しされました。
      # fact: kondo-52
      - 語り: 当時の中外新聞は、首が着いたのは閏4月8日、と伝えました。そして、見た人は誰もが、惜しい壮士だ、と言っている、と書いています。
      # fact: kondo-53
      - 語り: その記事には、作者の分からない、近藤を悼む漢詩まで、載っています。
      # fact: kondo-39
      - 語り: 依田学海も、京都で近藤の首を見た一人です。ただ、学海は、その場所を、三条ではなく、四条の河原と書いています。
      # fact: kondo-39
      - 語り: 顔の色は、生きているようだった。前に笑って話した時を思い出し、しばらく悲しみにくれた。
        tone: しみじみ
      - 語り: 首は、そのあと、どうなったのか。当時の記録は、ここで途切れます。
        tone: 疑問
      # fact: kondo-69
      - 語り: 愛知県岡崎市の法蔵寺には、近藤勇のものと伝わる首塚があります。岡崎市観光協会の案内は、こう書きます。
      # fact: kondo-69
      - 語り: 三条大橋の西にさらされた首を、同志が持ち出し、近藤が慕っていた、京都の誓願寺の住職に託した。住職が法蔵寺へ移ったので、首も運ばれた。
      # fact: kondo-69
      - 語り: はじめは、石碑を土で覆って、隠していた、といいます。
      # fact: kondo-71
      - 語り: 山形県の米沢の高国寺にも、首を埋めた、という話があります。桐生から来た近藤金太郎という人が、持ってきた、と。
      # fact: kondo-60
      - 語り: では、体は。北区の解説では、胴体は、滝野川の無縁塚に埋められました。板橋の郷土史の会によれば、今の、JR板橋駅の東口の前です。
      # fact: kondo-61
      - 語り: その駅前の墓は、明治9年、1876年。新選組の生き残り、永倉新八が呼びかけ、幕府の医者だった松本順の力を借りて建てました。処刑から、8年後です。
        card: {head: "板橋の墓 1876年", body: "永倉新八が呼びかけて建てた"}
      # fact: kondo-42, kondo-63
      - 語り: ところが、正面に彫られた近藤の名は、まさよしの2文字の順が、逆になっています。昭和3年の『戊辰物語』が、すでにそう指摘していました。
      # fact: kondo-66
      - 語り: 東京の三鷹市の龍源寺にも、近藤の墓があります。三鷹市の説明は、遺族や門弟が、ひそかに体を運んで葬った、という言い伝えの形です。
      # fact: kondo-68
      - 語り: 福島県の会津若松の天寧寺の墓は、土方歳三が、遺髪などを、会津の戦いのときに仮に埋めた、と伝わります。
      # fact: kondo-65
      - 語り: 処刑の地の近くには、こんな言い伝えもあります。処刑の地とは知らずに店を開いた女主人が、お参りを続けるうちに、病が治った。近藤勇は、おこり、つまり熱の出る病の神様だ。
      - 語り: 板橋は、胴体を埋めた場所とされます。けれど、首や体が、いまもそこにあると、当時の記録で確かめられた墓は、ありません。
      - 語り: 最後に、はじめの問いに戻ります。近藤は、なぜ、切腹ではなかったのか。
        tone: 疑問
        hook: true

  - title: まとめ：近藤勇は、なぜ切腹ではなく斬首だったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: kondo-78, kondo-76
      - 語り: 名を変え、170人の隊で1万人を名乗った近藤は、勝沼で敗れ、生きる道を探しました。
        tone: しみじみ
      # fact: kondo-12, kondo-15
      - 語り: 4月3日、流山。大久保大和と名乗った男は、大砲と鉄砲を差し出し、官軍の陣へ向かいます。なぜ出ていったのか。その理由は、記録ごとに違います。
        tone: しみじみ
      # fact: kondo-16, kondo-13
      - 語り: 正体は、彦根の侍が見破ったとも、板橋で、戸の隙間から、元の仲間がのぞいて確かめたとも書かれます。
        tone: しみじみ
      # fact: kondo-28, kondo-29
      - 語り: 薩摩は、近藤をかばい、そのまま京都へ送る、と言いました。土佐は、博徒の頭と同じだ、と厳しく責めました。最後は大総督の宮に伺って、斬首して京都へ送る、と決まりました。
        tone: しみじみ
      # fact: kondo-22, kondo-55
      - 語り: 徳川は、家来と認めませんでした。処刑の場の札は、元来、浮浪の者、と書きました。侍としての最期は、与えられませんでした。
        tone: しみじみ
        pause: 0.8
      # fact: kondo-33
      - 語り: 坂本龍馬の件が理由だった、という話は、今回たどった当時の記録には見当たらず、ずっとあとの本に出てきます。
        tone: しみじみ
      # fact: kondo-50
      - 語り: 首は京都の河原にさらされ、そのあとの行方は、伝えの中にだけ残りました。
        tone: しみじみ
        pause: 0.8
      - 語り: 名を変えて生きようとした男は、最後に、浮浪の者という名で、斬られました。いま、各地の墓は、近藤勇の名で、その人を呼んでいます。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、近藤勇の最期を、どう見ますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
