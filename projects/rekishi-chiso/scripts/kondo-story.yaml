# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  新選組の局長、近藤勇の最期は、切腹ではなく、板橋での斬首でした。ところが、捕まったとき、近藤は、自分を近藤勇とは名乗っていません。名乗った名は、大久保大和。
  土佐の記録によれば、官軍は、かつての新選組の仲間を呼び、戸の隙間から、のぞかせて正体を確かめました。そして、取り調べの場で近藤をかばったのは、意外にも、敵の薩摩でした。
  勝沼の敗走から、流山、板橋、そして京都へ運ばれた首と、各地に残る墓まで。近藤勇の最後の1か月半を、当時の記録で並べました。
  この動画でわかること
  ・流山で、近藤はなぜ自分から官軍の陣へ出ていったのか（記録ごとに4通り）
  ・「大久保大和」の正体は、誰が、どこで見破ったのか
  ・切腹ではなく斬首になるまでに、板橋の総督府で何があったのか
  ・辞世とされる漢詩と、京都へ運ばれた首、板橋・三鷹・会津若松・岡崎の墓
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  当時の記録は、『復古記』第11冊（井伊家・山内家の家記・香川敬三の事蹟・総督府日記・岡田善長の従軍事蹟・北島秀朝の事蹟・総督から太政官への書）、谷干城「東征私記」（『谷干城遺稿』上）、『太政官日誌』、『房総叢書』第5巻・『中山忠能履歴資料』（彦根藩の届・総督府日記）、中外新聞・江湖新聞（『新聞集成明治編年史』第一巻・『近代世相全史』・宮武外骨『文明開化』裁判篇）によります（国立国会図書館デジタルコレクション）。
  後の時代の書き方は、西村兼文『文明史略』（1876）、『明治回天集』（1880）、『峡中沿革史』（1888）、松村巌『近藤勇』（1903、依田学海の文を引く）、『成功偉人名家列伝』（1906）、『南国遺事』（1916）、東京日日新聞『戊辰物語』（1928）、『近藤勇ト土佐勤王党』（1929）、徳重浅吉『日本文化史の研究』（1938）によります。
  場所と墓は、足立区立郷土博物館（新選組とあだち・金子家文書）、流山市・流山市立博物館（新選組と流山・恩田家文書）、甲州市教育委員会、北区（近藤勇と新選組隊士の墓）、三鷹市、会津若松観光ナビ、岡崎市観光協会（岡崎おでかけナビ）、板橋史談会「板橋宿は近藤勇終焉の地」、市民タイムス（2026年9月、短冊の公開の報道）によります。
  年齢は数え年。日付は当時の暦（慶応4年4月25日は、今の暦で1868年5月17日）です。日数の差は、記録の日付から計算し直したものです。記録によって日付・場所・人の名が違うところは、記録ごとに並べました。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Kondo Isami: Why Was He Beheaded Instead of Being Allowed Seppuku?"
  description: |-
    Kondo Isami, commander of the Shinsengumi, did not die by seppuku. He was beheaded at Itabashi in 1868. Yet when he was taken, he did not give his own name. He called himself Okubo Yamato.
    According to a Tosa record, the government army had a former Shinsengumi comrade peek at him through a gap in a door. And at his interrogation, the side that protected him was, surprisingly, the enemy Satsuma.
    From the defeat at Katsunuma to Nagareyama, Itabashi, the head sent to Kyoto and the graves left in many places, we follow the last seven weeks of Kondo Isami through the records of the time.
    In this video you will learn:
    - Why Kondo walked into the government camp at Nagareyama (four different accounts)
    - Who saw through "Okubo Yamato", and where
    - What happened at the Itabashi headquarters before he was sentenced to beheading
    - The poem called his death verse, the head sent to Kyoto, and the graves in Itabashi, Mitaka, Aizuwakamatsu and Okazaki
    Dates in the video follow the old Japanese calendar. Records differ on dates, places and names. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Why Was Kondo Beheaded?"
    - "Katsunuma, 1868: 170 Men Who Claimed to Be Ten Thousand"
    - "Nineteen Days at Gobei-shinden"
    - "Nagareyama, April 1868: Why Did Kondo Walk Out?"
    - "Who Saw Through Okubo Yamato?"
    - "Satsuma and Tosa Split at Itabashi"
    - "Itabashi, May 17, 1868: Twenty-Two Days and a Death Verse"
    - "Where Did the Head Go?"
    - "Summary: Why Beheading, Not Seppuku?"

