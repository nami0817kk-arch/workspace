# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。近藤勇の最期（1868年・慶応4年4月25日）。2026-11-19 作成。公開の予定は 11/25 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。流血・処刑の場面は語りでも細かく描かない。
# 1本に1つの問い＝「近藤勇は、なぜ切腹ではなく斬首だったのか」。答えの席＝処分の理由。斬首と決めた理由をそのまま書いた記録は、今回たどった中に無い。
#   手がかりは3つ：徳川の目付「大久保大和という家来はいない、近藤はとうに脱走した者」（kondo-22）／谷干城「ほとんど博徒の頭と同じ」（kondo-27）／処刑の場の札「元来浮浪の者」（kondo-54・55）。
#   龍馬の件は1929年の土佐の側の本だけ（kondo-33）。題名で言い切らない。
#   冒頭（10秒以内）＝誰でも知る一点「板橋で斬首」→ 捕まったときは「大久保大和」と名乗っていた（kondo-01・43）→ 戸の隙間からのぞかせた（kondo-16、土佐の記録）
#     → 取り調べで近藤をかばったのは敵の薩摩、薩摩の案は「そのまま京都へ送る」（kondo-26・29）→ 問い。
#   「兵を率いて帰る」は、谷らの拷問の論を止める口論での伊地知の勢い（東征私記の順番。処分の案をめぐる脅しではない）。
#   既出との重なり：土方歳三の回（scripts/hijikata-story.yaml）は近藤の処刑を1行と碑の話だけ。流山・板橋・首・墓は扱っていない。
# 記録の食い違い：①出頭の理由（文明史略「一死で囲みを解く」／松村巌1903「自害を土方が止めた」／依田学海「土方は行くなと諫めた」／土佐の家記・東征私記「上田楠次が同道すると連れ出した」。kondo-35・36・38・15）
#   ②正体を見破った人と場所（井伊家の記録「渡辺九郎左衛門」／東征私記「板橋で元伊東派に戸の隙間から」／文明史略「加納鷲雄」。kondo-13・16・35。松村巌の越谷説は話が多すぎるので省いた）
#   ③辞世の詩（当時の中外新聞「作者不詳」／明治回天集1880「甲斐途上作」。kondo-45・46。中外新聞の日付は閏4月13日・16日と割れるので言わない）
#   （小）首をさらした場所：三条河原（太政官日誌）／四条の河原（依田学海）。首の運び方：火酒の樽（北島秀朝事蹟）／塩漬け（1906年の本）。
# 計算（自分で計算し直した。国立天文台 暦日DB、kondo-102・104）：
#   生まれ 天保5年10月9日＝1834年11月9日 → 死 慶応4年4月25日＝1868年5月17日。数え 1868−1834+1＝35、満 33（11月9日の前）。
#   柏尾の戦い 3月6日＝3月29日。五兵衛新田 3月13日夜〜4月1日（足立区は「19日間」と数える。3月は30日まで）。流山の出頭 4月3日＝4月25日。板橋で入牢 4月5日（総督府日記）。
#   出頭から処刑まで 4月3日→4月25日＝22日（慶応4年4月は小の月。閏4月1日＝5月22日）。柏尾の戦いから処刑まで 3月29日→5月17日＝49日（「およそ1か月半」）。
#   竹田街道で撃たれたのは慶応3年12月18日＝1868年1月12日なので「前の年」とは言わない（「鳥羽・伏見の戦いの少し前」）。伊東甲子太郎の死は慶応3年11月18日＝1867年12月13日（前の年で可）。
#   香川敬三は天保10年（1839）生まれ → 1868年に数え30。『戊辰物語』の「当年二十六」は合わないので年齢は言わない。板橋の墓 1876年＝処刑の8年後。
# 事実は事実カード（dev/output/rekishi-chiso/research/近藤勇_facts_20261119.yaml、kondo-12〜105）にあるものだけ。行の上に `# fact: kondo-xx`。
#   使わないこと：首を斬った人の名の読み（横倉喜三次。読みが確かめられないので「元家来の横倉」）／首が大坂でもさらされた話・焼酎漬け（出どころ無し）／
#   海舟日記の「土方歳三来る」（ブログの引用だけ）／相馬主計が海舟の書状を運んだ話（解説サイトだけ）／法蔵寺の碑の発見の年／勇五郎が胴体を掘り出した話・30両／辞世の添削の論文（本文未見）／
#   短冊の中身（記事に書かれていない。2026-09 の記事は「初公開へ」の予定の記事なので「公開されると報じられた」）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
