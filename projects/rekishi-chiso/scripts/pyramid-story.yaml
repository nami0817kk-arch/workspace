sections:
  # ================================================================ 序章。答えの席：誰が、どうやって
  - title: 洞窟のパピルス　石を運んだ人の日誌
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 2013
    lines:
      # fact: pyramid-P01
      - 語り: 大ピラミッドの石を運んだ男が、自分の仕事を、日誌に書き残していました。2013年、紅海ぞいの洞窟から、見つかったのです。
        tone: 重い
      # fact: pyramid-P02, pyramid-P04
      - 語り: 書いたのは、クフ王の時代の役人です。4500年以上前の、エジプトで見つかった中で、文字の書かれたパピルスとして、最古とされています。
      # fact: pyramid-P03
      - 語り: ところが、公表されている日誌には、ピラミッドの石を、どうやって積んだのか、書かれていません。
        tone: 重い
      # fact: pyramid-P03
      - 語り: 書いてあったのは、石を、船で運ぶ仕事でした。
      # fact: pyramid-P09
      - 語り: では、誰が造ったのか。有名な答えは、ギリシャの歴史家ヘロドトスの、10万人です。10万人が、3か月ごとに交代して働き、道に10年、ピラミッドに20年かかった、と書きました。
        tone: 重い
      # fact: pyramid-P10
      - 語り: そのヘロドトスが書いたのは、造られてから、約2100年あとです。
      # fact: pyramid-P13
      - 語り: 底辺は約230メートル。元の高さは146.6メートル。今は、外側の石が失われて、約138.5メートルです。
        figure: {type: stats, title: 大ピラミッドの大きさ, items: [[底辺, 約230m, 230.3m], [元の高さ, 146.6m, クフ王の時代], [今の高さ, 約138.5m, 外側の石が失われた]], upto: 3}
      # fact: pyramid-P14
      - 語り: 石は、約230万個。全部で約600万トン、1個の平均は約2.5トンと、見積もられています。どれも、数えた値ではなく、見積もりです。
        figure: {type: stats, title: 石の見積もり, items: [[個数, 約230万個, 見積もり], [総重量, 約600万トン, 見積もり], [1個の平均, 約2.5トン, 場所で違う]], upto: 3}
      - 語り: この石を、誰が、どうやって、積んだのか。ヘロドトスの記録、洞窟の日誌、労働者の墓。順に、見ていきます。
        tone: 疑問
        figure: null
        hook: true

  # ================================================================ 第1章 ヘロドトスの記録
  - title: 10万人が、3か月交代　ヘロドトスの記録
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: -450
    lines:
      # fact: pyramid-P10
      - 語り: ヘロドトスは、紀元前5世紀に『歴史』を書き、エジプトを旅したギリシャ人です。エジプトの王クフの話も、そこに載せました。
        year: -450
      # fact: pyramid-P09
      - 語り: 石の個数は、書いていません。書いたのは、人数と、年数です。10万人が、3か月ごとに、交代で働いた、と。
      # fact: pyramid-P09
      - 語り: 石を運ぶ道の工事に10年、ピラミッドそのものに20年。あわせて、30年です。
      # fact: pyramid-P10
      - 語り: しかも、これは、エジプトで聞いた話として、書かれています。
      # fact: pyramid-P11
      - 語り: ヘロドトスは、ピラミッドの碑文を、通訳に読んでもらったそうです。働く人のための、大根と玉ねぎとにんにくの量が刻まれ、費用は銀1600タレントだった、と。タレントは、お金の単位です。
        tone: 重い
      # fact: pyramid-P12
      - 語り: ヘロドトスが書いたのは、強制労働です。クフが、エジプト人を、1人残らず、自分のために働かせた、と。英訳のクフの章に、「奴隷」という言葉は、出てきません。
        tone: 重い
      # fact: pyramid-P21
      - 語り: 今の研究者は、10万人を、どう見るか。アメリカの考古学者レーナーは、技術者の調査を引いて、4000人から5000人と紹介しています。エジプト学者の多くは、いまは約2万人ほどと見る、とも紹介されています。
      # fact: pyramid-P21
      - 語り: エジプトの考古学者ハワスは、常時と臨時を合わせて、3万6000人。ハーバード大学の解説は、2万から3万人です。
        figure: {type: stats, title: 働いた人数の見積もり, items: [[ヘロドトス, 10万人, 3か月交代], [ハワス, 3万6000人, 常時と臨時], [ハーバード, 2万〜3万人, 解説]], upto: 3}
      # fact: pyramid-P21
      - 語り: 約4000人から約3万6000人まで、見積もりは、大きく割れています。10万人は、ここに並べた、どの見積もりよりも、多い数です。
        figure: null
      - 語り: では、石そのものは、どれほどの数だったのか。割り算で、確かめます。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 石の数を割り算する
  - title: 約230万個を割り算する　2分に1個
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: pyramid-P14
      - 語り: 約230万個を、ヘロドトスの言う20年で積むとします。
      # fact: pyramid-P14
      - 語り: 20年は、7300日。1日に、約315個です。毎日、10時間働いたとして、約2分に1個。
        figure: {type: stats, title: 230万個を割り算する, items: [[20年で積む, 約315個, 1日あたり], [27年で積む, 約233個, 1日あたり], [20年・10時間, 約2分に1個, 休まず働いた場合]], upto: 3}
      - 語り: これは、1年365日、休まず働いた、と仮定した平均です。実際に何日働いたかは、わかっていません。
        figure: null
      # fact: pyramid-P15
      - 語り: 石の産地は、3つあります。大半は、ピラミッドのすぐ近くの石灰岩。外側の白い石灰岩は、ナイルの向こう側の、トゥラ。王の間のまわりの花崗岩は、遠いアスワンです。
      # fact: pyramid-P15
      - 語り: トゥラまでは、出典によって、10キロから17キロと、割れています。アスワンは、約900キロです。
        tone: 重い
      # fact: pyramid-P15
      - 語り: 花崗岩の重さも、25トンから80トンまで、見積もりに幅があります。
      - 語り: 機械のない時代に、重い石を、遠くから運んだのです。運ぶ道は、陸だけではありませんでした。水の上を、船で石灰岩を運んだ人の日誌が、残っています。
        tone: しみじみ
        hook: true

  # ================================================================ 第3章 洞窟の日誌
  - title: 洞窟のパピルス　メルエルの日誌　2013年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 2013
    lines:
      # fact: pyramid-P01
      - 語り: 2013年の春。パリ・ソルボンヌ大学のタレと、マルアールが率いる、フランスとエジプトの合同隊が、パピルスの束を見つけました。場所は、紅海ぞいの、ワディ・エル・ジャルフです。
        year: 2013
      # fact: pyramid-P01
      - 語り: 石灰岩を掘った、人工の洞窟の中でした。
      # fact: pyramid-P08
      - 語り: ここは、世界最古級の港です。石の錨が、100以上、見つかっています。
        tone: 重い
      # fact: pyramid-P04
      - 語り: 日誌の日付は、クフ王の、13回目の牛の数え上げの、翌年です。これを治世の何年目と数えるかは、出典によって、26年目とも27年目とも割れ、幅で言うしかありません。
        year: -2560
      # fact: pyramid-P05
      - 語り: 書いた人の名前は、メルエル。肩書きは、検査官。中くらいの役人です。
      # fact: pyramid-P05
      - 語り: 率いた班の人数は、約40人とする出典が多くあります。一方、報道には、約200人という数字もあり、出典で食い違います。
        figure: {type: stats, title: 班の人数、出典で割れる, items: [[Archaeology誌など, 約40人, 班], [一部の報道, 約200人, 2016年ごろ]], upto: 2}
      # fact: pyramid-P06
      - 語り: 仕事は、トゥラの石灰岩を、船に積み、ギザの「アケト・クフ」へ運ぶこと。大ピラミッドの、当時の名です。
        figure: null
      # fact: pyramid-P06
      - 語り: 日誌からは、10日ごとに、北と南の採石場を替え、2回から3回、往復したことが、読み取れます。
      # fact: pyramid-P06
      - 語り: その石は、外側の化粧石のためだ、とタレは考えています。日誌自身は、石の用途を、書いていません。
      # fact: pyramid-P07
      - 語り: 日誌には、貴人の名も出ます。アンクハフ。「ロ・シェ・クフ」を取りまとめる人で、クフ王の異母兄弟と、推定されています。
      # fact: pyramid-P03
      - 語り: 人も、場所も、日付も、本物の記録です。それでも、公表されている日誌には、巨石を持ち上げる方法が、書かれていません。
        tone: 重い
      # fact: pyramid-P03
      - 語り: タレ自身も、クフのピラミッドの建設について、新しいことは学べない、としながら、この日誌は、この件について、初めて手がかりを与える、とも述べています。
      - 語り: 積み方は、日誌にない。では、造った人たちの暮らしは、残っているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 労働者の町と墓
  - title: 労働者の町と墓　1990年、ギザの発掘
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: pyramid-P16
      - 語り: ギザ高原の南東、スフィンクスの約400メートル南に、町があります。アメリカの調査団、古代エジプト研究協会、略してAERAが、1988年12月から掘っている、7ヘクタール以上の町です。
        year: 1988
      # fact: pyramid-P23
      - 語り: この町が使われたのは、主に、クフ王の息子のカフラー王から、孫のメンカウラー王のころです。クフ王だけの町とは、言えません。
      # fact: pyramid-P16
      - 語り: 町は、王が計画して造ったもので、パン工房、倉庫、住居、そして、王のサイロがありました。サイロで穀物を配り、パンとビールにしました。
      # fact: pyramid-P17
      - 語り: 町から出た、約17万5000点の動物の骨などを、ミシガン大学のレディングが調べました。メンカウラーのピラミッドの労働者には、毎日、4000ポンド、約1.8トンを超える肉が、配られた、と推定しています。
        tone: 重い
      # fact: pyramid-P17
      - 語り: 牛と羊と山羊が、中心です。レディングは、村での暮らしより、おそらく良い食事だった、と述べています。
      # fact: pyramid-P18
      - 語り: 次は、墓です。1990年、ギザの南で、労働者の墓地が、見つかります。
        year: 1990
      # fact: pyramid-P18
      - 語り: 発掘したエジプトの考古学者、ザヒ・ハワスは、こう語りました。それまで見つかっていなかったのは、労働者階級の墓だった、と。
      # fact: pyramid-P18
      - 語り: 墓は、労働者と監督のもので、何百基にのぼります。第4王朝から第6王朝まで、約300年にわたります。
      # fact: pyramid-P19
      - 語り: 骨には、手足の骨折が、固定されて治った跡が、しばしば見られました。寿命は、35歳から40歳ほどだった、とハワスは書いています。
        tone: 重い
      # fact: pyramid-P20
      - 語り: 大ピラミッドの上のほうにある部屋には、班の名の落書きがあります。「クフの友」。のちの時代の班には、「メンカウラーの酔っぱらい」という名もあり、こちらは、メンカウラー王の神殿の壁で見つかっています。
      # fact: pyramid-P22
      - 語り: ハワスは、こう述べています。奴隷なら、王のそばに、自分の墓は造れなかっただろう、と。
        tone: 重い
      - 語り: では、石は、どう動いたのか。もう一度、日誌の船に、戻ります。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 運び方と積み方の手がかり
  - title: 船と濡れた砂と坂道　ハトヌブの発掘
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 日誌の船が、石を運んだ。その水は、どこにあったのか。
      # fact: pyramid-P24
      - 語り: 2022年、シーシャらの研究チームが、アメリカの科学アカデミー紀要に、論文を出しました。ギザの近くを流れた、古いナイルの支流の水位を、堆積物の花粉などから、復元した、というものです。
        year: 2022
      # fact: pyramid-P24
      - 語り: ナイルが増水する季節には、大型の船が、使えたと見ています。
      # fact: pyramid-P25
      - 語り: 2024年には、ノースカロライナ大学のゴーネイムらが、長さ約64キロの、埋もれた支流を、地図にしました。
        year: 2024
      # fact: pyramid-P25
      - 語り: 支流のほとりには、約31基のピラミッドが、並びます。谷の神殿は、港の役をしていた、と見ています。
      # fact: pyramid-P25
      - 語り: それでも、これは、水路の復元です。船で運んだ、証拠そのものでは、ありません。
        tone: 重い
      # fact: pyramid-P26
      - 語り: 陸では、どうか。エジプト中部、デイル・エル・ベルシャの、ある有力者の墓の壁画。紀元前1880年ごろ、大ピラミッドの、約700年あとのものです。
        year: -1880
      # fact: pyramid-P26
      - 語り: 巨像を載せた橇を、172人で引き、橇の前で、水を注ぐ人が、描かれています。
      # fact: pyramid-P26
      - 語り: 2014年、アムステルダム大学のフォールたちが、実験しました。砂を、ちょうどよく濡らすと、橇を引く力が、約半分になりました。
        year: 2014
        tone: 重い
      # fact: pyramid-P26
      - 語り: 一方で、壁画の水は、儀式を表す、とする読みもあります。実験が確かめたのは、砂の摩擦で、壁画の意図では、ありません。
      # fact: pyramid-P27
      - 語り: 2018年11月、エジプト中部の東の砂漠、ハトヌブで、坂道が見つかったと、報じられました。アラバスターの、採石場です。
        year: 2018
      # fact: pyramid-P27
      - 語り: 中央に坂道、両側に階段、そして、たくさんの柱穴。橇に載せた石を、柱に掛けた縄で、引き上げたとみられます。
      # fact: pyramid-P27
      - 語り: 傾斜は、20パーセント以上。角度にすると、約11度以上です。クフ王の時代の碑文も、見つかっています。
      # fact: pyramid-P27
      - 語り: とはいえ、石は、ピラミッドの石灰岩ではなく、アラバスターです。カリフォルニア大学ロサンゼルス校のクーニーは、アラバスターの採石場を、ピラミッドの造り方と結びつけるのは、無理がある、と評しました。
        tone: 重い
      # fact: pyramid-P28
      - 語り: ピラミッドそのものを、どう積んだか。外の直線の坂、らせんの坂、そして内部の坂。説は、いくつもあります。
      # fact: pyramid-P28
      - 語り: 元建築家のウーダンは、2007年に、下は外の坂、上は内部の坂、という説を出しました。けれど、内部の坂は、他のピラミッドで見つかっていない、との指摘もあります。
        year: 2007
      # fact: pyramid-P28
      - 語り: どの説にも、決定的な遺構は、ありません。積み方は、いまも、仮説のままです。
        tone: 重い
      - 語り: 運び方の手がかりは、並びました。では、「誰が」のほうは、どこまで言えるのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 3つの記録を並べる
  - title: 3つの記録を並べる　誰が造ったと言えるのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 3つの記録を、並べます。ヘロドトス。メルエルの日誌。そして、町と墓です。
        figure: {type: stats, title: 3つの記録, items: [[ヘロドトス, 約2100年あと, エジプトで聞いた話], [メルエルの日誌, クフ王の時代, 役人が書いた], [町と墓, クフ王のあとが中心, 発掘の記録]], upto: 3}
      # fact: pyramid-P09, pyramid-P10
      - 語り: ヘロドトスは、約2100年あとに、エジプトで聞いた話を書きました。10万人が、強いられて働いた、という像です。
        figure: null
      # fact: pyramid-P05, pyramid-P06
      - 語り: 日誌は、クフ王の時代の役人が書きました。約40人とする出典の多い班が、船で石を運ぶ仕事が、日付つきで記されています。
      # fact: pyramid-P16, pyramid-P19
      - 語り: 町と墓は、クフ王のあとの時代を中心にした、発掘の記録です。パンとビールと肉が配られ、骨折は治療され、王のそばに、墓がありました。骨折の跡もありました。それでも、配給と墓が、あったのです。
      - 語り: ヘロドトスの「強制」という像と、発掘の「配給と墓」という像は、重なりにくいのです。
        tone: 重い
      - 語り: 日誌も、少しあとの時代の町と墓も、王の側が、人と物を整えて進めた仕事だったことを、うかがわせます。
      # fact: pyramid-P22
      - 語り: その中に、奴隷は、1人もいなかったのか。レーナーは、奴隷ではなかった、と述べています。ただ、働いた人全員の身分を、記録から確かめることは、できません。
      # fact: pyramid-P22
      - 語り: 労役は、強制と報酬のあいだにありました。レーナーは、労役は強制だけではなかった、と見ています。報酬は、お金ではなく、主に、パンとビールでした。
      - 語り: では、この仕事は、何年かかったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 年数の勘定
  - title: 何年かかったのか　年数の勘定
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: pyramid-P09
      - 語り: ヘロドトスは、ピラミッドに、20年、と書きました。
      # fact: pyramid-P04, pyramid-P07
      - 語り: 日誌の26年か27年は、クフ王が王になって何年目か、という数え方で、工事が何年かかったか、ではありません。タレは、これを、建設の最終段階の、外側の石の搬入と、見ています。
      # fact: pyramid-P29
      - 語り: 工期は、ヘロドトスが20年、現代の見積もりでは、20年から27年ほどと、幅があります。230万個を、27年で積めば、1日に、約233個。20年なら、約315個です。
        figure: {type: stats, title: 工期と、1日あたりの石, items: [[20年, 約315個, 1日あたり], [27年, 約233個, 1日あたり], [個数, 約230万個, 見積もり]], upto: 3}
      - 語り: 石の個数も、年数も、人数も、見積もりです。確かなのは、同じ時代の日誌が、船で石を運んだ、と書いていることです。
        figure: null
        tone: しみじみ
      - 語り: 結局、誰が、どうやって、造ったのか。
        tone: 疑問
        hook: true

  - title: まとめ：大ピラミッドは、誰がどうやって造ったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 言えることから。大ピラミッドは、王の側が、人と物を整えて進めた、国の仕事だったと、見られます。クフ王の時代の日誌と、少しあとの時代の町と墓が、その方向を指しています。
        tone: しみじみ
      - 語り: 造ったのは、国の仕事についた人々だった、と見られます。ヘロドトスの、10万人が強いられた、という像とは、ずれがあります。
        tone: しみじみ
      - 語り: 奴隷が造った、と言い切る記録は、ここで見た記録のなかには、ありません。ただし、働いた全員の身分は、記録から確かめられません。
        tone: しみじみ
      - 語り: 言えないことも、あります。石を、どう持ち上げ、積んだのか。日誌も、町も、墓も、答えていません。
        tone: しみじみ
        pause: 0.8
      - 語り: 人数も、確定していません。約4000人から約3万6000人まで、見積もりは、割れています。水路と船、濡れた砂、坂道。どれも、手がかりで、決定的な証拠では、ありません。
        tone: しみじみ
      - 語り: 4500年以上前、メルエルという役人が、洞窟のパピルスに、石を運んだ日々を、書き留めました。日誌が見つかっても、積み方の謎は、残りました。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、大ピラミッドを造ったのは、誰だと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
