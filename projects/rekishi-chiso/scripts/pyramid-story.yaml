# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  大ピラミッドの石を運んだ人の日誌が、2013年、紅海ぞいの洞窟から見つかりました。書いたのは、クフ王の時代の役人です。
  ところが、公表されている日誌には、ピラミッドの石をどう積んだのか、書かれていません。書いてあったのは、石を船で運ぶ仕事でした。
  誰が、どうやって造ったのか。ヘロドトスの10万人、洞窟の日誌、労働者の町と墓。記録を並べて、言えることと、言えないことを分けました。
  この動画でわかること
  ・ヘロドトスの「10万人」と、同じ時代の日誌のちがい
  ・石の数を、1日あたりに割り算すると
  ・労働者の町と墓から、わかったこと
  ・船・濡れた砂・坂道、運び方の手がかり
  ・「奴隷が造った」と言えるのか、言えないのか
description_note: |-
  数字（石の個数・重さ・工期・働いた人数・石の産地の距離）は、出典によって幅のある見積もりで、動画では出典ごとに並べました。割り算・年数の差は、見積もりの数字から自分で計算し直したものです。
  日誌・町・墓・ヘロドトス・水路・濡れた砂・ハトヌブの坂道は、論文・発掘団体の公式ページ・報道・百科事典で確かめました。論文の本文を開けなかったものは、報道や要約を経由しています。ヘロドトスの「奴隷の語が出ない」は、英訳（ローリンソン訳）での確認です。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Who Built the Great Pyramid, and How? What a 4,500-Year-Old Logbook Says"
  description: |-
    In 2013, a logbook kept by an official who hauled stone for the Great Pyramid was found in a cave on the Red Sea coast.
    But it does not say how the stones were stacked. It records how they were carried by boat.
    Who built the Great Pyramid, and how? We set side by side Herodotus's 100,000 men, the logbook from the cave, and the workers' town and tombs.
    In this video you will learn:
    - How Herodotus's account differs from a logbook of the same era
    - What the number of stones means per day
    - What the workers' town and tombs show
    - Clues to how stones moved: boats, wet sand, ramps
    - What can and cannot be said about slaves
    Figures are estimates that vary by source. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "The Logbook in the Cave"
    - "Herodotus and the 100,000"
    - "Dividing the Stones"
    - "Merer's Logbook"
    - "The Workers' Town and Tombs"
    - "Boats, Wet Sand and Ramps"
    - "Three Records Side by Side"
    - "How Many Years?"
    - "Summary: Who Built It?"

