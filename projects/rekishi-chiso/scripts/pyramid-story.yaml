# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。大ピラミッドは、誰がどうやって造ったのか（クフ王の時代・約4500年前〜2024年の研究）。2026-11-15 作成。公開の予定は 11/20 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（世界史・古代エジプト）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「大ピラミッドは、誰がどうやって造ったのか」。主役は石と、同じ時代の記録（日誌・町・墓）と、後の人の記録（ヘロドトス）。
#   冒頭＝「石を運んだ人の日誌が2013年に洞窟から見つかった」＋「しかし積み方は書いていない」＋「ヘロドトスの10万人は約2100年あとの話」。答えの席＝誰が・どうやってのどこまで言えるか。
#   型の作り：序章 日誌と10万人／第1章 ヘロドトスの記録／第2章 石の数の割り算／第3章 洞窟の日誌／第4章 労働者の町と墓／第5章 運び方と積み方の手がかり／第6章 3つの記録を並べる／第7章 年数の勘定／まとめ。
# 記録の食い違い：①日誌の班の人数（約40人／約200人）と年（26年目／27年目）②ヘロドトスの10万人と現代の推定（4,000〜36,000人）③ヘロドトスの「強制」と発掘の「配給と墓」。
# 計算（自分で計算し直した）：ヘロドトス450BC→着工2550BC＝約2100年／2560BC→2026年＝約4,580年前（「4500年以上前」）／10年＋20年＝30年／230万個÷（20年×365日＝7,300日）＝約315個／日、10時間なら約31.5個／時＝約1.9分に1個／
#   27年（9,855日）なら約233個／日／4,000ポンド×0.4536＝約1.8トン／1.3×1.8×8＝18.72㎥（使わない）／壁画1880BC→2560BC＝約680年（「約700年あと」）／傾斜20%＝約11.3度／約64km／約31基／日誌の「13回目の牛の数え上げ」（隔年）の翌年＝26〜27年目。
# 事実は事実カード（dev/output/rekishi-chiso/research/ピラミッド_facts_20261115.yaml、pyramid-P01〜P28）にあるものだけ。行の上に `# fact: pyramid-Pxx`。
#   使わないこと：大麦・石の個数260万・町の人口の確定値・「労働者の町はクフ専用」・日誌が「外装用」と書いている・日誌が人数や積み方を書いている・ハトヌブの傾斜20度・クフの在位年数・奴隷説の始まりの年・牛や羊の頭数・墓の副葬品。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
