sections:
  # ---------------------------------------------------------------- 1
  - title: あの言葉は、言っていない
    background: {image: paintings/versailles_patel_1668.jpg, credit: "ピエール・パテル《ヴェルサイユ宮殿》1668年"}
    portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
    lines:
      - 語り: 「パンがなければ、お菓子を食べればいいじゃない」。
        tone: 強調
        short: s1
      - 聞き: 出た！ マリー・アントワネットの、いちばん有名なセリフじゃん。
        tone: 明るい
        short: s1
      - 語り: そう。誰もが知っている一言です。今日はここが《地表》。いちばん上に積もっている層です。
      - 聞き: 地表？ 剣崎さん、ここ工事現場じゃないよ？
        tone: 笑い
      - 語り: この番組では、毎回、みんなが知っている通説から始めて、その下を掘っていきます。で、さっそくですが、この言葉。彼女が言ったという記録は、《どこにも》残っていません。
        short: s1
      - 聞き: え、言ってないの！？ 普通に信じてた。
        tone: 驚き
        short: s1
      - 語り: よく似た話が最初に文字になったのは、思想家ルソーの自伝『告白』です。
        portrait: {image: paintings/rousseau_latour.jpg, caption: "ルソー（ラ・トゥール画）"}
        card: {head: "ルソー『告白』", body: "1760年代半ばに執筆"}
        short: s1
      - 語り: そこに「ある身分の高い女性」が、パンがないならブリオッシュを食べればいい、と言った、と書かれている。
        short: s1
      - 聞き: へえ〜、出どころはルソーなんだ！ ブリオッシュって、お菓子っていうより甘いパンでしょ？
        tone: 驚き
      - 語り: そうです。しかもルソーがここを書いたころ、マリー・アントワネットは《まだ10歳にもならない子ども》で、オーストリアのウィーンにいました。
        portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
        card: {head: "1760年代半ば", body: "彼女はまだウィーンの少女"}
        short: s1
      - 聞き: え、待って。じゃあ10歳の子が言えるわけないじゃん。てことは、別の誰かの話が、あとから彼女のセリフにされちゃったってこと？
        tone: 疑問
        short: s1
      - 語り: そういうことになります。彼女は、実際にしたことよりも、「いかにも言いそうなこと」で裁かれた王妃でした。
        tone: しみじみ
        card: null
        short: s1
      - 聞き: うわぁ……それは、ちょっとかわいそうかも。でもさ、贅沢してたのは本当なんでしょ？ ドレスとか、宝石とか。
        tone: 疑問
      - 語り: お金を使ったのは本当です。ただ、比べる相手が大事でね。たとえば、のちに彼女の名前と結びつけられる、ある首飾り。今のお金に置き換えると、つむぎさん、いくらぐらいだと思います？
        tone: 疑問
      - 聞き: えー、ネックレスでしょ？ 1億とか？
        tone: 疑問
      - 語り: 当時のパリの、日雇い労働者の稼ぎで数えると、休まず働いて、ざっと《3000年分》です。
        tone: 強調
        year: 1785
        card: {head: "首飾りの値段", body: "日雇いの日当の約3000年分"}
        figure: {type: bars, title: 首飾りの値段, bars: [[日雇いの1年の稼ぎ, 450], [首飾り, 1600000]], labels: ["約370〜550リーヴル", "160万リーヴル（約3000年分）"]}
      - 聞き: さんぜんねん！？ 一生どころじゃないじゃん。
        tone: 驚き
      - 語り: 数え方で大きく変わるので、あくまで目安ですが、今の働く人の1年の稼ぎを、ざっと300万円として置き換えると……およそ《100億円》です。
        figure: {type: money, title: 首飾りを今のお金にすると, then: "160万リーヴル", yen: 10000000000, basis: "当時の日雇いの1年の稼ぎ（約450リーヴル）を、今の年収300万円に置き換えた目安"}
      - 聞き: ひゃく……あーしの予想、二桁ずれてるじゃん。
        tone: 笑い
      - 語り: ところが彼女は、その首飾りを買っていないんです。それどころか、一銭も得をしていない。
      - 聞き: え、じゃあ誰が持ってったの？
        tone: 驚き
      - 語り: その答えは、のちほど《首飾り事件》のところで掘りましょう。
      - 語り: 今日は、ウィーンに生まれた一人の少女が、フランスの王妃になって、37歳で断頭台に上るまでを掘っていきます。
        year: 1755
        card: null
        figure: null
      - 語り: そして最後に、いちばん底の層。なぜ、人々の怒りは、国王でも大臣でもなく、彼女に集まったのか。
        tone: 重い
      - 聞き: 作業しながらでも、移動中でも、ラジオみたいに聞いてってね。
        tone: 明るい
      - 語り: では、掘っていきましょう。
        tone: 明るい
      - 聞き: はーい！
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: ウィーンの末娘
    background: {image: paintings/schonbrunn_bellotto.png, credit: "ベルナルド・ベッロット《シェーンブルン宮殿》"}
    portrait: {image: paintings/maria_theresa_family.png, caption: "マリア・テレジアの家族（マイテンス画）"}
    year: 1755
    card: {head: "1755年11月2日", body: "ウィーンで誕生"}
    lines:
      - 語り: 1755年11月2日。オーストリアの都ウィーンの宮殿で、一人の女の子が生まれました。名前は、マリア・アントニア。
      - 聞き: マリア・アントニア？ マリー・アントワネットじゃないの？
        tone: 疑問
      - 語り: それはフランス風の呼び方。フランスに嫁いでから、そう呼ばれるようになります。
        tone: 納得
      - 語り: 母親は、オーストリアを40年にわたって治めた女帝、マリア・テレジア。父親は、神聖ローマ皇帝のフランツ1世です。
        portrait: {image: paintings/maria_theresa_meytens.png, caption: "マリア・テレジア（マイテンス画）"}
      - 聞き: お母さんが女帝！強そう。
        tone: 笑い
      - 語り: 実際、強い人でした。そして子だくさんでね。二人のあいだには《16人》の子どもがいました。
        tone: 強調
        card: {head: "16人きょうだい", body: "マリア・アントニアは15番目"}
      - 聞き: 16人！？ 女帝やりながら？ 体力どうなってんの。
        tone: 驚き
      - 語り: マリア・アントニアは、その15番目。娘としては、いちばん下でした。
      - 聞き: 末っ子だ。かわいがられたんだろうなあ。
        tone: しみじみ
      - 語り: のびのびと育ったようです。勉強はあまり得意ではなくて、字を書くのも、本を読むのも苦手だったと伝えられています。その代わり、音楽と踊りが好きで、人なつこい子でした。
        portrait: {image: paintings/maria_theresa_family.png, caption: "マリア・テレジアの家族（マイテンス画）"}
        card: null
      - 聞き: 勉強より音楽と踊り……普通の女の子って感じ。
        tone: 明るい
      - 語り: 宮殿には、ときどき珍しいお客もやってきました。1762年、6歳の神童モーツァルトが、シェーンブルン宮殿で演奏を披露しています。
        portrait: {image: paintings/mozart_child_1763.png, caption: "少年時代のモーツァルト（1763年）"}
        card: {head: "1762年", body: "6歳のモーツァルトが宮殿で演奏"}
        year: 1762
      - 聞き: え、モーツァルトと会ってるの！？
        tone: 驚き
      - 語り: 床で転んだモーツァルトを助け起こしたのが、幼い彼女で、モーツァルトが「大きくなったら僕のお嫁さんにしてあげる」と言った、という話も残っています。
      - 聞き: かわいい〜！
        tone: 笑い
      - 語り: ただし、これは後から語られた《言い伝え》で、本当にあったかどうかは分かっていません。
        tone: 強調
      - 聞き: あ、そこはちゃんと線引くんだ。
        tone: 納得
      - 語り: 地層を掘るときは、本物の層と、あとから積もった土を分けないとね。
        tone: 明るい
        card: null
      - 語り: さて、この少女の運命を決めたのは、彼女が生まれた次の年に起きた、ヨーロッパの大きな変化でした。
        tone: 重い
        background: {image: paintings/schonbrunn_bellotto.png, credit: "ベルナルド・ベッロット《シェーンブルン宮殿》"}
      - 語り: オーストリアとフランスは、《200年以上》、ヨーロッパの覇権を争う敵どうしでした。ところが1756年、両国は手を結びます。
        card: {head: "1756年", body: "外交革命：オーストリアとフランスが同盟"}
        icon: sword
      - 聞き: 敵どうしが、急に？
        tone: 疑問
      - 語り: プロイセンという、力をつけてきた共通の相手に備えるためです。昨日までの敵と味方が入れ替わった。これを「外交革命」と呼びます。
      - 聞き: でも、そういう約束って、すぐ破られそう。
        tone: 疑問
      - 語り: そこなんです。当時の王家にとって、同盟をいちばん確かなものにする方法は、子どもどうしを結婚させることでした。
        tone: 強調
        icon: handshake
      - 聞き: あ……もしかして。
        tone: ひそひそ
      - 語り: そう。フランス王家との縁組に選ばれたのが、末娘のマリア・アントニアでした。相手は、フランス国王ルイ15世の孫。のちのルイ16世です。
        portrait: {image: paintings/louis16_dauphin_vanloo.png, caption: "王太子ルイ（のちのルイ16世）"}
        card: {head: "縁組の相手", body: "ルイ15世の孫・王太子ルイ"}
      - 聞き: 本人の気持ちとか、関係ないんだ。
        tone: しみじみ
      - 語り: 結婚が決まると、少女の暮らしは一変します。フランス語の先生がつき、歯並びが直され、髪の生え際まで整えられました。
        portrait: {image: paintings/maria_antonia_ducreux.png, caption: "嫁ぐ前のマリア・アントニア（デュクルー画、1769年）"}
        card: null
      - 聞き: 生え際まで！？ そこまで作り替えるんだ……。
        tone: 驚き
      - 語り: フランスの宮廷にふさわしい花嫁に、仕立てるための準備でした。まだ十代の初めの少女は、自分の結婚が、二つの大国の約束そのものだと、どこまで分かっていたんでしょうね。
        tone: しみじみ
      - 語り: そして14歳の春。彼女は、二度と故郷に戻らない旅に出ます。
        tone: しみじみ
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 14歳の花嫁
    background: {image: paintings/versailles_patel_1668.jpg, credit: "ピエール・パテル《ヴェルサイユ宮殿》1668年"}
    portrait: {image: paintings/maria_antonia_ducreux.png, caption: "嫁ぐ前のマリア・アントニア（デュクルー画、1769年）"}
    year: 1770
    card: {head: "1770年 春", body: "ウィーンを出発"}
    lines:
      - 語り: 1770年の春、マリア・アントニアはウィーンを発ちました。長い馬車の列を連ねた旅は、およそ《3週間》。
        figure: {type: map, title: 花嫁の旅（1770年）, bounds: [0.5, 18.8, 46.2, 50.6], places: [[ウィーン, 16.37, 48.21], [ストラスブール, 7.75, 48.58], [ヴェルサイユ, 2.13, 48.80]], route: [ウィーン, ストラスブール, ヴェルサイユ], note: およそ3週間}
      - 聞き: 3週間も馬車！お尻が痛くなりそう。
        tone: 笑い
      - 語り: フランスとの国境、ライン川の中州に建てられた建物で、花嫁の引き渡しが行われます。言い伝えでは、ここでオーストリアから着てきた服を《すべて》脱いで、フランス製の衣装に着替えさせられたといいます。
        tone: 強調
        card: {head: "国境の中州", body: "花嫁の引き渡し"}
      - 聞き: え、服ぜんぶ置いてくの？ 思い出のものも？
        tone: 驚き
      - 語り: 故郷のものは、何ひとつ持ち込まない。それが、フランスの王妃になるということでした。この瞬間から、彼女は「マリー・アントワネット」になります。
        tone: しみじみ
      - 聞き: なんか、名前ごと取り替えられたみたい。
        tone: しみじみ
      - 語り: 1770年5月16日、ヴェルサイユ宮殿の礼拝堂で結婚式。花嫁は《14歳》、花婿の王太子ルイは15歳でした。
        portrait: {image: paintings/louis16_dauphin_vanloo.png, caption: "王太子ルイ（のちのルイ16世）"}
        card: {head: "1770年5月16日", body: "ヴェルサイユで結婚式"}
        figure: null
        icon: church
      - 聞き: 14歳と15歳……中学生どうしだ。
        tone: 驚き
      - 語り: そして、ヴェルサイユは、世界でいちばん華やかで、いちばん窮屈な場所でした。
        tone: 重い
        card: null
      - 聞き: 窮屈？
        tone: 疑問
      - 語り: 王族の暮らしは、朝起きてから夜眠るまで、細かな作法で決められていました。朝の着替えにも決まった順番があって、身分の高い女性から順に、下着を手渡していくんです。
        icon: dress
      - 聞き: 自分で着替えちゃだめなの？
        tone: 疑問
      - 語り: だめなんです。冬の朝、着替えの途中で、もっと身分の高い人が部屋に入ってくるたびに、手渡しがやり直しになって、王太子妃は裸のまま震えて待っていた、という話も伝わっています。
      - 聞き: ええ〜っ！？寒い寒い！
        tone: 驚き
      - 語り: 作法の監督役だった女官を、彼女は陰で「マダム・エチケット」と呼んでいました。
        tone: 笑い
      - 聞き: あだ名つけちゃってる！
        tone: 笑い
      - 語り: 人間関係も複雑でした。そのころ、ルイ15世のそばには、愛人のデュ・バリー夫人がいました。
        portrait: {image: paintings/dubarry_drouais.png, caption: "デュ・バリー夫人（ドルーエ画）"}
      - 語り: 身分の低い出のこの夫人を嫌った王太子妃は、宮廷のしきたりを逆手にとって、夫人に一言も話しかけませんでした。
      - 聞き: しきたりを逆手に？
        tone: 疑問
      - 語り: 当時の宮廷では、身分の低い人から高い人に、話しかけてはいけなかったんです。だから王太子妃が黙っていれば、夫人は何も言えない。
      - 聞き: うわ、それはきつい……。
        tone: ひそひそ
      - 語り: この沈黙は、やがて国どうしの問題になりかけます。最後は、母マリア・テレジアに説得されて、1772年の元日、たった一言だけ声をかけました。
        card: {head: "1772年 元日", body: "デュ・バリー夫人にたった一言"}
      - 聞き: で、なんて言ったの？
        tone: 疑問
      - 人物: 「今日のヴェルサイユは、たくさんの人ですこと」
        who: マリー
        bubble: {text: "や、やっと話しかけてくださった…！", x: 0.45, y: 0.22}
      - 聞き: ……それだけ！？
        tone: 驚き
      - 語り: それだけ。でも、宮廷じゅうがその一言を待っていたんです。
        tone: 笑い
        card: null
        portrait: {image: paintings/maria_antonia_ducreux.png, caption: "嫁ぐ前のマリア・アントニア（デュクルー画、1769年）"}
      - 語り: もう一つ、彼女を長く悩ませたことがありました。結婚してから何年たっても、子どもが生まれなかったんです。
        tone: しみじみ
      - 聞き: 王家だと、それって大問題でしょ？
        tone: 疑問
      - 語り: 大問題です。子どもができないのは王太子妃のせいだと、宮廷ではささやかれました。ウィーンの母からは、早く子どもを、という手紙が届き続けます。
        icon: chat-circle-dots
      - 語り: マリア・テレジアは、フランスにいる大使に、娘の様子を細かく報告させていて、手紙で厳しくたしなめることもありました。
        icon: envelope-simple
      - 聞き: 遠くにいても、ずっと見張られてるんだ……。
        tone: しみじみ
      - 語り: 最初の子ども、娘のマリー・テレーズが生まれたのは、1778年の12月。結婚から《8年あまり》がたっていました。
        tone: 強調
        card: {head: "1778年12月", body: "最初の子が誕生（結婚から8年）"}
      - 聞き: 8年……長い。
        tone: しみじみ
      - 語り: この長い8年のあいだ、宮廷に居場所を見つけられなかった若い王太子妃は、楽しみを、外に求めるようになっていきます。
        tone: 重い
        card: null
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 王妃の小さな城
    background: {image: paintings/petit_trianon.png, credit: "プチ・トリアノンの室内"}
    portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
    year: 1774
    card: {head: "1774年5月", body: "18歳でフランス王妃に"}
    lines:
      - 語り: 1774年5月、国王ルイ15世が天然痘で亡くなります。王太子がルイ16世として即位し、マリー・アントワネットは《18歳》でフランス王妃になりました。
      - 聞き: 18歳で王妃……今なら高校を出たばっかじゃん。
        tone: 驚き
      - 語り: 新しい国王は、妃にひとつの贈り物をします。ヴェルサイユの広い庭の一角に建つ、小さな館。プチ・トリアノンです。
        card: {head: "プチ・トリアノン", body: "国王から王妃への贈り物"}
      - 聞き: お城のプレゼント！？スケールが違う。
        tone: 笑い
      - 語り: ここは、王妃が作法から逃げられる、ただ一つの場所になりました。プチ・トリアノンには、王妃の招きがなければ、《国王でさえ》入れなかったといわれます。
        tone: 強調
      - 聞き: 王様より強い場所があるんだ。
        tone: 笑い
      - 語り: 王妃は気の合う友人だけを呼んで、お芝居をして、庭を歩いて、くつろいだ時間を過ごしました。のちには、庭の中に、田舎の村をまねた小さな集落、「王妃の村里」まで造らせています。
      - 聞き: 宮殿の庭に、村！？
        tone: 驚き
      - 語り: 流行も、王妃から生まれました。お抱えの服飾商ローズ・ベルタンと作ったドレスや、羽根や飾りを高く盛り上げた髪型を、パリの女性たちがこぞってまねしたんです。
        card: null
        icon: crown
      - 聞き: 今でいう、インフルエンサーじゃん。
        tone: 明るい
      - 語り: まさに。ただ、その影響力が、裏目に出ることもありました。
        tone: 重い
      - 語り: 1783年、画家のヴィジェ＝ルブランが、薄い白の木綿のドレスを着た王妃の肖像を、展覧会に出しました。
        portrait: {image: paintings/marie_chemise_1783.jpg, caption: "白い木綿のドレスの王妃（ヴィジェ＝ルブラン画、1783年）"}
        card: {head: "1783年", body: "展覧会で騒ぎになった肖像"}
      - 聞き: え、きれいじゃん。これの何がだめなの？
        tone: 疑問
      - 語り: 王妃が、《下着のような姿》で描かれている、と言われたんです。
        tone: 強調
      - 聞き: え、これが下着扱い！？
        tone: 驚き
      - 語り: 絵は展覧会から下げられて、代わりに、絹のドレスでバラを手にした王妃の肖像が掛けられました。
        portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
        figure: {type: compare, title: 王妃の2枚の肖像, people: [[白い木綿のドレス, paintings/marie_chemise_1783.jpg, 1783年・展覧会から下げられた], [絹のドレス, paintings/marie_vigee_1778.jpg, 王妃らしいとされた姿]]}
      - 語り: 王妃がくつろいで見せた素顔は、多くの人には、王妃らしくない姿に映ったんです。
        tone: しみじみ
        figure: null
      - 聞き: 気を抜いた写真がSNSで叩かれる感じだ……。
        tone: しみじみ
      - 語り: 問題は服だけではありませんでした。王妃は一部の親しい友人を重く用いて、なかでもポリニャック伯爵夫人の一族には、高い地位や多くの手当てが与えられました。
        portrait: {image: paintings/polignac_vigee.png, caption: "ポリニャック伯爵夫人（ヴィジェ＝ルブラン画）"}
        card: null
      - 聞き: あ、えこひいき。
        tone: ひそひそ
      - 語り: そう。そこから外された貴族たちは、面白くない。王妃の悪い噂は、民衆より先に、《宮廷の中から》広がっていきました。
        tone: 強調
      - 聞き: 敵は、身内にいたんだ。
        tone: 重い
      - 語り: それでも、このころの王妃には、母としての穏やかな時間もありました。1781年には待望の男の子、王太子ルイ・ジョゼフが、1785年には次男のルイ・シャルルが生まれます。
        portrait: {image: paintings/marie_children_1787.png, caption: "王妃と子どもたち（ヴィジェ＝ルブラン画、1787年）"}
        card: {head: "1781年・1785年", body: "二人の王子が誕生"}
      - 語り: 王妃は子どもたちを自分の手で育てることにこだわって、王妃の村里でも、子どもたちを遊ばせていたといいます。
        tone: しみじみ
      - 聞き: いいお母さんじゃん。
        tone: 明るい
      - 語り: けれど、宮廷の外では、王妃の評判は、少しずつ、確実に下がっていました。そして1785年の夏、それを決定的にする事件が起きます。
        tone: 重い
        card: null
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 首飾り事件
    background: {image: paintings/versailles_patel_1668.jpg, credit: "ピエール・パテル《ヴェルサイユ宮殿》1668年"}
    portrait: {image: paintings/necklace_engraving.jpg, caption: "首飾り事件の関係者たち（当時の版画）"}
    year: 1785
    lines:
      - 語り: 事件の中心にあったのは、一本の、ダイヤモンドの首飾りでした。
        short: s2
      - 聞き: さっきの、日当3000年分の！
        tone: 明るい
      - 語り: そう。もとは先王ルイ15世の愛人、デュ・バリー夫人のためにパリの宝石商が作ったもので、《600個を超える》ダイヤモンドを連ねた品です。
        tone: 強調
        card: {head: "首飾り", body: "ダイヤモンド600個以上"}
      - 聞き: ろっぴゃっこ！？首、重そう……。
        tone: 驚き
      - 語り: ところが先王が亡くなって、買い手がいなくなります。宝石商は王妃に買ってもらおうとしましたが、王妃は《断りました》。
        tone: 強調
        short: s2
      - 聞き: え、断ってるんだ。
        tone: 驚き
        short: s2
      - 語り: ここに目をつけたのが、ジャンヌ・ド・ラ・モットという女性です。王家の遠い血筋を名乗りながら、暮らしに困っていた彼女は、手の込んだ詐欺を思いつきます。
        card: {head: "ジャンヌ・ド・ラ・モット", body: "王家の遠い血筋を名乗る女性"}
        short: s2
      - 聞き: 詐欺……あ、ここで首飾りがつながるのか。
        tone: 納得
      - 語り: 狙われたのは、ロアン枢機卿。名門の出で、教会の高い地位にありながら、王妃にひどく嫌われていた人物です。
        portrait: {image: paintings/rohan_cardinal.png, caption: "ロアン枢機卿"}
        card: {head: "ロアン枢機卿", body: "王妃に嫌われていた名門の聖職者"}
      - 語り: どうにかして王妃に気に入られたい枢機卿に、ジャンヌは近づきます。「私は王妃さまと親しいの。あなたのこと、取りなしてあげましょう」。
        tone: ひそひそ
        bubble: {text: "王妃さまに気に入られたい…", x: 0.48, y: 0.2}
      - 聞き: うわ、絶対だまされるやつだ。
        tone: ひそひそ
      - 語り: ジャンヌは、王妃の名前を書いたニセの手紙を、枢機卿に渡し続けます。そして1784年の夏の夜、ヴェルサイユの庭の木立で、枢機卿は「王妃」と会うんです。
        card: {head: "1784年 夏の夜", body: "庭の木立で「王妃」と会う"}
        short: s2
        icon: envelope-simple
      - 聞き: え、本物の王妃に？
        tone: 疑問
        short: s2
      - 語り: いいえ。王妃によく似た若い女性を、ジャンヌが雇って演じさせたんです。暗がりで一輪のバラを受け取った枢機卿は、すっかり信じ込んでしまいました。
        tone: 強調
        short: s2
      - 聞き: ニセモノ王妃！？映画みたい！
        tone: 驚き
        short: s2
      - 語り: やがてニセの手紙で、「王妃は首飾りを、内密に買いたがっている。仲立ちをお願いしたい」と頼まれた枢機卿は、分割払いの約束で首飾りを引き取って、ジャンヌに渡してしまいます。
        card: null
        figure: {type: people, title: 首飾り事件の関係, nodes: [[ジャンヌ, 詐欺を考えた], [ロアン枢機卿, だまされた], [宝石商, 首飾りを渡した], [王妃, 関わっていない]], edges: [[ジャンヌ, ロアン枢機卿, ニセの手紙], [宝石商, ロアン枢機卿, 首飾り]], cross: [王妃]}
      - 聞き: あーあ……。
        tone: しみじみ
      - 語り: 首飾りはすぐにばらされ、ダイヤモンドはロンドンなどで売りさばかれました。
        icon: diamond
      - 語り: すべてが明るみに出たのは、代金の支払いが滞って、宝石商が王妃に直接問い合わせたときです。王妃にとっては、《まったく身に覚えのない》話でした。
        tone: 強調
      - 聞き: そりゃそうだよね、断ってるんだから。
        tone: 納得
      - 語り: 1785年8月15日。礼拝に向かおうとしていた枢機卿は、宮殿の中で、礼服のまま逮捕されました。
        portrait: {image: paintings/rohan_cardinal.png, caption: "ロアン枢機卿"}
        card: {head: "1785年8月15日", body: "ロアン枢機卿、逮捕"}
        figure: null
        bubble: {text: "なぜ私が…!?", x: 0.48, y: 0.2}
      - 聞き: 礼服のまま！大騒ぎだ。
        tone: 驚き
      - 語り: 国王と王妃は、事件をパリの高等法院の裁判にかけました。王妃の潔白を、公の場ではっきりさせたかったんです。でも、この判断が《裏目に》出ます。
        tone: 重い
      - 聞き: え、なんで？
        tone: 疑問
      - 語り: 1786年5月、判決。ジャンヌは有罪となり、肩に焼き印を押されて牢に入れられました。一方、ロアン枢機卿は《無罪》。だまされただけだ、と認められたんです。
        card: {head: "1786年5月 判決", body: "ジャンヌは有罪、枢機卿は無罪"}
      - 聞き: それ、正しい判決なんじゃ……？
        tone: 疑問
      - 語り: 中身は正しい。でも、人々はこれを、王妃の負けだと受け止めました。枢機卿が、夜の庭で王妃と会えると信じたのは、「王妃ならやりかねない」と思われていたからじゃないか、と。
        tone: 強調
      - 聞き: 信じた側じゃなくて、信じられた側が悪いことにされたんだ……。
        tone: しみじみ
      - 語り: のちに牢を抜け出してロンドンに渡ったジャンヌは、王妃を悪者にした回想録を出して、それがまた読まれました。
      - 語り: 王妃はこの事件で、一銭も得ていません。だまされた側の一人でした。それなのに、この事件をきっかけに、「浪費家で、裏で何をしているか分からない王妃」という像が、フランスじゅうに広まっていったんです。
        tone: 重い
        card: null
      - 語り: そして、事件から4年後。パリで、革命が始まります。
        tone: 重い
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 革命と逃亡
    background: {image: paintings/bastille_houel.png, credit: "ジャン＝ピエール・ウエル《バスティーユ襲撃》"}
    portrait: null
    year: 1789
    lines:
      - 語り: 首飾り事件のころ、フランスの財政は、すでに行き詰まりかけていました。大臣たちは、それまで税を免れていた貴族や聖職者にも税をかけようとしますが、特権を持つ人たちの強い反対で、改革は進みません。
        icon: coins
      - 聞き: お金持ちが払わないの、今も昔も同じだ。
        tone: ひそひそ
      - 語り: 追い詰められた国王は、1789年5月、《170年あまり》開かれていなかった全国三部会を開きます。聖職者、貴族、平民の代表が集まる会議です。
        card: {head: "1789年5月", body: "全国三部会を招集"}
      - 語り: ちょうどそのころ、王妃は深い悲しみの中にいました。病気がちだった長男、王太子ルイ・ジョゼフが、1789年6月4日、7歳で亡くなったんです。
        tone: しみじみ
        card: {head: "1789年6月4日", body: "王太子ルイ・ジョゼフ、7歳で死去"}
      - 聞き: え……。
        tone: しみじみ
      - 語り: そのわずか2年前には、末の娘ソフィーも、1歳になる前に亡くしていました。
        tone: しみじみ
      - 聞き: 立て続けに……。それはつらすぎる。
        tone: 重い
      - 語り: でも、時代は王家の悲しみを待ってはくれませんでした。7月14日、パリの民衆がバスティーユ牢獄を襲います。フランス革命の始まりです。
        tone: 強調
        card: {head: "1789年7月14日", body: "バスティーユ襲撃"}
      - 聞き: ついに来た……！
        tone: 驚き
      - 語り: その年の10月5日。パンの値上がりに苦しむパリの女性たちが、雨の中を、ヴェルサイユまで行進しました。
        background: {image: paintings/march_versailles_1789.png, credit: "ヴェルサイユへの行進（1789年の版画）"}
        card: {head: "1789年10月5日", body: "パリの女性たち、ヴェルサイユへ行進"}
        icon: bread
      - 語り: 群衆は翌日の明け方、宮殿になだれ込み、王妃の寝室にまで迫ります。王妃は間一髪、隠し通路を抜けて、国王の部屋へ逃れました。
        tone: 強調
      - 聞き: 寝室まで……。逃げ道がなかったらと思うと、こわすぎる。
        tone: 重い
      - 語り: その日のうちに、国王一家はパリへ連れて行かれます。住まいはテュイルリー宮殿。ヴェルサイユに戻ることは、《二度と》ありませんでした。
        tone: 重い
        card: null
      - 語り: パリでの暮らしは、目に見えない牢獄のようなものでした。王妃は、ひそかに国外へ逃げる計画を進めます。手を貸したのは、スウェーデンの貴族、フェルセン伯爵。王妃と深い友情で結ばれていた人物です。
        portrait: {image: paintings/fersen_portrait.png, caption: "フェルセン伯爵"}
        icon: lock
      - 聞き: 深い友情……ふむふむ。
        tone: 笑い
      - 語り: そこは、掘りすぎない約束ですよ。
        tone: 笑い
      - 語り: 1791年6月20日の深夜。国王一家は変装して、テュイルリー宮殿を抜け出しました。王妃は子どもたちの養育係に、国王は従僕に扮していました。
        background: {image: paintings/varennes_arrest.png, credit: "《ヴァレンヌでの国王一家の逮捕》"}
        portrait: null
        year: 1791
        card: {head: "1791年6月20日 深夜", body: "国王一家、変装して脱出"}
        short: s3
      - 聞き: 王様が従僕って……その変装、逆に目立たない？
        tone: 疑問
        short: s3
      - 語り: 目指すのは、国境に近い町モンメディ。国王に忠実な軍が待っているはずでした。ところが、計画は少しずつ狂っていきます。
      - 語り: 一家が乗ったのは、大人数が乗れる大きな馬車で、出発も予定より遅れました。途中で会うはずの護衛の兵とは、行き違いになります。
        short: s3
        icon: horse
      - 聞き: 目立つ馬車で、遅刻で、迎えもいない……。
        tone: しみじみ
        short: s3
      - 語り: そして、立ち寄った宿場町で、国王の顔に気づいた者がいました。決め手は、《紙幣に刷られた国王の肖像》だったといわれます。
        tone: 強調
        short: s3
      - 聞き: お札の顔でバレた！？
        tone: 驚き
        short: s3
      - 語り: 6月21日の夜、目的地まであと少しの、ヴァレンヌという小さな町で、一家は足止めされ、捕らえられました。
        tone: 重い
        card: {head: "1791年6月21日", body: "ヴァレンヌで捕らえられる"}
        short: s3
        figure: {type: map, title: ヴァレンヌ逃亡（1791年）, bounds: [1.2, 6.6, 48.3, 50.0], places: [[パリ, 2.35, 48.86], [ヴァレンヌ, 5.03, 49.23], [モンメディ, 5.37, 49.52]], route: [パリ, ヴァレンヌ], note: 目的地まであと少し}
      - 語り: パリへ戻る道は、沈黙に包まれていました。沿道の人々は、帽子も取らずに、馬車を見送ったといいます。
        tone: しみじみ
      - 聞き: 帽子を取らないって……？
        tone: 疑問
      - 語り: 国王に敬意を払わない、という無言の意思表示です。国を捨てて逃げようとした国王。そして、その逃亡を仕組んだのは、実家のオーストリアとつながる王妃だ。
        tone: 重い
      - 語り: ヴァレンヌでの失敗で、国王一家への信頼は、ほとんど失われてしまいました。
        tone: 重い
        card: null
      - 語り: ここから、王妃に残された時間は、あと2年あまりです。
        tone: 重い
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 最後の一年
    background: {image: paintings/tuileries_1792.png, credit: "ジャック・ベルトー《1792年8月10日》"}
    portrait: null
    year: 1792
    lines:
      - 語り: 1792年4月、フランスはオーストリアに宣戦します。王妃の故郷が、正式に、敵になりました。
        tone: 重い
        card: {head: "1792年4月", body: "フランスがオーストリアに宣戦"}
      - 聞き: 実家と、嫁ぎ先が戦争……。
        tone: しみじみ
      - 語り: 戦いがフランスに不利に進むと、人々の疑いは王妃に向きました。敵に作戦を漏らしているんじゃないか。実際に、王妃は外国の宮廷と、ひそかに手紙をやりとりしていました。
      - 聞き: あ、そこは本当なんだ。
        tone: 驚き
      - 語り: 本当です。だから、すべてが濡れ衣だった、とは言えません。ここも、ちゃんと地層を分けておきましょう。
        tone: 納得
      - 語り: 1792年8月10日、武装した民衆がテュイルリー宮殿を襲います。王権は停止され、国王一家は、パリの中にあるタンプル塔に移されました。
        card: {head: "1792年8月10日", body: "王権停止、タンプル塔へ"}
        background: {image: paintings/temple_tower.png, credit: "ギニャール《タンプル塔（1889年の復元）》"}
      - 語り: 9月には、パリの牢獄で、捕らえられていた人々が次々と殺される事件が起きます。その中に、王妃の親しい友人だった、ランバル公妃がいました。
        tone: 重い
      - 聞き: 王妃と仲がよかったってだけで……。
        tone: しみじみ
      - 語り: 9月21日、王政の廃止が宣言されます。フランスは共和国になり、国王は「ルイ・カペー」という、一人の市民として裁かれることになりました。
        card: {head: "1792年9月21日", body: "王政廃止"}
      - 語り: そして1793年1月21日。ルイ16世は、処刑されました。
        tone: 重い
        background: {image: paintings/louis16_execution.png, credit: "《ルイ16世の処刑》1793年の版画"}
        year: 1793
        card: {head: "1793年1月21日", body: "ルイ16世、処刑"}
      - 聞き: 夫まで……。あーしなら、もう立っていられないかも。
        tone: しみじみ
        pause: 1.0
      - 語り: 夫を失った王妃には、さらにつらい別れが待っていました。1793年の7月、8歳の息子ルイ・シャルルが、母のもとから引き離されたんです。
        tone: しみじみ
        background: {image: paintings/temple_tower.png, credit: "ギニャール《タンプル塔（1889年の復元）》"}
        card: {head: "1793年7月", body: "息子と引き離される"}
      - 聞き: 8歳の子を……。
        tone: 重い
      - 語り: 8月、王妃はセーヌ川の中州にある牢獄、コンシェルジュリーに移されます。窓の小さな、湿った独房で、見張りの兵がいつもそばにいました。
        background: {image: paintings/conciergerie.png, credit: "《コンシェルジュリーを出るマリー・アントワネット》"}
        card: {head: "1793年8月", body: "コンシェルジュリーの独房へ"}
        icon: lock
      - 語り: 10月14日から、革命裁判所での裁判が始まりました。国の財産を浪費したこと、敵の国と通じたこと。それに加えて、検察側の証人は、とても信じられない、汚らわしい罪まで持ち出しました。
        card: {head: "1793年10月14日", body: "革命裁判所で裁判"}
      - 聞き: どんな……？
        tone: ひそひそ
      - 語り: 王妃が、自分の息子に、母親としてあるまじきことをした、というものです。
        tone: 重い
      - 聞き: そんなの、ただの言いがかりじゃん！
        tone: 驚き
      - 語り: 王妃はしばらく黙っていましたが、答えを促されると、こう言ったと伝えられています。
      - 人物: 「母親に向けられたこのような訴えには、答えることを、本性が拒みます。ここにいる、すべての母親たちに、私は訴えます」
        who: マリー
        tone: 強調
      - 聞き: ……強い人。
        tone: しみじみ
        pause: 0.8
      - 語り: 傍聴席の女性たちの間に、ざわめきが広がったといいます。それでも、判決は最初から決まっていました。10月16日の明け方、死刑が言い渡されます。
        tone: 重い
        card: {head: "1793年10月16日", body: "死刑判決"}
      - 語り: その日の昼、王妃は髪を短く切られ、両手を後ろで縛られて、荷車に乗せられました。国王のときのような馬車ではなく、罪人を運ぶための、粗末な荷車でした。
        portrait: {image: paintings/marie_david_sketch.png, caption: "処刑に向かう王妃（ダヴィッドのスケッチ、1793年）"}
      - 語り: その姿を、のちに名を残す画家ダヴィッドが、通りから素早く写し取っています。背筋を伸ばして、まっすぐ前を見つめた、一人の女性の姿です。
        tone: しみじみ
      - 聞き: この絵……。泣いても、怯えてもいない。
        tone: しみじみ
      - 語り: 革命広場で断頭台に上ったとき、王妃は誤って、処刑人の足を踏んでしまいました。そのとき、こう言ったと伝えられています。
        tone: しみじみ
      - 人物: 「ごめんなさい。わざとではないのよ」
        who: マリー
        tone: しみじみ
      - 聞き: 最後まで、それなんだ……。
        tone: しみじみ
      - 語り: それが、残された最後の言葉でした。マリー・アントワネット、《37歳》。14歳でウィーンを発ってから、23年後のことでした。
        tone: 重い
        card: {head: "1793年10月16日", body: "37歳で処刑"}
      - 聞き: ……でも、どうしてここまで、嫌われちゃったんだろう。
        tone: しみじみ
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 見立て：憎しみはなぜ王妃に集まったのか
    background: {image: paintings/versailles_patel_1668.jpg, credit: "ピエール・パテル《ヴェルサイユ宮殿》1668年"}
    portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
    year: 1789
    lines:
      - 語り: さて、いちばん底の層です。なぜ人々の怒りは、彼女に集まったのか。
        tone: 強調
      - 聞き: やっと、そこを掘るんだ。
        tone: 明るい
      - 語り: まず、お金の話から。革命の前の年、1788年の3月に、政府は国王に予算の報告を出しています。
        card: {head: "1788年3月", body: "国の予算の報告"}
        short: s4
      - 語り: それによると、見込まれた支出は、およそ《6億3000万リーヴル》。それに対して、入ってくるお金は、およそ5億リーヴルしかありませんでした。
        tone: 強調
        card: {head: "1788年の見込み", body: "支出 約6億3000万／収入 約5億リーヴル"}
        short: s4
      - 聞き: 赤字だ！
        tone: 驚き
        short: s4
      - 語り: しかも支出のうち、《ほぼ半分》が、借金の返済と利息に消えていたんです。
        tone: 強調
        card: {head: "支出のほぼ半分", body: "借金の返済と利息"}
        short: s4
        figure: {type: pie, title: 1788年 国の支出, parts: [[借金の返済と利息, 46], [そのほか, 54]], unit: "%", note: 支出 約6億3000万リーヴルのうち}
      - 聞き: 半分が借金！？じゃあ、その借金はどこから……？
        tone: 疑問
        short: s4
      - 語り: 大きいのは戦争です。とくにアメリカの独立戦争で、フランスはイギリスと戦う側を支えるために、多くの費用を借金でまかないました。
        short: s4
      - 語り: 王妃の衣装や離宮にお金がかかったのは事実です。でも、歴史家の多くは、王妃の浪費は、国の借金の《小さな原因の一つ》にすぎなかったと見ています。
        tone: 強調
        card: null
        short: s4
      - 聞き: なのに、「赤字夫人」って呼ばれてたんでしょ？
        tone: 疑問
      - 語り: そう。そこに一つ目の理由があります。借金の利息や戦争の費用は、目に見えません。でも、ドレスや宝石は、目に見える。
        tone: 強調
        card: {head: "理由①", body: "贅沢は目に見える"}
        figure: null
      - 聞き: 暮らしが苦しいとき、怒りは、顔の見える人に向かう……。
        tone: 納得
      - 語り: 二つ目は、彼女が《外国から来た人》だったこと。フランスとオーストリアは長いあいだ敵どうしで、結婚はその関係を変えるための同盟でした。でも、国の中には、それを快く思わない人が大勢いました。
        card: {head: "理由②", body: "外国から来た王妃"}
      - 語り: 「オーストリア女」という呼び名には、王妃は結局、よその国の味方なんだろう、という疑いが込められていたんです。
      - 聞き: 実際に、戦争中に手紙をやりとりしてたし……。
        tone: しみじみ
      - 語り: だから、その疑いが大きく育つ土台があった。三つ目は、当時の《新しいメディア》です。
        card: {head: "理由③", body: "安い刷り物が中傷を広めた"}
      - 聞き: メディア？18世紀に？
        tone: 疑問
      - 語り: 18世紀の終わりのパリでは、安く刷られた小冊子や風刺画が、大量に出回っていました。その中には、王妃を題材にした、根拠のない中傷もたくさんあった。
        icon: newspaper
      - 語り: 首飾り事件のように、王妃が関わっていない出来事でさえ、「あの王妃ならやりかねない」という空気の中で受け取られました。冒頭の「パンがなければ」が彼女の言葉になったのも、同じ流れです。
        tone: 強調
      - 聞き: 今のネットの噂と、そっくり……。
        tone: 驚き
      - 語り: そして四つ目は、国王ルイ16世の影の薄さ。王は錠前づくりや狩りが好きな、おだやかな人でした。国のいちばん上の人を正面から責めることには、まだ、ためらいがあったんです。
        portrait: {image: paintings/louis16_dauphin_vanloo.png, caption: "ルイ16世（若いころ）"}
        card: {head: "理由④", body: "責めにくい国王の代わりに"}
      - 聞き: だから、そばにいて目立つ王妃が……。
        tone: 納得
      - 語り: 責めやすい相手になった。
        tone: 重い
        portrait: {image: paintings/marie_vigee_1778.jpg, caption: "マリー・アントワネット（ヴィジェ＝ルブラン画、1778年）"}
        card: null
      - 語り: つまり、彼女が憎まれたのは、特別に悪い人だったからではありません。目に見える贅沢、外国の出身、中傷を一気に広める刷り物、責めにくい国王。この《四つが重なった場所》に、たまたま立っていたのが彼女でした。
        tone: 強調
      - 聞き: 悪女っていうより、悪役の席に座らされた人、なのかも。
        tone: しみじみ
      - 語り: いい言い方ですね、つむぎさん。大きな問題が起きたとき、人は分かりやすい悪役を求めます。そして一度その物語ができあがると、言ってもいない言葉まで、その人のものになってしまう。
        tone: しみじみ
      - 聞き: 230年たっても、まだ「パンがなければ」で覚えられてるんだもんね。
        tone: しみじみ
      - 語り: だからこそ、出どころを確かめることが、この王妃を、少しだけ公平に見ることにつながるんだと思います。
        tone: 納得
      - 聞き: 地表の下、ちゃんと掘れた気がする！
        tone: 明るい
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、清の国を動かした西太后。「清を滅ぼした悪女」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
