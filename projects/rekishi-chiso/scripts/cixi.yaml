      - 聞き: 憲法に議会って……。最初に聞いた悪女のイメージと、全然ちがう。
        tone: 驚き
      - 語り: ただ、これらの改革は、地方の有力な役人たちが先に進めていたものだ、という見方もあります。追い詰められて渋々認めた、と見る研究者も少なくありません。
      - 聞き: 誰の手柄かは、まだ割れてるってことね。
        tone: 納得
      - 語り: そして1908年11月14日。閉じこめられていた光緒帝が亡くなります。37歳でした。
        portrait: {image: paintings/guangxu_emperor.jpg, caption: "光緒帝（宮廷画）"}
        card: {head: "1908年11月14日", body: "光緒帝、37歳で死去"}
        tone: 重い
      - 語り: その翌日、11月15日。今度は、彼女が亡くなりました。72歳でした。
        portrait: {image: paintings/cixi_1903_xunling_throne.jpg, caption: "西太后（勲齢撮影、1903〜04年ごろ）"}
        card: {head: "1908年11月15日", body: "西太后、72歳で死去"}
        background: {image: paintings/cixi_funeral_1908_morrison.jpg, credit: "G・E・モリソン撮影《西太后の葬列》1908年"}
      - 聞き: 1日ちがい！？ それ、偶然なの？
        tone: 驚き
      - 語り: 2008年、光緒帝の髪と遺体が調べられました。髪からは、ふつうの2000倍ほどの砒素が見つかり、命を落とす量を超えていたと発表されています。
        card: {head: "2008年の調査", body: "光緒帝の髪から大量の砒素"}
      - 聞き: 毒殺だったんだ……。じゃあ、やっぱり西太后が？
        tone: 疑問
      - 語り: 砒素で亡くなったことまでは、調べで示されました。でも、誰が飲ませたのかは、分かっていません。彼女の命令と見る人は多いですが、それは推定の層です。
      - 聞き: 記録と推定を、ここでも分けるんだね。
        tone: 納得
      - 語り: 葬列には1万人ほどが加わり、棺は120キロ離れた陵墓まで、5日かけて運ばれたといいます。
        card: {head: "1908年12月", body: "葬列・およそ1万人"}
      - 聞き: 最後まで、すごい規模。
      - 語り: ただ、その眠りは長くは続きませんでした。1928年、軍閥の兵士たちが陵墓を爆破して、副葬品を奪っていきます。
        card: {head: "1928年", body: "陵墓が盗掘される"}
        tone: 重い
      - 聞き: 亡くなってからも、静かにさせてもらえなかったんだ……。
        tone: 重い
      - 語り: 跡継ぎには、2歳の溥儀が選ばれていました。そして1912年2月、清は、終わりを迎えます。
        card: {head: "1912年2月", body: "清の滅亡"}
      - 聞き: ……でも、やっぱり気になる。なんで、ここまで悪く言われるようになったんだろう。
        tone: しみじみ
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：悪女の物語はどこから来たのか
    background: {image: paintings/forbidden_city_qianqing_hall.jpg, credit: "紫禁城・乾清宮の玉座（1914年刊の図版）"}
    portrait: {image: paintings/cixi_xunling_seated_close.jpg, caption: "西太后（勲齢撮影、1903〜05年ごろ）", age: false}
    year: 1908
    lines:
      - 語り: さて、いちばん底の層です。なぜ西太后は、ここまでの悪女になったのか。
        tone: 強調
      - 聞き: やっと、そこを掘るんだ。
      - 語り: 一つ目は、海外へ逃げた改革派の宣伝です。康有為たちは、外国で「光緒帝を守る会」を作り、「賢い皇帝と、それを邪魔する頑固な皇太后」という物語を広めました。
        card: {head: "理由①", body: "逃げた改革派の宣伝"}
      - 語り: 皇帝からひそかに渡されたという手紙も、宛先を自分に書き換えて発表した、と指摘されています。
        icon: newspaper
      - 聞き: 自分たちが正しかったって言うために、相手をとことん悪く描いたってこと？
        tone: 疑問
      - 語り: 本当の手紙は、別の改革派に宛てたもので、言葉も、もっと控えめなものだった、という研究があります。わざと書き換えたのか、写しを見ずに書いたのかは、議論が分かれています。
      - 語り: そういう面があった、と研究者は見ています。二つ目は、イギリス人が書いた本です。1910年に出た西太后の伝記は、長いあいだ西洋で、いちばん基本の本として読まれてきました。
        card: {head: "理由②", body: "偽の日記を使った伝記"}
      - 語り: ところが、その本の大事な場面に使われた宮廷の日記は、作者のバックハウスが作った偽物だと、のちに分かりました。
      - 聞き: 偽物の日記……！？ それ、もう小説じゃん。
        tone: 驚き
      - 語り: 三つ目は、清を倒した側の宣伝です。「友好国にくれてやっても、家の奴隷には渡さない」という、西太后の言葉として有名な一言があります。
        card: {head: "理由③", body: "清を倒した側の宣伝"}
      - 語り: でも、もとの記録では、これは別の大臣の言葉でした。それが、いつの間にか、彼女の言葉にされていったんです。
      - 聞き: マリー・アントワネットの「パンがなければ」と、同じパターンだ。
        tone: 納得
      - 語り: その通りです。そして四つ目が、日本で大きかった、映画です。手足を切る場面は、冒頭で話したとおり、別の時代の話が混ざったものでした。
        card: {head: "理由④", body: "映画が残した強い場面"}
        icon: film-strip
      - 聞き: ここまで来ると、悪女の物語って、何人もで積み上げた地層みたい。
      - 語り: いい言い方ですね、つむぎさん。でも、ここで逆の方向に行きすぎるのも、また危ないんです。
      - 聞き: 逆って、本当はいい人だった、ってこと？
        tone: 疑問
      - 語り: 近年は、彼女を「近代中国を作った人」と高く評価する本も出ています。でも、それに対しては、都合のいい証拠だけを集めている、という批判も多いんです。
      - 語り: 改革の多くは、地方の役人たちが始めたもので、彼女はそれに判を押しただけではないか。追い詰められて、渋々認めた改革ではないか。そういう指摘です。
      - 聞き: 悪女の物語の逆で、今度は「すごい人の物語」が盛られちゃう可能性もあるってことか。
        tone: 疑問
      - 語り: その通りです。どちらの物語にも、掘ると別の層が出てきます。
      - 語り: 裁判なしの処刑、甥の皇帝を閉じこめたこと、そして世界に戦いを挑んだ1900年の決断。これは、記録の層にはっきり残っています。
        tone: 重い
      - 聞き: 悪女でも聖女でもなくて……。追い詰められた国で、半世紀も舵を握り続けた人、なのかも。
        tone: しみじみ
      - 語り: 僕も、そう思います。そして、女性が国を動かしたこと自体が、物語を大きくしていった面も、あったのかもしれません。
        tone: しみじみ
      - 聞き: 「三大悪女」って、3人とも女の人なのも、そういうことか……。
      - 語り: 彼女の遺言として、「今後、女に国の政治をさせてはならない」という言葉がよく紹介されます。でも、これは正式な遺言には書かれていません。
      - 聞き: え、それも作られた言葉なの？
        tone: 驚き
      - 語り: 出どころが確かめられない言葉です。こういう言葉が、彼女の口から出たことにされて広まっていったこと自体が、女性の権力者がどう見られてきたかを、表しているのかもしれません。
        tone: しみじみ
      - 語り: 次の回では、その3人のうちの、もう一人を掘ります。
      - 聞き: 地表の下、今日もちゃんと掘れた気がする！
        tone: 明るい
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、中国でただ一人の女帝、武則天。「わが子まで手にかけた悪女」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

