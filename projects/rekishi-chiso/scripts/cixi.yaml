shorts:
  s1:
    title: "あの残酷な話は／別の悪女の話？"
    yt_title: "西太后の残酷な伝説は、映画が広めた別の悪女の話だった？"
    lead: "ライバルの妃をむごたらしい姿にした、という有名な話。実在の麗妃は、位を上げられて50代で穏やかに亡くなっていました。"
    tags: [西太后 だるま, 西太后 映画, 中国三大悪女, 麗妃, 呂后]
  s2:
    title: "清を滅ぼした悪女？／滅亡は死後3年"
    yt_title: "西太后は清を滅ぼしていない？清の滅亡は死後3年"
    lead: "西太后が亡くなったのは1908年、清が滅びたのは1912年。晩年は科挙をやめ、憲法の準備まで始めていました。"
    tags: [清の滅亡, 清 滅亡, 清朝末期, 中国三大悪女]
  s3:
    title: "頤和園は海軍の金で／造られたのか"
    yt_title: "頤和園は海軍のお金で造られた？西太后の流用は本当だった"
    lead: "海軍のお金が頤和園に回されたのは事実。研究者の推計で約700万〜860万両。日当を1万円とすると約7500億円（目安）。"
    tags: [頤和園, 西太后 頤和園, 北洋艦隊, 日清戦争, 日清戦争 わかりやすく]
  s4:
    title: "東太后は／毒殺されたのか"
    yt_title: "西太后は東太后を毒殺したのか"
    lead: "1881年、東太后が急死。毒殺の話が書き物に出てくるのは30年ほど後で、当時の日記には急な病の様子が書かれていました。"
    tags: [東太后, 慈安太后, 西太后 毒殺, 清朝 歴史]
  s5:
    title: "一食に百品は／本当か"
    yt_title: "西太后の食事は本当に一食百品だったのか"
    lead: "台所の記録を調べた研究では、1884年のある日の食事は38品。「百品」は数え方しだいで大きくも小さくもなる数字でした。"
    tags: [西太后 中華料理, 西太后 食事, 宮廷料理, 清朝 宮廷]
  s6:
    title: "1日ちがいの死と／砒素"
    yt_title: "光緒帝の死因は砒素だった｜西太后が亡くなる前日の死"
    lead: "1908年11月14日に光緒帝、翌日に西太后が死去。2008年の調査で、光緒帝の髪から大量の砒素。誰が飲ませたかは分かっていません。"
    tags: [光緒帝, 光緒帝 毒殺, 西太后 最後, 砒素]
  s7:
    title: "珍妃は／井戸に落とされたのか"
    yt_title: "珍妃の井戸｜西太后が落とさせたという話は本当か"
    lead: "1900年8月15日、北京を逃げ出した日に珍妃が井戸で死去。宦官の証言が出たのは30年ほど後でした。"
    tags: [珍妃, 珍妃の井戸, 珍妃井, 義和団事件]
  s8:
    title: "列強を相手に／宣戦した皇太后"
    yt_title: "西太后は列強に宣戦した｜義和団事件と4億5000万両"
    lead: "1900年6月21日、清は列強に宣戦。賠償金は4億5000万両、利息を入れて約9億8000万両。清を大きく弱らせた決断でした。"
    tags: [義和団事件, 義和団の乱, 義和団事件 わかりやすく, 北京議定書]

