sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：清を滅ぼした悪女？
    background: {image: paintings/forbidden_city_qianqing_hall.jpg, credit: "紫禁城・乾清宮の玉座（1914年刊の図版）"}
    portrait: {image: paintings/cixi_xunling_seated_close.jpg, caption: "西太后（勲齢撮影、1903〜05年ごろ）", age: false}
    year: 1908
    lines:
      - 語り: 気に入らないライバルの妃を、むごたらしい姿にして、生かしておいた。
        short: s1
        tone: 重い
      - 聞き: ちょ、いきなり重すぎ。剣崎さん、それ誰の話？
        tone: 驚き
      - 語り: 清の国を半世紀近く動かした女性、西太后です。日本では「中国三大悪女」の一人として、こういう話と一緒に語られてきました。
      - 聞き: あー、名前は聞いたことある。清を滅ぼした悪女、でしょ？
        short: s2
        tone: 疑問
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: じゃあ、まずそのむごい話。あれは本当なの？
        short: s1
        tone: 疑問
      - 語り: ひどい目にあったとされるのは、麗妃という、西太后と同じ皇帝に仕えた妃です。でも、実在の麗妃は、そのあとも位を上げられて、50代で穏やかに亡くなっています。
        short: s1
        card: {head: "麗妃（1837〜1890）", body: "位を上げられ、53歳で病死"}
      - 聞き: え、ふつうに生きてるじゃん。
        short: s1
        tone: 驚き
      - 語り: この場面が広く知られたのは、1985年に日本で公開された映画『西太后』からです。
        short: s1
        card: {head: "1985年", body: "映画『西太后』が日本で公開"}
        icon: film-strip
      - 語り: しかも、あの残酷な場面は、2000年以上前の漢の時代、呂后という別の女性の話にそっくりなんです。そこに、唐の武則天の話も重なっています。
        short: s1
      - 聞き: 別の悪女の話が、混ざっちゃったってこと？
        short: s1
        tone: 疑問
      - 語り: 「三大悪女」とひとまとめにされるうちに、話が混ざっていったのかもしれません。
        short: s1
      - 聞き: でも、清を滅ぼしたってほうは本当なんでしょ？
        tone: 疑問
      - 語り: 実は、西太后が亡くなったのは1908年。清が滅びたのは1912年です。
        short: s2
        card: {head: "1908年 → 1912年", body: "死去から清の滅亡まで3年あまり"}
      - 聞き: え、亡くなってから3年以上あるじゃん。
        short: s2
        tone: 驚き
      - 語り: しかも晩年の彼女は、1300年続いた官僚の試験をやめ、憲法を作る準備まで始めていました。
        short: s2
      - 聞き: それ、悪女っていうより、改革する人じゃない？
        short: s2
        tone: 疑問
      - 語り: ただ、彼女が清を大きく弱らせた決断をしたのも、また事実です。今日は、そこも含めて掘ります。
        short: s2
      - 聞き: あと、海軍のお金で庭を造ったとか、皇帝を毒で殺したとかも聞いたことある。
        tone: 疑問
      - 語り: どちらも、今日掘ります。片方は本当で、もう片方は、まだ分かっていない。そこが面白いところです。
      - 語り: 下級の役人の家に生まれた娘が後宮に入り、25歳で国を動かす立場に立ち、72歳で亡くなるまで。そして最後に、いちばん底の層。なぜ彼女は、ここまでの悪女になったのか。
        year: 1835
        card: null
      - 聞き: 作業しながらでも、ラジオみたいに聞いてってね。
        tone: 明るい
      - 語り: では、掘っていきましょう。
        tone: 明るい
      - 聞き: はーい！
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: 下級官僚の娘
    background: {image: paintings/forbidden_city_meridian_gate_1860.jpg, credit: "フェリーチェ・ベアト《紫禁城の午門》1860年"}
    portrait: null
    year: 1835
    lines:
      - 語り: 1835年11月29日。満洲人の下級の役人の家に、一人の女の子が生まれました。のちの西太后です。
        card: {head: "1835年11月29日", body: "下級の役人の家に生まれる"}
      - 聞き: お姫さまの生まれじゃないんだ。
      - 語り: 違います。父親は、のちに地方の中級の役人まで出世しますが、名家ではありません。生まれた場所も、北京とする説が有力ですが、はっきりしていません。
      - 語り: 15歳のとき、皇帝の妃を選ぶ「秀女選び」に選ばれて、翌年、紫禁城の後宮に入ります。
        card: {head: "1852年", body: "16歳で後宮へ"}
        icon: crown
      - 聞き: 後宮って、妃にも順位があるの？
        tone: 疑問
      - 語り: 皇后を頂点に、妃たちには細かな位がありました。彼女の最初の位は「蘭貴人」。下から数えたほうが早い位です。
      - 聞き: 最初は、ほぼいちばん下からのスタートなんだ。
      - 語り: 後宮の暮らしを支えていたのは、宦官と呼ばれる男性の役人たちです。のちに彼女のそばには、李蓮英という宦官が長く仕えることになります。
      - 聞き: 宦官って、あーしもドラマで見たことある。
      - 語り: そうです。後宮の中のことは、宦官を通して動いていました。彼女は、その仕組みの中で、少しずつ自分の居場所を作っていきます。
      - 語り: 運命を変えたのは、1856年4月27日です。20歳の彼女は、咸豊帝の男の子を産みました。この皇帝の子で、無事に育った男の子は、この一人だけでした。
        card: {head: "1856年4月27日", body: "ただ一人育った皇子を産む"}
        portrait: {image: paintings/xianfeng_emperor.jpg, caption: "咸豊帝（宮廷画）"}
      - 聞き: ただ一人！？ それ、超重要じゃん。
        tone: 驚き
      - 語り: 次の皇帝の母になるということです。位は上がり、翌年には、皇后に次ぐ「貴妃」になりました。
      - 聞き: 今でいう、会社の跡取りを産んで、社長の家族の中心になる感じ？
        tone: 疑問
      - 語り: もっと大きな話ですね。国そのものの跡取りです。
      - 語り: ところが、その4年後の1860年。イギリスとフランスの軍隊が北京に迫りました。9月、皇帝の一家は、北京の北東、熱河の離宮へ逃れます。
        card: {head: "1860年9月", body: "英仏軍が北京へ。皇帝一家は熱河へ"}
        figure: {type: map, title: 北京から熱河へ（1860年）, places: [[北京, 116.40, 39.90], [熱河, 117.94, 40.98]], route: [北京, 熱河], bounds: [114.4, 120.2, 38.6, 42.0], note: およそ200km}
      - 聞き: え、皇帝が都を置いて逃げるの？ ふつう、最後まで守るとこじゃない？
        tone: 驚き
      - 語り: 逃げました。そして北京の郊外にあった皇帝の美しい離宮、円明園は、英仏軍に略奪され、イギリス軍の手で焼かれてしまいます。
        figure: null
        background: {image: paintings/yuanmingyuan_looting_1860.jpg, credit: "ゴドフロワ・デュラン《円明園の略奪》"}
        icon: fire
      - 聞き: うわ……。国の顔みたいな場所でしょ、それ。
        tone: 重い
      - 語り: このときの屈辱と、追い詰められた皇帝の姿を、彼女はすぐそばで見ていました。
        tone: しみじみ
      - 語り: 熱河に逃れた皇帝は、北京に戻る気力を失い、体を壊していきました。
      - 聞き: じゃあ、北京で外国と話をつけるのは誰？
        tone: 疑問
      - 語り: 北京に残った皇帝の弟、恭親王です。1860年の秋、恭親王はイギリス、フランスと講和の条約を結びます。その直後に撮られた、恭親王の写真が残っています。
        portrait: {image: paintings/prince_gong_1860_beato.jpg, caption: "恭親王（ベアト撮影、1860年）"}
      - 聞き: そんな昔の写真が残ってるんだ。でも、皇帝は遠くにいて、弟が北京で後始末……。もう、ばらばらじゃん。
        tone: 疑問
      - 語り: この、熱河の皇帝の周りと、北京の恭親王という分かれ方が、翌年の大きな事件の伏線になります。
      - 語り: そして翌年の夏。熱河で、皇帝が病に倒れます。
        tone: 重い
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 25歳のクーデター
    background: {image: paintings/rehe_mountain_resort_map.jpg, credit: "関念慈《熱河行宮全図》19世紀後半"}
    portrait: {image: paintings/xianfeng_emperor.jpg, caption: "咸豊帝（宮廷画）"}
    year: 1861
    lines:
      - 語り: 1861年8月22日、咸豊帝は熱河で亡くなりました。30歳でした。
        card: {head: "1861年8月22日", body: "咸豊帝、熱河で死去"}
      - 聞き: 30歳……若い。じゃあ、次の皇帝は？
        tone: 疑問
      - 語り: 彼女が産んだ男の子です。まだ5歳でした。
        portrait: {image: paintings/tongzhi_emperor.jpg, caption: "同治帝（宮廷画）"}
      - 聞き: 5歳じゃ、政治なんてできないよね。
      - 語り: そこで皇帝は亡くなる前に、8人の大臣を選んで、幼い皇帝を支えるよう言い残していました。
      - 聞き: じゃあ、その8人が国を動かすんだ。
      - 語り: そのはずでした。でも、母親の彼女と、先の皇后である東太后は、外されてしまいます。
        portrait: {image: paintings/cian_empress_dowager.jpg, caption: "東太后（慈安太后、宮廷画）"}
      - 聞き: 母親なのに、外されるの？ あーし、それは黙ってられないかも。
        tone: 疑問
      - 語り: 彼女も黙っていませんでした。2人の太后は、北京にいた亡き皇帝の弟、恭親王と手を組みます。
        portrait: {image: paintings/prince_gong_1860_beato.jpg, caption: "恭親王（ベアト撮影、1860年）"}
      - 語り: 1861年11月、北京に戻ると、すぐに大臣たちの中心の3人を捕らえ、残りの5人からは職を取り上げました。
        card: {head: "1861年11月", body: "辛酉政変"}
        figure: {type: people, title: 1861年の政変, nodes: [[西太后, 皇帝の母・25歳], [東太后, 先の皇后], [恭親王, 亡き皇帝の弟], [8人の大臣, 皇帝の遺命で後見]], edges: [[西太后, 東太后, 手を組む], [西太后, 恭親王, 手を組む], [恭親王, 8人の大臣, 退ける]]}
        tone: 重い
      - 聞き: 25歳で、それをやったの？
        tone: 驚き
      - 語り: 25歳です。これを「辛酉政変」と呼びます。捕らえた3人のうち、1人は処刑され、2人には死が命じられました。
        tone: 重い
      - 聞き: 8人全員を、ってわけじゃないんだ。
      - 語り: 中心の3人に絞ったんです。手早く、そして最小限で終わらせた政変でした。
      - 語り: ここから、2人の太后が、幼い皇帝の代わりに政治を聞く形が始まりました。
        figure: null
      - 聞き: でも、女の人が表に出ていいの？
        tone: 疑問
      - 語り: そこで、玉座の後ろに簾をかけて、その向こうから話を聞いたんです。
        card: {head: "1861年〜", body: "簾の向こうからの政治"}
        icon: eye
      - 聞き: 簾ごしの政治……。見えないけど、全部聞いてるってことか。
      - 語り: 新しい年号は「同治」。「ともに治める」という意味だと言われています。
      - 聞き: 名前からして、2人の太后がいる前提なんだ。
        tone: 納得
      - 語り: この時代、清は、外国の技術を取り入れる運動を始めます。恭親王や李鴻章たちが中心になって、兵器の工場や造船所、外国語の学校が作られました。
        card: {head: "1860年代〜", body: "外国の技術を取り入れる運動"}
      - 聞き: 円明園を焼かれて、相手から学ぼうってなったんだ。
        tone: 納得
      - 語り: そういう流れです。そして、その動きを簾の向こうで認めていたのが、2人の太后でした。
      - 語り: こうして彼女は、25歳で国のいちばん奥に座りました。でも、10年あまりのち、その息子に、思いもよらないことが起きます。
        tone: しみじみ
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 息子の死と3歳の皇帝
    background: {image: paintings/forbidden_city_qianqing_hall.jpg, credit: "紫禁城・乾清宮の玉座（1914年刊の図版）"}
    portrait: {image: paintings/tongzhi_emperor.jpg, caption: "同治帝（宮廷画）"}
    year: 1873
    lines:
      - 語り: 1873年2月、息子の同治帝は自分で政治を始めます。2人の太后は、いったん簾の後ろから下がりました。
        card: {head: "1873年2月", body: "同治帝が自ら政治を"}
      - 聞き: やっと親から独り立ちだ。
        tone: 明るい
      - 語り: ところが、わずか2年後。1875年1月、同治帝は18歳で亡くなります。天然痘でした。
        card: {head: "1875年1月", body: "同治帝、18歳で死去"}
        tone: 重い
      - 聞き: 18歳……。一人息子を、そんなに早く。
        tone: 重い
      - 語り: しかも、跡継ぎの子どもがいませんでした。その夜のうちに、次の皇帝が決められます。選ばれたのは、彼女の妹の子。まだ3歳の男の子でした。
      - 聞き: 今度は3歳！？ それ、また簾の後ろに戻れるってことじゃん。
        tone: 驚き
      - 語り: そう見る人は、当時からいました。しかも、本来の跡継ぎの決まりから外れた選び方だったんです。
        portrait: {image: paintings/guangxu_emperor.jpg, caption: "光緒帝（宮廷画）"}
      - 聞き: うわ、疑われても仕方ない感じ。
      - 語り: この子が、光緒帝です。2人の太后は、ふたたび簾の後ろに座りました。
        figure: {type: compare, title: 3代の皇帝, people: [[咸豊帝, paintings/xianfeng_emperor.jpg, 夫・30歳で死去], [同治帝, paintings/tongzhi_emperor.jpg, 息子・18歳で死去], [光緒帝, paintings/guangxu_emperor.jpg, 甥・3歳で即位]]}
      - 聞き: 夫を見送って、息子、甥っ子。2代続けて、彼女が簾の後ろにいるんだ。
        tone: 納得
      - 語り: そして1881年4月、もう一人の太后、東太后が急に亡くなります。43歳でした。
        short: s4
        figure: null
        portrait: {image: paintings/cian_empress_dowager.jpg, caption: "東太后（慈安太后、宮廷画）"}
        card: {head: "1881年4月", body: "東太后、急死"}
      - 聞き: これも、毒殺されたって噂あるよね？
        short: s4
        tone: 疑問
      - 語り: その噂は有名です。でも、毒殺の話が書き物に出てくるのは、30年ほどたってからで、出どころのはっきりしない読み物です。
        short: s4
      - 語り: 一方、当時の皇帝の先生が書いた日記には、その日の朝に倒れ、夜に亡くなるまでの急な病の様子が書かれています。
        short: s4
        icon: book-open-text
      - 聞き: 記録には、毒の話は出てこないんだ。
        short: s4
      - 語り: 出てきません。それに、そのころは西太后自身も、長く病気で寝込んでいました。毒殺は、俗説の層です。冒頭の、皇帝の毒の話とは別で、そちらは最後のほうで掘ります。
        short: s4
      - 聞き: でも、ひとりで国を動かすことになったのは、本当なんでしょ？
        tone: 疑問
      - 語り: それは本当です。ここから彼女は、ほとんど一人で国を動かしていきます。
        portrait: null
      - 語り: ここで一つ、よく聞く話を掘っておきましょう。「西太后は、一度の食事に百品も並べさせた」。150品とも言われます。
        short: s5
        icon: bowl-food
      - 聞き: 聞いたことある！ 贅沢の極み、みたいなやつ。
        short: s5
        tone: 驚き
      - 語り: 宮廷の台所には、出した料理の記録が残っています。それを調べた研究では、1884年のある日の1回の食事に並んだのは、38品だったと紹介されています。
        short: s5
        card: {head: "台所の記録", body: "1884年のある日の食事は38品"}
      - 聞き: 38品でも、あーしには多すぎるけど……百品よりは、だいぶ少ない。
        short: s5
        tone: 笑い
      - 語り: 150という数字は、のちに彼女に仕えた女官の回想録に出てきます。控えの料理まで数えるかどうかで、数はずいぶん変わります。
        short: s5
      - 聞き: 数え方しだいで、盛ったり減らしたりできるってことか。
        short: s5
        tone: 納得
      - 語り: そうなんです。豪華だったのは確かですが、「百品」という数字だけが、ひとり歩きしているんですね。
        short: s5
      - 語り: 1884年、フランスとの戦争のさなか、彼女は、あの政変で手を組んだ恭親王たちを、まとめて政府の中心から外しました。
        card: {head: "1884年", body: "恭親王たちを政府から外す"}
      - 聞き: あの、一緒にクーデターをした仲間を！？
        tone: 驚き
      - 語り: そうです。もう誰とも力を分け合わない、という形になりました。そして、彼女が建て直させた、ある庭園が、のちに大きな火種になります。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 頤和園と消えた軍艦
    background: {image: paintings/summer_palace_general_photochrom.jpg, credit: "頤和園の昆明湖と万寿山（着色写真、1890年代）"}
    portrait: null
    year: 1886
    lines:
      - 語り: 北京の北西に、頤和園という離宮があります。円明園と同じ1860年に焼かれた、すぐ隣の庭園を、1880年代の後半に建て直したものです。
        card: {head: "1886年〜", body: "焼けた離宮の建て直し"}
      - 聞き: 頤和園って、海軍のお金で造ったって聞いたことある。
        short: s3
        tone: 疑問
      - 語り: それが、この回でいちばん有名な通説の一つです。結論から言うと、海軍のお金が回されたのは、事実です。
        short: s3
      - 聞き: え、本当なんだ。
        short: s3
        tone: 驚き
      - 語り: 工事は、海軍の役所が受け持っていました。名目は、湖で海軍の学生を訓練するため、です。
        short: s3
        icon: boat
      - 聞き: 湖で海軍の訓練って……。それ、言い訳っぽくない？
        short: s3
        tone: 疑問
      - 語り: 研究者もそう見ています。問題は、いくら回されたか。研究者の推計では、およそ700万から860万両です。
        short: s3
      - 聞き: 両って、あーしにはピンとこない。今のお金だとどれくらい？
        tone: 疑問
      - 語り: 当時の働く人の日当が、およそ0.1両。日当を今の1万円とすると、1両はざっくり10万円です。750万両なら、およそ7500億円になります。
        short: s3
        figure: {type: money, title: 頤和園へ回った海軍のお金, then: "約750万両", yen: 750000000000, basis: "日当0.1両を今の1万円とした目安（1両≒10万円）。研究者の推計は約700万〜860万両"}
      - 聞き: 7500億……。それは、さすがにひどい。
        short: s3
        tone: 驚き
      - 語り: ただ、よく言われる、もっと大きな額は、のちに改革派の梁啓超たちが言い出したもので、記録の裏づけがありません。
      - 語り: 比べてみましょう。清の国の1年の収入は、およそ8300万両。頤和園に回った額は、その1割ほどでした。
        figure: {type: bars, title: 清のお金の大きさ（万両）, bars: [[頤和園へ回った額, 750], [清の1年の収入, 8300]], labels: ["約750万両", "約8300万両（1893年）"]}
      - 聞き: 1割でも大きいけど、国が傾くほどじゃないってこと？
        tone: 疑問
      - 語り: 軍艦が増えなかった直接の理由は、別にもありました。1891年、財務の役所が「船と大砲の買い入れを2年止める」と申し出ています。
        figure: null
        card: {head: "1891年", body: "船と大砲の買い入れを2年停止"}
        background: {image: paintings/dingyuan_battleship_port.jpg, credit: "北洋艦隊の戦艦・定遠（1885年ごろ）"}
      - 語り: 北洋艦隊の主力は、ドイツで造られた戦艦、定遠です。完成したころは、アジアでも指折りの大きな軍艦でした。
      - 聞き: 最初は強かったのに、そこから増えなかったんだ。
      - 語り: 背景には、黄河の治水に1800万両あまり、光緒帝の婚礼に550万両ほど、という大きな出費がありました。
      - 聞き: 治水の1800万のほうが、ずっと大きいじゃん。
        tone: 驚き
      - 語り: そうなんです。それに研究者は、お金だけでなく、海軍全体を指揮するしくみが無かったことも、大きな弱点だったと見ています。
      - 聞き: お金だけ増やしても、勝てなかったかもってことか。
        tone: 納得
      - 語り: 1894年の5月、海軍を率いる李鴻章は、皇帝にこう書き送っています。「海軍を開いてから今まで、一隻も船を増やしていない」。
        portrait: {image: paintings/li_hongzhang_vos_1899.jpg, caption: "李鴻章（ヴォス画、1899年）"}
        card: {head: "1894年5月", body: "李鴻章「一隻も増やしていない」"}
      - 聞き: それって、いつの話？
        tone: 疑問
      - 語り: 日本との戦争が始まる、2か月前です。日本の海軍は、そのあいだに新しい速い船をそろえていました。
        portrait: null
      - 聞き: 船が増えないまま、戦争になったら……。
        tone: 重い
      - 語り: そして1894年7月、日本との戦争が始まります。
        card: {head: "1894年7月", body: "日清戦争"}
        background: {image: paintings/yalu_battle_overend_1895.jpg, credit: "W・H・オーヴァレンド《黄海海戦》"}
      - 語り: 9月の黄海の海戦で、北洋艦隊は大きな損害を受け、翌年2月、威海衛で降伏しました。
        icon: sword
      - 聞き: そのとき、西太后は何してたの？
        tone: 疑問
      - 語り: 1894年の11月は、彼女の、数えで60歳の祝いでした。戦況が悪くなったため、頤和園での大きな式典は取りやめ、紫禁城の中で規模を縮めて行っています。
        card: {head: "1894年11月", body: "数え60歳の祝い（縮小して開催）"}
      - 語り: それでも、祝いの準備には、およそ540万両がかかったとされます。
      - 聞き: 戦争中に540万両……。そこは、さすがに言い訳できないよね。
        tone: 重い
      - 語り: 批判されて当然の層です。そして1895年4月、下関で講和の条約が結ばれ、清は2億両を払うことになりました。
        card: {head: "1895年4月", body: "下関条約・賠償金2億両"}
      - 語り: このあと、日本に渡すはずだった遼東半島を返してもらう代わりのお金が加わり、合わせて2億3000万両です。
      - 聞き: 2億3000万両って……。1年の収入と比べたら、どれくらい？
        tone: 驚き
      - 語り: 3年分に近い額です。しかも、清の支払いは、これで終わりではありませんでした。
      - 聞き: 日本は、そのお金で何したの？
        tone: 疑問
      - 語り: 多くは軍備に回されました。製鉄所の建設や、お金の仕組みを金に結びつける改革の元手にもなっています。
      - 聞き: 日本の近代化の元手に、清のお金が……。なんか複雑。
      - 語り: 負けたことで、若い皇帝の周りでは、国を作り直さなければ、という声が一気に高まります。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 百日の改革
    background: {image: paintings/forbidden_city_meridian_gate_1860.jpg, credit: "フェリーチェ・ベアト《紫禁城の午門》1860年"}
    portrait: {image: paintings/guangxu_emperor.jpg, caption: "光緒帝（宮廷画）"}
    year: 1889
    lines:
      - 語り: 話を少し戻すと、1889年に、光緒帝は自分で政治を始めていました。彼女は形の上では退き、頤和園で暮らすようになります。
        card: {head: "1889年", body: "光緒帝が自ら政治を"}
      - 聞き: 形の上では、ってところが気になる。
        tone: 疑問
      - 語り: 退いたあとも、大事なことは彼女に伺いを立てていたんです。
      - 語り: その少し前、光緒帝は結婚しています。皇后に選ばれたのは、彼女の弟の娘、つまり彼女の姪でした。
      - 聞き: 皇后まで身内で固めてる……。それ、皇帝の周りを全部見張ってるってことじゃん。
        tone: 疑問
      - 語り: そう見る研究者もいます。皇帝と皇后の仲も、うまくいかなかったと伝えられています。皇帝が心を寄せたのは、別の妃、珍妃でした。
      - 語り: 1898年6月、26歳の光緒帝は、学者の康有為や、若い改革派たちの意見を取り入れて、大きな改革を始めます。
        portrait: {image: paintings/kang_youwei_1905.jpg, caption: "康有為（1905年の写真）"}
        card: {head: "1898年6月", body: "戊戌の変法が始まる"}
        icon: scroll
      - 聞き: 改革って、どんなの？
        tone: 疑問
      - 語り: 学校を作る、試験の中身を変える、役所を整理する。わずか100日ほどの間に、次々と命令が出されました。
      - 聞き: 100日で全部って、あーしなら絶対ついていけない。現場も大変そう。
        tone: 疑問
      - 語り: 実際、反発も大きかったんです。そして9月、改革派は、軍を持つ袁世凱に兵を出してほしいと頼みました。
        portrait: {image: paintings/yuan_shikai_vos_1898.jpg, caption: "袁世凱（ヴォス画）"}
        card: {head: "1898年9月18日", body: "改革派、袁世凱に兵を頼む"}
      - 聞き: 軍って……。それ、もうクーデターの相談じゃん。
        tone: 驚き
      - 語り: ところが袁世凱は、この計画を、彼女の側の大臣に知らせた、と言われています。
      - 語り: そして1898年9月21日、彼女はふたたび政治の表に戻ります。
        card: {head: "1898年9月21日", body: "戊戌の政変"}
        tone: 重い
      - 語り: ただ、その知らせは、この政変そのものには間に合わず、そのあと改革派の逮捕を広げるきっかけになった、と見る研究が多いです。いつ知らせたのかは、今も議論があります。
      - 聞き: 裏切ったのか、もう遅かったのか、ってこと？
        tone: 疑問
      - 語り: そうです。どちらにしても、改革派の計画は、ここで終わりました。
      - 語り: 光緒帝は、宮殿の中の湖に浮かぶ小さな島の建物に、閉じこめられます。
        portrait: {image: paintings/guangxu_emperor.jpg, caption: "光緒帝（宮廷画）"}
        icon: lock
      - 聞き: 甥っ子で、皇帝なのに……。
        tone: 重い
      - 語り: 皇帝はそれから10年、主にこの島で暮らすことになります。冬には湖が凍り、島から歩いて出られないよう、氷まで割らせたという話も伝わっています。
        tone: しみじみ
      - 聞き: それ、牢屋と変わらないじゃん。
        tone: 重い
      - 語り: 康有為は海外へ逃げました。でも、逃げきれなかった6人の改革派は、裁判もないまま、9月28日に処刑されています。
        card: {head: "1898年9月28日", body: "6人の改革派を裁判なしで処刑"}
        tone: 重い
      - 語り: その一人、譚嗣同は、逃げるよう勧められても動かず、「改革には、血を流す者が要る。自分がその最初になろう」と語った、と伝えられています。
        tone: しみじみ
      - 聞き: 逃げられたのに、残ったんだ……。でも、裁判なしで処刑って、そこは悪女って言われても仕方ないかも。
        tone: 重い
      - 語り: ここは、記録に残る彼女の厳しい面です。地層を分けるなら、これははっきり「記録」の層にあります。
      - 聞き: 悪いことは悪いって、ちゃんと掘るんだね。
        tone: 納得
      - 語り: それが、この番組のやり方です。そして、この2年後。清は、世界の国々を相手に戦うことになります。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 1900年の賭け
    background: {image: paintings/boxer_fall_of_peking_1900.jpg, credit: "葛西虎次郎《北京攻撃》1900年"}
    portrait: null
    year: 1900
    lines:
      - 語り: 1900年の1月、彼女は、光緒帝の代わりになる跡継ぎを立てました。皇帝を位から下ろす準備だと見られ、外国の公使たちが反対します。
        card: {head: "1900年1月", body: "跡継ぎを立てる（廃位の下準備）"}
      - 聞き: 外国が、皇帝の交代に口を出すの？
        tone: 疑問
      - 語り: この反対が、彼女の外国への反感を強めた、とも言われています。
      - 語り: そのころ、中国の北のほうでは、「義和団」と呼ばれる集団が広がっていました。外国人やキリスト教徒を襲い、6月には北京にまで入ってきます。
        card: {head: "1900年6月", body: "義和団が北京へ"}
        icon: users-three
      - 聞き: 国としては、止めなきゃいけない相手じゃないの？
        tone: 疑問
      - 語り: 宮廷の中でも、止めるべきか、使うべきか、意見が割れました。
      - 聞き: 止めるか使うか……。あーしなら、止める一択だけど。
        tone: 疑問
      - 語り: 6月17日、列強の艦隊が、天津の近くの砲台を攻め落とします。そして6月21日、清は、列強に対して戦いを宣言しました。
        short: s8
        card: {head: "1900年6月21日", body: "列強への宣戦の上諭"}
        tone: 重い
      - 語り: その命令は、皇帝の名前で出されていますが、決めたのは彼女でした。言葉は、記録に残っています。
        short: s8
      - 人物: 「ぐずぐずと生き延びて、永遠の恥をさらすより、大いに討って、勝ち負けを決めよう」
        short: s8
        who: 上諭
        tone: 強調
      - 聞き: 世界中を相手に……！？ それ、勝てるわけないじゃん。
        short: s8
        tone: 驚き
      - 語り: 北京では、外国の公使館が、義和団と清の兵に取り囲まれました。囲みは、55日にわたって続きます。
        card: {head: "1900年6月〜8月", body: "公使館の籠城・55日"}
        background: {image: paintings/boxer_legation_ruins_1900.jpg, credit: "籠城後の北京・公使館付近（1900年ごろ）"}
      - 聞き: 55日も？ 外国の軍隊、すぐには助けに来られなかったの？
        tone: 疑問
      - 語り: 8月14日、8か国の連合軍が北京に入り、公使館を救い出します。その翌朝早く、彼女は農家の女性の服に着替え、光緒帝を連れて、北京から逃げ出しました。
        short: s7
        card: {head: "1900年8月15日", body: "北京を脱出"}
        icon: footprints
      - 聞き: 皇帝と皇太后が、農家の服で……。想像つかない。
        short: s7
      - 語り: その同じ日、光緒帝が愛した妃、珍妃が、宮殿の井戸で亡くなっています。
        short: s7
        tone: 重い
      - 聞き: それ、西太后が井戸に落とさせたって話でしょ？
        short: s7
        tone: 疑問
      - 語り: 当時そばにいた宦官が、彼女の命令だったと証言しています。ただ、その証言が出たのは、30年ほどたってからです。
        short: s7
      - 語り: 命令はあったと見る研究者が多い一方で、劇のような台詞つきの話の一部は、のちに偽物と分かった日記から来ています。
        short: s7
      - 聞き: 起きたことは本当っぽいけど、細かい場面は盛られてるかも、ってことか。
        short: s7
        tone: 納得
      - 語り: 一行は、2か月あまりかけて、西の古い都、西安にたどり着きました。
        figure: {type: map, title: 北京から西安へ（1900年）, places: [[北京, 116.40, 39.90], [西安, 108.94, 34.34]], route: [北京, 西安], bounds: [104.5, 121.5, 32.0, 42.5], note: 2か月あまり}
        card: {head: "1900年10月", body: "西安に着く"}
      - 聞き: 都から、そんなに遠くまで逃げたんだ。
      - 語り: 戦いの終わりに結ばれた約束で、清が払う賠償金は、4億5000万両。39年かけて、利息をつけて払う約束でした。
        short: s8
        figure: {type: bars, title: 清のお金の大きさ（万両）, bars: [[頤和園へ回った額, 750], [清の1年の収入, 8300], [下関条約の賠償, 23000], [北京議定書の賠償, 45000]], labels: ["約750万両", "約8300万両（1893年）", "2億3000万両", "4億5000万両"]}
        card: {head: "1901年9月", body: "北京議定書・賠償金4億5000万両"}
      - 聞き: 頤和園の庭が、いくつ造れるんだろ……。
      - 語り: 60個分です。
      - 語り: 利息まで入れると、およそ9億8000万両。清の1年の収入、8300万両で比べると、12年分ほどにもなります。
        short: s8
      - 聞き: 清を弱らせた決断って、この宣戦のことか……。
        short: s8
        tone: 重い
      - 語り: そう見てよいと思います。頤和園よりも、ずっと重い決断でした。
        figure: null
      - 語り: このとき、講和を担う大臣たちへの命令の中に、こんな一節があります。
      - 人物: 「中国の力の及ぶ限りを量って、相手の国々の納得を得よ」
        who: 上諭
      - 語り: この言葉は長いあいだ、「国の財を使い尽くしてでも、外国のご機嫌を取れ」という意味で引かれてきました。
      - 聞き: ひどっ。……でも、さっき読んだ言葉だと、ちょっと違う気がする。
        tone: 疑問
      - 語り: 前後を読むと、「払える力を見積もったうえで、相手の納得を得よ」という意味だ、と読む研究者もいます。一部を切り取ると、意味が反対に聞こえる例ですね。
      - 聞き: 切り取りで炎上……。今もよくあるやつだ。
        tone: 納得
      - 語り: そして西安で、もう一つの命令が出されています。
      - 人物: 「外国の長所を取り入れてこそ、中国の短所を補うことができる」
        who: 上諭
      - 聞き: え、さっきまで外国と戦ってたのに？
        tone: 驚き
      - 語り: 1901年1月の命令です。ここから、清の最後の大きな改革が始まります。
        card: {head: "1901年1月", body: "西安で改革の命令"}
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 最後の改革と二つの死
    background: {image: paintings/peking_street_1900.jpg, credit: "北京の街並み（1900年ごろ）"}
    portrait: {image: paintings/cixi_1903_xunling_throne.jpg, caption: "西太后（勲齢撮影、1903〜05年ごろ）"}
    year: 1902
    lines:
      - 語り: 1902年の1月、一行は列車で北京に戻ってきました。
        card: {head: "1902年1月", body: "列車で北京へ帰る"}
      - 聞き: 列車で帰るんだ。逃げたときは、農家の服だったのに。
      - 語り: 戻った彼女は、各国の公使の夫人たちを宮殿に招き、何度も会っています。最初に招かれた一人が、アメリカの公使の夫人、サラ・コンガーでした。彼女は、公使館の籠城の中にいた人です。
      - 聞き: 2年前に囲まれてた人を、お茶に招くの！？
        tone: 驚き
      - 語り: 外国とうまくやっていく姿を見せることも、戻ってきた彼女の大事な仕事だったんです。写真も、このころからたくさん撮らせました。
        portrait: {image: paintings/cixi_1903_guanyin.jpg, caption: "観音に扮した西太后（勲齢撮影、1903年ごろ）"}
        icon: camera
      - 語り: これは、観音に扮した写真です。そばには、長く仕えた宦官の李蓮英も写っています。
      - 聞き: 写真、めっちゃ撮ってる。今でいう、イメージ戦略かも。
      - 語り: アメリカの画家に、肖像画も描かせています。その絵は、1904年のセントルイス万博に出されました。
        figure: {type: compare, title: 西太后の2つの姿, people: [[写真, paintings/cixi_xunling_seated_close.jpg, 勲齢撮影・1903〜05年ごろ], [油彩, paintings/cixi_carl_portrait.jpg, カール画・1903〜04年ごろ]]}
      - 聞き: 万博に、自分の肖像画……。世界に見せたかったんだ。
      - 語り: そのころ彼女に仕えた女官、徳齢が、のちに回想録を書いています。少し大げさな所もある本ですが、そこに、こんな言葉が残っています。
        figure: null
      - 人物: 「わたしは、これまでに生きた女の中で、一番賢いのではないかと、よく思うのです」
        who: 西太后
      - 聞き: え、自分で言っちゃう！？ あーし、次は「ヴィクトリア女王より上」とか言いそうな気がする。
        tone: 驚き
      - 語り: 当たりです。イギリスのヴィクトリア女王の伝記を読んで、自分の人生のほうがずっと面白い、と話した、とも書かれています。
      - 語り: そして義和団のことは、「わたしの人生で、ただ一つの過ちだった」と語った、とあります。
        tone: しみじみ
      - 聞き: 本人も、あの宣戦は間違いだったって思ってたんだ。
        tone: しみじみ
      - 語り: 回想録の言葉なので、そのまま本人の言葉とは言いきれません。ただ、彼女が自分をどう見せたかったのかは、伝わってきます。
      - 語り: 改革も、本当に進みました。1905年、1300年続いた官僚の試験、科挙をやめます。
        card: {head: "1905年9月", body: "科挙を廃止"}
      - 聞き: 科挙って、最初に出てきた、1300年続いた試験だ。
      - 語り: 1906年には、憲法による政治の準備を宣言し、1908年には、9年後に議会を開くという予定表まで出しました。
        card: {head: "1908年8月", body: "憲法大綱・9年後に議会"}
      - 聞き: 憲法に議会って……。最初に聞いた悪女のイメージと、全然ちがう。
        tone: 驚き
      - 語り: ただ、これらの改革は、地方の有力な役人たちが先に進めていたものだ、という見方もあります。追い詰められて渋々認めた、と見る研究者も少なくありません。
      - 聞き: 誰の手柄かは、まだ割れてるってことね。
        tone: 納得
      - 語り: そして1908年11月14日。閉じこめられていた光緒帝が亡くなります。37歳でした。
        short: s6
        portrait: {image: paintings/guangxu_emperor.jpg, caption: "光緒帝（宮廷画）"}
        card: {head: "1908年11月14日", body: "光緒帝、37歳で死去"}
        tone: 重い
      - 語り: その翌日、11月15日。今度は、西太后が亡くなりました。72歳でした。
        short: s6
        portrait: {image: paintings/cixi_1903_xunling_throne.jpg, caption: "西太后（勲齢撮影、1903〜05年ごろ）"}
        card: {head: "1908年11月15日", body: "西太后、72歳で死去"}
      - 聞き: 1日ちがい！？ それ、偶然なの？
        short: s6
        tone: 驚き
      - 語り: 2008年の調べで、光緒帝の髪から、ふつうの2000倍ほどの砒素が見つかりました。髪と、いちばん内側の衣服に残っていた分だけで、命を落とす量を超えていたと発表されています。
        short: s6
        card: {head: "2008年の調査", body: "光緒帝から大量の砒素"}
      - 聞き: 毒殺だったんだ……。じゃあ、やっぱり西太后が？
        short: s6
        tone: 疑問
      - 語り: 砒素で亡くなったことまでは、調べで示されました。でも、誰が飲ませたのかは、分かっていません。彼女の命令と見る人は多いですが、それは推定の層です。
        short: s6
      - 聞き: 記録と推定を、ここでも分けるんだね。
        short: s6
        tone: 納得
      - 語り: 1900年に立てた跡継ぎは、義和団のあとで外されていました。亡くなる直前に選ばれたのは、2歳の溥儀。のちに「ラストエンペラー」と呼ばれる人です。
      - 語り: 亡くなった翌年の11月、葬列には1万人ほどが加わり、棺は120キロ離れた陵墓まで、5日かけて運ばれたといいます。
        card: {head: "1909年11月", body: "葬列・およそ1万人"}
        background: {image: paintings/cixi_funeral_1908_morrison.jpg, credit: "G・E・モリソン撮影《西太后の葬列》"}
      - 聞き: 最後まで、すごい規模。
      - 語り: そして1912年2月、清は、終わりを迎えます。彼女が亡くなってから、3年あまりのことでした。
        card: {head: "1912年2月", body: "清の滅亡"}
      - 語り: その陵墓も、1928年、軍閥の兵士たちに荒らされ、副葬品が奪われています。
        card: {head: "1928年", body: "陵墓が荒らされる"}
        tone: 重い
      - 聞き: 亡くなってからも、静かにさせてもらえなかったんだ……。でも、なんで、ここまで悪く言われるようになったんだろう。
        tone: しみじみ
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：悪女の物語はどこから来たのか
    background: {image: paintings/forbidden_city_qianqing_hall.jpg, credit: "紫禁城・乾清宮の玉座（1914年刊の図版）"}
    portrait: {image: paintings/cixi_xunling_seated_close.jpg, caption: "西太后（勲齢撮影、1903〜05年ごろ）", age: false}
    year: 1908
    lines:
      - 語り: さて、いちばん底の層です。なぜ西太后は、ここまでの悪女になったのか。
        tone: 強調
      - 聞き: やっと、そこを掘るんだ。
      - 語り: 一つ目は、海外へ逃げた改革派の宣伝です。康有為たちは、外国で「光緒帝を守る会」を作り、「賢い皇帝と、それを邪魔する頑固な皇太后」という物語を広めました。
        card: {head: "理由①", body: "逃げた改革派の宣伝"}
      - 語り: 皇帝からひそかに渡されたという手紙も、宛先を自分に書き換えて発表した、と指摘されています。
        icon: newspaper
      - 聞き: 自分たちが正しかったって言うために、相手をとことん悪く描いたってこと？
        tone: 疑問
      - 語り: そういう面があった、と研究者は見ています。本当の手紙は、別の改革派に宛てたもので、言葉も、もっと控えめなものだったようです。
      - 聞き: 自分たちに都合よく、ってことね。
      - 語り: 二つ目は、イギリス人が書いた本です。1910年に出た西太后の伝記は、長いあいだ西洋で、いちばん基本の本として読まれてきました。
        card: {head: "理由②", body: "偽の日記を使った伝記"}
      - 語り: ところが、その本の大事な場面に使われた宮廷の日記は、作者の一人、バックハウスが作った偽物だと、のちに分かりました。
      - 聞き: 偽物の日記……！？ それ、もう小説じゃん。
        tone: 驚き
      - 語り: 三つ目は、清を倒した側の宣伝です。「国を外国にくれてやっても、国の中の漢人には渡さない」。西太后の言葉として有名な一言があります。
        card: {head: "理由③", body: "清を倒した側の宣伝"}
      - 語り: 清の皇帝の一族は満洲人で、国の大多数は漢人でした。その漢人に渡すくらいなら外国に、という意味です。
      - 語り: でも、この言葉を最初に書いた梁啓超の本では、別の大臣の言葉になっています。それが、清を倒そうとした人たちの宣伝の中で、いつの間にか彼女の言葉にされていったんです。
      - 聞き: マリー・アントワネットの「パンがなければ」と、同じパターンだ。
        tone: 納得
      - 語り: その通りです。そして四つ目が、日本で大きかった、映画です。冒頭のむごい場面は、別の時代の話が混ざったものだと見られています。
        card: {head: "理由④", body: "映画が残した強い場面"}
        icon: film-strip
      - 聞き: 剣崎さん、ここまで来ると、悪女の物語って、何人もで積み上げた地層みたい。
      - 語り: いい言い方ですね、つむぎさん。そして五つ目。女性が国を動かしたこと、それ自体です。
        card: {head: "理由⑤", body: "女性が国を動かしたこと"}
      - 語り: 彼女の遺言として、「今後、女に国の政治をさせてはならない」という言葉がよく紹介されます。でも、これは正式な遺言には書かれていません。
      - 聞き: え、それも作られた言葉なの？
        tone: 驚き
      - 語り: 確かめられるいちばん古い出どころは、さっきの、偽の日記を使った1910年の本です。
      - 語り: そういう言葉が彼女の口から出たことにされて広まったこと自体が、女性の権力者がどう見られてきたかを、表しているのかもしれません。
        tone: しみじみ
      - 聞き: 「三大悪女」って、3人とも女の人なのも、そういうことか……。
      - 語り: ただ、ここで逆の方向に行きすぎるのも、また危ないんです。
      - 聞き: 逆って、本当はいい人だった、ってこと？
        tone: 疑問
      - 語り: 近年は、彼女を「近代中国を作った人」と高く評価する本も出ています。でも、それに対しては、都合のいい証拠だけを集めている、という批判も多いんです。
      - 聞き: 持ち上げすぎも、盛りすぎと同じってこと？
        tone: 疑問
      - 語り: 裁判なしの処刑、甥の皇帝を閉じこめたこと、そして世界を相手に戦った1900年の決断。これは、記録の層にはっきり残っています。
        tone: 重い
      - 聞き: じゃあ、清を滅ぼしたわけじゃない。でも、1900年の決断で、清を大きく弱らせた。悪女でも聖女でもなくて、追い詰められた国で、半世紀近くも舵を握り続けた人、なのかも。
        tone: しみじみ
      - 語り: 僕も、そう思います。
        tone: しみじみ
      - 聞き: 地表の下、今日もちゃんと掘れた気がする！
        tone: 明るい
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、三大悪女のもう一人、中国でただ一人の女帝、武則天。「わが子まで手にかけた悪女」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

