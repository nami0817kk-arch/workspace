# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  参勤交代を命じた法令の、同じ条文に、こう書かれています。お供の人数が、近ごろ、甚だ多い。これからは、減らしなさい、と。
  寛永12年、1635年の武家諸法度です。
  それなのに、行列は、加賀藩だけでも、記録によって4千人から2千人足らずまで食い違い、費用の割合も、研究者によって5パーセントから78パーセントまで開きます。
  幕府は、なぜ、大名に、毎年の江戸往復を命じたのか。
  この動画でわかること
  ・参勤の条文に「従者を減らせ」と書かれていたこと、その前の元和令の「参覲」が京都での作法だったこと
  ・加賀藩の464キロ・12泊13日と、薩摩藩の47泊48日。行列の人数が記録ごとに合わない理由
  ・大井川の川留め、本陣と宿場、宿代の値切り交渉など、道中の具体的な記録
  ・江戸での支出の割合と、参勤の費用の割合。数え方で数が変わる話
  ・通説の「大名の力を削る」と、近年の「服属儀礼・軍役」。文久2年の緩和から、赤門と大手町まで
description_note: |-
  条文は、石井良助校訂『御当家令条』の翻刻と、『徳川禁令考』の翻刻（いずれも民間サイトが掲載）で読みました。影印や国立公文書館の本文は確認できていません。翻刻の字に、毎年・毎歳夏などの違いがあります。
  行列の人数・費用・日数の多くは、事典（コトバンク転載）、nippon.com の連載（小林明さん）、和樂web、自治体・博物館・山口県文書館の公開資料によります。一次史料そのものではなく、記事や事典が引いた数字が多く、年や数え方が出どころごとに違います。円への換算はしていません。
  絵は、浮世絵などのパブリックドメインの作品（ウィキメディア・コモンズ）です。風景の画像は画像生成AIで作った想像上のイメージで、実在の写真ではありません。

en:
  title: "Sankin-kotai: Why Make Lords Travel to Edo Every Year? The Law Said: Cut the Retinue"
  description: |-
    The law that ordered the alternate-attendance system in 1635 contains, in the very same article, an order to reduce the number of attendants.
    Yet the processions of a single domain, Kaga, are recorded anywhere from about 4,000 people to fewer than 2,000.
    Why did the shogunate make the daimyo travel to Edo and back every year?
    In this video you will learn:
    - The 1635 article that orders the journey and also says "reduce the retinue", and how an earlier 1615 clause on attendance was about Kyoto
    - Kaga's 464 km and 12 nights on the road versus Satsuma's 47 nights, and why the headcounts do not agree
    - What happened on the road: the Oi River flood closures, inns, and a bargaining session over lodging fees
    - What the system cost, and why the share of spending in Edo and the share spent on the journey differ so much
    - The old explanation of weakening the lords versus a newer view of ritual loyalty and military service, and what remains of the system today
    Some figures come from encyclopedias and articles that quote older records; sources and gaps are listed in the Japanese description. Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Article That Said: Reduce the Retinue, 1635"
    - "Why Did Attendance Become an Edo System? 1615-1642"
    - "How Many People, How Many Days? Kaga to Satsuma"
    - "What Happened on the Road? Oi River and the Inns"
    - "What Did It Cost? Kaga, Okayama, and the Edo Mansions"
    - "So Why Did the Shogunate Order It?"
    - "How Did It End, and What Remains? 1862 to Akamon"
    - "Summary: Why Make Them Travel?"

