# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と shimabara-story.yaml の型）。参勤交代（制度の回）。2026-10-31 下書き。
# 公開の予定は 11/04 19:00（日本史枠）。題材は人物ではなく制度。通史にしない。
# 型：1本に1つの「なぜ」＝「なぜ幕府は、大名に毎年の江戸往復を命じたのか。しかも、制度を定めた条文そのものが『お供を減らせ』と書いているのに」。
#   語り手は剣崎1人（つむぎは出ない）。冒頭（10秒以内）＝参勤を命じた寛永12年の武家諸法度の同じ条文に「従者の員数、近来甚だ多し…減少すべし」とある（sankin-01）。
#   導入では答えを言わず、最後の章で「一つには決められない。確かなのは…」と答える。創作の物語・想像の台詞は作らない（imagined なし）。
#   第1章 参勤は、いつ、何から始まったのか（元和令の「参覲」は京都の作法・寛永6年に削除・家康の奨励と人質・1635年・1642年・定府・対馬・松前）
#   第2章 行列は、何人で、何日歩いたのか（加賀464km・薩摩47泊48日・加賀の人数の食い違い・仙台・徳山・享保6年の目安・渡り者）
#   第3章 道中では、何が起きたのか（大井川の川留め・川札・宿場の人馬と助郷・二川宿・郡山宿・矢掛宿の宿代・徳山藩の道中日記）
#   第4章 いくらかかったのか（加賀の文化5年・岡山藩の道中経費・江戸での支出の割合と「5〜10%」の食い違い・江戸屋敷・勤番侍）
#   第5章 では、なぜ幕府は命じたのか（通説・服属儀礼と軍役・上米と在府半年・条文の「減らせ」・文化の交流）
#   第6章 どう終わり、何が残ったのか（文久2年の緩和・在府の書き方の食い違い・元治の復旧令・終わりの年の食い違い・赤門・大手町・武家地と人口）
#   まとめ（なぜ→一つには決められない。確かなこと3つ。「減らせ」に戻る）。締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを並べたのは7か所：①加賀の行列の人数（4000/2500/2000〜3000/1969/473）②川留めの最長28日の年（慶応4年／明治1年）③譜代の交代の月（6月/8月/2月）
#   ④江戸での支出の割合（43〜78％）と参勤の費用の割合（5〜10％）⑤文久2年の在府（三ヵ月／百日／1年）⑥復旧と終わりの年（1864/1865/1867）⑦江戸の武家地（70％/60％）⑧江戸の人口（67万人／統計が無い）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml、sankin-01〜64）にあるものだけ。行の上に `# fact: sankin-NN`。
#   出どころの多くは、事典（コトバンク転載）・nippon.com の連載（小林明）・和樂web・自治体の公開ページ・山口県文書館の紀要。J-STAGE・大学・自治体の PDF の多くは本文を開けなかった。
#   条文は石井良助校訂『御当家令条』（近世法制史料叢書、創文社、1959）の翻刻（民間サイト sybrma が掲載）と、『徳川禁令考』の翻刻（EE-Arts）の2つで読んだ。影印・国立公文書館の本文は未見（概要欄に書く）。
#   確かめられなかったこと：山本博文・藤井讓治・大石学の本文（説の出どころ）・『徳川実紀』の家光の発言・享保6年の触れの原文（細川忠利の1634年の提案は nippon.com の記述だけ）・南部重直の遅参・Vaporis の本文・各藩の借金額。台本では使わない。
#   円への換算はしない（出どころごとに1両の換算率が違う）。「両」「文」のまま言う。
#   「とされる」「といわれる」は、出どころが1つの事実と、出どころ自身が「と言われる」と書く事実にだけ使う（1本10回まで）。
