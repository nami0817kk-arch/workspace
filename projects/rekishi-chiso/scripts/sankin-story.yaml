sections:
  # ================================================================ 序章（冒頭 約3分）。答えは最後の章まで言わない
  - title: 「お供を減らせ」と書かれた条文　1635年
    background: {image: paintings/sankin_kasumigaseki_hiroshige2_1863.jpg, credit: "江戸霞ヶ関の大名行列（二代歌川広重、1863年。LACMA 所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1635
    lines:
      # fact: sankin-01
      - 語り: 参勤交代を命じた法令の、まさに同じ条文に、こう書かれています。お供の人数が、近ごろ、甚だ多い。これからは、《減らしなさい》、と。
        tone: 強調
        card: {head: "寛永12年（1635年）6月21日", body: 参勤を命じた条文に「お供を減らせ」}
      # fact: sankin-01, sankin-06
      - 語り: 石井良助さんが校訂した、『御当家令条』の翻刻では、毎年4月中、参勤致すべし、とあります。
      # fact: sankin-01, sankin-06
      - 語り: その続きが、こうです。「従者の員数、近来、甚だ多し。かつは国郡の費え、かつは人民の労なり。向後、その相応をもって、これを減少すべし」。
      # fact: sankin-01
      - 語り: 今の言葉にすると、供の人数が、近ごろ、とても多い。国や郡の費用で、人々の苦労でもある。これからは、身分に応じて、《減らす》ように。
        tone: 重い
      # fact: sankin-15
      - 語り: では、実際の行列は、どれほどだったのか。102万石の大藩、加賀藩の行列は、事典によって、4千人、2千5百人余。
        figure: {type: stats, title: 加賀藩の行列の人数　出どころごとの違い, items: [[日本大百科全書, 4千人, 加賀前田氏の4千人を筆頭に], [世界大百科事典, 2千5百人余, 多いときで], [文政10年（1827年）の記録, 1969人, うち臨時の雇い686人]], upto: 3}
      # fact: sankin-15
      - 語り: 石川県立歴史博物館は、通常2千人から3千人。そして、文政10年の記録は、1969人です。
      # fact: sankin-14
      - 語り: しかも、その1969人のうち、686人は、藩士ではない、臨時の雇いでした。つまり、およそ3人に1人は、この旅のために雇われた人足です。
        figure: null
      # fact: sankin-16, sankin-21
      - 語り: 金沢から江戸まで、およそ464キロ。ふだんは、12泊13日。川が増水した年は、18泊19日かかったといいます。
        card: {head: "12泊13日と47泊48日", body: 加賀藩と薩摩藩}
      # fact: sankin-16, sankin-21
      - 語り: 一方、薩摩藩の島津斉彬は、嘉永5年に、47泊48日かけて江戸に着いた、と nippon.com は書きます。
      # fact: sankin-17
      - 語り: そして、お金です。藩の1年の経費のうち、江戸で使った分が、加賀藩で61パーセント、秋田藩で73パーセント、越後の長岡藩では78パーセントに上る、という数字があります。
        card: {head: "江戸での支出", body: 藩の経費の4割強〜8割近く}
      # fact: sankin-18
      - 語り: ところが、別の研究者は、参勤交代に要した費用は、藩の年間経費の、5パーセントから10パーセントだった、と書きます。何を数えるかで、これほど数が違うのは、なぜなのか。
      - 語り: 幕府は、なぜ、大名に、毎年の往復を命じたのか。お供を減らせ、と書きながら。
        tone: 疑問
      - 語り: 答えを探して、まず、この制度が、いつ、何から始まったのかを、見ていきます。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 なぜ、江戸の制度になったのか
  - title: 「参勤」は、いつ、何から始まったのか　1615年から1642年
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "東海道五拾三次 日本橋（歌川広重、1833年ごろ。大英博物館所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1615
    lines:
      # fact: sankin-07
      - 語り: 「参勤」という言葉は、もともと、江戸の話ではなかったのです。1615年、元和元年の武家諸法度。大名に出された、幕府の決まりです。その第9条に、「諸大名、参覲の作法の事」があります。
        year: 1615
        card: {head: "1615年（元和元年）", body: 「参覲」は京都での作法}
      # fact: sankin-07
      - 語り: 世界大百科事典によれば、これは、京都の二条城や伏見城で、徳川氏に会うときの作法を定めたものです。江戸に住め、という話ではありません。
      # fact: sankin-07, sankin-54
      - 語り: 1629年、寛永6年。2代将軍秀忠の手で、この条は削られました。ウィキソースの寛永6年の法度の本文には、参勤の条も、お供の人数の条も、ありません。
        year: 1629
        card: {head: "1629年（寛永6年）", body: 参勤の条は削られた}
      # fact: sankin-09
      - 語り: では、江戸への参勤は、いつからか。事典には、徳川家康が、関ヶ原のころに徳川に従った、外様大名の江戸参勤と、妻子の江戸居住をすすめた、とあります。参勤した大名には、屋敷の土地を与えた、と。
      # fact: sankin-09
      - 語り: 慶長7年、1602年。前田利長が、母を人質として江戸へ送ったのが、いちばん早い例、と、ブリタニカ国際大百科事典は書いています。参勤は、人質の制度と、重なって始まりました。
        year: 1602
        tone: 重い
      # fact: sankin-06, sankin-07
      - 語り: そして、1635年、寛永12年。冒頭の条文が出ます。大名は、毎年4月に参勤せよ。江戸への参勤を、制度として書いたのは、この年が最初だと、世界大百科事典は書いています。
        year: 1635
        figure: {type: stats, title: 武家諸法度の参勤の条　3つの年, items: [[元和令, 1615年, 「参覲の作法」京都で将軍に会う作法], [寛永6年令, 1629年, 参勤の条は削られた], [寛永12年令, 1635年, 毎年4月に参勤、供は減らせと続く]], upto: 3}
      # fact: sankin-08
      - 語り: 1642年、寛永19年には、譜代大名、つまり、古くからの徳川の家臣だった大名にも、広がりました。ただ、交代の月は、辞典で書き方が違います。
        year: 1642
        figure: null
        card: {head: "1642年（寛永19年）", body: 譜代大名にも広がる}
      # fact: sankin-08
      - 語り: 外様は4月、譜代は6月、または8月。関東の譜代は半年交代で、世界大百科事典は、2月と8月、と書きます。
      # fact: sankin-10
      - 語り: 全員が、毎年往復したわけでもありません。水戸徳川家と、老中など役付きの大名は、江戸に住み続ける、定府で、参勤の義務がなかったのです。
      # fact: sankin-22
      - 語り: 対馬の宗氏は、三年に一度の在府、4か月ほど。松前氏は、五年に一度、と、事典にあります。同じ参勤交代でも、大名ごとに、中身が違いました。
      - 語り: 人質から始まった旅が、毎年の義務になった。その旅は、大名ごとに、まったく違うものでした。
        tone: 疑問
        hook: true
      - 語り: 加賀藩と薩摩藩の旅を、日数と人数で、比べてみます。
        hook: true

  # ================================================================ 第2章 何人で、何日歩いたのか
  - title: 行列は、何人で、何日歩いたのか　加賀から薩摩まで
    background: {image: paintings/sankin_satta_sadahide_1862.jpg, credit: "東海道中 薩埵峠の大名行列（歌川貞秀、1862年。メトロポリタン美術館所蔵、ウィキメディア・コモンズ、CC0）"}
    year: 1808
    lines:
      # fact: sankin-16
      - 語り: まず、道のりです。加賀藩の金沢から江戸まで、主なルートで、464.1キロ。通常、12泊13日でした。
      # fact: sankin-16
      - 語り: ただ、金沢から追分までのあいだには、幅5メートル以上の川が、73本あり、そのうち30本には、橋はなかったのです。川留めで、3つの川が使えなかった年は、18泊19日かかったとされます。
        card: {head: "加賀藩の旅", body: 川留めの年は18泊19日}
      # fact: sankin-21
      - 語り: 仙台藩は、92里、およそ359キロで、8日から9日。薩摩藩は、440里、およそ1716キロで、40日から60日です。
        figure: {type: stats, title: 江戸までの旅　藩ごとの違い, items: [[仙台藩（約359キロ）, 8〜9日, 92里], [加賀藩（約464キロ）, 12〜15日, 川留めの年は18泊19日], [薩摩藩（約1,716キロ）, 40〜60日, 嘉永5年は47泊48日]], upto: 3}
      # fact: sankin-21, sankin-60, sankin-37
      - 語り: 薩摩の島津斉彬は、嘉永5年の8月23日に出て、10月9日に江戸へ着きました。
        figure: null
      # fact: sankin-21, sankin-60, sankin-37
      - 語り: 盛岡藩は、139里、約550キロで、およそ2週間。もりおか歴史文化館が、企画展で紹介しています。松江藩は、約30日の旅でした。
      # fact: sankin-15
      - 語り: では、人数です。冒頭の加賀藩に、戻ります。事典は、4千人、2千5百人余。石川県立歴史博物館は、通常2千人から3千人。文政10年の記録は、1969人。行列を描いた屏風の人物は、473人です。
      # fact: sankin-15
      - 語り: 4千人は、「加賀前田氏の4千人を筆頭に」という書き方。2千5百人は、「多いときで」という書き方です。
      # fact: sankin-20
      - 語り: ほかの藩です。仙台藩は、天保13年、1842年に、総勢1577人に及んだといわれます。長州藩の毛利敬親は、1千人といわれます。
      # fact: sankin-33
      - 語り: 毛利家の分家、徳山藩の享保16年、1731年の道中日記には、総勢373人とあります。
        figure: {type: stats, title: 行列の人数　藩ごとの違い, items: [[加賀藩（文政10年・1827年）, 1969人, うち臨時の雇い686人], [仙台藩（天保13年・1842年）, 1577人, 「及んだといわれ」], [徳山藩（享保16年・1731年）, 373人, 諸士中105＋小者268]], upto: 3}
      # fact: sankin-33
      - 語り: 内訳は、諸士中が105人、足軽以下の小者が268人。山口県文書館の2025年の紀要が、紹介しています。
      # fact: sankin-19
      - 語り: 幕府も、人数の目安を出していました。nippon.com の連載によれば、享保6年、1721年。1万石なら、騎馬が3、4、足軽が20、中間・人足が30。10万石なら、騎馬が10、足軽が80、中間・人足が140から150です。
        figure: null
        card: {head: "享保6年（1721年）の目安", body: 10万石で足軽・人足など230〜240人}
      # fact: sankin-62
      - 語り: もう一つ。江戸に入る前には、人数を増やしました。「渡り者」と呼ばれる、臨時の雇いです。品川宿など、江戸の入り口にいた人たちを雇い、最低限の衣装を着せて、作法を教えたといわれます。
      - 語り: 行列は、何百人も、何千人も、動きました。その行く手に、川が、待っていました。
        tone: 疑問
        hook: true
      - 語り: 東海道の、大井川です。
        hook: true

  # ================================================================ 第3章 道中では、何が起きたのか
  - title: 道中では、何が起きたのか　大井川の川留めと宿場
    background: {image: paintings/sankin_oi_river_kuniteru2_1865.jpg, credit: "東海道 大井川 行列之図（二代歌川国輝、1865年。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1865
    lines:
      # fact: sankin-26
      - 語り: 大井川には、橋がなかった。水深が、4尺5寸、約136センチを超えると、川留め。幕府の御状箱のほかは、渡れなくなりました。島田市の論文集が、そう書いています。
        card: {head: "大井川", body: 水深4尺5寸（約136cm）で川留め}
      # fact: sankin-26
      - 語り: 渡るには、川札が要ります。いちばん浅いときでも、1枚48文。肩車は川札2枚、連台は6枚です。
        figure: {type: stats, title: 大井川の川越し　川札の枚数, items: [[水が浅いとき, 川札1枚, 48文], [肩車, 川札2枚, 人足が肩に乗せる], [連台, 川札6枚, 台に乗せて運ぶ]], upto: 3}
      # fact: sankin-27
      - 語り: 10万石クラスの行列が、大井川を渡るには、30両から40両は必要だった、といいます。国立国会図書館のレファレンス協同データベースが、本の記述を引いています。
        figure: null
      # fact: sankin-26
      - 語り: 島田市の論文集は、いちばん低いときでも48文。
      # fact: sankin-26
      - 語り: 国会図書館の回答が引く本は、享保年間の料金として、股通のとき48文。そこから、水が深くなるほど高くなり、いちばん深い脇通では94文、と書きます。
      # fact: sankin-25
      - 語り: 川留めは、最長で、28日続いたとされます。藤枝・岡部の宿から、日坂・掛川の宿まで、足止めの影響が広がりました。
        card: {head: "川留め最長28日", body: 慶応4年（1868年）のこと}
      # fact: sankin-25
      - 語り: 島田市の論文集は、幕末の慶応4年、旅行情報サイトは、明治元年と書きます。どちらも、1868年のことになります。
      # fact: sankin-25
      - 語り: 川を渡る料金と、足止めされた旅人の宿代は、島田宿と金谷宿の、大きな収入になりました。
      # fact: sankin-31
      - 語り: 宿場の本陣は、大名が泊まる宿です。文政5年、1822年。二川宿の本陣は、昼は彦根藩、夜は福岡藩が使う決まりでした。
        card: {head: "二川宿（文政5年）", body: 51人が本陣、家臣は57軒に分宿}
      # fact: sankin-31
      - 語り: 福岡藩の一行のうち、殿様をはじめ51人が本陣に泊まり、家臣たちは、旅籠など57軒に分かれて泊まりました。
      # fact: sankin-30
      - 語り: ところが、宿場が大名で潤った、とは限りません。西国街道、郡山宿の椿本陣に残る宿帳では、行列が泊まった日は、1年に平均22.7日。
      # fact: sankin-30
      - 語り: 月に2日にも、なりません。参勤は年2回に集中するため、予約のない月もありました。
      # fact: sankin-28, sankin-29
      - 語り: 人馬が足りなければ、近くの村に助けを求めました。助郷です。東海道の宿場には、常に100人、100頭を備える決まりで、足りない分を、近隣の村が出しました。
        card: {head: "助郷", body: 賃金は無償、または日当2〜3文}
      # fact: sankin-28, sankin-29
      - 語り: その賃金は、公用のため、無償、あるいは、日当が2文から3文だった、と小林明さんは書いています。
      # fact: sankin-58
      - 語り: 宿代の交渉も、ありました。nippon.com の連載によれば、安永10年、1781年。萩藩の行列、600人から700人が、矢掛宿に泊まりました。旅籠は1人143文。萩藩は128文を求め、138文で折り合ったといいます。
      # fact: sankin-34
      - 語り: 徳山藩の道中日記に、ある1日が残っています。安永7年、1778年の5月19日。
      # fact: sankin-34
      - 語り: 朝6時に神奈川を出て、程ヶ谷、戸塚、藤沢で休み、馬入川を船で渡って、午後5時ごろ、大磯の本陣に着きました。本陣の主人からの献上物は、断っています。
      - 語り: 旅は、お金のかかる旅でした。では、いくらかかったのか。
        tone: 疑問
        hook: true
      - 語り: 冒頭の、食い違う数字に、戻ります。
        hook: true

  # ================================================================ 第4章 いくらかかったのか
  - title: いくらかかったのか　加賀・岡山と江戸の屋敷
    background: {image: paintings/sankin_hishikawa_daimyo_procession_met.jpg, credit: "大名行列の絵巻（菱川派、1700年ごろ。メトロポリタン美術館所蔵、ウィキメディア・コモンズ、CC0）"}
    year: 1808
    lines:
      # fact: sankin-13
      - 語り: 加賀藩、文化5年、1808年。藩主が国元に帰った、その旅の費用が、「銀三百三十二貫四百六十六匁余」。小林明さんの連載は、約5500両と書きます。うち、随行の藩士に渡した手当は、741両余。
        card: {head: "文化5年（1808年）", body: 帰国の旅の費用は約5500両}
      # fact: sankin-13
      - 語り: 片道分です。江戸へ来る分を加えれば、ほぼ倍になります。連載は、この往復の旅費が、江戸での支出の、10分の1ほどにすぎない、とまとめています。
      # fact: sankin-38
      - 語り: 備前岡山藩の記録もあります。文政11年、1828年の道中経費は、金3573両。翌年は、金3250両。
        year: 1828
      # fact: sankin-38
      - 語り: 豊橋市美術博物館の学芸員が、2025年に婦人公論.jp で紹介しています。川留めで、近くの宿場に連泊すると、滞在費がかさんだ、といいます。
      # fact: sankin-59
      - 語り: 旅の途中で、お金が尽きた藩もありました。庄内藩の酒井忠徳は、数え18歳での最初の入国の旅で、福島に着いたところで、旅費が尽き、国元からの送金も届かず、足止めされました。
      # fact: sankin-17
      - 語り: では、江戸での支出です。藩の年間経費のうち、江戸で使った割合を、藩ごとに並べた表があります。
        figure: {type: stats, title: 藩の経費のうち、江戸での支出の割合, items: [[久留米藩（21万石・1815年）, 43%, 文化12年], [加賀藩（102万石・1747年）, 61%, 延享4年], [長岡藩（7万石・1865年）, 78%, 慶応元年]], upto: 3}
      # fact: sankin-17
      - 語り: 加賀藩、102万石は、延享4年、1747年で、61パーセント。弘前藩は、文化13年で、63パーセント。秋田藩は、延享2年で、73パーセントです。
      # fact: sankin-17
      - 語り: 長岡藩は、慶応元年で78パーセント。備中松山藩は、嘉永5年で78パーセント。松江藩は、明和5年で53パーセント。久留米藩は、文化12年で、43パーセント。2倍近く、違います。
        figure: null
      # fact: sankin-17
      - 語り: この表は、年も、藩の大きさも、ばらばらの数字を並べたものです。
      # fact: sankin-18
      - 語り: 一方、歴史家の安藤優一郎さんは、PRESIDENT Online で、参勤交代に要した費用は、藩の年間経費の、5パーセントから10パーセントだった、と書いています。
        card: {head: "参勤交代の費用", body: 藩の年間経費の5〜10%}
      - 語り: 4割強から8割近くと、5パーセントから10パーセント。数え方が違う、と考えられます。参勤の旅そのものの費用か、江戸に住む費用の全体か。それで、数が変わります。
        tone: 重い
      # fact: sankin-61
      - 語り: 江戸の屋敷も、大きなものでした。加賀藩の板橋の下屋敷、平尾邸は、延宝7年、1679年に、前田綱紀が、6万坪を拝領したのが始まりです。
        card: {head: "加賀藩 平尾邸", body: 最大で約21万8千坪}
      # fact: sankin-61
      - 語り: のちに、約21万8千坪に広がり、江戸とその周辺で、最大の大名屋敷でした。
      # fact: sankin-23
      - 語り: その屋敷に、国元から来た藩士たちが住みました。勤番侍です。紀州藩の酒井伴四郎は、万延元年、1860年に江戸へ出ました。
      # fact: sankin-23
      - 語り: 半年、183日のうち、仕事をしたのは、47日。勤務は、午前中の、2時間ほどだった、と和樂web は紹介しています。
      - 語り: 旅の費用も、江戸の費用も、確かに、重かった。では、幕府は、それを知って、なぜ命じたのか。
        tone: 疑問
        hook: true
      - 語り: 通説と、いまの見方を、並べてみます。
        hook: true

  # ================================================================ 第5章 なぜ命じたのか
  - title: では、なぜ幕府は命じたのか　通説と近年の見方　1635年から2025年
    background: {image: paintings/sankin_hishikawa_daimyo_procession_met.jpg, credit: "大名行列の絵巻（菱川派、1700年ごろ。メトロポリタン美術館所蔵、ウィキメディア・コモンズ、CC0）"}
    year: 1722
    lines:
      # fact: sankin-11
      - 語り: 通説は、こうでした。大名に、江戸と国元の往復をさせ、費用を使わせて、力を弱める。nippon.com は、出費にあえいだ諸藩を弱体化させ、幕府に反逆する体力をそぐ、と通説を紹介しています。
        card: {head: "通説", body: 大名の経済力を弱めるため}
      # fact: sankin-11
      - 語り: ところが、2025年のある書評は、こう書いています。経済力を弱めるために行われた、という説は、その後、修正された。いまの見方は、主従関係を確かめる、服属の儀礼で、軍役だ、と。
        card: {head: "近年の見方", body: 服属の儀礼・軍役}
      # fact: sankin-12
      - 語り: ただ、辞典の書き方は、そろいません。共同通信の用語解説は、大名が領土を広げて力をつけるのを、抑える効果がある、と書きます。「効果」と書いて、目的とは、言い切っていません。
        figure: {type: stats, title: 参勤交代の目的　出どころごとの見方, items: [[通説（nippon.com の紹介）, 諸藩を弱体化, 反逆する体力をそぐ], [共同通信の用語解説, 抑える効果, 目的とは言い切らず], [近年の見方（2025年の書評）, 服属儀礼・軍役, 弱体化説は修正された]], upto: 3}
      # fact: sankin-41
      - 語り: 幕府自身が、在府の長さを、動かしたこともあります。享保7年、1722年の7月。1万石ごとに、毎年100石の上米を出す代わりに、江戸にいる期間を、1年から半年に縮めました。
        figure: null
        card: {head: "享保7年（1722年）", body: 上米と引き換えに、在府は半年へ}
      # fact: sankin-41
      - 語り: 上納は、年間18万7000石。旗本・御家人の給米の、50パーセント強に当たります。山川の日本史小辞典の記述です。
      # fact: sankin-41
      - 語り: 山川の辞典には、この上米は、31年に廃止された、とあります。
      # fact: sankin-20
      - 語り: 冒頭の条文に、戻ります。お供を減らせ、と書かれた、1635年。その前年の1634年には、熊本の細川忠利が、従者の削減を願い出ていた、と小林明さんは書いています。
        year: 1635
      # fact: sankin-19, sankin-20
      - 語り: その後、享保6年、1721年にも、人数の目安が出ました。減らせ、という言葉は、条文にも、目安にも、ありました。ただ、仙台藩は、1842年に、1577人に及んだといわれます。
        tone: 重い
      # fact: sankin-51
      - 語り: アメリカの研究者、コンスタンティン・ヴァポリスさんは、別の面を見ます。参勤交代は、文化、知識、物、技術の交流の原動力だった、と、ハワイ大学出版局の紹介文にあります。
        card: {head: "ヴァポリス『Tour of Duty』", body: 文化・知識・物・技術の交流の原動力}
      # fact: sankin-51
      - 語り: 江戸の文化は、地方の要素を含んでいて、文化が、江戸を通らずに、地方から地方へ伝わることもあった、と論じています。
      # fact: sankin-39
      - 語り: 例もあります。弘前藩は、寛政9年、1797年に、国元の藩校とは別に、江戸に弘道館を設けて、江戸住まいの藩士の教育にあてました。
      # fact: sankin-40
      - 語り: 江戸の屋敷づくりの木材の需要を背景に、尾張藩や秋田藩は、材木を商品にして、木曽ひのき、秋田すぎとして有名になった、と説明されます。
      - 語り: 弱らせるためか。主従を確かめるためか。それとも、旅がもたらしたもの、まで含めて見るのか。見方は、分かれました。では、この旅は、どう終わったのか。
        tone: 疑問
        hook: true
      - 語り: 幕末、文久2年から、見ていきます。
        hook: true

  # ================================================================ 第6章 どう終わり、何が残ったのか
  - title: 参勤交代は、どう終わり、何が残ったのか　1862年から赤門まで
    background: {image: paintings/sankin_kasumigaseki_hiroshige2_1863.jpg, credit: "江戸霞ヶ関の大名行列（二代歌川広重、1863年。LACMA 所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1862
    lines:
      # fact: sankin-42
      - 語り: 文久2年、1862年の閏8月。幕府の改革で、参勤は大きく緩められました。決めたのは、一橋慶喜や松平慶永らの、幕政改革とされます。
        card: {head: "文久2年（1862年）閏8月", body: 参勤が大きく緩められる}
      # fact: sankin-42
      - 語り: その中身の書き方が、そろいません。品川区の資料は、「三四ヵ年目に、三ヵ月、又は壱ヵ年在府」。新潟県立図書館は、三年ごとに一年間、又は百日間。世界大百科事典は、三年に一年、または百日の在府です。
        figure: {type: stats, title: 文久2年の緩和　在府の期間の書き方, items: [[品川区の資料, 三四ヵ年目に三ヵ月又は一ヵ年, 当時の布告の書き方], [新潟県立図書館, 三年ごとに一年間又は百日間, 越後の大名の話], [世界大百科事典, 三年に一年または百日, 辞典の要約]], upto: 3}
      # fact: sankin-43
      - 語り: 榎本浩章さんは、2014年に、法学新報で論じています。この緩和は、軍事改革のための、無駄な出費を減らす策だった。
        figure: null
      # fact: sankin-43
      - 語り: 従来の評価は、幕府が諸藩を抑えきれず、やむなく緩めた、という消極的なものでしたが、榎本さんは、積極的な改革と見ます。
      # fact: sankin-44
      - 語り: ただ、緩和のあとも、朝廷と幕府の対立、外国との緊張、国内の治安の悪化で、多くの大名が、各地の警備に動員され、国元へ戻れない場合が多かった、と榎本さんは書いています。
      # fact: sankin-46
      - 語り: 緩和の知らせが出た直後、長州藩などは、江戸の上屋敷の、建具や畳まで、国元へ送りました。
        card: {head: "文久2年の直後", body: 屋敷の建具や畳まで国元へ}
      # fact: sankin-46
      - 語り: 品川宿は、その輸送で、大騒ぎになった、と品川区史にあります。その後、品川宿の衰えは、時とともに、深刻になりました。
      # fact: sankin-45
      - 語り: 元治元年、1864年の9月。幕府は、在国の大名で、今年が参勤の年の者は、至急、出府せよ、と命じて、旧制に戻そうとしました。しかし、大名の抵抗が強く、思うようにいきませんでした。
      # fact: sankin-45
      - 語り: では、いつ終わったのか。品川区の資料は、元治元年の復旧令。ブリタニカは、慶応元年、1865年に、再び旧に戻したが、命令に従う者がなく、廃れた。
        figure: {type: stats, title: 参勤交代の終わり　出どころごとの年, items: [[品川区の資料, 1864年, 復旧令を出したが従わない藩も], [ブリタニカ国際大百科事典, 1865年, 命令に従う者がなく廃れた], [米国の学生向けページ, 1867年, 正式に崩れたと説明]], upto: 3}
      # fact: sankin-45
      - 語り: アメリカの大学の学生向けページは、1867年に、正式に崩れた、と書きます。
      - 語り: 終わりの年は、出どころごとに、違います。榎本さんは、復旧令に、従わなかった藩と、従った藩とがあった、と書いています。
        tone: 重い
        figure: null
      # fact: sankin-47
      - 語り: そして、屋敷です。東京大学の構内の大部分は、江戸時代の加賀藩上屋敷でした。明治になって、建物はほとんど取り壊され、1827年に建てられた、赤門だけが残りました。文京区の資料です。
        card: {head: "赤門", body: 加賀藩上屋敷の門、1827年建立}
      # fact: sankin-48
      - 語り: 大手町や丸の内の、大名の上屋敷の跡には、明治に、官庁が入りました。大蔵省は、1871年に、姫路藩酒井家の上屋敷の跡へ。司法省は、同じ1871年に、西尾藩松平家の上屋敷の跡に、置かれました。
      # fact: sankin-49
      - 語り: 江戸の土地のうち、武家地は、どれほどだったのか。中央区の資料は、約70パーセント。三井住友トラスト不動産のまちの記録は、約60パーセントと書きます。数え方で、数が変わります。
        figure: {type: stats, title: 江戸の土地に占める武家地, items: [[中央区の資料, 約70%, 武家地は約7割], [三井住友トラスト不動産, 約60%, 残りを寺社地と町人地で2割ずつ], [参勤が終わったあと, 官庁・大学・公園へ, 赤門・大手町・日比谷]], upto: 3}
      # fact: sankin-50
      - 語り: 参勤が終わると、江戸の人口は、減ったといわれます。日経ビジネスは、東京の人口は4割近く減り、67万人あまりになった、と書きます。
        figure: null
      # fact: sankin-50
      - 語り: ただ、国立国会図書館は、明治元年から4年の人口は、掲載された資料を見つけられなかった、と回答しています。
      - 語り: 日比谷公園は、大名屋敷地と陸軍の練兵場を経て、1903年に開園しました。大名の屋敷のあとは、官庁になり、大学になり、公園になりました。
      - 語り: 最後に、冒頭の問いに、戻ります。
        hook: true
      - 語り: なぜ、幕府は、毎年の旅を、命じたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（冒頭の問いに戻る。余韻の一文）
  - title: まとめ：なぜ、毎年の旅を命じたのか
    background: {image: paintings/sankin_kasumigaseki_hiroshige2_1863.jpg, credit: "江戸霞ヶ関の大名行列（二代歌川広重、1863年。LACMA 所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: なぜ、幕府は、毎年の往復を命じたのか。一つの答えには、決められませんでした。通説は、力を弱めるため。近年の見方は、主従を確かめる、服属の儀礼と軍役。出どころによって、書き方が分かれています。
        tone: しみじみ
      - 語り: 出どころから言えることは、三つあります。事典によれば、1615年の「参覲」は、京都の作法だったこと。1635年の条文が、毎年の参勤と、お供の削減を、同じ条に書いたこと。
      - 語り: そして、山川の辞典によれば、1722年に、幕府自身が、上米と引き換えに、在府を半年に縮めたことです。
      - 語り: 加賀藩の行列は、4千人とも、1969人とも書かれました。江戸での支出は、4割強とも、78パーセントとも、参勤の費用は、5パーセントから10パーセントとも、書かれました。数え方で、数が変わる。
        tone: しみじみ
        pause: 0.8
      - 語り: 「減らせ」と書かれた旅は、230年近く、続きました。幕末、屋敷の畳まで国元へ運ばれたあとも、終わりの年は、出どころごとに、いまも違います。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null

