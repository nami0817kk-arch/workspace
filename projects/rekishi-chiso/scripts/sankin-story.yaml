terms:
  定府: 参勤をせず、江戸に住み続ける大名
  川留め: 増水で、川を渡れなくなること
  本陣: 大名や公家が泊まる、宿場の格式の高い宿
  助郷: 宿場の人馬が足りないとき、近くの村から出させた人と馬
  上米: 在府を短くする代わりに、大名が納めた米
  武家諸法度: 幕府が大名に出した、守るべき決まり
  勤番侍: 藩主の江戸滞在に付き、江戸の屋敷に住んだ藩士
  渡り者: 江戸入りの前などに雇った、臨時の供の者

