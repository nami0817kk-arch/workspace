# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と sosou-story.yaml の型）。ジャンヌ・ダルク。2026-10-29 下書き。
# 公開の予定は 11/02 19:00（世界史枠）。
# 型：1本に1つの「なぜ」＝「なぜジャンヌは、一度許された6日後に処刑されたのか。『男の服に戻ったから』は本当か」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝ジャンヌは一度許されていた。処刑されたのはその6日後（1431年5月24日の終身の牢の判決→5月30日の判決。裁判記録）。
#   導入では答え（再犯の理由が記録の上では「服」と「声」の2つ並ぶこと）を言わず、第4章で出す。
#   第1章 売られた少女（フォーカンベルグの絵／1430年7月14日のコーションの要求書＝6000フラン・断られたら1万フラン／9月の課税／3月14日の「売られた」）
#   第2章 教会の牢ではなく（イングランド兵の見張り／2月21日・24日の答え／3月25日の枝の主日「服は変えられない」／マションの証言＝隠れて書く者）
#   第3章 署名すれば助かる（5月24日／ロワズルールの言葉・判決文2通／マシュー・マションの証言／記録食い違い①：誓約書の長さ／教会の牢を求めた）
#   第4章 通説の検証「男の服に戻ったから処刑された」は本当か（5月27〜30日／記録食い違い②：なぜ服に戻ったか＝本人の言葉・マシュー・マション・ドミニコ会士／
#          記録の上の再犯の理由は「服」と「声」の2つ／欄外の「致命的な答え」／食い違い③：見張りの人数）
#   第5章 司教さま、あなたのせいで（処刑の朝の証言／1450年の調べ／1455年の請願／1456年の判決＝12箇条は偽り・無効／「法の上のつくりごと」）
#   第6章 ミイラと猫の骨（遺物の分析 2007・2010／指輪 2016）
#   第7章 まとめ（2つの答え → 冒頭に戻る：紙の上の十字）。締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを並べたのは3か所：①誓約書の長さ（裁判記録の長い文／立ち会った3人は「6、7行」「主の祈りほど」）
#   ②男の服に戻った理由（ジャンヌ本人・1431／マシュー・1450／マション・1452／ドミニコ会士ラドヴニュとイザンバール・1452〜56）
#   ③見張りの人数（マシュー5人／マション4人）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/ジャンヌ・ダルク_facts_20261029.yaml、jeanne-01〜）にあるものだけ。行の上に `# fact: jeanne-NN`。
#   裁判記録は ①Quicherat 1841『Procès de condamnation et de réhabilitation de Jeanne d'Arc』第1巻（フランス語・ラテン語の原文。p.456 で確認）と
#   ②T. D. Murray 1902 の英訳（Project Gutenberg 57389。復権のための調べの証言も入る）を開いて読んだ。外国語は日本語に訳して引く。
#   語りでは原典名・年・誰が言ったかを言う（「裁判記録」「1450年のマシューの証言」）。「と伝わる」は使わない。
#   証言は事件の19〜25年後（1450・1452・1455〜56年）で、フランス王が町を取り戻したあとに取られた点を第4章で言う。
#   シャルル7世が調べを命じた理由（自分の正統性）は Murray 1902 の説明。語りでは「マレーは〜と説明しています」と言う。
#   最期の場面は描かない。「処刑されました」まで。炎・遺体の描写はしない。AI 絵の人物は手もと・後ろ姿・遠景（最期に人物の絵は当てない）。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（声は作らない）。
#   想像の台詞は2か所（ジャンヌ想像・イザベル想像。config の roles に足した）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の jeanne_fauquembergue_1429（パリ高等法院の記録の余白の絵。フランス国立公文書館所蔵・ウィキメディア・コモンズ、パブリックドメイン）・
#   jeanne_lefranc_champion_des_dames_c1451（『貴婦人の擁護者』の挿絵 1451年ごろ。BnF・コモンズ、PD）・
#   jeanne_vigiles_compiegne_c1484（マルシャル・ドーヴェルニュ『シャルル7世の通夜』の挿絵 1484年ごろ。BnF・コモンズ、PD）＋ AI 絵（N01〜N15、一覧は dev/output/rekishi-chiso/research/jeanne_ai_images.md）。
#   AI 絵にジャンヌの顔は描かない。実在の俳優・映画・絵画のジャンヌに似せない。戦闘・遺体・炎は描かない。
