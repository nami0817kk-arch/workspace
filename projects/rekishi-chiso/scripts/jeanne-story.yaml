sections:
  # ================================================================ 導入（冒頭 約3分）。答え（再犯の理由が服と声の2つ）は第4章まで言わない
  - title: 許された6日後に、処刑された　1431年5月 ルーアン
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N01（朝の墓地。石の十字架と空の台。人物なし）
    year: 1431
    lines:
      # 0〜10秒：知らない事実（許された6日後）
      # fact: jeanne-01
      - 語り: ジャンヌ・ダルクは、一度、《許されて》いました。処刑されたのは、その、6日後です。
        tone: 強調
        card: {head: "1431年5月", body: 許された6日後に処刑}
      # fact: jeanne-01, jeanne-07
      - 語り: 1431年5月24日、木曜日。フランスのルーアンの墓地で、およそ19歳のジャンヌは、一枚の誓約書に、署名します。
      # fact: jeanne-02
      - 語り: 署名といっても、文字ではありません。裁判記録は、「ジャンヌ」の名と、十字を、写しています。廷吏のジャン・マシューは、1450年に、こう証言しました。わたしが渡したペンで、十字を書いた、と。
        card: {head: "署名", body: 文字ではなく十字}
      # fact: jeanne-01
      - 語り: 判決は、死刑では、ありませんでした。破門を解かれ、ただし、罪は重いので、終身の牢です。
      # fact: jeanne-01
      - 語り: その日の午後、ジャンヌは、男の服を脱いで、女の服に着替えました。
        tone: しみじみ
      # fact: jeanne-18
      - 語り: 2か月前の、3月25日。枝の主日に、判事たちは、ジャンヌに持ちかけていました。女の服を着るなら、ミサを許そう、と。ジャンヌは、こう答えています。「服を変えることは、できません」。復活祭の聖体を、受けられなくても、です。
        card: {head: "3月25日", body: ミサより男の服を選ぶ}
      # fact: jeanne-10
      - 語り: その少女が、4日後。5月28日の月曜に、判事たちが牢を訪ねると、ジャンヌは、また、男の服を着ていました。
        tone: 重い
        card: {head: "5月28日", body: また男の服を着ていた}
      # fact: jeanne-10
      - 語り: 裁判記録によれば、ジャンヌ本人は、こう答えます。「自分の意志で、着ました。約束が、守られなかったからです」。
      # fact: jeanne-12, jeanne-14
      - 語り: ところが、19年から25年ほどあとの証言は、まるで違う話をします。女の服は、取り上げられた。暴行されかけたので、戻った。服は、わざと、牢に置かれていた。
        tone: 重い
      # fact: jeanne-16
      - 語り: そして、処刑の朝。ジャンヌは、自分を裁いた司教に、こう言った、と、同じ牢にいた修道士が証言しています。「司教さま、わたしは、あなたのせいで、死ぬのです」。
        card: {head: "処刑の朝", body: 「司教さま、あなたのせいで」}
      - 語り: 男の服は、本当に、決め手だったのか。それとも、記録の中に、別の理由が、隠れているのか。
        tone: 疑問
        pause: 0.8
      - 語り: 話は、その1年前、夏の初めから始まります。
        tone: 疑問
        pause: 0.6

  # ================================================================ 第1章 売られた少女（1429〜1430）
  - title: 「売られた」と、ジャンヌは言った　1430年 コンピエーニュ
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N03（霧のかかる城壁の外の野原。遠景だけ）
    year: 1430
    lines:
      # fact: jeanne-09
      - 語り: ところで、ジャンヌ・ダルクの顔を、誰も知りません。生きていたころに描かれた絵は、たった1枚です。
        portrait: {image: paintings/jeanne_fauquembergue_1429.jpg, caption: "パリ高等法院の記録の余白の絵（1429年5月10日、書記フォーカンベルグ。フランス国立公文書館）"}
        card: {head: "生前の絵", body: たった1枚}
      # fact: jeanne-09
      - 語り: 1429年5月10日。パリの高等法院の書記、クレマン・ド・フォーカンベルグは、その日の記録の余白に、小さな人物を描き込みました。旗と剣を持つ、乙女です。
      # fact: jeanne-09
      - 語り: ただし、書記は、本人を見ていない、と、解説サイトは説明します。人づてに聞いた姿を、思い描いたのでしょう。裾にひだのある、スカートのような姿に、描かれています。
        tone: しみじみ
      - 語り: 男の服で戦った少女を、書記は、スカート姿で、描きました。顔の分からない少女が、これから、書類の中で、裁かれていきます。
        tone: しみじみ
        portrait: null
      # fact: jeanne-04
      - 語り: 1430年5月23日。ジャンヌは、コンピエーニュの町の外で、ブルゴーニュ軍に捕らえられます。19世紀に史料集を編んだジュール・ケシュラは、注に、こう書いています。ジャン・ド・リュクサンブールの隊にいた、ヴァンドンヌの庶子の、弓兵が、手をかけた、と。
        card: {head: "1430年5月23日", body: コンピエーニュで捕らえられる}
      # fact: jeanne-04
      - 語り: 3日後の26日。パリの大学と異端審問官は、ブルゴーニュ公に、手紙を書きます。ジャンヌを、異端の疑いで、教会に渡すように、と。
      # fact: jeanne-04
      - 語り: 7月14日。コンピエーニュの前の、ブルゴーニュ公の陣に、ボーヴェの司教、ピエール・コーションが現れます。ジャンヌは、自分の司教区で捕らえられた。だから、裁くのは、わたしだ、と。
        card: {head: "1430年7月14日", body: 司教コーションが引き渡しを要求}
      # fact: jeanne-04
      - 語り: コーションの要求書には、金額まで、書かれていました。ジャンヌを捕らえた者たちには、国王が、6000フランまで出す。ヴァンドンヌの庶子には、年に200から300リーヴルの収入を。
        figure: {type: stats, title: コーションの要求書　1430年7月14日, items: [[最初の申し出, 6000フラン, 捕らえた者たちへ（国王から）], [断られたら, 1万フラン, 王を捕らえたときの身代金の慣習]], upto: 1}
      # fact: jeanne-04
      - 語り: 断られたときの備えも、書かれています。ジャンヌの捕縛は、王の捕縛とは違う。それでも、フランスの慣習にならって、王の身代金、1万フランを保証するから、渡せ、と。
        figure: {type: stats, title: コーションの要求書　1430年7月14日, items: [[最初の申し出, 6000フラン, 捕らえた者たちへ（国王から）], [断られたら, 1万フラン, 王を捕らえたときの身代金の慣習]], upto: 2}
      # fact: jeanne-05
      - 語り: 費用は、イングランドが支配する、ノルマンディーの村々の税から出ました。1430年9月の書簡は、村ごとの課税を、軍の費用と、「乙女の買い取り」のためだ、と書きます。
        figure: null
      # fact: jeanne-05
      - 語り: コーションは、1431年1月31日、買い取りの交渉などの費用として、765リーヴルを受け取った、という受領書を残しています。5月から9月まで、153日分です。
      # fact: jeanne-06
      - 語り: 売られることを、ジャンヌ本人も、知っていました。ボーレヴォワールの塔にいたとき、ジャンヌは、塔から、飛び降ります。
        tone: 重い
      # fact: jeanne-06
      - 語り: 理由は、1431年3月14日の牢での尋問で、本人の答えは、こうです。「イングランドに売られた、と知っていました。敵の手にあるより、死んだほうが、ましでした」。
        card: {head: "3月14日の答え", body: 「売られたと知っていた」}
      # fact: jeanne-13
      - 語り: ジャンヌは、ルーアンへ送られます。イングランド王の、司教あての手紙があった、と、公証人のギヨーム・マションは、1452年に証言しました。
      - 語り: ここから先、ジャンヌの敵は、戦場の兵ではなく、書類と、法になります。
        tone: しみじみ
        hook: true
      - 語り: その牢は、教会の牢では、ありませんでした。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 教会の牢ではなく（1431年2〜3月）
  - title: 教会の裁判なのに、見張りはイングランド兵　1431年 ルーアン
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N05（城の高い窓から見た中庭。石の壁と鉄格子。人物なし）
    year: 1431
    lines:
      # fact: jeanne-15
      - 語り: 裁判は、教会の裁判です。ところが、ジャンヌが入れられたのは、教会の牢では、ありませんでした。
      # fact: jeanne-15
      - 語り: 見張りは、イングランドの兵。公証人のニコラ・タケルは、1452年に、こう証言しました。見張りのイングランド人の許しがなければ、判事でさえ、ジャンヌに会えなかった、と。
        card: {head: "見張りはイングランド兵", body: 判事でも許しなしには会えない}
      # fact: jeanne-12, jeanne-13
      - 語り: 見張りの数は、証言で、揺れます。廷吏のマシューは、5人。夜は3人が部屋に、2人が戸口にいて、脚は、2組の鉄の鎖で、寝台につないだ、と言います。公証人のマションは、4人、と言っています。
        figure: {type: stats, title: 見張りは何人か, items: [[マシュー　1450年, 5人, 3人が部屋に・2人が戸口に], [マション　1452年, 4人, イングランド人の見張り]], upto: 2}
      # fact: jeanne-07
      - 語り: 2月21日、最初の尋問。名前を聞かれたジャンヌの答えは、こうです。「故郷では、ジャネットと呼ばれていました。苗字は、知りません。年は、19歳ほどです」。
        figure: null
        card: {head: "2月21日の答え", body: 「苗字は知りません」}
      # fact: jeanne-07
      - 語り: 父の名は、ジャック・ダルク。母は、イザベル。同じ答えの中で、ジャンヌは、そう言っています。
        tone: しみじみ
      # fact: jeanne-08
      - 語り: 2月24日。「あなたは、神の恵みの中にいますか」。ジャンヌは、こう答えました。「いなければ、神が、そこに置いてくださるように。いるなら、そのまま保ってくださるように」。
        card: {head: "2月24日", body: 「神の恵みの中にいるか」}
      - 語り: この答えは、そのまま、裁判記録に残っています。
        tone: しみじみ
      # fact: jeanne-18
      - 語り: その3月25日、枝の主日の朝。判事たちは、牢のジャンヌを訪ね、ミサを許す、と持ちかけます。ただし、女の服を着るなら、という条件です。
        tone: 重い
      # fact: jeanne-18
      - 語り: ジャンヌは、断ります。記録には、こうあります。「この服は、わたしの魂の重荷には、なりません。教会の法にも、反しません。ミサだけは、この服のまま、聞かせてください」。
        card: {head: "3月25日の答え", body: 「魂の重荷にはならない」}
      # fact: jeanne-18
      - 語り: 復活祭の聖体を受けるより、男の服を、選んだんです。検事のデスティヴェは、この答えを、公文書にするよう、求めました。
        tone: 強調
      # fact: jeanne-26
      - 語り: では、この裁判の記録は、どこまで信じられるのか。書いたのは、3人の公証人です。マションは、1450年の調べで、こう言っています。3人の書いたものには、大きな違いがあり、言い争いになった、と。
      # fact: jeanne-13
      - 語り: さらに、1452年の証言です。物陰に、隠れて書く者が、2、3人いて、ジャンヌに有利な言葉を、省いた。自分は、そう書くことを求められたが、断った、とマションは言います。
        card: {head: "マションの証言", body: 有利な言葉を省いた者がいた}
      - 語り: これは、19年から25年あとの証言です。記録の側と、証言の側と、どちらも、疑いながら読む必要があります。
        tone: しみじみ
      - 語り: それでも、記録には、ジャンヌ本人の言葉が、残っています。5月24日。ジャンヌは、墓地に引き出されます。
        tone: しみじみ
        hook: true
      - 語り: そこで、何が読み上げられたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 署名すれば助かる（1431年5月24日）
  - title: 「署名すれば、助かる」　1431年5月24日 サン・トゥーアンの墓地
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N07（朝の墓地に組まれた木の台。誰もいない。人物なし）
    year: 1431
    lines:
      # fact: jeanne-17
      - 語り: 5月24日の朝。墓地に、台が組まれ、ジャンヌは、そこに連れて行かれます。
      # fact: jeanne-17
      - 語り: その前に、司祭のニコラ・ロワズルールが、ジャンヌに声をかけていた、と、マションは証言します。「ジャンヌ、わたしを信じなさい。望むなら、救われる。女の服を着て、言われたとおりにしなさい。さもなければ、命が危ない」と。
        card: {head: "ロワズルールの言葉", body: 「女の服を着て従え」}
      # fact: jeanne-17
      - 語り: 司教コーションの手には、判決文が、2通ありました。ひとつは、誓約を受け入れる判決。もうひとつは、有罪の判決です。
      # fact: jeanne-02
      - 語り: 説教のあと、神学者のギヨーム・エラールが、書面を読み上げます。ジャンヌは、「誓う、という意味が、分かりません」と言い、廷吏のマシューに、助言を求めました。
      # fact: jeanne-02
      - 語り: マシューは、1450年の証言で、こう言っています。「誓わなければ、焼かれる、という意味だと、教えた」。ジャンヌは、エラールに、大きな声で言います。「普遍の教会に、お任せします」。
        tone: 重い
      # fact: jeanne-02
      - 語り: エラールは、言い返しました。「今すぐ誓え。さもなければ、焼かれる」。マシューは、そう証言しています。
      # 【想像1】ジャンヌ。記録：マシューは教会の牢に移すよう助言した（1450年の証言）。ロワズルールは「女の服を着れば教会に引き渡される」と言った（マション、1452）。気持ちだけ
      - 人物: 「……教会の牢に、行けるのですね」
        who: ジャンヌ想像
        imagined: true
        tone: しみじみ
      # fact: jeanne-17
      - 語り: 誓約が読まれたとき、ジャンヌは、笑った、とマションは証言しています。「確かに笑った」。処刑人は、荷車と一緒に、すぐそばで、待っていた、とも。
        card: {head: "マションの証言", body: 「ジャンヌは確かに笑った」}
      # 食い違い①：誓約書の長さ（裁判記録／ラシャンブル・モネ・ミジエ）
      # fact: jeanne-03
      - 語り: では、このとき、ジャンヌが署名した紙は、どんな文章だったのか。裁判記録に載っているのは、長い文章です。罪をひとつずつ数え、男の服も、髪を丸く切ったことも、悔いる、と書きます。
        figure: {type: stats, title: 誓約書の長さ　記録と証言, items: [[裁判記録　1431, 長い文章, 罪を数え上げ・男の服も悔いる], [ラシャンブル・モネ　1456, 6、7行, 二つ折りの短い紙], [ミジエ　1455年, 主の祈りほど, 長くない]], upto: 1}
      # fact: jeanne-03
      - 語り: ところが、同じ場にいた人たちは、違う姿を語ります。医師のギヨーム・ド・ラシャンブルは、1456年に、「六、七行ほどの、二つ折りの紙だった」と。神学者のジャン・モネも、「六、七行ほどの、短い書面」と。
        figure: {type: stats, title: 誓約書の長さ　記録と証言, items: [[裁判記録　1431, 長い文章, 罪を数え上げ・男の服も悔いる], [ラシャンブル・モネ　1456, 6、7行, 二つ折りの短い紙], [ミジエ　1455年, 主の祈りほど, 長くない]], upto: 2}
      # fact: jeanne-03
      - 語り: 修道院長のピエール・ミジエは、1455年に、主の祈りくらいの長さだった、と言います。
        figure: {type: stats, title: 誓約書の長さ　記録と証言, items: [[裁判記録　1431, 長い文章, 罪を数え上げ・男の服も悔いる], [ラシャンブル・モネ　1456, 6、7行, 二つ折りの短い紙], [ミジエ　1455年, 主の祈りほど, 長くない]], upto: 3}
      # fact: jeanne-25
      - 語り: 公証人のタケルは、1456年5月に、こうも証言しました。今ある形の記録に整えられたのは、ジャンヌの死の、ずっとあとだ、と。読まれた紙と、記録に載った文が、同じものなのか。記録からは、確かめられません。
        figure: null
        tone: しみじみ
      # fact: jeanne-01
      - 語り: 判決は、こうです。ジャンヌは、破門を解かれる。ただし、「悲しみのパンと、苦しみの水で」、終身の牢に入れる、と判決文は言います。
        card: {head: "5月24日の判決", body: 終身の牢（悲しみのパンと苦しみの水）}
      # fact: jeanne-15
      - 語り: 説教のあと、マシューは、教会の牢に移すよう、ジャンヌに助言しました。居合わせた何人かが、司教に、そう求めると、司教の答えは、「元の城へ連れて行け」でした。ジャンヌは、イングランド兵の牢に、戻されます。
        tone: 重い
      # fact: jeanne-01
      - 語り: 午後、副異端審問官のジャン・ルメートルが、牢を訪ねます。誓約を守るように、そして、男の服を脱ぐように、と告げると、ジャンヌは、女の服を着ます、と答えました。記録によれば、そのまま、女の服に着替えます。
      - 語り: 5月24日は、ここまでです。この先で、記録と証言は、別々の方向に進みます。
        tone: しみじみ
        hook: true
      - 語り: 男の服に戻ったのは、ジャンヌの意志だったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 通説の検証（男の服に戻ったから処刑された、は本当か）
  - title: 「男の服に戻ったから処刑された」は本当か　1431年5月27〜30日
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N09（朝の牢の部屋。窓からの光と鉄の鎖と、床に置かれた袋。人物なし）
    year: 1431
    lines:
      - 語り: よく語られる筋は、こうです。ジャンヌは、男の服に戻った。だから、再犯者として、処刑された。これは、本当でしょうか。
        tone: 疑問
      # fact: jeanne-12
      - 語り: 日曜日、5月27日。三位一体の主日の朝。廷吏のマシューは、1450年に、ジャンヌ本人から聞いた話を、証言しました。ジャンヌは、見張りの兵に、言った。「起きたいので、鎖を外してください」。
        card: {head: "5月27日の朝", body: マシューが聞いた話}
      # fact: jeanne-12
      - 語り: すると、見張りの一人が、女の服を取り上げ、袋に入れてあった男の服を、投げてよこした。「起きろ。女の服は、袋に入れろ」。
      # fact: jeanne-12
      - 語り: ジャンヌは、言います。「あなた方は、これが禁じられていると、知っているでしょう。決して、着ません」。押し問答は、昼まで続き、ジャンヌは、ついに、男の服を着ました。
        tone: 重い
      # fact: jeanne-12
      - 語り: 1456年の証言で、マシューは、こう補っています。用を足すために、やむを得なかった、と。
        tone: しみじみ
      # 食い違い②：なぜ服に戻ったか（4つの記録）
      # fact: jeanne-10
      - 語り: ところが、5月28日。判事たちに、ジャンヌ自身の答えは、こうでした。「自分の意志で、着ました。強いられては、いません。男の服のほうが、男たちの中にいるには、ふさわしい」。
        figure: {type: stats, title: 男の服に戻った理由　記録と証言, items: [[ジャンヌ本人　1431, 自分の意志, 約束が守られず・ミサも鎖も], [マシュー　1450年, 服を取り上げられた, 男の服だけが置かれた], [マション他　1452〜56, 暴行を恐れた, 襲われかけた・服は置かれた]], upto: 2}
      # fact: jeanne-10
      - 語り: 理由は、こうです。「約束が、守られなかったからです。ミサに行かせてもらえず、鎖も、外してもらえませんでした」。
        figure: {type: stats, title: 男の服に戻った理由　記録と証言, items: [[ジャンヌ本人　1431, 自分の意志, 約束が守られず・ミサも鎖も], [マシュー　1450年, 服を取り上げられた, 男の服だけが置かれた], [マション他　1452〜56, 暴行を恐れた, 襲われかけた・服は置かれた]], upto: 2}
      # fact: jeanne-13
      - 語り: 公証人のマションは、1452年に、別の理由を語ります。夜、見張りが襲いかかるのを恐れて、男の服を脱げなかった。司教らに訴えたが、変わらず、ウォリック伯が、見張りを替えた、と。
        figure: {type: stats, title: 男の服に戻った理由　記録と証言, items: [[ジャンヌ本人　1431, 自分の意志, 約束が守られず・ミサも鎖も], [マシュー　1450年, 服を取り上げられた, 男の服だけが置かれた], [マション他　1452〜56, 暴行を恐れた, 襲われかけた・服は置かれた]], upto: 3}
      # fact: jeanne-14
      - 語り: ドミニコ会士のラドヴニュとイザンバールは、さらに別のことを証言します。ジャンヌ本人から、イングランドの貴族に、暴行されかけた、と聞いた。その服は、わざと、牢に置かれていた、と。
        figure: {type: stats, title: 男の服に戻った理由　記録と証言, items: [[ジャンヌ本人　1431, 自分の意志, 約束が守られず・ミサも鎖も], [マシュー　1450年, 服を取り上げられた, 男の服だけが置かれた], [マション他　1452〜56, 暴行を恐れた, 襲われかけた・服は置かれた]], upto: 3}
      - 語り: 同じ朝を、記録と証言が、4通りに語ります。どれが真実なのか、記録からは、決められません。
        figure: null
        tone: しみじみ
      - 語り: ただ、証言を取った時期には、注意が要ります。1450年の調べは、フランス王が、ルーアンを取り戻したあとに、国王の命令で開かれました。イングランドの見張りの下で語られた記録とは、立場が、まるで違います。
        tone: 重い
      # fact: jeanne-01
      - 語り: では、記録の上で、再犯の理由は、何だったのか。5月29日、司教は、40人の陪席者を前に、こう説明します。ジャンヌは、悪魔に駆られて、声が戻った、と人々の前で言い、そして、女の服を捨てて、また、男の服を着た、と。
        card: {head: "5月29日", body: 再犯の理由は「声」と「服」}
      # fact: jeanne-10
      - 語り: 理由は、2つ、並んでいるんです。男の服。そして、声が、戻ったという答え。
        tone: 強調
      # fact: jeanne-10
      - 語り: 声について、ジャンヌは、5月28日に、こう答えていました。「聖女カトリーヌと聖女マルグリットが、伝えてきました。命を救うために、誓約を受け入れたのは、大きな裏切りだった。わたしは、命を救うために、自分を呪ったのだ、と」。
        card: {head: "5月28日の答え", body: 「命を救うために自分を呪った」}
      # fact: jeanne-10
      - 語り: さらに、こうも言います。「あの日、言って、取り消したことは、すべて、火が怖くて言ったことです」。
        tone: しみじみ
      # fact: jeanne-11
      - 語り: この答えの、横の余白に、記録係は、ラテン語で、2語、書き込みました。「Responsio mortifera」。「致命的な答え」。ジュール・ケシュラが1841年に出した史料集の、脚注に、そう記されています。
        tone: 強調
        card: {head: "欄外の書き込み", body: 「致命的な答え」}
      # fact: jeanne-11
      - 語り: 男の服は、きっかけでした。ただ、記録の上で、処刑に直結した言葉は、服よりも、この、声の答えだった。そう読む余地が、あります。
        tone: しみじみ
      # fact: jeanne-01
      - 語り: 5月29日、陪席者たちは、意見を述べます。大半は、再犯と認めました。30日の判決は、こう言います。「あなたは、再び、もとの誤りに落ちた。再犯の異端者である」。
      # fact: jeanne-24
      - 語り: 証人の一人、ジャン・リキエは、1456年に、こう言っています。「ジャンヌを死なせる口実を、作らねばならない」。ピエール・モーリスとロワズルールが、そう話すのを、聞いた、と。
        tone: 重い
      - 語り: 通説は、半分は正しく、半分は足りません。服は、記録の上の、理由のひとつにすぎず、残りの半分は、声でした。
        tone: しみじみ
        hook: true
      - 語り: そして、その朝、ジャンヌは、牢で、一人の修道士に会います。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 司教さま、あなたのせいで（1431〜1456）
  - title: 「司教さま、わたしは、あなたのせいで死ぬのです」　1431年と1456年
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N11（朝の旧市場の広場の遠景。石畳と、まだ誰もいない広場。人物なし）→ 後半は N12（大聖堂の中。机と書類）
    year: 1431
    lines:
      # fact: jeanne-16
      - 語り: 5月30日の朝。ドミニコ会士のマルタン・ラドヴニュは、牢のジャンヌに、その日、死刑になることを告げます。同じ牢にいたジャン・トゥトムイエが、1450年3月5日に、その場を証言しています。
        card: {head: "5月30日の朝", body: トゥトムイエの証言（1450年）}
      # fact: jeanne-16
      - 語り: 知らせを聞いたジャンヌは、取り乱し、訴えたといいます。教会の牢にいたなら、こうは、ならなかった、と。
        tone: 重い
      # fact: jeanne-16
      - 語り: そこへ、司教コーションが来ます。ジャンヌは、すぐに、こう言ったそうです。「司教さま、わたしは、あなたのせいで死ぬのです」。
        tone: 重い
      # fact: jeanne-16
      - 語り: 司教は、こう返した、と言います。「ジャンヌ、辛抱しなさい。あなたが死ぬのは、約束を守らず、もとの悪事に戻ったからだ」。
      # fact: jeanne-16
      - 語り: ジャンヌは、答えます。「教会の牢に入れ、ふさわしい教会の見張りに任せていたなら、こうは、ならなかった。このことで、あなたを、神の前に呼びます」。
        tone: 重い
      # fact: jeanne-01
      - 語り: この日、ルーアンの旧市場の広場で、ジャンヌは、処刑されました。19歳ほどでした。
        tone: 重い
        pause: 1.0
      # fact: jeanne-19
      - 語り: それから19年。1450年2月13日。ノルマンディーを取り戻した、フランス王シャルル7世は、ギヨーム・ブイエに、調べを命じます。3月4日と5日、ルーアンで、7人が証言しました。
        card: {head: "1450年2月13日", body: 国王が調べを命じる}
      # fact: jeanne-19
      - 語り: 1902年に、この記録を英語に訳したT・D・マレーは、こう説明します。シャルル7世は、自分の戴冠を助けた少女が、異端だと言われたままでは、自分の正統性が、疑われると、考えた、と。
      # fact: jeanne-19
      - 語り: ただし、この調べは、国王の命によるもので、のちの、正式な復権の記録には、入れられませんでした。
        tone: しみじみ
      # fact: jeanne-20
      - 語り: 1455年11月7日。パリのノートルダム。ジャンヌの母イザベルと、兄弟が、教皇カリクストゥス3世の許しを携えて、判決の見直しを請願します。母は、教皇の書状を示し、声をあげて泣いた、とマレーは書いています。
        card: {head: "1455年11月7日", body: 母イザベルが再審を請願}
      # 【想像2】イザベル。記録：母が泣きながら教皇の書状を示し、真実と正義だけを求めた（マレー訳・解説）。気持ちだけ
      - 人物: 「……あの子の名を、返してください」
        who: イザベル想像
        imagined: true
        tone: しみじみ
      # fact: jeanne-20
      - 語り: 1456年7月7日、ルーアンの大司教館。復権の判決が、読み上げられます。
      # fact: jeanne-20
      - 語り: 判決は、こう言います。12箇条は、偽って抜き出された。有利な答えは省かれ、訳も、誤っていた。「破り捨てよ」と。
        card: {head: "1456年7月7日", body: 12箇条は偽り、破り捨てよ}
      # fact: jeanne-20
      - 語り: 「再犯」の判決も、5月24日の誓約も、処刑も、すべて、「無効」。ジャンヌと家族に、汚名は残らない、と宣言されました。
      # fact: jeanne-21
      - 語り: ただし、この裁判には、からくりがありました。訴えの相手は、すでに亡くなっていた、司教コーションと、検事デスティヴェ。陪席した神学者たちは、相手から、外されていた。マレーは、これを、「法の上のつくりごと」と呼んでいます。
        tone: 重い
      # fact: jeanne-21
      - 語り: 責める相手は、亡くなった人だけ。だから、誰も、傷つかずに済んだ。復権は、そういう形で、成りました。
        tone: しみじみ
        hook: true
      - 語り: では、ジャンヌが遺した、と言われた物は、今、どこにあるのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 遺物と指輪
  - title: 「ジャンヌの遺物」は、エジプトのミイラだった　2007年と2016年
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N13（古い薬壜と棚。ラベルは描かない。人物なし）／ N14（小さな指輪が布の上に。文字は描かない）
    year: 2007
    lines:
      # fact: jeanne-22
      - 語り: ジャンヌの死後、集められたと言われる、肋骨と、布と、猫の骨がありました。薬剤師が保管し、1867年に、トゥール大司教区に渡されます。「ジャンヌの遺物」として、です。
        card: {head: "「ジャンヌの遺物」", body: 肋骨・布・猫の骨}
      # fact: jeanne-22
      - 語り: 2007年。フィリップ・シャルリエを中心とする、20人ほどの研究チームが調べた結果は、意外なものでした。肋骨は、紀元前7世紀から3世紀の、エジプトのミイラの骨。猫の骨も、同じ時代のミイラでした。
        tone: 強調
        card: {head: "2007年の分析", body: エジプトのミイラと猫の骨}
      # fact: jeanne-22
      - 語り: 調香師たちが、においを確かめ、調べの手がかりにした、と、AP通信は伝えています。遺伝子は、取り出せませんでした。
      # fact: jeanne-22
      - 語り: 研究は、2010年、学術誌『フォレンジック・サイエンス・インターナショナル』に載りました。「シノンの瓶」と呼ばれた品の、総合的な分析です。
      # fact: jeanne-23
      - 語り: もうひとつ、指輪があります。1431年の尋問で、ジャンヌは、こう語っていました。「『ジェズス・マリア』の名が、刻んであったと思います。石は、付いていません」。
        card: {head: "裁判記録の指輪", body: 「ジェズス・マリア」と刻んだ指輪}
      # fact: jeanne-23
      - 語り: 2016年2月、競売会社タイムライン・オークションズで、ジャンヌの物だと言われる指輪が、およそ41万ドルで落札されました。買ったのは、フランスのテーマパーク、ピュイ・デュ・フーです。
      # fact: jeanne-23
      - 語り: ただし、「ヒストリー・ブログ」は、こう書きます。1431年から1914年まで、この指輪に触れる記録は、ない、と。オルレアン市も、ルーアンの展示館も、専門家の助言で、入札しなかった、と。
        tone: しみじみ
      - 語り: 顔も、遺骨も、指輪も、確かめられるものは、なかなか、見つかりません。残っているのは、書類です。
        tone: しみじみ
        hook: true
      - 語り: その書類は、結局、何を語るのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：紙の上の十字　1431年と1456年
    background: {image: paintings/jeanne_vigiles_compiegne_c1484.jpg, credit: "『シャルル7世の通夜』の挿絵（マルシャル・ドーヴェルニュ、1484年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：N01（朝の墓地。石の十字架。人物なし）→ N15（終了画面用）
    year: 1456
    lines:
      # 答え
      - 語り: ジャンヌは、許された6日後に、処刑されました。記録の上の理由は、2つ、並んでいました。男の服に戻ったこと。そして、声がまた聞こえる、と答えたこと。
      # fact: jeanne-10, jeanne-12, jeanne-13, jeanne-14
      - 語り: 服については、本人は「自分の意志」。証人は、「取り上げられた」「襲われかけた」「置かれていた」。25年たっても、食い違ったままです。
      # fact: jeanne-15, jeanne-20
      - 語り: 確かなのは、ジャンヌが、教会の牢ではなく、イングランド兵の見張る牢にいたこと。そして、1456年に、その裁判が、すべて無効になったことです。
        tone: しみじみ
      # fact: jeanne-09
      - 語り: ジャンヌの顔は、書記が余白に描いた、小さな絵が、1枚。残ったのは、記録でした。
        tone: しみじみ
        portrait: {image: paintings/jeanne_lefranc_champion_des_dames_c1451.jpg, caption: "『貴婦人の擁護者』の挿絵（1451年ごろ。ジャンヌの死の20年ほどあとに描かれた絵）"}
      # 結び：なぜの答え
      # fact: jeanne-02
      - 語り: 墓地で、紙の上に書かれた、十字。あれは、助かりたい少女の、祈りだったのか。それとも、追い詰められた少女の、最後の、抵抗だったのか。
        tone: しみじみ
        pause: 0.8
        portrait: null
      - 語り: 許された、6日後。紙の上には、十字だけが、残っています。
        tone: しみじみ
        pause: 0.8

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
        # AI絵：N15（終了画面用。夕暮れの石畳の広場。右半分を空ける）

