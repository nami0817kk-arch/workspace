# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  ジャンヌ・ダルクは、一度、許されていました。1431年5月24日、ルーアンの墓地で誓約書に署名し、判決は終身の牢に変わります。処刑されたのは、その6日後です。
  記録によれば、その間に、ジャンヌは男の服に戻っていました。本人は「自分の意志で」と答え、25年ほどあとの証人たちは、まるで違う話をします。
  服は、本当に決め手だったのか。裁判記録と、19年から25年あとの証言を並べて読みます。
  この動画でわかること
  ・1430年7月14日の要求書に書かれた「6000フラン」と「1万フラン」
  ・誓約書の長さ――裁判記録の長い文と、「6、7行」と証言した3人
  ・男の服に戻った理由を、4つの記録がどう語るか
  ・欄外に「致命的な答え」と書かれた、ジャンヌの一言
  ・1456年の判決と、「法の上のつくりごと」
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（1431年の裁判記録、1450〜56年の復権のための証言、1456年の判決文、ケシュラ版の史料集、マレー訳の英訳本など）を語りで示してから読んでいます。
  証言は事件の19〜25年あとのもので、語る人の立場や記憶によって食い違います。食い違いは、決着させずにそのまま並べています。
  ジャンヌの生前の絵は、パリ高等法院の書記が1429年に記録の余白に描いた1枚しか知られていません（本人を見ずに描いたとされます）。

en:
  title: "Joan of Arc: Forgiven, Then Executed Six Days Later. The Trial Record vs. Witnesses 25 Years On"
  description: |-
    Joan of Arc was forgiven once. On 24 May 1431, in a cemetery in Rouen, she signed a paper, and her sentence became life in prison. She was executed six days later.
    The trial record says that in between she had put on men's clothes again. She said she did it of her own will. Witnesses who spoke 19 to 25 years later told very different stories.
    Was the clothing really the deciding point? We read the trial record against the later testimony.
    In this video you will learn:
    - The two sums in the bishop's demand of 14 July 1430: 6,000 francs, and 10,000 francs
    - How long was the paper she signed? A long text in the record, "six or seven lines" said three witnesses
    - Four accounts of why she put the men's clothes back on
    - The answer that a clerk marked in the margin as "deadly"
    - The judgment of 1456, and what a translator called a "legal fiction"
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Forgiven, Then Executed Six Days Later: Rouen, May 1431"
    - "Sold to the English: Compiègne to Rouen, 1430"
    - "Not the Church's Prison: The Trial at Rouen, 1431"
    - "Sign and You Will Be Saved: Saint-Ouen, 24 May"
    - "Did She Put Them On of Her Own Will? The Clothes, 27-30 May"
    - "Bishop, I Die Through You: 30 May, and the Retrial of 1456"
    - "A Mummy and a Cat: The Relics, 2007, and a Ring, 2016"
    - "Summary: What Was Left Was Paper"

