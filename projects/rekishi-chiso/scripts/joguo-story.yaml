        figure: {type: stats, title: 太子が亡くなった日　記録の違い, items: [[日本書紀, 621年2月5日, 推古29年の夜中], [帝説・光背銘, 622年2月22日, 壬午の年], [天寿国繍帳の銘, 622年2月22日, 夜中]], upto: 3}
      # fact: joguo-32
      - 語り: その繍帳の銘で、妻の橘大郎女は、夫が語っていた言葉を、引いています。
        figure: null
      # fact: joguo-32
      - 語り: 世の中は、むなしい仮のもの。ただ仏だけが、まことだ。
        tone: しみじみ
        card: {head: "天寿国繍帳の銘", body: 世間虚仮　唯仏是真}
      # fact: joguo-40
      - 語り: 太子は、先に亡くなった母の宮を、尼寺に改めた、と伝わります。斑鳩に残る、いまの中宮寺です。
      # fact: joguo-33
      - 語り: 近くの法起寺の塔の露盤には、こんな銘があったと伝わります。太子は臨終のとき、山背に命じて、自分の岡本の宮を、寺にするよう願った。
      # fact: joguo-33
      - 語り: 寺には、大和の田12町と、近江の田30町を、施すように。銘によれば、それが、太子の最期の頼みでした。
      # fact: joguo-33
      - 語り: そして638年、僧の福亮が、弥勒の像と金堂を造った、と銘は続けています。山背が生きていた間に、父の願いは、形になり始めていたのです。
        tone: しみじみ
      # fact: joguo-39
      - 語り: 同じ斑鳩の法輪寺には、太子が病んだとき、山背と、その子の由義王が、治るよう願って建てた、という伝えがあります。百済から来た人たちが建てた、という別の伝えもあります。
      - 語り: 太子が残した14人の子。父の最期の願いを託された長男、山背大兄王が、一族を率いることになります。
      - 語り: そして太子の死から6年。天皇の座が、空きます。
        hook: true
      - 語り: その座に、山背の名が、挙がりました。
        tone: 重い
        hook: true

  # ================================================================ 第2章 空いた天皇の座（628〜629）
  - title: 空いた天皇の座と、「叔父の本心」　628年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 628
    lines:
      # fact: joguo-18
      - 語り: 推古36年、628年の3月。推古天皇が亡くなります。その年の9月、葬儀が終わっても、次の天皇は決まりません。大臣の蘇我蝦夷は、群臣を自分の家に集めて、話し合いました。
        card: {head: "628年3月", body: 推古天皇が亡くなる}
      - 語り: 名が挙がったのは、2人。田村皇子と、山背大兄王です。
      # fact: joguo-19, joguo-24
      - 語り: 蝦夷は、山背の母のきょうだい。書紀の中で、山背は、蝦夷を、叔父と呼んでいます。
        figure: {type: people, title: 蘇我と上宮王家の家系図, nodes: [[蘇我馬子, 大臣], [蘇我蝦夷, 馬子の子], [刀自古郎女, 馬子の娘], [山背大兄王, 太子の長男], [蘇我入鹿, 蝦夷の子]], edges: [[蘇我馬子, 蘇我蝦夷, 子], [蘇我馬子, 刀自古郎女, 子], [刀自古郎女, 山背大兄王, 子], [蘇我蝦夷, 蘇我入鹿, 子], [山背大兄王, 蘇我入鹿, いとこ]], upto: 4}
      # fact: joguo-24, joguo-30
      - 語り: そして蝦夷の子が、入鹿。入鹿と山背は、同じ祖父、蘇我馬子を持つ、いとこどうしでした。
        figure: {type: people, title: 蘇我と上宮王家の家系図, nodes: [[蘇我馬子, 大臣], [蘇我蝦夷, 馬子の子], [刀自古郎女, 馬子の娘], [山背大兄王, 太子の長男], [蘇我入鹿, 蝦夷の子]], edges: [[蘇我馬子, 蘇我蝦夷, 子], [蘇我馬子, 刀自古郎女, 子], [刀自古郎女, 山背大兄王, 子], [蘇我蝦夷, 蘇我入鹿, 子], [山背大兄王, 蘇我入鹿, いとこ]], upto: 5}
      # fact: joguo-19
      - 語り: 『日本書紀』によれば、山背は、使いを出して、蝦夷に、こう問いただしました。叔父は、田村皇子を天皇にしたいと聞いた。叔父の本心を、はっきり知りたい。
        figure: null
        card: {head: "日本書紀　舒明即位前紀", body: 叔父の本心を知りたい}
      # fact: joguo-19
      - 語り: これに対して、群臣の側が山背に伝えた、天皇の最期の言葉は、こうでした。お前はまだ未熟だ。騒ぎ立てず、群臣の言うことに従え。
      # fact: joguo-19
      - 語り: 山背は、言い返します。天皇が病に伏したと聞いて、私は駆けつけ、門の下に控えて、天皇の言葉を、じかに聞いたのだ。
        tone: 強調
      - 語り: 同じ天皇の最期の言葉が、山背と、群臣とで、違って伝わっていたのです。
        tone: しみじみ
      # fact: joguo-20
      - 語り: 群臣の中で、山背を推す者がいました。蘇我の一族の、境部摩理勢です。
      # fact: joguo-20
      - 語り: 摩理勢は、蝦夷に従わず、斑鳩へ移って、泊瀬王という王の宮に、身を寄せます。
      # fact: joguo-20
      - 語り: ところが、その泊瀬王が、急な病で亡くなります。
        tone: 重い
      # fact: joguo-20
      - 語り: 蝦夷は、兵を送りました。摩理勢は、子とともに、首を絞められて殺された、と書紀は書いています。
        tone: 重い
      # fact: joguo-20
      - 語り: もう一人の息子は、山の中へ逃れて、そこで、自ら命を絶った、とあります。山背を推した一家は、こうして、消えました。
        tone: 重い
      # fact: joguo-21
      - 語り: 翌年、629年の正月4日。天皇のしるしが、田村皇子に差し出されます。皇子は一度は断りましたが、群臣が重ねて願い、その日のうちに、即位しました。舒明天皇です。
        card: {head: "629年正月", body: 田村皇子が即位　舒明天皇}
      # fact: joguo-30
      - 語り: このときの傷は、15年後まで残りました。藤原氏の家の伝記、『藤氏家伝』は、入鹿の言葉として、こう書いています。
      # fact: joguo-30
      - 語り: 山背は、わが家の生まれで、徳もある。けれど、舒明天皇が立つとき、叔父と甥の間に、すき間ができた。境部摩理勢を殺したことで、恨みは深い。
        tone: 強調
        card: {head: "藤氏家伝", body: 叔父と甥の間にすき間}
      - 語り: 山背は、蘇我の血を引く王でした。そして、蘇我にとって、いちばん思い通りにならない王でもありました。
        tone: しみじみ
      - 語り: やがて舒明天皇も亡くなり、皇后が、天皇の位に就きます。皇極天皇です。
      - 語り: その年、蘇我の親子は、自分たちのための、大きな墓を造り始めます。
        hook: true
      - 語り: その工事に駆り出された民の中には、思いがけない一族の民も、まじっていました。
        tone: 重い
        hook: true

  # ================================================================ 第3章 天に二つの日なし（642〜643）
  - title: 「天に二つの日なし」　642年、蘇我の墓
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 642
    lines:
      # fact: joguo-15
      - 語り: 皇極元年、642年。『日本書紀』によれば、蝦夷は、国中の民と、多くの豪族の民を集めて、今来という地に、2つ並んだ墓を、前もって造らせます。
        card: {head: "642年", body: 今来に2つ並んだ墓}
      # fact: joguo-15
      - 語り: 大きい方は、蝦夷の墓。小さい方は、息子の入鹿の墓です。
      # fact: joguo-15
      - 語り: 書紀は、この2つを、大陵、小陵と書いています。陵は、本来、天皇の墓を呼ぶ言葉です。
        tone: 強調
      # fact: joguo-15
      - 語り: そして蝦夷は、さらに、上宮の乳部の民まで、残らず集めて、墓の工事に使いました。
        tone: 強調
      - 語り: 乳部とは、太子の一族の暮らしを支えるために置かれた民です。上宮王家の、いわば、手足でした。
      # fact: joguo-16
      - 語り: これに、上宮の家の、ひとりの姫が憤ります。
      # fact: joguo-16
      - 語り: 蘇我の臣は、国の政を、思うままにして、無礼なことが多い。天に二つの日は無く、国に二人の王は無い。なぜ、私たちの民を、勝手に使うのか。
        tone: 強調
        card: {head: "日本書紀　皇極元年", body: 天に二つの日無く　国に二の王無し}
      # fact: joguo-16
      - 語り: この姫が誰なのか、書紀ははっきりとは書いていません。ただ、書紀は、ここから恨みが結ばれ、ついには、どちらも滅んだ、と続けています。
        tone: しみじみ
      # fact: joguo-17
      - 語り: 翌年、皇極2年、643年の10月。書紀は、入鹿が、ひとりで謀った、と書きます。
        card: {head: "643年10月", body: 入鹿がひとりで謀る}
      # fact: joguo-17
      - 語り: 上宮の王たちを退けて、古人大兄皇子を、天皇に立てよう。
        tone: 重い
      - 語り: 古人大兄は、舒明天皇の子で、母は蘇我馬子の娘。入鹿にとっては、山背と同じく、いとこにあたる皇子です。
        figure: {type: people, title: 天皇の座をめぐる家系図, nodes: [[舒明天皇, 田村皇子], [皇極天皇, 舒明の皇后], [古人大兄皇子, 舒明の子・母は蘇我], [山背大兄王, 太子の長男], [軽王, 皇極の弟]], edges: [[舒明天皇, 皇極天皇, 夫婦], [舒明天皇, 古人大兄皇子, 子], [皇極天皇, 軽王, 姉弟], [古人大兄皇子, 山背大兄王, 天皇の座]], upto: 3}
      - 語り: その前に立っていたのが、太子の長男、山背大兄王です。
        tone: しみじみ
        figure: {type: people, title: 天皇の座をめぐる家系図, nodes: [[舒明天皇, 田村皇子], [皇極天皇, 舒明の皇后], [古人大兄皇子, 舒明の子・母は蘇我], [山背大兄王, 太子の長男], [軽王, 皇極の弟]], edges: [[舒明天皇, 皇極天皇, 夫婦], [舒明天皇, 古人大兄皇子, 子], [皇極天皇, 軽王, 姉弟], [古人大兄皇子, 山背大兄王, 天皇の座]], upto: 4}
      - 語り: その翌月。斑鳩へ向かって、兵が動きます。
        hook: true

  # ================================================================ 第4章 斑鳩の11月（643）
  - title: 643年11月、斑鳩の宮に火が放たれた
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 643
    lines:
      # fact: joguo-01
      - 語り: 643年、11月の1日。『日本書紀』によれば、入鹿は、巨勢徳太らに兵を預けて、斑鳩の山背大兄王たちを、襲わせました。
        card: {head: "643年11月1日", body: 入鹿の兵が斑鳩へ}
      # fact: joguo-02
      - 語り: 宮を守ったのは、一人の奴と、数十人の舎人たち。矢を放って、防ぎ戦います。
      # fact: joguo-02
      - 語り: 攻め手の将の一人は、その矢に当たって、命を落としました。
        tone: 強調
      # fact: joguo-03
      - 語り: その間に、山背は、馬の骨を、寝所に投げ入れておきます。そして、妃と子どもたちを連れて、すきを見て、宮を抜け出しました。
        tone: 強調
      # fact: joguo-03
      - 語り: 逃れた先は、斑鳩の北西にそびえる、胆駒の山。いまの、生駒山です。
      # fact: joguo-04
      - 語り: 攻め手は、斑鳩の宮に、火を放ちました。焼け跡の灰の中に、骨が見つかります。
        tone: 重い
      # fact: joguo-04
      - 語り: 王は死んだ。そう思い込んだ兵たちは、囲みを解いて、引き上げていきました。
      - 語り: 灰の中の骨は、おそらく、あの馬の骨でした。一族の命は、いったんは、つながったのです。
        tone: しみじみ
      # fact: joguo-05
      - 語り: けれど、山の中には、食べるものが、ありません。一族は、4日か5日、山にとどまった、とあります。
        tone: 重い
      # fact: joguo-06
      - 語り: このとき、家臣の三輪文屋君が、こう勧めます。
      # fact: joguo-06
      - 語り: 深草の屯倉へ移り、そこから馬で、東の国へ向かいましょう。乳部の民をもとに兵を起こし、戻って戦えば、必ず勝てます。
        tone: 強調
        card: {head: "三輪文屋君の勧め", body: 東の国で兵を起こす}
      # fact: joguo-07
      - 語り: 山背の答えは、『日本書紀』に、こう残っています。
      # fact: joguo-07
      - 語り: お前の言うとおりにすれば、勝つだろう。けれど私は、これから10年は、民を使うまいと、心に決めている。自分ひとりのために、どうして、多くの民を苦しめられようか。
        tone: しみじみ
        card: {head: "日本書紀　皇極2年11月", body: 十年百姓を役わじ}
      # fact: joguo-08
      - 語り: そのころ、入鹿は、天皇の宮を守る役の者に、山へ行って王を捕えよ、と命じています。けれど、その者は、宮を守る役だから外へは出られない、と断りました。
      # fact: joguo-09
      - 語り: 入鹿が自ら山へ向かおうとすると、古人大兄皇子が、こう言って止めます。
      # fact: joguo-09
      - 語り: ねずみは、穴にひそんで生き、穴を失って死ぬ。
        tone: 強調
      - 語り: 都を離れるな、という忠告でした。
      # fact: joguo-10
      - 語り: やがて、山背たちは、山を下ります。向かったのは、斑鳩の寺。いまの、法隆寺のもとになった寺です。
      # fact: joguo-37
      - 語り: その寺が建っていたのは、いまの法隆寺の伽藍の南東、若草伽藍と呼ばれる場所です。
      # fact: joguo-10
      - 語り: 兵たちは、すぐに、寺を取り囲みました。
        tone: 重い
      # fact: joguo-11
      - 語り: 山背は、三輪文屋君を使いに出して、攻め手の将たちに、こう伝えさせます。
      # fact: joguo-11
      - 語り: この身ひとつのために、民を傷つけたくはない。この身を、入鹿に与えよう。
        tone: 重い
      # fact: joguo-12
      - 語り: そして山背は、子や弟たち、妃たちとともに、一度に、自ら命を絶ちました。
        tone: 重い
        pause: 0.6
      # fact: joguo-13
      - 語り: そのとき、空には、五色の旗と天蓋が、輝いて現れ、さまざまな楽の音が、寺の上に、降りてきた、と書紀は書いています。
        tone: しみじみ
      # fact: joguo-13
      - 語り: 人々は空を仰ぎ、入鹿に、あれを見よと指さします。けれど、入鹿が見上げると、旗は、黒い雲に変わっていました。
        tone: 強調
      # fact: joguo-14
      - 語り: 知らせを聞いた父の蝦夷は、怒って、こう罵った、とあります。ああ、入鹿。ひどく愚かで、乱暴なことばかりする。お前の命も、危ういではないか。
        tone: 重い
        card: {head: "蝦夷の言葉", body: お前の命も危うい}
      - 語り: 書紀を読む限り、悪いのは、入鹿ひとり。父の蝦夷さえ、それを叱っています。
        hook: true
      - 語り: けれど、別の記録は、襲った側に、その蝦夷の名を、挙げているのです。
        tone: 強調
        hook: true

  # ================================================================ 第5章 誰が、何人を（食い違い②③）
  - title: 襲ったのは誰か、亡くなったのは何人か　3つの記録
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 643
    lines:
      # fact: joguo-30
      - 語り: まず、誰が襲ったか。さきほどの『藤氏家伝』は、その年の10月、入鹿が、何人かの皇子たちと、ともに謀った、と書いています。
        figure: {type: stats, title: 誰が襲ったのか　記録の違い, items: [[日本書紀, 入鹿がひとりで謀る, 蝦夷は入鹿を叱る], [藤氏家伝, 入鹿が皇子たちと謀る, 10月], [補闕記, 6人の名を挙げる, 蝦夷と軽王も]], upto: 2}
      # fact: joguo-28
      - 語り: もっとはっきり名を挙げるのが、『上宮聖徳太子伝補闕記』です。太子の伝えを補うために、のちにまとめられた書です。
        figure: {type: stats, title: 誰が襲ったのか　記録の違い, items: [[日本書紀, 入鹿がひとりで謀る, 蝦夷は入鹿を叱る], [藤氏家伝, 入鹿が皇子たちと謀る, 10月], [補闕記, 6人の名を挙げる, 蝦夷と軽王も]], upto: 3}
      # fact: joguo-28
      - 語り: 補闕記は、悪い企てを起こしたのは6人だ、と書き、その名を並べます。
        figure: null
      # fact: joguo-28
      - 語り: 蘇我の大臣、つまり蝦夷。そして入鹿。巨勢徳太。ほかに豪族が2人。そして、軽王。
        tone: 強調
        card: {head: "補闕記が挙げる6人", body: 蝦夷・入鹿・軽王ほか}
      # fact: joguo-41
      - 語り: 軽王は、皇極天皇の弟。のちに天皇の位に就く、孝徳天皇です。
        tone: 強調
        figure: {type: people, title: 天皇の座をめぐる家系図, nodes: [[舒明天皇, 田村皇子], [皇極天皇, 舒明の皇后], [古人大兄皇子, 舒明の子・母は蘇我], [山背大兄王, 太子の長男], [軽王, 皇極の弟]], edges: [[舒明天皇, 皇極天皇, 夫婦], [舒明天皇, 古人大兄皇子, 子], [皇極天皇, 軽王, 姉弟], [古人大兄皇子, 山背大兄王, 天皇の座]]}
      # fact: joguo-41
      - 語り: 歴史学者の佐藤長門さんは、2016年の本『蘇我大臣家』で、この襲撃を、入鹿ひとりの企てではなく、蝦夷や軽王たちが組んで動いたもの、とみています。
      - 語り: 書紀では入鹿を叱った蝦夷が、別の記録では、襲った側にいる。どちらが本当なのか、記録だけでは、決められません。
        tone: しみじみ
      # fact: joguo-26, joguo-28
      - 語り: もう1つは、亡くなった人の数と、その日です。
        figure: null
      - 語り: 『日本書紀』は、子や弟、妃たち、と書くだけで、数を挙げていません。
        figure: {type: stats, title: 亡くなったのは何人か　記録の違い, items: [[日本書紀, 数を書かない, 11月1日に兵を送る], [帝説, 15人, 10月14日], [補闕記, 23人, 11月11日の夜]], upto: 1}
      # fact: joguo-26
      - 語り: 帝説は、643年の10月14日、入鹿が、山背と、その兄弟ら、合わせて15人の王子を、ことごとく滅ぼした、と書きます。
        figure: {type: stats, title: 亡くなったのは何人か　記録の違い, items: [[日本書紀, 数を書かない, 11月1日に兵を送る], [帝説, 15人, 10月14日], [補闕記, 23人, 11月11日の夜]], upto: 2}
      # fact: joguo-26, joguo-01
      - 語り: 書紀が、兵を送ったと書く11月1日より、半月あまりも早い日付です。
      # fact: joguo-28
      - 語り: 補闕記は、11月11日の夜、亥の刻。罪のない、太子の子と孫、男女23人が殺された、とします。
        figure: {type: stats, title: 亡くなったのは何人か　記録の違い, items: [[日本書紀, 数を書かない, 11月1日に兵を送る], [帝説, 15人, 10月14日], [補闕記, 23人, 11月11日の夜]], upto: 3}
      # fact: joguo-29
      - 語り: 補闕記に並ぶ名を数えると、子の世代が15人、そして、孫が8人。合わせて23人です。
        figure: {type: people, title: 補闕記が挙げる23人, nodes: [[聖徳太子, 622年に死去], [子の世代, 15人], [孫, 8人]], edges: [[聖徳太子, 子の世代, 子], [子の世代, 孫, 子]], cross: [子の世代, 孫]}
      # fact: joguo-29
      - 語り: 名の下には、蘇、膳、橘と、母の家の一文字が添えられている写本もあります。どの妻の子なのか。補闕記もまた、母の家ごとに分かる形で、一族を書き留めていました。
        figure: null
      # fact: joguo-29
      - 語り: ただ、その子の世代の中には、殖栗王、茨田王など、帝説の、太子の14人の子の一覧には無い名も、入っています。
      - 語り: 数え方が違えば、数も変わります。それでも、どの記録も、斑鳩の一族は、そこで終わったと、書いているのです。
        tone: しみじみ
      - 語り: 一族が消えて、2年後。
        hook: true
      - 語り: 今度は、襲った側に、番が回ってきます。
        tone: 重い
        hook: true

  # ================================================================ まとめ（その後の斑鳩→答え→冒頭に戻る）
  - title: まとめ：聖徳太子の一族は、なぜ絶えたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 645
    lines:
      # fact: joguo-26
      - 語り: 斑鳩の日から、2年後。帝説によれば、乙巳の年の6月11日、のちの天智天皇が、入鹿を殺します。そして翌日、蝦夷の一族も、滅びました。
        card: {head: "645年6月", body: 入鹿が殺される}
      # fact: joguo-41
      - 語り: そしてこのあと、天皇の位に就いたのが、軽王。補闕記が、斑鳩を襲った側に名を挙げた、あの王でした。
        tone: 強調
      # fact: joguo-36
      - 語り: 斑鳩の寺も、無事ではありませんでした。670年、法隆寺は火事で焼けた、と書紀は書いています。
      # fact: joguo-37
      - 語り: 創建のころの寺の跡、若草伽藍。その近くの溝の跡から、2006年、焼け焦げた壁画のかけらが、およそ80点見つかった、と斑鳩町の教育委員会が発表しました。
        card: {head: "若草伽藍", body: 焼けた壁画のかけら　約80点}
      # fact: joguo-36
      - 語り: 2024年には、寺の南を区切るとみられる溝が見つかり、焼けた壁土のかけらも出てきました。670年の火事の記事と合う、と報じられています。
      # fact: joguo-34
      - 語り: 一族が暮らした斑鳩の宮の跡は、いま、法隆寺の東院の下にあります。昭和9年からの修理に伴う発掘で、掘立柱の建物が何棟も見つかりました。
        card: {head: "斑鳩宮の跡", body: 法隆寺東院の下}
      # fact: joguo-35
      - 語り: その上に建つのが、八角形のお堂、夢殿です。遅くとも761年までには、建てられていました。宮が焼けてから、100年あまりのうちのことです。
      # fact: joguo-35
      - 語り: 夢殿には、東院を開いた僧、行信の像が、いまも残されています。
      # fact: joguo-33
      - 語り: 太子が臨終に、山背へ託した宮は、法起寺になりました。銘によれば、その塔の露盤が作られたのは、706年。一族が絶えて、60年あまりのちのことです。
      - 語り: 聖徳太子の一族は、なぜ、絶えたのか。
        tone: 疑問
        pause: 0.6
      - 語り: 山背は、蘇我の血を引きながら、蘇我の思い通りにならない王でした。摩理勢の一件で、叔父と甥の溝は、埋まらなかった。そして、蘇我が立てたい皇子の前に、山背が立っていた。
        tone: しみじみ
      - 語り: そして一族は、一族の中で結ばれ、斑鳩に集まって暮らしていた。最後は、子も孫も、同じ寺で、命を絶った。
        tone: しみじみ
      - 語り: 逃げて戦う道は、ありました。けれど山背は、民を戦に巻き込まない方を、選びました。
        tone: しみじみ
      - 語り: そして、記録によっては、襲った側には、入鹿だけでなく、その父や、のちの天皇の名まで、並んでいます。
        tone: しみじみ
        pause: 0.6
      - 語り: 643年の冬、斑鳩の寺で、太子の子と孫たちは、ともに命を絶ちました。逃げれば勝てた、と言われながら、山を下りた一族でした。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
