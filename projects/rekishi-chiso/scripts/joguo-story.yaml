# 1本に1つの問い＝「聖徳太子の一族は、なぜ絶えたのか」。主役は太子の子と孫（上宮王家）、軸は長子の山背大兄王。答えの席＝絶えた理由（題名でもサムネでも明かさない）。
#   太子は実在したか、の論争は扱わない。
#   冒頭＝感情の結末予告（643年、寺で子と孫が一度に命を絶った）→意外な一点（攻めた入鹿は山背のいとこ／逃げれば勝てると言われて戻った／15人か23人か／のちの天皇の名）→問い→かけら（14人の子・五色の旗）。
# 型の作り：序章／第1章 斑鳩の宮と14人の子（601〜622、食い違い①太子の死の年）／第2章 空いた天皇の座（628〜629）／第3章 天に二つの日なし（642〜643）／
#   第4章 斑鳩の11月（643）／第5章 誰が、何人を（食い違い②襲った側・③人数と日付）／まとめ その後の斑鳩→答え→冒頭に戻る。
# 計算（自分で計算し直した）：
#   太子の生まれ 甲午年＝574年、死 壬午年＝622年 → 622−574＋1＝数え49（帝説の「生四十九年」と合う）。
#   書紀の死は推古29年＝621年2月5日、銘文は622年2月22日 → 1年と17日のずれ（年が1つ違う）。
#   斑鳩に宮を興したのは推古9年＝601年、移り住んだのは推古13年＝605年。601→643＝42年。605→643＝38年。
#   太子の死 622 → 襲撃 643＝21年。推古の死 推古36年＝628年。舒明の即位 舒明元年＝629年。皇極元年＝642年、皇極2年＝643年。
#   太子の子：刀自古郎女4＋菩岐々美郎女8＋橘大郎女（位奈部橘王）2＝14（帝説「合聖王兒十四王子」）。山背と舂米女王の子＝7人（帝説の列挙を数えた）。
#   補闕記の死者＝子の世代15＋御孫8＝23（「男女廿三王」）。帝説＝15王子。書紀＝人数を書かない（子弟妃妾）。
#   日付：帝説 癸卯年10月14日／書紀 11月1日（十一月丙子朔）に兵を遣わす／補闕記 11月11日の亥の刻。家伝の謀は10月。
#   胆駒山に4〜5日。乙巳の変 帝説は乙巳年6月11日、書紀は6月12日 → 1日のずれ。643年11月→645年6月＝1年7か月（「2年後」）。
#   法隆寺の火災 天智9年＝670年 → 643から27年。東院 天平11年＝739年（縁起）→ 643から96年、資財帳 天平宝字5年＝761年 → 643から118年。
#   法起寺の露盤 丙午年＝706年 → 太子の死から84年。若草伽藍の壁画片 2006年に約80点。若草伽藍の溝 2024年2月29日発表。1400年遠忌 2021年。643→2026＝1383年。
# 記録の食い違い：①太子の死（書紀 621年2月5日／帝説・光背銘・繍帳銘 622年2月22日）
