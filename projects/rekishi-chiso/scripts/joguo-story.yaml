# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  643年の冬。奈良の斑鳩の寺で、聖徳太子の子と孫たちが、一度に命を絶ちました。
  兵を差し向けたのは蘇我入鹿。けれど一族の長、山背大兄王の母は蘇我馬子の娘で、入鹿にとって山背はいとこでした。東の国へ逃げれば勝てる、と勧められながら、山背は寺へ戻ってきます。
  聖徳太子の一族は、なぜ絶えたのか。『日本書紀』と『上宮聖徳法王帝説』『上宮聖徳太子伝補闕記』『藤氏家伝』、法隆寺の銘文、発掘の報告を並べて、家系図でたどりました。
  この動画でわかること
  ・太子の14人の子と、一族の中で結ばれた夫婦
  ・太子の死の年が、記録で1年違うこと
  ・推古天皇の死のあと、山背大兄王が天皇になれなかった経緯
  ・643年11月、斑鳩で起きたことの一部始終
  ・襲った側と、亡くなった人数が、記録ごとに違うこと
description_note: |-
  襲撃の場面は『日本書紀』皇極天皇2年11月条によります。太子の子と孫の名と数は『上宮聖徳法王帝説』と『上宮聖徳太子伝補闕記』、太子の死は法隆寺金堂の釈迦三尊像の光背銘と天寿国繍帳の銘、襲った側の別の書き方は『藤氏家伝』と、佐藤長門『蘇我大臣家』（2016年）を紹介した清武雄二さんの文（國學院雜誌、2017年）によります。斑鳩宮の跡と若草伽藍は、文化庁の文化遺産オンラインと斑鳩町教育委員会の発表を伝えた報道によります。
  年・年数・人数は、自分で計算し直したものです。人数は記録によって違うので、記録の名を言って数を並べています。
  画面の情景と人物の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真や肖像ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Family Tree: Why Did Prince Shotoku's Line Die Out? 14 Children and Ikaruga, 21 Years Later"
  description: |-
    In the winter of 643, at a temple in Ikaruga, Nara, the children and grandchildren of Prince Shotoku took their own lives together.
    The attacker was Soga no Iruka, yet the head of the family, Prince Yamashiro no Oe, was the son of a Soga mother and Iruka's own cousin. Urged to flee east and raise an army that would surely win, Yamashiro came back to the temple instead.
    Why did Prince Shotoku's family die out? We follow the Nihon Shoki, the Jogu Shotoku Hoo Teisetsu, the Hoketsuki, the Toshi Kaden, inscriptions at Horyuji, and excavation reports.
    In this video you will learn:
    - Prince Shotoku's 14 children, and marriages within the family
    - Why the records disagree on the year of Shotoku's death
    - How Yamashiro failed to become emperor after Empress Suiko died
    - What happened at Ikaruga in November 643
    - How the records differ on who attacked and how many died
    Scene images are AI-generated illustrations, not real photos or portraits. Japanese-language history video (Japanese audio).
  chapters:
    - "The Day the Family Ended"
    - "The Ikaruga Palace and 14 Children, 601-622"
    - "The Empty Throne, 628-629"
    - "No Two Suns in the Sky, 642-643"
    - "November 643 at Ikaruga"
    - "Who Attacked, and How Many Died?"
    - "Summary: Why Did the Family Die Out?"

