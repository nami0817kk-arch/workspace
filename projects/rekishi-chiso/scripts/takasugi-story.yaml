# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と yodo-story.yaml・hijikata-story.yaml の型）。高杉晋作。2026-10-29 下書き。
# 公開の予定は 10/31 19:00。
# 型：1本に1つの「なぜ」＝「なぜ高杉晋作の墓には、本人が書いた墓碑銘が刻まれなかったのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝高杉の墓石には「東行墓」の三文字しか刻まれていない（takasugi 墓石）。本人が書いた墓碑銘が碑になったのは2016年（没後150年）。
#   導入では答え（墓誌が見つかったのは葬儀の後だった）を言わず、最後の章で出す。
#   第1章 23歳の上海（千歳丸・『遊清五録』・内情探索録・孔子廟・五代才助・御殿山焼き討ち）／
#   第2章 身分を問わない奇兵隊は本当に身分を問わなかったか（通説の検証はこの章：東行の号・結成・2か月後の罷免・559名の身分・将軍暗殺計画の同志1人・野山獄・講和）／
#   第3章 80人で挙兵した夜（平尾山荘・墓誌を書いた直前・80人/80余人の食い違い・出発の言葉の食い違い・力士隊・新地会所・軍艦3隻・絵堂）／
#   第4章 軍艦を勝手に買った男の四境戦争（オテントー丸・大島口・小倉口・病・望東尼の救出・谷家）／
#   第5章 「おもしろきこともなき世を」は辞世だったのか（3つの記録の食い違い・命日の13日と14日・田中顕助の日記・埋葬）／
#   第6章 まとめ（墓石・墓誌が見つかった時・2016年・おうの・答え）→ 冒頭の三文字に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを表で並べたのは3か所：①辞世の句の成り立ち（南アルプス市立図書館 2012／山口県観光連盟／梅溪昇『人物叢書 高杉晋作』）
#   ②命日（辞典の14日／高杉晋作Museum の年表の13日午前2時）③功山寺の人数と出発の言葉（80名・80人・80多人／「肝っ玉」と「腕前」）。
#   ほかに語りだけで：奇兵隊の身分（士分格が約半分）、臨終に田中顕助が居合わせたか。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/高杉晋作_facts_20261029.yaml、takasugi-01〜）にあるものだけ。行の上に `# fact: takasugi-NN`。
#   カードに無い「誰でも知っている前置き」（1839年の生まれ・松下村塾・攘夷の期限と下関の砲撃・禁門の変・四国艦隊との戦い・五卿・長州征討・27歳で亡くなる）は短く使い、# fact を付けない。
#   出どころが1つで開いた頁も1つのもの（墓誌を書いた書状・教法寺事件・将軍暗殺計画・賠償金300万ドル）は「と紹介しています」「と書いています」で言う。
#   梅溪昇『人物叢書 高杉晋作』は本そのものを開いていない（個人ブログが302頁を引用していた）。「引用している」と言う。
#   一坂太郎『高杉晋作 情熱と挑戦の生涯』p.240 は Wikipedia の注に挙がるもの。本は開いていない。命日の理由は「考えられている」まで。
#   辞世の下の句の場面（望東尼が付けた）は、NDL の回答が「とされている」。どの本も共通、とだけ言う。
#   最期の場面（病床・死の瞬間）は描かない。AI 絵の人物は後ろ姿・遠景・手もと。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（墓碑銘・望東尼の歌・出発の言葉。声は作らない）。
#   想像の台詞は3か所（高杉想像。config の roles に足した：玄野武宏）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の ryoma_takasugi_shinsaku（近世名士写真の肖像）ほか既存の絵図・写真＋ AI 絵（T01〜T15、一覧は dev/output/rekishi-chiso/research/takasugi_ai_images.md）。
#   AI 絵の高杉は後ろ姿か遠景。実在の肖像写真に似せない・俳優に似せない。顔が分かるのは実在の肖像写真（額）だけ。
# 広告の配慮：戦闘の場面・死の場面・亡骸は描かない。刀を抜いた場面も描かない。
