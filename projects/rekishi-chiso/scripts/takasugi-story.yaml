# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  山口県下関市の東行庵。幕末の長州の英雄、高杉晋作の墓には、「東行墓」の三文字しか刻まれていません。
  ところが高杉は、自分の墓に刻む言葉を、挙兵の直前に、自分で書き残していました。その碑が建ったのは、2016年。没後150年のことです。
  高杉晋作の墓には、なぜ、本人の書いた墓碑銘が刻まれなかったのか。
  この動画でわかること
  ・挙兵の前に書いた墓碑銘と、墓に刻まれなかったわけ
  ・23歳で見た上海と、『遊清五録』に書かれたこと
  ・身分を問わない奇兵隊の、559名の身分
  ・功山寺挙兵の人数と、出発の言葉をめぐって食い違う記録
  ・「おもしろきこともなき世を」の句は、いつ、どこで詠まれたのか
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（高杉晋作Museum、山口県観光連盟、歴史街道、レファレンス協同データベース、梅溪昇『人物叢書 高杉晋作』など）を語りで示してから読んでいます。
  肖像は『近世名士写真 其2』（1934〜35年）に載った写真（ウィキメディア・コモンズ、パブリックドメイン）です。

en:
  title: "Takasugi Shinsaku: The Epitaph He Wrote Before the Uprising, and Why It Was Not Carved on His Grave"
  description: |-
    At Togyo-an in Shimonoseki, the grave of Takasugi Shinsaku, hero of the Choshu domain, bears only three characters: "Togyo's grave."
    Yet just before his uprising, Takasugi had written out the words he wanted on his grave himself. The monument carrying them was raised only in 2016, 150 years after his death.
    Why was the epitaph he wrote himself never carved on his grave?
    In this video you will learn:
    - The epitaph he wrote just before the uprising, and why it was not carved
    - What he saw in Shanghai at 23, and what his diary says
    - Who really served in the "classless" Kiheitai: 559 men
    - The conflicting records of the Kozanji uprising: how many men, and what he said
    - When and where the famous "Omoshiroki koto mo naki yo wo" poem was composed
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Was His Own Epitaph Not Carved on Takasugi's Grave? Togyo-an, Shimonoseki"
    - "What Did the 23-Year-Old See in Shanghai? 1862"
    - "Was the Classless Kiheitai Really Classless? Shimonoseki, 1863"
    - "What Did He Say the Night 80 Men Rose Against the Domain? Kozanji, 1864"
    - "What Did the Man Who Bought a Warship Without Permission Do in the Second Choshu War? 1866"
    - "Was \"Omoshiroki koto mo naki yo wo\" Really a Death Poem? Shimonoseki, 1867"
    - "Summary: Why Was His Epitaph Not Carved on the Grave?"

