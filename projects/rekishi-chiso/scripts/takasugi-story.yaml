sections:
  # ================================================================ 導入（冒頭 約2分30秒）。答え（墓誌は葬儀の後に見つかった）は最後の章まで言わない
  - title: 高杉晋作の墓に刻まれなかった遺言　1867年 下関・東行庵
    background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
    # AI絵：T01（夕暮れの丘の上の、文字の無い古い墓石。人物なし）
    year: 1867
    lines:
      # 0〜10秒：知らない事実（墓石には三文字だけ）
      # fact: takasugi-04
      - 語り: 山口県下関市、東行庵。幕末の長州の英雄、高杉晋作の墓には、《「東行墓」の三文字》しか、刻まれていません。
        tone: 強調
        portrait: {image: paintings/ryoma_takasugi_shinsaku.jpg, caption: "高杉晋作の肖像（『近世名士写真 其2』1934〜35年）"}
        card: {head: "高杉晋作の墓", body: 刻まれたのは三文字だけ}
      # fact: takasugi-07
      - 語り: ところが高杉は、自分の墓に刻んでほしい言葉を、書き残していました。高杉晋作Museumによれば、書いたのは、功山寺で挙兵する、直前のことです。
        portrait: null
      # fact: takasugi-07
      - 語り: 大庭伝七にあてた書状に、遺言として、記したといいます。
      # fact: takasugi-05
      - 語り: その言葉が、碑になって建ったのは、2016年。没後150年のことでした。
        tone: 重い
        card: {head: "2016年", body: 没後150年に碑が建つ}
      # 【記録】墓碑銘の全文（takasugi 墓碑銘のカード）を、出どころを言ってから読む
      # fact: takasugi-06
      - 語り: 高杉晋作Museumが紹介する墓碑銘は、こうです。「故、奇兵隊開闢総督、高杉晋作、則ち、西海一狂生、東行の墓。遊撃将軍、谷梅之助なり」。
        card: {head: "高杉が書いた墓碑銘", body: 奇兵隊開闢総督　高杉晋作}
      # fact: takasugi-06
      - 語り: 裏には、「毛利家、恩ある古臣、高杉某の、嫡子なり」と、あります。
      - 語り: 藩の家臣の長男だと、書き添えたうえで、「奇兵隊を開いた総督」と、名乗っているわけです。
        tone: しみじみ
      # fact: takasugi-08
      - 語り: 高杉が亡くなったのは、慶応3年の4月。27歳でした。遺言によって、奇兵隊の陣屋があった、下関の吉田の、清水山に葬られます。
        background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
        portrait: null
      # fact: takasugi-09
      - 語り: 墓を守ったのは、愛妾のおうのです。のちに出家して、梅処と名乗り、庵主になりました。
      # fact: takasugi-09
      - 語り: 今の東行庵は、明治17年、1884年に、山県有朋、伊藤博文、井上馨が、お金を出して建てた、霊位礼拝堂が始まりです。
        card: {head: "1884年", body: 山県・伊藤・井上が出資して建つ}
      - 語り: 仲間たちに、これだけ慕われた人の墓に、本人の書いた言葉は、刻まれなかった。
        tone: しみじみ
      - 語り: なぜ、高杉晋作の墓には、本人が書いた墓碑銘が、刻まれなかったのか。そして、挙兵の前に、高杉は、なぜ、自分の墓碑銘を書いたのか。
        tone: 疑問
        pause: 0.8
      - 語り: 話は、23歳の高杉が、上海の港に着くところから、始まります。
        pause: 0.6

  # ================================================================ 第1章 23歳の上海（1862）
  - title: 23歳の高杉晋作は、上海で何を見たのか　1862年
    background: {image: paintings/ryoma_nagasaki_1865_harbor.jpg, credit: "長崎の港（1865年ごろの写真）"}
    # AI絵：T02（帆船の甲板、夜の海を見つめる若い男の後ろ姿）
    year: 1862
    lines:
      # fact: takasugi-10
      - 語り: 文久2年、1862年の4月。23歳の高杉晋作は、幕府の船、千歳丸に乗って、長崎から上海へ向かいます。
      # fact: takasugi-10
      - 語り: 高杉晋作Museumの年表によれば、目的は、清国の情勢を探ること。旅は、4月から7月にかけてでした。
        card: {head: "文久2年4月", body: 長崎から上海へ}
      # fact: takasugi-14
      - 語り: 船の中で、高杉は、病気のために、一晩じゅう眠れなかった、と日記に書いています。漢文で、「終夜、遂に眠るを得ず」。
        tone: しみじみ
      # fact: takasugi-11
      - 語り: この旅の手記が、『遊清五録』です。『航海日録』『上海淹留日録』『内情探索録』『外情探索録』などから、できています。
        card: {head: "『遊清五録』", body: 上海の旅の手記}
      # fact: takasugi-11
      - 語り: 原文は、ほとんどが漢文です。昭和49年に、堀哲三郎さんが編んだ『高杉晋作著作集』に、収められています。
      # fact: takasugi-15
      - 語り: 『内情探索録』で、高杉は、幕府の役人を、厳しく批判します。貿易を、商人や、長崎の地役人に任せきりで、何も知らない、と。
        tone: 強調
      # fact: takasugi-12
      - 語り: 山口県観光連盟の解説によれば、高杉は、上海で、中国人が西洋人に使われ、イギリス軍が孔子廟で休んでいる様子を見ました。
        background: {image: paintings/ryoma_nagasaki_beato_ships_offshore.jpg, credit: "長崎港外の船（フェリーチェ・ベアト撮影、1860年代）"}
      # fact: takasugi-12
      - 語り: そして、日本も、同じ道をたどってはならない、と危機感を抱いた、といいます。
        tone: 重い
      # 【想像1】高杉。記録：中国人が西洋人に使われる様子を見て、日本も同じ道をたどってはならないと危機感を抱いた（S_SEEN）。気持ちの言葉だけ
      - 人物: 「……日本を、こうしては、ならぬ」
        who: 高杉想像
        imagined: true
        tone: 重い
      # fact: takasugi-13
      - 語り: 上海では、薩摩の五代才助、のちの五代友厚と、親しくなります。薩摩には、蒸気船がある。長州の軍艦は、帆船が2隻だけ。高杉は、焦りを覚えた、といいます。
        card: {head: "蒸気船と帆船", body: 薩摩は蒸気船　長州は帆船2隻}
      - 語り: 江戸に戻った高杉は、その年の暮れ、同志とともに、あることをします。
        tone: 疑問
      # fact: takasugi-16
      - 語り: 12月12日、品川の御殿山で、建設中の、イギリス公使館を、同志13名と、焼き討ちしたのです。
        card: {head: "12月12日", body: 品川御殿山の英国公使館を焼き討ち}
        hook: true
      - 語り: 上海で、列強の力を見た若者は、やがて、身分を問わない軍隊を、つくることになります。
        tone: 重い
        hook: true

  # ================================================================ 第2章 通説の検証（奇兵隊）
  - title: 身分を問わない奇兵隊は、本当に身分を問わなかったのか　1863年 下関
    background: {image: paintings/ryoma_shimonoseki_battery_beato_1864.jpg, credit: "下関の砲台（フェリーチェ・ベアト撮影、1864年）"}
    # AI絵：T03（夜明けの下関の海峡、砲台のある岬。人物なし）
    year: 1863
    lines:
      # fact: takasugi-41
      - 語り: 文久3年、1863年の3月16日。高杉は、京都で、髪を剃って、「東行」と号しました。のちに、墓に刻まれる名です。
        card: {head: "3月16日", body: 京都で剃髪して「東行」と号す}
      - 語り: 5月10日は、朝廷と幕府が決めた、攘夷の期限でした。長州は、下関で、関門海峡を通る外国船を、砲撃します。
      - 語り: ところが6月、アメリカとフランスの報復を受けて、下関の砲台は、壊されてしまいます。
        tone: 重い
      - 語り: 敗れたあと、高杉は、藩主に、身分を問わず、志のある人を集めた隊を、つくることを、提案しました。
      # fact: takasugi-17
      - 語り: 結成は、6月7日。高杉晋作Museumの年表は、場所を、下関の、白石正一郎の屋敷、と書きます。
        card: {head: "6月7日", body: 下関の白石正一郎邸で結成}
      # fact: takasugi-17
      - 語り: 20日後の6月27日には、高杉が、総督に任じられます。
      # fact: takasugi-18
      - 語り: ところが、同じ年表は、8月16日に、教法寺事件の責任を問われて、高杉が、総督を罷免された、とも書いています。結成から、わずか2か月あまりです。
        tone: 強調
        card: {head: "8月16日", body: 結成の2か月後に総督を罷免}
      # fact: takasugi-19
      - 語り: 隊の人数は、その後に、ふくらみます。世界大百科事典によれば、1865年の初めに、300余名。3月に、定員が375名。5月には、400名です。
      - 語り: さて、この「身分を問わない」隊には、実際に、どんな人が、いたのか。
        tone: 疑問
      # fact: takasugi-20
      - 語り: 世界大百科事典は、隊士559名の身分を調べた研究を、挙げています。
        figure: {type: stats, title: 奇兵隊士559名の身分, items: [[士分格, 272名, 48.6％], [農民, 237名, 42.4％], [町人, 25名, 4.5％], [社・僧, 25名, 4.5％]], upto: 1}
      # fact: takasugi-20
      - 語り: 士分格が、272名。農民が、237名。町人と、神官・僧が、それぞれ25名ずつ。
        figure: {type: stats, title: 奇兵隊士559名の身分, items: [[士分格, 272名, 48.6％], [農民, 237名, 42.4％], [町人, 25名, 4.5％], [社・僧, 25名, 4.5％]], upto: 4}
      - 語り: 身分を問わない、と言われる隊の、およそ半分は、武士の身分の人たちだった。農民は、4割あまり。誰でも入れた隊でしたが、中身は、半々に近かったんです。
        tone: しみじみ
        figure: null
      # fact: takasugi-21
      - 語り: 隠棲していた高杉は、将軍の暗殺を、計画したことがあります。山口県観光連盟の解説によれば、賛同したのは、入江九一、ただひとりで、計画は、頓挫しました。
      # fact: takasugi-42
      - 語り: 1864年の3月、高杉は、藩の命令に背いた、と見なされて、萩の野山獄に、入れられます。
        card: {head: "1864年3月", body: 萩の野山獄に入る}
      - 語り: 7月、京都の禁門の変で、同志の久坂玄瑞らが、命を落とします。
        tone: 重い
      # fact: takasugi-22
      - 語り: 8月、イギリスなど四か国の艦隊が、下関を砲撃すると、高杉は、牢から出されて、講和の交渉を任されました。直垂に、烏帽子の正装で、臨んだ、といいます。
      # fact: takasugi-22
      - 語り: 連合国が求めた、賠償金は、300万ドル。高杉は、それを、幕府に支払わせることに、成功した、と解説は紹介しています。
        card: {head: "賠償金300万ドル", body: 幕府に支払わせた}
      - 語り: けれど、藩の中では、幕府に従うことを説く、俗論派が、力を握ります。高杉は、命が危うくなり、長州から、逃げ出しました。
        tone: 重い
        hook: true
      - 語り: その高杉が、年の暮れに、ふたたび、長州へ戻ってきます。
        tone: 重い
        hook: true

  # ================================================================ 第3章 功山寺挙兵（1864）
  - title: 80人で藩に挙兵した夜、高杉は何と言ったのか　1864年 功山寺
    background: {image: paintings/ryoma_choshu_hiroshige2_nagato.jpg, credit: "二代歌川広重《六十余州名所図会 長門》"}
    # AI絵：T04（雪の夜、山門へ続く石段の遠景。人物なし）
    year: 1864
    lines:
      # fact: takasugi-23
      - 語り: 逃れた先は、福岡でした。元治元年の11月11日、高杉は、福岡藩を脱藩した、中村円太に連れられて、平尾山荘に入ります。
        card: {head: "11月11日", body: 福岡の平尾山荘へ}
      # fact: takasugi-23
      - 語り: そこには、歌人の野村望東尼がいました。望東尼は、10日あまり、高杉をかくまいます。
      # fact: takasugi-23
      - 語り: 長州へ戻る前に、望東尼は、一晩で、町人風の着物を縫い上げて、歌を添えました。
        tone: しみじみ
      # fact: takasugi-23
      - 語り: 高杉晋作Museumが紹介する歌は、こうです。「まごころを、つくしのきぬは、国のため、たちかえるべき、衣手にせよ」。
        tone: しみじみ
      # 【想像2】高杉。記録：望東尼が一晩で着物を縫い、歌を添えて贈った（Z_HIRAO）。気持ちの言葉だけ
      - 人物: 「……かたじけない」
        who: 高杉想像
        imagined: true
        tone: しみじみ
      # fact: takasugi-43
      - 語り: 11月25日、高杉は、福岡から、下関に戻ります。山県狂介の協力は得られず、福岡でも、同志が集まりませんでした。それでも、挙兵を、決意した、と解説は書いています。
        card: {head: "11月25日", body: 下関へ戻る}
      # fact: takasugi-07
      - 語り: その決起の直前に、高杉が、大庭伝七にあてた書状に、遺言として書いたのが、冒頭の、墓碑銘です。
        background: {image: paintings/ryoma_doc_letter_1867.jpg, credit: "同じ時代の書状（坂本龍馬の書状、1867年）"}
      # 【想像3】高杉。記録：決起の直前に、墓碑銘を遺言として書き記した（T_LETTER）。気持ちの言葉だけ
      - 人物: 「……墓には、これを、刻んでくれ」
        who: 高杉想像
        imagined: true
        tone: 重い
      # fact: takasugi-24
      - 語り: 元治元年12月15日、雪の降る深夜。長府の功山寺です。ここには、京都を追われた、五人の公家が、かくまわれていました。
        background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
        card: {head: "12月15日", body: 雪の夜、長府の功山寺で挙兵}
      - 語り: このとき、高杉に、従った人数は、何人だったのか。
        tone: 疑問
      # 食い違い①：人数の書き方（山口県観光連盟／歴史街道／国土交通省）
      # fact: takasugi-24
      - 語り: 山口県観光連盟は、「わずか80名」と、書きます。歴史街道は、「80人」。
        figure: {type: stats, title: 功山寺挙兵　人数の書き方, items: [[山口県観光連盟, わずか80名], [歴史街道, 80人], [国土交通省の解説, 80多人]], upto: 2}
      # fact: takasugi-24
      - 語り: 国土交通省の、観光の解説は、「80多人」。つまり、80人あまり、です。数が、そろわないんです。
        figure: {type: stats, title: 功山寺挙兵　人数の書き方, items: [[山口県観光連盟, わずか80名], [歴史街道, 80人], [国土交通省の解説, 80多人]], upto: 3}
      # fact: takasugi-26
      - 語り: 従ったのは、のちの伊藤博文、伊藤俊輔の力士隊と、遊撃隊などでした。
        figure: null
        card: {head: "伊藤俊輔の力士隊", body: 力士を集めた隊}
      - 語り: では、出発のとき、高杉は、何と言ったのか。これも、記録で、書き方が違います。
        tone: 疑問
      # 食い違い②：出発の言葉（歴史街道／山口県観光連盟）
      # fact: takasugi-25
      - 語り: 歴史街道は、見送りの五卿の前で、馬に乗った高杉が、振り向きざまに、叫んだ、と書きます。「これより、長州男児の、肝っ玉を、お目にかけます」。
        figure: {type: stats, title: 出発の言葉　書き方の違い, items: [[歴史街道, 「長州男児の肝っ玉をお目にかけます」], [山口県観光連盟, 「長州男児の腕前お目にかけ申すべし」]], upto: 1}
      # fact: takasugi-25
      - 語り: 山口県観光連盟は、「長州男児の、腕前、お目にかけ申すべし」と、書いています。
        figure: {type: stats, title: 出発の言葉　書き方の違い, items: [[歴史街道, 「長州男児の肝っ玉をお目にかけます」], [山口県観光連盟, 「長州男児の腕前お目にかけ申すべし」]], upto: 2}
      - 語り: 肝っ玉か、腕前か。同じ夜の、同じ言葉でも、書く人によって、少しずつ、違うんです。
        tone: しみじみ
        figure: null
      # fact: takasugi-27
      - 語り: 一行は、雪の中を、下関へ向かいます。未明に、藩の新地会所を、占拠しました。
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
        card: {head: "新地会所を占拠", body: 下関の藩の役所}
      # fact: takasugi-27
      - 語り: 高杉は、海路で、三田尻へ向かい、藩の軍艦3隻を、奪って、戻りました。
      # fact: takasugi-28
      - 語り: 12月26日、藩の正規軍、3,800が、萩を出発します。
        tone: 重い
      # fact: takasugi-28
      - 語り: 年が明けた1月7日の未明、諸隊は、絵堂で、藩の軍を、奇襲して、勝ちます。これが、大田・絵堂の戦いです。
        card: {head: "1月7日", body: 絵堂で藩の軍を奇襲}
      - 語り: 俗論派は、力を失い、長州は、もう一度、幕府と戦う道へ、進んでいきます。
        tone: しみじみ
        hook: true
      - 語り: 高杉の次の相手は、幕府です。そのために、高杉は、ある船を、買います。藩に、断りなく。
        tone: 重い
        hook: true

  # ================================================================ 第4章 四境戦争（1866）
  - title: 軍艦を勝手に買った男は、四境戦争で何をしたのか　1866年
    background: {image: paintings/ryoma_nagasaki_beato_ships_offshore.jpg, credit: "長崎港外の船（フェリーチェ・ベアト撮影、1860年代）"}
    # AI絵：T05（長崎の港、蒸気船の遠景。人物なし）
    year: 1866
    lines:
      # fact: takasugi-29
      - 語り: 慶応2年の3月21日。高杉は、長崎で、蒸気船、オテントー丸、のちの丙寅丸を、藩に無断で、買いました。
        card: {head: "3月21日", body: 軍艦を藩に無断で購入}
      - 語り: 上海で見た、蒸気船と帆船の差を、高杉は、忘れていなかったのかもしれません。
        tone: しみじみ
      - 語り: 6月、幕府の第二次長州征討が、始まります。長州は、藩の境の、4つの方面で、戦いました。四境戦争です。
      # fact: takasugi-30
      - 語り: 高杉は、海軍総督になります。6月12日の大島口では、買ったばかりの船で、幕府の軍艦を、奇襲して、成功した、と年表は書いています。
        card: {head: "6月12日", body: 大島口で幕府の軍艦を奇襲}
      # fact: takasugi-30
      - 語り: ただし、Wikipediaは、金澤裕之さんの『幕府海軍の興亡』を注に挙げて、このとき目立った戦果は、なかった、と書いています。
      # fact: takasugi-30
      - 語り: 小倉口では、高杉の側は、およそ1千の兵。相手の征長軍は、およそ2万でした。
        card: {head: "およそ1千対およそ2万", body: 小倉口の兵力}
      # fact: takasugi-30
      - 語り: 8月1日、小倉城が炎上し、長州が、勝ちます。
        background: {image: paintings/yoshinobu_choshu_modern_troops_1865.jpg, credit: "第二次長州征討の長州の洋式軍隊の絵（1865年）"}
      - 語り: ところが、その頃から、高杉は、結核が悪化して、立つことも、できなくなっていきます。
        tone: 重い
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
      # fact: takasugi-32
      - 語り: この年の9月、高杉の指揮のもとで、野村望東尼が、流されていた姫島から、救い出されます。望東尼は、下関の豪商、白石正一郎の家に、かくまわれました。
        card: {head: "1866年9月", body: 望東尼を姫島から救い出す}
      - 語り: 10月、高杉は、下関の桜山で、療養に入ります。
        tone: 重い
      # fact: takasugi-31
      - 語り: 慶応3年の3月29日。藩主は、高杉に、100石を与え、谷家を創設させます。高杉は、その初代の当主になりました。
        card: {head: "3月29日", body: 100石を賜り谷家を創設}
      - 語り: 谷家を継ぐのは、長男の梅之進。高杉は、自分がもう長くないことを、悟っていたのかもしれません。
        tone: しみじみ
        hook: true
      - 語り: 病の床で、高杉が詠んだ、といわれる句があります。「おもしろきこともなき世を、おもしろく」。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 辞世の検証
  - title: 「おもしろきこともなき世を」は、辞世だったのか　1867年 下関
    background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
    # AI絵：T06（窓の外に海の見える、灯の落ちた座敷。人物なし）
    year: 1867
    lines:
      - 語り: 「おもしろきこともなき世を、おもしろく」。上の句を、高杉が詠み、野村望東尼が、「住みなすものは、心なりけり」と、下の句を付けた。そう語られてきました。
      # fact: takasugi-33
      - 語り: 南アルプス市立図書館が、2012年に、レファレンス協同データベースに載せた回答は、こう書きます。慶応3年4月14日、高杉は、病床で、上の句を書いた。
        card: {head: "辞世の句", body: 臨終で詠んだ上の句に下の句}
      # fact: takasugi-33
      - 語り: 下の句を、望東尼が続けた、という点は、調べた本のどれも、共通している。ただし、表記は、本によって違い、どちらが本当の句か、手元の資料では、確認できなかった、とあります。
      # fact: takasugi-36
      - 語り: 上の句も、「世を」と、「世に」の、両方があります。高杉の直筆は、残っていません。
      - 語り: ところが、この歌は、臨終の作では、ない、という書き方も、あるんです。
        tone: 疑問
      # 食い違い③：辞世の句の成り立ち（南アルプス市立図書館／山口県観光連盟／梅溪昇）
      # fact: takasugi-34
      - 語り: 吉川弘文館の人物叢書、梅溪昇さんの『高杉晋作』は、302頁で、一坂太郎さんの指摘を、引いています。
        figure: {type: stats, title: 「おもしろきこともなき世を」いつ詠まれたか, items: [[南アルプス市立図書館 2012年, 慶応3年4月14日, 病床で書いた], [山口県観光連盟, 1866年10月, 桜山で望東尼が見舞ったとき], [梅溪昇『人物叢書 高杉晋作』, 慶応2年の歌の中, 臨終の作とはいえない]], upto: 1}
      # fact: takasugi-34
      - 語り: この歌は、「丙寅、慶応2年、未定稿五十首、国歌十首」と題した中に、まとめられている。だから、臨終の際に、作られたものとは、いえない。
        figure: {type: stats, title: 「おもしろきこともなき世を」いつ詠まれたか, items: [[南アルプス市立図書館 2012年, 慶応3年4月14日, 病床で書いた], [山口県観光連盟, 1866年10月, 桜山で望東尼が見舞ったとき], [梅溪昇『人物叢書 高杉晋作』, 慶応2年の歌の中, 臨終の作とはいえない]], upto: 3}
      # fact: takasugi-34
      - 語り: そう書いている、と個人のブログが、引用しています。
        figure: {type: stats, title: 「おもしろきこともなき世を」いつ詠まれたか, items: [[南アルプス市立図書館 2012年, 慶応3年4月14日, 病床で書いた], [山口県観光連盟, 1866年10月, 桜山で望東尼が見舞ったとき], [梅溪昇『人物叢書 高杉晋作』, 慶応2年の歌の中, 臨終の作とはいえない]], upto: 3}
      # fact: takasugi-35
      - 語り: もうひとつの記録は、日付が、違います。山口県観光連盟の解説です。1866年の10月、療養していた、桜山に、望東尼が、見舞いに来たとき、高杉が、上の句を詠み、望東尼が、下の句を添えた、と書いています。
        figure: {type: stats, title: 「おもしろきこともなき世を」いつ詠まれたか, items: [[南アルプス市立図書館 2012年, 慶応3年4月14日, 病床で書いた], [山口県観光連盟, 1866年10月, 桜山で望東尼が見舞ったとき], [梅溪昇『人物叢書 高杉晋作』, 慶応2年の歌の中, 臨終の作とはいえない]], upto: 3}
      # fact: takasugi-35
      - 語り: 世界大百科事典も、「死の枕もとで、野村望東尼と残した、合作の一首」と書くだけで、「辞世」とは、呼んでいません。
        figure: null
      - 語り: 亡くなる日か、その半年前か。それとも、慶応2年の歌の中の一首か。記録は、そろっていません。
        tone: しみじみ
      - 語り: 確かなのは、上の句と下の句が、ふたりの合作だと、語り継がれてきたことです。
        tone: しみじみ
      # 命日の食い違い
      # fact: takasugi-37
      - 語り: 亡くなった日も、書き方が、分かれます。日本人名大辞典と、ブリタニカは、慶応3年4月14日。墓碑も、14日です。
        figure: {type: stats, title: 高杉晋作の命日, items: [[日本人名大辞典・ブリタニカ, 4月14日], [高杉晋作Museumの年表, 4月13日 午前2時]], upto: 1}
      # fact: takasugi-37
      - 語り: 高杉晋作Museumの年表は、4月13日の、午前2時、と書きます。
        figure: {type: stats, title: 高杉晋作の命日, items: [[日本人名大辞典・ブリタニカ, 4月14日], [高杉晋作Museumの年表, 4月13日 午前2時]], upto: 2}
      # fact: takasugi-37
      - 語り: Wikipediaは、13日の深夜に亡くなったとし、14日になったのは、長男の梅之進に、谷家を継がせる時間が、必要だったから、と考えられている、と書いています。
        figure: null
      # fact: takasugi-37
      - 語り: 一坂太郎さんの本を、注に挙げています。けれど、はっきり、そう書いた史料までは、確かめられていません。
        figure: null
      # fact: takasugi-38
      - 語り: 臨終には、野村望東尼、山県狂介、田中顕助も、立ち会った、といわれます。ただし、田中顕助は、日記に、その日は、京都にいた、と書いている、とWikipediaは紹介しています。
        card: {head: "臨終に立ち会った人", body: 田中顕助は日記で京都にいたと記す}
      # fact: takasugi-32
      - 語り: その年の11月、望東尼も、三田尻で、亡くなります。
        tone: 重い
      # fact: takasugi-08
      - 語り: 4月16日、高杉は、遺言どおり、吉田村の清水山に、葬られました。
        tone: 重い
        hook: true
      - 語り: では、墓石には、なぜ、「東行墓」の三文字だけが、刻まれたのか。
        tone: 疑問
        hook: true

