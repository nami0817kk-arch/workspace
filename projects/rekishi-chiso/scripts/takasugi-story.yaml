  - title: まとめ：墓碑銘は、なぜ刻まれなかったのか　東行庵
    background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
    # AI絵：T07（夕暮れの丘の上の墓石。人物なし）
    year: 2016
    lines:
      # 答え
      # fact: takasugi-04
      - 語り: 高杉晋作Museumによれば、高杉の書いた墓誌は、葬儀の後に、見つかりました。そのため、墓石には、本人の号にちなんだ、「東行墓」だけが、刻まれたといいます。
        tone: しみじみ
        background: {image: paintings/ryoma_choshu_hiroshige2_nagato.jpg, credit: "二代歌川広重《六十余州名所図会 長門》"}
      # fact: takasugi-05
      - 語り: 墓誌の墓碑銘が、碑になったのは、没後150年の、2016年4月14日。高杉の命日、14日でした。
        card: {head: "2016年4月14日", body: 墓碑銘の碑が建つ}
      # fact: takasugi-07
      - 語り: 書いたのは、功山寺挙兵の直前。「奇兵隊開闢総督」と、自分を名乗る言葉は、高杉が、自分の一生を、どこに置いていたかを、うかがわせます。
        tone: しみじみ
      # fact: takasugi-09
      - 語り: おうのは、出家して梅処と名乗り、墓を守りました。
      - 語り: 高杉が、なぜ、挙兵の前に、墓碑銘を書いたのか。それを語った史料は、私たちの調べでは、確かめられませんでした。命がけの挙兵だったことだけは、確かです。
        tone: 重い
      # fact: takasugi-39
      - 語り: いま、私たちが目にする、高杉の肖像は、1934年から35年に出た、『近世名士写真』に載ったものです。撮った人は、分かっていません。
        portrait: {image: paintings/ryoma_takasugi_shinsaku.jpg, caption: "高杉晋作の肖像（『近世名士写真 其2』1934〜35年）"}
      # fact: takasugi-40
      - 語り: 高杉の日記や詩文は、一坂太郎さんが編んだ、『高杉晋作史料』全3巻の、第2巻に、収められています。2002年、マツノ書店の刊行です。
        portrait: null
      # 結び：なぜの答え
      - 語り: 本人が書いた、確かな墓碑銘は、150年のあいだ、石に刻まれませんでした。
        tone: しみじみ
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
      - 語り: その一方で、臨終に詠んだのかどうかも、はっきりしない歌が、「辞世の句」として、広く知られています。
        tone: しみじみ
      - 語り: 高杉晋作の墓に刻まれたのは、「東行墓」の、三文字。その向こうには、挙兵の前に、自分の墓碑銘を書いた、27歳の人がいました。
        tone: しみじみ
        pause: 0.8

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
