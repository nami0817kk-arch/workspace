sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：「敵は本能寺にあり」
    background: {image: paintings/akechi_honnoji_nobukazu_1896.jpg, credit: "楊斎延一《本能寺焼討之図》1896年（後世の想像図）"}
    portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
    year: 1582
    lines:
      - 語り: 「敵は本能寺にあり」。主君を討つと決めた男が、兵に向かって言い放った言葉です。
        short: s1
        tone: 強調
      - 聞き: 知ってる！ 明智光秀でしょ。裏切り者の代名詞みたいな人。
        short: s1
        tone: 明るい
      - 語り: そうです。1582年、光秀は京都の本能寺で、主君の織田信長を討ちました。
        short: s1
      - 聞き: で、その前に「敵は本能寺にあり」って叫んだんだよね。かっこいい場面。
        short: s1
        tone: 明るい
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: え、まさか、その一言って……？
        tone: 疑問
      - 語り: 実は、本能寺の変のころの記録に、光秀がこの言葉を言ったという記録は、ありません。
        short: s1
        card: {head: "1582年", body: "「敵は本能寺にあり」の記録はない"}
      - 聞き: うそでしょ！？ あんなに有名なのに。
        short: s1
        tone: 驚き
      - 語り: しかも、本能寺へ向かった兵の一人は、のちに、相手は徳川家康だと思っていた、と書き残しています。
      - 聞き: 兵の人たち、信長を討つって知らなかったの？
        tone: 疑問
      - 語り: 少なくとも、その一人は知らなかったようです。かっこいい一言どころか、兵には行き先も告げていなかったのかもしれません。
      - 聞き: じゃあ、あの一言は、誰がいつ言わせたの？
        tone: 疑問
      - 語り: それが今日の一番の掘りどころです。もう一つ、そもそも光秀は、なぜ信長を討ったのか。
      - 聞き: 信長にいじめられてた恨み、って聞いたことあるけど。
        tone: 疑問
      - 語り: それも掘ります。まずは、光秀という人が、どこから来たのかから。
      - 聞き: 了解。あーし、今日はヘルメットのひも、きつめに締めとく。
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: 名前のない前半生
    background: {image: paintings/akechi_mitsuhide_yoshiiku_1867.jpg, credit: "歌川芳幾《太平記英勇伝 明智日向守光秀》1867年（後世の武者絵）"}
    portrait: null
    year: 1566
    lines:
      - 語り: 明智光秀は、いつ生まれたのか。実は、分かっていません。
        short: s3
      - 聞き: え、有名人なのに？
        short: s3
        tone: 疑問
      - 語り: 1528年という説と、1516年という説があります。12年もちがうんです。どちらも、光秀が亡くなってから何十年もあとの書物が出どころです。
        short: s3
      - 聞き: 12年って、小学生が大人になっちゃう差じゃん。
        short: s3
        tone: 笑い
      - 語り: 生まれは、美濃、今の岐阜県の、土岐氏という名門の一族とされます。当時の京都の記録にも、土岐の一族だと書かれています。
      - 語り: ただ、父の名前も、生まれた場所も、はっきりしません。
      - 語り: 越前、今の福井県の称念寺というお寺の門前に、10年ほど住んでいた、という話があります。これは、光秀が生きていた1580年に、お坊さんが書いた旅の記録にも出てきます。
      - 聞き: 生きてるうちの記録なら、それは本当っぽいね。
        tone: 納得
      - 語り: そうです。でも、それ以外の若いころの暮らしは、ほとんど分かっていないんです。
      - 聞き: じゃあ、名前が記録に初めて出てくるのは、いつ？
        short: s3
        tone: 疑問
      - 語り: 1566年の、医術の本の写しです。『針薬方』という本で、明智十兵衛という人が語った医術を書き写した、とあります。
        short: s3
        card: {head: "1566年", body: "医術書『針薬方』に名前が出る"}
        icon: first-aid-kit
      - 聞き: 医術って、お医者さん！？ 戦国武将なのに？
        short: s3
        tone: 驚き
      - 語り: 中身は、お産の手当てや、刀の傷の手当てなどです。この本が見つかったのは、2014年。熊本の古い家に残っていました。
        short: s3
      - 聞き: 2014年って、すごい最近。まだ見つかるものがあるんだ。
        tone: 納得
      - 語り: 光秀が医者として暮らしていたのかは分かりません。でも、医術の知識を持つ人だったことは見えてきます。
      - 語り: もう一つの手がかりは、室町幕府に仕えた人々の名簿です。《足軽衆》という、身分の低い侍たちの、いちばん最後に「明智」とあります。
        card: {head: "幕府の名簿", body: "足軽衆の末尾に「明智」"}
      - 聞き: いちばん最後……。あーしでも分かる、下っ端の場所じゃん。
        tone: 疑問
      - 語り: そう見られています。名門の一族とはいえ、出発点は、かなり低い身分だったようです。
      - 聞き: 名前もはっきりしない人が、あの信長の重臣になるんだ。
        tone: しみじみ
      - 語り: その出世のきっかけは、二人の主君でした。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 二人の主君
    background: {image: paintings/nobunaga_document_shuin_5articles.jpg, credit: "織田信長の五か条の書き付け（1570年、宛名に「明智十兵衛尉」）"}
    portrait: null
    year: 1568
    lines:
      - 語り: 1568年、足利義昭という人が、織田信長に担がれて京都へ上ります。のちに、室町幕府の最後の将軍になる人です。
        card: {head: "1568年", body: "足利義昭と信長が京都へ"}
      - 聞き: 二人の主君って、この二人のこと？
        tone: 疑問
      - 語り: はい。光秀は、将軍の義昭と、信長の両方に仕える形で、京都の政治にかかわっていきます。
        figure: {type: people, title: 光秀をめぐる人々, nodes: [[明智光秀, 二人に仕える], [足利義昭, 最後の将軍], [織田信長, 主君], [細川藤孝, 光秀の盟友]], edges: [[明智光秀, 足利義昭, 仕える], [明智光秀, 織田信長, 仕える], [織田信長, 足利義昭, 京都へ担ぐ], [明智光秀, 細川藤孝, 盟友・息子に娘を嫁がせる]]}
      - 聞き: 社長と会長の両方の秘書、みたいな？ あーしなら胃が痛くなる。
        tone: 笑い
      - 語り: いいたとえです。光秀は、京都の町の訴えをさばいたり、公家とのやりとりをしたり、事務の仕事でも力を発揮しました。
      - 聞き: 戦うだけじゃなくて、事務もできる人だったんだ。
        tone: 納得
      - 語り: 同じように義昭と信長に仕えていたのが、細川藤孝です。のちに、光秀の盟友になる人です。
        figure: null
      - 語り: 連歌という、歌をつなぐ遊びも得意でした。50回あまりの連歌の会に加わったとも言われます。
      - 語り: 1571年、信長は、比叡山の延暦寺を焼き討ちにします。光秀も、この戦いに加わりました。
        background: {image: paintings/nobunaga_hiei_kyosai.jpg, credit: "河鍋暁斎《東海道名所之内 比叡山》1863年"}
        card: {head: "1571年", body: "比叡山の焼き討ち"}
      - 語り: そのあと光秀は、比叡山のふもと、近江の坂本を与えられ、琵琶湖のほとりに坂本城を築きます。
        background: {image: paintings/akechi_karasaki_night_rain_hiroshige.jpg, credit: "歌川広重《近江八景之内 唐崎夜雨》1834年ごろ（坂本のすぐ南）"}
        card: {head: "1571年", body: "坂本城を築く（約5万石）"}
      - 聞き: お城を任されたんだ！ 名簿のいちばん最後だった人が。
        tone: 驚き
      - 語り: 信長の家臣の中で、いちばん早く城を持った一人と言われます。宣教師のフロイスは、坂本城を、安土城に次ぐ立派な城だと書いています。
      - 聞き: 外国の人から見ても、すごいお城だったんだ。
        tone: 納得
      - 語り: 1573年には、戦で亡くなった家臣18人のために、坂本の西教寺に米を納めています。その名簿には、名字のない、身分の低い奉公人まで書かれているんです。
        card: {head: "1573年", body: "亡くなった家臣18人の供養"}
      - 聞き: 身分の低い人まで……。家来思いの人だったのかな。
        tone: しみじみ
      - 語り: そう見る人もいます。その寄進状は、今も西教寺に残っています。
      - 語り: ただ、同じ1573年、二人の主君の仲が、決定的に壊れます。信長は義昭を京都から追い出しました。室町幕府は、ここで事実上終わったとされます。
        card: {head: "1573年", body: "義昭が京都を追われる"}
      - 聞き: 光秀さんは、どっちについたの？
        tone: 疑問
      - 語り: 信長です。ここから光秀は、信長の家臣として、大きな仕事を任されていきます。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 丹波の5年と「天下の面目」
    background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
    portrait: null
    year: 1575
    lines:
      - 語り: 1575年、光秀は、丹波を攻めるよう命じられます。今の京都府の中部から兵庫県の東部にかけての山国です。
        card: {head: "1575年", body: "丹波攻めを命じられる"}
        figure: {type: map, title: 光秀の領地と京都, bounds: [134.6, 136.3, 34.6, 35.6], places: [[京都, 135.77, 35.01], [坂本, 135.87, 35.07], [亀山, 135.58, 35.01], [福知山, 135.13, 35.30], [山崎, 135.68, 34.89]], note: 京都の西に丹波、東に坂本}
      - 聞き: 京都のすぐ隣なんだ。
        tone: 納得
      - 語り: 丹波は京都の西、坂本は京都の東です。信長は、都の両側を、光秀に任せたんですね。
      - 語り: ただ、丹波攻めは、すんなりとはいきませんでした。1576年の正月には、味方だった武将に裏切られて、光秀は逃げ帰っています。
        card: {head: "1576年", body: "裏切りにあい、敗走"}
        figure: null
      - 聞き: 光秀さんが、裏切られる側だったんだ。
        tone: 驚き
      - 語り: 同じ年、妻が亡くなったと伝わります。貧しかったころ、妻が自分の黒髪を売って光秀を支えた、という話も有名ですが、これは言い伝えで、記録では確かめられません。
      - 語り: 娘の一人、玉は、のちに細川藤孝の息子、忠興に嫁ぎます。キリスト教の洗礼を受けて、細川ガラシャと呼ばれる人です。
        portrait: {image: paintings/akechi_gracia_kiyochika_1885.jpg, caption: "細川ガラシャ（小林清親画、1885年）"}
      - 聞き: ガラシャって、光秀さんの娘だったんだ。あーし、別々の人だと思ってた。
        portrait: null
        tone: 納得
      - 語り: 丹波を平らげるまでに、およそ5年かかりました。そのあいだに、丹波の亀山に城を築き、城下町をつくっています。今の京都府亀岡市です。
        card: {head: "1579年", body: "丹波を平定"}
        year: 1579
      - 語り: 1580年、光秀は丹波一国を与えられます。坂本と合わせて、およそ34万石になりました。
        card: {head: "1580年", body: "丹波一国。合わせて約34万石"}
        year: 1580
        figure: {type: bars, title: 光秀の石高（石）, bars: [[坂本だけ（1571年）, 50000], [丹波と坂本（1580年）, 340000]], labels: ["約5万石", "約34万石"], note: 1石は大人1人が1年に食べる米の量}
      - 聞き: 34万石って、どのくらい？
        tone: 疑問
      - 語り: 1石は、大人1人が1年に食べる米の量です。34万人を1年養えるだけの土地、ということになります。
      - 聞き: 名簿のいちばん最後から、34万人分！
        tone: 驚き
      - 語り: 今のお金にもしてみましょう。当時の京都の大工の日当がおよそ100文。これを今の1万円とします。米1石は500文ほどなので、1石は5万円です。
      - 聞き: じゃあ、34万石だと……？
        tone: 疑問
      - 語り: およそ170億円です。
        figure: {type: money, title: 34万石の米を今のお金にすると, then: "約34万石", yen: 17000000000, basis: "京都の大工の日当100文を今の1万円、米1石を500文（安めの年の値）とした目安。米の値段は年で大きく動き、領主に入るのは年貢の分だけ"}
      - 語り: 米の値段は年によって大きく動くので、目安です。それに、領主の手元に入るのは、そのうちの年貢の分だけです。
        figure: null
      - 語り: 1580年、信長は、古くからの重臣を織田家から追い出す書状を書いています。その中で、手本にすべき家臣として、真っ先に光秀を挙げました。
        short: s4
        card: {head: "1580年8月", body: "信長が光秀を真っ先に褒める"}
      - 語り: 丹波での光秀の働きは、天下の面目をほどこした、と。
        short: s4
      - 聞き: 天下の面目って、めちゃくちゃ褒めてるじゃん。
        short: s4
        tone: 明るい
      - 語り: 光秀のほうも、翌年の日付の、家臣の軍の決まり、《家中軍法》の終わりに、信長への感謝をこう書いています。
        short: s4
      - 人物: 「石ころのように落ちぶれていた身を、取り立てていただいた」
        who: 光秀
        short: s4
      - 聞き: 石ころって……。それ、本気で感謝してる人の言葉だよね。
        short: s4
        tone: しみじみ
      - 語り: ただ、この軍法には、本物ではない、という説もあります。福知山の神社に伝わり、市の文化財になっていますが、そこは割り引いて聞いてください。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
        short: s4
        card: {head: "1581年の日付", body: "家中軍法（本物かは議論あり）"}
        year: 1581
      - 語り: 光秀は、1578年ごろから坂本城で茶会を開いていました。そして変の5か月前、1582年の正月の茶会には、信長の自筆の書が掛けられていた、と茶会の記録にあります。
      - 聞き: 信長の書を飾るって、それだけ大事にしてたってことだよね。
        tone: 納得
      - 語り: ここまでの記録からは、主君と家臣の、いい関係しか見えてきません。
      - 聞き: じゃあ、なんでその直後に……？
        tone: 疑問
      - 語り: それを、あの日の朝から順に掘っていきます。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 本能寺の朝
    background: {image: paintings/akechi_atago_renga_ehon_taikoki.jpg, credit: "『絵本太閤記』光秀連歌の図（江戸後期の読み物の挿絵）"}
    portrait: null
    year: 1582
    lines:
      - 語り: 1582年の5月、光秀は、中国地方で毛利と戦う羽柴秀吉の、援軍に向かうよう命じられます。
        card: {head: "1582年5月", body: "秀吉の援軍を命じられる"}
      - 語り: 出発の少し前、光秀は京都の愛宕山に参り、連歌の会を開きました。《愛宕百韻》です。最初の句は、こうです。
      - 人物: 「ときは今 あめが下しる 五月かな」
        who: 光秀
      - 聞き: どういう意味？
        tone: 疑問
      - 語り: 「とき」を光秀の一族の「土岐」と読んで、土岐の者が天下を治める、という決意の句だ、という解釈があります。
      - 語り: ただ、これはあとから読み込んだ見方で、そう詠んだという証拠はありません。同じころ、光秀は毛利攻めの準備の書状も出しています。
      - 語り: 『信長公記』には、このとき光秀が、くじを二度三度と引いた、という噂も書かれています。何が出たのかは、書かれていません。
      - 聞き: あとから読むと、全部それっぽく見えちゃうやつだ。
        tone: 納得
      - 語り: 6月1日の夕方、光秀は、およそ1万3000の兵を連れて、丹波の亀山城を出ました。表向きは、西の備中へ向かう出陣です。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        card: {head: "6月1日の夕方", body: "1万3000の兵で亀山城を出る"}
      - 語り: ところが軍は、京都のほうへ向かいます。夜明け前、桂川を渡るところで、鉄砲の火縄に火をつけ、戦いの支度をするよう命じたとされます。
      - 聞き: ここで「敵は本能寺にあり」って言ったことになってるんだよね。
        tone: 疑問
      - 語り: はい。でも、その場にいた兵の記録は、ちがう朝を伝えています。
      - 語り: 本能寺へ向かった明智軍の一兵、本城惣右衛門が、80歳を過ぎてから書いた覚書があります。そこには、こうあります。
        short: s2
        card: {head: "本城惣右衛門覚書", body: "明智軍の一兵が晩年に書いた記録"}
      - 人物: 「家康様のことだとばかり思っていた。信長様とは、夢にも知らなかった」
        who: 本城
        short: s2
      - 聞き: 本人の字で読むと、ほんとに何も知らされてなかったんだ。あーし、ちょっとゾッとした。
        short: s2
        tone: しみじみ
      - 語り: 本城は、本能寺がどこにあるのかも知らなかった、と書いています。
        short: s2
      - 聞き: でも、80歳過ぎてからの思い出でしょ？ 記憶ちがいもありそう。
        short: s2
        tone: 疑問
      - 語り: そのとおりです。細かいところは割り引いて読む必要があります。ただ、宣教師のフロイスも、兵の中には家康を討つのではと思った者がいた、と書いています。
        short: s2
      - 聞き: じゃあ、兵の前で「敵は本能寺にあり」って叫ぶ場面は、なかったのかもしれないんだ。
        tone: 納得
      - 語り: 6月2日の明け方、明智軍は本能寺を囲みました。西暦では、1582年6月21日です。
        background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《真書太閤記 本能寺焼討之図》1893年（後世の想像図）"}
        card: {head: "1582年6月2日", body: "本能寺の変（西暦で6月21日）"}
      - 語り: 本城の覚書によれば、本能寺の門は開いていて、中には、ねずみ一匹ほどのものもいなかったそうです。
      - 聞き: 信長さん、ほとんど守りがなかったんだ。
        tone: 疑問
      - 語り: このとき信長は、少ない供だけで京都に泊まっていました。
      - 語り: 信長の家臣、太田牛一が書いた《信長公記》には、このときの信長の様子が書かれています。逃げのびた女性たちから聞いた話をもとにした記録です。
      - 語り: 騒ぎに気づいた信長は、誰の企てかと尋ね、明智の者だと聞くと、こう言ったとあります。
        portrait: {image: paintings/nobunaga_chokoji_bust.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵）"}
      - 人物: 「是非に及ばず」
        who: 信長
      - 聞き: 是非に及ばずって、どういう意味？
        tone: 疑問
      - 語り: 「あれこれ言ってもしかたがない」というような意味です。信長は本能寺で最期を迎え、遺体は見つかりませんでした。同じ日、京都にいた長男の信忠も、命を落とします。
        tone: 重い
      - 聞き: 有名な一言は、光秀じゃなくて、信長の側に残ってたんだ。
        portrait: null
        tone: しみじみ
      - 語り: では、光秀はなぜ、そこまでしたのか。残っている説を掘ってみましょう。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: なぜ討ったのかを掘る
    background: {image: paintings/akechi_nobunaga_strikes_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》信長が光秀を打つ場面（1883年、後世の創作）"}
    portrait: null
    year: 1582
    lines:
      - 語り: いちばん有名なのは、恨みの説です。光秀は信長に何度も恥をかかされ、恨みが積もっていた、という話です。
        short: s5
      - 聞き: それそれ。頭をたたかれたとか、そういう話。
        short: s5
        tone: 明るい
      - 語り: 欄干に頭をこすりつけられた、という話は、『祖父物語』という本が出どころです。信頼度の低い書物とされています。
        short: s5
      - 語り: 家康の接待で、魚が腐っていると叱られて役を外された、という話は『川角太閤記』。どちらも、事件からかなりあとの本です。
        short: s5
        card: {head: "恨みの逸話", body: "多くは後の時代の書物が出どころ"}
      - 語り: 母を人質に出したのに、信長が約束を破ったせいで母が殺された、という話も、江戸時代の『総見記』が出どころです。
      - 語り: 宣教師のフロイスは、信長が光秀を足で蹴ったことがある、と書いています。ただ、これも伝え聞いた話です。
        short: s5
      - 聞き: 信長は光秀を、天下の面目って褒めてたのに。恨みの話とは、合わないよね。
        short: s5
        tone: 納得
      - 語り: 当時の確かな記録で分かるのは、むしろ、信長が光秀を高く買っていた姿です。
        short: s5
      - 語り: 次は、天下を取りたかったという、野望の説。愛宕山の句を、その宣言と読む説です。でも、さっき見たとおり、これは読み方しだいです。
      - 聞き: 証拠になるほどじゃない、と。
        tone: 納得
      - 語り: 誰かに操られていた、という黒幕の説もたくさんあります。朝廷、秀吉、家康、宣教師。でも、どれも、それを示す史料がありません。
        card: {head: "黒幕説", body: "示す史料がない"}
      - 聞き: 黒幕って、話としては面白いんだけどな。
        tone: 笑い
      - 語り: 追い出された将軍、足利義昭を京都に戻すためだった、という説もあります。2017年、変のあとに光秀が書いた手紙の原本が確かめられ、そこに義昭の京都入りの話が出てくるからです。
      - 語り: ただ、これは変のあとの手紙で、討った理由の証拠とまでは言えない、という見方もあります。
      - 聞き: 手紙が一通見つかるたびに、説が動くんだね。
        tone: 納得
      - 語り: 本能寺の変の動機で、近年有力とされる説の一つが、四国の説です。
        background: {image: paintings/nobunaga_letter_to_nene.jpg, credit: "織田信長がねねに宛てた手紙（1576年ごろ）"}
        short: s8
      - 聞き: 四国？ 京都の事件なのに？
        short: s8
        tone: 疑問
      - 語り: 光秀は、四国の長宗我部元親と、信長の間をつなぐ役目をしていました。重臣の斎藤利三が、元親と親戚だったからです。
        short: s8
      - 語り: ところが信長は、元親への方針を変えて、四国を攻めると決めます。その出発の予定が、ちょうど6月2日ごろでした。
        short: s8
        card: {head: "四国攻め", body: "出発の予定は6月2日ごろ"}
      - 聞き: え、本能寺の変と同じころ！？
        short: s8
        tone: 驚き
      - 語り: そして2014年、岡山で公表された古い文書の中に、変の10日前に元親が斎藤利三に送った手紙があったんです。
        short: s8
        card: {head: "2014年", body: "林原美術館と岡山県立博物館が公表"}
        icon: envelope-simple
      - 語り: 手紙で元親は、信長の命令におおむね従う、と伝えていました。それでも、四国攻めは止まりませんでした。
        short: s8
      - 聞き: 仲を取り持ってた光秀さんは、板ばさみで立場がなくなる……。
        short: s8
        tone: しみじみ
      - 語り: そういう事情が、見えてきたんです。
      - 語り: ただ、これも、討った理由を直接書いたものではありません。
        short: s8
      - 語り: もう一つ、細かい計画はなかった、という見方もあります。変のあと、親戚や仲間に味方を頼んでも断られていて、天下を治める準備が見えないからです。
      - 聞き: 信長が手薄な今しかない、って、急に決めた感じ？
        tone: 疑問
      - 語り: そう考える研究者もいます。今は、光秀自身が決めたことで、その背景に四国のことがあった、という見方が強まっています。それでも、決着はついていません。
        card: {head: "研究の今", body: "四国説は有力な説の一つ。決め手はない"}
      - 聞き: 結局、討った理由を、本人ははっきり書き残してないんだ。あーし、そこがいちばんモヤモヤする。
        tone: しみじみ
      - 語り: ただ、変のあとの光秀の考えがうかがえる手紙は、残っています。光秀が11日間で何をしたのか、追ってみましょう。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 11日間の天下
    background: {image: paintings/nobunaga_rakuchu_uesugi_left.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）左隻"}
    portrait: null
    year: 1582
    lines:
      - 語り: 変の3日後、6月5日。光秀は、信長の安土城に入り、城にあった財宝を、家臣たちに分け与えました。
        card: {head: "6月5日", body: "安土城に入る"}
      - 語り: 6月9日には京都に入り、朝廷に銀500枚を贈っています。京都の大きなお寺にも、それぞれ銀を贈りました。公家の吉田兼見の日記に、そう書かれています。
        card: {head: "6月9日", body: "朝廷に銀500枚を贈る"}
      - 聞き: まずはお金で、味方を増やそうとしたんだ。
        tone: 納得
      - 語り: 京都の町の税を免除した、という記録もあります。都の人たちの心をつかもうとしたんですね。
      - 語り: 同じ6月9日、光秀は、盟友の細川藤孝と、その息子の忠興に、味方になってほしいと手紙を書きます。忠興の妻は、光秀の娘の玉でした。
        portrait: {image: paintings/akechi_tadaoki_portrait.jpg, caption: "細川忠興（江戸時代の肖像画）"}
        card: {head: "6月9日", body: "細川父子へ光秀の手紙"}
      - 語り: その手紙には、こんな一節があります。
      - 人物: 「50日か100日のうちに近くの国を固めたら、あとは息子の十五郎や、与一郎どのに譲って、身を引くつもりだ」
        who: 光秀
      - 聞き: 与一郎って？
        tone: 疑問
      - 語り: 手紙を受け取る、忠興のことです。自分の息子と、細川の息子に任せて身を引く、と誘っているんです。
      - 聞き: 天下を取りたかった人の言葉には、聞こえないね。
        tone: 納得
      - 語り: そう読む研究者もいます。この手紙は光秀の自筆とされ、今は重要文化財になっています。
      - 聞き: で、細川さんは、味方してくれたの？
        tone: 疑問
      - 語り: しませんでした。親戚の細川も、大和の筒井順慶も、光秀には味方しなかったんです。娘の玉は、そのあと、しばらく人目を離れて暮らすことになった、と伝えられます。
      - 聞き: 娘の嫁ぎ先にまで断られるの、つらすぎる。
        tone: しみじみ
      - 語り: 一方、備中で毛利と戦っていた秀吉は、すぐに和睦して、大急ぎで京都へ引き返してきました。
        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（高台寺蔵の肖像画）"}
        figure: {type: map, title: 秀吉の引き返し, bounds: [133.4, 136.2, 34.2, 35.4], route: [備中高松, 姫路, 尼崎, 山崎], places: [[備中高松, 133.82, 34.70], [姫路, 134.69, 34.83], [尼崎, 135.42, 34.73], [山崎, 135.68, 34.89], [京都, 135.77, 35.01]], note: およそ230kmを10日ほどで}
      - 聞き: 早っ！ 秀吉さん、準備よすぎない？
        tone: 驚き
      - 語り: およそ230キロを、10日ほどで戻ってきました。「中国大返し」と呼ばれます。光秀にとっては、思っていたよりずっと早かったはずです。
      - 聞き: 味方は集まらない、敵はすぐ戻ってくる。あーしだったら、もう頭が真っ白。
        tone: しみじみ
      - 語り: 6月13日、京都の南、山崎で、両軍はぶつかります。秀吉の軍がおよそ2万7000、明智軍がおよそ1万7000。数には諸説あります。
        background: {image: paintings/akechi_yamazaki_sadahide_met.jpg, credit: "歌川貞秀《山崎大合戦之図》19世紀中ごろ"}
        portrait: null
        short: s6
        card: {head: "6月13日", body: "山崎の戦い"}
        figure: null
      - 語り: 光秀は敗れ、近くの城に退いたあと、夜に坂本へ向かって抜け出しました。
        short: s6
      - 語り: そして、その途中で、土地の者に襲われて命を落とします。
        short: s6
        tone: 重い
        card: {head: "6月13日の夜〜14日", body: "坂本へ向かう途中で命を落とす"}
      - 聞き: 竹やぶでやられた、って聞いたことあるけど。
        tone: 疑問
      - 語り: 場所は、当時の記録でも、醍醐のあたりとも、山科とも書かれていて、はっきりしません。小栗栖の竹やぶ、という決まった場所は、後の言い伝えです。
      - 語り: 坂本城に戻った一族の明智秀満は、城に火を放ち、明智の一族はここで最期を迎えました。重臣の斎藤利三も捕らえられ、京都で処罰されています。
      - 語り: よく「三日天下」と言いますね。でも、本能寺の変が6月2日、山崎の戦いが13日。実際には、およそ11日でした。
        short: s6
        card: {head: "三日天下", body: "実際は約11日"}
      - 聞き: 三日じゃなかったんだ。短いってことのたとえか。
        short: s6
        tone: 納得
      - 語り: はい。光秀が亡くなった年は、数えで、1528年生まれの説なら55歳、1516年生まれの説なら67歳です。
      - 聞き: どっちにしても、遅咲きの人だったんだね。
        tone: しみじみ
      - 語り: ただ、光秀の話は、ここで終わりませんでした。生きのびて別人になった、という伝説まで生まれます。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 天海説と、名君の伝説
    background: {image: paintings/nobunaga_hiei_kyosai.jpg, credit: "河鍋暁斎《東海道名所之内 比叡山》1863年"}
    portrait: null
    year: 1582
    lines:
      - 語り: 光秀は、実は生きのびて、天海という僧になった。そんな説があります。
        short: s7
      - 聞き: 天海って、誰？
        short: s7
        tone: 疑問
      - 語り: 徳川家康のそばで、知恵袋として働いたお坊さんです。100歳を超えるまで生きたとされます。
        short: s7
      - 語り: 根拠とされるのは、日光に「明智平」という地名があること。比叡山の灯籠に「光秀」という名前が刻まれていること。そして、2代将軍の秀忠の「秀」の字は、光秀から取った、という話です。
        short: s7
      - 聞き: それっぽい！ あーし、ちょっと信じかけた。
        short: s7
        tone: 明るい
      - 語り: ところが、明智平を天海が名づけたという史料はありません。光秀という名前も、珍しくありません。秀忠の「秀」は、豊臣秀吉からもらった字です。
        short: s7
        card: {head: "天海説", body: "根拠とされる話はどれも成り立たない"}
      - 聞き: 全部、くずれた……。
        short: s7
        tone: 笑い
      - 語り: そもそも光秀が6月13日から14日にかけて亡くなったことは、当時の記録に書かれています。天海説は、伝説として扱われています。
        short: s7
      - 語り: では、光秀が治めた土地では、どう語られてきたのでしょう。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
      - 語り: 京都府の福知山市は、光秀が町の人の税を免除した、と紹介しています。川の流れを変えて洪水を防いだ、という話も伝わっています。
      - 聞き: そっちは名君なんだ。
        tone: 疑問
      - 語り: ただ、福知山の税を免除したことを示す光秀自身の文書は、確認されていません。川の話も、言い伝えの扱いです。
      - 聞き: 名君の話も、全部が記録ってわけじゃないのか。
        tone: 納得
      - 語り: 確かな記録もあります。福知山の御霊神社は、1705年、町の人たちの願いで、光秀をまつることが許されたのが始まりです。
        card: {head: "1705年", body: "福知山で光秀をまつる神社"}
        year: 1705
      - 聞き: 1705年って、変から120年以上あとだよね。
        tone: 疑問
      - 語り: はい。謀反人とされた光秀を、120年たっても、まつりたいと願った町の人たちがいた。これは記録で確かめられる事実です。
      - 語り: 城下町を開いた亀岡では、今も光秀にちなんだお祭りが開かれています。坂本の西教寺には、光秀と一族の墓があります。
      - 聞き: 悪く言われる場所と、大事にされる場所があったんだ。
        tone: しみじみ
      - 語り: 2020年には、光秀が主人公の大河ドラマも作られました。光秀が主役になったのは、これが初めてです。
      - 語り: では、最後の層です。言ってもいない一言が、なぜ光秀の代名詞になったのか。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：その一言は、誰の言葉か
    background: {image: paintings/akechi_mitsuhide_kabuki_kunichika_1890.jpg, credit: "豊原国周《太閤記十段目》光秀を演じる市川団十郎（1890年、芝居の絵）"}
    portrait: null
    year: 1641
    lines:
      - 語り: あの一言が、光秀の言葉として定着するまでには、大きく3つの段階があったと、僕は見ています。
      - 聞き: 3つ？ 順番に聞かせて。
        tone: 疑問
      - 語り: 一つ目は、言葉より先に、裏切り者という像ができたことです。変のあと、天下を取ったのは秀吉でした。秀吉の周りでは、光秀を、主君を討った逆臣として描く記録が作られていきます。
        card: {head: "段階1", body: "勝った側が「逆臣」として描く"}
      - 聞き: 勝った人が歴史を書く、ってやつだ。
        tone: 納得
      - 語り: 江戸時代になると、主君への忠義を何より大事にする考えが広まります。主君を討った光秀は、謀反人の代表になりました。
      - 語り: 二つ目は、書物に言葉が書かれたことです。変からおよそ60年後、1641年ごろ、学者の林羅山がまとめた信長の伝記に、「敵は本能寺にあり」と、ほぼ同じ言葉が出てきます。
        card: {head: "段階2", body: "約60年後、伝記に言葉が出る"}
      - 聞き: 60年後に、いきなり出てくるんだ。どこから持ってきたんだろう。
        tone: 疑問
      - 語り: それは分かっていません。そのあと、元禄のころの軍記物『明智軍記』にも、「敵は四条本能寺、二条城にあり」という形で書かれました。
        figure: {type: bars, title: 本能寺の変から何年後に書かれたか, bars: [[林羅山の伝記（1641年ごろ）, 59], [明智軍記（元禄のころ）, 110], [日本外史（1827年献上）, 245]], labels: ["約60年後", "約110年後", "約245年後"]}
      - 語り: 芝居では、名前を武智光秀と変えて、主君に追いつめられた悲劇の主人公としても演じられました。
      - 聞き: 悪役だけじゃなかったんだ。あーし、そっちのほうが気になる。
        tone: 疑問
      - 語り: 悪役でも、悲劇の主人公でも、見せ場には強い一言が似合います。そして、三つ目です。
        figure: null
      - 語り: 1827年、頼山陽という学者が、《日本外史》という歴史書を献上します。そこに「吾が敵は本能寺に在り」と書かれました。
        short: s1
        card: {head: "段階3", body: "1827年『日本外史』で広まる"}
        year: 1827
      - 語り: この本は、幕末から明治にかけて、たくさんの人に読まれました。
      - 語り: こうして、変からおよそ250年後に、この一言は、誰もが知る決まり文句になったんです。
        short: s1
      - 聞き: 250年……。伝言ゲームどころじゃない。
        short: s1
        tone: 驚き
      - 語り: ここで、もう一度、記録に残った言葉を並べてみましょう。信長は「是非に及ばず」。兵は「信長様とは夢にも知らなかった」。
      - 語り: そして光秀は、変のあとには、自分の息子や忠興に譲って「身を引く」と書きました。
      - 聞き: どれも、「敵は本能寺にあり」みたいな、かっこいい決めぜりふじゃない。
        tone: しみじみ
      - 語り: 物語には、決めぜりふが要ります。主君を討つ場面には、それにふさわしい一言が、あとから用意されたのかもしれません。
      - 語り: 一方で、記録からは、教養があって、事務にも強い武将の姿も見えてきました。
      - 聞き: 裏切り者の一言も、名君の言い伝えも、あとから付いたものが混ざってる。じゃあ、本当の光秀さんは？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。生まれた年も分からない、低い身分から出発し、医術も、連歌も、事務もこなして、15年ほどで34万石の大名になった人。
      - 語り: 信長から天下の面目と褒められ、信長の書を茶会に掛けたその年に、主君を討ち、本当の理由を書き残さないまま、11日で命を落とした人。
        tone: しみじみ
      - 聞き: 有名な一言の下には、本当の理由を残さなかった人がいた、ってことか。
        tone: しみじみ
      - 語り: つむぎさんの言うとおりだと思います。光秀が何を考えていたのかは、今も分かりません。分からないからこそ、後の時代の人が、言葉を足していったんでしょう。
        tone: しみじみ
      - 聞き: 言ってない一言で、440年以上覚えられてるって、ちょっと気の毒かも。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、その光秀に討たれた、織田信長。「古い権威を壊した革命児」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

