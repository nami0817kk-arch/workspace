sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：「敵は本能寺にあり」
    background: {image: TODO, credit: TODO}
    portrait: {image: TODO, caption: TODO, age: false}
    year: 1582
    lines:
      - 語り: 「敵は本能寺にあり」。主君を討つと決めた男が、兵に向かって言い放った言葉です。
        short: s1
        tone: 強調
      - 聞き: 知ってる！ 明智光秀でしょ。裏切り者の代名詞みたいな人。
        tone: 明るい
      - 語り: そうです。1582年、光秀は京都の本能寺で、主君の織田信長を討ちました。
      - 聞き: で、その前に「敵は本能寺にあり」って叫んだんだよね。かっこいい場面。
        short: s1
        tone: 明るい
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: え、まさか、その一言も……？
        short: s1
        tone: 疑問
      - 語り: はい。本能寺の変のころの記録に、光秀がこの言葉を言ったという記録は、ありません。
        short: s1
        card: {head: "1582年", body: "「敵は本能寺にあり」の記録はない"}
      - 聞き: うそでしょ！？ あんなに有名なのに。
        short: s1
        tone: 驚き
      - 語り: しかも、本能寺へ向かった兵の一人が、のちにこう書き残しています。自分たちは、徳川家康を討ちに行くのだと思っていた、と。
        short: s2
      - 聞き: 兵の人たち、信長を討つって知らなかったの？
        short: s2
        tone: 疑問
      - 語り: そう書かれています。かっこいい一言どころか、兵には行き先も告げていなかったかもしれないんです。
        short: s2
      - 聞き: じゃあ、あの一言は、誰がいつ言わせたの？
        tone: 疑問
      - 語り: それが今日の一番の掘りどころです。もう一つ、そもそも光秀は、なぜ信長を討ったのか。
      - 聞き: 信長にいじめられてた恨み、って聞いたことあるけど。
        tone: 疑問
      - 語り: それも掘ります。まずは、光秀という人が、どこから来たのかから。
      - 聞き: 了解。あーし、今日はヘルメットのひも、きつめに締めとく。
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: 名前のない前半生
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1566
    lines:
      - 語り: 明智光秀は、いつ生まれたのか。実は、分かっていません。
        short: s3
      - 聞き: え、有名人なのに？
        short: s3
        tone: 疑問
      - 語り: 1528年という説と、1516年という説があります。12年もちがうんです。どちらも、光秀が亡くなってから100年ほどあとの書物が出どころです。
        short: s3
      - 聞き: 12年って、小学生が大人になっちゃう差じゃん。
        short: s3
        tone: 笑い
      - 語り: 生まれは、美濃、今の岐阜県の、土岐氏という名門の一族とされます。当時の公家の記録にも、土岐の一族だと書かれています。
      - 語り: ただ、父の名前も、生まれた場所も、はっきりしません。若いころの暮らしも、ほとんど分かっていないんです。
      - 語り: 越前、今の福井県のお寺の門前に、10年ほど住んでいた、という話も伝わっています。でも、これも後の時代の書物や、お寺の言い伝えです。
      - 聞き: 有名な人なのに、若いころは言い伝えばっかり。
        tone: 納得
      - 聞き: じゃあ、記録に初めて出てくるのは、いつ？
        short: s3
        tone: 疑問
      - 語り: 1566年の、医術の本の写しです。『針薬方』という本で、明智十兵衛という人が語った医術を書き写した、とあります。
        short: s3
        card: {head: "1566年", body: "医術書『針薬方』に名前が出る"}
        icon: first-aid-kit
      - 聞き: 医術って、お医者さん！？ 戦国武将なのに？
        short: s3
        tone: 驚き
      - 語り: 中身は、お産の手当てや、刀の傷の手当てなどです。この本が見つかったのは、2014年。熊本の古い家に残っていました。
        short: s3
      - 聞き: 2014年って、すごい最近。まだ見つかるものがあるんだ。
        tone: 納得
      - 語り: 光秀が医者として暮らしていたのかは分かりません。でも、医術の知識を持つ人だったことは見えてきます。
      - 語り: もう一つの手がかりは、室町幕府の役人の名簿です。将軍の身辺を守る《足軽衆》の、いちばん最後に「明智」とあります。
        card: {head: "幕府の名簿", body: "足軽衆の末尾に「明智」"}
      - 聞き: いちばん最後……。それって、偉くない人の場所？
        tone: 疑問
      - 語り: そう見られています。名門の一族とはいえ、出発点は、かなり低い身分だったようです。
      - 聞き: 名前もはっきりしない人が、あの信長の重臣になるんだ。
        tone: しみじみ
      - 語り: そうです。そのきっかけは、二人の主君でした。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 二人の主君
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1568
    lines:
      - 語り: 1568年、足利義昭という人が、織田信長に担がれて京都へ上ります。のちに、室町幕府の最後の将軍になる人です。
        card: {head: "1568年", body: "足利義昭と信長が京都へ"}
      - 聞き: 二人の主君って、この二人のこと？
        tone: 疑問
      - 語り: そうです。光秀は、将軍の義昭と、信長の両方に仕える形で、京都の政治にかかわっていきます。
        figure: {type: people, title: 光秀をめぐる人々, nodes: [[明智光秀, 二人に仕える], [足利義昭, 最後の将軍], [織田信長, 主君], [細川藤孝, 光秀の盟友], [豊臣秀吉, 同じ信長の家臣]], edges: [[明智光秀, 足利義昭, 仕える], [明智光秀, 織田信長, 仕える], [織田信長, 足利義昭, 京都へ担ぐ], [明智光秀, 細川藤孝, 娘を嫁がせる], [豊臣秀吉, 明智光秀, 出世を争う]]}
      - 聞き: 社長と会長の両方の秘書、みたいな？ あーしなら胃が痛くなる。
        tone: 笑い
      - 語り: いいたとえです。光秀は、京都の町の訴えをさばいたり、公家とのやりとりをしたり、事務の仕事でも力を発揮しました。
      - 聞き: 戦うだけじゃなくて、事務もできる人だったんだ。
        tone: 納得
        figure: null
      - 語り: 1571年、信長は、比叡山の延暦寺を焼き討ちにします。光秀も、この戦いに加わりました。
        card: {head: "1571年", body: "比叡山の焼き討ち"}
      - 語り: そのあと光秀は、比叡山のふもと、近江の坂本を与えられ、琵琶湖のほとりに坂本城を築きます。
        card: {head: "1571年", body: "坂本城を築く（約5万石）"}
      - 聞き: お城を任されたんだ！ 名簿のいちばん最後だった人が。
        tone: 驚き
      - 語り: 信長の家臣の中で、いちばん早く城を持った一人と言われます。宣教師のフロイスは、坂本城を、安土城に次ぐ立派な城だと書いています。
      - 聞き: 外国の人から見ても、すごいお城だったんだ。
      - 語り: 1573年には、戦で亡くなった家臣18人のために、坂本の西教寺に米を納めています。その名簿には、名字のない、身分の低い奉公人まで書かれているんです。
        card: {head: "1573年", body: "亡くなった家臣18人の供養"}
      - 聞き: 身分の低い人まで……。家来思いの人だったのかな。
        tone: しみじみ
      - 語り: その寄進状は、今も西教寺に残っています。
      - 語り: 家族の話も少し。妻の煕子は、1576年に坂本城で病気で亡くなっています。
      - 語り: 貧しかったころ、妻が自分の黒髪を売って光秀を支えた、という話も有名です。ただ、これは言い伝えで、記録では確かめられません。
      - 聞き: いい話なのに、そこも言い伝えなんだ。
        tone: 納得
      - 語り: 娘の一人、玉は、のちに細川忠興に嫁ぎます。キリスト教の洗礼を受けて、細川ガラシャと呼ばれる人です。
      - 聞き: ガラシャって、光秀さんの娘だったんだ！
        tone: 驚き
      - 語り: ただ、このころ、二人の主君の仲が、決定的に壊れます。
      - 語り: 1573年、信長は義昭を京都から追い出しました。室町幕府は、ここで事実上終わります。
        card: {head: "1573年", body: "義昭が京都を追われる"}
      - 聞き: 光秀さんは、どっちについたの？
        tone: 疑問
      - 語り: 信長です。ここから光秀は、信長の家臣として、大きな仕事を任されていきます。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 丹波の5年と「天下の面目」
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1575
    lines:
      - 語り: 1575年、光秀は、丹波を攻めるよう命じられます。今の京都府の中部から兵庫県の東部にかけての山国です。
        card: {head: "1575年", body: "丹波攻めを命じられる"}
        figure: {type: map, title: 光秀の領地と京都, bounds: [134.6, 136.3, 34.6, 35.6], places: [[京都, 135.77, 35.01], [坂本, 135.87, 35.07], [亀山, 135.58, 35.01], [福知山, 135.13, 35.30], [山崎, 135.68, 34.89]], note: 京都をはさんで東に坂本、西に丹波}
      - 聞き: 京都のすぐ隣なんだ。
        tone: 納得
      - 語り: 京都を西と東からはさむ場所です。信長は、都のまわりを、光秀に任せたんですね。
      - 語り: ただ、丹波攻めは、すんなりとはいきませんでした。1576年の正月には、味方だった武将に裏切られて、光秀は逃げ帰っています。
        card: {head: "1576年", body: "裏切りにあい、敗走"}
        figure: null
      - 聞き: 光秀さんが、裏切られる側だったんだ。
        tone: 驚き
      - 語り: 丹波を平らげるまでに、およそ5年かかりました。そのあいだに、丹波の亀山に城を築き、城下町をつくっています。今の京都府亀岡市です。
        card: {head: "1579年", body: "丹波を平定"}
        year: 1579
      - 語り: 1580年、光秀は丹波一国を与えられます。坂本と合わせて、およそ34万石になりました。
        card: {head: "1580年", body: "丹波一国。合わせて約34万石"}
        year: 1580
        figure: {type: bars, title: 光秀の石高（石）, bars: [[坂本だけ（1571年）, 50000], [丹波と坂本（1580年）, 340000]], labels: ["約5万石", "約34万石"], note: 1石は大人1人が1年に食べる米の量}
      - 聞き: 34万石って、どのくらい？
        tone: 疑問
      - 語り: 1石は、大人1人が1年に食べる米の量です。34万人を1年養えるだけの土地、ということになります。
      - 聞き: 名簿のいちばん最後から、34万人分！ 今のお金だと、どのくらい？
        tone: 驚き
      - 語り: ざっくり言うと、当時の京都の日雇いの日当がおよそ100文。これを今の1万円とすると、米1石は5万円ほどです。34万石の米なら、およそ170億円になります。
        figure: {type: money, title: 34万石の米を今のお金にすると, then: "約34万石", yen: 17000000000, basis: "京都の日雇いの日当100文を今の1万円、米1石を500文とした目安。米の値段は大きく動き、年貢として入るのはその一部"}
      - 語り: 米の値段は大きく動くので、目安です。それに、領主の手元に入るのは、そのうちの年貢の分だけです。
        figure: null
      - 語り: この年、信長は、古くからの重臣を家から追い出す書状を書いています。その中で、手本にすべき家臣として、真っ先に光秀を挙げました。
        short: s4
        card: {head: "1580年8月", body: "信長が光秀を真っ先に褒める"}
      - 語り: 丹波での光秀の働きは、天下の面目をほどこした、と。
        short: s4
      - 聞き: 天下の面目って、めちゃくちゃ褒めてるじゃん。
        short: s4
        tone: 明るい
      - 語り: 光秀のほうも、翌年に定めた家臣の決まり、《家中軍法》の終わりに、信長への感謝をこう書いています。
        short: s4
      - 人物: 「川底に沈んだ石ころのような身を、取り立てていただいた」
        who: 光秀
        short: s4
      - 聞き: 石ころって……。それ、本気で感謝してる人の言葉だよね。
        short: s4
        tone: しみじみ
      - 語り: この軍法は、今も福知山の神社に伝わっていて、市の文化財になっています。ここまでの記録からは、主君と家臣の、いい関係しか見えてきません。
        card: {head: "1581年", body: "家中軍法に信長への感謝"}
        year: 1581
      - 語り: 同じ年の暮れには、家臣の礼儀の決まりも作っています。その中には、織田家の重臣に道で会ったら、脇によけて道をゆずれ、という決まりまであります。
      - 聞き: 自分の家来に、織田家の人を立てなさいって言ってるんだ。
        tone: 納得
      - 語り: 信長の家の中での立場を、とても気にしていたことがうかがえます。
      - 聞き: じゃあ、なんでその1年後に……？
        tone: 疑問
      - 語り: それを、あの日の朝から順に掘っていきます。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 本能寺の朝
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1582
    lines:
      - 語り: 1582年の5月、光秀は、中国地方で毛利と戦う羽柴秀吉の、援軍に向かうよう命じられます。
        card: {head: "1582年5月", body: "秀吉の援軍を命じられる"}
      - 語り: 出発の少し前、光秀は京都の愛宕山で、連歌の会を開きました。《愛宕百韻》です。最初の句は、こうです。
      - 人物: 「ときは今 あめが下しる 五月かな」
        who: 光秀
      - 聞き: どういう意味？
        tone: 疑問
      - 語り: 「とき」を光秀の一族の「土岐」と読んで、土岐の者が天下を治める、という決意の句だ、という解釈があります。
      - 語り: ただ、これはあとから読み込んだ見方で、そう詠んだという証拠はありません。同じころ、光秀は毛利攻めの準備の書状も出しています。
      - 聞き: あとから読むと、全部それっぽく見えちゃうやつだ。
        tone: 納得
      - 語り: 6月1日の夕方、光秀は、およそ1万3000の兵を連れて、丹波の亀山城を出ました。表向きは、西の備中へ向かう出陣です。
        card: {head: "6月1日の夕方", body: "1万3000の兵で亀山城を出る"}
      - 語り: ところが軍は、京都のほうへ向かいます。夜明け前、桂川を渡るところで、鉄砲の火縄に火をつけ、戦いの支度をするよう命じたとされます。
      - 聞き: ここで「敵は本能寺にあり」って言ったことになってるんだよね。
        short: s1
        tone: 疑問
      - 語り: そうです。でも、その場にいた兵の記録は、ちがう朝を伝えています。
        short: s2
      - 語り: 明智軍の一兵だった、本城惣右衛門という武士が、80歳を過ぎてから書いた覚書です。そこには、こうあります。
        short: s2
        card: {head: "本城惣右衛門覚書", body: "明智軍の一兵が晩年に書いた記録"}
      - 人物: 「家康様を討つのだとばかり思っていた。信長様とは、夢にも知らなかった」
        who: 本城
        short: s2
      - 聞き: 本当に知らなかったんだ……。あーし、鳥肌立ってきた。
        short: s2
        tone: 驚き
      - 語り: 本城は、本能寺がどこにあるのかも知らなかった、と書いています。ただ、ずっとあとの回想なので、細かいところは割り引いて読む必要があります。
        short: s2
      - 語り: 宣教師のフロイスも、兵の中には家康を討つのではと思った者がいた、と書いています。
      - 聞き: じゃあ、兵の前で「敵は本能寺にあり」って叫ぶ場面は、なかった可能性が高いんだ。
        tone: 納得
      - 語り: その日の明け方、6月2日。今の暦で6月21日です。明智軍は本能寺を囲みました。
        card: {head: "1582年6月2日", body: "本能寺の変（今の暦で6月21日）"}
      - 語り: 本城の覚書によれば、本能寺の門は開いていて、中には、ねずみ一匹ほどのものもいなかったそうです。
      - 聞き: 信長さん、ほとんど守りがなかったんだ。
        tone: 疑問
      - 語り: このとき信長は、少ない供だけで京都に泊まっていました。光秀にとっては、またとない時でした。
      - 語り: 信長の家臣、太田牛一が書いた《信長公記》には、このときの信長の様子が書かれています。逃げのびた女性たちから聞いた話をもとにした記録です。
      - 語り: 物音で目を覚ました信長は、誰の企てかと尋ね、明智の者だと聞くと、こう言ったとあります。
      - 人物: 「是非に及ばず」
        who: 信長
      - 聞き: 是非に及ばずって、どういう意味？
        tone: 疑問
      - 語り: 「あれこれ言ってもしかたがない」というような意味です。信長は本能寺で最期を迎え、遺体は見つかりませんでした。同じ日、京都にいた長男の信忠も討たれます。
        tone: 重い
      - 聞き: 有名な一言は、光秀じゃなくて、信長の側には残ってたんだ。
        tone: しみじみ
      - 語り: そうなんです。では、光秀はなぜ、そこまでしたのか。残っている説を掘ってみましょう。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: なぜ討ったのかを掘る
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1582
    lines:
      - 語り: いちばん有名なのは、恨みの説です。信長に何度も恥をかかされ、恨みが積もっていた、という話です。
        short: s5
      - 聞き: それそれ。頭をたたかれたとか、そういう話。
        short: s5
        tone: 疑問
      - 語り: 欄干に頭をこすりつけられた、という話は、『祖父物語』という本が出どころです。信頼度の低い書物とされています。
        short: s5
      - 語り: 家康の接待で、魚が腐っていると叱られて役を外された、という話は『川角太閤記』。どちらも、事件からかなりあとの本です。
        short: s5
        card: {head: "恨みの逸話", body: "どれも後の時代の書物が出どころ"}
      - 語り: 母を人質に出したのに、信長が約束を破ったせいで母が殺された、という話もあります。これも、江戸時代の『総見記』という本が出どころです。
        short: s5
      - 聞き: さっきの、天下の面目って褒めてた関係とは、合わないよね。
        short: s5
        tone: 納得
      - 語り: そうなんです。当時の記録で分かるのは、むしろ、信長が光秀を高く買っていた姿です。
        short: s5
      - 語り: 次は、天下を取りたかったという、野望の説。愛宕山の句を、その宣言と読む説です。でも、さっき見たとおり、これは読み方しだいです。
      - 聞き: 証拠になるほどじゃない、と。
        tone: 納得
      - 語り: 誰かに操られていた、という黒幕の説もたくさんあります。朝廷、秀吉、家康、宣教師。でも、どれも、それを示す史料がありません。
        card: {head: "黒幕説", body: "示す史料がない"}
      - 聞き: 黒幕って、話としては面白いんだけどな。
        tone: 笑い
      - 語り: 追い出された将軍、足利義昭を京都に戻すためだった、という説もあります。2017年、変のあとに光秀が書いた手紙の原本が確かめられ、そこに義昭の京都入りの話が出てくるからです。
      - 語り: ただ、これは変のあとの手紙で、討った理由の証拠とまでは言えない、という見方もあります。
      - 聞き: 手紙が一通見つかるたびに、説が動くんだね。
        tone: 納得
      - 語り: そんな中で、近年いちばん有力と言われているのが、四国の説です。
        short: s8
      - 聞き: 四国？ 京都の事件なのに？
        short: s8
        tone: 疑問
      - 語り: 光秀は、四国の長宗我部元親と、信長の間をつなぐ役目をしていました。光秀の重臣、斎藤利三の親戚が、元親の妻だったからです。
        short: s8
      - 語り: ところが信長は、元親への方針を変えて、四国を攻めると決めます。その出発の予定が、ちょうど6月2日ごろでした。
        short: s8
        card: {head: "四国攻め", body: "出発の予定は6月2日ごろ"}
      - 聞き: え、本能寺の変と同じ日！？
        short: s8
        tone: 驚き
      - 語り: そして2014年、岡山の美術館で、古い文書の束が公表されました。その中に、変の12日前に元親が斎藤利三に送った手紙があったんです。
        short: s8
        card: {head: "2014年", body: "変の12日前の元親の手紙が公表"}
        icon: envelope-simple
      - 語り: 手紙で元親は、信長の命令におおむね従う、と伝えていました。それでも、四国攻めは止まりませんでした。
        short: s8
      - 聞き: 仲を取り持ってた光秀さんは、板ばさみで立場がなくなる……。
        short: s8
        tone: しみじみ
      - 語り: そういう事情が、見えてきたんです。ただ、これも、光秀が討った理由を直接書いたものではありません。
      - 語り: もう一つ、細かい計画はなかった、という見方もあります。変のあと、親戚や仲間に味方を頼んでも断られていて、天下を治める準備が見えないからです。
      - 聞き: 信長が手薄な今しかない、って、急に決めた感じ？
        tone: 疑問
      - 語り: そう考える研究者もいます。ちなみに、宣教師のフロイスは光秀を、計略と策謀の達人、と書きました。ただ、キリスト教に好意的でなかった光秀を、変のあとに書いた評なので、割り引いて読む必要があります。
      - 語り: 研究者の多くは、光秀が自分で決めたことで、その背景に四国のことがあった、と見ています。それでも、決着はついていません。
        card: {head: "研究の今", body: "四国説が有力。でも決め手はない"}
      - 聞き: 結局、本人の口からは、何も残ってないんだ。
        tone: しみじみ
      - 語り: 本人が書いたものの中で、変のあとの気持ちが分かるものは、一つだけあります。それは、変から7日後の手紙でした。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 11日間の天下
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1582
    lines:
      - 語り: 6月9日、光秀は、盟友の細川藤孝と、その息子の忠興に、味方になってほしいと手紙を書きます。忠興の妻は、光秀の娘でした。
        card: {head: "6月9日", body: "細川父子へ光秀の自筆の手紙"}
      - 語り: その手紙には、こんな一節があります。
      - 人物: 「50日か100日のうちに近くの国を固めたら、あとは息子たちに譲って、身を引くつもりだ」
        who: 光秀
      - 聞き: 天下を取りたかった人の言葉には、聞こえないね。
        tone: 疑問
      - 語り: そう読む研究者もいます。この手紙は自筆で、今は重要文化財になっています。
      - 聞き: で、細川さんは、味方してくれたの？
        tone: 疑問
      - 語り: しませんでした。親戚の細川も、大和の筒井順慶も、光秀には味方しなかったんです。
      - 聞き: 娘の嫁ぎ先にまで断られるの、つらすぎる。
        tone: しみじみ
      - 語り: 一方、備中で毛利と戦っていた秀吉は、すぐに和睦して、大急ぎで京都へ引き返してきました。
        figure: {type: map, title: 秀吉の引き返し, bounds: [133.4, 136.2, 34.2, 35.4], route: [備中高松, 姫路, 尼崎, 山崎], places: [[備中高松, 133.82, 34.70], [姫路, 134.69, 34.83], [尼崎, 135.42, 34.73], [山崎, 135.68, 34.89], [京都, 135.77, 35.01]], note: およそ200kmを10日ほどで}
      - 聞き: 早っ！ 秀吉さん、準備よすぎない？
        tone: 驚き
      - 語り: およそ200キロを、10日ほどで戻ってきました。「中国大返し」と呼ばれます。光秀にとっては、思っていたよりずっと早かったはずです。
      - 聞き: 味方は集まらない、敵はすぐ戻ってくる。あーしだったら、もう頭が真っ白。
        tone: しみじみ
      - 語り: 6月13日、京都の南、山崎で、両軍はぶつかります。秀吉の軍がおよそ2万7000、明智軍がおよそ1万7000。数には諸説あります。
        short: s6
        card: {head: "6月13日", body: "山崎の戦い"}
        figure: null
      - 語り: 光秀は敗れ、近くの城に退いたあと、夜に坂本へ向かって抜け出しました。
        short: s6
      - 語り: そして、その途中、醍醐のあたりで、土地の者に襲われて命を落とします。これは、当時の公家の日記に書かれています。
        short: s6
        tone: 重い
        card: {head: "6月13日の夜", body: "醍醐のあたりで命を落とす"}
      - 語り: 坂本城に戻った一族の明智秀満は、城に火を放ち、明智の一族はここで最期を迎えました。重臣の斎藤利三も捕らえられ、京都で処罰されています。
      - 聞き: 竹やぶでやられた、って聞いたことあるけど。
        tone: 疑問
      - 語り: 小栗栖の竹やぶ、という場所は、後の時代の本と地元の言い伝えです。当時の日記には、醍醐のあたり、としか書かれていません。
      - 語り: よく「三日天下」と言いますね。でも、本能寺の変が6月2日、山崎の戦いが13日。実際には、およそ11日でした。
        short: s6
        card: {head: "三日天下", body: "実際は約11日"}
      - 聞き: 三日じゃなかったんだ。短いってことのたとえか。
        short: s6
        tone: 納得
      - 語り: はい。光秀が亡くなった年は、1528年生まれの説なら55歳、1516年生まれの説なら67歳です。
      - 聞き: どっちにしても、遅咲きの人だったんだね。
        tone: しみじみ
      - 語り: ただ、光秀の話は、ここで終わりませんでした。生きのびて別人になった、という伝説まで生まれます。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 名君の伝説と、天海説
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1582
    lines:
      - 語り: 光秀は、実は生きのびて、天海という僧になった。そんな説があります。
        short: s7
      - 聞き: 天海って、誰？
        short: s7
        tone: 疑問
      - 語り: 徳川家康のそばで、知恵袋として働いたお坊さんです。100歳を超えるまで生きたとされます。
        short: s7
      - 語り: 根拠とされるのは、日光に「明智平」という地名があること。比叡山の灯籠に「光秀」という名前が刻まれていること。そして、2代将軍の秀忠の「秀」の字は、光秀から取った、という話です。
        short: s7
      - 聞き: それっぽい！ あーし、ちょっと信じかけた。
        short: s7
        tone: 明るい
      - 語り: ところが、明智平を天海が名づけたという史料はありません。光秀という名前も、珍しくありません。秀忠の「秀」は、豊臣秀吉からもらった字です。
        short: s7
        card: {head: "天海説", body: "根拠とされる話はどれも成り立たない"}
      - 聞き: 全部、くずれた……。
        short: s7
        tone: 笑い
      - 語り: そもそも光秀が6月13日の夜に亡くなったことは、当時の日記に書かれています。天海説は、伝説として扱われています。
        short: s7
      - 語り: では、光秀が治めた土地では、どう語られてきたのでしょう。
        background: {image: TODO, credit: TODO}
      - 語り: 京都府の福知山では、光秀は、町の人の税を免除した、川の流れを変えて洪水を防いだ、と語り継がれています。
      - 聞き: そっちは名君なんだ。
        tone: 疑問
      - 語り: ただ、市の説明でも「とされる」「伝わる」という言い方です。税を免除したことを示す光秀の文書は、見つかっていません。
      - 聞き: また、言い伝えのほうか。
        tone: 納得
      - 語り: 確かな記録もあります。福知山の御霊神社は、1705年、町の人たちの願いで、光秀をまつることが許されたのが始まりです。
        card: {head: "1705年", body: "福知山で光秀をまつる神社"}
        year: 1705
      - 聞き: 1705年って、変から120年以上あとだよね。
        tone: 疑問
      - 語り: そうです。謀反人とされた光秀を、120年たっても、まつりたいと願った町の人たちがいた。これは記録で確かめられる事実です。
      - 語り: 城下町を開いた亀岡では、今も光秀にちなんだお祭りが開かれています。坂本の西教寺には、光秀と一族の墓があります。
      - 聞き: 悪く言われる場所と、大事にされる場所があったんだ。
        tone: しみじみ
      - 語り: 2020年には、光秀が主人公の大河ドラマも作られました。光秀が主役になったのは、これが初めてです。
      - 語り: では、最後の層です。言ってもいない一言が、なぜ光秀の代名詞になったのか。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：その一言は、誰の言葉か
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1641
    lines:
      - 語り: あの一言が光秀の言葉になっていった道筋は、大きく3つの段階に分けられると、僕は見ています。
      - 聞き: 3つ？ 順番に聞かせて。
        tone: 疑問
      - 語り: 一つ目は、勝った側の記録です。変のあと、天下を取ったのは秀吉でした。秀吉の周りでは、光秀を、主君を討った逆臣として描く記録が作られていきます。
        card: {head: "段階1", body: "勝った側が「逆臣」として描く"}
      - 聞き: 勝った人が歴史を書く、ってやつだ。
        tone: 納得
      - 語り: 江戸時代になると、主君への忠義を何より大事にする考えが広まります。主君を討った光秀は、謀反人の代表になりました。
      - 語り: 二つ目は、物語になったことです。変からおよそ60年後、1641年ごろの林羅山の本に、似た言い回しが初めて出てきます。
        short: s1
        card: {head: "段階2", body: "約60年後、物語に似た言葉が出る"}
      - 語り: さらに元禄のころ、『明智軍記』という軍記物に、「敵は四条本能寺、二条城にあり」という形で書かれました。
        short: s1
        figure: {type: bars, title: 本能寺の変から何年後に書かれたか, bars: [[林羅山の本（1641年ごろ）, 59], [明智軍記（元禄のころ）, 110], [日本外史（1827年）, 245]], labels: ["約60年後", "約110年後", "約245年後"]}
      - 聞き: 少しずつ、言葉ができあがっていくんだ。
        tone: 納得
      - 語り: 面白いことに、この『明智軍記』は、どちらかというと光秀の側に立って、同情的に描いた本です。それでも、決めぜりふは、こうして書き足されていきました。
      - 語り: そして三つ目。1827年、頼山陽という学者が《日本外史》という歴史書を書き上げます。そこに「吾が敵は本能寺に在り」と書かれました。
        short: s1
        card: {head: "段階3", body: "1827年『日本外史』で今の形に"}
        year: 1827
      - 語り: この本は、幕末から明治にかけて、たくさんの人に読まれました。こうして、変からおよそ250年後に、今の形の一言が、決まり文句になったんです。
        short: s1
        figure: null
      - 聞き: 250年……。伝言ゲームどころじゃない。
        short: s1
        tone: 驚き
      - 語り: ここで、もう一度、記録に残った言葉を並べてみましょう。信長は「是非に及ばず」。兵は「信長様とは夢にも知らなかった」。
      - 語り: そして光秀は、変の前には信長への感謝を書き、変のあとには「100日で身を引く」と書きました。
      - 聞き: どれも、「敵は本能寺にあり」みたいな、かっこいい決めぜりふじゃない。
        tone: しみじみ
      - 語り: そうなんです。物語には、決めぜりふが要ります。裏切りの場面には、裏切りにふさわしい一言が、あとから用意されたのかもしれません。
      - 語り: その後、研究が進むと、教養のある武将、領地を治める名手、という姿も知られるようになりました。
      - 聞き: 裏切り者の一言も、名君の言い伝えも、あとから付いたもの。じゃあ、本当の光秀さんは？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。生まれた年も分からない、低い身分から出発し、医術も事務もこなして、15年ほどで34万石の大名になった人。
      - 語り: 主君に感謝を書いたその1年後に、主君を討ち、理由を書き残さないまま、11日で命を落とした人。
        tone: しみじみ
      - 聞き: 有名な一言の下には、理由を誰にも言わなかった人がいた、ってことか。
        tone: しみじみ
      - 語り: つむぎさんの言うとおりだと思います。光秀が何を考えていたのかは、今も分かりません。分からないからこそ、後の時代の人が、言葉を足していったんでしょう。
        tone: しみじみ
      - 聞き: 地表の下、今日もちゃんと掘れた気がする。
        tone: 納得
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、その光秀に討たれた、織田信長。「古い権威を壊した革命児」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

