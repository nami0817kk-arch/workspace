# 事実の控え（2026-10-06。詳細は dev/output/rekishi-chiso/research/akechi_facts.md）
# - 「敵は本能寺にあり」：同時代の記録になし。林羅山『織田信長譜』（1641ごろ）「光秀曰、敵在本能寺」とほぼ同じ言葉、『明智軍記』（元禄ごろ）「敵は四条本能寺・二条城にあり」、頼山陽『日本外史』（1827献呈）「吾敵在本能寺矣」
# - 本城惣右衛門覚書（1640ごろ、80歳超）：「家康様だとばかり」「信長様とは夢にも」「本能寺がどこかも知らなかった」。フロイスも兵の疑いを記す
# - 生年：1528説（明智軍記）／1516説（当代記）。どちらも後年。土岐一族とみなされた（立入左京亮入道隆佐記）
# - 針薬方：永禄9年（1566）の写し、明智十兵衛尉、2014 米田家で発見
# - 永禄六年諸役人附：足軽衆の末尾に「明智」（後半は永禄10年ごろの内容とされる）
# - 1571 坂本城（約5万石）、フロイス「安土城に次ぐ」。1573 西教寺に戦死者18人の供養米（寄進状現存）
# - 1575 丹波攻め、1576正月 八上城の波多野が裏切り敗走、1579 丹波平定、1580 丹波拝領 約34万石
# - 1580年8月 佐久間信盛折檻状「丹波国、日向守働き、天下の面目をほどこし候」光秀・秀吉・池田恒興を手本に
# - 1581年6月2日 家中軍法、末尾「瓦礫沈淪」（福知山・御霊神社、市指定）→ 人物の行は今の言葉に
# - 1582年5月 秀吉の援軍の命令。5月28日（異説24日）愛宕百韻「ときは今 あめが下しる 五月かな」。解釈は説
# - 6月1日夕 約1万3000で亀山城を出る。桂川で火縄・足半の命（有力）
# - 6月2日（1582-06-21 ユリウス暦）本能寺。信長公記「是非に及ばず」（女房衆からの聞き取り）。遺体見つからず。信忠も
# - 怨恨：『祖父物語』（欄干）、『川角太閤記』（腐った魚）。四国説：石谷家文書 2014 林原美術館・岡山県立博物館公表、5月21日付元親→斎藤利三（変の10日前。天正10年5月は29日まで）。四国攻め出航予定6月2日ごろ（三男信孝）
# - 斎藤利三の親戚（兄の妻の妹の夫…）が元親：利三の兄・石谷頼辰の義妹が元親の妻 →「親戚が元親の妻だった」と簡略化（要確認）
# - 6月9日 細川藤孝・忠興宛の覚書（自筆とされる、永青文庫、重要文化財）「50日100日のうちに…十五郎（光秀の子）・与一郎（忠興）に譲って」
