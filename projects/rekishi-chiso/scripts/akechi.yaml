#   連歌50回あまり、茶会1578〜、変の5か月前の茶会に信長自筆の書（宗及茶会記）。ガラシャは味土野（丹後）で約2年（細川家の記録、有力）。
#   絵本太功記（1799）・時今也桔梗旗揚（1808）は武智光秀として同情的な悲劇。明智軍記の性格は見方が分かれる（呉座勇一は野心家として描くと見る）。
