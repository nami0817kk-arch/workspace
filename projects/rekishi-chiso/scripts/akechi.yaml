#   立入宗継は公家ではない。足軽衆は雑役の下級の侍。家中軍法は偽文書説あり、原文「瓦礫沈淪」。本城覚書は「家康様とばかり存候」（討つとは書かない）。
#   お金の100文は大工の日当、米1石500文は安い年の値（1591年は833文）。信長公記に「物音で目を覚ました」はない。フロイスに足蹴の伝聞。
