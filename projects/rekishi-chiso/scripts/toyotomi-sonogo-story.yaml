sections:
  # ================================================================ 序章（冒頭 約3分）。答え（豊臣家は本当に絶えたのか）はまとめまで言わない
  - title: 「豊臣家は、本当に絶えたのか」　秀頼の死から15日後
    lines:
      # 0〜10秒：誰でも知る一点（大坂城とともに滅んだ）→ 意外な一点（息子の最期の日取りは僧が暦で選んだ）。処刑の場面は描かない
      # fact: toyotomi-02, toyotomi-01
      - 語り: 豊臣家は、大坂城とともに滅んだ、と習います。けれど、秀頼が城で命を絶ってから15日後。その8歳の息子の、最期の日取りは、1人の僧が、暦で選んでいました。
        tone: 重い
        card: {head: "秀頼の死から15日後", body: 息子の最期の日取りを暦で選ぶ}
      # fact: toyotomi-28, toyotomi-31
      - 語り: それから30年。秀頼の娘が、鎌倉の尼寺で、子を持たないまま、亡くなります。
      # fact: toyotomi-17
      - 語り: そして、大坂の陣から353年後。九州の大名だった家の子孫が、本を出します。題は、『秀頼は薩摩で生きていた』。
        card: {head: "353年後の本", body: 秀頼は薩摩で生きていた}
      # fact: toyotomi-17
      - 語り: その家では、秀頼も、その子も生きていた、という話が、口伝えだけで、受け継がれてきた、というのです。
      # 答えの席＋約束
      - 語り: 豊臣家は、本当に、絶えたのか。その答えは、終わりに、記録で確かめます。
        tone: 疑問
      # fact: toyotomi-12, toyotomi-14
      - 語り: 1980年、大坂城の跡の発掘で、若い男性の頭の骨が、丁寧に埋められた形で、見つかりました。その骨は、いま、ある寺に、祀られています。
        card: {head: "1980年", body: 大坂城の跡の発掘}
      # fact: toyotomi-35, toyotomi-52
      - 語り: 秀吉を神として祀った、京都の神社は、名前を止められました。それでも、秀吉の姉は、豊臣家が滅んだあと、10年、生き続けます。
      - 語り: 豊臣の名と血は、どこへ行ったのか。
        tone: 疑問
        hook: true
      - 語り: 1615年の5月。焼け落ちた大坂城のあとに、豊臣の人は、誰が残っていたのか。
        hook: true

  # ================================================================ 第1章 1615年5月、残った人
  - title: 「豊臣の人は、誰が残ったのか」　1615年5月の大坂城
    lines:
      - 語り: 慶長20年、1615年の5月8日。大坂城で、豊臣秀頼と、母の淀殿が、亡くなりました。秀頼は、数えで23歳でした。
        card: {head: "1615年5月8日", body: 秀頼と淀殿が亡くなる}
      - 語り: 秀頼には、2人の子がいました。息子の国松と、娘。娘は、のちに、天秀尼と呼ばれます。2人とも、正室の千姫の子では、ありません。
      # fact: toyotomi-52, toyotomi-53
      - 語り: 秀吉と血のつながる人は、ほかにもいました。秀吉の姉、とも。この年、83歳。出家して、京都で暮らしていました。
        card: {head: "秀吉の姉・とも", body: 1615年に数え83歳}
      # fact: toyotomi-54
      - 語り: 姉のともの孫娘、完子は、京都の公家、九条家の妻になっていました。
      # fact: toyotomi-45, toyotomi-43
      - 語り: そして、秀吉の妻、ねねの実家、木下家。ねねの甥のうち、延俊は豊後の日出の大名として、利房は、この大坂の陣で、徳川の側に、ついていました。
        figure: {type: people, title: 1615年5月　豊臣のゆかりの人, nodes: [[豊臣秀頼, 5月8日に死去], [国松, 秀頼の息子], [天秀尼, 秀頼の娘], [とも, 秀吉の姉], [完子, ともの孫・九条家の妻], [木下家, ねねの実家]], edges: [[豊臣秀頼, 国松, 子], [豊臣秀頼, 天秀尼, 子], [とも, 完子, 孫]]}
      - 語り: 秀頼の息子と娘。秀吉の姉と、その孫娘。秀吉の妻の実家。豊臣の名と血は、まだ、あちこちに、散らばっていたのです。
        figure: null
      - 語り: なかでも、いちばん重く扱われたのが、秀頼の息子でした。
        hook: true
      - 語り: 国松。この子は、徳川の目を避けて、城の外で、育てられていました。
        hook: true

  # ================================================================ 第2章 国松の育ち。記録の食い違い①（母）
  - title: 「国松は、どこで育ったのか」　若狭と京極家
    lines:
      # fact: toyotomi-09, toyotomi-01
      - 語り: 家康のそばの記録、『駿府記』は、国松を8歳と書きます。そこから数えると、生まれは、慶長13年、1608年ごろです。
      # fact: toyotomi-05
      - 語り: 大坂の陣を語った聞き書き、『大坂御陣山口休菴咄』は、国松の母を、伊勢から奉公に出ていた女中、と書きます。
      # fact: toyotomi-08
      - 語り: ところが、『元寛日記』は、母を、成田五兵衛助近の娘とします。尾張の学者、天野信景の『塩尻』も、成田氏の娘と書きます。
        figure: {type: stats, title: 国松の母　記録の食い違い, items: [[山口休菴咄, 伊勢の女中, 奉公に出ていた], [元寛日記・塩尻, 成田氏の娘, 成田五兵衛助近]]}
      - 語り: 母の素性からして、記録は、そろわないのです。
        figure: null
      # fact: toyotomi-05
      - 語り: 育ったのは、若狭。いまの、福井県の西の端です。山口休菴咄によると、国松を預かったのは、若狭の大名、京極家でした。
        card: {head: "若狭", body: 国松が育った土地}
      # fact: toyotomi-08
      - 語り: 元寛日記は、淀殿の妹で、京極家の母、常高院のもとで育てられた、と書きます。そして、その理由を、関東、つまり、徳川を、はばかったため、としています。
        tone: 重い
      # fact: toyotomi-05
      - 語り: 山口休菴咄では、国松は、若狭の弥左衛門という者の、姉か妹で、夫を亡くしていた女性に、養子として、預けられました。
      # fact: toyotomi-06
      - 語り: 慶長19年、大坂冬の陣のころ。京極家は、国松を、長持、つまり、衣類を入れる大きな箱に入れて、大坂城へ、送り込んだ、と、山口休菴咄は伝えます。
        card: {head: "慶長19年", body: 長持に入れて大坂城へ}
      # fact: toyotomi-06
      - 語り: 箱には、「京極殿御道具」と、書き付けてあった、といいます。付き添ったのは、京極家の家臣、田中六左衛門と、育ての母でした。
      # fact: toyotomi-06
      - 語り: 冬の陣は、和睦で終わります。けれど、国松は、そのまま、大坂城に、残りました。
      - 語り: そして、翌年の5月、城は、落ちます。
        tone: 重い
        hook: true
      - 語り: その最期の日を決めたのは、1人の僧でした。
        hook: true

  # ================================================================ 第3章 5月23日の記録。食い違い②（伏見か若狭か）③（年齢）。処刑の場面は描かない
  - title: 「最期の日は、誰が選んだのか」　慶長20年5月23日の記録
    lines:
      # fact: toyotomi-03, toyotomi-07
      - 語り: 国松は、どこで、捕らえられたのか。家康のそばの記録、駿府記は、伏見で捕らえた、とします。
      # fact: toyotomi-03
      - 語り: ただ、京の公家、土御門泰重の日記は、処刑の翌日の記事に、国松は、若狭から都へ上った、と記します。
        figure: {type: stats, title: 国松はどこから来たのか, items: [[駿府記, 伏見で捕らえた, 家康のそばの記録], [土御門泰重の日記, 若狭から上った, 処刑の翌日の記事]]}
      # fact: toyotomi-02
      - 語り: 最期の日取りは、家康の側の意向として、本多正純が、家康のそばにいた僧、金地院崇伝に、問い合わせました。
        figure: null
      # fact: toyotomi-02
      - 語り: 崇伝の日記、『本光国師日記』の5月22日の条によると、崇伝は、暦で日の良し悪しを考え、翌23日がよい、時刻は、申と酉のあいだ、夕方がよい、と答えています。
        tone: 重い
      # fact: toyotomi-01
      - 語り: 『駿府記』によると、国松が、京都の六条河原で、命を絶たれたのは、その23日の、未の刻、昼すぎでした。
        card: {head: "1615年5月23日", body: 国松の最期（駿府記）}
      - 語り: 日は、崇伝の答えのとおり。時刻は、答えより、早いものでした。
      # fact: toyotomi-01
      - 語り: 『駿府記』が、乳母の夫と書く、田中六左衛門も、ともに、処刑されました。乳母は、許されています。
      # fact: toyotomi-07
      - 語り: 山口休菴咄によると、六左衛門は、いったん、若狭へ逃れていました。国松が捕らえられたと聞くと、自分から、板倉勝重の屋敷へ出向き、お供をしたい、と申し出た、といいます。
        tone: しみじみ
      - 語り: 板倉勝重は、京都所司代。幕府が京都に置いた、いちばん上の役人です。
      # fact: toyotomi-03, toyotomi-37
      - 語り: 豊国社の僧、梵舜は、日記に、見物の人々までが、哀れんだと聞いた、と記しました。
        tone: しみじみ
      # fact: toyotomi-09
      - 語り: 国松の年齢も、記録で、割れます。「8歳」「7歳」「6歳」「10歳ばかり」。記録によって、4通りです。
        figure: {type: stats, title: 国松の年齢　記録の食い違い, items: [[駿府記, 8歳, 家康のそばの記録], [元寛日記・寺の過去帳, 7歳, 江戸の記録], [落穂雑談一言集, 6歳, 後の世の逸話集], [村越道半覚書, 10歳ばかり, 覚書]]}
      # fact: toyotomi-09
      - 語り: いまの東京大学史料編纂所が編む史料集、『大日本史料』の編者は、7歳は、8歳の誤り、と注記しています。
        figure: null
      # fact: toyotomi-10
      - 語り: 6歳と書いた『落穂雑談一言集』は、後の世の逸話集です。家康は、高野山で出家させよ、と言ったが、正純の父、本多正信が止めた、とも伝えます。ただ、これは、逸話です。
      - 語り: 息子は、こうして、記録から消えました。もう1人、娘の行方は。
        tone: 疑問
        hook: true
      - 語り: 落城の翌年、1人のイギリス人が、その娘のことを、日記に、書きとめていました。
        hook: true

  # ================================================================ 第4章 天秀尼と東慶寺（既出の寺例書・再建・会津の一件・縁切寺は使わない）
  - title: 「秀頼の娘は、尼寺で何を残したのか」　鎌倉の東慶寺
    lines:
      # fact: toyotomi-24
      - 語り: 1616年、イギリス商館長の、リチャード・コックスは、鎌倉を通ったとき、日記の余白に、こう書き留めています。
        card: {head: "1616年", body: コックスの日記の余白}
      # fact: toyotomi-24
      - 語り: 秀頼様の小さな娘が、命を助けるためだけに、尼にされて、この寺にいる。ここは、駆け込みの場で、役人も、連れ出せない、と。
        tone: しみじみ
      # fact: toyotomi-21, toyotomi-23
      - 語り: 娘は、慶長14年、1609年の生まれとされます。大坂城が落ちたとき、数えで7歳でした。
      # fact: toyotomi-25
      - 語り: 東慶寺の年表と、寺の過去帳によると、元和元年、1615年。家康の命で、19世の住職、瓊山法清の弟子となりました。
      # fact: toyotomi-26
      - 語り: 法名は、天秀法泰。やがて20世の住職となり、平凡社の世界大百科事典は、東慶寺の中興開山、寺を立て直した人と伝える、と書きます。
        card: {head: "天秀法泰", body: 東慶寺の20世}
      # fact: toyotomi-27
      - 語り: 寛永19年、1642年。天秀尼は、父、秀頼の菩提を弔うために、雲板を鋳造しました。雲板とは、寺で合図に打つ、青銅の板です。
        card: {head: "1642年", body: 父・秀頼のために雲板を鋳る}
      - 語り: 大坂城が落ちてから、27年。天秀尼は、34歳になっていました。
        tone: しみじみ
      # fact: toyotomi-28
      - 語り: その3年後、正保2年、1645年。天秀尼は、37歳で、世を去ります。
        tone: しみじみ
      # fact: toyotomi-29
      - 語り: 万治2年、1659年に出た『鎌倉物語』は、天秀尼は、寺の本堂の裏の林に、葬られた、と書きます。
      # fact: toyotomi-31
      - 語り: 天秀尼に、子は、いませんでした。秀頼の子で、命を助けられて生き延びたのは、この娘、ただ一人、と紹介されます。
        tone: 重い
      # fact: toyotomi-30
      - 語り: その死の2年後。東慶寺は、次の住職を、足利の流れをくむ、喜連川家の娘から出したい、と、寺社奉行に、願い出ました。豊臣の娘の跡を、足利の血筋が継ぐ、という願いです。
      - 語り: 秀頼の子は、こうして、2人とも、いなくなります。
        tone: 重い
        hook: true
      - 語り: そのころ、秀吉その人を祀った神社は、もう、名前を失っていました。
        hook: true

  # ================================================================ 第5章 豊国社の社号停止
  - title: 「秀吉を祀った神社は、どうなったのか」　京都の豊国社
    lines:
      - 語り: 秀吉は、死んだあと、豊国大明神という神として、京都の東山に、祀られていました。豊国社です。
      # fact: toyotomi-35
      - 語り: 豊臣家が滅んだあと、徳川の側は、豊国社の、社号を停止します。神社の名前を、止めたのです。
        tone: 重い
        card: {head: "1615年", body: 豊国社の社号を停止}
      # fact: toyotomi-35
      - 語り: 平凡社のマイペディアは、社殿は、釘付けにされて、朽ちるに任された、と書きます。
      # fact: toyotomi-36
      - 語り: 神として祀られていた、御神体は、近くの、新日吉社に、預けられました。
      # fact: toyotomi-37
      - 語り: 豊国社には、神社に付いた寺がありました。その長を務めたのが、国松の最期を日記に書いた、あの梵舜です。梵舜は、翌1616年、家康の葬儀を、吉田神道の式で、執り行います。
      - 語り: 秀吉を神に祀った人が、次は、家康を、送ったのです。
        tone: しみじみ
      # fact: toyotomi-38
      - 語り: 豊国社の跡は、荒れるに任され、1770年代には、その面影も、無くなっていた、と観光庁の解説は書きます。
      # fact: toyotomi-38
      - 語り: 天明5年、1785年。跡地にある新日吉社の中に、小さな社が建てられ、豊国大明神の祭りが、ひっそりと、戻りました。
        card: {head: "1785年", body: 豊国大明神の祭りが戻る}
      - 語り: 名を止められてから、170年。秀吉の祭りは、隠れるように、戻ってきたのです。
        tone: しみじみ
        hook: true
      - 語り: では、秀頼本人は、どこに眠っているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 1980年の頭の骨と清凉寺（骨の絵は出さない）
  - title: 「大坂城の土から出た骨は、誰なのか」　1980年の発掘
    lines:
      # fact: toyotomi-12, toyotomi-13
      - 語り: 昭和55年、1980年。大阪の追手門学院が、校舎を建て替えるとき、敷地の発掘が、行われました。大坂城の跡の、一角です。
        card: {head: "1980年", body: 追手門学院の発掘}
      # fact: toyotomi-12
      - 語り: 1メートル四方ほどの穴から、20歳から25歳くらいの、男性の頭の骨が、見つかります。
      # fact: toyotomi-12
      - 語り: 穴の底には、貝が敷かれ、織部焼と、唐津焼の皿も、出てきました。近くの穴からは、大きな馬の骨も、出ています。
      - 語り: 丁寧に埋められた、若い男性。秀頼は、23歳で、亡くなっています。
        tone: 疑問
      # fact: toyotomi-14
      - 語り: 頭の骨は、秀頼のもの、と判断され、京都、嵯峨の清凉寺に、首塚として、祀られました。秀頼が、本堂を建て直した寺です。
        card: {head: "清凉寺", body: 秀頼の首塚}
      # fact: toyotomi-14
      - 語り: 旅行誌の、没後368年という書き方から数えると、首塚ができたのは、1983年ごろです。
      # fact: toyotomi-14
      - 語り: ただ、誰が骨を調べたのか、はっきりした記録は、見当たりません。秀頼と決めた根拠は、丁寧な埋め方や、出てきた品などの、状況の手がかりです。
      # fact: toyotomi-14
      - 語り: 歴史研究家の三池純正さんも、謎は、残っている、とみています。
      - 語り: 骨は、京都にある。ところが、南の薩摩にも、秀頼の墓と伝わる塔が、あるのです。
        hook: true
      - 語り: 秀頼は、薩摩へ逃れていた。そんな話が、残っています。
        hook: true

  # ================================================================ 第7章 薩摩の墓と日出藩の一子相伝（俗説は出どころと年代を言ってから、記録と分ける。谷山・採要録は hideyori-if で1行使ったので新しい点だけ）
  - title: 「秀頼は、薩摩で生きていたのか」　谷山の塔と日出藩の一子相伝
    lines:
      # fact: toyotomi-15
      - 語り: 鹿児島市の谷山に、伝・秀頼の墓、と呼ばれる、高さ2メートルほどの、石の塔があります。鹿児島市の案内は、塔の下からは、何も出なかったという、と書きます。
        card: {head: "鹿児島市谷山", body: 伝・秀頼の墓}
      # fact: toyotomi-16
      - 語り: 薩摩の記録、『採要録』は、秀頼の子孫を名乗る2つの家が、「豊臣右大臣」と書いた系図を、人に見せずに、持っていた、と伝えます。
      # fact: toyotomi-16
      - 語り: ただ、この本が、いつ、誰によって書かれたのかは、分かっていません。
      # fact: toyotomi-16
      - 語り: 歴史学者の渡邊大門さんは、根拠のない、作り話とみています。
      - 語り: そして、もう一つ。冒頭の、口伝えの話です。
        tone: 疑問
      # fact: toyotomi-45
      - 語り: 舞台は、豊後の日出藩。初代の藩主は、ねねの甥、木下延俊です。
      # fact: toyotomi-17
      - 語り: 昭和43年、1968年。日出の木下家の18代、木下俊凞さんが、本を出しました。題は、『秀頼は薩摩で生きていた』。
        card: {head: "1968年", body: 『秀頼は薩摩で生きていた』}
      # fact: toyotomi-17
      - 語り: 中身は、藩主から跡継ぎ1人だけに、口伝えで伝える、一子相伝の話でした。
      # fact: toyotomi-17
      - 語り: 秀頼と国松は、真田大助と薩摩へ逃れた。のちに、国松は日出へ移り、延俊の子、延由と入れ替わって、5000石の、立石の領主になった、というのです。
        tone: 疑問
      # fact: toyotomi-17
      - 語り: 日出町歴史資料館の、2021年の解説によると、俊凞さんが、この話を教わったのは、明治40年、1907年ごろ。祖母の綾子さんから、ほとんど毎日、繰り返し、暗唱させられた、といいます。
      # fact: toyotomi-18
      - 語り: では、記録の上の延由は、どんな人だったのか。寛永19年、1642年、父の延俊は、立石の5000石を分けるように遺言して、亡くなります。
      # fact: toyotomi-18
      - 語り: 延由は、その年の6月、将軍の家光に、会っています。
      # fact: toyotomi-19
      - 語り: 延由の菩提寺、長流寺に残る位牌。その裏には、「明暦四戊戌七月六日、木下縫殿助豊臣延由」と、刻まれています。
        card: {head: "延由の位牌", body: 裏に「豊臣延由」}
      # fact: toyotomi-19
      - 語り: 延由の位牌には、豊臣の姓が、刻まれていたのです。
        tone: 重い
      # fact: toyotomi-20
      - 語り: 一方で、日出町の解説は、延由が母のために残した写経などからは、国松の影は見えない、としています。
      - 語り: 国松が延由になった、というのは、家に伝わる話です。記録で確かめられるのは、延由の位牌に、豊臣の姓がある、というところまでです。
        tone: しみじみ
      - 語り: 記録の上で、秀吉の血は、どこまで、残ったのか。
        tone: 疑問
        hook: true
      - 語り: 手がかりは、豊臣家の滅亡を、見届けた、1人の老女です。
        hook: true

  # ================================================================ 第8章 秀吉の姉と完子（九条家へ）。瑞竜寺の移転・八幡山は hidetsugu で使ったので言わない
  - title: 「秀吉の血は、どこへ残ったのか」　姉のともと、九条家の完子
    lines:
      # fact: toyotomi-52
      - 語り: 秀吉の姉、とも。天文2年、1533年の生まれです。
      # fact: toyotomi-53
      - 語り: 姉のともの息子は、豊臣秀次。秀次が切腹させられたあと、ともは出家して、京都に、瑞竜寺を建てました。
      # fact: toyotomi-52
      - 語り: 大坂の陣の年、姉のともは、83歳。豊臣家が滅んだあとも生き、寛永2年、1625年の4月に、93歳で亡くなります。大坂の陣から、10年後です。
        tone: しみじみ
        figure: {type: numberline, title: 豊臣のゆかりの人が亡くなった年, items: [[国松, 1615], [とも, 1625], [天秀尼, 1645]], unit: 年}
      # fact: toyotomi-54
      - 語り: 姉のともの、もう一人の息子、豊臣秀勝。その娘が、完子です。母は、淀殿の妹の、江でした。
        figure: null
      # fact: toyotomi-54
      - 語り: 完子は、伯母の淀殿に育てられ、慶長9年、1604年に、九条幸家に嫁ぎました。13歳だったとされます。
        card: {head: "1604年", body: 完子が九条家に嫁ぐ}
      # fact: toyotomi-56
      - 語り: 系図研究者の菊地浩之さんは、秀吉と血がつながって残ったのは、完子を通じた、九条家だけだ、と書いています。家を継いだ九条道房は、完子の子とされます。
        tone: 重い
      # fact: toyotomi-56
      - 語り: その線は、系図の上では、のちに、大正天皇の皇后、貞明皇后へと、つながるとされます。ただ、途中には、辞典で確かめられない段も、残っています。
        figure: {type: people, title: 完子からの線（系図の上で、とされる）, nodes: [[とも, 秀吉の姉], [豊臣秀勝, ともの子], [完子, 九条幸家の妻], [九条道房, 完子の子], [貞明皇后, 大正天皇の皇后]], edges: [[とも, 豊臣秀勝, 子], [豊臣秀勝, 完子, 娘], [完子, 九条道房, 子], [九条道房, 貞明皇后, 子孫とされる]]}
      - 語り: 一方、ねねの実家の木下家は、秀吉とは、血が、つながっていません。
        figure: null
      - 語り: 血は、公家の家へ。そして、ねねの家は、秀吉ゆかりの文書を抱えて、大名のまま、明治まで続きます。
        hook: true
      - 語り: 延由を出した、日出の木下家も、その一つでした。
        hook: true

  # ================================================================ 第9章 木下家と明治の豊国社（足守の1615年は nene で使ったので「再興」と年数・子爵の新しい点を主に）
  - title: 「ねねの家と、明治に戻った豊国社」　1615年から1898年
    lines:
      # fact: toyotomi-42, toyotomi-43
      - 語り: 備中の足守藩は、一度、絶えていました。1615年、ねねの甥、木下利房が、父の領地だった足守に入り、藩を、立て直します。
        card: {head: "足守藩", body: 1615年に木下利房が再興}
      # fact: toyotomi-44, toyotomi-46
      - 語り: そこから、廃藩置県の1871年まで、11代で、256年。延由の父、延俊が開いた、日出藩の木下家も、1601年から1871年まで、16代で、270年、大名として続きました。
        figure: {type: bars, title: ねねの木下家が治めた年数, bars: [[足守藩　1615〜1871年, 256], [日出藩　1601〜1871年, 270]], labels: [256年, 270年]}
      # fact: toyotomi-47
      - 語り: 明治17年、1884年。2つの木下家は、どちらも、子爵になりました。
        figure: null
      # fact: toyotomi-50
      - 語り: 足守の木下家に伝わった文書の多くは、豊臣家文書として、2019年、国の重要文化財になっています。
        card: {head: "2019年", body: 豊臣家文書が重要文化財に}
      # fact: toyotomi-39
      - 語り: 豊国社にも、明治が来ます。慶応4年、つまり明治元年の、1868年。新しい政府は、豊国社を、建て直すと決めました。
      - 語り: 名を止められてから、建て直しが決まるまで、253年です。
        tone: しみじみ
      # fact: toyotomi-39
      - 語り: 2024年に、京都大学の史林に載った論文の要旨によると、初めは、大坂に建てるはずでした。ところが、京都で反対の動きが起き、京都の、方広寺の大仏殿の跡に、建てられます。
      # fact: toyotomi-39
      - 語り: 1880年の5月、社殿が、できあがりました。
      # fact: toyotomi-40
      - 語り: そして、秀吉の死から300年の1898年には、阿弥陀ヶ峰の山頂の墓も、新しく、造り直されました。
        card: {head: "1898年", body: 秀吉の墓を造り直す}
      - 語り: 最後に、もう一度、冒頭の問いに、戻ります。
        hook: true
      - 語り: 豊臣家は、本当に、絶えたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：豊臣家は、本当に絶えたのか　1615年から1968年
    lines:
      # fact: toyotomi-01, toyotomi-02
      - 語り: 秀頼の息子、国松は、1615年の5月23日、8歳で亡くなりました。その日取りは、1人の僧が、暦で選んでいました。
        tone: しみじみ
      # fact: toyotomi-26, toyotomi-28, toyotomi-31
      - 語り: 娘の天秀尼は、鎌倉の東慶寺の20世となり、1645年、子を持たないまま、亡くなります。記録で確かめられる秀頼の子は、ここで、いなくなります。
        tone: 重い
      # fact: toyotomi-17, toyotomi-19
      - 語り: 国松が生きていた、という話は、日出の木下家に伝わる、一子相伝。本になったのは、1968年です。ただ、延由の位牌には、豊臣の姓が、刻まれていました。
      # fact: toyotomi-56, toyotomi-47, toyotomi-39
      - 語り: 秀吉の姉の血は、系図の上では、完子を通じて、九条家へ。ねねの木下家は、大名として明治まで続き、秀吉を祀る豊国社の名も、明治に、戻りました。
      - 語り: 豊臣家は、滅んだ。けれど、その名と、血のかけらは、尼寺に、公家の家に、九州の位牌に、形を変えて、残っていたのです。
        tone: しみじみ
        pause: 0.8
        year: 1645

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
