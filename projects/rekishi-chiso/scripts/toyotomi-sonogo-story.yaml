# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  豊臣家は、大坂城とともに滅んだ、と習います。けれど、秀頼が城で命を絶ってから15日後。その8歳の息子、国松の最期の日取りは、1人の僧が、暦で選んでいました。
  それから30年。秀頼の娘は、鎌倉の尼寺で、子を持たないまま亡くなります。そして大坂の陣から353年後、九州の大名だった家の子孫が『秀頼は薩摩で生きていた』という本を出しました。
  豊臣家は、本当に絶えたのか。記録をたどって、確かめます。
  この動画でわかること
  ・国松はどこで、誰に育てられたのか。母・捕らえた場所・年齢が、記録で割れていること
  ・秀頼の娘・天秀尼が、鎌倉の東慶寺で残したもの
  ・秀吉を祀った豊国社が、大坂の陣のあとどう扱われたか
  ・1980年に大坂城の跡から出た頭の骨と、清凉寺の首塚
  ・薩摩の「秀頼の墓」と、日出藩木下家の一子相伝
  ・秀吉の姉・九条家・ねねの木下家。豊臣の名と血はどこに残ったのか
description_note: |-
  この動画に、想像の台詞や作った話はありません。記録の言葉は、出どころ（『駿府記』『本光国師日記』『土御門泰重卿記』『梵舜日記』『大坂御陣山口休菴咄』『元寛日記』『落穂雑談一言集』ほか〔東京大学史料編纂所『大日本史料』第12編之20 所収〕、リチャード・コックスの日記〔Kaneko・Morrell の論文 1983 の引用〕、『鎌倉物語』、東慶寺、鹿児島市、日出町歴史資料館、岡山市、観光庁、辞典〔世界大百科事典・日本大百科全書・マイペディア・ブリタニカ国際大百科事典ほか〕、三池純正さん・渡邊大門さん・菊地浩之さんの記事など）を語りで示してから読んでいます。
  国松が生きていたという話は、日出藩木下家に伝わる話（木下俊凞さんの1968年の本）で、記録で確かめられたことではありません。秀頼の頭の骨とされるものは、状況の手がかりによる判断で、誰が鑑定したかは確かめられませんでした。完子から貞明皇后への系図の線は、辞典で確かめられない段を含むので「とされる」と言っています。
  年のあとの月日は、当時の暦のものです。年齢は数え年です（骨から推定した年齢を除く）。
  画面の情景と人物の画像は、画像生成AI（Gemini）で作った想像上のイメージで、実在の肖像・写真ではありません（画面の右上に「AI生成画像」と出しています）。サムネイルの人物像も、AI による想像図です。

en:
  title: "What Became of the Toyotomi Clan After 1615?"
  description: |-
    Fifteen days after Hideyori died in Osaka Castle, the day of execution for his son Kunimatsu, aged eight by the traditional Japanese count, was chosen by a monk reading the calendar.
    Thirty years later, Hideyori's daughter died childless in a convent in Kamakura. And 353 years after the siege, a descendant of a Kyushu daimyo house published a book claiming that Hideyori had survived in Satsuma.
    Did the Toyotomi house really die out? We follow the records to find out.
    In this video you will learn:
    - Where Kunimatsu was raised, and how the records disagree on his mother, his capture and his age
    - What Hideyori's daughter Tenshu-ni left at Tokeiji in Kamakura
    - What happened to the Toyokuni Shrine after 1615
    - The skull found at the site of Osaka Castle in 1980, and the grave at Seiryoji
    - The "grave of Hideyori" in Satsuma and the secret tradition of the Kinoshita house of Hiji
    - Where the Toyotomi name and blood survived: Hideyoshi's sister, Nene's Kinoshita family, and the Kujo family
    Japanese-language history video (Japanese audio). Scenes are AI-generated imagery; there are no invented lines.
  chapters:
    - "Fifteen Days After Hideyori Died"
    - "May 1615: Who Was Left?"
    - "Where Was Kunimatsu Raised?"
    - "What the Records Say About May 23"
    - "Hideyori's Daughter at Tokeiji"
    - "Why Was the Toyokuni Shrine Shut?"
    - "The Skull Found in 1980"
    - "Did Hideyori Survive in Satsuma?"
    - "Hideyoshi's Sister and the Kujo Family"
    - "The Kinoshita Family and the Meiji Revival"
    - "Summary: Did the Toyotomi House Really End?"

