# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と fukushima-story.yaml の型）。豊臣家はその後どうなった？ 2026-11-27 作成。
# 公開の予定は 12/4 19:00。型：A「その後」（docs/story-main.md の 00.）。チャンネルでいちばん伸びた「〇〇家はどうなった」の形。
# 1本に1つの「なぜ」＝「豊臣家は、本当に絶えたのか」。主語は最後まで「豊臣家（秀頼の家と、豊臣の名と血）」1つ。語り手は剣崎1人。想像の台詞なし。
#   誰でも持つ像＝豊臣家は1615年、大坂城とともに滅んだ。
#   裏返す一点＝秀頼の子の処刑の日取りは僧（崇伝）が暦で選んだ／娘は30年後まで尼寺で生きた／353年後に「国松は生きていた」という一子相伝が本になった。
#   答え（まとめ）＝記録の上で秀頼の家は1645年の天秀尼の死で途絶える。国松生存は家伝（1968年に公刊）。豊臣の姓は延由の位牌に、秀吉の姉の血は完子を通じて九条家へ（系図の上で、とされる）、
#     ねねの木下家は明治まで大名・子爵、豊国社の神の名は明治に戻った。
#   0〜30秒：①国松の処刑の日取りは僧が暦で選んだ ②娘は30年後に鎌倉の尼寺で子を持たずに亡くなる ③353年後の本『秀頼は薩摩で生きていた』と一子相伝 → 問い＋答えの席（最後に）。
#   序章／第1章 1615年5月に残った人／第2章 国松の育ち（食い違い①母）／第3章 5月23日の記録（食い違い②伏見か若狭か・③年齢）／第4章 天秀尼と東慶寺／第5章 豊国社の社号停止／
#   第6章 1980年の頭骨と清凉寺／第7章 薩摩の墓と日出の一子相伝（俗説は出どころと年代を言ってから分ける）／第8章 秀吉の姉と完子／第9章 木下家と明治の豊国社／まとめ。
# 既出と重ねない（11-27 grep）：hideyori-if（国松の5月8日に城を出て21日に伏見で捕縛・23日六条河原・天秀尼の助命の条件・東慶寺＝縁切寺・37歳）、
#   senhime-story（天秀尼の寺例書・1634年の再建・春日局の棟札・忠長の屋敷と100両・会津の一件・正保2年2月7日の死と目付の検分・縁切寺は2つ）、
#   yodo-story（コックスの秀頼生存のうわさ）、nene（木下利房が高台院を見守った・利次の養子）、tsurumatsu-if（鶴松）→ どれも言い回しを変えて1行以内、または使わない。
#   コックスは「天秀尼を見た日記の余白」（1616年10月18日）だけを使う（別の記事）。縁切寺は語らない（東慶寺の寺の名だけ）。
# 事実は事実カード（dev/output/rekishi-chiso/research/豊臣家_facts_20261127.yaml、toyotomi-01〜56）にあるものだけ。行の上に `# fact: toyotomi-NN`。
#   カードに無い「誰でも知っている前置き」（秀頼・淀殿の死、秀次の切腹、豊国大明神）は短く使い、# fact を付けない。
# 記録の食い違い（並べたのは3つ）：①国松の母（山口休菴咄＝伊勢の女中／元寛日記＝成田助近の娘）第2章 ②国松をどこで捕らえたか（駿府記＝伏見／土御門泰重卿記＝若狭から上洛）第3章
#   ③国松の年齢（6・7・8・10歳ばかり）第3章。並べなかったもの：頭骨の出た場所（三の丸／二の丸京橋口）、豊国社の社殿（朽ちるに任せた／破壊）、天秀尼の生年（1609／1608）、
#   処刑地（六条／七条）、没日（23日／22日）、縁切寺の終わり（1871／1873）、延由が何男か。
# 自分で計算した数（全部計算し直した）：
#   落城（5月8日）→国松の処刑（5月23日）＝15日後。国松 慶長13年（1608）生→1615年 数え8。天秀尼 慶長14年（1609）生→1615年 数え7、1642年 数え34、1645年 数え37。
#   国松の死（1615）→天秀尼の死（1645）＝30年。大坂の陣（1615）→俊凞の本（1968）＝353年。落城（1615）→雲板（1642）＝27年。
#   とも 天文2年（1533）生→1615年 数え83、1625年 数え93。大坂の陣（1615）→ともの死（1625）＝10年。完子 1592年生→1604年 数え13。
#   清凉寺：没後368年＝1615＋368＝1983年。社号停止（1615）→樹下社（1785）＝170年。社号停止（1615）→再建の決定（1868）＝253年。秀吉の死（1598）→1898年＝300年。
#   足守 1615→1871＝256年。日出 1601→1871＝270年。秀頼 1593年生→1615年 数え23。
#   季節の語は使わない（月だけ）。年の分からない『採要録』は「いつ誰が書いたか分からない」と言い、年の流れに入れない。
# 確かめられなかったこと（台本では言わない）：国松の墓（誓願寺・豊国廟への移転）、清凉寺の首塚の年と鑑定した人、『採要録』の著者と年、延由の生年、
#   江戸時代の木下家が「豊臣朝臣」を名乗った記録、完子から貞明皇后までの4つの段（辞典で未確認→「とされます」）、豊国社の1615年の処分の日付。
# 絵：AI 絵（Gemini、一覧は scripts/story/toyotomi_sonogo_main_look.yaml の頭）。処刑の場面・遺体・骨は描かない。偽の家紋（桐紋）・字・署名は描かせない。
