# B（歴史の転換点の if ストーリー）の5本目。型：事実（長篠・設楽原の戦い、決戦の理由の諸説、鉄砲三千挺・三段撃ちの通説と研究、鳶ヶ巣山奇襲、戦死者）→ 史料に残る別の道（撤退／決戦を避ける／別動隊を読む）→ 「こうなった可能性」（理由つき）。
# 仮定はひとつだけ：天正3年5月21日、設楽原で武田が勝った（どう勝ったかは決めない）。研究が示す「鉄砲の優位だけでは決まらない」を根拠に、勝つことが全くの空想ではないとして置く。
# 事実の出どころは dev/output/rekishi-chiso/research/nagashino_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は nagashino_if_assets.md。既存：mikata-if.yaml（三方ヶ原IF。信玄の死・西上の節は繰り返さない）
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。「ここから想像」の札が出ている節（想像①〜④）だけ・字幕に「（想像）」（roles の勝頼想像・馬場想像・信長想像・忠次想像・家康想像・奥平想像）・記録のセリフは本編に置かない
#   同じ幕で声が重ならない：第1幕＝勝頼（玄野武宏）と馬場（雀松朱司）／第2幕＝信長（青山龍星）と忠次（離途）／第3幕＝家康（麒ヶ島宗麟）と奥平（白上虎太郎）／第4幕＝勝頼（玄野武宏）と馬場（雀松朱司）。
#   幕割り：想像①＝第1幕（5/21夕・武田の陣）／想像②＝第2幕（5/22・連合軍の陣）／想像③＝第3幕（岡崎と長篠城）／想像④＝第4幕（天正3年夏・甲府）。②③④の頭にも「ここから想像」の札を出す。
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。声に出す型は「可能性は、〜、です」に統一。事実の部分は「分かっていません」「と伝わります」「とされます」を使い分ける。
# 冒頭の強い一点：「宿老（内藤昌豊・山県昌景・馬場信春）3人が同じ日に亡くなった」。『甲陽軍鑑』『武家事紀』『常山紀談』の話は後世の書・二次と断る。馬場信春が殿に残った話・佐久間信盛の内通も同様。
# 数字は「何の数か」を言う（連合軍・武田の兵は通説／高柳光寿の見積もり。鉄砲は書物ごとの記述／平山優の装備率。戦死者は書物ごとの記述）。「約2.5倍」と言い切らない。日付は和暦の月日、西暦は換算（天正3年5月21日＝1575年6月29日、ユリウス暦）。
#   年齢は数え：勝頼30（1546生）・信長42（1534生）・家康34（1542生）。信玄の死（元亀4年4月12日）から約2年あまり。
#   信長の本願寺との戦い・1582年の本能寺は一般的な整理で、日付は今回確かめていないので台本では年・月までに留める。
# 使わない話：三段撃ち・鉄砲3千挺・馬防柵の一人一本を事実として／流血・遺体・首の描写／鳶ヶ巣山の「退路を断たれた」の断定／鳥居強右衛門の最期／佐久間信盛の内通を事実として／「勝てば武田は滅びなかった」「天下を取れた」の断定／信長の死の細かい日付。
# 決めた札の理由：
#   高い＝勝てば、長篠のあとに進んだ奥三河・遠江の奪回（史実）は同じ速さでは進まない（奪回は敗戦の結果として進んだという整理）。
#   ありうる＝宿老の戦死が減る／勝頼が勢いを保つ（外交・高天神城）／信長は東に兵を割き続ける（畿内に本願寺という敵）／家康は奥平を見捨てず三河を固める（乃至政彦の指摘）／高天神の落城が遅れる／勝頼が追撃より長篠城と別動隊の固めを先にする。
#   ほぼ妄想＝三河のどこまで進むか／信長がどこまで退くか／奥三河の国衆の動き／奥平が持ちこたえたか／武田氏の滅ぶ日が変わるか／日本全体の流れ（本能寺・天下）。
#   研究は見つからない（正面から論じたもの）を冒頭で、評価の割れ（平山優・伊東潤・笹本正治・柴辻俊六）は想像④と第7節で論者名つきで断った。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像は額）／極端に横長の絵（縦横比2.4:1以上）は使わない／縦の継ぎ目のある三連絵は全面背景にしない／NDL系の色票・黒帯の絵は全面に敷かない／血・遺体の絵は使わない／
#   現代の写真（長篠城跡・躑躅ヶ崎館）は credit に「現在の〜」と書き、語りでもその行で断る。岡崎城の古写真は天守が江戸期のものと断る（今回は断りを足すこと）。屏風・武者絵は後世の絵と断る。
title: もし長篠の戦いで武田勝頼が勝っていたら｜武田は勢いを保てたか、信長と家康はどうしたか、そのあとどうなったか
