  - 聞き: 滅びた日付を知ってると、勝ってもやっぱり、って考えちゃうな。
  - 語り: 勝頼の評価は、割れています。笹本正治さんは、勝頼の判断を愚策ではないと見ます。柴辻俊六さんは、典型的な三代目と見ます。
