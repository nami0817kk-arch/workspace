  - 語り: ただ、北条氏との対立は、御館の乱のあとに、甲相同盟が破れて起きました。平山優さんは、これを滅亡の主因と見ます。長篠の勝ち負けとは別の火種です。画面は、現在の武田氏館の跡です。
