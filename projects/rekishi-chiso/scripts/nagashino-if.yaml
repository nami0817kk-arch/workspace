en:
  title: What If Takeda Katsuyori Had Won at Nagashino? | How Do Takeda, Nobunaga and Ieyasu Fare?
  description: 'On the 21st day of the 5th month of Tensho 3 (June 29, 1575), three of Takeda''s senior retainers, Naito Masatoyo, Yamagata Masakage and Baba Nobuharu, died on the same day at Shitaragahara. Katsuyori, aged 30 by Japanese count, had chosen a decisive battle against the Oda-Tokugawa forces. This video asks: what if Takeda had won?


    We keep records, theories and imagination apart. First, what the sources and historians say: why Katsuyori fought, the five competing explanations, the ''three volleys of 3,000 muskets'' story versus modern research (the 1,000 muskets of the printed Shincho-ko-ki, Takeda''s own muskets), the dawn raid on Tobigasuyama, the horse barricades, and the widely differing death tolls.


    Then, clearly marked imagination with reasons: the evening at Shitaragahara, Nobunaga''s choices, Ieyasu and Okudaira Nobumasa at Nagashino Castle, Katsuyori''s diplomacy, a table of fates, and the chains to today.


    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    The accounts of historians'' views follow summaries on Wikipedia and magazine articles; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'May 21, 1575: Three Takeda Elders Die at Shitaragahara'
  - 'April 1573: Shingen Dies, His Fourth Son Katsuyori Succeeds'
  - '1573: Nobunaga Breaks the Western Encirclement'
  - 'April 1575: Katsuyori Marches into Mikawa and Besieges Nagashino'
  - 'May: The War Council, Retreat Advised, Battle Chosen'
  - 'Three Thousand Muskets and the Volley Story: Legend versus Research'
  - Dawn Raid on Tobigasuyama and the Horse Barricades
  - 'May 21: The Elders'' Deaths and the Disputed Death Tolls'
  - What Decided the Battle? Not Muskets Alone
  - 'Other Paths in the Sources: Retreat, Avoiding Battle, Reading the Raid'
  - 'Imagination 1: Evening at Shitaragahara, Fewer Elders Die'
  - 'Imagination 2: Nobunaga and Sakai Tadatsugu on May 22'
  - 'Imagination 3: Ieyasu and Okudaira Nobumasa at Nagashino Castle'
  - 'Imagination 4: Katsuyori''s Diplomacy and the Fall of Takatenjin'
  - 'Imagination 5: A Table of Fates'
  - 'Imagination 6: How Japan Changes, and the Chains to Today'
  - 'Summary: The Fork at Shitaragahara'
