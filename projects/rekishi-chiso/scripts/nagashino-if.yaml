  background:
    image: paintings/nobunaga_anegawa_screen.jpg
    credit: 姉川合戦図屏風（部分、江戸時代）
  year: 1573
  lines:
  - 語り: 信玄の死の約3か月後、元亀4年7月18日。信長は、槇島城で、足利義昭を降伏させます。室町幕府は、事実上、滅んだと見る向きもあります。
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
    card:
      head: 元亀4年7月18日
      body: 信長、義昭を降伏させる
  - 聞き: 将軍を追い出したってことか。信長、強いな。
  - 語り: そして天正元年8月20日、朝倉義景が自刃します。浅井氏も、この月に滅びます。信長包囲網は、崩れました。
    portrait: null
    card:
      head: 天正元年8月
      body: 朝倉・浅井が滅びる
  - 聞き: それなら、信長はもう、敵がいなくなったんじゃない？
  - 語り: いいえ。畿内には、大坂の本願寺という大きな相手がいました。画面は、姉川の戦いの絵です。東には、勝頼がいます。
    card:
      head: 信長の状況
      body: 西の包囲網は崩れたが本願寺と武田が残る
    background:
      image: paintings/hanbei_gifu_castle_zu.jpg
      credit: 《岐阜城図》（江戸時代）
  - 聞き: 東と西、両方に敵がいたのは、変わらないよね。
  - 語り: この状況で、長篠を迎えます。
    hook: true
    background:
      image: paintings/nobunaga_azuchi_castle_zu.jpg
      credit: 近江国蒲生郡安土城之図（1855年原図・明治の写し）
  - 聞き: じゃあ、あの決戦に、信長は何を賭けてたんだろう。
    hook: true
- title: 天正3年4月 勝頼は三河へ、奥平信昌の長篠城を囲む
  background:
    image: paintings/nagashino_castle_honmaru_photo.jpg
    credit: 先従隗始 長篠城跡の本丸跡の碑（現在の写真、2021年）
  year: 1575
  lines:
  - 語り: 勝頼が向かったのは、三河です。きっかけは、2年前。信玄の死の直後に、奥平の親子が武田を離れて、徳川につきました。勝頼は、この年のうちに、人質を処刑したとされます。
    portrait:
      image: paintings/nagashino_okudaira_nobumasa.jpg
      caption: 奥平信昌（1615年ごろの肖像）
      age: false
    card:
      head: 天正元年（1573）
      body: 奥平親子が徳川につく
  - 語り: 画面は、現在の長篠城跡です。
  - 聞き: 裏切られたから、取り返しに行ったのかな。それとも、狙いは別にあったの？
    tone: 疑問
  - 語り: 勝頼の狙いは、三河と遠江だった、という見方があります。乃至政彦さんの見方です。
    portrait: null
    card:
      head: 勝頼の狙い
      body: 三河・遠江の回復（乃至政彦）
  - 語り: それによると、岡崎城を内通で取る計画は、露見して失敗しました。それでも、徳川方を吉田城まで押し戻し、勢いは保っていました。
    background:
      image: paintings/mikata_okazaki_castle_photo_2012.jpg
      credit: 《取り壊し前の岡崎城》（古写真、撮影年不詳）
    figure: null
  - 語り: 画面は、取り壊し前の岡崎城の古写真です。写る天守は江戸時代のもので、このころのものではありません。
  - 聞き: 取り損ねたけど、押してはいたのか。そこで、長篠城が出てくるわけだ。
  - 語り: 長篠城を放っては、三河に攻め入れません。城主の奥平信昌は、家康の長女との縁組の話が出ていた、とされます。婚姻は、1576年です。画面は、現在の長篠城跡の石碑です。
    portrait:
      image: paintings/nagashino_okudaira_nobumasa.jpg
      caption: 奥平信昌（1615年ごろの肖像）
      age: false
    background:
      image: paintings/nagashino_castle_stone_monument_photo.jpg
      credit: MaedaAkihiko 長篠城跡の石碑（現在の写真、2024年）
  - 語り: 家康が信昌を見捨てれば、三河の支配が崩れる。だから勝頼は、家康を長篠の近くへ引き出して、決戦するつもりだった。これが、その見方です。
    card:
      head: 乃至政彦の見方
      body: 家康を引き出して決戦する
  - 聞き: 家康も、見捨てられないのか。じゃあ、お互いに引けなかったのかな。
  - 語り: やがて、織田信長と徳川家康の連合軍が、設楽原に布陣します。画面は、長篠合戦図屏風です。
    portrait: null
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
    card:
      head: 連合軍が布陣
      body: 場所は設楽原
  - 語り: 設楽原は、「原」の名と違って、小川や沢に沿って丘が南北に続く、起伏の多い土地でした。敵陣の奥まで見通せなかったとされます。
  - 聞き: 見通せないなら、相手の数も、分かりにくかっただろうね。向こうに何がいるのか。
    hook: true
  - 語り: 武田の陣では、軍議が開かれます。
    hook: true
- title: 5月 設楽原の軍議 撤退を勧めた宿老、決戦を選んだ勝頼
  background:
    image: paintings/akechi_nagashino_battle_screen.png
    credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  year: 1575
  lines:
  - 語り: 山県昌景、馬場信春、内藤昌豊の3人は、撤退を勧めたと伝わります。出どころは、『甲陽軍鑑』『常山紀談』など、後世の書です。
    portrait:
      image: paintings/mikata_yamagata_masakage_kuniyoshi2.jpg
      caption: 山県昌景（歌川国芳画、後世の武者絵）
      age: false
    card:
      head: 宿老の撤退論
      body: 山県・馬場・内藤が進言と伝わる
  - 聞き: 宿老が止めたのに、勝頼は聞かなかったの？
  - 語り: 引けば、長篠城の奥平を、見捨てることになります。さっきの見方に立てば、勝頼には、簡単に引けない事情がありました。画面は、現在の長篠城跡の本丸跡です。
    background:
      image: paintings/nagashino_castle_honmaru_photo.jpg
      credit: 先従隗始 長篠城跡の本丸跡の碑（現在の写真、2021年）
  - 聞き: 取引先を見捨てて撤退したら、他の取引先もついてこなくなる、みたいな話かな。引けないの、分かる気がする。
  - 語り: 『甲陽軍鑑』は、跡部勝資と長坂光堅が、決戦を唱えた、と伝えます。この書は年紀の誤りがあり、慎重に読む史料です。
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 語り: 決戦の理由は、ひとつに決まりません。説は、少なくとも5つあります。1つ目。側近の主戦論。2つ目。前の年に高天神城を落とした勝利への、自信です。
    portrait: null
    card:
      head: 決戦の理由 1・2
      body: 側近の主戦論／勝利への自信
  - 聞き: 勝ってる時って、引きどきが分からなくなるよね。
    background:
      image: paintings/ieyasu_nagashino_baba_nobuharu_screen.jpg
      credit: 長篠合戦図屏風（徳川美術館蔵）の一場面
  - 語り: 3つ目は、信長の謀略です。佐久間信盛が内通を約束していた、と『武家事紀』などにあります。ただ、これも後世の書で、同時代の裏づけは確かめられていません。
    card:
      head: 決戦の理由 3
      body: 信盛の内通説（後世の書）
  - 語り: 4つ目は、平山優さんの見方です。柵や鉄砲が待っていても、敵陣に突っ込むのは、当時の正攻法だった。無謀な突撃、という見方は、見直されています。
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
    card:
      head: 決戦の理由 4
      body: 突入は当時の正攻法（平山優）
  - 聞き: 突っ込むのが普通だったなら、無茶じゃなかった、ってこと？
    tone: 疑問
  - 語り: 5つ目は、高澤等さんの説です。日時と場所を、事前に決めて戦った、と考えます。決め手は、ありません。
    card:
      head: 決戦の理由 5
      body: 事前の申し合わせ説（高澤等）
  - 聞き: 5つも説があって、決め手はなし、か。でも、その決戦って、鉄砲三千挺の三段撃ちで終わったんでしょ？
  - 語り: そこが、いちばん疑われている所です。
    hook: true
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 聞き: 教科書で習った話なのに？
    tone: 驚き
    hook: true
- title: 鉄砲三千挺と三段撃ち 通説と研究のずれ
  background:
    image: paintings/nobunaga_nagashino_teppo_ashigaru.jpg
    credit: 長篠合戦図屏風（部分、18世紀）
  year: 1575
  lines:
  - 語り: 通説は、こうです。信長が、鉄砲3千挺を三列に並べ、交代しながら撃つ、三段撃ちで、武田の騎馬軍団を破った。
    card:
      head: 通説
      body: 3千挺の三段撃ち
    figure: null
    detail:
      box:
      - 0.0
      - 0.0
      - 0.55
      - 1.0
      label: 鉄砲を構える足軽
    short: s2
  - 聞き: 教科書で習ったやつだ。違うの？
    short: s2
  - 語り: 研究では、見直されています。三段撃ちは、江戸時代の『甫庵信長記』などの創作から生まれたとみられる話で、明治の教科書が事実として載せて、広まったと紹介されます。
    background:
      image: paintings/nobunaga_teppo_sakai_gunsmith.jpg
      credit: 『和泉名所図会』堺の鉄砲鍛冶（1796年）
    card:
      head: 三段撃ちの出どころ
      body: 江戸時代の書物（創作とみられる）
    short: s2
  - 語り: 鈴木眞哉さんと藤本正行さんは、当時の鉄砲の仕組みと技量から、三段撃ちは不可能だと論じました。3千挺という数にも、疑問を示します。
    short: s2
  - 聞き: そもそも、ほんとに3千挺あったの？
    tone: 疑問
    short: s2
  - 語り: 『信長公記』の刊本は、1千挺です。池田家本は、千の字の上に「三」が加えてあり、後の人の手が入った可能性が高い、とみられます。
    figure:
      type: bars
      title: 鉄砲の数（書物ごとの記述）
      bars:
      - - 『信長公記』刊本
        - 1000
      - - 池田家本（三を加筆）
        - 3000
      - - 通説
        - 3000
      labels:
      - 1,000挺
      - 3,000挺
      - 3,000挺
    short: s2
  - 聞き: 三倍も違う。しかも、後から書き足したかもしれないの？
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  - 語り: では、武田は鉄砲を持っていなかったのか。平山優さんによると、武田も鉄砲を重視していました。第二次川中島合戦で、鉄砲衆300挺。軍役定書では、鉄砲と弓を、軍役人数の約10%とします。
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
    card:
      head: 武田の鉄砲
      body: 川中島で300挺、定書は約10%
    figure: null
  - 聞き: 武田も、ちゃんと鉄砲を使ってたの？ 数はどれくらい？
    tone: 疑問
  - 語り: 連合軍の鉄砲は、本戦3千と別動隊500で、計3千5百挺。兵が3万5千なら、装備率は約10%。武田の定書と、ほぼ同じです。武田の鉄砲は、筆者の試算で、千から千5百挺です。
    figure:
      type: stats
      title: 鉄砲の装備率（平山優の整理）
      items:
      - - 連合軍の装備率
        - 約10%
        - 3,500挺÷3万5千人
      - - 武田の軍役定書
        - 約10%
        - 鉄砲と弓の合計
      - - 武田の鉄砲
        - 千〜千5百挺
        - 試算（平山優）
      upto: 3
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 聞き: じゃあ、鉄砲の数だけで、決まった戦じゃなさそう。
    tone: 納得
  - 語り: 乃至政彦さんは、騎馬隊が鉄砲に蹴散らされたからではなく、信長の周到な作戦に注目すべきだ、と書きます。その一つが、夜明けの別動隊です。
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
    figure: null
    hook: true
  - 聞き: 夜明けの別動隊って？
    tone: 疑問
    hook: true
- title: 5月20日の深夜 酒井忠次の鳶ヶ巣山奇襲と、馬防柵
  background:
    image: paintings/nobunaga_nagashino_screen_toyota.jpg
    credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  year: 1575
  lines:
  - 語り: 5月20日の深夜。酒井忠次に、命令が出ます。21日の夜明け、鳶ヶ巣山の砦を、後ろから攻める。
    portrait:
      image: paintings/mikata_sakai_tadatsugu_portrait.jpg
      caption: 酒井忠次（16世紀末〜17世紀初の肖像）
      age: false
    card:
      head: 5月21日の夜明け
      body: 鳶ヶ巣山の砦を後ろから攻める
    short: s5
  - 聞き: 夜のうちに回り込んで、朝に奇襲か。
    short: s5
  - 語り: 兵の数は、記事によって4千とも3千とも書かれます。徳川の弓と鉄砲が約2千、織田の鉄砲が500などです。鳶ヶ巣山と、周りの砦を押さえ、長篠城の包囲を解きました。
    short: s5
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 語り: この作戦は、忠次の発案で、信長は軍議で一度、却下した、とされます。のちに忠次を褒めた逸話もありますが、後世の書です。
    short: s5
  - 聞き: 却下された作戦が、決め手の一つだったかもしれないなんて。
    short: s5
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 語り: 馬防柵も、見直されています。「兵一人に材木一本と縄一束」は、江戸時代の史料にある話ですが、信頼できる史料で裏が取れていません。
    portrait: null
    card:
      head: 馬防柵
      body: 一人一本の話は裏が取れない
  - 語り: ただ、戦場に柵を設けること自体は、戦国時代によくありました。
  - 聞き: 柵はあったかもしれないけど、お話は盛られてるのか。
  - 語り: 兵の数も、割れます。通説は、連合軍が約3万8千、武田が約1万5千。高柳光寿さんの見積もりでは、武田は8千から1万で、設楽原にいたのは6千から7千です。
    figure:
      type: bars
      title: 兵の数（何の数か：見積もりごと）
      bars:
      - - 連合軍（通説）
        - 38000
      - - 武田（通説）
        - 15000
      - - 武田・設楽原（高柳光寿）
        - 6500
      labels:
      - 約3万8千
      - 約1万5千
      - 6千〜7千
  - 聞き: 通説でも倍以上の差。でも、研究者の数だと、全体がもっと小さいよ。
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 語り: 何の数かを分けると、「約2.5倍」とは言い切れません。ただ、多くの見積もりが、連合軍が数で上回ったことを示しています。
    figure: null
  - 聞き: 数字は、何の数かで、見え方が変わっちゃう。出どころを確かめるのって、大事だなあ。
  - 語り: そして、迎えた5月21日。勝敗の結果を見ます。
    hook: true
  - 聞き: 負けた側の数字、どうなってるんだろ。
    hook: true
- title: 5月21日 設楽原の昼 宿老3人の戦死と、割れる死者の数
  background:
    image: paintings/ieyasu_nagashino_baba_nobuharu_screen.jpg
    credit: 長篠合戦図屏風（徳川美術館蔵）の一場面
  year: 1575
  lines:
  - 語り: 戦いは、5月21日。武田は敗れ、『信長公記』は、内藤昌豊、山県昌景、馬場信春の戦死を伝えます。
    portrait:
      image: paintings/shingen_naito_masatoyo_bm.jpg
      caption: 内藤昌豊（歌川国芳画、後世の武者絵）
      age: false
    card:
      head: 武田の宿老
      body: 内藤・山県・馬場が戦死
    short: s4
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 語り: 原昌胤、真田信綱、真田昌輝、土屋昌続らも、討たれます。信綱と昌輝は、のちの真田昌幸の兄です。
    portrait: null
    short: s4
  - 聞き: 真田昌幸って、あの幸村のお父さんだよね。兄が2人も、ここで……。
    tone: しみじみ
    short: s4
  - 語り: 武田の戦死者の数は、史料で大きく割れます。『信長公記』は1万以上、『多聞院日記』は甲斐国衆の千余人、『兼見卿記』は数千騎です。
    figure:
      type: stats
      title: 武田の戦死者（書物ごとの記述）
      items:
      - - 『信長公記』
        - 1万以上
        - 通説
      - - 『兼見卿記』
        - 数千騎
        - 討死
      - - 『多聞院日記』
        - 千余人
        - 甲斐国衆（伝聞）
    short: s4
  - 聞き: 10倍も違うのか。数が割れるほど、混乱した戦だったってことかな。
    short: s4
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 語り: 連合軍の損害は、6千程度とされます。逃げた兵も含む数です。この数の出どころの『徳川実紀』は、約250年後の編纂です。
    figure: null
  - 聞き: 連合軍の方は、主な武将の戦死は、見られないんだよね。
  - 語り: 長篠のあと、織田と徳川は、奥三河や遠江の城を取り返していき、二俣城も落ちます。勝敗は、そのあとの動きも決めました。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    card:
      head: 長篠のあと
      body: 奥三河・遠江の城を取り返す
  - 聞き: 勝ったほうが、そのまま一気に取り返したのか。負けた側は、守りが一気に薄くなるよね。
  - 語り: 馬場信春が、撤退する勝頼のために殿に残った、という話も語られます。ただ、出どころは、後の書と屏風絵で、確かめられていません。画面は、屏風の一場面です。
    portrait:
      image: paintings/mikata_baba_nobuharu_kuniyoshi_ndl.jpg
      caption: 馬場信春（歌川国芳画、後世の武者絵）
      age: false
    card:
      head: 馬場信春の最期
      body: 出どころは後の書と屏風絵
  - 語り: ここで、勝敗を分けたと言われるものを、整理します。
    portrait: null
    hook: true
  - 聞き: 整理するって、何を並べるの？
    tone: 疑問
    hook: true
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
- title: 5月21日 勝敗を分けたと言われるもの、鉄砲だけではない
  background:
    image: paintings/nobunaga_nagashino_screen_full.jpg
    credit: 長篠合戦図屏風（江戸時代）
  year: 1575
  lines:
  - 語り: ここまでの話を、いったん整理します。勝敗を分けたと言われるものは、鉄砲の数だけではありません。
    portrait: null
    card:
      head: 勝敗を分けたもの
      body: 鉄砲だけではない
  - 語り: 1つ目は、兵の数です。見積もりは割れますが、多くが、連合軍が数で上回ったことを示します。
    card:
      head: 要因 1
      body: 兵の数は連合軍が上回る
  - 聞き: 数の差は、やっぱり大きいよね。ネットの人数対決でも、人数が多いほうが強いし。
  - 語り: 2つ目は、地形です。小川や沢に沿った起伏の多い土地で、敵陣の奥が見えませんでした。馬防柵は、あったかどうかも含めて、研究で割れています。画面は、現在の長篠城跡です。
    background:
      image: paintings/nagashino_castle_honmaru_photo.jpg
      credit: 先従隗始 長篠城跡の本丸跡の碑（現在の写真、2021年）
    card:
      head: 要因 2
      body: 見通せない地形と柵
  - 語り: 3つ目は、夜明けの別動隊です。長篠城の囲みを解き、武田は、背後を気にしたと考えられます。ただ、退路を断たれたと言い切る史料は、確かめられていません。
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
    card:
      head: 要因 3
      body: 鳶ヶ巣山の別動隊
  - 聞き: 背後が気になるって、戦ってる最中は、すごく嫌だろうね。
  - 語り: 4つ目は、鉄砲です。装備率が両軍でほぼ同じなら、数だけで勝敗は決まりません。ただ、鉄砲と弓が待つ柵へ突っ込めば、損害は出ます。
    background:
      image: paintings/nobunaga_teppo_sakai_gunsmith.jpg
      credit: 『和泉名所図会』堺の鉄砲鍛冶（1796年）
    card:
      head: 要因 4
      body: 鉄砲と弓の迎撃
  - 語り: 5つ目は、勝頼の判断です。突入は当時の正攻法でしたが、結果として、宿老を失いました。
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
    card:
      head: 要因 5
      body: 決戦に突入した判断
  - 聞き: 5つ全部が揃って負けたなら、どれかが違えば、勝てたかもしれないね。
    tone: 納得
  - 語り: ただし、どれか1つが違えば勝てた、と言える材料は、ありません。それでも、当時の人が選べた道は、ありました。
    hook: true
  - 聞き: じゃあ、その別の道を、見てみようか。
    hook: true
- title: 天正3年5月 史料に残る別の道、撤退・決戦を避ける・別動隊を読む
  background:
    image: paintings/hanbei_gifu_castle_zu.jpg
    credit: 《岐阜城図》（江戸時代）
  year: 1575
  lines:
  - 語り: 1つ目の道。撤退です。宿老が勧めたと伝わる道です。画面は、現在の躑躅ヶ崎館、武田氏館の跡です。
    background:
      image: paintings/mikata_kofu_tsutsujigasaki_photo.jpg
      credit: 前田左衛門佐 躑躅ヶ崎館（武田氏館跡、現在の写真、2005年）
    card:
      head: 別の道 1
      body: 撤退して甲斐へ引く
  - 聞き: 引いてたら、宿老は、生きてたってこと？
  - 語り: 宿老3人の戦死は、決戦に出たから、とは言えます。ただ、その先に武田が安泰だったかは、別の話です。
  - 語り: 平山優さんは、武田氏滅亡の主因を、北条氏との対立と見ます。伊東潤さんは、御館の乱の対応と、高天神城に後詰できなかったことが、長篠の敗戦より重い、と主張します。
    background:
      image: paintings/shingen_takatenjin_zue.jpg
      credit: 『遠江古蹟図会』高天神山之図（1803年）
    card:
      head: 別の見方
      body: 長篠だけでは決まらない
  - 聞き: 長篠で負けただけで、武田が終わったわけじゃない、って読みか。
  - 語り: 2つ目の道。決戦を避けて、長篠城の囲みを続ける道です。ただ、家康を引き出すのが狙いなら、決戦は避けにくい、という見方もあります。画面は、現在の長篠城跡の写真です。
    background:
      image: paintings/nagashino_castle_honmaru_photo.jpg
      credit: 先従隗始 長篠城跡の本丸跡の碑（現在の写真、2021年）
    card:
      head: 別の道 2
      body: 決戦を避けて包囲を続ける
  - 語り: 3つ目の道。鳶ヶ巣山への迂回を、勝頼が察知していた、という説です。察知していたのか、していなかったのかは、分かっていません。
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
    card:
      head: 別の道 3
      body: 別動隊を察知していた説
  - 聞き: どの道も、相手の動き次第だなあ。あーしなら、撤退したくなっちゃうけど、それもそれで、怖いなあ。
  - 語り: そして、武田が勝った場合を書いた史料は、見当たりません。
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
    hook: true
  - 聞き: 史料がないなら、どうやって考えるの？
    tone: 疑問
    hook: true
  - 語り: 当時の人の選択肢を土台に、想像で掘ります。
    hook: true
- title: 想像① 5月21日の夕方 勝って武田の陣で決めること
  background:
    image: paintings/akechi_nagashino_battle_screen.png
    credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  year: 1575
  lines:
  - 語り: ここから先は、想像です。仮定は、ひとつだけ。5月21日、設楽原で、武田が連合軍の線を破って、勝ちます。
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    card:
      head: ここから想像
      body: 武田が設楽原で勝つ
    short: s3
  - 語り: どうして勝てたのかは、決めません。冒頭で断ったとおり、この場面を論じた研究は、見つかっていません。細かい戦の描写もしません。大事なのは、勝ったあと、誰が何を決めるかです。
  - 聞き: 勝った理由は決めずに、勝ったあとを考える、と。でも、勝つなんて、あり得たの？
    tone: 疑問
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  - 語り: 鉄砲の優位だけでは決まらない、という研究があります。装備率は両軍でほぼ同じ、と平山優さんは見ます。だから、勝つ道が、全くの空想とは言えません。
  - 聞き: なるほど。じゃあ、宿老は？
    background:
      image: paintings/ieyasu_nagashino_baba_nobuharu_screen.jpg
      credit: 長篠合戦図屏風（徳川美術館蔵）の一場面
  - 語り: 勝った世界では、内藤、山県、馬場の戦死が、減ります。ありうる話です。
    card:
      head: ありうる
      body: 宿老の戦死が減る
  - 語り: 想像劇場、第1幕です。5月21日の夕方、設楽原の武田の陣。勝頼と、馬場信春が、向き合います。
    portrait: null
    card:
      head: 想像劇場 第1幕
      body: 5月21日夕 武田の陣
    short: s3
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 人物: 「連合軍の線は崩れた。このまま三河へ踏み込むか」
    who: 勝頼想像
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    short: s3
  - 人物: 「御屋形様、追う前に、砦を失った味方の背を、固めるべきかと」
    who: 馬場想像
    portrait:
      image: paintings/mikata_baba_nobuharu_kuniyoshi_ndl.jpg
      caption: 馬場信春（歌川国芳画、後世の武者絵）
      age: false
    short: s3
  - 人物: 「奥平を落とさねば、三河には入れぬ。夜のうちに、長篠の囲みを張り直せ」
    who: 勝頼想像
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    short: s3
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  - 人物: 「承知いたしました。ただ、織田は引いても、また来ましょう。勝ちを、勝ちのまま終えねば」
    who: 馬場想像
    portrait:
      image: paintings/mikata_baba_nobuharu_kuniyoshi_ndl.jpg
      caption: 馬場信春（歌川国芳画、後世の武者絵）
      age: false
    short: s3
  - 人物: 「分かっておる。勝ったからこそ、父上の遺したものを、守らねばならぬ」
    who: 勝頼想像
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
    short: s3
  - 聞き: 勝っても、慎重だなあ。
    portrait: null
    short: s3
  - 語り: ここでは、勝頼が追撃より、長篠城の囲み直しと、背後の固めを先にする、と想像します。奥平を落とさずに、三河へ入れないという見方が材料です。ありうる、と見ます。
    card:
      head: ありうる
      body: 追撃より囲み直しと背後の固め
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 語り: ただ、勝頼が三河のどこまで進むかは、根拠がありません。可能性は、ほぼ妄想、です。
    card:
      head: ほぼ妄想
      body: 三河のどこまで進むかは材料なし
  - 聞き: 武田は決まったね。じゃあ、負けた織田と徳川は、どうするの？
    tone: 疑問
    hook: true
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
  - 語り: 場面は、5月22日の連合軍の陣に移ります。
    hook: true
- title: 想像② 5月22日 連合軍の陣、信長と酒井忠次
  background:
    image: paintings/nobunaga_nagashino_screen_toyota.jpg
    credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  year: 1575
  lines:
  - 語り: 想像劇場、第2幕です。5月22日、連合軍の陣。織田信長と、酒井忠次が、向き合います。
    portrait: null
    card:
      head: ここから想像
      body: 第2幕 5月22日 連合軍の陣
  - 人物: 「武田が、柵の前の備えを破ったか。忠次、兵は、どれほど残った」
    who: 信長想像
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
  - 人物: 「まだ、数は保っております。ただ、長篠城の奥平殿が、持ちこたえるかは」
    who: 忠次想像
    portrait:
      image: paintings/mikata_sakai_tadatsugu_portrait.jpg
      caption: 酒井忠次（16世紀末〜17世紀初の肖像）
      age: false
  - 人物: 「奥平を見捨てれば、三河が揺れる。退きながら、拾え」
    who: 信長想像
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
  - 人物: 「鳶ヶ巣山を取った兵は、まだ動けまする。囲みが戻る前に、長篠城へ兵糧を入れられるかと」
    who: 忠次想像
    portrait:
      image: paintings/mikata_sakai_tadatsugu_portrait.jpg
      caption: 酒井忠次（16世紀末〜17世紀初の肖像）
      age: false
    background:
      image: paintings/ieyasu_nagashino_baba_nobuharu_screen.jpg
      credit: 長篠合戦図屏風（徳川美術館蔵）の一場面
  - 人物: 「崩せるなら崩せ。ただし、深追いはするな。武田の宿老は、まだ残っておる」
    who: 信長想像
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
  - 人物: 「殿は、岡崎を固めるおつもりで」
    who: 忠次想像
    portrait:
      image: paintings/mikata_sakai_tadatsugu_portrait.jpg
      caption: 酒井忠次（16世紀末〜17世紀初の肖像）
      age: false
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 人物: 「家康には、岡崎を固めさせよ。わしは、岐阜で兵を立て直す。畿内にも、敵がおる」
    who: 信長想像
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
    background:
      image: paintings/hanbei_gifu_castle_zu.jpg
      credit: 《岐阜城図》（江戸時代）
  - 聞き: 信長も、東と西の両方で、手がいっぱいだったのか。
    portrait: null
  - 語り: 信長は、畿内で本願寺とも戦っていました。日付までは、今回は確かめていません。ここでは、信長が東の守りに、兵を割き続けると想像します。ありうる話です。
    card:
      head: ありうる
      body: 信長は東に兵を割き続ける
  - 語り: ただ、信長が自分の領国まで退くのか、岐阜まで下がるのかは、分かりません。可能性は、ほぼ妄想、です。
    card:
      head: ほぼ妄想
      body: どこまで退くかは根拠なし
  - 語り: 史実では、信長は翌年から、近江に安土城を築き始めます。勝った武田が東にいれば、その時期が変わったのか。これも、手がかりがありません。
    background:
      image: paintings/nobunaga_azuchi_castle_zu.jpg
      credit: 近江国蒲生郡安土城之図（1855年原図・明治の写し）
    card:
      head: ほぼ妄想
      body: 安土築城の時期は材料なし
  - 聞き: 本拠地を移す話までずれたかも、と思うとドキドキする。じゃあ、家康は？ 奥平さんは、どうなるの？
    tone: 疑問
    hook: true
  - 語り: 場面は、岡崎へ向かう家康に移ります。
    background:
      image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
      credit: 《龍城図》岡崎城（江戸時代）
    hook: true
- title: 想像③ 岡崎の家康と、長篠城の奥平信昌
  background:
    image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
    credit: 《龍城図》岡崎城（江戸時代）
  year: 1575
  lines:
  - 語り: 想像劇場、第3幕です。岡崎に入った家康が、長篠城の奥平信昌へ、使いを出します。
    portrait: null
    card:
      head: ここから想像
      body: 第3幕 岡崎の家康と奥平
  - 人物: 「信昌、長篠城は、まだ保てるか」
    who: 家康想像
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
  - 人物: 「もう長くは、持ちませぬ。ただ、城は、渡しませぬ」
    who: 奥平想像
    portrait:
      image: paintings/nagashino_okudaira_nobumasa.jpg
      caption: 奥平信昌（1615年ごろの肖像）
      age: false
  - 人物: 「見捨てぬ。そなたを見捨てれば、三河は割れる。岡崎で兵を整え、必ず戻る」
    who: 家康想像
    portrait:
