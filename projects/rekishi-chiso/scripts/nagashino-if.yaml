  - 聞き: 勝っても、その火種は、残るわけだ。
  - 語り: 高天神城は、史実では天正9年、徳川に攻められ、勝頼は救えず、落城しました。国衆の動揺を招いた、とされます。勝てば、この流れが遅れる。これも、ありうる話です。
