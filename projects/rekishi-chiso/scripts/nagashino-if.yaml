- title: 想像⑥ 日本の変化点と、現代につながる鎖
  background:
    image: paintings/nobunaga_azuchi_castle_zu.jpg
    credit: 近江国蒲生郡安土城之図（1855年原図・明治の写し）
  year: 1582
  lines:
  - 語り: 最後に、日本全体の流れです。史実では、武田氏は天正10年3月に滅び、同じ年の6月に、信長は本能寺で亡くなります。
    portrait: null
    card:
      head: 史実の1582年
      body: 武田氏の滅亡と本能寺
  - 聞き: 同じ年に、武田も信長も……。もし長篠で武田が勝ってたら、どっちも、ずれたのかな。
  - 語り: ここから先は、想像です。ずれた、とも言えますが、手がかりがありません。信長の東の備えが、どれだけ重くなるか。武田が、どこまで持つか。可能性は、ほぼ妄想、です。
    card:
      head: ここから想像
      body: 日本全体の流れ（ほぼ妄想）
  - 聞き: まだ、天下人の話にはならないってことだね。
  - 語り: 一方で、はっきり残っているものもあります。三段撃ちは、江戸時代の書物から生まれたとみられる話が、明治の教科書で広まり、今も語られます。画面は、現在の長篠城跡の石碑です。
    portrait: null
    background:
      image: paintings/nagashino_castle_stone_monument_photo.jpg
      credit: MaedaAkihiko 長篠城跡の石碑（現在の写真、2024年）
  - 語り: ここで、想像は終わりです。まとめに入ります。
    hook: true
  - 聞き: まず、武田はどうなったんだっけ。
    tone: 疑問
    hook: true
- title: まとめ：天正3年5月21日 設楽原の分かれ道
  background:
    image: paintings/nobunaga_nagashino_screen_full.jpg
    credit: 長篠合戦図屏風（江戸時代）
  year: 1575
  lines:
  - 語り: 冒頭の3つの問いに答えます。武田は、勢いを保ちます。宿老の戦死も減ります。信長は、東に兵を割き続けます。ここまでは、ありうる、です。
    portrait: null
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 武田は？
        - 勢いを保つ
        - ありうる
      - - 信長は？
        - 東に兵を割く
        - ありうる
      - - 家康は？
        - 守れたかは不明
        - ほぼ妄想
  - 語り: 家康は、奥平を見捨てず、岡崎で守りに回ります。ただ、三河を守りきれたかは、ほぼ妄想です。武田氏の滅ぶ日、信長が退く先、奥三河の国衆の動きも、ほぼ妄想です。
    background:
      image: paintings/nobunaga_nagashino_screen_toyota.jpg
      credit: 長篠合戦図屏風（豊田市郷土資料館蔵、18世紀）
  - 聞き: 答えが全部、想像なのは、ちょっと悔しいなあ。確かなのは、史実のほうだけか。
  - 語り: いまの3つの答えは、全部、想像です。史実で言えるのは、天正3年5月21日、設楽原で武田が敗れ、宿老3人を含む多くの重臣を失った、ということです。
    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 長篠合戦図屏風（江戸時代）
    card:
      head: 史実で言えること
      body: 武田は敗れ、宿老3人を失った
    figure: null
  - 語り: 勝頼は、評価の割れる人です。決戦を選んだ理由も、少なくとも5つの説に割れたままです。
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院本の部分、16世紀後半）
      age: false
  - 語り: 史実の最期です。天正10年3月11日、勝頼は、嫡男の信勝と、北条から嫁いだ夫人とともに、田野で自害します。37歳でした。
    card:
      head: 天正10年3月11日
      body: 勝頼、信勝・夫人とともに自害
  - 聞き: 家族と一緒に、最期を迎えたのか。決戦を選んだ数え30歳の人が、そこまで走ったんだね。
    tone: しみじみ
  - 語り: 数え30歳の勝頼が、あの軍議の座にいた。その事実だけが、動きません。
    background:
      image: paintings/akechi_nagashino_battle_screen.png
      credit: 長篠合戦図屏風（長浜城歴史博物館蔵、江戸時代）
  - 聞き: 分かれ道を1つ挙げるなら、やっぱり、宿老が「引け」と言ったと伝わる、あの軍議だね。
    portrait: null
  - 語り: 今日の地層は、ここまでです。
  - 聞き: 次の「もしも」は、誰の、どの分かれ道かな。
    tone: 疑問
