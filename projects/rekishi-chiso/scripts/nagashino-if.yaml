      head: 長篠のあと
      body: 上杉・佐竹・毛利と結ぶ
  - 聞き: 負けてから、手を広げたのか。勝ってたら、どうなってたんだろう。
  - 語り: 想像劇場、第4幕です。天正3年の夏、甲府。勝頼と、馬場信春が、向き合います。
