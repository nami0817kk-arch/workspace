      # fact: hideaki-35
      - 語り: 「大谷吉継の祟りで、狂って死んだ」という話は、江戸時代の軍記、『関原軍記大成』などに見えます。史料の裏付けは、弱い話です。
        card: {head: "吉継の祟り", body: 江戸時代の軍記の話}
        portrait: {image: paintings/sanada_otani_yoshitsugu_yoshiiku.jpg, caption: "大谷吉継（落合芳幾筆）"}
      # fact: hideaki-50
      - 語り: 『備前軍記』には、秀秋の死について、別々の死に方が、いくつも書かれています。光成準治さんは、裏切り者の末路は惨めであるべきだ、という因果応報の物語として作られた、と見ています。
      - 語り: 病か、酒か、不運か。記録は、ひとつの答えを、出していません。
        tone: しみじみ
        portrait: null
      # コトバンク（日本大百科全書）・文春オンライン
      # fact: hideaki-36
      - 語り: 秀秋には、跡継ぎがいませんでした。小早川家は、慶長7年に、断絶します。備前には、翌年、姫路の池田輝政の次男、忠継が入りました。
        tone: 重い
        card: {head: "小早川家", body: 慶長7年に断絶}
        figure: {type: numberline, title: 小早川家のその後, items: [[関ヶ原の戦い, 1600], [秀秋の死・断絶, 1602], [池田忠継が入る, 1603], [小早川家の再興, 1879]], unit: 年, focus: 小早川家の再興}
      # コトバンク（日本大百科全書・世界大百科事典）
      # fact: hideaki-37
      - 語り: それから、およそ277年後の、明治12年、1879年。勅により、毛利三郎が家督を継いで、小早川家は、再興されました。
        card: {head: "1879年", body: 小早川家が再興される}
      # 岡山観光WEB おかたび
      # fact: hideaki-38
      - 語り: 岡山市の瑞雲寺は、もとは、1338年創建の、成就寺という寺でした。1602年に、秀秋の菩提寺となり、法号にちなんで、いまの名に変わった、と観光協会は紹介しています。
        card: {head: "岡山の瑞雲寺", body: 秀秋の菩提寺}
        figure: null
        background: {image: paintings/nene_sekigahara_screen_gifu.jpg, credit: "関ヶ原合戦図屏風（江戸後期。Wikimedia Commons）"}
        # AI絵：H14（静かな寺の境内・石畳と木立・人物なし）
      - 語り: 江戸期の本堂は、1945年の岡山空襲を、免れて、いまも残っています。
      - 語り: では、「裏切り者」という呼び名は、いつ、どうやって、育っていったのでしょうか。
        hook: true
        tone: 疑問

  # ================================================================ 第6章 検証：「裏切り者」はどう育ったか
  - title: 「裏切り者」はいつ生まれたのか　1600年から1688年まで
    background: {image: paintings/sekigahara_screen_1854_trim.jpg, credit: "関ヶ原合戦図屏風（1854年の模写。関ケ原町歴史民俗学習館蔵）"}
    # AI絵：H07（江戸時代の書斎・軍記の巻物と行灯・手元だけ）
    year: 1663
    lines:
      # 呉座勇一（PRESIDENT WOMAN Online 2023）
      # fact: hideaki-02
      - 語り: 時間を並べてみます。関ヶ原は、1600年。秀秋の死は、1602年。問い鉄砲が確認できる最も古い本、『慶長軍記』は、1663年です。
        tone: 強調
        figure: {type: numberline, title: 問い鉄砲を書いた本の出る年, items: [[関ヶ原の戦い, 1600], [秀秋の死, 1602], [慶長軍記, 1663], [黒田家譜, 1688]], unit: 年, focus: 慶長軍記}
        # AI絵：H07
      # 呉座勇一（PRESIDENT WOMAN Online 2023）
      # fact: hideaki-03
      - 語り: さらに、元禄元年、1688年。『黒田家譜』にも、鉄砲の場面が出てきます。白峰さんは、こちらを初出と見ている、と紹介されています。初出とされる本も、紹介によって違うんです。
        card: {head: "黒田家譜", body: 1688年 問い鉄砲の場面}
      - 語り: 合戦から、88年。秀秋の死から見ても、二世代がたっています。
        tone: しみじみ
        figure: null
      # 高橋陽介（現代ビジネス 2025）が通説の出どころとして挙げる
      # fact: hideaki-44
      - 語り: そもそも、通説の枠組みは、陸軍参謀本部が編んだ『日本戦史 関原役』によるものです。
        card: {head: "日本戦史 関原役", body: 陸軍参謀本部が編んだ通説の筋}
      # fact: hideaki-44
      - 語り: 9月14日に、秀秋と吉継が、ともに山中にいた。この筋のままだと、秀秋が開戦と同時に、大谷勢の背後を突くことは、できません。
      # vegcale（白峰・光成の見方の紹介）
      # fact: hideaki-21
      - 語り: 秀秋を、「愚将」「凡将」とみる評価は、軍記物の書き方に由来する、と言われています。江戸時代の儒教的な価値観の影響を受けた書き方です。
        card: {head: "愚将の評価", body: 江戸の軍記に由来すると言われる}
        background: {image: paintings/sekigahara_kobayakawa_hideaki_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 小早川秀秋》幕末（1860年代）"}
        # AI絵：H08（行灯の下で軍記の頁をめくる手・顔なし）
      - 語り: 光成準治さんらが、その見直しを進めています。
      # fact: hideaki-51
      - 語り: 寝返りの動機の説明も、ひとつではありません。サライの記事は、秀吉との因縁、三成への嫌悪、家康への旧領回復の恩、北政所からの打診、と、諸説を並べています。
        card: {head: "寝返りの動機", body: 諸説あって決まらない}
      - 語り: 家康が勝った物語の中で、秀秋は、迷う役を、少しずつ、与えられていったのかもしれません。
        tone: しみじみ
        hook: true
      - 語り: 最後に、ここまでの話を、もう一度、並べてみます。
        pause: 0.4
        hook: true

  # ================================================================ まとめ
  - title: まとめ：なぜ「裏切り者」になったのか
    background: {image: paintings/sekigahara_zubyobu.jpg, credit: "関ヶ原合戦図屏風（江戸時代。Wikimedia Commons）"}
    # AI絵：H15（終了画面用。夕暮れの松尾山の稜線と谷、右半分を空ける）
    year: 1602
    lines:
      - 語り: 秀秋が、開戦前から東軍だったのか、開戦のあとに寝返ったのか。いまも、研究者の見立ては、割れています。
        tone: 強調
        background: {image: paintings/sekigahara_kobayakawa_hideaki_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 小早川秀秋》幕末（1860年代）"}
      - 語り: ただ、ひとつ言えるのは、鉄砲の音が63年後の本の中で鳴りはじめた、ということです。
        tone: しみじみ
      - 語り: 合戦の2日後の書状は、午前10時ごろ、戦いが始まってすぐに、秀秋ら4人が味方した、と書いていました。
        background: {image: paintings/sekigahara_zubyobu_p3a.jpg, credit: "関ヶ原合戦図屏風の部分（江戸時代。Wikimedia Commons）"}
      - 語り: 越前の石高も、開戦の時刻も、松尾山の守り手の石高も、岡山の石高も。記録をたどるほど、数は、ばらばらでした。
        tone: しみじみ
      - 語り: 迷う若者の姿は、記録に残った秀秋ではなく、あとから語られた、秀秋だったのかもしれません。
        tone: しみじみ
        portrait: {image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg, caption: "伝小早川秀秋像（17世紀前半・高台寺蔵）"}
      # 締め：冒頭の鉄砲に戻る
      # fact: hideaki-02
      - 語り: 家康の鉄砲が、松尾山に鳴り響いたのは、1600年ではなく、1663年だったのかもしれない。
        tone: しみじみ
        pause: 0.8
        portrait: null

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。

