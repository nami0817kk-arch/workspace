# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml の型。見本は scripts/yodo-story.yaml・hijikata-story.yaml）。小早川秀秋。2026-10-29 下書き。
# 公開の予定は 10/31 12:00（昼＝B 作品の枠ではなく、10/31 の本編として作る。枠は親が決める）。
# 型：1本に1つの「なぜ」＝「なぜ秀秋は『裏切り者』になったのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝家康の「問い鉄砲」を書いた最も古い本は、関ヶ原から63年後の『慶長軍記』（1663）で、同じ年の書状には無い（hideaki-問鉄砲の初出）。
#   第1章 筑前の少年国主（養子・30万石・減封の石高 12万/15万・蔚山説と讒言説への反論・復領）／
#   第2章 開戦の半月前（道阿弥・西尾家譜・8/28 の書状・9/9 の噂・9/13 の家康の指示・松尾山と伊藤盛正）／
#   第3章 9月15日（開戦の時刻 8時/10時・連署状・大谷勢の敗北と裏切りは別・600の精兵・笠谷と白峰・「せがれめに」）／
#   第4章 岡山の2年（石高 50/51/55万・二十日堀・大納戸櫓・石垣・杉原紀伊守）／
#   第5章 急死と断絶（10/15〜18・『舜旧記』・酒疸・肝硬変は推定・吉継の祟りは軍記・断絶・1879再興・瑞雲寺）／
#   第6章 検証「裏切り者」はどう育ったか（1663・1688・愚将像・現在の三つの立場）／ まとめ→冒頭の鉄砲に戻って閉じる。締めは余韻の一文＋登録のお願い。次回予告なし（story: true）。
# 記録の食い違いを並べたのは5か所：①越前の石高 12万石/15万石 ②開戦の時刻 午前8時/10時 ③伊藤盛正の石高 3万/3万4000と退去の経緯 ④岡山の石高 50/51/55万石 ⑤秀秋は開戦前から東軍か（白峰・高橋／光成・呉座）。ほかに語りだけで：問鉄砲の史実性（白峰／笠谷）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/小早川秀秋_facts_20261029.yaml、hideaki-NN）にあるものだけ。行の上に `# fact: hideaki-NN`。
#   出どころは本文を開いた一般向けの記事・新書の抜粋・自治体の解説が中心で、同時代の書状・日記の原文は開けていない（連署状・近衛前久書状・舜旧記・医学天正記は他の人の紹介を通した）。
#   だから語りは「呉座勇一さんの紹介では」「高橋陽介さんは〜と読みます」と、誰がそう述べているかを必ず言う。原文を読んだように言わない。
#   『医学天正記』の酒疸（hideaki-酒疸）は転載ページ経由の引用なので「とされる」まで。数字（1キロ・射程）は白峰旬の指摘として、記事の紹介のまま言う。
#   秀秋の動機（なぜ寝返ったか）は断定しない。復領の恩義・讒言の恨みどちらも決めつけない。「臆病」「愚か」と言わない（そう言われてきた、と言うだけ）。
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む。想像の台詞は2か所（秀秋想像。気持ちの言葉だけ・新しい事実を足さない）。
# 死の扱い：最期は「亡くなった」まで。病の細部・苦しむ様子は語らない。人を貶めない（吉継・三成・家康・作者も悪く言わず、「なぜそう書いたか」を見立てとして言う）。
# 絵：paintings/ の実在の絵（伝秀秋像・芳年・芳幾・関ヶ原図屏風・陣立図・関ヶ原の地図ほか。出典は paintings/credits.json）＋ AI 絵（H01〜H15、
#   一覧は dev/output/rekishi-chiso/research/hideaki_ai_images.md）。最期の場面（H13）は人物を描かない（病床・亡骸の絵なし）。
