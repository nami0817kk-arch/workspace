# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  関ヶ原の決め手とされる、家康の「問い鉄砲」。この場面を書いた最も古い本は、関ヶ原から63年後、寛文3年（1663）の軍記でした。
  一方、合戦の2日後、慶長5年9月17日付の書状の写しは、午前10時ごろ、戦いが始まってすぐに、小早川秀秋ら4人が東軍に味方したと記します。
  同じ19歳の若者を、記録はどう書き、のちの本はどう書いたのか。なぜ秀秋は、「裏切り者」になったのか。
  この動画でわかること
  ・「問い鉄砲」が書かれた時代と、同じ時代の書状に書かれていないこと
  ・開戦の半月前から、家康の使者と連絡を取り合っていたという読み方
  ・開戦の時刻・松尾山の守り手・越前の石高・岡山の石高――記録によって割れる数
  ・岡山の二十日堀と、2年で終わった治世、秀秋の死と、小早川家のその後
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  書状・日記・軍記の文言は、研究者や報道の紹介を通して読んだもので、原文そのものを読んだものではありません。語りの中でも、誰の紹介かを言っています。
  関ヶ原の戦いの経緯は、高橋陽介さん・白峰旬さん・呉座勇一さん・光成準治さん・笠谷和比古さんらの見方が分かれています。

en:
  title: "Kobayakawa Hideaki: The Warning Shot at Sekigahara First Appears in a Book 63 Years Later"
  description: |-
    The "warning shot" Tokugawa Ieyasu supposedly fired to push Kobayakawa Hideaki into changing sides is often called the turning point of Sekigahara. The oldest known text that describes it is a war chronicle completed in 1663, 63 years after the battle.
    A letter dated two days after the battle says that Hideaki and three others joined the eastern army right after fighting began, around 10 a.m.
    How did the records describe this 19-year-old, and how did later books? Why did Hideaki become a "traitor"?
    In this video you will learn:
    - When the "warning shot" was written down, and what contemporary letters leave out
    - The reading that Hideaki was already in contact with Ieyasu's envoys half a month before the battle
    - Numbers that differ by source: the hour the battle began, the guard of Matsuo Mountain, his fief in Echizen, his fief in Okayama
    - Okayama's Hatsuka Moat, a two-year rule, his death, and what became of the Kobayakawa house
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Warning Shot Appears 63 Years Later: Keicho Gunki, 1663"
    - "A Teenage Lord of Chikuzen: Adoption, 300,000 Koku, and Two Theories on His Demotion"
    - "Half a Month Before Sekigahara: Envoys, Letters, and Matsuo Mountain"
    - "September 15, 1600: What the Records Say About the Hour of the Betrayal"
    - "Two Years in Okayama: The Hatsuka Moat and the Turret"
    - "Death at 21 and the End of the House"
    - "How the 'Traitor' Was Made: From 1663 to Today"
    - "Summary: Why Did Hideaki Become a Traitor?"

