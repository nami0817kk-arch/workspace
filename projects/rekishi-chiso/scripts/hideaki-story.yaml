sections:
  # ================================================================ 序章（冒頭 約2分30秒）
  - title: 鉄砲を書いた最も古い本は63年後　慶長軍記 1663年
    background: {image: paintings/sekigahara_zubyobu.jpg, credit: "関ヶ原合戦図屏風（江戸時代。Wikimedia Commons）"}
    # AI絵：H01（霧の松尾山を遠くから見上げる。人物なし）
    year: 1600
    lines:
      # 呉座勇一（PRESIDENT WOMAN Online 2023）の紹介
      # fact: hideaki-02
      - 語り: 家康が撃たせた一発の鉄砲が、小早川秀秋を寝返らせた。この「問い鉄砲」を書いた最も古い本は、関ヶ原から63年後に出ました。
        tone: 重い
        card: {head: "問い鉄砲", body: 最も古い本は63年後}
      # fact: hideaki-02
      - 語り: 寛文3年、1663年の、『慶長軍記』。関ヶ原の年の書状には、この鉄砲は、見当たりません。
        card: {head: "慶長軍記", body: 1663年の軍記}
      # 呉座勇一（PRESIDENT WOMAN Online 2023）が紹介する通説
      # fact: hideaki-40
      - 語り: 通説の筋は、こうです。正午すぎ、家康が、松尾山の小早川隊に鉄砲を撃ちかけます。
        card: {head: "通説の筋", body: 正午すぎに家康の鉄砲}
      # fact: hideaki-40
      - 語り: 恐れた秀秋は、1万人を超える大軍で山を下り、大谷吉継の隊に突入する。
        card: {head: "通説の筋", body: 1万人超が山を下る}
      # 石川康通・彦坂元正連署状写（堀文書）。呉座の紹介
      # fact: hideaki-04
      - 語り: ところが、慶長5年、1600年の9月17日。合戦の2日後に、家康の家臣、石川康通と彦坂元正が出した書状の写しが、残っています。
        portrait: {image: paintings/sekigahara_tokugawa_ieyasu.jpg, caption: "徳川家康像（17世紀）"}
      # fact: hideaki-04
      - 語り: 呉座勇一さんの紹介では、こう書かれています。15日の、巳の刻。午前10時ごろ、戦いが始まってすぐに、4人が、東軍に味方した、と。
        tone: 強調
        card: {head: "9月17日付の書状", body: 開戦すぐに4人が味方}
        portrait: null
      # fact: hideaki-04
      - 語り: その4人とは、小早川秀秋、脇坂安治、そして、小川祐忠と祐滋の父子です。
        card: {head: "味方した4人", body: 秀秋・脇坂安治・小川祐忠 祐滋}
      # fact: hideaki-05
      - 語り: 9月20日の近衛前久の書状も、東軍が「即時」に勝った、と伝えます。けれど、秀秋のためらいにも、鉄砲にも、触れていません。
        card: {head: "9月20日 近衛前久", body: 東軍は「即時」に勝った}
      - 語り: 松尾山は、関ヶ原の谷を見下ろす山です。そこに、西軍の側の陣として、小早川勢が入っていました。
        # AI絵：H01
      # 白峰旬の指摘（vegcale の紹介）
      # fact: hideaki-06
      - 語り: しかも、家康の陣から松尾山の山頂までは、1キロ以上あります。白峰旬さんは、火縄銃の有効な射程、100から200メートルほどでは、届かない、と指摘しています。
        card: {head: "家康の陣から松尾山", body: 1キロ以上 射程は100〜200m}
      # 高橋陽介（『シン・関ヶ原』抜粋 2025）。家譜の中身は第2章で
      # fact: hideaki-09
      - 語り: 一方で、開戦の半月以上前から、秀秋は動いていた、という読み方があります。8月26日ごろ、近江の柏原で、家康の使者と会い、東軍に味方すると約束した、と。
        tone: しみじみ
        portrait: {image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg, caption: "伝小早川秀秋像（17世紀前半・高台寺蔵）"}
        background: {image: paintings/mitsunari_sekigahara_kisokaido_hiroshige.jpg, credit: "歌川広重・溪斎英泉《木曽海道六拾九次之内 関ヶ原》江戸後期"}
      # fact: hideaki-12
      - 語り: 9月9日ごろには、「秀秋が東軍についた」という噂が、両陣営に広まっていた、とも言います。
        card: {head: "9月9日ごろ", body: 「秀秋が東軍に」という噂}
      # fact: hideaki-39
      - 語り: 関ヶ原のとき、秀秋は、数えで19歳。のちに「裏切り者」と呼ばれる若者は、記録の中で、どんな人だったのでしょうか。
        portrait: null
        card: {head: "関ヶ原のとき", body: 19歳}
      # 約束の1文
      - 語り: これは、裏切りの瞬間ではなく、「裏切り者」という姿が、どう作られていったのかをたどる、物語です。
        tone: しみじみ
        pause: 0.6
      # 橋渡し
      - 語り: 始まりは、筑前。少年が、国主になった年です。
        pause: 0.6

  # ================================================================ 第1章 筑前の少年国主（1594〜1599）
  - title: なぜ秀秋は領地を取り上げられたのか　筑前の少年国主 1594年
    background: {image: paintings/hideyoshi_nene_kodaiin_1910copy.jpg, credit: "高台院像（高台寺本の模写、1910年）"}
    # AI絵：H02（筑前の海に面した城下を遠くから見る・人物なし）
    year: 1594
    lines:
      # 前置き（誰でも知っている流れ）
      - 語り: 秀秋は、秀吉の妻、北政所の兄の子です。秀吉の養子になり、そして、小早川隆景の養子に出されました。
        tone: しみじみ
        portrait: {image: paintings/hideyoshi_portrait_osaka_city_1600.jpg, caption: "豊臣秀吉像（大阪市立美術館蔵）"}
      # 真山知幸（幻冬舎GOLD ONLINE 2024）
      # fact: hideaki-41
      - 語り: 幻冬舎の解説は、そのとき、隆景の側から、「養子にほしい」という話が持ち上がった、と書いています。
        portrait: null
      # fact: hideaki-22
      - 語り: やがて、隆景のあとを受けて、筑前と筑後の、30万石以上を預かる国主になります。まだ10代でした。
        portrait: null
        card: {head: "筑前・筑後", body: 30万石以上を預かる}
        # AI絵：H02
      # 前置き（誰でも知っている：朝鮮出兵・秀吉の死）
      - 語り: ところが、秀吉は、その領地を取り上げて、秀秋を越前に移します。
        tone: 重い
      # 真山知幸（幻冬舎 2024）・深井元惠（サライ 2023）
      # fact: hideaki-23
      - 語り: 移された先の石高は、記事によって違います。幻冬舎の解説は、12万石。サライの記事は、15万石と書いています。
        tone: 強調
        card: {head: "越前の石高", body: 12万石とも15万石とも}
      # 渡邊大門（Yahoo!ニュース 2023）
      # fact: hideaki-24
      - 語り: 理由は、朝鮮の蔚山で、総大将なのに敵陣へ乗り込んだ軽率さが、秀吉の怒りを買った、と語られてきました。
      # fact: hideaki-24
      - 語り: けれど、渡邊大門さんは、秀秋の帰国は、蔚山の戦いより前に決まっていた、と述べています。
        background: {image: paintings/mitsunari_busanjin_1592.jpg, credit: "釜山鎮の戦いの図（1592年。Wikimedia Commons）"}
      # fact: hideaki-25
      - 語り: 「石田三成の讒言で、領地を取り上げられた」という話も、有名です。
      # fact: hideaki-25
      - 語り: 渡邊さんは、慶長3年5月の、三成の書状に注目します。家臣の大音新介にあてた書状で、三成は、代官として筑前を一時、預かっただけだ、と。
        card: {head: "三成の書状", body: 筑前を預かっただけ}
        portrait: {image: paintings/sekigahara_ishida_mitsunari.jpg, caption: "石田三成像"}
      # fact: hideaki-25
      - 語り: 讒言の恨みで寝返った、という筋は、書状のほうから、崩されているわけです。
        tone: しみじみ
        portrait: null
      # 前置き（誰でも知っている：慶長3年に秀吉が亡くなる）
      - 語り: 慶長3年、1598年。秀吉が亡くなります。
        tone: 重い
      # 真山知幸（幻冬舎 2024）
      # fact: hideaki-26
      - 語り: 一般向けの解説は、家康が働きかけたことで、秀秋は、筑前と筑後を取り戻した、と書きます。
        background: {image: paintings/ieyasu_sekigahara_senjinzu_toiteppo.jpg, credit: "関ヶ原陣立図（19世紀）の部分"}
        portrait: {image: paintings/sekigahara_tokugawa_ieyasu.jpg, caption: "徳川家康像（伝 狩野探幽、17世紀）"}
      - 語り: 取り上げられ、戻される。19歳に届く前の若者の領地は、大人たちの都合で、動いていました。
        tone: しみじみ
        hook: true
      # 武将ジャパン（2026）が紹介する書状。『武家事紀』
      # fact: hideaki-46
      - 語り: 慶長5年、4月9日付の、秀秋自身の書状が残っています。「昨日は大酒ゆえ、さんざん酔い、正体なく候」。19歳の若者が、前の日の酒を、そう書いていました。
        card: {head: "慶長5年4月9日付の書状", body: 「昨日は大酒ゆえ 正体なく候」}
      - 語り: 武将ジャパンの記事によれば、『武家事紀』は、秀秋が北政所から、深酒を戒められていた、と載せています。
      - 語り: そして、慶長5年。秀秋のもとに、東からの使いが、やって来ます。
        tone: 重い
        hook: true

  # ================================================================ 第2章 開戦の半月前（1600年8月〜9月14日）
  - title: 開戦の半月前に何が届いたか　慶長5年8月
    background: {image: paintings/sekigahara_map_1926.jpg, credit: "関ヶ原の戦い 地図（藤井治左衛門、1926年）"}
    # AI絵：H03（夏の街道を急ぐ使者の後ろ姿・遠景）
    year: 1600
    lines:
      # 高橋陽介（『シン・関ヶ原』抜粋 2025）。『寛政重修諸家譜』所収の西尾家の家譜
      # fact: hideaki-10
      - 語り: 高橋陽介さんが読み解く史料は、『寛政重修諸家譜』にある、西尾家の家譜です。
      # fact: hideaki-10
