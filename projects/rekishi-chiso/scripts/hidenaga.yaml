sections:
  # ---------------------------------------------------------------- 1 地表
  - title: 地表：1586年 大坂城の「公儀の事は宰相」
    background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
    portrait: {image: paintings/hidenaga_portrait_shungakuin.jpg, caption: "豊臣秀長（春岳院蔵とされる肖像、江戸時代）", age: false}
    year: 1586
    lines:
      - 語り: 1586年4月、大坂城。九州から助けを求めに来た大友宗麟に、秀吉の弟、豊臣秀長は、こう言いました。
        card: {head: "1586年4月", body: 大坂城で大友宗麟に}
        tone: 重い
        short: s1
      - 人物: 「内々の儀は宗易、公儀の事は宰相存じ候」
        who: 秀長
        short: s1
      - 聞き: 呪文みたい。宗易って誰？ 宰相っていうのも、偉い人っぽいけど。
        tone: 疑問
      - 語り: 宗易は、茶人の千利休の、そのころの名前です。宰相は、秀長自身のこと。内々のことは利休に、表向きのことは私に、という意味です。
        background: {image: paintings/hidenaga_rikyu_tohaku.jpg, credit: "長谷川等伯《千利休像》（春屋宗園賛、1595年）"}
        short: s1
      - 語り: 宗麟はこの言葉を、国元の家臣に送った手紙に書き留めました。秀長の言葉として残る、数少ないものの一つです。
        icon: envelope-simple
        short: s1
      - 聞き: 表のことは自分が引き受ける、って言い切ってるじゃん。控えめな弟、ってイメージだったのに。
        background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
        short: s1
      - 語り: その秀長は、2026年の大河ドラマ『豊臣兄弟！』で、主人公になりました。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      - 聞き: 知ってる、日曜の夜に見てるもん。
      - 語り: この動画は、ドラマとは関係なく、記録から秀長を追っていきます。まずは、よく聞く話を4つ並べます。
      - 語り: 1つ目は、秀吉とは父の違う、異父弟だった。
        card: {head: よく聞く話, body: 異父弟だった}
      - 聞き: それ聞いたことある！ 2つ目はあれでしょ。目立たないけど、兄ちゃんを陰で支えた、控えめな名補佐役。
        card: {head: よく聞く話, body: 控えめな名補佐役}
      - 語り: はい。3つ目、秀長が生きていれば、豊臣家は滅びなかった。4つ目、実は暗殺された。
        background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
        card: {head: よく聞く話, body: 生きていれば・暗殺された}
      - 聞き: 4つ目だけ急に物騒。でもそれ、ネットで見たことあるかも。
      - 語り: これが今日の《地表》です。ただ、秀長は記録の少ない人です。研究者の渡邊大門さんも、「実像を描くのは困難」と書いています。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
      - 聞き: 記録が少ないなら、分からないとこは分からないって言ってね。あーし、盛った話より、そっちが聞きたい。
      - 語り: 約束します。分かっていることと、物語で語られてきたことを分けながら、数えで52年の生涯を、生まれた順に掘ります。
      - 聞き: 了解。じゃあまずは、兄弟の父親の話からね。

  # ---------------------------------------------------------------- 2 生まれと空白
  - title: 1540年 尾張の中村から、1574年 長島の「木下小一郎」へ
    background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉・秀長の母）"}
    year: 1540
    lines:
      - 語り: 1540年、尾張の中村。今の名古屋市中村区で、秀長は生まれます。母は、なか。のちの大政所です。
        card: {head: 1540年, body: 尾張の中村に生まれる}
      - 聞き: きょうだいは、秀吉と秀長の2人だけ？
        tone: 疑問
      - 語り: 姉に日秀、妹に朝日がいます。日秀は、のちに秀次の母になる人。朝日は、のちに徳川家康の妻になる人です。
        background: {image: paintings/hidenaga_hidetsugu.jpg, credit: "《豊臣秀次像》17世紀前半（姉・日秀の子）"}
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）", age: false}
      - 聞き: 4人きょうだいの、真ん中の男2人なんだ。姉ちゃんと妹にはさまれてるの、ちょっと親近感。
      - 語り: 生まれた年を、1541年とする辞典もあります。1540年の根拠は、亡くなる前の年の祈りの文に、年が「五十一」と書かれていたことです。
        background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉・秀長の母）"}
        card: {head: 1590年の祈りの文, body: 年は「五十一」}
        portrait: null
      - 聞き: 年から逆算してるんだ。誕生日の記録は、ないの？
        tone: 疑問
      - 語り: 3月2日という日付は、後の時代の系図に出てくるもので、当時の記録では確かめられていません。
        portrait: {image: paintings/hidenaga_portrait_shungakuin.jpg, caption: "豊臣秀長（春岳院蔵とされる肖像、江戸時代）", age: false}
      - 聞き: 誕生日も分からないなんて。あーしの誕生日なんか、スマホが毎年お祝いしてくれるのに。
      - 語り: 秀長の兄、秀吉は、3つ上。二人は昔から、父の違う兄弟だと言われてきました。秀吉の父は弥右衛門、秀長の父は竹阿弥、という話です。
        background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
        portrait: null
        figure: {type: people, title: 兄弟の父をめぐる説, nodes: [[なか, 母（のちの大政所）], [弥右衛門, 父], [竹阿弥, 秀長の父とする話], [秀吉, 兄], [秀長, 弟]],
                 edges: [[なか, 秀吉, 母], [なか, 秀長, 母], [弥右衛門, 秀吉, 父], [竹阿弥, 秀長, 父？（江戸の本）]]}
        short: s2
      - 聞き: 異父弟ってやつね。それって、どこに書いてあるの？
        short: s2
      - 語り: 出どころは、江戸時代の『太閤素生記』などの本です。近年は、二人とも弥右衛門の子、同じ父の兄弟とみる研究者が多くなりました。
        figure: {type: people, title: 兄弟の父をめぐる説, nodes: [[なか, 母（のちの大政所）], [弥右衛門, 父], [竹阿弥, 秀長の父とする話], [秀吉, 兄], [秀長, 弟]],
                 edges: [[なか, 秀吉, 母], [なか, 秀長, 母], [弥右衛門, 秀吉, 父], [竹阿弥, 秀長, 父？（江戸の本）]]}
        mark: {type: strike, at: 3}
        short: s2
      - 聞き: ドラマも、同じ父ちゃんの兄弟として描いてるよね。弥右衛門と竹阿弥は、同じ人ってこと？
        short: s2
      - 語り: そうみる説もあります。幼い名の「小竹」も、当時の文書にはありません。竹阿弥の子、というあだ名だったとみる研究者もいます。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年、若いころの秀吉）"}
        figure: null
        short: s2
      - 聞き: 名前まであだ名かもなんだ。じゃあ、子どものころの兄弟の話って、どれくらい残ってるの？
      - 語り: ほとんど残っていません。兄が織田信長に仕えて出世していく中で、秀長も信長の家臣になりますが、それがいつなのかも、はっきりしません。
      - 聞き: 墨俣の一夜城とか、若いころに兄弟で頑張る話、よく聞くよ？
      - 語り: 墨俣の一夜城は、それ自体が、同時代の記録で確かめられない話です。秀長が記録に出てくるのは、30代の半ばから。
      - 語り: 1574年7月、伊勢の長島。『信長公記』に「木下小一郎」の名で出てくるのが、記録の上で最初の戦いです。数えで35歳でした。
        background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
        year: 1574
        card: {head: "1574年7月", body: 「木下小一郎」の名で初登場}
        figure: {type: map, title: 尾張の中村から伊勢の長島へ, bounds: [135.9, 137.6, 34.5, 35.7],
                 places: [[中村, 136.87, 35.17], [長島, 136.69, 35.09]], route: [中村, 長島]}
      - 聞き: 35歳でデビュー！？ 今なら課長くらいの歳じゃん。それまでの34年、まるごと空白なの？
        tone: 驚き
      - 語り: そうなります。長島の戦いでは、信長が一揆に非常に厳しい処置をとり、多くの命が失われました。秀長は、その一角の城攻めを受け持っています。
        figure: null
      - 聞き: 記録の最初が、そういう戦いなんだ。秀長はそこで、城を攻める側の一人だったんだね。
        tone: 重い
      - 語り: 翌1575年には「羽柴小一郎長秀」と署名した文書が残ります。名字は、兄と同じ羽柴です。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        year: 1575
        card: {head: 1575年, body: 「羽柴小一郎長秀」と署名}
      - 語り: 兄の秀吉は、家臣の黒田孝高に宛てた、黒田家に伝わる手紙で、こう書いています。
        card: {head: 秀吉の手紙, body: 「小一郎め同然に心安く」}
      - 人物: 「そなたのことは、わが弟の小一郎めと同じように、気安く思っている」
        who: 秀吉
      - 聞き: 信用の物差しが、弟なんだ。兄ちゃん、弟のことめっちゃ頼りにしてるじゃん。
      - 語り: その弟は、やがて兄の戦いの中で、ひとつの城を任されます。
        hook: true

  # ---------------------------------------------------------------- 3 但馬
  - title: 1577年 但馬の竹田城と10万5千石
    background: {image: paintings/hidenaga_tajima_map_1780.jpg, credit: "秀一堂《但馬国輿地全図》1780年"}
    year: 1577
    lines:
      - 語り: 1577年、兄は信長の命で、中国地方の攻略に向かいます。秀長も従って播磨へ入り、11月には、但馬の竹田城を攻め落としました。
        card: {head: "1577年11月", body: 但馬の竹田城を落とす}
      - 聞き: 但馬って、今の兵庫県の北のほうだよね。それで、落とした城はどうしたの？
        tone: 疑問
      - 語り: 秀長は竹田城の《城代》、城を預かる役になります。数えで38歳。初めて、自分の持ち場を持ったわけです。
      - 聞き: 35歳でデビューして、3年で城を任されるんだ。「小一郎め同然」って、本気だったんだね。
      - 語り: その前の年、1576年には、藤堂高虎が秀長に仕えています。のちに、秀長の右腕になる人です。
        background: {image: paintings/hidenaga_todo_takatora.jpg, credit: "《藤堂高虎像》1907年の模写"}
      - 聞き: 藤堂高虎って、名前は聞いたことある。秀長の家来だったんだ。
      - 語り: 竹田城のころの秀長の文書が残っています。生野の銀山と播磨を結ぶ街道の、宿場の人夫の役を免じたものです。
        background: {image: paintings/hidenaga_tajima_map_1780.jpg, credit: "秀一堂《但馬国輿地全図》1780年"}
      - 聞き: 人夫の役を免じる？ 道で荷物を運ぶ人たちの負担を、軽くしたってこと？
        tone: 疑問
        icon: road-horizon
      - 語り: そうです。銀を運ぶ道を、使いやすくしておく。戦いだけでなく、土地を治める仕事が、ここから始まっています。
      - 聞き: 銀山につながる道を整えるの、地味だけど大事なやつだ。こういう命令の紙が、秀長の足あとなんだね。
      - 語り: 1578年からは、兄が播磨の三木城を囲む長い戦いにも加わりました。
        background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
        year: 1578
      - 語り: そして1580年5月、但馬の出石城を落として、但馬を平定します。
        background: {image: paintings/hidenaga_tajima_map_1780.jpg, credit: "秀一堂《但馬国輿地全図》1780年"}
        year: 1580
        card: {head: "1580年5月", body: 出石城を落とし但馬を平定}
        figure: {type: map, title: 秀長の但馬攻め, bounds: [133.9, 135.6, 34.6, 35.8],
                 places: [[姫路, 134.69, 34.83], [竹田城, 134.83, 35.30], [出石, 134.87, 35.46]], route: [姫路, 竹田城, 出石]}
      - 語り: 恩賞は、但馬の7つの郡、10万5千石あまり。実際に治めたのは4つの郡ほどだった、とする見方もあります。
        card: {head: 1580年, body: 但馬10万5千石あまり}
      - 聞き: 10万石って、どれくらいの大きさ？ 数字が大きすぎて、ピンとこない。
        figure: null
      - 語り: 1石は、大人1人が1年に食べる米の量で、およそ150キロ。10万石なら、10万人を1年養える米、と考えてください。
        icon: grains
      - 聞き: 10万人分のごはん！ あーし一人なら、何回生まれ変わっても食べきれない。
        tone: 驚き
      - 語り: 翌1581年には、因幡の鳥取城を囲む陣の一つを指揮しました。
        background: {image: paintings/hidenaga_tottori_castle_map.jpg, credit: "『日本古城絵図』因幡国鳥取城図（江戸時代、国立国会図書館蔵）"}
        year: 1581
        card: {head: 1581年, body: 鳥取城を囲む陣の一つを指揮}
      - 語り: 鳥取城は長く囲まれ、城の中は食べ物が尽きて、ひどい状態になりました。
      - 聞き: 囲んでる側も、ずっと待ち続けるんでしょ。根気の勝負だ。
      - 語り: そしてその翌年、兄弟の運命を変える知らせが届きます。
        hook: true

  # ---------------------------------------------------------------- 4 山崎・賤ヶ岳・改名
  - title: 1582〜84年 天王山・賤ヶ岳・羽柴秀長へ
    background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《真書太閤記 本能寺焼討之図》1893年（後世の想像図）"}
    year: 1582
    lines:
      - 語り: 1582年6月2日、京都の本能寺で、主君の織田信長が、家臣の明智光秀に襲われ、亡くなります。
        card: {head: "1582年6月2日", body: 本能寺の変}
      - 聞き: 主君がいきなりいなくなった！ 兄弟は、そのときどこにいたの？
        tone: 疑問
      - 語り: 中国地方です。兄弟は、急いで引き返します。この道のりは明日の秀吉の回で掘ることにして、今日は弟の役回りを見ます。
      - 聞き: 中国大返しね。じゃあ、引き返した弟は、何をしてたの？
        tone: 疑問
      - 語り: 6月13日の山崎の戦いで、秀長は、黒田孝高らとともに、天王山の守りにつきました。
        background: {image: paintings/akechi_yamazaki_sadahide_met.jpg, credit: "歌川貞秀《山崎大合戦之図》19世紀中ごろ"}
        card: {head: "1582年6月13日", body: 山崎の戦い 天王山を守る}
      - 聞き: 兄ちゃんが本隊で、弟は山の守り。役割分担、ちゃんとしてるじゃん。
      - 語り: 翌1583年4月、近江の賤ヶ岳の戦い。相手は、信長の重臣だった柴田勝家です。
        background: {image: paintings/hidenaga_shizugatake_screen_1.jpg, credit: "《賤ヶ岳合戦図屏風》江戸時代"}
        year: 1583
        card: {head: "1583年4月", body: 賤ヶ岳の戦い}
      - 語り: 秀長は田上山に陣を置き、美濃へ出ていた兄が駆け戻るまで、木之本の本陣を守りました。
        detail: {box: [0.0, 0.0, 0.5, 1.0], label: 山の陣（賤ヶ岳合戦図屏風、江戸時代）}
      - 聞き: 兄ちゃんの留守に、本陣を任されてたんだ。もう副社長じゃん。あーしなら、留守番だけで緊張する。
      - 語り: この年の3月には、美濃守という役職も得ています。戦いのあと、秀長は、但馬と播磨の領主として、姫路城に入ります。
        background: {image: paintings/hidenaga_shizugatake_screen_2.jpg, credit: "《賤ヶ岳合戦図屏風》江戸時代（もう一方の隻）"}
        card: {head: 1583年, body: 但馬・播磨の領主として姫路城へ}
      - 語り: このころまでに、秀長は跡取りの息子、与一郎を亡くしていたとみられます。与一郎は同時代の記録には出てこず、江戸時代の本で伝わる人です。
        background: {image: paintings/hidenaga_omandokoro.jpg, credit: "《大政所像》江戸時代（秀吉・秀長の母）"}
      - 聞き: 出世していく一方で、跡取りを亡くしてたんだ。それ、あとで響いてきそう。
        tone: しみじみ
      - 語り: 次の1584年、兄は、徳川家康と、家康と組んだ織田信雄を相手に、小牧・長久手で戦います。
        background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
        year: 1584
        card: {head: 1584年, body: 小牧・長久手の戦い}
      - 語り: 秀長は伊勢に攻め入って松ヶ島城を落とし、信雄との講和では、兄の《名代》として、直接話し合いました。
        icon: handshake
      - 聞き: 名代って、代理ってことでしょ。戦う係から、話し合う係にまで広がってる。
      - 語り: この年の6月から9月のあいだに、名前も「長秀」から「秀長」に変わります。
        background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
        card: {head: 1584年, body: 羽柴長秀から羽柴秀長へ}
      - 語り: 名前の上の字が、信長の「長」から、兄の「秀」に替わったわけです。兄が信長の後を継ぐ立場を固めたからだ、とみられています。
      - 聞き: 字の順番を入れかえるだけで、誰のチームかが変わるんだ。名前って、看板なんだね。
        tone: 納得
      - 語り: そして翌年、秀長は兄のいない戦場で、10万を超える軍の総大将になります。
        hook: true

  # ---------------------------------------------------------------- 5 紀州と四国
  - title: 1585年 紀州攻めと四国攻めの総大将
    background: {image: paintings/hidenaga_ota_castle_flood_map.jpg, credit: "《総光寺由来太田城水責図》江戸時代"}
    year: 1585
    lines:
      - 語り: 1585年3月、まず紀伊の国への攻めが始まります。秀長は、甥の秀次とともに副将でした。
        card: {head: "1585年3月", body: 紀州攻め 秀次とともに副将}
      - 聞き: 秀次って、さっきの姉ちゃん、日秀の子だよね。甥っ子と組んで出てるんだ。
      - 語り: はい。紀伊の太田城では、城のまわりに堤を築いて、水で囲む攻め方がとられました。
      - 聞き: 城ごと水で囲むの？ スケールが大きすぎて、想像が追いつかない。
      - 語り: 戦いのあと、秀長は紀伊と和泉、あわせて約64万石を与えられます。但馬の10万石から、5年で6倍です。
        background: {image: paintings/hidenaga_negoro_map.jpg, credit: "《根来出城図》江戸時代（紀州攻めの根来寺周辺）"}
        card: {head: 1585年, body: 紀伊・和泉 約64万石}
      - 聞き: 6倍！？ お給料が6倍になる転職なんて、聞いたことないよ。
        tone: 驚き
      - 語り: 紀伊では、新しい城が築かれます。今の和歌山城です。秀吉が自ら場所を選び、普請奉行は藤堂高虎。1年で仕上がりました。
        background: {image: paintings/hidenaga_wakayama_castle_map_crop.jpg, credit: "『日本古城絵図』紀州和歌山城図（江戸時代、国立国会図書館蔵）"}
        card: {head: 1585年, body: 和歌山城を築く}
      - 聞き: 和歌山城って、そこから始まったんだ。竹田城のころからの家来が、城づくりの責任者になってる。
      - 語り: 映っているのは、江戸時代に描かれた和歌山城の絵図です。翌年には、家臣の桑山重晴が、城代として入りました。
      - 語り: 同じ年の6月、今度は四国の長宗我部元親を攻める戦いが始まります。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "楊洲周延《豊公四国征討之図》1883年（後世の想像図）"}
        card: {head: "1585年6月", body: 四国攻めが始まる}
      - 語り: 総大将は、兄の秀吉が務めるはずでした。ところが兄は、病と北陸の越中の情勢のために、出陣を取りやめます。
      - 聞き: 天下人が来られないって、一大事じゃん。代わりは誰がやるの？
        tone: 疑問
      - 語り: 四国攻めの総大将に立ったのは、弟の秀長でした。豊臣方の兵は、全体で10万を超えたと言われます。
        background: {image: paintings/hidenaga_hyogundan_49_hisanaga.jpg, credit: "一英斎芳艶《瓢軍談五十四場》四十九（1864年ごろ。秀長・秀次を名を変えて描いた絵）"}
        figure: {type: bars, title: 1585年 四国攻めの兵の数, bars: [[豊臣方の全体, 105000], [秀長が直接率いた兵, 30000], [長宗我部方, 40000]], labels: [10万5千〜, 3万, 2万〜4万], upto: 1}
        short: s3
      - 語り: そのうち、秀長が直接率いたのは3万。迎える長宗我部方は、2万から4万と、記録によって幅があります。
        figure: {type: bars, title: 1585年 四国攻めの兵の数, bars: [[豊臣方の全体, 105000], [秀長が直接率いた兵, 30000], [長宗我部方, 40000]], labels: [10万5千〜, 3万, 2万〜4万], upto: 3}
        mark: {type: circle, at: 1}
      - 聞き: 全体なら、ざっくり倍以上。これなら楽勝じゃない？
      - 語り: ところが、戦いは思ったより長引きます。心配した兄は、援軍を送ろうか、と申し出ました。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "楊洲周延《豊公四国征討之図》1883年（後世の想像図）"}
        figure: null
        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵）", age: false}
        short: s3
      - 語り: 秀長は、その申し出を断る書状を送りました。秀吉に仕えた大村由己が、秀吉の命で書いた四国攻めの記録に残る話です。
        portrait: {image: paintings/hidenaga_portrait_shungakuin.jpg, caption: "豊臣秀長（春岳院蔵とされる肖像、江戸時代）", age: false}
        card: {head: 1585年, body: 兄の援軍の申し出を断る}
        short: s3
      - 聞き: 断ったの！？ 兄ちゃんで、しかも天下人の申し出だよ。あーしなら、ありがたく受け取っちゃう。
        tone: 驚き
        short: s3
      - 語り: 7月25日付で、秀長は停戦の条件を示します。長宗我部元親はそれを受け入れ、降伏しました。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
        portrait: null
        short: s3
      - 語り: 兄が来ないまま、弟が四国の戦いを終わらせたことになります。
      - 聞き: 兄ちゃんの手を借りずに、四国をまとめちゃったんだ。それ、ただの補佐役の仕事じゃないよね。
        short: s3
      - 語り: このすぐあと、秀長は、ある国をまるごと任されます。
        hook: true

  # ---------------------------------------------------------------- 6 大和郡山
  - title: 1585年 大和郡山城と100万石
    background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
    year: 1585
    lines:
      - 語り: 1585年閏8月、秀長は大和の国を加えられ、大和郡山の郡山城に入ります。紀伊・和泉・大和で、100万石の大名になりました。
        card: {head: "1585年閏8月", body: 大和郡山城に入る}
        figure: {type: map, title: 秀長の100万石（紀伊・和泉・大和）, bounds: [134.6, 136.4, 33.4, 35.0],
                 places: [[郡山, 135.78, 34.65], [和泉, 135.48, 34.57], [紀伊, 135.17, 34.23]]}
        short: s4
      - 聞き: 100万石！ 但馬の10万石から、10倍じゃん。
        short: s4
      - 語り: 並べてみます。1580年に但馬で10万5千石。1585年の春に、紀伊と和泉で64万石。その秋に、100万石です。
        figure: {type: line, title: 秀長の石高, points: [[1580年, 10.5], [1585年春, 64], [1585年秋, 100]], unit: 万石}
        short: s4
      - 聞き: 城を預かる役から、8年で100万石。グラフが、ほぼ垂直なんだけど。
        tone: 驚き
        reaction: {number: 100万石, lead: 城代から8年で, say: ほぼ垂直！}
        short: s4
      - 語り: 100万石は、100万人を1年養える米です。1石を今の5万円ほどとすると、米の値打ちで、約500億円分になります。
        background: {image: paintings/hidenaga_six_provinces_map.jpg, credit: "『紀伊・大和・河内・伊賀・山城・伊勢 六ヶ国絵図』江戸時代（国立国会図書館蔵）"}
        figure: {type: money, title: 秀長の100万石, then: "100万石", yen: 50000000000, basis: "1石＝500文前後、日当100文を今の1万円とした目安（1石は約5万円）。米の値段は短い間に数倍動く"}
        short: s4
      - 語り: 日当100文を今の1万円として数えた、数え方で大きく変わる目安です。年貢として入るのは、そのうちの一部でした。
        short: s4
      - 語り: しかも100万石は、表向きの数字です。のちの検地の帳面では、実際は73万4千石という記録もあります。
        figure: null
      - 聞き: ちょっと盛ってた！ でも7割でも、とんでもない大きさなのは変わらないね。
      - 語り: 大和は、古いお寺や神社の多い国です。秀長は検地を行い、掟を定めて、寺社の力を抑えにかかりました。
        background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
      - 聞き: お寺の多い国で、お寺の力を抑えるの、すごく大変そう。
      - 語り: 郡山城も、秀長が一から建てた城ではありません。1580年に、前の大和の主、筒井順慶が築いた城を大きくして、ほぼ完成させました。
        portrait: {image: paintings/hidenaga_tsutsui_junkei.jpg, caption: "筒井順慶（江戸時代の肖像）", age: false}
      - 聞き: 人のお城を、増築して仕上げたんだ。大がかりなリフォームだね。
      - 語り: 筒井家とのつながりも、文書に残っています。これは1586年3月、秀長が寿福院に宛てて、順慶の廟所や山林、筒井城の跡などを与えた書状です。
        background: {image: paintings/hidenaga_letter_1586.jpg, credit: "豊臣秀長の書状（寿福院宛）1586年"}
        portrait: null
      - 聞き: 前の主のお墓のことまで、手紙で決めてるんだ。乗りこんできた側なのに、気を配ってる。
      - 語り: その一方で、城を広げるとき、秀長は、周りのお寺からも石を集めました。今も天守台の北の面に、逆さに積まれたお地蔵さまが見える、と大和郡山市は説明しています。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
        portrait: null
        card: {head: 郡山城の天守台, body: 石垣に「逆さ地蔵」}
      - 聞き: お地蔵さまを石垣に！？ 罰当たりって言われなかったのかな。
        tone: 驚き
      - 語り: 当時どう受け止められたのかは、記録がありません。
      - 語り: 城下では、1585年に洞泉寺というお寺を、今の場所へ移しています。お寺の場所まで、町づくりの中で決めていったわけです。
      - 聞き: お城だけじゃなくて、町の地図ごと描き直してるんだ。
      - 語り: 城下の町づくりでは、奈良での商売を制限して、郡山の城下の商人に、商売の独占を認めました。
        background: {image: paintings/hidenaga_koriyama_castle_map_ndl.jpg, credit: "『日本古城絵図』大和国郡山城図（江戸時代、国立国会図書館蔵）"}
      - 聞き: 奈良のお店からしたら、たまったもんじゃないね。お客さんを、まるごと郡山に持っていかれちゃう。
      - 語り: さらに、町に、土地の税を免じるなどの特権を与えます。1588年には、その十三の町がそろっていたことが、文書で確かめられます。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
        card: {head: 1588年, body: 十三の町に特権}
      - 語り: 町は1か月交代で当番をつとめ、治安や火の用心を受け持ったと言われます。
      - 聞き: 当番の町が回ってくるの、町内会の回覧板みたい。それで、何て呼ばれてたの？
      - 語り: 《箱本》です。特権を書いた文書を入れた御朱印箱を、当番の町が預かったからです。この仕組みは、町の数を増やしながら、明治維新まで続いたと言われます。
        card: {head: 箱本, body: 御朱印箱を預かる当番の町}
      - 聞き: 町が増えても、当番の仕組みは300年近く続いたんだ。回覧板の、すごい版だ。
      - 語り: 御朱印箱は、秀長の菩提寺の春岳院に伝わり、県の文化財になっています。
        background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
      - 語り: 郡山に移ったとき、秀長の家老、小堀正次の家には、数えで7歳の男の子がいました。のちに茶人として、庭づくりでも名を残す小堀遠州です。
        background: {image: paintings/hidenaga_koriyama_castle_map_ndl.jpg, credit: "『日本古城絵図』大和国郡山城図（江戸時代、国立国会図書館蔵）"}
      - 聞き: 7歳！？ 未来の名人が、子どものころ秀長のところにいたんだ。
      - 語り: 遠州は小姓として、秀吉の給仕をつとめ、千利休や、黒田孝高の親子とも出会った、と伝わります。
      - 聞き: 子どもで、天下人のお世話係！ あーしなら、緊張で手がふるえちゃう。
      - 語り: そして翌年の春、九州から一人の大名が、大坂城へ助けを求めてやって来ます。
        background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
        hook: true

  # ---------------------------------------------------------------- 7 宰相・大納言
  - title: 1586〜87年 大友宗麟と徳川家康、そして大和大納言
    background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
    year: 1585
    lines:
      - 語り: 1585年10月、秀長は《参議》になります。参議の、中国風の呼び名が、宰相。ここで、冒頭の言葉に戻ります。
        card: {head: "1585年10月", body: 参議＝宰相に}
      - 語り: その大名、大友宗麟が大坂城に来たのは、1586年4月。島津に押されてのことでした。
        card: {head: "1586年4月", body: 大友宗麟が大坂城へ}
        year: 1586
      - 聞き: そこで出たのが、内々の儀は宗易、ってやつね。
      - 語り: はい。宗麟が国元に送った手紙は、大坂城のようすや、もてなしを細かく書いたものとして知られています。
        icon: envelope-simple
      - 聞き: 出張先で聞いたことを、全部会社に報告してる感じ。宗麟さん、まめだね。あーしの出張報告より、ずっと細かそう。
      - 語り: 手紙では、秀長の言葉に、「いよいよ申し談ずべし」と続きます。これから、いっそう相談していこう、という意味です。
        background: {image: paintings/hidenaga_rikyu_tohaku.jpg, credit: "長谷川等伯《千利休像》（春屋宗園賛、1595年）"}
      - 語り: 秀長と利休が、豊臣の政権の、表と内の二本柱だった、と読まれる言葉です。ただ、二人がいつ初めて会ったのかは、分かっていません。
      - 聞き: 表の窓口が弟で、内々の相談役が茶人。会社でいうと、役員と、社長のいちばんの相談相手って感じ？
      - 語り: 同じ1586年の10月、今度は徳川家康が、大坂へやって来ます。家康が泊まったのは、大坂の秀長の屋敷でした。
        background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
        portrait: {image: paintings/nene_ieyasu_portrait.jpg, caption: "徳川家康（狩野探幽画、17世紀）", age: false}
        card: {head: "1586年10月26日", body: 家康が秀長の屋敷に泊まる}
      - 語り: 家康は、2年前に小牧・長久手で兄と戦った相手です。
      - 語り: その夜、秀吉自らが家康を訪ねて、自分に従うよう求めた、と徳川家の側の記録に伝わります。
      - 聞き: 家康を自分ちに泊めて、そこに兄ちゃんが来る。弟の家が、天下の大事な話し合いの場所なんだ。
      - 語り: 研究者は、秀長が多くの大名の《指南》、つまり政治の後見役を受け持ったと見ています。家康や、毛利輝元も、その一人でした。
        background: {image: paintings/hidenaga_mori_terumoto.jpg, credit: "《毛利輝元像》江戸時代初め"}
        portrait: null
      - 聞き: 大名の相談窓口ってことね。兄ちゃんに直接言いにくいことは、まず弟に、みたいな。
      - 語り: 1587年の九州攻めは、豊臣方の全体で約20万。秀長は、日向の方面の総大将をつとめます。
        background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城と城下）"}
        year: 1587
        figure: {type: map, title: 1587年 九州攻め, bounds: [129.4, 136.4, 30.8, 35.4], places: [[大坂, 135.50, 34.69], [根白坂, 131.47, 32.16]], note: 根白坂は日向の国}
      - 聞き: 全体で20万って、ひとつの大きな町が、まるごと動いてるみたいな数。
        figure: {type: stats, title: 1587年 九州攻め, items: [[豊臣方の全体, 約20万], [根白坂の砦の守り, 約1万, 宮部継潤ら], [島津義久の降伏, 5月8日]]}
      - 語り: 4月の根白坂の戦いでは、砦が島津方の夜襲を防ぎ、そこへ藤堂高虎らが駆けつけて、島津方は大きな損害を出しました。
      - 語り: 5月8日、島津義久が降伏します。
      - 聞き: 和歌山城の高虎が、ここでも！ 秀長の家来、働きすぎじゃない？
        figure: null
        background: {image: paintings/hidenaga_todo_takatora.jpg, credit: "《藤堂高虎像》1907年の模写"}
      - 語り: 城をつくり、戦場にも駆けつける。秀長の右腕と呼ばれるのは、こういう働きからです。
      - 語り: そしてこの年の8月、秀長は権大納言になり、「大和大納言」と呼ばれるようになります。
        background: {image: paintings/hidenaga_jurakudai_mitsui.jpg, credit: "《聚楽第図屏風》（部分）17世紀中ごろ"}
        card: {head: "1587年8月", body: 権大納言＝大和大納言に}
      - 聞き: 宰相から大納言。肩書きが、どんどん豪華になってく。もう兄ちゃんの次に偉いんじゃない？
      - 語り: 羽柴の一門の筆頭、と見る研究者もいます。ところがその翌年、秀長の家臣が、大きな事件を起こします。
        hook: true

  # ---------------------------------------------------------------- 8 最期
  - title: 1588〜91年 郡山城での最期と、そのあと
    background: {image: paintings/hidenaga_hidetsugu.jpg, credit: "《豊臣秀次像》17世紀前半（秀保の兄）"}
    year: 1588
    lines:
      - 語り: 1588年1月、秀長は、姉の日秀の三男で10歳の秀保を、養子に迎えることを決めます。秀次の弟です。
        card: {head: "1588年1月", body: 甥の秀保を養子に}
      - 聞き: 与一郎を亡くしてたから、甥っ子を跡取りに、ってことだよね。
      - 語り: そう考えられます。この年には、娘のおきくも生まれました。ただ、秀長の妻や子どもの姿は、ここ数年の研究で、ようやく分かってきたところです。
      - 聞き: 400年以上たって、やっと家族のことが見えてきたんだ。歴史の研究って、今も動いてるんだね。
        tone: しみじみ
      - 語り: 1588年9月、秀長は郡山城に毛利輝元を招き、茶の湯でもてなして、東大寺へのお参りにも付き添いました。
        background: {image: paintings/hidenaga_mori_terumoto.jpg, credit: "《毛利輝元像》江戸時代初め"}
        card: {head: "1588年9月", body: 郡山城で毛利輝元をもてなす}
        icon: bowl-steam
      - 聞き: 指南役のお仕事だね。お茶でもてなして、お寺まで案内。気配りの外交って感じ。
      - 語り: その3か月後の12月。秀長の材木の奉行、吉川平介が、熊野の材木2万本あまりを大坂で売るときに、不正をしていたことが分かります。
        background: {image: paintings/hidenaga_six_provinces_map.jpg, credit: "『紀伊・大和・河内・伊賀・山城・伊勢 六ヶ国絵図』江戸時代（国立国会図書館蔵）"}
        card: {head: "1588年12月", body: 吉川平介の事件}
      - 聞き: 2万本！ 横流しの規模が、大きすぎる。
        tone: 驚き
      - 語り: 秀吉は、平介に死罪を言い渡しました。秀長自身は罪に問われませんでしたが、面目を失います。
      - 語り: 翌年の正月、秀長は兄に、年始の挨拶を断られた。奈良の興福寺の僧が書いた『多聞院日記』に、そう書かれています。
        background: {image: paintings/hidenaga_hideyoshi_portrait_1600.jpg, credit: "《豊臣秀吉像》1600年ごろ"}
        card: {head: "1589年1月", body: 兄に年始の挨拶を断られる}
        year: 1589
      - 聞き: 兄弟げんかっていうより、兄ちゃんが本気で怒ってるやつだ。
      - 語り: 同じ日記は、秀長の別の顔も書いています。奈良の町に、強引にお金を貸し付けて利息を取る、「ならかし」です。
        background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
        icon: hand-coins
      - 聞き: 優しい弟のイメージと、ちょっと違う。お金にきびしい人だったの？
        tone: 疑問
      - 語り: 蓄えを重んじた人、とは言えそうです。ただ、この日記は奈良のお寺の側から書かれたもの、という点も覚えておいてください。
      - 聞き: 書いた側の目線も考えないと、ってことね。お寺からしたら、お金を取られる側だもん。
      - 語り: このころの秀長は体を壊しがちで、たびたび有馬の温泉で湯治をしています。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
      - 聞き: 有馬温泉って、今もある温泉だよね。そこで体を休めてたんだ。
      - 語り: 1590年の正月、豊臣秀長は年頭の挨拶に出られず、奈良の興福寺で、回復を願う祈りが行われました。
        card: {head: "1590年1月", body: 興福寺で回復の祈り}
        year: 1590
        short: s5
      - 語り: 3月、兄は小田原へ出陣する前に、弟を見舞います。9月には、母の大政所が屋敷を訪ねました。
        portrait: {image: paintings/hidenaga_omandokoro.jpg, caption: "大政所（秀吉・秀長の母、江戸時代の肖像）", age: false}
        short: s5
      - 聞き: 母ちゃんが会いに来るの、つらいね。あーし、そういうの弱い。
        tone: しみじみ
        short: s5
      - 語り: 1591年1月22日、秀長は郡山城で亡くなりました。数えで52歳でした。
        portrait: null
        card: {head: "1591年1月22日", body: 郡山城で亡くなる}
        year: 1591
        tone: 重い
        short: s5
      - 語り: 1月29日の葬儀には、諸大名や、大和の寺々の僧、領民が集まりました。ただ、兄の秀吉も、甥の秀次も、家康も、参列していません。
        background: {image: paintings/hidenaga_koriyama_castle_map_ndl.jpg, credit: "『日本古城絵図』大和国郡山城図（江戸時代、国立国会図書館蔵）"}
      - 聞き: 兄ちゃんも来なかったの？ あんなに頼りにしてたのに。
      - 語り: その理由は、記録からは分かりません。そして『多聞院日記』によると、残された郡山城には、数え切れないほどの金銀がありました。
      - 語り: 銀は、およそ3.6メートル四方の部屋が、いっぱいになるほど。銭は、何万貫あるか数え切れない、と書かれています。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
      - 聞き: 部屋いっぱいの銀！？ 銭のほうは、今のお金にするといくら？
        tone: 驚き
      - 語り: 日当100文を今の1万円とする目安では、1貫がざっくり10万円。1万貫で、約10億円です。それが何万貫。
        figure: {type: calc, title: 郡山城の銭（目安）, terms: [[1万貫], [約10万円, 1貫あたり], [約10億円]], ops: [×, ＝]}
      - 語り: ただ、書いたのは奈良の僧で、聞いた話です。量そのものは確かめられません。
      - 語り: 秀長が亡くなって1か月あまりの2月28日、千利休は、秀吉の命で、自ら命を絶つことになります。
        background: {image: paintings/hidenaga_rikyu_death_poem_met.jpg, credit: "《千利休像》辞世の偈入り、17世紀前半（メトロポリタン美術館）"}
        figure: null
        card: {head: "1591年2月28日", body: 千利休が亡くなる}
      - 聞き: 内々は宗易、公儀は宰相の二本柱が、ひと月で、両方いなくなったんだ。
        tone: 重い
      - 語り: 8月には、秀吉の幼い子、鶴松が3歳で亡くなります。
        background: {image: paintings/hidenaga_hideyoshi_portrait_1600.jpg, credit: "《豊臣秀吉像》1600年ごろ"}
      - 聞き: 秀長がいなくなった年に、豊臣家の大事な人が、次々といなくなったんだ。
        tone: しみじみ
      - 語り: 跡を継いだ秀保は、秀長が亡くなる直前のこの1月に、秀長の娘と祝言をあげていました。おきくとは別の、上の娘です。秀保は13歳、娘はまだ4つか5つです。
        background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
      - 語り: その秀保も、1595年、十津川の温泉で病に倒れ、17歳で亡くなりました。子がなく、大和の豊臣家は、2代で途絶えます。
        card: {head: 1595年, body: 大和の豊臣家が途絶える}
        year: 1595
      - 聞き: 秀長がいなくなってから、悪い知らせばっかりじゃん。
        tone: 重い
      - 語り: 実は、「秀長が生きていれば」という見方は、もう80年以上前の本に書かれています。
        hook: true

  # ---------------------------------------------------------------- 9 見立て
  - title: 見立て：秀長の4つの通説は、どこから語られたか
    background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
    lines:
      - 語り: 1つ目、異父弟。第2節で見たとおり、出どころは江戸時代の本でした。
        card: {head: 地表1, body: 異父弟 → 江戸時代の本から}
      - 聞き: 江戸時代の本の話が、そのままずっと信じられてきたんだ。
      - 語り: 秀長は、30代の半ばまで記録がほとんどありません。空白が大きいぶん、物語が入りこむすき間も大きかったのかもしれません。
      - 語り: 2つ目、控えめな名補佐役。この姿を広めたと言われるのが、1985年の、堺屋太一の小説『豊臣秀長 ある補佐役の生涯』です。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        card: {head: 1985年, body: 堺屋太一の小説が広める}
        year: 1985
      - 語り: その前にも、司馬遼太郎が、1960年代の短い小説「大和大納言」で、豊臣家の防波堤のような弟を描いていました。
      - 聞き: 小説がもとだったんだ。でも、ドラマの主人公になるくらいだから、物語にしやすい人なんだろうね。
      - 語り: 記録の秀長は、四国攻めの総大将で、100万石の大名で、大名たちの後見役。そして「公儀の事は宰相」と言い切った人です。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "楊洲周延《豊公四国征討之図》1883年（後世の想像図）"}
      - 聞き: 控えめっていうより、表に立つ仕事をきっちりやる人。補佐役は補佐役でも、政権の実務の真ん中にいた人、って感じ？
      - 語り: そう思います。補佐役だったのは記録どおり。控えめ、のほうが物語です。
      - 語り: 3つ目、生きていれば豊臣は滅びなかった。これは、1939年に出た渡辺世祐の本に、もう見える評価です。
        background: {image: paintings/nene_daigo_hanami.jpg, credit: "《醍醐花見図》1598年ごろ（秀長の死後の秀吉）"}
        card: {head: 1939年, body: 渡辺世祐の本の評価}
        year: 1939
      - 語り: その本には、秀長の命がもっと長ければ、豊臣の天下を長く続けられたかもしれない、という評価が書かれています。
      - 聞き: 80年以上前から、みんな同じ「もしも」を考えてたんだ。
      - 語り: 今の研究者も、秀長は兄と若い奉行たちの間をつなぎ、言葉の行き違いを防ぐ役だった、と見ています。
      - 語り: 跡を継ぐはずの秀次には、経験と世代の重みが足りず、兄は家康ら年上の大名を頼るようになった、とも言われます。
        background: {image: paintings/hidenaga_hidetsugu.jpg, credit: "《豊臣秀次像》17世紀前半"}
      - 聞き: 秀長が元気なら、秀次の後ろ盾になれたかも、ってことか。
      - 語り: ただ、それは確かめようのない「もしも」です。確かなのは、秀長がいなくなった年から、豊臣家に悪い知らせが続いたことです。
      - 聞き: もしもは、もしものまま。でも、あの一年の流れを見ると、言いたくなる気持ちは分かるな。
        tone: しみじみ
      - 語り: 4つ目、暗殺説。検索すると、この言葉も出てきます。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
        card: {head: 地表4, body: 暗殺説}
      - 語り: 当時の記録に残っているのは、何年も続いた病と、祈りと、兄や母の見舞いです。毒を盛られたという記録は、見つかっていません。
        short: s5
      - 聞き: 何年も病気だった記録があるなら、急に誰かに、って話じゃないよね。
        short: s5
      - 語り: 病の名前も、分かっていません。分からないことは、分からないままにしておきます。
      - 語り: こうして並べると、4つとも、秀長が亡くなったずっと後に語られた話でした。
        background: {image: paintings/hidenaga_hideyoshi_yoshitoshi_kokoku24.jpg, credit: "月岡芳年《皇国二十四功 羽柴筑前守秀吉》1887年"}
      - 語り: 1つ目と4つ目は、記録に支えがありません。2つ目と3つ目は、半分は記録に根があります。
      - 聞き: 記録の秀長と、物語の秀長。今日、やっと見分けがついてきた。
      - 語り: 最後に、もう一つだけ。郡山の秀長の墓のそばには、兄の秀吉が建てた菩提寺、大光院がありました。
        background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
      - 語り: ところが豊臣家が滅んだあと、大光院は京都へ移されます。位牌は春岳院に託され、墓の大納言塚は荒れてしまいました。
      - 聞き: 兄ちゃんが建てたお寺まで、いなくなっちゃったんだ。
        tone: しみじみ
      - 語り: 1777年、春岳院のお坊さんたちと、郡山の町の人たちが力を合わせて、高さ2メートルの五輪塔を建てました。
        year: 1777
        card: {head: 1777年, body: 町の人と僧が五輪塔を建てる}
      - 聞き: 町の人が、お墓を建て直したんだ。箱本の町の人たちかな。
      - 語り: そこまでは、記録からは言えません。ただ、秀長が整えた城下の町の人たちが、200年近くたって、墓を守ったことは確かです。
        background: {image: paintings/hidenaga_koriyama_castle_map_ndl.jpg, credit: "『日本古城絵図』大和国郡山城図（江戸時代、国立国会図書館蔵）"}
      - 語り: 今も毎年4月には、秀長をしのぶお祭りが開かれています。
      - 聞き: あーしの秀長のイメージ、変わった。控えめな弟じゃなくて、表の仕事を引き受けて、町にずっと覚えてもらってた人。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
        background: {image: paintings/hidenaga_koriyama_castle_map3.jpg, credit: "《郡山城絵図》江戸時代"}
        portrait: {image: paintings/hidenaga_portrait_shungakuin.jpg, caption: "豊臣秀長（春岳院蔵とされる肖像、江戸時代）", age: false}
      - 聞き: 次回は、お市の方。戦国一の美女って言われてるけど……その顔を書いた記録って、あるの？
        tone: 疑問
      - 語り: ドラマで秀長を知った方も、そうでない方も、知っている秀長の話があれば、コメントで教えてください。
