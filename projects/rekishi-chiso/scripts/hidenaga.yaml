# ============================================================================
# 事実の控え（2026-10-09。詳細は dev/output/rekishi-chiso/research/hidenaga_facts.md）
# - 「内々の儀は宗易、公儀の事は宰相存じ候」：天正14年（1586）4月、大坂城で秀長が大友宗麟に。宗麟の国元への書状（『大友家文書録』）。宰相＝参議＝秀長（1585-10-04 参議）
# - 生年 1540（都状「五十一」）／1541説（世界大百科・ブリタニカ）。3月2日は『系図纂要』のみ。尾張国愛知郡中村郷中中村、母なか
# - 異父弟は『太閤素生記』など江戸時代の書物。近年は同父（弥右衛門）とみる研究者が多い（黒田基樹・渡邊大門）。竹阿弥＝弥右衛門の同一人物説。小竹は当時の文書なし（あだ名説）
# - 史料の初出：天正2年（1574）7月 長島、『信長公記』「木下小一郎」（数え35）。天正3年11月「羽柴小一郎長秀」署名。墨俣一夜城は同時代の記録で確かめられない
# - 秀吉→黒田孝高「其方の儀は、我ら弟の小一郎め同然に心安く存じ候」（『黒田侯爵家文書』。日付は未確認なので言わない）
# - 1577-11 竹田城（城代）、生野銀山と播磨を結ぶ街道の宿場の人夫役免除。1580-05-16 出石城、但馬7郡10万5千余石（実際は4郡とも）。1581 鳥取城の陣の一つ
# - 1582-06-13 山崎、黒田孝高らと天王山。1583-04 賤ヶ岳、田上山、木之本の本陣。戦後 但馬・播磨、姫路城。1584 小牧・長久手、松ヶ島城、信雄との講和で名代。6〜9月に長秀→秀長
# - 1585-03 紀州攻め（秀次と副将、太田城を水で囲む）→紀伊・和泉 約64万石。6〜8月 四国攻め総大将（兄は病と越中で中止）、総勢約10万5千〜12万3千、秀長直率3万、長宗我部方2万〜4万。援軍を断る書状（大村由己『四国御発向并北国御動座記』＝秀吉の命で書いた秀吉側の記録。文言は未確認なので言わない）。7-25 停戦条件→降伏
# - 1585 閏8月 大和、郡山城。100万石（名目）、実高73万4千石（『文禄検地帳』）。郡山城は1580 筒井順慶築城、秀長の代にほぼ完成。逆さ地蔵（市の説明）。奈良での商売制限・郡山の独占。箱本十三町（1588年に整っていたことが春岳院文書で確認される。江戸時代に27町へ広がり、明治維新まで続いたとされる）。御朱印箱は春岳院（県指定）
# - 1586-10-26 家康が大坂の秀長邸に宿泊、翌27日大坂城で秀吉に会う。その夜の秀吉の訪問は主に『徳川実紀』など徳川側の伝え。指南（柴裕之）：信雄・家康・輝元
# - 1587 九州攻め 日向方面の総大将。総勢約20万、根白坂の砦は宮部継潤ら約1万、藤堂高虎ら来援。5-08 義久降伏。8-08 権大納言＝大和大納言。藤堂高虎は1576から仕える、和歌山城の普請奉行
# - 1588-09 毛利輝元を郡山城の茶の湯・東大寺参拝。1588-12 吉川平介（熊野の材木2万本余り）、秀吉が死罪。1589-01 年始の挨拶を断られる（『多聞院日記』1月5日条）。ならかし（多聞院日記）
# - 1590-01 年頭に出られず興福寺で祈祷、03 兄の見舞い（小田原出陣前）、09-15 大政所、10 都状。有馬で湯治（年は要確認なので言わない）。1591-01-22 郡山城で病死（数え52）。01-29 葬儀、秀吉・秀次・家康は参列せず
# - 郡山城の金銀（『多聞院日記』）：金子56,000余枚（円に直さない）、銀は2間四方の部屋いっぱい、銭は何万貫か数え切れない。1貫≒10万円の目安で1万貫≒10億円
# - 1591-02-28 利休切腹（後ろ盾を失ったという説は言わない）。1591-08 鶴松（3歳）。秀保（1579生、1588-01養子）1595-04-16 17歳で死去、大和豊臣家断絶
# - 渡辺世祐『豊太閤の私的生活』1939。司馬遼太郎「大和大納言」（『豊臣家の人々』1960年代）。堺屋太一『豊臣秀長 ある補佐役の生涯』1985。黒田・柴：秀吉と若い奉行の間をつなぐ役
# - 暗殺説：同時代の記録になし。病名は不明。大納言塚：1777 春岳院の僧と郡山の町の人々が土塀と高さ2mの五輪塔。毎年4月に大納言祭
# - お金：日当100文＝1万円、1石≒5万円（1石＝500文前後）→ 100万石≒500億円（米の値打ち。年貢はその一部）
# - 小堀遠州（政一）：1579生。父・小堀正次は秀長の家臣、1585年の郡山移封で家老。政一は小姓として秀吉の給仕、利休・黒田如水父子と出会う。古田織部に茶を学ぶ。1595年秀吉直参（ja.wikipedia 小堀政一）
# - 和歌山城：1585年、秀吉が吹上の峰を選び縄張り、普請奉行 藤堂高虎（補佐 羽田正親・横浜良慶）、1年で完成。築城の際に「若山」→「和歌山」（ja.wikipedia 和歌山城。耳で区別できないので台本では言わない）
# - 寿福院宛の書状（1586）：筒井順慶の廟所・山林・筒井城跡などを与える（hidenaga_assets.md）。「いよいよ申し談ずべし」（ja.wikipedia 豊臣秀長）
# - 葬儀に秀吉・秀次・家康は参列せず（黒田基樹 2025、ja.wikipedia 注）。大光院は豊臣家滅亡後に京都へ、位牌は東光寺（のちの春岳院）へ（奈良県の資料）
# - 秀保は1591年1月、13歳で秀長の4、5歳の娘と祝言（ja.wikipedia 豊臣秀保）。渡邊大門「史料が少なく、実像を描くのは困難」（PRESIDENT Online）
