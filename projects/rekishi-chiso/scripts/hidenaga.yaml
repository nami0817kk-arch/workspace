terms:
  宰相: 参議という朝廷の役職の、中国風の呼び名
  城代: 城主に代わって城を預かる役
  名代: 本人の代わりをつとめる人
  指南: 大名の相談に乗り、取り次ぐ後見役
  箱本: 郡山の十三の町が、1か月交代で町の世話をした仕組み
  多聞院日記: 奈良の興福寺の多聞院の僧が書きついだ日記
  権大納言: 朝廷の役職。大臣の次の位。秀長は「大和大納言」と呼ばれた

shorts:
  s1:
    title: "秀長が大友宗麟に／言った一言"
    yt_title: "豊臣秀長「内々の儀は宗易、公儀の事は宰相」｜大友宗麟の手紙に残る言葉"
    lead: "1586年、大坂城。九州の大友宗麟に、秀長は「内々のことは利休に、表向きのことは私に」と言いました。宗麟が国元への手紙に書き留めた言葉です。"
    tags: [豊臣秀長, 大友宗麟, 千利休, 内々の儀は宗易]
    hook: "秀吉の弟・秀長って／本当に控えめな人？"
    tease: "じゃあ、／『控えめな補佐役』の姿は／誰が広めた？"
  s2:
    title: "秀吉と秀長／兄弟の父をめぐる説"
    yt_title: "秀吉と秀長は異父兄弟だったのか｜父・弥右衛門と竹阿弥"
    lead: "異父兄弟という話の出どころは、江戸時代の『太閤素生記』などの本。近年は、同じ父の兄弟とみる研究者が多くなっています。"
    tags: [豊臣秀長, 豊臣秀吉, 異父弟, 竹阿弥, 弥右衛門]
    hook: "秀吉と秀長は／父親がちがう兄弟？"
    tease: "では、秀長が記録に／初めて出てくるのは／何歳のとき？"
  s3:
    title: "1585年 四国攻め／兄の申し出と弟の返事"
    yt_title: "四国攻めの総大将は豊臣秀長だった｜病の兄に代わった弟"
    lead: "1585年の四国攻め。病の兄に代わって総大将に立った秀長は、援軍の申し出を断る書状を送り、長宗我部元親を降伏させました。秀吉側の記録に残る話です。"
    tags: [豊臣秀長, 四国攻め, 長宗我部元親, 大村由己]
    hook: "四国攻めで秀長は／兄の援軍をどうした？"
    tease: "このあと秀長が／任された国は／どこ？"
  s4:
    title: "豊臣秀長の／石高の移り変わり"
    yt_title: "豊臣秀長の石高をたどる｜但馬の竹田城から大和郡山へ"
    lead: "1580年に但馬で10万5千石。1585年の春に紀伊・和泉で64万石、秋に大和を加えて100万石。100万人を1年養える米の量で、日当100文を今の1万円とする目安では約500億円分です。"
    tags: [豊臣秀長, 石高, 100万石, 大和郡山, 戦国時代 お金]
    hook: "秀長の領地は／8年でどこまで増えた？"
    tease: "その秀長が亡くなったあと／郡山城に残っていたものは？"
  s5:
    title: "豊臣秀長の最期を／記録で見る"
    yt_title: "豊臣秀長は暗殺されたのか｜記録に残る長い病と、兄と母の見舞い"
    lead: "当時の記録に残るのは、何年も続いた病と祈り、兄や母の見舞い。毒を盛られたという記録は見つかっていません。病の名前も分かっていません。"
    tags: [豊臣秀長, 秀長 死因, 暗殺説, 大政所, 多聞院日記]
    hook: "豊臣秀長は／暗殺されたって本当？"
    tease: "秀長の死から1か月後／千利休に何が起きた？"

