en:
  title: "Toyotomi Hidenaga: Was Hideyoshi's Brother Really Just a Modest Aide? | \"Public Affairs Are for Me\""
  description: |-
    "Private matters go to Sōeki (Sen no Rikyū); public affairs, I, the Saishō, will handle." Hidenaga said this to Ōtomo Sōrin at Osaka Castle in 1586, and Sōrin wrote it down in a letter home.
    Toyotomi Hidenaga, younger brother of Toyotomi Hideyoshi, is remembered as a gentle, modest aide. In the records he first appears at about 35, captures Takeda Castle in Tajima, leads more than 100,000 troops as commander-in-chief of the 1585 Shikoku campaign, and becomes a lord of "one million koku" at Kōriyama Castle in Yamato.
    We follow his 52 years and trace where four popular claims came from: that he was a half-brother, that he was a modest aide, that the Toyotomi would have survived if he had lived, and that he was assassinated.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "The Surface: 1586, \"Public Affairs Are for Me\""
    - "1540-1574: From Nakamura in Owari to Nagashima"
    - "1577, Takeda Castle in Tajima and 105,000 Koku"
    - "1582-84: Tennōzan, Shizugatake, and a New Name"
    - "1585: Commander-in-Chief of the Shikoku Campaign"
    - "1585: Kōriyama Castle and One Million Koku"
    - "1586-87: Sōrin, Ieyasu, and the Yamato Dainagon"
    - "1588-91: The Last Years at Kōriyama Castle"
    - "Verdict: Where Did the Four Claims Come From?"

texture: true
recap: true

