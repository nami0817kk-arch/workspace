# 豊臣秀長（10/12 19時公開）。型：通説型（地表→生涯→見立て：4つの通説はどこから語られたか）
# 事実の出どころは dev/output/rekishi-chiso/research/hidenaga_facts.md と、末尾の「事実の控え」。
# 年齢は数え（1540年生まれで数える。1541年説もある）。肖像の「この時○歳」は出さない（生年に説があり、満と数えが混ざるため）。
# お金は「日当100文を今の1万円」（1貫≒10万円、1石≒5万円）。数え方で大きく変わる目安と断る。郡山城の金子56,000枚は円に直さない。
# 大河ドラマ『豊臣兄弟！』は「主人公になった」と事実として触れるだけ。番組・俳優の画像は使わない。ドラマの筋は評価しない。
# 翌日の秀吉の回と重ねない：中国大返しの道のり・刀狩・秀吉の出世は扱わない。父の諸説・大和郡山・四国攻めはこちら。
# 広告の点：長島・鳥取・太田城・根白坂・吉川平介・利休・秀保は下調べ9章の言い換えで、事実だけを短く。
title: 豊臣秀長｜「公儀の事は宰相」と言い切った弟は、本当に控えめな補佐役だったのか
