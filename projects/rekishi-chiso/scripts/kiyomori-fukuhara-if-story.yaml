# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1180年6月、天皇は京都を出て、今の神戸にあたる福原へ移りました。世の人は、これを遷都と呼びます。そして171日後、天皇は京都へ戻ります。
  公家の九条兼実は、出発の2日前に日取りを知り、日記に「乱世に生まれて、こんな事を見るのは、悲しむべき宿業だ」と書きました。
  もしも清盛の福原遷都が成功していたら、日本の都は、海辺の福原に置かれ続けたのでしょうか。
  この動画でわかること
  ・福原に都を置く計画の場所が、6月15日から17日のあいだに揺れ動いた記録（玉葉）
  ・天皇の出発の夜の宿が、玉葉と百錬抄で違って書かれていること
  ・大嘗会が延期された5日後に、頼朝が兵を挙げたこと
  ・延暦寺の奏状と、還都の出発が3日、入京が6日早まった記録
  ・2025年と2026年の発掘で見つかった、福原京の跡
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（九条兼実の日記『玉葉』、『百錬抄』、『吾妻鏡』、『平家物語』、鴨長明『方丈記』、神戸市・京都市・兵庫県の公開資料、高橋昌明・島崎晋・山内晋次の文章、辞典項目など）を語りで示してから、今の言葉にして読んでいます。
  玉葉・百錬抄・吾妻鏡・平家物語の引用は、国立国会図書館の全文テキストで確かめたもので、原本の画像との照合は済んでいません。『山槐記』の原文は確かめられていません。山内晋次さんの説は、島崎晋さんの記事を通して知ったもので、原著は確かめていません。
  玉葉と百錬抄で、6月2日の夜の宿が違って書かれています。追討使が京へ戻った日も、記録によって違います。経が島の完成の年も、資料で分かれます。日数は、月の長さを数えて、自分で計算し直したものです。
  福原遷都が成功した場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、画像生成AIで作った想像上の風景です。サムネイルの風景と人物は、画像生成AIによる想像図です。

en:
  title: "What If Taira no Kiyomori's Move to Fukuhara Had Succeeded? Would Japan's Capital Be Kobe?"
  description: |-
    In June 1180, the emperor left Kyoto for Fukuhara, in present-day Kobe. People called it a transfer of the capital. 171 days later, he returned to Kyoto.
    The court noble Kujo Kanezane learned the date two days before the departure and wrote in his diary that it was a sad fate to be born in an age of chaos and see such a thing.
    If Kiyomori's move to Fukuhara had succeeded, would Japan's capital have stayed by the sea?
    In this video you will learn:
    - How the planned site wavered between Wada, Koyano and Inami between June 15 and 17 (Gyokuyo)
    - How two chronicles record the first night of the journey differently
    - Why Minamoto no Yoritomo raised his army five days after a major ceremony was postponed
    - The petition from the Enryakuji monks and how the return schedule was moved up
    - What the 2025 and 2026 excavations found of Fukuhara
    Japanese-language history video (Japanese audio). The parts that begin with "what if" are reasoning, not records.
  chapters:
    - "The 171-Day Capital"
    - "Fukuhara Was Not a Sudden Choice"
    - "From the Coup to the Departure"
    - "Turning Point 1: If the Land Had Been Enough"
    - "Turning Point 2: If the Nobles Had Accepted Fukuhara"
    - "Turning Point 3: If He Had Stayed in Fukuhara"
    - "Afterwards: After Fukuhara"
    - "Summary: If the Move to Fukuhara Had Succeeded"

