# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と yoshitsune-if-story.yaml の型）。もしも平清盛の福原遷都が成功していたら。2026-11-13 下書き。
# 公開の予定は 11/17 19:00。型は docs/story-main.md「00. 伸びる型」の もしも型（日本史・平安末）：
#   対象は「日本」（今の神戸にあたる福原に都が移っていたら）／一点だけ変える（福原遷都が成功）／史実の条件の範囲内／推論と明かす／想像の台詞なし。
#   「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない（各分岐の宣言から。「ここからは、もしもの話です」）。予想の席は研究者の評価・記録に置く。
#   冒頭（10秒以内）＝1180年6月、天皇は京都を出て福原へ移った。171日後に京都へ戻る。九条兼実は出発の2日前に日取りを知り「乱世に生まれてかくの如き事を見る」と日記に書いた。
#   序章 171日の都／第1章 福原は急に選ばれた土地ではない（1162〜1180・なぜ福原か・研究者の見方）／第2章 政変から出発まで（1179年11月〜1180年6月・宿の食い違い）／
#   第3章 分岐1 土地が足りていたら（条里・和田→小屋野→印南野・方丈記・2026年の発掘）／第4章 分岐2 公家が福原を都と認めていたら（離宮・大嘗会の延期・頼朝の挙兵）／
#   第5章 分岐3 還都せず福原にとどまっていたら（延暦寺・富士川・追討使の食い違い・還都の日程・兼実の総括）／第6章 その後 福原のあと（南都・清盛の死・方丈記・遺跡）／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 題材の扱い：南都の焼き討ちは一文だけ・絵なし。人柱の伝説（松王丸）は扱わない（後世の伝説）。実在の人物の顔は描かない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/平清盛福原遷都_facts_20261113.yaml、担当A=経緯・B=背景と評価を合わせたもの）にあるものだけ。行の上に `# fact: kiyomori-A12`。
#   玉葉・百錬抄・吾妻鏡・愚管抄・平家物語の引用は NDL 次世代デジタルライブラリーの全文OCRで読んだもの（画像未確認の箇所あり）。山槐記の原文は未確認（孫引きのみ）。
#   山内晋次・下向井龍彦の説は島崎晋の記事を通した引用（原著未確認）。台本では「島崎晋さんの記事によると」と言う。
# 記録の食い違い（3つ）：①6月2日の夜の宿（玉葉は大物、百錬抄は寺江）②経が島の完成（高橋昌明は1175年の築造終了、百科事典は清盛の死で中断し1196年に重源が完成）③追討使の帰京（玉葉は11月5日、百錬抄は11月3日）。
# 自分で計算した数（旧暦のまま。月の大小は6月小・7月大・8月小・9月大・10月小・11月大）：6月2日の出発→11月26日の入京＝171日（担当Aは6/2→11/23を169日としたが、数え直して168日）。
#   5月30日（知らせ）→6月2日（出発）＝2日（担当Aの「3日」は誤り）。5月23日（噂）→5月26日（宇治橋）＝3日。8月12日（大嘗会の延期）→8月17日（頼朝の挙兵）＝5日。
#   1180年3月19日→6月2日＝2か月あまり。1169→1180＝11年（福原に居を定めてから）。1180→1212（方丈記）＝32年。1180→1185（平氏の滅亡）＝5年。11月26日→12月28日＝32日。
#   11月26日（入京）→閏2月4日（清盛の死）＝約3か月あまり（12月・1月・2月を経る）。2月20日（官符）→2月21日（高倉天皇の譲位）＝1日。
# 確かめられなかったこと（台本では言わない）：決定の日（5月23日の噂・28日・30日が初出）、後白河法皇が反対した記録の言葉、清盛が福原を出て入京した日、実際の出発の日（山槐記は24日、予定は23日）、
#   延暦寺が福原へ使者を出した日、福原が「日本初の海に開いた都」という言い方、「福原幕府」、山内・下向井の原著、元木・五味・川合・山田の論文本文、方丈記の底本の確認。
# 絵：AI 絵（Gemini。一覧は scripts/story/kiyomori_fukuhara_main_look.yaml の頭）だけ。実在の人物の顔は描かない（後ろ姿・遠景）。字・旗・紋は入れない。
