sections:
  # ================================================================ 序章
  - title: 「171日の都」　1180年
    lines:
      # fact: kiyomori-A35, kiyomori-A09
      - 語り: 日本の都が神戸に移された、と言われる期間は、わずか171日です。1180年6月、天皇は京都を出て、今の神戸にあたる福原へ向かい、171日後に京都へ戻りました。
        tone: 重い
        card: {head: "171日", body: 6月2日の出発から11月26日の入京まで}
      # fact: kiyomori-A07
      - 語り: 公家の九条兼実は、出発の前の日、6月1日に、清盛へ使いを出しました。私も、福原に参るべきでしょうか。清盛の返事は、泊まる所がない、すぐには来るな、というものでした。
        card: {head: "1180年6月1日", body: 兼実が清盛へ使いを出す}
      # fact: kiyomori-A06
      - 語り: その前の日、5月30日に、兼実は、出発の日取りを知ります。日記の玉葉に、こう書きます。乱世に生まれて、こんな事を見るのは、悲しむべき宿業だ。
        card: {head: "1180年5月30日", body: 出発の2日前}
      # fact: kiyomori-A13, kiyomori-A14
      - 語り: 都を置く場所すら、決まっていません。6月15日から17日までの3日間に、候補地の話は、和田から小屋野、印南野へと、揺れ動きます。
        tone: 疑問
      - 語り: もしもこの福原遷都が、成功していたら。日本の都は、海辺の福原に、置かれ続けたのでしょうか。
        tone: 疑問
      - 語り: 兼実の玉葉と、公家の記録をまとめた百錬抄、鴨長明の随筆、方丈記、そして遺跡の発掘を手がかりに、3つの分かれ目で確かめます。
      - 語り: まず、福原は、この年に、急に選ばれた土地では、ありません。
        hook: true
      - 語り: 清盛は、10年以上前から、そこに通っていました。
        hook: true

  # ================================================================ 第1章 福原は急に選ばれた土地ではない
  - title: 「なぜ福原だったのか」　1162年から1180年
    year: 1162
    lines:
      - 語り: ここからの日付は、すべて当時の暦のままです。
      # fact: kiyomori-B02
      - 語り: 神戸市文書館の用語解説によると、福原は、1162年に、清盛が家来に八部郡一帯の土地の調査をさせて、平氏の支配下に入ったと見られる土地です。
        card: {head: "1162年", body: 清盛が八部郡一帯の土地を調べさせる}
      # fact: kiyomori-B01
      - 語り: 神戸大学の高橋昌明さんは、清盛が1168年2月に大病で出家し、翌年の初めから、福原に居を定めた、と書きます。京都の政治は、一門の子弟らに任せました。
      # fact: kiyomori-B03
      - 語り: 清盛自身も、1180年2月の太政官符の写しに引かれた訴えの中で、摂津の平野の景色のよい地を、世を逃れて老いを過ごす場所に選んだ、と述べています。日本歴史地名大系が引いています。
      # fact: kiyomori-B03
      - 語り: 1169年3月、後白河上皇は、福原の清盛の別荘に招かれ、千部の法華経を供養する法会に臨みました。天皇を退いた人を上皇、出家した上皇を法皇と呼びます。日本歴史地名大系が引く兵範記に、あります。
      # fact: kiyomori-B05
      - 語り: 1170年には、後白河法皇が福原で、宋の人と会いました。神戸市文書館は、清盛が会わせた、と書き、清盛は、ここを拠点に宋との貿易をしていたと考えられる、とします。
      # fact: kiyomori-B07
      - 語り: 海に築いた人工島、経が島の工事の始まりは、日本歴史地名大系が1173年とします。完成の年は、資料で分かれます。高橋さんは1175年に築造、百科事典は、清盛の死で中断し、1196年に重源が完成させた、とします。
        tone: 疑問
      # fact: kiyomori-B06
      - 語り: 1180年3月19日、高倉上皇は、厳島へ向かう途中、福原から差し向けられた宋の船に乗って、河尻の泊を遊覧しました。源通親の高倉院厳島御幸記にあります。遷都の2か月あまり前です。
      # fact: kiyomori-B10
      - 語り: では、清盛は、なぜ福原に、都を移そうとしたのか。高橋さんは、これまでは、後白河法皇の皇子、以仁王の背後にいた奈良の寺の勢力から逃れる、突然の決断、と言われてきた、と書きます。
      # fact: kiyomori-B10, kiyomori-B03
      - 語り: ところが近年は、桓武天皇のように、新しい王朝にふさわしい新都を造る、という見方もある、と高橋さんは2005年の解説で紹介し、その場合、清盛は、高倉天皇が退位する前日に、大輪田泊の国による改修を認めさせていて、海の都の準備を、先に進めていたことになります。
      # fact: kiyomori-B13
      - 語り: 一方、島崎晋さんの記事によると、神戸女子大学の山内晋次さんが疑うのは、大輪田泊が、宋の船の来る国際貿易港だった、という通説です。根拠の薄い思い込みの可能性が高い、と書きます。宋の船が来た例が、清盛の前にも後にも、確かめられないからです。
      # fact: kiyomori-B14
      - 語り: 島崎さんが引く下向井龍彦さんの説では、大輪田泊は、西国から京へ向かう船を管理する場所でした。貿易港か、物流の関所か。研究者の見方は、分かれています。
        tone: 疑問
      - 語り: どちらにしても、清盛が、福原を足場にしていたことは、記録が語ります。
        hook: true
      - 語り: その清盛が、1179年の冬、福原から、京へ向かいます。
        hook: true

  # ================================================================ 第2章 政変から出発まで
  - title: 「乱世に生まれて」　1179年から1180年6月2日
    year: 1179
    lines:
      # fact: kiyomori-A01
      - 語り: 1179年11月14日、清盛は、福原から数千騎を率いて京に上り、そのあと、後白河法皇を鳥羽殿に閉じこめ、関白の藤原基房らを、やめさせました。神戸市の解説です。
        card: {head: "1179年11月14日", body: 清盛、福原から上京}
      # fact: kiyomori-A02
      - 語り: 1180年2月21日、高倉天皇が譲位し、数えで3歳の言仁親王、のちの安徳天皇が、位に就きます。百錬抄によります。清盛は、天皇の母方の祖父になりました。
      - 語り: 位を譲った父の高倉上皇と、その父で、清盛に閉じこめられていた後白河法皇。この3人が、のちの福原行きに加わります。
      # fact: kiyomori-A03
      - 語り: 4月9日付で、後白河法皇の皇子、以仁王の令旨が出されます。平氏を討つ、という命令の文書です。吾妻鏡は、その文面を載せ、4月27日に、伊豆の頼朝に届いたと書きます。
        card: {head: "1180年4月9日", body: 以仁王の令旨}
      # fact: kiyomori-A04
      - 語り: 5月26日、以仁王を担いだ源頼政の一党が、宇治橋の戦いで討たれます。玉葉は、検非違使の報告として、以仁王の首は確かには見ていないが、討った、と書きます。
        tone: 重い
      # fact: kiyomori-A05
      - 語り: 福原行きの噂が、玉葉に初めて出るのは、その3日前の5月23日です。ある公家が来て、洛中の人々を福原へ行かせ、行幸も御幸も、1人も残さず従わせる、という話を、語りました。
      # fact: kiyomori-A05
      - 語り: そのころ、兼実は書きます。遷都の話がある。だとしても、急に行幸とは。事の様子は、物怪、つまり不吉なあやしい出来事、というべきだ。
      # fact: kiyomori-A06
      - 語り: 5月30日、清盛の側近の公卿、邦綱から、来月3日に福原へ行幸、という知らせが来ます。兼実は、仰天のほか無し、と書きました。夕方には、3日の行幸が、急に2日に縮められた、と伝わります。お供は、公卿が2、3人、殿上人が4、5人ほどだそうです。
        tone: 疑問
      # fact: kiyomori-A07
      - 語り: 6月1日の玉葉には、こうもあります。お供の者は、ひとえに清盛の意向で選ばれました、と。
      # fact: kiyomori-A08
      - 語り: 6月2日、卯の刻、朝6時ごろ、天皇と上皇と法皇が、福原へ向かいました。玉葉は、こう書きます。都の外の仮の宮は、昔にも例があるが、桓武天皇が平安京に移った延暦の時代以後、このような儀式は全くない。まことに、世にまれな大事というべきか。
        card: {head: "1180年6月2日", body: 天皇・上皇・法皇、福原へ}
      # fact: kiyomori-A09
      - 語り: ところが、この日の夜の宿は、記録で食い違います。大物と寺江は、どちらも京と福原を結ぶ道すじの地名です。玉葉は、その夜は大物に泊まり、翌朝、福原に御す、と書きます。百錬抄は、寺江の仮の宮に入り、翌日、船で福原に着いた、と書きます。福原に着いたのは、6月3日です。
        tone: 疑問
      # fact: kiyomori-A10, kiyomori-B33
      - 語り: 着いた福原で、天皇は、清盛の異母弟、頼盛の家に入りました。上皇は清盛の別荘、法皇は、もう1人の異母弟、教盛の家です。玉葉は、そのほかの参った者は、多くが宿所がなく、道路に立つが如し、と書きます。
      - 語り: 都には、まず、土地が要ります。
        hook: true
      - 語り: 6月9日、その土地を決める使者が、和田へ向かいました。
        hook: true

  # ================================================================ 第3章 分岐1 土地が足りていたら
  - title: 「分岐1 都の土地が足りていたら」　1180年6月
    year: 1180
    lines:
      # fact: kiyomori-A11
      - 語り: 6月9日、実定や通親ら貴族たちが遣わされ、和田で、都にする土地を見定めました。百錬抄は、左京は条里、つまり都の道を碁盤の目に割った区画が不足、右京はない、と書きます。
        card: {head: "1180年6月9日", body: 和田で都の土地を見定める}
      # fact: kiyomori-A11
      - 語り: 平家物語は、同じ日を新都の事始とします。和田の松原から西の野に、九条の地を割ったが、一条から五条までしか所がなく、それより下は無かった、と書きます。
      # fact: kiyomori-A12
      - 語り: 6月15日の玉葉に、頭の弁の経房が、高倉上皇のお尋ねとして、兼実に3つのことを聞いた、とあります。1つ目は、左京の区画が足りないこと。南は五条まで。兼実は、平安京より、ほとんど過半が減る、と答えました。
      # fact: kiyomori-A12
      - 語り: 2つ目は右京。宮城の西に小山があり、平地が、ほとんどありません。3つ目は大嘗会、つまり天皇が即位したあとに行う、最初の大きな祭りです。遷都と同時に行えば民の力が疲れるので、旧都に戻って済ませてから、遷都を決めるのがよい、と兼実は答えました。
      # fact: kiyomori-A13
      - 語り: 同じ日、清盛の義弟で、別当の時忠が、上皇の前で、こう仰せ下します。和田の都は、町の数が狭く、万事議しにくい。衆人は甘心せず、万民に苦しむ色がある。小屋野を、その地にせよ。
        card: {head: "1180年6月15日", body: 和田から小屋野へ}
      # fact: kiyomori-A13
      - 語り: 兼実は、こう書きます。愚かな心で考えると、遷都は、無いほうがよい。女房たちは、万人が嘆息し、涙を流す者もいる、と語ったそうです。上皇は、是非を仰せられませんでした。
        tone: 重い
      # fact: kiyomori-A14
      - 語り: 6月17日には、清盛と邦綱から返事が届き、話は、播磨の印南野を京とする、に変わっていました。邦綱は、厳島の内侍の娘が託宣して、小屋野に改めよ、と言う、と語ったそうです。
        card: {head: "1180年6月17日", body: 候補地の話が揺れる}
      # fact: kiyomori-B16
      - 語り: 高橋昌明さんは、最初の候補地は福原ではなく和田で、正確には、和田京遷都計画と呼ぶべきだ、と書きます。山と海にはさまれた地形では、左京は五条までしか取れず、計画は、紙の上のまま、早々に放棄された、と。
      # fact: kiyomori-B25
      - 語り: 鴨長明の方丈記も、福原の土地を、こう書きます。その地ほど狭くて、条里を割るにたらず。北は山にそいて高く、南は海に近くて下れり。波の音がいつもやかましく、潮風が、ことにはげしい、と。
      # fact: kiyomori-B24
      - 語り: 長明が方丈記を書いたのは、1212年。遷都の32年あとです。
      # fact: kiyomori-B23
      - 語り: ちなみに、平安京は、東西約4.5キロ、南北約5.2キロの範囲に、碁盤の目の区画が施されました。京都市の資料にあります。
      # fact: kiyomori-B22
      - 語り: 2026年11月、神戸市は、祇園遺跡で、福原京の造営のときに整備された、御所南大路の一部とみられる遺構が見つかった、と発表しました。報道によると、長さ約50メートル、幅約13メートルで、平安京の大路より、道幅は狭いそうです。
        card: {head: "2026年11月", body: 福原京の大路の跡が見つかる}
      - 語り: 1つ目の分かれ目です。もしも、福原や和田に、平安京と同じ規模の区画を割れるだけの土地が、あったら。まず、記録から言えることを見ます。
        tone: 疑問
      # fact: kiyomori-A11, kiyomori-A14
      - 語り: 記録から言えるのは、こうです。最初の案の和田では、左京は五条までしか取れず、右京は平地がなく、計画は、数日のうちに、小屋野や印南野へと動きました。高橋さんの言葉では、迷走です。
      # fact: kiyomori-B18
      - 語り: 一方、高橋さんは、福原の区画と、親平家派の貴族への宅地の給与は進んだ、と書きます。新しい内裏は、平安京の内裏を模した、少し小さめのものでした。
      # fact: kiyomori-B18
      - 語り: 中山忠親の邸は、京都で建物を造り、川を使って運び、現場で工事を始めると、2週間で完成した、といいます。
      - 語り: ここからは、もしもの話です。
        tone: 疑問
      - 語り: もしも土地が足りたなら、都づくりは、もっと早く進んだかもしれません。ただ、このあと見る反対には、土地の広さ以外のものも、ありました。
        tone: しみじみ
      - 語り: ここまでが、もしもの話です。ここからは、記録に戻ります。
        tone: しみじみ
      - 語り: では、貴族たちは、福原を、都と認めたのか。
        hook: true
      - 語り: 8月12日、その答えを分ける会議が、開かれます。
        hook: true

  # ================================================================ 第4章 分岐2 公家が福原を都と認めていたら
  - title: 「分岐2 公家が福原を都と認めていたら」　1180年7月から8月
    year: 1180
    lines:
      # fact: kiyomori-A15, kiyomori-B17
      - 語り: 7月16日、大外記の頼業から兼実に、福原を、しばらく皇居とする、道路を開き、宅地を人々に与える、ただし広さには及ばない、と伝えられます。高橋さんは、これは、反対論をなだめる妥協案だろう、と見ています。
        card: {head: "1180年7月16日", body: 福原は「しばらく皇居」}
      # fact: kiyomori-A16
      - 語り: 8月8日の玉葉は、8月1日に、時忠の奉行で、大嘗会は今年も行うべきだ、場所は福原で決まりだ、という仰せがあった、と伝えます。
      # fact: kiyomori-A16
      - 語り: 同じ日の玉葉に、噂があります。高倉上皇の夢に、亡き母の建春門院が現れ、遠く私を福原へ移したのは、本意ではない、と恨んだ、というのです。兼実は、これを、遷都不快のしるし、と書きました。
        tone: 疑問
      # fact: kiyomori-A17
      - 語り: 公家の隆季が、ひそかに、遷都はあるべきでない、と語ったのを、清盛が聞いて怒り、かえって励んだ、という伝聞も、同じ日の玉葉にあります。
      # fact: kiyomori-A17
      - 語り: 別の日の条には、旧都へ戻る議が、ほぼ出た、とあります。清盛に申し遣わすと、返事は、もっともだ、ただし老法師は、お供しない。人々は興ざめして、その議は立ち消えになった、と。
      # fact: kiyomori-A18, kiyomori-B18
      - 語り: ところが8月12日、院の殿上、つまり上皇のいる御所の会議で、大嘗会は、来年に延ばす、と決まります。高橋さんは、遷都か離宮かの争いは、大嘗会を福原でやるか、京でやるかで、激しくなった、と書きます。兼実は、離宮で大嘗会などとんでもない、と拒みました。
        card: {head: "1180年8月12日", body: 大嘗会、来年へ延期}
      # fact: kiyomori-A18, kiyomori-A21
      - 語り: 5日後の8月17日、伊豆で、頼朝が兵を挙げます。
        tone: 重い
      # fact: kiyomori-A19
      - 語り: 8月29日、経房が兼実に、福原の内裏のことを語ります。福原は、今は離宮。皇居は、清盛の私の造作で、清盛が移ったあとに、借り召す形をとる、と。
      # fact: kiyomori-A19
      - 語り: 兼実は、延暦の例とは全く合わない、旧都の人屋は、一人も移住していない、と書きました。延暦の例とは、桓武天皇が長岡京から平安京へ移した、あの先例です。
      # fact: kiyomori-A20
      - 語り: なぜ、清盛の私邸という形にしたのか。陰陽師の泰親が、方角の忌みは、清盛の沙汰で造った家を、清盛が移ったあとに借りて皇居にするなら宜しい、と答えた、と玉葉にあります。
      # fact: kiyomori-A20
      - 語り: 兼実は10月20日の条で、批判します。作事の指図も用途も、清盛が決めながら、他人の名を借りるのは、ひとえに神をたばかるに似た、ごまかしの沙汰だ。
      # fact: kiyomori-B28
      - 語り: 高橋さんは、福原での都づくりは、結局、未完に終わったので、遷都という完了形の事実は、なかったことになる、と書きます。反乱が全国に広がっても、内裏の新造を進めた清盛を、清盛の執念でしょう、と。
      - 語り: 2つ目の分かれ目です。もしも公家たちが従い、8月12日の会議で、大嘗会を福原で行うと決まっていたら。まず、記録から言えることを見ます。
        tone: 疑問
      # fact: kiyomori-A18, kiyomori-A13
      - 語り: 記録から言えるのは、こうです。遷都か離宮かの争いの中心だった大嘗会は、延期されました。11月17日の百錬抄は、大嘗会は今年行われず、と書きます。
      # fact: kiyomori-A27
      - 語り: 一方、清盛は、私邸の形にしてでも、福原に内裏を建て続けます。11月13日には、新造の皇居で儀式が行われ、玉葉は、希代の事か、と書きました。
      - 語り: ここからは、もしもの話です。
        tone: 疑問
      - 語り: もしも大嘗会が福原で行われていたら、福原は、離宮ではなく都、という既成事実に、近づいたかもしれません。ただ、記録に残る兼実の反対は、延暦の先例と合わないこと、旧都の人が誰も移っていないこと、そして遷都は無いほうがよいという考えにありました。大嘗会を行っても、公家の納得まで、一足で届いたとは、言い切れません。
        tone: しみじみ
      - 語り: ここまでが、もしもの話です。ここからは、記録に戻ります。
        tone: しみじみ
      - 語り: 頼朝の挙兵のあと、清盛は、どう動いたのか。
        hook: true
      - 語り: 10月、思わぬ所から、都の問題が、突きつけられます。
        hook: true

  # ================================================================ 第5章 分岐3 還都せず福原にとどまっていたら
  - title: 「分岐3 福原にとどまっていたら」　1180年9月から11月
    year: 1180
    lines:
      # fact: kiyomori-A21
      - 語り: 頼朝の動きを、玉葉は、駿河・伊豆を押領した、あたかも平将門のようだ、と書きます。将門は、10世紀に、関東で反乱を起こした人物です。
      # fact: kiyomori-A22
      - 語り: 9月5日付で、追討の宣旨が出され、維盛ら3人が、追討使、つまり反乱を討つ将になりました。9月9日、福原から、新都は、2度小さな火事があったほかは別事なし、という書状が届きます。
      # fact: kiyomori-A22
      - 語り: 同じ9月9日、兼実は、邦綱から、福原の地をすでに与えた、と告げられます。宅地の配分は、公家の側にも始まっていましたが、秋になっても、固まりませんでした。
      # fact: kiyomori-A23
      - 語り: 10月20日、玉葉は、伝聞として書きます。延暦寺の衆徒が盛んに蜂起し、奏状を出した。遷都を止めよ、というものだ。裁許がなければ、山城と近江の2国を押領する、したくをしている、と。
        card: {head: "1180年10月20日", body: 延暦寺の奏状}
      # fact: kiyomori-A23
      - 語り: 延暦寺側の記録、元亨釈書も、延暦寺の僧たちが、新旧二京の利害17条を奏し、旧を褒め、新を貶した、これが還都のもとになった、と書きます。
      # fact: kiyomori-A24
      - 語り: 同じ10月20日、駿河の富士川です。吾妻鏡は、平氏の維盛らが、富士川の西のほとりに陣を張った、と書きます。玉葉は、11月5日の条に、伝聞として、官兵の数百騎が降り、残る軍勢は1、2千騎に満たず、武田方は4万余と聞いて、ひそかに引き上げた、と書きます。
        tone: 重い
      # fact: kiyomori-A25
      - 語り: 11月1日の玉葉は、追討使が、追い返された、昔から、追討使が空しく追い返された例は、聞いたことがない、と書きます。
      # fact: kiyomori-A25
      - 語り: その追討使が京に戻った日は、記録で食い違います。玉葉は11月5日の夕方、百錬抄は11月3日です。
        tone: 疑問
      # fact: kiyomori-A25
      - 語り: 玉葉は、勢多に着いた使者の話として、清盛が大いに怒り、早く道から姿を隠せ、京に入るな、と言った、と伝えます。
      # fact: kiyomori-A26
      - 語り: 同じ11月5日の玉葉に、伝聞があります。清盛の子の宗盛が、還都をすべきだと清盛に示し、聞き入れられず、口論になった。人は耳を驚かせた、と。
        card: {head: "1180年11月5日", body: 宗盛、清盛に還都を説く}
      # fact: kiyomori-A26
      - 語り: 同じころの玉葉には、福原を出た者の話として、還都はなお未定、時忠が不満だから、とあります。
      # fact: kiyomori-A28
      - 語り: 還都の決定の日は、記録から分かりません。玉葉が最初に伝えるのは、11月19日です。玉葉は、還都は26日に出発、12月2日に入京、と伝聞で書きます。2日後の21日には、日程が縮められ、23日に出発、26日に入京、と伝わります。出発は3日、入京は6日、予定より早まりました。
        card: {head: "1180年11月21日", body: 出発3日・入京6日早まる}
      # fact: kiyomori-A28
      - 語り: 兼実は書きます。敵軍が隣国に満ちるときに、急に還都とは、世の議に叶うだろうか。
      # fact: kiyomori-A30
      - 語り: 11月26日、玉葉によると、天皇は邦綱の五条の邸に、上皇は頼盛の六波羅の邸に、法皇は、清盛の長男、重盛の六波羅の泉殿に入りました。
        card: {head: "1180年11月26日", body: 京都へ戻る}
      # fact: kiyomori-A31
      - 語り: この日の末尾に、兼実は、こう書き留めます。去る6月2日、忽然と都を福原に移した。神は福を降さず、人は皆、禍と呼ぶ。関東の謀叛は、遷都から起こった、と。
        tone: 重い
      # fact: kiyomori-A31
      - 語り: ただ、延暦寺の言い分、遷都で人の帰依がなくなり、離山のもとになる、という申し出を、兼実は、理なきに非ず、と書き写します。
      - 語り: 3つ目の分かれ目です。もしも清盛が、延暦寺の奏状や、宗盛の説得を退けて、福原にとどまり続けていたら。まず、記録から言えることを見ます。
        tone: 疑問
      # fact: kiyomori-A32
      - 語り: 記録から言えるのは、こうです。11月24日の玉葉には、近江の騒動のために、還都は猶予すべきだ、という議も出た、とあります。それでも、還都は決まり、法皇も清盛も、1人も福原に残らず、上洛する、と記されました。
      # fact: kiyomori-A29
      - 語り: 平家物語は、これまで横紙を破るように押し通した清盛が、それなら還都しよう、と言った、と描きます。
      # fact: kiyomori-B35, kiyomori-B15
      - 語り: 福原が続いたらどうなったか。これに答えた記録は、ありません。島崎晋さんの解説記事は、福原は氾濫する河川がなく、西国の物資を大輪田泊で陸揚げできるので、商業都市に成長することも期待できた、と推測します。世界大百科事典の港湾の項は、短い期間だったが、清盛の意図は近代の港湾の考え方に近い、と評価します。
      - 語り: ここからは、もしもの話です。
        tone: 疑問
      - 語り: 福原にとどまるには、延暦寺の動き、近江や東国の反乱、一門の宗盛の説得を、同時に押し返す必要があったはずです。
        tone: しみじみ
      - 語り: もしもの答えを置くなら、福原が都として続くには、土地の狭さ、公家の反対、寺の圧力、東国の反乱を、同時に越える必要があり、記録を並べるかぎり、続く道は細かった、と考えられます。
      - 語り: ここまでが、もしもの話です。ここからは、記録に戻ります。
      - 語り: 還都のあと、清盛は、どうなったのか。
        hook: true
      - 語り: そして、福原の地面には、何が残ったのか。
        hook: true

  # ================================================================ 第6章 その後 福原のあと
  - title: 「その後　福原のあと」　1180年12月から
    year: 1180
    lines:
      # fact: kiyomori-A33
      - 語り: 京へ戻って32日後の12月28日、重衡が南都を攻め、東大寺と興福寺の堂宇が焼けました。玉葉は、仏法も王法も尽きたか、と書きます。
        tone: 重い
        card: {head: "1180年12月28日", body: 南都の焼き討ち}
      # fact: kiyomori-A34
      - 語り: 1181年閏2月4日、清盛が亡くなります。数えで64歳と、神戸市の解説にあります。還都から、およそ3か月あまりあとでした。
        card: {head: "1181年閏2月4日", body: 清盛の死}
      # fact: kiyomori-A34
      - 語り: 玉葉は、その前日の条に、清盛が法皇に、自分の死んだあとは、万事、宗盛に任せる、と奏した、と書きます。法皇の答えは、はっきりしませんでした。
      # fact: kiyomori-B30
      - 語り: 高橋さんは、清盛は、ついに生きて、再び福原の地を踏むことはなかった、と書きます。
        tone: しみじみ
      # fact: kiyomori-B30
      - 語り: 1183年、平家は木曽義仲に追われて都を落ち、福原に一泊します。翌日、宗盛らは、福原の内裏に火を放ち、船で西国へ逃れた、と高橋さんは書きます。平家物語では、巻七の場面です。平氏は、1185年に滅びます。遷都から5年です。
        tone: 重い
      # fact: kiyomori-B24
      - 語り: この遷都を、鴨長明は、方丈記に書き残しました。清盛の名前は、1度も出てきません。
      # fact: kiyomori-B26
      - 語り: 方丈記は書きます。道のほとりを見れば、車に乗るべき人が馬に乗り、衣冠を着るべき人が直垂を着ている。都の風は、たちまち改まって、ただ田舎びた武士と変わらない。
      # fact: kiyomori-B26
      - 語り: もとからそこにいた者は、土地を失って憂え、移り住んだ人は、家を建てる苦労を嘆く、と。
      # fact: kiyomori-B27
      - 語り: そして、同じ年の冬、やはり、この京に帰りたまいき。壊して運んだ家々は、ことごとく、元のようには造らなかった、と書きます。
        tone: しみじみ
      # fact: kiyomori-B20
      - 語り: 福原の跡は、今も、掘られ続けています。祇園遺跡からは、中国の吉州窯の天目小碗が出ました。日本での出土例は、博多、京都、鎌倉に数点だけの珍品、と高橋さんは書きます。
      # fact: kiyomori-B21
      - 語り: 2025年9月の第25次調査では、12世紀後半の、ごく短い期間だけ使われた鍛冶工房の跡が見つかりました。釘や小刀が多く、神戸市は、福原京の建物の建設に伴う小鍛冶場だった可能性が高い、とします。
        card: {head: "2025年9月", body: 福原京の鍛冶工房の跡}
      - 語り: では、3つの分かれ目の答えを、まとめます。
        hook: true
      - 語り: そして、あの兼実の日記に、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも1180年の福原遷都が成功していたら
    lines:
      - 語り: もしも清盛の福原遷都が、成功していたら。日本の都は、神戸になったのか。
      - 語り: 1つ目。土地。和田では、左京は五条まで、右京は平地がなく、候補地の話は、和田・小屋野・印南野と動きました。平安京と同じ規模の区画は、取れませんでした。
      - 語り: 2つ目。公家。大嘗会は延期され、福原は離宮と呼ばれ、兼実は、離宮に似る、と書きました。大嘗会を福原で行っても、納得が得られたとは、言い切れません。
      - 語り: 3つ目。寺と東国。延暦寺の奏状、富士川の敗報、宗盛の説得。還都は、出発が3日、入京が6日、予定より早まり、11月26日に、京へ入りました。
      - 語り: 記録を並べると、福原が都として続く道は、細いものだった、と考えられます。ただ、福原の地面には、清盛が、福原に都を造ろうとした跡が、今も出てきます。
      # fact: kiyomori-A06, kiyomori-A31
      - 語り: 出発の2日前、兼実は、乱世に生まれて、こんな事を見るのは悲しむべき宿業だ、と書きました。出発の171日後、同じ日記は、この日の条の末尾に、衆庶の怨みを散じ、万民の望みに叶う、と書き留めます。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
