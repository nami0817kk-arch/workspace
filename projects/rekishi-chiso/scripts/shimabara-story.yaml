# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  島原の乱で、原城に立てこもった人は、何人だったのか。
  攻めていた側の細川家の覚書でさえ、城の中は「5万、6万」という話と、「男女で1万4、5千」という見積もりが並んでいます。
  よく言われる「3万7千人」も、元をたどると、島原半島の2万4千人余と天草の1万3千人余を足した数です。
  農民や牢人たちが立てこもった城を、幕府は、なぜ3か月近く落とせなかったのか。
  この動画でわかること
  ・一揆の発端と、「今はデウスの御代にて候」と書かれた天草の村
  ・原城跡の発掘で見つかった、鉛の弾を溶かして作り直した十字架の工房の跡
  ・幕府の上使・板倉重昌が元日の総攻めで戦死した経緯と、松平信綱の戦い方
  ・宗教の一揆か、年貢の一揆か　研究者の見方
  ・城の中の人数・幕府軍の人数・戦死者の数が、記録ごとに合わない理由
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（東京大学史料編纂所の画像・OCR検索で読んだ『細川家史料』『伊達家文書』『オランダ商館長日記』の和訳、南島原市教育委員会の発掘資料、熊本日日新聞の稲葉継陽さんの連載、長崎新聞、島原市、天草市、観光庁の多言語解説文、日本政府の世界遺産推薦書、世界大百科事典、日本歴史地名大系など）を語りで示してから読んでいます。
  文字起こし（OCR）の読み違いがあり得るため、数字は幅を持たせて話しています。城の中の人数・幕府軍の人数は、史料から1つに決められません。
  絵図は、17世紀に描かれた原城と寄せ手の陣の絵図（ウィキメディア・コモンズ、パブリックドメイン）です。写真は、ウィキメディア・コモンズ（CC BY-SA）の原城跡の写真です。

en:
  title: "Shimabara Rebellion: Why Did Hara Castle Hold for Three Months? 14,000 or 50,000 Inside"
  description: |-
    How many people were inside Hara Castle during the Shimabara Rebellion of 1637-38?
    Even a memorandum kept by the Hosokawa clan, on the besieging side, records a rumor of "fifty or sixty thousand" and its own estimate of "perhaps 14,000 or 15,000, men and women."
    The familiar figure of 37,000 turns out to be 24,000 from the Shimabara peninsula plus 13,000 from Amakusa, as a gazetteer adds it up.
    Why could the shogunate not take a castle held by farmers and masterless samurai for almost three months?
    In this video you will learn:
    - How the uprising began, and the Amakusa village that declared "now is the age of Deus"
    - What the 2024 excavation of Hara Castle found: a workshop that melted lead bullets into crosses
    - How the shogunate's envoy Itakura Shigemasa died in the New Year's Day assault, and how Matsudaira Nobutsuna changed the plan
    - Religious uprising or tax revolt: what researchers say
    - Why the numbers for defenders, besiegers and the dead do not agree
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "How Many Were Inside? 1638"
    - "Why Did Farmers Take Up Arms? Autumn 1637"
    - "Why Did They Choose an Abandoned Castle? Hara Castle"
    - "Why Did the Shogunate's Envoy Die on New Year's Day? 1638"
    - "Is the Story True? Religious Uprising or Tax Revolt"
    - "How Many Were in the Castle?"
    - "Why Did the Castle Hold, and Why Did It Fall? February 1638"
    - "What Does the Site of Hara Castle Tell Us?"
    - "Summary: Why Could It Not Be Taken?"

