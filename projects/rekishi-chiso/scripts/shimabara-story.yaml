sections:
  # ================================================================ 序章（冒頭 約3分）。答えは最後の章まで言わない
  - title: 城の中には、何人いたのか　1638年
    background: {image: paintings/shimabara_siege_hara_castle_screen.jpg, credit: "原城と寄せ手の陣を描いた絵図（17世紀、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P01（夜明けの有明海に突き出す台地と古い石垣の遠景。人物なし）
    year: 1638
    lines:
      # 0〜10秒：知らない事実（攻めた側の記録でさえ、城の中の人数が1万4千〜5万以上で食い違う）
      # fact: shimabara-64
      - 語り: 島原の乱で、原城に立てこもった人は、何人だったのか。攻めていた側の記録でさえ、1万4千人から、5万人以上まで、食い違っています。
        tone: 強調
        card: {head: "城の中の人数", body: 1万4千か、5万か}
      # fact: shimabara-64
      - 語り: 熊本藩の細川家に残る、寛永15年2月4日付の覚書です。文字起こしを読むと、捕虜の話では、城の中は、5万、6万。けれど、書き手は、男も女も合わせて、1万4、5千だろう、と見ていたようです。
        year: 1638
      # fact: shimabara-09
      - 語り: よく言われる、3万7千人。これは、日本歴史地名大系の「原城跡」の項に、内訳があります。島原半島から2万4千人余。天草から、1万3千人余。足した数です。
        card: {head: "3万7千人", body: 2万4千＋1万3千}
      # fact: shimabara-09, shimabara-78
      - 語り: ところが、同じ項には、「計2万数千人とも」という、別の数も並んでいます。南島原市の資料も、2万数千人とも、3万数千人とも言われる、と、幅を持たせて書いています。
      # fact: shimabara-77, shimabara-25
      - 語り: 攻めた幕府軍は、およそ12万人と言われます。この数も、いま、研究者が数え直しています。
      # fact: shimabara-77, shimabara-25
      - 語り: 東京大学史料編纂所の共同研究は、2011年から2015年にかけて、参陣した人数を区分けして、従来の数値を再評価しました。ただ、その結論の数字は、確かめられませんでした。
      # fact: shimabara-38
      - 語り: 一方、城の跡からは、もっと確かなものが出ています。2024年、南島原市が発表した発掘で、鉛の塊と、鋳型と、鉛でできた十字架が見つかりました。
        tone: 強調
        card: {head: "2024年の発掘", body: 鉛の十字架と鋳型}
      # fact: shimabara-38, shimabara-79
      - 語り: 市は、城の中の人たちが、鉛の銃弾を溶かして、十字架などに作り直していた工房の可能性がある、と説明しています。名古屋市立大学の千田嘉博さんは、長崎新聞に、それを具体的に解明した、と話しました。
      - 語り: 1637年から翌年にかけて、島原半島と天草で起きた、一揆です。農民や牢人たちが、海に突き出た古い城に立てこもり、幕府は、3か月近く、落とせませんでした。
      - 語り: 食い違う数。鉛の十字架。そして、攻めた側の総大将が、元日に、戦死したこと。
        tone: 重い
      # 「なぜ」は1本に1つ。問いで締める
      - 語り: なぜ、幕府は、この城を、これほど長く、落とせなかったのか。答えを探して、まず、一揆が起きた、寛永14年の秋から、見ていきます。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 なぜ、百姓たちは武器を取ったのか
  - title: なぜ、百姓たちは、武器を取ったのか　1637年秋
    background: {image: paintings/shimabara_battle_map_c17.jpg, credit: "島原の乱の陣図（17世紀ごろ、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P02（秋の棚田と、実りの少ない畑。人物なし）／P03（山あいの村の藁ぶき屋根と夕暮れの煙。人物なし）／P05（霧の朝の大きな城と堀の遠景。人物なし）
    year: 1637
    lines:
      # fact: shimabara-14
      - 語り: 熊本大学の稲葉継陽さんは、熊本日日新聞の連載で、こう書いています。家光の政権のもとで厳しくなる、キリシタンへの弾圧。10年続いた飢饉。
        card: {head: "寛永14年（1637年）", body: 弾圧と飢饉が重なる}
      # fact: shimabara-14
      - 語り: 大名の対応は足りず、いったん信仰を捨てた「転びキリシタン」の百姓たちは、追いつめられた、と。
      # fact: shimabara-14
      - 語り: そして、寛永14年10月の下旬、ついに、キリシタンに立ち帰って、武器を手にした。稲葉さんの文章は、そう続きます。
      # fact: shimabara-59
      - 語り: 熊本藩主、細川忠利が、仙台の伊達家の家臣に送った書状は、島原での出来事を、こう伝えています。松倉長門の領地の島原で、キリシタンたちが立ち帰り、所々の代官などを、打ち殺した、と。
        tone: 重い
      # fact: shimabara-13
      - 語り: 発端の日からして、記録で揺れます。稲葉さんの連載は、10月26日に島原城下を襲った、と書きます。辞典の中には、25日ごろとするものもあります。
        card: {head: "発端の日", body: 10月25〜27日で揺れる}
      # fact: shimabara-13
      - 語り: 一揆は、10日足らずで、島原半島の南部、12か村の百姓と家族、約2万5千人に膨れ上がりました。ただし、稲葉さんは、島原と天草の、全ての住民が加わったわけではない、とも書いています。
      # fact: shimabara-15
      - 語り: 天草でも、同じことが起きていました。細川忠利の弟が、熊本の家老たちに送った速報の書状の写しです。須子村の百姓が、十字架を掲げ、鉄砲で武装した。寺沢家の代官の支配は、過去のものだ、と宣言した。
        card: {head: "天草の須子村", body: 十字架を掲げ、鉄砲で武装}
      # fact: shimabara-15
      - 語り: その言葉は、「今はデウスの御代にて候」。今の言葉にすると、「いまは、デウスの世である」。
        tone: 重い
        pause: 0.8
      # fact: shimabara-16
      - 語り: 10月30日には、熊本藩の領地にも、不穏な影が現れます。ロザリオを首に掛けた男たち6人が、舟津に上陸しようとしました。記録によれば、郡浦の側は約50人。大矢野の側は、約1000人だった、と伝わります。
      - 語り: では、なぜ、そこまで追いつめられたのか。島原の領主、松倉の側から、見てみます。
        tone: 疑問
      # fact: shimabara-27, shimabara-83
      - 語り: 松倉重政は、1616年、大和の五條、1万石から、肥前の有馬、4万石へ移りました。そして、石高に見合わない、大きな城を築きます。島原城です。
      # fact: shimabara-83
      - 語り: 観光庁の解説は、4万石という、決して多くない禄高に対して、不相応なほど大きな城、と書きます。
        card: {head: "島原城", body: 4万石に不相応な大きさ}
      # fact: shimabara-84
      - 語り: 築城の年の言い方も、そろいません。nippon.com は、1618年から約7年。熊本日日新聞は、1624年に完成。島原の供養祭の案内は、4年から7年、と書きます。
      # fact: shimabara-85
      - 語り: 年貢の中身を、具体的に書いた記録もあります。ポルトガルの船長、ドゥアルテ・コレアの手紙です。コレアは、1637年11月に長崎で捕まり、翌年10月に牢から手紙を書きました。つまり、見聞きしたことの又聞きです。
        card: {head: "コレアの手紙", body: 1638年10月付・牢の中から}
      # fact: shimabara-85
      - 語り: ジェフリー・ガンさんの紹介によれば、手紙は、定例の年貢のほかに、収穫の9分の1の税、タバコの葉、ナス、塩焼きのための薪の労役まで、課されたと書きます。長崎奉行の調べも、原因を、役人の暴政と見た、といいます。
      # 【想像1】百姓。記録：年貢が重く、飢饉が10年続いた（稲葉・コレア）。気持ちだけ
      - 人物: 「……これ以上、取られたら、もう、生きていけない」
        who: 百姓想像
        imagined: true
        tone: 重い
      # fact: shimabara-26
      - 語り: ただし、島原市の学芸員、吉田信也さんは、後世の記録の多くが、勝家の検地と、不当に高い税率を記しているが、噂の真偽は、はっきりしない、と書いています。
      - 語り: 年貢のせいか。信仰のせいか。それとも、両方か。そして、立ち上がった人たちは、なぜ、あの城に向かったのか。
        tone: 疑問
        hook: true
      - 語り: 原城。海に突き出た、台地の上の城です。
        hook: true

  # ================================================================ 第2章 なぜ、廃城になった原城に籠もったのか
  - title: なぜ、廃城になった原城に、籠もったのか　1637年12月
    background: {image: paintings/shimabara_hara_from_sea.jpg, credit: "海から見た原城跡（ウィキメディア・コモンズ、CC BY-SA 3.0）"}
    # AI絵：P01／P07（草に覆われた石垣と崩れた門の跡。人物なし）／P09（浜に引き上げられた小舟と網。人物なし）／P11（発掘の溝。現代。人物なし）
    year: 1637
    lines:
      # fact: shimabara-49
      - 語り: 原城の本丸の総石垣は、慶長4年から9年、1599年から1604年ごろ、有馬晴信の時代に築かれました。長崎県の文化財のデータベースによれば、発掘と、イエズス会の記録から、分かっているそうです。
        card: {head: "原城", body: 有馬晴信の時代に築城}
      # fact: shimabara-49
      - 語り: 城は、南北約1.3キロ、東西約0.5キロ。約42万平方メートル。県内で最大の、平山城です。
      # fact: shimabara-45
      - 語り: その城は、一揆のとき、すでに廃城になっていました。ただ、廃城の年が、資料で合いません。
        figure: {type: stats, title: 原城が廃城になった年　資料ごとの違い, items: [[南島原市教育委員会の資料（2024年）, 1616年, 元和2年], [市の国指定文化財のページ, 1615年以降, 一国一城令], [市の世界遺産のページ, 1615年, 転封の翌年]], upto: 1}
      # fact: shimabara-45
      - 語り: 南島原市教育委員会の2024年の資料は、一国一城令により、元和2年、1616年。市の別のページは、1615年以降。世界遺産のページは、有馬直純が移った1614年の、翌年。
        figure: {type: stats, title: 原城が廃城になった年　資料ごとの違い, items: [[南島原市教育委員会の資料（2024年）, 1616年, 元和2年], [市の国指定文化財のページ, 1615年以降, 一国一城令], [市の世界遺産のページ, 1615年, 転封の翌年]], upto: 3}
      # fact: shimabara-45
      - 語り: どれも、一国一城令の前後の話です。1年のずれでも、資料によって、書き方が違います。
        figure: {type: stats, title: 原城が廃城になった年　資料ごとの違い, items: [[南島原市教育委員会の資料（2024年）, 1616年, 元和2年], [市の国指定文化財のページ, 1615年以降, 一国一城令], [市の世界遺産のページ, 1615年, 転封の翌年]], upto: 3}
      # fact: shimabara-60
      - 語り: 一揆の人々が、この城に籠もったことは、細川忠利の書状に出てきます。12月27日付、金森重頼あて。一揆が、「原の古城」に籠もった、とあります。
        figure: null
        card: {head: "12月27日", body: 一揆が「原の古城」に籠もる}
      # fact: shimabara-60
      - 語り: 松倉勢と鍋島勢が攻めかかると、城から鉄砲を撃ち、松倉の者は4、5人、鍋島の者は2、30人が、傷を負いました。
      # fact: shimabara-61
      - 語り: オランダ商館長の日記にも、同じころの記述があります。反乱の側が、海辺の廃城を補強し、十字架の旗を立て、イエスとマリアの像のある、新しい教会を建てた、と。
      # fact: shimabara-48
      - 語り: この城の発掘は、1992年に始まりました。本丸が中心でした。2018年度からは、二ノ丸の調査に移っています。
      # fact: shimabara-38, shimabara-79
      - 語り: 2024年4月28日の、南島原市の現地説明会資料です。二ノ丸から、一揆の籠城のための、竪穴状の遺構が、少なくとも3基、確認されました。底から、鉛の塊、鋳型、鉛でできた十字架が出ています。
        tone: 強調
        card: {head: "二ノ丸の竪穴", body: 鉛塊・鋳型・鉛の十字架}
      # fact: shimabara-39
      - 語り: ほかの調査区からは、コインのような形の、鉛の製品。蜘蛛の巣に似た線が刻まれ、真ん中に穴が開いています。十字だけを刻んだものもあります。
      # fact: shimabara-40
      - 語り: 堀のような遺構は、幅およそ3メートル。底から、一揆のときに使われたとみられる、鉛の銃弾が出ました。市は、一揆勢の塹壕として働いた可能性が高く、落城後に、幕府軍の破却で、一気に埋められたと考えています。
        card: {head: "幅約3mの堀", body: 塹壕の可能性}
      # fact: shimabara-42
      - 語り: 穴の一つからは、凝灰岩でできた、網のおもりが3点。籠城した人たちが、海辺から、魚や貝を食料として調達した、という伝えと合う道具です。
      # fact: shimabara-41
      - 語り: 一方で、二ノ丸の中央からは、原城の発掘で初めて、掘立柱の建物の跡が出ました。柱の間は6尺5寸。本丸の門と同じ寸法です。市は、一揆のときに部材を集めるのは難しいはずなので、築城の頃の建物だろう、と見ています。
      - 語り: 海に面した台地。整えられた城。そして、鉛の工房。立てこもった人たちは、準備をしていた、のでしょうか。それとも、あるものを使っただけなのか。ここは、発掘資料も、断定していません。
        tone: 疑問
      - 語り: では、攻める側は、どう動いたのか。幕府の上使が、江戸から、やって来ます。
        hook: true
      - 語り: その人は、元日に、討ち死にします。
        tone: 重い
        hook: true

  # ================================================================ 第3章 なぜ、幕府の上使は、元日に戦死したのか
  - title: なぜ、幕府の上使は、元日に戦死したのか　1638年1月
    background: {image: paintings/shimabara_battle_map_c17.jpg, credit: "島原の乱の陣図（17世紀ごろ、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P08（朝の高台に並ぶ竹の柵と筵の囲い。人物なし）／P10（灯のもとの文机と書状の巻物。人物なし）／P06（夜の山の斜面に点々と灯る火の遠景。人物なし）
    year: 1638
    lines:
      # fact: shimabara-58
      - 語り: 細川忠利の、1637年11月10日から12日付の書状です。幕府が、島原の一揆に、上使として、板倉内膳、石谷十蔵を遣わした。鍋島と寺沢の人数に、出陣を命じた。一揆は、「大方きりしたんばかり固まり」と書きます。
        card: {head: "1637年11月", body: 上使は板倉重昌・石谷貞清}
      # fact: shimabara-24
      - 語り: 長崎大学の木村直樹さんは、最初の討伐軍は、各藩の指導者が参勤で江戸にいたため、寄せ集めで、士気も戦力も低く、1か月近く苦戦した、と説明しています。
      # fact: shimabara-96
      - 語り: 東京大学史料編纂所の報告書で、武田昌憲さんは、上使の旅を比べています。板倉重昌は、数十名で、21日かけて、島原に着きました。後から来る老中、松平信綱は、従卒1300名で、30日かかりました。
        figure: {type: stats, title: 江戸から島原への旅　上使と老中, items: [[板倉重昌（最初の上使）, 21日, 数十名で出発], [松平信綱（後から来る老中）, 30日, 従卒1300名]], upto: 2}
      # fact: shimabara-96
      - 語り: そして、重昌の戦死の知らせは、信綱が島原に入った日に、届きました。武田さんは、元日の前に信綱が着いていれば、敗戦は、なかったかもしれない、と推測しています。
        figure: null
        tone: 重い
      # 暦の断り：ここ1回だけ
      - 語り: ここで、暦のことを、一つだけ言っておきます。日本の記録は、旧暦です。寛永15年の元日は、いまの暦では、1638年の2月14日。オランダの日記は、いまと同じ暦で書かれています。
        card: {head: "寛永15年1月1日", body: いまの暦で1638年2月14日}
      # fact: shimabara-62
      - 語り: 細川忠利の1月12日付の書状案です。「島原、当月朔日、総攻め仕り、攻め損じ候。手負い、死人、あまた御座候。板倉内膳、討死仕られ」。
        tone: 重い
        card: {head: "寛永15年1月1日", body: 総攻め失敗・重昌が戦死}
      - 語り: 今の言葉にすると、島原では、今月1日に総攻めをしたが、失敗した。けが人、死者が、多く出た。板倉内膳が、戦死した。
        tone: 重い
      # fact: shimabara-62
      - 語り: 細川の人数は、島原から呼びに来ましたが、また、止めに来て、総攻めには、間に合いませんでした。
      # fact: shimabara-95
      - 語り: 戦のあとの扱いも、対照的でした。信綱は、1639年に、忍の3万石から、川越の6万石へ。倍になりました。戦死した重昌の子、重矩は、加増なしで、1万石の移封でした。
        card: {head: "戦のあとの扱い", body: 信綱は6万石・重矩は加増なし}
      # fact: shimabara-63
      - 語り: 忠利は、1月26日に有馬に着きます。1月29日付の書状に、「我等の仕寄は、塀際へ十九間」。2月には、坑道を掘って、「城の塀際へ八、九間」まで迫った、とあります。力攻めを、やめたのです。
        card: {head: "坑道を掘り進める", body: 塀際まで八、九間}
      # fact: shimabara-19
      - 語り: 補給も、大変でした。熊本日日新聞によれば、熊本の町からは、2月13日に、火矢などの原料として、「ねずみのふん五升」が送られています。
      - 語り: 力攻めをやめた幕府軍に、城の中の様子が、少しずつ、伝わってきます。それは、思いもよらない形でした。
        hook: true
      - 語り: 城の中の人は、本当に、宗教のために、立てこもったのか。研究者の見方は、割れています。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 通説の検証（中盤の1章）
  - title: 語られてきた話は本当か　宗教の一揆か、年貢の一揆か
    background: {image: paintings/shimabara_siege_hara_castle_screen.jpg, credit: "原城と寄せ手の陣を描いた絵図（17世紀、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P10／P12（現代の原城跡の草の斜面と青い海。人物なし）／P05
    year: 1637
    lines:
      # fact: shimabara-11
      - 語り: 世界大百科事典の、島原の乱の項は、中村質さんの執筆です。今日、宗門一揆説より、農民一揆説が有力だ、と書いています。年貢の減免などの要求が、信仰の旗印に重なった、という説明です。
        card: {head: "世界大百科事典", body: 農民一揆説が有力}
      # fact: shimabara-24
      - 語り: 長崎大学の木村直樹さんも、直接の引き金は、過剰な年貢への、農民の怒りだ、と見ています。
      # fact: shimabara-14
      - 語り: 一方、稲葉継陽さんは、弾圧と、10年続いた飢饉への、大名の対応不足を、並べて書きました。どちらか一方、ではありません。
      # fact: shimabara-32
      - 語り: 大橋幸泰さんの2010年の論文を引いた、スペイン語の論文があります。それによると、大橋さんは、主な原因が、領主への不満か、信仰の防衛かは、確定できず、両方が圧力だった、と述べたそうです。
        tone: 強調
        card: {head: "大橋幸泰さん（2010年）", body: 両方が圧力だった}
      # fact: shimabara-32
      - 語り: 同じ論文によれば、松平信綱は、一揆勢と手紙をやりとりする中で、領主への不満を知っていました。幕府は、乱を「キリシタンの陰謀」として処理しましたが、キリスト教以外の原因があることは、分かっていた、といいます。
      # 神田千里『島原の乱』は出版社の紹介文までしか読めていない（shimabara-35 は本文を開いていないので # fact は付けない）
      - 語り: 神田千里さんの『島原の乱』、中公新書の紹介文は、信者だけではない民衆、戦国を生き抜いてきた牢人、再改宗者たちが、絡み合った乱の実相、と紹介しています。
      - 語り: 目次には、「宗教一揆の実像」とあります。この本そのものは、開けませんでした。
        figure: {type: stats, title: 一揆の見方　研究者ごとの違い, items: [[中村質さん（世界大百科事典）, 農民一揆説が有力, 年貢の減免などの要求], [大橋幸泰さん（2010年）, 両方が圧力, 領主への不満も信仰の防衛も], [神田千里さん（中公新書の紹介）, 宗教一揆の実像, 民衆・牢人・再改宗者が絡む]], upto: 3}
      # fact: shimabara-15
      - 語り: 天草の村の「今はデウスの御代にて候」という言葉は、どちらの見方でも、無視できません。年貢への怒りだけでは、この言葉は出てこない。そう読むこともできますし、重い年貢に、信仰の言葉が使われた、と読むこともできます。
        figure: null
      # fact: shimabara-22
      - 語り: 牢人はどうだったのか。稲葉さんの連載によれば、天草の旧領主の家の者が、牢人の身で、細川軍に加わって、原城を攻めました。城の中には、その旧領の住民が、大勢いた、といいます。
      # fact: shimabara-23
      - 語り: 細川忠利の本音も、残っています。乱が収まって1か月余りの、4月3日付の書状です。農民の武具を、取り上げたい、と友人に打ち明けています。転んだり、立ち返ったりを繰り返すキリシタンを、何を証拠に取り締まるのか、迷う気持ちも、漏らしています。
        card: {head: "忠利の本音", body: 何を証拠に取り締まるのか}
      # fact: shimabara-26
      - 語り: 戦のあとの処分です。島原市の学芸員の記事によれば、島原の松倉勝家は、所領を没収され、斬罪になりました。大名としては異例の処分、といいます。天草の寺沢堅高は、天草の領地を没収されました。
      # fact: shimabara-92
      - 語り: 戦った人たちの、その後の扱いも、はっきりしています。ボクサーの本は、島原の乱で戦って死んだ者は、武力で抵抗したため、殉教者とみなされなかった、と書きます。文春オンラインは、いまもカトリック教会は、乱の犠牲者を、殉教者と認めていない、と伝えています。
      - 語り: 宗教の一揆か、年貢の一揆か。私たちの調べでは、どちらか一つに決められる史料は、見つかりませんでした。
        tone: 重い
      - 語り: では、城の中の人数は。その数は、記録によって、驚くほど、違います。
        tone: 疑問
        hook: true
      - 語り: 先に、一つだけ言っておきます。この数は、誰かが、数えたものでは、ありません。
        hook: true

  # ================================================================ 第5章 城の中に、何人いたのか
  - title: 城の中には、何人いたのか　5万か、1万4千か
    background: {image: paintings/shimabara_battle_map_c17.jpg, credit: "島原の乱の陣図（17世紀ごろ、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P10／P13（湾に停泊する17世紀の帆船。遠景・夕暮れ。人物なし）／P01
    year: 1638
    lines:
      # fact: shimabara-64
      - 語り: もう一度、細川家の2月4日付の覚書を、見てみます。史料編纂所の文字起こしによれば、「生け捕りの口、たびたび承り候に、城中の人数、五万、六万のと申し候間、いかさま、男女一万四、五千も御座候や、と推量仕り候」。
        card: {head: "寛永15年2月4日", body: 細川家の覚書}
      # fact: shimabara-64
      - 語り: 言い換えると、捕虜の話を何度も聞いたが、城の中は5万、6万と言う。けれど、男女合わせて、1万4、5千ではないか、と推量する。
        figure: {type: stats, title: 城の中の人数　記録ごとの違い, items: [[捕虜の口（細川家の覚書）, 5〜6万, 寛永15年2月4日], [細川家の見積もり（同じ覚書）, 男女で1万4〜5千, 「推量仕り候」], [日本歴史地名大系（原城跡）, 3万7千, 2万4千＋1万3千の内訳]], upto: 2}
      # fact: shimabara-61, shimabara-65
      - 語り: オランダ商館長の日記は、時期ごとに、違う数を書いています。12月26日、27日の条は、約9千から1万人。1月の条の本文は、有馬の反乱軍は、2万5千人を超える。2月4日ごろは、3万人強。文字起こしの数字には、読み取りの不確かさがあります。
        card: {head: "オランダ商館長日記", body: 時期ごとに数が変わる}
      # fact: shimabara-10
      - 語り: 辞典も、そろいません。3万人以上、3万7000、3万8000。世界大百科事典の中村質さんは、老幼男女2万数千。
        figure: {type: stats, title: 城の中の人数　記録ごとの違い, items: [[捕虜の口（細川家の覚書）, 5〜6万, 寛永15年2月4日], [細川家の見積もり（同じ覚書）, 男女で1万4〜5千, 「推量仕り候」], [日本歴史地名大系（原城跡）, 3万7千, 2万4千＋1万3千の内訳]], upto: 3}
      # fact: shimabara-88
      - 語り: 外国の本も、見ます。1911年版のブリタニカ百科事典は、戦闘員2万人と、女性・子ども1万7千人。別の説では、その半分、とあります。
        figure: null
      # fact: shimabara-33
      - 語り: スペイン語の論文は、処刑・犠牲者を、3万7千から4万、と書きます。ただし、他の文献を引いた数で、数は、文献ごとに揺れる、と指摘しています。
      - 語り: 3万7千人を、最初に数えた史料の名前は、私たちの調べでは、たどれませんでした。辞典と、地名大系までです。
        tone: 重い
      # fact: shimabara-10, shimabara-33
      - 語り: 攻めた幕府軍の数も、同じです。辞典は、十数万、12万、12万4千。スペイン語の論文は、約15万、または、幕府直属2万に、大名の追加12万5千。
        figure: {type: stats, title: 幕府軍の人数　記録ごとの違い, items: [[辞典（山川・ブリタニカ・旺文社など）, 12万〜12万4千, 十数万とも], [スペイン語の論文（Keith 2006）, 約15万, Hall 1991 は14万5千], [オランダ側の覚書（1638年3月）, 8万, "2度の攻撃の戦死5,712人"]], upto: 3}
      # fact: shimabara-72
      - 語り: オランダ商館長日記の1638年3月の条には、バタヴィアへの覚書として、「二度の攻撃において、皇帝軍の兵員のうち、5712人が戦死した」とあるようです。幕府軍は、「8万の兵士」から成っていた、とも。ただ、数字の読み取りが不確かなので、確かな数とは言えません。
      # fact: shimabara-11
      - 語り: 一方、世界大百科事典は、幕府側の死者を、2000余り、負傷者を、1万以上としています。読み取りのとおりなら、戦死の数が、2倍以上、違います。
        figure: null
        card: {head: "幕府軍の戦死", body: "2000余か、5,712人か"}
      # fact: shimabara-77
      - 語り: 12万という数については、東京大学史料編纂所の報告書が、こう説明しています。事件から百年以上あとに編まれた、『徳川実紀』の数字が、使われることが多い。兵糧米を渡すための、理論上の数と、実際に参陣した人数は、違う、というのです。
      # fact: shimabara-97
      - 語り: しかも、出兵したのは、九州だけではありません。寛永14年11月から翌年2月に存在した、224の藩のうち、九州の31藩中27藩と、ほかの193藩のうち、少なくとも25藩。仙台、水戸、和歌山、土佐などです。水戸藩は、「使者」のはずが、勝手に参戦して、罰されました。
        card: {head: "出兵した藩", body: 224藩のうち52藩以上}
      # fact: shimabara-29
      - 語り: 武田昌憲さんは、単なる反乱ではなく、全国規模の一揆と捉えるべきだ、と述べています。
      # fact: shimabara-28
      - 語り: 同じ武田さんは、『寛永諸家系図伝』と『寛政重修諸家譜』の、島原の乱の記事を比べて、後世の記録が、必ずしも、数を膨らませているとは限らない、と指摘しています。家ごとの事情が、違いを生む、というのです。
      # fact: shimabara-44
      - 語り: 籠城の長さも、割れます。「3か月」と書く記事もあれば、南島原市の資料は、一揆の期間を、約4か月、としています。寛永14年の10月下旬から、翌年の2月まで。どこから数えるかで、変わるのです。
        card: {head: "籠城の長さ", body: 約3か月か、約4か月か}
      - 語り: 城の中にいた人数は、結局、誰にも、正確には分からなかった。そのことが、記録の数の違いに、そのまま出ているのかもしれません。ここからは、私たちの見立てです。
        tone: しみじみ
      - 語り: では、数の分からない城で、何が起きていたのか。籠城の様子を、攻めた側と、オランダ側の記録から、見ていきます。
        hook: true

  # ================================================================ 第6章 なぜ、城は持ちこたえ、そして落ちたのか
  - title: なぜ、城は持ちこたえ、そして落ちたのか　1638年2月
    background: {image: paintings/shimabara_hara_from_sea.jpg, credit: "海から見た原城跡（ウィキメディア・コモンズ、CC BY-SA 3.0）"}
    # AI絵：P13／P14（夜明けの海岸線と霧に沈む城跡。人物なし）／P08
    year: 1638
    lines:
      # fact: shimabara-68
      - 語り: 籠城のあいだ、城の中と外では、矢文が、何度もやりとりされていました。細川家の2月の書状は、「この間まで矢文の取り替え御座候えども、替わることは御座なく候」と書きます。やりとりはあったが、変わったことはなかった、という意味です。
        card: {head: "矢文のやりとり", body: 幕府の側から何度も}
      # fact: shimabara-68
      - 語り: 有馬直純の昔の家臣に手紙を書かせて、射込ませました。四郎の親類などを使いにしても、なかなか、取り合わなかった、といいます。
      # fact: shimabara-69
      - 語り: 城の側から射込まれた矢文の書き手は、日記では、「アマクサの生まれで、その名をソイエモン」という農民だと、書かれています。文面は、日本にはこんなに多くの、誉れ高い兵士たちがいるのに、なぜ、オランダ人を、加勢のために呼ばせたのか、と責めるものでした。
        card: {head: "城からの矢文", body: なぜオランダ人を呼んだのか}
      # fact: shimabara-71
      - 語り: オランダ人は、呼ばれていました。日記によれば、2月10日、平戸の領主が、最も大きな大砲5門と、砲弾を求めました。うち2門は陣地の砲台に据えられ、船からも、撃ちました。船の名は、日記では、レイプ号です。
      # 【想像2】商館長。記録：求めに応じた（ガン）。気持ちだけ
      - 人物: 「……撃てと言われれば、撃つしかない」
        who: 商館長想像
        imagined: true
        tone: 重い
      # fact: shimabara-70
      - 語り: 発射した数が、日にちごとに、日記に書き込まれています。2月27日は14発、28日は27発。3月1日は9発、3日は16発、5日は23発。9日には、陣地で60発余り。日付は、いまの暦です。
        card: {head: "日記の記録", body: 発射数を毎日書く}
      # fact: shimabara-70
      - 語り: 3月7日は、撃たないように、と告げられています。3月10日には、砲の破片で、船の人間が、1人亡くなりました。
      # fact: shimabara-87
      - 語り: このときの死者の数も、記録で合いません。ポルトガル人コレアの手紙は、船の乗員が2人、殺されたと書き、別の文献は、砲手1人の死と書いています。
      # fact: shimabara-70
      - 語り: ついでに、旧暦でいうと、この砲撃は、1月の中旬から下旬。落城の1か月ほど前に、終わっていました。これは、私たちが日付を換算した結果です。
      # fact: shimabara-66
      - 語り: 細川家の2月4日の覚書は、こうも書いています。「兵糧、玉薬、薪、不自由に罷りなり、2月中ごろまでは、続きかね申すべし」。言い換えると、食料も、弾薬も、薪も足りなくなり、2月中ごろまでは、持たないだろう。
        tone: 重い
        card: {head: "2月4日の覚書", body: 兵糧・玉薬・薪が不足}
      # fact: shimabara-66
      - 語り: 2月中旬の書状にも、城から落ちてきた者たちが、口々に、兵糧、玉薬、薪が不自由で迷惑している、と話した、とあります。
      # fact: shimabara-67
      - 語り: 幕府の側は、兵糧が尽きれば、城から必ず打って出る、と読んでいました。細川三斎、忠興の書状に、「城中、兵糧尽き候はば、必ず出で申すべし」とあります。夜討ちを、警戒していたのです。
      # fact: shimabara-74
      - 語り: 実際、2月21日の丑の刻には、城から、夜討ちが仕掛けられました。伊達家文書の『島原一揆夜討覚書』は、鍋島、黒田、寺沢の人数の、死傷者を並べています。個々の数は、文字起こしの読み取りが不確かなので、ここでは言いません。
      # fact: shimabara-66
      - 語り: 一方で、落人の話には、こういうものもありました。四郎の言葉として、兵糧は、2月中は、あるだろう、と。窮状の話と、強気の話が、同じ時期に、並んでいるのです。
      # fact: shimabara-18
      - 語り: 寛永15年2月27日の午後。佐賀の鍋島勢が、二ノ丸の出丸に迫り、城の側と撃ち合って、総攻撃が始まりました。いまの暦で、4月11日です。
        card: {head: "2月27日の午後", body: 総攻撃が始まる（4月11日）}
      # fact: shimabara-20
      - 語り: その夜、細川勢は本丸に入り、翌28日、落城します。四郎の最期は、細川家の家臣が、2月29日付で出した、戦功の届けに、「四郎首」という、一語で出てきます。
        tone: 重い
      # fact: shimabara-73
      - 語り: 日記は、4月17日の条に、多大の兵員の損失を蒙りながらも、奪い取り、占拠した、と書きました。
      # fact: shimabara-98
      - 語り: 松平信綱は、帰り道に、平戸に4日ほど逗留し、オランダ人の住宅の様子を見ました。『嶋原天草日記』にある話です。この見学の意味は、確かめられませんでした。
      - 語り: なぜ、3か月近く、落とせなかったのか。この章までに、見えてきたことを、並べてみます。
        tone: 疑問
        hook: true
      - 語り: 1つ目は、最初の軍が寄せ集めで、総攻めを、急いで失敗したこと。2つ目は、城が、海に突き出た、整えられた台地だったこと。3つ目は、中の人たちが、鉛の弾を作り直し、塹壕を掘っていた可能性。
        hook: true
      - 語り: そして4つ目は、幕府が、力攻めをやめて、坑道と、兵糧の不足を待つ、持久戦に切り替えたこと。落とせなかった、というより、時間をかけた、という見方もできます。
        tone: しみじみ

  # ================================================================ 第7章 原城跡は、何を語るのか
  - title: 原城跡は、何を語るのか　2021年の陥没と、旗
    background: {image: paintings/shimabara_harajo_kuma83_2015.jpg, credit: "原城跡（Kuma83撮影、2015年。ウィキメディア・コモンズ、CC BY-SA 4.0）"}
    # AI絵：P12／P07／P14／P01
    year: 2018
    lines:
      # fact: shimabara-99
      - 語り: 2021年8月11日からの大雨で、原城跡の本丸跡の広場が、直径約5メートル、深さ約5メートルにわたって、陥没しました。海沿いの高さ約30メートルの崖も、2か所で崩れました。南島原市は、本丸跡を、当面、立ち入り禁止にしました。
        card: {head: "2021年8月", body: 本丸跡の広場が陥没}
      # fact: shimabara-47
      - 語り: 本丸の正面の出入口は、南北90メートル、東西80メートル。国内でも最大級の規模です。大手門の跡は、2005年に見つかり、礎石8個と、水路と階段が出ました。
      # fact: shimabara-46
      - 語り: 2000年12月23日には、花十字の紋のある、軒丸瓦のかけらが出ました。県内では長崎市内で13点出ていますが、有馬の地域では初めて。市は、キリシタン大名の城からは、全国で初めて、と説明しています。
        card: {head: "花十字紋の瓦", body: 2000年12月に発見}
      # fact: shimabara-53
      - 語り: 有馬キリシタン遺産記念館には、イグナチオ・デ・ロヨラと、フランシスコ・ザビエルを、表と裏に刻んだ、メダイがあります。2人が聖人になったのは、1622年。禁教令は1614年。だから、メダイは、禁教のあとに、密かに持ち込まれたものと、推測されています。
      # fact: shimabara-50
      - 語り: 一揆のあと、幕府は、出入口や、やぐらの台の石垣を壊して、埋めました。大手門の跡は、石垣の石で埋められた状態で、見つかっています。市教育委員会は、破却の実像が垣間見える、と書きました。
      # fact: shimabara-54
      - 語り: 天草四郎の陣中旗が、天草市の天草キリシタン館にあります。縦横108.6センチ、菊の花の織りの、白い綸子。中央に大きな聖杯、その上に、十字を付けた聖体、左右に、合掌する天使。血の跡と、矢や弾の跡が残っています。
        card: {head: "天草四郎陣中旗", body: 1964年に国指定}
      # fact: shimabara-55, shimabara-56
      - 語り: 天草市は、一揆の人たちが使い、原城から、佐賀の鍋島藩が、戦利品として持ち帰った、と説明しています。作者は、決まっていません。山田右衛門作が城の中で描いた、という説と、禁教令の前に、セミナリオで聖旗として描かれた、という説が、並んでいます。
      # fact: shimabara-55
      - 語り: 実物の公開は、年に4回、各7日間。通常は、レプリカです。別のページには、年間30日間だけ、とあり、ここでも、数が合いません。
      # fact: shimabara-51
      - 語り: 2018年、原城跡は、「長崎と天草地方の潜伏キリシタン関連遺産」の一つとして、世界遺産になりました。日本政府の推薦書は、原城が一揆のあとに壊されたこと自体が、顕著な普遍的価値に寄与する、と書いています。
        card: {head: "2018年", body: 世界遺産に登録}
      - 語り: 壊されたことも、遺産の一部になった。城は、いまも、記録と、地面の下の両方で、語り続けています。
        tone: しみじみ
        hook: true
      - 語り: 最後に、冒頭の問いに、戻ります。
        hook: true

  # ================================================================ まとめ（冒頭の問いに戻る。余韻の一文）
  - title: まとめ：城の中の人数と、3か月近く落とせなかった理由
    background: {image: paintings/shimabara_siege_hara_castle_screen.jpg, credit: "原城と寄せ手の陣を描いた絵図（17世紀、作者不詳。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：P15（終了画面用。夕暮れの海と台地の遠景、右半分を空ける）
    lines:
      - 語り: なぜ、幕府は、3か月近く、落とせなかったのか。確かなのは、元日の総攻めに失敗し、上使が戦死したこと。その後、力攻めから、坑道と持久戦に変えたこと。城の跡から、鉛の工房の跡が見つかっていることです。
        tone: しみじみ
      - 語り: 一揆が、宗教のためか、年貢のためか。私たちの調べでは、どちらか一つとは、言い切れませんでした。
      - 語り: 城の中に、何人いたのか。細川家の覚書は、5万、6万と聞いたが、男女で、1万4、5千だろう、と書きました。そして、最後に、「推量仕り候」と、付けています。
        tone: しみじみ
        pause: 0.8
      - 語り: 数え切れなかった城の、数え切れなかった人たち。その人数は、約400年たったいまも、確かめられていません。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
        # AI絵：P15（終了画面用。夕暮れの海と台地の遠景、右半分を空ける）

