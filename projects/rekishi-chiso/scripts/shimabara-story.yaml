# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と yoritomo-story.yaml の型）。島原・天草一揆（島原の乱、1637〜38年）。2026-10-30 下書き。
# 公開の予定は 11/03 19:00（日本史枠）。題材は人物ではなく事件。
# 型：1本に1つの「なぜ」＝「なぜ、農民や牢人など2万数千とも3万数千とも言われる人が原城に立てこもり、幕府は3か月近く落とせなかったのか」。
#   語り手は剣崎1人（つむぎは出ない）。冒頭（10秒以内）＝城の中の人数が、攻めた側の記録でさえ1万4千人から5万人以上まで食い違う（細川家の覚書。shimabara-64）。
#   導入では答えを言わず、最後の章で「なぜ落とせなかったのか」と「数の問い」に答える。
#   第1章 なぜ、百姓たちは武器を取ったのか（立ち帰り・発端の日付の食い違い・天草の「今はデウスの御代にて候」・島原城と年貢・ポルトガル人の手紙）
#   第2章 なぜ、廃城になった原城に籠もったのか（廃城年の食い違い・城の広さ・二ノ丸の発掘＝鉛の十字架の工房・塹壕・網のおもり）
#   第3章 なぜ、幕府の上使は、元日に戦死したのか（上使の派遣・寄せ集めの軍・重昌21日と信綱30日・元日の総攻め失敗・坑道へ）
#   第4章 語られてきた話は本当か　宗教の一揆か、年貢の一揆か（研究の見方・大橋幸泰・神田千里の紹介・忠利の本音・殉教者と認められない）
#   第5章 城の中に、何人いたのか（細川家の覚書・オランダ商館長日記・辞典・英語の本・幕府軍の数・戦死の数・籠城の長さ）
#   第6章 なぜ、城は持ちこたえ、そして落ちたのか（矢文・オランダ船の砲撃・兵糧と薪と玉薬・2月27日の総攻め・食い違い）
#   第7章 原城跡は、何を語るのか（2021年の陥没・本丸の発掘・メダイ・破却・陣中旗・世界遺産）
#   第8章 まとめ（なぜ落とせなかったのか→冒頭に戻る：「推量仕候」）。締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを並べたのは6か所：①城の中の人数（細川家の覚書・オランダ日記・辞典・英語の本）②発端の日（10月25〜27日）③廃城の年（1615/1616）
#   ④幕府軍の人数（12万・約15万・8万）と戦死の数（2000余・5,712人）⑤オランダ船の乗員の死者（1人・2人）⑥籠城の長さ（約3か月・約4か月）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml、shimabara-01〜100）にあるものだけ。行の上に `# fact: shimabara-NN`。
#   細川家史料・オランダ商館長日記・伊達家文書は、東京大学史料編纂所の画像・OCR の検索（Historiographical Image Page Search）の文字起こしを開いて読んだ。OCR の読み違いがあるので、
#   数字は「文字起こしでは」「読み取りに不確かさがあります」と言う。熊本日日新聞の連載（稲葉継陽）は会員限定で、冒頭と写真の説明だけ読んだ。
#   神田千里『島原の乱』・大橋幸泰『検証 島原天草一揆』は本文を開けなかった（出版社の紹介・二次文献の引用まで）。台本では「紹介によれば」「引いています」と言う。
#   確かめられなかったこと：「3万7千」の元の史料名・兵糧の量・旗の文言・人骨の数と性別・ICOMOS の評価書・松倉の石高を水増しした話（学術では確認できず、使わない）・
#   山田右衛門作の供述（使わない）。台本では「確かめられなかった」と言う。
#   暦：日本側の記録は旧暦、オランダの日記は新暦。寛永15年1月1日＝1638年2月14日、2月27日＝4月11日。第3章で一度だけ断る。
#   最期・戦闘・遺体の場面に人物の絵は当てない。残虐な細部（人骨の状態・首・拷問）は言わない。宗教・政治の色が強い題材なので、断定を避け出どころを言う。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（声は作らない）。
#   想像の台詞は2か所（百姓想像・商館長想像。config の roles に足した：栗田まろん・黒沢冴白）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の shimabara_siege_hara_castle_screen（原城と寄せ手の陣を描いた絵図。17世紀の作・作者不詳。ウィキメディア・コモンズ、パブリックドメイン）・
#   shimabara_battle_map_c17（島原の乱の陣図。17世紀ごろ。ウィキメディア・コモンズ、PD）＝絵図の一部（part:）、
#   shimabara_hara_from_sea（海から見た原城跡。ウィキメディア・コモンズ、CC BY-SA 3.0）・shimabara_harajo_kuma83_2015（原城跡。Kuma83撮影、CC BY-SA 4.0）＝写真の一部（part:）
#   ＋ AI 絵（P01〜P15、一覧は dev/output/rekishi-chiso/research/shimabara_ai_images.md）。
#   AI 絵の人物は描かない（遠景の影もなし）。戦闘・負傷・遺体・炎は描かない。文字・紋・旗・十字架の文字を描かない。
#   戦闘の場面を描いた屏風（斎藤秋圃の屏風など）は、人が戦う姿が画面いっぱいなので使わない。
