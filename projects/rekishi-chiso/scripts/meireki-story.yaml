sections:
  # ================================================================ 序章（冒頭 約2分）。答えの席：何を変えて、何が前から決まっていたのか
  - title: 燃えた日ではない　天守が建たなかった時期
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-C01
      - 語り: 江戸城の天守は、明暦の大火で焼け落ちました。幕府が、もう建てないと決めたのは、燃えた日では、ありません。《2年7か月》あとです。
        tone: 重い
      # fact: meireki-C04, meireki-A09
      - 語り: しかも、天守を載せるはずの、石垣の土台は、その前に、できていました。国の報告書は、この大火で、江戸の市街地の約6割が焼けた、と書きます。
      # fact: meireki-A11, meireki-A13
      - 語り: 死者は10万人と伝わります。けれど、記録を開くと、数は3つに割れます。3万7千、6万8千、そして10万7千です。
        tone: 重い
      # fact: meireki-B11, meireki-B14
      - 語り: そして、この火事の呼び名として名高い、「振袖火事」。国の報告書は、当時の記録に出てこない話だ、と書きます。筋が文章で確かめられる最古は、大火の197年あとです。
      - 語り: 大火は、江戸の何を変えたのか。そして、何は、火事の前から決まっていたのか。記録を、たどっていきます。
        tone: 疑問
        hook: true
      # fact: meireki-A02
      - 語り: 火が広がった背景には、前の年から続いた、日照りがありました。80日以上、雨がふりませんでした。
        year: 1657
      # fact: meireki-A03
      - 語り: しかも、大火の前から、江戸は火事続きでした。報告書によれば、1月2日に半蔵門の外の屋敷から、5日の夜には、駿河台のあたりから、火が出ています。
      # fact: meireki-A02
      - 語り: 1月17日から、北西の風が吹きだし、18日の朝には、さらに強くなりました。
        tone: 重い
      - 語り: その日の午後に、何が起きたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 18日 本郷から
  - title: 1月18日　本郷丸山から
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-A01, meireki-B01
      - 語り: 当時の暦の、明暦3年1月18日。今の暦では、1657年3月2日です。午後2時ごろ、記録は、本郷丸山の本妙寺から、火が出た、と書きます。
        year: 1657
        tone: 重い
      # fact: meireki-B02, meireki-B03
      - 語り: 幕府が後に編んだ『徳川実紀』も、大火の4年後に出た『むさしあぶみ』も、火元を、本妙寺と書きます。
      # fact: meireki-B06
      - 語り: ただし、町の名は、記録で揺れます。『玉露叢』は本郷五丁目、『柳営日次記』の抄録は六丁目と書きます。
      # fact: meireki-A04
      - 語り: 北西の風にあおられ、火は、飛び火を重ねました。湯島天神、神田明神、東本願寺。駿河台の大名屋敷を越えて、鎌倉がしへ進みます。
      # fact: meireki-A02, meireki-A04
      - 語り: この日の午後、風が西に変わります。すると、火は、日本橋、茅場町、八丁堀を越えました。
        tone: 重い
      # fact: meireki-A04
      - 語り: 霊巌島へ。さらに、船の火の粉で、佃島と石川島へ。隅田川を越えて、牛島新田まで、燃え広がります。
      # fact: meireki-A04
      - 語り: この火が鎮まったのは、翌19日の午前2時すぎ。出火から、およそ12時間でした。
        figure: {type: stats, title: 1月18日の火, items: [[出火, 午後2時ごろ, 本妙寺], [風向きが変わる, 同じ日の午後, 北西から西へ], [鎮まる, 翌19日 午前2時すぎ, 約12時間]], upto: 3}
      # fact: meireki-A24
      - 語り: 逃げる人の荷物が、道や空き地をふさぎ、消火の妨げになりました。火の粉や熱で荷物に火がつき、橋が焼け落ちて、川辺に追い詰められた人もいた、と国の報告書は書きます。
        tone: 重い
        figure: null
      # fact: meireki-A24
      - 語り: 幕府は、この大火のあと、荷物を車に積んで逃げることを、禁じました。
      - 語り: ところが、大火は、これで終わりではありませんでした。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 19日 二つの火と天守
  - title: 1月19日　二つの火と、天守
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-A01
      - 語り: 19日の午前、小石川の鷹匠町から、別の火が出ます。時刻は、内閣府の報告書の中でも、早朝と、午前10時ごろの、2とおりに書かれています。
        year: 1657
      # fact: meireki-A05
      - 語り: 火は、水戸藩の屋敷から、飯田町、市谷、番町へ。正午から午後1時にかけて、江戸城の天守に、燃え移りました。
        tone: 重い
      # fact: meireki-A07
      - 語り: 天守は、家光の代の1638年に、造られたものでした。宮内庁によれば、5層で、高さは、地上から58メートル。19年で、失われました。
      # fact: meireki-A05
      - 語り: 午後4時ごろには、常盤橋の内側の、大名屋敷が一斉に燃えます。同じころ、風が北から西へ変わり、江戸城の西の丸と、御三家の上屋敷は、焼け残りました。
      # fact: meireki-A06
      - 語り: その夜、3つ目の火が、麹町5丁目の町家から出ます。大名屋敷およそ50を焼き、桜田から芝浦の海辺まで進んで、鎮まりました。
        tone: 重い
      # fact: meireki-A08, meireki-A09
      - 語り: 江戸城は、西の丸を除いて焼けました。報告書や消防庁の解説が引く『武江年表』は、本丸、二の丸、三の丸、と伝えます。『明暦炎上記』は、大名屋敷160、旗本屋敷およそ810、橋60あまり、と数えます。
      # fact: meireki-A09, meireki-A10, meireki-C10
      - 語り: 町の数は、記録で、倍ほど違います。『明暦炎上記』は、800町あまり。『武江年表』は、400町です。数え方の違いかもしれませんが、記録は、明言していません。
        tone: 重い
      # fact: meireki-A09
      - 語り: 国の報告書は、江戸の市街地の、約6割が焼けた、と書いています。
      - 語り: では、この火で、何人が亡くなったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 数字の出どころ・回向院
  - title: 死者10万人の出どころ　3つの数
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: meireki-A11
      - 語り: 大火の死者は、よく、10万人と言われます。この数は、誰が、何に書いたのでしょう。
        tone: 重い
      # fact: meireki-A14, meireki-A11
      - 語り: 浅井了意の作とされる『むさしあぶみ』は、大火の4年後、1661年に出ました。報告書は、『本所回向院記』と『山鹿素行年譜』も、10万人台と整理します。
        figure: {type: stats, title: 死者の数は記録で3つに割れる, items: [[上杉年譜ほか, 3万7千余, 『明暦三丁酉日記』も同じ], [元延実録, 6万8千余, 6万3430＋漂着4654], [むさしあぶみほか, 10万台, 武江年表は10万7046]], upto: 3}
      # fact: meireki-A13
      - 語り: 斎藤月岑の『武江年表』は、焼死10万7046人、といへり、と書きます。自分で数えた数ではなく、言われている数、という書き方です。『玉露叢』にも、同じ数が出ます。
        figure: null
      # fact: meireki-A11
      - 語り: いっぽう、『上杉年譜』と『明暦三丁酉日記』などは、3万7000人あまり、と書きます。
        tone: 重い
      # fact: meireki-A12
      - 語り: その中間が、『元延実録』です。牛島新田に葬った、6万3430人あまりと、漂着した遺体4654人。合わせて、6万8000人あまりです。
      # fact: meireki-A12, meireki-C34
      - 語り: 内閣府の報告書は、この6万8000人あまりを、だいたいの実相を伝えているとみてよいのではないか、と書きます。3万7千と10万台の、ほぼ中間にあたる数です。
      - 語り: 3万7千か、6万8千か、10万か。どの数も、どう数えたのかは、はっきりしません。確かなのは、数万人の命が失われた、ということです。
        tone: しみじみ
        pause: 0.8
      # fact: meireki-A17
      - 語り: 幕府は、増上寺で法要を営ませ、費用に300両を出しました。『徳川実紀』によれば、将軍家綱の後見の保科正之が、道ばたの犠牲者を見て心を痛め、本所の牛島新田に集めて、葬らせました。
      # fact: meireki-A18
      - 語り: 埋葬の地は、50間、およそ92メートル四方。2月26日から7日のあいだ、千部の経が、読まれました。宗派がまちまちだったため、寺の名は、諸宗山無縁寺、回向院といいます。
      # fact: meireki-A19
      - 語り: 回向院には、大火の18年後、1675年ごろにつくられた供養塔が、残っています。刻まれた言葉は、火や水で亡くなった、すべての魂のため、1万日の念仏を修する、という趣旨です。死者の数は、書かれていません。
        tone: しみじみ
      # fact: meireki-A20
      - 語り: 毎月の18日と19日には、江戸の人々が、参って念仏を唱えるようになった、と伝わります。
      - 語り: 死者の数のほかに、この大火には、確かめにくい話が、もう1つあります。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 火元と振袖火事
  - title: 火元と「振袖火事」　確かな所と伝説
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: meireki-B12
      - 語り: 振袖火事。広く知られた筋は、こうです。恋に焦がれて、17歳で亡くなった娘の振袖が、寺に納められ、古着屋を通って、翌年も、その翌年も、同じ年ごろの娘の棺にかかった、と。
      # fact: meireki-B12
      - 語り: 3人の娘の親は、本妙寺で、供養をします。1月18日、住職が振袖を炎に投げ込むと、竜巻のような風が吹き、振袖が舞い上がって、本堂に燃え移った。これが大火の始まりだ、という筋です。
      # fact: meireki-B11
      - 語り: 国の報告書は、はっきり書いています。この話は、当時の火災の記録に出てこず、事実とは異なる、と。
        tone: 重い
      # fact: meireki-B19, meireki-B05
      - 語り: 確認できた範囲では、『むさしあぶみ』にも、『武江年表』にも、振袖の話は、載っていません。『武江年表』は、出火の原因には、触れていません。
      # fact: meireki-B17
      - 語り: 大火の当時の呼び名は、丸山火事、丁酉の火事などです。振袖火事と呼んだ例は、確かめた範囲では、見当たりません。
      # fact: meireki-B16
      - 語り: 「振袖」の名の、報告書が挙げる古い例は、1848年刊の災害番付『泰平無疆』です。江戸振袖大火、とあります。大火の191年あとです。
        tone: 重い
      # fact: meireki-B14
      - 語り: 話の筋の元になる形が見つかった、確認できている最古の文献は、1854年から刊行の長編小説、『黄金水大尽盃』。2021年、岩本馨の研究で見つかりました。寺の名は、金妙寺と、伏せてあります。
      # fact: meireki-B15
      - 語り: 確認できる範囲で、寺の名を、本妙寺と、はっきり書いたものは、1884年の『長者鑑紀文実伝』です。丸山火事、一名、振袖火事、という言い方も、出てきます。大火の227年あとです。
      # fact: meireki-B18
      - 語り: 黒板勝美は、1908年の本に、俗に振袖火事と称せらるるもの、と書きました。矢田挿雲が新聞に連載した、『江戸から東京へ』は、1920年からです。その前から、広まっていた、と書評は見ます。
      # fact: meireki-B13
      - 語り: 話は、版によって、違います。娘の名も、年も、店の名も、振袖の来歴も、一定しません。
        tone: 重い
      # fact: meireki-B20
      - 語り: ただ、大火の前に、江戸で「柴垣節」という歌が流行していたことは、確かです。内閣府の報告書は、これが、振袖伝説が生まれる素地になったかもしれない、と見ています。あくまで、推測です。
        tone: しみじみ
        pause: 0.5
      # fact: meireki-B21, meireki-B22
      - 語り: 本妙寺は、大火で焼けましたが、3年後の1660年に客殿と庫裏、6年後の1663年に本堂が、建ちました。公式サイトは、振袖火事は後世の伝承で、火元が本妙寺だったことには、不審が多い、と自ら書いています。
      # fact: meireki-B24, meireki-B22
      - 語り: 火元は、老中・阿部忠秋の屋敷で、本妙寺が、引き受けたのだ、という説もあります。根拠に挙がるのは、本妙寺が、とがめられず、のちに、触頭にまでなったことです。同時代の記録に、そう書いたものは、確認した範囲では、見つかっていません。
        tone: 重い
      # fact: meireki-B25
      - 語り: 当時の世間には、別のうわさもありました。『玉露叢』は、慶安の変の残党が、火札を立てて、風を待って火をつけたのではないか、といううわさを書きます。
      - 語り: 言えるのは、ここまでです。記録が書く火元は、本妙寺。出火の原因は、分かっていません。
        tone: しみじみ
      - 語り: では、火が消えたあと、江戸の人々は、どう生き延びたのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 救う
  - title: 1657年1月　粥と米の値　焼け出された人々に
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-C08
      - 語り: 幕府は、火が消えた直後、1月21日から、粥の施行を始めます。江戸の6か所に、仮小屋を建て、浅草の米蔵から、1日1000俵の米を出しました。
        year: 1657
      # fact: meireki-C08
      - 語り: 予定は、9日間でした。けれど、飢えた人が多く、2月2日まで延ばし、そのあとは1日おきで、2月12日に終えます。出した米は、合計6000石。およそ900トンです。
      # fact: meireki-C09
      - 語り: 米の値は、1両で2斗しか買えないところまで、跳ね上がっていました。幕府は、1両で7斗を下回るような高値で、売ってはならない、と触れます。実勢の、3.5倍の量です。
        tone: 重い
        figure: {type: stats, title: 米の値（1両で買える量）, items: [[大火の直後, 2斗, 約30kg], [幕府の基準, 7斗, 約105kg], [八丁堀の安売り, 8斗, 紀州藩の米1000俵]], upto: 3}
      # fact: meireki-C13
      - 語り: ところが、江戸城の金蔵は、焼けていました。幕府は、大坂と二条の城の備えの銀を、江戸へ取り寄せます。2月19日、4月21日、6月25日の日付で、それぞれ白銀1万貫目です。
        figure: null
      # fact: meireki-C10
      - 語り: 焼けた町の、家持の町人には、金が下されました。『玉露叢』によれば、銀1万貫目、小判にして16万両。焼けた町の間口、1間あたり、金3両1分と、銀6匁8分です。
        tone: 重い
      # fact: meireki-C11
      - 語り: ところが、この額も、記録で割れます。『明暦日記』は、15万両。『玉露叢』などは、16万両。『後見草』は、間口1間あたり、金5両です。
        figure: {type: stats, title: 町人への下賜金は記録で割れる, items: [[明暦日記, 15万両, 2月10日の条], [玉露叢ほか, 16万両, 銀1万貫目], [後見草, 1間に5両, 額が別の形]], upto: 3}
      # fact: meireki-C11
      - 語り: 15万両と16万両の差は、換算の違いかもしれません。金1両を銀65匁とする、『曽我日記』の書式で数えると、1万貫目は、およそ15万4千両です。
        figure: null
      # fact: meireki-C12
      - 語り: 武家への助けは、身分で差がつきました。旗本や御家人は、100石で15両。1000石で100両。1万石以上の大名には、銀100貫目を貸し、翌年から10年で返させます。
      # fact: meireki-C14
      - 語り: 役人が、官庫が空になりかねない、と心配したとき、保科正之は、こう答えた、と寛政重脩諸家譜は書きます。官庫の蓄積は、これらの用にあてるためだ。賜らないのなら、貯えないほうがよい、と。
        tone: 重い
      # fact: meireki-C18
      - 語り: ただし、助けは、行き渡ったとは言えません。大火のあとには、雪もふり、凍死者が、大勢出ました。国の報告書は、一般の庶民への援助は、後手に回ることが多かった、と総括します。
        tone: 重い
      - 語り: もう1つ、立て直さなければならないものが、ありました。城です。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 天守台のあとの天守
  - title: 石垣の土台だけが残った　天守を建てない決定
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-A23, meireki-C35
      - 語り: 江戸城の再建は、諸大名に、普請役を命じて進みました。石垣は、1万石ごとに、人夫100人。本丸の御殿は、宇和島藩の伊達宗利など、10大名の受け持ちです。
      # fact: meireki-C06
      - 語り: 本丸の殿舎ができたのは、万治2年、1659年の8月3日。9月5日に、将軍家綱が、西の丸から移りました。費用は、金93万4千両あまり、米6万7千石あまりです。
        year: 1659
        tone: 重い
      # fact: meireki-C04
      - 語り: では、天守は。先にできていたのが、石垣の土台、天守台です。加賀藩の前田綱紀が、命じられたのは、1657年の9月27日。着工は、翌年の5月4日。万治元年の10月9日には、石垣が成って、褒美が出ています。
        year: 1658
      # fact: meireki-C01, meireki-C04
      - 語り: ところが、土台ができてから、およそ11か月のち。老中たちが、天守も造ろうと、相談した席で、保科正之が反対します。天守は、沙汰やみになりました。記録では、万治2年の、9月1日の条です。
        year: 1659
        tone: 重い
        figure: {type: stats, title: 天守台から決定まで, items: [[大火, 1657年1月, 天守が焼失], [天守台の石垣が成る, 1658年10月, 前田綱紀], [天守を建てないと決まる, 1659年9月1日, 大火から2年7か月あまり]], upto: 3}
      # fact: meireki-C02
      - 語り: 『寛政重脩諸家譜』が伝える正之の言葉は、こうです。天守は近い世のもので、実は戦に役立たず、ただ遠くを見るためのものだ。そのために人の力を費やしてはならない、と。
        figure: null
        tone: 重い
      # fact: meireki-C03
      - 語り: 当時の記録の中に、違う理由を伝えるものがあります。武家も町家も、家を建てている最中に、幕府の工事が長引けば、下々の障りになる。国の財を費やす時節ではない、当分延期がよい、と。
      - 語り: 戦の役に立たない、というだけでは、ありません。武家も町の人も、家を建てている最中だ、という理由も、記録に入っています。
        tone: しみじみ
      # fact: meireki-A21
      - 語り: 天守台は、そのあとも、残りました。今も、皇居東御苑で、見ることができます。
        tone: しみじみ
        pause: 0.5
      - 語り: 天守のほかに、町は、どう変わったのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 町の変わり方
  - title: 広小路と火除地　町の変わり方
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1657
    lines:
      # fact: meireki-C19
      - 語り: 大火の9日後、1657年1月27日。幕府は、役人に、江戸の実地測量を命じます。縮尺3250分の1の絵図が、できました。13年後の『寛文図』の元になった、と報告書は書きます。
        year: 1657
      # fact: meireki-C20
      - 語り: 通りの幅は、広げられました。通りに、突き出していた庇を、切らせたのです。日本橋通は10間、およそ18メートル。本町通は7間。ほかの多くは、5間から6間でした。
      # fact: meireki-C21
      - 語り: 火を止めるための土手が、2つ築かれ、松が植えられました。火除けの空き地として、上野の広小路と、中橋の広小路が、新たに設けられます。
      # fact: meireki-C21
      - 語り: 神田連雀町の人々は、多摩郡の野方領へ移され、新しい村を開きました。今の三鷹市の、連雀です。
      # fact: meireki-C22
      - 語り: 御三家の城内の屋敷は、城の外へ出されます。尾張と紀伊は麹町、水戸は小石川に、屋敷地を得ました。あとの土地は、馬場や薬園になり、火を止める空き地となりました。
        tone: 重い
      # fact: meireki-C23
      - 語り: 武家屋敷の移動は、連鎖して広がりました。1661年までに、確認できる屋敷替えの対象は、1308人。築地では、御家人247人あまりが、埋め立てた土地へ移りました。
      # fact: meireki-C24
      - 語り: 寺も動きました。山王権現は赤坂へ、西本願寺は築地へ、東本願寺は浅草へ。吉祥寺は駒込へ移り、門前の人々は、今の武蔵野市に、吉祥寺村を開きました。
      # fact: meireki-C26
      - 語り: 隅田川には、1659年に、両国橋が架けられた、とされます。それまで、隅田川の橋は、千住大橋だけでした。橋の向こうの本所と深川には、このあと、人が移り住んでいきます。
        tone: しみじみ
      # fact: meireki-C29
      - 語り: 消防の仕組みも動きます。1658年9月、幕府は、旗本4人に、江戸中定火之番を命じました。旗本が受け持つ、幕府の消防隊で、定火消と呼ばれます。4組は、1662年に、10組となります。
      # fact: meireki-C30
      - 語り: 町人の側でも、同じ年の8月に、南伝馬町など17町ほどが、167人の人足の組を作りました。ただし、報告書は、町人の防災が本格化するのは、ずっとあと、と評します。
      # fact: meireki-C25
      - 語り: では、ここまでの変化は、すべて、大火が起こしたものなのでしょうか。
        tone: 疑問
        hook: true
      # fact: meireki-A27
      - 語り: 御三家の屋敷を、外へ出す動きは、大火の前から、ありました。寺や社の移転も、1600年代の前半から、続いていたといいます。2021年の研究が、そう指摘します。
      # fact: meireki-C25
      - 語り: 吉原を見てみます。のちの1725年に、新吉原の名主が出した書上によれば、移転の命令は、大火の前年、1656年の10月9日。町奉行が、年寄を呼んで、今の場所は御用地になる、と告げました。大火の3か月あまり前です。
        year: 1656
        tone: 重い
      # fact: meireki-C25
      - 語り: 大火で吉原も焼け、仮の小屋で商売したのち、浅草の日本堤の、新吉原で商売を始めます。始まりは、記録で、5月とも、8月とも割れます。ただ、移転が決まったのは、火事の前でした。
      # fact: meireki-C31
      - 語り: 瓦や土蔵造りを、奨励したのも、大火の直後と、思われがちです。ところが、国の報告書によれば、1660年のころの町触は、茅葺きなどを禁じて、塗屋を勧めた一方、町家の屋根の瓦は、認めていませんでした。瓦を勝手次第としたのは、1720年の、大岡忠相の触です。63年あとです。
        tone: 重い
      # fact: meireki-C30
      - 語り: 町火消ができるのも、1718年。大火から61年あとです。
      # fact: meireki-C16
      - 語り: 大名の多くは、帰国を許されました。江戸の人を減らして、米の値を下げるためです。参勤交代を止めた、という記録は、確かめられません。
        tone: 疑問
      # fact: meireki-C16
      - 語り: この帰国を言い出したのは、誰か。『寛政重脩諸家譜』は、正之が老中と図った、と書きます。『徳川実紀』の別の記事では、徳川頼宣が、信綱1人で決めてよいのか、と責め、信綱が、後の咎は自分1人の落度にする覚悟だった、と答えます。決め手の書き方が、記録で分かれます。
        figure: null
      - 語り: 町は、変わりました。けれど、変わりは、一夜のものではなく、大火のあと何年もかけた、積み重ねでした。
        tone: しみじみ
      - 語り: では、研究は、この大火を、どう見ているのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第8章 変えたのか
  - title: 大火は江戸を作り替えたのか　報告書と問い直し
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: meireki-C32
      - 語り: 内閣府の調査会は、2004年に、報告書をまとめました。主査は、弘前大学の長谷川成一。報告書は、こう締めくくります。近世・近代の都市は、防災に無防備な都市として出発し、深刻な災害を経て、対処療法として、都市改造や防災対策が、とられてきた、と。
        tone: 重い
      # fact: meireki-C32
      - 語り: 大火のあとの対策として、報告書が挙げるのは、武家屋敷の移転と延焼を防ぐ帯、寺社の移動、道路の拡張、火除地、広小路、防火の土手です。
      # fact: meireki-A27, meireki-B29
      - 語り: 2021年には、岩本馨が、『明暦の大火「都市改造」という神話』を出しました。大火が江戸を一変させた、という通説を、疑う本です。
      # fact: meireki-A27
      - 語り: 書評によれば、大名屋敷の多くは、もとの土地に、建て直されました。
        tone: 重い
      # fact: meireki-B29
      - 語り: この本は、建築史学会賞を受けました。大火のあとの変化の多くは、寛永のころや、大火の数年前から始まっていた動きの、続きだった、という見方です。
      # fact: meireki-C35
      - 語り: 江戸城の本丸の御殿も、基本の造りは、大火の前と変わりませんでした。違いは、表と大奥をつなぐ廊下が、2本になったことぐらいだ、と報告書は書きます。
        tone: しみじみ
      - 語り: 大火は、すべてを作り替えたわけではありません。動いていた流れを、速めた面が、ありました。
        tone: しみじみ
        pause: 0.8
      - 語り: では、結局、大火は、江戸の何を変えたと言えるのでしょうか。
        tone: 疑問
        hook: true

  - title: まとめ：明暦の大火は、江戸の何を変えたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: meireki-C01, meireki-C32
      - 語り: 答えを、分けます。大火が変えたのは、天守のない城、広小路と火除地、定火消、両国橋でした。
