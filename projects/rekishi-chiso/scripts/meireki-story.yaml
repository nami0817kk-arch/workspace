# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸城の天守を、もう建てない。幕府がそう決めたのは、燃えた日ではありません。明暦の大火から、2年7か月あまりあとでした。
  国の報告書は、大火で江戸の市街地の約6割が焼けたと書き、死者は10万人と伝わります。けれど記録を開くと、死者の数は3万7千、6万8千、10万7千と、3つに割れます。有名な「振袖火事」の話も、当時の記録には出てきません。
  大火は江戸の何を変えたのか。そして、何は大火の前から決まっていたのか。記録をたどりました。
  この動画でわかること
  ・死者の数が、記録によって3つに割れる理由
  ・火元と「振袖火事」の話で、確かめられることと、確かめにくいこと
  ・町人に下された金の額が、記録で割れる理由
  ・天守台が先にできて、天守が建たなかった経緯
  ・大火の前に決まっていたことと、60年あとになったこと
description_note: |-
  日付は旧暦のまま（西暦への換算は、1657年1月18日＝3月2日を内閣府の報告書が併記しているものだけ）です。年数は、記録の年を並べて自分で数えました。旧暦の月数のため、日数にずれが出ることがあります。
  死者の数・町の数・下賜金の額は、記録ごとに違います。動画ではそれぞれの数を並べました。振袖の話の「最古」は、2021年の研究が見つけた範囲での最古です。
  経過と数字は、内閣府の報告書「1657 明暦の江戸大火」（2004）、『東京市史稿』『寛政重脩諸家譜』『玉露叢』『武江年表』の全文テキストなどで確かめました。『武江年表』『むさしあぶみ』の一部は、報告書などの引用から確かめたものです。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。人の顔は描いていません。サムネイルの絵も、AI による想像図です。

en:
  title: "What Did the Great Fire of Meireki Change in Edo? The '100,000 Dead' and the Unbuilt Keep"
  description: |-
    The shogunate decided not to rebuild the keep of Edo Castle. Not on the day it burned, but two years and seven months after the Great Fire of Meireki (1657).
    The fire burned about 60 percent of the city, and the death toll is said to be 100,000. Yet the records give three different figures: 37,000, 68,000 and 107,000. The famous "furisode fire" story does not appear in the records of the time.
    What did the fire change in Edo, and what had already been decided before it? We follow the records.
    In this video you will learn:
    - Why the records give three different death tolls
    - What can and cannot be confirmed about the fire's origin and the furisode story
    - Why the records differ on the money given to townspeople
    - How the keep's stone base was built first, and the keep never was
    - What was decided before the fire, and what came half a century later
    Dates are in the old calendar. Year spans are our own counts. Scene images are AI-generated illustrations, not real photos, and show no faces. Japanese-language history video (Japanese audio).
  chapters:
    - "The Keep That Was Never Rebuilt"
    - "January 18: A Fire From Hongo"
    - "January 19: Two More Fires and the Keep"
    - "Where Does 100,000 Come From?"
    - "The Origin of the Fire and the Furisode Story"
    - "Rescue: Rice Porridge, Prices and Money"
    - "A Stone Base Without a Keep"
    - "How the Town Changed"
    - "Did the Fire Remake Edo?"
    - "Summary: What the Fire Changed"

