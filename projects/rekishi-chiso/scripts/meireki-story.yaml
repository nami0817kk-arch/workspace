# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。明暦の大火（1657年）は、江戸の何を変えたのか。2026-11-15 作成。公開の予定は 11/19 12:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の A その後型（江戸・日本）。主役は人でなく出来事（都市＝江戸）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「大火は江戸を『作り替えた』と語られるが、何を変え、何は大火の前から決まっていたのか」。答えの席は題名に残す（天守を建てないと決まった「時期」・死者10万人の出どころ）。
#   冒頭＝①天守を建てないと決まったのは燃えた日ではなく2年7か月あと＋天守台の石垣が先にできていた ②死者は3万7千／6万8千／10万7千と3つに割れる ③振袖火事の話は当時の記録に無く、確かめられる最古の文章は197年後
#   型の作り：序章／第1章 18日 本郷から／第2章 19日 二つの火と天守／第3章 数字の出どころ・回向院／第4章 火元と振袖火事（確かな所と伝説を分ける）／第5章 救う（粥・米価・下賜金）／
#   第6章 天守台のあとの天守／第7章 町の変わり方（大火の前に決まっていたもの・半世紀あとのもの）／第8章 変えたのか（内閣府の報告書と2021年の問い直し）／まとめ。
# 記録の食い違いは5つ（誰のどの記録が何と書くか）：①焼けた町の数（明暦炎上記800町余／武江年表400町） ②死者数（上杉年譜ほか3万7千／元延実録6万8千／むさしあぶみほか10万台・武江年表10万7046） ③振袖の娘の名・年（版で違う）
#   ④町人への下賜金（明暦日記15万両／玉露叢16万両／後見草は間口1間に5両） ⑤大名を帰国させた発案者（寛政譜は正之／厳有院殿御実紀は信綱）。ほか町の名（四・五・六丁目）。
# 計算（自分で計算し直した）：1638→1657＝19年（天守の寿命）／1657-01-18（旧暦）＝1657-03-02／14時→翌2時＝12時間／明暦3年1月19日→万治2年9月1日＝2年7か月あまり（旧暦の月数）／
#   万治元年10月9日（天守台の石垣が成る・褒美）→万治2年9月1日＝およそ11か月（閏月を数えた実経過）／1661−1657＝4年（むさしあぶみ）／1675−1657＝18年（供養塔）／63,430＋4,654＝68,084／
#   1854−1657＝197年（振袖の話の最古）／1848−1657＝191年（番付）／1884−1657＝227年／1920−1657＝263年／1657→1660（本妙寺の客殿）＝3年、→1663（本堂）＝6年／1658→1923＝265年は使わない／
#   銀1万貫目＝16万両／4万8,000間（片町で800町・両側町で400町）／3両1分×4万8,000間＝15万6,000両／米価 1両2斗→基準7斗（3.5倍）／
#   明暦2年10月9日（吉原の移転命令）→明暦3年1月18日＝約3か月余前／1720−1657＝63年（瓦・土蔵造りの勝手次第）／1718−1657＝61年（町火消）／1659−1657＝2年（両国橋）／1658−1657＝1年（定火消、9月）／
#   10組になるのは寛文2年＝1662−1657＝5年。
# 事実は事実カード（dev/output/rekishi-chiso/research/明暦の大火_facts_20261115.yaml、meireki-A01〜／B01〜／C01〜）にあるものだけ。行の上に `# fact: meireki-xx`。
#   使わないこと：死者10万8千・18万7046・万人塚に10万人を葬った・むさしあぶみの浅草2万3千・霊巌寺の9,600人・振袖の毎年の供養法要・「幕府の命で火元を引き受けた」・阿部邸が真の火元（そう言う説がある、止まり）・幕府放火説（事実として）・
#   瓦・土蔵造りの奨励を大火の直後のことにすること・参勤交代の停止・御救小屋の語・延長5.3km・江戸の6〜7割焼失（報告書は約60%）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
