# 物語型の本編のひな形（2026-10-22 新規）。本編を「人の運命と感情が軸の物語」に作り替える決定（ユーザー 10-22）に合わせたもの。
# 新しい回はこれを scripts/<題材>.yaml に写す。画面の道具・サムネ・ショート・next などの書き方は scripts/_template.yaml と同じ
# （この文書は物語型で違う所だけを書く）。全部の道具の見本は scripts/_showcase.yaml、決まりの「なぜ」は CLAUDE.md の「2026-10-22 の見直し」。
#
# 流れ（上から順に埋める）
#   i)   語りは1人（剣崎）。聞き手（つむぎ）の行は無しか最小限：使うなら「章の終わりに1回」だけ。節の途中で掛け合いにしない
#   ii)  冒頭30秒（最初の約330字＝約1分に check の「冒頭：」が掛かる）は、次の【どちらか1つ】だけ。
#        ・意外な一点：誰でも知る場所・物・数字が、実は〜だった。  例「東京駅前のオフィス街は、400年前は海の底でした。」
#        ・感情の結末予告：誰が何を失い、どうなったか。          例「愛する娘を殺された男は、壮絶な復讐を誓った。」
#        やらない：未知の語から入る（人名・役職・用語を先に説明する）／「まずは4つ並べます」「問いは3つ」「今日は〜を掘ります」の予定の説明／
#        暦の説明（和暦と西暦のずれ）／「〜とは関係なく」「諸説あり」の断り／「今日の地表は」のような自作の比喩／日付と人名だけの1行目。
#        暦の断りは概要欄か中盤の章で。日付は当時のまま言ってよい
#   iii) 章立ては「1本に1つのなぜ」が軸：冒頭で謎（なぜ〜？）を1つ置く → 章ごとに理由を1つずつ → 最後の章でなぜの答え（結論）。
#        章（節）の題は【問い】か【人物の台詞】にする（概要欄の目次になるので年・人名・場面も入れる。check の「章の題に」が見る）
#   iv)  通説の検証は【中盤の1章】にまとめる（「語られてきた話は本当か」）。冒頭と終盤には置かない。
#        記録と後世の話を分ける言い方（「伝えられています」「記録には〜とあります」）はここで使う
#   v)   IF（B作品）も同じ：結末を先に予告（「もし〇〇していたら、〇〇は今の形になっていなかった」）→ 場面を物語で（「ここから想像」の札、
#        想像のセリフは B の決まりどおり）→ 史実との比較は中盤の章に。運命表・table の書き方は scripts/akechi-if.yaml
#   vi)  概要欄（description / describe）の頭は「物語の冒頭の数行（冒頭の台詞と同じ。結末は言わない）」＋「この動画でわかること」の箇条書き（3〜4個）。
#        台本の description_head: に書く（describe が概要欄の一番上に出す。10-24）。en.description の頭にも同じ形で書く
#
# check.episode を通した結果（確認済み）：× 0／「冒頭：」0／図は3つ入れてあり「!」なし。残るのは次の2つだけ（理由）
#   ・ショートの tease の語が本編に見当たらない：tease が「△△は誰のせい？」の仮の文言のため。実際の問いに書き換えれば消える
#   ・cli の check は絵の置き場（paintings/xxx.jpg など仮の名前）が無いと素材の × を出す（_template.yaml と同じ。実際の絵に替えたら消える）
#   語りだけの本は、剣崎の字数の割合（70%まで）の知らせを出さない（つむぎが全体の1割以下なら語り1人の物語型とみなす。chiso/check.py SOLO_SHARE）
# 決まり（check が止めるもの）：最初の行は剣崎（語り）／最後の節は「まとめ：…」／導入とまとめ以外の節は終わり2行に hook: true／thumbnail は必須。事実は出典を控える。
#   物語型は台本の一番上に story: true（10-24 ユーザー決定）。これで check が次のように見分ける（旧型の台本の決まりは変わらない）：
#   ・締めは剣崎の余韻の一文（冒頭の場面か問いに戻る）＋登録のお願いを短く。最後の行は剣崎。「今日の地層は、ここまでです」・二人「また一緒に、掘りましょう！」は使わない
#   ・次回予告はしない（next: を書かない。最後の12秒の予告画面も出ない）
#   ・台詞：記録の言葉は出どころを語りで言ってから `- 人物:`（who は roles の記録の声）。現代語にした所は「今の言葉にすると」と言う。
#     想像の台詞は入れてよい：1本8か所まで／記録と食い違わない／新しい事実（出来事・数字・理由）を足さない＝気持ち・決意の言葉だけ／人を貶めない。
#     書き方は who に roles の「〇〇想像」の声＋ imagined: true（字幕の上に小さく「想像」の札。メモ欄には積まない）。台本のコメントに【記録】／【想像】と、食い違わない記録を書く。
#     概要欄の断りは description_note: に（例「再現の場面の台詞の一部は、記録をもとにした想像です」）。概要欄の頭は description_head:（describe が一番上に出す）
#   見本は scripts/oichi-story.yaml（お市の方）。
# 読みの点検（kana → reading-ok → approve）も _template.yaml の頭のとおり。

story: true
title: 人物名｜ひとつのなぜ（名前を先頭に。毎回同じ形にしない。「〇〇は本当か」の型にもできる）
series: ""
playlists: [日本史を掘る（聞き流し）]
shorts_playlists: [日本史ショート]
tags: [人物名, 出来事の名]
en:
  title: "Name: ..."
  description: |-
    （物語の冒頭の数行。冒頭の台詞と同じ。結末は書かない）
    In this video you will learn:
    - ...
    - ...
    - ...
    Japanese-language history video to listen to while you work (Japanese audio).

texture: true
recap: true

timeline:
  start: 1530
  end: 1590
  events: [[1534, 誕生], [1560, 桶狭間], [1582, 本能寺]]

people:
  人物名: {born: 1534-06-23, died: 1582-06-21, match: [呼び名]}
terms:
  用語: 説明

description_head: |-
  （物語の冒頭の数行。冒頭の台詞と同じ。結末は書かない）
  この動画でわかること
  ・…
  ・…
  ・…
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころを語りで示してから読んでいます。

shorts:
  s1:
    title: "題の1行目／2行目"
    hook: "〇〇って／本当に××だったの？"
    tease: "じゃあ、／△△は誰のせい？"

# next: は書かない（物語型は次回予告をしない。10-24）

thumbnail:
  layout: face
  image: paintings/xxx.jpg
  crop: [0, 0, 1600, 900]
  name: 人物名
  lead: その人を一言で（白）
  main: 特大の語（黄）

sections:
  # 1) 導入：冒頭30秒（意外な一点か感情の結末予告のどちらか1つ）→ 本編の「なぜ」を1つ置く。段取りは言わない
  - title: 「なぜ、あの人は〇〇したのか」（本編の問い。年・人名を入れる）
    background: {image: paintings/xxx.jpg, credit: "画家《題》年"}
    year: 1582
    lines:
      # 1行目の例（どちらか1つ）：感情の結末予告「愛する娘を殺された男は、壮絶な復讐を誓った。」／意外な一点「東京駅前のオフィス街は、400年前は海の底でした。」
      - 語り: 愛する娘を殺された人物名は、壮絶な復讐を誓った。
        tone: 重い
        short: s1
      # 結末を少しだけ予告。未知の語は出さない。人名は主役の1人だけ
      - 語り: その復讐は、思いもよらない形で終わります。
        tone: 重い
      # ここで初めて場面へ。日付は当時のまま言う。暦の説明はしない
      - 語り: 1582年、人物名は〇〇でした。
        card: {head: "1582年6月", body: 場面を一言（22字まで）}
      # 「なぜ」は1本に1つ。予定の説明ではなく問いで締める
      - 語り: なぜ、人物名はそこまでしたのか。その答えは、最後に分かります。
        tone: 疑問
        hook: true

  # 2) 理由1：章の題は問いか台詞
  - title: 「どうして〇〇だったのか」（問いか台詞。1568年 人物名と場所、のように年・名前も）
    background: {image: paintings/zzz.jpg, credit: "…"}
    portrait: {image: paintings/yyy.jpg, caption: "人物名（画家画、年）"}
    lines:
      - 語り: 生まれ育ちから、感情の動きで語る。人の運命の分かれ目の場面を1つ、具体的に。
        figure: {type: bars, title: 題, bars: [[記録A, 1000], [記録B, 3000]], labels: [千ほど, 三千]}
      - 語り: 数字は「何の数か」を言う。《強調したい語》は二重山かっこで。
        figure: null
      - 語り: 節の終わり2行のどこかに、次が気になる一言（hook を true に）。
        hook: true
      - 聞き: （使うなら章の終わりに1回だけ。予想か置き換えを一言。無くてよい）
        tone: 疑問

  # 3) 理由2
  - title: 「それでも、引き返せなかった」（台詞でもよい）
    background: {image: paintings/zzz.jpg, credit: "…"}
    lines:
      - 語り: 理由の2つ目。手紙・最期の言葉など、本人の気持ちが分かる記録を1つ。
        figure: {type: stats, title: 数字で見る, items: [[生涯, 49年, 本能寺で], [元服, 13歳]]}
      - 人物: 「記録に残る本人の言葉（出どころは前の行の語りで言う）」
        who: 信長
      # 想像の台詞（1本8か所まで。気持ち・決意の言葉だけ。記録と食い違わない）
      - 人物: 「想像の台詞」
        who: 信長想像
        imagined: true
      - 語り: 次の章への引き。
        figure: null
        hook: true
      - 語り: 答えを先に言わない。
        hook: true

  # 4) 通説の検証：ここ1章だけ。「語られてきた話は本当か」を、記録と後世の話に分けて短く
  - title: 「語られてきた話は本当か」（通説の検証は中盤のこの1章にまとめる）
    background: {image: paintings/zzz.jpg, credit: "…"}
    lines:
      - 語り: よく聞く話は、記録では〇〇とあります。後の時代の本が〇〇と書きました。分かっていない所は「分かっていません」と言う。
        figure: {type: line, title: 題, points: [[1560年, 25], [1568年, 34], [1582年, 47]], unit: 歳}
      - 語り: 出典を1回は読み上げる。検証は短く、物語の流れに戻す。
        figure: null
        hook: true
      - 語り: 戻る一言。
        hook: true

  # 5) 理由3（山場）→ 答えにつながる場面
  - title: 「その朝、何が起きたのか」（山場の場面。年・名前を入れる）
    background: {image: paintings/xxx.jpg, credit: "画家《題》年"}
    lines:
      - 語り: 山場は場面で見せる。いつ・どこで・誰が・何を言ったか。
      - 語り: 答えの一歩手前で、章を終える。
        hook: true
      - 語り: ここで、冒頭の問いに戻る。
        hook: true

  # 6) 結論：冒頭の「なぜ」への答え。冒頭の台詞に戻る終わり方（余韻の一文）
  - title: まとめ：人物名はなぜ〇〇したのか
    lines:
      - 語り: 答え。冒頭の一文に戻る。「愛する娘を殺された男は、壮絶な復讐を誓った。その先にあったのは〜でした。」
        tone: しみじみ
      - 語り: 人柄が分かる場面（家族・手紙・最期の言葉）を1つ。要点を番号で並べない（講義にしない）。
        tone: しみじみ
      # 締め：余韻の一文（冒頭の場面か問いに戻る）＋登録のお願いを短く。最後の行は剣崎（10-24）
      - 語り: 余韻の一文。冒頭の場面に戻る。
        tone: しみじみ
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
