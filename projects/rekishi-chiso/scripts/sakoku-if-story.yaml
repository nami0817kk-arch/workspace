# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1673年の夏、長崎の港に、1隻のイギリス船が入りました。貿易を、もう一度させてほしい。幕府の答えは、断る、でした。理由の1つは、イギリス国王の結婚相手でした。
  しかもイギリスは、その50年前、自分から日本を去っていました。
  江戸幕府は、外国の船を、一度に締め出したのではありません。1624年にスペイン、1639年にポルトガル、1641年にオランダを出島へ。
  もしも、そのどこかで、幕府が別の道を選んでいたら、日本はどうなっていたのでしょうか。
  この動画でわかること
  ・家康がメキシコとの商いのために貸した船が、返ってこなかったこと
  ・ポルトガル船を止める前、マカオとマニラが「宣教師を渡さない」と誓う書付を作っていたこと
  ・平戸のオランダの倉庫が、刻まれた年を理由に壊されたこと（その年は資料で食い違う）
  ・1673年のリターン号が断られた理由と、ある歴史家の「もしも」
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（スペイン総督シルバの書簡、箭内健次の論文に翻刻された陳情書と「異国天川よりの誓の書付」、禁令の本文、コレアの記録、大英図書館の目録、御宿町・南島原市・平戸市・長崎市・国立国会図書館・文化遺産オンラインの公開資料、Borao・Kawamura・Bravo・Schreurs・Cullen の論文、ブリタニカ・Indian Antiquary など）を語りで示してから、今の言葉にして読んでいます。
  原城に籠った人数、1647年の警備の人数、平戸の倉庫に刻まれた年は、資料によって違います。『徳川実紀』の人数は引用で確かめたもので、原文は確かめられていません。日数・年数は自分で計算し直したものです。リターン号の日付はイギリス側の日記の日付です。
  鎖国しなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、画像生成AIで作った想像上の風景です。サムネイルの風景は、画像生成AIによる想像図です。

en:
  title: "What If Edo Japan Had Never Closed Its Doors? Three Turning Points, 1624-1641"
  description: |-
    In the summer of 1673, an English ship entered Nagasaki asking to trade again. The shogunate refused. One reason given was whom the English king had married.
    Fifty years earlier, the English had left Japan of their own accord.
    The shogunate did not shut out foreign ships all at once: Spain in 1624, Portugal in 1639, and the Dutch moved to Dejima in 1641.
    If the shogunate had chosen differently at any of these points, what would have happened to Japan?
    In this video you will learn:
    - How a ship Ieyasu lent for trade with Mexico was never returned
    - How Macao and Manila swore not to send missionaries before the Portuguese were banned
    - Why the Dutch warehouse at Hirado was torn down, and why the year carved on it differs between sources
    - Why the Return was refused in 1673, and one historian's "what if"
    Japanese-language history video (Japanese audio). The parts that begin with "what if" are reasoning, not records.
  chapters:
    - "The Ship That Came Back After Fifty Years"
    - "Ieyasu's Pacific Dream"
    - "Turning Point 1: Refusing Spain"
    - "Turning Point 2: Stopping the Portuguese Ships"
    - "Turning Point 3: Moving the Dutch to Dejima"
    - "The Return, 1673"
    - "Summary: If Edo Japan Had Never Closed Its Doors"

