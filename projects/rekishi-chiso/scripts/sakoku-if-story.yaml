  # サムネは別に作る（Gemini の絵に字を載せた1枚。out/sakoku-if-story_thumbnail.png）。ここは check のための仮。

sections:
  # ================================================================ 序章
  - title: 「50年後の船」　1673年
    lines:
      # fact: sakokuif-42, sakokuif-43
      - 語り: 国王の結婚相手が理由で、追い返された船があります。1673年の夏、長崎に入った、イギリスの船です。イギリス国王の妻は、ポルトガルの王女でした。
        tone: 重い
        card: {head: "1673年", body: イギリス船、長崎へ}
      # fact: sakokuif-40
      - 語り: しかもイギリスは、そのおよそ50年前、自分から日本を去っていました。
        card: {head: "およそ50年前", body: イギリス、平戸から自分で去る}
      # fact: sakokuif-01, sakokuif-15, sakokuif-35
      - 語り: 幕府が外国の船を締め出し、囲い込んだのは、一度ではありません。1624年にスペイン、1639年にポルトガル、そして1641年に、オランダを長崎の出島へ。3回に分けてです。
      - 語り: もしも、そのどこかで、幕府が別の道を選んでいたら。日本は、どうなっていたのか。
        tone: 疑問
      - 語り: 3つの分かれ目をたどると、最後に、ある歴史家が出した、意外な答えに、たどり着きます。
      - 語り: 最初の分かれ目の前に、家康が夢見た、海の向こうの商いがありました。
        hook: true
      - 語り: 始まりは、1609年の秋、房総の海で起きた、1隻の船の遭難です。
        hook: true

  # ================================================================ 第1章 家康が夢見た太平洋
  - title: 「家康が夢見た太平洋」　1609年から1623年
    year: 1609
    lines:
      # fact: sakokuif-05
      - 語り: 1609年9月30日の夜。スペインの大型の帆船、サン・フランシスコ号が、今の千葉県御宿町の沖で、座礁しました。フィリピンのマニラから、メキシコへ向かう途中でした。
        card: {head: "1609年9月30日", body: スペインの船、御宿の沖で座礁}
      # fact: sakokuif-05
      - 語り: 乗っていたのは、前のフィリピン臨時総督、ロドリゴ・デ・ビベロです。御宿町の資料では、乗員373人のうち、317人が、岩和田の村人に助けられました。
      # fact: sakokuif-06
      - 語り: 家康は、帰国するビベロに、船とお金を貸します。イギリス人ウィリアム・アダムスが造った西洋式の帆船と、スペインの金貨で4,000ドゥカドです。
      # fact: sakokuif-07
      - 語り: 1610年8月1日、その船は浦賀を出ます。京都の商人、田中勝介ら、20人あまりの日本人が乗っていました。
        card: {head: "1610年8月1日", body: 田中勝介ら、浦賀からメキシコへ}
      # fact: sakokuif-07
      - 語り: 太平洋を渡り、アメリカ大陸に着いた、最初の日本人だった、と神田外語大学のブラボさんは、2014年の論文に書きます。
      # fact: sakokuif-06
      - 語り: ところが、メキシコの側は、その船を、返さないと決めました。値を、7,000ドゥカドと見積もった、とブラボさんは書いています。
        tone: 疑問
      # fact: sakokuif-08
      - 語り: 1611年、返礼の大使、ビスカイノが来日します。目的は、もう1つありました。日本の東の海にあると信じられた、金の島と銀の島を、探すことです。
      # fact: sakokuif-08
      - 語り: 浦賀から東へ、約600マイルにあるはずの島を、ビスカイノは探しに出ましたが、見つかりませんでした。
      # fact: sakokuif-09, sakokuif-04
      - 語り: 1613年には、伊達政宗の使節、支倉常長たちが、約180人で海を渡ります。この使節を仕立てた宣教師ソテロは、のちに、思わぬ形で、もう一度出てきます。
      # fact: sakokuif-11
      - 語り: 日本からも、朱印船と呼ばれる船が、南の海へ出ていました。1604年から1635年までに、356隻と数えられています。
      # fact: sakokuif-10
      - 語り: スペインの研究者ボラオさんの論文によると、マニラの日本人は、1615年に約1,500人、1619年に約2,000人。
        card: {head: "1619年", body: マニラの日本人、約2,000人}
      # fact: sakokuif-10
      - 語り: 1620年、マニラの総督は、日本人を3千人より多くしない、と定めました。それでも、1623年の末には、3,000人を超えていました。
        card: {head: "1623年末", body: マニラの日本人、3,000人を超える}
      # fact: sakokuif-10
      - 語り: ボラオさんによると、その半分は、キリシタンでした。
      - 語り: そのマニラから、1623年、新しい使節が、日本へ向かいます。
        hook: true
      - 語り: ボラオさんが、最後の使節と呼ぶ一行です。
        hook: true

  # ================================================================ 第2章 分岐1 スペインを断る
  - title: 「分岐1 スペインを断らなかったら」　1623年から1635年
    year: 1623
    lines:
      # fact: sakokuif-02
      - 語り: 1623年、フィリピン総督ファハルドは、日本へ使節を送りました。新しい国王、フェリペ4世の即位を知らせ、通商の取り決めを結ぶためです。
        card: {head: "1623年", body: スペイン、最後の使節}
      # fact: sakokuif-02
      - 語り: 一行は、薩摩で待たされます。1624年、告げられた答えは、会わない。通商を口実に、キリスト教が広まるのを望まない、というものでした。
        tone: 重い
        card: {head: "1624年", body: 幕府、使節に会わず}
      # fact: sakokuif-01
      - 語り: ボラオさんは、これを、日本にいたスペイン人の、正式な追放と書きます。日本では、スペイン船の来航の禁止、と呼ばれる出来事です。
      # fact: sakokuif-03
      - 語り: 次の総督シルバは、1625年8月4日付の、国王あての手紙で嘆きます。使節は、大きな費用をかけたのに、受け取ってもらえずに戻った。
      # fact: sakokuif-03
      - 語り: 同じ手紙には、こうもあります。オランダ人が、スペインは宗教を口実に国を奪いに来る、と将軍に吹き込んだ。
        tone: 疑問
      # fact: sakokuif-04
      - 語り: 同じ1624年、あの支倉の使節を仕立てた宣教師、ルイス・ソテロが、大村で処刑されます。1622年に、マニラから薩摩へ潜り込もうとして、捕まっていました。
        tone: 重い
      # fact: sakokuif-12
      - 語り: それでも、商いの船は、すぐには止まりません。オビエド大学のカワムラ・ヤヨイさんの2024年の論文によると、日本から来る船は、その後もマニラに着き続けました。
      # fact: sakokuif-12
      - 語り: 1634年まで、鉄や銅、火薬、小麦粉を、運んだそうです。
      # fact: sakokuif-13
      - 語り: 1628年には、スペインの艦隊が、シャムで、長崎の高木作右衛門の朱印船を焼きました。
      # fact: sakokuif-13
      - 語り: 1630年、長崎奉行と薩摩の使者が、抗議にマニラへ来ます。スペイン側は、本当の狙いは、島を探って、仕返しをすることだ、と見ていました。
        card: {head: "1630年", body: 日本の使者、マニラへ}
      # fact: sakokuif-13
      - 語り: 御宿町の年表によると、同じ年、島原の大名、松倉重政も、船をフィリピンへ出し、家臣に、様子を探らせています。
      # fact: sakokuif-14
      - 語り: そして1635年、日本人が海外へ出ることも、海外の日本人が帰ってくることも、禁じられました。朱印船の時代は、ここで終わります。
        card: {head: "1635年", body: 日本人の海外渡航を禁止}
      - 語り: 1つ目の分かれ目は、1624年のスペインです。手がかりは、2つあります。
        tone: 疑問
      # fact: sakokuif-06, sakokuif-08
      - 語り: 1つは、家康が望んだメキシコとの商いが、思うように進んでいなかったことです。貸した船は返らず、返礼に来たビスカイノの大きな目的は、金銀の島探しでした。
      # fact: sakokuif-02, sakokuif-04
      - 語り: もう1つは、使節を断った理由です。記録が挙げるのは、商いと一緒に来る、キリスト教。断交の2年前にも、宣教師が、マニラから薩摩へ、潜り込もうとしていました。
      - 語り: ここからは、もしもの話です。もしも1624年、幕府がスペインの使節に会い、取り引きを続けていたら。
        tone: 疑問
      # fact: sakokuif-12, sakokuif-13
      - 語り: 思い出してください。使節を断ったあとも、日本の船は、マニラに通い続けていました。そして1628年には朱印船が焼かれ、1630年には、日本の側がフィリピンを探らせ、スペインは、日本の使者を、仕返しの下見と疑っています。
        tone: しみじみ
      # fact: sakokuif-10
      - 語り: マニラの総督も、日本人を3,000人までに抑えようとしていました。警戒していたのは、日本の側だけではありません。取り引きが続いても、その先にあったのは、豊かな日本人町より、争いだったかもしれません。
        tone: しみじみ
      - 語り: もしもの話は、ここまでです。
      - 語り: スペインが去ったあと、日本へ生糸を運ぶ大きな担い手は、ポルトガルの船でした。
        hook: true
      - 語り: その船を止めたとき、マカオでは、何が起きたのか。
        hook: true

  # ================================================================ 第3章 分岐2 ポルトガル船を止める
  - title: 「分岐2 ポルトガル船を止めなかったら」　1604年から1647年
    year: 1604
    lines:
      # fact: sakokuif-21
      - 語り: 九州大学の箭内健次さんが、1956年の論文に書いています。1604年、家康の命で、堺の主な商人10人が長崎へ行き、ポルトガル船が運んだ中国の上等な生糸を、まとめて買い取りました。
        card: {head: "1604年", body: 糸割符の始まり}
      # fact: sakokuif-21
      - 語り: 決まった商人がまとめて買う、糸割符という仕組みの始まりです。
      # fact: sakokuif-20
      - 語り: 島根県の石見銀山の資料にある表では、16世紀、中国の広東で80両の生糸が、日本では、140両から150両で売れました。
      # fact: sakokuif-19
      - 語り: 2017年に一橋大学の研究所が出した論文によると、1618年からの16年間に、マカオから日本へ来た小型の帆船は、計69隻。
        card: {head: "1618年から16年", body: マカオの小型船、計69隻}
      # fact: sakokuif-19
      - 語り: 1634年から38年の5年は、取り引きの額が、銀にして、年平均58トンでした。
      # fact: sakokuif-22
      - 語り: 1637年、島原と天草で一揆が起き、原城に人々がこもります。その数は、記録で違います。南島原市は、およそ3万7千人。
        tone: 疑問
        card: {head: "1637年", body: 島原・天草一揆}
      # fact: sakokuif-22
      - 語り: ポルトガル人コレアが、1643年にリスボンで出した記録は、捕虜の話として、3万人以上と書き、城で亡くなった数を、3万5千、あるいは3万7千とします。
      # fact: sakokuif-23
      - 語り: この城を、海から撃った船があります。ブリタニカ国際大百科事典によると、平戸のオランダ商館長クーケバッケルは、幕府に大砲と火薬を出し、自分もオランダの船に乗って、原城を砲撃しました。
      # fact: sakokuif-15, sakokuif-16
      - 語り: 1639年、幕府は、ポルトガル船の来航を禁じます。禁令の言葉は、自今以後、かれうた渡海の儀、停止せられおわんぬ。かれうたとは、ポルトガルの小型船のことです。
        card: {head: "1639年", body: ポルトガル船の来航を禁止}
      # fact: sakokuif-18
      - 語り: 翌年の使節が出した陳情書によると、この年に来ていたマカオの船2隻は、商いを許されず、荷を積んだまま追い返され、マカオへ帰り着きました。
      # fact: sakokuif-29
      - 語り: マカオ側の通史によると、マカオの役所は、その前の年、日本の商人から、銀9万7千両を借りていました。
        tone: 疑問
      # fact: sakokuif-25
      - 語り: マカオは、使節を出す前に、マニラと、ある書付を作っていました。今後は、宣教師を日本へ渡さない、という誓いです。
      # fact: sakokuif-25
      - 語り: 熊本の八代の松井家に伝わった、この書付で、マカオ側は、宣教師が日本へ渡ると知らせた者に、銀40貫目の褒美を出す、と定めています。
        card: {head: "使節の前", body: 宣教師を渡さない、という誓い}
      # fact: sakokuif-24
      - 語り: 1640年、マカオの使節4人が、長崎に来ました。貿易を、元に戻してほしい。幕府の答えは、禁令に背いた、というものでした。
      # fact: sakokuif-24
      - 語り: 箭内さんの1959年の論文によると、使節ら61人が斬られ、船は焼かれ、下級の船員13人だけが、マカオへ送り返されました。
        tone: 重い
      - 語り: 2つ目の分かれ目は、1639年のポルトガルです。8年後に、その答えを試すような船が、やって来ます。
        tone: 疑問
      # fact: sakokuif-26
      - 語り: 1647年7月26日、ポルトガル本国の使節が、船2隻で、長崎に来ました。
        card: {head: "1647年", body: ポルトガル本国の使節、長崎へ}
      # fact: sakokuif-27, sakokuif-26
      - 語り: 諸藩は兵を集め、港に、舟を並べた橋を架けて、船を閉じ込めます。集めた人数は、記録で大きく違います。マカオ側の通史は、兵5万。徳川実紀の数として引かれるのは、4万8千300余人です。
        tone: 疑問
      # fact: sakokuif-27
      - 語り: 文化遺産オンラインの解説によると、佐賀藩1つだけで、1万1,350人と、125艘の船を送りました。
      # fact: sakokuif-26
      - 語り: それでも幕府は、通商を断っただけで、一行の命は助け、帰らせました。乗っていた人に、宣教師は、1人もいませんでした。
      - 語り: ここからは、もしもの話です。もしも1639年、幕府がポルトガル船を止めず、あの誓いの書付を、受け入れていたら。
        tone: 疑問
      # fact: sakokuif-19, sakokuif-29
      - 語り: 生糸と銀の道は、マカオを通って続き、日本の商人が貸した9万7千両も、返ってくる見込みが残ったでしょう。
        tone: しみじみ
      # fact: sakokuif-26
      - 語り: ただ、1647年の答えを見るかぎり、幕府は、宣教師のいない船でも、ポルトガルとは、商いをしませんでした。誓いの書付1枚で、扉が開いたとは、考えにくいのです。
        tone: しみじみ
      # fact: sakokuif-23, sakokuif-31
      - 語り: お金より、宣教師を締め出すことを選んだ。そう読めます。そして、その代わりの道は、原城を海から撃った、オランダに残されていました。
        tone: しみじみ
      - 語り: もしもの話は、ここまでです。
      - 語り: では、そのオランダは、なぜ、平戸から、長崎の小さな島へ移されたのか。
        hook: true
      - 語り: その前に、倉庫に刻まれた、1つの年が、問われます。
        hook: true

  # ================================================================ 第4章 分岐3 オランダを出島へ
  - title: 「分岐3 オランダが平戸に残っていたら」　1609年から1641年
    year: 1609
    lines:
      # fact: sakokuif-30
      - 語り: オランダの船は、1609年に、長崎の北の平戸に着き、ここに、オランダ商館が置かれました。
        card: {head: "1609年", body: 平戸にオランダ商館}
      # fact: sakokuif-39
      - 語り: 国立国会図書館の展示によると、1628年、朱印船の船長、浜田弥兵衛が、台湾でオランダの長官ヌイツを人質に取る事件が起き、日本とオランダの貿易は、1633年まで止まります。
      # fact: sakokuif-40
      - 語り: 同じ平戸には、イギリスの商館もありました。1613年に開き、1623年に、自分から閉じています。
        card: {head: "1623年", body: イギリス、平戸の商館を閉じる}
      # fact: sakokuif-40
      - 語り: 英語の百科事典ブリタニカの、1911年の版は、損は合わせて約2,000ポンド、閉鎖は、まったく自発的だった、と書きます。
      # fact: sakokuif-40
      - 語り: 建物と、将軍の朱印状は、平戸の大名に預けられ、イギリスが戻れば返す、と約束されました。
      # fact: sakokuif-32
      - 語り: 1640年11月、大名とキリシタンを見張る役、大目付の井上政重が、平戸のオランダ商館を、調べに来ます。倉庫や家に、キリスト教の品がないか、見て回りました。
        card: {head: "1640年11月", body: 井上政重、平戸の商館を調べる}
      # fact: sakokuif-31
      - 語り: そのうえで、新しく建てた倉庫を壊すよう、商館長カロンに命じます。表向きの理由は、倉庫に、キリストの生まれた年から数える年、つまり西暦が、刻まれていたことでした。
        tone: 重い
      # fact: sakokuif-33
      - 語り: その年は、資料で食い違います。平戸の側は、この倉庫を、1639年築造倉庫と呼びます。オランダ側の解説では、屋根の下の石の文字は、アンノ・クリスティ、1640です。
        tone: 疑問
      # fact: sakokuif-31
      - 語り: カロンは逆らわず、倉庫を壊しました。オランダ人は、キリスト教を広めないと約束し、商いは続けてよい、とされました。
      # fact: sakokuif-35, sakokuif-28
      - 語り: 1641年5月、出島へ移れ、という命令が出ます。出島は、ポルトガル人を住まわせるために造られ、1639年から、空いていた島です。
      # fact: sakokuif-35
      - 語り: 長崎市の解説によると、移ったのは、1641年6月25日でした。
        card: {head: "1641年6月25日", body: オランダ商館、出島へ}
      # fact: sakokuif-36
      - 語り: 出島では、オランダ人は、島から自由に出られず、日本人の出入りも、厳しく限られました。商館長は、1年を超えて日本にいてはならない決まりになります。
      # fact: sakokuif-37
      - 語り: のちには、取引にも上限が付きます。1685年には、銀3,000貫目までになりました。
      # fact: sakokuif-34
      - 語り: 壊された平戸の倉庫は、日本で初めての、西洋の石造りの建物とされます。2011年9月20日、平戸市が、平戸オランダ商館として、建て直しました。
        card: {head: "2011年9月20日", body: 平戸の倉庫、建て直される}
      - 語り: 3つ目の分かれ目は、1641年の出島です。なぜ、平戸ではいけなかったのか。
        tone: 疑問
      # fact: sakokuif-38
      - 語り: 国際日本文化研究センターの雑誌に、2017年、研究者のカレンさんは書きます。移した主な理由は、すべての外国との商いを、強められた長崎奉行所の目の届く、1つの港に集めることだった。
      # fact: sakokuif-38
      - 語り: そして、このころの日本の貿易の量は、道すじが多すぎて数えられず、品目ごとの意味のある数字は、1648年からしか無い、とも書きます。
      - 語り: ここからは、もしもの話です。もしも1641年、オランダが平戸に残っていたら。
        tone: 疑問
      - 語り: 外国との商いの港は、中国の船の長崎と、オランダの平戸の、2つに分かれたままだったはずです。
        tone: しみじみ
      # fact: sakokuif-31
      - 語り: ただ、思い出してください。カロンは、倉庫を壊せと言われて、逆らいませんでした。オランダは、港がどこでも、幕府の条件をのむ側でした。
        tone: しみじみ
      - 語り: 分かれ目は、港の場所ではなく、条件をのむかどうかだった。そう考えると、平戸に残っても、行き着く先は、同じだったかもしれません。
        tone: しみじみ
      - 語り: もしもの話は、ここまでです。
      - 語り: オランダが出島へ移されて、32年。
        hook: true
      - 語り: 50年ほど前に、自分から去った国の船が、長崎に戻ってきます。
        hook: true

  # ================================================================ 第5章 リターン号
  - title: 「王の結婚相手」　1673年
    year: 1673
    lines:
      # fact: sakokuif-42
      - 語り: 1673年、イギリス東インド会社の船、リターン号が、長崎に入りました。リターンとは、英語で、戻ること、という意味です。
        card: {head: "1673年", body: リターン号、長崎へ}
      # fact: sakokuif-42
      - 語り: 一緒に出た船、エクスペリメント号は、途中で、オランダに捕まっていました。イギリスとオランダは、このとき、戦争をしていたのです。
      # fact: sakokuif-42
      - 語り: 大英図書館の目録には、乗っていた商人たちの日記の写しが、載っています。長崎にいたのは、イギリス側の日付で、6月29日から8月28日まで。およそ2か月です。
      # fact: sakokuif-40, sakokuif-41
      - 語り: イギリスが平戸を去ってから、およそ50年でした。
        tone: しみじみ
      # fact: sakokuif-43
      - 語り: 幕府の答えは、断る。1911年のブリタニカによると、理由は、イギリス国王チャールズ2世が、ポルトガルの王女と結婚していることでした。
        tone: 重い
      # fact: sakokuif-43
      - 語り: 1924年の、インドで出ていた英語の雑誌は、さらに、旗の赤い十字、聖ジョージの十字が、ポルトガルと同じ宗教のしるしと見られた、と書きます。そしてこの理由は、オランダが、巧みに吹き込んだもの、とします。
      # fact: sakokuif-44
      - 語り: ところが、2017年のカレンさんは、オランダの工作が、断られた原因だった、という、日本の歴史家、岩生成一の見方には、史料の裏付けがない、と指摘します。
        tone: 疑問
      # fact: sakokuif-44
      - 語り: その岩生は、もう1つ、こう考えた、とカレンさんは紹介します。幕府が扉を閉ざした相手は、外国ではなく、カトリックの国だった。
      # fact: sakokuif-44
      - 語り: だから、チャールズ2世の時代が終わり、ポルトガル出身の王妃の問題がなくなったときに、イギリスが求めていれば、貿易の再開も、ありえた、と論じたのです。
        tone: しみじみ
      - 語り: 扉を開ける鍵は、商いでも、誓いでもなく、意外なところに、あったのかもしれません。
        hook: true
      - 語り: 最後に、3つの分かれ目を、並べ直します。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも江戸幕府が鎖国しなかったら
    lines:
      - 語り: もしも江戸幕府が、鎖国しなかったら。日本は、どうなっていたのか。
      # fact: sakokuif-06, sakokuif-02, sakokuif-08, sakokuif-13
      - 語り: 1つ目、スペイン。家康の太平洋の夢は、船が返らず、返礼の大使の目当ては、金銀の島探しでした。取り引きを続けても、宣教師の道は開いたままで、マニラとの疑い合いは、深まったでしょう。
      # fact: sakokuif-25, sakokuif-26
      - 語り: 2つ目、ポルトガル。宣教師を渡さないという誓いの書付があっても、幕府は扉を開けず、宣教師のいない1647年の船も、帰しました。止めずにいても、長くは続かなかったでしょう。
      # fact: sakokuif-38, sakokuif-31
      - 語り: 3つ目、オランダ。商いは続けられたものの、長崎奉行所の目の届く、小さな島へ集められました。平戸に残っても、条件をのむ側である限り、行き着く先は、同じだったでしょう。
      # fact: sakokuif-42, sakokuif-43, sakokuif-44
      - 語り: 来航を禁じられたのは、スペインとポルトガル、カトリックの国の船でした。1673年のイギリスも、断られた理由は、ポルトガルとの結びつきでした。扉は、一度に全部ではなく、国ごとに閉められていったのです。
      # fact: sakokuif-44
      - 語り: だとすれば、変わりえたのは、ヨーロッパの窓口が、オランダ1国ではなく、イギリスとの2国になる道だったのかもしれません。岩生成一は、その道があったと考えました。
      # fact: sakokuif-42, sakokuif-44
      - 語り: 1673年の夏、およそ2か月、長崎に浮かんでいたリターン号。岩生の考えのとおりなら、王の結婚相手さえ違っていれば、扉は、開いていたのかもしれません。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
