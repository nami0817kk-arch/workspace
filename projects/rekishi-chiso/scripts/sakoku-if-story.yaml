# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と kiyomori-fukuhara-if-story.yaml の型）。もしも江戸幕府が鎖国しなかったら。2026-11-16 下書き。
# 公開の予定は 11/21 19:00。型は docs/story-main.md「00. 伸びる型」の もしも型（日本史・江戸前期）：
#   対象は「日本」／分岐点を3つ並べる（①1624年スペイン ②1639年ポルトガル ③1641年オランダの出島移転）／各分岐で「記録から言えること」→「もしも」を分ける／
#   史実の条件の範囲内／推論と明かす／想像の台詞なし。「もしも」の部分は「ここからは、もしもの話です」から「ここまでが、もしもの話です」まで。予想の席は研究者（カレン・岩生成一）に置く。
#   10/10 の旧型「江戸時代の日本は本当に国を閉ざしていたのか」（scripts/sakoku.yaml）の検証（鎖国令の名・四つの口・唐船・通信使・風説書・1801年の訳語・2017年の指導要領）は繰り返さない。
#   出島の造成（25人）・1715年／1790年の上限は前置きとして一言だけ。「鎖国」の語が当時なかったことは、まとめで一言だけ。
#   冒頭（10秒以内）＝1673年、長崎に来たイギリス船が断られ、理由の1つは国王の結婚相手だった。イギリスは50年前に自分から去っていた。
#   序章 50年後の船／第1章 家康が夢見た太平洋（1609〜1623）／第2章 分岐1 スペインを断る（1623〜1635）／第3章 分岐2 ポルトガル船を止める（1604〜1647）／
#   第4章 分岐3 オランダを出島へ（1609〜1641）／第5章 リターン号（1673）／まとめ。締めは余韻の一文＋登録のお願い（story: true）。
# 題材の扱い：1640年の斬罪・ソテロの火刑・原城は数と事実だけ一文ずつ・絵にしない。実在の人物の顔は描かない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/鎖国if_facts_20261116.yaml、担当A=スペイン・B=ポルトガル・C=オランダとイギリス）にあるものだけ。行の上に `# fact: sakokuif-24`。
#   箭内健次 1956・1959（史淵）は九大リポジトリの本文。Schreurs 2017（一橋 SSPJ）は出どころ1つ、「シュアーズさん」と名を言う。
#   徳川実紀の 48,300余人は引用でしか見ていない（書誌）。「徳川実紀の数として引かれるのは」と言う。
# 記録の食い違い（3つ）：①原城に籠った人数（南島原市 約3万7千／コレア 1643年 3万5千あるいは3万7千）②1647年の警備の人数（マカオ側の通史 兵5万／徳川実紀の引用 4万8千300余人）
#   ③平戸の倉庫の刻銘の年（平戸側「1639年築造倉庫」／オランダ側の解説 Anno Christi 1640）。研究者の見方の割れ（カレンと岩生）は食い違いには数えない。
# 自分で計算した数：1623（イギリスが去る。国会図書館は1624）→1673（リターン号）＝およそ50年。6月29日→8月28日＝60日（両端を数えると61日。台本は「およそ2か月」）。
#   1640年 61＋13＝74人。1618〜1633年＝16年で69隻。1640→1647＝7年。1628→1633＝5年。1641→1673＝32年。1639→1641＝2年。1604〜1635年＝32年で356隻。
# 確かめられなかったこと（台本では言わない）：1624年の使節の名前・人数、デ・ライプ号の砲撃の日付と弾数、上使 太田資宗、1640年の倉庫を壊した日、アユタヤの日本人の数、
#   リターン号への幕府の答えの日本語の原文、1647年の使節が何を知らせに来たか、平戸と出島の時代の取引量の比べ（カレンは数えられないとする）。
# 絵：AI 絵（Gemini。一覧は scripts/story/sakoku_if_main_look.yaml の頭）だけ。実在の人物の顔は描かない（後ろ姿・遠景）。字・旗・紋は入れない。
