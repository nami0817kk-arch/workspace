# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と columbus-if-story.yaml の型）。もしもモンゴル軍がヨーロッパから引き返さなかったら。2026-11-06 下書き、11-07 事実照合（前半・後半・流れの3人）で直した。
# 公開の予定は 11/10 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型：
#   分岐は誰でも知る大事件（1241年のレグニツァ・モヒのあと、1242年にモンゴル軍がハンガリーから去った）の逆＝1242年の春、軍がハンガリーに居すわっていたら／一点だけ変える／
#   史実の条件の範囲内（ロゲリウスは、代官を置き農民に収穫させ、冬を越すつもりだったと書く）／推論と明かす／台詞は使わない（想像の台詞なし）／対象は「世界」（日本まで届かせる）。
#   引き返した理由そのものは記録・研究で割れる（オゴデイの死・知らせの速さ・草・天候・目的を果たした）ので、第4章で並べ、どれか1つに決めない。
#   語り手は剣崎1人。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない（第5章は事実を宣言の前に置く）。予想の席は研究者の説（Pow・Sinor・Büntgen と Di Cosmo・Pinke ら・Jackson・Wheelis・Haw）に置く。
#   冒頭（10秒以内）＝1238年、イングランドでニシンが投げ売りされた。ゴットランドやフリースラントの人々がモンゴルを恐れ、ヤーマスへ船を出さなかったから（マシュー・パリス『大年代記』）。
#   序章／第1章 軍は何人（タタールの名・チンギスの死・西と東に同時に・数の食い違い）／第2章 1241年4月の3日間（レグニツァ・ワールシュタットの名・モヒ・皇帝の手紙）／
#   第3章 ハンガリーで冬を越す（ロゲリウス・凍ったドナウ・落ちなかった3か所・石の城10・ロゲリウスの脱出）／第4章 なぜ引き返したのか（4つの記録・知らせの速さ・草・天候・目的）／
#   第5章 分岐1 城の壁（カルピニの18年・城の数・1285年）／第6章 分岐2 教皇への手紙（グユクの返書・リヨン公会議・ルイ9世・ルブルク・ラッバン・サウマ）／
#   第7章 分岐3 ペストと航海（ペゴロッティ・2022年の墓・カッファ・死者の割合・マルコ・ポーロ）／第8章 分岐4 日本まで（高麗・元史の沈黙・モンケの死・2人のハーン・国書）／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 公開済みとの重なり：元寇の if（genkou-if-story.yaml）とは中身を重ねない（元寇は「別の回で」と1行だけ）。コロンブスの if（11/9）とはマルコ・ポーロのジパングだけ短く。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/モンゴル_facts_20261106.yaml）にあるものだけ。行の上に `# fact: mongol-NN`。
#   誰でも知る前置き（チンギス・カン・続柄・クリルタイで帰ったという通説・元寇）は短く使う。
#   カードの読み違いを照合で直した所（台本は原文に合わせた）：mongol-12＝漁ではなくヤーマスへ船を出さなかった／mongol-13＝1240年の項は川の説と言葉遊びが並ぶ／
#   mongol-16＝集史の「知らせは届かず」はカダンの軍の話／mongol-24＝1000の村はロゲリウスの主人1人／mongol-78＝クビライは知らせのあとも鄂州を囲み、北へ帰ったのは閏十一月。
#   記録の食い違いは3つだけ並べる：①西へ向かった兵の数（議会図書館60万・ビュントゲンら13万・シノールの計算6万8640、のち8万3027）
#   ②引き返した理由（カルピニ＝大ハーンの毒殺／集史＝死を理由に挙げない・カダンの軍に知らせは届かず／ロゲリウス＝大王たちの命令／マシュー・パリス＝皇帝フリードリヒの軍）
#   ③ペストで亡くなったヨーロッパの人の割合（ウィーリス 4分の1〜3分の1・ベネディクトウ 約6割。8000万のうち5000万は未見なので言わない）。
#   ほかに割れるもの（モヒの規模 40万／30人・オゴデイの死に方・ハンガリーにいた期間・城の数 66／147〜172・フレグが引いた理由・カッファの包囲の年・人口の損失）は、1つの出どころの数として言うか、言わない。
#   旧暦の月（元史の「秋七月」など）は西暦の月として言わない（1227年・1259年の夏・1266年）。
# 自分で計算した数：
#   1241−1238＝3年。4月9日→11日＝2日後（9・10・11の3日間）。1235−1227＝8年。1234→1236＝2年。
#   60万÷6万8640＝8.74→9倍近い（数える範囲が違うと断る）。20万5920頭÷3＝6万8640人（カードと合う）。
#   1241年12月11日→1242年3月末＝3か月あまり。4月8日→7月22日＝22+31+30+22＝105日≒3か月半。
#   1285−1242＝43年。1346−1338＝8年。1259−1241＝18年。
# 確かめられなかったこと（台本では言わない）：スパラトのトマスの本文・ドゥゴシュの原文・セシリア・ホランドの論考の中身・杉山正明の本文・
#   コロンブスがいつ書き込み本を読んだか（販売サイトの解説だけ）・グユクの返書の発見の年・3300万km²の出どころ・Sverdrup の具体的な数・ベネディクトウの8000万／5000万（History Today は 403）。
# 絵：AI 絵（Gemini。一覧は scripts/story/mongol_main_look.yaml の頭）＋実在の絵（『聖ヘドヴィヒ伝』のレグニツァの戦い（1353年）・元朝の皇帝の肖像のオゴデイ）。
#   戦の残虐な細部は語らない・描かない（耳の袋・処刑・ペストの遺体は出さない）。
