sections:
  # ================================================================ 序章
  - title: 「ニシンが安くなった年」　1238年 イングランド
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1238
    lines:
      # fact: mongol-12
      - 語り: 東から来た軍のせいで、イングランドの魚が、投げ売りされました。1238年、よいニシンが、40匹か50匹で、銀貨1枚です。
        tone: 重い
        card: {head: "1238年 イングランド", body: ニシン40〜50匹が銀貨1枚}
      # fact: mongol-12
      - 語り: ニシンの季節には、バルト海や北海の人々が、船で港町ヤーマスへ買いに来ていました。その年は、ある軍を恐れて、来なかったのです。
      # fact: mongol-12, mongol-07
      - 語り: イングランドの修道士、マシュー・パリスは、『大年代記』に、その訳を書きとめています。恐れられていたのは、はるか東の騎馬の軍、モンゴルでした。
      # fact: mongol-01, mongol-02
      - 語り: 3年後の1241年4月。その軍は、わずか3日のあいだに、ポーランドとハンガリーで、2つの大きな戦に勝ちます。
      # fact: mongol-04
      - 語り: ところが翌1242年、春のうちに、軍は、ハンガリーから東へ去っていきました。
      # fact: mongol-16
      - 語り: なぜ引き返したのかは、古い記録でも、今の研究者のあいだでも、割れています。
      - 語り: もしも、あのとき引き返さなかったら。世界は、どうなっていたのでしょうか。
        tone: 疑問
      - 語り: 変えるのは一点だけ。1242年の春、モンゴルの軍が、ハンガリーに居すわっていたら。
      - 語り: その違いは、遠く日本まで、届いたのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 恐れられた軍は、何人いたのか。見積もりの数は、9倍近くも違います。
        hook: true

  # ================================================================ 第1章 軍は何人
  - title: 「東の軍は、何人いたのか」　1227年から1240年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1235
    lines:
      # fact: mongol-07
      - 語り: ヨーロッパの人々は、この軍を、タタール人と呼びました。マシュー・パリスは、東の軍の知らせを、何度も年代記に書きとめています。
      # fact: mongol-13
      - 語り: 1238年の項では、タル川という川から来たので、タタールと呼ぶ、と説明します。
      # fact: mongol-13
      - 語り: 1240年の項では、ギリシア神話の地獄、タルタロスから放たれた悪魔のように、と書き、まさにタルタロスの住人だ、と言葉を重ねました。恐れは、呼び名にまで表れていました。
        tone: しみじみ
      # fact: mongol-88
      - 語り: この軍のふるさとは、モンゴル高原です。『元史』によれば、チンギス・カンは、1227年に亡くなりました。
      # fact: mongol-73
      - 語り: あとを継いだ息子のオゴデイは、1235年、一族の王子たちを西へ送ると決めます。チンギスの孫バトゥ、オゴデイの子グユク、おいのモンケ。
        portrait: {image: paintings/mongol_ogedei_portrait.jpg, caption: "オゴデイ（元朝の皇帝の肖像、14世紀）"}
        card: {head: "1235年", body: 王子たちを西へ}
      # fact: mongol-73
      - 語り: 同じ年、南の宋へも、東の高麗へも、軍を出しています。帝国は、西と東を、同時に攻めていました。
      # fact: mongol-74
      - 語り: 中国の北にあった金の国は、その前の年、1234年の正月に滅んでいます。西への軍が出たのは、その2年後でした。
      # fact: mongol-30
      - 語り: ロシアの古い年代記、イパーチー年代記には、捕らわれたキーウの千人隊長ドミトルが、早くハンガリーへ行け、とバトゥに勧めた、とあります。
      - 語り: では、何人が西へ向かったのでしょうか。
        tone: 疑問
      # fact: mongol-87
      - 語り: アメリカ議会図書館の国別研究は、60万の軍が、凍ったヴォルガ川を渡った、と書きます。
        figure: {type: stats, title: モンゴルの軍の数（見積もり）, items: [[米国議会図書館, 60万, ヴォルガ川を渡った軍], [ビュントゲンら, 約13万, ハンガリーへ攻め込んだ兵], [シノールの計算, 6万8640, ハンガリーの草で養える上限]], upto: 1}
      # fact: mongol-38
      - 語り: 2016年に科学誌に出た、ビュントゲンとディ・コスモの論文は、ハンガリーへ攻め込んだ兵を、おそらく13万人、とします。
        figure: {type: stats, title: モンゴルの軍の数（見積もり）, items: [[米国議会図書館, 60万, ヴォルガ川を渡った軍], [ビュントゲンら, 約13万, ハンガリーへ攻め込んだ兵], [シノールの計算, 6万8640, ハンガリーの草で養える上限]], upto: 2}
      # fact: mongol-37
      - 語り: 歴史家のデニス・シノールは、1972年、草の量から計算しました。ハンガリーの大平原で養える兵は、6万8640人まで。のちに、8万3027人と計算し直しています。
        figure: {type: stats, title: モンゴルの軍の数（見積もり）, items: [[米国議会図書館, 60万, ヴォルガ川を渡った軍], [ビュントゲンら, 約13万, ハンガリーへ攻め込んだ兵], [シノールの計算, 6万8640, ハンガリーの草で養える上限]], upto: 3}
      - 語り: 数える範囲は違いますが、60万と6万8640では、9倍近い開きです。
        tone: 重い
      # fact: mongol-38
      - 語り: 軍事史家のなかには、モンゴルの軍は、ふつう言われるよりずっと小さかった、と見る人もいます。
        figure: null
      # fact: mongol-28
      - 語り: 一致している記録もあります。『元史』と、ペルシアで書かれた『集史』は、軍が5つの道に分かれて進んだ、と書きます。
      - 語り: その5つの道の先に、ポーランドとハンガリーがありました。
        hook: true
      - 語り: そして勝った側にも、記録に残る言い争いが起きます。
        hook: true

  # ================================================================ 第2章 1241年4月の3日間
  - title: 「1241年4月の3日間」　レグニツァ・モヒ
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1241
    lines:
      # fact: mongol-01, mongol-50
      - 語り: 1241年4月9日、ポーランドの南西、レグニツァ。5つの道の1つを進んだ部隊が、シレジアの君主、ヘンリク2世の軍と戦いました。
        card: {head: "1241年4月9日", body: レグニツァの戦い}
        figure: {type: map, title: 1241年4月 2つの戦い, bounds: [12, 32, 42, 54], places: [[キーウ, 30.52, 50.45], [レグニツァ, 16.16, 51.21], [モヒ, 20.92, 47.98], [エステルゴム, 18.74, 47.79]], route: [キーウ, レグニツァ], note: 4月9日にレグニツァ、11日にモヒ}
      # fact: mongol-51
      - 語り: フランスのテンプル騎士団を率いたポンス・ドーボンは、ルイ9世への報告で、ヘンリク2世と、テンプル騎士6人、その配下500人が殺された、と伝えています。
        figure: null
      # fact: mongol-32
      - 語り: 両軍の数は、分かっていません。2025年の、ナショナルジオグラフィックのポーランド版は、モンゴル側を、多くて7千から8千と見ています。
      # fact: mongol-50
      - 語り: 勝った部隊は、そのあとボヘミアのクウォツコの砦を攻めましたが、落とせずに南へ回りました。
      # fact: mongol-82
      - 語り: 日本では、この戦いを、ワールシュタットの戦いと呼びます。ドイツ語の古い言葉で、戦場という意味です。
      # fact: mongol-83, mongol-84
      - 語り: 明治の教科書は、戦いの場所をリーグニッツと書き、ポーランドへ向かった将を、カイドゥとしていました。今の辞典が挙げる将の名は、バイダルです。
      # fact: mongol-02
      - 語り: 2日後の4月11日。ハンガリーのシャヨー川のほとり、モヒで、国王ベーラ4世の軍が敗れます。
        card: {head: "1241年4月11日", body: モヒの戦い}
        figure: {type: map, title: 1241年4月 2つの戦い, bounds: [12, 32, 42, 54], places: [[キーウ, 30.52, 50.45], [レグニツァ, 16.16, 51.21], [モヒ, 20.92, 47.98], [エステルゴム, 18.74, 47.79]], route: [キーウ, レグニツァ, モヒ], note: 4月9日にレグニツァ、11日にモヒ}
      # fact: mongol-77
      - 語り: 『元史』の、将軍スブタイの伝記によると、バトゥの軍は橋を争って押し返され、よろいの兵30人と、部将1人を失いました。
        figure: null
      # fact: mongol-77
      - 語り: バトゥはのちに、スブタイの救いが遅れたからだ、と責めています。
      # fact: mongol-27
      - 語り: 『元史』には、王子たちが引き返そうとしたとき、スブタイが言った言葉もあります。今の言葉にすると、帰りたいなら、自分で帰ればよい。私は、ドナウ川の町に着くまで帰らない。
        tone: 重い
      # fact: mongol-14
      - 語り: 7月3日には、神聖ローマ皇帝フリードリヒ2世が、イングランド王らに手紙を送ります。ドイツを、キリスト教世界の門、と呼んでいました。
      # fact: mongol-15
      - 語り: ところがマシュー・パリスによれば、その手紙は嘘だと受け取られ、皇帝こそがタタールを呼び込んだ、という噂まで立ちました。
      - 語り: 門の前まで来た軍は、そのまま帰りませんでした。
        hook: true
      - 語り: 奪った土地では、ある支度が始まっていました。
        hook: true

  # ================================================================ 第3章 ハンガリーで冬を越す
  - title: 「ハンガリーで、冬を越す」　1241年から1242年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1241
    lines:
      # fact: mongol-23
      - 語り: そのころ、ハンガリーの町ヴァーラドに、ロゲリウスという聖職者がいました。町が、オゴデイの子カダンに落とされると、彼は森へ逃げます。
      # fact: mongol-23
      - 語り: 川の橋では、同じく逃げてきたドイツ人たちに、渡るのを断られました。やがて彼は、モンゴルに従ったハンガリー人の下で、働くことになります。
      # fact: mongol-05
      - 語り: ロゲリウスが、1244年ごろに書いた『悲しみの歌』は、占領のようすを、内側から伝える記録です。
        card: {head: "1244年ごろ", body: ロゲリウス『悲しみの歌』}
      # fact: mongol-24
      - 語り: モンゴルは、およそ100人の代官を置きました。ロゲリウスが仕えた代官は、1人で、ほぼ1000の村を治めていた。農民には、収穫をさせた、とあります。
      # fact: mongol-24
      - 語り: ロゲリウスは、彼らが、ここで冬を越すつもりだ、と見ました。
        tone: しみじみ
      # fact: mongol-46
      - 語り: その冬、軍は凍ったドナウ川を渡ります。1242年2月2日付けで、ハンガリーの指導者たちが教皇に送った手紙には、守り手たちは、17を超える砦に退いた、とあります。
        card: {head: "1242年2月2日", body: 17を超える砦へ}
      # fact: mongol-45
      - 語り: 落ちなかった場所もありました。エステルゴムの城塞、丘の上のパンノンハルマ修道院、そして、セーケシュフェヘールヴァールの町です。
      # fact: mongol-45
      - 語り: ロゲリウスは、その地方で落ちなかったのは、この3か所だけだった、と書いています。
      # fact: mongol-43
      - 語り: ハンガリーの歴史家フュゲディによると、そのころハンガリーにあった、新しい型の石の城は、わずか10。
        figure: {type: stats, title: 1241年のハンガリーの城（フュゲディ）, items: [[新しい型の石の城, 10, 奥の5つは全部残った], [土と木の県の城, 29, 残ったのは6]], upto: 2}
      # fact: mongol-43
      - 語り: その10のうち、占領された土地の奥にあった5つは、すべて持ちこたえました。土と木で作った県の城は、29のうち、6つしか残っていません。
      # fact: mongol-47
      - 語り: ベーラ王は、アドリア海のほとりまで逃れます。追ったカダンは、海に近い砦クリスを攻めましたが、退きました。
        figure: null
      # fact: mongol-29
      - 語り: ペルシアの『集史』も、王が船で海へ出た、と伝えます。そして3月の末、軍は、ハンガリーを去りはじめました。
      # fact: mongol-25
      - 語り: 捕らわれていたロゲリウスも、東へ去る列の中にいました。彼は列を抜け出し、流れのくぼみに、2日伏せて隠れます。
      # fact: mongol-25
      - 語り: 森を出て8日目、ようやくたどり着いたのは、アルバという町でした。けれど町は壊され、人の姿はありません。彼は、近くの森の高い山に逃げこんでいた人々のもとで、1か月を過ごします。
        tone: しみじみ
      # fact: mongol-25
      - 語り: やがてベーラ王も、ロドス島の騎士団や、海辺の貴族フランコパン家の助けで、国へ戻ってきました。
      - 語り: 冬を越す支度までしていた軍は、なぜ去ったのでしょうか。
        hook: true
      - 語り: その理由は、古い記録だけで、4通りあります。
        hook: true

  # ================================================================ 第4章 なぜ引き返したのか
  - title: 「なぜ、引き返したのか」　1241年12月から1243年
    background: {image: paintings/mongol_ogedei_portrait.jpg, credit: "元朝の皇帝の肖像 オゴデイ（14世紀、台北・国立故宮博物院蔵）"}
    year: 1242
    lines:
      # fact: mongol-03
      - 語り: よく語られる理由は、大ハーン、オゴデイの死です。ペルシアの歴史家ジュヴァイニーによれば、亡くなったのは1241年12月11日。
        card: {head: "1241年12月11日", body: オゴデイが亡くなる}
        portrait: {image: paintings/mongol_ogedei_portrait.jpg, caption: "オゴデイ（元朝の皇帝の肖像、14世紀）"}
      - 語り: 次のハーンを決める大会議、クリルタイに出るため、王子たちは帰った。そう説明されてきました。
      # fact: mongol-16
      - 語り: 教皇の使いとしてモンゴルまで旅をした、プラノ・カルピニは、大ハーンが毒で殺されたので、ハンガリーにいた軍が退いた、と書きました。
        figure: {type: table, title: 引き返した理由（古い記録）, cols: [記録, 理由], rows: [[カルピニ, 1240年代, 大ハーンが毒で殺された], [集史, 14世紀初め, 死を理由に挙げない], [ロゲリウス, 1244年ごろ, 大王たちの命令], [マシュー・パリス, 13世紀, 皇帝フリードリヒの軍]], upto: 1}
      # fact: mongol-39
      - 語り: ペルシアの宰相、ラシード・ウッディーンの『集史』は、オゴデイの死を理由に挙げていません。ベーラ王を追ったカダンの軍には、ハーンの死の知らせは、まだ届いていなかった、と書きます。
        figure: {type: table, title: 引き返した理由（古い記録）, cols: [記録, 理由], rows: [[カルピニ, 1240年代, 大ハーンが毒で殺された], [集史, 14世紀初め, 死を理由に挙げない], [ロゲリウス, 1244年ごろ, 大王たちの命令], [マシュー・パリス, 13世紀, 皇帝フリードリヒの軍]], upto: 2}
      # fact: mongol-16
      - 語り: ロゲリウスは、大王たちの命令で退いた、と書くだけ。マシュー・パリスは、皇帝フリードリヒの軍が追い出した、と書きます。
        figure: {type: table, title: 引き返した理由（古い記録）, cols: [記録, 理由], rows: [[カルピニ, 1240年代, 大ハーンが毒で殺された], [集史, 14世紀初め, 死を理由に挙げない], [ロゲリウス, 1244年ごろ, 大王たちの命令], [マシュー・パリス, 13世紀, 皇帝フリードリヒの軍]], upto: 4}
      # fact: mongol-18
      - 語り: オゴデイの死に方まで、カルピニは毒、『集史』は深酒のあとの眠りの中、と違っています。
        figure: null
      # fact: mongol-40
      - 語り: カナダのカルガリー大学で、2012年に出たスティーブン・ポウの修士論文は、死の知らせが撤退に間に合ったのかを疑いました。12月の死から、3月の撤退まで、3か月あまりしかありません。
      # fact: mongol-40
      - 語り: カルピニの一行は、ヴォルガ川のバトゥの陣から、モンゴル高原のグユクの陣まで、急いでも4月8日から7月22日。3か月半かかっています。キーウからは、約5か月でした。
      # fact: mongol-41
      - 語り: しかもバトゥは、モンゴル高原へ帰っていません。1242年は南のカフカスのあたりで過ごし、ヴォルガ川に戻ったのは、1243年の末でした。
      - 語り: 研究者の説も、知らせのほかに、草・天気・目的と割れています。
      # fact: mongol-37
      - 語り: 草の説は、シノールの計算です。大平原の草で養える馬は、20万5920頭。1人に3頭なら、兵は6万8640人まで。さきほどの数は、ここから出ています。
      # fact: mongol-42
      - 語り: ただ、ベーラ王自身は、1250年ごろ教皇への手紙で、ハンガリーこそ、モンゴルが大軍を住まわせやすい土地だ、と記しました。
      # fact: mongol-35, mongol-10
      - 語り: 天気の説は、ビュントゲンとディ・コスモです。木の年輪を調べると、1238年から1241年まで暑い夏が4回続き、1242年に急に冷えて、雨が多くなった。
        card: {head: "2016年", body: 年輪で見た1242年の天気}
      # fact: mongol-10
      - 語り: 平原はぬかるみ、馬の草が減った、という見方です。
      # fact: mongol-36
      - 語り: 翌2017年、ハンガリーの研究者を中心とする5人が、同じ雑誌で反論します。モンゴル軍は、ひどい日照りの終わりに来た。1242年の春の雨は、むしろ草を増やした。
      # fact: mongol-62
      - 語り: 目的の説は、歴史家のピーター・ジャクソンです。2005年の本で、ベーラ王を罰するという目的を果たしたから去った、と見ています。
      - 語り: 引き返した理由は、今も、1つには決まっていません。
        tone: しみじみ
      - 語り: では、もしも去らなかったら。
        hook: true
      - 語り: モンゴルの側は、その先の計画を、口にしていました。
        hook: true

  # ================================================================ 第5章 分岐1 城の壁
  - title: 「分岐1 城の壁を越えられたのか」　1246年から1300年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1246
    lines:
      # fact: mongol-20
      - 語り: 1246年、モンゴル高原まで行ったカルピニは、こう報告しています。モンゴル人は、30年戦い続けるつもりだった。
      # fact: mongol-20
      - 語り: 次は、ハンガリーとポーランドの2つの道から、18年休まずに戦う用意で来る。
        tone: 重い
        card: {head: "カルピニの報告", body: 次は2つの道から、18年}
      # fact: mongol-44
      - 語り: 史実のハンガリーでは、そのあと、新しい城が次々に建ちます。ラスロフスキーらの2018年の論文によれば、1242年から1300年に建った新しい城は、147から172。
        figure: {type: stats, title: ハンガリーの城の数, items: [[1241年の新しい型の石の城, 10, フュゲディ], [1242〜1300年に建った新しい城, 147〜172, ラスロフスキーら]], upto: 2}
      # fact: mongol-52
      - 語り: 43年後の1285年、モンゴルは再びハンガリーへ大軍で来ました。けれど、砦を落とすことは、ほとんどできなかった、とポウは書いています。
        figure: null
      - 語り: ここから、もしもの話です。1242年の春、モンゴルの軍が、ハンガリーに居すわっていたら。記録と研究者の説から、考えてみます。
        tone: 疑問
      - 語り: ロゲリウスの見た代官と村は、そのまま残ったと考えられます。ハンガリーの平原は、バトゥがのちに陣を置いたヴォルガ川の草原のように、モンゴルの王族の牧地になりえました。
      # fact: mongol-54
      - 語り: ただ、シノールの計算では、平原の草で養える兵は、7万から8万人ほど。大軍を置き続けるには、草が足りません。
      # fact: mongol-55
      - 語り: そして、その西には、石の城が待っていました。ポウは、ヨーロッパの城の多さが、モンゴルにとって、越えにくい戦略の壁になった、と論じています。
      - 語り: 新しい型の城が10しかなかったハンガリーでさえ、奥の5つは落ちませんでした。城の多いドイツやフランスでは、城を1つずつ囲むたびに、草と時間がかかったでしょう。
      - 語り: ハンガリーは押さえても、ドイツやフランスの奥まで支配が届いたかは、言い切れません。
        figure: {type: table, title: もしも1242年に居すわっていたら（推論）, cols: [史実, もしも], rows: [[ハンガリー, 1242年に去る, 帝国の牧地に, ありうる], [ドイツ・フランス, 来なかった, 城で遅れる, 不明]], upto: 2, note: もしもは推論。右の札は見込みの高さ}
        tone: しみじみ
      - 語り: 居すわるモンゴルに、ローマ教皇は、どう向き合ったのでしょうか。
        figure: null
        hook: true
      - 語り: 史実でも、教皇のもとには、ハーンからの手紙が届いていました。
        hook: true

  # ================================================================ 第6章 分岐2 教皇への手紙
  - title: 「分岐2 教皇への手紙」　1245年から1287年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1246
    lines:
      # fact: mongol-06
      - 語り: 1245年4月16日、カルピニは、フランスのリヨンを発ちました。教皇インノケンティウス4世の使いです。
        card: {head: "1245年4月16日", body: カルピニ、リヨンを発つ}
      # fact: mongol-58
      - 語り: 同じ1245年、そのリヨンで開かれた公会議は、モンゴルの通り道を、堀や壁で守れ、と決めます。費用は教皇も出し、キリスト教の国々にも割り当てる、という約束でした。
      # fact: mongol-21
      - 語り: 1246年8月24日、カルピニは、西への遠征にも加わっていたグユクが、新しいハーンになる儀式を見ます。8月15日の予定が、雹で延びたのです。
      # fact: mongol-22
      - 語り: グユクが教皇に送った返書は、1246年11月のものです。今の言葉にすると、こうあります。教皇自らが、諸侯を率いて、すぐに仕えに来い。
        tone: 重い
      # fact: mongol-22
      - 語り: 教皇の手紙の、なぜハンガリーやキリスト教徒の土地を奪ったのか、という問いには、永遠の神が、その地と人々を滅ぼした、と答えています。
      # fact: mongol-59
      - 語り: フランス王ルイ9世は、キプロス島で、モンゴルからの使いを迎えます。エルサレムを取り戻す手助けを申し出た使いでした。
      # fact: mongol-59
      - 語り: 王に仕えたジョワンヴィルの回想録によれば、王は、真紅の布で作った礼拝堂の天幕を、ハーンに贈りました。
      # fact: mongol-60
      - 語り: 1253年に旅立った修道士ルブルクは、モンゴルの都カラコルムは、宮殿を除けば、パリの近くのサン・ドニの村ほども大きくない、と書きました。
      # fact: mongol-60
      - 語り: そこには、パリ出身の金細工師ギヨームが作った、銀の木があった、とルブルクは書きます。
        card: {head: "カラコルム", body: パリの職人の銀の木}
      # fact: mongol-61
      - 語り: 逆向きの旅もありました。1287年、東方のキリスト教の修道士、ラッバン・サウマが、モンゴルの使いとして西へ。ローマへ向かう途中で、教皇ホノリウス4世の死を聞きます。
      # fact: mongol-61
      - 語り: パリでは、学生が3万人いる、と記し、フランス王から、キリストの茨の冠を見せられました。
      - 語り: もしもの世界に戻ります。ハンガリー王国の海辺、ダルマチアまでモンゴルが押さえれば、その支配地と、イタリアの教皇の国は、アドリア海をはさんで向き合います。
      - 語り: すぐに仕えに来い、というグユクの言葉は、遠い国の言葉ではなくなったでしょう。
      - 語り: 史実の教皇は、従うかわりに、壁を作る金を出すと決めていました。目の前にハーンの牧地があれば、その壁は、アドリア海のほとりに築かれることになったかもしれません。
        tone: しみじみ
      - 語り: モンゴルがつないだ道は、人と手紙だけでなく、目に見えないものも運びました。
        hook: true
      - 語り: その起こりを突き止めたという研究が出たのは、2022年のことです。
        hook: true

  # ================================================================ 第7章 分岐3 ペストと航海
  - title: 「分岐3 ペストと、西への航海」　1338年から1492年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1340
    lines:
      # fact: mongol-70
      - 語り: 1340年ごろ、イタリアの商人ペゴロッティは、『商業指南』に書いています。黒海の奥の港、タナから中国までの道は、昼も夜も安全だ。
        card: {head: "1340年ごろ", body: タナから中国まで、昼も夜も安全}
      # fact: mongol-70
      - 語り: タナから、ヴォルガ川の河口の町アストラハンまでは、牛の車で25日、馬の車なら10日から12日、ともあります。
      # fact: mongol-69
      - 語り: 2022年、スピロウらの研究班は、中央アジアのキルギス、イシク・クル湖の近くの墓で、7人の歯を調べました。
      # fact: mongol-69
      - 語り: 3人から、ペスト菌の遺伝子が見つかります。墓石には、1338年から39年に、疫病で亡くなった、と刻まれていました。
        tone: 重い
      # fact: mongol-11
      - 語り: その8年後の1346年、黒海の港カッファを囲んだモンゴルの軍から、ペストがヨーロッパへ広まった。そう、よく語られます。
      # fact: mongol-65
      - 語り: けれど、その話を書いたイタリアの公証人、デ・ムッシは、カッファにいませんでした。1344年から1346年の前半まで、イタリアのピアチェンツァで、書類に署名しているのです。
      # fact: mongol-65
      - 語り: これを2002年に示したのは、研究者のウィーリスです。
      # fact: mongol-67
      - 語り: ウィーリスは、クリミア半島には、ほかにもモンゴルの港があり、陸の道も生きていた。カッファの話は、逸話ほどの重みしかない、と見ます。
      # fact: mongol-68
      - 語り: ペストで亡くなったヨーロッパの人の割合も、割れています。ウィーリスは、4分の1から3分の1。
        tone: 疑問
        figure: {type: stats, title: ペストで亡くなったヨーロッパの人の割合, items: [[ウィーリス（2002年）, 4分の1〜3分の1], [ベネディクトウ（2004年）, 約6割]], upto: 1}
      # fact: mongol-68
      - 語り: 歴史家のベネディクトウは、2004年の本で、約6割と見ています。2倍前後の開きです。
        figure: {type: stats, title: ペストで亡くなったヨーロッパの人の割合, items: [[ウィーリス（2002年）, 4分の1〜3分の1], [ベネディクトウ（2004年）, 約6割]], upto: 2}
      # fact: mongol-71
      - 語り: 同じ道は、話も運びました。マルコ・ポーロの『東方見聞録』は、大陸から1500マイルの島、ジパングの王の宮殿は、屋根が全部金だ、と記しています。
        figure: null
      # fact: mongol-72
      - 語り: コロンブスが書き込みをした、その本のラテン語の版は、今もスペインのセビーリャに残っています。
      - 語り: もしもの話に戻ります。もしもの世界では、東と西をつなぐ道は、もっとヨーロッパの近くまで延びていたでしょう。品物も、病も、それだけ早く届いたかもしれない。
      # fact: mongol-69
      - 語り: けれど、ペストの起こりは、中央アジアでした。一点を変えても、ペストが消えたとは言えません。
        tone: しみじみ
      - 語り: 金の島の話も、大陸の道を通って、やはりヨーロッパに届いたでしょう。東を目指す人々の夢は、もしもの世界でも、残ったはずです。
      - 語り: そして、モンゴルの目は、東の海の向こうにも向いていました。
        hook: true
      - 語り: 鍵になるのは、2度目の、ハーンの死です。
        hook: true

  # ================================================================ 第8章 分岐4 日本まで
  - title: 「分岐4 日本まで届くのか」　1241年から1268年
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    year: 1259
    lines:
      # fact: mongol-75
      - 語り: 西で2つの戦があった1241年の秋、東では、高麗の王が、一族の若者を、自分の子と偽って、モンゴルへ人質に出しています。
      # fact: mongol-76
      - 語り: 一方、『元史』の皇帝の年代記は、西の遠征について、ロシアもポーランドもハンガリーも、名を一度も出しません。東の記録から見れば、ヨーロッパは、遠い西の一部でした。
      # fact: mongol-78
      - 語り: 18年後の1259年の夏。グユクのあとにハーンとなったモンケが、中国の四川、釣魚山で亡くなります。
        card: {head: "1259年", body: モンケ、釣魚山で亡くなる}
      # fact: mongol-78
      - 語り: 弟のクビライにも知らせが届きます。けれど彼は、手柄なしには帰れない、と言って宋の鄂州を囲み、大軍が北へ帰ったのは、冬になってからでした。
      # fact: mongol-56
      - 語り: 研究者のスティーブン・ホーは、2013年の論文で、1242年と1260年の、2つの撤退を並べて論じています。ハーンの死で軍が止まったのは、一度だけではなかったのです。
        tone: しみじみ
      # fact: mongol-57
      - 語り: 西アジアでも、モンケの死のあと主力が引き、残った軍は、1260年9月3日、アイン・ジャールートで、エジプトの軍に敗れました。
      # fact: mongol-80
      - 語り: 1260年、クビライはハーンになります。ところが同じ年、弟のアリクブケも、カラコルムの西で、ハーンを名乗りました。ハーンが2人、並んだのです。
      # fact: mongol-81
      - 語り: 『元史』によると、1266年、クビライは、日本への国書を持たせた使いを出します。1268年、高麗の使いが、大宰府に着きました。
        card: {head: "1268年", body: 国書が大宰府に届く}
      # fact: mongol-81
      - 語り: 国立公文書館にある、蒙古国牒状は、奈良の東大寺尊勝院にあった文書の写しです。
      - 語り: そして1274年と1281年の、元寇。その話は、別の回でお話ししました。
      - 語り: では、もしもの世界で、日本はどうなったのでしょうか。
        tone: 疑問
      - 語り: 西の平原にとどまっても、ハーンが亡くなれば、王子たちは跡目を争ったでしょう。モンケが亡くなったあと、クビライとアリクブケが争ったように。
      - 語り: 日本へ国書を出したのは、その争いを勝ち抜いて、中国を治めはじめたクビライでした。西の平原とは別の流れです。もしもの世界でも、国書と元寇は、来たと考えられます。
        figure: {type: table, title: もしも1242年に居すわっていたら、日本は（推論）, cols: [史実, もしも], rows: [[日本への国書, 1268年, 来た, 高い], [元寇, 1274年・1281年, 来た, 高い], [攻めてくる船の数, 記録のとおり, 変わったかも, 不明]], upto: 3, note: もしもは推論。右の札は見込みの高さ}
      - 語り: ただ、帝国の力の一部が、西の牧地に縛られていたら、海を渡る船の数は、変わったかもしれません。そこまでは、言い切れません。
        tone: しみじみ
      - 語り: ニシンの話から始まった旅は、日本の海まで届きました。
        figure: null
        hook: true
      - 語り: では、あの年のニシンは、何を知らせていたのでしょうか。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも1242年に引き返さなかったら
    background: {image: paintings/mongol_legnica_hedwig.jpg, credit: "『聖ヘドヴィヒ伝』の挿絵 レグニツァの戦い（1353年）"}
    lines:
      - 語り: もしも1242年の春、モンゴルの軍が、ハンガリーに居すわっていたら。
      - 語り: ハンガリーの平原は、ヴォルガ川の草原のように、帝国の牧地になりえたでしょう。けれど、その西には、石の城が待っていました。
      - 語り: 教皇は、仕えに来い、という言葉を、もっと近くで聞いたでしょう。病は、同じ道を通って、やはり届いたと考えられます。
      - 語り: そして日本への国書は、西の平原とは別の、東の流れの中から来ました。
      # fact: mongol-89
      - 語り: 歴史家の岡田英弘は、『世界史の誕生』で、世界史はモンゴル帝国とともに始まった、と説きました。
        tone: しみじみ
      # fact: mongol-12
      - 語り: 1238年、イングランドでニシンが安くなったのは、北の人々が、まだ見ぬ東の軍を恐れて、船を出さなかったからだ、とマシュー・パリスは書きました。
        tone: しみじみ
      - 語り: 世界は、そのときもう、1本の道でつながりはじめていたのです。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
