# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  東から来た軍のせいで、イングランドの魚が、投げ売りされました。1238年、よいニシンが40匹か50匹で銀貨1枚。ゴットランドやフリースラントの人々が、その軍を恐れて、港町ヤーマスへ船を出さなかったのです。
  3年後の1241年4月、その軍、モンゴルは、3日のあいだにポーランドとハンガリーで勝ちます。そして翌年、ハンガリーから去りました。
  もしも、あのとき引き返さなかったら、世界はどうなっていたのでしょうか。
  この動画でわかること
  ・西へ向かったモンゴルの軍は何人だったのか、記録ごとの違い
  ・1241年4月の3日間と、ハンガリーで冬を越そうとした軍のようす
  ・なぜ引き返したのか（オゴデイの死・知らせの速さ・草・天気・目的）、記録と研究者の説
  ・ハンガリーに居すわっていたら、城・ローマ教皇・ペスト・日本はどうなったのか
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（マシュー・パリス『大年代記』、プラノ・カルピニ『モンゴル人の歴史』、ロゲリウス『悲しみの歌』、ジュヴァイニー『世界征服者の歴史』、ラシード・ウッディーン『集史』、『元史』、イパーチー年代記、グユクの教皇あての返書、ジョワンヴィルの回想録、ルブルクの旅行記、ラッバン・サウマの旅の記録、ペゴロッティ『商業指南』、マルコ・ポーロ『東方見聞録』、第1リヨン公会議の決まり、テンプル騎士団の報告、S. ポウ、D. シノール、U. ビュントゲンとN. ディ・コスモ、Z. ピンケほか、J. ラスロフスキーほか、E. フュゲディ、P. ジャクソン、M. ウィーリス、O. J. ベネディクトウ、M. スピロウほか、S. G. ホー、岡田英弘、米国議会図書館・国立公文書館・国立国会図書館の資料など）を語りで示してから、今の言葉にして読んでいます。
  西へ向かった兵の数、引き返した理由、ペストで亡くなった人の割合は、記録や研究者によって書き方が割れています。
  モンゴル軍がハンガリーから引き返さなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、『聖ヘドヴィヒ伝』の挿絵（1353年）、元朝の皇帝の肖像（オゴデイ）（パブリックドメイン）と、画像生成AIで作った想像上の人物と風景です。
  サムネイルの人物像と風景は、画像生成AIによる想像図です。

en:
  title: "What If the Mongols Had Not Turned Back from Europe? How the World Would Have Changed"
  description: |-
    The army from the east made English fish cheap. In 1238, good herring sold forty or fifty for one piece of silver: the people of Gotland and Frisia, afraid of that army, did not send their ships to Yarmouth.
    Three years later, in April 1241, that army, the Mongols, won two battles in Poland and Hungary within three days. The next year, it left Hungary.
    If it had not turned back, how would the world have changed?
    In this video you will learn:
    - How many soldiers went west, and how the records disagree
    - The three days of April 1241, and the army that prepared to winter in Hungary
    - Why it turned back: the death of Ogedei, the speed of news, pasture, weather, and the aim of the campaign
    - What castles, the Pope, the Black Death and Japan might have faced if it had stayed
    Japanese-language history video (Japanese audio).
  chapters:
    - "Cheap Herring in England: 1238"
    - "How Many Soldiers Went West? 1227-1240"
    - "Three Days in April 1241: Legnica and Mohi"
    - "Wintering in Hungary: 1241-1242"
    - "Why Did They Turn Back?"
    - "Turning Point 1: The Wall of Castles"
    - "Turning Point 2: A Letter to the Pope"
    - "Turning Point 3: Plague and the Voyages West"
    - "Turning Point 4: As Far as Japan"
    - "Summary: If They Had Not Turned Back"

