# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  加藤清正は、二条城の会見で、懐に短刀を隠して豊臣秀頼を守った。そう語られてきました。ところが、会見の翌日に家康の側近が書いた報告では、迎えの場で清正が付き添っていたのは、秀頼ではなく、家康の10歳の息子です。
  そして会見から3か月足らずで、清正は熊本で亡くなります。江戸にいた息子は、父の死を知らないまま、「よくなっていると聞いてうれしい」と手紙を書いていました。
  当時の日記、江戸時代の前半の記録、およそ200年後の芝居、明治の伝記。清正の最期を、書かれた時代ごとに分けて並べました。
  この動画でわかること
  ・二条城の会見の日、清正は何をしていたのか（当時の日記と報告から）
  ・帰国のあと、口がきけなくなった最期と、遺言をめぐる記録の食い違い
  ・当時の記録に病名はあるのか。「虚の病」と書いた記事と、のちの病名の説
  ・毒饅頭の話は、いつ、どこで広まったのか
  ・清正の死の21年後、加藤家はどうなったのか
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  当時の記録は、『大日本史料』第十二編之八（慶長16年3月28日条・6月24日条。『当代記』『義演准后日記』『光豊公記』『慶長見聞録案紙』の本多正純の書状・加藤虎藤の書状・『清正記』『続撰清正記』『十竹斎筆記』『摂戦実録』を引く）、『史籍雑纂』第二（『当代記』『駿府記』）、中野嘉太郎『加藤清正伝』（1909）によります（国立国会図書館デジタルコレクション）。
  毒の話の広まりは、坪内逍遥・渥美清太郎編『歌舞伎脚本傑作集』、『音曲叢書』、三田村鳶魚『江戸の珍物』、頼山陽『日本外史』、依田学海『新評戯曲』、近藤瓶城『続日本政記』、岡本監輔『義勇芳軌』、伊原青々園ほか『舞台之団十郎』、鈴木力『清正公』、三浦周行『歴史と人物』、中山太郎『伝統と民俗』によります。
  その後の加藤家は、熊本日日新聞の連載「細川家文書を読む」（2025年）、笠谷和比古の論文（1990年）、観光庁の多言語解説文（本妙寺・丸岡城跡）、熊本日日新聞（本妙寺の頓写会）によります。
  年齢は数え年。日付は当時の暦（慶長16年6月24日は、今の暦で1611年8月2日）です。年数・日数の差は、記録の日付から計算し直したものです。記録によって日付・年齢・病名が違うところは、記録ごとに並べました。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Kato Kiyomasa: Why Did He Die So Suddenly After the Nijo Castle Meeting?"
  description: |-
    Kato Kiyomasa is said to have guarded Toyotomi Hideyori at the 1611 meeting at Nijo Castle with a dagger hidden in his robes. Yet a report written the next day by one of Ieyasu's aides says that when Hideyori was met on his way, Kiyomasa was escorting Ieyasu's ten-year-old son.
    Less than three months later, Kiyomasa died in Kumamoto. His son in Edo, not yet told, wrote that he was glad to hear his father was getting better.
    We sort the records by when they were written: diaries of the time, accounts from the early Edo period, plays from about two hundred years later, and Meiji-era biographies.
    In this video you will learn:
    - What Kiyomasa actually did on the day of the meeting
    - How he lost the ability to speak, and how the records disagree about his last words
    - Whether any record of the time names his illness
    - When and where the "poisoned bun" story spread
    - What happened to the Kato family 21 years later
    Records differ on dates, ages and causes. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Why Did Kiyomasa Die So Suddenly?"
    - "March 28, 1611: The Meeting at Nijo Castle"
    - "The Voyage Home and the Illness"
    - "No Name for the Illness in the Records of the Time"
    - "Where Did the Poison Story Come From?"
    - "Three Reasons to Doubt the Poison"
    - "The Kato Family After Kiyomasa"
    - "Summary: Why Did Kiyomasa Die?"

