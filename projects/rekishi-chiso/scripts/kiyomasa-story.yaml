sections:
  # ================================================================ 序章。答えの席：なぜ急に死んだのか
  - title: 二条城の会見のあと、清正はなぜ急に死んだのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1611
    lines:
      # fact: kiyomasa-21
      - 語り: 加藤清正は、二条城の会見で、懐に短刀を隠して、豊臣秀頼を守った。そう語られてきました。
      # fact: kiyomasa-11
      - 語り: ところが、会見の翌日の報告では、迎えの場で清正が付き添っていたのは、秀頼ではなく、家康の、《10歳の息子》でした。
        tone: 重い
      # fact: kiyomasa-14
      - 語り: そして会見から、3か月足らず。清正は、熊本で亡くなります。
        tone: 重い
      # fact: kiyomasa-15
      - 語り: 清正には、江戸に、11歳の息子がいました。その子は、父の死を知らないまま、父上がよくなっていると聞いてうれしい、と手紙を書いていました。
      - 語り: あの清正が、なぜ、急に死んだのか。
        tone: 疑問
      # fact: kiyomasa-43, kiyomasa-46
      - 語り: 家康に、毒饅頭を食べさせられた。そう聞いたことのある方も、多いでしょう。
      # fact: kiyomasa-07
      - 語り: けれど、その年の記録、『当代記』は、清正の死を、たった1行で書いています。毒の話も、病の名も、ありません。
      - 語り: 毒の話は、いつ、どこから来たのか。そして、当時の記録に残っていたのは、毒とは別の、ある言葉でした。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 会見の日
  - title: 1611年3月28日、二条城　清正は誰に付き添ったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1611
    lines:
      - 語り: 慶長16年、1611年の春。豊臣秀頼は、大坂城から、京都へ向かいます。
      # fact: kiyomasa-12
      - 語り: 京都の醍醐寺の僧、義演は、日記に書きました。秀頼さまは、7歳で伏見から大坂へ移って以来、初めて京に上られる。
      - 語り: 大坂へ移ってから、12年。秀頼は、このとき数えで19歳でした。
      # fact: kiyomasa-09
      - 語り: 前の日の3月27日。秀頼を、淀まで迎えに出た顔ぶれを、当時の記録、『当代記』は、こう並べます。
      # fact: kiyomasa-09
      - 語り: 家康の息子、12歳の義直と、10歳の頼宣。そして、池田輝政と、加藤清正。
        card: {head: "淀まで迎えに出た", body: "家康の息子2人・池田輝政・加藤清正"}
      # fact: kiyomasa-11
      - 語り: 会見の翌日、3月29日。家康の側近、本多正純が、江戸の老中たちに、報告の手紙を送っています。
      # fact: kiyomasa-11
      - 語り: 迎えの場で、義直には、浅野幸長が付き、頼宣には、加藤肥後守、つまり清正が付いた。
        tone: 重い
      - 語り: 迎えの場の清正は、記録の上では、家康の息子の付き添いだったのです。
      - 語り: 清正の娘は、のちに、この頼宣に嫁ぐことになります。
      # fact: kiyomasa-11
      - 語り: 一方、秀頼の供は、織田信長の弟の織田有楽、片桐且元、大野治長らと、番頭や小姓が30人ほどでした。
      # fact: kiyomasa-10
      - 語り: 3月28日、辰の刻。今の朝8時ごろ、秀頼は京に入り、二条の家康の御所へ向かいます。
      # fact: kiyomasa-10
      - 語り: 『当代記』によれば、家康は、庭まで出て、秀頼を迎えました。もてなしの膳は、わざと、吸い物だけでした。
      # fact: kiyomasa-10, kiyomasa-11
      - 語り: その場には、秀吉の妻だった高台院も、顔を見せています。
      # fact: kiyomasa-11
      - 語り: 本多正純の報告では、祝いの杯を交わし、刀を贈り合っています。
      # fact: kiyomasa-12
      - 語り: 城にいたのは、義演の日記では、一時ほど。今の2時間ほどです。
      # fact: kiyomasa-13
      - 語り: その日、家康を訪ねた公家の、勧修寺光豊は、会えませんでした。秀頼と対面して、くたびれた、という理由です。
      # fact: kiyomasa-12
      - 語り: 城を出た秀頼は、父、秀吉をまつる豊国社に参り、建てかけの大仏を見物します。
      # fact: kiyomasa-12
      - 語り: そして伏見で、ある人のもとに立ち寄りました。加藤清正です。
        tone: 重い
      # fact: kiyomasa-12
      - 語り: 義演は、そこから船に乗り、無事にお帰りになった、と書いています。近ごろ無い見物だった、とも。
      # fact: kiyomasa-21
      - 語り: では、懐の短刀の話は、どこから来たのか。江戸時代の軍記、『難波戦記』です。
      # fact: kiyomasa-21
      - 語り: 伏見で秀頼を船で送り出したあと、清正は、肌に隠していた刀を抜いて見て、鞘に納め、涙ながらに言った。秀吉公の御恩に、今日、報いた。
      # fact: kiyomasa-21
      - 語り: 江戸時代の書き留め、『武功雑記』は、秀頼の左右を、清正と浅野幸長が守った、と書きます。国に帰った清正は、太閤の御恩の半分は報いた、と言ったそうです。
      - 語り: 会見の日の記録に、清正の刀の話は、出てきません。けれど、秀頼が伏見で清正のもとに立ち寄ったことは、その日の日記に残っています。
      - 語り: この会見から、およそ2か月後。清正の体に、異変が起きます。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 帰りの船と病
  - title: 熊本へ帰る船の中で　口がきけなくなった清正
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1611
    lines:
      # fact: kiyomasa-14
      - 語り: 6月7日。義演のもとに、大坂城の大蔵卿局から、頼みが届きます。秀頼の母、淀殿に仕えた女性です。
      # fact: kiyomasa-14
      - 語り: 義演の日記には、その頼みが、こう書き留められています。加藤肥後守が、去る5月26日から、具合が悪い。回復の祈りを、お願いしたい。
        tone: 重い
      # fact: kiyomasa-14
      - 語り: 義演は、翌日から祈ります、と返事をしました。秀頼の側は、清正の病を、気にかけていたのです。
      - 語り: 5月26日は、会見から、およそ2か月後。今の暦では、7月の初めにあたります。
      # fact: kiyomasa-40
      - 語り: 病は、いつ、どこで始まったのか。江戸時代の前半にまとめられた、清正の一代記、『清正記』は、こう書きます。
      # fact: kiyomasa-40, kiyomasa-17
      - 語り: 熊本へ帰る船の中から、熱病を患った。
        card: {head: "『清正記』", body: "熊本へ帰る船の中から熱病"}
      # fact: kiyomasa-18
      - 語り: その続きとして、さらにあとで書かれた『続撰清正記』は、もう少し細かく書きます。
      # fact: kiyomasa-18
      - 語り: 5月の下旬に、熊本に着いた。船の中から、具合が悪かった。
      # fact: kiyomasa-18
      - 語り: そして、城に着いて2日か3日たつと、舌が不自由になり、もう、ひと言も、話すことができなくなった。
        tone: 重い
      - 語り: 朝鮮の戦場にまで渡った武将が、言葉を失ったのです。
      # fact: kiyomasa-17
      - 語り: ところが、ここで、2つの記録が食い違います。
        tone: 疑問
      # fact: kiyomasa-17
      - 語り: 『清正記』には、清正が、遺書を残し、家臣たちに遺言を伝える場面があります。
      # fact: kiyomasa-18
      - 語り: 『続撰清正記』は、それを、はっきり否定します。口がきけなかったのだから、幕府にも、家中にも、遺言は無かった。
      # fact: kiyomasa-18
      - 語り: 書き役の家臣に、遺書を書かせたというのは、大きなうそだ。
        tone: 重い
        figure: {type: table, title: 清正の最後の言葉　記録の違い, cols: [遺言, 遺書], rows: [[『清正記』, 家臣に遺言を伝えた, 遺書を残した], [『続撰清正記』, 口がきけず遺言は無い, 書かせた話は大うそ]], upto: 2}
      - 語り: 同じ清正の最期を、2つの記録が、正反対に書いているのです。
        figure: null
      # fact: kiyomasa-17, kiyomasa-40
      - 語り: 『清正記』によれば、死の前の日、6月23日には、清正の体は、焦げたように黒くなっていました。
      # fact: kiyomasa-17
      - 語り: そして、6月24日、丑の刻。今の夜中の2時ごろ。清正は、熊本で息を引き取ります。
        tone: 重い
        card: {head: "1611年6月24日", body: "熊本で死去"}
      # fact: kiyomasa-22, kiyomasa-18
      - 語り: 数えで50歳。系図や碑文によれば、生まれた日と同じ、6月24日でした。
      # fact: kiyomasa-22
      - 語り: ただ、明治の伝記が載せる碑文の1つには、享年51、とあります。年齢にも、1年のずれが残っています。
      # fact: kiyomasa-15
      - 語り: そのころ江戸には、清正の息子、数えで11歳の虎藤がいました。徳川への人質として、江戸に置かれていたのです。
      # fact: kiyomasa-15
      - 語り: 父が亡くなった4日後の、6月28日。虎藤は、母にあてて書きます。父上が、少しずつよくなっていると聞いて、うれしい。上方から、医者が向かうそうです。
      # fact: kiyomasa-15
      - 語り: 7月3日にも、家臣への手紙に、父上の病がよくなったと聞いて、満足だ、と書いています。父の死から、8日後のことでした。
        tone: 重い
      # fact: kiyomasa-14
      - 語り: 7月6日、義演は、日記に書き留めます。加藤肥後守が、先月24日に死去した。百万石あまりの大名だ。気の毒なことだ。
        tone: しみじみ
      - 語り: 百万石という数は、義演の書き方のままです。
      # fact: kiyomasa-38
      - 語り: 当時の記録で、清正の病の中身に触れた一文は、1つだけ。それも、死の2年後の、うわさ話でした。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 当時の記録の病名
  - title: 当時の記録に病の名はあるのか　1613年の「虚の病」
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1611
    lines:
      # fact: kiyomasa-37, kiyomasa-07
      - 語り: 『当代記』の、6月24日の記事は、これだけです。肥後の国の、加藤肥後守、死去。
        tone: 重い
      # fact: kiyomasa-37
      - 語り: 同じ月の17日には、出雲の大名、堀尾吉晴の死が載っています。こちらは、前の日の朝からの霍乱と、病名まで書いています。激しく吐いたり、下したりする病です。
      - 語り: それなのに、清正には、病の名も、毒の話も、ありません。
      # fact: kiyomasa-38
      - 語り: 清正の病に触れるのは、2年後、1613年の記事です。
      # fact: kiyomasa-38, kiyomasa-39
      - 語り: その年の8月25日、会見の日に清正と並んで家康の息子に付き添った、浅野幸長が死にます。『当代記』は、幸長の病を、唐瘡、今の梅毒と書きました。
      # fact: kiyomasa-38
      - 語り: そして、こう続けます。おととしの清正と、幸長の父、浅野長政。今年の池田輝政と、大久保長安。この人たちの死は、ひとえに、好色のせいの、虚の病だ、という。
        tone: 重い
        card: {head: "『当代記』1613年の記事", body: "好色のせいの、虚の病"}
      # fact: kiyomasa-39
      - 語り: ただ、唐瘡という病の名が付いているのは、幸長です。清正本人に、その言葉は付いていません。
      - 語り: 虚の病が、何を指すのか。記事は、それ以上を書きません。
      # fact: kiyomasa-38
      - 語り: 死の2年後の、うわさを交えた一文。今回たどった中で、清正の病を、色の道と結びつけた、いちばん古い記事です。
      # fact: kiyomasa-40
      - 語り: 江戸時代の前半の『清正記』では、熱病でした。
      # fact: kiyomasa-49
      - 語り: 大正5年、1916年。京都帝国大学の歴史学者、三浦周行は、別の見立てを出します。
      # fact: kiyomasa-49
      - 語り: 三浦は、こう考えました。熊本に着いて2日か3日で、口がきけなくなった。体は人並み外れて大きく、酒も、よく飲んだらしい。
      # fact: kiyomasa-49
      - 語り: そこから、脳溢血、今で言う脳の出血ではなかったか、としました。
        card: {head: "三浦周行 1916年", body: "脳溢血ではなかったか"}
      # fact: kiyomasa-50
      - 語り: 昭和16年、1941年。民俗学者の中山太郎は、梅毒だと書きます。朝鮮の陣でうつった病が、脳に回った、という見方です。
      # fact: kiyomasa-50
      - 語り: ただ、その出どころの史料の名は、挙げていません。
      - 語り: 「熱病」「虚の病」「脳溢血」「梅毒」。病の名は、書かれた時代ごとに、変わっていきます。
        figure: {type: table, title: 清正の病の名　書かれた時代の違い, cols: [記事の年・書かれた時期, 病の名], rows: [[『当代記』の清正の死の記事, 1611年の記事, 書いていない], [『当代記』の幸長の死の記事, 1613年の記事, 好色のせいの虚の病], [『清正記』, 江戸時代の前半, 熱病], [三浦周行, 1916年, 脳溢血か], [中山太郎, 1941年, 梅毒が脳に]], upto: 5}
      # fact: kiyomasa-51
      - 語り: ハンセン病だった、という話も聞かれます。ただ、明治と大正の記録に出てくるのは、清正はこの病にかかったが、法華経の祈りで治った、という熊本の言い伝えです。
        figure: null
      # fact: kiyomasa-51
      - 語り: 清正の死因を、この病とする出どころは、今回たどった記録の中には、見つかりませんでした。
      - 語り: では、毒の話は、いつ、誰が、言い出したのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 毒の話はどこから来たのか
  - title: 毒の話はどこから来たのか　186年後の毒酒の芝居と、明治の毒饅頭
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1797
    lines:
      # fact: kiyomasa-41
      - 語り: 毒の話を、大きく広めたのは、芝居でした。
      # fact: kiyomasa-41
      - 語り: 寛政9年、1797年の正月。大坂の中座で、歌舞伎、『けいせい遊山桜』が上演されます。毒の酒を飲まされる加藤清正を、筋に取り入れた芝居でした。
        card: {head: "1797年 大坂", body: "清正の死の186年後の芝居"}
      - 語り: 清正の死から、186年後のことです。
      # fact: kiyomasa-42
      - 語り: その10年後、文化4年、1807年の9月。大坂の道頓堀で、浄瑠璃、『八陣守護城』が始まります。
      # fact: kiyomasa-42
      - 語り: 清正の名は、字を入れ替えた、正清という名に変えられ、第四の段の題は、毒酒。
      # fact: kiyomasa-42
      - 語り: 家康にあたる人物の指図で、天皇の使いが、杯に毒を入れる筋でした。
      # fact: kiyomasa-44
      - 語り: 歴史の本は、どうか。頼山陽の『日本外史』は、文政10年、1827年に、元の老中、松平定信に差し出された本です。
      # fact: kiyomasa-44
      - 語り: 会見のあと、家康は、娘婿の池田輝政に命じて、清正と浅野幸長に、酒を与えさせた。
      # fact: kiyomasa-44
      - 語り: 毒とは、書いていません。そして数行あとに、清正の病死を置きます。
      # fact: kiyomasa-44
      - 語り: 明治の漢学者で劇評家の依田学海は、山陽が、わざわざ娘婿と書いて、疑いを残したのだ、と読みました。
      # fact: kiyomasa-46
      - 語り: 明治8年、1875年の10月。東京の河原崎座で、九代目、市川団十郎が、新しい清正を演じます。のちに、毒饅頭の清正と呼ばれる当たり役です。
        card: {head: "毒饅頭の清正", body: "1875年 河原崎座で初演"}
      # fact: kiyomasa-46
      # fact: kiyomasa-45
      - 語り: その4年後、明治12年、1879年。漢文の歴史の本も、毒をはっきり書き始めます。近藤瓶城の『続日本政記』には、ある人は言う、この日、家康に毒を盛られた、とあります。
      # fact: kiyomasa-45
      - 語り: 明治18年、1885年。岡本監輔の『義勇芳軌』は、さらに踏み込みます。池田輝政の酒は、実は毒だった。
      # fact: kiyomasa-45
      - 語り: 浅野幸長と池田輝政も、先に死んだ。おそらく、一緒に毒を盛られたのだろう。
      # fact: kiyomasa-45
      - 語り: けれど、実際には、幸長も輝政も、清正より後の、1613年に亡くなっています。先に死んだ、は、記録と合いません。
      # fact: kiyomasa-43
      - 語り: 大正2年、1913年。三田村鳶魚の本は、こんな俗説を紹介しています。清正は、伏見の屋敷で、毒と知りながら饅頭を食べたが、法華経のおかげで、そのあと3年、生きていた。
      # fact: kiyomasa-19
      - 語り: 書かれた年の分からない、江戸時代の書き物にも、毒の話はあります。随筆、『十竹斎筆記』です。
      # fact: kiyomasa-19
      - 語り: 会見の席で、針で何度も刺して、蜂の巣のようになった饅頭が出された。清正と浅野幸長は、その毒にあたって、国元で死んだ。秀頼は、食べなかった。
        tone: 重い
      # fact: kiyomasa-20
      - 語り: 軍記の『摂戦実録』では、家康の重臣、平岩親吉が、もてなしの席で、自分も一緒に毒を食べた、という筋です。
      # fact: kiyomasa-47
      - 語り: 毒を盛った人物は、本によって違います。池田輝政。平岩親吉。家康の側近の、本多正信。京都所司代の、板倉の家。
        figure: {type: table, title: 毒を盛ったのは誰か　本ごとの違い, cols: [出てくる本, 年], rows: [[池田輝政, 『義勇芳軌』ほか, 1885年ほか], [平岩親吉, 『摂戦実録』・明治の絵本, 江戸時代・1886年ほか], [本多正信, 三浦周行・中山太郎が紹介, 1916年ほか], [京都所司代の板倉の家, 関根郡平の本, 1935年]], upto: 4}
      # fact: kiyomasa-47, kiyomasa-43
      - 語り: 場所も、「伏見の屋敷」「二条城」「大坂城」と、割れています。
        figure: null
      # fact: kiyomasa-19
      - 語り: 明治の終わりに、国の史料の大きな本、『大日本史料』をまとめた人たちは、こうした毒殺の記事に、注を付けています。
      # fact: kiyomasa-19
      - 語り: もとより、疑うべきものだが、しばらく、ここに載せておく。
        tone: 重い
      - 語り: では、毒の話は、作り話だったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 否定した伝記
  - title: 毒饅頭は作り話なのか　1909年の伝記が挙げた3つの理由
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1909
    lines:
      # fact: kiyomasa-48
      - 語り: 明治42年、1909年。鈴木力の伝記、『清正公』には、毒饅頭の説は作り話だ、という章があります。
      # fact: kiyomasa-48
      - 語り: 理由の1つめ。清正の家臣たちの書き残したものに、毒の話は、ひと言も無い。
      # fact: kiyomasa-48
      - 語り: 2つめ。病の床には、重臣と医師が付き添っていた。
      # fact: kiyomasa-48
      - 語り: 3つめ。大坂を船で発ってから、50日以上も生きている。
        figure: {type: table, title: 鈴木力『清正公』　毒饅頭を否定した理由, cols: [理由, ""], rows: [[1つめ, 家臣の書き残したものに毒の話が無い, ""], [2つめ, 重臣と医師が付き添っていた, ""], [3つめ, 大坂を発って50日以上生きた, ""]], upto: 3}
      # fact: kiyomasa-48
      - 語り: 鈴木は、熱病というのが、歴史家の定まった見方だ、としました。
        figure: null
      # fact: kiyomasa-49
      - 語り: 三浦周行も、本多正信に毒を盛られたという話を、会見から3か月近くたってからの死では、毒の効き目が遅すぎる、と退けました。
      - 語り: 計算すると、会見の3月28日から、死の6月24日までは、84日。病が始まった、5月26日からでも、27日です。
        card: {head: "会見から死まで", body: "84日"}
      # fact: kiyomasa-14
      - 語り: しかも、病の始まりを、会見から57日後の5月26日と書くのは、清正が生きていたときの、当時の日記です。会見の席の毒なら、2か月近く、何も起きなかったことになります。
      - 語り: 毒とする話は、どれも、ずっとあとのもの。今回たどった、清正が亡くなった年の記録に、毒の話はありません。
      - 語り: もっとも、それで、病の名まで分かるわけでは、ありません。
      # fact: kiyomasa-16
      - 語り: 清正が亡くなったあと、家康のそばでは、何が起きていたのか。
      # fact: kiyomasa-16
      - 語り: 家康の近くで書かれた『駿府記』は、8月4日、将軍、秀忠の使いが、駿府の家康に伺いを立てたと書きます。
      # fact: kiyomasa-16
      - 語り: 加藤肥後守の跡を、その子に継がせてよいか。江戸で手紙を書いていた、あの虎藤です。家康は、そのまま跡を立てるように、と答えました。
      - 語り: 清正の死から、40日足らずのことです。
      # fact: kiyomasa-16
      - 語り: 8月24日。人質として江戸にいた虎藤は、父の死で国へ帰る途中、駿府で、家康の前に出ます。
      # fact: kiyomasa-16
      - 語り: 差し出したのは、金50枚と、銀100枚でした。
        card: {head: "1611年8月24日", body: "清正の息子が家康に目通り"}
      - 語り: 数えで11歳。清正の跡は、この少年に渡されました。
      - 語り: 清正の死が急だったことは、残された少年と、加藤家の行く末にも、影を落とします。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 その後の加藤家
  - title: 清正の死から21年　1632年、加藤家の改易
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1632
    lines:
      # fact: kiyomasa-31
      - 語り: 清正の墓は、熊本の本妙寺の、浄池廟にあります。寺は、清正の死後、1616年に、この地へ移されました。
      # fact: kiyomasa-31
      - 語り: 観光庁の解説文によれば、廟の本殿のいちばん上は、熊本城の大天守と、同じ高さに造られています。
      # fact: kiyomasa-31
      - 語り: 清正の墓の隣には、清正が亡くなったとき、あとを追って命を絶った、2人の家臣の墓があります。
      # fact: kiyomasa-32
      - 語り: 本妙寺では、毎年7月23日の夜、頓写会という行事が、今も続いています。法華経を、ひと晩で書き写して、清正を供養するものです。
      # fact: kiyomasa-23
      - 語り: 大人になった虎藤は、加藤忠広と名乗ります。そして、清正の死から21年後。寛永9年、1632年の6月3日。幕府の老中たちの名で、1通の文書が出されます。
      # fact: kiyomasa-23
      - 語り: 加藤忠広は、近年、何事にも無作法で、そのうえ、けしからぬことを起こした。よって国を取り上げ、出羽の庄内に預ける。
        tone: 重い
        card: {head: "1632年6月3日", body: "加藤家の改易"}
      # fact: kiyomasa-23
      - 語り: 熊本の細川家に伝わった、この文書を、2025年、熊本日日新聞の連載が紹介しています。
      - 語り: 忠広は、このとき数えで32歳。清正の築いた国は、2代で失われました。
      # fact: kiyomasa-24
      - 語り: 熊本の家臣たちは、城に籠もって戦うかどうかを、決められませんでした。
      # fact: kiyomasa-24
      - 語り: それを聞いた細川忠興は、6月29日の手紙に、予想どおりだ、と書いています。
      # fact: kiyomasa-27
      - 語り: 歴史学者の笠谷和比古は、1990年の論文で、この改易を、福島正則の改易と並ぶ、大名改易の二大疑獄と呼びました。
      # fact: kiyomasa-25
      - 語り: その年の12月。細川忠利が、新しい城主として、熊本城に入ります。
      # fact: kiyomasa-25
      - 語り: 入った翌日、忠利は、江戸の息子へ、自分の筆で書き送りました。これほど大きな城は、江戸城のほかに、見たことがない。
        tone: しみじみ
      # fact: kiyomasa-26
      - 語り: ところが、父の忠興は、同じ12月の手紙で、清正をこう評しています。清正ほど、礼儀を知らない者はまれだった。
      - 語り: 大きな城を築いた清正は、細川忠興の目には、そう映っていたのです。
      # fact: kiyomasa-29
      - 語り: 忠広は、出羽の丸岡、今の山形県鶴岡市で、1万石を与えられ、そこで、およそ21年を過ごし、1653年に亡くなりました。
      # fact: kiyomasa-30
      - 語り: 丸岡では、父、清正のための碑も建てています。その石は、熊本の石だった、と大正7年、1918年の熊本県の調べが確かめています。
      # fact: kiyomasa-30
      - 語り: 近くの天澤寺では、清正の遺骨と、よろいかぶとが見つかった、とされます。見つかった年は、観光庁の解説文の日本語では1945年、英語では1949年と、食い違っています。
      - 語り: 会見の日の清正から、もう一度、たどります。
        tone: 疑問
        hook: true

  - title: まとめ：二条城の会見のあと、清正はなぜ急に死んだのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: kiyomasa-11, kiyomasa-12
      - 語り: 1611年3月28日。記録に残る清正は、家康の息子の付き添いとして秀頼を迎え、帰り道の秀頼を、伏見でもてなした人でした。
        tone: しみじみ
      # fact: kiyomasa-14
      - 語り: その2か月後の5月26日に、具合が悪くなり、6月24日、熊本で亡くなります。会見から、84日。
        tone: しみじみ
      # fact: kiyomasa-18
      - 語り: 熊本に着いて2日か3日で、口がきけなくなった、と江戸時代の記録は書きます。遺言があったのか、無かったのか。その記録どうしも、割れています。
        tone: しみじみ
      # fact: kiyomasa-07, kiyomasa-38
