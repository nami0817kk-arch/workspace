# 1本に1つの問い＝「二条城の会見のあと、清正はなぜ急に死んだのか」。答えの席＝死因（毒か病か）。題名で言い切らない（当時の記録に病名は無い）。清正が主役のまま。
#   冒頭（10秒以内）＝誰でも知る一点「懐に短刀を隠して秀頼を守った」→ 会見の翌日の報告では、清正が付き添ったのは家康の10歳の息子（kiyomasa-11・21）。
#   続く意外な一点＝江戸の息子は父の死後も「よくなっていると聞いてうれしい」と手紙を書いていた（kiyomasa-15）。
# 記録の食い違い：①遺言（『清正記』遺書・遺言の場面／『続撰清正記』「口がきけず遺言は無い、遺書は大うそ」。kiyomasa-17・18）
#   ②病の名（当時の日記・『当代記』は病名なし／『清正記』熱病／『当代記』2年後の記事「好色の故、虚の病」／三浦周行 脳溢血／中山太郎 梅毒。kiyomasa-07・38・40・49・50）
#   ③毒を盛った人と場所（池田輝政・平岩親吉・本多正信・板倉の家／伏見・二条城・大坂城。kiyomasa-47）
#   （小）享年：数え50（続撰「春秋五十歳」）／碑文「享年五十有一」（kiyomasa-22）。頓写会の始まり：一周忌／三回忌（kiyomasa-32）
# 計算（自分で計算し直した）：生まれ 永禄5年（1562）→ 1611年 数え50（1611−1562+1）。誕生日と命日はどちらも6月24日。
#   会見 3月28日＝1611年5月10日（グレゴリオ暦）、病の始まり 5月26日＝7月6日（57日後≒およそ2か月後）、死 6月24日＝8月2日（会見から84日≒3か月足らず、病から27日≒1か月足らず）。
#   慶長16年に閏月は無い（3月28日→6月24日が84日で、閏が無いときの2か月と26日に合う）。
#   息子の手紙 6月28日＝死の4日後、7月3日＝死の8日後（国立天文台の暦日DBで6月は小の月：6/24＝8/2、7/3＝8/10）。義演が死を書いた 7月6日＝8/13＝11日後。駿府記の跡目 8月4日＝9/10＝39日後（「40日足らず」と言う）。
#   秀頼 文禄2年（1593）生まれ→1611年 数え19。7歳で伏見から大坂へ（1599。義演「御七歳ノ時、伏見ヨリ大坂ヘ御移徙」）→大坂へ移ってから12年で初めての上洛。家康の子 義直 数え12・頼宣 数え10（当代記の書き方どおり）。
#   毒の話の年：1797（死の186年後）・1807（196年後）・1827（216年後）・1875（264年後）・1879（268年後）・1885（274年後）・1909（298年後）・1916（305年後）・1941（330年後）。当代記の「虚の病」の記事は1613年＝2年後。
#   忠広 1601年生まれ→相続 1611年 数え11、改易 1632年（寛永9）数え32＝清正の死の21年後、死 1653年＝丸岡で約21年。頓写会 一周忌＝1612年、三回忌＝1613年。
