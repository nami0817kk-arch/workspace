sections:
  # ================================================================ 序章
  - title: 「いちばん多い理由は跡継ぎ」　202件のうち絶えたのは73件
    lines:
      # fact: kaieki-13
      - 語り: 江戸幕府は、罪をとがめて、大名を次々に取りつぶした。そう思われがちです。けれど、取りつぶしの理由でいちばん多かったのは、戦でも、謀反でもなく、跡継ぎがいないこと、でした。
        tone: 重い
        card: {head: "いちばん多い理由", body: 跡継ぎがいない}
      # fact: kaieki-12
      - 語り: ある歴史学者が、江戸の初めの106年間を数え直すと、大名の改易は、202件。
      # fact: kaieki-14
      - 語り: ところが、そのうち、家が跡形もなく絶えたのは、73件。3件に1件ほどしか、ありません。
      # fact: kaieki-07, kaieki-45
      - 語り: 別の歴史学者、藤野保さんの数では、最初の50年あまりで、取りつぶされた大名は200を超え、取り上げた石高は、1800万石を超えます。
      - 語り: その取りつぶしは、なぜ、そのあと減っていったのか。
        tone: 疑問
      - 語り: その答えは、慶安4年の、ある知らせと、記録に書かれた、改易の2文字に残っています。
      # fact: kaieki-21
      - 語り: ある記録に、改易と書かれた大名は、江戸の後半の200年あまりで、たった4家でした。
        hook: true
      - 語り: まずは、取りつぶされた大名が、何家だったのかを、数えます。
        hook: true

  # ================================================================ 第1章 何家が取りつぶされた？
  - title: 「取りつぶされた大名は何家？」　224名・217家・240家
    lines:
      - 語り: 改易。大名の領地を取り上げ、家を取りつぶすことです。
        card: {head: "改易", body: 領地を取り上げ、家を取りつぶす}
      # fact: kaieki-23
      - 語り: ただ、何を改易に数えるかで、数そのものが変わります。
      # fact: kaieki-45
      - 語り: 藤野保さんが、世界大百科事典の改易の項に書いた数です。家康、秀忠、家光の3代で、改易された大名は、外様が82名、徳川の一門と譜代が49名。合わせて131名です。
        figure: {type: bars, title: 3代で改易された大名（藤野保の数）, bars: [[外様, 82], [一門・譜代, 49]], labels: [82名, 49名]}
      # fact: kaieki-45
      - 語り: 取り上げた石高は、1200万石あまりです。
        tone: 重い
        card: {head: "1200万石あまり", body: 3代で取り上げた石高}
      # fact: kaieki-07, kaieki-08
      - 語り: この131名に、関ヶ原の戦いのあとの処分の93名を足すと、224名。藤野さんが、大名の項に書いた数と、ぴったり合います。
        figure: {type: calc, title: 最初の50年あまりで処分された大名（藤野保の数）, terms: [[93名, 関ヶ原の処分], [131名, 家康・秀忠・家光の3代], [224名, 大名の項の数]], ops: [＋, ＝]}
      # fact: kaieki-09
      - 語り: ところが、同じ事典の浪人の項を書いた北原章男さんは、3代の50年間に、改易と、領地を削る減封となった大名を、217家としています。
        tone: 疑問
        figure: null
      # fact: kaieki-24
      - 語り: さらに、作家の南條範夫さんの本、大名廃絶録の版元の紹介では、関ヶ原のあとに、取りつぶされたり、領地を削られたりした大名の家は、240と書かれています。
      - 語り: 領地を削られただけの家を数えるか。関ヶ原を入れるか。数え方が違えば、家の数も、石高も、そろわないのです。
      # fact: kaieki-12
      - 語り: 1998年、歴史学者の福田千鶴さんは、幕府がまとめた大名と旗本の系譜から、1708年までの106年間の改易を、1件ずつ数えました。
      - 語り: その数が、冒頭の202件です。
      # fact: kaieki-20
      - 語り: 福田さんは、藤野さんが、領地を分けて旗本になった例まで、改易に数えている、とも書いています。
      # fact: kaieki-21
      - 語り: そして、1987年に論文を書いた藤田恒春さんは、取りつぶされた大名を並べた、廃絶録という記録を調べました。そこに改易と書かれた大名は、15家しかありませんでした。
        tone: 重い
        card: {head: "廃絶録の「改易」", body: 15家だけ}
      - 語り: では、時代ごとに、どんな理由で、家は消えていったのか。
        hook: true
      - 語り: 最初に家を消したのは、いちばん分かりやすい理由でした。
        hook: true

  # ================================================================ 第2章 戦が終わると？
  - title: 「戦が終わると何が変わった？」　1615年と家康の息子
    lines:
      # fact: kaieki-10
      - 語り: 藤野さんは、大名の改易の、第一の理由を、戦によるものとしています。
      # fact: kaieki-20
      - 語り: その最後は、元和元年、1615年。大坂の陣で滅んだ豊臣家と、それに通じたとして処分された古田家の改易だ、と藤野さんは著書に書きました。
        card: {head: "1615年", body: 戦による改易が終わる}
      # fact: kaieki-10
      - 語り: 戦が終わると、戦による改易は、なくなります。代わって、跡継ぎが絶えることと、幕府の法に背くことが、改易の、おもな理由になりました。
        tone: 重い
      # fact: kaieki-54
      - 語り: 戦が終わった翌年、元和2年、1616年。改易されたのは、家康の六男、松平忠輝でした。越後の高田の城主です。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10]], note: 本編で語る家}
      # fact: kaieki-55
      - 語り: 日本大百科全書では、60万石。川中島を合わせて75万石とする辞典もあります。家康の息子が、それほどの領地を失ったのです。
      # fact: kaieki-56
      - 語り: 理由は、大坂の陣で、戦いに遅れたこととされます。ただ、ブリタニカ国際大百科事典は、キリシタンや外国との貿易に深く関わっていたため、とする説も挙げています。
        figure: null
      # fact: kaieki-54
      - 語り: 忠輝は、伊勢の朝熊に流され、飛騨の高山、信濃の諏訪へと移されて、天和3年、1683年に、諏訪で亡くなりました。改易から、67年後です。
        tone: しみじみ
      # fact: kaieki-58
      - 語り: 7年後の1623年の2月には、家康の孫、越前の福井の松平忠直が、改易されます。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06]], note: 本編で語る家}
      # fact: kaieki-58
      - 語り: 家臣を手討ちにするなど、乱れたふるまいを重ね、江戸へ出ることも怠った、と辞典は書きます。豊後の萩原に流されました。
        figure: null
      # fact: kaieki-58
      - 語り: 福井は弟が継ぎ、忠直の子の光長は、越後の高田へ移されます。この光長の家は、60年近くのちに、もう一度、取りつぶされることになります。
        hook: true
      - 語り: 戦の次に、多くの家を消したのは、もっと静かな理由でした。
        hook: true

  # ================================================================ 第3章 跡継ぎがいないと？
  - title: 「跡継ぎがいないとどうなる？」　松平忠吉・蒲生・堀尾
    lines:
      # fact: kaieki-27
      - 語り: 跡継ぎのいない当主が、重い病になってから、急いで願い出る養子。これを、末期養子と呼びます。
        card: {head: "末期養子", body: 死の間際に願い出る養子}
      # fact: kaieki-27, kaieki-45
      - 語り: 江戸の初め、幕府は、この末期養子を、認めませんでした。藤野さんは、跡継ぎが絶えたことが改易の理由になったのは、とくに末期養子を禁じたからだ、とみています。
      # fact: kaieki-50
      - 語り: 実は、戦の時代から、それは始まっていました。慶長12年、1607年の3月5日。家康の四男、尾張の清洲52万石の松平忠吉が、28歳で亡くなります。跡継ぎはなく、家は絶えました。
      # fact: kaieki-52
      - 語り: 会津の蒲生家では、2度、同じことが起きました。寛永4年、1627年、兄の忠郷が、跡継ぎのないまま亡くなり、会津の60万石を取り上げられます。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49]], note: 本編で語る家}
      # fact: kaieki-52
      - 語り: 弟の忠知が、伊予の松山へ移って、家を継ぎました。
        figure: null
      # fact: kaieki-51
      - 語り: 寛永10年、1633年の9月20日。出雲と隠岐、24万石の堀尾忠晴が、35歳で亡くなり、跡継ぎがなく、家は絶えます。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47]], note: 本編で語る家}
      # fact: kaieki-52
      - 語り: その翌年、寛永11年、1634年の8月18日。蒲生の弟の忠知も、30歳で、跡継ぎのないまま亡くなり、蒲生家は絶えました。
        tone: 重い
        figure: null
      # fact: kaieki-13
      - 語り: 福田さんの数では、1708年までの106年間の改易202件のうち、跡継ぎがいないことによるものが、75件。理由の中で、いちばん多く、およそ37%です。
        figure: {type: bars, title: 改易の理由（福田千鶴の数、1603〜1708年）, bars: [[跡継ぎがいない, 75], [ふるまい, 61], [政治の理由, 32], [家臣の争い, 25], [領地を分けた, 6], [幼い当主, 3]], labels: [75件, 61件, 32件, 25件, 6件, 3件]}
      # fact: kaieki-15
      - 語り: その75件は、外様が43、譜代が29、一門が3。そのうち、家ごと絶えたのは、33件でした。
      # fact: kaieki-15
      - 語り: 残る42件は、兄弟や甥などに、家を継がせることが許されています。跡継ぎのいなかった家の、半分あまりは、形を変えて残ったのです。
        figure: null
      # fact: kaieki-43
      - 語り: 福田さんは、元和の時代の、跡継ぎによる断絶は8件と少なく、幕府がこれを、大名を抑える道具として、積極的に使った跡は無い、とみています。
      # fact: kaieki-43
      - 語り: 家光の時代に、跡継ぎがなく、家まで絶えたのは、外様が9、譜代が5、一門が1の、15件です。
      # fact: kaieki-36
      - 語り: 大名の側から、末期養子を願い出た例として、福田さんが調べた中でいちばん早いのは、寛永6年、1629年の9月に亡くなった、桑山貞晴です。
      - 語り: 跡継ぎの次に多かった理由は、大名本人にありました。
        hook: true
      - 語り: その中には、家康の側近や、将軍の弟も、いました。
        hook: true

  # ================================================================ 第4章 将軍の身内でも？
  - title: 「将軍の身内でも改易？」　本多正純と駿河の忠長
    lines:
      # fact: kaieki-13
      - 語り: 福田さんの表では、大名のふるまいによる改易が61件。政治の理由が32件です。
      # fact: kaieki-60
      - 語り: 元和8年、1622年。家康の側近だった本多正純が、宇都宮15万5000石を、失います。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56]], note: 本編で語る家}
      # fact: kaieki-60
      - 語り: このとき正純は、改易された山形の最上家の城を受け取るため、山形にいました。その留守のあいだに、自分も改易されたのです。
        tone: 重い
        figure: null
      # fact: kaieki-63
      - 語り: この改易には、後の世に広まった話があります。正純が、宇都宮の城に、天井が落ちる仕掛けを作り、泊まりに来る将軍の秀忠を、殺そうとした。宇都宮の釣天井です。
        tone: 疑問
      # fact: kaieki-62
      - 語り: けれど、歴史学者の高木昭作さんは、日本大百科全書で、この話を、偽りだ、と言い切っています。
        tone: 重い
      # fact: kaieki-63
      - 語り: 高木さんによると、元になったのは、秀忠が、急に宇都宮をたって、夜通しで江戸へ戻ったこと。それが、正純の改易や、別の大名の謀反のうわさと結びついて、できた話と考えられます。
        card: {head: "宇都宮の釣天井", body: 後の世にできた話}
      # fact: kaieki-62
      - 語り: 高木さんは、改易の本当の原因を、秀忠との、政治の上の対立とみています。
      # fact: kaieki-60
      - 語り: 正純は、出羽の由利へ流され、のちに横手に移されて、寛永14年、1637年に亡くなりました。改易から、15年後です。
      # fact: kaieki-64
      - 語り: もう1人は、3代将軍、家光の弟、徳川忠長です。駿府の城で、駿河と遠江と甲斐を治めていました。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98]], note: 本編で語る家}
      # fact: kaieki-64, kaieki-65
      - 語り: 寛永8年、1631年、乱れたふるまいをとがめられて、甲府に閉じこめられます。翌年、父の秀忠が亡くなると、上野の高崎へ移され、領地を取り上げられました。
        figure: null
      # fact: kaieki-64
      - 語り: 寛永10年の12月6日。忠長は、高崎で、自ら命を絶ちました。
        tone: しみじみ
      # fact: kaieki-17
      - 語り: ただ、ふるまいによる改易の61件のうち、家ごと絶えたのは、18件。3割ほどです。残る43件は、何かの形で、家を継ぐことが許されました。
      # fact: kaieki-18
      - 語り: 逆に、政治の理由による32件では、15件が絶えています。半分近く。福田さんは、幕府は、政治の理由による改易には、強い姿勢で臨んだ、とみています。
      - 語り: そして、大名本人ではなく、家臣たちの争いで、国を失った家もあります。
        hook: true
      - 語り: その家が、大名に戻るまでには、200年を超える時がかかりました。
        hook: true

  # ================================================================ 第5章 家臣の争いで？
  - title: 「家臣の争いで国を失う？」　讃岐の生駒騒動
    lines:
      # fact: kaieki-13
      - 語り: 福田さんの表で、家臣の争いによる改易は、25件です。家の中の争いは、御家騒動と呼ばれます。
      # fact: kaieki-66
      - 語り: 讃岐の高松、17万石あまりの、生駒高俊です。家臣どうしの争いが、大きくなりました。生駒騒動です。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98], [高松, 134.05, 34.35]], note: 本編で語る家}
      # fact: kaieki-66
      - 語り: 寛永17年、1640年、生駒家は、讃岐の全部の領地を取り上げられます。争った家老たちは、切腹や死罪になりました。
        tone: 重い
        figure: null
      # fact: kaieki-66
      - 語り: 高俊には、暮らしのための1万石が与えられ、出羽の矢島へ移されました。
        figure: {type: bars, title: 生駒家の石高（万石）, bars: [[讃岐の高松, 17], [出羽の矢島, 1]], labels: [17万石あまり, 1万石]}
      # fact: kaieki-68
      - 語り: 万治2年、1659年、高俊の子の高清は、弟に2000石を分けて、8000石の旗本になります。交代寄合という、大名に近い扱いの家格でした。
        figure: null
      # fact: kaieki-68
      - 語り: そして、明治元年、1868年。新しい政府に力を貸した功で、1万5000石となり、矢島藩が、ふたたび立ちました。讃岐を失ってから、228年後のことです。
        tone: しみじみ
        card: {head: "生駒家", body: 228年後に大名へ戻る}
      # fact: kaieki-25
      - 語り: 家臣の争いで改易された家として、辞典は、池田騒動、生駒騒動、越後騒動を挙げています。越後騒動は、あとで出てくる、高田の光長の家の騒動です。
      - 語り: 生駒家が讃岐を失った11年後。幕府は、改易のもとになっていた決まりを、緩めます。
        hook: true
      - 語り: その年は、将軍が亡くなり、江戸で大きな事件が起きた年でした。
        hook: true

  # ================================================================ 第6章 慶安4年に何が変わった？
  - title: 「慶安4年に何が変わった？」　末期養子の禁を緩める
    lines:
      # fact: kaieki-31
      - 語り: 慶安4年、1651年の4月20日。3代将軍の家光が亡くなります。
      # fact: kaieki-32
      - 語り: 7月23日、江戸の町奉行が、密告を受けます。由井正雪たちが、幕府を倒そうとした、という計画でした。慶安事件です。
        card: {head: "慶安4年7月", body: 慶安事件が明るみに}
      # fact: kaieki-31
      - 語り: 8月18日、家光の子の家綱が、4代将軍になりました。
      # fact: kaieki-48
      - 語り: このころ、主家を失った牢人は、どれほどいたのか。世界大百科事典の浪人の項は、1650年までに、40万から50万の浪人が生まれたと推定されている、と書いています。
        tone: 疑問
      # fact: kaieki-48
      - 語り: けれど、日本大百科全書の慶安事件の項を書いた高木昭作さんは、こうした何十万という推計は大きすぎて、支持しがたい、としています。
      # fact: kaieki-30
      - 語り: そして、同じ慶安4年の12月11日。50歳に満たない大名と旗本に、末期養子を認める、という知らせが出されました。
        tone: 重い
        card: {head: "慶安4年12月11日", body: 末期養子の禁を緩める}
      # fact: kaieki-33
      - 語り: 山川出版社の日本史小辞典は、牢人を生むもとになる改易を減らすために、末期養子の禁を緩めた、と説明しています。慶安事件のあとの手当て、という見方です。
      # fact: kaieki-34
      - 語り: ただ、福田さんは、それより前から、末期養子を許した例があることを、紹介しています。寛永17年、1640年の、黒田之勝の例です。
      # fact: kaieki-34
      - 語り: 福田さんは、慶安事件は、直接のきっかけではない。けれど、決まりにするのを早めた、という意味でのつながりは認めてよい、としています。
      # fact: kaieki-35
      - 語り: さらに、2022年に論文を出した三宅正浩さんは、この緩和は、もともと旗本向けの決まりを改めたもので、慶安事件をきっかけとする説明には疑問がある、と論じている、とされます。
        tone: 疑問
      - 語り: 緩めた理由は、研究によって、いまも分かれているのです。
      # fact: kaieki-70
      - 語り: 緩和の9年後、万治3年、1660年には、下総の佐倉、10万石あまりの堀田正信が、改易されました。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98], [高松, 134.05, 34.35], [佐倉, 140.22, 35.72]], note: 本編で語る家}
      # fact: kaieki-70
      - 語り: 老中たちの政治を批判する書き付けを、将軍の家綱へ差し出し、許しを得ずに、佐倉へ帰ったためでした。
        figure: null
      # fact: kaieki-70
      - 語り: 正信は、大名の家に次々と預けられ、延宝8年、1680年の5月20日、家綱の死を聞いて、自ら命を絶ちました。
        tone: しみじみ
      # fact: kaieki-16
      - 語り: 一方、福田さんの数では、この緩和を境に、跡継ぎがいないための改易は、減っていきます。
        tone: 重い
      # fact: kaieki-44
      - 語り: なくなりは、しませんでした。寛文4年、1664年、米沢の上杉綱勝が、27歳で急に亡くなります。末期養子は許されましたが、30万石は、半分の15万石に減らされました。
      - 語り: 取りつぶすかわりに、家を小さくして残す。そんな処分も、見えてきます。
      - 語り: その家綱の死のあと、改易は、また大きく増えます。
        hook: true
      - 語り: 今度、改易の的になったのは、徳川の身内と、譜代の家でした。
        hook: true

  # ================================================================ 第7章 綱吉の時代
  - title: 「綱吉の時代に何が起きた？」　越後騒動と天和の治
    lines:
      # fact: kaieki-11
      - 語り: 藤野さんによると、外様大名が中心だった改易は、4代家綱のころから変わり、5代綱吉の時代には、徳川の一門と譜代が中心になりました。
      # fact: kaieki-74, kaieki-09
      - 語り: 世界大百科事典の天和の治の項を書いた辻達也さんは、綱吉の初めの政治で、改易や減封を受けた大名は46家、旗本は100家あまりに達した、と数えています。
        card: {head: "綱吉の初めの政治で", body: 改易・減封の大名46家}
      # fact: kaieki-73
      - 語り: その始まりが、越後の高田、26万石の松平光長でした。第2章で、高田へ移された、忠直の子です。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98], [高松, 134.05, 34.35], [佐倉, 140.22, 35.72]], note: 本編で語る家}
      # fact: kaieki-73
      - 語り: 家臣どうしの争い、越後騒動は、一度は大老の酒井忠清が裁いていました。ところが綱吉は、その裁きを覆し、天和元年、1681年、自ら裁いて、光長を改易します。
        tone: 重い
        figure: null
      # fact: kaieki-74
      - 語り: 辻さんは、親藩の筆頭の越後松平家を取りつぶしたことを、綱吉の処分の手始めとしています。
      # fact: kaieki-73
      - 語り: 光長は、伊予の松山へ流され、貞享4年、1687年に許されます。家は、元禄11年、1698年、養子の宣富が、美作の津山10万石で立て直しました。改易から、17年後です。
      # fact: kaieki-72
      - 語り: 光長の改易の前の年、延宝8年、1680年には、家綱の法会の警備をしていた、志摩の鳥羽の内藤忠勝が、同じ警備役の大名を斬り殺し、切腹。内藤家は絶えました。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98], [高松, 134.05, 34.35], [佐倉, 140.22, 35.72], [鳥羽, 136.84, 34.48]], note: 本編で語る家}
      # fact: kaieki-75
      - 語り: 21年後の元禄14年、1701年、江戸城の松之廊下で、赤穂の浅野長矩が、切りつけた事件も、即日の切腹と改易でした。
        figure: null
      # fact: kaieki-38
      - 語り: その綱吉が、天和3年、1683年に出した武家諸法度は、50歳を超えていても、調べたうえで、末期養子を許す、と改めました。
      # fact: kaieki-22
      - 語り: ただ、藤田さんは、綱吉の時代の処分は、数の上では増えるけれど、記録には、改易とは書かれていない、と注意しています。
      - 語り: では、綱吉のあと、改易は、どうなったのか。
        hook: true
      - 語り: 記録に、改易と書かれた大名を、数えてみます。
        hook: true

  # ================================================================ 第8章 なぜ減った？
  - title: 「江戸の後半、なぜ改易は減った？」　廃絶録の4家
    lines:
      # fact: kaieki-11
      - 語り: 藤野さんは、綱吉の時代を境に、大名の改易は減り、そのまま幕末に至った、とまとめています。
      # fact: kaieki-21
      - 語り: 藤田さんが数えた、廃絶録で改易と書かれた15家。そのうち11家は、慶長から寛永の時代。江戸の初めの、50年足らずです。
        figure: {type: bars, title: 廃絶録で「改易」と書かれた大名（藤田恒春の数）, bars: [[慶長〜寛永, 11], [それより後, 4]], labels: [11家, 4家]}
      # fact: kaieki-22
      - 語り: 綱吉の時代の処分は、廃絶録では改易と書かれていないので、この15家には入っていません。
      # fact: kaieki-21
      - 語り: 残る4家は、ずっとあと。1751年から1788年のあいだです。
        figure: null
      # fact: kaieki-76
      - 語り: そのひとつが、美濃の郡上八幡の金森頼錦です。年貢を増やそうとして、百姓たちの一揆を招きました。郡上一揆です。
        figure: {type: map, title: 改易された大名の城, reveal: true, bounds: [132.5, 141.0, 33.8, 39.6], places: [[高田, 138.25, 37.10], [福井, 136.22, 36.06], [清洲, 136.84, 35.22], [会津, 139.93, 37.49], [松江, 133.05, 35.47], [宇都宮, 139.88, 36.56], [駿府, 138.38, 34.98], [高松, 134.05, 34.35], [佐倉, 140.22, 35.72], [鳥羽, 136.84, 34.48], [郡上, 136.96, 35.75]], note: 本編で語る家}
      # fact: kaieki-76
      - 語り: 宝暦8年、1758年、頼錦は改易され、盛岡の南部家に、生涯預けられました。この裁きでは、老中や若年寄まで、罰を受けています。
        figure: null
      # fact: kaieki-78
      - 語り: 天明6年と7年、1786年と1787年には、老中だった田沼意次が、遠江の相良の領地を、2度にわたって削られました。
      # fact: kaieki-78
      - 語り: ただ、これは改易とはされず、領地を減らされた処分でした。家は、孫が1万石で継いでいます。
      # fact: kaieki-22
      - 語り: 藤田さんは、江戸の中ごろからあとの改易は、大名より、旗本や御家人への罰として、使われるようになった、と書いています。
        tone: 重い
      - 語り: では、江戸の260年で、大名の改易は、何家だったのか。
        hook: true
      - 語り: 最後に、数を並べ直します。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：224名か240家か　改易の数と1651年からの変化
    lines:
      # fact: kaieki-08, kaieki-09, kaieki-24
      - 語り: 取りつぶされた大名の数は、ひとつには決まりません。藤野保さんの数では、関ヶ原の処分を含めて、最初の50年あまりで224名。
        tone: 重い
      # fact: kaieki-09, kaieki-24
      - 語り: 北原章男さんは、領地を削られた家も含めて、3代のあいだで、合わせて217家。南條範夫さんの本の紹介では、同じく削られた家も含めて、関ヶ原のあとで、合わせて240家です。
      - 語り: 数え方は違っても、藤野さんと北原さんの数は、どちらも、最初の50年あまりで、200を超えています。
      # fact: kaieki-12, kaieki-21
      - 語り: 福田千鶴さんの数では、1708年までの106年間で202件。そして、廃絶録に改易と書かれた大名は、15家です。
      # fact: kaieki-10, kaieki-20
      - 語り: 理由は、時代とともに移りました。1615年までは、戦の処分。
      # fact: kaieki-13
      - 語り: その後は、跡継ぎがいないこと。大名のふるまい。政治の理由。家臣の争い。
      # fact: kaieki-11, kaieki-74
      - 語り: 綱吉の時代には、徳川の身内と譜代へ。そして、そのあと、大名の改易は、減っていきました。
      # fact: kaieki-10, kaieki-16, kaieki-22
      - 語り: 戦が終わり、慶安4年に跡継ぎの決まりが緩んで、跡継ぎがいないための改易は減っていった。そして江戸の後半、改易は、大名より、旗本や御家人への罰になっていったのです。
        tone: しみじみ
      # fact: kaieki-14
      - 語り: 福田さんが数えた202件のうち、何かの形で家が残ったのは、3件に2件近く。
        figure: {type: pie, title: 改易された202件のその後（福田千鶴の数）, parts: [[家が絶えた, 73], [何かの形で残った, 129]], unit: "件"}
      # fact: kaieki-68
      - 語り: 讃岐を追われた生駒家も、228年後に、大名へ戻りました。
        tone: しみじみ
        pause: 0.8
        figure: null
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
