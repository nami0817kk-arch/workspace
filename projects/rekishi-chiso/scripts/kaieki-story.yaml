# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸幕府は、罪をとがめて、大名を次々に取りつぶした。そう思われがちです。けれど、取りつぶしの理由でいちばん多かったのは、戦でも謀反でもなく、跡継ぎがいないことでした。
  ある歴史学者が、最初の106年間を数え直すと、改易は202件。そのうち、家が跡形もなく絶えたのは73件でした。
  最初の50年で200を超えた取りつぶしは、なぜ、そのあと減っていったのか。研究ごとに違う数え方と、時代ごとの理由を、数字で積み上げます。
  この動画でわかること
  ・取りつぶされた大名の数は、なぜ研究によって違うのか
  ・戦・跡継ぎ・ふるまい・家臣の争い、時代ごとに変わる改易の理由
  ・慶安4年に緩められた「末期養子の禁」と、そのきっかけをめぐる説
  ・江戸の後半に「改易」と記録された大名は何家か
description_note: |-
  この動画に、想像の台詞や作った話はありません。数字と出来事は、辞典の項（藤野保「改易」「大名」、北原章男「浪人」、辻達也「天和の治」、高木昭作「本多正純」「宇都宮釣天井事件」ほか〔改訂新版 世界大百科事典・日本大百科全書・山川 日本史小辞典・ブリタニカ国際大百科事典・日本人名大辞典・日本国語大辞典 ほか〕）と、研究（福田千鶴「近世前期大名相続の実態に関する基礎的研究」〔史料館研究紀要 29号、1998〕、藤田恒春「大名「改易」の構造」〔史泉 65号、1987〕、浪江健雄「江戸幕府法における改易について」〔国士舘史学 17号、2013〕、三宅正浩「武家諸法度と諸士法度」〔史林 105巻2号、2022〕）、南條範夫『大名廃絶録』の版元の紹介から取りました。
  取りつぶされた大名の数は、数え方（減封を含むか、関ヶ原の処分を含むか、家が旗本などで残った例を数えるか）で変わるので、出どころごとに分けて言っています。石高も資料によって違うことがあります。年のあとの月日は、当時の暦のものです。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "Kaieki: How Many Daimyo Houses Did the Shogunate Abolish?"
  description: |-
    The Tokugawa shogunate is often imagined punishing daimyo and abolishing them one after another. Yet the most common reason was not war or rebellion, but simply having no heir.
    One historian counted 202 abolitions in the first 106 years, and only 73 of those families vanished completely.
    More than 200 daimyo were abolished in the first fifty years. Why did the numbers fall after that? We add it up, number by number.
    In this video you will learn:
    - Why historians give different totals for abolished daimyo
    - How the reasons changed: war, no heir, misconduct, and quarrels among retainers
    - The 1651 (Keian 4) easing of the ban on deathbed adoption, and the debate over its cause
    - How many daimyo were recorded as "kaieki" in the later Edo period
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "202 Cases, but Only 73 Families Vanished"
    - "How Many Daimyo Were Abolished?"
    - "What Changed When the Wars Ended?"
    - "What Happened Without an Heir?"
    - "Even the Shogun's Own Family?"
    - "Abolished over a Quarrel among Retainers?"
    - "What Changed in 1651?"
    - "What Happened under Tsunayoshi?"
    - "Why Did the Numbers Fall?"
    - "Summary: How Many Houses, and Why Fewer?"

