# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と sekigahara-map-story.yaml の型）。江戸260年の大名の改易。2026-11-26 作成。
# 公開の予定は 12/2 12:00（12時枠）。型は「数字を積み上げる型」（ユーザーの○済み）。主語は「江戸幕府の改易（取りつぶされた大名）」1つで、最後まで主役。
#   誰でも持つ像＝江戸幕府は、罪をとがめて大名を次々に取りつぶした。
#   裏返す一点＝いちばん多い理由は「跡継ぎがいない」こと。しかも、改易されても家が跡形もなく絶えたのは3件に1件ほど（福田千鶴 1998）。
#   問い（1本に1つのなぜ）＝「最初の50年で200を超えた取りつぶしは、なぜ、そのあと減っていったのか」（題名の「何家？」は、数え方ごとの数で答える）。
#   答え＝数は数え方で違う（藤野保 224名・北原章男 217家・南條範夫 240家・福田千鶴 202件・廃絶録の「改易」15家）。減ったのは、戦が終わり（1615 年が最後の軍事の改易）、
#   無嗣の原因だった末期養子の禁が慶安4年（1651）に緩んで無嗣の改易が減り、後半の「改易」は大名より旗本・御家人への罰になったから（藤野・福田・藤田）。
#   慶安事件が緩和のきっかけかは研究で割れる（辞典の通説／福田「直接の契機ではない」／三宅 2022 は通説に疑問。要旨のみ）。
# 既出と重ねない（11-26 scripts/・posted.json を grep）：関ヶ原の戦後処理の数（88名・93名・632万石）は sekigahara-map-story で扱った→1行の前提だけ。
#   福島正則の改易（fukushima-story・ショート5本）・加藤忠広（kiyomasa-story）・石川康長（kazumasa-story）は触れない（11-26 照合でカードの無い福島の行を外した）。浅野（kira）は1行。
# 事実は事実カード（dev/output/rekishi-chiso/research/江戸の改易_facts_20261126.yaml。担当A=総数と数え方・B=末期養子と無嗣・C=代表の家）にあるものだけ。行の上に `# fact:`。
# 記録の食い違い（並べたもの3つ）：①取りつぶされた大名の数（藤野 224名／北原 217家／南條 240家）第1章
#   ②宇都宮の釣天井（俗説）と辞典（高木昭作「偽り」）第4章 ③慶安事件は緩和のきっかけか（辞典の通説／福田 1998／三宅 2022）と、牢人の数（40万か50万／過大）第6章
#   並べなかった食い違い：忠輝の石高（60万・61万・75万・45万）、忠長の石高（55万・50万）、生駒の石高（17万〜17万8000）、忠直の67万・68万、
#   末期養子の年齢の条件（50歳以下・未満・17歳以上）、50歳以上を認めた年（1683・1719）、蒲生忠知の石高、金森の3万8000・3万9000、相良城の破却・没収。
# 自分で計算した数（全部計算し直した）：
#   藤野 93＋131＝224（「大名」の項の224名と合う）。632万4194＋1214万8950＝1847万3144石→「1800万石を超える」。
#   福田 1603〜1708＝106年（両端を含む。論文の「106年間」と合う）。理由 75＋61＋32＋25＋3＋6＝202。無嗣 75÷202＝37.1%。完全断絶 73÷202＝36.1%→「3件に1件ほど」。
#     残った 202−73＝129件、129÷202＝63.9%→「3件に2件近く」。無嗣の断絶 33÷75＝44%。不行跡 18÷61＝29.5%→「3割ほど」、残り 43。政治 15÷32＝46.9%→「半分近く」。
#   藤田 15＝11＋4。忠輝 1616→1683＝67年。生駒 1640→1868＝228年。光長 1681→1698＝17年。内藤 1680→浅野 1701＝21年。正純 1622→1637＝15年。
#   金森 1758→1868＝110年。忠吉 3月5日 28歳。堀尾忠晴 35歳。忠知 30歳。綱勝 27歳。30万→15万＝半分。
#   和暦：元和元年＝1615、元和2年＝1616、元和8年＝1622、元和9年＝1623、寛永4年＝1627、寛永6年＝1629、寛永8年＝1631、寛永9年＝1632、寛永10年＝1633、寛永11年＝1634、
#     寛永14年＝1637、寛永17年＝1640、慶安4年＝1651、万治2年＝1659、万治3年＝1660、寛文4年＝1664、延宝8年＝1680、天和元年＝1681、天和3年＝1683、貞享4年＝1687、
#     元禄11年＝1698、元禄14年＝1701、宝暦8年＝1758、天明8年＝1788、慶長12年＝1607、寛延4年（宝暦元年）＝1751。
#   季節の語は使わない（月だけを言う）。慶安4年12月11日（西暦1652年1月）と寛永10年12月6日（西暦1634年1月）は、和暦の年だけで言う（西暦を月日に付けない）。
# 確かめられなかったこと（台本では言わない）：将軍の代ごとの改易数、江戸時代全体の総数、綱吉期の「161万石」「譜代29・外様17」、緩和を決めた人（保科・信綱）、
#   死を隠して養子を立てた例、正純の改易の日付（10月1日は論文の書誌だけ）、忠長・光長の改易の月、加藤明成の返上の年、「江戸時代最後の改易」、堀田の11万石。
# 想像の台詞なし。語りは剣崎1人。釣天井の話は「後の世の話」として語り、場面を作らない。
# 絵：AI 絵（Gemini。一覧は scripts/story/kaieki_main_look.yaml の頭）。実在の人物の顔は描かない（後ろ姿・遠景・名指さない武士）。字・紋・旗の字は描かない。
