sections:
  # ================================================================ 序章
  - title: 「本能寺の変の7年前、織田家の当主は誰だったのか」　1575年 岐阜
    background: {image: paintings/hanbei_gifu_castle_zu.jpg, credit: "《岐阜城図》（江戸時代）"}
    year: 1575
    lines:
      # fact: honnouji-08
      - 語り: 本能寺の変の7年前。織田家の当主は、もう、信長ではありませんでした。
        tone: 重い
      # fact: honnouji-08, honnouji-12
      - 語り: 1575年の冬。信長は、家督を、数え19歳の嫡男、信忠に譲っていたのです。
        card: {head: "1575年11月", body: 家督は嫡男の信忠へ}
      # fact: honnouji-08
      - 語り: 『信長公記』によれば、信長が手元に残したのは、《茶の湯の道具》だけ。家臣の屋敷へ、移り住みました。
      # fact: honnouji-21, honnouji-23
      - 語り: 本能寺の変が奪ったのは、信長だけではありません。織田家の当主の信忠も、同じ朝に、命を落としたのです。
        tone: 重い
      - 語り: もしも、あの朝に何も起きなかったら。織田家は、どうなっていたのでしょうか。
        tone: 疑問
      # fact: honnouji-21, honnouji-23
      - 語り: 天正10年6月2日、本能寺の変の朝。京にいた信忠は、二条の御所に立てこもり、自ら腹を切ります。
        tone: 重い
        card: {head: "1582年6月2日", body: 信忠も二条の御所で自害}
      # fact: honnouji-12
      - 語り: 26歳。当主になって、7年足らずでした。
        tone: しみじみ
      # fact: honnouji-26, honnouji-30
      - 語り: 織田家を継いだのは、信忠の長男、まだ3歳の三法師でした。
      - 語り: そして、本能寺の変から8年後の1590年。天下をまとめたのは、織田家の家臣だった、羽柴秀吉、のちの豊臣秀吉です。
      # fact: honnouji-68
      - 語り: 信忠から続く織田の宗家は、1605年、三法師の死で絶えます。
        tone: 重い
      # fact: honnouji-66
      - 語り: それでも、織田の名は消えませんでした。信長の次男と弟の子孫が、小さな藩の大名として、明治まで、4つの家を残しています。
      - 語り: 変えるのは一点だけ。天正10年6月2日の朝、何も起きず、信長と信忠が、そのまま生きていたら。ここから先のもしもは、記録に残る予定と条件から考える推論です。
      - 語り: 家督を継いでいた信忠は、天下まで、受け継げたのでしょうか。
        tone: 疑問
        hook: true
      - 語り: その若い当主は、武田攻めで、自ら塀の上に立っていました。
        hook: true

  # ================================================================ 第1章
  - title: 「19歳で家督を継いだ信忠は、どんな当主だったのか」　1575年から1582年 岐阜
    background: {image: paintings/hanbei_gifu_castle_ezu.jpg, credit: "《岐阜城絵図》（江戸時代）"}
    year: 1575
    lines:
      # fact: honnouji-12
      - 語り: 信忠は、弘治3年、1557年の生まれ。幼い名は、奇妙といいました。
      # fact: honnouji-09
      - 語り: 家督を継ぐ直前、信忠は、美濃の岩村城攻めの働きで、朝廷から、秋田城介という官職を与えられた、と『信長公記』は書きます。
        card: {head: "1575年", body: 秋田城介に任じられる}
      # fact: honnouji-10
      - 語り: ただ、この任官の年は、記録で割れます。『信長公記』は天正3年の条に置き、平凡社の世界大百科事典は、翌年の1576年とします。
        figure: {type: stats, title: 信忠が秋田城介になった年, items: [[信長公記, 1575年, 天正3年の条], [世界大百科事典, 1576年, 翌年とする]], upto: 2}
      # fact: honnouji-15
      - 語り: 天正5年、1577年。信忠は、松永久秀が立てこもる信貴山城攻めの総大将となり、およそ10日で落としました。
        figure: null
        card: {head: "1577年", body: 信貴山城をおよそ10日で落とす}
      # fact: honnouji-16
      - 語り: 戦国史研究家の和田裕弘さんは、2019年の著書『織田信忠』で、信忠を、決して凡庸な二代目ではなかった、と評しています。
      # fact: honnouji-17
      - 語り: 和田さんによると、信長に背いた荒木村重でさえ、毛利方に送った手紙で、中将殿、つまり信忠に敬語を使っていました。謀反から、およそ1年後の手紙です。
      # fact: honnouji-18
      - 語り: 天正10年、1582年の3月2日。信濃の高遠城を攻めた信忠は、自ら塀ぎわの柵を引き破り、塀の上に上がりました。
        tone: 重い
        card: {head: "1582年3月2日", body: 高遠城で自ら塀の上へ}
      # fact: honnouji-18
      - 語り: そして、一斉に乗り込め、と命じた。『信長公記』は、そう書いています。
      # fact: honnouji-19
      - 語り: 武田家が滅んだあとの3月26日。信長は、信忠に刀を与え、《天下の儀》も、譲るつもりだ、と伝えました。
        tone: 重い
      # fact: honnouji-19
      - 語り: 『信長公記』の言葉では、天下の儀も御与奪なさるべき。天下を治める務めまで、いずれ信忠に渡すつもりだ、という意味です。
      # fact: honnouji-88
      - 語り: 研究者の渡邊大門さんは、2026年の解説で、信忠は名実ともに、織田家の跡継ぎの座を固めていた、とみています。
      # fact: honnouji-26
      - 語り: その信忠には、天正8年、1580年に生まれた長男、三法師もいました。
      - 語り: 家督も、天下も、そして次の跡継ぎも。信長は、自分が生きているうちに、織田家の先を、形にしつつありました。
        tone: しみじみ
      - 語り: では、信長のほかの息子たちには、どんな道が用意されていたのでしょうか。
        hook: true
      - 語り: その中には、四国の大名家を継ぐ、という話までありました。
        hook: true

  # ================================================================ 第2章
  - title: 「信長は、息子たちに何を託していたのか」　1582年5月 安土
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年原図の明治の写し）"}
    year: 1582
    lines:
      # fact: honnouji-81
      - 語り: 信長の息子は、少なくとも11人といわれます。研究者の谷口克広さんは、伝わる生まれの順も、実際とは違うかもしれない、と指摘しています。
      # fact: honnouji-73
      - 語り: 三男の信孝は、11歳の永禄11年、伊勢の神戸家の養子に入り、神戸三七と呼ばれていました。
      # fact: honnouji-70
      - 語り: 天正10年の5月7日。信長は、信孝に宛てて、1通の朱印状を出します。讃岐の国を、まるごと信孝に任せる、という約束です。
        card: {head: "1582年5月7日", body: 讃岐の国を信孝へ}
      # fact: honnouji-71
      - 語り: 結びには、こうあります。何ごとも、三好康長を、主君とも父母とも思って尽くせ。それが忠節だ。
        tone: 重い
      # fact: honnouji-71, honnouji-73
      - 語り: 信孝は、四国の三好の家の養子にもなる立場で、四国の大名になる道を、用意されていたのです。
      # fact: honnouji-72
      - 語り: この朱印状の原本は、昭和6年、1931年の写真集の時点で、名古屋の個人が持っていました。
      # fact: honnouji-74
      - 語り: 5月11日、信孝は、海を渡る軍勢を連れて、摂津の住吉に陣を置きました。
        card: {head: "1582年5月11日", body: 信孝が住吉に陣を置く}
      # fact: honnouji-77
      - 語り: 次男の信雄は、伊勢の北畠家を継いでいました。けれど、天正7年、1579年。信長に無断で伊賀へ攻め込み、敗れます。
      # fact: honnouji-77
      - 語り: 信長は、9月22日付の手紙で、天道も恐ろしい、と叱り、このような覚悟なら、親子の縁を切る、とまで書きました。
        tone: 重い
      # fact: honnouji-78
      - 語り: 叱られてから2年後の、天正9年、1581年。もう一度の伊賀攻めで、伊賀の4つの郡のうち3つが、信雄の領地になります。
      # fact: honnouji-79
      - 語り: 武田家から送り返されてきた信長の子は、天正9年の暮れに、犬山城の主とされました。
      # fact: honnouji-80
      - 語り: その子は、翌年の武田攻めで、上野の方面へ差し向けられています。
      - 語り: 長男の信忠には、家督と天下を。次男の信雄には、伊勢と伊賀を。三男の信孝には、四国を。記録に残る予定を並べると、信長は、息子たちを、それぞれの国に据えようとしていた、と読めます。
        tone: しみじみ
        figure: {type: people, title: 1582年5月 信長が息子たちに用意した道, nodes: [[織田信長, 父], [織田信忠, 長男 家督と天下], [織田信雄, 次男 伊勢と伊賀], [織田信孝, 三男 讃岐と四国]], edges: [[織田信長, 織田信忠, 家督を譲る], [織田信長, 織田信雄, 伊賀を与える], [織田信長, 織田信孝, 讃岐を約束]]}
      # fact: honnouji-75
      - 語り: そのころ信長は、備中の高松で毛利と向き合う秀吉の知らせを受け、自ら西へ出陣する、と決めていました。
        figure: null
      # fact: honnouji-82
      - 語り: 朝廷との話も動いていました。4月25日、京の町を治める役の村井貞勝のもとで、信長を、太政大臣か関白か将軍に推してはどうか、という話が出た、と公家の勧修寺晴豊の日記にあります。
      # fact: honnouji-83
      - 語り: 5月4日、朝廷の使いが安土に着きます。三重大学の藤田達生さんは、2021年の解説で、晴豊が答えた言葉から、これは将軍への推任だった、とみています。
      # fact: honnouji-84
      - 語り: 信長が、何と答えたのか。それは、分かっていません。
        tone: 疑問
      - 語り: その答えが出る前に、6月がやってきます。
        hook: true
      - 語り: 6月2日の朝。信忠は、父と同じ京にいました。
        hook: true

  # ================================================================ 第3章
  - title: 「信忠は、なぜ逃げなかったのか」　1582年6月2日 京都・二条の御所
    background: {image: paintings/nobunaga_rakuchu_uesugi_left.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）左隻"}
    year: 1582
    lines:
      # fact: honnouji-20
      - 語り: 信忠は、5月14日に京へ向けて発ち、妙覚寺という寺に泊まっていました。なぜ京に長く留まったのかは、『信長公記』にも書かれていません。
      # fact: honnouji-21
      - 語り: 6月2日の明け方。本能寺が襲われたと知った信忠は、父のもとへ向かおうと、寺を出ます。
        card: {head: "1582年6月2日", body: 信忠が妙覚寺を出る}
      # fact: honnouji-21
      - 語り: そこへ、村井貞勝が駆けつけた、と『信長公記』は書きます。本能寺は、もう落ち、御殿も焼けた。敵は、こちらへ来る。二条の新しい御所は、構えがよいので、立てこもるべきだ。
      # fact: honnouji-27
      - 語り: この御所は、信長が建てて、天正7年に、天皇の跡継ぎ、誠仁親王に献上していた御殿でした。京都市埋蔵文化財研究所の川上貢さんが、1999年の冊子で、そう考証しています。
      # fact: honnouji-22
      - 語り: 信忠は、まず、親王と若宮を、内裏へ移させます。公家の山科言経の日記にも、親王が、朝の7時から9時ごろに移った、とあります。
      # fact: honnouji-23
      - 語り: 逃げる道は、あったのかもしれません。けれど信忠は、こう言った、と『信長公記』は書きます。
        tone: 重い
      # fact: honnouji-23
      - 語り: これほどの謀反なら、敵は、まさか逃がしはしない。雑兵の手にかかっては、のちのちまで無念だ。ここで腹を切る。
        tone: 重い
      # fact: honnouji-23
      - 語り: 腹を切ったあとは、縁の板をはがして、亡きがらを中に隠せ、と命じた、とも書かれています。
      # fact: honnouji-24
      - 語り: 一方、同じ御所にいた叔父の織田長益、のちの茶人の有楽斎は、難を逃れています。
      # fact: honnouji-12
      - 語り: 信忠は、26歳。父の信長は、49歳でした。
        tone: しみじみ
      # fact: honnouji-25
      - 語り: 日本人名大辞典は、前田玄以が、信忠に長男の三法師を託され、尾張の清洲へ逃れた、と書いています。
      # fact: honnouji-26
      - 語り: 三法師は、天正8年、1580年の生まれ。まだ、3歳でした。
        card: {head: "三法師", body: 3歳で跡継ぎに}
      # fact: honnouji-28
      - 語り: 京都の大雲院は、天正15年、1587年に、正親町天皇の命で、信長と信忠の父子を弔うために建てられた寺です。2人の墓碑が、今もあります。
      - 語り: 当主と、その父を、一度に失った織田家。
        hook: true
      - 語り: 変から25日後の6月27日。尾張の清洲に、4人の重臣が集まります。
        hook: true

  # ================================================================ 第4章
  - title: 「清洲で、本当は何が決まったのか」　1582年6月27日 尾張・清洲
    background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』三法師を抱く秀吉（1797〜1802年、後世の場面）"}
    year: 1582
    lines:
      # fact: honnouji-29
      - 語り: 「柴田勝家」「羽柴秀吉」「丹羽長秀」「池田恒興」。天正10年6月27日、清洲城に集まった、織田家の重臣です。
        card: {head: "1582年6月27日", body: 4人の重臣が清洲に集まる}
      # fact: honnouji-29
      - 語り: 秀吉の手紙では、清洲での談合、と書かれています。清洲会議という名前は、後の時代の呼び名です。
      # fact: honnouji-31
      - 語り: よく知られているのは、こんな場面です。秀吉が、幼い三法師を抱いて現れ、諸将が、ひれ伏した。
      # fact: honnouji-31
      - 語り: けれど、この場面は、江戸の初め、1621年から1625年ごろにできた軍記、『川角太閤記』に出る話で、同じ時代の記録には見えません。
        tone: 重い
      # fact: honnouji-32
      - 語り: 会議の筋そのものも、書き方が割れます。平凡社の百科事典マイペディアは、秀吉が三法師を推し、柴田勝家は信孝を推した、と、跡目の争いとして書いています。
        figure: {type: stats, title: 清洲の会議は、何を決めたのか, items: [[古い辞典（マイペディア）, 跡目の争い, 秀吉は三法師・勝家は信孝], [近年の研究, 名代を決める, 三法師の家督は既定]], upto: 1}
      # fact: honnouji-30, honnouji-32
      - 語り: 近年の研究は違います。柴裕之さんや渡邊大門さんは、三法師が家督を継ぐことは、会議の前から決まっていた、とみます。信忠が、天正3年に、すでに家督を継いでいたからです。
        figure: {type: stats, title: 清洲の会議は、何を決めたのか, items: [[古い辞典（マイペディア）, 跡目の争い, 秀吉は三法師・勝家は信孝], [近年の研究, 名代を決める, 三法師の家督は既定]], upto: 2}
      # fact: honnouji-30
      - 語り: 争いの的は、幼い当主に代わって政務を見る、名代を誰にするか、でした。
        figure: null
      # fact: honnouji-34
      - 語り: 奈良の興福寺の僧が書いた『多聞院日記』は、6月29日、信雄と信孝の軍勢がにらみ合っている、という噂を書き留めています。
      # fact: honnouji-34
      - 語り: 7月6日の条では、天下の差配は、勝家・秀吉・長秀・恒興、そして堀秀政の5人で分ける、と書き、信雄と信孝を、役に立たない、と評しました。
      # fact: honnouji-35
      - 語り: 取り決めは、羽柴の思うままのようだ、とも書いています。京のまわりの山城と丹波などは、秀吉の手に渡りました。
      # fact: honnouji-36
      - 語り: 信孝は、兄の信忠が治めた美濃を得て、岐阜城の主になります。信雄は、尾張を得ました。
        card: {head: "清洲の取り決め", body: 信孝は美濃・信雄は尾張}
      # fact: honnouji-40
      - 語り: 10月15日、京都の大徳寺で、秀吉が、信長の葬儀を営みます。喪主は、信長の四男で、秀吉の養子になっていた羽柴秀勝。信孝でも、三法師でもありませんでした。
        tone: 重い
      # fact: honnouji-39
      - 語り: 三法師は、安土城に入る決まりでした。けれど城は焼けていたため、叔父の信孝のいる岐阜城に置かれていました。
      # fact: honnouji-39
      - 語り: 秀吉が求めても、信孝は、三法師を手放しません。秀吉は、これを決まりに背いたと責め、その年の暮れ、信雄が岐阜城を攻めて、信孝は、三法師を渡しました。
      - 語り: 織田家の跡継ぎは、決まっていました。けれど、家を動かす力は、別の人の手に移りつつありました。
        hook: true
      - 語り: 天下にいちばん近かった織田の宗家は、このあと、生き延びることができませんでした。
        hook: true

  # ================================================================ 第5章 その後（史実）
  - title: 「織田家は、どこで生き延びたのか」　1583年から1871年 岐阜・天童・柏原
    background: {image: paintings/sekigahara_screen_gifu.jpg, credit: "《関ヶ原合戦図屏風》江戸後期（岐阜市歴史博物館蔵）"}
    year: 1583
    lines:
      # fact: honnouji-41
      - 語り: 信孝は、柴田勝家と組んで、秀吉に立ち向かいます。けれど岐阜城を囲まれて降伏しました。
      # fact: honnouji-41
      - 語り: 天正11年、1583年。信孝は、尾張の野間の大御堂寺に移されて、自害します。
        tone: 重い
        card: {head: "1583年", body: 信孝が野間で自害}
      # fact: honnouji-42
      - 語り: 辞世として伝わる歌は、主を討つ者への報いを待て、と、秀吉への恨みを詠んだもの、と伝わります。
      # fact: honnouji-43
      - 語り: 信雄は、1584年、徳川家康と組んで、小牧と長久手で秀吉と戦います。けれど同じ年のうちに、家康に相談なく、秀吉と和睦しました。
      # fact: honnouji-44
      - 語り: 1590年、小田原攻めのあと、秀吉から、家康の旧領への国替えを命じられた信雄は、尾張を離れるのを拒み、領地を取り上げられます。
      # fact: honnouji-45
      - 語り: 三法師、のちの織田秀信は、文禄元年、1592年に、岐阜城の主となり、13万3000石。中納言にまで進み、岐阜中納言と呼ばれました。
        card: {head: "1592年", body: 三法師が岐阜城の主に}
      # fact: honnouji-46
      - 語り: 『新カトリック大事典』によれば、秀信は、ひそかに洗礼を受け、キリシタンにもなっています。
      # fact: honnouji-47
      - 語り: 慶長5年、1600年の8月。関ヶ原の戦いの直前、西軍についた秀信の岐阜城は、東軍の福島正則や池田輝政に攻められて落ちます。
        tone: 重い
      # fact: honnouji-47
      - 語り: 秀信は、自ら命を絶とうとして止められ、髪をそって、高野山へ送られました。
      # fact: honnouji-48
      - 語り: その死の日も、記録で割れます。『国史大辞典』と『日本人名大辞典』は、慶長10年、1605年の5月8日。5月27日とする説もあります。
        figure: {type: stats, title: 織田秀信が亡くなった日, items: [[国史大辞典・日本人名大辞典, 1605年5月8日, 高野山で病死], [別の説, 1605年5月27日, 墓所は高野山など]], upto: 2}
      # fact: honnouji-48
      - 語り: 26歳。父の信忠と、同じ歳でした。
        tone: しみじみ
        figure: null
      # fact: honnouji-68
      - 語り: 信忠から続く織田の宗家は、ここで、途絶えました。
        tone: 重い
      # fact: honnouji-50
      - 語り: 一方、信雄は、大坂の陣のあとの元和元年、1615年、徳川家康から、大和の宇陀などで、5万石を与えられます。
      # fact: honnouji-51, honnouji-52
      - 語り: 宇陀の家は4代。宇陀を与えられた1615年から80年後の、元禄8年、1695年に、丹波の柏原へ移されました。
      # fact: honnouji-57
      - 語り: 信雄の四男の家は、上野、今の群馬県の小幡藩を継ぎました。けれど明和4年、1767年、幕府のとがめを受けた明和事件に巻き込まれ、出羽へ移されます。
      # fact: honnouji-59
      - 語り: この家は、のちに天童へ移り、天童藩となりました。
        card: {head: "天童藩", body: 信雄の子孫の家}
      # fact: honnouji-63
      - 語り: 信長の弟、有楽斎の子孫も、大和の柳本と、のちの芝村で、それぞれ1万石の大名として続きます。
      # fact: honnouji-66
      - 語り: 江戸時代を通して、明治まで大名として残った織田家は、4つ。どれも、1万石か2万石の、小さな藩でした。明治には、4家とも子爵になっています。
        card: {head: "明治まで", body: 織田家は4つの小さな藩}
      # fact: honnouji-61
      - 語り: 天童市によると、今も天童の名産の将棋の駒は、幕末、苦しい暮らしの藩士たちに、駒づくりが勧められたことが、広まるきっかけでした。
      - 語り: 天下にいちばん近かった家は、小さな藩として、生き延びたのです。
        hook: true
      - 語り: では、もしも。あの夏の朝、何も起きていなかったら。
        hook: true

  # ================================================================ 第6章 分岐1
  - title: 「分岐1　信長と信忠が生きていたら、織田家は誰が継いだのか」
    background: {image: paintings/nobunaga_rakuchu_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    lines:
      - 語り: ここから、もしもの話に入ります。まず手がかりは、信長が、生きているうちに、すでに決めていたことです。
      # fact: honnouji-19
      - 語り: 信長は、家督だけでなく、天下の儀も、いずれ信忠に譲る、と伝えていました。
      - 語り: のちの天下人にも、同じ形をとった人がいます。徳川家康です。家康は、1605年、将軍の職を息子の秀忠に譲り、自分は大御所として、政治を見続けました。
        figure: {type: table, title: 生きているうちに跡を譲った天下人, cols: [譲った年, そのあと], rows: [[織田信長から信忠へ, 1575年 家督, 7年足らずで父子とも死去], [徳川家康から秀忠へ, 1605年 将軍職, 11年 父が後ろから支える]], upto: 2}
      - 語り: 将軍を譲った1605年から、家康が亡くなる1616年までの11年。秀忠は、父に後ろから支えられながら、将軍として政治を続けました。
      # fact: honnouji-48
      - 語り: 家康が将軍を譲った、その1605年。信長の孫の秀信は、高野山で、26歳で亡くなっています。
        tone: しみじみ
        figure: null
      - 語り: もしも本能寺の変が起きなかったら、織田家も、家康と同じ形に近かった、と考えられます。当主は信忠。その後ろに、父の信長。
        tone: 疑問
      # fact: honnouji-30
      - 語り: 跡継ぎの順も、見えていました。近年の研究は、信忠がすでに家督を継いでいたからこそ、その子の三法師が継ぐのは当然だった、とみています。
      # fact: honnouji-17
      - 語り: もしもの世界でも、家臣たちは、信忠を当主として仰いだ見込みが高いでしょう。背いた荒木村重でさえ、信忠を中将殿と敬っていたからです。
      # fact: honnouji-87
      - 語り: 渡邊大門さんも、本能寺の変がなければ、天下人になった見込みが高いのは信忠だった、とみています。
      - 語り: そうなれば、清洲のような話し合いは、開かれなかったはずです。幼い当主の名代を、家臣が決める場が、そもそも生まれないからです。
      - 語り: ただし、言い切れないこともあります。もしも信忠が、のちに早く亡くなれば、跡継ぎは、また幼い三法師です。同じ争いが、何年か遅れて起きたかもしれません。
        tone: しみじみ
      - 語り: まとめると、もしも本能寺の変が起きなければ、織田家は、信忠を当主に、天下を受け継いだ見込みが高い。けれど、三法師の代まで続いたかは、分かりません。
        figure: {type: table, title: もしも本能寺の変が起きなかったら（推論）, cols: [史実, もしも], rows: [[織田家の当主, 3歳の三法師, 信忠のまま, 高い], [天下の儀, 秀吉へ移る, 信忠が受け継ぐ, 高い], [清洲の会議, 6月27日に開く, 開かれない, 高い], [織田の宗家, 1605年に途絶える, 続く, ありうる]], upto: 4, note: もしもは推論。右の札は見込みの高さ}
      - 語り: 讃岐を約束された信孝は、その土を、一度も踏んでいません。
        figure: null
        hook: true
      - 語り: そして朝廷では、天皇の位を譲る話が、信長を待っていました。
        hook: true

  # ================================================================ 第7章 分岐2
  - title: 「分岐2　信雄と信孝、そして朝廷はどうなったのか」　1582年 伊勢・讃岐・京都
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年原図の明治の写し）"}
    year: 1582
    lines:
      # fact: honnouji-87
      - 語り: もしも本能寺の変がなければ。渡邊さんは、2026年の解説で、2人の弟の行く先を、こう考えます。
      # fact: honnouji-87
      - 語り: 信雄は、伊勢を足場に、伊賀を含む東海と畿内の境を押さえ、信孝は、讃岐の国主として、四国の東の一角を担う。2人とも、宗家に従う一門の大名になっていただろう、というのです。
      # fact: honnouji-70, honnouji-71
      - 語り: 信孝は、讃岐を任せると約束され、三好康長を、主君とも父母とも思え、と命じられていました。もしも海を渡っていれば、三好の家を継ぐ四国の大名として、生きた見込みがあります。
      - 語り: 史実の信孝は、讃岐の土を踏むことなく、本能寺の変の翌年、1583年に、自害しました。
        tone: しみじみ
      # fact: honnouji-78
      - 語り: 信雄は、父に叱られてから2年後に、伊賀の4つの郡のうち3つを手に入れていました。もしもの世界では、伊勢と伊賀を治める一門として、兄の信忠を支える立場になっていたはずです。
      - 語り: 史実の信雄は、秀吉と家康のあいだで揺れ、最後は尾張を失いました。宗家が健在なら、信雄が、天下の行方を左右する立場に立つことは、なかったでしょう。
      # fact: honnouji-85
      - 語り: 朝廷とのあいだにも、決まりかけていたことがあります。正親町天皇の譲位です。
      # fact: honnouji-85
      - 語り: 天正9年、1581年の3月。朝廷は、信長を左大臣に推し、信長は、天皇の譲位を行ったあとで受ける、と答えました。
        card: {head: "1581年3月", body: 左大臣は譲位のあとで}
      # fact: honnouji-85
      - 語り: けれど、方角の占いで、この年は縁起が悪い、として、譲位は延ばされます。
      # fact: honnouji-86
      - 語り: 國學院大學の矢部健太郎さんは、2019年の論文で、本能寺の変で信長が亡くならなければ、遠からず譲位は実現していただろう、と書いています。
      - 語り: 史実の譲位は、本能寺の変から4年後の1586年、秀吉のもとで行われました。もしもの世界では、それが信長の手で、もっと早く行われた見込みがあります。
      # fact: honnouji-84
      - 語り: ただ、将軍への推任に、信長がどう答えるつもりだったのかは、分かりません。将軍か、太政大臣か。どちらになったかは、記録からは決められません。
        tone: 疑問
        figure: {type: table, title: もしも本能寺の変が起きなかったら 2（推論）, cols: [史実, もしも], rows: [[信孝, 1583年に自害, 讃岐の大名, ありうる], [信雄, 1590年に領地を失う, 伊勢と伊賀の一門, ありうる], [譲位, 1586年に秀吉のもとで, 信長の手で早まる, ありうる], [信長の官職, 答えは不明, 将軍か太政大臣か, 不明]], upto: 4, note: もしもは推論。右の札は見込みの高さ}
      - 語り: 家督を譲り、跡継ぎまで決めていた信長。その備えは、ある夏の朝に、崩れました。
        figure: null
        hook: true
      - 語り: 最後に、もう一度、二条の御所の朝に戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも本能寺の変が起きなかったら、織田家はどうなったのか
    background: {image: paintings/nobunaga_honnoji_yoshitoshi.jpg, credit: "月岡芳年《大日本名将鑑》織田信長（1878年）"}
    lines:
      # fact: honnouji-19
      - 語り: もしも本能寺の変が起きなかったら。織田家は、信忠を当主に、天下を受け継いだ見込みが高い、と考えられます。家督も、天下の儀も、信長が生きているうちに、信忠へ渡されつつあったからです。
      # fact: honnouji-87
      - 語り: 信雄と信孝は、伊勢と四国に据えられた、一門の大名になっていたでしょう。
      - 語り: ただ、信長が将軍になったのか、三法師の代まで織田家が天下を保てたのかは、言い切れません。
      - 語り: 信長は、生きているうちに家督を譲り、跡継ぎまで決めていました。その当主を、自分と同じ朝に失ったのです。
        tone: しみじみ
      # fact: honnouji-23
      - 語り: 雑兵の手にかかっては、無念だ。そう言って、二条の御所で腹を切った信忠は、26歳でした。
        tone: しみじみ
      - 語り: 当主になって7年足らずの若殿が、もしも、あの朝を生き延びていたら。天下は、織田の家に残っていたのかもしれません。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
