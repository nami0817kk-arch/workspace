# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  本能寺の変の7年前。織田家の当主は、もう信長ではありませんでした。
  1575年の冬、信長は家督を数え19歳の嫡男・信忠に譲り、手元には茶の湯の道具だけを残していました。
  その信忠も、天正10年6月2日、京の二条の御所で自ら命を絶ちます。もしも本能寺の変が起きなかったら、織田家はどうなっていたのでしょうか。
  この動画でわかること
  ・信長が生きているうちに、信忠へ家督と「天下の儀」を譲ろうとしていたこと
  ・信孝・信雄ほか、信長の息子たちに用意されていた行く先
  ・清洲の会議で本当に決まったこと（三法師の家督は既定だった）
  ・史実の織田家が、天童・柏原など4つの小さな藩として明治まで続いたこと
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（『信長公記』、信長の朱印状・書状、『言経卿記』、『多聞院日記』、勧修寺晴豊の日記、『川角太閤記』、和田裕弘・渡邊大門・呉座勇一・柴裕之・藤田達生・矢部健太郎・川上貢の研究と解説、宇陀市・丹波市・天童市・奈良県・岐阜市などの資料、日本人名大辞典・国史大辞典ほかの辞典）を語りで示してから、今の言葉にして読んでいます。
  信忠の官職の年、清洲の会議の筋、織田秀信が亡くなった日は、記録や研究者によって書き方が割れています。年齢は数え年です。
  本能寺の変が起きなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、月岡芳年《大日本名将鑑》、《洛中洛外図屏風》、《岐阜城図》、《近江国蒲生郡安土城之図》、岡田玉山『絵本太閤記』ほかの絵画・絵図（パブリックドメイン）と、画像生成AIで作った想像上の人物と風景です。
  サムネイルの人物像は、画像生成AIによる想像図です。

en:
  title: "What If the Honno-ji Incident Never Happened? The Fate of the Oda Clan"
  description: |-
    Seven years before the Honno-ji Incident, Oda Nobunaga was no longer head of the Oda family.
    In the winter of 1575 he handed the headship to his 19-year-old heir, Nobutada, keeping only his tea utensils.
    On the second day of the sixth month of 1582, Nobutada also took his own life at the Nijo palace in Kyoto. If the incident had never happened, what would have become of the Oda family?
    In this video you will learn:
    - How Nobunaga was already passing the headship and "the affairs of the realm" to Nobutada
    - The futures planned for Nobunaga's other sons, Nobutaka and Nobukatsu
    - What was really decided at the Kiyosu meeting
    - How the Oda survived as four small domains until the Meiji era
    Japanese-language history video (Japanese audio).
  chapters:
    - "Who Led the Oda Family Seven Years Before Honno-ji?"
    - "What Kind of Heir Was Nobutada? 1575-1582"
    - "What Did Nobunaga Plan for His Sons? 1582"
    - "Why Did Nobutada Not Flee? June 1582"
    - "What Was Really Decided at Kiyosu? 1582"
    - "Where Did the Oda Survive? 1583-1871"
    - "Turning Point 1: Who Would Have Led the Oda?"
    - "Turning Point 2: Nobukatsu, Nobutaka and the Court"
    - "Summary: If Honno-ji Had Never Happened"

