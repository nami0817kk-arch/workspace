# 物語型の本編（scripts/_template_story.yaml と hojo-if-story.yaml の型）。もしも本能寺の変が起きなかったら、織田家はどうなった？ 2026-11-27 下書き。
# 公開の予定は 12/4 12:00（昼＝if）。型は docs/story-main.md「00. 伸びる型」の もしも型（見本の第一は hojo-if-story、次が tsurumatsu-if-story）：
#   分岐は誰でも知る大事件（本能寺の変）の逆＝天正10年6月2日に何も起きず、信長と信忠が生きていたら／一点だけ変える／史実の条件（記録に残る予定）の範囲内／推論と明かす／
#   台詞は使わない（想像の台詞なし）／対象は史実で天下を失った有名な家（織田家）。主語は織田家（信長・信忠・信雄・信孝・三法師）。光秀は主役にしない（名前も出さない）。
#   語り手は剣崎1人。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない。予想の席は研究者の説（渡邊大門・矢部健太郎・藤田達生・和田裕弘）に置く。言えないことは言えないと言う。
#   冒頭（10秒以内）＝本能寺の変の7年前（1575年）、織田家の当主はもう信長ではなかった。
#   序章／第1章 家督を継いだ信忠（1575〜1582）／第2章 息子たちに託した道（1582年5月：信孝の讃岐・信雄の伊賀・朝廷の推任）／第3章 6月2日 二条の御所の信忠／
#   第4章 清洲で本当に決まったこと（1582年6月27日）／第5章 史実の織田家のその後（1583〜明治）／第6章 分岐1 織田家は誰が継いだか／第7章 分岐2 信雄・信孝と朝廷／まとめ。
#   締めは余韻の一文＋登録のお願い。次回予告・二人の締めは無し（story: true）。
# 既出との重なり：akechi-if（もし明智光秀が裏切らなかったら）は光秀の側・方面軍の配置・毛利と四国の想像・運命表。この回は織田家の側（家督・息子たちの行く先・清洲・子孫の藩）。
#   同じ事実（5月7日の朱印状・住吉の着陣）は言い回しを変え、信孝の「養子」の面から言う。akechi-if の「九州まで一気に」の台詞・和田裕弘「信忠が健在なら秀吉の台頭はなかった」は使わない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/本能寺if織田家_facts_20261127.yaml）にあるものだけ。行の上に `# fact: honnouji-NN`。
#   誰でも知る前置き（本能寺の変・秀吉の天下統一・家康が将軍職を秀忠に譲ったこと・関ヶ原）は短く使う。
#   記録の食い違いは3つだけ並べる：①信忠の秋田城介の任官の年（信長公記の天正3年／世界大百科事典の1576年）②清洲の会議の筋（古い辞典の跡目争い／近年の研究の既定路線）
#   ③秀信（三法師）の死の日（5月8日／5月27日）。ほかに割れるもの（岐阜城主の年・玄以の逃げた先・信孝の自害の日・天童へ移った年・宇陀崩れの年）は言わないか、1つの出どころで言う。
# 自分で計算した数（数え年）：
#   信長 天文3年1534生→天正3年1575で42・天正10年1582で49。信忠 弘治3年1557生→1575で19・1582で26。信孝 永禄元年1558生→1568で11・1583で26。
#   三法師（秀信）天正8年1580生→1582で3・1605で26（信忠と同じ26）。
#   家督（天正3年1575年11月）→本能寺の変（天正10年1582年6月）＝7年。変（6月2日）→清洲（6月27日）＝25日後。変（1582）→秀吉の天下統一（1590）＝8年後。
#   信雄の叱責（1579）→伊賀平定（1581）＝2年後。宇陀（1615）→柏原へ（1695）＝80年。家康が将軍職を秀忠へ（1605）→家康の死（1616）＝11年。
# 季節（旧暦）：天正3年11月＝冬（序章の「冬」）／天正10年3月＝春（高遠）／5月・6月＝夏（6月2日を「夏の朝」）。季節を言わない所は言わない。
# 確かめられなかったこと（台本では言わない）：信忠が京に長く留まった理由の史料・玄以に三法師を託した同時代の記録・信孝の辞世の初出・秀信に子がいなかった記録（寛政譜は未見）・
#   信長が推任にどう答えたか・4月24日の信長書状（秋の出陣予定）の原文・谷口克広の「本能寺の変なかりせば」の本文。
# 絵：Gemini（Chrome）で新しく14枚（G01〜G19）。足りない所は北条の回の絵（H02〜H26）を写して使う。一覧は scripts/story/honnouji_if_main_look.yaml の頭。
