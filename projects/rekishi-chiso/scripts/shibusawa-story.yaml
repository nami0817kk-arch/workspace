# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。渋沢栄一のその後：慶喜の伝記に25年（1868〜1918）。2026-11-26 作成。公開の予定は 12/2 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の A その後型（幕末・明治〜大正）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「渋沢栄一は、なぜ旧主・徳川慶喜の伝記に25年をかけたのか」。主役は渋沢（慶喜の生涯の説明は短く。yoshinobu.yaml・yoshinobu-if.yaml と重ねない）。
#   答えの席（題名・サムネでは明かさない）＝①静岡の再会で受けた恩（水戸へ行かせなかった配慮）への謝恩 ②「逆賊・怯懦」と言われた慶喜の誤解を解く ③本人の口から聞いて残す（昔夢会）。
# 共通の決まり5つ：①題名は問いで理由を明かさない ②主語は渋沢1人 ③誰でも知る像「1万円札の顔・会社をつくった実業家」を入口に、「生涯かけたのは会社ではなく旧主の伝記」へ裏返す
#   ④渋沢栄一はこのチャンネルで初めて（posted.json・scripts に無い） ⑤数字は中身そのもの（25年・8冊・25部だけ・17回）。
# 冒頭（10秒以内）＝1万円札の顔が、50代から70代にかけて作り続けたのは会社ではなかった。30秒までに：慶喜「どうぞ止めて呉れ」・速記は話しにくい・命日に印刷が仕上がる。
# 記録の食い違い（3つ）：①駿府の再会（日記＝12月23日の10時ごろ／『雨夜譚』1887＝着いた翌々日の夕方（着いたのは「二十日過ぎ」）／竜門雑誌498号 1930＝夜、行灯のそばに慶喜が現れる）
#   ②始まりの年（自序・中外商業新報＝明治26年／国民新聞の転載・実業之日本＝明治27年） ③かかった年数（竜門雑誌・中外＝25年／墓前＝二十有余年／萩野の跋＝十年）。
# 季節と年代：明治元年12月は旧暦（明治5年12月までは旧暦）。季節は言わない（「明治元年の12月」とだけ。西暦は1869年2月）。地名は明治2年6月まで駿府（日記も「府中」）なので、明治2年1月までは「駿府」と言う。明治2年1月16日も旧暦のまま、季節は言わない。
#   年の分からない史料は使っていない（慶喜が写真を撮った・猟をした話は静岡時代と限らないので「趣味の多い人だった」とだけ言い、年の流れに入れない）。
# 計算（自分で計算し直した）：渋沢 天保11年2月13日（1840-03-16）生・1931-11-11没。慶喜 天保8年9月29日（1837-10-28）生・1913-11-22没。年齢は満で言う。
#   明治26年夏秋（1893）→ 大正7年1月（1918）＝24年あまり（竜門雑誌の言い方では「25年」）。渋沢は1893年に53歳、1918年1月に77歳（＝50代から70代）。
#   再会（1869-02-04）：渋沢28歳・慶喜31歳。昔夢会の第1回（1907-07-23）：慶喜69歳・渋沢67歳。第17回（1913-05-03）まで5年9か月あまり。慶喜の死（1913-11-22）：76歳。
#   死から印刷の完成（1917-11-22）までちょうど4年（4度目の命日）。再会（1869-02-04）から墓前の式（1917-11-22）まで48年9か月あまり（「50年近く」）。生涯は91年8か月（24年あまり＝4分の1を超える）。『雨夜譚』1887＝再会の18年後、竜門雑誌307号 1913＝44年後、498号 1930＝61年後。
#   萩野の関わり：1907→1918＝10年あまり（跋の「十年」と合う）。会17回＋訪問8回＝25。
# 事実は事実カード（dev/output/rekishi-chiso/research/渋沢栄一_facts_20261126.yaml）にあるものだけ。行の上に `# fact: shibusawa-NN`。
#   使わないこと：慶喜の昔夢会での答えの中身（風邪など。一般誌の記事だけ）・福地の没年（未確認）・費用の金額（「私費数万円」は1909年の転載記事だけなので「多額の私財」と言う）・
#   関東大震災で記録が焼けた話（一般誌だけ）・500社などの数（カード無し）。
#   「と伝わる」「とされる」「といわれる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
