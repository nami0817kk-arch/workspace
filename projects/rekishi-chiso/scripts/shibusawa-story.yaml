# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  新しい1万円札の顔、渋沢栄一。会社づくりの父と呼ばれた人が、50代から70代にかけて、およそ25年をかけ続けたのは、会社ではありませんでした。
  それは、ただ1人の旧主、最後の将軍・徳川慶喜の伝記。慶喜は初め、「どうぞ止めてくれ」と断りました。
  渋沢栄一は、なぜ、旧主の伝記に25年をかけたのか。渋沢の日記と口述、聞き取りの会の記録、墓の前の言葉を、年の順にたどりました。
  この動画でわかること
  ・明治元年、駿府（静岡）の寺での再会と、記録ごとに違うその場面
  ・渋沢が水戸へ行かせてもらえなかった本当の理由
  ・慶喜が「止めてくれ」と言った伝記が、どう始まったのか
  ・慶喜本人に聞いた「昔夢会」と、25部だけ刷られた記録
  ・8冊の伝記が仕上がった日と、墓の前で渋沢が語ったこと
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  渋沢栄一の日記・口述『雨夜譚』（1887年）・『竜門雑誌』の談話と記事・『徳川慶喜公伝』の自序と萩野由之の跋・『昔夢会筆記』の例言・墓前の言葉・当時の新聞は、渋沢栄一記念財団『渋沢栄一伝記資料』デジタル版に収められた原文によります。
  明治5年までの月日は当時の暦（旧暦）のままです。年齢は満年齢、年数は記録から自分で計算し直したものです。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。渋沢栄一と徳川慶喜の肖像写真は、パブリックドメインのものです。サムネイルの絵も、AI による想像図です。

en:
  title: "Shibusawa Eiichi's Later Life: 25 Years for His Old Lord's Biography"
  description: |-
    Shibusawa Eiichi, the face of Japan's new 10,000-yen note, is known as the father of Japanese business. Yet from his fifties to his seventies, he spent about 25 years on something that was not a company.
    It was the biography of one man: his former lord, Tokugawa Yoshinobu, the last shogun. At first, Yoshinobu asked him to stop.
    Why did Shibusawa spend 25 years on his old lord's biography? We follow Shibusawa's diary and memoirs, the record of interviews with Yoshinobu himself, and the words spoken at his grave.
    In this video you will learn:
    - Their reunion at a temple in Sunpu (Shizuoka) in 1869, and records that describe it differently
    - Why Yoshinobu kept Shibusawa from going to Mito
    - How the biography Yoshinobu refused at first came to be written
    - The "Sekimu-kai" interviews with Yoshinobu, and the record printed in only 25 copies
    - The day the eight volumes were finished, and what Shibusawa said at the grave
    Dates before 1873 follow the old Japanese calendar. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Why 25 Years for One Biography?"
    - "1869: Reunion at Hodai-in Temple, Sunpu"
    - "Why Not Mito? Staying in Sunpu"
    - "1893: 'Please Stop,' Said Yoshinobu"
    - "1897: From Shizuoka to Tokyo"
    - "1907: The Sekimu-kai Interviews"
    - "1917: Eight Volumes at the Grave"
    - "Summary: Why Did Shibusawa Spend 25 Years?"

