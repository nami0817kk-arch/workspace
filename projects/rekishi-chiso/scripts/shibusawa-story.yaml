sections:
  # ================================================================ 序章。答えの席：なぜ25年をかけたのか
  - title: 渋沢栄一は、なぜ旧主の伝記に25年をかけたのか
    background: {image: paintings/shibusawa_portrait_1922.jpg, credit: "渋沢栄一（1922年以前の写真）"}
    year: 1893
    lines:
      # fact: shibusawa-15
      - 語り: 新しい1万円札の顔、渋沢栄一。50代から70代まで、およそ25年をかけ続けたのは、会社ではなく、ただ1人の旧主の伝記でした。
        tone: 重い
      # fact: shibusawa-13
      - 語り: 旧主とは、最後の将軍、徳川慶喜。逆賊と言われ、臆病者と罵られた人です。
      # fact: shibusawa-03
      - 語り: ところが慶喜は、初め、その伝記を断りました。渋沢の書いた序に、その言葉が残っています。どうぞ、止めてくれ。
        tone: 強調
      - 語り: 渋沢栄一は、なぜ、断られた伝記に、25年をかけたのか。
        tone: 疑問
        pause: 0.4
      # fact: shibusawa-12
      - 語り: 全8冊の印刷が仕上がったのは、慶喜の、4度目の命日。本は、その日の朝、谷中の慶喜の墓の前に、捧げられます。
        tone: しみじみ
      # fact: shibusawa-01
      - 語り: 渋沢は、伝記の序に、こう書いています。これを、終生の事業として作り上げたいと思ったのは、決して、偶然のことではない。
      - 語り: 答えの手がかりは、明治元年の12月、旧主と家来が、駿府の寺で再会した日にあります。
        hook: true

  # ================================================================ 第1章 宝台院の再会（明治元年12月＝旧暦。季節は言わない）
  - title: 明治元年12月、駿府の宝台院　記録で変わる再会の場面
    background: {image: paintings/yoshinobu_portrait_1867_full.jpg, credit: "徳川慶喜（1867年の写真）"}
    year: 1868
    lines:
      - 語り: 渋沢は、もとは、慶喜の家来でした。埼玉の農家に生まれ、慶喜が当主だった一橋家に仕えて、やがて幕府の家臣になります。
        portrait: paintings/yoshinobu_shibusawa_samurai_1866.jpg
      - 語り: 1867年、渋沢は、慶喜の弟、徳川昭武に付き従って、パリへ渡りました。その留守のあいだに、幕府は倒れます。
        portrait: paintings/shibusawa_paris_1867.jpg
      - 語り: 慶喜は、将軍の座を降り、朝廷に逆らう者、朝敵と名指しされて、謹慎しました。そして、徳川家の新しい領地、駿府、のちの静岡へ移されています。
      # fact: shibusawa-16
      - 語り: 渋沢の日記によれば、明治元年の12月19日。日本に戻った渋沢は、昭武の手紙と、フランスで使ったお金の勘定書を持って、駿府に着きました。
        card: {head: "明治元年12月19日", body: 渋沢、駿府に着く}
      # fact: shibusawa-17
      - 語り: 慶喜が身を置いていたのは、宝台院という寺です。日記には、23日の10時ごろ、宝台院へ参り、お目にかかった、とあります。
        card: {head: "渋沢栄一の日記", body: 23日10時ごろ、宝台院で拝謁}
      # fact: shibusawa-18
      - 語り: ところが、その18年後、明治20年に渋沢が語った半生の記録、『雨夜譚』では、この場面が、少し違います。
      # fact: shibusawa-18
      - 語り: 『雨夜譚』には、こうあります。着いた翌々日の夕方から、宝台院へ出向き、ゆっくりと、ヨーロッパを回った様子や、昭武の留学の様子を申し上げた。
        tone: 強調
      # fact: shibusawa-20
      - 語り: 慶喜が亡くなった直後、大正2年の談話では、渋沢は、慶喜の居間が、ひどく粗末で、仕える者もわずか2人か3人だった、と語ります。思わず、涙を浮かべた、と。
        tone: しみじみ
      # fact: shibusawa-19
      - 語り: さらに、再会から61年後、昭和5年の『竜門雑誌』の談話では、場面は、夜になっています。
      # fact: shibusawa-19
      - 語り: 行灯のそばに、ひょろりと誰かが来た。そばに仕える人かと思ったら、それが、慶喜だった。
        tone: しみじみ
      # fact: shibusawa-19
      - 語り: 渋沢が、世の移り変わりを嘆き始めると、慶喜は、こう言った。今日は、そんな愚痴を聞くために、会ったのではない。
        tone: 強調
      - 語り: 日記は10時ごろ、『雨夜譚』は夕方、昭和の談話は夜。同じ再会が、年を経た語りほど、くわしく、劇的になっていきます。どれも、渋沢の側から見た場面です。
        figure: {type: stats, title: 駿府の再会　記録の書き方, items: [[日記（明治元年）, 23日の10時ごろ, 宝台院で拝謁], [雨夜譚（1887年）, 着いた翌々日の夕方, 落ち着いて報告], [竜門雑誌（1930年）, 夜、行灯のそば, 愚痴を聞くためではない]], upto: 3}
      # fact: shibusawa-21
      - 語り: ただ、確かなことが1つあります。この再会のあと、慶喜は、渋沢を、駿府に留めました。
        figure: null
        hook: true
      - 語り: 渋沢は、それに、腹を立てることになります。
        tone: 重い
        hook: true

  # ================================================================ 第2章 なぜ水戸へ行かせなかったのか
  - title: なぜ水戸へ行かせなかったのか　駿府に残った渋沢
    background: {image: paintings/yoshinobu_portrait_hunting.png, credit: "徳川慶喜（明治の写真）"}
    year: 1869
    lines:
      # fact: shibusawa-21
      - 語り: 慶喜は、渋沢を、藩の勘定組頭に任じました。お金の出し入れを預かる役人の、かしらです。
        card: {head: "慶喜の命", body: 渋沢を駿府に留め、勘定組頭に}
      # fact: shibusawa-21
      - 語り: のちに竜門社がまとめた渋沢の記録は、このとき慶喜が、昭武が無事に帰ってこられたのは、ひとえに、お前の力だ、と褒めた、と記します。
      # fact: shibusawa-22
      - 語り: けれど、渋沢は、水戸にいる昭武のもとへ行くつもりでした。水戸からも、渋沢をこちらへ寄こしてほしい、という申し入れが来ていた、と『雨夜譚』は語ります。
      # fact: shibusawa-23
      - 語り: 渋沢は、役目を命じる書き付けを、その場で突き返してしまいます。駿府に留められたことに、腹を立てていたのです。
        tone: 強調
      # fact: shibusawa-22
      - 語り: その渋沢に、わけを明かしたのは、藩の重役、大久保一翁です。
        portrait: null
      # fact: shibusawa-22
      - 語り: 『雨夜譚』によれば、一翁は、こう言いました。水戸へ行けば、あちらの者たちの妬みを買い、結局は、お前の身に、害が及ぶおそれもある。
        tone: しみじみ
      # fact: shibusawa-22
      - 語り: 昭和5年の談話で、渋沢は、一翁の言葉を、こう語っています。あの事は、殿様が、ご自身で、お取り計らいになったことだ。
        tone: 強調
      - 語り: 留めたのは、藩の都合ではなく、慶喜が、渋沢の身を案じたからだった。渋沢は、そう受け取っています。
        tone: しみじみ
      # fact: shibusawa-23
      - 語り: わけは分かった。それでも渋沢は、役に就けば、給金のために仕えることになる、と言い張って、勘定組頭を何度も断りました。最後には、役を免じられています。
      # fact: shibusawa-24
      - 語り: 駿府に残った渋沢は、明治2年1月16日、駿府の紺屋町に、商法会所を開き、その頭取になります。
        card: {head: "明治2年1月16日", body: 駿府に商法会所を開く}
      # fact: shibusawa-24
      - 語り: 『雨夜譚』によれば、ねらいは、西洋で行われている、共力合本法。人々のお金を集めて、1つの商いを起こすやり方です。のちの会社づくりの、最初の一歩でした。
      # fact: shibusawa-24
      - 語り: 竜門社の記録は、官と民から集めた元手の合計を、29万4,717両あまり、としています。
        figure: {type: stats, title: 駿府の商法会所, items: [[開いた日, 明治2年1月16日, 紺屋町で], [頭取, 渋沢栄一, 28歳], [元手の合計, 約29万両, 官と民の出資]], upto: 3}
      - 語り: このあと渋沢は、新しい政府に呼ばれて、静岡を離れ、やがて、銀行や会社をつくる、実業の道へ進みます。
        figure: null
      # fact: shibusawa-25
      - 語り: それでも、明治33年に出た、渋沢の『六十年史』によれば、慶喜が静岡にいるあいだ、渋沢は、毎年、欠かさず訪ねました。
      # fact: shibusawa-25
      - 語り: 渋沢の日記には、明治17年の6月1日、静岡に着いたその夜、紺屋町の屋敷で、慶喜にお目にかかった、とあります。
        card: {head: "明治17年6月1日", body: 紺屋町の屋敷で慶喜に会う}
      # fact: shibusawa-25
      - 語り: 伝記の序には、落語家や講釈師を連れて行き、慶喜を慰めたこともあった、と書かれています。
      - 語り: 静岡に通い続けて、二十数年。渋沢は、ある宴会のあと、1人の物書きに、思い切った頼みごとをします。
        hook: true
      - 語り: 頼んだのは、旧主、慶喜の伝記でした。
        hook: true

  # ================================================================ 第3章 明治26年、どうぞ止めて呉れ（食い違い②：26年／27年）
  - title: 明治26年、帝国ホテルの宴会のあと　「どうぞ止めて呉れ」
    background: {image: paintings/shibusawa_portrait_1900.jpg, credit: "渋沢栄一（1900年の写真、『青淵先生六十年史』）"}
    year: 1893
    lines:
      # fact: shibusawa-02
      - 語り: 伝記の序によれば、明治26年の夏から秋のころ。帝国ホテルの、ある宴会のあとで、渋沢は、福地源一郎と、維新のころの話をしていました。
        card: {head: "明治26年", body: 帝国ホテルの宴会のあと}
        portrait: paintings/shibusawa_portrait_1900.jpg
      # fact: shibusawa-02
      - 語り: 福地は、幕府に仕えたことのある、新聞の記者で、物書きです。渋沢は、その福地に、慶喜の伝記の主任を、引き受けてくれないか、と持ちかけました。
      # fact: shibusawa-01
      - 語り: 渋沢の記録を集めた資料集は、その理由を、こうまとめています。慶喜の本当の思いが、世の中に、ひどく曲げて受け取られているのを、残念に思った。
        tone: 強調
      # fact: shibusawa-13
      - 語り: 慶喜は、鳥羽・伏見の戦いのあと、兵を置いて、大坂城から、江戸へ退いた将軍です。渋沢の序には、慶喜が、逆賊と言われ、臆病者と罵られた汚名、という言葉があります。
        portrait: paintings/yoshinobu_portrait_jakonoma.jpg
      # fact: shibusawa-03
      - 語り: 渋沢は、人を通して、慶喜に伺いを立てました。返ってきた答えは、許さない。どうぞ止めてくれ、でした。
        tone: 重い
        card: {head: "慶喜の答え", body: どうぞ止めてくれ}
      # fact: shibusawa-04
      - 語り: それでも、渋沢は、あきらめません。慶喜は、のちに、ようやく許しました。ただし、条件が付いていました。
      # fact: shibusawa-04
      - 語り: 世の中に公にするのは、死んだあと、しかるべき時がたってから。
        tone: 強調
        card: {head: "慶喜の条件", body: 公にするのは死後しかるべき時に}
      # fact: shibusawa-31
      - 語り: ところで、この始まりの年は、記録によって、ずれています。渋沢の序は、明治26年。けれど、明治42年の国民新聞の記事や、大正7年の実業之日本は、明治27年から、と書いています。
        figure: {type: stats, title: 伝記を始めた年, items: [[渋沢の序, 明治26年, 帝国ホテルの宴会のあと], [国民新聞（1909年）, 明治27年, 竜門雑誌に転載], [実業之日本（1918年）, 明治27年, 編纂に着手]], upto: 3}
      # fact: shibusawa-12
      - 語り: 渋沢自身も、墓の前の言葉では、明治27年から、と言っています。思い立った年と、手を付けた年の違いかもしれません。
        figure: null
      # fact: shibusawa-05
      - 語り: 資料集によれば、明治34年の春。渋沢は、深川の自分の屋敷の一室に、事務所を開きました。
        card: {head: "明治34年春", body: 深川の屋敷に事務所}
      # fact: shibusawa-05
      - 語り: けれど、福地は、国会の議員になって忙しくなり、のちに病気がちになって、筆は進みません。仕事は、止まってしまいます。
        tone: 重い
      - 語り: 福地の筆が止まったまま、伝記は、何年も進みませんでした。
        hook: true
      - 語り: その少し前から、慶喜の身の上にも、30年ぶりの大きな変化が起きていました。
        hook: true

  # ================================================================ 第4章 静岡から東京へ（1897〜1902）
  - title: 明治30年、静岡から東京へ　公爵になった旧主
    background: {image: paintings/yoshinobu_portrait_late_13.jpg, credit: "徳川慶喜（晩年の写真）"}
    year: 1897
    lines:
      # fact: shibusawa-26
      - 語り: 話は少し戻ります。渋沢の大正2年の談話によれば、慶喜は、明治30年の11月まで、静岡の片田舎で、土地の人々を友として暮らしました。
        card: {head: "明治30年11月", body: 慶喜、静岡を離れ東京へ}
      # fact: shibusawa-26
      - 語り: 東京に移った慶喜を、渋沢は、巣鴨の屋敷に訪ねます。日記には、明治32年に、お屋敷へ伺った、という書き込みが残ります。
      # fact: shibusawa-26
      - 語り: 同じ明治32年の6月27日。渋沢は、慶喜と井上馨を、飛鳥山の別邸に招き、新しく建てた茶室で、昼の食事を出しています。
        card: {head: "明治32年6月27日", body: 飛鳥山の茶室に慶喜を招く}
      # fact: shibusawa-27
      - 語り: 昭和2年の談話で、渋沢は、こんな話も残しています。上京のあと、伊藤博文が、慶喜をこのままにしておくのは気の毒だ、と言い、慶喜の内々の考えを伺ってくれ、と渋沢に頼んだ。
        portrait: null
      # fact: shibusawa-27
      - 語り: 明治35年、慶喜は、公爵になります。この年の渋沢の日記には、新しい公爵を受ける手続きの話を聞いた、という書き込みがあります。
        tone: 強調
        portrait: paintings/yoshinobu_portrait_late_13.jpg
        card: {head: "明治35年", body: 慶喜、公爵に}
      - 語り: 朝廷に逆らう者と名指しされた人が、華族のいちばん上の位、公爵になったのです。
        tone: しみじみ
        portrait: null
      # fact: shibusawa-06
      - 語り: 伝記のほうは、福地が世を去ったあと、渋沢が、やり方を改めました。序によれば、主任を頼んだのは、国文学と歴史の学者、萩野由之です。
        hook: true
      - 語り: そして、渋沢は、慶喜本人を、話の席に、引き出そうとします。
        tone: 強調
        hook: true

  # ================================================================ 第5章 昔夢会（1907〜1913）
  - title: 昔夢会　慶喜は語りたがらなかった
    background: {image: paintings/yoshinobu_portrait_late_14.jpg, credit: "徳川慶喜（晩年の写真）"}
    year: 1907
    lines:
      # fact: shibusawa-07
      - 語り: 明治40年の6月24日。渋沢は、日本橋の兜町にある、自分の事務所の2階に、伝記の編纂所を置きました。
        card: {head: "明治40年6月24日", body: 兜町の事務所の2階に編纂所}
      # fact: shibusawa-07
      - 語り: 顧問には、渋沢の2人の娘婿、法学者の穂積陳重と、阪谷芳郎。主任は萩野由之。歴史学者の三上参次も、加わりました。
        figure: {type: people, title: 慶喜公伝の編纂, nodes: [[渋沢栄一, 編纂を起こした], [萩野由之, 主任], [三上参次, 校修], [穂積陳重, 顧問・娘婿], [阪谷芳郎, 顧問・娘婿]], edges: [[渋沢栄一, 萩野由之, 主任を頼む], [渋沢栄一, 三上参次, 校修], [渋沢栄一, 穂積陳重, 顧問], [渋沢栄一, 阪谷芳郎, 顧問]], upto: 5}
      # fact: shibusawa-08
      - 語り: その1か月後、7月23日。兜町の事務所で、慶喜を囲む、最初の会が開かれます。慶喜は、69歳でした。
        figure: null
        card: {head: "明治40年7月23日", body: 慶喜を囲む第1回の会}
      # fact: shibusawa-08
      - 語り: 渋沢が大正4年に書いた例言によれば、この会を、昔夢会、昔の夢の会と名付けたのは、慶喜本人です。
        tone: しみじみ
      # fact: shibusawa-10
      - 語り: 同じ例言は、こうも書いています。慶喜は、もともと、自分の歩みを語ることさえ、喜ばなかった。
        tone: 重い
      # fact: shibusawa-10
      - 語り: 速記は、途中から許されました。けれど、慶喜は、速記の係がいては話しにくい、と言い、第14回からは、また、手で書き留める筆記に戻っています。
        card: {head: "昔夢会筆記の例言", body: 速記者ありては話しにくし}
      # fact: shibusawa-09
      - 語り: 会場は、兜町の事務所と、飛鳥山の渋沢の屋敷。慶喜がこの会に出たのは、およそ17回。ほかに、編纂の係が慶喜の屋敷を訪ねて、話を聞いたのが8回ありました。
        figure: {type: stats, title: 昔夢会, items: [[始まり, 明治40年7月23日, 兜町の事務所で], [慶喜が出た会, およそ17回, 本人が語る], [屋敷を訪ねた聞き取り, 8回, 編纂の係が]], upto: 3}
      # fact: shibusawa-09
      - 語り: 最後の第17回は、大正2年の5月3日。飛鳥山の屋敷でした。最初の会から、5年9か月あまりがたっています。
        figure: null
      # fact: shibusawa-39
      - 語り: 慶喜の答えは、自分の行いを弁明する色が濃い。歴史家の安藤優一郎さんは、2021年の記事で、そう読んでいます。本人の言い分を、本人の口から残した記録、とも言えます。
      - 語り: その第17回から、半年あまり。
        hook: true
      - 語り: 渋沢のもとに、小石川の慶喜の屋敷から、知らせが届きます。
        tone: 重い
        hook: true

  # ================================================================ 第6章 慶喜の死と墓前の8冊（1913〜1918。食い違い③：25年／二十有余年／十年）
  - title: 命日に仕上がった8冊　墓の前で渋沢は何を語ったのか
    background: {image: paintings/yoshinobu_portrait_late_14.jpg, credit: "徳川慶喜（晩年の写真）"}
    year: 1913
    lines:
      # fact: shibusawa-28
      - 語り: 大正2年11月22日。当時の新聞によれば、午前4時20分。慶喜は、小石川の第六天町の屋敷で、亡くなりました。76歳でした。
        card: {head: "大正2年11月22日", body: 徳川慶喜、死去}
      # fact: shibusawa-28
      - 語り: 『竜門雑誌』によれば、渋沢は、急いで屋敷に駆けつけましたが、病床に着いたときには、すでに、息を引き取ったあとでした。
        tone: 重い
      # fact: shibusawa-28
      - 語り: 渋沢は、葬儀の委員の総裁になります。11月30日、上野の寛永寺の裏手の斎場で、葬儀が行われ、慶喜は、谷中の墓地に葬られました。
      # fact: shibusawa-34
      - 語り: 資料集の見出しは、短く、こう書きます。慶喜、亡くなる。栄一、引き続き、この伝記の編纂に努める。
        tone: しみじみ
      # fact: shibusawa-11
      - 語り: 大正4年の4月。渋沢は、昔夢会の17回と、屋敷を訪ねた8回の筆記を、上・中・下の3巻にまとめました。
        card: {head: "大正4年4月", body: 昔夢会筆記　3巻}
      # fact: shibusawa-11
      - 語り: 刷ったのは、わずか25部。例言によれば、伝記の原稿に関わった者だけに、配りました。
        tone: 強調
        card: {head: "刷った部数", body: 25部だけ}
      # fact: shibusawa-12
      - 語り: そして、大正6年の11月22日。慶喜の命日に、全8冊の印刷が、仕上がります。亡くなってから、ちょうど4年でした。
        card: {head: "大正6年11月22日", body: 慶喜の命日に8冊の印刷が仕上がる}
      # fact: shibusawa-12, shibusawa-35
      - 語り: その朝10時、谷中の慶喜の墓の前で、本をささげる式が開かれました。慶喜の跡継ぎ、慶久が、墓に向かって、本の完成を告げます。
      # fact: shibusawa-12
      - 語り: 慶久の言葉には、渋沢が、私財をなげうって、伝記の編纂を起こし、二十余年、力を尽くした、とあります。
      # fact: shibusawa-35
      - 語り: 墓の前で、渋沢は、亡き慶喜を、興山公と呼び、フランスから戻ったころの思いを語りました。この身は、ただ、公にお仕えして、世を終えようと思ったのです。
        tone: しみじみ
        card: {head: "墓の前の渋沢", body: 一身は唯だ公に奉ずるを以て}
      # fact: shibusawa-13
      - 語り: そして、世の中が、慶喜公を誤解し、あるいは、曲げて受け取るに至った、と。皇室を尊び、国を守ろうとした、慶喜の苦しい胸の内を、語っています。
        tone: 重い
      # fact: shibusawa-14
      - 語り: 発行は、年が明けた大正7年の1月。竜門社が出し、冨山房が売りました。本伝が4冊、附録が3冊、索引が1冊。値段は、20円でした。
        figure: {type: stats, title: 徳川慶喜公伝, items: [[発行, 大正7年1月, 竜門社　発売は冨山房], [冊数, 全8冊, 本伝4・附録3・索引1], [値段, 20円, 当時の正価]], upto: 3}
      # fact: shibusawa-15
      - 語り: 3月18日。渋沢は、帝国ホテルに、新聞や雑誌の人々を招いて、刊行を知らせました。伝記を頼んだときと同じ、帝国ホテルです。
        figure: null
      # fact: shibusawa-15
      - 語り: このときの中外商業新報の記事は、福地が手を付けたときから数えれば、25年の歳月がたった、とあります。
        tone: 強調
      # fact: shibusawa-15, shibusawa-12
      - 語り: ところが、かかった年数も、記録によって違います。渋沢自身の、墓の前の言葉では、二十有余年。主任の萩野が本の最後に書いた跋では、自分が関わってから、まさに10年。
        figure: {type: stats, title: かかった年数, items: [[中外商業新報, 25年, 福地が手を付けてから], [渋沢の墓前の言葉, 二十有余年, 明治27年から], [萩野由之の跋, 10年, 自分が関わってから]], upto: 3}
      - 語り: 明治26年の夏から、大正7年の1月まで。数え直すと、24年あまり。渋沢の91年の生涯の、4分の1を超える年月です。
        figure: null
        hook: true
      - 語り: では、なぜ、渋沢は、それほどの年月を、かけたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ　渋沢栄一は、なぜ25年をかけたのか
    background: {image: paintings/shibusawa_portrait_1922.jpg, credit: "渋沢栄一（1922年以前の写真）"}
    year: 1918
    lines:
      # fact: shibusawa-36
      - 語り: 明治42年の国民新聞は、伝記の途中で、渋沢の思いを、こう伝えています。1つは、旧主の慶喜への、恩返しのため。
        tone: しみじみ
      # fact: shibusawa-12, shibusawa-22
      - 語り: 墓の前で読まれた慶久の言葉は、渋沢が、一橋家に仕えて以来の取り立てに感じて、伝記を起こした、と記します。
      # fact: shibusawa-22
      - 語り: 駿府では、水戸へ行かせなかったのは、慶喜の思いやりだった。渋沢は、そう、一翁から聞かされていました。
      # fact: shibusawa-36, shibusawa-13
      - 語り: もう1つは、幕末の慶喜の、まっすぐな心を、世に明らかにするため。「逆賊」「臆病者」と言われた汚名を、晴らしたい。始めたときの渋沢は、そう考えていました。
        tone: 強調
      # fact: shibusawa-05, shibusawa-10, shibusawa-04
      - 語り: そして、年月が延びたわけ。福地のもとで仕事が止まり、やり直したこと。語りたがらない本人から話を聞き出し、公にできるのは死後だったこと。その重なりが、25年になりました。
      - 語り: 昔夢会の記録は、本人の言い分です。弁明の書だ、という見方もあります。それでも、本人の口から聞いて残した、という一点で、ほかの記録にない重みがあります。
      # fact: shibusawa-15
      - 語り: 中外商業新報は、渋沢の思いを、こう書きました。天下と後の世のために、無実の罪を着せられたままの、慶喜の魂を慰めたい。
        tone: しみじみ
      - 語り: 会社ではなく、旧主の伝記に、25年。駿府の寺で、愚痴を聞くために会ったのではない、と言われたと、のちに語った家来は、50年近くのち、その主君の伝記8冊を、墓の前に届けたのです。
        tone: しみじみ
        pause: 0.8
      - 語り: 歴史の地層では、記録をたどって、人のその後を、掘り起こしています。よろしければ、チャンネル登録をお願いします。
