en:
  title: "Ashikaga Takauji: The Man Who Dropped a Character from the Hojo and Took One from the Emperor"
  description: |-
    In the fourth month of 1333 Ashikaga Takauji, then named Takauji with the character "taka" taken from the Hojo regent Takatoki, was sent to Kyoto as a general of the shogunate. At Shinomura in Tanba he turned against it, and the Kamakura shogunate fell in less than a month. In the eighth month he was granted a character from Emperor Go-Daigo's name and became "Takauji" written with the new character "taka" (honor) in place of the old one. The Kugyo Bunin records the change in 1333, while the Taiheiki places it two years later.
    This video digs into his life from his birth in 1305 to his death in 1358: the prayer text he wrote at Shinomura Hachimangu, the fall of the Rokuhara office and Kamakura, the Nakasendai Rebellion and his departure for the east without imperial permission, the Battle of Minatogawa, the Kenmu Shikimoku, and the Kanno Disturbance with his brother Tadayoshi. It also separates what documents show from what the Baishoron and Taiheiki tell, and traces how his image was made: the equestrian portrait whose subject is now undecided, the label "traitor", and the diagnosis of manic depression that appeared only in the 1960s.
    We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1333: The Banner at Shinomura and the Character from the Hojo"
    - "1305: Born to the Ashikaga, Married into the Hojo World"
    - "1333: The Prayer at Shinomura and the Fall of Kamakura"
    - "1333: A Character from the Emperor and the Nakasendai Rebellion"
    - "1336: Flight to Kyushu, Minatogawa and the Kenmu Shikimoku"
    - "1338: The Muromachi Shogunate, the Kanno Disturbance and His Death"
    - "1920: The Equestrian Portrait, the Traitor and the Manic Depression"
    - "Summary: Who Was Ashikaga Takauji?"

