terms:
  後醍醐天皇: 鎌倉幕府を倒そうとした天皇。のちに吉野へ逃れて南朝を開いた
  六波羅探題: 鎌倉幕府が京都に置いた役所。西国を見張る拠点
  綸旨: 天皇の命令を、側近が文書にして伝えるもの
  院宣: 上皇の命令を伝える文書
  中先代: 北条（先代）と足利のあいだに、一時だけ鎌倉を取った北条時行
  願文: 神仏に願いごとを書いて納める文書
  征夷大将軍: 武士のトップが任じられる官職。朝廷が任命する
  執事: 足利将軍家の政務や家の仕事を取り仕切る役
  施政方針: 政治をどう進めるかの方針。法律とは違う
  南朝: 後醍醐天皇が吉野に開いた朝廷。京の朝廷は北朝

