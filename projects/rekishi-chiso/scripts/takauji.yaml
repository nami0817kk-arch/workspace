# 足利尊氏（A作品・10/25 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：足利尊氏とは何者だったのか」）
# 冒頭の一点：幕府軍の大将・高氏が、1333年4月に丹波の篠村で旗を翻し、ひと月足らずで鎌倉幕府が滅ぶ。
#   名は「高氏」＝北条高時の一字（足利氏の系図の付記）→ 1333年8月5日に後醍醐の「尊治」の一字を賜り「尊氏」（『公卿補任』。『太平記』は2年後と書く＝割れる）。
#   まとめで「高氏として約14年（1319元服〜1333）・尊氏として約25年（1333〜1358）」と自分で数えて冒頭に戻る。
# 事実の出どころは dev/output/rekishi-chiso/research/takauji_facts_a.md（前半）・takauji_facts_b.md（後半と尊氏像）。素材は research/takauji_assets.md。
#   どちらも Wikipedia 中心の調べで、一次史料の原文には当たっていない。区分（確実／有力／後世の編纂物／現代の見方／未確認）は facts の通り。
# 決まり：①日付は当時の暦（旧暦）のまま。年は西暦で言う。冒頭で「いまの暦とは1〜2か月ずれる」と一度断る。
#   ②年齢は数え。生まれた日・場所は分からない（足利・丹波・鎌倉の三説）。肖像の「この時○歳」は出さない（age: false）。
#   ③使わない話（入れない）：生年月日7月27日／兵数（『太平記』の数字。湊川の騎数・時間・突撃の回数も）／赤橋守時の戦死日／鎌倉で自刃した人数／
#     尊氏が師直・師泰の殺害を指示した話（「関わりは分からない」まで）／直義の毒殺（出どころは『太平記』だけと断る）／七生報国／護良親王の最期の細部／
#     北条時行の肖像（Commons に無い。別人の肖像が混じっていた）／「等持院事件1934年」（誤り。木像の首は1863年、1934年は中島久万吉の辞任）。
#   ④後世の話（出典名を言う）：人質の登子と千寿王（『太平記』）・綸旨を受けた経緯（『梅松論』『太平記』、使者も場所も書ごとに違う）・出家しかけた話（『梅松論』『太平記』）・
#     正成の最期と進言（『太平記』）・八朔の贈り物と心の強さ・慈悲深さ（『梅松論』。足利方の本で夢窓疎石の評＝身内の称賛）・天龍寺の夢の話。
#   ⑤割れていれば割れていると言う：挙兵の日（27日／29日）・生まれの場所・改名の時期・幕府の始まり（1336か1338）・騎馬武者像の人物・直義の死因・「躁鬱」。
#   ⑥人物のセリフは入れない。⑦背景に人物の肖像・拡大絵を使わない。尊氏の確かな同時代の肖像は無い。伝・騎馬武者像は「像の人物は定まっていない」と断る。
#   ⑧現代の写真は「現在の〜」とその行で断る。江戸の絵・近代の絵は想像図と断る。
#   読みの注意：足利尊氏＝あしかがたかうじ／高氏＝たかうじ／直義＝ただよし／北条高時＝ほうじょうたかとき／赤橋登子＝あかはしとうし／赤橋守時＝あかはしもりとき／後醍醐＝ごだいご／尊治＝たかはる／
#     篠村八幡宮＝しのむらはちまんぐう／六波羅探題＝ろくはらたんだい／新田義貞＝にったよしさだ／千寿王＝せんじゅおう／義詮＝よしあきら／北条時行＝ほうじょうときゆき／
#     中先代の乱＝なかせんだいのらん／箱根・竹ノ下＝はこね・たけのした／湊川＝みなとがわ／楠木正成＝くすのきまさしげ／光厳＝こうごん／光明＝こうみょう／建武式目＝けんむしもく／
#     観応の擾乱＝かんのうのじょうらん／高師直＝こうのもろなお／高師泰＝こうのもろやす／直冬＝ただふゆ／夢窓疎石＝むそうそせき／梅松論＝ばいしょうろん／清水寺＝きよみずでら／
#     願文＝がんもん／綸旨＝りんじ／院宣＝いんぜん／鞆の浦＝とものうら／多々良浜＝たたらはま／公卿補任＝くぎょうぶにん／騎馬武者像＝きばむしゃぞう／集古十種＝しゅうこじっしゅ／
#     南北朝正閏問題＝なんぼくちょうせいじゅんもんだい／中島久万吉＝なかじまくまきち／等持院＝とうじいん／佐藤進一＝さとうしんいち／呉座勇一＝ござゆういち／東勝寺＝とうしょうじ／
#     打出浜＝うちでのはま／薩埵峠＝さったとうげ／鑁阿寺＝ばんなじ／笠置山＝かさぎやま／船上山＝せんじょうさん／名越高家＝なごえたかいえ／是円・真恵＝ぜえん・しんえ／八朔＝はっさく
