# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。魔女狩り：魔女を裁いたのは誰だったのか（1612年ペンドルの魔女裁判を軸に、1485〜2022年）。2026-11-26 作成。公開の予定は 12/1 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（世界史・近世ヨーロッパ）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「魔女を裁いたのは、誰だったのか」。答えの席＝裁き手（題名・サムネでは言わない）。
#   答え：多くは世俗の裁判所（イングランドは国王の判事の巡回裁判・陪審・地元の治安判事、ドイツは皇帝の刑法と領主の役人の委員会・村の委員会）。訴えは隣人から。
#   異端審問はむしろ少なく、スペインでは止めた側（サラサール）。ただし教会の人が無関係ではない（『魔女への鉄槌』を書いたのは審問官）＝宗教を貶めず、免罪もしない。
# 共通の決まり5つ：①題名は問いで、裁き手を明かさない ②主語は「魔女を裁いた者」という1つの役目。軸はペンドルの裁判記録（ポッツ 1613）
#   ③誰でも知る像「教会が魔女を火あぶりにした」を入口に裏返し、今（2008年の名誉回復・2022年の謝罪と恩赦の請願）へ届かせる ④魔女狩りはこのチャンネルで初めて（posted.json に無い）
#   ⑤数字は「ピン1本から5か月で10人に死刑」「900万と4万」「1626〜1630年の5年で630人」。
# 冒頭（10秒以内）＝誰でも知る像（教会が火あぶり）→ 1612年に10人へ死刑を言い渡したのは教会の人ではなかった（誰かは伏せる。majogari-12・22）。答えの席は2つ：裁いたのは誰か・見つけ出したのは誰か。
# 記録の食い違い（3つ）：⓪ピン（ロー本人＝断った／息子エイブラハム＝渡した。ポッツ本文）①ペンドルの処刑の日（ポッツ「翌日」＝20日／クロスリー序文 18日）と人数（10・11・9）②バンベルクの死者の数（630人以上／880人あまり／203人以上）
#   ③処刑数の推計（フォイクト 944万／レヴァック 6万→4万5千／ベーリンガー 3万〜／モンター 4万）。
# 年の扱い：イングランドはユリウス暦で、日付は記録のまま（「記録の日付で」と言う）。ロビンソンの取り調べ「1633年2月10日」は年が3月25日に変わる数え方なので今の数え方で1634年。
#   季節は言わない（3月・8月は記録の日付だけ）。年の分からない史料は使っていない。
# 計算（自分で計算し直した）：3月18日→8月17日＝約5か月。1612→1634＝22年。ジェネット 1612年に約9歳 → 1634年に約31歳（「30歳ほど」）。
#   1626〜1630＝5年。1782→2008＝226年。1612→2012＝400年。944万2994＝9,442,994（ベーリンガーの検算と一致）。900万÷4万5千＝200、÷4万＝225（「200倍以上」）。
#   イングランド 2,000×25%＝500。サラサールの巡回 1611年から約8か月（報告は1613年まで）。インスブルック 1485 → 魔女への鉄槌 1486年に書き 1487年に出回る。
# 事実は事実カード（dev/output/rekishi-chiso/research/魔女狩り_facts_20261126.yaml）にあるものだけ。行の上に `# fact: majogari-xx`。
#   使わないこと：拷問の細部・処刑の様子（「首を吊る」「火刑」の事実だけ）／2011年の猫のミイラ（魔女との結び付きは推測）／サムルズベリーの神父の実名（ポッツは「トンプソン、別名サウスワース」まで）／
#   ゲッジの900万（原文未見）／シュペーがヴュルツブルクの告解師だった話（否定する研究あり）／ハットンの本の数（書評だけ）。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
