sections:
  # ================================================================ 序章。答えの席：魔女を裁き、見つけ出したのは誰か
  - title: 魔女を裁いたのは、本当に教会だったのか
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1612
    lines:
      # fact: majogari-12, majogari-22
      - 語り: 魔女を火あぶりにしたのは、教会。そう思われがちですが、1612年のイングランドで、10人に死刑を言い渡したのは、教会の人ではありませんでした。
      # fact: majogari-13, majogari-22
      - 語り: 刑は、火あぶりではなく、首を吊る刑。この裁判に、教会の裁判所は、出てきません。
      # fact: majogari-19
      - 語り: 決め手の1つになったのは、9歳くらいの少女の証言でした。少女は、法廷の机の上に立たされて、自分の母に、不利な証言をしました。
        tone: 重い
      # fact: majogari-05
      - 語り: きっかけは、その5か月前。道で、行商人がピンを求められた、という出来事でした。
      - 語り: では、魔女を裁いたのは、誰だったのか。そして、魔女を見つけ出したのは、誰だったのか。
        tone: 疑問
      # fact: majogari-04
      - 語り: 裁いた判事たちが、自分で書かせた裁判の記録が、今も残っています。その記録を、最初の1日から読んでいくと、意外な裁き手が、浮かび上がります。
        hook: true

  # ================================================================ 第1章 ピン
  - title: 1612年3月18日、コルンの近くの道　ピンから始まった訴え
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1612
    lines:
      # fact: majogari-04
      - 語り: その記録は、1613年に出た、トマス・ポッツの本です。題は、ランカシャーの魔女の、驚くべき発見。
      # fact: majogari-04
      - 語り: 書いたのは、裁判所の書記のポッツ。書くよう命じたのは、裁いた判事たちで、判事の1人は、原稿に、自分で目を通しています。
      # fact: majogari-05
      - 語り: 舞台は、イングランドの北西部、ランカシャー。ペンドルの森と呼ばれた土地です。
      # fact: majogari-05
      - 語り: 記録の日付で、3月18日ごろ。今の数え方で、1612年のことです。アリゾン・デバイスという娘が、コルンという町の近くで、行商人のジョン・ローに出会い、ピンを求めました。
      # fact: majogari-05
      - 語り: ロー本人の、法廷での証言では、ローは、断ります。その直後、ローは、道に倒れ、体が、思うように動かなくなりました。
        tone: 重い
      # fact: majogari-06
      - 語り: 訴え出たのは、ローの息子、エイブラハム・ローです。ハリファクスの、毛織物の職人でした。
      # fact: majogari-06
      - 語り: ところが、息子の供述では、アリゾンは、ピンを買おうとしたものの、お金が無く、ローは、ピンを渡した、となっています。同じ場面が、記録によって、食い違うのです。
      # fact: majogari-06
      - 語り: 3月29日、エイブラハムは、アリゾンを探し出して、父の前に連れて来ます。そして翌日、治安判事の前で、誓って、訴えを述べました。
      # fact: majogari-06
      - 語り: 治安判事は、ロジャー・ノーウェル。国王から任されて、地元で取り調べをする役です。教会の人では、ありません。
      # fact: majogari-06
      - 語り: 同じ3月30日、アリゾン本人も、ノーウェルの取り調べを受けました。
      # fact: majogari-07, majogari-19
      - 語り: アリゾンの家は、祖母の「デムダイク」、母の「エリザベス」、兄の「ジェームズ」、そして幼い妹の「ジェネット」。
        figure: {type: table, title: アリゾン・デバイスの家, cols: [呼び名, 本名], rows: [[祖母, デムダイク, エリザベス・サザンズ], [母, エリザベス, エリザベス・デバイス], [兄, ジェームズ, ジェームズ・デバイス], [妹, ジェネット, ジェネット・デバイス]], upto: 4}
      # fact: majogari-07
      - 語り: 4月2日ごろ、ノーウェルは、アリゾンと、祖母のデムダイクを、ランカスター城へ送ります。近くに住む別の老女、チャトックスと、その娘のアン・レッドファーンも、一緒でした。
        figure: null
      # fact: majogari-07
      - 語り: 8月の巡回裁判まで、城の牢に、留め置くためでした。
      # fact: majogari-08
      - 語り: ところが、話は、そこで終わりません。ポッツによれば、投獄から1週間もたたない、復活祭の前の金曜日。残された家族と仲間が、マルキン・タワーという家に、集まりました。
      # fact: majogari-08
      - 語り: ポッツは、この集まりで、牢の番人を殺し、ランカスター城を爆破する相談がされた、と書いています。
      # fact: majogari-08
      - 語り: この集まりを理由に、さらに多くの人が、捕らえられました。
        tone: 重い
      - 語り: 8月、ランカスター城の法廷に座ったのは、どんな人たちだったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 ランカスター城の判事
  - title: 1612年8月17日、ランカスター城　国王の判事と9歳の証人
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1612
    lines:
      # fact: majogari-09
      - 語り: 記録の日付で、1612年8月17日、月曜日。ランカスター城で、巡回裁判が開かれます。
        card: {head: "1612年8月17日", body: "ランカスター城で巡回裁判"}
      # fact: majogari-09
      - 語り: 判事は2人。アルサムと、ブロムリー。どちらも、ロンドンの、国王の裁判所の判事でした。
      # fact: majogari-22
      - 語り: イングランドでは、魔女の重い事件は、教会ではなく、国王の判事が地方を回って開く、この巡回裁判で、裁かれていました。
      # fact: majogari-21
      - 語り: 裁きの根拠は、1604年の、魔術を禁じる法律です。悪い霊を呼び出す、などの魔術を、死刑にあたる重い罪と、定めていました。
        card: {head: "1604年の魔術法", body: "悪い霊を呼び出す魔術は死刑"}
      # fact: majogari-20
      - 語り: このときの国王は、まだスコットランドの王だった1597年に、悪魔学という本を、自分で書いています。
      - 語り: ただ、法廷には、いるはずの人が、1人、欠けていました。
      # fact: majogari-10
      - 語り: デムダイクです。ポッツは、こう書いています。年老いたデムダイクは、裁判の前に、城の中で死んだ。
        tone: 重い
      # fact: majogari-11
      - 語り: 8月18日、火曜日。この日に裁かれた1人が、アリゾンの母、エリザベス・デバイスです。
      # fact: majogari-19
      - 語り: 訴える側が呼んだ証人は、エリザベスの娘、ジェネット。ポッツによれば、年は、9つくらいでした。
        card: {head: "証人 ジェネット・デバイス", body: "年はおよそ9歳"}
      # fact: majogari-19
      - 語り: 娘の姿を見た母は、法廷で叫び声を上げ、娘を止めようとしました。
        tone: 重い
      # fact: majogari-19
      - 語り: 判事は、母を外へ連れ出させ、少女を、机の上に立たせて、証言させます。
      # fact: majogari-19
      - 語り: ジェネットは、兄のジェームズの裁判でも、証言しました。
      # fact: majogari-20
      - 語り: ポッツは、記録の中で、国王の悪魔学に、触れています。その悪魔学には、こうも書かれています。王への反逆の罪なら、子どもや妻も、証人になれる。神への大逆の魔術なら、なおのことだ。
      - 語り: けれど、この3日間の法廷には、魔女として訴えられながら、死刑にならなかった人たちも、いました。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 無罪の3人と死刑の10人
  - title: 1612年8月19日、無罪になった3人と、死刑の10人
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1612
    lines:
      # fact: majogari-11, majogari-17
      - 語り: 8月19日、水曜日。この日に裁かれた中に、ペンドルとは別の村、サムルズベリーの、3人の女性がいました。
      # fact: majogari-17
      - 語り: 訴えたのは、およそ14歳の少女、グレース・ソワーバッツでした。
      # fact: majogari-17
      - 語り: ところが、ポッツは、その訴えを、トンプソン、別名サウスワースという、カトリックの神父が、少女に教え込んだものだ、と記しています。少女自身も、取り調べで、訴えは偽りで、トンプソンという神父に教え込まれた、と述べました。ただ、神父の側の記録は、残っていません。
      # fact: majogari-17
      - 語り: 3人は、無罪となりました。
      # fact: majogari-16
      - 語り: 有罪か無罪かを決めたのは、陪審です。陪審が無罪とした人は、この3人を合わせて、8人いました。
        card: {head: "陪審の無罪", body: "3人を合わせて8人"}
      # fact: majogari-15
      - 語り: 別の村の女性、マーガレット・ピアソンは、死刑を免れ、4つの町の市の日に、さらし台に立たされたうえ、1年の禁錮となります。
      # fact: majogari-12
      - 語り: そして、死刑を言い渡されたのは、10人でした。老女「チャトックス」、「エリザベス」、「ジェームズ」、そして「アリゾン」。デバイス家の母と、2人の子が、含まれていました。
        tone: 重い
        card: {head: "死刑の判決", body: "10人　母と子2人も"}
      # fact: majogari-13
      - 語り: ポッツが写した、ブロムリーの判決文は、刑場で、死ぬまで首を吊る、と定めています。判決文は、ほとんどが、自分の自白で有罪になった、と述べています。ただ、クロスリーによれば、10人のうち5人は、最後まで自白しませんでした。
      # fact: majogari-14
      - 語り: 処刑は、その翌日。ランカスターの近くの、刑場でした。
        tone: 重い
      # fact: majogari-14
      - 語り: ポッツは、翌日、とだけ書いています。審理は19日まで続いたので、その翌日なら、8月20日です。
      # fact: majogari-14
      - 語り: ところが、1845年にこの本を出し直した、クロスリーは、序文で、処刑を、8月18日と書いています。自分が出し直した本文の、日付と合いません。
        figure: {type: table, title: ペンドルの処刑の日　記録の違い, cols: [書いてある日, 照らし合わせると], rows: [[ポッツ 1613年, 判決の翌日, 審理の後なら8月20日], [クロスリーの序文 1845年, 8月18日, 本文の日付と合わない]], upto: 2}
      # fact: majogari-12, majogari-18
      - 語り: ランカスターの10人のうち、イザベル・ロビーは、ペンドルではない村の人です。ペンドルの人だけなら、9人。このほか、7月にはヨークで、同じ2人の判事に裁かれ、処刑された女性もいました。
        figure: null
      # fact: majogari-06, majogari-22, majogari-16
      - 語り: ペンドルの魔女を、裁いた人を並べてみます。訴えたのは、「行商人の息子」。取り調べたのは、「地元の治安判事」。有罪を決めたのは、「陪審」。死刑を言い渡したのは、「国王の判事」。
        figure: {type: table, title: ペンドルの魔女を裁いた人, cols: [誰が, 何をしたか], rows: [[訴え出た人, 行商人の息子, 訴え出た], [治安判事, ロジャー・ノーウェル, 取り調べた], [陪審, 住民から選ばれた人々, 有罪か無罪かを決めた], [国王の判事, アルサムとブロムリー, 死刑を言い渡した]], upto: 4}
      - 語り: この裁判に、教会の裁判所は、一度も出てきません。
        figure: null
      - 語り: ここで、イングランドを離れます。魔女狩りがいちばん激しかった、海の向こうのドイツで、魔女を裁いていたのは。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 インスブルックからバンベルクへ
  - title: 1485年インスブルックから1626年バンベルクへ　司教の国で裁いたのは誰か
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1485
    lines:
      # fact: majogari-36
      - 語り: 魔女の処刑が多かったのは、今のドイツを中心とする、神聖ローマ帝国の土地です。ドイツの歴史家ベーリンガーが引く推計では、処刑の半分が、ここで起きました。
      # fact: majogari-50
      - 語り: 時代を、百年あまり、さかのぼります。1485年、オーストリアのインスブルック。異端審問官の、ハインリヒ・クラーマーが、魔女の裁判を始めました。
      # fact: majogari-50
      - 語り: ところが、この地の司教の代理は、手続きに欠陥があるとして、訴えられた人々を、放免させます。司教は、クラーマーを、教区から追い出しました。
      # fact: majogari-51
      - 語り: そのクラーマーが、翌年に書き上げたのが、魔女への鉄槌という本です。魔女を追う者の、手引きとして知られます。
      # fact: majogari-51
      - 語り: その第3部で、クラーマーは、こう書いています。魔女は、審問官が裁かなくてもよい。死刑は、世俗の裁判官が言い渡してよい。
        card: {head: "『魔女への鉄槌』第3部", body: "死刑は世俗の裁判官が言い渡してよい"}
      # fact: majogari-39
      - 語り: 帝国の刑法の土台は、1532年の、カロリナ刑法典。その第109条は、魔術で人に害をなした者を、死刑にし、火で処刑する、と定めていました。
        card: {head: "カロリナ刑法典 第109条", body: "魔術の害は火で処刑"}
      - 語り: ドイツで、火あぶりを定めていたのは、教会ではなく、皇帝の刑法でした。
      # fact: majogari-37
      - 語り: なかでも激しかったのが、バンベルク。この国の領主は、司教でした。教会の司教が、領主として、国を治めていたのです。
      # fact: majogari-37
      - 語り: バンベルク市の文書館によれば、1626年から1630年の、わずか5年で、少なくとも630人が、命を落としています。
        tone: 重い
        card: {head: "バンベルク 1626〜1630年", body: "少なくとも630人が死亡"}
      # fact: majogari-37
      - 語り: 裁判を動かしたのは、魔女委員会。司教の政府の、役人たちでした。
      # fact: majogari-38
      - 語り: つまり、裁いたのは、領主としての司教の役所です。教会の法廷では、ありません。バイエルン歴史事典も、聖職者の治める国でも、裁判を行ったのは、世俗の裁判所だった、と書いています。
      # fact: majogari-37
      - 語り: 市の文書館は、1595年から1631年までで、880人あまりが死んだ、と数えています。記録に残らない人も、いたと見られています。
      # fact: majogari-37
      - 語り: この迫害を止めたのは、皇帝の命令でした。1631年の、6月12日のことです。
      # fact: majogari-52
      - 語り: 同じ1631年、イエズス会の神父、フリードリヒ・シュペーは、名前を伏せて本を出し、魔女裁判の取り調べを、批判しました。拷問にかけられれば、無実の人でも、罪を認めてしまう。
      # fact: majogari-40
      - 語り: 訴えが、下から始まる土地も、ありました。トリーアの領地などでは、村や町が、自分たちで、魔女委員会を選び、魔女を探させ、証拠を集めさせました。
      # fact: majogari-41
      - 語り: その費用は、魔女税として、村の人たちが、前もって出していました。ドイツの歴史家、リタ・フォルトマーの指摘です。
      # fact: majogari-40
      - 語り: フォルトマーは、こうも書きました。この地方の魔女の裁判は、ほぼ例外なく、世俗の裁判所で行われた。
        card: {head: "リタ・フォルトマー", body: "魔女の裁判は、ほぼ例外なく世俗の裁判所で"}
      - 語り: では、教会の異端審問は、魔女狩りの中で、何をしていたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 異端審問
  - title: 1610年、ログローニョの判決と「魔女はいなかった」と書いた審問官
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1610
    lines:
      - 語り: スペインには、異端審問所がありました。教会の教えに背く者を、取り調べる、教会の裁きの場です。
      # fact: majogari-44
      - 語り: 1610年の、11月7日と8日。スペイン北部の町、ログローニョで、異端審問所は、魔女とされた人々に、判決を言い渡します。
        card: {head: "1610年11月7日・8日", body: "ログローニョの異端審問所の判決"}
      # fact: majogari-44
      - 語り: 火刑の判決は、11人。そのうち5人は、すでに牢で亡くなっていて、人形が、代わりに焼かれました。
        tone: 重い
      # fact: majogari-45
      - 語り: ログローニョの審問官の1人、アロンソ・デ・サラサール・フリアスは、1611年から、8か月ほどかけて、北部の村々を回り、人々の話を、聞いていきました。
      # fact: majogari-45
      - 語り: そして、異端審問の最高会議に、こう報告します。魔女のことが、語られ、書かれはじめるまで、その土地には、魔女も、魔女に呪われた者も、いなかった。
        card: {head: "審問官サラサールの報告", body: "語られ書かれるまで、魔女はいなかった"}
      # fact: majogari-45
      - 語り: 1614年、最高会議は、新しい指示を出し、魔女を火刑にする道を、事実上、閉ざします。
      # fact: majogari-46
      - 語り: 歴史家ルー・アン・ホムザによれば、このあと、スペインの異端審問は、二度と、魔女を訴えなかった、と言ってよいほどでした。
      # fact: majogari-47
      - 語り: 歴史家ウィリアム・モンターの数では、スペイン北部で、異端審問所が処刑した魔女は、およそ20数人。同じ土地の世俗の裁判所は、数百人を処刑しています。
        figure: {type: table, title: スペイン北部で処刑された魔女　モンターの数, cols: [処刑した数, 年代], rows: [[異端審問所, およそ20数人, 1498〜1610年], [世俗の裁判所, 数百人, 主に1520〜1625年]], upto: 2}
      # fact: majogari-48
      - 語り: ポルトガルで処刑された魔女は、11人だけ。スペインとイタリアの大きな異端審問所も、魔女の処刑には、消極的だった、とモンターは見ています。
        figure: null
      # fact: majogari-49
      - 語り: ローマでも、異端審問の手引きが、遅くとも1624年から、逮捕の前に、本当に害があったのかを、確かめるよう求めていました。
      - 語り: それでも、魔女狩りでは、何百万人もが殺された、と語られてきました。その数は、どこから来たのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 900万と4万
  - title: 1784年の掛け算　900万人と4万人
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1784
    lines:
      # fact: majogari-33
      - 語り: 900万に近い数を、最初に出したのは、1784年の、ドイツの雑誌の論文でした。
      # fact: majogari-33
      - 語り: 書いたのは、クヴェードリンブルクという町の、法律顧問。名は、フォイクトです。
      # fact: majogari-33
      - 語り: フォイクトは、町の、1569年から1598年までの、30年間の記録をもとに、記録の無い時代にも、同じ割合で、処刑があった、と仮定しました。
      # fact: majogari-33
      - 語り: そして、人口の割合で、ヨーロッパ全体に広げ、さらに、およそ1100年分を、掛け合わせます。出てきた数は、944万2994人。
        card: {head: "フォイクトの掛け算（1784年）", body: "944万2994人"}
      # fact: majogari-34
      - 語り: 1869年、グスタフ・ロスコフが、これを、約900万と丸めて、広めました。
      # fact: majogari-34
      - 語り: ベーリンガーによれば、のちには、ナチスの時代の宣伝や、1970年代の本でも、この数が使われます。
      # fact: majogari-29
      - 語り: 今の研究者の推計は、ずっと少ない数です。歴史家ブライアン・レヴァックは、1987年の本で、最大6万人。2006年の版では、およそ4万5千人に下げました。
      # fact: majogari-30
      - 語り: ベーリンガーは、少なくとも3万人。モンターは、およそ4万人と見ています。
      - 語り: 900万と、4万。同じ魔女狩りの数が、200倍以上も違うのです。
        tone: 重い
      # fact: majogari-31
      - 語り: 裁判は、ヨーロッパで、およそ11万件。その半分が、有罪になった。2017年の、ある書評は、そう紹介しています。
      # fact: majogari-32
      - 語り: 訴えられた人の、およそ4人に3人は、女性でした。ただ、アイスランドでは、女性は9%だけ。土地によって、大きく違います。
      # fact: majogari-23
      - 語り: イングランドで、魔女として裁かれたのは、多くとも2000人ほど。処刑されたのは、その4分の1ほど。イングランドの文化財を守る団体の解説は、そう書いています。
      - 語り: ペンドルの10人は、その中でも、大きな事件でした。
      - 語り: では、ペンドルで、母に不利な証言をした、9歳の少女は、そのあと、どうなったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 その後
  - title: 1634年、名前を挙げられたジェネット　そして名誉回復と謝罪
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    year: 1634
    lines:
      # fact: majogari-24
      - 語り: 1612年の裁判から、22年後。今の数え方で1634年の2月、ペンドルで、10歳か11歳の少年、エドマンド・ロビンソンが、治安判事の前で申し立てます。魔女の集まりを、見た。
      # fact: majogari-24
      - 語り: 少年が名前を挙げた人々の中に、ジェネット・デイヴィスという名が、ありました。綴りは違いますが、デバイスと、よく似た名前です。
        tone: 重い
      # fact: majogari-24
      - 語り: 1612年の、あの少女と、同じ人なのか。クロスリーは、同じ人と見られる、と書いています。けれど、確かな証拠は、ありません。
      - 語り: 1612年に9歳くらいなら、このとき、30歳ほどです。
      # fact: majogari-24
      - 語り: クロスリーによれば、このジェネットは、有罪になりましたが、処刑はされませんでした。判事が、刑を止めたのです。のちに少年は、作り話だったと認めた、とクロスリーは書いています。
      # fact: majogari-53
      - 語り: ヨーロッパで、最後に魔女として処刑されたとされるのは、1782年、スイスのグラールスの、アンナ・ゲルディです。
      # fact: majogari-53
      - 語り: 2008年の8月27日、グラールスの州議会は、全会一致で、ゲルディの名誉を、回復しました。処刑から、226年後のことです。
        card: {head: "2008年8月27日", body: "グラールス州議会が名誉回復"}
      # fact: majogari-55
      - 語り: 2012年には、ドイツのケルン市議会が、1627年に処刑された、カタリーナ・ヘノートと、ほかの37人の名誉を、回復しました。
      # fact: majogari-26
      - 語り: 同じ2012年、裁判から400年目のペンドルの村、ラフリーには、死刑になった10人の1人、アリス・ナッターの像が、建てられています。
      # fact: majogari-56
      - 語り: けれど、バンベルクでは、名誉回復が、見送られました。魔女を裁いたのは司教の国で、その国を継いだのは、今のバイエルン州だから、という理由でした。
      - 語り: 誰が裁いたのか。それによって、名誉を回復できる者も、変わるのです。
        tone: しみじみ
      # fact: majogari-54
      - 語り: 2022年の3月8日。スコットランドの首相、ニコラ・スタージョンは、魔女として訴えられ、有罪とされ、処刑された人々に、正式に謝罪しました。
        card: {head: "2022年3月8日", body: "スコットランド首相が正式に謝罪"}
      # fact: majogari-42
      - 語り: スコットランドで、魔女として訴えられたのは、3837人。その84%が、女性でした。
      # fact: majogari-28
      - 語り: ペンドルの人々に、国王の恩赦は、出ていません。2022年の、議会への請願の1つは、237人の署名で締め切られ、政府の回答には、届きませんでした。
      - 語り: 最後に、はじめの問いに戻ります。魔女を裁いたのは、誰だったのか。
        tone: 疑問
        hook: true

  - title: まとめ：1612年のペンドルで、魔女を裁いたのは誰だったのか
    background: {image: paintings/gosekke_kyoto_gosho_kogosho.jpg, credit: "絵"}
    lines:
      # fact: majogari-05, majogari-06
      - 語り: 1612年のペンドルで、魔女を訴え出たのは、道で倒れた行商人の息子でした。
        tone: しみじみ
      # fact: majogari-06, majogari-16, majogari-09, majogari-21
      - 語り: 取り調べたのは、地元の治安判事。有罪を決めたのは、陪審。死刑を言い渡したのは、国王の判事。根拠は、1604年の国の法律でした。
        tone: しみじみ
      # fact: majogari-39, majogari-37, majogari-40
      - 語り: ドイツでは、皇帝の刑法が、火刑を定め、領主の役人や、村が選んだ委員会が、魔女を探しました。
        tone: しみじみ
      # fact: majogari-45, majogari-47
      - 語り: 教会の異端審問所は、魔女狩りの主役ではありませんでした。スペインでは、審問官が、魔女はいなかった、と報告し、その報告をもとに、火刑の道が、事実上、閉ざされました。
        tone: しみじみ
      # fact: majogari-51, majogari-50
      - 語り: もちろん、教会の人が、無関係だったわけではありません。魔女への鉄槌を書いたのは、異端審問官でした。ただ、その本も、魔女を根絶やしにしやすいから、として、死刑は世俗の裁判官が言い渡してよい、と書いていたのです。
        tone: しみじみ
        pause: 0.8
      - 語り: 裁きの場は、多くの場合、《国や領主の裁判所》。そして、魔女を見つけ出したのも、多くの場合、《身近な人々》。隣人や、ときには、家族でした。
        tone: しみじみ
        pause: 0.8
      # fact: majogari-19, majogari-24
      - 語り: 9歳で、母に不利な証言をしたジェネット。22年後、今度は、自分が、名前を挙げられる側にいたのかもしれません。
        tone: しみじみ
      # fact: majogari-05
      - 語り: ペンドルの裁判の、きっかけは、道の上の、ピンでした。
        tone: しみじみ
        pause: 0.8
      - 語り: 魔女を裁いたのは、誰だったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
