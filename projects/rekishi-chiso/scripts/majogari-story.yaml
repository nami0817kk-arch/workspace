# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  魔女を火あぶりにしたのは、教会。そう思われがちですが、1612年のイングランドで、10人に魔女として死刑を言い渡したのは、教会の人ではありませんでした。
  決め手の1つは、9歳くらいの少女の証言。きっかけは、道で、行商人がピンを求められたことでした。
  魔女を裁いたのは、誰だったのか。ペンドルの魔女裁判の記録（トマス・ポッツ、1613年）と、ドイツ・スペインの記録、研究者の推計を並べました。
  この動画でわかること
  ・1612年、ペンドルの魔女の訴えは、誰が起こし、誰が取り調べ、誰が裁いたのか
  ・9歳の少女の証言と、無罪になった3人
  ・司教が治めたバンベルクで、魔女を裁いたのは誰か
  ・スペインの異端審問官が出した「魔女はいなかった」という報告
  ・「900万人」と「4万人」、処刑の数はどこから来たのか
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  ペンドルの裁判は、トマス・ポッツ『ランカシャーの魔女の驚くべき発見』（1613年。J・クロスリーの翻刻 1845年）、1604年の魔術法、ジェームズ1世『悪魔学』（1597年）によります。日付は当時のイングランドの暦（ユリウス暦）のままです。
  大陸の裁判と推計は、カロリナ刑法典（1532年）、クラーマー『魔女への鉄槌』、シュペー『刑事裁判への警告』（1631年）、バンベルク市文書館、バイエルン歴史事典、R・フォルトマー、W・ベーリンガー、B・レヴァック、W・モンター、J・マルティネス・ロサ、L・A・ホムザ、M・ガスキル、エディンバラ大学のスコットランドの魔女の調べ、F・メルツバッハー、報道（AP・Holyrood ほか）によります。
  人数・年数・割合は、記録から自分で計算し直したものです。処刑の数は研究者によって違うので、誰の推計かを言って並べています。処刑や拷問の場面は描いていません。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "The Witch Hunts: Did the Church Really Judge the Witches? A 1612 Trial Record"
  description: |-
    It is often said that the Church burned the witches. Yet in England in 1612, the men who sentenced ten people to death as witches were not churchmen.
    One key witness was a girl of about nine. It all began with a few pins asked of a pedlar on a country road.
    Who really judged the witches? We follow the record of the Pendle witch trials (Thomas Potts, 1613), records from Germany and Spain, and historians' estimates.
    In this video you will learn:
    - Who accused, who examined and who judged the Pendle witches in 1612
    - The testimony of a nine-year-old girl, and three women who were acquitted
    - Who tried the witches in the prince-bishopric of Bamberg
    - The Spanish inquisitor who reported that there were no witches
    - Where the figures of "nine million" and "forty thousand" executions come from
    Dates follow the Julian calendar used in England at the time. Execution figures differ between historians and are given with their sources. Scenes of execution or torture are not shown. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Who Judged the Witches?"
    - "18 March 1612: A Few Pins on a Road near Colne"
    - "17 August 1612: Two Judges at Lancaster Castle"
    - "19 August 1612: Three Acquitted, Ten Condemned"
    - "1485 to 1626: From Innsbruck to the Witch Commission of Bamberg"
    - "1610: Logrono, and the Inquisitor Who Found No Witches"
    - "1784: Nine Million and Forty Thousand"
    - "1634: Jennet Named, and Pardons and Apologies Today"
    - "Summary: Who Judged the Witches?"

