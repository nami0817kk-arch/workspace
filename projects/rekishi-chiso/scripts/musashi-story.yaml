# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と takasugi-story.yaml・hideaki-story.yaml の型）。宮本武蔵。2026-10-29 下書き。
# 公開の予定は 11/1 12:00。
# 型：1本に1つの「なぜ」＝「巌流島で勝った武蔵は、なぜ門司へ逃げ込んだ、と書かれたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝『五輪書』に巌流島は一行も出てこない（musashi 五輪書）。次に、碑に小次郎の名がない・決闘当時の文書が無い・60年後の『沼田家記』は勝った武蔵が逃げたと書く。
#   導入では答え（逃げた話を書くのは『沼田家記』だけで、助けた側の子孫が60年後に書いたもの。決闘当時の文書は無い）を言わず、最後の章で出す。
#   第1章 最初の記録・小倉碑文（1654・養子の伊織・木刃の一撃・「岩流」・「孝子某」・手向山の碑）／
#   第2章 『沼田家記』（1672・延元の子孫・約束を破った弟子・蘇生した小次郎・門司へ逃げる・魚住孝至教授の見方・細川護熙さん）＝記録の食い違い①（碑文と沼田家記）／
#   第3章 いま知られる巌流島はどこから来たか（『二天記』1755年とも1776年とも・歌舞伎『敵討巌流島』・小次郎の名・3つの記録の書き手と年）＝記録の食い違い②（成立年）／
#   第4章 島のその後（船島・埋め立て・コレラ病院）／第5章 島原の石（有馬直純あての書状）／
#   第6章 熊本の客分（1640・七人扶持・2022年の新史料4点・山鹿・桑山作右衛門の荷の封・光尚の書状）＝食い違い③（59歳と「？」）／
#   第7章 『五輪書』（1643・60余度・署名・吉田家本・水墨画）／まとめ（答え→冒頭に戻る）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/宮本武蔵_facts_20261029.yaml、musashi-01〜）にあるものだけ。行の上に `# fact: musashi-NN`。
#   カードに無い「誰でも知っている前置き」（巌流島の決闘・武蔵と小次郎・熊本で亡くなる）は短く使い、# fact を付けない。
#   『沼田家記』の原文は、個人の記事（カクヨム）が引く翻刻から。「翻刻によれば」と言う。熊本大学の報道発表は書状の大意。決闘の細部（遅刻・櫂の木刀・無二斎）は言い切らない。
#   確かめられなかったこと：武蔵が巌流島を書かなかった理由／『沼田家記』が逃げた理由をどう書くか／原本の『五輪書』の有無／武蔵の生年。台本では「確かめられなかった」と言う。
#   決闘・死の場面は描かない。AI 絵の人物は後ろ姿・遠景・手もと。巌流島は遠景の海と砂浜、櫂や木刀は物だけ。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（碑文・沼田家記の翻刻・島原の書状・光尚の書状）。声は作らない。
#   想像の台詞は2か所（武蔵想像。config の roles に足した：青山龍星）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の musashi_self_portrait_shimada（島田美術館蔵の自画像とされる絵）・musashi_ganryujima_yoshifusa（歌川芳房の錦絵）ほか既存の絵図＋ AI 絵（M01〜M15、一覧は dev/output/rekishi-chiso/research/musashi_ai_images.md）。
#   AI 絵の武蔵は後ろ姿か遠景。実在の誰か・俳優に似せない。顔が分かるのは実在の自画像（額）だけ。
# 広告の配慮：決闘・斬る・負傷・死の場面は描かない。
