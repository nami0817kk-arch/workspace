sections:
  # ================================================================ 導入（冒頭 約2分30秒）。答え（逃げた話を書くのは沼田家記だけ・決闘当時の文書は無い）は最後の章まで言わない
  - title: 勝った武蔵は、なぜ門司へ逃げたと書かれたのか　1612年
    background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
    # AI絵：M01（朝の海に浮かぶ、砂浜のある小さな島の遠景。人物なし）
    year: 1612
    lines:
      # 0〜10秒：知らない事実（五輪書に巌流島は無い）
      # fact: musashi-02
      - 語り: 巌流島の決闘に勝った、宮本武蔵。その武蔵が自分で書いた『五輪書』には、《巌流島》が、一行も、出てきません。
        tone: 強調
        portrait: {image: paintings/musashi_self_portrait_shimada_bust.jpg, caption: "宮本武蔵の自画像とされる絵（島田美術館蔵）"}
        card: {head: "『五輪書』", body: 巌流島の決闘に触れた箇所がない}
      # fact: musashi-08
      - 語り: 決闘の相手は、「佐々木小次郎」として知られます。ところが、武蔵の養子が建てた碑には、「小次郎」の名がありません。「岩流」と、あるだけです。
        portrait: null
      # fact: musashi-06
      - 語り: しかも、決闘のときに書かれた文書は、存在しません。決闘を記す史料は、どれも、あとから書かれたものです。
      # fact: musashi-14
      - 語り: 決闘からおよそ60年後の、寛文12年、1672年。門司城代だった沼田延元の子孫が、『沼田家記』という記録をまとめます。
        card: {head: "1672年", body: 『沼田家記』ができる}
      # fact: musashi-18
      - 語り: 個人の記事が引く、その原文の翻刻を、現代の言葉にすると、こうです。武蔵は、逃れられなくなり、門司へ逃げて来て、延元に、ひとえに、頼んだ。勝ったはずの武蔵が、逃げたというのです。
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
        tone: 強調
        card: {head: "『沼田家記』", body: 勝った武蔵が門司へ逃げ込む}
      # fact: musashi-17
      - 語り: 同じ記録は、こうも書きます。武蔵に打たれた小次郎は、いったん蘇生した。その小次郎を、武蔵の弟子たちが、あとから、打ち殺した。
        tone: 重い
      - 語り: 勝った武蔵は、なぜ、逃げなければならなかったのか。そして、武蔵は、なぜ、この決闘を、『五輪書』に書かなかったのか。
        tone: 疑問
        pause: 0.8
      # fact: musashi-46, musashi-09
      - 語り: 決闘があったのは、慶長17年、1612年の、4月13日。場所は、長門と豊前のあいだの海にある、舟嶋です。
        card: {head: "4月13日", body: 舟嶋で決闘}
      - 語り: 答えを探して、決闘のあとに、最初に建てられた碑から、見ていきます。
        pause: 0.6

  # ================================================================ 第1章 最初の記録・小倉碑文（1654）
  - title: 最初の記録・小倉碑文は、決闘をどう書いたのか　1654年 小倉
    background: {image: paintings/kanbei_kokura_castle_ndl.jpg, credit: "豊前小倉之城図（『日本古城絵図』、国立国会図書館蔵）"}
    # AI絵：M02（高台から見下ろす、海峡に面した城下町の遠景。人物なし）／M03（海を望む高台に立つ、文字の無い古い石碑。人物なし）
    year: 1654
    lines:
      # fact: musashi-07
      - 語り: 最初の記録は、承応3年、1654年に建った、小倉碑文です。武蔵が亡くなって、9年後。建てたのは、養子の、宮本伊織でした。
        card: {head: "1654年", body: 養子の伊織が碑を建てる}
      # fact: musashi-47
      - 語り: 日刊ゲンダイの、本郷和人さんの連載は、碑文が、武蔵を、「新免武蔵玄信」と書いて、播磨の出身としている、と紹介しています。
      # fact: musashi-28
      - 語り: 同じ連載の別の回によれば、伊織は、15歳で、小倉藩の殿さま、小笠原忠真に仕え、20歳で家老になりました。のちに、筆頭家老になります。
      # fact: musashi-28
      - 語り: 手向山の公園を紹介する記事は、伊織が、島原の乱に、武蔵とともに出陣して、侍大将を務めた、と書いています。
      # fact: musashi-11
      - 語り: 碑文の日付は、承応3年4月19日。ところが、建てた人の名前は、書かれていません。福田正秀さんの読み下しを載せるサイトは、「孝子某」と、あるだけだ、と紹介しています。
        card: {head: "建立者", body: 名は書かれず「孝子某」}
      # fact: musashi-55
      - 語り: 碑文には、よく知られた一節があります。武蔵の剣歴や、二刀流を生み出す工夫、そして、決闘までの様子も、刻まれています。
        card: {head: "碑文の一節", body: 天仰実相円満　兵法逝去不絶}
      # fact: musashi-09
      - 語り: 決闘の部分は、短い。岩流という兵術の達人が、真剣での勝負を求めた。武蔵は、木の刃で応じた。場所は、「舟嶋」。
      # fact: musashi-09, musashi-08
      - 語り: 木の刃の一撃で、岩流を殺した、とあります。レファレンス協同データベースの回答も、岩流の名と、一撃での決着を、紹介しています。
        tone: 重い
      # 【記録】碑文の一節。出どころを言ってから読む（Wikid の読み下し）
      # fact: musashi-10
      - 語り: 碑文には、続きがあります。この決闘のあと、世間では、舟嶋を、「岩流嶋」と呼ぶようになった、と。
        background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
        tone: しみじみ
      # fact: musashi-08
      - 語り: ここに、「小次郎」の名は、ありません。弟子の話も、ありません。武蔵は、一撃で勝った。それだけです。
        tone: しみじみ
      # fact: musashi-20
      - 語り: J-CAST ニュースの2010年の記事で、国際武道大学の魚住孝至教授は、この小倉碑文を、最も信頼できる史料に挙げています。
      # fact: musashi-48
      - 語り: 手向山は、もとは、田向山と書き、宮本家は、殿さまから、この土地を与えられました。墓は、公園の入口にあります。
      # fact: musashi-48
      - 語り: この碑は、二代歌川広重の『六十余州名所図会』にも、豊前の名所として、描かれました。
      # fact: musashi-12
      - 語り: 碑は、手向山に建ち、巌流島のほうを向いています。明治になって、下関要塞の砲台ができると、一般の人は入れなくなり、碑も、移されました。手向山に戻ったのは、戦後です。
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
        card: {head: "手向山の碑", body: 巌流島のほうを向いて立つ}
      # fact: musashi-13
      - 語り: いっぽう、小次郎の碑は、昭和27年、1952年に、小説家の村上元三さんが、新聞連載の終わりを記念して、建てたものです。
      # fact: musashi-46
      - 語り: 毎年、4月13日に近い日曜には、碑の前で、武蔵・小次郎まつりが開かれます。
      - 語り: では、碑に書かれなかった話は、どこにあるのか。次の記録は、細川家の家臣の家で、生まれました。
        tone: 疑問
        hook: true
      - 語り: そこでは、勝った武蔵が、逃げていました。
        tone: 重い
        hook: true

  # ================================================================ 第2章 沼田家記（1672）（記録の食い違い①：碑文と沼田家記）
  - title: 『沼田家記』は、勝った武蔵をどう書いたのか　1672年 門司
    background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
    # AI絵：M04（夜の海峡を渡る、小さな舟の影。遠景）／M05（城の石垣と、海を望む門の遠景。人物なし）
    year: 1672
    lines:
      # fact: musashi-14
      - 語り: 2つ目の記録が、『沼田家記』です。決闘のおよそ60年後、寛文12年、1672年に、沼田延元の子孫が、まとめました。いまは、永青文庫が持っています。
        card: {head: "1672年", body: 沼田延元の子孫がまとめる}
      # fact: musashi-14
      - 語り: 沼田延元は、決闘のとき、細川家の家臣で、門司城をあずかっていた人です。
      # fact: musashi-56
      - 語り: 個人の記事が引く翻刻の書き出しによれば、武蔵は、ある年、豊前に来て、二刀の兵法の師を、していました。
        card: {head: "『沼田家記』の書き出し", body: 武蔵は豊前で二刀兵法の師}
      # fact: musashi-15
      - 語り: レファレンス協同データベースの回答によれば、『沼田家記』は、決闘の発端を、武蔵と小次郎、それぞれの弟子による、兵法の優劣論争だった、と書いています。
      # fact: musashi-16
      - 語り: 個人の記事が引く翻刻では、双方とも、弟子は一人も来ない約束でした。「双方共に弟子一人も不参筈に相定め」。ところが、島には、武蔵の弟子たちが、来て、隠れていた、といいます。
        tone: 強調
      # fact: musashi-17
      - 語り: 勝負は、武蔵の勝ちでした。けれど、小次郎は、いったん、蘇生します。すると、弟子たちが、あとで、打ち殺した。翻刻には、そう読める文が、あります。
        tone: 重い
      # 【記録】沼田家記の翻刻の一節（個人の記事の引用）。出どころを言ってから読む
      # fact: musashi-18
      - 語り: 翻刻は、「これにより」と続けます。武蔵は、逃れられなくなり、門司へ逃げて来た。なぜ、逃れられなかったのか。その事情は、私たちが開けた範囲では、はっきりしません。
        tone: 疑問
      # fact: musashi-18
      - 語り: 延元は、武蔵に、ひとえに頼まれて、請け合った。城に置いて、豊後へ送らせた、とあります。
        background: {image: paintings/kanbei_bungo_kuniezu.jpg, credit: "豊後国絵図（慶長10年ごろの下図。臼杵市歴史資料館蔵）"}
        card: {head: "門司城", body: 延元が武蔵を請け合う}
      # 食い違い①：碑文と沼田家記
      # fact: musashi-08, musashi-17
      - 語り: 並べてみます。1654年の小倉碑文は、岩流を、武蔵が一撃で倒した、とだけ書きます。1672年の『沼田家記』は、小次郎が蘇生して、弟子に討たれ、武蔵が門司へ逃げた、と書きます。
        figure: {type: stats, title: 同じ決闘　記録の食い違い, items: [[小倉碑文（1654年・養子の伊織）, 相手は「岩流」, 武蔵が一撃で勝つ], [沼田家記（1672年・延元の子孫）, 小次郎が蘇生, 弟子が打ち殺す　武蔵は門司へ]], upto: 2}
      # fact: musashi-19
      - 語り: 魚住孝至教授は、『沼田家記』を、延元の業績を子孫が残した書物だから、ドラマティックに書いたのではないか、と話しています。
        figure: null
        card: {head: "魚住孝至教授", body: 子孫がドラマティックに書いたのでは}
      # fact: musashi-20
      - 語り: さらに、武蔵が、決闘に弟子を連れて行ったのか。不名誉な終わり方を、碑文に書くのか。そう、疑問も示しています。
      # fact: musashi-21
      - 語り: この話は、2010年1月29日の日本経済新聞のコラム「私の履歴書」でも、細川護熙さんが、細川家に伝わる記録として、紹介しています。
        background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
      - 語り: 勝った武蔵が、逃げた。それを書いたのは、武蔵を助けた側の、子孫でした。
        tone: 重い
        hook: true
      - 語り: 3つ目の記録は、さらに100年以上あとに生まれます。いま私たちが知る巌流島の、多くは、そこから来ています。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 二天記（記録の食い違い②：成立年）
  - title: いま知られる巌流島は、どこから来たのか　二天記と歌舞伎
    background: {image: paintings/musashi_ganryujima_yoshifusa.jpg, credit: "歌川芳房の錦絵（1843〜1847年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：M06（灯の下、開かれた古い書物と筆。人物なし）／M07（芝居小屋の屋根と、のぼりの無い通りの夕景。人物なし）
    year: 1755
    lines:
      # fact: musashi-24
      - 語り: 3つ目が、『二天記』です。書いたのは、八代藩の家臣、豊田景英。レファレンス協同データベースの回答が、そう紹介しています。
        card: {head: "『二天記』", body: 書いたのは八代藩の家臣}
      # fact: musashi-22
      - 語り: 成立は、1755年とも、1776年とも、いわれます。山口県観光連盟の解説は、宝暦5年、1755年です。
        figure: {type: stats, title: 『二天記』いつ書かれたか, items: [[山口県観光連盟, 宝暦5年, 1755年], [J-CAST ニュース（2010年）, 1776年, 豊田景英]], upto: 1}
      # fact: musashi-22
      - 語り: J-CAST ニュースの記事は、1776年と書きます。どちらにしても、決闘の100年以上あとです。
        figure: {type: stats, title: 『二天記』いつ書かれたか, items: [[山口県観光連盟, 宝暦5年, 1755年], [J-CAST ニュース（2010年）, 1776年, 豊田景英]], upto: 2}
      # fact: musashi-22
      - 語り: 約束の時間に遅れて来る武蔵。それに怒る小次郎。有名な場面は、この『二天記』に、あります。
        figure: null
      # fact: musashi-24
      - 語り: 近代に広まった決闘の様子は、多くが『二天記』に基づく、といいます。吉川英治の小説も、これを下敷きにしました。
      # fact: musashi-23
      - 語り: 『二天記』の勝負の場面には、1737年に初演された、歌舞伎『敵討巌流島』などの要素が、取り入れられている。魚住教授は、そう見ています。
        tone: 強調
      # fact: musashi-24
      - 語り: 決闘の記述は、作者の創作とみる見方が有力だ、と国立国会図書館などの回答は、紹介しています。
      # fact: musashi-49
      - 語り: 山口県観光連盟の解説によれば、長府藩の初代藩主の言行を記した『毛利秀元記』には、決闘の記録が、残っていません。
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
      # fact: musashi-49
      - 語り: 武蔵の伝記、『兵法大祖武州玄信公伝来』にも、決闘の記述は、ないといいます。
      # fact: musashi-25
      - 語り: 「佐々木小次郎」という名前そのものも、真偽は不明です。生まれは、滋賀とも福井とも。年齢も、60代の老人とする説があれば、若い青年として描く小説もあります。
        tone: しみじみ
      # 3つの記録の並べ（年と書き手）
      # fact: musashi-07, musashi-14, musashi-22
      - 語り: 3つの記録の書き手を、並べます。1654年は、武蔵の養子。1672年は、延元の子孫。1755年か1776年は、八代藩の家臣。決闘から、42年後、60年後、100年以上後です。
        figure: {type: stats, title: 決闘を書いた3つの記録, items: [[小倉碑文　1654年, 養子の伊織, 決闘の42年後], [沼田家記　1672年, 延元の子孫, 決闘の60年後], [二天記　1755年か1776年, 八代藩の豊田景英, 100年以上後]], upto: 3}
      - 語り: 同じ決闘を、3つの記録が、3通りに書いています。
        figure: null
        tone: しみじみ
      # fact: musashi-07, musashi-19
      - 語り: 碑は、父の事績を伝えるために、建てられました。『沼田家記』は、延元の業績を、残すために。書いた目的も、それぞれ違います。
        figure: null
        hook: true
      - 語り: では、舞台になった島は、武蔵が立った島と、同じなのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 島のその後
  - title: 巌流島は、いまも同じ島なのか　船島から明治へ
    background: {image: paintings/ryoma_shimonoseki_strait_map_1864.jpg, credit: "下関海峡の地図（1864年）"}
    # AI絵：M08（砂浜と松のある小さな島に、遠くから寄せる波。人物なし）
    year: 1901
    lines:
      # fact: musashi-26, musashi-10
      - 語り: 島は、古くは、「船島」と呼ばれました。小倉碑文の、「舟嶋」です。「巌流島」の名は、決闘のあとに、広まった、と碑文は書いています。
      # fact: musashi-26
      - 語り: 明治の初めは、隣の彦島村の共有地でした。明治34年、1901年から、開削工事が始まり、埋め立てで、面積は、数倍に広がります。
        card: {head: "1901年", body: 開削工事が始まり、埋め立てで広がる}
      # fact: musashi-27
      - 語り: 明治19年、1886年。コレラが流行して、この島に、病院が置かれました。
        card: {head: "1886年", body: コレラの流行で島に病院}
      - 語り: 江戸時代から、島の姿は、大きく変わっています。武蔵が立った砂浜は、いまの島のどこなのか。確かなことは、言えません。
        tone: しみじみ
      - 語り: 名前も、姿も、後の世に、変わっていく。では、武蔵本人の手が、書いたものは、残っているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 島原の石（1637）
  - title: 武蔵の手紙が語る、島原の石　1637年 島原
    background: {image: paintings/kanbei_kokura_castle_ndl.jpg, credit: "豊前小倉之城図（『日本古城絵図』、国立国会図書館蔵）"}
    # AI絵：M09（石垣と、崩れた石の転がる斜面の遠景。人物なし）
    year: 1637
    lines:
      # fact: musashi-05, musashi-28
      - 語り: 決闘から、およそ25年。1637年に、島原・天草一揆が起こると、武蔵は、小倉藩の陣に加わっていた、と紹介されています。
        card: {head: "1637年", body: 島原・天草一揆}
      # fact: musashi-29
      - 語り: NEWSポストセブンが2017年に載せた、SAPIOの記事によれば、武蔵は、有馬直純にあてた書状に、こう書きました。「敵の落とした石に当たって、脛も立てないでいる」。
        tone: 強調
        card: {head: "有馬直純あての書状", body: 石に当たって脛も立てない}
      - 語り: 巌流島の勝者が、島原では、石に当たった。武蔵本人の、書状の中の話です。
        tone: しみじみ
      # fact: musashi-28
      - 語り: 同じ陣には、養子の伊織もいました。伊織は、侍大将を務め、のちに、筆頭家老になります。
        background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
      # fact: musashi-32
      - 語り: ただ、熊本大学の発表は、武蔵の確かな一次史料は、1640年に熊本へ招かれてからのものが、ごくわずかだ、と書きます。
      # fact: musashi-32
      - 語り: この書状が、それに数えられているのか。私たちには、分かりませんでした。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 熊本の客分（1640）（食い違い③：59歳と「？」）
  - title: 熊本の客分になった武蔵は、何をしていたのか　1640年 熊本
    background: {image: paintings/kanbei_chikuzen_hakozaki_hiroshige.jpg, credit: "歌川広重《六十余州名所図会 筑前 筥崎》"}
    # AI絵：M10（山の斜面に建つ、茶屋の遠景。人物なし）／M11（岩山の中腹にある、洞窟の入口の遠景。人物なし）
    year: 1640
    lines:
      # fact: musashi-50
      - 語り: 寛永17年、1640年の前半。細川忠利は、江戸で、将軍家の兵法指南役、柳生但馬守や、沢庵和尚と、交わっていました。5月18日に江戸を発ち、6月12日に、熊本へ帰ります。
      # fact: musashi-30
      - 語り: その忠利に招かれて、武蔵は、客分として、肥後に来ます。熊本大学の発表では、この年の7月です。
        card: {head: "寛永17年", body: 細川忠利に招かれ熊本へ}
      # fact: musashi-31
      - 語り: 永青文庫の展示の解説によれば、藩の記録に、七人扶持、合力米18石。のちに、300石になった、とあります。筆頭家老の松井興長が、仲介しました。
        card: {head: "七人扶持", body: 合力米18石、のち300石}
      # fact: musashi-30, musashi-33
      - 語り: この展示の解説は、武蔵を、1582年の生まれで、このとき59歳と書きます。ところが、熊本大学の発表は、武蔵の生年を、「？」と書いて、1645年に没した、と記しています。
        tone: しみじみ
        figure: {type: stats, title: 武蔵の年齢　記録の食い違い, items: [[永青文庫の展示解説（2003年）, 1582年生まれ、1640年に59歳, 客分として招かれる], [熊本大学の発表（2022年）, 生年は「？」, 没年は1645年]], upto: 2}
      # fact: musashi-33
      - 語り: 生まれた年さえ、確かではないのです。
        figure: null
        tone: 重い
      # fact: musashi-34
      - 語り: 2022年9月15日、熊本大学は、武蔵の晩年を示す新しい史料を、4点、発表しました。細川家の書状の控えなどの中から、見つかりました。
        background: {image: paintings/kanbei_buzen_rakanji_hiroshige.jpg, credit: "歌川広重《六十余州名所図会 豊前 羅漢寺》"}
        card: {head: "2022年9月", body: 熊本大学が新史料4点を発表}
      # fact: musashi-54
      - 語り: 見つけたのは、永青文庫研究センターの、後藤典子特別研究員らです。
      # fact: musashi-54
      - 語り: 松井家文書は、約3万6000点。そのうちの1点は、2018年に見つかり、傷みがひどかったため、2019年度に修復されました。
      # fact: musashi-34
      - 語り: 寛永17年の11月、忠利は、山鹿の御茶屋に、武蔵を呼んでいます。足利道鑑、津川四郎右衛門、朝山意林庵と、ともに。惣奉行衆の書状の控えに、名前が書かれていました。
      # fact: musashi-51
      - 語り: 忠利は、11月3日から、この御茶屋に逗留し、数日間、問答を交わしたと考えられています。忠利は、同時代人から、「一天下に続く人なし」と評された、明君でした。
        card: {head: "11月3日", body: 山鹿の御茶屋で問答}
      # fact: musashi-57
      - 語り: 11月5日の書状控には、武蔵らの山鹿の宿に、世話の担当として、小姓衆と鉄炮衆を付けた、とあります。いつも張り付いては迷惑だろうから、脇の宿に控えさせ、用のあるときだけ、仕えさせるように、とも。
      # fact: musashi-35
      - 語り: 足利道鑑は、足利13代将軍、義輝の遺児だといわれる人。津川四郎右衛門は、尾張の守護だった、斯波家の子孫。意林庵は、儒学者です。
      # fact: musashi-35
      - 語り: 熊本大学は、武蔵が、思想としての兵法の体現者として、招かれたと、考えています。
        tone: 強調
      # fact: musashi-52
      - 語り: 晩年の武蔵は、兵法の大家として、相当の評価を得ていて、忠利のような大名の政治思想に、大きな影響を与えうる存在だった、とも、熊本大学は見ています。
      # 【想像1】武蔵。記録：忠利に招かれ、客分として熊本に来た（KUMAMOTO）。気持ちだけ
      - 人物: 「……わしの兵法を、求めてくださるか」
        who: 武蔵想像
        imagined: true
        tone: しみじみ
      # fact: musashi-36
      - 語り: 発表には、小さな話もあります。寛永19年の閏9月、茶人桑山宗仙の孫の作右衛門が、山鹿へ湯治に出たまま、出奔しました。松井興長の書状の控えに、あります。
        background: {image: paintings/kanbei_bungo_kuniezu.jpg, credit: "豊後国絵図（慶長10年ごろの下図。臼杵市歴史資料館蔵）"}
      # fact: musashi-36
      - 語り: 出かける前、作右衛門は、隣に住む武蔵に、長持と鎧櫃を預けていました。
      # fact: musashi-53
      - 語り: 作右衛門も、忠利に迎えられた客分で、米500石を支給されていました。武蔵の七人扶持と、合力米18石とは、単純には比べられません。
      # fact: musashi-37
      - 語り: 武蔵は、作右衛門自身が封をすることを、条件に、預かりました。荷物は、封をつけたまま、大和へ送られます。なぜ封を条件にしたのか、書状は語っていません。
        card: {head: "長持と鎧櫃", body: 武蔵は「封」を条件に預かる}
      # fact: musashi-38
      - 語り: 寛永20年9月13日。新しい藩主の細川光尚が、江戸から、武蔵に、書状を出しています。
        background: {image: paintings/kanbei_buzen_rakanji_hiroshige.jpg, credit: "歌川広重《六十余州名所図会 豊前 羅漢寺》"}
        card: {head: "9月13日", body: 光尚が江戸から武蔵に書状}
      # fact: musashi-38
      - 語り: 熊本大学の発表の大意は、こうです。熱病が治った。様子を聞かせてほしい。保養が肝心だ。春には熊本に下って、対面で話をしよう。
        tone: しみじみ
      # fact: musashi-38
      - 語り: 忠利は、寛永18年の3月に、亡くなっています。それでも武蔵は、新しい藩主と、良い関係にあった、と熊本大学は、見ています。
      - 語り: 光尚の書状の、ひと月後。武蔵は、ある本を、書き始めます。
        tone: 重い
        hook: true

  # ================================================================ 第7章 五輪書（1643）
  - title: 『五輪書』は、何を書き、何を書かなかったのか　1643年 霊巌洞
    background: {image: paintings/kanbei_buzen_rakanji_hiroshige.jpg, credit: "歌川広重《六十余州名所図会 豊前 羅漢寺》"}
    # AI絵：M12（洞窟の中、机に向かう老人の後ろ姿と灯。遠景）／M13（墨の鳥の絵が立てられた、静かな座敷。人物なし）
    year: 1643
    lines:
      # fact: musashi-39
      - 語り: 寛永20年、1643年の10月10日。武蔵は、熊本の霊巌洞にこもって、『五輪書』を、書き始めます。光尚の求めによる、という説があります。
        card: {head: "10月10日", body: 霊巌洞で『五輪書』を書き始める}
      # fact: musashi-42
      - 語り: その2年前、寛永18年には、藩主に、35か条の兵法書を、差し上げています。『五輪書』は、その翌年以降に、書き始められました。
      # fact: musashi-41
      - 語り: 『五輪書』は、60余度の勝負に、全勝したと、記しています。国立国会図書館などの回答は、そう紹介しています。nippon.com の記事は、それを、29歳までの勝負、と書きます。
        card: {head: "60余度", body: 全勝したと記す}
        tone: 強調
      # fact: musashi-02
      - 語り: その60余度の中に、巌流島の名は、ありません。決闘に触れた箇所は、ない、と山口県観光連盟は、書いています。
        tone: 重い
      # fact: musashi-44
      - 語り: 署名は、「新免武蔵守藤原玄信」。本郷和人さんによれば、「武蔵」は名前ではなく、官途名の「武蔵守」。実名は、「玄信」です。
        background: {image: paintings/kanbei_chikuzen_hakozaki_hiroshige.jpg, credit: "歌川広重《六十余州名所図会 筑前 筥崎》"}
        card: {head: "署名", body: 新免武蔵守藤原玄信}
      # fact: musashi-40
      - 語り: 『五輪書』は、武蔵が亡くなる、1週間前に、完成した、といいます。亡くなったのは、正保2年、1645年の5月。熊本でした。
        card: {head: "1645年5月", body: 完成の1週間後に熊本で没す}
      # 【想像2】武蔵。記録：死の1週間前に『五輪書』が完成した（GORINEND）。気持ちだけ
      - 人物: 「……これで、よい」
        who: 武蔵想像
        imagined: true
        tone: しみじみ
      # fact: musashi-43
      - 語り: 広く使われてきたのは、細川家本。2003年に、福岡藩家老の吉田家に伝わった本が見つかり、2009年のちくま学芸文庫は、これを底本に、新しく校訂しました。
        background: {image: paintings/kanbei_bungo_kuniezu.jpg, credit: "豊後国絵図（慶長10年ごろの下図。臼杵市歴史資料館蔵）"}
      - 語り: 武蔵が自分の手で書いた『五輪書』が、いまも残っているのか。私たちの調べでは、確かめられませんでした。
        tone: しみじみ
      # fact: musashi-58
      - 語り: nippon.com の記事が、自筆で残るものとして挙げるのは、大名あての書状2通や、水墨画などです。
      # fact: musashi-45
      - 語り: 武蔵は、絵も描きました。熊本県立美術館に寄託されている水墨画、「鵜図」「紅梅鳩図」「芦雁図屏風」は、いずれも、重要文化財です。
        card: {head: "水墨画", body: 「鵜図」「紅梅鳩図」「芦雁図屏風」}
      # fact: musashi-45
