      # fact: musashi-41
      - 語り: ただし、『五輪書』は、若い藩主や家老のために書かれた、兵法の書だ、と紹介されています。決闘の記録帳では、ありません。
      - 語り: なぜ、巌流島を書かなかったのか。それを語った史料は、私たちの調べでは、見つかりませんでした。
