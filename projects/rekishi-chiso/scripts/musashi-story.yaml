  # ================================================================ まとめ
  - title: まとめ：勝った武蔵は、なぜ逃げたと書かれたのか　手向山
    background: {image: paintings/ryoma_choshu_hiroshige_shimonoseki.jpg, credit: "歌川広重《六十余州名所図会 長門 下之関》"}
    # AI絵：M14（夕暮れの高台から見下ろす、遠い島と海。人物なし）
    year: 1654
    lines:
      # 答え
      # fact: musashi-18, musashi-17
      - 語り: 武蔵が逃げた、と書くのは、私たちが開いた範囲では、『沼田家記』です。弟子が約束を破り、蘇生した小次郎を、打ち殺した。だから武蔵は、逃れられなくなった。そういう筋です。
        tone: しみじみ
      # fact: musashi-14, musashi-19
      - 語り: その記録は、助けた側の子孫が、60年後に書いたものです。魚住教授の見立ては、ドラマティックに書いたのではないか、というものです。
        background: {image: paintings/kanbei_kokura_castle_ndl.jpg, credit: "豊前小倉之城図（『日本古城絵図』、国立国会図書館蔵）"}
      # fact: musashi-08, musashi-20
      - 語り: 魚住孝至教授が最も信頼できると見る小倉碑文には、弟子も、逃げた話も、小次郎の名も、ありません。
      # fact: musashi-02
      - 語り: 武蔵本人の『五輪書』には、巌流島そのものが、ありません。
      # fact: musashi-06
      - 語り: そして、決闘のときに書かれた文書は、存在しません。勝った武蔵が、逃げたのか、逃げなかったのか。確かめられる史料は、ないのです。
        tone: 重い
      # fact: musashi-34, musashi-37
      - 語り: 確かなのは、晩年の熊本の武蔵です。客分として招かれ、隣人の荷物に封を求め、藩主から、春に会って話そうと、書き送られた人でした。
        tone: しみじみ
        portrait: {image: paintings/musashi_self_portrait_shimada_bust.jpg, caption: "宮本武蔵の自画像とされる絵（島田美術館蔵）"}
      # fact: musashi-12
      - 語り: 武蔵の名を刻んだ碑は、いまも、手向山から、巌流島のほうを向いて、立っています。
        tone: しみじみ
        portrait: null
        background: {image: paintings/ryoma_shimonoseki_view_lacma_1865.jpg, credit: "下関の景（1865年ごろ。ロサンゼルス郡立美術館）"}
      - 語り: 巌流島で勝った武蔵が、自分で書いた本には、その島の名は、一行も、ありませんでした。
        tone: しみじみ
        pause: 0.8

