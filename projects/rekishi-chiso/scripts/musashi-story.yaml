# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  宮本武蔵が自分で書いた『五輪書』には、巌流島の決闘が、一行も出てきません。
  決闘から約60年後の『沼田家記』は、勝った武蔵が、門司へ逃げ込んだと書いています。
  勝ったはずの武蔵は、なぜ逃げなければならなかったのか。そして、そう書いたのは誰だったのか。
  この動画でわかること
  ・決闘を書いた3つの記録（小倉碑文・沼田家記・二天記）の書き手と、書かれた年
  ・武蔵の養子・宮本伊織が建てた碑に、小次郎の名がない理由として言えること・言えないこと
  ・島原の乱の陣中から有馬直純にあてた、武蔵の書状
  ・2022年に熊本大学が発表した、晩年の武蔵の新史料4点
  ・『五輪書』を書き始めた日と、書き終えた日
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（北九州市、山口県観光連盟、熊本大学の報道発表、レファレンス協同データベース、J-CAST ニュースの記事など）を語りで示してから読んでいます。
  『沼田家記』の原文は、個人の記事が引く翻刻をもとにしています。決闘のときに書かれた文書は存在せず、決闘の細部は記録によって食い違います。
  肖像は、島田美術館が所蔵する、自画像とされる絵（ウィキメディア・コモンズ、パブリックドメイン）です。

en:
  title: "Miyamoto Musashi: No Ganryujima in His Book of Five Rings, and a Record Where the Winner Flees"
  description: |-
    Musashi's own Book of Five Rings never mentions the duel at Ganryujima.
    About 60 years after the duel, the Numata family record says the winner, Musashi, fled to Moji.
    Why would the winner have had to flee, and who wrote that story?
    In this video you will learn:
    - Three records of the duel (the Kokura inscription, the Numata family record, the Nitenki), who wrote them and when
    - What can and cannot be said about the missing name "Kojiro" on the monument raised by his adopted son
    - A letter Musashi wrote from the Shimabara campaign
    - Four new documents on Musashi's late years, announced by Kumamoto University in 2022
    - When he began and finished the Book of Five Rings
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Book of Five Rings Never Mentions Ganryujima: The Duel, 1612"
    - "The First Record: The Kokura Inscription, 1654"
    - "The Numata Family Record: Why Did the Winner Flee to Moji? 1672"
    - "Where Does the Familiar Ganryujima Story Come From? The Nitenki"
    - "Is the Island the Same Island? Ganryujima After the Meiji Era"
    - "A Stone Hit His Shin: The Shimabara Campaign Letter, 1637"
    - "Musashi in Kumamoto: Four New Documents, 1640"
    - "What the Book of Five Rings Says and Does Not Say, 1643"
    - "Summary: Why Was the Winner Said to Have Fled?"

