sections:
  # ================================================================ 序章。答えの席：なぜ討たれたのか・駕籠の中の最期
  - title: 大老は、なぜ江戸城の門の前で討たれたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1860
    lines:
      # fact: ii-17
      - 語り: 幕府でいちばん重い役、大老は、なぜ、江戸城の門の前で討たれたのか。斬り合いは、時計で《3分》ばかりだった、と当時の書き留めにあります。
        tone: 重い
      # fact: ii-08, ii-59
      - 語り: その日の夜、井伊家が幕府に出した届は、直弼本人の言葉で、こう書いています。わたくしは、少々けがをしたので、ひとまず帰宅した。
      # fact: ii-36
      - 語り: 大老、井伊直弼は、もう、亡くなっていました。
        tone: 重い
      # fact: ii-11
      - 語り: そのあと将軍は、すでに亡くなっている大老あてに、見舞いの品を届けます。
      # fact: ii-18
      - 語り: 襲われたのは、井伊家の屋敷から、わずか160メートルあまりの所。それでも屋敷からは、大雪で、見えなかったといいます。
      # fact: ii-22, ii-16
      - 語り: 1860年、雪の朝。襲ったのは18人。守る側の供は、刀を、すぐには抜けませんでした。
      - 語り: 残っているのは、襲った側、守った側、近くの屋敷の番人の記録。その中身が、食い違います。
      - 語り: その数分のことを、時刻まで書き留めた人たちがいました。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 雪の朝
  - title: 1860年3月3日の朝　大雪の愛宕山と外桜田
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1860
    lines:
      - 語り: 安政7年の3月3日。今の暦では、1860年の3月24日です。
      # fact: ii-58
      - 語り: この日は、上巳の節句。ひな祭りの日で、大名たちが、祝いのために、江戸城へ上る日でした。
      # fact: ii-58
      - 語り: 紀州、今の和歌山に伝わった、この日の知らせの写しは、ちょうど大雪が降っている最中だった、と書きます。今は、和歌山県立文書館にある文書です。
      # fact: ii-23
      - 語り: その朝早く、襲う側は、芝の愛宕山に集まっていました。水戸藩を離れた浪士、仕える家を持たない侍たちです。
      # fact: ii-23
      - 語り: 捕らえられた浪士の話を書き留めた、『桜田紅雪録』には、こうあります。山に登ると、薩摩の有村次左衛門が、先に着いていた。一同は、驚いた。
      # fact: ii-22
      - 語り: 水戸の浪士17人に、有村を加えて、18人です。
      # fact: ii-27
      - 語り: ただ、その数は、記録で違います。紀州の写しは、水戸家の侍17人と書き、有村の名がありません。井伊家の届は、およそ20人です。
        figure: {type: table, title: 襲った人数　記録の違い, cols: [人数, 書いた側], rows: [[紀州に伝わった写し, 17人, 水戸家の侍とだけ], [井伊家の届, およそ20人, 守った側], [襲った側の名を合わせると, 18人, 水戸17人と薩摩の有村]], upto: 3}
      - 語り: 狙われた大老、井伊直弼は、このとき、数えで46歳。近江、今の滋賀県の、彦根藩の主でした。
        figure: null
      # fact: ii-43
      - 語り: 江戸の屋敷は、外桜田。国立国会図書館の解説によれば、今の、国会の前の憲政記念館の場所にあたります。
      # fact: ii-43
      - 語り: そこから江戸城の桜田門までは、およそ500メートル。襲われたのは、その道の途中です。
      # fact: ii-18
      - 語り: 明治の初めに出た記録集、『近世野史』は、現場は、井伊家の屋敷から見通せる、一町半あまりの所だった、と書きます。
      - 語り: 今の長さにすると、160メートルあまり。屋敷の門から、すぐの所です。
      - 語り: 雪の中、大老の行列が、屋敷の門を出ます。
        hook: true

  # ================================================================ 第2章 時計で三分
  - title: 五ツ半の桜田門外　時計で3分の斬り合い
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1860
    lines:
      # fact: ii-13
      - 語り: 時刻は、近くの大名屋敷の番所が、老中に出した届に、今朝の五ツ半とあります。今の午前9時ごろです。
        card: {head: "五ツ半", body: "今の午前9時ごろ"}
      # fact: ii-14
      - 語り: 紀州の写しは、辰の刻の前。別の書き留めは、朝の五つ前。どちらも、五ツ半より少し早い、という書き方です。
      # fact: ii-58
      - 語り: 紀州の写しによれば、道の両側には、侍のような者が3人ずつ、ひれ伏して、行列を待っていました。
      # fact: ii-19
      - 語り: 行列の前に、裃を着た男が、駕籠に願い事を訴える人のふりをして、出てきます。
      # fact: ii-19
      - 語り: 幕末の記録を写し集めた、『堤蟻叢書』によれば、男は、駕籠に近づくと、ピストルを撃ちました。それが、合図でした。
      # fact: ii-19
      - 語り: 撃ったのが誰か。この記録には、名前がありません。
      # fact: ii-58
      - 語り: 紀州の写しでは、ひれ伏していた者たちが、急に立ち上がり、手槍で、駕籠に突きかかります。
      # fact: ii-58
      - 語り: 続いて、登城を見物する人たちの中から、十人あまりが、刀を抜いて、斬り込んだ、とあります。
      # fact: ii-16
      - 語り: 守る側は、すぐには刀を抜けませんでした。雪よけの合羽を着て、刀の柄には、袋をかぶせていたからです。
        card: {head: "合羽と柄袋", body: "すぐには刀を抜けなかった"}
      # fact: ii-16
      - 語り: このことは、紀州の写しも、捕まった浪士の話も、書いています。立場の違う記録が、ここでは一致します。守る側が雪の支度をしていたことは、明治の初めに出た記録集にも出てきます。
      # fact: ii-15
      - 語り: 近くにあった、上杉家の屋敷の番人は、こう届けました。けがをした井伊家の侍が1人、番所の前に走ってきた。
      # fact: ii-15
      - 語り: 問いかけにも答えず、黒い羅紗の柄袋を投げ捨てて、刀を抜いて、現場へ駆け戻った。番所には、その柄袋が、残されている。
      - 語り: では、駕籠の中の大老は、どうしていたのか。ここで、守った側と、襲った側の話が、分かれます。
        tone: 疑問
      # fact: ii-20
      - 語り: 駕籠の前にいた彦根の侍、松井貞之進の話は、こうです。殿は、すぐに立ち上がり、駕籠の戸を開け、刀の柄に、手を掛けられた。
      # fact: ii-20
      - 語り: ところが、浪士の一人は、駕籠から引き出したときには、もう、事切れていたように見えた、と述べています。
        tone: 重い
      # fact: ii-20
      - 語り: どちらも、同じ『桜田紅雪録』に書き留められた話です。
      # fact: ii-17
      - 語り: 『堤蟻叢書』の書き留めは、斬り合いの長さを、こう書きます。時計で、3分ばかり。
        tone: 重い
      # fact: ii-17
      - 語り: 後片付けまで入れても、半時、今の1時間も、かからなかった、と。
      # fact: ii-18
      - 語り: 屋敷から、五、六十人が駆けつけたとき、襲った者たちは、もう、和田倉門に近い、辰ノ口のあたりまで、去っていました。
      # fact: ii-13
      - 語り: 近くの番所の届は、抜き身を持った者たちが走り過ぎたが、大雪で、見失った、と書いています。
      - 語り: では、その3分のあいだに、大老の体に、何があったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 弾はどこに当たったのか
  - title: 1860年、ピストルの弾はどこに当たったのか　鳥取に残った日記
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1860
    lines:
      # fact: ii-28
      - 語り: 手がかりは、意外な所にありました。鳥取です。
      # fact: ii-28
      - 語り: 事件の、およそ2か月後。逃げていた、襲う側の指揮役、関鉄之介は、鳥取藩の旧い知り合い、安達清一郎を訪ねています。
      # fact: ii-28
      - 語り: 安達は、日記に、関の話を書き留めました。直弼は、ピストルの弾が、胸先に当たって、死んだ。
        tone: 重い
      # fact: ii-29
      - 語り: 2022年の中国新聞の記事によれば、同じ日記には、合図の音のあと、守る侍たちが、15メートルほど退いた、ともあります。
      # fact: ii-28
      - 語り: この日記は、鳥取県立博物館にあります。原本のありかが分かったのは、2018年のことです。
        card: {head: "安達清一郎の日記", body: "原本のありかは2018年に判明"}
      # fact: ii-30
      - 語り: ところが、よく知られた話では、弾は、太ももから腰に当たり、直弼は、動けなくなった、とされます。
      # fact: ii-30
      - 語り: 胸先か、腰か。弾の当たった所は、記録と解説で、割れたままです。
      # fact: ii-31
      - 語り: ただ、直弼は、そのあと、首を討たれています。弾が命を奪ったとは言い切れない、と、水戸の地域誌の筆者は指摘しています。
      # fact: ii-31
      - 語り: 撃ったのは誰か。2015年の雑誌『歴史街道』は、襲った一人、水戸の黒沢忠三郎とします。
      # fact: ii-31
      - 語り: 一方、2024年のNHKの番組、歴史探偵は、その地域誌の紹介によれば、関は撃っていないとみて、ピストルは少なくとも3挺、持ち込まれた、としました。
      # fact: ii-32
      - 語り: そして、刀の柄に手を掛けた、と語られた直弼。この人は、居合の使い手でした。
      # fact: ii-32
      - 語り: 彦根城博物館によれば、直弼は、藩の居合の師範に学んで、免許皆伝まで進み、新しい流派を開くと、宣言しています。
      # fact: ii-64
      - 語り: もっとも、直弼は、藩主の子でも、跡を継ぐ立場ではありませんでした。17歳から、彦根の小さな屋敷で、長い年月を過ごします。
      # fact: ii-64
      - 語り: その年数を、雑誌『サライ』は、32歳までの約15年。観光庁の解説文は、12年と書きます。
      # fact: ii-63
      - 語り: 28歳ごろからは、楽焼の焼き物も作りました。記録も含めて、100点以上が確かめられています。
      # fact: ii-62
      - 語り: 31歳のころには、信頼する家臣への手紙で、自分のことを、こう書いていました。
      # fact: ii-62
      - 語り: 口べたな、木訥者。大臆病者。兄で藩主の直亮が好んだ、馬に乗って弓を射る稽古も、しない。
      # fact: ii-62
      - 語り: 彦根城博物館が紹介する、世継ぎになる前の手紙です。
      # fact: ii-62
      - 語り: 世継ぎとして江戸に出たばかりのころには、地震や火事の多い江戸を、さてさて、いやな所、とこぼしています。
      # fact: ii-63
      - 語り: 茶の湯の本、『茶湯一会集』を仕上げたのも、直弼です。一期一会という言葉は、この本で、広く知られるようになりました。
      - 語り: その人が、なぜ、桜田門の外で、討たれることになったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 なぜ討たれたのか
  - title: 1858年、大老になった直弼　条約と跡継ぎと密勅
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1858
    lines:
      # fact: ii-48
      - 語り: 話は、雪の朝の2年前に、さかのぼります。1858年の4月。直弼は、大老になりました。彦根城博物館には、4月25日付の、誓いの書の控えが残ります。
      # fact: ii-49
      - 語り: その2か月後。直弼は、京都の公家への返事に、こう書いています。重い役目に耐えられないと、何度も断ったが、厳しい命令を、退けられなかった。
      # fact: ii-49
      - 語り: そして、手紙の最後に、読んだら、すぐ火にくべてほしい、と頼んでいます。
      # fact: ii-50
      - 語り: その年の6月19日。神奈川の沖、アメリカの軍艦ポーハタン号の上で、日米修好通商条約が結ばれます。天皇の許し、勅許の無いままでした。
        card: {head: "1858年6月19日", body: "勅許の無いまま条約に調印"}
      # fact: ii-50
      - 語り: 調印書に名があるのは、交渉役の、幕府の役人2人です。
      # fact: ii-51
      - 語り: 直弼は、手紙で、こう説明しています。担当の2人が、仮の条約書に調印した。隣の清、今の中国の、二の舞いを避けるための、よんどころない場合だった。
      # fact: ii-51
      - 語り: 清は、その少し前から、イギリスやフランスと、戦になっていました。直弼は、天皇に仕える関白には、国の中の乱れを、まず一掃してから、外国に当たる、と、手紙の下書きに書いています。
      # fact: ii-52
      - 語り: 同じころ、直弼は、将軍の跡継ぎを、紀州の慶福、のちの将軍、家茂に決めます。手紙では、跡継ぎを急務と呼び、条約より先に置いていました。
      # fact: ii-52
      - 語り: 跡継ぎの発表は、6月25日の手はずでした。
      # fact: ii-53
      - 語り: 8月8日。朝廷から、水戸藩に、勅書が下ります。戊午の密勅と呼ばれるものです。
      # fact: ii-53
      - 語り: 茨城県立歴史館によれば、関白の署名が無く、朝廷の取り次ぎ役の屋敷で渡されるという、異例の手続きでした。
      # fact: ii-53
      - 語り: 水戸藩あての勅書には、ほかの大名たちにも伝えよ、という書き付けが付いていました。幕府を信じていない、とも読めるものでした。
      # fact: ii-56
      - 語り: そして9月から、およそ1年。安政の大獄と呼ばれる取り締まりが続きます。
      # fact: ii-57
      - 語り: 罰せられた人の数は、辞典によって、75人とも、百人あまりとも。死刑は、8人とも、7人とも書かれます。
        figure: {type: table, title: 安政の大獄で罰せられた人　辞典の違い, cols: [罰せられた人, 死刑], rows: [[日本大百科全書, 75名, ""], [デジタル大辞泉, 百人あまり, 8人], [世界大百科事典（旧版）, 100人を超える, 7人]], upto: 3}
      # fact: ii-56
      - 語り: 京都で探りを入れた、彦根の家臣、長野主膳の日記には、公家の家来や、御所に仕える女性の筋から、知らせが集まる様子が残ります。
        figure: null
      # fact: ii-56
      - 語り: ある人は、彗星を占って、こう申し出た、といわれます。彦根藩が、天皇を退けようとする前ぶれだ。
      # fact: ii-56
      - 語り: その人は捕らえられ、島流しを言い渡されて、牢の中で病死しました。
      # fact: ii-54
      - 語り: 勅書を返せ、と水戸藩に迫ったのは、幕府です。水戸藩は、1860年の2月23日、ようやく返すことを決めます。
      # fact: ii-54
      - 語り: 翌24日。勅書が通るはずだった、水戸城の大広間の廊下で、藩士の斎藤留次郎が、31歳で自害しました。勅書は、城に留まります。
        tone: 重い
      # fact: ii-54
      - 語り: 桜田門外の変の、8日前のことです。
      # fact: ii-55
      - 語り: 2014年に、斎藤家から茨城県立歴史館に寄せられた文書の中から、斎藤の、いさめの手紙の2通目が見つかりました。あて先は、藩主の徳川慶篤でした。
      # fact: ii-61
      - 語り: では、襲った側は、なぜ討ったと言うのか。浪士たちは、『斬奸趣意書』という文を残しています。
      # fact: ii-61
      - 語り: あて先は、老中、脇坂安宅の家臣。直弼の罪に挙げたのは、天皇の許し無く、条約を結んだこと。忠義の人たちを、罪に落としたこと。将軍の幼さにつけこんで、力をふるったこと。
      # fact: ii-61
      - 語り: そして、幕府に逆らう気は、少しも無い、と書いています。
      - 語り: 直弼の言い分と、浪士の言い分。同じ条約が、片方には、やむを得ない判断。もう片方には、天皇を軽んじた罪でした。
      # fact: ii-36
      - 語り: そして大老の死は、このあと、2か月近く、伏せられることになります。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 伏せられた死
  - title: 生きていることにされた大老　1860年3月の届と見舞い
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1860
    lines:
      # fact: ii-08
      - 語り: 事件の日の夜。井伊家は、老中から呼び出されて、届を出しました。
      # fact: ii-59
      - 語り: 襲った者は、およそ20人。鉄砲を撃ちかけてきた。1人を討ち取り、残りは逃げた。
      # fact: ii-59
      - 語り: そして届は、直弼本人の言葉で、こう結びます。わたくしは、取り押さえの指図をしているうちに、少々けがをしたので、ひとまず帰宅した。
      # fact: ii-09
      - 語り: 別の紙には、守った側の死傷が並びます。その場で亡くなったのは、4人。その中に、加田九郎太という侍の名があります。
      # fact: ii-09
      - 語り: 亡くなった4人に、深い傷やけがの者、足軽、草履取り、駕籠をかつぐ者まで入れて、あわせて21人です。
      # fact: ii-10
      - 語り: ところが、事件の12日後、のちの大村益次郎、村田蔵六が書いた手紙では、その場で亡くなったのは、6人。その場から逃げた者が、4人。
      # fact: ii-10
      - 語り: 逃げた4人のうち2人は、翌日、親類に、切腹させられた、とあります。
      # fact: ii-11
      - 語り: 幕府は、彦根藩に、大老の死を、伏せるよう命じました。昭和にまとめられた幕末の記録集、『維新史料綱要』が、そう記しています。
      # fact: ii-35
      - 語り: 井伊家からは、直弼は病気だ、という届と、嫡男の愛麿を、跡継ぎとする届が出されました。
      # fact: ii-11
      - 語り: そして、将軍の家茂からは、大老あてに、朝鮮人参が届きます。続いて若年寄が遣わされ、鯛と氷砂糖が、贈られました。
        card: {head: "将軍から大老あてに", body: "朝鮮人参・鯛・氷砂糖"}
      # fact: ii-33
      - 語り: 首は、どうなったのか。首を持ち去った有村次左衛門は、深い傷を負い、幕府の若年寄、遠藤家の屋敷の番所のあたりで、自害しました。
      # fact: ii-34
      - 語り: 2020年の和樂webの記事によれば、遠藤家は、調べが要るとして、首を返すのを渋りました。
      # fact: ii-34
      - 語り: 彦根藩は、討たれた供の侍、加田九郎太の首として、申し出ます。遠藤家は、その名で受け取りの書き付けを取って、返したといいます。
      # fact: ii-21
      - 語り: 事件のあとの記録にも、その首は、加田九郎太のもの、と書いたものがあります。供頭の首だ、とした写しもあります。
      # fact: ii-34
      - 語り: 首は、ひそかに屋敷へ戻され、大老は、けがで休んでいることにされました。
      # fact: ii-37
      - 語り: なぜ、そこまでして死を伏せたのか。茨城県立歴史館の永井博は、2つの理由を挙げます。
      # fact: ii-37
      - 語り: 1つは、跡継ぎを届けないまま大名が思いがけず死ぬと、家が絶えるという決まり。昔から徳川に仕えた大名の筆頭、井伊家を、絶やすわけにはいかなかった。
      # fact: ii-37
      - 語り: もう1つは、死が表に出ないあいだは、彦根も、水戸も、表立って動けないことでした。
      # fact: ii-38
      - 語り: 実際に、彦根藩の中では、水戸への仕返しを求める声が上がりました。今の栃木の佐野にあった、彦根藩の領地からは、千人が、江戸の屋敷に駆けつけた、と東京大学史料編纂所の紹介は書きます。
      # fact: ii-38
      - 語り: 水戸へ攻め込む道筋まで、考えられていました。幕府は、両家の争いを禁じ、襲った者を引き渡してほしいという、彦根の願いも退けます。
      # fact: ii-38
      - 語り: 両家には、国元から家来を呼び寄せないように、とも命じています。
      - 語り: この年は、3月のあとに、もう一度、うるうの3月がありました。
      # fact: ii-36
      - 語り: 3月30日。直弼は、大老を退いたことになります。同じ日、水戸藩主の徳川慶篤には、江戸城に上ることが禁じられました。
      # fact: ii-12
      - 語り: うるう3月には、彦根藩の家老、木俣清左衛門が、この不始末について、幕府に申し述べています。
      # fact: ii-36
      - 語り: 彦根藩が、直弼の死を公にしたのは、うるう3月の30日。東京大学史料編纂所の紹介は、そう書きます。
        card: {head: "閏3月30日", body: "彦根藩が直弼の死を公にする"}
      # fact: ii-12
      - 語り: ただ、明治にまとめられた、公家の三条実美の年譜は、4月になって初めて、と書きます。ここでも、記録は割れています。
      # fact: ii-39
      - 語り: 4月7日。幕府から、香典を届ける使いが来ます。
      # fact: ii-39
      - 語り: 4月10日の葬式では、品川や下目黒のあたり、そして豪徳寺の周りまで、見張りが固められました。騒ぎを防ぐためです。
      # fact: ii-40
      - 語り: 世田谷の豪徳寺にある、直弼の墓石に刻まれた日付は、3月3日ではありません。うるう3月の28日です。
      # fact: ii-40, ii-36
      - 語り: 死を公にした日とも、2日ずれています。
      - 語り: 生き残った供の侍たちを、待っていたものは。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 残されたもの
  - title: 雪の朝のあとに　1861年、罰せられた供と残された絵
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1861
    lines:
      # fact: ii-24
      - 語り: 生き残った供の侍たちには、罰が下されました。『桜田紅雪録』は、それを、翌年、1861年の記事に載せています。
      # fact: ii-24
      - 語り: 家を絶やされた者。牢に入れられた者。臆病だったとして、知行を取り上げられた者。
      # fact: ii-24
      - 語り: 防いだが、行き届かなかったとして、慎みを命じられた者。罰は、人によって違います。
      # fact: ii-24
      - 語り: 一方、戦って亡くなった5人の家は、そのまま、跡を継ぐことが許されました。
      # fact: ii-41
      - 語り: 豪徳寺には、桜田で亡くなった8人の侍の碑が、今も立っています。
      # fact: ii-09, ii-10, ii-41
      - 語り: その場で亡くなった供は、届では4人、手紙では6人。碑は、あとから傷で亡くなった人も入れて、8人の侍をまつっています。
        figure: {type: table, title: 亡くなった供の数　記録の違い, cols: [人数, 数え方], rows: [[井伊家の届, 4人, その場で亡くなった人], [村田蔵六の手紙, 6人, その場で亡くなった人], [豪徳寺の碑, 8人, あとで亡くなった人も]], upto: 3}
      # fact: ii-22
      - 語り: 襲った18人のうち、その場で討たれたのは、1人。4人は、近くで自害しました。8人は、老中の脇坂家と、熊本の細川家の屋敷へ、自ら名乗り出ています。
        figure: null
      # fact: ii-22
      - 語り: 関鉄之介ら5人は、逃れました。
      # fact: ii-65
      - 語り: 知らせが届くのに、3か月かかった人もいます。咸臨丸でアメリカから戻った赤松則良は、5月5日、浦賀に入って初めて、大老が討たれたことを聞いた、と日記に書いています。
      # fact: ii-26
      - 語り: 襲った一人、蓮田市五郎は、この朝を、絵に描きました。昭和の『維新史料綱要』も、この日の出どころに、その絵を挙げています。
      # fact: ii-26
      - 語り: 2025年には、東京の日比谷図書文化館で、桜田門外の変の展示が開かれ、茨城県立図書館が持つ、この朝の絵が並びました。
      # fact: ii-66
      - 語り: 同じ展示には、月岡芳年の錦絵も出ました。愛宕山での集まりを描いたその題では、年が、安政5年となっています。事件は、安政7年です。
      # fact: ii-42
      - 語り: 豪徳寺には、公開されていない、直弼の銅像もあります。1907年から翌年に作られ、2014年に、世田谷区の文化財になりました。
      # fact: ii-42
      - 語り: 作った藤田文蔵は、彦根藩に仕えた人たちから、話を聞いて、像の参考にした、とされます。
      - 語り: では、大老は、なぜ、討たれなければならなかったのか。
        tone: 疑問
        hook: true

  - title: まとめ：大老は、なぜ江戸城の門の前で討たれたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: ii-58
      - 語り: その日は、節句の登城の日でした。紀州の写しによれば、道には行列を見物する人たちがいて、襲う側は、その中にまぎれていました。
        tone: しみじみ
      # fact: ii-43, ii-18
      - 語り: 屋敷から桜田門へ向かう、およそ500メートルの道。屋敷を出て、まだ160メートルあまりの所で、雪の中、行列は襲われました。
        tone: しみじみ
      # fact: ii-19, ii-16
      - 語り: 合図はピストル。そして守る側は、合羽と柄袋で、すぐには刀を抜けなかった。この点は、立場の違う記録が、そろって書きます。
        tone: しみじみ
      # fact: ii-17, ii-18
      - 語り: 斬り合いは、時計で3分ばかり。屋敷から人が駆けつけたとき、襲った者たちは、もう、いませんでした。
        tone: しみじみ
      # fact: ii-61, ii-51
      - 語り: 襲った側は、勅許の無い条約と、忠義の人たちを罪に落としたことを、討つ理由に挙げました。直弼自身は、条約を、よんどころない場合だった、と書いています。
        tone: しみじみ
      # fact: ii-30, ii-20
      - 語り: 分からないことも、残ります。弾は、胸先に当たったのか、腰か。駕籠の中の大老は、刀に手を掛けたのか、もう事切れていたのか。
        tone: しみじみ
      # fact: ii-09, ii-10
      - 語り: その場で亡くなった供は、4人か、6人か。
        tone: しみじみ
      # fact: ii-11, ii-36
      - 語り: そして、大老の死は、2か月近く、伏せられました。将軍からの見舞いの品は、亡くなった大老あてに、届いていました。
        tone: しみじみ
        pause: 0.8
      # fact: ii-62
      - 語り: 自分を、大臆病者と書いた人。その人が、最後の朝、駕籠の中で、何をしていたのか。記録は、割れたままです。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、大老が討たれた、いちばんの理由は、何だったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
