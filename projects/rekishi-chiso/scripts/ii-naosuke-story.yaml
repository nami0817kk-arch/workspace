# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  幕府でいちばん重い役、大老は、なぜ江戸城の門の前で討たれたのか。斬り合いは、時計で3分ばかりだった、と当時の書き留めにあります。
  その日の夜、井伊家が幕府に出した届は、直弼本人の言葉で「少々けがをしたので、ひとまず帰宅した」。井伊直弼は、もう亡くなっていました。
  1860年3月3日、雪の朝。襲った側・守った側・周りの屋敷の番人の記録を、時刻の順に並べました。
  この動画でわかること
  ・合図のピストルと、すぐには刀を抜けなかった供（ここは立場の違う記録が一致する）
  ・駕籠の中の直弼の最期をめぐる、守った側と襲った側の話の食い違い
  ・鳥取に残った日記の「胸先」と、弾の当たった所
  ・条約・跡継ぎ・密勅・大獄と、襲った側が挙げた理由
  ・2か月近く伏せられた死と、将軍からの見舞いの品
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  当日の記録は、『桜田紅雪録』『堤蟻叢書』『近世野史』（国立国会図書館デジタルコレクション）、和歌山県立文書館の「前代未聞之珍事」の翻刻、『維新史料綱要』によります。記録によって人数・時刻・言葉が違うところは、記録ごとに並べました。
  研究・解説は、文化庁の文化遺産オンライン・観光庁の多言語解説文・雑誌『サライ』・彦根城博物館・茨城県立歴史館・鳥取県立博物館・東京大学史料編纂所・世田谷区・国立国会図書館の公開資料、中国新聞（2022年）、『歴史街道』（2015年）、NHK「歴史探偵」（2024年）を紹介した記事、和樂web（2020年）によります。
  年齢は数え年。日付は当時の暦（安政7年3月3日は、今の暦で1860年3月24日）です。年数・日数の差は、記録の日付から計算し直したものです。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Ii Naosuke: Why Was the Chief Minister Killed at the Gate of Edo Castle? Three Minutes in the Snow"
  description: |-
    Why was the shogunate's chief minister killed right outside a gate of Edo Castle? A record written at the time says the fighting lasted "about three minutes by the clock."
    That night, the Ii family told the shogunate that their lord had been "slightly injured and has returned home." Ii Naosuke was already dead.
    We follow the snowy morning of March 3, 1860 (old calendar) minute by minute, from the records of the attackers, the defenders and the guards of nearby mansions.
    In this video you will learn:
    - The pistol signal, and why the escorts could not draw their swords
    - How the defenders' and attackers' accounts of Naosuke's last moment differ
    - A diary in Tottori that says the bullet hit his chest
    - The treaty, the succession, the secret imperial edict and the purge behind the attack
    - How his death was hidden for nearly two months
    Records differ on numbers, times and words. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Three Minutes at the Sakurada Gate"
    - "The Snowy Morning of March 3, 1860"
    - "Around 9 a.m.: The Pistol Signal"
    - "Where Did the Bullet Hit? A Diary in Tottori"
    - "1858: Treaty, Successor and Secret Edict"
    - "The Minister Kept Alive on Paper"
    - "After the Snowy Morning"
    - "Summary: Why Was He Killed?"

