# 1本に1つの問い＝「大老は、なぜ江戸城の門の前で討たれたのか」。答えの席＝討たれた理由（襲った側の言い分／直弼の言い分）と、駕籠の中の最期。題名で言い切らない。
#   冒頭（10秒以内）＝問い＋「斬り合いは時計で三分ばかり」（ii-17）。続く意外な一点＝その夜の届は「少々けが・ひとまず帰宅」（ii-08）・将軍から亡き大老あての見舞い（ii-11）。
#   他チャンネルの当たり「井伊家のその後」「直弼を討った18人のその後」と重ねない：最期の場面とその理由が主。18人のその後は1〜2行だけ。
# 記録の食い違い：①襲った人数（風聞書17人／井伊家の届 約20人／18人。ii-27）②駕籠の中の直弼（松井貞之進「刀の柄に手を掛けた」／浪士「もう事切れていた」。ii-20）
#   ③弾の当たった所（安達日記「胸先」／一般の解説「太ももから腰」。ii-30）④供の死者（届 即死4／村田蔵六の手紙 6／殉難八士の碑 8。ii-09・ii-10・ii-41）⑤喪の公表（閏3月30日／三条実美公年譜 4月。ii-12・ii-36）。
# 計算（自分で計算し直した）：直弼 1815年（文化12）生まれ→1860年 数え46（1860−1815+1）／一町半＝1.5×約109m＝約164m→「160メートルあまり」／
#   3月3日→閏3月30日＝約2か月（56〜57日）→「2か月近く」／墓石の閏3月28日と喪の閏3月30日の差＝2日／村田蔵六の手紙＝事件の12日後（カードどおり）／
#   届の4人・手紙の6人・碑の8人／18人＝稲田1＋自害4（山口・鯉淵・有村・広岡）＋名乗り出8（脇坂4・細川4）＋逃れた5（1+4+8+5=18）／
#   1858年（安政5）→1860年＝大獄は9月から約1年／密勅返納の決定 2月23日、斎藤の自害 24日→「8日前」は暦から計算（安政7年2月は29日まで。2月24日＝西暦3月16日、3月3日＝3月24日）。
