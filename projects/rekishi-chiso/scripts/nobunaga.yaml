  # ---------------------------------------------------------------- 11
  - title: 見立て：革命児は、いつ生まれたか
    background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）"}
    portrait: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, caption: "織田信長（伝 狩野永徳画、大徳寺総見院蔵）"}
    year: 1622
    lines:
      - 語り: 信長の姿は、時代ごとに大きく変わってきました。大きく3つの時代に分けて見てみましょう。
      - 聞き: 3つも？ 順番に聞かせて。
        tone: 疑問
      - 語り: まず、江戸時代。江戸の初めに、よく読まれたのが『甫庵信長記』です。桶狭間の奇襲や、長篠の三段撃ちは、この本の脚色から広まりました。
        portrait: null
      - 語り: 作者の小瀬甫庵は、儒学の考えを強く持つ人で、読み物として面白く、教えになるように、話を整えたり足したりした、と見られています。
      - 聞き: 最初のほうで聞いた、なんで話を変えたのかって、それが答えか。
        tone: 納得
      - 語り: ところが、学者の評価は冷たいものでした。
      - 語り: 実は、江戸時代の信長は、意外なほど人気がなかったんです。
        short: s8
        card: {head: "江戸時代", body: "信長は意外なほど不人気"}
      - 聞き: え、ヒーローじゃなかったの？
        short: s8
        tone: 驚き
      - 語り: 学者の新井白石は、信長を「天性残忍」、生まれつき残酷な人だと書きました。
        short: s8
      - 語り: 林羅山も冷たく厳しい人だと評し、水戸の徳川光圀は、家臣に裏切られたのは、信長に徳がなかったからだ、という見方をしています。
      - 語り: 芝居でも、信長は悪役や、秀吉の引き立て役として描かれることが多くありました。秀吉が主人公の読み物『絵本太閤記』でも、信長は脇役です。
      - 聞き: 江戸の人たち、信長に冷たすぎる。
        tone: 笑い
      - 語り: 風向きが変わり始めるのは、1827年。頼山陽が献上した『日本外史』が、御所を修理し、乱れた世を平らげて、朝廷を立て直した人として、信長をたたえたんです。
        year: 1827
      - 語り: 次に、明治です。天皇を中心とする国づくりの中で、信長は、荒れた御所を修理した「勤王家」として見直されました。
        short: s8
        year: 1869
      - 語り: 1869年、明治天皇は、信長を神としてまつる神社を建てるよう命じます。今の京都の建勲神社です。奇襲や三段撃ちが教科書に載ったのも、明治の終わりごろです。
        short: s8
        card: {head: "1869年", body: "信長をまつる神社が命じられる（建勲神社）"}
      - 聞き: 残忍な人から、神様に！ 落差がすごい。
        short: s8
        tone: 驚き
      - 語り: そして、戦後です。1963年から連載された、司馬遼太郎の小説『国盗り物語』が、古いしきたりを打ち破る信長を描きました。
        short: s8
        card: {head: "1963年〜", body: "小説『国盗り物語』"}
        year: 1963
      - 語り: 1973年には大河ドラマにもなり、「革命児・信長」の姿が、一気に広まります。
        short: s8
      - 語り: その先に、ゲームや漫画の「魔王」の信長もいます。フロイスの手紙の小さな逸話が、ここで大きな看板になりました。
      - 聞き: あーしが好きな信長は、戦後に生まれた信長だったんだ……。
        tone: しみじみ
      - 語り: そして今、研究者は、また信長を見直しています。2010年代に入って、信長の本が相次いで出ました。
      - 語り: 描かれたのは、将軍や朝廷を立て、世間の評判を気にした、思ったより保守的な信長、という姿です。
      - 語り: ただ、信長は新しい政権を作ろうとしていた、と、その革新性を重く見る研究者もいます。ここは、まだ議論が続いています。
      - 聞き: 時代ごとに、見たい信長がいたってことか。
        tone: 納得
      - 語り: そう思います。主君の徳を重んじた江戸では暴君に、天皇を立てたい明治には忠臣に、古いものを壊したい戦後には革命児に。
        tone: しみじみ
      - 聞き: じゃあ、記録から見える、本当の信長は？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。若いころはうつけと呼ばれながら稽古を欠かさず、将軍を立てて京都に上り、朝廷を支え、他の大名の良いやり方を取り入れて広げた人。
      - 語り: そして、戦いでは容赦がなく、多くの命が失われた出来事にもかかわった人です。
        tone: しみじみ
      - 聞き: 全部を一人で変えた革命児じゃなくて、時代の流れを、誰よりも速く広げた人、って感じかな。
        tone: しみじみ
      - 語り: つむぎさんの言い方が、いちばん近いかもしれません。それでも、話を盛らなくても十分に面白い人だった、と僕は思います。
        tone: しみじみ
      - 聞き: 盛られた信長も、盛られてない信長も、どっちも見られて得した気分。
        tone: 明るい
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、江戸の鎖国。「日本は国を閉ざしていた」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

