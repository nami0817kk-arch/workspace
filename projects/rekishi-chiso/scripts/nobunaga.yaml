# 事実の控え（2026-10-06。詳細は dev/output/rekishi-chiso/research/nobunaga_facts.md）
# - 生 天文3年5月12日（1534-06-23、5月28日説も）。没 天正10年6月2日（1582-06-21 ユリウス暦）、数え49・満47
# - 大うつけ・抹香・稽古：信長公記 首巻。平手政秀の自害 1553（理由は説）
# - 桶狭間 1560-06-12：公記 今川45000、織田約2000。奇襲説＝甫庵信長記＋明治参謀本部、正面攻撃説（藤本正行）が有力
# - 人間五十年：幸若舞『敦盛』。公記では桶狭間の出陣前に舞う。本能寺で舞った記録なし
# - 1567 美濃・岐阜。11月から天下布武印。天下＝畿内説（神田千里・金子拓・柴裕之）、異論（乃至政彦）
# - 1568 義昭を奉じて上洛、義昭15代将軍。堺に矢銭2万貫（はじめ拒否、今井宗久が説得）。関所撤廃（領国のみ、京都七口は残る）
# - 楽市：1549 六角定頼 石寺新市が初見、1566 今川氏真 富士大宮、1567年10月 信長 美濃加納。楽座＝役銭免除説（長澤伸樹）
# - 兵農分離：平井上総2017が見直し
# - 比叡山 1571-09-30（元亀2年9月12日）：前年浅井朝倉をかくまう。死者 言継卿記3000〜4000、フロイス約1500。兼康保明1981 発掘で根本中堂・大講堂のみ
# - 1573 義昭追放。義昭は将軍のまま鞆へ（鞆幕府論）
# - 長篠 1575：公記「千挺ばかり」と柵、三段撃ちなし。三千挺・三段撃ちは甫庵信長記、明治の陸軍戦史で教科書へ
# - 1574 蘭奢待（正親町天皇の許し）、官位（1575右近衛大将、1577右大臣、1578に辞める）、1582 三職推任
# - 安土城 1576着工、1579天主完成（地上6・地下1、約32m推定、狩野永徳）。変後に焼失、原因不明。1989年から約20年 滋賀県が発掘
# - キリスト教：1569 フロイスと会見・布教許可。渡邊大門「数ある宗教の一つとして保護」
# - 第六天魔王：フロイス1573書簡の逸話、書状は現存せず
# - 評価：新井白石『読史余論』天性残忍、林羅山 天性刻薄。1869 建勲神社。司馬遼太郎『国盗り物語』1963-66連載、大河1973。研究：池上2012・金子2014・神田2014（保守的）、藤田2010（革新的）
# - お金：京都の大工の日当100文＝1万円（明智の回と同じ）→ 2万貫≒20億円。北条領の人夫20文なら約100億円（5倍）
# - 10-06 確認の反映：1578年に辞官（1577は右大臣）。日本戦史は桶狭間役1899・長篠役1903ごろ（明治の終わり）。公記の千挺ばかりは五奉行の分、別働隊に五百挺。
#   多聞院日記の千余人は伝聞・国衆の数。村木砦1554は長篠の21年前。兼康1981は工事時の発掘の再検討（東塔・西塔・横川）。義昭の鞆は1576から。
#   安土宗論は判定役が負けとし、信長が処罰と償い。日本外史は1827献上・1829刊。建勲神社は1869に命、1870創建、1880船岡山。甫庵信長記の初刊は諸説。
#   1567年11月の時点で京都に将軍はいない。公記の原文は「明衣の袖をはづし」「朝夕」「三月より九月まで」。平手は公記では「信長の振る舞いを悔やんで」。
#   大雨は公記にあり、攻めたのは雨が上がってから。「楽市楽座」の4文字の初出は1568年の信長の加納の制札（六角・今川は「楽市」）。今井宗久の説得は「とされる」。
#   京都御馬揃え1581（2/28、3/5）、清洲同盟は徳川方の書物（1567の婚姻から）、今川義元像は江戸中期の書物、安土宗論1579、名物狩り、1553正徳寺、1554村木砦（nobunaga_facts2.md）
