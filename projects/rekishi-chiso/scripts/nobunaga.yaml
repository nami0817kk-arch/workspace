sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：古い権威を壊した革命児
    background: {image: paintings/nobunaga_nagashino_screen_full.jpg, credit: "長篠合戦図屏風（江戸時代）"}
    portrait: {image: paintings/nobunaga_chokoji_bust.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）"}
    year: 1575
    lines:
      - 語り: 古い権威を次々と壊し、新しい時代を切り開いた男。楽市楽座、鉄砲の三段撃ち、比叡山の焼き討ち、そして「天下布武」。
        tone: 強調
      - 聞き: 織田信長でしょ！ 自分のこと「魔王」って名乗ってた人。
        tone: 明るい
      - 語り: はい、織田信長です。日本史の英雄の中でも、いちばん人気のある一人ですね。
      - 聞き: あーし的には、戦国で一番かっこいい人。革命児って感じ。
        tone: 明るい
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: え、信長も掘っちゃうの？ ヒーローなのに。
        tone: 疑問
      - 語り: たとえば、長篠の戦いの鉄砲の三段撃ち。信長の家臣が書いた記録には、三段撃ちは出てきません。
        short: s1
        card: {head: "1575年", body: "三段撃ちは家臣の記録にない"}
      - 聞き: うそでしょ！？ 教科書で見た気がするのに。
        short: s1
        tone: 驚き
      - 語り: しかも、近年の研究では、信長は思っていたより、古い権威を大事にした人だった、という見方が強くなっています。
      - 聞き: 革命児なのに、古いものを大事に？ 真逆じゃん。
        tone: 疑問
      - 語り: もう一つ。今の「革命児」の姿が広まったのは、実は、太平洋戦争が終わったあと、ここ60年ほどのことなんです。
      - 聞き: え、ずっと昔から英雄じゃなかったの？
        tone: 疑問
      - 語り: それも、最後に掘り当てましょう。まずは、若いころの信長から。
      - 聞き: 了解。今日はヘルメット、二重にかぶっとく。
        tone: 笑い

  # ---------------------------------------------------------------- 2
  - title: 大うつけの若殿
    background: {image: paintings/nobunaga_kuniyoshi_musha.png, credit: "歌川国芳《太平記英勇伝》（信長を名を変えて描いた武者絵）1848〜49年ごろ"}
    portrait: null
    year: 1534
    lines:
      - 語り: 1534年、信長は、尾張、今の愛知県西部の武将、織田信秀の跡取りとして生まれました。
        card: {head: "1534年", body: "尾張に生まれる"}
      - 語り: 生まれた城は、那古野城とも、勝幡城とも言われます。近年は勝幡城の説が有力です。
      - 聞き: 小さいころから、すごかったの？
        tone: 疑問
      - 語り: 若いころは、大うつけ、つまり大ばか者と呼ばれていました。
      - 語り: 着物の袖を外し、髪は茶筅のように結い上げ、町を歩きながら栗や柿や瓜をかじる。人の肩にぶら下がって歩いた、とも書かれています。
      - 聞き: 今で言うと、だらしない不良って感じ？
        tone: 笑い
      - 語り: この話の出どころは、信長の家臣、太田牛一が書いた《信長公記》です。信長に仕えた人の記録なので、信頼度は高いとされます。
      - 聞き: 家来が、殿様のだらしない話まで書いちゃうんだ。
        tone: 疑問
      - 語り: 父の信秀の葬儀では、仏前にお香をつかんで投げつけて帰った、という場面も、同じ本に書かれています。
        card: {head: "父の葬儀", body: "お香を仏前に投げつける"}
      - 聞き: それは、さすがにやばい……。
        tone: 驚き
      - 語り: このあと、守り役の平手政秀が、自ら命を絶っています。『信長公記』は、信長の振る舞いを悔やんでのことだった、と書いています。
        tone: 重い
      - 聞き: 周りの大人は、そうとう心配してたんだね。
        tone: しみじみ
      - 語り: ところが、同じ本には、ちがう顔も書かれています。朝夕に馬の稽古をし、春から秋には川で泳ぎ、弓や鉄砲、兵法の稽古にも励んでいた、と。
      - 聞き: だらしないふりして、ちゃんと鍛えてたんだ。
        tone: 納得
      - 語り: 鉄砲にも、早くから目をつけていました。
      - 語り: 1553年、美濃の斎藤道三と会ったときには、信長の行列に、弓と鉄砲が500ほど並んでいた、と『信長公記』にあります。
      - 聞き: 若いころから、もう鉄砲をそろえてたんだ。あーし、ちょっと見直した。
        tone: 納得
      - 語り: その「うつけ」が、尾張をまとめていきます。そして1560年、隣の大国が攻めてきました。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 桶狭間の本当の姿
    background: {image: paintings/nobunaga_okehazama_owari_meisho.jpg, credit: "『尾張名所図会』桶狭間古戦場（1844年）"}
    portrait: null
    year: 1560
    lines:
      - 語り: 1560年、駿河と遠江、今の静岡県の大名、今川義元が、大軍で尾張に攻めこみます。
        short: s4
        card: {head: "1560年", body: "今川義元が尾張へ"}
      - 聞き: 今川義元って、お歯黒をした、公家っぽい弱い大名でしょ？
        tone: 疑問
      - 語り: そのイメージは、江戸時代の中ごろの書物から広まったものです。お歯黒も言い伝えです。実際の義元は、独自の法を足して領地を治めた、力のある大名でした。
        portrait: {image: paintings/nobunaga_imagawa_yoshimoto_ukiyoe.jpg, caption: "今川義元を名を変えて描いた武者絵（歌川国芳）"}
      - 語り: 同じ時代の名将、朝倉宗滴も、義元を、人を使うのがうまい大名だと評しています。
      - 語り: 『信長公記』によれば、今川軍は4万5000。信長の軍は2000ほどだったとされます。
        short: s4
        portrait: null
        figure: {type: bars, title: 桶狭間の兵の数（信長公記による）, bars: [[今川軍, 45000], [信長の軍, 2000]], labels: ["4万5000", "約2000"], note: 実際の数は分かっていない}
      - 聞き: 20倍以上！？ それで勝ったんだよね。
        short: s4
        tone: 驚き
      - 語り: ただ、この数も確かではありません。明治の陸軍の戦の歴史では、今川軍は2万5000とされています。実際の数は分かっていないんです。
      - 語り: 出陣の前、信長は舞を舞ったと書かれています。「人間五十年」という、あの有名な一節です。
        short: s5
        figure: null
      - 人物: 「人間五十年、下天の内をくらぶれば、夢幻の如くなり」
        who: 敦盛
        short: s5
      - 聞き: それ、本能寺で燃えながら舞ったんじゃないの？
        short: s5
        tone: 疑問
      - 語り: 『信長公記』で舞ったのは、この桶狭間の出陣の前です。本能寺で舞った、という記録はありません。
        short: s5
        card: {head: "人間五十年", body: "舞ったのは桶狭間の出陣前"}
      - 語り: しかもこれは、信長が作った言葉ではありません。幸若舞という芸能の『敦盛』という演目の一節です。
        short: s5
      - 聞き: 信長の名言じゃなくて、好きな歌の歌詞みたいなもの？
        short: s5
        tone: 疑問
      - 語り: そのたとえが近いですね。
        short: s5
      - 語り: 戦いの中身も見てみましょう。よく知られているのは、信長が山の裏を回りこんで、今川の本陣を後ろから突いた、という奇襲の話です。
        short: s4
      - 聞き: 雨にまぎれて、ってやつだ。ドラマで見た。
        tone: 明るい
      - 語り: 大雨が降ったのは本当で、『信長公記』にも書かれています。ただ、信長が攻めかかったのは、雨が上がってからです。
      - 語り: そして、山の裏を回りこむ奇襲の話は、江戸時代の初めの《甫庵信長記》という本と、明治の陸軍がまとめた戦の歴史が広めたものです。
        short: s4
        card: {head: "奇襲説", body: "江戸の本と明治の戦史が広めた"}
      - 語り: 『信長公記』を読み直すと、信長は、砦から正面に攻めかかっています。今は、この正面攻撃の説が、有力な説の一つになっています。
        short: s4
      - 聞き: 奇襲じゃなくて、真正面から！？ そっちのほうがすごくない？
        short: s4
        tone: 驚き
      - 語り: 結果として、今川義元はこの戦いで命を落とし、信長の名は一気に広まりました。
        tone: 重い
      - 聞き: でも、なんで江戸の本は、話を変えちゃったんだろう。
        tone: 疑問
      - 語り: そこは、最後の層で掘ります。桶狭間の7年後、信長は、ある四文字を印に彫らせます。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 「天下布武」の本当の意味
    background: {image: paintings/nobunaga_rakuchu_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    portrait: null
    year: 1567
    lines:
      - 語り: 1567年、信長は美濃、今の岐阜県南部を手に入れ、稲葉山の城下を「岐阜」と名づけます。
        card: {head: "1567年", body: "美濃を取り、岐阜と名づける"}
        figure: {type: map, title: 信長の動き, bounds: [135.3, 137.6, 34.6, 35.7], route: [清洲, 岐阜, 京都], places: [[清洲, 136.85, 35.22], [岐阜, 136.76, 35.42], [安土, 136.14, 35.15], [京都, 135.77, 35.01], [桶狭間, 136.97, 35.06], [長篠, 137.57, 34.92]], note: 尾張から美濃をへて京都へ。安土城は1576年から}
      - 語り: そして1567年の11月から、手紙に押す印に「天下布武」の四文字を使い始めました。
        short: s2
        card: {head: "1567年11月", body: "「天下布武」の印を使い始める"}
      - 聞き: 天下に武を布く。武力で日本を統一する、って宣言でしょ？
        short: s2
        tone: 明るい
      - 語り: そう読まれてきました。ところが近年の研究では、ここでいう「天下」は、日本全国ではない、という見方が有力になっています。
        short: s2
        figure: null
      - 聞き: え、じゃあ天下って、どこ？
        short: s2
        tone: 疑問
      - 語り: 京都を中心とする、畿内です。今の京都・奈良・大阪のあたりですね。
        short: s2
      - 語り: つまり「天下布武」は、将軍が治めるはずの京都とそのまわりの秩序を、武の力で取り戻す、という意味ではないか、と考えられているんです。
        short: s2
        card: {head: "天下（近年の説）", body: "全国ではなく、京都を中心とする畿内"}
      - 聞き: 日本全部じゃなくて、京都のまわりだけ……。だいぶスケールが小さくなった。
        short: s2
        tone: 驚き
      - 語り: ただ、畿内に限ると言い切るのは早い、という研究者もいます。ここは、まだ議論が続いています。
      - 語り: 翌1568年、信長は、足利義昭を連れて京都に上ります。義昭は、室町幕府の15代将軍になりました。
        card: {head: "1568年", body: "足利義昭を連れて京都へ"}
        portrait: {image: paintings/nobunaga_yoshiaki_portrait.jpg, caption: "足利義昭（江戸時代の写し）"}
      - 聞き: 将軍を倒すんじゃなくて、将軍にしてあげたんだ。
        tone: 疑問
      - 語り: そうです。そして上洛したその年、信長は、商人の町、堺に、戦の費用として2万貫を出すよう求めています。
        card: {head: "1568年", body: "堺に矢銭2万貫"}
        portrait: null
      - 聞き: 2万貫って、今だと？
        tone: 疑問
      - 語り: 当時の京都の大工の日当が、およそ100文。これを今の1万円とすると、1貫はざっくり10万円です。
      - 聞き: じゃあ、2万貫だと……？
        tone: 疑問
      - 語り: およそ20億円です。地方の安い日当で数えると5倍にもなるので、目安です。
        figure: {type: money, title: 堺に求めた矢銭, then: "2万貫", yen: 2000000000, basis: "京都の大工の日当100文を今の1万円とした目安（1貫≒10万円）。北条領の人夫の日当（20文）で数えると5倍になる"}
      - 語り: 堺の商人たちは、はじめは断りました。でも、商人の今井宗久が仲間を説得して、結局は払うことになった、とされます。
        figure: null
      - 聞き: 商人にも、信長と組んだほうが得、って読んだ人がいたんだ。
        tone: 納得
      - 語り: 同じ年、信長は、領地の関所の通行料もやめています。家臣の記録には、天下のため、旅人を哀れんで、とあります。
        card: {head: "1568年", body: "領地の関所の通行料をやめる"}
      - 聞き: それは、ちゃんと新しいことしてるじゃん。
        tone: 納得
      - 語り: ただ、やめたのは自分の領地の関所です。京都の入り口の関所は、信長が亡くなるまで残っていました。
      - 語り: 翌年には、義昭のために住まいを建て、天皇の住む御所の修理もしています。
      - 語り: その将軍の住まいの工事現場で、1569年、信長は宣教師のルイス・フロイスと会い、京都での布教を許しています。
        background: {image: paintings/nobunaga_jesuit_nobleman.jpg, credit: "屏風に描かれた宣教師と武士（1600年ごろ）"}
      - 聞き: 工事現場で会うって、なんか信長らしいかも。あーしも現場でヘルメットかぶってるし、親近感。
        tone: 笑い
      - 語り: 仏教への対抗のため、とよく言われます。でも、たくさんある宗教の一つとして守っただけで、特別扱いではなかった、と見る研究者もいます。
      - 語り: その2年前、信長は、美濃の加納という町に、ある命令を出していました。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 楽市楽座は信長が最初？
    background: {image: paintings/nobunaga_rakuchu_uesugi_left.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）左隻"}
    portrait: null
    year: 1567
    lines:
      - 語り: 楽市楽座。市で商売をするときの税や、同業者の組合への負担を免じて、商売をしやすくする政策です。
        short: s3
      - 聞き: テストに出るやつ！ 信長が始めた、って覚えた。
        short: s3
        tone: 明るい
      - 語り: ところが、楽市の最初の記録は、1549年。近江の大名、六角定頼の城下の市です。
        short: s3
        card: {head: "1549年", body: "六角氏の城下の市が「楽市」"}
      - 聞き: 信長より前に、もうあったの！？
        short: s3
        tone: 驚き
      - 語り: 信長が最初に楽市の命令を出したのは、1567年。美濃の加納という町に宛てたものです。六角氏より、18年あとです。
        short: s3
        card: {head: "1567年", body: "信長の最初の楽市令（美濃・加納）"}
      - 語り: その前の年には、今川氏も駿河の市を楽市にしています。信長の楽市は、この流れを受けたものと見る研究者もいます。
        short: s3
      - 聞き: 信長が考えたんじゃなくて、まねして広げた人、ってこと？
        short: s3
        tone: 疑問
      - 語り: 広げた、というのは当たっています。
        short: s3
      - 語り: それに「楽座」も、組合を壊すのではなく、組合に払うお金を免じる意味だった、という研究があります。
      - 聞き: 名前のイメージより、ずっとおだやかなんだ。
        tone: 納得
      - 語り: もう一つ、よく言われるのが、兵と農民を分けて、戦の専門家の軍隊を作った、という話です。
      - 語り: でも近年、信長が狙って兵と農民を分けた、という説明は、疑われています。家来が城下に集まったのは、領地替えの結果だった面も大きい、という見方です。
        card: {head: "兵農分離", body: "狙った政策だったかは疑問"}
      - 聞き: 信長の新しいところ、どんどん減っていく……。あーしの革命児が……。
        tone: 笑い
      - 語り: 新しいことを全部一人で始めた人、ではなかった、ということです。そして、ここから信長は、大きな裏切りにあいます。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 裏切りと、10年の戦い
    background: {image: paintings/nobunaga_anegawa_screen.jpg, credit: "姉川合戦図屏風（部分）"}
    portrait: null
    year: 1570
    lines:
      - 語り: 1570年、信長は、越前、今の福井県の朝倉氏を攻めます。ところが、その途中で、妹のお市の夫、浅井長政が、信長に背きました。
        card: {head: "1570年", body: "浅井長政が背く"}
      - 聞き: 妹の旦那さんに裏切られたの！？
        tone: 驚き
      - 語り: 前を朝倉、後ろを浅井にはさまれる形です。信長は、わずかな供を連れて、急いで京都へ逃げ帰りました。金ヶ崎の退き口と呼ばれます。
      - 聞き: 天下人って、もっと勝ちっぱなしのイメージだった。
        tone: 疑問
      - 語り: 同じ年、信長は家康と組んで、姉川で浅井・朝倉の軍と戦います。
        card: {head: "1570年", body: "姉川の戦い"}
      - 聞き: 家康さんとは、清洲同盟で仲良しなんだよね。
        tone: 疑問
      - 語り: 実は、清洲で二人が会って同盟を結んだ、という話は『信長公記』にはなく、江戸時代の徳川方の書物が出どころです。
      - 語り: 本格的に手を組んだのは、1567年、家康の息子と信長の娘が結婚してから、という見方が有力です。はじめは対等に近かった関係も、のちに家康が従う形に変わっていきました。
      - 聞き: 同盟も、物語で盛られてたんだ。
        tone: 納得
      - 語り: このあと、何年も、苦しい戦いが続きます。浅井、朝倉、そして大坂の石山本願寺。あちこちで、信長に逆らう勢力が立ち上がりました。
      - 語り: 本願寺に従う人々が各地で起こした一向一揆とも戦い、伊勢の長島や越前では、非常に厳しい処置をとって、多くの犠牲が出ています。
        tone: 重い
      - 語り: 本願寺が大坂を退くのは、1580年。およそ10年かかっています。
        card: {head: "1580年", body: "石山本願寺が大坂を退く"}
      - 聞き: 10年って……。革命どころか、ずっと戦ってるじゃん。
        tone: しみじみ
      - 語り: そうなんです。信長の毎日は、新しい国づくりより、まず目の前の敵との戦いでした。つむぎさんのイメージより、ずっと泥くさいかもしれません。
      - 聞き: あーしの中の信長、ずっと余裕の顔で笑ってたのに。
        tone: 笑い
      - 語り: その戦いの最中、1571年。信長は、ある山に兵を向けます。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 比叡山と「魔王」
    background: {image: paintings/nobunaga_hiei_kyosai.jpg, credit: "河鍋暁斎《東海道名所之内 比叡山》1863年"}
    portrait: null
    year: 1571
    lines:
      - 語り: 1571年、信長は、比叡山の延暦寺を攻めました。比叡山焼き討ちです。
        short: s7
        card: {head: "1571年", body: "比叡山焼き討ち"}
      - 聞き: お寺を焼いちゃうなんて、やっぱり魔王じゃん。
        short: s7
        tone: 重い
      - 語り: 理由は、前の年に、比叡山が信長と敵対する浅井・朝倉の軍をかくまい、話し合いにも応じなかったことでした。
      - 語り: 亡くなった人の数は、記録によって幅があります。公家の日記は3000から4000人、宣教師フロイスの手紙はおよそ1500人です。
        short: s7
      - 語り: のちに本能寺で信長を討つ明智光秀も、この戦いにかかわっています。焼き討ちの10日前、近くの土豪に、味方してくれた礼と褒美を約束する手紙を出しているんです。
      - 聞き: 光秀さんも、しっかり加わってたんだ。
        tone: 納得
      - 語り: そして1981年、昔の工事のときの発掘の記録を読み直した研究が発表されます。焼き討ちで焼けたとはっきり言える建物は、根本中堂と大講堂だけでした。
        short: s7
        card: {head: "発掘の記録の読み直し", body: "焼けたと確かな建物は2つ"}
      - 聞き: え、山じゅう全部燃えたんじゃないの？
        short: s7
        tone: 驚き
      - 語り: 調べられた場所は限られますが、多くの僧の住まいは、すでに山のふもとに移っていたと考えられています。ただ、被害がなかったわけではありません。
        short: s7
      - 聞き: 大げさに伝わった部分はあるけど、ひどい出来事だったのは本当、ってことか。
        short: s7
        tone: しみじみ
      - 語り: 比叡山焼き討ちのあとに生まれたのが、あの「魔王」の話です。
        short: s6
      - 語り: 宣教師フロイスの、1573年の手紙に、こんな話が出てきます。
        short: s6
      - 語り: 武田信玄が、比叡山の高い僧の名で署名した手紙を送ってきた。そこで信長は、「第六天魔王」と署名して返した、というものです。
        short: s6
        card: {head: "第六天魔王", body: "フロイスの手紙が伝える逸話"}
      - 聞き: 比叡山を焼いた信長が、魔王って返したんだ。皮肉が効いてる。
        short: s6
        tone: 笑い
      - 語り: ただ、その署名をした書状そのものは、残っていません。フロイスの手紙だけが伝える逸話として扱うのがよい、とされています。
        short: s6
      - 聞き: 魔王の看板まで、また聞きの話だったんだ。
        short: s6
        tone: しみじみ
      - 語り: 同じ1573年、信長は、将軍の義昭を京都から追い出します。室町幕府は、ここで事実上終わったとされます。
        card: {head: "1573年", body: "義昭を京都から追う"}
      - 語り: ただ、義昭は将軍のまま各地を移り、1576年からは西の毛利氏のもとで、命令を出し続けていました。幕府がいつ終わったのかは、言い方の難しいところです。
      - 聞き: 追い出されても、将軍は将軍なんだ。
        tone: 納得
      - 語り: 義昭が去って2年後、信長は、武田の軍と向き合います。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 長篠を掘る
    background: {image: paintings/nobunaga_nagashino_teppo_ashigaru.jpg, credit: "長篠合戦図屏風（部分、江戸時代）"}
    portrait: {image: paintings/nobunaga_katsuyori_portrait.jpg, caption: "武田勝頼（高野山持明院蔵の像の部分）"}
    year: 1575
    lines:
      - 語り: 1575年、長篠の戦いです。信長と徳川家康の軍が、武田勝頼の軍を破りました。
        short: s1
        card: {head: "1575年", body: "長篠の戦い"}
      - 語り: 有名なのは、鉄砲3000挺を3列に並べ、入れ替わりに撃った、という三段撃ちの話です。
        short: s1
        portrait: null
      - 聞き: 最初に言ってた、記録にないってやつだ。
        tone: 疑問
      - 語り: 『信長公記』に書かれているのは、鉄砲「千挺ばかり」と、馬をふせぐ柵です。別の部隊にも五百挺あったとあり、全部でいくつだったのかは分かりません。三段撃ちは、書かれていません。
        short: s1
        figure: {type: bars, title: 長篠の鉄砲の数, bars: [[信長公記（主な部隊）, 1000], [甫庵信長記, 3000]], labels: ["千挺ばかり", "三千挺"], note: 信長公記には別の部隊の五百挺もある。三段撃ちは書かれていない}
      - 語り: 3000挺と三段撃ちは、桶狭間の奇襲と同じ、江戸の初めの『甫庵信長記』が出どころです。それが明治の終わりごろ、陸軍の戦の歴史に取り入れられ、教科書に載りました。
        short: s1
        card: {head: "三段撃ち", body: "甫庵信長記と明治の戦史から"}
      - 聞き: また、その本と明治の陸軍！
        short: s1
        tone: 驚き
        figure: null
      - 語り: 数字の食い違いは、ほかにもあります。武田軍の死者は、『信長公記』では1万以上。奈良の僧の日記には、千人あまりと書かれています。
      - 聞き: 10倍もちがう……。勝った側の記録は、盛りがちなのかな。
        tone: 疑問
      - 語り: その可能性はあります。ただ、日記のほうも聞いた話で、数えている人の範囲がちがうかもしれません。
      - 語り: 武田の騎馬隊は作り話だった、と言われることもあります。でも、家康の手紙には騎馬の突撃を警戒する言葉があり、全くなかったとは言えません。
      - 語り: それから、『信長公記』には、長篠より20年あまり前、1554年の戦いで、信長が鉄砲を取り替えながら撃たせた、という記述もあります。
      - 聞き: じゃあ、三段撃ちにも、元になった話はあったってこと？
        tone: 疑問
      - 語り: 鉄砲を工夫して使った人だったのは確かです。ただ、長篠の三段撃ちという形は、後の本が作ったものでした。
      - 語り: たくさんの鉄砲と柵を、まとめて使ったこと自体に意味があった、という研究者もいます。三段撃ちがなくても、強かったのは確かです。
      - 聞き: 話を盛らなくても、十分すごかったのに。あーし、盛らない信長のほうが好きかも。
        tone: しみじみ
      - 語り: 長篠の前の年、信長は、奈良の正倉院の宝を、切り取らせていました。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 安土城と朝廷
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年の原図の写し）"}
    portrait: null
    year: 1574
    lines:
      - 語り: 切り取ったのは、蘭奢待。正倉院に伝わる名香です。
        card: {head: "1574年", body: "名香・蘭奢待を切り取る"}
      - 聞き: 国の宝を切っちゃうの？ やっぱり権威なんて気にしてないじゃん。
        tone: 疑問
      - 語り: ところが、これは天皇の許しを得て、決まった手順で行ったものです。朝廷の権威を奪う行いではなかった、と見る研究者がいます。
      - 語り: 信長は、朝廷から高い官位も受けています。1575年には右近衛大将、のちに右大臣にもなりました。
        card: {head: "1575年〜", body: "右近衛大将、のちに右大臣"}
      - 語り: 1576年からは、琵琶湖のほとりの安土に、城を築き始めます。翌年には、安土の城下町にも楽市の命令を出して、商人を集めました。
        card: {head: "1576年", body: "安土城を築き始める"}
      - 語り: 1579年に完成した天主は、地上6階、地下1階。高さは30メートルを超えたと考えられています。中には、狩野永徳の絵が描かれていました。
        card: {head: "1579年", body: "安土城の天主が完成"}
        year: 1579
      - 聞き: 30メートルって、10階建てのビルくらい？ さすが、派手さが違う。
        tone: 明るい
      - 語り: ただ、宗教に口を出さなかったわけではありません。同じ1579年、安土で浄土宗と法華宗が言い争いました。
        card: {head: "1579年", body: "安土宗論"}
      - 語り: 判定役が法華宗を負けとし、信長はそのあと、法華宗に処罰と多額の償いを命じています。
      - 聞き: それ、信長が仕組んだんじゃないの？
        tone: 疑問
      - 語り: そう見るのが主流です。茶の湯も、政治に使いました。名物と呼ばれる茶道具を集め、手柄を立てた家臣に与えたり、茶会を開くことを許したりしています。
      - 聞き: 茶碗が、ごほうびの勲章みたいになってたんだ。
        tone: 納得
      - 語り: 1581年には、京都で、何百もの騎馬を並べる大きな行列、京都御馬揃えを開きました。正親町天皇も、招かれて見物しています。
        card: {head: "1581年", body: "京都御馬揃え。天皇も見物"}
        year: 1581
        figure: {type: people, title: 信長と古い権威, nodes: [[織田信長, 天下人], [正親町天皇, 朝廷], [足利義昭, 将軍], [延暦寺, 古い寺], [宣教師, キリスト教]], edges: [[織田信長, 正親町天皇, 御所を修理・官位を受ける], [織田信長, 足利義昭, 京都へ連れ・のちに追う], [織田信長, 延暦寺, 焼き討ち], [織田信長, 宣教師, 布教を許す]]}
      - 聞き: 天皇の前で、軍の力を見せつけたってこと？
        tone: 疑問
      - 語り: 以前は、天皇に圧力をかけるためだった、と言われてきました。でも近年は、その見方は否定されつつあります。朝廷の側から、開いてほしいと望んだ、という研究もあるんです。
      - 語り: そして本能寺の変の直前には、朝廷から、太政大臣、関白、将軍のどれかに、という話まで持ち上がっていました。信長がどう答えるつもりだったのかは、分かっていません。
        figure: null
      - 聞き: 朝廷を壊すんじゃなくて、外から支えて、力をもらう人だったんだ。
        tone: 納得
      - 語り: そう言えそうです。そして、1582年がやってきます。
        hook: true

