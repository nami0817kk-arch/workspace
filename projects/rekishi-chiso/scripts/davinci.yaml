terms:
  庶子: 結婚していない両親のあいだに生まれた子
  公証人: 契約書などの文書を作る、法律の専門職
  聖ルカ組合: フィレンツェの画家たちの同業組合
  素描: 色を塗らない、線で描いた下絵や絵
  フレスコ: 湿った漆喰の壁に、水で溶いた絵の具で描く技法
  テンペラ: 卵などを混ぜた絵の具。乾いた壁にも描ける
  手稿: 手で書かれた原稿。レオナルドのノートの総称
  鏡文字: 鏡に映したように、左右が逆になった文字
  万能の人: ルネサンスの理想の人物像を表す言葉

