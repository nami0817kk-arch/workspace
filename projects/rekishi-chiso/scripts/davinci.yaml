thumbnail:
  layout: scene
  image: paintings/davinci_lastsupper.jpg
  crop: [0, 0, 1778, 1000]
  name: レオナルド・ダ・ヴィンチ
  lead: 47年で描いた絵は
  main: 約20点

sections:
  # ---------------------------------------------------------------- 1 導入
  - title: 1519年 レオナルドが残した、約20点の絵と数千ページのノート
    background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
    year: 1519
    lines:
      - 語り: レオナルド・ダ・ヴィンチが描いて、今に残る絵は、作品表の数え方で《およそ20点》。画家として働いた約47年で、2年あまりに1点です。一方、書き残したノートは、数千ページを超えます。
        portrait: {image: paintings/davinci_selfportrait.jpg, caption: "自画像とされる素描（1510年代、トリノ王立図書館蔵）", age: false}
        card: {head: 現存する絵は約20点, body: 約47年で、2年あまりに1点}
        tone: 重い
        short: s1
      - 聞き: え、47年で20点なの？ あんなに有名な人なのに、全部でそれだけ？
        tone: 驚き
        short: s1
      - 語り: 数えているのは、作品表にある板やカンバスの絵です。共作も含みます。壁画は、別に2点。完成していない絵は、そのうちの5点です。
        portrait: null
        background: {image: paintings/davinci_adoration_magi.jpg, credit: "レオナルド・ダ・ヴィンチ《東方三博士の礼拝》1481年ごろ（未完。フィレンツェ、ウフィツィ美術館。「約20点」は作品表の数え方）"}
        card: {head: 未完の絵は5点, body: 壁画は別に2点}
        short: s1
      - 聞き: 完成してない絵が、5点もあるの？ 有名な絵って、どれも完成してるものだと思ってた。
        short: s1
      - 語り: 今日掘るのは、この人です。画家か、発明家か。そう問われてきました。その像のどこまでが当時の記録で、どこからが後の時代の話か。生まれから順に、層を分けて見ていきます。
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、ミラノ、アンブロジアーナ図書館蔵）"}
      - 聞き: 天才、ってイメージしかないや。あーしが知ってるのは、モナ・リザと、ヘリコプターみたいな絵くらい。
      - 語り: そのモナ・リザも、ヘリコプターのような機械の絵も、あとで出てきます。まずは、花の都の西にある、ヴィンチ村から。
        background: {image: paintings/davinci_arno_landscape_1473.jpg, credit: "レオナルド・ダ・ヴィンチ《アルノ川の谷》の素描（1473年、ウフィツィ美術館蔵）"}
      - 聞き: 村の名前が、そのまま名前になってるんだね。「ヴィンチ出身のレオナルド」ってことか。

  # ---------------------------------------------------------------- 2 生まれと工房
  - title: 1452年 ヴィンチ村に生まれた庶子、ヴェロッキオの工房へ
    background: {image: paintings/davinci_arno_landscape_1473.jpg, credit: "レオナルド・ダ・ヴィンチ《アルノ川の谷》の素描（1473年、ウフィツィ美術館蔵）"}
    year: 1452
    lines:
      - 語り: 1452年4月15日、レオナルドは、トスカーナのヴィンチ村、またはその近くで生まれました。伝わる生地はアンキアーノという場所ですが、はっきりしません。
        card: {head: 1452年4月15日, body: ヴィンチ村かその近くで生まれる}
        figure: {type: map, title: レオナルドの生まれた土地, bounds: [10.2, 12.2, 43.2, 44.3], places: [[ヴィンチ, 10.92, 43.79], [フィレンツェ, 11.25, 43.77]], note: 村は、フィレンツェの西およそ35km}
      - 語り: 父は、フィレンツェの公証人、ピエロです。母は、身分の低いカテリーナ。二人は結婚しておらず、レオナルドは庶子でした。
        figure: null
        card: {head: 庶子, body: 父は公証人のピエロ。母はカテリーナ}
      - 聞き: 庶子って、正式な跡継ぎじゃない子ってことだよね。それって、進む道にも関わるの？
        tone: 疑問
      - 語り: 記録からは、そこまでは決めきれません。分かっているのは、14歳ごろ、フィレンツェの画家ヴェロッキオの工房に入った、ということです。
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 14歳ごろ, body: ヴェロッキオの工房に入る}
      - 聞き: 14歳で、もう弟子入りか。今でいえば、中学生が職人の工房に入る感じだね。
      - 語り: 工房は、絵のほかに、彫刻や金属細工も引き受ける場所でした。レオナルドは、約7年のあいだ、ここで修業した、とされます。
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
      - 聞き: 絵だけじゃなくて、彫刻とかも習えたのか。総合的に、ものづくりを学ぶ学校みたいな場所だね。
      - 語り: 20歳のとき、画家の組合、聖ルカ組合に名前が載ります。日付のある最古の作品は、その翌年の、アルノ川の谷を描いた素描です。
        year: 1472
        background: {image: paintings/davinci_arno_landscape_1473.jpg, credit: "レオナルド・ダ・ヴィンチ《アルノ川の谷》の素描（1473年、ウフィツィ美術館蔵）"}
        card: {head: 1472年, body: 聖ルカ組合に名前が載る（20歳）}
      - 聞き: 20歳で、もう一人前の画家として認められたのか。
      - 語り: このころの師匠の作品『キリストの洗礼』には、レオナルドが関わったとみられています。ヴァザーリは、弟子の描いた天使があまりに見事で、ヴェロッキオは絵筆を折った、と書きました。
        year: 1475
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 『キリストの洗礼』, body: 天使の一部をレオナルドが描いたとみられる}
      - 聞き: 弟子の絵がうますぎて、先生が筆を置いた？ なんか、出来すぎた話だね。
      - 語り: 研究者も、この話は作り話とみています。ヴァザーリが本を出したのは、レオナルドの死の31年あとです。逸話の多くは、この本が出どころです。
        year: 1550
        portrait: {image: paintings/davinci_vasari_portrait.jpg, caption: "ジョルジョ・ヴァザーリ（ヤコポ・ズッキ作とされる肖像、16世紀）", age: false}
        card: {head: 後世の話, body: ヴァザーリの『列伝』は1550年の書}
      - 聞き: 死んで30年以上たってから書かれた本か。そこから出た話は、少し割り引いて聞いたほうがよさそう。
      - 語り: 画家として歩きはじめた20代の記録は、多くありません。そして30歳のとき、フィレンツェを離れます。行き先は、ミラノでした。
        portrait: null
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        year: 1482
        hook: true
      - 聞き: 30歳で、新しい町に移るのか。何をしに行ったんだろう。
        hook: true

  # ---------------------------------------------------------------- 3 ミラノ
  - title: 1482年 ミラノのスフォルツァ家へ、10項目の売り込みの手紙
    background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
    year: 1482
    lines:
      - 語り: 1482年ごろ、30歳のレオナルドは、ミラノの支配者、ルドヴィーコ・スフォルツァに仕えます。あだ名は、イル・モーロ。仕えるにあたって、売り込みの手紙を書きました。
        card: {head: 1482年ごろ, body: 手紙の年は諸説。ミラノ公へ売り込み}
        short: s3
      - 聞き: 就職のときの手紙ってこと？ 履歴書みたいなやつだよね。画家として売り込んだのかな。
        tone: 疑問
      - 語り: 手紙は、10の項目でできています。うち《9項目》は、橋に大砲、攻城の道具、戦車のような車。戦争と土木の技術です。
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）。手紙のページではありません"}
        figure: {type: bars, title: 売り込みの手紙の10項目, bars: [[戦争と土木の技術, 9], [平時の建築・彫刻・絵, 1]], labels: ["9項目", "1項目"]}
        short: s3
      - 聞き: 画家って言うと思ったのに。ほぼ、技術者の手紙じゃん。デザイナー志望なのに、エンジニアの経歴ばっかり書いた履歴書みたいだね。
      - 語り: 最後の10項目めは、平時の仕事です。建築や水路、大理石や青銅の彫刻、そして絵。絵なら、どんな画家にも引けを取らない、という趣旨が書かれています。
        figure: null
        short: s3
      - 聞き: 平時の仕事は、最後にまとめて書いたのか。絵は、その中の一つなんだね。
      - 語り: ただし、残っているのは本人の筆跡ではなく、下書きの写しです。実際に送られたのかは、分かっていません。
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        card: {head: 手紙の写し, body: 本人の筆跡ではなく、送ったかも不明}
      - 聞き: 送ったかどうかも、分からないのか。それでも、ミラノで仕事は見つかったの？
      - 語り: ミラノの宮廷では、祝いの山車や舞台の演出も手がけた、とされます。ミラノ大聖堂のドームの設計競技にも関わりました。
        card: {head: ミラノの宮廷, body: 山車や演出、大聖堂の設計競技}
      - 聞き: 画家っていうより、宮廷の何でも屋さんって感じ。
      - 語り: レオナルドは、そこから17年間、ミラノで働きます。絵では、1483年に『岩窟の聖母』を契約します。岩の洞窟に、聖母子と幼い洗礼者ヨハネ、天使がいる絵です。
        year: 1483
        portrait: {image: paintings/davinci_rocks_louvre.jpg, caption: "レオナルド・ダ・ヴィンチ《岩窟の聖母》1483〜86年ごろ（ルーヴル美術館蔵）", age: false}
        background: {image: paintings/davinci_arno_landscape_1473.jpg, credit: "レオナルド・ダ・ヴィンチ《アルノ川の谷》の素描（1473年、ウフィツィ美術館蔵）"}
        card: {head: 1483年, body: 『岩窟の聖母』を契約する}
      - 聞き: 暗い洞窟の絵だよね。2枚あるって聞いたことあるけど、どうして？
      - 語り: 依頼した信心会との、報酬をめぐる争いが長引き、のちに別の版が描かれた、と説明されます。ルーヴルの版と、ロンドンの版です。
        portrait: {image: paintings/davinci_rocks_london.jpg, caption: "レオナルド・ダ・ヴィンチ《岩窟の聖母》1491年ごろ〜1508年（ロンドン、ナショナル・ギャラリー蔵）", age: false}
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        card: {head: 2枚の『岩窟の聖母』, body: ルーヴル版とロンドン版}
      - 聞き: 同じ絵が2枚あるなら、「約20点」の数え方も、ちょっと難しそうだね。
      - 語り: やがて、巨大な騎馬像のために集めた青銅が、大砲づくりに回されます。馬の像は、実現しませんでした。
        portrait: null
        year: 1494
        background: {image: paintings/davinci_horse_studies.jpg, credit: "レオナルド・ダ・ヴィンチ《馬の習作》（1490年代、ウィンザー城王室コレクション蔵）"}
        card: {head: 1494年, body: 騎馬像の青銅が大砲に回される}
      - 聞き: 像より大砲が先なのか。この時代は、戦争がなによりも優先だったのかな。
      - 語り: ミラノに来て10年以上たったころ、修道院から、食堂の壁に絵を描く仕事が舞い込みます。これが、のちに世界一有名な壁画のひとつになりました。
        year: 1495
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        hook: true
      - 聞き: 食堂の壁に描いたの？ 紙とか板じゃなくて？
        hook: true

  # ---------------------------------------------------------------- 4 最後の晩餐
  - title: 1495年 ミラノの食堂の壁に描いた『最後の晩餐』
    background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
    year: 1495
    lines:
      - 語り: 場所は、サンタ・マリア・デッレ・グラツィエ修道院の食堂です。依頼主は、ルドヴィーコ。縦約4.6メートル、横約8.8メートル。食堂の壁いっぱいの大きさです。
        card: {head: 1495〜98年, body: 食堂の壁に描いた『最後の晩餐』}
      - 聞き: 横が9メートル近いのか。教室の黒板より、ずっと大きいね。
      - 語り: 場面は、キリストが「弟子の中に、私を裏切る者がいる」と告げた直後です。12人の弟子の反応が、一人ひとり違うように描かれます。
        background: {image: paintings/davinci_lastsupper_morghen.jpg, credit: "ラファエロ・モルゲン《最後の晩餐》の版画（1800年、レオナルドの絵を写したもの）"}
      - 聞き: 驚いてる顔とか、手の動きが、みんなばらばらだよね。12人いるのに、同じ反応が一つもない感じ。
      - 語り: 『最後の晩餐』で、レオナルドは技法に特徴を出します。ふつうの壁画は、湿った漆喰に描くフレスコです。レオナルドは、乾いた壁に、テンペラなどで描く方法を選びました。
        background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
        short: s2
      - 聞き: 乾いた壁に描くと、何がちがうの？
        short: s2
      - 語り: 時間をかけて、何度も描き直せます。その代わり、絵の具が壁に定着しにくく、湿気に弱くなりました。
        short: s2
      - 語り: 完成は1498年。それから《約19年後》の、1517年には、もう絵の具が剥がれた、という記録があります。
        year: 1498
        background: {image: paintings/davinci_lastsupper_morghen.jpg, credit: "ラファエロ・モルゲン《最後の晩餐》の版画（1800年、レオナルドの絵を写したもの）"}
        card: {head: 1517年, body: 完成の約19年後に、剥がれの記録}
        figure: {type: numberline, title: 『最後の晩餐』が傷んでいく年表, items: [[完成, 1498], [剥がれの記録, 1517], [ヴァザーリの記述, 1556], [扉を切り抜く, 1652]], unit: 年, focus: 剥がれの記録, note: 完成の約19年後}
        short: s2
      - 聞き: 完成して20年もたたないうちに、もう傷んでたの？
        short: s2
      - 語り: その約40年後、ヴァザーリは「しみの寄せ集め」と書きました。完成の約150年後には、食堂の出入り口が、絵の下を切り抜いて作られ、のちに塞がれます。
        figure: null
        background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
        year: 1652
        card: {head: 1652年, body: 絵の下を切り抜いて扉が作られる}
      - 聞き: 絵の下に、ドアを開けたの？ ひどい。
      - 語り: さらに約140年後、フランス革命のころの兵が、絵にいたずらをした、とされます。
        card: {head: 兵のいたずら, body: 革命のころの兵が絵を傷つけたとされる}
      - 聞き: 名画なのに、いたずらまでされたのか。ひどい話だね。
      - 語り: 第二次世界大戦のさなかの8月15日、連合軍の爆撃で、食堂が被弾します。絵は、砂袋で守られていました。壁の絵は、残りました。
        year: 1943
        background: {image: paintings/davinci_lastsupper_morghen.jpg, credit: "ラファエロ・モルゲン《最後の晩餐》の版画（1800年、レオナルドの絵を写したもの）"}
        card: {head: 1943年8月15日, body: 爆撃で食堂が被弾。絵は砂袋で守られた}
      - 聞き: 食堂が被弾したのに、絵は残ったのか。砂袋で守る手間をかけた人がいたってことだよね。
      - 語り: 修復は、20世紀の終わりまで、21年かかりました。レオナルドが描いたのは、約3年です。直すほうが、描いた時間の《7倍》です。
        year: 1999
        background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
        figure: {type: bars, title: 描いた年数と、直した年数, bars: [[描いた（1495〜98年）, 3], [直した（1978〜99年）, 21]], labels: ["約3年", "21年"]}
      - 聞き: 描くより、直すほうが7倍も長いんだ。じゃあ、今の絵って、どこまで本人の筆なんだろう。
        tone: 疑問
      - 語り: 修復では、のちの加筆や汚れを取り除きました。失われた部分の手がかりには、ミラノの画家ジャンピエトリーノが、レオナルドの死の翌年ごろに描いた模写が使われています。
        figure: null
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        detail: {image: paintings/davinci_giampietrino_copy.jpg, box: [0.0, 0.0, 1.0, 1.0], label: ジャンピエトリーノの模写の全景}
        card: {head: 1520年ごろの模写, body: 修復の手がかりになった}
      - 聞き: 模写がなかったら、元の姿はもっと分からなかったかもしれないね。近くにいた画家の仕事が、あとで効いたね。
        detail: {image: paintings/davinci_giampietrino_copy.jpg, box: [0.0, 0.0, 1.0, 1.0], label: ジャンピエトリーノの模写の全景}
      - 語り: ミラノの暮らしは、フランス軍の侵攻で終わります。ルドヴィーコは失脚し、レオナルドは、ミラノを去りました。向かう先は、フィレンツェです。
        year: 1499
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        hook: true
      - 聞き: 17年もいたミラノを、離れちゃうのか。
        hook: true

  # ---------------------------------------------------------------- 5 フィレンツェとモナ・リザ
  - title: 1500年 フィレンツェへ戻り、アンギアーリの戦いとモナ・リザ
    background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
    year: 1500
    lines:
      - 語り: 1500年、レオナルドは、ヴェネツィアを経て、フィレンツェに戻ります。1503年ごろ、共和国の政庁の大会議の間に、『アンギアーリの戦い』の壁画を描く仕事を受けました。
        card: {head: 1503年ごろ, body: 『アンギアーリの戦い』の依頼を受ける}
      - 語り: 向かいの壁を担当する予定だったのは、まだ20代のミケランジェロです。二人の競い合いは、よく語られます。確かなのは、同じ広間の向かい合う壁の計画だった、という点です。
        background: {image: paintings/davinci_anghiari_rubens.jpg, credit: "ルーベンスによる《アンギアーリの戦い》の模写（ルーヴル美術館蔵、17世紀）"}
      - 聞き: ミケランジェロと、向かい合わせなの？二人が並んだら、見に行きたくなっちゃう。
      - 語り: けれど、レオナルドの壁画は、技法がうまくいかず、未完のまま失われます。ミケランジェロの側も未完でした。今は、ルーベンスの模写などで、構図が知られるだけです。
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
        card: {head: 『アンギアーリの戦い』, body: 未完のまま、いまは残っていない}
      - 聞き: 描いたのに、消えちゃったの？ 「約20点」にも入ってないよね。完成してたら、すごい名場面だったかもしれないのに、もったいないや。
      - 語り: 同じころ、レオナルドは、一人の女性の肖像を描いていました。1503年10月、アゴスティーノ・ヴェスプッチという人が、キケロの本の余白に、一文を書き込みます。
        year: 1503
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 1503年10月, body: ヴェスプッチが本の余白に書き込む}
      - 語り: レオナルドが、リザ・デル・ジョコンドの肖像を描いている。そういう趣旨の書き込みです。ハイデルベルク大学の研究者が見つけたのは、21世紀に入ってからでした。
        portrait: {image: paintings/davinci_monalisa.jpg, caption: "レオナルド・ダ・ヴィンチ《モナ・リザ》1503〜06年ごろ（ルーヴル美術館蔵）", age: false}
        card: {head: 2005年に発見, body: ハイデルベルク大学が書き込みを見つけた}
      - 聞き: え、見つかったの、21世紀なの？ つい最近じゃん。
        tone: 驚き
      - 語り: これが、モナ・リザについての、同じ時代の数少ない記録です。ヴァザーリが本に書いたのは、その47年あとになります。
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
      - 聞き: 書き込み1つで、あの絵の話が裏づけられたってこと？ でも、それがルーヴルの絵と同じ絵だって、言い切れるの？
        tone: 疑問
      - 語り: そこです。ルーヴルの研究者も、絶対に確実とは言えない、と述べています。描いた時期も、1503年から1506年ごろという見方から、1517年ごろまで、研究者で推定が割れます。
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 制作年とモデル, body: 研究者で見方が割れる}
      - 聞き: 描いた時期も、モデルも、はっきりしないのか。有名なのに、分からないことだらけだね。
      - 語り: リザは、フィレンツェの生まれです。15歳のころ、布と絹の商人、フランチェスコ・デル・ジョコンドの妻になりました。
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
        card: {head: リザ・デル・ジョコンド, body: 絹商人フランチェスコの妻}
      - 語り: 『ラ・ジョコンダ』は、その夫の姓の女性形です。フランスでは、『ラ・ジョコンド』と呼ばれます。
      - 聞き: ジョコンドって、旦那さんの名字だったのか。作品名だと思ってた。
      - 語り: 夫は、1503年に新しい家を買っていて、その祝いに肖像を頼んだ、と考えられています。
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 1503年, body: 夫が新しい家を買う。依頼の祝いか}
      - 聞き: 家を買ったお祝いに、肖像画か。今でいえば、新居の記念写真みたいなものかな。
      - 語り: しかも、ヴァザーリは、4年かけても未完のままだった、と書いています。いま「約20点」の中で、未完に数えられるのは5点。モナ・リザも、未完と言われる1点です。
        portrait: null
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
        figure: {type: stats, title: レオナルドの絵の数, items: [[現存する絵, "約20点", 板とカンバス], [うち未完, "5点", モナ・リザを含む], [描いた期間, "約47年", 2年あまりに1点]]}
      - 聞き: 20点のうち5点が未完で、2年ちょっとに1点か。……じゃあ、残りの時間は、何をしてたの？
        tone: 疑問
        hook: true
      - 語り: 絵を描かない時間に、レオナルドが何をしていたのか。その答えは、ノートに残っています。
        figure: null
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        hook: true

  # ---------------------------------------------------------------- 6 ノート
  - title: 1489年ごろから ノートの鏡文字・解剖図・飛行機械
    background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
    year: 1489
    lines:
      - 語り: レオナルドのノートは、多くが、鏡に映したような、右から左への文字で書かれています。鏡文字です。
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        detail: {box: [0.0, 0.1, 0.55, 0.95], label: レスター手稿の文字の部分}
        card: {head: 鏡文字, body: 多くのノートが右から左へ書かれている}
      - 聞き: 暗号みたいなやつ？ 秘密の文字なのかな。
        detail: {box: [0.45, 0.1, 1.0, 0.95], label: レスター手稿の文字と図}
        tone: 疑問
      - 語り: 秘密にするためだった、と言い切れる材料はありません。レオナルドは左利きで、右から左へ書くほうが、書きやすかったと考えられています。
        background: {image: paintings/davinci_fetus.jpg, credit: "レオナルド・ダ・ヴィンチ《子宮の中の胎児》の素描（1510年ごろ、ウィンザー城王室コレクション蔵）"}
      - 聞き: 左利きなら、ふつうに書くと、手で文字をこすっちゃうもんね。右から左へ書けば、手が汚れにくいのか。
      - 語り: ノートの量は、数え方で違い、数千から1万3千ページほどと言われます。中身は、絵の下描きだけではありません。水の流れ、岩と化石、鳥の飛び方、人体。見たものを、書き留めています。
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        card: {head: ノートの量, body: 数え方で幅があり、数千〜約1万3千ページ}
      - 聞き: 数千ページって、本にしたら何冊分になるのかな。山積みになりそう。
      - 語り: 水を中心に書いた手稿が、『レスター手稿』です。72ページ。水の動きが中心で、山で見つかる貝の化石や、月の光なども扱っています。
        card: {head: 『レスター手稿』, body: 72ページ。水が中心の手稿}
      - 聞き: 水が中心で、72ページか。ほんとに、細かく観察してたんだね。
      - 語り: 解剖でも、約240点の素描と、約1万3千語の書き付けを残しました。胎児を子宮の中で描いた素描もあります。
        background: {image: paintings/davinci_fetus.jpg, credit: "レオナルド・ダ・ヴィンチ《子宮の中の胎児》の素描（1510年ごろ、ウィンザー城王室コレクション蔵）"}
        card: {head: 解剖の素描, body: 約240点の素描と約1万3千語の書き付け}
      - 聞き: そんなに昔に、体の中まで調べて描いたのか。許されてたのかな。
      - 語り: フィレンツェのサンタ・マリア・ヌオーヴァ病院などで学んだとされます。1510年からは、解剖学者のマルカントニオ・デッラ・トッレと協力しました。
        portrait: {image: paintings/davinci_vitruvian.jpg, caption: "ウィトルウィウス的人体図（1490年ごろ、ヴェネツィア・アカデミア美術館蔵）", age: false}
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
      - 語り: 解剖した遺体の数は、資料で食い違うので、ここでは言いません。
      - 聞き: 数を言い切らないのは、はっきりしないからだね。
      - 語り: では、飛行機械です。羽ばたく翼の機械と、らせん状の空中スクリュー。ノートの設計は、1489年ごろから1505年ごろまでの時期に分かれます。
        portrait: null
        year: 1489
        background: {image: paintings/davinci_flying_machine.jpg, credit: "レオナルド・ダ・ヴィンチ《飛行機械の設計》の素描（1480〜90年代）"}
        card: {head: 飛行機械の設計, body: 羽ばたく翼と、らせん型のスクリュー}
      - 聞き: ヘリコプターの元祖でしょ！ 空を飛ぶ機械も、作ったんだよね？
      - 語り: 設計図は残っています。ところが、作って飛ばした、という記録はありません。ノートにあるのは、鳥の飛び方を観察して、設計に生かそうとした跡です。
        card: {head: 作って飛ばした記録は無い, body: 残っているのは設計と観察}
      - 聞き: 作ってない……。じゃあ、発明家って呼ばれるのは、どうして？
        tone: 疑問
      - 語り: 研究者の指摘を見ます。シエナの技師タッコラなど、先に機械の図を描いた人たちがいました。
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        card: {head: 先に描かれた原型, body: 多くの「発明」に先行する図あり}
      - 語り: マルク・ファン・デン・ブルックは、レオナルドの機械の多くに、先に描かれた原型がある、と指摘しています。
      - 聞き: 先に描いた人がいたのか。ゼロから思いついたわけじゃなくて、いろんな図を見て、組み合わせたってこと？
      - 語り: そう見る研究者がいます。そして、ノートは生きているうちに出版されませんでした。リヒターが、文章を英語の訳つきの2巻本にまとめたのは、レオナルドの死の約360年あとです。
        year: 1883
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        card: {head: 1883年, body: リヒターがノートの文章を2巻本にまとめる}
      - 聞き: 生きているうちに出さなかったんだね。それだと、同じ時代の人は、中身を知らないのかな。
      - 語り: ノートを見た人は限られました。そのため、後の科学への直接の影響は小さかった、と整理されます。水や人体の観察は先進的でしたが、広くは知られなかった、という見方です。
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        card: {head: 後の科学への影響, body: 直接の影響は小さかったと整理される}
      - 聞き: 内容はすごいのに、届かなかったのか。せっかくの観察が、しまい込まれてたんだね。
      - 語り: 生涯には、大きな節目があと1つ残っています。晩年の、アルプスを越える、フランスへの旅です。
        year: 1516
        background: {image: paintings/davinci_arno_landscape_1473.jpg, credit: "レオナルド・ダ・ヴィンチ《アルノ川の谷》の素描（1473年、ウフィツィ美術館蔵）"}
        card: {head: 晩年の旅, body: アルプスを越えてフランスへ}
        hook: true
      - 聞き: 晩年に、外国へ行ったのか。
        hook: true

  # ---------------------------------------------------------------- 7 フランスと最期
  - title: 1516年 フランスのクルー館での最期と、遺された手稿
    background: {image: paintings/davinci_amboise.jpg, credit: "アンボワーズの町と周辺（1560年の事件を描いた版画、16世紀）"}
    year: 1516
    lines:
      - 語り: 1516年、レオナルドは、フランス王フランソワ1世に招かれ、アルプスを越えます。住まいは、アンボワーズ城に近い、クルーの館でした。
        portrait: {image: paintings/davinci_francis1_clouet.jpg, caption: "フランソワ1世（ジャン・クルーエ画、1530年ごろ、ルーヴル美術館蔵）", age: false}
        card: {head: 1516年, body: フランス王に招かれ、クルーの館へ}
      - 聞き: 王様に呼ばれたの？ イタリアから、わざわざ？
      - 語り: ローマでは、教皇レオ10世のもとにいましたが、大きな依頼は多くありませんでした。そのレオナルドを、フランス王は、手元に迎えたのです。
        portrait: null
        background: {image: paintings/davinci_rome_view.png, credit: "『ニュルンベルク年代記』のローマ（1493年の版画）"}
      - 聞き: 仕事が少ないなら、王様から誘われたフランスのほうが良さそうだよね。あーしでも、行っちゃうかも。
      - 語り: 1517年10月、イタリアの枢機卿の一行が、クルーを訪ねます。随行者の旅日記には、レオナルドが、3点の絵と、解剖の手稿を見せた、と書かれています。
        year: 1517
        background: {image: paintings/davinci_amboise.jpg, credit: "アンボワーズの町と周辺（1560年の事件を描いた版画、16世紀）"}
        card: {head: 1517年10月, body: 枢機卿の一行が訪問。旅日記が残る}
      - 聞き: 3点って、どの絵？
      - 語り: フィレンツェの婦人、洗礼者ヨハネ、聖アンナの3点です。婦人は、モナ・リザだと、ルーヴルは見ています。
        portrait: {image: paintings/davinci_stanne.jpg, caption: "レオナルド・ダ・ヴィンチ《聖アンナと聖母子》1501〜19年ごろ（ルーヴル美術館蔵）", age: false}
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
      - 聞き: 3点とも、まだ手元に置いてたのか。売らずに持ってたのかな。
      - 語り: 旅日記は、右手が麻痺していたことも伝えます。それでも、素描をして、弟子に教えることはできた、とのことです。
        portrait: null
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        card: {head: 右手の麻痺, body: 1517年の旅日記が記す}
      - 聞き: 右手が動かないのに、教えてたのか。モナ・リザが未完なのは、手のせいなのかな。
        tone: 疑問
      - 語り: 麻痺が未完の理由の一つだった、という見方はあります。ただ、麻痺は1517年の記録です。モナ・リザの制作の中心は、1503年からの数年とみられ、これだけでは説明がつきません。
      - 語り: 1519年5月2日、レオナルドはクルーで亡くなります。満67歳でした。8月12日に、アンボワーズ城の教会に葬られた、とされます。
        year: 1519
        background: {image: paintings/davinci_amboise.jpg, credit: "アンボワーズの町と周辺（1560年の事件を描いた版画、16世紀）"}
        card: {head: 1519年5月2日, body: クルーで死去（満67歳）}
      - 聞き: ヴァザーリの本に、最期の場面ってあるんだっけ？
      - 語り: ヴァザーリは、王の腕の中でレオナルドが息を引き取った、と書きました。しかし、その日、王はクルーから離れたサン＝ジェルマン＝アン＝レにいた、とみられています。この場面は伝説です。
        portrait: {image: paintings/davinci_death_ingres.jpg, caption: "アングル《フランソワ1世の腕の中で死ぬレオナルド》1818年（後世の想像の絵）", age: false}
        background: {image: paintings/davinci_amboise.jpg, credit: "アンボワーズの町と周辺（1560年の事件を描いた版画、16世紀）"}
        card: {head: 王の腕の中の最期, body: ヴァザーリの記述。伝説とみられる}
      - 聞き: 画面のも、あとの時代の画家が描いた絵なんだね。有名な場面なのに、あとから作られたのか。
      - 語り: 遺言の記録が残っています。主な相続人は、弟子のフランチェスコ・メルツィ。お金に絵、道具に蔵書が渡りました。
        portrait: null
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        card: {head: 遺言, body: 相続人はメルツィ。蔵書や道具も}
      - 語り: 弟子のサライと、召使いのバティスタには、ブドウ畑が半分ずつ譲られました。
      - 聞き: サライって、どんな人？ 長く一緒にいたんだよね。
      - 語り: サライは、ミラノ時代に弟子として家に入り、約30年そばにいました。
        background: {image: paintings/davinci_milan_view.jpg, credit: "ミラノの景観（16世紀の版画）"}
        card: {head: 弟子のサライ, body: 約30年そばにいた弟子}
      - 語り: 覚え書きには、サライが泥棒で、うそつきで、頑固な食いしん坊だ、とあります。
      - 語り: 金品を持ち出されることが、何度かあっても、そばに置き続けました。
      - 聞き: 文句を書きながら、30年もそばに置いてたのか。家族みたいな関係だったのかな。
        tone: しみじみ
      - 語り: 葬儀については、遺言に、60人の貧しい人が、ろうそくを手に棺に付き添うことが記されていた、と紹介されています。
        background: {image: paintings/davinci_amboise.jpg, credit: "アンボワーズの町と周辺（1560年の事件を描いた版画、16世紀）"}
        card: {head: 葬儀の希望, body: 貧しい人60人が、ろうそくを手に付き添う}
      - 聞き: 貧しい人に付き添ってもらう、っていう希望があったのか。意外だね。
      - 語り: 手稿と素描も、メルツィに託されました。その後、手稿は散り散りになります。『アトランティコ手稿』は、ミラノのアンブロジアーナ図書館にあります。
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
        card: {head: アトランティコ手稿, body: ミラノのアンブロジアーナ図書館に所蔵}
      - 聞き: 散らばっちゃったのか。じゃあ、水の『レスター手稿』は、今どこにあるの？
        tone: 疑問
      - 語り: 民間が持つ主要な科学手稿は、このレスター手稿だけとされます。持ち主は、ビル・ゲイツです。1990年代に、ニューヨークのクリスティーズで、約3,080万ドルで落札しました。
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        year: 1994
        card: {head: 1994年11月11日, body: "約3,080万ドルで落札。当時の手稿の最高額"}
      - 語り: 72ページなので、1ページあたり約43万ドルです。
        figure: {type: stats, title: レスター手稿の値段, items: [[ページ数, "72ページ", 水が中心の手稿], [落札額, "約3,080万ドル", 1994年], [1ページあたり, "約43万ドル", 自分で数えた比べ]]}
      - 聞き: 1ページで43万ドル？ 紙1枚が、そんなにするの！
        tone: 驚き
        reaction: {number: 約43万ドル, lead: 手稿1ページあたり, say: 紙1枚で！}
      - 語り: 次に見るのは、「万能の人」という像です。その型が整ったのは、レオナルドの死の、ずっとあとでした。
        figure: null
        hook: true
      - 聞き: 万能の人って、いつ、誰が言い出したの？
        hook: true

  # ---------------------------------------------------------------- 8 万能の人とルーヴル入り
  - title: 1860年 万能の人の像と、モナ・リザのルーヴル入り
    background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
    year: 1550
    lines:
      - 語り: 「万能の人」という呼び方と型は、19世紀の整理です。その下地になった称賛を書いたのが、ヴァザーリです。
        portrait: {image: paintings/davinci_vasari_portrait.jpg, caption: "ジョルジョ・ヴァザーリ（ヤコポ・ズッキ作とされる肖像、16世紀）", age: false}
        card: {head: 万能の人, body: 呼び方と型は19世紀の整理}
      - 語り: 16世紀半ばの『列伝』は、レオナルドを、はかり知れない優雅さの人と書きました。モナ・リザの微笑みも、人間のものとは思えない、とほめています。
        card: {head: 1550年, body: ヴァザーリがレオナルドをたたえる}
      - 聞き: さっきの、死の場面を書いた人だよね。ほめ方がすごい。あーしが推しをほめるときの語彙力と、同じかも。
      - 語り: 19世紀の半ば、ブルクハルトの『イタリア・ルネサンスの文化』は、万能の人の手本として、アルベルティを挙げました。
        portrait: null
        year: 1860
        background: {image: paintings/davinci_florence_zocchi.jpg, credit: "ジュゼッペ・ザッキ（伝）《フィレンツェの景観》1744年ごろ（写真：Sailko、CC BY 3.0）"}
        card: {head: 1860年, body: ブルクハルトの『イタリア・ルネサンスの文化』}
      - 語り: レオナルドが、その典型として語られるようになったのは、このあとの時代の整理です。
      - 語り: 絵の話に戻ります。モナ・リザは、フランス王の手に渡りました。ルーヴルは、死の前年に王が買ったと説明しますが、死後とする資料もあります。
        year: 1797
        background: {image: paintings/davinci_louvre_morse_gallery.jpg, credit: "サミュエル・モース《ルーヴルのサロン・カレ》1831〜33年"}
        card: {head: 王の手に渡った時期, body: 死の前年か、死後か。資料で割れる}
      - 聞き: 買った時期まで割れてるのか。それだけ、記録が少ないってことだよね。
      - 語り: その後、フォンテーヌブロー、ヴェルサイユを経て、革命のあとから、ルーヴル美術館に飾られています。それから100年あまりのち、その絵が壁から消えます。
        background: {image: paintings/davinci_louvre_morse_gallery.jpg, credit: "サミュエル・モース《ルーヴルのサロン・カレ》1831〜33年"}
        card: {head: 1797年から, body: モナ・リザはルーヴルに常設される}
        hook: true
      - 聞き: 消えたって、盗まれたの？ 誰が、どうやって？
        hook: true

  # ---------------------------------------------------------------- 9 盗難
  - title: 1911年 モナ・リザ盗難、ルーヴルから消えた絵
    background: {image: paintings/davinci_louvre_morse_gallery.jpg, credit: "サミュエル・モース《ルーヴルのサロン・カレ》1831〜33年"}
    year: 1911
    lines:
      - 語り: 1911年8月21日、ルーヴルのモナ・リザが盗まれました。盗んだのは、ルーヴルで働いていた、ヴィンチェンツォ・ペルッジャです。絵のガラスケースの取り付けにも、関わっていました。
        portrait: {image: paintings/davinci_peruggia.jpg, caption: "ヴィンチェンツォ・ペルッジャ（1909年の写真）", age: false}
        card: {head: 1911年8月21日, body: ペルッジャがモナ・リザを盗む}
        short: s4
      - 聞き: 中の人が盗んだの？ いつ気づいたんだろう。
        short: s4
      - 語り: 気づかれたのは、翌朝でした。ルーヴルは、1週間、閉館して捜査します。
        portrait: null
        detail: {box: [0.0, 0.1, 0.55, 0.9], label: サロン・カレの一角}
        short: s4
      - 聞き: え、1週間も閉めたの？ 世界中から人が来る美術館なのに。
        detail: {box: [0.0, 0.1, 0.55, 0.9], label: サロン・カレの一角}
      - 語り: 警察の取り調べを受けた中には、詩人のアポリネールと、画家のピカソもいました。二人とも、盗難とは無関係と分かります。
        detail: {box: [0.4, 0.1, 1.0, 0.9], label: サロン・カレの別の一角}
        short: s4
      - 聞き: ピカソまで調べられたの？
        detail: {box: [0.4, 0.1, 1.0, 0.9], label: サロン・カレの別の一角}
        short: s4
      - 語り: 見つかったのは、2年あまりあとの1913年12月です。フィレンツェで、ペルッジャが、絵をウフィツィ美術館の館長に売ろうとして、捕まりました。
        detail: null
        year: 1913
        portrait: {image: paintings/davinci_peruggia_excelsior.jpg, caption: "『エクセルシオール』紙の1面（1913年12月14日。盗難の再現を伝える紙面）", age: false}
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 1913年12月, body: フィレンツェで見つかる}
      - 語り: 絵がルーヴルに戻ったのは、1914年1月4日です。
        portrait: null
        background: {image: paintings/davinci_louvre_morse_gallery.jpg, credit: "サミュエル・モース《ルーヴルのサロン・カレ》1831〜33年"}
        card: {head: 1914年1月4日, body: ルーヴルに戻る}
      - 聞き: 売ろうとして、見つかったのか。盗まれたことで、あの絵は、もっと有名になったの？ ニュースで連日取り上げられた、みたいなことだよね。
        tone: 疑問
      - 語り: 新聞が連日この事件を報じ、モナ・リザの名は、美術に詳しくない人にまで広がった、と言われます。
        portrait: {image: paintings/davinci_peruggia_excelsior.jpg, caption: "『エクセルシオール』紙の1面（1913年12月14日。盗難の再現を伝える紙面）", age: false}
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
      - 聞き: 事件が、有名になる後押しをしたんだね。
      - 語り: 名前が広がると、値打ちは桁違いになります。その極端な例が、21世紀に入って見つかった、ある小さな絵です。
        portrait: null
        year: 2005
        background: {image: paintings/davinci_lastsupper_morghen.jpg, credit: "ラファエロ・モルゲン《最後の晩餐》の版画（1800年、レオナルドの絵を写したもの）"}
        hook: true
      - 聞き: 小さな絵？ どんな絵なの？
        hook: true

  # ---------------------------------------------------------------- 10 競売
  - title: 2005年と2017年 サルバトール・ムンディの競売
    background: {image: paintings/davinci_lastsupper_morghen.jpg, credit: "ラファエロ・モルゲン《最後の晩餐》の版画（1800年、レオナルドの絵を写したもの）"}
    year: 2005
    lines:
      - 語り: サルバトール・ムンディ。救世主キリストを描いた小さな板絵が、2005年、アメリカ・ニューオーリンズの競売に、「レオナルド派の模写」として出ました。
        year: 2005
        portrait: {image: paintings/davinci_salvator.jpg, caption: "《サルバトール・ムンディ》1500年ごろ（レオナルドの作とされる）", age: false}
        card: {head: 2005年, body: 「模写」として競売に出る}
        short: s5
      - 語り: 画商たちが、1,175ドルで落札しました。
        detail: {image: paintings/davinci_salvator.jpg, box: [0.1, 0.5, 0.9, 0.97], label: 水晶玉をもつ手の部分}
        card: {head: 落札額, body: "1,175ドル"}
        short: s5
      - 聞き: 1,175ドルかあ。それが、どうなったの？
      - 語り: ニューヨーク大学で修復され、2011年からのロンドンのナショナル・ギャラリーのレオナルド展で、レオナルドの真筆として展示されました。
        background: {image: paintings/davinci_leicester.jpg, credit: "レオナルド・ダ・ヴィンチ《レスター手稿》の1枚（1506〜10年ごろ）"}
        short: s5
      - 語り: そして2017年11月15日、ニューヨークのクリスティーズで、手数料込みで4億5,030万ドルで落札されます。公開の競売での最高額です。2005年の《約38万倍》でした。
        year: 2017
        background: {image: paintings/davinci_codex_atl145.jpg, credit: "レオナルド・ダ・ヴィンチ《アトランティコ手稿》の1枚（1480年代、アンブロジアーナ図書館蔵）"}
