  # ---------------------------------------------------------------- 11 まとめ
  - title: まとめ：レオナルド・ダ・ヴィンチとは何者だったのか
    background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
    portrait: {image: paintings/davinci_selfportrait.jpg, caption: "自画像とされる素描（1510年代、トリノ王立図書館蔵）", age: false}
    year: 1519
    lines:
      - 語り: レオナルドの像は、層でできていました。1つ目は、同じ時代の記録です。契約、売り込みの手紙、1503年の書き込み、ノート。
        card: {head: 1つ目の層, body: 同じ時代の記録（手紙・契約・ノート）}
        figure: {type: people, title: レオナルドの像をつくった層, nodes: [[同じ時代の記録, 手紙・契約・ノート], [16世紀の本, ヴァザーリの列伝], [近代以降の像, 万能の人・盗難・競売]], edges: []}
      - 語り: そこから見えるのは、絵を約20点しか残さず、観察に時間を使った人の姿です。
      - 聞き: 絵は少なくて、紙は山盛りか。思ってた画家のイメージと、ずいぶん違うや。
      - 語り: 2つ目は、16世紀のヴァザーリです。ヴェロッキオが絵筆を折った話も、王の腕の中の最期も、この本の側の話でした。
        portrait: null
        background: {image: paintings/davinci_florence_catena.jpg, credit: "《カテーナの図》フィレンツェ（15世紀末の版画）"}
        card: {head: 2つ目の層, body: 16世紀の本（ヴァザーリ）}
        figure: {type: people, title: レオナルドの像をつくった層, nodes: [[同じ時代の記録, 手紙・契約・ノート], [16世紀の本, ヴァザーリの列伝], [近代以降の像, 万能の人・盗難・競売]], edges: []}
      - 聞き: 名場面って、本の側から出てくることが多いんだね。
      - 語り: 3つ目は、近代以降です。万能の人という型、1911年の盗難報道、2017年の競売。大きくなった名前が、あとから重ねられました。
        background: {image: paintings/davinci_louvre_morse_gallery.jpg, credit: "サミュエル・モース《ルーヴルのサロン・カレ》1831〜33年"}
        card: {head: 3つ目の層, body: 近代以降（万能の人・盗難・競売）}
        figure: {type: people, title: レオナルドの像をつくった層, nodes: [[同じ時代の記録, 手紙・契約・ノート], [16世紀の本, ヴァザーリの列伝], [近代以降の像, 万能の人・盗難・競売]], edges: []}
      - 聞き: 層ごとに、見えるレオナルドの顔が違うよ。
      - 語り: 冒頭の問いに戻ります。画家か、発明家か。ノートにあるのは、多くが設計と観察で、作って飛ばした記録はありません。先に描かれた機械の図を、学んで組み合わせた面もあります。
        figure: null
        background: {image: paintings/davinci_flying_machine.jpg, credit: "レオナルド・ダ・ヴィンチ《飛行機械の設計》の素描（1480〜90年代）"}
        card: {head: 冒頭の問い, body: 画家か、発明家か}
      - 語り: それでも、水や人体の観察は、当時として先進的でした。「万能の人」という肩書きは、あとの時代の言葉です。
        background: {image: paintings/davinci_fetus.jpg, credit: "レオナルド・ダ・ヴィンチ《子宮の中の胎児》の素描（1510年ごろ、ウィンザー城王室コレクション蔵）"}
      - 聞き: ゼロから作った天才とも、作ってない人とも、言い切れないね。あーしが言い直すなら、見たものを全部、確かめずにいられなかった人。完成より、知りたい気持ちが先に立つ人、かな。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
        background: {image: paintings/davinci_lastsupper.jpg, credit: "レオナルド・ダ・ヴィンチ《最後の晩餐》1495〜98年（ミラノ、サンタ・マリア・デッレ・グラツィエ修道院。修復後の現在の姿）"}
      - 聞き: 次回は、足利尊氏。室町幕府を開いた人なのに、時代によって、評価がずいぶん違うんだって。
        card: {head: 次回, body: 足利尊氏}
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
