en:
  title: "Leonardo da Vinci: About 20 Surviving Paintings in 47 Years, and Thousands of Notebook Pages"
  description: |-
    About 20 paintings by Leonardo da Vinci survive today by the count of the standard works list (it includes collaborative and disputed works, so counts vary). He worked as a painter for about 47 years, so that is roughly one painting every two years. The notebooks he left behind run to thousands of pages, though counts vary. This video digs into his life and separates what records show from what later generations added.
    We follow him from his birth in Vinci in 1452 to Verrocchio's workshop, the letter he wrote to Milan's ruler, The Last Supper and why it began to flake, the Battle of Anghiari that was lost, the mirror-written notebooks, his death at Clos Luce in 1519, the theft of the Mona Lisa in 1911, and the 2017 auction of Salvator Mundi. The image of the "universal man" grew after his death; we say plainly where sources disagree.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1519: About 20 Paintings and Thousands of Pages of Notes"
    - "1452: Born in Vinci, Apprenticed to Verrocchio"
    - "1482: Milan and the Ten-Point Letter"
    - "1495: The Last Supper on a Dry Wall"
    - "1500: Back to Florence, the Lost Battle and the Mona Lisa"
    - "1489 onward: Mirror Writing, Anatomy and Flying Machines"
    - "1516: France, Clos Luce and the Fate of the Notebooks"
    - "1860: The Universal Man and the Mona Lisa's Road to the Louvre"
    - "1911: The Mona Lisa Vanishes from the Louvre"
    - "2005 and 2017: Salvator Mundi at Auction"
    - "Summary: Who Was Leonardo da Vinci?"

