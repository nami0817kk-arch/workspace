# レオナルド・ダ・ヴィンチ（A作品・掘り下げ型・10/24 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：レオナルド・ダ・ヴィンチとは何者だったのか」）
# 冒頭の一点（自分で数えた比べ）：現存する板・カンバスの絵は約20点（ウィキペディア英語版の作品表。共作・帰属に争いのあるものを含む）。聖ルカ組合（1472）から没年（1519）まで約47年。
#   47÷20＝約2.35年に1点。うち未完は5点。書き残したノートは数え方で幅（数千〜約13,000ページ）。答えは第6節（ノート）・第8節（名声）、まとめで冒頭の問い（画家か、発明家か）に戻る。
# 事実の出どころは dev/output/rekishi-chiso/research/davinci_facts.md（確実／有力／伝承・後世／未確認の区分もそこ）。素材は research/davinci_assets.md。
# 決まり：①年は西暦。年齢は満。②使わない話（入れない）：ダ・ヴィンチ・コード系・暗号説・性的指向の推測・1476年の告発／モナ・リザ自画像説・眉毛の話／「30体解剖」などの遺体の数／
#   修道院長がユダの顔／大馬の模型が的にされた話を事実として／ヘリコプター・戦車を「発明した」と断定／購入者・所有者の人格評価／日本との接点。
#   ③後世の話（出典名を言う）：ヴェロッキオが筆を折った話（ヴァザーリ1550）／王の腕の中の最期（ヴァザーリ）／「万能の人」の像（19世紀の整理）。
#   ④割れる話は割れると言う：モナ・リザのモデルと制作年・フランソワ1世の入手の時期・サルバトール・ムンディの真贋・手稿のページ数。
#   ⑤人物のセリフは入れない（売り込みの手紙・ヴェスプッチの書き込みは趣旨だけ）。⑥背景に人物の肖像・拡大絵を使わない（モナ・リザ・貴婦人・肖像画は portrait の額に）。
#   ⑦現代の写真は使わない。1911年の新聞・写真は当時のもの。⑧B作品（昼）の内容を先取りしない。
#   読みの注意：レオナルド・ダ・ヴィンチ＝れおなるど だ う゛ぃんち／ヴェロッキオ＝べろっきお／ルドヴィーコ・スフォルツァ＝るどう゛ぃーこ すふぉるつぁ／イル・モーロ／
#     岩窟の聖母＝がんくつのせいぼ／アンギアーリ／ヴェスプッチ／ハイデルベルク／ペルッジャ／アポリネール／ウフィツィ／ヴァザーリ／ブルクハルト／フランソワ／クルー／アンボワーズ／
#     メルツィ／アトランティコ手稿＝あとらんてぃこしゅこう／レスター手稿＝れすたーしゅこう／アンブロジアーナ／ジャンピエトリーノ／タッコラ／ブヴィエ ほか。kana で全行確認。
title: レオナルド・ダ・ヴィンチ｜現存する絵は約20点、残したノートは数千ページ以上
