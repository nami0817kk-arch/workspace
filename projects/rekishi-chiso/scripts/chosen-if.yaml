en:
  title: What If Hideyoshi Had Not Invaded Korea? | 120 Camps at Nagoya and the Toyotomi Regime
  description: 'In the 8th month of Tensho 19 (1591), Toyotomi Hideyoshi announced a campaign to conquer Ming China through Korea and began building Nagoya Castle in Hizen. Around 120 daimyo camps gathered nearby, and the castle town reportedly grew past 100,000 people. This video asks: what if he had not announced the campaign?


    We keep records, theories and imagination apart. First, what the sources say: how the idea of the ''Karairi'' grew, six competing explanations of his motive, the Bunroku and Keicho campaigns (1592-1598), the failed peace talks, and what was left of the Toyotomi regime. Korea suffered heavy losses, and the figures differ widely by source; we say so rather than pick one. Then three paths that really existed: Hideyoshi''s own plan to cross the sea (stopped), Korea acting as guide (it refused), and a peace with Ming (it broke down).


    Then, clearly marked imagination with reasons: a fall evening in Osaka without the order, Kato Kiyomasa and Konishi Yukinaga in Higo, Hideyoshi and Tokugawa Ieyasu at Fushimi, a table of fates, and how Japan, Ming and Korea would differ.


    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    The accounts of theories and figures follow Wikipedia, encyclopedias and similar secondary sources; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - Nagoya Castle and a Town of 100,000
  - The Karairi Idea and Six Theories of Motive
  - '1591: Hidenaga, Rikyu, Tsurumatsu and the Order'
  - '1592: From Busan to Hanseong and Pyongyang'
  - Peace Talks, the Second Invasion and Hideyoshi's Death
  - What Was Left of the Toyotomi Regime
  - 'Other Paths in the Sources: Crossing the Sea, a Guide, Peace with Ming'
  - 'Imagination 1: Autumn in Osaka Without the Order'
  - 'Imagination 2: Kiyomasa and Yukinaga in Higo'
  - 'Imagination 3: Hideyoshi and Ieyasu at Fushimi'
  - 'Imagination 4: A Table of Fates - Who Becomes What?'
  - 'Imagination 5: How Japan, Ming and Korea Change, and the Chains to Today'
  - 'Summary: The Fork Before the Order of Tensho 19'
