sections:
- title: 天正19年8月 名護屋に築かれた城と約120の陣屋
  background:
    image: paintings/kanbei_nagoya_jinei_map.jpg
    credit: 吉村茂三郎《西肥名古屋城豊太閤陣営図》1934年（近代の絵地図）
  year: 1591
  lines:
  - 語り: 肥前の名護屋に、約120もの大名の陣屋が並びました。城下の人口は、最盛期に10万人を超えた、とされます。天正19年、秀吉が築かせた城です。
    portrait: &id001
      image: paintings/hideyoshi_portrait_date_1599.jpg
      caption: 豊臣秀吉（宇和島伊達家伝来の像、1599年）
      age: false
    card:
      head: 名護屋城
      body: 約120の陣屋・城下10万人超
    short: s1
  - 語り: 目的は、明の征服をめざしたという、唐入りです。『松浦古事記』は、名護屋に集まった兵を10万2千余と記します。ただ、数字は資料でばらつきます。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    short: s1
  - 聞き: 10万人って、ひとつの都市ぶんだよね……。名護屋って、名古屋じゃなくて、佐賀県の唐津のほうだよね。
    tone: しみじみ
    short: s1
  - 語り: 天正19年8月、秀吉は、諸大名に遠征の決意を発表します。8月23日とされます。名護屋の築城も、このころ始まりました。
    portrait: null
    background:
      image: paintings/kanbei_nagoya_castle_plan.jpg
      credit: 《諸国古城之図 名護屋》江戸時代（浅野文庫）
    card:
      head: 天正19年8月
      body: 遠征の決意を発表し、築城を始める
  - 語り: では、今日の仮定です。ひとつだけ。天正19年8月、秀吉は唐入りを布告せず、名護屋城も築かない。そのとき、豊臣政権と大名たちは、どうなったのでしょう。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: 今日の仮定
      body: 唐入りを布告せず、名護屋城も築かない
  - 聞き: えっ、あの大きな城が、そもそも無かったってこと？
    tone: 驚き
  - 語り: 問いは3つ。豊臣政権は、持ちこたえたのか。大名たちは、何を失わずに済んだのか。朝鮮と明は、どうなったのか。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 今日の3つの問い
      body: 豊臣は？ 大名は？ 朝鮮と明は？
  - 語り: 先に、お断りです。朝鮮の人々にも、大きな犠牲が出ました。数字は史料で割れます。出兵しなかった場合を論じた学術研究は、今回の調査では見つかりませんでした。
    background:
      image: paintings/chosen_map_korea_northwest.jpg
      credit: 《彼我両界万里一覧之図》朝鮮北西部と明の境の古地図（18世紀）
    card:
      head: お断り
      body: 朝鮮に大きな犠牲。研究は見つからない
  - 聞き: 歴史に「もしも」はない、ってよく言うけど……じゃあ、何を材料にするの？
    tone: 疑問
  - 語り: 約束が2つ。事実と想像は分けます。想像のあいだは《ここから想像》の札を出し、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
  - 聞き: 材料は、本物だけにしてほしいな。
  - 語り: 当時の人が考えていた選択肢と、記録に残る動きだけです。まずは、唐入りの構想の始まりから、掘ります。
- title: 天正13年から19年 唐入りの構想と、動機の6つの説
  background:
    image: paintings/kanbei_korea_campaign_map.jpg
    credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
  year: 1585
  lines:
  - 語り: 唐入りの構想は、天正13年、1585年にさかのぼる、とされます。9月の書状に、唐国まで、という言葉が出ます。
    card:
      head: 天正13年（1585）
      body: 書状に「唐国まで」の語
    year: 1585
    short: s2
  - 語り: もっとも、1584年の朱印状に初めて出る、という説明もあります。初めて出る年は、割れています。
    short: s2
  - 聞き: 信長が死んで3年で、もう次の夢を見てたの？
    short: s2
  - 語り: 天正15年、対馬の宗氏に、高麗の征伐を予告します。宗氏は取りやめを願いますが、秀吉は朝鮮国王の入朝を求めました。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 天正15年（1587）
      body: 宗氏に朝鮮への出兵を予告
    year: 1587
  - 語り: 天正18年、朝鮮の通信使が京都に来ます。秀吉は国書で、明を攻める道案内、征明嚮導を命じました。朝鮮は、応じませんでした。
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 天正18年（1590）
      body: 通信使が来日。朝鮮は先導を断る
    year: 1590
  - 聞き: 道案内って、いきなり戦の手伝いをしてって話でしょ？ そりゃ、断るよ。
    tone: 疑問
  - 語り: 建前は、仮道入明。道を借りて、明に入る、という意味です。では、なぜ明をめざしたのか。動機は、一つに決まっていません。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 動機は一つに決まらない
      body: 主な説を6つ並べる
  - 語り: 1つ目は、国内統一の延長と、恩賞地の不足です。三鬼清一郎さんは、統一のあと家臣に与える土地には、限りがあった、と説明します。
    background:
      image: paintings/kanbei_nagoya_jinei_map.jpg
      credit: 吉村茂三郎《西肥名古屋城豊太閤陣営図》1934年（近代の絵地図）
    card:
      head: 動機 1
      body: 恩賞地の不足（三鬼清一郎）
    short: s2
  - 語り: 直轄領を割く以外に方法がなく、海外に所領を望む大名も、いたとされます。
    short: s2
  - 聞き: ご褒美にあげる土地が足りない、か。会社で言えば、ポストが足りない感じかな。
  - 語り: 2つ目。藤木久志さんの説です。惣無事令で、大名の私戦を止めた。そこに生まれた不満を、戦場を海に移して処理した、という見方です。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 動機 2
      body: 私戦禁止の不満を外へ（藤木久志）
    short: s2
  - 聞き: 戦を止められた兵が、行き場を失った、ってこと？ 戦で食べてる人たちだもんね。
  - 語り: 3つ目は、貿易です。明との直接取引を求めた、という説ですが、田保橋潔さんは、根拠が薄いと指摘します。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: 動機 3
      body: 貿易（根拠が薄いとの指摘）
  - 語り: 4つ目は、信長の遺志です。信長の遺志を継いで明を治める、と秀吉が語ったとされますが、信頼性は慎重に見られています。
    portrait: null
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 動機 4
      body: 信長の遺志（信頼性は慎重に）
  - 聞き: 信長の遺志、ってほんとなら、秀吉は、そのつもりだったのかもしれないね。
  - 語り: 5つ目は、功名心や征服欲。徳富蘇峰は、征服欲の発作と評しました。6つ目は、鶴松の死の憂さ晴らしですが、池内宏さんは、後世のこじつけと退けています。
    background:
      image: paintings/chosen_map_korea_northwest.jpg
      credit: 《彼我両界万里一覧之図》朝鮮北西部と明の境の古地図（18世紀）
    card:
      head: 動機 5・6
      body: 功名心・征服欲／憂さ晴らしは否定も
  - 聞き: 説が多すぎて、どれが本命か分からないね。
    tone: しみじみ
  - 語り: 決め手はありません。朝鮮が先導を断ったことに、恩賞地の問題などが重なった、という整理もあります。
  - 聞き: 構想はずっと前からあったのに、動いたのは天正19年。その年に、何があったの？
    tone: 疑問
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    hook: true
  - 語り: 天正19年は、秀吉の身の回りで、大きな出来事が続いた年です。
    hook: true
- title: 天正19年 秀長・利休・鶴松の死と、8月の布告
  background:
    image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
    credit: 《聚楽第図屏風》（三井記念美術館蔵）
  year: 1591
  lines:
  - 語り: 天正19年の正月、弟の豊臣秀長が亡くなります。2月には、千利休が切腹を命じられました。
    portrait: &id002
      image: paintings/hidenaga_portrait_shungakuin.jpg
      caption: 豊臣秀長（春岳院蔵とされる像）
      age: false
    card:
      head: 天正19年1月
      body: 弟・秀長が死去
  - 語り: そして8月5日、跡継ぎの鶴松が病死します。
    portrait: null
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 8月5日
      body: 鶴松が病死
  - 聞き: 弟も、お茶の師匠も、息子も。1年のうちに、いなくなっちゃったの……。
    tone: しみじみ
  - 語り: 8月23日、秀吉は遠征の決意を発表し、肥前に名護屋城を築き始めます。縄張りは黒田孝高。普請奉行に、黒田長政、加藤清正、小西行長らが名を連ねます。
    portrait: *id001
    background:
      image: paintings/kanbei_nagoya_castle_plan.jpg
      credit: 《諸国古城之図 名護屋》江戸時代（浅野文庫）
    card:
      head: 8月23日
      body: 遠征を発表、名護屋城の築城へ
    short: s1
  - 聞き: その年の暮れには、何があったの？
    portrait: null
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
  - 語り: 12月28日、甥の秀次が関白になり、秀吉は太閤と呼ばれます。とはいえ、全権は譲らず、秀吉が実権を握る、二元の体制でした。
    card:
      head: 12月28日
      body: 秀次が関白に。秀吉は太閤
  - 聞き: 名護屋城って、どのくらいの大きさなの？
  - 語り: 面積は約17万平方メートル。大坂城に次ぐ大きさとされます。工事は約8か月で、翌年3月に完成しました。
    portrait: null
    background:
      image: paintings/kanbei_nagoya_castle_plan.jpg
      credit: 《諸国古城之図 名護屋》江戸時代（浅野文庫）
    figure:
      type: stats
      title: 名護屋城の規模（資料でばらつく）
      items:
      - - 名護屋城
        - 約17万㎡
        - 大坂城に次ぐ規模とされる
      - - 大名の陣屋
        - 約120
        - 確認は118か所とも
      - - 城下の人口
        - 10万人超
        - 最盛期。数字は幅あり
  - 聞き: 8か月で、大坂城に次ぐ大きさって、すごい動員だね。
  - 語り: 動員の基準も出ます。九州の大名は、知行100石につき5人から6人など、資料で割れます。10万石なら、5,000人から6,000人です。
    background:
      image: paintings/kanbei_nagoya_jinei_map.jpg
      credit: 吉村茂三郎《西肥名古屋城豊太閤陣営図》1934年（近代の絵地図）
    card:
      head: 軍役の基準
      body: 100石につき5〜6人。資料で割れる
    figure: null
  - 聞き: 10万石の大名で、5,000人から6,000人？ 家臣団がまるごと、動くってことだよね。
    tone: 驚き
  - 語り: 文禄の役の日本軍は、通説で15万8,700人。ただ、実数は定数の8割ほどで、人夫や水夫など、戦わない人を含む、という見方もあります。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    figure:
      type: bars
      title: 文禄の役の陣立（隊ごとの定数）
      bars:
      - - 一番隊
        - 18700
      - - 二番隊
        - 22800
      - - 三番隊
        - 11000
      - - 四番隊
        - 14000
      - - 五番隊
        - 25100
      - - 六番隊
        - 15700
      labels:
      - 18,700
      - 22,800
      - 11,000
      - 14,000
      - 25,100
      - 15,700
  - 聞き: これだけの人が、海を渡るのか。それで、朝鮮で何が起きたの？
    tone: 疑問
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    figure: null
    hook: true
  - 語り: 戦いの経過を、日付で追います。
    hook: true
- title: 天正20年4月 釜山上陸から漢城、平壌へ
  background:
    image: paintings/kanbei_korea_campaign_map.jpg
    credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
  year: 1592
  lines:
  - 語り: 天正20年、文禄元年の4月13日。宗義智と小西行長の一番隊が、釜山を攻め落とします。15日には東萊城。東萊府使の宋象賢は、戦死しました。
    background:
      image: paintings/chosen_busanjin_1592.jpg
      credit: 《釜山鎮殉節図》江戸時代（朝鮮の絵）
    card:
      head: 4月13日
      body: 釜山に上陸、15日に東萊城
    figure:
      type: map
      title: 文禄の役の主な場所
      bounds:
      - 124.5
      - 131.0
      - 32.6
      - 39.8
      places:
      - - 名護屋
        - 129.87
        - 33.53
      - - 釜山
        - 129.04
        - 35.1
      - - 蔚山
        - 129.32
        - 35.54
      - - 漢城
        - 126.98
        - 37.57
      - - 平壌
        - 125.75
        - 39.02
    short: s3
  - 聞き: 釜山って、対馬のすぐ向こうだよね。名護屋から、そのまま海を渡るの？
    tone: 疑問
    short: s3
  - 語り: はい。名護屋から海を渡ります。5月2日、漢城を占領します。3日とする資料も多くあります。加藤清正と小西行長が、一番乗りを競った、と伝わります。国王は、平壌のほうへ逃れました。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 5月2日ごろ
      body: 漢城を占領（3日とする資料も）
    figure: null
    short: s3
  - 聞き: 3週間足らずで、首都が……。
    tone: 重い
    short: s3
  - 語り: 6月には、小西行長が平壌を占領します。各地で、義兵が立ち上がりました。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 6月
      body: 平壌を占領。各地で義兵が蜂起
    short: s3
  - 語り: 海では、5月の玉浦で李舜臣の水軍が日本の輸送船団を攻撃し、7月の閑山島では日本水軍が敗れます。とはいえ、釜山の海を封鎖し続けたわけではない、という評価もあります。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 5月・7月
      body: 李舜臣の水軍が勝つ場面もあった
  - 聞き: 海で負けた場面もあったのに、まだ進めたの？
    tone: 疑問
  - 語り: 7月、明の祖承訓が平壌を攻めて敗れます。翌年の正月には、明軍が平壌を取り返し、小西軍は退きました。同じ月の碧蹄館では、日本軍が明軍を破ります。
    background:
      image: paintings/chosen_map_korea_northwest.jpg
      credit: 《彼我両界万里一覧之図》朝鮮北西部と明の境の古地図（18世紀）
    card:
      head: 文禄2年正月
      body: 平壌は明軍が奪回。碧蹄館は日本軍の勝ち
  - 聞き: 勝ったり負けたりで、どっちも押し切れなかったのかな。
    tone: しみじみ
  - 語り: 戦線は膠着し、文禄2年4月ごろ、日本軍は漢城から釜山の周りへ引き揚げます。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
  - 語り: ここで、被害に触れます。朝鮮の人々にも、大きな犠牲が出ました。兵も、民もです。数字は、史料で大きく割れます。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 被害について
      body: 朝鮮に大きな犠牲。数字は割れる
  - 聞き: 朝鮮の人たちの犠牲は、数字が割れるんだね。日本側はどうだったの？
    tone: しみじみ
  - 語り: ルイス・フロイスは、渡った約15万のうち、約5万人が亡くなったと推計します。死因の大半は、労苦、飢え、寒さ、病気でした。ただ、これも推計で、幅があります。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 日本側の推計
      body: 約5万人が死亡（フロイスの推計）
  - 聞き: 戦で亡くなるより、飢えや病気のほうが多いなんて……。
    tone: しみじみ
    hook: true
  - 語り: 休戦の交渉に、話を進めます。
    hook: true
- title: 文禄2年から慶長3年 偽りの講和、再出兵、秀吉の死
  background:
    image: paintings/chosen_map_korea_northwest.jpg
    credit: 《彼我両界万里一覧之図》朝鮮北西部と明の境の古地図（18世紀）
  year: 1593
  lines:
  - 語り: 小西行長は、明の沈惟敬と休戦を結びます。文禄2年4月には、講和の条件が合意されました。
    card:
      head: 休戦から講和へ
      body: 行長と沈惟敬が交渉
    year: 1593
  - 語り: 一方、双方が、相手に実態を偽って報告した、とされます。秀吉には、明が降伏する、と。明には、秀吉が降伏する、と。家臣の内藤如安が、北京へ向かいました。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 講和の交渉
      body: 双方に偽って報告した、とされる
  - 聞き: え、お互いに「相手が降参した」って伝えてたの？ それ、あとでバレるやつじゃん。
    tone: 驚き
  - 語り: 文禄5年、慶長元年の9月。明の使節が来日します。国書は、秀吉を日本国王に封じる内容で、秀吉の求めた条件を含みませんでした。秀吉は激怒し、再出兵を決めます。
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 慶長元年9月
      body: 明の使節が来日。交渉は決裂
    year: 1596
  - 聞き: 日本国王って肩書をもらっても、秀吉は嬉しくなかったのかな。
  - 語り: 慶長2年、再出兵。総勢は約14万1,500人です。7月の漆川梁海戦で朝鮮水軍が大敗し、8月に南原城と全州が落ちます。9月の鳴梁海戦では、李舜臣が勝ちました。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 慶長2年（1597）
      body: 再出兵。総勢は約14万1,500人
    year: 1597
  - 聞き: 再出兵でも、十数万人が動いたの？
    tone: 驚き
  - 語り: 慶長3年8月18日、秀吉が亡くなります。62歳でした。死はしばらく伏せられ、撤兵が進められます。
    portrait: *id001
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    card:
      head: 慶長3年8月18日
      body: 秀吉が死去（62歳）
    year: 1598
  - 聞き: 死が伏せられたまま撤兵が進んだなんて……。現場の人たち、どんな気持ちだったんだろう。
    tone: しみじみ
  - 語り: 10月、五大老の命令で撤兵。諸大名は11月下旬、順に釜山から博多へ帰ります。
    portrait: null
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 慶長3年11月
      body: 諸大名が釜山から博多へ帰る
  - 聞き: この戦いは、どう終わったの？
    tone: 疑問
  - 語り: 講和は成らず、双方が勝利を主張した、と整理されます。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
  - 語り: 朝鮮では、事典の記述で、耕地が約3分の1に減り、人口も大きく減りました。景福宮などの宮殿や官庁も焼けました。連れて行かれた人の数は、2万から5万まで、説が割れます。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 朝鮮の被害
      body: 耕地は約3分の1に（事典）
  - 聞き: 胸が重い話だね。……
    tone: 重い
  - 語り: 韓国では、この戦いを、壬辰倭乱、丁酉再乱と呼びます。日本でいう、文禄・慶長の役です。呼び名にも、立場の違いが表れます。
    background:
      image: paintings/chosen_busanjin_1592.jpg
      credit: 《釜山鎮殉節図》江戸時代（朝鮮の絵）
    card:
      head: 呼び名の違い
      body: 日本＝文禄・慶長の役／韓国＝壬辰倭乱
  - 聞き: じゃあ、この戦いで、豊臣政権は、どうなったの？
    tone: 疑問
    hook: true
  - 語り: 政権に残ったものを、見ます。
    hook: true
- title: 文禄2年から慶長5年 豊臣政権に残ったもの
  background:
    image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
    credit: 《聚楽第図屏風》（三井記念美術館蔵）
  year: 1593
  lines:
  - 語り: 事典は、この大動員が、豊臣政権の「崩壊を招いた」と書きます。執筆は、三鬼清一郎さんです。
    card:
      head: 事典の評価
      body: 大動員が政権の崩壊を招いた
  - 聞き: 政権が崩れた原因は出兵だった、って、事典はそこまで書くの？
  - 語り: 西国の大名は、過大な兵役で疲れ、家臣団の分裂や内乱も起きた、とされます。一方、留守の領地では太閤検地が進み、統治が強まった面もあります。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: 西国の大名
      body: 兵役で疲れた。検地で統治は強まった
  - 語り: 1つ目は、加藤清正と小西行長です。行長は講和を進め、清正は秀吉の条件を譲れないと反発します。行長に訴えられ、三成も行長を支持して、清正は京へ戻され、謹慎しました。
    portrait: &id004
      image: paintings/kanbei_kato_kiyomasa_portrait.jpg
      caption: 加藤清正（江戸時代の肖像）
      age: false
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: 清正と行長
      body: 講和をめぐり対立。清正は謹慎
  - 聞き: 二人は、もとから仲が悪かったの？
    tone: 疑問
  - 語り: 不仲を裏づける一次史料は、出兵より前には無い、とされます。原因として、領地の境や水利、宗教の違いが挙げられます。深まったのは、1592年5月の八道国割以降、という説もあります。
    portrait: null
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 対立の時期
      body: 深まったのは出兵後とする説
  - 聞き: じゃあ、出兵がきっかけで、こじれた面もあるんだ。
  - 語り: 2つ目は、秀頼です。文禄2年8月3日、淀殿が大坂城で男の子を産みます。秀吉は57歳。名護屋で知らせを受けました。
    portrait: &id005
      image: paintings/hideyoshi_hideyori_edo.jpg
      caption: 豊臣秀頼（江戸時代の像）
      age: false
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 文禄2年8月3日
      body: 秀頼が誕生。秀吉は57歳
  - 語り: 文禄4年、秀次事件が起きます。7月8日、秀次は高野山へ。15日に切腹します。28歳でした。原因は、秀頼を溺愛したという説、三成の陰謀という説、権力闘争という説。諸説あります。
    portrait: &id007
      image: paintings/chosen_hidetsugu_single.jpg
      caption: 豊臣秀次（肖像の部分）
      age: false
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 文禄4年7月15日
      body: 秀次が切腹。原因は諸説
    short: s4
  - 語り: フロイスは、不和の理由の一つに、秀次が朝鮮出兵に加わらなかったことを挙げます。ただ、これは一つの見方です。
    portrait: null
    short: s4
  - 聞き: 戦に出なかったことまで、理由にされちゃうの？
    short: s4
  - 語り: 事件のあと、8月3日に、五大老の名で御掟が出ます。大名どうしの縁組や誓約を、勝手にしてはならない、という決まりです。
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    card:
      head: 御掟（8月3日）
      body: 縁組や誓約を勝手にしてはならない
    short: s4
  - 聞き: 縁組まで勝手に決められないなんて、大名は窮屈だったね。
    short: s4
  - 語り: もう一人、家康です。朝鮮に渡らなかった、いちばん大きな大名でした。関東は250万石。豊臣の直轄地は、222万石です。
    portrait: &id006
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 家康
      body: 朝鮮に渡らず。関東250万石
  - 聞き: 出兵に行かなかったのが、結果として得だったってこと？
    tone: 疑問
  - 語り: そうした見方があります。秀吉の死後、家康は五大老の筆頭として力を持ち、1600年、関ヶ原へ進みます。因果は一つに決められません。
    background:
      image: paintings/ieyasu_sekigahara_screen_1854_replica.jpg
      credit: 《関ヶ原合戦図屏風》（1854年の模写）
    card:
      head: 関ヶ原へ
      body: 原因は一つに決められない
  - 聞き: じゃあ、出兵をしなかったら、そのどれかは変わったの？
    tone: 疑問
    hook: true
  - 語り: その前に、史料に残る別の道を、3つ見ます。
    hook: true
- title: 天正20年 史料に残る別の道 渡海の制止・講和
  background:
    image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
    credit: 《聚楽第図屏風》（三井記念美術館蔵）
  year: 1592
  lines:
  - 語り: 別の道の、1つ目です。当時の人が実際に考えていた選択肢だけです。秀吉が自ら朝鮮へ渡る道。
    portrait: *id001
    card:
      head: 別の道 1
      body: 秀吉が自ら渡海する
    short: s5
  - 語り: これは、止められました。後陽成天皇や正親町上皇が反対し、天皇は直筆の書状で止めた、と紹介されます。出どころは一般向けの記事で、原本は確かめていません。
    portrait: null
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    short: s5
  - 聞き: 止められた人たちが、いたってこと？
    short: s5
  - 語り: 渡海については、そうです。もっとも、出兵そのものを事前に止めた確かな記録は、確かめられませんでした。家康や利家が反対した話も、裏づけを確認できていません。
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    short: s5
  - 聞き: 有名な話なのに、史料では確かめられないの？
    short: s5
  - 語り: 2つ目。朝鮮が先導を受け入れる道です。朝鮮が拒んだことを、直接のきっかけと見る論文があります。ただ、受け入れた場合の記録は、見つかりません。
    background:
      image: paintings/kanbei_korea_campaign_map.jpg
      credit: 『大日本読史地図』「文禄・慶長の役」1935年（近代の地図）
    card:
      head: 別の道 2
      body: 朝鮮が先導を受け入れる
  - 聞き: もし朝鮮が「いいですよ」って言ってたら、戦にならなかったのかな。
  - 語り: 3つ目。明との講和です。文禄2年に休戦が結ばれ、慶長元年には明の使節が来ましたが、条件の食い違いで、決裂しました。
    background:
      image: paintings/chosen_map_korea_northwest.jpg
      credit: 《彼我両界万里一覧之図》朝鮮北西部と明の境の古地図（18世紀）
    card:
      head: 別の道 3
      body: 明との講和は、近くまで行った
  - 聞き: 講和は、実際に近いところまで行ってたの？
  - 語り: 秀長が生きていれば、という話もあります。とはいえ、秀長は補佐役で、最終判断は秀吉個人に集まっていた、という見方があります。確かめようのない「もしも」です。
    portrait: *id002
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
  - 聞き: 秀長がいても、止まったとは限らないのかな。
  - 語り: そして、出兵を布告しなかった場合を、書いた史料は、見当たりません。
    portrait: null
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
  - 聞き: 史料が無いなら、どうやって考えるの？
    tone: 疑問
    hook: true
  - 語り: 当時の人の選択肢を土台に、想像で掘ります。
    hook: true
- title: 想像① 天正19年の秋 大坂城に布告は出なかった
  background:
    image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
    credit: 《聚楽第図屏風》（三井記念美術館蔵）
  year: 1591
  lines:
  - 語り: ここから先は、想像です。仮定は、ひとつだけ。天正19年8月、秀吉は唐入りを布告しません。名護屋城も築きません。
    portrait: *id001
    card:
      head: ここから想像
      body: 唐入りを布告せず、築城もしない
  - 語り: この場面も、今回の調査では、研究が見つかっていません。大事なのは、集めるはずだった大名と兵が、どうなるかです。
    portrait: null
  - 聞き: 動員が無いと、まず何が変わるの？
    tone: 疑問
  - 語り: 九州の大名への、100石につき5人から6人ほどの動員は、起きません。西国の兵と米が、国元に残ります。可能性は、高い、です。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: 高い
      body: 出兵の動員は起きない
  - 聞き: 兵が国元に残るのは、戦が無いってことだけど……その兵に食べさせるのも、大変そう。
  - 語り: ただ、問題は、残った兵に何を与えるかです。恩賞地の不足という構造は、出兵が無くても残ります。
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    card:
      head: 高い
      body: 恩賞地の不足は残る
  - 聞き: ご褒美にする土地は、増えないもんね。
  - 語り: 想像劇場、第1幕です。天正19年の秋、大坂城。秀吉と石田三成が、向き合います。
    portrait: *id001
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: 想像劇場 第1幕
      body: 天正19年秋 大坂城
    detail:
      image: paintings/hideyoshi_osaka_zu_byobu.jpg
      box:
      - 0.256
      - 0.08
      - 0.379
      - 0.8
      label: 《豊臣期大坂図屏風》の部分（大坂城のあたり）
  - 人物: 「鶴松を亡くした。唐入りは、取りやめじゃ」
    who: 秀吉想像
    portrait: *id001
  - 人物: 「承知いたしました。ですが、国元へ戻る大名たちに、何を与えます」
    who: 三成想像
    portrait: &id003
      image: paintings/ieyasu_ishida_mitsunari_portrait.jpg
      caption: 石田三成（江戸時代の肖像）
      age: false
  - 人物: 「与える土地が足りぬ、と申すか」
    who: 秀吉想像
    portrait: *id001
    detail:
      image: paintings/hideyoshi_osaka_zu_byobu.jpg
      box:
      - 0.136
      - 0.08
      - 0.254
      - 0.8
      label: 《豊臣期大坂図屏風》の部分（大坂城のあたり）
  - 人物: 「直轄の地を割くにも、限りがございます。検地で増えた分を配るほかは」
    who: 三成想像
    portrait: *id003
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
  - 人物: 「兵を国元に戻せば、米はどうなる」
    who: 秀吉想像
    portrait: *id001
  - 人物: 「兵を養う米は、増えませぬ。それゆえ、普請に出して手当を与えるのが、よろしいかと」
    who: 三成想像
    portrait: *id003
    detail:
      image: paintings/hideyoshi_osaka_zu_byobu.jpg
      box:
      - 0.256
      - 0.08
      - 0.379
      - 0.8
      label: 《豊臣期大坂図屏風》の部分（大坂城のあたり）
  - 人物: 「検地か。奥州では、この夏まで乱があった。国の隅々まで、まだ落ち着いてはおらぬ」
    who: 秀吉想像
    portrait: *id001
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
  - 人物: 「兵は、遊ばせておくより、普請や検地に使うのが上策かと」
    who: 三成想像
    portrait: *id003
  - 人物: 「よかろう。褒美の出し方は、これから考える」
    who: 秀吉想像
    portrait: *id001
  - 聞き: 戦をやめても、悩みが無くなるわけじゃないんだね。
    portrait: null
  - 語り: ここでは、秀吉が布告せず、検地や普請で当面をしのごうとする、と想像します。
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    card:
      head: ありうる
      body: 検地と普請で当面をしのぐ
  - 語り: 一方、恩賞を満たし続ける方法は、材料がありません。可能性は、ほぼ妄想、です。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: ほぼ妄想
      body: 恩賞の満たし方は材料なし
  - 聞き: 国元に戻った大名は、どうなるの？ 隣どうしの二人とか。
    tone: 疑問
    hook: true
  - 語り: 場面は、肥後に移ります。
    hook: true
- title: 想像② 天正20年の春 肥後の清正と行長
  background:
    image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
    credit: 歌川広重《諸国名所百景 肥前長崎唐船の津》（九州の景。肥後の景ではない）
  year: 1592
  lines:
  - 語り: 想像劇場、第2幕です。天正20年の春、肥後の国境。肥後の北半分を預かる加藤清正と、南半分を預かる小西行長が、顔を合わせます。
    portrait: *id004
    card:
      head: ここから想像
      body: 第2幕 天正20年春 肥後
  - 語り: 画面は、肥後ではなく、肥前長崎を描いた後世の絵です。行長の肖像は見つからず、出しません。この場面も、今回の調査では、研究が見つかっていません。
    portrait: null
    background:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      credit: 歌川広重《諸国名所百景 肥前長崎唐船の津》（九州の景。肥後の景ではない）
  - 語り: 清正は、肥後の北半分で19万5,000石。行長は、南半分で20万石あまり。隣り合う二人です。
    figure:
      type: stats
      title: 肥後を分けた二人の領地
      items:
      - - 加藤清正
        - 19万5千石
        - 肥後の北半分
      - - 小西行長
        - 20万石余
        - 肥後の南半分
  - 聞き: 隣どうしなの？ 堺の商人の子の行長と、清正が。……どうなるの？
    tone: 疑問
  - 人物: 「川の水は、毎年の取り合いだ。今年の堰の直しは、そちらも手を貸せ」
    who: 清正想像
    portrait: *id004
  - 人物: 「手を貸すとも。わが領の田にも、水は要る。損をせぬ分け方を決めよう」
    who: 行長想像
    portrait: null
    background:
      image: paintings/kanbei_nagoya_castle_plan.jpg
      credit: 《諸国古城之図 名護屋》江戸時代（浅野文庫）
  - 人物: 「宗旨は違うが、田の水に宗旨はない」
    who: 清正想像
    portrait: *id004
    detail:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      box:
      - 0.0
      - 0.3
      - 0.55
      - 0.85
      label: 広重《肥前長崎唐船の津》の部分（肥後の景ではない）
  - 人物: 「その通りじゃ。今年は戦支度が無い分、領国を固められる」
    who: 行長想像
    portrait: null
    detail:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      box:
      - 0.45
      - 0.2
      - 1.0
      - 0.8
      label: 広重《肥前長崎唐船の津》の部分（肥後の景ではない）
  - 人物: 「国の者も、田に戻れる。今年の収穫が、楽しみだ」
    who: 清正想像
    portrait: *id004
    background:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      credit: 歌川広重《諸国名所百景 肥前長崎唐船の津》（九州の景。肥後の景ではない）
  - 人物: 「収穫が済んだら、堰の普請を二人でやるとしよう」
    who: 行長想像
    portrait: null
  - 人物: 「よし。その時は、酒でも持って行こう」
    who: 清正想像
    portrait: *id004
  - 聞き: 仲良し、とまでは言えないけど、ぶつからずに済んだのかな。
    tone: しみじみ
    portrait: null
    background:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      credit: 歌川広重《諸国名所百景 肥前長崎唐船の津》（九州の景。肥後の景ではない）
  - 語り: ここでは、二人の不仲は、出兵が無ければ深まらない、と想像します。深まったのは出兵後とする説があるからです。
    background:
      image: paintings/kanbei_nagoya_byobu_arakebune.jpg
      credit: 《肥前名護屋城図屏風》（部分、桃山〜江戸初期）
    card:
      head: ありうる
      body: 清正と行長の対立は深まらない
  - 語り: ただ、領地の境や水利、宗教の違いが、出兵と関係なく残るのかは、手がかりがありません。対立が消えるのかも、分かりません。可能性は、ほぼ妄想、です。
    background:
      image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg
      credit: 歌川広重《諸国名所百景 肥前長崎唐船の津》（九州の景。肥後の景ではない）
    card:
      head: ほぼ妄想
      body: 領地の境の争いが消えるかは材料なし
  - 聞き: 隣り合う限り、もめる種は残るのかな。
  - 語り: 次に、西国全体を見ます。出兵が無ければ、渡海するはずの約15万の兵と船と米は、国元に残り、兵役の疲れも起きません。
    background:
      image: paintings/kanbei_atakebune_fleet_1593.jpg
      credit: 《1593年の九鬼嘉隆の船団》（複製、明治ごろ）
    card:
      head: 高い
      body: 出兵の兵役による疲れは起きない
  - 語り: その分の力が、何に向かうのか。それは分かりません。
    background:
      image: paintings/hideyoshi_jurakudai_3.jpg
      credit: 《聚楽古城之図》（聚楽第の平面図）
    card:
      head: ほぼ妄想
      body: 余った力の行き先は材料なし
  - 聞き: じゃあ、秀頼が生まれたら、秀次はどうなるの？
    tone: 疑問
    background:
      image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
      credit: 《聚楽第図屏風》（三井記念美術館蔵）
    hook: true
  - 語り: 場面は、数年後の伏見に移ります。
    hook: true
- title: 想像③ 文禄4年 伏見の秀吉と家康
  background:
    image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg
    credit: 《聚楽第図屏風》（三井記念美術館蔵）
  year: 1595
  lines:
  - 語り: 想像劇場、第3幕です。文禄4年の初夏、伏見。秀吉と、徳川家康が向き合います。画面は、京の都を描いた屏風です。この世界の秀吉は、名護屋に1年以上いた史実と違い、ずっと畿内にいます。
    portrait: *id001
    card:
      head: ここから想像
      body: 第3幕 文禄4年初夏 伏見
  - 語り: もう一つ、前提です。秀頼は、史実どおり、生まれたことにします。
    portrait: *id005
