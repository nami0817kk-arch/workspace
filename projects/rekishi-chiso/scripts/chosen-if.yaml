# B（歴史の転換点の if ストーリー）。型：事実（唐入り構想と動機の諸説＝分かれ道 → 文禄・慶長の役 → 豊臣政権に残ったもの）→ 史料に残る別の道（渡海の制止／朝鮮の先導／明との講和）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/chosen_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は chosen_if_assets.md。既存：hideyoshi_facts.md・scripts/hideyoshi.yaml（秀吉の生涯はA作品で扱った。ここは出兵の可否に集中する）
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の秀吉想像・三成想像・清正想像・行長想像・家康想像）
#   ③記録のセリフは本編に置かない（想像の節に記録のセリフを混ぜない）
#   同じ幕で声が重ならない：第1幕＝秀吉（白上虎太郎）と三成（雀松朱司）／第2幕＝清正（黒沢冴白）と行長（離途）／第3幕＝秀吉（白上虎太郎）と家康（麒ヶ島宗麟）
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。札の名は声に出す型を「可能性は、〜、です」に統一。事実の部分は「分かっていません」「と伝わります」を使い分ける。
# 分岐点は1つ：天正19年8月、秀吉が唐入りを布告せず、名護屋城も築かない。
# 冒頭の強い一点：名護屋に約120の陣屋・城下10万人超（数字は資料でばらつくと断る）。問いは3つ＝豊臣政権／大名／朝鮮と明。
# 被害の扱い（10-17 指示）：事実どおり抑制的に。朝鮮の人々にも大きな犠牲が出たと言い、数字は割れることを断る。耳塚・首の数・晋州城の細部・残虐な絵は使わない。評価語（侵略・征伐）は地の文に使わない。
#   韓国の呼び名（壬辰倭乱・丁酉再乱）を一度添える。日付は和暦の月日、西暦は年だけ（西暦への換算が資料でずれるため）。
# 動機の諸説：国内統一の延長＋恩賞地不足（三鬼清一郎）／私戦禁止の不満を外へ（藤木久志）／貿易／信長の遺志／功名心・征服欲／鶴松の死の憂さ晴らし（池内宏が否定）。断定しない。
# 使わない話：耳塚・鼻削ぎ・首の数／大河ドラマの血判の場面を史実として／地震加藤／虎退治／亀甲船の細部／近代の征韓論／秀吉の容貌・誇大妄想の断定。
#   家康・利家・官兵衛が出兵に反対したという話は裏づけを確認できなかったので、事実としては言わない（第6節で断る）。
# 決めた札の理由：
#   高い＝布告が無ければ動員は起きない（論理）／恩賞地に限りがある構造は残る（事典）／家康は関東250万石のまま（事実）／戦後の国交回復を要しない・朝鮮の犠牲は起きない（論理）／行長の講和交渉という役目が無い。
#   ありうる＝検地と普請で当面をしのぐ／清正と行長の対立が深まらない（深まりは八道国割以降とする説）／秀次事件の形が変わる（フロイスが不参加を理由に挙げる）／西国の力が残る／明の負担が軽くなる。
#   ほぼ妄想＝恩賞を満たし続ける方法／出兵が無い場合の関ヶ原・豊臣家の存続／秀吉の没年／事件が起きるか／領地の境の争いが消えるか。
#   研究は見つからない（正面から論じたもの）を冒頭で断り、各想像の節の頭でも断る。「秀長が生きていれば」は反実仮想で確かめようがないと第6節で断った。
# 画面の決まり：背景に人物の肖像を使わない（肖像は額）／極端に横長の絵（縦横比2.4:1以上）は使わない／縦の継ぎ目のある三枚続を全面背景にしない／NDL系の絵図（色票・定規・黒帯）は全面に敷かない／血・遺体・首の絵は使わない／
#   現代の写真（名護屋城跡など）は credit に「現在の〜」と書き、語りでもその行で断る。蔚山・東萊の絵は後世の絵と断り、拡大しない。
