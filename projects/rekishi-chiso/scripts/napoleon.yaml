        short: s9
        figure: null
      - 聞き: 言いたいことが言えない国になっちゃったんだ。
        short: s9
        tone: 重い
      - 語り: もう一つ、大きな影があります。1802年、フランスの植民地で、奴隷制を復活させたんです。
        short: s9
        card: {head: "1802年", body: "植民地で奴隷制を復活"}
