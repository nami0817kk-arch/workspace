shorts:
  s1:
    title: "ナポレオンは／背が低くなかった"
    yt_title: "ナポレオンは本当に背が低かったのか｜約168cmの真相"
    lead: "記録の「5ピエ2プス」はフランスの古い単位で、約168cm。当時のフランス人男性の平均並みか、少し高いくらいでした。"
    tags: [ナポレオン 身長, ナポレオン 背が低い, 世界史 雑学, フランス]
  s2:
    title: "「小さな伍長」は／背の話じゃない"
    yt_title: "ナポレオンのあだ名「小さな伍長」の本当の意味"
    lead: "1796年、イタリアでの戦いのあと、兵士たちが親しみを込めて付けたあだ名。身長とは関係ありませんでした。"
    tags: [小さな伍長, ナポレオン あだ名, ローディの戦い, ナポレオン]
  s3:
    title: "ナポレオン・コンプレックスは／本人と無関係"
    yt_title: "「ナポレオン・コンプレックス」はナポレオンと関係のない言葉だった"
    lead: "この言葉は、ナポレオンの死から100年ほどあとの、20世紀前半に広まった言い回し。心理学者アドラーの用語でもありません。"
    tags: [ナポレオン・コンプレックス, アドラー, 劣等感, 心理学 雑学]
  s4:
    title: "冠を／自分で頭に載せた皇帝"
    yt_title: "ナポレオンの戴冠式｜教皇の前で、冠を自分で頭に載せた"
    lead: "1804年12月2日、パリのノートルダム大聖堂。教皇が立ち会う中、ナポレオンは冠を自分の手で頭に載せました。"
    tags: [ナポレオン 戴冠式, ダヴィッド, ノートルダム大聖堂, 皇帝]
  s5:
    title: "「不可能はない」の／本当の意味"
    yt_title: "「余の辞書に不可能という文字はない」の本当の意味"
    lead: "元は部下を叱った手紙の一文。「不可能だなんて、フランス語じゃない」という意味でした。「辞書」は日本で生まれた言い回しです。"
    tags: [余の辞書に不可能はない, ナポレオン 名言, 名言 意味, 世界史 雑学]
  s6:
    title: "毒殺説は／髪の毛で否定された"
    yt_title: "ナポレオンの死因は毒殺か｜髪の毛の分析で見えたこと"
    lead: "髪から多くのヒ素が見つかり、毒殺説が広まりました。でも2008年の分析で、子どものころから量が変わらないと分かりました。"
    tags: [ナポレオン 死因, ヒ素, 毒殺説, セントヘレナ]
  s7:
    title: "ロゼッタ・ストーンを／見つけたのは誰？"
    yt_title: "ロゼッタ・ストーンを見つけたのはナポレオンではなかった"
    lead: "1799年、エジプト遠征中のフランス軍の士官が、砦の工事中に見つけました。石は今、大英博物館にあります。"
    tags: [ロゼッタ・ストーン, エジプト遠征, 大英博物館, シャンポリオン]
  s8:
    title: "賛成99％の／国民投票"
    yt_title: "ナポレオンを認めた国民投票｜賛成99％の数字は水増しだった"
    lead: "1800年の国民投票は賛成99.9％。でも実際の賛成は、発表の半分ほどだったと分かっています。"
    tags: [国民投票, ナポレオン 独裁, 統領政府, フランス史]

