sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：背の低い独裁者
    background: {image: paintings/napoleon_alps_david.jpg, credit: "ジャック＝ルイ・ダヴィッド《サン・ベルナール峠を越えるボナパルト》1801〜03年"}
    portrait: {image: paintings/napoleon_throne_ingres.jpg, caption: "ナポレオン（アングル画、1806年）"}
    year: 1804
    lines:
      - 語り: 背の低さを気にして、怒りっぽく、ヨーロッパじゅうに戦争をしかけた独裁者。そう語られてきた人物がいます。
        tone: 重い
      - 聞き: ナポレオンでしょ！ 「ナポレオン・コンプレックス」って言葉もあるし。
        tone: 明るい
      - 語り: はい。背の低い人が、負けまいと強がることを、そう呼ぶことがありますね。
      - 聞き: あーしも小さいから、ちょっと親近感あったのに。
        tone: 笑い
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: まさか、背が低いっていうのも……？
        tone: 疑問
      - 語り: ナポレオンの身長は、およそ168センチ。当時のフランスの男性の平均と同じくらいか、少し高いくらいでした。
        card: {head: "ナポレオンの身長", body: "約168センチ（当時の平均並み）"}
      - 聞き: うそでしょ！？ 普通じゃん！
        tone: 驚き
      - 語り: しかも、「ナポレオン・コンプレックス」という言葉。実は、ナポレオン本人とは、ほとんど関係のないところで生まれています。
      - 聞き: じゃあ、なんで「小男」ってことになったの？
        tone: 疑問
      - 語り: それが今日の一番の掘りどころです。もう一つ、「独裁者」のほうは、半分は本当です。そこも含めて掘っていきます。
      - 聞き: 半分？ 気になる。了解、今日はヘルメットの上にメジャーものせとく。
        tone: 笑い

  # ---------------------------------------------------------------- 2
  - title: コルシカの少年
    background: {image: paintings/napoleon_ajaccio_crop.jpg, credit: "ゴドフロワ・エンゲルマン（石版）《アジャクシオ湾の眺め》1821年"}
    portrait: null
    year: 1769
    lines:
      - 語り: 1769年8月15日、ナポレオンは、地中海に浮かぶコルシカ島で生まれました。
        card: {head: "1769年", body: "コルシカ島で生まれる"}
      - 語り: コルシカ島がフランスのものになったのは、その前の年です。それまでは、名目の上では、イタリアのジェノヴァ共和国の島でした。
      - 聞き: 1年ちがったら、フランス人じゃなかったかもしれないんだ。
        tone: 驚き
      - 語り: しかも島では、独立を目指す人々が、フランス軍と戦っていました。フランス軍が島を押さえたのは、ナポレオンが生まれる、わずか3か月前です。
      - 聞き: 生まれたとき、島はまだ戦争の直後だったんだ。
        tone: 重い
      - 語り: 家は、イタリア系の小さな貴族でした。父のカルロは、独立を率いたパオリの秘書でした。でも、フランスの島になると、フランスから来た総督と親しくなります。
      - 語り: 名前も、もとはイタリア風に、ナポレオーネ・ブオナパルテです。
      - 語り: その縁もあって、9歳のころ、フランス本土の学校に入り、まずフランス語から学びます。そして、ブリエンヌという町の、陸軍の幼年学校で学びました。
        card: {head: "1779年", body: "フランス本土の学校へ"}
        year: 1779
      - 聞き: 外国から来た子が、言葉から勉強したんだ。大変そう。
        tone: しみじみ
      - 語り: 15歳で、パリの陸軍士官学校へ。選んだのは、大砲を扱う砲兵です。
        card: {head: "1784年", body: "パリの陸軍士官学校へ"}
        year: 1784
      - 語り: 翌年、父が亡くなります。胃の病気だったとされます。
        year: 1785
      - 語り: ナポレオンは、2年かかる課程を1年で終えて、16歳で砲兵の少尉になりました。
        card: {head: "1785年", body: "16歳で砲兵少尉に"}
      - 聞き: 2年分を1年で！ 勉強はできる子だったんだ。
        tone: 納得
      - 語り: このときの試験官の一人は、数学者のラプラスだった、と言われます。
      - 聞き: 名前は聞いたことある。すごい人に見てもらってたんだ。
        tone: 納得
      - 語り: 1789年、フランス革命が起こります。古い身分の仕組みが崩れ、若い士官にも、大きく出世する道が開けていきました。
        card: {head: "1789年", body: "フランス革命"}
        year: 1789
      - 聞き: 時代が、ナポレオンに味方したんだね。あーし、ちょっとわくわくしてきた。
        tone: 明るい
      - 語り: その出世の始まりは、ある港町での、大砲の置き方でした。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 大砲で上がった若い将軍
    background: {image: paintings/napoleon_arcole_gros.jpg, credit: "アントワーヌ＝ジャン・グロ《アルコレ橋のボナパルト》1796〜97年"}
    portrait: null
    year: 1793
    lines:
      - 語り: 1793年、南フランスの港町トゥーロンは、革命に反対する人々が港を明け渡し、イギリスなどの軍に押さえられていました。
        card: {head: "1793年", body: "トゥーロン攻囲戦"}
      - 語り: ナポレオンは、大砲の置き場所を工夫して、港を取り戻します。その手柄で、24歳で将軍の一人になりました。
      - 聞き: 24歳で将軍！？ 今なら社会人2年目くらいなのに。あーし、24で何してるかな。
        tone: 驚き
      - 語り: 1795年には、パリで起きた武装した蜂起を、大砲を使って鎮めます。多くの犠牲者が出たと伝わりますが、これで政府の信頼を得ました。
        card: {head: "1795年", body: "パリの蜂起を鎮める"}
        year: 1795
      - 語り: 翌1796年、ジョゼフィーヌと結婚し、イタリア方面の軍の司令官になります。26歳でした。
        card: {head: "1796年", body: "イタリア方面軍の司令官に"}
        year: 1796
      - 聞き: 結婚して、すぐに戦場なんだ……。
        tone: しみじみ
      - 語り: イタリアでナポレオンは、オーストリア軍に次々と勝ちます。そして、この遠征の中で、ある有名なあだ名が生まれました。
        short: s2
      - 聞き: あ、知ってる。「小さな伍長」でしょ。やっぱり小さかったんじゃん。
        short: s2
        tone: 疑問
      - 語り: 1796年5月、ローディの戦いのあと、兵士たちが付けたあだ名です。司令官なのに、大砲の据え付けにまで自分で手を出した、と言われます。
        short: s2
        card: {head: "1796年5月", body: "「小さな伍長」のあだ名"}
      - 語り: 「小さな」は、背の高さではなく、親しみを込めた呼び方だった、と見られています。日本語なら、「うちのちび隊長」くらいの感じでしょうか。
        short: s2
      - 聞き: ちび隊長……。悪口じゃなくて、かわいがってたんだ。
        short: s2
        tone: 納得
      - 語り: 兵士たちに慕われる、若い司令官だったんですね。
        short: s2
      - 語り: でも、ナポレオンは、さらに遠くを見ていました。
      - 聞き: さらに遠く？
        tone: 疑問
      - 語り: 1798年、ナポレオンは、海を越えてエジプトへ向かいます。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: エジプトとクーデター
    background: {image: paintings/napoleon_sphinx_gerome.jpg, credit: "ジャン＝レオン・ジェローム《スフィンクスの前のボナパルト》1867〜68年"}
    portrait: null
    year: 1798
    lines:
      - 語り: エジプト遠征には、軍隊だけでなく、たくさんの学者や技術者もついて行きました。
        card: {head: "1798年", body: "エジプト遠征。学者も同行"}
      - 聞き: 戦争に学者？ あーし、遠足の引率みたいなの想像しちゃう。
        tone: 疑問
      - 語り: 目的は、古代の遺跡や、自然、町のようすを調べることでした。のちに、その成果は大きな本にまとめられました。
      - 聞き: 戦争しながら、調査旅行もしてたんだ。
        tone: 納得
      - 語り: ピラミッドの近くの戦いでは勝ちますが、その年の夏、海でイギリスのネルソンに艦隊を壊されてしまいます。
      - 語り: 1799年、ナイル河口の町ロゼッタの近くで、砦の工事をしていた兵士たちが、文字の刻まれた石を見つけました。
        background: {image: paintings/napoleon_rosetta_stone_1822.jpg, credit: "ロゼッタ・ストーンの図版（『エジプト誌』）1822年"}
        short: s7
        card: {head: "1799年", body: "ロゼッタの近くで石が見つかる"}
        year: 1799
      - 聞き: ロゼッタ・ストーン！ ナポレオンが見つけたんだよね。
        short: s7
        tone: 明るい
      - 語り: 見つけたのは、工事を指揮していたフランス軍の士官、ブシャールたちです。ナポレオン本人ではありません。
        short: s7
      - 語り: 石には、同じ中身が3種類の文字で刻まれていました。古代エジプトの2種類の文字と、ギリシャ語です。読めるギリシャ語を手がかりに、読めない文字が解けるかもしれない。
        short: s7
      - 聞き: 答え合わせの付いた、問題用紙みたいな石なんだ。
        short: s7
        tone: 納得
      - 語り: ところがこの石は、のちにフランス軍がイギリス軍に降伏したとき、イギリスのものになりました。今も、ロンドンの大英博物館にあります。
        short: s7
      - 聞き: 見つけたのはフランスなのに、イギリスにあるんだ。
        short: s7
        tone: 驚き
      - 語り: それでも、文字を解き明かしたのは、フランスの学者シャンポリオンでした。1822年のことです。
      - 語り: ナポレオンは、1799年の夏、軍をエジプトに残したまま、フランスへ帰ります。
      - 語り: 1799年11月、ナポレオンは、仲間と政府を倒すクーデターを起こしました。《ブリュメール18日》のクーデターです。30歳で、《第一統領》になります。
        background: {image: paintings/napoleon_first_consul_ingres.jpg, credit: "ジャン＝オーギュスト＝ドミニク・アングル《第一統領ボナパルト》1803〜04年"}
        short: s8
        card: {head: "1799年11月", body: "クーデターで第一統領に"}
      - 聞き: 軍を置いて帰って、そのまま国のトップに……。
        tone: 重い
      - 語り: ナポレオンの新しい憲法は、国民投票にかけられました。発表では、賛成がおよそ300万票、反対はわずか1500票あまり。賛成は99.9パーセントです。
        short: s8
        card: {head: "1800年", body: "国民投票で賛成99.9％"}
        year: 1800
      - 聞き: 99.9！？ みんな賛成だったんだ。
        short: s8
        tone: 納得
      - 語り: ところが、実際に賛成した人の数は、発表の半分ほど。150万票ほどが、上乗せされていたことが分かっています。
        short: s8
        card: {head: "本当の賛成", body: "約155万票（発表の半分ほど）"}
      - 聞き: 票を、倍に盛ってたの！？
        short: s8
        tone: 驚き
      - 語り: しかも、投票した人は、投票できる人の半分にも届いていませんでした。
        short: s8
      - 語り: それでも、「国民が認めた」という形をとることを、ナポレオンは大事にしました。
        short: s8
      - 聞き: 形だけでも、みんなの賛成がほしかったんだ。
        short: s8
        tone: 納得
      - 語り: 第一統領になって、わずか2か月。ナポレオンは、今も続く、ある銀行の設立を後押しします。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 皇帝と、残したもの
    background: {image: paintings/napoleon_study_david.jpg, credit: "ジャック＝ルイ・ダヴィッド《テュイルリー宮の書斎のナポレオン》1812年"}
    portrait: null
    year: 1800
    lines:
      - 語り: 1800年1月、フランス銀行がつくられます。翌月には、県ごとに国が知事を送る仕組みも始めました。どちらも、今のフランスに続いています。
        card: {head: "1800年", body: "フランス銀行・県知事の仕組み"}
      - 聞き: 今もある銀行と仕組み！？
        tone: 驚き
