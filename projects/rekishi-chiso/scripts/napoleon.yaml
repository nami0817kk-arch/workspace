sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：背の低い独裁者
    background: {image: TODO, credit: TODO}
    portrait: {image: TODO, caption: TODO}
    year: 1804
    lines:
      - 語り: 背の低さを気にして、怒りっぽく、ヨーロッパじゅうに戦争をしかけた独裁者。そう語られてきた人物がいます。
        tone: 重い
      - 聞き: ナポレオンでしょ！ 「ナポレオン・コンプレックス」って言葉もあるし。
        tone: 明るい
      - 語り: はい。背の低い人が、負けまいと強がることを、そう呼ぶことがありますね。
      - 聞き: あーしも小さいから、ちょっと親近感あったのに。
        tone: 笑い
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: まさか、背が低いっていうのも……？
        tone: 疑問
      - 語り: ナポレオンの身長は、およそ168センチ。当時のフランス人男性の平均と同じくらいか、少し高いくらいでした。
        card: {head: "ナポレオンの身長", body: "約168センチ（当時の平均並み）"}
      - 聞き: うそでしょ！？ 普通じゃん！
        tone: 驚き
      - 語り: しかも、「ナポレオン・コンプレックス」という言葉は、ナポレオンが亡くなって100年ほどあとに広まった言葉です。本人とは関係がありません。
        short: s3
      - 聞き: じゃあ、なんで「小男」ってことになったの？
        tone: 疑問
      - 語り: それが今日の一番の掘りどころです。もう一つ、「独裁者」のほうは、半分は本当です。そこも含めて掘っていきます。
      - 聞き: 半分？ 気になる。了解、今日はヘルメットの上にメジャーものせとく。
        tone: 笑い

  # ---------------------------------------------------------------- 2
  - title: コルシカの少年
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1769
    lines:
      - 語り: 1769年8月15日、ナポレオンは、地中海に浮かぶコルシカ島で生まれました。
        card: {head: "1769年", body: "コルシカ島で生まれる"}
      - 語り: コルシカ島がフランスのものになったのは、その前の年です。それまでは、イタリアのジェノヴァ共和国の島でした。
      - 聞き: 1年ちがったら、フランス人じゃなかったかもしれないんだ。
        tone: 驚き
      - 語り: 家は、イタリア系の小さな貴族でした。名前も、もとはイタリア風に、ナポレオーネ・ブオナパルテです。
      - 語り: 9歳のころ、フランス本土の学校に入り、まずフランス語から学びます。そして、ブリエンヌという町の、陸軍の幼年学校で学びました。
        card: {head: "1779年", body: "フランス本土の学校へ"}
        year: 1779
      - 聞き: 外国から来た子が、言葉から勉強したんだ。大変そう。
        tone: しみじみ
      - 語り: 15歳で、パリの陸軍士官学校へ。選んだのは、大砲を扱う砲兵です。
        card: {head: "1784年", body: "パリの陸軍士官学校へ"}
        year: 1784
      - 語り: 翌年、父が亡くなります。胃の病気でした。ナポレオンは、2年かかる課程を1年で終えて、16歳で砲兵の少尉になりました。
        card: {head: "1785年", body: "16歳で砲兵少尉に"}
        year: 1785
      - 聞き: 2年分を1年で！ 勉強はできる子だったんだ。
        tone: 納得
      - 語り: このときの試験官の一人は、数学者のラプラスだった、と言われます。
      - 聞き: 名前は聞いたことある。すごい人に見てもらってたんだ。
        tone: 疑問
      - 語り: 1789年、フランス革命が起こります。古い身分の仕組みが崩れ、若い士官にも、大きく出世する道が開けていきました。
        card: {head: "1789年", body: "フランス革命"}
        year: 1789
      - 聞き: 時代が、ナポレオンに味方したんだね。あーし、ちょっとわくわくしてきた。
        tone: 明るい
      - 語り: その出世の始まりは、ある港町での、大砲の置き方でした。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 大砲で上がった若い将軍
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1793
    lines:
      - 語り: 1793年、南フランスの港町トゥーロンは、イギリス軍に押さえられていました。
        card: {head: "1793年", body: "トゥーロン攻囲戦"}
      - 語り: ナポレオンは、大砲の置き場所を工夫して、港を取り戻します。その手柄で、24歳で将軍の一人になりました。
      - 聞き: 24歳で将軍！？ 今なら社会人2年目くらいなのに。
        tone: 驚き
      - 語り: 1795年には、パリで起きた武装した蜂起を、大砲を使って鎮めます。多くの犠牲者が出たと伝わりますが、これで政府の信頼を得ました。
        card: {head: "1795年", body: "パリの蜂起を鎮める"}
        year: 1795
      - 語り: 翌1796年、ジョゼフィーヌと結婚し、イタリア方面の軍の司令官になります。26歳でした。
        card: {head: "1796年", body: "イタリア方面軍の司令官に"}
        year: 1796
      - 聞き: 結婚して、すぐに戦場なんだ……。
        tone: しみじみ
      - 語り: イタリアでナポレオンは、オーストリア軍に次々と勝ちます。そして、この遠征の中で、ある有名なあだ名が生まれました。
        short: s2
      - 聞き: あ、知ってる。「小さな伍長」でしょ。やっぱり小さかったんじゃん。
        short: s2
        tone: 疑問
      - 語り: 1796年5月、ローディの戦いのあと、兵士たちが付けたあだ名です。司令官なのに、大砲の据え付けにまで自分で手を出した、と言われます。
        short: s2
        card: {head: "1796年5月", body: "「小さな伍長」のあだ名"}
      - 語り: 「小さな」は、背の高さではなく、親しみを込めた呼び方です。日本語なら、「うちのちび隊長」くらいの感じでしょうか。
        short: s2
      - 聞き: ちび隊長……。悪口じゃなくて、かわいがってたんだ。
        short: s2
        tone: 納得
      - 語り: 兵士たちに慕われる、若い司令官だったんですね。でも、ナポレオンは、さらに遠くを見ていました。
        short: s2
      - 聞き: さらに遠く？
        tone: 疑問
      - 語り: 1798年、ナポレオンは、海を越えてエジプトへ向かいます。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: エジプトとクーデター
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1798
    lines:
      - 語り: エジプト遠征には、軍隊だけでなく、たくさんの学者や技術者もついて行きました。
        card: {head: "1798年", body: "エジプト遠征。学者も同行"}
      - 聞き: 戦争に学者？ 何をしに行ったの？
        tone: 疑問
      - 語り: 古代の遺跡や、自然、町のようすを調べるためです。のちに、その成果は大きな本にまとめられました。
      - 聞き: 戦争しながら、調査旅行もしてたんだ。
        tone: 納得
      - 語り: ピラミッドの近くの戦いでは勝ちますが、その年の夏、海でイギリスのネルソンに艦隊を壊されてしまいます。
      - 語り: そして1799年、ナイル河口の町ロゼッタの近くで、砦の工事をしていた兵士たちが、文字の刻まれた石を見つけました。
        short: s7
        card: {head: "1799年", body: "ロゼッタ・ストーンが見つかる"}
        year: 1799
      - 聞き: ロゼッタ・ストーン！ ナポレオンが見つけたんだよね。
        short: s7
        tone: 明るい
      - 語り: 見つけたのは、工事を指揮していたフランス軍の士官、ブシャールたちです。ナポレオン本人ではありません。
        short: s7
      - 語り: しかもこの石は、のちにフランス軍がイギリス軍に降伏したとき、イギリスのものになりました。今も、ロンドンの大英博物館にあります。
        short: s7
      - 聞き: 見つけたのはフランスなのに、イギリスにあるんだ。
        short: s7
        tone: 驚き
      - 語り: 文字を解き明かしたのは、フランスの学者シャンポリオンで、1822年のことです。
        short: s7
      - 語り: ナポレオンは、1799年の夏、軍をエジプトに残したまま、フランスへ帰ります。
      - 語り: そして11月、仲間と政府を倒すクーデターを起こしました。《ブリュメール18日》のクーデターです。30歳で、《第一統領》になります。
        card: {head: "1799年11月", body: "クーデターで第一統領に"}
      - 聞き: 軍を置いて帰って、そのまま国のトップに……。
        tone: 重い
      - 語り: 新しい憲法は、国民投票にかけられました。発表では、賛成が99.9パーセント。
        short: s8
        card: {head: "1800年", body: "国民投票で賛成99.9％（発表）"}
        year: 1800
      - 聞き: 99.9！？ みんな賛成だったんだ。
        short: s8
        tone: 疑問
      - 語り: ところが、実際の賛成の数は、発表の半分ほどで、数字は水増しされていたことが分かっています。
        short: s8
      - 聞き: 選挙の数字を、盛ってたの！？
        short: s8
        tone: 驚き
      - 語り: このあとの国民投票でも、操作があったと見られています。それでも、「国民が認めた」という形をとることを、ナポレオンは大事にしました。
        short: s8
      - 聞き: 形だけでも、みんなの賛成がほしかったんだ。
        short: s8
        tone: 納得
      - 語り: その形を整えたうえで、ナポレオンは、今のフランスにまで残る仕組みを作っていきます。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 皇帝と、残したもの
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1800
    lines:
      - 語り: 1800年、フランス銀行がつくられます。同じ年、県ごとに国が知事を送る仕組みも始めました。どちらも、今のフランスに続いています。
        card: {head: "1800年", body: "フランス銀行・県知事の仕組み"}
      - 聞き: 今もある銀行と仕組み！？
        tone: 驚き
      - 語り: 1802年には、軍人だけでなく、学者や役人の手柄もたたえる勲章、《レジオン・ドヌール》を作りました。今も、フランスで最高の勲章です。
        card: {head: "1802年", body: "レジオン・ドヌール勲章"}
        year: 1802
      - 語り: そして1804年、フランスの民法典を出します。のちに《ナポレオン法典》と呼ばれるものです。
        card: {head: "1804年3月", body: "民法典（ナポレオン法典）"}
        year: 1804
      - 語り: 法の前ではみんな平等、自分の財産を持つ権利、約束を自由に結ぶ権利。こうした決まりが、ヨーロッパや中南米の国々の民法の手本になりました。
      - 聞き: 戦争だけの人だと思ってたけど、法律まで作ってたんだ。
        tone: 疑問
      - 語り: ただ、妻は夫に従う、という決まりも入っていて、今から見ると古い面もあります。
      - 聞き: そこは、さすがに時代を感じる。
        tone: 納得
      - 語り: 1804年12月2日、パリのノートルダム大聖堂で、ナポレオンは皇帝の冠を受けます。
        short: s4
        card: {head: "1804年12月2日", body: "皇帝の戴冠式"}
      - 語り: ローマから教皇も来て立ち会いました。でもナポレオンは、冠を、自分の手で頭に載せたんです。
        short: s4
      - 聞き: 教皇の前で、自分で！？ 度胸ありすぎ。
        short: s4
        tone: 驚き
      - 語り: その場面は、画家ダヴィッドの大きな絵に残されています。皇帝の力は、誰かにもらうのではなく自分のものだ、と見せたとも言われます。
        short: s4
      - 聞き: 革命で王様を倒した国で、今度は皇帝になったんだ。なんか不思議。
        short: s4
        tone: 疑問
      - 語り: ちょうど1年後の1805年12月2日、アウステルリッツの戦いで、オーストリアとロシアの軍を破ります。
        short: s4
        card: {head: "1805年", body: "アウステルリッツの戦い"}
        year: 1805
      - 聞き: 戴冠式の、ちょうど1年後に大勝利。できすぎた話みたい。
        short: s4
        tone: 笑い
      - 語り: このあともナポレオンは、1806年、1807年、1809年と、ドイツや東ヨーロッパで大きな戦いに勝ち続けます。ヨーロッパの地図は、何度も塗り替えられました。
      - 語り: 一方で、1808年からはスペインで、長く終わらない戦いが始まります。
      - 聞き: 勝ち続けても、どこかでずっと戦ってるんだ。
        tone: しみじみ
      - 語り: でも、皇帝の国には、表に出しにくい顔もありました。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 独裁者の顔
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1800
    lines:
      - 語り: 第一統領になってすぐの1800年1月、ナポレオンは、パリの政治新聞73紙のうち、60紙をやめさせました。
        card: {head: "1800年1月", body: "パリの政治新聞73紙が13紙に"}
      - 聞き: 60紙も！？ 残ったのは13紙ってこと？
        tone: 驚き
      - 語り: はい。新しい新聞を出すことも禁じました。1811年には、パリの新聞は、わずか4紙になります。
        figure: {type: bars, title: パリの新聞の数, bars: [[1800年より前, 73], [1800年1月の命令のあと, 13], [1811年, 4]], labels: ["73紙", "13紙", "4紙"]}
      - 語り: 警察大臣のフーシェのもとでは、密偵が反対する人々を見張り、批判した人は国から追い出されたり、とらえられたりしました。
        figure: null
      - 聞き: 言いたいことが言えない国になっちゃったんだ。
        tone: 重い
      - 語り: 1804年には、国の外にいた王族の一人をとらえ、十分な証拠のないまま処刑させています。この事件は、ヨーロッパに大きな衝撃を与えました。
        card: {head: "1804年3月", body: "アンギャン公の処刑"}
        year: 1804
      - 語り: もう一つ、大きな影があります。1802年、フランスの植民地で、奴隷制を復活させたんです。
        card: {head: "1802年", body: "植民地で奴隷制を復活"}
        year: 1802
      - 聞き: え、革命で自由と平等って言ってたのに！？
        tone: 疑問
      - 語り: カリブ海のハイチには、支配を取り戻すための軍を送りました。現地の指導者トゥサン・ルヴェルチュールは、話し合いの場でとらえられ、フランスで亡くなります。
      - 語り: でも、ハイチの人々は戦い続け、1804年、独立を勝ち取りました。
        card: {head: "1804年", body: "ハイチが独立"}
      - 聞き: ナポレオンに勝って、独立したんだ……。
        tone: しみじみ
      - 語り: 新しい仕組みを作った人であり、自由を押さえつけた人でもある。「独裁者」が半分は本当、と言ったのは、この顔のことです。
      - 聞き: 両方とも、本当のナポレオンなんだ。あーし、ちょっと複雑。
        tone: しみじみ
      - 語り: そして、その皇帝の国は、ある寒い国への遠征で、大きく傾いていきます。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: ロシアと百日天下
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1812
    lines:
      - 語り: 1810年、ナポレオンはジョゼフィーヌと離婚し、オーストリアの皇女マリー＝ルイーズと結婚します。
        card: {head: "1810年", body: "マリー＝ルイーズと結婚"}
        year: 1810
      - 語り: そして1812年6月、ロシアへの遠征を始めます。フランス軍だけで45万を超え、ほかの国の兵を合わせると、60万を超える大軍でした。
        card: {head: "1812年6月", body: "ロシア遠征。60万を超える大軍"}
        year: 1812
      - 聞き: 60万！？ 町がまるごと動いてるみたい。
        tone: 驚き
      - 語り: 9月にはモスクワに入ります。でも、およそ5週間で引き揚げることになりました。
      - 語り: 厳しい冬の退却で、大軍のほとんどは戻れませんでした。帰ってこられたのは、ごく一部です。
        tone: 重い
      - 聞き: ……そっか。
        tone: 重い
      - 語り: 1813年、ドイツでの戦いの最中、ナポレオンは、ある将軍に手紙を書いています。将軍が、町を守り切るのは不可能だ、と書いてきたことへの返事です。
        short: s5
        card: {head: "1813年", body: "将軍を叱った手紙"}
        year: 1813
      - 人物: 「不可能だ、と君は書いてくる。そんなことは、フランス語ではない」
        who: ナポレオン
        short: s5
      - 聞き: あれ？ 「余の辞書に不可能という文字はない」じゃないの？
        short: s5
        tone: 疑問
      - 語り: その有名な言い方は、日本で生まれたものです。もとの意味は、不可能だなんて、フランス人の口にする言葉じゃない、と部下を叱ったものでした。
        short: s5
        card: {head: "「余の辞書に〜」", body: "日本で生まれた言い回し"}
      - 聞き: 自分の万能さを自慢したんじゃなくて、部下にがんばれって言ってたんだ。
        short: s5
        tone: 納得
      - 語り: そうなんです。ただ、本当にナポレオンの手紙にこの一文があったのかについても、はっきりしない所が残っています。
        short: s5
      - 語り: 同じ1813年、ナポレオンはライプツィヒの戦いで敗れ、翌1814年、皇帝の位を退きます。そして、イタリア沖の小さな島、エルバ島に送られました。
        card: {head: "1814年", body: "退位しエルバ島へ"}
        year: 1814
      - 語り: エルバ島では、およそ10か月、島の君主として、鉱山や道路の整備をしています。
      - 聞き: これで終わり、かと思いきや……？
        tone: 疑問
      - 語り: 1815年2月、ナポレオンはエルバ島を抜け出し、3月にはパリに戻って、ふたたび国を治めます。
        card: {head: "1815年", body: "エルバ島を脱出し、パリへ"}
        year: 1815
      - 語り: これを《百日天下》と呼びます。実際には、およそ95日でした。
      - 聞き: 三日天下の次は、百日天下。こっちは、ほぼ合ってるんだ。
        tone: 笑い
      - 語り: 6月18日、今のベルギーのワーテルローで、イギリスとプロイセンの軍に敗れます。そして、2度目の退位をしました。
        card: {head: "1815年6月", body: "ワーテルローで敗れる"}
      - 語り: 次に送られたのは、南大西洋に浮かぶ、遠い島でした。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: セントヘレナと死因
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1815
    lines:
      - 語り: 1815年10月、ナポレオンは、イギリス領のセントヘレナ島に送られます。アフリカの西、大西洋のまんなかに浮かぶ島です。
        card: {head: "1815年10月", body: "セントヘレナ島へ"}
        figure: {type: map, title: ナポレオンの島々, bounds: [-20.0, 20.0, -20.0, 52.0], places: [[パリ, 2.35, 48.86], [コルシカ, 8.74, 41.92], [エルバ, 10.26, 42.78], [セントヘレナ, -5.72, -15.95]], note: 生まれた島、送られた2つの島}
      - 聞き: 地図で見ると、ほんとに遠い……。逃げられないようにしたんだ。
        tone: しみじみ
      - 語り: イギリスに見張られながら、ナポレオンは、側近たちに自分の人生を語って過ごしました。
        figure: null
      - 語り: そして1821年5月5日、セントヘレナで亡くなります。51歳でした。
        card: {head: "1821年5月5日", body: "セントヘレナで死去"}
        year: 1821
      - 聞き: 毒で殺された、って聞いたことあるけど。
        short: s6
        tone: 疑問
      - 語り: その説は、1961年、ナポレオンの髪とされるものから、多くのヒ素が見つかった、という論文から広まりました。
        short: s6
        card: {head: "1961年", body: "髪からヒ素、という論文"}
      - 聞き: ヒ素って、毒でしょ？ やっぱり！
        short: s6
        tone: 驚き
      - 語り: ところが2008年、イタリアの研究所が、子どものころ、エルバ島のころ、セントヘレナのころの髪を比べました。すると、どの時期も、ヒ素の量はほとんど変わらなかったんです。
        short: s6
        card: {head: "2008年", body: "どの時期の髪もヒ素の量は同じくらい"}
      - 聞き: 子どものころからずっと多いってことは……毒を盛られたせいじゃない？
        short: s6
        tone: 疑問
      - 語り: そうです。当時は、ヒ素を含む品物が身の回りにあり、その影響と見られています。毒殺の証拠にはならない、という結論です。
        short: s6
      - 語り: 亡くなったときの解剖の記録では、胃がんとされています。2007年の研究も、解剖の記録から、進んだ胃がんだったと結論づけました。父も胃の病気で亡くなっています。
        short: s6
      - 聞き: 毒殺のほうがドラマっぽいけど、病気だったんだ。
        tone: しみじみ
      - 語り: では、その亡くなったときの記録に、身長も書かれていました。ここから、あの「小男」の話が始まります。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 身長の正体
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1821
    lines:
      - 語り: 亡くなったあと、医師が書き残した身長は、「5ピエ2プス」。ピエとプスは、フランスの古い長さの単位です。
        short: s1
        card: {head: "記録の身長", body: "5ピエ2プス（フランスの単位）"}
      - 聞き: ピエとプス？ 初めて聞いた。
        short: s1
        tone: 疑問
      - 語り: 1ピエはおよそ32.5センチ、1プスはおよそ2.7センチ。合わせると、約168センチです。
        short: s1
      - 語り: ところが、これをイギリスの5フィート2インチと読み違えると、約157センチになってしまいます。
        short: s1
        figure: {type: bars, title: 身長をくらべる（センチ）, bars: [[イギリス式に読み違えると, 157], [当時のフランス人男性の平均, 164], [本当のナポレオン, 168]], labels: ["約157", "約164", "約168"], note: 平均は当時の徴兵の記録などからの推計}
      - 聞き: 単位を読み違えて、10センチ以上縮んだの！？
        short: s1
        tone: 驚き
      - 語り: そう言われています。当時のフランスで兵になった若者の平均は、163センチほど。ナポレオンは、平均並みか、少し高いくらいだったんです。
        short: s1
        figure: null
      - 聞き: 平均以上の人が、200年も「小男」って言われてたんだ。かわいそう。
        short: s1
        tone: しみじみ
      - 語り: 小さく見えた理由は、ほかにもあります。皇帝のそばを守る近衛兵は、特に背の高い兵から選ばれていました。その中に立つと、皇帝は小さく見えたかもしれません。
      - 聞き: 周りが大きすぎたんだ。集合写真で損するやつ。
        tone: 笑い
      - 語り: ちなみに、背の低い人は怒りっぽいのか、という研究もあります。2007年のイギリスの研究では、むしろ怒りにくいという結果、2018年の実験では、少し攻撃的になるという結果。研究によって、答えが割れています。
      - 聞き: 研究でも決着ついてないのに、ナポレオンの名前だけ使われてるんだ。
        tone: 疑問
      - 語り: そして、もう一つ。ナポレオンが生きていたころから、ある国が、ナポレオンを「小男」として描き続けていました。
        hook: true

  # ---------------------------------------------------------------- 10
  - title: 見立て：「小男」の姿は、誰が作ったか
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1803
    lines:
      - 語り: 「背の低い独裁者」という姿は、大きく3つの段階で作られたと、僕は見ています。
      - 聞き: 3つ？ 聞かせて。
        tone: 疑問
      - 語り: 一つ目は、敵の国の宣伝です。戦争の相手だったイギリスでは、風刺画家のジェームズ・ギルレイが、ナポレオンを「リトル・ボニー」、ちびのボニーと呼んで描き続けました。
        card: {head: "段階1", body: "イギリスの風刺画の「ちびのボニー」"}
        year: 1803
      - 語り: 1803年の絵では、怒りで地団駄をふむ、小さな男として描かれています。
      - 聞き: 敵の悪口の絵が、そのまま本当の姿だと思われちゃったんだ。
        tone: 納得
      - 語り: ナポレオンが、「ギルレイは、ヨーロッパのどの軍隊よりも私を引きずり下ろした」と言った、という話も残っています。ただ、これは出どころのはっきりしない逸話です。
      - 語り: 二つ目は、本人と、その周りが作った物語です。セントヘレナで語った言葉は、側近のラス・カーズが本にまとめ、1823年に出版されると、たちまち評判になりました。
        card: {head: "段階2", body: "セントヘレナの語りと英雄の物語"}
        year: 1823
      - 語り: 1840年、ナポレオンの遺骸はフランスに迎えられ、パリで盛大な葬列ののち、葬られ直します。
        card: {head: "1840年", body: "遺骸がパリへ"}
        year: 1840
      - 語り: 今もパリのアンヴァリッドに、大きな棺が置かれています。
      - 聞き: 遠い島から、パリに帰ってきたんだ。
        tone: しみじみ
      - 語り: その名声に乗って、甥のルイ＝ナポレオンが、1848年の大統領選挙で大勝し、のちに皇帝ナポレオン3世になりました。
      - 語り: 「ナポレオン」という名前そのものが、人を動かす力を持つようになっていたんです。
      - 聞き: 小男の悪口と、英雄の物語。両方いっぺんに広がったんだ。
        tone: 疑問
      - 語り: 三つ目は、20世紀の言葉です。心理学者のアドラーは、人が持つ劣等感の考えを広めました。でも、「ナポレオン・コンプレックス」という言葉は、アドラーが作ったものではありません。
        short: s3
        card: {head: "段階3", body: "20世紀の「ナポレオン・コンプレックス」"}
        year: 1928
      - 語り: 1928年の記事には、もうこの言葉の使い方が見られます。背の低い人が強がる、という意味で広まり、ナポレオンの名前が、その代名詞にされました。
        short: s3
      - 聞き: 本人が亡くなって100年後に、名前だけ使われちゃったんだ。
        short: s3
        tone: しみじみ
      - 語り: 日本でも、ナポレオンは早くから知られていました。1813年には、松前に捕らえられていたロシアの軍人を通して、その名が伝わっています。
      - 語り: 幕末の吉田松陰は、ナポレオンを起こして自由を唱えたい、と書きました。「余の辞書に」という言い回しも、日本で生まれたものです。
      - 語り: その前の1818年には、頼山陽が、ロシア遠征に加わったオランダ人の医者から話を聞いて、ナポレオンの漢詩を作っています。1857年には、日本語のナポレオンの伝記も出ました。
      - 語り: 辺境の小さな貴族から皇帝になり、最後は遠い島で亡くなる。その立身出世と悲劇の組み合わせが、日本で人気を集めた理由ではないか、と見る研究者もいます。
      - 聞き: 日本では、ずっと英雄だったんだ。
        tone: 納得
      - 語り: 記録から言えるのは、ここまでです。背は平均並みで、兵士に「ちび隊長」と慕われた若い司令官。今のフランスに残る法や銀行を作った人。
      - 語り: そして、新聞を黙らせ、植民地で奴隷制を戻し、一連の戦争では、兵士と市民をあわせて数百万人が亡くなったと推計されています。
        tone: しみじみ
      - 聞き: 背が低いのは作り話だったけど、独裁者の顔は本当だった。どっちも、ちゃんと見ないとだね。
        tone: しみじみ
      - 語り: つむぎさんの言うとおりです。「小男」は敵がつけた話、「英雄」は本人と後の人がつけた話。その両方をはがすと、もっと大きくて、もっと重たい人が出てきます。
        tone: しみじみ
      - 聞き: 168センチの独裁者、か。今日の地層、思ったより深かった。
        tone: 納得
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、コロンブス。「アメリカを発見した英雄」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

# ============================================================================
# 事実の控え（2026-10-06。詳細は dev/output/rekishi-chiso/research/napoleon_facts.md）
# - 身長：5ピエ2プス（アントンマルキ、側近も）＝約168cm（168〜170の幅）。英国式に読むと約157cm。徴集兵平均163.6cm、成人推定164.6cm（Komlos ほか）
# - 小さな伍長：1796-05-10 ローディのあと兵士が付けた愛称（由来の細部は諸説）。近衛兵は背の高い兵
# - ギルレイ（1756〜1815）「Little Boney」1803（米国議会図書館・イェール所蔵）。「どの軍隊よりも」は出典不明の逸話
# - ナポレオン・コンプレックス：アドラーの用語ではない。1928年の記事に用例（NatGeo）
# - 1768 コルシカがフランスへ、1769-08-15 アジャクシオ、1779 オータン→ブリエンヌ、1784 パリ士官学校、1785-02 父死去、1785-09 少尉（ラプラスが試験官）
# - 1793 トゥーロン→准将（24歳）、1795-10-05 ヴァンデミエール、1796-03-09 結婚、イタリア遠征、1798 エジプト（学者同行）、1799-07 ロゼッタ（ブシャール）、大英博物館、1822 シャンポリオン
# - 1799-11 ブリュメール18日、第一統領（30歳）。1800 国民投票 公式3011007／1562、実際の賛成は約155万（水増し）。1802・1804 も操作の見方
# - 1800-01-18 フランス銀行、1800-02-17 県知事、1802-05-19 レジオン・ドヌール、1804-03-21 民法典、1804-12-02 戴冠（自分で冠）、1805-12-02 アウステルリッツ
# - 新聞：1800-01-17 73紙中60紙廃止、1811 4紙。フーシェ。1804-03-21 アンギャン公の処刑。1802-05-20 奴隷制（英国から返還の植民地）、グアドループ1802-07、ハイチ遠征、トゥサン1803-04-07 ジュー要塞で死去、1804-01-01 ハイチ独立
# - 1810 マリー＝ルイーズ、1812-06-24 ロシア（仏軍45万超、全体60万〜68.5万）、09-14 モスクワ、約5週間、1813-10 ライプツィヒ、1814-04 退位・エルバ、1815-02-26 脱出、03-20 パリ、百日天下（約95日）、06-18 ワーテルロー、10月 セントヘレナ、1821-05-05 死去（51歳）
# - 「不可能」：1813年 ル・マロワ将軍宛の手紙「Ce n'est pas possible, m'écrivez-vous ; cela n'est pas français.」（日付は7/9と9/7で割れる）。確定できる出典がないという見方も
# - 死因：解剖報告は胃がん、1961 Nature のヒ素、2007 Lugli（胃がん）、2008 INFN（生涯同水準）
# - 1823 ラス・カーズ『セントヘレナ日記』、1840-12-15 遺骸の帰還、1848 ルイ＝ナポレオン大統領、1852 ナポレオン3世
# - 日本：1813 ゴロウニン経由、1818 頼山陽、松陰の書簡（那波列翁を起してフレーヘードを唱えねば）
# - 戦争の死者：合計325万〜650万（推計の幅）→「数百万人」
