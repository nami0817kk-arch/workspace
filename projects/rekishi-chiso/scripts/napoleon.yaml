shorts:
  s1:
    title: "ナポレオンは／背が低くなかった"
    yt_title: "ナポレオンは本当に背が低かったのか｜約168cmの真相"
    lead: "記録の「5ピエ2プス」はフランスの古い単位で、約168cm。当時のフランスの兵士の平均並みか、少し高いくらいでした。"
    tags: [ナポレオン 身長, ナポレオン 背が低い, 世界史 雑学, フランス]
  s2:
    title: "「小さな伍長」は／背の話じゃない"
    yt_title: "ナポレオンのあだ名「小さな伍長」の本当の意味"
    lead: "1796年、イタリアでの戦いのあと、兵士たちが親しみを込めて付けたあだ名。身長の話ではなかったと見られています。"
    tags: [小さな伍長, ナポレオン あだ名, ローディの戦い, ナポレオン]
  s3:
    title: "ナポレオン・コンプレックスは／もとは野心家の意味"
    yt_title: "「ナポレオン・コンプレックス」はもともと背の話ではなかった"
    lead: "1928年の記事では「野心の強い男」の意味。背の低さと結びついたのは、そのあとでした。心理学者アドラーの用語でもありません。"
    tags: [ナポレオン・コンプレックス, アドラー, 劣等感, 心理学 雑学]
  s4:
    title: "冠を自分で載せたのは／打ち合わせ済み"
    yt_title: "ナポレオンの戴冠式｜冠を自分で頭に載せたのは、教皇と決めていた段取りだった"
    lead: "1804年12月2日、ノートルダム大聖堂。冠を自分で載せたのは、前もって教皇と話がついていた段取りでした。"
    tags: [ナポレオン 戴冠式, ダヴィッド, ノートルダム大聖堂, 皇帝]
  s5:
    title: "「不可能はない」の／正体は馬のえさ"
    yt_title: "「余の辞書に不可能という文字はない」のもとの手紙は、馬のえさの催促だった"
    lead: "もとは1813年の手紙。エンバクを運ぶのは不可能だと書いてきた将軍に、「不可能だなんて、フランス語じゃない」と返したものでした。"
    tags: [余の辞書に不可能はない, ナポレオン 名言, 名言 意味, 世界史 雑学]
  s6:
    title: "毒殺説は／髪の毛で崩れた"
    yt_title: "ナポレオンの死因は毒殺か｜髪の毛の分析で見えたこと"
    lead: "髪から多くのヒ素が見つかり、毒殺説が広まりました。でも2008年の分析で、子どものころから量が変わらないと分かりました。"
    tags: [ナポレオン 死因, ヒ素, 毒殺説, セントヘレナ]
  s7:
    title: "ロゼッタ・ストーンを／見つけたのは誰？"
    yt_title: "ロゼッタ・ストーンを見つけたのはナポレオンではなかった"
    lead: "1799年、エジプト遠征中のフランス軍の士官が、砦の工事中に見つけました。石は今、大英博物館にあります。"
    tags: [ロゼッタ・ストーン, エジプト遠征, 大英博物館, シャンポリオン]
  s8:
    title: "賛成300万票の／半分は水増し"
    yt_title: "ナポレオンを認めた国民投票｜賛成票は倍に水増しされていた"
    lead: "1800年の国民投票、発表は賛成300万票。でも本当の賛成は、その半分ほどの約155万票だったと分かっています。"
    tags: [国民投票, ナポレオン 独裁, 統領政府, フランス史]
  s9:
    title: "新聞73紙を4紙に／奴隷制も元に戻した"
    yt_title: "ナポレオンの「独裁者」の顔｜パリの新聞73紙を4紙に減らし、奴隷制を復活させた"
    lead: "1800年1月、パリの政治新聞73紙のうち60紙をやめさせ、1811年には4紙に。1802年には、革命でいったんなくした植民地の奴隷制を元に戻しました。"
    tags: [ナポレオン 独裁, 言論統制, 奴隷制, フランス史]
  s10:
    title: "「ちびのボニー」は／敵国の風刺画から"
    yt_title: "ナポレオン「小男」のイメージは、イギリスの風刺画から始まった"
    lead: "戦争の相手だったイギリスで、風刺画家ジェームズ・ギルレイがナポレオンを「ちびのボニー」と呼んで描き続けました。1803年の絵では、地団駄をふむ小さな男の姿です。"
    tags: [ギルレイ, 風刺画, ナポレオン 身長, イギリス]

