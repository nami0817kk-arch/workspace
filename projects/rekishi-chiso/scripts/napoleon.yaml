  # ---------------------------------------------------------------- 10
  - title: 見立て：「小男」の姿は、誰が作ったか
    background: {image: paintings/napoleon_gillray_maniac_ravings.jpg, credit: "ジェームズ・ギルレイ《マニアック・レイヴィングズ（ちびのボニー、大荒れ）》1803年"}
    portrait: null
    year: 1803
    lines:
      - 語り: 「背の低い独裁者」という姿は、大きく3つの段階で作られたと、僕は見ています。
      - 聞き: 3つ？ 聞かせて。
        tone: 疑問
      - 語り: 一つ目は、敵の国の宣伝です。
        year: 1803
      - 語り: 戦争の相手だったイギリスでは、風刺画家のジェームズ・ギルレイが、ナポレオンを「リトル・ボニー」、ちびのボニーと呼んで描き続けました。
        short: s10
        background: {image: paintings/napoleon_gillray_plumb_pudding.jpg, credit: "ジェームズ・ギルレイ《危機のプラム・プディング》1805年"}
        card: {head: "段階1", body: "イギリスの風刺画の「ちびのボニー」"}
      - 語り: 1803年の絵では、怒りで地団駄をふむ、小さな男として描かれています。
        short: s10
        background: {image: paintings/napoleon_gillray_maniac_ravings.jpg, credit: "ジェームズ・ギルレイ《マニアック・レイヴィングズ（ちびのボニー、大荒れ）》1803年"}
      - 聞き: 敵の悪口の絵が、そのまま本当の姿になっちゃった。あーし、それ、悪いあだ名が学校じゅうに広まる感じで、いや。
        short: s10
        tone: 重い
      - 語り: ナポレオンが、「ギルレイは、ヨーロッパのどの軍隊よりも私を引きずり下ろした」と言った、という話も残っています。
        short: s10
      - 語り: ただ、これは出どころのはっきりしない逸話です。
        short: s10
      - 聞き: 言ってそうだけど、確かめようがないんだ。
        short: s10
        tone: 納得
      - 語り: 二つ目は、亡くなったあとの数字です。
        background: {image: paintings/napoleon_alps_delaroche.jpg, credit: "ポール・ドラローシュ《アルプスを越えるボナパルト》1850年"}
        card: {head: "段階2", body: "死後の記録と、単位の読み違い"}
        year: 1821
      - 語り: 「5ピエ2プス」という記録は、イギリス式の5フィート2インチと読まれると、157センチほどの小男の数字になります。
      - 語り: 背の高い近衛兵に囲まれた姿の記憶とも重なって、絵の中の「ちびのボニー」に、数字の裏づけがついてしまいました。
      - 聞き: 悪口のあだ名に、数字のお墨付きまで付いちゃったんだ。
        tone: 納得
      - 語り: その一方で、フランスでは、まったく逆の物語が育ちます。
        background: {image: paintings/napoleon_alps_david.jpg, credit: "ジャック＝ルイ・ダヴィッド《サン・ベルナール峠を越えるボナパルト》1801〜03年"}
      - 語り: セントヘレナで語った言葉は、側近のラス・カーズが本にまとめ、1823年に出版されると、たちまち評判になりました。
        card: {head: "1823年", body: "セントヘレナの語りが本に"}
        year: 1823
      - 聞き: 本人が語った自分の話って、ちょっと盛ってそう。
        tone: 疑問
      - 語り: そう見る人もいます。本の中のナポレオンは、自由と国民のために戦った皇帝として描かれました。
      - 語り: 1840年、ナポレオンの遺骸はフランスに迎えられ、パリで盛大な葬列ののち、葬られ直します。今もパリのアンヴァリッドに、大きな棺が置かれています。
        background: {image: paintings/napoleon_return_ashes_crop.jpg, credit: "《遺骸の帰還、アンヴァリッド》1840年（カルナヴァレ美術館）"}
        card: {head: "1840年", body: "遺骸がパリへ"}
        year: 1840
      - 語り: その名声に乗って、甥のルイ＝ナポレオンが、1848年の大統領選挙で大勝し、のちに皇帝ナポレオン3世になりました。
        year: 1848
      - 聞き: 名前だけで、選挙に勝てちゃうんだ。今でいう、ものすごい知名度。
        tone: 納得
      - 語り: 日本にも、その名は早くから届きました。1818年には、頼山陽が、ロシア遠征に加わったオランダ人の医者から話を聞き、ナポレオンの漢詩を作っています。
      - 語り: 1854年に出た、日本で最初のナポレオンの伝記。その題には、「偽の皇帝」という言葉が入っていました。
      - 聞き: 日本の最初の本で、もう「偽の皇帝」扱い！？
        tone: 驚き
      - 語り: それでも幕末の吉田松陰は、ナポレオンを手本に、自由を唱えたいと書いています。
      - 語り: 辺境の小さな貴族から皇帝になり、最後は遠い島で亡くなる。その立身出世と悲劇が、日本で好まれたのではないか、と見る研究者もいます。
      - 聞き: 悲劇のヒーローのほうが人気出るの、なんか分かる気がする。
        tone: しみじみ
      - 語り: そして三つ目は、20世紀の言葉です。
        background: {image: paintings/napoleon_throne_ingres.jpg, credit: "ジャン＝オーギュスト＝ドミニク・アングル《玉座のナポレオン1世》1806年"}
        card: {head: "段階3", body: "20世紀の「ナポレオン・コンプレックス」"}
        year: 1928
      - 語り: 心理学者のアドラーは、人が持つ劣等感の考えを広めました。でも、「ナポレオン・コンプレックス」という言葉は、アドラーが作ったものではありません。
        short: s3
      - 語り: 1928年の記事では、この言葉は、野心の強い人という意味で、ビジネスマンたちに当てはめて使われていました。
        short: s3
      - 聞き: え、背の話じゃなかったの！？
        short: s3
        tone: 驚き
      - 語り: はい。それが、劣等感の考えと結びついて、背の低い人が強がる、という意味に変わっていきます。ナポレオンの名前は、その代名詞にされました。
        short: s3
      - 聞き: 野心家の意味が、背の話にすり替わったんだ。名前だけ貸した形じゃん。
        short: s3
        tone: 納得
      - 語り: 記録から言えるのは、ここまでです。背は平均並みで、兵士に「ちび隊長」と慕われた若い司令官。今のフランスに残る法や銀行を作った人。
      - 語り: そして、新聞を黙らせ、植民地で奴隷制を戻し、一連の戦争では、兵士と市民をあわせて数百万人が亡くなったと推計されています。
        tone: しみじみ
      - 聞き: 背が低いのは作り話だったけど、独裁者の顔は本当だった。どっちも、ちゃんと見ないとだね。
        tone: しみじみ
      - 語り: つむぎさんの言うとおりです。「小男」は敵がつけた話、「英雄」は本人と後の人がつけた話。
        tone: しみじみ
      - 語り: その両方をはがすと、もっと大きくて、もっと重たい人が出てきます。
        tone: しみじみ
      - 聞き: 168センチの独裁者、か。今日の地層、思ったより深かった。
        tone: 納得
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、コロンブス。「アメリカを発見した英雄」って言われてるけど……本当？
        tone: 疑問
      - 語り: あなたが最初に聞いたナポレオンの話は、背の話でしたか、名言でしたか。コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

# ============================================================================
# 事実の控え（2026-10-06。詳細は dev/output/rekishi-chiso/research/napoleon_facts.md、直しは review/napoleon/round1.md）
# - 身長：5ピエ2プス（アントンマルキ、側近も）＝約168cm（168〜170の幅）。英国式に読むと約157cm。徴集兵平均163.6cm、成人推定164.6cm（Komlos ほか）→ 兵士の平均「164センチほど」
# - 小さな伍長：1796-05-10 ローディのあと兵士が付けた愛称（由来の細部は諸説）。近衛兵は背の高い兵
# - ギルレイ（1756〜1815）「Little Boney」1803-05-24（米国議会図書館）。「どの軍隊よりも」は出典不明の逸話
# - ナポレオン・コンプレックス：アドラーの用語ではない。1928年の記事は「野心の強い人」の意味（ビジネスマンに当てはめた）（NatGeo）。背の低さと結びつくのはそのあと
# - 父カルロはパオリの秘書、フランス統治後は総督マルブフと親しくなり、その縁で息子たちがフランスの学校へ（英語版 Napoleon）
# - 1768 コルシカがフランスへ（名目はジェノヴァ領、1755〜パオリの独立政府）、1769-05 フランス軍が島を制圧、1769-08-15 アジャクシオ、1779 オータン→ブリエンヌ、1784 パリ士官学校、1785-02 父死去（胃の病気とされる）、1785-09 少尉（ラプラスが試験官）
# - 1793 トゥーロン（王党派が英西艦隊に港を渡した）→准将（24歳）、1795-10-05 ヴァンデミエール、1796-03-09 結婚、イタリア遠征、1798 エジプト（学者同行）、1799-07 ロゼッタ（ブシャール、聖刻文字・民衆文字・ギリシャ語）、大英博物館、1822 シャンポリオン
# - 1799-11 ブリュメール18日、第一統領（30歳）。1800 国民投票 公式3011007／1562、実際の賛成は約155万（水増しは票の数。割合はほぼ同じ）、棄権53.74%。1802 終身統領 99.77%、1804 帝政 99.93%（操作の見方）
# - 1800-01-18 フランス銀行、1800-02-17 県知事、1802-05-19 レジオン・ドヌール、1804-03-21 民法典、1804-12-02 戴冠（自分で冠。教皇と事前合意。ダヴィッドの完成作は皇后に冠を授ける場面、初めは自分で冠をかぶる姿を描いた）、1805-12-02 アウステルリッツ、1809 アスペルン＝エスリンクでは敗北
# - 新聞：1800-01-17 73紙中60紙廃止、1811 4紙。フーシェ。1804-03-21 アンギャン公の処刑。1794 国民公会が奴隷制廃止、1802-05-20 奴隷制（英国から返還の植民地）、グアドループ1802-07、ハイチ遠征、トゥサン1803-04-07 ジュー要塞で死去、1804-01-01 ハイチ独立
# - 1810 マリー＝ルイーズ、1812-06-24 ロシア（最初に入ったのは全体で45万あまり、総数約68.5万、フランス帝国から41万＝半分ほど）、09-14 モスクワ、約5週間、1813-10 ライプツィヒ、1814-04 退位・エルバ、1815-02-26 脱出、03-20 パリ、百日天下（3/20〜6/22 で約95日、7/8 までなら110日）、06-18 ワーテルロー（英など連合軍とプロイセン）、10月 セントヘレナ（東インド会社の島）、1821-05-05 死去（51歳）
# - 「不可能」：1813-07-09 ドレスデン（休戦中）ル・マロワ将軍宛。マグデブルクのエンバクを運べないという報告に「Ce n'est pas possible, m'écrivez-vous ; cela n'est pas français.」すぐ船で送れと命じる（napoleon-histoire.com 書簡集）。言い回しはそれ以前からという説あり
# - 死因：解剖報告は胃がん、1961 Nature のヒ素、1982 Nature 緑の壁紙の顔料説、2007 Lugli（胃がん）、2008 INFN（生涯同水準、今の人の平均の約100倍）
# - 1823 ラス・カーズ『セントヘレナ日記』（自由と国民のための皇帝という像）、1840-12-15 遺骸の帰還、1848 ルイ＝ナポレオン大統領、1852 ナポレオン3世
# - 日本：1818 頼山陽「仏郎王歌」、1854『仏蘭西偽帝那波列翁一代記』（最初の伝記）、松陰の書簡（那波列翁を起してフレーヘードを唱えねば）
# - 戦争の死者：合計325万〜650万（推計の幅）→「数百万人」
