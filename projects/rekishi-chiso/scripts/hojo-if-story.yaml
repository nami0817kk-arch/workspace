# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  小田原攻めの前の年、北条氏政は、京へ上るための費用を、家臣たちから集めていました。締め切りは10月の末。
  その10月の末ごろ、上野の名胡桃城が、北条の家臣に奪われます。1か月たたないうちに、豊臣秀吉は、氏直の首をはねると書き送りました。
  もしも氏政が、秀吉に頭を下げていたら、北条家はどうなっていたのでしょうか。
  この動画でわかること
  ・北条家は小田原攻めの2年前から、秀吉に従う手前まで来ていたこと
  ・秀吉が沼田を渡した理由と、名胡桃城の事件のあとに交わされた手紙
  ・秀吉に従ったほかの大名との比べから、上洛していた場合に言えること、言えないこと
  ・史実の北条家が、河内の狭山藩として明治まで続いたこと
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（秀吉の朱印状・書状、北条氏直・氏政の書状、『多聞院日記』、『大日本古文書 伊達家文書』、参謀本部『日本戦史 小田原役』、東京大学史料編纂所『史料綜覧』、田中義成『豊臣時代史』、徳富蘇峰『近世日本国民史』、『足柄下郡史』、中野等・黒田基樹・渡邊大門・安藤優一郎の研究と解説、小田原市・八王子市・大阪狭山市・群馬県・みなかみ町・かながわ考古学財団の資料など）を語りで示してから、今の言葉にして読んでいます。
  名胡桃城が奪われた時期、秀吉方の兵の数、氏直が亡くなった年齢は、記録や研究者によって書き方が割れています。年齢は数え年です。
  氏政が上洛していた場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、《北条氏政像》、《小田原城絵図》、《聚楽第図屏風》、《慶長江戸図》ほかの絵画・絵図・肖像（パブリックドメイン）と、画像生成AIで作った想像上の人物と風景です。
  サムネイルの人物像は、画像生成AIによる想像図です。

en:
  title: "What If Hojo Ujimasa Had Bowed to Hideyoshi? The Fate of the Hojo Clan"
  description: |-
    The year before the Siege of Odawara, Hojo Ujimasa was collecting money from his retainers for a journey to Kyoto. The deadline was the end of October.
    Around the end of that same month, Nagurumi Castle in Kozuke was seized by a Hojo retainer. Less than a month later, Toyotomi Hideyoshi wrote that he would cut off Ujinao's head.
    If Ujimasa had bowed to Hideyoshi, what would have happened to the Hojo family?
    In this video you will learn:
    - That the Hojo came close to submitting to Hideyoshi two years before the siege
    - Why Hideyoshi handed over Numata, and the letters exchanged after the Nagurumi incident
    - What can and cannot be said about a Hojo submission, compared with other daimyo who submitted
    - That the historical Hojo survived as the Sayama domain in Kawachi until the Meiji era
    Japanese-language history video (Japanese audio).
  chapters:
    - "Why Was Ujimasa Collecting Travel Money? 1589"
    - "Who Went to Kyoto First? Hojo Ujinori at the Jurakudai, 1588"
    - "Why Did Hideyoshi Hand Over Numata? 1589"
    - "What Happened at Nagurumi Castle? Autumn 1589"
    - "Why Did Odawara Castle Open Its Gates? 1590"
    - "Where Did the Hojo Survive? Ujinao and the Sayama Domain, 1591-1869"
    - "Turning Point 1: Would the Hojo Have Kept the Kanto by Going to Kyoto?"
    - "Turning Point 2: Would Ieyasu Have Gone to Edo?"
    - "Summary: If Ujimasa Had Bowed to Hideyoshi"

