sections:
  # ================================================================ 序章
  - title: 「なぜ氏政は、京へ上る費用を集めていたのか」　1589年 小田原
    background: {image: paintings/shingen_odawara_castle_map.jpg, credit: "《小田原城絵図》（江戸時代）"}
    year: 1589
    lines:
      # fact: hojo-22
      - 語り: 小田原攻めの前の年。北条氏政は、京へ上るための費用を、家臣たちから集めていました。締め切りは、《10月の末》です。
        tone: 重い
        card: {head: "1589年", body: 上洛の費用、締め切りは10月末}
      - 語り: 北条家は、豊臣秀吉に頭を下げる、すぐ手前まで来ていたのです。
        tone: しみじみ
      # fact: hojo-27
      - 語り: ところが、その10月の末ごろ、北条の家臣が、山の上の小さな城を奪います。名胡桃城です。
      # fact: hojo-74, hojo-75
      - 語り: 1か月たたないうちに、秀吉は、氏政の息子で北条家の当主、氏直に宛てて書きました。来年、必ず兵を出し、氏直の首をはねる。
        tone: 重い
        card: {head: "1589年11月24日", body: 秀吉「氏直の首をはねる」}
      # fact: hojo-83
      - 語り: 12月、氏直が書いた弁明の手紙には、父の氏政は、京へ上れば二度と国へは戻れない、と覚悟している、とあります。
      # fact: hojo-102
      - 語り: 翌年の7月、小田原城は開き、氏政は、腹を切りました。
        tone: 重い
      # fact: hojo-143, hojo-69
      - 語り: それでも、北条の家は絶えませんでした。河内の狭山藩として、明治2年まで続いています。
      - 語り: もしも、氏政が、秀吉に頭を下げていたら。北条家は、どうなっていたのでしょうか。
        tone: 疑問
      - 語り: 変えるのは一点だけ。名胡桃城の事件のあとでも、氏政が約束どおり12月に小田原を発ち、秀吉の前に出ていたら。ここから先のもしもは、記録に残る条件から考える推論です。
      - 語り: 上洛すれば、北条家は、関東の大名として残ったのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 最初に見るのは、その前の年。先に京へ上ったのは、氏政ではありませんでした。
        hook: true

  # ================================================================ 第1章 1588年
  - title: 「先に京へ上ったのは、誰だったのか」　1588年 京都・聚楽第
    background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
    year: 1588
    lines:
      # fact: hojo-19, hojo-126
      - 語り: 天正16年、1588年の2月。氏直は、重臣の笠原康明を京へ送り、秀吉に従う意思を伝えていました。中野等さんが、2015年の論文で示した話です。
        card: {head: "1588年2月", body: 重臣を京へ。従う意思を伝える}
      # fact: hojo-19
      - 語り: ところが4月、後陽成天皇が秀吉の聚楽第を訪ねた行幸の席に、北条は、使者さえ送りませんでした。
      # fact: hojo-18
      - 語り: 5月21日、徳川家康が、氏政と氏直に起請文を送ります。家康は、氏直の妻の父です。その月のうちに、氏政の兄弟の誰かを京へ上らせるよう迫りました。
        card: {head: "1588年5月21日", body: 家康の起請文。兄弟を京へ}
      # fact: hojo-18, hojo-127
      - 語り: 氏政は、12月上旬に自分が京へ上る、と答えたとされます。中野さんは、こうした北条の対応を、臣従を表明したもの以外の何ものでもない、と記しています。
      # fact: hojo-20, hojo-128
      - 語り: 翌月の秀吉の朱印状にも、北条が、何ごとも秀吉の思いどおりにいたします、と詫びてきた、とあります。
      # fact: hojo-116, hojo-145
      - 語り: 同じ年の7月には、中国地方の毛利輝元が、臣従の礼のために京へ上っています。輝元にとっては、生まれて初めての畿内への旅でした。
      # fact: hojo-21, hojo-129
      - 語り: そして8月。北条からは、当主の氏直でも、父の氏政でもなく、氏政の弟、北条氏規が京へ上りました。
        card: {head: "1588年8月", body: 氏政の弟・氏規が上洛}
      # fact: hojo-88
      - 語り: 奈良の興福寺の僧、英俊の『多聞院日記』は、8月18日に、東国はすべて和談が整い、天下中が満足している、と書いています。
      # fact: hojo-89
      - 語り: 秀吉と会った席の様子は、明治の参謀本部がまとめた『日本戦史』が引く、『吉川家史臣略記』にあります。
      # fact: hojo-89
      - 語り: 正装の衣冠を着た13人の武家が並びます。官位の無い氏規は、烏帽子に直垂という、ふだんの武家の装いで、いちばん下の席に座りました。
      # fact: hojo-93
      - 語り: 江戸時代の『続武家閑談』には、こんな話が伝わります。宿の寺で、田舎武士の悲しさよ、と嘆いた氏規のもとへ、秀吉が自ら訪ねてきた。
      # fact: hojo-93
      - 語り: 氏規は、北条が上洛せず戦になれば、自分は北条の先陣として、秀吉に矢を向ける、と言い返した、というのです。後の時代の逸話ですが、兄弟の板ばさみが、よく表れています。
      # fact: hojo-90
      - 語り: 1925年に出た田中義成の『豊臣時代史』は、この堂々とした対面を、京の威儀を見せて、北条の父子に上洛を悟らせるためだった、と読みました。
      # fact: hojo-92
      - 語り: 江戸時代の『北条五代記』には、こんな話もあります。小田原に帰った氏規が、京の町は板葺きの家が軒を並べている、と伝えると、氏直は、街道に面した庇だけでも板葺きにさせた。
      # fact: hojo-91
      - 語り: 秀吉の側近の施薬院全宗は、伊達政宗への手紙で、北条美濃守、つまり氏規が上洛して御礼を申し上げた、と知らせ、政宗にも上洛を促しています。
      - 語り: 東国の大きな大名が、豊臣の側へ一歩近づいた。京では、そう受け止められていました。
        tone: しみじみ
      - 語り: 残る問題は、氏政本人が、いつ来るかでした。
        hook: true
      - 語り: その約束と引き換えに、秀吉は、ある城を北条に渡します。
        hook: true

  # ================================================================ 第2章 1589年 沼田
  - title: 「秀吉は、なぜ沼田の城を渡したのか」　1589年 上野・沼田
    background: {image: paintings/mitsunari_odawara_hiroshige.jpg, credit: "歌川広重《東海道五拾三次之内 小田原》1838年ごろ"}
    year: 1589
    lines:
      # fact: hojo-03
      - 語り: その城は、北条と真田が争っていた、上野の沼田の城です。
      # fact: hojo-25, hojo-80
      - 語り: 秀吉は、沼田の領地の3分の2を北条に、名胡桃城を含む3分の1を真田に、と裁き、上使の富田一白と津田盛月を送って、城を渡させました。
        figure: {type: stats, title: 沼田の領地の裁き（1589年）, items: [[北条, 3分の2, 沼田城], [真田, 3分の1, 名胡桃城を含む]], upto: 2}
      # fact: hojo-130
      - 語り: 天正17年、1589年。沼田の城は、氏政の弟の北条氏邦が受け取ります。
        figure: null
        card: {head: "1589年", body: 沼田城を北条が受け取る}
      # fact: hojo-80
      - 語り: なぜ秀吉は、城を渡したのか。秀吉自身が、のちの朱印状に書いています。今年の12月上旬に氏政が出仕する、という請書が出されたので、沼田を渡したのだ、と。
        tone: 重い
      # fact: hojo-81
      - 語り: 北条の側の約束も、手紙に残っています。氏直が、秀吉の側の取り次ぎ役に宛てた、6月5日付の手紙です。父の氏政が上洛する。年内は支度が整いにくいが、12月上旬には、ここを発つ。
        card: {head: "6月5日付", body: 氏直「12月上旬に、ここを発つ」}
      # fact: hojo-22
      - 語り: 冒頭の、あの費用です。研究者の黒田基樹さんによると、氏政は、家臣たちに上洛の費用を出させ、その納め時を、10月の末と決めていました。
      # fact: hojo-94
      - 語り: 一方で、江戸時代の『老将座談』などには、秀吉のこんな言葉が伝わります。渡しても上洛しなければ、北条を憎む心で兵の気持ちが高まる。沼田の8万石と、小田原を取り替える策だ。
      - 語り: この話は、後の時代の聞き書きです。けれど、沼田を渡した時点で、秀吉が北条に、上洛という一つの答えを求めていたことは、記録から確かです。
        tone: しみじみ
      # fact: hojo-111
      - 語り: この年の9月1日、秀吉は、諸大名の妻や子を京都に住まわせ、人質としました。1921年の徳富蘇峰の『近世日本国民史』が、そう書いています。
      - 語り: 京へ上り、秀吉に従うことは、家族を京に置くことと、隣り合わせでした。
        tone: しみじみ
      - 語り: それでも、12月に小田原を発つ段取りは、決まっていました。
        hook: true
      - 語り: その前に、名胡桃城で、事件が起きます。
        hook: true

  # ================================================================ 第3章 1589年 名胡桃
  - title: 「名胡桃城で、何が起きたのか」　1589年秋 上野・名胡桃
    background: {image: paintings/shingen_odawara_sakawa_hiroshige.jpg, credit: "歌川広重《東海道五拾三次之内 小田原 酒匂川》1833年ごろ"}
    year: 1589
    lines:
      # fact: hojo-27
      - 語り: 名胡桃城を奪ったのは、北条の沼田城代、猪俣邦憲でした。
        card: {head: "1589年秋", body: 猪俣邦憲が名胡桃城を奪う}
      - 語り: いつ奪ったのか。ここで、記録と研究が割れます。
        tone: 疑問
      # fact: hojo-95
      - 語り: 明治の『日本戦史』は10月で、日は分からないとします。大正の田中義成は11月、昭和の初めの『足柄下郡史』は、11月19日と書きました。
        figure: {type: stats, title: 名胡桃城が奪われた時期, items: [[日本戦史（明治）, 10月], [田中義成（大正）, 11月], [足柄下郡史（1929年）, 11月19日]], upto: 3}
      # fact: hojo-27
      - 語り: 今の研究でも、黒田基樹さんは10月の末とみられる、とし、中野等さんは、11月の初め、とします。
        figure: {type: stats, title: 名胡桃城が奪われた時期（今の研究）, items: [[黒田基樹（2016年）, 10月末, 解説], [中野等（2015年）, 11月初め, 論文]], upto: 2}
      # fact: hojo-96
      - 語り: 『足柄下郡史』は、奪ったのが本当に氏直の考えだったのかを疑い、遠く離れた現場の家臣どうしの争いだったのかもしれない、とみています。
        figure: null
      # fact: hojo-58
      - 語り: 名胡桃城の跡は、今の群馬県みなかみ町にあります。発掘では、三日月の形の堀と、丸馬出しと呼ばれる、出入り口の守りが見つかりました。
      # fact: hojo-28, hojo-79
      - 語り: 11月21日、秀吉は、真田昌幸に書き送ります。氏政が出仕すると請けたので、沼田の城まで渡した。名胡桃に攻めかかった者を成敗しないなら、たとえ北条が出仕しても、赦しはしない。
        tone: 重い
        card: {head: "1589年11月21日", body: 出仕しても、赦しはしない}
      # fact: hojo-74
      - 語り: 3日後の11月24日。秀吉は、氏直に宛てて朱印状を出しました。仙台の伊達家に伝わった1通では、氏直は天道の正理に背き、帝都に対して悪だくみをした、と責めています。
      # fact: hojo-75
      - 語り: 結びは、来年、必ず旗を立てて出発し、氏直の首をはねる。引き返すことはない、でした。
        tone: 重い
      # fact: hojo-76
      - 語り: この朱印状は、写しにも朱印を押して家康たちにも配られ、どこへでも見せよ、と添えられていました。
      # fact: hojo-30
      - 語り: 真田家に伝わった1通は、今、長野市の真田宝物館にあります。
      # fact: hojo-77, hojo-78
      - 語り: 同じ日、秀吉は家康への手紙で、北条から書面の返事がなければ、石巻たち北条の使者を、国境で磔にせよ、とまで書いています。
      # fact: hojo-82, hojo-31
      - 語り: 北条も、黙ってはいません。12月7日、氏直は、上使の富田と津田に弁明を送りました。名胡桃のことは、一切知らない。
        card: {head: "1589年12月7日", body: 氏直「名胡桃のことは一切知らない」}
      # fact: hojo-85
      - 語り: 名胡桃は、今は百姓の屋敷にすぎない、とまで書いています。
      # fact: hojo-83
      - 語り: そして、氏政の上洛が遅れる訳を、こう明かします。京へ上れば、長く留め置かれる、あるいは国替えになる。
      # fact: hojo-83
      - 語り: そんな噂が方々から届き、氏政は、二度と国へは戻れない、と覚悟している。
        tone: しみじみ
      # fact: hojo-83
      - 語り: 家康が上洛したときには、秀吉は妹を嫁がせ、母の大政所を三河まで送ったと聞いている、とも書きました。
      # fact: hojo-84
      - 語り: 同じ手紙によると、北条はこの年の夏、上洛を来年の春から夏に延ばしたいと頼んでいました。けれど認められず、12月にまず途中まで出て、正月のうちに京へ着く段取りになっていました。
      # fact: hojo-87
      - 語り: 2日後の12月9日には、家康に、上洛を正月か2月に移せないか、と打診しています。
      # fact: hojo-99
      - 語り: 1921年、徳富蘇峰は、氏直の言い分を相当の申し訳と認めながら、これは条件付きの上京で、謝罪の上京ではない、と書きました。
      - 語り: 翌年の春、秀吉の大軍が、東へ向かいます。
        hook: true
      - 語り: 史実の北条家は、ここで、頭を下げる最後の機会を失いました。
        hook: true

  # ================================================================ 第4章 1590年 小田原
  - title: 「小田原城は、なぜ開いたのか」　1590年 相模・小田原
    background: {image: paintings/toshiie_odawara_castle_ndl75_trim.jpg, credit: "《相州小田原城図》（日本古城絵図、国立国会図書館蔵。江戸時代）"}
    year: 1590
    lines:
      # fact: hojo-45, hojo-101
      - 語り: 秀吉の軍勢の数も、出どころによって割れます。小田原市の解説は約18万、明治の『日本戦史』は20万あまり、静岡県立中央図書館の解説は22万としています。
        figure: {type: stats, title: 小田原攻めの秀吉方の数, items: [[小田原市の解説, 約18万], [日本戦史（明治）, 20万あまり], [静岡県立中央図書館, 22万]], upto: 3}
      # fact: hojo-45
      - 語り: 北条方は、小田原市によると、約5万で城にこもりました。
        figure: null
      # fact: hojo-46
      - 語り: 箱根の山中城では、豊臣方の主力6万7800人に対して、守りは4000から5000人ほど。城は、午前中に落ちました。
      # fact: hojo-41
      - 語り: 北条は、小田原城と城下の町を、周りおよそ9キロの堀と土塁、総構で囲んでいました。
        card: {head: "総構", body: 周りおよそ9キロの堀と土塁}
      # fact: hojo-53
      - 語り: 2008年の発掘では、小田原城の西の堀の一つが、幅23メートル、深さ約7メートルの障子堀だったと分かりました。堀の底を、土の壁で仕切った堀です。
      # fact: hojo-54
      - 語り: この堀は近代まで埋まり切らず、県立小田原高校を建てたときには、庭の池として使われていました。
      # fact: hojo-50
      - 語り: 秀吉は、小田原城を見下ろす山に、石垣の城を築きます。一夜城と呼ばれますが、小田原市の解説では、延べ4万人で約80日をかけた、関東で初めての総石垣の城でした。
        card: {head: "石垣山", body: 延べ4万人・約80日}
      # fact: hojo-63
      - 語り: 6月23日、氏政の弟、氏照の八王子城が落ちます。八王子市は、これが小田原開城の決め手になった、と書いています。
      # fact: hojo-60
      - 語り: もう一人の弟、氏邦は、籠城に反対して兄と別れ、鉢形城で降って、のちに前田利家の家臣になりました。
      # fact: hojo-102
      - 語り: 7月5日、氏直は城を出て、自分が腹を切る代わりに、父や将兵の命を助けてほしい、と願い出ます。
        card: {head: "1590年7月5日", body: 氏直が城を出る}
      # fact: hojo-140, hojo-102
      - 語り: 秀吉は、家康の娘婿の氏直を助け、氏政と、弟の氏照らに、死を命じました。
        tone: 重い
      # fact: hojo-102
      - 語り: 7月11日、2人は、城下の医師の家で自害します。東京大学史料編纂所の『史料綜覧』にある日付です。
        tone: 重い
      # fact: hojo-103
      - 語り: 『日本戦史』によれば、氏政の介錯をした氏規は、その刀で自分も腹を切ろうとして、止められました。
      # fact: hojo-105
      - 語り: 2人の首は、京へ送られ、7月16日に一条戻橋にさらされました。『多聞院日記』には、偽物だという噂まで立った、とあります。
      # fact: hojo-49
      - 語り: 小田原市の文化財ガイドによると、今も残る2人の墓所には、2人がこの上で自害したと伝わる、生害石という石があります。
      # fact: hojo-106
      - 語り: 7月20日、氏直は小田原を発ち、高野山へ向かいます。『日本戦史』によると、一族や重臣ら30人と、兵300人あまりが従いました。
      # fact: hojo-106
      - 語り: 8月、奈良を通った北条の一行のことを、英俊は日記に、哀れなありさまだ、と書きました。
      - 語り: 小田原での北条家の結末は、ここまでです。
        hook: true
      - 語り: けれど、北条の家は、ここでは終わりませんでした。
        hook: true

  # ================================================================ 第5章 その後（史実）
  - title: 「北条家は、どこで生き延びたのか」　1591年から1869年 河内・狭山
    background: {image: paintings/sanada_kii_yamato_six_provinces_map_ndl_trim.jpg, credit: "《紀伊大和河内伊賀山城伊勢六ヶ国絵図》の部分（江戸時代、国立国会図書館蔵）"}
    year: 1591
    lines:
      # fact: hojo-141
      - 語り: 高野山に送られた氏直は、1591年に赦され、関東で9000石、近江で1000石、合わせて1万石を与えられました。
        card: {head: "1591年", body: 氏直が赦され、1万石}
      # fact: hojo-107
      - 語り: 『史料綜覧』によると、その年の8月、氏直は、高野山の高室院に、秀吉の明への出兵を知らせています。
      # fact: hojo-108
      - 語り: 『日本戦史』は、氏直を、翌年には伯耆の1国に移す話があった、と書きます。
      # fact: hojo-108
      - 語り: しかし、同じ年の11月4日。氏直は大坂で、疱瘡のために亡くなります。
        tone: 重い
        card: {head: "1591年11月4日", body: 氏直が大坂で亡くなる}
      # fact: hojo-109
      - 語り: その死を書いた記録も、割れます。奈良の『多聞院日記』は、亡くなる6日前の10月29日に、すでに死去と書いています。
      # fact: hojo-109
      - 語り: 年齢も、『続皇朝史略』は30歳、写本の『垂統大記』は28歳、『越後史集』に収められた記録は33歳とします。
        figure: {type: stats, title: 氏直が亡くなった年齢, items: [[続皇朝史略, 30歳], [垂統大記, 28歳], [越後史集の記録, 33歳]], upto: 3}
      - 語り: 永禄5年、1562年の生まれとして数えると、天正19年には、数えで30歳です。
        figure: null
      # fact: hojo-108
      - 語り: 家督は、叔父の氏規が継ぎました。氏政の介錯をした、あの弟です。
      # fact: hojo-146
      - 語り: もう一人の弟、氏邦は、前田利家の家臣として、慶長2年、1597年に、金沢で亡くなりました。
      # fact: hojo-67
      - 語り: 氏規は、文禄3年、1594年に、河内に6988石を持ちます。のちの狭山藩の陣屋の地も、その中にありました。
      # fact: hojo-68
      - 語り: 狭山の陣屋は、1616年、2代の氏信が、狭山池の北東に築きました。石高は約1万1千石。藩主は12代、約250年続きます。
        card: {head: "狭山藩", body: 約1万1千石・12代}
      # fact: hojo-70
      - 語り: 大阪狭山市によると、狭山藩には、小田原以来の家臣も多くいました。
      # fact: hojo-69
      - 語り: そして明治2年、1869年の12月26日。藩知事の北条氏恭が、苦しい財政から職を辞し、狭山藩は、廃藩置県を待たずに廃止されました。
        tone: しみじみ
        card: {head: "1869年12月26日", body: 狭山藩が廃止される}
      - 語り: 関東の大大名だった北条家は、河内の小さな藩として、生き延びたのです。
        hook: true
      - 語り: では、もしも。あの冬、氏政が約束どおり京へ上っていたら。
        hook: true

  # ================================================================ 第6章 分岐1
  - title: 「分岐1　上洛すれば、北条家は関東に残ったのか」　1585年から1598年
    background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
    lines:
      - 語り: ここから先は、もしもの話です。手がかりは、秀吉に従った、ほかの大名たちです。
      # fact: hojo-113, hojo-123
      - 語り: 徳川家康は、1586年、秀吉の妹の朝日姫を妻に迎え、母の大政所が岡崎へ下ったあとに、大坂城で秀吉に会いました。およそ100万石の5か国は、そのまま残ります。
        figure: {type: table, title: 秀吉に従った大名は、何を残したか, cols: [上洛・降った年, 残った領地], rows: [[徳川家康, 1586年 上洛, 5か国そのまま]], upto: 1}
      # fact: hojo-116
      - 語り: 毛利輝元は、1588年の7月に、臣従の礼のために京へ上り、1591年に、9か国112万石を認められました。
        figure: {type: table, title: 秀吉に従った大名は、何を残したか, cols: [上洛・降った年, 残った領地], rows: [[徳川家康, 1586年 上洛, 5か国そのまま], [毛利輝元, 1588年 上洛, 9か国112万石]], upto: 2}
      # fact: hojo-117
      - 語り: 戦ってから降った大名もいます。長宗我部元親は、伊予1国を返すことで折り合おうとしましたが、秀吉は、土佐のほかの3国を返せと命じ、話は決裂しました。
      # fact: hojo-117
      - 語り: 1585年に降り、残されたのは土佐1国です。
        figure: {type: table, title: 秀吉に従った大名は、何を残したか, cols: [上洛・降った年, 残った領地], rows: [[徳川家康, 1586年 上洛, 5か国そのまま], [毛利輝元, 1588年 上洛, 9か国112万石], [長宗我部元親, 1585年 降る, 土佐1国だけ]], upto: 3}
      # fact: hojo-118
      - 語り: 島津義久は、1587年に降り、薩摩などを残されています。
        figure: {type: table, title: 秀吉に従った大名は、何を残したか, cols: [上洛・降った年, 残った領地], rows: [[徳川家康, 1586年 上洛, 5か国そのまま], [毛利輝元, 1588年 上洛, 9か国112万石], [長宗我部元親, 1585年 降る, 土佐1国だけ], [島津義久, 1587年 降る, 薩摩など]], upto: 4}
      # fact: hojo-119
      - 語り: 伊達政宗は、1590年、小田原へ参じて従いましたが、会津などを取り上げられました。
        figure: {type: table, title: 秀吉に従った大名は、何を残したか, cols: [上洛・降った年, 残った領地], rows: [[徳川家康, 1586年 上洛, 5か国そのまま], [毛利輝元, 1588年 上洛, 9か国112万石], [長宗我部元親, 1585年 降る, 土佐1国だけ], [島津義久, 1587年 降る, 薩摩など], [伊達政宗, 1590年 参陣, 会津などを失う]], upto: 5}
      # fact: hojo-114
      - 語り: 家康も、すぐには京へ上りませんでした。中野さんが紹介する研究では、家康の上洛が遅れれば、秀吉は上杉景勝らに、徳川を攻めさせるつもりだった、と指摘されています。
        figure: null
      - 語り: ここに挙げた大名は、どれも、家は残りました。残った領地の大きさは、いつ、どう従ったかで違います。
      - 語り: もしも、氏政が約束どおり12月に小田原を発ち、秀吉の前に出ていたら。
        tone: 疑問
      # fact: hojo-127
      - 語り: 中野さんの読みのとおり、北条がすでに従うと表明した大名とみなされていたなら、北条家は、関東の大名として残った、と考えるのが自然です。
      # fact: hojo-28
      - 語り: ただし、無傷ではなかったはずです。秀吉は、名胡桃に攻めかかった者を成敗しないなら、出仕しても赦さない、と書いていました。上洛には、名胡桃の始末という代償がついていました。
      # fact: hojo-111
      - 語り: 家族を京へ出すことも、避けられなかったでしょう。秀吉は、すでに諸大名の妻や子を、京都に住まわせていました。
      # fact: hojo-115
      - 語り: 国替えの恐れもあります。史実でも秀吉は、従った大名を動かしています。上杉景勝は、1586年に上洛して臣従し、12年後の1598年、越後から会津の120万石へ移されました。
      # fact: hojo-83
      - 語り: 氏直が手紙に書いた噂も、根拠のない心配とは言えなかったでしょう。
      # fact: hojo-24
      - 語り: 黒田さんは、北条が名胡桃城を取らなければ攻められなかった、という見方を、結果からの判断でしかない、と退けます。
      # fact: hojo-24
      - 語り: この戦は、優勢な側が妥協しないことから起きる戦の、いい例ではないか。黒田さんは、そう述べています。
      - 語り: その見方に立てば、北条が戦を避ける道は、秀吉の求めを、そのまま受け入れることだった、ということになります。
      # fact: hojo-134
      - 語り: 歴史学者の渡邊大門さんは、北条が秀吉と直接交渉する道を選んでいれば、その後の情勢が変わっていた可能性は否定できない、と書きました。
      # fact: hojo-135
      - 語り: 評論家の八幡和郎さんは、上洛していれば毛利や上杉と同じ扱いだったろうが、関東や東北の平定に兵を出させられ、東北へ移されたかもしれない、とみています。
      - 語り: まとめると、もしも上洛していれば、北条家は関東の大名として残った見込みが高い。けれど、関東の領地を、そのまま持ち続けられたかは、言い切れません。
        tone: しみじみ
        figure: {type: table, title: もしも約束どおり上洛していたら（推論）, cols: [史実, もしも], rows: [[関東の北条家, 1590年に領地を失う, 関東の大名として残る, 高い], [氏政, 7月11日に自害, 京で秀吉に会う, 高い], [関東の領地, すべて失う, 一部を削られる, ありうる]], upto: 3, note: もしもは推論。右の札は見込みの高さ}
      - 語り: そして、北条が関東に残れば、もう一人の大名の行く先も変わります。
        figure: null
        hook: true
      - 語り: 関東の隣にいた、徳川家康です。
        hook: true

  # ================================================================ 第7章 分岐2
  - title: 「分岐2　北条が残っていたら、家康は江戸へ行ったのか」　1590年 江戸
    background: {image: paintings/ieyasu_edo_keicho_ezu_1608.jpg, credit: "《慶長江戸図》1608年（東京都立中央図書館蔵）"}
    year: 1590
    lines:
      # fact: hojo-72
      - 語り: 史実では、小田原が開いたあと、秀吉は家康に、北条の旧領への国替えを命じます。財務省の広報誌の記事は、その日を7月13日、家康が江戸に入ったのを、8月1日としています。
        card: {head: "1590年8月1日", body: 家康が江戸に入る}
      # fact: hojo-122
      - 語り: 家康が関東で得た石高を、平凡社の世界大百科事典で、高木昭作さんは、約250万石と書いています。
      # fact: hojo-123
      - 語り: 移る前の家康は、約100万石。数字の上では、倍を超える加増でした。ただし、慣れ親しんだ5か国は、取り上げられています。
        figure: {type: stats, title: 家康の石高（1590年の国替え）, items: [[国替えの前, 約100万石, 5か国], [国替えの後, 約250万石, 関東]], upto: 2}
      # fact: hojo-139
      - 語り: 2022年に出た安藤優一郎さんの本は、小田原の戦いのあと始末の一番の眼目は、北条の旧領を誰に与えるかだった、とします。
        figure: null
      # fact: hojo-73
      - 語り: 北条の旧領の上野には、井伊直政や榊原康政といった、家康の重臣が置かれました。
      - 語り: では、もしも北条が関東に残っていたら。家康に与えるほどの旧領は、ほとんど生まれません。家康は、駿河や三河など、5か国にとどまったと考えられます。
        tone: 疑問
      - 語り: 家康が江戸に入ったのは、北条が滅び、関東が空いたからでした。北条が残っていれば、少なくともこの年、家康が江戸に入るきっかけは生まれません。
      - 語り: そこから先、江戸が日本の中心になったかどうかは、記録からは言い切れません。
        tone: しみじみ
      - 語り: では、上洛した北条家と、上洛しなかった北条家。分かれ目は、どこにあったのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 最後に、氏政の覚悟の言葉に、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも北条氏政が秀吉に頭を下げていたら、北条家はどうなったのか
    background: {image: paintings/shingen_odawara_castle_map.jpg, credit: "《小田原城絵図》（江戸時代）"}
    lines:
      # fact: hojo-127
      - 語り: もしも氏政が、約束どおり京へ上っていたら。北条家は、関東に残った見込みが高い、と考えられます。中野さんは、北条がすでに従うと表明していた、と読んでいるからです。
      # fact: hojo-28
      - 語り: ただし、名胡桃の始末と、国替えの恐れは残ります。関東の領地を守り切れたかどうかは、言い切れません。
      - 語り: そして家康は、少なくともこの年、関東へ移るきっかけを得なかったでしょう。
      - 語り: 北条家は、上洛の約束をし、費用を集め、出発の月まで決めていました。それでも、京へは上りませんでした。
        tone: しみじみ
      # fact: hojo-83
      - 語り: 京へ上れば、二度と国へは戻れない。氏直の手紙は、父の覚悟を、そう伝えていました。
        tone: しみじみ
      - 語り: 上れば、戻れないかもしれない。上らなければ、攻められる。北条家は、その板ばさみのまま、最後の冬を迎えました。
        tone: しみじみ
      - 語り: 国へ戻れなくなることを恐れて、京へ上らなかった氏政。北条家は、その国を、すべて失いました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
