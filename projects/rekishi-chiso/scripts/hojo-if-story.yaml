# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と tsurumatsu-if-story.yaml の型）。もしも北条氏政が秀吉に頭を下げていたら。2026-11-06 下書き。
# 公開の予定は 11/8 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型：
#   分岐は誰でも知る大事件（小田原攻め）の逆＝1589年のうちに氏政が上洛して秀吉に臣従していたら／一点だけ変える／史実の条件の範囲内／推論と明かす／
#   台詞は使わない（想像の台詞なし）／対象は史実で滅んだ有名な家（北条家）。
#   語り手は剣崎1人。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない。予想の席は研究者の説（黒田基樹・中野等・渡邊大門）に置く。言えないことは言えないと言う。
#   冒頭（10秒以内）＝小田原攻めの前の年、氏政は上洛の費用を家臣から集めていた。締め切りは10月末（黒田基樹 2016）。その月の末ごろ名胡桃城の事件。
#   序章／第1章 1588年 先に頭を下げた弟（氏規）／第2章 1589年 沼田と12月上旬の約束／第3章 1589年 名胡桃と宣戦・弁明／第4章 1590年 小田原開城／
#   第5章 史実の北条家のその後（氏直・狭山藩）／第6章 分岐1 上洛すれば北条家は関東に残ったのか（臣従した大名の比べ・研究者の見方）／第7章 分岐2 家康は江戸へ行ったのか／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 公開済みとの重なり：鶴松if（11/7）・秀次（10/28）は豊臣家。真田（旧型）は名胡桃を短く扱った。この回の主語は北条家だけ。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/北条氏政_facts_20261106.yaml）にあるものだけ。行の上に `# fact: hojo-NN`。
#   誰でも知る前置き（小田原攻め・家康が関東へ移ったこと・聚楽第）は短く使う。
#   記録の食い違いは3つだけ並べる：①名胡桃城を奪った時期（10月・10月末・11月初め・11月19日）②秀吉方の兵の数（約18万・20万あまり・22万）
#   ③氏直の死の記事と年齢（多聞院日記は6日前に「死去」、30歳・28歳・33歳）。
#   ほかに割れるもの（氏規が秀吉に会った日 15日/22日・氏直の6月5日の手紙の年・家康の起請文の中身・北条の旧領の石高 240万/250万・氏規の河内の石高・上洛するはずの人＝氏政か氏直か）は、
#   1つの出どころの数として言うか、言わない。上洛する人は秀吉の朱印状・氏直の書状に合わせて氏政に統一する。
# 自分で計算した数：
#   年：天正14年＝1586／天正16年＝1588／天正17年＝1589／天正18年＝1590／天正19年＝1591／文禄3年＝1594／明治2年＝1869。
#   10月末（名胡桃）→11月24日（宣戦）は1か月たたない。11月21日→24日は3日後。12月7日→9日は2日後。
#   家康の起請文（5月21日）は「その月のうちに」兄弟を→氏規の上洛は8月＝約3か月遅れ（台本では言わない）。
#   上杉景勝：臣従1586→会津へ1598＝12年後。家康の石高：約100万→約250万＝倍を超える（2.5倍）。
#   氏直：永禄5年（1562）生まれとして天正19年（1591）に数えで30（皇朝史略の30歳と合う）。多聞院日記10月29日→実際の11月4日＝6日前。
#   狭山藩：1616→1869＝253年＝約250年（カードの数と合う）。廃藩置県1871の約2年前（明治2年12月→明治4年7月で1年半あまり。台本は「廃藩置県を待たずに」だけ）。
# 確かめられなかったこと（台本では言わない）：家康の起請文の原文（督姫を返す件）・宣戦の朱印状の5か条の全文・氏規の謁見の正しい日・上洛費用のもとの史料名・
#   黒田基樹の著書の「上洛していれば」の頁（Wikipedia の注だけ）・研究者が「北条が残れば家康は関東に移らなかった」と書いた文。
# 絵：Gemini（Chrome）で新しい絵を作り、足りない所は前の回の Gemini の絵（城・書状・陣・街道）を写して使う。一覧は scripts/story/hojo_main_look.yaml の頭。
#   実在の絵は北条氏政像・小田原城図・広重の小田原・聚楽第図屏風ほかのパブリックドメイン。切腹・処刑・磔の場面は描かない。
