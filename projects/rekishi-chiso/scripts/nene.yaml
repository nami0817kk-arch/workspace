# ねね（高台院）（A作品・10/23 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：ねねとは何者だったのか」）
# 冒頭の一点：没日（寛永元年9月6日・1624年）は確かだが、享年76は天文18年説の場合（11年説なら83・17年説なら77）。生年は天文11年（1542）・17年（1548）・18年（1549）の3説で最大7年の差。名前も「ねね」「おね」「ねい」で割れる。
#   答えは第1節の問いから、まとめで戻る（福田千鶴は画賛「春秋七十有六」から天文18年説、黒田基樹も同意。名前は福田＝諱はねい・愛称ねね／黒田＝ねね（寧々）が妥当）。
# 事実の出どころは dev/output/rekishi-chiso/research/nene_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/nene_assets.md。
# 決まり：①日付は和暦で言う。西暦は年表・card の年・節の年にだけ出す（語りでは「慶長5年、1600年」のように初出のみ併記）。
#   ②使わない話（入れない）：「信長が秀吉の浮気を叱った」を事実として（書状は「励ます趣旨と説明される」まで。叱った記録は確認できなかったと言う）／
#     結婚の長屋・藁・竹簀子・土間の祝言を事実として（後世の話・出典を言う）／三本木の隠棲／関ヶ原で家康に寄り添ったと断定／淀殿との不仲の断定／秀吉の便秘の手紙／ネットの個人ブログ。
#   ③書状の年は言わない（年不詳。「天正4年ごろ」の説明は未確認）。信長書状の筆跡は右筆・楠長諳（桑田忠親の指摘。宮本義己は書状を夫婦の関係を保たせる趣旨と読む）。
#   ④関ヶ原の通説（淀殿との対立→東軍）・跡部信（淀殿と連携し大津城の講和・戦後処理）・白川亨（西軍寄りの可能性。根拠は辰姫・東殿・行長の母・孝蔵主・梵舜日記）は並べて、決着はついていないと言う。
#     三成と不仲は「通説」と言い、白川亨が結びつく材料を挙げると並べる。「不仲だった」と言い切る材料は確認できていない、まで。
#   ⑤人物のセリフは入れない（秀吉の手紙は趣旨の言い換え。原文の引用もしない）。⑥年齢は数え。肖像の「この時○歳」は出さない（生年が割れるため age: false）。
#   ⑦背景に人物の肖像・拡大絵・縦の継ぎ目のある三連絵・大字のある絵を使わない。NDL 系は trim 版。歌麿の北政所・醍醐花見の部分図は portrait に caption つきで。血・遺体・首・切腹の絵は使わない。
#   読みの注意：高台院＝こうだいいん／北政所＝きたのまんどころ／寧々＝ねね／杉原定利＝すぎはらさだとし／朝日殿＝あさひどの／木下家定＝きのしたいえさだ／浅野長勝＝あさのながかつ／福田千鶴＝ふくだちづる／黒田基樹＝くろだもとき／
#     旧事考異＝きゅうじこうい／渡辺世祐＝わたなべせいゆう／田端泰子＝たばたやすこ／森家先代実録＝もりけせんだいじつろく／簀子＝すのこ／薄縁＝うすべり／楠長諳＝くすのきちょうあん／右筆＝ゆうひつ／石松丸＝いしまつまる／
#     宮本義己＝みやもとよしみ／聚楽第＝じゅらくだい／准三后＝じゅさんごう／孝蔵主＝こうぞうす／上臈＝じょうろう／有馬則頼＝ありまのりより／黒印状＝こくいんじょう／醍醐＝だいご／西の丸殿＝にしのまるどの／松の丸殿＝まつのまるどの／
#     三の丸殿＝さんのまるどの／加賀殿＝かがどの／曲直瀬道三＝まなせどうさん／跡部信＝あとべまこと／白川亨＝しらかわとおる／辰姫＝たつひめ／東殿＝ひがしどの／言経卿記＝ときつねきょうき／義演准后日記＝ぎえんじゅごうにっき／
#     勧修寺晴子＝かじゅうじはるこ／梵舜日記＝ぼんしゅんにっき／小早川秀秋＝こばやかわひであき／弓箴善彊＝きゅうしんぜんきょう／寛政重修諸家譜＝かんせいちょうしゅうしょかふ／木下利房＝きのしたとしふさ／足守＝あしもり／豊国社＝とよくにしゃ／養老料＝ようろうりょう。
title: ねね（高台院）｜秀吉の妻の生まれた年は、3つの説に割れている
