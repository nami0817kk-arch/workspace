en:
  title: "Nene (Kodai-in): Three Theories on the Birth Year of Hideyoshi's Wife"
  description: |-
    Nene, Toyotomi Hideyoshi's lawful wife, later called Kita no Mandokoro and then Kodai-in, died on the 6th day of the 9th month of Kan'ei 1 (October 17, 1624). The death date is certain, but her age at death (76 by Japanese count) holds only if she was born in 1549, and her birth year is split among three theories (1542, 1548 and 1549), and even her name is debated: Nene, One or Nei.
    This video digs into her life from her birth in Owari Province and separates what contemporary records show from what later books say: the date of her marriage, the famous humble wedding story, the kana letter that Oda Nobunaga's secretary wrote for him, her post as Kita no Mandokoro, Hideyoshi's handwritten letter about the newborn Hideyori, the Daigo cherry-blossom party of 1598, her role around Sekigahara as seen by different scholars, the founding of Kodai-ji, and her death.
    We say plainly where sources and scholars disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1624: Three Theories on Her Birth Year"
    - "1561: Born in Owari, Married to Hideyoshi"
    - "Nobunaga's Letter and a Couple Without Children"
    - "1585: Kita no Mandokoro and the Junior First Rank"
    - "1593: Hideyori's Birth and the Daigo Cherry-Blossom Party"
    - "1598: After Hideyoshi's Death, Mitsunari and Sekigahara"
    - "1603: Kodai-in, Kodai-ji, Yodo-dono and Hideyori"
    - "1614: The Siege of Osaka and Her Death"
    - "Summary: Who Was Nene?"

