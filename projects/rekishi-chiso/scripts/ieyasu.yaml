# 徳川家康（10/16 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：徳川家康とは何者だったのか」）
# 冒頭の一点：「鳴かぬなら」の句は、家康が詠んだ記録がない（最古級は没後160年以上あとの随筆『耳嚢』）。しかみ像は三方ヶ原の節で。
# 事実の出どころは dev/output/rekishi-chiso/research/ieyasu_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/ieyasu_assets.md。
# 決まり：①日付は和暦の月日で言う。生年の西暦（1542年か1543年か）は言わず「天文11年の暮れ」。西暦の無い日付（桶狭間・将軍宣下・夏の陣）は西暦を言わない。
#   ②しかみ像・鳴かぬなら・狸親父・伊賀越えの半蔵・問い鉄砲・堀の詐術は「後世の話」と先に断ってから言う。
#   ③兵力・死者・石高は何の数かを言い、割れていれば割れていると言う。④小山評定・秀秋の裏切りの時刻・大坂の陣の家康の意図は「研究者の間で割れている」で、どちらも事実のように言わない。
#   ⑤人物のセリフは入れない（記録に残る本人の言葉だけ。家康自身の書状の言葉「追い出し申し候」だけ引く）。⑥年齢は数え。肖像の「この時○歳」は出さない（生年の西暦が割れるため）。
#   ⑦残酷な場面（信康・築山殿の最期、秀頼・淀殿の最期、国松の処刑）は事実の1行だけ。影武者説・黒幕説・脱糞の話は使わない。
title: 徳川家康｜「忍耐」「狸」「謀略」「神君」…その札は、本人が付けたものではなかった
