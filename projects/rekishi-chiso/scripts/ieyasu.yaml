sections:
  # ---------------------------------------------------------------- 1 導入
  - title: 1616年 徳川家康の死と、四つの札
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    portrait: {image: paintings/nene_ieyasu_portrait.jpg, caption: "徳川家康（狩野探幽画、17世紀）", age: false}
    year: 1616
    lines:
      - 語り: 「鳴かぬなら、鳴くまで待とう、ホトトギス」。家康を表す句として、誰もが知っています。ところが、家康がこの句を詠んだ、という記録は、ありません。
        card: {head: 鳴かぬなら, body: 家康が詠んだ記録はない}
        short: s1
      - 聞き: え、家康の句じゃないの？ 教科書みたいに、当たり前に聞いてきたのに。
        tone: 驚き
        short: s1
      - 語り: 最古級の記録は、ねぎしやすもりの随筆『耳嚢』です。天明年間、1780年代から書き継がれた本で、家康の死から、160年以上あとになります。
        short: s1
      - 聞き: 160年も後？ じゃあ、家康本人が言ったかどうかは、分からないんだね。
        short: s1
      - 語り: 家康には、後から付けられた札が、いくつもあります。「忍耐」。「狸親父」。「謀略」。そして、「神君」。今日は、この4つの《札》を、一枚ずつ剥がして、記録で言える家康を掘ります。
        short: s1
      - 聞き: 札を剥がす、か。家康が実際に言ったことと、後の人が言ったことを、分ける作業だね。
      - 語り: 元和2年4月17日。家康は、駿府城で亡くなります。数えで75歳。では、その75年を、生まれから順に掘りましょう。
      - 聞き: 75年って、今の感覚でも長生きだよね。その長さを、順に掘っていくんだ。

  # ---------------------------------------------------------------- 2 人質
  - title: 1547年 6歳の人質と、尾張の2年
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    year: 1547
    lines:
      - 語り: 家康は、天文11年の暮れ、三河の岡崎城で生まれました。幼い名は、竹千代。父は、松平広忠です。
        card: {head: 天文11年の暮れ, body: 三河の岡崎城に生まれる}
      - 聞き: 西暦だと、1542年か、1543年か、どっちなの？
        tone: 疑問
      - 語り: 実は、百科事典の中でも、割れています。和暦の暮れ、としか言えません。そして、天文16年、数えで6歳。家康は、今川家へ、人質に出されます。
      - 聞き: 6歳で人質。それは、つらい子ども時代だったんだろうな。
      - 語り: ところが、途中の田原城で、戸田氏の裏切りに遭います。家康は、今川ではなく、織田信秀のもとへ送られてしまうのです。
      - 聞き: 行き先が、いきなり敵の家に変わったんだ。
      - 語り: 織田家には、約2年います。尾張の熱田、加藤順盛の屋敷に、留め置かれました。幼い信長と会って、親しくなった、という話もありますが、史料には、ありません。
        card: {head: 約2年, body: 尾張の熱田で人質に}
      - 聞き: 信長との出会いは、伝承なんだ。
      - 語り: 天文18年の人質交換で、家康は駿府へ移ります。14歳で元服し、のちに、今川一門の築山殿を、妻に迎えます。
      - 聞き: 14歳で元服して、今川一門の人と結婚か。今でいうと、中学生で結婚する感じだよね。
      - 語り: 「幼いころの苦労が、忍耐の人を作った」。これが、一つ目の札です。ただし、研究者の柴裕之さんは、人質という見方そのものに、疑問を投げています。
        card: {head: 一つ目の札, body: 忍耐の人}
      - 聞き: 苦労した子ども、っていうストーリーは、後からのほうが作りやすいもんね。
      - 語り: 6歳で出た子は、駿府で、どんな扱いを受けたのか。そして、今川義元が討たれた日、何をしたのか。次は、桶狭間のあとです。
        hook: true
      - 聞き: 桶狭間で義元が死んだあと、家康は、すぐ独立したんだよね。
        hook: true

  # ---------------------------------------------------------------- 3 桶狭間のあと
  - title: 1560年 桶狭間のあと、岡崎城へ
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    year: 1560
    lines:
      - 語り: 永禄3年5月18日。家康は、鷲津と丸根の砦の間を抜けて、大高城に兵糧を運び入れます。翌19日に、桶狭間の戦い。今川義元が、討たれました。
        card: {head: 永禄3年5月19日, body: 桶狭間の戦い 義元が討たれる}
      - 聞き: 家康は、このとき、何歳だったの？
        tone: 疑問
      - 語り: 数えで19歳です。そして、わずか数日後の23日には、自分の城、岡崎城に入っています。
      - 聞き: 数日で、もう帰ってたんだ。
      - 語り: このとき、家康は「捨城ならば拾おう」と言った、という話があります。ただ、出典は、昭和9年に出た本です。同じ時代の言葉とは、確かめられません。
        card: {head: 後世の話, body: 「捨城ならば拾はん」は昭和9年の本}
      - 聞き: 名言っぽいけど、昭和に出来た言葉だったんだ。
      - 語り: 家康は、そのあと織田信長と、同盟を結びます。清洲同盟です。永禄4年とも5年とも、割れています。永禄7年には、三河一向一揆。これを、鎮めました。
      - 聞き: 信長と家康の同盟って、あとの天下の形に、そのままつながりそうだよね。
      - 語り: 永禄9年の暮れ、松平から徳川に、姓を改めます。三河守になり、朝廷の許しを得ました。ここで初めて、「徳川家康」が、世に出ます。
        card: {head: 永禄9年12月, body: 松平から徳川に改姓}
      - 聞き: 徳川って名乗ったのは、このときからなんだ。 恩を返す気持ちがあったかどうかは、分からないままなんだね。
      - 語り: 三河を固めた家康は、遠江へ進みます。そこで、生涯最大の敗戦が、待っていました。三方ヶ原です。
        hook: true
      - 聞き: 信玄に、ぼろ負けしたやつだ。
        hook: true

  # ---------------------------------------------------------------- 4 三方ヶ原
  - title: 1573年 三方ヶ原の戦いとしかみ像
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    year: 1573
    lines:
      - 語り: 元亀3年の10月、武田信玄が、西へ向けて軍を動かします。12月に二俣城が落ち、22日、三方ヶ原で、徳川と織田の連合軍は、信玄と戦います。
        card: {head: 元亀3年12月22日, body: 三方ヶ原の戦い 家康が大敗}
        short: s2
      - 聞き: 家康は、浜松城で守る作戦じゃなかったの？
        tone: 疑問
        short: s2
      - 語り: 家康は、籠城をやめて、出陣しました。理由は、挑発に乗ったという通説のほか、信玄の狙いに応じた、という新しい説もあって、割れています。
      - 聞き: 浜松城に籠もっていれば、まだ守れたかもしれないのに。なんで出ちゃったんだろう。
      - 語り: 戦いは、日没までの約2時間ほどで、徳川と織田の側が敗れます。家康は、夏目吉信らが身代わりになって、浜松へ逃げ帰った、と伝わります。
        short: s2
      - 聞き: 2時間で大敗か。信玄の軍が、どれだけ強かったか、ってことだよね。 そして、有名なのが、あの絵だよね。家康が、負けたあとの顔を、描かせたっていう。教科書にも載ってた気がする。
      - 語り: 徳川美術館にある、しかみ像です。顔をしかめて座る家康の姿を、「三方ヶ原で負けた家康が、戒めのために描かせた」と語るのが、通説でした。
        card: {head: しかみ像, body: 「戒めの自画像」と語られてきた}
        short: s2
      - 聞き: 負けた自分を忘れないために、描かせた。いい話だなあ。
        short: s2
      - 語り: ところが、徳川美術館自身が、この伝承に「史料的な根拠はない」と書いています。1880年の目録では、「長篠戦役の陣中の像」。1910年の『国華』も、長篠です。
        card: {head: 目録の題, body: 昔は「長篠戦役」とあった}
      - 聞き: え、三方ヶ原じゃなくて、長篠だったの？
        tone: 驚き
      - 語り: 三方ヶ原と結びつけた記述は、1936年の新聞記事まで、さかのぼれません。「家康自身が描かせた」という説明が加わるのは、1972年の図録です。
        card: {head: 1936年, body: 三方ヶ原と結んだ最古の記述}
        figure: {type: numberline, title: しかみ像が三方ヶ原と結びつくまで, items: [[三方ヶ原の戦い, 1573], [目録の題は「長篠戦役」, 1880], [新聞記事で三方ヶ原と結ぶ, 1936], [図録が「自ら描かせた」と説明, 1972]], unit: 年, focus: 新聞記事で三方ヶ原と結ぶ, note: 結びついたのは戦いの360年以上あと}
      - 聞き: 昭和になってから、そういう話になったんだ。じゃあ、絵は、いつの時代の？
      - 語り: 制作は、江戸時代の17世紀ごろ、と見られています。幕府が家康を神として祀る中で描かれた、礼拝の像だ、という見方が有力です。
      - 聞き: 幕府が家康を神様にしていく中で描かれた絵なら、礼拝用の肖像みたいなものかな。
      - 語り: 「負けても立ち上がる、忍耐の人」。この像に、後の時代の人たちが、そんなイメージを重ねた、と研究者の千田嘉博さんは、指摘しています。
      - 聞き: 忍耐の札は、絵にまで貼られてたんだね。
      - 語り: 脱糞した、小豆餅を食べて逃げた、城門を開け放って敵を引かせた。こうした逸話も、出典が後世か、不明確です。ここでは、使いません。
      - 聞き: 下品な話は使わない、って決めてるんだね。ありがたい。
      - 語り: 三方ヶ原のあと、信玄は、病で亡くなります。家康は、織田信長とともに、武田勝頼と、長篠で向き合います。
        hook: true
      - 聞き: 鉄砲の三段撃ちで勝ったやつだね。
        hook: true

  # ---------------------------------------------------------------- 5 長篠と信康
  - title: 1575年 長篠の戦いと、家の中の傷
    background: {image: paintings/nobunaga_nagashino_screen_full.jpg, credit: "《長篠合戦図屏風》（江戸時代）"}
    year: 1575
    lines:
      - 語り: 天正3年5月21日。長篠の戦いで、織田と徳川の連合軍が、武田勝頼に勝ちます。兵力は、織田と徳川が約3万8千、武田が約1万5千、とされます。数は、割れています。
        card: {head: 天正3年5月21日, body: 長篠の戦い 武田に勝つ}
      - 聞き: 信長の三段撃ちで勝った、って習ったけど。
        tone: 疑問
      - 語り: 三段撃ちは、江戸時代の創作が広まったもので、実際に行われたかは、疑わしい、と見られています。鉄砲の数は、約1000挺が有力です。
        card: {head: 後世の話, body: 三段撃ちは疑わしい}
      - 聞き: 教科書の定番が、疑わしいなんて。
      - 語り: しかも長篠城は、家康の領国の城です。奥平貞昌が少ない兵で守り、鳥居強右衛門が援軍を呼びに走って、捕らえられ、処刑されました。
      - 聞き: 信長の戦、というより、徳川の戦いでもあったんだね。家康にとって、長篠は、自分の領国を守る戦いだったんだ。
      - 語り: その大勝利の4年後。天正7年。家康は、正妻の築山殿と、嫡男の信康を、失います。信康事件です。
        card: {head: 天正7年, body: 信康事件}
      - 聞き: 信長に命令された、って聞いたことがある。
        tone: 疑問
      - 語り: 通説は、信長の詰問を受けて、築山殿を殺し、信康を切腹させた、というものです。ところが、信長は「家康の思い通りにせよ」と述べた、とする史料もあります。
      - 聞き: 「思い通りにせよ」って言ったなら、信長は、そこまで求めてなかったのかも。
      - 語り: 家康自身の書状には、「去る四日、岡崎を追い出し申し候」と、あります。何が原因だったのか。武田との内通説、家康と信康の対立説。研究者の間でも、割れています。
        card: {head: 家康の書状, body: 「岡崎を追い出し申し候」}
      - 聞き: 「追い出した」って、家康本人が書いてるのか。重い。
      - 語り: 戦国最大の勝ち戦の4年後に、家の中の傷を、負った。「忍耐の人」という札の裏に、そんな年が、あったのです。
      - 聞き: 我慢強い、っていう言葉で、片づけられない話だね。
      - 語り: そして天正10年。家康は、生涯最大の危機に、直面します。本能寺の変の日、家康は、京の近くにいました。
        hook: true
      - 聞き: 神君伊賀越えだ。
        hook: true

  # ---------------------------------------------------------------- 6 伊賀越え
  - title: 1582年 神君伊賀越え
    background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
    year: 1582
    lines:
      - 語り: 天正10年5月、家康は、安土で、明智光秀の接待を受けます。そのあと、信長の勧めで、京や堺を見物していました。6月2日。本能寺の変が、起こります。
        card: {head: 天正10年6月2日, body: 本能寺の変 家康は堺にいた}
        short: s3
      - 聞き: 信長が死んだとき、家康は近くにいたんだ。
        short: s3
      - 語り: 家康は、京へ戻ることも考えた、と伝わります。しかし、家臣に説得されて、三河へ帰る道を選びます。これが、「神君伊賀越え」です。
      - 聞き: 敵だらけの中を、逃げたんだよね。
      - 語り: 随行は、約34人、とされます。酒井忠次、本多忠勝、服部半蔵らの名が挙がります。ただし、この人数と顔ぶれは、江戸時代の史料によるもので、確実とは言えません。
        card: {head: 随行は約34人, body: 後世の史料による}
        short: s3
      - 聞き: 人数まで後世の史料だと、ほんとは何人だったかも、分からないのかな。
      - 語り: では、どの道を通ったのか。『石川忠総留書』は、桜峠。『徳川実紀』は、別の峠。『戸田本三河記』は、甲賀経由。史料の間で、割れているのです。
        card: {head: 経路は割れる, body: 峠も道すじも史料で違う}
        short: s3
      - 聞き: 生涯最大の危機なのに、どこを通ったかも、はっきりしないの？
        tone: 驚き
        short: s3
      - 語り: 服部半蔵と伊賀者が、家康を守り抜いた、という話も有名です。ただ、研究者の藤田達生さんは、江戸時代に伊賀者の地位を高めようとする意図の反映、と見ています。
      - 聞き: 伊賀者の評判を上げるための話だった、ってことか。
      - 語り: 伊勢の商人、角屋七郎次郎が船を出して、海路で三河へ渡った、という話もあります。これも、後世の史料です。無事に岡崎へ着いたことは、確かです。
      - 聞き: 海路で逃げたなら、峠は、どこを通ったことになるんだろう。 神君の札が、貼られた場面なのに、中身は薄いんだ。
      - 語り: 信長の死で、天下は、大きく動きます。家康は、羽柴秀吉と、戦うことになります。小牧・長久手です。
        hook: true
      - 聞き: 家康が、秀吉に勝った戦だよね。
        hook: true

  # ---------------------------------------------------------------- 7 小牧・長久手から関東へ
  - title: 1584年 小牧・長久手の戦いと臣従
    background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧・長久手合戦図屏風》（江戸時代）"}
    year: 1584
    lines:
      - 語り: 天正12年3月、池田恒興が羽柴方に付いて犬山城を占拠。家康は、小牧山に入ります。4月9日、長久手。ここで、家康の軍は、羽柴方に勝ちました。
        card: {head: 天正12年4月9日, body: 長久手 家康方が勝つ}
      - 聞き: 秀吉に、勝ったんだね。
      - 語り: 羽柴方は、池田恒興と森長可が戦死。死者は約2千5百、織田・徳川方は約590、とされます。ただ、兵力は、羽柴約10万、織田・徳川約3万と、数が割れています。
      - 聞き: 勝ったのは、局地戦、ってことかな。
      - 語り: そのとおりです。11月、秀吉は、織田信雄と単独で講和します。戦う理由を失った家康も、講和し、息子の於義丸を、秀吉の養子に出しました。
        card: {head: 天正12年11月, body: 秀吉が信雄と単独講和}
      - 聞き: 戦には勝ったのに、政治で負けた、みたい。
      - 語り: 天正14年の1月には、家康の重臣、石川数正が、秀吉のもとへ出奔します。10月27日。家康は、大坂城で秀吉に会い、臣従を表明しました。
        card: {head: 天正14年10月27日, body: 大坂城で秀吉に臣従}
      - 聞き: 戦で勝った相手に、2年後に頭を下げるんだ。悔しくなかったのかな。
      - 語り: ここで言えるのは、研究者の間でも、評価が割れていることです。局地戦は家康、戦略は秀吉。「家康が優位だった」という通説を、見直す動きもあります。
      - 聞き: 勝ち負けの評価も、見方で変わるんだね。戦と政治で、物差しが違う感じ。
      - 語り: 天正18年7月、北条氏が降伏。家康は、長年の領国の5か国を、取り上げられます。そして8月1日、関東へ移され、江戸城に入りました。
        card: {head: 天正18年8月1日, body: 関東へ移され、江戸城に入る}
      - 聞き: 取り上げられた日に、江戸に入ったんだ。 江戸の始まりも、イメージ先行なのかな。
      - 語り: 豊臣政権の中で、いちばんの大名になった家康。秀吉の死のあと、天下の形が、また動きます。関ヶ原です。
        hook: true
      - 聞き: 謀略の達人、の札が貼られた戦いだ。
        hook: true

  # ---------------------------------------------------------------- 8 関ヶ原
  - title: 1600年 関ヶ原の戦い 謀略の達人の像
    background: {image: paintings/nene_sekigahara_screen_gifu.jpg, credit: "《関ヶ原合戦図屏風》（江戸時代）"}
    year: 1600
    lines:
      - 語り: 慶長5年7月17日、石田三成らの側から、家康を責める「内府ちがひの条々」が、諸大名に送られます。19日には、毛利輝元が大坂城へ入り、伏見城への攻撃が始まります。
        card: {head: 慶長5年7月, body: 西軍が挙兵}
      - 聞き: 家康は、そのとき関東にいたんだよね。
      - 語り: 家康は、7月25日、小山で、会議を開いて、諸将の心をつかみ、西へ向かった。いわゆる、小山評定です。ただし、この会議があったかどうかは、研究者の間で、論争中です。
        card: {head: 小山評定, body: あったかどうかは論争中}
      - 聞き: 有名な場面が、あったかどうか、割れてるの？
        tone: 驚き
      - 語り: 白峰旬さんは、根拠の史料の成立時期が不明で、一次史料と食い違うと疑います。一方、本多隆成さん、笠谷和比古さんたちは、実在を主張しています。
      - 聞き: あったか、なかったかで、研究者が分かれるなんて、関ヶ原は、まだ決着してない話なんだね。
      - 語り: 9月15日、関ヶ原。兵力は、東軍が7万4千から10万4千、西軍が8万以上、などの諸説があります。どちらの数字も、推定です。
        card: {head: 慶長5年9月15日, body: 関ヶ原の戦い}
      - 聞き: 勝負を決めたのは、小早川秀秋の裏切りだよね。
      - 語り: その裏切りの時刻が、割れています。笠谷さんは、開戦から数時間たった、昼ごろ。白峰さんは、開戦直後、午前10時ごろ、と見ています。2時間ほど、違います。
        card: {head: 秀秋の裏切り, body: 時刻は研究者で割れる}
        short: s4
      - 聞き: 2時間も違うんだ。それで、有名なのが、あの鉄砲の話か。
        short: s4
      - 語り: 家康が、松尾山の秀秋に鉄砲を撃ち込んで、決断を迫った。問い鉄砲です。ところが、同時代に近い『内府公軍記』にも、『当代記』にも、『三河物語』にも、ありません。
        card: {head: 問い鉄砲, body: 同時代の記録にはない}
        short: s4
      - 聞き: 撃ち込んだ話が、書かれてないなんて。
        short: s4
      - 語り: 初めて載るのは、寛文3年、1663年の『慶長軍記』と、呉座勇一さんは指摘しています。今の形になるのは、1727年の『落穂集』です。
        short: s4
      - 聞き: どちらにしても、「撃った」とまでは、言い切れないってことだ。
      - 語り: 戦後処理で、家康の領地は、255万石から400万石へ。毛利は120万石から30万石へ。上杉は、120万石から30万石へ。数字は、「諸説あり」とされます。
        card: {head: 家康領, body: 255万石から400万石へ（諸説）}
        figure: {type: bars, title: 関ヶ原の前後の石高（万石・諸説あり）, bars: [[毛利 前, 120.5], [毛利 後, 29.8], [上杉 前, 120], [上杉 後, 30], [家康 前, 255], [家康 後, 400]], labels: [約120万, 約30万, 120万, 30万, 255万, 400万]}
      - 聞き: 数字がすごく大きく動くけど、どれも「諸説あり」なんだね。 謀略の達人っていうより、不安定な情勢の中で、勝ちをつかんだ感じ。 江戸幕府だね。
        hook: true

  # ---------------------------------------------------------------- 9 幕府と大坂の陣
  - title: 1603年 江戸幕府と大坂の陣
    background: {image: paintings/nene_osaka_zu_byobu.jpg, credit: "《大坂図屏風》（江戸時代）"}
    year: 1603
    lines:
      - 語り: 慶長8年2月12日。家康は、伏見城で、征夷大将軍の宣旨を受けます。右大臣や源氏長者も、同時に、与えられました。
        card: {head: 慶長8年2月12日, body: 征夷大将軍の宣旨}
      - 聞き: 西暦だと、いつなの？
        tone: 疑問
      - 語り: 一般には、1603年の3月とされますが、今回確かめた資料には、書かれていませんでした。西暦では言わず、和暦で言います。
      - 聞き: 分からない西暦を、無理に言わないのは、誠実でいいと思う。 和暦のままのほうが、聞いていて混乱しないしね。
      - 語り: 慶長10年4月16日。将軍職は、息子の秀忠に譲られ、世襲が示されます。家康は、駿府を拠点に、大御所として、政治を続けます。
        card: {head: 慶長10年4月16日, body: 秀忠が将軍に 家康は大御所に}
      - 聞き: 将軍をやめても、権力は手放さなかったんだ。
      - 語り: そして、慶長19年。方広寺の鐘の銘文に、京都五山の長老が、不敬だと判断します。「国家安康」の字が、家康の名を切っている、という言いがかりだった、と言われてきた事件です。
        card: {head: 方広寺の鐘銘事件, body: 慶長19年8月18日}
      - 聞き: 家康が、わざとケチをつけた、って習ったよ。
      - 語り: 通説は、家康と以心崇伝が仕組んだ謀略、でした。ただ、近年は、崇伝の関与はなかった、とされます。河内将芳さんは、家康が銘を削る内意を示した記録を、指摘しています。
      - 聞き: 謀略だった、とも、そうじゃなかった、とも、言い切れないんだ。
      - 語り: 冬の陣のあとの講和で、大坂城の堀を埋めた話は、有名です。「惣堀を埋める」を、家康が「すべて」と解釈して、内堀まで埋めた、という、詐術の話です。
        card: {head: 後世の話, body: 堀の詐術は同時代の記録にない}
        short: s5
      - 聞き: 約束を、ずるく解釈した、って話だよね。
        short: s5
      - 語り: ところが、この詐術の話は、後の書物にしか見えません。伊達政宗や細川忠利らの書状にも、紛争の形跡は、ありません。講和で二の丸と三の丸を壊す合意は、あったとされます。
        short: s5
      - 聞き: 全部埋めたかどうかは、はっきりしないのか。
        short: s5
      - 語り: 慶長20年5月7日、天王寺と岡山で戦い。翌8日、秀頼と淀殿らが、自害します。ここで、有名な逸話が、もう一つあります。真田信繁が、家康の本陣に迫った、という話です。
        card: {head: 慶長20年5月8日, body: 秀頼らが自害}
      - 聞き: 家康が、死を覚悟した、ってやつだ。
      - 語り: そして、秀頼の最期を決めたのは、実は、家康ではなく、将軍の秀忠の判断だった、と伝わります。秀頼の妻、千姫の助命を求められた家康は、判断を、秀忠に委ねました。
        card: {head: 秀頼の最期, body: 決めたのは秀忠の判断とされる}
      - 聞き: 家康が、手を下したんじゃないんだ。大坂の陣の見方が、変わっちゃう。
      - 語り: 大坂の陣の翌年。家康は、駿府で、病に倒れます。
        hook: true
      - 聞き: 鯛の天ぷらで死んだ、っていう話、聞いたことある。
        hook: true

  # ---------------------------------------------------------------- 10 まとめ
  - title: まとめ：徳川家康とは何者だったのか
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    year: 1616
    lines:
      - 語り: 元和2年4月17日、家康は、駿府城で亡くなります。数えで75歳。鯛の天ぷらを食べたのは、1月21日で、死去まで3か月ほど離れています。今は、胃癌説が、主流です。
        card: {head: 元和2年4月17日, body: 駿府城で死去（数え75）}
      - 聞き: 天ぷらの話も、日が合わないんだ。
      - 語り: 病名は、断定しません。『徳川実紀』には、吐血や黒い便、腹のしこりの記録があります。死後の家康は、神として祀られ、江戸時代は、否定的な評価が禁じられていました。
      - 聞き: 悪口を言えない時代が、250年以上も続いたんだね。
      - 語り: 近代の像も、見てみます。山岡荘八の小説は、忍耐の求道者。司馬遼太郎の小説は、「戦が強くはなかったが戦上手」。2000年の朝日新聞社の企画では、日本の顔10人で、1位でした。
      - 聞き: 狸の札も、近代に定着したんだ。
      - 語り: では、4つの札を、記録で言えることに、直します。1つ目、「忍耐」。人質は事実ですが、「苦労が人格を作った」は、像です。しかみ像も、1936年まで、三方ヶ原と結びついていません。
      - 聞き: 整理すると、札ごとに「記録で言えること」が、意外と少ないね。 逆に言うと、記録のほうが、ずっと面白いのかも。
      - 語り: 2つ目、「狸」と、3つ目の「謀略」。小山評定、問い鉄砲、堀の詐術、鐘銘事件。どれも、研究者の間で、割れているか、後世の話です。
      - 聞き: 謀略の逸話は、「家康はずるい」って印象を、作るためのものだったのかな。
      - 語り: 4つ目、「神君」。伊賀越えは、道すじさえ、一致しません。服部半蔵の話は、江戸の史料。神君の札は、幕府が、家康を神にする中で、付けられました。
      - 聞き: 忍耐、狸、謀略、神君。全部、本人が名乗った札じゃなくて、後の人が付けた札、なんだね。
        figure: {type: people, title: 家康に札を貼った人たち, nodes: [[徳川家康, 札を貼られた人], [忍耐, 江戸〜昭和の本・絵], [狸, 小説・ドラマ], [謀略, 軍記・俗説], [神君, 江戸幕府]], edges: [[徳川家康, 忍耐, 後から], [徳川家康, 狸, 後から], [徳川家康, 謀略, 後から], [徳川家康, 神君, 後から]]}
      - 語り: そうです。江戸の編纂者、随筆家、小説家、美術館。いろんな人が、いろんな時代に、家康に札を貼りました。剥がしても、家康は、消えません。残るのは、史料に書かれた、一人の人間です。
      - 聞き: 6歳で人質に出て、妻と息子を失って、勝った相手に頭を下げて、75歳まで生き抜いた。あーしは、その長さのほうが、札より重く感じるかな。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 次回は、黒田官兵衛。半兵衛と並んで「両兵衛」って言われてるけど……その像は、誰が作ったの？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
