en:
  title: "Tokugawa Ieyasu: 'Patient', 'Tanuki', 'Schemer', 'Divine Lord' - Labels He Never Gave Himself"
  description: |-
    "If the cuckoo does not sing, wait until it sings." This poem is said to describe Tokugawa Ieyasu, but no record shows he wrote it; the oldest known version appears in an essay written more than 160 years after his death.
    This video digs into Ieyasu's life from childhood hostage to the shogun's seat and the Siege of Osaka, and separates what the records show from the stories added later: the "shikami" portrait that was not tied to the Battle of Mikatagahara until the 1930s, the escape through Iga, the Battle of Sekigahara (the Komine council, the "inquiry shot" at Kobayakawa Hideaki, and the time of the betrayal that scholars still dispute) and the Osaka moats.
    We say plainly where historians disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1616: The Death of Ieyasu and Four Labels"
    - "1547: A Six-Year-Old Hostage"
    - "1560: After Okehazama, Back to Okazaki Castle"
    - "1573: Mikatagahara and the Shikami Portrait"
    - "1575: Nagashino and the Wound Inside the Family"
    - "1582: The Escape Through Iga"
    - "1584-90: Komaki-Nagakute, Submission and the Kantō Transfer"
    - "1600: Sekigahara"
    - "1603-15: The Shogunate and the Siege of Osaka"
    - "Summary: Who Was Tokugawa Ieyasu?"

