# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1789年7月14日。パリの民衆が攻め落としたバスティーユにいた囚人は、7人だけでした。
  その3週間前、国王ルイ16世は、国民の代表の同意なしに新しい税をかけない、という宣言を読み上げさせていました。
  フランス革命は、避けられなかったのでしょうか。
  この動画でわかること
  ・1776年、改革の大臣テュルゴーが外されるまでに、記録に残ったこと
  ・1787年の名士会で、カロンヌの全土の土地税が退けられた経緯
  ・1788年の雹の嵐と、国庫の支払いの一部が紙の証券になったこと、1789年の陳情書に書かれていたこと
  ・1789年6月23日に国王が示した35か条の中身と、譲らなかった線
  ・フランス革命が起きなかった場合に、記録から言えること、言えないこと
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（議会の記録『アルシーヴ・パルルマンテール』、テュルゴーの著作集と勅令、カロンヌの演説、ネッケルの会計報告、科学アカデミーの報告、陳情書の翻刻、アーサー・ヤングの旅行記、ファンク・ブレンターノの研究、ルイ16世の日記の刊本、トクヴィル『旧体制と大革命』、イギリス国立公文書館・各県の文書館・美術館の解説など）を語りで示してから、日本語に訳して読んでいます。
  ネッケルの1781年の収支、ミラボーの言葉、バスティーユの日のパンの値段は、記録や研究者によって書き方が割れています。
  フランス革命が起きなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、ルイ・シャルル・オーギュスト・クデール、ジャック・ルイ・ダヴィッド、ユベール・ロベール、エリザベト・ヴィジェ・ルブランほかの絵画・版画（ウィキメディア・コモンズ、パブリックドメイン）と、画像生成AIで作った想像上の風景です。
  サムネイルの絵は AI による想像図です。

en:
  title: "If the French Revolution Had Never Happened: The King's Offer Three Weeks Before the Bastille"
  description: |-
    On July 14, 1789, the Bastille held only seven prisoners.
    Three weeks earlier, Louis XVI had a declaration read out: no new tax would be created without the consent of the nation's representatives.
    Was the French Revolution unavoidable?
    In this video you will learn:
    - What the records show about the fall of the reforming minister Turgot in 1776
    - How Calonne's land tax for the whole kingdom was rejected by the Assembly of Notables in 1787
    - The hailstorm of 1788, Treasury payments partly made in paper notes, and what the cahiers of 1789 asked for
    - What the king offered on June 23, 1789, in thirty-five articles, and what he refused to give up
    - What can be said, and what cannot, about a France without the Revolution
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Seven Prisoners: July 1789"
    - "Turning Point 1: Why Was Turgot Dismissed? 1771-1776"
    - "Turning Point 2: Why Did the Notables Say No? 1781-1787"
    - "1788: The Treasury and the Sky Gave Way"
    - "Did the Cahiers Ask to End the Monarchy? Spring 1789"
    - "Turning Point 3: What Did the King Offer on June 23?"
    - "July 14 at the Bastille"
    - "Could It Have Been Avoided? What Historians Say"
    - "Summary: What Can Be Said Without the Revolution?"

