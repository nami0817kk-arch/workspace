# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と kurofune-if-story.yaml の型）。フランス革命（もしもシリーズ）。2026-10-31 下書き。
# 公開の予定は 11/5 12:00（昼＝B作品のif）。
# 型：分岐点を3つ並べる型。1本に1つの「なぜ」＝「フランス革命は、避けられなかったのか。もしも起きなかったら、何が言えるのか」。
#   語り手は剣崎1人（つむぎは出ない）。想像の台詞は入れない。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない。
#   冒頭（10秒以内）＝バスティーユにいた囚人は7人だけ。その3週間前、国王は「代表の同意なしに新しい税をかけない」と読み上げさせていた。
#   序章で答えを言い切らない。最後に「言えること／言えないこと」を分ける。
#   第1章 分岐点1 テュルゴーは、なぜ外されたのか（1771〜1776）／第2章 分岐点2 名士会は、なぜ断ったのか（1781〜1787）／
#   第3章 1788年、金庫と空が同時に崩れた／第4章 陳情書は、王をやめろと書いたのか（1789年春）／
#   第5章 分岐点3 6月23日、国王は何を差し出したのか／第6章 7月14日、バスティーユで／第7章 歴史家は、避けられたと見るのか／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 公開済みとの重なり：マリー・アントワネット（10/4）で、1788年の予算（支出の半分が借金）・三部会の開会・バスティーユ襲撃・ヴェルサイユ行進を短く扱った。
#   この回は王妃を主役にせず、1788年の予算の数字は使わない。ナポレオン（10/11）とは時期が重ならない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/フランス革命_facts_20261031.yaml、france-if-16〜75）にあるものだけ。行の上に `# fact: france-if-NN`。
#   france-if-01〜15 は調べの種の行で出どころが無い（使わない）。誰でも知る前置き（バスティーユ襲撃・全国三部会・国民議会）は短く使い、# fact を付けない。
#   記録の食い違いは3つだけ並べる：①ネッケルの会計報告とカロンヌの反論（1781年の収支）②ミラボーの言葉の2つの形 ③バスティーユの日のパンの値段（ルデとサザーランド）。
#   ほかに割れる数（名士会の人数・守備兵の数・ヴィジーユの出席者・雹の被害の村の数・陳情書の総数・カロンヌの罷免の日・小麦粉戦争の日）は、
#   1つの出どころの数として「〜によると」で言うか、数を言わない。
#   確かめられなかったこと：ネッケル罷免の日付は一次では議場に伝わった13日だけ（11日は通説。台本では「11日」と言い切らず「7月11日の罷免」は避けた）／
#   「余の後に洪水よ来たれ」・「わたしが望むから合法だ」の原典／5月5日の身分ごとの議員数／囚人7人がいつから入っていたか。台本では言わない。
#
# 絵：paintings/france_*（Commons のパブリックドメインの絵画・版画）＋ AI 絵（F01〜F16、一覧は dev/output/rekishi-chiso/research/france_ai_images.md）。
#   AI 絵の人物は顔を描かない（群衆の後ろ姿・手元・建物・畑・文書・空）。実在の人物（ルイ16世・テュルゴー・ネッケルほか）の顔は AI で描かない。顔が分かるのは実在の絵だけ。
# 広告の配慮：戦闘・負傷・死の場面は描かない（バスティーユは建物と煙だけ・人の傷は描かない）。
