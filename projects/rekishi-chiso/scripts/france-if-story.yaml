sections:
  # ================================================================ 序章（冒頭 約2分30秒）
  - title: 「囚人は、7人だった」　1789年7月
    background: {image: paintings/france_bastille_robert.jpg, credit: "ユベール・ロベール《取り壊しの始まったバスティーユ》（1789年。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1789
    lines:
      # fact: france-if-61
      - 語り: パリの民衆が攻め落としたバスティーユの牢獄に、囚人は、たった《7人》しかいませんでした。1789年7月14日のことです。
        tone: 重い
        card: {head: "1789年7月14日", body: バスティーユの囚人は7人}
      # fact: france-if-61
      - 語り: 偽造の罪の4人、心を病んだ2人、そして家族の願いで閉じ込められていた伯爵が1人です。
      # fact: france-if-55
      - 語り: その、ちょうど3週間前の6月23日。国王ルイ16世は、議員たちの前で、ある宣言を読み上げさせていました。
      # fact: france-if-55
      - 語り: 第1条。国民の代表の同意なしに、新しい税は作らない。古い税も、法で決めた期限を越えては延ばさない。
        tone: 重い
        card: {head: "1789年6月23日", body: 代表の同意なしに新しい税は作らない}
      # fact: france-if-56
      - 語り: 同じ宣言は、農民を道の工事にただで働かせる賦役を、永久になくす、とも書いていました。
      # fact: france-if-25
      - 語り: 賦役をなくそうとしたのは、これが初めてではありません。13年前の1776年にも、同じ国王が、賦役をなくす勅令を出しています。
      # fact: france-if-28
      - 語り: それを進めた大臣のテュルゴーは、その年の5月に外されました。
      - 語り: 王の側も、改革を口にしていた。それでも、革命は起きた。
        tone: しみじみ
      - 語り: フランス革命は、避けられなかったのでしょうか。もしも起きなかったら、フランスはどうなっていたのでしょうか。
        tone: 疑問
      # fact: france-if-68
      - 語り: この革命の67年後、1856年に、フランスの思想家トクヴィルは、こう書きました。悪い政府にとって最も危険な時は、ふつう、改革を始める時だ。
        tone: 重い
      # fact: france-if-65
      - 語り: バスティーユが落ちた日。ルイ16世の日記の7月14日の欄には、ひとこと、「なし」とあります。
      # fact: france-if-65
      - 語り: のちにこの日記を活字にした人は、「なし」は、その日に狩りが無かったという印だ、と説明しています。
      - 語り: 振り返ると、王の側が引き返せたかもしれない、と思える場面が、少なくとも3度あります。1776年、1787年、そして1789年の6月です。
        hook: true
      - 語り: 最初の分岐点は、バスティーユの13年前。1人の大臣の罷免です。
        hook: true

  # ================================================================ 第1章 分岐点1 テュルゴー
  - title: 「分岐点1　テュルゴーは、なぜ外されたのか」　1771年から1776年
    background: {image: paintings/france_turgot_ducreux.jpg, credit: "ジョゼフ・デュクルー《テュルゴーの肖像》（18世紀。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1774
    lines:
      # fact: france-if-16
      - 語り: 話は、ルイ16世の祖父、ルイ15世の時代から始まります。1771年1月、王の法令を登録する裁判所、パリの高等法院の裁判官たちが、追放されました。
        card: {head: "1771年", body: 高等法院の裁判官を追放}
      # fact: france-if-16
      - 語り: 2月23日の勅令は、裁判の官職を金で売り買いするのをやめ、裁判をただにする、と書いています。
      # fact: france-if-17
      - 語り: 4月13日、国王は、自ら乗り込んで法令を無理に登録させる親裁座を、ヴェルサイユで開きます。その宣誓つきの議事記録は、今、イギリスの国立公文書館にあります。国王は、そこで絶対の服従を命じました。
      # fact: france-if-20
      - 語り: 1774年、ルイ16世が即位します。8月24日、財務総監になったテュルゴーは、国王に手紙を書きました。破産しない。増税しない。借金しない。
        tone: 重い
        card: {head: "1774年8月24日", body: 破産しない・増税しない・借金しない}
      # fact: france-if-20
      - 語り: 当時のお金の単位で、毎年2000万リーヴルほどを節約する、とも書いています。そして、宮廷の大半に憎まれることになる、と見通していました。
      # fact: france-if-21
      - 語り: 9月13日、テュルゴーは穀物の取引を自由にしました。それは、前の時代に止められた自由化を、戻すところから始めたものでした。
      # fact: france-if-19
      - 語り: 11月、ルイ16世は、祖父が追い出した高等法院を、呼び戻します。11月12日の親裁座でした。
        card: {head: "1774年11月12日", body: 高等法院を呼び戻す}
      # fact: france-if-19
      - 語り: 閣議の中身は秘密にされ、誰が何を言ったかは分かりません。テュルゴーの著作集を編んだシェルは、戻すべきだと言ったのは、老大臣のモールパだけだったとされる、と記しています。
      # fact: france-if-22
      - 語り: 翌1775年の春、パンの値上がりに怒った人々が、各地で穀物を奪いました。小麦粉戦争と呼ばれる騒ぎです。始まりは、パリの北のボーモンの市場でした。
        card: {head: "1775年4月", body: 小麦粉戦争}
      # fact: france-if-22
      - 語り: 騒ぎは、5月の初めにはヴェルサイユに届きます。見せしめに絞首刑にされたのは、薄い織物の職人と、かつら職人の2人でした。
      # fact: france-if-23
      - 語り: このとき、ルイ16世がテュルゴーに書いた2通の手紙も、イギリスの国立公文書館の文書の中にあります。暴徒に金を払った者を捕らえたい、という手紙です。
      # fact: france-if-24
      - 語り: このころの国王の言葉として、民を愛しているのはテュルゴー氏と私だけだ、という一言が知られています。けれど、見つけられた最も古い記録は、11年後、1786年のコンドルセの本です。
      # fact: france-if-25
      - 語り: 1776年1月、テュルゴーは、6つの勅令の案を国王に出しました。賦役をなくすこと、職人の同業組合をなくすこと、パリの穀物の取り締まりを改めることなどです。
        figure: {type: stats, title: テュルゴーの6つの勅令（1776年）, items: [[賦役, 廃止], [同業組合, 廃止], [パリの穀物の取り締まり, 改める]], upto: 3}
      # fact: france-if-26
      - 語り: 賦役の代わりに、道の費用は、道ができて、ほとんど自分たちだけが得をする土地の持ち主に払わせる。その負担は1000万リーヴルを超えさせない、とテュルゴーは書きました。
        figure: null
      # fact: france-if-27
      - 語り: パリ高等法院は、賦役や同業組合の勅令に反対しました。反対の意見書、建言の言葉です。完全な平等は、市民の社会をひっくり返す。
        tone: 重い
      # fact: france-if-27
      - 語り: 同業組合を廃止する勅令は、働く権利を、最も神聖なもの、と書いています。それでも、薬剤、金銀の細工、印刷と本屋、理髪とかつらは、例外にしました。
      # fact: france-if-25
      - 語り: 3月12日、国王は親裁座を開いて、勅令を登録させます。シェルによると、親裁座は5時間続きました。
        card: {head: "1776年3月12日", body: 親裁座で勅令を登録させる}
      # fact: france-if-28
      - 語り: その後、テュルゴーは国王に宛てて、イギリスのチャールズ1世が首を落とされたのは、弱さのためだった、と書きます。この手紙は、ヴェリ神父が日記に書き写したものとして伝わっています。
        tone: 重い
      # fact: france-if-28
      - 語り: 5月12日、テュルゴーは罷免されました。
        card: {head: "1776年5月12日", body: テュルゴー罷免}
      # fact: france-if-29
      - 語り: 実は、テュルゴーは、村から郡、州、国へと、選ばれた人の集まりを積み上げる仕組みの覚書も、秘書のデュポン・ド・ヌムールに書かせていました。
      # fact: france-if-29
      - 語り: けれど、国王に出す前にテュルゴーが失脚し、この覚書は提出されませんでした。
      - 語り: もしも、この覚書が出されて、村から国までの集まりができていたら。全国三部会を開く理由は、それだけ小さくなったのかもしれません。ただ、それを確かめる記録はありません。
        tone: しみじみ
      - 語り: テュルゴーが去って5年。今度は、別の大臣が出した数字が、国じゅうの議論になります。
        tone: 疑問
        hook: true
      - 語り: 国の財政は、本当は黒字だったのか、赤字だったのか。
        hook: true

  # ================================================================ 第2章 分岐点2 名士会
  - title: 「分岐点2　名士会は、なぜ断ったのか」　1781年から1787年
    background: {image: paintings/france_notables_1787.jpg, credit: "ジャン・ミシェル・モロー《名士会　ヴェルサイユ　1787年》（版画。メトロポリタン美術館。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1787
    lines:
      # fact: france-if-30
      - 語り: 1781年、国の財政を任されていたネッケルは、国王への会計報告を印刷して、世に出しました。国の財政は、いつも秘密にされてきた、と書いた本です。
        card: {head: "1781年", body: ネッケルの『国王への会計報告』}
      # fact: france-if-30
      - 語り: ここで、記録が割れます。ネッケルは、ふだんの収入が、ふだんの支出を、1020万リーヴル上回る、と書きました。黒字です。
        tone: 疑問
      # fact: france-if-30
      - 語り: ところが、のちの財務総監カロンヌは、1788年の反論の本で、1781年は実際には、約4600万リーヴルの赤字だった、と書きます。黒字と赤字で、5000万リーヴルを超える開きです。
        figure: {type: stats, title: 1781年の国の収支（2人の記録）, items: [[ネッケル（1781年）, 1020万リーヴルの黒字], [カロンヌ（1788年）, 4632万9000リーヴルの赤字]], upto: 2}
      # fact: france-if-31
      - 語り: そのカロンヌは、1786年8月20日、国王に財政改善の計画を出しました。国は、部分的な修繕では救えない、と書いています。
        figure: null
        card: {head: "1786年8月20日", body: カロンヌの財政改善の計画}
      # fact: france-if-33
      - 語り: カロンヌは、その案を、国王が選んだ名士会にかけます。研究者のマルシャンによると、名士会は144人で、ほとんど全員が、税の特権を持つ身分でした。
      # fact: france-if-33
      - 語り: 開会は、1月の予定でした。それが、カロンヌと、後ろ盾の外務大臣ヴェルジェンヌが高い熱で倒れて、2月22日にずれます。
      # fact: france-if-32
      - 語り: 開会の演説で、カロンヌは自分に問いかけました。恐ろしい穴を埋めるのに、何が残っているのか。答えは、悪弊、でした。
        tone: 重い
        card: {head: "1787年2月22日", body: 名士会の開会。「悪弊」}
      # fact: france-if-32
      - 語り: 同じ演説で、王国の全土にかける土地税、州の議会、国の中の関所の撤廃を挙げています。土地税は、名士会の人たちの土地にも、かかる税でした。
        figure: {type: stats, title: カロンヌの改革案（1787年）, items: [[全土の土地税, 特権身分の土地にも], [州の議会, 新しく作る], [国内の関所, 撤廃]], upto: 3}
      # fact: france-if-34
      - 語り: 名士会は、この案を受け入れませんでした。1787年4月、国王はカロンヌを罷免します。ネッケルの娘のスタール夫人は、王は、罷免するだけでなく、罰まで与えなければならなかった、と記しました。
        figure: null
        card: {head: "1787年4月", body: カロンヌ罷免}
      # fact: france-if-74
      - 語り: 歴史家ハードマンが、この名士会を1冊にまとめた2010年の本。その紹介文は、1787年の名士会を、革命へ切れずにつながる鎖の、最初の輪、と呼んでいます。
        tone: 重い
      # fact: france-if-35
      - 語り: 5月21日、名士会の部会で、ラファイエットが国民の議会を開くよう求めます。
      # fact: france-if-35
      - 語り: 議長の、王の弟アルトワ伯が、全国三部会のことか、と問うと、ラファイエットは、そうだ、と答えました。トマス・ペインが1791年の本に残した場面です。
      # fact: france-if-36
      - 語り: 11月19日、国王が借金の勅令を高等法院に登録させると、王の一族のオルレアン公が立ち上がりました。これは、王が登録を押しつける親裁座ですか。それとも、意見を聞く会議ですか。
        tone: 疑問
      # fact: france-if-36
      - 語り: オルレアン公は、この登録は違法だ、と抗議します。王の一族が、王の目の前で、違法と言ったのです。
        tone: 重い
      - 語り: もしも、名士会がカロンヌの土地税を呑んでいたら。全国三部会を開かずに、お金の穴をふさげたのかもしれません。それは、記録からは確かめられません。
        tone: しみじみ
      - 語り: 翌1788年。国の金庫と、空が、同時に崩れます。
        tone: 疑問
        hook: true
      - 語り: その夏の日曜日、空から降ってきたものが、千を超える村の畑を打ちます。
        hook: true

  # ================================================================ 第3章 1788年
  - title: 「1788年、金庫と空が同時に崩れた」　1788年
    background: {image: paintings/france_necker_duplessis.jpg, credit: "ジョゼフ・シフレッド・デュプレシにもとづく《ネッケルの肖像》（1781年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1788
    lines:
      # fact: france-if-37
      - 語り: 1788年5月8日。国王は、また親裁座で、高等法院の力を削る勅令を登録させました。代わりに置いた新しい法院は、イギリスの歴史家カーライルの本では、一度開かれただけでした。
        card: {head: "1788年5月8日", body: 高等法院の力を削る勅令}
      # fact: france-if-38
      - 語り: 6月7日、アルプスのふもとの町グルノーブルで、住民が屋根に上り、兵に瓦を投げました。屋根瓦の日と呼ばれます。ヴィジーユの革命博物館の資料では、瓦は1枚約2キロです。
        card: {head: "1788年6月7日", body: グルノーブル「屋根瓦の日」}
      # fact: france-if-38
      - 語り: 夕方までに、3人が亡くなります。当時5歳のスタンダールは、のちに自伝で、フランス革命で流れた最初の血を見た、と書きました。
        tone: 重い
      # fact: france-if-39
      - 語り: 7月21日、近くのヴィジーユの城で、この地方の集まりが開かれます。場所は、城の中の、布地に柄を刷る工場の部屋でした。
      # fact: france-if-39
      - 語り: 博物館の資料では、集まったのは、教会ごとの村の単位、小教区で数えて、ドーフィネ州の1212のうち、194の小教区の名士でした。
      # fact: france-if-40
      - 語り: その8日前、7月13日の日曜日。雹の嵐が、フランスを横切りました。
        tone: 重い
        card: {head: "1788年7月13日", body: 雹の嵐}
      # fact: france-if-40
      - 語り: 科学アカデミーは、3人の学者に調べさせています。その報告では、分かっているだけで、被害を受けたのは1039の小教区。損失は、約2500万リーヴルでした。
        figure: {type: stats, title: 1788年7月13日の雹（科学アカデミーの報告）, items: [[被害を受けた小教区, 1039], [損失, 約2496万リーヴル], [1か所に降った時間, 7から8分]], upto: 3}
      # fact: france-if-40
      - 語り: 1か所に雹が降っていたのは、7分から8分だった、とも書いています。
        figure: null
      # fact: france-if-41
      - 語り: 8月8日、国王の政府は、全国三部会を1789年5月1日に開く、と発表します。
        card: {head: "1788年8月8日", body: 全国三部会を開くと発表}
      # fact: france-if-42
      - 語り: 8日後の8月16日、国務会議の裁定で、国庫の支払いの一部が、現金ではなく、利子の付く紙の証券に変えられました。下賜金や賞与は、全額が紙です。
        tone: 重い
      # fact: france-if-43
      - 語り: 8月24日、カロンヌのあとを継いだ大臣のブリエンヌが辞め、国王はネッケルを呼び戻しました。スタール夫人は、国債の相場が、ひと朝で30パーセント上がった、と書いています。
      # fact: france-if-45
      - 語り: ネッケルは、もう一度、名士会を開きました。第三身分の議員を倍に増やすかどうかを聞くためです。賛成したのは、いくつかに分かれた部会のうち、もう1人の王の弟、プロヴァンス伯が議長の部会だけでした。
      # fact: france-if-44
      - 語り: それでも、12月27日の国務会議は、第三身分の議員の数を、他の2つの身分の合計と同じにする、と決めます。議員は少なくとも1000人です。
        card: {head: "1788年12月27日", body: 第三身分の議員を2つの身分の合計と同数に}
      # fact: france-if-44
      - 語り: ただ、この決定は、投票を身分ごとにするのか、1人1票で数えるのかには、一言も触れていませんでした。
        tone: 疑問
      # fact: france-if-41
      - 語り: 開く日も、動きました。8月の発表は5月1日。1789年1月の国王の召集状は、4月27日。実際の開会は、5月5日です。
        figure: {type: stats, title: 全国三部会を開く日は3回動いた, items: [[1788年8月の発表, 5月1日], [1789年1月の召集状, 4月27日], [実際の開会, 5月5日]], upto: 3}
      - 語り: 数え方を決めないまま、会議の日が来る。その前に、国じゅうの村が、紙に向かいました。
        figure: null
        tone: 疑問
        hook: true
      - 語り: 陳情書です。
        hook: true

  # ================================================================ 第4章 陳情書
  - title: 「陳情書は、王をやめろと書いたのか」　1789年春
    background: {image: paintings/france_etats_generaux_couder.jpg, credit: "クデールの絵による版画《全国三部会の開会　1789年5月5日》（19世紀。パリ市立美術館群。ウィキメディア・コモンズ、CC0）"}
    year: 1789
    lines:
      # fact: france-if-46
      - 語り: 全国三部会の議員を選ぶとき、村や町は、それぞれの要望を書いた陳情書を作りました。
      # fact: france-if-46
      - 語り: アメリカの社会学者シャピロとマーコフは、2001年の論文で、村の共同体だけで約4万が書いた、としています。
        card: {head: "1789年春", body: 村の陳情書は約4万}
      # fact: france-if-47
      - 語り: 出回っていた見本をもとに書いたものも、少なくありません。ブルターニュのアンデル村の陳情書は、4月1日の日付で、『田舎の良き市民の務め』という題の見本の大部分を写しています。
      # fact: france-if-47
      - 語り: その第7条のあとに、村は、自分たちの言葉を足しました。泥棒や海賊や狂った獣から身を守れないのに、見張りに要る粗末な銃を取り上げられ、殴られ、撃たれる。
        tone: 重い
      # fact: france-if-48
      - 語り: では、王をやめろと書いた陳情書は、あったのか。記録の上では、ほとんど見つかりません。
        tone: 疑問
      # fact: france-if-48
      - 語り: 貴族の議員ブーニョは、回想録で、王が拒むなら王の位から降ろせ、と書いたある村の陳情書を、自分が告発に回したと記しています。けれど、シャピロとマーコフは、その陳情書を見つけられませんでした。
      # fact: france-if-49
      - 語り: 南フランス、プロヴァンスのローリス村の陳情書には、こうあります。第三身分は、何もかも払い、何も受け取らない。
      # fact: france-if-49
      - 語り: カルカソンヌの第三身分の陳情書は、国の幸せは王政の安定にかかる、と書いたうえで、税は国民が認めたものだけにすること、議会の票は1人1票で数えることを、求めました。
      # fact: france-if-50
      - 語り: 一方で、貴族の陳情書の5分の1以上は、領主の権利に一言も触れていません。触れた貴族の陳情書でも、領主の権利への苦情は平均5.5件。第三身分では17.4件でした。
        figure: {type: stats, title: 陳情書の領主の権利への苦情（平均）, items: [[貴族（触れたもの）, 5.5件], [第三身分, 17.4件]], upto: 2}
      # fact: france-if-51
      - 語り: このころ、シエイエスという聖職者の小冊子が読まれていました。第三身分とは何か。すべてである。政治の上で、今まで何であったか。無である。何を求めるか。何ものかであることだ。
        figure: null
        tone: 重い
      # fact: france-if-48, france-if-49
      - 語り: 陳情書は、王を慕い、怒りを王のまわりに向けていました。カルカソンヌのように、求めたのは、王をなくすことではなく、税を決める席でした。
        tone: しみじみ
      - 語り: その席の票の数え方で、5月5日に開いた会議は、止まります。
        tone: 疑問
        hook: true
      - 語り: そして6月、議員たちは、王の意向を待たずに動き出します。
        hook: true

  # ================================================================ 第5章 分岐点3 6月23日
  - title: 「分岐点3　6月23日、国王は何を差し出したのか」　1789年6月
    background: {image: paintings/france_mirabeau_fragonard.jpg, credit: "アレクサンドル・エヴァリスト・フラゴナール《ドルー・ブレゼの前のミラボー　1789年6月23日》（19世紀。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1789
    lines:
      # fact: france-if-52
      - 語り: 6月17日、シエイエスの動議は、491票対90票で通りました。議員たちは、国民議会を名乗ります。
        card: {head: "1789年6月17日", body: 国民議会を名乗る。491票対90票}
      # fact: france-if-52
      - 語り: 議会の記録では、国王に議決を知らせる文を送ると決めたとき、上がった叫びは、国王万歳、でした。
        tone: しみじみ
      # fact: france-if-53
      - 語り: 6月20日、議場を閉ざされた議員たちは、近くの球戯場に集まり、憲法ができるまで解散しない、と誓います。署名に、反対、と書き添えた議員が1人だけいました。マルタン・ドーシュです。
        card: {head: "1789年6月20日", body: 球戯場の誓い}
      # fact: france-if-53
      - 語り: 理由は、王の裁可のない議決を行うとは誓えない、というもの。議会は、その署名を消さず、意見の自由の証しとして残しました。
      # fact: france-if-54
      - 語り: 6月22日、議員たちはサン・ルイ教会に移り、聖職者149人が合流します。
      # fact: france-if-55
      - 語り: そして6月23日、親臨会議。読まれた宣言は2本でした。1本目の15か条は、17日の議決を無効とし、3つの身分の区別を保つ、というものです。
        tone: 重い
        card: {head: "1789年6月23日", body: 親臨会議。宣言は2本}
      # fact: france-if-55, france-if-56
      - 語り: 2本目は、国王の意図の宣言、35か条。その第1条が、序章で読んだ、代表の同意なしに新しい税は作らない、です。
      # fact: france-if-56
      - 語り: 35か条は、かなり踏み込んでいました。予算は、毎年公開する。聖職者と貴族が、お金の特権を捨てると決めたなら、税の払い方の区別をなくす。
        figure: {type: stats, title: 国王が差し出したもの（35か条から）, items: [[新しい税, 代表の同意が要る], [予算, 毎年公開], [道路の賦役, 永久に廃止]], upto: 3}
      # fact: france-if-56
      - 語り: 地方の議会は、聖職者2、貴族3、第三身分5の割合で作る。道路の賦役は、永久に廃止する。
      # fact: france-if-57
      - 語り: ただし、譲らなかった線も書かれています。十分の一税と、領主の権利は、財産として守る。軍への権限は、王が持つ。
        figure: {type: stats, title: 国王が譲らなかったもの, items: [[十分の一税・領主の権利, 財産として守る], [軍への権限, 王が持つ], [改革の変更, 3つの身分それぞれの同意]], upto: 3}
      # fact: france-if-57
      - 語り: そして、この改革も、3つの身分それぞれの同意がなければ変えられない。第三身分の数だけでは、変えられない形でした。
        figure: null
      # fact: france-if-55
      - 語り: 最後に、国王は言いました。もし皆が私を見捨てるなら、私ひとりで、民の幸せをつくる。そして、すぐにこの場を去り、明日の朝から身分ごとの部屋に分かれて集まるよう命じます。
        tone: 重い
      # fact: france-if-58
      - 語り: 式の係の長が、残った議員に退出を促すと、第三身分の議員ミラボーが答えた、とされる言葉があります。ここでも、記録が割れます。
        tone: 疑問
      # fact: france-if-58
      - 語り: 議会の記録の本文では、銃剣の力によらなければ、我々は席を離れない。けれど、記録の注が引く別の演説集では、主人、つまり王に言いに行け、我々は、人民の力でここにいる、銃剣の力でなければ引き離されない、です。
        figure: {type: stats, title: ミラボーの言葉（2つの形）, items: [[議会の記録の本文, 銃剣の力によらなければ席を離れない], [別の演説集（記録の注）, 主人に言いに行け・人民の力で]], upto: 2}
      # fact: france-if-58
      - 語り: 別の注は、ミラボーのこの日の演説が、のちの新聞、モニトゥールの記録に入っていない、とも記しています。
        figure: null
      # fact: france-if-59
      - 語り: イギリスの農学者アーサー・ヤングは、この会議の案は、王の本心に反して、閣議がやっと呑ませたものだと言われ、たぶん本当だろう、と旅行記に書きました。
      # fact: france-if-59
      - 語り: のちにヤングがメスの町で会った人は、6月23日の案は不十分でも、交渉の土台にはなり得た、と認めています。
        tone: しみじみ
      - 語り: もしも、6月23日の35か条が、交渉の土台になっていたら。王が議会に、1人1票で決めることを認めていたら。そこから先は、記録には残っていません。
        tone: しみじみ
      # fact: france-if-59
      - 語り: 7月14日、メスでヤングが聞いたパリの知らせでは、パリとヴェルサイユの周りに兵がすでに3万5000、さらに2万が向かっていました。
        tone: 疑問
        hook: true
      - 語り: その数日前、国王は、ネッケルを外していました。
        hook: true

  # ================================================================ 第6章 7月14日
  - title: 「7月14日、バスティーユで何が起きたのか」　1789年7月
    background: {image: paintings/bastille_houel.png, credit: "ジャン・ピエール・ウエル《バスティーユ襲撃》（1789年。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1789
    lines:
      # fact: france-if-60
      - 語り: 議会の記録によると、ネッケルの罷免と国外への追放が議場で伝えられたのは、7月13日です。
        card: {head: "1789年7月13日", body: ネッケルの罷免が議場に伝わる}
      # fact: france-if-60
      - 語り: その少し前、議会では、ラファイエットが人権宣言の動議を出していました。審議は見送られ、部会に回されています。
      # fact: france-if-60
      - 語り: 7月12日、アーサー・ヤングは、坂道で1人の農婦に会いました。28歳なのに、60歳か70歳に見えた、とヤングは記します。
      # fact: france-if-60
      - 語り: 農婦は言いました。偉い人たちが、貧しい者のために、何かしてくれるらしい。
        tone: しみじみ
      # fact: france-if-61
      - 語り: 7月14日、民衆はバスティーユへ向かいます。研究者のファンク・ブレンターノは、19世紀の終わりの本で、そこにいた7人の名前を挙げています。
      # fact: france-if-61
      - 語り: 偽造の罪の4人の名前まで、残っています。伯爵は、ソラージュ伯です。
        card: {head: "1789年7月14日", body: 囚人7人の名前が残る}
      # fact: france-if-61
      - 語り: 心を病んだ2人は、解放されたあと、まもなくシャラントンの病院へ移されました。
      # fact: france-if-63
      - 語り: 同じ本では、襲った側の死者は、98人と数えられています。
        tone: 重い
      # fact: france-if-64
      - 語り: この日については、もうひとつ、記録が割れる話があります。パンの値段です。
        tone: 疑問
      # fact: france-if-64
      - 語り: 歴史家のルデは、1954年の論文で、バスティーユは、穀物の値段がいちばん高くなった、まさにその日に落ちた、と書きました。
      # fact: france-if-64
      - 語り: ところが、2019年、歴史家のサザーランドは、それは偶然だ、と反論します。パリの約2キロのパンの値段は、2月から7月の末まで、同じ値に据え置かれていた、というのです。
        figure: {type: stats, title: バスティーユの日のパンの値段（2人の見方）, items: [[ルデ（1954年）, 穀物の値段が頂点の日に落ちた], [サザーランド（2019年）, パンの値段は据え置き]], upto: 2}
      # fact: france-if-66
      - 語り: この7月、国王に、暴動か、と聞かれたリアンクール公が、いいえ陛下、革命です、と答えた、という話もよく知られています。
        figure: null
      # fact: france-if-66
      - 語り: ただ、見つけられた最も古い記録は、公爵の息子が、父の死後の1827年に出した伝記です。しかも、そう言われている、という伝え聞きの書き方でした。
      # fact: france-if-67
      - 語り: 取り壊しは、14日の夕方に、もう始まっていました。パリ市の解説では、建築業者のパロワが、許可も無く、職人を送り込んだのです。
      # fact: france-if-67
      - 語り: 16日には、パリの選挙人の会が正式に任せ、約800人で、石を1つずつ外していきます。
      # fact: france-if-67
      - 語り: のちにパロワは、石の粉を固めたバスティーユの模型を、83の県に1つずつ送りました。本物の石から彫った模型は、パリのカルナヴァレ美術館に残っています。
        tone: しみじみ
      - 語り: 王の側が改革を出しても、止まらなかった。歴史家たちは、この流れを、どう見てきたのでしょうか。
        tone: 疑問
        hook: true
      - 語り: まず、67年後のトクヴィルから見ていきます。
        hook: true

  # ================================================================ 第7章 歴史家の見方
  - title: 「歴史家は、避けられたと見るのか」　1856年から2016年
    background: {image: paintings/france_tocqueville_chasseriau.jpg, credit: "テオドール・シャセリオー《トクヴィルの肖像》（1850年。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: もしも革命が起きなかったら、を、記録は教えてくれません。ただ、歴史家が何と書いたかは、分かります。
      # fact: france-if-68
      - 語り: 序章で読んだ言葉は、トクヴィルの『旧体制と大革命』の一節です。その章の題は、ルイ16世の治世は旧い王政で最も栄えた時代で、その繁栄こそが革命を早めた、です。
        card: {head: "1856年", body: トクヴィル『旧体制と大革命』}
      # fact: france-if-69
      - 語り: 同じ章で、トクヴィルは、時代の違いを考えに入れれば、革命のあとのどの時代にも、革命の前の20年ほど、国の豊かさが速く伸びた時期はない、と書きました。貧しさが極まって革命が起きた、という見方とは、逆です。
      # fact: france-if-68
      - 語り: そして、こう続けます。避けられないと思って我慢していた苦しみも、逃れようと考えた途端に、耐えがたく思えてくる。
        tone: 重い
      # fact: france-if-70
      - 語り: トクヴィル自身が、もしもに答えています。革命が起きなくても、古い社会の建物は、結局どこでも倒れただろう。ただ、一度にではなく、少しずつ倒れ続けただろう、と。
        tone: しみじみ
      # fact: france-if-75
      - 語り: 1965年から66年、フュレとリシェの本は、革命が途中で横すべりした、つまり、途中で道を外れた、という見方を出して、騒ぎになりました。
      # fact: france-if-71
      - 語り: 革命200年の1989年、イギリスの歴史家シャーマは『シチズンズ』で、革命はフランスの近代化を進めたのではなく、妨げた、と論じました。
      # fact: france-if-73
      - 語り: アメリカの歴史家タケットは、1996年の本で議員たちを調べ、ヴェルサイユに着く前に、革命と呼べる変化を思い描いた議員はほとんどいなかった、としました。
      # fact: france-if-73
      - 語り: 新しい考えは、主に議会の中で生まれた、というのです。
      # fact: france-if-72
      - 語り: オーストラリアの歴史家マクフィーの2016年の本は、避けられたかもしれない危機の側に立ちます。評者のリントンのまとめでは、のちに立憲王政が崩れたのも必然ではなく、判断の誤りが重なった結果でした。
        figure: {type: stats, title: 歴史家の見方, items: [[トクヴィル（1856年）, 起きなくても少しずつ倒れた], [タケット（1996年）, 議員は議会の中で変わった], [マクフィー（2016年）, 王政の崩壊は必然ではない]], upto: 3}
      # fact: france-if-74
      - 語り: ハードマンが2016年に出したルイ16世の伝記について、書評を書いたマンセルは、1788年までは、ルイ16世は比較的うまくやっていた、と述べています。
        figure: null
      - 語り: 必然だったと見る人も、避けられたと見る人も、同じ記録を読んでいます。分かれるのは、どの分岐点に重みを置くか、です。
        tone: しみじみ
        hook: true
      - 語り: 最後に、言えることと、言えないことを、分けます。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：フランス革命が起きなかったら、何が言えるのか　1776年から1789年
    background: {image: paintings/france_serment_david.jpg, credit: "ジャック・ルイ・ダヴィッドの構図による《球戯場の誓い》（18世紀末。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: フランス革命は、避けられなかったのか。記録と研究から言えるのは、王の側が何もしなかったわけではない、ということです。
        tone: しみじみ
      # fact: france-if-25, france-if-28
      - 語り: 言えること。1776年、国王は賦役をなくす勅令を出し、5月に、その大臣を外しました。
      # fact: france-if-32, france-if-34
      - 語り: 言えること。1787年、全土の土地税の案は、名士会に退けられ、案を出したカロンヌは罷免されました。
      # fact: france-if-55, france-if-57
      - 語り: 言えること。1789年6月23日、国王は、代表の同意のない新しい税をかけないと宣言しました。けれど、3つの身分の区別と、領主の権利は、手放しませんでした。
      # fact: france-if-48, france-if-49
      - 語り: 言えること。陳情書の多くは、王をなくすことを求めていませんでした。
      - 語り: 言えないこと。もしも、どこかの分岐点で別の道を選んでいたら、王政が続いたのか、別の形で倒れたのか。それは、記録からは言い切れません。
        tone: 重い
      # fact: france-if-70
      - 語り: トクヴィルでさえ、起きなくても古い社会は少しずつ倒れただろう、と書いただけで、それがどの国で、何年のことになったかまでは書いていません。
        tone: しみじみ
        pause: 0.8
      # 余韻の一文：冒頭の7人の囚人に戻る。締めは登録のお願いを短く
      - 語り: 7月14日、バスティーユの扉が開いたとき、中にいたのは、7人でした。その3週間前に読まれた35か条は、交渉の土台にならないまま、残りました。
        tone: しみじみ
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
