# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  昭和33年、1958年。東京・芝の増上寺で、徳川将軍家の墓が掘り返されました。皇女和宮の棺の中、白骨になった胸元に、一枚のガラス板が、抱かれるように残っていました。
  かすかに見えたのは、烏帽子をかぶった、若い男の姿。けれど、その像は、数日のうちに消えてしまったと伝えられています。
  婚約者がいながら、徳川の将軍に嫁いだ皇女。なぜ和宮は、嫁がされた徳川を、最後に守ろうとしたのか。
  この動画でわかること
  ・25日間の中山道の旅と、行列の人数が記録で4倍近く違うこと、板橋宿の「縁切榎」
  ・夫・家茂との4年あまりと、形見の西陣織の歌
  ・慶応4年の書状にある「御取つぶし」なら「覚悟」という言葉
  ・発掘で分かったこと、替え玉説の出どころ、ガラス板に写っていたのは誰か
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（和宮の書状、『近世日本国民史』、本山彦一の日記、『東京市史稿』など）を語りで示してから読んでいます。
  発掘のガラス板・遺骨の話は、1967年の報告書と鈴木尚『骨は語る』を紹介した記事（山村竜也さん・岩波明さん）によっています。

en:
  title: "Princess Kazu: Why Did She Fight to Save the Shogun's House She Was Married Into?"
  description: |-
    In 1958 the Tokugawa graves at Zojoji in Tokyo were excavated. In the coffin of Princess Kazu, a glass plate lay on her chest as if she were holding it.
    A young man in a court cap could faintly be seen on it, but the image is said to have faded away within a few days.
    She was an imperial princess who had been engaged to another man before she was married to the shogun. Why did she fight, in the end, to save the house of Tokugawa?
    In this video you will learn:
    - Her 25-day journey on the Nakasendo, how the records of her procession differ almost fourfold, and the "divorce tree" of Itabashi
    - Her four years with her husband Iemochi
    - Her 1868 letter: if the imperial army came to crush the Tokugawa, she was "prepared"
    - What the excavation found, where the "body double" story comes from, and who may have been on the glass plate
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "What Was the Glass Plate in Her Coffin? Zojoji, 1958"
    - "Why Did She First Refuse? A Princess Who Was Already Engaged"
    - "Why Avoid the Divorce Tree? Twenty-Five Days on the Nakasendo"
    - "Robes Are Nothing Without You: Four Years with Iemochi"
    - "If They Crush the House, I Am Prepared: Her Letter of 1868"
    - "What Did the Bones Tell? Tonosawa, 1877"
    - "Who Was on the Glass Plate? Why She Protected the Tokugawa"

