# 型：1本に1つの「なぜ」＝「なぜ和宮は、嫁がされた徳川を、最後に守ろうとしたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝1958年、増上寺の発掘で和宮の棺から出たガラス板の写真（kazunomiya-30・01）。烏帽子の若い男（28）→数日で消えた（01）。
#   第1章 婚約者のいた皇女（1846〜1861）／第2章 25日の中山道と縁切榎（1861）／第3章 家茂との4年あまり（1862〜1866）／
#   第4章 慶応4年の書状「御取つぶし」なら「覚悟」（1868〜1874）／第5章 塔ノ沢の死と、骨が語ったこと（検証：替え玉説・匿名の手紙・左手首）／
#   まとめ ガラス板に写っていたのは誰か→答え→冒頭の棺に戻って閉じる。締めは余韻の一文＋登録のお願い。次回予告なし（story: true）。
# 記録の食い違いを並べたのは3か所：①行列の人数（大垣市の広報 7,800余名／板橋区立郷土資料館 3万人／ぶぎんレポート 京都方1万＋幕府方1万6千、人足込み3万余）
#   ②縁切榎（迂回の道を作ったと史料で確認／菰で包んで下を通った伝承。どちらも板橋区の展示）③ガラス板の人物（家茂らしい／熾仁親王ではという見方）。
#   享年は「満31歳、数えで32歳」と言うだけ（食い違いとしては扱わない）。亡くなった日の別説（9月8日）は出どころを開けないので言わない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml、kazunomiya-01〜42）にあるものだけ。行の上に `# fact: kazunomiya-NN`。
#   kazunomiya-11 と 22 は同じ事実なので 22 だけ使う。25 と 40 は同じ手紙なので 40 を主に使う。
#   カードに無い「誰でも知っている前置き」（仁孝天皇の皇女・孝明天皇の妹・14代将軍家茂の正室・家茂は大坂で亡くなった・落飾して静寛院宮・
#   鳥羽伏見の戦いと慶喜が朝敵に・江戸城の引き渡し）は短く使い、# fact を付けない。
#   1967年の報告書『増上寺徳川將軍墓とその遺品・遺体』と鈴木尚『骨は語る』は未見。ガラス板・左手首・身長は報道（山村竜也 2022・岩波明 2021）の紹介として語る。
#   写真が消えたのは「数日のうちに」（山村）。「翌日」とは言わない。替え玉説は有吉佐和子の小説（1978）と言う。「家茂の遺髪」の話は使わない。
#   西陣織と「空蝉」の歌は長谷川時雨『日本女性美史』にある話として「と伝わる」で言う。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（書状の声は作らない。原文の一節は語りで「今の言葉にすると」）。
#   想像の台詞は6か所（和宮想像。config の roles に足した。冥鳴ひまり）。気持ちの言葉だけ・新しい事実を足さない。家茂・ほかの人物の台詞は作らない。
#
# 皇室の扱い：敬意をもって。和宮・孝明天皇・明治天皇を貶める言い方をしない。遺骨・発掘は事実の範囲で淡々と（「白骨」「骨」まで。形の描写はしない）。
