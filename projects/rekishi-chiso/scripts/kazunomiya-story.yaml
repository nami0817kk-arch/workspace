      # fact: kazunomiya-10
      - 語り: 和宮の側からは、嫁ぐにあたっての願いを、箇条書きにした文書が出された、と伝わります。
        portrait: null
      # fact: kazunomiya-10
      - 語り: 公家、中山忠能の記録には、その和宮の「御ケ条書」の名が見える、と伝えられます。
        card: {head: "和宮の願い", body: 箇条書きの「御ケ条書」}
      - 語り: 黙って従うだけではない。嫁ぐなら、自分の側の願いを、書いて出す。和宮には、そういう一面もあったのかもしれません。
        tone: しみじみ
      # fact: kazunomiya-16
      - 語り: 降嫁が決まったあとの1861年、和宮は、天皇の命で、内親王の位を受けました。名は、親子といいます。
      # fact: kazunomiya-16
      - 語り: イギリスの外交官、アーネスト・サトウが英語に訳した幕末の記録にも、その年のこととして、記されています。
        card: {head: "1861年", body: 内親王の位を受ける}
      - 語り: 婚約は、取りやめになりました。和宮は、数えで16歳。会ったこともない、同い年の将軍のもとへ、嫁ぐことになったんです。
        tone: 重い
        portrait: {image: paintings/kazu_iemochi_kano.jpg, caption: "徳川家茂（狩野派の絵師、19世紀）"}
      - 語り: 兄の天皇にとっても、妹を江戸へ出すことは、国の行方をかけた、重い決断でした。
        tone: しみじみ
      - 語り: ただ、その道のりは、ふつうの花嫁行列とは、まるで違うものになります。
        hook: true
        portrait: null
      - 語り: その旅は、山の中の中山道を、ひと月近くかけて進む、長い旅になりました。
        tone: 重い
        hook: true

  # ================================================================ 第2章 中山道と縁切榎（1861）①行列の人数 ②縁切榎
  - title: なぜ縁切榎を避けたのか　25日の中山道 文久元年
    background: {image: paintings/kazu_omiya_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 大宮宿富士遠景》1835〜37年ごろ（国立国会図書館）"}
    # AI絵：W04（中山道の山あいを進む長い行列・遠景）／W05（輿のまわりの警固・顔は描かない）
    year: 1861
    lines:
      # インターネットミュージアム（古川幹夫 2021、企画展「和宮 江戸へ」）
      # fact: kazunomiya-17
      - 語り: 実は、和宮と、その嫁入り道具は、別々の道で、江戸へ向かいました。道具は、東海道を、17日かけて運ばれています。
        card: {head: "嫁入り道具", body: 東海道を17日}
      # ぶぎんレポート（松本博之 2018）・板橋区（2020）
      # fact: kazunomiya-20
      - 語り: 和宮本人は、文久元年、1861年の10月20日に、京都を出発。中山道、約530キロを、23の宿場に泊まりながら、25日かけて進みました。
        card: {head: "文久元年10月20日", body: 京都を出発・25日の旅}
        figure: {type: map, title: 文久元年 和宮の道のり, bounds: [135.4, 140.1, 34.7, 36.4], places: [[京都, 135.77, 35.01], [赤坂宿, 136.58, 35.39], [藪原宿, 137.75, 35.93], [桶川宿, 139.56, 35.99], [板橋宿, 139.71, 35.75], [江戸, 139.77, 35.68]], route: [京都, 赤坂宿, 藪原宿, 桶川宿, 板橋宿, 江戸], note: 約530キロ・23の宿場に泊まる}
      # 前置きの理由はカードに無いので言わない（なぜ中山道かはぶぎんの記事にあるが、カードにしていない）
      - 語り: 数えで16歳の皇女が、山の中の街道を、ひと月近く。都で育った人にとって、それは、どれほど遠い旅だったでしょうか。
        tone: しみじみ
        figure: null
        background: {image: paintings/kazu_omiya_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 大宮宿富士遠景》1835〜37年ごろ（国立国会図書館）"}
      # fact: kazunomiya-31
      - 語り: 埼玉の、ぶぎん地域経済研究所が、2018年のレポートでまとめた数は、こうです。行列には、京都方から1万人、幕府方から1万6千人が加わった。
        card: {head: "ぶぎんレポート", body: 京都方1万・幕府方1万6千}
        # AI絵：W04
      # fact: kazunomiya-31
      - 語り: 荷物を運ぶ人足を入れると、3万人あまり。行列の長さは、約12里、《50キロ》にもなった、と言われています。
        tone: 強調
      # fact: kazunomiya-31
      - 語り: ただ、50キロが一続きだったわけではありません。先ぶれや警固、和宮の一行などに分かれて進んだ、とレポートは書いています。
      # 食い違い①：行列の人数
      # fact: kazunomiya-32
      - 語り: ところが、この人数、記録によって、大きく違うんです。東京の板橋区立郷土資料館は、総勢3万人。岐阜県大垣市の広報は、総勢7,800あまり、と書いています。
        tone: 強調
        figure: {type: bars, title: 和宮の行列の人数　書き方の違い, bars: [[大垣市の広報, 7800], [ぶぎんレポート（京都方＋幕府方）, 26000], [板橋区立郷土資料館, 30000]], labels: ["7,800あまり", "2万6千", "3万"]}
      - 語り: 4倍近い違いです。行列の本隊だけを数えるか、荷を運ぶ人足や、警固の人まで入れるかでも、数は大きく変わります。どれが正しいかは、記録からは決められません。
        tone: しみじみ
      - 語り: ただ、どの数を取っても、ひとりの花嫁のための行列としては、桁外れでした。
        figure: null
      # fact: kazunomiya-18
      - 語り: しかも、宿場ごとに、荷を次へ運ぶ人と馬が、別に集められました。いまの埼玉県の桶川宿には、人足3万6,450人、馬1,799頭。ふだんの参勤交代の、10倍を超える数です。
        background: {image: paintings/kazu_okegawa_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 桶川宿曠原之景》1835〜37年ごろ（国立国会図書館）"}
        card: {head: "桶川宿", body: 人足3万6,450人・馬1,799頭}
      # fact: kazunomiya-18
      - 語り: 和宮の一行が桶川宿に着いたのは、午後2時。そして、夜中の午前2時には、次の宿へ向けて、もう発っていきました。休む間もない旅でした。
        card: {head: "桶川宿", body: 午後2時に着き 午前2時に発つ}
      # 長野県・塩尻市（2017）
      # fact: kazunomiya-27
      - 語り: 木曽の山の中では、藪原宿に泊まり、奈良井宿で、ひと休みしたことが、古い文書に記録されています。
        background: {image: paintings/kazu_yabuhara_eisen.jpg, credit: "渓斎英泉《木曽海道六十九次 薮原 鳥居峠硯ノ清水》1835〜37年ごろ（国立国会図書館）"}
        card: {head: "木曽の山の中", body: 藪原宿に泊まり 奈良井宿で休む}
      # 【想像2】和宮。記録：25日の中山道の旅（kazunomiya-20）・藪原と奈良井（27）。気持ちの言葉だけ
      - 人物: 「都は、もう、あの山の向こうなのですね」
        who: 和宮想像
        imagined: true
        tone: しみじみ
        background: {image: paintings/kazu_narai_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 奈良井宿名産店之図》1835〜37年ごろ（国立国会図書館）"}
        # AI絵：W06（輿の簾ごしに雪の山並みを見る和宮・横顔）
      # 板橋区（こうぶんしょ館 2020）
      # fact: kazunomiya-34
      - 語り: 江戸の手前、最後の宿場が、板橋宿です。板橋区の展示によれば、和宮を迎えるために、宿場の建物は直され、建て替えられました。かかった費用は、金1,412両。
        background: {image: paintings/kazu_itabashi_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 板橋之駅》1835〜37年ごろ（国立国会図書館）"}
        card: {head: "板橋宿", body: 建物の手入れに金1,412両}
      # fact: kazunomiya-19
      - 語り: その板橋宿には、「縁切榎」と呼ばれる、一本の大きな榎がありました。花嫁が下を通ると、縁が切れる、と言われた木です。
        card: {head: "板橋宿の縁切榎", body: 下を通ると縁が切れる}
        # AI絵：W07（宿場のはずれの大きな榎の老木・人物なし）
      # fact: kazunomiya-19
      - 語り: 和宮の行列は、この木の下を避けるため、わざわざ、《まわり道》の道路を作って通りました。板橋区は、このことが、史料で確かめられる、としています。
        tone: 強調
        card: {head: "縁切榎", body: まわり道を作って避けた}
      # 食い違い②：縁切榎
      # fact: kazunomiya-33
      - 語り: ところが、同じ板橋区の展示には、別の話も載っています。榎を、菰、つまり、粗く編んだむしろで包んで、その下を通った、という言い伝えです。
        card: {head: "もうひとつの話", body: 榎を菰で包んで下を通った}
        figure: {type: stats, title: 縁切榎をどう避けたか, items: [[史料, まわり道を作って避けた, 板橋区が史料で確認], [言い伝え, 菰で包んで下を通った, 同じ板橋区の展示に]]}
      - 語り: まわり道か、木を包んだのか。どちらにしても、周りの人々は、それほど、この縁が切れることを、気にかけていたんです。
        tone: しみじみ
        figure: null
      # fact: kazunomiya-21
      - 語り: 11月14日の夕方、和宮は、板橋宿の脇本陣、飯田宇兵衛の家に入ります。江戸に入る前の、最後の夜でした。
        card: {head: "11月14日", body: 江戸に入る前の最後の夜}
        # AI絵：W08（宿の座敷の夜・行灯・一人座る和宮の後ろ姿）
      # 【想像3】和宮。記録：板橋宿で江戸入り前の最後の夜（kazunomiya-21）。気持ちの言葉だけ
      - 人物: 「ここを過ぎれば、もう、戻れぬのですね」
        who: 和宮想像
        imagined: true
        tone: しみじみ
      # fact: kazunomiya-20
      - 語り: 翌日、11月15日。25日の旅を終えて、和宮は、江戸に入りました。
        card: {head: "文久元年11月15日", body: 江戸に入る}
        background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
      - 語り: 縁が切れないように、まわり道までして、届けられた花嫁。その縁の先で、和宮を待っていたのは、どんな日々だったのか。
        hook: true
      - 語り: 和宮が江戸で過ごす夫との日々は、思いのほか、短いものになりました。
        tone: 重い
        hook: true

  # ================================================================ 第3章 家茂との日々（1862〜1866）
  - title: 「綾も錦も君ありてこそ」　家茂との4年あまり 1866年
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
    # AI絵：W09（江戸城の奥の廊下を歩く若い夫婦の後ろ姿）
    year: 1862
    lines:
      # 前置き（誰でも知っている流れ）
      - 語り: 文久2年、1862年の2月。和宮と家茂の婚礼が、江戸城で行われました。ふたりは、ともに、数えで17歳でした。
        portrait: {image: paintings/kazu_iemochi_kawamura_1884.jpg, caption: "徳川家茂（川村清雄画、1884年、徳川記念財団蔵）"}
      - 語り: 京の御所で育った皇女と、江戸の城で育った将軍。暮らしてきた世界は、まるで違っていました。
        portrait: null
      # インターネットミュージアム（古川幹夫 2021）
      # fact: kazunomiya-26
      - 語り: けれど、夫婦の仲は、むつまじいものでした。2021年の企画展「和宮 江戸へ」を紹介した記事には、ふたりが、和歌や、かんざしを、贈り合うほどだった、とあります。
        tone: しみじみ
        card: {head: "家茂と和宮", body: 和歌やかんざしを贈り合う}
        # AI絵：W10（文机の上のかんざしと和歌の短冊・手元だけ）
      # fact: kazunomiya-26
      - 語り: 元治元年の2月9日付で、和宮が家茂にあてた手紙も、残っています。
        card: {head: "元治元年2月9日", body: 和宮から家茂への手紙}
      # 国立歴史民俗博物館（2025 特集展示）
      # fact: kazunomiya-24
      - 語り: 和宮は、雛人形を、たくさん手元に置いていました。桃の節句には、あちこちと、贈り合ったそうです。その一部は、いま、千葉県の国立歴史民俗博物館に伝わっています。
        card: {head: "和宮の雛人形", body: 一部が国立歴史民俗博物館に}
        # AI絵：W11（雛壇の小さな雛人形と雛道具・人物なし）
      - 語り: 都から来た皇女が、江戸の城の奥で、雛を飾る。京の春を、手元に置いておきたかったのかもしれません。
        tone: しみじみ
      - 語り: 望まずに始まった結婚でした。それでも、同い年のふたりは、少しずつ、夫婦になっていったんです。
        tone: しみじみ
      # 前置き（誰でも知っている流れ：家茂の上洛と大坂での死）
      - 語り: 将軍の家茂は、たびたび、京都や大坂へ向かい、江戸を離れました。
      # 【想像4】和宮。記録：和歌やかんざしを贈り合った（kazunomiya-26）・家茂の上洛（前置き）。気持ちの言葉だけ
      - 人物: 「上様が、ご無事でお帰りになるよう、毎日、祈っております」
        who: 和宮想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/kazu_portrait_toyobunka.jpg, caption: "和宮（昭和初期の刊行物より）"}
      - 語り: そして、慶応2年、1866年の7月。長州との戦いのさなかに、家茂は、大坂城で、病に倒れ、亡くなります。数えで21歳でした。
        tone: 重い
        portrait: null
        # AI絵：W05（1866年の夏の大坂城の石垣と堀・天守は無い）
      - 語り: 結婚して、わずか4年あまり。和宮は、数えで21歳で、夫を失いました。
        tone: しみじみ
      # 【想像5】和宮。記録：家茂が大坂城で亡くなった（前置き）・夫婦の仲はむつまじかった（kazunomiya-26）。気持ちの言葉だけ
      - 人物: 「どうして、こんなに、早く……」
        who: 和宮想像
        imagined: true
        tone: 重い
        portrait: {image: paintings/kazu_portrait_toyobunka.jpg, caption: "和宮（昭和初期の刊行物より）"}
      - 語り: 同い年の夫は、遠い大坂で、世を去りました。和宮は、その最期に、立ち会うことも、できなかったんです。
        portrait: null
        tone: しみじみ
      # 長谷川時雨『日本女性美史』（Wikisource）
      # fact: kazunomiya-42
      - 語り: 作家の長谷川時雨が書いた『日本女性美史』には、こんな話が載っています。家茂の形見として、西陣の織物が届くと、和宮は、それを抱いて泣き崩れた。
        background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
        # AI絵：W12（畳の上に広げた西陣の織物と、それに触れる手・顔は描かない）
      # fact: kazunomiya-42
      - 語り: そして、こう詠んだ、と伝わります。「空蝉の、唐織衣、何かせん。綾も錦も、君ありてこそ」。
        tone: しみじみ
        card: {head: "伝わる歌", body: 「綾も錦も君ありてこそ」}
      - 語り: 美しい織物も、あなたがいなければ、何になるでしょう。後の時代の読み物にある話ですが、ふたりの4年あまりを、よく伝えています。
        tone: しみじみ
      # 前置き（誰でも知っている：落飾して静寛院宮）
      - 語り: 和宮は、髪を下ろし、静寛院宮と名乗ります。夫を亡くした皇女は、京へ帰らず、江戸の城に、残りました。
        portrait: {image: paintings/kazu_portrait_small.jpg, caption: "和宮とされる肖像（作者不詳、1877年以前）"}
      - 語り: そのわずか1年あまりあと、徳川の家そのものが、つぶされるかもしれない時が、やってきます。
        hook: true
        portrait: null
      - 語り: 夫のいない家を、和宮は、どうしたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 「覚悟」の書状（1868〜1874）
  - title: 「御取つぶし」なら「覚悟いたし」　慶応4年の和宮の書状
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
    # AI絵：W13（灯の下で手紙を書く和宮・横顔・尼の姿）
    year: 1868
    lines:
      # 前置き（誰でも知っている流れ）
      - 語り: 慶応4年、1868年の正月。京都の南、鳥羽と伏見で、旧幕府の軍が、新しい政府の軍に敗れました。将軍だった徳川慶喜は、朝廷の敵、朝敵とされます。
        tone: 重い
      - 語り: 新しい政府の軍は、江戸へ向かってきます。徳川の家が、取りつぶされるかもしれない。江戸の城に、その知らせが届きます。
      # 文化遺産オンライン（海の見える杜美術館 2012 の解説）
      # fact: kazunomiya-04, kazunomiya-35
      - 語り: 正月20日。和宮は、東海道を下ってくる軍の総督、公家の橋本実梁に、手紙を書きます。この書状は、いま、広島県の、海の見える杜美術館に残っています。
        card: {head: "慶応4年正月20日", body: 橋本少将あての書状}
        # AI絵：W13
      # fact: kazunomiya-35
      - 語り: 冒頭でお話しした、あの手紙です。和宮は、手紙の中で、徳川の家を、「当家」と呼んでいます。
        card: {head: "和宮の書状", body: 徳川を「当家」と呼ぶ}
      # fact: kazunomiya-35
      - 語り: 当家が、朝敵の汚名を残すのは、「実に、残念」。その汚名を、すすぎたい。
        tone: しみじみ
      # fact: kazunomiya-04
      - 語り: そして、もし官軍が下ってきて、当家を「御取つぶし」になさるなら、私も、「覚悟いたし」ます。
        tone: 強調
        card: {head: "和宮の書状", body: 「御取つぶし」なら「覚悟いたし」}
      # fact: kazunomiya-04
      - 語り: 美術館の解説は、この手紙を、命に代えても汚名をすすぎたい、という願いとして読んでいます。
        tone: しみじみ
      # 【想像6】和宮。記録：慶応4年正月20日の書状「御取つぶし」なら「覚悟いたし」（kazunomiya-04）。気持ちの言葉だけ（書状の新しい中身は足さない）
      - 人物: 「上様が遺されたこの家を、このまま、絶やすことはできませぬ」
        who: 和宮想像
        imagined: true
        tone: 重い
        portrait: {image: paintings/kazu_portrait_small.jpg, caption: "和宮とされる肖像（作者不詳、1877年以前）"}
      - 語り: 夫のいない家です。それでも、夫が継いだ家を、和宮は、自分の家として、守ろうとしました。
        tone: しみじみ
        portrait: null
      # 徳富猪一郎『近世日本国民史』第68冊（1946）p.226
      # fact: kazunomiya-04
      - 語り: ジャーナリストの徳富蘇峰は、『近世日本国民史』に、こう書きました。和宮は、慶喜らの願いを聞き入れ、また、《みずから進んで》、許しを願う動きを、しきりに続けていた。
        card: {head: "近世日本国民史", body: みずから進んで許しを願う}
      - 語り: 頼まれたからだけではない。和宮自身が、動いていた、というんです。
        tone: 強調
      - 語り: 将軍の妻になって、6年近く。そのうち夫婦でいられたのは、4年あまり。その短い日々が、和宮を、徳川の家の人にしていました。
        tone: しみじみ
      # 前置き（誰でも知っている：江戸城の引き渡し）
      - 語り: その年の4月、江戸城は、戦いにならずに、新しい政府へ引き渡されました。徳川の家は、取りつぶされずに、残ります。
        background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
      # fact: kazunomiya-37
      - 語り: 城を出た和宮は、清水家の屋敷に移り、明治2年、1869年には、京都へ戻りました。
        card: {head: "1869年", body: 京都へ戻る}
        background: {image: paintings/kazu_kyoto_sanjo_hiroshige.jpg, credit: "歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ（メトロポリタン美術館）"}
      # fact: kazunomiya-37
      - 語り: けれど、明治天皇に勧められて、和宮は、もう一度、東京へ移ることになります。
      # 文化遺産オンライン（三条実美あて書状の解説）
      # fact: kazunomiya-22
      - 語り: 明治4年、1871年の6月。和宮は、政府の重い役にあった、三条実美に、手紙を書いています。借りていた清水家の屋敷は、広すぎるので、もう少し、狭い住まいを用意してほしい。
        card: {head: "明治4年の書状", body: 屋敷が広すぎる}
      - 語り: 徳川の家のためには、覚悟すると書いた人が、自分のためには、小さな家を望んでいたんです。
        tone: しみじみ
      # fact: kazunomiya-37
      - 語り: 明治7年、1874年。和宮は、ようやく東京へ移り、麻布の屋敷で暮らし始めます。そこで暮らしたのは、3年ほどです。
        card: {head: "1874年", body: 麻布の屋敷へ}
      - 語り: 明治10年、和宮は、病の療養のため、箱根へ向かいます。それが、最後の旅になりました。
        tone: 重い
        hook: true
      - 語り: そして、その死から80年あまりのち、和宮の骨は、思いがけないことを、語り始めます。
        hook: true

  # ================================================================ 第5章 塔ノ沢の死と、骨が語ったこと（検証）
  - title: 骨は何を語ったのか　1877年 塔ノ沢と替え玉の話
    background: {image: paintings/kazu_tonosawa_1854.jpg, credit: "《箱根 塔ノ沢》1854年（アムステルダム国立美術館）"}
    # AI絵：W14（箱根の山あいの湯の宿・秋・人物なし）
    year: 1877
    lines:
      # 観光庁（多言語解説文データベース 阿弥陀寺）
      # fact: kazunomiya-03
      - 語り: 明治10年、1877年の9月2日。和宮は、箱根の塔ノ沢の温泉で療養中に、脚気で、亡くなりました。満31歳、数えで32歳でした。
        tone: 重い
        card: {head: "1877年9月2日", body: 箱根の塔ノ沢で亡くなる}
      # fact: kazunomiya-13
      - 語り: 明治10年の9月は、西南戦争の、最後の月です。『国史大年表』は、同じ月の欄に、西郷隆盛のこもる城山の戦いと、和宮の死を、並べて載せています。
        card: {head: "1877年9月", body: 西南戦争の最後の月}
        background: {image: paintings/okubo_kagoshima_castle_gate.jpg, credit: "鹿児島城の門（明治初期の写真）"}
      # 本山彦一の日記（明治10年9月4日、『松陰本山彦一翁』1937）
      # fact: kazunomiya-12
      - 語り: のちに新聞社の社長になる本山彦一の、9月4日の日記には、道の途中で、休みのことを聞いた、おととい静寛院宮が亡くなったため、とあります。
      # fact: kazunomiya-12
      - 語り: 和宮の死で、休みが出されていた、と伝わります。
        card: {head: "本山彦一の日記", body: 和宮の死で休みに}
        background: {image: paintings/okubo_ginza_1880s.jpg, credit: "明治10年代の銀座（明治の写真）"}
      # サライ.jp（2023）
      # fact: kazunomiya-41
      - 語り: 和宮の墓は、生前の意志に従って、夫の家茂と同じ、芝の増上寺に建てられた、とされます。
        background: {image: paintings/kazu_zojoji_akabane_hiroshige.jpg, credit: "歌川広重《名所江戸百景 増上寺塔赤羽根》1857年（国立国会図書館）"}
        card: {head: "増上寺", body: 夫の家茂と同じ寺に}
      # 東京市史稿 遊園篇 第4（1932）
      # fact: kazunomiya-14
      - 語り: 『東京市史稿』には、増上寺に葬る作業の場所が無く、赤羽根の通りの脇の公園の土地を、囲い込んで使った、と書かれています。
      - 語り: それから、80年あまり。和宮の眠る墓が、開かれる日が来ます。
        tone: 重い
        background: {image: paintings/kazu_zojoji_snow_hiroshige.jpg, credit: "歌川広重《東都名所 芝増上寺雪中ノ図》（メトロポリタン美術館）"}
      # fact: kazunomiya-30
      - 語り: 昭和33年、1958年。増上寺の墓所を改めるのに合わせて、徳川将軍家の墓の、発掘調査が行われました。
        card: {head: "1958年", body: 増上寺の墓所の発掘}
        # AI絵：W01（発掘の現場の遠景）
      # 谷川章雄（Japanese Journal of Religious Studies 1992）
      # fact: kazunomiya-15
      - 語り: 考古学者の谷川章雄さんの1992年の論文によれば、将軍の正室の墓は、将軍と同じ造りで、ただ小さく、銅の棺がありません。
      # 港区教育委員会（2024）
      # fact: kazunomiya-23
      - 語り: 隣り合う家茂の墓からは、お経の文字を書いた小石、礫石経が、約650点、見つかっています。
        card: {head: "家茂の墓から", body: 礫石経 約650点}
      # 岩波明（ビジネスジャーナル 2021）が引く鈴木尚『骨は語る』
      # fact: kazunomiya-06
      - 語り: 和宮の骨を調べたのは、人類学者の鈴木尚です。精神科医の岩波明さんが、2021年の記事で紹介したところでは、和宮は、身長143.4センチ、体重34キロほどの、小柄な女性でした。
        card: {head: "和宮の骨", body: 身長143.4センチ}
        figure: {type: stats, title: 発掘で分かった和宮, items: [[身長, 143.4センチ, 鈴木尚の調べ], [体重, 34キロほど, 同じく]]}
      # 鈴木尚（人類学雑誌 1985）
      # fact: kazunomiya-07
      - 語り: 鈴木尚の1985年の論文の要旨には、将軍たちの骨に見られる、細長い顔などの特徴が、和宮の骨にも出ている、とあります。
        figure: null
      # fact: kazunomiya-38
      - 語り: 岩波さんの記事が引く『骨は語る』には、和宮の骨に、刃の跡や、病の跡は、認められなかった、とあります。
      # fact: kazunomiya-02
      - 語り: ただ、ひとつだけ、不思議なことがありました。《左の手首》から先の骨が、とうとう、見つからなかった、と書かれています。
        tone: 強調
        card: {head: "見つからなかった骨", body: 左の手首から先}
      # 通説の検証（この章だけ）：匿名の手紙と替え玉説
      # fact: kazunomiya-40
      - 語り: 発掘のさなか、名前を名乗らない女性から、一通の手紙が届いた、と岩波さんの記事は紹介しています。
      # fact: kazunomiya-40
      - 語り: 和宮は、京都へ向かう途中、箱根の山の中で賊に襲われ、防ぎながら自害した、という中身でした。
        card: {head: "名乗らない手紙", body: 箱根の山で自害した？}
      - 語り: けれど、骨には、刃の跡が無かった。手紙の話を、骨は、裏づけていません。
        tone: しみじみ
      # fact: kazunomiya-39
      - 語り: 和宮は、別人と入れ替わっていた、という替え玉の話も、よく語られます。その出どころは、作家の有吉佐和子が、1978年に書いた小説、『和宮様御留』です。
        card: {head: "替え玉の話", body: 1978年の有吉佐和子の小説}
      # fact: kazunomiya-39
      - 語り: 岩波さんの記事も、この替え玉説は、信ぴょう性が薄い、としています。小説として描かれた話が、本当の話のように語られるようになった、と言えそうです。
      - 語り: 左の手首が、なぜ無かったのか。その理由は、記事にも書かれていません。
        tone: しみじみ
      - 語り: 名乗らない手紙。替え玉の小説。見つからない骨。和宮の死のあとには、いくつもの物語が、生まれていきました。
      - 語り: けれど、記録に残る和宮は、そうした物語より、ずっと静かな人です。願いを書いて出し、夫と和歌を贈り合い、家のために手紙を書き、小さな家を望んだ人でした。
        tone: しみじみ
        card: {head: "記録に残る和宮", body: 願い・和歌・手紙・小さな家}
      - 語り: そして、骨よりも、もっと人の心を引きつけたのが、あのガラス板でした。
        hook: true
      - 語り: 写っていたのは、本当に、夫の家茂だったのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ ③ガラス板の人物→答え→冒頭に戻る
  - title: まとめ：和宮はなぜ徳川を守ったのか　1958年
    background: {image: paintings/kazu_zojoji_sannai_hiroshige.jpg, credit: "歌川広重《東都名所 芝増上寺山内の図》1833年ごろ（メトロポリタン美術館）"}
    # AI絵：W02（白い布の上の古いガラス板と白手袋の手）
    year: 1958
    lines:
      # 食い違い③：ガラス板の人物
      # fact: kazunomiya-28
      - 語り: 冒頭でお話しした、あのガラス板。一晩かけて調べた学者は、烏帽子の、若い男の顔を見て、家茂らしい、と言いました。
        portrait: {image: paintings/kazu_iemochi_kano.jpg, caption: "徳川家茂（狩野派の絵師、19世紀）"}
      # fact: kazunomiya-29
      - 語り: けれど、山村さんの記事は、別の見方も紹介しています。家茂には、生涯に写真を撮った記録が無い。写っていたのは、かつての婚約者、有栖川宮熾仁親王ではないか、というものです。
        tone: 強調
        portrait: {image: paintings/kazu_arisugawa_taruhito.jpg, caption: "有栖川宮熾仁親王（昭和初期の刊行物より）"}
        figure: {type: stats, title: ガラス板の人物は誰か, items: [[夫・徳川家茂, 烏帽子の若い顔, 調べた学者の見立て], [有栖川宮熾仁親王, 写真を撮る機会があった, 家茂は写真の記録なし]]}
      # fact: kazunomiya-29
      - 語り: 熾仁親王は、明治28年まで生き、写真を撮る機会も、十分にありました。
        portrait: null
      - 語り: 夫か、かつての婚約者か。像が消えてしまった今、確かめる手立ては、もう、ありません。
        tone: しみじみ
        figure: null
      # fact: kazunomiya-41
      - 語り: ただ、ひとつ、伝えられていることがあります。和宮が、最後に眠る場所に望んだのは、夫の家茂と同じ寺だった、ということです。
        tone: しみじみ
        background: {image: paintings/kazu_zojoji_akabane_hiroshige.jpg, credit: "歌川広重《名所江戸百景 増上寺塔赤羽根》1857年（国立国会図書館）"}
      # 答え：なぜ徳川を守ったのか（記録から言えること）
      - 語り: なぜ和宮は、嫁がされた徳川を、最後に守ろうとしたのか。
        tone: 疑問
        pause: 0.6
      - 語り: 婚約をあきらめての、望まない縁談でした。それでも和宮は、兄のため、国のために嫁ぎました。周りの人々は、その縁が切れないよう、木の下さえ避けて、和宮を江戸へ送り届けました。
        background: {image: paintings/kazu_itabashi_eisen.jpg, credit: "渓斎英泉《木曽街道六十九次 板橋之駅》1835〜37年ごろ（国立国会図書館）"}
      - 語り: 江戸で出会った同い年の夫とは、和歌を贈り合い、4年あまりで、死に別れます。
        portrait: {image: paintings/kazu_iemochi_kawamura_1884.jpg, caption: "徳川家茂（川村清雄画、1884年、徳川記念財団蔵）"}
      - 語り: その夫の家が、つぶされようとしたとき、和宮は、その家を、「当家」と呼びました。
        tone: しみじみ
        portrait: null
      - 語り: 天皇の家に生まれ、徳川の家で生きた人は、どちらにも、背を向けなかった。守ったのは、嫁がされた家ではなく、夫と暮らした、自分の家だったのかもしれません。
        tone: しみじみ
      # 締め：冒頭の場面（棺の中のガラス板）に戻る
      # fact: kazunomiya-30, kazunomiya-01
      - 語り: 昭和33年、増上寺。夫の墓のとなりで、和宮は、一枚のガラス板を、胸に抱いていました。
        tone: しみじみ
        background: {image: paintings/kazu_zojoji_snow_hiroshige.jpg, credit: "歌川広重《東都名所 芝増上寺雪中ノ図》（メトロポリタン美術館）"}
        card: {head: "1958年 増上寺", body: 胸に抱いたガラス板}
      - 語り: その像は、数日で消えました。けれど、80年あまり、和宮が、誰かの姿を、胸に抱き続けていたことだけは、消えずに残っています。
        tone: しみじみ
        pause: 0.8

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        background: {image: paintings/kazu_zojoji_sannai_hiroshige.jpg, credit: "歌川広重《東都名所 芝増上寺山内の図》1833年ごろ（メトロポリタン美術館）"}

