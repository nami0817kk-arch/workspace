  # サムネは別に作る（Gemini の絵に字を載せた1枚。out/nagaya-if-story_thumbnail.png）。ここは check のための仮。

sections:
  # ================================================================ 序章
  - title: 「家賃は出費の8%」　文政のころ
    lines:
      # fact: nagayaif-24
      - 語り: 江戸の長屋の家賃は、ひと月で、大工の日当の2日分にも足りませんでした。
        tone: 重い
        card: {head: "家賃は日当の2日分足らず", body: 江戸の大工の1年の家計から}
      # fact: nagayaif-24
      - 語り: 出費の中で、家賃は、わずか8%。いちばん重かったのは、家賃でも、お米でもありません。「塩」「醤油」「味噌」「油」「薪と炭」。これだけで、46%です。
        figure: {type: pie, title: 大工の1年の出費, parts: [[塩・醤油・味噌・油・薪炭, 46], [米, 23], [店賃, 8], [道具・着る物・つきあい, 23]], unit: "%"}
      # fact: nagayaif-24
      - 語り: しかも、この大工の家に、1年働いて残ったお金は、日当の14日分ほどでした。
      - 語り: 家賃は安いのに、なぜ、お金が残らなかったのか。
        tone: 疑問
        figure: null
      - 語り: もしも、今の私たちが、江戸の長屋で1か月暮らしたら。家賃、水、トイレ、お風呂、食べ物、灯り。全部で、いくらかかるのか。
        tone: 疑問
      - 語り: 時は、文政から天保のころ。1820年ごろから、1840年代のはじめです。場所は、江戸の町人地の、裏長屋。
      # fact: nagayaif-24
      - 語り: 手がかりは、文政年間漫録という江戸の書き物に残る、ある大工が語った、1年の稼ぎと出費です。そこに、ほかの記録の数字を足して、1か月を積み上げます。
      - 語り: 部屋を借りるには、家賃のほかにも、要るものがありました。
        hook: true
      - 語り: そして、その部屋を預かる大家は、多くが持ち主ではありませんでした。
        hook: true

  # ================================================================ 第1章 店賃は日当の2日分
  - title: 「店賃は日当の何日分？」　九尺二間の部屋
    lines:
      # fact: nagayaif-01
      - 語り: 裏長屋の部屋は、九尺二間と呼ばれました。間口がおよそ2.7メートル、奥行きがおよそ3.6メートルの部屋です。
      # fact: nagayaif-01
      - 語り: 東京都公文書館が1990年に出した、都史紀要の江戸住宅事情は、こう書きます。畳6畳分の広さに、上り口と台所と居間があり、家具といえるものは、ほとんどない。
        card: {head: "九尺二間", body: 畳6畳分に上り口・台所・居間}
      # fact: nagayaif-02
      - 語り: 広さの言い方は、資料で違います。都史紀要は、台所まで入れて、6畳分。東京都の、子ども向けのページは、居間の広さを、4畳半としています。
        tone: 疑問
      # fact: nagayaif-09
      - 語り: 部屋を借りるときには、保証人が出す証文、店請状を入れました。江戸東京博物館には、万延元年、1860年の、本所の亀井戸町の、店請状が残っています。
      # fact: nagayaif-06
      - 語り: その長屋を預かるのが、大家です。ただ、大家の多くは、持ち主ではありませんでした。
      # fact: nagayaif-06
      - 語り: 九州大学の鷲崎俊太郎さんは、2015年、国土交通省の研究所の勉強会で、江戸の地主は8割以上が町に住まない地主で、町の政治が家守だらけになったこともある、と話しています。
        card: {head: "地主の8割以上", body: 町に住まない地主}
      # fact: nagayaif-06
      - 語り: 地主に代わって町屋敷を預かったのが、家を守ると書いて、家守です。長屋の大家さんは、多くがこの家守でした。家守の取り分は、地代と店賃の、5%ほどです。
      # fact: nagayaif-06
      - 語り: のちには、家守の株が、売り買いされるようになります。
      # fact: nagayaif-08
      - 語り: 家守にも、保証人がいました。文政5年、1822年の、ある家守の請状では、同じ町屋敷の五人組の2人が、家守の請人になっています。
        card: {head: "1822年", body: 家守にも保証人、五人組の2人}
      # fact: nagayaif-10
      - 語り: 町人地では、毎年4月と9月に、人の数が調べられました。享保のころの数で、江戸の町人は、およそ55万人。幕末まで、大きくは変わらなかったといいます。
      # fact: nagayaif-24
      - 語り: では、店賃はいくらか。文政年間漫録の大工の話では、店賃は、1年に銀120匁です。匁は、銀の重さで数える、お金の単位です。1か月にすると、10匁です。
        card: {head: "店賃", body: 1年に銀120匁、1か月10匁}
      # fact: nagayaif-24
      - 語り: この大工の手間賃は、1日に銀4匁2分。ほかに、飯米料として1匁2分。合わせて、5匁4分です。
        figure: {type: calc, title: 大工の日当, terms: [[4匁2分, 手間賃], [1匁2分, 飯米料], [5匁4分, 1日]], ops: [＋, ＝]}
      # fact: nagayaif-24
      - 語り: ひと月の店賃10匁は、この日当の、2日分にも足りません。
        tone: 重い
        figure: null
      # fact: nagayaif-41
      - 語り: 時代は少し後になりますが、1842年からの幕府の決まりでは、金1両が、銀なら60匁、銭なら6,500文。これで銭に直すと、大工の日当は、およそ585文です。
      - 語り: 今のお金の目安として、この日当を、1万円とします。すると、ひと月の店賃は、およそ1万8,500円です。
        card: {head: "目安", body: 日当＝1万円なら店賃は約1万8,500円}
      # fact: nagayaif-42
      - 語り: ただ、この目安は、物差しで大きく変わります。日本銀行の貨幣博物館は、18世紀の1両を、米の値段で換算すると約6万円、大工の賃金で換算すると約35万円、としています。
        tone: 疑問
      # fact: nagayaif-42, nagayaif-41
      - 語り: 同じ1両で、6倍近い開きです。この動画の目安では、1両は、およそ11万円。1両がいくらかは、物差しの選び方しだいで、簡単には言えないのです。
      # fact: nagayaif-04
      - 語り: その店賃は、天保のころまでに、上がっていました。鷲崎さんの2012年の論文によると、南伝馬町では、裏の長屋の店賃の上がり方が、表通りの地代より、大きかったのです。
      - 語り: 安い部屋で、まず要るのは、水です。
        hook: true
      - 語り: 長屋の井戸の水の代金は、誰が払っていたのか。
        hook: true

  # ================================================================ 第2章 水
  - title: 「水の代金は誰が払った？」　長屋の井戸と上水
    lines:
      # fact: nagayaif-19
      - 語り: 長屋の路地には、共同の井戸がありました。
      # fact: nagayaif-13
      - 語り: ただ、その多くは、地下水を掘った井戸ではありません。郊外から引いた上水を、地下の、石や木の水道管で通して、井戸の底に溜めたものです。
        card: {head: "長屋の井戸", body: 上水を地下の管で引いて溜めた}
      # fact: nagayaif-13
      - 語り: 木の水道管、木樋の1本の長さは、2メートルから3メートルほど。それを地下でつないで、町の井戸まで水を送りました。
      # fact: nagayaif-15
      - 語り: 承応3年、1654年にできた玉川上水は、多摩川の羽村から四谷大木戸まで、およそ43キロ。
        figure: {type: map, title: 玉川上水, bounds: [139.15, 139.95, 35.55, 35.85], places: [[羽村, 139.31, 35.76], [四谷大木戸, 139.72, 35.69], [江戸城, 139.75, 35.68]], route: [羽村, 四谷大木戸], note: 約43キロ}
      # fact: nagayaif-16
      - 語り: ただ、上水記という記録の書付をもとに、およそ40キロとする辞典もあります。
      # fact: nagayaif-15
      - 語り: この上水は、神田上水と合わせて、江戸城と、隅田川の西の武家地と町人地の、ほぼ全域に水を配りました。
        figure: null
      # fact: nagayaif-14
      - 語り: その水の代金は、水銀と呼ばれました。町人地では、町ごとに、表通りの間口の広さに応じて、地主から集めました。
      # fact: nagayaif-14
      - 語り: 長屋を借りる店子が、じかに払うものでは、ありませんでした。
        tone: 重い
      # fact: nagayaif-17
      - 語り: 年に一度、井戸替えがありました。井戸の水とごみを、全部汲み出して、掃除する行事です。
      # fact: nagayaif-17
      - 語り: 多くは、旧暦の7月7日、七夕の日。6月中に行うこともありました。延宝3年、1675年の句集、糸屑には、井戸替えは、かならず秋の七日かな、という句があります。
        card: {head: "7月7日", body: 井戸替えの日}
      # fact: nagayaif-18
      - 語り: 上水が届かない所もありました。隅田川の東の深川は、埋め立ての土地で、飲み水に苦労しました。
      # fact: nagayaif-18
      - 語り: 江東区の史跡の解説によると、深川は、明治32年、1899年に水道が来るまで、舟で運ばれる水を、買っていました。
        card: {head: "1899年まで", body: 深川は舟で運ぶ水を買った}
      # fact: nagayaif-18
      - 語り: 水を運ぶ業者は、幕府にお金を納めて許しを得て、呉服橋の内側にある、上水の吐き出し口から、水を仕入れました。
      - 語り: その売り値は、確かめられる記録が、見つかりませんでした。
      - 語り: 井戸の近くには、もう1つ、共同のものがありました。
        hook: true
      - 語り: そこに溜まるものは、売り物でした。
        hook: true

  # ================================================================ 第3章 トイレ
  - title: 「トイレの中身は誰のもの？」　下肥の売り買い
    lines:
      # fact: nagayaif-19
      - 語り: 長屋の路地の奥には、共同の井戸、便所、ごみ溜めが並んでいました。
      # fact: nagayaif-11
      - 語り: 江東区の深川江戸資料館は、天保年間の深川佐賀町を、実物大で再現しています。長屋の路地には、井戸と共同便所、ごみ溜め、そしてお稲荷さん。
      # fact: nagayaif-11
      - 語り: 住む人の家族や仕事、年まで決めてあり、木場の木挽き職人の家もあります。
        card: {head: "天保年間", body: 深川佐賀町の長屋を実物大で再現}
      # fact: nagayaif-19
      - 語り: 便所に溜まったものは、近くの村の農家が、畑の肥やし、下肥として、買っていきました。
      # fact: nagayaif-19
      - 語り: 磯田道史さん監修の、2024年の新版、江戸の家計簿によると、その代金は、大家の収入になっていた、といいます。店子には、入りません。
        tone: 重い
        card: {head: "下肥の代金", body: 店子ではなく大家の収入}
      # fact: nagayaif-20
      - 語り: 下肥は、やがてお金で売り買いされるようになり、汲み取る場所の取り合いで、値が上がりました。
      # fact: nagayaif-20
      - 語り: キヤノングローバル戦略研究所の、堅田元喜さんの2021年の報告は、町奉行が値を抑えようとしたけれど、うまくいかなかった、と書きます。
      # fact: nagayaif-20
      - 語り: 天保14年、1843年の2月1日には、武蔵と下総の283か村の代表が、勘定奉行に、下肥の値が高すぎると訴えた、とされます。
        card: {head: "1843年", body: 283か村、下肥の値下げを訴える}
      # fact: nagayaif-20
      - 語り: この訴えは、寛政のころの値下げの訴えに、ならったものとされます。
      # fact: nagayaif-19, nagayaif-14
      - 語り: 上水の届く町の店子は、水にも、トイレにも、自分では払いませんでした。それでも、そのまわりでは、お金が動いていたのです。
        tone: しみじみ
      - 語り: ところが、体を洗うには、店子が、自分でお金を払いました。
        hook: true
      - 語り: 江戸の湯屋の、湯銭です。
        hook: true

  # ================================================================ 第4章 湯屋
  - title: 「湯銭はいくら？」　江戸の湯屋
    lines:
      # fact: nagayaif-21
      - 語り: 江戸の最初の銭湯は、天正19年、1591年。歴史学者の山本博文さんによると、湯銭は、永楽銭1文でした。
      # fact: nagayaif-21
      - 語り: 江戸の終わりに、江戸と大坂の暮らしを書き比べた、喜田川守貞の守貞謾稿によると、湯銭ははじめは大人10文ほど。
        card: {head: "湯銭", body: 大人10文ほど}
      # fact: nagayaif-21
      - 語り: それが天保の改革で、大人8文、子ども6文、小さな子は4文と、決められました。
        card: {head: "天保の改革", body: 大人8文・子ども6文・小さな子4文}
      # fact: nagayaif-21
      - 語り: 大人1人が毎日通うと、10文なら、30日で300文。8文なら、240文です。
      # fact: nagayaif-21
      - 語り: 幕末には、薪が高くなって、文久のころに大人12文。慶応2年、1866年の8月には、24文まで上がります。
      - 語り: 300文は、大工の日当の、半日分ほど。今の目安で、およそ5,100円です。
      # fact: nagayaif-22
      - 語り: 湯屋の数は、資料で違います。山本さんは、文化5年、1808年に湯屋の仲間ができ、計523株あった、とします。
        tone: 疑問
      # fact: nagayaif-22
      - 語り: 一方、小学館の日本大百科全書は、文化年間に、600軒余りあったといわれる、と書きます。株は商いの権利の数、軒は店の数で、数え方そのものが違うのかもしれません。
      # fact: nagayaif-23
      - 語り: 寛政3年、1791年の正月、老中の松平定信は、男と女が一緒に入る、入込湯を禁じました。
        card: {head: "1791年", body: 入込湯を禁じる}
      # fact: nagayaif-23
      - 語り: 守貞も、寛政から混浴は禁じられた、と書いています。それでも、入込湯の湯屋は、なくなりませんでした。
      # fact: nagayaif-23
      - 語り: 湯船の手前には、柘榴口という低い入り口がありました。江戸の柘榴口を、守貞は、鳥居に似ている、と書いています。
      # fact: nagayaif-23
      - 語り: 湯屋が開くのは、朝から夕方まで。夜は火事を恐れて開けず、風の強い日は、休みました。
      # fact: nagayaif-23
      - 語り: 男湯の二階は、湯上がりの男たちの、休み場です。式亭三馬の浮世風呂は、そこでの会話をもとに書いたもの、とされます。
      # fact: nagayaif-24
      - 語り: では、大工の出費のどこに、湯銭は入っているのか。大工が挙げた出費の並びには、湯銭という項目が、ありません。
        tone: 疑問
      # fact: nagayaif-21, nagayaif-24
      - 語り: 天保の湯銭で、夫婦と小さな子の3人が、毎日通うと、1日20文。30日で600文。銀にすると、およそ5匁5分です。
      # fact: nagayaif-24
      - 語り: 大工の家の、ひと月の残りは、およそ6匁。湯銭だけで、ほとんど消える計算です。
        tone: 重い
        card: {head: "ひと月の残り 約6匁", body: 3人の湯銭 約5匁5分}
      # fact: nagayaif-30
      - 語り: そして、その大工の家が食べるお米の値は、天保に入ると、倍を超えます。
        hook: true
      - 語り: 長屋の台所には、売り手のほうが、やって来ました。
        hook: true

  # ================================================================ 第5章 台所
  - title: 「お米と豆腐はいくら？」　棒手振りの来る台所
    lines:
      # fact: nagayaif-24, nagayaif-31
      - 語り: 大工の家のお米は、夫婦と小さな子の3人で、1日ちょうど1升。代金は、ひと月に29匁5分です。
        card: {head: "大工の家の米", body: 1日1升、ひと月29匁5分}
      # fact: nagayaif-31
      - 語り: 天保4年、1833年の10月、飢饉のさなかに、町奉行所は、その日稼ぎの人たちに、米を配りました。男1人に白米5合。60歳以上と15歳以下の男、それに女は、3合の割合です。
      # fact: nagayaif-31
      - 語り: その前の配り方では、39日間で、31万8千人あまりに渡しています。
        card: {head: "天保の飢饉", body: 前の配給で31万8千人あまり}
      # fact: nagayaif-30
      - 語り: 江戸の米の値は、銭100文で白米が何合買えるかで言いました。百相場です。
      # fact: nagayaif-30
      - 語り: 明治から昭和の江戸研究家、三田村鳶魚が書き抜いた記録では、1808年の秋は、100文で8合5勺。勺は、1合の10分の1です。
        figure: {type: bars, title: 銭100文で買える白米, bars: [[1808年の秋, 85], [1836年の秋, 40]], labels: [8合5勺, 4合], upto: 1}
      # fact: nagayaif-30
      - 語り: それが、天保の飢饉のさなか、1836年の秋には、4合。半分以下です。
        tone: 重い
        figure: {type: bars, title: 銭100文で買える白米, bars: [[1808年の秋, 85], [1836年の秋, 40]], labels: [8合5勺, 4合], upto: 2}
      # fact: nagayaif-30, nagayaif-31
      - 語り: 男1人が、1日5合食べるとして、ひと月で150合。1808年の値なら、およそ1,760文。1836年の値なら、3,750文。大工の日当にして、3日分から、6日分あまりに増えます。
        figure: null
      # fact: nagayaif-25
      - 語り: お米のほかは、売りに来ました。天秤棒で荷をかついで、売り歩く、棒手振りです。文政年間漫録は、野菜を売る棒手振りの、1日も書き留めています。
      # fact: nagayaif-25
      - 語り: 朝、銭600文か700文を持って、「蕪」「大根」「蓮根」「芋」を仕入れる。1日の売り上げは、1,200文から1,300文。
        card: {head: "棒手振りの1日", body: 元手600〜700文、売り上げ1,200〜1,300文}
      # fact: nagayaif-25
      - 語り: 元手を借りた者の利息は、1日限りで、100文につき2文か3文。記録は、700文の利息を21文としています。
      # fact: nagayaif-25
      - 語り: 帰ると、妻に、米代200文、味噌と醤油の代50文。子どもに、菓子代を12文か13文。それでも、100文あまりか200文が残る、と記録は書きます。
      # fact: nagayaif-25, nagayaif-41
      - 語り: 記録が書く、1日の稼ぎは575文。大工の日当を銭に直した、およそ585文と、ほとんど同じです。
      # fact: nagayaif-25
      - 語り: 米代の200文は、ひと月30日で、6,000文。銀にして、およそ55匁です。
      # fact: nagayaif-27
      - 語り: 豆腐はどうか。天保13年、1842年の5月、豆腐は、1丁48文で売るよう、命じられました。
        card: {head: "1842年", body: 豆腐は1丁48文で売れ}
      # fact: nagayaif-27
      - 語り: すると、小さく切って売る者が出ます。調べてみると、48文では、ほとんど儲けが出ないことが分かりました。
      # fact: nagayaif-27
      - 語り: 翌年の2月、町奉行所は、52文への値上げを認め、1丁の大きさを決めます。縦7寸、横1尺8寸の箱で作り、9つに分けたものが1丁です。
      # fact: nagayaif-27
      - 語り: 50年ほど前の寛政3年、1791年には、1丁38文と決められていました。38文から、52文へ。
      # fact: nagayaif-28
      - 語り: 東京都公文書館は、今の豆腐の1丁は、江戸の豆腐の4分の1、小半丁に近い、と書いています。江戸の1丁は、今の4丁分ほどの大きさでした。
        card: {head: "江戸の豆腐1丁", body: 今の豆腐の4丁分ほど}
      # fact: nagayaif-29
      - 語り: そば1杯は、日本銀行の貨幣博物館によると、16文。1両を6,500文とすると、1両で、およそ406杯です。
      # fact: nagayaif-29
      - 語り: もっとも、守貞謾稿を紹介する記事は、守貞の生きた幕末には、そばは24文になっていた、と書きます。
      # fact: nagayaif-32
      - 語り: 夜の灯りの油も、天保に入ると、値が5割以上、上がっていました。
        hook: true
      - 語り: その油を、行灯は、ひと晩にどれだけ使ったのか。
        hook: true

  # ================================================================ 第6章 灯りと火事
  - title: 「行灯の油はいくら？」　灯りと、町を焼く火
    lines:
      # fact: nagayaif-32
      - 語り: 長屋の夜の灯りは、行灯です。三田村鳶魚の書き抜きでは、灯りの油は、文化5年に、1合41文。天保7年の8月には、64文。
        card: {head: "灯りの油1合", body: 41文 → 64文}
      # fact: nagayaif-32
      - 語り: 石川英輔さんと田中優子さんは、行灯が使う油を、季節をならして1日4勺から5勺と見積もり、ひと月600文としています。
      # fact: nagayaif-32
      - 語り: 1日5勺なら、30日で15合。1合41文で、615文。大工の日当の、1日分を少し超えます。
        figure: {type: calc, title: 行灯の油 ひと月, terms: [[15合, 1日5勺×30日], [41文, 1合], [615文, ひと月]], ops: [×, ＝]}
      # fact: nagayaif-32
      - 語り: 天保7年の1合64文なら、960文。日当の1日半を超えます。
      # fact: nagayaif-32
      - 語り: 大奥の女中に油を渡す決まりでは、夜明けまで点けて、一晩6勺でした。
        figure: null
      # fact: nagayaif-32
      - 語り: 安い魚の油もありました。「鰯」「鱈」「鰊」などからとった油です。けれど、油煙が多く、真っ黒な煙が出て、座敷では使えないほど臭った、と三田村は書きます。
      # fact: nagayaif-34
      - 語り: そして江戸の町は、何度も焼けました。東京消防庁によると、江戸時代264年の間に、100回以上の大火があり、日本橋は、10回焼け落ちました。
        card: {head: "江戸の大火", body: 264年で100回以上}
      # fact: nagayaif-35
      - 語り: 文化3年、1806年3月4日の大火は、下町の530町を焼き、死者はおよそ1,200人。明暦、明和の大火と並ぶ、江戸三大大火の1つに数えられます。
        tone: 重い
        card: {head: "1806年", body: 文化の大火、530町を焼く}
      # fact: nagayaif-35
      - 語り: 幕府は、焼け出された人のために、御救小屋を建て、仮の宿と食事を与えました。
      # fact: nagayaif-36
      - 語り: 文政12年、1829年の3月21日には、外神田の佐久間町二丁目の、材木小屋から火が出ます。
        card: {head: "1829年", body: 佐久間町二丁目から出火}
      # fact: nagayaif-37
      - 語り: 5年後の、天保5年。1834年の2月7日。同じ佐久間町二丁目から、また火が出ました。瓦版は、南は浜御殿、東は佃島まで焼けた、と伝えます。
        tone: 重い
        card: {head: "1834年", body: 同じ佐久間町二丁目から、また出火}
      # fact: nagayaif-38
      - 語り: 火を消したのは、町火消です。享保3年、1718年、町奉行の大岡忠相が町火消をつくりました。のちに、いろは48組と、本所と深川の16組。合わせて64組になります。
      # fact: nagayaif-38
      - 語り: 水で消すより、火のまわりの家を壊して、燃え広がるのを止めました。手押しのポンプ、竜吐水もありましたが、今のホースほど、水は飛びませんでした。
      - 語り: では、ひと月で、全部でいくらかかったのか。
        hook: true
      - 語り: 大工の話の数字に、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：江戸の長屋の1か月はいくらだったか
    lines:
      - 語り: もしも、江戸の長屋で、1か月暮らしたら。大工の1年の稼ぎと出費を、12で割って、積み上げます。
      # fact: nagayaif-24
      - 語り: 店賃が、10匁。お米が、29匁5分。
        figure: {type: bars, title: 大工の家のひと月の出費, bars: [[店賃, 10], [米, 29.5], [塩・醤油・味噌・油・薪炭, 58.3], [道具・家具, 10], [着る物, 10], [つきあい・祭り・仏事, 8.3]], labels: [10匁, 29匁5分, 約58匁, 10匁, 10匁, 約8匁], upto: 2}
      # fact: nagayaif-24
      - 語り: 「塩」「醤油」「味噌」「油」「薪と炭」が、およそ58匁。
        figure: {type: bars, title: 大工の家のひと月の出費, bars: [[店賃, 10], [米, 29.5], [塩・醤油・味噌・油・薪炭, 58.3], [道具・家具, 10], [着る物, 10], [つきあい・祭り・仏事, 8.3]], labels: [10匁, 29匁5分, 約58匁, 10匁, 10匁, 約8匁], upto: 3}
      # fact: nagayaif-24
      - 語り: 道具と家具が10匁。着る物が10匁。親類とのつきあいと、祭りや仏事が、およそ8匁。
        figure: {type: bars, title: 大工の家のひと月の出費, bars: [[店賃, 10], [米, 29.5], [塩・醤油・味噌・油・薪炭, 58.3], [道具・家具, 10], [着る物, 10], [つきあい・祭り・仏事, 8.3]], labels: [10匁, 29匁5分, 約58匁, 10匁, 10匁, 約8匁], upto: 6}
      # fact: nagayaif-24
      - 語り: 合わせて、およそ126匁。稼ぎの132匁あまりから引くと、残りは、およそ6匁です。
        figure: {type: calc, title: 大工の家のひと月, terms: [[約132匁, 稼ぎ], [約126匁, 出費], [約6匁, 残り]], ops: [−, ＝]}
      # fact: nagayaif-24
      - 語り: 日当で数えると、ひと月に働くのは、およそ24日半。そのうち23日分あまりが、出ていきます。
        figure: null
      - 語り: 今の目安に直すと、ひと月の出費は、およそ23万4千円。稼ぎの、およそ24万5千円と、ほとんど同じです。
      - 語り: そのうち店賃は、およそ1万8,500円。塩や醤油や薪の代は、およそ10万8千円です。
      # fact: nagayaif-24, nagayaif-21
      - 語り: 水とトイレは、上水の届く町なら、店子が払うものではありません。けれど、大工の出費の並びには、湯銭もありません。家族で毎日湯屋に通えば、ひと月の残りは、ほとんど消えます。
      # fact: nagayaif-27, nagayaif-21, nagayaif-03
      - 語り: そして、天保の改革は、長屋の暮らしのあちこちに、手を入れました。豆腐は48文、湯銭は大人8文。
      # fact: nagayaif-03
      - 語り: 天保13年には、地代と店賃、職人の手間賃を、寛政より前の水準まで下げるよう、町触が出ています。
        card: {head: "1842年", body: 店賃と手間賃を寛政より前の水準へ}
      # fact: nagayaif-05
      - 語り: 寛政2年、1790年にも、店賃の引き下げが話し合われました。けれど、そのときは下がりませんでした。町の費用を積み立てる、七分積金という別の仕組みに変わっています。
      # fact: nagayaif-43
