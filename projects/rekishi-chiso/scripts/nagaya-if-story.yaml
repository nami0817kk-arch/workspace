# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と sakoku-if-story.yaml の型）。もしも現代人が江戸の長屋に住んだら。2026-11-19 下書き。
# 公開の予定は 11/25 12:00（12時の もしも 枠）。型は docs/story-main.md「00. 伸びる型」の もしも×暮らし（「もしあなたが江戸に」の形）＋数字を積み上げる型。
#   歴史の分岐の if ではない。「もしも」は入口の枠だけで、中身は記録に残る数字と出来事だけ（想像の台詞・作った筋・架空の人物なし）。
#   時と所：文政〜天保（1820年代〜1840年代はじめ）の江戸の町人地の裏長屋。背骨は『文政年間漫録』の大工の1年の家計（三田村鳶魚『江戸ばなし其2』1943 の引用、NDL 全文で本文）。
#   1か月の出費は、その年の家計を12で割って自分で積み上げる（下の計算）。湯銭・米の百相場・灯油は別の記録の数で足し算する。
#   冒頭（10秒以内）＝長屋の家賃はひと月で大工の日当の2日分足らず。出費の8%。重いのは「塩・醤油・味噌・油・薪炭」で46%。1年で残るのは日当の14日分ほど。なぜ残らないのか。
#   序章 家賃は出費の8%／第1章 店賃は日当の2日分／第2章 水の代金は誰が払ったか／第3章 トイレの中身は誰のものか／第4章 湯銭はいくらか／
#   第5章 棒手振りから買う台所／第6章 行灯の油と、町を焼く火／まとめ。締めは余韻の一文＋登録のお願い（story: true）。
# 既出と重ねない：大奥の暮らし（ooku-story）・将軍の1日（shogun-story）・明暦の大火（meireki-story）。明暦の大火には触れない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/江戸の長屋if_facts_20261119.yaml、担当A=住まい・B=水と湯・C=食べ物と灯り・D=火事と換算）にあるものだけ。行の上に `# fact: nagayaif-24`。
# 記録の食い違い（3つ）：①九尺二間の広さ（都史紀要 6畳分／東京都こどもホームページ 居間4畳半）②1両は今のいくら（貨幣博物館 米で約6万円／大工の賃金で約35万円）
#   ③湯屋の数（山本博文 文化5年に523株／日本大百科全書 文化年間に600軒余り）。
# 自分で計算した数（全部計算し直した）：
#   大工：工料4匁2分＋飯米料1匁2分＝5匁4分。354日−60日＝294日。294×5.4＝1,587.6匁（記録の1貫587匁6分と合う）。
#   支出 354＋120＋700＋120＋120＋100＝1,514匁（記録の1貫514匁と合う）。残り 1,587.6−1,514＝73.6匁（記録の73匁6分と合う）→塩醤味噌油薪炭の700匁は合計からも確かめた。
#   店賃 120÷1,514＝7.9%→約8%。塩ほか 700÷1,514＝46.2%→46%。残り 73.6÷5.4＝13.6→日当の14日分ほど。
#   ひと月（÷12）：稼ぎ132.3／店賃10／米29.5／塩ほか58.33／道具10／衣服10／つきあい8.33／計126.17／残り6.13匁。店賃 10÷5.4＝1.85日分（2日分に足りない）。
#   働く日 294÷12＝24.5日。出費 126.17÷5.4＝23.4日分。
#   銭への目安：1842年からの公定 1両＝銀60匁＝銭6,500文 → 1匁＝108.3文。日当 5.4×108.3＝585文。
#   円の目安：日当5匁4分＝1万円 → 1匁＝1,852円・1文＝17.1円。店賃10匁＝18,519円→約1万8,500円。稼ぎ132.3匁＝245,000円。塩ほか58.33匁＝108,000円。1両＝60匁＝111,111円→約11万円。
#   湯銭：10文×30＝300文（＝2匁8分、300÷585＝日当の半日分、約5,100円）。3人（8＋8＋4＝20文）×30＝600文＝5.54匁→約5匁5分。
#   米：1日1升＝3石5斗4升÷354日。百相場 8合5勺→150合で1,765文（約1,760文）、4合→3,750文。8.5→4は半分以下。
#   棒手振り：米代200×30＝6,000文＝55.4匁。利息は700文に100文あたり3文で21文。
#   油：5勺×30＝15合、15×41＝615文、615÷585＝1.05（日当の1日分を少し超える）。
#   そば 6,500÷16＝406.25→約406杯。佐久間町 1829→1834＝5年。い組の数ほかは使わない。1両の開き 35÷6＝5.8→6倍近い。
# 確かめられなかったこと（台本では言わない）：九尺二間の月の店賃の一般の額（月300〜1,000文などは一次の裏付けなし）、下肥の値段（1人年に銀2〜3匁は要確認）、
#   水売りの値段、惣後架の数、天保13年の町触の月日、文政12年の大火の死者・焼失数（37万軒・2,800人は本文未見）、天保5年の大火の焼失数、裏長屋の屋根が何葺きか。
# 絵：AI 絵（Gemini。一覧は scripts/story/nagaya_if_main_look.yaml の頭）だけ。実在の人物の顔は描かない。字・紋・瓦屋根の裏長屋・ガラス窓・電灯は描かない。
