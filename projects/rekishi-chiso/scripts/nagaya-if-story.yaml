# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸の長屋の家賃は、ひと月で、大工の日当の2日分にも足りませんでした。出費の中で家賃はわずか8%。いちばん重かったのは、家賃でもお米でもなく、「塩」「醤油」「味噌」「油」「薪と炭」。
  しかもこの大工の家に、1年働いて残ったお金は、日当の14日分ほどでした。
  もしも今の私たちが、江戸の長屋で1か月暮らしたら、いくらかかるのか。文政から天保のころの記録に残る数字だけで、積み上げます。
  この動画でわかること
  ・長屋の店賃が、大工の日当の何日分だったか
  ・井戸の水の代金と、トイレの中身の代金は、誰が払い、誰が受け取ったか
  ・湯銭・お米・豆腐・行灯の油の値段と、1か月の合計
  ・天保の改革が、長屋の家計のどこに手を入れたか
description_note: |-
  この動画に、想像の台詞や作った話はありません。「もしも」は入口の問いだけで、数字は記録（『文政年間漫録』を引く三田村鳶魚『江戸ばなし』、東京都公文書館、日本銀行金融研究所 貨幣博物館、東京消防庁、国土交通政策研究所、鷲崎俊太郎・堅田元喜・山本博文の論考、江東区・新宿区・深川江戸資料館、日本大百科全書・日本歴史地名大系など）から取りました。
  1か月の額は、大工の1年の家計を12で割り、別の記録の湯銭・米の値段・灯りの油の値段を足して、自分で計算したものです。銭への換算は1842年からの幕府の決まり（1両＝銀60匁＝銭6,500文）、円への換算は大工の日当を1万円とした目安です。換算の物差しによって、額は大きく変わります。
  九尺二間の広さ、1両の値打ち、湯屋の数は、資料によって違います。下肥の値下げの訴えは論文の書誌で確かめたもので、本文は確かめられていません。
  絵は、画像生成AIで作った想像上の風景です。サムネイルの絵は、AI による想像図です。

en:
  title: "What If You Lived in an Edo Tenement? Rent, Water, Toilets and the Cost of One Month"
  description: |-
    In Edo, a month's rent in a back-alley tenement cost less than two days of a carpenter's wage. Rent was only 8 percent of his spending. The heaviest cost was not rent or rice, but salt, soy sauce, miso, oil, firewood and charcoal.
    After a full year of work, this carpenter's family had only about fourteen days' wages left.
    What would one month in an Edo back-alley tenement cost? We add it up using only numbers recorded in the 1820s to the early 1840s.
    In this video you will learn:
    - How many days of a carpenter's wage the monthly rent took
    - Who paid for the well water, and who was paid for the contents of the shared toilet
    - The price of the bathhouse, rice, tofu and lamp oil, and the monthly total
    - Where the Tenpo Reforms reached into the tenement budget
    Japanese-language history video (Japanese audio). "What if" is only the question; everything else comes from records.
  chapters:
    - "Rent Was Only 8 Percent"
    - "Rent: Less Than Two Days' Wages"
    - "Who Paid for the Water?"
    - "Who Owned the Toilet's Contents?"
    - "The Price of a Daily Bath"
    - "A Kitchen Supplied by Peddlers"
    - "Lamp Oil and the Fires That Burned the City"
    - "Summary: What One Month Cost"

