        hook: true

  # ================================================================ 第1章 事件の夜
  - title: 慶応3年11月15日の夜、近江屋　十津川の者と名乗った客
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1867
    lines:
      # fact: ryoma-ansatsu-42
      - 語り: 慶応3年11月15日の夜。京都の河原町通り、蛸薬師を下がった所の、近江屋。
        card: {head: "慶応3年11月15日", body: "1867年12月10日の夜"}
      # fact: ryoma-ansatsu-42
      - 語り: 近江屋は、土佐藩の御用を務める、醤油の商いの家でした。その二階に、龍馬と、土佐の同志、中岡慎太郎がいました。
      # fact: ryoma-ansatsu-18
      - 語り: 客が来たのは、夜の五つごろ。日が暮れて、しばらくたったころです。
      - 語り: その夜、龍馬は、近江屋の二階で斬られ、亡くなりました。
        tone: 重い
      # fact: ryoma-ansatsu-20
      - 語り: 中岡は、すぐには亡くなりませんでした。当時の手紙の多くは、17日まで生きていた、と書いています。そのあいだに、駆けつけた仲間に、あの夜のことを話しています。
      # fact: ryoma-ansatsu-07
      - 語り: その話を伝える手紙の1つが、12月4日付の、土佐の清岡半四郎の手紙です。十津川の者と偽って、3人が来た。従僕に、名札を差し出した。
      # fact: ryoma-ansatsu-07
      - 語り: 年の書かれていない、別の聞き取りの記録も、こう書きます。従僕の藤吉が名札を持って二階へ上がると、3人は、その後ろから続いて上がった。
      # fact: ryoma-ansatsu-18
      - 語り: もう1つ、土佐藩の重役、寺村左膳の手記があります。中岡が、まだ生きているうちに書かれたものです。
      # fact: ryoma-ansatsu-18
      - 語り: 寺村の手記には、こうあります。何者とも知れない7人が来て、そのうち3人が、二階へ。
        card: {head: "寺村左膳の手記（慶応3年）", body: "7人が来て、3人が二階へ"}
      - 語り: 来たのは7人。二階へは3人。この数を、覚えておいてください。
      # fact: ryoma-ansatsu-23
      - 語り: 現場に駆けつけた土佐の谷干城は、のちの講演で、中岡から聞いた言葉を語っています。賊が口にしたのは、こなくそ、と、もうよい、の2つだけだった。
      # fact: ryoma-ansatsu-23
      - 語り: こなくそ、は、四国の者がよく言う言葉だ。けれど、土佐の者ではないだろう。中岡は、そう考えた、と谷は伝えます。
      # fact: ryoma-ansatsu-23, ryoma-ansatsu-07
      - 語り: ただ、谷が中岡から聞いた賊は、2人。清岡の手紙では、3人。同じ夜の人数が、記録によって、もう違っています。
        figure: {type: table, title: 近江屋の夜の客　記録の違い, cols: [人数, 名乗った名], rows: [[寺村左膳の手記 慶応3年, 7人　二階へ3人, 書いていない], [清岡半四郎の手紙 慶応3年12月, 3人, 十津川の者], [谷干城の講演 明治, 2人, 十津川の者]], upto: 3}
      - 語り: その夜から、龍馬の仲間たちは、ある組の名前を、口にし始めます。
        figure: null
        tone: 疑問
        hook: true

  # ================================================================ 第2章 新選組を疑う
  - title: 「敵は新選組に決まった」　現場に残った鞘と下駄
    background: {image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg, credit: "歌川広重「東海道五十三次 京師 三条大橋」"}
    year: 1867
    lines:
      # fact: ryoma-ansatsu-18
      - 語り: 寺村の手記は、続けて書いています。相手は、あとで聞くと、幕府の新撰組だという。
      # fact: ryoma-ansatsu-19
      - 語り: 事件から9日後の、11月24日。海援隊の菅野覚兵衛は、中岡の父への手紙の追伸に、こう書きました。敵は、会津に属する新選組に、決まった。
        card: {head: "菅野覚兵衛の手紙（11月24日）", body: "敵は新選組に決まった"}
      # fact: ryoma-ansatsu-04
      - 語り: 谷干城は、賊が残していったのは、刀の鞘だけだった、と言っています。
      # fact: ryoma-ansatsu-22
      - 語り: 龍馬の甥、小野淳輔が、翌年の正月に書いた手紙によれば、事件の3日後、11月18日の朝。新選組から分かれた、伊東甲子太郎の一派、御陵衛士の2人が、薩摩の屋敷に逃げ込んできました。
      # fact: ryoma-ansatsu-04
      - 語り: 谷は、その鞘を、伏見の薩摩の屋敷へ持って行き、かくまわれていた伊東の一派に見せました。すると、これは、原田左之助の刀だと思う、と言い出した。
      - 語り: 原田左之助は、新選組の隊士です。
      # fact: ryoma-ansatsu-24
      - 語り: ところが、同じ土佐の田中光顕の談話では、鞘を見て、新選組の物だ、と言ったのは、伊東甲子太郎本人。場所は、近江屋の現場でした。この談話には、年が書かれていません。
      # fact: ryoma-ansatsu-05
      - 語り: 研究者の菊地明さんは、2010年、国立国会図書館の月報で、伊東が鞘を見た、という話には記録が無い、と書きました。
      # fact: ryoma-ansatsu-04
      - 語り: 菊地さんによれば、土佐の側が原田を疑った元は、鞘ではなく、中岡が覚えていた、犯人の声でした。
      # fact: ryoma-ansatsu-04
      - 語り: 御陵衛士の阿部十郎は、明治になってからの談話で、原田の声によく似ている、と言った、というのです。
      # fact: ryoma-ansatsu-44
      - 語り: 1915年に出た、伊予の歴史の本も、谷干城の話によるとして、斬ったのは伊予松山の人、原田左之助だという、と書いています。ただ、この本は、事件の月を、12月と書き違えています。
      # fact: ryoma-ansatsu-06
      - 語り: 現場には、下駄も残っていた、という話もあります。1926年に出た本は、近江屋の主人の談話をもとに、こう書いています。
      # fact: ryoma-ansatsu-06
      - 語り: 下駄は、先斗町の料理屋、瓢亭の物。店に尋ねると、ゆうべ新選組の方に貸した、と答えた。
      # fact: ryoma-ansatsu-06
      - 語り: けれど、菊地さんは、当時の記録では、下駄は2足で、焼き印は、瓢亭のものではなかった、と見ています。そのころの雨で、道はまだぬかるんでいた。龍馬たちの側の下駄だった、かもしれないのです。
        figure: {type: table, title: 現場に残った物　記録の違い, cols: [新選組を指す話, 違う話], rows: [[刀の鞘, 原田左之助の刀（谷干城）, 伊東が見た話は記録に無い（菊地 2010）], [下駄, 瓢亭の下駄（1926年の本）, 2足で別の店の印（菊地 2010）]], upto: 2}
      # fact: ryoma-ansatsu-10
      - 語り: 紀州藩を疑った仲間もいました。紀州藩の三浦休太郎が、新選組をそそのかして、龍馬を殺させた、という噂があったのです。
        figure: null
      # fact: ryoma-ansatsu-10
      - 語り: 12月7日の夜、海援隊の陸奥陽之助、のちの陸奥宗光たちは、三浦の宿を襲いました。三浦の側には、新選組がいました。
      - 語り: ところが3年後、取り調べの場で、新選組とは別の組の名前が、出てきます。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 明治3年の口書
  - title: 明治3年、取り調べの口書　見張りだったと答えた今井信郎
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1870
    lines:
      # fact: ryoma-ansatsu-01
      - 語り: 明治3年、1870年。新しい政府は、箱館で降伏した、元幕府の兵を、取り調べていました。
      # fact: ryoma-ansatsu-36, ryoma-ansatsu-37
      - 語り: その1人が、元京都見廻組の、今井信郎です。見廻組は、旗本や御家人の子弟からなる、京都の見回りの組。浪士から始まった新選組とは、別の組でした。
      # fact: ryoma-ansatsu-13
      - 語り: 2月の取り調べの口書で、今井は、7人で行った、と答えています。佐々木只三郎、渡辺吉太郎、高橋安次郎、桂隼之助、土肥仲蔵、桜井大三郎、そして自分。
        figure: {type: table, title: 今井信郎の口書（明治3年）, cols: [名前, 刑部省での答え], rows: [["1", 佐々木只三郎, 上り口に], ["2", 渡辺吉太郎, 二階へ], ["3", 高橋安次郎, 二階へ], ["4", 桂隼之助, 二階へ], ["5", 土肥仲蔵, 見張り], ["6", 桜井大三郎, 見張り], ["7", 今井信郎, 見張り]], upto: 7}
      # fact: ryoma-ansatsu-18, ryoma-ansatsu-13
      - 語り: 7人。土佐の寺村左膳が、事件の直後に書いた数と、同じです。
      # fact: ryoma-ansatsu-01
      - 語り: 次の、刑部省での口書は、さらに細かくなります。二階へ踏み込んだのは、渡辺、高橋、桂の3人。佐々木は、上り口。今井と、土肥、桜井は、見張りでした。
      # fact: ryoma-ansatsu-18
      - 語り: 二階へ3人。これも、寺村の手記と同じです。
        figure: null
      # fact: ryoma-ansatsu-01
      - 語り: 同じ口書によれば、一行は、その日の昼の八つ、午後2時ごろにも、近江屋を訪ねていました。桂が様子を見に行くと、龍馬は留守。出直したのが、夜の五つでした。
      # fact: ryoma-ansatsu-01, ryoma-ansatsu-07
      - 語り: ただ、名乗った名が違います。今井によれば、出した名札は、松代藩。当時の手紙の、十津川とは、合いません。
        card: {head: "名乗った名", body: "当時の手紙は十津川　今井の口書は松代藩"}
      # fact: ryoma-ansatsu-01
      - 語り: その先のことを、今井は、下りてきた3人から聞いた、という形で答えています。龍馬は討ち留めた。ほかの2人は、生死を見届けなかった。
      # fact: ryoma-ansatsu-01
      - 語り: 理由は、龍馬が、前の年に伏見で、捕り方の同心2人を、短筒で撃ったこと。命令は、捕らえよ、手に余れば討ち取れ、だったと言います。
      # fact: ryoma-ansatsu-01
      - 語り: では、誰が命じたのか。今井は、老中か、京都守護職の会津藩主、松平肥後守か、それも知らない、と答えました。
        tone: 疑問
      # fact: ryoma-ansatsu-16
      - 語り: 刑部省は、見廻組の上役だった、小笠原忍斎にも問い合わせました。答えは、捕らえるよう指図したことなど無い。9月から病気で、12月に役を退いたので、何も知らない。
      # fact: ryoma-ansatsu-08
      - 語り: 同じ年、元新選組の大石鍬次郎も、取り調べで、近藤勇から、見廻組の仕業だと聞いた、と答えています。前に、新選組がやったと白状したのは、拷問を逃れるためだった、と取り消しました。
      # fact: ryoma-ansatsu-05
      - 語り: その前の取り調べで、大石を問い詰めた薩摩の者は、現場に、原田左之助の鞘が落ちていた、と迫っていました。
      # fact: ryoma-ansatsu-15
      - 語り: 一方、同じ明治3年の4月、高知藩は刑部省に、こう届けています。確かな証拠は無いが、新撰組だと疑っている。捕まった近藤勇が、原田左之助も加わった、と言ったと、兵士から聞いた。
      # fact: ryoma-ansatsu-15, ryoma-ansatsu-08
      - 語り: 近藤勇は、見廻組の仕業だと言った。近藤勇は、原田が加わったと言った。同じ近藤の言葉が、伝える人によって、正反対です。
      # fact: ryoma-ansatsu-12
      - 語り: 明治3年9月20日。今井に、言い渡しがあります。手を下さなかったとはいえ、この事件に関わった。そのうえ、脱走して、官軍と戦い続けた。寛大な扱いとして、禁錮。
        tone: 重い
      # fact: ryoma-ansatsu-12
      - 語り: のちの本には、終身禁錮、と書くものもあります。けれど、言い渡しの文に、終身の字は、ありません。
      # fact: ryoma-ansatsu-14
      - 語り: 今井は、明治5年の1月に赦された、と昭和の本は書いています。
      # fact: ryoma-ansatsu-32
      - 語り: 口書で、二階へ踏み込んだと名を挙げられた3人は、どれも、のちの戦いで死んでいました。菊地さんは、そこに、生きている仲間の名を出さない書き方を、読み取っています。
      - 語り: そして30年後。今井は、まるで違う話を、始めます。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 近畿評論
  - title: 明治33年、雑誌の談話「龍馬を斬ったのは自分だ」
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1900
    lines:
      # fact: ryoma-ansatsu-02
      - 語り: 明治33年、1900年。京都の雑誌、近畿評論に、今井信郎の談話が載ります。
      # fact: ryoma-ansatsu-02
      - 語り: 行ったのは4人。渡辺吉太郎、桂隼之助、今も生きていて高い役についているので名を言えない1人、そして自分。龍馬を斬ったのは、自分だ。鞘を置き忘れたのは、渡辺吉太郎だ。
        card: {head: "近畿評論の談話（明治33年）", body: "4人で行き、龍馬を斬ったのは自分"}
      # fact: ryoma-ansatsu-02, ryoma-ansatsu-01
      - 語り: 口書では、見張り。雑誌では、自分が斬った。7人は4人に、捕らえよという命令は、自分から思い立った話に、変わっています。
      # fact: ryoma-ansatsu-25
      - 語り: この談話を書いたのは、記者の結城礼一郎。父は、元新選組の、結城無二三でした。
      # fact: ryoma-ansatsu-25
      - 語り: 結城は、1924年の本で、打ち明けています。もとは、甲斐新聞の続き物として書いたもので、事実も多少飾り、龍馬を斬った瞬間なども、大いに芝居がかりで書いた。
      # fact: ryoma-ansatsu-25
      - 語り: それを、元の編集長が、そのまま近畿評論へ寄せたのだ、と。
      # fact: ryoma-ansatsu-25
      - 語り: 結城によれば、今井は、自分から名乗り出たのではありません。結城の父を訪ねた席で、せがまれて、話したのだと言います。
      # fact: ryoma-ansatsu-25
      - 語り: その父、結城無二三は、あれは、全く見廻組だ、と言っていた、とも結城は書いています。
      # fact: ryoma-ansatsu-47
      - 語り: ただ、結城は、今井が龍馬を斬ったこと自体は、動かせない事実だ、とも書いています。飾ったのは、場面の描き方だ、というのです。
      # fact: ryoma-ansatsu-26
      - 語り: この談話に、強く言い返したのが、谷干城です。今井の談話には、二階に書生がいた、松代藩の名札を出した、という場面があります。
      # fact: ryoma-ansatsu-26
      - 語り: 谷は講演で、こう述べました。二階に、書生は3人もいなかった。松代藩と名乗っても、取り次ぎはしない。話が、芝居じみている。
      # fact: ryoma-ansatsu-26
      - 語り: あのころは、斬った自慢をする世の中で、誰がやった、彼がやった、という話は、当てにならない。
        tone: 重い
      # fact: ryoma-ansatsu-26
      - 語り: この講演の年は、記録で割れます。谷の遺稿の編者は、明治33年ごろ、と注を付け、別の記録は、明治39年の、龍馬と中岡の四十年の追悼の会だった、としています。
      # fact: ryoma-ansatsu-27
      - 語り: 明治42年、1909年。今井は、大阪新報の記者に、こう答えます。あれは暗殺ではない。幕府の命令で、職務として捕らえに向かい、格闘したのだ。
      # fact: ryoma-ansatsu-01, ryoma-ansatsu-02, ryoma-ansatsu-27
      - 語り: 1870年は、見張り。1900年は、自分が斬った。1909年は、命令による格闘。同じ1人の話が、3通りに、変わっています。
      - 語り: そして大正4年。もう1人、自分が斬った、という男が、現れます。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 渡辺の遺言
  - title: 大正4年、死ぬ前の打ち明け話　3人目の名前「世良敏郎」
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1915
    lines:
      # fact: ryoma-ansatsu-03
      - 語り: 大正4年、1915年の8月5日。大阪朝日新聞に、京都の剣術家、渡辺一郎の遺言が載りました。自分こそ、坂本と中岡の刺客だ。
        card: {head: "大阪朝日新聞（大正4年8月5日）", body: "渡辺一郎の遺言「自分が刺客」"}
      - 語り: 口書に出てきた渡辺吉太郎とは、別の名前の、もう1人の渡辺です。事件から、48年後のことでした。
      # fact: ryoma-ansatsu-48
      - 語り: 2年後の1917年、維新史料編纂局の委員は、講演で、一見して偽りと思われる、名を売りたい者の話だ、と退けました。
      # fact: ryoma-ansatsu-28
      - 語り: 1930年に出た、井上通泰の本には、人から聞いた話として、渡辺一郎が死ぬ前に、龍馬を斬ったのは実はおれだ、と話した、とあります。
      # fact: ryoma-ansatsu-28
      - 語り: 井上は、口書の渡辺吉太郎が、渡辺一郎の前の名ではないか、と考えました。ただし、井上自身の推測です。
      # fact: ryoma-ansatsu-03
      - 語り: 遺言を残した渡辺一郎は、今では、渡辺篤の名で知られています。渡辺篤は、子孫に伝えるための書き物も、残していました。家の由緒と、自分の履歴を書いたものです。
      # fact: ryoma-ansatsu-33
      - 語り: その書き物によれば、現場に鞘を残したのは、世良敏郎。
      # fact: ryoma-ansatsu-05, ryoma-ansatsu-02, ryoma-ansatsu-33
      - 語り: 鞘の持ち主は、薩摩の者と谷干城の話では、原田左之助。今井の談話では、渡辺吉太郎。渡辺篤の書き物では、世良敏郎。記録ごとに、名前が違います。
      # fact: ryoma-ansatsu-33
      - 語り: 世良敏郎は、本当にいたのか。菊地さんは、国立公文書館にある、多聞櫓文書という幕府の文書の届け書に、世良の名があることを挙げ、実在の見廻組の者だとしています。
      # fact: ryoma-ansatsu-33
      - 語り: 菊地さんの結論は、実行した顔ぶれを、今井、渡辺篤、世良敏郎が入る形に、直すべきだ、というものです。
        card: {head: "菊地明（2010年）", body: "今井・渡辺篤・世良敏郎が入る形に"}
      # fact: ryoma-ansatsu-17
      - 語り: 誰が命じたのかは、まだ見えません。明治の初めの、勝海舟の日記には、人から聞いた話として、こうあります。
      # fact: ryoma-ansatsu-17
      - 語り: 佐々木只三郎が頭で、今井らが押し入った。佐々木も、上の指図で動いた。幕府の目付、榎本対馬守の命令か。分からない。
      # fact: ryoma-ansatsu-17
      - 語り: 日記に出てくる榎本対馬守は、箱館で戦った榎本武揚とは、別の人です。
      # fact: ryoma-ansatsu-30
      - 語り: 1912年に出た、土佐の志士たちの記録、維新土佐勤王史も、榎本らが見廻組に、勤王の志士を討つよう、内々の意向を伝えていた、と書いています。
      - 語り: ただ、海舟の日記は、人から聞いた話です。勤王史も、その日記を参考に引いています。どちらも、同じ1つの伝え聞きなのです。
      # fact: ryoma-ansatsu-46
      - 語り: 佐々木只三郎には、兄がいました。手代木直右衛門です。
      # fact: ryoma-ansatsu-46
      - 語り: 1926年の本は、手代木の親類から聞いた話として、手代木はこの件をよく知っているようだったが、話が及ぶと、話をそらした、と書いています。
      - 語り: では、よく語られる、薩摩が龍馬を殺させた、という説は、どうでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 黒幕説
  - title: 薩摩が黒幕だったのか　大久保利通の手紙と2018年の研究
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1867
    lines:
      # fact: ryoma-ansatsu-35
      - 語り: 龍馬を殺させたのは、薩摩だ。そんな説も、語られてきました。
      # fact: ryoma-ansatsu-35
      - 語り: 2018年に出た、桐野作人さんの本、龍馬暗殺は、その薩摩の説が、どこから出てきたのかを、章を立てて調べています。
      # fact: ryoma-ansatsu-35
      - 語り: その書評で、歴史家の中村武生さんは、薩摩は大政奉還を進める側で、龍馬を守ろうとしていた、と書きました。
      # fact: ryoma-ansatsu-04
      - 語り: 記録の上では、薩摩の者は、犯人探しの場にいます。谷干城が鞘を見せに、伏見の薩摩の屋敷へ行ったとき、一緒だったのは、薩摩の中村半次郎でした。
      # fact: ryoma-ansatsu-21, ryoma-ansatsu-45
      - 語り: 薩摩の大久保利通は、事件の翌日から、岩倉具視に、何度も手紙を書いています。
      # fact: ryoma-ansatsu-45
      - 語り: 4日後の、11月19日の手紙には、こうあります。坂本の暴殺は、新撰組に違いないと聞いた。第一に、近藤勇の仕業だろう。
        card: {head: "大久保利通の手紙（11月19日）", body: "第一に近藤勇の仕業だろう"}
      - 語り: 薩摩の大久保自身は、新選組を疑っていたのです。
      # fact: ryoma-ansatsu-30
      - 語り: 一方、土佐の側の記録も、変わっていきます。大正元年、1912年に出た、維新土佐勤王史は、襲ったのは新選組ではなく、見廻組の佐々木只三郎だ、と記しています。
      # fact: ryoma-ansatsu-30
      - 語り: ただ、この本では、二階へ上がったのは、佐々木、今井、高橋の3人。今井の口書の、渡辺、高橋、桂とは、顔ぶれが違います。
      - 語り: 記録を、もう一度並べて、言えることと、言えないことを、分けてみます。
        tone: 疑問
        hook: true

  - title: まとめ：近江屋で龍馬を斬ったのは誰だったのか
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    lines:
      # fact: ryoma-ansatsu-07
      - 語り: 言えること、1つ目。あの夜の客は、十津川の者と名乗った。事件の直後の手紙も、谷の話も、そう伝えています。
        tone: しみじみ
      # fact: ryoma-ansatsu-18, ryoma-ansatsu-01
      - 語り: 2つ目。寺村の手記と、3年後の今井の口書は、別々に、7人で来て二階へ3人、という同じ数を書いています。
        tone: しみじみ
      # fact: ryoma-ansatsu-12
      - 語り: 3つ目。今井信郎は、見廻組の1人として関わったと認め、禁錮を言い渡されました。
        tone: しみじみ
      # fact: ryoma-ansatsu-01, ryoma-ansatsu-02, ryoma-ansatsu-27, ryoma-ansatsu-03
      - 語り: 言えないこと、1つ目。誰の刀が、龍馬を斬ったのか。今井の話は、40年近くのあいだに3通りに変わり、渡辺篤の話は、本人が亡くなってから、新聞に出ました。
        tone: しみじみ
      - 語り: 2つ目。鞘の持ち主。原田左之助、渡辺吉太郎、世良敏郎。記録ごとに、名前が違います。
        tone: しみじみ
      # fact: ryoma-ansatsu-01
      - 語り: 3つ目。誰が命じたのか。今井自身が、知らない、と答えています。
        tone: しみじみ
        pause: 0.8
      - 語り: 記録から言えるのは、龍馬を斬ったのは、《京都見廻組の誰か》、まで。誰の刀だったのかは、記録ごとに、名前が食い違います。
        tone: しみじみ
        pause: 0.8
      # fact: ryoma-ansatsu-07
      - 語り: 自分が斬った、と語った男は、何人もいました。けれど、事件の直後の手紙に残るのは、十津川の者という、偽りの名乗りと、新選組だろう、という見込みだけです。
        tone: しみじみ
        pause: 0.8
      - 語り: 龍馬を斬ったのは、誰だったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
