# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。坂本龍馬の暗殺：近江屋で龍馬を斬ったのは誰か（慶応3年11月15日〜1930年の記録、2010年・2018年の研究）。2026-11-26 作成。公開の予定は 12/3 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（日本史・幕末）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「近江屋で龍馬を斬ったのは誰か」。答えの席＝斬った者の名（題名・サムネでは言わない）。
#   答え：記録から言えるのは「京都見廻組の誰か」まで。誰の刀か・鞘の持ち主・誰が命じたかは言えない。
# 共通の決まり5つ：①題名は問いで、斬った者を明かさない ②主語は「龍馬を斬った者」という1つの役目。主役は龍馬の暗殺、最後まで
#   ③誰でも知る一点（龍馬は近江屋で斬られた・犯人は見廻組と言われる）を入口に、「自分が斬った」と言った男の話が30年で変わった（1870見張り→1900自分が斬った→1909格闘の3通り）ことで裏返す
#   ④龍馬の暗殺の犯人を主題にした回はこのチャンネルで初めて（ryoma-if は「もしも」、kondo-story は近藤の斬首）
#   ⑤数字は「30年で変わった話（3通り）」「7人と二階へ3人」「48年後の遺言」。年齢・項目の数は主役にしない
# 冒頭（10秒以内）＝「龍馬を斬ったのは自分だ」と1900年の雑誌で語った男が、1870年の取り調べでは見張りと答えていた。答えの席＝斬ったのは誰か。
# 既出と重ねない：ryoma-if（王政復古の24日前・吉井幸輔の避難の勧め・風邪・岩倉の言葉・「主な説を並べます」）の言い回しは使わない。24日前・避難の勧めは触れない。
# 記録の食い違い（3つ）：①名乗った名（当時の手紙3通は十津川／今井の口書は松代藩）②今井の話（1870 見張り→1900 自分が斬った→1909 命令による格闘）
#   ③鞘の持ち主（大石の口書・谷干城＝原田左之助／近畿評論＝渡辺／渡辺篤の書き物＝世良敏郎）。下駄の話（瓢亭／別の店の印2足）は③と同じ章で「物の手がかり」として。
# 年の扱い：日付は和暦（旧暦）のまま、事件の日だけ西暦を添える。慶応3年11月15日＝1867年12月10日。季節は言わない（旧暦11月は冬だが、言わなくても話が通る）。
#   史料は「書かれた（語られた）年」を言う：寺村左膳の手記（慶応3年、中岡の存命中）・菅野の手紙（慶応3年11月24日）・清岡の手紙（12月4日）・今井の口書（明治3年＝1870）・
#   近畿評論（明治33年＝1900）・今井の大阪新報への回答（明治42年＝1909）・大阪朝日（大正4年＝1915年8月5日）・維新土佐勤王史（1912）・結城の本（1924）・岩崎の本（1926）・井上の本（1930）・菊地明（2010）・桐野作人（2018）。
#   年の分からない史料（田中光顕の談話・井口新助の談話・渡辺篤の書き物）は「年は書かれていない」と言うか、載った本の年だけを言う。谷干城の講演の年は割れる（明治33年ごろ／明治39年）ので割れると言う。海舟日記は年が割れるので「明治の初め」。
# 計算（自分で計算し直した）：1870→1900＝30年。1900→1909＝9年。1867→1870＝3年。1867→1915＝48年。11月15日→17日＝2日後。11月15日→24日＝9日後。
#   11月15日→18日＝3日後。明治3年9月20日の言い渡し→明治5年（1872年）1月の赦免。事件の翌日から3日続けて＝16・17・18日の大久保の手紙。
# 事実は事実カード（dev/output/rekishi-chiso/research/近江屋事件_facts_20261126.yaml）にあるものだけ。行の上に `# fact: ryoma-ansatsu-xx`。
#   使わないこと：傷の数・血・遺体の様子／龍馬の最期の言葉の伝え（ほたえな等）／薩摩・後藤・外国の黒幕を事実として／犯人の断定／桂早之助の脇差（出どころがテレビの告知だけ）／
#   『手代木直右衛門伝』の中身（本文未見）／磯田の会津命令説（書評の要約だけ）／今井の初倉の暮らし（年の出どころ無し）／渡辺篤の書き物の年（明治44年は未確認）。
