sections:
  # ================================================================ 序章。答えの席：斬ったのは誰か
  - title: 近江屋で龍馬を斬ったのは誰か
    background: {image: paintings/ryoma_kyoto_map_bunkyu_1864.jpg, credit: "京都の地図（文久4年）"}
    year: 1867
    lines:
      # fact: ryoma-ansatsu-02
      - 語り: 坂本龍馬を斬ったのは、自分だ。明治33年、1900年の雑誌で、そう語った男がいます。
      # fact: ryoma-ansatsu-01
      - 語り: ところが、同じ男は、30年前の取り調べでは、自分は見張りをしていただけだ、と答えていました。
        tone: 重い
      # fact: ryoma-ansatsu-27
      - 語り: さらに9年後には、あれは暗殺ではない、命令で捕らえに行ったのだ、と言い直しています。
      # fact: ryoma-ansatsu-25
      - 語り: しかも、雑誌の談話を書いた記者は、のちに、事実も多少飾り、斬った場面は大いに芝居がかりで書いた、と認めました。
      - 語り: 近江屋で、龍馬を斬ったのは、誰だったのか。
        tone: 疑問
      # fact: ryoma-ansatsu-03
