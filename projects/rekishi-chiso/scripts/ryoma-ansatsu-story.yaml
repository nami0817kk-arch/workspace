# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  坂本龍馬を斬ったのは、自分だ。明治33年、1900年の雑誌で、そう語った男がいます。ところが同じ男は、30年前の取り調べでは、自分は見張りをしていただけだ、と答えていました。
  近江屋で、龍馬を斬ったのは、誰だったのか。事件の直後の手紙、明治3年の取り調べの記録、雑誌の談話、死ぬ前の打ち明け話を、書かれた年を添えて並べました。
  この動画でわかること
  ・事件の夜の客は、何と名乗り、何人で来たのか
  ・龍馬の仲間が、すぐに新選組を疑った理由と、現場の鞘と下駄
  ・明治3年の取り調べで、今井信郎が答えたこと
  ・今井信郎の話が、1870年から1909年までに3通りに変わったわけ
  ・記録から言えることと、言えないこと
description_note: |-
  創作の台詞・想像の場面は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  事件の記録は、岩崎英重編『坂本龍馬関係文書』（1926年。今井信郎・大石鍬次郎の口書、菅野覚兵衛・清岡半四郎・小野淳輔の書状、田中光顕の談話ほか）、寺村左膳の手記（『維新日乗纂輯』第三、1926年）、『谷干城遺稿』（1912年）、『大久保利通文書』、瑞山会『維新土佐勤王史』（1912年）、結城礼一郎の著書（1924年）、『坂本中岡両先生五十年祭記念講演集』（1917年）、景浦直孝の伊予の史料の本（1915年）、井上通泰『南天荘墨宝』（1930年）、菊地明「坂本龍馬 近江屋事件の現在」（『国立国会図書館月報』2010年）、桐野作人『龍馬暗殺』（2018年）とその書評によります。
  日付は当時の暦（旧暦）のままです。年数は、記録から自分で計算し直したものです。事件の場面そのものは描いていません。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Who Killed Sakamoto Ryoma? A Confession That Changed in 30 Years"
  description: |-
    "I was the one who cut down Sakamoto Ryoma." A man said this in a magazine in 1900. Yet thirty years earlier, under interrogation, the same man had said he only stood guard.
    Who really killed Ryoma at the Omiya inn in Kyoto in 1867? We line up the letters written right after the attack, the interrogation records of 1870, a magazine interview and a deathbed confession, noting when each was written.
    In this video you will learn:
    - What name the visitors gave that night, and how many came
    - Why Ryoma's friends suspected the Shinsengumi at once, and the scabbard and sandals left behind
    - What Imai Nobuo said under interrogation in 1870
    - How one man's story took three different forms over almost forty years
    - What the records can tell us, and what they cannot
    Dates follow the old Japanese calendar. The attack itself is not shown. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Who Killed Ryoma?"
    - "15th Day of the 11th Month, 1867: Visitors Who Said They Were from Totsukawa"
    - "The Enemy Is the Shinsengumi: A Scabbard and Sandals"
    - "1870: Imai Nobuo Under Interrogation"
    - "1900: I Cut Him Down Myself"
    - "1915: A Deathbed Confession and a Third Name"
    - "Was There a Mastermind?"
    - "Summary: Who Killed Ryoma?"

