thumbnail:
  layout: classic
  cast: false
  image: paintings/ieyasu_portrait_toshodaigongen.jpg
  crop: [0, 0, 1000, 562]
  name: 将軍
  lead: 寝る時も脇に小姓が2人
  main: どうしてた？
  # サムネは別に Gemini の絵で作り込む（out/shogun-story_thumbnail.png）。この欄は check と仮の thumb のため。

sections:
  # ================================================================ 序章（冒頭 約3分）。答えは最後の章まで言わない
  - title: 朝ご飯のあいだも、将軍はひとりではなかった
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      - 語り: 天下を治めた、徳川将軍。好きなものを、好きなだけ食べ、好きなように暮らしていた。そう思うかもしれません。
        tone: 重い
      # fact: shogun-04, shogun-22
      - 語り: けれど将軍は、朝ご飯を食べているあいだも、ひとりではありませんでした。後ろでは、係の小姓たちが、将軍の髪を結っていたのです。
        tone: 重い
      # fact: shogun-23
      - 語り: 膳が下がると、医師たちが入ってきて、2人ずつ、将軍の脈をとります。毎朝のことでした。
        card: {head: "毎朝の診察", body: 医師が2人ずつ脈をとる}
      # fact: shogun-13
      - 語り: 少しでも具合が悪ければ、食べたご飯は、食事のあと、秤にかけられました。どれだけ召し上がったかを、確かめるためです。
      # fact: shogun-31
      - 語り: 夜、眠るときも、そばには、寝ずの番の小姓が、2人いました。
        tone: 重い
      # fact: shogun-61
      - 語り: そして、将軍が江戸の外に出て、泊まることは、きわめて、まれでした。
      # fact: shogun-38
      - 語り: 将軍のそばに仕えた人たちの話や、献立の記録、そして、将軍の骨までが、思い浮かべる姿とは、別の1日を、伝えています。
      - 語り: 徳川将軍は、毎日、何をして、どうやって暮らしていたのか。
        tone: 疑問
        hook: true
      - 語り: その1日は、「モウ」という、ひと声で始まります。
        hook: true

  # ================================================================ 第1章 起床
  - title: 明け六つの「モウ」　将軍はどうやって起きていたのか
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      - 語り: 将軍が寝起きしたのは、江戸城本丸の、中奥です。大名たちと会う、表の御殿と、女性たちの大奥とのあいだにある、将軍の住まいでした。
        card: {head: "中奥", body: 将軍が暮らし政務をとった所}
      # fact: shogun-05, shogun-38
      - 語り: 明治25年、1892年に出た本、『千代田城大奥』。その附録に、「将軍の日課」という一章があります。幕末の将軍に仕えた、元の御小姓たちの話をもとにしたものです。
        year: 1892
        card: {head: "『千代田城大奥』（1892年）", body: 附録に「将軍の日課」}
      # fact: shogun-05
      - 語り: そこには、こうあります。将軍は、朝の六つ時に、起き出るのを、例とする。
      # fact: shogun-20
      - 語り: 将軍が目を覚ますと、そばで夜を明かした小姓が、「モウ」と、声を上げます。これが合図でした。
        tone: 重い
      # fact: shogun-20
      - 語り: 1919年に出た、松平太郎の『江戸時代制度の研究』は、この「モウ」を、一つの暗号だと書いています。目覚めだけでなく、食事のときも、夜の勤めを終えるときも、同じ「モウ」でした。
        year: 1919
      # fact: shogun-20
      - 語り: 声は、小姓から、隣の部屋の小姓や小納戸へと、次々に取り次がれていきます。昭和の本、『深秘徳川大奥』は、その様子を、まるで牛が集まったようだ、と書きました。
      # fact: shogun-19
      - 語り: では、その六つ時とは、今の何時か。ここで、記録が分かれます。
        tone: 疑問
      # fact: shogun-19
      - 語り: 明治の『千代田城大奥』は、今でいえば、5時ごろ。大正の『江戸時代制度の研究』は、午前6時。同じ六つを、違う時刻に言い換えています。
        figure: {type: stats, title: 将軍が起きた「六つ」は今の何時か, items: [[『千代田城大奥』1892年, 5時ごろ, 元御小姓の話], [『江戸時代制度の研究』1919年, 午前6時, 元小姓の談話]], upto: 2}
      # fact: shogun-19
      - 語り: 江戸の時刻は、日の出と日の入りで区切るので、季節で動きます。昭和の『深秘徳川大奥』は、六つとは書かず、夜が明けて、6時か7時ごろにお目覚め、とだけ書いています。
        figure: null
      # fact: shogun-21
      - 語り: 起きると、まず、歯みがきです。『千代田城大奥』によると、歯みがき粉は、歯医者の佐藤道安が、差し上げたもの。口をすすぐ塩は、赤穂の、選りすぐりでした。
      # fact: shogun-21
      - 語り: 歯をみがく楊枝のほかに、同じ木で作った、舌をこする道具も、1本、添えられていました。
      # fact: shogun-36
      - 語り: 身につけるものも、決まっていました。下帯は羽二重、足袋はキャラコ。毎日、新しいものを着ける、掟でした。
        card: {head: "下帯と足袋", body: 毎日新しいものを着ける掟}
      # fact: shogun-52
      - 語り: 身支度が済むと、袴をつけて、大奥へ入り、御台所、つまり正室と一緒に、仏間で、代々の位牌を拝みました。
      # fact: shogun-25
      - 語り: 中奥に戻ると、朝の膳です。時刻は、たいてい五つ。午前8時ごろでした。
        hook: true
      - 語り: その膳は、台所から、長い道のりを、たどってきます。
        hook: true

  # ================================================================ 第2章 朝の膳
  - title: 毎朝の鱚と毒見　将軍は何を食べていたのか
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      # fact: shogun-10
      - 語り: 『千代田城大奥』は、将軍の朝の膳を、こう書いています。もともと、将軍の食べ物は、質素なものだ。
        tone: 重い
      # fact: shogun-10
      - 語り: 朝は、汁と、向付と、平。二の膳に、吸物と、皿があるだけ。器は、外が黒、内側が朱の、塗りの碗でした。
        card: {head: "将軍の朝の膳", body: 汁・向付・平／二の膳に吸物と皿}
      # fact: shogun-10
      - 語り: ただ、同じ頁には、昼と夕方の膳を、大奥ではなく中奥で召し上がるときは、おかずが多かったと覚えている、とも続きます。
      # fact: shogun-01, shogun-08
      - 語り: その皿に、毎朝のように載ったのが、鱚です。「キス両様」と呼んで、塩焼きにしたものと、漬け焼きにしたものを、両方つけました。
      # fact: shogun-09
      - 語り: 鱚でない日も、決まっていました。毎月1日、15日、28日の3日だけは、鱚の代わりに、鯛か平目を焼いた、尾頭付きです。
        card: {head: "毎月1日・15日・28日", body: 鱚の代わりに尾頭付き}
      # fact: shogun-10
      - 語り: 魚を断つ、精進の日には、器まで替わりました。内も外も、黒の塗りです。
      # fact: shogun-12
      - 語り: では、この膳は、どうやって、将軍の前に届いたのか。まず、台所の御膳所で、料理が作られます。
      # fact: shogun-12
      - 語り: それを、笹の間と呼ばれた部屋へ運び、そこで、御膳奉行が、毒見をします。
        figure: {type: stats, title: 朝の膳が将軍に届くまで（『千代田城大奥』）, items: [[御膳所, 料理を作る, 台所], [笹の間, 御膳奉行が毒見, 御膳立の間], [次の間, 大きな炉と鍋, 御小納戸が運ぶ]], upto: 2}
      # fact: shogun-12
      - 語り: 毒見の済んだ膳を、御小納戸が受け取り、将軍の部屋の、次の間へ運びます。そこには、七輪のような大きな炉があって、鍋が、いくつも掛けてありました。
        figure: {type: stats, title: 朝の膳が将軍に届くまで（『千代田城大奥』）, items: [[御膳所, 料理を作る, 台所], [笹の間, 御膳奉行が毒見, 御膳立の間], [次の間, 大きな炉と鍋, 御小納戸が運ぶ]], upto: 3}
      # fact: shogun-12
      - 語り: 将軍の食事は、毒見のせいで冷めていた、とよく言われます。けれど、将軍の部屋のすぐ隣に、炉と鍋があった。冷めたまま出したとは、限らなかったようです。
        figure: null
      # fact: shogun-14
      - 語り: 毒見の役の始まりは、家康だと、『徳川実紀』の附録、『東照宮御実紀附録』は書いています。大坂の陣のとき、伊達政宗に、食事に用心するよう勧められて、置いた役だというのです。
        year: 1614
        portrait: paintings/ieyasu_portrait_toshodaigongen.jpg
      # fact: shogun-14
      - 語り: その役は、「おにとり」の役と呼ばれ、これが、のちの御膳奉行になった、とされます。
      # fact: shogun-13
      - 語り: ご飯にも、決まりがありました。ふだん、飯を盛るのは、小姓の役です。
        portrait: null
      # fact: shogun-13
      - 語り: けれど、将軍が、少しでも病気のときは、御膳番の小納戸が、自分で盛りました。食べ終わったあと、どれだけ召し上がったかを、秤にかけて見るのが、掟だったからです。
        tone: 重い
        card: {head: "将軍が病気のとき", body: 食べた飯を秤で量る掟}
      - 語り: 天下の将軍も、具合が少し悪いだけで、食べた量まで、量られたのです。
        tone: 重い
      # fact: shogun-16
      - 語り: 8代の吉宗は、どうだったか。『有徳院殿御実紀附録』には、ふだんは一汁三菜のほかは、食べなかったとあります。
        year: 1716
      # fact: shogun-16
      - 語り: 膳を出すのは、朝の辰の刻と、夕方の申の刻の、2回だけ。目安で言えば、朝8時ごろと、夕方4時ごろ。1日2食でした。
        card: {head: "吉宗の食事", body: 一汁三菜・1日2食}
      # fact: shogun-18
      - 語り: その吉宗には、毒見の決まりを、自分で破った話もあります。薩摩の島津家から届いた菓子を、外の大名の品は出した例がない、と止められたときのことです。
      # fact: shogun-18
      - 語り: 吉宗は、太平の世に、誰が毒など盛るものか、と言って、そのまま食べた、というのです。
      # fact: shogun-39
      - 語り: では、将軍の膳は、いつも質素だったのか。11代家斉のころの献立の帳面、『調理叢書』があります。最後の冊に、文政6年、1823年と書かれたものです。
        year: 1823
      # fact: shogun-39, shogun-40
      - 語り: その献立を、高正晴子さんが、1994年の論文で数えました。献立は、朝、昼、夕の、1日3回。朝の膳は、およそ半分が、一汁四菜でした。
        figure: {type: stats, title: 家斉のころの献立（『調理叢書』。高正晴子 1994）, items: [[朝の膳, およそ半分, 一汁四菜], [朝の膳, 3割あまり, 一汁五菜], [昼の膳, およそ3分の2, 一汁四菜]], upto: 3}
      # fact: shogun-39
      - 語り: それでも、高正さんは、ふだんの日の献立は、意外に質素だった、と書いています。ただ、品の種類は多く、季節のものに、あふれていました。
        figure: null
      # fact: shogun-44
      - 語り: しかも、家斉の献立には、鰹や鮭、白魚、茄子が、売り出してよい時期を決めた幕府の禁令より、1か月から3か月も早く、出ています。
      # fact: shogun-44
      - 語り: 高正さんは、将軍は禁令に従わなくてよく、特別扱いされていた、と記しています。初物を、町の人より先に味わう。ここには、確かに、贅沢がありました。
        tone: 重い
      # fact: shogun-35
      - 語り: 12代の家慶は、膳のたびに、生姜の芽、モヤシ生姜を好みました。
      # fact: shogun-35
      - 語り: その家慶の時代、天保の改革で、季節外れの野菜の売り買いが禁じられたとき、モヤシ生姜も、その中に入りました。
      # fact: shogun-35
      - 語り: それをめぐって、ちょっとした珍事が起きた、と『千代田城大奥』は書きます。ただ、中身は、書くまでもない、と省かれています。
      - 語り: 初物はあっても、毎朝の魚も、膳の届き方も、決まっていた。それが、将軍の朝の膳でした。
        tone: 重い
      # fact: shogun-04
      - 語り: そして、その膳を食べているあいだ、将軍の頭の上では、別の仕事が、進んでいました。
        tone: 疑問
        hook: true
      - 語り: 髪結いです。
        hook: true

  # ================================================================ 第3章 髪と医師
  - title: 食べながら髪を結う　将軍の朝の髪と医師の診察
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      # fact: shogun-04
      - 語り: 『千代田城大奥』は、こう書きます。代々の将軍は、たいてい、食事のときに、髪を結う定めだった。
      # fact: shogun-04
      - 語り: 松平太郎の本も、将軍は、髪を結わせながら、朝の食事をとった、と書いています。
      # fact: shogun-22
      - 語り: 髪を受け持つ係を、御髪番と呼びました。小姓が4人ほど、小納戸が2人ほど。髷の根元には、白い元結を、12本から13本も巻きました。
        card: {head: "御髪番", body: 小姓4人・小納戸2人ほど}
      # fact: shogun-22
      - 語り: 髪を結うだけでなく、顔と月代を剃るのも、この係の仕事でした。
      # fact: shogun-22
      - 語り: 家慶は、60歳ごろには、年のせいで、ごく小さな、ちょん髷だった、という話も、同じ本に残っています。
      # fact: shogun-22, shogun-03
      - 語り: しかも、髪を結う時間のほうが、食事の時間より、長くかかりました。だから、膳が下がると、髪がまだ結い終わらないうちに、医師が入ってきます。将軍を診る、奥医師です。
        tone: 重い
        card: {head: "奥医師", body: 将軍と家族を診た医師}
      # fact: shogun-23
      - 語り: 奥医師は、30人いました。そのうち6人ほどが、次の間に出て、平伏します。そこから、2人ずつ進み出て、将軍の脈をとりました。
      # fact: shogun-23
      - 語り: 内科の医師は、毎日。外科、眼科、鍼の医師は、3日目ごとに、うかがいました。
        figure: {type: stats, title: 将軍の朝の診察（『千代田城大奥』）, items: [[内科の医師, 毎日, 2人ずつ脈をとる], [外科・眼科, 3日目ごと, うかがう], [鍼の医師, 3日目ごと, うかがう]], upto: 3}
      - 語り: 病気でなくても、毎朝、医師に脈をとられる。具合が悪ければ、食べた量は秤で量られる。将軍の体は、将軍ひとりのものでは、ありませんでした。
        tone: 重い
        figure: null
      # fact: shogun-24
      - 語り: その奥医師について、こんな話が残っています。13代の家定のときのことです。
      # fact: shogun-24
      - 語り: 家定は、七面鳥を見たことのない奥医師たちに、見せてやろうと、庭へ出させました。すると、坊主頭の医師の一人が、おどけて、踊り回った。
      # fact: shogun-24
      - 語り: 家定は、それを大いに喜び、その後も、その医師が来るたびに、七面鳥を見よ、七面鳥を見よ、と言った、と、ある奥医師は語りました。
      - 語り: 30人の医師が、入れ替わりで、毎朝、同じ手順で脈をとる。その繰り返しの中の、小さな笑いでした。
        tone: しみじみ
      # fact: shogun-26
      - 語り: そして、昼からは、急ぎの書類が、宴の最中にまで、将軍を呼び出します。
        tone: 疑問
        hook: true
      - 語り: 政務の時間です。
        hook: true

  # ================================================================ 第4章 昼の政務
  - title: 「伺の通りたるべく候」　将軍は昼に何を決めていたのか
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      # fact: shogun-25
      - 語り: 九つ、正午になると、昼の膳です。
        figure: {type: stats, title: 将軍の1日の時刻（松平太郎『江戸時代制度の研究』1919年）, items: [[起きる, 六つ, 午前6時], [朝の膳, 五つ, 午前8時], [昼の膳, 九つ, 正午]], upto: 3}
      # fact: shogun-26
      - 語り: 昼の膳のあとは、政務です。御側の御用取次という側近が、人払いをして、老中から上がってきた書類を、将軍の前で、読み上げます。
        figure: null
        card: {head: "御用取次", body: 老中の伺いを取り次ぐ側近}
      # fact: shogun-26
      - 語り: 将軍が、よし、と認めると、奉書の紙を16に切った札に、「伺の通りたるべく候」と書いたものを、御用取次が書類に挟んで、老中へ返しました。
        tone: 重い
        card: {head: "裁可の札", body: 伺の通りたるべく候}
      # fact: shogun-26
      - 語り: 願い出たとおりで、よろしい。今でいえば、決裁の印です。
      # fact: shogun-26
      - 語り: この政務は、ふつう、2時間か3時間か、それ以上かかり、長いときは、灯をともすころまで、続いたと、松平太郎の本は書いています。
      # fact: shogun-27
      - 語り: 急ぎの書類もありました。「即下げ」と断って出される、伺い書です。
        card: {head: "即下げ", body: 急ぎの伺い書}
      # fact: shogun-27
      - 語り: 即下げが出ると、将軍は、たとえ大奥にいても、酒宴の最中であっても、出てきて、御用取次に会いました。
        tone: 重い
      # fact: shogun-27
      - 語り: 年の暮れには、即下げが多いのが、毎年の例だった、と『千代田城大奥』にあります。
      # fact: shogun-37
      - 語り: 投書にも、目を通しました。昭和の本、『深秘徳川大奥』によると、8代吉宗のときに始まった目安箱は、月に3回、本丸へ上がってきました。
      # fact: shogun-37
      - 語り: 箱の鍵は、将軍が、肌着に付けた巾着に入れていました。将軍は、自分で鍵を出して、小姓の頭に、箱を開けさせます。
      # fact: shogun-37
      - 語り: 投書を読み上げさせて、老中へ下げるか、焼き捨てるか、しまっておくか。それを決めるのも、将軍でした。
      # fact: shogun-70
      - 語り: 学問も、勤めのうちでした。5代の綱吉は、1693年から、易経の講釈を始め、足かけ8年をかけて、1700年に、全部を終えています。
        year: 1693
        portrait: paintings/kira_tsunayoshi_tosa.jpg
      # fact: shogun-71
      - 語り: 儒学者の荻生徂徠は、この講釈を聞くために、毎月3度ずつ、城へ上がった、と、荻生家の記録にあります。
        portrait: null
      # fact: shogun-28
      - 語り: 昼から後は、これといって、食べるものがありません。将軍が、菓子を、と言ったときだけ、六寸、およそ18センチ四方の三宝に、干菓子や蒸し菓子を載せて、出したといいます。
        portrait: null
      # fact: shogun-61
      - 語り: では、将軍は、城の外へ、出られたのか。
        tone: 疑問
        hook: true
      - 語り: 出かける日は、町まで巻き込みます。
        hook: true

  # ================================================================ 第5章 御成（外に出られたか。通説の検証はこの章）
  - title: 城の外へ出られたのか　御成の道筋と229年ぶりの上洛
    background: {image: paintings/ieyasu_nikko_yomeimon_kiyochika_1897.jpg, credit: "小林清親《日光陽明門》（1897年。パブリックドメイン）"}
    lines:
      - 語り: 将軍が出かけることを、御成と呼びました。いちばん近い御成は、江戸城の中の、紅葉山です。家康をまつる東照宮などが、ありました。
        card: {head: "御成", body: 将軍が出かけること}
      # fact: shogun-34
      - 語り: 紅葉山への参詣は、年に7度。前の日の、日の入りのころから、身を清める日になり、湯に入ったあとは、帯まで、清いものに替えた、と『千代田城大奥』は書きます。
      # fact: shogun-34
      - 語り: その日は、生き死にや、火事、地震といった話を、口にすることも、禁じられていました。
        tone: 重い
      # fact: shogun-64
      - 語り: 城の外へ出る御成では、道筋の町も、従いました。町奉行所の掛りの写本、『御成』には、ふだんの御成のとき、道筋の家の二階には、人を置かない、とあります。
      # fact: shogun-67
      - 語り: 中野の桃園の橋は、御成のときだけ、ふだんの橋板を外して、蔵にしまってある、別の橋板に、架け替えたと、昭和の『中野町誌』に、土地の古老の話が残っています。
      # fact: shogun-65
      - 語り: 9代家重のころには、こんな話があります。上野の寛永寺から帰る途中、将軍が、急に小用をもよおして、駕籠を、寺まで引き返させた。
      # fact: shogun-65
      - 語り: 将軍の駕籠を、途中で返すのは、例のないことだった、といいます。
      # fact: shogun-65
      - 語り: それからは、上野と増上寺への御成の道に、仮の雪隠、つまり、手洗いを、3か所、建てるようになった。江戸の落書を集めた本の注に、そうあります。
      # fact: shogun-56
      - 語り: 鷹狩も、御成の一つです。ただ、5代の綱吉は、1687年に、将軍家の鷹狩を、やめてしまいました。
        year: 1687
      # fact: shogun-55, shogun-57
      - 語り: それを戻したのが、8代の吉宗です。1716年に鷹狩の役を戻し、駒場野では、1718年の秋に初めて狩りをして、ここでの狩りは、15回を数えました。
        year: 1716
      # fact: shogun-59
      - 語り: 将軍の鷹場になった村では、田畑に、案山子や縄を立てることも、できませんでした。1722年の触れで、ようやく、御成の日にも、そのまま置いてよい、と許されています。
        year: 1722
      # fact: shogun-68
      - 語り: 11代の家斉は、海辺の浜御殿、今の浜離宮を、鷹狩を中心に、歴代でいちばん多い、248回も使いました。
        card: {head: "家斉と浜御殿", body: 歴代最多の248回}
      - 語り: 将軍は、城の外へ、出られなかったわけではありません。けれど、行く先は、寺や、鷹場や、御殿。そして、出かける日には、道筋の町じゅうが、決まりで動きました。
        tone: 重い
      # fact: shogun-61
      - 語り: では、遠くへは、どうか。将軍が江戸の外に出て泊まることは、きわめて、まれでした。その、まれな旅が、日光の東照宮への参詣、日光社参です。
      # fact: shogun-60
      - 語り: 日光社参は、江戸時代を通じて、19回。そのうち11回が、3代の家光です。
      # fact: shogun-61
      - 語り: 1728年の、吉宗の社参では、行列が、13万3千人に達しました。
        year: 1728
      # fact: shogun-62
      - 語り: そして、最後の日光社参は、1843年の、12代家慶でした。
        year: 1843
      # fact: shogun-63
      - 語り: 文久3年、1863年。14代の家茂は、京都へ上りました。将軍の上洛は、3代家光以来、229年ぶりです。
        year: 1863
        portrait: paintings/kazu_iemochi_kano.jpg
        card: {head: "家茂の上洛（1863年）", body: 家光以来229年ぶり}
      - 語り: 200年あまりのあいだ、将軍は、京都へ行かなかった。将軍の1日は、ほとんどが、江戸城の中で、過ぎていきました。
        tone: 重い
        portrait: null
      # fact: shogun-29
      - 語り: その城の中で、日が暮れると、湯殿です。
        tone: 疑問
        hook: true
      - 語り: 夜の将軍は、どう過ごしていたのか。
        hook: true

  # ================================================================ 第6章 夜
  - title: 糠袋と10枚の浴衣、そして寝ずの番　夜の将軍はどうしてた？
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      # fact: shogun-29
      - 語り: 湯殿の係も、小納戸です。体を洗う、糠を入れた袋、糠袋を、7つか8つ、用意しました。
      # fact: shogun-29
      - 語り: その糠袋は、一度、肌につけたものは、二度と使わない、と『千代田城大奥』は書きます。
        card: {head: "糠袋", body: 一度肌につけたら二度と使わない}
      # fact: shogun-29
      - 語り: 湯から上がると、白い木綿の浴衣を、10枚ほど用意しておき、1枚ずつ掛けては、替える。7枚から8枚も掛けて、体を乾かした、といいます。
        tone: 重い
      - 語り: 洗うのも、掛けるのも、替えるのも、すべて、係の手でした。
      # fact: shogun-25
      - 語り: 夕方の膳は、たいてい、暮れ六つ、日の入りのころ。そのあと、将軍は、中奥で寝るか、大奥へ入るかを、決めます。
        figure: {type: stats, title: 将軍の夜の時刻（松平太郎『江戸時代制度の研究』1919年）, items: [[夕方の膳, 暮れ六つ, 日の入りのころ], [夜詰の終わり, 五つ半, 午後9時], [寝る, 四つ, 午後10時]], upto: 1}
      # fact: shogun-73, shogun-52
      - 語り: 大奥に泊まる日は、今日は大奥だ、と、夕方から知らせがあった、と、元の女中は答えています。
        figure: null
      # fact: shogun-32
      - 語り: 大奥へ入るときは、中奥で、鈴を鳴らして知らせ、御鈴廊下を渡りました。
      # fact: shogun-74
      - 語り: 将軍の大奥泊まりは、精進日のほかは、別に決まりはない、と、三田村鳶魚の本『御殿女中』は書いています。
      # fact: shogun-75
      - 語り: その精進日は、先祖の命日です。吉宗の代の記録、『柳営秘鑑』では、毎月、7日も、精進の日がありました。
        card: {head: "精進日", body: 先祖の命日。毎月7日あった}
      # fact: shogun-41
      - 語り: 家斉のころの献立の帳面でも、毎月、決まった日の朝の膳が、精進の料理に替わっています。
      # fact: shogun-75
      - 語り: たとえば、17日は、家康の命日です。ひと月のうち、何日も、先祖の命日が、将軍の膳と夜を、決めていました。
        tone: 重い
      # fact: shogun-33
      - 語り: 大奥で寝る夜は、どうだったか。『千代田城大奥』によると、将軍のそばで寝る2人の女中、中臈は、将軍が来る前に、髪を解かれ、凶器を隠していないか、調べられました。
      # fact: shogun-33
      - 語り: 2人のうち1人は、添い寝の役です。この添い寝の者を置くのは、5代綱吉のとき、そばの女性を通じて、頼みごとをさせようとした者がいたためだ、という言い伝えも、書かれています。
      # fact: shogun-25
      - 語り: 中奥で過ごす夜は、五つ半、午後9時の時計を合図に、小姓が、また「モウ」と声をかけます。夜の勤めの終わりです。そして、四つ、午後10時に、床に入りました。
        figure: {type: stats, title: 将軍の夜の時刻（松平太郎『江戸時代制度の研究』1919年）, items: [[夕方の膳, 暮れ六つ, 日の入りのころ], [夜詰の終わり, 五つ半, 午後9時], [寝る, 四つ, 午後10時]], upto: 3}
      # fact: shogun-30
      - 語り: 枕元には、毎晩、掛け軸が掛けられました。描かれていたのは、悪い夢を食べるという、獏だった、と松平太郎の本は書いています。
        figure: null
        card: {head: "枕元の掛け軸", body: 悪い夢を食べる獏の絵}
      # fact: shogun-30
      - 語り: 枕は、5つか6つ。夜中に用を足して戻るたびに、新しい枕に、取り替えたからだ、といいます。
      # fact: shogun-31
      - 語り: そして、将軍の脇には、寝ずの番をする小姓が、2人、横になっていました。
        tone: 重い
      # fact: shogun-31
      - 語り: ところが、その小姓の枕について、記録が分かれます。松平太郎の本は、布団と掻巻だけを持って入り、決まりとして、枕は許されなかった、と書きます。
        card: {head: "寝ずの番の小姓", body: 枕は許されたのか}
      # fact: shogun-31
      - 語り: 一方、『千代田城大奥』は、寝間着や枕などを持って、そばに寝た、と書いています。
        figure: {type: stats, title: 寝ずの番の小姓に枕はあったか, items: [[松平太郎（1919年）, 枕は許さず, 布団と掻巻だけ], [『千代田城大奥』（1892年）, 枕などを持つ, 寝間着も]], upto: 2}
      # fact: shogun-31
      - 語り: その『千代田城大奥』には、この番を何度も勤めた小姓の、こんな話があります。
      # fact: shogun-31
      - 語り: なかなか、眠れるものではない。将軍が目を覚ましているうちは、なおさら、咳ひとつ、できない。
        tone: 重い
        figure: null
      - 語り: 朝6時の「モウ」から、夜10時の床まで、およそ16時間。そして眠っているあいだも、将軍のそばには、いつも、誰かがいました。
        tone: しみじみ
      # fact: shogun-46
      - 語り: その毎日は、将軍の体にも、跡を残していました。
        tone: 疑問
        hook: true
      - 語り: 将軍の骨が、それを語っています。
        hook: true

  # ================================================================ 第7章 骨が語る将軍の毎日
  - title: 骨が語る将軍の毎日　増上寺の調査で分かったこと
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      # fact: shogun-46
      - 語り: 東京の芝にある増上寺には、徳川将軍の墓があります。その墓を移すときに、将軍たちの骨が、調べられました。
      # fact: shogun-46
      - 語り: 調べたのは、人類学者の鈴木尚さんです。1985年の論文によると、骨を調べられた将軍は、6代家宣、9代家重、12代家慶、14代家茂の4人。それに、家宣の父の綱重を加えた、5体です。
        card: {head: "増上寺の調査", body: 将軍4人と綱重の5体}
      # fact: shogun-47
      - 語り: 鈴木さんが驚いたのは、12代家慶の歯でした。60歳に達していたのに、歯が、ほとんど、すり減っていなかった。
        tone: 重い
      # fact: shogun-47
      - 語り: 歯の山は、若者のように残り、表面は、宝石のように美しい光沢があった、とまで記しています。
        card: {head: "家慶の歯", body: 60歳でもすり減っていない}
      # fact: shogun-47
      - 語り: 鈴木さんは、その理由を、えり抜かれた、極めて軟らかい食べ物を、食べていたためだろう、と推し量っています。
      # fact: shogun-48
      - 語り: 一方で、将軍の歯は、大きさは庶民と変わらないのに、あごの骨が小さくなっていたため、歯並びは、はなはだ悪かった、ともあります。
      # fact: shogun-49
      - 語り: 顔の形にも、特徴がありました。とても細い顔、細く高い鼻、小さくなったあご。この特徴は、代を重ねるほど強く、14代の家茂で、いちばん強かった、と鈴木さんは書いています。
        portrait: paintings/kazu_iemochi_kano.jpg
      # fact: shogun-50
      - 語り: では、将軍の顔は、どうして細くなったのか。ここで、研究者の見方が、分かれます。
        tone: 疑問
        portrait: null
      # fact: shogun-50
      - 語り: 鈴木さんは、公家の家から来た正室の顔が受け継がれたことと、軟らかい食べ物とが、重なったためだ、と見ました。
      # fact: shogun-50
      - 語り: ところが、国立科学博物館の馬場悠男さんたちの、2013年の報告は違います。将軍の母の多くは、正室ではなく、側室でした。正室の顔が、将軍に受け継がれたことは、事実上ない、というのです。
        figure: {type: stats, title: 将軍の顔が細くなったわけ　研究者の見方, items: [[鈴木尚（1985年）, 正室の遺伝と軟らかい食べ物, 増上寺の将軍の骨], [馬場悠男ら（2013年）, 正室の影響は事実上ない, 将軍の母の多くは側室]], upto: 2}
      - 語り: 顔の形のわけは、まだ、答えが一つに決まっていません。けれど、60歳でもすり減らない歯は、えり抜かれた、軟らかい食べ物を、食べ続けた跡だと、鈴木さんは見ています。
        tone: 重い
        figure: null
      - 語り: 徳川将軍の1日とは、何だったのか。
        tone: 疑問
        hook: true
      - 語り: もう一度、朝から、たどってみます。
        hook: true

  # ================================================================ まとめ（余韻の一文）
  - title: まとめ：徳川将軍の1日は、どんなものだったのか
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト《江戸城》（1860年代。パブリックドメイン）"}
    lines:
      - 語り: 朝は、六つの「モウ」で始まりました。歯みがきの塩も、下帯も、決まっていて、朝の膳は、毒見を通って届き、食べているあいだも、髪を結われました。
        tone: しみじみ
      - 語り: 膳が下がれば、医師に脈をとられ、具合が悪ければ、食べた量まで量られる。昼は、読み上げられる書類を、札で決め、急ぎの書類が出れば、宴の途中でも出ていきました。
      - 語り: 城の外へ出る日は、道筋の町じゅうが、決まりで動き、遠くへの旅は、まれでした。夜は、先祖の命日が、膳と寝る場所を決め、枕元には、獏の絵と、寝ずの番の小姓がいました。
      - 語り: 徳川将軍は、贅沢だったのか。品だけを見れば、そうかもしれません。初物を先に味わい、一度きりの糠袋を使いました。
        tone: しみじみ
        pause: 0.8
      - 語り: けれど、起きる時刻も、膳の届き方も、眠るときに、そばで番をする人を置くことも、将軍には、選べませんでした。その1日は、想像よりずっと、窮屈なものでした。
        tone: しみじみ
        pause: 0.8
      - 語り: 天下を治めた人の、すり減らない歯。それが、決まりの中で過ぎていった、徳川将軍の毎日の、跡でした。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null

