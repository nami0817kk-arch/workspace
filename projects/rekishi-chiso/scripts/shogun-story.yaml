# 物語型の本編（scripts/_template_story.yaml・ooku-story.yaml の型）。徳川将軍の1日（役目の回）。2026-11-06 下書き・同日 事実照合2人と流れ1人の指摘で直した。公開の予定は 11/09 19:00（日本史枠）。
# 型：docs/story-main.md「00. 伸びる型」の E 暮らし型。主語は「徳川将軍」という1つの役目で、最後まで主役。
#   誰でも持つ像＝「贅沢三昧・好きに暮らす将軍」。裏返す像＝起きる時刻・食事の手順・寝る時のそばの人まで決まっていた「窮屈」な1日。
#   記録には贅沢の側もある（家斉の献立は品の種類が多く季節もの・初物は禁令より早い）。隠さずに出し、答えは「品は贅沢でも、1日は選べない＝窮屈」。
#   入口（冒頭10秒）＝食べているあいだも髪を結われ、膳が下がれば医師が脈をとる（shogun-04・22・23）。問いは「何をしていた／どうしてた」。「なぜ」は字に出さない。語りは剣崎1人。想像の台詞なし。
#   大奥の回（11/8）と中身を重ねない：女中の勤め・給金・宿下りの話はしない。大奥は「将軍が入る手順」と添い寝の決まりを短く触れるだけ。
#   家系図の回（11/7）とも重ねない：将軍家のその後・家達の話はしない。
#   1日の流れで章を立てる（一日の実況型）：
#   序章／第1章 明け六つの「モウ」（起床・歯みがき・下帯）／第2章 朝の膳（鱚・毒見・秤・家康・吉宗・家斉の献立）／
#   第3章 食べながら髪を結う（御髪番・月代と顔を剃る・奥医師・家定の七面鳥）／第4章 昼の政務（伺の通り・即下げ・目安箱・講釈・菓子）／
#   第5章 城の外へ出られたか（紅葉山・御成の道筋・雪隠・鷹狩・浜御殿・日光社参・上洛）／
#   第6章 夜（糠袋と浴衣・大奥へ入る手順・精進日・獏の絵・枕・寝ずの番）／第7章 骨が語る将軍の毎日（増上寺の調査）／まとめ。
# 記録の食い違いを並べたのは3か所：①「六つ」は今の何時か（1892『千代田城大奥』今でいえば5時ごろ／1919『江戸時代制度の研究』午前6時）
#   ②寝ずの番の小姓に枕はあったか（松平太郎 1919：決まりとして枕を許さず／『千代田城大奥』1892：寝衣・枕などを携えて傍らに臥す）
#   ③将軍の顔が細くなったわけ（鈴木尚 1985：公家出身の正室の遺伝＋軟らかい食物と推測／馬場悠男ら 2013：生母の大半は側室なので正室の影響は事実上ない）。
# どの将軍の記録か：『千代田城大奥』の日課は家慶（慎徳公）・家定（温恭公）のころの元御小姓の話（家斉は文恭公として過去の話で出る）。家康・吉宗は『徳川実紀』附録。家斉は『調理叢書』。
# 照合で直したこと（11-06）：秤で量るのは「将軍が少しでも病気のとき」だけ（ふだん飯を盛るのは小姓）。「温め直した」とは書いていない（次の間に炉と鍋があっただけ）。
#   『調理叢書』は実際に出した食事の記録ではなく献立の帳面で、何年の献立かは不明（文政6年は奥付）。高正さんはふだんの日の献立を「意外に質素」と書く。
#   毒見の役の話は冬の陣（1614）。モヤシ生姜は「出せなくなった」とは書いていない（禁令と珍事まで）。『深秘徳川大奥』は六つと書かない。奥医師は30人から6人ずつ。
#   『青標紙』の火の見櫓は謹慎中の大名屋敷の決まり（使わない）。凶器を調べた話は『千代田城大奥』。綱吉と柳沢の話は添い寝の者を置く理由。増上寺は将軍4人＋綱重の5体（ほかに正室・側室）。
#   雪隠の話は宝暦10年の落書（家重を当てこすったもの）の注。駕籠を途中で返すのは例のないこと。吉宗の鷹狩の復活は享保元年（1716）、駒場野で初めては享保3年（1718）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/将軍の1日_facts_20261106.yaml、shogun-01〜76）にあるものだけ。行の上に `# fact: shogun-NN`。
#   『千代田城大奥』（永島今四郎・太田贇雄 編、1892。NDL デジタル 772935・772936）の「将軍の日課」（下・コマ124〜132）・「御寝」（下・コマ86）は頁の画像で読んだ（担当 Agent）。
#   『江戸時代制度の研究』（松平太郎、1919。NDL 980847）コマ216〜221 は OCR の読み違いが多い。『旧事諮問録』の本文は開けていない（書誌だけ。言わない）。
#   shogun-06（家茂の虫歯）は出どころが無いので使わない。月代と顔を剃る話は『千代田城大奥』125R「御髪を結ひ、顔及び月代を剃る」（照合担当が頁の画像で確認。カードは shogun-22 の頁）。
# 計算（自分で計算し直した）：
#   朝六つ起床・五つ（午前8時）朝食・九つ（正午）昼食・五つ半（午後9時）夜詰引・四つ（午後10時）就寝 → 起きてから寝るまで約16時間。
#   吉宗の2食：辰の刻（午前7〜9時）・申の刻（午後3〜5時）→「目安で、朝8時ごろと、夕方4時ごろ」と言う。
#   六寸 ≒ 6 × 3.03cm ＝ 約18cm。
#   高正晴子の数（朝食 171/350 を 48.3%、昼食 233/348 を 65.8% と書く。171/350＝48.9%、233/348＝67.0% で論文の割合と分母が合わない）→ 割合は言わず「およそ半分」「およそ3分の2」「3割あまり（33.1%）」。
#   日光社参：家治 安永5年＝1776年 → 家慶 天保14年＝1843年＝67年ぶり。上洛：家光 寛永11年＝1634年 → 家茂 文久3年＝1863年＝229年ぶり。30万7千人 ÷ 3,000人 ≒ 102 →「およそ100分の1」。
#   吉宗の日光社参 享保13年＝1728年。鷹狩の復活 享保元年＝1716年・駒場野 享保3年＝1718年。綱吉 貞享4年＝1687年。講釈 元禄6年＝1693年〜元禄13年＝1700年（足かけ8年）。
#   家慶 1793年生まれ・1853年没 → 満60歳。『千代田城大奥』明治25年＝1892年。大坂冬の陣 慶長19年＝1614年。
