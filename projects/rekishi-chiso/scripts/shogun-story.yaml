# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  天下を治めた徳川将軍。好きなものを好きなだけ食べ、好きなように暮らしていた、と思うかもしれません。
  けれど将軍は、朝ご飯を食べているあいだも、ひとりではありませんでした。後ろでは小姓たちが髪を結い、膳が下がると、医師が2人ずつ脈をとりました。
  この動画でわかること
  ・「モウ」の声で始まる将軍の朝と、毒見を通って届く朝の膳
  ・具合が悪いと、食べたご飯を秤で量られた話
  ・「伺の通りたるべく候」の札で決めた昼の政務
  ・将軍は城の外へ出られたのか。御成の道筋の決まりと、229年ぶりの上洛
  ・糠袋と10枚の浴衣、獏の絵の掛物、寝ずの番。そして、骨が語る将軍の毎日
description_note: |-
  将軍の日課は、永島今四郎・太田贇雄 編『千代田城大奥』（1892年）の附録「将軍の日課」（元御小姓たちの話。おもに12代家慶・13代家定のころ）、松平太郎『江戸時代制度の研究』（1919年）、高瀬羽皐『深秘徳川大奥』（1930年）を、国立国会図書館デジタルコレクションで読みました。家康・吉宗の話は『徳川実紀』の附録（『東照宮御実紀附録』『有徳院殿御実紀附録』）によります。
  家斉の献立の数は高正晴子「将軍の献立について」（日本家政学会誌、1994年）、遺骨の話は鈴木尚「江戸時代における貴族形質の顕現」（人類学雑誌、1985年）と、馬場悠男さんらの研究成果報告書（2013年）によります。御成と日光社参は、宇都宮市教育委員会・目黒区・中央区・岐阜県歴史資料館などの公開資料で確かめました。
  江戸の時刻は日の出と日の入りで区切るため、季節で動きます。動画の「午前6時」などは目安です。
  画面の室内・人物の後ろ姿や手もとの画像の一部は、画像生成AIで作った想像上のイメージで、実在の写真ではありません。将軍の姿も特定の肖像を写したものではありません。サムネイルの人物像も AI による想像図です。

en:
  title: "Did the Tokugawa Shogun Live in Luxury? A Shogun's Day Was Far More Restricted Than You Think"
  description: |-
    The Tokugawa shogun ruled the land. You might imagine he ate whatever he liked and lived as he pleased.
    Yet even at breakfast he was never alone: pages dressed his hair behind him as he ate, and when the trays were cleared, doctors came in two by two to take his pulse.
    In this video you will learn:
    - How the shogun's morning began with the call "Mō", and how his breakfast reached him past the food tasters
    - How, when he was unwell, his rice was weighed after the meal
    - How state papers were decided with a slip reading "as requested"
    - Could the shogun leave the castle? The rules on the road, and the first visit to Kyoto in 229 years
    - Rice-bran bags and ten bathrobes, a picture of the baku by his pillow, the night watch, and what the shoguns' bones tell us
    Japanese-language history video (Japanese audio).
  chapters:
    - "Even at Breakfast, the Shogun Was Never Alone"
    - "How Did the Shogun Wake Up? The Call of \"Mō\""
    - "What Did He Eat? Kisu, Food Tasters, and the Scale"
    - "Hair Dressed While Eating, and the Morning Doctors"
    - "What Did He Decide? Afternoon Papers and \"As Requested\""
    - "Could He Leave the Castle? The Records of His Outings"
    - "What Did He Do at Night? The Bath, the Inner Palace, and the Night Watch"
    - "What the Shoguns' Bones Tell Us"
    - "Summary: What Was a Shogun's Day Like?"

