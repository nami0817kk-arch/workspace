# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1189年6月、京の後白河院は、鎌倉の源頼朝に「義経は討たれた。今は弓矢を袋にしまいなさい」と返しました。頼朝はこの言葉に従わず、7月、院宣まで退けて奥州へ向かいます。
  義経は、すでに亡くなっていました。奥州藤原氏は、その年のうちに滅びます。
  もしも義経が、兄・頼朝と戦わず、平泉にとどまっていたら、奥州藤原氏は滅びなかったのでしょうか。
  この動画でわかること
  ・義経が平泉に入るまでの道と、1185年の秋に頼朝と義経の間に起きたこと（吾妻鏡・玉葉）
  ・秀衡の遺言が、吾妻鏡と玉葉で違って書かれていること
  ・義経の首が鎌倉へ届くまでの日数と、泰衡が頼朝へ送った書状
  ・頼朝は、朝廷の「待て」を退けて奥州へ向かったこと
  ・1950年の調査で泰衡の首から見つかった釘の跡と、首桶の蓮の種
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（吾妻鏡、九条兼実の日記『玉葉』、中尊寺・平泉町・文化庁・岩手県教育委員会・岩手県立博物館・国土交通省観光庁の公開資料、柳原敏昭・高橋富雄・大石直正・入間田宣夫・安田元久の論考と辞典項目、2021年の学術論文（PLOS ONE）など）を語りで示してから、今の言葉にして読んでいます。
  吾妻鏡の1185年から1189年の本文は、読み下し文で確かめたもので、漢文の原文との照合は済んでいません。吾妻鏡と玉葉で、大物浦の乗船の日、秀衡の遺言の内容が違って書かれています。兵の数も、記録の箇所によって大きく違います。義経が最初に平泉へ入った年（1174年ごろ）の根拠の史料は、確かめられていません。
  義経が頼朝と戦わず平泉にとどまった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、画像生成AIで作った想像上の風景と人物です。サムネイルの風景と人物は、画像生成AIによる想像図です。

en:
  title: "What If Yoshitsune Had Stayed in Hiraizumi, Never Fighting Yoritomo? Fate of the Oshu Fujiwara"
  description: |-
    In June 1189, the retired emperor Go-Shirakawa told Minamoto no Yoritomo in Kamakura: Yoshitsune has been killed, so now put your bows and arrows in their bags. Yoritomo ignored him. In July he even rejected an imperial order to wait a year, and marched north to Oshu.
    Yoshitsune was already dead. The Oshu Fujiwara family fell that same year.
    If Yoshitsune had not fought his brother and had simply stayed in Hiraizumi, would the Oshu Fujiwara have survived?
    In this video you will learn:
    - The road that led Yoshitsune to Hiraizumi, and what happened between the brothers in the autumn of 1185 (Azuma Kagami and Gyokuyo)
    - How the two chronicles record Hidehira's last wishes differently
    - How many days it took Yoshitsune's head to reach Kamakura, and the letter Yasuhira sent to Yoritomo
    - Why Yoritomo marched north even after the court told him to wait
    - The nail hole and the lotus seeds found in Yasuhira's head box in the 1950 investigation
    Japanese-language history video (Japanese audio). The parts that begin with "what if" are reasoning, not records.
  chapters:
    - "Put the Bows Away"
    - "Hidehira, Lord of Oshu"
    - "Turning Point 1: If He Had Gone to Hiraizumi Without Fighting"
    - "Turning Point 2: If Hidehira Had Lived"
    - "Koromogawa, the Last Day of the Leap Fourth Month"
    - "Turning Point 3: If Yasuhira Had Not Killed Him"
    - "Afterwards: The Lotus in the Head Box"
    - "Summary: If Yoshitsune Had Stayed in Hiraizumi"

