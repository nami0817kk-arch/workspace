# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と genbaku-if-story.yaml の型）。もしも義経が頼朝と戦わず平泉にとどまっていたら。2026-11-12 下書き。
# 公開の予定は 11/15 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型（題材はユーザーが決めた：日本史・鎌倉）：
#   対象は「史実で滅んだ有名な家」＝奥州藤原氏／一点だけ変える（義経が頼朝と戦わず平泉にとどまる）／史実の条件の範囲内／推論と明かす／台詞は使わない（想像の台詞なし）。
#   「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない（各分岐の宣言から。「ここからは、もしもの話です」）。予想の席は研究者の評価に置く。
#   冒頭（10秒以内）＝1189年6月、後白河院は頼朝に「義経は討たれた、今は弓矢を袋にしまえ」と返した（吾妻鏡）。頼朝は7月の「今年ばかりは待て」の院宣まで退けて奥州へ向かった。
#   序章 弓矢を袋にしまえ（院の返事・頼朝は退けた・泰衡の書状・義経の首）／第1章 奥州の主、藤原秀衡（1174・黄瀬川・陸奥守・金と馬・柳之御所・鎌倉との取り決め）／
#   第2章 分岐1 戦わずに平泉へ向かっていたら（任官・腰越・土佐坊と官符の順序・大物浦の食い違い・守護地頭・吉野・奥州入り）／
#   第3章 分岐2 秀衡が生きていたら（頼朝の申し入れ・秀衡の死と遺言の食い違い・頼朝は動かず朝廷に迫らせた）／
#   第4章 衣川、閏4月30日（襲撃・館の場所・兼実の「義士」と「天下の悦び」・首と「43日」・藤沢の伝説）／
#   第5章 分岐3 泰衡が義経を討たなかったら（大庭景能・院宣を退ける・1000騎と28万4000騎・宣旨は7週間後・泰衡の書状・研究者の評価）／
#   第6章 その後 首桶の蓮（1950年の調査・釘・蓮・500年後の芭蕉）／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 題材の扱い：残虐な場面の細部は描かない（妻子の最期は一文だけ・絵なし）。判官びいき・北行伝説・チンギス・ハン説は扱わない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/源義経_facts_20261112.yaml）にあるものだけ。行の上に `# fact: yoshitsune-NN`。
#   吾妻鏡の1185〜1189年の本文は「読み下し」（個人サイトの現代語・読み下し）で読んだもの。漢文原文との照合は未了なので、台本では書名と日付を言い、原文の字句を断定しない。干支は信用しない。
#   黄瀬川の条（治承4年10月21日）は Wikisource の国史大系本の翻刻で原文を確かめた。
# 記録の食い違い：①大物浦（吾妻鏡は11月6日に乗船、玉葉は5日の夜）②秀衡の遺言（吾妻鏡は義経を大将軍に、玉葉は伝聞で頼朝を襲う謀）③吾妻鏡の兵の数（出発1000騎、のちに28万4000騎）
#   ④宣旨と出発（大石直正は事後承認、入間田宣夫は奏請したが宣下を待たず）⑤「43日間酒に漬けた」は吾妻鏡に日数が無い。
# 自分で計算した数：1185（壇ノ浦）→1189＝4年。1187年2月10日→10月29日＝8か月あまり。閏4月30日→6月13日＝42日後（数えで43日目）。5月22日（知らせ）→6月13日（首）＝20日。
#   閏4月30日（6月15日）→7月7日＝22日後。9月1日（出発）→10月20日（宣旨が着く）＝49日＝7週間。義経の死→泰衡の死（6月15日→10月14日）＝4か月。1189→1950＝761年→760年あまり。1950→1998＝48年。1189→1689＝500年。
#   1181（陸奥守）→1187（死）＝6年。1186年4月の取り決め。
# 確かめられなかったこと（台本では言わない）：頼朝が秀衡に「義経を渡せ」と直接求めた書状、玉葉の1170年の鎮守府将軍への批評、愚管抄の義経評、「高館」の呼び名の起こり、
#   1174年・16歳の根拠史料（平泉町の年表と観光庁の解説のみ）、北陸の道・弁慶・安宅の関（吾妻鏡で確認できない）、秀衡の身長、平泉の人口、平泉館の焼失の発掘での裏づけ、DNA、1950年の身長の数字。
# 絵：AI 絵（Gemini。一覧は scripts/story/yoshitsune_main_look.yaml の頭）だけ。実在の人物の顔は描かない（後ろ姿・遠景）。
