sections:
  # ================================================================ 序章
  - title: 「弓矢を袋にしまえ」　1189年
    lines:
      # fact: yoshitsune-11
      - 語り: 義経が討たれたと知った、引退した天皇の後白河院は、頼朝に、こう返しました。国じゅうは静まるはずだ。今は、弓矢を袋にしまいなさい。吾妻鏡に載る、1189年6月8日の返事です。
        tone: 重い
        card: {head: "1189年6月8日", body: 院から頼朝への返事}
      # fact: yoshitsune-13
      - 語り: 頼朝は、従いませんでした。7月、今年ばかりは待つように、という院の命令書、院宣が届いても、どうして来年を待てようか、と退けて、軍を率いて奥州へ向かいます。
      - 語り: 義経は、もう、この世にいませんでした。
      - 語り: もしも義経が、兄の頼朝と戦わず、そのまま平泉にとどまっていたら。奥州藤原氏は、滅びなかったのでしょうか。鎌倉幕府の記録、吾妻鏡と、公家の九条兼実の日記、玉葉を手がかりに、3つの分かれ目で確かめます。
        tone: 疑問
      # fact: yoshitsune-10
      - 語り: 義経を討ったのは、かくまっていた藤原秀衡の息子、泰衡でした。1189年閏4月30日、衣川のやかたを数百騎で襲います。吾妻鏡は、朝廷の命令と、頼朝の指示に従ったのだ、と記します。
        card: {head: "1189年閏4月30日", body: 泰衡が義経を襲う}
      # fact: yoshitsune-14
      - 語り: それでも泰衡は、攻められます。追われた泰衡は頼朝に、義経を討ったのは手柄ではないか、と訴えました。
      # fact: yoshitsune-12
      - 語り: 討たれた義経の首は、鎌倉の腰越の浜へ運ばれました。死から42日後、1189年6月13日のことです。
      # fact: yoshitsune-12
      - 語り: 首を確かめたのは、和田義盛と梶原景時。見ていた人は皆、涙を拭い、両方の袖を濡らした、と吾妻鏡は書きます。
        tone: 重い
      - 語り: 義経は、なぜ平泉で命を落とすことになったのか。まず、義経が最初に平泉へ入った頃に、戻ります。
        hook: true
      - 語り: そこには、のちの運命を決める、1人の人物がいました。
        hook: true

  # ================================================================ 第1章 奥州の主、藤原秀衡
  - title: 「奥州の主、藤原秀衡」　1174年から1186年
    year: 1180
    lines:
      # fact: yoshitsune-27
      - 語り: 平泉町の年表によると、義経は1174年ごろ、平泉に入りました。1180年の10月に奥州を出るまで、秀衡のもとで過ごしたとされます。
        card: {head: "1174年ごろ", body: 義経、平泉へ}
      # fact: yoshitsune-49
      - 語り: 1180年10月21日、義経は駿河の黄瀬川で、兄の頼朝に会います。吾妻鏡は、秀衡が義経を強く引き留め、止められないと見て、佐藤継信・忠信の兄弟を、あとから付けた、と書きます。
      # fact: yoshitsune-49
      - 語り: 頼朝は、年のころから、奥州の九郎か、と察して対面を許し、2人は昔を語って、懐かしさに涙した、と吾妻鏡は書きます。
        tone: しみじみ
      # fact: yoshitsune-28, yoshitsune-15
      - 語り: 翌1181年の8月、平氏は、秀衡を、東北の長官にあたる陸奥守に任じました。東国の頼朝と、木曽の義仲を抑えさせるためです。
      # fact: yoshitsune-15
      - 語り: 公家の九条兼実は、日記の玉葉に、「天下の恥、何事かこれに如かずや」と書きました。兼実にとって、奥州の主が陸奥守になるのは、それほどの出来事でした。
      # fact: yoshitsune-29
      - 語り: 平泉の富は、並ではありませんでした。東北大学の柳原敏昭さんの解説によると、秀衡の父の基衡は、毛越寺の本尊づくりの礼に、金の塊100両や駿馬50頭などを贈っています。
      # fact: yoshitsune-29
      - 語り: 仏像ができるまでの3年間、京と平泉を行き来する人と馬が、絶えなかったそうです。
      # fact: yoshitsune-29
      - 語り: 柳原さんは、平泉を、12世紀の、京都より東で最大の都市とみています。
      # fact: yoshitsune-23
      - 語り: 文化庁によると、秀衡のやかたがあったと考えられる柳之御所遺跡では、かわらけと呼ぶ素焼きの皿が、十数トンも出ました。東西約300メートル、南北約200メートルが、堀で囲まれていました。
      # fact: yoshitsune-25
      - 語り: 岩手県立博物館の鎌田勉さんによると、柳之御所では、地元風のろくろの皿と、京都風の手づくねの皿が、ほぼ同じ量でした。町の南では、京都風が目立ちます。
      # fact: yoshitsune-28, yoshitsune-32
      - 語り: 1186年4月、秀衡は、京への馬と金の貢ぎ物を、鎌倉を通して送る取り決めを、頼朝と結びます。高橋富雄さんは、秀衡は京と結びながら鎌倉とも友好を結び、平泉の地位を確かなものにした、と述べます。
      - 語り: 義経が戻る前の平泉は、京とも鎌倉とも、争わずにいたことになります。
        tone: しみじみ
      - 語り: 義経が兄と争ったのは、平泉に入る、ずっと前のことでした。
        hook: true
      - 語り: 兄弟の溝は、1184年の秋に、生まれていました。
        hook: true

  # ================================================================ 第2章 分岐1 戦わずに平泉へ向かっていたら
  - title: 「分岐1 戦わずに平泉へ向かっていたら」　1184年から1187年
    year: 1185
    lines:
      # fact: yoshitsune-05
      - 語り: 1184年8月6日、義経は、京の治安を守る官、検非違使に任じられました。頼朝の許しを得ない任官でした。
      # fact: yoshitsune-05
      - 語り: 知らせを聞いた頼朝の様子を、吾妻鏡は「頗る武衛の御気色に違う」と記します。武衛は頼朝のこと。ひどく機嫌を損ねた、という意味です。
        card: {head: "1184年8月6日", body: 頼朝に無断の任官}
      # fact: yoshitsune-05
      - 語り: 頼朝は、範頼たちの官は自分が推挙したのに、義経は先に自分で望んだのか、と疑い、平家追討への起用を、しばらく見合わせました。
      # fact: yoshitsune-34
      - 語り: 安田元久さんは、世界大百科事典で、頼朝に認められない任官は、頼朝に仕える武士、御家人の仕組みを破る独断だった、と見ています。
      # fact: yoshitsune-06
      - 語り: 壇ノ浦のあとの1185年5月、義経は、鎌倉に入れてもらえず、腰越で日を送ります。
        card: {head: "1185年5月24日", body: 腰越の嘆状}
      # fact: yoshitsune-06
      - 語り: 頼朝が腹を立てた理由として、吾妻鏡は、義経が九州のことを残らず取り仕切り、従った東国の武士に小さな過ちも許さず、頼朝に報告もしなかったことを挙げます。
      # fact: yoshitsune-06
      - 語り: 起請文を出しても、かえって頼朝を怒らせた、と吾妻鏡は書きます。腰越状への頼朝の返事は、その条には、見当たりません。
        tone: 重い
      # fact: yoshitsune-01
      - 語り: 1185年10月9日、頼朝は、土佐坊昌俊を京へ送り出します。吾妻鏡は、83騎と記します。
        card: {head: "1185年10月9日", body: 頼朝、刺客を送る}
      # fact: yoshitsune-01
      - 語り: 17日の夜、昌俊は六条室町の義経の屋敷を襲いましたが、退けられ、26日に捕らえられて、六条河原で首をさらされました。
      # fact: yoshitsune-02
      - 語り: 義経が院に、頼朝を討つ官符をください、と求めたのは、10月11日と13日。刺客が鎌倉を出た、2日あとです。
      # fact: yoshitsune-02
      - 語り: 吾妻鏡によると、義経は、許されなければ自殺する、とまで言いました。10月18日、頼朝を追討する朝廷の正式な命令、宣旨が下ります。
      # fact: yoshitsune-02
      - 語り: その理由は、義経のほかに京を守る武士がいない。先に宣旨を出して、あとで関東に事情を伝えれば、頼朝も怒るまい、というものでした。
      # fact: yoshitsune-03
      - 語り: 11月3日、義経は京を出ます。11月6日、大物浦で船に乗りますが、疾風で船は覆り、従う者は、弁慶ら4人になった、と吾妻鏡は書きます。
      # fact: yoshitsune-03
      - 語り: ところが玉葉は、5日の夜に乗船し、夜半から大風が吹いて、船は一艘も残らなかった、と伝えます。乗った日が、1日ずれています。
        tone: 疑問
      # fact: yoshitsune-04
      - 語り: 同じ11月、頼朝は、北条時政を京へ送り、全国に置く、警察と土地管理の役、守護・地頭の許しを求めます。29日に勅許が出ました。
      # fact: yoshitsune-04
      - 語り: 玉葉は、「言語の及ぶ所に非ず」と批判します。頼朝は書状で、自分の利益を思うためではない、と述べました。
      # fact: yoshitsune-07
      - 語り: 1187年2月10日、吾妻鏡は、義経が、伊勢・美濃を経て、陸奥守秀衡の勢いを頼りに、奥州へ向かったと書きます。妻子を連れ、山伏と子どもの姿でした。
        figure: {type: map, title: 義経の足取り（吾妻鏡）, bounds: [133.0, 142.5, 33.5, 40.5], places: [[京都, 135.77, 35.01], [大物浦, 135.41, 34.73], [吉野, 135.86, 34.37], [平泉, 141.11, 39.0]], route: [京都, 大物浦, 吉野, 平泉], note: 北陸の道は書かれていない}
      - 語り: 1つ目の分かれ目です。もしも義経が、10月に官符を求めず、頼朝と戦おうとせずに、そのまま平泉へ向かっていたら。ここからは、もしもの話です。
        tone: 疑問
        figure: null
      # fact: yoshitsune-01, yoshitsune-02
      - 語り: 記録から言えるのは、こうです。頼朝が刺客を出したのは、義経が官符を求める2日前。腰越で頼朝が腹を立てた理由として、吾妻鏡が挙げるのは、九州での振る舞いと独断です。その前には、無断の任官もありました。戦う前から、兄弟の溝は、深くなっていました。
      # fact: yoshitsune-34
      - 語り: 高橋富雄さんは、義経には自分の家来の組織がなく、独断で動いたことが、御家人との対立を招いた、と見ています。
      - 語り: だとすれば、義経が戦わずに平泉へ向かっても、頼朝の疑いは、消えなかったことになります。変わるのは、平泉に着く時期くらいかもしれません。
        tone: しみじみ
      - 語り: ここまでが、もしもの話です。ここからは、記録に戻ります。
        tone: しみじみ
      - 語り: では、平泉に着いたあと、頼朝は、どう動いたのか。
        hook: true
      - 語り: 吾妻鏡の記事から数えて、秀衡が生きていたのは、あと8か月あまりでした。
        hook: true

  # ================================================================ 第3章 分岐2 秀衡が生きていたら
  - title: 「分岐2 秀衡が生きていたら」　1187年から1188年
    year: 1187
    lines:
      # fact: yoshitsune-07
      - 語り: 1187年3月5日、頼朝は、義経が奥州にいるのは秀衡の手引きだ、という申し立てが一致している、として、京都に厳しく尋ねるよう申し入れます。吾妻鏡の記事です。
        card: {head: "1187年3月5日", body: 頼朝が京へ申し入れ}
      # fact: yoshitsune-09
      - 語り: 1187年10月29日、秀衡は、平泉のやかたで亡くなりました。吾妻鏡は、重い病のなか、秀衡が、息子の泰衡らに、義経を大将軍として国の政を行わせよ、と遺言した、と書きます。
        card: {head: "1187年10月29日", body: 秀衡の死}
      # fact: yoshitsune-09
      - 語り: ところが玉葉は、別の遺言を伝えます。兄の国衡と泰衡が和睦し、義経を主君として2人で仕え、3人一味で頼朝を襲う謀を練っている、と。「ある人が言うには」という、伝え聞きです。
        tone: 疑問
      - 語り: 同じ遺言が、吾妻鏡では「大将軍に」、玉葉では「頼朝を襲う」と、書き分けられています。
      # fact: yoshitsune-21
      - 語り: 2021年の学術論文によると、1950年の調査で、秀衡の遺体には、背骨に太く固まったような変化があり、馬に乗り、武芸に励んだ体だったと見られます。亡くなった年齢は、約70歳と推定されます。
      # fact: yoshitsune-08
      - 語り: 秀衡が亡くなった翌年、1188年2月。頼朝は、京へ伝言を送ります。亡き母のために五重の塔を建て、今年は厄年で、殺生も慎んでいる。
        card: {head: "1188年2月13日", body: 頼朝「今年は沙汰に及ばず」}
      # fact: yoshitsune-08
      - 語り: 追討の役目は承っているが、今年は、何も手出しはしない。朝廷から直接、秀衡の子に命じて、義経を差し出させてほしい。玉葉2月13日の条です。
      # fact: yoshitsune-08
      - 語り: 朝廷は、この月のうちに、泰衡に義経を召し出させる宣旨を出します。頼朝は、自分では動かず、朝廷の名で迫りました。
      - 語り: 2つ目の分かれ目です。もしも秀衡が、この時まで生きていたら。ここからは、もしもの話です。
        tone: 疑問
      - 語り: 秀衡が生きていたら、どうなったか。この問いに、直接答えた記録は、ありません。残っているのは、秀衡が生きていた間の事実と、研究者の評価です。
      # fact: yoshitsune-32
      - 語り: 秀衡が生きていた間、頼朝は、軍を奥州へ向けませんでした。高橋富雄さんは、平泉が、京と鎌倉の間で、均衡の地位を保っていた、と見ています。
      # fact: yoshitsune-33
      - 語り: ところが高橋さんは、秀衡が義経をかくまい、その死後も泰衡らが独立を図った策が、かえって平泉が滅びるもとになった、とも書いています。
      - 語り: 義経が平泉にいる間、頼朝の申し入れは、1187年3月にも、1188年2月にもありました。秀衡が長く生きていたら、その圧力に耐えられたのか、記録に答えはありません。
        tone: しみじみ
      - 語り: もしもの答えを置くなら、秀衡が生きていれば、平泉が耐える時間は、延びたかもしれません。ただ、義経を差し出すか、守るかという問いは、残ったままです。
      - 語り: ここまでが、もしもの話です。
        tone: しみじみ
      - 語り: 秀衡の遺言どおり、泰衡は、義経を大将軍にしたのでしょうか。
        hook: true
      - 語り: 吾妻鏡は、年が明けた1189年の閏4月30日に、その答えを書いています。
        hook: true

  # ================================================================ 第4章 衣川、閏4月30日
  - title: 「衣川、閏4月30日」　1188年から1189年
    year: 1189
    lines:
      # fact: yoshitsune-08
      - 語り: 1188年の秋から冬、朝廷は、泰衡に、重ねて迫ります。11月の院庁の文書は、義経を差し出せ、違えば官軍を遣わす、と書いていました。
      # fact: yoshitsune-10
      - 語り: 1189年閏4月30日。吾妻鏡によると、泰衡の兵が数百騎、衣河のやかたに押し寄せました。義経の家来は防ぎましたが、悉く敗れます。
        card: {head: "1189年閏4月30日", body: 義経、31歳}
        tone: 重い
      # fact: yoshitsune-10
      - 語り: 義経は、屋敷の中のお堂、持仏堂に入り、22歳の妻と、4歳の娘を手にかけて、自ら命を絶ちました。吾妻鏡は、「年三十一」と記します。
        tone: 重い
      # fact: yoshitsune-47
      - 語り: 義経が最期を迎えた「衣河のやかた」は、藤原基成のやかたとされます。岩手県教育委員会の報告書によると、「高館」という呼び名は、同じ時代の文献には見えず、やかたの場所も、確定していません。
      # fact: yoshitsune-26
      - 語り: 高館の山のふもとからは、12世紀の堀が見つかっています。幅は6メートルから12メートル、深さは2メートル前後です。
      # fact: yoshitsune-11
      - 語り: 京では、5月29日、一条能保が兼実に、九郎は泰衡に討たれた、と伝えました。兼実は、玉葉に書きます。「天下の悦び何事かこれに如かず。頼朝卿の運」。
      # fact: yoshitsune-15
      - 語り: その兼実は、4年前、義経が京を去った日にも、日記に書いていました。「義経等の所行、実に以て義士と謂うべきか」。
        tone: しみじみ
      # fact: yoshitsune-12
      - 語り: 義経の首は、黒漆の櫃に入れ、酒に浸してありました。「43日間、酒に漬けた」と語られることもありますが、吾妻鏡に日数は書かれていません。
      - 語り: 閏4月30日から6月13日までは、42日後。数えで43日目です。
      # fact: yoshitsune-12
      - 語り: 頼朝は、6月7日、塔の供養を済ませるまでは、首を持ってこず、途中で待て、と奥州へ飛脚を送っていました。
      # fact: yoshitsune-46
      - 語り: 神奈川県藤沢市の資料によると、首は、実検のあと、浜に打ち捨てられた、という伝えがあります。川をさかのぼって流れ着いた首を、土地の人が洗い清めた、という伝説の井戸が、藤沢に残っています。
      - 語り: では、義経を討った泰衡は、無事だったのか。
        hook: true
      - 語り: 3つ目の分かれ目が、ここにあります。
        hook: true

  # ================================================================ 第5章 分岐3 泰衡が義経を討たなかったら
  - title: 「分岐3 泰衡が義経を討たなかったら」　1189年6月から9月
    year: 1189
    lines:
      - 語り: 3つ目の分かれ目です。もしも泰衡が、朝廷の命令にも、頼朝の圧力にも従わず、義経を討たなかったら。ここからは、もしもの話です。
        tone: 疑問
      - 語り: 手がかりは、史実にあります。泰衡は、義経を討ちました。それで、どうなったのか。
      # fact: yoshitsune-13
      - 語り: 義経が死んだあとも、頼朝は、泰衡を討つ支度を進めます。6月24日、京の一条能保から、今年は猶予を、と伝えが届きました。
      # fact: yoshitsune-13
      - 語り: それでも6月30日、頼朝は、大庭景能に尋ねます。勅許もないのに、御家人を集めたのは、どうか、と。
        card: {head: "1189年6月30日", body: 大庭景能の答え}
      # fact: yoshitsune-13
      - 語り: 景能の答えは、こうです。「軍中は将軍の令を聞く。天子の詔を聞かず」。泰衡は代々の御家人の跡を継ぐ者。天皇の命令書、綸旨がなくても、討ってよい、と。頼朝は感じ入って、馬を与えました。
      # fact: yoshitsune-13
      - 語り: 7月16日、今年ばかりは猶予を、という院宣が届きます。頼朝は、どうして来年を待てようか、と退けました。7月19日、鎌倉を出発。吾妻鏡は、このときの数を、1000騎と記します。
      # fact: yoshitsune-37, yoshitsune-13
      - 語り: 一方、のちの軍勢の総数を、吾妻鏡は、28万4000騎とも記します。入間田宣夫さんは、家来などを含む数だと説明します。1000騎と、28万4000騎。数は、大きく開いています。
        figure: {type: stats, title: 吾妻鏡の兵の数（奥州合戦）, items: [[出発の数（吾妻鏡）, 1000騎], [軍勢の総数（吾妻鏡）, 28万4000騎]], upto: 2}
      # fact: yoshitsune-13, yoshitsune-35, yoshitsune-36
      - 語り: 吾妻鏡によると、追討の宣旨は、7月19日付。頼朝の陣に届いたのは、出発の7週間後、9月9日でした。
        figure: null
      # fact: yoshitsune-35, yoshitsune-36
      - 語り: 大石直正さんは、朝廷は泰衡追討の命令を出さず、合戦のあとに、事後承認の形で届いた、と書きます。入間田さんは、宣旨を求めたが、宣下を待たずに出発した、と書きます。
      # fact: yoshitsune-30
      - 語り: 泰衡は6月、弟の忠衡も討っていました。
      # fact: yoshitsune-30
      - 語り: 文化庁によると、阿津賀志山には、堀の幅約15メートル、深さ1.5メートルから2.8メートルの二重の堀と、三重の土塁が築かれています。
      # fact: yoshitsune-30
      - 語り: その阿津賀志山の戦いに敗れ、泰衡の兄の国衡は、8月に討たれます。
        tone: 重い
      # fact: yoshitsune-14
      - 語り: 8月26日、泰衡は、頼朝の宿に書状を投げ入れました。義経は、父が守っていた者。自分は、命を受けて討った。これは手柄ではないか。
      # fact: yoshitsune-14
      - 語り: 御家人に加えてほしい。それがだめなら、死罪を減じて、遠くへ流してほしい、と。
      # fact: yoshitsune-14
      - 語り: 吾妻鏡によれば、頼朝は、返事を置いた所に来る者を捕らえる、という案を退け、兵に、郡の中を捜させました。9月3日、泰衡は、家来の河田次郎に、比内郡で討たれます。
        card: {head: "1189年9月3日", body: 泰衡、討たれる}
      # fact: yoshitsune-34, yoshitsune-36, yoshitsune-33
      - 語り: 3人の研究者は、どれも義経をめぐる動きに注目しています。大石さんは、泰衡は頼朝の強請で義経を殺したが、許されなかった、と書きます。入間田さんは、義経の引き渡しをめぐる対立が、直接の原因だった、と書きます。
        figure: {type: table, title: 奥州合戦をめぐる研究者の見方, cols: [研究者, 見方], rows: [[大石直正, 義経を殺しても許されなかった], [入間田宣夫, 引き渡しをめぐる対立が直接の原因], [高橋富雄, かくまって独立を図った策が滅亡のもと]], upto: 3}
      - 語り: 義経を討っても、泰衡は、許されませんでした。討たなかった場合を書いた記録は、ありません。
        figure: null
      - 語り: ただ、頼朝が、院の「待て」を退けて攻めたことは確かです。義経が死んだあとも、戦いは止まりませんでした。
        tone: しみじみ
      - 語り: もしもの答えを置くなら、泰衡が義経を守っても、頼朝が院の「待て」を退けて攻めた以上、平泉が無事でいられた道は、ごく細いものだった、と考えられます。
      - 語り: ここまでが、もしもの話です。
      - 語り: 泰衡の首は、その後、どうなったのか。
        hook: true
      - 語り: その首は、760年あまりのち、思わぬ姿で見つかります。
        hook: true

  # ================================================================ 第6章 その後 首桶の蓮
  - title: 「その後　首桶の蓮」　1950年から
    year: 1950
    lines:
      # fact: yoshitsune-16
      - 語り: 1950年、中尊寺の金色堂の須弥壇に納められた、藤原四代の遺体が、学術調査を受けました。朝日新聞社が、報告書、『中尊寺と藤原四代』を出します。
        card: {head: "1950年", body: 藤原四代の遺体の調査}
      # fact: yoshitsune-19, yoshitsune-18
      - 語り: 泰衡の遺体は、首だけです。寺では長く、弟の忠衡の首と伝えてきました。ところが調査で、頭に刀の傷と、釘の穴が、見つかります。
      # fact: yoshitsune-18
      - 語り: 吾妻鏡は、泰衡の首に、長さ八寸、約24センチの鉄の釘を打った、と書きます。頭の骨の長さは、約18.6センチ。2021年の論文は、記録と傷が合うと指摘します。
      # fact: yoshitsune-19
      - 語り: こうして首は、泰衡のものと、改められました。
      # fact: yoshitsune-22
      - 語り: 中尊寺と横手市によると、首を納めた桶からは、約100粒の蓮の種が見つかります。大賀一郎博士に預けられ、門下の長島時子さんが育てて、48年後の1998年、花が開きました。中尊寺ハスです。
        tone: しみじみ
      # fact: yoshitsune-20
      - 語り: 遺体のDNAの分析は、2021年の論文の時点では、まだ行われていません。
      # fact: yoshitsune-26, yoshitsune-48
      - 語り: 高館の山の上の義経堂は、1683年、仙台藩の伊達綱村が建てました。1689年、松尾芭蕉が訪れ、「夏草や兵どもが夢の跡」と詠みます。義経の死から、ちょうど500年でした。
        tone: しみじみ
      - 語り: では、3つの分かれ目の答えを、まとめます。
        hook: true
      - 語り: そして、あの院の言葉に、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも義経が平泉にとどまっていたら
    lines:
      - 語り: もしも義経が、兄の頼朝と戦わず、平泉にとどまっていたら。奥州藤原氏は、滅びなかったのか。
      - 語り: 1つ目。義経が戦わなくても、頼朝の疑いは、官符より前から、ありました。
      - 語り: 2つ目。秀衡が生きていたら、への答えは、記録にありません。ただ、義経をかくまったことが、滅びのもとだったという見方があります。
      - 語り: 3つ目。泰衡は、義経を討っても、許されませんでした。頼朝は、院の「待て」を退けて、攻めたのです。
      - 語り: 記録を並べると、平泉が滅びを避けられた道は、ごく細いものだった、と考えられます。滅びる時期は動いたかもしれませんが、頼朝の方針が変わる手がかりは、ありません。
      # fact: yoshitsune-11, yoshitsune-14
      - 語り: 義経の死から、泰衡の死まで、およそ4か月。院は「弓矢を袋にしまいなさい」と言い、頼朝は、聞きませんでした。
        tone: しみじみ
      # fact: yoshitsune-22
      - 語り: 760年あまりのち、桶から見つかった蓮の種は、1998年に、花を咲かせました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
