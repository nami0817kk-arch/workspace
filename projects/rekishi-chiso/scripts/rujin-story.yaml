  # サムネは別に作る（Gemini の絵に字を載せた1枚。out/rujin-story_thumbnail.png）。ここは check のための仮。

sections:
  # ================================================================ 序章
  - title: 「牢屋も、配給もない」　八丈島に着いた流人
    lines:
      # fact: rujin-39
      - 語り: 島流しにされた八丈島の流人は、牢屋に入れられませんでした。島の村で、島の人と一緒に暮らしたのです。
        tone: 重い
      # fact: rujin-23
      - 語り: その代わり、お上からの食べ物の配給は、ありません。暮らしは、自分まかせでした。
      # fact: rujin-07
      - 語り: 江戸時代から明治の初めまでに、八丈島へ送られた流人の記録は、1887人分。多い年には、287人もの流人が、島にいました。
        card: {head: "八丈島の流人", body: 記録に残るのは1887人}
      - 語り: 牢屋もなく、配給もない島で、流人たちは、どんな毎日を送っていたのか。どこに住み、何を食べ、誰と暮らしたのか。
        tone: 疑問
      # fact: rujin-54
      - 語り: その答えは、島の役所に残った流人の帳面と、1人の流人が書き続けた記録に、残っています。
      - 語り: 江戸を出た船は、まっすぐには、八丈島へ着きませんでした。
        hook: true

  # ================================================================ 第1章 どう送られたのか
  - title: 「どうやって島へ送られたのか」　江戸の牢屋敷から、三宅島の風待ちへ
    lines:
      # fact: rujin-19
      - 語り: 八丈島は、今の東京から、南へ300キロ近く。伊豆諸島の、南の島です。
        figure: {type: map, title: 江戸から八丈島へ, bounds: [136.2, 143.0, 32.6, 36.0], places: [[江戸, 139.78, 35.67], [浦賀, 139.72, 35.24], [三宅島, 139.53, 34.08], [八丈島, 139.79, 33.11]], route: [江戸, 浦賀, 三宅島, 八丈島], upto: 1, note: 伊豆諸島}
      # fact: rujin-08, rujin-17
      - 語り: 記録に残る最初の流人は、関ヶ原で敗れた大名、宇喜多秀家の一行です。1606年に、2人の息子など、13人で島へ渡りました。
      # fact: rujin-09
      - 語り: 東京都公文書館の工藤航平さんの、2019年の報告によると、流人は、江戸の小伝馬町の牢屋敷で、船を待ちました。
      # fact: rujin-30
      - 語り: 江戸を出る前、流人には、幕府から、身分に応じたお金が渡されました。
      # fact: rujin-09
      - 語り: どの島へ送るかは、島割帳という帳面で決められ、行き先は、船が出る前の日に、言い渡されました。
        card: {head: "島割帳", body: 行き先は前の日に言い渡す}
      # fact: rujin-09
      - 語り: 出る日には、牢屋敷の裏門で、伊豆の代官の役人へ。それから、船手番所で、船の役人へと引き渡されます。
      # fact: rujin-10
      - 語り: 船は、品川の沖で風を待ち、浦賀の奉行所で、流人の顔と書類を照らし合わせてから、海へ出ました。
        figure: {type: map, title: 江戸から八丈島へ, bounds: [136.2, 143.0, 32.6, 36.0], places: [[江戸, 139.78, 35.67], [浦賀, 139.72, 35.24], [三宅島, 139.53, 34.08], [八丈島, 139.79, 33.11]], route: [江戸, 浦賀, 三宅島, 八丈島], upto: 2, note: 伊豆諸島}
      # fact: rujin-10
      - 語り: ところが、八丈島へ行く流人も、まず三宅島で、全員が船を降ろされます。
        tone: 疑問
        figure: {type: map, title: 江戸から八丈島へ, bounds: [136.2, 143.0, 32.6, 36.0], places: [[江戸, 139.78, 35.67], [浦賀, 139.72, 35.24], [三宅島, 139.53, 34.08], [八丈島, 139.79, 33.11]], route: [江戸, 浦賀, 三宅島, 八丈島], upto: 3, note: 伊豆諸島}
      # fact: rujin-10
      - 語り: 三宅島と八丈島のあいだには、黒瀬川と呼ばれる、激しい潮の流れがありました。それを越える風を、待たなければならなかったのです。
        card: {head: "黒瀬川", body: 八丈島の手前の激しい潮}
        figure: null
      # fact: rujin-60
      - 語り: 三宅島に上がると、流人1人1人の名簿が作られました。名前と、住んでいた所と、身分と、年と、罪。
      # fact: rujin-60
      - 語り: 武士や僧は、花押という自分の印を書き、庶民は、指の爪で印を押して、間違いがないことを確かめました。
      # fact: rujin-11, rujin-57
      - 語り: 幕末に流された、菅野八郎の例を見てみます。八郎は、陸奥の金原田村の百姓でした。幕府の政治を批判した、自分の書き物が見つかり、安政5年に捕らえられます。
      # fact: rujin-11, rujin-57
      - 語り: 八郎が江戸を出たのは、1860年、万延元年の4月12日。三宅島に着いたのが、4月19日です。
      # fact: rujin-11, rujin-57
      - 語り: そこから、三宅島で待つこと、2か月半ほど。八丈島に着いたのは、7月4日でした。江戸を出てから、3か月近くかかっています。
        card: {head: "菅野八郎の船旅", body: 江戸から3か月近く}
      # fact: rujin-20
      - 語り: 流人を運んだのは、三宅島や新島の船でした。山本さんという研究者が、1961年に、法政史学という雑誌に書いた論文は、ある記録を引いています。
      # fact: rujin-20
      - 語り: 船は500石積みほどで、乗り手は、船頭と船乗りが8人。船の中には、牢が作られていた、とあります。
      # fact: rujin-31
      - 語り: 三宅島で風を待つあいだにも、お金がかかりました。1781年、天明元年に、八丈島へ向かう流人たちが出した書付には、こうあります。
      # fact: rujin-31
      - 語り: 流人のまとめ役への、世話の代金。宿と、水と、薪と、家の代金。浜から荷物を運ぶ代金まで、取られました。寺に仮に泊まれば、朝と夕の飯だけで、1日200文です。
      # fact: rujin-31
      - 語り: 仕送りのない者は、着ている物や持ち物を、お金の代わりに差し出して払い、それも尽きると、島の役人や、百姓の家の門を、朝と夕に回って、食べ物をもらった。まことに、乞食同様の有様だ、と書かれています。
        tone: 重い
      - 語り: そうして、ようやく八丈島に着いた流人は、どこに住むことになったのか。
        hook: true
      - 語り: 伊豆の島々の文書には、くじ、という言葉が出てきます。
        hook: true

  # ================================================================ 第2章 どこに住んだのか
  - title: 「島に着いたら、どこに住んだのか」　くじ引きの村割りと、五人組
    lines:
      # fact: rujin-12, rujin-21
      - 語り: 八丈島の浜に着くと、役人が、江戸からの書類と流人を、1人ずつ照らし合わせます。それから、流人村割帳という帳面で、島の村へと割り振りました。
      # fact: rujin-21
      - 語り: 伊豆の島々の、流人の扱い方を書いた文書には、村の割り振りは、くじを引いて決める、とあります。
        card: {head: "流人の村割り", body: くじを引いて村を決める}
      # fact: rujin-12, rujin-57
      - 語り: 流人は、村の組頭に連れられて、村へ向かいます。菅野八郎は、末吉村に割り当てられ、7月13日、村で掟を言い渡されました。
      # fact: rujin-12, rujin-21
      - 語り: 掟を言い渡されるのは、名主の家や、村の役場です。そして、流人は、村の五人組に預けられました。
      # fact: rujin-39, rujin-32
      - 語り: 流人は、牢屋には入れられず、島の人と、暮らしを共にしました。工藤さんの言葉では、島を抜け出そうとしない限り、ゆるやかな扱いでした。
        card: {head: "流人の扱い", body: 牢屋に入れず島の人と暮らす}
      # fact: rujin-40, rujin-13
      - 語り: ただし、帳面の上では、島の人と、はっきり分けられました。流人在命帳という、流人だけの名簿が、毎年、村ごとに作られたのです。
      # fact: rujin-13
      - 語り: 1814年、文化11年に、この名簿の書き方が改められ、1人1人、いつ流されたのかを、書くようになりました。赦免を調べるときの、元の帳面にもなります。
      # fact: rujin-07
      - 語り: では、流人は、島にどれほどいたのか。東京都八丈支庁の年表によると、1723年、享保8年の島の人は、男が2252人。女が2528人。そこに、流人が157人です。
        figure: {type: bars, title: 享保8年の八丈島（人）, bars: [[島の男, 2252], [島の女, 2528], [流人, 157]], labels: [2252人, 2528人, 157人]}
      # fact: rujin-07
      - 語り: ならすと、島の人の、およそ30人に1人が、流人でした。
      # fact: rujin-07
      - 語り: この年、島の家は629軒。流人の家も、宇喜多の一族の10軒と、ほかの流人の49軒が、数えられています。
        figure: null
      # fact: rujin-07, rujin-36
      - 語り: では、八丈島へ送られた流人は、全部で何人だったのか。工藤さんの報告と、地理学者の千葉徳爾さんの論文は、1635年、寛永12年から、明治4年までに、1887人、と書きます。
        card: {head: "八丈島の流人の数", body: 1635年から1887人}
      # fact: rujin-36
      - 語り: ところが、山本さんの論文は、同じ1887人を、宇喜多秀家が島に着いた、1606年、慶長11年から、数えています。数え始めの年が、29年も違うのです。
        tone: 疑問
        figure: {type: numberline, title: 1887人を数え始めた年, items: [[山本の論文, 1606], [工藤と千葉, 1635]], unit: 年}
      # fact: rujin-36
      - 語り: 千葉さんは、この数には、船の中や三宅島で亡くなった人も入っていて、八丈島に着いたのは、およそ200人少なかった、とみています。
        figure: null
      # fact: rujin-22
      - 語り: 流人の暮らしには、幅がありました。1970年に出た本、江戸時代流人の生活は、島の人と同じか、それ以上に暮らす、家持流人を紹介しています。
      # fact: rujin-22
      - 語り: そして、病気や年寄りで働けず、島の人の情けにすがって生きる、小屋流人です。
        tone: しみじみ
      - 語り: 家を持てるか、小屋で暮らすか。その分かれ目の1つが、食べ物でした。
        hook: true
      - 語り: 流人の食べ物は、毎日、どこから来たのでしょうか。
        hook: true

  # ================================================================ 第3章 何を食べたのか
  - title: 「何を食べていたのか」　草と海藻と、手伝いの魚
    lines:
      # fact: rujin-23
      - 語り: 流人には、扶持と呼ばれる食べ物の支給が、ありません。自分で稼いで食べる、自活が、決まりでした。
        card: {head: "流人の食べ物", body: 支給はなし。自分で稼ぐ}
      # fact: rujin-23
      - 語り: 伊豆の島々の、流人の扱い方には、こうあります。仕事のない流人には、百姓の畑を手伝わせる。それもできない流人は、村の百姓が、順番に養う。
      # fact: rujin-24
      - 語り: 新島の村役場に残る、延享2年の流人への掟には、貧しい流人は、山や野の草と、海藻を食べるように。漁があるときは、浜へ出て手伝い、魚をもらうように、と書かれていました。
      # fact: rujin-24
      - 語り: 八丈島では、どうだったのか。山本さんは、近藤富蔵という流人が書いた、八丈実記の、1834年、天保5年の記録を引いています。冬は、アシタバや、フキノトウのような、野の草を摘んで、命をつないだ、というのです。
        tone: しみじみ
      # fact: rujin-30
      - 語り: 頼りは、故郷の身寄りからの仕送りでした。刃物と、書物と、火の道具のほかは、送ることが許されていました。
      # fact: rujin-30
      - 語り: 新島の帳面では、届いた物は、お金と、お米と、麦と、味噌と、砂糖。着る物や、鍋や、紙と筆も、送られています。
      # fact: rujin-30
      - 語り: けれど、山本さんによると、仕送りを受けられたのは、僧や武士、一部の百姓や町人だけ。多くの流人には、ほとんど縁がありませんでした。
      # fact: rujin-34
      - 語り: 届き続けた例もあります。岡山県の紹介によると、宇喜多の一族には、秀家の妻の実家、加賀の前田家から、1年おきに、白米70俵と、お金35両などが、送られ続けました。
      - 語り: 島の暮らしそのものを変えたのは、1つの作物でした。
      # fact: rujin-25
      - 語り: サツマイモが初めて島に来たのは、1723年、享保8年。けれど、作り方がよくなかったため、広まりませんでした。
      # fact: rujin-25
      - 語り: 島にサツマイモを広めたのは、流人ではありません。大賀郷の名主、菊池秀右衛門です。1811年、文化8年に、新島から、赤いサツマイモの種いもを持ち帰りました。
        card: {head: "1811年", body: 名主がいもを広める}
      # fact: rujin-25
      - 語り: 八丈実記によれば、40年ののちには、島じゅうに広がり、島が始まって以来の苦しみを、初めて忘れた、と書かれています。
        tone: しみじみ
      - 語り: その苦しみは、島の寺の帳面に、残っています。
        hook: true
      - 語り: そこには、餓死、という文字が、何度も出てきます。
        hook: true

  # ================================================================ 第4章 飢饉
  - title: 「飢饉の年は、どうなったのか」　過去帳に残る「餓死」
    lines:
      # fact: rujin-27
      - 語り: 千葉さんは、1980年の論文で、島の寺に残る、村ごとの過去帳から、亡くなった人の数を、年ごと、月ごとに数えました。
      # fact: rujin-27
      - 語り: 1691年、元禄4年から6年には、島に鼠が渡ってきて、畑を荒らしました。八丈島の隣の小島、鳥打村の過去帳では、この3年のあいだに、53人が亡くなっています。前後の年は、1年に5人から12人ほどでした。
      # fact: rujin-27
      - 語り: 元禄13年から14年の、末吉村の過去帳には、この年、餓死人、過半これあり、と書かれています。餓死した人が、大勢を占めた、という書き方です。
        tone: 重い
      # fact: rujin-27
      - 語り: 亡くなる人は、収穫の終わった11月から増えていきます。11月は8人。12月は9人。1月は14人。2月は16人。
        figure: {type: bars, title: 末吉村の過去帳の死者（人）, bars: [[11月, 8], [12月, 9], [1月, 14], [2月, 16], [3月, 10]], labels: [8人, 9人, 14人, 16人, 10人]}
      # fact: rujin-27
      - 語り: 3月になって、ようやく減り始めます。山や野の草が、食べられるようになったからだろう、と千葉さんは見ています。
        figure: {type: bars, title: 末吉村の過去帳の死者（人）, bars: [[11月, 8], [12月, 9], [1月, 14], [2月, 16], [3月, 10]], labels: [8人, 9人, 14人, 16人, 10人]}
      # fact: rujin-26
      - 語り: 樫立村の過去帳の、1767年、明和4年の記録の終わりには、こう書かれています。以上、106人が、餓死で死んだ。
        tone: 重い
        card: {head: "明和4年 樫立村の過去帳", body: 右百六人餓死ニ而死ル也}
        figure: null
      # fact: rujin-29
      - 語り: 1832年、天保3年には、中之郷村で、1年に114人が亡くなっています。この村の記録で、最も多い年です。
      # fact: rujin-26
      - 語り: ただ、千葉さんの調べは、島の人と流人を、分けて数えていません。飢饉で、流人が何人亡くなったのかは、分かっていないのです。
      # fact: rujin-24
      - 語り: 千葉さんによると、島の人は、ふだん牛の肉を食べません。牛は、大切に飼われていました。それでも、飢饉の年には、放牧の牛を捕らえて、食べることもあった、といいます。
      # fact: rujin-28
      - 語り: 飢饉のあと、人を減らすため、島の人が島を出ることも認められました。1771年、明和8年に111人。そのあと数年で、合わせて191人が、島を出て、本土へ移っています。
      # fact: rujin-33, rujin-58
      - 語り: 島では、飢饉に備えて、穀物で酒を造ることが禁じられていた、と伝わります。
      - 語り: その酒を、米を使わずに造る方法を、1人の流人が、島に持ち込みます。
        hook: true
      - 語り: 流人は、ただ養われるだけの人では、ありませんでした。
        hook: true

  # ================================================================ 第5章 仕事
  - title: 「流人は、どんな仕事をしたのか」　いも焼酎と、流人が残した記録
    lines:
      # fact: rujin-32
      - 語り: 工藤さんによると、八丈島へ送られた流人には、武士や、僧や、学のある人が多く、新しい知識や技を運ぶ人として、島で歓迎もされました。
      # fact: rujin-32
      - 語り: 島の役所や村では、読み書きと計算の得意な流人を、書記として雇うことが、多かったといいます。
        card: {head: "流人の仕事", body: 島役所や村役場の書記}
      # fact: rujin-33, rujin-58
      - 語り: 1853年、嘉永6年。薩摩の商人、丹宗庄右衛門が、密かな交易の罪で、八丈島へ流されてきます。
      # fact: rujin-33, rujin-58
      - 語り: 東京国税局の資料によると、丹宗は、サツマイモで焼酎を造る方法を、島の人に教えました。
        card: {head: "1853年", body: 流人がいも焼酎を伝える}
      # fact: rujin-33
      - 語り: 八丈実記は、米を1粒も使わずに造れて、農家に、大きな益があった、と書いています。今の八丈島の島酒は、ここから始まったとされます。
      # fact: rujin-47
      - 語り: 菅野八郎は、島の人に頼まれて、養蚕のやり方を、書き残しました。青野誠さんが、2021年の論文で、取り上げています。
      # fact: rujin-48
      - 語り: 樫立の手踊りと呼ばれる踊りは、流人や、島に流れ着いた人、江戸との船の乗り手たちが伝えた、各地の盆踊りをまとめたもの、といわれます。今も、お盆に踊り継がれています。
      # fact: rujin-59
      - 語り: 飛騨を治める幕府の役人、郡代だった大原正純が流されたときは、息子の正矩が、14歳で、自分から願って島へ渡り、およそ10年、父に付き添いました。
        tone: しみじみ
      # fact: rujin-59
      - 語り: 正矩は、その見聞を、八丈誌という本にまとめています。島の言葉では、流人を、ヅニン、と言った、と書き留めました。
        card: {head: "八丈誌", body: 島の言葉で流人はヅニン}
      # fact: rujin-51, rujin-03
      - 語り: そして、いちばん多くを書き残した流人が、近藤富蔵です。北方の探検で名を残した、近藤重蔵の長男でした。
      # fact: rujin-51
      - 語り: 富蔵は、1826年、文政9年に、隣の家との争いで、人をあやめ、翌年、八丈島へ流されました。
        tone: 重い
      # fact: rujin-32
      - 語り: 島では、仏像や肖像を木で彫り、島の旧家の系図を整えて、暮らしの足しにしました。
      # fact: rujin-52, rujin-53
      - 語り: そして、島の歴史と暮らしを、書き続けます。それが、ここまで何度も出てきた、八丈実記です。その一部は、今も、東京都公文書館に残っています。
        card: {head: "八丈実記", body: 富蔵が書いた島の記録}
      - 語り: その富蔵は、島で、ある女性と、家族になりました。
        hook: true
      - 語り: けれど、流人が妻をめとることは、許されていませんでした。
        hook: true

  # ================================================================ 第6章 水汲み女
  - title: 「水汲み女と、流人の子どもたち」　禁じた掟と、許したという記録
    lines:
      # fact: rujin-35, rujin-38
      - 語り: 流人と暮らす島の女は、水汲み女と呼ばれました。
        card: {head: "水汲み女", body: 流人と暮らした島の女}
      # fact: rujin-35
      - 語り: 山本さんの論文は、水汲み女を、流人の事実上の妻、と書いています。
      # fact: rujin-35
      - 語り: 伊豆の島々で流人に言い渡された掟は、残っているもののほとんど全てが、水汲み女を置くことを、きびしく禁じていました。
      # fact: rujin-35
      - 語り: ところが、近藤富蔵は、八丈実記に、別のことを書いています。島根大学の松尾寿さんが、1991年の論文で引いた一節です。
      # fact: rujin-35
      - 語り: 慶長のむかし、地元の代官だった奥山氏が、水汲みと名付けて、流人に、女と暮らすことを許した。それで、乱れることが少なくなった。
        tone: しみじみ
        card: {head: "八丈実記", body: 代官が水汲みの名で許した}
      # fact: rujin-35
      - 語り: 禁じた掟と、許したという記録。2つの書き方は、食い違っています。
        tone: 疑問
      # fact: rujin-35
      - 語り: 富蔵は、こうも書きます。妻を得れば、男は仕事に励み、女は、山に入り、浜に出て、食べ物を求めて暮らす。
      # fact: rujin-35
      - 語り: ところが、島の人が、流人の水汲み女を禁じてほしいと、役所に願い出て、認められたこともありました。理由は、子どもが生まれて、食べ物が足りなくなる、というものでした。
        tone: 重い
      # fact: rujin-35
      - 語り: 1766年、明和3年には、島に、流人の子どもが、63人いた、と記録されています。
      # fact: rujin-57
      - 語り: 菅野八郎は、島に着いた年の10月に、島の娘のもとへ、婿に入りました。
      # fact: rujin-03
      - 語り: 近藤富蔵は、島の百姓の娘、イツと結婚し、1人の男の子と、2人の女の子をもうけています。イツは、宇喜多秀家の一族の、末の人でした。
        tone: しみじみ
      # fact: rujin-37
      - 語り: では、流人が許されて島を出るとき、妻と子は、どうなったのか。工藤さんは、水汲み女や、島で生まれた子を、自由に連れて行けるようになったのは、1869年、明治2年からだ、といわれる、と書いています。
        tone: 重い
      # fact: rujin-35
      - 語り: 一方、富蔵の八丈実記には、許されたあと、故郷へ妻と子を呼び寄せたいと願い出れば、すぐに聞き届けられた、とあります。工藤さんの書き方とは、食い違うようにも読めます。
      # fact: rujin-37
      - 語り: 妻と子を連れて島を出たい、と願い出た流人も、いました。
      - 語り: 家族を島に置いたまま、帰る日を待つ流人もいました。
        hook: true
      - 語り: そして、待ちきれずに、海へ出た者もいたのです。
        hook: true

  # ================================================================ 第7章 島抜け
  - title: 「逃げた者は、どうなったのか」　島抜けと、天保9年の漁船
    lines:
      # fact: rujin-14
      - 語り: 島流しの刑には、期限がありません。島を出られるのは、罪を許される赦免か、逃げ出す、島抜けだけでした。
        card: {head: "島流しの刑", body: 期限なし。赦免か島抜けか}
      # fact: rujin-42
      - 語り: 島抜けは、捕まれば、死罪です。三宅島に残る流人の帳面には、罪の下に、赤い字で、嶋抜、と書き込まれた例があります。
        tone: 重い
      # fact: rujin-41
      - 語り: 島の中では、盗みや、ばくち、けんかの事件も起き、島の役人が、取り調べて決めました。島抜けにかかわる書類を綴じた帳面も、伝わっています。
      # fact: rujin-57
      - 語り: 菅野八郎が島に着いた、1860年の10月10日。流人の逃亡が発覚し、27人が処刑されました。利右衛門騒動と呼ばれる事件です。
        tone: 重い
        card: {head: "1860年10月", body: 流人27人が処刑される}
      # fact: rujin-43
      - 語り: 逃げ切った者も、いました。下総の佐原の博徒、喜三郎です。1836年、天保7年の、関東のばくち打ちの一斉の取り締まりで捕まり、八丈島へ流されました。
      # fact: rujin-44
      - 語り: 1838年、天保9年の7月、喜三郎たちは、漁船を盗んで島を出て、常陸の鹿島の浜に着いた、と伝わります。
        figure: {type: map, title: 喜三郎の島抜け, bounds: [136.6, 143.4, 32.7, 36.3], places: [[八丈島, 139.79, 33.11], [鹿島, 140.65, 35.95], [江戸, 139.78, 35.67]], route: [八丈島, 鹿島], upto: 2, note: 天保9年}
      # fact: rujin-43
      - 語り: けれど、喜三郎は、江戸で、ふたたび捕まります。
        figure: null
      # fact: rujin-43, rujin-45
      - 語り: 牢の中で、喜三郎は、島抜けの記録を書き残しました。その記録は、今、史料集に活字で収められています。
        card: {head: "朝日逆島記", body: 喜三郎が牢の中で書いた記録}
      # fact: rujin-43
      - 語り: 喜三郎は、死罪にはならず、のちに、江戸から十里四方への立ち入りを禁じる、追放となりました。
      # fact: rujin-46
      - 語り: その話は、のちに、落語や小説にもなりました。けれど、その筋は、記録どおりとは限りません。
      - 語り: 逃げずに島に残った者には、何が待っていたのか。
        hook: true
      - 語り: 赦免の知らせは、いつ来るか、分かりませんでした。
        hook: true

  # ================================================================ 第8章 帰れたのか
  - title: 「島から帰れたのか」　赦免を待つ日々と、帰らなかった流人
    lines:
      # fact: rujin-14
      - 語り: 赦免には、身内が願い出る道と、将軍家の祝いごとなどのときに、まとめて許される、大赦の道がありました。
      # fact: rujin-15
      - 語り: 菅野八郎の赦免は、1862年、文久2年の12月に、話し合いが始まり、決まったのは、その1年8か月後、元治元年の8月でした。
      # fact: rujin-11
      - 語り: 9月10日、八丈島を出た船は、9月13日に、江戸の鉄砲洲に着きました。行きは3か月近くかかった道のりが、帰りは3日でした。
        tone: しみじみ
        card: {head: "菅野八郎の帰り", body: 八丈島から江戸まで3日}
      # fact: rujin-14
      - 語り: ただ、帰りの船は、便の数も、出る時期も、限られていました。病気のため、帰りの船に乗るのを辞退した流人も、いました。
      # fact: rujin-50, rujin-18
      - 語り: 間に合わなかった者もいます。神道の学者、梅辻規清は、1861年、文久元年、赦免の使いが着くのを待たずに、中之郷の流された先で、亡くなりました。
        tone: 重い
      # fact: rujin-50
      - 語り: 菅野八郎は、島で、規清に会っています。つきあいは1年に満たなかったけれど、八郎は大きな影響を受けた、と、思想史の研究者、青野誠さんは見ています。
      # fact: rujin-18
      - 語り: 島には、御赦免花と呼ばれる花があります。無実を訴えて亡くなった僧、慈運法印の墓に花が咲くと、必ず赦免状が届く。そう言われるようになった、と八丈町は紹介しています。
      # fact: rujin-16
      - 語り: 1868年、明治元年には、大勢の流人が許されました。それでも、その大赦から漏れて、島に残る流人が、多くいました。
      # fact: rujin-16
      - 語り: 長く島で暮らして、本土へ戻らず、島に籍を入れて、島の人になる者も、いました。
      # fact: rujin-17, rujin-34
      - 語り: 宇喜多秀家の一族が許されたのは、1869年、明治2年。最初の一行が島へ渡ってから、260年あまりが、たっていました。
        card: {head: "1869年", body: 宇喜多の一族が赦免される}
      # fact: rujin-03, rujin-51
      - 語り: 近藤富蔵が許されたのは、1880年、明治13年。島へ流されてから、53年が、たっていました。
        tone: しみじみ
      # fact: rujin-03
      - 語り: 東京都公文書館の西木浩一さんによると、富蔵には、戸籍がありませんでした。流されているあいだに、今の戸籍の仕組みが始まったからです。富蔵は、東京の娘の戸籍に、入りました。
      # fact: rujin-03
      - 語り: 許された翌々年、明治15年に、富蔵は、八丈島へ戻ります。西木さんは、自分から戻った、と書いています。そして、1887年、明治20年に、島で亡くなりました。
        tone: しみじみ
      # fact: rujin-52
      - 語り: その年、東京府が、富蔵の家から、八丈実記を買い上げました。69冊のうちの29冊です。今は綴じ直されて、36冊になっています。
        card: {head: "八丈実記", body: 東京都公文書館に36冊}
      - 語り: 流人が書いた暮らしの記録は、こうして、島の外へ残ることになりました。
        hook: true
      - 語り: その記録から見えた流人の毎日を、最後に、振り返ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：八丈島の流人は、どう暮らしたのか
    lines:
      - 語り: 八丈島の流人は、どう暮らしたのか。
        tone: 疑問
      - 語り: 牢屋には入れられず、くじで村を割り振られ、五人組に預けられました。配給はなく、草と海藻と、手伝いの魚で、食いつなぎました。
      - 語り: 仕送りのある者と、ない者で、暮らしは分かれました。焼酎の造り方を伝える者、記録を書き残す者、島の女と家族になる者もいました。
      - 語り: そして、期限のない刑の中で、赦免を待ち続けました。帰った者も、帰れなかった者も、帰らなかった者も、いました。
        tone: しみじみ
      - 語り: 牢屋も、配給もない島。何もかも自分まかせの毎日を、流人たちは、島の人のあいだで、送っていたのです。
        tone: しみじみ
      - 語り: その毎日は、島の役所の帳面と、1人の流人が書き続けた記録に、今も残っています。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
