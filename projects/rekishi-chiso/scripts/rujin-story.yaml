# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  島流しにされた八丈島の流人は、島の牢屋に閉じ込められたのではありませんでした。島の村に割り振られ、島の人と同じ村で暮らしました。
  その代わり、お上からの食べ物の配給はありません。自分で食べていけ、というのが決まりでした。
  江戸から300キロ近く離れた島で、流人たちはどんな毎日を送っていたのか。島役所に残った流人の帳面と、流人が書いた記録でたどります。
  この動画でわかること
  ・流人はどうやって島へ送られたのか（三宅島での風待ち）
  ・島に着いた流人は、どこに住み、誰に預けられたのか
  ・何を食べていたのか、飢饉の年はどうなったのか
  ・流人の仕事と、島に残したもの（焼酎の造り方ほか）
  ・水汲み女と呼ばれた島の女性と、流人の子どもたち
  ・島抜けと、赦免を待つ日々、帰らなかった流人
description_note: |-
  この動画に、想像の台詞や作った話はありません。記録の言葉は、研究で引かれた史料から取り、今の言葉にして読んでいます。
  おもな出どころ：工藤航平「八丈島流人アーカイブズの概要調査報告」（東京都公文書館 調査研究年報 第5号、2019）、山本清司「関東幕領に於ける遠島刑」（法政史学 第14号、1961）、千葉徳爾「近世中・後期 八丈島及び同小島の地域別死亡者数の分析」（東北地理 32巻4号、1980）、松尾寿「流人の結婚について」（山陰地域研究 第7号、1991）、西木浩一（東京都公文書館 調査研究年報、2025）、小粥祐子（同、2019）、東京都公文書館「所蔵資料を読む」（2024）、東京都八丈支庁『八丈島 事業概要』、岡山県東京事務所、東京国税局「島酒」、東京都教育委員会の文化財の一覧、青野誠（日本思想史学 53、2021）、コトバンク（日本人名大辞典）ほか。
  流人の数・島の人口は、資料によって違います。月日は当時の暦のものです。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "Hachijo Island Exiles Weren't in Prison? Their Daily Life Was More 'On Their Own' Than You'd Think"
  description: |-
    The exiles sent to Hachijo Island in the Edo period were not locked in a prison. They were assigned to the island's villages and lived among the islanders.
    But the government gave them no food. They had to feed themselves.
    How did the exiles live on an island nearly 300 km from Edo? We follow them through the island office's records and an exile's own writings.
    In this video you will learn:
    - How exiles were shipped to the island (waiting for the wind on Miyake Island)
    - Where they lived and who was responsible for them
    - What they ate, and what happened in famine years
    - Their work, and what they left the island (including how to make shochu)
    - The island women called "mizukumi-onna" and the exiles' children
    - Escapes, waiting for a pardon, and the exiles who never went home
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "No Prison, and No Food"
    - "How Were They Sent to the Island?"
    - "Where Did They Live?"
    - "What Did They Eat?"
    - "Famine Years"
    - "What Work Did They Do?"
    - "The Mizukumi Women and the Children"
    - "Escape from the Island"
    - "Could They Go Home?"
    - "Summary: How the Exiles Lived"

