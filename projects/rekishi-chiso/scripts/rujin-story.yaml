# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と choujou-story.yaml・nagaya-if-story.yaml の型）。八丈島の流人の暮らし。2026-11-26 作成。
# 公開の予定は 11/30 12:00（12時枠）。型は docs/story-main.md「00. 伸びる型」の E 暮らし型（ユーザーの○済み）。主語は「八丈島の流人」という1つの役目で、最後まで主役。
#   誰でも持つ像＝島流しは、島の牢に閉じ込められる罰。裏返す一点＝牢には入れられず、島の村で島の人と暮らした。その代わり、お上は食べ物を配らない（自活）。
#   問い＝「八丈島の流人は、どんな毎日を送っていたのか」。答え＝くじ引きで村に割り振られ、五人組に預けられ、草と海藻と手伝いの魚で食いつなぎ、
#   仕送りのある者とない者で暮らしが分かれた。書記や木彫り・焼酎の造り方で島に役立つ者もいた。水汲み女と暮らし、子をもうけた。逃げれば死罪。刑に期限はなく、赦免を待つ。
# 宇喜多秀家はショート・hideyori-if・sekigahara-map-story で既出。秀家だけの話にしない（最初の流人・数え始めの年・前田家の仕送り・富蔵の妻イツ・一族の赦免だけ）。
# 想像の台詞なし。記録の言葉は語りで「〜には、こうあります」と言ってから読む（roles を足さない＝config.yaml を変えない）。語りは剣崎1人。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/八丈島の流人の暮らし_facts_20261126.yaml、rujin-07〜62。担当A=送られ方と数字・B=住まいと食と飢饉・C=水汲み女と島抜け・D=人物と記録）にあるものだけ。
#   rujin-01・02・04〜06（道具の --fact の仮カード）は出どころが無いので使わない（rujin-03 は道具が富蔵の出どころをまとめたカードなので使う）。おもな出どころは工藤航平 2019（東京都公文書館 調査研究年報5、本文を読んだ）・
#   山本清司 1961（法政史学14、本文）・千葉徳爾 1980（東北地理32-4、本文）・松尾寿 1991（山陰地域研究7、本文）・東京都八丈支庁 事業概要・西木浩一 2025・小粥祐子 2019・岡山県・東京国税局。
# 記録の食い違い（並べたもの3つ）：
#   ①流人の数の数え始め（工藤 2019・千葉 1980：1,887人を寛永12年＝1635年から／山本 1961：同じ1,887人を慶長11年＝1606年から）。第2章。
#   ②水汲み女（伊豆の島々の「流人申渡書」はほとんど全部が禁じる＝山本、例は新島の延享2年の条目／富蔵は『八丈実記』に、慶長のむかし地代官の奥山氏が「水汲」と名付けて許した、と書く＝松尾が引く）。第6章。
#   ③赦免のとき妻子を連れて帰れた時期（工藤：明治2年以降といわれる／『八丈実記』：赦免の後に望めば本国へ妻子を呼び出すことを聞き届けた＝松尾が引く）。第6章。
#   並べなかった食い違い：安永3年の島の人口（実記4,946人／大概書5,183人。11-26 流れの点検で流人の話から外れるので外した）、享保の戸数629の年（八丈支庁 享保8年／千葉 享保14年）、ハンスいもの年（碑 文政5年／実記 文化9年）、富蔵の罪の書き方、喜三郎の島抜けの人数、『八丈実記』の冊数。
#   担当Bの「明和の飢饉で約900人減（千葉）」は、千葉の本文では享保14年→宝暦3年の減りで明和ではない（11-26 本文で確かめた）。使わない。
# 自分で計算した数（全部計算し直した）：
#   1606→1655＝49年→「50年近く」。1606→1869＝263年→「260年あまり」。1635→1871＝236年（千葉の「236年間」と合う）。1606→1871＝265年。
#   享保8年：流人105＋宇喜多の流人52＝157人。男2,252＋女2,528＝4,780人。157÷(4,780＋157)＝3.2%→「島の人のおよそ30人に1人」（4,937÷157＝31.4）。
#   菅野八郎：4月12日江戸→4月19日三宅島（7日）→7月4日八丈島（4月19日から2か月半ほど。江戸からは3か月近く）。帰り 9月10日→9月13日（3日）。
#   赦免の検討 文久2年12月→決定 文久4年8月＝1年8か月。
#   安永3年 5,183−4,946＝237人。
#   近藤富蔵：1805年生まれ・1827年に流される（数え23歳／満21〜22歳。語りでは年を言わない）。1827→1880＝53年。1880年赦免、翌々年＝1882年に島へ戻り、1887年に島で没（数え83歳。語りでは言わない）。
#   『八丈実記』 69冊のうち29冊を買い上げ→綴じ直して36冊。
#   出百姓 111＋45＋10＋25＝191人。
# 確かめられなかったこと（台本では言わない）：罪の内訳と女の流人の数、流人船が年に何回出たか、明治元年に赦免された人数、島で死んだ流人の総数、
#   飢饉で死んだ流人だけの数（過去帳は島民と分けていない）、手習いを教えた流人の八丈島の例、宇喜多の握り飯の逸話、島抜けの件数（25件・15回の説は出典なし）、花鳥の年齢。
# 絵：AI 絵（Gemini。一覧は scripts/story/rujin_main_look.yaml の頭）だけ。実在の人物の顔は描かない。字・紋は描かない。
