# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。生類憐みの令は、本当に悪法だったのか（徳川綱吉・1685〜1709年と、のちの評価）。2026-11-16 作成。公開の予定は 11/21 12:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（日本史・江戸前期）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「生類憐みの令は、本当に悪法だったのか」。主役は法令（触れ）そのもの。綱吉は法令を出した人として出すが、顔は絵にしない。
#   冒頭＝「犬の悪法と習う触れに、捨て子を育てよ・病気の旅人を追い出すな、が入っていた」＋「一方で犬を斬った町人は首をさらされた」＋「10万頭の犬小屋」。答えの席＝悪法と言えるのか・言えないのか。
#   型の作り：序章 触れの意外な中身／第1章 犬公方と呼ばれた将軍／第2章 中野の犬小屋／第3章 犬だけではなかった触れ／第4章 罰せられた人々／第5章 悪評の出どころ／第6章 綱吉の死と廃止／第7章 研究と教科書／まとめ。
# 記録の食い違い：①中野の犬小屋の広さと頭数（徳川実紀の16万坪・10万頭／根崎の20万坪超／中野区の約30万坪・数万〜30万頭）
#   ②「戌年だから犬を」の出どころ（『三王外記』・ケンペル『日本誌』）と、1930年の本の「前の世の殺生の罪」の言い方、隆光の江戸入り（1686）と最初の触れ（1685）の前後
#   ③辞典の評価（塚本学＝政策として再評価／辻達也＝虐政）。
# 計算（自分で計算し直した）：綱吉の生年1646（正保3）・将軍1680〜1709＝29年／触れ1685〜1709＝24年／中野の犬小屋1695〜1709＝足かけ15年（中野区の「15年間」と合う）／
#   16万坪×3.306㎡＝約52.9万㎡＝約53ヘクタール（東京ドーム4.68ヘクタールの約11個分）／30万坪＝約99ヘクタール（区の「約100ha」と合う）／
#   病馬の流罪 1689年 14人＋25人＝39人／綱吉の死 正月10日→鳥を放す 正月20日＝10日後／隆光の江戸入り1686−最初の触れ1685＝1年あと／
#   ケンペルの江戸参府 1691・1692／『日本誌』1727／塚本1983→2026＝43年前／教科書1967→2021＝54年。
# 事実は事実カード（dev/output/rekishi-chiso/research/生類憐みの令_facts_20261116.yaml、shorui-04〜37）にあるものだけ。行の上に `# fact: shorui-xx`。
#   shorui-06 には、Agent A の「広さ・頭数・餌・費用・負担した人」のカードが重複としてまとめられている（出どころは同じ YAML の sources）。
#   使わないこと：処罰「69件・うち死罪13件」（原典未確認）・蚊を叩いて流罪などの逸話・犬扶持の額・四谷の坪数・大久保の2万3000坪・隆光の「前世」の話を史実として言うこと・
#   犬小屋の犬の処分の細部・122億円の換算・『三王外記』の成立年・「犬公方」を最初に誰が言ったか・綱吉の享年。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
