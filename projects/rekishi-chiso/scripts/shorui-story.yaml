  # サムネは別に作る（out/shorui-story_thumbnail.png）。この欄は check のための仮。

sections:
  # ================================================================ 序章。答えの席：本当に悪法だったのか
  - title: 犬の悪法？　中野の10万頭と、捨て子の触れ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1687
    lines:
      # fact: shorui-29
      - 語り: 犬を大事にしすぎた悪法。そう習う、生類憐みの令の中に、こんな幕府の命令、触れがあります。捨て子を見つけたら、その土地の者が育てよ。
        tone: 重い
      # fact: shorui-13
      - 語り: その一方で、江戸の本所では、犬を斬った町人が、首をさらされました。訴え出た者には、金30両が渡されています。
        tone: 重い
      # fact: shorui-06
      - 語り: そして江戸の西の中野には、まもなく《10万頭》に及ぶといわれた、犬の囲いが造られました。
      - 語り: 人を救う触れと、犬のための重い罰。生類憐みの令は、本当に、悪法だったのか。悪い評判の出どころを、意外な書き手までたどると、答えが見えてきます。
        tone: 疑問
      # fact: shorui-31
      - 語り: 宿で病気になった一人旅の者を、次の宿へ送り出してはならない。薬を飲ませ、奉行に知らせよ。これも、同じ触れの仲間です。
      # fact: shorui-25
      - 語り: じつは、生類憐みの令という名前の法は、《1本もありません》。生き物を憐れむ、いくつもの触れを、まとめて、そう呼んでいるのです。
      # fact: shorui-19, shorui-21
      - 語り: その始まりは、ある将軍が生まれた年の、干支だと言われてきました。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 犬公方と呼ばれた将軍
  - title: 犬公方と呼ばれた将軍　1680年、綱吉
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1680
    lines:
      # fact: shorui-22
      - 語り: 触れを出したのは、5代将軍、徳川綱吉です。1646年、正保3年の正月の生まれ。この年は、戌年でした。
        year: 1646
      # fact: shorui-26
      - 語り: 1680年に将軍になり、亡くなるまでの、30年近く。生き物を憐れむ触れは、1685年からとする本が多く、そこから数えて約24年、出され続けました。
        year: 1680
      # fact: shorui-23
      - 語り: 人々は、綱吉を、犬公方とからかった、と教科書は書きます。犬の将軍、という意味です。
      # fact: shorui-36
      - 語り: 1967年の山川出版社の高校の教科書は、こう書きました。違反した者を厳しく罰し、多くの人々を苦しめた、と。
        tone: 重い
      # fact: shorui-26
      - 語り: 触れの数は、一般に135回といわれる、と、生き物と人の歴史を研究する溝口元と高山晴子の論文にあります。
      - 語り: 犬公方の名を、いちばんよく表しているのが、江戸の西に造られた、犬の囲いでした。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 中野の犬小屋
  - title: 中野の犬小屋　1695年、10万頭の囲い
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1695
    lines:
      # fact: shorui-06
      - 語り: 1695年、元禄8年の5月。幕府は、四谷と大久保に、犬の小屋を造りました。
        year: 1695
      # fact: shorui-06
      - 語り: そして、同じ年の10月29日、中野の犬小屋ができあがります。11月13日には、江戸の町の犬を、送り込み始めました。
      # fact: shorui-06
      - 語り: 広さは、幕府の記録『徳川実紀』では、16万坪。今の単位で、約53ヘクタール。東京ドーム、約11個分です。
        tone: 重い
      # fact: shorui-06
      - 語り: ところが、広さは、記録で割れます。江戸の犬と鷹の政策を調べた、法政大学の根崎光男の研究では、翌年に20万坪を超えた。中野区の案内では、約30万坪。『徳川実紀』の、ほぼ倍です。
        figure: {type: stats, title: 中野の犬小屋の広さ、出どころで割れる, items: [[徳川実紀, 16万坪, 1695年の記事], [根崎光男の研究, 20万坪超, 翌年に広げた], [中野区の案内, 約30万坪, 約100ヘクタール]], upto: 3}
      # fact: shorui-06
      - 語り: 頭数も、割れています。『徳川実紀』は、まもなく10万頭に及ぶといわれた、と書きます。5万匹、8万匹という記録もあり、中野区の案内には、数万から30万頭、とあります。
        figure: null
      # fact: shorui-06
      - 語り: 根崎の研究では、餌の費用は、1年で、金9万8000両あまり。犬小屋を保つ費用は、すべて江戸の町人から集めた、としています。ほかの本には、江戸の周りの農民も負担した、とあります。
        tone: 重い
      # fact: shorui-07
      - 語り: 犬は、村にも預けられました。預かった村人には、御犬養育金というお金が出ます。中野村では、8割を超える村人が、犬を預かったといいます。
      # fact: shorui-07
      - 語り: 宝永5年、1708年には、1頭につき金1分、あわせて43両1分が、中野の村人に渡されています。
      # fact: shorui-09
      - 語り: 犬小屋があったのは、今のJR中野駅の北から南にかけて。中野4丁目あたりの、囲町という古い町の名は、この囲いから来ています。
      # fact: shorui-10
      - 語り: 1991年には、当時の中野区役所の横に、犬の像が5体、置かれました。
      - 語り: これほどの犬の囲い。けれど、触れの束を開くと、犬の話は、その一部でしかありません。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 犬だけではなかった触れ
  - title: 1687年、捨て子を育てよ　犬だけではなかった触れ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1685
    lines:
      # fact: shorui-27
      - 語り: 最初の触れとして、よく挙げられるのは、1685年7月のものです。将軍が出かける道に、犬や猫が出てきても、かまわない。つないでおかなくてよい。
        year: 1685
      # fact: shorui-27
      - 語り: ところが、その触れには、先にも命じたように、と書かれています。これより前にも、触れがあったことになります。
      # fact: shorui-32
      - 語り: 同じ年の11月には、将軍の台所で、鳥と貝と海老を使うことを、やめさせました。
      # fact: shorui-28
      - 語り: 1687年の正月28日。奉公人を世話する宿や、牛馬の宿で、重い病にかかった者を、死ぬ前に捨てることを、禁じました。《生類》という言葉には、人も入っていたのです。
        year: 1687
        tone: 重い
      # fact: shorui-29
      - 語り: 同じ年の4月11日、捨て子の触れが出ます。届け出なくてよいから、その土地の者が育てるか、育てたい者に渡せ。
      # fact: shorui-29
      - 語り: 1690年には、捨て子を、あらためて禁じました。育てられないときは、主人や代官、名主に申し出よ、と。捨て子の触れは、その後も、1704年まで何度も出ています。
        year: 1690
      # fact: shorui-31
      - 語り: 1688年には、牢屋の中で死ぬ人が多いとして、風が通る格子をつけ、月に5回、湯に入れるよう命じました。同じ年の10月には、病気の旅人の触れが出ます。
        year: 1688
      # fact: shorui-30
      - 語り: 牛と馬も、守る相手でした。病気の牛馬を、生きたまま捨ててはならない。養えなければ、代官に申し出よ。
      # fact: shorui-32
      - 語り: 魚と鳥も、対象です。1687年には、食べるために魚や鳥を飼って売ることを禁じ、1693年には、釣り船を禁じました。
      # fact: shorui-32
      - 語り: 1700年には、鰻とどじょうを、生きたまま売り買いすることも、禁じています。
      # fact: shorui-33
      - 語り: 山川出版社の大人向けの日本史の本は、こう書きます。法の対象は、捨て子や、道で倒れた病人、囚人など、弱い立場の人にも及んだ、と。
        figure: {type: stats, title: 犬だけではなかった触れ, items: [[捨て子, 育てよ, 1687年], [重い病の者, 捨てるな, 1687年・人も牛馬も], [病気の旅人, 追い出すな, 1688年]], upto: 3}
      - 語り: 人を救う触れも、たしかにあった。では、罰のほうは、どれほど重かったのか。
        tone: 疑問
        figure: null
        hook: true

  # ================================================================ 第4章 罰せられた人々
  - title: 罰せられた人々　1687年、病馬を捨てた村
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1687
    lines:
      # fact: shorui-30
      - 語り: 1687年4月9日。『徳川実紀』によれば、病気の馬を荒れ地に捨てた10人が、遠くへ流されました。
        year: 1687
        tone: 重い
      # fact: shorui-15
      - 語り: 2日後の触れは、武蔵の国の、寺尾村と大場村の件を挙げて、死罪にもできるが、このたびはまず流罪にした、と告げています。
      # fact: shorui-15
      - 語り: 根崎光男は、2005年の論文で、これを、生き物を憐れむという名目での、早い時期の罰として取り上げています。
      # fact: shorui-30
      - 語り: 1689年には、病気の馬を捨てたとして、大名や旗本の家来14人と、農民25人、あわせて《39人》が、伊豆の神津島へ流されています。
        tone: 重い
      # fact: shorui-14
      - 語り: 罰は、将軍の家来にも及びました。1694年、将軍を警護する書院番の旗本、鈴木重信は、放れて来た馬の扱いを怠ったとして、外出を控える罰を受けます。
        year: 1694
      # fact: shorui-14
      - 語り: 1705年、同じく将軍を警護する小姓組の松田貞恒は、家の近くに来た病気の馬を、いたわらなかったとして、門を閉ざす罰を受けました。
        year: 1705
      # fact: shorui-13
      - 語り: 1696年8月6日。冒頭の、犬を斬った町人です。場所は、本所の相生町。町人は、首をさらされました。
        year: 1696
        tone: 重い
      # fact: shorui-13
      - 語り: 1702年10月には、橋本権之助という男が、犬を傷つけたとして、切腹を命じられています。
        year: 1702
      # fact: shorui-13
      - 語り: 1706年には、犬小屋の不始末で、見回りの役人2人が、追放されました。
        year: 1706
      # fact: shorui-12
      - 語り: ただ、罰の数は、どれほどだったのか。歴史学者の山室恭子は、1998年の本で、処分は《それほど大規模ではなかった》と見ています。
      - 語り: 罰は、たしかに重かった。それでも、生類憐みの令といえば、なぜ、犬と、戌年の話ばかりが語られるのか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 悪評の出どころ
  - title: 戌年だから犬を？　悪い評判の出どころ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: shorui-05
      - 語り: よく知られた話があります。跡継ぎに恵まれない綱吉に、僧の隆光が、こう勧めた。将軍は戌年の生まれだから、犬を大事にすれば、子に恵まれる、と。
      # fact: shorui-19
      - 語り: 2013年の山川出版社の高校の教科書は、この話は、一冊の本にもとづく理解だと思われる、としています。その本が、『三王外記』です。
        year: 2013
      # fact: shorui-19
      - 語り: 『三王外記』は、綱吉を含む3人の将軍の裏話を書いた本です。作者の名は、東武野史。本名ではなく、儒学者の太宰春台が書いたと伝わります。
      # fact: shorui-05
      - 語り: 1930年の『武蔵野歴史地理』は、隆光の言葉を、こう書いています。子を失ったのは、前の世で、多くの生き物を殺した罪である、と。
        tone: 重い
      # fact: shorui-18
      - 語り: そして、年が合いません。最初の触れとしてよく挙げられる、犬や猫をつながなくてよいという触れは、1685年の7月。隆光が江戸の知足院に入ったのは、その翌年、1686年です。
        year: 1686
      # fact: shorui-18
      - 語り: 2014年の朝日新聞は、隆光自身の日記に、そうした記述はない、と紹介しました。根崎光男は、隆光が勧めたという見方は、後退してきている、と書いています。
        year: 2014
      # fact: shorui-21
      - 語り: ただ、戌年の話そのものは、綱吉が将軍だったころに日本へ来た外国人も、書き留めています。その一人が、ドイツ人の医者、ケンペルです。
      # fact: shorui-21
      - 語り: ケンペルは、1691年と1692年に、オランダ商館の一行と江戸へ上りました。
        year: 1691
      # fact: shorui-21
      - 語り: ケンペルの『日本誌』は、犬を殺すのは死罪だ、と書き、将軍が犬を重んじるのは、戌年の生まれだからだという迷信だ、とも書いています。
      # fact: shorui-20
      - 語り: 悪い評判を広げた言葉もあります。新井白石の『折たく柴の記』には、一羽の鳥、一匹の獣のために罪に問われた人が、およそ幾十万人、という言い方があります。
        tone: 重い
      # fact: shorui-20
      - 語り: この言い方は、『三王外記』や、1925年の徳富蘇峰の『近世日本国民史』に引かれて広まった、と溝口と高山は見ています。
      # fact: shorui-24
      - 語り: 綱吉を研究したボダルト・ベイリーが、2006年にハワイ大学の出版局から出した本は、紹介文で、綱吉の悪い評判は、主に、武士の書き手から来ている、としています。
      - 語り: では、綱吉が亡くなったとき、触れは、どうなったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 綱吉の死と廃止
  - title: 死から10日後　1709年、放たれた鳥
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1709
    lines:
      # fact: shorui-16
      - 語り: 1709年、宝永6年の正月10日。綱吉は、亡くなりました。6代将軍は、家宣です。
        year: 1709
      # fact: shorui-16
      - 語り: 根崎光男の2000年の論文によれば、生類憐みの令を続けることは、綱吉の遺言でした。それでも、幕府は、廃止に踏み切ります。
        tone: 重い
      # fact: shorui-16
      - 語り: 死から《10日後》の、正月20日。幕府が預かっていた、鳶と烏が、すべて放されました。2月2日には、小石川の鶴も、放されます。
      # fact: shorui-16
      - 語り: 中野の犬小屋も、なくなりました。そのために江戸の町から集めていたお金も、止められます。
      # fact: shorui-06
      - 語り: 中野区の案内によれば、犬小屋は、1709年に廃止されるまで、15年間ありました。
      # fact: shorui-17
      - 語り: ところが、すべてが消えたのでは、ありません。
        tone: 重い
      # fact: shorui-17
      - 語り: 生類憐みの令を見直した歴史学者、塚本学は、辞典の項目に、こう書きます。捨て子と、捨て牛馬を禁じる触れは、その後も長く、幕府の法として生きた、と。
      # fact: shorui-17
      - 語り: 溝口と高山が紹介する山室恭子の見方では、廃止は少しずつ進み、一部は、8代将軍の吉宗のころに、もう一度出されました。
      # fact: shorui-11
      - 語り: 中野の犬小屋の跡の一部は、のちに吉宗が気に入り、紅白の桃を植えさせて、花見の名所、桃園になりました。
      - 語り: 犬の囲いは消え、捨て子を禁じる触れは残った。今の研究者は、この法を、どう見ているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 研究と教科書
  - title: 教科書が書き換えた　1983年、塚本学の研究
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1983
    lines:
      # fact: shorui-34
      - 語り: 1983年、塚本学が『生類をめぐる政治』を出しました。1992年には板倉聖宣、1998年には山室恭子が、生類憐みの令を見直す本を書いています。
        year: 1983
      # fact: shorui-33
      - 語り: 板倉聖宣が指摘したのは、触れの言う生類には、人間も入っている、という点でした。
      # fact: shorui-34
      - 語り: 溝口元と高山晴子の論文は、3人に共通する見方を、こうまとめます。綱吉の時代にまだ残っていた、戦国時代の荒々しい風潮を、一掃すること。それが、ねらいの一つだった、と。
        tone: 重い
      # fact: shorui-36
      - 語り: 教科書も、変わりました。1988年の山川の教科書は、庶民の不満をつのらせた。1999年の教科書は、戦国の気風を断った面を、書くようになります。
      # fact: shorui-37
      - 語り: 2021年の山川の『詳説日本史B』には、庶民は迷惑をこうむったが、《野犬が横行する殺伐とした状態は消えた》、とあります。
        figure: {type: stats, title: 山川の教科書の書き方, items: [[山川の1967年版, 苦しめた, 違反を厳しく罰した], [山川の1988年版, 不満をつのらせた, 庶民の], [山川の2021年版, 殺伐が消えた, 野犬の横行]], upto: 3}
      - 語り: 多くの人々を苦しめた、と書いた1967年の教科書から、54年です。
      # fact: shorui-35
      - 語り: それでも、評価は一つではありません。日本大百科全書で、辻達也は、この法を、虐政と書いています。
        figure: null
        tone: 重い
      - 語り: では、生類憐みの令は、悪法だったのか。
        tone: 疑問
        hook: true

  - title: まとめ：生類憐みの令は、本当に悪法だったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 言えることから。生類憐みの令は、犬だけの法ではありませんでした。捨て子、病気の旅人、牢屋の囚人、牛と馬。触れは、人にも及んでいました。
        tone: しみじみ
      - 語り: そして、罰は重いものでした。病気の馬を捨てた39人が島へ流され、犬を斬った町人は、首をさらされています。
        tone: しみじみ
      - 語り: 中野には、記録で10万頭といわれた犬の囲いがあり、その費用は、江戸の町人から集めた、とする研究があります。
        tone: しみじみ
      - 語り: 戌年の話は、綱吉の時代に来た外国人も、書き留めていました。けれど、隆光が勧めたという筋は、隆光が江戸の寺に入ったのが最初の触れの翌年だったことや、本人の日記に記述がないことから、研究では後退しています。
        tone: しみじみ
      - 語り: 言えないことも、あります。罰を受けた人が、全部で何人いたのか。中野の犬は、何頭だったのか。記録は、割れたままです。
        tone: しみじみ
        pause: 0.8
      - 語り: 犬のための罰は、まぎれもなく重かった。けれど、悪法の一言で片づけると、捨て子を育てよと命じた触れまで、一緒に消えてしまいます。
        tone: しみじみ
      - 語り: 犬の囲いは、綱吉の死から、まもなく消えました。捨て子を禁じる触れは、そのあとも長く、幕府の法として生き続けました。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、生類憐みの令を、悪法だと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
