# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  犬を大事にしすぎた悪法。そう習う生類憐みの令の中に、捨て子は、届け出なくてよいから、その土地の者が育てよ、という触れがありました。
  一方で、犬を斬った町人は、首をさらされています。中野には、まもなく10万頭に及ぶといわれた犬の囲いが造られました。
  生類憐みの令は、本当に悪法だったのか。触れの中身、罰の記録、悪い評判の出どころを並べて、言えることと、言えないことを分けました。
  この動画でわかること
  ・中野の犬小屋の広さと頭数、記録ごとのちがい
  ・犬だけではなかった触れ（捨て子・病気の旅人・牛馬・魚と鳥）
  ・名前の残る罰の記録
  ・「戌年だから犬を大事に」という話の出どころ
  ・綱吉の死から10日後に起きたこと
description_note: |-
  年月日は『徳川実紀』の記事を引いた論文（溝口元・高山晴子『生物学史研究』99号・100号、2019・2020年）によります。犬小屋の広さ・頭数・餌・費用は、出どころによって幅があり、動画では出どころごとに並べました。広さの換算・年数の差は、自分で計算し直したものです。
  触れの数「一般に135回」は溝口・高山の論文の言い方で、数え方の出どころは示されていません。処罰の件数を数えた研究もありますが、原典を確かめられなかったため、動画では名前の残る例だけを挙げました。研究者の見方は、論文・辞典の本人の項目・出版社の紹介によります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Was Japan's Dog Law Really a Bad Law? 100,000 Dogs and the Abandoned Children"
  description: |-
    Japanese textbooks long called Tokugawa Tsunayoshi's Edicts on Compassion for Living Things a bad law that put dogs above people.
    Yet the same edicts ordered villagers to raise abandoned children, and forbade inns from turning sick travelers away. Meanwhile, a townsman who cut down a dog was executed, and kennels for some 100,000 dogs were built at Nakano.
    We set side by side the edicts, the punishment records, and the sources of the later bad reputation.
    In this video you will learn:
    - The size of the Nakano kennels, and how records differ
    - Edicts beyond dogs: abandoned children, sick travelers, horses, fish and birds
    - Punishments recorded by name
    - Where the "born in the Year of the Dog" story comes from
    - What happened ten days after Tsunayoshi died
    Figures vary by source. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "What the Edicts Actually Said"
    - "The Dog Shogun"
    - "The Nakano Kennels"
    - "Not Only Dogs"
    - "Those Who Were Punished"
    - "Where the Bad Reputation Came From"
    - "Ten Days After His Death"
    - "Historians and Textbooks"
    - "Summary: Was It a Bad Law?"

