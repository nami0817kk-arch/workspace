# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  誰もが学校で習う「邪馬台国」。ところが、その名を記したいちばん古い記録の、今に残る印刷された本には、「邪馬壹国」と刷られています。
  国の名前の字さえ一つに決まらず、その国がどこにあったのかも、およそ1800年、決まっていません。
  『魏志倭人伝』に書かれた手がかり、鉄・絹・鏡・墓の大きさ・女王の住まい・山の丹の6つで、北部九州・奈良盆地・吉備・山陰・阿波の5つの説に、出土したものだけで点を付けました。
  この動画でわかること
  ・『魏志倭人伝』と『日本書紀』『梁書』『後漢書』『翰苑』の記録の食い違い
  ・吉野ヶ里の石棺、纒向の桃の種、箸墓の年代、平原の国内最大の鏡
  ・「その山に丹あり」と、徳島の若杉山の採掘の跡
  ・採点の結果と、記録から言えること・言えないこと
description_note: |-
  採点の決まり（6つの手がかりごとに、卑弥呼の時代の前後に、その土地から記録と同じものが出ているかを2点・1点・0点で数える）は、この動画で決めたものです。点は、今回たどれた発掘の報告・研究の範囲での目安です（見当たらない＝無いとは限りません）。鉄は北部と中部の九州をまとめて数えました。決まりを変えれば順位も変わりえます。
  『魏志倭人伝』『後漢書』『梁書』『隋書』『晋書』『日本書紀』『翰苑』の原文は、中文 Wikisource の本文で読みました。発掘と研究は、文化庁（文化遺産オンライン）・佐賀県・福岡県・岡山大学・島根県・鳥取県・徳島県・名古屋大学などの公開資料によります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。卑弥呼の姿も、特定の資料を写したものではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Where Was Yamatai? Scoring Only the Clues in the Wei Chronicle, an Unexpected Place Emerged"
  description: |-
    Everyone learns the name "Yamatai" at school. Yet the oldest surviving printed editions of the record that names it read "Yama-ichi" (邪馬壹国).
    Even the characters of its name are not settled, and for about 1,800 years no one has settled where it was.
    We took six clues written in the Wei Chronicle - iron, silk, mirrors, the size of the queen's tomb, her palace, and the "cinnabar in the mountains" - and scored five theories (northern Kyushu, the Nara basin, Kibi, San'in and Awa) using only what has been excavated.
    In this video you will learn:
    - Where the Wei Chronicle, the Nihon Shoki, the Liang Shu, the Hou Han Shu and the Kan'en disagree
    - The Yoshinogari stone coffin, the Makimuku peach stones, the date of the Hashihaka tomb, and Japan's largest bronze mirror at Hirabaru
    - "Cinnabar in the mountains" and the mining site at Wakasugiyama in Tokushima
    - The final scores, and what the records can and cannot tell us
    The scoring rules were set for this video; the scores reflect only the reports we could trace. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "A Country Whose Name Is Not Even Settled"
    - "What Does the Wei Chronicle Say?"
    - "Six Clues, Two Points Each"
    - "Where Did the Iron and Silk Come From?"
    - "Where Are Himiko's Hundred Bronze Mirrors?"
    - "Where Is the Tomb 'Over a Hundred Paces Across'?"
    - "Where Were the Palace, Towers and Stockades?"
    - "Where Was the 'Cinnabar in the Mountains'?"
    - "The Scores"
    - "Summary: Where Was Yamatai?"

