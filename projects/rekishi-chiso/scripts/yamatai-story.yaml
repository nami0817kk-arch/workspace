sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 名前の字さえ決まらない国　邪馬壹国
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 239
    lines:
      # fact: yamatai-14
      - 語り: 邪馬台国。学校で、誰もが習う名前です。ところが、その名を記した、いちばん古い記録。今に残る、その印刷された本には、邪馬台国とは、書かれていません。
        tone: 重い
      # fact: yamatai-14
      - 語り: 刷られているのは、《邪馬壹国》。台の字が、違うのです。
        card: {head: "刷られた字", body: 邪馬壹国}
      - 語り: 国の名前の字さえ、決まらない。では、その国は、どこにあったのか。およそ1800年、答えは出ていません。
        tone: 疑問
      # fact: yamatai-46
      - 語り: 2023年の6月。佐賀県の吉野ヶ里遺跡で、ひとつの石の棺の蓋が、開けられました。墓の穴の長さは、3.2メートル。ふつうより、大きな墓です。
        year: 2023
      # fact: yamatai-48
      - 語り: 中は、土で満ちていました。赤い顔料の痕は出ましたが、副葬品は、ひとつも出ませんでした。
        card: {head: "2023年6月5日", body: 石棺の中に副葬品なし}
      # fact: yamatai-29
      - 語り: 奈良県の纒向遺跡では、大きな建物のそばの穴から、桃の種が、山のように出ています。
      # fact: yamatai-29
      - 語り: 名古屋大学のチームが測ると、実った年は、西暦135年から230年のあいだでした。
        card: {head: "纒向の桃の種", body: 135〜230年}
      # fact: yamatai-12
      - 語り: 女王、卑弥呼が、中国の魏に、初めて使いを送ったのは、238年か、239年です。
      - 語り: 九州か、奈良か。発掘のたびに、答えが近づいたと言われ、また、遠のきます。
      # fact: yamatai-23
      - 語り: 手がかりは、ひとつの記録に残っています。『魏志倭人伝』。そこには、鉄、絹、鏡、墓の大きさ、女王の住まい、そして、赤い鉱物のことまで、書かれています。
      - 語り: 記録に書かれた、その「物」だけを手がかりに、説ごとに点を付けたら、どこが残るのか。
        tone: 疑問
      - 語り: 浮かび上がったのは、多くの人が探してきた場所とは、少し違う、意外な場所でした。
        hook: true
      - 語り: すべての手がかりは、ひとりの男が書いた、短い記録の中にあります。
        hook: true

  # ================================================================ 第1章 『魏志倭人伝』には何が書かれているのか
  - title: 陳寿の『魏志倭人伝』には何が書かれているのか　3世紀の記録
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 280
    lines:
      # fact: yamatai-20
      - 語り: その男は、陳寿。3世紀の中国の歴史家で、魏・呉・蜀の3つの国の歴史、『三国志』をまとめました。
      # fact: yamatai-20
      - 語り: 『晋書』によれば、陳寿が亡くなったのは297年、65歳。逆に数えると、卑弥呼の使いが魏に着いたころ、陳寿は、まだ幼い子どもでした。
        card: {head: "陳寿", body: 297年に65歳で没}
      # fact: yamatai-23
      - 語り: その『三国志』の、東の国々を書いた巻に、倭人の条があります。日本で、『魏志倭人伝』と呼ばれる部分です。
      # fact: yamatai-24
      - 語り: 卑弥呼は、鬼道、つまり、まじないの道に仕え、人々をよく惑わした。夫はなく、弟が、国を治めるのを助けた。魏志は、そう書いています。
      # fact: yamatai-12
      - 語り: その卑弥呼が、魏に使いを送った年。ここに、1つ目の食い違いがあります。
      # fact: yamatai-12
      - 語り: いま伝わる魏志の本文は、景初2年、238年の6月。ところが、720年の『日本書紀』が魏志を引いた注と、7世紀の『梁書』は、景初3年、239年とします。
      # fact: yamatai-14
      - 語り: 2つ目の食い違いは、国の名前です。魏志の印刷された本は、邪馬壹国。5世紀の『後漢書』は、邪馬臺国。『隋書』は、邪靡堆と書いて、魏志の言う邪馬臺だ、と添えます。
      # fact: yamatai-14
      - 語り: 歴史家の古田武彦さんは、1969年の論文で、印刷された本はどれも、邪馬壹と刷っている、と書きました。
      # fact: yamatai-24, yamatai-82
      - 語り: 魏志の道のりは、朝鮮半島の帯方郡から海を渡り、対馬国、一支国、末盧国、伊都国、奴国、不弥国、と続きます。
        figure: null
      # fact: yamatai-24
      - 語り: その伊都国について、魏志は、こう書いています。帯方郡の使いが、行き来のたびに、いつも留まる所。
      # fact: yamatai-11
      - 語り: そして、3つ目の食い違い。魏志は、伊都国の戸数を、千余戸と書きます。ところが、唐の時代の書物『翰苑』が引く『魏略』では、万余戸。10倍です。
        card: {head: "伊都国の戸数", body: 千余戸か万余戸か}
      # fact: yamatai-24, yamatai-14
      - 語り: 道のりは、その先で、ぼやけていきます。南へ、水行20日で、投馬国。さらに南へ、水行10日、陸行1月で、女王の都、邪馬壹国。
      # fact: yamatai-18
      - 語り: 1910年、京都の内藤湖南は、この南を、東と読み替えました。海の上の方角は、誤りやすい、というのです。東へ進めば、女王の都は、奈良になります。
        year: 1910
      # fact: yamatai-19
      - 語り: 同じ1910年、東京の白鳥庫吉は、九州に置く論を出しました。ここから、京都と東京の学者の論争が始まり、100年を超えて続いています。
        card: {head: "1910年", body: 内藤湖南と白鳥庫吉}
      - 語り: 道のりの数字は、読み方しだいで、九州にも、奈良にも届きます。だから、数字ではなく、記録に書かれた「物」で、確かめます。
        hook: true
      - 語り: では、記録に書かれた物は、いま、どこの土から出てくるのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 採点の決まり（約20%）
  - title: 採点の決まり　『魏志倭人伝』の6つの手がかり
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: yamatai-23
      - 語り: 手がかりは、6つです。1つ目は、《鉄》。魏志は、倭の兵が、竹の矢に、鉄か、骨の鏃を付ける、と書きます。
        figure: {type: table, title: 魏志倭人伝の6つの手がかり, cols: [魏志の言葉, 照らすもの], rows: [[鉄, 竹の矢に鉄の鏃, 鉄器の出土], [絹, 蚕を飼い絹を出す, 絹の布], [鏡, 銅鏡百枚を贈る, 銅鏡], [墓, 径百余歩, 墓の大きさ], [住まい, 宮室・楼観・城柵, 建物と囲い], [丹, その山に丹あり, 丹を掘った跡]], upto: 1}
      # fact: yamatai-23
