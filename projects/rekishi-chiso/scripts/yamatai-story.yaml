# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。邪馬台国はどこ？ 2026-11-06 作成。公開の予定は 11/10 19:00（日本史枠）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（ユーザー○済み）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。
# 1本に1つの問い＝「邪馬台国は、どこにあったのか」。『魏志倭人伝』（『三国志』魏書東夷伝倭人条、陳寿、3世紀末）の手がかり6つで、説を5つ採点する。
#   道のりの数字（里・日数）の計算は主役にしない（第1章で「読み方しだいでどちらにも届く」と触れるだけ）。「AI」とは言わない。
#   冒頭（10秒以内）＝誰でも知る「邪馬台国」の名が、今に残る魏志の刊本には「邪馬壹国」と刷られている（yamatai-14）。
#   採点の決まり（第2章、約20%）：手がかり＝鉄・絹・鏡・墓（径百余歩）・女王の住まい（宮室・楼観・城柵）・丹（其山有丹）。
#     2点＝はっきり、まとまって出る（卑弥呼の時代と重なる年代か、弥生の終わりの王の墓）／1点＝出てはいるが、少ないか、時代（卑弥呼の時代と重なる年代の無い古墳・ずっと古い甕棺）・形（蚕でない絹）がずれる／0点＝調べた資料では見当たらない。
#     丹は「その山に丹あり」なので、掘った跡で数える。12点満点。
#   点（自分で数え直した）：         鉄 絹 鏡 墓 住 丹 ＝計
#     北部九州（吉野ヶ里・伊都国）    2  1  2  0  2  0 ＝ 7   （鉄は北部・中部九州をまとめて数える）
#     奈良盆地（纒向・箸墓）          1  1  1  2  1  0 ＝ 6
#     山陰（出雲・鳥取）              1  1  1  1  0  0 ＝ 4
#     阿波（徳島）                    1  0  1  0  0  2 ＝ 4
#     吉備（岡山）                    1  0  1  1  0  0 ＝ 3
#     途中の合計（九州・奈良・山陰・吉備・阿波）：鉄＋絹 3・2・2・1・1／＋鏡 5・3・3・2・2／＋墓 5・5・4・3・2（並ぶ）／＋住まい 7・6・4・3・2／＋丹 7・6・4・3・4。
#     11-06 照合で直した：吉野ヶ里の絹は甕棺（弥生前期後半〜後期前半）でずっと古いので1点（はじめ2点）。北部九州の0点は墓と丹。
#   採点の結果は第8章（約80%）。答え（約90%）＝1位は北部九州（7点）。鏡の2点は伊都国の平原、絹・住まいは佐賀の吉野ヶ里。卑弥呼の死の手がかり（墓）は0点、奈良は墓で2点。
#     魏志は伊都国を「郡使往来常所駐」「一大率…常治伊都國」と書く。点の中身と伊都国の役目を重ねると見えるのは、候補地そのものではなく、記録の目がいた所＝伊都国（今の糸島）。採点からの一つの読みとして言う。
#     「邪馬台国は伊都国だった」とは言わない。伊都国＝邪馬台国とも、奈良ではないとも言い切らない（言えることと言えないことを分ける）。
# 記録の食い違いは3つ：①最初の使いの年（魏志 景初2年／書紀の注・梁書 景初3年）②国名（刊本 邪馬壹国／後漢書 邪馬臺国／隋書 邪靡堆）③伊都国の戸数（魏志 千余戸／翰苑の引く魏略 万余戸）。
#   ほかに記録と出土の食い違い（魏志「ほとんど縫わない」⇔吉野ヶ里の縫い目のある絹）と、研究の読み違い（1910 内藤湖南「南を東と解して」⇔白鳥庫吉）。
# 計算（自分で計算し直した）：239→2026 は1787年（およそ1800年）／3.2m÷2m＝1.6倍／135〜230年は95年の幅（約100年）／陳寿 297年に65歳で没→233年ごろの生まれ、238年はまだ幼い／
#   伊都国 千余戸→万余戸は10倍／1910→2026 は116年（100年を超える）／19.2m×12.4m＝238.08㎡（博物館の推定は床約230㎡。230÷1.62≒142で畳およそ140枚）／
#   黒塚 17＋15＋1＝33面（17と15は立てかけ、1は置く）／2km×1.5km＝3平方キロ／箸墓の築造 250年前後と、247年（正始8年）の記事の後の卑弥呼の死。
# 事実は事実カード（dev/output/rekishi-chiso/research/邪馬台国_facts_20261107.yaml、yamatai-11〜84）にあるものだけ。行の上に `# fact: yamatai-NN`。
#   原文は中文 Wikisource（三國志 卷30・後漢書・梁書・隋書・晉書・日本書紀・翰苑）で開いた。公的機関は文化庁（文化遺産オンライン）・佐賀県・福岡県・岡山大学・島根県・鳥取県・徳島県・名古屋大学。
#   使わないこと：魏の1歩の長さ（径百余歩の換算。出どころを開けなかった）・混一疆理歴代国都之図・新井白石の転向（書誌だけ）・平原の年代と大きさ（観光案内だけ）・
#     比恵・那珂の規模・青谷上寺地の鉄器の数・三角縁神獣鏡の総数・纒向のバジル（書誌だけ）・特殊器台が箸墓に伝わった話（書誌だけ）・弥生の硯（研究者で割れていて、今回の採点に使わない）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
