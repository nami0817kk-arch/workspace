  伊都国: 魏志倭人伝の国の一つ。今の福岡県糸島市のあたり
  一大率: 女王の国より北の国々を見張らせた役
  三角縁神獣鏡: 縁の断面が三角で、神と獣を描いた銅鏡
  画文帯神獣鏡: 神と獣と、絵の帯を描いた中国の銅鏡
  甕棺: 大きな甕を棺にした、北部九州の弥生の墓
  方形周溝墓: まわりを四角く溝で囲った墓
  環壕: 集落のまわりを囲む堀
  墳丘墓: 土を盛り上げた、弥生時代の墓
  紡錘車: 糸をよって、つむぐための道具
  辰砂: 赤い色のもとになる鉱物。丹・朱とも

