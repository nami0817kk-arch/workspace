  # ================================================================ 第3章 鉄と絹
  - title: 鉄と絹はどこから出たのか　吉野ヶ里と纒向
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 弥生時代の鉄器は、どこから、多く出るのか。
        tone: 疑問
      # fact: yamatai-58
      - 語り: 近畿の鉄器を研究する野島永さんは、1996年の論文に、北部九州と中部九州の鉄器は、本州のほかの地域と、量の差が著しい、と書きました。
      # fact: yamatai-58
      - 語り: 熊本の白川や、大分の大野川の流域では、一つの集落から、百点を超える鉄器が出ることもあります。
      # fact: yamatai-43
      - 語り: 奈良はどうか。纒向遺跡のそばの、ホケノ山古墳は、3世紀の中ごろの墓で、銅と鉄の鏃が、それぞれ70点以上出ています。
      # fact: yamatai-39
      - 語り: ただ、纒向で、鉄を打つ鍛冶の跡が出てくるのは、遺跡の後の時期になってからです。
      # fact: yamatai-66, yamatai-68
      - 語り: 岡山の楯築墳丘墓と、出雲の西谷3号墓では、棺の中から、鉄の剣が出ています。
      # fact: yamatai-80
      - 語り: 徳島の鳴門市にある西山谷2号墳は、3世紀の中ごろの古墳です。石室から、鉄の剣、槍、鏃が出ています。
      - 語り: 鉄の点です。九州の北と中ほどをまとめて、北部九州が、2点。奈良、吉備、山陰、阿波が、それぞれ1点。
        figure: {type: table, title: 鉄の点, cols: [出たもの, 点], rows: [[北部九州, 北部・中部九州の集落から多く, 2点], [奈良盆地, ホケノ山の鉄の鏃, 1点], [吉備, 楯築の鉄の剣, 1点], [山陰, 西谷3号墓の鉄の剣, 1点], [阿波, 西山谷2号墳の鉄器, 1点]], upto: 5}
      # fact: yamatai-52, yamatai-47
      - 語り: 次は、絹です。佐賀の吉野ヶ里遺跡では、大きな甕を棺にした墓から、赤や紫に染めた絹や、縫い目のある絹の布が出ています。
        figure: null
      # fact: yamatai-82, yamatai-52
      - 語り: ここに、記録と出土品の食い違いがあります。魏志は、倭の男の着物を、横に長い布を結んでつなぐだけで、ほとんど縫わない、と書いているのです。
      # fact: yamatai-47, yamatai-53
      - 語り: ただ、その甕棺の墓は、弥生時代の前期の後半から、後期の前半のもの。北部九州の絹は、年代が、ずっと古い方へ見直されてもいます。卑弥呼の時代より、だいぶ前の絹です。
      # fact: yamatai-37
      - 語り: では、奈良は。纒向では、蚕ではなく、野山にいるヤママユの糸で作った、絹の巾着が出ています。
      # fact: yamatai-54
      - 語り: 奈良大学の小林青樹さんが集めた数では、奈良盆地では、邪馬台国の時代に、糸をつむぐ紡錘車が、消えてしまいます。
      # fact: yamatai-54
      - 語り: 小林さんは、もし大和が中心なら、布は、ほかの土地から納めさせていたのかもしれない、と読みます。
      # fact: yamatai-55
      - 語り: 山陰では、鳥取県の青谷上寺地遺跡から、絹を縫い合わせた布が出ています。
      - 語り: 絹の点です。絹そのものは出ても、少ないか、時代や形がずれる、北部九州、奈良、山陰が、1点ずつ。弥生の絹の出ていない吉備と阿波は、0点。
        figure: {type: table, title: 絹の点, cols: [出たもの, 点], rows: [[北部九州, 吉野ヶ里の絹は古い時代, 1点], [奈良盆地, ヤママユの絹の巾着, 1点], [山陰, 青谷上寺地の絹の布, 1点], [吉備, 見当たらない, 0点], [阿波, 見当たらない, 0点]], upto: 5}
      - 語り: 2つの手がかりで、北部九州が、《3点》。奈良と山陰が2点、吉備と阿波が1点です。
        figure: {type: bars, title: 採点の途中（鉄・絹）, bars: [[北部九州, 3], [奈良盆地, 2], [山陰, 2], [吉備, 1], [阿波, 1]], labels: [3点, 2点, 2点, 1点, 1点], note: 12点満点}
        hook: true
      - 語り: 次は、卑弥呼が受け取った、百枚の鏡。その鏡は、九州と奈良の、どちらの土から出てくるのか。
        figure: null
        tone: 疑問
        hook: true

  # ================================================================ 第4章 鏡
  - title: 卑弥呼の「銅鏡百枚」はどこにあるのか　平原遺跡と黒塚古墳
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: yamatai-25
      - 語り: 魏の皇帝は、卑弥呼に、白い絹や、金や、刀を贈り、そして、銅の鏡を、百枚贈りました。
      # fact: yamatai-25
      - 語り: 倭が最初に差し出したのは、男女10人と、まだらの布を少しだけ。返ってきた品の方が、ずっと多かったのです。
      # fact: yamatai-81, yamatai-59
      - 語り: 鏡が多く出たのは、福岡県糸島市の平原遺跡です。福岡県は、伊都国の遺跡として紹介し、その1号墓を、弥生の王の墓としています。
      # fact: yamatai-59
      - 語り: 出た銅鏡は、40面。いちばん大きな鏡は、直径46.5センチ、重さ約8キロ。国内でいちばん大きな銅鏡です。
        card: {head: "平原遺跡の鏡", body: 40面・最大46.5cm}
      # fact: yamatai-44
      - 語り: 奈良の黒塚古墳では、三角縁神獣鏡という鏡が、33面、棺を囲むように並べられていました。
      # fact: yamatai-44, yamatai-78
      - 語り: ところが、棺の中の、葬られた人の上半身のそばにあったのは、別の種類の鏡が、1面だけでした。
      # fact: yamatai-75, yamatai-79
      - 語り: 三角縁神獣鏡は、卑弥呼の鏡だ、と呼ばれてきました。けれど、中国からは、1面も出ていません。
      # fact: yamatai-77
      - 語り: 日本書紀の注と梁書が、使いの年とする、景初3年。その銘のある鏡は、島根県雲南市の神原神社古墳から、1面出ています。
        card: {head: "景初3年の銘", body: 島根の古墳から1面}
      # fact: yamatai-76
      - 語り: 京都府福知山市では、景初4年という、実在しない年号の鏡も出ています。
      # fact: yamatai-83
      - 語り: ここで、時代に気をつけます。黒塚古墳も、神原神社古墳も、古墳時代の前期の古墳で、卑弥呼の時代と重なるという測定は、示されていません。
      # fact: yamatai-43
      - 語り: 卑弥呼の時代に近い、奈良のホケノ山古墳で、形の分かる鏡は、1面です。
      # fact: yamatai-66
      - 語り: 吉備の楯築墳丘墓からは、鏡は1面も出ていません。岡山でも、三角縁神獣鏡は出ていますが、それは古墳からです。
      # fact: yamatai-80
      - 語り: 阿波の西山谷2号墳にも、鉄器とともに、銅鏡がありました。ただ、何面あったのかは、報告からは分かりません。
      - 語り: 鏡の点です。弥生の王の墓から40面が出た北部九州が、2点。奈良、山陰、吉備、阿波は、少ないか、時代がずれて、1点です。
        figure: {type: table, title: 鏡の点, cols: [出たもの, 点], rows: [[北部九州, 平原遺跡の40面, 2点], [奈良盆地, ホケノ山1面・黒塚は古墳, 1点], [山陰, 景初3年の鏡は古墳から, 1点], [吉備, 三角縁は古墳から, 1点], [阿波, 西山谷2号墳の鏡（数は不明）, 1点]], upto: 5}
      - 語り: ここまでで、北部九州が、《5点》。奈良と山陰が3点、吉備と阿波が2点です。
        figure: {type: bars, title: 採点の途中（鉄・絹・鏡）, bars: [[北部九州, 5], [奈良盆地, 3], [山陰, 3], [吉備, 2], [阿波, 2]], labels: [5点, 3点, 3点, 2点, 2点], note: 12点満点}
        hook: true
      - 語り: けれど、次の手がかりで、点の流れが、変わります。卑弥呼の墓です。
        figure: null
        hook: true

  # ================================================================ 第5章 墓
  - title: 「径百余歩」の墓はどこにあるのか　箸墓古墳と247年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: yamatai-26
      - 語り: 正始8年、247年。倭は、帯方郡に使いを送り、南の狗奴国と、攻め合っている、と訴えました。魏は、張政らを、倭へ送ります。
        year: 247
      # fact: yamatai-17
      - 語り: その記事のあとに、魏志は書きます。卑弥呼、以て死す。大いに塚を作る。径、百余歩。
        card: {head: "卑弥呼の墓", body: 径百余歩}
      # fact: yamatai-26
      - 語り: 男の王を立てると、国中が従わず、殺し合いになった。そこで、卑弥呼の一族の娘、13歳の壹与を王に立てると、国は、ようやく治まりました。
      # fact: yamatai-40
      - 語り: 奈良県桜井市の箸墓古墳。文化庁の解説では、墳丘の長さは、290メートル前後。丸い後円部の直径は、約165メートルです。
        year: 250
      # fact: yamatai-17
      - 語り: 共同通信の用語解説は、後円部の直径を約150メートルとして、径百余歩と、ほぼ一致することが、卑弥呼の墓とする説の根拠だ、と書いています。
      # fact: yamatai-41, yamatai-42
      - 語り: 造られたのは、いつか。2009年、国立歴史民俗博物館は、炭素14の測定から、築かれた直後を、240年から260年と発表しました。
        card: {head: "箸墓の年代（2009年）", body: 240〜260年}
      # fact: yamatai-42
      - 語り: 2025年、同じ博物館の松木武彦さんは、250年前後か、少し下る260年代とみる研究者が多い、と書いています。
      # fact: yamatai-63, yamatai-65
      - 語り: 吉備の楯築墳丘墓は、長さ80メートル前後。岡山大学は、2世紀の後半の、最大の弥生墳丘墓としています。
      # fact: yamatai-68
      - 語り: 出雲の西谷3号墓は、四隅が突き出た形の墓で、突き出た部分を含めて、長いほうが約52メートル、短いほうが42メートル。弥生時代の終わりごろの墓です。
      # fact: yamatai-68
      - 語り: 出た土器の3分の1が、吉備や北陸の特徴を持ち、岡山から運ばれた、王の墓にしか使われない、特別な土器の台と壺までありました。
      # fact: yamatai-47
      - 語り: では、北部九州は。吉野ヶ里では、物見櫓や祭殿の跡があるのに、その時代の王の墓が見つからないことが、長年の謎でした。
      # fact: yamatai-49
      - 語り: 2023年の石棺の墓は、その後の調査で、まわりを四角く溝で囲った墓だと分かりました。佐賀県は、2026年の2月、一帯は、有力者の墓域だった可能性が高まった、と発表しています。
      # fact: yamatai-81
      - 語り: 平原遺跡にも、王の墓があります。けれど、百メートルを超える、卑弥呼の時代の大きな墓は、北部九州では、調べた報告の中に見当たりません。
      # fact: yamatai-74
      - 語り: 阿波の鳴門市の萩原1号墓は、弥生時代の終わりの墳丘墓です。2000年に、ホケノ山古墳で、似た形の木の部屋が見つかって、見直されました。ただ、大きさの分かる報告は、まだ出ていません。
      - 語り: 墓の点です。箸墓は古墳ですが、築かれた年代が、卑弥呼の死と重なり、大きさも合うので、奈良が、2点。吉備と山陰が、1点。北部九州と阿波は、0点です。
        figure: {type: table, title: 墓の点, cols: [出たもの, 点], rows: [[奈良盆地, 箸墓 後円部約165m, 2点], [吉備, 楯築 80m前後, 1点], [山陰, 西谷3号墓 約52m, 1点], [北部九州, 百m級の墓は見当たらない, 0点], [阿波, 大きさの報告がない, 0点]], upto: 5}
      - 語り: ここで、奈良が、《5点》。北部九州に、並びました。
        figure: {type: bars, title: 採点の途中（鉄・絹・鏡・墓）, bars: [[北部九州, 5], [奈良盆地, 5], [山陰, 4], [吉備, 3], [阿波, 2]], labels: [5点, 5点, 4点, 3点, 2点], note: 12点満点}
        hook: true
      - 語り: 次の手がかりは、女王の住まい。九州と奈良、どちらに、宮室と楼観があったのか。
        figure: null
        tone: 疑問
        hook: true

  # ================================================================ 第6章 住まい
  - title: 宮室・楼観・城柵はどこにあったのか　吉野ヶ里と纒向の建物
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: yamatai-50
      - 語り: 吉野ヶ里遺跡の外側の環壕、つまり集落を囲む堀は、弥生時代後期の後半、2世紀ごろに、集落全体を囲みました。囲まれた広さは、約40ヘクタールです。
      # fact: yamatai-50
      - 語り: 堀は、深さ3メートル、幅5メートル以上。物見やぐらの跡には、高さ12メートルのやぐらが、復元されています。
        card: {head: "吉野ヶ里の環壕", body: 深さ3m・幅5m以上}
      # fact: yamatai-51
      - 語り: ところが、3世紀の後半ごろには、堀は、ほぼ埋まり、内側の囲いは無くなります。その後、およそ200年あまり、丘の上に、集落はありません。
      # fact: yamatai-34
      - 語り: 奈良の纒向遺跡は、東西2キロ、南北1.5キロ。その時期には類を見ない広さだ、と文化庁は書いています。
      # fact: yamatai-33
      - 語り: 大型の建物は、ほかの建物と東西に一列に並び、柵で囲まれていました。いちばん大きな建物は、南北19.2メートル、東西12.4メートル。
      # fact: yamatai-34
      - 語り: 床の広さは、約230平方メートルと推定されています。畳にすると、およそ140枚です。
        card: {head: "纒向の大型建物", body: 床 約230㎡}
      # fact: yamatai-35, yamatai-36
      - 語り: 纒向では、東海から北部九州まで、各地の土器が、場所によっては15%から30%を占めます。田畑を耕す農具は少なく、土木工事の道具ばかりが出ます。
      # fact: yamatai-34
      - 語り: しかも、掘られたのは、まだ、遺跡全体の2%ほどです。
      # fact: yamatai-45
      - 語り: 楼観はどうか。纒向では、高い物見の建物の跡は、調べた報告には見当たりません。奈良盆地の唐古・鍵遺跡から、高い楼閣を描いた土器は出ていますが、こちらは、弥生時代の環濠集落の絵です。
      - 語り: 吉備、山陰、阿波では、女王の住まいにあたる建物と囲いの跡は、今回の資料では見当たりませんでした。
      - 語り: 住まいの点です。堀と物見やぐらの跡がある吉野ヶ里の、北部九州が、2点。建物と柵はあっても、楼観の無い纒向の、奈良が、1点。ほかは、0点です。
        figure: {type: table, title: 住まいの点, cols: [出たもの, 点], rows: [[北部九州, 吉野ヶ里の環壕と物見やぐら, 2点], [奈良盆地, 纒向の大型建物と柵, 1点], [山陰, 確かめられず, 0点], [吉備, 確かめられず, 0点], [阿波, 確かめられず, 0点]], upto: 5}
      - 語り: 北部九州が、《7点》。奈良は、6点です。
        figure: {type: bars, title: 採点の途中（5つの手がかり）, bars: [[北部九州, 7], [奈良盆地, 6], [山陰, 4], [吉備, 3], [阿波, 2]], labels: [7点, 6点, 4点, 3点, 2点], note: 12点満点}
        hook: true
      - 語り: 最後の手がかりは、赤い鉱物、丹。ここで初めて、ある説だけが、点を取ります。
        figure: null
        hook: true

  # ================================================================ 第7章 丹
  - title: 「その山に丹あり」はどこか　徳島の若杉山遺跡
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: yamatai-71
      - 語り: 魏志は、倭の産物に、真珠と、青い玉を挙げ、その山に丹あり、と書きます。魏の皇帝も、卑弥呼に、赤い顔料を贈っています。
      # fact: yamatai-69
      - 語り: 徳島県阿南市の若杉山遺跡。岩盤を横穴のように掘り進めた、国内最古の、丹の採掘の跡です。2019年に、国の史跡になりました。
        card: {head: "若杉山遺跡", body: 国内最古の採掘の跡}
      # fact: yamatai-69, yamatai-70
      - 語り: 使われていたのは、文化庁の解説では、弥生時代後期の初めから、古墳時代前期の初めまで。
      # fact: yamatai-70
      - 語り: 石の臼には、直径10センチ前後のくぼみが、いくつも残り、その場で、石を叩き、潰し、すりつぶしていました。
      # fact: yamatai-70
      - 語り: しかも、石の杵の一部は、香川県の東部の石で、40キロほど離れた所から、運ばれていました。
      # fact: yamatai-66, yamatai-68, yamatai-48
      - 語り: 丹を、すりつぶした赤い粉を使った跡なら、各地にあります。楯築にも、西谷3号墓にも、棺に多くの水銀朱があり、吉野ヶ里の石棺にも、赤い顔料の痕がありました。
      - 語り: けれど、山で掘った跡まで出ているのは、阿波だけです。使った跡は数えない決まりなので、丹の点は、阿波が2点。ほかは、0点です。
        figure: {type: table, title: 丹の点, cols: [出たもの, 点], rows: [[阿波, 若杉山の採掘の跡, 2点], [北部九州, 掘った跡は出ていない, 0点], [奈良盆地, 掘った跡は出ていない, 0点], [吉備, 使った跡だけ, 0点], [山陰, 使った跡だけ, 0点]], upto: 5}
      - 語り: これで、6つの手がかりが、そろいました。
        figure: null
        hook: true
      - 語り: 点を、並べます。
        hook: true

  # ================================================================ 第8章 採点の結果（約80%）
  - title: 採点の結果　1位と、点の中身
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 結果です。
        figure: {type: bars, title: 記録の手がかりで採点した結果, bars: [[北部九州, 7], [奈良盆地, 6], [山陰, 4], [阿波, 4], [吉備, 3]], labels: [7点, 6点, 4点, 4点, 3点], note: 12点満点}
      - 語り: 1位は、北部九州。7点です。2位は、奈良盆地、6点。山陰と阿波が4点、吉備が3点でした。
      - 語り: けれど、点の中身を見ると、もう一つのことが、見えてきます。
        figure: null
      - 語り: 北部九州が点を取ったのは、鉄、絹、鏡、住まい。暮らしと、持ち物の手がかりです。0点だったのは、墓と丹。とくに、卑弥呼の死を書いた、墓の手がかりが、0点でした。
        figure: {type: stats, title: 北部九州と奈良の点の中身, items: [[北部九州, 7点, 鉄・絹・鏡・住まい], [奈良盆地, 6点, 墓で2点], [墓の手がかり, 九州0点, 奈良2点]], upto: 3}
      # fact: yamatai-58, yamatai-50, yamatai-81
      - 語り: 北部九州の点が、どこから出たのかを見ます。鉄は、九州の北と中ほどの集落。住まいは、佐賀の吉野ヶ里。そして、2点の鏡は、糸島の平原遺跡です。
        figure: null
      # fact: yamatai-81, yamatai-59
      - 語り: その平原遺跡は、福岡県が、伊都国の遺跡として紹介する場所です。
        figure: null
      # fact: yamatai-24
      - 語り: 思い出してください。魏志は、伊都国を、帯方郡の使いが、行き来のたびに、いつも留まる所、と書いていました。
      # fact: yamatai-82
      - 語り: さらに、女王の国より北の国々を見張る、一大率という役は、いつも伊都国で治めていた、とも書いています。
      # fact: yamatai-84
      - 語り: 倭王の使いが、魏へ向かうときも、魏の使いが、倭へ来るときも、港で荷を改め、文書と贈り物を、間違いなく女王のもとへ届けた。魏志は、そう書きます。
      - 語り: 女王のもとへ届く、魏の文書と贈り物は、伊都国にいた一大率の目を通った、とも読めます。
      # fact: yamatai-11
      - 語り: その伊都国の戸数は、魏志では千余戸、『魏略』では万余戸。記録によって、10倍も違う国です。
      # fact: yamatai-13
      - 語り: 魏の使いは、正始元年に倭へ行き、倭王に、位を授けた、とあります。けれど、そこが女王の都だったのか、伊都国だったのか、記録は、書き分けていません。
      - 語り: 記録に書かれた暮らしの手がかりは、魏の使いが、留まった所の近くで、見たり聞いたりしたものかもしれません。そして、その使いが、いつもいた国が、伊都国でした。
        hook: true
      - 語り: では、この採点から、どこが浮かび上がるのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（約90%）
  - title: まとめ：邪馬台国は、どこにあったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 採点の1位は、北部九州でした。その点の中身と、魏志が書く伊都国の役目を、重ねてみます。
        tone: しみじみ
      - 語り: 浮かび上がるのは、女王の都ではなく、魏の使いが、いつも留まった国。《伊都国》です。今の、福岡県糸島市のあたりです。
        tone: しみじみ
      - 語り: これは、採点から見えてくる、一つの読みです。魏志は、伊都国と、女王の都を、別の国として書いています。伊都国は、答えではなく、答えへの入口です。
      # fact: yamatai-40, yamatai-42
      - 語り: そして、卑弥呼の死を書いた、径百余歩の墓の手がかりにだけは、奈良の箸墓古墳が、大きさも、年代も、近いのです。
      - 語り: 言えないことも、あります。魏の使いが、女王の都まで行ったのか。箸墓に葬られたのは誰か。三角縁神獣鏡は、どこで作られたのか。吉野ヶ里の石棺に、誰が眠っていたのか。
        tone: しみじみ
      # fact: yamatai-30
      - 語り: 纒向の桃の種の年代も、名古屋大学の発表自身が、ちょうど年代の幅が広がる区間に当たり、100年より狭くはならない、と断っています。
      - 語り: どれも、今の記録と出土品からは、言い切れません。
        tone: しみじみ
        pause: 0.8
      # fact: yamatai-14
      - 語り: 邪馬台国か、邪馬壹国か。およそ1800年たった今も、その国の名前の字さえ、ひとつに決まっていません。
        tone: しみじみ
      # fact: yamatai-24
      - 語り: 道のりの記録は、伊都国のあたりまでは、里の数で、はっきり書かれています。その先の、女王の都だけが、まだ、言葉の向こうに眠っています。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、邪馬台国が、どこにあったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
