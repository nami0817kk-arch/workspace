  大うつけ: とても愚かな者。若いころの信長の呼び名

sections:
  # ---------------------------------------------------------------- 1 導入：本能寺の絵・versus
  - title: 1582年 本能寺で終わった49年
    background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《真書太閤記 本能寺焼討之図》1893年"}
    portrait: {image: paintings/nobunaga_chokoji_bust.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 1582年6月2日、京都の本能寺。織田信長は、家臣の明智光秀に襲われ、数えで49歳の生涯を終えました。
        card: {head: "1582年6月2日", body: 本能寺の変}
        tone: 重い
      - 聞き: 本能寺って、燃える中で「人間五十年」を舞ったとこでしょ？ ドラマで見たことある。
      - 語り: その場面は、記録には見つかっていません。『信長公記』が舞ったと書くのは、22年前の別の日です。
      - 聞き: 別の日なんだ。どこで舞ったのか、気になるじゃん。
      - 語り: 確かめに、信長の49年を、生まれた順に掘っていきます。まずは、襲われた側と、襲った側です。
        figure: {type: versus, title: 1582年6月2日の2人, credit: "左：狩野宗秀画（長興寺蔵）　右：本徳寺蔵",
                 left: {image: paintings/nobunaga_chokoji_bust.jpg, name: 織田信長, number: 数え49歳, note: 本能寺で最期},
                 right: {image: paintings/akechi_portrait_hontokuji.jpg, name: 明智光秀, note: 本能寺を囲んだ家臣, focus: false}}

  # ---------------------------------------------------------------- 2 若いころ：用語・detail
  - title: 尾張の「大うつけ」と父の葬儀
    background: {image: paintings/nobunaga_kuniyoshi_musha.png, credit: "歌川国芳《太平記英勇伝》（信長を名を変えて描いた武者絵）1848〜49年ごろ"}
    year: 1534
    lines:
      - 語り: 1534年、信長は、尾張の織田信秀の跡取りとして生まれます。生まれた城は、勝幡城という説が有力です。
        card: {head: 1534年, body: 尾張に生まれる}
      - 聞き: 跡取りなら、きちんとした若様に育ったんでしょ？ あーし、そういうの想像してた。
      - 語り: 『信長公記』の書く若いころは、湯帷子を肌脱ぎにして、町なかで栗や柿をかじり、人の肩にぶら下がって歩いた姿です。
        detail: {box: [380, 180, 820, 700], label: 江戸の終わりの武者絵に描かれた信長}
      - 聞き: 完全に、制服を着崩して、買い食いしながら登校するタイプじゃん。
        detail: {box: [380, 180, 820, 700], label: 江戸の終わりの武者絵に描かれた信長}
      - 語り: 周りは《大うつけ》と呼びました。ただ同じ本に、毎日、馬や水練、弓、鉄砲の稽古をしていたとも書かれています。
      - 語り: 1551年ごろの父の葬儀では、長い刀を縄で巻いた姿で現れ、抹香をつかんで、仏前に投げつけて帰りました。
        card: {head: "1551年ごろ", body: 父の葬儀で抹香を投げる}
      - 聞き: お葬式で抹香を投げるのは、さすがにまずいでしょ。周りの大人、頭かかえてそう。
      - 語り: その9年後、この若殿の尾張に、何万という大軍が攻めてきます。
        hook: true

  # ---------------------------------------------------------------- 3 桶狭間：肖像（この時○歳）・bars の upto＋circle・人物の言葉・吹き出し・detail＋mark
  - title: 1560年 桶狭間の戦い
    background: {image: paintings/nobunaga_imagawa_yoshimoto_ukiyoe.jpg, credit: "歌川国芳《太平記英勇伝》（今川義元を名を変えて描いた武者絵）1848〜49年ごろ"}
    portrait: {image: paintings/nobunaga_chokoji_bust.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）"}
    year: 1560
    lines:
      - 語り: 1560年5月、駿河の今川義元が、大軍で尾張に攻め込みます。このとき信長は、満で25歳です。
        card: {head: "1560年5月", body: 今川義元が尾張へ}
      - 聞き: 25歳って、いまなら新人の社会人だよ。相手の大軍って、何人くらい？
      - 語り: 『信長公記』は、今川の軍を4万5千と書きます。明治の陸軍の本では、2万5千です。
        figure: {type: bars, title: 桶狭間の兵の数, bars: [[今川（信長公記）, 45000], [今川（明治の陸軍の本）, 25000], [織田, 2000]], labels: [4万5千, 2万5千, 約2千], upto: 2}
      - 語り: 対する織田の軍は、およそ2千。少なく見ても、10倍以上の相手でした。
        figure: {type: bars, title: 桶狭間の兵の数, bars: [[今川（信長公記）, 45000], [今川（明治の陸軍の本）, 25000], [織田, 2000]], labels: [4万5千, 2万5千, 約2千], upto: 3}
        mark: {type: circle, at: 3}
      - 語り: 『信長公記』によると、出陣の前、信長は舞を舞いました。
        background: {image: paintings/nobunaga_okehazama_toyonobu.jpg, credit: "歌川豊宣《尾州桶狭間合戦》1882年"}
        figure: null
      - 人物: 「人間五十年、下天の内をくらぶれば、夢幻の如くなり」
        who: 敦盛
      - 語り: 舞い終えると、法螺貝を吹け、鎧をよこせ、と命じます。そして立ったまま食事をとり、出陣しました。
        bubble: {text: "具足よこせ", x: 0.5, y: 0.3}
      - 聞き: 待って。人間五十年って、本能寺じゃなくて、桶狭間に出る前に舞ってたの？
      - 語り: はい。記録では、桶狭間への出陣の前です。そしてこの戦いで、今川義元は命を落としました。
        card: {head: "1560年5月19日", body: 今川義元が討たれる}
        detail: {box: [0, 150, 1100, 960], label: 左下に「今川義元」の名札}
      - 聞き: 2千で、10倍以上の相手の大将を。舞ってから出ていったの、かっこよすぎでしょ。
        detail: {box: [0, 150, 1100, 960], label: 左下に「今川義元」の名札}
        mark: {type: circle, at: [200, 700, 290, 900]}
      - 語り: 8年後、信長は、ある町に、とんでもない額のお金を求めます。
        hook: true

  # ---------------------------------------------------------------- 4 上洛と堺：挿絵・用語・肖像・場所の地図・calc・reaction・detail
  - title: 1568年 上洛と堺の2万貫
    background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）"}
    year: 1567
    lines:
      - 語り: 1567年、信長は美濃の稲葉山城を落とし、名を岐阜と改めます。この年から使い始めた印の文字が、《天下布武》です。
        card: {head: 1567年, body: 稲葉山城を落とす}
        icon: seal
      - 語り: 武力で天下を取る宣言、と読まれてきました。近年は、天下は京都を中心とする畿内で、将軍を支える意味だ、という読みが有力です。
      - 語り: 1568年9月、信長は足利義昭を立てて、京都に上ります。義昭は、この年に将軍になりました。
        background: {image: paintings/nobunaga_rakuchu_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        portrait: {image: paintings/nobunaga_yoshiaki_portrait.jpg, caption: "足利義昭（江戸時代の写し）"}
        card: {head: "1568年9月", body: 義昭を立てて京都へ}
      - 聞き: 将軍を立てて京都入り。それで、さっき言ってた「とんでもない額のお金」は？
      - 語り: 同じ1568年、信長は堺の町に、戦の費用として2万貫を求めました。これを《矢銭》と言います。
        background: {image: paintings/nobunaga_teppo_sakai_gunsmith.jpg, credit: "『和泉名所図会』堺の鉄砲鍛冶（1796年）"}
        portrait: null
        short: s2
      - 語り: 京都の大工の日当100文を、今の1万円として数えると、こうなります。
        figure: {type: calc, title: 堺に求めた矢銭, terms: [[2万貫, 1568年], [約10万円, 1貫あたり], [約20億円]], ops: [×, ＝]}
        short: s2
      - 聞き: 20億円！？ ひとつの町に？
        tone: 驚き
        reaction: {number: 約20億円, lead: 堺への矢銭は, say: 桁がちがう！}
        short: s2
      - 語り: 日当で数えた目安です。堺の商人たちは、はじめ断りましたが、今井宗久が説得して、払うことになったと言われます。
        figure: null
        short: s2
      - 語り: 宗久は信長のもとで領地と代官の役を得て、鍛冶を集め、鉄砲や火薬づくりにも関わりました。
        detail: {box: [0, 690, 1730, 2200], label: 鉄砲をつくる堺の鍛冶（江戸の本の挿絵）}
        short: s2
      - 語り: その鉄砲が、のちの長篠で何挺使われたのか。記録によって、数が3倍もちがいます。
        hook: true

  # ---------------------------------------------------------------- 5 長篠：bars の upto＋strike・detail＋circle・numberline
  - title: 1575年 長篠の戦い
    background: {image: paintings/nobunaga_nagashino_screen_full.jpg, credit: "長篠合戦図屏風（江戸時代）"}
    year: 1575
    lines:
      - 語り: 1575年5月、三河の長篠。信長と徳川家康の軍が、武田勝頼の軍を破ります。
        card: {head: "1575年5月", body: 長篠の戦い}
        short: s1
      - 聞き: 知ってる！ 鉄砲隊が3列に並んで、順番に撃ったやつでしょ。
        short: s1
      - 語り: その鉄砲の数を、記録ごとに比べます。家臣の書いた『信長公記』では、千ほど。
        figure: {type: bars, title: 長篠の鉄砲の数, bars: [[信長公記, 1000], [甫庵信長記, 3000]], labels: [千挺ばかり, 三千挺], upto: 1}
        short: s1
      - 語り: 江戸の初めの『甫庵信長記』になると、三千に増えます。
        figure: {type: bars, title: 長篠の鉄砲の数, bars: [[信長公記, 1000], [甫庵信長記, 3000]], labels: [千挺ばかり, 三千挺], upto: 2}
        mark: {type: strike, at: 2, text: 後の本}
        short: s1
      - 聞き: 後の本ほど3倍に増えるって、話を盛ってない？
        short: s1
      - 語り: しかも、三段に分かれて順に撃った、という書き方は、『信長公記』にはありません。
        detail: {box: [1240, 200, 1880, 760], label: 柵と鉄砲隊（戦いから約150年後の屏風）}
        short: s1
      - 聞き: でも、この絵だと、柵の後ろに鉄砲隊がずらっと並んでるよ。
        detail: {box: [1240, 200, 1880, 760], label: 柵と鉄砲隊（戦いから約150年後の屏風）}
        mark: {type: circle, at: [1430, 330, 1640, 560]}
      - 語り: 武田軍の死者の数も、記録で大きくちがいます。
        background: {image: paintings/nobunaga_nagashino_screen_toyota.jpg, credit: "長篠合戦図屏風（豊田市郷土資料館蔵、江戸時代）"}
        figure: {type: numberline, title: 長篠の武田軍の死者（記録）, items: [[多聞院日記, 1000], [信長公記, 10000]], unit: 人, focus: 信長公記}
      - 聞き: 千人と1万人！？ 10倍もちがったら、どっちを信じればいいの。
        figure: {type: numberline, title: 長篠の武田軍の死者（記録）, items: [[多聞院日記, 1000], [信長公記, 10000]], unit: 人, focus: 信長公記}
        mark: {type: circle, at: 2}
      - 語り: 本当の数は、分かっていません。そして、信長の最期にも、分かっていないことが残っています。
        figure: null
        hook: true

  # ---------------------------------------------------------------- 6 本能寺：detail＋underline
  - title: 1582年 本能寺の変
    background: {image: paintings/akechi_honnoji_nobukazu_1896.jpg, credit: "楊斎延一《本能寺焼討之図》1896年"}
    year: 1582
    lines:
      - 語り: 1582年6月2日の本能寺に戻ります。この明治の絵では、右の御簾の奥に、信長が描かれています。
        card: {head: "1582年6月2日", body: 本能寺の変}
        detail: {box: [2560, 0, 3200, 1100], label: 御簾の奥の織田信長（明治の想像図）}
      - 聞き: 名札がついてる。でも、明治の絵描きさんも、その場を見たわけじゃないよね。
        detail: {box: [2560, 0, 3200, 1100], label: 御簾の奥の織田信長（明治の想像図）}
      - 語り: そうです。記録で言えるのは、本能寺で最期を迎えたこと。遺体は見つかっていません。翌年の肖像には、亡くなった日が書き込まれています。
        background: {image: paintings/akechi_nobunaga_chokoji_1583.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
      - 聞き: 左上の、この一行かな。天正十年、六月二日、御他界。
        detail: {box: [520, 180, 780, 1060], label: 「天正十年六月二日御他界」}
        mark: {type: underline, at: [560, 1020, 740, 1020]}
      - 語り: はい。天正10年は、1582年です。燃える中の舞ではなく、この書き込みが、信長の最期を伝えています。
        detail: {box: [520, 180, 780, 1060], label: 「天正十年六月二日御他界」}
      - 聞き: じゃあ、この49年を並べると、信長って結局、何者だったの？
        hook: true

  # ---------------------------------------------------------------- 7 まとめ：line・締め・次回予告
  - title: まとめ：織田信長とは何者だったのか
    background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
    lines:
      - 語り: 今日の出来事を、信長の歳で並べてみます。
        figure: {type: line, title: 出来事と信長の歳（満）, points: [[1560年, 25], [1568年, 34], [1575年, 40], [1582年, 47]], unit: 歳}
      - 聞き: 25歳で桶狭間、47歳で本能寺。20代から40代まで、ずっと戦ってたんだね。
        figure: {type: line, title: 出来事と信長の歳（満）, points: [[1560年, 25], [1568年, 34], [1575年, 40], [1582年, 47]], unit: 歳}
      - 語り: 1つ目。天下布武は、全国を力で取る宣言ではなく、将軍を支える意味だった、という読みが有力です。
        figure: null
      - 聞き: 全部を壊す人っていうより、古いしくみを上手に使った人？ 思ってた魔王っぽさと、だいぶちがう。
      - 語り: 2つ目。三段撃ちも、本能寺の舞も、後の時代の本や物語が付け足した姿です。
      - 聞き: あーし的には、記録の信長は、派手な伝説より、ずっと用意のいい人、って覚えとく。
      - 語り: 今日の地層は、ここまでです。
        background: {image: paintings/nobunaga_portrait_kobe.jpg, credit: "《織田信長像》1583年ごろ（神戸市立博物館蔵）"}
      - 聞き: 次回は江戸の鎖国。日本って、ほんとに国を閉じてたの？
      - 語り: 知っている信長の話があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
