# 道具を全部使う見本（2026-10-08 作り直し）。投稿しない。道具を足したり描き方を変えたりしたら、これで
# check → draft → qc → shorts --draft を通し、行ごとのコマを目で見る（組み合わせの不具合を探すため）。
#
# 10-08 ユーザー指摘「会話している内容と画面の内容が合ってない」で作り直した。
# 前の見本は道具を並べることを先に決め、話をあとから当てたので、「京都の本能寺」に京都の町の屏風、
# 「1568年、堺に矢銭」に長篠の屏風、「次回は江戸の鎖国」に江戸の地図が出ていた。
# 今回は話の流れを先に組み（生まれた順に節を分け、1節1つの山場）、道具は話に合う所にだけ置いた。
# 背景はその行で話している場面の絵。check の「話と画面」の知らせは0件。
#
# 使っている道具：versus・肖像（この時○歳）・吹き出し・人物の言葉（幸若舞『敦盛』）・bars の upto と赤ペン（circle・strike）・
# detail と赤ペン（circle・underline）・calc・reaction・挿絵・用語の札・場所の地図（堺）・numberline・line・年表・
# recap・texture・次回予告、サムネの layout と hooks（reactor・contrast）、ショートの hook と loop。
# 事実は research/nobunaga_facts.md・nobunaga_facts2.md にあるものだけ。お金は「京都の大工の日当100文を今の1万円」。
# 年齢は肖像の「この時○歳」（満）と合わせ、語りで数えの歳を言うときは「数えで」と言う。
title: 織田信長の49年｜大うつけ・桶狭間・堺の2万貫・長篠・本能寺を記録で掘る
