# 道具を全部使う見本（2026-10-08）。投稿しない。道具を足したり描き方を変えたりしたら、これで
# check → draft → qc → shorts --draft を通し、節ごとのコマを目で見る（組み合わせの不具合を探すため）。
# 使っている道具：真ん中の額・detail・mark・図の upto・stats・calc・numberline・line・versus・reaction・
# recap・texture・用語の札・場所の地図・肖像（この時○歳）・吹き出し・挿絵・人物の言葉・年表・次回予告、
# サムネの layout と hooks（reactor・contrast）、ショートの hook と loop。
# 事実は nobunaga.yaml の控え（research/nobunaga_facts.md）から。お金は「京都の大工の日当100文を今の1万円」。
