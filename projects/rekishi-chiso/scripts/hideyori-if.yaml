- title: 想像③ 慶長20年 国松・天秀尼・千姫のその後
  background: *id010
  year: 1615
  lines:
  - 語り: 史実の国松は、5月8日に城を出て、21日に伏見で捕まり、23日に処刑されました。
    portrait: null
    background: *id010
    card:
      head: 史実では
      body: 国松は5月23日に処刑された
  - 語り: 板倉勝重に引き渡され、二条城の秀忠のもとへ連れていかれました。国松の行く末も、将軍の手にあったように見えます。
    card:
      head: 史実では
      body: 国松は二条城の秀忠のもとへ
  - 聞き: 秀忠が、国松のことも決める立場だったのか。
  - 語り: もしもでは、父の秀頼が生きています。国松は、どうなるのか。
    card:
      head: ここから想像
      body: 想像③ 国松と、豊臣の血
    background: *id014
  - 聞き: 父が生きていたら、国松の道も変わるのかな。
    tone: 疑問
  - 語り: 手がかりは、宇喜多秀家の前例です。息子たちは、父と一緒に八丈島へ送られました。
  - 語り: 助かる道もある、という程度です。国松を残せば、豊臣の名が残ります。徳川がそれを嫌った、と見ることもできます。
    card:
      head: ありうる
      body: 国松が助かる道もある
    background: *id014
  - 聞き: 国松を残せば、豊臣の名が残る……。徳川からしたら、それは怖いよね。
  - 語り: 天秀尼は、史実でも助命されました。千姫の養女として寺へ入る道は、秀頼が生きていても、変わらないでしょう。札は、高い、です。
    portrait: null
    background: *id019
    card:
      head: 高い
      body: 天秀尼は史実でも助命
  - 聞き: 女の子が助かるのは、同じか。千姫は、どうなるの？ 夫が生きてるんだよね。
  - 語り: 史実の千姫は、翌年に本多忠刻と再婚します。夫の秀頼が生きていれば、再婚はできません。江戸へ戻るのか、行き先へ付いていくのか。決める手がかりがありません。
    portrait: *id015
    card:
      head: ほぼ妄想
      body: 千姫のその後は材料なし
    background: *id018
  - 聞き: 夫が生きてると、再婚はできないもんね。千姫の人生は、まるで変わっちゃう。
  - 語り: 淀殿も同じです。史実では、秀頼と山里曲輪で亡くなります。仮定は秀頼ひとりの生存なので、淀殿がどうなるのかは、決められません。
    portrait: *id020
    background: *id011
    card:
      head: ほぼ妄想
      body: 淀殿の運命は決められない
  - 聞き: 母の淀殿まで入れると、考えることが一気に増えるね。ひとりが助かるだけで、周りの全員が動くんだ。表にまとめて見たいな。
    hook: true
  - 語り: 次は、人の運命を、表にします。
    hook: true
    background: *id003
