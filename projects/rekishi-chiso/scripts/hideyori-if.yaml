      body: 口伝は年齢が合わず裏づけ限り
  - 語り: 同時代の記録は、自害と書きます。ですから今日は、薩摩へ逃げた話を事実とはしません。「自害しなかったら」という想像として、考えます。
    background: *id002
  - 聞き: 伝説は、伝説として別に置いておくのか。でも、秀頼が助かる道は、記録のどこかにあったのかな。
    tone: 疑問
    hook: true
  - 語り: その道は、実際にあった選択肢から探します。まず、その後の徳川が、秀頼の周りの人に何をしたのかを見ます。
    hook: true
    background: *id009
- title: 慶長20年5月 国松・天秀尼・千姫のその後
  background: *id010
  year: 1615
  lines:
  - 語り: 豊臣の子どもたちに、徳川は何をしたのか。秀頼の子、国松は、数え8歳。5月8日に、秀頼と盃を交わして城を出た、と伝わります。21日に伏見で捕まりました。
    portrait: null
    background: *id001
    card:
      head: 慶長20年5月21日
      body: 国松が伏見で捕まる
    short: s4
  - 語り: 国松は、慶長13年の生まれ。母は側室とされますが、諸説あります。
    short: s4
  - 聞き: 伏見って、京都のすぐ南にあるのか。城を出てから、2週間近くも逃げていたのか。
    short: s4
    background: *id010
  - 語り: 23日、京都の六条河原で斬首されます。西暦では1615年6月19日です。
    short: s4
    card:
      head: 慶長20年5月23日
      body: 国松が処刑される
  - 語り: 乳兄弟を先に捕らえて本人と確かめた、という話もありますが、伝承で、今日は使いません。
  - 聞き: 8歳……。小学1年生くらいだよ。小さすぎるよ。
    tone: しみじみ
    short: s4
    background: *id003
  - 語り: 一方、娘の天秀尼は、数え7歳。5月12日に捕まりますが、千姫の養女として寺に入ることを条件に、助命されました。鎌倉の東慶寺で出家します。
    background: &id019
      image: paintings/nene_kodaiji_autumn_ndl_trim.jpg
