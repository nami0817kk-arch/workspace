en:
  title: What If Toyotomi Hideyori Had Survived Osaka? | 20 Hours Between the Plea and His Death
  description: 'On the 7th day of the 5th month of Keicho 20 (June 3, 1615), around 4 p.m., a messenger ran from the burning Osaka Castle to the Tokugawa camp, traditionally to plead for the lives of Toyotomi Hideyori and his mother Yodo-dono. According to a letter of Mori Hidemoto, Ieyasu answered "it is up to the shogun", and the shogun Hidetada said "this is no longer the first time; make them commit seppuku soon". Around noon the next day, Hideyori died in a storehouse in the Yamazato enclosure. That is about 20 hours, by our own count from the traditional times. This video asks: what if he had not died?


    We keep records, theories and imagination apart. First, what the sources say: Hideyori as a person and the Nijo Castle meeting, the road from the bell inscription incident to the summer campaign, Princess Sen''s escape and the plea for mercy, the fate of his son Kunimatsu and his daughter Tenshu-ni, the legend that he fled to Satsuma (a later tale), and four other paths that really existed: relocation to Yamato or Ise, the shogun''s judgment, the precedent of Ukita Hideie who was spared and sent to Hachijo Island, and Matsudaira Tadateru, the shogun''s younger brother, who was exiled but lived to 92.


    Then, clearly marked imagination with reasons: Princess Sen pleads with Hidetada, Hideyori and Ieyasu face each other, a table of fates, how Japan would differ, and chains to today.


    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so. We have not read the original letters and books; the accounts follow summaries on Wikipedia and general-audience articles.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'May 7, Keicho 20: The Plea Answered with "It Is Up to the Shogun"'
  - '1611: The Meeting at Nijo Castle and Who Hideyori Was'
  - '1614-15: From the Bell Inscription to the Fall of Osaka Castle'
  - 'The Night of May 7-8: Princess Sen''s Escape and the Yamazato Enclosure'
  - 'The Survival Legend: Did He Flee to Satsuma?'
  - 'After the Fall: Kunimatsu, Tenshu-ni, Princess Sen, the New Osaka Castle'
  - 'Other Paths in the Sources: Relocation, the Shogun''s Judgment, Ukita Hideie, Tadateru'
  - 'Imagination 1: The Morning of May 8 - Princess Sen and Hidetada'
  - 'Imagination 2: Hideyori and Ieyasu Face to Face'
  - 'Imagination 3: Kunimatsu, Tenshu-ni, and the Toyotomi Line'
  - 'Imagination 4: A Table of Fates - Who Becomes What?'
  - 'Imagination 5: How Japan Changes, and the Chains to Today'
  - 'Summary: The 20 Hours Before Noon on May 8'
