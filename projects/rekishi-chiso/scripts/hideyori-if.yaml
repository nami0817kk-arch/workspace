- title: 別の道 国替え・将軍の判断・宇喜多秀家
  background: *id003
  year: 1615
  lines:
  - 語り: 想像の前に、史料に残る別の道を、4つ見ます。当時の人が実際に考えた選択肢と、実際にあった前例だけです。1つ目。国替えです。
    portrait: null
    background: *id003
    card:
      head: 別の道 1
      body: 大和か伊勢へ国替え
  - 語り: 慶長20年3月15日、徳川方は、新しく召し抱えた浪人の全員追放か、豊臣家を大和か伊勢へ移す国替えを求めました。4月5日、大野治長は、国替えは受け入れられない、と答えます。
    background: &id012
      image: paintings/ieyasu_edo_zu_byobu_castle_detail.jpg
      credit: 江戸図屏風（江戸城の部分、17世紀寛永期）
  - 聞き: 国替えを受けてたら、夏の陣は無かったのかな。大名として、残れたのかも。
    tone: 疑問
  - 語り: 戦いが避けられた可能性は、あります。ただ、そのあとの扱いは、記録がありません。
    background: &id013
