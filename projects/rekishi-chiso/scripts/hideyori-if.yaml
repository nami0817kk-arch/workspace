# B（歴史の転換点の if ストーリー）。型：事実（大坂夏の陣・5/7〜8の城内・千姫の脱出と助命の願い・国松と天秀尼のその後・生存説は後世の伝説）→ 史料に残る別の道（国替え／将軍の判断／宇喜多秀家／松平忠輝）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/hideyori_if_facts.md（確実／有力／説／伝承／未確認の区分もそこ）。絵の一覧は hideyori_if_assets.md。
# 既存：scripts/sanada.yaml（夏の陣の戦い・信繁の突撃は任せる。ここでは1行で触れるだけ）・sekigahara-if.yaml・mikata-if.yaml（型の見本）。重ならないよう、この回は「5月7日の午後4時〜8日の正午」と「その後の徳川の処置」に集中する。
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の千姫想像・秀忠想像・秀頼想像・家康想像）
#   ③記録のセリフは想像の節に置かない（毛利秀元の手紙の言葉は史実の節で語りが読む。想像の節では「史実では」と前置きして触れる）
#   同じ幕で声が重ならない：第1幕＝千姫（冥鳴ひまり）と秀忠（青山龍星）／第2幕＝家康（麒ヶ島宗麟）と秀頼（白上虎太郎）
# 分岐点は1つだけ：5月8日の朝、千姫の取りなしで秀忠が助命を受け入れ、秀頼が自害せず生き延びる。ほかは史実のまま（落城・徳川の勝ち）。
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）と表で正直に出す。
#   高い＝決める力は秀忠にあった（家康は「将軍様次第」と答えた＝事実の並置）／天秀尼は史実でも助命された／夏の陣の勝敗は変わらない（仮定は落城のあと）／決める人が二人いる（家康と将軍）。
#   ありうる＝命は取らず出家・配流（宇喜多秀家・松平忠輝の前例）／国松が助かる道もある（秀家の息子たちは八丈島へ同行）／大坂城の再築は同じ／浪人が頼る名は残る／天下は揺るがない／期限と条件・窓口の消滅。
#   ほぼ妄想＝説得が通るか・使いが正午の鉄砲の前に間に合うか／配流先／家康と秀頼の対面／千姫のその後／淀殿の運命／江戸幕府の長さ。
# 研究：「秀頼が生き延びていたら」を正面から論じた研究は、今回の調査では見つかっていない（冒頭と各想像の節で断る）。近い論点：黒田基樹（片桐且元の排除が決定打・夏の陣で徹底抗戦したので助命はかなわなかった＝一般向け記事の前文のみ確認。本文・『羽柴家崩壊』未読）、福田千鶴『豊臣秀頼』（2014）は秀頼評価の実証的研究（本文未読）。
# 数字：「何の数か」を言う。約20時間＝通説の時刻（5/7 午後4時ごろ→5/8 正午ごろ）から自分で数えた。兵数は言わない。身長6尺5寸・体重43貫は『明良洪範』（後世の書）と断る。32人は二次の紹介と断る。西暦：5/7＝1615年6月3日、5/8＝6月4日。
# 使わない話：吉田御殿／坂崎直盛が千姫を救う話／国松の乳兄弟の確認（使うなら伝承と断る＝今回は伝承と断って1行）／秀頼は秀吉の子でない説／薩摩逃亡・谷山の墓・木下家系図を事実として／内堀まで埋めたこと／家康が秀頼を恐れた／遺体・首の描写／真田信繁の最期の詳細／ネット掲示板・知恵袋・個人ブログ・note の「もし秀頼が〜」。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像は額）／極端に横長の絵（縦横比2.4:1以上）は使わない／大坂夏の陣図屏風（群衆の戦場）は夏の陣の話（第3・4節と、夏の陣の結果を言う1行）にだけ使う／NDL系の絵図は切り抜いた版／血・遺体・首の絵は使わない／
#   現代の写真は使っていない（二条城は古写真と断る）。芳虎《大坂落城》・カロンの銅版画は後世・欧州の想像図と断る。
