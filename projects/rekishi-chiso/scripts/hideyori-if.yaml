      credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
  - 語り: 2つ目。将軍の判断です。家康は、助命の願いに「将軍様次第」と答えました。決める力は、将軍の秀忠にあった、ということです。
    portrait: &id016
      image: paintings/mikata_tokugawa_hidetada_kano.jpg
      caption: 徳川秀忠（狩野派の下絵、17世紀）
      age: false
    background: *id012
    card:
      head: 別の道 2
      body: 決めるのは将軍・秀忠
  - 聞き: 最後に決めたのは、家康じゃなくて、秀忠か。
  - 語り: 次は、負けた側の命を助けた前例です。宇喜多秀家は、関ヶ原の西軍の大将格でした。薩摩に隠れましたが、慶長8年に助命が決まり、慶長11年、八丈島へ送られます。
    portrait:
      image: paintings/mitsunari_ukita_hideie_portrait.jpg
      caption: 宇喜多秀家（肖像の模写）
      age: false
    background: *id013
    card:
      head: 別の道 3
      body: 宇喜多秀家は助命され八丈島へ
    short: s5
  - 語り: 秀家は、明暦元年、84歳まで生きました。息子たちも、八丈島へ同行しています。助命の嘆願者は、はっきりしていません。
    short: s5
    background: &id014
      image: paintings/ieyasu_edo_keicho_ezu_1608.jpg
      credit: 《慶長江戸図》1608年（東京都立中央図書館蔵）
  - 聞き: 秀家は84歳まで生きたのか。島流しでも、命があれば長いんだ。
    short: s5
  - 語り: もう一つ、身内の処分です。家康の六男、松平忠輝は、夏の陣のあとの元和2年、兄の秀忠に改易され、配流されました。亡くなったのは92歳。命は、取られませんでした。
    portrait: null
    background: *id014
    card:
      head: 別の道 4
      body: 将軍の弟は配流で命を取られず
  - 聞き: 命を助けて、遠くへやる。徳川は、そういう処分もしてたのか。
  - 語り: つまり、助命の道は、無いわけではありませんでした。けれど、豊臣宗家の秀頼を生かした例は、見つかっていません。
    short: s5
    background: *id010
  - 語り: 黒田基樹さんは、一般向けの記事で、夏の陣で徹底抗戦したので助命はかなわなかった、と書いています。本文までは読めていません。
    background: *id003
    card:
      head: 黒田基樹さんの指摘
      body: 徹底抗戦したので助命はかなわず
  - 聞き: 助けない理由は書いてあって、助ける材料は少ないのか。それでも、考えるの？
    tone: 疑問
    hook: true
  - 語り: はい。仮定を置いて、想像で掘ります。
    hook: true
