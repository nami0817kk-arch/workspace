    portrait: null
    tone: しみじみ
  - 語り: ここでは、千姫の取りなしで、秀忠が考えを改めると想像します。ここで言える根拠は、決める力が秀忠にあったことだけです。札は、高い、です。
    background: *id011
    card:
      head: 高い
      body: 決める力は秀忠にあった
  - 聞き: 決めるのは秀忠だったから、秀忠が動けば、流れは変わる、ってことか。
  - 語り: 命は取らず、出家させて遠くへやる。この処分は、宇喜多秀家や松平忠輝の前例があります。札は、ありうる、です。
    card:
      head: ありうる
      body: 命は取らず出家・配流
    background: *id003
  - 聞き: 前例があるなら、突拍子もない話じゃない、ってことか。
  - 語り: ただ、千姫の言葉で秀忠が変わったのか。使いが正午の鉄砲の前に間に合ったのか。そこは、手がかりがなく、ほぼ妄想、の札です。
    background: *id001
    card:
      head: ほぼ妄想
      body: 説得が通ったか・間に合ったかは材料なし
  - 聞き: 間に合うかどうかが、いちばん怖いところ。それで、秀頼は、どうなるの？
