    who: 家康想像
    portrait: *id017
    background: *id018
  - 人物: 「大御所さま。千姫は、無事でございますか」
    who: 秀頼想像
    portrait: *id005
    background: *id018
  - 人物: 「無事じゃ。わしにも、そなたの命を助けてくれと、頼んできた」
    who: 家康想像
    portrait: *id017
  - 人物: 「大御所さま。わたくしの命で、すべてを終わらせるお考えかと、覚悟しておりました」
    who: 秀頼想像
    portrait: *id005
  - 人物: 「命は取らぬ。ただし、髪を下ろせ。大坂には、二度と戻れぬと思え」
    who: 家康想像
    portrait: *id017
    background: *id011
  - 人物: 「命が残っても、豊臣の名は、もう名乗れませぬな」
    who: 秀頼想像
    portrait: *id005
    background: *id011
  - 人物: 「名は捨てよ。じゃが、生きておれば、見えるものもある」
    who: 家康想像
    portrait: *id017
  - 人物: 「……承知いたしました。ひとつだけ、願いがございます。子の、国松の命を」
