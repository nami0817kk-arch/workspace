sections:
- title: 慶長20年5月7日 助命の願いに「将軍様次第」と返事があった
  background: &id002
    image: paintings/sanada_osaka_rakujo_wul_trim.jpg
    credit: 《大阪落城図》（早稲田大学図書館蔵、江戸時代）
  year: 1615
  lines:
  - 語り: 慶長20年5月7日の午後4時ごろ。落城した大坂城から、徳川の陣へ使いが走ります。通説では、豊臣秀頼と淀殿の助命を願う使いでした。
    portrait: &id005
      image: paintings/hideyoshi_hideyori_edo.jpg
      caption: 豊臣秀頼（伝 花野光明筆、17世紀）
      age: false
    card:
      head: 慶長20年5月7日
      body: 助命の願い（1615年6月3日）
    short: s1
  - 語り: 返事は、毛利秀元の手紙の1通に、こう書かれています。家康は「将軍様次第」。将軍の秀忠は「もはや一度ではない。早く腹を切らせよ」。
    short: s1
    background: &id001
      image: paintings/sanada_osaka_uno_toshi_wul_trim.jpg
      credit: 《大坂卯年図》（早稲田大学図書館蔵、1615年ごろ）
  - 語り: 翌5月8日の正午ごろ、通説では、秀頼は山里曲輪の蔵で自害します。数え23歳。西暦では1615年6月4日です。
    short: s1
    card:
      head: 慶長20年5月8日
      body: 秀頼が自害（1615年6月4日）
    background: &id004
      image: paintings/nene_osaka_castle_summer_screen_detail.jpg
      credit: 大坂夏の陣図屏風（部分、17世紀前半）
  - 聞き: 助けてほしいって願いは、前の日にはもう出てたの……？ それでも、だめだったんだ。
    tone: しみじみ
    short: s1
  - 語り: 願いが出てから自害まで、通説の時刻で数えると約20時間です。これは自分の計算です。この20時間のあいだに、返事が変わっていたら。それが、今日の「もしも」です。
    figure:
      type: stats
      title: 助命の願いから自害まで
      items:
      - - 願いが出た
        - 午後4時ごろ
        - 5月7日・通説
      - - 自害
        - 正午ごろ
        - 5月8日・通説
      - - そのあいだ
        - 約20時間
        - 自分の計算
    background: *id001
  - 語り: そこで、今日の問いは3つ。秀頼は、どうなったのか。秀頼の子、国松は、助かったのか。そして、徳川の天下は、揺らいだのか。
    card:
      head: 今日の3つの問い
      body: 秀頼は？ 国松は？ 天下は？
    background: &id003
      image: paintings/sanada_osaka_summer_wul_i17_trim.jpg
      credit: 《大坂夏之陣》絵図（早稲田大学図書館蔵、江戸時代）
  - 聞き: 国松って、秀頼の子どものことか。3つとも、気になるなあ。
  - 語り: 仮定は、ひとつだけ。慶長20年5月8日、大坂城が落ちたあと、秀頼が自害せず、生き延びた。形は、千姫の取りなしで助命された、とします。夏の陣の勝敗も、落城も、史実のままです。
    portrait: null
    figure: null
    card:
      head: 今日の仮定
      body: 秀頼が自害せず生き延びた
    background: *id002
  - 聞き: ひとつだけって、約束だよね。変わるのは、5月8日の朝からか。
    tone: 疑問
  - 語り: 先に断ります。秀頼が生き延びた場合を、正面から論じた学術研究は、今回の調査では見つかっていません。
    background: *id003
    card:
      head: 最初の断り
      body: 論じた研究は見つからない
  - 聞き: 研究がまだ無いなら、材料は、何を使うの？
    tone: 疑問
  - 語り: 約束が2つ。事実と想像は分け、想像のあいだは《ここから想像》の札を出します。可能性は、高い、ありうる、ほぼ妄想の3段階で示します。
    card:
      head: この回の約束
      body: 事実と想像を分け、札を付ける
    background: *id004
  - 聞き: 札は3つね。材料は、本物だけにしてよ？
  - 語り: はい。当時の記録と、実際にあった選択肢だけです。まず、秀頼がどんな人だったのかから、掘ります。
    background: &id008
      image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg
      credit: 大坂夏の陣図屏風（黒田家本、17世紀）
- title: 慶長16年 二条城の会見と、秀頼という人
  background: &id006
    image: paintings/ryoma_kyoto_nijo_castle_before1902.jpg
    credit: 二条城（1902年以前の古写真）
  year: 1611
  lines:
  - 語り: 秀頼は、文禄2年、1593年に大坂城で生まれました。父は豊臣秀吉、母は淀殿。秀吉が亡くなったのは、数え6歳のときです。
    portrait: *id005
    card:
      head: 1593年
      body: 秀頼が大坂城で生まれる
    background: *id003
  - 聞き: 数え6歳で父を亡くして、大坂城のあるじか……。幼稚園の年長くらいじゃん。そんな秀頼は、家康とは、会ったことがあるの？
    tone: 疑問
  - 語り: 慶長16年3月28日。数え19歳の秀頼は、京都の二条城で、家康と会見します。画面は二条城の古写真で、建物は当時のものとは限りません。
    background: *id006
    portrait: &id017
      image: paintings/ieyasu_portrait_toshodaigongen.jpg
      caption: 徳川家康（伝 狩野探幽筆、江戸前期）
      age: false
    card:
      head: 慶長16年3月28日
      body: 二条城で家康と会見
  - 語り: この会見の評価は、割れています。秀頼が家康に臣従した場だとみる説と、豊臣が対等を保った場だとみる説です。史家のあいだでも、決着していません。
    portrait: null
    background: *id001
  - 聞き: 同じ会見なのに、正反対の読み方があるのか。
  - 語り: では、秀頼本人は、どんな人だったのか。体格は、江戸時代の『明良洪範』に、身長6尺5寸、体重43貫とあります。約197センチ、約161キロです。
    background: &id007
      image: paintings/hideyoshi_daibutsu_okyo.jpg
      credit: 円山応挙《京大仏図》（方広寺の大仏殿、1796年以前）
    portrait: *id005
    card:
      head: 『明良洪範』
      body: 身長6尺5寸・体重43貫
  - 語り: 当時の記録ではなく、数字はそのまま事実とは言えません。
  - 語り: 賢かったのか、愚かだったのか。『豊内記』は礼と義を重んじる人と評し、レオン・パジェスは頑固な迷信で失敗したと書きます。どちらも後の時代の書です。
    background: *id001
  - 語り: 近年は、福田千鶴さんが2014年に『豊臣秀頼』を出し、徳川を中心にした見方を改める実証的な研究を進めました。秀頼の評価は、いまも動いています。
    background: &id010
      image: paintings/nene_kyoto_map_1696.jpg
      credit: 《元禄9年 京都図》1696年
    card:
      head: 2014年
      body: 福田千鶴『豊臣秀頼』
  - 聞き: 凡庸だったから滅んだ、とは、言い切れないのか。
    hook: true
  - 語り: その秀頼の城で、慶長19年、ひとつの鐘の文字が問題になります。
    hook: true
    background: *id007
- title: 慶長19年〜20年 鐘銘の問題から夏の陣の落城まで
  background: *id007
  year: 1614
  lines:
  - 語り: 慶長19年。徳川の側が、方広寺の鐘に刻まれた「国家安康」「君臣豊楽」の字を問題にします。豊臣方は、弁明に動きました。
    portrait: &id021
      image: paintings/sanada_katagiri_katsumoto_portrait.jpg
      caption: 片桐且元（江戸時代の肖像）
      age: false
    background: *id007
    card:
      head: 慶長19年
      body: 方広寺の鐘銘が問題に
  - 語り: 豊臣方の家老、片桐且元は駿府へ行き、9月に三つの案を語ります。秀頼が江戸へ参勤する、淀殿を人質に出す、大坂城を明け渡す。
  - 聞き: 参勤する、人質に出す、城を渡す……。どれも、簡単にはうなずけないよ。
    background: *id003
  - 語り: この三案が、家康の要求だったのか、且元自身の考えだったのかは、はっきりしていません。大坂へ伝わった中身が偽りだった、とみる見方もあります。
  - 聞き: 三つのうち、どれかを選んでたら、戦にならなかったのかな。
    tone: 疑問
    background: *id008
  - 語り: 10月1日、且元は大坂を退去し、家康は諸大名に出兵を命じます。冬の陣です。12月22日に和睦。本丸を残して堀を埋め、秀頼の身の安全と本領は、約束されました。
    portrait: null
    background: *id003
    card:
      head: 慶長19年12月22日
      body: 冬の陣の和睦
  - 聞き: 和睦で、身の安全は約束されたの？ それなのに、また戦になったんだ。
  - 語り: 慶長20年の春、浪人が集まり、堀を掘り返している、という報せが駿府に届きます。4月、家康と秀忠が出陣し、夏の陣が始まります。
    card:
      head: 慶長20年4月
      body: 家康・秀忠が出陣
    background: *id004
  - 語り: 5月6日は、道明寺と若江・八尾の戦い。7日の天王寺口の戦いで、豊臣方は午後3時ごろに崩れ、大坂城へ退きます。戦いの細かい経過は、真田幸村の回で掘りました。
    background: *id008
    card:
      head: 慶長20年5月7日
      body: 天王寺口の戦い、午後3時ごろ崩れる
  - 語り: その後、城内の大台所に火が放たれ、落城します。ここから、助命の願いの約20時間が始まります。
    background: *id004
  - 聞き: 城が燃えるなかで、助けてって願いが出たの？ 誰が、誰に？
    tone: 疑問
    hook: true
  - 語り: 城の中で、何が起きていたのか。順に見ます。
    hook: true
- title: 5月7日夜 千姫の脱出と山里曲輪の最期
  background: *id001
  year: 1615
  lines:
  - 語り: 大野治長は、千姫を城から出し、自分は切腹するので、秀頼と淀殿を助けてほしいと願い出させようとした、と伝わります。通説です。
    portrait: &id015
      image: paintings/hideyori_senhime_portrait.jpg
      caption: 千姫（江戸時代の肖像）
      age: false
    background: *id001
    card:
      head: 慶長20年5月7日
      body: 千姫が城を出る
    short: s2
  - 語り: 千姫は、秀頼の妻で、家康の孫、秀忠の娘です。数え19歳。慶長8年、数え7歳で、数え11歳の秀頼に嫁ぎました。
    short: s2
  - 語り: 脱出の様子は、後年の記録『老談一言記』に、千姫に仕えた侍女の証言として残ります。侍女たちが布団で千姫を包んで矢を防ぎ、堀内主水に護られて、徳川方の陣へ送られた、とあります。
    short: s2
    background: *id004
    card:
      head: 『老談一言記』
      body: 侍女の証言（後年の記録）
  - 聞き: 布団で包んで、矢を防いで……。必死だったんだろうな。
    tone: しみじみ
    short: s2
  - 語り: 救出は、祖父の家康の命によるものとされます。坂崎直盛が千姫を救った、という有名な話は、後世の逸話で、今日は使いません。
    background: *id002
  - 語り: そのころ、秀頼と淀殿は、天守で自害しようとしたと伝わります。速水甲斐守に止められ、山里曲輪へ移りました。山里曲輪は、本丸の北にある曲輪です。画面は、欧州の想像図です。
    portrait: &id020
      image: paintings/oichi_chacha_yodo_portrait.jpg
      caption: 淀殿（17世紀の肖像）
      age: false
    background:
      image: paintings/sanada_osaka_caron_1663.jpg
      credit: カロン『日本大王国志』の大坂城落城の挿絵（1663年、欧州の想像図）
    card:
      head: 山里曲輪
      body: 本丸の北にある曲輪
  - 聞き: 数え19歳で、燃える城のなかにいたのか。……想像がつかないな。
    tone: しみじみ
  - 語り: 5月8日。井伊直孝の軍が、山里曲輪の蔵を囲みます。正午ごろ、鉄砲が撃たれます。秀頼ら32人が自害し、そのあと蔵から火が上がった、とされます。通説で、人数は二次の紹介です。
    portrait: null
    background:
      image: paintings/ieyasu_osaka_rakujo_yoshitora.jpg
      credit: 歌川芳虎《大坂落城》1868年（後世の想像図）
    card:
      head: 慶長20年5月8日
      body: 山里曲輪の蔵を囲む
  - 語り: 画面は、後世の想像図です。
  - 語り: 同時代の記録でも、秀頼の最期は、自害と書かれています。『駿府記』、金地院崇伝の日記、伊達政宗の書状。細川忠興は、5月8日付の自筆の書状で、この日の決着を知らせています。
    background: *id003
  - 聞き: 記録では自害と書かれてるんだ。……じゃあ、なんで「生き延びた」って話が出るの？
    tone: 疑問
    background: *id001
  - 語り: 遺体が、はっきりしなかったからです。『大坂御陣覚書』は、秀頼の遺体は見分けがつかなかった、と書きます。
    background: *id004
  - 聞き: 遺体が分からないなら、噂も出るよね。
    hook: true
  - 語り: その噂を、順に見ます。
    hook: true
- title: 慶長20年のあと 秀頼生存説と薩摩の伝説
  background: &id009
    image: paintings/ryoma_satsuma_hiroshige_bonoura.jpg
    credit: 歌川広重《六十余州名所図会 薩摩 坊ノ浦 雙剣石》1856年
  year: 1615
  lines:
  - 語り: 豊臣秀頼には、生存説があります。いちばん有名なのが、薩摩へ逃げた、という話です。後世の伝説です。
    portrait: *id005
    background: *id009
    card:
      head: 生存説
      body: 後世の伝説（薩摩逃亡説）
    short: s3
  - 聞き: 薩摩に逃げた、って話、聞いたことあるかも。ほんとに、そう伝わってるの？
    tone: 疑問
    short: s3
  - 語り: 『採要録』という本には、薩摩の谷山に浪人が住み、住民は秀頼ではないかと噂した、とあります。鹿児島市には、秀頼の墓と伝わる塔も立っています。
    short: s3
