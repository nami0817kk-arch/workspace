  - 聞き: 男の子は処刑で、女の子は助命……。この差は、決まりだったの？
    tone: 疑問
  - 語り: 決まりが書かれた史料は、確かめられていません。事実として言えるのは、国松が処刑され、天秀尼が助命された、という個別の結果だけです。
    background: *id001
  - 語り: 千姫は、元和2年に本多忠刻と再婚し、寛文6年、70歳で亡くなりました。夜ごと男を招いたという吉田御殿の話は、史実ではありません。
    figure:
