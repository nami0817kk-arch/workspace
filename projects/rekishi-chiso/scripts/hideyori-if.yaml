- title: まとめ：慶長20年5月7日 助命の願いと、20時間の分かれ道
  background: *id003
  year: 1615
  lines:
  - 語り: 冒頭の3つの問いに答えます。1つ目。秀頼は、どうなったのか。想像では、命は取られず、出家して配流されます。決める力は、秀忠にありました。
    portrait: null
    background: *id003
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 秀頼は？
        - 出家して配流
        - ありうる
      - - 国松は？
        - 助かる道もある
        - ありうる
      - - 天下は？
        - 揺るがない
        - ありうる
      upto: 1
  - 聞き: 命は助かっても、どこへ行ったのかは、分からないままなのか。
  - 語り: どこへ送られたのかは、材料がありません。分かるのは、配流という道が、前例にあった、ということ。
    background: *id011
  - 語り: 2つ目。国松は、助かったのか。想像では、助かる道もあります。宇喜多秀家の息子たちは、父と一緒に八丈島へ行きました。それでも、助かる、と決めることはできません。
    background: *id011
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 秀頼は？
        - 出家して配流
        - ありうる
      - - 国松は？
        - 助かる道もある
        - ありうる
      - - 天下は？
        - 揺るがない
        - ありうる
      upto: 2
  - 語り: 3つ目。徳川の天下は、揺らいだのか。想像では、揺るがない。夏の陣の勝敗は、変わらないのですから。
    background: *id018
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 秀頼は？
        - 出家して配流
        - ありうる
      - - 国松は？
        - 助かる道もある
        - ありうる
      - - 天下は？
        - 揺るがない
        - ありうる
      upto: 3
  - 聞き: 3つとも、ありうる、か。言い切れるものは、ないんだ。
  - 語り: そうです。いまの3つの答えは、全部、想像です。史実で言えるのは、通説では5月7日の夕方に助命の願いが出たこと、5月8日に秀頼が自害したと記録に書かれていること。
    portrait: *id005
    background: *id014
    figure: null
    card:
      head: 史実で言えること
      body: 秀頼は5月8日に自害した
  - 語り: 分かれ道を一つ挙げるなら、願いが出てから自害までの、約20時間。
    portrait: null
  - 語り: 手紙によると、家康は「将軍様次第」と答え、秀忠は「もはや一度ではない」と言ったそうです。その返事が、ほんの少し違っていたら。
    portrait: *id017
    background: *id003
  - 聞き: 返事ひとつで、約20時間のうちに、全部が決まったのか。……決める人が決めるまでの時間って、短くて、重いね。
    tone: しみじみ
  - 語り: 秀頼は、後の時代の本に、さまざまな姿で描かれてきました。大柄な人とも、凡庸な人とも、賢い人とも。本人の姿は、いまも評価が割れたまま。
    portrait: *id005
    background: *id003
  - 聞き: あーしは、巨人だったのかも、凡庸だったのかも、まだ決められない。でも、助けてって願いが出たと言われる夕方から正午までを、忘れないでおきたいな。
    tone: しみじみ
    background: *id011
  - 語り: 今日の地層は、ここまでです。
    portrait: null
  - 聞き: 次の「もしも」は、誰の、どの分かれ道かな。
    tone: 疑問
  - 語り: あなたが気になる、歴史の分かれ道を、コメントで教えてください。
    background: *id018
  - 二人: また一緒に、掘りましょう！
    tone: 明るい
