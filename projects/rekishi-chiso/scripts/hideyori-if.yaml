      focus: 秀頼
    background: *id010
  - 語り: 大坂城は、夏の陣の火で焼け、徳川が元和6年から再築を始めます。完成は寛永6年。いまの天守は1931年の復興で、豊臣の城のものではありません。
    background: *id003
    figure: null
    card:
      head: 元和6年
      body: 徳川が大坂城の再築を始める
  - 聞き: 千姫は70歳まで生きたのか。長い人生だったんだな。豊臣の城の上に、徳川の城が建ったのか。
