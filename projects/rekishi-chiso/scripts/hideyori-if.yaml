- title: 想像② 5月下旬 秀頼と家康、4年ぶりの対面
  background: *id014
  year: 1615
  lines:
  - 語り: 想像劇場、第2幕です。5月の下旬。場所は決めません。秀頼と家康が、4年ぶりに向き合います。二条城の会見は、慶長16年でした。
    portrait: *id017
    background: *id006
    card:
      head: 想像劇場 第2幕
      body: 5月下旬 秀頼と家康
  - 聞き: 4年ぶりか。二条城のときは、まだ戦の気配もなかったのにね。
  - 語り: 家康の言葉も、秀頼の言葉も、想像です。
    card:
      head: ここから想像
      body: 想像② 秀頼と家康の対面
