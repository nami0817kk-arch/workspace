    card:
      head: 天秀尼
      body: 千姫の養女として寺へ
  - 語り: 東慶寺は、江戸時代、離縁を望む女性が駆け込める縁切寺として知られます。天秀尼は、正保2年、37歳で亡くなりました。
    card:
      head: 東慶寺
      body: 縁切寺として知られる
    background: &id011
      image: paintings/ieyasu_osaka_haichi_map.jpg
