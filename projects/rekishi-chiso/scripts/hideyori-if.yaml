  - 語り: ほかにも、秀頼を菰に包んで堀へ流し、肥後へ送ったという『備前老人物語』の話。島津家の家臣が抜け穴から迎えた、という口伝も。
    short: s3
    background: *id001
  - 聞き: 抜け穴で逃げて、薩摩へか。そう信じたくなる話だけど……。本当のところは、どうなの？
    tone: 疑問
  - 語り: 一般向けの記事では、口伝は年齢の記述が史実と合わず、裏づけが限られる、と指摘されています。どれも、同時代の記録ではありません。
    background: *id001
    card:
