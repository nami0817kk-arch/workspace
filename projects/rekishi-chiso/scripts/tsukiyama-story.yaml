sections:
  # ================================================================ 序章。答えの席：命じたのは信長か、家康か
  - title: 1579年、家康の妻と息子は、なぜ死んだのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1579
    lines:
      # fact: tsukiyama-12, tsukiyama-13
      - 語り: 家康の長男に、腹を切らせよ。信長がそう命じた、と書いた本は、事件から《43年》もあとに書かれたものでした。
        tone: 重い
      # fact: tsukiyama-14
      - 語り: 別の記録、『当代記』では、信長の返事は、まるで違います。家康の、思うとおりに。
      # fact: tsukiyama-17
      - 語り: 1579年。徳川家康は、正妻の築山殿と、21歳の長男・信康を失いました。
        tone: 重い
      - 語り: 命じたのは、信長なのか。それとも、家康なのか。記録を年の順に並べると、信長の命令という話とは、別の筋が見えてきます。
        tone: 疑問
      # fact: tsukiyama-09, tsukiyama-22
      - 語り: 手がかりは、その夏に家臣が書いた日記と、4年前に岡崎で起きた、ある謀反です。
      # fact: tsukiyama-36
      - 語り: そして家康は、息子の死のあと、遠江の二俣に寺を建て、寺の名も自分で付けた、と伝わります。
      - 語り: 家康の妻と息子は、なぜ、死ななければならなかったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 岡崎の若い城主
  - title: 岡崎の若い城主　1559年、駿府に生まれた信康
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1559
    lines:
      # fact: tsukiyama-43
      - 語り: 始まりは、1559年。信康は、今川家の本拠・駿府で生まれました。幼い名は、竹千代。父の家康と、同じ名です。
        year: 1559
      # fact: tsukiyama-26
      - 語り: 母は、今川家の一門、関口氏純の娘。生まれた年は、分かっていません。
      # fact: tsukiyama-42
      - 語り: 築山殿という呼び名は、名前ではありません。のちに移り住んだ、岡崎の築山という土地の名から来ています。
      # fact: tsukiyama-42
      - 語り: その築山の地にあった稲荷と寺は、今は、岡崎の中町へ移っています。
      # fact: tsukiyama-17
      - 語り: 1567年の5月27日。信康は、信長の娘・徳姫を、妻に迎えます。二人は同い年。数えで、《9歳》でした。
        year: 1567
      # fact: tsukiyama-43
      - 語り: 婚約は、その4年前の1563年。二人は、数えで5歳でした。
      - 語り: 母は今川の一門、妻は信長の娘。信康は、二つの家のあいだにいました。
      # fact: tsukiyama-43
      - 語り: 1570年、信康は元服し、岡崎の城主になります。父の家康は、遠江の浜松城へ移りました。
        year: 1570
      # fact: tsukiyama-18
      - 語り: 徳姫とのあいだには、娘が二人、生まれています。
      # fact: tsukiyama-44
      - 語り: 信康の姿を伝える絵は、岡崎の勝蓮寺にある、江戸時代の1幅だけです。亡くなってから、時がたって描かれました。
      - 語り: 浜松の父と、岡崎の息子。その岡崎で、1579年の夏、何が起きたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 その時の日記
  - title: 1579年8月、家臣の日記が書いた岡崎
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1579
    lines:
      # fact: tsukiyama-09
      - 語り: その夏を、その時に書いた記録があります。家康の家臣、松平家忠の日記、『家忠日記』です。
      # fact: tsukiyama-09
      - 語り: 1579年8月3日。家康が、浜松から、岡崎へ来ます。
        year: 1579
      # fact: tsukiyama-09
      - 語り: 翌4日。日記は、こう書きます。親子のあいだで話し合いがあり、信康は、大浜へ移された。
        tone: 重い
      - 語り: 大浜は、岡崎の南西、海に近い土地です。信康は、自分の城を、出されたのです。
      # fact: tsukiyama-09
      - 語り: 5日、家忠は、家康に言われて、兵を連れて西尾へ向かいます。家康も、西尾へ移りました。
      # fact: tsukiyama-10
      - 語り: 8月9日。小姓5人を付けて、信康は、大浜から、遠江の堀江城へ移されます。
      # fact: tsukiyama-10
      - 語り: 翌10日。三河の家臣たちは、誓いの書、起請文を出させられました。信康とは、ひそかに連絡を取らない、と。
        tone: 重い
      # fact: tsukiyama-10
      - 語り: 12日、家康は浜松へ帰ります。岡崎の城には、家康の重臣が、留守役として入りました。
      - 語り: 信康を城から出し、岡崎の家臣とのつながりを断つ。日記に並ぶのは、家康自身の動きです。
      - 語り: では、家康を岡崎へ向かわせたものは、何だったのか。よく知られた答えは、1通の手紙です。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 徳姫の十二か条
  - title: 徳姫の十二か条　『三河物語』が書いた筋
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1579
    lines:
      # fact: tsukiyama-05
      - 語り: その年の7月16日。『信長公記』によれば、家康の重臣、酒井忠次が、近江の安土にいる信長のもとへ、馬を届けています。
      - 語り: この夏、忠次が信長のもとへ行ったことは、信長の側の記録でも、確かめられるのです。
      # fact: tsukiyama-12
      - 語り: よく知られた筋を書いたのは、家康の家臣、大久保忠教の『三河物語』です。徳姫が、12か条を書き立て、忠次に持たせて、信長へ送った。
      # fact: tsukiyama-12
      - 語り: 信長は、そのうち10か条を開いて、一つずつ、忠次に尋ねます。忠次は、すべて、存じております、と認めました。
        tone: 重い
      # fact: tsukiyama-12
      - 語り: 信長は、残りの2か条を、開かなかった。そして、こう言った、と『三河物語』は書きます。
      # fact: tsukiyama-12
      - 語り: この分では、とても、ものにはなるまい。腹を切らせよと、家康に伝えよ。
        tone: 重い
      # fact: tsukiyama-13
      - 語り: 『三河物語』の草稿ができたのは、1622年。事件から、43年後です。最後に仕上がったのは1626年とみられ、47年後になります。
        year: 1622
      # fact: tsukiyama-12
      - 語り: しかも、同じ箇所は、手紙の年を、丑の年と書きます。1579年は、卯の年。丑の年なら、2年前の1577年です。
      # fact: tsukiyama-12
      - 語り: 12か条に、何が書かれていたのか。『三河物語』は、その中身を書いていません。信康の言い分も、ありません。
      - 語り: では、信長が命じたのでないなら、ほかの記録は、何と書くのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 家康の思うとおりに
  - title: 家康の思うとおりに　『当代記』と家康の手紙
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1579
    lines:
      # fact: tsukiyama-14
      - 語り: 『当代記』では、8月5日、家康が、信康を、家から追い出します。理由は、こうです。
      # fact: tsukiyama-14
      - 語り: 父、家康の命令に、常にそむき、信長をも軽んじ、家来たちに、情けのない、ひどい仕打ちをした。
        tone: 重い
      # fact: tsukiyama-14
      - 語り: 家康は、その前の月に、酒井忠次を通して、信長に内々に伝えていました。信長の返事は、家康の存分次第。家康の、思うとおりにせよ、でした。
      # fact: tsukiyama-11
      - 語り: もう一つの記録、『松平記』は、8月1日に、家康が、信長へ知らせを送った、と書きます。
      # fact: tsukiyama-05, tsukiyama-11
      - 語り: 信長に呼ばれて問われたのも、酒井忠次ひとりではありません。『松平記』では、大久保忠世と、二人です。
      # fact: tsukiyama-19, tsukiyama-20
      - 語り: 戦国時代を研究する黒田基樹は、2023年の本で、家康がこの8月に信長の家臣・堀秀政へ出した手紙と、『当代記』などから、こう見ています。
        year: 2023
      # fact: tsukiyama-20
      - 語り: 信康を罰することは、家康から信長に願い出たもので、信長は、家康の考えどおりでよい、と認めたにすぎない。
        tone: 重い
      # fact: tsukiyama-12
      - 語り: 『三河物語』が、罰を信長の意向として書いたのは、罰する意志が家康にあったことを、隠すためだった。黒田は、そうみています。
      - 語り: では、家康は、なぜ、自分の息子を罰したのか。手がかりは、4年前の岡崎にあります。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 4年前の謀反
  - title: 4年前の謀反　1575年、大岡弥四郎と築山殿
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1575
    lines:
      # fact: tsukiyama-22
      - 語り: 1575年。岡崎で、謀反のたくらみが明るみに出ます。くわだてたのは、岡崎の町奉行の一人、大岡弥四郎と、信康の家臣たちでした。
        year: 1575
      # fact: tsukiyama-22
      - 語り: 黒田基樹によれば、このたくらみは、武田勝頼の誘いを受けたものでした。
      # fact: tsukiyama-22
      - 語り: 信康の家臣たちに、謀反を働きかけたのは、築山殿だった可能性が高い。黒田は、そう書きます。
        tone: 重い
      # fact: tsukiyama-26
      - 語り: 黒田は、その前の年、2022年に、築山殿その人の生涯をたどる本も、出しています。
      # fact: tsukiyama-23
      - 語り: 根拠に挙げるのは、『岡崎東泉記』と、家臣の家に伝わった聞き書き。江戸時代の、二つの記録です。一方、『三河物語』は、この事件での築山殿の関わりを、書いていません。
      # fact: tsukiyama-24
      - 語り: 築山殿のねらいは、信康を当主にして、徳川の家を残すこと。そして家康は、このとき、築山殿を、とがめなかった。それが、黒田の見方です。
      # fact: tsukiyama-27
      - 語り: 別の研究者、柴裕之の見方を紹介した2021年の記事は、背景に、武田との向き合い方をめぐる、家臣団の割れがあった、とします。
      # fact: tsukiyama-27
      - 語り: 浜松を中心とする東は、武田と戦いぬく。岡崎を中心とする西は、武田との争いを、やわらげる道を望んだ。
      # fact: tsukiyama-25
      - 語り: そして1579年。徳姫が信長へ送った書き付けに、4年前の築山殿の内通が書かれていた。黒田は、それが問題になった、とみます。
        year: 1579
      # fact: tsukiyama-25
      - 語り: 4年前のたくらみは、信康も、武田の側に付けるものでした。家康は、信康も同じ罪とみなすしかなかった。信長に知られた以上、罰するしかない。
        tone: 重い
      # fact: tsukiyama-25
      - 語り: 黒田は、それを、信長への《忖度》と呼んでいます。
      # fact: tsukiyama-29
      - 語り: 武田との戦いを研究する平山優も、2023年の本で、家康はこの年の6月ごろから、岡崎の信康と徳姫、そして築山殿の問題に、追われていた、と書きます。
      - 語り: 岡崎での8月の動きは、その、およそ2か月あとでした。
      - 語り: 東の浜松と、西の岡崎。割れた家の行きつく先は、秋の遠江でした。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 御前谷と二俣城
  - title: 1579年秋、御前谷と二俣城
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1579
    lines:
      # fact: tsukiyama-15
      - 語り: 8月29日。築山殿は、浜松の近くで、命を落としました。のちの記録は、その場所を、富塚の御前谷と伝えます。
        tone: 重い
      # fact: tsukiyama-03
      - 語り: 江戸幕府がまとめた家康の記録は、場所を小藪村と書き、関わった家臣の名を、野中重政とします。
      # fact: tsukiyama-14
      - 語り: 一方、『当代記』は、ただ、浜松で、とだけ書いています。
      # fact: tsukiyama-40
      - 語り: 今、浜松の佐鳴湖の近くには、太刀洗の池と呼ばれる跡があり、碑が立っています。
      # fact: tsukiyama-14, tsukiyama-17
      - 語り: 9月15日。信康は、遠江の二俣城で、自害しました。21歳。大浜へ移されてから、1か月と11日あとのことでした。
        tone: 重い
      # fact: tsukiyama-37
      - 語り: 二俣城の跡は、川向かいの鳥羽山城の跡とあわせて、2018年に、国の史跡になりました。ただ、今見える石垣は、信康の死から11年以上あとの城主、堀尾氏が築いたとみられています。
        year: 2018
      # fact: tsukiyama-36, tsukiyama-35
      - 語り: 冒頭の寺が、二俣の清瀧寺です。信康の廟があり、今も、9月15日の命日に、法要が開かれています。
      - 語り: 母と息子のあとに、家康の家には、何が残されたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 残されたもの
  - title: 浜松と岡崎に残るもの　1580年、徳姫は美濃へ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1580
    lines:
      # fact: tsukiyama-40, tsukiyama-38
      - 語り: 築山殿は、浜松の西来院に、葬られました。その廟、月窟廟は、戦争で焼け、1978年、四百年忌に建て直されています。
      # fact: tsukiyama-39
      - 語り: 西来院では、清池院殿という、亡くなったあとの名で、まつられています。
      # fact: tsukiyama-39
      - 語り: 同じ墓所には、家康と母を同じくする弟、松平康俊の墓も、あります。
      # fact: tsukiyama-41
      - 語り: 岡崎の八柱神社には、築山殿の首塚があります。今の五輪塔は、1977年に、神社の氏子たちが建て直したものです。
      # fact: tsukiyama-41
      - 語り: 伝えでは、その首を岡崎へ持ち帰ったのは、のちに家康のもとを離れて秀吉に仕える、石川数正でした。
      # fact: tsukiyama-34
      - 語り: 信康の首塚は、岡崎の若宮八幡宮にあります。信康の死のあと、岡崎の城であやしいことが続き、ここに首塚を建てて祀った、と伝えられています。
      # fact: tsukiyama-18
      - 語り: 徳姫は、事件の翌年、1580年の2月、美濃へ帰りました。
        year: 1580
      # fact: tsukiyama-18
      - 語り: 二人の娘は、のちに、小笠原秀政と、本多忠政の妻になります。信康の血は、娘たちを通して、続いていきました。
      - 語り: では、家康の妻と息子は、なぜ死んだのか。
        tone: 疑問
        hook: true

  - title: まとめ：家康の妻と息子は、なぜ死んだのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 記録で確かめられるのは、ここまでです。1579年8月、家康は自ら岡崎へ来て、信康を城から出しました。
        tone: しみじみ
      - 語り: 家臣たちには、信康と連絡を取らないと、誓わせています。その時の日記に残る、事実です。
        tone: しみじみ
      - 語り: 信長が、腹を切らせよと命じた、という筋は、事件から43年後の『三河物語』のもの。同じく江戸時代の記録、『当代記』は、家康の思うとおりに、と書きます。
        tone: しみじみ
      - 語り: 黒田基樹は、罰は家康から願い出たもの、と見ます。その背景に、4年前の謀反と、築山殿の、武田への内通を挙げます。
        tone: しみじみ
      # fact: tsukiyama-21
      - 語り: 分からないことも、あります。黒田自身も、関係する記録はほとんど残らず、真相は今も分からない、と書いています。
        tone: しみじみ
      - 語り: 徳姫の書き付けに、何が書かれていたのか。命じたのは、信長だったのか、家康だったのか。記録は、割れたままです。
        tone: しみじみ
        pause: 0.8
      - 語り: ただ、日記に残る8月の家康は、自ら動いています。息子を城から出し、家臣たちを、息子から引き離しました。
        tone: しみじみ
      - 語り: その息子を弔う寺が、今も二俣にあります。名を付けたのは、家康だったと伝わります。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、命じたのは、誰だったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
