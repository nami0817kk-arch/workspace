# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  息子に腹を切らせよ。信長がそう言った、と書いた『三河物語』が書かれたのは、事件から43年もあとでした。別の記録『当代記』では、信長の返事は「家康の思うとおりに」。
  1579年、徳川家康は、正妻の築山殿と、21歳の長男・信康を失いました。命じたのは、信長だったのか、家康だったのか。
  その夏に家臣が書いた日記、家康の手紙、4年前に岡崎で起きた謀反。記録を年の順に並べて、言えることと、言えないことを分けました。
  この動画でわかること
  ・その時に書かれた日記に残る、1579年8月の家康と信康
  ・『三河物語』の「十二か条」の筋と、書かれた年
  ・『当代記』『松平記』とのくい違い
  ・4年前の大岡弥四郎の謀反と、築山殿の内通説
  ・二俣城・浜松・岡崎に残るもの
description_note: |-
  年月日は『家忠日記』『当代記』『三河物語』『松平記』を、『岡崎市史』（1934年）・『史料綜覧』・活字本の翻刻で読んだものです。記録によって日付・人物が違うところは、記録ごとに並べました。年齢は数え年、年数の差は自分で計算し直したものです。
  研究者の見方は、黒田基樹『徳川家康の最新研究』（2023年）を再編集した記事、平山優『徳川家康と武田勝頼』（2023年）を再編集した記事、柴裕之の見方を紹介した記事（2021年）によります。寺社・史跡のことは、浜松市・岡崎市・観光協会の案内によります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Why Did Tokugawa Ieyasu's Wife and Son Have to Die? Lady Tsukiyama and Nobuyasu"
  description: |-
    "Have him commit seppuku" — the book that says Oda Nobunaga gave this order was written 43 years after the event. Another record, the Todaiki, gives Nobunaga's reply as "as Ieyasu sees fit."
    In 1579, Tokugawa Ieyasu lost his wife, Lady Tsukiyama, and his 21-year-old eldest son, Nobuyasu. Who gave the order: Nobunaga, or Ieyasu himself?
    We line up a retainer's diary written that summer, Ieyasu's letter, and a plot uncovered at Okazaki four years earlier.
    In this video you will learn:
    - What a diary written at the time says about August 1579
    - The "twelve articles" story in the Mikawa Monogatari, and when it was written
    - Where the Todaiki and Matsudaira-ki disagree
    - The 1575 Ooka Yashiro plot and the theory of Lady Tsukiyama's contact with Takeda
    - What remains today at Futamata, Hamamatsu and Okazaki
    Dates and names differ between records. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Two Deaths in 1579"
    - "The Young Lord of Okazaki"
    - "A Diary Written That Summer"
    - "Lady Toku's Twelve Articles"
    - "As Ieyasu Sees Fit"
    - "A Plot Four Years Earlier"
    - "Gozendani and Futamata Castle"
    - "What Remains"
    - "Summary: Who Gave the Order?"

