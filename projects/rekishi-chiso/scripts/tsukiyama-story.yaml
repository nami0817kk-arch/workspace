# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。築山殿と信康（1579年・天正7年の信康事件）。2026-11-17 作成。公開の予定は 11/22 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（日本史・戦国）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。大河ドラマの話はしない。
# 1本に1つの問い＝「家康の妻と息子は、なぜ死ななければならなかったのか」（命じたのは信長か、家康か）。主役は築山殿と信康。顔は絵にしない。
#   冒頭＝「腹を切らせよ、と信長が言ったと書いた本は事件の43年後」＋「別の記録では信長の返事は『家康の思うとおりに』」。答えの席＝命じたのは信長か家康か。
#   型の作り：序章 謎／第1章 岡崎の若い城主／第2章 その時の日記（家忠日記）／第3章 徳姫の十二か条（三河物語）／第4章 家康の思うとおりに（当代記・松平記・家康の書状・黒田説）／
#   第5章 4年前の謀反（大岡弥四郎事件・築山殿の内通説・家臣団の東西）／第6章 御前谷と二俣城／第7章 残されたもの／まとめ（言えること・言えないこと）。
# 記録の食い違い：①信康を罰すると決めたのは誰か（三河物語＝信長「腹をきらせ給へ」／当代記＝「家康存分次第」）
#   ②信長に問われた家臣（三河物語＝酒井忠次／松平記＝酒井忠次と大久保忠世）③築山殿が亡くなった場所（当代記＝浜松で／東照宮御実紀＝小藪村／遠江国風土記伝ほか＝富塚の御前谷）。
#   事実照合（11-17、Agent 3人）で直した：母方の言い方・十二か条の中身・西尾の言い方・当代記も家康が先に伝えた・家康の書状の日付は外す・忖度の段・大岡は町奉行・御前谷は後の記録・清池院殿（清地院殿は観光サイトの誤記）・首塚の理由・まとめの言い切り。
# 計算（自分で計算し直した）：信康 1559生→1579没＝数え21／結婚1567＝数え9（徳姫は同い年）／三河物語 草稿1622−1579＝43年・完成1626−1579＝47年／
#   天正7年＝己卯、丑の年なら天正5年＝1577（2年前）／大岡弥四郎事件1575→1579＝4年前／平山の「6月ごろ」→8月＝2か月／
#   大浜へ8月4日→二俣で9月15日＝1か月と11日／二俣城の石垣 1590〜1600−1579＝11〜21年あと／月窟廟の復元1978（四百年忌）／八柱神社の五輪塔1977／清瀧寺の法要 2023年に444年前（2023−1579＝444）。
# 事実は事実カード（dev/output/rekishi-chiso/research/築山殿_facts_20261117.yaml、tsukiyama-03〜44）にあるものだけ。行の上に `# fact: tsukiyama-xx`。
#   使わないこと：介錯の人の名・最期の場面・遺体の扱いの細部・信康の最期の言葉／家康がのちに悔やんだ話・関ヶ原の朝の話（出どころ未確認）／徳姫の没年・京都の暮らし／
#   築山殿の母を井伊の娘とする説／『岡崎市史』が十二か条を疑った文（カードに無い）／大岡弥四郎の役職／家康の書状の文面（原文未確認、出典の号数だけ確認）。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
