# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  広島49万8千石の福島正則は、城を失って5年後、信濃の山あいで死にました。死後にも、取り上げられたものがあります。
  福島正則。豊臣秀吉の血縁で、賤ヶ岳の七本槍の一人とされる武将です。洪水で壊れた広島城の修理が、改易のきっかけでした。
  幕府が命じたのは「本丸以外を壊せ」。ところが、正則が壊すよう指示したのは、本丸のほうでした。
  死んだあとに、何が、なぜ取り上げられたのか。記録をたどって、確かめます。
  この動画でわかること
  ・賤ヶ岳の人数と恩賞を、同時代の記録と江戸時代の本がどう書いたか
  ・広島城の石垣の修理は、届け出が事後だったのか、事前だったのか
  ・1619年6月2日の改易と、広島城の明け渡しの経過
  ・信濃・高井野での5年間と、死んだ日に起きたこと
  ・死後に取り上げられたもの、その後の福島家、墓と没後400年
description_note: |-
  記録に残る言葉は、出どころ（広島城、広島市、ひろしまWEB博物館、高山村、小布施町、長野県立長野図書館、NDLレファレンス協同データベース、国立国会図書館の文書、ウィキソースの翻刻、藤井讓治さんの記事、サライ、PHP歴史街道、幕末歴史ガイドなど）を語りで示してから読んでいます。
  『柴田退治記』『太閤記』『老人雑話』『微妙公御夜話』の原文は、ウィキソースの翻刻をもとにしています。『寛政重修諸家譜』『台徳院殿御実紀』『福島家系譜』の本文、検使の名前、福山大学・日文研の論文の本文は、確かめられませんでした。確かめられたのは、辞典・自治体・博物館・報道が引くところまでです。
  画面の人物・情景の画像の多くは、画像生成AI（Gemini）による想像図です。福島正則の人物像も、AIによる想像図で、実在の肖像ではありません（画面の右上に「AI生成画像」と出しています）。
  実在の絵は、落合芳幾《福島正則》（1867年、ウィキメディア・コモンズ、パブリックドメイン）などです。

en:
  title: "Fukushima Masanori: From 498,000 Koku to 45,000, and What Was Taken After He Died"
  description: |-
    Fukushima Masanori, a lord of 498,000 koku in Hiroshima, died in the mountains of Shinano five years after losing his castle. And even after his death, something more was taken from him.
    Fukushima Masanori was a relative of Toyotomi Hideyoshi. The trigger was the repair of flood-damaged Hiroshima Castle: the shogunate ordered everything but the main enclosure to be torn down, but his letter ordered the main enclosure to be torn down instead.
    What was taken after his death, and why? We follow the records to find out.
    In this video you will learn:
    - How the records disagree on the men and rewards of the battle of Shizugatake
    - Whether the repairs of Hiroshima Castle were reported before or after the work
    - The confiscation of June 2, 1619 and the handover of Hiroshima Castle
    - His five years in Takaino, Shinano, and what happened on the day he died
    - What was taken after his death, his descendants, his grave, and the 400th anniversary
    Portraits and scenes are AI-generated imagery. Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "A Lord of 498,000 Koku Died in the Mountains of Shinano"
    - "From 5,000 Koku to 498,000 Koku: 1583-1617"
    - "The 1617 Flood: How Far Were the Walls Repaired?"
    - "June 2, 1619: What Did the Shogun Decide?"
    - "Why Did the Chief Retainer Not Open the Castle?"
    - "Another Record Describes a Different Punishment"
    - "Five Years in Takaino, Shinano: 1619-1624"
    - "July 1624: Before the Shogunate's Inspector Arrived"
    - "What Was Taken After He Died"
    - "Where Is His Grave? The 400th Anniversary"
    - "Summary: Why Was More Taken After His Death?"

