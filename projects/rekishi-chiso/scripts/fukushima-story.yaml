sections:
  # ================================================================ 序章（冒頭 約3分）。答え（何が・なぜ取り上げられたか）は第8章まで言わない
  - title: 広島49万8千石の大名は、なぜ信濃の山あいで死んだのか　1619年
    background: {image: paintings/nene_fukushima_masanori_yoshiiku.jpg, credit: "落合芳幾《福島正則》1867年（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1619
    lines:
      # 0〜10秒：題名の問い＋意外な一点（答えの席＝死のあとに取り上げられたもの）。0〜約30秒：知らない事実3つ（城を失って5年後に山あいで死んだ・修理で約45万石を失った・壊す指示が本丸だった）＋答えの席＋約束
      # fact: fukushima-18, fukushima-46
      - 語り: 広島49万8千石の福島正則は、城を失って5年後、信濃の山あいで死にました。死後にも、取り上げられたものがあります。
        tone: 重い
        card: {head: "福島正則", body: 広島49万8千石の大名}
      # fact: fukushima-02, fukushima-12
      - 語り: 発端は、洪水で壊れた広島城の修理でした。それで、およそ45万石を失ったのです。
      # 知らない事実：命令と逆の範囲
      # fact: fukushima-08
      - 語り: 幕府は、本丸以外を壊せと命じました。ところが、正則が壊すよう指示したのは、城の中心、本丸のほうでした。
        tone: 強調
      # 答えの席＋約束
      - 語り: 死んだあと、何が、なぜ、取り上げられたのか。その答えは、最後に、記録で確かめます。
        tone: 疑問
      # fact: fukushima-09, fukushima-10
      - 語り: 1619年6月2日、領地を取り上げる処分、改易が決まります。その7日後には、諸大名に、知らせが届きました。
        card: {head: "1619年6月2日", body: 改易の決定}
      # fact: fukushima-31, fukushima-32
      - 語り: 正則は、豊臣秀吉の血縁で、「賤ヶ岳の七本槍」の一人とされる武将です。
      # fact: fukushima-35, fukushima-36
      - 語り: 大名の領地の大きさは、米の量の単位、石で表します。賤ヶ岳の恩賞は、5千石とされます。それが17年後、関ヶ原のあとには、およそ100倍の、49万8千石になっていました。
      - 語り: 大名の頂点から、信濃の山あいの死まで。その5年のあいだに、何があったのか。
        tone: 疑問

  # ================================================================ 第1章 賤ヶ岳の5千石から広島49万8千石へ（1583〜1617）。記録の食い違い①
  - title: 賤ヶ岳の5千石から、広島49万8千石へ　1583年〜1617年
    background: {image: paintings/hidenaga_shizugatake_screen_1.jpg, credit: "《賤ヶ岳合戦図屏風》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1583
    lines:
      - 語り: 1583年、賤ヶ岳の戦い。秀吉が、柴田勝家を破った戦いで、若い正則は、手柄を立てた一人として、恩賞を受けました。
        card: {head: "1583年", body: 賤ヶ岳の戦い}
      # fact: fukushima-34
      - 語り: ところが、手柄の人数が、記録で違います。秀吉の側近、大村由己が、1583年の11月に書いた『柴田退治記』は、9人。江戸時代の初め、小瀬甫庵の『太閤記』は、7人。
      # fact: fukushima-34
      - 語り: 「七本槍」という言い方は、同時代の『柴田退治記』には、出てきません。
        figure: null
      # fact: fukushima-35
      - 語り: 恩賞も割れます。『柴田退治記』は、「五千石か、三千石」。『太閤記』は、7人とも5千石。『老人雑話』は、正則だけが5千石、ほかはおよそ3千石と書きます。
      # fact: fukushima-36, fukushima-37
      - 語り: 5千石の正則は、1595年に、尾張の清洲24万石へ。関ヶ原のあと、1600年には、その倍あまり、安芸と備後の49万8千石を与えられます。やがて、広島に入りました。
        figure: {type: bars, title: 福島正則の石高, bars: [[賤ヶ岳のあと, 5000], [清洲　1595年, 240000], [広島　1600年, 498000]], labels: [5千石, 24万石, 49万8千石]}
      # fact: fukushima-41
      - 語り: 広島城の築城が始まったのは、1589年。城も、城下町も、正則が、受け継いで、広げていきました。
        figure: null
      # fact: fukushima-40
      - 語り: 1601年の秋までに、領内の検地が終わり、その検地帳の原本が、いまも広島県内に、約50か村分、残っています。
      # fact: fukushima-43
      - 語り: ただ、その後の豊臣家との関わりは、複雑でした。世界大百科事典によると、1614年の大坂冬の陣で、正則は、豊臣恩顧のために敬遠され、江戸城の留守居を命じられます。
        figure: null
      - 語り: その広島を、1617年、大洪水が襲います。
        hook: true
      - 語り: この洪水が、すべての発端になります。
        hook: true

  # ================================================================ 第2章 洪水と石垣の修理（1617〜1618）。記録の食い違い②
  - title: 1617年の洪水で、広島城の石垣はどこまで直されたのか
    background: {image: paintings/ieyasu_sekigahara_zubyobu.jpg, credit: "《関ヶ原合戦図屏風》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1617
    lines:
      # fact: fukushima-02, fukushima-03
      - 語り: 元和3年、1617年。広島城の解説は、この年の大洪水で、広島城が破損した、と書いています。このとき、福島家の石高は、49万8223石でした。
        card: {head: "1617年", body: 大洪水で広島城が壊れる}
      # fact: fukushima-04
      - 語り: 城を直すには、決まりがありました。2年前、1615年に、幕府が大名に出した、武家諸法度です。城の修理は、あらかじめ、幕府に届け出ること。
      # fact: fukushima-04
      - 語り: では、正則は、届けを出したのか。広島城の解説は、事後報告で済ませようとしたようだ、と書きます。サライの2021年の記事も、事後報告になった、と書いています。
      # fact: fukushima-05
      - 語り: 一方で、事前に、届けていた、という話もあります。攻城団の2021年の記事は、申請したが、幕府の側近の本多正純が、握りつぶしたという説を、紹介します。
        figure: {type: stats, title: 届け出は、いつだったのか, items: [[広島城の公式解説, 事後報告, 済ませようとした], [攻城団の記事（2021年）, 事前に申請, 握りつぶされた]]}
      # fact: fukushima-05
      - 語り: 「Into the Japan Waraku」の記事は、届けは2か月ほど宙に浮き、口頭で、問題ない、と返答があったともいわれる、と書きます。届け出の有無は、記述が割れているのです。
        figure: null
      # fact: fukushima-06
      - 語り: 工事は進みました。広島城の解説によると、1618年の4月には、櫓台の石垣などの工事。10月の末には、本丸・二の丸・三の丸と、城下を囲む惣構で、普請が行われていたようです。
      - 語り: 本丸は、城の中心。二の丸・三の丸は、その外側を囲む区画です。広い範囲に、手が入っていました。
      # fact: fukushima-07
      - 語り: 1619年の春。広島の工事は、すでに、幕府の知るところとなっていました。
        hook: true
      - 語り: 4月、秀忠は、ひとつの決断をします。
        hook: true

  # ================================================================ 第3章 1619年6月2日
  - title: 元和5年6月2日、将軍は何を決めたのか　1619年
    background: {image: paintings/oichi_hidetada.jpg, credit: "《徳川秀忠像》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    portrait: {image: paintings/oichi_hidetada.jpg, caption: "徳川秀忠（江戸時代の絵）"}
    year: 1619
    lines:
      # fact: fukushima-07
      - 語り: 広島城の解説によると、秀忠は、4月に、いったん、改易にしようとしました。ところが、条件をつけて、許します。
        card: {head: "1619年4月", body: 改易を決め、条件つきで許す}
      # fact: fukushima-08
      - 語り: ひろしまWEB博物館が公開する、正則の書状の解説によると、条件は、2つ。本丸以外の、修理した部分を壊すこと。そして、人質を、差し出すこと。
      # fact: fukushima-08
      - 語り: 正則は、国元に、書状を書きます。ひろしまWEB博物館の解説では、そこには、本丸の櫓と石垣を壊すように、書かれていました。幕府の命令とは、逆の範囲です。実際に壊されたのも、本丸だったと考えられています。
        tone: 重い
        figure: {type: stats, title: 壊すはずの所と、壊した所, items: [[幕府の命令, 本丸以外, 修理した部分を壊す], [正則の書状, 本丸の櫓と石垣, 壊すように指示]]}
      # fact: fukushima-07
      - 語り: 二の丸と三の丸は、残ったままでした。京都大学名誉教授の藤井讓治さんは、修理した部分を壊す約束が、守られていなかったことが、咎められた、と書いています。
        figure: null
      # fact: fukushima-09
      - 語り: 元和5年6月2日。上洛5日目の秀忠は、広島城の無断修築を咎めて、正則を、改易しました。壊す約束が守られなかったことも、問われました。この動画の日付は、当時の暦のままです。
        card: {head: "6月2日", body: 広島城の無断修築の咎で改易}
      # fact: fukushima-10
      - 語り: 6月9日には、諸大名に、改易が伝えられます。加藤嘉明ら、中国・四国の大名たちに、広島城の受け取りが、命じられました。藤井さんの記事にある日付です。
        year: 1619
      - 語り: 6月2日から、わずか7日。約50万石の大名の運命は、諸大名に、知らされたのです。
        tone: 重い
      - 語り: では、そのころ、広島の城では、何が起きていたのか。
        tone: 疑問
        hook: true
      - 語り: 城を預かる家臣たちは、いったん、籠城の構えを見せます。
        hook: true

  # ================================================================ 第4章 家老は城を開けなかった・広島から信濃へ
  - title: 家臣たちは、なぜ城を開けなかったのか　1619年6月〜10月
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1619
    lines:
      # fact: fukushima-11
      - 語り: 広島城の解説は、家臣たちが、いったん、籠城した、と書きます。加賀藩の前田家の逸話を集めた『微妙公御夜話』は、家老の福島丹波たちが、正則の墨付が届くまでは、城を明け渡さない、と構えた様子を伝えます。
      # fact: fukushima-11
      - 語り: 墨付とは、大名が自分で書いて署名した、書状です。広島城の解説によると、その後、正則の指示を受けて、整然と、城が引き渡されました。
      # fact: fukushima-14
      - 語り: 広島城の解説は、8月8日、紀伊の和歌山から、浅野長晟が、広島城に入った、と伝えます。治めた石高は、42万6500石。福島の時代より、7万石ほど、少なくなっています。
        card: {head: "8月8日", body: 浅野長晟が広島城に入る}
      # fact: fukushima-12, fukushima-18
      - 語り: 正則は、安芸と備後を、すべて没収されます。移された先は、信濃国の高井郡で2万石、越後国の魚沼郡で2万5千石。合わせて、4万5千石です。
        figure: {type: bars, title: 改易で、石高はどうなったか, bars: [[広島　1619年まで, 498223], [信濃と越後　改易のあと, 45000]], labels: [49万8千石, 4万5千石]}
      # fact: fukushima-12
      - 語り: 49万8千石から、4万5千石。失ったのは、およそ45万3千石。残ったのは、約9%です。広島城の解説によると、いったんは、津軽への転封と決まっていました。
        figure: null
      # fact: fukushima-13
      - 語り: 正則は、元和5年の10月の初めに、広島を出て、信濃の高井野へ向かいました。
        tone: しみじみ
      - 語り: ところで、この処分については、まったく別の話を伝える本があります。
        tone: 疑問
        hook: true
      - 語り: 加賀藩の逸話集は、日付も、場所も、違うのです。
        hook: true

  # ================================================================ 第5章 検証：『微妙公御夜話』は別の処分を書く。記録の食い違い③
  - title: 前田家の逸話集は、別の処分を書いている　『微妙公御夜話』1916年
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1619
    lines:
      # fact: fukushima-15
      - 語り: 『微妙公御夜話』は、加賀藩の前田利常の話を集めた本です。作者は分かっていません。活字になったのは、1916年です。
        card: {head: "『微妙公御夜話』", body: 前田利常の逸話集}
      # fact: fukushima-15
      - 語り: この本は、正則の処分を、「元和4年6月23日」と書きます。流された先は、「出羽庄内」。罪は、七か条を並べます。
        figure: {type: stats, title: 同じ処分　記録の食い違い, items: [[微妙公御夜話, 6月23日, 出羽庄内へ流罪・七か条], [藤井讓治さんの記事, 6月2日, 信濃・越後へ・無断修築]]}
      # fact: fukushima-15
      - 語り: 石高も違います。「四万石を与える」と言われたが断り、流された先で、一万石を与えられた、と書いています。
        figure: null
      - 語り: 広島の城を預かった家臣たちの記録ではなく、後の時代にまとめられた、逸話集の話です。
      - 語り: 城の修理と、壊す範囲の逆転。大名の頂点から、一気に、山あいの屋敷へ。
        tone: 重い
        hook: true
      - 語り: その屋敷は、どんな所だったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 信濃・高井野の5年（1619〜1624）
  - title: 信濃・高井野の5年　1619年〜1624年
    background: {image: paintings/nene_fukushima_masanori_yoshiiku.jpg, credit: "落合芳幾《福島正則》1867年（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1619
    lines:
      # fact: fukushima-26
      - 語り: 高井野は、いまの、長野県高山村。正則の屋敷の跡が、残っています。長野県立長野図書館のレファレンス回答によると、東西が約104.5メートル、南北が約72.7メートル。広さは、およそ76アールです。
        card: {head: "高井野の屋敷跡", body: 東西104.5m・南北72.7m}
      # fact: fukushima-26
      - 語り: かつては、四方に高い土塁があり、外側には、空堀がめぐらされていました。
      # fact: fukushima-26
      - 語り: 広島城の主だった大名が、東西100メートルほどの屋敷で、暮らしたのです。
        tone: しみじみ
      # fact: fukushima-19
      - 語り: 翌1620年、嫡男の忠勝が、数え23歳で亡くなります。
        card: {head: "1620年", body: 嫡男の忠勝が23歳で死去}
      # fact: fukushima-19
      - 語り: 幕末歴史ガイドや、PHP歴史街道の記事によると、正則は、越後の2万5千石を、幕府に返上しました。残ったのは、信濃の2万石です。
      - 語り: 広島の頃の、およそ4%。それが、正則の最後の領地でした。
        tone: しみじみ
        figure: {type: bars, title: 手元に残った石高, bars: [[広島　1619年まで, 498223], [信濃と越後　1619年, 45000], [信濃だけ　1620年から, 20000]], labels: [49万8千石, 4万5千石, 2万石]}
      - 語り: そして、1624年の夏が、来ます。
        figure: null
        tone: 重い
        hook: true
      - 語り: 寛永元年の7月13日。正則は、高井野にいました。
        hook: true

  # ================================================================ 第7章 1624年7月、検使が着く前に
  - title: 1624年7月、幕府の検使が着く前に　高井野
    background: {image: paintings/nene_fukushima_masanori_yoshiiku.jpg, credit: "落合芳幾《福島正則》1867年（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1624
    lines:
      # fact: fukushima-20, fukushima-46
      - 語り: 寛永元年、1624年の7月13日。福島正則は、高井野で、数え64歳で、亡くなりました。
        card: {head: "1624年7月13日", body: 高井野で死去（数え64歳）}
        tone: しみじみ
      # fact: fukushima-21
      - 語り: 高山村の公式ページは、病死した、と説明しています。夏の暑い盛りでした。
      - 語り: 検使とは、亡くなった大名の死を、確かめる、幕府の役人です。
      # fact: fukushima-21, fukushima-46
      - 語り: 高山村の公式ページは、こう書きます。幕府の検死が済む前に、遺体を、荼毘に付した、と。荼毘とは、火葬のことです。
        tone: 重い
        card: {head: "高山村の公式ページ", body: 検死が済む前に火葬}
      # fact: fukushima-21
      - 語り: 城びとの記事は、幕府の検死役が着く前に、家臣が遺体を火葬した、と書きます。日本大百科全書は、幕府の検使が着く前に荼毘に付した、と記します。
      # fact: fukushima-27
      - 語り: 荼毘に付した場所には、後に、村の人が杉を植えました。「一本杉」と呼ばれ、高さは約30メートル、周囲は約9メートルに育ちます。1934年の室戸台風で、倒れました。
        figure: null
      # fact: fukushima-27
      - 語り: 荼毘所の跡は、高山村の指定史跡です。2009年2月25日に、指定されました。
      # fact: fukushima-51
      - 語り: 死の様子には、ほかの話もあります。Into the Japan Waraku の記事は、自刃したという噂もあるが、真偽は定かでない、と書きます。病死と書く村の説明と、食い違っています。
        figure: {type: stats, title: 死の様子　記録の食い違い, items: [[高山村の公式ページ, 病死, 夏の暑い盛り], [Into the Japan Waraku, 自刃という噂, 真偽は定かでない]]}
      - 語り: 検使が着く前の、火葬。幕府は、何を取り上げたのか。
        figure: null
        tone: 疑問
        hook: true
      - 語り: その答えが、残された記録に、書かれています。
        tone: 重い
        hook: true

  # ================================================================ 第8章 死んだあとに取り上げられたもの（答え）
  - title: 死んだあとに取り上げられたもの　1624年〜1681年
    background: {image: paintings/oichi_hidetada.jpg, credit: "《徳川秀忠像》江戸時代（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1624
    lines:
      # fact: fukushima-17, fukushima-46
      - 語り: サライの2026年の記事は、幕府の検使が着く前に、遺体を火葬したため、残る遺領も没収された、と書きます。残っていた領地は、信濃の2万石。それが、すべて、取り上げられました。
        card: {head: "没収", body: 残っていた領地・信濃の2万石}
      - 語り: 広島の49万8千石は、4万5千石に。そして、2万石に。最後は、ゼロです。5年で、約50万石の大名は、領地を、すべて失いました。
        tone: 重い
      # fact: fukushima-23
      - 語り: 家は、完全には、消えませんでした。講談社の日本人名大辞典は、末の子の正利に、川中島で3千石が与えられた、と書きます。幕末歴史ガイドは、3112石としています。
      - 語り: 3112石は、広島の頃の、およそ160分の1。福島家は、旗本になりました。旗本とは、将軍に直接仕える武士です。
        figure: {type: bars, title: 福島家の石高の移り変わり, bars: [[広島　1600年, 498223], [信濃と越後　1619年, 45000], [信濃　1620年, 20000], [正利　旗本, 3112]], labels: [49万8千石, 4万5千石, 2万石, 3112石]}
      # fact: fukushima-24
      - 語り: 正利は、寛永14年の12月に、数え37歳で亡くなります。西暦では、1638年の1月にあたります。子どもがなく、旗本の福島家は、一度、絶えました。
        figure: null
      # fact: fukushima-25
      - 語り: 家が戻ったのは、天和元年、1681年。正利の死から、40年あまりのち、甥の正勝が、2千石の旗本として、取り立てられました。
        card: {head: "1681年", body: 甥の正勝が2千石の旗本に}
      - 語り: 2千石は、広島の頃の、およそ250分の1です。
        tone: しみじみ
        hook: true
      - 語り: では、正則本人は、いま、どこに眠っているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第9章 墓と没後400年
  - title: 福島正則の墓はどこにあるのか　小布施・京都・広島
    background: {image: paintings/nene_fukushima_masanori_yoshiiku.jpg, credit: "落合芳幾《福島正則》1867年（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 2024
    lines:
      # fact: fukushima-28
      - 語り: 日本大百科全書は、墓は、京都の妙心寺の塔頭、海福院にあり、霊廟は、小布施の岩松院にある、と記します。
        card: {head: "日本大百科全書", body: 墓は京都・霊廟は小布施}
      # fact: fukushima-28
      - 語り: 小布施町の文化財一覧には、福島正則公霊廟が、史跡として載っています。岩松院に建ち、指定は、1973年2月20日。没後、およそ350年がたっていました。
      # fact: fukushima-49
      - 語り: そして、没後400年の、2024年。広島市が、記念の事業を開きました。10月から、正則ゆかりの場所の、案内マップを配り、11月24日には、講演会が開かれました。
        card: {head: "2024年", body: 広島市が没後400年の記念事業}
      # fact: fukushima-49
      - 語り: 広島市のイベントの案内によると、その講演の題は、「大胆剛毅な福島正則の広島城無断修築と本丸破却」でした。
      - 語り: 広島を失った大名を、広島の人たちが、いま、記念している。
        tone: しみじみ
        hook: true
      - 語り: 最後に、もう一度、冒頭の問いに戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：なぜ、死んだあとにも取り上げられたのか　広島から信濃へ
    background: {image: paintings/nene_fukushima_masanori_yoshiiku.jpg, credit: "落合芳幾《福島正則》1867年（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1624
    lines:
      # 答え
      # fact: fukushima-46, fukushima-17
      - 語り: 死んだあとに取り上げられたのは、信濃に残っていた、2万石の領地でした。理由は、幕府の検使が着く前に、遺体を火葬したことです。
        tone: 重い
      # fact: fukushima-08, fukushima-09
      - 語り: その前に、領地の大半を失うきっかけは、洪水で壊れた、広島城の修理でした。幕府は、本丸以外を壊せと命じ、正則は、本丸の撤去を指示した。1619年6月2日、改易です。
      - 語り: 修理は、約45万石を、取り上げました。嫡男の死で、2万5千石を返上し、火葬は、残る2万石を、取り上げました。
        tone: しみじみ
      # fact: fukushima-25
      - 語り: 福島家は、3112石の旗本として残り、一度絶えたあと、1681年に、2千石で戻りました。
      - 語り: 広島49万8千石の福島正則は、城を失って5年後、信濃の山あいで死に、その死のあとにも、取り上げられるものが、残っていました。
        tone: しみじみ
        pause: 0.8
        year: 1624

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
