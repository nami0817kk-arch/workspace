sections:
  # ================================================================ 序章（冒頭 約2分）。今の当主が誰かは第11章まで言わない
  - title: 「この王に、子はいなかった」　スペイン王カルロス2世　1700年11月1日
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1700
    lines:
      # fact: habs-01
      - 語り: 1700年11月1日、スペインの王、カルロス2世が、38歳で亡くなりました。子どもは、一人もいませんでした。
        tone: 重い
        card: {head: "1700年11月1日", body: スペイン王 38歳で没・子なし}
      # fact: habs-02
      - 語り: この王の両親は、叔父と、姪でした。
        figure: {type: people, title: カルロス2世の両親, nodes: [[フェリペ4世, 父・叔父], [マリアナ, 母・姪], [カルロス2世, 子なしで没]], edges: [[フェリペ4世, マリアナ, 叔父と姪], [フェリペ4世, カルロス2世, 父], [マリアナ, カルロス2世, 母]]}
      # fact: habs-03
      - 語り: 両親が同じ先祖を持つ度合いを表す、近親係数。家系図から計算した、この王の値は、《0.254》。きょうだいのあいだに生まれた子と、ほとんど同じです。
        figure: null
        card: {head: "近親係数 0.254", body: きょうだいの子（0.25）と同じ水準}
      # fact: habs-12
      - 語り: ハプスブルク家は、戦争ではなく、結婚で大きくなった家、といわれてきました。
      - 語り: その家の、スペインの血筋は、なぜ、38歳の王で、途絶えたのか。
        tone: 疑問
      - 語り: そして、ハプスブルク家は、スペインで終わったあとも、続いています。今の当主が誰なのかは、家系図の、いちばん右で、お見せします。
      # fact: habs-09
      - 語り: 家系図の、いちばん左は、1273年です。
        year: 1273
        hook: true
      - 語り: 『他の者は戦え、幸いなるオーストリアよ、結婚せよ』。この家を語るときに、必ず引かれる句が、あります。
        hook: true

  # ================================================================ 第1章 句の出どころ
  - title: 「他の者は戦え、幸いなるオーストリアよ、結婚せよ」　誰の言葉か　1273年から
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1273
    lines:
      # fact: habs-09
      - 語り: 1273年、ルドルフ1世が、ローマ王に選ばれます。皇帝になる前の、ドイツ側の王の称号です。5年後の1278年8月26日、マルヒフェルトの戦いで、ボヘミア王オタカル2世を破りました。
        year: 1273
        card: {head: "1273年", body: ルドルフ1世がローマ王に}
      # fact: habs-09
      - 語り: 1282年、ルドルフは、オーストリアとシュタイアーマルクの領地を、息子たちに与えます。オーストリアは、ここから1918年まで、636年間、この家のものでした。
        year: 1282
      # fact: habs-10
      - 語り: 1437年ごろから、皇帝フリードリヒ3世は、持ち物に、AEIOUと、5つの母音を、書きつけました。手帳は1666年に見つかり、意味の解釈は、300を超えるそうです。
        card: {head: "AEIOU", body: 解釈は300を超える}
      # fact: habs-11
      - 語り: では、この句は、誰の言葉なのか。ハンガリー王、マティアス・コルヴィヌスの言葉だと、伝えられてきました。
      # fact: habs-11
      - 語り: けれど、マティアスが亡くなったのは、1490年です。句が語る、1496年の結婚も、1515年の婚約も、その、あとのことです。
        tone: 疑問
      # fact: habs-11
      - 語り: イタリアの名言辞典『誰が言ったか』は、この句を、マティアスの言葉としたうえで、その帰属は誤りだ、と注記しています。
      # fact: habs-11
      - 語り: オーストリア・フォーラムは、マティアス説も、マクシミリアン説も、あとの時代の当てはめだとし、史料に出てくるのは、17世紀だと書きます。
      # fact: habs-11
      - 語り: 完全な対句の形が確かめられるのは、1718年、アウクスブルクで出た本まで下る、とする資料もあります。最初に言った人は、分かっていません。
        tone: しみじみ
      # fact: habs-12
      - 語り: ハプスブルク家の公式解説サイト、ハプスブルガー・ネットも、この句は、単純化だと言います。この家にとって、戦争も、結婚と、同じくらい大切だった、と。
      # fact: habs-13
      - 語り: それでも、結婚が、この家を大きくしたのは、本当です。いちばん大きかった結婚は、1477年でした。
        hook: true
      - 語り: 花婿は、まだ18歳でした。
        hook: true

  # ================================================================ 第2章 ブルゴーニュとスペイン
  - title: 「18歳の花婿」　ブルゴーニュとスペインを手にした結婚　1477年から1500年
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1477
    lines:
      # fact: habs-13
      - 語り: 1477年、皇帝フリードリヒ3世の息子、マクシミリアンは、18歳で、ブルゴーニュ公の娘、マリーと結婚しました。ブルゴーニュは、今のベルギーやオランダにあたる、豊かな土地でした。
        year: 1477
        card: {head: "1477年", body: マクシミリアン 18歳で結婚}
      # fact: habs-13
      - 語り: けれど、5年後の1482年、マリーは、落馬の事故で、亡くなります。結婚生活は、5年足らずでした。
        year: 1482
      # fact: habs-13
      - 語り: 領地は、理屈の上では、残された子に、渡りました。けれど、ハプスブルガー・ネットによれば、領地の一部を実際に確保するまでに、15年の戦いが、かかりました。
        tone: しみじみ
      # fact: habs-13
      - 語り: 1488年には、マクシミリアン自身が、ブルージュの町で、一時、とらわれています。
        year: 1488
      # fact: habs-14
      - 語り: 1496年から翌年にかけて、今度は、スペインです。二組の結婚が、続けて、行われました。
        year: 1496
        card: {head: "1496年", body: スペインとの二重の結婚}
      # fact: habs-14
      - 語り: すると、スペインの王位を継ぐはずだった人たちが、次々に亡くなり、気がつけば、残っていたのは、王女のフアナでした。
      # fact: habs-14
      - 語り: フアナの夫は、マクシミリアンの息子、美公と呼ばれた、フェリペです。1500年、二人のあいだに、男の子が生まれます。のちの、カール5世です。
        year: 1500
      # fact: habs-05, habs-07
      - 語り: 研究者が計算した、このフェリペの近親係数は、0.025。ほとんど、ゼロです。二人は、遠い親戚ではありましたが、この数字を、覚えておいてください。
        figure: {type: stats, title: ハプスブルク王の近親係数, items: [[フェリペ1世, 0.025, 創始者], [フェリペ3世, 0.218], [カルロス2世, 0.254, 最後の王]], upto: 1}
      - 語り: のちのカール5世は、広い領地を、一人で、継ぐことになります。けれど、その前に、もう一つ、大きな結婚の約束が、ありました。
        figure: null
        hook: true
      - 語り: 場所は、ウィーンの、大聖堂です。
        hook: true

  # ================================================================ 第3章 二重の婚約
  - title: 「二重の婚約」　1515年7月22日、ウィーンの大聖堂で
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1515
    lines:
      # fact: habs-15
      - 語り: 1515年7月22日。ウィーンの、シュテファン大聖堂で、二組の、結婚の約束が、交わされました。
        year: 1515
        card: {head: "1515年7月22日", body: ウィーン 二重の婚約}
      # fact: habs-15
      - 語り: マリアと、ルートヴィヒ。そして、アンナと、フェルディナント。マリアと、フェルディナントは、皇帝マクシミリアンの孫。ルートヴィヒと、アンナは、ハンガリーとボヘミアの王の、きょうだいです。
        figure: {type: people, title: 1515年の二重の婚約, nodes: [[マリア, 皇帝の孫娘], [ルートヴィヒ, 王の息子], [フェルディナント, 皇帝の孫], [アンナ, 王の娘]], edges: [[マリア, ルートヴィヒ, 婚約], [フェルディナント, アンナ, 婚約から結婚へ]]}
      # fact: habs-15
      - 語り: 式のようすは、皇帝に仕えた、歴史家で外交官の、ヨハネス・クスピニアヌスが、日記に書きました。
        figure: null
      # fact: habs-15
      - 語り: 2024年の、パップ・ユーリアの研究によれば、花婿の一人、フェルディナントは、この日、ウィーンにいませんでした。
      # fact: habs-15
      - 語り: 取り決めで、大切な役をしたのは、ルートヴィヒとアンナの叔父、ポーランド王ジグムントです。
      # fact: habs-46
      - 語り: ハプスブルガー・ネットによれば、この日、アンナの花婿の役を、その場で務めたのは、皇帝マクシミリアン自身でした。のちに、孫のフェルディナントへ、移されます。
      # fact: habs-16
      - 語り: 皇帝は、ルートヴィヒを、養子にしました。
      # fact: habs-17
      - 語り: この婚約は、のちに、絵になります。1896年、画家ブロジクが描いたのは、縦およそ4.3メートル、横およそ7.3メートルの大きな絵。題は、あの句でした。婚約から、381年あとです。
        card: {head: "1896年", body: 句を題にした大きな絵}
      # fact: habs-20
      - 語り: アンナとフェルディナントの結婚式は、1521年、リンツで行われた、とリンツ市の歴史のサイトは書きます。婚約から、およそ6年あとでした。
      - 語り: 約束された王冠は、そのまま、手に入ったのか。
        tone: 疑問
        hook: true
      - 語り: ところが、ルートヴィヒは、11年後、戦場で、命を落とします。
        hook: true

  # ================================================================ 第4章 モハーチ
  - title: 「王冠は、相続では来なかった」　1526年、モハーチの戦い
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1526
    lines:
      # fact: habs-18
      - 語り: 1526年8月29日、モハーチの戦いで、ハンガリーとボヘミアの王、ルートヴィヒ2世が、20歳で、命を落としました。
        year: 1526
        card: {head: "1526年8月29日", body: モハーチ 王が20歳で戦死}
      # fact: habs-19
      - 語り: 婚約の取り決めは、思っていたより、ずっと早く、効き始めました。ハプスブルガー・ネットの言い方です。
      # fact: habs-19
      - 語り: けれど、それは、王冠が自動で渡る、という意味では、ありませんでした。どちらの国でも、選挙が、必要だったからです。
      # fact: habs-19
      - 語り: ボヘミアでは、その年のうちに、貴族たちの議会が、フェルディナントを、王に選びました。
        figure: {type: map, title: フェルディナントが手に入れた王冠, bounds: [8, 24, 44, 53], places: [[ウィーン, 16.37, 48.21], [プラハ, 14.42, 50.08], [ブダ, 19.04, 47.5]], route: [プラハ, ウィーン, ブダ], upto: 2}
      # fact: habs-19
      - 語り: ハンガリーでは、ライバルの貴族、ヤーノシュ・ザポリヤも、同じ1526年に、王に選ばれ、戴冠しました。
        figure: {type: map, title: フェルディナントが手に入れた王冠, bounds: [8, 24, 44, 53], places: [[ウィーン, 16.37, 48.21], [プラハ, 14.42, 50.08], [ブダ, 19.04, 47.5]], route: [プラハ, ウィーン, ブダ], upto: 3}
      # fact: habs-19
      - 語り: 2021年に出た、ハンガリー歴史評論の、ペーテルフィの論文は、フェルディナントの主張の根拠は、条約ではなく、1526年の選出と、1527年の戴冠だった、と指摘します。
        figure: null
      # fact: habs-19
      - 語り: 手に入ったのは、ハンガリーの、北西の一部だけでした。
        tone: しみじみ
      - 語り: 結婚は、扉を開けただけでした。そのあとに必要だったのは、選挙と、戦争です。
        hook: true
      - 語り: その広い領地を、一人で抱えた皇帝は、ある決断をします。
        hook: true

  # ================================================================ 第5章 家を二つに
  - title: 「家を二つに分けた皇帝」　1556年、カール5世の退位
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1556
    lines:
      # fact: habs-21
      - 語り: 1556年、カール5世は、55歳で、退位しました。
        year: 1556
        card: {head: "1556年", body: カール5世 退位}
      # fact: habs-21
      - 語り: 神聖ローマ皇帝の位は、弟のフェルディナントへ。スペインは、息子のフェリペ2世へ。ハプスブルク家は、オーストリアと、スペインの、二つの家に、分かれました。
      # fact: habs-07
      - 語り: カール5世の妻は、ポルトガルの王女イサベルでした。二人は、いとこどうしです。
      # fact: habs-06
      - 語り: 息子のフェリペ2世は、生涯に、4回、結婚しました。そのうちの1回は、姪の、アナとの結婚でした。
      # fact: habs-06
      - 語り: 2009年、アルバレスたち3人の研究者が、PLOS ONEに、論文を載せます。スペインのハプスブルク家の、16世代、3,000人を超える家系図を、たどった研究です。
        card: {head: "2009年の論文", body: 16世代・3,000人超の家系図}
      # fact: habs-06
      - 語り: 王家の結婚、11組のうち、9組。81.8%が、ひいひいおじいさんが同じか、それより近い、親戚どうしの結婚でした。
      # fact: habs-06
      - 語り: 叔父と姪の結婚は、2組。フェリペ2世と、アナ。そして、フェリペ4世と、マリアナです。
        hook: true
      - 語り: では、その近さは、どんな数字になったのか。
        hook: true

  # ================================================================ 第6章 近親係数
  - title: 「0.025から0.254へ」　近親係数と、顎の研究　2009年と2019年
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 2009
    lines:
      # fact: habs-05
      - 語り: 論文が示した、近親係数は、創始者のフェリペ1世で、0.025。フェリペ3世で、0.218。そして、最後の王、カルロス2世で、0.254。
        figure: {type: stats, title: ハプスブルク王の近親係数, items: [[フェリペ1世, 0.025, 創始者], [フェリペ3世, 0.218], [カルロス2世, 0.254, 最後の王]], upto: 3}
        card: {head: "0.025 → 0.254", body: 近親係数の移り変わり}
      # fact: habs-05
      - 語り: 歴代の王の、平均は、0.129。論文は、カルロス2世の値が、きょうだい、あるいは親子のあいだに、生まれた子の値、0.25に、ごく近いと書きます。
      # fact: habs-03
      - 語り: 近親係数は、両親が、同じ先祖を持つとき、同じ遺伝子を二重に受け継ぐ、確率の目安です。
      # fact: habs-03
      - 語り: 論文によれば、この王の遺伝子の、およそ4分の1が、両親から同じものを、受け継いだ組になる、と見込まれます。
        figure: null
      # fact: habs-23
      - 語り: 子どもの死も、数えられています。16世紀から17世紀に、生まれた、王家の子ども34人のうち、1歳になる前に、10人。29.4%が、世を去りました。
        figure: {type: pie, title: 王家の子ども34人, parts: [[10歳になる前に亡くなった, 17], [10歳を超えた, 17]], unit: 人}
      # fact: habs-23
      - 語り: 10歳になる前では、17人。ちょうど、半分です。同じころの、スペインの村では、1歳になる前に亡くなる子は、およそ2割でした。
        tone: しみじみ
      # fact: habs-25
      - 語り: 「ハプスブルクの顎」の研究も、あります。2019年、10人の顎顔面の外科医が、ハプスブルク家15人の、肖像画66枚を見て、顎の形を診断しました。
        figure: null
        card: {head: "2019年の研究", body: 肖像画66枚を外科医10人が診断}
      # fact: habs-25
      - 語り: 結果は、下の顎の突き出しと、近親の度合いに、強い関係がある、というものでした。著者たち自身が、人数が少なく、偶然の可能性も残る、と断っています。
      - 語り: では、この家の、最後の王は、どんな子どもだったのか。
        hook: true
      - 語り: 最後の王の、子ども時代へ。
        hook: true

  # ================================================================ 第7章 呪われた王
  - title: 「私も、そう思い始めている」　呪われた王と、1698年の悪魔祓い
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1661
    lines:
      # fact: habs-01
      - 語り: 1661年11月6日、マドリードで、カルロスは、生まれました。フェリペ4世が、ようやく授かった、生き残った男の子でした。
        year: 1661
        card: {head: "1661年11月6日", body: カルロス2世 誕生}
      # fact: habs-24
      - 語り: 先ほどの論文は、この子は、4歳まで話せず、8歳まで歩けなかった、と書きます。
      # fact: habs-24
      - 語り: ところが、英語版のウィキペディアは、4歳まで、助けなしでは歩けなかった、と書きます。同じ王の、歩き始めが、4歳と、8歳。どちらも、同時代の記録ではなく、あとの時代の、まとめです。
        tone: 疑問
      # fact: habs-26
      - 語り: 論文は、この王の症状を、説明する仮説も、挙げました。複合性下垂体ホルモン欠損症と、遠位尿細管性アシドーシス。ホルモンが足りなくなる病気と、腎臓の病気です。
      # fact: habs-26
      - 語り: どちらも、両親から同じ遺伝子を受け継いだときに、出やすい、劣性の病気です。それが重なったのではないか、という推測です。
      # fact: habs-44
      - 語り: 一方で、同じ時代の外交官の報告は、割れています。
      # fact: habs-44
      - 語り: 英語版ウィキペディアによれば、1691年のモロッコの使節は、王が、自ら会って、話し合いに、十分に加わった、と報告しています。
      # fact: habs-44
      - 語り: サヴォイアの外交官、オペルティは、王を、気前がよく、愛想はいいが、内気で、自信がない人、と描きました。
      # fact: habs-45
      - 語り: 1665年、王は、わずか3歳で即位し、母のマリアナが、幼い王に代わって政治を行う、摂政を、1675年まで務めました。
        year: 1665
      # fact: habs-01
      - 語り: 王は、1679年に、フランスの王女マリー・ルイーズと、結婚します。彼女は、1689年に亡くなり、同じ年、2人目の妻を迎えました。どちらとも、子は、生まれませんでした。
      # fact: habs-27
      - 語り: 宮廷では、王は、呪われている、と、噂されました。「エル・エチサード」。魔法をかけられた王、呪われた王、と呼ばれます。
        card: {head: "エル・エチサード", body: 呪われた王}
      # fact: habs-27
      - 語り: 19世紀の歴史家、ラフエンテの『スペイン通史』によれば、1698年の初め、王は、異端を裁く教会の裁判所、宗教裁判所の長官、ロカベルティに、秘密で、相談しました。
        year: 1698
      # fact: habs-27
      - 語り: 同じ年の9月、北スペインのカンガス・デ・ティネオの修道院で、アルグエリェスが、修道女に取りついた悪魔を、祓います。悪魔は、王は、14歳のとき、飲み物で、呪われた、と答えた、と伝わります。
      # fact: habs-27
      - 語り: ところが、11月、その答えは、取り消されました。ラフエンテは、王には、何もなく、先の話は、うそだった、と書いています。
        tone: しみじみ
      # fact: habs-27
      - 語り: 王本人に会って、悪魔祓いをしたのは、1699年6月の、カプチン会の修道士、テンダです。
      # fact: habs-28
      - 語り: 地方史の記事は、王が、新しい宗教裁判所の長官に、こう語った、と伝えます。「多くの人が、私は呪われていると言う。私も、そう思い始めている」。
        tone: しみじみ
      - 語り: 子のない王の死を、ヨーロッパは、待っていました。
        hook: true
      - 語り: 王国は、王の知らないところで、分けられ始めます。
        hook: true

  # ================================================================ 第8章 遺言
  - title: 「王国は、神だけが与える」　1698年から、1700年10月の遺言
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1698
    lines:
      # fact: habs-29
      - 語り: 1698年、ハーグで、イギリス、フランス、オランダが、スペインの王国を、分ける取り決めを、結びました。スペインには、相談しないまま、です。
        year: 1698
        card: {head: "1698年", body: ハーグで王国の分割を取り決め}
      # fact: habs-29
      - 語り: 王は、同じ年の11月14日の遺言で、バイエルンの、幼い公子、ヨーゼフ・フェルディナントを、後継に指名しました。
      # fact: habs-29
      - 語り: けれど、公子は、1699年に、天然痘で亡くなります。1700年3月には、2度目の分割条約が、結ばれました。
      # fact: habs-29
      - 語り: 1700年の6月ごろ、王は、分割条約を知って、遺言を、のちの皇帝カール6世になる、オーストリアの大公カールに、書き換えます。ただし、スペインを、分けてはならない、という条件つきで。
        year: 1700
      # fact: habs-30
      - 語り: 9月末には、王は、食事も、できなくなりました。宮廷の有力者、教皇に次ぐ高位の聖職者、ポルトカレーロ枢機卿が、説得して、フランスの王子の名を、挙げさせた、とされます。
      # fact: habs-30
      - 語り: 1700年10月の遺言で、後継に指名されたのは、ルイ14世の孫、フランスのアンジュー公フィリップ。のちの、フェリペ5世です。
        card: {head: "1700年10月", body: 遺言でアンジュー公フィリップを指名}
      # fact: habs-43
      - 語り: ハプスブルガー・ネットの解説は、このときの王の言葉を、王国を与えるのは神だけで、自分は何者でもない、という趣旨で、伝えています。
        tone: しみじみ
      # fact: habs-01, habs-31
      - 語り: 1700年11月1日、王は、亡くなりました。38歳と11か月。39歳の誕生日まで、あと5日でした。
        year: 1700
        tone: 重い
      # fact: habs-31
      - 語り: 11月16日、ヴェルサイユで、フィリップが、スペイン王フェリペ5世と、宣言されます。1701年から1714年まで、王位をめぐる戦争が、続きました。
      # fact: habs-08
      - 語り: 1516年にカール5世が、スペイン王となってから、1700年まで。スペインのハプスブルク家は、184年で、幕を閉じました。
        card: {head: "184年", body: スペイン分家 1516〜1700}
      # fact: habs-32
      - 語り: 新しい王の、祖母は、マリア・テレサ。カルロス2世の、異母姉でした。ハプスブルクの血は、ここから、スペインのブルボン家へ、流れ込みます。
        hook: true
      - 語り: では、もう一つの家、オーストリアは、どうなったのか。
        hook: true

  # ================================================================ 第9章 オーストリア
  - title: 「国事詔書」　マリア・テレジアから、1919年のハプスブルク法まで
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 1713
    lines:
      # fact: habs-33
      - 語り: 1713年4月19日、皇帝カール6世は、国事詔書を出しました。ハプスブルガー・ネットは、主な目的は、君主国を、分けられないものにする、憲法上の土台だった、と説明します。
        year: 1713
        card: {head: "1713年4月19日", body: 国事詔書}
      # fact: habs-33
      - 語り: カール6世は、世継ぎになる男の子が、残らないまま、1740年に、亡くなりました。
        year: 1740
      # fact: habs-34
      - 語り: 継いだのは、娘の、マリア・テレジア。16人の子を産みました。11人が娘で、5人が息子。大人になったのは10人。6人は、早くに亡くなりました。
        figure: {type: pie, title: マリア・テレジアの16人の子, parts: [[成人した, 10], [早くに亡くなった, 6]], unit: 人}
      # fact: habs-35
      - 語り: 娘たちの結婚は、家の政策でした。マリア・アマーリアは、意に反して、パルマ公へ。愛で結婚を許されたのは、クリスティーナ、ただ一人だった、と、ハプスブルガー・ネットは書きます。
        figure: null
      # fact: habs-38
      - 語り: 第一次世界大戦の直前、この家の領土は、およそ67万7千平方キロメートル。人口は、およそ5,100万人でした。
        card: {head: "大戦の直前", body: "5,100万人"}
      # fact: habs-36
      - 語り: 1918年11月11日、皇帝カール1世は、シェーンブルン宮殿で、国政に関わることをやめる、という声明に署名します。退位は、拒みました。
        year: 1918
      # fact: habs-37
      - 語り: 翌日、共和国が宣言され、1919年4月3日、ハプスブルク法が成立します。一家は、国を追われました。
        year: 1919
      # fact: habs-36
      - 語り: カール1世は、1922年4月1日、マデイラ島で、亡くなりました。ハプスブルガー・ネットは、35歳と書きます。けれど、生年月日の1887年8月17日から数えると、34歳7か月です。
        tone: しみじみ
      - 語り: 家系図の線は、ここで、切れたのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 家系図の、右の端には、今、誰がいるのか。
        hook: true

  # ================================================================ 第10章 今の当主
  - title: 「死すべき、罪深い人間」　オットーの葬儀と、今の当主　2011年7月16日
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    year: 2011
    lines:
      # fact: habs-39
      - 語り: 2011年7月4日、オットー・フォン・ハプスブルクが、亡くなりました。皇帝カール1世の、長男です。
        year: 2011
      # fact: habs-40
      - 語り: 葬儀は、12日後の、7月16日。ウィーンのシュテファン大聖堂で、追悼ミサが行われ、行列は、カプツィーナー納骨堂へ、向かいました。
        card: {head: "2011年7月16日", body: オットーの葬儀}
      # fact: habs-40
      - 語り: 納骨堂の扉の前には、決まった儀式が、あります。3度目のノックに、「オットー・ハプスブルク、死すべき、罪深い人間」と、答えると、扉が、開きました。
      # fact: habs-40, habs-42
      - 語り: オットーの心臓は、翌日、ハンガリーの、パンノンハルマ修道院に、納められました。この家は、体と、心臓と、内臓を、別々の場所に納める、慣習を持っています。
      # fact: habs-39
      - 語り: この葬儀の、4年半あまり前。2007年1月1日に、オットーは、当主の座を、長男に、譲っていました。
        year: 2007
      # fact: habs-41
      - 語り: その長男が、カール・フォン・ハプスブルク。最後の皇帝の、孫です。1961年1月11日の、生まれです。1996年から1999年まで、オーストリア国民党から、欧州議会の議員を務めました。
        card: {head: "ハプスブルク家 現当主", body: カール 2007年から}
      # fact: habs-41
      - 語り: 英語版ウィキペディアによれば、本人は、肩書を使いません。そこまで、見栄っ張りではない、と語っています。
      - 語り: 家系図の、いちばん右には、今も、当主が、います。
        tone: しみじみ
        hook: true
      - 語り: では、結婚で広がった家の、スペインの血筋は、なぜ、終わったのか。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：結婚で広げた家は、なぜ、スペインの血筋を、38歳の王で終えたのか
    background: {image: paintings/maria_theresa_meytens.png, credit: "マイテンス《マリア・テレジア》（パブリックドメイン）"}
    lines:
      # fact: habs-13, habs-19
      - 語り: 結婚は、確かに、この家を、大きくしました。ブルゴーニュ。スペイン。ボヘミア。ハンガリー。けれど、どれも、結婚だけでは、手に入りませんでした。戦いと、選挙が、必要でした。
      # fact: habs-06, habs-05
      - 語り: 近い親戚どうしの結婚が、重なっていたことは、数字で分かっています。11組のうち、9組。叔父と姪が、2組。近親係数は、0.025から、0.254へ。
      # fact: habs-05, habs-26
      - 語り: 研究者は、近親婚が、原因だったと、言い切ってはいません。論文が書くのは、「そう、言われてきた」ことと、2つの病気が重なったのではないか、という推測です。
      # fact: habs-08, habs-01
      - 語り: 1700年11月1日。38歳の王に、子は、いませんでした。家系図の、左は1273年、右は今。途中で、一本の枝が、静かに途切れても、ハプスブルクの線は、続いています。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、この家系図を、どう読みますか。コメントで、聞かせてください。チャンネル登録も、よろしくお願いします。
