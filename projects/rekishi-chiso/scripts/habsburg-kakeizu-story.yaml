# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1700年11月1日、スペインの王カルロス2世が、38歳で亡くなりました。子どもは、一人もいませんでした。この王の両親は、《叔父と、姪》でした。
  ハプスブルク家は、戦争ではなく、結婚で大きくなった家だといわれてきました。その家の、スペインの血筋は、なぜ、38歳の王で、途絶えたのか。
  この動画でわかること
  ・「他の者は戦え、幸いなるオーストリアよ、結婚せよ」の句は、誰の言葉なのか
  ・1515年、ウィーンの大聖堂で交わされた二重の婚約と、手に入らなかった王冠
  ・近親係数0.025から0.254へ。2009年の論文が数えた、王家の結婚の近さ
  ・1698年の悪魔祓いと、1700年10月の遺言
  ・スペインのあとも続いた家と、今の当主
description_note: |-
  事実は、論文（Alvarez, Ceballos & Quinteiro「The Role of Inbreeding in the Extinction of a European Royal Dynasty」PLOS ONE 2009／Vilas ほか Annals of Human Biology 2019）、ハプスブルク家の公式解説サイト habsburger.net、Papp Júlia「1515年のウィーンのハプスブルク＝ヤギェウォ二重婚約の16〜19世紀の美術での表現」（Történelmi Szemle 2024）、Péterfi「Ferdinand I's claim to Hungary」（Hungarian Historical Review 2021）、ラフエンテ『スペイン通史』（1856）、Wikipedia の項目などで確かめました。
  近親婚が王家の断絶の原因だったかどうかは、論文も断定していません。「そう言われてきた」ことと、2つの劣性の病気が重なったという推測が示されているだけです。
  「他の者は戦え、幸いなるオーストリアよ、結婚せよ」の句の出どころは、確かめられていません。記録によってマティアス・コルヴィヌスの言葉とされますが、名言辞典は誤りと注記しています。
  カルロス2世の歩き始めの年は、論文では8歳、英語版ウィキペディアでは4歳と、書き方が違います。カール1世の没年齢は、ハプスブルガー・ネットが35歳と書き、生年月日からの計算は34歳7か月です。
  今の当主については、公的な経歴に出ていることだけを取り上げています。
  画面の風景・室内・人物は、画像生成AIで作った想像上のイメージで、実在の写真・肖像ではありません。サムネイルの人物像は AI による想像図です。

en:
  title: "Habsburg Family Tree: Grown by Marriage. Why Did the Spanish Line End With a 38-Year-Old King?"
  description: |-
    On 1 November 1700, King Charles II of Spain died at 38, leaving no child. His parents were uncle and niece.
    The Habsburgs are said to have grown by marriage, not by war. Why did their Spanish line end with a 38-year-old king?
    In this video you will learn:
    - Who really said "Let others wage war; you, happy Austria, marry"
    - The double betrothal of 1515 in Vienna, and the crowns that did not simply fall into their hands
    - The inbreeding coefficient from 0.025 to 0.254, counted in a 2009 study
    - The exorcism of 1698 and the will of October 1700
    - What became of the house after Spain, and its head today
    The study does not claim inbreeding was the proven cause of the extinction. Scene images are AI-generated illustrations, not real photos. Thumbnail portraits are AI-made imaginary portraits. Japanese-language history video (Japanese audio).
  chapters:
    - "The King Who Left No Child, 1 November 1700"
    - "Who Said 'Happy Austria, Marry'? 1273 to 1718"
    - "The 18-Year-Old Bridegroom, 1477 to 1500"
    - "The Double Betrothal, Vienna, 22 July 1515"
    - "The Crown Was Not Inherited: Mohacs, 1526"
    - "The Emperor Who Split the House, 1556"
    - "Inbreeding Coefficient from 0.025 to 0.254"
    - "The Bewitched King, 1698"
    - "The Will of October 1700"
    - "The House After Spain: Maria Theresa to 1919"
    - "The Head Today: Otto's Funeral, 16 July 2011"
    - "Summary: Why Did the Spanish Line End at 38?"

