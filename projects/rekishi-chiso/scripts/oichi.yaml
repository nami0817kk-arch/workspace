sections:
  # ---------------------------------------------------------------- 1 地表
  - title: 地表：戦国一の美女と、1570年の小豆袋
    background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
    year: 1570
    lines:
      - 語り: 兄に危険を知らせた、お市の方の小豆袋。この話は、信長の家臣が書いた記録には、一行も出てきません。
        tone: 重い
        short: s1
        card: {head: "1570年", body: "小豆袋は信長公記に出てこない"}
      - 聞き: お市の方は、戦国一の美女でしょ？ 袋の両はしを縛って、袋のねずみだよって、兄の信長に教えた話。ドラマで見た。
        tone: 疑問
      - 語り: 1570年、越前の金ヶ崎。朝倉を攻めていた信長は、妹の夫、浅井長政に背かれます。そこへ妹が送った、というのが小豆袋です。
        background: {image: paintings/oichi_nagamasa_kuniyoshi.jpg, credit: "歌川国芳《太平記英勇伝 阿佐井備前守仲政》（浅井長政を名を変えて描いた武者絵）1848〜50年ごろ"}
      - 聞き: 夫の家にいながら、こっそり兄を助けた。あーし的には、そこがいちばん好きな場面なのに。
        tone: しみじみ
      - 語り: 「戦国一の美女」と「小豆袋」。それが今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 聞き: 美女のほうも掘るの？ 肖像画が、ちゃんと残ってるじゃん。
        tone: 疑問
      - 語り: その肖像画が、いつ、誰のために描かれたのか。そこも、最後に掘ります。
        card: {head: "肖像画", body: "いつ、誰のために描かれた？"}
      - 聞き: 本人を見て描いたんじゃないの？ じゃあ、美女っていうのは、どこから来たの？
        tone: 疑問
      - 語り: 「天下一の美人」という言葉は、たしかに古い本にあります。ただ、その本がいつ書かれたか。そこが、今日の掘りどころの一つです。
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 聞き: 有名な話ほど、掘ると何か出てきそう。
        tone: 疑問
      - 語り: もう一つ。お市は生涯に2度、城が落ちる日を迎えます。2度目に何を選んだのかは、娘の側の記録に残っています。
      - 聞き: 2度も？ 1度だけでも、想像できないのに。
        tone: しみじみ
      - 語り: そこを確かめに、お市の37年を、生まれた順に掘ります。この前の信長の回では、金ヶ崎を信長の側から見ました。今日は、お市の側から見直します。
        background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
      - 聞き: 了解。今日は兄と妹、両方の側から掘る。ヘルメット、しっかりかぶっとく。
        tone: 明るい

  # ---------------------------------------------------------------- 2 生まれ
  - title: 1547年ごろ 尾張に生まれた信長の妹
    background: {image: paintings/nobunaga_kuniyoshi_musha.png, credit: "歌川国芳《太平記英勇伝》（信長を名を変えて描いた武者絵）1848〜49年ごろ"}
    portrait: {image: paintings/nobunaga_chokoji_bust.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）"}
    year: 1547
    lines:
      - 語り: お市は、尾張、今の愛知県西部で生まれました。生まれた年は、1547年ごろです。
        card: {head: "1547年ごろ", body: "尾張に生まれる"}
      - 聞き: ごろ、なんだ。お姫さまなら、誕生日まできっちり残ってそうなのに。
        tone: 疑問
      - 語り: 実は、生まれた年を書いた記録はありません。37歳で亡くなった、という記録から、逆に数えた年です。生まれた城も、那古野城と言われるだけです。
      - 聞き: 亡くなった年から引き算したんだ。テストの答えから、式を作るみたい。
        tone: 笑い
      - 語り: 父は、尾張の織田信秀。兄の信長より13歳年下の妹、というのが通説です。母は、信長と同じ土田御前という説もありますが、分かっていません。
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        card: {head: "兄・信長", body: "13歳上の兄"}
      - 聞き: 13歳差なら、お兄ちゃんっていうより、若い叔父さんくらいの感じかな。
      - 語り: お市が数えで14歳のとき、その兄は、桶狭間で今川義元を破ります。お市は、兄が一気に名を上げていくのを見ながら育ったことになります。
        portrait: null
        background: {image: paintings/nobunaga_okehazama_toyonobu.jpg, credit: "歌川豊宣《尾州桶狭間合戦》1882年"}
        card: {head: "1560年", body: "兄・信長が桶狭間で勝つ"}
      - 聞き: 中学生くらいの妹から見たら、お兄ちゃん、急に有名人だ。自慢だったのかな。
        tone: 明るい
      - 語り: ただ、その「妹」というのも、一つの説です。江戸時代の『織田系図』には、信長のいとこだった、と書かれています。
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 語り: 『以貴小伝』という本には、いとこだったのを、妹として披露した、とまであります。
        card: {head: "以貴小伝", body: "いとこを妹として披露した"}
      - 聞き: 嫁ぎ先に、格を高く見せるため？ 政略結婚なら、ありそうな話。
        tone: 疑問
      - 語り: そう考えたくなりますね。ただ決め手はなく、今も妹とする説が通説です。
      - 語り: 名前も、はっきりしません。「市」は通説ですが、信頼できる記録には実の名が出てこない、と言う研究者もいます。
        background: {image: paintings/oichi_taiheiki_shui_1870.jpg, credit: "落合芳幾《太平記拾遺 勝家の室於市之方》1870年"}
      - 聞き: でもこの絵、右上に「於市之方」って書いてあるよ。
        detail: {box: [0.62, 0.08, 0.9, 0.45], label: 「勝家の室 於市之方」（明治3年の錦絵）}
      - 語り: これは明治3年、1870年の錦絵です。後の時代の人が、そう呼んできたのは確かです。系図には「秀子」と書いたものもありますが、これも後の系譜です。
        detail: {box: [0.62, 0.08, 0.9, 0.45], label: 「勝家の室 於市之方」（明治3年の錦絵）}
      - 聞き: 名前も、生まれた年も、親まで、ぼんやりしてる。あーし、自分の誕生日がぼんやりしてたら困る。
        tone: 笑い
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 語り: 子どものころの話も、記録にはほとんど残っていません。お市がはっきり姿を見せるのは、嫁いでからです。
      - 語り: その嫁いだ年も、昔と今とで、言われる年がちがいます。
        hook: true

  # ---------------------------------------------------------------- 3 結婚
  - title: 1567年ごろ 近江・小谷城の浅井長政に嫁ぐ
    background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
    portrait: {image: paintings/oichi_nagamasa_portrait_full.jpg, caption: "浅井長政（高野山持明院蔵）"}
    year: 1567
    lines:
      - 語り: 1567年から68年ごろ、お市は、近江の北、小谷城の浅井長政に嫁ぎました。小谷は、今の滋賀県長浜市です。
        card: {head: "1567年ごろ", body: "浅井長政に嫁ぐ"}
      - 聞き: そのとき何歳？ 戦国のお姫さまって、すごく若くでお嫁に行くイメージ。
        tone: 疑問
      - 語り: 数えで21か22歳です。少し前までは、1564年に嫁いだ、と言われていました。それなら18歳です。
      - 聞き: 3年もずれたのは、なんで？ 新しい手紙でも見つかったの？
        tone: 疑問
      - 語り: 縁組の話の流れを、記録で追うと見えてきます。1565年の暮れ、近江の六角承禎が、和田惟政に両家の縁組を取り持たせようとして、いったん流れました。
        portrait: null
        background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
      - 語り: そして1567年の9月、長政の側から、美濃の市橋長利を通して、信長に同盟を申し入れています。結婚は、このあと、と見るのが自然です。
        card: {head: "1567年9月", body: "浅井から信長に同盟の申し入れ"}
      - 聞き: 同盟の話が先にあって、そのしるしにお嫁に行った、って順番か。最初の話から2年近く。今の婚活より、ずっと長い。
        tone: 納得
      - 語り: もう一つ、長政には1564年生まれの男の子、万福丸がいます。母は分かっていませんが、お市の子ではない、と考えられています。
        background: {image: paintings/oichi_nagamasa_portrait_full.jpg, credit: "《浅井長政像》（高野山持明院蔵）1580年代"}
        card: {head: "1564年", body: "長政の長男・万福丸が生まれる"}
      - 聞き: 1564年に嫁いでたら、お市の子みたいに見えちゃう。それで話がこんがらがったんだ。
        tone: 納得
      - 語り: 長政は、お市より2つ年上です。高野山の持明院には、この長政の肖像も、お市の肖像と対で伝わっています。
      - 聞き: 夫婦の肖像が、並んで残ってるんだ。それはちょっと、うれしい話。
        tone: 明るい
      - 語り: 夫婦のあいだには、1569年に長女の茶々、翌年に次女の初が生まれました。
        background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
        card: {head: "1569年", body: "長女・茶々が生まれる"}
      - 聞き: 仲のいい夫婦だったんだろうな。ドラマだと、いつも見つめ合ってるもん。
        tone: 明るい
      - 語り: 仲がよかったかどうかは、記録からは分かりません。分かるのは、二つの家の約束の真ん中に、お市がいた、ということです。
      - 語り: 1568年、信長は、足利義昭を立てて京都に上ります。研究者の黒田基樹さんは、ここで両家の関係が決定的に変わった、と見ています。
        background: {image: paintings/nobunaga_rakuchu_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        card: {head: "1568年", body: "信長が京都に上る"}
      - 聞き: お兄ちゃんが急に天下人の側になって、浅井と対等じゃなくなった、ってことか。あーし、嫌な予感しかしない。
        tone: 疑問
      - 語り: その予感どおり、結婚から3年ほどで、兄と夫は敵どうしになります。
        hook: true

  # ---------------------------------------------------------------- 4 金ヶ崎
  - title: 1570年 金ヶ崎の退き口と小豆袋
    background: {image: paintings/oichi_nagamasa_kuniyoshi.jpg, credit: "歌川国芳《太平記英勇伝 阿佐井備前守仲政》（浅井長政を名を変えて描いた武者絵）1848〜50年ごろ"}
    year: 1570
    lines:
      - 語り: 1570年4月、信長は、越前、今の福井県の朝倉義景を攻めます。その途中の金ヶ崎で、思わぬ知らせが届きました。
        card: {head: "1570年4月", body: "信長が越前の朝倉を攻める"}
        figure: {type: map, title: 1570年 金ヶ崎の退き口, bounds: [135.3, 137.0, 34.8, 36.2], places: [[金ヶ崎, 136.07, 35.67], [小谷, 136.28, 35.46], [京都, 135.77, 35.01], [岐阜, 136.76, 35.42]], route: [金ヶ崎, 京都], note: 前に朝倉、後ろに浅井}
      - 語り: 浅井長政が背いた、という知らせです。前は朝倉、後ろは浅井。はさみ撃ちになる形でした。
        short: s1
        figure: {type: map, title: 1570年 金ヶ崎の退き口, bounds: [135.3, 137.0, 34.8, 36.2], places: [[金ヶ崎, 136.07, 35.67], [小谷, 136.28, 35.46], [京都, 135.77, 35.01], [岐阜, 136.76, 35.42]], route: [金ヶ崎, 京都], note: 前に朝倉、後ろに浅井}
        mark: {type: circle, at: 2}
      - 聞き: 小谷が、ちょうど帰り道をふさぐ所にあるんだ。ここで、お市の小豆袋が届くんだよね。
        tone: 疑問
      - 語り: 『信長公記』を開いてみましょう。知らせを聞いた信長は、はじめ、信じませんでした。
        figure: null
        background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
      - 語り: 1570年の金ヶ崎。浅井は身内で、北近江を任せてある。不満などあるはずがない。うその話だろう。信長は、そう言いました。
        short: s1
        card: {head: "信長公記", body: "信長は「うその話だろう」"}
      - 聞き: 妹の旦那さんだもん。信じたくない気持ち、ちょっと分かる。
        tone: しみじみ
      - 語り: でも、同じ知らせが次々に届き、信長は退くと決めます。4月30日には、京都に戻りました。これが金ヶ崎の退き口です。
        card: {head: "1570年4月30日", body: "信長が京都に戻る"}
      - 聞き: その次々に届いた知らせの一つが、小豆袋だったんでしょ？
        tone: 疑問
        background: {image: paintings/oichi_nagamasa_kuniyoshi.jpg, credit: "歌川国芳《太平記英勇伝 阿佐井備前守仲政》（浅井長政を名を変えて描いた武者絵）1848〜50年ごろ"}
      - 語り: 『信長公記』には、知らせた人の名前が、一人も書かれていません。小豆袋も、出てきません。
        tone: 強調
        short: s1
      - 聞き: 一行も！？ じゃあ小豆袋は、どこから来た話なの？
        tone: 驚き
        short: s1
      - 語り: 後の時代に、朝倉の旧臣が書いた軍記です。『朝倉家記』などに、こうあります。
        short: s1
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        card: {head: "朝倉家記", body: "朝倉の旧臣が書いた軍記"}
      - 語り: 袋に小豆を入れ、袋の両はしを縄で結んで、封をして信長に贈った。書かれているのは、それだけです。
        short: s1
        icon: envelope-simple
      - 聞き: 袋のねずみ、っていう謎かけは？ そこが一番おもしろいところなのに。
        tone: 疑問
      - 語り: それは、あとの時代の読み方です。両はしを縛った袋を、前と後ろをはさまれた信長に重ねたんですね。
        background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
        card: {head: "袋のねずみ", body: "後の時代の読み方"}
      - 聞き: 袋のねずみは、後の人の読み方なんだ。じゃあ、もとは、ただ小豆の入った袋？
        tone: 疑問
      - 語り: 書かれているのは、そこまでです。軍記がいつ書かれたのかも、はっきりしません。研究者のあいだでは、小豆袋は後の創作、という見方が今の主流です。
        card: {head: "今の主流", body: "小豆袋は後の創作"}
        detail: {box: [0.1, 0.05, 0.9, 0.62], label: 浅井長政を名を変えて描いた武者絵（歌川国芳）}
        background: {image: paintings/oichi_nagamasa_kuniyoshi.jpg, credit: "歌川国芳《太平記英勇伝 阿佐井備前守仲政》（浅井長政を名を変えて描いた武者絵）1848〜50年ごろ"}
      - 聞き: でも、お市が何かの方法で知らせようとした、って可能性は残るでしょ？
        tone: 疑問
      - 語り: そこまでは否定できません。分かっていない、が正直なところです。
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 語り: 別の軍記『朝倉記』は、松永久秀が気づいて知らせた、と記します。ただ、これも確かな話ではありません。
        figure: {type: stats, title: 浅井の裏切りを知らせたのは, items: [[信長公記, 名前なし], [朝倉家記, 小豆袋], [朝倉記, 松永久秀]]}
        card: {head: "朝倉記", body: "松永久秀が知らせたとする"}
      - 聞き: 知らせた人、結局だれか分からないんだ。あーしの好きな場面、急に霧の中。
        tone: しみじみ
      - 語り: 同じ年、信長は姉川で浅井・朝倉の軍とぶつかります。お市は、夫の城に残りました。兄と夫が戦う、そのあいだにいたことになります。
        figure: null
        background: {image: paintings/nobunaga_anegawa_screen.jpg, credit: "姉川合戦図屏風（部分、江戸時代）"}
        card: {head: "1570年", body: "姉川の戦い。お市は小谷に残る"}
      - 聞き: 兄の家に帰らなかったんだ。やっぱり、夫を愛してたから？
        tone: 疑問
      - 語り: 黒田さんは、愛情と信頼で離縁しなかった、という小説やドラマの描き方を、今の結婚の見方による幻想だ、と書いています。
        background: {image: paintings/oichi_isono_kuniyoshi.jpg, credit: "歌川国芳《太平記英勇伝 井曽野丹波守貞正》（浅井家の磯野員昌を名を変えて描いた武者絵）1847〜50年ごろ"}
      - 聞き: 気持ちの話を、今の感覚で決めつけちゃだめってことか。
        tone: 納得
      - 語り: そして3年後、小谷城を、兄の大軍が囲みます。
        hook: true

  # ---------------------------------------------------------------- 5 小谷落城
  - title: 1573年 小谷城の落城と、10歳の万福丸
    background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
    year: 1573
    lines:
      - 語り: 1573年8月、信長の大軍が、小谷城を囲みました。このとき、お市は数えで27歳。三女の江が生まれたのも、この年です。
        card: {head: "1573年8月", body: "信長の軍が小谷城を囲む"}
      - 聞き: 生まれたばかりの赤ちゃんを抱えて、山の上の城にこもってたんだ。
        tone: しみじみ
      - 語り: 江が生まれた場所は、小谷と言われます。ただ、『安土創業録』という本は、岐阜で生まれた、と書いています。
        background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）"}
      - 聞き: 岐阜って、信長の城がある所でしょ？ それなら、お市は一度、兄の所に戻ってたことになっちゃう。
        tone: 疑問
      - 語り: そう読めてしまうので、ここも説が分かれています。
      - 語り: この絵図のように、小谷城は、山の尾根に沿って曲輪が並ぶ城です。
        background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
        detail: {box: [0.2, 0.05, 0.85, 0.75], label: 尾根に曲輪が並ぶ小谷城（江戸時代の絵図）}
      - 聞き: 細長く並んでるなら、真ん中を取られたら、前と後ろが分かれちゃいそう。
        tone: 疑問
        detail: {box: [0.2, 0.05, 0.85, 0.75], label: 尾根に曲輪が並ぶ小谷城（江戸時代の絵図）}
      - 語り: 8月27日の夜、羽柴秀吉が、城の中ほどにある京極丸を取りました。のちの豊臣秀吉です。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
        card: {head: "1573年8月27日", body: "秀吉が京極丸を取る"}
      - 語り: そのとおりになりました。本丸の長政と、小丸にいた父の久政が、ここで切り離されます。先に、久政が最期を迎えました。
        background: {image: paintings/oichi_odani_castle_map.jpg, credit: "《小谷城図》江戸時代"}
      - 聞き: 秀吉さん、ここで出てくるんだ。お市にとっては、夫の城を落とした人……。
        tone: しみじみ
      - 語り: 9月1日、長政は小谷城で最期を迎えました。数えで29歳でした。
        tone: 重い
        background: {image: paintings/oichi_nagamasa_portrait_full.jpg, credit: "《浅井長政像》（高野山持明院蔵）1580年代"}
        card: {head: "1573年9月1日", body: "長政が最期を迎える。29歳"}
      - 語り: その前に長政は、お市と3人の娘を、織田の側に引き渡しています。このとき、茶々は数えで5歳、初は4歳、江は生まれたばかりでした。
      - 聞き: 自分は残って、家族だけ城の外へ出したんだ。茶々は5歳なら、きっと覚えてるよね。
        tone: しみじみ
      - 語り: 城の外へ逃がされた男の子も、いました。10歳の万福丸です。
        background: {image: paintings/oichi_odani_castle_ezu.jpg, credit: "《小谷城跡絵図》江戸時代"}
      - 語り: 万福丸は敦賀で捕らえられ、命を奪われました。『信長公記』は、「浅井備前が十歳の嫡男」と記しています。
        tone: 重い
        card: {head: "1573年9月", body: "万福丸、10歳で命を奪われる"}
      - 聞き: 数えで10歳って、今なら小学3年生くらいだよ。浅井の家の男の子は、これで、いなくなっちゃったの？
        tone: しみじみ
      - 語り: 長政の跡を継ぐ男子の血筋は、ここで絶えました。
      - 聞き: お市の手元に残ったのは、娘3人だけ。あーしなら、兄を一生うらむかも。
        tone: しみじみ
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 語り: お市が兄をどう思ったのか、本人の言葉は残っていません。ただ10年後、お市は、小谷を出たことを悔やんでいた、と伝わります。
        hook: true

  # ---------------------------------------------------------------- 6 織田家の10年
  - title: 1573〜1582年 織田家での10年と本能寺の変
    background: {image: paintings/nobunaga_inabayama_yoshitoshi.jpg, credit: "月岡芳年《月百姿》稲葉山の月（1885年）"}
    year: 1574
    lines:
      - 語り: 小谷を出たお市と娘たちは、それから約10年、織田家に守られて暮らします。
        card: {head: "1573〜1582年", body: "織田家に守られて暮らす"}
      - 聞き: どこで暮らしてたの？ 信長のお城？
        tone: 疑問
      - 語り: それが、はっきりしないんです。信長の弟の織田信包の伊勢上野城、尾張の清須、信長の岐阜城と、説が分かれています。
        card: {head: "10年の住まい", body: "伊勢上野・清須・岐阜と諸説"}
      - 聞き: 10年も住んでたのに、住所が分からないって、今じゃ考えられない。
        tone: 笑い
      - 語り: このころのお市は、「浅井長政の後室」、つまり亡くなった長政の妻、という立場で、織田家に保護されていました。
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        card: {head: "後室", body: "浅井長政の妻のまま"}
      - 聞き: 織田家の娘に戻ったんじゃなくて、浅井の奥さんのまま、だったんだ。
        tone: 納得
      - 語り: この10年の暮らしぶりは、記録からはほとんど分かりません。娘たちが、どこでどう育ったのかも、同じです。
      - 聞き: 茶々たちにとっては、父の城を落とした伯父さんに守られて育つ、ってことだよね。複雑すぎる。
        tone: しみじみ
      - 語り: そのあいだに、兄の信長は、天下人への道を進みます。1576年からは、琵琶湖のほとりに安土城を築き始めました。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        card: {head: "1576年", body: "信長が安土城を築き始める"}
        year: 1576
      - 聞き: 妹が静かに暮らしてるあいだに、お兄ちゃんは、どんどん大きくなっていったんだ。
        tone: 納得
      - 語り: 娘たちも育ちました。1582年には、茶々が数えで14歳、初が13歳、江が10歳です。
      - 聞き: 小谷を出たとき5歳だった茶々が、もう14歳。10年って、やっぱり長いね。
        tone: しみじみ
      - 語り: そして1582年6月2日、本能寺の変で、兄の信長が亡くなります。お市は、数えで36歳でした。
        background: {image: paintings/nobunaga_honnoji_yoshitoshi.jpg, credit: "月岡芳年《大日本名将鑑》織田信長（1878年）"}
        card: {head: "1582年6月2日", body: "本能寺の変。兄・信長が亡くなる"}
        year: 1582
      - 聞き: 信長の回で掘ったところだ。お市にとっては、10年守ってくれた人が、いなくなった日だね。
        tone: しみじみ
      - 語り: 6月27日には、尾張の清須で、織田家の跡継ぎと領地を決める話し合いが開かれます。清須会議です。
        background: {image: paintings/hidenaga_kiyosu_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』清洲会議の場面（江戸後期）"}
        card: {head: "1582年6月27日", body: "清須会議"}
      - 聞き: 当主がいなくなって、織田家は、ばらばらになりそう。あーしなら、娘たちを連れて逃げたくなる。
        tone: 疑問
      - 語り: その会議から2か月もたたないうちに、お市の再婚が決まります。
        hook: true
      - 聞き: もう？ 相手は誰なの？
        tone: 驚き

  # ---------------------------------------------------------------- 7 再婚
  - title: 1582年 柴田勝家との再婚と、秀吉の影
    background: {image: paintings/oichi_katsuie_utamaro.jpg, credit: "喜多川歌麿《柴田修理進勝家と小谷の方》1803〜04年ごろ"}
    year: 1582
    lines:
      - 語り: 相手は、柴田勝家。信長に長く仕えた重臣です。1582年8月20日、二人は岐阜城で婚儀をあげました。
        card: {head: "1582年8月20日", body: "柴田勝家と再婚"}
      - 聞き: 勝家さんって、何歳だったの？
        tone: 疑問
      - 語り: 生まれた年に説があって、60歳前後と言われます。お市は36歳でした。
      - 聞き: 20歳以上の年の差！？ 今なら、親子でもおかしくない年の差婚だよ。
        tone: 驚き
      - 語り: この絵は、江戸時代の喜多川歌麿が描いた二人です。左に「小谷の方」と書かれているのが、お市です。
        detail: {box: [0.0, 0.42, 0.5, 1.0], label: 「小谷の方」（喜多川歌麿、1803〜04年ごろ）}
      - 聞き: 鎧の勝家さんの横で、静かに座ってる。小谷の方って、小谷城にいたからの呼び名か。
        detail: {box: [0.0, 0.42, 0.5, 1.0], label: 「小谷の方」（喜多川歌麿、1803〜04年ごろ）}
        tone: 納得
      - 語り: 勝家は、どんな人だったのか。宣教師フロイスは、信長の時代の日本で、もっとも勇猛な武将、と書いています。
        background: {image: paintings/oichi_katsuie_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 柴田修理進勝家》1867年"}
        card: {head: "フロイスの勝家評", body: "日本でもっとも勇猛な武将"}
      - 聞き: 外国の人から見ても、いちばん強そうだったんだ。
        tone: 納得
      - 語り: この再婚は、昔は、信長の三男の織田信孝が取り持った、と言われてきました。婚儀の場所も、信孝の岐阜城です。
      - 語り: お市と勝家の再婚には、勝家自身の手紙が残っています。1582年の10月6日付けで、堀秀政に宛てたものです。
        short: s5
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 語り: そこに、秀吉と申し合わせて、と書かれているんです。
        short: s5
        card: {head: "1582年10月6日", body: "勝家の手紙「秀吉と申し合わせ」"}
      - 聞き: 秀吉さんも、この結婚にかかわってた、ってこと？
        tone: 疑問
        short: s5
      - 語り: 秀吉が、勝家をなだめるために動いた、という説もあります。
        short: s5
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
      - 聞き: 秀吉と勝家が、お市を取り合ったって話、聞いたことあるんだけど。
        tone: 疑問
        short: s5
      - 語り: その話の出どころは、江戸時代の前期の終わりごろに書かれた、『村井重頼覚書』です。当時の記録ではありません。
        short: s5
        card: {head: "取り合いの話", body: "江戸時代の『村井重頼覚書』"}
      - 語り: 研究者の黒田基樹さんは、再婚の理由を書いた当時の史料は一つもない、と言います。
        short: s5
      - 聞き: 恋のライバルの話も、あとから付いたんだ。あーし、ちょっとがっかり。
        tone: 笑い
        short: s5
      - 語り: お市は娘3人を連れて、勝家の城、越前の北ノ庄に移ります。今の福井市です。
        background: {image: paintings/oichi_katsuie_utamaro.jpg, credit: "喜多川歌麿《柴田修理進勝家と小谷の方》1803〜04年ごろ"}
        detail: {image: paintings/oichi_fukui_castle_map.jpg, box: [0.16, 0.03, 0.83, 0.97], label: 北ノ庄城の跡に建った福井城の図（江戸時代）}
        card: {head: "1582年", body: "越前の北ノ庄へ移る"}
      - 語り: 今、北ノ庄城の跡には柴田神社があり、お市もまつられています。福井では、「お市まつり」というお祭りも開かれてきました。
        detail: {image: paintings/oichi_fukui_castle_map.jpg, box: [0.16, 0.03, 0.83, 0.97], label: 北ノ庄城の跡に建った福井城の図（江戸時代）}
      - 聞き: 400年以上たっても、福井では、お市さんがお祭りの主役なんだ。
        tone: 明るい
      - 語り: ここで、お市のまわりの人を、まとめておきます。
        figure: {type: people, title: お市のまわりの人々, nodes: [[お市の方, 本人], [織田信長, 兄], [浅井長政, 1人目の夫], [柴田勝家, 2人目の夫], [茶々, 長女], [初, 次女], [江, 三女]], edges: [[お市の方, 織田信長, 妹（いとこ説も）], [お市の方, 浅井長政, 1567年ごろ結婚], [お市の方, 柴田勝家, 1582年に再婚], [お市の方, 茶々, 母], [お市の方, 初, 母], [お市の方, 江, 母], [織田信長, 浅井長政, 1570年から敵]]}
      - 聞き: 兄と、夫が2人と、娘が3人。この全部が、15年くらいのあいだの話なんだ。
        tone: しみじみ
      - 語り: ただ、この結婚は長くは続きません。翌年の春、勝家は、秀吉と戦うことになります。
        hook: true

  # ---------------------------------------------------------------- 8 北ノ庄
  - title: 1583年 北ノ庄城の最期と辞世
    background: {image: paintings/hidenaga_shizugatake_screen_2.jpg, credit: "賤ヶ岳合戦図屏風（江戸時代）"}
    year: 1583
    lines:
      - 語り: 1583年4月21日、近江の賤ヶ岳の戦いで、勝家は秀吉に敗れます。
        card: {head: "1583年4月21日", body: "賤ヶ岳の戦いで勝家が敗れる"}
        figure: {type: map, title: 1583年 賤ヶ岳から北ノ庄へ, bounds: [135.6, 136.9, 35.25, 36.25], places: [[賤ヶ岳, 136.21, 35.53], [北ノ庄, 136.22, 36.06], [小谷, 136.28, 35.46]], route: [賤ヶ岳, 北ノ庄], note: 10年前の小谷城のすぐ北}
      - 語り: 勝家は北ノ庄へ逃げ帰ります。従った者は、秀吉の手紙では4、5騎、別の記録では百騎あまり。書く人で、数がまるでちがいます。
        figure: {type: map, title: 1583年 賤ヶ岳から北ノ庄へ, bounds: [135.6, 136.9, 35.25, 36.25], places: [[賤ヶ岳, 136.21, 35.53], [北ノ庄, 136.22, 36.06], [小谷, 136.28, 35.46]], route: [賤ヶ岳, 北ノ庄], note: 10年前の小谷城のすぐ北}
        mark: {type: circle, at: 3}
      - 聞き: 賤ヶ岳って、小谷城のすぐそばじゃん。10年で、同じあたりで2回も家が負けるなんて……。
        tone: しみじみ
      - 語り: 4月23日、秀吉の軍が北ノ庄城を囲みます。敗れてから、わずか2日でした。
        figure: null
        background: {image: paintings/oichi_retsujoden_1668.jpg, credit: "黒沢弘忠『全像本朝古今列女伝』柴田勝家孺人（1668年刊）"}
        card: {head: "1583年4月23日", body: "秀吉の軍が北ノ庄城を囲む"}
      - 語り: 1583年、北ノ庄城。『柴田合戦記』によると、勝家はお市に、城を出るよう勧めました。信長公の身内なら、秀吉も粗末にはしないだろう、と。
        short: s3
      - 聞き: 生きて出られる道が、あったんだ。あーしなら、迷わず出ちゃうかも。
        tone: 疑問
        short: s3
      - 語り: お市は断りました。そのときの言葉を、娘の初に仕えた女性の系統がまとめた覚書、『渓心院文』が伝えています。
        short: s3
        card: {head: "渓心院文", body: "初に仕えた女性の系統の覚書"}
      - 語り: 今の言葉にすると、こうです。浅井の家のときに逃げ出したことさえ、今も悔やまれる。どうして今度も逃げ出せるだろうか。
        tone: しみじみ
        short: s3
        background: {image: paintings/oichi_portrait_jimyoin_bust.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
      - 聞き: 前の節の「悔やんでいた」って、これのことか。小谷を出たこと、ずっと引きずってたんだ。
        tone: しみじみ
      - 語り: 研究者の黒田基樹さんは、嫁いだ以上はその家と生死を共にする、という本人の意志を貫いた、と読んでいます。
        short: s3
      - 聞き: 流されただけの人じゃなくて、2回目は、自分で決めた人なんだ。
        tone: 納得
        short: s3
      - 語り: 3人の娘は、富永新六郎という武士に託して、秀吉のもとへ届けさせました。主君の家の血筋だから大切に、と書状も添えたそうです。
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        figure: {type: numberline, title: 1583年 城を出た3人の娘（数え）, items: [[江, 11], [初, 14], [茶々, 15]], unit: 歳, focus: 江}
      - 聞き: 茶々が15、初が14、江が11。今なら中学生と小学生だよ。それを、父の仇でもある秀吉に預けるなんて。
        figure: {type: numberline, title: 1583年 城を出た3人の娘（数え）, items: [[江, 11], [初, 14], [茶々, 15]], unit: 歳, focus: 江}
        tone: しみじみ
      - 語り: その夜、勝家は天守で最後の酒宴を開きました。最後までともにした家臣は、80人あまりと伝わります。
        figure: null
        background: {image: paintings/oichi_retsujoden_1668.jpg, credit: "黒沢弘忠『全像本朝古今列女伝』柴田勝家孺人（1668年刊）"}
        card: {head: "1583年4月23日夜", body: "天守で最後の酒宴"}
      - 語り: フロイスの手紙によれば、城を囲む兵は、城の中から武器の音がせず、陽気な歌声が聞こえてくるのに驚いたそうです。
      - 聞き: 最後の夜に、歌ってたの……。外で聞いてた兵の人たちも、どんな気持ちだったんだろう。
        tone: しみじみ
      - 語り: 24日の明け方、秀吉の軍が攻めかかります。秀吉の手紙は、天守を九重と伝えます。勝家の側は、7度、打って出ました。
        background: {image: paintings/oichi_katsuie_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 柴田修理進勝家》1867年"}
        card: {head: "1583年4月24日", body: "秀吉の軍が攻めかかる"}
      - 語り: そしてお市は、勝家とともに、北ノ庄城で生涯を閉じました。数えで37歳。勝家との結婚は、1年足らずでした。
        tone: 重い
      - 語り: フロイスは、日本でもっとも勇猛と書いたその勝家が、滅びて灰になった、と記しました。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 聞き: 勇猛な武将も、2日で囲まれて、1日で終わっちゃった。戦国って、ほんとに容赦ない。
        tone: しみじみ
      - 語り: 墓は、福井市の西光寺に、勝家と並んでいます。娘たちの行く末を住職に託した、という言い伝えのある寺です。
        background: {image: paintings/oichi_katsuie_utamaro.jpg, credit: "喜多川歌麿《柴田修理進勝家と小谷の方》1803〜04年ごろ"}
        card: {head: "西光寺（福井市）", body: "勝家と並ぶお市の墓"}
      - 聞き: 最後の最後まで、娘たちのことを考えてたんだ。弔われてるのは、そこだけ？
        tone: 疑問
      - 語り: お市を弔う寺は、福井の願応寺、滋賀の幡岳寺、そして高野山の持明院にもあります。戒名も、いくつか伝わっています。
        card: {head: "お市の戒名", body: "いくつか伝わる"}
      - 聞き: お寺が3か所も。それだけ、あちこちで弔われたってことかな。
        tone: 納得
      - 語り: 『柴田合戦記』に、お市の辞世として載る歌です。
        background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
        card: {head: "お市の辞世", body: "柴田合戦記に載る"}
      - 人物: 「さらぬだに、打ちぬる程も夏の夜の、夢路をさそふ、郭公かな」
        who: お市
        tone: しみじみ
        pause: 1.0
      - 聞き: ただでさえ短い夏の夜なのに、ほととぎすが、夢の道へ誘うように鳴いてる、って意味かな。
        tone: しみじみ
      - 語り: そうです。夢路は、死出の道に重ねてあります。旧暦の4月24日は、ちょうどほととぎすの鳴く、初夏でした。
        icon: bird
      - 語り: 勝家は、こう返したと伝わります。
        background: {image: paintings/oichi_katsuie_utamaro.jpg, credit: "喜多川歌麿《柴田修理進勝家と小谷の方》1803〜04年ごろ"}
      - 人物: 「夏の夜の、夢路はかなき跡の名を、雲居にあげよ、山郭公」
        who: 勝家
        tone: しみじみ
      - 聞き: はかない夢のあとに残る名前を、空高く広めてくれ、ってこと？ 勝家さんは、最後まで名前を気にしてたんだ。
        tone: 疑問
      - 語り: 城を出た3人の娘は、このあと、敵と味方に分かれていきます。
        hook: true

  # ---------------------------------------------------------------- 9 3人の娘
  - title: 1586年〜1615年 3人の娘と大坂の陣
    background: {image: paintings/oichi_chacha_yodo_portrait.jpg, credit: "伝 淀殿（茶々）像（奈良県立美術館蔵）17世紀"}
    year: 1586
    lines:
      - 語り: 北ノ庄を出た3人の娘は、秀吉のもとで育ちます。
        background: {image: paintings/oichi_retsujoden_1668.jpg, credit: "黒沢弘忠『全像本朝古今列女伝』柴田勝家孺人（1668年刊）"}
        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵）"}
      - 聞き: 父の城を落とした人のところで……。娘たちは、その後どうなったの？
        tone: 疑問
      - 語り: 母を亡くして3年後の1586年10月、茶々は「茶々の御方」として、秀吉の母を訪ねています。この呼ばれ方から、このころには秀吉の妻になっていた、と見られています。
        background: {image: paintings/oichi_chacha_yodo_portrait.jpg, credit: "伝 淀殿（茶々）像（奈良県立美術館蔵）17世紀"}
        portrait: null
        detail: {box: [0.03, 0.5, 0.97, 0.97], label: 伝 淀殿（茶々）の肖像（奈良県立美術館蔵）}
        card: {head: "1586年10月", body: "「茶々の御方」として記録に出る"}
      - 聞き: 両親の仇の、奥さんに……。茶々、まだ18歳くらいだよね。
        tone: しみじみ
      - 語り: お市の長女の茶々は、秀吉の妻の一人、のちの淀殿になりました。『渓心院文』によると、妹たちを先に嫁がせることを、秀吉への条件にした、と伝わります。
        short: s4
        background: {image: paintings/nene_taiko_gosai_lccn.jpg, credit: "喜多川歌麿《太閤五妻洛東遊観之図》（秀吉と淀殿ほか）1804〜06年ごろ"}
      - 聞き: 自分より先に、妹たちの行き先を決めさせたんだ。母が娘たちを城から出したのと、ちょっと似てる。
        portrait: {image: paintings/oichi_portrait_jimyoin_bust.jpg, caption: "お市の方（高野山持明院蔵）"}
        tone: しみじみ
      - 語り: 次女の初は、京極高次の妻になりました。秀吉の取り持ちです。
        portrait: null
        short: s4
        background: {image: paintings/oichi_hatsu_jokoin.jpg, credit: "《常高院（初）像》江戸時代"}
        card: {head: "次女・初", body: "京極高次の妻に"}
      - 語り: 初の結婚の年は、1584年とも、1587年とも言われます。黒田さんは、初が1584年、江が羽柴秀勝に嫁いだのが1585年と見ていて、それなら妹たちが先です。
      - 語り: 3人の中でいちばん長生きしたのは、この初です。64歳まで生き、福井県小浜市の常高寺に眠っています。
      - 聞き: 姉と妹の中で、いちばん長く見届けた人なんだ。
        tone: 納得
      - 語り: 三女の江は、結婚を3度しています。最初の佐治一成とは、離縁しています。
        background: {image: paintings/oichi_go_sugenin.jpg, credit: "《崇源院（江）像》17世紀"}
      - 語り: 2度目は、羽柴秀勝。娘の完子が生まれますが、秀勝は1592年に亡くなります。
        card: {head: "1592年", body: "江の2人目の夫・秀勝が亡くなる"}
      - 聞き: 3度も……。お母さんの2度の結婚より多い。あーしなら、2回目で疲れちゃう。
        tone: しみじみ
      - 語り: その翌年の1593年、大坂では、茶々が秀頼を産みます。
        icon: baby
        background: {image: paintings/oichi_hideyori.jpg, credit: "伝《豊臣秀頼像》（養源院本の模写、1914年）"}
        card: {head: "1593年", body: "茶々が秀頼を産む"}
      - 聞き: 江の3人目の相手、まさか、あの家の人？
        icon: question
        tone: 疑問
      - 語り: そのまさかです。1595年、江は3度目の結婚で、徳川秀忠の妻になりました。
        background: {image: paintings/oichi_hidetada.jpg, credit: "《徳川秀忠像》江戸時代"}
        card: {head: "1595年", body: "江が徳川秀忠の妻に"}
      - 語り: 秀勝との娘の完子は、茶々の養女になり、のちに公家の九条家へ嫁ぎました。
        background: {image: paintings/oichi_go_sugenin.jpg, credit: "《崇源院（江）像》17世紀"}
        card: {head: "1604年", body: "江の娘・完子が九条家へ"}
      - 聞き: 九条家って、聞いたことある。お公家さんだよね。そこから今の皇室まで？
        tone: 疑問
      - 語り: そう言われています。九条家から、のちに大正天皇の皇后、貞明皇后が出ています。このつながりで、お市の血筋は今の皇室にも続いている、という話です。
        figure: {type: people, title: 江から今の皇室へ（と言われる線）, nodes: [[江, お市の三女], [完子, 江の娘], [九条家, 公家], [貞明皇后, 大正天皇の皇后], [今の皇室, 研究者の留保つき]], edges: [[江, 完子, 母], [完子, 九条家, 嫁ぐ], [九条家, 貞明皇后, 子孫], [貞明皇后, 今の皇室, 子孫]]}
      - 聞き: 400年以上も、血がつながってるんだ。スケールがちがう。
        tone: しみじみ
      - 語り: ただ、何代もの家系なので、たどりきれるか心もとない、と断る研究者もいて、ここは留保つきです。
      - 語り: 1614年からの大坂の陣。大坂城には長女の淀殿と秀頼、和議をまとめる役に次女の初。そして徳川の側には、将軍秀忠の妻の江がいました。
        short: s4
        background: {image: paintings/nene_osaka_castle_summer_screen_detail.jpg, credit: "大坂夏の陣図屏風（部分、大阪城天守閣蔵）17世紀前半"}
        figure: {type: people, title: 大坂の陣と3人の娘, nodes: [[淀殿（茶々）, 大坂城], [豊臣秀頼, 茶々の子], [初, 和議をまとめる], [江, 将軍秀忠の妻], [千姫, 江の娘・秀頼の妻]], edges: [[淀殿（茶々）, 豊臣秀頼, 母], [初, 淀殿（茶々）, 妹], [初, 江, 姉], [江, 千姫, 母], [千姫, 豊臣秀頼, 妻]], upto: 4}
      - 聞き: 姉妹が、敵と味方と、そのあいだをつなぐ役に分かれてたの！？
        tone: 驚き
        short: s4
      - 語り: しかも、秀頼の妻の千姫は、江の娘です。秀頼と千姫は、いとこ同士でした。大坂の陣は、お市の一家の内側の戦いでもあったんです。
        short: s4
        figure: {type: people, title: 大坂の陣と3人の娘, nodes: [[淀殿（茶々）, 大坂城], [豊臣秀頼, 茶々の子], [初, 和議をまとめる], [江, 将軍秀忠の妻], [千姫, 江の娘・秀頼の妻]], edges: [[淀殿（茶々）, 豊臣秀頼, 母], [初, 淀殿（茶々）, 妹], [初, 江, 姉], [江, 千姫, 母], [千姫, 豊臣秀頼, 妻]], upto: 5}
      - 語り: 1615年、淀殿は、大坂城とともに最期を迎えます。
        figure: null
        card: {head: "1615年", body: "淀殿、大坂城とともに"}
      - 聞き: 母と同じように、城と一緒に……。
        tone: しみじみ
      - 語り: 一方、江の子の家光は、3代将軍になりました。お市の血は、徳川の将軍家に入っていきます。
        background: {image: paintings/oichi_hidetada.jpg, credit: "《徳川秀忠像》江戸時代"}
        card: {head: "江の子", body: "3代将軍・徳川家光"}
      - 聞き: 江の娘の和子は、天皇のお后になったんだよね。その子は、女の天皇。
        tone: 疑問
      - 語り: よくご存じですね。明正天皇です。ただ子がなく、この線は続きませんでした。
      - 語り: 3人の娘が、それぞれの場所で生き抜いた。その娘の一人が、母の肖像を描かせていました。
        hook: true

  # ---------------------------------------------------------------- 10 見立て
  - title: 見立て：お市の美女と悲劇は誰が作ったか
    background: {image: paintings/oichi_portrait_jimyoin_full.jpg, credit: "《浅井長政夫人像》（お市の方、高野山持明院蔵）16世紀後半"}
    year: 1589
    lines:
      - 語り: お市の姿は、誰が、どう作ってきたのか。3つの層に分けて掘ります。
      - 聞き: 美女と、小豆袋と、あと一つは？
        tone: 疑問
      - 語り: 悲劇のヒロイン、という姿です。まずは1つ目、美女から。
      - 語り: お市を「天下一の美人」と書いたのは、江戸時代の『祖父物語』という書物です。
        short: s2
        card: {head: "天下一の美人", body: "江戸時代の『祖父物語』"}
      - 語り: 『賤岳合戦記』という本も、「天下第一番の御生付」、生まれつきが天下一番だ、と記しました。これも江戸時代の本です。
        short: s2
        background: {image: paintings/oichi_taiheiki_shui_1870.jpg, credit: "落合芳幾《太平記拾遺 勝家の室於市之方》1870年"}
      - 聞き: どっちも、お市が亡くなってから、だいぶたってからの本なんだ。
        tone: 納得
        short: s2
