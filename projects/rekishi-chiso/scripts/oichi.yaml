  金ヶ崎の退き口: 1570年、朝倉攻めの最中に浅井が背き、信長が京都へ退いた出来事
  朝倉家記: 朝倉の旧臣が書いた軍記。成立の年は分かっていない。小豆袋の話の出どころ
  後室: 夫に先立たれた妻。未亡人
  清須会議: 1582年6月、本能寺の変のあとに織田家の跡継ぎと領地を決めた会議
  渓心院文: 初（常高院）に仕えた女房の系統がまとめた覚書。聞き伝えをもとにする
  柴田合戦記: 勝家と秀吉の戦いを記した本。秀吉に仕えた大村由己の作と伝わる
  辞世: 死を前にして詠む歌
  持明院: 和歌山県・高野山の寺。お市と浅井長政の肖像が伝わる

