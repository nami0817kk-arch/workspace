# 通説型（地表→生涯→見立て）。お市の方（10/13 12時公開。同じ日の19時は豊臣秀吉）
# 地表＝「戦国一の美女」「小豆袋で兄に裏切りを知らせた」→ 生涯を生まれた順に → 見立て：美女・悲劇の像はなぜ作られたか。
# 事実の出どころは dev/output/rekishi-chiso/research/oichi_facts.md だけ（確実／有力／伝承の言い分けもそこ）。末尾に「事実の控え」。
# 年齢は数え（生年は享年37からの逆算なので「1547年ごろ」。肖像の「この時○歳」は信長だけに出す）。
# 広告の点：万福丸は「命を奪われました」まで（方法は言わない）。落城・最期は「生涯を閉じた」。薄濃は使わない。
# 重ねない：北ノ庄の最期はこの回で扱う（秀吉の回では一行）。娘たちのその後は第9節で短く（淀殿は予備の題材）。辞世2首は人物の声（お市＝冥鳴ひまり、勝家＝玄野武宏。この回では who: 秀吉 を使わない）。
# 使わない：重要文化財の指定・薄濃の日付・『柴田退治記』の原文（大村由己は「と伝わる」）・黒田の記事の会員限定部分。
title: お市の方の37年｜小豆袋と「戦国一の美女」は、記録のどこにあるのか
