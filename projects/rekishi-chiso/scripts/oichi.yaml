# 事実の控え（2026-10-09。詳細は dev/output/rekishi-chiso/research/oichi_facts.md）
# - 生年1547は享年37からの逆算（直接の史料なし）。父 織田信秀、母不詳。信長より13歳下。従妹説（『織田系図』）・『以貴小伝』「いとこを妹と披露」
# - 名「市」は信頼できる史料に実名なしとする研究者あり（濱田）。「秀子」は後世の『織田家系譜』
# - 結婚：永禄7（1564）説は従来、今は1567〜68が有力。1565年12月 六角承禎→和田惟政の斡旋（頓挫）、1567年9月 長政側が市橋長利を通じ同盟申し入れ
# - 万福丸 1564生、お市の子ではないとされる。茶々1569・初1570・江1573（小谷。『安土創業録』は岐阜）。長政1545生
# - 1568 上洛で両家の関係が決定的に変わった（黒田109392）。「愛情で離縁しなかった」は現代の結婚観の幻想（黒田）
# - 金ヶ崎 1570年4月：公記で信長は縁者・北近江を任せている・虚説と信じず、注進が重なり退く。4/30 京着。知らせた人の名なし
# - 小豆袋：『朝倉家記』（朝倉始末記の異本）／『朝倉義景記』。袋の両端を縄で結び封をして贈る、だけ。袋のねずみは後の解釈。『朝倉記』は松永久秀が通報
# - 小谷：1573/8/8〜9/1。8/27夜 秀吉が京極丸、本丸の長政と小丸の久政を分断。久政が先、9/1 長政自害（29）。お市と娘3人を引き渡す。万福丸10歳、敦賀で捕らわれ（方法は言わない）。公記「浅井備前が十歳の嫡男」
# - 1573〜82 「浅井長政の後室」として保護。居所：信包（伊勢上野城）／清洲／岐阜城の諸説
# - 1582/6/2 本能寺、6/27 清須会議、8/20 勝家と再婚（信孝の岐阜城）。勝家の10/6付 堀秀政あて書状「秀吉と申し合わせ」。取り合い話は『村井重頼覚書』（江戸前期後半）。黒田「再婚の理由を示す当時の史料はない」。勝家は60前後
# - 1583/4/21 賤ヶ岳で敗れる（秀吉書状4、5騎／『豊臣記』近習百余騎）。4/23 包囲（2日）。『柴田合戦記』勝家が退去を勧める。渓心院文の言葉（現代語訳、クレインス）。黒田「婚家と生死を共に」
# - 娘3人は富永新六郎に託し、「主筋だから大切に」と書状（W市）。4/23夜 天守で80余人と酒宴、フロイス「武器の音がせず陽気な歌声」。天守九重（秀吉書状）。7度打って出た（和田）
# - 4/24 自害、37。結婚1年足らず。辞世「さらぬだに打ちぬる程も夏の夜の夢路をさそふ郭公かな」、勝家「夏の夜の夢路はかなき跡の名を雲居にあげよ山郭公」（柴田合戦記・コトバンク）
# - 美女：『祖父物語』天下一の美人、『賤岳合戦記』天下第一番の御生付（江戸）。渓心院文「22、3歳に見えた」（後の聞き書き）
# - 肖像：持明院、1589年12月 茶々が父の十七回忌・母の七回忌に納める。片身替わりの正装
# - 娘：茶々＝秀吉の側室、1593 秀頼、妹たちを先に嫁がせる条件（渓心院文・黒田）。初＝京極高次、大坂冬の陣で和議。江＝秀忠の正室、家光・和子。千姫は江の娘
# - 子孫：家光（3代）。和子→明正天皇（続かない）。完子（江と羽柴秀勝の娘、1604 九条幸家へ）→九条家→貞明皇后→今の皇室（八幡和郎の留保）
