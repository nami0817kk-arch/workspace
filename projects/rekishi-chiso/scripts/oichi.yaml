en:
  title: "Oichi: Where Are the Bag of Beans and the \"Greatest Beauty\" in the Records?"
  description: |-
    Oichi, sister of Oda Nobunaga, is remembered as the most beautiful woman of the Warring States period, and as the wife who warned her brother of her husband Azai Nagamasa's betrayal with a bag of beans tied at both ends. But the bag appears only in a later military chronicle written by former Asakura retainers, and Nobunaga's own retainer's chronicle names no one who sent the warning. The words "the greatest beauty under heaven" come from Edo-period books, and her famous portrait was made six years after her death, for a memorial service held by her daughter Chacha.
    We follow her 37 years: marriage to Azai Nagamasa at Odani Castle, the fall of Odani in 1573, her second marriage to Shibata Katsuie, and her last days at Kitanoshō Castle in 1583, where she chose not to leave. Finally we ask why the image of a tragic beauty was made, and how her three daughters, Chacha, Hatsu and Gō, ended up on different sides of the Siege of Osaka.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "The Surface: The Greatest Beauty and the Bag of Beans"
    - "c. 1547: Born in Owari as Nobunaga's Sister"
    - "c. 1567: Marriage to Azai Nagamasa at Odani Castle"
    - "1570: The Retreat from Kanegasaki and the Bag of Beans"
    - "1573: The Fall of Odani Castle"
    - "1573-1582: Ten Years with the Oda Family and Honnō-ji"
    - "1582: Second Marriage to Shibata Katsuie"
    - "1583: The Last Days at Kitanoshō Castle"
    - "1586-1615: Three Daughters and the Siege of Osaka"
    - "Verdict: Who Made the Beauty and the Tragedy?"

