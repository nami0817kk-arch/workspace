  name: 原爆が
  lead: 原爆の代わりに、本土決戦か
  main: もしも間に合わなかったら？
  # サムネは別に作る（Gemini の絵に字を載せた1枚。out/genbaku-if-story_thumbnail.png）。ここは check のための仮。

sections:
  # ================================================================ 序章
  - title: 「余った50万個の勲章」　1945年
    lines:
      # fact: genbaku-24
      - 語り: アメリカ軍が、戦争中に大量に作った勲章、パープルハート。戦いで傷を負った兵に贈るものです。そのうち、およそ49万5千個が、使われずに余りました。
        tone: 重い
        card: {head: "パープルハート", body: 約49万5千個が余った}
      # fact: genbaku-24
      - 語り: 余った勲章は、朝鮮戦争のあとも、負傷した兵に配られ続けました。2000年の時点で、まだ約12万個が、軍の手元にあった、と研究者のムーアとジャングレコは書いています。
      # fact: genbaku-52
      - 語り: 2人は、この大量の勲章を、日本への上陸作戦に備えたものと見ています。
      # fact: genbaku-01
      - 語り: その上陸作戦の、最初の段階の名は、オリンピック。1945年11月1日に、九州の南へ上陸する計画でした。
        card: {head: "1945年11月1日", body: 九州の南へ上陸}
      # fact: genbaku-02
      - 語り: そして翌1946年3月1日には、関東の平野へ。コロネット作戦です。2つを合わせて、ダウンフォール作戦と呼びました。
      - 語り: 1945年8月、広島と長崎に、原子爆弾が落とされました。そして15日、日本は戦争を終えます。上陸は、行われませんでした。
      - 語り: もしも、原爆が、あの夏に間に合わなかったら。日本は、どうなっていたのでしょうか。
        tone: 疑問
      - 語り: 変えるのは一点だけ。1945年の夏、原爆が、まだ完成していなかったら。
      # fact: genbaku-53
      - 語り: じつは、戦争を終えると決めた最初の聖断で、昭和天皇が理由に挙げたのは、原爆ではなく、ある浜辺の守りの遅れでした。
        hook: true
      - 語り: 攻める側も、迎え撃つ側も、上陸の計画は、すでに動きはじめていました。
        hook: true

  # ================================================================ 第1章 上陸の日は11月1日
  - title: 「上陸の日は、11月1日」　1945年5月
    year: 1945
    lines:
      # fact: genbaku-01
      - 語り: 1945年5月28日。マッカーサーの司令部がまとめた計画書は、九州へ上陸する日、Xデーを、11月1日と定めています。
        card: {head: "1945年5月28日", body: Xデーは11月1日}
      # fact: genbaku-16
      - 語り: ただ、九州のすべてを取る計画ではありませんでした。占領するのは南九州だけ。宮崎県の都農と、鹿児島県の川内を結ぶ線までです。
        figure: {type: map, title: 上陸の計画（1945年5月の計画書ほか）, bounds: [128.8, 141.6, 30.6, 37.2], places: [[都農, 131.56, 32.25], [川内, 130.30, 31.81], [宮崎, 131.42, 31.91], [志布志湾, 131.10, 31.45], [鹿児島湾, 130.62, 31.45], [相模湾, 139.35, 35.25], [九十九里浜, 140.45, 35.55], [東京, 139.69, 35.69]], reveal: true, upto: 2, note: 11月1日は南九州、翌年3月1日は関東}
      # fact: genbaku-16
      - 語り: 鹿児島湾と、志布志湾のある有明湾を、兵と荷物を揚げる港にする、とも書いています。
        figure: {type: map, title: 上陸の計画（1945年5月の計画書ほか）, bounds: [128.8, 141.6, 30.6, 37.2], places: [[都農, 131.56, 32.25], [川内, 130.30, 31.81], [宮崎, 131.42, 31.91], [志布志湾, 131.10, 31.45], [鹿児島湾, 130.62, 31.45], [相模湾, 139.35, 35.25], [九十九里浜, 140.45, 35.55], [東京, 139.69, 35.69]], reveal: true, upto: 5, note: 11月1日は南九州、翌年3月1日は関東}
      # fact: genbaku-17
      - 語り: 使う師団は14。最初に浜へ上がるのは、海兵隊の3個を含む、12個の師団でした。
        figure: null
      # fact: genbaku-77
      - 語り: 上陸する浜には、アメリカの自動車の名前が付けられました。宮崎の浜は、オースチン、ビュイック、キャデラック、シボレー、クライスラー、そしてコード。どれも車の名です。
      # fact: genbaku-02, genbaku-17
      - 語り: コロネット作戦は、相模湾や九十九里浜など、平野の外れの浜から、関東平野へ攻め込む計画です。はじめに、25個の師団が要る、と見積もっていました。
        figure: {type: map, title: 上陸の計画（1945年5月の計画書ほか）, bounds: [128.8, 141.6, 30.6, 37.2], places: [[都農, 131.56, 32.25], [川内, 130.30, 31.81], [宮崎, 131.42, 31.91], [志布志湾, 131.10, 31.45], [鹿児島湾, 130.62, 31.45], [相模湾, 139.35, 35.25], [九十九里浜, 140.45, 35.55], [東京, 139.69, 35.69]], reveal: true, upto: 8, note: 11月1日は南九州、翌年3月1日は関東}
      # fact: genbaku-18
      - 語り: 計画書には、ある前提も書かれていました。作戦のどこかの段階で、ソ連が、日本との戦争に加わる。
        figure: null
      - 語り: この計画を進めるかを決める会議は、6月18日、ホワイトハウスで開かれます。
        hook: true
      - 語り: そこで示された損害の物差しは、人によって、違っていました。
        hook: true

  # ================================================================ 第2章 6月18日、ホワイトハウス
  - title: 「6月18日、ホワイトハウス」　1945年6月
    year: 1945
    lines:
      # fact: genbaku-03
      - 語り: 1945年6月18日。大統領のトルーマンは、陸軍と海軍の首脳を集めました。
        card: {head: "1945年6月18日", body: ホワイトハウスの会議}
      # fact: genbaku-03
      - 語り: その前の日の日記に、トルーマンは、これまでで一番難しい決断だ、と書いていた、と歴史家のマドックスは引いています。
      # fact: genbaku-13
      - 語り: 参謀総長のマーシャルは、最初の30日の損害は、フィリピンのルソン島で払った代価を超えないだろう、と述べます。ルソンでのアメリカ側の死傷は、約3万1千人でした。
      # fact: genbaku-13
      - 語り: 海軍のキングは、ルソンと沖縄のあいだ、と言いました。大統領付きの参謀長リーヒは、沖縄では、部隊の35%が死傷した、と挙げています。
      # fact: genbaku-03
      - 語り: トルーマンは、日本の端から端まで、沖縄のような戦いになるのは避けたい、と話しながら、九州への作戦を進めてよい、と認めました。
      # fact: genbaku-17
      - 語り: 九州へ攻め込む兵は、76万6700人。大統領のために用意した覚え書きに、そうありました。
        card: {head: "九州へ攻め込む兵", body: 76万6700人}
      - 語り: では、上陸すれば、どれだけの損害が出るのか。見積もりは、記録によって大きく割れています。
        tone: 疑問
      # fact: genbaku-06
      - 語り: 6月に統合参謀本部へ出された表では、マッカーサーの司令部が、最初の30日の死傷を、5万800人と見積もっています。
      # fact: genbaku-06
      - 語り: マッカーサーの情報部長ウィロビーは、九州だけで、20万人の死傷と見積もった、と星条旗新聞は伝えます。
      # fact: genbaku-20
      - 語り: 元大統領のフーヴァーは、5月の覚え書きで、50万から100万人のアメリカ人の命、と書きました。陸軍の作戦の担当、リンカーン准将は、その数を、大きすぎると退けています。
      - 語り: 数える範囲も、中身も違うので、そのまま比べることはできません。ただ、見積もりは、1つの数にまとまってはいませんでした。
        tone: しみじみ
      # fact: genbaku-06
      - 語り: 戦後の1947年、陸軍長官だったスティムソンは、まだ負けていない日本の軍には、アメリカに、さらに100万の犠牲を強いる力があった、と雑誌に書きました。
      - 語り: その間にも、九州の兵は、増え続けていました。
        hook: true
      - 語り: それを知らせたのは、日本の側の、無線でした。
        hook: true

  # ================================================================ 第3章 九州で増え続けた兵
  - title: 「九州で、増え続けた兵」　1945年6月から8月
    year: 1945
    lines:
      # fact: genbaku-42, genbaku-46
      - 語り: アメリカは、日本の陸軍と海軍の無線を、ひそかに受け取り、暗号を読んでいました。
      # fact: genbaku-14
      - 語り: 5月28日の計画書は、南九州の敵を3個師団、九州全体でも8から10個師団まで、と見ていました。
      # fact: genbaku-14
      - 語り: 6月18日の会議でマーシャルが示したのは、11月に九州で待つ敵を、約35万人とする予想です。
      # fact: genbaku-42
      - 語り: けれど、CIAの研究所から1998年に出た、マキーチンの研究によると、6月18日の時点で、九州の師団は、すでに11月の予想の数に届いていました。
      # fact: genbaku-42
      - 語り: 5つ目と6つ目に見つかった師団は、じつは5月の第1週から、もう九州にいたことが、のちに分かったのです。
      # fact: genbaku-45, genbaku-15
      - 語り: 7月29日、ウィロビーは書きます。このまま増え続ければ、攻める側と守る側は、1対1になりかねない。それは、勝つための処方ではない。
        tone: 重い
      # fact: genbaku-05
      - 語り: 8月2日の陸軍の情報部の報告では、九州の兵は、53万4千人。やがて、60万人に見積もり直されました。
        figure: {type: stats, title: 九州の日本の兵（アメリカの見積もり）, items: [[11月の予想（6月18日）, 約35万人], [8月2日の報告, 53万4千人], [その後, 60万人]], upto: 3}
      - 語り: 上陸の日の予想は、35万人。8月の見積もりは、それを大きく超えていました。
        figure: {type: stats, title: 九州の日本の兵（アメリカの見積もり）, items: [[11月の予想（6月18日）, 約35万人], [8月2日の報告, 53万4千人], [その後, 60万人]], upto: 3}
      # fact: genbaku-46
      - 語り: 飛行機も同じです。アメリカは、日本の飛行機を、5911から1万290機と見ましたが、実際は約1万700機あった、と歴史家のリチャード・フランクは書いています。
        figure: null
      # fact: genbaku-46
      - 語り: 7月には、体当たりの特攻機940機を、九州の18か所の隠れた基地へ配る動きも、読まれていました。
      # fact: genbaku-44
      - 語り: フランクによると、海軍の司令長官ニミッツは、すでに5月25日、キングに、本土への上陸は、もう支持できない、と伝えていました。
      # fact: genbaku-43
      - 語り: 8月4日、統合戦争計画委員会の文書は、九州の代わりに、本州の北の端や仙台、関東平野への上陸を研究している、と書きました。
      # fact: genbaku-44
      - 語り: そして8月9日、キングは、上陸の是非で決着を付けようと動きます。同じ日、マッカーサーは、九州の兵が増えたという情報は、大げさだ、と返していました。
      - 語り: 迎え撃つ日本の側も、戦い方を変えていました。
        hook: true
      - 語り: 関東の浜辺の守りを変えたのは、沖縄から生きて帰った、1人の報告でした。
        hook: true

  # ================================================================ 第4章 迎え撃つ決号作戦
  - title: 「迎え撃つ、決号作戦」　1945年4月から7月
    year: 1945
    lines:
      # fact: genbaku-04
      - 語り: 1945年4月8日。沖縄の戦いが始まって1週間後に、大本営は、本土で戦うための命令を出しました。決号作戦の準備です。
        card: {head: "1945年4月8日", body: 決号作戦の準備}
      # fact: genbaku-32
      - 語り: 防衛研究所の新福祐一さんの、2025年の論考によると、敵が上がってくると見た地域は、東北から南九州まで6か所。決1号から、決6号です。
      # fact: genbaku-32
      - 語り: なかでも起こりやすいと見たのが、関東の決3号と、南九州の決6号でした。
      # fact: genbaku-29
      - 語り: 同じ4月、陸軍がまとめた戦争の方針の案からは、ソ連を通じて戦争の終わりを図る、という一文が、消されていました。参謀本部の種村佐孝の日誌に、そうあります。
      # fact: genbaku-27
      - 語り: 6月8日の御前会議。戦争を続ける方針が読み上げられても、出席した人は誰も発言せず、鈴木貫太郎首相が、異議は無い、と認めて決まった、と防衛研究所の立川京一さんは書いています。
      # fact: genbaku-28
      - 語り: 海軍の保科善四郎が、海軍大臣の米内光政に相談すると、米内は笑って、これはこれで良いよ、と答えただけだった。保科が、1949年に語っています。
      # fact: genbaku-30
      - 語り: 6月20日、大本営は、上がってきた敵を、浜辺の波打ち際で叩く、水際撃滅に切り替えます。ある連隊長は、腰を抜かすほど驚いた、と戦史叢書は伝えます。
      # fact: genbaku-70, genbaku-71
      - 語り: 7月17日には、相模湾と九十九里浜を守る部隊にも、浜辺に陣地を出す方針が届きました。きっかけは、7月15日に沖縄から生きて帰った森脇大尉の報告だった、と大磯町の調査報告は書きます。
      # fact: genbaku-71
      - 語り: アメリカの軍艦の砲撃による、日本軍の損害は、皆無だった。報告は、そう伝えていました。
      # fact: genbaku-31
      - 語り: 関東を守る第12方面軍は、4つの軍と、20個の師団。けれど、作りかけの師団の小銃や機関銃は、4割前後しかそろっていませんでした。
        card: {head: "第12方面軍", body: 小銃・機関銃は4割前後}
      # fact: genbaku-07
      - 語り: 6月23日には、義勇兵役法が公布されます。男は15歳から60歳、女は17歳から40歳が、戦う義務を負いました。
      # fact: genbaku-80
      - 語り: 武器が足りず、竹やりで迎え撃つ訓練が、各地で行われました。滋賀県の平和祈念館は、手作りの竹やりを持って訓練に出かけた父の姿を語る証言を、残しています。
        tone: しみじみ
      - 語り: 浜辺の陣地は、間に合ったのでしょうか。
        hook: true
      - 語り: その跡は、いまも、海辺の町に残っています。
        hook: true

  # ================================================================ 第5章 浜辺の陣地と山の地下
  - title: 「浜辺の陣地と、山の地下」　志布志・大磯・松代
    year: 1945
    lines:
      # fact: genbaku-76
      - 語り: 鹿児島県の志布志湾は、本土で戦う場と見られていました。大崎町には、コンクリートのトーチカの跡が、いまも残ります。町の教育委員会の案内によれば、湾を見張るためのものでした。
      # fact: genbaku-02
      - 語り: 関東では、相模湾が、上陸の浜の1つでした。鎌倉に近い相模湾に、2つの機甲師団を含む部隊が上がる計画だった、と星条旗新聞は書いています。
      # fact: genbaku-72
      - 語り: 神奈川県の大磯の戦争の跡を調べた、市原誠さんの報告によると、ここの連隊は、終戦までに、のべ10万メートルの坑道を用意したといいます。
      # fact: genbaku-72
      - 語り: その多くは、調べられないまま、開発で消えました。
      # fact: genbaku-73
      - 語り: 坂田山の洞窟の砲台は、5月10日ごろから掘りはじめ、8月の上旬に貫き通しました。けれど、掘った人の話では、大砲も砲弾も、無かった。
        tone: 重い
      # fact: genbaku-74
      - 語り: 近くの、もう1つの山の砲台は、記録によって、中身が違います。軍の配置図では、12センチの大砲。
      # fact: genbaku-74
      - 語り: 勤労奉仕をした、のちの大磯町長、片野一雄さんは、戦艦長門から降ろした、14センチの大砲だった、と話しています。
      # fact: genbaku-75
      - 語り: 市原さんは、この方面の本土決戦の準備は、正味4か月ほどしかなかった、と書きます。西小磯の壕は、どれも出来上がらないまま、捨てられていました。
        tone: しみじみ
      # fact: genbaku-11
      - 語り: 長野県の松代では、大本営や政府を移すための、地下壕が掘られていました。長野市によれば、1944年11月11日から終戦の日まで、およそ9か月。長さは、10キロメートルあまりです。
        card: {head: "松代の地下壕", body: 長さ10キロメートルあまり}
      # fact: genbaku-36
      - 語り: 働く人と家族、1万3千人のための飯場が、247棟。移す先には、大本営や宮内省、皇居、それに日本放送協会や電話局まで、予定されていました。
      # fact: genbaku-36
      - 語り: 終戦までに、全体の約8割ができていた、と長野市は書いています。
      - 語り: そのころアメリカでは、原爆の準備が、進んでいました。
        hook: true
      - 語り: 落とした2発のあと、3発目は、いつ使えたのでしょうか。
        hook: true

  # ================================================================ 第6章 原爆は何発あったのか
  - title: 「原爆は、何発あったのか」　1945年7月から8月
    year: 1945
    lines:
      # fact: genbaku-10
      - 語り: 1945年7月16日。アメリカ、ニューメキシコ州の砂漠で、初めての原爆の実験が行われました。
        card: {head: "1945年7月16日", body: 初めての原爆の実験}
      # fact: genbaku-26
      - 語り: 7月26日、アメリカ・イギリス・中国の名で、ポツダム宣言が出されます。
      # fact: genbaku-25
      - 語り: スティムソンは、1947年の記事で、落とした2発は、そのとき用意できていた唯一の原爆で、作る速さは、とても遅かった、と書いています。
      # fact: genbaku-21
      - 語り: 一方、原爆を作る計画の責任者グローヴスは、7月30日、戦争が続けば、11月の末までに、10発を超える原爆が使える、と見込みを伝えていました。
      # fact: genbaku-22
      - 語り: 8月10日、グローヴスはマーシャルに、3発目は、8月17日か18日のあとの、最初の天気の良い日に使える、と知らせます。もとの予定の8月24日より、1週間ほど早まっていました。
      # fact: genbaku-22
      - 語り: マーシャルは、その知らせに、大統領のはっきりした許しなしに、日本の上に落としてはならない、と書き込みました。
        tone: 重い
      # fact: genbaku-23
      - 語り: 8月13日には、陸軍の作戦部のハル将軍とシーマン大佐が電話で、次の原爆を、上陸作戦の助けになる目標に使う話をしています。
      - 語り: ここから、もしもの話です。1945年の夏、原爆が、まだ完成していなかったら。記録と、研究者の説から、考えてみます。
        tone: 疑問
      - 語り: 変えるのは、原爆だけ。ソ連の参戦の約束も、空襲も、海の封鎖も、上陸の計画も、史実のまま動き続けます。
      # fact: genbaku-39
      - 語り: 史実の8月10日、大本営陸軍部は、原子爆弾の攻撃の効き目を、アメリカ軍が本土に上がる時期を決める要素の1つに挙げていました。
      - 語り: もしもの世界では、その要素が、ありません。上陸の時期は、九州の兵の数と、海の天気と、ソ連の動きで決まったでしょう。
      - 語り: では、原爆が無くても、日本は降伏したのでしょうか。
        hook: true
      - 語り: 研究者の答えは、11月1日の前と後に、割れています。
        hook: true

  # ================================================================ 第7章 分岐1 ソ連の参戦だけで
  - title: 「分岐1 ソ連の参戦だけで、降伏は来たのか」　1945年2月から8月
    year: 1945
    lines:
      # fact: genbaku-55
      - 語り: 1945年2月のヤルタ協定で、ソ連は、ドイツが降伏して2か月か3か月のうちに、日本との戦争に加わると約束していました。
      # fact: genbaku-55
      - 語り: トルーマンは、7月17日の日記に、スターリンは、8月15日に日本との戦争に入る、と書いています。
      # fact: genbaku-19
      - 語り: 同じ日記には、そうなれば日本は終わりだ、という意味の言葉もありました。
      # fact: genbaku-40
      - 語り: そのころ日本は、そのソ連に、戦争の仲立ちを頼もうとしていました。7月21日、東郷茂徳外務大臣は、モスクワの佐藤尚武大使に、無条件の降伏は受け入れられない、と伝えます。
      # fact: genbaku-57
      - 語り: 佐藤大使は、降伏を受け入れるよう説く、長い電報を送っていました。アメリカは、その電報も、ひそかに読んでいます。
      # fact: genbaku-08, genbaku-66
      - 語り: 史実では8月9日、ソ連は満州へ攻め込みます。歴史家グランツの1983年の研究によれば、ソ連の兵は、157万7725人。
        card: {head: "1945年8月9日", body: ソ連が満州へ}
      # fact: genbaku-66
      - 語り: 迎える関東軍は、日本側の資料で、71万3724人でした。ソ連は、その2倍あまりです。
      # fact: genbaku-53
      - 語り: 防衛研究所の庄司潤一郎さんは、最初の聖断で、昭和天皇が挙げた理由に注目します。いちばん大事な九十九里浜の守りが、まだ出来ていない。装備がそろうのは、9月の中ごろより後になる。
        tone: しみじみ
      - 語り: もしもの世界でも、時期は遅れても、この浜辺の遅れと、ソ連の参戦は、天皇のもとに届いていたでしょう。
      - 語り: では、降伏はいつ来たのか。
        tone: 疑問
      # fact: genbaku-09
      - 語り: 1946年の、アメリカの戦略爆撃調査団の報告は、原爆が無く、ソ連が参戦しなくても、12月31日までには確実に、そしておそらく11月1日より前に、降伏した、と書きました。
        figure: {type: table, title: 原爆が無ければ、降伏はいつ（研究者の説）, cols: [前提, 見立て], rows: [[戦略爆撃調査団, 原爆もソ連も無し, 11月1日より前], [長谷川毅, ソ連の参戦あり, 11月1日より前かも], [麻田貞雄, ソ連の参戦あり, 11月1日までは無いかも], [フランク, 原爆もソ連も無し, 8月末から10月末], [フランク, ソ連の参戦あり, 9月前半から10月前半]], upto: 1}
      # fact: genbaku-09
      - 語り: ただ、その報告は当てにならない、と、のちに歴史家のバーンスタインは批判しています。
      # fact: genbaku-49
      - 語り: 原爆が無く、ソ連の参戦だけなら、と考えた長谷川毅さんは、11月1日より前に降伏したかもしれない、と論じます。
        figure: {type: table, title: 原爆が無ければ、降伏はいつ（研究者の説）, cols: [前提, 見立て], rows: [[戦略爆撃調査団, 原爆もソ連も無し, 11月1日より前], [長谷川毅, ソ連の参戦あり, 11月1日より前かも], [麻田貞雄, ソ連の参戦あり, 11月1日までは無いかも], [フランク, 原爆もソ連も無し, 8月末から10月末], [フランク, ソ連の参戦あり, 9月前半から10月前半]], upto: 2}
      # fact: genbaku-49
      - 語り: 同じ前提で、麻田貞雄さんは、11月1日までには降伏しなかったかもしれない、と書きました。
        figure: {type: table, title: 原爆が無ければ、降伏はいつ（研究者の説）, cols: [前提, 見立て], rows: [[戦略爆撃調査団, 原爆もソ連も無し, 11月1日より前], [長谷川毅, ソ連の参戦あり, 11月1日より前かも], [麻田貞雄, ソ連の参戦あり, 11月1日までは無いかも], [フランク, 原爆もソ連も無し, 8月末から10月末], [フランク, ソ連の参戦あり, 9月前半から10月前半]], upto: 3}
      # fact: genbaku-64
      - 語り: リチャード・フランクは、原爆もソ連の参戦も無ければ、降伏は、8月の末から10月の末のあいだになっただろう、と見ています。
        figure: {type: table, title: 原爆が無ければ、降伏はいつ（研究者の説）, cols: [前提, 見立て], rows: [[戦略爆撃調査団, 原爆もソ連も無し, 11月1日より前], [長谷川毅, ソ連の参戦あり, 11月1日より前かも], [麻田貞雄, ソ連の参戦あり, 11月1日までは無いかも], [フランク, 原爆もソ連も無し, 8月末から10月末], [フランク, ソ連の参戦あり, 9月前半から10月前半]], upto: 4}
      # fact: genbaku-64
      - 語り: 原爆だけが無く、ソ連が参戦した場合は、その参戦も遅れ、降伏は9月の前半から10月の前半になっただろう、ともフランクは書いています。
        figure: {type: table, title: 原爆が無ければ、降伏はいつ（研究者の説）, cols: [前提, 見立て], rows: [[戦略爆撃調査団, 原爆もソ連も無し, 11月1日より前], [長谷川毅, ソ連の参戦あり, 11月1日より前かも], [麻田貞雄, ソ連の参戦あり, 11月1日までは無いかも], [フランク, 原爆もソ連も無し, 8月末から10月末], [フランク, ソ連の参戦あり, 9月前半から10月前半]], upto: 5}
      - 語り: 答えは、上陸の日の前か、後か。ここから、2つの世界に分かれます。
        figure: null
        hook: true
      - 語り: 史実では、終戦の翌日、スターリンが、北の島をめぐる手紙を書いていました。
        hook: true

  # ================================================================ 第8章 分岐2 北海道
  - title: 「分岐2 北海道は、どうなったのか」　1945年8月
    year: 1945
    lines:
      # fact: genbaku-60
      - 語り: 史実の8月16日、スターリンは、トルーマンへの手紙で、北海道の北半分を求めました。東の釧路と、西の留萌を結ぶ線より北。2つの町も含めて、です。
        card: {head: "1945年8月16日", body: スターリンの手紙}
        figure: {type: map, title: スターリンが求めた線（1945年8月16日の手紙）, bounds: [139.0, 146.2, 41.2, 45.8], places: [[留萌, 141.64, 43.94], [釧路, 144.38, 42.98], [札幌, 141.35, 43.06]], route: [留萌, 釧路], note: この線より北を求めた}
      # fact: genbaku-60
      - 語り: 理由の1つに、シベリア出兵のとき、1919年から1921年に日本の軍が極東を占領したことを挙げ、ロシアの世論が傷つく、と書いています。
      # fact: genbaku-61
      - 語り: トルーマンは、千島列島をすべてソ連の受け持ちにすることは認めながら、北海道は断りました。
        figure: null
      # fact: genbaku-61
      - 語り: スターリンは8月22日、こんな答えは、予想していなかった、と書き送っています。
        tone: 重い
      # fact: genbaku-63
      - 語り: アメリカの占領の方針を決めた文書は、イギリス・中国・ソ連にも、占領に加わる責任があるとしながら、国ごとに区域を分けて治める形は避ける、と定めていました。
      - 語り: もしもの世界です。原爆が無く、降伏が遅れたら。
        tone: 疑問
      # fact: genbaku-50
      - 語り: 長谷川さんは、ソ連は9月の初めまでに、満州、南の樺太、千島のすべてを取り、アメリカは、スターリンの望む北海道の分割を、のんだかもしれない、と論じます。
      # fact: genbaku-64
      - 語り: フランクも、ソ連はおそらく北海道の半分か全部を取り、日本の中に、占領の区域を得ただろう、と見ています。
      # fact: genbaku-65
      - 語り: さらにフランクは、ソ連が北海道を攻めれば、九州の代わりに本州の北へ上がる案が、ソ連の南下を止める目的に変わりえた、とも見ています。
      # fact: genbaku-63
      - 語り: 史実のアメリカは、国ごとに区域を分けない占領の形をとりました。もしもの世界では、北の島の行方が、変わっていたかもしれません。
        tone: しみじみ
      - 語り: そして、降伏が11月1日を越えれば。
        hook: true
      - 語り: その前に、九州を襲ったものがありました。
        hook: true

  # ================================================================ 第9章 分岐3 11月1日と冬の飢え
  - title: 「分岐3 11月1日の九州と、冬の飢え」　1945年9月から1946年
    year: 1945
    lines:
      # fact: genbaku-78
      - 語り: 史実の9月17日、枕崎台風が、上陸の予定地だった薩摩半島の、枕崎の近くに上がります。気象庁によれば、全国で死者2473人、行方不明者1283人。
        card: {head: "1945年9月17日", body: 枕崎台風}
      # fact: genbaku-79
      - 語り: 10月10日には、阿久根台風が、同じ鹿児島県の阿久根市の近くに上がりました。
      - 語り: もしもの世界で、上陸の支度をする船団にとっても、九州の秋の海は、穏やかではなかったはずです。
      # fact: genbaku-47
      - 語り: 史実の8月11日、アメリカの爆撃の新しい指令は、町より、鉄道などの輸送を先に狙う、と決めていました。目標は67です。
      # fact: genbaku-47
      - 語り: フランクは、戦略爆撃調査団の分析から、2日ほどの攻撃で、本州と九州を結ぶ関門トンネルや、鉄道の連絡船を断てた、と見ています。
      # fact: genbaku-48
      - 語り: 米の取れ高は、1942年の約1003万トンから、1944年には約878万トンへ、1割あまり減っていました。
        figure: {type: stats, title: 日本の米の取れ高（フランクの引く数）, items: [[1942年, 約1003万トン], [1944年, 約878万トン, 1割あまり減]], upto: 2}
      # fact: genbaku-37
      - 語り: 1945年は、冬の大雪で鉄道が止まりがちになり、6月と7月は、およそ150年でいちばん寒かった、と三重大学の立花義裕さんたちは示しています。
        figure: null
      # fact: genbaku-38
      - 語り: その年の米の、公式の数字は、3882万石。およそ580万トンです。東京大学の近藤康男は、1949年に、この数字どおりなら相当の餓死者が出たはずだと書き、統計そのものを疑いました。
      # fact: genbaku-48
      - 語り: フランクによると、6月の御前会議の資料も、決号作戦がうまくいっても、1946年には大きな飢えが来る、と見ていました。
        tone: 重い
      - 語り: もしも降伏が11月まで来なければ、鉄道を断たれた国に、不作の冬が来ていたと考えられます。
      # fact: genbaku-43
      - 語り: 上陸は、九州か、本州の北か、関東か。それは史実の8月に、すでにアメリカの中で割れていました。
      - 語り: 九州なら、浜辺には、トーチカの陣地と、隠された特攻機。数え直すたびに増えた兵が、待っていたはずです。
      # fact: genbaku-06
      - 語り: どれだけの死傷者が出たかは、言い切れません。アメリカ側の見積もりだけでも、数万から100万まで、割れていたのですから。
        tone: しみじみ
      - 語り: では、あの余った勲章は、何を語っているのでしょうか。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも原爆が間に合わなかったら
    lines:
      - 語り: もしも、1945年の夏、原爆が間に合わなかったら。
      - 語り: 降伏は、ソ連の参戦と、出来上がらない浜辺の守りから、来たかもしれません。研究者の見立ては、上陸の日の前と後で、分かれたままです。
      - 語り: 遅れれば、北の島にはソ連の軍が、南の浜辺にはアメリカの軍が、そして冬には飢えが、迫っていたと考えられます。
      # fact: genbaku-52
      - 語り: あの余った勲章は、上陸を決めた人たちが、どれほどの負傷を覚悟していたかを、伝えているのかもしれません。
        tone: しみじみ
      # fact: genbaku-24, genbaku-52
      - 語り: 上陸に備えたものとも言われるパープルハートは、使われないまま、朝鮮戦争からあとの負傷した兵の胸に、付けられていきました。
        tone: しみじみ
      - 語り: 11月1日に兵が上がるはずだった浜は、いまも、宮崎や鹿児島の海辺に、静かに続いています。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
