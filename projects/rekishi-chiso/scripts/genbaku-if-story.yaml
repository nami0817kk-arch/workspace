# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と mongol-if-story.yaml の型）。もしも原爆が間に合わなかったら。2026-11-07 下書き。
# 公開の予定は 11/11 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型（題材はユーザーが決めた）：
#   分岐は誰でも知る大事件（1945年8月の原爆の投下）の逆＝1945年の夏に原爆が完成していなかったら／一点だけ変える（ソ連の参戦・空襲・海の封鎖・上陸の計画は史実のまま）／
#   史実の条件の範囲内（ダウンフォール作戦の計画書・6月18日の会議・決号作戦・ソ連参戦の約束はすべて原爆と別に動いていた）／推論と明かす／台詞は使わない（想像の台詞なし）／対象は「日本」。
#   降伏の時期は研究者で割れる（戦略爆撃調査団・長谷川毅・麻田貞雄・バーンスタイン・フランク）ので、第7章で並べ、どれか1つに決めない。投下の是非は言わない（どちらの主張もしない）。
#   語り手は剣崎1人。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない（第6章の宣言から）。予想の席は研究者の説に置く。
#   冒頭（10秒以内）＝アメリカ軍が戦争中に作った戦傷の勲章パープルハートのうち、約49万5千個が使われずに余り、朝鮮戦争のあとも配られ続けた（ムーアとジャングレコ、2000年）。
#   序章／第1章 上陸の日は11月1日（計画書・南九州だけ・自動車の名の浜・ソ連の参戦が前提）／第2章 6月18日、ホワイトハウス（3人の物差し・見積もりの食い違い）／
#   第3章 九州で増え続けた兵（暗号・35万→60万・1対1・飛行機・ニミッツ・代わりの上陸地）／第4章 迎え撃つ決号作戦（4月8日・6か所・御前会議・水際・竹やり）／
#   第5章 浜辺の陣地と山の地下（志布志・大磯・王城山の食い違い・松代）／第6章 原爆は何発あったのか（トリニティ・3発目・ここから もしも）／
#   第7章 分岐1 ソ連の参戦だけで降伏は来たか（ヤルタ・日記・仲立ち・満州・聖断の理由・説の食い違い）／第8章 分岐2 北海道は（スターリンの手紙・占領の方針・説）／
#   第9章 分岐3 11月1日と冬の飢え（台風・鉄道・米・飢え）／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 題材の扱い：原爆・空襲・沖縄戦の被害の細部は言わない・描かない（きのこ雲・遺体・惨状の絵は使わない）。被爆者や特定の国を貶めない。数字は出どころと「見積もり」を言う。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/原爆if_facts_20261107.yaml）にあるものだけ。行の上に `# fact: genbaku-NN`。
#   誰でも知る前置き（8月の原爆の投下・8月15日の終戦）は短く使う。
#   記録の食い違いは3つだけ並べる：①上陸の死傷者の見積もり（マッカーサー司令部 最初の30日 5万800・ウィロビー 九州 20万・フーヴァー 50万〜100万の命）
#   ②大磯の王城山の大砲（軍の配置図＝12センチ、片野一雄の証言＝長門から降ろした14センチ）③原爆が無い場合の降伏の時期（調査団・長谷川・麻田・バーンスタイン・フランク）。
#   ほかに割れるもの（決号作戦の区分の数・義勇兵役法の公布日・松代の着工日と進み具合・パープルハートの数・米軍の兵数 766,700／776,700・占守島の死傷）は1つの出どころとして言うか、言わない。
# 自分で計算した数：
#   35万→60万＝1.71倍（6月18日→8月はじめ＝約2か月）。157万7725÷71万3724＝2.21→2倍あまり。1002万7474→878万3827＝−12.4%→1割あまり。
#   8月24日→8月17・18日＝1週間ほど早まる。8月15日（日記）→8月8日（宣戦）＝1週間早い。1944年11月11日→1945年8月15日＝約9か月。
# 確かめられなかったこと（台本では言わない）：JWPC 369/1・JCS 1331 の数、ショックレーの見積もり、スティムソンの「over a million casualties」の一文、
#   台風ルイーズの船の数と「45日遅れ」、ワシレフスキーの北海道上陸の命令文（未見）、JWPC 385/1 の4か国分割案、決7号（朝鮮）の出どころ、Reports of General MacArthur 第1巻の本文。
# 絵：AI 絵（Gemini。一覧は scripts/story/genbaku_main_look.yaml の頭）だけ。
