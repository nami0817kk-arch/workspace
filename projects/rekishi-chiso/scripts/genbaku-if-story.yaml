  師団: 陸軍の大きな部隊の単位。1万人前後の兵からなる
  傍受: 相手の無線の通信を、ひそかに受信して読むこと
  聖断: 天皇が自ら下した判断。ここでは戦争を終えるという判断
  水際撃滅: 上陸してくる敵を、浜辺の波打ち際で叩くという戦い方

