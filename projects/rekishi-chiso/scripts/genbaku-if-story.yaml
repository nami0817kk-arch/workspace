# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  アメリカ軍が戦争中に作った戦傷の勲章、パープルハート。そのうち約49万5千個は使われずに余り、朝鮮戦争のあとも、負傷した兵に配られ続けました。
  1945年11月1日、アメリカ軍は九州の南に上陸する計画でした。翌年3月1日には関東へ。8月の原爆の投下と終戦で、上陸は行われませんでした。
  もしも、原爆が、あの夏に間に合わなかったら、日本はどうなっていたのでしょうか。
  この動画でわかること
  ・アメリカの上陸計画（オリンピック作戦・コロネット作戦）と、6月18日の会議で示された見積もり
  ・暗号から見えていた九州の兵の増え方と、日本側の決号作戦・浜辺の陣地・松代の地下壕
  ・原爆が無くても降伏は来たのか、研究者の説の違い
  ・北海道、11月1日の九州、冬の食べ物はどうなったのか
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（ダウンフォール作戦の計画書（1945年5月28日）、1945年6月18日のホワイトハウスの会議の記録（FRUS）、グローヴスの覚え書き、ポツダム宣言、トルーマンの日記、スターリンとトルーマンの手紙（FRUS）、SWNCC 70/5、H. L. スティムソン（1947年）、米国戦略爆撃調査団（1946年）、防衛研究所の公開史料と論考（新福祐一・立川京一・庄司潤一郎）、アジア歴史資料センター、長野市・鹿児島県・大崎町教育委員会・気象庁の頁、市原誠の大磯町の調査報告、滋賀県平和祈念館、D. J. マキーチン（CIA、1998年）、R. B. フランク、長谷川毅、麻田貞雄、B. J. バーンスタイン、D. M. グランツ、D. M. ジャングレコとK. ムーア、R. J. マドックス、近藤康男、立花義裕ほか、米国国家安全保障アーカイブ、星条旗新聞など）を語りで示してから、今の言葉にして読んでいます。
  上陸の死傷者の見積もり、大磯の砲台の大砲、原爆が無い場合の降伏の時期は、記録や研究者によって書き方が割れています。余ったパープルハートを上陸の見込みと結びつける見方には、異論もあります。
  原爆が1945年の夏に間に合わなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。この動画は、原爆の投下の是非を判断するものではありません。
  絵は、画像生成AIで作った想像上の風景と人物です。原爆や空襲の被害の場面は描いていません。
  サムネイルの風景と人物は、画像生成AIによる想像図です。

en:
  title: "What If the Atomic Bomb Had Not Been Ready? How Japan Would Have Changed"
  description: |-
    The U.S. military made Purple Hearts for wounded soldiers during the war. About 495,000 of them were never used, and they were still being awarded after the Korean War.
    The United States planned to land in southern Kyushu on November 1, 1945, and on the Kanto Plain on March 1, 1946. After the atomic bombings in August and the end of the war, the landings never took place.
    If the atomic bomb had not been ready that summer, what would have happened to Japan?
    In this video you will learn:
    - The U.S. invasion plans (Olympic and Coronet) and the estimates shown at the June 18 meeting
    - The buildup on Kyushu read from intercepts, and Japan's Ketsu-Go plan, beach positions and the Matsushiro tunnels
    - Whether Japan would have surrendered without the bomb, and how historians disagree
    - Hokkaido, Kyushu on November 1, and food in the winter
    Japanese-language history video (Japanese audio). This video does not judge whether the bombings were right or wrong.
  chapters:
    - "Half a Million Unused Medals"
    - "Landing Day: November 1"
    - "June 18 at the White House"
    - "The Growing Army on Kyushu"
    - "Ketsu-Go: Waiting on the Beaches"
    - "Beach Positions and the Tunnels in the Mountains"
    - "How Many Atomic Bombs Were There?"
    - "Turning Point 1: Would Soviet Entry Alone Have Ended the War?"
    - "Turning Point 2: Hokkaido"
    - "Turning Point 3: November 1 and the Hungry Winter"
    - "Summary: If the Bomb Had Not Been Ready"

