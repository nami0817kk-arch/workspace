# 物語型の本編（scripts/_template_story.yaml・shogun-story.yaml の型）。伊能忠敬の旅の毎日（暮らしの回）。2026-11-11 下書き。公開の予定は 11/13 12:00。
# 型：docs/story-main.md「00. 伸びる型」の E 暮らし型。主語は伊能忠敬ひとり。
#   誰でも持つ像＝「隠居した老人が、のんびり歩いて日本地図を作った」。裏返す像＝辞令の肩書は「元百姓・浪人」、手当は1日銀7匁5分で足りない分は自腹、
#   宿の値を自分で決め、前日に次の宿を触れ、雨なら何日も泊まる。迎える側は道を造り人を集めて眠らずに待ち、隊の中では弟子の規律が乱れ、家には旅先から見えない波乱があった。
#   問いは「何をしていた／どうしてた」。「なぜ」は字に出さない。語りは剣崎1人。想像の台詞なし。ネットの声なし。
#   他チャンネルの当たり（55歳から17年・歩数/歩幅・測量術と正確さ・伊能図の精度）は主役にしない。旅の運営・財布・宿・迎える側・隊の内側・家からの手紙を主役にした。
#   題名は答えを明かさない（「世知辛かった」だけ予告し、浪人・銀7匁5分・自腹・400人・破門・手紙の中身は伏せる）。
#   章立て（旅の毎日の順）：序章／第1章 出発（辞令・荷物・倹約）／第2章 財布（手当と自腹）／第3章 先触れと宿／第4章 迎える側（土佐・浜田の記録）／第5章 隊の内側（病・破門・薩摩と大村）／第6章 家からの手紙／まとめ。
# 出どころの柱：大谷亮吉『伊能忠敬』（岩波書店、1917。NDL デジタル pid 1874853。公開本の OCR を事実カードの引用と頁で確かめた）。
#   同書が引く一次史料：辞令書（寛政12年閏4月14日）・「啓行策略」の願書・高橋至時から間重富への手紙（『星学手簡』）・忠敬から景敬・妙薫への手紙・先触れの文面・
#   土佐藩士 奥宮正樹の日記（文化5年）・浜田藩士 土井俗助の記録（文化3年）・『高橋御用日記』。三重県の資料（御用留）は1か所だけ。
#   OCR は旧字・旧かなで読み違いがある。数字と固有名は、頁の文を何度か読んで確かめた。『測量日記』の原本そのものは開けていない（大谷の本を通して読んだ）。
# 照合しにくい所（報告に書く）：奥宮正樹の読み（おくのみや）・土井俗助の名の読み（台本では「土井」とだけ言う）・『御用留』の白米の話（三重県の資料を WebFetch の要約で読んだ）・
#   銀と金の換算（辞令の「銀7匁5分＝金2朱」から 1両＝60匁と逆算）・「自腹の合計およそ150両」は 80両＋70両（道具代）の足し算で、史料に合計の言葉は無い。
# 計算（自分で計算し直した）：
#   銀7匁5分 ＝ 金2朱（大谷の注）。1朱＝1/16両 → 2朱＝1/8両。60匁＝1両 → 7.5匁 ＝ 60÷8 ＝ 7.5 で一致。
#   180日 × 7.5匁 ＝ 1,350匁。1,350 ÷ 60 ＝ 22.5両（22両2分）。至時の手紙は「御手当は貳拾兩斗」（20両ほど）。
#   道中入用金100両 のうち残り1分（1/4両）。手当20両 ＋ 自腹80両 ＝ 100両。手当は 20÷100 ＝ 2割。
#   測器の新調の自費70両 ＋ 道中の自腹80両 ＝ 150両（あわせて「およそ」）。
#   辞令の日は閏4月14日、出発は閏4月19日＝1800年6月11日（大谷の注）。閏4月19日〜10月21日（旧暦）＝180日（大谷）。
#   忠敬は 1745年生まれ。1800年は数えで 1800−1745＋1 ＝ 56歳（大谷も56歳と書く）。書付の51歳は 56−51 ＝ 5つ若い。
#   享和2年 ＝ 1802年。文化2年 ＝ 1805年、文化3年 ＝ 1806年、文化5年 ＝ 1808年、文化6年 ＝ 1809年、文化10年 ＝ 1813年、文化12年 ＝ 1815年、文化7年 ＝ 1810年、文化11年 ＝ 1814年。
#   幟の竹 2丈6〜7尺 ＝ 26〜27尺 × 30.3cm ＝ 約7.9〜8.2メートル → 「8メートルほど」。
#   土佐の隊員：名前の挙がった7人（忠敬・周蔵＝秀蔵・坂部貞兵衞・下河邊正五郞・青木勝二郞・柴山傳內・上田文助）＋家来7人 ＝ 14人（竿を持つ者はこれとは別）。
#   寅の刻＝午前3〜5時、卯の刻＝午前5〜7時、亥の刻＝午後9〜11時（目安）。
