# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  日本中を歩いて地図を作った伊能忠敬。出発の5日前に渡された辞令には、意外な肩書が書かれていました。手当は1日に銀7匁5分。もともと自費で行くと願い出た旅に、つけられた手当でした。
  隠居した老人の、のんびりした旅。その毎日は、本当はどんなものだったのでしょうか。
  この動画でわかること
  ・出発前に渡された辞令と、荷物を減らすための工夫、師匠に叱られた倹約
  ・旅の財布の中身。手当と自腹はいくらだったか
  ・先触れの文面と、宿の値の決め方、雨の日の宿
  ・迎える側の日記が伝える、400人の人足と徹夜の道づくり
  ・病に倒れた隊長、乱れた隊、そして家に残した人たちへの手紙
description_note: |-
  伊能忠敬の旅の毎日は、大谷亮吉『伊能忠敬』（岩波書店、1917年）を、国立国会図書館デジタルコレクションで読みました。同書が引く辞令書・願書・高橋至時の手紙・忠敬の手紙・先触れ・土佐藩士奥宮正樹の日記・浜田藩士の記録などによります。『伊能忠敬測量日記』の原本そのものは開いていません。
  1か所だけ、三重県環境生活部文化振興課「三重の文化」が公開する『御用留』（文化2年）の紹介を使いました。
  銀7匁5分が金2朱にあたる、という換算は大谷の注によります。60匁を1両とした計算と、「自腹あわせておよそ150両」は、動画のなかの足し算です。
  江戸の時刻は日の出と日の入りで区切るため、動画のなかの時刻は目安です。
  画面の室内・人物・風景の画像の一部は、画像生成AIで作った想像上のイメージで、実在の写真ではありません。サムネイルの人物像も AI による想像図です。

en:
  title: "Was Ino Tadataka's Map Journey a Leisurely Walk? His Days on the Road Were Far Tighter Than Imagined"
  description: |-
    Ino Tadataka walked the length of Japan to make a map. Five days before he left Edo, the commission handed to him carried an unexpected title. His allowance was 7.5 monme of silver a day, added to a journey he had asked to make at his own expense.
    A retired old man on a leisurely walk. What was his daily life on the road really like?
    In this video you will learn:
    - The commission he received before departure, how he cut his baggage, and the teacher who scolded him for economizing
    - What was in his purse: how much was allowance and how much was out of pocket
    - What an advance notice to the villages said, how he set lodging fees, and what happened on rainy days
    - What a local official's diary tells us about 400 porters and a night spent building a road
    - The leader who fell ill, the unruly party, and the letters he sent home
    Japanese-language history video (Japanese audio).
  chapters:
    - "The Commission He Received Before Departure"
    - "Spring 1800: A Former Commoner and Rōnin Sets Out"
    - "7.5 Monme a Day: What Was in His Purse"
    - "\"One Soup, One Dish\": Advance Notices and Lodging"
    - "400 Porters and a Night of Road-Building: A Tosa Official's Diary"
    - "A Leader Down With Fever, an Unruly Party"
    - "Letters From the Road: The Family Left Behind"
    - "Summary: His Days on the Road"

