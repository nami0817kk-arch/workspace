  # ================================================================ 第1章 出発
  - title: 寛政12年閏4月　元百姓・浪人の出発
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-42
      - 語り: 伊能忠敬は、下総の佐原で、村の世話役をつとめた家の当主でした。1794年に隠居して、江戸で、星と暦の学問を学びます。
      # fact: inou-01
      - 語り: 1800年、寛政12年の閏4月。忠敬は、蝦夷地、今の北海道の測量を、自費でもやりたい、と願い出ます。幕府は、それを、試みに許しました。
        year: 1800
      # fact: inou-01
      - 語り: 1917年に出た、大谷亮吉の『伊能忠敬』は、このとき渡された辞令の文面を、載せています。
        year: 1917
        card: {head: "大谷亮吉『伊能忠敬』", body: 1917年・岩波書店}
      # fact: inou-01
      - 語り: 下総国佐原村の、元百姓、浪人、伊能勘解由。かねての願いのとおり、蝦夷地を、試みに測量させる。御用のあいだの手当として、1日に、銀7匁5分を与える。
        card: {head: "辞令", body: 元百姓・浪人／手当は1日銀7匁5分}
        tone: 重い
      # fact: inou-01
      - 語り: 銀7匁5分は、金に直すと、2朱にあたる、と大谷は注をつけています。小さな金額です。
      # fact: inou-02
      - 語り: 大谷は、手当が出たのは、多少の恩典だが、十分な便宜を与えたとは言えない、と書きます。辞令の「試みに」という言葉も、幕府が、まだ忠敬の腕を信じていなかった表れだ、と読みます。
      # fact: inou-03
      - 語り: 荷物にも、制限がありました。忠敬が出した願書は、測器に、人足4人と馬1疋。自分の荷物に、人足2人と馬1疋です。
      # fact: inou-03
      - 語り: けれど、認められたのは、内地の道で、人足3人と馬2疋。蝦夷地では、人足3人と馬1疋でした。
        figure: {type: stats, title: 荷物を運ぶ人馬（大谷『伊能忠敬』）, items: [[忠敬の願い, 人足6人・馬2疋, 測器と自分の荷], [認められた内地, 人足3人・馬2疋, 奥州街道など], [認められた蝦夷地, 人足3人・馬1疋, 蝦夷地の道]], upto: 3}
      # fact: inou-04
      - 語り: 忠敬は、願書に、こうも書いています。蝦夷地では、自分と連れの者の夜具は、現地で借りたい。人足の賃銭は、決まりどおり、自分で払う、と。
        figure: null
      # fact: inou-05
      - 語り: 二尺五寸の大きな方位盤は、人足4人がかりの嵩です。それは、蝦夷地の箱館に、置いていくことになりました。
      # fact: inou-05
      - 語り: 師匠の至時は、友人の間重富への手紙に、こう書きます。いらぬ倹約で、肝心の測量ができなくなった、と叱ったところ、忠敬は、一言もなかった、と。
        tone: 重い
      # fact: inou-46
      - 語り: 同じ手紙に、続きがあります。来年は、一尺二寸ほどの、小さな方位盤を、新しく作らせて持たせる積もりだ。せめて1人で持てれば、測量の都合もよく、費用も少ない、と。
      # fact: inou-06
      - 語り: 辞令から5日後。1800年6月11日、旧暦の閏4月19日の朝、五つ前。忠敬は、深川の仮住まいを出ました。数えで56歳です。
        year: 1800
      # fact: inou-06
      - 語り: 付き従うのは、弟子が2人と、息子の秀蔵、それに下男が2人。忠敬を入れて、たった6人でした。
        card: {head: "出発の朝", body: 忠敬のほか弟子2・息子・下男2}
      # fact: inou-07
      - 語り: 大谷は、もう一つ、注を付けています。忠敬は、老齢では交渉に不利になると案じたのか、幕府に出した書付に、年を、51歳と書いた、というのです。
      # fact: inou-07
      - 語り: 数えで56歳のところを、5つ若く。年寄りと見られては不利、と考えたのかもしれません。
        tone: しみじみ
      - 語り: 旅は、そこから、180日続きます。その財布の中身を、数えてみましょう。
        hook: true
      # fact: inou-08
      - 語り: 手当は、足りたのでしょうか。
        hook: true

  # ================================================================ 第2章 財布
  - title: 手当は1日銀7匁5分　旅の財布の中身
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-08
      - 語り: 蝦夷地の旅は、閏4月19日から、10月21日まで。かかった日数は、180日でした。
        year: 1800
      # fact: inou-01, inou-08
      - 語り: 手当は、1日に銀7匁5分。180日分で、1,350匁です。60匁を1両とすれば、22両あまり。至時が書いた、20両ばかり、にも近い数です。
        figure: {type: stats, title: 蝦夷地の旅の手当（辞令の1日7匁5分×180日）, items: [[毎日の手当, 銀7匁5分, 金2朱], [180日分, "1350匁", 22両あまり]], upto: 2}
      # fact: inou-09
      - 語り: 一方で、師匠の至時が、間重富に書いた手紙があります。節約して旅をしても、道中の費用は、100両のうち、残ったのは、1分だけだった、と。
        figure: null
      # fact: inou-09
      - 語り: 至時は、こう続けます。「御手当は、20両ばかり。道具代と支度料を除いても、80両の入れ足し」。
        tone: 重い
        card: {head: "至時の手紙", body: 手当は20両ばかり／80両の入れ足し}
      # fact: inou-09
      - 語り: 100両のうち、手当が20両。残りの80両は、忠敬が、自分で出したのです。手当は、費用の、およそ2割でした。
      # fact: inou-10
      - 語り: 大谷は、もう一つ書いています。測器を新しく作るのにも、旅の前から、自分のお金を、70両ほど、使っていました。
      - 語り: 80両と70両で、あわせて、およそ150両。手当との差は、大きなものでした。
        tone: 重い
      - 語り: この150両は、道具代を入れた、この動画の足し算です。史料に、合計の言葉があるわけではありません。
      # fact: inou-11
      - 語り: 旅の途中の宿も、役人のような安い木賃ではありません。往復の道では、ふつうの旅人と同じ、旅籠賃を払いました。
      # fact: inou-11
      - 語り: 渡し賃や川越しの賃は、払わずに済みましたが、人と馬の賃は、決まりの額を、一つずつ払っています。
      # fact: inou-12
      - 語り: 翌1801年の旅では、手当は、1日に銀10匁に増えました。それでも、自分で補った分は、60両あまりに上りました。
        year: 1801
        card: {head: "翌年の旅", body: 手当は1日銀10匁／自腹は60両あまり}
      - 語り: 道楽の旅と呼ぶには、持ち出しが、大きすぎます。
        tone: 重い
      # fact: inou-13
      - 語り: そんな旅の途中、箱館に着いた、翌日のこと。旧暦の5月23日、忠敬は、息子の景敬に、手紙を書きました。
        year: 1800
      # fact: inou-13
      - 語り: 「御用というものは、ありがたいもの。宿場ごとに、名主や年寄が、送り迎えに出てきて、恐れ入ります」。
        tone: しみじみ
        card: {head: "息子への手紙", body: 御用はありがたいもの}
      # fact: inou-14
      - 語り: 大谷は、この喜びを、こう読みます。それまでの忠敬は、関所を一歩出れば、武士に道を譲り、多くの屈辱を、しのぶ身だった。だから、御用の旅の待遇が、うれしかったのだ、と。
      - 語り: 待遇は、このあと、がらりと変わります。手当も、宿も、人馬も、です。
        hook: true

  # ================================================================ 第3章 先触れと宿
  - title: 「一汁一菜で」　先触れと宿の毎日
    background: {image: paintings/sankin_tsuchiyama_hiroshige_rain.jpg, credit: "歌川広重《東海道五十三次 土山》（19世紀。パブリックドメイン）"}
    lines:
      # fact: inou-15
      - 語り: 1802年、享和2年。第3次の旅から、待遇は変わります。手当は1年で、金60両。人足5人、馬3疋、長持1棹を、使えるようになりました。
        year: 1802
      # fact: inou-15
      - 語り: 人馬は、無賃です。宿は、幕府の役人と同じ、木賃で泊まれます。大谷は、まるで請負仕事のようだ、と書きます。
      # fact: inou-16
      - 語り: ただし、手当が増えても、気ままな旅にはなりません。忠敬は、行く先々の村へ、先触れを送りました。
        card: {head: "先触れ", body: 通る村へ前もって送る通知}
      # fact: inou-16
      - 語り: 大谷の本に、その文面が載っています。旧暦の6月10日付。「11日の朝、上下7人、江戸を出立いたします」。
        year: 1802
      # fact: inou-16
      - 語り: 「測量の道具を据えるので、庭でも空き地でも、10坪ほどの場所がある宿を、1軒、用意してください」。
        card: {head: "先触れの文面", body: 空き地10坪・宿は1軒}
      # fact: inou-40
      - 語り: 星の観測に、使う場所でしょう。のちの先触れには、夜に測量があるので、南北の見晴らしのよい地を、と、はっきり書かれました。
      # fact: inou-16
      - 語り: そして、こう続きます。「宿代は、決まりの木賃と、こめの代金を払います。ありあわせの品で、一汁一菜のほか、ご馳走めいたことは、決してしないでください」。
        tone: 重い
      # fact: inou-17
      - 語り: 泊まりの触れは、旅のあいだ、毎日出しました。前の日に、翌日の泊まりの宿を、知らせるのです。
      # fact: inou-17
      - 語り: 雨や風で測れなければ、同じ所に、何日も滞在します。旅の日取りは、天気が決めていました。
      # fact: inou-41
      - 語り: 最初の蝦夷地の旅の、往きの夜は、会所か番所に泊まりました。天気が悪くて星が見えなければ、観測できるまで、そこに滞在して、必ず、その土地の緯度を決めたといいます。
      # fact: inou-43
      - 語り: 旧暦の6月3日、至時は、忠敬に、旅の心得を書いて渡しています。連れていく弟子や小者には、厚かましいことのないよう、よく言い含めておくこと。
      # fact: inou-43
      - 語り: 旅の途中で、病気になって、務めが果たせなければ、その旨を届書にして出し、勝手次第に、江戸へ戻ってよい。治ったら、また届書を出して、すぐ御用先へ出立すること。
      # fact: inou-18
      - 語り: それまでの旅では、宿代を、どう払っていたのか。至時が間重富に書いた、1802年の旧暦4月の手紙に、忠敬のやり方が出てきます。
        year: 1802
      # fact: inou-18
      - 語り: 忠敬は、自分は1泊150文、弟子と侍は124文、小者は100文、と決めて、払っていました。
        figure: {type: stats, title: 忠敬が決めた1泊の宿賃（至時の手紙）, items: [[忠敬自身, 150文, 1泊], [弟子と侍, 124文, 1人1泊], [小者, 100文, 1人1泊]], upto: 3}
      # fact: inou-18
      - 語り: 宿の役人と主人の受け取りの印を、初日にもらっておけば、どこまでも、その値で通る、とも教えています。
        figure: null
      # fact: inou-19
      - 語り: 長く泊まれば、茶代を渡すこともありました。金2朱か、1分です。
      # fact: inou-20
      - 語り: ところが、この一汁一菜のお願いは、守られませんでした。大谷は、先触れの一汁一菜は、形だけの空文で、山間の僻地でも、村の人は、苦心して膳を整えたもの、と書いています。
        tone: 重い
      # fact: inou-20
      - 語り: 1814年、旧暦の5月9日、上野国の宮崎村に泊まった折に、忠敬たちへ出した食事の献立書が伝わる、とも、大谷は書きます。
        year: 1814
      # fact: inou-21
      - 語り: 三重県が公開する資料に、1805年の『御用留』の紹介があります。五ヶ所浦で、忠敬は、機嫌が悪く、膳のおかずには手をつけず、飯ばかり食べて、自分の荷物から鰹節を出して、おかずにした、と。白米が、好みだったともあります。
        year: 1805
      - 語り: 一汁一菜でと頼んでも、膳は並びます。迎える側の苦心は、忠敬の機嫌とは、関わりなく続きました。
        tone: しみじみ
      - 語り: では、その膳を整える側は、何をしていたのか。土佐の役人の日記が、残っています。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 迎える側
  - title: 人足400人と徹夜の道づくり　土佐藩士の日記
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-22
      - 語り: 1808年、文化5年。四国の測量で、忠敬の隊を、土佐藩の国境、甲浦で迎えた役人がいます。普請方下役の、奥宮正樹です。
        year: 1808
      # fact: inou-22
      - 語り: 奥宮は、道の修繕を命じられ、一か月あまり、隊に付き従って、日記を書きました。大谷は、その日記を、抜き書きしています。
      # fact: inou-22
      - 語り: 日記のはじめに、こうあります。測量の用に使う人足は、400人ほど、大送りだという。
        tone: 重い
        card: {head: "奥宮正樹の日記", body: 人足は400人ほど}
      # fact: inou-23
      - 語り: この役目のために、甲浦に来た土佐の人は、上下33人。隊が国境を越えた日には、阿波の側から、20人ほどが、境まで送ってきました。
      # fact: inou-24
      - 語り: 隊の宿になったのは、寺です。門の前には、長さ二丈六、七尺の竹に、赤、白、青の三色の幟が、立ててありました。長さ8メートルほどの竹です。
      # fact: inou-24
      - 語り: 奥宮は、書いています。遠くからでも、宿を見分けられるようにだろうか、と。
      # fact: inou-25
      - 語り: 門の前には、幕を張りめぐらし、象限儀という測器を据える。夜中に、北極星の高さを、はかる器だ。幕のなかの、10坪ほどの平らな所に、据えている、と。
        card: {head: "象限儀", body: 星の高さを測る道具}
      # fact: inou-26
      - 語り: 翌日、隊は、海辺を測りながら進みます。ところが、生見の鼻で、隊と土佐の側とのあいだに、行き違いが起きました。
      # fact: inou-26
      - 語り: 隊の人たちは、ひどく腹を立てました。道の用意が、ないではないか、と。土佐の人は、道は造ったと言っても聞き入れられず、困り果てます。
      # fact: inou-26
      - 語り: そのうえ、雨が降り出しました。傘を持たせた者は、先に野根まで行ってしまっています。隊の秀蔵と青木は、傘もなく、ぬれそぼち、奥宮は、面目なさに、立ちつくしました。
      # fact: inou-27
      - 語り: 隊の夜は、星の観測です。日記には、「今夜も、北辰を量る」と、夜の観測の記述が、日ごとに出てきます。
      # fact: inou-28
      - 語り: 磯の道が、困りものでした。名主が、にわかには整えられない、と訴えます。奥宮は、亥の刻、夜の10時ごろに宿を出ました。
      # fact: inou-28
      - 語り: 寅の刻、まだ暗いうちに、椎名に着き、人を集めて、磯の道を造り、邪魔な枝を刈ります。すべてが終わったのは、夜が明けて、しばらくしてからでした。
      # fact: inou-27
      - 語り: 23日の日記に、奥宮は、こう書きます。甲浦を出てから、今日まで、一夜も眠れず、ひどく疲れた、と。
        tone: 重い
      - 語り: 忠敬の隊は、ただ、測量を進めていた。それを迎える側は、道を造り、人を集め、眠れぬ夜を過ごした。それが、旅の毎日でした。
        tone: しみじみ
      # fact: inou-29
      - 語り: 石見の浜田藩にも、記録が残っています。1806年、文化3年の5月。藩士の、土井という人が、測量隊が通るのに合わせて、藩から、領内の海辺の絵図を作るよう、命じられました。
        year: 1806
      # fact: inou-29
      - 語り: 土井は、あちこちを回って、絵図を描きます。ところが、測量方の役人から、これでは役に立たない、と、何度か、描き直しを言われました。
      # fact: inou-29
      - 語り: 村ごとの絵図ではなく、領内全体を1枚に。縮尺を決めて、至急に。急ぐ途中で、船は大風にあい、一緒に出た船が1隻、壊れました。
      # fact: inou-29
      - 語り: 土井の記録には、こうも出てきます。「勘解由様の長持は、浜田の城下を通るとき、人足が60人も、かかった」。
        card: {head: "浜田藩士の記録", body: 忠敬の長持に人足60人}
      # fact: inou-29
      - 語り: 大谷は、読みます。絵図を何度も描き直させたことから見ても、隊が、地元の人々に求めたことは、かなり厳しかったのだろう、と。
      # fact: inou-45
      - 語り: 四国の測量では、藩は、隊の意を迎え、一日も早く、領内の測量が終わることを願った、と大谷は書きます。人も、道も、迎える側の負担でした。
      - 語り: のんびり歩く老人の旅では、ありません。行く先々で、人と、道と、宿が動いた。その真ん中に、忠敬がいました。
        tone: 重い
      - 語り: そして、人が増えるほど、隊の中でも、問題が起きるようになります。
        hook: true

  # ================================================================ 第5章 隊の内側
  - title: 1806年　病に倒れた隊長と乱れた隊　薩摩と大村
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-30
      - 語り: 1805年、文化2年から、測量は、幕府の直轄になります。隊には、幕府の天文方の下役も、加わりました。
        year: 1805
      # fact: inou-30
      - 語り: 同じ測量に携わっても、肩書に、差が生まれます。弟子の平山郡蔵は、腕が立ち、新しく来た下役を、しのぐような態度を、とることもあった、と大谷は書いています。
      # fact: inou-30
      - 語り: 隊のなかに、不和が生まれました。病気を理由に、隊を抜ける者が出ます。温和な下役の坂部も、不満から、隊を抜けたいと漏らしましたが、忠敬が、説いて、思いとどまらせました。
      # fact: inou-30
      - 語り: そのさなか、防長、今の山口県のあたりで、忠敬自身が、病に倒れます。仕事を見られない日々が、続きました。
        tone: 重い
      # fact: inou-30
      - 語り: 隊長が、仕事を見られないあいだに、弟子たちの規律は、乱れた、と大谷は書きます。宿で酒宴を開く。食べ物のよしあしを言う。書画や骨董を、ほしがる。買った品に、相応の代金を、払わない。
      - 語り: 沿道の村人が、迷惑している。その噂は、幕府の耳にも、届きました。
      # fact: inou-31
      - 語り: 1806年、旧暦の9月14日。幕府の堀田摂津守は、内々の意向を、高橋景保に伝え、忠敬に、部下を厳しく戒めさせます。
        year: 1806
      # fact: inou-31
      - 語り: 江戸に戻ると、弟子の平山郡蔵と、もう1人は、破門。ほかの弟子には、謹慎が、言い渡されました。
        tone: 重い
      # fact: inou-32
      - 語り: 大谷は、書いています。部下をまとめきれなかった失敗は、忠敬の生涯で、この時を除いて、ほとんど見られない、と。
      # fact: inou-33
      - 語り: 原因は、どこにあったのでしょうか。大谷は、遠因を、隊員どうしの不和に見ます。その一方で、隊の要求の大きさに音を上げた、沿道の人々の不満が、幕府に届いた面もある、と書いています。
        tone: 疑問
      # fact: inou-34
      - 語り: ところで、鹿児島の薩摩藩では、忠敬は監視され、傘のなかに測器を隠して、こっそり測った。そんな話を、聞いたことはありませんか。
      # fact: inou-34
      - 語り: 大谷は、これを、根拠のない臆測だ、と退けます。
        tone: 重い
      # fact: inou-34
      - 語り: 薩摩の南の島へ渡るとき、藩は、八隻の大きな帆船を御用船に出しました。付けたのは、藩士8人、医師1人、足軽20人ほど、町人6人、人足25人ほど。
        tone: 重い
        card: {head: "薩摩の南の島へ", body: 帆船8隻・付き添い60人ほど}
      # fact: inou-34
      - 語り: 藩が、藩内の要害を見せたがらなかっただろう、とは、大谷も認めています。それでも、測量の線の数は、隣の藩に比べて、少なくなかった、と書きます。
      # fact: inou-44
      - 語り: 薩摩で、滞在が長くなった所の多くは、木星の食を観測するためだったり、逆風で船が出せなかったりしたためだった、と大谷は書いています。
      # fact: inou-35
      - 語り: 肥前の大村藩では、隠居した殿様が、星の学問を好み、忠敬を呼んで、自分で説を聞きました。
      - 語り: 監視される旅ではなく、迎えられる旅。それは、忠敬の気苦労が、減ったことを意味したのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 旅先から、忠敬が書いた、手紙があります。
        hook: true

  # ================================================================ 第6章 家からの手紙
  - title: 1813年　旅先の手紙と、家に残した人たち
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-36
      - 語り: 家には、長女の稲女がいました。忠敬が、いちばん可愛がった娘です。
      # fact: inou-36
      - 語り: ところが、稲女は、夫が離縁されたとき、父に背いて、夫に従いました。忠敬は、娘を勘当します。
        tone: 重い
      # fact: inou-36
      - 語り: 1810年、文化7年。夫に先立たれた稲女は、髪をおろして、妙薫と名を改め、父に許しを求めます。それからは、老後の忠敬を慰める、孝行な娘になりました。
        year: 1810
      # fact: inou-37
      - 語り: 1813年、文化10年の正月。九州の旅の途中、肥前の浦から、忠敬は、妙薫に手紙を書きます。
        year: 1813
      # fact: inou-37
      - 語り: 「御用先は、国々の領主方が、何事も差し支えなく、取り計らってくれます。何の不自由もなく、江戸の住まいより、ずっとよいので、ご安心ください」。
        card: {head: "娘への手紙", body: 何の不自由もなく、江戸の住まいよりよい}
      - 語り: その言葉を、そのまま受け取るか。それとも、迎える人々の日記と並べて、読むか。旅の景色は、変わります。
        tone: しみじみ
      # fact: inou-38
      - 語り: その年、九州の旅のあいだに、跡継ぎの景敬が、幼い子を残して、亡くなりました。
        tone: 重い
      # fact: inou-38
      - 語り: 大谷は、書いています。忠敬の心には、新しい寂しさと、伊能家の行く末への、心配が生まれた、と。
      # fact: inou-39
      - 語り: さらに、旅を終えて帰ると、家には、もう一つの波乱が待っていました。庶子の、秀蔵のことです。
      # fact: inou-39
      - 語り: 秀蔵は、15歳で、忠敬の蝦夷地行きに連れられて以来、1808年の四国の測量まで、毎年のように、測量について行きました。
      # fact: inou-31
      - 語り: 思い返せば、1806年の隊の乱れのあとにも、秀蔵には、謹慎が言い渡されていました。
      # fact: inou-39
      - 語り: ところが、その後、大酒を飲み、振る舞いが荒れた、と大谷は書きます。1815年、文化12年の4月の末、忠敬は、秀蔵を、家から追いました。
        year: 1815
        tone: 重い
      # fact: inou-39
      - 語り: 同じ秀蔵を、土佐の役人の奥宮は、雨にぬれても顔色を変えない、心のどかな人、と日記に書いていました。大谷は、その評は、当てにはならない、と書いています。
      - 語り: 旅先の人には、おだやかに見えた息子が、父を悩ませていた。見る人と、時によって、同じ人の姿は、違って見えます。
        tone: しみじみ
      - 語り: 旅の毎日は、地図の上には、残りません。残ったのは、手当の数字と、宿の値と、人の日記と、家への手紙でした。
        hook: true

  # ================================================================ まとめ
  - title: まとめ　伊能忠敬の旅の毎日
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      - 語り: ここまでの旅の毎日を、振り返ります。
      - 語り: 辞令の肩書は、元百姓、浪人。手当は、1日に銀7匁5分。足りない分と道具代は、自分の財布から、あわせて、およそ150両。
        card: {head: "辞令", body: 元百姓・浪人／手当は1日銀7匁5分}
      - 語り: 御用になると、手当は、1年で60両。人足と馬、安い木賃が付きました。けれど、前の日に、次の宿を知らせ、雨が降れば、同じ所に何日も滞在する暮らしは、変わりません。
      - 語り: 先触れには、一汁一菜と書きました。それでも、土地の人は、道を造り、人を集めて、迎えました。
      - 語り: 隊のなかでは、弟子の規律が乱れ、家には、旅先からは見えない、波乱がありました。
      - 語り: 隠居した老人の、のんびりした旅。そうではなく、手当の数字を数え、宿の値を決め、部下と地元の人に気を配り続けた、毎日の積み重ね。それが、日本地図の旅の、毎日でした。
        tone: しみじみ
      - 語り: 出発の前、浪人と書かれた辞令を受け取った老人は、旅のなかで、何度、財布の中身を、数えたのでしょうか。
        tone: しみじみ
      - 語り: ご視聴、ありがとうございました。
      - 語り: チャンネル登録も、よろしくお願いします。
