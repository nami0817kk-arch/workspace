sections:
  # ================================================================ 序章（冒頭 約1分）。答えは最後の章まで言わない
  - title: 出発前の辞令には「浪人」とあった
    background: {image: paintings/sankin_hoeido_nihonbashi_hiroshige.jpg, credit: "歌川広重《名所江戸百景 日本橋》（1850年代。パブリックドメイン）"}
    lines:
      # fact: inou-01
      - 語り: 日本中を歩いて、地図を作った伊能忠敬。出発の5日前に渡された辞令には、意外な肩書が書かれていました。
        tone: 重い
      # fact: inou-01
      - 語り: 「元百姓、浪人」。そして旅の手当は、1日に、銀7匁5分だけ。もともと、自費で行くと願い出た旅に、つけられた手当でした。
        card: {head: "旅の手当", body: 1日に銀7匁5分}
      # fact: inou-05
      - 語り: 荷物を運ぶ人足を減らそうと、大きな測器を置いていくと、師匠の高橋至時には、いらぬ倹約だ、と叱られました。
      # fact: inou-22
      - 語り: それでも旅は、年を追うごとに大きくなります。ある藩の役人の日記には、測量隊のために、人足が、400人ほども集められる、とあります。
      - 語り: 隠居した老人の、のんびりした旅。その毎日は、本当は、どんなものだったのでしょうか。
