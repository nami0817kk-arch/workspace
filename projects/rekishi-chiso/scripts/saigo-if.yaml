sections:
- title: 2月15日 雪の鹿児島を出た本隊
  background: &id001
    image: paintings/saigo_bg_tabaru_smoke.jpg
    credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  year: 1877
  lines:
  - 語り: 1877年2月15日、鹿児島は、60年ぶりの大雪でした。その雪のなかを、約1万3千人の本隊が、北へ向けて出発します。
    portrait: &id005
      image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg
      caption: 鹿児島暴徒出陣図（月岡芳年の錦絵、1879年）
      age: false
    card:
      head: 2月15日
      body: 鹿児島を出発
    short: s1
    background: *id001
  - 語り: それから7か月あまり。9月24日の朝、鹿児島の城山に最後まで残ったのは、約372人とされます。そのあいだに、降伏や解散で去った人もいました。
    card:
      head: 9月24日
      body: 城山に残った 約372人
    figure:
      type: stats
      title: 薩軍の数
      items:
      - - 出発の日
        - 約1万3千人
        - 2月15日 本隊
      - - 最後の日
        - 約372人
        - 9月24日 城山に残った数
      - - 戦いの長さ
        - 約7か月
        - 2月から9月
    short: s1
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  - 聞き: え、7か月で、何が起きたの？ 減りかたが、すごいね。
    tone: 驚き
  - 語り: 率いたのは、西郷隆盛。数えで50歳でした。維新の功労者が、なぜ、政府に刃を向けたのか。今日は、西南戦争を掘ります。
    portrait: &id002
      image: paintings/saigo_takamori_portrait.jpg
      caption: 西郷隆盛（キヨッソーネ系の肖像画。本人の写真は現存しない）
      age: false
    card:
      head: 西郷隆盛
      body: 1828年〜1877年
    figure: null
    short: s1
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 聞き: 教科書で見た、あの太い眉の顔だよね。維新のヒーローが政府と戦ったなんて、ちょっと信じられないな。
  - 語り: そこで、今日の問いです。もし、薩軍が、政府軍に勝っていたら。仮定は、ひとつだけ。2月22日、熊本城が、薩軍の手に落ちた、とします。
    portrait: null
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
    card:
      head: 今日の仮定
      body: 2月22日 熊本城が落ちた
  - 語り: ここでいう勝ちは、政府が薩軍を倒しきれず、九州で向き合ったまま、戦いが止まること、とします。問いは3つです。
    card:
      head: 今日の3つの問い
      body: 戦いは？ 政府は？ 西郷は？
  - 語り: 1つ目。戦いは、長引いたのか。2つ目。政府は、兵を送り続けたのか。3つ目。西郷は、勝てたのか。
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  - 聞き: 熊本城が落ちた世界の話だね。こういう「もしも」を調べた研究って、あるの？
    tone: 疑問
  - 語り: 先に断ります。正面から論じた学術研究は、今回の調査では見つかりませんでした。西南戦争の本は、小川原正道さんの中公新書などがありますが、読めていません。
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
    card:
      head: 最初の断り
      body: 論じた研究は見つからない
  - 語り: 約束が2つ。事実と想像は分けます。想像のあいだは《ここから想像》の札を出し、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。まずは、西郷が鹿児島に戻った、1873年から掘ります。
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
- title: 1873年〜1874年 西郷は、鹿児島へ帰った
  background: &id003
    image: paintings/saigo_tabaru_storehouse_1880.jpg
    credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  year: 1873
  lines:
  - 語り: 1873年10月23日、西郷隆盛は、参議の辞表を出します。朝鮮への使節派遣をめぐる、政府内の対立のすえでした。24日に受理され、西郷は、政府を去ります。
    portrait: *id002
    card:
      head: 10月23日
      body: 参議の辞表を出す
    background: *id003
  - 語り: 11月10日、鹿児島に帰り着きます。翌1874年6月ごろ、鹿児島に、私学校が作られました。若い士族を育てる学校で、県令の大山綱良が、支えたとされます。
    card:
      head: 1874年6月ごろ
      body: 鹿児島に私学校
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 西郷隆盛の顔について、断っておきます。画面の肖像は、キヨッソーネが描いた絵の系統です。西郷が写真を撮った記録はなく、本人の写真は、現存が確認されていません。
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
    card:
      head: 西郷の顔
      body: 本人の写真は現存しない
    short: s2
  - 聞き: え、写真がないの！？ あの顔、本人と違うかもしれないってこと？
    tone: 驚き
    short: s2
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 1883年、エドアルド・キヨッソーネが、弟の西郷従道と大山巌の顔を組み合わせて描いた、と言われます。つまり、画面の顔は、ほかの人の顔を重ねて描いた絵だと言われています。
    short: s2
  - 語り: それでも、西郷の名は、残りました。
    short: s2
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  - 聞き: 顔も分からないのに、みんなが知ってる人なんだね。……その西郷が鹿児島にいるあいだ、ほかの士族は、おとなしくしてたの？
    tone: しみじみ
    hook: true
  - 語り: 次は、西郷のいない場所で起きた、士族の反乱です。
    hook: true
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
- title: 1874年〜1876年 佐賀・神風連・萩 士族の反乱
  background:
    image: paintings/saigo_tabaru_storehouse_1880.jpg
    credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  year: 1874
  lines:
  - 語り: 1874年2月の佐賀の乱では、江藤新平と島義勇が立ちました。江藤は、西郷にも助けを求めましたが、西郷は、断ったとされます。4月13日、江藤と島は、斬首の刑になります。
    portrait: null
    card:
      head: 西郷は加わらず
      body: 江藤の求めを断る
  - 聞き: 西郷は、このときは、動かなかったの？ 政府は、どうやって抑えたんだろう。
    tone: 疑問
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 政府は、大久保利通に全権を任せ、東京・大阪・熊本・広島の鎮台兵を、電信と汽船で送りました。
  - 語り: 1876年10月には、熊本の神風連、福岡の秋月、山口の萩で、相次いで反乱が起きます。神風連は、熊本鎮台を襲いましたが、翌朝、児玉源太郎らが反撃し、鎮められました。
    card:
      head: 10月24日
      body: 神風連の乱 約170人
    figure:
      type: stats
      title: 士族の反乱
      items:
