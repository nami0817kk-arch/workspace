      body: 熊本城を強攻 落ちず
  - 聞き: 3倍以上の兵がいて、落ちなかったんだね。薩軍は、そのあと、どうしたの？
    tone: 疑問
  - 語り: 薩軍は、強攻をやめ、長囲戦に変えます。兵糧が尽きるまで囲む作戦です。強攻の中止を決めたのは西郷、とする記述もありますが、原典は読んでいません。
