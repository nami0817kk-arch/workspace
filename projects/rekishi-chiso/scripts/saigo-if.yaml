  - 語り: 次は、1877年の1月です。
    hook: true
- title: 1877年1月〜2月 弾薬事件・暗殺の風説・出発
  background: &id004
    image: paintings/saigo_bg_tabaru_pines.jpg
    credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  year: 1877
  lines:
  - 語り: 1877年1月29日、政府が鹿児島の弾薬製造の設備を運び出そうとし、私学校の生徒たちが、火薬庫を襲います。
    portrait: null
    card:
      head: 1月29日
      body: 火薬庫を襲い弾薬を得る
    figure: null
    background: *id004
  - 語り: 約8万4千発を手に入れ、薩軍が使える弾薬を、約300万発とする説もあります。
  - 聞き: 弾薬を奪った時点で、もう、引き返せない感じがするね。
    tone: しみじみ
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 続いて、西郷暗殺計画の風説が広まります。中原尚雄ら60人あまりが捕まり、拷問のあとの自白書に、川路利良大警視の暗殺指示が語られた、とされます。
    card:
      head: 2月3日
      body: 西郷暗殺計画の風説
  - 語り: 本当に指示があったのかは、裏づけが取れていません。
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
  - 語り: 西郷は、2月初め、小根占で報せを聞き、4日夜に鹿児島へ戻ります。2月5日の大評議で、桐野利秋の「断の一字」により、出兵が決まりました。
    card:
      head: 2月5日
      body: 大評議で出兵が決まる
  - 語り: 作戦は、池上四郎の案で、熊本城には抑えを置き、主力は、陸路で東へ上る、というものです。
    card:
      head: 2月6日
      body: 熊本城は抑え、主力は東上
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 2月15日、大雪のなか出発。挙兵の名分として伝わるのが、「政府へ尋問の筋これあり」。徳富蘇峰の本で紹介される形で、原文は未確認です。
    portrait: *id005
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 聞き: 問いただす、って、戦争を始める理由にしては穏やかだね。……それで、薩軍と政府軍は、兵の数も道具も、どれくらい違ったの？
    tone: 疑問
    hook: true
  - 語り: 次は、数字で比べます。
    hook: true
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
- title: 1877年 兵の数と装備 薩軍と政府軍
  background:
    image: paintings/saigo_bg_tabaru_pines.jpg
    credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  year: 1877
  lines:
  - 語り: 薩軍は、私学校党が約1万3千人。協力した各地の隊を足して、約3万人とされます。
    portrait: null
  - 語り: 政府軍の陸軍は、全国の集計で5万8千人あまり。10個の旅団で、小銃は約4万6千挺、砲は109門です。私学校党は、小銃約1万3千挺、砲60門。数は、時期で動きます。
    card:
      head: 小銃の数
      body: 約1万3千挺と約4万6千挺
    figure:
      type: bars
      title: 小銃の数（挺）
      bars:
