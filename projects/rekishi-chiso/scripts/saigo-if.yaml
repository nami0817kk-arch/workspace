    tone: しみじみ
    short: s4
  - 語り: 3月20日、豪雨と霧のなか、政府軍は二方面から総攻撃をかけ、田原坂を突破します。政府軍の田原方面の戦死は、3月4日からの合計で2401人。20日だけで495人でした。
