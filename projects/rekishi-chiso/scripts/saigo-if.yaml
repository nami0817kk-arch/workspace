en:
  title: What If Saigo Takamori Had Won the Satsuma Rebellion? | The Day Kumamoto Castle Fell
  description: 'On February 15, 1877, about 13,000 men left Kagoshima in the heaviest snow in 60 years. On September 24, about 372 remained on Mount Shiroyama. This video asks: what if the Satsuma army had taken Kumamoto Castle on February 22?


    We keep records, theories and imagination apart. First, what the sources say: Saigo''s resignation in 1873, the samurai uprisings of 1874 and 1876, the arms-seizure incident and the rumored assassination plot, troop and rifle numbers, the fire in Kumamoto Castle on February 19, the siege, Takase and Tabaruzaka, the landing behind the Satsuma lines, and the last days at Shiroyama. We also note that no photograph of Saigo is known to survive.


    Then, clearly marked imagination with reasons: the night Kumamoto Castle falls, Yamagata Aritomo at Hakata, the Satsuma headquarters running short of ammunition, a table of fates, and how Japan might differ. In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    Facts follow summaries on Wikipedia and similar sources; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'February 15, 1877: 13,000 Men Leave Snowy Kagoshima'
  - '1873-1874: Saigo Goes Home, and the Face We Do Not Have'
  - '1874-1876: Saga, Shinpuren, Hagi: The Samurai Uprisings'
  - 'January-February 1877: Ammunition, a Rumor, and the Departure'
  - 'Numbers and Weapons: Satsuma vs the Government'
  - 'February 19-22: Kumamoto Castle Burns, Satsuma Attacks'
  - 'February 25-March 20: Takase and Tabaruzaka'
  - 'March-April: The Army Behind, and the Siege Lifted'
  - 'April-September 24: Hitoyoshi, Nobeoka, Shiroyama'
  - 'Other Paths in the Sources: Three Ways Satsuma Could Win'
  - 'Imagination 1: The Night Kumamoto Castle Falls'
  - 'Imagination 2: Yamagata Aritomo at Hakata'
  - 'Imagination 3: Satsuma Headquarters, Early March'
  - 'Imagination 4: A Table of Fates'
  - 'Imagination 5: How Japan Changes, and the Chains to Today'
  - 'Summary: Saigo Takamori and the Fork at Kumamoto Castle'
