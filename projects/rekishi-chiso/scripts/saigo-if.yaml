      - 約1万3千挺
      - 約4万6千挺
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 聞き: 小銃で、政府が3倍以上。それなのに、すぐ決着しなかったのは、なんで？
    tone: 疑問
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 政府軍の兵は、徴兵で集めた兵が中心でした。2月22日、植木で、乃木希典の隊が薩軍と出会い、軍旗を奪われた、とされます。
    card:
      head: 2月22日
      body: 植木で乃木隊が薩軍と出会う
    figure: null
  - 語り: ところが、政府軍には、電信と海軍がありました。東京と熊本は電信でつながり、2月19日には、征討の詔が出ています。鹿児島には、当時、電信が通っていませんでした。
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
    card:
      head: 電信
      body: 東京と熊本は電信でつながる
  - 語り: 海軍は、2千人あまりと軍艦13隻。薩軍に海軍があった、という記述は、見つかっていません。
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
    card:
      head: 海軍
      body: 軍艦13隻
  - 語り: 一方、政府軍の弱点は、弾薬でした。歩兵の弾薬の調達に問題があり、スナイドル銃の弾が足りなくなります。
  - 聞き: その政府軍と薩軍が、いよいよ、熊本でぶつかるんだよね。
    tone: 疑問
    hook: true
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 次は、熊本城です。
    hook: true
