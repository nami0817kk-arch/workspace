  - 語り: 熊本城の公式サイトは、谷の命で、児玉源太郎が火を付けた、とする説を、いまは有力と紹介します。鎮台が、自分で焼いた説です。確かな史料までは、見ていません。
    short: s3
  - 語り: 2月22日、薩軍が、熊本城を攻めます。段山を占領しましたが、歩兵第13連隊長が狙撃され、翌日亡くなります。城は、落ちませんでした。
    background:
      image: paintings/saigo_bg_tabaru_smoke.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
