  year: 1877
  lines:
  - 語り: 2月25日から27日、高瀬で、政府軍と薩軍がぶつかります。薩軍が野戦で攻めに出たのは、この戦いだけとされ、弾薬が足りず、中央隊が勝手に退いた、との記述もあります。
    portrait:
      image: paintings/saigo_nishiki_saigo_fighting.jpg
      caption: 西南戦争の錦絵（中央が西郷隆盛と伝わる）
      age: false
    card:
      head: 2月25日〜27日
      body: 高瀬の戦い
  - 語り: 3月4日、政府軍が全面攻勢に出ます。主攻は田原。吉次峠では、薩軍の篠原国幹が、狙撃されて戦死しました。
    card:
      head: 3月4日
      body: 政府軍の全面攻勢
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 田原坂は、高さ100メートルほどの台地を通る、切通しの坂道でした。薩軍は、約7千人を田原に置いた、とされます。
    background:
      image: paintings/saigo_tabaru_storehouse_1880.jpg
      credit: 田原坂の弾痕の残る蔵（富重利平撮影、1880年ごろ）
    short: s4
  - 語り: 3月13日、警視隊から、剣術の達者な警察官110人あまりを選び、抜刀隊が作られます。14日の第一次は、3つの堡塁を奪いますが、後が続かず退きます。
    portrait:
      image: paintings/saigo_nishiki_tabaruzaka_1877.jpg
      caption: 田原坂の戦い（錦絵、1877年）
      age: false
    card:
      head: 3月13日
      body: 抜刀隊が作られる
    background:
      image: paintings/saigo_bg_tabaru_pines.jpg
      credit: 「田原坂激戦之図」の一部（小林永濯の錦絵、1877年）
  - 語り: 15日の横平山が、いちばんの激戦でした。警視隊から選ばれた第二次の抜刀隊50人のうち、無傷だったのは、2人だけです。
    short: s4
    background:
