# B（歴史の転換点の if ストーリー）。型：事実（西南戦争＝私学校・挙兵・熊本城・田原坂・衝背軍・城山）→ 史料に残る別の道（強攻で落とす／熊本を抑えて東上／上陸を防ぐ）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/saigo_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は saigo_if_assets.md。夜のA（大久保利通）は別のエージェント。西郷と大久保の対比は夜の回に譲る。
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の桐野想像・西郷想像・山県想像・参謀想像・池上想像）
#   ③記録のセリフは本編に置かない。同じ幕で声が重ならない：第1幕＝桐野（玄野武宏）と西郷（麒ヶ島宗麟）／第2幕＝山県（雀松朱司）と参謀（離途）／第3幕＝西郷（麒ヶ島宗麟）と池上（黒沢冴白）
# 分岐点は1つだけ：2月22日の強攻で熊本城が落ちたら。ほかは史実のまま（征討の詔は2月19日・政府の電信と海軍・天守の焼失は2月19日）。勝ちは「政府が薩軍を倒しきれず、九州で向き合ったまま戦いが止まること」。
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。声に出す型は「可能性は、〜、です」「札は、〜、です」。
#   高い＝政府は兵を送り続ける（詔は落城前・10個旅団・軍艦13隻・電信）／熊本城天守の焼失は2月19日で仮定の落城より前／
#   ありうる＝熊本城が落ちる（約4千対約1万4千・段山占領）／戦いが長引く／博愛社の動きが変わる／西郷が熊本を拠点に戦う／
#   ほぼ妄想＝鎮台兵のその後・政府の弾薬が続くか・薩軍の補給・ほかの士族の呼応・徴兵制の行方・西郷が勝てたか。
# 研究：「薩軍が勝っていたら」を正面から論じた研究は見つかっていない（冒頭と想像の節で断る）。小川原正道『西南戦争』（中公新書）は存在を断るだけで未読。田原坂・熊本城の評価は連載記事・Wikipedia 経由。
# 数字は「何の数か」を言う：兵数は記述により幅（薩軍2万〜3万・私学校党約1万3千）／政府の陸軍は集計（時期で動く）／弾薬は約8万4千発接収・約300万発説／死者は二次の集計。
# 年齢：西郷は数えで50歳（1828生）。「政府に尋問の筋これあり」は徳富蘇峰の紹介の形で、原文は未確認と断る。「敬天愛人」「清正公に負けた」は事実として使わない。
# 使わない話：暗殺指示の有無の断定／清正公の発言／「敬天愛人」を西郷の言葉として／田原坂の歌詞／城山の最期の細部・首／戦死者の描写／薩軍の勝ち方の断定／大久保との対比（夜の回）。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像と錦絵は額）／錦絵は三連で継ぎ目があるので額だけ／現代の写真（熊本城2009年）は credit と語りで「建て直された天守」と断る／1865年の絵・写真は年を credit に書く。
title: もし西郷隆盛が西南戦争で勝っていたら｜熊本城が落ちた日、日本はどうなったか
