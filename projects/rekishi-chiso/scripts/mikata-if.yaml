  - 語り: そうです。信長の相手は、すでに浅井・朝倉、足利義昭、武田の三方向でした。家康の死は、東の盾を弱めます。ただ、東に割ける兵には、限りがありました。
    portrait:
      image: paintings/mikata_ashikaga_yoshiaki_yoshiaki.jpg
      caption: 足利義昭（江戸時代の肖像）
      age: false
    background:
      image: paintings/oichi_odani_castle_ezu.jpg
      credit: 《小谷城跡絵図》江戸時代
    figure:
      type: stats
      title: 信長が抱えた三方向
      items:
      - - 西
        - 浅井・朝倉
        - 信長と対立
      - - 都
        - 足利義昭
        - 異見十七ヶ条で対立
      - - 東
        - 武田信玄
        - 遠江・三河へ進軍
  - 聞き: 信長が動いても、信玄は進むよね。止まるとしたら、いつ？
    tone: 疑問
    hook: true
  - 語り: 信玄の時間は、あと約108日でした。
    hook: true
- title: 想像④ 信玄の約108日と、勝頼の高天神城
  background:
    image: paintings/mikata_totomi_kuniezu_1838.jpg
    credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
  year: 1573
  lines:
  - 語り: 日付を並べます。三方ヶ原は元亀3年12月22日。信玄が亡くなるのは、元亀4年4月12日。約108日後です。
    portrait:
      image: paintings/ieyasu_takeda_shingen_portrait_detail.jpg
      caption: 武田信玄（江戸時代の肖像画）
      age: false
    card:
      head: 元亀4年4月12日
      body: 信玄が病死（数え53歳）
    short: s4
  - 語り: 年が明けて、元亀4年。信玄は、三河の野田城を囲みます。開城は2月16日。約500人の城に、約1か月かかりました。
    portrait: null
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
    short: s4
  - 語り: そのあと、信玄は喀血を繰り返し、進軍は止まった、とされます。長篠で療養し、4月の初めに、甲斐へ戻ると決まりました。
    short: s4
  - 語り: 病名は、肺結核や胃癌などの説があり、決まっていません。画面は、現在の武田氏館跡です。
    background:
      image: paintings/mikata_kofu_tsutsujigasaki_photo.jpg
      credit: 前田左衛門佐 躑躅ヶ崎館（武田氏館跡、現在の写真、2005年）
    short: s4
  - 聞き: 病気で止まったのか。信玄が元気だったら、どこまで行ってたんだろう。
    short: s4
  - 語り: ここからは、想像です。この点を正面から論じた研究も、見つかっていません。
    card:
      head: ここから想像
      body: 家康が亡くなっていたら
  - 語り: では、家康が亡くなっていたら。病そのものは、家康の生死とは関係がありません。野田城のあとで止まる流れは、変わらなかったと想像します。可能性は、ありうる、です。
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
    card:
      head: ありうる
      body: 病で止まる流れは変わらない
  - 聞き: 家康が生きてても死んでても、信玄の体は同じ、ってことだよね。そこは変わらないのか。
  - 語り: ただ、止まる前の進み方は、変わったかもしれません。抵抗が弱ければ、吉田城や岡崎へ、早く届きます。どこまで届いたかは、研究が見つかっていません。可能性は、ほぼ妄想、です。
    card:
      head: ほぼ妄想
      body: 病の前にどこまで進むかは材料なし
  - 語り: 信玄は、死を3年間隠すよう遺言し、勝頼はそれを守った、とされます。その勝頼が遠江で動くのは、天正2年6月。信玄が落とせなかった高天神城を、落とします。
    portrait:
      image: paintings/nobunaga_katsuyori_portrait.jpg
      caption: 武田勝頼（高野山持明院蔵の像の部分）
      age: false
    background:
      image: paintings/mikata_takatenjin_totomi_koseki.jpg
      credit: 藤長庚編《遠江古蹟図会》「高天神山之図」1803年
    card:
      head: 天正2年6月
      body: 勝頼が高天神城を落とす
    year: 1574
  - 聞き: 信玄が落とせなかったお城を、息子が落としたんだ。家康がいなかったら、勝頼の相手は、誰になるの？ 14歳の信康？
    tone: 疑問
  - 語り: 天正2年、信康は数え16歳です。家康のいない徳川を前にした勝頼は、史実よりも、攻めやすかったでしょう。可能性は、ありうる、です。
    card:
      head: ありうる
      body: 勝頼は史実より攻めやすい
  - 語り: 天正3年5月21日、長篠。史実では、織田・徳川が勝ちます。信康は数え17歳。その徳川が、同じ戦いをできたのか。材料は、ありません。可能性は、ほぼ妄想、です。
