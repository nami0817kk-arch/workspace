en:
  title: What If Tokugawa Ieyasu Had Died at Mikatagahara? | His Heir Was 14, Shingen Died 108 Days Later
  description: 'On the 22nd day of the 12th month of Genki 3 (January 25, 1573), the army of Takeda Shingen marched past Hamamatsu Castle, just north of Tokugawa Ieyasu. Ieyasu left the castle anyway and lost the Battle of Mikatagahara in about two hours. At that moment the only son of his whose name we know was Nobuyasu, aged 14 by Japanese count, holding Okazaki. This video asks: what if Ieyasu had died that evening?


    We keep records, theories and imagination apart. First, what the sources say: Shingen''s march west and why historians disagree on its aim, the fights at Hitokotozaka and Futamata, the five competing explanations for why Ieyasu left the castle, the two hours at Mikatagahara, and three other paths that really existed (staying inside the castle, Oda reinforcements, the alliance with Uesugi Kenshin).


    Then, clearly marked imagination with reasons: the night in Hamamatsu Castle, a 14-year-old lord at Okazaki, Oda Nobunaga''s choices, Shingen''s last 108 days, a table of fates, how Japan would differ, and the chains to modern Japan.


    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    The accounts of competing theories (the five explanations, and the aim of Shingen''s march) follow summaries on Wikipedia and similar sources; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'January 25, 1573: Shingen Marches Past Hamamatsu Castle'
  - 'October 1572: Shingen''s Westward March, Hitokotozaka and Futamata'
  - 'December 22: Why Did Ieyasu Leave the Castle? Five Competing Theories'
  - The Two Hours at Mikatagahara and the Night He Fled Back
  - 'Other Paths in the Sources: Staying In, Oda Aid, Uesugi Kenshin'
  - 'Imagination 1: The Night News of His Death Reaches Hamamatsu'
  - 'Imagination 2: A 14-Year-Old at Okazaki and the Mikawa Lords'
  - 'Imagination 3: What Would Nobunaga Send East?'
  - 'Imagination 4: Shingen''s 108 Days and Katsuyori at Takatenjin'
  - 'Imagination 5: A Table of Fates - Who Becomes What?'
  - 'Imagination 6: How Japan Changes, and the Chains to Today'
  - 'Summary: The Fork Before Hamamatsu Castle'
