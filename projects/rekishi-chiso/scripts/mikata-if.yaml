# B（歴史の転換点の if ストーリー）の4本目。型：事実（三方ヶ原の戦い・家康が浜松城を出た理由の諸説＝分かれ道）→ 史料に残る別の道（籠城／織田の援軍／上杉謙信）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/mikatagahara_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は mikatagahara_assets.md。既存：ieyasu_facts.md・scripts/ieyasu.yaml（昨日公開のA作品。しかみ像・三方ヶ原の節は繰り返さず、Bの問いに集中する）
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の忠勝想像・忠次想像・信康想像・信長想像）
#   ③記録のセリフは本編に置かない（想像の節に記録のセリフを混ぜない）
#   同じ幕で声が重ならない：第1幕＝忠勝（黒沢冴白）と忠次（離途）／第2幕＝忠次（離途）と信康（満別花丸・ボーイ）／第3幕＝忠次（離途）と信長（青山龍星）
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。札の名は声に出す型を「可能性は、〜、です」に統一。事実の部分は「分かっていません」「と伝わります」を使い分ける。
#   夏目吉信の身代わり（『寛政重脩諸家譜』）・犀ヶ崖の夜襲・空城の計・戦死の噂（『武徳大成記』は二次の紹介で原本未確認）は、いずれも後世の話・二次と断る。
# 冒頭の強い一点：下調べの推奨どおり C「信玄は浜松城を素通りしていた（家康が出なければあの夕方は起きなかった）」を問いに、A「家康の跡を継げる息子で名が分かるのは数え14歳の信康だけ」を山にした（冒頭〜第1節、運命表）。
#   B「戦死の噂」は二次の紹介のみなので、冒頭にせず第5節で出典の弱さを断って使った。秀康（1574生）・秀忠（1579生）は assets 一覧の生年。画面の前に原本で再確認してよい。
# 範囲は 史実（西上の目的が割れる→一言坂・二俣城→浜松城を出た理由の5説→日没までの約2時間・逃げ帰った夜→史料に残る別の道）→ 想像（浜松城の夜・岡崎の14歳・信長・信玄の約108日）→ 運命表 → 日本の変化点 → 現代の鎖 → まとめ。
# 数字は「何の数か」を言う（武田の総数の見積もり／徳川が遠江に回せた数／織田の援軍は史料ごとの記述）。「約3倍」と言い切らない。日付は和暦の月日、西暦は換算。元亀3年12月22日＝1573年1月25日。
#   信玄の死（元亀4年4月12日）までの約108日は西暦で数えた自分の計算（1573/1/25→5/13）。元亀4年の日付の西暦換算は確かめていないので台本では和暦だけを言う。
# 使わない話：脱糞・小豆餅・酒井忠次の太鼓・味噌／空城の計と犀ヶ崖の夜襲を事実として／しかみ像を敗戦の戒めとして／夏目吉信ら身代わりの最期の描写／信玄の狙撃説（笛の音）／『甲陽軍鑑』の「天下を狙った」を事実として／
#   「三ヶ年の鬱憤」の意味の断定／「家康が死んでいれば江戸幕府は無かった」「徳川幕府は信玄が作った」／影武者説／ネット掲示板・知恵袋・個人ブログ・note の「もし家康が〜」／信康事件・築山殿の最期／信玄の遺骸を諏訪湖に沈める話／鳥居忠広（事実未確認）。
# 決めた札の理由：
#   高い＝家康の跡を継げる息子で名が分かるのは信康だけ（岡崎城主は事実）／家康が居なければ伊賀越えの道を通る人が居ない／信玄の病が計画を左右した（事実の並置）。
#   ありうる＝酒井忠次を軸に重臣の合議が先に動く（役職は事実）／戦死の噂が夜のうちに広がる（記録は二次の紹介）／直政は家康に見出される道が消えても別の道が残る／三河の国衆の一部は様子見（信玄の書状が三河の国衆に宛てられた）／信長は援軍を増やし東美濃・岐阜を固める（実際にあった選択肢）／病で止まる流れは変わらない（病は事実・家康の死との関係は研究が見つからない）／勝頼は攻めやすい／秀吉の山場が消える。
#   ほぼ妄想＝家臣団が最後までまとまるか／誰が離れ誰が残るか（個別の記録なし・築山殿の材料なし）／信長が岡崎を直接預かる（史料で見つからなかった）／病の前に信玄がどこまで進むか／長篠の結果／江戸幕府の有無。
#   研究は見つからない（正面から論じたもの）を冒頭で、香原・河合の「見立て」（信玄があと1年生きていれば／野戦以外の選択肢はなかった）は第6節で論者名つきで断った。
# 画面の決まり：背景に人物の肖像・人物の拡大絵を使わない（肖像は額）／極端に横長の絵（縦横比2.4:1以上）は使わない／NDL系の絵図（色票・定規・黒帯が写る）は背景に全面で使わない（今回は使っていない）／血・遺体・首の絵は使わない／
#   現代の写真（浜松城・三方原古戦場碑・吉田城・武田氏館跡）は credit に「現在の〜」と書き、語りでもその行で断る。岡崎城の古写真は天守が江戸期のものと断る。信玄の出陣・川中島の絵は後世の想像図と断る。
