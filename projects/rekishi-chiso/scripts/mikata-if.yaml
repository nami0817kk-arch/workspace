  - 語り: 重臣の合議の軸は、酒井忠次です。こちらは、ありうる、です。ただ、持ちこたえたかは、分かりません。分かるのは、最初に座る人が14歳だったことです。この答えは、ほぼ妄想です。
  - 語り: 2つ目。信長は、東の守りをどうしたのか。想像では、援軍を増やし、東美濃と岐阜を固めます。岡崎を直接預かる案は、ほぼ妄想です。
