    background:
      image: paintings/nobunaga_nagashino_screen_full.jpg
      credit: 《長篠合戦図屏風》（江戸時代）
    card:
      head: ほぼ妄想
      body: 長篠の結果は材料なし
    year: 1575
  - 聞き: ここまでで、人の動きがだいぶ見えたね。表にまとめて見たいな。
    hook: true
  - 語り: 次は、人の運命を、表にします。
    hook: true
