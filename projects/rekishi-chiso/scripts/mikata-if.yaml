  - 語り: はい。当時の人が実際に考えていた選択肢と、史料に残る動きだけです。まずは、信玄がなぜ西へ来たのかから、掘ります。
- title: 元亀3年10月 信玄の西上、一言坂、二俣城
  background:
    image: paintings/mikata_shingen_departure_yoshitora_1.jpg
    credit: 歌川芳虎《武田信玄の出陣》1863年（フランス国立図書館蔵）
  year: 1572
  lines:
  - 語り: 元亀3年10月3日。武田信玄は、甲府を出陣します。率いるのは約2万2千、とされます。朝倉義景へ宛てた書状の原本が、今も残っています。
    portrait:
      image: paintings/ieyasu_takeda_shingen_portrait_detail.jpg
      caption: 武田信玄（江戸時代の肖像画）
      age: false
    card:
      head: 元亀3年10月3日
      body: 信玄、甲府を出陣
  - 聞き: 約2万2千かあ。画面は想像図だけど、すごい行列だよね。目的は、やっぱり京都に上ること？
    tone: 疑問
  - 語り: 画面は、江戸末期の想像図です。実際の軍勢の姿ではありません。西上の目的は、割れています。上洛説と、局地戦説です。
    card:
      head: 西上の目的
      body: 上洛説と局地戦説で割れる
  - 語り: 上洛説は、足利義昭が信長を討てと命じた御内書を、根拠の一つにします。ただ、その発給年は、元亀3年か4年かで割れます。画面は、武田の旗印の図です。
    background:
      image: paintings/mikata_takeda_hatajirushi.jpg
      credit: 戸澤盛徳《旗印図》1800年ごろ
  - 語り: もう一つの根拠は、11月19日付の朝倉宛の覚書です。翌年5月までの在陣を求めています。
  - 聞き: 5月までって、長期戦のつもりだよね。あーし、上洛説のほうがありそうだと思うけどなあ。
  - 語り: 一方、局地戦説は、長年の徳川との戦いの延長で、遠江を取るのが主目的だと見ます。上洛は、宣伝にすぎなかったという立場です。
  - 聞き: 同じ手紙で読み方が割れるとか、マジ？ 決め手はないの？
    tone: 疑問
  - 語り: 決め手になりそうな『甲陽軍鑑』は、史料としての価値に疑問があります。信長の動きと合わない記述があるからです。画面は、1561年の川中島の戦いの絵です。
    background:
      image: paintings/mikata_kawanakajima_screen_1845.jpg
      credit: 《信州川中嶋合戦之図》1845年ごろ
    card:
      head: 『甲陽軍鑑』
      body: 史料としての価値に疑問
  - 聞き: 武田側の本が、いちばんあてにならないって、皮肉だなあ。
  - 語り: では、信長の側を見ます。元亀3年、信長は西で浅井・朝倉と、京で将軍の足利義昭と争っていました。そこへ東から武田が加わり、三方向です。
    portrait: null
    background:
      image: paintings/oichi_odani_castle_ezu.jpg
      credit: 《小谷城跡絵図》江戸時代
    card:
      head: 元亀3年
      body: 信長は三方向に敵
  - 語り: この連携を、信長包囲網と呼びます。朝倉義景は、12月3日に、雪と疲れを理由に越前へ引き揚げました。
  - 聞き: 西にも京にも敵がいて、そこへ東から信玄か……。信長、ぎりぎりだね。
  - 語り: 信玄の進む先は、家康の領国、遠江と三河です。画面の地図は、元亀3年の暮れの戦場です。
    portrait: null
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
    card:
      head: 元亀3年の暮れ
      body: 戦場は遠江と三河
    figure:
      type: map
      title: 元亀3年暮れの戦場
      bounds:
      - 137.0
      - 138.8
      - 34.5
      - 35.9
      places:
      - - 甲府
        - 138.57
        - 35.66
      - - 二俣城
        - 137.82
        - 34.87
      - - 浜松城
        - 137.72
        - 34.71
      - - 堀江城
        - 137.61
        - 34.78
      - - 吉田城
        - 137.39
        - 34.77
      - - 岡崎城
        - 137.16
        - 34.96
      note: 武田の進軍の道すじは、研究で見直されている
  - 聞き: 信長の東の盾が、家康、ってことなんだね。信玄は、その盾をどう崩していったの？
    tone: 疑問
  - 語り: 10月14日、家康は自ら一言坂で戦い、敗走します。本多忠勝と大久保忠佐が、退く軍の後ろを守った、とされます。
    figure: null
    portrait:
      image: paintings/ieyasu_honda_tadakatsu_portrait.jpg
      caption: 本多忠勝（17世紀前半の肖像画）
      age: false
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    card:
      head: 元亀3年10月14日
      body: 一言坂の戦い、家康は敗走
  - 聞き: 本多忠勝は、のちの徳川四天王の一人だよね。このとき何歳なの？
    tone: 疑問
  - 語り: 数え25歳です。その前日の13日には、徳川方の城がひと日で落ちました。城名までは、確かめていません。武田の重臣、山県昌景の隊が、信玄の本隊と合流します。
  - 聞き: しんがりを任されるくらい、家康に頼りにされてたんだね。
  - 語り: そして12月19日、二俣城が開城します。遠江の北部は、武田のものになりました。三方ヶ原の、わずか3日前です。
    portrait: null
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
    card:
      head: 12月19日
      body: 二俣城が開城
    figure:
      type: stats
      title: 三方ヶ原までの日数
      items:
      - - 出陣から三方ヶ原
        - 約80日
        - 10月3日→12月22日
      - - 二俣城の開城から
        - 3日
        - 12月19日→22日
      - - 三方ヶ原から信玄の死
        - 約108日
        - →元亀4年4月12日
      upto: 2
  - 語り: 出陣からは約80日。旧暦は月の大小があるので、数日は前後します。
  - 聞き: 3日前に北の守りが落ちて、そのまま決戦か。約80日、ずっと押されっぱなしじゃん。家康、もう後がないよね。
  - 語り: 家康は、元亀元年に浜松城を本城にしたばかりでした。画面は現在の浜松城です。天守は1958年の再建で、家康の頃の姿ではありません。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
    background:
      image: paintings/mikata_hamamatsu_castle_tenshu_photo.jpg
      credit: Saigen Jiro 浜松城の天守（現在の写真、2020年）
    card:
      head: 元亀元年
      body: 家康が浜松城を本城に
    figure: null
  - 聞き: 引っ越してきたばかりの城で、武田に迫られたのか。
  - 語り: 数の面でも、厳しい状況でした。武田軍は約2万7千という見積もり。徳川が遠江の防衛に回せたのは、8千余です。画面は、現在の浜松城跡です。
    background:
      image: paintings/mikata_hamamatsu_castle_honmaru_photo.jpg
      credit: Saigen Jiro 浜松城跡の本丸（現在の写真、2020年）
    card:
      head: 兵の数
      body: 武田約2万7千 対 徳川8千余
  - 聞き: 2万7千と8千余か。数字だけなら、あーしでも籠城したくなるなあ。
  - 語り: ただ、何の数かが違います。総数の見積もりと、現地に回せた数なので、「約3倍」とは言い切りません。
    background:
      image: paintings/mikata_hamamatsu_hiroshige_met_dp122910.jpg
      credit: 歌川広重《東海道五十三次 はま松》1840年ごろ
  - 聞き: 数え方が違うと、比べにくいね。それでも、浜松城に籠もったんじゃないの？
    tone: 疑問
    hook: true
  - 語り: 12月22日、家康は城を出ます。理由は、5つの説に割れています。
    hook: true
- title: 12月22日 家康が浜松城を出た理由 5つに割れる説
  background:
    image: paintings/ieyasu_mikatagahara_map_1935.jpg
    credit: 《三方原役図》1935年（近代の戦史地図）
  year: 1573
  lines:
  - 語り: 12月22日。武田軍は二俣城を出て西へ進み、浜松城のすぐ北を通って、三方ヶ原の台地へ上がります。素通りでした。
    card:
      head: 12月22日
      body: 武田軍は浜松城を素通り
    short: s2
  - 聞き: 結局、城を出たんだよね。理由は、はっきりしてるの？
    tone: 疑問
    short: s2
  - 語り: 理由は、分かっていません。説は、少なくとも5つあります。以下はウィキペディアなどの紹介で、原本は確かめていません。
    short: s2
  - 語り: 1つ目。城のすぐ北を素通りされ、挑発に乗った。通説です。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
    card:
      head: 出た理由 1
      body: 挑発に乗った（通説）
    short: s2
  - 語り: 2つ目。武田が来ても籠もるだけの大将では、遠江の国衆がついてこなくなる。家臣や国衆の信頼を守るために出た、という見方です。
    background:
      image: paintings/mikata_hamamatsu_hiroshige_met_dp122910.jpg
      credit: 歌川広重《東海道五十三次 はま松》1840年ごろ
    card:
      head: 出た理由 2
      body: 国衆の信頼を守る
    short: s2
  - 聞き: 上に立つ人が動かないと、下がついてこない。会社でもあるよね。
    short: s2
  - 語り: 3つ目は、染谷光廣さんの説。武田軍が祝田の坂を下るところを狙った、一撃離脱です。祝田の坂は、三方ヶ原台地の西の坂です。
    portrait: null
    background:
      image: paintings/ieyasu_mikatagahara_map_1935.jpg
      credit: 《三方原役図》1935年（近代の戦史地図）
    card:
      head: 出た理由 3
      body: 祝田の坂で一撃離脱
  - 聞き: 坂を下るところを狙うって、待ち伏せみたいだよね。うまくいけば強そう。
  - 語り: 4つ目。戦うつもりはなく、物見の小競り合いに巻き込まれた。『当代記』などに、そうした記述がある、とされます。
    background:
      image: paintings/mikata_hamamatsu_hiroshige_1855.jpg
      credit: 歌川広重《東海道五十三次之内 浜松》1848年ごろ
    card:
      head: 出た理由 4
      body: 物見の小競り合いに巻き込まれた
  - 聞き: 戦うつもりじゃなかったのに、気づいたら本番、か。いちばん地味だけど、ありそうで怖いなあ。
  - 語り: 5つ目は、平山優さんの新説です。武田の狙いは、浜名湖のほとりの堀江城で、落とされれば、浜松城が孤立する。それを防ぐために出た、という見方です。
    background:
      image: paintings/mikata_maisaka_imagire_met.jpg
      credit: 歌川広重《東海道五十三次之内 舞坂 今切真景》1834年ごろ
    card:
      head: 出た理由 5
      body: 堀江城を守るため
  - 聞き: 城が1つ落ちると、浜松が孤立する、って読みなんだね。5つも説があるのに、決め手はないの？
    tone: 疑問
  - 語り: ありません。分かっているのは、家康が城を出たことと、結果です。出なかった道があった。それが、この回の最初の分かれ道です。
  - 聞き: 出た先で、何が待ってたの？
    tone: 疑問
    hook: true
  - 語り: 日没までの約2時間を、順に見ます。
    hook: true
- title: 三方ヶ原の約2時間 数のずれと、浜松城へ逃げ帰った夜
  background:
    image: paintings/ieyasu_mikatagahara_yoshitora_triptych.jpg
    credit: 歌川芳虎《三方ヶ原の戦い》1874年
  year: 1573
  lines:
  - 語り: 夕方、三方ヶ原に着くと、武田軍は魚鱗の陣で待っていた、とされます。徳川と織田の連合軍は、鶴翼の陣で応じました。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
    card:
      head: 12月22日の夕方
      body: 魚鱗の陣 対 鶴翼の陣
  - 語り: ただ、どちらの陣も、兵の数に対する定石とは逆の形でした。なぜそうしたのかは、確定していません。
    background:
      image: paintings/ieyasu_mikatagahara_map_1935.jpg
      credit: 《三方原役図》1935年（近代の戦史地図）
  - 聞き: どっちも逆の形で戦ったんだ。何か考えがあったのかな。
  - 語り: 織田の援軍の数も、史料でばらばらです。『織田軍記』は3千、『明智軍記』は5千。磯田道史さんの文献調査では、2万です。
    portrait: null
    card:
      head: 織田の援軍
      body: 3千から2万まで割れる
    figure:
      type: bars
      title: 織田の援軍の数（史料ごとの記述）
      bars:
      - - 『織田軍記』
        - 3000
      - - 『明智軍記』
        - 5000
      - - 『前橋酒井家旧蔵聞書』ほか
        - 20000
      labels:
      - 3,000
      - 5,000
      - 20,000
  - 聞き: 最大で7倍近い差って、もう別の戦だよ。何人いたのかも、分からないのか。
  - 語り: 戦いは、日没までの約2時間。連合軍は敗れ、徳川方の死者は、『松平記』の500から、『甲斐国志』の数千まで、史料で幅があります。画面は、現在の三方原古戦場碑です。
    background:
      image: paintings/mikata_sekihi_mikatahara_photo.jpg
      credit: Saigen Jiro 三方原古戦場碑（現在の写真、2020年）
    figure: null
  - 語り: 戦場の位置は、特定されていません。碑の向こうには、いまの建物が写っています。
  - 聞き: あの広い台地のどこかで戦ったのに、場所も決まってないの？
  - 語り: 家康は、浜松城へ逃げ帰ります。画面は、現在の浜松城跡です。この夜には有名な逸話が多いのですが、出どころが後世で、今日は使いません。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画）
      age: false
    background:
      image: paintings/mikata_hamamatsu_castle_honmaru_photo.jpg
      credit: Saigen Jiro 浜松城跡の本丸（現在の写真、2020年）
    card:
      head: この夜の逸話
      body: 出どころは後世。今日は使わない
  - 語り: もう一つ。江戸幕府がまとめた『武徳大成記』に、浜松城内で家康の戦死の噂が広まった、と書かれていると紹介されています。原本までは、確かめていません。
    background:
      image: paintings/ieyasu_hamamatsu_hiroshige_1834.jpg
      credit: 歌川広重《東海道五十三次之内 濱松 冬枯の図》1834年ごろ
    card:
      head: 戦死の噂
      body: 『武徳大成記』と紹介（二次）
  - 聞き: 噂が本当に広まってたなら、実際の夜に、もしもの入り口があったってことだよね。
    tone: しみじみ
  - 語り: そうです。ただ、家康は生きて戻りました。では、史料には、どんな別の道が残っていたのか。
    hook: true
  - 聞き: 出なかった道、だね。籠城のほかにもあったの？
    tone: 疑問
    hook: true
- title: 史料に残る別の道 籠城・織田の援軍・上杉謙信
  background:
    image: paintings/mikata_hamamatsu_hiroshige_1855.jpg
    credit: 歌川広重《東海道五十三次之内 浜松》1848年ごろ
  year: 1573
  lines:
  - 語り: 想像の前に、史料に残る別の道を、3つ見ます。当時の人が実際に考えていた選択肢だけです。1つ目。籠城して、武田軍を通す道。
    card:
      head: 別の道 1
      body: 籠城して武田軍を通す
    short: s5
  - 語り: これは、半分、起きていました。武田軍は、浜松城を素通りしたからです。家康が出なければ、あの夕方の戦は、起きなかったとも言えます。
    short: s5
  - 聞き: じゃあ、籠城が正解だったの？
    tone: 疑問
  - 語り: 河合敦さんは、籠城の利点に、浜松城の堅さと、信長の援軍、謙信の後方攪乱を挙げます。
    short: s5
  - 語り: ただ同じ筆者は、野戦以外の選択肢はなかった、とも主張します。その理由は、読めた範囲には書かれていません。
    background:
      image: paintings/mikata_totomi_kuniezu_1838.jpg
      credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
  - 聞き: 籠城にも、出陣にも、それぞれ理由があるんだね。
  - 語り: 信玄が浜松城を落とせたのかは、研究が見当たりません。目安は、一言坂から二俣城の開城まで約2か月。包囲の期間は未確認です。三河の野田城は、約500人の城に約1か月かかりました。
    short: s5
  - 聞き: 一言坂から開城まで2か月、野田城は1か月。信玄でも、城は簡単に落とせなかったんだ。
  - 語り: 2つ目。織田と連携する道です。信長は援軍を出しました。数は3千とも2万とも割れ、佐久間信盛らは早々に撤退したとも伝わります。画面は、姉川の戦いの絵です。
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
    background:
      image: paintings/nobunaga_anegawa_screen.jpg
      credit: 姉川合戦図屏風（部分、江戸時代）
    card:
      head: 別の道 2
      body: 織田の援軍
  - 語り: 11月20日、信長は上杉謙信に、武田と義絶したと伝えています。西には浅井・朝倉もいました。信長は、西にも敵を抱えたまま、援軍を出したことになります。
  - 聞き: 信長も、東と西の両方で手がいっぱいだったのか。会社でいえば、本店と支店で同時にトラブルが起きた感じかな。
  - 語り: 3つ目。上杉謙信との同盟です。家康は元亀元年の10月に、謙信と結んでいました。ただ、謙信が元亀3年の末に実際に動いたかは、今回は確かめられていません。
    portrait: null
    background:
      image: paintings/mikata_takeda_hatajirushi.jpg
      credit: 戸澤盛徳《旗印図》1800年ごろ
