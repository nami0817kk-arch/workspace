# 真田幸村＝真田信繁（A作品・10/19 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：真田信繁とは何者だったのか」）
# 冒頭の一点：「幸村」の名は後世の呼び名。信繁自筆の書状は「信繁」で、「幸村」署名の写し2通は偽文書と判明（平山優 2015、Wikipedia 経由）。
#   初出は軍記『難波戦記』（寛文12年＝1672、夏の陣の約57年後）。『桃源遺事』（1701）は「幸村は誤り」、松代藩は文化6年（1809）に幕府へ「信繁」と回答。
#   同名の武田信繁（信玄の弟）と区別するための創作、と論じる研究者がいる（篠原幸久、Wikipedia 経由。理由は決まっていないと断る）。
#   「日本一の兵」は島津忠恒（家久）が国元に書いた言葉（『薩藩旧記雑録』）。日付は5月7日説・6月11日説で未確定、宛先は「国元」だけ、
#   丸島和洋の解説では「皆この話ばかり」とあるので他の大名の言葉の可能性もある（答えは第9節、まとめで冒頭の問いに戻る）。
# 信玄の回（10/18）の次回予告「砥石城を取った幸隆の孫、幸村。その像も、後の本が作ったのか」に応える：幸隆の砥石城（天文20年5月26日、『高白斎記』）を第2節で言い、像は三つの層（まとめ）で答える。
# 事実の出どころは dev/output/rekishi-chiso/research/sanada_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/sanada_assets.md。
# 決まり：①日付は和暦で言う。西暦は年表・card の年（year:）と、『難波戦記』の1672年・『桃源遺事』の1701年・松代藩の1809年だけ。「西暦だと」とは言わない。
#   ②年齢は数え。生年が割れる（永禄10年1567／元亀元年1570／元亀3年1572）ので、信繁の「この時○歳」は出さない（age: false）。年齢を言うのは最期の49歳（説）と信之93歳・昌幸65歳（67とも）だけ。
#   ③使わない話（入れない）：九度山の村人を酔い潰した脱出・抜け穴・真田紐を売って暮らした（出す場合は「俗説」と断る）／家康の空城・脱糞の話／十勇士の個々の活躍／
#     信繁の首の扱い・遺体・血・首の絵／大助の最期の細部／豊臣秀頼・淀殿の自害の描写（日付だけ）／ドラマ『真田丸』『真田太平記』・小説・ネットの個人ブログの場面／
#     「真田日本一の兵」を島津個人の評と断定／真田丸を信繁の築造と断定（「築いたとされる」まで）／夏の陣の家康が逃げた・自害を覚悟したを事実として／「信濃一国」を事実として。
#   ④後世の話（出典名を言う）：幸村の名（難波戦記）・小松姫の開門拒否・犬伏の「家を二つに割る策」・籠城反対の策（幕末〜明治に編まれた『名将言行録』）・九度山の暮らしの描写（『真武内伝追加』）・
#     真田紐（『安斎随筆』）・十勇士（立川文庫）・薩摩落ち・六文銭の旗・赤備え（『大坂御陣山口休庵咄』）。ウィキペディア経由の情報は「ウィキペディアの整理では」と断る。
#     『高山公実録』『三河物語』『薩藩旧記』『細川家記』『駿府記』『高白斎記』の本文は未読。
#   ⑤数字は何の数かを言い、割れていれば割れていると言う：上田合戦の兵（真田1,200〜2,000／徳川約7,000）・徳川の死者（約300／約1,300）・秀忠軍約3万8,000・真田丸の被害は言い切らない・享年49/46/44。
#   ⑥人物のセリフは入れない（島津の書状は「趣旨」）。⑦背景に人物の肖像・拡大絵を使わない。NDL 系は trimmed copy だけ。血・遺体・首・切腹の絵は使わない（夏の陣屏風は detail で人の少ない所だけ）。
#   ⑧現代の写真は「現在の〜」とその行で断る。真田丸の復元図・ジオラマは使わない。
#   読みの注意：真田信繁＝さなだのぶしげ／昌幸＝まさゆき／信之＝のぶゆき／信幸＝のぶゆき／幸隆＝ゆきたか／小松姫＝こまつひめ／大谷吉継＝おおたによしつぐ／竹林院＝ちくりんいん／馬廻衆＝うままわりしゅう／
#     上田＝うえだ／砥石＝といし／戸石＝といし／神川＝かんがわ／沼田＝ぬまた／犬伏＝いぬぶし／九度山＝くどやま／蓮華定院＝れんげじょういん／浅野幸長＝あさのよしなが／好白＝こうはく／
#     真田丸＝さなだまる／惣構え＝そうがまえ／明星学園＝みょうじょうがくえん／天王寺＝てんのうじ／道明寺＝どうみょうじ／誉田＝こんだ／後藤基次＝ごとうもとつぐ／毛利勝永＝もうりかつなが／
#     長宗我部盛親＝ちょうそかべもりちか／明石全登＝あかしたけのり／前田利常＝まえだとしつね／井伊直孝＝いいなおたか／松平忠直＝まつだいらただなお／真田信尹＝さなだのぶただ／
#     高山公実録＝こうざんこうじつろく／三河物語＝みかわものがたり／薩藩旧記雑録＝さっぱんきゅうきざつろく／細川忠興＝ほそかわただおき／難波戦記＝なにわせんき／桃源遺事＝とうげんいじ／立川文庫＝たつかわぶんこ／
#     西尾宗次＝にしおむねつぐ／安居神社＝やすいじんじゃ／片倉重長＝かたくらしげなが／島津忠恒＝しまづただつね／松代＝まつしろ／大助＝だいすけ／阿梅＝おうめ／
