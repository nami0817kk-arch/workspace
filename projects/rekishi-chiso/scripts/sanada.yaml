en:
  title: "Sanada Yukimura (Nobushige): The Name 'Yukimura' Does Not Appear in His Own Letters"
  description: |-
    "Sanada Yukimura" is the name everyone knows, but the man himself signed his letters "Nobushige". According to Wikipedia's summary, two copies of letters signed "Yukimura" turned out to be forgeries. The name first appears in the war tale Naniwa Senki of 1672, about 57 years after the Summer Siege of Osaka. The famous phrase "the best warrior in Japan" comes from a letter by Shimazu Tadatsune (Iehisa) to his home domain; its date and addressee are not settled, and one commentator notes that it may repeat what other lords were saying.
    This video digs into Nobushige's life from his grandfather Yukitaka's capture of Toishi Castle to his death in 1615, and separates what records show from what later books say: the year of his birth (three different years are given), the First Ueda campaign of 1585 where Nobushige's presence is not confirmed, the Second Ueda campaign of 1600 and the real reason Tokugawa Hidetada was late for Sekigahara, about fourteen years of exile at Kudoyama, the fort later called Sanada-maru (nobody knows when it got that name), the charge at Tennoji and Okayama in 1615 with its records of Ieyasu's camp in disarray, two competing places for his death, and the Sanada Ten Braves, who were invented in the late Meiji era by lecture-book publishers.
    We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1615: The Name 'Yukimura' and Three Layers of Sources"
    - "1567?: Born Into the Sanada Family, Grandfather Yukitaka and Father Masayuki"
    - "1585: The First Ueda Campaign, and Where Was Nobushige?"
    - "1594: Sayemon-no-suke, and Life in Hideyoshi's Osaka"
    - "1600: The Parting at Inubushi and the Second Ueda Campaign"
    - "1600: Fourteen Years of Exile at Kudoyama"
    - "1614: Entering Osaka Castle and the Fort Later Called Sanada-maru"
    - "1615: The Summer Siege of Osaka and Two Places of His Death"
    - "1615: The 'Best Warrior in Japan' Letter and the Sanada Family Afterwards"
    - "Summary: Who Was Sanada Nobushige?"

