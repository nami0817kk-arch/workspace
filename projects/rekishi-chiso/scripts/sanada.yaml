terms:
  調略: 戦わずに敵の中の人を味方につける手
  軍記: 戦いを物語の形で書いた本。江戸時代に多く作られた
  左衛門佐: 朝廷から与えられる官職の名
  馬廻衆: 大将の身近にいて、護衛や使いをする家来
  浪人: 仕える主人を失った武士
  出丸: 城の本体から離れた場所に築く、守りの砦
  惣構え: 城下町までを囲む、大きな堀と土塁
  しんがり: 退くときに最後尾で追手を防ぐ役目
  大坂五人衆: 大坂の陣で豊臣方に入った、有力な浪人5人
  立川文庫: 明治44年から出た講談の文庫本。十勇士で知られる

