  # ================================================================ 第4章 秋の手がかり（食い違い2）
  - title: ザクロ、ワインの甕、1枚の銀貨　秋の手がかり
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 79
    lines:
      # fact: pom-28
      - 語り: ロジーニが挙げたのは、ザクロ、クリ、干したイチジク、干しブドウ、松かさ、ナツメヤシの実。それに、床の敷物と、家々の火鉢でした。
      # fact: pom-30
      - 語り: 1879年には、ポンペイの発掘の責任者が、ブドウの収穫の跡と、秋に実る月桂樹の実を、加えました。
      # fact: pom-31
      - 語り: ポンペイの西、オプロンティスの建物では、炭になったザクロと、干し草と、クルミが、山になって見つかっています。
        card: {head: "オプロンティス", body: "炭になったザクロとクルミ"}
      # fact: pom-31
      - 語り: 1990年の研究は、オプロンティスの発掘から、ブドウやザクロなど、秋の果物の跡と、犠牲者の厚手の服を、挙げました。
      # fact: pom-45
      - 語り: 反論もあります。干した果物は、何か月も保つので、前の年の実りかもしれない。厚い毛織りの服は、降ってくる熱い石から、身を守るために着たのかもしれない。
      # fact: pom-74
      - 語り: 実際、ポンペイ周辺の出土品には、夏の桃の種と、秋のクリが、どちらも見つかっています。
      # fact: pom-32
      - 語り: ボスコレアーレの農園の建物では、ワインで満たされ、封をされた、大きな甕が見つかりました。
      # fact: pom-32
      - 語り: 2001年から2002年の論文は、これを、ブドウの搾りが、もう済んでいた印だ、と読みました。
      # fact: pom-33, pom-45
      - 語り: これにも、長く寝かせるワインだったかもしれない、という見方があります。火鉢も、暖めるだけでなく、料理にも使います。
      # fact: pom-38
      - 語り: 火山学からの手がかりもあります。79年の軽石と灰は、南東へ流れて、積もりました。
      # fact: pom-38
      - 語り: ヴェスヴィオの、過去2万5千年の、8回の大きな噴火のうち、南東へ積もったのは、2回だけ。ほかの6回は、東北東です。
      # fact: pom-39
      - 語り: ロランディらは、空の高い所の風を集めて、夏は西向き、秋から冬は東寄りの向きが多い、と示しました。夏の風では、南東へは流れにくい、という論です。
      # fact: pom-40
      - 語り: もっとも、1985年のシグルドソンらは、8月24日のまま、風が夏から秋の向きに変わる時期だった、と説明していました。
      # fact: pom-34
      - 語り: そして、いちばん重い手がかりとされたのが、1枚の銀貨です。黄金の腕輪の家で、逃げた人が持っていたお金の中から、見つかりました。
      # fact: pom-34, pom-36
      - 語り: 皇帝ティトゥスの銀貨です。ステファーニらは、2006年の報告で、この銀貨に、15回目の皇帝歓呼が刻まれている、としました。
        card: {head: "ティトゥスの銀貨", body: "15回目の皇帝歓呼？"}
      # fact: pom-36
      - 語り: 皇帝歓呼は、勝利のたびに数が増える、皇帝の称号です。79年9月7日付の手紙と、9月8日付の兵の除隊証書で、ティトゥスは、まだ14回目を名乗っています。
      # fact: pom-36
      - 語り: 15回目の銀貨が、ポンペイにあったのなら、噴火は、9月8日よりあと。8月24日は、ありえない。そういう論法でした。
        tone: 重い
      # fact: pom-37, pom-71
      - 語り: ところが、2013年、大英博物館のリチャード・アブディは、傷んだこの銀貨を、よく残った同じ型と比べて、14回目の型に近い、と読み直しました。
      # fact: pom-37
      - 語り: 2026年の論文は、皇帝になってから付く、国父の文字が見えない点も挙げ、この銀貨は、8月説を、肯定も否定もできない、と結論しています。
        figure: {type: table, title: 秋の手がかりと、その反論, cols: [秋説の読み, 反論], rows: [[秋の果物, 秋に採れる実がある, 干した実は前の年の物かも], [封をした甕, 搾りが済んでいた, 長く寝かせるワインかも], [厚い服と火鉢, 寒い季節だった, 火鉢は料理にも使う], [銀貨, 15回目の皇帝歓呼, 14回目の型に近い]], upto: 4}
      - 語り: 手がかりは、どれも、決め手にならない。そこへ、2018年、壁に書かれた日付が、現れます。
        figure: null
        hook: true

  # ================================================================ 第5章 2018年の炭の落書き（食い違い3）
  - title: 10月17日　2018年の炭の落書き
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 2018
    lines:
      # fact: pom-56
