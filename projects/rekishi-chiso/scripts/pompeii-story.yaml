      # fact: pom-28
      - 語り: ロジーニは、発掘で見つかった、ザクロや、クリや、干したイチジクを根拠に挙げた、と紹介されます。
      # fact: pom-28, pom-18
      - 語り: そして、月の抜けた写本は、12月のカレンダエの9日前、と読むべきだ、と考えました。数えると、11月23日です。写本にある読みではなく、ロジーニの推測でした。
      # fact: pom-19
