sections:
  # ================================================================ 序章。答えの席：8月か、10月か
  - title: 年の書かれていない日付　79年8月24日
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 79
    lines:
      - 語り: ポンペイが、火山の噴火で埋もれた日。広く知られているのは、西暦79年、《8月24日》です。
        tone: 重い
      # fact: pom-42
      - 語り: ところが2018年。そのポンペイの家の壁から、炭で書いた日付が、見つかりました。10月17日。
        tone: 重い
      # fact: pom-42
      - 語り: 噴火で埋もれたはずの家に、8月24日から数えて、54日あとにあたる日付が、残っていたのです。
      # fact: pom-06
      - 語り: しかも、8月24日を書き残した手紙には、79年という年が、どこにも書かれていません。
        tone: 重い
      # fact: pom-66
      - 語り: そして2024年。遺跡を管理する考古公園は、炭の字がどれだけもつのかを、自分たちで試しました。
      - 語り: 噴火は、本当に、8月24日だったのか。
        tone: 疑問
        pause: 0.8
      # fact: pom-03, pom-05
      - 語り: 日付を書き残したのは、噴火を見た17歳の若者が、のちに、歴史家タキトゥスに書いた手紙です。
      - 語り: 答えの手がかりは、その若者が見た、1つの雲から始まります。
        hook: true

  # ================================================================ 第1章 手紙の記録
  - title: 17歳が見た雲　小プリニウスの手紙
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 79
    lines:
      # fact: pom-03
      - 語り: 手紙を頼んだのは、歴史家のタキトゥスです。伯父の最期を書いてほしい、後の世に、より正しく伝えられるように、と。
      # fact: pom-04
      - 語り: 若者の名は、小プリニウス。手紙を書いたのは、噴火から27年か28年あとの、107年ごろと推定されています。
      # fact: pom-07
      - 語り: 伯父の名は、大プリニウス。博物誌を書いた学者で、このとき、ナポリ湾の岬の港ミセヌムで、ローマの艦隊を率いていました。
      # fact: pom-11
      - 語り: 甥の小プリニウスは、自分は《18年目》を生きていた、と記しました。満で数えると、17歳です。
      # fact: pom-05
      - 語り: 手紙は、その日のことを、ラテン語で、こう書きます。9月のカレンダエの、9日前。
        figure: {type: table, title: 手紙の日付の句（書簡集6.16）, cols: [原文, 意味], rows: [[日, nonum Kal. Septembres, 9月のカレンダエの9日前], [時刻, hora fere septima, ほぼ第7時（正午すぎ）]], upto: 1}
      # fact: pom-05
      - 語り: 時刻は、ほぼ第7時。今の、正午すぎです。
        figure: {type: table, title: 手紙の日付の句（書簡集6.16）, cols: [原文, 意味], rows: [[日, nonum Kal. Septembres, 9月のカレンダエの9日前], [時刻, hora fere septima, ほぼ第7時（正午すぎ）]], upto: 2}
      # fact: pom-14
      - 語り: カレンダエは、月のついたち。ローマ式では、9月1日を1つ目、8月31日を2つ目と、前の日へ数えていきます。
        figure: {type: table, title: ローマ式の数え方, cols: [日付, 意味], rows: [[1つ目, 9月1日, カレンダエ], [2つ目, 8月31日, 1日前へ], [9つ目, 8月24日, 手紙の日付]], upto: 2}
      # fact: pom-14
      - 語り: すると、9つ目が、8月24日。ふつうに引き算するより、1日ずれます。これが、8月24日の出どころです。
        figure: {type: table, title: ローマ式の数え方, cols: [日付, 意味], rows: [[1つ目, 9月1日, カレンダエ], [2つ目, 8月31日, 1日前へ], [9つ目, 8月24日, 手紙の日付]], upto: 3}
      # fact: pom-05
      - 語り: その時刻、母が伯父に、見慣れない大きさと形の雲が出ている、と知らせました。
        figure: null
      # fact: pom-07
      - 語り: 雲の形は、どの木よりも、松に似ていた。高い幹のように伸びて、上で枝のように広がった、と。
      # fact: pom-07
      - 語り: ミセヌムからでは、どの山の雲か、分かりませんでした。ヴェスヴィオだと分かったのは、あとのことです。
      # fact: pom-49
      - 語り: 高い噴煙の柱を立てる噴火は、今、プリニー式噴火と呼ばれます。名前は、この手紙を書いた、小プリニウスから来ています。
      # fact: pom-08
      - 語り: 伯父は、学者として、近くで見ようと、速い船を用意させます。
      # fact: pom-08
      - 語り: そこへ、山のふもとに住むレクティナという女性から、助けを求める書きつけが届きました。伯父は、見物を、救助に切り替えます。
        tone: 重い
      # fact: pom-09
      - 語り: 浜に近づけず、舵取りが引き返そうと言いました。湾の向こう側、スタビアエには、ポンポニアヌスという人がいました。
      # fact: pom-09
      - 語り: 伯父は、こう答えた、と手紙は記します。勇者には、運が味方する。ポンポニアヌスのところへ向かえ。
        tone: 重い
      # fact: pom-10
      - 語り: 夜が明けるはずの時刻になっても、あたりは、真っ暗でした。人々は、降ってくる石から身を守るため、枕を頭に、布で結びつけて、外へ出ました。
      # fact: pom-10
      - 語り: 伯父は、立ち上がって、すぐに倒れました。濃い煙で息が詰まったのだろう、と甥は推し量っています。
        tone: 重い
      # fact: pom-10
      - 語り: 体が見つかったのは、伯父が最後に見た日から数えて、3日目。傷もなく、服を着たままでした。
      # fact: pom-12
      - 語り: もう1通の手紙には、噴火の前に、何日も地震が続いていた、とあります。
      # fact: pom-12
      - 語り: カンパニアでは、よくあることなので、それほど恐れられていなかった、と。
      # fact: pom-13
      - 語り: 手紙の終わりで、小プリニウスは、こう断っています。手紙と、歴史は、別物です。どこを使うかは、あなたが決めてください。
      - 語り: 噴火の日付は、手紙の、たった1か所。その1か所をもとに、噴火の日は、決められてきました。
        hook: true

  # ================================================================ 第2章 噴火の流れ（短く）
  - title: 79年、正午から翌朝まで　ヴェスヴィオの噴火
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 79
    lines:
      # fact: pom-50
      - 語り: 火山学者のシグルドソンらは、1985年、手紙の第7時と、地層の調べから、噴火の始まりを、正午すぎと置きました。
      # fact: pom-51
      - 語り: 噴煙の柱は、最初の白い軽石の時期で、約25キロ。のちには30キロを超えた、とされます。マグマを噴く段階は、約18時間、続きました。
        card: {head: "噴煙の柱（最初の時期）", body: "約25km"}
      # fact: pom-50, pom-52
      - 語り: ポンペイには、白い軽石が、約7時間。軽石の降る段階で、町は、約3メートルの噴出物に、埋まりました。
      # fact: pom-50, pom-51
      - 語り: 柱が崩れると、熱いガスと灰が、斜面を流れ下ります。火砕流です。最初に届いたのは、海辺の町ヘルクラネウムでした。
        tone: 重い
      # fact: pom-50
      - 語り: ポンペイに届いたのは、翌朝の、午前7時ごろ、と推定されています。
        figure: {type: table, title: 噴火の流れ（従来の推定）, cols: [時刻, 起きたこと], rows: [[1日目, 正午すぎ, 噴火が始まる], [1日目, 午後から夜, 白い軽石が約7時間], [2日目, 午前7時より前, 火砕流がヘルクラネウムへ], [2日目, 午前7時ごろ, 火砕流がポンペイへ]], upto: 4}
      # fact: pom-52
      - 語り: ポンペイで見つかった犠牲者は、1,150人。
        figure: null
      # fact: pom-53
      - 語り: ヘルクラネウムでは、1980年代、海辺の舟小屋から、約300人が見つかりました。舟小屋に、逃げ込んだ人々でした。
        tone: 重い
      - 語り: 噴火で亡くなった方々を悼みながら、記録を、たどります。
        tone: しみじみ
        pause: 0.8
      - 語り: この流れは、8月24日と25日の出来事として、語られてきました。では、その日付は、どこまで確かなのか。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 写本の日付（食い違い1）
  - title: 8月か、11月か　写本が伝えた日付
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 79
    lines:
      # fact: pom-06
      - 語り: 日付が出てくるのは、噴火を書いた2通のうち、伯父の最期を書いた1通だけです。そこに、年も、皇帝の名も、ありません。
      # fact: pom-23
      - 語り: 79年という年は、別の記録から来ています。伝記作家スエトニウスによれば、皇帝ティトゥスが、父の死で帝位を継いだのは、79年の6月。
      # fact: pom-23
      - 語り: 歴史家のディオは、噴火を、ティトゥスの治世に置き、ローマの大きな火事を、その翌年の出来事として書いています。こうした記録を合わせて、噴火は79年とされています。
      # fact: pom-22
      - 語り: ディオは、季節も書いています。ディオの本は、11世紀の要約で伝わっていて、そのギリシア語は、秋を指す言葉。ローブ叢書の英訳は、これを、夏のまさに終わり、と訳しています。
      # fact: pom-22
      - 語り: 当時の秋は、8月の初めからと数えることが多かった、という見方もあります。
      # fact: pom-22
      - 語り: もっとも、ディオは、噴火から130年ほどあとの人です。
      # fact: pom-26
      - 語り: 手紙そのものは、印刷が生まれる前、何百年も、手で書き写されて伝わりました。それが、写本です。
      # fact: pom-15
      - 語り: 今ある、いちばん古い、ほぼ完全な写本は、9世紀に、今のドイツにあるフルダで書かれ、今は、フィレンツェの図書館にあります。
      # fact: pom-15
      - 語り: この写本は、9月のカレンダエの9日前。8月24日と読めます。1508年に刷られた、有名な版も、9月の読みです。
        card: {head: "9世紀の写本", body: "9月1日の9日前＝8月24日"}
      # fact: pom-16
      - 語り: ところが、ほかの写本と、古い時代に刷られた本には、違う読みがあります。月の名が抜けて、9日前、としか書いていないもの。
      # fact: pom-17
      - 語り: 1474年ごろと、1490年ごろから1506年ごろに刷られた本には、11月のカレンダエ、つまり、11月1日と書くものがあります。
      # fact: pom-16
      - 語り: さらに、今は失われた、ただ1つの写本は、11月3日に当たる読みだった、とされます。
      # fact: pom-28
