        figure: {type: table, title: 11月1日から数える, cols: [日付, 意味], rows: [[1つ目, 11月1日, カレンダエ], [2つ目, 10月31日, 1日前へ], [9つ目, 10月24日, 秋説の日付]], upto: 3}
