      # fact: pom-62
      - 語り: 日本でも、翌日、CNNの日本語版が、噴火の日の論争に決着か、と伝えました。
      # fact: pom-60
      - 語り: 日付のあとの言葉は、最初、度を越して食べた、と読まれました。
      # fact: pom-60, pom-61
      - 語り: のちに、ピサの、古い文字の研究者が、油の貯蔵室から取り出した、と読み、オザンナも、有力な読みとして、受け入れました。
      # fact: pom-41
      - 語り: 2022年、イタリアの国立地球物理学火山学研究所は、論文を発表しました。いちばん有力な日は、10月24日から25日。
        card: {head: "2022年の研究所の発表", body: "10月24〜25日が有力"}
      # fact: pom-41
      - 語り: 炭の字を、根拠の1つに挙げています。
      # fact: pom-57
      - 語り: でも、この炭の字には、月と日しか、書かれていません。《年》が、ないのです。
        tone: 重い
      # fact: pom-57, pom-06
      - 語り: 年の書かれていない手紙を、年の書かれていない落書きが、くつがえそうとしていました。
