      - 語り: もし、この字が、前の年の10月に書かれていたら。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 考古公園が自分で試した
  - title: 2024年　考古公園は、炭の字を試した
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "AI生成の想像画"}
    year: 2024
    lines:
      # fact: pom-66
      - 語り: 考古公園は、炭の字がどれだけもつのかを、試しました。2023年の秋、同じ壁に、新しく、炭で字を書いたのです。
      # fact: pom-66
      - 語り: 約10か月後の、2024年8月。字は、書いたときと、ほとんど同じように、読めました。
        card: {head: "炭の字の試し", body: "10か月後も読めた"}
      # fact: pom-43
      - 語り: 78年の10月17日から、79年の8月24日までは、311日。約10か月です。炭の字が、噴火の前の年に書かれた可能性も、捨てられません。
      # fact: pom-65, pom-43
      - 語り: 2024年12月12日。考古公園は、自分たちの雑誌、Eジャーナルの27号に、所長のガブリエル・ツフトリーゲルらの論文を載せました。
      # fact: pom-65
      - 語り: 結論は、今のところ、8月24日を捨てる、十分な材料は無い。
        tone: 重い
      # fact: pom-69, pom-21
      - 語り: 論文は、最も古い写本の系統は、そろって、9月の読みだ、と整理しました。
      # fact: pom-68
      - 語り: ただ、ツフトリーゲルは、それより前の2024年の夏、SNSで、こうも書いています。必ず8月24日だった、という意味ではない。
      # fact: pom-21
      - 語り: 論文では、小プリニウスが、間違えた可能性にも、触れています。
      # fact: pom-44
      - 語り: 2026年1月のナショナル ジオグラフィックは、考古公園のサイトが、8月24日以外の日付は、作りものだ、とまで書いている、と伝えました。
      # fact: pom-75
      - 語り: 2025年11月には、噴火の日付だけを話し合う、国際会議が開かれました。8月を唱える研究者も、9月から11月を唱える研究者も、いました。
      # fact: pom-76
      - 語り: 同じころ、スペインの大学の班は、犠牲者14人の服の跡を調べ、多くが厚い毛織りの服を重ねていた、と報告しました。論文になる前の報告で、日付の決め手ではない、とされます。
      # fact: pom-47, pom-77
      - 語り: そして2026年9月。カリフォルニア大学バークレー校などの研究班は、軽石の中の鉱物を、カリウムが崩れてできる、アルゴンという気体の量で測りました。
      # fact: pom-47
      - 語り: 結果は、2025年から数えて、1,938年前。誤差は、前後に13年です。西暦にすると、74年から100年のあいだで、79年を含みます。
        card: {head: "2026年の年代測定", body: "1,938年前（前後13年）"}
      # fact: pom-77
      - 語り: ただ、この測り方では、月までは分かりません。論文は、物差しを確かめるために、記録を調べ直し、8月24日を、前後2か月の幅をとって、使いました。
      - 語り: では、ここまでの記録から、何が言えるのでしょうか。
        tone: 疑問
        hook: true

