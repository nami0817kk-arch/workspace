      - 語り: 火山学者ロランディらの、2007年の論文は、この日付をとりました。
        figure: null
      # fact: pom-19
      - 語り: ただ、この形は、どの写本にも、そのままでは、ありません。著者たち自身が、11月という読みと、9日前という読みを、合わせた形だ、と書いています。
        tone: 重い
      # fact: pom-20
      - 語り: アメリカの古典学者、ペダー・フォスは、2022年の本で、写本の伝わり方の中に、8月24日に代わる、有効な日付は無い、と結論しました。
