# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。ポンペイの噴火はいつだったのか（79年・小プリニウスの手紙〜2026年の研究）。2026-11-20 作成。公開の予定は 11/26 19:00。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（世界史・古代ローマ）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「噴火は本当に8月24日だったのか」。答えの席＝8月か10月か（題名では言い切らない）。
#   冒頭＝誰でも知る一点（広く知られた79年8月24日）→2018年、埋もれた家の壁に噴火の54日あとの日付（pom-42）→その手紙には79年が書いていない（pom-06）→2024年、公園が炭の字のもちを試した（pom-66）→問い。
#   型の作り：序章 謎／第1章 17歳が見た雲（手紙）／第2章 噴火の流れ（短く）／第3章 写本の日付（食い違い1）／第4章 秋の手がかり（食い違い2）／第5章 2018年の落書き（食い違い3）／第6章 公園が自分で確かめた／まとめ 言えること・言えないこと。
# 記録の食い違い：①写本の月（9月の前の8月24日／月なし／11月1日／11月3日、10月24日はどの写本にもそのままは無い）②発掘物の読み（果物・甕・服・硬貨の XV か XIIII か）③落書きの年（79年か78年か）。
# 計算（自分で計算し直した）：ローマ暦は基準の日も数えて逆に数える。9月1日を1日目として9日目＝8月24日（9月1日・8月31〜24日）／11月1日の9日前＝10月24日／11月1日の16日前＝10月17日（11月1日・10月31〜17日で16日）／
#   7月1日の9日前＝6月23日（ウェスパシアヌスの死）／8月24日→10月17日＝7+30+17＝54日／10月17日→10月24日＝7日／78年10月17日→79年8月24日＝311日（約10か月）／8月24日→10月24日＝61日（約2か月）／
#   手紙は106年末〜107年初め＝噴火から27〜28年／2026−107＝1919年（「1900年あまり」）／1797年→2018年＝221年／1929年→2024年＝95年／ディオ（200年代前半）＝噴火から約150年後／
#   2025年から1,938±13年前＝西暦87年±13（74〜100年）、2025−79＝1,946年／394＋650＝1,044／大プリニウス「56年目」＝満55歳、小プリニウス「18年目」＝満17歳。
# 事実は事実カード（dev/output/rekishi-chiso/research/ポンペイ_facts_20261120.yaml、pom-03〜pom-78）にあるものだけ。行の上に `# fact: pom-xx`。
#   使わないこと：遺体の細部・石膏型の姿・死に方の説（pom-54・pom-55）・1471年の初版（pom-27 書誌だけ）・硬貨の見つかった日と枚数（pom-35 一般記事だけ）・オザンナの慎重論（pom-67 要約どうしが割れる）・10月24日説の起こりの人名の断定（pom-70 割れる）・会議の場所（pom-75 割れる）。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
# 広告の配慮：死は「亡くなった」。噴火の場面は記録の言葉と数字で淡々と。石膏型は映さない。
