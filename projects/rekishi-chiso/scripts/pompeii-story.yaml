# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  ポンペイが火山灰に埋もれた日は、西暦79年8月24日とされています。ところが、この日付を書き残した小プリニウスの手紙には、79年という年が、どこにも書かれていません。
  しかも、手紙の写本によって、月の読みが違います。2018年には、ポンペイの家の壁から、炭で書いた「10月17日」が見つかり、噴火は10月だという説が強まりました。
  ところが2024年、ポンペイ考古公園は、炭の字がどれだけもつのかを、自分たちで試しました。
  手紙、写本、秋の実り、1枚の銀貨、壁の落書き。記録を並べて、言えることと、言えないことを分けました。
  この動画でわかること
  ・17歳の小プリニウスが、手紙に書いた噴火の一日
  ・「8月24日」が、写本の中でどう読まれてきたか
  ・ザクロ、ワインの甕、厚着、銀貨。秋の噴火の手がかりと、その反論
  ・2018年の炭の落書き「10月17日」と、書かれていない年
  ・2024年に考古公園が出した答えと、2026年の研究
description_note: |-
  ローマの日付（「9月1日の9日前」など）の換算、日数・年数の差は、記録から自分で計算し直したものです。
  手紙の原文（ラテン語）・写本の読み・発掘と研究の報告は、原文・論文・考古公園と研究機関の発表・報道で確かめました。考古公園の2024年の論文（E-Journal 27号）の本文は開けず、報道と、論文を引く研究者の文章で確かめています。
  噴火の場面は、手紙の記録と火山学の研究の数字で語っています。犠牲になった方々の姿は映していません。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Pompeii: Did Vesuvius Really Erupt on August 24? A 1,900-Year-Old Letter and a Charcoal Scrawl"
  description: |-
    Pompeii was buried on August 24, AD 79, or so we are taught. Yet the letter that gives this date, written by Pliny the Younger, never mentions the year 79.
    The manuscripts disagree on the month. In 2018 a charcoal inscription dated "October 17" was found on a wall in Pompeii, and the autumn date gained ground.
    Then in 2024 the Pompeii Archaeological Park tested how long charcoal writing really lasts.
    In this video you will learn:
    - What 17-year-old Pliny wrote about the day of the eruption
    - How the date "August 24" was read in the manuscripts
    - Pomegranates, sealed wine jars, heavy clothing and a silver coin: the autumn clues and the objections
    - The charcoal scrawl of "October 17" and the year it does not give
    - What the park concluded in 2024 and what a 2026 study used
    Roman dates and day counts were recalculated from the sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "Prologue: A Date Without a Year"
    - "The Cloud a 17-Year-Old Saw: Pliny's Letters"
    - "From Noon to Morning: The Eruption"
    - "August or November? The Manuscripts"
    - "Pomegranates, Wine Jars and a Coin: The Autumn Clues"
    - "October 17: The Charcoal Scrawl of 2018"
    - "2024: The Park Tests the Charcoal"
    - "Summary: What Can Be Said"

