      # fact: pom-58
      - 語り: その部屋は、改装の途中。ほかの部屋は、もう仕上がっていました。
        figure: null
      # fact: pom-58
      - 語り: 考古公園は、炭の字は壊れやすく、長くはもたない、と考えました。
      # fact: pom-58
      - 語り: だから、79年の10月、噴火の1週間前に書かれた可能性が高い。噴火は10月24日だった、という説を後押しする、と発表しました。
      # fact: pom-73
      - 語り: 文化大臣は、謙虚な気持ちで、今日、私たちは歴史を書き換えている、と述べました。
