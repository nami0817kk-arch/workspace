# 物語完結型ショート 勝海舟 s2（2026-11-12）。本編 scripts/kaishu-story.yaml（11/14 19:00 公開、https://youtu.be/KIXtgjggYl0）から。11/15 に予約。
# 形式は inou_s1.yaml・saigo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/勝海舟_facts_20261111.yaml）と本編の # fact: だけ。
# 絵は本編の AI 絵（out/story/kaishu/main。勝は後ろ姿・斜め後ろ・手元）と実在の絵（パブリックドメイン）。新しい絵は作らない。
# 切り口：福沢諭吉『痩我慢の説』と海舟の答書（本編第6章）。草稿の「2、3人の親友」と送付先、新聞掲載が海舟の死の712日後、海舟は載った形では読んでいない。
# 計算：1899-01-19→1901-01-01＝712日／1901-01-01→福沢没 1901-02-03＝33日（本編と同じ。C07）。
# 理解テスト4問：①福沢諭吉『痩我慢の説』と勝海舟 ②1892年2月6日の海舟の答書（行蔵は我に存す）と、福沢の「2、3人の親友のほか見せない」の追伸 ③写しは海舟・榎本のほか3人に送られ、新聞に渡った。掲載は1901年1月1日、海舟の死の712日後 ④海舟は載った形では読めず、福沢も33日後に亡くなった
# 本編の弱点：「2、3人の親友」と「3人」を食い違いとは言わない（C03 は数が合わないとするが、受け取り手の数え方が不明）。事実だけ並べる。栗本経由の流出は慶應の解題（probably 1894）。
title: "勝海舟｜福沢の批判を、海舟は新聞で読めなかった"
yt_title: "勝海舟は福沢諭吉の『痩我慢の説』を新聞で読めなかった　掲載は海舟の死の712日後"
description: |-
  福沢諭吉が勝海舟を批判した『痩我慢の説』。海舟は1892年2月6日付の答書で、「行蔵は我に存す、毀誉は他人の主張」と返しました。
  福沢は手紙の追伸に、草稿は2、3人の親友のほかには見せていない、と書きましたが、慶應義塾の解題によると、写しは海舟と榎本武揚のほか、木村芥舟・栗本鋤雲・徳川頼倫にも送られました。栗本を通じて『奥羽日日新聞』に渡り、1894年ごろ、名を伏せて載ったとされます（時期は不明）。
  『時事新報』に初めて載ったのは1901年1月1日と3日。海舟の死（1899年1月19日）の712日後で、福沢は2月3日に亡くなりました。日付は慶應義塾の解題と飯田鼎の論文（1997年）で確かめています。
  では、海舟が三十年、突っ張って待った相手は誰だったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/KIXtgjggYl0
