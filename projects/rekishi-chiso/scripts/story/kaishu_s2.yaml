lines:
  # fact: kaishu-C09
- 語り: "福沢諭吉は、勝海舟を名指しで批判した。『痩我慢の説』。官爵を棄て、身を隠せ、と求めた。"
  shot: Katsu
  tone: 強調
  pause: 0.12
  # fact: kaishu-C01, kaishu-C02
- 語り: "1892年2月6日。海舟の答書は、批判を、慙愧に堪えない、と受けとめて、こう結ぶ。"
  shot: Letter
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-C02
- 語り: "行蔵は我に存す、毀誉は他人の主張。出るも退くも、自分で決めた。ほめるもけなすも、他人のこと。"
  shot: Hand
  tone: 重い
  pause: 0.12
  # fact: kaishu-C03
- 語り: "福沢は、追伸に書いた。草稿は、二人か三人の親友のほかには、誰にも見せていない、と。"
  shot: Night
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-C03
- 語り: "慶應義塾の解題では、写しは、海舟と榎本のほか、3人に送られていた。"
  shot: LetterL
  tone: 重い
  pause: 0.12
  # fact: kaishu-C04
- 語り: "写しは、栗本鋤雲を通じて新聞に渡り、1894年ごろ、名を伏せて載った。"
  shot: Print
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-C06, kaishu-C07
- 語り: "『時事新報』に初めて載ったのは、1901年1月1日。海舟が亡くなって、712日後だ。"
  shot: PrintR
  tone: 重い
  pause: 0.12
  # fact: kaishu-C07
- 語り: "海舟は、新聞に載った形では、読んでいない。福沢も、その33日後に亡くなった。"
  shot: Hikawa
  tone: 重い
  pause: 0.12
  # fact: kaishu-C35
- 語り: "では、海舟が、三十年、突っ張って待った相手は、誰だったのか。"
  shot: Yo13
