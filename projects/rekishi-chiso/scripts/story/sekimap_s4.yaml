title: "関ヶ原のあと｜西軍なのに無傷の家"
yt_title: "関ヶ原で西軍だった島津家は、なぜ領地を少しも削られなかったのか　家康の上京の求めに応じなかった義久"
description: |-
  九州の南の端、薩摩の島津家は、関ヶ原で西軍として戦いました。それでも、2年にわたる交渉のあと、1602年に、薩摩・大隅と日向の諸県郡の領地をそのまま認められます。1966年に鹿児島大学の紀要に出た論文によると、家臣にも処罰された者は1人もいませんでした。
  島津義久は、京へ上れという家康の求めに、病気などを理由に応じませんでした。論文は、毛利が起請文を受け取りながら領地の大半を取り上げられたことを、義久が知っていたからだろう、とみています。
  本編では、取り上げた石高の総量から、東海道の大名の行き先、毛利・上杉・佐竹のその後まで、関ヶ原の前と後の大名の地図を数字で積み上げています。本編は概要欄のリンクからどうぞ。
