  pause: 0.12
  # fact: sekimap-67
- 語り: "島津義久は、家康から京へ上れと求められても、病気などを理由に、応じなかった。"
  shot: R24_5
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-67
- 語り: "その論文は、毛利が起請文を受け取りながら、領地の大半を取り上げられたことを、義久が知っていたからだろう、とみている。"
  shot: R07_6
  tone: 重い
  pause: 0.12
  # fact: sekimap-18
- 語り: "安堵が固まったのは、1602年の12月。義久の跡を継いだ忠恒が、京へ上って、家康に会ったときだ。義久本人の上京は、最後までなかった。"
  shot: R14_7
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-18
- 語り: "熊本大学の、別の博士論文は、家康の島津への態度を、異様なまでに寛容、と書いている。"
  shot: R06_8
