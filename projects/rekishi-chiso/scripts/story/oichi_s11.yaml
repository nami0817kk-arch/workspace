# 物語完結型ショート s11（2026-10-25）。本編 scripts/oichi-story.yaml（10/26 19:00 予約）の第6章から。投稿しない（ユーザーが決める）。
# 形式は oichi_s10.yaml を写した（案Bの見出し帯・「いま」札と年表・語りそのままのブロック文字）。決まりは docs/story-shorts.md。
# 切り口：三人の娘は、大坂の陣で敵と味方に分かれた（茶々は城に、初は和議の使い、江は徳川の妻）。茶々の最期まで。想像の台詞なし。
# 理解テスト4問（語りの字だけで答えられること）：
#   ①誰の話か：お市の方（織田信長の妹）の三人の娘、茶々・初・江
#   ②いつ・どこで何が：1614〜1615年、大坂の陣。大坂城の茶々・徳川の側の江・和議の使いの初
#   ③なぜ分かれたか：嫁ぎ先が分かれた（茶々＝豊臣秀吉の妻、初＝京極高次の妻、江＝徳川秀忠の妻）
#   ④どうなったか：1615年、大坂城は落ち、茶々は城とともに最期。母と同じく夫の家の城で
# 事実の出どころ（research/oichi_facts.md 5章・oichi-story.yaml 第6章）：茶々＝秀吉の妻・1593 秀頼 [W淀]／初＝京極高次の妻・冬の陣で和議 [W初]／
#   江＝1595 秀忠の妻 [W江]／千姫は江の娘で秀頼の妻・落城の前に城を出された（Wikipedia「千姫」、oichi-story 第6章）／1615 淀殿、大坂城とともに [W淀]。母の死（1583）から大坂の陣（1614）まで31年。
title: お市の方の三人の娘｜大坂の陣で、敵と味方に
yt_title: お市の方の三人の娘は、大坂の陣で敵と味方に分かれた【茶々・初・江】
description: |-
  1583年、お市の方は北ノ庄城に残り、三人の娘だけを城の外へ送り出しました。
  長女の茶々は豊臣秀吉の妻に、次女の初は京極高次の妻に、三女の江は徳川秀忠の妻になります。
  1614年、大坂の陣。大坂城には茶々と子の秀頼、徳川の側には江、そのあいだを和議の使いとして初が行き来しました。
  1615年、大坂城は落ち、茶々は城とともに最期を迎えます。母と同じように、夫の家の城で。
