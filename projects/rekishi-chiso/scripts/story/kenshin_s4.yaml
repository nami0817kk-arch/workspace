# 物語完結型ショート 謙信 s4（2026-11-11）。本編 scripts/kenshin-story.yaml（11/11 19:00 公開）の第7章（謙信は遺言を残したのか）から。11/12 17:30 公開。
# 形式は mongol_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。死は「亡くなった」。遺骸の扱いは淡々と。景虎は「自ら命を絶った、と伝えられる」まで。
# 絵は本編の AI 絵（out/story/kenshin/main/、Gemini）だけ。新しい絵は作らない。謙信の顔は実在の肖像に似せない想像図。
# 切り口：跡継ぎ。景勝の手紙は「遺言」で本丸へ移り刀を贈るとだけ書き、誰を跡継ぎに、とは書かない。家譜は頷き、北越軍記は家臣の話し合い。3月24日（死の11日後）には後を継いだと知らせる。御館の乱。
#   本編の答え（謙信の最期の理由＝同時代の言葉は虫気だけ・厠は江戸の軍記で一説・言えること言えないこと）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/上杉謙信_facts_20261107.yaml）：kenshin-18・19・21・22・72・13・57。言い方は本編のまま。
# 計算（自分で計算し直した）：3月13日→3月24日＝11日後。景虎の自刃は天正7年（1579）＝謙信の死の翌年。
# 理解テスト4問：
#   ①誰の話か：謙信の2人の養子（姉の子の景勝と、北条家から来た景虎）
#   ②いつ・どこで何が：景勝は3月24日、死の11日後には、外へ向けて後を継いだと知らせた。手紙は遺言で本丸へ移り、遺言で刀を贈る、と書く
#   ③何が違うか：跡継ぎの決まり方。景勝の手紙＝遺言（跡継ぎの言葉そのものは無い）、家譜＝問われて頷いた、北越軍記＝老臣の話し合い
#   ④どうなったか：景虎は従わず御館の乱。翌年、景虎は鮫ヶ尾城で自ら命を絶った、と伝えられる。亡くなった謙信はそのあいだどこにいたか、の問いで閉じる（答えは本編の第8章）
title: 謙信の遺言｜跡継ぎは、誰がどう決めたのか
yt_title: 上杉謙信は、跡継ぎを言い残したのか　景勝の手紙は「遺言」、家譜は「頷き」、軍記は「話し合い」と書く
description: |-
  子のいない上杉謙信には、養子が2人いました。姉の子の景勝と、関東の北条家から迎えた景虎。謙信の死後、2人は越後を二つに割って争います。御館の乱です。
  謙信は、本当に、跡継ぎを言い残したのか。景勝は、死の11日後の3月24日の手紙で、遺言で本丸へ移り、遺言で刀を贈る、と書いています。けれど、誰を跡継ぎに、という言葉そのものは、手紙にはありません。米沢藩の『上杉家家譜』附録は、倒れた謙信の枕元で、重臣の未亡人が、跡目は景勝公か、と尋ね、言葉の出ない謙信が、ただ頷いた、と書きます。『北越軍記』は、老臣たちが話し合い、ほかの家に取られるよりは、甥の景勝を、と決めた、と書きます。
  景虎は従わず、翌年、鮫ヶ尾城で自ら命を絶った、と伝えられています。
  では、亡くなった謙信は、そのあいだ、どこにいたのか。本編は概要欄のリンクからどうぞ。
