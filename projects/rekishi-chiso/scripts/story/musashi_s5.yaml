# 物語完結型ショート 宮本武蔵 s5（2026-10-29）。本編 scripts/musashi-story.yaml の第6章（熊本の客分・2022年の新史料）から。
# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（M*.jpg。人物なし）と実在の自画像とされる絵（島田美術館蔵）。
# 事実カード：musashi-30・31・33・34・35
#   ・足利道鑑は「遺児とされる」（musashi-35）。熊本大学の見方（体現者として招かれた）は「考えている」で言う。
#   ・生年を「？」と書くのは熊本大学の発表（musashi-33）。
# 理解テスト4問：
#   ①誰の話か：熊本に客分として招かれた晩年の宮本武蔵
#   ②いつ・どこで何が：1640年に細川忠利に招かれて熊本に来た。11月、山鹿の御茶屋に、足利道鑑らとともに呼ばれた
#   ③なぜ分かったか：2022年9月15日に熊本大学が発表した新史料4点（惣奉行衆の書状の控え）から
#   ④どうなったか：熊本大学は、思想としての兵法の体現者として招かれたと考える。その発表は武蔵の生年を「？」と書く
title: 宮本武蔵｜晩年の熊本で、将軍の遺児と同じ席に呼ばれた
yt_title: 宮本武蔵は晩年の熊本で「将軍の遺児とされる人」と同じ席に呼ばれていた　2022年の新史料
description: |-
  巌流島の勝者、宮本武蔵は、晩年の熊本で、将軍の遺児とされる人と同じ席に呼ばれていました。
  寛永17年、1640年。武蔵は、熊本藩主の細川忠利に招かれ、客分として熊本に来ます。その年の11月、忠利は山鹿の御茶屋に、足利道鑑、津川四郎右衛門、朝山意林庵とともに、武蔵を呼びました。2022年9月15日に熊本大学が発表した、新しい史料4点で分かったことです。
  熊本大学は、武蔵が思想としての兵法の体現者として招かれたと考えています。ただ、同じ発表は、武蔵の生年を「？」と書いています。
