# 物語完結型ショート フランス革命（もしも）s5（2026-11-05）。本編 scripts/france-if-story.yaml（11/5 12:00 公開、https://youtu.be/0InK0OydYHM）から。切り口：陳情書は「王をやめろ」と書いたのか（第4章）
# 形式は kurofune_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。陳情書・回想録の言葉は出どころを言ってから引く。
# 絵は本編の AI 絵（F01〜F16）と実在の絵（paintings/france_*）。新しい絵は作らない。F14（遠くにエッフェル塔）・F04（偽の字）は使わない。
# 事実カード（dev/output/rekishi-chiso/research/フランス革命_facts_20261031.yaml）：france-if-46・48・49（本編の第4章の言い方のまま）
# ・数のやり直し：陳情書の数は本編どおりシャピロとマーコフ（2001年）の「村の共同体だけで約4万」だけを言う（県文書館の約6万は言わない）。
# ・ローリス村の言葉は本編どおり「何も受け取らない」。カルカソンヌの「1人1票」は尺のため外し、「税は国民が認めたものだけ」だけを言う。
# ・アンデル村（ひな形の写し）・貴族と第三身分の苦情の件数は尺のため外す。
# 理解テスト4問：
#   ①誰の話か：1789年の春、フランスの村や町が書いた陳情書
#   ②いつ・どこで何が：全国三部会の議員を選ぶとき、村の共同体だけで約4万の陳情書が書かれた
#   ③何を書いたか：ローリス村「第三身分は何もかも払い、何も受け取らない」、カルカソンヌは王政の安定を言ったうえで税は国民が認めたものだけと求めた
#   ④どうなったか：「王をやめろ」と書いた陳情書は、記録の上でほとんど見つからない（ブーニョの言う1通も研究者は見つけられなかった）
title: 陳情書｜1789年、フランスの村々は「王をやめろ」と書いたのか
yt_title: フランス革命の年、村々の陳情書は「王をやめろ」と書いたのか　約4万の要望書に残った言葉
description: |-
  フランス革命の年、村々が書いた要望書に、「王をやめろ」という言葉は、ほとんど見つかりません。
  1789年の春、全国三部会の議員を選ぶとき、村や町は、要望を書いた陳情書を作りました。アメリカの社会学者シャピロとマーコフは、村の共同体だけで約4万が書いた、としています。南フランスのローリス村の陳情書は「第三身分は、何もかも払い、何も受け取らない」と書き、カルカソンヌの第三身分は、国の幸せは王政の安定にかかる、としたうえで、税は国民が認めたものだけに、と求めました。貴族の議員ブーニョは、王の位から降ろせと書いた村の陳情書を告発に回したと回想録に記しますが、シャピロとマーコフは、その陳情書を見つけられませんでした。
  王を慕う陳情書が書かれた国で、革命はなぜ止まらなかったのか。史料から掘り下げた本編は、概要欄のリンクからどうぞ。
