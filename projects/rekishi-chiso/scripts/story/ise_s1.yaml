#   国三郎が講で選ばれたとも言わない。講の話は「多くの村では」の一般の話として言う。
# hook＝村の餞別はいくらだったか（答えはこのショートの中：約1万2,400文、片道より多く、総額の3分の1あまり）。
# tease＝伊勢の御師の家に、旅人はいくら払ったか（答えは本編 第6章：大倉与市が1840年に600文、ise-09）。
# 計算：12,400÷33,608＝36.9%・12,400÷35,771＝34.7%→どちらでも「3分の1あまり」。12,400＞7,048（片道より多い）。
# 理解テスト：①伊勢参りの農民がもらった餞別の話 ②1845年の正月、今の世田谷区の喜多見村 ③村人30人から約1万2,400文を受け取り、伊勢まで16日の出費を書き残した ④餞別は片道の7,048文より多く、86日の旅の総額の3分の1あまりだった
title: "伊勢参り｜村人30人の餞別"
yt_title: "伊勢参りの農民は、村人30人から餞別を受け取った　その額は伊勢までの片道の旅費より多く、旅の総額の3分の1あまり"
description: |-
  1845年の正月、今の世田谷区にあった喜多見村の農民、田中国三郎は、伊勢参りに出る前に、村人30人から餞別を受け取りました。金1両2朱と銭5貫600文、銭にしておよそ1万2,400文です。
  国三郎が伊勢までの16日間に使ったお金は、宿場ごとの書き留めで7,048文。餞別は片道の額より多いお金でした。それでも、86日の旅の総額（銭にして3万3,608文）の3分の1あまりにあたります。
  本編では、伊勢までの1日ずつの出費と、伊勢で待つ御師の宿のもてなしまでたどっています。本編は概要欄のリンクからどうぞ。
