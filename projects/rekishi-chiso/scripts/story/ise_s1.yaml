  tone: 重い
  pause: 0.12
  # fact: ise-24
- 語り: "多くの村では、伊勢講という集まりが、みんなで旅費を積み立てた。伊勢参りは、村で送り出す旅だった。"
  shot: B03_8
  tone: しみじみ
  pause: 0.12
