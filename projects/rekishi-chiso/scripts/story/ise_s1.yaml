  shot: B07_4
  tone: しみじみ
  pause: 0.12
  # fact: ise-07, ise-01
- 語り: "餞別は、伊勢までの片道で使う額よりも、多いお金だった。"
  shot: B05_5
  tone: しみじみ
  pause: 0.12
  # fact: ise-01（谷釜 2015 の総額。2010 の論文は3万5,771文。どちらでも3分の1あまり）
- 語り: "けれど、国三郎の旅は、伊勢で終わらない。旅の全部は86日。使ったお金は、銭にして、3万3,608文。"
  shot: B28_6
  tone: しみじみ
  pause: 0.12
  # fact: ise-07
- 語り: "それでも餞別は、旅の総額の、3分の1あまりにあたった。"
