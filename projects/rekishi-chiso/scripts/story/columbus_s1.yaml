# 物語完結型ショート コロンブス s1（2026-11-06）。本編 scripts/columbus-if-story.yaml（11/9 12:00 公開）の序章・第1章から。11/10 9:00 公開。
# 形式は hojo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/columbus-if/main/、Gemini）と本編で使った実在の絵だけ。新しい絵は作らない。
# 切り口：コロンブスはキューバを日本だと思った（航海日誌 10月23日）。計算では日本はカナリア諸島の西 約2400海里、本当は約1万600海里。
#   読み違いは、アルフラガヌスの「緯度1度＝56と3分の2マイル」をイタリアのマイルで読んだこと（Williams 1988）。本編の答え（船乗りが迫ったこと）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/コロンブス_facts_20261106.yaml）：columbus-31・48・49。言い方は本編のまま。
# 計算（自分で計算し直した）：2400海里×1.852＝4445km≒約4400キロ。10600÷2400＝4.4＝4倍あまり。1477÷1975＝0.748→約25％小さい。
# 理解テスト4問：
#   ①誰の話か：クリストファー・コロンブス
#   ②いつ・どこで何が：1492年10月、キューバに着いて、航海日誌にジパング（日本）に違いないと書いた
#   ③なぜそう思ったか：計算では日本は西へ約2400海里（約4400キロ）。アルフラガヌスの数を短いイタリアのマイルで読み、地球を約25％小さく見た
#   ④どうなったか：本当の距離は約1万600海里で4倍あまり。その海で船乗りが何を迫ったのか、の問いで閉じる（答えは本編）
title: コロンブス｜日本までの距離の読み違い
yt_title: コロンブスはキューバを日本だと思っていた　計算では日本まで約2400海里、本当の距離はその4倍あまり
description: |-
  1492年10月、コロンブスの航海日誌には、キューバ島はジパングに違いないと思う、とあります。
  ミネソタ大学の講義の資料によると、コロンブスの計算では、日本はカナリア諸島から西へ約2400海里、およそ4400キロ先でした。決め手は、9世紀の天文学者アルフラガヌスの、緯度1度は56と3分の2マイル、という数です。コロンブスはこれを、長いアラビアのマイルではなく、短いイタリアのマイルで読みました。1マイルは約1975メートルではなく、約1477メートルです。航海学者のウィリアムズが1988年の論文で示した2つの長さで割ると、地球を約25％小さく見たことになります。
  本当の距離は約1万600海里。見積りの4倍あまりでした。
  その遠い海の上で、船乗りたちは、コロンブスに何を迫ったのか。本編は概要欄のリンクからどうぞ。
