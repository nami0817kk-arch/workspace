lines:
  # fact: B-26, B-29
- 語り: "タイタニックは、白いロケットを打ち上げた。近くの船、カリフォルニアン号。そこでも、白いロケットが、見えていた。"
  shot: S11_1
  tone: 強調
  pause: 0.12
  # fact: B-29
- 語り: "二等航海士のストーンは、合計8発を見た、と英国の調査で述べている。"
  shot: S06_2
  tone: しみじみ
  pause: 0.12
  # fact: B-28
- 語り: "では、その船までは、何マイルあったのか。船長のロードは、アメリカ上院で、19.5マイルから19.75マイル、と述べた。"
  shot: S12_3
  tone: 重い
  pause: 0.12
  # fact: A-30
- 語り: "ロードの言う位置と、タイタニックが送った位置。その差を計算すると、約19.7海里。ロードの数字と合う。"
  shot: S04_4
  tone: しみじみ
  pause: 0.12
  # fact: B-26
- 語り: "ところが、英国の報告書は、遠くても、8マイルから10マイル以内、と認定した。"
  shot: S17_5
  tone: 重い
  pause: 0.12
  # fact: B-27
- 語り: "アメリカ上院の報告書は、船長の言う、19.5マイルより、近かった、とする。"
  shot: S16_6
  tone: 重い
  pause: 0.12
  # fact: B-26
- 語り: "英国の報告書は、最初のロケットのとき、救助に向かっていれば、失われた命の多くを、あるいは全てを、救えたかもしれない、と書いた。"
  shot: S10_7
  tone: 重い
  pause: 0.12
  # fact: B-26, B-28
- 語り: "同じ夜の同じ船までが、5マイルとも、19マイルとも書かれる。なぜ、こんなに割れたのか。"
  shot: S07_8
  tone: 疑問
  pause: 0.15
