# 切り口：ロケットを見ていたカリフォルニアン号までの距離が、船長ロードの19.5〜19.75マイル（位置から計算して約19.7海里）と、英国の報告書の8〜10マイル以内、米上院の「19.5マイルより近い」で割れる。
# 計算（自分で数え直した）：ロードの位置 42°05'N 50°07'W と CQD の位置 41°46'N 50°14'W：緯度19′、経度7′×cos41.9°≒5.2′、√(19²+5.2²)≒19.7海里（A-30・B-28）
title: "タイタニック｜ロケットを見た船は、5マイル先か、19マイル先か"
yt_title: "タイタニックのロケットを見ていた船　カリフォルニアン号までは5マイルか、19マイルか　船長と英米の報告書で割れる距離"
description: |-
  タイタニックが打ち上げた白いロケットを、近くにいたカリフォルニアン号の二等航海士ストーンは、合計8発を見た、と英国の調査で述べています。
  その船までの距離は、記録で割れます。船長ロードはアメリカ上院で19.5マイルから19.75マイル。位置から計算すると約19.7海里です。英国の報告書は、遠くても8マイルから10マイル以内、と認定しました。アメリカ上院の報告書は、19.5マイルより近かった、としています。
  本編では、衝突から沈没までの2時間40分を、無線の記録と英米2つの調査から、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SdhomuxqfF4
