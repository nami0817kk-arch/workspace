# 切り口：1575年の大岡弥四郎の謀反に、築山殿が関わった可能性が高い、という黒田基樹の見方と、その根拠が江戸時代の記録であること（本編 第5章）。研究者の見方として言う。
# 計算（自分で計算し直した）：1575年→1579年＝4年後（本編の「4年前」と合う）。
title: "築山殿と信康｜4年前の謀反と、築山殿"
yt_title: "家康の正妻・築山殿は、4年前に武田に通じていたのか　1575年、岡崎の大岡弥四郎の謀反と研究者の見方"
description: |-
  1579年に命を落とした徳川家康の正妻・築山殿は、その4年前、武田に通じていたのか。1575年、岡崎で、町奉行の一人・大岡弥四郎と信康の家臣たちの謀反のたくらみが明るみに出ました。
  黒田基樹は、このたくらみは武田勝頼の誘いを受けたもので、信康の家臣たちに働きかけたのは築山殿だった可能性が高い、とみています。根拠は『岡崎東泉記』と家臣の家に伝わった聞き書き、江戸時代の二つの記録で、『三河物語』は築山殿の関わりを書いていません。
  黒田は、1579年に徳姫が信長へ送った書き付けにこの内通が書かれていたことが問題になり、家康は信長への忖度から信康も同じ罪とみなした、とみます。本編では、その夏の日記やほかの記録も並べています。本編は概要欄のリンクからどうぞ。
