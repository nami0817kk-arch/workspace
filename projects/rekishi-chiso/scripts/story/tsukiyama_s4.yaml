lines:
  # fact: tsukiyama-22
- 語り: "家康の正妻、築山殿は、死の4年前、武田に通じていたのか。"
  shot: T03_1
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-22
- 語り: "1575年、岡崎で、謀反のたくらみが発覚した。くわだてたのは、町奉行の一人、大岡弥四郎と、信康の家臣たちだ。"
  shot: T10_2
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-22
- 語り: "研究者の黒田基樹によれば、たくらみは、武田勝頼の誘いを受けたものだった。"
  shot: T08_3
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-22
- 語り: "家臣たちに働きかけたのは、築山殿だった可能性が高い。黒田は、そう書く。"
  shot: T03_4
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-23
- 語り: "根拠は、江戸時代の二つの記録。『岡崎東泉記』と、家臣の家に伝わった聞き書きだ。『三河物語』は、その関わりを書いていない。"
  shot: T16_5
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-24
- 語り: "ねらいは、信康を当主にして、徳川の家を残すこと。家康は、このとき、妻をとがめなかった。黒田は、そうみる。"
  shot: T26_6
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-25
- 語り: "4年後、徳姫が信長へ送った書き付けに、この内通が書かれていた。黒田は、それが問題になった、とみる。"
  shot: T15_7
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-25
- 語り: "信長に知られた以上、家康は、信康も同じ罪とみなすしかなかった。黒田は、それを、信長への《忖度》と呼ぶ。"
  shot: T12_8
  tone: 重い
  pause: 0.12
- 語り: "では、信長に問われた家康の重臣は、何と答えたのか。"
  shot: T28_9
  tone: 疑問
  pause: 0.15
