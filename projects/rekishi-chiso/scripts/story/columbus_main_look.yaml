# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしもコロンブスがアメリカにたどり着かなかったら（scripts/columbus-if-story.yaml）。chiso/storymain.py が読む。
# 11-06 作成（11/9 12:00 公開）。hojo_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵は全部この回のために Gemini（Chrome）で新しく作った（out/story/columbus-if/main/、out/ は git に入らない）。
#   Gemini のフルサイズのダウンロードが止まったため、C02 以降は画面の画像（1024×572）を保存した（C01・T01 は 1376×768）。
#   コロンブスの顔は AI の想像図（T01・C01）だけ。実在の人物（イサベル女王ほか）は遠景で顔を描かない。先住民の死・奴隷・病の場面は描かない。
#   実在の絵は《南蛮屏風》・『和泉名所図会』の鉄砲鍛冶・《支倉常長像》・ル・ブトゥーの日本図（パブリックドメイン）。
