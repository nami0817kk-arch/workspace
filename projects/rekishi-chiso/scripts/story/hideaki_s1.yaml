#   ・最古の本・通説の筋は呉座勇一の紹介（PRESIDENT WOMAN Online 2023）。連署状写は呉座の紹介→「紹介では」と語りで言う。
#   ・1キロ以上・射程は白峰旬の指摘（hideaki-06）。史実の可能性は笠谷和比古（hideaki-07）。どちらも誰の見立てかを語りで言う。
