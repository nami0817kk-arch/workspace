# 理解テスト4問：
#   ①誰の話か：関ヶ原で「家康の鉄砲に寝返らされた」とされる小早川秀秋
#   ②何が問題か：その「問い鉄砲」を書いた確認できる最も古い本は、関ヶ原から63年後（1663年・慶長軍記）。関ヶ原の年の書状には見当たらない
#   ③同じ時代の書状は何と書くか：合戦の2日後の連署状写は、午前10時ごろ、戦いが始まってすぐに秀秋たち4人が味方した、と書く（呉座の紹介）
#   ④どうなったか：白峰旬は射程が届かないと指摘、笠谷和比古は史実の可能性を論じる。鉄砲の音は63年後の本までしかたどれない
title: 小早川秀秋｜「問い鉄砲」を最初に書いた本は、関ヶ原から63年後
yt_title: 小早川秀秋の「問い鉄砲」は63年後の本が最初　関ヶ原の年の書状には見当たらない
description: |-
  関ヶ原で、徳川家康の一発の鉄砲が小早川秀秋を寝返らせた。この「問い鉄砲」を書いた、確認できる最も古い本は、関ヶ原から63年後、寛文3年（1663）の軍記『慶長軍記』です。関ヶ原の年の書状には、この鉄砲は見当たりません。
  合戦の2日後、慶長5年9月17日付で、家康の家臣の石川康通と彦坂元正が出した書状の写しは、午前10時ごろ、戦いが始まってすぐに、秀秋たち4人が東軍に味方した、と書いていると、呉座勇一さんは紹介しています。
  白峰旬さんは、家康の陣から松尾山の山頂までは1キロ以上あり、火縄銃の有効な射程では届かない、と指摘します。一方、笠谷和比古さんは、『論争 関ヶ原合戦』で、史実の可能性をなお論じています。
