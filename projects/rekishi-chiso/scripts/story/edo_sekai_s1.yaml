# 理解テスト：①家康とエリザベス1世の話 ②1603年、家康が将軍に・女王が亡くなる ③記録では同じ3月24日、イングランドはユリウス暦 ④今の暦では10日ずれ。1648年の条約も10日ずれて2つの日付
title: "家康とエリザベス1世｜同じ3月24日"
yt_title: "徳川家康が将軍になった日に、エリザベス1世が亡くなった？　記録では同じ1603年3月24日　今の暦に直すと10日ずれ"
description: |-
  徳川家康が将軍になったのは、慶長8年2月12日。国立天文台の暦のデータで今の暦に直すと、1603年3月24日です。イングランドの女王エリザベス1世が亡くなった日も、ウェストミンスター寺院の紹介では3月24日。
  ところが、イングランドはこのころ古いユリウス暦を使っていました。女王の死を今の暦に直すと4月3日。家康が将軍になった10日あとでした。1648年のウェストファリア条約の日付も、10月14日と24日の2つで記録されています。
  本編では、家康から慶喜までの260年を、同じ年の世界と並べています。本編は概要欄のリンクからどうぞ。
