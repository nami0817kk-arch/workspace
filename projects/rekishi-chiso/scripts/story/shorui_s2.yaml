title: "生類憐みの令｜中野の犬小屋は、16万坪か、30万坪か"
yt_title: "生類憐みの令の中野の犬小屋　広さは16万坪か30万坪か、犬は10万頭か30万頭か　記録で倍ほど割れる「犬の囲い」"
description: |-
  生類憐みの令のもと、1695年に江戸の西の中野にできた犬の囲い。広さは、幕府の記録『徳川実紀』では16万坪、約53ヘクタールです。根崎光男の研究では翌年に20万坪を超え、中野区の案内では約30万坪と書かれています。
  頭数も、『徳川実紀』の10万頭に及ぶといわれた、から、中野区の案内の数万から30万頭まで割れています。餌の費用は1年で金9万8000両あまりで、江戸の町人から集めた、とする研究があります。
  本編では、触れの中身・罰の記録・悪い評判の出どころを並べて、生類憐みの令は本当に悪法だったのかを確かめています。本編は概要欄のリンクからどうぞ。
