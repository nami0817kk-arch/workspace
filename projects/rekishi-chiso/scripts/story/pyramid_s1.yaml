title: "大ピラミッド｜石を運んだ男の日誌に、積み方はなかった"
yt_title: "大ピラミッドの石を運んだ男の日誌　2013年に紅海ぞいの洞窟で見つかったのに、積み方は書かれていなかった"
description: |-
  大ピラミッドの石を運んだ男の日誌が、2013年、紅海ぞいのワディ・エル・ジャルフの洞窟から見つかりました。書いたのは、クフ王の時代の検査官メルエルです。
  日誌に書かれていたのは、トゥラの白い石灰岩を船に積み、ギザへ運ぶ仕事でした。公表されている日誌には、巨石を持ち上げる方法は書かれていません。
  本編では、ヘロドトスの10万人、洞窟の日誌、労働者の町と墓を並べ、誰がどうやって造ったのかを、記録から整理しています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/B-vlbAtwegY
