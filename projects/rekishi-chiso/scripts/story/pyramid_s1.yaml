lines:
  # fact: pyramid-P01, pyramid-P03
- 語り: "大ピラミッドの石を運んだ男の日誌が、2013年、紅海ぞいの洞窟から見つかった。ところが、積み方は、書かれていない。"
  shot: C02_1
  tone: 強調
  pause: 0.12
  # fact: pyramid-P01
- 語り: "見つけたのは、パリ・ソルボンヌ大学のタレたちの調査隊。石灰岩を掘った、人工の洞窟の中だった。"
  shot: C16_2
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P02, pyramid-P05
- 語り: "書いたのは、メルエル。クフ王の時代の、検査官だ。文字の書かれたパピルスとして、エジプトで見つかった最古のものとされる。"
  shot: C07_3
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P06
- 語り: "仕事は、トゥラの白い石灰岩を、船に積み、ギザのアケト・クフへ運ぶこと。大ピラミッドの、当時の名だ。"
  shot: C04_4
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P06
- 語り: "10日ごとに、北と南の採石場を替え、2回から3回、往復したことが、読み取れる。"
  shot: C05_5
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P04
- 語り: "日付は、クフ王の、13回目の牛の数え上げの、翌年。治世の26年目とも、27年目とも、割れる。"
  shot: C06_6
  tone: 重い
  pause: 0.12
  # fact: pyramid-P03
- 語り: "人も、場所も、日付も、本物の記録だ。それでも、公表されている日誌に、巨石を持ち上げる方法は、書かれていない。"
  shot: H01_7
  tone: 重い
  pause: 0.12
  # fact: pyramid-P03
- 語り: "石を運んだ日々は、残った。では、その石を、誰が、どうやって積んだのか。"
  shot: C23_8
  tone: 疑問
  pause: 0.15
