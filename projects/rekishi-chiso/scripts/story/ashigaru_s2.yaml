# 物語完結型ショート 戦国の足軽 s2（2026-11-26）。本編 scripts/ashigaru-if-story.yaml（11/29 12:00 公開予定、https://youtu.be/fkDkwAO82lY）から。11/30 11:00 に予約。
# 形式は sekimap_s1〜s5・joguo_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 戦国の足軽if_facts_20261122.yaml）だけ。
# 絵：本編の AI 絵（out/story/ashigaru_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：応仁の乱で「悪党」と書かれた足軽（本編 第1章、ashigaruif-23〜28）。
# hook＝足軽は、なぜ悪党と呼ばれたか（答えはこのショートの中：寺や公家の屋敷を壊し、火をかけ、財宝を奪ったから＝樵談治要）。
# tease＝のちの戦国の軍勢で、雑兵はどれほどを占めたか（答えは本編 第2章：およそ9割、ashigaruif-55）。
# 花山の侵攻は事実カード ashigaruif-26 では応仁2年（1468）閏10月17日。本編は「同じ年の秋」と言うが、旧暦の10月は冬なので、ここでは季節を言わない（親に報告）。
# 信貴山城の足軽衆の書状（ashigaruif-28）は年が分からず、信貴山城は戦国の城なので、応仁の乱の話に混ぜないよう外した（本編 第1章は応仁の乱の流れで言っている。親に報告）。
# 計算：1467〜1477＝足かけ11年（本編の値と同じ）。
# 理解テスト：①応仁の乱のころの足軽 ②1467年からの京都の大乱・1480年ごろの一条兼良の意見書 ③足軽は寺や屋敷を壊し、火をかけ、財宝を奪い、取り立てもした ④「度を超えた悪党」と書かれ、けが人の報告では名前ではなく数だけで記された
title: "足軽は悪党だった｜応仁の乱の京都"
yt_title: "足軽は「度を超えた悪党」と書かれた　応仁の乱の京都で、足軽が恐れられた理由と、名前の残らない「大和足軽5人」"
description: |-
  1467年から足かけ11年続いた京都の大乱、応仁の乱。そのさなかに、足軽は記録の中で目立ち始めます。公家の一条兼良は、1480年ごろ、将軍の足利義尚に宛てた意見書『樵談治要』に、「このたびはじめて出てきた足軽は、度を超えた悪党だ」と書きました。寺や公家の屋敷を壊し、火をかけて財宝を奪う。昼の強盗と言うべきだ、と。
  1468年には、西軍の足軽およそ2000人が京都の東の山科に攻め込み、村の人々に防がれて退きました。河内の畠山義就は、1470年ごろ、足軽を雇うための取り立て「足軽段米」を作りました。その一方で、応仁の乱のけが人の報告書には「大和足軽5人、いずれも矢傷1か所ずつ」とだけあり、名前は書かれていません。
  本編では、足軽の集め方・持ち物・食べ物・傷と手柄まで、『雑兵物語』とほかの記録でたどっています。本編は概要欄のリンクからどうぞ。
