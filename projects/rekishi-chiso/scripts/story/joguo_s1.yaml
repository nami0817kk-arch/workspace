title: "聖徳太子の一族｜祖父が父方も母方も同じ7人"
yt_title: "聖徳太子の孫7人は、父方の祖父も母方の祖父も聖徳太子　古い書『帝説』に残る一族の家系図"
description: |-
  聖徳太子の妻と子は、『上宮聖徳法王帝説』という古い書に、一人ずつ書き残されています。妻は3人、子は合わせて14人。
  長男の山背大兄王が妻に迎えたのは、母の違う妹、舂米女王でした。2人の間の7人の子にとって、聖徳太子は、父方の祖父でもあり、母方の祖父でもありました。
  643年の冬、この一族は、斑鳩の寺で、一度に命を絶ちます。
  本編では、攻めた蘇我入鹿と山背大兄王のつながりから、一族が絶えるまでを家系図でたどっています。本編は概要欄のリンクからどうぞ。
