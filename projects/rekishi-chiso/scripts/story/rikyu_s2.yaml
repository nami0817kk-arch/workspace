lines:
  # fact: rikyu-03
  - 語り: 天正19年2月、茶人、千利休の《!木像》が、罪人として、京の橋で、磔にされた。
    shot: R07s
    tone: 強調
  # fact: rikyu-16, rikyu-02
  - 語り: 木像は、利休が自分の姿を写して作り、京の大徳寺の、門の上に納めたものだった。
    shot: R06
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-10
  - 語り: 遠く奥州の伊達家に届いた書状が、そのときの様子を、伝えている。
    shot: R10
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-02
  - 語り: 「殿下様」、つまり秀吉が、その木像を、《召し上げた》。
    shot: K05
    tone: 強調
    pause: 0.12
  # fact: rikyu-03
  - 語り: そして、聚楽第の大門の近く、一条戻橋で、《磔》にかけた。
    shot: R07w
    tone: 重い
    pause: 0.3
    dip: true
  # fact: rikyu-10
  - 語り: まことに《前代未聞》だと、京の中では、言い合った。
    shot: R07c
    tone: しみじみ
    pause: 0.15
  # fact: rikyu-10
  - 語り: 見物に来る人は、身分の高い者も、低い者も、際限がない。
    shot: R07c
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-10
  - 語り: 木像の脇には、罪を書き連ねた《札》が、立てられた。
    shot: R07z
    tone: 重い
    pause: 0.15
  - 語り: 人を罰する前に、まず、その人の姿をした像を、罪人のように、人目にさらしたのだ。
    shot: R07w2
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-01
  - 語り: 同じ月、利休本人も、秀吉の命で、世を去った、と伝わる。
    shot: R01
    tone: 重い
    pause: 0.15
