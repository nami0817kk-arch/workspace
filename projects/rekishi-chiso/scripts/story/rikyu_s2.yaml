# 物語完結型ショート 千利休 s2（2026-10-28）。本編 scripts/rikyu-story.yaml の序章・第2章（一条戻橋の木像の磔）から。投稿しない。
# 形式は kazumasa_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/rikyu/main/R*.jpg・K05）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/千利休_facts_20261028.yaml）：rikyu-01・02・03・10・16
#   ・伊達家に届いた書状（『大日本古文書 伊達家文書之二』）：「宗易、其身之形を木像ニ作立、紫野大徳寺ニ被納候ヲ殿下様より被召上」（rikyu-02・16）／
#     「聚楽之大門もどり橋と申候所ニ、張付ニかけさせられ候」（rikyu-03）／「誠々前代未聞之由、於京中申事ニ候、見物之貴賤無際限候、右八付之脇ニ、色々ノ科共被遊御札ヲ被相立候」（rikyu-10）
#     → 今の言葉にして語りで読む。門の「上」に置いたのは rikyu-02（山本兼一・Impress Watch ほか）。
#   ・「人を罰する前に、像をさらした」は本編の言い方（見せるための罰。新しい事実は足さない）。46秒で短かったので足した。
#   ・利休本人の死は「秀吉の命で、世を去った、と伝わる」まで（本当に切腹したかは s1・s4 の話。ここでは決めない）。首をさらした話（rikyu-04）は使わない。
# 理解テスト4問：
#   ①誰の話か：千利休（秀吉に仕えた茶人）の木像
#   ②いつ・どこで何が：天正19年2月、京の一条戻橋（聚楽第の大門の近く）で、利休の木像が罪人として磔にされた
#   ③誰が、どうしたか：利休が自分の姿を写して大徳寺の門の上に納めた木像を、秀吉が召し上げて磔にし、脇に罪を書いた札を立てた（遠い伊達家に届いた書状が伝える）
#   ④どうなったか：京では「前代未聞」と言われ、身分を問わず見物人が際限なく集まった。同じ月、利休本人も秀吉の命で世を去ったと伝わる
title: 千利休｜木像が、橋で磔にされた
yt_title: 千利休の「木像」は、罪人として京の橋で磔にされた【伊達家に届いた書状】
description: |-
  天正19年2月。京の一条戻橋で、一体の木像が、罪人として磔にされました。木像の主は、茶人・千利休です。
  遠く奥州の伊達家に届いた書状は、こう伝えています。利休が自分の姿を写して作り、大徳寺に納めた木像を、「殿下様」つまり豊臣秀吉が召し上げ、聚楽第の大門の近くの「もどり橋」で、張付（磔）にかけた。
  京の中では「まことに前代未聞」と言い合い、見物に来る人は身分の高い者も低い者も際限がない。木像の脇には、罪を書き連ねた札が立てられた、と。
  同じ月、利休本人も、秀吉の命で世を去ったと伝えられています。
hashtags: ["#千利休", "#日本史", "#戦国時代"]
