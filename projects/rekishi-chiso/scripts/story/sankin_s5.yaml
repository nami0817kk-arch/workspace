# 物語完結型ショート 参勤交代 s5（2026-10-31）。本編 scripts/sankin-story.yaml（11/4 19:00 公開、https://youtu.be/cZ1q-xRuDHc）の第6章（どう終わり、何が残ったのか）から。11/5 19:30 公開。
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った浮世絵だけ。新しい絵は作らない。
# 切り口：文久2年の緩和で屋敷の畳まで国元へ→元治元年の復旧令は思うようにいかず→終わりの年は出どころごとに違う→赤門だけが残った。条文（s1）・人数（s2）・大井川（s3）・宿場（s4）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml）：sankin-42・45・46・47。数は本編の言い方（出どころ付き）のまま。
#   ・文久2年＝1862年、元治元年＝1864年、慶応元年＝1865年は計算し直して合う。文久2年には閏8月がある（本編のまま「閏8月」）。
#   ・終わりの年：品川区の資料＝元治元年（1864）の復旧令、ブリタニカ＝慶応元年（1865）に旧に戻したが従う者なく廃れた、米国の大学の学生向けページ＝1867年に正式に崩れた（本編の言い方）。
#   ・赤門は1827年（文政10年）建立、構内の大部分が加賀藩上屋敷（文京区の資料）。
# 理解テスト4問：
#   ①誰の話か：幕末の参勤交代（幕府と大名）
#   ②いつ・どこで何が：1862年（文久2年）閏8月に参勤が大きく緩められ、長州藩などは江戸の上屋敷の建具や畳まで国元へ送った
#   ③幕府はどうしたか：1864年（元治元年）9月に至急出府を命じて元に戻そうとしたが、大名の抵抗が強く思うようにいかなかった
#   ④どうなったか：終わりの年は1864・1865・1867と出どころごとに違う。加賀藩上屋敷は東京大学になり、赤門だけが残った
title: 参勤交代｜幕末、屋敷の畳まで国元へ運ばれた
yt_title: 参勤交代はいつ終わったのか　文久2年、大名は江戸屋敷の畳まで国元へ運んだ
description: |-
  1862年、文久2年の閏8月。幕府の改革で、参勤は大きく緩められました。その知らせが出た直後、長州藩などは、江戸の上屋敷の建具や畳まで、国元へ送りました。品川宿は、その輸送で大騒ぎになった、と品川区史にあります。
  1864年、元治元年の9月。幕府は、今年が参勤の年の大名は至急出府せよ、と命じて、元に戻そうとしました。しかし、大名の抵抗が強く、思うようにいきませんでした。いつ終わったのかは、出どころごとに違います。品川区の資料は1864年の復旧令、ブリタニカは1865年、アメリカの大学の学生向けページは1867年。東京大学の構内の大部分は加賀藩の上屋敷で、明治に建物はほとんど取り壊され、1827年に建てられた赤門だけが残りました。
  幕府は、そもそも、なぜ大名に毎年の往復を命じたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
