# 物語完結型ショート 豊臣秀次 s5（2026-10-28）。本編 scripts/hidetsugu-story.yaml の第5章（三条河原の塚と瑞泉寺）から。投稿しない。
# 形式は kazumasa_s1.yaml・asahi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵＋歌川広重《京師 三条大橋》。
# 事実カード（dev/output/rekishi-chiso/research/豊臣秀次_facts_20261028.yaml）：hidetsugu-01・03・22・23・25
#   ・妻子の処刑は「妻妾三十人あまりが、その子とともに、三条河原で命を奪われた」まで（hidetsugu-03・25。39人とは言わない。日付は8月2日／7月15日で割れるので言わない）。
#     処刑の様子・首をさらした話（『玉櫛笥』）は言わない（本編と同じ）。H10 は遠景の人だかりだけの絵。
#   ・塚は「悪逆塚」「畜生塚」と呼ばれた（hidetsugu-23。精選版 日本国語大辞典）。
#   ・慶長16年（1611）、高瀬川を開いた角倉了以が僧桂叔とはかって塚を再建＝瑞泉寺の始まり（hidetsugu-22。日本歴史地名大系）。
#   ・了以が工事中に「秀次悪逆塚文禄四年七月十四日」の墓石を掘り当てた＝寺の言い伝え（hidetsugu-23）→「という」と言う。14日は伝承の中の日付。
#   ・境内に49の五輪塔（hidetsugu-23）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀次（秀吉の甥・関白）と、その妻子をとむらう京都三条の瑞泉寺
#   ②いつ・どこで何が：文禄4年、秀次が高野山で腹を切ったあと、妻妾と子どもたち三十人あまりが三条河原で命を奪われ、その塚は「悪逆塚」と呼ばれた
#   ③誰が何をしたか：慶長16年（1611年）、高瀬川を開いた角倉了以が、僧の桂叔とはかって塚を建て直した（寺の言い伝えでは「秀次悪逆塚」と刻んだ墓石を掘り当てた）
#   ④どうなったか：それが今の瑞泉寺の始まりで、境内には今も49の五輪塔が並ぶ
title: 豊臣秀次｜「悪逆塚」を建て直した豪商
yt_title: 豊臣秀次の妻子の「悪逆塚」を建て直したのは、高瀬川を開いた角倉了以だった【京都・瑞泉寺】
description: |-
  文禄4年、関白だった豊臣秀次は高野山で腹を切りました。そのあと、秀次の妻妾三十人あまりが、その子どもたちとともに、京都の三条河原で命を奪われます。
  その塚は「悪逆塚」とも「畜生塚」とも呼ばれました。
  慶長16年（1611年）、高瀬川を開いた豪商の角倉了以が、僧の桂叔とはかってこの塚を建て直します。これが今の瑞泉寺の始まりです。
  寺の言い伝えでは、了以は工事の途中で「秀次悪逆塚 文禄四年七月十四日」と刻まれた墓石を掘り当てたといいます。境内には今も、49の五輪塔が並んでいます。
