# 物語完結型ショート 豊臣秀次 s2（2026-10-28）。本編 scripts/hidetsugu-story.yaml の第3章（切腹の命令状は『甫庵太閤記』にだけ）から。投稿しない。
# 形式は kazumasa_s1.yaml・asahi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/hidetsugu/main/H*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/豊臣秀次_facts_20261028.yaml）：hidetsugu-01・02・06・07・10
#   ・13日付の奉行連署の命令状は『甫庵太閤記』にだけ（矢部 2016「写しは確認されず、『甫庵太閤記』に記されているのみ」・「創作」。hidetsugu-02）。
#   ・反対説の勢田勝郭（2015）も「虚構」とみる。理由は「三使」同時派遣の書き方が、福原12日・福島と池田13日の別々の出発と合わない（hidetsugu-10）。
#   ・命令の有無の結論は矢部（命じていない）・勢田（命じた）で正反対（hidetsugu-06・07）→ どちらにも寄せない。
#   ・文面は古事類苑 1914 が引く原文「依秀次公御謀叛之條々少も依無疑之、可被進御切腹之旨候」を今の言葉で言う。
#   ・切腹は「腹を切った」まで。様子は描かない・語らない（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀次（秀吉の甥・関白）の切腹を命じたとされる命令状
#   ②いつ・どこで何が：文禄4年7月15日、秀次は高野山の青巌寺で腹を切った。7月13日付の命令状は、江戸時代の『甫庵太閤記』にだけ載っている
#   ③研究者はどう見るか：矢部健太郎さんは甫庵の「創作」とし、反対説の勢田勝郭さんも史料として使えないとする（3人の使者が一緒に出たと書くが、実際は12日と13日に別々）
#   ④どうなったか：命令状を信じない2人でも、秀吉が命じたかどうかの答えは正反対のまま
title: 豊臣秀次｜切腹の命令状は、ひとつの書物にしか無い
yt_title: 豊臣秀次の切腹の命令状は『甫庵太閤記』にしか出てこない【反対説の研究者も「使えない」】
description: |-
  文禄4年7月15日、関白だった豊臣秀次は、高野山の青巌寺で腹を切りました。秀吉が切腹を命じた、と語られてきました。
  その命令状、7月13日付で奉行たちが名を連ねた書状が載っているのは、江戸時代に書かれた『甫庵太閤記』です。
  歴史学者の矢部健太郎さんによれば、この命令状はほかの写しが確認されておらず、矢部さんは甫庵の「創作」とみています。
  矢部さんの説に反対する勢田勝郭さんも、この命令状は史料として使えないと書きました。『甫庵太閤記』は3人の使者がそろって出たと書きますが、実際には12日と13日に別々に出ていたからです。
  それでも、秀吉が命じたかどうかについて、2人の答えは正反対です。
