# 理解テスト：①篤姫の最期の話 ②1883年11月、千駄ヶ谷の住まいの湯殿でつまずき、中風に ③（選んだこと）なし：記録の食い違いの話 ④当時の新聞と日記は20日、のちの本は12日・10日と割れた
title: "篤姫｜亡くなった日が3つある"
yt_title: "篤姫が亡くなった日は、本によって3つに割れている　当時の新聞と日記は11月20日"
description: |-
  明治16年（1883年）11月22日の『東京日日新聞』は、篤姫（天璋院）が千駄ヶ谷の住まいの湯殿でつまずき、にわかに激しい中風になり、外国の医師まで呼んだが、11月20日午前8時に亡くなった、年は49、と伝えました。有栖川宮幟仁親王の日記も、20日8時30分とします。
  ところが、日本人名大辞典は11月12日・48歳、2022年のニッポンドットコムの記事は11月10日・49歳。生まれを天保6年12月19日（1836年2月5日）とすると、数えで49歳、満で47歳です。
  本編では、城を出たあとの15年あまりを、当時の新聞・勝海舟の談話・昭和の本でたどっています。本編は概要欄のリンクからどうぞ。
