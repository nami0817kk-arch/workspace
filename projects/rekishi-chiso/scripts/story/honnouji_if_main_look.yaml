# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしも本能寺の変が起きなかったら、織田家はどうなった？（scripts/honnouji-if-story.yaml）。chiso/storymain.py が読む。
# 11-27 作成（12/4 12:00 公開予定）。hojo_main_look.yaml を写した。
# 絵の方針：新しい Gemini の絵（11-27、/u/0）は G01〜G19 の14枚：
#   G01=信長（想像図・右に上半身、左は夜の寺と炎）G02=岐阜城の広間で家督を受ける信忠と信長 G03=高遠城で塀の上に立つ信忠（春）G04=茶道具の前の信長
#   G05=夜明け前の京、寺の門から出る武者 G06=煙の上がる二条の御殿と信忠の後ろ姿 G07=幼子を抱いて馬で急ぐ僧形の武士 G08=清洲城の広間の4人の重臣
#   G09=城の奥の幼い若君と侍女・老臣 G10=金華山の岐阜城と長良川 G11=住吉の浜の軍船 G13=琵琶湖畔の安土城 G16=将棋の駒を作る藩士の手もと G19=終了画面の夕暮れの湖
#   足りない所は北条の回の絵（out/story/hojo-if/main/ の H02〜H26。もとは前の回の Gemini の絵）を out/story/honnouji-if/main/ に写して使う（out/ は git に入らない）。
#   実在の人物の顔は、実在の肖像（額）か、この回の想像図（信長 G01・G02・G04、信忠 G02・G03・G06）と前の回の秀吉 H05 だけ。切腹・遺骸の場面は描かない。
script: scripts/honnouji-if-story.yaml
out: honnouji_if_story_main
art_dir: out/story/honnouji-if/ph
