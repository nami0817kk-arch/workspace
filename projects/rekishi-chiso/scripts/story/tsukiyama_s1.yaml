# 切り口：「腹を切らせよ」と信長が言ったと書く『三河物語』は、草稿が事件の43年後（本編の序章・第3章）。
# 計算（自分で計算し直した）：1622−1579＝43年／1626−1579＝47年／信康 1559生→1579没＝数え21／1579年＝己卯、丑の年なら1577年（丁丑）で2年前。
title: "築山殿と信康｜腹を切らせよ、は43年後の本"
yt_title: "信長が家康の長男に「腹を切らせよ」と命じた話は、事件の43年後に書かれた『三河物語』のもの　築山殿と信康"
description: |-
  1579年、徳川家康の長男・信康は、21歳で自害しました。信長の娘で信康の妻の徳姫が12か条を書いて信長へ送り、信長が「腹を切らせよと、家康に伝えよ」と言った。よく知られたこの筋は、家康の家臣・大久保忠教の『三河物語』のものです。
  その『三河物語』の草稿ができたのは1622年、事件から43年後。仕上がりは1626年とみられ、47年後です。同じ箇所は手紙の年を丑の年と書きますが、1579年は卯の年で、丑の年なら2年前の1577年になります。
  本編では、その夏に家臣が書いた日記、ほかの記録、4年前の謀反を年の順に並べて、命じたのは信長か家康かを確かめています。本編は概要欄のリンクからどうぞ。
