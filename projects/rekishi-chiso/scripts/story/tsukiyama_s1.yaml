lines:
  # fact: tsukiyama-12, tsukiyama-13
- 語り: "家康の長男に、腹を切らせよ。信長がそう命じた、という話は、いつ書かれたのか。"
  shot: T15_1
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-17, tsukiyama-14
- 語り: "1579年、家康の長男、信康は、遠江の二俣城で、21歳で自害した。"
  shot: T22_2
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-12
- 語り: "よく知られた筋を書いたのは、家康の家臣、大久保忠教の、『三河物語』だ。"
  shot: T16_3
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-12
- 語り: "信康の妻で、信長の娘の徳姫が、12か条を書き、重臣の酒井忠次に持たせて、信長へ送った。"
  shot: T15_4
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-12
- 語り: "信長は、10か条を、一つずつ忠次に尋ねた。忠次は、すべて認めた。"
  shot: T12_5
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-12
- 語り: "信長は、残りの2か条を開かずに、こう言ったという。腹を切らせよと、家康に伝えよ。"
  shot: T08_6
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-13
- 語り: "だが、『三河物語』の草稿ができたのは、1622年。事件から、43年後だ。仕上がりは1626年とみられ、47年後になる。"
  shot: T16_7
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-12
- 語り: "しかも同じ箇所は、手紙の年を、丑の年と書く。1579年は、卯の年。丑の年なら、2年前、1577年だ。"
  shot: T12_8
  tone: しみじみ
  pause: 0.12
- 語り: "では、その夏の家臣の日記には、家康の、どんな動きが残るのか。"
  shot: T07_9
  tone: 疑問
  pause: 0.15
