# 物語完結型ショート 改易 s3（2026-11-26）。本編 scripts/kaieki-story.yaml（12/2 12:00 公開予定、https://youtu.be/G-kXIiOdUrU）から。12/3 13:30 に予約。
# 形式は nakasendo_s1〜s5・majogari_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 江戸の改易_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/kaieki/main/ の K）の切り出しだけ。新しい絵は作らない。
# 切り口：会津の蒲生家、兄の忠郷と弟の忠知が2人とも跡継ぎなく亡くなり絶えた（本編 第3章、kaieki-27・52・12・13）。
# hook＝跡継ぎのない大名家はどうなったか（答えはこのショートの中）。tease＝幕府はなぜ末期養子の禁を慶安4年に緩めたか（答えは本編 第6章：牢人を生む改易を減らすため＝通説、と研究で割れる。kaieki-33・34・35）。
# 数え直し：寛永4年＝1627、寛永11年＝1634、1634−1627＝7年。忠知の石高は福田の「伊予松山24万石」（日本人名大辞典は松山20万石＋日野4万石＝24万石で合計は同じ）。月日は言わない。
# 理解テスト：①会津60万石の蒲生家の話 ②1627年に兄の忠郷、1634年に弟の忠知が、跡継ぎのないまま亡くなった ③幕府は末期養子を認めず、会津60万石を取り上げ、弟には伊予松山24万石で家を継がせた ④弟も跡継ぎなく亡くなり、蒲生家は絶えた。跡継ぎがいないことは改易の理由でいちばん多かった（福田、75件）
title: "改易｜蒲生家の2度の死"
yt_title: "跡継ぎのない死が2度　会津60万石の蒲生家は、兄と弟が7年のうちに亡くなり、絶えた"
description: |-
  会津60万石の蒲生家では、寛永4年、1627年、当主の蒲生忠郷が跡継ぎのないまま亡くなりました。江戸の初め、幕府は、跡継ぎのいない当主が死の間際に急いで願い出る養子、末期養子を認めていませんでした。
  幕府は会津の60万石を取り上げましたが、弟の忠知が、伊予の松山24万石で家を継ぐことを許されます。けれど寛永11年、1634年の8月18日、その忠知も30歳で、跡継ぎのないまま亡くなり、蒲生家は絶えました。
  歴史学者の福田千鶴が、1708年までの106年間を数えると、跡継ぎがいないことによる大名の改易は75件。改易の理由の中で、いちばん多いものでした。
  本編では、江戸幕府に取りつぶされた大名の数と、いちばん多かった理由、そして数が減っていったわけを、研究ごとの数字で積み上げています。本編は概要欄のリンクからどうぞ。
