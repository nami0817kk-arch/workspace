  pause: 0.12
  # fact: rosetta-B12
- 語り: "1802年の秋のはじめ、スウェーデンの外交官、オーケルブラードが、『ロゼッタのエジプト碑文に関する手紙』を出す。29字の、デモティックの字母を、作った。"
  shot: C12_3
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-B12
- 語り: "およそ半分が、音として当たっていた。"
  shot: C12_4
  tone: 重い
  pause: 0.12
  # fact: rosetta-B12
- 語り: "けれど、デモティックは、全部アルファベット、と、固く信じていた。意味を表す字が混ざっている、という点を、見抜けず、行き止まりになる。"
  shot: C12_5
  tone: 重い
  pause: 0.12
  # fact: rosetta-B13
- 語り: "1802年11月、彼は、ハーグの公使館書記官に任命され、パリを去る。次の突破まで、十年あまり。"
  shot: C06_6
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-B16
- 語り: "1814年の夏、イギリスの、海べの町で、1人の医者が、石に向かった。その人は、誰か。"
  shot: C14_7
  tone: 疑問
  pause: 0.15
