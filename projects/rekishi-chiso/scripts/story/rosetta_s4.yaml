# 本編の最後の「解いたのは誰か」の答えは、このショートでは明かさない。
title: "ロゼッタストーン｜神秘の文字という思い込み"
yt_title: "ヒエログリフは「神秘的な意味を隠した文字」と信じられていた　フランスの辞典は1835年まで　1802年の最初の突破が行き止まりになった理由"
description: |-
  フランスのアカデミー辞典は、1835年まで、ヒエログリフを、何か神秘的な意味を含む文字、と定義していました。解読の13年後です。
  1802年の秋のはじめ、スウェーデンの外交官オーケルブラードは、29字のデモティックの字母を作り、およそ半分が音として当たっていました。けれど、デモティックは全部アルファベット、と固く信じていたため、行き止まりになります。
  次の突破は、1814年の夏、イギリスの海べの町で、1人の医者が石に向かったときでした。その医者とは誰か。本編は概要欄のリンクからどうぞ。
  https://youtu.be/ULryhFAAhgQ
