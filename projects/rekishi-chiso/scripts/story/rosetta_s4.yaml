lines:
  # fact: rosetta-B01
- 語り: "ヒエログリフは、神秘的な意味を隠した文字だ。そう信じられた時代が、長く続いた。"
  shot: C13_1
  tone: 強調
  pause: 0.12
  # fact: rosetta-B01
- 語り: "フランスのアカデミー辞典は、1835年まで、ヒエログリフを、何か神秘的な意味を含む文字、と定義していた。解読の13年後だ。"
  shot: C15_2
