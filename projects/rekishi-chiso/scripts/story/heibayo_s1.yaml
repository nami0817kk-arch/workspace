lines:
  # fact: heibayo-A26
- 語り: "兵馬俑の、第一発見者は、誰なのか。博物院は、2015年の時点で、誰も認めていなかった。"
  shot: A02_1
  tone: 強調
  pause: 0.12
  # fact: heibayo-A24
- 語り: "1974年3月。陝西省、西楊村。始皇帝陵の東、約1.5キロで、村人たちが、井戸を掘っていた。"
  shot: A02_2
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A23
- 語り: "井戸の底から出てきたのは、陶器の人の、上半身だった。"
  shot: A03_3
  tone: 重い
  pause: 0.12
  # fact: heibayo-A25
- 語り: "発見者の人数も、割れる。2015年の記事には3人、2003年の地元紙には、申請された9人の名前が載った。"
  shot: A05_4
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A26
- 語り: "博物院の担当者は、どの人も、秦俑の発見人と、認めたことはない、と答えている。"
  shot: A05_5
  tone: 重い
  pause: 0.12
  # fact: heibayo-A27
- 語り: "作家の岳南は、もう掘るな、と言ったのは、水管員の房樹民だ、と書く。"
  shot: A02_6
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A27
- 語り: "一方、岳南によれば、第一人だ、としたのは、文化館の趙康民。名乗りは、重なったままだ。"
  shot: C01_7
  tone: 重い
  pause: 0.12
  # fact: heibayo-A28
- 語り: "趙康民は、破片を集めて、2体の武士俑を復元し、秦の俑だと鑑定した、と、澎湃新聞は書く。"
  shot: C01_8
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A23
- 語り: "発見の日も、記事によって、違う。では、井戸の日は、いつなのか。"
  shot: A03_9
  tone: 疑問
  pause: 0.15
