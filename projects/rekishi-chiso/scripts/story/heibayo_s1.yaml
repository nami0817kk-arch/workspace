title: "兵馬俑｜第一発見者は、誰も認められていない"
yt_title: "兵馬俑を見つけたのは、井戸を掘っていた農民たち　ところが第一発見者を、博物院は誰も認めていなかった　名乗りが重なる1974年"
description: |-
  兵馬俑は、1974年3月、陝西省の西楊村で、井戸を掘っていた村人たちが見つけました。ところが、第一発見者が誰なのか、秦始皇帝陵博物院は、2015年の時点で、誰も認めていませんでした。
  発見者の人数は、資料で割れます。名乗りも重なったままです。
  発見の日も、記事によって違います。本編は概要欄のリンクからどうぞ。
  https://youtu.be/Q89Ua_ST728
