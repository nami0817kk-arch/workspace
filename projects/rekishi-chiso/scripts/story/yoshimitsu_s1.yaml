lines:
  # fact: yoshimitsu-09
- 語り: "死の時刻が、割れる。足利義満が亡くなった時刻を、記録は、午後3時から9時まで、バラバラに書く。"
  shot: S06_in5
  tone: 強調
  pause: 0.12
  # fact: yoshimitsu-06
- 語り: "1408年5月6日。義満は、北山第で亡くなった。享年、数えで51。"
  shot: SEND_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-06
- 語り: "法名は、道義。号は、鹿苑院。西暦では、5月31日ごろだ。"
  shot: S01_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "当時は、一日を十二の刻に分けた。申の刻は午後3時から5時、酉の刻は5時から7時、戌の刻は7時から9時だ。"
  shot: S12_left4
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "教言卿記は、申の斜め。続史愚抄は、申の刻。午後3時から5時ごろだ。"
  shot: S06_left6
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "ところが、鹿苑院殿薨葬記と追善記は、酉の刻。午後5時から7時ごろだ。"
  shot: S12_right6
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "飛鳥井雅縁は、戌の時ばかり、と書く。午後7時から9時ごろだ。"
  shot: S02_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "いちばん早い記録と、いちばん遅い記録では、刻の幅で数えて、最大で6時間、開く。"
  shot: SEND_right3
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-09
- 語り: "同じ年の、同じ日の死なのに、書き手が違うと、時刻が違う。"
  shot: S12_right5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-07
- 語り: "では、その夜、義満の遺体は、どうなったのか。"
  shot: S06_in4
  tone: 疑問
  pause: 0.15
