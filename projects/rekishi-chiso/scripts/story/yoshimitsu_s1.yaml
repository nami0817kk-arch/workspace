title: "足利義満｜死の時刻が、記録で割れる"
yt_title: "足利義満が亡くなった時刻　日記は午後3時から9時まで割れる　最大6時間のずれ"
description: |-
  1408年、応永15年5月6日。金閣を建てた足利義満は、北山第で亡くなりました。ところが、亡くなった時刻は、記録によって割れます。
  教言卿記は申の斜め、続史愚抄は申の刻で、午後3時から5時ごろ。鹿苑院殿薨葬記と追善記は酉の刻で、午後5時から7時ごろ。飛鳥井雅縁は戌の時ばかり、午後7時から9時ごろ。いちばん早い記録と遅い記録で、刻の幅で数えて最大6時間、開きます。
  教言卿記は、後鑑などの引用を通して読んだものです。その夜、遺体はどうなったのか。本編は次のリンクからどうぞ。
  https://youtu.be/6dJB0Rq7yeY
