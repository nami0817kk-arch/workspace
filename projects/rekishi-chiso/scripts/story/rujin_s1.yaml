# 形式は choujou_s1〜s5・ashigaru_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 八丈島の流人の暮らし_facts_20261126.yaml）だけ。
