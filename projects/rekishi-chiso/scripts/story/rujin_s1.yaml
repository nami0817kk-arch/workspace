# 切り口：牢屋なし・くじの村割り・五人組・配給なし（本編 序章・第2章・第3章、rujin-12・21・23・24・39）。宇喜多秀家は出さない。
# hook＝島流しの流人は牢屋に入ったか（答えはこのショートの中：入らず、村で島の人と暮らした。その代わり食べ物の支給なし）。
# tease＝家を持てた流人と小屋で暮らした流人の分かれ目は何か（答えは本編 第2〜3章：食べ物と仕送り、rujin-22・30）。
# 「冬」は八丈実記 天保5年の記録の「冬期」（山本 1961 p96 の言葉）で、和暦の月から季節を出したものではない。
# 理解テスト：①八丈島の流人の暮らしの話 ②江戸時代、八丈島（くじで村へ、五人組に預ける） ③牢屋に入れず島の人と暮らさせ、食べ物は配らない ④草や海藻、漁の手伝いの魚で食いつないだ
title: "八丈島の流人｜牢屋なし、配給なし"
yt_title: "島流しの流人は、牢屋に入れられなかった　八丈島で、くじで村に割り振られ、食べ物の支給もなく暮らした毎日"
description: |-
  江戸時代、八丈島へ島流しにされた流人は、牢屋に入れられませんでした。島に着くと、流人村割帳という、帳面で島の村へ割り振られ、名主の家などで掟を言い渡されて、村の五人組に預けられました。伊豆の島々の文書には、村はくじを引いて決める、とあります。
  その代わり、扶持と呼ばれる食べ物の支給はありません。自分で稼いで食べる、自活が決まりでした。仕事のない流人には百姓の畑を手伝わせ、それもできない流人は、村の百姓が順番に養いました。貧しい流人は、山や野の草と海藻を食べ、漁があれば浜で手伝って、魚をもらいました。
  本編では、三宅島での風待ちから、飢饉の年、流人の仕事、水汲み女、島抜け、赦免を待つ日々まで、島に残った帳面と流人の記録でたどっています。本編は概要欄のリンクからどうぞ。
