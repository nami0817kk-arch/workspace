  pause: 0.12
  # fact: rujin-19, rujin-07
- 語り: "八丈島は、今の東京から、南へ300キロ近く。江戸時代から明治の初めまでに、送られた流人の記録は、1887人分ある。"
  shot: R01_2
  tone: しみじみ
  pause: 0.12
  # fact: rujin-12, rujin-21
- 語り: "島に着いた流人は、流人村割帳という、帳面で、村へ割り振られた。伊豆の島々の文書には、村は、くじを引いて決める、とある。"
  shot: R05_3
  tone: しみじみ
  pause: 0.12
  # fact: rujin-12, rujin-39
- 語り: "村では、名主の家などで掟を言い渡され、五人組に預けられた。島抜けをしない限り、ゆるやかな扱いだった。"
  shot: R06_4
  tone: しみじみ
  pause: 0.12
  # fact: rujin-23
- 語り: "ただし、扶持と呼ばれる、食べ物の支給は、ない。自分で稼いで食べる、自活が、決まりだった。"
  shot: R08_5
  tone: 重い
  pause: 0.12
  # fact: rujin-23
- 語り: "仕事のない流人は、百姓の畑を手伝う。それもできない流人は、村の百姓が、順番に養った。"
