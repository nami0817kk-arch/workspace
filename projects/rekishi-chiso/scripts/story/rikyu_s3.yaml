# 物語完結型ショート 千利休 s3（2026-10-28）。本編 scripts/rikyu-story.yaml の第2章（大徳寺の三門 金毛閣・公に示された罪）と第3章の『近古史談』から。投稿しない。
# 形式は kazumasa_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/rikyu/main/R*.jpg・K05）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/千利休_facts_20261028.yaml）：rikyu-01・02・03・05・12・13・14・15
#   ・金毛閣は利休の寄進で完成（山本兼一、プレジデント 2009。rikyu-02）→ 作家の名で言う。
#   ・公に示された罪＝秀吉と天皇への不敬（山門の造営と木像の安置もここに入る）・茶道具の不当な売買（福井幸男 2011 の抄録。rikyu-05）→ 福井さんの名で言う。
#   ・『近古史談』（大槻磐渓、江戸時代の終わりごろ）「山門は天子を始として通らせ給ふ頭上にしかする事、無禮なり」（rikyu-12）。娘の話は外した（長さ）。
#   ・今の像は2代目：頭は天保11年、体は明治2年・田中浄慶（rikyu-13）。2026年10月14日からの東京国立博物館「大徳寺」展で初公開（rikyu-14）。
#   ・画面で『』「」が行末に割れたので、金毛閣の名と『』を語りから外した（description には残す）。
#   ・s2（磔の場面）と重ならないよう、磔は1文だけ。
# 理解テスト4問：
#   ①誰の話か：千利休（秀吉に仕えた茶人）と、大徳寺の門の上の木像
#   ②いつ・どこで何が：利休の寄進で完成した大徳寺の三門の上の階に、利休の木像が置かれ、天正19年に秀吉がそれを召し上げて磔にした
#   ③なぜ罪になったか：公に示された罪は秀吉と天皇への不敬（門を造って像を置いたことも入る）と茶道具の不当な売買。『近古史談』は、天子も通る門の頭上に像を置くのは無礼、と書く
#   ④どうなったか：秀吉は木像を磔にし、同じ月に利休も世を去った。本当の理由は今もはっきりしない。いま門の上の像はのちに作り直された2代目で、2026年に東京国立博物館で初めて公開された（天保11年・明治2年の年は語りでは言わず、概要欄に書いた）
title: 千利休｜門の上の木像は、なぜ罪になった
yt_title: 千利休を死に追いやった「門の上の木像」　寄進がなぜ罪に変わったのか
description: |-
  京の大徳寺の三門。その上の階「金毛閣」は、千利休の寄進で完成したと、作家の山本兼一さんは書いています。その上の階に、利休の姿を写した木像が置かれました。
  天正19年、豊臣秀吉はこの木像を召し上げ、京の一条戻橋で磔にしました。
  桃山学院大学の福井幸男さんは、公に示された罪を、秀吉と天皇への不敬（門を造って木像を置いたことも含む）と、茶道具の不当な売買、とまとめています。江戸時代の終わりごろの本、近古史談は、天子も通る門の頭上に像を置くのは無礼だ、と書きました。
  磔にされた初代の像は残っていません。いま門の上にある像は2代目で、頭は天保11年、体は明治2年に田中浄慶が作ったものです。この像は、2026年、東京国立博物館の特別展「大徳寺」で初めて公開されました。
