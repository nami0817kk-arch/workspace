lines:
  # fact: ii-16
- 語り: "大老を守る侍たちは、すぐには、刀を抜けなかった。なぜか。"
  shot: I05_1
  tone: 強調
  pause: 0.12
  # fact: ii-58
- 語り: "1860年の3月3日。紀州に伝わった写しによれば、江戸は、ちょうど大雪の最中だった。"
  shot: I01_2
  tone: しみじみ
  pause: 0.12
  # fact: ii-43
- 語り: "大老、井伊直弼の行列は、外桜田の屋敷を出て、江戸城の桜田門へ向かっていた。"
  shot: I03_3
  tone: しみじみ
  pause: 0.12
  # fact: ii-19, ii-22
- 語り: "そこへ、18人が襲いかかる。『堤蟻叢書』によれば、合図は、ピストルだった。"
  shot: TH_4
  tone: 重い
  pause: 0.12
  # fact: ii-16
- 語り: "守る側は、雪よけの合羽を着て、刀の柄には、袋をかぶせていた。柄袋だ。"
  shot: I05_5
  tone: 重い
  pause: 0.12
  # fact: ii-16
- 語り: "このことは、紀州の写しも、捕まった浪士の話も、書いている。立場の違う記録が、ここでは一致する。"
  shot: I09_6
  tone: しみじみ
  pause: 0.12
  # fact: ii-15
- 語り: "近くの、上杉家の屋敷の番人は、こう届けた。けがをした井伊家の侍が1人、番所の前に走ってきた。"
  shot: I08_7
  tone: しみじみ
  pause: 0.12
  # fact: ii-15
- 語り: "問いかけにも答えず、黒い羅紗の柄袋を投げ捨てて、刀を抜いて、現場へ駆け戻った。番所には、その柄袋が、残されている。"
  shot: I08_8
  tone: 重い
  pause: 0.12
  # fact: ii-17
- 語り: "斬り合いは、時計で、3分ばかりだった、と書き留めは言う。"
  shot: I07_9
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第2章（ii-20）
