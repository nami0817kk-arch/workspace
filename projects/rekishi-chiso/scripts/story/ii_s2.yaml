# 理解テスト：①桜田門外の変で大老を守った侍たちの話 ②1860年3月3日、大雪の朝、桜田門へ向かう途中 ③合羽と柄袋で刀を抜けず、1人は柄袋を投げ捨てて駆け戻った ④斬り合いは時計で3分ばかり
title: "桜田門外の変｜抜けなかった刀"
yt_title: "桜田門外の変　大老を守る侍たちは、すぐには刀を抜けなかった　上杉家の番所に残された「柄袋」"
description: |-
  1860年3月3日、大雪の朝。大老・井伊直弼の行列が襲われたとき、守る側の侍たちは、すぐには刀を抜けませんでした。雪よけの合羽を着て、刀の柄には袋（柄袋）をかぶせていたからです。紀州に伝わった写しも、捕まった浪士の話も、そう書いています。
  近くの上杉家の屋敷の番人は、けがをした井伊家の侍が番所の前で黒い羅紗の柄袋を投げ捨て、刀を抜いて現場へ駆け戻った、と届けました。斬り合いは「時計で三分ばかり」と『堤蟻叢書』の書き留めにあります。
  本編では、駕籠の中の大老の最期をめぐる、守った側と襲った側の話の食い違いをたどっています。本編は概要欄のリンクからどうぞ。
