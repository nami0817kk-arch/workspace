# 物語完結型ショート もしも鎖国 s1（2026-11-17）。本編 scripts/sakoku-if-story.yaml（11/21 19:00 公開予定、https://youtu.be/7dL7AYzb7zI）から。11/22 9:30 に予約。
# 形式は titanic_s1〜s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/鎖国if_facts_20261116.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/sakoku_if/main/ の B01〜B25・T01）の切り出しだけ。新しい絵は作らない。B22（西洋船に見える）は使わない。B23（イギリスの旗）はイギリスの話だけ。処刑・惨状・顔は絵にしない。
# 切り口：1624年、スペインの使節は薩摩で待たされ「会わない」と告げられた（本編 第2章・分岐1）。もしもの行は「ここからは、もしもの話」と言ってから、本編の見立て（争いだったかもしれない）だけ。
# 計算（自分で数え直した）：ソテロが捕まった1622年は断交1624年の2年前。
title: "スペイン｜1624年、使節は薩摩で待たされた"
yt_title: "1624年、スペインの使節は薩摩で待たされ、幕府に「会わない」と告げられた　もしも取引を続けていたら"
description: |-
  1624年、スペインの使節は、薩摩で待たされた末に、幕府から、会わない、と告げられました。理由は、通商を口実に、キリスト教が広まるのを望まない、というものでした。
  次の総督シルバは、国王あての手紙に、使節は大きな費用をかけたのに、受け取ってもらえずに戻った、と書いています。
  後半は「もしも」の話です。記録ではなく、考え方の整理です。本編では、3つの分かれ目を順にたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/7dL7AYzb7zI
