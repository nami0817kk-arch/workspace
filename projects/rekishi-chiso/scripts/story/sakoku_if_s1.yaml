lines:
  # fact: sakokuif-02
- 語り: "スペインの使節は、薩摩で待たされた末に、会わない、と告げられた。1624年のことだ。"
  shot: B09_1
  tone: 強調
  pause: 0.12
  # fact: sakokuif-02
- 語り: "前の年の1623年、フィリピンの総督、ファハルドが、新しい国王の即位を知らせ、通商の取り決めを結ぶために、送った使節だった。"
  shot: B08_2
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-02
- 語り: "幕府が挙げた理由は、通商を口実に、キリスト教が広まるのを望まない、というものだった。"
  shot: B24_3
  tone: 重い
  pause: 0.12
  # fact: sakokuif-03
- 語り: "次の総督シルバは、国王あての手紙に書く。使節は、大きな費用をかけたのに、受け取ってもらえずに戻った。"
  shot: B10_4
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-04
- 語り: "断交の2年前、1622年には、宣教師のソテロが、マニラから薩摩へ潜り込もうとして、捕まっていた。"
  shot: B09_5
  tone: 重い
  pause: 0.12
  # fact: sakokuif-13
- 語り: "1628年には、スペインの艦隊が、シャムで、長崎の商人の朱印船を焼いた。"
  shot: B11_6
  tone: 重い
  pause: 0.12
- 語り: "ここからは、もしもの話。もしも幕府が、使節に会い、取引を続けていたら。"
  shot: B07_7
  tone: 疑問
  pause: 0.12
  # fact: sakokuif-10
- 語り: "マニラの総督も、日本人を3千人までに抑えようとしていた。その先にあったのは、豊かな日本人町より、争いだったかもしれない。"
  shot: B08_8
  tone: しみじみ
  pause: 0.12
- 語り: "スペインの次の分かれ目で、幕府は、何を選んだのか。"
  shot: B06_9
  tone: 疑問
  pause: 0.15
