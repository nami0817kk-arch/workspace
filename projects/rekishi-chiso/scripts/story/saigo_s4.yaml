# 切り口：首の行方（本編6章）。記録の言葉で淡々と・傷や遺体の描写は避ける。千田の履歴書は原文未見（孫引き）なので「と書く」。saigo-03, 17, 13, 14, 26。
# 理解テスト4問：①西郷隆盛の首 ②1877年9月24日のうちに東伏見少将の電報が首のことを伝えた。のちの記録は埋めた場所が割れる ③第4旅団日記は折田庄輔の屋敷、千田登文の履歴書は門わきの小さな溝、折田庄助邸の前の溝とする記事、『西南記伝』は9説 ④首を埋めた人は分かっていない。切腹の話はいつ生まれたか（本編へ）
title: "西郷隆盛｜首の行方は、記録で割れる"
yt_title: "西郷隆盛の首はどこにあったのか　折田邸か、門わきの溝か　千田登文の履歴書と『西南記伝』の9説"
description: |-
  西郷隆盛の首の行方は、記録によって割れます。1877年9月24日のうちに打たれた東伏見少将の電報には、西郷を追った安村中尉が手負いとなり、首を取りかねたのは残念、とあります。
  第4旅団の日記は、のち士族折田庄輔の屋敷で、首を得た、と書きます。金沢で見つかった千田登文の履歴書は、門わきの小さな溝に埋めてあるのを見つけた、と書き、2014年に大野敏明さんの本になりました。折田庄助邸の前の溝とする記事もあり、屋敷の主の名の字も割れています。日本語版ウィキペディアの注は、折田邸の門前説が最有力で、『西南記伝』は9説を挙げる、と書きます。
  千田の履歴書は、事件から半世紀ほど後に書かれたもので、原文は確かめられていません。紹介された文章から読んでいます。首を埋めた人は、分かっていません。電報・日記は、アジア歴史資料センターの内容欄の翻刻を読んだもので、原画像までは確かめていません。翻刻には誤字や欠けがあります。
  では、切腹の話は、いつ、生まれたのか。本編は概要欄のリンクからどうぞ。
