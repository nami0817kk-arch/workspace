lines:
  # fact: kakeizu-76, kakeizu-11
  - 語り: 1868年、将軍は、15代の慶喜で終わった。では、徳川の家を、継いだのは誰か。
    shot: Moat
    tone: 疑問
    pause: 0.12
  # fact: kakeizu-13, kakeizu-110
  - 語り: 慶喜ではない。継いだのは、《!数えで6歳》の男の子、田安亀之助だった。
    shot: Child
    tone: 強調
    pause: 0.12
  # fact: kakeizu-10
  - 語り: 亀之助は、1863年、江戸の田安家に、三男として生まれた。
    shot: K07
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-110
  - 語り: 14代将軍の家茂は、もしものときの跡継ぎに、亀之助を挙げていた、と伝わる。
    shot: K02
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-112
  - 語り: 1943年の、和宮の伝記には、家茂の死の知らせが届いた日に、天璋院が、亀之助を推すことを、和宮に尋ねた、とある。
    shot: Tenshoin
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-13
  - 語り: けれど、1866年に、徳川の家を継いだのは、慶喜だった。
    shot: Yoshinobu
    tone: 重い
    pause: 0.12
  # fact: kakeizu-11
  - 語り: 2年後の、閏4月29日。江戸城で、宗家の跡継ぎは、亀之助と、伝えられた。受け取ったのは、代理の人だった。
    shot: K10
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-13, kakeizu-116
  - 語り: 年齢は、函館市史が6歳、静岡新聞は5歳と書く。満では、4歳と10か月近くだ。
    shot: K15
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-10, kakeizu-13
  - 語り: 亀之助は、名を家達と改める。徳川宗家の、《16代目》だ。
    shot: Child2
    tone: 重い
    pause: 0.3
    dip: true
  - 語り: では、6歳の当主に、新政府が渡した領地は、どれほどだったのか。
    shot: K08
    tone: 疑問
    pause: 0.15
