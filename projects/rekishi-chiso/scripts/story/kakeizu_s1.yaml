# 物語完結型ショート 徳川将軍家 s1（2026-11-06）。本編 scripts/tokugawa-kakeizu-story.yaml（11/7 19:00 公開、https://youtu.be/VrUQJ4sBdyA）の序章・第1章から。11/8 9:30 公開。
# 形式は oguri_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。
# 絵は本編の AI 絵（out/story/kakeizu/main。既存の絵の写し。人物なし）と実在の写真（家達の少年時代・天璋院・慶喜・江戸城の堀）。新しい絵は作らない。
#   使わない絵：K05（ガラスのろうそく立て＝oguri O12）・K01（下に貨車のような物）・K12/KEND（左下の看板）。
# 切り口：将軍のあと家を継いだのは数え6歳の田安亀之助。領地（s2）・十六代様（s3）・慶喜家（s4）・18代（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/徳川将軍家_facts_20261105.yaml）：kakeizu-10・11・13・110・112・116。言い方は本編のまま。
#   ・年齢を計算し直した：文久3年7月11日＝1863年8月24日生まれ。閏4月29日＝1868年6月19日 → 満4歳9か月余（「4歳と10か月近く」）、数え6歳（1863年を1歳）。本編どおり。
#   ・1866年（家茂の死）に数え4歳（1863＝1 → 1866＝4）。本編どおり。
#   ・慶喜が将軍になったのは慶応2年12月5日＝1867年1月10日なので、1866年は「家を継いだ」とだけ言う（本編の「このとき家を継ぎ、将軍になった」は西暦では年をまたぐ）。
#   ・家茂が亀之助を挙げていた話は「と伝わる」（本編と同じ）。和宮の伝記は1943年の本と言ってから引く。
# 理解テスト4問：
#   ①誰の話か：将軍のあと徳川の家を継いだ、田安亀之助（のちの家達）
#   ②いつ・どこで何が：1868年閏4月29日、江戸城で、新政府が宗家の跡継ぎを亀之助と伝えた
#   ③なぜその子か：家茂が跡継ぎに挙げていたと伝わり、1866年には天璋院が和宮に亀之助を推す相談をしていた
#   ④どうなったか：亀之助は家達と名を改め、徳川宗家の16代目になった
title: 徳川将軍家｜将軍のあとを継いだ、数え6歳
yt_title: 将軍が15代で終わったあと、徳川の家を継いだのは数え6歳の男の子だった　田安亀之助が16代目になるまで
description: |-
  将軍は15代の慶喜で終わりました。では、徳川の家を継いだのは、誰だったのか。
  1868年閏4月29日、新政府は江戸城で、徳川宗家の跡継ぎを田安亀之助と伝えました。亀之助は1863年、御三卿の田安家に三男として生まれた子です。14代将軍の家茂は、もしものときの跡継ぎに亀之助を挙げていたと伝わり、1943年の和宮の伝記には、家茂が亡くなった知らせが届いた日に、天璋院が亀之助を推すことについて和宮に意見を尋ねた、とあります。継いだときの年齢は、函館市史が6歳、2025年の静岡新聞は5歳と書きます。生まれた日から数えると満4歳と10か月近く、6歳は数え年です。亀之助は名を家達と改め、徳川宗家の16代目になりました。
  6歳の当主に、新政府が渡した領地はどれほどだったのか。本編は概要欄のリンクからどうぞ。
