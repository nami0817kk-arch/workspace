# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしも鶴松が生きていたら（scripts/tsurumatsu-if-story.yaml）。chiso/storymain.py が読む。
# 11-05 作成（11/7 12:00 公開）。france_main_look.yaml・hidetsugu_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：この回は新しい AI 絵を作っていない（11/5、Cloudflare FLUX の無料枠が切れていた。Chrome・Gemini は使わない指示）。
#   前の回の Gemini の絵（16:9・1376×768）を out/story/tsurumatsu-if/main/ に T01〜T28 として写した（out/ は git に入らない。無ければ下の表から写し直す）。
#   T01=yodo/Y06（茶々と産着の赤子）T02=hideaki/H05（川沿いの城下）T03=kazumasa/K05（秀吉）T04=yodo/Y05（祈る茶々）T05=rikyu/R05（禅寺の門）
#   T06=kazumasa/K16（仏前の人々の後ろ姿）T08=hideaki/H02（湾に面した城下。湾に今の養殖の筏に見える物があり、使わない）T09=hideaki/H10（巻紙の手元）T10=hidetsugu/H06（机の文書）
#   T11=yodo/Y10（大仏殿の普請）T12=hidetsugu/H02（高野山の山道）T13=hidetsugu/H05（書状を読む秀次）T14=hidetsugu/H10（三条河原の遠景）
#   T15=hidetsugu/H11（聚楽第の取り壊し）T16=hideaki/H04（霧の谷と陣）T17=yodo/Y13（煙の上がる大坂城）T18=yodo/Y12（壊れた城の奥の部屋）
#   T19=rikyu/R13（寺の庭）T20=yodo/Y15（夕暮れの石垣と堀）T22=hideaki/H03（街道を急ぐ使者）T23=hidetsugu/H13（五輪塔の列）
#   T24=rikyu/R14（夕暮れの水辺・右を空けた構図。終了画面）T25=yodo/Y08（金の襖の広間）T27=hidetsugu/H01（秀次）T28=hidetsugu/H09（杉木立）
#   使わなかったもの：T07（jingi/J11、白い腰掛けが今の物に見える）・T21・T26・T29・T30（神社のしめ縄）。1本 25 枚まで。
#   実在の人物の顔は、実在の肖像（額）か、前の回で作った想像図（秀吉 T03・秀次 T27・茶々 T01/T04/T25）だけ。戦・処刑の場面は遠景だけ。
