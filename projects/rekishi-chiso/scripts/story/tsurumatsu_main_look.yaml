  - {type: quote, from: 71, to: 71, label: 史料, text: 大唐関白、秀次へ譲らるべく候／都の廻り百ヶ国を御渡し, source: 秀吉の覚書（天正20年5月18日。『群書類従』所収。読み下し）}
  - {type: quote, from: 89, to: 89, label: 史料, text: 御ひろい様へたいし奉り／聊か表裏別心を存ぜず, source: 石田三成・増田長盛 連署血判起請文（文禄4年7月12日）}
  - {type: quote, from: 133, to: 133, label: 要点, text: 鶴松のおもちゃの船／いまも京都・妙心寺玉鳳院に, source: 文化庁 国指定文化財等データベース「木造玩具船 豊臣棄丸所用」}

