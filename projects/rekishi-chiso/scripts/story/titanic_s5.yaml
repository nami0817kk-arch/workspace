  shot: S18_4
  tone: しみじみ
  pause: 0.12
  # fact: B-07
- 語り: "船のボートは、20隻。定員の合計は、英国の報告書で、1,178人だった。"
  shot: S08_5
  tone: しみじみ
  pause: 0.12
  # fact: B-09
- 語り: "それでも、規則違反ではない。1894年の規則は、1万トン以上の船を、16隻で打ち止めにしていた。タイタニックは、その容積の、2.06倍を、積んでいた。"
  shot: S16_6
  tone: 重い
  pause: 0.12
  # fact: B-08
- 語り: "アメリカ上院は、ボートの定員を使い切らなかったことを、数百人の命の、無駄な犠牲、と呼んだ。"
  shot: S17_7
  tone: 重い
  pause: 0.12
  # fact: C-13
