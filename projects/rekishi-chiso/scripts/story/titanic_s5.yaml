description: |-
  タイタニックの最初のボート、7号艇は、英国の報告書で12時45分ごろに降ろされました。定員65人に、乗っていたのは27人です。1号艇は、定員40人に12人でした。
  英国の報告書は、凪の海でこれほど満たずに出したのは説明が難しい、と書いています。ボートの数そのものは、1894年の規則を満たしていました。アメリカ上院は、定員を使い切らなかったことを、数百人の命の無駄な犠牲、と呼びました。
  本編では、衝突から沈没までの2時間40分を、無線の記録と英米2つの調査から、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
