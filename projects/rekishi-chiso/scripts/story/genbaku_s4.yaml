# 切り口：松代の地下壕（皇居・大本営の移転先）が終戦までに約8割できていたこと、大磯の坂田山の砲台に大砲が無かったこと、準備は正味4か月。
#   本編の答え（降伏の時期の割れ方・もしもの世界の行方）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/原爆if_facts_20261107.yaml）：genbaku-35・36・68・73・75。言い方は本編のまま。
# 計算（自分で計算し直した）：1944年11月11日→1945年8月15日＝9か月4日（約9か月）。松代の完成は長野市の頁で約8割（県政史は約75%と割れる→言わない）。
# 理解テスト4問：
#   ①誰の話か：終戦間際の日本の軍。松代の地下壕と、神奈川県大磯の陣地
#   ②いつ・どこで何が：1944年11月（長野市は11月11日から）から終戦まで約9か月、長野県の松代に大本営・宮内省・皇居などを移す地下壕を掘った。大磯の坂田山の洞窟の砲台は5月10日ごろから8月上旬に掘り抜いた
#   ③何が分かるか：松代は全体の約8割ができていた。大磯の砲台には大砲も砲弾も無かった。大磯の準備は正味4か月ほど
#   ④どうなったか：3発目の原爆はいつ使えたのか、の問いで閉じる（答えは本編の第6章）
title: 松代大本営｜皇居を移す地下壕は、どこまで出来たか
yt_title: 皇居を移す地下壕は、終戦までにどこまで出来ていたのか　長野の松代と、大砲の無かった大磯の砲台
description: |-
  終戦の前、日本の軍は、大本営や政府を移すための地下壕を、長野県の松代で掘っていました。
  長野市によれば、工事は1944年11月から終戦の日まで（11月11日からとする長野市の頁による）、およそ9か月。働く人と家族1万3千人のための飯場が247棟。移す先には、大本営や宮内省、皇居、日本放送協会や電話局まで、予定されていました。終戦までに、全体の約8割ができていた、と長野市は書いています。
  一方、神奈川県の大磯の坂田山では、洞窟の砲台が、5月10日ごろから掘りはじめられ、8月の上旬に掘り抜かれました。けれど、掘った人の話では、大砲も砲弾も、無かった。大磯を調べた市原誠さんは、この方面の本土決戦の準備は、正味4か月ほどだった、と書いています。
  同じころ、アメリカでは、原爆の準備が進んでいました。3発目は、いつ使えたのか。本編は概要欄のリンクからどうぞ。
