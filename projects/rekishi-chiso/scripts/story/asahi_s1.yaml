# 本編 scripts/asahi-story.yaml（10/27 12:00 公開予約 https://youtu.be/sPSAEWG-FOE）の切り口①：44歳の花嫁は、池鯉鮒の野原で渡された。
# 事実カード：dev/output/rekishi-chiso/research/旭姫_facts_20261026.yaml
#   asahi-03（44歳・家康45歳）／asahi-08（天正14年5月11日、池鯉鮒の西の野で受け渡し。『家忠日記』「池鯉鮒迄御祝言御迎ニ出候、西の野まて請取候」）／
#   asahi-09（輿12丁・釣輿15丁・女性と従者150人あまり。渡辺世祐『豊太閤と其家族』1919年）／asahi-10（12日吉田に1日、14日浜松で婚礼）／
#   asahi-05（天正18年1月14日、48歳で亡くなる）
# 理解テスト4問：
#   ①誰の話か：旭（豊臣秀吉の妹）
#   ②いつ・どこで何が：天正14年5月11日、三河の池鯉鮒の西の野で、秀吉の側から徳川の側へ渡された
#   ③なぜ：秀吉の妹と徳川家康の縁組がまとまり、徳川の家臣・松平家忠が迎えに出て「請け取った」
#   ④どうなったか：14日に浜松で婚礼、家康の妻になった（家康45・旭44）。妻でいたのは4年足らず、48歳で亡くなった
# 絵：AI 絵は新しく作らない。本編の絵（out/story/asahi/main）を縦に切り出す。人物の顔は上の帯（0〜0.21）にかからないよう zoom で下げる。
title: 旭姫｜44歳の花嫁は、野原で渡された
yt_title: 秀吉の妹・旭姫は44歳で、野原の真ん中で家康の家臣に「請け取られた」
description: |-
  天正14年5月11日。豊臣秀吉の妹、旭は、44歳で、三河の池鯉鮒の西の野で、秀吉の側から徳川の側へ渡されました。
  迎えに出た徳川の家臣、松平家忠は、その日の日記に「西の野まで、請け取った」とだけ書いています。
  行列は輿12丁、釣輿15丁、付き従う女性と従者は150人あまり。旭は14日に浜松で婚礼を挙げ、45歳の徳川家康の妻になりました。
  家康の妻でいたのは4年足らず。旭は48歳で亡くなります。
