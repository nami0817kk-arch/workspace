# 物語完結型ショート 大奥の奥女中 s3（2026-11-06）。本編 scripts/ooku-story.yaml（11/8 19:00 公開、https://youtu.be/28M-XkATUuY）の第3章から。11/9 15:30 公開。
# 形式は kakeizu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/ooku/main。FLUX、人物は後ろ姿だけ）と楊洲周延《千代田の大奥》。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：奥女中が自分で雇った使用人「部屋方」と男のゴサイ。給金の表（s2）・オタモンの仕事（s4）には踏み込まない。
#   頼母子講の無尽（ooku-30）は tease の答えとして本編に残す。
# 事実カード：ooku-55・16・77・18・38。言い方は本編のまま。
#   ・御年寄の部屋：局1・側6・タモン4（＋男のゴサイ2）。大岡ませ子の話（『御殿女中』43頁ほか）。本編どおり。
#   ・ゴサイの給金 1年に2両2分、御門の札 御年寄3枚・ませ子1枚。本編どおり。
# 理解テスト4問：
#   ①誰の話か：江戸城の大奥の奥女中と、奥女中が自分で雇った部屋方
#   ②どこで何が：長局の女中の部屋に、部屋方が一緒に住んで働いた。御年寄の部屋には局1・側6・タモン4・男のゴサイ2
#   ③男のゴサイは何をしたか：奥には入れず、入口の詰め所の裏まで来て外の用を足した。出入りには御門の札が要った
#   ④どうなっていたか：いちばん下のお末でさえ召使いを1人使い、長局のひと部屋が小さな家だった
title: 大奥｜女中が女中を雇っていた
yt_title: 大奥の女中は自分で人を雇っていた　御年寄の部屋にいた局・側・タモンと、男のゴサイ
description: |-
  大奥の奥女中は、自分で人を雇っていたのでしょうか。
  雇っていました。部屋方と呼ばれる使用人で、長局の女中の部屋に一緒に住んで働きました。三田村鳶魚の『御殿女中』に残る元女中の大岡ませ子さんの話では、御年寄の部屋には、局が1人、側が6人、炊事をするタモンが4人。ほかに男のゴサイが2人いました。ゴサイは奥の部屋までは来られず、大奥の入口の詰め所の裏まで来て、実家への使いや町の買い物をしました。出入りには御門の札が要り、御年寄は3枚、ませ子さん自身は1枚。ゴサイの給金は1年に2両2分でした。山本博文さんの資料によれば、いちばん下の女中のお末でさえ、召使いを1人使っていたといいます。
  では、一生勤める部屋方のために、主人は何をしてやったのか。本編は概要欄のリンクからどうぞ。
