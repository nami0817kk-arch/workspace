lines:
  # fact: joguo-04
- 語り: "燃え落ちた宮の灰の中に、骨があった。兵たちは、王は死んだ、と思い込んだ。"
  shot: G11_1
  tone: 強調
  pause: 0.12
  # fact: joguo-01
- 語り: "643年11月の1日。『日本書紀』によれば、蘇我入鹿は兵を送り、斑鳩の宮の山背大兄王たちを襲わせた。"
  shot: G09_2
  tone: 重い
  pause: 0.12
  # fact: joguo-02
- 語り: "宮を守ったのは、一人の奴と、数十人の舎人。矢を放って防ぎ、攻め手の将の一人は、その矢に当たって死んだ。"
  shot: G10_3
  tone: 強調
  pause: 0.12
  # fact: joguo-03
- 語り: "その間に、山背は、馬の骨を、寝所に投げ入れておいた。"
  shot: G06_4
  tone: 強調
  pause: 0.12
  # fact: joguo-03
- 語り: "そして、妃と子どもたちを連れて、すきを見て、宮を抜け出す。逃れた先は、生駒山。"
  shot: G18_5
  tone: しみじみ
  pause: 0.12
  # fact: joguo-04
- 語り: "攻め手は、宮に火を放った。焼け跡の骨を見て、兵たちは、囲みを解いて、引き上げていった。"
  shot: G11_6
  tone: 重い
  pause: 0.12
- 語り: "灰の中の骨は、おそらく、山背が投げ入れた、あの馬の骨だった。"
  shot: G18_7
  tone: しみじみ
  pause: 0.12
  # fact: joguo-05
- 語り: "けれど、山の中には、食べるものが無い。一族は、4日か5日、山にとどまった。"
  shot: G12_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第4章（joguo-06・07・10：民を使うまいと断り、山を下りて斑鳩の寺へ）
- 語り: "逃げれば勝てる、と勧められた山背は、このあと、どうしたのか。"
  shot: G13_9
  tone: 疑問
  pause: 0.15
