# 切り口：643年11月、斑鳩宮の襲撃。馬の骨を寝所に投げ入れて生駒山へ逃れ、焼け跡の骨で兵は王が死んだと思い込んだ（本編 第4章、joguo-01〜05）。
#   灰の中の骨が馬の骨だったとは書紀に書かれていないので、本編と同じく「おそらく」と言う。
# hook＝燃えた宮で兵が見つけた骨は何か（答えはこのショートの中：おそらく、山背が寝所に投げ入れた馬の骨）。
# tease＝逃げれば勝てると勧められた山背は、そのあとどうしたか（答えは本編 第4章：民を使うまいと断り、斑鳩の寺へ戻った。joguo-06・07・10）。
# 理解テスト：①聖徳太子の長男、山背大兄王の話 ②643年11月、斑鳩の宮 ③入鹿の兵に襲われ、馬の骨を寝所に投げ入れて、妃と子を連れて生駒山へ逃れた ④兵は宮を焼き、灰の中の骨を見て王は死んだと思い込んで引き上げた。一族は山に4〜5日、食べるものが無かった
title: "山背大兄王｜燃えた宮に残された骨"
yt_title: "燃え落ちた斑鳩宮の灰の中に骨　兵は「王は死んだ」と引き上げた　643年、聖徳太子の長男が逃げのびた方法"
description: |-
  643年11月、『日本書紀』によれば、蘇我入鹿は兵を送り、奈良の斑鳩の宮にいた聖徳太子の長男、山背大兄王たちを襲わせました。
  一人の奴と数十人の舎人が矢で防ぐ間に、山背は馬の骨を寝所に投げ入れ、妃と子どもたちを連れて、生駒山へ逃れます。宮に火を放った兵たちは、灰の中の骨を見て、王は死んだと思い込み、引き上げていきました。
  本編では、山の中で「逃げれば勝てる」と勧められた山背が、そのあと何を選んだのかまでたどっています。本編は概要欄のリンクからどうぞ。
