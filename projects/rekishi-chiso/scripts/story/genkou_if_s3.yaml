# 物語完結型ショート 元寇（もしも）s3（2026-10-31）。本編 scripts/genkou-if-story.yaml（11/3 12:00 公開、https://youtu.be/TfyxJjTTW9Y）から。切り口：博多湾の石の壁（元寇防塁）：台風の前からあった防御
# 形式は jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「時宗想像」「御家人想像」「季長想像」は使わない）。戦闘・負傷・遺体の絵なし。
# 絵は本編の AI 絵（out/story/genkou-if/main/G01〜G15。人物は描かない）と実在の絵（paintings/genkou_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/元寇_facts_20261030.yaml）：genkou-if-34・35・37・60・61・62・64
# ・「北条時宗が九州の御家人に九州へ下るよう命じた」は本編（64）どおり。国ごと交代で博多を守る役（60）。1年のうち3か月ずつは本編にあるが、ここでは尺のため言わない。
# ・石の壁の高さ・幅は文化遺産オンラインの要約（35、出どころ1つ）。築造の始まり・完成は『世界大百科事典』（61）。
# ・最後の問いは本編の結論（台風がなければ、は言い切れない）の手前で閉じる。答えは言わない。
# 理解テスト4問：
#   ①誰の話か：博多湾の石の壁（元寇防塁）と、それを築かせた鎌倉幕府
#   ②いつ・どこで何が：1275年に使者が斬られ、1276年3月ごろ博多湾で石の壁の築造が始まった。2016年に九州大学で石積みが見つかった
#   ③何をしたか：九州の御家人を九州へ下らせ、9か国に長さを割り当てて築かせた
#   ④どうなったか：1281年は防塁と防戦で上陸を阻まれた。台風が来なかったら止められたかは問いで閉じる
title: 元寇｜台風の前から、博多湾には石の壁があった
yt_title: 元寇防塁は台風の前から博多湾にあった　1276年に始まった石の壁の築造
description: |-
  1275年、元の使者が長門の室津に着き、鎌倉へ送られて、竜口で首を斬られました。北条時宗は九州の御家人に、九州へ下るよう命じます。
  1276年3月ごろ、博多湾の浜辺で、石の壁の築造が始まりました。鎌倉幕府が九州9か国に、所領の広さに応じた長さを割り当てて築かせたものです。福岡市の今津では約3.9kmにわたって築かれ、高さは約3mでした。2016年9月には、九州大学の箱崎キャンパスで、南北17m以上の石積みが見つかっています。『山川 日本史小辞典』は、1281年の戦いについて、「防塁や日本軍の激しい防戦で上陸を阻まれ」と書きます。
  台風が来なかった夏、この壁は、元軍を止められたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
