# 物語完結型ショート 鶴松 s1（2026-11-06）。本編 scripts/tsurumatsu-if-story.yaml（11/7 12:00 公開）の序章・第3章から。11/8 9:00 公開。
# 形式は maizo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/tsurumatsu-if/main/T*。前の回の Gemini の絵）と、本編で使った実在の肖像・屏風だけ。新しい絵は作らない。
#   使わない AI 絵：T07（白い腰掛けが今の物に見える）・T08（湾に今の養殖の筏）・T29・T30（しめ縄）。本編の look の頭のとおり。
# 切り口：明への出兵の決定は、鶴松の死から18日後（池内宏 1914）。けれど「唐の国まで」の言葉は、鶴松が生まれる4年前、1585年の朱印状にある。
#   研究者の読みは割れる（池内：互いに関わらない／徳富蘇峰：押し進めた力）。本編の答え（鶴松の死の5か月たたないうちに秀次が関白に）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/豊臣鶴松_facts_20261105.yaml）：tsurumatsu-03・09・10・13。言い方は本編のまま。
# 計算（自分で計算し直した）：8月5日の18日後＝8月23日。1585年9月→1589年5月の誕生まで3年8か月（本編の言い方「生まれる4年前」のまま。年の差で4）。
#   1591年に数えで3歳（1589・1590・1591）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀吉と、跡継ぎの鶴松
#   ②いつ・どこで何が：1591年8月5日に鶴松が数え3歳で死に、その18日後に明を討つ決定が発表された（池内宏）
#   ③何が分かるか：「唐の国まで」の言葉は1585年の朱印状にもう出てくる。研究者は、死と唐入りの関わりを違う形に読む
#   ④どうなったか：計画は死の前からあった。では死で何が変わったのか、の問いで閉じる（答えは本編）
title: 鶴松の死｜18日後の出兵の決定
yt_title: 豊臣秀吉が明への出兵を示したのは跡継ぎの鶴松が死んで18日後　けれど「唐の国まで」は4年前の手紙に
description: |-
  1591年8月5日、豊臣秀吉の跡継ぎ、鶴松が数えで3歳で亡くなりました。
  1914年、池内宏の『文禄慶長の役』は、その18日後に、明を討つ決定が発表された、と書いています。悲しみをまぎらわすために海の向こうへ兵を出した、と書く本もあります。けれど、唐の国まで従わせるつもりだ、という秀吉の言葉は、鶴松が生まれる4年前、1585年9月3日の一柳末安あての朱印状に、もう出てきます。池内宏は、唐入りの決意と鶴松の死は互いに関わるものではない、と論じ、徳富蘇峰は、死は押し進めた力だった、と書きました。
  もしも鶴松が生きていたら、豊臣家はどうなったのか。本編は概要欄のリンクからどうぞ。
