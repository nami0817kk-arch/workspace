  P5c:                                   # 最後の問い
    kind: ai
    file: oichi3/gem/P5c.jpg
    move: in
    focus: [0.5, 0.45]
    text_y: 0.74
    must: こちらを見るお市
lines:
  - 語り: お市の方は、十年前に城から《!逃げた》ことを、ずっと悔やんでいた。
    shot: P2
    tone: 強調
  - 語り: 1573年、最初の夫・浅井長政の小谷城は、兄・織田信長の大軍に囲まれた。
    shot: A11
    tone: 重い
    pause: 0.15
  - 語り: この年、お市は三女の江を産んでいた。娘は三人になった。
    shot: A12
    tone: しみじみ
    pause: 0.12
  - 語り: 長政は、妻のお市と三人の娘を、織田の側へ引き渡した。
    shot: A13
    tone: しみじみ
    pause: 0.12
  - 語り: お市は、夫を城に残して、娘たちと、城を出た。
    shot: A14
    tone: しみじみ
    pause: 0.12
  - 語り: 9月1日、長政は小谷城で《最期》を迎えた。数えで29歳だった。
    shot: Nagamasa
    tone: 重い
    pause: 0.3
    dip: true
  - 語り: 十年後の1583年、二人目の夫・柴田勝家の北ノ庄城が、秀吉の軍に囲まれた。勝家は、お市に城を出るよう勧めた。
    shot: P1b
    tone: しみじみ
    pause: 0.15
  - 語り: 娘の初に仕えた人たちの覚書、『渓心院文』には、このときのお市の言葉が残る。
    shot: A21
    tone: しみじみ
    pause: 0.12
  - 語り: 「浅井の家のときに逃げ出したことさえ、今も《悔やまれる》。どうして今度も、逃げ出せようか」。
    shot: P6
    tone: 強調
    pause: 0.3
  - 語り: お市は、三人の娘だけを送り出し、勝家とともに、37歳で《生涯を閉じた》。
    shot: P2
    tone: 重い
    pause: 0.15
  - 語り: あなたなら、一度逃げた日のことを、許せますか。
    shot: P5c
    tone: 疑問
    pause: 0.15
