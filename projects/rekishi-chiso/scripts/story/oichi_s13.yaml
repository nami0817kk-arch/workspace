    move: in
    must: 山城と、囲む篝火
  A12:                                   # 赤子を抱くお市と幼い娘2人
    kind: ai
    file: oichi3/main/A12.jpg
    focus: [0.45, 0.55]
    move: down
    must: 赤子を抱くお市と幼い娘2人
