  shot: R18_4
  tone: 重い
  pause: 0.12
  # fact: sekimap-79
- 語り: "秋田にいた、もとの領主の秋田実季は、同じ年に、常陸の宍戸の5万石へ移された。"
  shot: R05_5
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-64
- 語り: "義宣は、秋田の湊の城でひと冬を越し、1603年の5月に、久保田城を築き始めた。いまの秋田市の、千秋公園だ。"
  shot: R13_6
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-62, sekimap-63
- 語り: "佐竹の石高が文書に書かれたのは、60年あまり後の1664年。4代将軍の家綱が出した判物で、20万5800石あまりだった。"
  shot: R14_7
  tone: 重い
  pause: 0.12
