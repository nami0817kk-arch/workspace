# 理解テスト：①常陸の佐竹家の国替えの話 ②1602年、常陸から出羽の秋田へ ③石高の書かれていない判物を受け、久保田城を築く ④石高が書かれたのは1664年、20万5800石あまり（54万石の4割に満たない）
title: "関ヶ原のあと｜石高の書かれていない文書"
yt_title: "石高の書かれていない文書1枚で、佐竹家は常陸から秋田へ　石高が文書に書かれたのは60年あまり後だった"
description: |-
  常陸で54万石の大名だった佐竹家。1602年、家康が佐竹義宣に与えた判物には、出羽の国のうち秋田と仙北の2つを与える、とあるだけで、石高が書かれていませんでした（秋田県公文書館が2010年に紹介した文書）。
  義宣は秋田の湊の城でひと冬を越し、1603年の5月に久保田城を築き始めます。今の秋田市の千秋公園です。佐竹の石高が文書に書かれたのは、60年あまり後の1664年。4代将軍の家綱が出した判物で、20万5800石あまりでした。
  本編では、取り上げた石高の総量から、東海道の大名の行き先、毛利・上杉・島津のその後まで、関ヶ原の前と後の大名の地図を数字で積み上げています。本編は概要欄のリンクからどうぞ。
