# 切り口：石高の書かれていない判物1枚で秋田へ移された佐竹家（本編 第5章、sekimap-62・63・64・79）。
# hook＝石高の書かれていない文書で国を移された大名は誰か（答えはこのショートの中：常陸の佐竹家）。
