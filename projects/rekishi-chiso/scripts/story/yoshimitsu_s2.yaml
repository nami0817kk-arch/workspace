lines:
  # fact: yoshimitsu-01
- 語り: "足利義満は、死んだあとに、上皇になりかけた。"
  shot: S01_in5
  tone: 強調
  pause: 0.12
  # fact: yoshimitsu-01
- 語り: "死から2日か3日。朝廷は、義満に、太上天皇の尊号を贈ろうとした。天皇を退いた人の、称号だ。"
  shot: S09_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-01
- 語り: "太上天皇は、略して、上皇とも呼ぶ。義満は、天皇では、ない。それでも、贈られかけた。"
  shot: S02_in4
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-01
- 語り: "贈ると決めた日が、記録で割れる。武家昇晋年譜は、5月9日。東寺執行日記は、5月8日だ。"
  shot: S12_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-01
- 語り: "東寺執行日記は書く。昔より、この例が無いので、勘解由小路禅門が、申し止めた。斯波義将のことだ。"
  shot: S09_left4
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-02
- 語り: "一方、続史愚抄は、辞退したのは義持だ、と書く。"
  shot: S10_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-02
- 語り: "小川剛生さんは、表向きは義持、実際には斯波義将の意向で、辞退した、と見る。尊号の事実そのものが、無かったことにされた。"
  shot: S10_right3
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-03
- 語り: "理由は、先例が無いこと。臣下が、この尊号を受けた例は、無かった。"
  shot: S14_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-04
- 語り: "ところが、小川さんは、義満は生きているあいだに、この称号を、求めていた、と読む。"
  shot: S01_right3
  tone: 疑問
  pause: 0.15
