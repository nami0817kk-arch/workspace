title: "足利義満｜上皇になりかけた"
yt_title: "足利義満は死んだあと、上皇になりかけた　朝廷の贈ろうとした称号は、なぜ消えたのか"
description: |-
  足利義満は、死んだあとに、上皇になりかけました。死から2日か3日、朝廷は、太上天皇の尊号を贈ろうとしたのです。
  贈ると決めた日は、記録で割れます。武家昇晋年譜は5月9日、東寺執行日記は5月8日で、先例が無いので斯波義将が申し止めた、と書きます。続史愚抄は、義持が辞退したと書きます。慶應義塾大学の小川剛生さんの2011年の論文は、表向きは義持、実際には斯波義将の意向で辞退した、と見ます。
  ところが小川さんは、義満が生きているあいだに、この称号を求めていたと読みます。その詳しい記録は、本編でたどります。本編は次のリンクからどうぞ。
  https://youtu.be/6dJB0Rq7yeY
