# 形式は senhime_s1〜s5・ise_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 上宮王家_facts_20261121.yaml）だけ。
# 絵：本編の AI 絵（out/story/joguo/main/ の G・R）の切り出しだけ。新しい絵は作らない。
# 切り口：642年、蝦夷が今来に2つ並んだ墓（大陵・小陵）を造らせ、上宮の乳部の民まで使った。上宮の姫の「天に二つの日無く」（本編 第3章、joguo-15・16）。
#   姫が誰かは書紀に注が無いので名を言わない（舂米女王とは言わない）。
# hook＝太子の一族は、なぜ蘇我の墓づくりに怒ったか（答えはこのショートの中：天皇の墓の呼び名の「陵」で、太子の一族の民まで使ったから）。
# tease＝翌年、入鹿がひとりで謀ったことは何か（答えは本編 第3章：上宮の王たちを退けて古人大兄皇子を天皇に立てる、joguo-17）。
# 字幕では読点が消えるので、大陵と小陵は別の文にした。
# 理解テスト：①聖徳太子の一族（上宮の家）と蘇我の親子の話 ②642年、今来での墓づくり ③蝦夷は自分と入鹿の墓を造らせ、上宮の乳部の民まで使った。上宮の姫は「天に二つの日は無い」と憤った ④書紀は、ここから恨みが結ばれ、どちらも滅んだと書く
title: "天に二つの日なし｜蘇我の墓と太子の一族"
yt_title: "「天に二つの日は無く、国に二人の王は無い」　642年、蘇我の墓づくりに聖徳太子の一族の姫が憤った理由"
description: |-
  642年、『日本書紀』によれば、大臣の蘇我蝦夷は、国中の民を集めて、今来という地に、自分と息子の入鹿のための2つ並んだ墓を、前もって造らせました。書紀はこの2つを、大陵、小陵と書いています。
  蝦夷は、聖徳太子の一族の暮らしを支える乳部の民まで、残らず集めて工事に使いました。これに上宮の家の姫が憤り、「天に二つの日は無く、国に二人の王は無い」と言った、と書紀は伝えます。
  本編では、その翌年に入鹿が謀ったことと、斑鳩で起きたことをたどっています。本編は概要欄のリンクからどうぞ。
