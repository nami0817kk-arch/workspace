# 物語完結型ショート 明暦の大火 s2（2026-11-15）。本編 scripts/meireki-story.yaml（11/19 12:00 公開予定、https://youtu.be/YMXFgwO0dWI）から。11/20 に予約。
# 形式は toyamaru_s1〜s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/明暦の大火_facts_20261115.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/meireki/main/ の K01〜K24・YEND）の切り出しだけ。新しい絵は作らない。燃える場面（K05〜K09）は5本とも使わない（本編で繰り返したため）。遺体・惨状・顔は絵にしない。
# 切り口：死者の数が記録で3つに割れる（3万7千／6万8千／10万7046）、報告書の見方、回向院
# 計算（自分で数え直した）：63,430＋4,654＝68,084（6万8000人あまり）／1675−1657＝18年／3つの数の「ほぼ中間」は報告書の言い方
title: "明暦の大火｜死者10万人は、どの記録の数か"
yt_title: "明暦の大火の死者は、10万人と言われる　記録を開くと3万7千、6万8千、10万7千に割れる　国の報告書が実態に近いとみる数は"
description: |-
  明暦の大火の死者は、10万人と言われます。けれど記録を開くと、数は割れます。『上杉年譜』などは3万7000人あまり、『元延実録』は6万8000人あまり（6万3430人と4654人の合計）、『むさしあぶみ』などは10万人台、『武江年表』は焼死10万7046人、といへり、と書きます。
  内閣府の報告書は、6万8000人あまりを「だいたいの実相を伝えているとみてよいのではなかろうか」と書きますが、どの数も、どう数えたのかは、はっきりしません。
  遺体は本所の牛島新田に集めて葬られ、のちの回向院になりました。本編は概要欄のリンクからどうぞ。
  亡くなった方々に、敬意を払って作っています。
  https://youtu.be/YMXFgwO0dWI
