lines:
  # fact: meireki-A11
- 語り: "明暦の大火の死者は、10万人と言われる。ところが、記録を開くと、数は、3つに割れる。"
  shot: K14_1
  tone: 強調
  pause: 0.12
  # fact: meireki-A11
- 語り: "『上杉年譜』などは、3万7000人あまり、と書く。"
  shot: K13_2
  tone: しみじみ
  pause: 0.12
  # fact: meireki-A12
- 語り: "『元延実録』は、牛島新田に葬った6万3430人あまりと、漂着した4654人。合わせて、6万8000人あまり。"
  shot: K21_3
  tone: 重い
  pause: 0.12
  # fact: meireki-A11, meireki-A13
- 語り: "『むさしあぶみ』などは、10万人台。『武江年表』は、焼死10万7046人、といへり、と書く。"
  shot: K13_4
  tone: 重い
  pause: 0.12
  # fact: meireki-A12
- 語り: "報告書は、6万8000人あまりを、だいたいの実相を伝えているとみてよいのではないか、と書く。"
  shot: K14_5
  tone: しみじみ
  pause: 0.12
  # fact: meireki-A11, meireki-A12
- 語り: "ただし、どの数も、どう数えたのかは、はっきりしない。確かなのは、万の単位の人が亡くなったことだ。"
  shot: K10_6
  tone: しみじみ
  pause: 0.12
  # fact: meireki-A17, meireki-A18, meireki-A19
- 語り: "遺体は、本所の牛島新田に葬られた。のちの回向院だ。大火の18年後、1675年ごろの供養塔に、死者の数は、書かれていない。"
  shot: K15_7
  tone: 重い
  pause: 0.12
  # fact: meireki-A20
- 語り: "毎月の18日と19日には、人々が参って、念仏を唱えた、と伝わる。"
  shot: K15_8
  tone: しみじみ
  pause: 0.12
  # fact: meireki-A11
- 語り: "10万人は、どの記録の数か。あなたは、知っていましたか。"
  shot: K13_9
  tone: 疑問
  pause: 0.15
