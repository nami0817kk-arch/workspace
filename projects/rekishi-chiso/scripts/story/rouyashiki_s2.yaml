title: "江戸の牢屋敷｜畳1枚に7人か8人"
yt_title: "江戸の牢の新入りは、畳1枚に7人か8人　座る広さは牢の中の役で決まり、差し入れが届くと繰り上がった"
description: |-
  江戸の小伝馬町の牢屋敷。江戸の牢の様子を書いた写本『牢獄秘録』によると、畳の割り当ては、牢の中の役で決まりました。牢名主ら上の役付きは畳1枚に1人、三番役と四番役は1枚に2人。新入りは「向こう通り」と呼ばれる所で、1枚に7人か8人。外から差し入れが届くと、1枚に4人ほどの所へ繰り上がりました。
  吉田松陰は、無宿の牢では畳1枚に15人から18人を座らせるに至る、と書いています。世界大百科事典では、30畳敷きの大牢に100人以上。数は記録によってばらばらです。
  本編では、江戸の牢屋敷の食事や差し入れ、牢を出る道までたどっています。本編は概要欄のリンクからどうぞ。
