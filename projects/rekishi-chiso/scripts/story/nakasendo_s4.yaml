# 数え直し：高宮5月4日→和田5月11日＝7日後。872÷150＝5.81→「5倍を超える」。物差し 585文＝1万円→1文＝17.09円。
#   150文＝2,564円→約2,600円、148文＝2,530円→約2,500円、872文＝14,906円→1万5千円ほど。旧暦5月（夏）だが季節は言わない。
# 理解テスト：①近江の商人 西村安則の宿代の話 ②1835年5月、中山道の高宮と和田の宿 ③高宮は150文、和田では「これまで850文、今夜は872文」と言われた ④何人分かは書かれておらず分からない。もてなしは良かった
title: "中山道｜宿代が5倍を超えた夜"
yt_title: "最初の夜は150文、7日後は872文　1835年、中山道を旅した近江の商人の日記に残る、合わない宿代"
description: |-
  天保6年、1835年の5月4日。近江の日野の商人、西村安則は、武蔵の吉川の店へ向かって、中山道を東へ旅立ちました。その夜、高宮の宿で詠んだ狂歌には「はたごは百五十」とあります。日記の解説は『守貞謾稿』を引いて、中山道の商人宿は148文が相場だったとまとめています。
  7日後の5月11日、和田峠を越えて和田の永井喜左衛門の家に泊まると、旅籠の代は、これまで850文だったのに今夜は872文だ、と言われました。高宮の5倍を超える額ですが、何人分の代なのかは、日記に書かれていません。もてなしは良かった、とも書いています。
  江戸の大工の日当、およそ585文を今の1万円とする目安では、150文はおよそ2,600円、872文は1万5千円ほどです。
  本編では、近江の日野から武蔵の吉川まで、12日間の旅を宿場ごとに追っています。本編は概要欄のリンクからどうぞ。
