lines:
  # fact: fukushima-21
- 語り: "福島正則が亡くなったとき、幕府の検使が着く前に、何が行われたのか。"
  shot: F11a
  tone: 強調
  pause: 0.12
  # fact: fukushima-20
- 語り: "寛永元年、1624年の7月13日。正則は、高井野で、数え64歳で亡くなった。"
  shot: F10
  tone: 重い
  pause: 0.12
  # fact: fukushima-21
- 語り: "高山村の公式ページは、病死と説明している。夏の暑い盛りだった。"
  shot: F11b
  tone: しみじみ
  pause: 0.12
  # fact: fukushima-21
- 語り: "検使とは、亡くなった大名の死を確かめる、幕府の役人。"
  shot: F13
  tone: しみじみ
  pause: 0.12
  # fact: fukushima-21
- 語り: "公式ページは、検死が済む前に、遺体を荼毘に付した、と書く。荼毘とは、火葬のことだ。"
  shot: F12a
  tone: 重い
  pause: 0.12
  # fact: fukushima-27
- 語り: "その跡に、村の人が杉を植えた。一本杉と呼ばれ、高さ約30メートルに育ち、1934年の室戸台風で、倒れた。"
  shot: F12b
  tone: しみじみ
  pause: 0.12
  # fact: fukushima-27
- 語り: "荼毘所の跡は、いまも、高山村の指定史跡。"
  shot: F12c
  tone: しみじみ
  pause: 0.12
  # fact: fukushima-51
- 語り: "自刃したという噂もあるが、真偽は定かでない、と、ある歴史記事は書く。"
