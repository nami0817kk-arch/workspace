# 理解テスト4問：①福島正則 ②1624年7月13日、高井野で数え64歳で亡くなった ③高山村の公式ページは病死・検死の前に荼毘。自刃の噂は真偽不明 ④杉を植えた跡が史跡。幕府が何を取り上げたかは本編8章
title: "福島正則｜検使が着く前に、行われたこと"
yt_title: "福島正則の最期　1624年7月13日、幕府の検使が着く前に荼毘に付された信濃・高井野"
description: |-
  1624年7月13日、福島正則は、信濃の高井野で、数え64歳で亡くなりました。高山村の公式ページは病死と説明し、夏の暑い盛りだったと書きます。
  同じページによれば、幕府の検死が済む前に、遺体は荼毘に付されました。検使とは、亡くなった大名の死を確かめる幕府の役人、荼毘とは火葬のことです。荼毘の跡に、村の人が杉を植え、「一本杉」と呼ばれました。1934年の室戸台風で倒れましたが、荼毘所の跡は高山村の指定史跡になっています。自刃したという噂もありますが、真偽は定かではありません。
  検使が着く前の火葬で、幕府は、何を取り上げたのか。本編は概要欄のリンクからどうぞ。
