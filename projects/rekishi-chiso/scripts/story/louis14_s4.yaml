title: "ルイ14世｜就寝の燭台を持てるのは、ひとりだけ"
yt_title: "ルイ14世の就寝の儀で、燭台を持てたのは、王に指名された1人だけ　晩年は大就寝をやめた"
description: |-
  サン=シモンによれば、ルイ14世の就寝の儀には、燭台を持つ栄誉がありました。祈りのあと、王が廷臣を声に出して指名し、指名された人は、手袋を外して燭台を受け取り、就寝が終わるまで持っていました。サン=シモンは最初、これを「ごく珍しい光栄」と書き、のちに自分も何度も受けています。
  1702年、軍務を辞めて王の不興を買った直後にも、王は、不機嫌を気づかれまいとして、サン=シモンを指名した、と本人は書きます。王の気持ちは、サン=シモン本人の受け取り方です。燭台の決まり自体は1674年版の『国家年鑑』にも印刷されていますが、そこでは、部屋にいる最も位の高い貴人に持たせる、とあり、王が指名する、という書き方とは少し違います。
  晩年の王は、宮廷全体が見る「大就寝」をやめていました。サン=シモンは死の10年から12年前から、と書き、編者ボワリルの注は1705年としています。見られない入口は、なかったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/FqHUnnLL6JM
