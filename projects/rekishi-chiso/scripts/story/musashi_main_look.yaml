# 物語型の本編（横 16:9）の見た目と絵の割り当て：宮本武蔵（scripts/musashi-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（11/1 12:00 公開）。takasugi_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（M01〜M15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵の後ろ姿・遠景の影だけ。実在の自画像とされる絵（島田美術館蔵、ウィキメディア・コモンズ、パブリックドメイン。出典は台本の portrait の caption と下の credits）は額（frame:）。
#   絵図・錦絵・名所図会は絵図の一部（part:）。
#   この回の決まり：AI 絵に武蔵・小次郎の顔は描かない。決闘・斬る・負傷・死の場面は描かない（巌流島は遠景の海と島の砂浜、櫂や木刀は物だけ）。実在の誰か・俳優に似せない。顔が分かるのは実在の自画像の額だけ。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/musashi_ai_images.md
# 届く前は art_dir の仮の絵（M01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に M01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「M01（仮）」と場面を書いて作り直す。
script: scripts/musashi-story.yaml
out: musashi_story_main
art_dir: out/story/musashi/ph          # 仮の絵（placeholder）
main_art_dir: out/story/musashi/main   # Gemini の 16:9 の絵（M01.jpg〜M15.jpg）
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

