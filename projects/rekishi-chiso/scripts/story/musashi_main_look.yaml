# 部品（from〜to の行、0 始まり。出ている間は絵を暗くする）
parts:
  - {type: quote, from: 15, to: 16, label: 史料, text: 木刃の一撃を以て之を殺す／故に俗、舟嶋を改めて岩流嶋と謂ふ,
     source: 小倉碑文の読み下し（福田正秀『宮本武蔵研究論文集』資料編。Wikid が掲載）}
  - {type: quote, from: 31, to: 32, label: 史料, text: 双方共に弟子一人も不参筈に相定／其後に小次郎蘇生致候得共　彼弟子共参合　後にて打殺申候,
     source: 『沼田家記』の翻刻（個人の記事が引用。カクヨム「巌流島雑考」）}
  - {type: quote, from: 33, to: 33, label: 史料, text: 依之武蔵難遁門司に遁来／延元様を偏に奉願候に付御請合被成,
     source: 『沼田家記』の翻刻（個人の記事が引用。カクヨム「巌流島雑考」）}
  - {type: quote, from: 61, to: 61, label: 史料, text: 敵の落とした石に当たって、脛も立てないでいる,
     source: 武蔵が有馬直純にあてた書状（NEWSポストセブン、SAPIO 2017年4月号）}
  - {type: quote, from: 85, to: 86, label: 史料, text: 春には熊本に下って、対面で話をしよう（大意）,
     source: 細川光尚の書状の控え 寛永20年9月13日（熊本大学の報道発表 2022年）}
  - {type: quote, from: 107, to: 107, label: 要点, text: 決闘のときに書かれた文書は、存在しない,
     source: J-CAST ニュース 2010／山口県観光連盟}

