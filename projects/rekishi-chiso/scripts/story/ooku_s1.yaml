#   ④どうなっていたか：休みの日の無い、交代の勤務表だった
title: 大奥｜奥女中に休みの日はあったのか
yt_title: 大奥の奥女中に休みの日はあったのか　元女中が語った「休日というものがありません」と勤めの表
description: |-
  華やかに見える大奥。そこで働いた奥女中に、休みの日はあったのでしょうか。
  三田村鳶魚の1930年の本『御殿女中』に、元女中の大岡ませ子さんの話が残っています。「奥の者には、休日というものがありません。八ッ出と、明け番とが、あるだけです」。八ッ出は午後2時に出て午後4時に引く2時間の勤め。明け番は泊りの翌日で、午前6時にいったん帰り、7時に出て10時に引きます。お中臈の泊りは、夜の10時から翌朝の10時までの12時間でした。早く帰れたのは御年寄と将軍付きのお中臈だけで、御台所付きのお中臈は用が多く、昼過ぎでないと引けなかったといいます。
  では、この勤めで、奥女中はいくらもらえたのか。本編は概要欄のリンクからどうぞ。
