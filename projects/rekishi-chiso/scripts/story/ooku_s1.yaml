lines:
  # fact: ooku-64
  - 語り: 大奥の奥女中に、休日は、あったのか。
    shot: Hanami
    tone: 疑問
    pause: 0.12
  # fact: ooku-64
  - 語り: 1930年の本、『御殿女中』に、元女中の、大岡ませ子の話が残る。奥の者には、休日というものが、《!ありません》。
    shot: O21
    tone: 強調
    pause: 0.12
  # fact: ooku-64
  - 語り: 八ッ出と、明け番とが、あるだけです。
    shot: O03
    tone: 重い
    pause: 0.12
  # fact: ooku-65
  - 語り: 八ッ出は、午後2時に出て、午後4時に引く勤め。わずか、2時間だ。
    shot: O03
    tone: しみじみ
    pause: 0.12
  # fact: ooku-66
  - 語り: 明け番は、泊りの翌日。午前6時に、いったん帰り、7時に出て、10時に引く。
    shot: O01
    tone: しみじみ
    pause: 0.12
  # fact: ooku-67
  - 語り: 将軍や御台所のそばに仕える、お中臈の泊りは、夜の10時から、翌朝の10時まで。《12時間》だ。
    shot: O05
    tone: 重い
    pause: 0.12
  # fact: ooku-11
  - 語り: 御年寄の泊りは、また違う。朝の10時に出て、午後2時に一度帰り、夜の8時に、また出る。
    shot: O09
    tone: しみじみ
    pause: 0.12
  # fact: ooku-66
  - 語り: しかも、早く帰れたのは、御年寄と、将軍付きのお中臈だけ。御台所付きのお中臈は、用が多く、昼過ぎまで、引けなかった。
    shot: O06
    tone: しみじみ
    pause: 0.12
  - 語り: 休みの日は無く、短い勤めと、長い泊りが、順に回ってくる。今でいえば、《交代の勤務表》だ。
    shot: O02
    tone: 重い
    pause: 0.3
    dip: true
