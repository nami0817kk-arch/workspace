# 物語完結型ショート 伊能忠敬 s2（2026-11-11）。本編 scripts/inou-story.yaml（11/13 12:00 公開予約、https://youtu.be/AG2oS5iUwgU）から。11/14 に予約。
# 形式は gosekke_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/伊能忠敬_facts_20261111.yaml）と本編の # fact: だけ。
# 出どころは大谷亮吉『伊能忠敬』（1917）の翻刻を通した記述。原日記は未確認なので「大谷は書く」「日記には〜とある」と言う。奥宮正樹の読みは未確認のため名前は語らない。
# 絵は本編の AI 絵（out/story/inou/main。人物なし）と実在の絵（パブリックドメイン）。新しい絵は作らない。
# 切り口：旅の財布。手当は100両のうち20両、自腹80両（本編2章）。「150両」は動画の足し算と断る。
# 計算：銀7.5匁×180日＝1,350匁。1,350÷60＝22.5両。手当20÷100＝2割。80＋70＝150両。
# 理解テスト4問：①伊能忠敬 ②1800年の最初の蝦夷地の旅、180日 ③手当は1日銀7匁5分で20両ばかり、80両は自腹、測器の新調に70両 ④箱館から息子に何と書いたかは本編
title: "伊能忠敬｜旅の費用の8割は自腹だった"
yt_title: "伊能忠敬の最初の旅は、費用の8割が自腹だった　手当は100両のうち20両"
description: |-
  1800年、伊能忠敬の最初の蝦夷地の旅は、閏4月19日から10月21日までの180日。辞令の手当は1日に銀7匁5分で、180日分は1,350匁、60匁を1両とすれば22両あまりです。
  師匠の高橋至時が間重富に宛てた手紙には、「御手当は20両ばかり」、道具代と支度料を除いても「80両の入れ足し」とあります（大谷亮吉『伊能忠敬』による）。100両のうち手当はおよそ2割、残りの80両は忠敬の自腹でした。大谷は、測器の新調にも旅の前から70両ほど自費を使ったと書き、80両と70両を足した「およそ150両」は動画の足し算で、史料に合計の言葉はありません。
  その旅の途中、箱館から息子に送った手紙には、何と書かれていたのか。本編は概要欄のリンクからどうぞ。
