parts:
  - {type: quote, from: 1, to: 1, label: 史料, text: 毎年四月中可致參勤,
     source: 武家諸法度 寛永12年6月21日（『御当家令条』の翻刻。石井良助校訂、創文社、1959年）}
  - {type: quote, from: 2, to: 2, label: 史料, text: 從者員數近來甚多、且國郡之費且人民之勞也／向後以其相應、可減少之,
     source: 同じ条（『御当家令条』の翻刻）}
  - {type: quote, from: 11, to: 11, label: 要点, text: なぜ、毎年の往復を命じたのか／「お供を減らせ」と書きながら,
     source: この動画の問い}
  - {type: quote, from: 96, to: 96, label: 史料, text: 在国在邑の諸侯にして当年参勤年の面々は至急出府すべし,
     source: 元治元年9月の布告（しながわデジタルアーカイブ『幕末の品川』）}
  - {type: quote, from: 109, to: 109, label: 要点, text: 1615年「参覲」は京都の作法／1635年 参勤と「供を減らせ」／1722年 上米で在府は半年に,
     source: 事典・翻刻}

