# 理解テスト4問：
#   ①誰の話か：高杉晋作がつくった身分を問わない軍隊、奇兵隊
#   ②いつ・どこで何が：1863年6月7日、下関の白石正一郎の屋敷で結成。8月16日、高杉は教法寺事件の責任を問われ総督を罷免された
#   ③中身は：隊士559名のうち、士分格272名・農民237名・町人と神官・僧が25名ずつ
#   ④どうなったか：身分を問わない隊の、およそ半分は武士の身分だった（誰でも入れたが中身は半々に近い）
title: 高杉晋作｜身分を問わない奇兵隊の、半分は武士だった
yt_title: 奇兵隊は本当に身分を問わなかった？　隊士559名の身分は、武士が半分、農民が4割あまり
description: |-
  高杉晋作がつくった、身分を問わない軍隊、奇兵隊。1863年6月7日、下関の白石正一郎の屋敷で結成されました。ところが高杉晋作Museumの年表によれば、結成の2か月後の8月16日に、高杉は教法寺事件の責任を問われて、総督を罷免されます。
  では、身分を問わない隊には、実際にどんな人がいたのか。世界大百科事典は、隊士559名の身分を調べた研究を挙げています。士分格が272名、農民が237名、町人と神官・僧が25名ずつ。身分を問わない隊の、およそ半分は、武士の身分の人たちでした。
