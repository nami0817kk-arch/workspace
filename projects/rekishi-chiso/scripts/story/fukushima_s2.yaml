title: "福島正則｜七本槍は、本当に7人だったのか"
yt_title: "賤ヶ岳の七本槍は本当に7人だったのか　福島正則の5千石は、17年で49万8千石になった"
description: |-
  賤ヶ岳の七本槍の一人とされる福島正則。ところが、手柄の人数は、記録で違います。1583年11月に大村由己が書いた『柴田退治記』は9人、江戸時代の初めの『太閤記』は7人。「七本槍」という言い方は、同時代の『柴田退治記』には出てきません。恩賞も、『柴田退治記』は「五千石か三千石」、『太閤記』は7人とも5千石と書きます。
  5千石とされた正則は、関ヶ原のあと、安芸と備後の49万8千石を与えられました。賤ヶ岳から17年、およそ100倍です。
  その49万8千石の大名が、なぜ、城の修理で領地を失ったのか。本編は概要欄のリンクからどうぞ。
