    pause: 0.12
  # fact: yodo-15
  - 語り: ともに死んだ人の数も違う。『日本史料』は25人と侍女7人、竹越与三郎の本は42人、山路愛山の『徳川家康』は30人あまり。
    shot: Y14b
    tone: しみじみ
    pause: 0.12
  # fact: yodo-31
  - 語り: 平戸のイギリス商館長コックスの日記。最初の知らせは、秀頼と母と子が、そろって自ら命を絶った、というもの。
    shot: Castle
    tone: しみじみ
    pause: 0.12
  # fact: yodo-32
  - 語り: 続く知らせでは、母は亡くなって見つかり、秀頼の亡骸は見つからず、焼けた櫓の中で灰になったと考えられた。
    shot: Y13r
    tone: 重い
    pause: 0.12
  # fact: yodo-34
  - 語り: パジェスの本は、また違う。秀頼は町の中で倒れたらしいと書き、母の最期には触れない。
    shot: Y12
