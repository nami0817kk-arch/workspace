# 物語完結型ショート 淀殿 s4（2026-10-29）。本編 scripts/yodo-story.yaml の第4章（最期の記録の食い違い）から。投稿しない。
# 形式は masamune_s1.yaml を写した。想像の台詞なし。絵は本編の AI 絵（Gemini のみ）と実在の絵。
# 女性の扱い：最期は「自ら命を絶った」まで。場面の細部・亡骸の様子は語らない。最期の行に人物の絵は当てない（蔵の外観・遠景・壊れた部屋のみ）。
# 事実カード：yodo-04・15・31・32・34。人数は『日本史料』1893・竹越与三郎1896・山路愛山。コックスの日記の「続いての知らせ」は母は見つかり秀頼は見つからず。
# 理解テスト4問：①誰の話か＝淀殿（茶々）と秀頼の最期 ②いつ・どこで何が＝1615年5月8日、大坂城山里丸の蔵 ③何が食い違うか＝ともに死んだ人の数（25人と侍女7人・42人・30人あまり）、コックス・パジェスの書き方 ④どうなったか＝一つには決まらないまま
title: 淀殿｜最期の記録は、本ごとに違う
yt_title: 淀殿と秀頼の最期は、本によって違う　山里丸の蔵・ともに死んだ人の数・コックスの日記
description: |-
  慶長20年、1615年の5月8日、大坂夏の陣。多くの本は、秀頼と淀殿は山里丸の蔵に入り、そこで自ら命を絶った、と書きます。
  ともに死んだ人の数は、本によって違います。明治26年の『日本史料』は大野治長ら25人と侍女7人、明治29年の竹越与三郎の本は42人、山路愛山の『徳川家康』は30人あまりです。
  平戸にいたイギリス商館長リチャード・コックスの日記では、最初の知らせは秀頼と母と子がそろって命を絶ったというものでしたが、続く知らせでは、母は亡くなって見つかり、秀頼の亡骸は見つからず、焼けた櫓の中で灰になったと考えられた、とあります。レオン・パジェスの本は、秀頼は町の中で倒れたらしいと書き、母の最期には触れていません。
hashtags: ["#淀殿", "#日本史", "#戦国時代"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
