lines:
  # fact: yodo-04, yodo-15
  - 語り: 豊臣秀頼の母、淀殿の最期の記録は、本によって、食い違っている。
    shot: Y13
    tone: 強調
  - 語り: 1615年の5月、大坂夏の陣で、城は燃え始めた。茶々にとって、三度目の落城だった。
    shot: Natsu
