# 理解テスト4問：①クレオパトラ ②紀元前30年、アレクサンドリアの王宮の敷地に造っていた墓 ③戸は閉めると開かず上は未完成。窓から綱でアントニウスを引き上げた。同じ墓に葬ってほしいと願った ④願いは認められ、霊廟を完成させよと命じられた。墓の場所は分かっていない（本編へ）

title: "クレオパトラ｜完成する前に使われた墓"
yt_title: "クレオパトラの墓は、完成する前に使われた　窓から綱で引き上げた、とプルタルコスは書く"
description: |-
  クレオパトラは、生きているうちに、自分の墓を造り始めました。紀元前30年のアレクサンドリア、王宮の敷地です。カッシウス・ディオによれば、その墓の戸は、一度閉めると開かない仕掛けで、屋根に近い上の方は、まだ、できあがっていませんでした。
  プルタルコスによれば、傷ついたアントニウスは、その墓の窓から綱で引き上げられました。引き上げたのは、クレオパトラ本人と、墓に入れた2人の侍女だけです。
  死の直前、クレオパトラは、アントニウスと一緒に葬ってほしいと、封をした書簡をオクタウィアヌスに送りました。スエトニウスは、オクタウィアヌスが、二人が始めた霊廟を完成させよ、と命じた、と書きます。引用はいずれも英訳（Thayer 版 Loeb）で読んだものです。
  完成させよと命じられた墓は、今、どこにあるのか。本編は概要欄のリンクからどうぞ。
