# 物語完結型ショート 三種の神器 s5（2026-11-05）。本編 scripts/jingi-story.yaml（11/5 19:00 公開、https://youtu.be/XmWN5pboKa4）の第5章から。11/6 19:30 公開。
# 形式は sankin_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）だけ（国芳の太平記の絵は別人の名札が入るので外した）。新しい絵は作らない。
# 切り口：1443年の禁闕の変で奪われた勾玉が、赤松家の遺臣の手で都に戻るまで。鏡（s1）・盗難（s2）・壇ノ浦（s3）・南北朝の似せ物（s4）には踏み込まない。
# 事実カード：jingi-47・49。言い方は本編のまま。
#   ・嘉吉3年＝1443年、長禄元年＝1457年（長禄への改元は1457年9月）、長禄2年＝1458年を確かめた。
#   ・1443年9月23日 → 1458年8月末日は14年11か月 →「15年近く」は合う（本編の序章と同じ言い方）。
#   ・長禄元年12月2日は、今の暦に直すと1458年の初めにあたるが、本編と同じく和暦の年を西暦の年に置き換えて言う。
#   ・取り返しの経緯は『上月記』（1478年、生き残りの上月満吉らの記録）による → 出どころを語りで言う。
# 理解テスト4問：
#   ①誰の話か：三種の神器の勾玉と、それを取り戻した赤松家の家臣たち
#   ②いつ・どこで何が：1443年9月23日の夜、内裏が襲われ剣と勾玉が奪われた（禁闕の変）。剣はすぐ戻り、勾玉は南朝の側に残った
#   ③どうしたか：1457年12月2日、赤松家の生き残りの家臣が吉野の奥で勾玉を奪うが、村人に取り返され、もう一度取り戻した
#   ④どうなったか：1458年8月の末日に勾玉は都に入り、赤松家は加賀の半国などを与えられた
title: 三種の神器｜奪われた勾玉、15年の行方
yt_title: 1443年に奪われた勾玉が都に戻るまで15年近く　禁闕の変と、取り戻した赤松家の家臣たち
description: |-
  奪われた勾玉が都に戻るまで、15年近くかかりました。
  1443年、嘉吉3年9月23日の夜。内裏が襲われ、剣と勾玉が奪われます。禁闕の変です。剣は清水寺のそばに捨てられていたのを寺の僧が拾って届けましたが、勾玉だけは南朝の側に残りました。取り戻したのは、赤松家の生き残りの家臣たち。1478年に書かれた『上月記』によれば、1457年12月2日の夜半、吉野の奥で勾玉を奪いますが、追ってきた村人に取り返され、もう一度取り戻して、1458年8月の末日に都へ入れました。その功で、赤松家は加賀の半国などを与えられた、と伝えます。
  では、熱田の剣を見た者はいたのか。本編は概要欄のリンクからどうぞ。
