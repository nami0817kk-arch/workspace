# 切り口：秋の弓の試験「秋射」。受けたのは兵ではなく長たち。12本・6本で合格・1本ごとに労15日・労と功（本編 第5章、choujou-33〜35）。
# hook＝秋の弓の試験で外すとどうなるか（答えはこのショートの中：1本ごとに勤めた日数の点数を15日削られる）。
# tease＝試験とは別に、靴の無い役人は、誰に何を頼んだか（答えは本編 第6章：元が友の子方に、厚くて歩ける靴を1足。choujou-31・42）。
# 数え直し：(12−6)×15＝90日の加点、6×15＝90日を失う。中労＝1年、功1つ＝中労4年。
# 理解テスト：①漢の長城の長たちが受けた秋の弓の試験の話 ②2000年あまり前、毎年秋、長城の塞 ③弩で矢を12本、6本で合格、外せば1本ごとに15日削られる ④労は日数の点数で、功と労の順に役が上がる。前37年の秋射の記録も残る
title: "万里の長城｜秋の弓の試験"
yt_title: "万里の長城の長たちが受けた秋の弓の試験　12本のうち6本で合格、外すと勤めた日数を削られた"
description: |-
  2000年あまり前、漢の時代の長城では、毎年秋に「秋射」という弓の試験がありました。受けたのは兵ではなく、のろし台の長や、それをまとめる長たちです。
  弩という引き金で放つ弓で、矢を12本。当たりが6本で合格です。6本を超えると1本ごとに「労」を15日もらえ、足りなければ1本ごとに15日削られました。労は勤めた日数で数える点数で、1年分で中労、中労4年分で功が1つ。空いた役には、功と労の順に引き上げられました。
  本編では、兵の故郷から毎朝の見回り、のろし、食べ物、靴を頼む手紙、病と故郷へ帰る棺まで、木の札の記録で長城の兵の暮らしをたどっています。本編は概要欄のリンクからどうぞ。
