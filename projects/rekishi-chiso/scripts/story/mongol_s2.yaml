# 物語完結型ショート モンゴル s2（2026-11-07）。本編 scripts/mongol-if-story.yaml（11/10 12:00 公開）の第1章（軍は何人）＋第4章のシノールの計算（草の数）から。11/11 11:00 公開。
# 形式は columbus_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/mongol-if/main/）と本編で使った実在の絵（元朝の皇帝の肖像のオゴデイ・『聖ヘドヴィヒ伝』）だけ。
# 切り口：西へ向かったモンゴル軍の数は、米国議会図書館60万・ビュントゲンら約13万・シノールの計算6万8640（のち8万3027）。
#   本編の答え（1241年4月の3日間に何があったか＝第2章）は言わない。
# 事実カード：mongol-73・87・38・37（＝54）。言い方は本編のまま。
# 計算（自分で計算し直した）：60万÷6万8640＝8.74→9倍近い。20万5920÷3＝6万8640（カードと合う）。
# 理解テスト4問：
#   ①誰の話か：1235年に西へ送られたモンゴルの軍（バトゥ・グユク・モンケ）
#   ②いつ・どこで何が：1235年にオゴデイが王子たちを西へ送ると決め、軍はヴォルガ川を渡ってハンガリーへ攻め込んだ
#   ③何が分からないか：兵の数。60万・約13万・6万8640と、見積もりが9倍近く違う。シノールは草で養える馬の数から計算した
#   ④どうなったか：ふつう言われるより小さかったと見る軍事史家もいる。その軍が1241年4月の3日間で何をしたのか、の問いで閉じる（答えは本編の第2章）
title: モンゴル軍｜何人いたのか
yt_title: ヨーロッパへ攻め込んだモンゴル軍は何人いたのか　60万、13万、6万8640、見積もりは9倍近く違う
description: |-
  1235年、大ハーンのオゴデイは、一族の王子たちを西へ送ると決めました。チンギスの孫バトゥ、オゴデイの子グユク、おいのモンケ。
  では、何人が西へ向かったのでしょうか。アメリカ議会図書館の国別研究は、60万の軍が凍ったヴォルガ川を渡った、と書きます。2016年に科学誌に出たビュントゲンとディ・コスモの論文は、ハンガリーへ攻め込んだ兵を、おそらく13万人とします。
  歴史家のデニス・シノールは、1972年、草の量から計算しました。ハンガリーの大平原の草で養える馬は20万5920頭。1人に3頭なら、兵は6万8640人まで。のちに8万3027人と計算し直しています。
  数える範囲は違いますが、60万と6万8640では、9倍近い開きです。
  その軍は、1241年4月の3日間で、何をしたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#モンゴル帝国', '#世界史', '#バトゥ']
ai_images: true
ai_disclosure: この動画の情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。オゴデイの肖像（元朝の皇帝の肖像、14世紀）と『聖ヘドヴィヒ伝』の挿絵（1353年）はパブリックドメインの絵です。
