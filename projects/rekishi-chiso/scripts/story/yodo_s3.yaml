lines:
  # fact: yodo-27
  - 語り: 関ヶ原の翌年、1601年の6月。医師の曲直瀬玄朔が、大坂城の茶々を診た。
    shot: Y08f
    tone: 強調
  # fact: yodo-27
  - 語り: 黒田基樹さんが紹介する玄朔の記録には、こうある。秀頼公の御母、御年、三十余り。気がふさぎ、食べられず、目がくらむ。
    shot: Y08t
    tone: 重い
    pause: 0.12
  - 語り: 茶々は、まだ幼い秀頼を抱えて、大坂城にいた。
    shot: Osaka
    tone: しみじみ
    pause: 0.12
  # fact: yodo-41
  - 語り: その茶々が力を注いだのが、寺の建て直しだ。滋賀県の文化財の解説によれば、近江の石山寺の慶長の建て直しは、淀殿によるものだという。
    shot: Y09
    tone: しみじみ
    pause: 0.12
  # fact: yodo-41
  - 語り: 境内の蓮如堂は、慶長7年、1602年に、そのとき建てられた建物の一つだ。
    shot: Ishiyama
    tone: しみじみ
    pause: 0.12
  # fact: yodo-09
  - 語り: 当時の公家の日記、『時慶卿記』には、石山寺の堂は、ことごとく再興された、「秀頼御袋より」、とある。
    shot: Y09r
    tone: 強調
    pause: 0.12
  - 語り: 御袋は、秀頼の母。記録が名を挙げたのは、若い秀頼ではなく、母の茶々だった。
    shot: Nara
    tone: しみじみ
    pause: 0.12
  - 語り: のちの読み物は、茶々を、秀吉の心を乱した女として描く。けれど、記録に残るのは、気がふさぎながら、寺を建て直す茶々だ。
    shot: Y08f
    tone: 重い
    pause: 0.3
    dip: true
  - 語り: 寺を建て直し続けた人を、あなたは、悪女と、呼べますか。
    shot: Y08q
    tone: 疑問
    pause: 0.15
