# 物語完結型ショート 淀殿 s3（2026-10-29）。本編 scripts/yodo-story.yaml の第3章（玄朔の診療・石山寺・「秀頼御袋より」）から。投稿しない。
# 形式は masamune_s1.yaml を写した。想像の台詞なし。絵は本編の AI 絵（Gemini のみ）と実在の絵。
# 事実カード：yodo-27・41・09。玄朔の症状は黒田基樹の紹介する記録の文で言う（nippon.com と食い違うので）。
# 理解テスト4問：①誰の話か＝茶々（淀殿）②いつ・どこで何が＝1601年に玄朔が診て気がふさぎ食べられず、1602年に石山寺の蓮如堂など建て直し ③何をしたか＝寺を建て直し続けた。『時慶卿記』は「秀頼御袋より」と記録 ④どうなった＝記録に残るのは病みながら寺を建てる茶々で、悪女の姿ではない
title: 淀殿｜記録が名を挙げたのは、「秀頼御袋より」
yt_title: 淀殿は「秀頼御袋より」と記録された　石山寺の建て直しと医師の診療記録
description: |-
  慶長6年、1601年の6月。関ヶ原の戦いの翌年に、医師の曲直瀬玄朔が大坂城の茶々、のちの淀殿を診ました。黒田基樹さんが紹介する玄朔の記録には、「秀頼公の御母、御年、三十余り。気がふさぎ、食べられず、目がくらむ」とあります。
  その茶々が力を注いだのが、寺の建て直しです。滋賀県の文化財の解説によれば、石山寺の慶長の建て直しは淀殿によるもので、寺に残る文書から分かるといいます。境内の蓮如堂は慶長7年、1602年に建てられた建物の一つです。当時の公家の日記『時慶卿記』には、石山寺の堂はことごとく再興された、「秀頼御袋より」とあります。
  のちの読み物は茶々を悪女のように描きますが、同じ時代の記録に残るのは、気がふさぎながら寺を建て直す茶々の姿です。
