# 切り口：1647年、宣教師が1人もいないポルトガル本国の船も、通商を断られた（本編 第3章・分岐2）。斬罪は数だけ一文、絵はマカオの港。
# 計算（自分で数え直した）：1639年→1647年＝8年。佐賀藩の1万1,350人は文化遺産オンライン（sakokuif-27）。
title: "ポルトガル｜宣教師0人の船も、帰された"
yt_title: "1647年、宣教師が1人もいないポルトガルの船も、幕府は商いを許さなかった　長崎の港に舟の橋"
description: |-
  1639年、幕府はポルトガル船の来航を禁じました。8年後の1647年7月26日、ポルトガル本国の使節が、船2隻で長崎に来ます。
  諸藩は兵を集め、港に舟を並べた橋を架けて、船を閉じ込めました。佐賀藩1つだけで1万1,350人です。それでも幕府は、通商を断っただけで、一行を帰らせました。乗っていた人に、宣教師は1人もいませんでした。
  後半は「もしも」の話です。記録ではなく、考え方の整理です。本編は概要欄のリンクからどうぞ。
  https://youtu.be/7dL7AYzb7zI
