  # fact: sakokuif-15
- 語り: "1639年、幕府は、ポルトガル船の来航を禁じた。"
  shot: T01_2
  tone: 重い
  pause: 0.12
  # fact: sakokuif-24
- 語り: "翌年、マカオの使節が、貿易を元に戻してほしいと、長崎に来る。使節ら61人が斬られ、下級の船員13人だけが、マカオへ送り返された。"
  shot: B15_3
  tone: 重い
  pause: 0.12
  # fact: sakokuif-26
- 語り: "禁令から8年後の、1647年7月26日。今度は、ポルトガル本国の使節が、船2隻で、長崎に来た。"
  shot: B17_4
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-27
- 語り: "諸藩は兵を集め、港に、舟を並べた橋を架けて、船を閉じ込めた。佐賀藩1つだけで、1万1,350人だ。"
  shot: B17_5
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-26
- 語り: "それでも幕府は、通商を断っただけで、一行の命は助け、帰らせた。乗っていた人に、宣教師は、1人もいなかった。"
  shot: B12_6
  tone: 重い
  pause: 0.12
  # fact: sakokuif-26
- 語り: "ここからは、もしもの話。もしも1639年に、船を止めずにいても、宣教師のいない船さえ断る幕府なら、扉は、長くは開かなかっただろう。"
  shot: B13_7
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-25
- 語り: "使節を出す前、マカオが用意していた、ある誓いの書付には、何が書かれていたのか。"
  shot: B16_8
  tone: 疑問
  pause: 0.15
