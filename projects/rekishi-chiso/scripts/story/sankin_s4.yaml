# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った浮世絵だけ。新しい絵は作らない。
# 切り口：宿場は大名で潤ったのか（矢掛宿の宿代の値切り・郡山宿の年22.7日・助郷）。条文（s1）・人数（s2）・大井川（s3）・終わり（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml）：sankin-28・29・30・58。数は本編の言い方（出どころ付き）のまま。
#   ・安永10年＝1781年（同年4月に天明へ改元）は計算し直して合う。143→128→138文は nippon.com の連載（「といいます」）→「という」。
#   ・22.7÷12＝1.89 →「月に2日にもならない」（本編のまま）。
#   ・助郷の賃金（無償、または日当2〜3文）は小林明さんの記述 →「と小林明さんは書いている」。
# 理解テスト4問：
#   ①誰の話か：参勤交代の行列と、街道の宿場
#   ②いつ・どこで何が：1781年（安永10年）、萩藩の600〜700人が矢掛宿に泊まり、宿代143文を128文に値切って138文で折り合った
#   ③宿場は得をしたか：郡山宿の本陣に行列が泊まったのは年平均22.7日。月に2日にもならない。人馬が足りないと近くの村が助郷で出し、賃金は無償か日当2〜3文
#   ④どうなったか：大名を泊めた宿場は本当に得をしたのか（問い）
title: 参勤交代｜大名行列は、宿代を値切った
yt_title: 大名行列が宿代を値切った　1781年の矢掛宿、1人143文の交渉と宿場の本当の稼ぎ
description: |-
  1781年、安永10年。萩藩の行列、600人から700人が、矢掛宿に泊まりました。旅籠は1人143文。萩藩は128文を求め、138文で折り合ったといいます。
  宿場が大名で潤った、とは限りません。西国街道、郡山宿の椿本陣に残る宿帳では、行列が泊まった日は1年に平均22.7日。月に2日にもなりません。参勤は年2回に集中するため、予約のない月もありました。人馬が足りなければ、近くの村が助郷として出し、その賃金は無償、あるいは日当2文から3文だった、と小林明さんは書いています。
  これほどの旅を、幕府は、なぜ大名に命じたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
