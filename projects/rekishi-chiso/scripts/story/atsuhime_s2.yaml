# 理解テスト：①篤姫の話 ②1868年、一橋の屋敷で、薩摩の島津家が年3万円を申し出た ③固く断った ④その「円」は1868年にはまだ無く、もとの金額は決められない
title: "篤姫｜断った仕送りは「年3万円」？"
yt_title: "篤姫が断った薩摩の仕送りは「年3万円」　けれど1868年には、まだ「円」が無かった"
description: |-
  江戸城を出た篤姫の苦しい暮らしを察して、薩摩の島津家は、1年に金3万円を贈りたい、と言ってきた。篤姫は固く断り、西郷隆盛が一橋の屋敷まで出向いて頼んでも、聞き入れなかった。昭和19年の『禁苑史話』は、そう書いています。
  けれど、円というお金の単位が決まったのは明治4年（1871年）。篤姫が一橋の屋敷にいた慶応4年（1868年）には、まだ円はありません。同じ本は、慶応4年正月の格子戸の費用も「3千円あまり」と円で書いています。
  本編では、城を出たあとの15年あまりを、当時の新聞・勝海舟の談話・昭和の本でたどっています。本編は概要欄のリンクからどうぞ。
