# 計算：1018→2026＝1008年。1938→2026＝88年。2013年は世界の記憶への登録決定（6月19日）。
# 理解テスト4問：①藤原道長の自筆日記『御堂関白記』 ②京都の陽明文庫（1938年に近衛文麿が設立、10万点あまり） ③国宝は御堂関白記のほかに7件・重要文化財60点あまり。2013年に世界の記憶 ④所有者は公益財団法人陽明文庫。次は五つの家の今（本編7章）
# 「14巻」は事実カード gosekke-03 の出どころ（Wikipedia 御堂関白記「自筆本14巻」）。
title: "藤原道長｜千年前の自筆日記は、いまどこに"
yt_title: "藤原道長が自分で書いた日記は、いまどこにあるのか　京都の陽明文庫と、世界の記憶になった御堂関白記"
description: |-
  藤原道長が自分で書いた日記『御堂関白記』は、京都の陽明文庫にあります。陽明文庫は、近衛家に伝わる古文書や宝物を預かる文庫で、1938年に近衛文麿が設立しました。収めているのは10万点あまり。国宝は『御堂関白記』のほかに7件、重要文化財が60点あまりと、杉並区が紹介しています。自筆本は14巻です。
  2013年6月19日、『御堂関白記』は、ユネスコの世界の記憶への登録が決まりました。所有者は、公益財団法人の陽明文庫です。道長が「この世をば」と詠んだ1018年から、1008年。
  では、道長の五つの家のうち、今、当主の名前が公に分かる家は、いくつあるのか。本編は概要欄のリンクからどうぞ。
