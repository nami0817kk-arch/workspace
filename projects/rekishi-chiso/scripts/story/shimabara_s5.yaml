# 物語完結型ショート 島原・天草一揆 s5（2026-10-31）。本編 scripts/shimabara-story.yaml（11/3 19:00 公開）から。11/4 19:30 に投稿。
# 形式は yoritomo_s1.yaml・jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・遺体・炎の絵なし（絵は本編の AI 絵 P01〜P15＝景色と物だけ、と実在の絵図・写真）。
# 切り口：オランダ船の砲撃（商館長日記の日ごとの発射数）。人数（s1）・鉛（s2）・上使（s3）・発端（s4）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml）：shimabara-70・71（本編 第6章 3〜8行）。
#   ・日記の日付は西暦（新暦）、日本側の記録は旧暦（本編 第3章 4）。砲撃は旧暦で寛永15年1月中旬〜下旬、落城（旧2月28日）の約1か月前に終わった＝本編 第6章 8の換算（私たちの換算と断る）。
#   ・死者は日記の「船の人間が1人」だけ（ポルトガル船長の手紙の「2人」は又聞きで本編でも合わないと言っているので使わない）。砲撃の効果・城内の被害には触れない。
# 理解テスト4問：
#   ①誰の話か：幕府側に頼まれたオランダ人（平戸の商館）と、船のレイプ号
#   ②いつ・どこで何が：1638年2月10日に大砲5門と砲弾を求められ、2月27日から、船と陣地の砲台から原城に向けて撃った。日記に日ごとの数が残る
#   ③何があったか：3月10日、砲の破片で船の人間が1人亡くなった。砲撃は旧暦では1月中旬〜下旬で、落城の約1か月前に終わっていた
#   ④どうなったか：外国の船まで頼んでも城はすぐには落ちなかった。城の中は何に困っていたのか、は問いで閉じる
title: 島原の乱｜幕府は、オランダ船に、城を撃たせた
yt_title: 島原の乱でオランダ船が原城を砲撃した　商館長日記に残る日ごとの数
description: |-
  島原・天草一揆（島原の乱、1637〜38年）で、攻める側は、オランダの船まで呼んで、原城に大砲を撃たせました。
  オランダ商館長の日記によれば、1638年2月10日、平戸のオランダ人は、最も大きな大砲5門と砲弾を求められます。うち2門は陣地の砲台に据えられ、船のレイプ号からも撃ちました。日記には、撃った数が日ごとに書き込まれています（日付はいまの暦）。ただ、旧暦に直すと、この砲撃は寛永15年1月の中旬から下旬で、落城の1か月ほど前に終わっていた、というのが私たちの換算です。
  外国の船まで呼んでも、城はすぐには落ちませんでした。城の中は、このとき、何に困っていたのか。本編は、概要欄のリンクからどうぞ。
hashtags: ['#島原の乱', '#日本史', '#オランダ商館']
