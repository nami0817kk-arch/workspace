title: "直江兼続｜主君は10騎、家老は30騎"
yt_title: "関ヶ原のあと、謝りに上った上杉景勝の供は10騎、家老の直江兼続は30騎　京に流れたうわさ"
description: |-
  1601年、関ヶ原で家康に逆らった罪を謝るため、上杉景勝は直江兼続を連れて会津を発ちました。そのころの京のうわさを、薩摩の島津家の家臣・鎌田政近が書状に書き留めています。景勝の供の騎馬は10騎ほど、家老の兼続の供は30騎あまり。
  昭和19年に『直江兼続伝』を書いた木村徳衛は、これを実際にはあり得ない話としています。それでも、そううわさされるほど、兼続は目立っていました。上杉家は120万石から30万石へ。けれど兼続は何の咎めも受けず、その秋、京で聯句の会を開いています。
  本編では、30万石になった上杉家と直江兼続のその後をたどっています。本編は概要欄のリンクからどうぞ。
