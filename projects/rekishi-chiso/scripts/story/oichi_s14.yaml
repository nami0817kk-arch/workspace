# 物語完結型ショート s14（2026-10-25）。投稿しない。形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 切り口の判断：依頼の第一案「秀吉が許せなかった？――お市と秀吉、二度の対面」は使わない。
#   ・お市と秀吉が会った、言葉を交わした、という当時の記録は oichi_facts.md・本編の調べに無い（「二度の対面」の根拠が無い）。
#   ・「秀吉と勝家がお市を取り合った」は江戸前期後半の『村井重頼覚書』が出どころ。勝家自身の手紙には再婚を「秀吉と申し合わせ」とあり、
#     黒田基樹は「再婚の理由を示す当時の史料はない」とする。お市が秀吉を許せなかった、と言える記録も無い。対立を作らないため替えた。
#   → 代わりの切り口：「37歳なのに22、3歳に見えた」（『渓心院文』）と、「天下一の美人」と呼ばれた理由（江戸時代の書物・娘が描かせた肖像）。
# 理解テスト4問：
#   ①誰の話か：お市の方（織田信長の妹）
#   ②いつ・どこで何が：1583年、北ノ庄城で娘3人を送り出した日、37歳なのに22、3歳に見えたと書き残された
#   ③なぜ美人と言われたか：娘の初に仕えた人たちの覚書・江戸時代の書物『祖父物語』の「天下一の美人」・娘の茶々が描かせた肖像（顔を見た人がその場で書いた記録は無い）
#   ④どうなったか：その日お市は生涯を閉じ、6年後に茶々が母の肖像を高野山に納めた。美しいお市は、娘たちの側が語り伝えた姿
# 事実の出どころ（oichi_facts.md 1章・3章「美女という評判」「肖像画」）：『渓心院文』22、3歳に見えた [クレインス][黒田65260]／
#   「天下一の美人」＝江戸時代の『祖父物語』[W市][濱田]／同時代に顔を見た人の記録は無い／1589年12月、茶々が父の十七回忌・母の七回忌に
#   両親の肖像を高野山の持明院に納めた（有力。[W淀][W市]、本編では「と言われます」）／お市 37歳で生涯を閉じる [W市]
title: お市の方｜37歳なのに、二十二三歳に見えた
yt_title: お市の方は、37歳なのに二十二三歳に見えたと書き残された【お市の方】
description: |-
  1583年、北ノ庄城。お市の方は城に残ると決め、三人の娘だけを城の外へ送り出しました。
  娘の初に仕えた人たちの覚書『渓心院文』は、その別れの日のお市を「37歳なのに、22、3歳に見えた」と書き残しています。
  江戸時代の書物『祖父物語』は、お市を「天下一の美人」と書きました。けれど、お市の顔を見た人がその場で書いた記録は、見つかっていません。
  お市の肖像は、お市の死から6年後、長女の茶々が母の供養のために高野山に納めたと言われます。美しいお市は、娘たちの側が語り伝えた姿でした。
