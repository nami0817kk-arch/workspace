# 物語完結型ショート 小栗忠順 s4（2026-11-05）。本編 scripts/oguri-story.yaml（11/6 19:00 公開、https://youtu.be/kU5JH7ybcrI）の第6章の頭・第7章の後半から。11/7 17:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。斬首の場面の細部は描かない（「斬られた」とだけ言う）。
# 絵は本編の AI 絵（out/story/oguri/main。人物は後ろ姿・遠景だけ）と小栗の肖像だけ。新しい絵は作らない。時代違いの物がある絵（O08・O09・O10・O12・O13・O17・O18・O03）は使わない（s1 の頭のコメント）。
#   O14（夜の山道の女たち）は手に下げた籠が写るが、編んだ籠で時代違いではない（拡大して確かめた）。
# 切り口：斬られる前の夜に逃がした家族。会津で生まれた娘から小栗の家が続いた。使い（s1）・取り調べ（s2）・命令書（s3）・碑（s5）には踏み込まない。
#   最期の言葉は「婦女子には寛典を」の話だけ（蜷川 1928 の本の伝え、と言う。1931 の話は s2）。
# 事実カード：oguri-10・19・21・22・37・63。言い方は本編のまま。
#   ・又一の年齢は数え年で計算し直した：嘉永元年（1848）生まれ → 1868−1848＋1＝21。本編・高崎市の観光サイト（oguri-63）と同じ。
#   ・娘の生まれた日：本編は「6月14日」と言うが、事実カード（oguri-10）の抜き書きで日まで確かめられたのは「6月」（丑木 2026）だけなので、ショートでは「6月」とだけ言う。
#   ・出どころが1つの事実（oguri-37 の最期の言葉）は本の名を語りで言う。託した先・逃げた道は『群馬県史』の名を付ける。
# 理解テスト4問：
#   ①誰の話か：小栗忠順と、その母・妻みち子・又一の許婚
#   ②いつ・どこで何が：1868年閏4月、上州の権田村。小栗は斬られる前の夜、3人を村の中島三左衛門に託して逃がした
#   ③家族はどうしたか：越後を通って会津へ入り、6月、身ごもっていたみち子が女の子（国子）を産んだ
#   ④どうなったか：小栗と又一は斬られたが、のちに国子が婿を迎え、小栗の家は続いた
title: 小栗忠順｜斬られる前の夜、家族を逃がした
yt_title: 小栗忠順は斬られる前の夜に母と身ごもった妻を逃がした　会津で生まれた娘から続いた小栗家
description: |-
  幕府の切れ者、小栗忠順は、斬られる前の夜、家族を逃がしていました。
  1868年閏4月、新政府の軍は、小栗父子を召し捕れと命じていました。1927年の『群馬県史』によれば、小栗は、年老いた母と、妻のみち子、養子の又一の許婚の3人を、村の中島三左衛門に託します。妻は身ごもっていました。閏4月6日に小栗は斬られ、翌7日には又一も斬られます。21歳でした。逃げた家族は越後を通って会津へ入り、6月、みち子は女の子を産みます。のちの国子です。のちに大隈重信の世話で国子が婿を迎え、小栗の家は続いた、と伝わります。
  父の顔を知らずに生まれた娘。その父は、なぜ斬られたのか。本編は概要欄のリンクからどうぞ。
