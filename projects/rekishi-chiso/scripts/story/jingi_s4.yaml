# 物語完結型ショート 三種の神器 s4（2026-11-05）。本編 scripts/jingi-story.yaml（11/5 19:00 公開、https://youtu.be/XmWN5pboKa4）の第4章から。11/6 17:30 公開。
# 形式は sankin_s2.yaml（食い違いの表）を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った太平記の絵巻だけ。新しい絵は作らない。
# 切り口：後醍醐天皇が渡した神器は「似せ物」だった、と『太平記』は書く。けれど同じ本の中でも、北朝側の記録とも食い違う。鏡（s1）・盗難（s2）・壇ノ浦（s3）・1443年（s5）には踏み込まない。
# 事実カード：jingi-42・43・44・46。言い方は本編のまま。
#   ・建武3年＝1336年、正平一統は1351年（正平6年）から、明徳3年＝1392年を確かめた。
#   ・「行器」は読みが割れるので画面と声は「足の付いた器」と言い換えた（本編は「行器」）。
#   ・弁当に見せた話は太平記巻18（jingi-43）→「という」。
# 理解テスト4問：
#   ①誰の話か：後醍醐天皇と、南北朝の時代の三種の神器
#   ②いつ・どこで何が：1336年、比叡山から都へ戻る途中で、用意した似せ物と取り替えて渡した、と『太平記』巻17
#   ③記録はどう割れるか：同じ『太平記』で新田の側は「皇太子に渡してあった」。1351年の正平一統では、太平記は南朝が偽物として勾玉の箱を捨てたと書き、続神皇正統記は賀名生へ移したと書くだけ
#   ④どうなったか：1392年に南北朝は一つになり、神器は都の内裏に入った。偽物だったかは記録で食い違ったまま
title: 三種の神器｜渡したのは、似せ物だったのか
yt_title: 後醍醐天皇は「似せ物」の三種の神器を渡したのか　『太平記』の中でさえ食い違う南北朝の神器
description: |-
  後醍醐天皇が北朝に渡した三種の神器は、似せ物だった。『太平記』は、そう書きました。
  1336年、比叡山から都へ戻る途中、後醍醐天皇は前もって用意した似せ物と取り替えて渡した、と『太平記』巻17にあります。ところが同じ『太平記』の中で、新田の側は、神器は皇太子に渡してあったと語ります。吉野へ逃れるとき、神器は足の付いた器に入れられ、お参りの人の弁当のように見せたといいます。1351年からの正平一統では、『太平記』は、南朝が受け取った神器を偽物として勾玉の箱を捨てたと書き、北朝の側の『続神皇正統記』は、賀名生へ移したと書くだけです。1392年、南北朝は一つになり、神器は都の内裏に入りました。
  偽物だったのか。本編は概要欄のリンクからどうぞ。
