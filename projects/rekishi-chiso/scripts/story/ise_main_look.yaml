# 物語型の本編（横 16:9）の見た目と絵の割り当て：伊勢参りの旅費（scripts/ise-story.yaml）。chiso/storymain.py が読む。
# 11-21 作成（11/27 12:00 公開）。nagaya_if_main_look.yaml・rouyashiki_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini、11-21）。B01〜B28・T02 はこの回のために作った（out/story/ise/main/<名>.jpg。T02 はサムネ案Bと同じ絵）。
#   B02・B06・B12・B22 は Gemini の上限（u/0）で作れず、B03・B13・B05・B15 で代えた（11-21）。B09（箱根の関所）は門が鳥居の形になったので使わない（11-21）。
#   1845年ごろの東海道と伊勢。旅姿は菅笠・脚絆・草鞋。字・紋・のぼりの字は描かない。実在の人物（国三郎・清河八郎ほか）の顔は描かない（後ろ姿・遠景・誰とも名指さない旅人）。
