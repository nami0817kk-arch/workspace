# 物語完結型ショート 宮本武蔵 s3（2026-10-29）。本編 scripts/musashi-story.yaml の第2章（『沼田家記』）から。
# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（M*.jpg。人物なし）と実在の絵図（豊後国絵図、臼杵市歴史資料館蔵）。決闘・負傷の場面に人物の絵は当てない。
# 事実カード：musashi-14・16・17・18・19
#   ・『沼田家記』の原文は個人の記事（カクヨム）が引く翻刻が根拠 → 「個人の記事が引く翻刻では」「と読める」で言う。
#   ・「豊後の無二斎のもとへ送った」「小次郎の弟子たちに追われた」は言わない。豊後へ送らせた、は翻刻の「城に置き、豊後へ送らせた」の範囲で言う。
# 理解テスト4問：
#   ①誰の話か：宮本武蔵と、『沼田家記』
#   ②いつ・どこで何が：決闘の約60年後の1672年、門司城代だった沼田延元の子孫が『沼田家記』をまとめた。武蔵が門司へ逃げて来た、と書く
#   ③何が書かれているか：弟子は来ない約束だったのに武蔵の弟子たちが隠れていて、蘇生した小次郎を打ち殺した。武蔵は逃れがたく門司へ逃げ、延元が請け合った
#   ④どうなったか：魚住孝至教授は、助けた側の子孫の書物だからドラマティックに書いたのではないか、と話す
title: 宮本武蔵｜勝った武蔵は、門司へ逃げたと書かれた
yt_title: 巌流島で勝った武蔵が門司へ逃げた？　60年後の『沼田家記』に書かれた弟子と小次郎
description: |-
  勝ったはずの宮本武蔵が、門司へ逃げた。そう書いた記録があります。
  決闘のおよそ60年後、寛文12年、1672年。門司城代だった沼田延元の子孫が、『沼田家記』をまとめました。個人の記事が引く翻刻では、双方とも弟子は一人も来ない約束でしたが、島には武蔵の弟子たちが来て隠れていた、とあります。武蔵に打たれた小次郎はいったん蘇生し、弟子たちがあとから打ち殺した、と読めます。
  国際武道大学の魚住孝至教授は、延元の業績を子孫が残した書物だから、ドラマティックに書いたのではないか、と話しています。
