references:
- 岩崎英重編『坂本龍馬関係文書』第一・第二（日本史籍協会 1926。今井信郎・大石鍬次郎の口書、申渡、寺村左膳手記、菅野覚兵衛・清岡半四郎・小野淳輔書翰、田中光顕談話ほか）・『谷干城遺稿』（1912）・『大久保利通文書』第二・瑞山会『維新土佐勤王史』（1912）
- 結城礼一郎（1924）・渡辺修二郎『坂本竜馬言行録』（1913）・井上通泰『南天荘墨宝』（1930）・景浦直孝（1915）・菊地明「坂本龍馬 近江屋事件の現在」（『国立国会図書館月報』596、2010）・桐野作人『龍馬暗殺』（2018）と中村武生の書評・高知県の発表（2017）・宮川禎一（2016）
