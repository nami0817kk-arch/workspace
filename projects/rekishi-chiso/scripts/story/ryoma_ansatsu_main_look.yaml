parts:
- type: quote
  from: 14
  to: 14
  label: 史料
  text: 何者とも知れない7人が来て／うち3人が二階へ上がった
  source: 寺村左膳の手記（慶応3年）
- type: quote
  from: 16
  to: 16
  label: 史料
  text: 賊の言葉は「こなくそ」と／「もうよい」だけ
  source: 谷干城の講演（『谷干城遺稿』1912）
- type: quote
  from: 21
  to: 21
  label: 史料
  text: 敵は　会津に属する／新選組に決まった
  source: 菅野覚兵衛の手紙（慶応3年11月24日）
- type: quote
  from: 46
  to: 46
  label: 史料
  text: 捕らえよ／手に余れば討ち取れ
  source: 今井信郎の口書（明治3年）
- type: quote
  from: 53
  to: 53
  label: 史料
  text: 手を下さずといえども／この事件に関わった
  source: 刑部省の申し渡し（明治3年9月20日）
- type: quote
  from: 62
  to: 62
  label: 史料
  text: 事実も多少飾り／大いに芝居がかりで
  source: 結城礼一郎の本（1924年）
- type: quote
  from: 69
  to: 69
  label: 史料
  text: 斬った自慢をする世の中／当てにならぬ
  source: 谷干城の講演（『谷干城遺稿』1912）
- type: quote
  from: 71
  to: 71
  label: 史料
  text: 暗殺にあらず／職務として捕らえに向かった
  source: 今井信郎の回答（明治42年）
- type: versus3
  from: 72
  to: 72
  items:
  - - 1870年 口書
    - 見張り
  - - 1900年 雑誌
    - 自分が斬った
  - - 1909年 回答
    - 命令で格闘
  every: 1.6
- type: versus3
  from: 81
  to: 81
