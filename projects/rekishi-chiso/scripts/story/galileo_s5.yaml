title: "ガリレオ｜1992年の演説に、「謝罪」の語はない"
yt_title: "1992年、教皇はガリレオについて演説した　そこに「謝罪」の言葉も、判決の取り消しもなかった"
description: |-
  1992年10月31日、教皇ヨハネ・パウロ2世は、ガリレオについて、フランス語で演説しました。当時の神学者たちの誤りは、世界の構造の知識が、聖書の字句によって決まる、と考えたことだ、と述べています。
  ただし、この演説に「謝罪」の語はなく、判決を取り消す、とも言っていません。誤りの主語は、神学者たちです。演説は、ガリレオの側も、仮説として示す助言を退けた、と述べ、この事件を「悲劇的な相互の無理解」と呼びました。
  判決から359年。この演説にも、「それでも動く」は出てきません。では、判決は、そのあいだ、どう扱われてきたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/O80RShvkLVU
