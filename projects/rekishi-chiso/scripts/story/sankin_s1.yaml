# 物語完結型ショート 参勤交代 s1（2026-10-31）。本編 scripts/sankin-story.yaml（11/4 19:00 公開、https://youtu.be/cZ1q-xRuDHc）の序章・第5章から。11/5 9:30 公開。
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。絵は本編の AI 絵（out/story/sankin/main/P01〜P09。人物なし）と本編で使った浮世絵だけ。新しい絵は作らない。
# 切り口：参勤を命じた条文そのものに「供を減らせ」（寛永12年）。人数の食い違い（s2）・大井川（s3）・宿場（s4）・終わり（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml）：sankin-01・06・19・20。言い方は本編のまま。
#   ・1635年＝寛永12年、1634年は「その前の年」、1721年＝享保6年、1842年＝天保13年は計算し直して合う。「230年近く」は1635→文久2年（1862）の緩和で227年（本編まとめの言い方）。
#   ・細川忠利の願い出は小林明さん（nippon.com）の記述だけ（本編も出どころ付き）→「と小林明さんは書いている」。仙台藩の1577人は「といわれる」。
# 理解テスト4問：
#   ①誰の話か：江戸幕府と大名（参勤交代を命じた武家諸法度の条文）
#   ②いつ・どこで何が：1635年（寛永12年）の武家諸法度が、毎年4月の参勤を命じ、同じ条で供を減らせと書いた
#   ③何が起きたか：前年に細川忠利が削減を願い出ていた。1721年にも人数の目安。それでも仙台藩は1842年に1577人
#   ④どうなったか：「減らせ」と書かれた旅は230年近く続いた → 幕府はなぜ命じたのか（本編へ）
title: 参勤交代｜命じた条文に、「お供を減らせ」
yt_title: 参勤交代を命じた条文には「お供を減らせ」と書かれていた　寛永12年の武家諸法度
description: |-
  参勤交代を命じた法令の、同じ条文に、「お供を減らしなさい」と書かれています。
  1635年、寛永12年の武家諸法度。大名は、毎年4月に参勤せよ。その続きに、供の人数が近ごろとても多い、国や郡の費用で、人々の苦労でもある、これからは身分に応じて減らすように、とあります。その前の年には、熊本の細川忠利が従者の削減を願い出ていた、と小林明さんは書いています。1721年にも人数の目安が出ました。それでも、仙台藩の行列は、1842年に1577人に及んだといわれます。
  幕府は、なぜ、毎年の往復を命じたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
