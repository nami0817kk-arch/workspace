# 物語完結型ショート 参勤交代 s3（2026-10-31）。本編 scripts/sankin-story.yaml（11/4 19:00 公開、https://youtu.be/cZ1q-xRuDHc）の第3章（大井川の川留め）から。11/5 15:30 公開。
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った浮世絵だけ。新しい絵は作らない。
# 切り口：大井川には橋がなかった（川留め・川札・費用・最長28日）。条文（s1）・人数（s2）・宿場の値切り（s4）・終わり（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml）：sankin-25・26・27。数は本編の言い方（出どころ付き）のまま。
#   ・4尺5寸＝4.5×30.3cm＝136.4cm →「約136センチ」は合う。
#   ・最長28日の年は、島田市の論文集が慶応4年、旅行情報サイトが明治元年（どちらも1868年。慶応4年9月8日に明治改元）→「1868年のこと」とだけ言う（本編と同じまとめ方）。
#   ・料金は島田市の論文集の「いちばん低いときでも48文」と肩車2枚・連台6枚。国会図書館の回答の94文（享保年間）は尺のため入れない。
#   ・30両から40両は「といいます」（国会図書館のレファレンス協同データベースが本の記述を引いたもの）→「という」。
# 理解テスト4問：
#   ①誰の話か：参勤交代の行列と、東海道の大井川
#   ②いつ・どこで何が：大井川には橋がなく、水深4尺5寸（約136cm）を超えると川留めで渡れなかった
#   ③どうしたか：川札を買って人足に渡してもらった（48文から、肩車2枚・連台6枚）。10万石の行列で30〜40両
#   ④どうなったか：川留めは最長28日（1868年）。料金と宿代は島田宿・金谷宿の大きな収入 → あなたなら何日待てるか
title: 参勤交代｜大井川には、橋がなかった
yt_title: 大名行列も渡れなかった大井川　橋のない川の「川留め」は最長28日続いた
description: |-
  東海道の大井川には、橋がありませんでした。
  水深が4尺5寸、約136センチを超えると川留めで、幕府の御状箱のほかは渡れなくなりました。渡るには川札が要り、いちばん浅いときでも1枚48文、肩車は川札2枚、連台は6枚です。10万石クラスの行列が大井川を渡るには、30両から40両は必要だったといいます。川留めは最長で28日続いたとされ、1868年のことです。川を渡る料金と、足止めされた旅人の宿代は、島田宿と金谷宿の大きな収入になりました。
  これほどの旅を、幕府は、なぜ大名に命じたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
