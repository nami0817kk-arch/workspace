# hook＝道真の遺骸を運ぶ車に何が起きたか（答えはこのショートの中：途中で止まり動かず、その場所に葬った。本文に牛は出ない）。
# tease＝道真の死のあと、都で何が起きたか（答えは本編 第4章：時平39歳の死・源光・2人の皇太子。michizane-12〜15・32）。
# 数え直し：延喜3年2月25日＝903年3月26日（ユリウス暦）。数え 903−845+1＝59。左遷 901年正月25日 → 2年と1か月あまり。
#   旧暦2月なので季節を言うなら春。言わない。
# 「牛が座り込んだ」は、よく知られた話として言い、本文（『北野天神縁起』・『歴代編年集成』）は「車」と分けて言う。牛の姿は絵巻の絵（michizane-10 の要約）。
# 理解テスト：①菅原道真の死と葬りの話 ②903年2月25日、大宰府で59歳で死に、三笠郡の四堂のあたりへ運ばれる途中 ③死の前に詩を1巻にまとめて都の紀長谷雄に送った ④車が止まって動かず、その場所に葬った。その上に安楽寺、今の太宰府天満宮が建った
title: "菅原道真｜動かなくなった車"
yt_title: "菅原道真の遺骸を運ぶ車は、途中で止まって動かなくなった　59歳の死と、太宰府天満宮のはじまり"
description: |-
  延喜3年、903年の2月25日。右大臣から大宰府へ流された菅原道真は、流された先で亡くなりました。数えで59歳。流されてから2年と1か月あまりで、都へ戻ることはありませんでした。
  死を前に、道真は大宰府で作った詩を1巻にまとめ、都の紀長谷雄に送っています。のちの『菅家後集』です。
  遺骸は三笠郡の四堂のあたりに葬られるはずでしたが、『北野天神縁起』によれば、運ぶ車が途中で止まって動かなくなり、その場所に葬られました。よく知られた「牛が座り込んだ」という話は、この場面の本文には出てきません。その墓の上に建ったのが安楽寺、今の太宰府天満宮です。
  本編では、左遷の日、大宰府での2年、都で続いた死と清涼殿の雷、そして学問の神様になるまでを、当時の記録でたどっています。本編は概要欄のリンクからどうぞ。
