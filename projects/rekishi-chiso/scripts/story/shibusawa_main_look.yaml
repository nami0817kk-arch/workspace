#   慶喜の葬儀（大正2年）は僧侶・鳥居を描かない。家紋・字は入れない。
# 実在の写真（パブリックドメイン）は額（frame:）で：渋沢（1866ごろ・1867パリ・1900・1922以前）・慶喜（1867・明治の狩猟姿・晩年3枚）。
# プロンプトは scratchpad/main-shibusawa/shibusawa_prompts.py。
