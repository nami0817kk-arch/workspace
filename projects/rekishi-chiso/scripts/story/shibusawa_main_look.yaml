- {type: quote, from: 17, to: 17, label: 史料, text: 今日はそんな愚痴を聞くために／会つたのではない, source: 渋沢栄一の談話（『竜門雑誌』第498号、1930年）}
- {type: quote, from: 26, to: 26, label: 史料, text: 連中の妬心を引起して／結局は足下の身に害を生ずる虞れもある, source: 渋沢栄一『雨夜譚』（1887年）}
- {type: quote, from: 43, to: 43, label: 史料, text: 公は御許諾がない／どうぞ止めて呉れと仰せられた, source: 渋沢栄一『徳川慶喜公伝』自序（1918年）}
- {type: quote, from: 65, to: 65, label: 史料, text: 速記者ありては話しにくしと仰せられて／第十四よりは又筆記となれり, source: 渋沢栄一『昔夢会筆記』例言（1915年）}
- {type: quote, from: 80, to: 80, label: 史料, text: 一身は唯だ公に奉ずるを以て／世を終らむと思ふた, source: 渋沢栄一「興山公御墓前に於て」（1917年）}
- {type: quote, from: 94, to: 94, label: 史料, text: 天下後世の為に／公の寃魂を慰めんと欲する, source: 中外商業新報（1918年。『竜門雑誌』第359号に転載）}
