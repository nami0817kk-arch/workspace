lines:
  # fact: tsurumatsu-53
  - 語り: 秀吉に跡継ぎが生まれた年、なぜ、《!天皇の弟》との縁が、解かれたのか。
    shot: T03
    tone: 強調
    pause: 0.12
  # fact: tsurumatsu-01
  - 語り: 1589年の5月27日。秀吉の側室の茶々が、山城の淀城で、男の子を産んだ。
    shot: T01
    tone: しみじみ
    pause: 0.12
  # fact: tsurumatsu-02
  - 語り: 男の子は、はじめ、棄と呼ばれた。育つように祈って、わざと棄丸と呼ばせた、と1932年の国史大図鑑は説明する。
    shot: T01b
    tone: しみじみ
    pause: 0.12
  # fact: tsurumatsu-24
  - 語り: このとき、秀吉は何歳だったのか。1914年の豊公遺文は、54歳。1926年の日本国宝全集は、52歳と書く。
    shot: Hideyoshi
    tone: しみじみ
    pause: 0.12
  # fact: tsurumatsu-23
  - 語り: 秀吉の生まれ年は、天文5年と天文6年に割れている。天文6年の生まれなら、数えで53歳だ。
    shot: T10
    tone: しみじみ
    pause: 0.12
  # fact: tsurumatsu-53
  - 語り: その年、秀吉の猶子、つまり形だけの子になっていた、後陽成天皇の弟、智仁親王が、その縁を解かれた。
    shot: Kyoto
    tone: 重い
    pause: 0.12
  # fact: tsurumatsu-53
  - 語り: 代わりに、秀吉の願い出で、知行3000石の宮家、八条宮が立てられた。
    shot: Kyotob
    tone: しみじみ
    pause: 0.12
  # fact: tsurumatsu-53
  - 語り: 跡継ぎが生まれて、天皇の家との約束が、1つ書き換えられたのだ。
    shot: T25
    tone: しみじみ
    pause: 0.3
    dip: true
  - 語り: この子は、2年後に亡くなる。その日、大名たちは、何を切ったのか。
    shot: T06
    tone: 疑問
    pause: 0.15
