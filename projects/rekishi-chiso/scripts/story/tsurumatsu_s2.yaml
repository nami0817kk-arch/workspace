# 物語完結型ショート 鶴松 s2（2026-11-06）。本編 scripts/tsurumatsu-if-story.yaml（11/7 12:00 公開）の第1章（1589年の誕生）から。11/8 11:00 公開。
# 形式は maizo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/tsurumatsu-if/main/T*）と本編で使った実在の肖像・屏風だけ。T07・T08・T29・T30 は使わない（s1 の頭のとおり）。
# 切り口：跡継ぎが生まれた1589年、秀吉の猶子だった智仁親王（後陽成天皇の弟）が縁を解かれ、知行3000石の八条宮が立てられた。
#   あわせて、幼い名の「棄」と、秀吉の年齢が本で割れること（54・52・天文6年生まれなら53）。本編の答え（鶴松の死と髻の塚）は言わない。
# 事実カード：tsurumatsu-01・02・23・24・53。言い方は本編のまま。
# 計算（自分で計算し直した）：天文6年＝1537年。1589年に数えで 1589−1537＋1＝53。天文5年（1536）なら54。52歳は本に数え方の説明なし（本編どおり言わない）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀吉と、生まれた跡継ぎ（はじめ棄と呼ばれた子）
#   ②いつ・どこで何が：1589年5月27日、茶々が山城の淀城で男の子を産んだ
#   ③何が動いたか：同じ年、秀吉の形だけの子だった智仁親王が縁を解かれ、八条宮（のちの桂宮）が立てられた
#   ④どうなったか：秀吉の年齢は本で割れるが、どの数え方でも50歳を過ぎて得た跡継ぎ。2年後の死の日の問いで閉じる
title: 鶴松の誕生｜天皇の弟との縁が解かれた
yt_title: 豊臣秀吉に跡継ぎの鶴松が生まれた1589年、天皇の弟・智仁親王は秀吉の猶子を解かれた　幼い名は「棄」
description: |-
  1589年の5月27日、豊臣秀吉の側室の茶々が、山城の淀城で男の子を産みました。のちの鶴松です。
  男の子は、はじめ、棄と呼ばれました。1932年の『国史大図鑑』は、育つように祈って、わざと棄丸と呼ばせた、と説明します。このときの秀吉の年齢は、1914年の『豊公遺文』の年譜では54歳、1926年の『日本国宝全集』では52歳と、本によって割れます。天文6年の生まれなら、数えで53歳です。
  その年、秀吉の猶子、つまり形だけの子になっていた、後陽成天皇の弟、智仁親王が、その縁を解かれました。代わりに、秀吉の願い出で、知行3000石の宮家、八条宮（のちの桂宮）が立てられています。
  この子は2年後、数えで3歳で亡くなります。もしも鶴松が生きていたら、豊臣家はどうなったのか。本編は概要欄のリンクからどうぞ。
