# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしも現代人が江戸の長屋に住んだら（scripts/nagaya-if-story.yaml）。chiso/storymain.py が読む。
# 11-19 作成（11/25 12:00 公開）。sakoku_if_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini）。T01・B01〜B24 はこの回のために作る（out/story/nagaya_if/main/nagaya_if_<名>.jpg）。
#   時と所は文政〜天保の江戸の町人地。裏長屋は板葺きの屋根・障子紙・木の戸（瓦屋根の裏長屋・ガラス窓・電灯・字・紋・時計は描かない）。
#   実在の人物は描かない。人は後ろ姿・遠景・顔の小さい群れだけ。湯屋の中は人を描かない。火事は遠景の空の赤さだけ（人の被害は描かない）。
