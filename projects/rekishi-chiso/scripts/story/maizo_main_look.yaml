  - {type: quote, from: 46, to: 46, label: 史料, text: 権田村には二三千両の…金を持ち行きしに過ぎずして, source: 蜷川新『維新前後の政争と小栗上野の死』（1928年）}
  - {type: quote, from: 76, to: 76, label: 史料, text: 向後余人へ相語り候儀、／堅く差し留められ, source: 島村弥三郎「埋メ金引上ケ願書」（明治10年。東京都公文書館の解読による）}
  - {type: quote, from: 84, to: 84, label: 史料, text: 其古金十八萬両をば、／榎本和泉守に嘱して, source: 渋沢栄一『徳川慶喜公伝』（1918年）}
  - {type: quote, from: 89, to: 89, label: 史料, text: 大阪御金蔵の有する黄金の凡ては／此に尽きたりき, source: 竹越与三郎『日本経済史』第7巻（1925年）}
  - {type: quote, from: 100, to: 100, label: 要点, text: それらは幕末期には使い果たされた, source: 飯島千秋「江戸幕府の貯蓄米金に関する基礎的研究」（科研費の研究概要、1997年）}
