# 物語型の本編（横 16:9）の見た目と絵の割り当て：徳川埋蔵金（scripts/maizo-story.yaml）。chiso/storymain.py が読む。
# 11-05 作成（11/06 12:00 公開）。jingi_main_look.yaml を写した。台本には手を入れない（承認のあと）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は16枚（M01〜M16）。Cloudflare Workers AI の FLUX.1 schnell（無料枠。1024 正方形から 16:9 を切り出し。Chrome・Gemini は使わない）。
#   人物は描かない（城・蔵・山・村・寺・川・堀・船・帳簿）。実在の人物の顔は実在の写真・絵だけ（勝海舟・榎本武揚）。小栗忠順の肖像は使わない（19時の回と重ねない・手元に無い）。
#   M04（赤城山）は富士山に似た峰が上に出るので、切り出しで下の稜線だけにする。
#   実在の絵は、ベアトの江戸城の写真・バットの大坂城の水彩（1868年1月）・幕府軍艦の図（1868年）・月岡芳年の慶喜の図・小林清親の陽明門・江戸図屏風・駿府城の絵図（パブリックドメイン）。
script: scripts/maizo-story.yaml
out: maizo_story_main
art_dir: out/story/maizo/ph
main_art_dir: out/story/maizo/main
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

