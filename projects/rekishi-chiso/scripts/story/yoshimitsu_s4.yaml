title: "足利義満｜その夜、遺体は運び出された"
yt_title: "足利義満が亡くなったその夜、遺体はひそかに運び出された　記録は「盗み出す」と書く"
description: |-
  1408年5月6日、足利義満は北山第で亡くなりました。そのままその夜のうちに、遺体はひそかに運び出されます。
  時刻は寅の刻、午前3時から5時ごろ。北山第の北御所から等持院へ、御輿と担ぐ力者6人は座主が出した、と鹿苑院殿薨葬記は書き、盗み出す、という字を使っています。火葬は10日と決まりました。跡継ぎについては、椿葉記が、言い置いた様子も無い、と書きます。椿葉記は後の年の回想で、その場の日記ではありません。
  死の2日後、朝廷は動きます。本編は次のリンクからどうぞ。
  https://youtu.be/6dJB0Rq7yeY
