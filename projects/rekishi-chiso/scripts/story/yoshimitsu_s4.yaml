# 物語完結型ショート 足利義満 s4（2026-11-13）。本編 scripts/yoshimitsu-story.yaml（11/16 12:00 公開予定、https://youtu.be/6dJB0Rq7yeY）から。11/17 に予約。
# 切り口：死んだ夜の遺体の密かな搬出と、言い置かれなかった跡継ぎ（本編第4章。yoshimitsu-07, 08, 32）。
# 形式は louis14_s1.yaml・yoshitsune_s2.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/足利義満_facts_20261113_hand.yaml）と本編の # fact: だけ。
# 絵は本編の AI 絵（out/story/yoshimitsu/main の S 番号）の切り出し・組み合わせの再利用だけ。新しい絵は作らない。
