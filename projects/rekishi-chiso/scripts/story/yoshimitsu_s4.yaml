lines:
  # fact: yoshimitsu-07
- 語り: "義満の死の夜。遺体は、ひそかに運び出された。"
  shot: S08_in5
  tone: 強調
  pause: 0.12
  # fact: yoshimitsu-07
- 語り: "時刻は、寅の刻。午前3時から5時ごろ。北山第の北御所から、等持院へ、運ばれた。"
  shot: S08_right3
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-07
- 語り: "御輿と、担ぐ力者6人は、座主が出した。鹿苑院殿薨葬記は、盗み出す、という字を使っている。"
  shot: S09_left6
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-07
- 語り: "火葬は、10日と決まった。日柄が悪いため、と薨葬記は添える。"
  shot: S07_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-32
- 語り: "中陰のあと、遺骨は、相国寺の鹿苑院に納められた。分骨は、高野山の安養院にある。"
  shot: S07_left3
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-08
- 語り: "跡継ぎは、どうか。椿葉記は、跡継ぎを言い置いた様子も無い、と書く。義嗣が継ぐのでは、という噂もあった、と。"
  shot: S04_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-08
- 語り: "結局、管領の斯波義将の計らいで、嫡子の義持が、家を継いだ。ただし、椿葉記は、貞成親王が、後の年に書いた回想だ。"
  shot: S10_left6
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-32
- 語り: "葬儀には、五山以下の長老が集まり、僧は3000人に及んだ、と薨葬記にある。"
  shot: S16_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-01
- 語り: "死の2日後。朝廷は、もう動いていた。"
  shot: S16_right3
  tone: 疑問
  pause: 0.15
