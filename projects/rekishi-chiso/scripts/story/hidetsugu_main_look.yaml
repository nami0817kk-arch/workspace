# 物語型の本編（横 16:9）の見た目と絵の割り当て：豊臣秀次（scripts/hidetsugu-story.yaml）。chiso/storymain.py が読む。
# 10-28 作成（19:00 公開）。台本には手を入れない（承認・reading-ok 済み。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（H01〜H15）＋数正の回の K05（秀吉）をそのまま使う（新しく作らない）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は表情のある全面の AI 絵が主役。実在の絵（パブリックドメイン）は額（frame:）と屏風・絵図の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/hidetsugu_ai_images.md
# 届く前は art_dir の仮の絵（H01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に H01.jpg〜を置くだけ。
# K05 は out/story/kazumasa/main/ から out/story/hidetsugu/main/（と ph/）へ写してある（out/ は git に入らないので、無ければ写し直す）。
# 処刑・切腹の場面は描かない（H10 の三条河原は遠景の人だかりだけ。台本の決まり：様子は描かない）。
script: scripts/hidetsugu-story.yaml
out: hidetsugu_story_main
art_dir: out/story/hidetsugu/ph          # 仮の絵（placeholder）＋ K05 の写し
main_art_dir: out/story/hidetsugu/main   # Gemini の 16:9 の絵（H01.jpg〜H15.jpg）＋ K05 の写し
ai_disclosure: この動画の人物・情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

