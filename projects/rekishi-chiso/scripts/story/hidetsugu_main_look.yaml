# AI 絵（16:9 横・15枚＋K05）。scene は日本語の要約（英語の指示は research/hidetsugu_ai_images.md）。
# pan：h＝左右（既定）・v＝上下・zoom＝ゆっくり寄る（顔の感情の場面だけ）。crops＝切り出し [倍率, 中心x, 中心y]
# 位置（crops・focus）は仮。届いた絵を見て合わせる
ai:
  H01: {scene: 秀次・胸から上（28歳前後・細面・関白の装束）。灯の下で思いつめた顔, pan: zoom, crops: {face: [1.25, 0.64, 0.38], left: [1.18, 0.30, 0.45]}}   # 届いた絵（10-28）：顔は右寄り（0.65, 0.40）、左に灯と襖
  H02: {scene: 伏見から高野山への山道。雨・少人数（秀次は後ろ姿・刀なし）, pan: v, crops: {right: [1.18, 0.62, 0.45]}}
  H03: {scene: 高野山の寺々を遠くから（夏・霧。人物なし）, pan: h, crops: {left: [1.18, 0.35, 0.45]}}
  H04: {scene: 青巌寺の書院。柳と鷺の襖絵の部屋（人物なし）, pan: h, crops: {right: [1.18, 0.65, 0.45]}}
  H05: {scene: 書院で書状を読む秀次（僧衣・横から）, pan: zoom, crops: {face: [1.25, 0.5, 0.38]}}
  H06: {scene: 文机の上の箇条書きの文書（読めない筆の跡）と硯, pan: h, crops: {left: [1.18, 0.38, 0.5], right: [1.18, 0.62, 0.5]}}
  H07: {scene: 使者の到着。山寺の門の前で馬を下りる侍2人（後ろ姿）と頭を下げる僧, pan: h, crops: {left: [1.18, 0.38, 0.45], right: [1.18, 0.62, 0.45]}}
  H08: {scene: 夜の縁側に一人座る秀次（後ろ姿・杉・小さな灯）, pan: h}
  H09: {scene: 夜明けの高野山の杉木立（霧・光の筋。人物なし）, pan: v, crops: {left: [1.18, 0.40, 0.5]}}
  H10: {scene: 三条河原の遠景（橋・竹の柵の向こうの小さな人だかり。残酷な描写なし）, pan: h, crops: {left: [1.18, 0.38, 0.5]}}
  H11: {scene: 聚楽第の取り壊し。足場から瓦を下ろす職人、牛車, pan: h, crops: {left: [1.18, 0.38, 0.45], right: [1.18, 0.62, 0.45]}}
  H12: {scene: 近江八幡の八幡堀と商人の町（1585年ごろ）。舟と蔵、奥の山に城, pan: h, crops: {left: [1.18, 0.38, 0.5], right: [1.18, 0.62, 0.5]}}
  H13: {scene: 瑞泉寺の境内に並ぶ五輪塔（雨・文字なし。人物なし）, pan: h, crops: {left: [1.18, 0.38, 0.5], right: [1.18, 0.62, 0.5]}}
  H14: {scene: 現代の京都の住宅地の発掘現場。石垣の根石と調査員の後ろ姿, pan: h, crops: {right: [1.18, 0.62, 0.5]}}
  H15: {scene: 終了画面用。夕暮れの高野山の山並み（右半分を空けた構図）, lock: [1.0, 0.5, 0.5]}
  K05: {scene: 数正の回の秀吉・金の襖の御殿に座る。笑みと鋭い目, crops: {face: [1.25, 0.5, 0.40]}}

