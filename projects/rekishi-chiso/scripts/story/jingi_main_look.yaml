parts:
  - {type: quote, from: 13, to: 13, label: 史料, text: 是歳、沙門道行盗草薙剣、逃向新羅／而中路風雨、芒迷而帰, source: 『日本書紀』天智天皇7年（668年）是歳条}
  - {type: quote, from: 16, to: 16, label: 史料, text: 卜天皇病、祟草薙剣／即日、送置于尾張国熱田社, source: 『日本書紀』朱鳥元年（686年）6月}
  - {type: quote, from: 23, to: 23, label: 史料, text: 更鋳鏡造剣、以為護身御璽／是今践祚之日所献神璽鏡剣也, source: 斎部広成『古語拾遺』（807年）}
  - {type: quote, from: 32, to: 32, label: 史料, text: 瓦上在鏡一面、径八寸許／頭雖有小瑕、専無損, source: 『扶桑略記』天徳4年（960年）9月24日条が引く天皇の日記}
  - {type: quote, from: 63, to: 63, label: 史料, text: 不納龍宮、不移他州歟／従在処五町内, source: 九条兼実『玉葉』文治3年（1187年）8月に写された占いの文}
  - {type: quote, from: 114, to: 114, label: 史料, text: 天皇崩スルトキハ皇嗣即チ践祚シ／祖宗ノ神器ヲ承ク, source: 皇室典範 第10条（1889年）}
  - {type: quote, from: 118, to: 118, label: 史料, text: 万一の場合には自分が御守りして／運命を共にする外ないと思ふ, source: 『木戸幸一日記』1945年7月31日（辻田真佐憲の記事の引用による）}
  - {type: quote, from: 134, to: 134, label: 要点, text: 剣と鏡　もとの品と、そばの品／勾玉　1458年に都へ戻った, source: この動画で見た記録から}

