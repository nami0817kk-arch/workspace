# 物語型の本編（横 16:9）の見た目と絵の割り当て：三種の神器（scripts/jingi-story.yaml）。chiso/storymain.py が読む。
# 10-31 作成（11/05 19:00 公開）。sankin_main_look.yaml を写した。台本には手を入れない（承認のあと）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：神器の実物の姿は誰も知らないので、AI 絵（J01〜J12、Gemini の無料 web、1024x572）は箱・布・社殿・海・炎・森・巻物だけ。人物・文字・紋は描かせない。
#   実在の絵は平治物語絵巻（内裏の炎上の場面の代わり）・尾張名所図会の熱田・安徳天皇縁起絵図・壇ノ浦の浮世絵・伊勢参宮名所図会・太平記の絵を part で使う。
