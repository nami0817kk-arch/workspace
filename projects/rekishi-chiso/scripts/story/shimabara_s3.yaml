# 物語完結型ショート 島原・天草一揆 s3（2026-10-31）。本編 scripts/shimabara-story.yaml（11/3 19:00 公開）から。11/4 15:30 に投稿。
# 形式は yoritomo_s1.yaml・jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・遺体・炎の絵なし（絵は本編の AI 絵 P01〜P15＝景色と物だけ、と実在の絵図・写真）。
# 切り口：幕府の総大将（上使）板倉重昌が元日の総攻めで戦死した。旅の違い（重昌21日・信綱30日）と、間に合わなかった知らせ。人数（s1）・鉛（s2）・発端（s4）・オランダ船（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml）：shimabara-24・58・62・96。
#   ・寛永15年元日＝1638年2月14日（本編 第3章 4）。細川忠利の書状は本編の「今の言葉にすると」の訳のまま。戦死の場面の絵なし（景色と書状の机のみ）。
#   ・本編の「重矩は加増なしの1万石の移封」は、事実カード95では1万5千石から弟へ5千石を分けた結果で、言い方が粗いので使わない。
# 理解テスト4問：
#   ①誰の話か：幕府が最初に送った総大将（上使）、板倉重昌
#   ②いつ・どこで何が：寛永15年の元日（いまの暦で2月14日）、島原の総攻めに失敗し、重昌は戦死した
#   ③なぜか：最初の軍は寄せ集めで、あとから来る信綱は大人数で30日かけていた。元日の前に着いていれば敗戦はなかったかもしれない、という推測
#   ④どうなったか：知らせは信綱が島原に入った日に届いた。総攻めに失敗した幕府は、このあと何をやめたのか、は問いで閉じる
title: 島原の乱｜幕府の総大将は、元日に戦死した
yt_title: 島原の乱で幕府の総大将は元日に戦死した　知らせは後から来た老中が着いた日に届いた
description: |-
  島原・天草一揆（島原の乱、1637〜38年）で、幕府が最初に送った総大将、板倉重昌は、寛永15年の元日に戦死しました。
  重昌は数十名で、21日かけて島原に着きました。あとから来る老中、松平信綱は、従卒1300名で30日かけて向かい、重昌の戦死の知らせは、信綱が島原に入った日に届きます。東京大学史料編纂所の報告書で武田昌憲さんは、元日の前に信綱が着いていれば、敗戦はなかったかもしれない、と推測しています。
  総攻めに失敗した幕府は、このあと、何をやめたのか。本編は、概要欄のリンクからどうぞ。
hashtags: ['#島原の乱', '#日本史', '#板倉重昌']
ai_images: true
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
