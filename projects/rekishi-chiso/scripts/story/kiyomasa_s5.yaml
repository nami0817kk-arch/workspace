title: "加藤清正｜毒の芝居は186年後"
yt_title: "加藤清正の「毒殺」の話は、いつ生まれた？　毒の酒の芝居は死の186年後の大坂、毒饅頭の清正は明治の歌舞伎"
description: |-
  1611年、加藤清正は二条城の会見から3か月足らずで亡くなりました。その年の記録『当代記』に、毒の話はありません。
  毒の酒を飲まされる清正を筋に取り入れた歌舞伎『けいせい遊山桜』が大坂の中座で上演されたのは、1797年。清正の死の186年後です。1807年には浄瑠璃『八陣守護城』が、清正を「正清」と名を変えて、第四の段を「毒酒」としました。1875年、九代目市川団十郎が演じた清正は、のちに「毒饅頭の清正」と呼ばれる当たり役になります。
  本編では、毒の話を退けた明治・大正の伝記と研究、当時の記録に残る病の記事を並べています。本編は概要欄のリンクからどうぞ。
