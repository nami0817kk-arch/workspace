  pause: 0.12
  # fact: kiyomasa-41
- 語り: "1797年、大坂の中座で、歌舞伎が上演される。毒の酒を飲まされる清正を、筋に取り入れた芝居だった。"
  shot: K16_4
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-42
- 語り: "その10年後、1807年の浄瑠璃、『八陣守護城』では、清正は、正清という名に変えられ、第四の段の題は、毒酒。"
  shot: K16_5
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-42
- 語り: "家康にあたる人物の指図で、天皇の使いが、杯に毒を入れる筋だった。"
  shot: K17_6
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-46
- 語り: "1875年、東京の河原崎座で、九代目、市川団十郎が演じた清正は、のちに、毒饅頭の清正と呼ばれる当たり役になった。"
