title: "福原遷都｜出発の2日前、公家は日記に書いた"
yt_title: "清盛の福原遷都　出発の2日前に日取りを知った公家は、日記に「悲しむべき宿業」と書いた　清盛の返事は「来るな」"
description: |-
  1180年6月2日、天皇は京都を出て、今の神戸にあたる福原へ向かいました。公家の九条兼実が日取りを知ったのは、その2日前の5月30日。日記の玉葉に、仰天のほか無し、そして、乱世に生まれて、こんな事を見るのは、悲しむべき宿業だ、と書きます。
  6月1日、兼実は清盛へ使いを出し、福原に参るべきかと尋ねました。清盛の返事は、泊まる所がない、すぐには来るな、というものでした。
  出発の日、玉葉はこの行幸を何と書いたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SmAJSk6zrYk
