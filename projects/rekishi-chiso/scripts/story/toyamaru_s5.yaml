title: "洞爺丸｜裁決は、船長だけの責任とは言わなかった"
yt_title: "洞爺丸の裁決は、船長の過失のほかに、船の構造と運航の管理も一因とした　死者の数は資料によって違う　1,155人（裁決）、1,139人（気象庁）"
description: |-
  洞爺丸には1,314人が乗り、裁決の数では、1,155人が亡くなりました。助かったのは159人です。
  1959年の高等海難審判庁の裁決は、遭難は船長の運航上の過失から起きたとしたうえで、船の構造と運航の管理も、一因としました。管理する側が、部下を非常勤務につかせず、自ら指揮もしなかった、とも認定しています。
  死者の数は、気象庁は1,139人、事故の2日後の国会の途中の数字は旅客1,142人。資料によって違います。
  風は、なぜ弱まったのか。本編は概要欄のリンクからどうぞ。
  亡くなった方々とご遺族に、敬意を払って作っています。
  https://youtu.be/i6YryMy_fHQ
