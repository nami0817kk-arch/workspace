  pause: 0.12
  # fact: toyamaru-16
- 語り: "1959年の裁決の結論は、こうだ。遭難は、船長の、運航上の職務の過失から起きた。"
  shot: S09_4
  tone: 強調
  pause: 0.12
  # fact: toyamaru-16
- 語り: "さらに、船の構造と、運航の管理が、適当でなかったことも、一因だ、と。"
  shot: S11_5
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-17
- 語り: "青函局長ら、管理する側は、部下を非常勤務につかせず、自ら指揮もしなかった、と裁決は認定した。"
  shot: S14_6
  tone: 重い
  pause: 0.12
  # fact: toyamaru-32
- 語り: "北斗市の七重浜には、翌年、慰霊の碑が建てられた。2024年9月26日にも、70年の法要が営まれた。"
