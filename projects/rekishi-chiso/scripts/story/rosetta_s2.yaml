title: "ロゼッタストーン｜戦利品になった石"
yt_title: "ロゼッタストーンはどうやってイギリスのものになったのか　フランス将軍メヌーは「私が掘り出させた石」と言い、英国のターナー大佐は「運び出した」と書いた"
description: |-
  ロゼッタストーンの側面には、「イギリス軍がエジプトで捕獲」と、「ジョージ3世寄贈」の、2つの文字があります。
  1801年8月末から9月初めのアレクサンドリアの降伏協定では、遺物は連合軍の将軍の処分に委ねる、と書き換えられた、とルクラントは述べます。フランスの将軍メヌーは、石を私物だと言い張り、イギリスのターナー大佐は、砲兵の運搬車で運び出した、と書きました。
  石を渡す前、フランスの学者は、ターナーにある頼みをしていました。それは何か。本編は概要欄のリンクからどうぞ。
  https://youtu.be/ULryhFAAhgQ
