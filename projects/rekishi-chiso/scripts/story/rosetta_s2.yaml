lines:
  # fact: rosetta-A22
- 語り: "ロゼッタストーンは、どうやって、イギリスのものになったのか。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: rosetta-A19
- 語り: "1801年8月末、アレクサンドリアで、降伏協定が結ばれた。"
  shot: C09_2
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A19
- 語り: "ルクラントによれば、第16条は、フランスの案を、イギリス軍が書き換えた。遺物は、連合軍の将軍の処分に、委ねる、と。"
  shot: C08_3
  tone: 重い
  pause: 0.12
  # fact: rosetta-A20
- 語り: "フランス軍の将軍メヌーは、石を、自分の私物だと、言い張った。"
  shot: C09_4
  tone: 重い
  pause: 0.12
  # fact: rosetta-A20
- 語り: "イギリス軍の司令官への手紙には、ロゼッタで私が掘り出させた石を持っている、とある。"
  shot: C08_5
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A21
- 語り: "石を受け取ったイギリスのターナー大佐は、のちの書簡に、砲兵の運搬車で、メヌーの家から運び出した、と書いている。"
  shot: C09_6
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A23
- 語り: "1802年、石は、イギリスへ渡った。"
  shot: C11_7
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A22
- 語り: "石の側面には、「イギリス軍がエジプトで捕獲」と、「ジョージ3世寄贈」の、2つの文字がある。"
  shot: H01_8
  tone: 重い
  pause: 0.12
  # fact: rosetta-A22
- 語り: "取り上げた石を、国王が博物館に贈った形だ。"
  shot: C11_9
  tone: 重い
  pause: 0.12
  # fact: rosetta-A21
- 語り: "石を渡す前、フランスの学者は、ターナーに、ある頼みをしていた。それは何か。"
  shot: C07_10
  tone: 疑問
  pause: 0.15
