# 物語完結型ショート 和宮 s3（2026-10-29）。本編 scripts/kazunomiya-story.yaml の第1章（婚約者のいた皇女）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の想像1「兄上のお心を」は使わない）。
# 絵は本編の AI 絵（out/story/kazunomiya/main/W*.jpg）と実在の肖像（孝明天皇・熾仁親王・家茂）。
# 事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml）：kazunomiya-05・08・09・10・16
#   ・婚約が9年続いたのはエドウィン・リーの1967年の論文（kazunomiya-05）→ 名と年を言う。
#   ・見返りの攘夷の約束はドナルド・キーンの明治天皇の伝記（kazunomiya-08）→ 名を言う。
#   ・はじめ固く断った・重ねての説得で承知は『歴史資料珍奇集』（1922、kazunomiya-09）→ 本の名を言う。
#   ・願いの箇条書は「と伝わる」（kazunomiya-10）。
#   ・公武合体・数えで16歳・同い年は誰でも知っている流れ（本編も fact なし）。皇室は敬意をもって（貶める言い方をしない）。
# 理解テスト4問：
#   ①誰の話か：和宮（孝明天皇の妹）
#   ②いつ・どこで何が：幕末、幕府が外国人を追い払う約束の見返りに、将軍家茂の妻として和宮を求めた。和宮には9年続いた婚約者・熾仁親王がいた
#   ③何を選んだか、なぜか：はじめ固く断ったが、天皇の重ねての説得でようやく承知した。嫁ぐ前に、願いを箇条書きにして出した
#   ④どうなったか：1861年に内親王の位を受け、婚約は取りやめ。数えで16歳で、会ったこともない同い年の将軍に嫁いだ
title: 和宮｜婚約者がいた皇女は、将軍に嫁いだ
yt_title: 皇女和宮には婚約者がいた　それでも将軍家茂に嫁いだのはなぜか
description: |-
  孝明天皇の妹、和宮には、幼いころからの婚約者、有栖川宮熾仁親王がいました。エドウィン・リーの1967年の論文によれば、婚約は9年続いていました。
  黒船のあと、幕府は朝廷と手を結ぶため、将軍家茂の妻に皇女を求めます。ドナルド・キーンの明治天皇の伝記によれば、幕府は外国人を追い払うと約束し、その見返りに和宮を求めました。
  大正11年の『歴史資料珍奇集』には、和宮ははじめ固く断り、天皇から重ねて言い聞かせがあって、ようやく承知したとあります。和宮の側からは、嫁ぐにあたっての願いを箇条書きにした文書が出された、と伝わります。
  1861年、和宮は内親王の位を受けました。婚約は取りやめになり、数えで16歳の和宮は、会ったこともない同い年の将軍のもとへ嫁ぎます。
