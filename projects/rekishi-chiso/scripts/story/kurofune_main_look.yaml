# 物語型の本編（横 16:9）の見た目と絵の割り当て：黒船（scripts/kurofune-if-story.yaml）。chiso/storymain.py が読む。
# 10-31 作成（11/4 12:00 公開）。genkou_if_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（K01〜K15）。人物は描かない（海・港・浜・座敷・船影の遠景）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   Gemini（Claude in Chrome の無料 web、1376x768）で作ったのは K01・K03・K04。
#   Gemini の無料枠が途中で切れたため、K02・K05〜K15 は Cloudflare Workers AI の FLUX.1 schnell（無料枠。1024 正方形から 16:9 を切り出し）で作った（CLAUDE.md「足りない場面だけ FLUX」）。
#   実在の絵は江戸時代の版画（ペリー来航の瓦版・海陸御固泰平鑑・ペルリ像・合衆国水師提督口上書。パブリックドメイン）。額（frame:）と絵図の一部（part:）で使い、全面の主役にしない。
#   この回の決まり：戦闘・負傷・遺体は描かない。実在の人物（ペリー・ビッドル・阿部正弘ほか）の顔は AI で描かない。顔が分かるのは実在の版画だけ。
