# 物語完結型ショート 島原・天草一揆 s2（2026-10-31）。本編 scripts/shimabara-story.yaml（11/3 19:00 公開）から。11/4 12:30 に投稿。
# 形式は yoritomo_s1.yaml・jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・遺体・炎の絵なし（絵は本編の AI 絵 P01〜P15＝景色と物だけ、と実在の絵図・写真）。
# 切り口：原城跡・二ノ丸の発掘（2024年）：鉛の十字架・鋳型・銃弾の跡。人数（s1）・上使（s3）・発端（s4）・オランダ船（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml）：shimabara-38・40・42・79（本編 第2章 9〜14行）。
#   ・市は「可能性がある」「可能性が高い」と言っている→断定しない。準備だったかは発掘資料も断定していない（本編 第2章 14）→問いで閉じる。
# 理解テスト4問：
#   ①誰の話か：島原の乱（1637〜38年）で人々が立てこもった原城。その跡の発掘
#   ②いつ・どこで何が：2024年、原城跡の二ノ丸で、籠城のための竪穴状の跡から、鉛の塊・鋳型・鉛の十字架が出た
#   ③何を選んだか：（人々が）鉛の銃弾を溶かして十字架などに作り直していた工房の可能性、と市は説明
#   ④どうなったか：準備をしていたのか、あるものを使っただけなのか、発掘資料も断定していない
title: 島原の乱｜城跡から、鉛の十字架が出た
yt_title: 島原の乱の城跡から鉛の十字架と鋳型が出た　銃弾を溶かして作り直した工房か
description: |-
  2024年、島原・天草一揆（島原の乱、1637〜38年）で人々が立てこもった原城の跡、二ノ丸の発掘で、鉛の十字架が見つかりました。
  南島原市の現地説明会資料によれば、籠城のための竪穴状の跡が少なくとも3基。その底から、鉛の塊と鋳型と鉛の十字架が出ています。市は、城の中の人たちが、鉛の銃弾を溶かして、十字架などに作り直していた工房の可能性がある、と説明しています。
  立てこもった人たちは、準備をしていたのか。それとも、あるものを使っただけなのか。発掘資料も、断定していません。本編は、概要欄のリンクからどうぞ。
