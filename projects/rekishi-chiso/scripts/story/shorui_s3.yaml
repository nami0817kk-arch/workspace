# 切り口：病気の馬を捨てたとして、1689年に家来14人と農民25人の39人が神津島へ流された。2年前の1687年には10人が遠流、旗本も罰を受けた（本編の第4章）。
# 計算（自分で計算し直した）：14人＋25人＝39人／4月9日＋2日＝4月11日の触れ
title: "生類憐みの令｜病気の馬を捨てた39人は、島へ流された"
yt_title: "生類憐みの令で、病気の馬を捨てた39人が伊豆の神津島へ流された　家来14人と農民25人　旗本にも及んだ罰の記録"
description: |-
  生類憐みの令のもと、1689年、病気の馬を捨てたとして、大名や旗本の家来14人と農民25人、あわせて39人が伊豆の神津島へ流されました。
  その2年前にも、病気の馬を荒れ地に捨てた10人が遠くへ流されています。罰は将軍を警護する旗本にも及び、1696年には、犬を斬った町人が首をさらされました。一方で、歴史学者の山室恭子は、処分はそれほど大規模ではなかった、と見ています。
  本編では、触れの中身・罰の記録・悪い評判の出どころを並べて、生類憐みの令は本当に悪法だったのかを確かめています。本編は概要欄のリンクからどうぞ。
