  pause: 0.12
  # fact: shorui-15
- 語り: "2日後の触れは、武蔵の国の、寺尾村と大場村の件を挙げて、死罪にもできるが、このたびはまず流罪にした、と告げている。"
  shot: N17_4
  tone: しみじみ
  pause: 0.12
  # fact: shorui-14
- 語り: "罰は、将軍を警護する旗本にも及んだ。1705年、小姓組の松田貞恒は、病気の馬を、いたわらなかったとして、門を閉ざす罰を受けた。"
  shot: N04_5
  tone: しみじみ
  pause: 0.12
  # fact: shorui-13
- 語り: "1696年には、江戸の本所で、犬を斬った町人が、首をさらされている。"
  shot: N03_6
  tone: 重い
  pause: 0.12
  # fact: shorui-12
- 語り: "ただ、歴史学者の山室恭子は、1998年の本で、処分は、それほど大規模ではなかった、と見ている。"
  shot: N25_7
  tone: しみじみ
  pause: 0.12
  # fact: shorui-19
- 語り: "罰は、たしかに重かった。それでも、なぜ、犬と、戌年の話ばかりが、語られてきたのか。"
  shot: N26_8
  tone: 疑問
  pause: 0.15
