title: "ポンペイ｜考古公園は炭の字を試した　10か月後も読めた"
yt_title: "ポンペイ考古公園は、炭の字がどれだけもつかを自分で試した　2023年秋に壁に書き、10か月後も読めた"
description: |-
  2018年、ポンペイの家の壁から、炭で書いた「10月17日」が見つかりました。考古公園は、炭の字は長くもたないと考え、噴火の直前に書かれた可能性が高いと発表しました。
  そして2023年の秋、考古公園は、同じ壁に新しく炭で字を書きました。約10か月後の2024年8月、字は、書いたときとほとんど同じように読めました。
  78年の10月17日から79年の8月24日までは311日、約10か月です。炭の字が、噴火の前の年に書かれた可能性も、捨てられません。
  本編では、写本・秋の手がかり・炭の落書き・考古公園の試しを並べ、言えることと言えないことを分けています。本編は概要欄のリンクからどうぞ。
