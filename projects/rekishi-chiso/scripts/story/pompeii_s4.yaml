lines:
  # fact: pom-66
- 語り: "炭の字は、10か月後も読めた。ポンペイの考古公園が、どれだけもつのかを、自分たちで試したのだ。"
  shot: P14_1
  tone: 強調
  pause: 0.12
  # fact: pom-42, pom-57
- 語り: "きっかけは、2018年に家の壁で見つかった、炭の日付だ。書かれていたのは10月17日だけで、年は無かった。"
  shot: P11_2
  tone: しみじみ
  pause: 0.12
  # fact: pom-58
- 語り: "公園は、炭の字は長くもたない、だから噴火の1週間前に書かれた可能性が高い、と考えていた。"
  shot: P13_3
  tone: しみじみ
  pause: 0.12
  # fact: pom-66
- 語り: "そこで、2023年の秋。同じ壁に、新しく、炭で字を書いた。"
  shot: P14_4
  tone: しみじみ
  pause: 0.12
  # fact: pom-66
- 語り: "約10か月後の、2024年8月。字は、書いたときと、ほとんど同じように、読めた。"
  shot: P13_5
  tone: 重い
  pause: 0.12
  # fact: pom-43
- 語り: "78年の10月17日から、79年の8月24日までは、311日。およそ10か月だ。"
  shot: P21_6
  tone: 重い
  pause: 0.12
  # fact: pom-43
- 語り: "前の年に書かれた可能性も、捨てられない。"
  shot: P21_6b
  tone: 重い
  pause: 0.12
  # fact: pom-65
- 語り: "2024年12月、公園は、論文で、今のところ、8月24日を捨てる十分な材料は無い、と結論した。"
  shot: P13_7
  tone: しみじみ
  pause: 0.12
  # fact: pom-68
- 語り: "ただ所長は、その年の夏、必ず8月24日だったという意味ではない、とも書いている。"
  shot: P19_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 まとめ（言えること・言えないこと）
- 語り: "8月か、10月か。記録から、どこまで言えるのか。"
  shot: P15_9
  tone: 疑問
  pause: 0.15
