# 部品（from〜to の行、0 始まり。出ている間は絵を暗くする）。史料の文字は OCR の文字起こしをそのまま（読み違いの可能性あり）
parts:
  - {type: quote, from: 18, to: 18, label: 史料, text: 今はデウスの御代にて候,
     source: 細川忠利の弟の書状の写し（熊本日日新聞、稲葉継陽「細川キリシタン群像」⑰ 2024年）}
  - {type: quote, from: 52, to: 52, label: 史料, text: 島原當月朔日惣攻仕、攻損候／手負・死人餘多御座候、板倉内膳討死被仕,
     source: 細川忠利の書状案 寛永15年1月12日（『細川家史料12』。史料編纂所の OCR 文字起こし）}
  - {type: quote, from: 75, to: 75, label: 史料, text: 城中の人數五萬ノ六萬のと申候間／いかさま男女一萬四五千も御座候哉と推量仕候,
     source: 細川家の覚書案 寛永15年2月4日（『細川家史料12』。史料編纂所の OCR 文字起こし）}
  - {type: quote, from: 83, to: 83, label: 史料, text: 二度の攻撃において、皇帝軍の兵員のうち五七一二人が戦死した,
     source: 『オランダ商館長日記』の和訳 1638年3月の条（OCR 文字起こし。数字の一部は読み取りが不確か）}
  - {type: quote, from: 101, to: 101, label: 史料, text: 兵粮・玉藥・薪不自由ニ罷成／二月中比迄は續兼可申,
     source: 細川家の覚書案 寛永15年2月4日（『細川家史料12』。史料編纂所の OCR 文字起こし）}
  - {type: quote, from: 103, to: 103, label: 史料, text: 城中兵粮つき候はゞ必出可申と被存,
     source: 細川三斎（忠興）の書状（『細川家史料6』。史料編纂所の OCR 文字起こし）}
  - {type: quote, from: 126, to: 126, label: 要点, text: 城の中の人数は、いまも確かめられていない／記録は1万4千から5万以上まで,
     source: 私たちの調べ（細川家の覚書・オランダ商館長日記・辞典・地名大系）}

