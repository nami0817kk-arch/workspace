# 物語型の本編（横 16:9）の見た目と絵の割り当て：島原の乱（scripts/shimabara-story.yaml）。chiso/storymain.py が読む。
# 10-30 作成（11/03 19:00 公開）。yoritomo_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（P01〜P15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   AI 絵に人物は描かない（遠景の影もなし。全部が景色・物・灯・遺跡）。実在の絵・写真は、原城と寄せ手の陣を描いた絵図・島原の乱の陣図（どちらも17世紀・PD）と、
#   原城跡の写真2枚（CC BY-SA）を絵図の一部（part:）として使う。戦闘を描いた屏風（人が戦う姿が画面いっぱい）は使わない。
#   この回の決まり：戦闘・負傷・遺体・炎は描かない。文字・紋・旗・十字架の文字を描かせない。実在の誰か・俳優に似せない。人物の最期（板倉重昌の戦死・四郎の最期）の場面に人物の絵を当てない。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/shimabara_ai_images.md
# 届く前は art_dir の仮の絵（P01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に P01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「P01（仮）」と場面を書いて作り直す。
script: scripts/shimabara-story.yaml
out: shimabara_story_main
art_dir: out/story/shimabara/ph          # 仮の絵（placeholder）
main_art_dir: out/story/shimabara/main   # Gemini の 16:9 の絵（P01.jpg〜P15.jpg）
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

