lines:
  # fact: galileo-13
- 語り: "翌日、刑は、牢から、軟禁に変わった。"
  shot: C07_1
  tone: 強調
  pause: 0.12
  # fact: galileo-14, galileo-52
- 語り: "1633年12月1日、アルチェトリの自宅へ戻ることを許される。そこから死ぬまで、8年1か月。"
