title: "ガリレオ｜判決のあと、8年1か月の軟禁"
yt_title: "ガリレオは判決のあと、8年1か月、監視つきで暮らした　娘を亡くし、目を失い、最期の言葉は記されていない"
description: |-
  判決の翌日、ガリレオの刑は、牢から軟禁に変わりました。1633年12月1日、聖務省はアルチェトリの自宅へ戻ることを許します。ただし、科学の話をしそうな人を、家に迎えてはならない、という条件つきでした。
  1634年4月2日、修道院にいた長女マリア・チェレステが、33歳で亡くなります。1637年の終わりには、ガリレオは完全に目が見えなくなりました。
  1642年1月8日の夜、死去。最期の言葉は、記されていません。遺体が記念の墓に移されたのは、死から95年後の1737年でした。では、世界中が知るあの一言は、いつ生まれたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/O80RShvkLVU
