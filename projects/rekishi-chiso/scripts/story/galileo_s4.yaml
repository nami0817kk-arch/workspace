  pause: 0.12
  # fact: galileo-15
- 語り: "1634年4月2日、修道院にいた長女、マリア・チェレステが、33歳で亡くなる。判決から、9か月あまりだった。"
  shot: C10_4
  tone: しみじみ
  pause: 0.12
  # fact: galileo-17
- 語り: "1637年の終わり、ガリレオは、完全に目が見えなくなる。友人への手紙に、こう書いた。「ひと月前から、もう目が見えません」。"
  shot: C10_5
  tone: しみじみ
  pause: 0.12
  # fact: galileo-18
- 語り: "その1638年、『新科学対話』が、ライデンで世に出る。ガリレオは、出版は版元の考えで、自分は知らなかった、と公に主張した。"
  shot: C18_6
  tone: しみじみ
  pause: 0.12
  # fact: galileo-19, galileo-50
- 語り: "1642年1月8日の夜、アルチェトリで死去。最期の言葉は、記されていない。"
  shot: C09_7
  tone: しみじみ
  pause: 0.12
  # fact: galileo-22
- 語り: "遺体が、記念の墓に移されたのは、1737年。死から、95年後だった。"
  shot: C19_8
