# 切り口：1634年、天樹院が施主となって鎌倉の東慶寺を建て直した。そこにいたのは秀頼の娘・天秀（本編 第4章、senhime-42・43・45）。
# tease の答え：会津の一件は『武将感状記』（1716年）の逸話で、『徳川実紀』には寺の名が出てこない（本編 第4章 senhime-44）。
title: "千姫｜自ら施主となって、鎌倉の尼寺を建て直した"
yt_title: "千姫は、なぜ鎌倉の尼寺を建て直したのか　1634年、自ら施主となった東慶寺"
description: |-
  1634年、天樹院と名乗っていた千姫は、自分が施主となって、鎌倉の尼寺・東慶寺の堂を建て直しました。
  東慶寺の説明によれば、大坂城が落ちたあと、秀頼の娘は千姫の養女として命を助けられ、東慶寺に入って天秀と名乗り、のちに住職になりました。
  東京大学の博士論文によれば、棟札の裏には春日局が取り仕切ったと記され、弟・忠長が住んでいた屋敷の建物が東慶寺に移されたといいます。
  本編では、この尼寺が会津の大名とぶつかった話が、記録でどう伝わるかまでたどっています。本編は概要欄のリンクからどうぞ。
