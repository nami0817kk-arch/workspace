lines:
  # fact: senhime-43
- 語り: "1634年。千姫が施主となって建て直した、鎌倉の尼寺。そこにいたのは、誰だったのか。"
  shot: R12_1
  tone: 強調
  pause: 0.12
  # fact: senhime-42
- 語り: "秀頼の娘は、大坂城が落ちたあと、千姫の養女として、命を助けられた。東慶寺は、そう説明している。"
  shot: S02_2
  tone: しみじみ
  pause: 0.12
  # fact: senhime-42
- 語り: "娘は、鎌倉の東慶寺に入った。そこで、天秀と名乗った。のちに、この寺の住職になる。"
  shot: R13_3
  tone: しみじみ
  pause: 0.12
- 語り: "東慶寺は、夫と別れたい女性が駆け込めば離縁できる、縁切寺だ。"
  shot: R12_4
  tone: しみじみ
  pause: 0.12
  # fact: senhime-43
- 語り: "このとき千姫は、天樹院と名乗る、将軍家光の姉。天秀のために、東慶寺の堂を建て直した。"
  shot: R06_5
  tone: 強調
  pause: 0.12
  # fact: senhime-43
- 語り: "東京大学の博士論文によれば、その棟札の裏には、家光の乳母の春日局が取り仕切った、と記されている。"
  shot: R05_6
  tone: しみじみ
  pause: 0.12
  # fact: senhime-43
- 語り: "同じ論文によれば、弟の忠長が住んでいた屋敷の建物が、東慶寺に移された。修理のための100両も付けられた。"
  shot: R19_7
  tone: しみじみ
  pause: 0.12
  # fact: senhime-45
- 語り: "天秀は、1645年に、東慶寺で亡くなった。幕府は、すぐに目付を鎌倉へ送って、寺を改めさせた。"
  shot: R09_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第4章（武将感状記と徳川実紀、senhime-44）
- 語り: "やがてこの尼寺は、会津40万石の大名とぶつかる。尼寺が大名を倒した、という話は、本当なのか。"
  shot: S04_9
  tone: 疑問
  pause: 0.15
