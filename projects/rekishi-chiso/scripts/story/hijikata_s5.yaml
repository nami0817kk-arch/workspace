    must: 木立と石の碑
  Grave:                                 # 日野の石田寺の墓（実在）
    kind: real
    image: paintings/hijikata_grave_ishidaji_2024.jpg
    focus: [0.5, 0.5]
    move: in
    credit: "石田寺の土方家の墓（2024年）"
    must: 石田寺の墓
  J15:                                   # 最後の問い：夕暮れの多摩川
    kind: ai
    file: hijikata/main/J15.jpg
    focus: [0.5, 0.5]
    move: in
    text_y: 0.76
    must: 夕暮れの多摩川
lines:
  # fact: hijikata-05
  - 語り: 新選組の土方歳三が、箱館で亡くなったあと、葬られた場所は、《!分かっていない》。
    shot: J12
    tone: 強調
  # fact: hijikata-04, hijikata-16
  - 語り: 亡くなった場所も、記録によって違う。函館市は、今の若松町の、一本木関門のあたりで、と言われている、と書く。
    shot: J10
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-16
  - 語り: 日本大百科全書は、箱館一本木。世界大百科事典は、場所の名を、挙げていない。
    shot: J10
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-08
  - 語り: 箱館で亡くなった旧幕府軍の人々は、賊軍と呼ばれ、弔う人もいなかった、と、南北海道の博物館や資料館でつくる協議会の解説は書く。
    shot: War
    tone: 重い
    pause: 0.12
  # fact: hijikata-65
  - 語り: その亡骸を集めて葬ったのは、箱館にいた侠客、柳川熊吉だ。
    shot: J12l
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-63
  - 語り: 1875年の5月、東京の碧血会が、函館に、碧血碑を建てた。
    shot: J13
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-64
  - 語り: 碑の裏の文は、誰をまつるのかを、書いていない。賊軍の死者を、おおやけにまつることが、はばかられたためだろう、と見られている。
    shot: J13w
    tone: 重い
    pause: 0.3
    dip: true
  # fact: hijikata-17, hijikata-85
  - 語り: 葬られた場所は、分からなくても、土方の墓は、ふるさと、日野の石田寺にある。今も、多くの人が、訪れている。
    shot: Grave
    tone: 強調
    pause: 0.12
  - 語り: あなたなら、土方歳三に、どこで、《手を合わせます》か。
    shot: J15
    tone: 疑問
    pause: 0.15
