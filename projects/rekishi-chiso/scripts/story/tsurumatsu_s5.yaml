# 物語完結型ショート 鶴松 s5（2026-11-06）。本編 scripts/tsurumatsu-if-story.yaml（11/7 12:00 公開）の第6章・第7章（秀吉の死と、その後）から。11/8 18:30 公開。
# 形式は maizo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
#   「もしも」の行は「ここからは、もしもの話」と言ってから、本編の数（数えで10歳・27歳）と本編の見立て（10歳で大名を率いることはできない）だけ。事実の行と混ぜない。
# 絵は本編の AI 絵（out/story/tsurumatsu-if/main/T*）と本編で使った実在の肖像・屏風だけ。T07・T08・T29・T30 は使わない（s1 の頭のとおり）。
#   戦・落城は遠景だけ（T17 の煙の上がる大坂城の遠景）。
# 切り口：秀吉が死んだ1598年8月18日、跡継ぎの秀頼は数え6歳。死は伏せられ（8月25日の5奉行の書状）、翌年には家康の縁組みが責められる。
#   もしも鶴松が生きていたら10歳、1615年に27歳。本編の答え（幼い跡継ぎのそばに残った大人＝秀次事件が起きなければ秀次）は言わない。
# 事実カード：tsurumatsu-23・54・55・59。言い方は本編のまま。
# 計算（自分で計算し直した）：天文6年（1537）生まれで1598年に数え62。秀頼（1593）は1598年に6・1615年に23。鶴松（1589）は1598年に10・1615年に27。
#   8月18日の1週間後＝8月25日。
# 理解テスト4問：
#   ①誰の話か：豊臣秀吉の死と、跡継ぎ（史実の秀頼、もしもの鶴松）
#   ②いつ・どこで何が：1598年8月18日、秀吉が伏見城で死に、秀頼は数え6歳。死は伏せられた
#   ③何が起きたか：翌年正月、家康の勝手な縁組みが、秀吉の遺した命に背くと責められた
#   ④どうなったか：1615年に豊臣家は滅び、秀頼は23歳。もしも鶴松なら10歳・27歳。そばに残った大人の問いで閉じる
title: 秀吉の死｜跡継ぎは、6歳だった
yt_title: 豊臣秀吉が死んだ日、跡継ぎの秀頼は数えで6歳　もしも兄の鶴松が生きていたら10歳だった
description: |-
  1598年の8月18日、豊臣秀吉は伏見城で亡くなりました。天文6年の生まれなら、数えで62歳です。跡継ぎの秀頼は、数えで6歳でした。
  死の1週間後の8月25日、5人の奉行は、朝鮮にいた鍋島直茂に、太閤様のご病気はいよいよよくなられた、と書き送っています。秀吉の死は、伏せられていました。翌年の正月19日には、徳川家康が伊達政宗らと勝手に縁組みを結んだことを、ほかの年寄と奉行たちが、秀吉の遺した命に背く、と責めました。1615年、豊臣家は滅びます。秀頼は数えで23歳でした。
  もしも、秀頼の兄の鶴松が生きていたら、秀吉が死んだ日に数えで10歳、1615年には27歳です。秀吉が死んだ日、幼い跡継ぎのそばには、大人の誰が残っていたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#豊臣秀吉', '#豊臣秀頼', '#日本史']
