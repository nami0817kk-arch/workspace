# 絵の一部だけを動かす効果（10-25 ユーザー「Bもやろう」。chiso/storymain.py の FX）。話に関係のある場面の絵だけ、控えめに。
#   fire＝明るい暖色の所（色で自動で選ぶ）の明るさを1〜3Hzでゆらす・sparks＝その近くから火の粉が舞い上がる・lamp＝灯のにじみを0.5〜2Hzでちらつかせる
#   smoke／mist＝薄い層をゆっくり横に流す・water＝水面の映りを揺らす。region＝[左, 上, 右, 下]（絵の幅・高さの割合）で範囲をしぼる
