# 図を前後の行に広げ、語りがその記録・人物を言った瞬間に1項目ずつ書き込む（10-25。サッカーの表の行が1本ずつ出る見せ方を流用）。
# items は書き込む順（語りが言う順）。line の図を from〜to の行に出す
figure_extend:
  - {line: 138, from: 132, to: 140, items: [渓心院文, 村井重頼覚書, 柴田合戦記]}   # 記録の比べ：渓心院文(132)→村井重頼覚書(136)→柴田合戦記(140)
  - {line: 172, from: 170, to: 178}                                              # 系図：江(170)→家光→和子(173)→明正天皇(176)
  - {line: 98, from: 98, to: 98, items: [茶々, 初, 江]}                           # 三人の年：語りは茶々→初→江の順に言う

