# 物語型の本編（横 16:9）の見た目と絵の割り当て：お市の方（scripts/oichi-story.yaml）。chiso/storymain.py が読む。
# 第2版（10-24）：他チャンネル15本の分析（dev/output/rekishi-chiso/research/main_screen_benchmark_1024.md）に合わせた。
#   全幅の帯はやめて左上の小さな札「年月｜第N章 章題」・語りの文字は下中央1行24字まで・話し手の名前なし（想像の札だけ）・
#   章の頭に章題カード（4秒、声の前）・最後に約20秒の終了画面の空き・全カットに寄り／パン・BGM あり（storyaudio の合成、声よりかなり小さく）。
# 台本には手を入れず、ここに「いま」の年月・章の短い題・絵の割り当て（shots）・静止画にする時点を書く。
script: scripts/oichi-story.yaml
out: oichi_story_main
art_dir: out/story/oichi3/gem
main_art_dir: out/story/oichi3/main   # 16:9 の AI 絵（A01.jpg〜A25.jpg）。届いたものから使い、無いものは ai: の stand_in（縦）で仮置き

# 章（sections の番号）ごとの左上の札「いま｜章題」。now＝章の頭の「いま」（null は年を出さない＝物語の時間が動かない章）。
# dates＝その章の語りが年・月日を言った行（行の番号: 札の年月）。その行から替わる。台本の card の見出しは見ない（第3版、10-24）
chapters:
  0: {label: 序章 なぜ逃げなかったのか, now: 1583年4月}
  1: {label: 第1章 同盟のしるしの花嫁, now: 1567年ごろ,
      dates: {27: 1567年9月, 30: 1569年, 33: 1568年, 35: 1570年4月, 38: 1570年4月30日, 40: 1570年夏}}
  2: {label: 第2章 小谷城の落城, now: 1573年8月,
      dates: {47: 1573年8月26日, 50: 1573年8月27日夜, 57: 1573年9月1日}}
  3: {label: 第3章 本能寺から再婚へ, now: 1573〜1582年,
      dates: {69: 1576年, 70: 1582年, 71: 1582年6月2日, 74: 1582年6月27日, 79: 1582年8月20日}}
  4: {label: 第4章 北ノ庄城の最後の夜, now: 1583年4月,
      dates: {88: 1583年4月21日, 91: 1583年4月23日, 103: 1583年4月23日夜, 113: 1583年4月24日明け方}}
  5: {label: 第5章 なぜ逃げなかったのか, now: null}
  6: {label: 第6章 三人の娘、敵と味方へ, now: 1583年,
      dates: {149: 1586年10月, 155: 1595年, 156: 1589年12月, 158: 1593年, 160: 1614年, 161: 1614年冬, 164: 1615年}}
  7: {label: 第7章 お市の血はどこへ, now: 1604年,
      dates: {171: 1623年, 173: 1607年, 174: 1620年, 176: 1629年, 181: 1643年}}
no_tag_from: 183                       # 最後の余韻（この行から）と終了画面は、左上の札を出さない

# AI 絵（16:9 横・25枚。10-25 にそろった：main_art_dir）。stand_in は届く前の仮の縦の絵。
# crops＝切り出しの名前ごとの [倍率, 中心x, 中心y]（人物の位置に合わせる）、lock＝この切り出しだけ使う、soften＝上の遠景を暗くぼかす（暗さ）
ai:
  A01: {scene: 北ノ庄城の夜。篝火に囲まれた天守の遠景, stand_in: S1, horizontal_of: S1}
  A02: {scene: 天守の大広間の最後の酒宴。灯の下で杯を交わす家臣たち（顔は小さく）, stand_in: S1}
  A03: {scene: お市・決意の表情（胸から上・薄暗い城内）, stand_in: P6, horizontal_of: P6}
  A04: {scene: お市・うつむく（城内、遠くに炎）, stand_in: P2, horizontal_of: P2, crops: {right: [1.15, 0.55, 0.45], face: [1.25, 0.36, 0.40]}}
  A05: {scene: お市・涙をこらえる寄り, stand_in: P5c, horizontal_of: P5c, lock: [1.0, 0.5, 0.40]}
  A06: {scene: お市・窓辺で燃える城下を見る横顔（P4 より若い顔で作り直し）, stand_in: P4, horizontal_of: P4（作り直し）, crops: {left: [1.15, 0.40, 0.45], face: [1.25, 0.68, 0.40]}}
  A07: {scene: 1567年 輿入れの行列が山の城へ向かう（秋・遠景）, stand_in: S2}
  A08: {scene: 小谷城の尾根と、琵琶湖の北の平野（俯瞰の風景・人物なし）, stand_in: S3}
  A09: {scene: 小谷城の縁側。若いお市と幼い茶々（穏やかな昼）, stand_in: P1, crops: {face: [1.25, 0.68, 0.50]}}
  A10: {scene: 1570年 文を前に思い悩むお市（室内・灯）, stand_in: P2, crops: {face: [1.25, 0.72, 0.45]}}
  A11: {scene: 1573年 夜の山城を囲む大軍の篝火, stand_in: S1}
  A12: {scene: 1573年 城の一室で赤子を抱くお市と幼い娘2人, stand_in: P2, crops: {wide: [1.12, 0.55, 0.66], left: [1.18, 0.50, 0.66], right: [1.18, 0.60, 0.66], face: [1.25, 0.55, 0.62]}}   # 子どもの顔が下の方にあるので、切り出しを下へ
  A13: {scene: 本丸の長政（武将の後ろ姿）が妻に告げる。お市は向き合う, stand_in: P1}
  A14: {scene: 夜明けの城門を、赤子を抱いたお市と幼い娘2人が出ていく（後ろ姿）, stand_in: S2}
  A15: {scene: 十年の暮らし。屋敷の庭で育つ3人の娘（後ろ姿・遠景）, stand_in: S4}
  A16: {scene: 1582年 知らせを聞いて立ち尽くすお市, stand_in: P2, crops: {face: [1.25, 0.32, 0.40], right: [1.15, 0.50, 0.45]}}
  A17: {scene: 1582年 越前へ向かう輿の列（雪の残る山道）, stand_in: S3, lock: [1.15, 0.45, 0.68], soften: 0.55}
  A18: {scene: 1583年 霧の戦場に向き合う旗の列（賤ヶ岳）, stand_in: S3, horizontal_of: S3}
  A19: {scene: 板廊下を行く娘3人と、奥の武士の影, stand_in: S4, horizontal_of: S4}
  A20: {scene: 母が娘3人を送り出す。お市の後ろ姿と、遠ざかる娘たち, stand_in: S4}
  A21: {scene: 覚書を書き留める女房の手元（巻紙・筆・灯）, stand_in: P1, lock: [1.22, 0.35, 0.35]}
  A22: {scene: 1615年 炎上する大坂城の遠景, stand_in: S1}
  A23: {scene: 1615年 知らせを聞く江の後ろ姿（徳川の屋敷）, stand_in: S4}
  A24: {scene: 光の門を出ていく娘3人の後ろ姿, stand_in: S2, horizontal_of: S2}
  A25: {scene: 終了画面用。月夜の北ノ庄の城跡と静かな川（右半分を空けた構図）, stand_in: S1, lock: [1.0, 0.5, 0.5]}

# 実在の絵の手当て（元の画像は変えない）：crop＝切り出し（幅・高さの割合 [左, 上, 右, 下]）、bright・contrast＝明るさ・コントラストの倍率
paint_fx:
  paintings/oichi_katsuie_portrait.jpg: {crop: [0.03, 0.32, 0.97, 0.97], bright: 1.35, contrast: 1.25}   # 暗い掛け軸。人物の所だけを明るく（10-25）
  paintings/oichi_fukui_castle_map.jpg: {crop: [0.165, 0.02, 0.82, 0.955]}                             # 左の物差しと右の色見本の帯を外す（10-25）

