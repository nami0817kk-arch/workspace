  - {find: この子たちだけは, picture: "gem:P2", side: center, note: 第2章 想像の台詞（仮の絵）}
  - {find: さらぬだに, picture: "gem:P4", side: center, note: 第4章 辞世（記録）}
  - {line: 138, note: 第5章 検証（記録の表）}
  - {line: 176, note: 第7章 系図（明正天皇）}
  - {line: 185, picture: "gem:S2", side: center, note: 最後の余韻}
