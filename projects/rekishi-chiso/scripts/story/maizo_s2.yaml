# 物語完結型ショート 徳川埋蔵金 s2（2026-11-05）。本編 scripts/maizo-story.yaml（11/6 12:00 公開）の第3章の終わり・第4章から。11/7 11:00 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/maizo/main/M*）だけ。新しい絵は作らない。
#   M04 は富士山に似た峰が上に出るので、上の帯に隠れる高さに置き、峰の頂が入らない左右の端に寄せる（focus。AI 絵は crop が効かない）。M08・M12・M13・M14・M15 は使わない（s1 の頭のとおり）。
# 切り口：赤城山を三代にわたって掘った水野家と、1990年のテレビの発掘。1868年の新政府の日記には、山へ金を運んだとは書かれていない。
#   本編の答え（軍艦の金）は言わない。小栗忠順の最期（11/6 19:00 の別の本編）には触れない。点数（3点）は言わない（tease の答え）。
# 事実カード：maizo-29・36・39・41・42・45・46。言い方は本編のまま。
# 計算（自分で計算し直した）：明治19年＝1886年・明治23年＝1890年・昭和7年＝1932年・昭和50年＝1975年。1994年の本の「110年」→1884年ごろ（本編どおり。ショートには入れない）。
#   1990年6月に水野家の土地へ（maizo-46）。費用3億5000万円は2023年の同じ局の番組（maizo-45）。
# 理解テスト4問：
#   ①誰の話か：赤城山を掘り続けた水野家（初代 水野智義・二代目）と、1990年のテレビ局のチーム
#   ②いつ・どこで何が：明治（1886年とも明治の初めとも）から群馬の赤城山を掘り、1890年に家康の像、1932年に石灰の亀。1990年にテレビ局が重機で掘った
#   ③なぜ掘ったか：叔父から聞いた噂（小栗忠順が金を利根川をさかのぼって運び、赤城山に埋めた）
#   ④どうなったか：黄金は出ず、テレビの費用は3億5000万円。1868年の新政府の日記には山へ運んだとは書かれていない
title: 赤城山の埋蔵金｜三代、掘り続けた家
yt_title: 赤城山の徳川埋蔵金を三代掘り続けた水野家　1990年のテレビの発掘は費用3億5000万円
description: |-
  群馬の赤城山では、明治のころから、ひとつの家が、三代にわたって徳川の埋蔵金を掘り続けました。
  初代の水野智義が掘り始めた年は、明治19年（1886年）とも、明治の初めとも紹介されています。きっかけは、幕末に勘定吟味役だった叔父から聞いた噂だったといいます。明治23年には家康の像を、昭和7年には二代目が巨大な石灰の亀を掘り当てたとされますが、二代目が1975年まで掘っても、黄金は出ていません。1990年6月には、テレビ局のチームが水野家の土地で重機を使って掘り、何も見つかりませんでした。2023年、同じ局の番組は当時の費用を3億5000万円と明かしています。
  いちばん有名な赤城山の説は、記録で採点すると何点なのか。本編は概要欄のリンクからどうぞ。
