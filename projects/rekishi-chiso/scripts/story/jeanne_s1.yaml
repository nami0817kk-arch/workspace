# 理解テスト4問：
#   ①誰の話か：ジャンヌ・ダルク
#   ②いつ・どこで何が：1431年5月24日ルーアンの墓地で署名し終身の牢。28日に男の服に戻り、30日に再犯の判決、同日処刑
#   ③何を選んだか：署名のあと、男の服を着て牢にいた（理由は語らない）
#   ④どうなったか：許された6日後に処刑された。決め手は男の服だったのか、は問いで閉じる
# 語りの字数（句読点を除く）：336
title: ジャンヌ・ダルク｜許された6日後に、処刑された
yt_title: ジャンヌ・ダルクは一度許された　処刑はその6日後だった
description: |-
  ジャンヌ・ダルクは、一度、許されていました。処刑されたのは、その6日後です。
  1431年5月24日、ルーアンの墓地で、およそ19歳のジャンヌは誓約書に署名します。裁判記録には名前と十字が写されていて、判決は死刑ではなく、終身の牢でした。ところが28日、判事たちが牢を訪ねると、ジャンヌはまた男の服を着ていました。30日の判決は「再犯の異端者」。その日、ジャンヌは処刑されます。
  たった6日で、何が変わったのか。男の服は、本当に決め手だったのか。この問いに、記録と証言から迫った本編は、概要欄のリンクからどうぞ。
