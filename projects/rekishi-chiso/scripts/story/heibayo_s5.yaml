description: |-
  兵馬俑は、はじめ、鮮やかな色をしていました。人民日報海外版は、掘り出して15秒で変わり始める、と書いています。
  そして像は、焼けてもいました。原因には3つの説があり、決め手はありません。
  焼いたのは誰なのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/Q89Ua_ST728
