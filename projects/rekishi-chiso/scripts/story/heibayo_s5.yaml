lines:
  # fact: heibayo-C01
- 語り: "掘り出した兵士の像は、15秒で、色が変わり始める、と人民日報海外版は書く。"
  shot: E02_1
  tone: 強調
  pause: 0.12
  # fact: heibayo-C03
- 語り: "像は、はじめ、鮮やかな色をしていた。生の漆の上に、絵の具を重ねた。"
  shot: E02_2
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-C02
- 語り: "澎湃新聞の、2023年の記事は、数分で、色が剥がれ落ちる、と書く。測っている段階が、違うのかもしれない。"
  shot: E02_3
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-C04
- 語り: "ドイツの研究者、ランガルスの説明では、水を含んだ土が、漆を変質させ、掘り出すと、塗膜が割れる。"
  shot: E02_4
  tone: 重い
  pause: 0.12
  # fact: heibayo-C07
- 語り: "今の現場では、出土したら、すぐ保湿剤を吹き、ラップで包む。"
  shot: E01_5
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-C20
- 語り: "像は、焼けてもいた。原因は、自然に火がついた説、葬送で燃やした説、項羽の軍が焼いた説の、3つ。"
  shot: E03_6
  tone: 重い
  pause: 0.12
  # fact: heibayo-C21
- 語り: "一号坑には、黒い木炭の跡と、焼けた煉瓦がある。"
  shot: E03_7
  tone: 重い
  pause: 0.12
  # fact: heibayo-C22
- 語り: "2023年の発表では、坑の通路が、一度、人の手で掘り開けられていた。博物院の研究員は、項羽の破壊の強い裏づけと述べるが、推測だ。"
  shot: A05_8
  tone: 重い
  pause: 0.12
  # fact: heibayo-C20
- 語り: "決め手は、ない。では、像を焼いたのは、誰なのか。"
  shot: E03_9
  tone: 疑問
  pause: 0.15
