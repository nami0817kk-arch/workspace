# 物語完結型ショート 平安貴族if s3（2026-11-27）。本編 scripts/heian-if-story.yaml（12/3 12:00 公開予定、https://youtu.be/WkZt_G7O2Mc）から。12/4 13:30 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 平安貴族if_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/heian_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：道長の日記『御堂関白記』の物忌み（本編 第4章、heianif-17・18・19・21・22）。
# hook＝道長は物忌みを1年に何回書いたか（答えはこのショートの中：いちばん多い1013年で60回。実資の最多24回の2倍以上）。
# tease＝物忌みの札は本当に冠に掛けたのか（答えは本編 第4章：中島2014、御堂関白記に物忌の札は1つも無い。heianif-20）。
# 数え直し：60÷24＝2.5 →「2倍以上」。長和2年＝1013年、寛弘元年＝1004年、寛弘7年＝1010年。季節は言わない（8月24日・5月20日は季節を付けない）。
# 回数は「日記に物忌と書いた回数」（深澤2005）。こもった日数ではないと言う。
# 理解テスト：①藤原道長の日記に書かれた物忌みの話 ②陰陽師の占いで決まる2日続きの物忌み、1010年8月24日には西の門を閉じた
#   ③重い物忌みでも、1013年5月20日には孫の敦成親王が重い病と聞いて駆けつけた ④いちばん多い1013年で60回、実資の2倍以上（回数で日数ではない）
title: "平安貴族｜物忌み60回"
yt_title: "藤原道長は、家にこもる「物忌み」を1年に60回も日記に書いた　陰陽師の占いで決まる2日続きの物忌みと、それでも駆けつけた日"
description: |-
  藤原道長の日記『御堂関白記』には、家にこもる物忌みを、1年に60回も書いた年があります。研究者の深澤瞳さんが2005年の論文で年ごとに数えると、いちばん多いのは1013年の60回、1か月では1004年2月の17回でした。同じ時代の藤原実資は、いちばん多い年でも24回。道長はその2倍以上です。ただし、これは日記に物忌みと書いた回数で、こもった日数とは同じではありません。
  物忌みは、怪しいことが起きたとき陰陽師が占って決め、慎むべきと出た2日が物忌みの日になりました。1010年8月24日、道長は「物忌みは今日と明日」として西の門を閉じています。重い物忌みの間は外の人に会いませんが、同じ家に泊まっている人には会えました。
  それでも1013年5月20日、重い物忌みの日に、道長は孫の敦成親王が重い病と聞いて駆けつけています。月日は当時の暦（旧暦）のままです。
  本編では、平安貴族の家に生まれた子の毎日を、生まれた日から出世の夜まで、道長の日記と同じ時代の記録でたどっています。本編は概要欄のリンクからどうぞ。
