# 理解テスト4問：①藤原道長の子孫の摂関家 ②1166年7月、近衛基実が数え24歳で急死 ③遺領は妻の盛子が継ぎ摂政は弟基房→近衛・松殿・九条に ④松殿家は摂政を出せたのは2人だけで戦国の中ごろに絶える。次は残った二家がどう五つになったか（本編3章）
# 本編2章にある「赤痢」は事実カードに無いので言わない。
title: "藤原道長の子孫｜三つに割れた摂関家"
yt_title: "道長の子孫の摂関家は、なぜ三つに割れたのか　1166年、24歳で急死した近衛基実と12歳の摂政"
description: |-
  1166年7月、近衛基実が、数えで24歳で急に亡くなりました。遺領は、平清盛の娘で、基実の妻の盛子がいったん受け継ぎ、摂政の座は弟の基房が継ぎます。これが、摂関家が割れていくきっかけだったとされます。基実の系統は近衛家、基房の系統は松殿家、兼実の系統は九条家になりました。
  1183年11月、木曽義仲が後白河法皇のいる法住寺殿を攻めた2日後、基房の子の師家が、数えで12歳で摂政になります。けれど翌年1月22日に罷免され、摂政だったのは2か月あまり。松殿家で摂政になれたのは、基房と師家の2人だけで、戦国時代の中ごろには絶えたと考えられています。
  残った近衛家と九条家は、どう分かれて、五つの家になったのか。本編は概要欄のリンクからどうぞ。
