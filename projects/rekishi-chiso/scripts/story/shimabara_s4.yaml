lines:
  # fact: shimabara-15
  - 語り: 「今は、デウスの御代にて候」。天草の村で、こう宣言されたと、書状は伝える。
    shot: P06
    tone: 強調
    pause: 0.12
  # fact: shimabara-15
  - 語り: 今の言葉にすると、「いまは、デウスの世である」。
    shot: P03
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-15
  - 語り: 宣言したのは、須子村の百姓。十字架を掲げ、鉄砲で武装していた。
    shot: P02
    tone: 重い
    pause: 0.12
  # fact: shimabara-13
  - 語り: 島原では、10月26日に、島原城下が襲われた。
    shot: P09
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-13
  - 語り: 一揆は、10日足らずで、12か村、約2万5千人に膨れ上がった。
    shot: P03b
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-14
  - 語り: なぜ、立ち上がったのか。稲葉継陽さんは、厳しくなる弾圧と、10年続いた飢饉に、大名の対応が足りなかった、と書く。
    shot: P02b
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-24
  - 語り: 長崎大学の木村直樹さんは、直接の引き金は、過剰な年貢への、農民の怒りだ、と見る。
    shot: P04
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-11
  - 語り: 世界大百科事典も、宗門一揆説より、農民一揆説が有力、と書く。
    shot: P10
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-26
  - 語り: ただ、島原市の学芸員は、高い税率の記録の真偽は、はっきりしない、と書く。
    shot: P06b
    tone: 重い
    pause: 0.12
