# 物語完結型ショート 島原・天草一揆 s4（2026-10-31）。本編 scripts/shimabara-story.yaml（11/3 19:00 公開）から。11/4 17:30 に投稿。
# 形式は yoritomo_s1.yaml・jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・遺体・炎の絵なし（絵は本編の AI 絵 P01〜P15＝景色と物だけ、と実在の絵図・写真）。
# 切り口：天草の「今はデウスの御代にて候」と、宗教の一揆か年貢の一揆か（研究者の見方が割れている）。人数（s1）・鉛（s2）・上使（s3）・オランダ船（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml）：shimabara-11・13・14・15・24・26（本編 第1章・第4章）。
#   ・発端の日の食い違い（10/25〜27日）は本編 第1章 4。25日ごろとするものもある、と言う。決められる史料は調べた範囲では見つからなかった（本編 第4章 12）。
#   ・年貢の細かな中身（ポルトガル船長の手紙）は出どころが又聞きなので使わない。殉教者の話も使わない。
# 理解テスト4問：
#   ①誰の話か：島原・天草一揆の始まりの頃の、天草と島原の百姓たち
#   ②いつ・どこで何が：寛永14年秋、天草の須子村で「今はデウスの御代にて候」と宣言。10月26日に島原城下が襲われ、10日足らずで約2万5千人に
#   ③なぜ立ち上がったか：弾圧と飢饉への大名の対応不足（稲葉）、過剰な年貢への怒り（木村）。農民一揆説が有力（大百科）。ただし税率の噂の真偽ははっきりしない
#   ④どうなったか：宗教か年貢か、決められる史料は見つからなかった。問いを視聴者に返す
title: 島原の乱｜「今はデウスの御代にて候」　宗教か、年貢か
yt_title: 島原・天草一揆「今はデウスの御代にて候」の言葉　宗教の一揆か年貢の一揆か
description: |-
  島原・天草一揆（島原の乱、1637〜38年）の始まり。天草の須子村の百姓は、十字架を掲げ、鉄砲で武装して、寺沢家の代官の支配は過去のものだ、と宣言しました。その言葉は、「今はデウスの御代にて候」。
  島原では寛永14年10月26日に島原城下が襲われ、一揆は10日足らずで、島原半島南部の12か村、約2万5千人に膨れ上がりました。なぜ立ち上がったのか。弾圧と飢饉への大名の対応不足、過剰な年貢への怒り。世界大百科事典は農民一揆説が有力と書きますが、どちらか一つに決められる史料は、調べた範囲では見つかりませんでした。
  本編は、概要欄のリンクからどうぞ。
