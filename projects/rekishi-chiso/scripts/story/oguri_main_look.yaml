  - {type: quote, from: 4, to: 4, label: 碑, text: 偉人小栗上野介／罪なくして此所に斬らる, source: 烏川の河原の碑（1932年、地元の人々が建てた）}
  - {type: quote, from: 22, to: 22, label: 史料, text: 熨斗を附けて他人に贈る迄も／土蔵附の売家たるは又快からずや, source: 福地源一郎『幕末政治家』（1900年）}
  - {type: quote, from: 26, to: 26, label: 史料, text: 一タビ膺懲シテ而テ後恭順スルモ／未ダ遅シトセズ, source: 『高崎市史』上巻（1927年）}
  - {type: quote, from: 49, to: 50, label: 史料, text: 陣屋等厳重ニ相搆へ、砲台ヲ築キ／逆謀判然, source: 東山道総督府の追捕の命令（『復古記』第11冊、慶応4年4月）}
  - {type: versus3, from: 62, to: 62, items: [[丑木幸男（2026年）, 土佐と丹波], [高崎市史（1927年）, 2人とも長州藩士]], every: 1.6}
  - {type: quote, from: 64, to: 64, label: 史料, text: 右上野ハ逆謀判然タリ／依テ父子共速ニ召捕可申旨, source: 吉井藩の記録（『復古記』第11冊）}
  - {type: quote, from: 83, to: 83, label: 史料, text: 三之倉宿河原ニ於テ／更ニ尋ノ筋モ無之, source: 小栗仁右衛門の届け（閏4月12日。『戊辰戦史』巻5）}
  - {type: quote, from: 86, to: 86, label: 史料, text: 此等婦女子には／寛典を望む, source: 蜷川新『維新前後の政争と小栗上野の死』（1928年）の伝え}
  - {type: quote, from: 112, to: 112, label: 史料, text: 命じたる人…今日生存して居る／余の問に対しても事情を語らない, source: 蜷川新『維新前後の政争と小栗上野 続』（1931年）}
