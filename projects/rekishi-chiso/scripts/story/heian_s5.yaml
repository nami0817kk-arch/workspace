# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 平安貴族if_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/heian_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：除目の夜と、清少納言の父・清原元輔（本編 第6章、heianif-58・60・61・62）。
# hook＝清少納言の父は何歳で国の長官になれたか（答えはこのショートの中：986年に79歳で肥後守）。
# tease＝道長は何歳で公卿になったか（答えは本編 第2章・第6章：22歳。heianif-51・54）。
# 数え直し：元輔 908年生（数え年）→986年＝79歳、990年＝83歳。寛和2年＝986年、永祚2年＝990年。季節は言わない（990年6月は言わない）。
# 『枕草子』の除目の段は年が分からないので、年の流れ（986年・990年）とは分けて、「除目に漏れた家」の一般の話として出す。
# 理解テスト：①清少納言の父・清原元輔と、平安貴族の出世を決める除目の話 ②公卿は20人前後、下の貴族は約800人。春の除目は正月から3夜
#   ③名前が書かれない家は明け方まで知らせを待った（枕草子）。元輔は低い役から勤めた ④986年に79歳で肥後の長官になり、990年に任地で83歳で亡くなった
title: "平安貴族｜除目の夜"
yt_title: "清少納言の父が国の長官になれたのは79歳　平安貴族の出世を決めた「除目」の夜と、明け方まで知らせを待った家"
description: |-
  清少納言の父、清原元輔は、低い役から勤め、986年に79歳で肥後の国の長官になりました。そして990年、任地の肥後で83歳で亡くなっています。年齢は数え年です。
  道長や紫式部の時代、公卿は20人前後。その下の貴族は、およそ800人いたと見られます（井上幸治）。役目を決めるのが除目という会議で、春の除目は地方の長官などを決め、正月から3夜続きました。最後の夜に受領と公卿が決まり、首席の大臣が、決まった人の名を大きな紙に書き込んでいきました。
  名前が書かれなかった家を、清少納言は『枕草子』の「興ざめなもの」の段に書いています。今年は必ず、と聞いて昔の使用人や田舎の者まで集まり、飲み食いして待つ。けれど明け方まで、門をたたく音はしない。集まった人は一人、二人と抜け出していきます。
  本編では、平安貴族の家に生まれた子の毎日を、生まれた日から出世の夜まで、道長の日記『御堂関白記』と同じ時代の記録でたどっています。本編は概要欄のリンクからどうぞ。
