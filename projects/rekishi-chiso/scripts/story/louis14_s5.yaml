title: "ルイ14世｜暦と時計の一節は、回想録にない"
yt_title: "暦と時計があれば、300里先でも王が何をしているか言い当てられる　その出どころは、回想録ではなかった"
description: |-
  「暦と時計があれば、300里先でも、王がいま何をしているか、言い当てられる」。ルイ14世の日課を語る有名な一節ですが、サン=シモンの『回想録』の日課の部分には、この言葉は出てきません。出どころは『三人の初代ブルボン王の比較』の87頁です。
  サン=シモンが宮廷で過ごしたのは24年。この比較を書き始めたのは1740年で、王の死から25年ほどあとです。回想録の日課の部分を書いたのは1745年、王の死から30年後、70歳のときでした。同じ時期の文で、サン=シモンは王を「平均以下の知性」と書いています。
  編者ボワリルは、時刻の規則正しさは誇張だ、動かなかったのは会議の時間だけだ、と注をつける一方、証人としての細かい正確さは争えない、とも評価しています。では、王の1日は、実際にはどこまで見られていたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/FqHUnnLL6JM
