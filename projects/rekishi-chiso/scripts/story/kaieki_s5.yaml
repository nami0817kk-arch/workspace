# 理解テスト：①家康の六男、松平忠輝の話 ②1616年、越後の高田60万石の城主が改易された ③理由は大坂の陣で遅れたこととされ、キリシタンや外国貿易との関わりの説もある ④伊勢の朝熊・飛騨の高山・信濃の諏訪へと移され、1683年、改易から67年後に諏訪で亡くなった
title: "改易｜家康の息子、松平忠輝"
yt_title: "家康の六男、松平忠輝はなぜ改易されたのか　60万石を失い、流された先で67年後に亡くなるまで"
description: |-
  元和2年、1616年。大坂の陣が終わった翌年に改易されたのは、家康の六男、越後の高田の城主、松平忠輝でした。日本大百科全書では、60万石の大名です。
  理由は、大坂の陣で戦いに遅れたこととされます。ただ、ブリタニカ国際大百科事典は、キリシタンや外国との貿易に深く関わっていたため、という説も挙げています。
  忠輝は伊勢の朝熊に流され、のちに飛騨の高山、信濃の諏訪へと移されて、天和3年、1683年、諏訪で亡くなりました。改易から、67年後のことでした。
  本編では、江戸幕府に取りつぶされた大名の数と、いちばん多かった理由、そして数が減っていったわけを、研究ごとの数字で積み上げています。本編は概要欄のリンクからどうぞ。
