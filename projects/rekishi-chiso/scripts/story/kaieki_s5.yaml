# hook＝家康の息子はなぜ領地を失ったか（答えはこのショートの中：大坂の陣で遅れたとされる／キリシタン・外国貿易との関わりの説）。tease＝7年後に改易された家康の孫、忠直の家はそのあとどうなったか（答えは本編 第2章・第7章：子の光長が高田へ、1681年の越後騒動でふたたび改易。kaieki-58・73）。
