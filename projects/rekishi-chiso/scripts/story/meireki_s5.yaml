title: "明暦の大火｜幕府が出した粥は6000石、米の値は3.5倍"
yt_title: "明暦の大火のあと、幕府は粥6,000石を出した　米の値は1両2斗、基準の7斗は3.5倍の量　助けは庶民に後手だったと報告書は書く"
description: |-
  明暦の大火が消えた直後の1657年1月21日、幕府は粥の施行を始めました。江戸の6か所に仮小屋を建て、浅草の米蔵から、1日1000俵の米を出し、2月12日まで続けました。出した米は、合計6000石、およそ900トンです。
  米の値は、1両で2斗まで跳ね上がり、幕府は1両で7斗より高く売るなと触れました。実勢の3.5倍の量です。町人に下された金は、記録によって15万両とも16万両とも書かれます。
  内閣府の報告書は、庶民への援助は後手に回ることが多かった、と総括します。本編は概要欄のリンクからどうぞ。
  亡くなった方々に、敬意を払って作っています。
  https://youtu.be/YMXFgwO0dWI
