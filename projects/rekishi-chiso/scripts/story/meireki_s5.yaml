lines:
  # fact: meireki-C08
- 語り: "明暦の大火の直後の、1月21日。幕府は、浅草の米蔵から、1日に1000俵の米を出し、粥を配りはじめた。"
  shot: K17_1
  tone: 強調
  pause: 0.12
  # fact: meireki-C08
- 語り: "予定は9日間。けれど、飢えた人が多く、2月12日まで続けた。米は、合計6000石、およそ900トンだ。"
  shot: K11_2
  tone: 重い
  pause: 0.12
  # fact: meireki-C09
- 語り: "米の値は、1両で2斗しか買えないほど、跳ね上がった。幕府は、1両で7斗より高く売るな、と触れた。実勢の、3.5倍の量だ。"
  shot: K17_3
  tone: 重い
  pause: 0.12
  # fact: meireki-C13
- 語り: "江戸城の金蔵は、焼けていた。幕府は、大坂や二条城の備えの銀を、取り寄せた。"
  shot: K18_4
  tone: 重い
  pause: 0.12
  # fact: meireki-C10, meireki-C11
- 語り: "町人には、金が下された。『玉露叢』は16万両、『明暦日記』は15万両。記録で、割れる。"
  shot: K20_5
  tone: 重い
  pause: 0.12
  # fact: meireki-C14
- 語り: "役人が、金庫が空になる、と心配すると、保科正之は、蓄えはこの用にあてるためだ、と答えた、と寛政重脩諸家譜は伝える。"
  shot: K22_6
  tone: 重い
  pause: 0.12
  # fact: meireki-C18
- 語り: "それでも、助けは、庶民に行き渡らなかった。大雪で、凍死者が大勢出た。報告書は、援助は後手に回ることが多かった、と書く。"
  shot: K15_7
  tone: 重い
  pause: 0.12
  # fact: meireki-C13, meireki-C18
- 語り: "金蔵が焼けた江戸で、あなたなら、誰から先に、助けますか。"
  shot: K10_8
  tone: 疑問
  pause: 0.15
