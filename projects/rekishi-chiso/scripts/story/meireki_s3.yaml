title: "明暦の大火｜「振袖火事」は、当時の記録に出てこない"
yt_title: "「振袖火事」は、当時の記録に出てこない　筋が確認できる最古の文献は、大火の197年あと　国の報告書は事実とは異なると書く"
description: |-
  明暦の大火は、「振袖火事」とも呼ばれます。けれど内閣府の報告書は、この話は当時の火災の記録に出てこず、事実とは異なる、と書いています。
  確認できた範囲では、『むさしあぶみ』にも『武江年表』にも、この話は載っていません。「振袖」の名の古い例は1848年の災害番付、筋の元になる形が確認できる最古の文献は1854年からの小説で、どちらも大火の190年あまりあとです。
  出火の原因は、分かっていません。本編は概要欄のリンクからどうぞ。
  https://youtu.be/YMXFgwO0dWI
