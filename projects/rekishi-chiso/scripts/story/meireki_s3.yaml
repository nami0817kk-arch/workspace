lines:
  # fact: meireki-B11
- 語り: "「振袖火事」と呼ばれる、1657年の明暦の大火。ところが、国の報告書は、この話は、当時の記録に出てこず、事実とは異なる、と書く。"
  shot: K16_1
  tone: 強調
  pause: 0.12
  # fact: meireki-B12
- 語り: "筋は、こうだ。娘の振袖を、寺で炎に投げ込むと、風が吹き、本堂に燃え移った。これが、大火の始まりだ、と。"
  shot: K04_2
  tone: 重い
  pause: 0.12
  # fact: meireki-B19, meireki-B17
- 語り: "確認できた範囲では、『むさしあぶみ』にも、『武江年表』にも、この話は、載っていない。"
  shot: K14_3
  tone: しみじみ
  pause: 0.12
  # fact: meireki-B16
- 語り: "「振袖」の名の古い例は、1848年の番付『泰平無疆』。江戸振袖大火、とある。大火の191年あとだ。"
  shot: K12_4
  tone: 重い
  pause: 0.12
  # fact: meireki-B14
- 語り: "筋の元の形が確認できる最古の文献は、1854年からの小説『黄金水大尽盃』。大火の197年あとだ。"
  shot: K13_5
  tone: 重い
  pause: 0.12
  # fact: meireki-B15
- 語り: "寺の名を本妙寺と書くのは、確認できる範囲で、1884年の『長者鑑紀文実伝』から。大火の227年あとだ。"
  shot: K12_6
  tone: 重い
  pause: 0.12
  # fact: meireki-B03, meireki-B02
- 語り: "記録が書く火元は、本妙寺。出火の原因は、分かっていない。"
  shot: K14_7
  tone: しみじみ
  pause: 0.12
  # fact: meireki-B11
- 語り: "あなたは、この話を、いつ、どこで、知りましたか。"
  shot: K16_8
  tone: 疑問
  pause: 0.15
