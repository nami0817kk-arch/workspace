# 形式は nakasendo_s1〜s5・majogari_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 渋沢栄一_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/shibusawa/main/ の K）の切り出しだけ。新しい絵は作らない。主役は渋沢（慶喜の生涯は説明しない）。
# 切り口：慶喜の「どうぞ止めてくれ」と、死後という条件（本編 序章・第3章、shibusawa-01・02・03・04・12・13・25）。
# hook＝旧主の伝記を頼むと慶喜は何と答えたか（答えはこのショートの中：どうぞ止めてくれ。のちに死後の公表を条件に許す）。
# tease＝語りたがらない慶喜から、どうやって本人の話を聞き出したか（答えは本編 第5章：昔夢会。shibusawa-07〜10）。
# 数え直し：明治26年（1893）の夏から秋 → 大正6年（1917）11月22日＝24年あまり（2か月〜5か月）。命日：1913-11-22 の4年後＝4度目の命日。
#   明治26年は新暦（明治6年から）。季節は言わない。
# 理解テスト：①渋沢栄一と旧主・徳川慶喜の伝記の話 ②明治26年、帝国ホテルの宴会のあと、福地源一郎に伝記を頼んだ
#   ③慶喜の思いが曲げて受け取られているのが残念で。慶喜は「どうぞ止めてくれ」と断ったが、渋沢はあきらめず、死後に公にする条件で許された
#   ④大正6年11月22日、慶喜の4度目の命日に8冊の印刷が仕上がり、墓の前に捧げられた
title: "渋沢栄一｜どうぞ止めてくれ"
yt_title: "「どうぞ止めてくれ」　渋沢栄一が頼んだ伝記を、最後の将軍・徳川慶喜は初め断った"
description: |-
  明治26年、帝国ホテルの宴会のあとで、渋沢栄一は、福地源一郎に、旧主・徳川慶喜の伝記を頼みました。慶喜の本当の思いが、世の中にひどく曲げて受け取られているのを、残念に思ったからだと、資料集はまとめています。
  ところが、人を通して伺うと、慶喜は初め許さず、「どうぞ止めてくれ」と答えました（『徳川慶喜公伝』の渋沢の自序）。のちに慶喜は許しましたが、世の中に公にするのは、死んだあと、しかるべき時がたってから、という条件付きでした。
  全8冊の印刷が仕上がったのは、大正6年11月22日。慶喜の4度目の命日でした。
  本編では、駿府の寺での再会から、慶喜本人に話を聞いた「昔夢会」、墓の前の8冊まで、渋沢が旧主の伝記にかけた年月をたどっています。本編は概要欄のリンクからどうぞ。
