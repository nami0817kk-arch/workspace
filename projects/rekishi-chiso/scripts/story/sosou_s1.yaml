# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「曹操想像」は使わない）。
# 絵は本編の AI 絵（out/story/sosou/main/S02〜S05。人物は手もとのみ・曹操の顔は描かない・STH は使わない）。
# 事実カード（dev/output/rekishi-chiso/research/曹操_facts_20261029.yaml）：sosou-01・02・28・29（陸機の序は Wikisource で本文を開いた。単一の出どころ→「書く」「引く」で言う）
#   ・66歳は本編と同じ（sosou-01）。香が実際に分けられたのは陸機の記述（sosou-29）→「と書いている」。
# 理解テスト4問：
#   ①誰の話か：三国志の曹操の遺令（遺言）
#   ②いつ・どこで何が：220年に洛陽で亡くなった。『三国志』の遺令は「金玉珍宝を蔵むること無かれ」。298年、陸機が宮中の書庫でもう一つの長い遺令を読んだ
#   ③何を選んだか：陸機の引く遺令は、香を夫人たちで分けよ・靴の組紐を作って売れ・印の組紐は蔵へ、という家の中の言葉
#   ④どうなったか：陸機は嘆息し、香はそのあと実際に分けられた、と書く
title: 曹操｜遺言は、金玉を入れるなと、靴の組紐を売れ
yt_title: 曹操の遺言は2つある　「金玉珍宝を蔵むること無かれ」と「靴の組紐を作って売れ」
description: |-
  三国志の曹操は、220年の正月、洛陽で亡くなりました。『三国志』は66歳と書きます。
  3世紀の終わりに陳寿が書いた『三国志』の武帝紀に載る遺令は、短い言葉です。「斂むるに時服を以てし、金玉珍宝を蔵むること無かれ」。ふだんの服で納め、金も玉も宝物も入れるな、という意味です。
  ところが298年、文人の陸機が宮中の書庫で、もう一つの遺令を読みます。陸機が「弔魏武帝文」の序に引いた遺令には、余った香は夫人たちで分けよ、することのない者は靴の組紐を作って売れ、印の組紐は蔵に納めておけ、とありました。陸機はため息をつき、香はそのあと実際に分けられた、と書いています。
  短い公の言葉と、長い家の中の言葉。どちらも曹操の遺令として残っています。
