lines:
  # fact: ii-62
- 語り: "幕府の大老、井伊直弼は、手紙で、自分のことを、大臆病者、と書いていた。"
  shot: I09_1
  tone: 強調
  pause: 0.12
  # fact: ii-64
- 語り: "直弼は、彦根藩の主の子でも、跡を継ぐ立場ではなかった。17歳から、彦根の小さな屋敷で、長い年月を過ごす。"
  shot: I13_2
  tone: しみじみ
  pause: 0.12
  # fact: ii-62
- 語り: "彦根城博物館が紹介する、31歳のころの手紙には、こうある。口べたな、木訥者。大臆病者。"
  shot: I11_3
  tone: 重い
  pause: 0.12
  # fact: ii-62
- 語り: "兄で藩主の直亮が好んだ、馬に乗って弓を射る稽古も、しない。"
  shot: I13_4
  tone: しみじみ
  pause: 0.12
  # fact: ii-32
- 語り: "その一方で、居合は、藩の師範に学んで、免許皆伝まで進んだ。"
  shot: I05_5
  tone: しみじみ
  pause: 0.12
  # fact: ii-63
- 語り: "茶の湯の本、『茶湯一会集』を仕上げたのも、直弼だ。一期一会という言葉は、この本で、広く知られるようになった。"
  shot: I14_6
  tone: しみじみ
  pause: 0.12
  # fact: ii-48, ii-49
- 語り: "1858年、その人が、大老になる。2か月後の手紙には、こうある。重い役目に耐えられないと、何度も断ったが、厳しい命令を、退けられなかった。"
  shot: I23_7
  tone: 重い
  pause: 0.12
  # fact: ii-49
- 語り: "そして、読んだら、すぐ火にくべてほしい、と頼んでいる。"
  shot: I09_8
  tone: 重い
  pause: 0.12
