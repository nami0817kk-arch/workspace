# 理解テスト：①井伊直弼の話 ②17歳から彦根の小さな屋敷、1858年に大老 ③手紙で自分を大臆病者と書き、大老は何度も断ったと書いた ④読んだらすぐ火にくべてほしいと頼んだ
title: "井伊直弼｜自分を「大臆病者」と書いた大老"
yt_title: "井伊直弼は、手紙で自分を「大臆病者」と書いた　大老になったときは「何度も断った」　読んだら火にくべてほしいと頼んだ手紙"
description: |-
  幕府の大老・井伊直弼は、31歳のころ、信頼する家臣への手紙で、自分を「口べたな木訥者」「大臆病者」と書いていました。彦根城博物館が紹介する、世継ぎになる前の手紙です。
  藩主の子でも跡を継ぐ立場ではなく、17歳から彦根の小さな屋敷で長い年月を過ごした直弼は、居合で免許皆伝まで進み、楽焼を作り、茶の湯の本『茶湯一会集』を仕上げました。
  1858年に大老になった2か月後の手紙には、重い役目に耐えられないと何度も断った、とあり、読んだらすぐ火にくべてほしい、と頼んでいます。本編では、その人が桜田門の外で討たれた理由をたどっています。本編は概要欄のリンクからどうぞ。
