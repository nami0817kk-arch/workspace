# 絵の方針：AI 絵（Gemini）。T01・B01〜B05 はこの回のために作った。B06〜B19 は Gemini のタブが固まって作れなかったため、同じ鎌倉の頃の既存の AI 絵（yoritomo の Q01・Q03・Q05・Q07・Q09〜Q12・Q15、hojo-if の H06・H15・H19・H23・H24）を B 番号にコピーして使う（out/story/yoshitsune-if/main/）。B17（蓮）は桜の池の絵で代用（Gemini が戻ったら蓮の絵に差し替え）。
#   実在の人物の顔は描かない（後ろ姿・遠景）。旗・家紋・字は入れない。妻子の最期・首・戦いの場面は描かない。
