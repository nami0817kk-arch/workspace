  - {type: versus3, from: 50, to: 51, every: 5,
     items: [[吾妻鏡, 義経を大将軍に], [玉葉（伝聞）, 3人一味で頼朝を襲う]]}
  - {type: quote, from: 70, to: 70, label: 史料, text: 天下の悦び／何事かこれに如かず。頼朝卿の運, source: 九条兼実『玉葉』（1189年5月29日。今の言葉に）}
  - {type: quote, from: 71, to: 71, label: 史料, text: 義経たちのふるまいは／まことに義士と言うべきか, source: 九条兼実『玉葉』（1185年11月3日。今の言葉に）}
  - {type: quote, from: 82, to: 82, label: 史料, text: 軍中は将軍の令を聞く／天子の詔を聞かず, source: 大庭景能の答え（吾妻鏡 1189年6月30日。今の言葉に）}
  - {type: quote, from: 90, to: 90, label: 史料, text: これは手柄ではないか／罪も無いのに、なぜ征伐されるのか, source: 泰衡の書状（吾妻鏡 1189年8月26日。今の言葉に）}

