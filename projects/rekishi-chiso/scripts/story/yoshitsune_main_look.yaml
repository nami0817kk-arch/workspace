  - {type: quote, from: 14, to: 14, label: 史料, text: 天下の恥／何事かこれに如かずや, source: 九条兼実『玉葉』（1181年8月15日。秀衡の陸奥守任官について）}
  - {type: versus3, from: 36, to: 37, every: 4,
