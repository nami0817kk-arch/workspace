title: "クレオパトラ｜死因は記録で食い違う"
yt_title: "クレオパトラの死因は、記録で食い違う　プルタルコスは3つの説を並べ、「真実は誰も知らない」と書いた"
description: |-
  クレオパトラは、どうやって死んだのか。古代の記録は、一つに決めていません。
  ギリシャ人のプルタルコスは、イチジクの籠に隠した蛇、水壺に閉じ込めた蛇、髪にさした中空の櫛の毒、の3つの説を並べ、「真実は、誰も知らない」と書きます。地理学者ストラボンは、蛇の毒か、毒の軟膏かの2つ。オロシウスは、蛇に咬まれたと思われ、左の腕に傷があった、と書きます。
  オクタウィアヌスは、死んだと聞くと、薬と、蛇の毒を吸い出す男たちを使って、生き返らせようとした、ともスエトニウスらは書きます。引用は英訳（Thayer 版 Loeb）とラテン語原文で読んだものです。
  死に方さえ分かれる女王の墓は、どこにあるのか。本編は概要欄のリンクからどうぞ。
