lines:
  # fact: sankin-15
  - 語り: 102万石の加賀藩。その大名行列の人数は、出どころごとに、《!まるで合わない》。
    shot: Satta
    tone: 強調
    pause: 0.12
  # fact: sankin-15
  - 語り: 日本大百科全書は、4千人と書く。世界大百科事典は、多いときで、2千5百人余。
    shot: Hishi
    tone: しみじみ
    pause: 0.12
  # fact: sankin-15
  - 語り: 石川県立歴史博物館は、通常、2千人から3千人だ。
    shot: P04
    tone: しみじみ
    pause: 0.12
  # fact: sankin-15
  - 語り: そして、1827年の記録は、1969人。
    shot: P06
    tone: 重い
    pause: 0.12
  # fact: sankin-14
  - 語り: しかも、その1969人のうち、686人は、藩士ではない、臨時の雇いだった。およそ3人に1人だ。
    shot: Hishi2
    tone: 重い
    pause: 0.12
  # fact: sankin-62
  - 語り: 江戸に入る前には、人数を増やした。「渡り者」と呼ばれる、臨時の雇いだ。
    shot: P01
    tone: しみじみ
    pause: 0.12
  # fact: sankin-62
  - 語り: 品川宿など、江戸の入り口にいた人たちを雇い、最低限の衣装を着せて、作法を教えた、といわれる。
    shot: Kasu
    tone: しみじみ
    pause: 0.3
    dip: true
  - 語り: 4千人と、1969人。あなたなら、どちらを、加賀藩の行列と呼びますか。
    shot: P09
    tone: 疑問
    pause: 0.15
