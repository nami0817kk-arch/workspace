# 物語完結型ショート 参勤交代 s2（2026-10-31）。本編 scripts/sankin-story.yaml（11/4 19:00 公開、https://youtu.be/cZ1q-xRuDHc）の序章・第2章から。11/5 12:30 公開。
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った浮世絵・絵巻だけ。新しい絵は作らない。
# 切り口：加賀藩の行列の人数が出どころごとに合わない（4千／2千5百余／2〜3千／1969）＋臨時の雇い686人と渡り者。条文（s1）・大井川（s3）・宿場（s4）・終わり（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/参勤交代_facts_20261031.yaml）：sankin-14・15・62。数は本編の言い方（出どころ付き）のまま。
#   ・4千人は日本大百科全書の「加賀前田氏の4千人を筆頭に」、2千5百人余は世界大百科事典の「多いときで」、通常2千〜3千人は石川県立歴史博物館、1969人は文政10年（1827年）の記録。
#   ・686÷1969＝34.8％ →「およそ3人に1人」（本編のまま）。文政10年＝1827年は計算し直して合う。屏風の473人は尺のため入れない。
#   ・渡り者は「といわれる」（本編のまま）。
# 理解テスト4問：
#   ①誰の話か：加賀藩（102万石）の大名行列
#   ②いつ・どこで何が：行列の人数が、事典は4千人・2千5百人余、博物館は通常2千〜3千人、文政10年（1827年）の記録は1969人
#   ③なぜ食い違うか：書き方（筆頭に・多いときで・通常）と年が違う。1969人のうち686人は臨時の雇い
#   ④どうなったか：江戸に入る前には渡り者を雇って人数を増やした → あなたならどれを行列の人数と呼ぶか
title: 参勤交代｜加賀藩の行列は、何人だったのか
yt_title: 加賀藩の大名行列は何人だったのか　4千人から1969人まで、出どころごとに合わない数
description: |-
  102万石の加賀藩。その大名行列の人数は、出どころごとに合いません。
  日本大百科全書は4千人、世界大百科事典は多いときで2千5百人余、石川県立歴史博物館は通常2千人から3千人。そして、文政10年、1827年の記録は1969人です。しかも、その1969人のうち686人は、藩士ではない臨時の雇いでした。江戸に入る前には、「渡り者」と呼ばれる臨時の雇いで、人数を増やしたといわれます。
  これほどの行列を、幕府は、なぜ毎年の往復として命じたのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
