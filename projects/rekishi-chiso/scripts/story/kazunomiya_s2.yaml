# 物語完結型ショート 和宮 s2（2026-10-29）。本編 scripts/kazunomiya-story.yaml の第2章（25日の中山道と縁切榎）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazunomiya/main/W*.jpg）と渓斎英泉の木曽街道の版画。
# 事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml）：kazunomiya-20・31・18・19・33・21
#   ・行列の人数はぶぎんレポート（2018）の数（kazunomiya-31）だけを言う。人数の食い違い（kazunomiya-32）は本編に任せる（1本の筋を1つにするため）。
#   ・まわり道は板橋区が「史料で確かめられる」とする（kazunomiya-19）。菰で包んだ話は同じ展示の言い伝え（kazunomiya-33）→「言い伝え」と言う。
#   ・家茂が4年あまりで亡くなったのは誰でも知っている流れ（本編も fact なし）。
# 理解テスト4問：
#   ①誰の話か：和宮（将軍家茂に嫁ぐ皇女）の嫁入りの行列
#   ②いつ・どこで何が：文久元年（1861）10月20日に京都を出て、中山道を25日。江戸の手前の板橋宿に、花嫁が下を通ると縁が切れるという「縁切榎」があった
#   ③何を選んだか：行列は木の下を避けるため、わざわざまわり道の道路を作った（菰で包んで下を通ったという言い伝えもある）
#   ④どうなったか：11月15日に江戸に入った。けれど夫の家茂とは、4年あまりで死に別れた
title: 和宮｜縁が切れる木を、まわり道で避けた
yt_title: 皇女和宮の嫁入り行列は、「縁切榎」を避けるために道まで作った
description: |-
  文久元年、1861年の10月20日。将軍家茂に嫁ぐ皇女和宮は、京都を出て、中山道を江戸へ向かいました。約530キロ、23の宿場に泊まる、25日の旅です。
  行列には京都方から1万人、幕府方から1万6千人が加わり、荷を運ぶ人足を入れると3万人あまりと言われます（ぶぎんレポート 2018）。桶川宿には人足3万6,450人と馬1,799頭が集められました。
  江戸の手前の板橋宿には、花嫁が下を通ると縁が切れるという「縁切榎」がありました。行列は、この木の下を避けるため、わざわざまわり道の道路を作って通った、と板橋区は史料で確かめています。榎を菰で包んで下を通った、という言い伝えも残ります。
  11月15日、和宮は江戸に入りました。けれど夫の家茂とは、4年あまりで死に別れることになります。
hashtags: ["#和宮", "#日本史", "#幕末"]
