# 本編の最後の「解いたのは誰か」の答えは、このショートでは明かさない。
title: "ロゼッタストーン｜見つかった日は、分かっていない"
yt_title: "ロゼッタストーンが見つかった日は、はっきりしない　よく言われる15日も19日も当時の記録では裏づけられない　石はもとからロゼッタにあったのでもない"
description: |-
  ロゼッタストーンが見つかった日は、はっきりしません。よく言われる15日と19日は、どちらも当時の記録では裏づけられず、研究者のルクラントは、1799年7月14日から25日のあいだ、と見ています。
  見つかり方も記録で違い、石はもとからロゼッタにあったのではない、とも考えられています。
  では、この石に刻まれていたのは、どんな文だったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/ULryhFAAhgQ
