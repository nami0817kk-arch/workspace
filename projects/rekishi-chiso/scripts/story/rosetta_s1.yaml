lines:
  # fact: rosetta-A01
- 語り: "ロゼッタストーンが見つかった日は、実は、はっきりしない。"
  shot: C03_1
  tone: 強調
  pause: 0.12
  # fact: rosetta-A04, rosetta-A06
- 語り: "1799年7月。ナイルのほとり、ロゼッタの町で、ナポレオンの軍が、古い砦を、直していた。"
  shot: C02_2
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A05
- 語り: "工事の途中で、黒っぽい石が、出てきた。見つけたのは、工兵将校のブシャール、と伝わる。"
  shot: C03_3
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A05
- 語り: "見つかり方は、記録で違う。大英博物館は、砦の増築部の、基礎を掘っていた、と書く。"
  shot: C02_4
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A05
- 語り: "研究者のルクラントは、古い壁の中に、再利用されていた、と書く。"
  shot: C03_5
  tone: 重い
  pause: 0.12
  # fact: rosetta-A01, rosetta-A02
- 語り: "よく言われる15日と19日は、どちらも、当時の記録では、裏づけられない。"
  shot: C02_6
  tone: 重い
  pause: 0.12
  # fact: rosetta-A01
- 語り: "ルクラントは、7月14日から25日のあいだ、と見ている。"
  shot: C03_7
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A07
- 語り: "しかも、石は、もとからロゼッタに、あったのではない、と考えられている。"
  shot: C04_8
  tone: 重い
  pause: 0.12
  # fact: rosetta-A07
- 語り: "ナイル・デルタ内陸の神殿、おそらくサイスから、運ばれてきた、という説が、有力だ。"
  shot: C04_9
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-A11
- 語り: "では、この石に刻まれていた、《答え》とは、どんな文だったのか。"
  shot: C05_10
  tone: 疑問
  pause: 0.15
