# 物語完結型ショート ロゼッタストーン s1（2026-11-15）。本編 scripts/rosetta-story.yaml（11/18 12:00 公開、https://youtu.be/ULryhFAAhgQ）から。11/19 に予約。
# 形式は habsburg_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/ロゼッタ_facts_20261114.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/rosetta/main/）の切り出しだけ。新しい絵は作らない。切り口：見つかった日と見つかり方の食い違い（序章）
