# 計算（自分で数え直した）：手紙は107年ごろ＝噴火から27年か28年あと（本編どおり）。小プリニウス「18年目」＝満17歳。
title: "大プリニウス｜噴火の見物の船を、救助に切り替えた"
yt_title: "博物誌の大プリニウスは、ヴェスヴィオの噴火で見物の船を救助に切り替えた　甥の小プリニウスが書き残した伯父の最期"
description: |-
  博物誌を書いた学者、大プリニウス。ナポリ湾の岬の港ミセヌムで、ローマの艦隊を率いていました。
  ヴェスヴィオの噴火の日、見慣れない雲を近くで見ようと、速い船を用意させます。そこへ、山のふもとのレクティナという女性から、助けを求める書きつけが届き、大プリニウスは見物を救助に切り替えました。
  この一日を書き残したのは、当時17歳の甥、小プリニウスです。噴火から27年か28年あとに、歴史家タキトゥスにあてた手紙でした。
  本編では、この手紙のたった1か所の日付「8月24日」が、どこまで確かなのかを、写本・発掘・2018年の炭の落書きからたどっています。本編は概要欄のリンクからどうぞ。
