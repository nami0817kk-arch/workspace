lines:
  # fact: pom-07, pom-08
- 語り: "博物誌を書いた学者、大プリニウス。ヴェスヴィオの噴火の日、見物に出すはずの船を、救助に切り替えた。"
  shot: P05_1
  tone: 強調
  pause: 0.12
  # fact: pom-07
- 語り: "大プリニウスは、ナポリ湾の岬の港ミセヌムで、ローマの艦隊を率いていた。"
  shot: P01_2
  tone: しみじみ
  pause: 0.12
  # fact: pom-05, pom-07
- 語り: "昼すぎ、松に似た形の、見慣れない雲が出ている、と知らせが来た。"
  shot: P02_3
  tone: しみじみ
  pause: 0.12
  # fact: pom-08
- 語り: "近くで見ようと、速い船を用意させた。そのとき、山のふもとのレクティナという女性から、助けを求める書きつけが届いた。"
  shot: P03_4
  tone: しみじみ
  pause: 0.12
  # fact: pom-09
- 語り: "浜に近づけず、舵取りが、引き返そうと言った。大プリニウスは、勇者には運が味方する、と答え、湾の向こうのスタビアエへ向かった。"
  shot: P05_5
  tone: 重い
  pause: 0.12
  # fact: pom-10
- 語り: "夜が明ける時刻になっても、あたりは、真っ暗。人々は、降ってくる石から身を守るため、枕を頭に結びつけて、外へ出た。"
  shot: P06_6
  tone: 重い
  pause: 0.12
  # fact: pom-10
- 語り: "大プリニウスは、すぐに倒れた。濃い煙で、息が詰まったのだろう。甥は、そう推し量っている。"
  shot: P06_7
  tone: 重い
  pause: 0.12
  # fact: pom-04, pom-11
- 語り: "書き残したのは、甥の小プリニウス。噴火のとき17歳。27年か28年あとに、歴史家タキトゥスにあてた手紙だ。"
  shot: P20_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第3章〜まとめ（日付の1か所と写本、pom-06・15・16・17）
- 語り: "噴火の日付が書かれているのも、この手紙の、たった1か所。その日付は、どこまで確かなのか。"
  shot: P15_9
  tone: 疑問
  pause: 0.15
