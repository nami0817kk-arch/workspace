lines:
  # fact: pyramid-P26
- 語り: "砂を、ちょうどよく濡らすと、石を載せた橇を引く力は、約半分になった。2014年の、実験の結果だ。"
  shot: C11_1
  tone: 強調
  pause: 0.12
  # fact: pyramid-P26
- 語り: "手がかりは、エジプト中部、デイル・エル・ベルシャにある、墓の壁画。紀元前1880年ごろのものだ。"
  shot: C25_2
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P26
- 語り: "大ピラミッドより、約700年あと。巨像を載せた橇を、172人で引いている。"
  shot: C25_3
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P26
- 語り: "橇の前では、1人が、砂に、水を注いでいる。"
  shot: C11_4
  tone: 重い
  pause: 0.12
  # fact: pyramid-P26
- 語り: "これを確かめたのが、アムステルダム大学のフォールたち。砂の湿り具合を変えて、橇を引いた。"
  shot: C11_5
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P26
- 語り: "ただし、壁画の水は、儀式を表す、とする読みもある。実験が確かめたのは、砂の摩擦で、壁画の意図ではない。"
  shot: C25_6
  tone: 重い
  pause: 0.12
  # fact: pyramid-P25
- 語り: "水の上の手がかりもある。2024年、長さ約64キロの、埋もれたナイルの支流が、地図にされた。岸には、約31基のピラミッドが並ぶ。"
  shot: C18_7
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P25
- 語り: "これも、水路の復元で、船で運んだ証拠そのものでは、ない。"
  shot: C18_8
  tone: 重い
  pause: 0.12
  # fact: pyramid-P28
- 語り: "運ぶ手がかりは、見つかった。では、石を、ピラミッドの上まで、どう積んだのか。"
  shot: C23_9
  tone: 疑問
  pause: 0.15
