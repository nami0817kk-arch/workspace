# 物語完結型ショート 大ピラミッド s5（2026-11-16）。本編 scripts/pyramid-story.yaml（11/20 19:00 公開予定、https://youtu.be/B-vlbAtwegY）から。11/21 19:30 に予約。
# 形式は meireki_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カードと本編の # fact: だけ。
# 絵：本編の AI 絵の切り出しだけ。C10・C20・C21・C22・C24 は使わない（坂道の説に見える絵は出さない）。顔は出さない。
# 切り口：本編の第5章＝濡れた砂（壁画と2014年の実験）と、埋もれた支流（2024年）。どちらも手がかりで、証拠そのものではない。
# 計算（自分で計算し直した）：壁画 前1880年ごろ − 大ピラミッド 前2560年ごろ ＝ 約680年（「約700年あと」）。
title: "大ピラミッド｜砂を濡らすと、引く力は約半分"
yt_title: "古代エジプトの壁画で、橇の前の砂に水を注ぐ人　2014年の実験では、砂を濡らすと引く力が約半分になった"
description: |-
  エジプト中部、デイル・エル・ベルシャの墓の壁画（紀元前1880年ごろ）には、巨像を載せた橇を172人で引き、橇の前で水を注ぐ人が描かれています。2014年、アムステルダム大学のフォールたちの実験で、砂をちょうどよく濡らすと、橇を引く力は約半分になりました。
  ただし、壁画の水は儀式を表す、とする読みもあります。2024年には、ギザの近くの長さ約64キロの埋もれたナイルの支流が、地図にされました。どれも手がかりで、決定的な証拠ではありません。
  本編では、船・濡れた砂・坂道の手がかりと、積み方の説を整理しています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/B-vlbAtwegY
