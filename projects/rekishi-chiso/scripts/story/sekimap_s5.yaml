# hook＝宇喜多秀家は関ヶ原のあと50年近くをどこで過ごしたか（答えはこのショートの中：八丈島）。
# tease＝秀家のあとに備前と美作へ入った小早川家は、そのあとどうなったか（答えは本編 第7章：1602年10月に秀秋が21歳で亡くなり絶える、sekimap-39）。
# 計算（数え直した）：1606→1655＝49年→50年近く。
# 理解テスト：①宇喜多秀家の関ヶ原のあとの話 ②1606年4月、八丈島 ③島津に匿われ、島津家と前田家の命乞いで死罪を免れて流される ④84歳で亡くなるまで島で、前田家は明治2年まで仕送りを続けた
title: "関ヶ原のあと｜宇喜多秀家の50年"
yt_title: "関ヶ原で西軍の大名だった宇喜多秀家は、八丈島で50年近くを過ごした　前田家は明治2年まで島へ米を送り続けた"
description: |-
  備前と美作の大名、宇喜多秀家は、関ヶ原のあと薩摩の島津に匿われ、島津家と前田家の命乞いで死罪を免れました。1606年の4月、八丈島へ流されます。
  岡山県によると、2人の息子など13人で島へ渡り、84歳で亡くなるまで、50年近くを島で過ごしました。江戸時代に八丈島へ送られた流人は1800人を超え、その最初が秀家の一行でした。加賀の前田家は、明治2年に一族が許されるまで、1年おきに白米70俵と金子35両などを島へ送り続けました。
  本編では、取り上げた石高の総量から、東海道の大名の行き先、毛利・上杉・佐竹・島津のその後まで、関ヶ原の前と後の大名の地図を数字で積み上げています。本編は概要欄のリンクからどうぞ。
