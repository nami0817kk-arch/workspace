# 物語完結型ショート ロゼッタストーン s5（2026-11-15）。本編 scripts/rosetta-story.yaml（11/18 12:00 公開、https://youtu.be/ULryhFAAhgQ）から。11/19 に予約。
# 形式は habsburg_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/ロゼッタ_facts_20261114.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/rosetta/main/）の切り出しだけ。新しい絵は作らない。切り口：「わかった！」と倒れた逸話の出どころ
# 計算（自分で数え直した）：1856−1822＝34年／1906−1822＝84年／1822→1828〜29（エジプトへ渡る）
# 本編の最後の「解いたのは誰か」の答えは、このショートでは明かさない。
title: "ロゼッタストーン｜「わかった！」と倒れた話の出どころ"
yt_title: "シャンポリオンは「わかった！」と叫んで倒れた　その有名な話の出どころは、34年後と84年後の伝記　台詞も本によって2通り"
description: |-
  1822年9月14日、シャンポリオンは建築家ユヨの写しにあったラムセスとトトメスの名を見て、兄の仕事場へ走り、「わかった」と叫んで倒れた。そんな有名な話があります。
  けれど、研究者のフルネは出どころとして1856年の伝記を挙げ、詳しい場面が載るのは1906年の伝記です。34年後と、84年後。台詞も、伝える本で2通りに割れています。
  では、解読を発表した『手紙』で、シャンポリオンは、エジプト語の文章を読んだのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/ULryhFAAhgQ
