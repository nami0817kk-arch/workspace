lines:
  # fact: rosetta-B30
- 語り: "「わかった！」と叫んで、倒れた。ロゼッタストーンの解読には、そんな有名な話がある。"
  shot: C17_1
  tone: 強調
  pause: 0.12
  # fact: rosetta-B30
- 語り: "1822年9月14日。エジプト人の王、ラムセスとトトメスの名を見て、彼は、兄の仕事場に走り、わかった、と叫んで、倒れた、という話だ。"
  shot: C17_2
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-B30, rosetta-B29
- 語り: "けれど、この話の出どころは、はっきりしない。"
  shot: C15_3
  tone: 重い
  pause: 0.12
  # fact: rosetta-B29, rosetta-C19
- 語り: "研究者のフルネは、出どころとして、1856年の伝記を挙げる。詳しい場面が載るのは、1906年のハルトレーベンの伝記だ。34年後と、84年後。"
  shot: C13_4
  tone: 重い
  pause: 0.12
  # fact: rosetta-C20
- 語り: "台詞も、伝える本で割れる。「ジュ・ティアン・ラフェール」と、「ジュ・ティアン・モン・アフェール」の、2通りだ。"
  shot: C13_5
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-B35
- 語り: "しかも、彼が読んだのは、写しだった。1822年の時点で、ロゼッタストーンの実物を、見ていない。"
  shot: H01_6
  tone: 重い
  pause: 0.12
  # fact: rosetta-B26
- 語り: "では、この読み方を発表した、1822年の『手紙』で、彼は、エジプト語の文章を、読んだのだろうか。"
  shot: C17_7
  tone: 疑問
  pause: 0.15
