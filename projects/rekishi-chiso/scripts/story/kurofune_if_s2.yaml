# 物語完結型ショート 黒船（もしも）s2（2026-10-31）。本編 scripts/kurofune-if-story.yaml（11/4 12:00 公開、https://youtu.be/QRZZXxHicQ4）から。切り口：ペリーの7年前、1846年のビッドル艦隊（と1845年のマンハッタン号）は浦賀で断られた
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・負傷・死の絵なし。
# 絵は本編の AI 絵（out/story/kurofune-if/main/K01〜K15。人物は描かない）と実在の版画（paintings/sakoku_perry_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/黒船_facts_20261031.yaml）：kurofune-if-14・15・16・20（本編 第1章の言い方のまま）
# ・計算のやり直し：1853年－1846年＝7年（「ペリーの7年前」）。日数は『日本遠征記』10日・同じ本の別の頁8から10日・1848年の石版画の展示文9日間（本編の stats どおり）。
#   フォスターの「7月20日に錨、27日に返答」は日数の比べに混ぜない（尺のため外す）。突かれた逸話（17）も尺のため外す。
# ・マンハッタン号の話は「フォスターが1903年の本に書いた話」と出どころを言う（本編どおり）。
# 理解テスト4問：
#   ①誰の話か：ペリーの7年前に浦賀へ来たアメリカの提督ビッドル
#   ②いつ・どこで何が：1846年7月、2隻で浦賀の沖へ。約400隻の警備船に囲まれ、通商はオランダ以外許されないと返された
#   ③何が問題か：浦賀にいた日数は記録で割れる（10日・8から10日・9日間）。結末はどれも同じ
#   ④どうなったか：誰も上陸せず何も得られず帰った。前の年の捕鯨船も追い返されていた。幕府に開く気はなかったのかを問いで閉じる
title: 黒船｜ペリーの7年前、浦賀で断られたアメリカの艦隊
yt_title: ペリーの7年前に浦賀へ来たビッドル艦隊　約400隻に囲まれ、断られて帰った
description: |-
  ペリーの7年前、アメリカの軍艦は、浦賀に来て、断られて帰っています。
  1846年7月、提督ビッドルのコロンバス号とヴィンセンス号が、浦賀の沖に入りました。ペリーの公式記録『日本遠征記』によると、日本の警備船は約400隻。通商ができるかを尋ねたビッドルへの返答は、「オランダ以外のどの国とも、通商は許されない」でした。浦賀にいた日数は、10日、8日から10日、9日間と、記録で割れています。それでも結末は同じで、誰も上陸せず、何も得られないまま帰りました。その前の年、1845年には、日本人22人を送り届けた捕鯨船マンハッタン号が、「二度と日本へ来るな」と追い返されています（フォスター、1903年）。
  幕府は、本当に、開く気がなかったのか。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
