# 理解テスト4問：
#   ①誰の話か：ルイ16世の財務総監テュルゴー
#   ②いつ・どこで何が：1774年8月24日に国王へ「破産しない・増税しない・借金しない」と書き、1776年1月に賦役の廃止などの勅令の案を出した
#   ③何が起きたか：高等法院が反対し、国王は3月12日の親裁座で登録させた。テュルゴーは宮廷の大半に憎まれると見通していた
#   ④どうなったか：5月12日に罷免。13年後、同じ国王が賦役を永久になくすと宣言させる。もしも外されなかったら、を問いで閉じる
title: テュルゴー｜革命の13年前、農民のただ働きをなくそうとした大臣は外された
yt_title: 革命の13年前に外された大臣テュルゴー　「破産しない・増税しない・借金しない」と国王に書いた人
description: |-
  フランス革命の13年前、農民のただ働きをなくそうとした大臣が、外されました。
  1774年8月24日、財務総監になったテュルゴーは、国王ルイ16世に「破産しない。増税しない。借金しない」と書き、宮廷の大半に憎まれることになる、と見通していました。1776年1月、テュルゴーは、農民を道の工事にただで働かせる賦役をなくす勅令などの案を出します。パリ高等法院は反対しましたが、国王は3月12日の親裁座で勅令を登録させました。そして5月12日、テュルゴーは罷免されます。13年後の1789年6月、同じ国王は、賦役を永久になくす、と宣言させることになります。
  もしも、テュルゴーが外されなかったら。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
