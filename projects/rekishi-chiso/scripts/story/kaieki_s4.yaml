# 絵：本編の AI 絵（out/story/kaieki/main/ の K）の切り出しだけ。新しい絵は作らない。
# 切り口：堀田正信が家綱に幕政批判の書き付けを出し、無断で佐倉へ帰って改易、20年後に家綱の死を聞いて自ら命を絶った（本編 第6章、kaieki-70・71）。
# hook＝将軍に意見した大名はどうなったか（答えはこのショートの中）。tease＝家綱の死のあと、改易の的になったのは誰か（答えは本編 第7章：徳川の一門と譜代。kaieki-11・74）。
# 数え直し：万治3年＝1660、延宝8年＝1680、1680−1660＝20年。石高は世界大百科の「10万石余の返上を申し出た」だけ（11万石は言わない）。家綱の死の月日は事実カードに無いので言わない。
# 理解テスト：①下総佐倉の大名、堀田正信の話 ②1660年、老中の政治を批判する書き付けを将軍家綱に出し、許しなく佐倉へ帰った ③10万石あまりの領地を返したいとまで申し出た ④領地を取り上げられ大名家に預けられて移され、1680年5月20日、家綱の死を聞いて自ら命を絶った（改易から20年）
title: "改易｜堀田正信の書き付け"
yt_title: "将軍家綱に老中の政治を批判した堀田正信　許しなく佐倉へ帰って改易、20年後に自ら命を絶った"
description: |-
  万治3年、1660年。下総の佐倉の大名、堀田正信は、老中の松平信綱たちの政治を批判する書き付けを、4代将軍の家綱に差し出し、許しを得ずに佐倉へ帰りました。書き付けでは、10万石あまりの領地を返したい、とまで申し出ています。
  幕府は正信の領地を取り上げました。正信は、信濃の飯田の脇坂家に預けられ、のちに若狭の小浜の酒井家、阿波の徳島の蜂須賀家へと移されます。
  延宝8年、1680年の5月20日。家綱の死を聞いた正信は、自ら命を絶ちました。改易から、20年後のことでした。
  本編では、江戸幕府に取りつぶされた大名の数と、いちばん多かった理由、そして数が減っていったわけを、研究ごとの数字で積み上げています。本編は概要欄のリンクからどうぞ。
