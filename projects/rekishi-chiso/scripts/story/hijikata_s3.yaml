# 物語完結型ショート 土方歳三 s3（2026-10-29）。本編 scripts/hijikata-story.yaml の第2章（「局中法度」の名・茂辺地の宿の硬貨）から。
# 形式は masamune_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「……取っておけ」は使わない）。
# 絵は実在の絵・写真と本編の AI 絵（J06 は手と硬貨だけ・顔なし）。AI 絵の土方は後ろ姿か影だけ。刀・戦の場面は出さない。
# 事実カード（dev/output/rekishi-chiso/research/土方歳三_facts_20261029.yaml）：hijikata-15・31
#   ・局中法度の名が子母沢寛の始末記から広まった・当時の史料に無い／菊地明さんの2000年の記事は出どころが1つ（hijikata-15）→「といわれる」。
#   ・茂辺地の硬貨・お膳は北海道新聞 2025年10月の報（hijikata-31）。「渡したという」「使ったとされる」で言う。
# 理解テスト4問：
#   ①誰の話か：「鬼の副長」土方歳三
#   ②何が問題か：隊の決まりの名「局中法度」は、昭和3年の子母沢寛の本から広まった名で、当時の記録には見えない、といわれる
#   ③では別の顔は：箱館戦争のさなか、茂辺地の宿で、宿の娘に硬貨を渡したと伝わる（2025年10月の北海道新聞）
#   ④どうなったか：硬貨とお膳は宿の子孫のもとに伝わっていた。鬼の姿には後の時代の物語が混じるのかもしれない
title: 土方歳三｜「局中法度」の名は、昭和の小説から広まった？
yt_title: 土方歳三の「局中法度」は昭和の小説の名？　鬼の副長が宿の娘に渡した硬貨
description: |-
  新選組の副長、土方歳三は、隊の決まりを厳しく守らせたといわれ、その決まりは「局中法度」の名で知られています。けれど、その名は、昭和3年に作家の子母沢寛が書いた『新選組始末記』から広まったもので、当時の記録には見えない、ともいわれます。
  2025年10月の北海道新聞は、箱館戦争のさなかに土方が泊まった茂辺地（今の北斗市）の宿の子孫のもとに、土方が宿の娘に渡したという硬貨と、土方が使ったとされるお膳が伝わっていたと伝えています。
hashtags: ["#土方歳三", "#日本史", "#幕末"]
ai_images: true
