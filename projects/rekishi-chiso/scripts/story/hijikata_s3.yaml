    shot: Kyoto
    tone: 強調
  - 語り: 新選組の副長として、土方は、隊の決まりを、厳しく守らせた。その決まりは、局中法度の名で、よく知られている。
    shot: Shijo
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-15
  - 語り: けれど、その名は、昭和3年、作家の子母沢寛が書いた、新選組始末記から広まったもの。当時の記録には見えない、ともいわれる。
    shot: Sanjo
