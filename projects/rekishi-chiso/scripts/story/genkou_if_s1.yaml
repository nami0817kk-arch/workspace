# 形式は jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「時宗想像」「御家人想像」「季長想像」は使わない）。戦闘・負傷・遺体の絵なし。
# 絵は本編の AI 絵（out/story/genkou-if/main/G01〜G15。人物は描かない）と実在の絵（paintings/genkou_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/元寇_facts_20261030.yaml）：genkou-if-07・08・10
# ・暦の換算：今の暦で11月26日ごろ、は本編の言い方のまま（荒川 1958）。月日の換算そのものは本編でも確かめ直していないので、年号・月日は転記だけ。
# ・風が吹いたかどうかは言い切らない（問いで閉じる）。1281年の台風が本当に吹いたことは荒川さん自身も認めている（08）。
# ・『元史』『高麗史』『愚童訓』の書き分けは s2 に回す（ここでは問いにするだけ）。
# 理解テスト4問：
#   ①誰の話か：荒川秀俊さんと、「神風」が吹いたとされる夜の疑い
#   ②いつ・どこで何が：1274年10月20日の夜、博多湾の元・高麗軍の船団が去った。1958年に荒川さんが、新暦では11月26日ごろで台風の季節ではない、と指摘
#   ③何が問題か：根拠は季節・確かな文書に記載なし・1281年の台風との混同。ただし1281年の台風は本当に吹いた
#   ④どうなったか：山口秀樹さんも1961年に腑に落ちない点を書いた。風が吹いたかは問いで閉じる
title: 元寇｜神風が吹いた夜は、新暦の11月26日だった
yt_title: 元寇の神風が吹いたとされる夜は新暦11月26日　台風の季節ではないという指摘
description: |-
  元寇で日本を救った「神風」。その風が吹いたとされる夜は、今の暦で、11月26日ごろです。
  1274年10月20日の夜、博多湾に来ていた元と高麗の連合軍の船団が去りました。1958年、荒川秀俊さんは新聞への寄稿で、台風の季節ではない、と指摘します。根拠は、季節、確かな文書に大風雨の記載がないこと、そして1281年の台風と混ざった可能性の3つでした。ただし、1281年の台風は、本当に吹いています。疑われたのは、その7年前の夜のほうです。
  その夜を、当時の記録は、どう書いたのか。この問いを、記録の食い違いから掘り下げた本編は、概要欄のリンクからどうぞ。
