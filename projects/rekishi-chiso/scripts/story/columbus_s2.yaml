# 物語完結型ショート コロンブス s2（2026-11-06）。本編 scripts/columbus-if-story.yaml（11/9 12:00 公開）の第3章（1492年10月10日）から。11/10 11:00 公開。
# 形式は hojo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」は最後の問いだけ（答えは本編の第4章）。
# 絵は本編の AI 絵（out/story/columbus-if/main/）だけ。新しい絵は作らない。
# 切り口：10月10日に船乗りと何が話されたかは記録で割れる（日誌の要約＝励まして進む／オビエド＝3日の約束／ラス・カサス＝数日がまん、3日とは書かない）。
#   その前の、見せた距離の数（10月1日 584と707レグア）とマルティレの「海に投げ込む企て」。陸が見えたのは12日の夜中の2時。
# 事実カード：columbus-21・26・76・27・28。言い方は本編のまま。人数（90/120）・出航の時刻は割れるので言わない。
# 計算：707−584＝123レグア短く見せた（台本では言わない）。
# 理解テスト4問：
#   ①誰の話か：コロンブスと、船乗りたち
#   ②いつ・どこで何が：1492年8月3日にパロスを出て、大西洋の上で船乗りたちが引き返せと迫った
#   ③何が割れているか：10月10日、コロンブスが「3日のうちに陸」と約束したか。日誌の要約・オビエド・ラス・カサスで書き方が違う
#   ④どうなったか：12日の夜中の2時、水夫のロドリゴ・デ・トリアナが陸を見た。もしも引き返していたら誰が見つけたか、の問いで閉じる（答えは本編）
title: 1492年10月10日｜引き返せと迫った船乗り
yt_title: コロンブスの船乗りたちは「引き返せ」と迫った　1492年10月10日、「3日」の約束はあったのか、記録ごとに違う
description: |-
  1492年8月3日、コロンブスの船団はスペインのパロスを出ました。長い航海で船乗りがおびえないよう、コロンブスは走った距離より短い数を見せます。航海日誌の10月1日は、見せた数が584レグア、本当は707レグアです。
  イタリアの人文学者ピエトロ・マルティレは、船乗りたちが引き返せと迫り、コロンブスを海に投げ込むことまで企てた、と書いています。
  そして10月10日。航海日誌の要約では、コロンブスは船乗りを励まして進むと言っただけ。オビエドは、3日のうちに陸が見つかると約束した、と書きました。ラス・カサスは、数日がまんしてくれと頼んだとは書きますが、3日とは書きません。
  陸が見えたのは12日の夜中の2時。最初に見たのは、水夫のロドリゴ・デ・トリアナでした。
  もしもこの航海が引き返していたら、アメリカは、誰にも見つからなかったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#コロンブス', '#大航海時代', '#世界史']
