# 切り口：流人の丹宗庄右衛門が伝えたいも焼酎（本編 第3章・第5章、rujin-25・32・33・58）。
# hook＝八丈島の焼酎の造り方を伝えたのは誰か（答えはこのショートの中：密かな交易の罪で流された薩摩の商人、丹宗庄右衛門）。
# tease＝流人のなかで、島のことをいちばん多く書き残したのは誰か（答えは本編 第5章：近藤富蔵と八丈実記、rujin-51・52）。
# 計算：サツマイモを名主が持ち帰った1811年→丹宗が流された1853年＝42年→「40年あまりのち」。
# 理解テスト：①八丈島の焼酎と流人の話 ②1853年、八丈島 ③穀物の酒造りが禁じられた島で、流人がサツマイモの焼酎の造り方を教えた ④米を使わずに造れて農家の益になり、今の島酒の始まりとされる
title: "八丈島の流人｜いも焼酎を伝えた商人"
yt_title: "八丈島の焼酎の造り方を伝えたのは、島流しにされた薩摩の商人だった　流人・丹宗庄右衛門と島酒の始まり"
description: |-
  江戸時代の八丈島へ送られた流人には、武士や僧、学のある人が多く、新しい知識や技を運ぶ人として歓迎もされました。島の役所や村では、読み書きの得意な流人を書記として雇うことも多かったといいます。
  1853年、嘉永6年。薩摩の商人、丹宗庄右衛門が、密かな交易の罪で八丈島へ流されてきます。島では、飢饉に備えて穀物で酒を造ることが禁じられていたと伝わります。東京国税局の資料によると、丹宗は、サツマイモで焼酎を造る方法を島の人に教えました。サツマイモは、その40年あまり前の1811年に、大賀郷の名主が新島から持ち帰って広めた作物です。『八丈実記』は、米を使わずに造れて農家に大きな益があった、と書いています。
  本編では、流人の送られ方・住まい・食べ物・水汲み女・島抜け・赦免まで、島に残った帳面と流人の記録でたどっています。本編は概要欄のリンクからどうぞ。
