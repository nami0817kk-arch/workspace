# 切り口：天正6年（1578）3月15日の出陣の予定。行き先が書き手で揺れる（乃至2023＝上洛、2024＝関東、武徳編年集成＝信長と戦う）。家の記録では出陣の6日前に倒れる。死因は言わない。
#   本編の答え（謙信の最期の理由＝同時代の言葉は虫気だけ・厠は江戸の軍記で一説・言えること言えないこと）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/上杉謙信_facts_20261107.yaml）：kenshin-12・36・24・05・02・22・23。言い方は本編のまま。
# 計算（自分で計算し直した）：3月9日→3月15日＝6日前。3月9日→3月13日＝4日後。1530年生まれ→1578年＝数え49歳（家譜附録「御年四十九」と合う）。
# 理解テスト4問：
#   ①誰の話か：上杉謙信の最後の出陣の予定（天正6年3月15日）
#   ②いつ・どこで何が：正月に陣触れを出し、3月15日の出陣と決めていた。家の記録では、その6日前の3月9日に倒れ、4日後の13日に49歳で亡くなる
#   ③何が割れるか：行き先。乃至政彦は2023年の記事で上洛、2024年の記事で関東の大遠征と書く。『武徳編年集成』は信長と戦うつもりだった、とする
#   ④どうなったか：倒れて亡くなった。その死を伝える同じ時代の手紙は病を何と書いたか、の問いで閉じる（答えは本編の第4章）
title: 謙信の最後の出陣｜予定は3月15日だった
yt_title: 出陣の6日前、上杉謙信に何が起きたのか　3月15日の出陣は、関東か、京か、書き手で行き先が揺れる
description: |-
  1578年、天正6年の春。上杉謙信は、正月に、兵を集めよという陣触れを出し、3月15日を出陣の日と決めていた、と伝えられています。
  その行き先は、書き手によって揺れます。歴史家の乃至政彦さんは、2023年の記事では、京へ上る上洛の戦の準備中に倒れた、と書き、2024年の記事では、3月に関東への大遠征を計画していた、と書きました。江戸幕府の側の『武徳編年集成』は、15日に春日山を発って、信長と戦うつもりだった、としています。
  謙信は、酒を好みました。大正6年の伝記は、肴は選ばず、時には梅干しで、たっぷり飲んだ、と伝えています。
  そして、家の記録では、出陣の6日前の3月9日に、謙信は倒れ、4日後、49歳で亡くなりました。その死を伝える同じ時代の手紙は、病を、何と書いていたのか。本編は概要欄のリンクからどうぞ。
