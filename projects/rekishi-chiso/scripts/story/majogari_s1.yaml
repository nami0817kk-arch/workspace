  # fact: majogari-05（記録の日付）
- 語り: "記録の日付で、3月18日ごろ。ランカシャーの、コルンの近くの道で、アリゾン・デバイスという娘が、行商人のジョン・ローに、ピンを求めた。"
  shot: W02_2
