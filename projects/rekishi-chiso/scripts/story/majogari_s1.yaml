  pause: 0.12
  # fact: majogari-05
- 語り: "ロー本人の、法廷での証言では、ローは断った。その直後、ローは道に倒れ、体が、思うように動かなくなった。"
  shot: W04_3
  tone: 重い
  pause: 0.12
  # fact: majogari-06
- 語り: "訴え出たのは、ローの息子、エイブラハム。ハリファクスの、毛織物の職人だった。"
  shot: W05_4
  tone: しみじみ
  pause: 0.12
  # fact: majogari-06
- 語り: "ところが、息子の供述では、ローは、ピンを渡したことになっている。同じ場面が、記録によって、食い違う。"
  shot: W03_5
  tone: 強調
  pause: 0.12
  # fact: majogari-06
- 語り: "3月30日、エイブラハムは、治安判事の、ロジャー・ノーウェルの前で、訴えを述べた。治安判事は、国王から任された地元の役で、教会の人ではない。"
  shot: W06_6
  tone: しみじみ
  pause: 0.12
  # fact: majogari-07
- 語り: "4月2日ごろ、ノーウェルは、アリゾンと、祖母のデムダイクらを、ランカスター城へ送った。8月の巡回裁判まで、牢に留め置くためだった。"
  shot: W07_7
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第2〜3章（majogari-10 祖母は城で死ぬ・majogari-12 母・兄・アリゾンに死刑）
- 語り: "では、アリゾンの家族は、8月の法廷で、どうなったのか。"
  shot: W01_8
