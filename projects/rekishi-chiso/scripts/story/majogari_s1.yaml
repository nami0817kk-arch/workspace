# 理解テスト：①ペンドルの魔女裁判の始まりの話 ②1612年3月18日ごろ、コルンの近くの道でアリゾンが行商人ローにピンを求め、ローが倒れた
#   ③息子エイブラハムが治安判事ノーウェルに訴え、ノーウェルはアリゾンらを城へ送った ④8月の巡回裁判まで牢に留め置かれた
title: "ペンドルの魔女｜1本のピンから"
yt_title: "魔女裁判は、道で求められた1本のピンから始まった　1612年、イングランドのペンドルの魔女裁判の発端"
description: |-
  1612年、イングランド北西部のランカシャー。記録の日付で3月18日ごろ、アリゾン・デバイスという娘が、コルンという町の近くの道で、行商人のジョン・ローにピンを求めました。
  ロー本人の法廷での証言では、ローは断り、その直後に道に倒れて、体が思うように動かなくなりました。ところが、訴え出た息子エイブラハムの供述では、ローはピンを渡したことになっています。同じ場面が、記録によって食い違うのです。
  3月30日、エイブラハムは治安判事ロジャー・ノーウェルの前で訴えを述べ、4月2日ごろ、ノーウェルはアリゾンと祖母のデムダイクらを、ランカスター城へ送りました。
  記録は、裁判所の書記トマス・ポッツの『ランカシャーの魔女の驚くべき発見』（1613年）によります。日付は当時のイングランドの暦（ユリウス暦）のままです。
  本編では、この一件が、8月のランカスター城の法廷で10人への死刑の判決に至るまでと、魔女を裁いたのは誰だったのかを、記録でたどっています。本編は概要欄のリンクからどうぞ。
