# 理解テスト4問：①西郷隆盛の切腹の話 ②2010年、アメリカの歴史学者マーク・ラヴィーナの論文。西郷は銃弾で動けず従者に首を斬られたと見る ③切腹の話が定着したのは20世紀の初めと見る。参考文献に1900年の新渡戸『武士道』（死の23年後）。最期の言葉も紹介ごとに違う ④どれが正しいかは決められない。当日の電報は何と書いたか（本編へ）
title: "西郷隆盛｜切腹の話は、いつ生まれたのか"
yt_title: "西郷隆盛の「切腹」はいつ生まれた話か　ラヴィーナ論文と、死の23年後の『武士道』"
description: |-
  西郷隆盛は切腹した、という話は、いつ、生まれたのか。アメリカの歴史学者マーク・ラヴィーナは、2010年にアジア研究の学術誌に論文を出しました。
  論文の要旨は、西郷は銃弾で動けなくなり、従者に首を斬られたと見て、切腹の話が定着したのは20世紀の初めだとします。参考文献には、1900年に英語で出た新渡戸稲造の『武士道』があり、西郷の死の23年後です。最期の言葉も、紹介する本によって「ここでよか」「ここらでよか」「介錯をお頼み申す」と形が違います。
  論文は、要旨と参考文献表で確かめました（本文は読めていません）。最期の言葉は、徳富蘇峰『近世日本国民史』と井上清『西郷隆盛』（1970）を紹介する文章からで、原典の初出は確かめていません。どれが正しいかは、ここでは決められません。
  では、死んだ日の官軍の電報は、何と書いていたのか。本編は概要欄のリンクからどうぞ。
