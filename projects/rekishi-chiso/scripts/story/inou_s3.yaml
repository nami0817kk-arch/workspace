# 出どころは大谷亮吉『伊能忠敬』（1917）の翻刻を通した記述。原日記は未確認なので「大谷は書く」「日記には〜とある」と言う。奥宮正樹の読みは未確認のため名前は語らない。
# 絵は本編の AI 絵（out/story/inou/main。人物なし）と実在の絵（パブリックドメイン）。新しい絵は作らない。
# 切り口：先触れの一汁一菜が空文に終わった（本編3章）。三重県「御用留」の鰹節の話（inou-21、WebFetch の要約で読んだだけ）は使わない。
# 理解テスト4問：①伊能忠敬 ②1802年、通る村へ先触れ。一汁一菜と頼む ③宿賃を自分で決めて払う。それでも村の人は苦心して膳を整えた ④大谷は空文と書く。病気になったらどうせよと命じられたかは本編
title: "伊能忠敬｜「一汁一菜で」の頼みは通ったか"
yt_title: "伊能忠敬は宿に「一汁一菜で」と頼んだ　先触れの文面と、守られなかった理由"
description: |-
  1802年、享和2年。伊能忠敬は、通る村々へ前もって「先触れ」を送りました。大谷亮吉『伊能忠敬』に載る文面は、旧暦6月10日付。測量の道具を据える10坪ほどの場所がある宿を1軒用意すること、宿代は決まりの木賃とこめの代金を払うこと、そして「一汁一菜のほか、ご馳走めいたことは決してしないでください」。
  宿賃は忠敬が自分で決め、自分は1泊150文、弟子と侍は124文、小者は100文を払っていました（高橋至時の手紙）。ところが大谷は、先触れの一汁一菜は形だけの空文で、山間の僻地でも村の人は苦心して膳を整えた、と書きます。1814年の宮崎村で出された献立書も伝わるといいます。
  旅に出る前、師匠の至時は、旅の途中で病気になったら、どうせよと忠敬に命じたのか。本編は概要欄のリンクからどうぞ。
