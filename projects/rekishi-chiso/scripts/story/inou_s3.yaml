  # fact: inou-16
- 語り: "宿代は、決まりの木賃と、こめの代金を払います。ありあわせの品で、一汁一菜のほか、ご馳走めいたことは、決してしないでください。"
  shot: S04
  tone: 重い
  pause: 0.12
  # fact: inou-16
- 語り: "宿賃も、忠敬が決めていた。自分は1泊150文、弟子と侍は124文、小者は100文。"
  shot: S13
  tone: しみじみ
  pause: 0.12
  # fact: inou-18
- 語り: "ところが、大谷亮吉は書く。先触れの一汁一菜は、形だけの空文だった。山間の僻地でも、村の人は、苦心して、膳を整えた、と。"
  shot: P04
