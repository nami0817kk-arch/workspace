# 物語完結型ショート 黒船（もしも）s5（2026-10-31）。本編 scripts/kurofune-if-story.yaml（11/4 12:00 公開、https://youtu.be/QRZZXxHicQ4）から。切り口：ペリーの1か月半後に来たロシア（プチャーチン・下田の津波・ヘダ号・国境）
# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。津波は町と海の景色だけ・人は描かない（本編の決まり）。
# 絵は本編の AI 絵（out/story/kurofune-if/main/K01〜K15。人物は描かない）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/黒船_facts_20261031.yaml）：kurofune-if-60・61・62・63・64（本編 第6章の言い方のまま）
# ・計算のやり直し：ペリー 1853年7月8日（嘉永6年6月3日）→ プチャーチン 8月22日ごろ（嘉永6年7月18日）＝45日＝「約1か月半後」。
#   和暦も確かめた：6月3日＝7月8日なら6月1日＝7月6日、6月が30日の月なら7月1日＝8月5日、7月18日＝8月22日。本編と合う。
# ・交渉の開始 1854年12月22日、津波は翌日の12月23日（本編どおり）。下田の841戸・無事は高台の4戸（下田市の資料）。日露和親条約 1855年2月7日。
# ・「何十回も回転した、と伝わる」は尺のため外す。ヘダ号は Russian Life の記事と出どころを言う。
# 理解テスト4問：
#   ①誰の話か：ロシアのプチャーチンの艦隊
#   ②いつ・どこで何が：ペリーの約1か月半後の1853年8月22日ごろ長崎へ。1854年12月22日に下田で交渉を始め、翌日、津波
#   ③どうなったか：ディアナ号は沈み、日本の船大工が約2か月半でヘダ号を造った
#   ④結末：1855年2月7日に日露和親条約で国境を決めた。もしもペリーが来なかったら、を問いで閉じる
title: 黒船｜ペリーの1か月半後、ロシアも来ていた
yt_title: ペリーの約1か月半後にロシアのプチャーチンも来ていた　下田の津波とヘダ号
description: |-
  ペリーの約1か月半後、ロシアの艦隊も、日本に来ていました。
  プチャーチンの艦隊が長崎に着いたのは、1853年8月22日ごろ。ロシアには、ペリーに無い目的がありました。国境です。交渉は1854年12月22日に下田で始まり、その翌日、安政東海地震の津波が下田を襲います。下田市の資料によると、841戸が全壊・流出し、無事だったのは高台の4戸だけでした。ロシアの軍艦ディアナ号は、修理に向かう途中で沈み、日本の船大工が、ロシア人技師の図面をもとに、約2か月半で洋式の帆船ヘダ号を造った、と雑誌 Russian Life は書いています。1855年2月7日の日露和親条約で、択捉島は日本、得撫島から北の千島はロシアと決まりました。
  もしも、ペリーが来なかったら。最初に日本と条約を結んだのは、どの国だったのか。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
