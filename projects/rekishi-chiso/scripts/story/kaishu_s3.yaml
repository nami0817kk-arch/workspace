# 切り口：元老院議官の217日（本編第2章）。辞表→承認の間の出勤なしと給料、官職の外での千両。
# 計算：1875-04-25→1875-11-28＝217日（本編と同じ。A28）。
# 理解テスト4問：①勝海舟と元老院議官 ②1875年4月25日に議官に移され、27日に辞表、11月28日に承認。217日 ③出勤せず給料はもらい、政府に返すのも変だと考えた ④同じ年、商法講習所へ千両の援助を申し出た。そのあとの金の行方は本編
# 本編の弱点：315円と350両は別の日の記載で円と両の違いの意味は未確認（「とある」だけ言う）。A25 の「2年前の10月」は1873年10月25日。海軍卿の座談（A26）は「と語る」。辞表の理由（台湾出兵反対）は言わない。
title: "勝海舟｜辞表を出して、217日、出勤しなかった"
yt_title: "勝海舟は元老院議官の辞表を出してから217日、出勤しなかった　それでも給料は払われた"
description: |-
  1875年4月25日、勝海舟は元老院議官に移され、2日後の27日には辞表を出しました。承認されたのは11月28日で、移されてから数えて217日です。
  この間、海舟は引き籠って出勤しませんでしたが、給料は支払われ、「海舟日記」には5月29日に315円、6月17日に350両とあります。海舟は「政府に返すも変なものなり」と考えていました（髙橋秀悦の論文による）。
  同じ年の8月28日、海舟は商法講習所の資金難を聞き、森有礼へ千両の援助を申し出ています。円と両の表記の違いの意味は確かめられていません。
  官職を辞め続けた海舟の金は、このあと、どこへ向かったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/KIXtgjggYl0
