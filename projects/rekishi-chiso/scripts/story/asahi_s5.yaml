# 物語完結型ショート asahi_s5（2026-10-26）。投稿しない（ユーザーが動画を見てから）。形式は oichi_s10〜s14 を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 本編 scripts/asahi-story.yaml の切り口⑤：旭の死は伏せられた
# 事実カード：dev/output/rekishi-chiso/research/旭姫_facts_20261026.yaml
#   asahi-05（天正18年1月14日、聚楽第で48歳で亡くなる。岡崎市史・渡辺世祐・烈祖成績）／
#   asahi-16（『当代記』「家康公妻室於京都病死給。小田原爲出勢比之間令隱密」）／asahi-48（家康は葬儀のために上洛しなかった）／
#   asahi-50（翌日、12歳の秀忠が聚楽に上がり、大政所が自分の手で秀忠の髪を結い直したと伝わる。『烈祖成績』＝江戸時代の編纂物、出どころ1つ）／
#   asahi-06（東福寺の南明院に葬られた）／asahi-26（南明院は通常非公開。2021年秋の京都非公開文化財特別公開で初めて公開、旭の肖像画と秀忠の書状が並んだ）
# 亡くなった場所は聚楽第とする書が多い（『雍州府志』は伏見＝asahi-17）。ここでは「京で」と言い、場所の食い違いには触れない（筋に要らない）。
# 理解テスト4問：
#   ①誰の話か：旭（豊臣秀吉の妹で、徳川家康の妻）
#   ②いつ・どこで何が：天正18年1月14日、京で48歳で亡くなった。秀吉の小田原攻めのため、徳川の側は死を隠した（『当代記』）
#   ③家康・大政所は何をしたか：家康は葬儀のために京へ上らなかった。翌日、母の大政所は、家康の子・12歳の秀忠の髪を自分の手で結い直したと伝わる
#   ④どうなったか：旭は東福寺の南明院に葬られ、その寺は2021年の秋に初めて公開され、旭の肖像画が並んだ
title: 旭姫｜その死は、戦の前の秘密にされた
yt_title: 家康の妻・旭姫の死は、小田原攻めの前に伏せられた【旭姫と大政所】
description: |-
  天正18年1月14日、豊臣秀吉の妹で徳川家康の妻、旭は、京で48歳で亡くなりました。
  秀吉が関東の北条を攻める小田原攻めの前で、『当代記』は、小田原へ兵を出すころだったので隠しておかれた、と書いています。家康が葬儀のために京へ上ることはありませんでした。
  旭が亡くなった翌日、母の大政所は、家康の子で12歳の秀忠の髪を、自分の手で結い直したと伝わります。
  旭は京都の東福寺の南明院に葬られました。ふだん公開されていないこの寺が初めて公開されたのは、2021年の秋です。
