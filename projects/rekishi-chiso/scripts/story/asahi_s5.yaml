  - 語り: 秀吉が、関東の北条を攻める、小田原攻めの前だった。
    # fact: asahi-16
    shot: K05w
    tone: しみじみ
    pause: 0.12
  - 語り: 『当代記』という記録は、こう書く。家康公の奥方が、京で病で亡くなった。小田原へ兵を出すころだったので、《隠しておかれた》。
    # fact: asahi-16
    shot: K04w
    tone: しみじみ
    pause: 0.15
