# 物語完結型ショート 和宮 s1（2026-10-29）。本編 scripts/kazunomiya-story.yaml の導入とまとめ（棺のガラス板・写っていたのは誰か）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazunomiya/main/W*.jpg・TKK）と実在の肖像。
# 事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml）：kazunomiya-01・28・29・30・05
#   ・ガラス板の話は山村竜也（Yahoo!ニュース エキスパート 2022）の紹介 → 語りで山村さんの名と年を言う。像が消えたのは「数日のうちに」（「翌日」とは言わない）。
#   ・熾仁親王説も同じ記事の紹介（kazunomiya-29）→「という見方」まで。どちらにも寄せない。
#   ・墓・棺・遺骨の中は描かない絵だけ（W01 は発掘の遠景、W02 は布の上の板と手、TKK は灯の前でガラス板を見る女性）。
# 理解テスト4問：
#   ①誰の話か：和宮（孝明天皇の妹・将軍家茂の妻）
#   ②いつ・どこで何が：1958年、増上寺の発掘で、和宮の棺の胸元にガラス板（写真の原板）が見つかった
#   ③何が見えたか：一晩調べた美術史の学者には、烏帽子の17、8歳の男性＝家茂らしい顔が見えた
#   ④どうなったか：像は数日で消えた。家茂には写真の記録が無く、婚約者だった熾仁親王ではという見方もある。確かめる手立ては無い
title: 和宮｜棺のガラス板に写っていたのは誰か
yt_title: 皇女和宮の棺から出たガラス板　写っていた男の姿は、数日で消えた
description: |-
  昭和33年、1958年。東京の増上寺で、徳川将軍家の墓が掘り返されました。皇女和宮の棺の中、白骨になった胸元に、一枚のガラス板が残っていました。写真の原板だったとされます。
  歴史作家の山村竜也さんが2022年の記事で紹介した話では、美術史の学者が一晩かけて板を調べ、烏帽子をかぶった17、8歳の童顔の男性、夫の将軍家茂らしい顔が、かすかに見えたといいます。
  ところが、その像は数日のうちに消えてしまいました。家茂には写真を撮った記録が無いため、かつての婚約者、有栖川宮熾仁親王ではないか、という見方もあります。
hashtags: ["#和宮", "#日本史", "#幕末"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
