    shot: W02r
    tone: しみじみ
    pause: 0.12
  # fact: kazunomiya-28
  - 語り: かすかに見えたのは、烏帽子をかぶった、17歳か18歳ほどの男性。夫の将軍、家茂らしい顔だった。
    shot: Iemochi
    tone: 強調
    pause: 0.12
  # fact: kazunomiya-01, kazunomiya-28
  - 語り: ところが、その像は、数日のうちに薄れて、《!消えてしまった》。見たのは、数人の関係者だけ、と伝わる。
    shot: W02d
