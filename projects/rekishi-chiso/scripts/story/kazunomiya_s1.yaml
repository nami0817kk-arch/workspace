lines:
  # fact: kazunomiya-01, kazunomiya-28
  - 語り: 将軍の妻になった皇女、和宮。その棺のガラス板に写っていた男の姿は、数日で、《!消えた》。
    shot: W02f
    tone: 強調
  # fact: kazunomiya-30
