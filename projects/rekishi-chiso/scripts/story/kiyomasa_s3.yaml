lines:
  # fact: kiyomasa-17, kiyomasa-18
- 語り: "加藤清正は、最期に、遺言を残したのか。2つの記録が、正反対のことを書いている。"
  shot: K12_1
  tone: 強調
  pause: 0.12
  # fact: kiyomasa-14
- 語り: "1611年、二条城の会見のあと、清正は、船で熊本へ帰る。"
  shot: K09_2
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-40
- 語り: "江戸時代の前半にまとめられた一代記、『清正記』は書く。熊本へ帰る船の中から、熱病を患った。"
  shot: K10_3
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-18
- 語り: "あとで書かれた、『続撰清正記』は、もっと細かい。熊本の城に着いて、2日か3日たつと、舌が不自由になった。"
  shot: K11_4
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-18
- 語り: "そして、もう、ひと言も、話すことができなくなった。"
  shot: K10_5
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-17
- 語り: "ところが、一代記の方には、遺書を残し、家臣たちに遺言を伝える、清正の場面がある。"
  shot: K12_6
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-18
- 語り: "『続撰清正記』は、それを否定する。口がきけなかったのだから、遺言は無かった。"
  shot: K15_7
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-18
- 語り: "書き役の家臣に、遺書を書かせたというのは、大きなうそだ。"
  shot: K15_8
  tone: 強調
  pause: 0.12
  # fact: kiyomasa-17, kiyomasa-22
- 語り: "6月24日、丑の刻、今の夜中の2時ごろ。清正は、熊本で息を引き取った。数えで50歳。"
  shot: K11_9
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第3章（kiyomasa-07・38・40・49・50）
- 語り: "では、清正の病は、何だったのか。"
  shot: K03_10
  tone: 疑問
  pause: 0.15
