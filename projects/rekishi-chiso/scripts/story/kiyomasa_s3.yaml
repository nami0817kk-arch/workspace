# 理解テスト：①加藤清正の最期の話 ②1611年、熊本へ帰る船と熊本の城で ③口がきけなくなり、遺言の有無は記録で割れる ④6月24日、熊本で亡くなった
title: "加藤清正｜口がきけなくなった最期"
yt_title: "加藤清正は遺言を残したのか　熊本に着いて2日か3日で口がきけなくなった、と書く記録と、遺言の場面を書く記録"
description: |-
  1611年、二条城の会見のあと熊本へ帰った加藤清正。江戸時代の前半にまとめられた『清正記』は、帰りの船の中から熱病を患い、清正は遺書を残して家臣に遺言を伝えた、と書きます。
  一方、『続撰清正記』は、熊本の城に着いて2日か3日で舌が不自由になり、ひと言も話せなくなった、だから遺言は無く、遺書を書かせたというのは大うそだ、と否定しています。清正は6月24日、熊本で亡くなりました。
  本編では、清正の病の名が当時の記録にあるのか、毒の話はいつ広まったのかを、記録ごとに並べています。本編は概要欄のリンクからどうぞ。
