  - {type: quote, from: 65, to: 65, label: 史料, text: 役の名を付けて畳の数・厚さ／居場所の広さを自由にしてきた, source: 牢内掟書（1777年12月、『古事類苑』所引。今の言葉に）}
  - {type: quote, from: 128, to: 128, label: 史料, text: 殊の外安楽世界にて／大いに喜び申し候, source: 吉田松陰の手紙（1859年、『吉田松陰全集』）}
  - {type: quote, from: 134, to: 134, label: 史料, text: 身はたとひ武蔵の野辺に朽ちぬとも／留め置かまし大和魂, source: 吉田松陰『留魂録』（1859年10月25日）}

