# 物語型の本編（横 16:9）の見た目と絵の割り当て：江戸の牢屋敷（scripts/rouyashiki-story.yaml）。chiso/storymain.py が読む。
# 11-20 作成（11/26 12:00 公開）。nagaya_if_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini、11-20）。T01・B01〜B24 はこの回のために作った（out/story/rouyashiki/main/<名>.jpg）。サムネは TH1（明るい版）。
#   1850年ごろの江戸。牢の格子は太い角材の木（鉄格子にしない）。実在の人物の顔は描かない（松陰は後ろ姿の B16）。血・傷・刑の場面は描かない。
#   B07（役人の書院）は偽の紋とガラス窓が出たので使わない（作り直しは Gemini の上限で 11-20 にできなかった）。
