# 物語完結型ショート 源頼朝 s4（2026-10-30）。本編 scripts/yoritomo-story.yaml から（京都の日記は「急な病」・鎌倉は落馬という食い違い）。11/2 12:00 公開の本編 → 11/3 に投稿。
# 形式は musashi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「頼朝想像」「重成想像」は使わない）。
# 絵は本編の AI 絵（out/story/yoritomo/main/Q01〜Q15。人物は描かない）と実在の絵・写真（paintings/yoritomo_*）。新しい AI 絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/源頼朝_facts_20261029.yaml）：yoritomo-07・12・15・45（明月記1/20・2/18、愚管抄は一次史料の翻刻）
#   ・愚管抄・明月記の引用は個人サイトの翻刻（本文を開いた。12・15・45）。出どころ1つのもの（12・45）は「と書く」で言う。
#   ・「落馬という言葉が京都の記事に無い」は「私たちが開いた京都の記事に」と限定して言う（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：源頼朝の死と、京都の日記・鎌倉の歴史書
#   ②いつ・どこで何が：1199年1月、京都の『愚管抄』『明月記』は、11日出家・13日に亡くなったと書く。13年後に鎌倉の『吾妻鏡』が落馬を書く
#   ③何と書いたか：定家は「おおよそ急な病か」と推測。京都の記事に落馬という言葉は無かった
#   ④どうなったか：京都では病、鎌倉では落馬。同じ死が2つの姿で残った
title: 源頼朝｜京都の日記は《急な病》、鎌倉の歴史書は《落馬》
yt_title: 源頼朝の死　京都の日記は急な病、鎌倉の歴史書は落馬　食い違う記録
description: |-
  同じ人の死を、京都と鎌倉は、違う言葉で書きました。
  1199年1月。慈円の『愚管抄』は、源頼朝が1月11日に出家して、13日に亡くなった、と書きます。藤原定家の『明月記』、1月20日の条は「前の将軍、去る11日に出家、13日に入滅（大略頓病か）」。定家は、急な病と推測しました。2月18日には、院の御所の御読経が、もっぱら頼朝の追善だったとも書いています。
  調べた京都の記事に、落馬という言葉はありませんでした。落馬が出てくるのは、13年後、1212年の鎌倉。『吾妻鏡』の、橋の修理の記事の中です。
  本編では、京都の日記と鎌倉の記事を並べて読んでいます。
