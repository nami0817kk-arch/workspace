#   ・結びの「2009年に発見が発表された」は sosou-03（中国新聞網ほか2件）。墓の認定には異論があるので「見つかったと発表された」と留める。
# 理解テスト4問：
#   ①誰の話か：曹操の息子、魏の皇帝になった曹丕の「終制」
#   ②いつ・どこで何が：222年10月、曹丕が自分の墓について終制を書いた（『三国志』文帝紀）。「掘られなかった墓はない」
#   ③何を選んだか：金銀銅鉄を入れず器は瓦にし、場所を知られないようにする。背けば地下で屍を斬られると言う
#   ④どうなったか：曹操の高陵は、2009年に見つかったと発表された
title: 曹丕｜掘られなかった墓は、ない
yt_title: 曹操の息子・曹丕「掘られなかった墓は、ない」　自分の墓に金銀銅鉄を入れなかった理由
description: |-
  「昔から今まで、滅びなかった国はなく、掘られなかった墓も、ない」。曹操の息子で、魏の皇帝になった曹丕は、そう書きました。
  『三国志』の文帝紀によれば、222年10月、曹丕は自分の墓について「終制」という文を書きました。世が乱れて以来、漢の皇帝たちの墓は掘られないものがなく、玉の箱や金の糸を焼いて取るほどで、骨まで尽きた、とあります。
  終制は、昔の2人の皇帝を引きます。漢の文帝の陵が掘られなかったのは、求めるものが無かったから。後漢の光武帝の陵が掘られたのは、土を盛り、木を植えて、目立つ墓にしたから。そして曹丕は、自分の墓には金銀銅鉄を入れず、器は瓦にし、代が替わったあとも場所を知られないようにしたい、と述べます。
  曹操の高陵が見つかったと発表されたのは、2009年のことでした。
