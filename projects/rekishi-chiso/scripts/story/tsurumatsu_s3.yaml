# 物語完結型ショート 鶴松 s3（2026-11-06）。本編 scripts/tsurumatsu-if-story.yaml（11/7 12:00 公開）の序章・第2章（1591年8月の死）から。11/8 13:30 公開。
# 形式は maizo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/tsurumatsu-if/main/T*）と本編で使った実在の屏風だけ。T07・T08・T29・T30 は使わない（s1 の頭のとおり）。
# 切り口：鶴松の死の知らせ（毛利輝元の6日付の手紙）と、秀吉と大名たちが髻を切り、切った髻が塚のようになったこと（『三藐院記』）。
#   遺品（小さな鎧・兜はいま妙心寺、おもちゃの船は玉鳳院。重要文化財）。本編の答え（18日後の明への出兵の決定）は言わない。
# 事実カード：tsurumatsu-03・04・15・16・17・28・34。言い方は本編のまま。
# 計算（自分で計算し直した）：天正19年＝1591年。1589年5月27日→1591年8月5日で2年2か月あまり、数えで3歳。
#   『多聞院日記』の6日条は伝え聞き、8日条が東福寺と髪切りの記事（本編どおり、毛利輝元の手紙とは分けて言う）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀吉の跡継ぎ、鶴松と、秀吉・大名たち
#   ②いつ・どこで何が：1591年8月5日、鶴松が数え3歳で死に、秀吉は京都の東福寺で髻を切った
#   ③何をしたか：大名たちも人に負けじと髻を切り、切った髻が塚のようになった（『三藐院記』）
#   ④どうなったか：弔う寺・祥雲寺の工事が8月のうちに始まり、遺品はいまも京都の寺に残る。18日後の決定の問いで閉じる
title: 鶴松の死｜大名たちは、髻を切った
yt_title: 豊臣秀吉の跡継ぎ鶴松が3歳で死んだ日、大名たちは髻を切った　切った髻は塚のようになったと公家の日記
description: |-
  1591年8月5日、豊臣秀吉の跡継ぎ、鶴松が亡くなりました。数えで3歳でした。
  毛利輝元が翌6日に一族の吉川広家へ書いた手紙には、若君様は昨日5日に亡くなられた、どうにもならないことです、とあります。秀吉はすぐに京都の東福寺へ出て、髻、つまり頭の上で結った髪を切りました。奈良の興福寺の僧、英俊の『多聞院日記』は、8日の記事に、大名も小名も、みな切ったそうだ、と書きます。公家の日記『三藐院記』によると、大名たちは人に負けじと髻を切り、切った髻は、塚を築いたようになりました。
  8月のうちに、鶴松を弔う寺、祥雲寺の工事が始まります。鶴松の小さな鎧と兜は妙心寺に、おもちゃの船は妙心寺の中の玉鳳院に残り、今は国の重要文化財です。
  もしも鶴松が生きていたら、豊臣家はどうなったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#豊臣鶴松', '#豊臣秀吉', '#日本史']
