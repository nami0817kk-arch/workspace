title: "義経｜泰衡は、討っても許されなかった"
yt_title: "泰衡は義経を討っても許されなかった　頼朝に投げ入れた書状「これは勲功ではないか」"
description: |-
  1189年閏4月30日、藤原泰衡は衣川の館で義経を襲いました。吾妻鏡は、朝廷の命令と頼朝の指示に従ったのだ、と記します。それでも頼朝は軍を進め、8月26日、泰衡は頼朝の宿に書状を投げ入れます。義経は亡き父がかくまっていた者で、自分は父の死後、命を受けて討った。これは手柄ではないか。罪もないのに、なぜ征伐されるのか。御家人に加えてほしい、それがだめなら死罪を減じて遠くへ流してほしい、と。
  頼朝は、返事を置いた所へ来る者を捕らえる案を退け、兵に郡の中を捜させました。9月3日、泰衡は家来の河田次郎に比内郡で討たれます。義経の死から、およそ4か月です。大石直正さんは、泰衡は頼朝の強請で義経を殺したが許されなかった、と書きます。
  吾妻鏡の1185〜89年の本文は、読み下し文で確かめたものです。原文との照合は行っていません。
  もしも泰衡が義経を討たなかったら、平泉は無事だったのか。本編は次のリンクからどうぞ。
