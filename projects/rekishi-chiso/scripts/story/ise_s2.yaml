# 切り口：伊勢まで16日の1日ずつの出費、いちばん高い日といちばん安い日（本編 第2章・第3章・第5章、ise-01・54・56）。
# hook＝16日でいちばん高い日はいくらか（答えはこのショートの中：5日目 吉原〜久能山 1,009文）。
# tease＝江戸の豪商は1日にいくら使ったか（答えは本編 第2章：紀伊国屋長三郎、1日平均およそ714文、ise-03）。
# 計算（数え直した）：16区間の合計 7,048。1文＝10,000÷585＝17.09円。275文＝4,701円→4,700円ほど。1,009文＝17,248円→約1万7千円。
#   169文＝2,889円→2,900円ほど。1,009÷169＝5.97→6分の1ほど。7,048÷585＝12.05→12日分。7,048×17.09＝120,479→約12万円。
# 理解テスト：①伊勢参りの農民の1日ずつの出費の話 ②1845年、東海道から伊勢までの16日 ③宿場ごとに出費を書き残し、5日目の1,009文がいちばん多く、16日目の169文がいちばん少ない ④16日で7,048文、目安で約12万円
title: "伊勢参り｜いちばん高くついた日"
yt_title: "伊勢参りの16日で、いちばんお金を使った日は1,009文　いちばん安い日の6倍ほど　1845年の農民の書き留めから"
description: |-
  1845年の正月、今の世田谷区の村を出た農民、田中国三郎は、伊勢までの16日間に使ったお金を、宿場ごとに書き残しています。東洋大学の谷釜尋徳さんが、論文で区間ごとの額を一覧にしています。
  1日目は戸塚まで275文。いちばん多いのは5日目、吉原から久能山までの1,009文。いちばん少ないのは16日目、津から伊勢までの169文。16日を合わせて7,048文、江戸の大工の日当を今の1万円とする目安で、およそ12万円です。
  本編では、宿代・食べ物・草鞋・川を渡る代金の内訳と、伊勢で待つ御師の宿まで、1日ずつたどっています。本編は概要欄のリンクからどうぞ。
