# 物語完結型ショート 伊達政宗 s5（2026-10-29）。本編 scripts/masamune-story.yaml の第5章（1945年の焼失・1974年の発掘・2019年・2021年）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/masamune/main/M*.jpg・TKM）。
#   この回の決まり：AI 絵の政宗に眼帯は無い。右目が見えている絵の切り出しを作らない（M01 は使わない。M09 は左の横顔だけ）。
#   骨・亡骸は「骨」まで。棺の中・穴の中は見せない（M11 は穴の手前の調査員、M10 は焼け跡の石段）。
# 事実カード（dev/output/rekishi-chiso/research/伊達政宗_facts_20261028.yaml）：masamune-59・13・50・01・61・02・03・04・60・09・63・89
#   ・骨を調べたのが鈴木尚さんたちなのは出どころが1つ（masamune-61）→「と伝えられる」。
#   ・2019年の 2.5ミリと「証明された」は瑞鳳殿の紹介（masamune-59）→ 瑞鳳殿の名を言う。
#   ・2021年の顔が両目とも開いているとは出どころに無い（義眼を入れた、まで。masamune-63）。
#   ・伊達泰宗さんの悩みは2021年の取材（masamune-89）。
# 理解テスト4問：
#   ①誰の話か：伊達政宗の骨と右目
#   ②いつ・どこで何が：1945年の仙台空襲で瑞鳳殿が焼け、建て直しのために1974年に墓が調べられた
#   ③何が分かったか：発掘まもなくの調べでは目のくぼみに傷は無く、片目は証明できなかった。2019年、国立科学博物館の調べで目のくぼみの高さが左右で2.5ミリ違うと分かった
#   ④どうなったか：瑞鳳殿は片目が頭の骨からも証明されたとする。2021年に作り直された顔にも義眼が入れられ、伊達家18代の泰宗さんは片目の顔なら政宗像が壊れるのではと悩んだ
title: 伊達政宗｜骨は、右目を覚えていた
yt_title: 伊達政宗の骨に残っていた2.5ミリの差　墓の発掘から45年目に分かった右目のこと
description: |-
  1945年7月10日の仙台空襲で、伊達政宗の墓の上に建つ瑞鳳殿は焼けました。1974年、建て直しに合わせて、伊達家の許しを得て、墓の地下が調べられます。
  骨を調べたのは東京大学の鈴木尚さんたちと伝えられます。身長はおよそ159.4センチ、血液型はB型。ただ、頭の骨の目のくぼみに傷は無く、片目だったことは証明できませんでした。
  2019年、国立科学博物館の調べで、目のくぼみの高さが左と右で2.5ミリ違うことが分かります。瑞鳳殿は、失った右目のまわりの骨が育つのをやめたためだろうとし、片目だったことが頭の骨からも証明された、としています。
  2021年、政宗の顔が作り直され、義眼が入れられました。伊達家18代当主の伊達泰宗さんは、片目の顔として作られたら、今までの政宗像が壊れてしまうのでは、と悩んだと明かしています。
