  # fact: senhime-10
- 語り: "1616年の江戸。イギリス商館長、コックスの日記に、その騒ぎが書き留められている。"
  shot: R14_2
  tone: しみじみ
  pause: 0.12
  # fact: senhime-10, senhime-09
- 語り: "坂崎は、明日嫁ぐ千姫を、途中で奪ってみせる、と言った。千姫の嫁ぎ先は、本多忠刻に決まっていた。"
  shot: S06_3
  tone: しみじみ
  pause: 0.12
  # fact: senhime-11
- 語り: "コックスが聞いた話では、坂崎は家臣1000人と屋敷に立てこもり、1万あまりの兵が、それを囲んだ。"
  shot: S04_4
  tone: 重い
  pause: 0.12
  # fact: senhime-12
- 語り: "『東武実録』では、坂崎が酒に酔って、蔵で寝ている間に、家臣が蔵の口を閉じた。坂崎は、最後は自ら命を絶った。"
  shot: R10_5
  tone: 重い
  pause: 0.12
  # fact: senhime-12
- 語り: "『元和年録』では、柳生宗矩が家老たちに話をつけた。坂崎は、行水をしていたところで、命を落とした。"
  shot: R03_6
  tone: 重い
  pause: 0.12
  # fact: senhime-13
- 語り: "『元寛日記』では、老臣の遠藤が、主の首を斬って差し出した。その遠藤も、首をはねられた。"
  shot: S05_7
  tone: 重い
  pause: 0.12
- 語り: "同じひとつの死が、蔵での自害にも、行水の場にも、家臣の裏切りにもなっている。"
  shot: S04_8
  tone: しみじみ
  pause: 0.12
