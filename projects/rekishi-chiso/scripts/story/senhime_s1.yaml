title: "坂崎出羽守｜千姫の輿を奪うと言った大名の最期"
yt_title: "坂崎出羽守の最期は、記録で3つに割れる　千姫の輿を奪うと言い放った大名"
description: |-
  1616年、江戸。千姫の嫁入りの輿を、途中で奪ってみせる、と言い放った大名がいました。石見の津和野の城主、坂崎出羽守、直盛です。
  イギリス商館長コックスの日記によれば、坂崎は家臣1000人と屋敷に立てこもり、1万あまりの兵がそれを囲みました。
  ところが、坂崎がどう死んだのかは、『東武実録』『元和年録』『元寛日記』で、まるで違います。蔵での自害、行水の場、家臣の裏切り。
  本編では、坂崎が千姫を奪おうとした理由が記録でどう分かれるかと、千姫の50年をたどっています。本編は概要欄のリンクからどうぞ。
