# 物語型の本編の見た目と絵の割り当て：井伊直弼と桜田門外の変（scripts/ii-naosuke-story.yaml）。chiso/storymain.py が読む。
# 11-18 作成（11/23 12:00 公開予定）。tsukiyama_main_look.yaml を写した。絵は Gemini（Chrome、写実の油彩）。人の顔・血・遺体は描かない。
# 時代：1860年の江戸。桜田門は石垣と高麗門・渡櫓門（天守は描かない）、雪、黒漆の駕籠、合羽と笠の供。近代の物は描かない。
