parts:
- {type: quote, from: 12, to: 12, label: 史料, text: 三日早朝愛宕に会申候／有村治左衛門先到着一同驚き申候, source: 『桜田紅雪録』浪士の供述の書き留め（国立国会図書館デジタル）}
- {type: quote, from: 35, to: 35, label: 要点, text: 浪士の話／引き出したときには、もう事切れていたように見えた, source: 『桜田紅雪録』（彦根の松井貞之進の話と並ぶ）}
- {type: quote, from: 37, to: 37, label: 史料, text: 接戦中は時計三分斗ニ而／至而早く相済申候, source: 『堤蟻叢書』の書き留め（国立国会図書館デジタル）}
- {type: quote, from: 44, to: 44, label: 史料, text: ヒストンノ玉、胸先ニ中リテ死シ, source: 安達清一郎の日記『万延元年庚申日乗』（鳥取県立博物館）}
- {type: versus3, from: 48, to: 48, items: [[安達清一郎の日記, 胸先], [よく知られた話, 太ももから腰]], every: 2.5}
- {type: quote, from: 68, to: 68, label: 要点, text: 担当の2人が仮の条約書に調印した／よんどころない場合だった, source: 井伊直弼の書状（国立国会図書館の翻刻）}
- {type: quote, from: 85, to: 85, label: 要点, text: 勅許なく条約を結んだ／忠義の人を罪に落とした／将軍の幼さにつけこんだ, source: 浪士の『斬奸趣意書』（『水戸藩史料』所収）}
- {type: quote, from: 91, to: 91, label: 要点, text: 取り押さえの指図をするうちに／少々けがをしたので、ひとまず帰宅, source: 井伊家の届（和歌山県立文書館「前代未聞之珍事」の翻刻）}
- {type: versus3, from: 94, to: 94, items: [[井伊家の届, その場で4人], [村田蔵六の手紙, その場で6人]], every: 2.5}
