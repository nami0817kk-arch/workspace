title: "江戸の牢屋敷｜新入りが隠したお金"
yt_title: "江戸の牢の新入りは、禁じられたお金を体に隠して持ち込んだ　「ツル」の多い少ないで牢の中の扱いが変わった"
description: |-
  江戸の小伝馬町の牢屋敷。牢に入る日、鍵役は「金銀や刃物や書物や火道具は、持ち込んではならぬぞ」と申し渡し、着物も髪もほどいて改めました。
  それでも新入りは、お金を持ち込みました。ツル、つる金と呼ばれます。持ち込んだツルは牢名主に差し出され、五番役までの役付きで分けられました。ツルの多い少ないで、牢の中の扱いは大きく変わりました（尾佐竹猛 述『牢獄秘録』）。『古事類苑』の概説にも、ツルを持ってこない者はこき使われる悪い習わしがあった、とあります。
  本編では、江戸の牢屋敷の暮らしを、入る所から出る所までたどっています。本編は概要欄のリンクからどうぞ。
