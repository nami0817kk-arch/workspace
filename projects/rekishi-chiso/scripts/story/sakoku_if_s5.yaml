title: "徳川家康｜メキシコへ貸した船は、返ってこなかった"
yt_title: "徳川家康がメキシコとの商いのために貸した船は、返ってこなかった　御宿の沖の座礁から始まった、太平洋の夢"
description: |-
  1609年9月30日の夜、スペインの大型の帆船が、今の千葉県御宿町の沖で座礁しました。家康は、帰国するビベロに、ウィリアム・アダムスが造った西洋式の帆船と、4,000ドゥカドを貸します。
  1610年8月1日、その船は田中勝介ら20人あまりの日本人を乗せて浦賀を出ました。ところがメキシコの側は、船を返さないと決めます。
  本編では、このあと幕府が外国の船を3回に分けて締め出した分かれ目を、「もしも」とあわせてたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/7dL7AYzb7zI
