# 理解テスト：①篤姫と勝海舟の話 ②明治の東京、八百善・向島の柳屋・吉原・芸者屋 ③海舟に「私の姉」として連れ出され、町の暮らしを見た ④浴衣・シャツ・こうもり傘を自分で取り入れ、羽織を縫って贈るようになった
title: "篤姫｜勝海舟と、料理屋へ"
yt_title: "勝海舟は、元将軍の妻の篤姫を何と呼んで、料理屋や芸者屋へ連れ出したのか　浴衣・シャツ・こうもり傘の明治"
description: |-
  勝海舟は、晩年の談話『海舟座談』で、篤姫（天璋院）の用で、八百善に二、三度、向島の柳屋へも2度、吉原にも芸者屋にも行って、町の暮らしを見せた、と語っています。連れて歩くとき、海舟は篤姫を「私の姉」と言っていました。
  湯を羽二重でこしていたお風呂は浴衣に、シャツを見ればすぐに着て、こうもり傘は日傘よりいい。のちには自分で縫い物もして、海舟に羽織を1枚くれたそうです。
  本編では、城を出たあとの15年あまりを、当時の新聞・勝海舟の談話・昭和の本でたどっています。本編は概要欄のリンクからどうぞ。
