# 計算：旧暦1806年9月14日。
# 理解テスト4問：①伊能忠敬の測量隊 ②1805年から幕府直轄、1806年に破門 ③忠敬が病で見られない間に弟子の規律が乱れ、幕府の耳に届いた ④弟子2人破門。大谷は忠敬の失敗と書く。薩摩の話は本編
title: "伊能忠敬の測量隊で、弟子が二人、破門された"
yt_title: "伊能忠敬の測量隊では、弟子が二人破門された　1806年、隊の乱れと忠敬の失敗"
description: |-
  1805年、文化2年から、伊能忠敬の測量は幕府の直轄になり、隊には天文方の下役も加わりました。大谷亮吉『伊能忠敬』によれば、同じ測量でも肩書に差が生まれ、弟子の平山郡蔵は、腕が立ち、新しい下役をしのぐような態度をとることもあったといいます。隊には不和が生まれ、そのさなか、忠敬は防長のあたりで病に倒れました。
  隊長が仕事を見られないあいだに、弟子の規律は乱れます。宿で酒宴を開く、書画や骨董をほしがる、買った品に相応の代金を払わない。沿道の村人が迷惑しているという噂は、幕府の耳にも届き、1806年9月14日（旧暦）、幕府は忠敬に部下を厳しく戒めさせました。江戸に戻ると、平山郡蔵ともう1人は破門。大谷は、部下をまとめきれなかった失敗は、忠敬の生涯でこの時を除いてほとんど見られない、と書きます。
  薩摩では、傘の中に測器を隠して測った、という話は、本当なのか。本編は概要欄のリンクからどうぞ。
