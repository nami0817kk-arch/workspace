# 理解テスト4問：①誰の話か＝淀殿（茶々）と秀吉の手紙 ②いつ・何が＝文禄2〜5年ごろ、灸をすえた茶々に秀吉が秋刀魚を送った。1938年のあと行方不明、2017年に79年ぶりの発見として公表 ③何がどう違う＝その200年ほどのち、絵本は茶々を蛇の性の女に描いた ④どうなった＝手紙の中の茶々は体を心配される一人の女性
title: 淀殿｜秀吉が送った、秋刀魚の手紙
yt_title: 淀殿に秀吉が送った手紙には、「秋刀魚を送ったから食べなさい」とあった
description: |-
  豊臣秀吉が、のちの淀殿、茶々に送った手紙には、こうあります。灸をすえたと聞いて、体を心配した。秋刀魚を送ったから、食べなさい。宛名は「おちゃちゃ」。
  和樂webの記事によれば、手紙が書かれたのは文禄2年から5年ごろ。1938年に東京大学が調べたあと行方が分からなくなり、2015年に兵庫県の商家から知らせがあって、2017年に79年ぶりの発見として公表されました。秀吉の自筆の手紙は約60通、淀殿あては5通で、「茶々」と名で呼んだものは3通だけだと報じられています。
  それから200年ほどのち、江戸時代の大坂の絵本『絵本太閤記』は、淀君を、口が耳まで広がった蛇の性の女として描きました。
