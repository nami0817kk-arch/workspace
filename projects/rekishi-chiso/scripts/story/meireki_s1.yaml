lines:
  # fact: meireki-C01, meireki-A07
- 語り: "江戸城の天守は、明暦の大火で、1657年に焼け落ちた。幕府が、もう建てないと決めたのは、燃えた日では、ない。"
  shot: K01_1
  tone: 強調
  pause: 0.12
  # fact: meireki-C01, meireki-C04
- 語り: "大火から、2年7か月あまりあと。しかも、天守を載せるための、石垣の土台は、その前に、できていた。"
  shot: K02_2
  tone: 重い
  pause: 0.12
  # fact: meireki-C04
- 語り: "加賀藩の前田綱紀が、石垣を命じられたのは、大火の年の9月27日。1658年10月9日には、石垣が成った。"
  shot: K19_3
  tone: しみじみ
  pause: 0.12
  # fact: meireki-C01
- 語り: "建てないと決まったのは、1659年9月1日。老中たちが、天守も造ろうと相談した席で、保科正之が、反対した。"
  shot: K22_4
  tone: 重い
  pause: 0.12
  # fact: meireki-C02
- 語り: "寛政重脩諸家譜は、正之の言葉を、こう伝える。天守は、戦の役に立たず、遠くを見るだけのものだ。人の力を、費やしてはならない、と。"
  shot: K13_5
  tone: しみじみ
  pause: 0.12
  # fact: meireki-C03
- 語り: "別の記録は、こう伝える。武家も町家も、家を建てている最中だ。工事が長引けば、下々の障りになる、と。"
  shot: K20_6
  tone: しみじみ
  pause: 0.12
  # fact: meireki-A21
- 語り: "石垣の土台は、今も、皇居東御苑に残る。その上に、天守は、載らなかった。"
  shot: YEND_7
  tone: 重い
  pause: 0.12
  # fact: meireki-C01, meireki-C04
- 語り: "石垣まで造って、天守は建てなかった。あなたなら、何を優先しますか。"
  shot: K01_8
  tone: 疑問
  pause: 0.15
