title: "明暦の大火｜天守を建てないと決まったのは、燃えた日ではなかった"
yt_title: "明暦の大火で焼けた江戸城の天守　建てないと決まったのは、燃えた日ではなく2年7か月あと　石垣の土台は先にできていた"
description: |-
  江戸城の天守は、1657年の明暦の大火で焼け落ちました。幕府が、もう建てないと決めたのは、燃えた日ではありません。大火から2年7か月あまりあと、1659年9月1日のことです。
  天守を載せるための石垣の土台は、その前の1658年10月に、できていました。保科正之の言葉は、記録で、戦の役に立たないという理由と、家を建てている最中の町への配慮という理由の、2つが伝わります。
  本編では、大火で江戸の何が変わり、何が前から決まっていたのかを、記録から整理しています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/YMXFgwO0dWI
