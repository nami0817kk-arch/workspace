title: "山背大兄王｜天皇になれなかった太子の長男"
yt_title: "聖徳太子の長男は、なぜ天皇になれなかったのか　628年、推古天皇の最期の言葉と叔父・蘇我蝦夷"
description: |-
  628年の3月、推古天皇が亡くなります。次の天皇に名が挙がったのは、田村皇子と、聖徳太子の長男、山背大兄王でした。
  『日本書紀』によれば、山背は叔父の蘇我蝦夷に本心を問いただし、群臣の側が伝えた天皇の最期の言葉に、自分はじかに聞いた、と言い返します。山背を推した境部摩理勢は、蝦夷の兵に殺され、629年の正月、田村皇子が即位しました。舒明天皇です。
  本編では、このときの叔父と甥の溝が、15年後に何を引き起こしたのかを、家系図でたどっています。本編は概要欄のリンクからどうぞ。
