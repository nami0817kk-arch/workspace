# 理解テスト：①江戸の牢屋敷の牢名主と畳の話 ②江戸の小伝馬町の牢屋敷、1777年の掟書 ③役付きが名を付けて畳の数や厚さを思うままにし、掟書はそれを禁じた ④座る広さは役で決まり、上の役は畳1枚に1人、新入りは7人か8人
title: "江戸の牢屋敷｜牢名主の畳は何枚？"
yt_title: "時代劇の牢名主は畳を積む　けれど何枚積んだかは江戸の記録に見当たらない　残っていたのは1777年の掟書の言葉"
description: |-
  時代劇の牢名主は、畳を高く積んで座ります。けれど、何枚積んだのかは、今回開いた江戸時代の記録には見当たりませんでした。「10枚ほど」という数が出てくるのは、明治より後の本です。
  江戸の記録にあるのは、『古事類苑』に引かれた1777年の牢内掟書の言葉です。牢の中の役付きが、名を付けて、畳の数や厚さ、居場所の広さを思うままにしてきたことを、掟書は禁じています。江戸の写本『牢獄秘録』では、上の役付きは畳1枚に1人、新入りは1枚に7人か8人でした。
  本編では、江戸の小伝馬町の牢屋敷の暮らしを、入る所から出る所までたどっています。本編は概要欄のリンクからどうぞ。
