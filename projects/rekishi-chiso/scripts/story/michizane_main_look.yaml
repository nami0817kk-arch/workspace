parts:
- type: quote
  from: 15
  to: 15
  label: 史料
  text: 法皇　草座を陣頭に敷き／終日御庭に
  source: 『扶桑略記』延喜元年正月25日
- type: quote
  from: 20
  to: 20
  label: 史料
  text: 山城・摂津等の国　食馬を給うなかれ
  source: 太政官符 昌泰4年正月27日（『政事要略』）
- type: quote
  from: 28
  to: 28
  label: 史料
  text: 都府楼は纔かに瓦の色を看る／観音寺は只鐘の声を聴く
  source: 『菅家後集』不出門
- type: quote
  from: 32
  to: 32
  label: 史料
  text: 恩賜の御衣　今此に在り／捧持して毎日余香を拝す
  source: 『菅家後集』九月十日
- type: quote
  from: 57
  to: 57
  label: 史料
  text: 世を挙げて云う／菅帥の霊魂　宿忿の為す所なり
  source: 『日本紀略』延喜23年3月21日
- type: quote
  from: 71
  to: 71
  label: 史料
  text: 吾　心中に三宝に帰依し／殊に懼るる所なし
  source: 『九条殿遺誡』（藤原忠平の言葉）
- type: quote
  from: 79
  to: 79
  label: 史料
  text: 我は是れ上人の本国の昔の相府なり／日本太政威徳天
  source: 『道賢上人冥途記』（『扶桑略記』天慶4年）
- type: quote
  from: 83
  to: 83
  label: 史料
  text: 賢臣　辜なきに　誤りて流す／其の罪三なり
  source: 『道賢上人冥途記』（『扶桑略記』）
- type: quote
  from: 99
  to: 99
  label: 史料
  text: 但だ羞ず　存没　左遷の名
  source: 『天満宮託宣記』正暦4年
