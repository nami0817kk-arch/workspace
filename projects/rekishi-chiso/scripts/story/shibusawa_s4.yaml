# hook＝語りたがらない慶喜に、どう聞いたか（答えはこのショートの中：兜町の事務所・飛鳥山の屋敷で慶喜を囲む会＝昔夢会。速記は話しにくいと筆記に戻った）。
# tease＝渋沢はなぜ、そこまでして旧主の伝記を作ったのか（答えは本編 まとめ：謝恩と誤解を解くこと。shibusawa-36・13）。
# 数え直し：慶喜 1837-10-28 生 → 1907-07-23＝69歳。1913-11-22 没＝76歳。第17回 1913-05-03 → 死去＝6か月19日（半年あまり）。
# 理解テスト：①渋沢栄一が、旧主・徳川慶喜本人から話を聞いた会の話 ②明治40年7月23日、兜町の渋沢の事務所で第1回。慶喜は69歳
#   ③慶喜は語りたがらず、名は慶喜が付けた昔夢会。速記は話しにくいと筆記に戻った。会はおよそ17回、屋敷での聞き取り8回
#   ④慶喜の死後、大正4年に筆記を3巻にまとめ、25部だけ刷って関わった者に配った
title: "渋沢栄一｜昔夢会と25部の筆記"
yt_title: "語りたがらない最後の将軍に、渋沢栄一はどう聞いたのか　徳川慶喜を囲んだ「昔夢会」と、25部だけ刷られた筆記"
description: |-
  最後の将軍・徳川慶喜は、もともと、自分の歩みを語ることさえ喜ばなかったといいます。その慶喜を、渋沢栄一は、話の席に引き出しました。
  明治40年7月23日、日本橋兜町の渋沢の事務所で、慶喜を囲む最初の会が開かれます。慶喜は69歳。この会を「昔夢会」と名付けたのは、慶喜本人でした。速記は途中から許されましたが、慶喜は「速記の係がいては話しにくい」と言い、第14回からは筆記に戻っています（『昔夢会筆記』の渋沢の例言）。
  慶喜が出た会はおよそ17回、ほかに屋敷を訪ねての聞き取りが8回。慶喜の死後、大正4年4月に、筆記は3巻にまとめられ、わずか25部だけ刷られて、伝記の原稿に関わった者だけに配られました。
  本編では、渋沢が旧主の伝記にかけた年月と、その理由をたどっています。本編は概要欄のリンクからどうぞ。
