focus: {}

parts:
  - {type: quote, from: 9, to: 9, label: 史料, text: 元百姓浪人伊能勘解由／試みに測量／一日銀七匁五分宛被下之, source: 辞令書（寛政12年閏4月14日）大谷亮吉『伊能忠敬』（1917年）が引く}
  - {type: versus3, from: 28, to: 29, items: [[道中の費用, 100両], [手当, 20両], [忠敬の自腹, 80両]], every: 1.6}
  - {type: quote, from: 37, to: 37, label: 史料, text: 御用と申ものハ難有ものにて／宿々名主年寄送迎, source: 忠敬から景敬への手紙（寛政12年5月23日）大谷『伊能忠敬』が引く}
  - {type: quote, from: 46, to: 46, label: 史料, text: 一汁一菜を外馳走ケ間敷儀／決而被致間敷候, source: 先触れ（享和2年6月10日）大谷『伊能忠敬』が引く}
  - {type: quote, from: 74, to: 74, label: 史料, text: 甲浦を出しよりけふまで／一夜もいも寐す, source: 奥宮正樹の日記（文化5年）大谷『伊能忠敬』が引く}
  - {type: quote, from: 106, to: 106, label: 史料, text: 何不自由も無之／江戸住宅より大ニ宜候, source: 忠敬から妙薫への手紙（文化10年正月）大谷『伊能忠敬』が引く}

