# 物語型の本編（横 16:9）の見た目と絵の割り当て：伊能忠敬の旅の毎日（scripts/inou-story.yaml）。chiso/storymain.py が読む。
# 11-11 作成（11/13 12:00 公開予定）。shogun_main_look.yaml を写した。台本には手を入れない。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：新しく作る時間が無かったため、AI 絵は『将軍の1日』（S01〜S15）と『参勤交代』（P01〜P09・TH2）の室内・街道・宿場・灯・行列（人物の顔なし）の写し。
#   実在の絵は広重《名所江戸百景 日本橋》《東海道五十三次 土山》・メトロポリタン美術館の《大名行列》・国周《島田》・ベアト《長崎》を part / frame で出す。伊能忠敬の肖像・伊能図は使っていない（手元の素材に無い）。
script: scripts/inou-story.yaml
out: inou_story_main
art_dir: out/story/inou/main
main_art_dir: out/story/inou/main
ai_disclosure: この動画の室内・街道・宿場の風景の画像の一部は、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真や肖像ではありません（画面の右上に「AI生成画像」と出しています）。

