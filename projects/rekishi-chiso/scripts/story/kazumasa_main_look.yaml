      nodes: [[石川数正, 徳川の取次（交渉の窓口）], [羽柴秀吉, 交渉の相手], [徳川家康, 主君]],
      edges: [[石川数正, 羽柴秀吉, 交渉], [徳川家康, 石川数正, 主君と重臣]]}}
  # 関係図②：44「菅原さんが目を向けたのは、小笠原貞慶です。10月17日付けの秀吉の手紙の時点で、貞慶は、すでに秀吉と通じていました」
  - {from: 44, to: 44, spec: {type: people, title: 天正13年10月 数正の足もと,
      nodes: [[石川数正, 後ろ盾], [小笠原貞慶, 信濃の大名], [羽柴秀吉, 関白]],
