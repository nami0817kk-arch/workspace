# 物語型の本編（横 16:9）の見た目と絵の割り当て：石川数正（scripts/kazumasa-story.yaml）。chiso/storymain.py が読む。
# 10-26 作成。台本には手を入れない（承認・reading-ok 済み。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針（ユーザー「絵はそんなにいらない」「絵の量は減らして」）：AI 絵は 17 枚（K01〜K17、20 枚まで）。同じ絵を時間をずらして使い回す
#   （続けて 20 秒まで）。人物は表情のある全面の AI 絵が主役。実在の絵（パブリックドメイン）は額（frame:）と屏風・絵図の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/kazumasa_ai_images.md
# 届く前は art_dir の仮の絵（K01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に K01.jpg〜を置くだけ。
script: scripts/kazumasa-story.yaml
out: kazumasa_story_main
art_dir: out/story/kazumasa/ph          # 仮の絵（placeholder）
main_art_dir: out/story/kazumasa/main   # Gemini の 16:9 の絵（K01.jpg〜K17.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

# 章ごとの左上の札「いま｜章題」。台本は和暦を主に書くので札も和暦（出奔は「天正13年11月13日」、西暦の年は付けない）。
# dates＝語りがその年・月日を言った行から替える（研究・論文の年は物語の「いま」ではないので替えない）
chapters:
  0: {label: 序章 なぜ秀吉のもとへ走ったのか, now: 天正13年11月,
      dates: {14: 天正12年}}
  1: {label: 第1章 人質と取次, now: 天正12年,
      dates: {17: 天正12年12月, 30: 天正13年夏, 35: 天正13年秋}}
  2: {label: 第2章 2週間の急転, now: 2023年,
      dates: {37: 天正13年10月14日, 44: 天正13年10月17日, 48: 天正13年10月28日, 56: 天正13年11月}}
  3: {label: 第3章 出奔の夜, now: 天正13年11月13日,
      dates: {66: 天正13年11月28日}}
  4: {label: 第4章 裏切りか、スパイか, now: null}
  5: {label: 第5章 16日後の大地震, now: 天正13年11月,
      dates: {92: 天正13年11月29日, 114: 天正14年}}
  6: {label: 第6章 数正の家はどこへ, now: 天正13年〜,
      dates: {120: 天正18年, 123: 文禄元年, 127: 1596年, 134: 慶長5年, 137: 慶長18年（1613年）, 144: 1971年, 146: 1973年〜, 150: 2025年}}
no_tag_from: 153                       # 締め（冒頭の夜に戻る所）から札を出さない

# AI 絵（16:9 横・17枚）。scene は日本語の要約（英語の指示は research/kazumasa_ai_images.md）。
# pan：h＝左右（既定）・v＝上下（天守・山の斜面）・zoom＝ゆっくり寄る（顔の感情の場面だけ）。crops＝切り出し [倍率, 中心x, 中心y]
ai:
  K01: {scene: 天正13年冬の夜。丘の上の岡崎城、門から数騎が出ていく遠景（右下に小さく）, pan: h}
  K02: {scene: 数正・胸から上。灯の下で前を見すえる（50代前半・決意と迷い）, pan: zoom, crops: {face: [1.25, 0.55, 0.40]}}
  K03: {scene: 数正・夜の書院で書状を前に思い悩む（行灯・横から）, crops: {right: [1.15, 0.62, 0.45]}}
  K04: {scene: 家康・書院の上座で決める厳しい顔（40代前半・胸から上）, pan: zoom, crops: {face: [1.25, 0.5, 0.40]}}
  K05: {scene: 秀吉・金の襖の御殿に座る。笑みと鋭い目（40代後半・中くらいの引き）, crops: {face: [1.25, 0.5, 0.40]}}
  K06: {scene: 天正12年12月。冬の城下を出る小さな行列（馬上の少年＝於義丸と、付き従う若い武士2人。後ろ姿）}
  K07: {scene: 城門の前で、数正（右・横顔）が旅立つ息子2人（左・後ろ姿）を見送る, crops: {face: [1.25, 0.72, 0.42]}}
  K08: {scene: 書院の対面。上座の家康（左）に、数正（右）が手をついて報告する（交渉の報告）}
  K09: {scene: 文机の上の書状（和紙に筆の跡・読めない）と行灯（人物なし）, crops: {face: [1.25, 0.5, 0.5]}}
  K10: {scene: 冬の夜道を行く一騎（数正・顔は見えない）、遠くに城の影、冷たい風}
  K11: {scene: 天正13年11月29日の夜。地震で崩れる城下の家々と遠くの炎、逃げる人の影（細部は描かない）}
  K12: {scene: 飛騨の山あいの谷。急な斜面の大きな山崩れの跡と川、曇り空（人物なし）, pan: v}
  K13: {scene: 松本城の天守。黒い板壁と白い漆喰、堀に映る、朝霧、後ろに北アルプス（人物なし）, pan: v}
  K14: {scene: 康長・40代。天守を見上げる（胸から上・父に似た細い目）, pan: zoom, crops: {face: [1.25, 0.45, 0.40]}}
  K15: {scene: 康長・晩年。九州の配所の質素な部屋で、高さ30センチほどの木彫りの仏像を拝む（灯・斜め後ろから）, crops: {face: [1.25, 0.55, 0.45]}}
  K16: {scene: 松本の寺の本堂の法要。線香の煙と灯明（人の顔は描かない）}
  K17: {scene: 終了画面用。月夜の城跡の石垣と静かな川（右半分を空けた構図）, lock: [1.0, 0.5, 0.5]}

