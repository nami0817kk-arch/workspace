# look だけで足す図（台本には無い。語りがその名前・地点を言う 0.25 秒前に1つずつ書き込む）。spec: null はその行の台本の図を外す
figures:
  # 関係図①：取次。19「数正を徳川家の取次…秀吉との交渉の窓口」→ 20「秀吉の言葉を家康に伝え…」。語る順に 数正 → 秀吉 → 家康
