# 物語完結型ショート 三種の神器 s3（2026-11-05）。本編 scripts/jingi-story.yaml（11/5 19:00 公開、https://youtu.be/XmWN5pboKa4）の第3章から。11/6 15:30 公開。
# 形式は sankin_s2.yaml（食い違いの表）を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った壇ノ浦の絵だけ。新しい絵は作らない。
# 切り口：壇ノ浦で安徳天皇を抱いて沈んだのは誰か、記録で名前が違う。勾玉は浮かび、宝剣だけ戻らなかった。鏡（s1）・盗難（s2）・南北朝（s4）・1443年（s5）には踏み込まない。
# 事実カード：jingi-03・29・30・31・32・35・36・41。言い方は本編のまま。
#   ・元暦2年＝1185年、寿永2年＝1183年、文治3年＝1187年を確かめた。
#   ・5町＝5×約109m＝約545m →「約550メートル」は合う（本編の札と同じ）。
#   ・「8歳」は平家物語・吾妻鏡の書き方（数え。愚管抄は7歳、jingi-30）→「『平家物語』では」の中でだけ言う。満では6歳。
#   ・1187年の海人の捜索（jingi-35）・陰陽寮の占い（jingi-36）は玉葉による。「見つからなかった」は本編第3章の筋（宝剣だけが戻らなかった）。
# 理解テスト4問：
#   ①誰の話か：壇ノ浦で沈んだ幼い安徳天皇と、平家の船にあった三種の神器
#   ②いつ・どこで何が：1185年3月24日、壇ノ浦で天皇が海に沈んだ
#   ③記録はどう違うか：平家物語は二位尼が天皇を抱いたと書き、吾妻鏡は按察局が抱き、しかも生き残ったと書く
#   ④どうなったか：勾玉の箱は浮かび、鏡も戻ったが、宝剣は1187年に海人に探させても戻らなかった
title: 三種の神器｜壇ノ浦、天皇を抱いたのは誰か
yt_title: 壇ノ浦で幼い安徳天皇を抱いて沈んだのは誰か　平家物語と吾妻鏡で名前が違う　沈んだ宝剣のゆくえ
description: |-
  1185年、壇ノ浦。幼い安徳天皇を抱いて海に沈んだのは誰か。記録によって、名前が違います。
  『平家物語』では、平清盛の妻、二位尼が、勾玉の箱を脇に挟み、宝剣を腰に差し、天皇を抱いて海に入ります。ところが『吾妻鏡』では、宝剣を持ったのが二位尼で、天皇を抱いたのは按察局。しかも按察局は生き残っています。勾玉の箱は海に浮かび、鏡も船の上から戻りました。宝剣だけが戻らず、1187年には海に潜る海人を使って探させましたが、見つかりませんでした。
  剣のないまま、その後、宝剣とされたのはどの剣だったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#三種の神器', '#日本史', '#壇ノ浦の戦い']
