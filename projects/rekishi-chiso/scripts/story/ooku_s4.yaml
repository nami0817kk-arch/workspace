# 物語完結型ショート 大奥の奥女中 s4（2026-11-06）。本編 scripts/ooku-story.yaml（11/8 19:00 公開、https://youtu.be/28M-XkATUuY）の第4章から。11/9 17:30 公開。
# 形式は kakeizu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/ooku/main。FLUX、人物は後ろ姿・手もと・足もとだけ）と楊洲周延《千代田の大奥》。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：いちばん下の働き手（オタモン・お末）の水と米の仕事。部屋方の人数（s3）には踏み込まない。
#   宿下り（ooku-71）は tease の答えとして本編に残す。
# 事実カード：ooku-68・69・70・07。言い方は本編のまま。
#   ・『母の御本丸の話』は大野という人が母の話を書いたもの。三田村鳶魚『御殿女中』所収（1930）。本編どおり。
#   ・扶持の米 1人前1日3合、1か月分ずつ玄米。本編どおり。
# 理解テスト4問：
#   ①誰の話か：大奥の部屋方のはじめの下働き「オタモン」と、いちばん下の女中「お末」
#   ②何をしたか：深い井戸から二人で水を汲み、杉丸太の棒がしなる桶を担ぎ、大掃除では台所の天井まで水をかけた
#   ③米はどうしたか：1か月分の玄米を、毎日すり鉢で手で白くした
#   ④どうだったか：お末は3年のあいだ足袋をはけなかった
title: 大奥｜いちばん下の女中は、何をしていたのか
yt_title: 大奥のいちばん下の女中は毎日何をしていたのか　井戸の水汲み・天井まで水の大掃除・すり鉢の米
description: |-
  華やかな大奥で、いちばん下の働き手は、毎日、何をしていたのでしょうか。
  三田村鳶魚の『御殿女中』（1930年）に、大野という人が母の話を書いた『母の御本丸の話』が収められています。母は、大奥で部屋方として勤めた人です。部屋方に上がると、はじめはオタモンという、つらい役をしなければなりませんでした。大きな玄蕃桶を持って行き、深い井戸から大きな釣瓶で、二人で水を汲み上げる。二人で担ぐと、太い杉丸太の棒がしなるほどの重さでした。大掃除の日には、台所の天井まで水をざぶざぶかけました。扶持の米は1人前1日3合で、1か月分ずつ玄米で渡され、オタモンが毎日、大きなすり鉢で手で白くしました。いちばん下の女中のお末は、3年のあいだ、足袋をはくことができなかったといいます。
  では、この人たちは、いつ家に帰れたのか。本編は概要欄のリンクからどうぞ。
