#   冥途記 天慶4年＝941年 → 941−901＝40年後。
# 伝説（飛梅など）は使わない。
# 理解テスト：①菅原道真が流された日の宇多法皇の話 ②901年の正月、京都の内裏の門の前 ③法皇は道真を救おうと駆けつけ、門の前に草の敷物を敷いて座ったが、入れてもらえなかった ④警固の者は腰かけから下りもせず、法皇は日暮れに帰った（『日本紀略』では30日に来て夜通し帰らない）
title: "菅原道真｜左遷の日、門の前に座った法皇"
yt_title: "菅原道真が流された日、宇多法皇は内裏の門の前に座り込んだ　入れてもらえなかった前の天皇と、記録ごとに違う日付"
description: |-
  昌泰4年、901年の正月25日。右大臣の菅原道真は、突然、大宰権帥に落とされ、九州の大宰府へ流されることになりました。左遷の宣命は、醍醐天皇を廃して、道真の娘を妃とする斉世親王を立てようとした、と罪を挙げています。
  道真を取り立ててきた宇多法皇は、内裏へ駆けつけました。『扶桑略記』によれば、法皇は門の前の陣に草の敷物を敷いて座り、一日じゅうそこにいましたが、中へは入れてもらえません。警固の者たちは腰かけから下りもせず、法皇は日が暮れて御所へ帰りました。『日本紀略』では、法皇が来たのは5日後の30日で、夜通し帰らなかったと書かれています。
  本編では、大宰府での2年、59歳の死、都で続いた死と清涼殿の雷、そして学問の神様になるまでを、当時の記録でたどっています。本編は概要欄のリンクからどうぞ。
