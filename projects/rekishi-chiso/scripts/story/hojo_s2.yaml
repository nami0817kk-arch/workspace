# 物語完結型ショート 北条 s2（2026-11-06）。本編 scripts/hojo-if-story.yaml（11/8 12:00 公開）の第1章（1588年、氏規の上洛）から。11/9 11:00 公開。
# 形式は tsurumatsu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/hojo-if/main/）と本編で使った実在の肖像・屏風だけ。H21 は姫路城に見えるので使わない。
# 切り口：家康の起請文（1588年5月21日）に迫られて、京へ上ったのは当主の氏直でも父の氏政でもなく、弟の氏規。聚楽第の席では、衣冠の武家13人の中で、
#   官位の無い氏規は烏帽子に直垂で末座（『吉川家史臣略記』を『日本戦史』が引く）。『多聞院日記』は「天下中が満足」。
#   本編の答え（氏政の上洛の約束と引き換えに沼田の城を渡したこと）は言わない。
#   謁見の日は15日／22日で割れるので言わない（本編どおり）。逸話（『続武家閑談』）は入れない。
# 事実カード：hojo-18・21・129・89・88。言い方は本編のまま。
# 計算（自分で計算し直した）：天正16年＝1588年。5月21日→8月で約3か月（台本では言わない。本編どおり）。
# 理解テスト4問：
#   ①誰の話か：北条家と、氏政の弟の北条氏規
#   ②いつ・どこで何が：1588年5月21日、家康が氏政・氏直に起請文を送り、兄弟の誰かを京へ上らせるよう迫った
#   ③誰が選ばれたか：8月、当主の氏直でも父の氏政でもなく、弟の氏規が京へ上り、聚楽第でいちばん下の席に座った
#   ④どうなったか：京では東国の和談が整ったと喜ばれた。氏政本人の上洛の約束と引き換えに秀吉は何を渡したのか、の問いで閉じる（答えは本編）
title: 北条氏規｜いちばん下の席に座った弟
yt_title: 北条家で最初に秀吉の前に出たのは氏政の弟・氏規だった　1588年の聚楽第、烏帽子に直垂でいちばん下の席に
description: |-
  1588年の5月21日、徳川家康は、北条氏政と氏直に起請文を送りました。家康は、氏直の妻の父です。その月のうちに、氏政の兄弟の誰かを京へ上らせるよう迫りました。
  8月、京へ上ったのは、当主の氏直でも、父の氏政でもなく、氏政の弟の北条氏規でした。秀吉と会った席の様子は、明治の参謀本部がまとめた『日本戦史』が引く『吉川家史臣略記』にあります。正装の衣冠を着た13人の武家が並ぶなか、官位の無い氏規は、烏帽子に直垂のふだんの武家の装いで、いちばん下の席に座りました。奈良の興福寺の僧、英俊の『多聞院日記』は、8月18日に、東国はすべて和談が整い、天下中が満足している、と書いています。
  では、氏政本人の上洛の約束と引き換えに、秀吉は何を渡したのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#北条氏規', '#北条氏政', '#日本史']
ai_images: true
