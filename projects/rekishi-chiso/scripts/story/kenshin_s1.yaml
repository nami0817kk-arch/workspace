# 切り口：七尾城。広さ約250ヘクタールの山城が、謙信の手紙では9月15日の1日のうちに落ちた。ただし囲んだ期間は解説で割れる（数か月／1年）。次は手取川（本編の第2章）。
#   本編の答え（謙信の最期の理由＝同時代の言葉は虫気だけ・厠は江戸の軍記で一説・言えること言えないこと）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/上杉謙信_facts_20261107.yaml）：kenshin-59・40・58。言い方は本編のまま。
# 計算（自分で計算し直した）：1577年9月15日の落城（手紙）。囲んだ期間は観光庁「1576年と1577年の数か月間」とnippon.com「1年」で割れる（本編は触れていない）。
# 理解テスト4問：
#   ①誰の話か：謙信が1577年に攻めた能登の七尾城
#   ②いつ・どこで何が：1577年9月15日、謙信は北条高広・景広の父子に、七尾城が15日の1日のうちに落ちた、と手紙で知らせた
#   ③なぜか：重臣の遊佐続光がひそかに謙信と通じ、筆頭の長続連を殺して門を開いた、と言われる。囲んだ期間は、数か月とも1年とも割れる
#   ④どうなったか：北国はあとは越前だけ、と手紙は続く。織田の大軍が近づく加賀の戦場に、謙信はいたのか、の問いで閉じる（答えは本編の第2章）
title: 七尾城｜難攻不落の山城は、なぜ1日で落ちたのか
yt_title: 難攻不落の七尾城は、なぜ1日で落ちたのか　上杉謙信の手紙が告げた1577年9月15日と、内側から開いた門
description: |-
  能登の七尾城は、広さ約250ヘクタール。全国でも指折りの大きな山城です。観光庁の解説によれば、謙信の手に落ちるまで、まず占領されることはない、と考えられていました。
  1577年9月15日、謙信は、味方の武将の北条高広と景広の親子に手紙を送ります。七尾城は、今15日、1日のうちに落ちた。城の重臣の遊佐続光が、ひそかに謙信と通じ、筆頭の家臣、長続連を殺して、門を開いた、と言われます。ただし、城を囲んでいた期間は、解説によって、数か月とも、1年とも書かれ、割れています。
  同じ手紙は、織田信長が出陣した、とも書きますが、これは誤った知らせでした。手紙は、北国は、あとは越前だけだ、と続けます。
  七尾城を落とした謙信の前に、織田の大軍が近づきます。謙信は、その戦場に、いたのか。本編は概要欄のリンクからどうぞ。
