# 理解テスト4問：①クレオパトラ（の王宮区）②紀元365年7月21日の地震と津波のあと、王宮区の一部が海の下に（アンミアヌスは津波を書く。沈んだ原因は研究者の見方が分かれる） ③ストラボンは王宮が町の4分の1〜3分の1と書く。ゴディオは霊廟の証拠は今のところ無いが、墓は沈んだ都市にあるとみる ④墓が海の下か町の下かは言い切れない（本編へ）

title: "クレオパトラ｜王宮区は、海の下にある"
yt_title: "クレオパトラの王宮区は、一部が海の下にある　ゴディオは「霊廟の証拠は今のところ無い」と答えた"
description: |-
  クレオパトラの王宮区は、いま、その一部が、海の下にあります。地理学者ストラボンは、王宮の建物は、町の周りの長さの、4分の1から3分の1（25パーセントから33パーセント）にのぼる、と書きました。
  アンミアヌス・マルケリヌスは、紀元365年の7月21日、夜明けの少しあとに、大きな地震と津波が地中海の各地を襲い、アレクサンドリアでは、大きな船が建物の屋根に乗り上げた、と書きます。1661年前です。沈んだ原因は、研究者の見方が分かれています。水没した桟橋の基部は、海面下8メートルから9メートル（スミソニアンのスタンリー）。水深の言い方は、出どころによって違います。
  この海の下を1992年から調べてきたのが、フランク・ゴディオの、欧州水中考古学研究所です。アンティロドス島では、宮殿とイシス神殿が見つかっています。ただし、プルタルコスは「イシス神殿の近く」と書いただけで、この島とは書いていません。2026年5月、ゴディオは、霊廟の証拠は今のところ無い、と答えています。それでも、墓は沈んだ都市にあるとみています。
  墓の場所に点を付けると、どこが1位になるのか。本編は概要欄のリンクからどうぞ。
