lines:
  # fact: france-if-55
  - 語り: バスティーユの3週間前、国王は、《!新しい税》を、自分から縛る宣言をさせていた。
    shot: Louis
    tone: 強調
    pause: 0.12
  # fact: france-if-55
  - 語り: 1789年6月23日、ヴェルサイユ。ルイ16世が自ら議場に出る、親臨会議だ。
    shot: F03
    tone: しみじみ
    pause: 0.12
  # fact: france-if-52, france-if-55
  - 語り: 読まれた宣言は、2つ。1つ目は、議員たちが国民議会を名乗った、6月17日の議決を、無効とした。
    shot: Couder
    tone: しみじみ
    pause: 0.12
  # fact: france-if-55
  - 語り: 2つ目は、35か条。その第1条。国民の代表の同意なしに、新しい税は作らない。
    shot: F09
    tone: 重い
    pause: 0.12
  # fact: france-if-56
  - 語り: 予算は、毎年公開する、とも書いた。
    shot: F08
    tone: しみじみ
    pause: 0.12
  # fact: france-if-57
  - 語り: ただし、譲らなかった線もある。十分の一税と、領主の権利は、財産として守る。軍への権限は、王が持つ。3つの身分の区別も、手放さない。
    shot: F05
    tone: 重い
    pause: 0.12
  # fact: france-if-55
  - 語り: 議会の記録によると、国王は最後に、こう言った。もし皆が私を見捨てるなら、私ひとりで、民の幸せをつくる。
    shot: Louis2
    tone: 重い
    pause: 0.12
  # fact: （本編のまとめ）
  - 語り: 35か条は、交渉の土台にならないまま、3週間後、バスティーユは落ちた。
    shot: Robert
    tone: しみじみ
    pause: 0.3
    dip: true
  # fact: （本編へ）
  - 語り: もしも、この35か条が、交渉の土台になっていたら。革命は、起きなかったのか。
    shot: F16
    tone: 疑問
    pause: 0.15
