# 物語完結型ショート フランス革命（もしも）s2（2026-11-05）。本編 scripts/france-if-story.yaml（11/5 12:00 公開、https://youtu.be/0InK0OydYHM）から。切り口：6月23日の親臨会議、国王の35か条（差し出したもの・譲らなかった線）
# 形式は kurofune_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。国王の言葉は議会の記録（『アルシーヴ・パルルマンテール』）として、出どころを言ってから引く。
# 絵は本編の AI 絵（F01〜F16）と実在の絵（paintings/france_*）。新しい絵は作らない。F14（遠くにエッフェル塔）・F04（偽の字）は使わない。
# 事実カード（dev/output/rekishi-chiso/research/フランス革命_facts_20261031.yaml）：france-if-52・55・56・57（本編の序章と第5章の言い方のまま）
# ・計算のやり直し：6月23日 → 7月14日 は 7＋14＝21日＝ちょうど3週間（本編どおり）。
# ・賦役の永久廃止（第30条）は s3（テュルゴー）の結びに回す（同じ事実を2本に出さない）。
# ・「交渉の土台にならないまま」は本編のまとめの言い方のまま。
# 理解テスト4問：
#   ①誰の話か：国王ルイ16世と、1789年6月23日の親臨会議の35か条
#   ②いつ・どこで何が：バスティーユの3週間前、国王が議場で宣言を2本読ませた。1本目は6月17日の議決を無効に、2本目が35か条
#   ③国王は何を差し出し、何を譲らなかったか：代表の同意のない新税は作らない・予算は毎年公開。十分の一税と領主の権利・軍への権限・3つの身分の区別は手放さない
#   ④どうなったか：35か条は交渉の土台にならないまま、3週間後にバスティーユが落ちた。もしも土台になっていたら、を問いで閉じる
title: ルイ16世｜バスティーユの3週間前、国王は「同意のない新税は作らない」と宣言させた
yt_title: バスティーユの3週間前、ルイ16世は「同意のない新税は作らない」と宣言させていた　35か条の中身
description: |-
  バスティーユが落ちる3週間前、国王ルイ16世は、「代表の同意なしに、新しい税は作らない」と宣言させていました。
  1789年6月23日、国王が自ら議場に出た親臨会議。読まれた宣言は2本で、1本目は、議員たちが国民議会を名乗った6月17日の議決を無効にするものでした。2本目は、35か条の「国王の意図の宣言」。予算は毎年公開する、と踏み込む一方で、十分の一税と領主の権利は財産として守り、軍への権限は王が持つ、と書いていました。議会の記録によると、国王は最後に「もし皆が私を見捨てるなら、私ひとりで、民の幸せをつくる」と言っています。
  もしも、この35か条が交渉の土台になっていたら。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
