# 物語完結型ショート モンゴル s3（2026-11-07）。本編 scripts/mongol-if-story.yaml（11/10 12:00 公開）の第3章（ハンガリーで冬を越す）から。11/11 13:30 公開。
# 形式は columbus_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/mongol-if/main/）だけ。新しい絵は作らない。
# 切り口：聖職者ロゲリウスの『悲しみの歌』（1244年ごろ）。代官およそ100人・1人でほぼ1000の村・農民に収穫させた→冬を越すつもりだと見た。
#   落ちなかったのはエステルゴム・パンノンハルマ・セーケシュフェヘールヴァールの3か所だけ。1242年3月の末に去りはじめる。
#   本編の答え（なぜ去ったのか＝第4章）は言わない。
# 事実カード：mongol-23・05・24・46・45・29。言い方は本編のまま。
# 計算：なし（数は原文の 100・1000・3 のまま）。
# 理解テスト4問：
#   ①誰の話か：モンゴルに捕らわれたハンガリーの聖職者ロゲリウス（と、ハンガリーを占領したモンゴル軍）
#   ②いつ・どこで何が：1241年、ヴァーラドが落ち、ロゲリウスは森へ逃げたのち、モンゴルに従ったハンガリー人の下で働いた
#   ③何を見たか：代官およそ100人、1人でほぼ1000の村、農民に収穫をさせた→ここで冬を越すつもりだと見た
#   ④どうなったか：軍は凍ったドナウ川を渡ったが3か所は落ちず、1242年3月の末に去りはじめた。なぜ去ったのか、の問いで閉じる（答えは本編の第4章）
title: ロゲリウス｜冬を越すつもりだった軍
yt_title: ハンガリーを奪ったモンゴル軍は、冬を越すつもりだった　捕らわれた聖職者ロゲリウスが見た、代官1人で1000の村
description: |-
  1241年、ハンガリーの町ヴァーラドに、ロゲリウスという聖職者がいました。町が落とされると、彼は森へ逃げ、やがて、モンゴルに従ったハンガリー人の下で働くことになります。
  ロゲリウスが1244年ごろに書いた『悲しみの歌』によると、モンゴルは、およそ100人の代官を置きました。ロゲリウスが仕えた代官は、1人でほぼ1000の村を治め、農民に収穫をさせました。ロゲリウスは、彼らがここで冬を越すつもりだ、と見ました。
  その冬、軍は凍ったドナウ川を渡ります。けれど、エステルゴムの城塞、丘の上のパンノンハルマ修道院、セーケシュフェヘールヴァールの町は落ちませんでした。ロゲリウスは、その地方で落ちなかったのはこの3か所だけだった、と書いています。
  そして1242年3月の末、軍はハンガリーを去りはじめました。
  冬を越す支度までしていた軍は、なぜ去ったのか。本編は概要欄のリンクからどうぞ。
