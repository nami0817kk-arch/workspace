# hook＝大久保は龍馬の暗殺を誰の仕業とみたか／薩摩は黒幕だったのか（答えはこのショートの中：11月19日の手紙で新撰組、第一に近藤勇。記録の上の薩摩は犯人を探す側）。
# tease＝捕まった近藤勇は龍馬の暗殺について何と言ったと伝わるか（答えは本編 第3章：大石は見廻組の仕業と聞いた、高知藩は原田が加わったと言ったと届け、正反対。ryoma-ansatsu-08・15）。
# 数え直し：慶応3年＝1867。11月15日→16・17・18日＝翌日から3日続けて、→19日＝4日後、→24日＝9日後。谷干城の講演は年が割れるので遺稿の1912年を言う。季節は言わない。
# 理解テスト：①薩摩の大久保利通が、龍馬の暗殺を誰の仕業とみたかの話 ②慶応3年11月15日の夜、京都の近江屋で龍馬と中岡が斬られた
#   ③大久保は16〜18日の手紙では犯人の名を書かず、19日の手紙で新撰組に違いない、第一に近藤勇の仕業だろうと書いた。龍馬の仲間の菅野も24日に新選組と書いた
#   ④菊地明は見込みで疑われたとみる。鞘を調べに薩摩の屋敷へ行ったとき、薩摩の中村半次郎も一緒だった。記録の上の薩摩は犯人を探す側
title: "坂本龍馬｜大久保利通の手紙"
yt_title: "薩摩は龍馬暗殺の黒幕だったのか　大久保利通は事件の4日後の手紙で「第一に近藤勇の仕業」と書いていた"
description: |-
  坂本龍馬の暗殺の黒幕は薩摩だ、という説があります。けれど、薩摩の大久保利通は、事件の4日後の手紙に、別の名を書いていました。
  慶応3年11月15日の夜、京都の近江屋で、坂本龍馬と中岡慎太郎が斬られました。大久保は、翌日から3日続けて、岩倉具視に手紙を書いていますが、犯人の名は書いていません。そして11月19日の手紙に、坂本の暴殺は新撰組に違いないと聞いた、第一に近藤勇の仕業だろう、と書きました。事件から9日後の11月24日には、海援隊の菅野覚兵衛も、敵は新選組に決まった、と書いています。
  研究者の菊地明さんは、2010年、証拠よりも、新選組ならやりかねない、という見込みで疑われた、と見ています。1912年に出た谷干城の遺稿によれば、現場の鞘を伏見の薩摩の屋敷へ持って行ったとき、一緒にいたのは薩摩の中村半次郎でした。
  本編では、事件の直後の手紙から、取り調べの口書、雑誌の談話、48年後の遺言まで、書かれた年を添えて並べ、龍馬を斬った者にどこまで近づけるかを確かめています。本編は概要欄のリンクからどうぞ。
