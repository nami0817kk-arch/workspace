description: |-
  ジャンヌ・ダルクが男の服に戻った理由は、本人と証人たちで食い違います。
  1431年5月28日、本人は「自分の意志で着ました。約束が守られなかったからです」と答えました。1450年、廷吏のマシューは、女の服を見張りに取り上げられたと、ジャンヌから聞いた話を証言します。1452年、公証人のマションは、夜に見張りが襲いかかるのを恐れたためと語り、ドミニコ会士のラドヴニュとイザンバールは、暴行されかけたと聞いたと証言しました。
  証言が取られたのは、フランス王がルーアンを取り戻したあとです。どれが真実なのか、記録からは決められません。本編は概要欄のリンクからどうぞ。
