# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしも現代人が戦国の足軽になったら（scripts/ashigaru-if-story.yaml）。chiso/storymain.py が読む。
# 11-22 作成（11/29 12:00 公開）。nagaya_if_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini）。A01〜G03・END はこの回のために作る（out/story/ashigaru_if/main/<名>.jpg）。
#   時代は戦国（1560年ごろ。第1章は1460年代の京都）。足軽は黒い陣笠・簡素な胴丸・脚絆と草鞋。旗・幟は無地（字・紋は描かない）。
#   実在の人物の顔は描かない。血・傷口・死体・首は描かない。人の売り買いの場面は描かない（引き揚げる軍勢の遠景・南蛮船の港・禁制の札まで）。
