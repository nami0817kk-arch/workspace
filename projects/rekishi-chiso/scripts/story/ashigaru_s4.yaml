# 切り口：手柄の数え方。首の代わりに鼻を持ち帰った草履取りの嘉助、合言葉を忘れた侍、泗川の首の数の2通り（本編 第6章、ashigaruif-19・44・20・42・45）。
# hook＝首の代わりの鼻は、なぜだめだったか（答えはこのショートの中：ひげが無く、男か女か分からないから）。
# tease＝馬の口取りは、なぜ「むやみに死ぬな」と言ったか（答えは本編 第6章：ただ死ねば扶持が無駄になる、ashigaruif-15）。
# 計算（数え直した）：38,717−30,817＝7,900。
# 理解テスト：①雑兵物語の草履取りの嘉助と、戦国の手柄の数え方 ②戦国時代の戦場（1575年 長篠・1598年 泗川） ③嘉助は首の代わりに鼻を持ち帰り、叱られて捨てた ④首の数は2通り残り、感状には多い方、実際は少ない方
title: "首の代わりに鼻｜足軽の手柄の数え方"
yt_title: "首の代わりに「鼻」を持ち帰った草履取り　戦国の手柄はどう数えたか　泗川の首の数は2通り、差は7,900"
description: |-
  『雑兵物語』の草履取りの嘉助は、取った首の代わりに、鼻だけを持ち帰りました。すると旦那に叱られます。鼻だけでは、ひげが無い。男の首か女の首かも分からない。嘉助は、その鼻を捨てました。戦国時代も、手柄は首を持ち帰って首実検で確かめるのが原則でした。
  合い印をなくし合言葉も忘れた侍が、味方に敵と間違われて討たれた話もあります。1575年の長篠の戦いでは、鉄砲で多くの武将が倒れ、誰の手柄か分からなくなりました。1598年の泗川の戦いの首の数は、島津家の文書に3万8,717と3万817の2通り残り、手柄をほめる書状には多いほうが、実際の数は少ないほうでした。
  本編では、足軽の集め方・持ち物・食べ物・傷と手当てまで、『雑兵物語』とほかの記録でたどっています。本編は概要欄のリンクからどうぞ。
