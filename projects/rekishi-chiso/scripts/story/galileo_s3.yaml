title: "ガリレオ｜誓いの文書は、告発まで誓わせた"
yt_title: "ガリレオの誓絶の文書は、地動説を「呪い、嫌う」だけでなく、異端者の告発まで誓わせていた"
description: |-
  1633年6月22日、ガリレオは枢機卿たちの前でひざまずき、聖務省が用意した誓いの文書を読みました。地球が動くという説を「呪い、嫌う」と、一語ずつ声に出す文書です。
  文書はそれで終わりません。異端者や、異端の疑いのある者を知ったら、聖務省に告発する。そうも誓わされました。読み終えて、ガリレオは自筆で署名しています。
  弟子ヴィヴィアーニの伝記は、ひざまずいたことも「呪い、嫌う」も書いていません。判決にも誓いの文書にも「それでも動く」はありません。では、誓いのあと、ガリレオはどこへ向かったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/O80RShvkLVU
