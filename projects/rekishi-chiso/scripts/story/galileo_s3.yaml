lines:
  # fact: galileo-06
- 語り: "ガリレオは、ひざまずいて、自分の説を、「呪い、嫌う」と、声に出して読んだ。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: galileo-06, galileo-08
- 語り: "69歳。枢機卿たちの前で、聖務省が用意した文書を、読み上げる。"
  shot: C02_2
  tone: しみじみ
  pause: 0.12
  # fact: galileo-06
- 語り: "呪い、嫌う相手は、地球が動くという説だった。"
  shot: C03_3
  tone: 重い
  pause: 0.12
  # fact: galileo-07
- 語り: "文書は、それで終わらない。異端者や、異端の疑いのある者を、知ったら、聖務省に告発する。そうも、誓わされた。"
  shot: C05_4
  tone: 重い
  pause: 0.12
  # fact: galileo-06
- 語り: "読み終えて、ガリレオは、自分の手で署名した。「私、ガリレオ・ガリレイは、上のとおり、誓絶しました」。"
  shot: C03_5
  tone: しみじみ
  pause: 0.12
  # fact: galileo-03
- 語り: "判決は、3年のあいだ、毎週1回、七つの悔悛詩篇を唱えることも、命じた。"
  shot: H01_6
  tone: しみじみ
  pause: 0.12
  # fact: galileo-21
- 語り: "弟子ヴィヴィアーニの伝記は、ひざまずいたことも、「呪い、嫌う」も、書かない。ただ、「撤回した」とだけ。"
  shot: C10_7
  tone: しみじみ
  pause: 0.12
  # fact: galileo-09
- 語り: "判決にも、誓いの文書にも、弟子の伝記にも、「それでも動く」は、一言もない。"
  shot: C16_8
  tone: 重い
  pause: 0.12
  # fact: galileo-13
- 語り: "では、誓ったあと、ガリレオは、どこへ向かったのか。"
  shot: C07_9
  tone: 疑問
  pause: 0.15
