lines:
  # fact: kondo-01, kondo-43
- 語り: "新選組の近藤勇は、捕まったとき、近藤勇とは名乗っていなかった。名乗った名は、《大久保大和》。"
  shot: Photo_1
  tone: 強調
  pause: 0.12
  # fact: kondo-74, kondo-89
- 語り: "甲州勝沼の戦いに敗れた近藤の隊は、1868年4月2日、下総の流山に移った。"
  shot: D07_2
  tone: しみじみ
  pause: 0.12
  # fact: kondo-90
- 語り: "4月3日。地元の恩田家の記録によれば、870人から880人の官軍が、宿場を囲み、本陣に大砲を向けた。"
  shot: D08_3
  tone: 重い
  pause: 0.12
  # fact: kondo-12, kondo-93
- 語り: "隊の長を呼び出すと、大久保大和と名乗る男が、大砲3門と、小銃118挺を差し出した。彦根藩の届にある。"
  shot: D09_4
  tone: しみじみ
  pause: 0.12
  # fact: kondo-17
- 語り: "土佐の記録では、大和は、こう答えた。身分の低い者たちが、勝手に武器を持って逃げ出した。それを取り締まりに来た。官軍に逆らう気は無い。"
  shot: D10_5
  tone: 重い
  pause: 0.12
  # fact: kondo-15
- 語り: "流山では、証拠が無いので、捕らえなかった。土佐の上田楠次が、「総督府へ出て、お詫びをするように。わたしも一緒に行こう」と、連れ出した。"
  shot: D09_6
  tone: しみじみ
  pause: 0.12
  # fact: kondo-32
- 語り: "近藤は、縛られずに、官軍の陣へ向かった。官軍にいた谷干城は、そう書いている。"
  shot: D11_7
  tone: しみじみ
  pause: 0.12
  # fact: kondo-35, kondo-36, kondo-38
- 語り: "けれど、ほかの記録は、まったく違う理由を書いている。"
  shot: D11_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第3章（kondo-35・36・38・15）
- 語り: "近藤は、なぜ、自分から、官軍の陣へ出ていったのか。"
  shot: D10_9
  tone: 疑問
  pause: 0.15
