# 理解テスト：①近藤勇の話 ②1868年4月3日、下総の流山で官軍に囲まれた ③大久保大和と名乗り、武器を差し出し、官軍の陣へ出た ④縛られずに連れて行かれた（理由は記録で割れる）
title: "近藤勇｜捕まったときの名は「大久保大和」"
yt_title: "近藤勇は、捕まったとき「大久保大和」と名乗っていた　1868年4月、流山で官軍に囲まれた新選組の局長"
description: |-
  新選組の局長、近藤勇。捕まったとき、近藤は、自分を近藤勇とは名乗っていませんでした。名乗った名は、大久保大和。
  1868年4月3日、下総の流山。地元の恩田家の記録によれば、870人から880人の官軍が宿場を囲み、本陣に大砲を向けました。彦根藩の届によれば、大久保大和と名乗る男が、大砲3門と小銃118挺を差し出しています。土佐の記録では、上田楠次が「一緒に行こう」と言って、総督府へ連れ出しました。
  本編では、近藤がなぜ自分から官軍の陣へ出ていったのかを、記録ごとに4通り並べています。本編は概要欄のリンクからどうぞ。
