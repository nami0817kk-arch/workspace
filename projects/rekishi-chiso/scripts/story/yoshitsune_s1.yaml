# 理解テスト4問：①後白河院と頼朝 ②1189年6月8日に院が「弓矢を袋にしまえ」と返し、7月に頼朝は院宣を退けて鎌倉を出発 ③頼朝は待たなかった（理由は記録にない）。宣旨は着くのが遅れた ④義経の死後も戦いは止まらなかった。もしもの問いは本編へ
# 事実は事実カード（dev/output/rekishi-chiso/research/源義経_facts_20261112.yaml）と本編の # fact: だけ。想像の台詞なし。「もしも」の話は「もしもの話」と言ってから。
# 絵は本編の AI 絵（out/story/yoshitsune-if/main の B 番号）の再利用だけ。新しい絵は作らない。B11（大物浦）・B07（平泉の町並み）・B17（蓮）は当てない。人物の顔・戦い・首・妻子の最期の絵なし。
# 吾妻鏡の1185〜89年の本文は読み下しで読んだもの（本編と同じ扱い）。干支は使わない。

title: "義経｜院は「弓矢を袋にしまえ」と言った"
yt_title: "義経が死んでも戦いは止まらなかった　院の「弓矢を袋にしまえ」を頼朝が退けた日"
description: |-
  1189年6月8日、後白河院は頼朝に「国じゅうは静まるはずだ。今は、弓矢を袋にしまいなさい」と返しました。吾妻鏡に載る返事です。義経が討たれたあとのことです。
  頼朝は従いませんでした。7月16日に「今年ばかりは待て」という院宣が届いても、どうして来年を待てようか、と退け、7月19日に鎌倉を出発します。追討の宣旨は7月19日付で、陣に届いたのは7週間ほどあとの9月9日でした。大石直正さんは、合戦のあとに事後承認の形で届いたと書き、入間田宣夫さんは、宣旨は求めたが宣下を待たずに出発したと書きます。
  吾妻鏡の1185〜89年の本文は、読み下し文で確かめたものです。原文との照合は行っていません。
  もしも義経が戦わず平泉にとどまっていたら、奥州藤原氏は滅びなかったのか。本編は次のリンクからどうぞ。
