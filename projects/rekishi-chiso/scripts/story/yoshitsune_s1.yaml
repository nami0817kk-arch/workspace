lines:
  # fact: yoshitsune-11
- 語り: "《弓矢を袋にしまいなさい》。引退した天皇、後白河院は、源頼朝に、そう返した。"
  shot: B01_in6
  tone: 強調
  pause: 0.12
  # fact: yoshitsune-11
- 語り: "1189年6月8日。義経が討たれたと知った院は、喜んだ、と吾妻鏡は書く。"
  shot: B01_right6
  tone: しみじみ
  pause: 0.12
  # fact: yoshitsune-13
- 語り: "だが頼朝は、従わなかった。7月16日、今年ばかりは待て、という院宣が届いても、どうして来年を待てようか、と退けた。"
  shot: B02_in5
  tone: 重い
  pause: 0.12
  # fact: yoshitsune-13
- 語り: "3日後の7月19日、鎌倉を出発。吾妻鏡は、1000騎と記す。"
  shot: B03_right4
  tone: 重い
  pause: 0.12
  # fact: yoshitsune-13
- 語り: "追討の宣旨も、7月19日付だ。けれど頼朝の陣に届いたのは、7週間ほどあとの、9月9日だった。"
  shot: B18_in5
  tone: 重い
  pause: 0.12
  # fact: yoshitsune-35, yoshitsune-36
- 語り: "大石直正さんは、宣旨は合戦のあとに、事後承認の形で届いた、と書く。入間田宣夫さんは、宣旨を求めたが、待たずに出発した、と書く。"
  shot: B14_left6
  tone: しみじみ
  pause: 0.12
  # fact: yoshitsune-13
- 語り: "義経が死んだあとも、頼朝は攻めた。戦いは、止まらなかった。"
  shot: B15_in5
  tone: 重い
  pause: 0.12
  # fact: （本編へ）
- 語り: "ここからは、もしもの話。義経が戦わず、平泉にとどまっていたら、奥州藤原氏は、滅びなかったのか。"
  shot: T01_in5
  tone: 疑問
  pause: 0.15
