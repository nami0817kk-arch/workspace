# 物語完結型ショート 徳川埋蔵金 s3（2026-11-05）。本編 scripts/maizo-story.yaml（11/6 12:00 公開）の第4章（1933年の事件）から。11/7 13:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/maizo/main/M*）と本編で使った実在の写真だけ。
#   M08・M12・M13・M14・M15 は使わない（s1 の頭のとおり）。M04 は峰の頂が入らない端に寄せる（s2 の頭のとおり）。
# 切り口：1933年、幕末の軍用金250万両が子持山に眠ると広告して、2,189人から約3万5,370円を集め、詐欺で二審有罪（懲役10か月）。根拠は水野家の銅板の写し。
#   本編の答え（軍艦の金）は言わない。小栗忠順の最期には触れない（銅板の言い伝えの「小栗の部下」だけ、本編どおり）。
#   人を貶めない：判決の記録にあることだけを言う（関儀一郎らが詐欺の罪に問われ、二審で有罪）。
# 事実カード：maizo-33・34・35・58。言い方は本編のまま（「判決の題は、赤城山の埋蔵金の事件」も本編どおり）。
# 計算（自分で計算し直した）：昭和8年＝1933年。判決要録は1935年（昭和10年版）。350万両は1928年の蜷川新の本（maizo-33）。
#   事件の月は maizo-34 が3月・maizo-58 が2月で割れるので、月は言わない（本編も年だけ）。
# 理解テスト4問：
#   ①誰の話か：1933年に埋蔵金の発掘資金を集めた漢学者の関儀一郎ら
#   ②いつ・どこで何が：1933年、幕末の軍用金250万両が群馬の子持山に眠ると新聞に広告し、2,189人から約3万5,370円を集めた
#   ③何を根拠にしたか：赤城山を掘ってきた水野家の銅板の写し（小栗の部下が言い残し、井戸の底から引き揚げさせたもの、と趣意書）
#   ④どうなったか：詐欺の罪で二審有罪、重い者で懲役10か月（1935年の『判決要録』）。額は1928年の本の350万両とも違う
title: 埋蔵金の広告｜2,189人がお金を出した
yt_title: 1933年、徳川埋蔵金の発掘の広告に2,189人がお金を出した　判決の題は「赤城山の埋蔵金の事件」
description: |-
  1933年、幕末の軍用金250万両が群馬の子持山に眠っている、という広告が新聞に出ました。
  広告を出したのは漢学者の関儀一郎らで、発掘の資金として、2,189人から当時のお金で約3万5,370円を集めました。根拠に使われたのは、赤城山を掘ってきた水野家の銅板の写しです。趣意書は、この銅板を、小栗の部下が死ぬ前に言い残し、井戸の底から引き揚げさせたもの、と書いていました。関儀一郎らは詐欺の罪に問われ、二審で有罪とされました。重い者で懲役10か月。1935年の『判決要録』に載る判決で、題は赤城山の埋蔵金の事件です。
  5つの説を記録で採点したら、最後に何が残ったのか。本編は概要欄のリンクからどうぞ。
