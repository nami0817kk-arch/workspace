# 理解テスト：①漢の長城ののろし台が匈奴に襲われた夕暮れの話 ②後漢の建武5年12月（西暦30年の年明けごろ）、居延の木中隧 ③隧長はのろしと旗と柴で知らせたが、隣の台に見えたのは煙だけ。確かめに出た李丹は伏せていた匈奴6人に連れ去られた ④候長は、のろしが決まりどおりでなかったとして訴えられ、獄に入れられた
title: "万里の長城｜煙だけが見えた夕暮れ"
yt_title: "万里の長城ののろし台に匈奴が来た夕暮れ　隣の台に見えたのは煙だけ、確かめに出た役人は連れ去られた"
description: |-
  後漢の建武5年の12月、西暦では30年の年明けのころ。日が沈みかけたころ、匈奴が、居延の長城の木中隧という台の、天田（砂をならした帯）に入りました。
  隧長は、のろしを2つ、大きな旗を1つ上げ、柴を1つ燃やしました。ところが、隣の城北隧から見えたのは煙だけで、のろしは見えませんでした。確かめに向かった下の役人の李丹は、伏せていた匈奴6人に、馬ごと連れ去られます。22枚の札に残るこの記録で、候長は、のろしが決まりどおりでなかったとして訴えられ、居延の獄に入れられました。
  本編では、のろしの決まりと速さ、毎朝の砂の見回り、食べ物や病まで、木の札の記録で長城の兵の暮らしをたどっています。本編は概要欄のリンクからどうぞ。
