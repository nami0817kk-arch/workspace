# 物語完結型ショート 徳川将軍家 s4（2026-11-06）。本編 scripts/tokugawa-kakeizu-story.yaml（11/7 19:00 公開、https://youtu.be/VrUQJ4sBdyA）の第6章の前半から。11/8 17:30 公開。
# 形式は oguri_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/kakeizu/main。人物なし）と実在の写真（晩年の慶喜・慶久）。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：慶喜が立てた徳川慶喜家は、121年で家を閉じた。宗家の当主交代（本編7・8章）には踏み込まない。
# 存命の人（山岸美喜さん）は、本編で言った範囲だけ（文春オンライン 2023 の取材・2026年の文藝春秋の寄稿・2023年1月の発表）。私生活・家族・住所には触れない。
# 事実カード：kakeizu-80・81・83・84・85・86・87。言い方は本編のまま。
#   ・慶喜家 1902→2023＝121年。慶朝 1950年2月生まれ→2017年9月25日没＝67歳。本編どおり。
# 理解テスト4問：
#   ①誰の話か：江戸城を出た慶喜が立てた、徳川慶喜家
#   ②いつ・どこで何が：1902年に家を立て、慶久・慶光・慶朝と継いだ。2017年9月に4代目の慶朝が67歳で亡くなる
#   ③誰が何を選んだか：めいの美喜さんが5代目として、2023年1月に絶家を発表した（決めたのは慶朝叔父だった、と美喜さんは書く）
#   ④どうなったか：1902年から121年で、慶喜家は家を閉じた
title: 徳川慶喜家｜慶喜が立てた家は、今どうなった
yt_title: 江戸城を出た徳川慶喜が立てた「もう一つの徳川家」は121年で家を閉じた　2023年の絶家まで
description: |-
  江戸城を出た慶喜は、明治になって、もう一つの徳川の家を立てていました。その家は、今どうなったのか。
  1902年、慶喜は宗家と同じ公爵になり、宗家とは別に徳川慶喜家を立てることを許されました。家は七男の慶久、孫の慶光、ひ孫の慶朝へと継がれます。4代目の慶朝は、カメラマンを経て写真家になり、自分で焙煎した豆を「徳川将軍珈琲」として売ってもいました。2017年9月、慶朝は67歳で亡くなります。めいの美喜さんが2023年に文春オンラインの取材で明かした書き置きには「あとは美喜ちゃんよろしくね」とありました。2023年1月、5代目の当主として美喜さんは、徳川慶喜家を絶家にすると発表します。1902年から121年でした。2026年の文藝春秋で美喜さんは、絶家を決めたのは慶朝叔父だった、と書いています。
  同じ2023年の正月、将軍の家の方では何が起きたのか。本編は概要欄のリンクからどうぞ。
