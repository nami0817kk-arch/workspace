# 事実カード（dev/output/rekishi-chiso/research/高杉晋作_facts_20261029.yaml）：takasugi-24・25・26・27・28
#   ・人数は書き方が分かれる（山口県観光連盟「わずか80名」・歴史街道「80人」・国交省「80多人」。takasugi-24）→ 「80人ほど」と言う。
#   ・出発の言葉は歴史街道と山口県観光連盟で違う（takasugi-25）→ 出どころを言ってから読み、違いを言う。
#   ・正規軍3,800の出発12月26日・絵堂の勝利は1月7日未明（takasugi-28）。「諸隊は」と言う。
# 理解テスト4問：
#   ①誰の話か：高杉晋作
#   ②いつ・どこで何が：1864年12月15日、雪の夜、長府の功山寺で、80人ほどで長州藩に挙兵した
#   ③何を言ったか：歴史街道は「長州男児の肝っ玉をお目にかけます」、山口県観光連盟は「長州男児の腕前お目にかけ申すべし」と書く
#   ④どうなったか：新地会所を占拠、三田尻で軍艦3隻を奪い、12月26日に藩の正規軍3,800が出発、翌年1月7日未明に諸隊が絵堂で奇襲して勝った
title: 高杉晋作｜雪の夜、80人ほどで藩に挙兵した
yt_title: 高杉晋作の功山寺挙兵　雪の夜、80人ほどで藩に挙兵　出発の言葉は、肝っ玉か、腕前か
description: |-
  1864年12月15日、雪の降る深夜。高杉晋作は、長府の功山寺で、80人ほどを率いて、長州藩に挙兵しました。功山寺には、京都を追われた五人の公家がかくまわれていました。従ったのは、のちの伊藤博文、伊藤俊輔の力士隊と、遊撃隊などです。
  出発のときの言葉は、書く人で少しずつ違います。歴史街道は、馬に乗った高杉が、見送りの五卿に、「これより、長州男児の、肝っ玉を、お目にかけます」と叫んだと書きます。山口県観光連盟は、「長州男児の、腕前、お目にかけ申すべし」と書いています。
  一行は未明に、藩の新地会所を占拠し、高杉は海路で三田尻へ行って、藩の軍艦3隻を奪って戻りました。12月26日、藩の正規軍3,800が萩を出発し、年が明けた1月7日の未明、諸隊は絵堂で藩の軍を奇襲して、勝ちました。
