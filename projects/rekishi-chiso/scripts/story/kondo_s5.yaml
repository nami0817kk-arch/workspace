title: "近藤勇｜墓は、ひとつではない"
yt_title: "近藤勇の墓は、ひとつではない　板橋・三鷹・会津若松・岡崎、各地に残る墓と首塚"
description: |-
  1868年、板橋で斬首された新選組の局長、近藤勇。その墓や首塚とされる場所は、ひとつではありません。
  JR板橋駅の東口の前の墓は、1876年、新選組の生き残りの永倉新八が呼びかけて建てたもので、正面の近藤の名は、2文字の順が逆に彫られています。東京の三鷹市の龍源寺には、遺族や門弟がひそかに体を運んで葬ったという言い伝えの墓が、福島県会津若松市の天寧寺には、土方歳三が遺髪などを仮に埋めたと伝わる墓があります。愛知県岡崎市の法蔵寺には、首塚と伝わる場所があります。
  ただ、首や体がいまもそこにあると、当時の記録で確かめられた墓はありません。本編では、近藤勇がなぜ切腹ではなく斬首だったのかを、当時の記録で並べています。本編は概要欄のリンクからどうぞ。
