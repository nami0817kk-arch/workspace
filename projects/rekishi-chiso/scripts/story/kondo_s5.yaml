lines:
  # fact: kondo-61, kondo-66, kondo-68, kondo-69
- 語り: "新選組の局長、近藤勇の墓は、ひとつではない。東京にも、福島にも、愛知にも、墓や首塚とされる場所がある。"
  shot: D23_1
  tone: 強調
  pause: 0.12
  # fact: kondo-102, kondo-60
- 語り: "1868年4月25日、近藤は、板橋で斬首された。北区の解説では、胴体は、滝野川の、無縁塚に埋められた。"
  shot: D18_2
  tone: しみじみ
  pause: 0.12
  # fact: kondo-60, kondo-61
- 語り: "いまのJR板橋駅の東口の前。1876年、そこに墓が建つ。新選組の生き残り、永倉新八が呼びかけた。処刑から、8年後だ。"
  shot: D23_3
  tone: しみじみ
  pause: 0.12
  # fact: kondo-42, kondo-63
- 語り: "ところが、正面に彫られた近藤の名は、まさよしの2文字の順が、逆になっている。"
  shot: D23_4
  tone: 重い
  pause: 0.12
  # fact: kondo-66
- 語り: "東京の三鷹市の龍源寺。遺族や門弟が、ひそかに体を運んで葬った、という言い伝えの墓だ。"
  shot: IEND_5
  tone: しみじみ
  pause: 0.12
  # fact: kondo-68
- 語り: "福島県の会津若松の天寧寺。土方歳三が、遺髪などを、仮に埋めた、と伝わる。"
  shot: D24_6
  tone: しみじみ
  pause: 0.12
  # fact: kondo-69
- 語り: "愛知県の岡崎市の法蔵寺には、京都でさらされた首を、同志が持ち出した、と伝わる首塚がある。"
  shot: D22_7
  tone: しみじみ
  pause: 0.12
  # 本編 第7章の結び（fact なし、本編どおり）
- 語り: "けれど、首や体が、いまもそこにあると、当時の記録で確かめられた墓は、無い。"
  shot: D22_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第5〜6章・まとめ（kondo-22・27・54・55）
- 語り: "そもそも、近藤は、なぜ、切腹ではなく、斬首だったのか。"
  shot: D10_9
  tone: 疑問
  pause: 0.15
