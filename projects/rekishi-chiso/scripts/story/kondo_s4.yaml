  # fact: kondo-29, kondo-102
- 語り: "1868年4月25日、新選組の局長、近藤勇は、板橋で斬首された。総督府の決定は、斬首して、京都へ送る。"
  shot: D12_2
  tone: しみじみ
  pause: 0.12
  # fact: kondo-56
- 語り: "塩漬けだった、という話も、1906年の本に残る。板橋で、運ばれる首に出会った女性の話だ。"
  shot: D20_3
  tone: しみじみ
  pause: 0.12
  # fact: kondo-21
- 語り: "京都の刑法官で樽を開けると、首は、まだ生きているようで、役人たちは不思議がった、と記録は書く。"
  shot: D16_4
  tone: 重い
  pause: 0.12
  # fact: kondo-50
- 語り: "太政官日誌によれば、首は、京都の三条河原で、3日間、さらされた。"
  shot: Sanjo_5
  tone: 重い
  pause: 0.12
  # fact: kondo-51
- 語り: "そばの札は、甲州勝沼と武州流山で、官軍に敵対した、大逆だ、と記す。"
  shot: D19_6
  tone: しみじみ
  pause: 0.12
  # fact: kondo-52
- 語り: "当時の中外新聞は、見た人は誰もが、惜しい壮士だ、と言っている、と書いた。"
  shot: D21_7
  tone: しみじみ
  pause: 0.12
