# 字幕では読点が消えるので「甲州勝沼と武州流山」は「と」でつなぐ。
# 理解テスト：①近藤勇の首の話 ②1868年、板橋から京都へ。三条河原 ③樽に入れて運ばれ、3日間さらされた ④そのあとの行方は当時の記録では途切れる
title: "近藤勇｜首は樽で京都へ運ばれた"
yt_title: "近藤勇の首は、強い酒に浸した樽で京都へ運ばれた　三条河原に3日間、見た人は「惜しい壮士」と言った"
description: |-
  1868年、板橋で斬首された新選組の局長、近藤勇。北島秀朝の記録によれば、首は強い酒に浸して樽に納められ、京都へ運ばれました。塩漬けだった、という話も1906年の本に残っています。
  太政官日誌によれば、首は京都の三条河原で3日間さらされました。当時の中外新聞は、見た人は誰もが「惜しい壮士だ」と言っている、と書いています。京都で首を見た依田学海は、場所を三条ではなく四条の河原と書きました。
  本編では、首がそのあとどこへ行ったのか、各地に残る首塚と墓を、記録と伝えに分けて並べています。本編は概要欄のリンクからどうぞ。
