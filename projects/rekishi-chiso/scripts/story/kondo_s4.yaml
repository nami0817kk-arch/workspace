- 語り: "京都で首を見た依田学海は、場所を、三条ではなく、四条の河原と書いている。"
  shot: Shijo_8
  tone: しみじみ
  pause: 0.12
  # fact: kondo-39
- 語り: "前に笑って話した時を思い出し、学海は、しばらく悲しみにくれた。"
  shot: D21_9
  tone: しみじみ
