# 切り口：首は強い酒に浸した樽で京都へ運ばれ、三条河原にさらされた（本編 第7章、kondo-21・39・50・51・52・56・100）。
# hook＝首は樽で京都へ運ばれた（出どころ：北島秀朝の記録）。
