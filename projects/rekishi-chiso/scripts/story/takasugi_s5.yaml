# 事実カード（dev/output/rekishi-chiso/research/高杉晋作_facts_20261029.yaml）：takasugi-33・34・35
#   ・梅溪昇『人物叢書 高杉晋作』302頁は本そのものを開いていない（個人ブログが引用）→ 「個人のブログが引用している」と言う（本編と同じ）。
#   ・南アルプス市立図書館 2012（takasugi-33）・山口県観光連盟（takasugi-35）は出どころの名を言う。直筆は残っていない（takasugi-36）。
#   ・上の句と下の句の本文は 南アルプス市立図書館の回答（調べた本のどれも下の句は望東尼が続けた点が共通）。
# 理解テスト4問：
#   ①誰の話か：高杉晋作の、辞世の句として知られる「おもしろきこともなき世を、おもしろく」
#   ②何が問題か：いつ詠まれたかの記録が3つに割れる（1867年4月14日の病床／1866年10月の桜山／慶応2年の歌の中の一首）
#   ③誰が付けたか：下の句は野村望東尼が続けた、という点は調べた本のどれも共通する
#   ④どうなったか：記録はそろっていない。辞世かどうかも確かめられない
title: 高杉晋作｜「おもしろきこともなき世を」の句は、いつ詠まれたのか
yt_title: 高杉晋作「おもしろきこともなき世を」はいつ詠まれた？　記録が3つに割れる辞世の句
description: |-
  「おもしろきこともなき世を、おもしろく」。高杉晋作の辞世の句として知られています。上の句を高杉が詠み、野村望東尼が、「住みなすものは、心なりけり」と、下の句を付けた、と語られてきました。
  南アルプス市立図書館が2012年にレファレンス協同データベースへ載せた回答は、慶応3年4月14日、高杉が病床で上の句を書いた、とします。山口県観光連盟は、1866年の10月、桜山で療養していた高杉を望東尼が見舞ったときの合作、と書きます。梅溪昇さんの『人物叢書 高杉晋作』は、慶応2年の歌の中の一首で、臨終の作とはいえない、と書いている、と個人のブログが引用しています。
  記録は、そろっていません。南アルプス市立図書館の回答は、下の句を望東尼が続けた点は、調べた本のどれも共通する、と書いています。
