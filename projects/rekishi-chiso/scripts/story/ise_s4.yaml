# 理解テスト：①東海道の大井川を渡る代金の話 ②江戸時代の大井川（島田と金谷） ③旅人は川会所で、その日の深さで値段の決まった川札を買い、肩車か連台で人足に担がれた ④いちばん浅い日で1枚48文、136センチを超えると川留め
title: "伊勢参り｜大井川の渡り賃"
yt_title: "大井川を渡る代金は、その日の水の深さで決まった　いちばん浅い日で川札1枚48文　136センチを超えると川留め"
description: |-
  江戸時代の東海道の大井川では、旅人は川越人足に担がれて川を渡りました。旅人は川会所で、その日の水の深さで値段の決まった川札を買い、肩車か、板の台に乗る連台かを選んで、要る枚数を人足に渡しました。
  島田市博物館によると、いちばん浅い、股のあたりまでの深さで、川札1枚が48文。ふだんの深さはおよそ76センチで、136センチを超えると川留めになりました。1845年に伊勢へ向かった農民、田中国三郎の7日目の出費492文には、川越人足の代が入っています。
  本編では、伊勢までの1日ずつの出費と、七里の渡しや伊勢の御師の宿まで、たどっています。本編は概要欄のリンクからどうぞ。
