  pause: 0.12
  # fact: sakokuif-42
- 語り: "イギリス東インド会社の船、リターン号。リターンとは、英語で、戻ること、という意味だ。"
  shot: B01_2
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-40
- 語り: "イギリスは、50年ほど前、平戸の商館を、自分から閉じて、日本を去っていた。"
  shot: B23_3
