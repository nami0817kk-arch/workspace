  pause: 0.12
  # fact: sakokuif-42
- 語り: "長崎にいたのは、イギリス側の日付で、6月29日から8月28日まで。およそ2か月だ。"
  shot: B20_4
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-43
- 語り: "幕府の答えは、断る。1911年のブリタニカによると、理由は、国王チャールズ2世が、ポルトガルの王女と結婚していることだった。"
  shot: B24_5
  tone: 重い
  pause: 0.12
  # fact: sakokuif-43
- 語り: "1924年の英語の雑誌は、この理由は、オランダが巧みに吹き込んだもの、と書く。"
  shot: B10_6
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-44
- 語り: "ところが2017年、研究者のカレンさんは、オランダの工作が原因だという見方には、史料の裏付けがない、と指摘した。"
  shot: B16_7
