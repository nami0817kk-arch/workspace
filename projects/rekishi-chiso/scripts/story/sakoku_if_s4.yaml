# 物語完結型ショート もしも鎖国 s4（2026-11-17）。本編 scripts/sakoku-if-story.yaml（11/21 19:00 公開予定、https://youtu.be/7dL7AYzb7zI）から。11/22 17:30 に予約。
# 形式は titanic_s1〜s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/鎖国if_facts_20261116.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/sakoku_if/main/ の B01〜B25・T01）の切り出しだけ。新しい絵は作らない。B22（西洋船に見える）は使わない。B23（イギリスの旗）はイギリスの話だけ。処刑・惨状・顔は絵にしない。
# 切り口：1673年、イギリスのリターン号は、国王の結婚相手を理由に断られた。オランダの工作説には、カレン（2017）が史料の裏付けなしと指摘（本編 第5章）。
# 計算（自分で数え直した）：平戸を去ったのは1623（国会図書館は1624）→1673＝およそ50年（年は言わず「50年ほど前」）。6月29日→8月28日＝60日（両端で61日）→「およそ2か月」。
# 岩生成一の「もしも」は本編へ誘う問いに残す（答えは言わない）。
title: "リターン号｜イギリス船は、国王の結婚相手で断られた"
yt_title: "1673年、長崎に来たイギリス船リターン号は、国王の結婚相手を理由に断られた　「オランダが吹き込んだ」説は本当か"
description: |-
  1673年の夏、イギリス東インド会社の船、リターン号が長崎に入り、貿易の再開を求めました。イギリスは、その50年ほど前、平戸の商館を自分から閉じていました。
  幕府の答えは、断る。1911年のブリタニカによると、理由は、国王チャールズ2世がポルトガルの王女と結婚していることでした。この理由はオランダが吹き込んだ、とする雑誌もありますが、2017年に研究者のカレンさんは、史料の裏付けがないと指摘しています。
  日本の歴史家が考えた「もしも」は、本編で。本編は概要欄のリンクからどうぞ。
  https://youtu.be/7dL7AYzb7zI
