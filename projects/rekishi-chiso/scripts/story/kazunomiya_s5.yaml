lines:
  # fact: kazunomiya-02
  - 語り: 皇女和宮の骨には、左の手首から先が、無かった。そこから、いくつもの《!物語》が生まれた。
    shot: W01f
    tone: 強調
  # fact: kazunomiya-03
  - 語り: 明治10年、1877年。和宮は、箱根の塔ノ沢で療養中に、脚気で亡くなった。
    shot: Tonosawa
    tone: 重い
    pause: 0.12
  # fact: kazunomiya-30, kazunomiya-06
  - 語り: 昭和33年、増上寺の発掘で、和宮の骨が調べられた。岩波明さんの2021年の記事が、その結果を紹介している。
    shot: W01
    tone: しみじみ
    pause: 0.12
  # fact: kazunomiya-06, kazunomiya-38
  - 語り: 和宮の身長は、143.4センチ。小柄な女性だった。骨に、刃の跡や病の跡は、無かった。
    shot: W15
    tone: しみじみ
    pause: 0.12
  # fact: kazunomiya-02
  - 語り: ただ、《左の手首》から先の骨だけが、見つからなかった。
    shot: W15
    tone: 重い
    pause: 0.3
    dip: true
  # fact: kazunomiya-40
  - 語り: 発掘のさなか、名乗らない女性から、手紙が届く。和宮は箱根の山で賊に襲われ、自害した、と。
    shot: W10
    tone: しみじみ
    pause: 0.12
  - 語り: けれど、骨に、刃の跡は無い。
    shot: W14b
    tone: 強調
    pause: 0.12
  # fact: kazunomiya-39
  - 語り: 和宮は別人だった、という替え玉の話は、有吉佐和子の1978年の小説が描いたものだ。
    shot: W06
    tone: しみじみ
    pause: 0.12
  # fact: kazunomiya-39
  - 語り: 岩波さんの記事も、替え玉説は信ぴょう性が薄い、とする。左手首が無い理由は、書かれていない。
    shot: W01
    tone: しみじみ
    pause: 0.15
  - 語り: あなたは、見つからない骨から、物語が生まれるのを、どう《思いますか》。
    shot: W06q
    tone: 疑問
    pause: 0.15
