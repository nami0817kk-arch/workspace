# 物語完結型ショート 和宮 s5（2026-10-29）。本編 scripts/kazunomiya-story.yaml の第5章（塔ノ沢の死と、骨が語ったこと）から。ガラス板の話（s1）は入れない。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/kazunomiya/main/W*.jpg）と実在の絵（塔ノ沢の版画・広重の増上寺・和宮の肖像）。
# 事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml）：kazunomiya-03・41・30・06・38・02・40・39
#   ・骨の調べ（身長・左手首・刃の跡が無い）は鈴木尚『骨は語る』を岩波明（ビジネスジャーナル 2021）が紹介したもの → 語りで岩波さんの名と年を言う。
#   ・替え玉の話は有吉佐和子の小説『和宮様御留』（1978、kazunomiya-39）。岩波さんの記事も信ぴょう性が薄いとする。
#   ・墓・棺・遺骨の中は描かない。左手首・骨の行に手や骨の絵を当てない（本編の look と同じ）。W01 は発掘の遠景。
#   ・「和宮とされる肖像」（kazu_portrait_small）は本人か疑う説があるので替え玉の行には当てない（使わない）。享年は「満31歳」だけ。
# 理解テスト4問：
#   ①誰の話か：和宮の最期と、その骨
#   ②いつ・どこで何が：1877年9月2日、箱根の塔ノ沢で脚気で亡くなり、夫と同じ増上寺に葬られた。1958年の発掘で骨が調べられた
#   ③何が分かったか：身長143.4センチの小柄な女性。刃の跡や病の跡は無い。ただ、左の手首から先の骨が見つからなかった
#   ④どうなったか：「箱根で賊に襲われ自害した」という匿名の手紙、替え玉の話（有吉佐和子の小説）が生まれた。骨は手紙を裏づけず、替え玉説も信ぴょう性が薄い。左手首の理由は記事にも書かれていない
title: 和宮｜見つからなかった左手首
yt_title: 皇女和宮の骨に、左の手首から先が無かった　そこから生まれた替え玉の話
description: |-
  明治10年、1877年の9月2日。和宮は、箱根の塔ノ沢の温泉で療養中に、脚気で亡くなりました。墓は、夫の家茂と同じ、芝の増上寺に建てられたとされます。
  昭和33年、1958年。増上寺の発掘で、和宮の骨が調べられました。人類学者の鈴木尚の調べを、精神科医の岩波明さんが2021年の記事で紹介しています。身長143.4センチの小柄な女性で、骨に刃の跡や病の跡はありませんでした。ただ、左の手首から先の骨が、見つかりませんでした。
  発掘のさなか、名乗らない女性から「和宮は箱根の山中で賊に襲われ、自害した」という手紙が届きます。替え玉の話を描いたのは、有吉佐和子の1978年の小説『和宮様御留』でした。岩波さんの記事も、替え玉説は信ぴょう性が薄いとしています。
