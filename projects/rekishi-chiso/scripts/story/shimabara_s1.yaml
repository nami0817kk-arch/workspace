lines:
  # fact: shimabara-64, shimabara-10
  - 語り: 島原の乱で、原城に立てこもった人は、何人だったのか。攻めた側の記録でさえ、《!1万4千人》から、5万人以上まで、食い違う。
    shot: P01
    tone: 強調
    pause: 0.12
  # fact: shimabara-64
  - 語り: 熊本藩の細川家に残る、寛永15年2月4日付の覚書。捕虜の話では、城の中は、5万とも、6万とも。
    shot: Siege
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-64
  - 語り: けれど、書き手は、男も女も合わせて、1万4千から1万5千ほどだろう、と見た。
    shot: P10
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-09
  - 語り: よく言われる、3万7千人。辞典の項に、内訳がある。島原半島から2万4千人余、天草から1万3千人余だ。
    shot: Siege2
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-09, shimabara-78
  - 語り: ところが、同じ項に、「計2万数千人とも」という、別の数も並んでいる。
    shot: P12
    tone: 重い
    pause: 0.12
  # fact: shimabara-10（3万7千の出どころは本編 第5章 6）
  - 語り: 3万7千人を、最初に数えた史料は、私たちの調べでは、たどれなかった。
    shot: P08
    tone: 重い
    pause: 0.12
  # fact: shimabara-64
  - 語り: 細川家の覚書は、最後に「推量仕り候」と付ける。つまり、見積もりだ。
    shot: P10
    tone: しみじみ
    pause: 0.12
  # fact: shimabara-44, shimabara-64
  - 語り: 数え切れなかった城の、数え切れなかった人たち。約400年たったいまも、確かめられていない。
    shot: P14
    tone: 重い
    pause: 0.3
    dip: true
  # fact: （本編へ）
  - 語り: では、その数の分からない城を、幕府は、なぜ、3か月近く、落とせなかったのか。
    shot: P01
    tone: 疑問
    pause: 0.15
