# 物語完結型ショート 島原・天草一揆 s1（2026-10-31）。本編 scripts/shimabara-story.yaml 序章・第5章（城の中には、何人いたのか）から。11/3 19:00 公開の本編 → 11/4 9:30 に投稿。
# 形式は yoritomo_s1.yaml・jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。戦闘・遺体・炎の絵なし（絵は本編の AI 絵 P01〜P15＝景色と物だけ、と実在の絵図）。
# 切り口：城の中の人数の食い違い（細川家の覚書・辞典・オランダ商館長日記）。鉛の十字架（s2）・上使の戦死（s3）・発端（s4）・オランダ船（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/shimabara_facts_20261030.yaml）：shimabara-09・10・44・64・78。数字は本編の言い方のまま。
#   ・細川家の覚書の日付：本編どおり「寛永15年2月4日付」（旧暦。年は西暦に直さない）。
#   ・「3万7千人」の元の史料は私たちの調べでは辿れなかった（本編 第5章 6）→そのとおり言う。
# 理解テスト4問：
#   ①誰の話か：島原の乱（1637〜38年）で原城に立てこもった人たち。その人数
#   ②いつ・どこで何が：寛永15年2月4日付の細川家の覚書は、捕虜の話の5〜6万に対し、書き手は1万4、5千と見た。辞典は3万7千・2万数千など
#   ③何を選んだか／どう書いたか：書き手は聞いた数を信じず、「推量」と断って自分の見積もりを書いた
#   ④どうなったか：誰にも数えられておらず、約400年たったいまも確かめられていない
title: 島原の乱｜城の中に何人いたのか　誰にも数えられていない
yt_title: 島原の乱で原城に立てこもったのは何人か　記録は1万4千人から5万人以上まで割れる
description: |-
  島原・天草一揆（島原の乱、1637〜38年）で、原城に立てこもった人は何人だったのか。攻めた側の記録でさえ、1万4千人から5万人以上まで食い違っています。
  熊本藩の細川家に残る寛永15年2月4日付の覚書は、捕虜の話では城の中は5万、6万。けれど書き手は、男も女も合わせて1万4、5千だろうと見て、「推量仕り候」と付けています。後の辞典は、3万7千人、2万数千人と並べます。オランダ商館長の日記も、時期によって、数が変わります。3万7千人を最初に数えた史料は、調べた範囲ではたどれませんでした。
  数え切れなかった城の、数え切れなかった人たち。そして、この城を幕府は3か月近く落とせませんでした。その理由を探った本編は、概要欄のリンクからどうぞ。
hashtags: ['#島原の乱', '#日本史', '#原城']
