# 出どころは大谷亮吉『伊能忠敬』（1917）の翻刻を通した記述。原日記は未確認なので「大谷は書く」「日記には〜とある」と言う。奥宮正樹の読みは未確認のため名前は語らない。
# 絵は本編の AI 絵（out/story/inou/main。人物なし）と実在の絵（パブリックドメイン）。新しい絵は作らない。
# 切り口：辞令の肩書「元百姓、浪人」と手当（本編1章）。大谷の読み（試みに）は「と読む」と言う。
# 計算：閏4月14日→19日＝5日後。1800年6月11日。数えで56歳。年を51歳と書いた話（inou-07）は本編に残し、tease にする。
# 理解テスト4問：①伊能忠敬 ②1800年、辞令の肩書は元百姓・浪人、手当は1日銀7匁5分 ③自費で行くと願い出た旅に手当がついた。大谷は「試みに」を腕を信じていない表れと読む ④5日後に出発。年を書付にどう書いたかは本編
title: "伊能忠敬｜辞令の肩書は「浪人」だった"
yt_title: "日本地図を作った伊能忠敬の辞令には「元百姓、浪人」とあった　手当は1日、銀7匁5分"
description: |-
  1800年、寛政12年の閏4月。蝦夷地の測量を自費でもやりたいと願い出た伊能忠敬に、幕府は辞令を出しました。肩書は「元百姓、浪人」。手当は1日に銀7匁5分、金に直すと2朱です。この文面と換算は、大谷亮吉『伊能忠敬』（1917年）が載せる辞令書と注によります。
  大谷は、手当は十分な便宜とは言えず、「試みに」という言葉も、幕府が忠敬の腕をまだ信じていなかった表れだと読みます。出発は辞令の5日後、1800年6月11日（旧暦閏4月19日）、数えで56歳でした。
  出発の朝、忠敬は幕府に出した書付に、自分の年をどう書いたのか。本編は概要欄のリンクからどうぞ。
