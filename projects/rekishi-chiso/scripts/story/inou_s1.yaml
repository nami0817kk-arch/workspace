lines:
- 語り: "日本地図を作った伊能忠敬の辞令には、元百姓、浪人、と書かれていた。"
  shot: Nihon
  tone: 強調
  pause: 0.12
  # fact: inou-01
- 語り: "では、幕府は、この男に、何を与えたのか。"
  shot: S12
  tone: 疑問
  pause: 0.15
  # fact: inou-01
- 語り: "1800年、寛政12年の閏4月。蝦夷地の測量を、自費でもやりたいと願い出た忠敬に、幕府は、辞令を出した。"
  shot: S10
  tone: しみじみ
  pause: 0.12
  # fact: inou-01
- 語り: "下総国佐原村の、元百姓、浪人、伊能勘解由。蝦夷地を、試みに測量させる。"
  shot: S10b
  tone: 重い
  pause: 0.12
  # fact: inou-01
- 語り: "手当は、1日に、銀7匁5分。大谷亮吉の本は、金に直すと、2朱にあたる、と注をつけている。"
  shot: S13
  tone: 重い
  pause: 0.12
  # fact: inou-01
- 語り: "大谷は、十分な便宜とは言えない、と書く。試みに、という言葉も、幕府が、まだ忠敬の腕を信じていなかった表れだ、と読む。"
  shot: S11
  tone: しみじみ
  pause: 0.12
  # fact: inou-02
- 語り: "辞令から5日後。1800年6月11日の朝、忠敬は、深川の仮住まいを出た。数えで56歳。"
  shot: P04
  tone: しみじみ
  pause: 0.12
  # fact: inou-06
- 語り: "付き従うのは、弟子が2人と、息子の秀蔵、下男が2人。忠敬を入れて、たった6人だった。"
  shot: Nihon2
  tone: しみじみ
  pause: 0.12
  # fact: inou-06
- 語り: "出発の朝、忠敬は、幕府に出した書付に、自分の年を、どう書いたのか。"
  shot: S15
  tone: 疑問
  pause: 0.15
  # fact: inou-07
