title: "江戸の牢屋敷｜吉田松陰が見た牢"
yt_title: "吉田松陰が1854年に見た江戸の牢　3つの牢だけで病で死ぬ人は毎日3人を下らない　揚屋や女牢ではごく少なかった"
description: |-
  1854年、江戸の小伝馬町の牢屋敷。異国の船に乗り込もうとした吉田松陰は、東口揚屋に入れられました。隣の東奥揚屋には佐久間象山、その先の東大牢には、一緒に船に乗り込もうとした金子重輔がいました。
  松陰の『野山雑著』によると、役付きは揚屋に6人、牢に12人。物相の飯を役付きには高く盛り、ほかの者には平らに盛りました。湯の日は、夏は月に6度、春と秋は5度、冬は4度。そして、東と西の二間牢と西の大牢の3つの牢だけで、病で死ぬ人は毎日3人を下らない、と書いています。揚屋と女牢と百姓牢では、牢で死ぬ人はごく少ない、とも。
  本編では、5年後に再びこの牢に入った松陰と、その遺書を守った囚人の話までたどっています。本編は概要欄のリンクからどうぞ。
