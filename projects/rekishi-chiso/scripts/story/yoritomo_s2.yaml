# 物語完結型ショート 源頼朝 s2（2026-10-30）。本編 scripts/yoritomo-story.yaml から（13年後の橋の修理の記事に初登場）。11/2 12:00 公開の本編 → 11/3 に投稿。
# 形式は musashi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「頼朝想像」「重成想像」は使わない）。
# 絵は本編の AI 絵（out/story/yoritomo/main/Q01〜Q15。人物は描かない）と実在の絵・写真（paintings/yoritomo_*）。新しい AI 絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/源頼朝_facts_20261029.yaml）：yoritomo-07・08・09・10・49
#   ・橋の修理の記事（建暦2年2月28日）は一次史料の翻刻・解説の2つで確認（07〜10）。「橋は不吉ではないと言い切るための説明だった」は本編の読み（「私たちは、そう読んだ」）。
#   ・「ほとぼりが冷めたころ」は nippon.com が紹介する一部の見方（49、出どころ1つ）→「見る人もいる」。確かな根拠は確かめられなかった。
# 理解テスト4問：
#   ①誰の話か：源頼朝の死と、『吾妻鏡』
#   ②いつ・どこで何が：1212年2月28日、頼朝の死の13年後、相模川の橋の修理の記事の中で、落馬と死が初めて書かれる
#   ③何と書いたか：橋は1198年に稲毛重成が造り、供養の日に頼朝が渡って落馬し亡くなった。評議は不吉と言い、将軍は不吉と言うな・早く修理せよと命じた
#   ④どうなったか：死の記述は、橋は不吉ではないと言い切る説明だった（私たちの読み）。13年後に書かれた理由は確かめられていない
title: 源頼朝｜落馬の話は、橋の修理の記事に、初めて出てくる
yt_title: 源頼朝の落馬と死は13年後、橋の修理の記事で初めて書かれた　吾妻鏡
description: |-
  源頼朝の落馬と死が、鎌倉幕府の歴史書『吾妻鏡』に初めて出てくるのは、亡くなってから13年後。建暦2年、1212年2月28日の、相模川の橋の修理の記事の中です。
  記事は、橋は1198年に稲毛重成が造り、供養の日に頼朝が渡り、帰りに落馬して、いくらも経たないうちに亡くなった、と書きます。評議の人たちは、どちらも吉事ではない、と言い、将軍は、橋を建てた過ちではない、不吉と言ってはならない、と命じました。
  頼朝の死が初めて書かれた場面は、橋は不吉ではない、と言い切るための説明だった。本編ではそう読みました。13年後に書かれたのは「ほとぼりが冷めたころ」と見る人もいますが、確かな根拠は確かめられませんでした。
