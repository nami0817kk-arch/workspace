# 形式は musashi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「頼朝想像」「重成想像」は使わない）。
# 絵は本編の AI 絵（out/story/yoritomo/main/Q01〜Q15。人物は描かない）と実在の絵・写真（paintings/yoritomo_*）。新しい AI 絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/源頼朝_facts_20261029.yaml）：yoritomo-17・18・20・21・43・56
#   ・暗殺説：『東鑑集要』の一文を nippon.com が根拠の一つとして紹介（21）。暗殺だったと言える史料は確かめられなかった。
#   ・『保暦間記』は南北朝のころの歴史書（本編と同じ）。歌舞伎『頼朝の死』は創作（20）。最も支持されるのは落馬の怪我か落馬の原因の病（56、和樂web、出どころ1つ）→「と紹介している」。
#   ・死の場面に人物の絵は当てない（本・橋・馬の遠景・石塔だけ）。
# 理解テスト4問：
#   ①誰の話か：源頼朝の死因
#   ②いつ何が：建久9年12月27日に体調を崩し、翌年1月13日に死んだことはほぼ確実（細川重男）
#   ③何と語られてきたか：亡霊を見て病んだ（保暦間記）・水神（承久記）・暗殺説（東鑑集要の一文）・歌舞伎の創作
#   ④どうなったか：暗殺と言える史料は見つからず、いま最も支持されるのは落馬の怪我か、その原因の病
title: 源頼朝｜死因で、確かなのは、2つの日付だけ
yt_title: 源頼朝の死因は何通りも語られてきた　亡霊・水神・暗殺説・歌舞伎　確かなのは2つの日付だけ
description: |-
  源頼朝は、なぜ亡くなったのか。確かなのは、2つの日付だけです。
  歴史学者の細川重男さんは、頼朝が建久9年12月27日に体調を崩し、翌年1月13日に死んだことは、ほぼ確実だと述べます。そのほかは、書かれた時代ごとに、違う姿で語られてきました。『保暦間記』は、義経らの亡霊を見て病んだ、『承久記』は「水神に領せられ」た、と書きます。江戸時代の『東鑑集要』の一文は、暗殺説を支える材料の一つにされてきましたが、暗殺だったと言える史料は、調べた範囲では見つかりませんでした。1932年初演の歌舞伎『頼朝の死』は創作です。
  いま最も支持されているのは、落馬による怪我、あるいは落馬の原因になった病気だと、和樂webは紹介しています。
