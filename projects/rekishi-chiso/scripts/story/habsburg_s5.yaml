title: "ハプスブルク｜「私も、そう思い始めている」"
yt_title: "「多くの人が、私は呪われていると言う。私も、そう思い始めている」　1698年の悪魔祓いと、呪われた王カルロス2世"
description: |-
  1698年9月、北スペインの修道院で、修道女に取りついた悪魔が祓われました。悪魔は、王が14歳のとき飲み物で呪われた、と答えたと伝わります。王とは、スペインのカルロス2世。宮廷では「呪われた王」と噂されていました。
  けれど、11月、その答えは取り消され、19世紀の歴史家ラフエンテは、王には何もなく先の話はうそだった、と書いています。1699年6月には、王本人に会って悪魔祓いをした修道士もいました。地方史の記事は、王が新しい宗教裁判所の長官に「多くの人が、私は呪われていると言う。私も、そう思い始めている」と語った、と伝えます（出どころは1つです）。
  1700年11月1日、王は38歳で亡くなります。王の死を待っていたヨーロッパは、王国をどうしようとしていたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/RnyhC0Qyirs
