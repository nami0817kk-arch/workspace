# 理解テスト4問：①藤原道長 ②1018年10月16日、三女威子が中宮に立った夜の宴 ③道長は実資に返歌を求め歌を詠み、実資は返歌せず「皆で吟じましょう」。歌を書き留めたのは道長の日記ではなく実資の『小右記』 ④道長は関白になっていないのに日記は御堂関白記と呼ばれる。なぜか（本編1章）
title: "藤原道長｜この世をばの歌を書き残した人"
yt_title: "「この世をば」の歌を書き残したのは道長ではない　1018年10月16日、三后の夜に何があったか"
description: |-
  1018年10月16日、藤原道長の三女、威子が後一条天皇の中宮に立ちました。一つの家から、后が3人。同じ時代の貴族、藤原実資は、日記『小右記』に「一家立三后、未曾有なり」と書きました。
  その夜の宴で、道長は実資に、和歌を詠むから返歌をしてほしい、と持ちかけます。詠まれたのが「この世をば、わが世とぞ思ふ、望月の、欠けたることも、なしと思へば」。実資は返歌をせず、皆で吟じましょう、とその場をおさめました。道長自身の『御堂関白記』は歌を書き留めておらず、歌が後世に知られたのは、実資の『小右記』によってです。
  道長は関白に一度もならなかったのに、なぜ、日記は『御堂関白記』と呼ばれるのか。本編は概要欄のリンクからどうぞ。
