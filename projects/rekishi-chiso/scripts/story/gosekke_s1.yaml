lines:
- 語り: "この世をばの歌を、書き残したのは、道長ではない。"
  shot: EmF
  tone: 強調
  pause: 0.12
  # fact: gosekke-04
- 語り: "では、誰なのか。"
  shot: J07a
  tone: 疑問
  pause: 0.15
  # fact: gosekke-01
- 語り: "10月16日。道長の三女、威子が、後一条天皇の、中宮に立った。"
  shot: EmG
  tone: しみじみ
  pause: 0.12
  # fact: gosekke-01, gosekke-02
- 語り: "一つの家から、后が3人。実資は日記『小右記』に、一家立三后、未曾有なり、と書いた。"
  shot: H07
  tone: 重い
  pause: 0.12
  # fact: gosekke-04
- 語り: "その夜の宴で、道長は実資に、歌を詠むから、返歌をしてくれ、と持ちかける。"
  shot: J07b
  tone: しみじみ
  pause: 0.12
  # fact: gosekke-03
- 語り: "詠まれたのが、この世をば、わが世とぞ思ふ、望月の、欠けたることも、なしと思へば。"
  shot: H09
  tone: 重い
  pause: 0.12
  # fact: gosekke-04
- 語り: "実資は、返歌をしなかった。皆で吟じましょう、と言って、その場をおさめた。"
  shot: EmF2
  tone: しみじみ
  pause: 0.12
  # fact: gosekke-03
- 語り: "道長自身の『御堂関白記』は、この歌を書き留めていない。歌が後世に知られたのは、実資の日記によってだ。"
  shot: Diary
  tone: 重い
  pause: 0.12
  # fact: gosekke-06
- 語り: "道長は、関白に一度もならなかったのに、なぜ、日記は、御堂関白記と呼ばれるのか。"
