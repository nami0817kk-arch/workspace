# 物語完結型ショート 徳川埋蔵金 s5（2026-11-05）。本編 scripts/maizo-story.yaml（11/6 12:00 公開）の第8章（360万両の重さ）から。11/7 18:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/maizo/main/M*）だけ。
#   M08・M12・M13・M14・M15 は使わない（s1 の頭のとおり）。M04 は峰の頂が入らない端に寄せる（s2 の頭のとおり）。
# 切り口：360万両は運べる重さだったのか。二分金で数えると21.6トン、牛8頭で千両箱16箱の運び方なら牛1,800頭。
#   本編の答え（軍艦の金）は言わない。最後の問いは「記録に残る、運ばれた幕府の金はどこへ」で本編へ。
# 事実カード：maizo-26（高崎市の冊子の7万両＝二分金14万枚＝420キロ）・maizo-62（八重野充弘が約30年前に聞いた、牛8頭に千両箱2箱ずつ）。
# 計算（自分で計算し直した。前提は語りで言う）：
#   二分金は2枚で1両・1枚3グラム（冊子の前提）。7万両×2＝14万枚、14万×3g＝420kg（冊子と合う）。
#   360万両×2＝720万枚、720万×3g＝2,160万g＝21.6トン（本編と合う）。
#   牛8頭×2箱＝16箱、16箱×1,000両（千両箱1つ千両として）＝1万6千両。360万÷1.6万＝225。牛8頭×225＝1,800頭（本編と合う）。
# 理解テスト4問：
#   ①誰の話か：徳川の埋蔵金として語られる360万両
#   ②何を確かめるか：二分金（2枚で1両・1枚3グラム）で数えた重さ
#   ③どうなるか：720万枚・21.6トン。聞き取りの牛8頭・千両箱16箱は1万6千両で360万両の225分の1、同じ運び方なら牛1,800頭
#   ④結論：金が運ばれた話は残るが、語られる額を運んだという記録には行き当たらない
title: 徳川埋蔵金｜360万両は、21.6トン
yt_title: 徳川埋蔵金の360万両は運べたのか　二分金で数えると21.6トン、牛なら1,800頭
description: |-
  徳川の埋蔵金として語られる360万両は、そもそも運べる重さだったのか。
  群馬県高崎市の冊子は、小栗忠順をめぐる噂の7万両を、二分金で14万枚、重さ420キロと計算しています。二分金は2枚で1両になる金貨で、1枚3グラム。同じ二分金で360万両を数えると720万枚、21.6トンになります。トレジャーハンターの八重野充弘さんは、約30年前に群馬で、幕末に牛8頭の背に千両箱を2箱ずつ積んだ一行が山へ向かった、と聞いたといいます。千両箱16箱は1万6千両で、360万両の225分の1。同じ運び方なら、牛が1,800頭いります。
  では、記録に残る、本当に運ばれた幕府の金は、どこへ向かったのか。本編は概要欄のリンクからどうぞ。
