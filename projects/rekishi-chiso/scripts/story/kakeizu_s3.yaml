# 物語完結型ショート 徳川将軍家 s3（2026-11-06）。本編 scripts/tokugawa-kakeizu-story.yaml（11/7 19:00 公開、https://youtu.be/VrUQJ4sBdyA）の第4章から。11/8 15:30 公開。
# 形式は oguri_s5.yaml（year のカード）を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/kakeizu/main。人物なし）と実在の写真・版画（貴族院議長の家達・1922年の家達・帝国議事堂の版画）。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：十六代様と呼ばれた家達は、総理大臣の話を受けたのか。ワシントン会議・オリンピック（本編5章）には踏み込まない。
# 事実カード：kakeizu-27・30・40・113。言い方は本編のまま。
#   ・貴族院議長 1903→1933＝30年（「およそ30年」）。本編どおり。
#   ・家達の言葉（サライ 2017、出どころ1つ）は「と伝わる」と、雑誌の名を言ってから言う。年鑑は「1933年の子ども向けの年鑑」（『児童年鑑 昭和9年』）。
# 理解テスト4問：
#   ①誰の話か：「十六代様」と呼ばれた徳川宗家16代、徳川家達
#   ②いつ・どこで何が：1903年から約30年、貴族院の議長。1914年、山本内閣の総辞職のあと、元老が次の総理に推した
#   ③何を選んだか：辞退した（十六代様と呼ばれるのも嫌がったと伝わる）
#   ④どうなったか：徳川内閣は未遂に終わった（原口大輔さんの博士論文）
title: 徳川家達｜「十六代様」は、総理を受けたのか
yt_title: 「十六代様」と呼ばれた徳川家達は総理大臣を受けたのか　1914年、元老が推した徳川内閣
description: |-
  将軍になるはずだった人として「十六代様」と呼ばれた、徳川宗家16代の徳川家達。総理大臣に推されたとき、受けたのでしょうか。
  家達は1903年に貴族院の議長になり、およそ30年その席にいました。1933年の子ども向けの年鑑は、慶喜のあとを継いで将軍となるはずだった人なので十六代様という、と紹介しています。けれど本人は、そう呼ばれるのを嫌がったと伝わり、雑誌サライのウェブの連載によれば「慶喜は徳川をつぶした人、私は建てた人」と話していました。1914年、山本権兵衛の内閣が総辞職すると、元老たちは次の総理大臣に家達を推します。家達はそれを辞退し、原口大輔さんの博士論文は、徳川内閣は未遂に終わったと書いています。
  議長の席を降りた家達を待っていた、もう1つの大きな役目とは。本編は概要欄のリンクからどうぞ。
