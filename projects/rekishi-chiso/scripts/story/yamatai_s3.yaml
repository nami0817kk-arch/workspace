# 物語完結型ショート 邪馬台国はどこ？ s3（2026-11-07）。本編 scripts/yamatai-story.yaml（11/10 19:00 公開、https://youtu.be/cqLK1qEXpMw）の第4章（鏡）から。11/11 15:30 公開。
# 形式は shogun_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（Gemini）。新しい絵は作らない。
# 切り口：銅鏡百枚。平原遺跡の40面と国内最大の鏡、黒塚の33面と棺の中の1面、三角縁神獣鏡は中国から0面、黒塚は卑弥呼の時代と重なる測定なし。
#   鏡の点・順位には触れない。平原遺跡は「福岡県糸島市」とだけ言う（伊都国の名は出さない）。本編の答え（採点の1位・浮かび上がる場所）は明かさない。
#   tease の答えは第3章（絹：吉野ヶ里の縫い目のある絹）。
# 事実カード：yamatai-25・81・59・44・78・79・83。言い方は本編のまま。
#   ・倭の献上（男女10人と班布）は長さのため外した。
# 理解テスト4問：
#   ①誰の話か：魏の皇帝が卑弥呼に贈った銅の鏡百枚
#   ②どこから鏡が出たか：福岡県糸島市の平原遺跡で弥生の王の墓から40面、最大は直径46.5cm・約8kg。奈良の黒塚古墳で三角縁神獣鏡33面
#   ③何が意外か：黒塚の棺の中は別の種類の鏡1面だけ。三角縁神獣鏡は中国から1面も出ていない
#   ④どうなっているか：黒塚は古墳時代の前期で、卑弥呼の時代と重なる測定は示されていない
title: 卑弥呼｜百枚の鏡は、どこにあるのか
yt_title: 卑弥呼が受け取った「銅鏡百枚」はどこにあるのか　国内最大の鏡と、黒塚古墳の33面と棺の中の1面
description: |-
  魏の皇帝が卑弥呼に贈った、百枚の銅の鏡。それは、どこにあるのでしょうか。
  『魏志倭人伝』によれば、魏の皇帝は卑弥呼に、白い絹や金や刀を贈り、そして銅の鏡を百枚贈りました。鏡が多く出たのは、福岡県糸島市の平原遺跡。弥生の王の墓から銅鏡が40面出て、いちばん大きな鏡は直径46.5センチ、重さ約8キロ、国内でいちばん大きな銅鏡です。奈良の黒塚古墳では、三角縁神獣鏡が33面、棺を囲むように並べられていました。ところが、棺の中の、葬られた人の上半身のそばにあったのは、別の種類の鏡が1面だけ。三角縁神獣鏡は卑弥呼の鏡と呼ばれてきましたが、中国からは1面も出ていません。
  では、倭の男は着物をほとんど縫わない、と魏志は書きました。縫い目のある絹の布は、どこから出たのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#卑弥呼', '#邪馬台国', '#日本史']
