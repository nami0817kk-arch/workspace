# 計算（自分で計算し直した）：1569〜1598年＝30年。858,454×11＝9,442,994（ベーリンガーの検算と一致）＝944万2994。11世紀分＝およそ1100年分。
#   900万÷4万5千＝200、900万÷4万＝225、944万÷4万5千≒210 →「200倍以上」。推計は人ごとに言う（レヴァック 6万→4万5千・ベーリンガー 3万以上・モンター 約4万）。
# 理解テスト：①魔女狩りの処刑の数「900万人」の話 ②1784年、ドイツの町クヴェードリンブルクの法律顧問フォイクトが雑誌の論文で出した
#   ③町の30年の記録の割合を、ヨーロッパ全体と約1100年分に掛け合わせた ④今の研究者の推計は3万〜6万人ほどで、200倍以上違う
title: "魔女狩り｜900万人という数"
yt_title: "魔女狩りの「900万人」は、1784年の1人の法律家の掛け算から生まれた　今の研究者の推計は4万人ほど"
description: |-
  魔女狩りで殺されたのは900万人。そう語られてきた数は、1784年、ドイツの町クヴェードリンブルクの法律顧問フォイクトが、雑誌の論文で出した計算から始まりました。
  フォイクトは、町の1569年から1598年までの30年間の記録をもとに、記録の無い時代にも同じ割合で処刑があったと仮定し、人口の割合でヨーロッパ全体に広げて、およそ1100年分を掛け合わせました。出てきた数は944万2994人。1869年、グスタフ・ロスコフがこれを約900万と丸めて広めました（W・ベーリンガー、1998年による）。
  今の研究者の推計は、ずっと少ない数です。B・レヴァックは最大6万人から、およそ4万5千人に下げ、ベーリンガーは少なくとも3万人、W・モンターはおよそ4万人と見ています。
  本編では、1612年のペンドルの魔女裁判を軸に、ドイツとスペインの記録もたどって、魔女を裁いたのは誰だったのかを確かめています。本編は概要欄のリンクからどうぞ。
