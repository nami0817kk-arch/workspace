  # fact: majogari-33
- 語り: "書いたのは、ドイツの町、クヴェードリンブルクの法律顧問、フォイクト。"
  shot: W25_2
  tone: しみじみ
  pause: 0.12
  # fact: majogari-33
- 語り: "フォイクトは、町の、1569年から1598年までの、30年間の記録をもとに、記録の無い時代にも、同じ割合で処刑があった、と仮定した。"
  shot: W09_3
  tone: しみじみ
  pause: 0.12
  # fact: majogari-33
- 語り: "そして、人口の割合で、ヨーロッパ全体に広げ、およそ1100年分を、掛け合わせた。出てきた数は、944万2994人。"
  shot: W25_4
  tone: 強調
  pause: 0.12
  # fact: majogari-34
- 語り: "1869年、グスタフ・ロスコフが、これを、約900万と丸めて、広めた。"
  shot: W16_5
  tone: しみじみ
  pause: 0.12
