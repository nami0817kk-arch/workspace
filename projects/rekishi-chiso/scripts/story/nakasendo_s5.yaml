# 向き：日記は近江→江戸。江戸〜京都の日数は「日記の速さで計算した目安」と言い、だれかが江戸から京都へ歩いたとは言わない。
# hook＝江戸から京都まで中山道で何泊何日か（答えはこのショートの中：目安でおよそ13日・12泊）。
# tease＝12泊の宿代は今のお金でいくらか（答えは本編 まとめ：1,776文、約3万円、naka-05・68）。
# 数え直し：高宮119里28町8間−鴻巣12里8町＝107里20町8間（422.4km）÷10日＝10里27町（42.2km）。
#   日本橋→三条大橋 135里34町10間＝135.95里÷10.756里＝12.6日→「12日と半日あまり」「およそ13日」（12泊）。中山道526km−東海道492km＝34km→「30キロあまり長い」。
#   谷釜 2020：39編の平均 34.1km。
# 理解テスト：①中山道の江戸〜京都の日数の話 ②1835年の近江の商人の日記（高宮〜鴻巣の10日） ③1日平均10里27町（約42キロ）の速さで数える ④およそ13日・12泊。東海道の13〜15日とほとんど同じ（目安）
title: "中山道｜江戸から京都まで何泊何日"
yt_title: "中山道を江戸から京都まで歩くと、何泊何日？　1835年の近江の商人の日記の速さで数えると、およそ13日"
description: |-
  中山道は、江戸の日本橋から木曽路を通って、京都の三条大橋へ向かう道です。国土交通省の解説で135里34町あまり、およそ526キロ。東海道より30キロあまり長い山の道です。東海道は歩いて13日から15日ほどとされますが、中山道には何日という決まった答えが見当たりません。
  手がかりは、近江の日野の商人、西村安則の『木曾日記』です。1835年5月4日に日野を出て、中山道を東へ、武蔵の吉川の店へ向かいました。泊まった宿場の間を宿村大概帳の道のりで測ると、高宮から鴻巣までの10日で107里あまり、1日の平均は10里27町、およそ42キロ。旅日記39編を調べた研究の平均、34.1キロより速い足です。
  この速さで日本橋から三条大橋までを歩くと、12日と半日あまり。およそ13日、12泊の旅になります。日記の速さで計算した目安です。
  本編では、安則の旅を、峠と宿代とともに宿場ごとに追っています。本編は概要欄のリンクからどうぞ。
