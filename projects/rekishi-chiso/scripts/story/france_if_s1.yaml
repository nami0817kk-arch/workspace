# 物語完結型ショート フランス革命（もしも）s1（2026-11-05）。本編 scripts/france-if-story.yaml（11/5 12:00 公開、https://youtu.be/0InK0OydYHM）から。切り口：バスティーユの囚人は7人だけ／国王の日記は「なし」
# 形式は kurofune_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。戦闘・負傷・死の絵なし（ウエルの絵は塔と煙だけを切り出す）。
# 絵は本編の AI 絵（out/story/france-if/main/F01〜F16。人物の顔は描かない）と実在の絵（paintings/france_*）。新しい絵は作らない。F14（遠くにエッフェル塔が見える）・F04（偽の字）は使わない。
