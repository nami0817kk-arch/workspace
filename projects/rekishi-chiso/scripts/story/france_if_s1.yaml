# ・計算のやり直し：7人＝偽造4＋心を病んだ2＋伯爵1（4＋2＋1＝7）。本編どおり。
# ・ファンク・ブレンターノの本は本編どおり「19世紀の終わりの本」と言う（原書 1898年・英訳 1899年で年を言い切らない）。
# ・日記の「なし」の説明は本編どおり「狩りが無かった印」（ニコラルド 1873年）。「獲物が無かった」説は言わない。
# ・35か条（s2）・トクヴィル（本編）は入れない（同じ事実を2本に出さない）。
# 理解テスト4問：
#   ①誰の話か：1789年7月14日のバスティーユと、そこにいた7人の囚人、国王ルイ16世
#   ②いつ・どこで何が：1789年7月14日、パリの民衆がバスティーユを攻め落とした。中の囚人は7人だった
#   ③7人は誰だったか：偽造の罪の4人・心を病んだ2人・家族の願いで閉じ込められたソラージュ伯。襲った側の死者は98人と数えられた
#   ④どうなったか：国王の日記の7月14日は「なし」（狩りが無かった印）。もしも革命が起きなかったら、を問いで閉じる
title: バスティーユ｜攻め落とした牢獄に、囚人は7人しかいなかった
yt_title: バスティーユ襲撃の日、牢獄にいた囚人は7人だけ　国王の日記の7月14日は「なし」
description: |-
  パリの民衆が攻め落としたバスティーユの牢獄に、囚人は、たった7人しかいませんでした。
  1789年7月14日。研究者のファンク・ブレンターノは、19世紀の終わりの本で、そこにいた7人の名前を挙げています。偽造の罪の4人、心を病んだ2人、そして家族の願いで閉じ込められていたソラージュ伯です。同じ本では、襲った側の死者は98人と数えられています。その日、国王ルイ16世の日記の7月14日の欄には、ひとこと「なし」とあります。日記を活字にした人は、狩りが無かった印だと説明しています。
  もしも、フランス革命が起きなかったら。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
