# 物語完結型ショート 土方歳三 s1（2026-10-29）。本編 scripts/hijikata-story.yaml の序章と第4章（写真を運んだ少年・市村鉄之助）から。
# 形式は masamune_s1.yaml・kazunomiya_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/hijikata/main/J*.jpg）と実在の写真（洋装の写真・箱館の旧幕府軍の写真）。
#   この回の決まり：AI 絵の土方は後ろ姿か横顔の影だけ（実在の写真の土方に似せない）。顔が分かるのは実在の写真の額だけ。亡骸・戦の場面は描かない。
# 事実カード（dev/output/rekishi-chiso/research/土方歳三_facts_20261029.yaml）：hijikata-01・83・11・78・10
#   ・形見を届けよと命じた→大垣市立図書館の調べ（hijikata-01）、紙きれの言葉→子孫の土方愛さんの話（和樂web 2021）→ 出どころを語りで言う。
#   ・遺髪は出どころに無いので言わない（「写真などの形見」まで）。13歳で入隊（hijikata-83、和樂web）。
#   ・かくまわれたのは和樂web（hijikata-78）。本編に後から足した熊吉の行・愛さんの恋文の束は使わない。
# 理解テスト4問：
#   ①誰の話か：土方歳三の洋装の写真を運んだ少年、市村鉄之助
#   ②いつ・どこで何が：1869年、箱館で土方が鉄之助に、写真などの形見を日野の佐藤家へ届けるよう命じた
#   ③何を託したか：写真と「この者の身の上を、お頼み申します」と書いた紙きれ。写真だけでなく少年の身も頼んでいた
#   ④どうなったか：写真は1869年7月に日野へ届いた（土方はその2か月前に亡くなっていた）。鉄之助は日野の親類の家に数年かくまわれ、写真は今も日野に伝わる
title: 土方歳三｜洋装の写真を運んだ少年に添えられた一行
yt_title: 土方歳三の洋装の写真は、少年が箱館から運んだ　添えられていた「身の上をお頼み申します」
description: |-
  新選組の副長、土方歳三。よく知られた洋装の写真は、ひとりの少年が箱館から、ふるさとの日野まで運んだものでした。少年の名は、市村鉄之助。1867年、13歳のとき、兄とともに新選組に入った隊士です。
  大垣市立図書館の調べによれば、土方は鉄之助に、写真などの形見を日野の佐藤家へ届けるよう命じました。写真には、土方が書いた紙きれが添えられていた、と子孫の土方愛さんは語っています。「この者の身の上を、お頼み申します」。
  佐藤彦五郎新選組資料館の目録によれば、写真が日野に届いたのは1869年7月。土方は、その2か月前に箱館で亡くなっていました。鉄之助は、日野の親類の家に数年かくまわれた、と和樂webの記事は伝えています。
hashtags: ["#土方歳三", "#日本史", "#幕末"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
