# 理解テスト4問：
#   ①誰の話か：曹操の墓と発表された、河南省安陽の墓（2009年）
#   ②いつ・どこで何が：約1年の発掘。盗まれたあとの墓から、出た銭は3枚。石の札に「黄豆二升」「刀尺一」
#   ③それは何か：専門家は石牌を副葬品の目録（遣冊）と説明。「魏武王」と刻まれた石牌は8枚
#   ④どうなったか：曹操は遺令で「金玉珍宝を蔵むること無かれ」と命じていた。銭3枚・大豆二升の中身は、簡素に、の遺言を思わせる
title: 曹操の墓と発表された墓から出た、銭は3枚
yt_title: 曹操の墓から出た銭は、たった3枚　石の札に刻まれた「黄豆二升」と「魏武王」
description: |-
  2009年12月、中国の河南省文物局は、安陽の西高穴村で、「魏武王曹操高陵」が見つかった、と発表しました。
  中国新聞網が伝える潘偉斌さんの説明によれば、発掘は2008年12月中旬から、およそ1年。盗掘にあったあとの墓から出た銭は、わずか3枚でした。玉やメノウの飾り、金の糸、銀の環、雲母の薄片も出ています。
  石の札には、副葬品の名と数が刻まれていました。「黄豆二升」「刀尺一」。専門家は、副葬品の目録、遣冊の役目だと説明しています。「魏武王」と刻まれた圭の形の石の札は8件で、7件は発掘で出て、1件は盗掘した者から取り戻したものです。
  曹操は遺令で、「斂むるに時服を以てし、金玉珍宝を蔵むること無かれ」と命じていました（『三国志』武帝紀）。この墓を曹操の墓とすることには、異論もあります。
  写真：西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）
