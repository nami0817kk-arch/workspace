# 物語完結型ショート 元寇（もしも）s2（2026-10-31）。本編 scripts/genkou-if-story.yaml（11/3 12:00 公開、https://youtu.be/TfyxJjTTW9Y）から。切り口：同じ夜（1274年）の3つの記録の書き分け
# 形式は jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「時宗想像」「御家人想像」「季長想像」は使わない）。戦闘・負傷・遺体の絵なし。
# 絵は本編の AI 絵（out/story/genkou-if/main/G01〜G15。人物は描かない）と実在の絵（paintings/genkou_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/元寇_facts_20261030.yaml）：genkou-if-09・11・12・13・14
# ・本編の言い方のまま転記。『元史』『高麗史』の原文は中国語版ウィキソース所載の本文（本編と同じ）。『高麗史』の順番（引き上げが先・大風雨があと）は本編の第1章どおり。
# ・風があったかは言い切らない（問いで閉じる）。1万3500人は『高麗史』の書く数（14）。英語記事の「最大300隻」は使わない。
# 理解テスト4問：
#   ①誰の話か：1274年10月20日の夜、博多湾から去った元・高麗の船団の記録
#   ②いつ・どこで何が：その夜を『元史』は風なし、『高麗史』は大風雨（ただし引き上げが先）、『八幡愚童訓』は船が一艘もない、と書く
#   ③何が問題か：3つの記録の書き方が違う
#   ④どうなったか：高麗の軍は1万3500人あまりが帰らなかった。風が吹いたのか、自分で引き揚げたのかは問いで閉じる
title: 元寇｜同じ夜を、元・高麗・日本の記録が3通りに書いた
yt_title: 元寇の文永の役の夜を『元史』『高麗史』『八幡愚童訓』は3通りに書いた
description: |-
  1274年10月20日の夜、博多湾から船団が去りました。その夜を、3つの記録が、3通りに書いています。
  元の歴史書『元史』は、風に触れません。高麗の歴史書『高麗史』は、大風雨があった、と書きます。ただし、『高麗史』の順番では、引き上げが先で、大風雨はそのあとです。日本側の『八幡愚童訓』が書くのは、昨日の夕方まで海にひしめいていた賊の船が、一艘もなかった、ということだけです。この夜のあと、高麗の軍は1万3500人あまりが帰らなかったと、『高麗史』は書いています。
  風が吹いたのか。それとも、船団が、自分で引き揚げたのか。この問いを、記録の食い違いから掘り下げた本編は、概要欄のリンクからどうぞ。
