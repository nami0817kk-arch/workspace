title: "篤姫｜「3日だけ」のはずの立ち退き"
yt_title: "篤姫は「3日だけ」と言いくるめられて江戸城を出た　身の回りの物だけを持って、二度と戻らなかった"
description: |-
  江戸城を出るのを渋る篤姫を、老中たちは「3日間」だけと言いくるめて、ようやく承知させた、と昭和19年の『禁苑史話』は書いています。付き添いの女中たちも、着替えと化粧の道具くらいで出ていきました。
  1868年5月2日（慶応4年4月10日）、篤姫は一橋家の屋敷に移り、翌日、江戸城は官軍に引き渡されます。けれど、何日たっても、篤姫を訪ねてくる人も、知らせも、無かった。
  本編では、城を出たあとの15年あまりを、当時の新聞・勝海舟の談話・昭和の本でたどっています。本編は概要欄のリンクからどうぞ。
