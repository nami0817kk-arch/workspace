# 物語完結型ショート 高杉晋作 s2（2026-10-29）。本編 scripts/takasugi-story.yaml の第1章（23歳の上海）と第4章（オテントー丸）から。
# 形式は hijikata_s1.yaml・yodo_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「……日本を、こうしては、ならぬ」は使わない）。
# 絵は本編の AI 絵（T02・T05・T08。Gemini のみ）と実在の写真。この回の決まり：AI 絵の高杉は後ろ姿だけ。
# 事実カード（dev/output/rekishi-chiso/research/高杉晋作_facts_20261029.yaml）：takasugi-10・12・13・14・29
#   ・上海の見聞（takasugi-12）・五代才助と蒸気船（takasugi-13）は山口県観光連盟の解説が出どころ1つ → 「によれば」「という」。
#   ・船中で眠れなかった日記（takasugi-14）は Wedge ONLINE の引用1つ → 「と日記に書いたという」。
#   ・蒸気船を買ったのは上海の焦りが理由、とは史料にない → 「忘れていなかったのかもしれない」の推測の形にする（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：23歳の高杉晋作
#   ②いつ・どこで何が：1862年4月、幕府の船で長崎から上海へ渡り、中国人が西洋人に使われ、イギリス軍が孔子廟で休む様子を見た
#   ③何を思ったか：日本も同じ道をたどってはならないと危機感を抱き、蒸気船を持つ薩摩に対し長州の帆船2隻に焦りを覚えた
#   ④どうなったか：4年後の1866年3月21日、長崎で蒸気船のオテントー丸を、藩に無断で買った
title: 高杉晋作｜23歳で見た上海と、4年後に買った蒸気船
yt_title: 高杉晋作が23歳の上海で見たもの　蒸気船と帆船の差に焦り、4年後に藩に無断で船を買った
description: |-
  幕末の長州の高杉晋作は、1862年の4月、23歳で、幕府の船、千歳丸に乗って、長崎から上海へ向かいました。清国の情勢を探る旅でした。山口県観光連盟の解説によれば、高杉は上海で、中国人が西洋人に使われ、イギリス軍が孔子廟で休んでいる様子を見て、日本も同じ道をたどってはならない、と危機感を抱いたといいます。
  上海では、薩摩の五代才助、のちの五代友厚と親しくなりました。薩摩には蒸気船があり、長州の軍艦は帆船が2隻だけ。高杉は焦りを覚えた、と同じ解説は伝えています。
  それから4年後の1866年3月21日、高杉は長崎で、蒸気船のオテントー丸を、藩に無断で買いました。上海で見た蒸気船と帆船の差を、高杉は忘れていなかったのかもしれません。
