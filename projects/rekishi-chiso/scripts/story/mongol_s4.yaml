# 物語完結型ショート モンゴル s4（2026-11-07）。本編 scripts/mongol-if-story.yaml（11/10 12:00 公開）の第4章（なぜ引き返したのか）から。11/11 16:30 公開。
# 形式は columbus_s2.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」は最後の問いだけ（答えは本編の第5章）。
# 絵は本編の AI 絵（out/story/mongol-if/main/）と本編で使った実在の絵（元朝の皇帝の肖像のオゴデイ）だけ。
# 切り口：よく語られる理由はオゴデイの死（1241年12月11日、ジュヴァイニー）。けれど古い記録は理由を4通りに書く（カルピニ＝毒殺／集史＝死を挙げない・
#   カダンの軍に知らせは届かず／ロゲリウス＝大王たちの命令／マシュー・パリス＝皇帝フリードリヒの軍）。ポウは知らせが間に合ったかを疑う。バトゥは高原へ帰らなかった。
#   本編の答え（もしも去らなかったら、城の壁を越えられたのか＝第5章）は言わない。
# 事実カード：mongol-03・16・39・40・41。言い方は本編のまま。
# 計算（自分で計算し直した）：1241年12月11日→1242年3月末＝3か月あまり。4月8日→7月22日＝22+31+30+22＝105日≒3か月半。
# 理解テスト4問：
#   ①誰の話か：1242年にハンガリーから引き返したモンゴル軍（と大ハーン・オゴデイの死）
#   ②いつ・どこで何が：1241年12月11日にオゴデイが亡くなり、翌年3月末に軍はハンガリーを去りはじめた
#   ③何が割れているか：理由。古い記録は毒殺・死を挙げない・大王たちの命令・皇帝の軍と4通り。知らせが3か月あまりで届いたかも疑われる
#   ④どうなったか：バトゥは高原へ帰らず、1243年の末にヴォルガ川に戻った。理由は今も1つに決まらない。もしも去らなかったら城の壁を越えられたか、の問いで閉じる
title: なぜ引き返したのか｜理由は4通り
yt_title: モンゴル軍はなぜヨーロッパから引き返したのか　大ハーンの死、と言われるが、古い記録は理由を4通りに書く
description: |-
  モンゴル軍は、なぜヨーロッパから引き返したのでしょうか。よく語られる理由は、大ハーン、オゴデイの死です。ペルシアの歴史家ジュヴァイニーによれば、亡くなったのは1241年12月11日。次のハーンを決める大会議、クリルタイに出るため、王子たちは帰った、と説明されてきました。
  けれど古い記録は、理由をばらばらに書きます。プラノ・カルピニは、大ハーンが毒で殺されたので退いた。ロゲリウスは、大王たちの命令。マシュー・パリスは、皇帝フリードリヒの軍が追い出した。ペルシアの『集史』はオゴデイの死を理由に挙げず、ベーラ王を追ったカダンの軍には、死の知らせはまだ届いていなかった、と書きます。
  2012年、スティーブン・ポウの修士論文は、知らせが間に合ったのかを疑いました。12月の死から3月の撤退まで、3か月あまり。カルピニの一行は、ヴォルガ川のバトゥの陣から、モンゴル高原のグユクの陣まで、急いでも3か月半かかっています。しかもバトゥはモンゴル高原へ帰らず、ヴォルガ川に戻ったのは1243年の末でした。
  もしも去らなかったら、モンゴルは、ヨーロッパの城の壁を越えられたのか。本編は概要欄のリンクからどうぞ。
