# 物語完結型ショート コロンブス s4（2026-11-06）。本編 scripts/columbus-if-story.yaml（11/9 12:00 公開）の第5章・第8章（唐辛子）から。11/10 16:30 公開。
# 形式は hojo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。日本につながる入口の1本。
# 絵は本編の AI 絵（out/story/columbus-if/main/）と本編で使った実在の絵（南蛮屏風）だけ。
# 切り口：唐辛子はアメリカの作物で、1492年からわずか50年の1542年、ドイツのフックスは「インドのカリカットのこしょう」と呼んだ。
#   朝鮮の『芝峰類説』（1614年）は日本から入ったので倭芥子と呼ぶと書き、日本には朝鮮から来たという記録がある（ポルトガル人が伝えた記録とともに）。
#   本編の答え（さつまいもが何段階で来たか）は言わない。
# 事実カード：columbus-83・66。言い方は本編のまま。
# 計算：1542−1492＝50年。
# 理解テスト4問：
#   ①誰の話か：アメリカの作物、唐辛子（と、記録を書いたフックス・イ・スグァン）
#   ②いつ・どこで何が：1542年、ドイツのフックスがインドのこしょうと呼んだ／1614年、朝鮮の『芝峰類説』が日本から来たと書いた
#   ③何が食い違うか：日本の記録は朝鮮から来たと書く。互いに相手から来たと書いている
#   ④どうなったか：同じアメリカの作物、さつまいもは何段階で日本に来たか、の問いで閉じる（答えは本編）
title: 唐辛子｜日本と朝鮮で逆の記録
yt_title: 唐辛子は日本から朝鮮へ？朝鮮から日本へ？　1614年の『芝峰類説』と日本の記録は、互いに相手から来たと書いている
description: |-
  唐辛子も、さつまいもも、かぼちゃも、たばこも、アメリカの作物です。1492年のあと、唐辛子は驚くほど速く広まりました。1542年、ドイツの植物学者フックスは、これをインドのカリカットのこしょうと呼んでいます。1492年からわずか50年で、ドイツの学者でさえ、唐辛子をインドから来たものだと思っていたのです。
  朝鮮の学者イ・スグァンは、1614年の『芝峰類説』に、南蛮の唐辛子は日本から入ったので倭芥子と呼ぶ、と書きました。
  ところが日本には逆に、朝鮮から来たという記録が残っています。ポルトガル人が伝えたという記録とともにです。互いに、相手から来たと書いているのです。
  では、同じアメリカの作物、さつまいもは、何段階で日本に来たのか。本編は概要欄のリンクからどうぞ。
