# 物語完結型ショート 徳川埋蔵金 s1（2026-11-05）。本編 scripts/maizo-story.yaml（11/6 12:00 公開）の序章・第1章・第7章から。11/7 9:00 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。
# 絵は本編の AI 絵（out/story/maizo/main/M*。FLUX）と本編で使った実在の写真・屏風だけ。新しい絵は作らない。
#   使わない AI 絵：M08（洋風の窓と金具の長持）・M12（城の前に貨車＝時代違い）・M13（蒸気の軍艦＝本編の答えに近い）・M14（箱に偽の字）・M15（洋風のランプと製本の本）。M01 の左の偽の字の灯は切り出しで外す。
# 切り口：語られる360万両に対し、江戸城の金蔵の金銀の貨幣は最多でも171万7千両あまり（半分に届かない）。額は語り手ごとに動く。
#   本編の答え（大坂から江戸へ向かった軍艦の金）は言わない。軍艦も出さない。
# 事実カード（dev/output/rekishi-chiso/research/徳川埋蔵金_facts_20261105.yaml）：maizo-16・17・22・33・34・40・57。言い方は本編のまま。
# 計算（自分で計算し直した）：171.7万÷360万＝47.7%（半分の180万に届かない）。350万（1928 蜷川新）・250万（1933 広告）・400万（1982 水野智之の本の題）。
# 理解テスト4問：
#   ①誰の話か：徳川幕府の金（埋蔵金として語られる360万両）と、江戸城の非常用の金蔵
#   ②いつ・どこで何が：1868年、江戸城の明け渡しのとき金蔵は空だったと言われる。金蔵の金銀の貨幣は最多でも171万7千両あまり
#   ③何が分かるか：語られる額の半分に届かず、幕末には使い果たされていた。額も本ごとに350万・250万・400万と動く
#   ④どうなったか：360万両を初めて書いた記録には行き当たらない。では幕府の金はどこへ、の問いで閉じる
title: 徳川埋蔵金｜金蔵には、半分も無かった
yt_title: 徳川埋蔵金の360万両　江戸城の金蔵の貨幣は、いちばん多い時でも半分に届かなかった
description: |-
  徳川の埋蔵金は、360万両とも言われます。
  ところが、江戸城の非常用の金蔵、奥御金蔵の金と銀の貨幣は、いちばん多かった時でも171万7千両あまりだった、と財政史の飯島千秋さんの研究は書いています。しかも幕末には使い果たされていた、といいます。語られる額そのものも、1928年の本では350万両、1933年の新聞の広告では250万両、1982年の本の題では400万両と動きます。
  幕府の金は、どこへ消えたのか。5つの説を記録で採点した本編は、概要欄のリンクからどうぞ。
