title: 黒船｜オランダは、黒船の来航を一度は伏せた
yt_title: オランダは黒船の来航を一度は伏せた　1852年の予告と、取り合わなかった幕府
description: |-
  オランダは、一度は、黒船が来ることを、幕府に伏せると決めていました。
  1851年6月7日、バタヴィア（今のジャカルタ）のオランダの総督府は、日本人に無用の不安を与えないため、アメリカの計画を伏せると決めます。それが、1852年4月17日の協議で変わりました。アメリカが日本と衝突すれば、イギリスも黙っていない。中立のオランダも巻き込まれる。研究者のヘルマン・モースハルトさんは、オランダが恐れたのは、日本での自分の立場を失うことだった、と書きます。1852年7月21日に長崎へ着いた商館長ドンケル・クルチウスの書簡を、長崎奉行は一度は受け取らず、受け取ったのは9月。11月2日、幕府は、この件を終わったものとみなす、と伝えました。
  もしも、幕府がこの予告に取り合っていたら。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
