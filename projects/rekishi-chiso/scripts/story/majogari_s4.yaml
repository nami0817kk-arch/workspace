# 人形で焼いた話（獄死の5人）は残酷な細部に寄るので外した。人数はモンターの数で「およそ20数人」と「数百人」。
# 理解テスト：①スペインの異端審問官サラサールの話 ②1610年、ログローニョの異端審問所が11人に火刑の判決、1611年から北部の村を回った
#   ③人々の話を聞き、魔女は語られるまでいなかったと最高会議に報告した ④1614年、魔女を火刑にする道が事実上閉ざされ、その後は魔女をほぼ訴えなかった
title: "スペインの異端審問｜魔女はいなかった"
yt_title: "「魔女はいなかった」と報告したのは、スペインの異端審問官だった　1610年、ログローニョの判決のあとで"
description: |-
  1610年の11月7日と8日、スペイン北部の町ログローニョで、異端審問所は魔女とされた人々に判決を言い渡しました。火刑の判決は11人です。
  審問官の1人、アロンソ・デ・サラサール・フリアスは、1611年から8か月ほどかけて北部の村々を回り、人々の話を聞きました。そして異端審問の最高会議に、魔女のことが語られ、書かれはじめるまで、その土地には魔女も魔女に呪われた者もいなかった、と報告します。1614年、最高会議は新しい指示を出し、魔女を火刑にする道を事実上閉ざしました。
  歴史家L・A・ホムザによれば、このあとスペインの異端審問は、二度と魔女を訴えなかったと言ってよいほどでした。W・モンターの数では、スペイン北部で異端審問所が処刑した魔女はおよそ20数人、同じ土地の世俗の裁判所は数百人を処刑しています（J・マルティネス・ロサ、2023年ほかによる）。
  本編では、1612年のペンドルの魔女裁判を軸に、ドイツとスペインの記録もたどって、魔女を裁いたのは誰だったのかを確かめています。本編は概要欄のリンクからどうぞ。
