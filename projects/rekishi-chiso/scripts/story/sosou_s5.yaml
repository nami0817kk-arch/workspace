# 事実カード（dev/output/rekishi-chiso/research/曹操_facts_20261029.yaml）：sosou-03・18・19・22
#   ・袁済喜の発言は重慶晩報（社会科学網転載）→「語った」（sosou-18）。
#   ・渡邉義浩の立場・大橋修一の反論は大橋論文の英文抄録が紹介する（本文は開いていない、sosou-19）→本編と同じく「とされています」。遺伝子の研究・向井佑介の校注は入れない。
#   ・卞氏の没年と女性遺骨の年齢は澎湃新聞・北京青年報（sosou-22）。
#   ・「決着した」とは言わない。
# 理解テスト4問：
#   ①誰の話か：曹操の墓と発表された墓（2009年）の主は誰か、という論争
#   ②いつ・どこで何が：2009年12月の発表の直後から異論（袁済喜・渡邉義浩）。大橋修一は反論
#   ③女性の骨と卞氏が合わない：卞氏は70歳ほど、墓の女性は50歳ほどと20歳ほどで合わない（墓誌の有無の説明は入れない）
#   ④どうなったか：異論が出たという事実も記録に残り、決着がついたとは言えない
title: 曹操の墓と発表された墓は、本当に曹操の墓なのか
yt_title: 曹操の墓は本当に曹操の墓なのか　2009年の発表の直後に出た異論と、その答え
description: |-
  2009年12月27日、河南省文物局は、河南省安陽の西高穴村で「魏武王曹操高陵」が見つかった、と発表しました。決め手に挙げられたのは、「魏武王」と刻まれた石の札です。
  ところが、発表の直後から異論が出ました。重慶晩報によれば、中国人民大学の袁済喜さんは、公表された証拠は第一手の材料ではなく、盗掘された墓の遺物は後から置かれた可能性もある、と語っています。日本でも、渡邉義浩さんが日本語版『曹操墓の真相』で石牌の書きぶりに疑問を示し、半信半疑だったとされています。これに対して大橋修一さんは、2013年の論文で、石牌の書体は曹操の時代として矛盾しない、と論じたとされています。
  女性の骨にも謎があります。『三国志』によれば、曹操の夫人の卞氏は曹操と合葬されました。卞氏は70歳ほどで亡くなりましたが、墓の女性は、50歳ほどと20歳ほどと鑑定されています。
  発掘した側は、男性の骨を曹操と確認できる、としています。異論が出たという事実も記録に残り、決着がついた、とは言えません。
  写真：西高穴2号墓の墓道（2013年、Rolfmueller撮影、CC BY-SA 3.0、ウィキメディア・コモンズ）
