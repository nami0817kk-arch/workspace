parts:
- type: versus3
  from: 13
  to: 13
  items:
  - - 『峡中沿革史』
    - 170人
  - - ほかの記録
    - 200人あまり
  - - 官軍
    - 1,200人ほど
  every: 2.0
- type: quote
  from: 43
  to: 43
  label: 史料
  text: 汝は隊長の儀につき一応督府に参り／御詫び申すべし　我れ同道せん
  source: 山内家の家記（『復古記』第11冊）
- type: quote
  from: 56
  to: 56
  label: 史料
  text: 高台寺連に成り居たる者を呼び／戸の隙より見せしむ　果して勇なり
  source: 谷干城「東征私記」（『谷干城遺稿』上）
- type: quote
  from: 61
  to: 61
  label: 史料
  text: 大久保大和守の義は／新撰組隊長近藤勇につき
  source: 総督府日記 慶応4年4月4日（『房総叢書』第5巻）
- type: quote
  from: 76
  to: 76
  label: 史料
  text: この儀を御採用なき時は／兵を率い帰ると申すほどの勢
  source: 谷干城「東征私記」（『谷干城遺稿』上）
- type: quote
  from: 99
  to: 100
  label: 史料
  text: 近藤勇　右は元来浮浪の者にて／大久保大和と変名し
  source: 板橋の捨札の写し（江湖新聞 慶応4年閏4月6日）
- type: quote
  from: 103
  to: 103
  label: 史料
  text: 孤軍援け絶えて俘囚となる／君恩を顧念して涙自ずから流る
  source: 中外新聞（作者不詳として掲載）
- type: quote
  from: 113
  to: 113
  label: 史料
  text: 兇悪の罪跡あまたこれ有る上／勝沼・流山にて官軍に敵対
  source: 三条河原の札 慶応4年閏4月7日
