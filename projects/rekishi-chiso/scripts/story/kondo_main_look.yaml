# 物語型の本編の見た目と絵の割り当て：近藤勇の最期（scripts/kondo-story.yaml）。chiso/storymain.py が読む。
# 11-19 作成（11/25 19:00 公開予定）。kiyomasa_main_look.yaml を写した。絵は Gemini（Chrome、写実の油彩、昼の光）。血・遺体・処刑の場面は描かない。
# 時代：1868年。和装に洋式の小銃、官軍は黒い筒袖と陣笠。新選組のだんだら羽織は描かない。実在の古写真・錦絵は額（frame:）で。
