title: "明暦の大火｜吉原の移転は、大火の3か月前に決まっていた"
yt_title: "吉原の移転は、明暦の大火の前に決まっていた　1656年10月9日の告げ　瓦や土蔵造りが勧められたのは、大火の63年あと"
description: |-
  江戸の吉原は、明暦の大火のあと、浅草へ移りました。けれど、移転を命じられたのは、大火の前の1656年10月9日です。新吉原の書上は、町奉行が年寄を呼んで、今の場所は御用地になる、と告げたと書きます。
  瓦や土蔵造りが勧められたのも、大火の直後ではなく、1720年のことです。大火が変えたものと、前から決まっていたものは、記録で分けられます。本編は概要欄のリンクからどうぞ。
  https://youtu.be/YMXFgwO0dWI
