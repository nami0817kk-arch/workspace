lines:
  # fact: meireki-C25
- 語り: "江戸の吉原は、明暦の大火のあと、浅草へ移った。けれど、移ることが決まったのは、大火の前だ。"
  shot: K24_1
  tone: 強調
  pause: 0.12
  # fact: meireki-C25
- 語り: "新吉原の書上によれば、1656年10月9日、町奉行が、吉原の年寄に、今の場所は御用地になる、と告げた。"
  shot: K03_2
  tone: 重い
  pause: 0.12
  # fact: meireki-C25
- 語り: "大火は、翌1657年の1月18日。告げられたのは、その3か月あまり前だった。"
  shot: K24_3
  tone: 重い
  pause: 0.12
  # fact: meireki-A27
- 語り: "御三家の屋敷を、城の外へ出す動きも、寺や社の移転も、大火の前から、続いていた。2021年の研究が、そう指摘する。"
  shot: K22_4
  tone: しみじみ
  pause: 0.12
  # fact: meireki-C31
- 語り: "瓦や土蔵造りは、大火の直後に勧められた、と思われがちだ。ところが、1660年ごろの町触は、塗屋を勧めた一方、町家の屋根の瓦は、認めていなかった。"
  shot: K03_5
  tone: 重い
  pause: 0.12
  # fact: meireki-C30
- 語り: "町人の町火消ができたのは、1718年。大火の61年あとだ。"
  shot: K23_6
  tone: しみじみ
  pause: 0.12
  # fact: meireki-C31
- 語り: "瓦や土蔵造りが、勝手次第となったのは、1720年、大岡忠相の触。大火の63年あとだ。"
  shot: K20_7
  tone: 重い
  pause: 0.12
  # fact: meireki-A27, meireki-C25
- 語り: "あなたは、江戸の何を、大火のせいだと思っていましたか。"
  shot: K24_8
  tone: 疑問
  pause: 0.15
