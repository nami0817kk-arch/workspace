# 物語型の本編（横 16:9）の見た目と絵の割り当て：小早川秀秋（scripts/hideaki-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（10/31 公開予定）。この look は行の番号（0 始まり）で絵を当てるので、台本の行を増減したら shots の番号を直す。決まりは docs/story-main.md・スキル rekishi-story-screen。見本は yodo・hijikata の look。
# 絵の方針：AI 絵は 15 枚（H01〜H15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵に出さない（後ろ姿・遠景・手元だけ。顔の寄りは作らない）。人物は実在の絵（パブリックドメイン。出典は台本の caption と下の credits:）を額（frame:）で、
#   屏風・陣立図・地図は一部（part:）で使う。伝小早川秀秋像は「伝」を付ける。芳年《小早川秀秋 大谷吉継の亡霊に怯える》は、後世の創作の絵として問い鉄砲の行に当てる。
# AI 絵の指示の一覧（英語・場面）：dev/output/rekishi-chiso/research/hideaki_ai_images.md
# 届く前は art_dir の仮の絵（番号と場面だけ書いた灰色の板。10-29 に PIL で 1376×768 で作った）で代える。届いたら main_art_dir に H01.jpg〜を置くだけ。
#   crops・focus・fx の位置は仮の値。届いた絵を見て合わせ直す。
# 最期の場面（H13）は人を描かない（病床・亡骸の絵なし）。最期・死因の行に人物の絵を当てない。
script: scripts/hideaki-story.yaml
out: hideaki_story_main
art_dir: out/story/hideaki/ph          # 仮の絵（placeholder）
main_art_dir: out/story/hideaki/main   # Gemini の 16:9 の絵（H01.jpg〜H15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

