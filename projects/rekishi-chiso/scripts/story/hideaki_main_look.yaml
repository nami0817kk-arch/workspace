  - {type: quote, from: 5, to: 5, label: 要点, text: 十五日の巳の刻／戦いが始まってすぐに秀秋ら4人が東軍に味方,
     source: 石川康通・彦坂元正の連署状写（堀文書、慶長5年9月17日。呉座勇一さんの紹介）}
  - {type: versus3, from: 19, to: 19, every: 1.2,
     items: [[幻冬舎の解説, 越前12万石], [サライの記事, 越前15万石]]}
  - {type: quote, from: 28, to: 28, label: 史料, text: 昨日は大酒ゆえ、さんざん酔い、正体なく候,
     source: 小早川秀秋の書状（慶長5年4月9日付。武将ジャパンの紹介）}
  - {type: versus3, from: 39, to: 39, every: 1.2,
     items: [[高橋陽介が引く本, 3万4000石], [呉座勇一の本文, 3万石]]}
  - {type: versus3, from: 51, to: 51, every: 1.2,
     items: [[通説（呉座勇一の紹介）, 午前8時ごろ], [高橋陽介, 午前10時ごろ], [連署状の「巳の刻」, 午前10時前後]]}
  - {type: versus3, from: 74, to: 74, every: 1.2,
     items: [[岡山市の紹介ページ, 50万石], [岡山市の別のページ, 51万石], [幻冬舎の記事, 55万石]]}
  - {type: quote, from: 92, to: 92, label: 史料, text: 同月に兄弟三人病死也／諸人、不思儀と申す,
     source: 『舜旧記』梵舜（慶長7年10月18日条。武将ジャパンの紹介）}
  - {type: quote, from: 107, to: 107, label: 要点, text: 9月14日に秀秋と吉継はともに山中にいた／この筋だと開戦と同時の背後攻撃はできない,
     source: 陸軍参謀本部編『日本戦史 関原役』（通説の出どころ。高橋陽介さんの指摘）}

