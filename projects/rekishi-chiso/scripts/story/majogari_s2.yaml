# 絵：本編の AI 絵（out/story/majogari/main/ の W・TH）の切り出しだけ。新しい絵は作らない。
# 切り口：9歳の証人ジェネット（本編 序章・第2章・第3章、majogari-11・19・20・12）。1634年の話は出さない（tease の答え）。
# hook＝9歳の少女は誰の裁判に証人として立ったか（答えはこのショートの中：自分の母。兄の裁判でも）。
# tease＝22年後、ジェネットの名前はどこに出てくるか（答えは本編 第7章：1634年、少年ロビンソンが名を挙げた中のジェネット・デイヴィス。majogari-24）。
# 日付は当時のイングランドの暦（ユリウス暦）の記録のまま。1612→1634＝22年。季節は言わない。
# 「9歳くらい」はポッツの about the age of nine yeares。悪魔学は1597年、ジェームズ1世（本編どおり「子どもや妻も」）。
# 理解テスト：①ペンドルの魔女裁判の証人ジェネットの話 ②1612年8月18日、ランカスター城の巡回裁判で母エリザベスが裁かれた
#   ③9歳くらいのジェネットが、机の上に立って母に不利な証言をした（母は叫んで止めようとし、外へ出された） ④母・兄・姉は死刑を言い渡された
title: "ペンドルの魔女｜9歳の証人"
yt_title: "9歳くらいの少女は、法廷の机の上に立ち、自分の母に不利な証言をした　1612年、ペンドルの魔女裁判"
description: |-
  1612年、イングランドのランカスター城。記録の日付で8月18日、巡回裁判で、エリザベス・デバイスが魔女として裁かれました。
  訴える側が呼んだ証人は、エリザベスの娘ジェネット。裁判の記録を書いたトマス・ポッツによれば、年は9つくらいでした。娘の姿を見た母は、法廷で叫び声を上げて止めようとしましたが、判事は母を外へ連れ出させ、少女を机の上に立たせて証言させました。
  このときの国王ジェームズ1世は、1597年の『悪魔学』に、王への反逆の罪なら子どもや妻も証人になれる、神への大逆の魔術ならなおのことだ、と書いています。
  記録は、トマス・ポッツ『ランカシャーの魔女の驚くべき発見』（1613年）によります。日付は当時のイングランドの暦（ユリウス暦）のままです。
  本編では、ピン1本から始まった訴えと、魔女を裁いたのは誰だったのか、そして22年後のジェネットを、記録でたどっています。本編は概要欄のリンクからどうぞ。
