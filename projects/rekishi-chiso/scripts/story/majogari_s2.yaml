  shot: W10_2
  tone: しみじみ
  pause: 0.12
  # fact: majogari-19
- 語り: "訴える側が呼んだ証人は、エリザベスの娘、ジェネット。記録を書いたトマス・ポッツによれば、年は、9つくらいだった。"
  shot: W12_3
  tone: しみじみ
  pause: 0.12
  # fact: majogari-19
- 語り: "娘の姿を見た母は、法廷で叫び声を上げ、娘を止めようとした。"
  shot: TH1_4
  tone: 重い
  pause: 0.12
  # fact: majogari-19
- 語り: "判事は、母を外へ連れ出させ、少女を、机の上に立たせて、証言させた。ジェネットは、兄のジェームズの裁判でも、証言した。"
  shot: TH2_5
  tone: 重い
  pause: 0.12
  # fact: majogari-20
- 語り: "このときの国王、ジェームズ1世は、1597年に、悪魔学という本を書いている。"
  shot: W01_6
  tone: しみじみ
  pause: 0.12
  # fact: majogari-20
- 語り: "そこには、こうある。王への反逆の罪なら、子どもや妻も、証人になれる。神への大逆の魔術なら、なおのことだ。"
  shot: W09_7
  tone: 強調
  pause: 0.12
  # fact: majogari-12
- 語り: "死刑を言い渡された10人の中には、母のエリザベスと、兄のジェームズ、そして、姉のアリゾンがいた。"
