lines:
  # fact: hideaki-22
  - 語り: 小早川秀秋は、10代で、筑前と筑後、30万石以上を預かる国主になった。ところが、その領地を、《!取り上げられる》。
    shot: H02
    tone: 強調
  # fact: hideaki-23
  - 語り: 秀吉は、領地を取り上げて、秀秋を越前に移す。石高は、幻冬舎の解説は12万石、サライの記事は15万石と、書いている。
    shot: H02r
    tone: 強調
    pause: 0.12
  # fact: hideaki-24
  - 語り: 理由は、蔚山での軽率さが、秀吉の怒りを買った、と語られてきた。けれど、渡邊大門さんは、秀秋の帰国は、蔚山の戦いより前に決まっていた、と述べている。
    shot: Busan
    tone: しみじみ
    pause: 0.12
  # fact: hideaki-25
  - 語り: 「石田三成の讒言で」という話も、有名だ。渡邊さんは、慶長3年5月の、三成の書状に注目する。
    shot: Mitsunari
    tone: しみじみ
    pause: 0.12
  # fact: hideaki-25
  - 語り: 三成は、代官として筑前を、一時、預かっただけだ、と書く。讒言の筋は、書状から、崩れる。
    shot: H10
    tone: 強調
    pause: 0.12
  # fact: hideaki-26
  - 語り: 秀吉の死後、家康が働きかけて、秀秋は筑前と筑後を取り戻した、と一般向けの解説は書く。
    shot: Ieyasu
    tone: しみじみ
    pause: 0.12
  - 語り: 取り上げられ、戻される。若者の領地は、大人たちの都合で動いた。
    shot: Portrait
    tone: 重い
    pause: 0.3
    dip: true
  - 語り: あなたなら、領地を大人の都合で動かされた若者を、どう見ますか。
    shot: H02q
    tone: 疑問
    pause: 0.15
