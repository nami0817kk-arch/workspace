# 物語完結型ショート 小早川秀秋 s3（2026-10-29）。本編 scripts/hideaki-story.yaml の第1章（筑前の少年国主）から。
# 形式は hijikata_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（H02）と実在の絵（秀吉像・釜山鎮の図・石田三成像・家康像・伝秀秋像）。伝秀秋像は「伝」を付ける。
# 事実カード：hideaki-22・23・24・25・26
#   ・越前の石高は幻冬舎12万石／サライ15万石（hideaki-23）。蔚山説・讒言説への反論は渡邊大門（hideaki-24・25）。
#   ・復領は一般向けの解説が書く（hideaki-26、単一出どころ）→「と書く」。秀秋の動機は断定しない。
# 理解テスト4問：
#   ①誰の話か：10代で筑前・筑後30万石以上の国主になった小早川秀秋
#   ②何が起きたか：秀吉に領地を取り上げられ越前に移された（石高は12万石とも15万石とも）
#   ③理由は：蔚山の軽率さ・三成の讒言と語られてきたが、渡邊大門は帰国は蔚山の前に決まっていた・三成は代官として預かっただけと述べる
#   ④どうなったか：秀吉の死後、家康の働きかけで領地が戻ったと一般向けの解説は書く。若者の領地は大人たちの都合で動いた
title: 小早川秀秋｜10代で30万石、そして取り上げられた領地
yt_title: 小早川秀秋はなぜ領地を取り上げられた？　蔚山も三成の讒言も、書状で崩れる
description: |-
  小早川秀秋は、10代で、筑前と筑後の30万石以上を預かる国主になりました。ところが、秀吉は、その領地を取り上げて、秀秋を越前に移します。移された先の石高は、幻冬舎の解説は12万石、サライの記事は15万石と書いています。
  理由は、蔚山で軽率だったから、石田三成の讒言のせい、と語られてきました。けれど、渡邊大門さんは、帰国は蔚山の戦いより前に決まっていた、慶長3年5月の三成の書状は、代官として筑前を一時預かっただけだと書いている、と述べています。
  秀吉の死後は、家康が働きかけて、筑前と筑後を取り戻した、と一般向けの解説は書きます。
hashtags: ["#小早川秀秋", "#日本史", "#戦国時代"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
