# 物語完結型ショート 坂本龍馬の暗殺 s5（2026-11-27）。本編 scripts/ryoma-ansatsu-story.yaml（12/3 19:00 公開予定、https://youtu.be/GFeQhr4ubjU）から。12/4 19:30 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 近江屋事件_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/ryoma_ansatsu/main/ の R）の切り出しだけ。新しい絵は作らない。暗殺の場面・血・遺体は描かない。
# 切り口：48年後に「自分が刺客」と言い残した渡辺篤（渡辺一郎）と、3人目の名前 世良敏郎（本編 第5章、ryoma-ansatsu-03・48・28・33）。
# 既出と重ねない：ryoma-if のショート（王政復古の24日前・吉井幸輔の避難の勧め）には触れない。今井信郎の話の変わり方は s1 なので言わない。
# hook＝48年後に名乗り出た刺客は本物か（答えはこのショートの中：1917年に偽りと退けられた。けれど菊地2010は、渡辺篤の書き物の世良敏郎を実在とし、顔ぶれに渡辺篤を入れるべきとする）。
# tease＝記録だけで、龍馬を斬った者にどこまで近づけるか（答えは本編 まとめ：京都見廻組の誰か、まで）。
# 数え直し：慶応3年＝1867、大正4年＝1915（1867→1915＝48年。起点は事件、終点は遺言が新聞に載った年）。1915→1917＝2年後。1917−1867＝50＝五十年祭。季節は言わない（8月5日は新暦）。
#   渡辺篤の書き物は年が分からない（本編も年を言わない）ので「年は分からない」と言う。井上通泰の本は1930年。菊地明は2010年。
# 理解テスト：①元京都見廻組の渡辺篤（渡辺一郎）が、死ぬ前に自分が龍馬の刺客だと言い残した話 ②1915年8月5日の大阪朝日新聞に遺言が載った
#   ③1917年の五十年祭の講演で委員は偽りと退けた。1930年の井上の本にも死ぬ前に話したとある。本人の書き物には、鞘を残したのは世良敏郎とある
#   ④菊地明は2010年、世良を実在の見廻組の者とし、実行した顔ぶれを今井信郎・渡辺篤・世良敏郎が入る形に直すべきとした
title: "坂本龍馬｜48年後の遺言"
yt_title: "自分こそ龍馬の刺客だ　事件から48年後に新聞に載った渡辺篤の遺言と、3人目の名前「世良敏郎」"
description: |-
  自分こそ、坂本と中岡の刺客だ。慶応3年、1867年に京都の近江屋で坂本龍馬が斬られてから48年後の、大正4年、1915年8月5日。大阪朝日新聞に、京都の剣術家、渡辺一郎の遺言が載りました。元京都見廻組の渡辺一郎は、今では渡辺篤の名で知られています。
  2年後の1917年、龍馬と中岡の五十年祭の講演で、維新史料編纂局の委員は、名を売りたい者の話だ、と退けました。けれど1930年に出た井上通泰の本にも、人から聞いた話として、渡辺一郎が死ぬ前に、龍馬を斬ったのは実はおれだ、と話した、とあります。
  渡辺篤は、子孫に伝える書き物も残していました。年は分かりませんが、そこには、現場に鞘を残したのは世良敏郎、とあります。研究者の菊地明さんは、2010年、幕府の文書に世良の名があることから実在の見廻組の者とし、実行した顔ぶれを、今井信郎・渡辺篤・世良敏郎が入る形に直すべきだ、と書いています。
  本編では、事件の直後の手紙から、取り調べの口書、雑誌の談話、48年後の遺言まで、書かれた年を添えて並べ、龍馬を斬った者にどこまで近づけるかを確かめています。本編は概要欄のリンクからどうぞ。
