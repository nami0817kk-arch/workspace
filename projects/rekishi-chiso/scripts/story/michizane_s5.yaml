# 理解テスト：①清涼殿に雷が落ちた日の話 ②930年6月26日、京都の内裏の清涼殿 ③雷は南西の柱に落ち、清貫と希世、となりの紫宸殿で美努忠包が死に、醍醐天皇はその日から病んだ ④醍醐天皇は位を譲った7日後、46歳で亡くなった
title: "菅原道真｜死から27年後の雷"
yt_title: "菅原道真の死から27年後、天皇の住まい清涼殿に雷が落ちた　焼け死んだ大納言と、3か月後に世を去った醍醐天皇"
description: |-
  延長8年、930年の6月26日。午後3時ごろ、都の空に雷が鳴りはじめます。『日本紀略』によれば、雷は内裏の清涼殿の南西の柱の上に落ち、火が出ました。菅原道真が大宰府で亡くなってから27年後のことです。
  殿上にいた大納言の藤原清貫は衣を焼かれて亡くなり、右中弁の平希世も命を落としました。となりの紫宸殿でも、美努忠包が髪を焼かれて亡くなっています。
  『日本紀略』は、この日から醍醐天皇が病に伏したと書きます。9月22日、醍醐天皇は位を譲り、その7日後の9月29日、46歳で亡くなりました。死の直前に出家していました。
  本編では、左遷の日、大宰府での2年、59歳の死、都で続いた死、地獄を見た僧の話と北野の託宣、そして学問の神様になるまでを、当時の記録でたどっています。本編は概要欄のリンクからどうぞ。
