lines:
  # fact: habs-15
- 語り: "1515年。ウィーンの、シュテファン大聖堂で、二組の、結婚の約束が、交わされた。"
  shot: C08_1
  tone: 強調
  pause: 0.12
  # fact: habs-15
- 語り: "7月22日の、式のようすは、歴史家クスピニアヌスの、日記に残る。"
  shot: C08_2
  tone: しみじみ
  pause: 0.12
  # fact: habs-15
- 語り: "ところが、花婿の一人、フェルディナントは、この日、ウィーンにいなかった。2024年の研究が言う。"
  shot: C04_3
  tone: 重い
  pause: 0.12
  # fact: habs-46
- 語り: "ハプスブルガー・ネットによれば、アンナの花婿の席にいたのは、皇帝マクシミリアン自身。のちに、孫のフェルディナントへ、移された。"
  shot: C04_4
  tone: しみじみ
  pause: 0.12
  # fact: habs-15
- 語り: "取り決めで、大切な役をしたのは、花嫁の叔父、ポーランド王ジグムント。"
  shot: C15_5
  tone: しみじみ
  pause: 0.12
  # fact: habs-16
- 語り: "皇帝は、ハンガリーとボヘミアの王の息子、ルートヴィヒを、養子にした。"
  shot: C11_6
  tone: しみじみ
  pause: 0.12
  # fact: habs-20
- 語り: "アンナとフェルディナントの結婚式は、1521年、リンツ。婚約から、6年後だった。"
  shot: C04_7
  tone: しみじみ
  pause: 0.12
  # fact: habs-17
- 語り: "1896年、画家ブロジクが、この婚約を、縦4.3メートル、横7.3メートルの絵に描いた。381年後。題は、あの句だ。"
  shot: C12_8
  tone: しみじみ
  pause: 0.12
  # fact: habs-18
- 語り: "では、約束された王冠は、そのまま、手に入ったのか。"
  shot: C09_9
  tone: 疑問
  pause: 0.15
