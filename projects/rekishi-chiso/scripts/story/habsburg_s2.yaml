title: "ハプスブルク｜二重の婚約、花婿は大聖堂にいなかった"
yt_title: "1515年、ウィーンの大聖堂で交わされた二組の婚約　花婿の一人は、その場にいなかった　代わりに座ったのは皇帝"
description: |-
  1515年7月22日、ウィーンのシュテファン大聖堂で、二組の結婚の約束が交わされました。ところが、花婿の一人、フェルディナントは、この日ウィーンにいませんでした。
  ハプスブルガー・ネットによれば、アンナの花婿の席にいたのは皇帝マクシミリアン自身で、のちに孫のフェルディナントへ移されました。1896年には、この婚約が縦約4.3メートル、横約7.3メートルの大きな絵に描かれます。
  約束された王冠は、そのまま手に入ったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/RnyhC0Qyirs
