# 物語完結型ショート 豊臣秀次 s3（2026-10-28）。本編 scripts/hidetsugu-story.yaml の第4章（「殺生関白」の出どころと近江八幡）から。投稿しない。
# 形式は kazumasa_s1.yaml・asahi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵＋実在の絵（洛中洛外図屏風・秀次像）。
# 事実カード（dev/output/rekishi-chiso/research/豊臣秀次_facts_20261028.yaml）：hidetsugu-01・04・19・21
#   ・『甫庵太閤記』（正保3年刊本）「其比洛中の辻々に落書夜々に有し 院の御所手向のためのかりなれは これをせつしやう関白といふ」（hidetsugu-04）。
#   ・『本朝通鑑』（林羅山・林春斎）「殺生與政音響近」／『続撰清正記』「狩漁を好み給へば、世の人殺生関白といふ」／『絵本太閤記』（1884年の刊本）「一條の辻に札を立て」（hidetsugu-04）。
#   ・矢部健太郎（2016）「秀次の『殺生関白』も、信頼すべき根拠のない作り話であった」（hidetsugu-04）。
#   ・近江八幡：1585年に八幡山城の城下町を開き、商人を呼び、税を免じた（hidetsugu-19）。
#   ・「死後に生まれた呼び名」とは言わない：『甫庵太閤記』は「そのころ」落書が出たと書き、初出が死後かどうかはカードで確かめられていない
#     （矢部の「『大かうさまくんきのうち』に初めて現れる」は本文を未見）。言うのは「呼び名を伝えるのは江戸時代の書物」まで。
# 理解テスト4問：
#   ①誰の話か：豊臣秀次（秀吉の甥・関白。文禄4年に高野山で腹を切った）の「殺生関白」という呼び名
#   ②いつ・どこで何が：江戸時代の『甫庵太閤記』が、そのころ京の辻々に夜ごと落書が出て「殺生関白」と書かれた、と伝える
#   ③なぜそう呼ばれたと書かれたか：摂政と音が近い言葉遊び（『本朝通鑑』）／狩りを好んだから（『続撰清正記』）。明治の本では一条の辻の札に
#   ④どうなったか：矢部健太郎さんは「根拠のない作り話」と書いた。秀次は1585年に近江八幡の商人の町を開いた人でもあった
title: 豊臣秀次｜「殺生関白」は、江戸の書物の落書から
yt_title: 豊臣秀次の「殺生関白」という呼び名は、どこから来たのか【江戸時代の書物の落書】
description: |-
  関白だった豊臣秀次は、「殺生関白」という悪い呼び名で知られてきました。
  江戸時代の『甫庵太閤記』は、そのころ京の辻々に夜ごと落書が出て、「院の御所の手向けのための狩りなれば、これを殺生関白という」と書かれていた、と伝えます。
  『本朝通鑑』は殺生と摂政は音が近いと書き添え、『続撰清正記』は狩りを好んだから世の人がそう呼んだ、とします。明治の『絵本太閤記』では、一条の辻に札が立ったことになっています。
  歴史学者の矢部健太郎さんは、秀次の「殺生関白」も、根拠のない作り話だった、と書いています。秀次は1585年、近江八幡の商人の町を開いた人でもありました。
