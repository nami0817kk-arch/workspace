  - {type: quote, from: 26, to: 26, label: 史料, text: この宮のおしっこに濡れるのは／うれしいことだなあ, source: 紫式部『紫式部日記』（道長の言葉。今の言葉に）}
  - {type: quote, from: 49, to: 49, label: 史料, text: 起きたら　まず／自分の星の名を7回唱えよ, source: 藤原師輔『九条殿遺誡』（今の言葉に）}
  - {type: versus3, from: 64, to: 65, every: 4,
