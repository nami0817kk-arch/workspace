  - {type: quote, from: 74, to: 74, label: 史料, text: 物忌みは　今日と明日／だから西の門を閉じた, source: 藤原道長『御堂関白記』1010年8月24日（今の言葉に）}
  - {type: versus3, from: 89, to: 91, every: 4,
     items: [[辞典の説明, 柳の札を冠や簾に], [御堂関白記, 物忌みの札は1つも無い]]}
  - {type: quote, from: 101, to: 101, label: 史料, text: 方違えに行ったのに／もてなしのない家, source: 清少納言『枕草子』（今の言葉に）}
  - {type: quote, from: 117, to: 117, label: 史料, text: 明け方まで／門をたたく音はしない, source: 清少納言『枕草子』（今の言葉に）}
  - {type: versus3, from: 124, to: 125, every: 4,
