# 切り口：秀衡の遺言が、吾妻鏡と玉葉で違うこと（本編第3章。yoshitsune-09, 21）。
# 計算：1187年10月29日（秀衡の死）→1189年閏4月30日（義経の死）＝1年半あまり（ユリウス暦で約1年6か月半）。
# 理解テスト4問：①藤原秀衡の遺言 ②1187年10月29日に平泉で亡くなった。約70歳と推定 ③吾妻鏡は「義経を大将軍に」、玉葉は「三人一味で頼朝を襲う」（伝聞）と書く ④泰衡がどう動いたかは本編へ
# 事実は事実カード（dev/output/rekishi-chiso/research/源義経_facts_20261112.yaml）と本編の # fact: だけ。想像の台詞なし。「もしも」の話は「もしもの話」と言ってから。
