title: "義経｜秀衡の遺言は、二つある"
yt_title: "藤原秀衡の遺言は記録で正反対　吾妻鏡は「義経を大将軍に」、玉葉は「頼朝を襲う」"
description: |-
  1187年10月29日、奥州の主、藤原秀衡は平泉の館で亡くなりました。1950年の遺体の調査をもとにした2021年の論文は、亡くなった年齢を約70歳と推定しています。
  吾妻鏡は、重い病のなか、秀衡が息子の泰衡たちに「義経を大将軍として国の政を行わせよ」と遺言した、と書きます。ところが九条兼実の日記、玉葉は、別の遺言を伝えます。兄の国衡と泰衡が和睦し、義経を主君として、三人一味で頼朝を襲う謀を練っている、と。こちらは「ある人が言うには」という伝え聞きです。
  吾妻鏡の1185〜89年の本文は、読み下し文で確かめたものです。原文との照合は行っていません。
  秀衡の死から1年半あまり。泰衡は、どう動いたのか。本編は次のリンクからどうぞ。
