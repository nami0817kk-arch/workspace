title: "江戸の長屋｜トイレの中身は売り物"
yt_title: "江戸の長屋の共同トイレの中身は「売り物」だった　代金を受け取ったのは住人ではなく大家　1843年には283か村が値下げを訴えた"
description: |-
  江戸の長屋の路地の奥には、共同の井戸、便所、ごみ溜めが並んでいました。便所に溜まったものは、近くの村の農家が、畑の肥やし「下肥」として買っていきました。
  磯田道史さん監修の『新版 江戸の家計簿』によると、その代金は大家の収入になっていたといいます。店子には入りません。
  下肥は、汲み取る場所の取り合いで値が上がりました。1843年2月1日には、武蔵と下総の283か村の代表が、勘定奉行に、下肥の値が高すぎると訴えたとされます。
  本編では、家賃・水・トイレ・お風呂・食べ物・灯りまで、江戸の長屋の1か月がいくらだったかを積み上げています。本編は概要欄のリンクからどうぞ。
