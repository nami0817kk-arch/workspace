    shot: Fukui
    tone: 強調
    pause: 0.12
  # fact: yodo-17
  - 語り: 三人姉妹と言われるのに、記録が数えたのは二人。姉は、のちに秀吉公に嫁いだ、と続ける。
    shot: Y02
    tone: しみじみ
    pause: 0.12
  - 語り: 母を攻めた秀吉のもとへ、姉の茶々は行く。
    shot: Hideyoshi
    tone: 重い
    pause: 0.15
  # fact: yodo-02
  - 語り: 1594年。茶々は京都に、父の菩提を弔う養源院を建てた。
    shot: Nagamasa
    tone: しみじみ
    pause: 0.12
  # fact: yodo-19
  - 語り: 養源院は1619年に焼け、1621年に建て直したのは、妹のお江だった。
    shot: Y05l
