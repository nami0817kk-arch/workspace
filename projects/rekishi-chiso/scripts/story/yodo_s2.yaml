# 物語完結型ショート 淀殿 s2（2026-10-29）。本編 scripts/yodo-story.yaml の第1章（二度の落城と父の寺・養源院の血天井）から。投稿しない。
# 形式は masamune_s1.yaml を写した。想像の台詞なし。絵は本編の AI 絵（Gemini のみ）と実在の絵。最期・落城の場面に人物の絵は当てない（小谷は後ろ姿の少女と遠景、北ノ庄は遠景）。
# 事実カード：yodo-02・17・19。『当代記』の「二人」は記録の言葉として出どころ（江戸時代の初めの記録）を語りで言う。血天井の血は観光庁の解説のとおり「徳川の家臣たち」。
# 理解テスト4問：①誰の話か＝浅井長政の娘、茶々（のちの淀殿）②いつ・どこで何が＝1573年小谷落城・1583年北ノ庄落城、1594年に京都で父の寺（養源院）を建てた ③何を選んだか＝父を攻めた秀吉のもとへ行きながら父の寺を建てた ④どうなった＝焼けた寺を1621年に妹のお江が建て直し、血天井が今も残る
title: 淀殿｜父の寺の天井に、血のしみた板
yt_title: 淀殿が父のために建てた寺の天井には、血のしみた板が張られている　養源院の血天井
description: |-
  浅井長政の娘、茶々。のちの淀殿が、父のために京都に建てた寺が、養源院です。文禄3年、1594年のことでした。
  天正元年、1573年、織田信長に攻められて小谷城が落ち、父の長政は命を絶ちました。10年後の1583年には、母のお市が嫁いだ柴田勝家の北ノ庄城も、秀吉に攻められて落ちます。江戸時代の初めの記録『当代記』は、このとき越前で難を逃れた浅井の娘を「二人」と数え、姉は、のちに秀吉に嫁いだ、と続けています。
  養源院は1619年に火事で焼け、1621年に妹のお江が建て直しました。観光庁の解説によれば、そのとき徳川の家臣たちの血のしみた城の床板を祀り、いまも天井に張られて血天井と呼ばれています。
