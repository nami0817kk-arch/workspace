  - 語り: 茶々が、父のために建てた寺。その天井には、血のしみた板が、張られている。
    shot: Y05f
    tone: 強調
  - 語り: 1573年。織田信長に攻められて小谷城は落ち、父の浅井長政は、城で命を絶った。
    shot: Odani
