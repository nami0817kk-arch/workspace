parts:
  - {type: quote, from: 1, to: 1, label: 史料, text: 賊魁西郷桐野以下ヲ斃ス／賊魁西郷ハ我手ニテ打取リ, source: 山縣参軍・東伏見少将の電報（明治10年9月24日）}
  - {type: quote, from: 28, to: 28, label: 史料, text: 今午後五時ヲ限リ可申出旨ヲ申含致放還候, source: 山縣参軍の達し（第4旅団日記 9月23日の条）}
  - {type: quote, from: 35, to: 35, label: 史料, text: 同廿四日午前四時、城山四面大攻撃, source: 『攻城砲隊戦闘報告』}
  - {type: versus3, from: 46, to: 46, items: [[観光案内の一つ, 午前4時], [別府晋介の墓の解説, 午前6時ごろ]], every: 2.0}
  - {type: quote, from: 48, to: 48, label: 史料, text: 西郷ハ小銃ニ当リ／桐野ハ大砲ニアタリタル, source: 田ノ浦発 午前10時の電報（翻刻）}
  - {type: quote, from: 64, to: 64, label: 史料, text: 何レモ銃丸若シクハバヨネツトニテ／斃レタルモノニ候, source: 山縣参軍の電報（9月24日）}
  - {type: quote, from: 68, to: 68, label: 史料, text: 西郷ヲ追掛ケ安村ハ手負トナリ／首ヲ取兼シハ残リ惜シ, source: 東伏見少将の電報（9月24日）}
  - {type: quote, from: 74, to: 74, label: 史料, text: 果シテ門脇ノ小溝ニ埋メアルヲ発見シ, source: 千田登文の履歴書（紹介記事による引用）}
  - {type: versus3, from: 75, to: 75, items: [[第4旅団の日記, 折田庄輔の屋敷], [千田の履歴書, 門脇の小溝], [解説の一つ, 折田庄助邸の前], ], every: 1.8}
  - {type: quote, from: 84, to: 84, label: 要旨, text: crippled by a bullet wound／and beheaded by his followers, source: Mark Ravina, Journal of Asian Studies（2010）}
  - {type: quote, from: 94, to: 94, label: 史料, text: "the planet Mars, in the centre of which／is General Saigo, the rebel chief", source: モース『Japan Day by Day』（9月8日の項）}
  - {type: quote, from: 105, to: 105, label: 要点, text: 言えること＝午前4時開戦、午前8時に収まる／言えないこと＝洞窟を出た時刻、切腹か, source: この動画のまとめ}

