references:
  - 山縣有朋・東伏見少将・渡辺中佐・小沢大佐らの電報、第4旅団・別働第2旅団の日記、軍団本営の発翰録（アジア歴史資料センター所蔵の防衛省防衛研究所の資料。『電報綴』『軍略戦況』ほか。内容欄の翻刻）
  - 『攻城砲隊戦闘報告 明治十年九月十九日より同二十四日に至る』（国立国会図書館「史料にみる日本の近代」の翻刻）
  - 'Mark Ravina, "The Apocryphal Suicide of Saigō Takamori: Samurai, Seppuku, and the Politics of Legend", Journal of Asian Studies 69(3), 2010（要旨と参考文献表）'
  - 千田登文の履歴書（2014年に刊行された大野敏明『西郷隆盛の首を発見した男』文春新書の紹介記事による。履歴書の原文は未見）
  - Edward S. Morse, Japan Day by Day, vol.1, 1917（1877年9月8日の項）／野尻抱影『日本星名辞典』1973（Wikipedia「西郷星」経由）
  - 国立公文書館「あの日の公文書」（9月24日 南洲忌）／日本語版ウィキペディア「西郷隆盛」「西南戦争」／KAGOPIC（西郷洞窟・別府晋介の墓）／鹿児島の観光案内

