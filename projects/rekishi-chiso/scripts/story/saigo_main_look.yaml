# 物語型の本編（横 16:9）の見た目と絵の割り当て：西郷隆盛の最期（scripts/saigo-story.yaml）。chiso/storymain.py が読む。
# 11-11 作成（11/13 19:00 公開予定）。kenshin_main_look.yaml を写した。台本には手を入れない（承認のあと）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵（S01〜S16・SEND）は Gemini（Chrome、無料版）。西郷の顔は想像上で実在の肖像に似せない（多くは後ろ姿）。実在の絵は額（frame:）と錦絵の一部（part:）。
#   S14 は上の看板に字のような模様があるので切り出しを下寄りにしてある。S16 は上野の像に近い（像そのものの話の行だけで使う）。
script: scripts/saigo-story.yaml
out: saigo_story_main
art_dir: out/story/saigo/main
main_art_dir: out/story/saigo/main
ai_disclosure: この動画の情景・人物の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真や肖像ではありません（画面の右上に「AI生成画像」と出しています）。

