# 理解テスト：①戦国の村や寺と、軍勢の乱暴を禁じる札「禁制」 ②1573年 越前の西福寺・1590年 秀吉の掟 ③村や寺は、お礼や決まった銭を払って禁制を手に入れた ④それでも連れ去られた人は身代金で取り戻し、人が売り買いされることもあった
title: "禁制の値段｜戦国の村が買った安全"
yt_title: "戦国の村は「安全」を銭で買った　乱暴を禁じる札・禁制の値段は、上の村で永楽銭3貫200文　1590年の秀吉の掟"
description: |-
  戦国の村や寺は、攻めて来る軍勢から、禁制という札を手に入れました。軍勢の乱暴を禁じると約束する札です。1573年、織田信長が越前を攻めたとき、敦賀の西福寺は秀吉を通じて禁制を求め、返事は「お礼を持って来れば、すぐに渡す」でした。
  1590年、豊臣秀吉が石田三成に出した掟では、禁制の値段が村の格で決まっていました。上の村は永楽銭3貫200文、中の村は2貫200文、下の村は1貫200文。ほかに筆の代が200文。それでも、連れ去られた人は、村が身代金を払って取り戻さなければなりませんでした。1566年、上杉謙信が常陸の小田城を落としたときには、人が20銭や30銭で売り買いされた、と記録にあります。
  本編では、足軽の集め方・持ち物・食べ物・傷と手柄まで、『雑兵物語』とほかの記録でたどっています。本編は概要欄のリンクからどうぞ。
