# 理解テスト：①中山道の和田峠の施行所の話 ②1828年、和田峠（同じ年に碓氷峠にも） ③江戸の豪商の寄付の利子で、旅人に粥と焚火、牛馬に煮た麦をただで出した ④峠の茶屋も扶持を受けて旅人を助けた
title: "中山道｜峠の粥と焚火はただ"
yt_title: "中山道でいちばん高い和田峠では、旅人に粥と焚火がただで振る舞われた　江戸の豪商の1000両から生まれた施行所"
description: |-
  中山道でいちばん高い峠、和田峠。長和町によると、高さはおよそ1600メートルです。
  峠の東の東餅屋には茶屋が5軒あり、寛永のころから、1軒ごとに1日玄米5合の扶持を受けて、峠で困った旅人を助けていました。
  江戸の呉服町の豪商、かせや与兵衛が幕府に寄付した1,000両。その利子の半分、50両を元手に、文政11年、1828年、和田峠に永代人馬施行所が置かれます。11月から3月のあいだは、峠を越える旅人に粥と焚火を、牛や馬には1年じゅう、小桶1杯の煮た麦を、どれもただで出しました。同じ年、碓氷峠にも笹沢の人馬施行所ができています。
  本編では、近江の商人の道中日記で、中山道の峠と宿代を宿場ごとに追っています。本編は概要欄のリンクからどうぞ。
