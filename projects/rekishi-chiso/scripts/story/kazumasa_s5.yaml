# 物語完結型ショート 石川数正 s5（2026-10-26）。本編 scripts/kazumasa-story.yaml の第4章（裏切りか、スパイか）と第6章の終わり（子孫の言葉）から。投稿しない。
# 形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazumasa/main/K*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml）：kazumasa-01・02・16・28・34・35
#   ・スパイとして描いたのは山岡荘八の小説、本郷和人（東大史料編纂所）は退ける（kazumasa-16）。秀吉の引き抜き（kazumasa-35）。どちらも本郷さんの名で言う。
#   ・辞典の食い違い：『日本大百科全書』「路線論争に敗れて」（kazumasa-28）／『国史大辞典』原因不詳（kazumasa-02）。
#   ・子孫の家に嫁いだ女性の言葉（小和田哲男『徳川家家臣団―子孫たちの証言』、和樂web の引用。kazumasa-34）→ 語りは「と語っている」。
#   ・小説の年・題名はカードに無いので言わない。s1（菅原の2週間の読み）とは重ならないよう、菅原説は出さない。
# 理解テスト4問：
#   ①誰の話か：石川数正（家康の重臣。天正13年11月13日に岡崎城を出て秀吉のもとへ）
#   ②いつ・どこで何が：その理由を本人は書き残していない。山岡荘八の小説は、家康のためのスパイとして描いた
#   ③研究者・辞典はどう言うか：本郷和人さんはスパイ説を退け、秀吉の引き抜きの一人とみる。『日本大百科全書』は路線論争に敗れて、『国史大辞典』は原因不詳
#   ④どうなったか：子孫の家にも理由は伝わっておらず、「なぜなのかと思った」と語られている
title: 石川数正｜スパイ説は、小説から
yt_title: 石川数正は家康のスパイだった？ そう描いたのは小説だった【山岡荘八・本郷和人】
description: |-
  天正13年11月13日の夜、徳川家康の重臣・石川数正は、岡崎城を出て、羽柴秀吉のもとへ走りました。数正自身が理由を書き残した記録は、見つかっていません。
  作家・山岡荘八の小説は、数正を、主君のためにわざと秀吉の側へ行ったスパイとして描きました。東京大学史料編纂所の本郷和人さんは、このスパイ説を退け、秀吉が盛んに行っていた有力な家臣の引き抜きに応じた一人とみています。
  辞典も割れています。『日本大百科全書』は「路線論争に敗れて」と書き、『国史大辞典』は原因を不詳としています。
  数正の子孫の家に嫁いだ女性は、理由は家に伝わっておらず、「なぜなのかと思った」ことがあると語っています。
