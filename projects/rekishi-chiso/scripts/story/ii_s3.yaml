lines:
  # fact: ii-28
- 語り: "大老を撃った弾は、胸先に当たった。そう書いた日記が、鳥取にある。"
  shot: I12_1
  tone: 強調
  pause: 0.12
  # fact: ii-19, ii-36
- 語り: "1860年、江戸城の桜田門の外で、大老、井伊直弼は、襲われて亡くなった。合図は、ピストルだった。"
  shot: TH_2
  tone: 重い
  pause: 0.12
  # fact: ii-28
- 語り: "事件の、およそ2か月後。逃げていた、襲う側の指揮役、関鉄之介が、鳥取藩の旧い知り合い、安達清一郎を訪ねる。"
  shot: I10_3
  tone: しみじみ
  pause: 0.12
  # fact: ii-28
- 語り: "安達は、日記に、関の話を書き留めた。直弼は、ピストルの弾が、胸先に当たって、死んだ。"
  shot: I11_4
  tone: 重い
  pause: 0.12
  # fact: ii-29
- 語り: "2022年の中国新聞の記事によれば、同じ日記には、合図の音のあと、守る侍たちが、15メートルほど退いた、ともある。"
  shot: I07_5
  tone: しみじみ
  pause: 0.12
  # fact: ii-28
- 語り: "この日記は、鳥取県立博物館にある。原本のありかが分かったのは、2018年のことだ。"
  shot: I09_6
  tone: しみじみ
  pause: 0.12
  # fact: ii-30
- 語り: "ところが、よく知られた話では、弾は、太ももから、腰に当たった、とされる。"
  shot: I12_7
  tone: 重い
  pause: 0.12
  # fact: ii-30
- 語り: "胸先か、腰か。弾の当たった所は、記録と解説で、割れたままだ。"
  shot: I06_8
  tone: しみじみ
  pause: 0.12
