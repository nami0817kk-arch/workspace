# 切り口：鳥取の安達清一郎の日記「ピストルの弾が胸先に当たって死んだ」と、よく知られた「太ももから腰」（本編 第3章、ii-28・29・30）。
# hook＝弾は胸先、と書いた日記が鳥取にある（答えはこのショートの中：関鉄之介の話を安達が書き留めた）。
# tease＝ピストルを撃ったのは誰か（答えは本編 第3章：『歴史街道』は黒沢忠三郎、歴史探偵は少なくとも3挺、ii-31）。
# 理解テスト：①井伊直弼を撃った弾の話 ②1860年の桜田門外の変の約2か月後、鳥取で ③関鉄之介の話を安達が日記に書いた ④胸先か腰か、記録と解説で割れたまま
title: "井伊直弼｜弾は胸先、と鳥取の日記"
yt_title: "井伊直弼を撃った弾は「胸先」に当たった　桜田門外の変の2か月後、逃げた指揮役の話を書き留めた鳥取の日記"
description: |-
  1860年、桜田門外の変のおよそ2か月後。逃げていた襲う側の指揮役・関鉄之介は、鳥取藩の旧い知り合い・安達清一郎を訪ねました。安達は日記に、直弼はピストルの弾が胸先に当たって死んだ、と書き留めています。
  日記は鳥取県立博物館にあり、原本のありかが分かったのは2018年。一方、よく知られた話では、弾は太ももから腰に当たったとされます。弾の当たった所は、記録と解説で割れたままです。
  本編では、ピストルを撃ったのは誰か、駕籠の中の大老はどうしていたのかを、記録ごとに並べています。本編は概要欄のリンクからどうぞ。
