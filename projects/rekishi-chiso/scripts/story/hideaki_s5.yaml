# 物語完結型ショート 小早川秀秋 s5（2026-10-29）。本編 scripts/hideaki-story.yaml の第5章（急死と断絶）から。
# 形式は hijikata_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 死の扱い：最期は「亡くなった」まで。病の細部・死因の病名・苦しむ様子は語らない（酒疸・肝硬変・「狂って」は使わない）。人を貶めない。
# 絵は本編の AI 絵（H05・H13・H14・H15。人物なし）と実在の絵（落合芳幾の大谷吉継）。最期の行に人物の絵を当てない。
# 事実カード：hideaki-47・35・50・36・37・38
#   ・10/15 に鷹狩りのあと床に就き、18日朝に岡山城で亡くなった、21歳は聖護院道澄の追悼文による（hideaki-47・32、武将ジャパンの紹介）。
#   ・吉継の祟りは江戸時代の軍記に見える話で裏付けは弱い（hideaki-35）。因果応報の物語という見方は光成準治（hideaki-50）。
#   ・再興は勅により毛利三郎が家督を継いだ（コトバンク、hideaki-37）。瑞雲寺は観光協会の紹介（hideaki-38、単一出どころ）。
# 理解テスト4問：
#   ①誰の話か：岡山城で亡くなった小早川秀秋（21歳）
#   ②いつ・どこで：1602年10月15日に鷹狩りから戻って床に就き、18日の朝、岡山城で亡くなった（聖護院道澄の追悼文）
#   ③死のあと：跡継ぎがおらず小早川家は断絶。「吉継の祟り」は軍記の話で裏付けは弱い。光成準治は因果応報の物語とみる
#   ④どうなったか：およそ277年後の1879年、毛利三郎が家督を継いで再興。菩提寺の瑞雲寺の本堂は空襲を免れて残る
title: 小早川秀秋｜21歳で亡くなり、家は途絶え、277年後に再興された
yt_title: 小早川秀秋は21歳で亡くなり、小早川家は断絶　277年後の1879年に再興されるまで
description: |-
  1602年10月15日、小早川秀秋は、鷹狩りから城へ戻ったあと、気分が悪くなって、床に就きました。聖護院道澄の追悼文によれば、18日の朝、岡山城で亡くなります。21歳でした。
  秀秋には跡継ぎがおらず、小早川家は慶長7年に断絶します。備前には、翌年、池田輝政の次男、忠継が入りました。「大谷吉継の祟りで死んだ」という話は江戸時代の軍記に見えますが、史料の裏付けは弱いといいます。光成準治さんは、裏切り者の末路は惨めであるべきだという、因果応報の物語として作られた、と見ています。
  およそ277年後の明治12年、1879年、勅により毛利三郎が家督を継いで、小早川家は再興されました。観光協会の紹介によれば、岡山市の瑞雲寺は、1602年に秀秋の菩提寺となりました。
