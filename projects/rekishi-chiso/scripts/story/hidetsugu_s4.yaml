# 物語完結型ショート 豊臣秀次 s4（2026-10-28）。本編 scripts/hidetsugu-story.yaml の第5章（聚楽第の破却と発掘）から。投稿しない。
# 形式は kazumasa_s1.yaml・asahi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵＋《聚楽第図屏風》。
# 事実カード（dev/output/rekishi-chiso/research/豊臣秀次_facts_20261028.yaml）：hidetsugu-01・17・26・27
#   ・『日本西教史』「一宇も残さず、基礎にいたるまで悉く毀たしめ」・資材は伏見などへ・築城から破却まで9年（hidetsugu-17。京都市 2023 の資料が引く）。
#   ・2012年の発掘：本丸南濠の石垣を初めて検出・濠から金箔瓦（hidetsugu-26。京都府埋文の報告集 2013）。
#   ・2023年：絵図に描かれていない「西外堀」の推定位置で、幅約12m・深さ約3mの堀状遺構（hidetsugu-27。京都市の記者発表）。
#   ・聚楽第を秀次に譲った話はカードに無いので言わない（本編と同じく「秀吉が築いた城。秀次の失脚とともに壊された」まで）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀次の失脚とともに壊された、京都の聚楽第（秀吉が築いた城）
#   ②いつ・どこで何が：文禄4年、秀次が失脚して高野山で腹を切ったあと、聚楽第は基礎まで壊された（『日本西教史』「一宇も残さず」）
#   ③どうしたか：建物や石垣の材は伏見などへ運ばれた。築いてから9年だった
#   ④どうなったか：2012年の発掘で本丸の南の濠の石垣と金箔の瓦、2023年には絵図に無い西の外堀とみられる堀の跡が見つかった
title: 豊臣秀次｜「一宇も残さず」壊された聚楽第
yt_title: 豊臣秀次の失脚で聚楽第は「一宇も残さず」壊された【2012年の発掘で石垣と金箔瓦】
description: |-
  文禄4年、関白だった豊臣秀次は失脚し、高野山で腹を切りました。秀吉が京都に築いた豪華な城、聚楽第も、秀次の失脚とともに壊されます。
  宣教師の側の記録をもとにした『日本西教史』は、「一宇も残さず、基礎にいたるまで、ことごとく壊させた」と書いています。建物や石垣の材は伏見などへ運ばれ、築かれてから壊されるまで、わずか9年でした。
  2012年の発掘で、本丸の南の濠の石垣が初めて見つかり、濠からは金箔の瓦も出ました。2023年には、絵図に描かれていない西の外堀とみられる、幅およそ12メートルの堀の跡も確かめられています。
