# 切り口：お金の工面（1694年 イングランド銀行／1695年 元禄の改鋳）と、1730年の堂島の米の先物（本編 第3章、edo-41・42・45）。
# hook＝同じころ、足りないお金を、イングランドと幕府はどう工面したのか（答えはこのショートの中：借りた／金を薄めた）。
# tease＝同じころの日本の人口は、イングランドの何倍だったのか（答えは本編 第3章：およそ6倍、edo-38・40）。
# 計算：1694→1695＝翌年。1730→1848＝118年。
# 理解テスト：①同じころのイングランドと幕府のお金の工面の話 ②1694年 イングランド銀行が市民から120万ポンド、1695年 幕府が元禄の改鋳 ③借りるか、金を薄めるか ④1730年に堂島の米の先物が認められ、シカゴの取引所はその118年後
title: "1694年と1695年｜お金の工面"
yt_title: "1694年、イングランド銀行は市民から11日で120万ポンドを集めた　翌1695年、幕府は小判の金を減らした　借りる国と、薄める幕府"
description: |-
  1694年、イングランドでは、新しくできたイングランド銀行が、1268人の市民から11日で120万ポンドを集め、フランスとの戦の資金として政府に貸しました。その翌年の1695年、幕府は、小判に含まれる金を減らす元禄の改鋳をします。
  1730年には、大坂の堂島の米の市場が幕府に認められ、先物の取引も一緒に開かれていました。研究者のシェーデは、今の先物取引所の条件をそろえた最初の組織的な取引所は18世紀の日本にあった、と書いています。シカゴの商品取引所ができるのは1848年です。
  本編では、家康から慶喜までの260年を、同じ年の世界と並べています。本編は概要欄のリンクからどうぞ。
