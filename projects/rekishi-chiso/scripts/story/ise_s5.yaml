# 切り口：1830年のおかげ参り、銭なしで伊勢へ行けた施行（本編 序章・第7章、ise-01・29・30・36・39）。ある農民＝1845年の田中国三郎（ise-01）。長さの都合で名は出さない。
# hook＝銭なしで伊勢まで行けたか（答えはこのショートの中：施行があったから行けた）。
# tease＝いちばん大きな神楽のために、ある講が納めたのは何両か（答えは本編 第6章：太々神楽に104両、ise-21）。
# 計算（数え直した）：3,200万÷500万＝6.4→6人か7人に1人。12文×1,400＝16,800・12文×1,500＝18,000。
#   16,800÷7,048＝2.38→国三郎の伊勢まで16日の額の2倍を超える。
# 理解テスト：①1830年のおかげ参りの話 ②1830年、伊勢へ向かう街道（三河の牛川村・遠江の見付村） ③銭を持たずに出ても、施行で食べ物・馬・駕籠・草鞋をただで受けられた ④見付村は1日で1万6,800〜1万8,000文を配った
title: "伊勢参り｜銭なしで行けた年"
yt_title: "1830年のおかげ参り　銭を持たずに家を出ても伊勢まで行けた　ある村は1日で、伊勢までの旅費の2倍を超える銭を配った"
description: |-
  江戸時代、伊勢へ人々が一度に押し寄せた年がありました。おかげ参りです。1830年のおかげ参りの人数は、国立国会図書館の解説でおよそ430万人、観光庁の解説で400万人から500万人。当時の人口はおよそ3,200万人です。
  銭が無くても行けたのは、施行があったからです。三河の牛川村の暦の書き込みには、銭なしでも参り、所々に施行がある、とあります。遠江の見付村は、1830年8月21日、旅人1人に12文ずつ、1日だけで1,400人から1,500人に配りました。1845年に伊勢へ向かった農民が、伊勢までの16日で使った7,048文の2倍を超えます。
  本編では、伊勢までの1日ずつの出費と、伊勢で待つ御師の宿や神楽の値段までたどっています。本編は概要欄のリンクからどうぞ。
