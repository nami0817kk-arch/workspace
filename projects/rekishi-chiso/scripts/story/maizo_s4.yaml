lines:
  # fact: maizo-49, maizo-51
  - 語り: 《!千両箱》の音を聞いた男は、10年近く、黙っていた。
    shot: M11
    tone: 強調
    pause: 0.12
  # fact: maizo-49
  - 語り: 明治10年、1877年の7月14日。東京府の知事に、一通の願書が出された。
    shot: Meiji
    tone: しみじみ
    pause: 0.12
  # fact: maizo-49, maizo-51
  - 語り: 出したのは、豊島村の島村弥三郎。願いは、埋め金の、引き上げだった。
    shot: Meijib
    tone: しみじみ
    pause: 0.12
  # fact: maizo-49
  - 語り: 明治元年の夜、島村は、浅草の御蔵の、五番と六番の堀を、船で通りかかった。
    shot: M09
    tone: しみじみ
    pause: 0.12
  - 語り: 浅草の御蔵は、隅田川のほとりにあった、幕府の米蔵だ。
    shot: M03
    tone: しみじみ
    pause: 0.12
  # fact: maizo-49
  - 語り: 大勢が騒がしく、千両箱、という声と、箱を崩す音が聞こえた。金が沈められたのだ、と島村は考えた。
    shot: M11b
    tone: 重い
    pause: 0.15
  # fact: maizo-51
  - 語り: 御蔵の役人からは、誰にも話すな、と固く止められた、と島村は書いている。
    shot: M11c
    tone: しみじみ
    pause: 0.12
  # fact: maizo-51
