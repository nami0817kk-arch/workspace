# 物語完結型ショート 徳川埋蔵金 s4（2026-11-05）。本編 scripts/maizo-story.yaml（11/6 12:00 公開）の第5章（浅草の堀）から。11/7 16:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（願書に本人が書いたことだけ）。
# 絵は本編の AI 絵（out/story/maizo/main/M*）と、明治初期の東京の写真（本編では使っていない。大久保利通の回の素材 paintings/okubo_syoheibashi_meiji.jpg）。
#   M08・M12・M13・M14・M15 は使わない（s1 の頭のとおり）。M11 は夜の堀に舟と蔵の並び（奥に塔。浅草寺の五重塔に見えてよい）。
# 切り口：明治10年、千両箱の音を聞いたという男が、10年近く黙ったあとに東京府へ出した「埋メ金引上ケ願書」。府は探すことを許したが、その先の記録は無い。
#   本編の答え（軍艦の金）は言わない。点数（3点）は言わない。
# 事実カード：maizo-49・50・51（東京都公文書館の解読文。本編の言い方のまま）。
# 計算（自分で計算し直した）：明治10年＝1877年。明治元年＝1868年→1877年は9年（「10年近く」は本編どおり）。7月14日の願書→7月28日の許し（14日後。ショートには日数を入れない）。
#   「4年前に甥に話し」は願書の時点から（1873年ごろ）。年は言わない。
# 理解テスト4問：
#   ①誰の話か：豊島村の島村弥三郎（明治10年に東京府へ願書を出した人）
#   ②いつ・どこで何が：明治元年の夜、浅草の御蔵の五番・六番の堀を船で通ると、千両箱という声と箱を崩す音が聞こえた
#   ③何をしたか：役人に口止めされ、10年近く黙っていたが、甥に話して証人を得て、1877年7月14日に引き上げを願い出た
#   ④どうなったか：東京府は大蔵省に問い合わせて7月28日に探すことを許した。掘ったか・出たかは記録に無い
title: 浅草の堀｜千両箱の音を聞いた男
yt_title: 徳川埋蔵金は浅草の堀に沈んだ？　明治10年、千両箱の音を聞いた男が東京府に出した願書
description: |-
  明治10年（1877年）の7月14日、東京府に「埋メ金引上ケ願書」という一通の願書が出されました。
  出したのは豊島村の島村弥三郎。明治元年の夜、浅草の御蔵の五番と六番の堀を船で通りかかると、大勢が騒がしく、千両箱という声と、箱を崩す音が聞こえた、と書いています。御蔵の役人からは誰にも話すなと固く止められ、4年前に甥に話して証人になると言われ、願い出たといいます。東京府は大蔵省に問い合わせ、7月28日に探すことを許しました。掘ったのか、何か出たのか。記録は、そこで終わっています（東京都公文書館の解読によります）。
  では、記録で行き先まで追える幕府の金は、どこにあったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川埋蔵金', '#浅草', '#日本史']
