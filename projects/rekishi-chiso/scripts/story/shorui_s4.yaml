# 切り口：「戌年だから犬を大事に」と隆光が勧めた話は、最初の触れ（1685年7月）と隆光の江戸入り（1686年）の年が合わない。教科書は『三王外記』にもとづく理解とする（本編の第5章）。
# 計算（自分で計算し直した）：1686−1685＝翌年／綱吉の生年1646（正保3）＝丙戌
title: "生類憐みの令｜戌年だから犬を、の話は年が合わない"
yt_title: "生類憐みの令は、綱吉が戌年生まれだから？　僧の隆光が勧めたという話と、最初の触れの年が合わない"
description: |-
  将軍は戌年の生まれだから、犬を大事にすれば子に恵まれる。僧の隆光が、徳川綱吉にそう勧めた、という話があります。
  けれど、最初の触れとしてよく挙げられる触れは1685年の7月、隆光が江戸の知足院に入ったのは、その翌年の1686年です。2013年の山川出版社の高校の教科書は、この話は『三王外記』という一冊の本にもとづく理解だと思われる、としています。
  本編では、触れの中身・罰の記録・悪い評判の出どころを並べて、生類憐みの令は本当に悪法だったのかを確かめています。本編は概要欄のリンクからどうぞ。
