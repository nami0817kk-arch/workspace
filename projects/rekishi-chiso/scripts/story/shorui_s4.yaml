lines:
  # fact: shorui-05
- 語り: "犬を大事にすれば、子に恵まれる。将軍は、戌年の生まれだから。僧の隆光が、綱吉にそう勧めた、という話がある。"
  shot: N18_1
  tone: 強調
  pause: 0.12
  # fact: shorui-22
- 語り: "5代将軍、徳川綱吉は、1646年、正保3年の正月の生まれ。この年は、たしかに戌年だった。"
  shot: N04_2
  tone: しみじみ
  pause: 0.12
  # fact: shorui-18, shorui-27
- 語り: "けれど、年が合わない。最初の触れとして、よく挙げられる、犬や猫をつながなくてよいという触れは、1685年の7月。"
  shot: N03_3
  tone: 重い
  pause: 0.12
  # fact: shorui-18
- 語り: "隆光が、江戸の知足院に入ったのは、その翌年、1686年だ。"
  shot: N18_4
  tone: 重い
  pause: 0.12
  # fact: shorui-18
- 語り: "2014年の朝日新聞は、隆光自身の日記に、そうした記述はない、と紹介した。"
  shot: N17_5
  tone: しみじみ
  pause: 0.12
  # fact: shorui-19
- 語り: "2013年の山川出版社の高校の教科書は、この話は、『三王外記』という一冊の本にもとづく理解だと思われる、とする。太宰春台が書いたと伝わる本だ。"
  shot: N25_6
  tone: しみじみ
  pause: 0.12
  # fact: shorui-21
- 語り: "ただ、戌年の話は、綱吉のころに江戸へ上った、ドイツ人の医者、ケンペルも、迷信だとして、書き留めている。"
  shot: N20_7
  tone: しみじみ
  pause: 0.12
  # fact: shorui-20, shorui-24
- 語り: "では、生類憐みの令の悪い評判は、誰の筆から、広まったのか。"
  shot: N17_8
  tone: 疑問
  pause: 0.15
