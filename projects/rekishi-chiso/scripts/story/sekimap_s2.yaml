title: "関ヶ原のあと｜毛利はどれだけ減った"
yt_title: "関ヶ原のあと、毛利家の石高は3分の1ほどに　集めた年貢を返し、萩に城を築き、借金は銀4000貫目"
description: |-
  中国地方の大半を持っていた毛利家は、関ヶ原のあと、周防と長門の2か国、36万9411石に減らされました。関ヶ原の前の石高は本によって112万石とも120万石あまりともされ、どちらで比べても3分の1ほどです。
  しかも毛利は、移る前に、もとの6か国で集めた年貢を返すように求められました。1610年に終わった検地では、周防と長門は53万9286石と出ます。それでも、幕府に認められた表向きの石高は36万9411石のままでした。萩の藩の借金は、1623年に銀4000貫目に達しています。
  本編では、取り上げた石高の総量から、東海道の大名の行き先、上杉・佐竹・島津のその後まで、関ヶ原の前と後の大名の地図を数字で積み上げています。本編は概要欄のリンクからどうぞ。
