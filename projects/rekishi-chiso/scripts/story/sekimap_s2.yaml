lines:
  # fact: sekimap-23, sekimap-51
- 語り: "中国地方の大半を持っていた毛利家。関ヶ原のあと、その石高は、3分の1ほどに減らされた。"
  shot: R08_1
  tone: 強調
  pause: 0.12
  # fact: sekimap-52, sekimap-53
- 語り: "一門の吉川広家が、徳川方に通じていたこともあり、毛利は、取りつぶしは免れた。"
  shot: R24_2
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-50, sekimap-51
- 語り: "前の石高は、辞典によって、112万石とも、120万石あまりとも書かれている。あとの周防と長門は、36万9411石。"
  shot: R06_3
  tone: 重い
  pause: 0.12
  # fact: sekimap-55
- 語り: "しかも毛利は、移る前に、もとの6か国で集めた年貢を、返すように求められた。"
  shot: R07_4
  tone: 重い
  pause: 0.12
  # fact: sekimap-54
- 語り: "1604年、毛利輝元は、日本海に面した萩に、新しい城を築き始める。"
  shot: N01_6
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-51, sekimap-56
- 語り: "1610年に終わった検地で、周防と長門は、53万9286石と出た。8割も増えている。それでも幕府に認められた、表向きの石高は、36万9411石のままだった。"
  shot: R14_7
  tone: 重い
  pause: 0.12
  # fact: sekimap-57
- 語り: "萩の藩の借金は、1623年に、銀4000貫目に達した。それが片づいたのは、1632年の8月だ。"
  shot: R06_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第7章（福島正則、1619年に安芸と備後を取り上げられる、sekimap-24）
- 語り: "では、毛利が手放した広島に入った大名は、そのあと、どうなったのか。"
