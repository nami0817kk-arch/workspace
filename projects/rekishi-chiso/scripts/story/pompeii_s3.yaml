lines:
  # fact: pom-31
- 語り: "炭になったザクロが、山になって見つかっている。ポンペイの西、オプロンティスの建物だ。"
  shot: P09_1
  tone: 強調
  pause: 0.12
  # fact: pom-28
- 語り: "1797年、ナポリの学者ロジーニは、ザクロとクリと干したイチジクを根拠に、8月の噴火を疑った、と紹介される。"
  shot: P08_2
  tone: しみじみ
  pause: 0.12
  # fact: pom-32
- 語り: "ボスコレアーレの農園の建物では、ワインで満たされ、封をされた、大きな甕が見つかった。"
  shot: P10_3
  tone: しみじみ
  pause: 0.12
  # fact: pom-32
- 語り: "2001年から2002年の論文は、これを、ブドウの搾りが、もう済んでいた印だ、と読んだ。"
  shot: P10_4
  tone: しみじみ
  pause: 0.12
  # fact: pom-76
- 語り: "2025年、スペインの大学の班が、犠牲者14人の服の跡を調べ、多くが厚い毛織りの服を重ねていた、と報告した。論文になる前の報告だ。"
  shot: P11_5
  tone: 重い
  pause: 0.12
  # fact: pom-45
- 語り: "反論もある。干した果物は、何か月も保つ。前の年の実りかもしれない。"
  shot: P08_6
  tone: 重い
  pause: 0.12
  # fact: pom-45, pom-33
- 語り: "厚い服は、降ってくる熱い石から、身を守るために着たのかもしれない。封をした甕も、長く寝かせるワインだったかもしれない。"
  shot: P16_7
  tone: 重い
  pause: 0.12
  # fact: pom-74
- 語り: "実際、ポンペイの周りの出土品には、夏の桃の種と、秋のクリが、どちらも見つかっている。"
  shot: P09_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第5章・第6章（炭の落書きと2024年の試し）
- 語り: "土の中の手がかりは、決め手にならない。では、2018年に壁で見つかった日付は、何を語るのか。"
  shot: P14_9
  tone: 疑問
  pause: 0.15
