# 切り口：秋の噴火の手がかり（果物・封をした甕・厚い服）と、その反論（本編 第4章・第6章、pom-28・31・32・33・45・74・76）。
# 字幕では読点が消えるので、並べる語は「」で区切るか「と」でつなぐ。
title: "ポンペイ｜ザクロと封をした甕は、秋の噴火の印か"
yt_title: "ポンペイの噴火は秋だった？　炭になったザクロ、ワインで満たし封をした甕、厚い毛織りの服　その手がかりと反論"
description: |-
  ポンペイの西、オプロンティスの建物では、炭になったザクロとクルミが、山になって見つかっています。噴火は8月ではなく秋だった、と唱える人が挙げる手がかりの1つです。
  1797年には、ナポリの学者ロジーニが、ザクロやクリや干したイチジクを根拠に、8月を疑ったと紹介されます。ボスコレアーレの農園では、ワインで満たされ封をされた大きな甕が見つかり、ブドウの搾りが済んでいた印だ、と読まれました。
  反論もあります。干した果物は何か月も保ちます。厚い服は、降ってくる熱い石から身を守るためかもしれません。封をした甕も、長く寝かせるワインかもしれません。
  本編では、写本・秋の手がかり・2018年の炭の落書き・2024年の考古公園の試しを並べ、言えることと言えないことを分けています。本編は概要欄のリンクからどうぞ。
