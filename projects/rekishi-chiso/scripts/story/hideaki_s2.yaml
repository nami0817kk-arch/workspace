    pause: 0.12
  # fact: hideaki-09
  - 語り: 高橋陽介さんは、西尾家の家譜を読む。8月26日ごろ、近江の柏原で、秀秋は、家康の使者、西尾正義と会い、東軍に味方すると、約束した、と。
    shot: H10
