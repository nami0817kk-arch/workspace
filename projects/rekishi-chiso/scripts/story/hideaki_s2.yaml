# 物語完結型ショート 小早川秀秋 s2（2026-10-29）。本編 scripts/hideaki-story.yaml の第2章（開戦の半月前）から。
# 形式は hijikata_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（H01・H03・H04・H10）と実在の絵（伝秀秋像・黒田長政）。伝秀秋像は「伝」を付ける。
# 事実カード：hideaki-39・09・11・13・14・20
#   ・西尾家譜の読みは高橋陽介（hideaki-09）、9/13 の指示（hideaki-13）。誰の読みかを語りで言う。
#   ・開戦前から東軍か：白峰・高橋／光成・呉座（hideaki-20）。どちらとも決めない。秀秋の動機は断定しない。
# 理解テスト4問：
#   ①誰の話か：関ヶ原のとき数えで19歳の小早川秀秋
#   ②いつ・どこで何が：1600年8月26日ごろ、近江の柏原で家康の使者と会い、東軍に味方すると約束した、と高橋陽介は家譜を読む
#   ③その後：28日に黒田長政・浅野幸長の書状、9月13日に家康の指示、9月14日に松尾山に入った
#   ④どうなったか：開戦前から東軍だったか、西軍の戦略で松尾山に入ったか、研究者の見立ては割れている
title: 小早川秀秋｜関ヶ原の半月前、家康の使者と会っていたのか
yt_title: 小早川秀秋は関ヶ原の半月前に家康の使者と会っていた？　同じ家譜と手紙で見立てが割れる
description: |-
  関ヶ原のとき、数えで19歳だった小早川秀秋。高橋陽介さんは、『寛政重修諸家譜』にある西尾家の家譜から、秀秋が8月26日ごろ、近江の柏原で家康の使者の西尾正義と会い、東軍に味方すると約束した、と読みます。
  28日には黒田長政と浅野幸長が書状を送り、9月13日の早朝には家康が、西軍への敵対をはっきりさせるよう指示した、と伝えられます。小早川勢が松尾山に入ったのは9月14日です。
  秀秋は開戦前から東軍だったのか。白峰旬さんと高橋さんは、そうだと見ます。光成準治さんと呉座勇一さんは、西軍の戦略として松尾山に入り、開戦のあとに寝返った、と見ています。
hashtags: ["#小早川秀秋", "#日本史", "#関ヶ原"]
ai_images: true
