# 物語完結型ショート 伊達政宗 s1（2026-10-29）。本編 scripts/masamune-story.yaml の導入と第2章（眼帯と「独眼竜」はどこから来たのか）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/masamune/main/M*.jpg・TKM）と実在の肖像（狩野安信・土佐光貞と伝わる像）。
#   この回の決まり：AI 絵の政宗に眼帯は無い。右目が見えている AI 絵の切り出しを作らない（M01 は両目が見えるので使わない。TKM・M09 は左の横顔だけ）。
#   眼帯は M04（撮影所の小道具）だけ。実在の肖像は「両方の目が描かれている」「白く描いた像」と語る行に、顔に寄らない全身で出す。
# 事実カード（dev/output/rekishi-chiso/research/伊達政宗_facts_20261028.yaml）：masamune-05・77・78・24・84・10
#   ・眼帯の肖像が無い・映画やドラマで広がったイメージは仙台市博物館の佐々木徹（市政だより 2017）→ 名と年を言う。
#   ・独眼竜＝李克用・頼山陽のたとえは谷原秀信（熊本大学 2013、masamune-24）→ 名と年を言う。
#   ・右目を白く描いた像は出どころが1つ（masamune-10）→「といわれる」。絵師・所蔵は語りで言わない。
# 理解テスト4問：
#   ①誰の話か：伊達政宗（独眼竜）の眼帯の姿
#   ②いつ・どこで何が：江戸時代の肖像画に眼帯の姿は一枚も無い（仙台市博物館の佐々木さん、2017年）
#   ③眼帯と呼び名はどこから来たか：眼帯は映画・ドラマ・ゲームで広がったイメージ（1987年の大河は39.7%）。独眼竜は唐の李克用のあだ名で、頼山陽のたとえで広まった
#   ④どうなったか：江戸時代の画像は両目か、右目を白く描いた像。どちらにも眼帯は無い
title: 伊達政宗｜眼帯の肖像画は、一枚も無い
yt_title: 伊達政宗の眼帯の肖像画は一枚も無い　独眼竜の姿はどこから来たのか
description: |-
  右目に眼帯をつけた独眼竜、伊達政宗。その姿で描かれた江戸時代の肖像画は、一枚もありません。仙台市博物館の学芸員、佐々木徹さんが、2017年の仙台市の広報で記しています。眼帯の姿は、映画やドラマ、ゲームなどで広がったイメージだろう、と。
  1987年のNHK大河ドラマ『独眼竜政宗』は、平均視聴率39.7パーセント。大河ドラマの歴代最高といわれます。
  「独眼竜」は、もとは唐の終わりごろの武将、李克用のあだ名。熊本大学の谷原秀信さんは2013年、江戸時代の学者、頼山陽が政宗を李克用になぞらえて、この名が広まったと述べています。
  1676年ころの狩野安信の画像には、両方の目が描かれています。右目を白く濁ったように描いた像もわずかに伝わるといわれますが、その像にも眼帯はありません。
