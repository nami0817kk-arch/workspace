lines:
  # fact: masamune-07, masamune-83, masamune-82
  - 語り: 伊達政宗の右目は、なぜ見えなくなったのか。藩の記録には、ふしぎな説と、《!言い伝え》まで並んでいる。
    shot: M02f
    tone: 強調
  - 語り: 1567年、米沢に生まれた政宗の幼い名は、梵天丸。
    shot: M02w
    tone: しみじみ
    pause: 0.12
  # fact: masamune-07
  - 語り: 梵天丸は、疱瘡、今でいう天然痘にかかる。
    shot: Smallpox
    tone: 重い
    pause: 0.12
  # fact: masamune-07
  - 語り: 仙台藩の記録、『治家記録』は、病の毒が目に集まり、それから、右の目が見えなくなった、と書く。
    shot: M02
    tone: しみじみ
    pause: 0.12
  # fact: masamune-81
  - 語り: いつのことかは、小さな字で、「年月知らず」。5歳と書く文章もあるが、記録に年は無い。
    shot: Hososhin
    tone: しみじみ
    pause: 0.12
  # fact: masamune-83
  - 語り: 同じ記録には、片目の行者、萬海上人の生まれ変わりだから片目なのだ、という説も載る。
    shot: M07
    tone: 強調
    pause: 0.12
  # fact: masamune-83
  - 語り: 上人が身を清めた黒沼の魚まで、みな片目になった。記録はそう書いたうえで、疱瘡のせいだと、説を退けた。
    shot: M06m
    tone: しみじみ
    pause: 0.12
  # fact: masamune-82
  - 語り: もうひとつ、家臣の片倉小十郎景綱が、その右目を、取り去った、という話もある。
    shot: M03
    tone: 重い
    pause: 0.12
  # fact: masamune-82
  - 語り: ただ、記録はこの話を、「云ひ伝ふ」。《!言い伝え》として書いている。
    shot: M03b
    tone: 強調
    pause: 0.3
    dip: true
  - 語り: 生まれ変わりも、家臣の話も。片目のわけを、のちの人々は、何かに求めたのかもしれない。
    shot: M02w
    tone: しみじみ
    pause: 0.15
  - 語り: あなたなら、記録の3つの話の、どれを《信じますか》。
    shot: M02q
    tone: 疑問
    pause: 0.15
