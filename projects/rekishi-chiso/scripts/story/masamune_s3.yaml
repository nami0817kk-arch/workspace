# 物語完結型ショート 伊達政宗 s3（2026-10-29）。本編 scripts/masamune-story.yaml の第1章の前半（梵天丸の右目）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/masamune/main/M*.jpg）と実在の絵（月岡芳年の疱瘡の神を退ける図）。
#   この回の決まり：AI 絵の政宗に眼帯は無い。右目が見えている絵の切り出しを作らない（M01 は使わない。M02 の子は顔が見えない、M03 の少年は後ろ姿）。
#   目の処置の様子は描かない・語らない（片倉の話は「取り去った、という話」まで。M03 は家臣が頭を下げる絵で刃物は無い）。
# 事実カード（dev/output/rekishi-chiso/research/伊達政宗_facts_20261028.yaml）：masamune-07・81・83・82
#   ・『治家記録』「疱瘡ヲ患ヒシ時年月不知餘毒御目ニ聚テ、其ヨリ右ノ方盲ヒ玉ヒシナリ」（「年月不知」は割注）。「5歳のとき」は公的な出どころが無いので「書く文章もある」まで。
#   ・萬海上人の生まれ変わりの説と黒沼の魚（masamune-83）は、記録自身が疱瘡のせいだとして退けている。
#   ・片倉小十郎景綱の話は記録自身が「云ヒ傳フ」（masamune-82）。
#   ・1567年に米沢に生まれた・幼名は梵天丸は誰でも知っている前置き（本編も fact なし）。
# 理解テスト4問：
#   ①誰の話か：伊達政宗（幼名・梵天丸）の右目
#   ②いつ・どこで何が：米沢で生まれた梵天丸が疱瘡にかかり、病の毒が目に集まって右目が見えなくなった（仙台藩の『治家記録』）。いつかは「年月知らず」
#   ③記録はほかに何を書いたか：片目の行者・萬海上人の生まれ変わりという説（黒沼の魚まで片目）と、片倉小十郎が右目を取り去ったという話
#   ④どうなったか：記録は生まれ変わりの説を疱瘡のせいだとして退け、片倉の話は「云ひ伝ふ」＝言い伝えとして書いた
title: 伊達政宗｜右目を失ったわけ、記録の中の3つの話
yt_title: 伊達政宗の右目はなぜ見えなくなったのか　藩の記録に残る生まれ変わりの説と言い伝え
description: |-
  1567年、出羽の国の米沢に生まれた伊達政宗。幼い名を梵天丸といいました。
  仙台藩の記録『治家記録』は、梵天丸が疱瘡、今でいう天然痘にかかり、病の毒が目に集まって、それから右の目が見えなくなった、と書きます。その時期には、小さな字で「年月知らず」と添えています。
  同じ記録には、片目の行者、萬海上人の生まれ変わりだから政宗も片目なのだ、という説も載っています。上人が身を清めた黒沼の魚まで、みな片目になったという言い伝えまで。記録は、片目になったのは疱瘡のせいだとして、その説を退けています。
  家臣の片倉小十郎景綱が右目を取り去った、という話も、記録は「云ひ伝ふ」、言い伝えとして書いています。
hashtags: ["#伊達政宗", "#日本史", "#戦国時代"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
