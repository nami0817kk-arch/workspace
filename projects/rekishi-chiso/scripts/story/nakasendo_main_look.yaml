# 物語型の本編（横 16:9）の見た目と絵の割り当て：中山道の旅は何泊何日か（scripts/nakasendo-story.yaml）。chiso/storymain.py が読む。
# 11-26 作成（12/1 12:00 公開予定）。rujin_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini、11-26。out/story/nakasendo/main/<名>.jpg）と、英泉・広重の木曽街道・東海道の版画（パブリックドメイン、額のカード）。
#   江戸後期（1830年代）の中山道：笠・合羽・振り分け荷物の旅人、茅葺きと板葺きの宿場、杉と檜の山、石畳。字・紋・のぼりの字は描かない。実在の人物の顔は描かない（名指さない旅人）。
