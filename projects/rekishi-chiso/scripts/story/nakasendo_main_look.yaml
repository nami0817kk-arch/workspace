  N01: {scene: 夕暮れの山の峠道を一人で歩く笠の旅人の後ろ姿、遠くに煙を上げる浅間山, pan: h, crops: &c {wide: [1.12, 0.5, 0.5], left: [1.18, 0.4, 0.5], right: [1.18, 0.62, 0.5]}}
