lines:
  # fact: rikyu-01, rikyu-06, rikyu-07, rikyu-08
  - 語り: 秀吉に仕えた茶人、千利休。その最期は、記録によって、《!3つ》に割れている。
    shot: R01f
    tone: 強調
  # fact: rikyu-01
  - 語り: 天正19年2月、利休は、秀吉の命で、腹を切った。そう伝えられてきた。
    shot: K05
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-06, rikyu-07
  - 語り: けれど、大日本茶道学会の会長、田中仙堂さんは、2017年の記事で、そのころの記録を並べ直した。
    shot: R10
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-07
  - 語り: 京の北野天満宮の日記は、「利休は《成敗》された」と書く。自分で腹を切ったとは、書いていない。
    shot: R03
    tone: 強調
    pause: 0.12
  # fact: rikyu-06
  - 語り: 奈良の興福寺の僧の日記は、2月28日の切腹を、「うわさ」として書いた。
    shot: R10b
    tone: しみじみ
    pause: 0.12
  # fact: rikyu-06
  - 語り: しかも同じ日記には、利休は《高野山》に追放された、という話まで載っている。
    shot: R05L
    tone: 重い
    pause: 0.3
    dip: true
  # fact: rikyu-08
  - 語り: 切腹の場面を、天気や見張りの様子まで詳しく書くのは、『千利休由緒書』だ。
    shot: Poem
    tone: しみじみ
    pause: 0.15
  # fact: rikyu-08
  - 語り: 書いたのは、利休のひ孫の世代の、江岑宗左。紀州徳川家に命じられて、のちの時代に差し出した文書だった。
    shot: R10c
    tone: しみじみ
    pause: 0.12
  - 語り: 成敗、うわさと追放、そして詳しい切腹の場面。記録は、時代を下るほど、詳しくなっていく。
    shot: R01w
    tone: 重い
    pause: 0.15
  - 語り: あなたなら、どの記録を、《信じますか》。
    shot: R01q
    tone: 疑問
    pause: 0.15
