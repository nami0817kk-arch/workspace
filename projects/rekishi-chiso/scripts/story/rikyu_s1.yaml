  - {at: 2017年, text: "2017年　記事", point: 0}
  - {at: 北野天満宮, text: "天正19年　京", point: 0}
  - {at: 興福寺, text: "天正19年　奈良", point: 0}
  - {at: 書いたのは, text: "後の時代　紀州徳川家", point: 1}
