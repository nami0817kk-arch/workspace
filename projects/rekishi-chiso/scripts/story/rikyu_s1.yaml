# 物語完結型ショート 千利休 s1（2026-10-28）。本編 scripts/rikyu-story.yaml の序章・第1章（三つの記録の食い違い）から。投稿しない。
# 形式は kazumasa_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/rikyu/main/R*.jpg・K05）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/千利休_facts_20261028.yaml）：rikyu-01・06・07・08
#   ・北野社家日記「成敗」（rikyu-07）・多聞院日記「うわさ」と「高野山へ追放」（rikyu-06）・由緒書は江岑宗左が紀州徳川家の命で出した後年の文書（rikyu-08）は、
#     どれも田中仙堂（PRESIDENT Online 2017）が並べ直したもの → 語りで田中さんの名と年を言う。
#   ・語りでは日記の名を言わず「北野天満宮の日記」「興福寺の僧の日記」とし、名は表に出す（画面で『』が行末に残るのを避けた）。
#   ・「成敗＝罰として命を取られた」の言い換えは本編と同じ。由緒書の年はカードに無いので言わない（「後の時代に」）。
# 理解テスト4問：
#   ①誰の話か：千利休（秀吉に仕えた茶人）の最期
#   ②いつ・どこで何が：天正19年2月、秀吉の命で腹を切ったと伝えられてきた
#   ③記録はそれぞれ何と書いたか（語りは「北野天満宮の日記」「興福寺の僧の日記」、名は表に出る）：『北野社家日記』は「成敗された」（自分で腹を切ったとは書かない）／『多聞院日記』は2月28日の切腹を「うわさ」とし、高野山へ追放の話も
#   ④どうなったか：切腹の場面を詳しく書くのは、ひ孫の世代の江岑宗左が紀州徳川家の命で後に出した『千利休由緒書』。記録は時代を下るほど詳しくなる
title: 千利休｜最期の記録は、3つに割れた
yt_title: 千利休の最期は「切腹」だけではない　同じ時代の日記は「成敗」と「うわさ」
description: |-
  天正19年2月、茶人・千利休は、豊臣秀吉の命で腹を切った、と伝えられてきました。
  けれど、大日本茶道学会の田中仙堂さんが2017年の記事で並べ直した記録は、ひとつに定まりません。
  北野天満宮の『北野社家日記』は、利休が「成敗された」と書きます。奈良・興福寺の『多聞院日記』は、2月28日の切腹を「うわさ」とし、同じ日記に、高野山へ追放されたという話も載せています。
  切腹の場面を、天気や見張りの様子まで詳しく書くのは『千利休由緒書』。利休のひ孫の世代の江岑宗左が、紀州徳川家に命じられて、のちの時代に差し出した文書でした。
hashtags: ["#千利休", "#日本史", "#戦国時代"]
ai_images: true
art_dir: out/story/rikyu
out: rikyu_story_s1
header_style: B
cta: 本編は概要欄から
