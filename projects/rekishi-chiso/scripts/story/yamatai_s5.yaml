# 物語完結型ショート 邪馬台国はどこ？ s5（2026-11-07）。本編 scripts/yamatai-story.yaml（11/10 19:00 公開、https://youtu.be/cqLK1qEXpMw）の第1章（陳寿と道のり、1910年の論争）から。11/11 19:30 公開。
# 形式は shogun_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（Gemini）。新しい絵は作らない。
# 切り口：書いた陳寿は卑弥呼の使いのころ幼い子ども／道のりは途中からぼやける／1910年に内藤湖南が南を東と読み、白鳥庫吉が九州に置いた。
#   道のりの国の名は本編どおり並べるだけ（伊都国を取り立てない）。採点には触れない。本編の答え（採点の1位・浮かび上がる場所）は明かさない。
#   tease の答えは第3章（鉄：北部・中部九州の鉄器）。
# 事実カード：yamatai-20・24・18・19・58。言い方は本編のまま。
#   ・陳寿 297年に65歳で没→233年ごろの生まれ、238〜239年はまだ5〜6歳（自分で計算し直した。本編どおり「まだ幼い子ども」）。
#   ・1910→2026 は116年＝「100年を超えて」（本編どおり）。
# 理解テスト4問：
#   ①誰の話か：『魏志倭人伝』を書いた陳寿と、その道のりの記録を読んだ学者
#   ②何が書いてあるか：帯方郡から対馬国・一支国・末盧国…と続き、その先は「南へ水行20日」「水行10日、陸行1月」とぼやける
#   ③何が起きたか：1910年、京都の内藤湖南は南を東と読み替えて奈良、東京の白鳥庫吉は九州に置いた
#   ④どうなっているか：論争は100年を超えて続き、道のりの数字は読み方しだいで九州にも奈良にも届く
title: 邪馬台国｜道のりは、なぜ決まらないのか
yt_title: 邪馬台国への道のりはなぜ決まらないのか　『魏志倭人伝』の「南へ水行20日」と、1910年に始まった論争
description: |-
  『魏志倭人伝』の邪馬台国への道のりは、なぜ決まらないのでしょうか。
  手がかりを書いたのは、3世紀の中国の歴史家、陳寿。『晋書』によれば、陳寿が亡くなったのは297年、65歳で、卑弥呼の使いが魏に着いたころは、まだ幼い子どもでした。魏志の道のりは、帯方郡から海を渡り、対馬国、一支国、末盧国、伊都国、奴国、不弥国と続きます。ところが、その先でぼやけます。南へ水行20日で投馬国、さらに南へ水行10日、陸行1月で女王の都。1910年、京都の内藤湖南は、海の上の方角は誤りやすいとして、この南を東と読み替えました。東へ進めば、女王の都は奈良になります。同じ1910年、東京の白鳥庫吉は九州に置く論を出し、京都と東京の学者の論争は100年を超えて続いています。
  では、弥生時代の鉄器が、とびぬけて多く出るのは、どこか。本編は概要欄のリンクからどうぞ。
