- {type: quote, from: 31, to: 31, label: 史料, text: 老臣遠藤某…斬主人之首／出寄手之中, source: 『元寛日記』（『大日本史料』第12編之25 所収）}
- {type: quote, from: 40, to: 40, label: 史料, text: 姫君様御知行十万石御付被下候, source: 『元和年録』（『大日本史料』第12編之25 所収）}
- {type: quote, from: 60, to: 60, label: 史料, text: 竹橋　寛永三丙寅之頃より／寛文六二月六日迄　天樹院様, source: 幕府の御殿の書付（蜂屋茂橘『椎の実筆』所収）}
- {type: quote, from: 84, to: 84, label: 史料, text: 明成を滅却さするか／此の寺を頽顛せしむるか, source: 熊沢淡庵『武将感状記』（1716年）}
- {type: quote, from: 110, to: 110, label: 史料, text: 当春迄追日御快気／俄御取詰　今暁寅刻逝去　御年七十, source: 幕府の記録『年録』寛文6年2月6日の条}
