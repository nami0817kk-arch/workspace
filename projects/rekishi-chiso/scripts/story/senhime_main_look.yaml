# 物語型の本編の見た目と絵の割り当て：千姫は、大坂城から救い出されたあと、50年をどう生きたのか（scripts/senhime-story.yaml）。chiso/storymain.py が読む。
# 11-21 作成（11/27 19:00 公開予定）。atsuhime_main_look.yaml を写した。絵は Gemini（Chrome）で作った（教科書の歴史画のような写実・明るめ）。
# Gemini の上限（u/0 は上限、u/1 は未ログイン）で、S は新しく作った12枚、R は同じ作りの過去回の AI 絵（atsuhime・tsukiyama・uesugi）を写して使った。
# 実在の古い絵（パブリックドメイン）は額（frame:）と部分（part:）で：千姫姿絵（弘経寺蔵）・徳川家康像・徳川秀忠像・豊臣秀頼像・大坂夏の陣図屏風。
