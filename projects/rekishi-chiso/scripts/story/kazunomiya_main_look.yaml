# 物語型の本編（横 16:9）の見た目と絵の割り当て：和宮（scripts/kazunomiya-story.yaml）。chiso/storymain.py が読む。
# 10-28 作成（10/29 12:00 公開）。台本は最後の通し確認のあと固めた（この look は行の番号で絵を当てるので、台本を変えない）。決まりは docs/story-main.md・スキル rekishi-story-screen。見本は hidetsugu・rikyu の look。
# 絵の方針：AI 絵は 15 枚（W01〜W15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵（和宮は横顔か後ろ姿・正面の寄りは作らない）。実在の絵（パブリックドメイン。出典は台本の background / portrait の credit・caption）は額（frame:）と浮世絵の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/kazunomiya_ai_images.md
# 届く前は art_dir の仮の絵（W01.jpg〜、番号と場面だけ書いた灰色の板。10-28 に PIL で 1376×768 で作った）で代える。届いたら main_art_dir に W01.jpg〜を置くだけ。
#   crops・focus・fx の位置は仮の値。届いた絵を見て合わせ直す。
# 墓・棺・遺骨の中は映さない（発掘は W01 の遠景、ガラス板は W02 の布の上の板と手だけ）。左手首・遺骨の行は手や骨の絵を当てない。
#   「和宮とされる肖像」（kazu_portrait_small）は本人か疑う説があるので、替え玉の行（115〜116）には当てない。
script: scripts/kazunomiya-story.yaml
out: kazunomiya_story_main
art_dir: out/story/kazunomiya/ph          # 仮の絵（placeholder）
main_art_dir: out/story/kazunomiya/main   # Gemini の 16:9 の絵（W01.jpg〜W15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

