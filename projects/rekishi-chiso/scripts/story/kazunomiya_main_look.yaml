     items: [[和宮, 孝明天皇の妹・家茂の妻, paintings/kazu_portrait_toyobunka.jpg, [0.5, 0.30]],
             [徳川家茂, 14代将軍・和宮の夫, paintings/kazu_iemochi_kano.jpg, [0.5, 0.30]],
             [有栖川宮熾仁親王, 和宮のかつての婚約者, paintings/kazu_arisugawa_taruhito.jpg, [0.5, 0.30]]]}
  - {type: quote, from: 11, to: 11, label: 史料, text: 官軍差下され御取つふし／覚悟いたし,
     source: 和宮の書状（慶応4年正月20日・橋本少将あて、海の見える杜美術館蔵）}
  - {type: quote, from: 25, to: 25, label: 史料, text: 最初宮は固辞して従ひ給はず／再三の上諭により,
     source: 『歴史資料珍奇集』第3輯（1922年）}
  - {type: quote, from: 29, to: 29, label: 史料, text: 和宮御方御願御ケ條書,
     source: 『中山忠能履歴資料』第二（1933年）}
  - {type: versus3, from: 43, to: 43, every: 1.2,
     items: [[大垣市の広報, "総勢7,800余名"], [ぶぎんレポート, 人足を入れて3万余], [板橋区立郷土資料館, 総勢3万人]]}
  - {type: quote, from: 74, to: 74, label: 伝わる歌, text: 空蝉の唐織衣何かせん／綾も錦も君ありてこそ,
     source: 長谷川時雨『日本女性美史』（後の時代の読み物）}
  - {type: quote, from: 83, to: 83, label: 史料, text: 当家朝敵の汚名を残／実ニ残念,
     source: 和宮の書状（慶応4年正月20日・橋本少将あて）}
  - {type: quote, from: 84, to: 84, label: 史料, text: 官軍差下され御取つふし／覚悟いたし,
     source: 和宮の書状（慶応4年正月20日・橋本少将あて）}
  - {type: quote, from: 88, to: 88, label: 史料, text: 又た御自発にて／頻りに雪寃、哀願の運動,
     source: 徳富猪一郎『近世日本国民史』第68冊（1946年）p.226}
  - {type: quote, from: 101, to: 101, label: 史料, text: 途中休暇ノ事ヲ聞ク／一昨日静寛院宮薨去ニ付,
     source: 本山彦一の日記（明治10年9月4日・『松陰本山彦一翁』1937年）}
  - {type: quote, from: 103, to: 103, label: 史料, text: 御葬穴等工業場無之ニ付／赤羽根通リ脇公園地囲込,
     source: 『東京市史稿』遊園篇第4（1932年）}

