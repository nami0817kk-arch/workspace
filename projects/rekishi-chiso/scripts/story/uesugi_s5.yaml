lines:
  # fact: uesugi-50
- 語り: "上杉家の家老、直江兼続が集めた本は、850冊。その中には、いま国宝の本もある。その本は、どこから来たのか。"
  shot: U25_1
  tone: 強調
  pause: 0.12
  # fact: uesugi-22, uesugi-48
- 語り: "1607年。兼続は、京都の要法寺に頼んで、『文選』という中国の詩文集を、活字で刷らせた。"
  shot: U24_2
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-50
- 語り: "兼続の本には、中国の宋の時代に刷られた、史記、漢書、後漢書もあった。いまは、国宝だ。"
  shot: U25_4
  tone: 強調
  pause: 0.12
  # fact: uesugi-89
- 語り: "明治41年、米沢の郷土史家、伊佐早謙は、ある話を紹介した。兼続は、朝鮮に攻め込んだとき、現地で本を集めさせた。"
  shot: U07_5
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-70
- 語り: "けれど、山形大学の解説では、昭和32年の調べで、もとは京都の大きな禅寺の僧から譲られた本だと分かり、朝鮮の話は、伝説とされた。"
  shot: U25_6
  tone: 強調
  pause: 0.12
  # fact: uesugi-23
- 語り: "1618年。兼続は、米沢に禅林寺を建て、本を置いて、家臣の子どもたちが学ぶ場所にした。"
  shot: U26_7
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-49
- 語り: "禅林寺は、のちの法泉寺。禅林寺から291年後の1909年、その境内に、米沢図書館が開いた。"
  shot: U25_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第6章（uesugi-72）
- 語り: "では、いま知られている兼続の肖像は、もとは、どこに描かれていたのか。"
  shot: NK_9
  tone: 疑問
  pause: 0.15
