# 理解テスト：①直江兼続の話 ②1607年に京都で文選を刷らせ、850冊の本を集めた ③朝鮮で集めた話は伝説で、禅寺の僧から譲られた本だった ④1618年に禅林寺を建てて学ぶ場に。その地に1909年、米沢図書館
title: "直江兼続｜家老が集めた850冊"
yt_title: "直江兼続が集めた850冊には、いま国宝の本もある　「朝鮮で集めた」という話は伝説だった"
description: |-
  上杉家の家老・直江兼続が集めた本は850冊。その中には、いま国宝になっている、中国の宋の時代に刷られた『史記』『漢書』『後漢書』もありました。1607年には京都の要法寺に頼んで『文選』を活字で刷らせています（直江版。市立米沢図書館に31冊）。
  明治41年、米沢の郷土史家・伊佐早謙は、兼続が朝鮮で本を集めさせた、という話を紹介しました。けれど山形大学の解説によれば、昭和32年の調べで、もとは京都の大きな禅寺の僧から譲られた本だと分かり、朝鮮の話は伝説とされました。1618年、兼続は米沢に禅林寺を建てて学ぶ場にし、その境内に1909年、米沢図書館が開きます。
  本編では、30万石になった上杉家と直江兼続のその後をたどっています。本編は概要欄のリンクからどうぞ。
