# 形式は tsurumatsu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/hojo-if/main/。前の回の Gemini の絵を写したもの＋Q01）と、本編で使った実在の肖像・絵図だけ。新しい絵は作らない。
#   H21 は姫路城に見えるので使わない。
# 切り口：小田原攻めの前の年、氏政は上洛の費用を家臣から集め、締め切りは10月末（黒田基樹 2016）。上洛の約束（6月5日付の氏直の手紙）と引き換えに沼田が渡された。
#   その10月末ごろに名胡桃城の事件、1か月たたずに秀吉の「氏直の首をはねる」。本編の答え（『足柄下郡史』の疑い・氏直の弁明）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/北条氏政_facts_20261106.yaml）：hojo-22・81・80・25・27・74・75・102。言い方は本編のまま。
# 計算（自分で計算し直した）：天正17年＝1589年。10月末→11月24日で1か月たたない。翌年＝1590年7月に開城。
# 理解テスト4問：
#   ①誰の話か：北条氏政（と息子で当主の氏直）
#   ②いつ・どこで何が：1589年、氏政は京へ上る費用を家臣から集め、締め切りは10月末。12月上旬に小田原を発つ約束だった
#   ③何が起きたか：その10月の末ごろ、北条の家臣が名胡桃城を奪い、秀吉は11月24日に「氏直の首をはねる」と書いた
#   ④どうなったか：翌年7月に小田原城は開き、氏政は腹を切った。名胡桃城を奪ったのは当主の考えだったのか、の問いで閉じる（答えは本編）
title: 北条氏政｜京へ上る費用の締め切り
yt_title: 北条氏政は小田原攻めの前の年、京へ上る費用を家臣から集めていた　締め切りは10月末、その月に名胡桃城の事件
description: |-
  小田原攻めの前の年、1589年。北条氏政は、京へ上るための費用を、家臣たちから集めていました。研究者の黒田基樹さんによると、締め切りは10月の末です。
  息子で当主の氏直は、6月5日付の手紙に、父の氏政が上洛する、12月上旬にはここを発つ、と書いています。この約束と引き換えに、豊臣秀吉は、北条と真田が争っていた上野の沼田の城を、北条に渡していました。
  ところが、その10月の末ごろ、北条の沼田城代の猪俣邦憲が、真田の名胡桃城を奪います。1か月たたないうちの11月24日、秀吉は氏直に宛てて、来年必ず兵を出し、氏直の首をはねる、と書きました。翌年の7月、小田原城は開き、氏政は腹を切りました。
  名胡桃城を奪ったのは、本当に北条の当主の考えだったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#北条氏政', '#小田原攻め', '#日本史']
