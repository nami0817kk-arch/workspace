# 理解テスト4問：①福島正則 ②1619年10月に広島から信濃の高井野（今の長野県高山村）へ ③屋敷跡は東西約104.5m・南北約72.7m、土塁と空堀。1620年に嫡男が死に、越後の2万5千石を返上 ④残ったのは信濃の2万石（広島の約4%）。次は1624年の夏（本編7章）
title: "福島正則｜最後の屋敷は、どれほどの広さか"
yt_title: "福島正則が最後に暮らした信濃・高井野の屋敷の広さ　広島49万8千石の大名は、2万石になった"
description: |-
  1619年の10月初め、福島正則は広島を出て、信濃の高井野、いまの長野県高山村へ向かいました。屋敷の跡は、東西およそ104.5メートル、南北およそ72.7メートル、広さはおよそ76アール。かつては四方に高い土塁があり、外側には空堀がめぐらされていました。長野県立長野図書館のレファレンス回答にある数字です。
  1620年に嫡男の忠勝が亡くなると、正則は越後の2万5千石を返上しました。手元に残ったのは、信濃の2万石。広島の頃の、およそ4%です。
  1624年の夏、その屋敷で、何が起きたのか。本編は概要欄のリンクからどうぞ。
