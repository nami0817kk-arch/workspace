# 形式は nakasendo_s1〜s5・majogari_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 江戸の改易_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/kaieki/main/ の K）の切り出しだけ。新しい絵は作らない。
# 切り口：生駒騒動で讃岐を失った生駒家が、1万石→8000石の旗本→1868年に1万5000石で矢島藩を立て直すまで（本編 第5章、kaieki-66・68）。
# hook＝讃岐を失った生駒家はその後どうなったか（答えはこのショートの中）。tease＝改易された家のうち跡形もなく絶えたのはどれほどか（答えは本編 序章・まとめ：202件のうち73件。kaieki-14）。
# 数え直し：寛永17年＝1640、万治2年＝1659、明治元年＝1868。1万石−2000石＝8000石。1868−1640＝228年。
#   注意：1640〜1659 の矢島1万石の間は大名（矢島藩）。「228年」は讃岐を失ってからの年数として言い、「228年間大名でなかった」とは言わない。讃岐の石高は「17万石あまり」だけ（17万6000・17万8000 は言わない）。
# 理解テスト：①讃岐高松の大名、生駒家の話 ②1640年、家臣の争い（生駒騒動）で讃岐の全領地を取り上げられ、出羽の矢島1万石へ ③1659年に弟へ2000石を分けて8000石の旗本（交代寄合）に ④1868年、新政府に力を貸した功で1万5000石の矢島藩がふたたび立った。讃岐を失って228年後
title: "改易｜生駒家の228年"
yt_title: "家臣の争いで讃岐17万石を失った生駒家　8000石の旗本になり、228年後にふたたび藩を立てるまで"
description: |-
  讃岐の高松、17万石あまりの大名、生駒高俊の家で、家臣どうしの争いが大きくなりました。生駒騒動です。
  寛永17年、1640年、幕府は生駒家から讃岐の全部の領地を取り上げ、争った家老たちは切腹や死罪になりました。高俊には暮らしのための1万石が与えられ、出羽の矢島へ移されます。
  万治2年、1659年、高俊の子の高清は、弟に2000石を分けて8000石の旗本となり、交代寄合という大名に近い扱いの家格で江戸に住みました。そして明治元年、1868年、新しい政府に力を貸した功で1万5000石となり、矢島藩がふたたび立ちます。讃岐を失ってから、228年後のことでした。
  本編では、江戸幕府に取りつぶされた大名の数と、いちばん多かった理由、そして数が減っていったわけを、研究ごとの数字で積み上げています。本編は概要欄のリンクからどうぞ。
