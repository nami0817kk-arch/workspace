# 物語完結型ショート コロンブス s3（2026-11-06）。本編 scripts/columbus-if-story.yaml（11/9 12:00 公開）の第4章（分岐1 誰が来たのか）から。11/10 13:30 公開。
# 形式は hojo_s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
#   「もしも」の行は「ここからは、もしもの話」と言ってから、本編の見立て（ポルトガルの船は1500年ごろにはやはりアメリカの陸を見ていたかもしれない／
#   遅れは8年ほどで済んだかもしれない）だけ。事実の行と混ぜない。本編どおり「かもしれない」で言い切らない。
# 絵は本編の AI 絵（out/story/columbus-if/main/）だけ。
# 切り口：西を目指したのはコロンブス1人ではない。1021年のヴァイキング（Nature 2021）、1497年のカボット（35日で陸）、
#   1500年4月のカブラル（インドへ向かう途中で陸＝今のブラジル）。本編の答え（じゃがいもと銀の行方が分かれる所）は言わない。
# 事実カード：columbus-45・71・72・10。言い方は本編のまま。
# 計算：1500−1492＝8年。1497−1492＝5年（台本では言わない）。
# 理解テスト4問：
#   ①誰の話か：コロンブスのほかに西を目指した航海者（ヴァイキング・カボット・カブラル）
#   ②いつ・どこで何が：1021年にカナダで木を切った／1497年にカボットが35日で陸を見た／1500年4月にカブラルがインドへ行く途中で今のブラジルを見た
#   ③なぜ大事か：カブラルの道は、コロンブスとは別にポルトガルが開いた、アフリカを回る道だった
#   ④もしもの話：1492年に引き返していても、1500年ごろには陸を見ていたかもしれない。じゃがいもと銀の行方はどこで分かれるか、の問いで閉じる（答えは本編）
title: もしも引き返していたら｜アメリカを見た別の船
yt_title: もしもコロンブスが引き返していたら、アメリカは誰が見つけたのか　1500年、インドへ向かうポルトガルの艦隊が見た陸
description: |-
  コロンブスより前に、海を渡った人々がいました。2021年に科学誌ネイチャーに出た研究は、ヴァイキングがカナダのニューファンドランド島で木を切った年を、西暦1021年と決めています。
  1497年には、イングランド王の特許状を持つジョン・カボットの船が、35日で陸を見ました。
  そして1500年4月。インドのカリカットへ向かうポルトガルの艦隊が、大西洋の西で見知らぬ陸を見ます。指揮していたのはカブラル。今のブラジルです。カブラルはコロンブスの島々を目指したのではなく、アフリカを回ってインドへ行く途中で、陸を見ていました。
  ここからは、もしもの話です。1492年10月10日に船団が東へ戻っていても、ポルトガルの船は1500年ごろには、やはりアメリカの陸を見ていたかもしれません。遅れは8年ほどで済んだかもしれません。
  では、じゃがいもと銀の行方は、どこで分かれるのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#コロンブス', '#大航海時代', '#世界史']
