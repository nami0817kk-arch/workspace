# 物語完結型ショート asahi_s2（2026-10-26）。投稿しない（ユーザーが動画を見てから）。形式は oichi_s10〜s14 を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 本編 scripts/asahi-story.yaml の切り口②：縁組を望んだのは、家康の側？（秀吉の朱印状）
# 事実カード：dev/output/rekishi-chiso/research/旭姫_facts_20261026.yaml
#   asahi-01（前の夫と離縁させられて家康に嫁いだ、とよく語られる。愛知県 Aichi Now「無理やり離縁させられた」）／asahi-03（44歳）／
#   asahi-38（天正14年5月24日付の秀吉朱印状「家康の事、種々縁辺等の儀迄懇望せしめ候」）／asahi-18（黒田基樹：縁組を強く望んだのは家康の側、旭は前夫の失脚で既に離縁）／
#   asahi-37（『武家事紀』：離縁は結婚の4年前、天正10年ごろ）／asahi-10（14日に浜松で婚礼）
# 「無理やり」と「家康が望んだ」のどちらとも決めない（本編と同じく、記録は2つの話を並べたまま）。朱印状は秀吉の側の手紙だと言う。
# 理解テスト4問：
#   ①誰の話か：旭（豊臣秀吉の妹）と徳川家康の縁組
#   ②いつ・どこで何が：天正14年5月、44歳の旭が浜松で家康に嫁いだ。その10日後、秀吉が朱印状を出した
#   ③何が書かれていたか：縁組をしきりに望んだのは家康の側だ、と秀吉が書いた（よく語られるのは「秀吉が無理やり離縁させた」）
#   ④どうなったか：『武家事紀』は離縁を4年前とし、黒田基樹さんは家康の側が望んだと見る。ただ朱印状は秀吉の側の手紙で、記録は2つの話を並べたまま
title: 旭姫｜縁組を望んだのは、家康の側？
yt_title: 旭姫と家康の縁組、しきりに望んだのは家康だった？ 婚礼10日後の秀吉の朱印状
description: |-
  天正14年5月、豊臣秀吉の妹、旭は、44歳で徳川家康に嫁ぎました。秀吉が妹を無理やり離縁させた、とよく語られる縁組です。
  ところが婚礼の10日後、天正14年5月24日付の朱印状に、秀吉は「家康は、縁組のことまで、しきりに望んできた」と書いています。
  江戸時代の『武家事紀』は、旭の離縁を結婚の4年前、天正10年ごろのこととしています。
  ただ、朱印状は秀吉の側が書いた手紙です。無理やり別れさせたのか、別れていた妹の縁組だったのか。記録は、ふたつの話を並べたままです。
hashtags: ["#旭姫", "#徳川家康", "#日本史"]
