lines:
  - 語り: 秀吉の妹、旭と、徳川家康の縁組。秀吉の手紙は、《!家康が望んだ》と書いていた。
    # fact: asahi-38
    shot: K04f
    tone: 強調
  - 語り: 天正14年5月、44歳の旭は、遠江の浜松で、家康に嫁いだ。
    # fact: asahi-03, asahi-10
    shot: A04
    tone: しみじみ
    pause: 0.12
  - 語り: よく語られるのは、兄の秀吉が、妹を、前の夫と無理やり別れさせた、という話だ。
    # fact: asahi-01
    shot: K05f
    tone: しみじみ
    pause: 0.12
  - 語り: ところが、婚礼の10日後、5月24日の日付で、秀吉は朱印状に、こう記した。今の言葉にすると、こうだ。
    # fact: asahi-38
    shot: Hideyoshi
    tone: しみじみ
    pause: 0.12
  - 語り: 「家康は、縁組のことまで、いろいろと、《しきりに望んできた》」。
    # fact: asahi-38（原文「家康の事、種々縁辺等の儀迄懇望せしめ候」）
    shot: K04w
    tone: 強調
    pause: 0.3
    dip: true
  - 語り: 歴史学者の黒田基樹さんは、この朱印状をもとに、縁組を強く望んだのは、家康の側だったと見ている。
    # fact: asahi-18
    shot: A04ie
    tone: しみじみ
    pause: 0.12
  - 語り: さらに、江戸時代の書物、『武家事紀』は、旭の離縁を、結婚の4年前、天正10年ごろのこととする。
    # fact: asahi-37
    shot: A02l
    tone: しみじみ
    pause: 0.12
  - 語り: もしそうなら、旭は、家康との縁組のために、夫と別れたのでは、ない。
    # fact: asahi-37, asahi-18
    shot: A02f
    tone: 重い
    pause: 0.15
  - 語り: もっとも、朱印状は、秀吉の側が書いた手紙だ。記録は、ふたつの話を、《並べたまま》だ。
    # fact: asahi-38, asahi-01
    shot: K05w
    tone: 重い
    pause: 0.15
  - 語り: あなたなら、この縁組を、誰が望んだと思いますか。
    shot: A04q
    tone: 疑問
    pause: 0.15
