# 切り口：1945年6月18日の会議と、九州上陸の損害の見積もり3つ（5万800・20万・50万〜100万の命）。数える範囲が違うので比べられない、と言う。
#   本編の答え（降伏の時期の割れ方・もしもの世界の行方）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/原爆if_facts_20261107.yaml）：genbaku-03・13・20・06・45（ウィロビーの20万は本編どおり星条旗新聞の伝え）。言い方は本編のまま。
# 計算（自分で計算し直した）：ルソンの死傷3万1千人（カードどおり）。見積もりの種類が違う（死傷・命）ので倍率は台本で言わない。
# 理解テスト4問：
#   ①誰の話か：1945年6月18日、九州上陸を決める会議を開いたトルーマン大統領とアメリカの軍首脳
#   ②いつ・どこで何が：6月18日のホワイトハウス。マーシャルは最初の30日の損害はルソンを超えない、キングはルソンと沖縄のあいだ、と述べた
#   ③何が割れたか：損害の見積もり。マッカーサー司令部5万800（最初の30日）・ウィロビー20万（九州だけ）・フーヴァー50万〜100万の命
#   ④どうなったか：1つの数にまとまらなかった。九州の日本の兵は増え続けていた、何人まで、の問いで閉じる（答えは本編の第3章）
title: 九州上陸｜損害の見積もりはなぜ割れたのか
yt_title: 九州上陸の損害の見積もりは、なぜ割れたのか　1945年6月18日の会議と、5万800・20万・50万〜100万
description: |-
  1945年6月18日。アメリカの大統領トルーマンは、陸軍と海軍の首脳を集め、九州への上陸作戦を話し合いました。
  前の日の日記に、トルーマンは、これまでで一番難しい決断だ、と書いていた、と歴史家のマドックスは引いています。参謀総長のマーシャルは、最初の30日の損害は、フィリピンのルソン島で払った代価、約3万1千人を超えないだろう、と述べました。海軍のキングは、ルソンと沖縄のあいだ、と言いました。
  上陸の損害の見積もりは、記録によって割れています。6月の表では、マッカーサーの司令部が、最初の30日の死傷を5万800人と見積もりました。情報部長のウィロビーは、九州だけで20万人の死傷、と星条旗新聞は伝えます。元大統領のフーヴァーは、5月の覚え書きで、50万から100万人のアメリカ人の命、と書きました。数える範囲も中身も違うので、そのまま比べることはできません。
  その間にも、九州の日本の兵は、増え続けていました。何人まで、増えたのか。本編は概要欄のリンクからどうぞ。
