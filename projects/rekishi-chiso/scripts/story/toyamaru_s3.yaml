title: "洞爺丸｜出港から、わずか22分で錨を入れた"
yt_title: "洞爺丸は18時39分に出港し、22分後の19時1分に錨を入れた　走錨、浸水、傾き　裁決の英訳が書く、21時ごろまでの時刻"
description: |-
  洞爺丸は1954年9月26日、18時39分に函館を出港しました。出航を決めてから59分後です。
  18時55分ごろ、防波堤の西口を通過し、船長は、危険だ、錨を入れる、と言ったと、裁決の英訳にあります。19時1分に投錨。出港から、わずか22分でした。
  その後、車両甲板への海水の打ち込み、走錨、浸水と続きます。
  そのころ、陸の上では、船の様子が、どう受け取られていたのか。本編は概要欄のリンクからどうぞ。
  亡くなった方々とご遺族に、敬意を払って作っています。
  https://youtu.be/i6YryMy_fHQ
