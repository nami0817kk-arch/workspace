parts:
  - {type: quote, from: 2, to: 2, label: 史料, text: 暦と時計があれば／300里離れていても／王がいま何をしているか言い当てられる, source: サン=シモン『三人の初代ブルボン王の比較』（1740年着手）}
  - {type: quote, from: 31, to: 31, label: 要点, text: 動かなかったのは／会議の時間だけ, source: ボワリルの注（サン=シモン『回想録』1916年版）}
  - {type: quote, from: 69, to: 69, label: 史料, text: 様々なスープ4皿・雉1羽・ヤマウズラ1羽／ハム・羊の肉・菓子・果物・ゆで卵, source: パラティーヌ侯爵夫人の手紙（1718年12月5日・フランス語訳）}
  - {type: quote, from: 93, to: 93, label: 史料, text: 人びとは見せ物を好む／そうして私たちは彼らの精神と心をつかむ, source: 『王太子への教え』1662年の部分}

