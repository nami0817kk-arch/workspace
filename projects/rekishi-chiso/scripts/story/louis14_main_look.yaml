# 物語型の本編（横 16:9）の見た目と絵の割り当て：ルイ14世の1日（scripts/louis14-story.yaml）。chiso/storymain.py が読む。
# 11-12 作成（11/15 19:00 公開予定）。inou_main_look.yaml を写した。台本には手を入れない。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：V01〜V16・VEND は Gemini で新規に作る（人物は後ろ姿か人物なし）。実在の絵は リゴー《ルイ14世》（1701、額）とパテル《1668年のヴェルサイユ城》（part）。
