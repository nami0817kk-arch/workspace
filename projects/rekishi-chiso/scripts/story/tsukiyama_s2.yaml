  # fact: tsukiyama-14
- 語り: "その記録は、『当代記』。戦国から江戸の初めの出来事を書いた記録だ。"
  shot: T07_2
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-14
- 語り: "1579年8月5日。家康は、長男の信康を、家から追い出した、と書く。"
  shot: T21_3
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-14
- 語り: "理由は、父、家康の命令に、常にそむき、信長をも軽んじ、家来たちに、ひどい仕打ちをしたから。"
  shot: T10_4
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-14
- 語り: "家康は、その前の月に、重臣の酒井忠次を通して、信長に、内々に伝えていた。"
  shot: T15_5
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-14
- 語り: "信長の返事は、家康の存分次第。家康の、思うとおりにせよ、だった。"
  shot: T12_6
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-11
- 語り: "もう一つの記録、『松平記』も、8月1日に、家康が、信長へ知らせを送った、と書く。"
  shot: T08_7
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-20
- 語り: "戦国時代を研究する黒田基樹は、2023年の本で、罰は家康から信長に願い出たもので、信長は、認めただけ、とみる。"
  shot: T28_8
  tone: 重い
  pause: 0.12
