title: "築山殿と信康｜信長の返事は、家康の思うとおりに"
yt_title: "家康の長男・信康の処罰に、信長の返事は「家康の思うとおりに」　『当代記』が書く、もう一つの信康事件"
description: |-
  1579年、徳川家康の長男・信康の処罰は、信長の命令だったのか。『当代記』は、8月5日に家康が信康を家から追い出した、と書きます。理由は、父の命令に常にそむき、信長をも軽んじ、家来たちにひどい仕打ちをしたから。
  家康はその前の月に、重臣の酒井忠次を通して、信長に内々に伝えていました。信長の返事は「家康存分次第」、家康の思うとおりに。『松平記』も、8月1日に家康が信長へ知らせを送った、と書きます。黒田基樹は2023年の本で、罰は家康から信長に願い出たもの、とみています。
  本編では、その夏の家臣の日記と、4年前に岡崎で起きた謀反まで並べて、家康の妻と息子がなぜ死んだのかをたどっています。本編は概要欄のリンクからどうぞ。
