# 物語完結型ショート 北条 s3（2026-11-06）。本編 scripts/hojo-if-story.yaml（11/8 12:00 公開）の第3章（1589年秋、名胡桃城の事件）から。11/9 13:30 公開。
# 形式は tsurumatsu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/hojo-if/main/）と本編で使った実在の肖像だけ。H21 は姫路城に見えるので使わない。磔の場面は描かない（言葉にもしない）。
# 切り口：名胡桃城が奪われた時期は研究者で割れる（黒田 10月末／中野 11月初め）。11月21日の真田昌幸あて、3日後の11月24日の氏直あての朱印状
#   （「氏直の首をはねる」、写しにも朱印を押して配り「どこへでも見せよ」）。12月7日の氏直の弁明「名胡桃のことは一切知らない」「今は百姓の屋敷にすぎない」。
#   本編の答え（同じ手紙の、氏政の上洛が遅れる訳＝噂と覚悟）は言わない。
# 事実カード：hojo-27・28/79・74/75・76・82・85。言い方は本編のまま。
# 計算（自分で計算し直した）：11月21日の3日後＝11月24日。11月24日→12月7日は13日後（台本では言わない）。
# 理解テスト4問：
#   ①誰の話か：北条家（当主の氏直）と秀吉、名胡桃城
#   ②いつ・どこで何が：1589年の秋、北条の沼田城代の猪俣邦憲が、真田の名胡桃城を奪った
#   ③秀吉は何と書いたか：11月21日に真田へ「成敗しないなら北条が出仕しても赦さない」、11月24日に氏直へ「氏直の首をはねる」
#   ④どうなったか：12月7日、氏直は「名胡桃のことは一切知らない」と弁明した。同じ手紙で父が京へ上れない訳を何と書いたか、の問いで閉じる（答えは本編）
title: 名胡桃城｜奪われた山の上の城
yt_title: 名胡桃城が北条に奪われて秀吉は「氏直の首をはねる」と書いた　北条氏直の返事は「一切知らない」
description: |-
  1589年の秋、北条の沼田城代、猪俣邦憲が、真田の名胡桃城を奪いました。いつ奪ったのかは割れます。黒田基樹さんは10月の末とみられる、とし、中野等さんは11月の初め、とします。
  11月21日、豊臣秀吉は真田昌幸に、名胡桃に攻めかかった者を成敗しないなら、たとえ北条が出仕しても赦しはしない、と書き送りました。3日後の11月24日、北条氏直に宛てた朱印状の結びは、来年必ず旗を立てて出発し、氏直の首をはねる、でした。この朱印状は、写しにも朱印を押して家康たちにも配られ、どこへでも見せよ、と添えられていました。
  12月7日、氏直は弁明を送ります。名胡桃のことは一切知らない。名胡桃は、今は百姓の屋敷にすぎない。
  同じ手紙で、氏直は、父の氏政が京へ上れない訳を、何と書いたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#名胡桃城', '#北条氏直', '#日本史']
