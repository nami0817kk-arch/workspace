  - {at: 天正18年, text: "天正18年　信濃・松本", point: 0}
  - {at: 文禄元年, text: "文禄元年　京都・七条河原", point: 1}
  - {at: そこで松本市は, text: "令和4〜6年度　年輪の調べ", point: 2}
  - {at: 2025年の報告, text: "1596〜97年ごろ　松本城", point: 2}
