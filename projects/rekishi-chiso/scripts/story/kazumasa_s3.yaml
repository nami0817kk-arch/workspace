# 物語完結型ショート 石川数正 s3（2026-10-26）。本編 scripts/kazumasa-story.yaml の第6章（松本城の天守の年代）から。投稿しない。
# 形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazumasa/main/K*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml）：kazumasa-01・05・17・18・31
#   ・天守を「数正と康長の父子が築いた」は松本市の従来の説明（kazumasa-05）。天正18年に松本へ入ったのも同じカード（本編と同じ）。
#   ・年輪年代調査（令和4〜6年度、報告 2025）：1・3・4階の柱は1596年に伐られた木、天守は1596〜97年ごろ短期間で建った（kazumasa-17。松本市の報告書）。
#   ・文献だけでは決められず5つの説（kazumasa-18）。数正の没年・七条河原の葬礼は出どころ1つ（kazumasa-31）→「と伝わる」。
#     没年は文化遺産オンラインの解説が文禄2年とする（本編で触れた食い違い）。このショートでは「文禄元年」とし、年の差（4年ほど）もそれに合わせた。
#   ・伐採の年は年輪の調べの値なので西暦（1596年）のまま。ほかは和暦。
# 理解テスト4問：
#   ①誰の話か：石川数正（家康のもとを去り、秀吉の家臣として松本に入った）と、子の康長
#   ②いつ・どこで何が：令和4〜6年度、松本市が国宝・松本城の天守の柱の年輪を調べた
#   ③何が分かったか：柱は1596年に伐られた木で、天守は1596〜97年ごろに建った＝数正の葬礼（文禄元年）の4年ほどあと
#   ④どうなったか：今の天守を建てたのは、父の数正ではなく、子の康長だったことになる
title: 石川数正｜松本城の天守は、死後に建った
yt_title: 松本城の天守は、石川数正が亡くなったあとに建っていた【年輪の調べ】
description: |-
  国宝・松本城の天守は、石川数正と子の康長の父子が築いた、と説明されてきました。
  徳川家康のもとを去り、羽柴秀吉の家臣になった数正は、天正18年に信濃の松本に入り、文禄元年に亡くなりました。
  文献だけでは天守の建った年が決められず、5つもの説が並んでいました。そこで松本市は、令和4年度から6年度にかけて、天守の柱の年輪を調べました。
  1階・3階・4階の柱は、1596年に伐られた木でした。天守は1596年から97年ごろ、数正の葬礼の4年ほどあとに建ったことになります。建てたのは、子の康長でした。
