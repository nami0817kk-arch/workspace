lines:
  # fact: musashi-02
  - 語り: 宮本武蔵が自分で書いた『五輪書』に、巌流島は、《!一行も》出てこない。
    shot: M06
    tone: 強調
    pause: 0.12
  # fact: musashi-39
  - 語り: 武蔵は、1643年、10月10日、熊本の霊巌洞にこもって、『五輪書』を、書き始めた。
    shot: M11
    tone: しみじみ
    pause: 0.12
  # fact: musashi-41
  - 語り: 『五輪書』は、60余度の勝負に、全勝したと記す。国立国会図書館などの回答が、そう紹介している。
    shot: M12
    tone: しみじみ
    pause: 0.12
  # fact: musashi-02
  - 語り: その60余度の中に、巌流島の名はない。決闘に触れた箇所はない、と山口県観光連盟は書いている。
    shot: M01
    tone: 強調
    pause: 0.12
  # fact: musashi-40
  - 語り: 亡くなったのは、熊本。正保2年、1645年の5月だ。『五輪書』は、その1週間前に、完成した、という。
    shot: Portrait
    tone: 重い
    pause: 0.12
  # fact: musashi-41
  - 語り: 『五輪書』は、若い藩主や家老のために書かれた、兵法の書だと紹介されている。決闘の記録帳ではない。
    shot: M13
    tone: しみじみ
    pause: 0.12
  - 語り: なぜ巌流島を書かなかったのか。それを語った史料は、私たちの調べでは、見つからなかった。
    shot: M01r
    tone: 重い
    pause: 0.3
    dip: true
  - 語り: あなたなら、自分の本に、いちばん有名な勝負を、書きますか。
    shot: M14
    tone: 疑問
    pause: 0.15
