# 物語完結型ショート 宮本武蔵 s1（2026-10-29）。本編 scripts/musashi-story.yaml の第7章（『五輪書』）から。
# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/musashi/main/M*.jpg。Gemini のみ。人物は描かない）と実在の自画像とされる絵（島田美術館蔵）。
# 事実カード（dev/output/rekishi-chiso/research/宮本武蔵_facts_20261029.yaml）：musashi-02・39・40・41
#   ・巌流島に触れた箇所が無いのは山口県観光連盟・レファレンス協同データベース（musashi-02）。60余度の全勝は国立国会図書館などの回答（musashi-41）。
#   ・1週間前に完成は「という」で言う（musashi-40）。なぜ書かなかったかは史料で確かめられていない → 言い切らない（問いで閉じる）。
# 理解テスト4問：
#   ①誰の話か：宮本武蔵と、武蔵が書いた『五輪書』
#   ②いつ・どこで何が：1643年10月10日、熊本の霊巌洞にこもって書き始め、1645年5月に亡くなる1週間前に完成したという
#   ③『五輪書』は何を書き、何を書かなかったか：60余度の勝負に全勝したと書き、巌流島の決闘には触れた箇所がない。若い藩主や家老のための兵法の書
#   ④どうなったか：なぜ書かなかったかを語った史料は、調べた範囲では見つからなかった
title: 宮本武蔵｜『五輪書』に、巌流島は一行も出てこない
yt_title: 宮本武蔵の『五輪書』に巌流島は一行も出てこない　60余度の勝負に全勝と書いた本
description: |-
  巌流島の決闘に勝った宮本武蔵。その武蔵が自分で書いた『五輪書』に、巌流島は出てきません。
  武蔵は、1643年10月10日、熊本の霊巌洞にこもって『五輪書』を書き始めます。60余度の勝負に全勝したと記しますが、決闘に触れた箇所はない、と山口県観光連盟は書いています。亡くなったのは1645年5月。『五輪書』は、その1週間前に完成したといいます。
  若い藩主や家老のために書かれた兵法の書に、なぜ巌流島は書かれなかったのか。それを語った史料は、調べた範囲では見つかりませんでした。
