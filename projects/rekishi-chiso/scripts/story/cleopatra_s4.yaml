# 理解テスト4問：①クレオパトラ（の墓探し）②2022年11月、アレクサンドリア西のタポシリス・マグナで長さ1305mのトンネルの発表 ③省はサモス島のトンネルに似ていると説明。用途も墓に通じるかも不明 ④2025年11月の報道でも墓室・碑文は出ていない（本編へ）

title: "クレオパトラ｜1305mのトンネルに墓はあったか"
yt_title: "クレオパトラの墓を探して、長さ1305mのトンネルが見つかった　けれど、墓は出ていない"
description: |-
  クレオパトラの墓を探して掘ると、長さ1305メートルのトンネルが出ました。場所は、アレクサンドリアの西、およそ50キロの、タポシリス・マグナ（意味は「オシリスの大きな墓」）。ドミニカ共和国の考古学者キャスリーン・マルティネスが、2005年の10月から掘っています。
  2022年の11月、エジプトの考古最高評議会は、神殿の下に、岩を掘った長いトンネルを見つけた、と発表しました。高さは約2メートル、地下約13メートル。省は、ギリシャのサモス島の、長さ1036メートルのエウパリノスのトンネルに、設計がよく似ている、と説明しました。1305メートルは、その約1.26倍です。
  ただし、このトンネルが何のために掘られたのか、墓に通じているのかは、2022年の報道は、どちらも分かっていない、と書いています。2025年11月の報道でも、墓の部屋も、クレオパトラの名の碑文も、見つかっていません。数字は報道・発表によって言い方が違います。
  掘っても墓が出ないのは、なぜなのか。本編は概要欄のリンクからどうぞ。
