# 物語完結型ショート 八丈島の流人 s5（2026-11-26）。本編 scripts/rujin-story.yaml（11/30 12:00 公開予定、https://youtu.be/ZKKeywNwBf0）から。12/1 18:30 に予約。
# 形式は choujou_s1〜s5・ashigaru_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 八丈島の流人の暮らし_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/rujin/main/ の R）の切り出しだけ。新しい絵は作らない。
# 切り口：島抜けと佐原の喜三郎（本編 第7章、rujin-14・42・43・44・45・46）。
# hook＝八丈島から逃げ切った流人はいたか（答えはこのショートの中：佐原の喜三郎。漁船で常陸の鹿島へ）。
# tease＝逃げずに赦免を待った流人は、島から江戸へ帰るのに何日かかったか（答えは本編 第8章：菅野八郎は9月10日→13日の3日、rujin-11）。
# 島を出た日は本編と同じく「天保9年の7月」まで（日付の出どころ rujin-44 は雑誌の記事なので言わない）。旧暦7月は秋だが季節は言わない。
# 「三宅島に残る流人の帳面」は事実カード rujin-42 の出どころ（公文書館「流人帳を読む」）に島の名が無いので、「流人の帳面」とだけ言う。
# 理解テスト：①八丈島からの島抜けと喜三郎の話 ②1836年に流され、1838年7月に八丈島から鹿島へ ③刑に期限がなく、捕まれば死罪でも漁船を盗んで島を出た ④江戸でふたたび捕まり、牢で記録を書き、死罪にならず追放になった
title: "八丈島の流人｜島抜けした博徒"
yt_title: "捕まれば死罪の島抜け　八丈島から漁船で逃げた佐原の博徒・喜三郎は、そのあとどうなったのか"
description: |-
  江戸時代の島流しの刑には期限がありません。島を出られるのは、罪を許される赦免か、逃げ出す島抜けだけでした。島抜けは、捕まれば死罪です。流人の帳面には、罪の下に赤い字で「嶋抜」と書き込まれた例があります。
  下総の佐原の博徒、喜三郎は、1836年、天保7年の関東のばくち打ちの一斉の取り締まりで捕まり、八丈島へ流されました。1838年、天保9年の7月、喜三郎たちは漁船を盗んで島を出て、常陸の鹿島の浜に着いたと伝わります。けれど喜三郎は江戸でふたたび捕まり、牢の中で島抜けの記録『朝日逆島記』を書き残しました。死罪にはならず、のちに江戸十里四方追放となっています。その話は落語や小説にもなりましたが、筋は記録どおりとは限りません。
  本編では、流人の送られ方・住まい・食べ物・仕事・水汲み女・赦免まで、島に残った帳面と流人の記録でたどっています。本編は概要欄のリンクからどうぞ。
