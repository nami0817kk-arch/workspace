# 切り口：戦いの終わった時刻の食い違い（本編3・4章）。渡辺7時／山縣8時／別2日記8時30分／東伏見9時ごろ／小沢9時30分。最短7時と最長9時30分の差＝2時間30分（自分で計算）。saigo-05, saigo-06。
# 理解テスト4問：①城山の戦い、1877年9月24日 ②号砲は午前4時（砲兵報告・山縣電）だが、別働第2旅団日記は午前3時 ③終わった時刻は7時から9時30分まで記録ごとに違い2時間30分の開き ④西郷が命を落としたのはこの間のいつか、記録からは言えない（本編へ）
title: "西郷隆盛｜城山の戦いは、何時に終わったか"
yt_title: "城山の戦いは何時に終わったのか　午前7時から9時30分まで、2時間半も違う官軍の記録"
description: |-
  1877年9月24日、城山の戦いが終わった時刻は、記録によって違います。渡辺中佐の電報は午前7時、山縣参軍の電報は午前8時、別働第2旅団の日記は8時30分、東伏見少将は9時ごろ、小沢大佐の電報は9時30分です。いちばん早い記録と遅い記録で、2時間30分の開きがあります。
  始まった時刻も一つではありません。砲兵の報告と山縣の電報は午前4時の号砲。別働第2旅団の日記は午前3時に3発の砲を合図に一斉に攻撃した、と書きます。
  終わった、が何を指すのか（塁が落ちた時か、銃声が止んだ時か、平定した時か）も、記録だけでははっきりしません。西郷隆盛が命を落とした時刻は、ここでは言えません。電報・日記は、アジア歴史資料センターの内容欄の翻刻を読んだもので、原画像までは確かめていません。翻刻には誤字や欠けがあります。
  では、西郷は、この間のいつ、命を落としたのか。本編は概要欄のリンクからどうぞ。
