# 物語型の本編の見た目と絵の割り当て：上杉景勝と直江兼続のその後（scripts/uesugi-sonogo-story.yaml）。chiso/storymain.py が読む。
# 11-18 作成（11/23 19:00 公開予定）。atsuhime_main_look.yaml を写した。絵は Gemini（Chrome）で作った写実の油彩の歴史画（暗すぎない光）。
# 時代の考証：1601〜1620年代の米沢城は天守の無い平城（土塁と堀、板塀、木の櫓）。白壁の高い天守は描かせない。町は茅葺・板葺の低い家。
# 実在の絵（パブリックドメイン）は額（frame:）で：上杉景勝像・直江兼続像・徳川家康像・大坂城仕寄之図・前田慶次の浮世絵。
