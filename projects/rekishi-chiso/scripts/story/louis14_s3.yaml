lines:
  # fact: l14-hd-06
- 語り: "1710年8月9日、土曜。ルイ14世は、体調が悪かった。その1日を、王の医師ファゴンが、日誌に細かく書いている。"
  shot: Drug
  tone: 強調
  pause: 0.12
  # fact: l14-hd-06
- 語り: "ミサの前に、用便。ミサ、会議。会議から出ると、大量の排便があり、そのまま食卓へ。"
  shot: Books
  tone: 重い
  pause: 0.12
  # fact: l14-hd-06
- 語り: "汗が止まらず、食欲がない。ポタージュは食べずに、卵2個と桃だけ。"
  shot: Meal
  tone: 重い
  pause: 0.12
  # fact: l14-hd-06
- 語り: "食卓を離れると吐き気がして、汗を拭き、下着を替えて、軍の大臣と執務。"
  shot: DrugR
  tone: しみじみ
  pause: 0.12
  # fact: l14-hd-06
- 語り: "そのあと、マントノン夫人の部屋へ行き、20時と22時に、また用便。それから、就寝。"
  shot: Bed
  tone: しみじみ
  pause: 0.12
  # fact: l14-hd-05
- 語り: "この日誌は、1647年から1711年まで、ヴァロ、ダカン、ファゴンと、医師が代わりながら書き継いだ。1862年に、ル・ロワが、1冊の本にしている。"
  shot: BooksL
  tone: しみじみ
  pause: 0.12
  # fact: l14-hd-10
- 語り: "ところが、王は生涯で2,000回、浣腸された、という数字は、この日誌のどこにも出てこない。日誌は年ごとの所見で、生涯の総数は、数えられないのだ。"
  shot: Drug
  tone: 重い
  pause: 0.12
  # 問い（本編へ）
- 語り: "では、日誌には、ほかに、どんな日が残っているのか。"
  shot: Books
  tone: 疑問
  pause: 0.15
