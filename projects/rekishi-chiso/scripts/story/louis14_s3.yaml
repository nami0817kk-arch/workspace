title: "ルイ14世｜体調の悪い日の記録"
yt_title: "ルイ14世の1710年8月9日　医師ファゴンが書いた、体調の悪い日の1日"
description: |-
  王の医師たちは、1647年から1711年まで、ヴァロ、ダカン、ファゴンと代わりながら、王の体の様子を日誌に書き続けました。1862年に、ル・ロワがこれを1冊の本にしています。
  その中の、1710年8月9日、土曜。ファゴンは、体調の悪かったこの日の王を細かく記しています。ミサの前に用便。ミサ、会議。会議を出ると大量の排便があり、そのまま食卓へ。汗が止まらず食欲がなく、ポタージュは食べずに、卵2個と桃だけ。食卓を離れると吐き気がして、汗を拭き、下着を替えて、軍の大臣と執務。そのあと、マントノン夫人の部屋へ行き、20時と22時にまた用便。それから就寝しました。
  「王は生涯で2,000回、浣腸された」という数字は、この日誌のどこにも出てきません。日誌には、ほかにどんな日が残っているのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/FqHUnnLL6JM
