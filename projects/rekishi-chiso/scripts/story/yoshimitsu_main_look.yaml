# 11-13 作成（11/16 12:00 公開予定）。saigo_main_look.yaml を写した。台本には手を入れない（承認のあと）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵（S01〜S16・SEND）は全部 Gemini（Chrome、無料版）で新しく作った（11/15 のような使い回しはしない）。義満の顔は想像上で実在の肖像に似せない（多くは後ろ姿・遠景）。実在の古画の額は使わない。
