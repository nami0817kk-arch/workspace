parts:
  - {type: quote, from: 80, to: 80, label: 史料, text: "先急被申出尊号事／可有沙汰", source: "『荒暦』応永13年12月26日（小川剛生論文の引用）"}
  - {type: quote, from: 39, to: 39, label: 史料, text: "希代事也／頗過分", source: "『教言卿記』応永15年4月27日（『後鑑』の引用）"}
  - {type: quote, from: 41, to: 41, label: 史料, text: "御病悩漸篤", source: "『後鑑』巻119（5月1日の条）"}
  - {type: quote, from: 66, to: 66, label: 史料, text: "昔ヨリ此例依無之／勘解由小路禅門申留云々", source: "『東寺執行日記』（小川剛生論文の引用）"}
  - {type: quote, from: 97, to: 97, label: 史料, text: "日本國世子源義持以父源道義卒／賜謚恭獻", source: "『明実録』永楽6年12月17日"}
  - {type: quote, from: 104, to: 104, label: 史料, text: "其易簀之際、以冊書誓諸神／永絶外國之通問", source: "『善隣国宝記』応永26年（1419年）"}
  - {type: quote, from: 15, to: 15, label: 史料, text: "ひかる源氏のわらはすがたもかくやとおぼえたり", source: "『北山殿行幸記』"}
  - {type: quote, from: 55, to: 55, label: 史料, text: "御あとつぎも申をかるゝむねもなし", source: "『椿葉記』（貞成親王）"}
  - {type: quote, from: 60, to: 60, label: 史料, text: "客星見。天文博士某奏凶兆八箇條", source: "『続史愚抄』応永15年6月21日"}
  - {type: quote, from: 125, to: 125, label: 要点, text: "言えること＝尊号は止められた／言えないこと＝病名・死の時刻", source: "この動画のまとめ"}

