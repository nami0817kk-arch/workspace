# 物語完結型ショート 土方歳三 s4（2026-10-29）。本編 scripts/hijikata-story.yaml の第3章（洋装の写真は、いつ誰が撮ったのか）から。
# 形式は masamune_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「……この姿を、残しておくか」は使わない）。
# 絵は実在の写真（洋装の写真2枚・箱館奉行所）と本編の AI 絵（J04 は写真館の後ろ姿）。
# 事実カード（dev/output/rekishi-chiso/research/土方歳三_facts_20261029.yaml）：hijikata-02・24・37・38・73
#   ・撮った人と時期は記録で食い違う。佐藤家の目録（田本研造・明治元年12月）／東京都写真美術館 2013年（田本研造か・明治2年ごろ）／土方愛さん（亡くなる半年前に函館で）。
#   ・函館市中央図書館のプリントは後年の焼き直し（hijikata-38）。柔和な表情は愛さんの話（hijikata-73）。
# 理解テスト4問：
#   ①誰の話か：土方歳三の洋装の写真
#   ②いつ・どこで何が：箱館で、洋服で椅子に腰かけた姿を撮った。田本研造と伝わる
#   ③何が食い違うか：撮った人と時期。目録は田本研造・明治元年12月と言い切り、写真美術館は田本研造か・明治2年ごろ、愛さんは亡くなる半年前に函館で
#   ④どうなったか：言い切る記録と言い切らない記録があり、分からないことが残る。愛さんは柔和な表情がよかったと話す
title: 土方歳三｜洋装の写真を撮ったのは、いつ、誰か
yt_title: 土方歳三の洋装の写真は、いつ誰が撮った？　目録と美術館で食い違う記録
description: |-
  よく知られた、洋服姿の土方歳三の写真。箱館で、椅子に腰かけた姿を撮ったのは、写真師の田本研造だと伝えられます。けれど、いつ撮ったのか、本当に田本なのか、記録の書き方はそろっていません。
  日野の佐藤家の写真の目録は、田本研造が写した、と言い切り、年代を明治元年の12月と記します。東京都写真美術館は、2013年の展示で、撮った人を「田本研造か」とし、時期を「明治2年ごろ」としました。子孫の土方愛さんは、亡くなる半年前に函館で撮られたもの、と話しています。
  愛さんは、最後はつらい状況だったのに、柔和な表情で写っているのがよかった、とも話しています。
hashtags: ["#土方歳三", "#日本史", "#幕末"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
