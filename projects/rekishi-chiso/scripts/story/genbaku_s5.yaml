# 計算（自分で計算し直した）：9月17日→11月1日＝45日＝約6.4週（約6週間前）。8月15日→9月17日＝33日（1か月あまり後）。2473＋1283＝3756。377＋74＝451（言わない）。10月10日→11月1日＝22日前。
# 理解テスト4問：
#   ①誰の話か：上陸予定地だった鹿児島県を襲った2つの台風
#   ②いつ・どこで何が：1945年9月17日に枕崎台風が薩摩半島の枕崎付近に上陸。10月10日に阿久根台風が阿久根市の近くに上陸
#   ③被害は：枕崎台風は死者2473人・行方不明1283人、阿久根台風は死者377人・行方不明74人（気象庁）
#   ④どうなったか：どちらも上陸予定日（11月1日）の前。終戦の翌日、スターリンがトルーマンへの手紙で何を求めたか、の問いで閉じる（答えは本編の第8章）
title: 枕崎台風｜上陸予定地を襲った2つの台風
yt_title: 上陸予定地を、終戦の1か月後に襲った台風　枕崎台風の死者2473人と、10月の阿久根台風
description: |-
  1945年9月17日、枕崎台風が、薩摩半島の枕崎付近に上陸しました。薩摩半島は、アメリカが上陸を予定していた場所です。上陸の予定日は、1945年11月1日。台風は、その約6週間前でした。
  気象庁によれば、枕崎では最低の海面気圧が916.1ヘクトパスカルを観測し、全国で死者2473人、行方不明者1283人。10月10日には、阿久根台風が、同じ鹿児島県の阿久根市の近くに上陸し、死者377人、行方不明者74人を出しました。どちらも、上陸の予定日より前のことです。
  同じ年の8月、日本の北をめぐって、スターリンはトルーマンに手紙を書いていました。何を、求めたのか。本編は概要欄のリンクからどうぞ。
