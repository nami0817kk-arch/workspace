# 物語完結型ショート 北条 s4（2026-11-06）。本編 scripts/hojo-if-story.yaml（11/8 12:00 公開）の第4章の終わり・第5章（小田原開城と北条家のその後）から。11/9 16:30 公開。
# 形式は tsurumatsu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」は最後の問いだけ（事実と混ぜない）。
# 絵は本編の AI 絵（out/story/hojo-if/main/）と本編で使った実在の肖像・絵図だけ。H21 は姫路城に見えるので使わない。
#   切腹・自害の場面は描かない（自害の行は氏政の肖像、首をさらした話・介錯の話は入れない）。
# 切り口：小田原で北条家は終わらなかった。氏直は1万石を与えられたが同じ年に疱瘡で死に、叔父の氏規が継ぐ。河内の6988石、狭山の陣屋（1616年）、
#   約1万1千石・12代・約250年、明治2年（1869年）に廃藩置県を待たずに廃止。本編の答え（もしも上洛していたら関東に残った見込み）は言わない。
#   氏直の死の年齢は記録で割れるので言わない（本編は 30・28・33 を並べている）。
# 事実カード：hojo-102・140・141・108・67・68・69・143。言い方は本編のまま。
# 計算（自分で計算し直した）：9000石＋1000石＝1万石。天正19年＝1591年。文禄3年＝1594年。1616年→1869年＝253年（約250年）。
#   明治2年12月→廃藩置県の明治4年7月で1年半あまり（台本は「廃藩置県を待たずに」だけ）。
# 理解テスト4問：
#   ①誰の話か：小田原開城のあとの北条家（氏直と、叔父の氏規）
#   ②いつ・どこで何が：1590年7月、氏直は城を出て、秀吉は氏直を助け、氏政と氏照に死を命じた
#   ③どうつながったか：氏直は1万石を得たが1591年に死に、氏規が継いで河内に領地を持った
#   ④どうなったか：狭山藩として約250年、1869年まで続いた。もしも上洛していたら関東に残れたのか、の問いで閉じる（答えは本編）
title: 北条家のその後｜河内の小さな藩へ
yt_title: 北条家は小田原で滅びなかった　氏政の弟・氏規が継いだ家は、河内の狭山藩として明治2年まで続いた
description: |-
  1590年の7月5日、北条氏直は小田原城を出て、自分が腹を切る代わりに、父や将兵の命を助けてほしい、と願い出ました。豊臣秀吉は、家康の娘婿の氏直を助け、父の氏政と、その弟の氏照らに死を命じます。
  高野山に送られた氏直は、翌年に赦され、関東と近江で1万石を与えられました。けれど、その年の11月、大坂で疱瘡のために亡くなります。家督は、叔父の北条氏規が継ぎました。氏規は、1594年に河内に6988石を持ちます。1616年、2代の氏信が狭山池の北東に陣屋を築きました。狭山藩は約1万1千石、藩主は12代、約250年続き、明治2年の1869年に、廃藩置県を待たずに廃止されました。
  もしも氏政が京へ上っていたら、北条家は関東に残れたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#北条家', '#狭山藩', '#日本史']
