# 絵の一部だけを動かす（話に合う絵だけ・控えめに。顔・人物にはかけない）。範囲は仮（届いた絵で見て直す）
fx:
  T03: {mist: {region: [0, 0.35, 1, 0.65], alpha: 0.10, speed: 4}}      # 夜明けの海峡の霧
  T10: {lamp: {region: [0.60, 0.20, 0.85, 0.50]}}                        # 行灯
  T06: {lamp: {region: [0.10, 0.45, 0.30, 0.75]}}                        # 座敷の残り灯
  T15: {water: {region: [0, 0.65, 1, 1.0]}}                              # 夕暮れの海面
  T04: {mist: {region: [0, 0.60, 1, 1.0], alpha: 0.08, speed: 3}}       # 雪の夜の山門の靄

# 部品（from〜to の行、0 始まり。出ている間は絵を暗くする）
parts:
  - {type: quote, from: 4, to: 5, label: 史料, text: 故奇兵隊開闢総督高杉晋作則／西海一狂生東行墓／遊撃将軍谷梅之助也,
     source: 高杉の墓誌（高杉晋作Museum「東行墓、墓碑銘」）}
  - {type: quote, from: 48, to: 49, label: 史料, text: まごころを　つくしのきぬは　国のため／たちかえるべき　衣手にせよ,
     source: 野村望東尼が贈った歌（高杉晋作Museum「平尾山荘」）}
  - {type: quote, from: 91, to: 92, label: 要点, text: いつ詠まれたか＝3つの記録で割れる,
     source: 南アルプス市立図書館 2012／山口県観光連盟／梅溪昇『人物叢書 高杉晋作』}

