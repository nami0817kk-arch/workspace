# 物語型の本編（横 16:9）の見た目と絵の割り当て：高杉晋作（scripts/takasugi-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（10/31 19:00 公開）。hijikata_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（T01〜T15。H は秀次、J は土方の回で使った）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵の後ろ姿・手もと・遠景が主役。実在の肖像写真（『近世名士写真 其2』1934〜35年、パブリックドメイン。出典は台本の portrait の caption と下の credits）は額（frame:）。
#   絵図・錦絵・写真は絵図の一部（part:）。
#   この回の決まり：AI 絵に高杉の顔は描かない（後ろ姿か遠景・手もと）。実在の肖像写真・俳優に似せない。顔が分かるのは実在の肖像写真の額だけ。戦の場面・刀を抜く場面・死の場面は描かない。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/takasugi_ai_images.md
# 届く前は art_dir の仮の絵（T01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に T01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「T01（仮）」と場面を書いて作り直す。
script: scripts/takasugi-story.yaml
out: takasugi_story_main
art_dir: out/story/takasugi/ph          # 仮の絵（placeholder）
main_art_dir: out/story/takasugi/main   # Gemini の 16:9 の絵（T01.jpg〜T15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

