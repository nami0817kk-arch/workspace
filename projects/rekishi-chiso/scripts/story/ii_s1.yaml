title: "井伊直弼｜亡くなった大老への見舞い"
yt_title: "井伊直弼は桜田門外で亡くなっていた　それでも将軍は大老あてに見舞いの品を届けた　届は「少々けが、ひとまず帰宅」"
description: |-
  1860年3月3日、大老・井伊直弼は江戸城の桜田門の外で襲われ、亡くなりました。その夜、井伊家が幕府に出した届は、直弼本人の言葉で「少々けがをしたので、ひとまず帰宅した」。
  幕府は彦根藩に死を伏せるよう命じた、と『維新史料綱要』は記します。将軍の家茂からは大老あてに朝鮮人参が、続いて鯛と氷砂糖が届きました。彦根藩が死を公にしたのは、閏3月30日です。
  本編では、雪の朝の3分と、記録の食い違いを、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
