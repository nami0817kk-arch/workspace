  shot: I23_5
  tone: 重い
  pause: 0.12
  # fact: ii-35
- 語り: "井伊家からは、直弼は病気だ、という届が出された。"
  shot: I11_6
  tone: しみじみ
  pause: 0.12
  # fact: ii-11
- 語り: "そして、将軍の家茂からは、大老あてに、朝鮮人参が届く。続いて若年寄が遣わされ、鯛と、氷砂糖が、贈られた。"
