  pause: 0.12
  # fact: ii-59
- 語り: "和歌山の文書館に伝わる写しでは、届は、直弼本人の言葉で、こう結ぶ。取り押さえの指図をしているうちに、少々けがをしたので、ひとまず帰宅した。"
  shot: I09_4
  tone: 重い
  pause: 0.12
  # fact: ii-11
