title: "福原遷都｜跡は、今も掘られている"
yt_title: "福原遷都の跡は、今も掘られている　2025年に鍛冶工房、2026年に大路の跡　方丈記は清盛の名を1度も書かなかった"
description: |-
  鴨長明は、方丈記に福原遷都を書きました。清盛の名前は、1度も出てきません。車に乗るべき人が馬に乗り、衣冠を着るべき人が直垂を着ている、と書き、同じ年の冬、この京に帰りたまいき、と続けます。
  2025年9月、第25次調査で、12世紀後半のごく短い期間だけ使われた鍛冶工房の跡が見つかりました。2026年11月には、祇園遺跡で、福原京の御所南大路の一部とみられる遺構が見つかったと神戸市が発表しています。
  出発の171日後、兼実は何と書いたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SmAJSk6zrYk
