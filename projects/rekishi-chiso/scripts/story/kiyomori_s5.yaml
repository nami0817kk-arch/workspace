lines:
  # fact: kiyomori-B30
- 語り: "福原の都は、清盛が望んだ形では、残らなかった。ところが、その地面は、今も、掘られ続けている。"
  shot: B15_1
  tone: 強調
  pause: 0.12
  # fact: kiyomori-B24
- 語り: "鴨長明は、方丈記に、この遷都を書いた。清盛の名前は、1度も出てこない。"
  shot: B14_2
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B26
- 語り: "方丈記は書く。車に乗るべき人が馬に乗り、衣冠を着るべき人が直垂を着ている。"
  shot: B02_3
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B27
- 語り: "同じ年の冬、この京に帰りたまいき。壊して運んだ家々は、ことごとく、元のようには造らなかった。"
  shot: B07_4
  tone: 重い
  pause: 0.12
  # fact: kiyomori-B21
- 語り: "2025年9月、第25次調査で、12世紀後半の、ごく短い期間だけ使われた、鍛冶工房の跡が見つかった。"
  shot: B13_5
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B21
- 語り: "釘や小刀が多く、神戸市は、建物の建設に伴う小さな鍛冶場だった可能性が高い、とする。"
  shot: B13_6
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B22
- 語り: "2026年11月には、祇園遺跡で、福原京の大路の一部とみられる遺構が見つかった。長さ約50メートル、幅約13メートルだ。"
  shot: B12_7
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B30
- 語り: "清盛は、ついに、生きて、福原の地を踏むことはなかった。出発の171日後、兼実は、日記に、何と書いたのか。"
  shot: B15_8
  tone: 疑問
  pause: 0.15
