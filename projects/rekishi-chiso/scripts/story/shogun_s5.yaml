# 物語完結型ショート 徳川将軍の1日 s5（2026-11-06）。本編 scripts/shogun-story.yaml（11/9 19:00 公開、https://youtu.be/-kxBsJCne_k）の第6章から。11/10 19:30 公開。
# 形式は ooku_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（小姓の言葉は記録。出どころを言ってから引く）。絵は本編の AI 絵。新しい絵は作らない。
# 切り口：夜の将軍。糠袋・10枚の浴衣・獏の掛け軸・5〜6個の枕・寝ずの番の小姓2人と「咳ひとつできない」。
#   大奥へ入る手順・精進日・枕のくい違いは使わない。家慶の歯（shogun-47、第7章）は tease の答えとして本編に残す。
# どの将軍の記録か：『千代田城大奥』（1892）・松平太郎『江戸時代制度の研究』（1919）＝12代家慶・13代家定のころの元御小姓の話。
# 事実カード：shogun-29・25・30・31。言い方は本編のまま。
#   ・四つ＝午後10時（松平太郎）。浴衣10枚ほど・7〜8枚掛ける、糠袋7〜8個。本編どおり。
#   ・小姓の言葉は『千代田城大奥』コマ131「中々眠られたるものにあらず、君の御目覺中は、猶更咳聲も出來ず」（本編の言い直しのまま）。
# 理解テスト4問：
#   ①誰の話か：幕末の徳川将軍（家慶・家定のころ）の夜
#   ②何をしたか：糠袋は一度きり、浴衣を1枚ずつ掛け替えて乾かす。夜10時に床。枕元に獏の絵、枕は5〜6個
#   ③そばに誰がいたか：寝ずの番の小姓が2人
#   ④どうだったか：番の小姓は、将軍が起きているうちは咳ひとつできなかった
title: 徳川将軍｜夜は、ひとりで眠れたのか
yt_title: 徳川将軍は夜ひとりで眠れたのか　一度きりの糠袋、獏の掛け軸、そして脇で寝ずの番をする小姓2人
description: |-
  天下を治めた徳川将軍は、夜、ひとりで眠れたのでしょうか。
  明治25年（1892年）の『千代田城大奥』と、1919年の松平太郎『江戸時代制度の研究』に、12代家慶や13代家定のころの将軍の夜が残っています。湯殿では糠袋を7つか8つ用意し、一度肌につけた糠袋は二度と使いません。湯から上がると白い浴衣を10枚ほど用意し、1枚ずつ掛けては替え、7枚から8枚掛けて体を乾かしました。四つ、午後10時に床に入ると、枕元には悪い夢を食べるという獏の絵の掛け軸。枕は5つか6つあり、夜中に用を足して戻るたびに新しい枕に替えました。そして将軍の脇には、寝ずの番の小姓が2人、横になっていました。番を勤めた小姓は、なかなか眠れるものではない、将軍が目を覚ましているうちは咳ひとつできない、と語っています。
  では、60歳の将軍の歯は、どうなっていたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川将軍', '#日本史', '#江戸時代']
ai_images: true
ai_disclosure: この動画の将軍の暮らしの場面・室内・人物の画像は、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真や肖像ではありません（画面に「AI生成画像」と出しています）。将軍の姿も特定の肖像を写したものではありません。
