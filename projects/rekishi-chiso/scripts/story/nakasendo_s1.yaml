# 理解テスト：①近江の商人 西村安則の中山道の旅 ②1835年5月13日、軽井沢から碓氷峠を越えて新町まで ③今日は13里ほどと気がせき、松井田で帰り馬を雇った ④日暮れに新町の定宿に着いた。約53キロで、数えた10日で最長
title: "中山道｜峠を越えた日に53キロ"
yt_title: "碓氷峠を越えたその日に、53キロ　1835年、中山道を東へ向かった近江の商人の、いちばん長い1日"
description: |-
  天保6年、1835年。近江の日野の商人、西村安則は、武蔵の吉川にある店へ向かって、中山道を東へ旅しました。その道中を書いたのが『木曾日記』です。
  5月13日の朝、軽井沢を出た安則は、碓氷峠に登り、上野の方を見下ろしました。峠を下りて、松井田で帰り馬を安く雇い、安中で降りています。日記には「今日は十三里ほどの道なので、ことに気がせいた」とあります。
  宿村大概帳の道のりで測ると、軽井沢から新町までは13里18町あまり、およそ53キロ。道のりを数えた10日のうちで、いちばん長い1日でした。
  本編では、近江の日野から武蔵の吉川まで、木曽の桟・鳥居峠・和田峠・碓氷峠を越えた12日間を、宿場ごとに追っています。本編は概要欄のリンクからどうぞ。
