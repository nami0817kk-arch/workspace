lines:
  # fact: kondo-13, kondo-16, kondo-35
- 語り: "大久保大和と名乗った男は、近藤勇だ。それを見破ったのは誰か。記録ごとに、名前が違う。"
  shot: D13_1
  tone: 強調
  pause: 0.12
  # fact: kondo-12, kondo-15
- 語り: "1868年4月3日、流山。新選組の近藤勇は、大久保大和と名乗って、官軍の陣へ出た。"
  shot: D11_2
  tone: しみじみ
  pause: 0.12
  # fact: kondo-13, kondo-95
- 語り: "彦根の井伊家の記録では、見破ったのは、彦根の小隊長、渡辺九郎左衛門。"
  shot: D15_3
  tone: しみじみ
  pause: 0.12
  # fact: kondo-13, kondo-95
- 語り: "渡辺は、かつて京都の会議の場で、近藤の顔を見ていた。"
  shot: D10_4
  tone: 重い
  pause: 0.12
  # fact: kondo-16
- 語り: "土佐の谷干城の記録、『東征私記』では、確かめたのは板橋だ。"
  shot: D12_5
  tone: しみじみ
  pause: 0.12
  # fact: kondo-16
- 語り: "伊東甲子太郎の一派だった、元の仲間を呼び、戸の隙間から、のぞかせた。思ったとおり、近藤勇だった。"
  shot: D13_6
  tone: 重い
  pause: 0.12
  # fact: kondo-35
- 語り: "明治9年の本、『文明史略』では、伊東の弟子だった加納鷲雄が、近藤の前に来て、久しぶりのあいさつをした。"
  shot: D15_7
  tone: しみじみ
  pause: 0.12
  # fact: kondo-35
- 語り: "近藤は驚いて、本当の名を明かした。"
  shot: D10_8
  tone: 重い
  pause: 0.12
  # fact: kondo-96
- 語り: "官軍の総督府の日記は、淡々と書く。4月4日、流山の大久保大和守は、新撰組の隊長、近藤勇だ。"
  shot: D06_9
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第5章（kondo-26・29）
- 語り: "正体が分かったあと、総督府で、近藤をかばったのは、誰だったのか。"
  shot: D14_10
  tone: 疑問
  pause: 0.15
