# 理解テスト：①近藤勇の正体が見破られた話 ②1868年4月、流山と板橋で ③大久保大和と名乗ったが、見破った人は記録で3通り ④4月4日、総督府の日記に近藤勇だと記された
title: "近藤勇｜大久保大和の正体を見破ったのは"
yt_title: "近藤勇の正体を見破ったのは誰か　戸の隙間からのぞいた元の仲間と、3つの記録で違う名前"
description: |-
  1868年4月、流山で「大久保大和」と名乗って官軍の陣に出た新選組の局長、近藤勇。その正体を見破った人の名は、記録ごとに違います。
  彦根の井伊家の記録では、京都で近藤の顔を見ていた彦根の小隊長、渡辺九郎左衛門。土佐の谷干城の『東征私記』では、板橋で、伊東甲子太郎の一派だった者を呼び、戸の隙間からのぞかせて確かめた。明治9年の本、『文明史略』では、伊東の弟子だった加納鷲雄が、近藤の前に来て、久しぶりのあいさつをした、と書きます。
  本編では、正体が分かったあと、板橋の総督府で近藤をかばったのは誰だったのかを、当時の記録で並べています。本編は概要欄のリンクからどうぞ。
