# 物語完結型ショート 元寇（もしも）s4（2026-10-31）。本編 scripts/genkou-if-story.yaml（11/3 12:00 公開、https://youtu.be/TfyxJjTTW9Y）から。切り口：1281年の台風：帰らなかった数が記録ごとに違う
# 形式は jeanne_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「時宗想像」「御家人想像」「季長想像」は使わない）。戦闘・負傷・遺体の絵なし。
# 絵は本編の AI 絵（out/story/genkou-if/main/G01〜G15。人物は描かない）と実在の絵（paintings/genkou_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/元寇_facts_20261030.yaml）：genkou-if-15・16・17・20
# ・本編どおり。『元史』（江南軍）10万のうち3人・『高麗史』（江南軍）10万余が帰らず・『高麗史』（東路軍）東征軍9960＋水夫1万7029、帰還1万9397、計算で帰らず7592。
# ・本編の「東路軍の約8割は生きて帰った計算」は、1万9397÷（9960＋1万7029＝2万6989）＝約72％で「約8割」とは合わない（本編の誤り候補）。このショートでは割合を言わず、数字だけ並べる。池田榮史さんの「8割方」の引用も使わない。
# ・池の堆積層は原口強さんらの2016年の調査（20）。どちらの数字が実態に近いかは決められなかった、と問いで閉じる。
# 理解テスト4問：
#   ①誰の話か：1281年の台風で帰らなかった元軍の数の記録
#   ②いつ・どこで何が：1281年8月、『元史』は風が船を破ったと書き、10万の兵のうち帰ったのは3人だけと書く
#   ③何が問題か：『高麗史』の高麗から来た軍（東路軍）は1万9397人が帰り、帰らなかったのは7592人。記録ごとに違う
#   ④どうなったか：天草の池の底の堆積層が台風を裏づけた。どちらが実態に近いかは問いで閉じる
title: 元寇｜10万人のうち帰ったのは3人という記録と、7592人という記録
yt_title: 元寇の台風で帰った兵は10万人のうち3人？　『元史』と『高麗史』で数が違う
description: |-
  1281年8月1日、『元史』は、風が船を破った、と書きます。5日、范文虎ら将軍たちは、それぞれ堅くて良い船を選んで乗り、兵士10万余りを山の下に捨てて去った、とあります。10万の兵のうち、帰ることができたのは、3人だけ、と『元史』は書いています。
  『高麗史』も、范文虎の軍は、船3500艘、兵10万余りで来て、大風に遭い、皆、溺れ死んだと書きます。ところが、高麗から来た軍（東路軍）の数字は少し違い、東征軍9960人と水夫1万7029人のうち、生きて帰った者が1万9397人、帰らなかったのは7592人と計算できます。熊本県の天草の池の底では、13世紀の厚さ63cmの堆積層が見つかり、原口強さんらは、1281年のものではないか、と結論づけています。
  台風は、本当に吹いた。では、どちらの数字が、実態に近いのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
