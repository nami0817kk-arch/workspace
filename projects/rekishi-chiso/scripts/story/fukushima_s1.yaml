# 理解テスト4問：①福島正則（広島49万8千石の大名）②1617年の洪水のあと、1619年4月に条件つきで許され、6月2日に改易 ③条件は本丸以外の修理部分を壊すこと→書状は本丸を壊す指示 ④改易。次は広島城の家臣たちの動き（本編4章）
title: "福島正則｜本丸以外を壊せと命じられ、壊したのは"
yt_title: "福島正則は「本丸以外を壊せ」と命じられ、どこを壊したのか　広島城の修理と1619年6月2日の改易"
description: |-
  福島正則は、洪水で壊れた広島城を修理し、幕府から「本丸以外を壊せ」と命じられました。ところが、正則が国元に書いた書状は、本丸の櫓と石垣を壊すよう指示していました。ひろしまWEB博物館の解説にある書状です。
  1619年4月、将軍秀忠はいったん改易を決めたものの、条件をつけて許していました。条件を守れなかった正則は、6月2日、広島城の無断修築を咎められて改易されます。
  改易が決まったとき、広島の城の家臣たちは、何をしたのか。本編は概要欄のリンクからどうぞ。
