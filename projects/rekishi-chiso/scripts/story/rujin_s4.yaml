# hook＝妻をめとれない流人と暮らした島の女は、何と呼ばれたか（答えはこのショートの中：水汲み女）。
# tease＝流人が許されて島を出るとき、妻と子は一緒に行けたか（答えは本編 第6章：自由に連れて行けたのは明治2年からといわれる／八丈実記は願えば呼び寄せられたと書く、rujin-37・35）。
# 「慶長のむかし」は年の分からない言い伝えとして八丈実記の言葉のまま言い、年の流れ（1766年）とはつなげない。
# 理解テスト：①八丈島の流人と暮らした島の女の話 ②江戸時代の八丈島（伊豆の島々の掟、1766年の記録） ③掟は禁じたが、八丈実記は代官が水汲みの名で許したと書く ④島の人が禁止を願い出たこともあり、1766年には流人の子が63人いた
title: "八丈島の流人｜水汲み女"
yt_title: "妻をめとれない流人と暮らした八丈島の女は「水汲み女」と呼ばれた　禁じた掟と、許したという記録"
description: |-
  江戸時代、八丈島の流人が妻をめとることは許されていませんでした。それでも、流人と暮らす島の女がいました。水汲み女と呼ばれた女たちです。研究者の山本清司さんの1961年の論文は、水汲み女を、流人の事実上の妻と書いています。
  伊豆の島々で流人に言い渡された掟は、残っているもののほとんど全てが、水汲み女を置くことを禁じていました。ところが、流人の近藤富蔵は『八丈実記』に、慶長のむかし地元の代官だった奥山氏が「水汲み」と名付けて許した、と書いています（松尾寿さんの1991年の論文が引いています）。島の人が、子が生まれて食べ物が足りなくなるという理由で、禁止を願い出て認められたこともありました。1766年には、島に流人の子が63人いたと記録されています。
  本編では、流人の送られ方・住まい・食べ物・仕事・島抜け・赦免まで、島に残った帳面と流人の記録でたどっています。本編は概要欄のリンクからどうぞ。
