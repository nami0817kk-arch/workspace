# 物語完結型ショート もしも鎖国 s3（2026-11-17）。本編 scripts/sakoku-if-story.yaml（11/21 19:00 公開予定、https://youtu.be/7dL7AYzb7zI）から。11/22 15:30 に予約。
# 形式は titanic_s1〜s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/鎖国if_facts_20261116.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/sakoku_if/main/ の B01〜B25・T01）の切り出しだけ。新しい絵は作らない。B22（西洋船に見える）は使わない。B23（イギリスの旗）はイギリスの話だけ。処刑・惨状・顔は絵にしない。
# 切り口：1640年、平戸のオランダの倉庫は、刻まれた年（西暦）を理由に壊された。その年は資料で食い違う（本編 第4章・分岐3）。
# 計算（自分で数え直した）：1640年11月→翌年（1641年）6月25日。刻銘の年は 1639（平戸側の呼び名）と 1640（オランダ側の解説）。
title: "平戸｜オランダの倉庫は、刻まれた年で壊された"
yt_title: "平戸のオランダ商館の倉庫は、刻まれた「年」を理由に壊された　その年は資料で食い違う　もしも平戸に残っていたら"
description: |-
  1640年11月、大目付の井上政重が平戸のオランダ商館を調べ、新しく建てた倉庫を壊すよう、商館長カロンに命じました。表向きの理由は、倉庫に西暦の年が刻まれていたことでした。
  その年は資料で食い違います。平戸の側はこの倉庫を「1639年築造倉庫」と呼び、オランダ側の解説では、石の文字は Anno Christi 1640 です。
  後半は「もしも」の話です。記録ではなく、考え方の整理です。本編は概要欄のリンクからどうぞ。
  https://youtu.be/7dL7AYzb7zI
