lines:
  # fact: sakokuif-31
- 語り: "刻まれた1つの年を理由に、オランダの倉庫は、壊された。1640年の平戸だ。"
  shot: B18_1
  tone: 強調
  pause: 0.12
  # fact: sakokuif-32
- 語り: "1640年11月、大目付の井上政重が、平戸のオランダ商館を調べに来て、キリスト教の品がないか、見て回った。"
  shot: B18_2
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-31
- 語り: "そのうえで、新しく建てた倉庫を壊すよう、商館長カロンに命じる。理由は、倉庫に、キリストの生まれた年から数える年、西暦が、刻まれていたことだった。"
  shot: B19_3
  tone: 重い
  pause: 0.12
  # fact: sakokuif-33
- 語り: "その年は、資料で食い違う。平戸の側は、1639年築造倉庫と呼ぶ。オランダ側の解説では、石の文字は、アンノ・クリスティ、1640だ。"
  shot: B19_4
  tone: 疑問
  pause: 0.12
  # fact: sakokuif-31
- 語り: "カロンは逆らわず、倉庫を壊した。商いは、そのまま、続けてよいとされた。"
  shot: B19_5
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-35
- 語り: "翌年の6月25日、オランダ商館は、長崎の出島へ移る。"
  shot: B20_6
  tone: 重い
  pause: 0.12
  # fact: sakokuif-31
- 語り: "ここからは、もしもの話。もしもオランダが、平戸に残っていても、幕府の条件をのむ側である限り、行き着く先は、同じだったかもしれない。"
  shot: B18_7
  tone: しみじみ
  pause: 0.12
  # fact: sakokuif-38
- 語り: "では、幕府は、なぜ、外国との商いを、長崎の小さな島へ集めたのか。"
  shot: B20_8
  tone: 疑問
  pause: 0.15
