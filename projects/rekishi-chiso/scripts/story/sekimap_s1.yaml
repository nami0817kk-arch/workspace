# 計算（数え直した）：前 14.5＋12＋5＋3＋15.2＋5.74＋24＝79.44。後 17.5＋24＋20.26＋6＋52＋32.5＋49.8＝202.06。202.06÷79.44＝2.54→2.5倍。
#   清洲を除く 79.44−24＝55.44→およそ55万、後 78−52＝26。26÷55.44＝0.47→半分以下。松平家清 3÷15.2＝0.197→およそ5分の1。
# 理解テスト：①東海道の城にいた豊臣の大名7家の話 ②1600年の関ヶ原のあと、東海道（駿府・浜松・掛川・横須賀・吉田・岡崎・清洲） ③7家とも西へ移され、石高は約2.5倍 ④空いた城には小さな家康の家臣・親類（清洲だけ家康の四男）
title: "関ヶ原のあと｜東海道の7つの家"
yt_title: "関ヶ原のあと、東海道に城を持っていた豊臣の7つの家は、そろって西へ　石高はおよそ2.5倍、空いた城には家康の家臣"
description: |-
  1600年の関ヶ原のころ、江戸から京へ向かう東海道の城は、豊臣の大名たちが握っていました。駿府の中村家、浜松の堀尾家、掛川の山内一豊、横須賀の有馬豊氏、吉田の池田輝政、岡崎の田中吉政、清洲の福島正則です。
  関ヶ原のあと、7つの家はそろって西へ移されました。石高を足すと、前のおよそ79万石から、後はおよそ202万石。2.5倍です。空いた城には家康の家臣や親類が入り、清洲を除く6つの城は、およそ55万石から26万石になりました。
  本編では、取り上げた石高の総量から、毛利・上杉・佐竹・島津のその後まで、関ヶ原の前と後の大名の地図を数字で積み上げています。本編は概要欄のリンクからどうぞ。
