  # fact: sekimap-82, sekimap-85, sekimap-88（本編 第3章「江戸から京へ向かう道の城を、豊臣の大名たちが、ずらりと握っていた」）
- 語り: "1600年の関ヶ原のころ、江戸から京へ向かう東海道の城は、豊臣の大名たちが握っていた。"
  shot: R19_2
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-94, sekimap-31
- 語り: "駿府の中村家は、米子へ。浜松の堀尾家は、出雲へ。掛川の山内一豊は、土佐へ。"
  shot: N06_3
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-94, sekimap-32, sekimap-22
- 語り: "横須賀の有馬豊氏は、福知山へ。吉田の池田輝政は、姫路へ。岡崎の田中吉政は、筑後へ。清洲の福島正則は、広島へ。"
  shot: R05_4
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-94
- 語り: "7つの家の石高を足すと、前はおよそ79万石。後はおよそ202万石。2.5倍になった。"
  shot: R06_5
  tone: 重い
  pause: 0.12
  # fact: sekimap-95, sekimap-96, sekimap-97, sekimap-98, sekimap-99, sekimap-100
- 語り: "空いた城には、3万石から6万石の、家康の家臣や親類が入った。"
  shot: R23_6
  tone: しみじみ
  pause: 0.12
  # fact: sekimap-101, sekimap-102
- 語り: "清洲を除く6つの城は、前のおよそ55万石から、26万石へ。半分以下の小さな大名ばかりになった。"
  shot: R20_7
  tone: 重い
  pause: 0.12
  # fact: sekimap-93
- 語り: "掛川市は、この配置を、領地を増やしながら、豊臣の大名を、大事な土地から遠くへ追いやるもの、と説明している。"
  shot: R25_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第7章（中村・福島・田中・堀尾の4つが33年のうちに大きな領地を失う）
- 語り: "では、西へ移った7つの家は、そのあと、どうなったのか。"
  shot: R17_9
  tone: 疑問
  pause: 0.15
