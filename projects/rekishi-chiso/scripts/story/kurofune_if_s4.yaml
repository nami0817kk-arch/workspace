# 理解テスト4問：
#   ①誰の話か：ペリーの艦隊と石炭
#   ②いつ・どこで何が：1851年の命令書で石炭を神の贈り物と呼ぶ。1852年11月24日にミシシッピ号が出航、セイロン・シンガポールで石炭を買えない
