#   ④どうなったか：1853年7月8日、4隻で浦賀の沖へ。もしも石炭が要らなかったら、を問いで閉じる
title: 黒船｜黒船を動かしたのは、石炭だった
yt_title: 黒船を動かしたのは石炭だった　ペリーの艦隊は往路で石炭を買えなかった
description: |-
  日本の石炭は、神が日本の島々の地中に置いた贈り物。アメリカの国務長官ウェブスターは、1851年6月10日の命令書に、そう書きました。
  1852年11月24日、ペリーの艦隊の蒸気船ミシシッピ号は、仲間の船を待たずにノーフォークを出航します。往路では、セイロンのポイント・ド・ガルで、イギリスの汽船会社が、外国の軍艦には1トンも売るな、と厳命していました。シンガポールでは、1ポンドも買えません（『日本遠征記』）。ジョン・ダワーさんの解説によると、1854年の再来のとき、ミシシッピ号は1時間に約1トンの石炭を燃やしています。ペリーは1853年6月、小笠原の父島で土地を買いました。想定したのは、カリフォルニアと中国を結ぶ蒸気船の石炭置き場です。そして7月8日、4隻で浦賀の沖に着きました。
  もしも、蒸気船に石炭が要らなかったら。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
