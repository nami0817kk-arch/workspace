# 切り口：本編の第4章＝労働者の墓と町。町と墓は「クフ王のあとの時代が中心」（本編の直し）、町はスフィンクスの約400m南、肉の推定はメンカウラーの労働者についてのもの。
# 計算：4,000ポンド×0.4536＝1,814kg＝約1.8トン。第4〜第6王朝で約300年（本編・事実カードどおり）。
title: "大ピラミッド｜造った人の墓は、王のそばにあった"
yt_title: "ピラミッドを造った労働者の墓　1990年にギザで見つかり、骨折を治した跡が残っていた　奴隷なら造れなかった墓"
description: |-
  1990年、ギザの南で、労働者の墓地が見つかりました。発掘したエジプトの考古学者ザヒ・ハワスは、見つかっていなかったのは労働者階級の墓だった、と語りました。骨には、手足の骨折が固定されて治った跡が、しばしば見られました。
  スフィンクスの約400メートル南には、パン工房や王のサイロのある町もあります。町と墓は、クフ王のあとの時代が中心です。
  本編では、ヘロドトスの「強制」と、発掘の「配給と墓」を並べ、誰が造ったと言えるのかを整理しています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/B-vlbAtwegY
