lines:
  # fact: pyramid-P18, pyramid-P22
- 語り: "ピラミッドを造った人々の墓は、王のそばにあった。1990年、ギザの南で、労働者の墓地が、見つかったのだ。"
  shot: C15_1
  tone: 強調
  pause: 0.12
  # fact: pyramid-P18
- 語り: "発掘したのは、エジプトの考古学者、ザヒ・ハワス。見つかっていなかったのは、労働者階級の墓だった、と語った。"
  shot: C16_2
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P18
- 語り: "墓は、労働者と監督のもので、何百基にのぼる。第4王朝から第6王朝まで、約300年にわたる。"
  shot: C15_3
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P19
- 語り: "骨には、手足の骨折が、固定されて治った跡が、しばしば見られた。"
  shot: C16_4
  tone: 重い
  pause: 0.12
  # fact: pyramid-P16, pyramid-P23
- 語り: "スフィンクスの約400メートル南には、町もある。使われたのは、主に、クフ王のあとの時代だ。"
  shot: C13_5
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P16
- 語り: "町には、パン工房と、王のサイロがあった。穀物を配り、パンとビールにした。"
  shot: C12_6
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P17
- 語り: "町の動物の骨を調べた研究者は、メンカウラー王のピラミッドの労働者に、毎日、約1.8トンを超える肉が配られた、と推定した。"
  shot: C14_7
  tone: 重い
  pause: 0.12
  # fact: pyramid-P22
- 語り: "ハワスは、こう述べた。奴隷なら、王のそばに、自分の墓は造れなかっただろう、と。"
  shot: C15_8
  tone: 重い
  pause: 0.12
  # fact: pyramid-P22
- 語り: "では、働いた人の中に、奴隷は、1人もいなかったのか。"
  shot: C23_9
  tone: 疑問
  pause: 0.15
