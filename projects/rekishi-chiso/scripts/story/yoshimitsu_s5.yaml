lines:
  # fact: yoshimitsu-19
- 語り: "足利義満が病に倒れる、2日前。次男の義嗣が、親王に準ずる扱いで、元服した。"
  shot: S05_in5
  tone: 強調
  pause: 0.12
  # fact: yoshimitsu-19
- 語り: "1408年4月25日。清涼殿で、義嗣は元服した。後小松天皇の猶子で、准親王の扱いだった。"
  shot: S05_right3
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-19
- 語り: "同じ日、義嗣は、参議、従三位になる。階を飛び越える、越階だった。"
  shot: S04_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-20
- 語り: "椿葉記は、この元服を、先例に準じたものとし、兄をも押しのけてしまいそうだ、という世間の声を、書き留める。"
  shot: S03_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-10
- 語り: "2日後の4月27日。義満は、発病する。鹿苑院殿追善記は、御不例、とだけ書き、病名は、書かれていない。"
  shot: S02_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-11
- 語り: "同じ27日、義満は、山科嗣教、16歳の元服に、自ら加冠している。教言卿記は、希代の事なり、と書く。"
  shot: S05_in6
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-13
- 語り: "5月5日の朝は、回復し、端午の菖蒲を祝った。ところが、午の刻から、再び重くなる。"
  shot: S02_right3
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-10
- 語り: "発病から、9日。5月6日、義満は、亡くなった。"
  shot: S05_left7
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-08
- 語り: "では、跡継ぎは、誰になったのか。"
  shot: S04_left3
  tone: 疑問
  pause: 0.15
