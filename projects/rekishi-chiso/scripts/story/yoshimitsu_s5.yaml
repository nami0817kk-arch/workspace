title: "足利義満｜元服の2日後に、病に倒れた"
yt_title: "足利義満は、次男の元服の2日後に発病した　病名は書かれていない　発病から9日で亡くなる"
description: |-
  1408年、応永15年4月25日。足利義満の次男、義嗣が、清涼殿で元服しました。後小松天皇の猶子で、親王に準ずる扱いでした。同じ日、義嗣は参議、従三位になります。
  椿葉記は、この元服を先例に準じたものとし、兄をも押しのけてしまいそうだ、という世間の声を書き留めます。2日後の4月27日、義満は発病します。鹿苑院殿追善記は、御不例、とだけ書き、病名は書かれていません。5月5日の朝は回復したものの、午の刻から再び重くなり、5月6日に亡くなりました。
  跡継ぎは、誰になったのか。本編は次のリンクからどうぞ。
  https://youtu.be/6dJB0Rq7yeY
