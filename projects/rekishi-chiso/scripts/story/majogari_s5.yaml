# 理解テスト：①魔女として処刑された人の名誉回復の話 ②2008年グラールス・2012年ケルン・バンベルク・2022年スコットランド
#   ③自分の権利で裁いたケルンは市議会で決め、司教の国の後を継いだのが州のバンベルクは見送った ④ペンドルの10人には恩赦は出ていない
title: "魔女狩りのその後｜名誉回復"
yt_title: "魔女として処刑された人の名誉回復、決められた町と決められなかった町　分けたのは「誰が裁いたか」だった"
description: |-
  ヨーロッパで最後に魔女として処刑されたとされるのは、1782年、スイスのグラールスのアンナ・ゲルディです。2008年8月27日、グラールスの州議会は全会一致で、ゲルディの名誉を回復しました。処刑から226年後のことです。
  2012年には、ドイツのケルン市議会が、1627年に処刑されたカタリーナ・ヘノートと、ほかの37人の名誉を回復しました。ケルンは、自分の権利で魔女を裁いた町でした。一方、バンベルクでは、魔女を裁いたのは司教の国で、その国を継いだのは今のバイエルン州だから、という理由で、名誉回復が見送られました。
  2022年3月8日には、スコットランドの首相が、魔女として訴えられ処刑された人々に正式に謝罪しています。1612年のイングランドで死刑になったペンドルの10人には、国王の恩赦は出ていません。
  出どころは AP（2008年）・Legal Tribune Online（2014年）・Holyrood（2022年）・英国議会の請願のページほかです。
  本編では、ペンドルの10人を、誰が訴え、誰が取り調べ、誰が裁いたのかを、1613年の裁判の記録でたどっています。本編は概要欄のリンクからどうぞ。
