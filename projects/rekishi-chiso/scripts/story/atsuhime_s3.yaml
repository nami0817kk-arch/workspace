# tease＝家達が戻った翌年、千駄ヶ谷の屋敷で篤姫に何が起きたのか（答えは本編 第5章：1883年、湯殿でつまずき中風、atsuhime-35）。
# 計算（自分で数え直した）：家達 文久3年7月11日＝1863年8月24日生まれ。継いだ慶応4年閏4月29日＝1868年6月19日 → 満4歳。
#   留学 1877〜1882 → 5年。1882年に数えで 1882−1863＋1＝20歳。翌年＝1883年（篤姫の死）。
# 理解テスト：①篤姫と、4歳で徳川を継いだ家達の話 ②1868年に継ぎ、1871年に東京、1877〜1882年イギリス ③外出にも木綿のふだん着だけを着せた ④数え20歳で近衛家の泰子と結婚し、一家のあるじになった
title: "篤姫｜4歳の当主に着せた服"
yt_title: "4歳で徳川の家を継いだ家達に、篤姫が着せたのは木綿のふだん着だった　勝海舟が語った育て方"
description: |-
  1868年、徳川の家は、満4歳の田安亀之助、のちの徳川家達が継ぎました。東京へ出た家達の赤坂の屋敷の中で、篤姫は別の棟に暮らしています。
  勝海舟は、家達はそういうふうに育てたから、たいへん質素だ、外に出るときでも、ふたこ（木綿のふだん着）のほかは着せなかった、と語っています。
  イギリス留学から戻った1882年、篤姫は、家達を近衛家の泰子と結婚させました。本編では、城を出たあとの15年あまりをたどっています。本編は概要欄のリンクからどうぞ。
