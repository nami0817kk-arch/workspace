# 切り口：近くにいたカリフォルニアン号の無線士エバンズが、タイタニックから受けた返事が、米上院（黙れ、黙れ、私は忙しい）と英国調査（邪魔するな）で違う。その後エバンズは寝た。
# 計算（自分で数え直した）：なし（時刻はカリフォルニアン号の船内時刻のまま。タイタニックの時刻と引き算しない）
title: "タイタニック｜近くの船の無線士への返事は、米英の調査で違う"
yt_title: "タイタニック　近くの船の無線士が受けた返事は「黙れ」か「邪魔するな」か　アメリカ上院と英国の調査で違う証言"
description: |-
  タイタニックが沈んだ夜、近くにいたカリフォルニアン号の無線士エバンズは、タイタニックに、氷に囲まれて止まっている、と送りました。
  返ってきた言葉は、アメリカ上院の証言では「黙れ、黙れ、私は忙しい、ケープレースと交信中だ」。英国の調査の証言では「邪魔するな」です。そのあと、エバンズはヘッドホンを外して寝ました。この船の無線士は、エバンズ1人でした。
  本編では、衝突から沈没までの2時間40分を、無線の記録と英米2つの調査から、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SdhomuxqfF4
