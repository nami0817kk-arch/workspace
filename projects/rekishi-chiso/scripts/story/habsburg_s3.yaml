lines:
  # fact: habs-18
- 語り: "1526年、モハーチの戦い。8月29日、ハンガリーとボヘミアの王、ルートヴィヒ2世が、20歳で、命を落とした。"
  shot: C09_1
  tone: 重い
  pause: 0.12
  # fact: habs-19
- 語り: "11年前、ウィーンの大聖堂で交わされた婚約が、ここで、動き出す。"
  shot: C08_2
  tone: 強調
  pause: 0.12
  # fact: habs-19
- 語り: "ハプスブルガー・ネットは、取り決めは、思ったより早く効き始めた、と書く。"
  shot: C11_3
  tone: しみじみ
  pause: 0.12
  # fact: habs-19
- 語り: "けれど、王冠が、自動で渡ったわけではない。どちらの国でも、選挙が、必要だった。"
  shot: C10_4
  tone: 重い
  pause: 0.12
  # fact: habs-19
- 語り: "ボヘミアでは、その年のうちに、貴族たちの議会が、フェルディナントを、王に選んだ。"
  shot: C10_5
  tone: しみじみ
  pause: 0.12
  # fact: habs-19
- 語り: "ハンガリーでは、ライバルの貴族、ザポリヤも、同じ1526年に、王に選ばれ、戴冠した。"
  shot: C11_6
  tone: しみじみ
  pause: 0.12
  # fact: habs-19
- 語り: "2021年の論文は、フェルディナントの根拠は、条約ではなく、選出と、翌1527年の戴冠だった、と指摘する。"
  shot: C03_7
  tone: しみじみ
  pause: 0.12
  # fact: habs-19
- 語り: "手に入ったのは、ハンガリーの、北西の一部だけ。結婚は、扉を開けただけだった。"
  shot: C09_8
  tone: 重い
  pause: 0.12
  # fact: habs-21
- 語り: "では、その広い領地を、一人で抱えた皇帝は、どんな決断をしたのか。"
  shot: C16_9
  tone: 疑問
  pause: 0.15
