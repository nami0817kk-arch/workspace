title: "ハプスブルク｜王冠は、相続では来なかった"
yt_title: "1526年、20歳の王が戦場で亡くなった　婚約の約束は効いたが、王冠は自動では渡らなかった　選挙と、手に入った北西の一部"
description: |-
  1526年8月29日、モハーチの戦いで、ハンガリーとボヘミアの王ルートヴィヒ2世が20歳で亡くなりました。11年前のウィーンの婚約が、ここで効き始めます。
  けれど、王冠は自動では渡りませんでした。ボヘミアでは、その年のうちに貴族の議会がフェルディナントを選び、ハンガリーでは、ライバルのザポリヤも同じ1526年に王に選ばれ、戴冠します。手に入ったのは、ハンガリーの北西の一部だけでした。
  広い領地を一人で抱えた皇帝は、ある決断をします。本編は概要欄のリンクからどうぞ。
  https://youtu.be/RnyhC0Qyirs
