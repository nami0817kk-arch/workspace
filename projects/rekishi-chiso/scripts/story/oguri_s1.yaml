# 物語完結型ショート 小栗忠順 s1（2026-11-05）。本編 scripts/oguri-story.yaml（11/6 19:00 公開、https://youtu.be/kU5JH7ybcrI）の第4章の終わり・第5章から。11/7 9:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。斬首の場面の細部は描かない（「斬られた」とだけ言う）。
# 絵は本編の AI 絵（out/story/oguri/main。FLUX。人物は後ろ姿・遠景だけ）と実在の写真（小栗の肖像・ベアトの武士）。新しい絵は作らない。
#   時代違いの物がある絵は使わない：O10（送電塔・近代風のヘルメット）・O08（ガラス窓・電柱）・O09（舗装路）・O12（ガラスのろうそく立て）・O17（ホース状の線）・O18（偽の字）・O13（今風の短髪）・O03（3本煙突）。
#   O06 は左寄りに街灯があるので右寄り（focus 0.78）だけ。O11 は提灯に偽の字があるので真ん中だけ。
# 切り口：謝罪を退けたのは19歳と22歳の使い。命令書の中身（s3）・取り調べの食い違い（s2）・家族（s4）・碑（s5）には踏み込まない。
# 事実カード（dev/output/rekishi-chiso/research/小栗忠順_facts_20261105.yaml）：oguri-16・17・18・19・21・31・49・62。言い方は本編のまま。
#   ・年齢は数え年で計算し直した：原保太郎は弘化4年（1847）生まれ → 1868−1847＋1＝22。豊永貫一郎は嘉永3年（1850）生まれ → 1868−1850＋1＝19。本編どおり。
#   ・閏4月4日（高崎に着く）→ 閏4月6日（斬首）＝2日。本編のまとめ「わずか2日」と同じ。
#   ・60秒に収めるため（初版は72.7秒）、出身（土佐・丹波／長州）と「謀反の気持ちがない証し」は語りから外した（概要欄には残す）。
#   ・出どころが1つの事実（oguri-17・19・31・49）は、記録・本の名を語りで言ってから言う。19歳・22歳は丑木 2026 だけなので「と書いている」。
# 理解テスト4問：
#   ①誰の話か：幕府の切れ者、小栗忠順と、新政府の2人の使い
#   ②いつ・どこで何が：1868年閏4月、上州の権田村と高崎。小栗は武器を差し出して詫びたが、閏4月4日に高崎に着いた使いが謝罪を退けた
#   ③使いは何を選んだか：謝罪を退け、父子の召し捕りを命じた（高崎市史は、2人がもとより小栗を憎んでいたと書く）
#   ④どうなったか：2日後の閏4月6日、小栗は烏川の河原で斬られた
title: 小栗忠順｜謝罪を退けた、19歳と22歳の使い
yt_title: 小栗忠順の謝罪を退けたのは19歳と22歳の新政府の使いだった　高崎に着いて2日後の斬首
description: |-
  幕府の切れ者、小栗忠順の謝罪を退けたのは、19歳と22歳の、新政府の使いでした。
  1868年閏4月1日、小栗は、謀反の気持ちがない証しに武器を差し出し、養子の又一を高崎へ出して詫びを入れさせました。3つの藩の兵は引き揚げます。ところが閏4月4日、新政府の軍の本営から、豊永貫一郎と原保太郎の2人が高崎に着きます。丑木幸男さん（2026年）は、豊永を土佐の出身で19歳、原を丹波の出身で22歳と書いています。吉井藩の記録に残る2人の答えは「逆謀判然たり、父子ともに速やかに召し捕れ」。1927年の『高崎市史』は、2人がもとより小栗を憎んでいたと書き、2人を長州藩士としています。使いが高崎に着いて、わずか2日後、小栗は烏川の河原で斬られました。
  新政府の命令書は、小栗の罪を何と書いていたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#小栗忠順', '#日本史', '#幕末']
