title: "ハプスブルク｜近親係数0.025から0.254へ"
yt_title: "ハプスブルク家の王の近親係数は、0.025から0.254へ　最後の王の値は、きょうだいの子とほぼ同じ　2009年の論文が数えた"
description: |-
  1700年に亡くなったスペイン王カルロス2世の近親係数は0.254。きょうだいのあいだに生まれた子の値、0.25とほぼ同じです。
  2009年の論文は、16世代・3,000人を超える家系図をたどりました。創始者のフェリペ1世は0.025、フェリペ3世は0.218、歴代の王の平均は0.129。王家の結婚11組のうち9組、81.8%が、ひいひいおじいさんが同じか、それより近い親戚どうしでした。王家の子34人のうち、1歳になる前に10人、29.4%が亡くなっています。
  論文は、近親婚が断絶の原因だったとは言い切っていません。最後の王は、どんな子ども時代を送ったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/RnyhC0Qyirs
