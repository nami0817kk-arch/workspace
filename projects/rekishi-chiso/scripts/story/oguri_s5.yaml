# 物語完結型ショート 小栗忠順 s5（2026-11-05）。本編 scripts/oguri-story.yaml（11/6 19:00 公開、https://youtu.be/kU5JH7ybcrI）の第8章から。11/7 19:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。斬首の場面の細部は描かない。
# 絵は本編の AI 絵（out/story/oguri/main。人物なし）と、本編で使った写真（小栗の肖像・1872年の横須賀造船所）だけ。新しい絵は作らない。
#   時代違いの物がある絵（O08・O09・O10・O12・O13・O17・O18・O03）は使わない（s1 の頭のコメント）。O15（石碑）は字の無い石で、実在の碑の形とは違う → 「刻まれた言葉は」の行でも石の絵は「イメージ」として出し、画面の右上に「AI生成画像」が出る。
# 切り口：反逆人とされた小栗の河原に、64年後、「罪なくして此所に斬らる」の碑が立つまで。使い（s1）・取り調べ（s2）・命令書（s3）・家族（s4）には踏み込まない。
# 事実カード：oguri-21・38・45・67・72。言い方は本編のまま。
#   ・杉を植えた日は本編どおり1927年10月10日（oguri-45）だが、画面で「10／日」に割れたので語りは「1927年10月」までにした。
#   ・年の計算：1912−1868＝44年／1932−1868＝64年。本編どおり。1931年の翌年＝1932年。
#   ・東郷の礼は上毛新聞 2023 などの記事（oguri-72、出どころ2）だが、家の中での言葉なので「と伝わる」を付ける。
#   ・反逆人の名・杉・「命じた人は語らない」は蜷川新の本だけ（oguri-38・45）→ 「蜷川新によれば」「蜷川は、こう書いた」と言う。
# 理解テスト4問：
#   ①誰の話か：1868年に斬られた小栗忠順と、その名誉
#   ②いつ・どこで何が：1868年閏4月6日に上州の烏川の河原で斬られ、反逆人とされた。1912年に東郷平八郎が家族を招いて礼を述べた
#   ③誰が何をしたか：蜷川新が墓前に杉を植え、斬首を命じた人は語らないと書いた。1932年、地元の人たちが河原に碑を建てた
#   ④どうなったか：斬首から64年後、「偉人小栗上野介、罪なくして此所に斬らる」と刻まれた
title: 小栗忠順｜「罪なくして此所に斬らる」
yt_title: 「罪なくして此所に斬らる」小栗忠順が斬られた河原に碑が立つまで64年　東郷平八郎の礼と語らない人
description: |-
  幕府の切れ者、小栗忠順が斬られた河原に碑が立つまで、64年かかりました。
  1868年閏4月6日、小栗は上州の烏川の河原で斬られ、反逆人とされます。44年後の1912年夏、東郷平八郎は小栗の家族を自宅に招き、日本海海戦の勝利は小栗が造った横須賀造船所のおかげだ、と礼を述べたと伝わります。それでも蜷川新によれば、昭和の初めまで、反逆人の名は公には解かれませんでした。1931年、蜷川は「斬首を命じた人は今も生きているが、問うても事情を語らない」と書きます。翌1932年、斬られた河原に、地元の人たちが碑を建てました。刻まれた言葉は「偉人小栗上野介、罪なくして此所に斬らる」。
  罪がないのなら、なぜ斬られたのか。本編は概要欄のリンクからどうぞ。
