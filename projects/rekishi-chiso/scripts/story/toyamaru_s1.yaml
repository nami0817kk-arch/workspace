lines:
  # fact: toyamaru-01
- 語り: "1954年、函館。青函連絡船の洞爺丸は、9月26日、日曜日の14時40分の出航を、見合わせた。"
  shot: S02_1
  tone: 強調
  pause: 0.12
  # fact: toyamaru-01
- 語り: "理由は、台風ではない。停電だった。船と桟橋をつなぐ、可動橋を、外せなかったのだ。"
  shot: S02_2
  tone: 重い
  pause: 0.12
  # fact: toyamaru-02
- 語り: "午前11時。函館海洋気象台が、暴風雨警報を出した。"
  shot: S03_3
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-02
- 語り: "予報部長の肥沼寛一さんは、国会で、海上の風は25メートルから30メートル、という内容だった、と答えた。"
  shot: S03_4
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-03
- 語り: "国鉄の副総裁、天坊裕彦さんは、国会で、15時の台風は、青森の西、およそ100キロにいた、と説明している。"
  shot: S14_5
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-01
- 語り: "裁決の要旨は、停電で出られないまま時間が過ぎ、船長は、出航の時機を失した、として、見合わせたと書く。"
  shot: S05_6
  tone: 重い
  pause: 0.12
  # fact: toyamaru-04
- 語り: "それから、17時。函館桟橋の気圧は、982.6ミリバール。風が、急に弱まった。"
  shot: S04_7
  tone: 強調
  pause: 0.12
  # fact: toyamaru-04
- 語り: "青空が見え、台風の目のようだった、と、裁決の英訳は書いている。"
  shot: S04_8
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-05
- 語り: "では、風が弱まったとき、船長は、何を決めたのか。"
  shot: S05_9
  tone: 疑問
  pause: 0.15
