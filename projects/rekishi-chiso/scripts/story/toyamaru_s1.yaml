title: "洞爺丸｜出航できなかった午後、理由は台風ではなかった"
yt_title: "洞爺丸は、1954年9月26日の昼、函館で出航できなかった　理由は台風ではなく、停電だった　裁決の要旨が書く午後"
description: |-
  青函連絡船の洞爺丸は、1954年9月26日、日曜日の午後2時40分の出航を、函館で見合わせました。理由は、台風ではなく、停電でした。船と桟橋をつなぐ可動橋を、外せなかったのです。
  午前11時には、函館海洋気象台が暴風雨警報を出していました。そして17時、函館桟橋の気圧は982.6ミリバール。風が、急に弱まります。
  風が弱まったとき、船長は、何を決めたのか。本編は概要欄のリンクからどうぞ。
  亡くなった方々とご遺族に、敬意を払って作っています。
  https://youtu.be/i6YryMy_fHQ
