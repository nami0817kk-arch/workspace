title: "加藤清正｜記録はたった1行"
yt_title: "加藤清正の死を、その年の記録は、たった1行で書いた　病の名は無い　2年後の記事に出てくる「虚の病」"
description: |-
  1611年6月24日、加藤清正は熊本で亡くなりました。当時の記録『当代記』のその日の記事は「肥後国加藤肥後守死去」の1行だけで、病の名はありません。同じ月に亡くなった堀尾吉晴には「霍乱」と病名まで書いています。
  清正の病に触れるのは、2年後、1613年の記事です。浅野幸長の死を唐瘡（梅毒）と書いたあと、清正たちの死は「好色の故、虚の病」だという、と続けます。ただ、唐瘡の名が付いているのは幸長で、清正本人ではありません。
  本編では、のちの病名の説と、毒の話がいつ広まったのかを、記録ごとに並べています。本編は概要欄のリンクからどうぞ。
