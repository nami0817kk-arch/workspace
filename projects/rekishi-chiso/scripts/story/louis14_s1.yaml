  # fact: l14-ss-03
- 語り: "王を起こすのは、寝室で寝ていた第一侍従。同時に、医者の長の第一医師と、外科医の長が、部屋に入る。"
  shot: Drug
  tone: 重い
  pause: 0.12
  # fact: l14-et-01, l14-et-02
- 語り: "次が、大入室。大侍従長、第一侍従貴族の4人、王の庶子など、ごく少数だけだ。王は、まだ寝台にいる。"
