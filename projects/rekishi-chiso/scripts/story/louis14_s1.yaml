  pause: 0.12
  # fact: l14-et-02
- 語り: "役職のない人が、これを持つのは、ごく稀で、大きな恩賞か寵愛のしるしだった、とサン=シモンは書く。"
  shot: LeverC
  tone: しみじみ
  pause: 0.12
  # fact: l14-et-04
- 語り: "そのあと、秘書や読み役が続き、最後に、大勢が入る。"
  shot: LeverR
  tone: しみじみ
  pause: 0.12
  # fact: l14-et-05
- 語り: "ヴェルサイユ城研究センターのダ・ヴィニャは、このとき部屋に、100人を超える、と書く。ただし、数え方の根拠は、示されていない。"
  shot: LeverR
  tone: 重い
  pause: 0.12
  # fact: l14-et-05
- 語り: "研究者のガロは、1687年の名簿から、王がまだ寝台にいる段階だけで、40人を超える、と数えた。"
