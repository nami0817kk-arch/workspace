title: "ルイ14世｜朝8時、寝室に最初に入ったのは医者"
yt_title: "ルイ14世の寝室に、朝8時、最初に入ったのは医者だった　部屋の人は100人を超える、と研究者は数える"
description: |-
  朝8時、ルイ14世の寝室に、いちばん先に入ってくるのは、家来でも妃でもなく、医者でした。サン=シモンの本によると、王を起こすのは寝室で寝ていた第一侍従で、同時に、医者の長の第一医師と、外科医の長が部屋に入ります。
  そのあとに大入室が続きます。大侍従長、第一侍従貴族の4人、王の庶子など、ごく少数だけが、王がまだ寝台にいるうちに入れました。最後に大勢が入り、ヴェルサイユ城研究センターのダ・ヴィニャは、部屋に100人を超える、と書きますが、数え方の根拠は示されていません。研究者のガロは、1687年の名簿から、王が寝台にいる段階だけで40人を超える、と数えています。
  宮廷全体では、1722年の最初の公式な調べで、王から宿を割り当てられうる人が約7,000人、うち約4,000人が城の敷地の中でした。この数が、本当にルイ14世のころの数なのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/FqHUnnLL6JM
