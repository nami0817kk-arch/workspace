lines:
  # fact: l14-ss-03
- 語り: "朝8時。ルイ14世の寝室に、いちばん先に入ってくるのは、家来でも妃でもなく、医者だった、とサン=シモンは書く。"
  shot: LeverC
  tone: 強調
