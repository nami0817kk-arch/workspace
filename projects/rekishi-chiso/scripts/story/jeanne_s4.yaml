title: ジャンヌ・ダルク｜署名した紙は、記録と食い違う
yt_title: ジャンヌ・ダルクが署名した紙は何行だったか　記録は長文、立会人は6、7行
description: |-
  ジャンヌ・ダルクが署名した紙は、何行だったのか。裁判記録は長い文、立ち会った3人は「6、7行」などと言います。
  1431年5月24日、ルーアンの墓地で、ジャンヌは誓約書に十字を書きました。裁判記録に載る誓約の文は、罪を数え、男の服も悔いる長い文です。ところが、のちの復権のための調べで、修道院長のミジエ（1455年）は「主の祈りほどの長さ」、医師のラシャンブルと神学者のモネ（1456年）は「6、7行ほど」と証言しました。
  公証人のタケルは、今ある形の記録に整えられたのは、ジャンヌの死のずっとあとだと証言しています。読まれた紙と記録の文が同じものなのか、記録からは確かめられません。本編は概要欄のリンクからどうぞ。
