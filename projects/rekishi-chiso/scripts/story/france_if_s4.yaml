# 物語完結型ショート フランス革命（もしも）s4（2026-11-05）。本編 scripts/france-if-story.yaml（11/5 12:00 公開、https://youtu.be/0InK0OydYHM）から。切り口：1788年7月13日の雹の嵐と、同じ夏の国庫（第3章「金庫と空が同時に崩れた」）
# 形式は kurofune_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（F01〜F16）と実在の絵（paintings/france_*）。新しい絵は作らない。F14（遠くにエッフェル塔）・F04（偽の字）は使わない。
# 事実カード（dev/output/rekishi-chiso/research/フランス革命_facts_20261031.yaml）：france-if-40・41・42・43（本編の第3章の言い方のまま）
# ・計算のやり直し：1788年7月13日 → 1789年7月14日 は1年と1日（1788年の2月29日は7月13日より前なので、間の365日に閏日は入らない）。
#   1788年7月13日が日曜日なのは、科学アカデミーの報告の題（du dimanche 13 juillet 1788）と本編どおり。曜日も計算で確かめた（1789年7月14日が火曜で、その366日前）。
#   損失 24,962,093リーヴル → 約2500万リーヴル（本編どおり）。8月8日 → 8月16日 は8日後（本編どおり）。
# ・被害の村の数は報告の1039の小教区だけを言う（ル・ロワ・ラデュリの1059は言わない）。紙にした割合（カーライル・スタール夫人で割れる）は言わない。
# ・雹が革命を起こした、とは言わない（本編も言っていない）。最後は問いで閉じる。
# 理解テスト4問：
#   ①誰の話か：革命の前の年のフランスの畑と、国の金庫
#   ②いつ・どこで何が：1788年7月13日の日曜日、雹の嵐がフランスを横切った。1039の小教区が被害、損失は約2500万リーヴル
#   ③国は何をしたか：8月8日に全国三部会を翌年5月1日に開くと発表し、8月16日に国庫の支払いの一部を紙の証券にした
#   ④どうなったか：金庫と空が同じ夏に崩れた。もしも空が穏やかだったら、を問いで閉じる
title: 1788年の雹｜バスティーユのちょうど1年と1日前、空から降ってきたもの
yt_title: バスティーユのちょうど1年と1日前、フランスに雹が降った　1039の小教区を打った1788年7月13日
description: |-
  バスティーユが落ちる、ちょうど1年と1日前。フランスの空から、雹が降りました。
  1788年7月13日、日曜日。雹の嵐が、フランスを横切ります。科学アカデミーが3人の学者に調べさせた報告では、分かっているだけで、被害を受けたのは1039の小教区、損失は約2500万リーヴル。1か所に雹が降っていたのは、7分から8分でした。8月8日、国王の政府は、全国三部会を翌年の5月1日に開くと発表します。その8日後の8月16日、国庫の支払いの一部が、現金ではなく、利子の付く紙の証券に変えられました。
  国の金庫と空が、同じ夏に崩れた年。この1年を、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
