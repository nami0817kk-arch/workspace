  shot: I09_6
  tone: しみじみ
  pause: 0.12
  # fact: edo-33
- 語り: "一方、東京都立図書館は、当時の江戸の人口を、正確に見積もるのは難しい、とする。1800年代の初めの比べとして載せるのは、江戸が90万、ロンドンが86万だ。"
