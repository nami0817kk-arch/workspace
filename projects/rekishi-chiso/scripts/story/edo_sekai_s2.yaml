lines:
  # fact: edo-32, edo-34
- 語り: "1700年ごろの江戸は、ロンドンやパリより、大きな町だったのか。"
  shot: I09_1
  tone: 強調
  pause: 0.12
  # fact: edo-34, edo-36
- 語り: "1700年のロンドンは、イギリスの歴史人口学者、リグリーの推計で、およそ57万5千人。パリは、50万人あまりとされる。"
  shot: I12_2
  tone: しみじみ
  pause: 0.12
  # fact: edo-32
