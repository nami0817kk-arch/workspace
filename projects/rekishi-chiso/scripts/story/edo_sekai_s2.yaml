# 物語完結型ショート 江戸時代、世界はどうだった？ s2（2026-11-19）。本編 scripts/edo-sekai-story.yaml（11/24 12:00 公開予定、https://youtu.be/z6k-XcWaAq0）から。11/25 11:00 に予約。
# 形式は ii_s1〜s5・uesugi_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は本編の # fact:（事実カード 江戸の世界くらべ_facts_20261119.yaml）だけ。
# 絵：本編の AI 絵（out/story/edosekai/main/）の切り出しだけ。I14（江戸の呉服の大店）は本編で使っていない絵。新しい絵は作らない。
# 切り口：1700年ごろの江戸・ロンドン・パリの人口（本編 第3章、edo-32・33・34・36）。
# hook＝江戸はロンドンやパリより大きかったのか（答えはこのショートの中：100万の半分は武家の推計。ハンレーは大きかったと書き、都立図書館は難しいとする）。
# tease＝150年後、江戸とロンドンはどうなっていたのか（答えは本編 第5章：1851年のロンドン236万、江戸の2倍あまり、edo-90）。
# 計算：1700→1851＝151年→「およそ150年後」。
# 理解テスト：①1700年ごろの江戸の町の大きさの話 ②ロンドン57万5千・パリ50万あまり、江戸は100万と言われてきた ③100万の中身は町人50万（1721年の調べ）＋武家50万（推計） ④ハンレーは大きかったと書き、都立図書館は正確には難しいとする
title: "元禄の江戸｜ロンドンより大きかった？"
yt_title: "1700年ごろの江戸は100万人、ロンドンは57万5千人　ただし江戸の半分は武家の推計　数え方を見ると世界一の町かはどうなる"
description: |-
  1700年のロンドンは、リグリーの推計でおよそ57万5千人。パリは50万人あまりとされます。江戸は、およそ100万人と言われてきました。
  ただ、その中身は、1721年の調べで町人がおよそ50万人。残りの50万人は、武士とその家族の推計です。アメリカの研究者ハンレーは、1700年の江戸はどのヨーロッパの町より大きかったと書き、東京都立図書館は、正確に見積もるのは難しいとしています。
  本編では、家康から慶喜までの260年を、同じ年の世界と並べています。本編は概要欄のリンクからどうぞ。
