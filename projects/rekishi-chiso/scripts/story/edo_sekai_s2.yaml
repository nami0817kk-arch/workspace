  shot: I14_4
  tone: しみじみ
  pause: 0.12
  # fact: edo-32
- 語り: "残りの50万人は、武士とその家族の推計だ。内閣府の報告書も、その50万人を、どう数えたのかは書いていない。"
  shot: I01_5
  tone: 重い
  pause: 0.12
  # fact: edo-34
