# 理解テスト4問：①九条道家と息子の良実（二条家の祖） ②1246年に関白を弟に譲らされ、1250年に財産を渡さない文書、2年後に子孫と認めない文書 ③道家は幼いころから良実を疎んじたと三田武繁さんは書く ④二条家は初代の関白から2人目の摂関まで45年待たされた。次は五つの家がそろった年（本編3章）
title: "藤原道長の子孫｜子孫とは認められなかった息子"
yt_title: "「自分の子孫とは認めない」と父に言われた息子が二条家の祖になった　九条道家と良実"
description: |-
  九条家の道家は、子の頼経を、1226年、数えで9歳で、鎌倉幕府の将軍にしました。一方で、のちに二条家の祖となる息子の良実を、幼いころから疎んじた、と三田武繁さんは書いています。
  1246年、良実は、関白の座を弟に譲るよう、道家に強いられました。1250年、道家は惣処分状で、良実の子孫には財産を渡さない、と定め、その2年後には、良実を自分の子孫とは認めない、という文書まで作ります。その良実の家が、二条家です。初代の良実が1242年に関白になってから、2人目の摂関が出たのは1287年、45年待たされました。
  では、五つの家が、そろったのは、いつなのか。本編は概要欄のリンクからどうぞ。
