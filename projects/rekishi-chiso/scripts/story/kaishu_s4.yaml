# 切り口：静岡へ移した「八万人」（本編第1章）。談話の八万人・解難録の3万3千4百余家・閏4月の37〜38万人。単位が違うので優劣はつけない。
# 計算：数は引用のみ（計算なし）。
# 理解テスト4問：①勝海舟の静岡移住の話 ②勝は旧旗本を静岡へ移したのは約八万人と語った。十日→二十日の猶予、汽船二艘 ③解難録では総員3万3千4百余家、閏4月の書では37〜38万人。単位が違うが数は大きく動く ④金庫は金の分銅一つ。その後に頼った先は本編（諸家の助成・約9万7千5百両）
# 本編の弱点：八万人は談話（旗本移転後の始末）、3万3千4百余家は解難録、37〜38万人は閏4月13日の書。どれが正しいとは言わない。tease の答え（万石以上の諸家への助成）は本編第1章。
title: "勝海舟｜静岡へ移したのは、本当に八万人か"
yt_title: "勝海舟が静岡へ移した旧旗本は「八万人」と語ったが　海舟自身の記録では3万3千余家、37万人とも"
description: |-
  勝海舟は後年、旧旗本を静岡へ移したのは「凡そ八万人」で、政府の十日の注文に二十日の猶予を願い、汽船二艘で運んだと語っています。移して3日か4日で沢庵漬がなくなり、「おれも実に狼狽したよ」とも。
  ところが、『解難録』には、新政府に命じられて調べた旗本・御家人の総員は3万3千4百余家とあり、1868年閏4月13日の田安殿への書には、子弟・使用人まで含めて飢える者は37万人か38万人を下らない、とあります。数えるものが違うため、同じ物差しでは比べられません。
  談話は青空文庫・NDLデジタル（海舟全集）、解難録・日記も海舟全集の翻刻（OCR）で確かめました。
  空の金庫を前に、海舟が頼った先はどこだったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/KIXtgjggYl0
