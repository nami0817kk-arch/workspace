lines:
  # fact: kaishu-A01
- 語り: "勝海舟は、旧旗本を静岡へ移したのは、およそ八万人だった、と語っている。"
  shot: Exodus
  tone: 強調
  pause: 0.12
  # fact: kaishu-A01
- 語り: "政府は、十日で移せと言った。海舟は、二十日の猶予を願い、汽船二艘で運んだ。"
  shot: Port
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-A02
- 語り: "移して3日か4日で、沢庵漬がなくなった。4日か5日で、ちり紙もなくなり、おれも実に狼狽したよ、と語る。"
  shot: Shizu
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-A01
- 語り: "では、八万人は、本当なのか。"
  shot: Ledger
  tone: 疑問
  pause: 0.15
  # fact: kaishu-A04
- 語り: "1868年、新政府に命じられて海舟が調べた旗本・御家人の総員は、3万3千4百余家。"
  shot: Beato
  tone: 重い
  pause: 0.12
  # fact: kaishu-A07
- 語り: "同じ年の閏4月、田安殿への書には、子弟や使用人まで含めて、飢える者は、37万人か38万人を下らない、と書いた。"
  shot: Hall
  tone: 重い
  pause: 0.12
  # fact: kaishu-A07
- 語り: "数えているものが違うので、同じ物差しでは比べられない。それでも、海舟自身の記録のなかで、数は大きく動く。"
  shot: ShizuL
  tone: しみじみ
  pause: 0.12
  # fact: kaishu-A13
- 語り: "しかも、徳川家の金庫には、金の分銅が、一つあるだけだった、と海舟は書く。"
  shot: Chest
