title: "ハプスブルク｜「結婚せよ」の句を言ったのは誰か"
yt_title: "「他の者は戦え、幸いなるオーストリアよ、結婚せよ」　この有名な句を、最初に言った人は分かっていない　1490年に亡くなった王の言葉とされてきた"
description: |-
  「他の者は戦え、幸いなるオーストリアよ、結婚せよ」。ハプスブルク家を語るとき、必ず引かれる句は、ハンガリー王マティアス・コルヴィヌスの言葉だと伝えられてきました。
  けれど、マティアスが亡くなったのは1490年。句が語る1496年の結婚は、その6年後、1515年の婚約は25年後です。イタリアの名言辞典は、その帰属を誤りと注記し、オーストリア・フォーラムは、史料に出てくるのは17世紀だと書きます。
  では、この家を大きくした、いちばん大きな結婚の花婿は、何歳だったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/RnyhC0Qyirs
