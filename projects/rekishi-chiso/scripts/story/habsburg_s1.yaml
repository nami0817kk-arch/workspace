lines:
  # fact: habs-12
- 語り: "「他の者は戦え、幸いなるオーストリアよ、結婚せよ」。ハプスブルク家を語るとき、必ず引かれる句は、誰の言葉なのか。"
  shot: H02_1
  tone: 強調
  pause: 0.12
  # fact: habs-11
- 語り: "昔から、ハンガリー王、マティアス・コルヴィヌスの言葉だと、伝えられてきた。"
  shot: C11_2
  tone: しみじみ
  pause: 0.12
  # fact: habs-11
- 語り: "けれど、マティアスが亡くなったのは、1490年。1496年の結婚は、その6年後。1515年の婚約は、25年後のことだ。"
  shot: C12_3
  tone: 重い
  pause: 0.12
  # fact: habs-11
- 語り: "イタリアの名言辞典『誰が言ったか』は、マティアスの言葉としたうえで、その帰属は誤りだ、と注記する。"
  shot: C03_4
  tone: しみじみ
  pause: 0.12
  # fact: habs-11
- 語り: "オーストリア・フォーラムは、マティアス説も、マクシミリアン説も、あとの時代の当てはめだと書く。史料に出るのは、17世紀。"
  shot: C15_5
  tone: しみじみ
  pause: 0.12
  # fact: habs-11
- 語り: "完全な対句の形が確かめられるのは、1718年、アウクスブルクで出た本まで下る、とする資料もある。"
  shot: C16_6
  tone: しみじみ
  pause: 0.12
  # fact: habs-12
- 語り: "公式解説サイトも、この句は単純化だと言う。戦争も、結婚と同じくらい、大切だった、と。"
  shot: C02_7
  tone: しみじみ
  pause: 0.12
  # fact: habs-11
- 語り: "最初に、この句を言った人は、分かっていない。"
  shot: C12_8
  tone: 重い
  pause: 0.12
  # fact: habs-13
- 語り: "では、いちばん大きな結婚の、花婿は、何歳だったのか。"
  shot: C04_9
  tone: 疑問
  pause: 0.15
