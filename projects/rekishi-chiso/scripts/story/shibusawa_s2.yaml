# hook＝駿府の再会は何時だったか（答えはこのショートの中：日記は23日の10時ごろ、『雨夜譚』は翌々日の夕方、昭和5年の談話は夜）。
# tease＝なぜ慶喜は渋沢を水戸の昭武のもとへ行かせなかったか（答えは本編 第2章：大久保一翁が明かした慶喜の配慮。shibusawa-22）。
# 暦：明治元年12月は旧暦（12月19日＝1869年1月31日、23日＝2月4日）。季節は言わない。「いま」の札は和暦で書く（西暦の年は 1869）。
# 数え直し：明治元年12月（1869）→『雨夜譚』明治20年（1887）＝18年後。→ 昭和5年（1930）＝61年後。
# 理解テスト：①渋沢栄一と旧主・徳川慶喜の再会の話 ②明治元年12月、パリから戻った渋沢が、駿府の宝台院で慶喜に会った
#   ③記録ごとに時刻が違う：日記は23日の10時ごろ、18年後の『雨夜譚』は夕方、61年後の談話は夜。慶喜は「愚痴を聞くために会ったのではない」
#   ④再会のあと、慶喜は渋沢を駿府に留めた
title: "渋沢栄一｜記録で変わる再会"
yt_title: "渋沢栄一と徳川慶喜、駿府の寺での再会は何時だったのか　日記は10時ごろ、61年後の談話では夜になっていた"
description: |-
  明治元年の12月、パリから戻った渋沢栄一は、駿府（のちの静岡）の宝台院で、謹慎していた旧主・徳川慶喜と再会しました。
  渋沢の日記には、23日の10時ごろ宝台院へ参り、お目にかかったとあります。ところが、18年後の明治20年に語った『雨夜譚』では、着いた翌々日の夕方。61年後、昭和5年の『竜門雑誌』の談話では、夜になり、行灯のそばに慶喜が現れて、「今日は、そんな愚痴を聞くために会ったのではない」と言います。
  年を経た語りほど、同じ再会が、くわしく、劇的になっていきます。どれも渋沢の側から見た場面です。月日は当時の暦（旧暦）のままです。
  本編では、この再会から、慶喜の伝記に渋沢がかけた年月を、記録の順にたどっています。本編は概要欄のリンクからどうぞ。
