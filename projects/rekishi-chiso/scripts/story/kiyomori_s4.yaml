title: "福原遷都｜還都の日程は、2日で縮んだ"
yt_title: "福原遷都から京へ戻る日程は、2日で書き換えられた　出発は3日、入京は6日早まった　延暦寺・富士川・宗盛の口論"
description: |-
  1180年10月20日、延暦寺の衆徒が、遷都を止めよという奏状を出した、と玉葉は伝聞で書きます。同じ日、駿河の富士川で、平氏の維盛らが陣を張りました。11月5日の玉葉には、清盛の子の宗盛が還都を示し、清盛と口論になった、とあります。
  11月19日の玉葉は、26日出発、12月2日入京、と伝えます。2日後の21日には、23日出発、26日入京に縮められました。出発は3日、入京は6日の前倒しです。
  京へ戻った日、兼実は何と書き留めたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SmAJSk6zrYk
