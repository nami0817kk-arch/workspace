  C03:
    scene: 薄暗い洞窟の奥。石の台に積まれたパピルスの巻物の束がランプの灯りに浮かぶ（人物なし、文字は描かない）
    pan: h
    crops: *id001
  C04:
    scene: 古代エジプトの木造の帆船が、朝のナイル川で白い石灰岩のブロックを積んで進む（4500年前のエジプト、遠景、乗員は小さな後ろ姿）
    pan: h
    crops: *id001
  C05:
    scene: 白い石灰岩の採石場。切り出された大きな石のブロック、砂ぼこり、遠くに小さな作業員の後ろ姿の列（昼）
    pan: h
    crops: *id001
  C06:
    scene: ナイル川の運河の船着き場。木の船が並び、白い石のブロックが岸に積まれている（古代エジプト、昼、遠景）
    pan: h
    crops: *id001
  C07:
    scene: 机の上のパピルスの巻物と葦のペン、黒インクの壺、ランプの光のクローズアップ（人物なし、文字は描かない）
    pan: h
    crops: *id001
  C08:
    scene: 紅海の青い海に突き出た石の突堤と、岸に並ぶ丸い大きな石の錨（古代の港の遺跡、朝、人はいない）
    pan: h
    crops: *id001
  C09:
    scene: 古代ギリシャの外套を着た旅人の小さな後ろ姿が、夕暮れの大ピラミッドを見上げている（遠景、案内人の影が隣に）
    pan: h
    crops: *id001
  C10:
    scene: 建設中の大ピラミッドの遠景。石の斜面と木の足場、石を橇で引く小さな人影の長い列（昼、人物の顔は見えない）
    pan: h
    crops: *id001
  C11:
    scene: 濡れた砂の上を、石を載せた橇を縄で引く人々の列。先頭の人が砂に水を注ぐ（古代エジプト、遠景、後ろ姿）
    pan: h
    crops: *id001
  C12:
    scene: 泥レンガの建物の中にパンを焼く石の窯がいくつも並び、湯気が上がっている（古代エジプト、人物なし）
    pan: h
    crops: *id001
  C13:
    scene: 泥レンガの低い家並みが広がる古代エジプトの労働者の町の全景。夕暮れ、遠くに大ピラミッド（人は小さな点）
    pan: h
    crops: *id001
  C14:
    scene: 円形の泥レンガの穀物倉庫（サイロ）が並ぶ敷地。麦の山、砂色の空（人物なし）
    pan: h
    crops: *id001
  C15:
    scene: 砂漠の高台に、日干しレンガの低い墓が並ぶ。遠くに大ピラミッド、夕景（人物なし、遺体は描かない）
    pan: h
    crops: *id001
  C16:
    scene: 発掘現場。筆で砂を払う手元と、土器のかけら（人物は手元だけ、昼）
    pan: h
    crops: *id001
  C17:
    scene: アスワンの赤みがかった花崗岩の採石場。ナイル川の岸に大きな岩のブロック（夕景、人はいない）
    pan: h
    crops: *id001
  C18:
    scene: 砂漠の中を細く流れる古いナイルの支流を上から見た景色。青い水路と緑の帯、遠くにいくつものピラミッド
    pan: h
    crops: *id001
  C19:
    scene: 白い石の採石場の斜面に刻まれた坂道と、その両側の階段、等間隔の丸い柱穴（古代の採石場、夕景、人物なし）
    pan: h
    crops: *id001
  C20:
    scene: 積みかけの大ピラミッド。木の足場と石の斜面、小さな作業員の後ろ姿が遠くに見える（昼）
    pan: h
    crops: *id001
  C21:
    scene: ピラミッドの外側をらせん状にのぼる土と石の坂道（想像図風、昼、遠景、人物は小さな点）
    pan: h
    crops: *id001
  C22:
    scene: ピラミッドの内部の通路。石の壁、細長い天井、ランプの光（人物なし、文字は描かない）
    pan: h
    crops: *id001
  C23:
    scene: 満天の星空の下の大ピラミッドのシルエット。静かな夜（人物なし）
    pan: h
    crops: *id001
  C24:
    scene: 暗い博物館の展示室で、ガラスのケースの中の古いパピルスの断片にスポットライトが当たる（文字は読めない形、人物なし）
    pan: h
    crops: *id001
  C25:
    scene: 古代エジプトの墓の石灰岩の壁に刻まれた、大きな像を載せた橇を人々が引く場面の壁画（様式化された浅いレリーフ、顔の細部なし、文字なし）
    pan: h
    crops: *id001
  H01:
    scene: 夜明けのギザの大ピラミッド。砂漠の遠景、金色の朝日、静かな空気（古王国の時代の姿。外側の白い石灰岩の化粧石がまだ残る滑らかなピラミッド）
    pan: h
    crops: *id001
  YEND:
    scene: 夜明けの砂漠と空の遠景（終了画面、右半分に余白）
    pan: h
