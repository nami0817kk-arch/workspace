title: "天樹院｜将軍家光の姉として過ごした江戸の日々"
yt_title: "千姫は江戸で、将軍家光の姉として何をしていたのか　天然痘の見舞い・綱重の養子・形見の1万両"
description: |-
  1626年、2人目の夫を亡くした千姫は江戸に戻り、髪を下ろして天樹院と名乗りました。住まいは江戸城の北の丸、竹橋の御殿。将軍は、弟の家光です。
  1635年の正月、天樹院が天然痘に倒れると、家光は自分で見舞いに行きました。1644年に生まれた家光の子・のちの綱重は、言い習わしから天樹院の養子になったと記録にあります。
  1651年に家光が亡くなると、形見として天樹院には金1万両。ほかの女性たちは5千両ずつでした。
  本編では、天樹院がその力を誰のために使ったのか、そして亡くなった年が記録でどう分かれるかまでたどっています。本編は概要欄のリンクからどうぞ。
