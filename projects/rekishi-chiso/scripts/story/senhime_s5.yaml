# 切り口：江戸に戻った天樹院は、弟の将軍・家光にとってどんな姉だったか（本編 第3章、senhime-28・29・30・31・32・34・33）。
# 計算（数え直した）：千姫 1597生→1635＝数え39。家光 1604生→1645＝数え42（厄年）。綱重 1644生→1645＝数え2。
