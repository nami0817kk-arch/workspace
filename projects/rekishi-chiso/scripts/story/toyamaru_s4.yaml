title: "洞爺丸｜無線から、SOSまで1時間14分"
yt_title: "洞爺丸　21時25分の無線から、SOSまでは1時間14分だった　運航管理の側は重大とは受け取らなかったと裁決の英訳が書く"
description: |-
  21時25分ごろ、洞爺丸から無線が入ります。エンジンが、止まりつつある。突風55メートル。国鉄の無線の記録によるものです。
  裁決の英訳によれば、運航管理の側は、これを重大な事故とは受け取らず、上司に直ちには報告しませんでした。この連絡から、SOSまで1時間14分。巡視船の到着は、SOSから1時間51分後でした。
  座礁の時刻は、22時26分と22時30分。記録によって、違います。
  裁決は、この夜の責任を、誰に求めたのか。本編は概要欄のリンクからどうぞ。
  亡くなった方々とご遺族に、敬意を払って作っています。
  https://youtu.be/i6YryMy_fHQ
