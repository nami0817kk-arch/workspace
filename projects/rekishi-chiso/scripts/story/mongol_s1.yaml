# 物語完結型ショート モンゴル s1（2026-11-07）。本編 scripts/mongol-if-story.yaml（11/10 12:00 公開）の序章・第1章の頭（ニシン・タタールの呼び名）から。11/11 9:00 公開。
# 形式は columbus_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。「もしも」の部分は入れない（事実だけ）。
# 絵は本編の AI 絵（out/story/mongol-if/main/、Gemini）と本編で使った実在の絵（『聖ヘドヴィヒ伝』）だけ。新しい絵は作らない。
# 切り口：1238年、イングランドでよいニシンが40〜50匹で銀貨1枚。ゴットランドやフリースラントの人々がモンゴルを恐れてヤーマスへ船を出さなかった（マシュー・パリス『大年代記』）。
#   本編の答え（東の軍は何人いたのか＝第1章）は言わない。
# 事実カード（dev/output/rekishi-chiso/research/モンゴル_facts_20261106.yaml）：mongol-12・07・13・01・02。言い方は本編のまま。
# 計算（自分で計算し直した）：1241−1238＝3年。4月9日（レグニツァ）→11日（モヒ）＝3日のあいだ。
# 理解テスト4問：
#   ①誰の話か：1238年のイングランドのニシン（と、それを書いた修道士マシュー・パリス）
#   ②いつ・どこで何が：1238年、ヤーマスにいつもの船が来ず、よいニシンが40〜50匹で銀貨1枚になった
#   ③なぜか：ゴットランドやフリースラントの人々が、東の騎馬の軍モンゴル（タタール）を恐れて船を出さなかった
#   ④どうなったか：3年後の1241年4月、その軍は3日のあいだにポーランドとハンガリーで勝つ。何人いたのか、の問いで閉じる（答えは本編の第1章）
title: 1238年｜ニシンが投げ売りされた年
yt_title: 1238年、イングランドのニシンが投げ売りされた　40匹か50匹で銀貨1枚、北の人々が東の軍を恐れて船を出さなかった
description: |-
  1238年、イングランドで、よいニシンが40匹か50匹で銀貨1枚になりました。
  いつもの年なら、ニシンの季節には、ゴットランドやフリースラントの人々が、船で港町ヤーマスへ来ていました。その年、彼らは、ある軍を恐れて来なかったのです。イングランドの修道士マシュー・パリスが『大年代記』に書きとめています。
  恐れられていたのは、はるか東の騎馬の軍、モンゴルでした。マシュー・パリスは、1238年の項で、タル川から来たのでタタールと呼ぶ、と説明し、1240年の項では、地獄タルタロスから放たれた悪魔のように、と書いています。
  3年後の1241年4月、その軍は、3日のあいだに、ポーランドとハンガリーで2つの大きな戦に勝ちました。
  恐れられた東の軍は、何人いたのか。本編は概要欄のリンクからどうぞ。
