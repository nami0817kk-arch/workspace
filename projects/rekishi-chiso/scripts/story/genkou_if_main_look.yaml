  1: {label: 第1章 博多湾の元軍は、何を見たのか, now: 1274年10月,
      dates: {27: null}}
  2: {label: 第2章 石を積め　博多湾の石の壁, now: 1275年4月,
      dates: {33: 1276年3月, 37: null, 39: null}}
  3: {label: 第3章 3500隻か、4400隻か、9000隻か, now: 1281年,
      dates: {46: 1279年, 48: 1281年}}
  4: {label: 第4章 台風は、本当に吹いたのか, now: 1281年8月,
      dates: {59: null}}
  5: {label: 第5章 海の底から出てきた船, now: null,
      dates: {}}
  6: {label: 第6章 台風がなかったら、何が言えるのか, now: null,
      dates: {}}
  7: {label: 第7章 恩賞が、足りない　竹崎季長の直訴, now: 1275年,
      dates: {116: 1285年, 118: 1297年, 121: null}}
  8: {label: まとめ 台風が来なかったら、何が言えるのか, now: null,
      dates: {}}

