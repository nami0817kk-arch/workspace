# 物語型の本編（横 16:9）の見た目と絵の割り当て：元寇（scripts/genkou-if-story.yaml）。chiso/storymain.py が読む。
# 10-30 作成（11/3 12:00 公開）。yoritomo_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（G01〜G15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵にほとんど描かない（海・浜・石の壁・船影の遠景。G13・G14 だけ小さな後ろ姿の影）。実在の絵『蒙古襲来絵詞』（竹崎季長の依頼で作られた絵巻。パブリックドメイン）は額（frame:）と絵図の一部（part:）。
#   絵詞の模写（1846年、福田太華、東京国立博物館蔵）は元軍の船の絵。竹崎季長が戦う場面は絵詞そのものの一部。
#   この回の決まり：戦闘・負傷・遺体は描かない。実在の誰か・俳優に似せない。文字・紋・旗を描かせない。顔が分かるのは実在の絵だけ。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/genkou_ai_images.md
# 届く前は art_dir の仮の絵（G01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に G01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「G01（仮）」と場面を書いて作り直す。
script: scripts/genkou-if-story.yaml
out: genkou_if_story_main
art_dir: out/story/genkou-if/ph          # 仮の絵（placeholder）
main_art_dir: out/story/genkou-if/main   # Gemini の 16:9 の絵（G01.jpg〜G15.jpg）
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

# 章ごとの左上の札「いま｜章題」。台本の語りは年が混じるので、語りが言った形のまま。
# dates＝語りがその年・月日を言った行から替える（研究・報告・展示・報道の年は物語の「いま」ではないので替えない。null で章題だけ）
