title: "福原遷都｜大嘗会の延期の、5日後"
yt_title: "福原遷都　1180年8月12日、大嘗会は来年へ延期　その5日後、伊豆で頼朝が兵を挙げた　福原は都か、離宮か"
description: |-
  1180年8月12日、上皇の御所の会議で、大嘗会は来年に延ばす、と決まりました。大嘗会は、天皇が即位したあとに行う最初の大きな祭りです。高橋昌明さんは、遷都か離宮かの争いは、大嘗会を福原でやるか、京でやるかで激しくなった、と書きます。
  その5日後の8月17日、伊豆で頼朝が兵を挙げます。8月29日、福原は今は離宮、と経房は兼実に語りました。
  福原は、都だったのか、離宮だったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SmAJSk6zrYk
