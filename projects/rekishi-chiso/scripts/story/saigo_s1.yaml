# 本編の弱点（JACAR は翻刻のみで原画像未確認・二次引用あり）：言えること＝「読めた電報の翻刻に〜とある」、言えないこと＝洞窟を出た時刻・倒れた場所・最期の言葉の形・首を隠した者・切腹か介錯か。断定しない。
# 切り口：死んだその日の電報の言葉（本編序章）。山縣＝斃す、東伏見＝打ち取り・自殺。saigo-01, saigo-02。
# 理解テスト4問：①西郷隆盛 ②1877年9月24日、城山の戦いの当日に官軍が打った電報 ③山縣参軍は「斃す」、東伏見少将は西郷を「打ち取り」、桐野・別府・逸見は「自殺」と書き分ける。読めた翻刻に切腹・介錯の語は見当たらない ④西郷が誰の手で命を落としたかは、この電報だけでは決まらない（本編へ）
title: "西郷隆盛｜死んだ日の電報に切腹の語はない"
yt_title: "西郷隆盛の死を伝えた電報に「切腹」の語はない　山縣有朋は「斃す」、東伏見少将は「打ち取り」"
description: |-
  西郷隆盛の死を伝える電報に、切腹の二文字は見当たりません。1877年9月24日、城山の戦いの日に官軍が打った電報です。
  参軍の山縣有朋は、午前8時に戦いが収まったと伝え、「西郷桐野以下ヲ斃ス」と書きました。東伏見少将は、西郷は「我手ニテ打取リ」、桐野・別府・逸見らは「自殺」と書き分けています。読めた電報の翻刻に、切腹、介錯の語はありません。
  電報・日記は、アジア歴史資料センターの内容欄の翻刻を読んだもので、原画像までは確かめていません。翻刻には誤字や欠けがあります。切腹だったのかどうかは、この電報だけでは言えません。
  西郷は、誰の手で、命を落としたのか。本編は概要欄のリンクからどうぞ。
