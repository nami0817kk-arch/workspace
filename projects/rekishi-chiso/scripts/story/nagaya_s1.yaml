lines:
  # fact: nagayaif-24
- 語り: "江戸の長屋の家賃は、ひと月で、大工の日当の、2日分にも足りなかった。"
  shot: B01_1
  tone: 強調
  pause: 0.12
  # fact: nagayaif-01
- 語り: "時は文政のころ。場所は、江戸の町人地の、裏長屋。部屋は九尺二間と呼ばれ、台所まで入れて、畳6畳分の広さだった。"
  shot: B02_2
  tone: しみじみ
  pause: 0.12
  # fact: nagayaif-24
- 語り: "文政年間漫録という江戸の書き物に、ある大工が語った、1年の稼ぎと出費が残っている。"
  shot: B03_3
  tone: しみじみ
  pause: 0.12
  # fact: nagayaif-24
- 語り: "手間賃は、1日に銀4匁2分。飯米料の1匁2分と合わせて、日当は5匁4分。"
  shot: B03_4
  tone: しみじみ
  pause: 0.12
  # fact: nagayaif-24
- 語り: "店賃は、1年に銀120匁。ひと月にすると、10匁。大工の日当の、2日ぶんにも、足りない。"
  shot: B05_5
  tone: 強調
  pause: 0.12
  # fact: nagayaif-41
- 語り: "今の目安で、日当を1万円とすると、ひと月の店賃は、およそ1万8500円だ。"
  shot: B06_6
  tone: しみじみ
  pause: 0.12
  # fact: nagayaif-24
- 語り: "出費の中で、店賃は、わずか8%。いちばん重かったのは、「塩」「醤油」。「味噌」「油」。「薪と炭」。これだけで、46%。"
  shot: B20_7
  tone: 重い
  pause: 0.12
  # fact: nagayaif-24
- 語り: "1年働いて、この大工の家に残ったお金は、日当の、14日分ほどだった。"
  shot: T01_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第1章（nagayaif-06）
