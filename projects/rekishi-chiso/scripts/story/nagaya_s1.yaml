title: "江戸の長屋｜家賃は日当の2日分足らず"
yt_title: "江戸の長屋の家賃は、ひと月で大工の日当の2日分足らず　出費のたった8%なのに、1年で残ったのは日当の14日分ほど"
description: |-
  文政のころの江戸の裏長屋。文政年間漫録に残る、ある大工の1年の家計では、店賃は1年に銀120匁、ひと月にすると10匁でした。大工の日当は5匁4分。ひと月の家賃は、日当の2日分にも足りません。
  出費の中で、店賃はわずか8%。いちばん重かったのは「塩」「醤油」「味噌」「油」「薪と炭」で46%。1年働いて残ったお金は、日当の14日分ほどでした。
  本編では、水・トイレ・お風呂・食べ物・灯りまで足して、江戸の長屋の1か月がいくらだったかを積み上げています。本編は概要欄のリンクからどうぞ。
