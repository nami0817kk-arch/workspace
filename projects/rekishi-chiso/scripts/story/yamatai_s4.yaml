# 物語完結型ショート 邪馬台国はどこ？ s4（2026-11-07）。本編 scripts/yamatai-story.yaml（11/10 19:00 公開、https://youtu.be/cqLK1qEXpMw）の第5章（墓）から。11/11 17:30 公開。
# 形式は shogun_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（Gemini）。新しい絵は作らない。
# 切り口：247年の記事のあとの「卑弥呼以死、大作冢、径百余歩」、男王の乱と13歳の壹与、箸墓の大きさと2009年の年代。
#   墓の点・順位には触れない。本編の答え（採点の1位・浮かび上がる場所）は明かさない。tease の答えは第6章（住まい：吉野ヶ里と纒向の建物）。
# 事実カード：yamatai-26・17・40・41。言い方は本編のまま。「箸墓に葬られたのは誰か、言い切れない」はまとめの章のまま。
# 理解テスト4問：
#   ①誰の話か：卑弥呼の死と、その墓
#   ②いつ・何が：247年、倭が狗奴国との争いを魏に訴えた記事のあとに、卑弥呼の死と径百余歩の塚、奴婢百人あまり
#   ③そのあと：男の王で殺し合いになり、13歳の壹与を立てて治まった
#   ④どうなっているか：奈良の箸墓古墳は後円部約165m、2009年に築造直後240〜260年と発表。葬られた人は言い切れない
title: 卑弥呼｜死んだとき、どんな墓が造られたのか
yt_title: 卑弥呼が死んだとき、どんな墓が造られたのか　『魏志倭人伝』の「径百余歩」と、奈良の箸墓古墳
description: |-
  卑弥呼が死んだとき、どんな墓が造られたのでしょうか。
  正始8年、247年。倭は帯方郡に使いを送り、南の狗奴国と攻め合っていると訴えました。その記事のあとに、『魏志倭人伝』は書きます。卑弥呼、以て死す。大いに塚を作る。径、百余歩。奴婢、百人あまりが、ともに葬られた。男の王を立てると国中が従わず殺し合いになり、卑弥呼の一族の娘、13歳の壹与を王に立てると、国はようやく治まりました。奈良県桜井市の箸墓古墳は、文化庁の解説では墳丘の長さ290メートル前後、丸い後円部の直径は約165メートル。2009年、国立歴史民俗博物館は炭素14の測定から、築かれた直後を240年から260年と発表しました。
  では、魏志が書いた女王の住まい、宮室と楼観と城柵。その跡は、九州と奈良の、どちらから出ているのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#卑弥呼', '#邪馬台国', '#日本史']
ai_images: true
ai_disclosure: この動画の情景・人物の画像は、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真や肖像ではありません（画面に「AI生成画像」と出しています）。古墳の画像も、実際の箸墓古墳を写したものではありません。卑弥呼の姿も、特定の資料を写したものではありません。
