title: "ポンペイ｜壁の炭の字「10月17日」に、年はない"
yt_title: "ポンペイの家の壁に炭で書かれた「10月17日」　2018年の発見で「歴史を書き換えている」と言われたが、年は書かれていない"
description: |-
  2018年、ポンペイの家の壁から、炭で書いた日付が見つかりました。11月のカレンダエの16日前、つまり10月17日です。
  ポンペイ考古公園は、炭の字は長くもたないと考え、噴火の1週間前に書かれた可能性が高い、噴火は10月24日だったという説を後押しする、と発表しました。文化大臣は「今日、私たちは歴史を書き換えている」と述べています。
  ところが、この炭の字には、月と日しか書かれていません。8月24日を伝える手紙にも、79年という年は書かれていません。
  本編では、写本・秋の手がかり・炭の落書き・2024年の考古公園の試しを並べ、言えることと言えないことを分けています。本編は概要欄のリンクからどうぞ。
