lines:
  # fact: pom-42, pom-57
- 語り: "2018年、ポンペイの家の壁から、炭で書いた10月17日の日付が見つかった。ところが、年は書かれていない。"
  shot: P14_1
  tone: 強調
  pause: 0.12
  # fact: pom-56
- 語り: "発表は、2018年10月。ポンペイ考古公園の所長、マッシモ・オザンナが、文化大臣の訪問の場で伝えた。"
  shot: P13_2
  tone: しみじみ
  pause: 0.12
  # fact: pom-59
- 語り: "場所は、庭の家と呼ばれる家。入り口に近い広間、アトリウムの壁とされる。"
  shot: P11_3
  tone: しみじみ
  pause: 0.12
  # fact: pom-42
- 語り: "書かれていたのは、11月のカレンダエの、16日前。11月1日から前の日へ数えると、16個目が、10月17日だ。"
  shot: P21_4
  tone: しみじみ
  pause: 0.12
  # fact: pom-58
- 語り: "部屋は、改装の途中だった。公園は、炭の字は長くもたないと考え、79年の10月、噴火の1週間前に書かれた可能性が高い、と発表した。"
  shot: P13_5
  tone: 重い
  pause: 0.12
  # fact: pom-73
- 語り: "文化大臣は、今日、私たちは歴史を書き換えている、と述べた。"
  shot: P19_6
  tone: 重い
  pause: 0.12
  # fact: pom-57
- 語り: "でも、この炭の字には、月と日しか書かれていない。《年》が、無いのだ。"
  shot: P14_7
  tone: 重い
  pause: 0.12
  # fact: pom-06
- 語り: "8月24日を伝える小プリニウスの手紙にも、79年という年は、書かれていない。"
  shot: P20_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第6章（2024年の考古公園の試し、pom-66・43）
- 語り: "もし、この字が、前の年の10月に書かれていたら。噴火の日は、どうなるのか。"
  shot: P15_9
  tone: 疑問
  pause: 0.15
