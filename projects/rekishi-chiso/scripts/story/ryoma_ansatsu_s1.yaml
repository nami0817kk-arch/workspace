# 物語完結型ショート 坂本龍馬の暗殺 s1（2026-11-27）。本編 scripts/ryoma-ansatsu-story.yaml（12/3 19:00 公開予定、https://youtu.be/GFeQhr4ubjU）から。12/4 9:30 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 近江屋事件_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/ryoma_ansatsu/main/ の R）の切り出しと、龍馬の肖像写真だけ。新しい絵は作らない。暗殺の場面・血・遺体は描かない。
# 切り口：今井信郎の話が3通りに変わった（本編 序章・第3章・第4章、ryoma-ansatsu-01・12・02・25・27）。
# 既出と重ねない：ryoma-if のショート（王政復古の24日前・吉井幸輔の避難の勧め）には触れない。
# hook＝「龍馬を斬った」と語った男の話はどう変わったか（答えはこのショートの中：1870 見張り→1900 自分が斬った→1909 命令による格闘）。
# tease＝口書で二階へ踏み込んだと名を挙げた3人は、そのときどうなっていたか（答えは本編 第3章の終わり：のちの戦いで死んでいた。ryoma-ansatsu-32）。
# 数え直し：慶応3年＝1867、明治3年＝1870（1867→1870＝3年後）、明治33年＝1900（口書の1870→1900＝30年後）、明治42年＝1909（談話の1900→1909＝9年後）。
#   供述・談話は「何年に誰が」を言う：1870年 今井の口書／1900年 近畿評論の談話／1924年 結城礼一郎の本／1909年 大阪新報への答え。季節は言わない。
# 理解テスト：①元京都見廻組の今井信郎が、龍馬の暗殺について語った話 ②1867年に京都の近江屋で龍馬が斬られ、1870年の取り調べ、1900年の雑誌、1909年の新聞で語った
#   ③1870年は見張り、1900年は自分が斬った（書いた記者は場面を芝居がかりで書いたと認めた）、1909年は命令で捕らえに行った格闘 ④同じ1人の話が3通りに変わった
title: "坂本龍馬｜斬ったと語った男"
yt_title: "坂本龍馬を斬ったのは自分だ　そう語った今井信郎の話は、見張り・自分が斬った・格闘と3通りに変わっていた"
description: |-
  坂本龍馬を斬ったのは、自分だ。明治33年、1900年の雑誌「近畿評論」で、元京都見廻組の今井信郎の、そう語る談話が載りました。
  ところが、慶応3年、1867年に龍馬が京都の近江屋で斬られた3年後、明治3年、1870年の取り調べの口書では、今井は、自分は見張りをしていただけで、二階へ踏み込んだのはほかの3人だ、と答えていました。今井は、事件に関わったとして禁錮を言い渡されています。
  1900年の談話を書いた記者の結城礼一郎は、1924年の本で、事実も多少飾り、斬った場面は大いに芝居がかりで書いた、と打ち明けました。そして明治42年、1909年、今井は大阪新報の記者に、あれは暗殺ではなく、命令で捕らえに向かって格闘したのだ、と言い直しています。
  本編では、事件の直後の手紙から、取り調べの口書、雑誌の談話、48年後の遺言まで、書かれた年を添えて並べ、龍馬を斬った者にどこまで近づけるかを確かめています。本編は概要欄のリンクからどうぞ。
