# hook＝足軽の梅干は、なぜ見るだけか（答えはこのショートの中：なめれば喉が渇く。陣中に1つでまかなう）。
# tease＝足軽が傷を負ったら、どう手当てしたか（答えは本編 第5章：風に当てるな・眠るな・小便を飲め、ashigaruif-17）。
