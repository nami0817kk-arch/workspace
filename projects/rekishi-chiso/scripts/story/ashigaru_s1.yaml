# 理解テスト：①戦国の足軽の心得（『雑兵物語』） ②江戸時代の前半（1657〜1683年）にまとめられた本の、陣中の食べ方 ③梅干は見るだけ（なめれば喉が渇く）・米は小分け（酒にされる）・鍋は陣笠・縄は芋の茎 ④陣中は飢饉だと思え、と教えた
title: "梅干は見るだけ｜足軽の陣中の心得"
yt_title: "戦国の足軽の梅干は「見るだけ」　なめてもいけない理由と、米を3日か4日分ずつしか渡さない理由　『雑兵物語』の心得"
description: |-
  戦国の足軽の心得には、こうあります。梅干は、食べてはいけない。なめてもいけない。ちょっと見るだけにしろ。なめれば喉が渇くから、梅干は陣中に1つでまかなえ。
  江戸時代の前半にまとめられた『雑兵物語』では、足軽たちが話し言葉で陣中の心得を語ります。米はまとめて渡さず、3日か4日分ずつ。まとめて渡すと、酒好きが米を酒に造って飲んでしまうから。鍋は持たず、頭の陣笠を鍋にする。荷を縛る縄は芋の茎でなって味噌で煮ておき、いざとなれば刻んで汁の実にする。
  本編では、足軽の集め方・持ち物・傷と手当て・手柄の数え方まで、『雑兵物語』とほかの記録でたどっています。本編は概要欄のリンクからどうぞ。
