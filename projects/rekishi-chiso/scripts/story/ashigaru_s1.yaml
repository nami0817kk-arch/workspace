lines:
  # fact: ashigaruif-09
- 語り: "戦国の足軽の梅干は、食べてはいけない。なめてもいけない。見るだけにしろ。"
  shot: A01_1
  tone: 強調
  pause: 0.12
  # fact: ashigaruif-01, ashigaruif-04
- 語り: "そう教えるのは、雑兵物語という本だ。1657年から1683年のあいだに、まとめられたという。"
  shot: A05_2
  tone: しみじみ
  pause: 0.12
  # fact: ashigaruif-09
- 語り: "鉄砲足軽の小頭、朝日出右衛門は言う。戦って息が切れたら、梅干を、ちょっと出して見ろ。"
  shot: C01_3
  tone: しみじみ
  pause: 0.12
  # fact: ashigaruif-09
- 語り: "なめれば、喉が渇く。梅干は、陣中に1つで、まかなえ。"
  shot: A01_4
  tone: 重い
  pause: 0.12
  # fact: ashigaruif-06
- 語り: "米も、まとめて渡さない。3日か4日分ずつ。まとめて渡すと、酒好きが、米を酒に造って、飲んでしまうからだ。"
  shot: A02_5
  tone: しみじみ
  pause: 0.12
  # fact: ashigaruif-18
- 語り: "鍋も、持たない。足軽から下の者は、頭にかぶった陣笠を、鍋にする。"
  shot: A03_6
  tone: しみじみ
  pause: 0.12
  # fact: ashigaruif-07
- 語り: "荷を縛る縄は、芋の茎でなって、味噌で煮ておく。いざとなれば、刻んで水に入れ、汁の実にする。"
  shot: D01_7
  tone: しみじみ
  pause: 0.12
  # fact: ashigaruif-07
- 語り: "陣中は、飢饉だと思え。雑兵物語は、そう教えている。"
  shot: D02_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第5章（ashigaruif-17：風に当てるな・眠るな・小便を飲め）
- 語り: "では、足軽が傷を負ったら、どう手当てしたのか。"
