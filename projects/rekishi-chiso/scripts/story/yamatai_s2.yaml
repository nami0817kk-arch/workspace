# 物語完結型ショート 邪馬台国はどこ？ s2（2026-11-07）。本編 scripts/yamatai-story.yaml（11/10 19:00 公開、https://youtu.be/cqLK1qEXpMw）の序章・第5章・第6章（吉野ヶ里）から。11/11 12:30 公開。
# 形式は shogun_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（Gemini）。新しい絵は作らない。
# 切り口：吉野ヶ里の「王の墓が無い」謎と、2023年に開けた石棺（副葬品なし）→2026年2月の方形周溝墓・墓域の発表。
#   採点（点・順位）には触れない。本編の答え（採点の1位・浮かび上がる場所）は明かさない。tease の答えは第7章（丹：阿波の若杉山）。
# 事実カード：yamatai-50・47・46・48・49。言い方は本編のまま。「誰が眠っていたのか言い切れない」はまとめの章のまま。
# 理解テスト4問：
#   ①誰の話か：佐賀県の吉野ヶ里遺跡（弥生の大きな環壕集落）
#   ②何が謎か：物見櫓や祭殿の跡があるのに、その時代の王の墓が見つからなかった
#   ③何が起きたか：2023年6月、大きな石棺の蓋を開けたが、中は土で、赤い顔料の痕だけ、副葬品なし
#   ④どうなったか：2026年2月、方形周溝墓と分かり、有力者の墓域の可能性が高まった。誰が眠っていたかは言い切れない
title: 吉野ヶ里｜石の棺に、何が眠っていたのか
yt_title: 吉野ヶ里遺跡の石棺には何が眠っていたのか　2023年に蓋を開けたら副葬品はゼロ、そして2026年の発表
description: |-
  邪馬台国の時代の可能性がある、佐賀県の吉野ヶ里遺跡の石の棺。そこには、何が眠っていたのでしょうか。
  吉野ヶ里では2世紀ごろ、集落のまわりを深さ3メートルの堀が囲み、その広さは約40ヘクタール。物見櫓や祭殿の跡まであるのに、その時代の王の墓が見つからないことが長年の謎でした。2023年の6月、ひとつの石の棺の蓋が開けられます。墓の穴の長さは3.2メートル、ふつうより大きな墓です。けれど中は土で満ち、赤い顔料の痕は出たものの、副葬品はひとつも出ませんでした。その後の調査で、まわりを四角く溝で囲った墓だと分かり、佐賀県は2026年2月、一帯は有力者の墓域だった可能性が高まった、と発表しています。
  では、魏志が書いた「その山に丹あり」。山で丹を掘った跡が出ているのは、どこか。本編は概要欄のリンクからどうぞ。
