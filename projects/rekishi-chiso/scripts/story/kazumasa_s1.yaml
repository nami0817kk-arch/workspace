# 事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml）：kazumasa-01・02・08・09・10・28
#   ・菅原義勝（『日本歴史』917号、2024）の読みは「推定」で、本人も決め手の史料は無いとする（kazumasa-02）→ 語りでも「読む」「決め手は無い」と言う。
#   ・kazumasa-08〜10 は出どころが菅原の論文とその紹介（昼間たかし、2026）だけ → 研究者の名前を出して、その人の読みとして言う。
#   ・日付は和暦（天正13年10月14日・10月28日・11月13日）。西暦の年は付けない。ドラマの台詞・創作は使っていない。
# 理解テスト4問：
#   ①誰の話か：石川数正（徳川家康の重臣。秀吉との交渉役）
#   ②いつ・どこで何が：天正13年10月、人質を出す方向で話をまとめていた数正の前で、後ろ盾をしてきた小笠原貞慶が秀吉と通じ、10月28日に家康が秀吉と手を切ると決めた
#   ③なぜ立場が崩れたか：菅原義勝さんの読み＝貞慶の離反が数正の責任になり、家康の決別で交渉の道が断たれた（2023年に初公開の織田信雄の手紙が手がかり。決め手の史料は無い）
#   ④どうなったか：天正13年11月13日の夜、数正は岡崎城を出て秀吉のもとへ走った
title: 石川数正｜立場は2週間で崩れていた
yt_title: 石川数正の立場は、出奔の前の2週間で崩れていた【2023年初公開の手紙】
description: |-
  石川数正は、徳川家康の側で、羽柴秀吉との交渉を受け持っていた重臣です。秀吉は人質を求め、数正は人質を出す方向で話をまとめようとしていました。
  2023年、致道博物館で初めて公開された、天正13年10月14日付けの織田信雄の手紙からは、家康がまだ秀吉とどう付き合うかを決めかねていたことが分かります。
  ところが、数正が後ろ盾になってきた小笠原貞慶はすでに秀吉と通じ、10月28日、家康は人質を出さず、秀吉と手を切ると決めました。
  研究者の菅原義勝さんは、これで数正の立場が崩れたと読みます（ただし決め手の史料は無い、としています）。天正13年11月13日の夜、数正は岡崎城を出て、秀吉のもとへ走りました。
