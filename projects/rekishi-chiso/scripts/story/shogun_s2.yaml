# 物語完結型ショート 徳川将軍の1日 s2（2026-11-06）。本編 scripts/shogun-story.yaml（11/9 19:00 公開、https://youtu.be/-kxBsJCne_k）の第2章から。11/10 12:30 公開。
# 形式は ooku_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵と《東照大権現像》。新しい絵は作らない。
# 切り口：朝の膳は質素（汁・向付・平＋二の膳）、毎朝の鱚、毒見の道すじと、隣の炉と鍋。髪と医師（s1）には踏み込まない。
#   吉宗の1日2食（shogun-16）は tease の答えとして本編に残す。家斉の献立・秤には触れない。
# どの将軍の記録か：膳の話は『千代田城大奥』（1892）＝12代家慶・13代家定のころの元御小姓の話。毒見の始まりは家康（『東照宮御実紀附録』）。
# 事実カード：shogun-10・01・09・12・14。言い方は本編のまま。
#   ・「冷めたまま出したとは限らない」は本編の言い方どおり（「温め直した」とは書いていない。炉と鍋があっただけ）。
# 理解テスト4問：
#   ①誰の話か：幕末の徳川将軍（家慶・家定のころ）の朝の膳
#   ②何が出たか：汁・向付・平、二の膳に吸物と皿。毎朝のように鱚を塩焼きと漬け焼きの両様で。1日・15日・28日は尾頭付き
#   ③どう届いたか：御膳所で作り、笹の間で御膳奉行が毒見、御小納戸が次の間へ。毒見の役の始まりは家康
#   ④どうだったか：次の間に大きな炉と鍋があり、冷めたまま出したとは限らない
title: 徳川将軍｜朝ご飯は、豪華だったのか
yt_title: 徳川将軍の朝ご飯は豪華だったのか　毎朝の鱚と、毒見を通って届く膳の道すじ
description: |-
  天下を治めた徳川将軍の朝ご飯は、豪華だったのでしょうか。
  明治25年（1892年）の本『千代田城大奥』に残る、12代家慶や13代家定のころの元御小姓の話では、もともと将軍の食べ物は質素なものでした。朝は汁と向付と平、二の膳に吸物と皿があるだけ。その皿に毎朝のように載ったのが鱚で、塩焼きと漬け焼きを両方つけました。毎月1日・15日・28日だけは、鱚の代わりに鯛か平目の尾頭付きです。膳は台所の御膳所で作られ、笹の間で御膳奉行が毒見をします。毒見の役の始まりは家康で、大坂の陣のとき伊達政宗に食事に用心するよう勧められたためだと『東照宮御実紀附録』は書いています。毒見の済んだ膳は御小納戸が将軍の部屋の次の間へ運び、そこには大きな炉があって、鍋がいくつも掛けてありました。将軍の食事は冷めていたとよく言われますが、冷めたまま出したとは限らなかったようです。
  では、8代吉宗は、1日に何回食べていたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川将軍', '#日本史', '#江戸時代']
ai_images: true
ai_disclosure: この動画の将軍の暮らしの場面・室内・人物の画像は、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真や肖像ではありません（画面に「AI生成画像」と出しています）。将軍の姿も特定の肖像を写したものではありません。
