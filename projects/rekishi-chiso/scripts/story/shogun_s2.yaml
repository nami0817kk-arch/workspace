  # fact: shogun-10
  - 語り: 『千代田城大奥』に残る、12代家慶や、13代家定のころの、元の御小姓の話。もともと、将軍の食べ物は、《!質素なもの》だ。
    shot: S10
    tone: 強調
    pause: 0.12
  # fact: shogun-10
