  # fact: shogun-01, shogun-08
  - 語り: その皿に、毎朝のように載ったのが、鱚。塩焼きと、漬け焼きを、両方つけた。
    shot: G03R
    tone: しみじみ
    pause: 0.12
  # fact: shogun-09
