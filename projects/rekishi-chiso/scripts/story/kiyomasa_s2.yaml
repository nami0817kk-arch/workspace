lines:
  # fact: kiyomasa-15
- 語り: "加藤清正の息子は、父が死んだあとに、父上がよくなっていてうれしい、と手紙を書いていた。"
  shot: K13_1
  tone: 強調
  pause: 0.12
  # fact: kiyomasa-15
- 語り: "1611年、清正の息子、数えで11歳の虎藤は、江戸にいた。徳川への、人質だった。"
  shot: K13_2
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-17, kiyomasa-22
- 語り: "その年の6月24日、清正は、熊本で亡くなる。数えで50歳。"
  shot: K12_3
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-15
- 語り: "4日後の、6月28日。虎藤は、母にあてて書いた。"
  shot: K13_4
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-15
- 語り: "父上が、少しずつ、よくなっていると聞いて、うれしい。上方から、医者が向かうそうです。"
  shot: K15_5
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-15
- 語り: "7月3日にも、家臣への手紙に、父上の病がよくなったと聞いて、満足だ、と書いている。父の死から、8日後だ。"
  shot: K13_6
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-16
- 語り: "8月4日。清正の跡を、この子に継がせてよいか。そう聞かれた家康は、そのまま跡を立てるように、と答えた。"
  shot: K01_7
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-16
- 語り: "8月24日。国へ帰る途中の虎藤は、駿府で、家康の前に出る。差し出したのは、金50枚と、銀100枚。"
  shot: K05_8
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-16
- 語り: "数えで11歳。清正の跡は、この少年に渡された。"
  shot: K11_9
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第2章（kiyomasa-17・18）
- 語り: "では、熊本の清正は、最期に、遺言を残せたのか。"
  shot: K10_10
  tone: 疑問
  pause: 0.15
