# 計算：虎藤（忠広）1601年生まれ→1611年 数え11。死 6/24、手紙 6/28＝4日後、7/3＝8日後（6月は小の月）。
# 理解テスト：①加藤清正の息子、虎藤の話 ②1611年、江戸で ③父の死を知らないまま、よくなっていてうれしいと手紙を書いた ④8月24日に駿府で家康の前に出て、清正の跡を継いだ
title: "加藤清正｜父の死を知らない息子の手紙"
yt_title: "「父上がよくなっていると聞いてうれしい」　加藤清正の11歳の息子は、父の死の4日後にそう書いた"
description: |-
  1611年6月24日、加藤清正は熊本で亡くなりました。そのころ江戸には、徳川への人質として、数えで11歳の息子・虎藤がいました。
  父の死の4日後、虎藤は母にあてて「父上が少しずつよくなっていると聞いて、うれしい」と書き、8日後にも家臣への手紙に「父上の病がよくなったと聞いて満足だ」と書いています（『大日本史料』）。8月24日、虎藤は国へ帰る途中の駿府で家康の前に出て、清正の跡を継ぎました。
  本編では、二条城の会見から3か月足らずで、清正がなぜ急に亡くなったのかを、記録ごとに並べています。本編は概要欄のリンクからどうぞ。
