#   asahi-39（天正14年9月の秀吉の書状：家康が聚楽へ来るなら「二人と無き母」を馬乗り一人も付けずに浜松まで送る）／
#   asahi-41（10月13日に京を発ち、18日に松平家忠が池鯉鮒まで迎えに出て岡崎城に入った）／
#   asahi-11・asahi-40（『宇野主水日記』「是一、御證人之躰也。面向ハ御息女ニ逢被申度ニ付而」）／asahi-04（『家忠日記』10月17日条「家康様御上洛候人質ニ」）／
#   asahi-45（『落穂集』：輿の戸が開くのも待ちかねて旭に抱きつき涙を流した。18世紀の書物）／
#   asahi-42・asahi-13（薪を積んだ話は『落穂集』『藩翰譜』『烈祖成績』など江戸時代の書物。岡崎市史 1935年「実否は明ならず」）／
#   asahi-12（11月12日に帰る。岡崎にいたのは約25日。帰りは井伊直政が付き添った）
# 薪の話は「火を放つ構え」まで（本編と同じ。焼き殺す等は言わない）。江戸時代の書物の話だと言う。
# 理解テスト4問：
#   ①誰の話か：大政所（豊臣秀吉の母）
#   ②いつ・どこで何が：天正14年10月18日、娘の旭が嫁いだ徳川の三河・岡崎城に入った
#   ③なぜ：秀吉が、家康を京へ呼ぶため「二人と無き母」を送ると申し出た。表向きは「娘に会いたい」、日記には「御証人（人質）」
#   ④どうなったか：家康が京から戻ると、11月12日に帰った（約25日）。薪の話は江戸時代の書物の話で、実否は明らかでない
title: 大政所｜「娘に会いたい」と、人質の旅へ
yt_title: 秀吉の母・大政所は「娘に会いたい」という名目で、家康の人質になった
description: |-
  天正14年9月、豊臣秀吉は、徳川家康が京へ来るなら「二人と無き母」を送ろう、と書状に書きました。
  10月18日、秀吉の母、大政所は、娘の旭が嫁いだ三河の岡崎城に入ります。
  本願寺の側の『宇野主水日記』は、この旅を「御証人の体」、つまり人質の旅と書き、表向きは娘に会いたいということだった、と続けています。
  江戸時代の書物には、大政所が岡崎で旭に抱きついて泣いた話や、徳川の家臣が宿所のまわりに薪を積んだ話が出てきますが、薪の話は、1935年の『岡崎市史』が「実否は明らかでない」としています。
  家康が京から戻ると、大政所は11月12日に帰りました。岡崎にいたのは、25日ほどでした。
