# 物語完結型ショート 小栗忠順 s3（2026-11-05）。本編 scripts/oguri-story.yaml（11/6 19:00 公開、https://youtu.be/kU5JH7ybcrI）の第2章の終わり・第3章・第4章の頭から。11/7 15:30 公開。
# 形式は jingi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/oguri/main。人物は後ろ姿・遠景だけ）と小栗の肖像だけ。新しい絵は作らない。時代違いの物がある絵（O08・O09・O10・O12・O13・O17・O18・O03）は使わない（s1 の頭のコメント）。
#   建ちかけの屋敷の絵（O08）はガラス窓と電柱が出ているので使わない。屋敷は語りだけ（絵は村・広間・寺）。
#   O07（松明の列）は夜の絵なので、3月4日の行では「朝」と言わない（本編は「3月4日の朝」。言わないだけで食い違いはない）。
# 切り口：命令書が「陣屋を厳重に構え」と書いたのは、建ちかけの屋敷だった。しかも命令は「捕らえよ」だった。使い（s1）・取り調べ（s2）・家族（s4）・碑（s5）には踏み込まない。
# 事実カード：oguri-14・15・16・24・53。言い方は本編のまま。
#   ・3月1日（権田村に着く）→ 4月22日（命令書）：3月を30日として約51日＝「2か月たたないうち」。本編の「2か月もたたないうちに」と同じ。
#   ・4月22日 → 閏4月6日：1868年の4月は29日まで → 7日＋6日＝13日＝「2週間たらず」。本編のまとめと同じ。
#   ・出どころが1つの事実（oguri-24 の命令書の言葉、oguri-53 の観音山の普請）は、本の名・「と伝わる」を付ける。
# 理解テスト4問：
#   ①誰の話か：幕府の役を解かれた小栗忠順と、新政府の命令書
#   ②いつ・どこで何が：1868年3月に上州の権田村へ移り、4月22日に新政府の軍の本営が3つの藩に命令書を出した
#   ③命令書は何と書いたか：陣屋を厳重に構え、砲台を築き、逆謀ははっきりした。命じたのは「捕らえよ」（手に余れば討ち取る）
#   ④どうなったか：屋敷は完成せず、命令書から2週間たらずで小栗は斬られた
title: 小栗忠順｜命令書が「陣屋」と呼んだ家
yt_title: 新政府の命令書が「陣屋を厳重に構え」と書いた小栗忠順の屋敷は建ちかけだった　命令は「捕らえよ」
description: |-
  新政府の命令書が「陣屋を厳重に構え」と書いた小栗忠順の屋敷は、建ちかけでした。
  1868年3月1日、幕府の役を解かれた小栗は、家族を連れて上州の権田村に着きます。3月4日には大勢の人々に村を囲まれ、火を放たれますが、家来たちと追い払いました。そのあと小栗は、近くの観音山に田畑と水路を開き、屋敷の普請を始めたと伝わります。4月22日、新政府の軍の本営は、高崎・安中・吉井の3つの藩に命令書を出します。『復古記』に写された命令書は、陣屋を厳重に構え、砲台を築き、逆謀ははっきりしたと書きます。けれど、命じた言葉は「追捕」、捕らえよ、でした。屋敷は完成せず、命令書から2週間たらずで、小栗は斬られました。
  捕らえよ、の命令は、なぜ斬首に変わったのか。本編は概要欄のリンクからどうぞ。
