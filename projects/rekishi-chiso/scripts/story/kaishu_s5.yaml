# 物語完結型ショート 勝海舟 s5（2026-11-12）。本編 scripts/kaishu-story.yaml（11/14 19:00 公開、https://youtu.be/KIXtgjggYl0）から。11/15 に予約。
# 形式は inou_s1.yaml・saigo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/勝海舟_facts_20261111.yaml）と本編の # fact: だけ。
# 絵は本編の AI 絵（out/story/kaishu/main。勝は後ろ姿・斜め後ろ・手元）と実在の絵（パブリックドメイン）。新しい絵は作らない。
# 切り口：小鹿の棺と慶喜の末子（本編第7・8章）。棺の横の言葉は居合わせた人の談（B20）。勝家は精が継いだ。
# 計算：1888-08-23生→1899-01-20＝満10歳／2月8日→2月14日＝6日（本編と同じ）。
# 理解テスト4問：①勝海舟と長男・小鹿 ②1892年2月8日に小鹿没。棺の横で、居合わせた人の話では勝家の奉還と慶喜の末子を望んだ ③慶喜は涙にむせび、2月14日に承諾。だが話は進まず海舟が亡くなった ④翌1899年1月20日に末の子・精が入り、勝家を継いだ。慶喜に嫌われたとの発言は本編
# 本編の弱点：B20 の話者は勝本人ではなく棺の場にいた人物（「居合わせた人の話では」と言う）。小鹿の没日は Wikipedia（サライは1日ずれる）。精の家督の日付はWikipediaの誤記疑いがあり言わない。
title: "勝海舟｜長男の棺の横で、海舟は慶喜に頼んだ"
yt_title: "勝海舟は長男・小鹿の棺の横で「慶喜公の末子を貰いたい」と言った　話は進まず、海舟は亡くなった"
description: |-
  1892年2月8日、勝海舟の長男、小鹿が亡くなりました。『海舟座談』の附録は、居合わせた人の話として、海舟が棺の横で、勝家を徳川氏に奉還したい、そして慶喜公の末子を貰いたい、と言ったと記します。慶喜は涙にむせんだ、とも。
  慶喜が承諾したのは2月14日で、小鹿の死の6日後です。しかし、世話をした人は、その後は一向に進まないまま海舟が亡くなった、と語っています。海舟の死の翌日、1899年1月20日に、慶喜の末の子、精が勝家に入りました（Wikipediaなどによる）。
  座談の附録はNDLデジタルの全文（OCR）で確かめましたが、語り手は海舟本人ではなく、日付は確かめられていません。
  海舟は、その慶喜に、嫌われていた、と自分で語っています。慶喜は何と言ったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/KIXtgjggYl0
