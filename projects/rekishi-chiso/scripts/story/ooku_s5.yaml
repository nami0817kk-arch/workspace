# 物語完結型ショート 大奥の奥女中 s5（2026-11-06）。本編 scripts/ooku-story.yaml（11/8 19:00 公開、https://youtu.be/28M-XkATUuY）の序章・第7章から。11/9 19:30 公開。
# 形式は kakeizu_s3.yaml（year のカード）を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は楊洲周延《千代田の大奥》（1895年ごろ、メトロポリタン美術館、CC0）と本編の AI 絵（out/story/ooku/main。FLUX、人物は後ろ姿だけ）。新しい絵は作らない。
# 切り口：華やかな大奥の錦絵は、大奥がなくなって26年後に描かれた。その前の聞き書き『旧事諮問録』と元女中どうしの食い違い。
#   勤め（s1）・給金（s2）には踏み込まない。延享元年の年金（ooku-22・35）は tease の答えとして本編に残す。
# 事実カード：ooku-47・79・73・74。（鳶魚の「曖昧」ooku-75 は長さのため外した）言い方は本編のまま。
#   ・明治27〜29年＝1894〜96年。1868年（江戸城の明け渡し）→1894年＝26年後。本編どおり。
#   ・明治24年＝1891年 → 23年後。本編どおり。
#   ・「40点」（展示の一覧「全40点」）。本編の序章は「40枚の錦絵」と言うが、ここは第7章の「40点」に合わせた（報告に書く）。
#   ・ませ子の言葉は『御殿女中』374頁。出どころを言ってから引く（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：華やかな大奥の錦絵《千代田の大奥》と、明治に元女中から話を聞いた『旧事諮問録』
#   ②いつ何が：明治24年（1891年）から聞き書き、明治27〜29年に錦絵。大奥がなくなって23年・26年後
#   ③何が食い違ったか：答えた箕浦はな子の素性を、大岡ませ子は「父が二の丸にいたというのは嘘」と言った
#   ④どうなったか：誰も見られなくなった大奥を、明治の人は聞き書きと錦絵で思い描いた
title: 大奥｜華やかな錦絵は、いつ描かれたのか
yt_title: 華やかな大奥の錦絵はいつ描かれたのか　大奥がなくなって26年後の《千代田の大奥》と、元女中の「嘘です」
description: |-
  着飾った女性たちが花見や遊びに興じる、華やかな大奥の錦絵。いつ描かれたのでしょうか。
  楊洲周延の《千代田の大奥》は、明治27年から29年に刷られた錦絵で、大奥がなくなって26年もたってからの作です。その少し前の明治24年（1891年）から、旧幕府の人々に話を聞いた『旧事諮問録』が作られ、元女中も答えています。答えたのは、12代家慶の大奥で中臈だったという箕浦はな子さん。ところが、三田村鳶魚の『御殿女中』で、同じ大奥にいた大岡ませ子さんは「父が二の丸にいたというのは嘘です」と語ります。2025年、東京国立博物館の江戸大奥展は、その第1章を「あこがれの大奥」と名づけています。
  では、30年以上勤めて病で辞めた奥女中には、何が渡されたのか。本編は概要欄のリンクからどうぞ。
