# 理解テスト：①桜田門外の変で生き残った井伊家の供の話 ②1860年3月3日の事件、罰は翌1861年の記事 ③家断絶・牢・知行取り上げ・慎みと、人によって罰が違った ④亡くなった5人の家は継げ、豪徳寺には8人の碑
title: "桜田門外の変｜生き残った供を待っていた罰"
yt_title: "桜田門外の変　大老を守って生き残った侍たちを待っていたのは「罰」だった　臆病だったとして知行を取り上げられた者も"
description: |-
  1860年3月3日、大老・井伊直弼は桜田門の外で討たれました。生き残った供の侍たちへの罰を、『桜田紅雪録』は翌年、1861年の記事に載せています。
  家を絶やされた者、牢に入れられた者、臆病だったとして知行を取り上げられた者、防いだが行き届かなかったとして慎みを命じられた者。一方、戦って亡くなった5人の家は、跡を継ぐことが許されました。
  その場で亡くなった供の数は、井伊家の届では4人、村田蔵六の手紙では6人。豪徳寺には、あとで亡くなった人も入れて8人の侍の碑があります。本編は概要欄のリンクからどうぞ。
