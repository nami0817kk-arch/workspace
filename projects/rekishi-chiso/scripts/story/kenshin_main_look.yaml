parts:
  - {type: quote, from: 2, to: 2, label: 史料, text: 去十三日、謙信不慮之虫気／不被執直遠行, source: 上杉景勝書状（天正6年3月24日）}
  - {type: quote, from: 16, to: 16, label: 史料, text: 今十五、一日之内ニ付落居, source: 上杉謙信書状（天正5年9月15日）}
  - {type: versus3, from: 43, to: 43, items: [[乃至さん 2023年, 上洛の準備], [乃至さん 2024年, 関東への大遠征], [武徳編年集成, 信長と戦う]], every: 1.8}
  - {type: quote, from: 49, to: 49, label: 史料, text: 去十三日、謙信不慮之虫気／不被執直遠行, source: 上杉景勝書状（天正6年3月24日、小島六郎左衛門宛）}
  - {type: quote, from: 51, to: 51, label: 史料, text: 遺言之由候而、実城へ可移之由／各強而理候条、任其意候, source: 上杉景勝書状（天正6年3月24日）}
  - {type: versus3, from: 56, to: 56, items: [[上杉家家譜 附録, 未の刻（昼過ぎ）], [日本史蹟大系（昭和11年）, 黄昏（夕方）]], every: 2.0}
  - {type: quote, from: 57, to: 57, label: 辞世, text: 四十九年一睡夢／一期栄華一盃酒, source: 『上杉家家譜』附録・『北越軍記』ほか}
  - {type: quote, from: 63, to: 63, label: 史料, text: 三月九日より腹痛を煩出／一説十一日に厠 昼より卒中風, source: 『北越軍記』（越後史料叢書『北越太平記』）}
  - {type: quote, from: 74, to: 74, label: 史料, text: 事実は虫気即ち脳溢血である, source: 木村徳衛『直江兼続伝』（1944年）}
  - {type: versus3, from: 103, to: 103, items: [[北越軍記の系統, 瓶に塩], [旧米沢藩士の話, 瓦の棺に朱の漆], [上杉謙信伝（大正6年）, 甲冑を着せて甕に]], every: 1.8}
  - {type: quote, from: 115, to: 115, label: 要点, text: 同時代の言葉は「不慮の虫気」だけ／厠と卒中風は江戸の軍記から, source: この動画のまとめ}

