references:
  - 上杉景勝書状（天正6年3月24日、小島六郎左衛門宛）：高橋義彦編『越佐史料』巻5（1930年）・『大日本古文書 家わけ第十二 上杉家文書』（国立国会図書館デジタルコレクション）
  - 『北越軍記』（越後史料叢書『北越太平記』1914年・黒川真道編『越後史集』1917年）／『上杉家家譜』附録（『越佐史料』巻5）
  - 田中香涯『医学以外の医学』1924年（『武徳編年集成』の引用）／布施秀治『上杉謙信伝』1917年／木村徳衛『直江兼続伝』1944年／栗岩英治『素描上杉謙信』1937年
  - 竹間芳明「加賀一揆と越前」（『若越郷土研究』70巻1号、2025年）
  - 乃至政彦（PRESIDENT Online・東洋経済オンライン・JBpress・SYNCHRONOUS の記事、2023〜2024年）
  - 岩田裕斗「新刊紹介 萩原大輔著『謙信襲来』」（『加賀藩研究』11号、2021年）
  - 文化庁 文化遺産オンライン（春日山城跡・鮫ヶ尾城跡・上杉家文書・長尾上杉氏印章）／観光庁 地域観光資源の多言語解説文データベース（七尾城跡）
  - 上越市『上杉謙信公』（第100回謙信公祭記念パンフレット）／米沢市上杉博物館
  - 鉄道省『先人の遺蹟』1939年／温古之栞刊行会『越後志料温古之栞』1936年

