# 物語型の本編（横 16:9）の見た目と絵の割り当て：上杉謙信の最期（scripts/kenshin-story.yaml）。chiso/storymain.py が読む。
# 11-07 作成（11/11 19:00 公開）。yamatai_main_look.yaml を写した。台本には手を入れない（承認のあと）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵（K01〜K22・KEND）は Gemini（Chrome、無料版）。指示の一覧は dev/output/rekishi-chiso/research/kenshin_ai_images.md。
#   実在の絵（パブリックドメイン）は額（frame:）と屏風・浮世絵の一部（part:）。謙信の顔は実在の肖像に似せない想像図。
