# 理解テスト4問：
#   ①誰の話か：アメリカ軍が数えた、九州の日本の兵
#   ②いつ・どこで何が：1945年5月28日に3個師団と見た敵が、6月18日に約35万人、8月2日に53万4千人、やがて60万人と見積もり直された
#   ③なぜか：アメリカは日本の無線を読んで数えていた。5つ目と6つ目の師団は5月の第1週からもう九州にいた、とのちに分かった
#   ④どうなったか：ウィロビーは7月29日に1対1になりかねないと書いた。では日本は浜辺にどんな陣地を築いたか、の問いで閉じる（答えは本編の第5章）
title: 九州の日本兵｜数え直すたびに増えた
yt_title: 九州の日本兵は、なぜ数えるたびに増えたのか　3個師団から35万人、60万人へ、アメリカが読んだ無線
description: |-
  1945年、アメリカは、日本の陸軍と海軍の無線をひそかに受け取り、暗号を読んで、九州の日本の兵の数を数えていました。
  5月28日の計画書は、南九州の敵を3個師団と見ていました。6月18日の会議でマーシャルが示した、11月に九州で待つ敵は約35万人。けれど、CIAの研究所から1998年に出たマキーチンの研究によると、その日、九州の師団は、すでに11月の予想の数に届いていました。5つ目と6つ目の師団は、5月の第1週から九州にいたことが、のちに分かったのです。
  7月29日、マッカーサーの情報部長ウィロビーは、このまま増え続ければ、攻める側と守る側は1対1になりかねない、と書きました。8月2日の報告では53万4千人、やがて60万人に見積もり直されます。最初の約35万人の、約1.7倍です。
  では、日本は、浜辺にどんな陣地を築いていたのか。本編は概要欄のリンクからどうぞ。
