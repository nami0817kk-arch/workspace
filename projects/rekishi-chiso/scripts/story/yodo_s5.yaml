# 物語完結型ショート 淀殿 s5（2026-10-29）。本編 scripts/yodo-story.yaml の序章・第5章（蛇の淀君はどこから来たか）から。投稿しない。
# 形式は masamune_s1.yaml を写した。想像の台詞なし。絵は本編の AI 絵（Gemini のみ）と実在の絵。
# 事実カード：yodo-12・13・44・46・47。『唐土の吉野』から借りた可能性が高い・動機の見立ては飯倉洋一（『語文』114、2020）の見立てとして留保ごと言う。『絵本太閤記』の祈祷の細部（肉を切る話）は言わない。
# 理解テスト4問：①誰の話か＝淀君（淀殿）の蛇の姿 ②いつ・どこで何が＝1797年から大坂の『絵本太閤記』が、淀君は蛇の性を帯び口が耳まで広がったと書いた ③なぜか＝1783年の『唐土の吉野』の怪談から借りた可能性が高く、北政所と秀吉を立てるため（飯倉さんの見立て）④どうなった＝『国史大辞典』は乱行は江戸時代の臆説と書く
title: 淀殿｜蛇の淀君は、どこから来たのか
yt_title: 淀殿が蛇にされたのは、なぜ　『絵本太閤記』と、元になった怪談『唐土の吉野』
description: |-
  口が耳まで広がり、蛇の性を帯びた女。江戸時代の大坂で読まれた絵本『絵本太閤記』は、豊臣秀頼の母、淀君を、そう描きました。寛政9年、1797年に出始めた秀吉の一代記で、七つの編、84冊、挿絵が全体の4割ほどを占める本です。最後の巻の「淀君行状」では、淀君は祈祷で美しさを取り戻したあと、蛇の性を帯びたと書かれます。
  この話は、天明3年、1783年に同じ大坂で出た『唐土の吉野』の怪談と、文章も挿絵の構図もよく似ています。飯倉洋一さんは、2020年の論文（『語文』114）で、断言はできないとしながら、『絵本太閤記』がそこから借りた可能性が高いと見ています。蛇にした理由についても、淀君を蛇の性にすれば正室の北政所の正しさが引き立ち、淀君をかわいがった秀吉も、仕方がなかったとかばえる、という見立てを述べています。
  『国史大辞典』では、歴史学者の山本博文さんが、淀君の乱行などというのは江戸時代の臆説だ、と書いています。
hashtags: ["#淀殿", "#日本史", "#戦国時代"]
