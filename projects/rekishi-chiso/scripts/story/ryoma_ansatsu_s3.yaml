# 物語完結型ショート 坂本龍馬の暗殺 s3（2026-11-27）。本編 scripts/ryoma-ansatsu-story.yaml（12/3 19:00 公開予定、https://youtu.be/GFeQhr4ubjU）から。12/4 15:30 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 近江屋事件_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/ryoma_ansatsu/main/ の R）の切り出しだけ。新しい絵は作らない。暗殺の場面・血・遺体は描かない。
# 切り口：新選組の原田左之助が疑われた元は、鞘か声か（本編 第2章、ryoma-ansatsu-04・05・24・22）。
# 既出と重ねない：ryoma-if のショート（王政復古の24日前・吉井幸輔の避難の勧め）には触れない。鞘の持ち主が3通り（世良敏郎）は s5 なので、ここでは言わない。
# hook＝原田左之助はなぜ疑われたか（答えはこのショートの中：谷の講演では鞘を見た伊東の一派が原田の刀と言った。けれど菊地2010は、元は中岡が覚えていた犯人の声とみる）。
# tease＝現場に残ったもう1つの物、下駄はどこの店の物だったか（答えは本編 第2章：1926年の本は瓢亭、菊地2010は当時の記録では2足で別の店の印。ryoma-ansatsu-06）。
# 数え直し：慶応3年＝1867。谷干城の講演は年が割れる（明治33年ごろ／明治39年）ので、載った遺稿の1912年を言う。田中光顕の談話は年が書かれていないので「年の書かれていない」と言う。
#   阿部十郎の談話は「明治になってからの談話」（本編どおり、年は言わない）。菊地明は2010年。季節は言わない。
# 理解テスト：①新選組の原田左之助が、龍馬の暗殺で疑われた話 ②慶応3年11月15日の夜、京都の近江屋。現場に刀の鞘が残っていた
#   ③谷干城の講演では、鞘を見た伊東甲子太郎の一派が原田の刀だと言った。田中光顕の談話では伊東本人が近江屋で見た
#   ④菊地明は、伊東が鞘を見た話には記録が無く、疑った元は中岡が覚えていた犯人の声（阿部十郎が原田の声に似ると言った）とみる
title: "坂本龍馬｜原田左之助が疑われたわけ"
yt_title: "龍馬を斬ったのは原田左之助か　新選組の隊士が疑われた元は、現場の鞘ではなく「声」だった"
description: |-
  慶応3年11月15日の夜、京都の近江屋で坂本龍馬が斬られたあと、土佐の側は、新選組の隊士、原田左之助を疑いました。
  1912年に出た遺稿の講演で、土佐の谷干城は、現場に残った刀の鞘を伏見の薩摩の屋敷へ持って行き、かくまわれていた伊東甲子太郎の一派に見せると、これは原田左之助の刀だと思う、と言い出した、と語っています。ところが、年の書かれていない田中光顕の談話では、鞘を見て新選組の物だと言ったのは伊東本人で、場所は近江屋でした。
  研究者の菊地明さんは、2010年、伊東が鞘を見たという話には記録が無いとし、原田を疑った元は、中岡慎太郎が覚えていた犯人の声だった、と見ています。御陵衛士の阿部十郎が、明治になってからの談話で、原田の声によく似ている、と言っていたのです。
  本編では、事件の直後の手紙から、取り調べの口書、雑誌の談話、48年後の遺言まで、書かれた年を添えて並べ、龍馬を斬った者にどこまで近づけるかを確かめています。本編は概要欄のリンクからどうぞ。
