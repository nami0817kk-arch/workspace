# 物語型の本編（横 16:9）の見た目と絵の割り当て：曹操（scripts/sosou-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（11/01 19:00 公開）。takasugi_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（S01〜S15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵の手もと・後ろ姿・遠景だけ。曹操の顔は描かない。肖像は実在の古画（『三才図会』の魏太祖像、1607年ごろ、パブリックドメイン）の額（frame:）。
#   清代の『三国志演義』の挿絵（パブリックドメイン）は額、西高穴2号墓の墓道の写真（Rolfmueller、CC BY-SA 3.0）は絵図の一部（part:）。
#   この回の決まり：戦闘・遺体・白骨・血は描かない。曹操の最期（死・葬儀）の場面に人物の絵を当てない。実在の俳優・ドラマ・ゲームの曹操に似せない。石牌・墓・門に文字を描かない。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/sosou_ai_images.md
# 届く前は art_dir の仮の絵（S01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に S01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「S01（仮）」と場面を書いて作り直す。
script: scripts/sosou-story.yaml
out: sosou_story_main
art_dir: out/story/sosou/ph          # 仮の絵（placeholder）
main_art_dir: out/story/sosou/main   # Gemini の 16:9 の絵（S01.jpg〜S15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

