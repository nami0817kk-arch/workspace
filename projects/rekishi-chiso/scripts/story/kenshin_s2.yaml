title: 手取川の戦い｜謙信の大勝は織田の記録にあるのか
yt_title: 手取川の戦いは、織田の記録にあるのか　『信長公記』に書かれない合戦と、謙信が着いた翌朝
description: |-
  1577年9月23日の夜、加賀の手取川の河口のあたりで、上杉の軍勢が織田の軍勢を破った、と語られる手取川の戦い。
  信長の家臣、太田牛一の『信長公記』には、手取川を越えて村々を焼いたこと、羽柴秀吉が届けも出さずに陣を引き払い、信長が怒ったことは出てきます。けれど、上杉の軍勢との合戦そのものは、書かれていません。2025年の論文は、この場所を、手取川ではなく湊川と呼びます。歴史家の乃至政彦さんは、織田の兵を討ったのは先に着いた上杉の軍勢で、謙信が着いたのは翌朝だった、と見ています。
  日付の食い違いもあります。大坂の本願寺の重臣、下間頼廉は、9月26日付の手紙で、去る11日に一戦して、敵を800人ほど討ち取った、と伝えています。11日は、七尾城が落ちる15日より前です。論文は、日付が誤って伝わったか、別の戦いのことか、両方の読みを挙げています。
  手取川の半年足らず後の春、謙信は、新しい出陣の日を決めていました。いつ、どこへ向かう戦だったのか。本編は概要欄のリンクからどうぞ。
