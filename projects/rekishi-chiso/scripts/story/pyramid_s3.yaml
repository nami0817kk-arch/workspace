title: "大ピラミッド｜約230万個を20年で積むと、約2分に1個"
yt_title: "約230万個の石を20年で積むと、1日に約315個　大ピラミッドを割り算すると、約2分に1個になる"
description: |-
  大ピラミッドの石は、約230万個と見積もられています。ヘロドトスの書いた20年で積むとすると、7300日で、1日に約315個。毎日10時間なら、約2分に1個です（1年365日、休まず働いた場合の平均）。
  現代の見積もりの27年なら、1日に約233個。石の産地は、すぐ近くの石灰岩、ナイルの向こうのトゥラ、約900キロ離れたアスワンの3つです。
  本編では、この石を誰がどうやって運び、積んだのかを、記録から整理しています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/B-vlbAtwegY
