lines:
  # fact: pyramid-P14
- 語り: "約230万個の石を、20年で積む。1年365日、休まず働いたとしても、約2分に1個になる。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: pyramid-P14
- 語り: "大ピラミッドの石は、約230万個。1個の平均は、約2.5トン。どちらも、数えた値ではなく、見積もりだ。"
  shot: C05_2
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P09
- 語り: "20年は、ギリシャの歴史家ヘロドトスが、ピラミッドそのものにかかった、と書いた年数だ。"
  shot: C06_3
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P14
- 語り: "20年は、7300日。割ると、1日に、約315個。毎日10時間働いて、約2分に1個。"
  shot: C04_4
  tone: 重い
  pause: 0.12
  # fact: pyramid-P29, pyramid-P14
- 語り: "現代の見積もりの、27年で積んでも、1日に約233個。実際に何日働いたかは、わかっていない。"
  shot: C05_5
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P15
- 語り: "石の大半は、すぐ近くの石灰岩。外側の白い石は、ナイルの向こうのトゥラから来た。"
  shot: C05_6
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P15
- 語り: "王の間のまわりの花崗岩は、約900キロ離れた、アスワンから運ばれた。"
  shot: C17_6
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P15
- 語り: "花崗岩の重さは、25トンから80トンまで、見積もりに幅がある。"
  shot: C17_7
  tone: 重い
  pause: 0.12
  # fact: pyramid-P03, pyramid-P28
- 語り: "機械のない時代。この石を、誰が、どうやって運び、積んだのか。"
  shot: YEND_8
  tone: 疑問
  pause: 0.15
