#   ③水戸の昭武のもとへ行くつもりで、書き付けを突き返した。大久保一翁は、水戸へ行けば妬みで害が及ぶと案じた慶喜の計らいだと明かした。それでも役は断った
#   ④駿府に残り、明治2年1月16日に商法会所を開いて頭取になった
title: "渋沢栄一｜突き返した書き付け"
yt_title: "渋沢栄一は、旧主・徳川慶喜の任命を突き返した　水戸へ行かせなかったわけを、大久保一翁が明かす"
description: |-
  明治元年の12月、駿府の宝台院で旧主・徳川慶喜と再会した渋沢栄一は、藩の勘定組頭に任じられました。けれど、水戸にいる慶喜の弟・昭武のもとへ行くつもりだった渋沢は、役目を命じる書き付けを、その場で突き返してしまいます。
  わけを明かしたのは、藩の重役、大久保一翁でした。『雨夜譚』によれば、一翁は「水戸へ行けば、あちらの者たちの妬みを買い、お前の身に害が及ぶおそれもある」と言い、昭和5年の談話では、それは殿様がご自身で取り計らったことだと語られています。
  それでも渋沢は、役に就けば給金のために仕えることになると言い張って、勘定組頭を断りました。駿府に残った渋沢は、明治2年1月16日、商法会所を開き、その頭取になります。月日は当時の暦（旧暦）のままです。
  本編では、この駿府の日々から、慶喜の伝記に渋沢がかけた年月をたどっています。本編は概要欄のリンクからどうぞ。
