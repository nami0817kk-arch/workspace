# 物語完結型ショート 徳川将軍家 s2（2026-11-06）。本編 scripts/tokugawa-kakeizu-story.yaml（11/7 19:00 公開、https://youtu.be/VrUQJ4sBdyA）の第2章から。11/8 12:30 公開。
# 形式は oguri_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/kakeizu/main。人物なし）と実在の絵・写真（駿府城の絵図・広重の府中・家達の少年時代）。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：700万石から70万石へ、6歳の殿様の引っ越し。誰が継いだか（s1）・天璋院（本編3章）には踏み込まない。
# 事実カード：kakeizu-14・15・16・18・19・21。言い方は本編のまま。
#   ・40＋18＋12＝70万石。700万石→70万石＝10分の1。本編どおり。
#   ・府中入り 慶応4年8月15日＝1868年9月30日。生まれ 1863年8月24日 → 満5歳。本編どおり。1868→1871＝3年ほど。
#   ・サライの「100名ほど」は出どころ1つなので、雑誌の名を言ってから言う。
# 理解テスト4問：
#   ①誰の話か：徳川宗家を継いだ6歳の16代、徳川家達
#   ②いつ・どこで何が：1868年5月24日、新政府が駿府の城主・70万石と伝えた。8月15日、府中（今の静岡）に入った
#   ③どう変わったか：700万石といわれた所領が10分の1に。付き従った者は100名ほど
#   ④どうなったか：1871年の廃藩置県で知事を免じられ、東京へ戻った。静岡の殿様は3年ほど
title: 徳川将軍家｜700万石は、いくつになったのか
yt_title: 700万石といわれた徳川の領地は70万石に　6歳の16代 徳川家達が駿府へ移った1868年
description: |-
  700万石といわれた徳川の所領は、6歳の当主の代で、10分の1の70万石になりました。
  1868年5月24日、新政府は、徳川宗家を継いだ亀之助（のちの家達）を駿府の城主とし、領地を70万石と伝えます。内訳は、駿河がおよそ40万石、遠江の一部がおよそ18万石、陸奥の一部がおよそ12万石。陸奥の分は9月4日に三河へ替えられました。8月15日、家達は駿河の府中、今の静岡に入ります。静岡県立中央図書館の解説では満5歳。2017年の雑誌サライのウェブの連載によれば、江戸から付き従った者は100名ほどでした。1869年の版籍奉還で静岡藩の知事になりますが、1871年の廃藩置県で東京へ戻りました。
  東京に戻った家達を育てたのは、誰だったのか。本編は概要欄のリンクからどうぞ。
