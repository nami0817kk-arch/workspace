lines:
  # fact: kakeizu-16
  - 語り: 700万石とも、いわれた徳川の領地。6歳の殿様の代で、いくつになったのか。
    shot: Moat
    tone: 疑問
    pause: 0.12
  # fact: kakeizu-14, kakeizu-16
  - 語り: 答えは、《!70万石》。10分の1だった。
    shot: K14
    tone: 強調
    pause: 0.12
  # fact: kakeizu-14
  - 語り: 1868年5月24日。新政府は、16代の家達を、駿府の城主とし、領地を、70万石とした。
    shot: Map
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-14
  - 語り: 内訳は、駿河が、およそ40万石。遠江の一部が、18万石。陸奥の一部が、12万石。
    shot: K08
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-15
  - 語り: 陸奥の分は、9月4日に、三河へ替えられた。
    shot: K06
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-18
  - 語り: 8月15日、家達は、駿河の府中、今の静岡に入る。満5歳だった。
    shot: Fuchu
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-19
  - 語り: 雑誌サライのウェブの連載によれば、江戸から付き従った者は、わずか100名ほど。
    shot: Child
    tone: 重い
    pause: 0.12
  # fact: kakeizu-21
  - 語り: 1869年、版籍奉還で、家達は、静岡藩の知事になる。
    shot: Fuji
    tone: しみじみ
    pause: 0.12
  # fact: kakeizu-21
  - 語り: けれど、1871年の廃藩置県で、その役も免じられ、東京へ戻った。
    shot: K09
    tone: 重い
    pause: 0.12
  # fact: kakeizu-21
