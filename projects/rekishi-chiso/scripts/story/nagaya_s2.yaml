title: "江戸の長屋｜井戸の水は誰が払った"
yt_title: "江戸の長屋の井戸は、地面を掘った井戸ではなかった　43キロ先から引いた上水の代金は、長屋の住人ではなく地主が払った"
description: |-
  江戸の長屋の路地にあった共同の井戸。その多くは、地下水を掘った井戸ではなく、郊外から引いた上水を、地下の石や木の水道管で通して、井戸の底に溜めたものでした。
  1654年にできた玉川上水は、多摩川の羽村から四谷大木戸まで、およそ43キロ。水の代金は水銀と呼ばれ、町人地では表通りの間口の広さに応じて地主から集めました。長屋の店子が、じかに払うものではありませんでした。
  上水が届かない深川では、1899年に水道が来るまで、舟で運ばれる水を買っていました（江東区の史跡の解説）。
  本編では、家賃・水・トイレ・お風呂・食べ物・灯りまで、江戸の長屋の1か月がいくらだったかを積み上げています。本編は概要欄のリンクからどうぞ。
