- type: quote
  from: 71
  to: 71
  label: 史料
  text: 戦に役立たず／ただ遠くを見るためのもの／人の力を費やすな
  source: 寛政重脩諸家譜（保科正之の言葉・要旨）
- type: quote
  from: 72
  to: 72
  label: 史料
  text: 幕府の工事が長引けば／下々の障りになる
  source: 別の記録（東京市史稿の引用・要旨）
- type: quote
  from: 96
  to: 96
  label: 要点
  text: 都市は防災に無防備なまま出発し／災害のたびに対策を重ねてきた
  source: 内閣府 専門調査会の報告書 2004年（要旨）
