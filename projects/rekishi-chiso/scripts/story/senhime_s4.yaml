title: "千姫｜吉田御殿の話は、どこから来たのか"
yt_title: "千姫の「吉田御殿」の話は、どこから来たのか　「吉田通れば二階から招く」の歌と後の世の講談"
description: |-
  千姫を、御殿の二階から若い男を招き入れた姫として語る「吉田御殿」の話。これは、後の世の講談で語られたものです。
  昭和11年の本によれば、「吉田通れば、二階から招く」の歌は、もともと東海道の吉田の宿（いまの愛知県豊橋）の、宿場の女を歌ったもの。江戸時代の流行り歌の本『松の落葉』に「吉田小女郎」という題で載っていて、それがのちに千姫の話にかこつけられた、と書かれています。
  吉田御殿がどこにあったのかも、明治の本は麹町の番町、大正の本は牛込の御門のあたりと、本によって違います。幕府の記録に出てくる天樹院（千姫）の住まいは、竹橋の御殿です。
  本編では、本当の千姫が救い出されたあとの50年をたどっています。本編は概要欄のリンクからどうぞ。
