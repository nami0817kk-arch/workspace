lines:
  # fact: senhime-50
- 語り: "千姫が、御殿の二階に、若い男を招き入れた。そんな吉田御殿の話は、どこから来たのか。"
  shot: R03_1
  tone: 強調
  pause: 0.12
  # fact: senhime-50
- 語り: "後の世の講談で、千姫は、そういう姫として語られた。"
  shot: R10_2
  tone: しみじみ
  pause: 0.12
  # fact: senhime-50
- 語り: "その話とともに語られたのが、吉田通れば、二階から招く、という歌だ。"
  shot: R08_3
  tone: しみじみ
  pause: 0.12
  # fact: senhime-47
- 語り: "けれど、昭和11年の本によれば、この歌は、もともと、東海道の吉田の宿、今の愛知県豊橋の、宿場の女を歌ったものだった。"
  shot: R11_4
  tone: 強調
  pause: 0.12
  # fact: senhime-47
- 語り: "『松の落葉』という江戸時代の流行り歌の本に、吉田小女郎という題で載っている。それが、のちに、千姫の話にかこつけられた、という。"
  shot: R14_5
  tone: しみじみ
  pause: 0.12
  # fact: senhime-49
- 語り: "近松の浄瑠璃にも、男を呼び入れる場面がある。吉田御殿の噂をあてこんだもの、と研究者は見る。千姫の死から、50年あまりのころだ。"
  shot: R05_6
  tone: しみじみ
  pause: 0.12
  # fact: senhime-51
- 語り: "吉田御殿が、どこにあったのかも、本によって違う。明治の本は麹町の番町。大正の本は牛込の御門のあたり。"
  shot: R02_7
  tone: 強調
  pause: 0.12
  # fact: senhime-29
- 語り: "幕府の記録に出てくる千姫の住まいは、竹橋の御殿。吉田という名の御殿に住んだ記録は、見つからない。"
  shot: R01_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 まとめ（1666年の最期、senhime-36〜38）
- 語り: "では、本当の千姫は、どんな最期を迎えたのか。"
  shot: S14_9
  tone: 疑問
  pause: 0.15
