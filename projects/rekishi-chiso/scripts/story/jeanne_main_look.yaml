# 物語型の本編（横 16:9）の見た目と絵の割り当て：ジャンヌ・ダルク（scripts/jeanne-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（11/02 19:00 公開）。sosou_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 15 枚（N01〜N15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵では1枚（N10 の書記の後ろ姿）だけ。ジャンヌの顔は描かない。最期（処刑）の場面には人物の絵を当てない（N11 は広場だけ）。
#   実在の絵：パリ高等法院の記録の余白の絵（1429年5月10日、書記フォーカンベルグ。国立公文書館・コモンズ、PD）＝額（frame:）、
#   『シャルル7世の通夜』の挿絵（1484年ごろ、PD）＝額、『貴婦人の擁護者』の挿絵（1451年ごろ、PD）＝額（肖像）。
#   この回の決まり：戦闘・遺体・炎・負傷は描かない。実在の俳優・映画・絵画のジャンヌに似せない。紋・旗の字・看板・書類の字を描かない。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/jeanne_ai_images.md
# 届く前は art_dir の仮の絵（N01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に N01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「N01（仮）」と場面を書いて作り直す。
script: scripts/jeanne-story.yaml
out: jeanne_story_main
art_dir: out/story/jeanne/ph          # 仮の絵（placeholder）
main_art_dir: out/story/jeanne/main   # Gemini の 16:9 の絵（N01.jpg〜N15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

