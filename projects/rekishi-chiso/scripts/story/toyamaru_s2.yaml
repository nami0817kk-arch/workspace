title: "洞爺丸｜ほかの船が待つなか、出航を決めた"
yt_title: "洞爺丸の船長は17時40分ごろ、出航を決めた　ほかの船は出航を待っていた　船長の言葉は残っておらず、理由は副総裁の推測だけ"
description: |-
  1954年9月26日の17時40分ごろ、洞爺丸の船長、近藤平市さんは、出航を18時30分と決めました。
  このとき、函館にいたほかの船は、出航を待っていました。運航を指示する輸送指令は、乗客をいったん降ろして桟橋を空けるよう指示しますが、船長は、そのまま桟橋に着けていたい、と申し出ます。
  船長は亡くなり、本人の言葉は残っていません。国会での副総裁の言葉は、推測です。
  出港は、何時何分だったのか。本編は概要欄のリンクからどうぞ。
  亡くなった方々とご遺族に、敬意を払って作っています。
  https://youtu.be/i6YryMy_fHQ
