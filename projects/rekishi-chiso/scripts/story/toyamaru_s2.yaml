lines:
  # fact: toyamaru-05
- 語り: "17時40分ごろ。洞爺丸の船長、近藤平市さんは、出航の時刻を、18時30分と決めた。"
  shot: S05_1
  tone: 強調
  pause: 0.12
  # fact: toyamaru-05
- 語り: "風が、いちど弱まった、そのころだ。"
  shot: S04_2
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-05
- 語り: "このとき、函館にいた、ほかの船は、出航を待っていた。青函丸の6号と11号だ。"
  shot: S06_3
  tone: 重い
  pause: 0.12
  # fact: toyamaru-05
- 語り: "青森でも、2隻が、出航を見合わせていた、と裁決の英訳にある。"
  shot: S06_4
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-06
- 語り: "出航が遅れるあいだに、輸送指令は、乗客をいったん降ろして、桟橋を空けるよう、指示した。"
  shot: S02_5
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-06
- 語り: "ところが、船長は、そのまま桟橋に着けていたい、と申し出た。"
  shot: S05_6
  tone: 重い
  pause: 0.12
  # fact: toyamaru-19
- 語り: "船長は、なぜ、出ると決めたのか。船長は亡くなり、本人の言葉は残っていない。"
  shot: S05_7
  tone: 重い
  pause: 0.12
  # fact: toyamaru-19
- 語り: "国鉄の副総裁は、10月1日の国会で、20メートルから25メートル程度の風なら、出られると見たのではないか、と述べた。"
  shot: S09_8
  tone: しみじみ
  pause: 0.12
  # fact: toyamaru-19
- 語り: "ただし、副総裁の推測で、船長の記録ではない。"
  shot: S09_9
  tone: 重い
  pause: 0.12
