# 物語完結型ショート 徳川将軍家 s5（2026-11-06）。本編 scripts/tokugawa-kakeizu-story.yaml（11/7 19:00 公開、https://youtu.be/VrUQJ4sBdyA）の第7章から。11/8 19:30 公開。
# 形式は oguri_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/kakeizu/main。人物は後ろ姿だけ）と実在の写真（松平容保・貴族院議長の家達）。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：会津の殿様の曾孫が、なぜ徳川宗家を継いだのか。19代目・継宗の儀（本編8章）には踏み込まない。
# 存命の人（徳川恒孝）は、本編で言った範囲だけ（1940年生まれ・系図・1963年に18代・およそ60年）。19代目の取材の話（子どものころ）は使わない。
# 事実カード：kakeizu-41・42・43・46・47・49・50・51・57。言い方は本編のまま。
#   ・曾孫を数え直した：容保→恒雄→一郎→恒孝（父方）、家達→家正→豊子→恒孝（母方）。どちらも曾孫。本編どおり。
#   ・当主の年数：1963年2月→2022年12月末＝59年10か月余（「およそ60年」）。本編どおり。
# 理解テスト4問：
#   ①誰の話か：徳川宗家の17代家正と、18代恒孝
#   ②いつ・どこで何が：家正の長男の家英が25歳で亡くなり、宗家の跡継ぎがいなくなった。1945年ごろ、家正は娘の子を養子にと考えた
#   ③なぜ会津の血か：長女の豊子の夫が、会津藩主・松平容保の孫の松平一郎。その子が恒孝で、父方は容保の、母方は家達の曾孫
#   ④どうなったか：1963年2月、家正が亡くなり、恒孝が18代目に。およそ60年当主でいた
title: 徳川宗家｜会津の曾孫が、なぜ継いだ
yt_title: 新政府と戦った会津の殿様 松平容保の曾孫が、なぜ徳川宗家の18代目になったのか　跡継ぎを失った17代
description: |-
  戊辰戦争で新政府と戦った会津の殿様、松平容保。その曾孫が、徳川宗家の18代目になりました。なぜだったのか。
  17代目は、家達の長男で、外務省に入りトルコの大使も務めた家正です。ところが家正の長男の家英は、25歳の若さで病気で亡くなり、宗家の跡継ぎがいなくなりました。1945年ごろ、家正が考えたのは、娘の子を養子に迎えることでした。長女の豊子の夫は、会津藩主・松平容保の孫の松平一郎。2人の子が、1940年生まれの恒孝です。父方からたどれば容保の曾孫、母方からたどれば家達の曾孫でした。1963年2月、家正が亡くなり、恒孝は18代目になります。当主でいたのは、およそ60年でした。
  2023年、19代目を迎えた徳川宗家が、150年あまりで初めて開いた式とは。本編は概要欄のリンクからどうぞ。
