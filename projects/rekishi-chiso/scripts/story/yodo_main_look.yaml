# 物語型の本編（横 16:9）の見た目と絵の割り当て：淀殿（scripts/yodo-story.yaml）。chiso/storymain.py が読む。
# 10-29 作成（10/30 12:00 公開）。台本は最後の通し確認のあと固めた（この look は行の番号で絵を当てるので、台本を変えない）。決まりは docs/story-main.md・スキル rekishi-story-screen。見本は kazunomiya・masamune の look。
# 絵の方針：AI 絵は 15 枚（Y01〜Y15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵（茶々は横顔か後ろ姿・正面の寄りは作らない）。実在の絵（パブリックドメイン。出典は台本の background / portrait の credit・caption と下の credits:）は額（frame:）と屏風・浮世絵の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/yodo_ai_images.md
# 届く前は art_dir の仮の絵（Y01.jpg〜、番号と場面だけ書いた灰色の板。10-29 に PIL で 1376×768 で作った）で代える。届いたら main_art_dir に Y01.jpg〜を置くだけ。
#   crops・focus・fx の位置は仮の値。届いた絵を見て合わせ直す。
# 落城・最期の場面は人を描かない（燃える城は Y13 の遠景、山里丸の蔵は Y14 の外観だけ）。最期・亡骸の行に人物の絵を当てない。
#   『絵本太閤記』の秀次の挿絵（yodo_ehon_taikoki_hidetsugu.jpg）は残酷な場面なので使わない。
#   伝淀殿画像（yodo_portrait_nara・yodo_portrait_detail・yodo_portrait_yogenin_copy_1913）は「伝」の肖像。画面の字は台本の caption どおり「伝」を付ける。
script: scripts/yodo-story.yaml
out: yodo_story_main
art_dir: out/story/yodo/ph          # 仮の絵（placeholder）
main_art_dir: out/story/yodo/main   # Gemini の 16:9 の絵（Y01.jpg〜Y15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

# 章ごとの左上の札「いま｜章題」。台本は和暦と西暦を並べて言うので札は和暦。
# dates＝語りがその年・月日を言った行から替える（論文・記事・書物の年は物語の「いま」ではないので替えない。null で章題だけ）。第5章（検証）とまとめは now: null
chapters:
  0: {label: 序章 蛇になった淀君は誰が作ったのか, now: 享和2年,
      dates: {3: null}}
  1: {label: 第1章 なぜ茶々は父の寺を建てたのか, now: 天正元年,
      dates: {19: 天正11年, 24: 文禄3年, 26: 元和5年, 29: null}}
  2: {label: 第2章 「秋刀魚を送る」, now: 天正17年5月,
      dates: {35: null, 38: 文禄2年, 44: 慶長3年}}
  3: {label: 第3章 「秀頼御袋より」, now: 慶長6年6月,
      dates: {52: 慶長7年, 55: null, 60: 慶長18年ごろ, 62: null, 64: 慶長19年}}
  4: {label: 第4章 三度目の落城で何が起きたのか, now: 慶長19年冬,
      dates: {74: 慶長20年, 77: 慶長20年5月, 83: 慶長20年5月8日, 84: null}}
  5: {label: 第5章 「淀君」はいつ生まれたのか, now: null}
  6: {label: まとめ 淀殿はなぜ悪女にされたのか, now: null}
