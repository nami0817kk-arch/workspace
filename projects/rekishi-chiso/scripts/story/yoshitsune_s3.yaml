# 物語完結型ショート 義経（もしも） s3（2026-11-13）。本編 scripts/yoshitsune-if-story.yaml（11/15 12:00 公開、https://youtu.be/AI_giM-Gij8）から。11/16 に予約。
# 切り口：義経の首が鎌倉に着くまで42日（本編序章・第4章。yoshitsune-10, 11, 12, 45, 46）。首・戦い・最期の絵なし（櫃は中身を描かない）。
# 計算：閏4月30日（6月15日）→6月13日（7月27日）＝42日後（数えで43日目）。閏4月30日→5月22日（知らせ）＝22日後（ユリウス暦6/15→7/7）。
# 理解テスト4問：①義経の首 ②1189年閏4月30日に衣川で自害、首が鎌倉の腰越に着いたのは6月13日＝42日後 ③「43日間酒に漬けた」は吾妻鏡に日数が無く計算値。頼朝は塔の供養まで持ってくるなと指示 ④実検のあと浜に打ち捨てられたという伝えと藤沢の井戸の伝説。泰衡のその後は本編へ
# 事実は事実カード（dev/output/rekishi-chiso/research/源義経_facts_20261112.yaml）と本編の # fact: だけ。想像の台詞なし。「もしも」の話は「もしもの話」と言ってから。
# 絵は本編の AI 絵（out/story/yoshitsune-if/main の B 番号）の再利用だけ。新しい絵は作らない。B11（大物浦）・B07（平泉の町並み）・B17（蓮）は当てない。人物の顔・戦い・首・妻子の最期の絵なし。
# 吾妻鏡の1185〜89年の本文は読み下しで読んだもの（本編と同じ扱い）。干支は使わない。

title: "義経｜首が着くまで、42日"
yt_title: "義経の首が鎌倉に着くまで42日　「43日間酒に漬けた」は吾妻鏡に書かれていない"
description: |-
  1189年閏4月30日、藤原泰衡の兵が衣川の館を襲い、義経は自ら命を絶ちました。吾妻鏡は「年三十一」と記します。知らせが鎌倉に届いたのは、22日後の5月22日。首が腰越の浜に着いたのは、6月13日で、死から42日後（数えで43日目）です。
  首は黒漆の櫃に入れ、酒に浸してありました。確かめたのは和田義盛と梶原景時で、見ていた人は皆、涙を拭い、袖を濡らした、と吾妻鏡は書きます。「43日間酒に漬けた」と語られることもありますが、吾妻鏡に日数は書かれていません。頼朝は6月7日、塔の供養を済ませるまでは首を持ってくるな、と奥州へ飛脚を送っていました。
  首は実検のあと浜に打ち捨てられた、という伝えがあります（藤沢市の資料）。吾妻鏡の1185〜89年の本文は、読み下し文で確かめたものです。原文との照合は行っていません。
  義経を討った泰衡は、そのあと、どうなったのか。本編は次のリンクからどうぞ。
