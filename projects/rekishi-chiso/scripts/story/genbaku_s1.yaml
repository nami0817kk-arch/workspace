# 理解テスト4問：
#   ①誰の話か：アメリカ軍のパープルハート章（戦傷の勲章）
#   ②いつ・どこで何が：戦争中に約150万個作られ、約3分の1の49万5千個が余り、朝鮮戦争のあとも配られて2000年にも約12万個が残った
