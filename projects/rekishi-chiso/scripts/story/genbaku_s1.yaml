#   ④どうなったか：上陸の日は来なかった。日本は迎え撃つ浜辺の守りをどう変えようとしていたか、の問いで閉じる（答えは本編の第4章）
title: パープルハート｜49万5千個の勲章が余った訳
yt_title: パープルハート章は、なぜ49万5千個も余ったのか　朝鮮戦争のあとも配られ、2000年にも約12万個が残っていた
description: |-
  戦争中に作られた、アメリカ軍の勲章、パープルハート。戦いで傷を負った兵に贈るものです。
  約150万個が作られ、そのうち約3分の1にあたる49万5千個が、使われずに余りました。余った勲章は、朝鮮戦争のあとも配られ続け、2000年にも約12万個が軍の手元に残っていた、と研究者のムーアとジャングレコは書いています。2人は、この勲章を、日本への上陸作戦に備えたものと見ています。ただし、数が死傷の予想を表すのかには、読者からの反論もあります。
  上陸作戦の最初の名はオリンピック。1945年11月1日に九州の南へ上がる計画で、翌1946年3月1日の関東への上陸がコロネット作戦、2つを合わせてダウンフォール作戦と呼びました。
  上陸の日は来ませんでした。迎え撃つ日本は、浜辺の守りを、どう変えようとしていたのか。本編は概要欄のリンクからどうぞ。
