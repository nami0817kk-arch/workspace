# hook＝旅費でいちばん重いのは何か（答えはこのショートの中：宿代 2,804文、約4割）。
# tease＝草鞋の値段は幕末にいくらまで上がったか（答えは本編 第4章：1863年に72文、ise-05。このショートでは草鞋の値段は言わない）。
# 計算（数え直した）：2,804÷7,048＝39.8%→約4割。交通 1,911÷7,048＝27.1%→3割近く。食 1,655÷7,048＝23.5%→2割あまり。
