# 理解テスト：①伊勢参りの旅費の内訳の話 ②1845年、伊勢までの16日（国三郎）と1840年の大倉与市 ③宿代が約4割でいちばん多く、旅籠と木賃宿で値段が違った ④宿は旅籠で1泊140〜185文、木賃宿は35〜65文
title: "伊勢参り｜旅費の4割は宿代"
yt_title: "伊勢参りの旅費で、いちばん重いのは宿代　伊勢まで16日の出費の約4割　草鞋は3%にもならなかった"
description: |-
  1845年、今の世田谷区の村から伊勢へ向かった農民、田中国三郎は、伊勢までの16日間に7,048文を使いました。東洋大学の谷釜尋徳さんの表では、そのうち宿代が2,804文で、全体のおよそ4割。次が交通の代で3割近く、食べ物が2割あまり、草鞋は3%にもなりません。
  宿には、食事のつく旅籠と、薪代だけを払う木賃宿がありました。1840年に越後の村から伊勢へ向かった大倉与市の小遣い帳では、旅籠が1泊140文から185文、木賃宿は35文から65文です。
  本編では、草鞋の値段の移り変わりや、伊勢で待つ御師の宿まで、1日ずつたどっています。本編は概要欄のリンクからどうぞ。
