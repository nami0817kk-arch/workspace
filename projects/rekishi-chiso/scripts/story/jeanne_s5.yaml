title: ジャンヌ・ダルク｜41万ドルの指輪は、483年の記録がない
yt_title: ジャンヌ・ダルクの指輪が41万ドルで落札　ところが483年分の記録がない
description: |-
  ジャンヌ・ダルクの物だと言われる指輪が、2016年に約41万ドルで落札されました。ところが、この指輪には483年分の記録がない、と指摘されています。
  2016年2月、競売会社タイムライン・オークションズで落札され、買ったのはフランスのテーマパーク、ピュイ・デュ・フーです。1431年の裁判で、ジャンヌは「『ジェズス・マリア』の名が刻んであったと思います」と指輪の話をしていました。
  ただし、「ヒストリー・ブログ」（2016年3月21日）は、1431年から1914年まで、この指輪に触れる記録はないと書いています。私たちが確かめられた出どころは、このブログ1つだけです。本物とも偽物とも、言い切れません。本編は概要欄のリンクからどうぞ。
