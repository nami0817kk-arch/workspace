# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしもモンゴル軍がヨーロッパから引き返さなかったら（scripts/mongol-if-story.yaml）。chiso/storymain.py が読む。
# 11-07 作成（11/10 12:00 公開）。columbus_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵は全部この回のために Gemini（Chrome）で新しく作った（out/story/mongol-if/main/、out/ は git に入らない）。前の回の絵は使わない。
#   人物は後ろ姿・遠景（実在の人物の顔は描かない）。戦い・負傷・遺体・ペストの死者は描かない。
#   実在の絵は『聖ヘドヴィヒ伝』のレグニツァの戦い（1353年）・元朝の皇帝の肖像のオゴデイ（パブリックドメイン）。
