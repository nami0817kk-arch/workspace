lines:
  # fact: edo-50, edo-51
- 語り: "1783年。日本とアイスランドで、同じ年に、火山が噴いた。その死者の数は、何を数えたものなのか。"
  shot: I17_1
  tone: 強調
  pause: 0.12
  # fact: edo-51
- 語り: "アイスランドのラキ火山は、およそ8か月、噴き続けた。アメリカの科学誌の論文によれば、人口の、およそ21パーセントが亡くなった。"
  shot: I17_2
  tone: 重い
  pause: 0.12
  # fact: edo-50
- 語り: "同じ1783年の夏には、日本で、浅間山が噴火する。内閣府の報告書は、死者を、1624人としている。"
  shot: I18_3
  tone: 重い
  pause: 0.12
  # fact: edo-54
- 語り: "東北を中心に、天明の飢饉が、広がっていく。"
  shot: I19_4
  tone: しみじみ
  pause: 0.12
  # fact: edo-54
- 語り: "幕府の人口の調べでは、1780年は、およそ2601万人。6年後の1786年は、およそ2509万人。"
  shot: I23_5
  tone: しみじみ
  pause: 0.12
  # fact: edo-54
- 語り: "6年で、およそ92万人が、減っている。"
  shot: I19_6
  tone: 重い
  pause: 0.12
  # fact: edo-55
- 語り: "ところが、辞典によっては、この飢饉の死者を、90万人以上と書く。人口の調べの差と、ほとんど同じ数だ。"
  shot: I23_7
  tone: 強調
  pause: 0.12
  # fact: edo-55
- 語り: "人口の差には、生まれる子が減った分も、入っている。人口の減りが、死者の数に、言い換えられているのかもしれない。"
  shot: I19_8
  tone: しみじみ
  pause: 0.12
