# hook＝同じ年に2つの火山。その死者の数は何を数えたのか（答えはこのショートの中：人口の減りが死者に言い換えられているのかもしれない）。
# tease＝幕府が人を数え始めたのは、アメリカより何年早かったのか（答えは本編 第4章：1721年、およそ70年、edo-59）。
# 計算：26,010,600−25,086,466＝924,134（3.55%）。
# 理解テスト：①1783年の2つの噴火と天明の飢饉の話 ②アイスランドのラキ（人口の約21%）、日本の浅間山（1624人） ③幕府の人口の調べで6年に約92万人減 ④辞典の死者90万人以上は、その差とほぼ同じ。人口の減りの言い換えかもしれない
title: "1783年｜同じ年、2つの火山"
yt_title: "1783年、アイスランドのラキ火山と日本の浅間山が同じ年に噴火　天明の飢饉の「死者90万人」は、幕府の人口の調べの差とほぼ同じ数"
description: |-
  1783年、アイスランドのラキ火山は翌年の2月まで、およそ8か月噴き続け、アイスランドでは人口のおよそ21パーセントが亡くなりました。同じ年の夏、日本では浅間山が噴火し、内閣府の報告書は死者を1624人としています。
  東北を中心に天明の飢饉が広がり、幕府の人口の調べは、1780年のおよそ2601万人から、1786年のおよそ2509万人へ、6年で約92万人減ったことを残しています。辞典によっては飢饉の死者を90万人以上と書きますが、この数は人口の調べの差とほとんど同じです。
  本編では、家康から慶喜までの260年を、同じ年の世界と並べています。本編は概要欄のリンクからどうぞ。
