# 物語完結型ショート 豊臣秀次 s1（2026-10-28）。本編 scripts/hidetsugu-story.yaml の冒頭と第2章（7月12日の条々・14日の使者）から。投稿しない。
# 形式は kazumasa_s1.yaml・asahi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/hidetsugu/main/H*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/豊臣秀次_facts_20261028.yaml）：hidetsugu-01・05・07・12・06・09
#   ・条々の書き出し「高野山に秀次を住まわせる」・供15人（侍10人＋5人）・刀脇差を帯びない・山の出入口に番（hidetsugu-05。写しは『佐竹家旧記』『南行雑録』）。
#   ・14日の福原長尭の「目出たく御仲直り」は『川角太閤記』による（hidetsugu-12）→ 語りで出どころを言う。
#   ・命令があったかは矢部説・勢田説で割れる（hidetsugu-06・07）→「見方が分かれている」まで。どちらにも寄せない。
#   ・切腹は「腹を切った」まで。様子は描かない・語らない（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：豊臣秀次（秀吉の甥・関白）
#   ②いつ・どこで何が：文禄4年7月8日に伏見から高野山へ。7月12日、秀吉が高野山に「秀次を住まわせる」決まりを出した
#   ③秀吉は何を決めたか：供は15人まで・刀も脇差も帯びさせない・山の出入り口に番。14日には使者が「仲直りなさる」と伝えた（『川角太閤記』）
#   ④どうなったか：翌15日、秀次は青巌寺で腹を切った。秀吉が命じたのかは、今も見方が分かれている
title: 豊臣秀次｜切腹の3日前、秀吉は「住まわせる」と書いた
yt_title: 豊臣秀次が腹を切る3日前、秀吉は「高野山に住まわせる」決まりを書いていた
description: |-
  文禄4年7月8日、関白だった豊臣秀次は、伏見を出て高野山へ向かいました。
  7月12日、秀吉は高野山の木食応其にあてて、箇条書きの決まりを出します。書き出しは「秀次を、高野山に住まわせる」。供は15人まで、刀も脇差も帯びさせない、山の出入り口には番を置く。
  『川角太閤記』によれば、14日には秀吉の使者が「いずれ仲直りなさるでしょう」と伝えました。
  ところが翌15日、秀次は高野山の青巌寺で腹を切ります。秀吉が本当に切腹を命じたのかは、研究者のあいだで今も見方が分かれています。
