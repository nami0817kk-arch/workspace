# 物語型の本編（横 16:9）の見た目と絵の割り当て：もしも北条氏政が秀吉に頭を下げていたら（scripts/hojo-if-story.yaml）。chiso/storymain.py が読む。
# 11-06 作成（11/8 12:00 公開）。tsurumatsu_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：新しい Gemini の絵は Q01（北条氏政と小田原を囲む陣のかがり火。11-06 作成、サムネと同じ絵）だけ。
#   Gemini は CPU が他の書き出しで 100% のあいだ画面が固まり、2枚目以降が作れなかった。残りは前の回の Gemini の絵（16:9・1376×768）を
#   out/story/hojo-if/main/ に H02〜H26 として写した（out/ は git に入らない。無ければ下の表から写し直す）。
#   H02=tsurumatsu/T16（霧の谷と陣）H03=tsurumatsu/T09（巻紙の手元）H04=tsurumatsu/T10（机の文書）H05=tsurumatsu/T03（秀吉）
#   H06=tsurumatsu/T12（山道を行く少人数）H07=tsurumatsu/T20（夕暮れの石垣と堀）H08=tsurumatsu/T22（街道を急ぐ使者）H09=tsurumatsu/T23（五輪塔の列）
#   H10=hideaki/H06（山の上の石垣と櫓）H11=hideaki/H11（陣幕の内）H12=hideaki/H12（山の斜面の陣幕と旗）H13=kazumasa/K01（丘の上の夜の城と数騎）
#   H15=genkou-if/G15（夕暮れの海と岬。終了画面）H16=asahi/K04（家康）H17=asahi/A06（輿と護衛の街道）H18=asahi/A10（夜の輿と松明）
#   H19=asahi/A12（聚楽第の遠景）H20=maizo/M04（上野の山並み）H21=musashi/M02（海に面した城下）H22=musashi/M05（海を望む石垣の城）
#   H23=shimabara/P08（竹の柵の陣）H24=shimabara/P10（文机の書状）H25=kakeizu/K02（広間とろうそく）H26=kakeizu/K06（霧の街道）
#   実在の人物の顔は、実在の肖像（額）か、前の回で作った想像図（秀吉 H05・家康 H16）と、この回の氏政 Q01 だけ。切腹・処刑・磔の場面は描かない。
