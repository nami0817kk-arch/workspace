parts:
  - {type: quote, from: 32, to: 32, label: 史料, text: 当年極月上旬、氏政出仕／致すべきの旨、御請の一札進上候, source: 秀吉朱印状（天正17年11月24日・北条氏直宛。『日本戦史 小田原役』附録。読み下し）}
  - {type: quote, from: 49, to: 49, label: 史料, text: 来歳必ず節旄を携え進発せしめ／氏直が首を刎ぬべき事, source: 秀吉朱印状（天正17年11月24日。『伊達家文書』。読み下し）}
  - {type: quote, from: 54, to: 54, label: 史料, text: 名胡桃の事、一切存ぜず候／名胡桃、当時百姓屋敷, source: 北条氏直書状（天正17年12月7日。『日本戦史 小田原役』附録。読み下し）}
  - {type: quote, from: 55, to: 55, label: 史料, text: 或いは永く留め置かるべし／或いは国替え, source: 北条氏直書状（天正17年12月7日。『日本戦史 小田原役』附録。読み下し）}
  - {type: quote, from: 132, to: 132, label: 要点, text: 上洛の代償／名胡桃の始末・国替えの恐れ, source: この動画のもしもの整理（推論）}

