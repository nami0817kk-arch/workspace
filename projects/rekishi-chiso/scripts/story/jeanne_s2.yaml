title: ジャンヌ・ダルク｜裁判記録の余白の2語「致命的な答え」
yt_title: ジャンヌ・ダルクの裁判記録の余白に書かれた2語「致命的な答え」
description: |-
  ジャンヌ・ダルクの裁判記録の余白には、ラテン語で2語、「致命的な答え」と書き込まれています。
  1431年5月28日、男の服に戻っていたジャンヌは、牢で声について問われ、誓約を受け入れたのは大きな裏切りだった、と答えました。その答えの横に、記録係が書き込んだのが「Responsio mortifera」です。ジュール・ケシュラが1841年に出した史料集の脚注に、そう記されています。
  5月29日に司教が示した再犯の理由は、男の服と、声が戻ったという答えの2つ。記録の上で処刑に直結したのは、服よりも声の答えだった、と読む余地があります。本編は概要欄のリンクからどうぞ。
