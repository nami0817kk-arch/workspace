# 物語完結型ショート 三種の神器 s2（2026-11-05）。本編 scripts/jingi-story.yaml（11/5 19:00 公開、https://youtu.be/XmWN5pboKa4）の第1章から。11/6 12:30 公開。
# 形式は sankin_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（人物なし）と本編で使った『尾張名所図会』だけ。新しい絵は作らない。
# 切り口：草薙剣は668年に盗まれ、686年に「祟り」と占われて熱田へ送られた（日本書紀）。鏡（s1）・壇ノ浦（s3）・南北朝（s4）・勾玉（s5）には踏み込まない。
# 神器の扱い：「祟り」は日本書紀の言葉として、出どころを付けて言う。清雪門・酔笑人神事は「伝わる」「といわれる」。
# 事実カード：jingi-01・02・13・14・15。言い方は本編のまま。
#   ・天智天皇7年＝668年、朱鳥元年＝686年を確かめた。668→686 は18年（本編と同じ）。
#   ・戻った剣の置き場は日本書紀に無い → 「熱田の側の伝え」（jingi-13、本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：三種の神器の剣、草薙剣
#   ②いつ・どこで何が：668年に僧の道行が盗んで新羅へ逃げようとし、嵐で迷って戻った
#   ③どうなったか：686年6月、天武天皇の病が草薙剣の祟りと占われ、その日のうちに尾張の熱田社へ送られた
#   ④その後：熱田神宮の清雪門は「開かずの門」、5月4日の酔笑人神事は剣が戻った喜びを伝えるといわれる
title: 三種の神器｜草薙剣は、一度盗まれた
yt_title: 草薙剣は668年に一度盗まれていた　日本書紀が記す盗難と、18年後に熱田へ送られたわけ
description: |-
  三種の神器の剣、草薙剣は、一度、盗まれています。
  668年、天智天皇の7年。『日本書紀』によれば、僧の道行が草薙剣を盗み、新羅へ逃げようとしましたが、風と雨にあって道に迷い、戻ってきました。戻った剣がどこにあったのか、『日本書紀』は書いていません。18年後の686年6月、天武天皇の病を占うと、草薙剣の祟りだと出て、剣はその日のうちに尾張国の熱田社、今の熱田神宮へ送られました。熱田神宮の清雪門は「開かずの門」と呼ばれ、毎年5月4日の夜の酔笑人神事は、剣が戻った喜びを伝えるといわれます。
  剣が熱田へ移ったあと、天皇のそばには何が残ったのか。本編は概要欄のリンクからどうぞ。
