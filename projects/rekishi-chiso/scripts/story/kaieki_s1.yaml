#   ③（後の世の話）宇都宮城の天井を落として秀忠を殺そうとしたと語られた ④歴史学者の高木昭作は偽りとし、本当の原因は秀忠との政治の対立とみる。正純は出羽へ流され1637年に横手で亡くなった
title: "改易｜宇都宮の釣天井"
yt_title: "宇都宮の釣天井は「偽り」　将軍を殺そうとしたと語られた本多正純の改易と、秀忠の夜通しの帰り道"
description: |-
  家康の側近だった本多正純は、宇都宮の城に、天井が落ちる仕掛けを作って、将軍の秀忠を殺そうとした。後の世に広まった「宇都宮の釣天井」の話です。
  元和8年、1622年。宇都宮15万5000石の正純は、改易された山形の最上家の城を受け取るために山形にいた、その留守のあいだに、自分も改易されました。出羽の由利へ流され、寛永14年、1637年に横手で亡くなっています。
  歴史学者の高木昭作は、日本大百科全書で、釣天井の話を「偽り」とし、秀忠が急に宇都宮をたって夜通しで江戸へ戻ったことが、改易や謀反のうわさと結びついてできた話と考えています。改易の本当の原因は、秀忠との政治の上の対立とみています。
  本編では、江戸幕府に取りつぶされた大名の数と、いちばん多かった理由、そして数が減っていったわけを、研究ごとの数字で積み上げています。本編は概要欄のリンクからどうぞ。
