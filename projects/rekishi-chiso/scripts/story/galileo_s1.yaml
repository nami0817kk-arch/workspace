# 計算（自分で数え直した）：1757−1633＝124年／1757−1642＝115年／1761−1757＝4年
title: "ガリレオ｜「それでも」の最初の活字は、124年後"
yt_title: "「それでも地球は動く」が最初に活字になったのは、ガリレオが誓った日の124年後　その本は6年の拷問、とも書いていた"
description: |-
  「それでも地球は動く」。この一言が、はじめて活字になったのは、1757年のロンドンの本でした。ガリレオが地動説を捨てると誓った1633年から数えて124年後、死から115年後です。
  その本はバレッティの『イタリアの文庫』52ページ。出どころは書かれていません。同じ書き添えは、「6年間、異端審問所にいて、拷問も受けた」とも書いていますが、記録では、判決の翌日に軟禁へ変わり、拷問は脅しまででした。
  判決にも、誓いの文書にも、弟子の伝記にも、この言葉はありません。では、足を踏み鳴らした話は、活字になる前、どこで育ったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/O80RShvkLVU
