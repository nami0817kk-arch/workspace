lines:
  # fact: galileo-23, galileo-53
- 語り: "「それでも地球は動く」。この一言がはじめて活字になったのは、ガリレオが誓った日の、124年後だった。"
  shot: C12_1
  tone: 強調
  pause: 0.12
  # fact: galileo-23, galileo-24
- 語り: "1757年、ロンドン。ジュゼッペ・バレッティの『イタリアの文庫』、52ページ。"
  shot: C11_2
  tone: しみじみ
  pause: 0.12
  # fact: galileo-23, galileo-24
- 語り: "ガリレオの『天文対話』の項目への、書き添えに、台詞は現れる。出どころは、書かれていない。"
  shot: C12_3
  tone: しみじみ
  pause: 0.12
  # fact: galileo-23
- 語り: "釈放された瞬間、足を踏み鳴らして言った、「それでも動く」。バレッティは、そう書く。"
  shot: C13_4
  tone: 重い
  pause: 0.12
  # fact: galileo-23, galileo-55
- 語り: "ところが、同じ書き添えは、「6年間、異端審問所にいて、拷問も受けた」とも書く。"
  shot: C16_5
  tone: 重い
  pause: 0.12
  # fact: galileo-55, galileo-13, galileo-11
- 語り: "記録では、判決の翌日に軟禁へ変わり、拷問は脅しまでだった。2つとも、合わない。"
  shot: C16_6
  tone: しみじみ
  pause: 0.12
  # fact: galileo-25
- 語り: "4年後、フランスの本も、同じ話を載せた。「といわれる」と、伝聞の形で、「6年の禁固」の誤りも、そのままだ。"
  shot: C11_7
  tone: しみじみ
  pause: 0.12
  # fact: galileo-09
- 語り: "判決にも、誓いの文書にも、弟子の伝記にも、この一言はない。"
  shot: C03_8
  tone: 重い
  pause: 0.12
  # fact: galileo-33
- 語り: "では、足を踏み鳴らした話は、活字になる前の百年、どこで育ったのか。"
  shot: C13_9
  tone: 疑問
  pause: 0.15
