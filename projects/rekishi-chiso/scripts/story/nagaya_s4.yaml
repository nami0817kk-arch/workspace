# 切り口：天保の湯銭で家族3人が毎日通うと、大工の家のひと月の残りがほとんど消える（本編 第4章・まとめ、nagayaif-21・23・24）。
# hook＝家族で毎日湯屋に通うと、ひと月の残りが消える（答えはこのショートの中：3人で600文＝約5匁5分、残り約6匁）。
# tease＝大工の家のお米の値は天保に入ってどれだけ上がったか（答えは本編 第5章：百相場 8合5勺→4合、倍を超える、nagayaif-30）。
# 計算（本編と同じ、計算し直した）：8＋8＋4＝20文。20×30＝600文。1匁＝6,500÷60＝108.3文 → 600÷108.3＝5.54匁。ひと月の残り 73.6÷12＝6.13匁。
# 理解テスト：①江戸の湯屋の湯銭の話 ②天保の改革で大人8文・子ども6文・小さな子4文 ③大工の家計の出費の並びに湯銭がない ④3人で毎日通うとひと月約5匁5分、残り約6匁がほとんど消える
title: "江戸の長屋｜湯銭で残りが消える"
yt_title: "江戸の銭湯に家族3人で毎日通うと、大工の家のひと月の残りはほとんど消えた　天保の改革で決まった湯銭は大人8文"
description: |-
  江戸の湯銭は、喜田川守貞の『守貞謾稿』によると、はじめは大人10文ほど。それが天保の改革で、大人8文、子ども6文、小さな子は4文と決められました。
  文政年間漫録に残る、ある大工の1年の家計。その出費の並びには、湯銭という項目がありません。夫婦と小さな子の3人が毎日通うと、1日20文、30日で600文。銀にすると、およそ5匁5分。大工の家のひと月の残りは、およそ6匁でした。
  本編では、家賃・水・トイレ・お風呂・食べ物・灯りまで、江戸の長屋の1か月がいくらだったかを積み上げています。本編は概要欄のリンクからどうぞ。
