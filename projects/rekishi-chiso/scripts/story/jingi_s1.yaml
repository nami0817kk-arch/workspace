# 物語完結型ショート 三種の神器 s1（2026-11-05）。本編 scripts/jingi-story.yaml（11/5 19:00 公開、https://youtu.be/XmWN5pboKa4）の序章・第2章から。11/6 9:30 公開。
# 形式は sankin_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。絵は本編の AI 絵（out/story/jingi/main/J*。人物なし）と本編で使った絵巻だけ。新しい絵は作らない。
# 切り口：宮中の神鏡は3回焼け、1040年に破片と金属の粒になった。それでも神鏡として安置され、神楽が三夜。剣（s2・s3）・南北朝（s4）・勾玉（s5）には踏み込まない。
# 神器の扱い：宗教の言葉で語らず、「記録にこうある」の形で言う。
# 事実カード（dev/output/rekishi-chiso/research/三種の神器_facts_20261031.yaml）：jingi-05・06・19・21・22・24・26。言い方は本編のまま。
#   ・天徳4年＝960年、寛弘2年＝1005年、長暦4年＝1040年（長久への改元は1040年11月）を確かめた。960→1005 は45年（本編と同じ）。1005→1040 は35年。
#   ・「1005年の例」：春記は「故一条院御時、神鏡焼損給之時」（一条天皇の在位 986〜1011 の中の焼損＝1005年）。本編第2章と同じ読み。
#   ・破片と粒の安置は斎木涼子 2017（洛北史学19）の言葉 → 出どころを語りで言う。
# 理解テスト4問：
#   ①誰の話か：天皇のそばにまつられた宮中の神鏡（三種の神器の鏡）
#   ②いつ・どこで何が：960年・1005年・1040年に内裏の火事で焼け、1040年に完全に壊れた
#   ③どうしたか：新しく作らず、破片と金属の粒をそのまま神鏡として安置し、神楽を三夜続けた
#   ④どうなったか：形を失っても、神鏡としてまつられ続けた
title: 三種の神器｜神鏡は、破片と粒になった
yt_title: 宮中の神鏡は1040年の火事で破片と金属の粒になった　それでも神鏡として安置された三種の神器の鏡
description: |-
  天皇のそばにまつられていた神鏡は、1040年の火事で、形を失いました。
  平安京の内裏は、960年、1005年、1040年と火事にあい、神鏡も焼けます。960年の火事で、宮中の神鏡が3枚あったことがわかり、1005年には3枚のうち1枚だけが残りました。そして1040年、神鏡は完全に壊れます。このときは新しく作る話は出ず、鏡だった破片と金属の粒が、そのまま神鏡として安置された、と斎木涼子さんの論文は書いています。神楽は三夜続けられました。
  剣と勾玉は、どんな旅をしたのか。本編は概要欄のリンクからどうぞ。
