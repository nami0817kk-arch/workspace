title: "築山殿と信康｜家臣の日記に残る、1579年8月"
yt_title: "家康は長男・信康をどうやって城から出したのか　その夏に家臣が書いた『家忠日記』の日付　築山殿と信康"
description: |-
  1579年8月、徳川家康は長男の信康を、どうやって城から出したのか。家康の家臣・松平家忠がその時に書いた『家忠日記』に、日付で残っています。
  8月3日、家康が浜松から岡崎へ来る。4日、親子の話し合いのあと、信康は大浜へ移される。9日、小姓5人を付けて遠江の堀江城へ。10日、三河の家臣たちは、信康とひそかに連絡を取らないと誓う起請文を出させられ、12日、家康は浜松へ帰りました。9月15日、信康は二俣城で自害します。21歳でした。
  本編では、『三河物語』『当代記』などの記録と4年前の謀反まで並べて、命じたのは信長か家康かを確かめています。本編は概要欄のリンクからどうぞ。
