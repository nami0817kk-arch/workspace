lines:
  # fact: tsukiyama-09
- 語り: "家康は、長男の信康を、どうやって城から出したのか。その夏の家臣の日記が、日付で残している。"
  shot: T07_1
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-09
- 語り: "家康の家臣、松平家忠の日記、『家忠日記』。1579年8月3日、家康が、浜松から、岡崎へ来る。"
  shot: T08_2
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-09
- 語り: "翌4日。親子のあいだで話し合いがあり、信康は、岡崎の南西、海に近い大浜へ移された。"
  shot: T09_3
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-09
- 語り: "5日、家忠は、家康に言われて、兵を連れて西尾へ向かう。家康も、西尾へ移った。"
  shot: T10_4
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-10
- 語り: "9日。小姓5人を付けて、信康は、大浜から、遠江の堀江城へ移される。"
  shot: T11_5
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-10
- 語り: "10日。三河の家臣たちは、信康とは、ひそかに連絡を取らない、と誓いの書を出させられた。"
  shot: T12_6
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-10
- 語り: "12日、家康は浜松へ帰る。岡崎の城には、家康の重臣が、留守役として入った。"
  shot: T21_7
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-14, tsukiyama-17
- 語り: "9月15日。信康は、遠江の二俣城で自害した。21歳。大浜へ移されてから、1か月と11日あとだった。"
  shot: T22_8
  tone: 重い
  pause: 0.12
- 語り: "では、信長が、腹を切らせよと命じた、という話は、いつ書かれたものなのか。"
  shot: T16_9
  tone: 疑問
  pause: 0.15
