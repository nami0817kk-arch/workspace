  A01: {scene: 天正14年5月11日 池鯉鮒の西の野。輿の列（左）と徳川の侍の一団（右）が向き合う遠景, pan: h}
  A02: {scene: 旭・胸から上（40代半ば・素朴な顔・淡い打掛）。初夏の野、後ろに輿, pan: zoom, crops: {face: [1.25, 0.52, 0.30], left: [1.18, 0.50, 0.35]}}   # 顔が上の方（0.52, 0.16）
  A03: {scene: 京を発つ嫁入りの行列（漆の輿が並ぶ）横長の遠景, pan: h}
  A04: {scene: 浜松城の婚礼。旭（右・白の打掛）と家康（左奥・横顔）, crops: {right: [1.18, 0.66, 0.45], left: [1.18, 0.38, 0.40]}}
  A05: {scene: 大政所・胸から上（70代前半・小柄・深いしわ）, pan: zoom, crops: {face: [1.25, 0.58, 0.32]}}
  A06: {scene: 天正14年10月 秋の街道を行く大政所の輿と護衛（後ろ姿）, pan: h}
  A07: {scene: 岡崎城の中庭の夕方。輿から出た大政所（右）が旭（左）に抱きつく, crops: {left: [1.18, 0.58, 0.42], right: [1.18, 0.68, 0.42], face: [1.25, 0.64, 0.38]}}   # 2人は中央やや右に寄って抱き合う
  A08: {scene: 岡崎の宿所の夕暮れ。軒下に暗く積まれた薪、遠くに侍の後ろ姿（火なし）, pan: h}
  A09: {scene: 駿府城と安倍川、遠くに富士（人物なし）, pan: h}
  A10: {scene: 天正16年6月 夜通し京へ向かう輿と松明（東海道）, pan: h}
  A11: {scene: 旭・夜の輿の中で母を案じる（小さな灯）, pan: zoom, crops: {face: [1.25, 0.5, 0.30]}}
  A12: {scene: 聚楽第の遠景（金箔瓦）、手前に京の町屋の屋根（人物なし）, pan: h}
  A13: {scene: 有馬の湯の町、湯けむり（人物なし）, pan: v}
  A14: {scene: 大政所が少年（秀忠・後ろ姿）の髪を結い直す, crops: {left: [1.18, 0.40, 0.35], right: [1.18, 0.58, 0.45]}}
  A15: {scene: 東福寺 南明院の高い所の五輪塔（秋・紅葉。人物なし）, pan: v}
  A16: {scene: 駿府 瑞龍寺の苔むした五輪塔（人物なし）}
  A17: {scene: 三溪園 寿塔の覆堂（遠景・木立に半分隠れる。人物なし）}
  A18: {scene: 終了画面用。夕暮れの野と松並木（右半分を空けた構図）, lock: [1.0, 0.5, 0.5]}
  K04: {scene: 数正の回の家康・書院の上座で厳しい顔（40代・胸から上）, pan: zoom, crops: {face: [1.25, 0.5, 0.40]}}
  K05: {scene: 数正の回の秀吉・金の襖の御殿に座る。笑みと鋭い目, crops: {face: [1.25, 0.5, 0.40]}}

