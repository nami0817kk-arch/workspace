# 物語型の本編（横 16:9）の見た目と絵の割り当て：旭姫と大政所（scripts/asahi-story.yaml）。chiso/storymain.py が読む。
# 10-26 作成。台本には手を入れない（承認・reading-ok 済み。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 18 枚（A01〜A18）＋数正の回の K04（家康）・K05（秀吉）をそのまま使う（新しく作らない）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は表情のある全面の AI 絵が主役。実在の絵（パブリックドメイン）は額（frame:）と屏風・絵図の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/asahi_ai_images.md
# 届く前は art_dir の仮の絵（A01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に A01.jpg〜を置くだけ。
# K04・K05 は out/story/kazumasa/main/ から out/story/asahi/main/（と ph/）へ写してある（out/ は git に入らないので、無ければ写し直す）。
script: scripts/asahi-story.yaml
out: asahi_story_main
art_dir: out/story/asahi/ph          # 仮の絵（placeholder）＋ K04・K05 の写し
main_art_dir: out/story/asahi/main   # Gemini の 16:9 の絵（A01.jpg〜A18.jpg）＋ K04・K05 の写し
ai_disclosure: この動画の人物・情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

