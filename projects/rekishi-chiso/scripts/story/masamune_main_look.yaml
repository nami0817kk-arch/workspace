# 物語型の本編（横 16:9）の見た目と絵の割り当て：伊達政宗（scripts/masamune-story.yaml）。chiso/storymain.py が読む。
# 10-28 作成（10/29 19:00 公開）。台本には手を入れない（承認前。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。見本は hidetsugu_main_look.yaml・rikyu_main_look.yaml。
# 絵の方針：AI 絵は 15 枚（M01〜M15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は表情のある全面の AI 絵が主役。実在の絵（パブリックドメイン。出典は台本の background / portrait の credit・caption と下の credits）は額（frame:）と絵図・版画の一部（part:）。
#   この回の決まり：AI 絵の政宗に眼帯を付けない（主題が「眼帯の肖像は一枚も無い」）。眼帯は M04（撮影所の小道具）だけ。肖像の話の行は実在の肖像（狩野安信・土佐光貞）を額で。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/masamune_ai_images.md
# 届く前は art_dir の仮の絵（M01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に M01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「M01（仮）」と場面を書いて作り直す（hidetsugu の ph と同じ形）。
# 広告の配慮：骨・亡骸・棺の中・目の処置の様子は描かない（M11 は穴の中を見せない）。
script: scripts/masamune-story.yaml
out: masamune_story_main
art_dir: out/story/masamune/ph          # 仮の絵（placeholder）
main_art_dir: out/story/masamune/main   # Gemini の 16:9 の絵（M01.jpg〜M15.jpg）
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

