# 物語完結型ショート 渋沢栄一のその後 s5（2026-11-26）。本編 scripts/shibusawa-story.yaml（12/2 19:00 公開予定、https://youtu.be/xSMj5-ITDdk）から。12/3 19:30 に予約。
# 形式は nakasendo_s1〜s5・majogari_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 渋沢栄一_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/shibusawa/main/ の K）の切り出しだけ。新しい絵は作らない。慶喜の葬儀の絵（K17）は僧侶・鳥居なし。
# 切り口：慶喜の死から、4度目の命日に仕上がった8冊と墓前の言葉まで（本編 第6章、shibusawa-02・12・14・28・34・35）。
# hook＝旧主の伝記はどの日に仕上がったか（答えはこのショートの中：大正6年11月22日、慶喜の4度目の命日）。
# tease＝初めに伝記を頼んだとき、慶喜は何と答えたか（答えは本編 序章・第3章：「どうぞ止めてくれ」。shibusawa-03）。
# 数え直し：慶喜 1837-10-28 生・1913-11-22 没＝76歳。明治26年（1893）の夏から秋 → 1913年11月＝20年あまり。
#   1913-11-22 → 1917-11-22＝ちょうど4年（4度目の命日）。→ 発行 1918年1月＝24年あまり。大正は新暦。季節は言わない。
# 理解テスト：①渋沢栄一が作らせた旧主・徳川慶喜の伝記の話 ②大正2年11月22日に慶喜が亡くなり、大正6年11月22日に8冊の印刷が仕上がった
#   ③渋沢は死に目に間に合わず、葬儀の総裁を務め、編纂を続けた。墓前では、公に仕えて世を終えるつもりだったと語った
#   ④大正7年1月に発行。頼んでから24年あまりだった
title: "渋沢栄一｜命日に仕上がった8冊"
yt_title: "徳川慶喜の4度目の命日に、渋沢栄一が作らせた伝記8冊が仕上がった　墓の前で語った言葉"
description: |-
  大正2年11月22日、最後の将軍・徳川慶喜は、小石川の屋敷で亡くなりました。76歳でした。渋沢栄一は急いで駆けつけましたが、間に合いませんでした。
  渋沢は葬儀の委員の総裁を務め、そのあとも慶喜の伝記の編纂を続けます。全8冊の印刷が仕上がったのは、大正6年11月22日。慶喜の4度目の命日でした。その朝10時、谷中の慶喜の墓の前で、本をささげる式が開かれ、渋沢は、フランスから戻ったころ、この身はただ公にお仕えして世を終えようと思った、と語りました。
  発行は大正7年1月。明治26年に伝記を頼んでから、24年あまりがたっていました（年数は記録から数え直したものです）。
  本編では、駿府の寺での再会から、慶喜本人に話を聞いた「昔夢会」まで、渋沢が旧主の伝記にかけた年月をたどっています。本編は概要欄のリンクからどうぞ。
