# 物語完結型ショート 徳川将軍の1日 s4（2026-11-06）。本編 scripts/shogun-story.yaml（11/9 19:00 公開、https://youtu.be/-kxBsJCne_k）の第5章から。11/10 17:30 公開。
# 形式は ooku_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵と小林清親《日光陽明門》・《徳川家茂像》。新しい絵は作らない。
# 切り口：御成の日の町の決まり（二階に人を置かない）、家重の雪隠の話、日光社参の最後（家慶）と家茂の229年ぶりの上洛。
#   鷹狩をやめた綱吉（shogun-56）は tease の答えとして本編に残す。紅葉山・浜御殿・吉宗の社参は使わない。
# どの将軍の記録か：雪隠の話は9代家重のころ（『江戸時代落書類聚』の宝暦10年の落書の注）。社参の最後は12代家慶。上洛は14代家茂。
# 事実カード：shogun-64・65・60・62・63。言い方は本編のまま。
#   ・日光社参19回・最後は天保14年＝1843年。上洛は寛永11年＝1634年→文久3年＝1863年＝229年ぶり（自分で計算し直した。本編どおり）。
# 理解テスト4問：
#   ①誰の話か：城の外へ出かける徳川将軍（9代家重・12代家慶・14代家茂）
#   ②どこで何が：御成の道筋の家は二階に人を置かない。家重は上野の帰りに小用で駕籠を寺へ戻させ、以後、道に仮の手洗いを3か所建てた
#   ③遠くへは：日光社参は19回で、最後は1843年の家慶
#   ④どうなったか：1863年の家茂の上洛は、家光以来229年ぶり
title: 徳川将軍｜城の外へ出られたのか
yt_title: 徳川将軍は江戸城の外へ出られたのか　二階に人を置かない御成の道と、家重の手洗い、229年ぶりの上洛
description: |-
  天下を治めた徳川将軍は、江戸城の外へ、出られたのでしょうか。
  出られました。将軍が出かけることを御成と呼びます。ただ、その日は町まで決まりで動きました。町奉行所の掛りの写本『御成』には、御成のとき、道筋の家の二階に人を置かない、とあります。9代家重のころには、上野の寛永寺から帰る途中、将軍が急に小用をもよおし、駕籠を寺まで引き返させたことがありました。将軍の駕籠を途中で返すのは、例のないことだったといいます。それからは、上野と増上寺への道に仮の雪隠（手洗い）を3か所建てた、と江戸の落書を集めた本の注にあります。遠くへの旅はまれでした。日光東照宮への日光社参は江戸時代を通じて19回で、最後は1843年の12代家慶。そして1863年、14代家茂が京都へ上りました。将軍の上洛は、3代家光以来229年ぶりでした。
  では、将軍家の鷹狩を、一度やめてしまった将軍は誰だったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川将軍', '#日本史', '#江戸時代']
ai_images: true
