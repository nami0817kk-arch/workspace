title: "ルイ14世｜昼の食卓に座れたのは王だけ"
yt_title: "ルイ14世の昼の食卓に、座れたのは王だけだった　王太子も立ったまま、弟は丸椅子"
description: |-
  昼1時、ルイ14世の食卓に座れるのは、王ひとりだけでした。サン=シモンによれば、寝室の四角い食卓で食べる「小さな食事」で、いちばん簡素な日でも、料理は3回に分けて出されました。編者ボワリルの注では1回分が5皿から7皿で、3回分を掛けると15皿から21皿です（掛け算は台本の計算）。
  主な廷臣と、顔の知られた人が入って、それを立ったまま見ていました。王太子とその息子も、王が椅子を勧めない限り立ったまま。王の弟だけは、王が「弟よ、さあ、お座りなさい」と言うと、背中の後ろに丸椅子が置かれ、ようやく座れました。
  死の7日前の1715年8月25日にも、ダンジョーは、王に昼食に人を入れる力が残っていた、と書いています。では、夜10時の大食卓には、誰が見に来たのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/FqHUnnLL6JM
