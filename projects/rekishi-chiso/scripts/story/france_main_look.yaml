#   実在の絵は Commons のパブリックドメイン（CC0 を含む）の絵画・版画。額（frame:）と一部（part:）で使い、全面の主役にしない。
#   この回の決まり：戦闘・負傷・遺体は描かない（バスティーユは建物と煙と遠景の群衆だけ）。
