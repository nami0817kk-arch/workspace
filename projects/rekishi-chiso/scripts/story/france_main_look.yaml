# 物語型の本編（横 16:9）の見た目と絵の割り当て：フランス革命（scripts/france-if-story.yaml）。chiso/storymain.py が読む。
# 10-31 作成（11/5 12:00 公開）。kurofune_main_look.yaml を写した。台本には手を入れない（承認のあと。変えると控えが外れる）。決まりは docs/story-main.md・スキル rekishi-story-screen。
# 絵の方針：AI 絵は 16 枚（F01〜F16。Cloudflare Workers AI の FLUX.1 schnell、無料枠。1024 正方形から 16:9 を切り出し）。
