# 形式は musashi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の「頼朝想像」「重成想像」は使わない）。
# 絵は本編の AI 絵（out/story/yoritomo/main/Q01〜Q15。人物は描かない）と実在の頁（国立公文書館蔵『吾妻鏡』第16巻）。新しい AI 絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/源頼朝_facts_20261029.yaml）：yoritomo-01・05・06・11・31・32・33・34・44
#   ・第15巻の最後の日付は解説で12月16日とも22日とも書かれる（05）→「私たちが開いた翻刻では22日」と言う。22日の記事は出どころ1つ（06）→「という」。
#   ・欠けた理由の3つの見方：五味文彦（31）・石井進（32、五味の紹介）・永井晋（33）。どれが正しいか決める史料は確かめられなかった。
#   ・兼実失脚・大姫の死は JBpress（44、出どころ1つ）→「と書く」。
# 理解テスト4問：
#   ①誰の話か：源頼朝と、鎌倉幕府の歴史書『吾妻鏡』
#   ②いつ・どこで何が：第15巻は1195年12月で終わり、第16巻は1199年2月から。亡くなった1月を含む約3年分の記事が無い
#   ③何が起きていたか：欠けた3年のあいだに、九条兼実の失脚（1196）と長女・大姫の死（1197）。再開した頁は、もう「故将軍」と呼ぶ
#   ④どうなったか：欠けた理由は3つの見方に割れ、決められる史料は調べた範囲では見つからなかった
title: 源頼朝｜幕府の歴史書から、最期の3年が消えている
yt_title: 源頼朝が亡くなった年は幕府の歴史書『吾妻鏡』から丸ごと消えている　欠けた3年
description: |-
  鎌倉幕府の歴史書『吾妻鏡』から、初代将軍、源頼朝が亡くなった1月を含む、およそ3年分の記事が欠けています。
  第15巻は1195年12月で終わり、次の第16巻は1199年2月から。第16巻の最初の頁には、「故将軍が亡くなってから、まだ20日も経たない」とあります。
  欠けた理由は、担当者がそこまでやらなかった、北条氏の作為で書けなかった、編集の途中で終わった、の3つの見方に割れています。どれが正しいと決められる史料は、調べた範囲では見つかりませんでした。
  本編では、『吾妻鏡』がどこで途切れているのか、京都の日記や橋の修理の記事まで、くわしくたどっています。
