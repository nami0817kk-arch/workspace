# 理解テスト4問：①鷹司家（近衛家から分かれた五摂家の一つ） ②1546年に跡継ぎなく絶え、1579年に信長の口添えで信房が再興 ③信房は二条晴良の三男。松殿家は1634年に道基が相続し一代摂家となり、1646年に再び絶えた ④次は江戸時代の幕府の決まり（本編5章）
title: "藤原道長の子孫｜信長がよみがえらせた摂関家"
yt_title: "織田信長が口添えでよみがえらせた摂関家とは　33年途絶えた鷹司家と、一代かぎりの松殿家"
description: |-
  1546年、天文15年。五摂家の一つ、鷹司家は、当主の忠冬に跡継ぎがいないまま、絶えました。33年後の1579年、織田信長の口添えで、信房という人が、鷹司の家名を再興します。信房は、二条晴良の三男。五つの家のあいだでは、養子が行き来していました。
  一方、松殿家は、江戸時代に、もう一度よみがえります。1634年、幕府は九条幸家の子の道基に、松殿家の相続を許しました。ところが、1641年には「一代摂家」という言葉が出てきて、道基1人かぎりの扱いに。道基は1646年、跡継ぎのないまま亡くなり、松殿家は再び絶えました。
  残った五つの家に、江戸時代、幕府は、どんな決まりを課したのか。本編は概要欄のリンクからどうぞ。
