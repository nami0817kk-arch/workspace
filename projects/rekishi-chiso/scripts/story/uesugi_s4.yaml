# 物語完結型ショート 上杉景勝と直江兼続のその後 s4（2026-11-19）。本編 scripts/uesugi-sonogo-story.yaml（11/23 19:00 公開予定、https://youtu.be/kjuSGhzZWyw）から。11/24 17:30 に予約。
# 形式は atsuhime_s1・tsukiyama_s5 を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（上杉景勝_facts_20261118.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/uesugi/main/ の U29＝庭の木の上の猿と縁側の大名の後ろ姿 ほか）と、本編で使った上杉景勝像（パブリックドメイン）だけ。新しい絵は作らない。
# 切り口：景勝の笑顔は一度だけ（本編 序章・第6章、uesugi-30・28）。食い違い③（近古史談 1864＝頭巾をかぶり木に登って3度うなずく／名将言行録＝景勝の座に上がって家来に指図するしぐさ）。
# hook＝何を見て笑ったのか（答えはこのショートの中：飼っていた猿のしぐさ。ただし本によって猿のしぐさが違う）。
# tease＝景勝の跡を継いだのは、いつ生まれた誰か（答えは本編 第4章・第6章：19年前、1604年に生まれた定勝）。
# 計算：景勝 1555年生まれ・1623年没＝数え69。1864−1623＝241＝240年ほど（名将言行録は明治初めの刊で、本編と同じく「どちらも240年ほどのち」）。
# 理解テスト：①上杉景勝の話 ②幕末の本に、景勝が一度だけ笑った話 ③飼っていた猿が頭巾をかぶって木の上でうなずいた（別の本では景勝の座で家来に指図するしぐさ） ④どちらも景勝の死から240年ほどのちの本
title: "上杉景勝｜笑顔は一度だけ"
yt_title: "上杉景勝の笑顔を、家来は一度しか見たことがない　何を見て笑ったのかは、本によって違う"
description: |-
  上杉謙信の跡を継いだ上杉景勝は、ふだん喜ぶ顔を見せなかった人です。家来が景勝の笑顔を見たのは一度だけ、という話を、幕末の学者・大槻磐渓が1864年の『近古史談』に書いています。飼っていた猿が、景勝の脱いだ頭巾をかぶって庭の木に登り、3度うなずいた、と。
  ところが岡谷繁実の『名将言行録』では、猿は景勝のいつも座る場所に上がり、家来に指図するようにうなずいた、とあります。どちらも、景勝の死から240年ほどのちの本です。
  本編では、30万石になった上杉家と直江兼続のその後をたどっています。本編は概要欄のリンクからどうぞ。
