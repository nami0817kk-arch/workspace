# 理解テスト4問：①クレオパトラ ②紀元前30年、エジプトを手に入れたオクタウィアヌスが大王の遺体は見て、プトレマイオス家の墓は見なかった ③「王を見たかったのであって、死体ではない」と答えた ④墓は2000年あまり見つかっていない（本編へ）

title: "クレオパトラ｜勝者が見なかった墓"
yt_title: "クレオパトラに勝った男は、大王の遺体は見て、王家の墓は見なかった　「私は王を見たかった」"
description: |-
  クレオパトラに勝ったローマのオクタウィアヌスは、紀元前30年、エジプトで、アレクサンドロス大王の遺体を石棺ごと祠から出させ、黄金の冠をのせ、花をまきました。ところが、プトレマイオス家の墓も見るかと聞かれると、スエトニウスによれば、こう答えました。「私は王を見たかったのであって、死体ではない」。
  クレオパトラも、プトレマイオス家の女王です。アントニウスと同じ墓に葬られた、と記録は書きます。けれど、その墓が町のどこにあるのかは、はっきり書いていません。
  死から2000年あまりたった今も、墓は見つかっていません。引用はスエトニウス『ローマ皇帝伝』の英訳（Thayer 版 Loeb）で読んだものです。
  勝者が見なかった墓は、どこにあるのか。本編は概要欄のリンクからどうぞ。
