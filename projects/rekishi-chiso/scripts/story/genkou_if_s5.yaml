# ・本編どおり。『世界大百科事典』の恩賞の書き方（59）、呉座勇一さんの絵詞の評価（58）、作った理由の推定（56）、所蔵の経緯（33：大矢野家・1890年献納・1989年国の所有・2021年国宝のうち尺のため1890年・三の丸尚蔵館・2021年）。
# ・「文永の役の翌年」は本編の言い方（年号の数え方は書かない）。服部英雄さんの指摘は nippon.com の紹介（21、出どころ1つ）なので「指摘している」とだけ言い、断定しない。
# ・本編の「永仁元年」の話・霜月騒動・徳政令は尺のため入れない。想像の台詞（季長想像）は使わない。
# 理解テスト4問：
#   ①誰の話か：竹崎季長（肥後の御家人）と『蒙古襲来絵詞』
#   ②いつ・どこで何が：文永の役の翌年に鎌倉で安達泰盛へ直訴し、海東郷の地頭職を得た
#   ③何が問題か：戦後の恩賞は十分でなく不満がつのった（防衛戦で新しい領地が乏しい）。季長が絵詞を作らせた
#   ④どうなったか：絵詞は1890年に皇室へ献納され2021年に国宝。神風を主張したのは寺社の側だったという指摘が、問いとして残る
title: 元寇｜竹崎季長の直訴と、「神風」は誰の言葉だったのか
yt_title: 竹崎季長は恩賞を求めて鎌倉へ　『蒙古襲来絵詞』と「神風は誰の言葉か」
description: |-
  文永の役の翌年、竹崎季長は、鎌倉へ赴き、御恩奉行の安達泰盛に直訴しました。そして、肥後の海東郷の地頭職を、恩賞として得ます。
  『世界大百科事典』は、戦後の恩賞は十分なものではなく、武士や寺社は不満をつのらせた、と書きます。防衛戦だったので、配るべき新しい領地が乏しかったのです。季長が作らせた『蒙古襲来絵詞』は、実際に戦った季長の証言にもとづくので、史料としての価値が高い、と呉座勇一さんは書きます。1890年に皇室へ献納され、2021年に国宝になりました。服部英雄さんは、寺社が神風を主張して恩賞を求めた面があり、戦った武士にはそうした感覚はなかった、と指摘しています。
  「神風」は、誰の言葉だったのか。この問いを掘り下げた本編は、概要欄のリンクからどうぞ。
