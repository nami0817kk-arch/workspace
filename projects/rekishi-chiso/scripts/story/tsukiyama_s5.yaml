title: "築山殿と信康｜築山殿の死の場所は、三つに割れる"
yt_title: "家康の正妻・築山殿はどこで命を落としたのか　浜松・小藪村・富塚の御前谷　記録で三つに割れる場所"
description: |-
  1579年8月29日、徳川家康の正妻・築山殿は、浜松の近くで命を落としました。その場所は、記録によって三つに割れています。
  『当代記』は、ただ「浜松で」。江戸幕府がまとめた家康の記録は、小藪村と書き、関わった家臣の名を野中重政とします。のちの記録は、浜松の西南、富塚の御前谷と伝えます。佐鳴湖の近くには、太刀洗の池と呼ばれる跡と碑があります。
  築山殿は浜松の西来院に葬られ、月窟廟は戦争で焼けて1978年の四百年忌に建て直されました。岡崎の八柱神社の首塚の五輪塔は、1977年に氏子たちが建て直したものです。本編では、家康の妻と息子がなぜ死んだのかを、記録を年の順に並べてたどっています。本編は概要欄のリンクからどうぞ。
