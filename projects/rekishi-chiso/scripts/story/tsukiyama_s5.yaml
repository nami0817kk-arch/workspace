lines:
  # fact: tsukiyama-15, tsukiyama-03, tsukiyama-14
- 語り: "家康の正妻、築山殿は、どこで命を落としたのか。記録は、三つに割れている。"
  shot: T22_1
  tone: 強調
  pause: 0.12
  # fact: tsukiyama-15
- 語り: "1579年8月29日。築山殿は、浜松の近くで、命を落とした。"
  shot: T21_2
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-14
- 語り: "戦国から江戸の初めを書いた、『当代記』は、ただ、浜松で、とだけ書く。"
  shot: T07_3
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-03
- 語り: "江戸幕府がまとめた家康の記録は、場所を小藪村と書き、関わった家臣の名を、野中重政とする。"
  shot: T16_4
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-15
- 語り: "のちの記録は、浜松の西南、富塚の御前谷と伝える。"
  shot: T22_5
  tone: 重い
  pause: 0.12
  # fact: tsukiyama-40
- 語り: "今、浜松の佐鳴湖の近くには、太刀洗の池と呼ばれる跡があり、碑が立っている。"
  shot: T11_6
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-40, tsukiyama-38
- 語り: "築山殿は、浜松の西来院に葬られた。その廟、月窟廟は、戦争で焼け、1978年、四百年忌に建て直された。"
  shot: T24_7
  tone: しみじみ
  pause: 0.12
  # fact: tsukiyama-41
- 語り: "岡崎の八柱神社には、築山殿の首塚がある。今の五輪塔は、1977年に、神社の氏子たちが建て直したものだ。"
  shot: T25_8
  tone: しみじみ
  pause: 0.12
- 語り: "では、息子の信康は、その秋、遠江のどこで、命を落としたのか。"
  shot: T23_9
  tone: 疑問
  pause: 0.15
