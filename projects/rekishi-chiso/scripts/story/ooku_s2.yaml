# 物語完結型ショート 大奥の奥女中 s2（2026-11-06）。本編 scripts/ooku-story.yaml（11/8 19:00 公開、https://youtu.be/28M-XkATUuY）の第2章から。11/9 12:30 公開。
# 形式は kakeizu_s2.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/ooku/main。FLUX、人物は後ろ姿・足もとだけ）と楊洲周延《千代田の大奥》。新しい絵は作らない。使わない絵は s1 の頭のコメント。
# 切り口：いちばん位の高い上臈御年寄より、御年寄の合力金が多い。いちばん下とは40倍。勤め（s1）・部屋方（s3）には踏み込まない。
#   別の記録の数（『御殿女中』の書付 100石・100両・15人扶持）は tease の答えとして本編に残す。
# 事実カード：ooku-34・01・31・32・78。言い方は本編のまま。
#   ・上臈御年寄 60両＜御年寄 80両 → 20両少ない。御半下 2両 → 80÷2＝40倍。本編どおり。
#   ・円は本編と同じ前提（日本銀行貨幣博物館：18世紀の1両＝米価で約6万円・大工の賃金で約35万円、幕末＝米価で約4千〜1万円）。
#     80×6万＝480万円、80×35万＝2800万円、80×4千〜1万＝32万〜80万円。合力金だけを換える（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：幕末の13代将軍家定付きの奥女中の給金
#   ②何が決まっていたか：切米・合力金・扶持の3つ。御年寄は切米50石・合力金80両・10人扶持
#   ③何が意外か：最も位の高い上臈御年寄の合力金は60両で、御年寄より20両少ない
#   ④どれほどの差か：いちばん下の御半下は合力金2両で、御年寄と40倍の開き
title: 大奥｜いちばん偉い女中が、いちばん多くもらったのか
yt_title: 大奥でいちばん位の高い女中が、いちばん給金が多かったのか　家定付きの奥女中の給金の表
description: |-
  大奥でいちばん位の高い女中は、給金も、いちばん多かったのでしょうか。
  奥女中の給金は、米で渡す切米、着物などのための金の合力金、毎日の米の扶持の3つでした。幕末の13代将軍家定付きの女中の表では、御年寄は切米50石・合力金80両・10人扶持。ところが、最も位の高い上臈御年寄の合力金は60両で、御年寄より20両少ないのです。いちばん下の御半下は、切米4石・合力金2両・1人扶持で、合力金は御年寄の40分の1でした。日本銀行貨幣博物館の目安で御年寄の80両だけを換えると、18世紀の米の値段なら約480万円、大工の賃金なら約2800万円、幕末の米の値段なら32万〜80万円。何と比べるか、いつの値段かで、桁まで変わります。
  では、別の記録では、上臈御年寄の給金はいくらだったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#大奥', '#日本史', '#江戸時代']
