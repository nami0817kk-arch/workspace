# 部品（from〜to の行、0 始まり。出ている間は絵を暗くする）
parts:
  - {type: quote, from: 28, to: 28, label: 史料, text: 今年必しづかにのぼりて世の事沙汰せんと思ひたりけり,
     source: 『愚管抄』の翻刻（慈円。個人サイトの翻刻）}
  - {type: quote, from: 31, to: 31, label: 史料, text: 朝家の大事何事に過ぐるや／怖畏逼迫の世か,
     source: 『明月記』建久10年1月18日条の翻刻（藤原定家。個人サイトの翻刻）}
  - {type: quote, from: 43, to: 43, label: 史料, text: この事故将軍薨御の後、未だ二十箇日を経ずと雖も,
     source: 『吾妻鏡』建久10年2月4日条の翻刻（個人サイトの翻刻）}
  - {type: quote, from: 64, to: 64, label: 史料, text: 還路に及び御落馬有り／幾程を経ず薨じ給いをはんぬ,
     source: 『吾妻鏡』建暦2年2月28日条の翻刻（個人サイトの翻刻）}
  - {type: quote, from: 66, to: 67, label: 史料, text: 全く橋建立の過に非ず／この上は一切不吉を称すべからず,
     source: 『吾妻鏡』建暦2年2月28日条の翻刻（個人サイトの翻刻）}
  - {type: quote, from: 114, to: 114, label: 要点, text: 頼朝の死が書かれなかった理由を、言い切れる史料は見つからなかった,
     source: 私たちの調べ（『吾妻鏡』が欠けた理由の見方は3つに割れている）}

