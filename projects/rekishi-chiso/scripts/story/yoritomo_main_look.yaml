# 絵の方針：AI 絵は 15 枚（Q01〜Q15）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は AI 絵に描かない（この回は全部が物・場所・遠景。馬は影・遠景だけ）。実在の肖像画（神護寺に伝わる、頼朝とされてきた絵。別人説がある。ウィキメディア・コモンズ、パブリックドメイン）は額（frame:）。
#   『吾妻鏡』の頁・京都の絵・旧相模川橋脚の写真・鶴岡八幡宮の写真は絵図の一部（part:）。
#   この回の決まり：最期（落馬・病・死）の場面に人物の絵を当てない（橋・川・馬の遠景・書物・灯だけ）。戦闘・負傷・遺体は描かない。実在の誰か・俳優に似せない（大河ドラマ・映画の頼朝にも似せない）。顔が分かるのは実在の肖像画の額だけ。
# AI 絵の指示の一覧（英語・姿の設定）：dev/output/rekishi-chiso/research/yoritomo_ai_images.md
# 届く前は art_dir の仮の絵（Q01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に Q01.jpg〜を置くだけ。
#   仮の絵は out/ にあり git に入らない。無ければ 1376×768 の灰色の板に「Q01（仮）」と場面を書いて作り直す。
script: scripts/yoritomo-story.yaml
out: yoritomo_story_main
art_dir: out/story/yoritomo/ph          # 仮の絵（placeholder）
main_art_dir: out/story/yoritomo/main   # Gemini の 16:9 の絵（Q01.jpg〜Q15.jpg）
ai_disclosure: この動画の情景の画像の多くは、画像生成AI（Google の Gemini・Black Forest Labs の FLUX.1）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

