# 物語完結型ショート 和宮 s4（2026-10-29）。本編 scripts/kazunomiya-story.yaml の第4章（慶応4年の書状「御取つぶし」なら「覚悟」）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の想像6は使わない）。
# 絵は本編の AI 絵（out/story/kazunomiya/main/W*.jpg。W13＝灯の下で手紙を書く尼の姿の和宮・横顔）と実在の絵（江戸城の写真・家茂の肖像）。
# 事実カード（dev/output/rekishi-chiso/research/和宮_facts_20261028.yaml）：kazunomiya-04・35
#   ・書状は慶応4年正月20日・橋本実梁（橋本少将）あて、海の見える杜美術館蔵（文化遺産オンラインの解説）。「御取つふし」は語りで「御取つぶし」と読む（本編と同じ）。
#   ・『近世日本国民史』（徳富蘇峰）の「御自發にて」は「みずから進んで」と今の言葉で（kazunomiya-04）。
#   ・家茂の大坂城での死・落飾・鳥羽伏見・慶喜が朝敵・江戸城の引き渡しは誰でも知っている流れ（本編も fact なし）。
# 理解テスト4問：
#   ①誰の話か：和宮（家茂の妻・夫の死後は静寛院宮）
#   ②いつ・どこで何が：慶応4年（1868）正月、鳥羽伏見で旧幕府の軍が敗れ、徳川慶喜が朝敵とされた。新しい政府の軍が江戸へ向かう
#   ③何を選んだか：正月20日、軍の総督・橋本実梁に手紙。徳川を「当家」と呼び、「御取つぶし」なら「覚悟いたし」と書いた。自ら進んで許しを願う動きも続けた（近世日本国民史）
#   ④どうなったか：4月、江戸城は戦いにならずに引き渡され、徳川の家は取りつぶされずに残った。書状は今、海の見える杜美術館にある
title: 和宮｜「御取つぶし」なら「覚悟いたし」
yt_title: 皇女和宮が徳川のために書いた手紙「御取つぶしなら、覚悟いたします」
description: |-
  慶応2年、1866年。和宮の夫、将軍家茂は、大坂城で亡くなりました。和宮は髪を下ろし、静寛院宮となります。
  慶応4年、1868年の正月。鳥羽と伏見で旧幕府の軍が敗れ、徳川慶喜は朝敵とされました。正月20日、和宮は、東海道を下ってくる軍の総督、公家の橋本実梁に手紙を書きます。
  徳川の家を、当家と呼び、朝敵の汚名を残すのは「実に残念」。そして、官軍が下って当家を御取つぶしになさるなら、私も「覚悟いたし」ます、と。この書状は、いま広島県の海の見える杜美術館にあります。
  徳富蘇峰の近世日本国民史は、和宮がみずから進んで、許しを願う動きを続けていたと書きます。その年の4月、江戸城は戦いにならずに引き渡され、徳川の家は残りました。
