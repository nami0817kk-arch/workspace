title: "加藤清正｜付き添ったのは家康の息子"
yt_title: "二条城の会見の迎えの場で、加藤清正が付き添ったのは秀頼ではなく家康の10歳の息子だった　会見の翌日に書かれた報告の手紙"
description: |-
  1611年3月、豊臣秀頼と徳川家康が会った二条城の会見。加藤清正は懐に短刀を隠して秀頼を守った、と江戸時代の軍記などが語ってきました。
  ところが、会見の翌日に家康の側近・本多正純が江戸へ送った報告の手紙では、迎えの場で清正が付き添っていたのは、家康の10歳の息子・頼宣です。一方、醍醐寺の僧・義演の日記によれば、帰り道の秀頼は伏見で清正のもとに立ち寄っています。
  本編では、この会見から3か月足らずで、清正がなぜ急に亡くなったのかを、当時の日記と江戸時代・明治の記録ごとに並べています。本編は概要欄のリンクからどうぞ。
