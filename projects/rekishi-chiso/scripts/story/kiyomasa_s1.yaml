lines:
  # fact: kiyomasa-11
- 語り: "加藤清正が、秀頼を迎える場で付き添っていたのは、秀頼ではなく、家康の、10歳の息子だった。"
  shot: K03_1
  tone: 強調
  pause: 0.12
  # fact: kiyomasa-10
- 語り: "1611年3月28日、豊臣秀頼は、京都の二条城で、徳川家康と会う。"
  shot: K05_2
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-21
- 語り: "清正は、懐に短刀を隠して、秀頼を守った。江戸時代の軍記などは、そう語ってきた。"
  shot: K04_3
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-09
- 語り: "前の日、秀頼を淀まで迎えに出たのは、家康の息子、12歳の義直と、10歳の頼宣。そして、池田輝政と、清正。"
  shot: K02_4
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-11
- 語り: "会見の翌日、家康の側近、本多正純が、江戸へ報告の手紙を送っている。"
  shot: K15_5
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-11
- 語り: "迎えの場で、義直には、浅野幸長が付き、頼宣には、加藤肥後守、つまり清正が付いた。"
  shot: K02_6
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-11
- 語り: "記録の上の清正は、家康の息子の付き添いだった。その娘は、のちに、この頼宣に嫁ぐ。"
  shot: K01_7
  tone: 重い
  pause: 0.12
  # fact: kiyomasa-12
- 語り: "それでも、帰り道の秀頼は、伏見で、清正のもとに立ち寄った。醍醐寺の僧、義演の日記にある。"
  shot: K07_8
  tone: しみじみ
  pause: 0.12
  # fact: kiyomasa-14
- 語り: "その会見から、3か月足らず。清正は、熊本で亡くなる。"
  shot: K08_9
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第2〜5章（kiyomasa-14・18・38・48）
- 語り: "あの清正は、なぜ、急に死んだのか。"
  shot: K12_10
  tone: 疑問
  pause: 0.15
