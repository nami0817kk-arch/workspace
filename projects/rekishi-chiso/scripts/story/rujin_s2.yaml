lines:
  # fact: rujin-26, rujin-27
- 語り: "流人の島、八丈島。その寺の過去帳には、餓死、という文字が、何度も出てくる。"
  shot: R21_1
  tone: 強調
  pause: 0.12
  # fact: rujin-23
- 語り: "流人には、食べ物の支給がない。自分で稼ぐ、自活が決まりだった。"
  shot: R08_2
  tone: しみじみ
  pause: 0.12
  # fact: rujin-27
- 語り: "地理学者の千葉徳爾さんは、1980年の論文で、村ごとの過去帳から、亡くなった人を、月ごとに数えた。"
  shot: R13_3
  tone: しみじみ
  pause: 0.12
  # fact: rujin-27
- 語り: "1701年、元禄14年の飢饉。末吉村の過去帳には、こう書かれた。この年、餓死人、過半これあり。"
  shot: R12_4
  tone: 重い
  pause: 0.12
  # fact: rujin-27（月は旧暦）
- 語り: "亡くなる人は、収穫の終わった11月から増えた。11月は8人。12月は9人。1月は14人。2月は16人。"
  shot: R12_4
  tone: 重い
  pause: 0.12
  # fact: rujin-27
- 語り: "3月から、ようやく減り始める。山や野の草が、食べられるようになったからだ、と千葉さんは見る。"
  shot: R09_5
  tone: しみじみ
  pause: 0.12
  # fact: rujin-26
- 語り: "1767年、明和4年。樫立村の過去帳の終わりには、こうある。以上、106人が、餓死で死んだ。"
  shot: R21_6
  tone: 重い
  pause: 0.12
  # fact: rujin-26（本編 第4章の言い方。過去帳は島の人と流人を分けていない）
- 語り: "ただ、過去帳は、島の人と流人を、分けて数えていない。飢饉で、流人が何人亡くなったのかは、分かっていない。"
  shot: R22_7
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第3章（rujin-25：サツマイモ。広めたのは名主の菊池秀右衛門）
- 語り: "では、島が始まって以来の苦しみを、初めて忘れさせた作物は、何だったのか。"
  shot: R07_8
  tone: 疑問
  pause: 0.15
