title: "八丈島の流人｜過去帳の「餓死」"
yt_title: "流人の島・八丈島の寺の帳面に、何度も出てくる言葉は「餓死」　過去帳が残す飢饉の年"
description: |-
  江戸時代の八丈島では、流人に食べ物の支給はなく、自分で稼いで食べるのが決まりでした。その島の寺の過去帳には、餓死という文字が何度も出てきます。
  地理学者の千葉徳爾さんは、1980年の論文で、村ごとの過去帳から亡くなった人を年ごと・月ごとに数えました。1701年の飢饉では、末吉村で60人以上が亡くなり、過去帳には「この年、餓死人、過半これあり」と書かれています。死者は収穫の終わった11月から増え、草が食べられるようになった3月から減りました。1767年の樫立村の過去帳には「右百六人餓死ニ而死ル也」とあります。
  ただ、過去帳は島の人と流人を分けて数えていません。本編では、流人の送られ方・住まい・仕事・水汲み女・島抜け・赦免まで、島に残った帳面と流人の記録でたどっています。本編は概要欄のリンクからどうぞ。
