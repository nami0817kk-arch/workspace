# 理解テスト：①漢の長城の兵の食べ物の話 ②2000年あまり前、長城の塞の倉と名簿 ③兵は前の月のうちにアワと塩を受け取った。アワは約67リットルとも約40リットルとも読める ④家族の分の名簿もあり、15歳の妻、62歳の母と1歳の子まで載っていた
title: "万里の長城｜兵のひと月の食べ物"
yt_title: "万里の長城の兵は何を食べていたのか　ひと月のアワと塩、名簿に残る15歳の妻と62歳の母と1歳の子"
description: |-
  2000年あまり前、漢の時代の長城の兵は、食べ物を塞の倉で受け取りました。ある名簿の1行には「砦の兵、張竟。塩を3升。12月の分のアワを、11月に、自分で受け取る」とあります。
  兵1人のひと月のアワは3石3斗3升あまり。記録の数のまま漢の升を当てれば約67リットル、大きな石に直せば約40リットルで、読み方が分かれています。塩はひと月に3升、今の塩で量ると1日30グラム近くです。
  名簿には家族の分もあり、第四隧の兵・伍尊の妻は15歳、別の名簿には62歳の母と1歳の子まで載っていました。
  本編では、兵の故郷から毎朝の見回り、のろし、秋の弓の試験、病と故郷へ帰る棺まで、木の札の記録で長城の兵の暮らしをたどっています。本編は概要欄のリンクからどうぞ。
