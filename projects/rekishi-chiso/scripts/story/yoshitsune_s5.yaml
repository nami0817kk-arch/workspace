# 物語完結型ショート 義経（もしも） s5（2026-11-13）。本編 scripts/yoshitsune-if-story.yaml（11/15 12:00 公開、https://youtu.be/AI_giM-Gij8）から。11/16 に予約。
# 切り口：九条兼実の玉葉が、義経を「義士」と呼び、のちにその死を「天下の悦び」と書いたこと（本編第4章。yoshitsune-11, 15, 04）。
# 計算：1185年11月3日→1189年5月29日＝3年半（本編は「4年前」）。台本は年数を言わず日付を並べる。1181→1185＝4年（さかのぼる）。
# 理解テスト4問：①九条兼実（京の公家・日記『玉葉』） ②1185年11月3日に義経が京を去った日、1189年5月29日に義経の死を聞いた日 ③前者は「義士と言うべきか」、後者は「天下の悦び、頼朝卿の運」と書いた。頼朝の守護・地頭は「言語の及ぶ所に非ず」、秀衡の陸奥守は「天下の恥」 ④衣川で何が起きたかは本編へ
# 事実は事実カード（dev/output/rekishi-chiso/research/源義経_facts_20261112.yaml）と本編の # fact: だけ。想像の台詞なし。「もしも」の話は「もしもの話」と言ってから。
# 絵は本編の AI 絵（out/story/yoshitsune-if/main の B 番号）の再利用だけ。新しい絵は作らない。B11（大物浦）・B07（平泉の町並み）・B17（蓮）は当てない。人物の顔・戦い・首・妻子の最期の絵なし。
# 吾妻鏡の1185〜89年の本文は読み下しで読んだもの（本編と同じ扱い）。干支は使わない。

title: "義経｜兼実は「義士」と書き、「天下の悦び」と書いた"
yt_title: "九条兼実は義経を「義士」と書き、その死を「天下の悦び」と書いた　玉葉の言葉"
description: |-
  京の公家、九条兼実の日記、玉葉。1185年11月3日、義経が頼朝に追われて京を去った日、兼実はこう書きました。「義経等の所行、実に以て義士と謂うべきか」。
  1189年5月29日、義経は泰衡に討たれたと聞いた兼実は、こう書きます。「天下の悦び何事かこれに如かず。頼朝卿の運」。兼実は頼朝にも厳しく、1185年11月、守護・地頭を置く願いが許されたと聞くと「言語の及ぶ所に非ず」と書きました。1181年、平氏が秀衡を陸奥守に任じたときは「天下の恥」です。
  兼実が悦んだ義経の最期。衣川では、何が起きたのか。本編は次のリンクからどうぞ。
