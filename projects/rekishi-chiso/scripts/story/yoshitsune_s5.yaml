lines:
  # fact: yoshitsune-15, yoshitsune-11
- 語り: "九条兼実は、義経を、《義士》と書いた。そして、その死を、《天下の悦び》と書いた。"
  shot: B18_in5
  tone: 強調
  pause: 0.12
  # fact: yoshitsune-15
- 語り: "兼実は、京の公家だ。その日記が、玉葉。この時代を知る、大きな手がかりになっている。"
  shot: B01_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshitsune-15
- 語り: "1185年、11月3日。義経が、頼朝に追われて、京を去った日。兼実は、書く。「義経らの所行は、実に、義士と言うべきか」。"
  shot: B13_in5
  tone: 重い
  pause: 0.12
  # fact: yoshitsune-11
- 語り: "1189年、5月29日。義経が泰衡に討たれた、と聞いた兼実は、書く。「天下の悦び、何事かこれに如かず。頼朝卿の運」。"
  shot: B14_left6
  tone: 重い
  pause: 0.12
  # fact: yoshitsune-04
- 語り: "だが、兼実は、頼朝にも、厳しかった。1185年11月、守護と地頭を置く願いが、許されたと聞くと、「言語の及ぶ所に非ず」と書いた。"
  shot: B01_right6
  tone: しみじみ
  pause: 0.12
  # fact: yoshitsune-15
- 語り: "さらに4年さかのぼる、1181年。平氏が、秀衡を、陸奥守に任じたときは、「天下の恥」と書いた。"
  shot: B08_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshitsune-10
- 語り: "兼実が、悦んだ、義経の最期。衣川では、何が起きたのか。"
  shot: B04_in5
  tone: 疑問
  pause: 0.15
