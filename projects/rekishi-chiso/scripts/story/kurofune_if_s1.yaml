# 形式は genkou_if_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。戦闘・負傷・死の絵なし。
# 絵は本編の AI 絵（out/story/kurofune-if/main/K01〜K15。人物は描かない）と実在の版画（paintings/sakoku_perry_*）。新しい絵は作らない。
# 事実カード（dev/output/rekishi-chiso/research/黒船_facts_20261031.yaml）：kurofune-if-28・30（本編の序章とまとめの言い方のまま）
# ・年月日の計算を自分でやり直した：1通目 1851年5月10日 → 2通目 1852年11月13日 は1年6か月3日＝本編の「1年半前」どおり。久里浜で渡したのは1853年7月14日（本編 第5章）。
# ・ウェブスターの「石炭は神の贈り物」は s4 に回す（同じ事実を2本に出さない）。オーリックが外された理由は本編に無いので言わない。
# ・最後は「もしも」を明示した問い（本編の導入の問いそのまま）。
# 理解テスト4問：
#   ①誰の話か：黒船の提督ペリーと、1人目の提督オーリック
#   ②いつ・どこで何が：1851年、国務長官が別の提督に日本との交渉を任せ国書を用意。1853年7月14日にペリーが久里浜で渡したのは1852年11月13日付の2通目
#   ③何が問題か：オーリックが解任され、ペリーがあとを継いだ。遠征は1851年に決まっていた
#   ④どうなったか：1通目の国書は日本に着かないまま残った。もしもペリーが来なかったら、を問いで閉じる
title: 黒船｜ペリーは、遠征の「代役」だった
yt_title: 黒船の提督ペリーは遠征の「代役」だった　1851年に用意された1通目の国書
description: |-
  黒船の提督ペリーは、実は、この遠征の「代役」でした。
  1851年、アメリカの国務長官は、別の提督オーリックに日本との交渉を任せ、国書を用意していました。1853年7月14日、ペリーが久里浜で渡した国書は、1852年11月13日付の2通目です。1通目の日付は1851年5月10日で、2通目より1年半も前に書き上がっていました。ところが、オーリックは解任され、あとを継いだのがペリーでした。日本へ向かう遠征は、1851年に、すでに決まっていたのです。
  もしも、ペリーが来なかったら。日本は、いつ、誰に、どんな形で開いたのか。この問いを、史料から掘り下げた本編は、概要欄のリンクからどうぞ。
