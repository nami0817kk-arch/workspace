# 物語完結型ショート 小栗忠順 s2（2026-11-05）。本編 scripts/oguri-story.yaml（11/6 19:00 公開、https://youtu.be/kU5JH7ybcrI）の第6章から。11/7 12:30 公開。
# 形式は jingi_s3.yaml（食い違いの表）を写した。決まりは docs/story-shorts.md。想像の台詞なし。斬首の場面の細部は描かない（首を斬りやすくした者の話・太刀・血は言わない、絵に出さない）。
# 絵は本編の AI 絵（out/story/oguri/main。人物は後ろ姿・遠景だけ）と小栗の肖像だけ。新しい絵は作らない。時代違いの物がある絵（O08・O09・O10・O12・O13・O17・O18・O03）は使わない（s1 の頭のコメント）。
# 切り口：取り調べはあったのか。藩の記録と小栗家の届けが正反対。「取り調べはなかった」とは言い切らない（両方を並べて、問いで閉じる）。
#   使いの年齢（s1）・命令書（s3）・家族（s4）・碑（s5）には踏み込まない。
# 事実カード：oguri-20・21・32・37・40・52。言い方は本編のまま。
#   ・閏4月6日＝西暦1868年5月27日（4月は29日まで。4月11日＝5月3日から数えて、閏4月1日＝5月22日、閏4月6日＝5月27日）。高崎市の年表（oguri-52）と同じ。本編どおり。
#   ・60秒に収めるため、届けの主の名（小栗仁右衛門）と3藩の名は語りから外した（概要欄には残す）。
#   ・出どころが1つの事実（oguri-20・32・37・40）は、記録・本の名を語りで言ってから言う。最期の言葉は「本ごとに違う」と言い、どちらも本の名を付ける。
# 理解テスト4問：
#   ①誰の話か：幕府の切れ者、小栗忠順の最期
#   ②いつ・どこで何が：1868年閏4月6日（今の暦で5月27日）の朝、上州の烏川の河原で斬られた
#   ③何が分かれているか：3藩の記録は「問いただし、罪を認めた」、小栗家の届けと『高崎市史』は「少しの尋ねもなく」「一つも尋ねず」
#   ④どうなったか：札の言葉・最期の言葉も記録ごとに違い、あの朝のことは今も一つに決まらない
title: 小栗忠順｜取り調べは、あったのか
yt_title: 小栗忠順は取り調べを受けたのか　藩の記録と小栗家の届けが正反対に書く1868年閏4月6日の朝
description: |-
  幕府の切れ者、小栗忠順の最期は、記録が正反対に分かれます。
  1868年閏4月6日、今の暦で5月27日の朝、小栗は上州の烏川の河原に引き出されました。吉井・高崎・安中の3つの藩の記録は、どれも問いただしたと書き、吉井藩の記録では、3藩の隊長が立ち会い、小栗は罪を認めたとあります。一方、小栗家の親族、小栗仁右衛門の届けには「少しの尋ねもなく」とあり、1927年の『高崎市史』も「一つも尋ねず」と書きます。立てられた札の言葉も、最期の言葉も、記録や本ごとに違います。
  記録ごとに違う「斬られた理由」は何だったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#小栗忠順', '#日本史', '#幕末']
ai_images: true
