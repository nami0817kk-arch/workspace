    pause: 0.12
  # fact: oguri-20
  - 語り: 1868年閏4月5日、上州の権田村。吉井藩の記録では、藩の兵が、小栗と家来3人を捕らえた。
    shot: O06
    tone: しみじみ
    pause: 0.12
  # fact: oguri-21, oguri-52
  - 語り: 翌6日の朝。今の暦で、5月27日。小栗は、烏川の河原に、引き出された。
    shot: O01
    tone: 重い
    pause: 0.12
  # fact: oguri-32
  - 語り: では、取り調べは、あったのか。
    shot: O02
    tone: 疑問
    pause: 0.12
  # fact: oguri-32
  - 語り: 3つの藩の記録は、どれも、問いただした、と書く。吉井藩の記録では、小栗は、罪を認めた。
    shot: Samurai
    tone: しみじみ
    pause: 0.12
  # fact: oguri-21
  - 語り: 一方、小栗家の届けは、こうだ。少しの尋ねもなく、家来3人とともに、斬首。
    shot: O02b
    tone: 重い
    pause: 0.12
  # fact: oguri-32
  - 語り: 1927年の、『高崎市史』も、一つも尋ねなかった、と書く。
    shot: O02c
    tone: しみじみ
    pause: 0.12
  # fact: oguri-40
  - 語り: 札の言葉も、違う。藩の記録では、叛状明白。東善寺の記録では、大逆を企てた。
    shot: O01b
    tone: 重い
    pause: 0.12
  # fact: oguri-37
  - 語り: 最期の言葉も、蜷川新の本ごとに違う。母と妻に寛大な扱いを、と頼んだ話。無礼をするな、と一喝した話。
    shot: O14
    tone: しみじみ
    pause: 0.3
    dip: true
  - 語り: 藩の記録と、家の届け。どちらが、あの朝を、伝えているのか。
    shot: O19
    tone: 疑問
    pause: 0.15
