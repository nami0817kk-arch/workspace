# 物語完結型ショート 邪馬台国はどこ？ s1（2026-11-07）。本編 scripts/yamatai-story.yaml（11/10 19:00 公開、https://youtu.be/cqLK1qEXpMw）の序章・第1章から。11/11 9:30 公開。
# 形式は shogun_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。
# 絵は本編の AI 絵（out/story/yamatai/main。Gemini）。新しい絵は作らない。
# 切り口：国の名前の字（刊本の邪馬壹国・後漢書・隋書）と、最初の使いの年（238か239）の2つの食い違い。
#   本編の答え（採点の1位・浮かび上がる場所）は明かさない。tease の答えは第8章（採点の結果）。
# 事実カード（dev/output/rekishi-chiso/research/邪馬台国_facts_20261107.yaml）：yamatai-14・20・23・12（古田武彦の論文は長さのため外した）。言い方は本編のまま。
#   ・239→2026 は1787年＝およそ1800年（本編どおり）。
# 理解テスト4問：
#   ①誰の話か：邪馬台国と、それを書いた『魏志倭人伝』（陳寿『三国志』の倭人の条）
#   ②何が起きているか：今に残る刊本は「邪馬壹国」と刷る。後漢書は邪馬臺国、隋書は邪靡堆
#   ③ほかに何が割れるか：卑弥呼の最初の使いの年。魏志は238年、日本書紀の注と梁書は239年
#   ④どうなっているか：名前の字も場所も、およそ1800年決まっていない
title: 邪馬台国｜名前は、記録のとおりなのか
yt_title: 邪馬台国の名前は記録のとおりなのか　今に残る『魏志倭人伝』の刷り本は「邪馬壹国」、使いの年まで割れている
description: |-
  学校で誰もが習う「邪馬台国」。その名前は、記録のとおりなのでしょうか。
  邪馬台国の名を記したいちばん古い記録は、3世紀の中国の歴史家、陳寿の『三国志』。日本で『魏志倭人伝』と呼ばれる部分です。ところが、今に残るその印刷された本には、「邪馬壹国」と刷られています。5世紀に書かれた『後漢書』は邪馬臺国、『隋書』は邪靡堆と書いて、魏志の言う邪馬臺だと添えます。
  食い違いは名前だけではありません。卑弥呼が魏に初めて使いを送った年も、いま伝わる魏志の本文は景初2年（238年）、720年の『日本書紀』が魏志を引いた注と7世紀の『梁書』は景初3年（239年）です。
  では、記録に書かれた「物」だけで説ごとに点を付けたら、どこが残るのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#邪馬台国', '#卑弥呼', '#日本史']
