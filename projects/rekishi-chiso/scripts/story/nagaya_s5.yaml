title: "江戸の長屋｜豆腐1丁は今の4丁分"
yt_title: "江戸の豆腐1丁は、今の豆腐の4丁分ほどの大きさだった　天保の改革で「1丁48文で売れ」と命じられ、小さく切る店が出た"
description: |-
  天保13年（1842年）の5月、天保の改革で、豆腐は1丁48文で売るよう命じられました。すると、小さく切って売る者が出ます。調べてみると、48文ではほとんど儲けが出ないことが分かりました。
  翌年の2月、町奉行所は52文への値上げを認め、1丁の大きさを決めます。縦7寸、横1尺8寸の箱で作り、9つに分けたものが1丁。東京都公文書館は、今の豆腐の1丁は江戸の豆腐の4分の1「小半丁」に近い、と書いています。
  本編では、家賃・水・トイレ・お風呂・食べ物・灯りまで、江戸の長屋の1か月がいくらだったかを積み上げています。本編は概要欄のリンクからどうぞ。
