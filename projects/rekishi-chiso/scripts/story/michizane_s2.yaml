# 物語完結型ショート 菅原道真の最期 s2（2026-11-26）。本編 scripts/michizane-story.yaml（11/30 19:00 公開予定、https://youtu.be/QF_rRUkAfhg）から。12/1 12:30 に予約。
# 形式は choujou_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 菅原道真_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/michizane/main/ の M）の切り出しだけ。新しい絵は作らない。
# 切り口：大宰府の南館の2年。『菅家後集』の「門を出でず」と「九月十日」（本編 第2章、michizane-06・07・08・28・56・09）。
# hook＝流された道真が大宰府で毎日拝んだもの（答えはこのショートの中：自分を流した天皇から賜った御衣）。
# tease＝恨む言葉を残さなかった道真が、なぜ祟る神と恐れられたのか（答えは本編 第4章〜まとめ。michizane-14・15・36）。
# 数え直し：左遷 901年正月 → 九月十日の詩は同じ901年の9月10日（「1年前の今夜」＝900年の重陽の翌日の宴）。死 903年2月25日、数え59歳（903−845+1）。
#   9月10日から死までは1年5か月あまりなので「2年後」とは言わない。季節は言わない（9月は旧暦で秋）。
# 伝説（飛梅・浄妙尼の餅）は使わない。観世音寺の鐘は「道真が聞いた鐘とされる」ので、言い切らず「詠んだ観音寺の鐘」とだけ言う。
# 理解テスト：①大宰府へ流された菅原道真の暮らしの話 ②901年から、九州の大宰府の南館 ③門を出ずに瓦の色を眺め鐘の音を聞き、9月10日の夜、天皇から賜った御衣を毎日拝むと詩に書いた ④その詩に恨みの言葉はなく、903年に59歳で亡くなった
title: "菅原道真｜大宰府で毎日拝んだもの"
yt_title: "菅原道真が大宰府で毎日拝んでいたのは、自分を流した天皇の衣だった　門を出なかった2年と、都を恨まない詩"
description: |-
  901年の正月、右大臣だった菅原道真は、九州の大宰府へ流されました。朝廷の命令は、道中の国々に、道真に食べ物も馬も出すなと命じています。住んだのは、大宰府の役所の南にあった南館と呼ばれる荒れた屋敷で、政務には関わらせてもらえませんでした。
  道真の詩集『菅家後集』の「門を出でず」には、「都府楼はわずかに瓦の色を看る、観音寺はただ鐘の声を聴く」とあります。観音寺（今の観世音寺）の鐘は、国宝として今も残っています。
  大宰府に来た年の9月10日の夜、道真は、1年前の今夜は清涼殿で天皇のそばにいた、そのとき賜った御衣は今ここにあり、毎日捧げ持って残り香を拝んでいる、と詩に書きました。
  本編では、左遷の日、59歳の死、都で続いた死と清涼殿の雷、そして学問の神様になるまでを、当時の記録でたどっています。本編は概要欄のリンクからどうぞ。
