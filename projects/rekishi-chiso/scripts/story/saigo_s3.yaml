# 物語完結型ショート 西郷隆盛 s3（2026-11-12）。本編 scripts/saigo-story.yaml（11/13 19:00 公開、https://youtu.be/19SEyS1d5CA）から。11/14 に予約。
# 形式は gosekke_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（dev/output/rekishi-chiso/research/西郷隆盛_facts_20261111.yaml）と本編の # fact: だけ。
# 絵は本編の AI 絵（out/story/saigo/main。人物は後ろ姿・遠景）と実在の錦絵（パブリックドメイン）。新しい絵は作らない。死・遺体の場面に人物の絵は当てない。
# 本編の弱点（JACAR は翻刻のみで原画像未確認・二次引用あり）：言えること＝「読めた電報の翻刻に〜とある」、言えないこと＝洞窟を出た時刻・倒れた場所・最期の言葉の形・首を隠した者・切腹か介錯か。断定しない。
# 切り口：洞窟を出た時刻と洞窟の数（本編1・4章）。午前4時＝観光案内、6時ごろ＝KAGOPIC。10時の電報は翻刻が途中で切れる→「と読める」。倒れた場所はウィキペディアの記述として。saigo-15, 16, 22, 23, 26。
# 理解テスト4問：①西郷隆盛と城山の洞窟 ②1877年9月24日、洞窟を出て岩崎口へ下った時刻 ③観光案内は午前4時、別府晋介の墓の解説は6時ごろ。洞窟の数も案内で9つとも11とも ④時刻も倒れた場所も記録は一つに定まらない。洞窟から岩崎口までに何があったか（本編へ）
title: "西郷隆盛｜洞窟を出たのは、何時か"
yt_title: "西郷隆盛が洞窟を出たのは何時か　午前4時とも6時ごろとも言われる城山の朝"
description: |-
  西郷隆盛が城山の洞窟を出た時刻は、午前4時とも、6時ごろとも言われます。観光の案内には4時とするものがあり、別府晋介の墓の解説は、6時ごろ、洞窟から岩崎口まで下ることを決めた、と書きます。
  洞窟の数も、案内によって9つとも、11とも書かれます。日本語版ウィキペディアは、今も残る洞窟に西郷が居住した記録は存在しない、と添えています。官軍の日記は6時ごろ、賊の塁を抜いた、と書きます。
  午前10時に田ノ浦から出た電報は、翻刻が途中で切れていますが、西郷は小銃に当たり、と読めます。洞窟を出た時刻も、倒れた場所も、記録は一つに定まりません。電報・日記は、アジア歴史資料センターの内容欄の翻刻を読んだもので、原画像までは確かめていません。翻刻には誤字や欠けがあります。
  洞窟から岩崎口までの間に、何があったのか。本編は概要欄のリンクからどうぞ。
