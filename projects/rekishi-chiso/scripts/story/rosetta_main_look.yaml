    pan: h
    crops: *id001
  C12:
    scene: 学者の書斎。机いっぱいに手書きの字母表の紙と拓本、羽ペン、本の山（昼の窓光。人物は後ろ姿）
    pan: h
    crops: *id001
  C13:
    scene: 古い図書館。羊皮紙の本が開かれ、不思議な絵文字の版画が見える（暖色のランプ、人物なし）
    pan: h
    crops: *id001
  C14:
    scene: 19世紀初めのイギリスの海辺の町の書斎。窓の外に海、机に石膏の型と紙の束（医者の机、人物は後ろ姿）
    pan: h
    crops: *id001
  C15:
    scene: 楕円の枠（カルトゥーシュ）の中に絵文字が並ぶ石の彫刻のクローズアップ。金色の光が当たる
    pan: h
    crops: *id001
  C16:
    scene: 1821年、ロンドンの河岸の埠頭。船から巨大な石のオベリスクが吊り下ろされる（曇り空、作業員たち）
    pan: h
    crops: *id001
  C17:
    scene: パリの書斎の朝。机に2つの楕円の枠の絵文字の写し絵と古い本。後ろ姿の人物1人
    pan: h
    crops: *id001
  C18:
