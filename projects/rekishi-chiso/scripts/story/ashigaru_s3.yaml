# 理解テスト：①戦国の北条家の、村の男を集める決まり ②危ないとき（1587年7月の決まりほか）、北条の領国の村で ③15〜70歳の男を根こそぎ集め、雨なら来なくてよい、良い者を隠せば首を斬る。それでも村は良い者を残した ④竹槍1本で侍の首を取り、侍になった百姓もいた
title: "雨なら来なくてよい｜北条家の足軽集め"
yt_title: "「雨なら来なくてよい」　戦国の北条家が村の男を根こそぎ集めた決まりと、それでも良い者を隠した村"
description: |-
  戦国の北条家には、村の男を集める決まりがありました。危ないときには、15歳から70歳までの男は身分を問わず出る。弓でも鑓でも鉄砲でも持って来い。良い者を村に隠したら、村の有力者の首を斬る。人数と武具を改める日が雨なら、来なくてよい。とどまるのは20日間。
  ところが、1587年7月の北条家の決まりには、良い者を村に残して、荷運びの人夫と変わらない者を差し出す村がある、と書かれています。一方で『北条五代記』には、竹槍1本で夜討ちに加わって侍の首を取り、侍に取り立てられた百姓の話が残ります。
  本編では、足軽が何を持たされ、何を食べ、何で傷を負ったかまで、『雑兵物語』とほかの記録でたどっています。本編は概要欄のリンクからどうぞ。
