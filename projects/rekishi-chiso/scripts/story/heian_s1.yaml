# 物語完結型ショート 平安貴族if s1（2026-11-27）。本編 scripts/heian-if-story.yaml（12/3 12:00 公開予定、https://youtu.be/WkZt_G7O2Mc）から。12/4 9:00 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 平安貴族if_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/heian_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：道長の祖父・藤原師輔の家訓『九条殿遺誡』の朝の決まりとお風呂の日（本編 序章・第3章、heianif-01・03・04・05・06・07）。
# hook＝お風呂はいつ入るか（答えはこのショートの中：5日に1度、日を選ぶ。1日は早死に・18日は盗賊・8日は長生き）。
# tease＝記録係のある役人が1年で休んだのは何日か（答えは本編 第3章：紀理綱は351日出勤、休みは約3日。heianif-11）。
# 年：『九条殿遺誡』は書いた年が分からないので、年も「いま」の札も年表も出さない（年の流れに入れない）。季節は言わない。
# 「小さな声で」（本編の第3章）は事実カードの引用（先起稱屬星名號七遍）に無いので言わない。
# 理解テスト：①道長の祖父・藤原師輔が子孫に残した家訓（九条殿遺誡）の話 ②平安貴族の朝の決まりとお風呂の日
#   ③お風呂は5日に1度、日を選ぶ（1日は早死に・18日は盗賊・8日は長生き）。朝は星の名を7回→鏡→暦で吉凶→楊枝と西を向いて手を洗う→昨日を暦に書く
#   ④そこまで済ませて粥。食事は朝と夕の2回
title: "平安貴族｜お風呂の日"
yt_title: "平安貴族のお風呂は5日に1度　1日に入ると早死に、18日は盗賊　藤原道長の祖父が残した家訓『九条殿遺誡』"
description: |-
  毎月1日にお風呂に入ると、早死にする。18日に入ると、盗賊に遭う。8日なら長生きする。藤原道長の祖父、藤原師輔が子孫に残した家訓『九条殿遺誡』の、お風呂の決まりです。お風呂は5日に1度、日を選んで入れ、とあります。
  朝の決まりも細かく、起きたらまず自分の星の名を7回唱え、鏡で顔を見て、暦でその日の吉凶を知り、楊枝を使って西を向いて手を洗い、仏の名を唱えます。昨日のことは暦に書き付け、そこまで済ませてようやく粥を食べました。髪をとかすのは3日に1度、手の爪は丑の日、足の爪は寅の日です。
  本編では、平安貴族の家に生まれた子の毎日を、生まれた日から出世の夜まで、道長の日記『御堂関白記』と同じ時代の記録でたどっています。本編は概要欄のリンクからどうぞ。
