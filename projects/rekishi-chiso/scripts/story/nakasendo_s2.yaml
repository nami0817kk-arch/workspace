# hook＝命がけと詠まれた木曽の桟は本当に危なかったか（答えはこのショートの中：益軒は頑丈な板橋で少しも危なくないと書いた）。
# tease＝寝覚の床は、なぜ江戸の旅人が見た姿と今とで違うのか（答えは本編 第3章：木曽ダムなどで水が減った、naka-35）。
# 数え直し：益軒の旅 貞享2年＝1685、安則 天保6年＝1835 → 150年。横2間＝約3.6m、長さ10間＝約18m（1間≒1.82m）。
# 益軒の旅は「江戸から西へ帰る旅」（序の題 東山道西帰之記、naka-62）。安則の旅は東向き。どちらも江戸→京都とは言わない。
# 理解テスト：①中山道の木曽の桟の話 ②1685年に益軒が、1835年に商人の西村安則が通った ③益軒は「少しも危ないことはない」と書き、安則は「命を的に」と詠んだ ④益軒の見た桟は、尾張の殿様が堅固に架けた板橋だった
title: "中山道｜命がけの橋は危なかった？"
yt_title: "芭蕉が「命をからむ」と詠んだ木曽の桟　貝原益軒は「少しも危ないことはない」と書いていた"
description: |-
  中山道の木曽の桟は、芭蕉が「かけはしや命をからむ蔦かつら」と詠んだ所です。今は長野県の名勝になっています。
  ところが、貞享2年、1685年にこの道を通った江戸前期の学者、貝原益軒は『木曽路之記』に、まるで違う姿を書きました。桟は木曽川に架けた橋ではなく、山のそばの道が途切れた所に架けた、幅2間、長さ10間の板橋で、両わきは石垣で固めてある。昔は危ない所だったようだが、今は尾張の殿様が堅固に架けているので、少しも危ないことはない、と。
  それから150年後の1835年、この桟に着いた近江の商人、西村安則は、それでも「命を的に、かけはしぞ憂き」と詠んでいます。
  本編では、安則の道中日記で、近江の日野から武蔵の吉川まで、峠と宿代を宿場ごとに追っています。本編は概要欄のリンクからどうぞ。
