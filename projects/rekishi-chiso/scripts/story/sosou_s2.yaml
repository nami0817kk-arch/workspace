# 絵は本編の AI 絵（out/story/sosou/main/S01・S06・S07・S08。人物なし）。曹操の顔・遺体・骨は描かない。
# 事実カード（dev/output/rekishi-chiso/research/曹操_facts_20261029.yaml）：sosou-05・20・21
#   ・『晋書』礼志（黄初3年の詔）は Wikisource で本文を開いた（sosou-05）→「書く」。詔の引用は一次史料。
#   ・柱穴・計画的な解体は周立剛の談話（澎湃新聞・2018年。sosou-21）→「2018年の報道によれば」。
#   ・「不封不樹」の解釈は周立剛と潘偉斌で割れる（sosou-20）→両方を並べて言い切らない（問いで閉じる）。
# 理解テスト4問：
#   ①誰の話か：曹操の墓（高陵）の上の御殿と、息子の曹丕
#   ②いつ・どこで何が：220年に曹操が葬られ、役人が御殿を建てた。222年、曹丕が詔で取り壊させた（『晋書』礼志）。2016〜17年の発掘で柱の穴が出た
#   ③なぜ壊したか：詔は「先帝の倹約の志に従うため」。発掘した側は意味が割れる（遺言に背いた／盗掘を防ぐため）
#   ④どうなったか：同じ柱の穴が、遺言に背いたとも遺言のとおりとも読める
title: 曹操｜墓の上の御殿は、息子の詔で壊された
yt_title: 曹操の墓の上の御殿は、息子の曹丕が壊させた　1800年後に出てきた「柱の穴」
description: |-
  曹操の墓の上にあった御殿は、息子の命令で取り壊されていました。
  唐の時代に編まれた『晋書』の礼志によれば、曹操が高陵に葬られると、役人たちは漢の例にならって、陵の上に祭りの御殿を建てました。ところが222年、息子の曹丕は詔を出します。「高陵の上の御殿は、すべて取り壊せ。先帝の倹約を尊ぶ志に従うためだ」。
  2016年11月から2017年5月の発掘で、墓の上から、千平方メートルを超える地上建築の跡が見つかりました。2018年の報道によれば、発掘を主導した周立剛さんは、柱の穴が楕円形で、柱を抜くときの跡だとして、計画的な解体だったと判断しています。
  ただし、その意味は発掘した側でも割れています。周さんは、建物があった以上、曹操の「封せず、樹ゑず」の遺言には背いたと見ます。発掘隊長の潘偉斌さんは、遺言は墳丘と碑のことで建物は関係がなく、壊したのは盗掘を防ぐためだと推しています。
