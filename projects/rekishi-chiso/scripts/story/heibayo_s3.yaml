# 切り口：秦は人を墓に従わせた国。従死の人数と、止めた年。計算：前384→前210＝174年（本編どおり）。
title: "兵馬俑｜人を墓に従わせていた国"
yt_title: "兵馬俑より前、秦は墓に人を従わせていた　66人、177人、186体の骨　献公は紀元前384年に従死を止めたが、理由は史記にない"
description: |-
  『史記』の秦本紀によれば、秦は、墓に人を従わせる従死を、長く続けた国でした。武公のとき66人、穆公のとき177人。景公の墓からは、殉じた人の骨が186体、見つかっています。
  献公の元年に従死は止められた、と史記は書きますが、理由は書いていません。では、俑は、人の代わりだったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/Q89Ua_ST728
