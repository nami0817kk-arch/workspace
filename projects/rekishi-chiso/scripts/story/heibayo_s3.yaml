lines:
  # fact: heibayo-A07
- 語り: "秦は、墓に、人を従わせる国だった。兵馬俑より前から。"
  shot: C02_1
  tone: 強調
  pause: 0.12
  # fact: heibayo-A07
- 語り: "『史記』の秦本紀によれば、武公のとき、初めて人を従死させた。従死者は、66人。"
  shot: C02_2
  tone: 重い
  pause: 0.12
  # fact: heibayo-A08
- 語り: "穆公が亡くなったときは、177人。秦の人は、これを哀しんだ、と書かれている。"
  shot: B01_3
  tone: 重い
  pause: 0.12
  # fact: heibayo-A10
- 語り: "発掘でも、確かめられた。景公の墓からは、殉じた人の骨が、186体、出た。"
  shot: C01_4
  tone: 重い
  pause: 0.12
  # fact: heibayo-A09
- 語り: "その秦で、献公の元年、紀元前384年とされる年に、史記は、従死を、止めた、と書く。理由は、一言も、ない。"
  shot: C01_5
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A09
- 語り: "紀元前384年から、始皇の死の、紀元前210年まで、174年。始皇の葬でも、従死は、命じられている。記録の上で、完全には、消えていない。"
  shot: B02_6
  tone: 重い
  pause: 0.12
  # fact: heibayo-A11
- 語り: "ある論文は、献公のとき、従死が止められ、これに伴って、陶俑が興った、と整理する。"
  shot: C02_7
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A11
- 語り: "ただし、俑が人の代わりだ、と書いた史料は、確認できていない。"
  shot: H01_8
  tone: 重い
  pause: 0.12
  # fact: heibayo-A12
- 語り: "では、俑のことを、あとの時代の専門家は、どう説明したのか。"
  shot: D01_9
  tone: 疑問
  pause: 0.15
