# 絵は本編の AI 絵（out/story/takasugi/main/T*.jpg。Gemini のみ）と実在の絵図。この回の決まり：AI 絵に高杉の顔は描かない。最期（病床・死）の場面に人物の絵は当てない。
# 事実カード（dev/output/rekishi-chiso/research/高杉晋作_facts_20261029.yaml）：takasugi-04・05・06・07・08
#   ・墓誌を遺言として書いた書状（大庭伝七あて）・墓誌の文・2016年の建立は出どころが高杉晋作Museum 1つ（takasugi-05・06・07）→「によれば」「という」で言う。
#   ・「東行墓」だけが刻まれた理由（葬儀の後に見つかった）は高杉晋作Museum・山口県観光連盟（takasugi-04）。清水山に葬られたのは takasugi-08。
#   ・なぜ挙兵の前に書いたかは史料で確かめられていない → 言い切らない（問いで閉じる）。
# 理解テスト4問：
#   ①誰の話か：幕末の長州藩士、高杉晋作の墓と墓碑銘
#   ②いつ・どこで何が：1864年12月、功山寺の挙兵の直前に、自分の墓に刻む言葉を大庭伝七あての書状に遺言として書いた。1867年に27歳で亡くなり、下関の清水山に葬られた
#   ③なぜ刻まれなかったか：墓誌は葬儀の後に見つかったため、墓石には「東行墓」だけが刻まれた
#   ④どうなったか：墓碑銘が碑になったのは、没後150年の2016年4月14日
title: 高杉晋作｜墓に刻まれたのは、三文字だけだった
yt_title: 高杉晋作の墓には「東行墓」の三文字だけ　自分で書いた墓碑銘は、150年後に碑になった
description: |-
  山口県下関市、東行庵。幕末の長州の英雄、高杉晋作の墓には、「東行墓」の三文字しか刻まれていません。ところが高杉は、自分の墓に刻む言葉を、自分で書き残していました。
  高杉晋作Museumによれば、書いたのは、1864年12月、功山寺で挙兵する直前のことです。大庭伝七にあてた書状に、遺言として記したといいます。高杉晋作Museumが紹介する墓碑銘は、「故、奇兵隊開闢総督、高杉晋作、則ち、西海一狂生、東行の墓」。裏には、「毛利家、恩ある古臣、高杉某の、嫡子なり」とあります。
  高杉が亡くなったのは1867年、27歳のとき。ところがその墓誌は葬儀の後に見つかったため、墓石には本人の号にちなんだ「東行墓」だけが刻まれた、といいます。墓碑銘が碑になったのは、没後150年の2016年4月14日でした。
