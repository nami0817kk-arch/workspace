# 切り口：『氷川清話』は勝の言葉そのままか（本編第5章）。吉本襄の書き換え（Wikipedia・C21）と慶喜の「誇張」評（B23）。
# 計算：1897-11-22→1899-01-19＝423日（本編と同じ。C20）。
# 理解テスト4問：①勝海舟の語りをまとめた『氷川清話』 ②1897年11月22日に初版、編者は吉本襄、423日前 ③吉本は伊藤・陸奥・松方の名を削り、伊藤批判を「今の政治家」に書き換えたとWikipediaは書く。海舟は計画を認めていた ④慶喜は海舟の談話に誇張があると評した（何をかは本編）
# 本編の弱点：C21・C23 は Wikipedia の抜き出しで本文未確認（本編と同じ扱い）。「と書く」「とある」と言う。
title: "勝海舟｜『氷川清話』は、海舟の言葉そのままか"
yt_title: "勝海舟『氷川清話』は本人の言葉そのままか　吉本襄が削った3人の名前と、慶喜の「誇張」評"
description: |-
  勝海舟の談話をまとめた『氷川清話』は、1897年11月22日に初版が出ました。編んだのは吉本襄で、海舟が亡くなる423日前です。
  Wikipediaによると、吉本は1896年以前の談話から伊藤博文・陸奥宗光・松方正義の名前を削り、1896年5月28日の『国民新聞』にあった伊藤への批判を「今の政治家」への批判に書き換え、知行合一の一文を付け加えました。一方、海舟はこの本の計画を認めていた、とされます。成り立ちの説明は、研究者やWikipediaで割れています。
  この点は、Wikipedia・飯田鼎の論文（1997年）・松岡正剛の解説などから確かめました。原談話の照合までは行っていません。
  では、徳川慶喜は、海舟の談話の何を「誇張」と評したのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/KIXtgjggYl0
