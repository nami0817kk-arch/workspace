# 物語完結型ショート コロンブス s5（2026-11-06）。本編 scripts/columbus-if-story.yaml（11/9 12:00 公開）の第6章（銀）から。11/10 18:30 公開。
# 形式は hojo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」は最後の問いだけ（答えは本編の第6章の終わり）。日本につながる入口の1本。
# 絵は本編の AI 絵（out/story/columbus-if/main/）と本編で使った実在の絵（南蛮屏風・『和泉名所図会』）だけ。
# 切り口：「日本の銀は世界の3分の1」とよく言われるが、一橋大学の研究班の2017年の推計では、日本の最盛期（1611〜1630年）は年平均77トン、
#   今のボリビアの銀山（1601〜1620年）は年200トン超。石見銀山は1533年に灰吹法が入り本格化、ポトシは1545年。ポルトガル船は生糸を2倍近い値で売った。
#   本編の答え（もしもの世界で鉄砲は来たか）は言わない。
# 事実カード：columbus-57・13・58・59。言い方は本編のまま。「3分の1」は割れる数なので、本編どおり「よく言われる」とだけ言う。
# 計算（自分で計算し直した）：200÷77＝2.6→2倍半を超える。140÷80＝1.75、150÷80＝1.875→2倍近い。
# 理解テスト4問：
#   ①誰の話か：日本の石見の銀と、今のボリビアのポトシの銀
#   ②いつ・どこで何が：1533年に石見銀山に灰吹法が入り、1545年にポトシで鉱脈が見つかった
#   ③数はどうか：日本の最盛期は年77トン、ボリビアの銀山は年200トン超で、日本の2倍半を超える
#   ④どうなったか：日本の銀を求めたポルトガル船は生糸を2倍近い値で売った。もしもの世界で種子島の鉄砲は来たか、の問いで閉じる（答えは本編）
title: 石見の銀｜世界の3分の1だったのか
yt_title: 日本の銀は世界の3分の1、とよく言われる　研究班の推計では日本は年77トン、今のボリビアの銀山は年200トン超
description: |-
  日本の銀は世界の3分の1、とよく言われます。島根県の石見銀山では、1533年に灰吹法という技術が入り、銀の生産が本格化しました。1545年には、今のボリビアの山、ポトシで銀の鉱脈が見つかります。
  一橋大学の研究班の2017年の論文の推計では、日本の最盛期の1611年から1630年は、年に平均77トン。同じ論文で、今のボリビアの銀山は、1601年から1620年に年200トンを超えていました。日本の2倍半を超えます。
  日本の銀を求めて来たのが、ポルトガルの船でした。島根県の資料によると、広東で80両の中国の白い生糸を、日本では140両から150両で売っています。2倍近い値です。
  もしもコロンブスが引き返していたら、種子島の鉄砲は、日本に来たのか。本編は概要欄のリンクからどうぞ。
