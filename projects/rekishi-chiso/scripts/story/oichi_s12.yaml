  - {at: 1604年, text: "1604年　家光", point: 1}
  - {at: 1620年, text: "1620年　和子", point: 2}
  - {at: 1629年, text: "1629年　明正天皇", point: 3}
timeline:
  - {label: "1583 北ノ庄"}
  - {label: "1604 家光"}
  - {label: "1620 和子"}
  - {label: "1629 天皇"}
cards:
  - type: table                          # 系図（語った順に1行ずつ書き込む）
    title: お市から、将軍の家と天皇の家へ
    from: 三女の江は
    until: 女性の天皇は
    items:
      - {at: 三女の江は, text: "お市　→　三女・江（秀忠の妻）"}
      - {at: 徳川家光, text: "江の子　→　家光（三代将軍）"}
      - {at: 1620年, text: "江の娘　→　和子（天皇の后）"}
      - {at: 明正天皇, text: "和子の娘　→　明正天皇"}
