shots:
  A01:                                   # 1文目：北ノ庄城の夜（城に残って生涯を閉じた）
    kind: ai
    file: oichi3/main/A01.jpg
    focus: [0.5, 0.5]
    move: in
    must: 篝火に囲まれた夜の天守（中央）
  A24:                                   # 娘3人を城の外へ（光の門）
    kind: ai
    file: oichi3/main/A24.jpg
    focus: [0.5, 0.5]
    move: up
    must: 光の門を出る娘3人の後ろ姿
  Go:                                    # 江の場面：頭巾の尼姿で顔の見えない肖像はやめ、江の後ろ姿の AI 絵に（10-25）
    kind: ai
    file: oichi3/main/A23.jpg
    focus: [0.5, 0.42]
    move: down
    must: 江の後ろ姿
  Hidetada:
    kind: real
    image: paintings/oichi_hidetada.jpg
    focus: [0.5, 0.35]
    move: down
    credit: "《徳川秀忠像》江戸時代（Wikimedia Commons・パブリックドメイン）"
    must: 秀忠（江の夫・家光の父）
  Edo:                                   # 家光・三代将軍＝江戸の城（江戸図屏風の城の部分）
    kind: real
    image: paintings/ieyasu_edo_zu_byobu_castle_detail.jpg
    focus: [0.5, 0.5]
    move: left
    credit: "《江戸図屏風》（部分）17世紀・寛永期（Wikimedia Commons・パブリックドメイン）"
    must: 江戸の城（家光の時代）
  Rakuchu:                               # 和子が天皇のもとへ（京都）
    kind: real
    image: paintings/nobunaga_rakuchu_uesugi_right.jpg
    focus: [0.5, 0.45]
    move: right
    bright: 0.85
    credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻（Wikimedia Commons・パブリックドメイン）"
    must: 京都の町と御所の辺り
  A21:                                   # 850年以上いなかった：記録を書く手元（年代の重み）
    kind: ai
    file: oichi3/main/A21.jpg
    focus: [0.45, 0.6]
    move: down
    must: 巻紙に書く手元と灯
  A23:                                   # 江はこの日を見ていない（後ろ姿）
    kind: ai
    file: oichi3/main/A23.jpg
    focus: [0.5, 0.5]
    move: up
    must: 江の後ろ姿
  A25:                                   # 最後の問い：月夜の城跡
    kind: ai
    file: oichi3/main/A25.jpg
    focus: [0.35, 0.5]
    move: right
    text_y: 0.74
    must: 月夜の北ノ庄の城跡と川
lines:
  - 語り: お市の方の血は、《!将軍の家》と、《!天皇の家》に入っていった。
    shot: A01
    tone: 強調
  - 語り: 1583年、お市は北ノ庄城で生涯を閉じ、三人の娘だけを、城の外へ送り出した。
    shot: A24
