# 物語完結型ショート s12（2026-10-25）。本編 scripts/oichi-story.yaml の第7章「まとめ：お市の血はどこへ」から（その後型）。投稿しない。
# 形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 理解テスト4問：
#   ①誰の話か：お市の方（織田信長の妹）と、その三女の江の子どもたち
#   ②いつ・どこで何が：1623年 江の子・家光が三代将軍に／1620年 江の娘・和子が後水尾天皇のもとへ／1629年 和子の娘が7歳で明正天皇に
#   ③なぜ：お市が北ノ庄城から送り出した三女の江が、徳川秀忠の妻になったから
#   ④どうなったか：お市の孫が将軍に、ひ孫が女性の天皇に。江はその3年前に亡くなっていた
# 事実と言い方は本編の第7章どおり（出典は oichi-story.yaml の頭）：
#   家光 1604生・母は崇源院（江）・1623 三代将軍（Wikipedia「徳川家光」）／和子 1607生・1620 入内・のちに中宮（Wikipedia「徳川和子」）／
#   明正天皇 1629（寛永6）数え7歳で位に・称徳天皇以来の女性の天皇・850年以上いなかった（コトバンク・Wikipedia「明正天皇」）／江は1626年に54歳で没 [W江]
title: お市の方の血｜将軍の家と、天皇の家へ
yt_title: お市の方の血は、将軍の家と天皇の家に入った【徳川家光・明正天皇】
description: |-
  1583年、お市の方は北ノ庄城で生涯を閉じ、三人の娘だけを城の外へ送り出しました。
  三女の江は、のちに徳川秀忠の妻になります。江の子の家光は、1623年に江戸幕府の三代将軍に。
  江の娘の和子は、1620年に後水尾天皇のもとへ入り、のちに中宮になりました。
  そして1629年、和子の娘が7歳で天皇の位につきます。明正天皇。奈良時代の称徳天皇のあと、850年以上いなかった女性の天皇でした。
  江はその3年前に亡くなっていて、この日を見ていません。
ai_images: true
art_dir: out/story/oichi3
out: oichi_story_s12
header_style: B
cta: 本編は概要欄から
bgm: true
sfx: false
bgm_diff_lu: 11
max_shots: 12
max_ai: 8
hook_clear: 0
min_block: 1.2
tone_speed: {しみじみ: 1.45, 重い: 1.47, 強調: 1.43, 疑問: 1.28}
voice: {speed: 1.38, intonation: 1.1, tone_strength: 0.75, max_intonation: 1.3, max_speed: 1.5}
header:
  tag: お市の方（織田信長の妹）
  title: "その血は、《将軍と天皇》の家へ"
now:
