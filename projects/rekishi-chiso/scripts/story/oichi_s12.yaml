  - 語り: 1629年、和子の娘が、7歳で天皇の位についた。明正天皇だ。
    shot: Rakuchu
    tone: 強調
    pause: 0.3
    dip: true
  - 語り: 女性の天皇は、奈良時代の称徳天皇のあと、850年以上いなかった。お市の《!ひ孫》が、その天皇になった。
    shot: A21
