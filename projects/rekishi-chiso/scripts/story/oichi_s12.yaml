  - 語り: 三女の江は、のちに、徳川秀忠の妻になった。
    shot: Go
    tone: しみじみ
    pause: 0.12
  - 語り: 1604年、江は男の子を産んだ。のちの、徳川家光だ。
    shot: Hidetada
    tone: しみじみ
    pause: 0.12
  - 語り: 1623年、家光は、江戸幕府の三代将軍になった。お市の《孫》が、将軍になった。
    shot: Edo
    tone: 強調
    pause: 0.12
  - 語り: 江は、娘の和子も産んでいた。
    shot: Go
