title: "足利義満｜日本国王に封じられたのは、いつ"
yt_title: "足利義満が日本国王に封じられたのは、いつか　1402年か1404年か　明の記録はこう書く"
description: |-
  足利義満は、明の皇帝から、日本国王と呼ばれました。ところが、封じられたのがいつかは、1402年か1404年かで、割れています。
  1401年、義満の国書の書き出しは、日本准三后。これに答えた1402年の詔で、日本国王、源道義、と呼んだのは、明の側でした。村井章介さんは、2018年の論文で、1404年説が有力になっていると紹介し、その読み方は厳密ではないと批判しています。
  義満の死の知らせが明に届いたのは、明実録の永楽6年12月17日の条、西暦では1409年1月2日ごろ。明は、諡を恭献とし、子の義持を日本国王に封じました。本編は次のリンクからどうぞ。
  https://youtu.be/6dJB0Rq7yeY
