lines:
  # fact: yoshimitsu-27
- 語り: "足利義満が、日本国王に封じられたのは、いつか。記録は、年を割る。"
  shot: S11_in5
  tone: 強調
  pause: 0.12
  # fact: yoshimitsu-36
- 語り: "1401年、義満の国書の書き出しは、日本准三后。これに答えた、1402年の詔で、日本国王、源道義、と呼んだのは、明の側だった。"
  shot: S12_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-27
- 語り: "村井章介さんは、2018年の論文で、1404年説が有力になっている、と紹介する。"
  shot: S11_left7
