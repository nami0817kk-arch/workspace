  pause: 0.12
  # fact: yoshimitsu-27
- 語り: "ただし、村井さんは、その読み方は、厳密ではない、と批判している。"
  shot: S13_in5
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-26
- 語り: "明史が、日本国王に封じた、とはっきり書くのは、子の義持のほうだ。"
  shot: S12_right3
  tone: 重い
  pause: 0.12
  # fact: yoshimitsu-22
- 語り: "明実録、永楽6年12月17日の条。西暦では、1409年1月2日ごろ。義持が、父の死を告げると、明は、諡を、恭献とした。"
  shot: S11_right3
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-22
- 語り: "明は、義持を、日本国王に封じる詔も、送った。"
  shot: S06_in5
  tone: しみじみ
  pause: 0.12
  # fact: yoshimitsu-26
- 語り: "義満は、明から見れば、日本の王。朝廷から見れば、前の太政大臣。同じ人が、内と外で、違う名で呼ばれた。"
  shot: SEND_in5
