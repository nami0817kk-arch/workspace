# 切り口：衝突のちょうど2時間前、メサバ号の氷の警報は無線室に届いていたが、英国の報告書は船長にも士官にも届いたとは見られないとした（本編は「船橋」。船橋は読みがフナバシになるので、ショートでは使わない）。ボルチック号の警報は海図室に貼られるまで5時間33分。
# 計算（自分で数え直した）：23:40−21:40＝2時間ちょうど（A-10）／13:42→19:15＝5時間33分（A-11）
