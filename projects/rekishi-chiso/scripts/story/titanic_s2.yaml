lines:
  # fact: A-10
- 語り: "氷山に当たる、ちょうど2時間前。夜9時40分、タイタニックの無線室に、氷の警報が届いていた。"
  shot: S02_1
  tone: 強調
  pause: 0.12
  # fact: A-10
- 語り: "メサバ号からの知らせだ。重い氷原と、大きな氷山がたくさん、という内容だった。"
  shot: S03_2
  tone: 重い
  pause: 0.12
  # fact: A-10
- 語り: "ところが、英国の報告書は、この警報が、船長にも、当直の士官にも、届いたとは見られない、と判断した。"
  shot: S05_3
  tone: 重い
  pause: 0.12
  # fact: B-18
- 語り: "この日、氷の警報は、何通も入っていた。英国の報告書は、5通を数える。"
  shot: S13_4
  tone: しみじみ
  pause: 0.12
  # fact: A-11
- 語り: "ボルチック号の警報は、午後1時42分ごろ、船長に届いた。船長は、ほぼすぐ、運航会社の代表、イズメイに渡した。"
  shot: S05_5
  tone: しみじみ
  pause: 0.12
  # fact: A-11
- 語り: "海図室に貼られたのは、午後7時15分。船長に届いてから、5時間33分あとだ。"
  shot: S04_6
  tone: 重い
  pause: 0.12
  # fact: A-12
- 語り: "アメリカ号の警報は、ワシントンの水路部にあてた電報だった。無線室の外の誰も、知らなかった、と英国の報告書は認めている。"
  shot: S02_7
  tone: しみじみ
  pause: 0.12
  # fact: A-10
- 語り: "無線室まで来ていた警報は、なぜ、船長たちに届かなかったのか。"
  shot: S07_8
  tone: 疑問
  pause: 0.15
