yt_title: "タイタニック　氷山に当たる2時間前、氷の警報は無線室に届いていた　英国の報告書は「船長にも士官にも届いたとは見られない」"
description: |-
  タイタニックが氷山に当たる、ちょうど2時間前。夜9時40分に、メサバ号の氷の警報が、無線室に届いていました。英国の報告書は、この警報が、船長にも当直の士官にも届いたとは見られない、と判断しています。
  その日の氷の警報を、英国の報告書は5通数えます。ボルチック号の警報が海図室に貼られたのは、船長に届いてから5時間33分あとでした。
  本編では、衝突から沈没までの2時間40分を、無線の記録と英米2つの調査から、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SdhomuxqfF4
