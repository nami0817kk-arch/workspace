# 物語完結型ショート 石川数正 s2（2026-10-26）。本編 scripts/kazumasa-story.yaml の第5章（16日後の大地震）から。投稿しない。
# 形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazumasa/main/K*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml）：kazumasa-01・04・12・26・30・39・50
#   ・秀吉の指図（正月15日より前に大垣城まで出向く）は『一柳家文書』（香原斗志・呉座勇一が紹介。kazumasa-30）。
#   ・大垣城の全壊・焼失は岐阜県防災課（kazumasa-26）。帰雲城は「埋まったと伝わる」（300人は言わない＝伝承の数）。
#   ・規模 M7.8〜8.0 は松浦律子 2011 の見積もり（出どころ1つ → 研究者の名で言う）。秀吉が大坂へ退いたのはフロイスの書簡（kazumasa-39、1つ → 「と書いている」）。
#   ・地震が徳川攻めを止めたか：鎌田浩毅・呉座勇一は止めたとし、眞邊明人は疑問（kazumasa-04）→「見方は分かれている」。
#   ・日付は和暦（天正13年11月13日・11月29日・天正14年正月）。地震だけ「西暦では1586年1月」を足す（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：石川数正（徳川家康の重臣）が秀吉のもとへ走った、その直後の話
#   ②いつ・どこで何が：天正13年11月29日の夜、中部から近畿を天正地震が襲った（出奔の16日後）
#   ③秀吉は何を決めていたか：翌年の正月に家康を討つ。正月15日より前に大垣城まで出向く（一柳家文書）
#   ④どうなったか：大垣城は全壊して焼け、秀吉も大坂へ退いた。正月の徳川攻めは行われなかった（地震が止めたかは見方が分かれる）
title: 石川数正｜出奔の16日後、大地震が来た
yt_title: 石川数正が去って16日後、秀吉の徳川攻めの前に天正地震が来た【大垣城】
description: |-
  天正13年11月13日の夜、徳川家康の重臣・石川数正は、岡崎城を出て、羽柴秀吉のもとへ移りました。
  数正を迎えた秀吉は、翌年の正月に家康を討つと決めます。『一柳家文書』には、正月15日より前に大垣城まで出向くので準備を怠るな、という指図が残っています。
  出奔の16日後、天正13年11月29日の夜、天正地震が中部から近畿を襲いました。岐阜県の資料によれば、大垣城は全壊して焼けました。
  正月の徳川攻めは、行われませんでした。地震が止めたのか、秀吉が別の道を選んだのか。研究者の見方は分かれています。
