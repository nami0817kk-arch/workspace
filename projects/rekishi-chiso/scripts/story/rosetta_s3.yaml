lines:
  # fact: rosetta-B07
- 語り: "ロゼッタストーンの写しは、3年ほど、外国人に、ほとんど渡らなかった。"
  shot: C07_1
  tone: 強調
  pause: 0.12
  # fact: rosetta-B07
- 語り: "ところが、フランスの学者は、写しを、外国人に渡すのを、急がなかった。"
  shot: C06_2
  tone: 重い
  pause: 0.12
  # fact: rosetta-B07
- 語り: "スウェーデンのオーケルブラードは、1800年10月、デンマークの学者への手紙に、書いている。フランスの学者は、写しを外国人へ急いで渡したがらない、と。"
  shot: C08_3
  tone: しみじみ
  pause: 0.12
  # fact: rosetta-B07
- 語り: "フランスの大学者ド・サシも、同じ学者に詫びた。学士院の気に障るので、ギリシャ語の写しすら、渡せない、と。"
  shot: C06_4
  tone: 重い
  pause: 0.12
  # fact: rosetta-B09
- 語り: "デモティックとヒエログリフの版が刷られたのは、1803年の4月末から5月。発見から、3年9か月から10か月後だ。"
  shot: C12_5
  tone: 重い
  pause: 0.12
  # fact: rosetta-B09, rosetta-B14
- 語り: "その1803年5月、英仏の戦争が、再開した。1803年から1815年、12年のあいだ、手紙も旅も妨げられた。"
  shot: C20_6
  tone: 重い
  pause: 0.12
  # fact: rosetta-B33
- 語り: "では、23年のうち、残りの年月は、どこで消えたのか。"
  shot: C12_7
  tone: 疑問
  pause: 0.15
