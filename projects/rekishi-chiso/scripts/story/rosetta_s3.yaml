# 本編の最後の「解いたのは誰か」の答えは、このショートでは明かさない。
title: "ロゼッタストーン｜写しが外へ出なかった3年と、戦争の12年"
yt_title: "ロゼッタストーンの写しは、3年ほど外国人へ渡らなかった　さらに英仏の戦争が12年　スウェーデンの学者は「考えられないほど放置された」と書いた"
description: |-
  ロゼッタストーンが見つかったあと、カイロの研究所は、3つの方法で写しを作りました。それでもフランスの学者は、写しを外国人へ渡すのを急がず、1799年から3年ほどのあいだ、外国人が読める写しは、ほとんどありませんでした。
  デモティックとヒエログリフの版が刷られたのは、1803年の4月末から5月。その5月に英仏の戦争が再開し、1803年から1815年の12年、新しい写しの行き来は滞りました。
  では、23年のうち、残りの年月は、どこへ行ったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/ULryhFAAhgQ
