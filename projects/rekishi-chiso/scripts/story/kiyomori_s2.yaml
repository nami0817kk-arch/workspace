lines:
  # fact: kiyomori-A11
- 語り: "都を置くには、まず、土地が要る。ところが、福原には、それが足りなかった。"
  shot: B06_1
  tone: 強調
  pause: 0.12
  # fact: kiyomori-A11
- 語り: "1180年6月9日、貴族たちは、和田へ遣わされ、都にする土地を見定めた。"
  shot: T01_2
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-A11
- 語り: "百錬抄は、左京は、碁盤の目の区画、条里が不足、右京はない、と書く。"
  shot: B06_3
  tone: 重い
  pause: 0.12
  # fact: kiyomori-A11
- 語り: "平家物語は、一条から五条までしか、場所がなく、それより下は無かった、と書く。"
  shot: B06_4
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-B25
- 語り: "鴨長明は、方丈記に、その地ほど狭くて、条里を割るにたらず、と書く。遷都の32年あとだ。"
  shot: B14_5
  tone: しみじみ
  pause: 0.12
  # fact: kiyomori-A12
- 語り: "6月15日、九条兼実は、左京の区画が、平安京より、ほとんど過半、減ると答えた。"
  shot: B17_6
  tone: 重い
  pause: 0.12
  # fact: kiyomori-A13
- 語り: "同じ日、清盛の義弟の時忠は、和田は町の数が狭い、小屋野を、その地にせよ、と仰せ下した。"
