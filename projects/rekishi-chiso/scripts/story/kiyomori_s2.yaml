title: "福原遷都｜都にする土地が、足りなかった"
yt_title: "福原遷都　都にするはずの土地は、碁盤の目が五条までしか取れなかった　和田・小屋野・印南野と、候補地は2日で動いた"
description: |-
  1180年6月9日、貴族たちは和田へ遣わされ、都にする土地を見定めました。百錬抄は、左京は条里、つまり碁盤の目の区画が不足し、右京はない、と書きます。平家物語も、一条から五条までしか所がなかった、と書きます。
  6月15日、清盛の義弟の時忠は、和田は町の数が狭い、小屋野をその地にせよ、と仰せ下しました。2日後の6月17日には、話は播磨の印南野に変わっていました。
  都は、結局、どこに置くつもりだったのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SmAJSk6zrYk
