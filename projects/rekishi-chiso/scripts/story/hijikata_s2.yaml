lines:
  # fact: hijikata-71
  - 語り: 新選組の土方歳三は、京へ上る前、自分の句集から、恋の句を、《!消した》。
    shot: J03
    tone: 強調
  # fact: hijikata-75
  - 語り: 歳三は、多摩の石田村の生まれ。家の薬を、得意先へ届ける、若者だった。
    shot: J02
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-03
  - 語り: 俳号は、豊玉。1863年に京へ上る前に、自分の句を、一冊にまとめた。
    shot: Tama
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-71
  - 語り: 子孫の土方愛さんによれば、その句集には、恋の句を消して、格調の高い句に、書き直した跡がある。
    shot: J03r
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-71
  - 語り: 京へ行く前に、恋の句など、よんでいる場合ではない。そう思ったのだろう、と愛さんは話す。
    shot: Sanjo
    tone: 強調
    pause: 0.12
  # fact: hijikata-72
  - 語り: ところが、京へ行って、半年ほどたったころ。歳三は、芸妓や舞妓と、なじみが深くなったようだ、と愛さんは語る。
    shot: Shijo
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-72
  - 語り: もらった恋文を、多摩の親類へ送ったとき、末尾に添えた句が、こうだ。
    shot: J03l
    tone: しみじみ
    pause: 0.12
  # fact: hijikata-72
  - 語り: 「報国の、心を忘るる、婦人かな」。国に尽くす心を、忘れさせる女たち。冗談めかした句にも、聞こえる。
    shot: Tama2
    tone: 強調
    pause: 0.3
    dip: true
  - 語り: 恋の句を消した若者は、京で、もらった恋文を、ふるさとの親類へ、送っていた。
    shot: Tama
    tone: しみじみ
    pause: 0.15
  - 語り: あなたは、消した句と、送った句、どちらが歳三の《素顔》だと、思いますか。
    shot: PhotoQ
    tone: 疑問
    pause: 0.15
