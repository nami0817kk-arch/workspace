# 物語完結型ショート 土方歳三 s2（2026-10-29）。本編 scripts/hijikata-story.yaml の第1章（豊玉発句集の恋の句）と第2章（京から送った句）から。
# 形式は masamune_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（out/story/hijikata/main/J*.jpg）と実在の絵（広重の玉川・京の絵）・洋装の写真。
#   この回の決まり：AI 絵の土方は後ろ姿か影だけ。顔が分かるのは実在の写真だけ。愛さんの恋文の束（後から足した行）は使わない。
# 事実カード（dev/output/rekishi-chiso/research/土方歳三_facts_20261029.yaml）：hijikata-03・75・71・72
#   ・恋の句を消した跡と「京へ行く前に詠んでいる場合ではない」は土方愛さんの話（hijikata-71）→ 愛さんの名で言う。
#   ・報国の句は愛さんの紹介（hijikata-72。もらった恋文を親類へ送ったとき末尾に添えた句。恋文への返事ではない）。
# 理解テスト4問：
#   ①誰の話か：土方歳三（新選組の副長）
#   ②いつ・どこで何が：1863年に京へ上る前、自分の句集に、恋の句を消して書き直した跡がある
#   ③なぜか：子孫の土方愛さんは、京へ行く前に恋の句をよんでいる場合ではない、と思ったのだろうと話す
#   ④どうなったか：京へ行って半年ほどで芸妓や舞妓となじみが深くなり、もらった恋文を多摩の親類へ送り、末尾に「報国の心を忘るる婦人かな」の句を添えた
title: 土方歳三｜消した恋の句と、京から送った句
yt_title: 土方歳三が句集から消した恋の句　京で半年、親類へ送った一句
description: |-
  新選組の副長、土方歳三は、豊玉の号で句をよみました。京へ上る前に、自分の句を一冊にまとめた『豊玉発句集』には、恋の句を消して、格調の高い句に書き直した跡があります。子孫の土方愛さんは、京へ行く前に恋の句をよんでいる場合ではない、と思ったのだろう、と話しています。
  ところが、京へ行って半年ほどたったころから、歳三は芸妓や舞妓となじみが深くなったようだ、と愛さんは語ります。もらった恋文を多摩の親類へ送ったとき、末尾に添えた句が、「報国の心を忘るる婦人かな」です。
hashtags: ["#土方歳三", "#日本史", "#幕末"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
