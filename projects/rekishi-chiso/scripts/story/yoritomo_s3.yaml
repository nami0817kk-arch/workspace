# 理解テスト4問：
#   ①誰の話か：頼朝が渡ったとされる橋（稲毛重成が1198年に架けた）の橋脚
#   ②いつ・どこで何が：1923年9月1日、関東大震災の液状化で茅ヶ崎の水田から木の柱が現れた
#   ③何が分かったか：沼田頼輔が『吾妻鏡』をもとに重成の橋の橋脚と考証。1926年に国の史跡、発掘で10本、2013年に天然記念物
#   ④どうなったか：ただし年輪年代では1126〜1260年で、1198年に絞れるわけではない
title: 源頼朝｜橋の柱は、関東大震災で、水田から出てきた
yt_title: 源頼朝の橋の橋脚は関東大震災で水田から出てきた　旧相模川橋脚の話
description: |-
  1923年9月1日、関東大震災の揺れで、茅ヶ崎の水田の中から、木の柱が地面に現れました。液状化現象が、地下の柱を押し上げたのです。
  茅ヶ崎出身の和田清が実地を調べて写真を撮り、歴史学者の沼田頼輔に調査を託しました。沼田は、『吾妻鏡』などの記録をもとに、稲毛重成が1198年に架けた橋の橋脚だと考証しました。頼朝が供養の日に渡り、帰りに落馬したと『吾妻鏡』が書く橋です。
  1926年に国の史跡に指定され、2013年には液状化現象の痕跡として、全国で初めて国の天然記念物にもなりました。ただし、年輪年代では伐採は1126年から1260年のあいだとされ、1198年に絞り込めるわけではありません。
  本編では、橋の修理の記事から、橋脚が出てくるまでをたどっています。
