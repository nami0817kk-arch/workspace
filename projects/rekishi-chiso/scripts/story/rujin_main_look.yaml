# 物語型の本編（横 16:9）の見た目と絵の割り当て：八丈島の流人の暮らし（scripts/rujin-story.yaml）。chiso/storymain.py が読む。
# 11-26 作成（11/30 12:00 公開予定）。choujou_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini、11-26）。R01〜R16 は /u/0、R17〜R23 は /u/0 の上限のあと /u/2（ユーザーの許可）で作った（out/story/rujin/main/<名>.jpg）。
#   江戸時代の八丈島：黒い溶岩の磯・ソテツとビロウ・玉石垣・茅葺き・円錐形の火山。字・紋は描かない。実在の人物の顔は描かない（名指さない流人・島の人）。
#   R15 は右端に洋服の袖のような手が入るので right は使わない。CEND は R01 を左右反転して作った（人物・字が無い風景なので反転してよい）。
