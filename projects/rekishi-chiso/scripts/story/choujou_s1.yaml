# 切り口：天田の砂と、毎日の見回り（日迹）。木の印・29日の札・スタインが見た見回りの道（本編 序章・第2章、choujou-09・10・12・15・16）。
# hook＝兵が毎朝まず見たものは何か（答えはこのショートの中：砂の上の足跡）。
# tease＝その砂の帯に本当に敵が入った夕暮れ、何が起きたか（答えは本編 第3章：建武5年12月、木中隧。choujou-07・58）。
# 数え直し：前102年〜後30年の記録→2026年から見て2000年あまり前。スタインの9ヤード＝8.2メートル→8メートルほど、1.5〜2フィート＝46〜61センチ→50センチほど。
#   スタインが敦煌の長城を歩いたのは1907年（第2次探検）→2026−1907＝119年→「100年あまり前」（本編と同じ言い方）。
# 理解テスト：①漢の長城を守った兵の毎朝の仕事の話 ②2000年あまり前、居延などの長城ののろし台 ③天田の砂をならし、3人で10日ずつ交代で見回り、木の印で歩いた証拠を残した ④「29日のあいだ越えた跡なし」と札に書き、見回りの道は100年あまり前まで残っていた
title: "万里の長城｜兵が毎朝見た砂の足跡"
yt_title: "万里の長城の兵が、毎朝まず確かめたのは敵ではなく砂の上の足跡　2000年あまり前の木の札に残る見回りの記録"
description: |-
  2000年あまり前、漢の時代の長城ののろし台では、長と兵が2人か3人で暮らしていました。台の外には、天田と呼ばれる、砂を平らにならした帯がありました。越えた者がいれば、足跡が必ず残ります。
  その帯を歩いて跡を見る仕事を「日迹」といい、兵3人が10日ずつ交代で受け持った記録があります。最後まで歩いた証拠に、隣の台で自分の木の印を砂に挿し、前の日の兵の印を持ち帰りました。結果は木の札に「29日のあいだ、人も馬も、越えて出入りした跡なし」と書かれています。
  本編では、兵の故郷から、のろしの決まり、食べ物、秋の弓の試験、病と故郷へ帰る棺まで、木の札の記録で長城の兵の暮らしをたどっています。本編は概要欄のリンクからどうぞ。
