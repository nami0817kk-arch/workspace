  # fact: choujou-15, choujou-55
- 語り: "2000年あまり前、漢の時代の長城。のろし台には、隧長と呼ばれる長と、兵が2人か3人で暮らした。"
  shot: C07_2
  tone: しみじみ
  pause: 0.12
  # fact: choujou-10
- 語り: "台の外には、天田と呼ばれる、平らにならした砂の帯があった。越えた者がいれば、そこに、足跡が必ず残る。"
  shot: C01_3
  tone: しみじみ
  pause: 0.12
  # fact: choujou-10, choujou-09
- 語り: "ある札には、9人で砂をならす、という割り振りまで書かれている。帯を歩いて跡を見る仕事は、日迹。ひと月を、兵3人が、10日ずつ交代で受け持った。"
  shot: C03_4
  tone: しみじみ
  pause: 0.12
  # fact: choujou-12
- 語り: "本当に最後まで歩いたかは、木の印で確かめた。隣の台まで歩いたら、自分の印を砂に挿し、前の日の兵の印を、抜いて持ち帰る。"
  shot: C08_5
  tone: 強調
  pause: 0.12
  # fact: choujou-10
- 語り: "その結果は、木の札に、こう書かれた。29日のあいだ、人も馬も、越えて出入りした跡なし。"
  shot: R02_6
  tone: 重い
  pause: 0.12
  # fact: choujou-16
- 語り: "100年あまり前、探検家スタインが敦煌の長城を訪れたときも、壁から8メートルほど離れて、幅50センチほどの、見回りの道が残っていた。"
  shot: C01_7
  tone: しみじみ
  pause: 0.12
