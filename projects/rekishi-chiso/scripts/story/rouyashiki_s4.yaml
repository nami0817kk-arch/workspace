title: "江戸の牢屋敷｜入る牢は身分で決まった"
yt_title: "江戸の牢屋敷は、身分で入る牢が違った　旗本は揚座敷、庶民は大牢、無宿は二間牢　500石以上の旗本は入れなかった"
description: |-
  江戸の小伝馬町の牢屋敷では、入る牢が身分で分かれていました。世界大百科事典によると、将軍にお目見えできる旗本で500石に満たない者は揚座敷。500石以上の旗本は、牢屋敷には入れず、大名などに預けました。お目見えできない御家人や大名の家来は揚屋、医師も揚屋。町人などの庶民は大牢、家も籍もない無宿の者は二間牢です。
  ただ、揚屋の食事も牢名主の支配も、庶民の牢とそれほど違いませんでした。女の牢は、西口の揚屋の一部屋でした。
  本編では、牢の中の役付きや食事、牢を出る道までたどっています。本編は概要欄のリンクからどうぞ。
