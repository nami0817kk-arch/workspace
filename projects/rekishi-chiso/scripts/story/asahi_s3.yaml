# 本編 scripts/asahi-story.yaml の切り口③：前の夫は誰？ 命を絶ったのか、出家したのか（佐治説と副田説、500石と5万石）
# 事実カード：dev/output/rekishi-chiso/research/旭姫_facts_20261026.yaml
#   asahi-02（『改正三河後風土記』は佐治日向守、『尾張志』は副田与左衛門（甚兵衛）吉成。渡辺世祐 1919年「確なる事は明でない」）／
#   asahi-19（見返りは 500石（佐治説）と 5万石（副田説・尾張志）で100倍違う。どちらも受け取らなかった）／asahi-01（佐治説：500石を辞す）／
#   asahi-34（自ら命を絶った話は『武徳編年集成』などの佐治説のもの。『尾張志』では副田は出家して隠斎、烏森村で余生）／
#   asahi-35（副田は「妻の代りに知行を得ん事は武士の本意に非ず」と固く辞した、と伝わる）／asahi-36（佐治説は『武徳編年集成』が採って通説に。江の最初の夫・佐治一成と混同した可能性＝八幡和郎）／asahi-03
# 広告の配慮：最期は「自ら命を絶った」まで（本編と同じ）。
# 理解テスト4問：
#   ①誰の話か：旭（豊臣秀吉の妹）の前の夫
#   ②いつ・どこで何が：天正14年、44歳の旭が徳川家康に嫁いだとき、旭には前の夫がいた。その夫が誰か、記録が2つに割れている
#   ③それぞれ何を選んだか：佐治日向守の話＝500石を断り、のちに自ら命を絶った／副田吉成の話＝5万石を「武士の本意ではない」と断り、出家して隠斎として生きた
#   ④どうなったか：見返りは100倍違い、最期も正反対。1919年に渡辺世祐は「確かなことは明らかでない」と書いた
title: 旭姫｜前の夫は、命を絶ったのか、出家したのか
yt_title: 旭姫の前の夫は誰だったのか――500石と5万石、正反対の2つの最期
description: |-
  天正14年、豊臣秀吉の妹、旭は、44歳で徳川家康に嫁ぎました。このとき旭には、前の夫がいました。
  その夫が誰だったのか、記録は割れています。『改正三河後風土記』は佐治日向守、『尾張志』は副田吉成。
  佐治日向守の話では、秀吉が示した離縁の見返りは500石。日向守は断り、のちに自ら命を絶ったといいます。
  副田吉成の話では、見返りは5万石。副田は「妻の代わりに知行をもらうのは、武士の本意ではない」と断り、髪を剃って隠斎と名乗り、静かに一生を終えたと伝わります。
  1919年、渡辺世祐は、すでに「確かなことは明らかでない」と書いていました。
