lines:
  # fact: senhime-26
- 語り: "千姫は、大坂城から救い出された家康の孫。姫路で、なぜ、最初の夫の祟りから解かれるよう、祈ったのか。"
  shot: S08_1
  tone: 強調
  pause: 0.12
  # fact: senhime-20
- 語り: "1616年に、千姫は、本多忠刻に嫁いだ。最初の夫は、豊臣秀頼だ。"
  shot: S07_2
  tone: しみじみ
  pause: 0.12
  # fact: senhime-22, senhime-25
- 語り: "翌年に、本多家は姫路へ移る。1618年に娘の勝姫が、翌年には男の子、幸千代が生まれた。"
  shot: S10_3
  tone: しみじみ
  pause: 0.12
  # fact: senhime-25
- 語り: "ところが1621年。幸千代は、数えで3歳で、亡くなる。"
  shot: S13_4
  tone: 重い
  pause: 0.12
  # fact: senhime-26
- 語り: "姫路市の説明では、千姫は、そのあと、流産を繰り返した。占い師は、それを、秀頼の恨みの魂のせいだ、と言った。"
  shot: S09_5
  tone: 重い
  pause: 0.12
  # fact: senhime-26
- 語り: "千姫は、観音像を作らせた。中に納めたのは、秀頼の祟りから、解かれることを願う祈りの文だった、という。"
  shot: R05_6
  tone: 重い
  pause: 0.12
  # fact: senhime-26
- 語り: "1623年には、男山に天満宮を建てさせ、西の丸から毎日、手を合わせた、と伝わる。"
  shot: S12_7
  tone: しみじみ
  pause: 0.12
  # fact: senhime-27
- 語り: "そして1626年。夫の忠刻が、数えで31歳で亡くなる。千姫は、数えで30歳だった。"
  shot: S13_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第4章（東慶寺と天秀、senhime-42・43）
- 語り: "千姫はのちに、秀頼が残した、ある人のために力を尽くす。それは、誰だったのか。"
  shot: R12_9
  tone: 疑問
  pause: 0.15
