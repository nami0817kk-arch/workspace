# 切り口：姫路で幸千代を亡くし、そのあとの不幸を秀頼の恨みと言われた（本編 第2章、senhime-20・22・25・26・27）。
# 計算（数え直した）：幸千代 1619生→1621没＝数え3。忠刻 1596生→1626＝数え31。千姫 1597生→1626＝数え30。
# tease の答え：天樹院が建て直した東慶寺と、秀頼の娘・天秀（本編 第4章 senhime-42・43）。
title: "千姫｜姫路で、最初の夫の祟りから解かれるよう祈った"
yt_title: "千姫は姫路で、なぜ秀頼の祟りから解かれるよう祈ったのか　数えで3歳で亡くなった息子・幸千代"
description: |-
  1616年、大坂城から救い出された千姫は、本多忠刻に嫁ぎ、翌年、姫路へ移りました。1618年に娘の勝姫、翌年に男の子の幸千代が生まれます。
  ところが1621年、幸千代は数えで3歳で亡くなります。姫路市の解説によれば、千姫はそのあと流産を繰り返し、占い師はそれを、最初の夫・豊臣秀頼の恨みの魂のせいだと言いました。
  千姫は観音像を作らせ、秀頼の祟りから解かれるよう願う祈りの文を納めたといいます。1626年には、夫の忠刻も数えで31歳で亡くなりました。
  本編では、そのあと江戸で天樹院として過ごした40年と、秀頼の娘を守った寺の話までたどっています。本編は概要欄のリンクからどうぞ。
