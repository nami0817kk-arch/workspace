lines:
  # fact: heibayo-A40
- 語り: "始皇帝の墓を書いた『史記』に、兵馬俑のことは、一言もない。『俑』という字さえ、出てこない。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: heibayo-A06
- 語り: "『史記』が書かれたのは、始皇の死の、紀元前210年から、100年以上あと。司馬遷は、始皇を見た人では、ない。"
  shot: B01_2
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A01
- 語り: "秦始皇本紀によれば、統一のあと、労役の者、70万人あまりを送り、泉を3重に掘り、銅で棺を固めた。"
  shot: B02_3
  tone: 重い
  pause: 0.12
  # fact: heibayo-A01
- 語り: "宮殿も、役人も、珍しい器も、運び込んで満たした、とある。"
  shot: B02_4
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A02
- 語り: "仕掛けも、書かれている。近づく者を射る弩。水銀の、川と海。上には天文、下には地の形。"
  shot: B04_5
  tone: 重い
  pause: 0.12
  # fact: heibayo-A03
- 語り: "埋葬のあとも、書く。秘密が漏れるのを恐れて、墓の通路を閉じ、職人は、誰も出られなかった、と。"
  shot: B04_6
  tone: 重い
  pause: 0.12
  # fact: heibayo-A01
- 語り: "墓の中身も、仕掛けも、職人の運命も、書かれている。それなのに、地下の軍には、一言もない。"
  shot: B01_7
  tone: 重い
  pause: 0.12
  # fact: heibayo-A37
- 語り: "見つかったのは、2000年あまりあと。1974年、井戸の底から。"
  shot: H01_8
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A11
- 語り: "では、書かなかった理由は、記録に、あるのか。"
  shot: A03_9
  tone: 疑問
  pause: 0.15
