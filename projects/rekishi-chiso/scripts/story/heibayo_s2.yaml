title: "兵馬俑｜『史記』に、一言もない"
yt_title: "始皇帝の墓を書いた『史記』に、兵馬俑は一言も出てこない　「俑」の字さえない　宮殿も、仕掛けも、職人の閉じ込めも書くのに"
description: |-
  司馬遷の『史記』秦始皇本紀は、始皇帝の墓の宮殿も、仕掛けも、埋葬のあとのことも書いています。ところが、地下の軍のことは、一言もありません。『俑』の字さえ、出てきません。
  書かなかった理由は、記録にあるのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/Q89Ua_ST728
