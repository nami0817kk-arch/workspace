# 理解テスト4問：①福島正則の処分 ②藤井讓治さんの記事は6月2日・信濃と越後。『微妙公御夜話』は元和4年6月23日・出羽庄内へ流罪 ③七か条・四万石を断り一万石 ④後の時代の逸話集。正則は10月初めに信濃の高井野へ。次は屋敷（本編6章）
title: "福島正則｜処分の日付が、記録で違う"
yt_title: "福島正則の処分は、いつ、どこへか　記録で日付も流された先も違う『微妙公御夜話』"
description: |-
  福島正則の処分は、記録によって、日付も場所も違います。藤井讓治さんの記事は、1619年6月2日、広島城の無断修築の咎で、信濃と越後へ。ところが、加賀藩の前田利常の話を集めた『微妙公御夜話』は、「元和4年6月23日」、「出羽庄内へ流罪」、七か条の罪と書きます。
  作者は分かっておらず、活字になったのは1916年。広島の城を預かった家臣たちの記録ではなく、後の時代にまとめられた逸話集です。
  正則が向かった信濃の屋敷は、どんな所だったのか。本編は概要欄のリンクからどうぞ。
