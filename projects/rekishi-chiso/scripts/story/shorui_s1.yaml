title: "生類憐みの令｜犬の悪法の中に、捨て子を育てよ、の触れ"
yt_title: "生類憐みの令の中に、捨て子はその土地の者が育てよ、という触れがあった　犬の悪法と習う法令の、人を救う触れ"
description: |-
  犬を大事にしすぎた悪法。そう習う生類憐みの令の中に、捨て子は、届け出なくてよいから、その土地の者が育てるか、育てたい者に渡せ、という1687年の触れがあります。
  同じ年には、重い病にかかった者を死ぬ前に捨てることを禁じ、1688年には、宿で病気になった一人旅の者を次の宿へ送り出すことを禁じました。牢屋には、風が通る格子と、月に5回の湯を命じています。
  本編では、触れの中身・罰の記録・悪い評判の出どころを並べて、生類憐みの令は本当に悪法だったのかを確かめています。本編は概要欄のリンクからどうぞ。
