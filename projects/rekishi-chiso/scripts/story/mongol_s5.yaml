# 物語完結型ショート モンゴル s5（2026-11-07）。本編 scripts/mongol-if-story.yaml（11/10 12:00 公開）の第8章（分岐4 日本まで）から。11/11 18:30 公開。
# 形式は columbus_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。日本につながる入口の1本。
#   「もしも」の行は「ここからは、もしもの話」と言ってから、本編の見立て（日本へ国書を出したのは東の流れのクビライ→もしもの世界でも国書と元寇は来たと考えられる）だけ。
#   事実の行と混ぜない。本編どおり「考えられる」で言い切らない。
# 絵は本編の AI 絵（out/story/mongol-if/main/）と本編で使った実在の絵（元朝の皇帝の肖像のオゴデイ）だけ。
# 切り口：ハーンの死で軍が止まったのは1242年だけではない。1259年にモンケが釣魚山で亡くなり、クビライは鄂州を囲んだのち冬に北へ。西アジアでは
#   1260年9月3日にアイン・ジャールートで敗れる。ホー（2013）は2つの撤退を並べた。1260年にハーンが2人。1266年に日本への国書、1268年に大宰府。
#   本編の答え（もしもの世界でローマ教皇はどう向き合ったか＝第6章）は言わない。
# 事実カード：mongol-03・78・56・80・81（アイン・ジャールート mongol-57 は長さのため外した）。言い方は本編のまま。
# 計算（自分で計算し直した）：1259−1241＝18年。1268−1266＝2年（台本では言わない）。
#   モンケの死は元史の「秋七月癸亥」＝西暦8月11日なので、本編どおり「1259年の夏」（旧暦の月を西暦の月として言わない）。
# 理解テスト4問：
#   ①誰の話か：モンゴルのハーンたち（オゴデイ・モンケ・クビライ）
#   ②いつ・どこで何が：1241年にオゴデイ、1259年にモンケが亡くなり、そのたびに軍が引いた。1260年にハーンが2人並んだ
#   ③なぜ大事か：争いを勝ち抜いたクビライが、1266年に日本への国書の使いを出し、1268年に高麗の使いが大宰府に着いた
#   ④もしもの話：1242年にハンガリーに居すわっていても、国書は東の流れから来るので、国書と元寇は来たと考えられる。教皇はどう向き合ったか、の問いで閉じる
title: 2度目のハーンの死｜日本への国書
yt_title: ハーンが死ぬとモンゴル軍は止まる　1242年のヨーロッパと1259年の中国、そして日本へ届いた国書
description: |-
  1241年12月に大ハーンのオゴデイが亡くなり、翌1242年の春、モンゴルの軍はハンガリーから去りました。
  18年後の1259年の夏、次のハーン、モンケが、中国の四川、釣魚山で亡くなります。弟のクビライは宋の鄂州を囲み、大軍が北へ帰ったのは冬になってからでした。研究者のスティーブン・ホーは、2013年の論文で、1242年と1260年の2つの撤退を並べて論じています。
  1260年、クビライはハーンになります。同じ年、弟のアリクブケもハーンを名乗りました。『元史』によると、1266年、クビライは日本への国書を持たせた使いを出し、1268年、高麗の使いが大宰府に着きました。
  ここからは、もしもの話です。1242年の春、モンゴルの軍がハンガリーに居すわっていても、日本へ国書を出したのは、中国を治めはじめたクビライでした。もしもの世界でも、国書と元寇は来たと考えられます。
  では、居すわるモンゴルに、ローマ教皇はどう向き合ったのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#モンゴル帝国', '#元寇', '#世界史']
ai_images: true
ai_disclosure: この動画の情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。オゴデイの肖像（元朝の皇帝の肖像、14世紀）はパブリックドメインの絵です。
