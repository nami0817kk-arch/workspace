title: "タイタニック｜沈没の2時20分を、二等航海士は時計で見ていない"
yt_title: "タイタニックが沈んだ「午前2時20分」　二等航海士ライトラーは、この時刻を時計で見ていなかった　アメリカ上院の調査での答え"
description: |-
  タイタニックが沈んだのは、午前2時20分とされています。この時刻を、二等航海士のライトラーは、時計で見ていません。アメリカ上院の調査で、2時20分は聞いた話で、士官どうしで出した結論だった、と答えています。
  英国の報告書は、2時20分を沈んだ時刻としました。アメリカ上院の報告書のニューヨーク時間0時47分も、報告書の時差1時間33分で船の時刻に直すと、2時20分になります。
  本編では、衝突から沈没までの2時間40分を、無線の記録と英米2つの調査から、時刻の順にたどっています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/SdhomuxqfF4
