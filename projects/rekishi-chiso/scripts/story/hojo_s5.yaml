# 物語完結型ショート 北条 s5（2026-11-06）。本編 scripts/hojo-if-story.yaml（11/8 12:00 公開）の第7章（分岐2 家康は江戸へ行ったのか）から。11/9 18:30 公開。
# 形式は tsurumatsu_s5.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
#   「もしも」の行は「ここからは、もしもの話」と言ってから、本編の見立て（家康に与えるほどの旧領はほとんど生まれない／5か国にとどまったと考えられる／
#   少なくともこの年、江戸に入るきっかけは生まれない）だけ。事実の行と混ぜない。「江戸が日本の中心になったか」は言い切らない（本編どおり）。
# 絵は本編の AI 絵（out/story/hojo-if/main/）と本編で使った実在の肖像・絵図だけ。H21 は姫路城に見えるので使わない。
# 切り口：1590年7月13日に国替えの命、8月1日に家康が江戸に入る（財務省の広報誌の記事）。約100万石→約250万石（高木昭作、世界大百科事典）、5か国は取り上げ。
#   上野には井伊直政・榊原康政。北条が残っていたら、家康が江戸に入るきっかけは生まれない。本編の答え（ほかの大名との比べ・上洛の代償）は言わない。
# 事実カード：hojo-72・122・123・73。言い方は本編のまま。家康の石高は出どころで割れる（250万／255万）ので、本編どおり高木昭作の約250万石だけ。
# 計算（自分で計算し直した）：天正18年＝1590年。約100万石→約250万石は2.5倍（「倍を超える」）。7月13日→8月1日は19日後（台本では言わない）。
# 理解テスト4問：
#   ①誰の話か：徳川家康と、北条の旧領（関東）
#   ②いつ・どこで何が：1590年7月13日、秀吉が家康に北条の旧領への国替えを命じ、8月1日に家康が江戸に入った
#   ③何を得て何を失ったか：約100万石から約250万石へ。けれど慣れ親しんだ5か国は取り上げられた
#   ④もしもの話：北条が残っていたら、家康は5か国にとどまり、この年に江戸に入るきっかけは生まれない。ほかの大名は何を残し何を失ったか、の問いで閉じる（答えは本編）
title: 家康と江戸｜北条が残っていたら
yt_title: もしも北条家が関東に残っていたら、徳川家康は江戸へ行ったのか　1590年8月1日、家康が江戸に入った理由
description: |-
  1590年、小田原城が開いたあと、豊臣秀吉は徳川家康に、北条の旧領への国替えを命じました。財務省の広報誌の記事は、その日を7月13日、家康が江戸に入ったのを8月1日としています。
  移る前の家康は約100万石。関東で得た石高を、高木昭作さんは平凡社の世界大百科事典で約250万石と書いています。倍を超える加増ですが、慣れ親しんだ5か国は取り上げられました。北条の旧領の上野には、井伊直政や榊原康政といった家康の重臣が置かれます。
  ここからは、もしもの話です。北条が関東に残っていたら、家康に与えるほどの旧領は、ほとんど生まれません。家康は駿河や三河など5か国にとどまったと考えられ、少なくともこの年、家康が江戸に入るきっかけは生まれません。
  では、秀吉に従ったほかの大名たちは、何を残し、何を失ったのか。本編は概要欄のリンクからどうぞ。
