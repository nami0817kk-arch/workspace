title: "万里の長城｜故郷へ帰る小さな棺"
yt_title: "万里の長城で死んだ兵は、小さな木の棺で故郷へ送られた　棺は1つ38銭、届くまで少なくとも3か月"
description: |-
  2000年あまり前、漢の時代の長城の兵は、遠い故郷から1年の任期で来ていました。病気の兵の名簿には「第三十一隧の兵、王章、4月1日、傷寒を病む」のように、病名と日付が書かれています。
  紀元前54年の札には、病で死んだ兵を小さな木の棺に入れて送る、とあります。役所はその棺をいつも備え、ある月の帳面には残りが6つ。1つ38銭で買った記録もあり、下級の役人のひと月の給料の16分の1ほどでした。持ち物は3つに割る割り符に書いて棺と一緒に送り、故郷に届くまで少なくとも3か月から4か月、半年かかることもあり得たと見積もられています。
  本編では、兵の故郷から毎朝の見回り、のろし、食べ物、秋の弓の試験、家族への手紙まで、木の札の記録で長城の兵の暮らしをたどっています。本編は概要欄のリンクからどうぞ。
