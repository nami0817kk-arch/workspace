# 物語型の本編（横 16:9）の見た目と絵の割り当て：千利休（scripts/rikyu-story.yaml）。chiso/storymain.py が読む。
# 10-28 作成（12:00 公開の急ぎ）。台本には手を入れない。決まりは docs/story-main.md・スキル rekishi-story-screen。見本は asahi_main_look.yaml。
# 絵の方針：AI 絵は 14 枚（R01〜R14）＋数正の回の K05（秀吉）をそのまま使う（新しく作らない）。同じ絵を時間をずらして使い回す（続けて 20 秒まで）。
#   人物は表情のある全面の AI 絵が主役。実在の絵（パブリックドメイン。出典は台本の background / portrait の credit・caption）は額（frame:）と屏風・絵図の一部（part:）。
# AI 絵の指示の一覧（英語・顔立ちの設定）：dev/output/rekishi-chiso/research/rikyu_ai_images.md
# 届く前は art_dir の仮の絵（R01.jpg〜、番号と場面だけ書いた灰色の板）で代える。届いたら main_art_dir に R01.jpg〜を置くだけ。
# K05 は out/story/kazumasa/main/ から out/story/rikyu/main/（と ph/）へ写してある（out/ は git に入らないので、無ければ写し直す）。
script: scripts/rikyu-story.yaml
out: rikyu_story_main
art_dir: out/story/rikyu/ph          # 仮の絵（placeholder）＋ K05 の写し
main_art_dir: out/story/rikyu/main   # Gemini の 16:9 の絵（R01.jpg〜R14.jpg）＋ K05 の写し
ai_disclosure: この動画の人物・情景の画像の多くは、Google の画像生成AI（Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面の右上に「AI生成画像」と出しています）。

# 章ごとの左上の札「いま｜章題」。台本は和暦を主に書くので札も和暦（西暦の年は付けない。2026年など今の出来事は西暦）。
# dates＝語りがその年・月日を言った行から替える（研究・論文・書物の年、像の作られた年は物語の「いま」ではないので替えない）
