      dates: {13: 2026年秋, 14: 天正19年2月}}
  1: {label: 第1章 三つの記録の食い違い, now: 天正19年2月,
      dates: {22: 天正15年, 23: 天正19年2月}}
  2: {label: 第2章 大徳寺の三門 金毛閣, now: 天正19年2月}
  3: {label: 第3章 秀長の死と四つの説, now: 天正19年1月22日,
      dates: {65: 天正19年2月}}
  4: {label: 第4章 「きのふりきうの茶にて」の書状, now: null}
  5: {label: 第5章 利休はどこに眠るのか, now: 天正19年,
      dates: {104: 文禄3年, 108: 寛永10年ごろ, 114: 2026年9月, 118: 2026年10月}}
