# 絵：本編の AI 絵（out/story/uesugi/main/ の U01〜U32）の切り出しと、本編で使った上杉景勝像（パブリックドメイン）だけ。新しい絵は作らない。
# 切り口：6千人の町に3万人（本編 序章・第2章、uesugi-13・16・17・38・19）。
# hook＝その3万人は、どこに住んだのか（答えはこのショートの中：城下に入りきらず、城下の外れで田畑を耕す原方衆に）。
# tease＝町のそばの暴れ川を、兼続はどう抑えたのか（答えは本編 第3章：赤崩の山から見て、谷地河原に石の堤＝直江石堤）。
# 計算（自分で計算し直した）：30000÷6027≒4.98＝約5倍。120万石→30万石＝4分の1。天保11年（1840）−1601＝239＝240年ほど。
# 理解テスト：①上杉家の家臣の話 ②1601年、米沢に3万人が移った ③城下に入りきらない下級の武士は外れで田畑を耕しながら仕えた ④原方衆と呼ばれ、240年後も8つの組で暮らしていた
title: "上杉家｜6千人の町に3万人"
yt_title: "人口6千人の米沢に3万人が引っ越してきた　関ヶ原のあと、上杉家の家臣はどこに住んだのか"
description: |-
  1601年、人口6千人ほどの米沢の町に、およそ3万人が移ってきました。関ヶ原の年に家康に逆らい、会津120万石から米沢30万石に減らされた、上杉家の家臣と家族です。
  昭和19年の伝記『直江兼続伝』によれば、当時の米沢は人口6,027人・803軒。城下に入りきらない下級の武士は、南原など城下の外れに置かれ、田畑を耕しながら仕える「原方衆」になりました（長井政太郎の研究、1936年）。
  本編では、30万石になった上杉家と直江兼続のその後を、当時の書状・江戸時代の記録・博物館と図書館の調べでたどっています。本編は概要欄のリンクからどうぞ。
