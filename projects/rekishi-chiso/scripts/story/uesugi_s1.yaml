lines:
  # fact: uesugi-38
- 語り: "1601年、人口6千人ほどの米沢の町に、およそ3万人が、引っ越してきた。その3万人は、どこに住んだのか。"
  shot: U01_1
  tone: 強調
  pause: 0.12
  # fact: uesugi-13
- 語り: "関ヶ原の年に、家康に逆らった上杉家は、120万石から、30万石へ。領地は、4分の1。"
  shot: KG_2
  tone: 重い
  pause: 0.12
  # fact: uesugi-16
- 語り: "家臣の取り分も、前の3分の1になった。"
  shot: U02_3
  tone: 重い
  pause: 0.12
  # fact: uesugi-17
- 語り: "昭和19年の伝記、直江兼続伝によれば、当時の米沢は、人口6千27人。家は、803軒しかなかった。"
  shot: U03_4
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-38
- 語り: "そこへ、家臣と家族、およそ3万人。町の5倍ほどの人だ。"
  shot: U03_5
  tone: 強調
  pause: 0.12
  # fact: uesugi-19
- 語り: "昭和11年の研究によれば、城下に入りきらない下級の武士は、南原など、城下の外れに置かれた。"
  shot: U11_6
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-19, uesugi-43
- 語り: "荒れた土地を開き、田畑を耕しながら、武士として仕える。彼らは、原方衆と呼ばれた。"
  shot: U10_7
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-19
- 語り: "240年ほどのちの旅日記は、こう書く。山や野に住む侍は、8つの組。1つの組に、200人あまり。"
  shot: U10_8
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-19
- 語り: "原方の者の力は、城下の侍の3倍だ、と語った人もいた。"
  shot: U15_9
  tone: 強調
  pause: 0.12
  # tease：答えは本編 第3章（uesugi-20・44）
- 語り: "では、町のそばの暴れ川を、家老の直江兼続は、どう抑えたのか。"
  shot: U13_10
  tone: 疑問
  pause: 0.15
