#   ④どうなったか：墓は1つではない。では「厠で倒れた」という話はいつ、どこで現れたのか、の問いで閉じる（答えは本編の第5章）
title: 謙信の遺骸｜甲冑で甕に納められたのか
yt_title: 上杉謙信の遺骸は、甲冑を着せて甕に納められたのか　記録は3通り、20年墓に入らず春日山から会津、米沢へ
description: |-
  上杉謙信の遺骸は、どのように納められたのか。記録は、3つに分かれます。
  『北越軍記』の流れの書物は、瓶に入れ、塩を詰めて、棺に納めた、と書きます。旧米沢藩士の話を集めた本は、丈夫な瓦の棺に納め、朱の漆を満たした、戦のさなかなので墓は作らず、春日山の城の中に置いた、と書きます。大正6年の伝記は、遺骸に甲冑を着せて、甕の中に納めた、と書いています。
  1598年、景勝が会津へ移されると、遺骸も会津若松の城へ移りました。謙信の死から、20年後です。そして米沢へ。移した年は、昭和14年の鉄道省の本では1601年、『温古之栞』では1603年で、食い違います。謙信の墓は、1つではありません。では、「厠で倒れた」という話は、いつ、どこで現れたのか。本編は概要欄のリンクからどうぞ。
