# 理解テスト4問：
#   ①誰の話か：亡くなった上杉謙信の遺骸
#   ②いつ・どこで何が：納め方は記録で3通り。春日山城の中に置かれ、1598年に景勝が会津へ移されると会津若松へ、のち米沢へ。江戸時代を通じて米沢城の本丸の御堂に
