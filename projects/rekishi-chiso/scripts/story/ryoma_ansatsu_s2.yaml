# 絵：本編の AI 絵（out/story/ryoma_ansatsu/main/ の R）の切り出しと、中岡慎太郎の肖像写真だけ。新しい絵は作らない。暗殺の場面・血・遺体は描かない。
# 切り口：近江屋の夜の客の人数が記録で割れ、寺村の手記と今井の口書が「7人・二階へ3人」で合う（本編 第1章・第3章、ryoma-ansatsu-18・07・23・13・01・20）。
# 既出と重ねない：ryoma-if のショート（王政復古の24日前・吉井幸輔の避難の勧め）には触れない。
# hook＝近江屋に来た客は何人だったか（答えはこのショートの中：記録で7人・3人・2人と割れ、寺村の手記と今井の口書が7人・二階へ3人で合う）。
# tease＝今井の口書では、一行はどこの藩の者と名乗ったか（答えは本編 第3章：松代藩。当時の手紙の十津川と合わない。ryoma-ansatsu-01）。
# 数え直し：慶応3年＝1867。慶応3年12月4日付の清岡の手紙（12月4日は西暦では1867年12月29日で、年は1867のまま）。谷干城の講演は年が割れるので、載った遺稿の1912年を言う。
#   寺村左膳の手記は慶応3年（1867）。今井の口書は明治3年＝1870（慶応3年→明治3年＝3年後）。季節は言わない。
#   今井の口書：2月の兵部省では二階へ4人（佐々木を含む）、刑部省では二階へ3人＋佐々木は上り口。本編と同じく刑部省の「二階へ3人」を言う。
# 理解テスト：①近江屋の夜（坂本龍馬と中岡慎太郎が斬られた夜）に来た客の人数の話 ②慶応3年11月15日の夜、京都の近江屋
#   ③清岡の手紙は3人、谷の講演（中岡から聞いた）は2人、寺村の手記は7人で二階へ3人 ④3年後の今井の口書も7人で二階へ3人。別々の記録が同じ数を書いている
title: "坂本龍馬｜近江屋に来た客は何人"
yt_title: "近江屋に来た客は何人だったのか　坂本龍馬が斬られた夜、記録は7人・3人・2人と割れていた"
description: |-
  慶応3年11月15日の夜、京都の近江屋の二階で、坂本龍馬と中岡慎太郎が斬られました。すぐには亡くならなかった中岡は、駆けつけた仲間に、あの夜のことを話しています。
  ところが、来た客の人数は、記録によって違います。慶応3年12月4日付の土佐の清岡半四郎の手紙は、十津川の者と偽って3人が来た、と書きます。1912年に出た谷干城の遺稿の講演では、中岡から聞いた賊は2人。
  一方、土佐藩の重役、寺村左膳の慶応3年の手記は、何者とも知れない7人が来て、そのうち3人が二階へ上がった、と書いています。そして3年後の明治3年、1870年、元京都見廻組の今井信郎は、取り調べで、7人で行き、二階へ踏み込んだのは3人だ、と答えました。別々に書かれた2つの記録が、同じ数を書いています。
  本編では、事件の直後の手紙から、取り調べの口書、雑誌の談話、48年後の遺言まで、書かれた年を添えて並べ、龍馬を斬った者にどこまで近づけるかを確かめています。本編は概要欄のリンクからどうぞ。
