lines:
  # fact: heibayo-A32
- 語り: "兵馬俑の、8000体という数は、掘って数えた数では、ない。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: heibayo-A32
- 語り: "2024年12月、博物院の李岡院長は、正確な数字は、ない、と説明した。"
  shot: G02_2
  tone: 重い
  pause: 0.12
  # fact: heibayo-A32
- 語り: "一号坑の面積と、出土の密度から、6000あまり。二号坑と三号坑を足して、8000近くになる、と。"
  shot: G02_3
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A33
- 語り: "二号坑は1300あまり、三号坑は68。足すと、7368あまり。8000近く、は、これを丸めたのかもしれない。"
  shot: A05_4
  tone: 重い
  pause: 0.12
  # fact: heibayo-A35
- 語り: "しかも、新華社は2019年に、掘り出された陶俑と陶馬は、8000あまり、と書いた。食い違う。"
  shot: G02_5
  tone: 重い
  pause: 0.12
  # fact: heibayo-A34
- 語り: "一号坑の第三次発掘は、約13年で、陶俑が220あまり。広さは、一号坑の約3パーセントだ。"
  shot: A05_6
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-A37
- 語り: "発見から、2026年まで、52年。それでも、掘り終えては、いない。"
  shot: C01_7
  tone: 重い
  pause: 0.12
  # fact: heibayo-C35
- 語り: "そして、始皇帝陵の本体は、今も、掘られていない。"
  shot: H01_8
  tone: しみじみ
  pause: 0.12
  # fact: heibayo-C35
- 語り: "1997年の国務院の通知は、技術の条件がそろうまで、掘らない、とする。その理由は、何か。"
  shot: B01_9
  tone: 疑問
  pause: 0.15
