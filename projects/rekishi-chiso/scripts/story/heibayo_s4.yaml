title: "兵馬俑｜8000体は、数えた数ではない"
yt_title: "兵馬俑の「8000体」は、掘って数えた数ではなかった　院長は「正確な数字はない」と説明　足すと7368、でも新華社は「8000あまり」"
description: |-
  兵馬俑は、約8000体といわれます。ところが、秦始皇帝陵博物院の李岡院長は、2024年12月、正確な数字はない、と説明しました。
  坑ごとの推定を足すと7368あまり。それでも新華社は、2019年に、8000あまり、と書いています。
  始皇帝陵の本体は、今も掘られていません。それはなぜか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/Q89Ua_ST728
