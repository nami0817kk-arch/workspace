parts:
- type: quote
  from: 14
  to: 14
  label: 史料
  text: 右兵衛督殿の御供に浅野紀伊守／常陸介殿の御供に加藤肥後守
  source: 本多正純の書状 慶長16年3月29日（『大日本史料』第十二編之八）
- type: quote
  from: 33
  to: 33
  label: 史料
  text: 加藤肥後守、去る廿六日より違例／祈念の儀、大蔵卿局より申し来る
  source: 『義演准后日記』慶長16年6月7日（『大日本史料』）
- type: quote
  from: 40
  to: 40
  label: 史料
  text: 熊本へ着城の二三日過ぎては／舌不自由にして、物いふ事かつてならず
  source: 『続撰清正記』
- type: versus3
  from: 44
  to: 44
  items:
  - - 『清正記』
    - 遺言あり
  - - 『続撰清正記』
    - 遺言は無い
  every: 2.5
- type: quote
  from: 53
  to: 53
  label: 史料
  text: 清正様御煩い、験気を得させられ候の段／満足この事に候
  source: 加藤虎藤の書状 7月3日（下川文書・『大日本史料』）
- type: quote
  from: 57
  to: 57
  label: 史料
  text: 廿四日、肥後国加藤肥後守死去
  source: 『当代記』慶長16年6月24日（『史籍雑纂』第二）
- type: quote
  from: 62
  to: 62
  label: 史料
  text: 去々年加藤肥後守、浅野弾正…死したりしこと／偏に好色の故、虚の病と云々
  source: 『当代記』慶長18年8月25日（『史籍雑纂』第二）
- type: versus3
  from: 90
  to: 90
  items:
  - - 『義勇芳軌』
    - 先に死んだ
  - - 記録
    - 1613年に死去
  every: 2.5
- type: quote
  from: 98
  to: 98
  label: 史料
  text: その事、もとより疑うべしといえども／しばらく左に附載す
  source: 『大日本史料』第十二編之八 編者の注
- type: quote
  from: 123
  to: 123
  label: 要点
  text: 近年は諸事に無作法／そのうえ曲事を起こした
  source: 寛永9年6月3日 江戸幕府老中奉書（熊本日日新聞「細川家文書を読む」2025）
- type: quote
  from: 130
  to: 130
  label: 要点
  text: これほど大きな城は／江戸城のほかに見たことがない
  source: 細川忠利の書状 寛永9年12月10日（熊本日日新聞「細川家文書を読む」2025）
