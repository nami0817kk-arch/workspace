# 物語完結型ショート 石川数正 s4（2026-10-26）。本編 scripts/kazumasa-story.yaml の第6章（子の康長の改易と子孫）から。投稿しない。
# 形式は oichi_s10.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵（out/story/kazumasa/main/K*.jpg）を縦に切り出す。
# 事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml）：kazumasa-05・06・17・32・33・44・45・46
#   ・天守を建てたのは康長（2025年の年輪年代の報告、kazumasa-17・05）。関ヶ原で東軍・外様の扱い（kazumasa-32、出どころ1つ → 「とされる」）。
#   ・娘を大久保長安の長男・藤三郎に嫁がせた（kazumasa-44・33）。慶長18年に長安の事件に連なって改易、弟たちも（kazumasa-06）。豊後・佐伯の毛利家に預けられた（kazumasa-06、本編と同じ）。
#   ・念持仏：配所で拝んでいたと伝わる・高さ約30cm・1971年に福岡県の子孫から松本市へ・松本市立博物館（kazumasa-45）。
#   ・法要：松本市大手の正行寺で1973年からほぼ毎年、康長の命日に・愛知県の子孫も参列（kazumasa-46、信濃毎日新聞 2016）。
#   ・改易の地元の3つの理由（kazumasa-43）と玄蕃石の伝承（kazumasa-49）は使わない（長さと、残酷な伝承のため）。没年 1642 はカードに無いので言わない。
# 理解テスト4問：
#   ①誰の話か：石川数正の息子・康長（松本城の天守を建てた人）
#   ②いつ・どこで何が：慶長18年、大久保長安の事件に連なったとして、松本の領地を取り上げられ、家は改易された
#   ③なぜか：関ヶ原のあと、娘を長安の長男・藤三郎に嫁がせていたため（外様の扱いで、徳川の家に戻ったとはみなされていなかった）
#   ④どうなったか：豊後・佐伯へ。配所で拝んだと伝わる仏像は1971年に子孫から松本市へ贈られ、1973年からほぼ毎年、親子の法要が営まれている
title: 石川数正｜息子の康長は、松本城を失った
yt_title: 石川数正の息子・康長は、なぜ松本城を失ったのか【大久保長安事件】
description: |-
  国宝・松本城の天守を建てたのは、石川数正の子、康長でした。康長は関ヶ原の戦いで徳川家康の東軍につきましたが、扱いは外様の大名だったとされます。
  関ヶ原のあと、康長は娘を大久保長安の長男・藤三郎に嫁がせていました。慶長18年、大久保長安の事件に連なったとして、康長は領地を取り上げられ、家は改易されます。
  康長は豊後の佐伯の毛利家に預けられました。その配所で拝んでいたと伝わる高さ30センチほどの仏像は、1971年、福岡県に住む石川氏の子孫から松本市に贈られました。
  1973年からは、松本の正行寺で、ほぼ毎年、康長の命日に数正と康長の親子の法要が営まれています。
hashtags: ["#日本史", "#石川数正", "#戦国時代"]   # 見出しの札が康長なので、既定（札から作る）だと #石川康長 になる
