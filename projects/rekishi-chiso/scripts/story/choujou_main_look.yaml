# 物語型の本編（横 16:9）の見た目と絵の割り当て：万里の長城を守った兵の暮らし（scripts/choujou-story.yaml）。chiso/storymain.py が読む。
# 11-22 作成（11/29 19:00 公開予定）。ise_main_look.yaml・joguo_main_look.yaml を写した。台本には手を入れない（承認のあと）。
# 絵の方針：AI 絵（Gemini、/u/0、11-22）。C01〜C21・CEND はこの回のために作った（out/story/choujou/main/<名>.jpg）。R01・R02 は曹操の回（sosou S02・S04）の AI 絵の写し。
