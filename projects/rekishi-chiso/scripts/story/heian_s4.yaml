# 物語完結型ショート 平安貴族if s4（2026-11-27）。本編 scripts/heian-if-story.yaml（12/3 12:00 公開予定、https://youtu.be/WkZt_G7O2Mc）から。12/4 16:30 に予約。
# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 平安貴族if_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/heian_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：道長の日記『御堂関白記』に出る安倍晴明（本編 第5章、heianif-30・31・32）。
# hook＝道長の日記の安倍晴明は何をしたか（答えはこのショートの中：滅門日で止めた・五龍祭のあと大雨・遅れて来た。いちばん多く出るのは息子の吉平）。
# tease＝悪い方角へ出かけるとき貴族はどうしたか（答えは本編 第5章：前の晩に別の家に泊まる方違え。heianif-26・27）。
# 数え直し：寛弘元年＝1004年、寛弘2年＝1005年、長保2年＝1000年。晴明 921年生→1005年＝数え85歳（本編のコメントと同じ）。季節は言わない（6月20日・7月14日・2月10日に季節を付けない）。
# 理解テスト：①藤原道長の日記に出る陰陽師、安倍晴明の話 ②1004年・1005年、道長の屋敷で
#   ③滅門日だと仏像作りを止め、五龍祭のあと大雨で褒美、1005年2月10日には遅れて来た ④その年85歳で亡くなる。日記にいちばん多く出る陰陽師は息子の吉平で、晴明の初めての記事は道長が自分で消した
title: "平安貴族｜道長の日記の晴明"
yt_title: "安倍晴明は、藤原道長の日記にどう書かれたか　仏像作りを止め、祭りのあと大雨、そして遅刻　いちばん多く出る陰陽師は息子だった"
description: |-
  陰陽師の安倍晴明は、藤原道長の日記『御堂関白記』にも出てきます。1004年6月20日、仏像を作らせようとした道長に、晴明は「今日は滅門日で、よくない」と止め、道長はやめました。同じ年の7月14日には、晴明が雨を願う五龍祭を務めると夜に大雨が降り、効き目があったとして褒美の衣を与えられています。
  1005年2月10日、道長が新しい屋敷の東三条殿に移った夜、晴明は遅れて来て、道長は供の者をやって呼ばせました。このとき晴明は85歳。この年のうちに亡くなります。
  ところが、日記にいちばん多く名前が出る陰陽師は、晴明ではなく息子の吉平です。しかも、晴明が初めて日記に出る1000年正月の記事は、道長が自分で消しています（中島和歌子「『御堂関白記』の陰陽道」2014）。月日は当時の暦（旧暦）のままです。
  本編では、平安貴族の家に生まれた子の毎日を、生まれた日から出世の夜まで、道長の日記と同じ時代の記録でたどっています。本編は概要欄のリンクからどうぞ。
