lines:
  # fact: heianif-31, heianif-32
- 語り: "安倍晴明は、藤原道長の日記に、何度も出てくる。けれど、いちばん多く出る陰陽師は、晴明ではない。"
  shot: C04_1
  tone: 強調
  pause: 0.12
  # fact: heianif-31
- 語り: "陰陽師は、日取りや方角の、吉凶を占う役人だ。"
  shot: A07_2
  tone: しみじみ
  pause: 0.12
  # fact: heianif-31
- 語り: "1004年の6月20日。道長が、仏像を作らせようとすると、晴明は止めた。今日は、滅門日という、暦の悪い日で、よくない。道長は、やめている。"
  shot: C04_3
  tone: 重い
  pause: 0.12
  # fact: heianif-31
- 語り: "同じ年の7月14日。晴明が、雨を願う祭り、五龍祭をすると、夜に、大雨が降った。"
  shot: C05_4
  tone: 強調
  pause: 0.12
  # fact: heianif-31
- 語り: "晴明は、褒美の衣を与えられた。"
  shot: C05_5
  tone: しみじみ
  pause: 0.12
  # fact: heianif-30
- 語り: "1005年の2月10日。道長が、新しい屋敷に移った夜。晴明は、遅れて来た。道長は、供の者をやって、呼ばせている。"
  shot: C03_6
  tone: しみじみ
  pause: 0.12
  # fact: heianif-30
- 語り: "このとき、晴明は85歳。この年のうちに、亡くなった。"
  shot: C04_7
  tone: しみじみ
  pause: 0.12
  # fact: heianif-32
- 語り: "日記にいちばん多く出る陰陽師は、息子の吉平。日取りの相談や、お祓いを任された。"
  shot: A07_8
  tone: 重い
  pause: 0.12
  # fact: heianif-32
- 語り: "しかも、晴明が日記に初めて出る、1000年の正月の記事を、道長は、自分で消している。"
  shot: A03_9
  tone: 強調
  pause: 0.12
  # tease：答えは本編 第5章（heianif-26・27 前の晩に別の家に泊まる方違え）
- 語り: "では、出かける先の方角が悪いとき、貴族は、どうしたのか。"
  shot: C01_10
  tone: 疑問
  pause: 0.15
