# 形式は kaieki_s1〜s5・shibusawa_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 平安貴族if_facts_20261126.yaml）だけ。
# 絵：本編の AI 絵（out/story/heian_if/main/）の切り出しだけ。新しい絵は作らない。
# 切り口：道長の孫・敦成親王が生まれた日（本編 第1章、heianif-33〜36）。記録の食い違い（紫式部日記は物の怪と祈りを詳しく／権記は「仏法の霊験」とだけ）。
# hook＝道長の孫が生まれた日、部屋で何が起きたか（答えはこのショートの中：白一色のしつらえ・陰陽師を呼び集め・物の怪を移す祈り・頭頂の髪を下ろす）。
# tease＝道長の娘の彰子は何歳で大人とされたか（答えは本編 第2章：数え12歳の裳着。heianif-42）。
# 暦と季節：寛弘5年＝1008年。9月10日・11日は旧暦（7〜9月＝秋）なので「秋」でよい。紫式部日記の白い覆い・元結は産湯の場面（heianif-33）。
# 理解テスト：①道長の娘・中宮彰子のお産、道長の孫の誕生 ②1008年の秋、9月10日〜11日、白一色にしつらえた部屋で
#   ③陰陽師を世にいる限り呼び集め、僧が物の怪を移そうと祈り、長引くと彰子は髪を少し下ろして戒めを受けた ④9月11日の昼ごろ敦成親王が生まれた。権記は「仏法の霊験」とだけ書く
title: "平安貴族｜白一色の産室"
yt_title: "藤原道長の孫が生まれた日、部屋は白一色に　陰陽師は世にいる限り呼び集められた　紫式部日記と権記で読む1008年のお産"
description: |-
  1008年の秋、9月10日の明け方。藤原道長の娘で一条天皇の后、中宮の彰子は、白い帳台に移りました。湯の桶も、それを置く台も白い覆い。女房たちは白い元結をしていました。書き残したのは、彰子に仕えた紫式部です。
  『紫式部日記』によれば、陰陽師は世にいる限り呼び集められ、僧たちは、彰子に取りついた物の怪を別の人に移そうと、大声で祈り続けました。お産が長引くと、彰子は頭のてっぺんの髪を少し下ろし、仏の戒めを受けます。9月11日の昼ごろ、男の子が生まれました。のちの後一条天皇、敦成親王です。
  けれど藤原行成の日記『権記』は、昼ごろ男の皇子が生まれた、仏法の霊験だ、と短く書くだけです。月日は当時の暦（旧暦）のままです。
  本編では、平安貴族の家に生まれた子の毎日を、生まれた日から出世の夜まで、道長の日記『御堂関白記』と同じ時代の記録でたどっています。本編は概要欄のリンクからどうぞ。
