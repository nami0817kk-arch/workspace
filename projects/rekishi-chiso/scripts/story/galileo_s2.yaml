  pause: 0.12
  # fact: galileo-05
- 語り: "署名しなかった理由は、記録に書かれていない。分かるのは、署名の数が全員ではなかった、というところまでだ。"
  shot: C04_6
  tone: 重い
  pause: 0.12
  # fact: galileo-02
- 語り: "罪名は、異端ではなく、「強い異端の疑い」。刑は、聖務省の「正式な牢」で、期間は、「われらの裁量」と書かれた。"
  shot: H01_7
  tone: しみじみ
  pause: 0.12
