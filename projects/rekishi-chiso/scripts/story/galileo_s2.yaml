title: "ガリレオ｜判決の10人のうち、署名したのは7人"
yt_title: "ガリレオを裁いた枢機卿は10人　ところが、判決に署名したのは7人だけだった　3人の名と、記録が言わないこと"
description: |-
  ガリレオを裁いた枢機卿は10人。判決の冒頭には10人の名が並びますが、末尾の署名欄にあるのは7人だけです。見あたらないのは、ボルジア、ザッキア、そして教皇ウルバヌス8世の甥のフランチェスコ・バルベリーニでした。
  署名しなかった理由は、記録に書かれていません。分かるのは、署名の数が全員ではなかった、というところまでです。判決は、罪名を「強い異端の疑い」、刑を聖務省の「正式な牢」とし、期間は「われらの裁量」と書きました。
  その判決は、ガリレオの年齢も書き違えています。何歳と書いたのか。本編は概要欄のリンクからどうぞ。
  https://youtu.be/O80RShvkLVU
