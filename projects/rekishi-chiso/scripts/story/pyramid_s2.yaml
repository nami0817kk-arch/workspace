# 切り口：本編の第1章＝ヘロドトスの10万人は、造られてから約2100年あとに、エジプトで聞いた話として書かれた。
# 計算（自分で計算し直した）：ヘロドトス 前450年ごろ − 着工 前2550年ごろ ＝ 約2100年／道10年＋本体20年＝30年。
# 人数：レーナーが紹介した技術者の調査は4000〜5000人、ハワスは3万6000人（常時と臨時）。レーナーの「約2万人」は本人の発言と確認できないので使わない。
title: "大ピラミッド｜10万人は、約2100年あとに書かれた"
yt_title: "大ピラミッドを造ったのは10万人　この有名な数字は、造られてから約2100年あとに、エジプトで聞いた話だった"
description: |-
  大ピラミッドを10万人が造った、という有名な数字は、ギリシャの歴史家ヘロドトスが書いたものです。書かれたのは紀元前5世紀、造られてから約2100年あとで、エジプトで聞いた話として書かれています。
  今の見積もりは、技術者の調査を引いた4000〜5000人から、ハワスの3万6000人まで割れています。10万人は、そのどれよりも多い数です。
  本編では、ヘロドトスの記録と、同じ時代の日誌、労働者の町と墓を並べています。本編は概要欄のリンクからどうぞ。
  https://youtu.be/B-vlbAtwegY
