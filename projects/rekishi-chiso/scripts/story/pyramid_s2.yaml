lines:
  # fact: pyramid-P09, pyramid-P10
- 語り: "大ピラミッドを造ったのは、10万人。この有名な数字は、造られてから、約2100年あとに、書かれたものだ。"
  shot: H01_1
  tone: 強調
  pause: 0.12
  # fact: pyramid-P10
- 語り: "書いたのは、ギリシャの歴史家、ヘロドトス。紀元前5世紀に、エジプトを旅した人だ。"
  shot: C09_2
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P09
- 語り: "10万人が、3か月ごとに交代で働いた。石を運ぶ道に10年、ピラミッドに20年。あわせて30年、と書いた。"
  shot: C05_3
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P10
- 語り: "ただし、これは、エジプトで聞いた話として、書かれている。"
  shot: C09_4
  tone: 重い
  pause: 0.12
  # fact: pyramid-P12
- 語り: "クフ王が、エジプト人を、1人残らず、自分のために働かせた、とも書く。英訳のこの章に、奴隷という言葉は、出てこない。"
  shot: C13_5
  tone: 重い
  pause: 0.12
  # fact: pyramid-P21
- 語り: "今の見積もりは、どうか。技術者の調査を引いた紹介では、4000人から5000人。エジプトの考古学者ハワスは、常時と臨時を合わせて、3万6000人。"
  shot: C06_6
  tone: しみじみ
  pause: 0.12
  # fact: pyramid-P21
- 語り: "見積もりは、大きく割れる。それでも、10万人は、そのどれよりも、多い。"
  shot: C04_7
  tone: 重い
  pause: 0.12
  # fact: pyramid-P03, pyramid-P05
- 語り: "では、造られた時代に書かれた記録には、何が残っていたのか。"
  shot: C07_8
  tone: 疑問
  pause: 0.15
