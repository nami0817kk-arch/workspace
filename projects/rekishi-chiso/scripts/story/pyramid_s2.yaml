# 物語完結型ショート 大ピラミッド s2（2026-11-16）。本編 scripts/pyramid-story.yaml（11/20 19:00 公開予定、https://youtu.be/B-vlbAtwegY）から。11/21 12:30 に予約。
# 形式は meireki_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カードと本編の # fact: だけ。
