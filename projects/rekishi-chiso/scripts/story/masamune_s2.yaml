# 物語完結型ショート 伊達政宗 s2（2026-10-29）。本編 scripts/masamune-story.yaml の第1章の後半と第3章（「両眼正しくせよ」）から。
# 形式は rikyu_s1.yaml・hidetsugu_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の想像1「この目のことは」は使わない）。
# 絵は本編の AI 絵（out/story/masamune/main/M*.jpg・TKM）。
#   この回の決まり：AI 絵の政宗に眼帯は無い。右目が見えている絵の切り出しを作らない（M01 は両目が見えるので使わない。M09・TKM は左の横顔、M06・M13 は後ろ姿）。
# 事実カード（dev/output/rekishi-chiso/research/伊達政宗_facts_20261028.yaml）：masamune-79・06・66・80
#   ・『性山公治家記録』（仙台藩が後の時代にまとめた記録）の言葉は「記録は伝える」「と書きとめている」と言い、政宗が言ったと断定しない（本編と同じ）。
#   ・原文「薨去ノ後尊像ヲ造ラハ兩眼正クセヨ」「尊像ハ隻眼ニ造リ奉ラス」は語りで今の言葉にしてから読む。
#   ・理由の食い違い：記録＝片目を恥じた・人に言われるのを嫌った／仙台市博物館の解説＝親から授かった体を欠いたのを親不孝と考えた（masamune-80）。
# 理解テスト4問：
#   ①誰の話か：伊達政宗（幼いころに右目の光を失った）
#   ②いつ・どこで何が：1636年5月24日、江戸の桜田の屋敷で亡くなった。仙台藩の記録『治家記録』は、像を造るなら両方の目を正しく造れと命じた、と伝える
#   ③なぜか：記録は、片目を恥じていつも隠し、人に言われるのを嫌い、のちの世まで言われることを気にしたから、とする。仙台市博物館は、親から授かった体を欠いたのを親不孝と考えた、と説明する
#   ④どうなったか：像は片目には造らなかった。理由の書き方は記録と博物館で違うが、政宗の姿は両目で残された
title: 伊達政宗｜像を造るなら「両眼正しくせよ」
yt_title: 右目を失った伊達政宗は、死後の像を「両目で造れ」と命じていた
description: |-
  伊達政宗は、幼いころに右目の光を失いました。仙台藩がまとめた伊達家の記録『治家記録』は、政宗がいつも片目を恥じ、ことあるごとにその目を隠していた、人が片目の話をすると機嫌を損ねた、と書きとめています。
  寛永13年、1636年の5月24日。政宗は、江戸の桜田の屋敷で亡くなります。記録は、政宗がこう命じた、と伝えます。「薨去の後、尊像を造らば、両眼正しくせよ」。のちの世まで人に何か言われるだろうから、と。そして「尊像は隻眼に造り奉らず」と結びます。
  一方、仙台市博物館の解説は、親から授かった体の一部を欠いたことを、親不孝と考えたから、と説明しています。
hashtags: ["#伊達政宗", "#日本史", "#戦国時代"]
