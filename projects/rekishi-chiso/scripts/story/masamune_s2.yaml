lines:
  # fact: masamune-07, masamune-06
  - 語り: 右目を失った伊達政宗は、死んだあとの自分の像を、《!両目》で造れ、と命じた。記録は、そう伝える。
    shot: M09f
    tone: 強調
  # fact: masamune-79
  - 語り: 仙台藩がまとめた伊達家の記録、『治家記録』は、政宗の右目のことを、こう書いている。
    shot: Castletown
