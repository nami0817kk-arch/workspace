  # fact: masamune-06
  - 語り: 記録は、政宗の言葉を、こう伝える。「薨去の後、尊像を造らば、《両眼正しくせよ》」。
    shot: M05d
    tone: 強調
    pause: 0.12
  # fact: masamune-79, masamune-06
  - 語り: 像を造るなら、両方の目を、正しく造れ。のちの世まで、人に何か言われるだろうから、と。
    shot: M06
