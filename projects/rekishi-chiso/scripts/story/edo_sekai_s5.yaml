title: "ペリーの来航｜知らせは13隻"
yt_title: "ペリーの来航を、幕府は前の年に知らされていた　オランダの知らせは「船13隻・3125人」　浦賀に来たのは4隻だった"
description: |-
  1852年、長崎に着いたオランダ商館長クルティウスは、アメリカが日本へ艦隊を送ると知らせる書簡を、長崎奉行に差し出しました。翌1853年の別段風説書も、アメリカの計画を「船13隻、大砲236門、3125人」と伝えています。この風説書が、ペリーの来る前に長崎に届いたのかは分かっていません。
  1853年7月8日、浦賀の沖に来た艦隊は4隻、乗っていたのは1000人足らずでした。同じ1853年、中国では太平天国の軍が南京を首都にし、10月にはクリミア戦争が始まります。
  本編では、家康から慶喜までの260年を、同じ年の世界と並べています。本編は概要欄のリンクからどうぞ。
