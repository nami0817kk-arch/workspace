# 物語完結型ショート 小早川秀秋 s4（2026-10-29）。本編 scripts/hideaki-story.yaml の第4章（岡山の2年）から。
# 形式は hijikata_s3.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編の想像2「この堀の内で…」は使わない）。
# 絵は本編の AI 絵（H05・H06・H07・H08）と実在の絵（権中納言秀秋像）。人物は AI 絵に出さない。
# 事実カード：hideaki-27・28・30・31
#   ・二十日堀の築造は岡山市の解説、20日間の突貫工事は「と伝えられる」（hideaki-28）。石高は資料で50・51・55万石（hideaki-27）。
#   ・大納戸櫓台の石垣は文春オンラインの記事（hideaki-30、単一出どころ）→「と書く」。
#   ・杉原紀伊守の誅は『備前軍記』（江戸時代の軍記）が伝える（hideaki-31）→「と伝える」。事実として言い切らない。
# 理解テスト4問：
#   ①誰の話か：関ヶ原のあと岡山城に入った小早川秀秋（城主はわずか2年）
#   ②何をしたか：外堀の二十日堀を築き（慶長5〜7年）、大納戸櫓台の石垣も築いた、と岡山市・文春オンラインは書く
#   ③家の中は：備前軍記は、重臣の杉原紀伊守が諫言して誅せられたと伝える
#   ④どうなったか：その軍記は秀秋の死よりずっと後の本。いまも岡山城に残る石に、2年だけの城主の仕事が混じる
title: 小早川秀秋｜岡山城に残る、2年だけの城主の仕事
yt_title: 小早川秀秋が岡山に残したもの　二十日堀と石垣と、軍記が書く「諫めを聞かない主君」
description: |-
  関ヶ原のあと、小早川秀秋は備前と美作を与えられ、岡山城に入ります。城主だったのは、わずか2年でした。
  岡山市の解説によれば、岡山城の外堀、二十日堀は、秀秋が城主だった、慶長5年から7年のあいだに築かれました。領民から家臣まで動員した、20日間の突貫工事だった、と伝えられます。大納戸櫓の土台の石垣も、秀秋が築いたものだ、と文春オンラインの記事は書いています。
  一方、江戸時代の軍記『備前軍記』は、慶長6年8月ごろ、重臣の杉原紀伊守が、諫言したために誅せられた、と伝えます。その本が書かれたのは、秀秋の死よりずっとあとの時代でした。
