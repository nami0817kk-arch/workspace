# 物語完結型ショート 宮本武蔵 s2（2026-10-29）。本編 scripts/musashi-story.yaml の第1章（小倉碑文）から。
# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（M*.jpg。人物なし）と実在の絵図（豊前小倉之城図、国立国会図書館蔵）。決闘の場面に人物の絵は当てない。
# 事実カード：musashi-07・08・09・10・20・25
#   ・「木刃」「舟嶋」「岩流嶋」は福田正秀『宮本武蔵研究論文集』資料編の読み下し（Wikid が掲載）だけが出どころ → 「と読まれている」で留める。「孝子某」は言わない。
#   ・相手の名が「岩流」だけで「小次郎」が無いのは山口県観光連盟（musashi-08）。
# 理解テスト4問：
#   ①誰の話か：宮本武蔵と、決闘の相手の名
#   ②いつ・どこで何が：1654年、武蔵の死の9年後に、養子の宮本伊織が小倉の手向山に小倉碑文を建てた。相手は「岩流」とだけ書かれている
#   ③碑文は何を書いたか：舟嶋で、岩流を武蔵が木の刃の一撃で倒した、と読まれている。小次郎の名も弟子の話も無い
#   ④どうなったか：魚住孝至教授は最も信頼できる史料に挙げる。「佐々木小次郎」の名そのものも真偽は不明
title: 宮本武蔵｜最初の碑に、小次郎の名は無い
yt_title: 巌流島の相手は「小次郎」と書かれていない　武蔵の養子が建てた小倉碑文
description: |-
  巌流島の決闘の相手として知られる、佐々木小次郎。ところが、武蔵の養子が建てた最初の碑には、「小次郎」の名がありません。
  承応3年、1654年。武蔵が亡くなって9年後に、宮本伊織が小倉の手向山に碑を建てました。碑文は、相手を「岩流」と書きます。福田正秀さんの読み下しを載せるサイトによれば、岩流は真剣を求め、武蔵は木の刃で応じ、その一撃で倒した、と読まれています。
  国際武道大学の魚住孝至教授は、この小倉碑文を最も信頼できる史料に挙げています。「佐々木小次郎」という名前そのものも、真偽は不明だといいます。
