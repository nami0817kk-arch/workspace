lines:
  # fact: uesugi-25, uesugi-24
- 語り: "上杉家の家老、直江兼続は、数えで7歳の息子がいたのに、なぜ、家康の重臣の息子を、婿に迎えたのか。"
  shot: NK_1
  tone: 強調
  pause: 0.12
  # fact: uesugi-24
- 語り: "婿の名は、本多政重。家康の重臣、本多正信の次男だ。"
  shot: IE_2
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-85
- 語り: "本多家の記録、家譜は、こう書く。景勝には、実の子が無い。兼続の娘を景勝の養女にして、政重に嫁がせ、生まれた男の子に、上杉家を継がせたい。"
  shot: U07_3
  tone: 強調
  pause: 0.12
  # fact: uesugi-24
- 語り: "1604年の秋。兼続は、政重を養子に迎え、長女と夫婦にした。"
  shot: U21_4
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-29
- 語り: "ところが、同じ年の5月5日。景勝に、初めての男の子が生まれていた。のちの、上杉定勝だ。"
  shot: U22_5
  tone: 強調
  pause: 0.12
  # fact: uesugi-85
- 語り: "昭和19年の伝記で木村徳衛は、約束は定勝が生まれる前、1602年か1603年だった、と見ている。"
  shot: U04_6
  tone: しみじみ
  pause: 0.12
  # fact: uesugi-33
- 語り: "1609年6月。幕府は、上杉家の軍役、つまり幕府に出す兵と負担を、3分の1減らした。兼続が願い出て、正信が取りなした、と木村は書く。"
  shot: U23_7
  tone: 強調
  pause: 0.12
  # fact: uesugi-24
- 語り: "その2年後の1611年。政重は、上杉家を去った。"
  shot: U05_8
  tone: しみじみ
  pause: 0.12
  # tease：答えは本編 第6章（uesugi-25）
- 語り: "では、兼続の実の息子、景明は、どうなったのか。"
  shot: U28_9
  tone: 疑問
  pause: 0.15
