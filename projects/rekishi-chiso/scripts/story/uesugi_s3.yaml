# 物語完結型ショート 上杉景勝と直江兼続のその後 s3（2026-11-19）。本編 scripts/uesugi-sonogo-story.yaml（11/23 19:00 公開予定、https://youtu.be/kjuSGhzZWyw）から。11/24 15:30 に予約。
# 形式は atsuhime_s1・tsukiyama_s5 を写した。決まりは docs/story-shorts.md。想像の台詞なし。事実は事実カード（上杉景勝_facts_20261118.yaml）と本編の # fact: だけ。
# 絵：本編の AI 絵（out/story/uesugi/main/）の切り出しと、本編で使った徳川家康像（パブリックドメイン）だけ。新しい絵は作らない。
# 切り口：家康の重臣・本多正信の息子を婿に（本編 第4章、uesugi-24・25・85・29・33）。
# hook＝息子がいたのに、なぜ家康の重臣の息子を婿にしたのか（答えはこのショートの中：本多家譜＝景勝に実子が無く、生まれた男子に上杉家を継がせる約束。軍役の免除も）。
# tease＝婿が去ったあと、兼続の実の息子・景明はどうなったのか（答えは本編 第6章：1615年に18歳で死去）。
# 計算：景明 1598年生まれ→1604年に数え7。定勝 1604年5月5日生まれ。慶長7〜8年＝1602〜1603年。1609＋2＝1611。軍役の3分の1＝10万石分。
# 理解テスト：①直江兼続の話 ②1604年、本多正信の次男・政重を婿養子に ③本多家譜＝景勝に実子が無く、生まれた男子に上杉家を継がせる約束。同じ年に景勝に跡継ぎ ④1609年に軍役を3分の1減らされ、1611年に政重は去った
title: "直江兼続｜家康の重臣の息子を婿に"
yt_title: "直江兼続は、数えで7歳の息子がいたのに、家康の重臣・本多正信の息子を婿に迎えた　本多家の記録が書く約束"
description: |-
  関ヶ原で家康に逆らった上杉家の家老・直江兼続は、1604年、家康の重臣・本多正信の次男、本多政重を婿養子に迎えました。兼続には、数えで7歳の息子・景明がいました。
  本多家の家譜は、景勝に実の子が無いので、兼続の娘を景勝の養女として政重に嫁がせ、生まれた男の子に上杉家を継がせたい、と書きます。ところが同じ1604年の5月5日、景勝には跡継ぎの定勝が生まれていました。1609年、幕府は上杉家の軍役を3分の1減らし、1611年、政重は上杉家を去ります。
  本編では、30万石になった上杉家と直江兼続のその後をたどっています。本編は概要欄のリンクからどうぞ。
