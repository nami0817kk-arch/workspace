# 計算：二丈六、七尺＝26〜27尺×30.3cm＝約8メートル。亥の刻＝夜10時ごろ。
# 理解テスト4問：①土佐藩の役人 ②1808年、四国の測量で隊を国境で迎えた ③道の修繕を命じられ、人足400人、徹夜で磯の道を造った ④23日の日記に、一夜も眠れずと書いた。浜田藩の人足の数は本編
title: "土佐藩の役人は、日記に「一夜も眠れず」と書いた"
yt_title: "伊能忠敬の測量隊を迎えた土佐藩の役人は、日記に「一夜も眠れず」と書いた　人足400人と徹夜の道づくり"
description: |-
  1808年、文化5年。四国の測量で、伊能忠敬の隊は土佐藩の国境、甲浦に着きました。道の修繕を命じられた藩の役人は、一か月あまり隊に付き従い、日記を書きます。大谷亮吉『伊能忠敬』が、その日記を抜き書きしています。
  日記のはじめには、測量の用に使う人足は400人ほど、大送りだという、とあります。隊の宿は寺で、門の前には長さ8メートルほどの竹に、赤、白、青の幟。磯の道が整えられないと名主が訴えた夜、役人は夜の10時ごろに宿を出て、人を集め、道を造り、枝を刈りました。23日の日記には「甲浦を出てから今日まで一夜も眠れず、ひどく疲れた」。
  石見の浜田藩の記録は、忠敬の長持を運ぶのに、人足が何人かかったと書いたのか。本編は概要欄のリンクからどうぞ。
