  shot: S10
  tone: 重い
  pause: 0.12
  # fact: inou-22
- 語り: "隊の宿は寺。門の前には、長さ8メートルほどの竹に、赤、白、青の幟が立ててあった。"
  shot: S07
  tone: しみじみ
