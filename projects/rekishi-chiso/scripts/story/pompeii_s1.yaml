# 切り口：8月24日は、手紙の写本によって読みが違う（本編 第1章・第3章、pom-05・14・15・16・17・19）。
# 計算（自分で数え直した）：9月1日を1つ目に前の日へ9つ目＝8月24日／11月1日の9つ目＝10月24日。
# 字幕では読点が消えるので、並べる語は「と」でつなぐ。
title: "ポンペイ｜8月24日は、写本によって月が違う"
yt_title: "ポンペイの噴火「8月24日」は、手紙の写本によって月が違う　9世紀の写本は9月、古い刷り本には11月"
description: |-
  ポンペイの噴火は、79年8月24日とされています。この日付は、噴火を見た小プリニウスが、のちに歴史家タキトゥスに書いた手紙の、たった1か所から来ています。
  手紙の言葉は「9月のカレンダエの9日前」。いちばん古い、ほぼ完全な9世紀の写本は、この9月の読みです。ところが、ほかの写本には月の名が抜けたものがあり、古い時代に刷られた本には「11月のカレンダエ」と書くものもあります。
  秋の噴火を唱える人が挙げる10月24日は、どの写本にも、そのままの形ではありません。
  本編では、写本・秋の手がかり・2018年の炭の落書き・2024年の考古公園の試しを並べ、言えることと言えないことを分けています。本編は概要欄のリンクからどうぞ。
