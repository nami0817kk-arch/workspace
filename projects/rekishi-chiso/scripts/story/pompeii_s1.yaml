lines:
  # fact: pom-05, pom-16
- 語り: "広く知られたポンペイの噴火の日、79年8月24日。ところが、この日付を伝える手紙は、写本によって、月が違う。"
  shot: P15_1
  tone: 強調
  pause: 0.12
  # fact: pom-03, pom-04
- 語り: "日付を書いたのは、噴火を見た小プリニウス。のちに、歴史家タキトゥスにあてた手紙だ。"
  shot: P20_2
  tone: しみじみ
  pause: 0.12
  # fact: pom-05
- 語り: "手紙の言葉は、9月のカレンダエの、9日前。カレンダエは、月のついたちのことだ。"
  shot: P21_3
  tone: しみじみ
  pause: 0.12
  # fact: pom-14
- 語り: "ローマ式では、9月1日を1つ目と数えて、前の日へ9つ目。これが、8月24日になる。"
  shot: P21_4
  tone: しみじみ
  pause: 0.12
  # fact: pom-15
- 語り: "いちばん古い、ほぼ完全な写本は、9世紀に、今のドイツのフルダで書かれた。これは、9月の読みだ。"
  shot: P04_5
  tone: しみじみ
  pause: 0.12
  # fact: pom-16
- 語り: "ところが、ほかの写本には、月の名が抜けて、9日前、としか書いていないものがある。"
  shot: P04_6
  tone: 重い
  pause: 0.12
  # fact: pom-17
- 語り: "古い時代に刷られた本には、11月のカレンダエ、つまり、11月1日と書くものもある。"
  shot: P04_7
  tone: 重い
  pause: 0.12
  # fact: pom-19
- 語り: "秋の噴火を唱える人が挙げる10月24日は、どの写本にも、そのままの形では無い。2007年に、この日をとった論文の著者たち自身が、そう書いている。"
  shot: P19_8
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第4章〜第6章・まとめ
- 語り: "写本の読みは、割れている。では、噴火は、本当に8月だったのか。"
  shot: P01_9
  tone: 疑問
  pause: 0.15
