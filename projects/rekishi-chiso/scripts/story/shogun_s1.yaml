# 物語完結型ショート 徳川将軍の1日 s1（2026-11-06）。本編 scripts/shogun-story.yaml（11/9 19:00 公開、https://youtu.be/-kxBsJCne_k）の第1章・第3章から。11/10 9:30 公開。
# 形式は ooku_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし（本編にも無い）。
# 絵は本編の AI 絵（out/story/shogun/main。Gemini・FLUX）とベアト《江戸城》。新しい絵は作らない。
# 切り口：朝の膳のあいだも髪を結われ、膳が下がると奥医師が脈をとる。秤の話（第2章）は tease の答えとして本編に残す。
# どの将軍の記録か：『千代田城大奥』（1892）の「将軍の日課」＝おもに12代家慶・13代家定のころの元御小姓の話（本編の description_note のまま）。
# 事実カード（dev/output/rekishi-chiso/research/将軍の1日_facts_20261106.yaml）：shogun-05・20・25・04・22・23・13。言い方は本編のまま。
#   ・朝の膳は五つ＝午前8時ごろ（本編の第1章の終わり）。元結12〜13本、奥医師30人のうち6人ほど・2人ずつ。本編どおり。
# 理解テスト4問：
#   ①誰の話か：幕末の徳川将軍（12代家慶・13代家定のころ）の朝。元御小姓の話（『千代田城大奥』）
#   ②いつ・どこで何が：江戸城の朝。六つに「モウ」で起き、五つに朝の膳。食べているあいだに小姓が髪を結った
#   ③何が意外か：髪を結うほうが食事より長く、膳が下がると、結い終わらないうちに奥医師が2人ずつ脈をとった
#   ④どうなっていたか：病気でなくても毎朝。朝ご飯のあいだも、ひとりではなかった
title: 徳川将軍｜朝ご飯は、ひとりで食べたのか
yt_title: 徳川将軍は朝ご飯をひとりで食べていたのか　食べながら髪を結われ、膳が下がれば医師が脈をとった朝
description: |-
  天下を治めた徳川将軍は、朝ご飯を、ひとりで食べていたのでしょうか。
  明治25年（1892年）の本『千代田城大奥』に、12代家慶や13代家定に仕えた元の御小姓たちの話が残っています。朝の六つ時、将軍が目を覚ますと、小姓が「モウ」と声を上げ、それが起きた合図でした。朝の膳は五つ、午前8時ごろ。食べているあいだ、後ろでは御髪番の小姓たちが髪を結っていました。代々の将軍は、食事のときに髪を結う定めだったのです。髷の根元には白い元結を12本から13本も巻き、顔と月代を剃るのもこの係でした。しかも髪を結うほうが食事より長くかかり、膳が下がると、まだ結い終わらないうちに奥医師が入ってきます。30人のうち6人ほどが次の間に平伏し、2人ずつ進み出て脈をとりました。病気でなくても、毎朝のことでした。
  では、具合が悪い日、将軍が食べたご飯は、どうされたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川将軍', '#日本史', '#江戸時代']
