# 物語完結型ショート 徳川将軍の1日 s3（2026-11-06）。本編 scripts/shogun-story.yaml（11/9 19:00 公開、https://youtu.be/-kxBsJCne_k）の第4章から。11/10 15:30 公開。
# 形式は ooku_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。絵は本編の AI 絵。新しい絵は作らない。
# 切り口：昼の政務。御用取次の読み上げ、「伺の通りたるべく候」の札、即下げ。目安箱・講釈・菓子は使わない。
#   御成（第5章）は tease の答えとして本編に残す。
# どの将軍の記録か：『千代田城大奥』（1892）＝12代家慶・13代家定のころの元御小姓の話。政務の長さは松平太郎『江戸時代制度の研究』（1919）。
# 事実カード：shogun-25・26・27。言い方は本編のまま。
#   ・札の文句「伺の通りたるべく候」・奉書の紙を16に切った札。本編どおり。
# 理解テスト4問：
#   ①誰の話か：幕末の徳川将軍（家慶・家定のころ）の昼の政務
#   ②何をしたか：昼の膳のあと、御用取次が老中からの書類を読み上げ、将軍が認めると「伺の通りたるべく候」の札を挟んで返した
#   ③どれほどか：ふつう2〜3時間以上、長いと灯をともすころまで
#   ④急ぎのときは：「即下げ」が出ると、大奥にいても酒宴の最中でも出てきた
title: 徳川将軍｜昼は何を決めていたのか
yt_title: 徳川将軍は昼に何を決めていたのか　「伺の通りたるべく候」の札と、宴の途中でも呼び出す「即下げ」
description: |-
  天下を治めた徳川将軍は、昼に、何を決めていたのでしょうか。
  明治25年（1892年）の本『千代田城大奥』に残る、12代家慶や13代家定のころの元御小姓の話です。九つ、正午の昼の膳のあとは政務でした。御用取次という側近が人払いをして、老中から上がってきた書類を将軍の前で読み上げます。将軍が認めると、奉書の紙を16に切った札に「伺の通りたるべく候」と書いたものを書類に挟んで、老中へ返しました。願い出たとおりでよろしい、今でいえば決裁の印です。松平太郎の『江戸時代制度の研究』（1919年）によると、政務はふつう2時間か3時間以上、長いときは灯をともすころまで続きました。急ぎの書類は「即下げ」と断って出され、即下げが出ると、将軍は大奥にいても、酒宴の最中でも出てきました。年の暮れには即下げが多いのが毎年の例だったといいます。
  では、将軍は、城の外へ出られたのか。本編は概要欄のリンクからどうぞ。
hashtags: ['#徳川将軍', '#日本史', '#江戸時代']
ai_images: true
