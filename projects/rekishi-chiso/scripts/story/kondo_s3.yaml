# hook＝近藤をかばったのは敵の薩摩（答えはこのショートの中：平田が拷問を止め、伊地知が迫り、薩摩の案は京都へ送る）。
#   「兵を率いて帰る」は拷問の論を止める口論での伊地知の勢い（本編の注のとおり。処分の案をめぐる脅しにしない）。
# tease＝処刑の場に立てられた札は、近藤を何と書いたのか（答えは本編 第6章：元来浮浪の者、kondo-54・55）。
# 計算：生まれ 1834年11月9日 → 死 1868年5月17日（慶応4年4月25日）。数え 35（本編の計算どおり）。
# 理解テスト：①近藤勇の処分の話 ②1868年4月、板橋の総督府で ③土佐は拷問を求め、薩摩はかばって京都へ送る案 ④大総督の宮に伺い、斬首して京都へ送ると決まり、4月25日に板橋で斬られた
title: "近藤勇｜かばったのは、敵の薩摩だった"
yt_title: "近藤勇をかばったのは、敵の薩摩だった　板橋の総督府で薩摩と土佐が割れ、斬首して京都へ送ると決まるまで"
description: |-
  1868年4月、板橋の総督府。正体が分かった新選組の局長、近藤勇の扱いをめぐって、官軍は割れました。
  土佐の谷干城の『東征私記』によれば、谷たちは「ほとんど博徒の頭と同じだ」と言い、拷問してでも問い詰めたいと考えました。これを止めたのは、敵の薩摩です。薩摩の参謀、伊地知正治は、この論を採らないなら兵を率いて帰る、と言うほどの勢いで総督に迫りました。薩摩の案は、近藤をそのまま京都へ送るという、寛大なものでした。それでも、大総督の宮に伺って、「斬首して京都へ送る」と決まります。
  本編では、処刑の場に立てられた札が近藤を何と書いたのか、なぜ切腹ではなく斬首だったのかを、当時の記録で並べています。本編は概要欄のリンクからどうぞ。
