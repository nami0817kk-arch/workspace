lines:
  # fact: kondo-26, kondo-29
- 語り: "近藤勇を、官軍の取り調べの場でかばったのは、敵の薩摩だった。"
  shot: D15_1
  tone: 強調
  pause: 0.12
  # fact: kondo-24
- 語り: "1868年4月、板橋の総督府。谷干城の記録、『東征私記』は書く。近藤は、縁側の下に、むしろを敷いて、座らされた。"
  shot: D14_2
  tone: しみじみ
  pause: 0.12
  # fact: kondo-26
- 語り: "土佐の谷たちは、勝海舟たちとの関わりを吐かせるため、拷問してでも問い詰めたい、と考えた。"
  shot: D15_3
  tone: 重い
  pause: 0.12
  # fact: kondo-26
- 語り: "同じ席にいた薩摩の平田が、これを止める。近藤も、卑しい者ではない。拷問は、よくない。"
  shot: D15_4
  tone: しみじみ
  pause: 0.12
  # fact: kondo-27
- 語り: "谷たちは言い返す。近藤には、位も無い。ほとんど、博徒の頭と同じだ。"
  shot: D14_5
  tone: 重い
  pause: 0.12
  # fact: kondo-28
- 語り: "話は総督のもとへ。薩摩の参謀、伊地知正治は、この論を採らないなら、兵を率いて帰る、と言うほどの勢いで迫った。"
  shot: D05_6
  tone: 重い
  pause: 0.12
  # fact: kondo-29
- 語り: "薩摩の案は、近藤を、そのまま京都へ送る。谷の言葉では、死さえ免れるかもしれないほど、寛大だった。"
  shot: D10_7
  tone: しみじみ
  pause: 0.12
  # fact: kondo-29
- 語り: "けれど、全軍の総大将、大総督の宮に伺って、こう決まった。斬首して、京都へ送る。"
  shot: D06_8
  tone: 重い
  pause: 0.12
  # fact: kondo-102
- 語り: "4月25日。近藤勇は、板橋で斬られた。数えで35歳。"
  shot: D18_9
  tone: 重い
  pause: 0.12
  # tease：答えは本編 第6章（kondo-54・55）
- 語り: "処刑の場に立てられた札は、近藤を、何と書いたのか。"
  shot: D19_10
