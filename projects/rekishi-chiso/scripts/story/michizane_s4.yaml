lines:
  # fact: michizane-14
- 語り: "菅原道真が死んで20年。皇太子が亡くなると、都の人々は、道真の霊の、恨みのしわざだと言った。"
  shot: M18_1
  tone: 強調
  pause: 0.12
  # fact: michizane-01, michizane-12
- 語り: "道真に左遷を言い渡したのは、醍醐天皇。そのときの左大臣は、藤原時平だった。"
  shot: M03_2
  tone: しみじみ
  pause: 0.12
  # fact: michizane-12
- 語り: "909年、その時平が、39歳で亡くなる。"
  shot: M16_3
  tone: 重い
  pause: 0.12
  # fact: michizane-13, michizane-31, michizane-01
- 語り: "913年。道真のあとに右大臣となった源光は、狩りの最中に、馬で、泥の中へ駆け込んだ。遺骸は、見つからなかった。"
  shot: M17_4
  tone: 重い
  pause: 0.12
  # fact: michizane-14
- 語り: "そして923年、醍醐天皇の皇太子、保明親王が、21歳で亡くなった。"
  shot: M18_5
  tone: 重い
  pause: 0.12
  # fact: michizane-14
- 語り: "『日本紀略』は書く。人々の泣く声は、雷のようだった。世を挙げて言った。菅帥の霊魂の、恨みのしわざだ。"
  shot: M18_6
  tone: 重い
  pause: 0.12
  # fact: michizane-15
- 語り: "1か月後、醍醐天皇は、道真を右大臣に戻し、道真を流した、あの詔書を、捨てさせた。"
  shot: M19_7
  tone: 強調
  pause: 0.12
  # fact: michizane-32
- 語り: "けれど、次の皇太子、3歳の慶頼王も、925年に、5歳で亡くなる。母は、時平の娘だった。"
  shot: M16_8
  tone: しみじみ
  pause: 0.12
