title: "菅原道真｜都で続いた死"
yt_title: "菅原道真が死んだあと、都で続いた死　皇太子の死を人々は「菅帥の霊魂の恨み」と言い、朝廷は左遷の詔書を捨てさせた"
description: |-
  901年、右大臣の菅原道真は大宰府へ流され、903年にそこで亡くなりました。左遷を言い渡したのは醍醐天皇、そのとき、左大臣だったのは藤原時平です。
  延喜9年（909）、時平が39歳で亡くなります。延喜13年（913）には、道真のあとに右大臣となった源光が、狩りの最中に馬で泥の中へ駆け込み、遺骸は見つかりませんでした（『日本紀略』）。
  延喜23年（923）3月21日、醍醐天皇の皇太子・保明親王が21歳で亡くなると、『日本紀略』は「世を挙げて言った、菅帥の霊魂の恨みのしわざだ」と書きました。1か月後、醍醐天皇は道真を右大臣に戻し、左遷の詔書を捨てさせます。それでも、次の皇太子で時平の孫の慶頼王も、延長3年（925）に5歳で亡くなりました。
  本編では、左遷の日、大宰府での2年、59歳の死、清涼殿の雷、そして学問の神様になるまでを、当時の記録でたどっています。本編は概要欄のリンクからどうぞ。
