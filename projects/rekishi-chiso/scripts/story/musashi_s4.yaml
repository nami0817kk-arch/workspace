# 物語完結型ショート 宮本武蔵 s4（2026-10-29）。本編 scripts/musashi-story.yaml の第3章（『二天記』）から。
# 形式は takasugi_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。
# 絵は本編の AI 絵（M*.jpg。人物なし）のみ。決闘を描いた錦絵（歌川芳房）は決闘の場面に人物の絵を当てない決まりのため使わない。
# 事実カード：musashi-22・23・24・49
#   ・成立年は山口県観光連盟が1755年（宝暦5年）、J-CAST ニュースが1776年。どちらとも決めず「1755年とも1776年とも」。
#   ・歌舞伎の要素は魚住孝至教授の見方（musashi-23）。創作とみる見方が有力は国立国会図書館などの回答（musashi-24）。
# 理解テスト4問：
#   ①誰の話か：宮本武蔵の決闘を詳しく書く『二天記』
#   ②いつ・どこで何が：八代藩の家臣、豊田景英が書いた。成立は1755年とも1776年とも。決闘の100年以上あと。遅れて来る武蔵に小次郎が怒る場面がある
#   ③なぜ疑われるか：1737年初演の歌舞伎『敵討巌流島』などの要素が取り入れられている、と魚住教授は見る。決闘の記述は創作とみる見方が有力
#   ④どうなったか：近代に広まった決闘の様子の多くはこの本に基づき、吉川英治の小説の下敷きになった
title: 宮本武蔵｜遅れて来る武蔵は、100年以上あとの本にいた
yt_title: 「遅れて来る武蔵」は『二天記』の場面　決闘の100年以上あとに書かれた巌流島
description: |-
  遅れて来た武蔵に、小次郎が怒る。巌流島の有名な場面は、『二天記』にあります。
  書いたのは、八代藩の家臣、豊田景英。成立は1755年とも1776年ともいわれ、決闘の100年以上あとです。勝負の場面には、1737年に初演された歌舞伎『敵討巌流島』などの要素が取り入れられている、と国際武道大学の魚住孝至教授は見ています。決闘の記述は作者の創作とみる見方が有力だ、と国立国会図書館などの回答は紹介しています。
  それでも、近代に広まった決闘の様子は、多くがこの本に基づくといいます。吉川英治の小説も、これを下敷きにしました。
hashtags: ["#宮本武蔵", "#日本史", "#巌流島"]
ai_images: true
ai_disclosure: この動画の人物・情景の画像の多くは、画像生成AI（Google の Gemini）で作った想像上のイメージで、記録映像・実在の写真ではありません（画面に「AI生成画像」と出しています）。
