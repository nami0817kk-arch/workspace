lines:
  # fact: joguo-06
- 語り: "東の国へ逃げて、兵を挙げれば、必ず勝てる。643年の冬、聖徳太子の長男は、そう勧められた。"
  shot: G13_1
  tone: 強調
  pause: 0.12
  # fact: joguo-03, joguo-04
- 語り: "長男の名は、山背大兄王。蘇我入鹿の兵に、斑鳩の宮を焼かれ、一族と、生駒山に隠れていた。"
  shot: G12_2
  tone: しみじみ
  pause: 0.12
  # fact: joguo-06
- 語り: "勧めたのは、家臣の三輪文屋君。一族の暮らしを支える乳部の民をもとに、兵を起こす策だった。"
  shot: G13_3
  tone: しみじみ
  pause: 0.12
  # fact: joguo-07
- 語り: "山背の答えは、『日本書紀』に、こう残っている。"
  shot: R01_4
  tone: しみじみ
  pause: 0.12
  # fact: joguo-07
- 語り: "お前の言うとおりにすれば、勝つだろう。けれど私は、これから10年は、民を使うまいと、心に決めている。"
  shot: G13_5
  tone: 強調
  pause: 0.12
  # fact: joguo-07
- 語り: "自分ひとりのために、どうして、多くの民を苦しめられようか。"
  shot: G01_6
  tone: しみじみ
  pause: 0.12
  # fact: joguo-10
- 語り: "山背たちは、山を下りて、斑鳩の寺に入った。兵たちは、すぐに、寺を取り囲んだ。"
  shot: G14_7
  tone: 重い
  pause: 0.12
  # fact: joguo-11, joguo-12
- 語り: "この身を、入鹿に与えよう。そう伝えさせた山背は、子や弟や妃たちとともに、一度に、自ら命を絶った。"
  shot: GEND_8
  tone: 重い
  pause: 0.12
