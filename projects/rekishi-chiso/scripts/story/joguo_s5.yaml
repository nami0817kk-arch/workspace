# 形式は senhime_s1〜s5・ise_s1〜s5 を写した。決まりは docs/story-shorts.md。想像の台詞・作った筋なし。事実は本編の # fact:（事実カード 上宮王家_facts_20261121.yaml）だけ。
# 絵：本編の AI 絵（out/story/joguo/main/ の G・R）の切り出しだけ。新しい絵は作らない。
# 切り口：生駒山で三輪文屋君に「東の国で兵を起こせば必ず勝つ」と勧められ、山背は「10年は民を使うまい」と断って、斑鳩の寺で一族と命を絶った（本編 第4章、joguo-06・07・10・11・12）。
# hook＝逃げれば勝てた王は何を選んだか（答えはこのショートの中：民を戦に使わず、寺で一族とともに命を絶った）。
# tease＝襲った側にのちの天皇の名を挙げる記録がある、それは誰か（答えは本編 第5章とまとめ：補闕記の挙げる軽王、のちの孝徳天皇。joguo-28・41）。
# 字幕では読点が消えるので、「子や弟や妃たち」と「や」でつないだ。
# 理解テスト：①聖徳太子の長男、山背大兄王の話 ②643年の冬、生駒山から斑鳩の寺へ ③逃げて兵を挙げれば勝てると勧められたが、10年は民を使わないと決めていると断った ④寺を囲まれ、子や弟や妃たちと一度に命を絶った
title: "山背大兄王｜逃げれば勝てた王の答え"
yt_title: "「逃げて兵を挙げれば必ず勝てる」　そう勧められた聖徳太子の長男・山背大兄王の答え　643年"
description: |-
  643年の冬、蘇我入鹿の兵に斑鳩の宮を焼かれた聖徳太子の長男、山背大兄王は、一族と生駒山に隠れていました。
  家臣の三輪文屋君は、東の国へ移って兵を起こせば必ず勝てる、と勧めます。『日本書紀』によれば、山背の答えは「勝つだろう。けれど私は、これから10年は民を使うまいと決めている」。
  山背たちは山を下りて斑鳩の寺に入り、兵に囲まれ、子や弟、妃たちとともに、一度に命を絶ちました。
  本編では、襲った側の名や亡くなった人の数が、記録ごとにどう違うのかまでたどっています。本編は概要欄のリンクからどうぞ。
