# 物語完結型ショート 鶴松 s4（2026-11-06）。本編 scripts/tsurumatsu-if-story.yaml（11/7 12:00 公開）の第4章・第5章（秀次の関白と秀次事件）から。11/8 16:30 公開。
# 形式は maizo_s1.yaml を写した。決まりは docs/story-shorts.md。想像の台詞なし。「もしも」は最後の問いだけ（事実と混ぜない）。
# 絵は本編の AI 絵（out/story/tsurumatsu-if/main/T*）と本編で使った実在の肖像だけ。T07・T08・T29・T30 は使わない（s1 の頭のとおり）。
#   処刑・切腹の場面は描かない（腹を切った行は僧衣で書状を読む秀次の絵、三条河原は出さない）。
# 切り口：秀吉が秀次の数え2歳の若君に大和を継がせると言い出した（4月26日、木下吉隆の4月27日付の手紙）2か月あまり後に、秀次は高野山で腹を切る。
#   切腹を命じたかは研究者で割れる（矢部健太郎／2015年の奈良高専の紀要の論文）。本編の答え（もしもの見立て：つなぎの関白なら火種は小さい）は言わない。
#   公開済みの秀次の回（10/28）と重ならないよう、命令の有無は1行で触れるだけ。
# 事実カード：tsurumatsu-08・11・41・42・46・49・50。言い方は本編のまま。
# 計算（自分で計算し直した）：1591年8月5日→12月27日（または28日）で5か月たたない。4月16日→27日は11日。4月27日→7月8日は2か月11日（「2か月あまり」）。
#   秀保は1579年生まれで1595年に数え17（事実カードの享年）。拾は1593年生まれで1595年に数え3。
# 理解テスト4問：
#   ①誰の話か：豊臣秀吉の甥、関白の秀次
#   ②いつ・どこで何が：1595年、秀吉が秀次の2歳の子に大和を継がせると言った2か月あまり後、秀次は伏見で会えず高野山へ
#   ③何が起きていたか：1593年に拾（秀頼）が生まれ、12日に三成と増田長盛が拾への忠誠を誓う
#   ④どうなったか：15日、秀次は高野山の青巌寺で腹を切った。命じたかは研究者で割れる。もしもの問いで閉じる
title: 秀次事件｜2か月あまり前の約束
yt_title: 秀吉は秀次の2歳の子に大和を継がせると言った　その2か月あまり後、関白の秀次は高野山で腹を切った
description: |-
  1591年、豊臣秀吉の跡継ぎ、鶴松が数えで3歳で亡くなり、5か月たたないうちに、甥の秀次が関白になりました。2年後の1593年、茶々が、また男の子を産みます。拾、のちの秀頼です。
  1595年の4月16日、秀次の弟の秀保が、大和の十津川で死にます。4月27日付の木下吉隆の手紙によると、秀吉は前の日に、主のいなくなった大和の国を、秀次の数えで2歳の若君に継がせる、と言い出していました。
  その2か月あまり後の7月8日、秀次は伏見城へ向かいますが、秀吉に会うことも許されず、高野山へ行くよう命じられます。12日、石田三成と増田長盛は、血判を押した起請文で、数えで3歳の拾に尽くすと誓いました。15日、秀次は高野山の青巌寺で腹を切ります。秀吉が命じたのか、自ら切ったのか、研究者の読みは割れています。
  もしも鶴松が生きていたら、秀次事件は起きたのか。本編は概要欄のリンクからどうぞ。
