# 切り口：綱吉の死（1709年正月10日）から10日後、幕府は鳶と烏を放した。続けることは遺言だったのに廃止。それでも捨て子・捨て牛馬を禁じる触れは残った（本編の第6章）。
# 計算（自分で計算し直した）：正月10日＋10日＝正月20日
title: "生類憐みの令｜綱吉の死から10日後、鳥が放された"
yt_title: "生類憐みの令　綱吉の死から10日後、鳶と烏が空へ放された　続けることが遺言だったのに、幕府は廃止へ"
description: |-
  1709年の正月10日、徳川綱吉が亡くなりました。生類憐みの令を続けることは綱吉の遺言だった、と根崎光男の論文は書きますが、幕府は廃止に踏み切り、10日後の正月20日、預かっていた鳶と烏をすべて放しました。
  中野の犬小屋もなくなりました。けれど、捨て子と捨て牛馬を禁じる触れは、その後も長く幕府の法として生きた、と歴史学者の塚本学は書いています。
  本編では、触れの中身・罰の記録・悪い評判の出どころを並べて、生類憐みの令は本当に悪法だったのかを確かめています。本編は概要欄のリンクからどうぞ。
