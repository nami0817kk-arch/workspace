lines:
  # fact: shorui-16
- 語り: "幕府が預かっていた、鳶と烏が、すべて空へ放された。綱吉の死から、10日後のことだ。"
  shot: N22_1
  tone: 強調
  pause: 0.12
  # fact: shorui-16
- 語り: "1709年、宝永6年の正月10日。5代将軍、徳川綱吉は、亡くなった。6代将軍は、家宣だ。"
  shot: N21_2
  tone: しみじみ
  pause: 0.12
  # fact: shorui-16
- 語り: "根崎光男の論文によれば、生類憐みの令を続けることは、綱吉の遺言だった。それでも、幕府は、廃止に踏み切る。"
  shot: N04_3
  tone: 重い
  pause: 0.12
  # fact: shorui-16
- 語り: "正月20日に、鳶と烏を放し、2月2日には、小石川の鶴も、放した。"
  shot: N22_4
  tone: しみじみ
  pause: 0.12
  # fact: shorui-16
- 語り: "中野の犬小屋も、なくなった。そのために江戸の町から集めていたお金も、止められる。"
  shot: N01_5
  tone: しみじみ
  pause: 0.12
  # fact: shorui-17
- 語り: "ところが、すべてが消えたのでは、ない。歴史学者の塚本学は、捨て子と、捨て牛馬を禁じる触れは、その後も長く、幕府の法として生きた、と書く。"
  shot: N24_6
  tone: 重い
  pause: 0.12
  # fact: shorui-11
- 語り: "中野の犬小屋の跡の一部は、のちに8代将軍の吉宗が気に入り、紅白の桃を植えさせて、花見の名所、桃園になった。"
  shot: N23_7
  tone: しみじみ
  pause: 0.12
  # fact: shorui-17
- 語り: "犬の囲いは消え、捨て子の触れは残った。生類憐みの令は、本当に、悪法だったのか。"
  shot: N10_8
  tone: 疑問
  pause: 0.15
