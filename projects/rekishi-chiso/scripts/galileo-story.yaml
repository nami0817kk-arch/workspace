# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  「それでも地球は動く」。ガリレオの言葉として、世界中が知っています。ところが、ガリレオが地動説を捨てると誓った1633年6月22日の記録に、この言葉は、一言もありません。
  最初に活字になったのは、1757年のロンドンの本。ガリレオの死から115年後です。
  判決・誓絶の文書・弟子の伝記・最初の活字・謎の絵。記録と物証で、「言った場面」の3つの説を採点しました。
  この動画でわかること
  ・判決と誓絶の記録が「書いていること」と「書いていないこと」
  ・10人の枢機卿のうち、判決に署名したのは7人だった
  ・最初に台詞を活字にした本の、2つの誤り
  ・「牢の壁の絵」の正体と、教会が認めたこと・認めなかったこと
description_note: |-
  採点の決まり（3つの手がかり、①その場面が17世紀の記録にあるか・②判決・誓絶・弟子の伝記に台詞が出るか・③最古の活字と絵が17世紀まで遡るか、を2点・1点・0点で数える）は、この動画で決めたものです。点は、今回たどれた記録と報告の範囲での目安です。決まりを変えれば順位も変わりえます。
  判決・誓絶文は、ガリレオ全集（国定版）第19巻のイタリア語の転写と英訳で、ヴィヴィアーニ伝は1654年の原文で、バレッティ『イタリアの文庫』（1757）と『文芸論争』（1761）は原本の全文テキストで読みました。1992年の教皇の演説は、バチカンのフランス語原文で読みました。尋問の日付、署名しなかった3人の名、1737年の改葬などは、論文・博物館の解説・転写との突き合わせによります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。ガリレオの姿も、特定の資料を写したものではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Did Galileo Really Say 'And Yet It Moves'? The Record of the Day He Recanted Has No Such Words"
  description: |-
    "And yet it moves." The world knows it as Galileo's line. But the records of 22 June 1633, the day he abjured the motion of the Earth, do not contain it.
    It first appears in print in London in 1757, 115 years after his death.
    We took three clues, the records, the first printed text and a mysterious painting, and scored three theories of where he said it.
    In this video you will learn:
    - What the sentence and abjuration say, and what they do not
    - Only seven of the ten cardinals signed the sentence
    - Two errors in the book that first printed the line
    - The truth about the "prison wall painting", and what the Church admitted and did not
    The scoring rules were set for this video; the scores reflect only the records we could trace. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "The Day of the Abjuration"
    - "What Do the Records Say?"
    - "Three Theories, Three Clues"
    - "The Disciple's Biography and Eight Years at Arcetri"
    - "The First Printed Text"
    - "The Painting on the Prison Wall"
    - "The Scores"
    - "How the Church Moved"
    - "Summary: Did Galileo Say It?"

