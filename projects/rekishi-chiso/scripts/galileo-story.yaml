sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 誓った日の記録　ガリレオ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1633
    lines:
      # fact: galileo-09
      - 語り: 「それでも地球は動く」。ガリレオの言葉として、世界中が知っています。ところが、地動説を捨てると誓った、その日の記録に、この言葉は、一言もありません。
        tone: 重い
      # fact: galileo-23, galileo-53
      - 語り: この言葉が、はじめて活字になったのは、1757年のロンドンの本です。ガリレオの死から115年後。誓った日から数えれば、124年後でした。
      # fact: galileo-23, galileo-55
      - 語り: しかも、その本は、ガリレオが6年間、異端審問所にいて、拷問も受けた、と書いています。どちらも、記録とは、合いません。
      # fact: galileo-05
      - 語り: 誓った日の記録には、ほかにも、意外なことが並んでいます。ガリレオを裁いた枢機卿は、10人。ところが、判決に署名したのは、7人だけでした。
        tone: 重い
      # fact: galileo-08
      - 語り: しかも、判決も、誓いの文書も、ガリレオを「70歳」と書いています。本当は、69歳でした。
      - 語り: 言ったのか、言わなかったのか。判決、誓いの文書、弟子の伝記、最初の活字、謎の絵。記録と物証で採点すると、答えは、「言えること」と「言えないこと」に、分かれました。
        tone: 疑問
        hook: true
      # fact: galileo-01
      - 語り: 場面を、1633年6月22日に戻します。ローマ、ミネルヴァ修道院。異端審問を行う役所、聖務省の判決が、言い渡される日です。
        year: 1633
      # fact: galileo-06, galileo-08
      - 語り: 69歳のガリレオは、枢機卿たちの前で、ひざまずきました。手にしているのは、聖務省が用意した、誓いの文書です。
      # fact: galileo-06
      - 語り: 地球が動く、という説を、「呪い、嫌う」。そう、一語ずつ声に出して読む、文書でした。
        tone: 重い
      # fact: galileo-07
      - 語り: 文書は、こう続きます。異端者や、異端の疑いのある者を、知ったら、聖務省に、告発します。ガリレオは、そう誓わされたのです。
      # fact: galileo-06
      - 語り: 読み終えて、ガリレオは、自分の手で署名しました。「私、ガリレオ・ガリレイは、上のとおり、誓絶しました」。
      - 語り: 後の世には、誓い終えた直後に、こう言ったと語られます。「それでも、地球は、動く」。
        tone: 疑問
      - 語り: 記録は、この場面を、どう書いたのか。まず、判決の本文から、読んでいきます。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 記録は、1633年6月22日をどう書いたのか
  - title: 記録は、6月22日をどう書いたのか　判決・誓絶・尋問
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1633
    lines:
      # fact: galileo-04
      - 語り: 問題にされたのは、1632年にフィレンツェで出た、『天文対話』という本です。地動説と、天動説を、対話の形で並べた本でした。
      # fact: galileo-01
      - 語り: 判決は、イタリア語で書かれています。当時の写しが、モデナの古文書館に残り、ガリレオ全集の第19巻に収められています。
      # fact: galileo-02
      - 語り: ガリレオの罪名は、異端と断定された、ではありません。「強い異端の疑い」です。刑は、聖務省の「正式な牢」で、期間は、「われらの裁量」と書かれました。
        figure: {type: stats, title: 判決が決めたこと, items: [[罪名, 強い異端の疑い, 異端そのものではない], [刑, 正式な牢, 期間は聖務省の裁量], [祈り, 週に1回, 七つの悔悛詩篇を3年]], upto: 2}
      # fact: galileo-03, galileo-04
      - 語り: 加えて、3年のあいだ、毎週1回、七つの悔悛詩篇を唱えること。そして、『天文対話』は、公の布告で、禁書とされました。
        figure: {type: stats, title: 判決が決めたこと, items: [[罪名, 強い異端の疑い, 異端そのものではない], [刑, 正式な牢, 期間は聖務省の裁量], [祈り, 週に1回, 七つの悔悛詩篇を3年]], upto: 3}
      # fact: galileo-02
      - 語り: 判決は、刑を、軽くしたり、変えたり、取り除いたりする権利を、聖務省の手元に、残しています。いつでも、動かせる刑でした。
        figure: null
      # fact: galileo-05
      - 語り: 判決の冒頭には、判事として、10人の枢機卿の名が並びます。ところが、末尾の署名欄にあるのは、7人。ボルジア、ザッキア、そして教皇ウルバヌス8世の甥、フランチェスコ・バルベリーニの名は、見あたりません。
        tone: 重い
      # fact: galileo-05
      - 語り: 署名しなかった理由は、記録に書かれていません。分かるのは、署名の数が、全員ではなかった、ということまでです。
      # fact: galileo-57
      - 語り: 話は、17年前にさかのぼります。1616年3月5日、禁書目録を扱う聖省は、地動説を説く本を、禁じました。ガリレオの本が裁かれる、17年前のことです。
      # fact: galileo-48
      - 語り: ここに、記録どうしの、食い違いがあります。判決は、1616年の出来事を引きます。聖務省の記録では、2月26日、ガリレオはベラルミーノ枢機卿に訓戒され、直後に、地動説を教えることも、いかなる方法で論じることも、禁じられました。
      # fact: galileo-48
      - 語り: ところが、ガリレオが持っていた、同じ年5月26日の、ベラルミーノの証明書には、その禁止の言葉が、ありません。判決は、そのずれを、自分で書いています。
        tone: 重い
      # fact: galileo-10
      - 語り: 1633年の尋問は、4月12日、4月30日、5月10日、そして、6月21日。最後の尋問の前に、教皇ウルバヌス8世が、ガリレオの本心を調べるよう、命じていました。
      # fact: galileo-11
      - 語り: 6月21日の記録は、ラテン語で、こう書きます。真実を言え。さもなくば、拷問に至る。
        tone: 重い
        pause: 0.6
      # fact: galileo-11, galileo-12
      - 語り: ただし、拷問は、行われませんでした。判決も、ガリレオはこの尋問に、カトリックとして答えた、と書いています。記録にあるのは、脅しまでです。
      # fact: galileo-06
      - 語り: そして、6月22日。誓絶とは、自分の説を捨てる、と誓い、その説を、呪い、嫌う、と宣言することです。ガリレオの文書にも、「呪い、嫌う」と、書かれていました。
      # fact: galileo-09
      - 語り: 判決の全文、誓絶の全文を、イタリア語と英訳で、読み通しても、「それでも動く」に当たる言葉は、ありません。
        tone: 重い
      # fact: galileo-13
      - 語り: 判決の翌日、刑は、ヴィラ・メディチでの軟禁に、変わりました。牢に6年、という話とは、ここで、すでに合いません。
      - 語り: 台詞は、判決にも、誓いにも、ない。では、その場面は、どこだったのか。採点の決まりを、見せます。
        hook: true

  # ================================================================ 第2章 採点の決まり（約20%）
  - title: 採点の決まり　3つの説と3つの手がかり
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: まず、「言った場面」の説です。1つ目は、誓絶の直後に、口にした。よく知られた説です。
        figure: {type: stats, title: 言った場面の3つの説, items: [[説1, 誓絶の直後, ミネルヴァ修道院で], [説2, シエナを出るとき, 大司教邸で], [説3, 牢の壁に書いた, 1643年の絵]], upto: 1}
      # fact: galileo-33
      - 語り: 2つ目は、シエナを出るとき。科学史家のスティルマン・ドレイクが、1978年の本で、ピッコローミニ大司教の屋敷を出る場面だったかもしれない、と書きました。
        figure: {type: stats, title: 言った場面の3つの説, items: [[説1, 誓絶の直後, ミネルヴァ修道院で], [説2, シエナを出るとき, 大司教邸で], [説3, 牢の壁に書いた, 1643年の絵]], upto: 2}
      - 語り: 3つ目は、牢の壁に、書いた。1643年か1645年の絵が、その場面を描いている、という説です。
        figure: {type: stats, title: 言った場面の3つの説, items: [[説1, 誓絶の直後, ミネルヴァ修道院で], [説2, シエナを出るとき, 大司教邸で], [説3, 牢の壁に書いた, 1643年の絵]], upto: 3}
      - 語り: もう1つ、比べ役を置きます。後の世の人が、作った話。ガリレオ本人は、言っていない、という見方です。場所の説ではないので、点は付けません。
        figure: null
      - 語り: 手がかりは、3つ。1つ目は、《場面》。その場面が、17世紀の記録に、本当にあるか。判決や、誓絶や、弟子の伝記が書いていれば、2点。滞在は書くが、場面は書かなければ、1点。書かなければ、0点です。
        figure: {type: table, title: 説をぶつける3つの手がかり, cols: [出どころ, 見るもの], rows: [[①場面, 17世紀の記録, 実在するか], [②台詞, 判決・誓絶・弟子の伝記, 出るか], [③物証, 最古の活字・絵, 17世紀まで遡るか]], upto: 1}
      - 語り: 2つ目は、《台詞》。判決、誓絶、弟子の伝記に、「それでも動く」が出るか。出れば2点、出なければ0点です。
        figure: {type: table, title: 説をぶつける3つの手がかり, cols: [出どころ, 見るもの], rows: [[①場面, 17世紀の記録, 実在するか], [②台詞, 判決・誓絶・弟子の伝記, 出るか], [③物証, 最古の活字・絵, 17世紀まで遡るか]], upto: 2}
      - 語り: 3つ目は、《物証》。台詞を載せた最古の活字や、絵が、17世紀まで遡るか。遡る証拠が見つかれば2点、見つからなければ0点です。3つで、6点満点。
