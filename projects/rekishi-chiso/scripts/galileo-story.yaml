  # ================================================================ 第7章 判決はどう扱われたか
  - title: 判決はどう扱われたのか　1758年から1992年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: galileo-36
      - 語り: 判決から、125年後の、1758年。禁書目録は、地動説を説く本の、一般的な禁止を、外しました。ただし、ガリレオなどへの、個別の禁止は、残りました。
        year: 1758
      # fact: galileo-39
      - 語り: 禁書目録の版から、『天文対話』が消えたのは、1835年。判決から、202年後でした。
        year: 1835
      # fact: galileo-40
      - 語り: 1979年11月10日、教皇ヨハネ・パウロ2世は、ガリレオが、教会の人間や機関から、多くの苦しみを受けた、と述べ、神学者や歴史家に、この件を、深く調べるよう、望みました。
        year: 1979
      # fact: galileo-41
      - 語り: 1981年7月3日、調べる委員会が、作られます。
        year: 1981
      # fact: galileo-43
      - 語り: 1984年には、バチカンの文書館にある、裁判の文書が、本になりました。
      # fact: galileo-42
      - 語り: そして、1992年10月31日。教皇庁科学アカデミーでの演説で、ヨハネ・パウロ2世は、フランス語で、こう述べました。当時の神学者たちの誤りは、世界の構造の知識が、ある意味で、聖書の字句によって決まる、と考えたことだった。
        year: 1992
        tone: 重い
      # fact: galileo-42
      - 語り: ここで、気をつけたいことがあります。この演説に、「謝罪」の言葉は、ありません。判決を取り消す、とも言っていません。誤りの主語は、神学者たち、です。演説は、ガリレオの側も、仮説として示す助言を退けた、と述べ、この事件を、悲劇的な、相互の無理解、とも呼びました。
        tone: 重い
      # fact: galileo-43
      - 語り: 1998年には、聖務省の文書館が、研究者に、条件つきで開かれました。
      # fact: galileo-09
      - 語り: 判決から、359年。1992年の演説にも、「それでも動く」は、出てきません。
        tone: しみじみ
      - 語り: 最後に、言えることと、言えないことを、分けます。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：ガリレオは、言ったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 言えることから。判決にも、誓絶の文書にも、弟子ヴィヴィアーニの伝記にも、「それでも地球は動く」は、ありません。
        tone: しみじみ
      - 語り: 最初の活字は、1757年のバレッティの本で、ガリレオの死から115年後。「6年」と「拷問」という、記録と合わない話と、一緒に現れました。
        tone: しみじみ
      - 語り: 記録そのものにも、ずれがありました。判決に署名したのは、10人の枢機卿のうち、7人。ガリレオを、70歳と書いた文書も、実際の年齢は、69歳でした。
        tone: しみじみ
      - 語り: 牢の壁の絵は、17世紀まで遡る証拠が、ありません。専門家は、ムリーリョではない、と見て、競売会社は、19世紀と見ています。
        tone: しみじみ
      - 語り: 採点で、いちばん高かったのは、誓絶の直後。けれど、台詞を支える点は、どの説にも、付きませんでした。言えないことも、あります。「言わなかった」と、言い切ることは、できません。記録に、無いことは、言わなかった証明では、ありません。口づての話が、活字より前にあった可能性も、消えていません。
        tone: しみじみ
        pause: 0.8
      # fact: galileo-06, galileo-14
      - 語り: 記録に、はっきり残っているのは、別のことです。ガリレオは、ひざまずいて、自分の説を、「呪い、嫌う」と読み、署名しました。そして、家から出られない暮らしの中で、娘を亡くし、目を失いました。
        tone: しみじみ
      # fact: galileo-18
      - 語り: それでも、1638年には、『新科学対話』が、ライデンで世に出ました。
        tone: しみじみ
      - 語り: 確かめられない言葉を、世界は、ガリレオの口に、置いてきました。その一言が、あの日の広間で、本当に言われたのかは、今の記録からは、分かりません。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、あの日の広間で、ガリレオが、言ったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
