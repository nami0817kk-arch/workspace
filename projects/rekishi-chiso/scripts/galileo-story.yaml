# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（世界史・17世紀イタリア）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「『それでも地球は動く』は、ガリレオが本当に言った言葉なのか」。記録の手がかり3つで、言った場面の3つの説を採点する（ルイ14世と重ならない切り口＝記録の読み方）。
#   3つの説（言った場面）＋比べ役1つ：①誓絶の直後に口にした（通説）②シエナのピッコローミニ大司教邸を出る場面で口にした（スティルマン・ドレイクの推測）③牢の壁に書いた（1643/45年とされる絵）／比べ役＝④後の世の人が作った話（点は付けない）。
#   採点の決まり（第2章、約20%）：手がかり3つ、各2点の6点満点。点を付けるのは説1〜3。
#     ①場面：その場面が17世紀の記録に実在するか（判決・誓絶・弟子の伝記が書く＝2／滞在は書くが場面の記録なし＝1／記録なし＝0）
#     ②台詞：判決・誓絶・弟子の伝記に台詞が出るか（出る＝2／出ない＝0）
#     ③物証：最古の活字・絵が17世紀まで遡るか（遡る証拠が出ている＝2／出ていない＝0）
#   点（自分で数え直した）：     ①  ②  ③ ＝計
#     説1 誓絶の直後            2   0   0 ＝ 2  （判決・誓絶・伝記が場面を書く。台詞は無い。最古の活字は1757年）
#     説2 シエナを出るとき       1   0   0 ＝ 1  （シエナ滞在は書くが、出る場面の記録は無い）
#     説3 牢の壁                0   0   0 ＝ 0  （判決の牢は翌日軟禁に変わり、牢の壁の場面の記録は見つかっていない。絵は19世紀の鑑定・1837年の同構図・専門家4人の否定で、遡る証拠が無い）
#   結果＝説1が2点（場面が実在するだけ）、説2が1点、説3が0点。台詞を支える点（②③）はどの説にも付かない。説4は点を付けないが、②③の空白はその予想と合う。「作り話と断定」はしない：記録に無いことは言わなかった証明ではない。
# 記録の食い違いは3つ：①1616年の禁止命令（聖務省の記録は教えること・いかなる方法でも論じることを禁じたと書く／ベラルミーノの証明書にはその禁止が無い。判決自身が指摘）②死去の年齢（ヴィヴィアーニ「77歳10か月20日」／計算は77歳10か月24日）③バレッティ「6年・拷問」と記録（翌日軟禁・拷問は脅しまで）。
# 計算（自分で計算し直した）：1757−1633＝124年／1757−1642＝115年／1564-02-15→1633-06-22＝69歳4か月7日（判決・誓絶は「70歳」と書く）／1564-02-15→1642-01-08＝77歳10か月24日／
#   1633-12-01→1642-01-08＝8年1か月7日／1633-06-22→1634-04-02＝9か月11日／1654−1642＝12年／1737−1642＝95年／1758−1633＝125年／1835−1633＝202年／1992−1633＝359年。
# 事実は事実カード（dev/output/rekishi-chiso/research/ガリレオ_facts_20261113.yaml、galileo-01〜）にあるものだけ。行の上に `# fact: galileo-NN`。
#   使わないこと：ミルトンの訪問の細部・ホーキングの「移送のとき」説・Hayton/Heilbron の孫引き・「ピッコロミーニ将軍が発注した」説・1744年版の序文の細部・3体目の遺体・6/21の「手の中にある」の返答（原文未確認）・バルベリーニが「反対したから署名しなかった」という物語。
