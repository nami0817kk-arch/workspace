  # ================================================================ 第3章 弟子の伝記と、アルチェトリの8年
  - title: 弟子の伝記と、アルチェトリの8年　ヴィヴィアーニ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1654
    lines:
      # fact: galileo-20
      - 語り: 最初のガリレオ伝は、弟子のヴィンチェンツォ・ヴィヴィアーニが書きました。日付は、1654年4月29日。トスカーナ公子レオポルドへの、書簡の形です。ガリレオの死の、12年後になります。
        year: 1654
      # fact: galileo-51
      - 語り: ヴィヴィアーニは、1639年から、アルチェトリの家で、ガリレオの世話をした、と伝わります。
      # fact: galileo-21
      - 語り: その弟子は、誓絶の場面を、たった一言で済ませます。ガリレオは、真のカトリック教徒として、この意見を撤回した。罰として、『天文対話』が禁じられた。
        tone: 重い
      # fact: galileo-21
      - 語り: ひざまずいたことも、「呪い、嫌う」と読んだことも、書いていません。もちろん、「それでも動く」も、全文のどこにも、出てきません。
      # fact: galileo-35
      - 語り: ガリレオを訪ねた、詩人のミルトンも、1644年の『アレオパジティカ』に、年老いて、異端審問所の囚人となった、有名なガリレオを訪ねた、と書いています。実際は、軟禁でした。そして、台詞は、書いていません。
      - 語り: 弟子は、この一言を、書いていません。判決にも、誓いにも、弟子の伝記にも、台詞は、出てきません。②の点は、どの説も、0点です。
        tone: 重い
      # fact: galileo-37
      - 語り: 判決のあと、『天文対話』は、再び出せなくなりました。1634年8月23日には、禁書の決定が、重ねて下ります。ガリレオの著作集が、はじめてフィレンツェで出た、1655年から56年になっても、この本は、再び出せませんでした。
      # fact: galileo-37
      - 語り: ところが、1635年に、ラテン語に訳された『天文対話』が、アルプスの北で、出回ります。本は、国境の外で、読まれ続けました。
      # fact: galileo-13, galileo-14
      - 語り: では、判決のあとの、ガリレオの暮らしは。刑は、翌日、軟禁に変わりました。ヴィラ・メディチから、シエナの大司教邸へ。弟子の伝記は、ローマでの逮捕を、トスカーナ大使のいる、トリニタ・デイ・モンティの屋敷、と書き、このシエナの滞在も書きますが、屋敷を出る場面は、書いていません。1633年12月1日、聖務省は、アルチェトリの自宅へ戻ることを、許します。
        year: 1633
      # fact: galileo-14
      - 語り: ただし、条件つきでした。科学の話をしそうな人を、家に迎えないこと。
      # fact: galileo-16
      - 語り: 1634年4月には、聖務省のフィレンツェの代理が、バルベリーニ枢機卿の名で、告げます。フィレンツェに行く許可を、もう求めるな。娘たちのいる、聖マッテオ修道院へ出ることは、許されていました。
        year: 1634
      # fact: galileo-15
      - 語り: その修道院にいた長女、マリア・チェレステが、1634年4月2日に、亡くなります。33歳。判決から、9か月あまりでした。
        tone: しみじみ
      # fact: galileo-17
      - 語り: 1637年の終わりに、ガリレオは、完全に目が見えなくなります。1638年1月2日、パリの友人エリア・ディオダーティへの手紙に、こうあります。あなたの親しい友ガリレオは、ひと月前から、もう目が見えません。英訳の、アラン・オルニー版です。
        year: 1638
        tone: しみじみ
      # fact: galileo-18
      - 語り: この1638年、ライデンで、『新科学対話』が出ます。ガリレオは、出版は、版元の考えで、自分は知らなかった、と、公に主張しました。
      # fact: galileo-19
      - 語り: 1642年1月8日の夜、ガリレオは、アルチェトリで、亡くなります。ヴィヴィアーニの伝記は、「77歳と、10か月と、20日」と書きました。
        year: 1642
      # fact: galileo-19
      - 語り: もう1つ、食い違いがあります。1564年2月15日の生まれから数えると、77歳10か月、24日。弟子の数え方は、4日、ずれています。
      # fact: galileo-50
      - 語り: 最期の様子は、こうです。哲学者らしく、キリスト教徒らしい落ち着きで、魂を、創造主に返した。最後の言葉は、記されていません。
        tone: しみじみ
      # fact: galileo-22
      - 語り: 聖務省は、大公が、ガリレオの壮麗な墓を造ることに、反対しました。遺体は、サンタ・クローチェ聖堂の、小さな部屋に、仮に置かれます。記念の墓に移されたのは、1737年3月12日。死から、95年後でした。
      # fact: galileo-52
      - 語り: アルチェトリに戻ることを許された日から、数えれば、8年あまり。ガリレオは、聖務省の目の下で、暮らし続けました。この間にも、台詞を伝える記録は、ありません。
      - 語り: では、台詞は、どこに、最初に現れるのか。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 最初の活字
  - title: 最初の活字　1757年のロンドン
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1757
    lines:
      # fact: galileo-24
      - 語り: 1757年、ロンドン。イタリア生まれの文筆家、ジュゼッペ・バレッティが、『イタリアの文庫』という本を出しました。イタリア語の本の、案内です。
        year: 1757
      # fact: galileo-24
      - 語り: 52ページ。ガリレオの『天文対話』の、1632年版の項目の、書き添えに、台詞は、現れます。
      # fact: galileo-23
      - 語り: 日本語にすると、こうです。これが有名なガリレオ。地球が動くと言ったために、6年間、異端審問所にいて、拷問も受けた。自由の身になった瞬間、空を見上げ、地面を見下ろし、考え込むように足を踏み鳴らして、言った。「それでも動く」。地球のことだ。
        tone: 重い
      # fact: galileo-23
      - 語り: 出どころは、書かれていません。綴りは、「ムオーヴェ」ではなく、「ムーヴェ」。現代のイタリア語の綴りとは、違います。
      # fact: galileo-55
      - 語り: もう1つ、食い違いがあります。「6年」と「拷問」は、記録と合いません。判決の翌日には、軟禁に変わり、拷問は、脅しまででした。台詞を書いた本が、同じ書き添えの中で、2つ、誤っています。
        tone: 重い
      # fact: galileo-25
      - 語り: 4年後の1761年。フランスのイライユが、『文芸論争』の第3巻に、同じ話を載せます。釈放されたとき、悔いに襲われた、といわれる。地面を足で打って言った。「それでも、それは動く」。
      # fact: galileo-25
      - 語り: 「といわれる」と、伝聞の形です。「60歳近く」「6年の禁固」と、ここでも、同じ誤りが、残っています。ほぼ同じ話が、4年後に、フランスの本にも、載りました。
      # fact: galileo-26
      - 語り: 20世紀に入って、研究者のアントニオ・ファヴァロが、活字の最古は、バレッティの本だと、突き止めました。
      # fact: galileo-27
      - 語り: イタリアの名言事典『誰が言ったか』も、17世紀の著者には、この言葉の痕跡がない、と書いています。
      # fact: galileo-33
      - 語り: ただし、活字の前に、口づての話が、なかったとは言えません。ドレイクは、ピッコローミニ大司教の屋敷の中で、話が百年伝わり、活字になったのかもしれない、と考えました。ガリレオが、足を踏み鳴らして、ウインクしたかもしれない、とまで書いています。
      - 語り: これは、記録ではなく、推測です。ここから先は、確かめられません。確かめられる最古の活字は、1757年です。
        tone: 重い
      - 語り: 17世紀には、遡りません。手がかり③の、最古の活字の点は、説1も、説2も、説3も、0点です。
      - 語り: もう1つの物証、牢の壁の、絵です。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 牢の壁の絵
  - title: 牢の壁の絵　1643年か1645年か
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1911
    lines:
      # fact: galileo-28
      - 語り: 1911年。ベルギーの町ルーセラーレの、ジュール・ファン・ベルが、ファヴァロに、手紙を送りました。1643年か、1645年に描かれた絵を、持っている、というのです。
        year: 1911
      # fact: galileo-28
      - 語り: 絵の中で、ガリレオは、牢の壁に、釘で、太陽のまわりを回る地球を描いています。その下に、「それでも動く」の文字。弟子の伝記には、牢の壁の場面は、出てきません。署名が、はっきりしませんでしたが、ファン・ベルは、スペインの画家、ムリーリョの作だと考えました。
      # fact: galileo-28
      - 語り: 1643年なら、ガリレオの死の、翌年です。もし本当なら、台詞は、死の直後には、もう広まっていたことになります。
        tone: 重い
      # fact: galileo-29
      - 語り: 1912年1月13日には、ベルギーの新聞『エトワル・ベルジュ』が、この絵のことを、報じます。
      # fact: galileo-59
      - 語り: 1933年9月13日、この絵は、アントワープのフレースハウス博物館に貸し出され、1936年の新聞が、展示を報じました。
      # fact: galileo-30
      - 語り: ところが、ムリーリョの専門家4人が、写真を見て、全員、ムリーリョの作ではない、と判断しました。1人は、スペイン人の画家でもないだろう、別の1人は、19世紀の作だろう、と言います。
        tone: 重い
      # fact: galileo-31
      - 語り: 2020年、天体物理学者のマリオ・リヴィオが、ほぼ同じ絵を、記事で紹介しました。ベルギー、シント・ニクラース市立美術館の、『牢のガリレオ』。ロマーン＝ウージェーヌ・ファン・マルデヘムの、1837年の作です。
      # fact: galileo-31
      - 語り: 構図は、ほぼ同じです。1842年と1859年の本が、この絵を、ファン・マルデヘムの作品として、載せています。どちらかが、もう一方の写しで、記録の残る側は、1837年です。
      # fact: galileo-32
      - 語り: ファン・ベルの絵は、2007年、アントワープの競売会社カンポ・エ・カンポの、ロット213で、売られました。会社の鑑定は、19世紀の作。日付も署名も、見つかりませんでした。買ったのは、個人の収集家です。
      - 語り: 2020年の記事の時点で、実物の年代の調べは、受けていません。それでも、遡る証拠は、ありません。遡らない側の材料が、3つ、そろっています。説3の、手がかり③は、0点です。
        tone: 重い
      - 語り: 3つの手がかりが、そろいました。採点の結果を、見ます。
        tone: 疑問
        hook: true

