# 武田信玄（A作品）。型：掘り下げ型（冒頭＝旗の四句と「風林火山」の四字 → 生まれから順・節ごとに1つの山場 → 最後は「まとめ：武田信玄とは何者だったのか」）
# 冒頭の一点：旗に書かれているのは『孫子』の四句（疾如風・徐如林・侵掠如火・不動如山）。「風林火山」という四字の語は文献に見当たらず、現代の創作とみる研究者がいる（ウィキペディア「風林火山」の整理。
#   高橋賢一＝現代の創作とみる／鈴木眞哉＝小説『風林火山』が最初ではと推測）。古い記録は「孫子の旗」。『甲陽軍鑑』は永禄4年から使ったと書くが、旗が作られた時期を示す確かな記録は無い。
#   「小説が最初」は推測と断る。旗の年代鑑定は未確認なので何も言わない（答えはこの節で出し、まとめで冒頭に戻る）。
# 事実の出どころは dev/output/rekishi-chiso/research/shingen_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/shingen_assets.md と mikatagahara_assets.md（三方ヶ原は既存の絵のみ）。
# 決まり：①日付は和暦で言う。西暦は年表・card の年（year:）にだけ出し、語りでは「西暦だと」と言わない。生まれは「大永元年11月3日」（和暦）、没は「元亀4年4月12日」。年齢は数え（享年53）。肖像の「この時○歳」は出さない（age: false）。
#   ②使わない話（入れない）：影武者説（信廉）・黒澤『影武者』／遺体を諏訪湖に沈めよ／諏訪頼重の自害の場面・諏訪御料人の描写／勝頼の自刃の描写（日付と場所だけ）／恵林寺の焼き討ちの描写と快川の遺偈／
#     「人は城」を信玄本人の言葉として断定（まとめで「『甲陽軍鑑』にあるとされる」まで）／信虎の追放を暗殺・暴君の断定／「敵に塩を送る」を信玄に結びつける／120万石・9カ国／家康の空城計・脱糞・顰像（家康回の領分）／
#     野田城の笛の音／武田二十四将を実在の制度として／山本勘助を軍師として／啄木鳥戦法を成功した作戦として／一騎打ちを事実として／風林火山を「信玄の標語」として／ネットの個人ブログ・小説・ドラマの場面。
#   ③後世の話（出典名を言う）：啄木鳥戦法・山本勘助の軍師像・「三年間は死を秘せ」の遺言・一騎打ち・武田二十四将・五戦説・「信玄堤」の名（江戸後期）・信虎の暴君像（可能性）。
#     ウィキペディア経由の情報は「ウィキペディアの整理では」と断る（風林火山の語・義信の死因・西上の目的・勝頼評価など）。『甲陽軍鑑』『妙法寺記』『高白斎記』の本文は未読。
#   ④数字は何の数かを言う。砥石崩れの7,000・500・2,000・約1,000、西上の2万2,000、三方ヶ原の約2,000・約200、長篠の兵は二次の数字で割れる。川中島の第四次の日付・兵力は言わない（未確認）。
#   ⑤人物のセリフは入れない。遺言は『甲陽軍鑑』の話と断る。⑥背景に人物の肖像・拡大絵を使わない。NDL 系の絵図は使わない（色票・黒帯）。血・遺体・首・切腹の絵は使わない（天目山の絵は使わない）。
#   ⑦現代の写真は「画面は現在の〜」とその行で断る。城の絵図・肖像はすべて後世のもの。
#   ⑧家康回（10/16）と重ならない：三方ヶ原は信玄の側から（西上の途中の一戦）。家康の敗走の逸話は繰り返さない。
#   読みの注意：武田信玄＝たけだしんげん／晴信＝はるのぶ／信虎＝のぶとら／義信＝よしのぶ／勝頼＝かつより／信繁＝のぶしげ／諏訪頼重＝すわよりしげ／村上義清＝むらかみよしきよ／板垣信方＝いたがきのぶかた／甘利虎泰＝あまりとらやす／
#     真田幸隆＝さなだゆきたか／上田原＝うえだはら／砥石＝といし／川中島＝かわなかじま／八幡原＝はちまんばら／甲陽軍鑑＝こうようぐんかん／山県昌景＝やまがたまさかげ／馬場信春は出さない／恵林寺＝えりんじ／快川紹喜＝かいせんじょうき／
#     信玄堤＝しんげんづつみ／御勅使川＝みだいがわ／釜無川＝かまなしがわ／竜王＝りゅうおう／二俣城＝ふたまたじょう／野田城＝のだじょう／駒場＝こまんば／三方ヶ原＝みかたがはら／長篠＝ながしの／高天神城＝たかてんじんじょう／
#     疾きこと＝はやきこと／徐かなること＝しずかなること／侵掠＝しんりゃく／孫子＝そんし／上洛＝じょうらく／御内書＝ごないしょ／後詰＝ごづめ／調略＝ちょうりゃく。
