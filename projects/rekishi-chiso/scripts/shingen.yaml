terms:
  軍記: 戦いを物語の形で書いた本。江戸時代に多く作られた
  軍学書: 兵法を教えるための本。江戸時代に盛んに書かれた
  軍配: 大将が戦の指揮に使った、うちわの形の道具
  家督: 家を継ぐ権利。大名なら、領国と家臣を引き継ぐこと
  甲陽軍鑑: 武田家の話をまとめた軍学書。信玄の死の約半世紀後にできた
  孫子: 中国の古い兵法書。旗の四句は、その軍争篇の言葉
  調略: 戦わずに、敵の中の人を味方につける手
  後詰: 攻められている城を助けに行く援軍
  御内書: 将軍が出す、手紙の形の命令書
  甲州法度之次第: 武田家の領国の法律。55条で始まり、のち57条
  喧嘩両成敗: 争った双方を同じように罰する決まり
  朱印状: 朱の印を押した、戦国大名の文書

shorts:
  s1:
    title: "信玄の旗／四字じゃない？"
    yt_title: "武田信玄の旗に「風林火山」とは書かれていない？｜書かれていたのは『孫子』の四句"
    hook: "信玄の旗には、／「風林火山」と／書いてあった？"
    tease: "じゃあ、この旗の字を／書いたと言われる、／恵林寺の僧は、誰？"
    lead: "「風林火山」。21歳で父を追い出し、30歳までに二度負けた武将、いま伝わる武田信玄の旗には、この四字は書かれていません。旗に書かれているのは、『孫子』の四つの句です。"
    tags: [武田信玄, 風林火山, 孫子の旗, 歴史の地層]
  s2:
    title: "21歳の家督／父の追放"
    yt_title: "武田信玄は21歳で父を追放した？｜信虎は本当に暴君だったのか"
    hook: "21歳の信玄が、／父を国の外へ／追い出した？"
    tease: "じゃあ、追い出された父は、／信玄より先に亡くなった？"
    lead: "大永元年11月3日、武田信玄は、甲斐の国で、武田信虎の嫡男として生まれました。そして天文10年6月、21歳の信玄は、父の信虎を、国の外へ追い出します。"
    tags: [武田信玄, 武田信虎, 信虎追放, 歴史の地層]
  s3:
    title: "戦国最強の二度の負け／上田原と砥石"
    yt_title: "武田信玄は30歳までに二度負けた？｜村上義清に敗れた上田原と砥石崩れ"
    hook: "「戦国最強」の信玄が、／30歳までに、／二度負けた？"
    tease: "じゃあ、砥石城を、／力ではなく調略で／取ったのは、誰？"
    lead: "村上義清は、信濃北部の有力な領主です。諏訪のあと、信玄の前に立ちはだかりました。"
    tags: [武田信玄, 村上義清, 上田原の戦い, 砥石崩れ, 歴史の地層]
  s4:
    title: "川中島は5回？／数え方の話"
    yt_title: "川中島の戦いは本当に5回？｜江戸の軍記に始まる数え方と、実際に戦った2回"
    hook: "川中島の戦いは、／本当に5回だった？"
    tease: "じゃあ、信玄の軍師と言われる／山本勘助は、軍師と呼ばれていた？"
    lead: "越後の大名、上杉謙信と信玄が戦った、川中島の戦い。天文22年から永禄7年までに、5回戦った、とよく言われます。"
    tags: [川中島の戦い, 武田信玄, 上杉謙信, 一騎打ち, 歴史の地層]
  s5:
    title: "「三年間は死を秘せ」／誰の言葉？"
    yt_title: "信玄の遺言「三年間は私の死を秘せ」は本当？｜『甲陽軍鑑』の話と、文書で確かめられること"
    hook: "「三年間は、／私の死を秘せ」。／信玄は、本当に言った？"
    tease: "じゃあ、信玄の葬儀が／営まれたのは、いつ？"
    lead: "武田信玄の遺言として有名なのが、「三年間は、私の死を秘せ」です。ところが、これは『甲陽軍鑑』の話です。"
    tags: [武田信玄, 信玄の死, 甲陽軍鑑, 遺言, 歴史の地層]

