en:
  title: "Takeda Shingen: The Banner Bore Four Lines from Sunzi, Not the Four Characters 'Furinkazan'"
  description: |-
    The word "Furinkazan" (wind, forest, fire, mountain) is famous as Takeda Shingen's slogan, but the surviving banners do not carry those four characters. They carry four phrases from Sunzi's Art of War. According to Wikipedia's summary, some researchers think the four-character word itself does not appear in old texts and is a modern creation; old records call it the "Sunzi banner". The Koyo Gunkan says he used it from 1561, but no firm record shows when the banners were made.
    This video digs into Shingen's life from his birth in 1521 to the fall of the Takeda clan in 1582, and separates what documents show from what later books say: the exile of his father Nobutora at 21, the two defeats against Murakami Yoshikiyo before he turned thirty, the Battles of Kawanakajima (the "five battles" count comes from Edo-period war tales, and the famous duel has no firm source), the Kai-Sagami-Suruga alliance and its collapse, the Koshu Hatto code and the name "Shingen Embankment" (which appears only in the late Edo period), the western campaign and Mikatagahara, his death in 1573 (place and illness are disputed) and the "keep my death secret for three years" will (a story from the Koyo Gunkan), and the fall of his son Katsuyori.
    We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "The Banner Bore Four Phrases, and the Four Characters 'Furinkazan'"
    - "1541: Exiling His Father at 21"
    - "1548: Two Defeats at Ueda-hara and Toishi, and a Sanada Scheme"
    - "1553: Kawanakajima, and the Duel No Document Records"
    - "1554: The Three-Way Alliance, Yoshinobu's Death and the Invasion of Suruga"
    - "1547: The Koshu Hatto Code and the Name 'Shingen Embankment'"
    - "1572: The Western Campaign and Mikatagahara"
    - "1573: Death, and the 'Keep It Secret for Three Years' Will"
    - "1575: Nagashino, Takatenjin and the Fall of the Takeda"
    - "Summary: Who Was Takeda Shingen?"

