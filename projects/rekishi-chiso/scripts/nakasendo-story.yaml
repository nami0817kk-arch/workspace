# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸と京都を結ぶ、山の道、中山道。1835年にこの道を東へ向かった近江の商人は、碓氷峠を越えるその日に、13里、50キロあまりを進んでいます。
  芭蕉が「命をからむ」と詠んだ木曽の桟を、江戸前期の学者、貝原益軒は「少しも危なくない」と書きました。
  江戸時代の人は、中山道を何泊何日で歩いたのか。宿代はいくらだったのか。商人の道中日記を、宿場ごとに追います。
  この動画でわかること
  ・近江の日野から武蔵の吉川まで、1日ずつの泊まりと道のり
  ・木曽の桟・鳥居峠・和田峠・碓氷峠は、本当に難所だったのか
  ・峠で粥と焚火を施した施行所と、峠の関所
  ・宿代はいくらで、全部で何泊何日だったのか
description_note: |-
  この動画に、想像の台詞や作った話はありません。旅の記録は、西村市郎右衛門安則『木曾日記』（天保6年＝1835年。同志社商学に載った末永國紀・本村希代・奥田以在の翻刻と解題）、中井源左衛門光基『初下り諸事手扣』（天保5年＝1834年。滋賀大学経済学部附属史料館研究紀要の青柳周一・西川雄也の翻刻）、貝原益軒『木曽路之記』（宝永6年＝1709年刊、国立国会図書館デジタルコレクション）から取りました。
  宿場の道のりと家数・旅籠の数は、『宿村大概帳』（天保14年＝1843年ごろの調べ）をまとめた日本大百科全書の宿駅一覧によります。ほかに、国土交通省（道路局・関東地方整備局・関東運輸局・観光庁の多言語解説）、群馬県・群馬県立文書館、長和町、長野県教育委員会、林野庁、文化庁、埼玉県、中津川市史、日本山岳会、谷釜尋徳『歩く江戸の旅人たち』（2020年）などを使いました。
  1日ずつの道のりは、宿村大概帳の里程の差から計算したもので、日記に書かれた数ではありません（13日の「十三里ほど」だけは日記の言葉です）。日記は近江から江戸へ向かう向きの旅なので、動画もその向きで追っています。江戸から京都までの日数は、日記の速さで計算した目安です。
  円への換算は、江戸の大工の日当（文政のころの記録で銀5匁4分。1842年からの公定相場で銭に直して、およそ585文）を今の1万円とした目安で、伊勢参りの回と同じ物差しです。物差しによって、額は大きく変わります。年のあとの月日は、当時の暦のものです。
  絵は、画像生成AIで作った想像上の場面と、渓斎英泉の「木曽街道六十九次」（国立国会図書館）です。サムネイルの絵は、AI による想像図です。

en:
  title: "The Nakasendo: How Many Nights to Walk from Edo to Kyoto? A Merchant's Travel Diary"
  description: |-
    The Nakasendo was the mountain highway linking Edo and Kyoto. In 1835 a merchant from Omi walked it, and on the day he crossed the Usui Pass he traveled about 13 ri, more than 50 km.
    The poet Basho wrote of the Kiso hanging bridge as a place where your life hangs on the vines, yet the scholar Kaibara Ekiken wrote that it was not dangerous at all.
    How many nights did people need on the Nakasendo, and what did the inns cost? We follow a merchant's diary, post town by post town.
    In this video you will learn:
    - Where the merchant stayed each night, and how far he walked each day
    - Whether the Kiso bridge and the Torii, Wada and Usui passes were really so hard
    - The free porridge and fires given to travelers on the passes, and the checkpoints
    - What the inns cost, and how many nights the whole trip took
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "50 km on the Day He Crossed the Usui Pass"
    - "How Many Post Towns from Edo to Kyoto?"
    - "How Far Did He Walk in a Day?"
    - "Was the Kiso Bridge Dangerous?"
    - "Beyond the Torii Pass"
    - "What Did the Inn at Wada Cost?"
    - "Crossing the Usui Pass"
    - "How Many Days to Edo?"
    - "Summary: How Many Nights from Edo to Kyoto?"

