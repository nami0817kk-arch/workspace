# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と ise-story.yaml の型）。中山道の旅は何泊何日か。2026-11-26 作成。
# 公開の予定は 12/1 12:00（12時枠）。型は「旅の密着＋数字を積み上げる型」（E 暮らし型の仲間。ユーザーの○済み）。主語は「中山道を歩いた1人の近江商人の旅」で、最後まで主役。
#   誰でも持つ像＝中山道は山また山の木曽路で、峠と桟が怖い遠回りの道。裏返す一点＝商人は1日に10里あまりを歩き通し、碓氷峠を越える日に13里あまり（約53キロ）。
#   「命がけ」と詠まれた木曽の桟は、益軒が通ったころには頑丈な板橋で、少しも危なくないと書かれていた。
#   問い＝「江戸と京都を結ぶ中山道を、江戸時代の人は何泊何日で歩いたのか。宿代はいくらだったのか」。
#   答え＝西村安則『木曾日記』（天保6年＝1835）は、近江の日野から武蔵の吉川まで11泊で12日目に着いた。中山道の上は高宮から桶川まで109里あまり（約430キロ）。
#   高宮〜鴻巣の10日は1日平均10里27町（約42キロ）。同じ速さで日本橋〜京都三条大橋（135里34町あまり）を歩けば、およそ13日（12泊）＝目安（書き手の計算）。
#   宿代は、相場とされる148文で12泊なら1,776文＝大工の日当の3日分ほど、約3万円（目安）。ただし和田の宿では872文と言われた（何人分か不明）。
# ★ 向きの断り：江戸→京都の向きで日ごとの泊まりが本文で読める日記は見つからなかった（担当A 11-26：浪士組の日記は所蔵先不明、益軒は日付なし）。
#   だから日記の向き（近江→江戸）のまま追い、台本・題名では「江戸と京都を結ぶ」と言う。益軒『木曽路之記』（江戸→京の向き、貞享2年＝1685の旅、宝永6年＝1709刊）は道と桟の比べに使う。
# 既出と重ねない：和宮の中山道下向（kazunomiya-story）、参勤交代（sankin-story）、伊勢参り（ise-story：大井川の川札・箱根の関所と女手形・往来手形・
#   大倉与市の旅籠と木賃宿・浪花講・草鞋の値段・紀伊国屋長三郎・清河八郎）は使わない（11-26 scripts/ を grep）。換算の物差しだけ ise と同じ（585文＝1万円）。
# 想像の台詞なし。語りは剣崎1人。人物の作った話なし。日記の歌は語りで「〜と詠んでいます」と言う。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/中山道の旅_facts_20261126.yaml。担当A=道中日記・B=難所・C=距離と制度・D=益軒と里程の計算）にあるものだけ。行の上に `# fact:`。
# 記録の食い違い（並べたもの3つ）：①宿の数（関東運輸局の冊子67／埼玉県の冊子69。国交省道路局の説明で数え方の違い）第1章
#   ②和田峠の高さ（長和町 約1600m／日本山岳会 明治9年の新道1570m・明治29年の掘り下げ後1531m）第5章
#   ③宿代（同じ日記の高宮「はたごは百五十」／和田「これまで850文、今宵は872文」。何人分か書かれていない。解題は守貞謾稿の相場148文）第5章
#   並べなかった食い違い：中山道の長さ（国交省道路局526.3km／大宮国道約530km）は「およそ526キロ」とだけ言う、和田〜下諏訪（益軒 五里十六町／大概帳 五里十八町）、
#   木曽の宿の人馬（25人25疋／50人50疋）、本庄の脇本陣（3／2）、和田宿の標高、五料村の証文の年、浪士組の京都着の日。
# 自分で計算した数（全部計算し直した。1里＝36町＝約3.927km、1町＝60間）：
#   日本橋からの里程（宿村大概帳・日本大百科全書の一覧）：高宮119里28町8間・赤坂110里1町8間・鵜沼100里30町8間・大湫91里12町8間・三留野79里27町47間・
#   福島69里24町44間・洗馬59里33町14間・和田49里24町14間・軽井沢37里13町14間・新町23里30町40間・鴻巣12里8町・桶川10里14町。
#   1日ずつ：高宮→赤坂 9里27町（38.3km）・赤坂→鵜沼 9里7町（36.1km）・鵜沼→大湫 9里18町（37.3km）・大湫→三留野 11里20町（45.4km）・
#   三留野→福島 10里3町（39.6km）・福島→洗馬 9里27町（38.3km）・洗馬→和田 10里9町（40.3km）・和田→軽井沢 12里11町（48.3km）・
#   軽井沢→新町 13里18町余（53.1km。日記の「十三里ほど」と合う）・新町→鴻巣 11里22町余（45.7km）。
#   追記 11-26 点検後：運び賃（中津川 1711 高札・児玉・元賃銭の幕末に2倍・8倍近く）、西餅屋、碓氷の2024答申を足した。五料村の証文の行は外した（流れの点検）。
#   高宮→鴻巣 107里20町＝422km、÷10日＝10里27町（42.2km）。高宮→桶川 109里14町＝429.6km→約430キロ。守山（127里28町8間）までの中山道の 85.6%→「8割を超える」。
#   日本橋→三条大橋 135里34町10間＝135.95里÷10.76里＝12.6日→「およそ13日」（12泊）。
#   馬籠83里6町47間−妻籠81里6町47間＝2里。
#   物差し 585文＝1万円→1文＝17.09円。150文＝2,564円→約2,600円。148文＝2,530円→約2,500円。872文＝14,906円→約1万5千円。850文＝14,530円。200文＝3,419円→約3,400円。
#   148文×12泊＝1,776文÷585＝3.04→日当の3日分、約3万円（1,776×17.09＝30,352）。
#   1847年？→使わない。施行所 1828→日記 1835＝7年。千両の利子の半分50両。板橋 横2間≒3.6m・長さ10間≒18m（1間≒1.82m）。和田峠 1600−1531＝69m。
#   東海道 約492km と 中山道 約526km の差 34km→「30キロあまり長い」。
#   和暦：天保6年＝1835、天保5年＝1834、天保14年＝1843、貞享2年＝1685、宝永6年＝1709、文政11年＝1828、元和9年＝1623、寛永11年＝1634、文化7年＝1810、昭和42年＝1967、昭和54年＝1979、令和7年＝2025。
# 確かめられなかったこと（台本では言わない）：中山道の江戸〜京都の決まった日数、中山道を選んだ理由の一次史料、木曽路の旅籠代の公定、和田の872文が何人分か、
#   西村の旅の連れの人数、新町の定宿の名（崎玉や？）、十石峠の読み、木曽の桟が焼けた年と石垣にした年、浪士組の日ごとの泊まり、旅行用心集の1日の里数。
# 絵：AI 絵（Gemini。一覧は scripts/story/nakasendo_main_look.yaml の頭）と、英泉の木曽街道六十九次（パブリックドメイン、国立国会図書館）。実在の人物の顔は描かない。字・紋は描かない。
