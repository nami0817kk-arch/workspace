  # ================================================================ 第1章 中山道という道
  - title: 「江戸から京都まで宿はいくつ？」　中山道と木曾日記
    lines:
      # fact: naka-42
      - 語り: 国土交通省の道路局の解説では、中山道は、江戸から京都まで、135里34町あまり。およそ526キロです。
        figure: {type: map, title: 中山道と東海道, bounds: [135.5, 140.1, 34.6, 36.6], places: [[江戸, 139.77, 35.68], [京都, 135.77, 35.01]], route: [江戸, 京都], note: およそ526キロ}
      # fact: naka-45
      - 語り: 東海道は、横浜国道事務所の答えで、およそ492キロ。中山道のほうが、30キロあまり長い道です。
      # fact: naka-44
      - 語り: 宿場の数も、書き方が分かれます。国土交通省の関東運輸局の冊子は、67か所。埼玉県の冊子は、69の宿場、と書きます。
        tone: 疑問
        figure: null
        card: {head: "中山道の宿場", body: 67か所か「69」か}
      # fact: naka-42, naka-44
      - 語り: 67は、江戸の側の板橋から、近江の守山まで。そこに、東海道と重なる草津と大津を足すと、69。浮世絵の、木曽街道六十九次の数です。
      # fact: naka-46
      - 語り: では、何日かかったのか。東海道は、歩いて13日から15日ほど、と横浜国道事務所は答えています。ドイツ人の医師ケンペルは12日、シーボルトは17日でした。
      # fact: naka-47
      - 語り: ところが中山道には、何日、という決まった答えが、見当たりません。
      # fact: naka-48
      - 語り: 中山道を選ぶ旅人が多かった理由は、川止めが少なく、厳しい関所も少なく、宿代も安かったから、と言われます。ただ、確かな記録は、見当たりません。
      - 語り: だから、実際に歩いた人の日記で、数えてみます。
      # fact: naka-01
      - 語り: 天保6年、1835年の5月4日。近江の日野の商人、西村市郎右衛門安則が、武蔵の吉川にある、自分の家の店へ向かって、家を出ました。
        card: {head: "1835年5月4日", body: 日野から吉川の店へ}
      # fact: naka-01
      - 語り: その道中を書いたのが、木曾日記です。この日記は、同志社大学の雑誌、同志社商学に、活字に起こされ、解説が付いて載っています。
      - 語り: 日記は、京の側から、江戸の側へ向かう旅です。この動画も、日記と同じ向きに、近江から江戸へ、宿場を追います。
        figure: {type: map, title: 西村安則の木曾日記の道, bounds: [135.9, 140.1, 34.8, 36.5], places: [[日野, 136.25, 35.02], [高宮, 136.24, 35.20], [赤坂, 136.58, 35.38], [鵜沼, 136.90, 35.40], [大湫, 137.33, 35.37], [三留野, 137.62, 35.63], [福島, 137.69, 35.84], [洗馬, 137.93, 36.07], [和田, 138.23, 36.23], [軽井沢, 138.61, 36.35], [新町, 139.13, 36.27], [鴻巣, 139.52, 36.07], [吉川, 139.84, 35.89]], route: [日野, 高宮, 赤坂, 鵜沼, 大湫, 三留野, 福島, 洗馬, 和田, 軽井沢, 新町, 鴻巣, 吉川], upto: 1}
      # fact: naka-02
      - 語り: 人々に送られて出た、その日の夜は、高宮の宿。玉屋という旅籠に、泊まりました。
        figure: {type: map, title: 西村安則の木曾日記の道, bounds: [135.9, 140.1, 34.8, 36.5], places: [[日野, 136.25, 35.02], [高宮, 136.24, 35.20], [赤坂, 136.58, 35.38], [鵜沼, 136.90, 35.40], [大湫, 137.33, 35.37], [三留野, 137.62, 35.63], [福島, 137.69, 35.84], [洗馬, 137.93, 36.07], [和田, 138.23, 36.23], [軽井沢, 138.61, 36.35], [新町, 139.13, 36.27], [鴻巣, 139.52, 36.07], [吉川, 139.84, 35.89]], route: [日野, 高宮, 赤坂, 鵜沼, 大湫, 三留野, 福島, 洗馬, 和田, 軽井沢, 新町, 鴻巣, 吉川], upto: 2}
      # fact: naka-04
      - 語り: この夜、安則が詠んだ狂歌には、はたごは百五十、とあります。旅籠の代が、150文です。
        figure: null
        card: {head: "高宮の旅籠", body: 百五十}
      # fact: naka-05
      - 語り: その解説は、江戸の終わりの暮らしを書いた守貞謾稿を引いて、中山道の商人宿は、148文が相場だった、とまとめています。
      # fact: naka-68
      - 語り: 今のお金の目安にします。江戸の大工の1日の稼ぎは、文政のころの記録をもとに銭に直すと、およそ585文です。
      - 語り: この日当を、今の1万円とすると、148文は、およそ2,500円。高宮の150文も、ほぼ相場どおりです。
      - 語り: 翌朝から、安則は、1日に何里を歩いたのか。
        hook: true
      - 語り: 宿場の帳面の数で、1日ずつ、測っていきます。
        hook: true

  # ================================================================ 第2章 近江から美濃へ
  - title: 「1日に何里歩いた？」　高宮・鵜沼・大湫
    lines:
      # fact: naka-02
      - 語り: 5月5日。高宮を出て、摺針峠を越え、関ヶ原を過ぎて、美濃の赤坂に泊まりました。
      # fact: naka-43, naka-55
      - 語り: 道のりを測る物差しは、宿村大概帳です。天保14年、1843年ごろの調べで、宿場ごとに、日本橋からの道のりと、家の数をまとめた帳面です。
      # fact: naka-67
      - 語り: その数で、高宮から赤坂までを引き算すると、9里27町。およそ38キロです。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 1}
      # fact: naka-07
      - 語り: 6日は、赤坂から鵜沼まで。五月雨で、呂久川の水があふれ、麦も菜も傷んでいた、と書いています。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 2}
      # fact: naka-06
      - 語り: 鵜沼では、野口という家に泊まりました。何度も泊まった家で、もてなしも悪くない。いつもの定宿です。
        figure: null
      # fact: naka-62
      - 語り: 150年ほど前、同じ木曽路を、逆の向きに歩いた人がいます。江戸前期の学者、貝原益軒です。貞享2年、1685年に、江戸から西へ帰る旅を、木曽路之記に書きました。
      # fact: naka-65
      - 語り: 益軒のころ、鵜沼から西の道には駕籠があるが、そこから東、江戸までの間には駕籠が無い。木曽路之記には、そうあります。
      # fact: naka-65
      - 語り: ただ1か所だけ、上野の坂本には、駕籠が少しある。碓氷峠があるからだ、というのです。
        card: {head: "益軒の木曽路之記", body: 鵜沼から東に駕籠なし}
      # fact: naka-02, naka-39
      - 語り: 7日。安則は、木曽川の太田の渡しを越えました。木曽のかけはし、太田の渡し、碓氷峠がなくばよい。中山道の三大難所の名を並べた、そんな俗謡が伝わっています。
      # fact: naka-06
      - 語り: その夜は、山あいの大湫の宿、山城屋。一晩じゅう、天井で鼠が騒いだ、と書き残しています。
      # fact: naka-10, naka-06
      - 語り: 実はこの山城屋には、1年前の天保5年にも、日野の商人が泊まっています。仙台の店へ向かった、中井源左衛門光基です。その覚え書き、初下り諸事手扣が、滋賀大学の史料館の紀要で紹介されています。
        card: {head: "大湫の山城屋", body: 日野の商人2人が1年違いで泊まる}
      # fact: naka-67
      - 語り: 6日は9里7町、7日は9里18町。どちらも、およそ37キロ前後です。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 3}
      # fact: naka-60
      - 語り: スポーツ史の研究者、谷釜さんは、2020年の本で、旅日記39編を調べ、1日の平均を34.1キロとしています。安則の足は、それより速い。
        figure: null
      - 語り: この先は、木曽の谷です。
        hook: true
      - 語り: 命をかけて渡る、と詠まれた橋が、待っていました。
        hook: true

  # ================================================================ 第3章 木曽の桟
  - title: 「木曽の桟は危なかったのか？」　馬籠・妻籠・木曽の桟
    lines:
      # fact: naka-07
      - 語り: 5月8日は、朝から雨。十三峠の坂を越え、「中津川」「落合」を過ぎて、美濃と信濃の境の峠に登ると、また降り出した、と書いています。
      # fact: naka-40
      - 語り: 落合から馬籠へ上る十曲峠には、今も、およそ800メートルの石畳が残ります。
      # fact: naka-11
      - 語り: 益軒のころから150年。1年前の中井光基は、馬籠まで来たところで、駕籠をしきりに勧められ、銭200文で、妻籠まで乗っています。
        card: {head: "馬籠から妻籠", body: 駕籠に200文}
      # fact: naka-67, naka-68
      - 語り: 馬籠から妻籠までは、宿村大概帳で、ちょうど2里。200文は、目安で、3,400円ほどです。
      # fact: naka-49
      - 語り: 運び賃には、お上の決めた額がありました。中津川の宿の、正徳元年、1711年の高札では、隣の落合の宿まで、人足1人が28文、人を乗せて荷は少しだけの馬が36文です。
      # fact: naka-49
      - 語り: ただ、ふつうの旅人が掛け合って払う額は、その2倍ぐらいだった、と歴史学者の児玉幸多さんは書いています。
      # fact: naka-50
      - 語り: しかも、この決まった額は、幕末に跳ね上がります。中津川市史によると、文久3年、1863年には、およそ2倍。慶応4年、1868年には、8倍近くになりました。
        card: {head: "運び賃の決まり", body: 幕末に8倍近くへ}
      # fact: naka-57
      - 語り: 旅の8年後、天保14年の数では、妻籠は、家が83軒で、旅籠が31軒。家の3軒に1軒あまりが、旅籠という宿場です。
      # fact: naka-02, naka-67
      - 語り: 安則は、妻籠を過ぎて、三留野で泊まりました。この日は、11里20町。およそ45キロ。雨の峠を越えた日に、ここまでで、いちばん長く歩いています。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 4}
      # fact: naka-07
      - 語り: 9日。「須原」「小野の滝」を過ぎて、木曽の桟に着きます。安則は、ここで、命を的に、かけはしぞ憂き、と詠みました。
        figure: null
      # fact: naka-32
      - 語り: 桟の脇には、芭蕉の、かけはしや命をからむ蔦かつら、の句碑があります。今は、長野県の名勝です。
      # fact: naka-63
      - 語り: ところが、益軒の木曽路之記は、まるで違う姿を書いています。
        tone: 疑問
      # fact: naka-63
      - 語り: 桟は、木曽川に架けた橋ではない。山のそばの道が途切れた所に架けた、幅2間、長さ10間の板橋で、両わきは石垣で固めてある。
      # fact: naka-63
      - 語り: 昔は危ない所だったようだが、今は尾張の殿様が、堅固に架けているので、少しも危ないことはない。
        tone: 重い
        card: {head: "益軒が見た桟", body: 幅2間・長さ10間の板橋}
      - 語り: 幅およそ3.6メートル、長さはおよそ18メートル。150年前の益軒の目に映った橋は、歌の怖さとは、別のものでした。それでも商人は、憂き、と詠んだのです。
      # fact: naka-34
      - 語り: その先の寝覚の床も、早くから知られた名所です。沢庵和尚は、寛永11年、1634年の紀行に、益軒も、木曽路之記に、浦島太郎が釣りをした所として書いています。
      # fact: naka-35
      - 語り: ただ、江戸の旅人が見た寝覚の床は、急流の中にありました。昭和42年、1967年にできた木曽ダムなどで、川の水が大きく減って、今の姿になったのです。
      # fact: naka-02, naka-67
      - 語り: この日の泊まりは、木曽福島。きぬや、という宿でした。10里3町、およそ40キロです。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 5}
      # fact: naka-33
      - 語り: 福島には、関所がありました。ところが、この関所が、いつできたのかは、分かっていません。文化庁によると、1668年ごろの古い絵図を手がかりに、2度の発掘で、番所の前の石の並びが見つかっています。
        figure: null
      - 語り: 翌朝、安則は、木曽の谷を出る峠に向かいます。
        hook: true
      - 語り: その峠を越えると、川の流れる先が、変わります。
        hook: true

  # ================================================================ 第4章 鳥居峠と奈良井
  - title: 「鳥居峠の先に何がある？」　鳥居峠・奈良井・洗馬
    lines:
      # fact: naka-07, naka-30
      - 語り: 5月10日。宮ノ越を過ぎて、鳥居峠を越えます。林野庁の中部森林管理局によると、高さは1,197メートル。旅人泣かせの難所、と呼ばれました。
      # fact: naka-30
      - 語り: この峠は、水の分かれ目です。南に降った雨は、木曽川から太平洋へ。北に降った雨は、奈良井川から信濃川を通って、日本海へ流れます。
        card: {head: "鳥居峠", body: 太平洋と日本海の分かれ目}
      # fact: naka-31
      - 語り: 峠の南の薮原は、お六櫛の里です。頭痛に悩んだお六が、ミネバリの木で櫛を作って髪をとかすと、治った。そんな伝説から、その名が付いたといわれます。
      # fact: naka-57, naka-56
      - 語り: 峠を下りた奈良井は、天保14年の宿村大概帳で、家は400軒を超えるのに、旅籠はわずか5軒でした。
        tone: 疑問
        card: {head: "奈良井", body: 家409軒・旅籠5軒}
      # fact: naka-56
      - 語り: 中山道で旅籠がいちばん少ないのは、信濃の佐久の八幡の3軒。その次が、奈良井などの5軒。いちばん多い武蔵の深谷は、80軒でした。
      # fact: naka-02, naka-67
      - 語り: 安則は、「奈良井」「贄川」「本山」を通って、洗馬に泊まりました。この日は、9里27町。およそ38キロです。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 6}
      # fact: naka-32
      - 語り: 洗馬の手前、本山の宿には、そば切り発祥の地、の碑が立っています。木曽路の入口のこのあたりは、そばの産地でした。
        figure: null
      - 語り: 次の日、安則の前には、中山道でいちばん高い峠が、待っています。
        hook: true
      - 語り: そしてその夜の宿では、思わぬ宿代を告げられます。
        hook: true

  # ================================================================ 第5章 和田峠
  - title: 「和田峠の宿代はいくら？」　塩尻・下諏訪・和田
    lines:
      # fact: naka-02
      - 語り: 5月11日。洗馬を出て、塩尻を過ぎ、塩尻峠を越えて、下諏訪へ。そこから、和田峠に向かいます。
      # fact: naka-56
      - 語り: 途中の塩尻は、旅籠が75軒。深谷に次いで、中山道で2番目に多い宿場でした。
      # fact: naka-25
      - 語り: 和田峠の高さも、資料によって違います。長和町は、およそ1,600メートル。中山道で、いちばん高い所だ、と書きます。
        tone: 疑問
      # fact: naka-25
      - 語り: 日本山岳会の解説も、1,600メートルとしながら、明治9年に開いた新しい道では1,570メートル、明治29年に峠を掘り下げてからは1,531メートル、と書きます。道筋と時代で、高さが変わるのです。
        card: {head: "和田峠の高さ", body: 約1600m・1570m・1531m}
      # fact: naka-26
      - 語り: 下諏訪から和田までは、5里18町、およそ22キロ。峠との高さの差は、800メートルほどあります。
      # fact: naka-64
      - 語り: それでも益軒は、和田峠の坂は長く、東はなだらかで、西は険しい。けれど、はなはだ険しいというほどではない、と書いています。
      # fact: naka-28
      - 語り: 峠の東側の東餅屋には、茶屋が5軒ありました。寛永のころから、1軒ごとに、1日玄米5合の扶持が与えられ、峠で困った旅人を助けました。
      # fact: naka-29
      - 語り: 峠の西側の西餅屋にも、茶屋が4軒ありました。幕末の戦いの中で焼かれ、すぐに建て直されています。
      # fact: naka-16
      - 語り: 江戸の呉服町の豪商、かせや与兵衛が、幕府に寄付した1,000両。その利子の半分、50両を元手に、文政11年、1828年、峠に永代人馬施行所が置かれます。
        card: {head: "1828年 和田峠", body: 1000両の利子で施行所}
      # fact: naka-17
      - 語り: 11月から3月の間、峠を越える旅人には、粥と焚火を。牛や馬には、1年じゅう、小桶1杯の煮た麦を。どれも、ただでした。
        tone: しみじみ
      # fact: naka-16, naka-02
      - 語り: 安則が峠を越えたのは、施行所ができて7年後の5月。粥と焚火の出る、11月から3月の時期では、ありません。
      # fact: naka-03
      - 語り: その夜、安則は、和田の永井喜左衛門の家に泊まりました。日記には、こうあります。
      # fact: naka-03
      - 語り: 旅籠の代は、これまで850文だったのに、今夜は872文だ、と。
        tone: 重い
        card: {head: "和田の宿代", body: 850文から872文へ}
      # fact: naka-03
      - 語り: もっとも、安則は、もてなしは良かった、とも書いています。
      # fact: naka-04, naka-03, naka-05
      - 語り: ここで、数が合いません。最初の夜の高宮は、百五十。和田は、その5倍を超えます。何人分の代なのか、日記は書いていません。日記を紹介した研究者は、いつもより高い例として、この和田の宿代を挙げています。
        tone: 疑問
      # fact: naka-68
      - 語り: 872文は、目安で、1万5千円ほど。この日の道のりは、10里9町、およそ40キロでした。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 7}
      - 語り: 残る大きな峠は、あと1つ。
        hook: true
        figure: null
      - 語り: その峠を越える日に、安則は、いちばん長い1日を迎えます。
        hook: true

  # ================================================================ 第6章 碓氷峠
  - title: 「碓氷峠を越えた日、何里歩いた？」　軽井沢・碓氷峠・新町
    lines:
      # fact: naka-02, naka-67
      - 語り: 5月12日。和田から「望月」「岩村田」「追分」を通って、軽井沢へ。12里11町、およそ48キロです。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 8}
      # fact: naka-07
      - 語り: 13日。軽井沢を出て、碓氷峠に登り、上野の方を見下ろした、と書いています。
        figure: null
      # fact: naka-18
      - 語り: 碓氷峠にも、和田峠と同じ1828年に、笹沢の人馬施行所ができていました。費用は、全部、元手のお金を貸した利子で、まかなわれました。
      # fact: naka-18, naka-19
      - 語り: 群馬県によると、2020年度の発掘で、建物の土台とみられる、およそ18メートルの石の並びが出ています。2025年の12月には、国の史跡、中山道に加えるよう、答申されました。
      # fact: naka-39, naka-22
      - 語り: 峠から坂本へ下る、刎石坂。群馬県が、中山道の三大難所の1つと書く、碓氷峠越えの急な坂です。坂の上には、4軒の茶屋が並んだ跡と、茶屋が使った井戸が残ります。
      # fact: naka-65
      - 語り: 鵜沼から東で、ここにだけ駕籠が少しある、と益軒が書いた坂本の宿場は、この坂を下りた所です。
      # fact: naka-20
      - 語り: 坂本の先、横川には、碓氷の関所がありました。元和9年、1623年に、幕府が置いた関所です。番所の前の、おじぎ石が、今も残ります。
        card: {head: "碓氷関所", body: 1623年 横川}
      # fact: naka-21
      - 語り: この関所の跡と、坂本の宿場の西から峠の熊野神社までの、およそ8キロの道は、2024年の12月、国の史跡、中山道に加えるよう答申されました。
      # fact: naka-08
      - 語り: 安則は、松井田で、帰り馬を、安い値で雇いました。荷を下ろして戻る途中の馬です。そして、安中で、馬を降りています。
      # fact: naka-08, naka-67
      - 語り: 日記には、今日は13里ほどの道なので、ことに気がせいた、とあります。宿村大概帳で測ると、軽井沢から新町までは、13里18町あまり。
        tone: 重い
      # fact: naka-67
      - 語り: およそ53キロ。途中は馬に乗りましたが、峠を1つ越えた日が、数えた10日のうちで、いちばん長い1日でした。
        tone: 重い
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 9}
      # fact: naka-02
      - 語り: 日が暮れて着いた新町では、決まった定宿に泊まりました。
        figure: null
      # fact: naka-54
      - 語り: 同じ新町の宿場では、25年前の文化7年、1810年に、俳人の小林一茶が、夜中に起こされ、神流川の灯籠の寄付を求められて、12文を出しています。
      - 語り: 残るは、武蔵の平らな道。
        hook: true
      - 語り: 安則は、あと何日で、店に着いたのか。
        hook: true

  # ================================================================ 第7章 武蔵の宿場
  - title: 「店まであと何日？」　本庄・深谷・鴻巣・吉川
    lines:
      # fact: naka-02
      - 語り: 5月14日。新町を出て、「本庄」「深谷」「熊谷」を通り、鴻巣に泊まりました。
      # fact: naka-55
      - 語り: 本庄は、家が1,212軒。中山道で、いちばん大きな宿場です。人も、4,554人いました。
        card: {head: "本庄", body: 中山道でいちばん大きい宿場}
      # fact: naka-56
      - 語り: 次の深谷は、旅籠が80軒。中山道で、いちばん旅籠の多い宿場です。
      # fact: naka-67
      - 語り: この日は、11里22町あまり。およそ46キロでした。
        figure: {type: bars, title: 安則の1日ずつの道のり（キロ）, bars: [[5日 赤坂, 38], [6日 鵜沼, 36], [7日 大湫, 37], [8日 三留野, 45], [9日 福島, 40], [10日 洗馬, 38], [11日 和田, 40], [12日 軽井沢, 48], [13日 新町, 53], [14日 鴻巣, 46]], upto: 10}
      # fact: naka-02
      - 語り: 15日。鴻巣を出た安則は、桶川を過ぎて、中山道を離れます。「岩槻」「越ヶ谷」を通って、日が暮れるころ、ようやく、無事に、吉川に着きました。
        tone: しみじみ
        figure: {type: map, title: 西村安則の木曾日記の道, bounds: [135.9, 140.1, 34.8, 36.5], places: [[日野, 136.25, 35.02], [高宮, 136.24, 35.20], [赤坂, 136.58, 35.38], [鵜沼, 136.90, 35.40], [大湫, 137.33, 35.37], [三留野, 137.62, 35.63], [福島, 137.69, 35.84], [洗馬, 137.93, 36.07], [和田, 138.23, 36.23], [軽井沢, 138.61, 36.35], [新町, 139.13, 36.27], [鴻巣, 139.52, 36.07], [吉川, 139.84, 35.89]], route: [日野, 高宮, 赤坂, 鵜沼, 大湫, 三留野, 福島, 洗馬, 和田, 軽井沢, 新町, 鴻巣, 吉川], upto: 13}
      # fact: naka-02
      - 語り: 5月4日に日野を出て、11泊。12日目の到着です。
        card: {head: "日野から吉川", body: 11泊で12日目に着く}
      - 語り: では、江戸から京都まで、中山道を歩き通すと、何泊何日になるのか。
        hook: true
        figure: null
      - 語り: 安則の足で、数えてみます。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：中山道は江戸から京都まで何泊何日か
    lines:
      # fact: naka-67
      - 語り: 安則が中山道の上を歩いたのは、高宮から桶川まで。宿村大概帳の数で、109里あまり。およそ430キロ。中山道の8割を超える道のりです。
      # fact: naka-67
      - 語り: 高宮から鴻巣までの10日で、107里あまり。1日の平均は、10里27町。およそ42キロです。
        figure: {type: calc, title: 安則の1日の道のり, terms: [[107里あまり, 高宮から鴻巣], [10日, 5日から14日], [約42キロ, 1日の平均]], ops: [÷, ＝]}
      # fact: naka-42, naka-67
      - 語り: この速さで、日本橋から京都の三条大橋まで、135里34町あまりを歩くと、12日と半日あまり。およそ13日、12泊の旅になります。あくまで、日記の速さで計算した目安です。
        tone: 重い
        figure: {type: calc, title: 江戸から京都まで, terms: [[135里34町, 日本橋から三条大橋], [10里27町, 1日の平均], [約13日, 12泊]], ops: [÷, ＝]}
      # fact: naka-46
      - 語り: ふつうの旅人が東海道にかけたのは、13日から15日。30キロあまり長い山の道でも、安則の足なら、それとほとんど同じ日数で歩けたことになります。
        figure: null
      # fact: naka-05, naka-68
      - 語り: 宿代は、相場だった148文で12泊なら、1,776文。大工の日当の3日分ほど、目安でおよそ3万円です。
        figure: {type: bars, title: 12泊の宿代の目安（文）, bars: [[148文で12泊, 1776], [大工の日当, 585]], labels: [1776文 約3万円, 585文 1万円]}
      # fact: naka-03
      - 語り: ただ、和田の夜のように、その5倍を超える額を言われる宿も、ありました。
        figure: null
      - 語り: 「雨の十三峠」「鼠の騒ぐ山の宿」「益軒が少しも危なくないと書いた板橋」。そして、冬には粥と焚火を施した峠。
      - 語り: 山また山の中山道は、1日10里あまりを進む足と、峠で旅人を助ける人々の手で、江戸と京都を結んでいました。
        tone: しみじみ
      # fact: naka-07
      - 語り: 命を的に、かけはしぞ憂き。そう詠んだ商人は、11泊ののち、武蔵の吉川の店へ、たどり着いたのです。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
