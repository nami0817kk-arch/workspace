# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  徳川の将軍は、15代の慶喜で終わりました。けれど、徳川の家は終わっていません。今の当主は、19代目です。
  江戸城を明け渡したあと、徳川の家を継いだのは、慶喜ではなく、数えで6歳の男の子でした。将軍でなくなった徳川の家は、どうやって続いてきたのか。
  この動画でわかること
  ・6歳の16代目が選ばれた理由と、700万石から70万石への引っ越し
  ・「十六代様」と呼ばれた男が、総理大臣を断り、幻の東京五輪を率いた話
  ・江戸城を出た慶喜が立てた、もう一つの徳川家と、御三家・御三卿のその後
  ・跡継ぎがいなくなった17代と、会津から来た18代、そして19代目の今
description_note: |-
  事実は、国立国会図書館・国立公文書館・函館市史・静岡県立中央図書館・徳川記念財団・茨城県立歴史館・和歌山県立図書館などの公開資料、論文（原口大輔「貴族院議長・徳川家達と明治立憲制の展開」）、新聞・雑誌の記事で確かめました。
  家達が家を継いだときの年齢は、数え年で6歳（満では4歳）です。資料によって5歳と書くものもあります。代の数え方は、徳川記念財団と同じく家康を初代としています。
  今の当主とご家族については、ご本人の会見・寄稿・取材記事と公的機関の発表に出ていることだけを取り上げています。
  画面の風景・室内・人物の後ろ姿は、画像生成AIで作った想像上のイメージで、実在の写真ではありません。徳川家達・慶喜・松平容保・天璋院の肖像と、1921年のワシントン会議の写真は、パブリックドメインのものです（ウィキメディア・コモンズ）。

en:
  title: "Tokugawa Family Tree: What Became of the Shogun's House? Yoshinobu's House and the 19th Head"
  description: |-
    The Tokugawa shoguns ended with the 15th, Yoshinobu. But the Tokugawa house did not end. Its head today is the 19th.
    After Edo Castle was handed over, the house was inherited not by Yoshinobu but by a boy of six (by the old count). How did the shogun's house survive once it no longer ruled?
    In this video you will learn:
    - Why a six-year-old became the 16th head, and the move from 7 million koku to 700,000
    - The "16th Shogun" who turned down the premiership and led the Tokyo Olympics that never happened
    - The other Tokugawa house that Yoshinobu founded, and what became of the branch families
    - The 17th head who lost his heir, the 18th who came from the Aizu Matsudaira, and the 19th head today
    Japanese-language history video (Japanese audio).
  chapters:
    - "The Shogun Ended. The House Did Not."
    - "Why a Six-Year-Old? 1866 to 1868"
    - "From 7 Million to 700,000 Koku: Shizuoka, 1868 to 1871"
    - "Tenshoin and the Return from England, 1877 to 1884"
    - "The \"16th Shogun\" Who Refused to Be Prime Minister"
    - "The Olympics That Never Happened, 1936 to 1940"
    - "The Other Tokugawa Houses: Yoshinobu's House and the Branch Families"
    - "No Heir Left: The 17th and the 18th from Aizu"
    - "The 19th Head Today"
    - "Summary: How Did the Shogun's House Survive?"

