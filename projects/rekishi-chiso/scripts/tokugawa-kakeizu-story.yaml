#   貴族院議長 1903→1933＝30年（「およそ30年」）。家達の没年齢 満76歳（数え78）。1868→2026＝158年。慶喜家 1902→2023＝121年。慶朝 1950年2月生→2017年9月没＝67歳。
#   好敏 1884年7月生→1910年12月19日＝26歳。大日本史 1657→1906＝249年。家英 1912年生・25歳で没。代数は徳川記念財団の数え方（家康を初代）：家達16・家正17・恒孝18・家広19。
#   恒孝は容保の曾孫（容保→恒雄→一郎→恒孝）、家達の曾孫（家達→家正→豊子→恒孝）。
