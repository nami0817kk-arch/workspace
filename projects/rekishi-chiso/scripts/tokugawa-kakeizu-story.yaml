terms:
  宗家: 一族の本家。徳川では将軍を出した家
  御三卿: 田安・一橋・清水の3家。将軍の跡継ぎを出す家
  御三家: 尾張・紀州・水戸の3家。家康の子の家
  貴族院: 戦前の議会の上の院。華族などが議員
  公爵: 華族の5つの位のうち一番上
  継宗の儀: 徳川宗家の当主を継ぐ式

