sections:
  # ================================================================ 序章（冒頭 約2分）。19代目が誰かは第8章まで言わない
  - title: 将軍は15代で終わった　では、16代目はいたのか
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影 江戸城の堀（1860年代。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: kakeizu-76, kakeizu-63
      - 語り: 徳川の将軍は、15代の慶喜で、終わりました。けれど、徳川の家は、終わっていません。今の当主は、《19代目》です。
        tone: 重い
        card: {head: "徳川宗家", body: 今の当主は19代目}
      - 語り: では、問題です。1868年、江戸城を明け渡したあと、徳川の家を継いだのは、誰だったでしょうか。
        tone: 疑問
      # fact: kakeizu-13, kakeizu-110
      - 語り: 慶喜では、ありません。継いだのは、数えで6歳の、男の子でした。
        card: {head: "16代目", body: 数え6歳の男の子}
      # fact: kakeizu-16
      - 語り: 700万石とも言われた徳川の領地は、70万石。10分の1になりました。
      # fact: kakeizu-30
      - 語り: その子は、のちに、総理大臣に推されるほどの人になります。
      # fact: kakeizu-80, kakeizu-86
      - 語り: 一方、江戸城を出た慶喜も、明治になって、もう一つの徳川の家を立てていました。2つの家は、まったく違う道をたどります。
        tone: 重い
      # fact: kakeizu-57, kakeizu-63
      - 語り: 将軍の家の方は、2023年の正月に、60年ぶりに当主が替わり、19代目が継ぎました。
      - 語り: 将軍でなくなった徳川の家は、どうやって、150年あまり、続いてきたのか。
        tone: 疑問
      - 語り: 1868年の6歳の男の子から、今の19代目まで。家系図の線は、どうつながってきたのか。
        figure: {type: numberline, title: 徳川宗家の当主（家康を初代として数える）, items: [[徳川慶喜, 15, 15代], [16代, 16, "？"], [17代, 17, "？"], [18代, 18, "？"], [19代, 19, "？"]], unit: 代, focus: 19代}
        hook: true
      - 語り: 始まりは、慶喜が江戸城を出た、1868年の春です。
        figure: null
        hook: true

  # ================================================================ 第1章 なぜ6歳の子だったのか
  - title: 「田安の亀之助を」　なぜ6歳の子だったのか　1868年
    background: {image: paintings/kazu_tenshoin_photo.png, credit: "天璋院の写真（1883年以前。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: kakeizu-10
      - 語り: 男の子の名は、田安亀之助。1863年、文久3年の7月11日、江戸の田安家に、三男として生まれました。
        year: 1863
        card: {head: "1863年 文久3年", body: 田安家に生まれる}
      # fact: kakeizu-108
      - 語り: 田安家は、将軍の跡継ぎを出すための、御三卿の1つです。亀之助の兄弟からは、のちに、田安家の当主と、紀州徳川家の当主も出ます。
        figure: {type: people, title: 田安家の兄弟の行き先, nodes: [[田安慶頼, 父・田安家], [亀之助, 三男→徳川宗家], [達孝, 田安家を継ぐ], [頼倫, 六男→紀州徳川家]], edges: [[田安慶頼, 亀之助, 三男], [田安慶頼, 達孝, 子], [田安慶頼, 頼倫, 六男]]}
      # fact: kakeizu-110
      - 語り: 実は、亀之助の名前が、跡継ぎとして挙がったのは、1868年が初めてでは、ありません。14代の将軍、家茂が、もしものときの跡継ぎに、亀之助を挙げていた、と伝わります。
        figure: null
      # fact: kakeizu-112
      - 語り: 1943年に出た、家茂の妻、和宮の伝記には、こうあります。家茂が亡くなった知らせが届いたその日に、13代将軍の妻だった天璋院が、亀之助を推すことについて、和宮に意見を尋ねた。
        tone: しみじみ
      # fact: kakeizu-13
      - 語り: 1866年のことです。亀之助は、数えで4歳でした。
      - 語り: けれど、このとき家を継ぎ、将軍になったのは、慶喜でした。
      # fact: kakeizu-111
      - 語り: 2年後の、1868年。鳥羽・伏見の戦いのあと、徳川家は、朝敵とされます。
        year: 1868
      # fact: kakeizu-111
      - 語り: 1月20日、和宮は、東海道を進む新政府の軍の総督、橋本実梁に、書状を送りました。徳川の家が、朝敵の汚名を残すのは、残念だ、と。
        card: {head: "慶応4年1月20日", body: 和宮が家の存続を願う}
      # fact: kakeizu-12
      - 語り: 2022年に、ニッポンドットコムに載った、小林明さんの記事によれば、閏4月25日、西郷隆盛らが加わった新政府の会議で、徳川の新しい当主は、田安の亀之助と決まりました。
      # fact: kakeizu-11
      - 語り: 閏4月29日。新政府の三条実美が、江戸城で、朝廷の決定を伝えました。徳川宗家の跡継ぎは、田安亀之助。受け取ったのは、本人ではなく、代理の人でした。
        card: {head: "慶応4年閏4月29日", body: 亀之助が宗家の跡継ぎに}
      # fact: kakeizu-13, kakeizu-116
      - 語り: このときの年齢は、資料によって、書き方が違います。函館市史は、6歳。2025年の静岡新聞は、5歳。
      # fact: kakeizu-13
      - 語り: 生まれた日から数えると、閏4月29日、今の暦の6月19日には、満4歳と、10か月近く。6歳は、生まれた年を1歳とする、数え年です。
        tone: しみじみ
      # fact: kakeizu-10, kakeizu-13
      - 語り: この年、亀之助は、名を家達と改めます。徳川宗家の、16代目です。
        portrait: {image: paintings/kakeizu_iesato_child.jpg, caption: "徳川家達の少年時代の写真"}
      - 語り: 6歳の当主に、新政府が渡した領地は、どれほどだったのか。
        tone: 疑問
        portrait: null
        hook: true
      - 語り: 答えは、5月24日に届きました。
        hook: true

  # ================================================================ 第2章 700万石から70万石へ
  - title: 「駿河府中七十万石」　6歳の殿様の引っ越し　1868年5月から1871年
    background: {image: paintings/yoshinobu_suruga_castle_map.jpg, credit: "駿府城の図（駿州府中之城図。1935年版、岡崎市立図書館蔵。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: kakeizu-14
      - 語り: 5月24日。新政府は、亀之助を、駿府の城主とし、領地を、70万石とする、と伝えました。
        card: {head: "慶応4年5月24日", body: 駿府の城主・70万石}
      # fact: kakeizu-14
      - 語り: 内訳は、駿河の国が、およそ40万石。遠江の国の一部が、およそ18万石。そして、陸奥の国の一部が、およそ12万石です。
        figure: {type: stats, title: 70万石の内訳（1868年5月）, items: [[駿河の国, 約40万石], [遠江の国の一部, 約18万石], [陸奥の国の一部, 約12万石]], upto: 3}
      # fact: kakeizu-15
      - 語り: 陸奥、今の東北の分は、9月4日に、三河の国へ替えられました。そのため、静岡藩の領地は、今の静岡県と、愛知県にまたがっていました。
        figure: null
      # fact: kakeizu-15
      - 語り: 資料によって、駿河と遠江の70万石、と書くものと、駿河・遠江・三河、と書くものがあるのは、このためです。
      # fact: kakeizu-16
      - 語り: 函館市史は、幕府の直轄地と、旗本の領地を合わせて、700万石といわれた所領が、10分の1に削られた、と書いています。
        card: {head: "700万石 → 70万石", body: 10分の1に}
      # fact: kakeizu-17
      - 語り: 5月26日付で、新政府は、イギリスの公使、パークスにも、知らせています。亀之助を、新たに、府中の藩主に任じた、と。
      # fact: kakeizu-17
      - 語り: その通告の文書は、今、東京大学の法学部の、英国公使館文書の中に残っています。
      # fact: kakeizu-18
      - 語り: 8月15日。家達は、駿河の府中、今の静岡に入りました。静岡県立中央図書館の解説によれば、まだ数えで6歳、満5歳でした。
        card: {head: "慶応4年8月15日", body: 府中に入る（満5歳）}
      # fact: kakeizu-19
      - 語り: 2017年の、雑誌サライのウェブの連載によれば、江戸から付き従った者は、わずか100名ほどでした。
      # fact: kakeizu-18
      - 語り: 住まいは、はじめ、駿府城の中の、もとの城代の屋敷。のちに、浅間神社の神主の屋敷へ移りました。
      # fact: kakeizu-20
      - 語り: その屋敷の門は、田安門と呼ばれ、今は、静岡市立高校の、正門の脇に移されています。
      # fact: kakeizu-21
      - 語り: 1869年、版籍奉還で、家達は、静岡藩の知事になります。けれど、1871年の廃藩置県で、その役も免じられ、東京へ戻りました。
        year: 1871
        card: {head: "1871年", body: 廃藩置県で東京へ}
      # fact: kakeizu-21
      - 語り: 静岡の殿様だったのは、3年ほどでした。
      - 語り: 東京に戻った家達を、待っていた人がいます。
        tone: 疑問
        hook: true
      - 語り: 13代将軍の、妻だった人です。
        hook: true

  # ================================================================ 第3章 天璋院と英国留学
  - title: 千駄ヶ谷の天璋院　英国から帰った16代目　1877年から1884年
    background: {image: paintings/kazu_tenshoin_photo.png, credit: "天璋院の写真（1883年以前。パブリックドメイン）"}
    year: 1877
    lines:
      # fact: kakeizu-22
      - 語り: 13代将軍、家定の妻、天璋院。篤姫の名でも知られる人です。東京に戻った家達を、育てたのは、この天璋院でした。
        portrait: {image: paintings/kazu_tenshoin_photo.png, caption: "天璋院（1883年以前の写真）"}
      # fact: kakeizu-22
      - 語り: 2017年の雑誌、歴史街道によれば、着物は、綿の織物だけ。質素で、厳しい育て方でした。
        portrait: null
      # fact: kakeizu-22
      - 語り: 家達の千駄ヶ谷の屋敷は、のちに、天璋院の、最後の住まいになりました。
      # fact: kakeizu-24
      - 語り: 1877年、明治10年。家達は、イギリスへ渡ります。帰国は1882年。およそ5年の留学でした。
        year: 1877
        card: {head: "1877年〜1882年", body: イギリスへ留学}
      # fact: kakeizu-25
      - 語り: 留学先を、名門のイートン校とする雑誌の記事があります。ただ、国立国会図書館や論文の説明には、学校の名前は出てきません。
      # fact: kakeizu-23
      - 語り: 家達がイギリスにいるあいだに、天璋院は、妻となる人を選んでいました。近衛家の娘、泰子です。天璋院は、泰子を引き取って、教えていた、といいます。
      # fact: kakeizu-23
      - 語り: 1882年、帰国した家達は、泰子と結婚します。
        year: 1882
      # fact: kakeizu-23
      - 語り: その翌年、1883年の11月20日。天璋院は、亡くなりました。葬儀の喪主を務めたのは、家達です。
        tone: しみじみ
        year: 1883
        card: {head: "1883年11月20日", body: 天璋院が亡くなる}
      # fact: kakeizu-26
      - 語り: 1884年。華族令で爵位が定められ、家達は、一番上の位、公爵になりました。1890年に国会が開かれると、貴族院の議員になります。
        year: 1884
        card: {head: "1884年", body: 公爵になる}
      - 語り: 将軍の家の当主は、今度は、議会の椅子に座ることになります。
        tone: 疑問
        hook: true
      - 語り: やがて、その家達のもとに、総理大臣の話が来ます。
        hook: true

  # ================================================================ 第4章 十六代様は総理を断った
  - title: 「十六代様」は総理を断った　1903年から1933年
    background: {image: paintings/kakeizu_iesato_peers.jpg, credit: "貴族院議長 公爵 徳川家達の写真（1940年以前。パブリックドメイン）"}
    year: 1903
    lines:
      # fact: kakeizu-27
      - 語り: 1903年、明治36年。家達は、貴族院の議長に任じられました。4代目の議長です。
        year: 1903
        portrait: {image: paintings/kakeizu_iesato_peers.jpg, caption: "貴族院議長のころの徳川家達"}
        card: {head: "1903年", body: 貴族院議長に}
      # fact: kakeizu-27
      - 語り: 議長を退いたのは、1933年、昭和8年。およそ30年、議長の席にいました。国立公文書館には、議長に任じたときの、裁可書が残っています。
        portrait: null
      # fact: kakeizu-113
      - 語り: 1933年の子ども向けの年鑑は、家達を、こう紹介しています。名議長とうたわれること、三十年。慶喜のあとを継いで、将軍となるはずだった人なので、十六代様という。
      # fact: kakeizu-114
      - 語り: 1925年に、時事新報社が出した、東京の町の探訪記には、人力車の車夫が出てきます。
      # fact: kakeizu-114
      - 語り: 車夫は、妻は、千葉の佐原の近くの、十六島を開いた人の、十八代目の孫だ、と自慢して、こう言うのです。徳川さんだって、十六代様だろう。
      # fact: kakeizu-40
      - 語り: ところが、家達本人は、十六代様と呼ばれるのを、嫌がった、と伝わります。雑誌サライのウェブの連載によれば、家達は、こう話していました。慶喜は、徳川をつぶした人。私は、建てた人だ。
        tone: しみじみ
      # fact: kakeizu-30
      - 語り: 1914年、大正3年。山本権兵衛の内閣が、総辞職します。元老たちは、次の総理大臣に、家達を推しました。
        year: 1914
        card: {head: "1914年", body: 総理大臣に推される}
      # fact: kakeizu-30
      - 語り: もし受けていれば、徳川内閣です。けれど、家達は、それを辞退しました。
        tone: 重い
      # fact: kakeizu-30
      - 語り: 原口大輔さんが、九州大学に出した博士論文は、家達は、組閣の大命を拝辞し、徳川内閣は、未遂に終わった、と書いています。
      # fact: kakeizu-31
      - 語り: 1921年。家達は、アメリカのワシントンで開かれた、海軍の軍縮などを話し合う会議に、日本の全権の1人として、出かけます。
        year: 1921
        card: {head: "1921年", body: ワシントン会議の全権}
      # fact: kakeizu-31
      - 語り: 原口さんによれば、役目は、パーティでの付き合いと、アメリカの世論への働きかけ。原内閣が、貴族院の協力を得るための人選でもありました。
      # fact: kakeizu-32
      - 語り: ところが、このとき、海軍の軍縮をめぐる失言をした、と批判を浴びます。議長が、院の中で公平なのか、と疑われることにもなりました。
      # fact: kakeizu-37
      - 語り: 1923年の関東大震災のあと、助け合いのための、大震災善後会が作られます。会長は、家達。副会長は、渋沢栄一でした。
        year: 1923
      # fact: kakeizu-28
      - 語り: 議長を退くとき、家達を、元老と同じ扱いにする案まで、検討されました。けれど、最後には、その案は変わりました。
      - 語り: 議長の席を降りた家達には、もう1つ、大きな役目が、待っていました。
        tone: 疑問
        hook: true
      - 語り: 東京で開くはずだった、オリンピックです。
        hook: true

  # ================================================================ 第5章 幻の東京五輪
  - title: 幻の東京五輪　16代目の最後の役目　1936年から1940年
    background: {image: paintings/kakeizu_iesato_1922.jpg, credit: "徳川家達（1922年1月7日。米国議会図書館、パブリックドメイン）"}
    year: 1936
    lines:
      # fact: kakeizu-33
      - 語り: 1936年7月、家達は、国際オリンピック委員会の委員に選ばれます。そして、1940年の東京大会の組織委員会ができると、その会長に就きました。
        year: 1936
        card: {head: "1936年", body: 東京大会の組織委員会会長}
      # fact: kakeizu-33
      - 語り: ただ、オリンピックの記録をまとめた、オリンペディアによれば、家達は、国際オリンピック委員会の総会に、一度も出ていません。
      # fact: kakeizu-35
      - 語り: 2020年、香川県丸亀市の美術館で、1通の手紙が見つかった、と報じられました。差出人は、組織委員会の会長、家達。宛先は、画家の猪熊弦一郎です。
        year: 2020
      # fact: kakeizu-35
      - 語り: 大会のポスターとマークを選ぶ、審査員になってほしい、という頼みの手紙でした。
      # fact: kakeizu-34
      - 語り: けれど、1938年の7月15日、政府は、東京大会の取りやめを決めます。
        tone: 重い
        year: 1938
        card: {head: "1938年7月15日", body: 東京大会の取りやめ}
      # fact: kakeizu-33
      - 語り: 家達は、1939年の6月に、国際オリンピック委員会の委員を、辞めました。
        year: 1939
      # fact: kakeizu-39
      - 語り: そして、1940年の6月5日。家達は、亡くなります。満76歳でした。東京で、オリンピックが開かれるはずだった年です。
        tone: しみじみ
        year: 1940
        card: {head: "1940年6月5日", body: 家達が亡くなる（満76歳）}
      # fact: kakeizu-11, kakeizu-39
      - 語り: 1868年の6月に、数えで6歳で継いでから、72年近く。家達は、ずっと、徳川宗家の当主でした。
        figure: {type: stats, title: 16代 家達の72年, items: [[継いだとき, 数え6歳, 1868年6月], [貴族院議長, 約30年, 1903〜1933年], [当主でいた年数, 72年近く, 1940年6月まで]], upto: 3}
      # fact: kakeizu-36
      - 語り: その間に、日本赤十字社の社長や、済生会の会長も、務めています。
        figure: null
      - 語り: 家達が建てた、と言った徳川の家。では、ほかの徳川の家は、明治のあと、どうなったのか。
        tone: 疑問
        hook: true
      - 語り: 江戸城を出た、慶喜の家から、見ていきます。
        hook: true

  # ================================================================ 第6章 もう一つの徳川家（慶喜家・御三家・御三卿）
  - title: 慶喜の家と御三家・御三卿はどうなったのか
    background: {image: paintings/yoshinobu_portrait_late_13.jpg, credit: "晩年の徳川慶喜（大礼服。1913年以前。パブリックドメイン）"}
    year: 1902
    lines:
      # fact: kakeizu-80
      - 語り: 1902年、明治35年。慶喜は、宗家と同じ、公爵になります。そして、宗家とは別に、徳川慶喜家を立てることを、許されました。
        year: 1902
        portrait: {image: paintings/yoshinobu_portrait_late_13.jpg, caption: "晩年の徳川慶喜"}
        card: {head: "1902年", body: 慶喜が公爵に・慶喜家を立てる}
      # fact: kakeizu-81
      - 語り: 慶喜の子どもは、10男11女。家は、七男の慶久、孫の慶光、ひ孫の慶朝へと、継がれていきます。
        portrait: null
      # fact: kakeizu-84
      - 語り: 4代目の慶朝は、広告の会社で、20年、カメラマンを務めたあと、写真家として独立しました。自分で焙煎した豆を、徳川将軍珈琲、として売ってもいました。
      # fact: kakeizu-83
      - 語り: 2017年の9月25日、慶朝は、67歳で亡くなります。
        year: 2017
      # fact: kakeizu-87, kakeizu-85
      - 語り: めいの美喜さんが、2023年に、文春オンラインの取材で明かした書き置きには、あとは美喜ちゃんよろしくね、とありました。
      # fact: kakeizu-85
      - 語り: 2026年の文藝春秋で、美喜さんは、慶喜の墓を守る苦労を、終わりにすべきと考えて、絶家を決めたのは、慶朝叔父だった、と書いています。
        tone: しみじみ
      # fact: kakeizu-86
      - 語り: 2023年1月。その美喜さんが、5代目の当主として、徳川慶喜家を、絶家にする、と発表しました。1902年から、121年でした。
        year: 2023
        card: {head: "2023年1月", body: 慶喜家は家を閉じる}
      # fact: kakeizu-90
      - 語り: 御三家は、どうなったのか。尾張徳川家の義親は、1935年に、徳川美術館を開きます。
        year: 1935
        figure: {type: stats, title: ほかの徳川の家の、明治のあと, items: [[尾張徳川家, 徳川美術館, 木彫り熊の始まり], [紀州徳川家, 南葵文庫, 音楽堂に財産を使う], [水戸徳川家, 大日本史, 1906年に完成]], upto: 1}
      # fact: kakeizu-91
      - 語り: 北海道の八雲の農場で、義親が、スイスの木彫りの熊を手本に、熊を彫らせた。それが、北海道の木彫り熊の始まりとされます。
        figure: {type: stats, title: ほかの徳川の家の、明治のあと, items: [[尾張徳川家, 徳川美術館, 木彫り熊の始まり], [紀州徳川家, 南葵文庫, 音楽堂に財産を使う], [水戸徳川家, 大日本史, 1906年に完成]], upto: 1}
      # fact: kakeizu-94, kakeizu-95
      - 語り: 紀州徳川家を継いだ頼倫は、家達の弟です。自分の屋敷に、図書館の南葵文庫を作り、関東大震災で焼けた東京帝国大学に、その本を寄贈しました。
        figure: {type: stats, title: ほかの徳川の家の、明治のあと, items: [[尾張徳川家, 徳川美術館, 木彫り熊の始まり], [紀州徳川家, 南葵文庫, 音楽堂に財産を使う], [水戸徳川家, 大日本史, 1906年に完成]], upto: 2}
      # fact: kakeizu-96, kakeizu-97
      - 語り: その子の頼貞は、西洋の音楽のための、音楽堂を建て、莫大な財産を、使い果たした、と和歌山県知事は書いています。
      # fact: kakeizu-101
      - 語り: 水戸徳川家は、光圀が始めた歴史の本、大日本史を、明治になっても書き続け、1906年に、完成させました。書き始めてから、249年です。
        figure: {type: stats, title: ほかの徳川の家の、明治のあと, items: [[尾張徳川家, 徳川美術館, 木彫り熊の始まり], [紀州徳川家, 南葵文庫, 音楽堂に財産を使う], [水戸徳川家, 大日本史, 1906年に完成]], upto: 3}
      # fact: kakeizu-105, kakeizu-107
      - 語り: 御三卿の家からも、意外な人が出ています。1910年の12月19日、清水家の徳川好敏は、東京の代々木で、飛行機に乗り、4分間、およそ3000メートルを飛びました。
        figure: null
        year: 1910
        card: {head: "1910年12月19日", body: 清水家の好敏が空を飛ぶ}
      # fact: kakeizu-107
      - 語り: 同じ日には、日野熊蔵も飛び、これが、日本で初めての、公式の飛行とされます。
      # fact: kakeizu-103
      - 語り: 一橋家の徳川宗敬は、1951年、サンフランシスコ平和条約に、日本の全権の1人として、署名しています。
        year: 1951
      - 語り: 閉じた家。財産を手放した家。形を変えて残った家。そのなかで、将軍の家は、どう続いたのか。
        tone: 疑問
        hook: true
      - 語り: 17代目には、思いがけない試練が、待っていました。
        hook: true

  # ================================================================ 第7章 跡継ぎがいなくなった（17代・18代）
  - title: 跡継ぎを失った17代と、会津から来た18代
    background: {image: paintings/kakeizu_katamori.jpg, credit: "松平容保の写真（1893年以前。パブリックドメイン）"}
    year: 1940
    lines:
      # fact: kakeizu-41, kakeizu-42
      - 語り: 17代目は、家達の長男、家正です。1909年に外務省に入り、シドニーの領事、カナダの公使、トルコの大使を務めました。
        card: {head: "17代 家正", body: 外交官から当主へ}
      # fact: kakeizu-45
      - 語り: 妻の正子は、薩摩の殿様、島津忠義の娘です。天璋院と同じ、島津の家から、妻を迎えていました。
      # fact: kakeizu-46
      - 語り: ところが、家正の長男、家英は、東北帝国大学に通っていたころ、病気で、25歳の若さで、亡くなります。宗家の、跡継ぎが、いなくなりました。
        tone: 重い
      # fact: kakeizu-43
      - 語り: 1940年、家達が亡くなり、家正は、17代目として、公爵を継ぎます。
        year: 1940
      # fact: kakeizu-44, kakeizu-77
      - 語り: 戦争が終わった、翌1946年。家正は、貴族院の議長になります。1947年5月、日本国憲法が施行されて、貴族院は、華族の制度とともに、なくなりました。家正は、最後の貴族院議長です。
        year: 1946
        card: {head: "1946年", body: 最後の貴族院議長}
      # fact: kakeizu-76
      - 語り: 徳川記念財団は、それからの当主は、民間人として、家を継いできた、と書いています。
      # fact: kakeizu-50, kakeizu-49
      - 語り: 跡継ぎをどうするか。1945年ごろ、家正が考えたのは、娘の子、孫を、養子に迎えることでした。
      # fact: kakeizu-49, kakeizu-51
      - 語り: 家正の長女、豊子の夫は、松平一郎。会津藩主、松平容保の孫でした。
        portrait: {image: paintings/kakeizu_katamori.jpg, caption: "松平容保（会津藩主）"}
        figure: {type: people, title: 18代 恒孝の家系図, nodes: [[松平容保, 会津藩主], [松平一郎, 容保の孫], [徳川恒孝, 18代], [徳川家正, 17代], [徳川家達, 16代]], edges: [[松平容保, 松平一郎, 孫], [松平一郎, 徳川恒孝, 父], [徳川家達, 徳川家正, 父], [徳川家正, 徳川恒孝, 祖父・養父]]}
      # fact: kakeizu-51
      - 語り: 戊辰戦争で、新政府と戦った会津の殿様。その曾孫が、徳川宗家に入ることになったのです。
        tone: しみじみ
      # fact: kakeizu-49, kakeizu-50
      - 語り: 1940年生まれの、恒孝です。父方からたどれば、容保の曾孫。母方からたどれば、家達の曾孫でした。
        figure: null
      # fact: kakeizu-47, kakeizu-53
      - 語り: 1963年の2月18日、家正が亡くなり、恒孝は、18代目になります。先代が亡くなって継いだので、継ぐための式は、ありませんでした。
        year: 1963
        portrait: null
        card: {head: "1963年", body: 18代 恒孝が継ぐ}
      # fact: kakeizu-69
      - 語り: 恒孝の息子で、今の19代目は、取材で、こう話しています。恒孝の母の豊子は、嫁いだ身で、実家を頼れなかった。恒孝は、子どものころ、ひもじい思いをした、と。
      # fact: kakeizu-54, kakeizu-55
      - 語り: 恒孝は、日本郵船に勤め、2001年に、副社長になります。同じ会社には、加賀の前田家の、当主の家の人も、勤めていました。
        year: 2001
      # fact: kakeizu-70
      - 語り: 2003年、江戸に幕府が開かれて、400年の年。恒孝は、徳川記念財団を作ります。
        year: 2003
        card: {head: "2003年", body: 徳川記念財団ができる}
      # fact: kakeizu-71
      - 語り: 財団が持つ、宗家に伝わった品は、およそ2万点。天璋院や、和宮の品も、その中にあります。
      # fact: kakeizu-57
      - 語り: 恒孝が当主でいたのは、1963年から2022年まで、およそ60年でした。
      - 語り: そして、2023年の正月。徳川宗家は、150年あまりで初めての、ある式を開きます。
        tone: 疑問
        hook: true
      - 語り: その式には、およそ400人が集まりました。
        hook: true

  # ================================================================ 第8章 19代目の今
  - title: 19代目の今　増上寺の「継宗の儀」と、受け継がれた品　2023年から
    background: {image: paintings/kazu_zojoji_snow_hiroshige.jpg, credit: "歌川広重《東都名所 芝増上寺雪中ノ図》（メトロポリタン美術館。パブリックドメイン）"}
    year: 2023
    lines:
      # fact: kakeizu-57, kakeizu-63
      - 語り: 2023年1月1日。恒孝は、82歳で当主を退き、長男の家広が、19代目を継ぎました。
        card: {head: "2023年1月1日", body: 19代 家広が継ぐ}
      # fact: kakeizu-58, kakeizu-59
      - 語り: 家広は、1965年、東京の生まれ。アメリカの大学院で学び、国連の食糧農業機関に勤めたあと、翻訳家、政治と経済の評論家として、本を出してきました。
      # fact: kakeizu-60
      - 語り: 2010年、ある出版社の著者紹介は、すでに家広を、徳川宗家、十九代目にあたる、と書いていました。継ぐ、13年前のことです。
      # fact: kakeizu-62
      - 語り: 2021年からは、父が作った、徳川記念財団の、理事長を務めています。
      # fact: kakeizu-63
      - 語り: 1月29日。東京の増上寺で、継宗の儀が開かれました。徳川家の関係者など、およそ400人が集まった、と報じられています。式は、公開されませんでした。
        card: {head: "2023年1月29日", body: 増上寺で継宗の儀}
      # fact: kakeizu-64
      - 語り: 家広によれば、この形の継宗の儀は、これが初めてです。17代と18代は、先代が亡くなって継いだので、式がなかった。16代のときは、維新の混乱で、式を開くどころではなかった、と。
      # fact: kakeizu-65
      - 語り: 式のあとの会見で、家広は、改めて、責任の重さに、身が引き締まる思いだ、と話しました。
      # fact: kakeizu-66
      - 語り: 当主の、一番の務めは何か。そう聞かれて、家広は、東照宮の祭事や神事で、司祭を務めることでしょうか、と答えています。
      # fact: kakeizu-68
      - 語り: 子どものころ、人形劇で、家康が悪役だったのを見て、ご先祖さまは、悪い人だったのかな、と思った。そんな話も、取材で明かしています。
      # fact: kakeizu-115
      - 語り: 大正の時代に出た、茶道具の名品を集めた本、大正名器鑑には、抹茶を入れる小さな器、茶入の、初花肩衝が、公爵、徳川家達の持ち物として、載っています。
      # fact: kakeizu-115, kakeizu-71
      - 語り: その初花肩衝は、今、国の重要文化財です。徳川記念財団は、おもな所蔵品の筆頭に、この初花肩衝を挙げています。
        card: {head: "初花肩衝", body: 家達の時代から今の財団へ}
      # fact: kakeizu-74
      - 語り: 財団の品は、日光の輪王寺の宝物殿や、久能山東照宮の博物館で、見ることができます。
      # fact: kakeizu-73
      - 語り: 2023年3月、財団は、浜松に本部を置くことを決め、浜松市は、財団の品を中心にした、展示と収蔵の施設を作る方針を、発表しました。
      # fact: kakeizu-76
      - 語り: 将軍の家は、家康から数えて、19代。1868年から、158年が、たちました。
        figure: {type: numberline, title: 徳川宗家の当主（家康を初代として数える）, items: [[徳川慶喜, 15, 15代], [徳川家達, 16, 16代], [徳川家正, 17, 17代], [徳川恒孝, 18, 18代], [徳川家広, 19, 19代]], unit: 代, focus: 徳川家広}
      - 語り: 最初の問いに、戻ります。
        figure: null
        hook: true
      - 語り: 将軍でなくなった徳川の家は、どうやって、続いてきたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（冒頭の問いに戻る。余韻の一文）
  - title: まとめ：1868年から19代目まで　将軍の家は、どうやって続いたのか
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影 江戸城の堀（1860年代。パブリックドメイン）"}
    lines:
      # fact: kakeizu-110, kakeizu-112, kakeizu-111
      - 語り: 幼い亀之助を、跡継ぎにと望んだのは、家茂と、天璋院でした。家の存続を願う書状を書いたのは、和宮でした。
        tone: しみじみ
      # fact: kakeizu-16, kakeizu-22
      - 語り: 領地は、10分の1になりました。その子を、東京で育てたのも、天璋院です。
      # fact: kakeizu-27, kakeizu-30, kakeizu-42, kakeizu-54, kakeizu-70
      - 語り: 将軍の家は、殿様から、議長へ。外交官へ。そして、会社員と、財団へと、時代ごとに、役目を替えてきました。
      # fact: kakeizu-46, kakeizu-51
      - 語り: 跡継ぎが絶えかけたときは、娘の子、会津の殿様の血を引く孫に、家をつなぎました。
      # fact: kakeizu-86, kakeizu-63
      - 語り: 2023年、慶喜が立てた家は、自ら幕を下ろし、将軍の家は、今の形では初めての式で、19代目を迎えました。
      - 語り: 将軍の座を失ったあとの徳川の家を支えたのは、将軍ではなかった人たちと、役目を替え続けた当主たちでした。
        tone: しみじみ
        pause: 0.8
      - 語り: 6歳の当主から、19代目まで。家系図の線は、1868年の春の、江戸城から、今に、つながっています。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。

