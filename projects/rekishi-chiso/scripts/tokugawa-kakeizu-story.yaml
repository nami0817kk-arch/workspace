# 冒頭10秒＝「将軍は15代で終わった。けれど徳川の家は終わっておらず、今の当主は19代目」（kakeizu-63・76）。
# 記録の食い違い：①家達が継いだときの年齢（函館市史・県立図書館「数え6歳」／静岡新聞2025「5歳」／満では4歳）
#   ②70万石の中身（陸奥の一部→9月4日に三河へ。「駿河・遠江」と書く資料と「駿河・遠江・三河」と書く資料）③留学先（イートン校と書く雑誌／論文・公的機関には学校名なし）
# 事実は事実カード（dev/output/rekishi-chiso/research/徳川将軍家_facts_20261105.yaml、kakeizu-10〜）にあるものだけ。行の上に `# fact: kakeizu-NN`。
