# 仕組みの確認用の見本（マリー・アントワネットの回の冒頭だけ）。
# 本番の台本は、コンセプト確定後に別ファイルで書く。
title: マリー・アントワネットは本当に悪女だったのか
series: 悪女と呼ばれた女たち
timeline:
  start: 1755
  end: 1793
  events: [[1755, 誕生], [1770, 結婚], [1774, 王妃に], [1785, 首飾り事件], [1789, 革命], [1793, 処刑]]
shorts:
  s1: {title: "「パンがなければ」／実は言っていない"}   # ／で改行

sections:
  - title: あの言葉は、言っていない
    background: {image: paintings/versailles_patel_1668.jpg, credit: "ピエール・パテル《ヴェルサイユ宮殿》1668年"}
    portrait: {image: paintings/marie_vigee_1778.jpg, caption: "ヴィジェ＝ルブラン画（1778年）"}
    lines:
      - 語り: 「パンがなければ、お菓子を食べればいいじゃない」。
        tone: 強調
        short: s1
      - 聞き: マリー・アントワネットの、あの有名なセリフですよね。
        tone: 明るい
        short: s1
      - 語り: そう。誰もが知っている一言です。今日はここが《地表》。いちばん上に積もっている層です。
      - 聞き: 地表？
        tone: 疑問
      - 語り: この番組では、毎回、みんなが知っている通説から始めて、その下を掘っていきます。で、さっそくですが、この言葉。彼女が言ったという記録は、《どこにも》残っていません。
        short: s1
      - 聞き: え、言ってないんですか？
        tone: 驚き
        short: s1
      - 語り: よく似た話が最初に文字になったのは、思想家ルソーの自伝『告白』です。
        portrait: {image: paintings/rousseau_latour.jpg, caption: "ルソー（ラ・トゥール画）"}
        card: {head: "ルソー『告白』", body: "1760年代半ばに執筆"}
        short: s1
      - 語り: そこに「ある身分の高い女性」が、パンがないならブリオッシュを食べればいい、と言った、と書かれている。
        short: s1
      - 聞き: へえ〜、出どころはルソーなんだ！
        tone: 驚き
      - 聞き: ブリオッシュ。お菓子じゃなくて、甘いパンですね。
        tone: 納得
      - 語り: そうです。しかもルソーがここを書いたころ、マリー・アントワネットは《まだ10歳にもならない子ども》で、オーストリアのウィーンにいました。
        portrait: {image: paintings/marie_vigee_1778.jpg, caption: "ヴィジェ＝ルブラン画（1778年）"}
        card: {head: "1760年代半ば", body: "彼女はまだウィーンの少女"}
        short: s1
      - 聞き: えっ、子ども！？
        tone: 驚き
        short: s1
      - 聞き: じゃあ、別の誰かの話が、あとから彼女の言葉にされちゃったんですか？
        tone: 疑問
        short: s1
      - 語り: そういうことになります。彼女は、実際にしたことよりも、「いかにも言いそうなこと」で裁かれた王妃でした。
        tone: しみじみ
        card: null
        short: s1
      - 聞き: うわぁ……それは、ちょっとかわいそうかも。
        tone: しみじみ
      - 聞き: でも、贅沢だったのは本当なんですよね？ドレスとか、宝石とか。
        tone: 疑問
      - 語り: お金を使ったのは本当です。ただ、比べる相手が大事でね。たとえば、のちに彼女の名前と結びつけられる、ある首飾り。今のお金に置き換えると、いくらぐらいだと思います？
        tone: 疑問
      - 聞き: うーん、何億円とか？
      - 語り: 当時のパリの日雇いの人の日当で数えると、休まず働いて、ざっと《3000年分》です。
        tone: 強調
        year: 1785
        card: {head: "首飾りの値段", body: "日雇いの日当の約3000年分"}
      - 聞き: さ、さんぜんねん！？
        tone: 驚き
      - 語り: ところが彼女は、その首飾りを買っていないんです。それどころか、一銭も得をしていない。
      - 聞き: え、どういうこと？
        tone: 驚き
      - 語り: 今日は、ウィーンに生まれた一人の少女が、フランスの王妃になって、37歳で断頭台に上るまでを掘っていきます。
        year: 1755
        card: null
      - 語り: そして最後に、いちばん底の層。なぜ、人々の怒りは、国王でも大臣でもなく、彼女に集まったのか。
        tone: 重い
      - 聞き: 作業しながらでも、移動中でも、ラジオみたいに聞いてくださいね。
        tone: 明るい
      - 語り: では、掘っていきましょう。
        tone: 明るい
      - 聞き: はーい！
        tone: 明るい
