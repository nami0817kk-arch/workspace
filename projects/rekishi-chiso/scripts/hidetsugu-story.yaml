  # ================================================================ 第3章 命令はあったのか（矢部説と勢田説）
  - title: 秀吉は、本当に切腹を命じたのか　7月15日 青巌寺
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
    # AI絵：the interior of a Japanese mountain temple hall at early morning, sliding doors painted with willow trees and herons, empty room, soft light through paper screens, painterly, no people
    year: 1595
    lines:
      # 川角太閤記（勢田 2015）
      # fact: hidetsugu-11
      - 語り: 『川角太閤記』は、その朝のことを、時刻まで書いています。7月15日の「五ツ時分」。今の午前7時前後に、秀吉からの命令が伝えられた、と。
        card: {head: "川角太閤記", body: 15日の五ツ時分に命令}
      # fact: hidetsugu-11
      - 語り: この話のもとは、その場にいて生き残った、秀次の近くに仕えた者からの、聞き書きだ、といわれています。
      # 御湯殿上日記 7月16日（勢田 2015 補論Ⅰ）
      # fact: hidetsugu-08
      - 語り: 翌16日の『御湯殿上日記』は、こう記します。「関白殿、昨日十五日の四つ時に、御腹切らせられ候よし申す」。
        tone: 重い
        card: {head: "御湯殿上日記 7月16日", body: 15日の四つ時に}
      # fact: hidetsugu-09
      - 語り: 四つ時は、今の午前10時ごろ。秀次は、その時刻に、腹を切りました。
      - 語り: では、その命令は、いつ、どこから出たのか。
        tone: 疑問
      # 通説の形（渡辺世祐 1919 p.74）
      # fact: hidetsugu-01
      - 語り: 100年あまり前、大正8年、1919年に出た、渡辺世祐の『豊太閤と其家族』は、こう書いています。
      # fact: hidetsugu-01
      - 語り: 15日、太閤の使者として、福島正則、福原、池田が高野山に着いた。そして木食応其を呼び、秀次に切腹を命じる太閤の沙汰を伝えた、と。
        card: {head: "渡辺世祐 1919年", body: 15日に使者が切腹の沙汰を伝えた}
      # 増補大垣城主歴代記（1921 p.16）
      # fact: hidetsugu-01
      - 語り: 1921年の『増補大垣城主歴代記』も、秀次は、7月8日に職を辞して高野山の青巌寺に押し込められ、15日、秀吉公の命によって自ら命を絶った、と記します。
      # 続撰清正記（国史叢書 1916 p.70）
      # fact: hidetsugu-01
      - 語り: 江戸時代の『続撰清正記』では、奉行たちが名を連ねた書状を木食応其に送り、秀次に切腹のことを告げさせた、となっています。
      - 語り: 使者が来て、命令を伝え、秀次が腹を切る。わたしたちがよく知る筋書きは、こうした本の中で、形になっていきました。
        tone: しみじみ
      - 語り: では、その筋書きのもとになった命令状は、どこにあるのか。
        tone: 疑問
      # 甫庵太閤記の13日付 奉行連署状（古事類苑 1914 が引く）
      # fact: hidetsugu-02
      - 語り: 江戸時代に書かれた『甫庵太閤記』には、7月13日の日付で、奉行たちが名を連ねた、切腹の命令状が載っています。
        card: {head: "甫庵太閤記", body: 13日付の命令状}
      # fact: hidetsugu-02
      - 語り: その一節は、「秀次公、御謀叛の条々、少しも疑い無きにより、御切腹を進めらるべきの旨に候」。謀反は疑いない、だから切腹を、という文面です。
        tone: 重い
      # 矢部 2016（東洋経済）
      # fact: hidetsugu-02
      - 語り: ところが、矢部健太郎さんによれば、この命令状は、ほかの写しが確認されていません。出てくるのは、『甫庵太閤記』の中だけです。
        tone: 強調
      # fact: hidetsugu-02
      - 語り: 矢部さんは、これを、甫庵が江戸時代に「創作」したもの、と見ています。
      # 勢田も「虚構」（hidetsugu-10）
      # fact: hidetsugu-10
      - 語り: 驚くのは、矢部さんの説に反対する勢田さんも、この命令状については、史料として使えないことは明白だ、と書いていることです。
        tone: 強調
        background: {image: paintings/nene_fushimi_earthquake_yoshitoshi.jpg, credit: "月岡芳年《伏見大地震桃山御殿図》1885年（国立国会図書館蔵。伏見城を描いた後世の絵）"}
      # fact: hidetsugu-10
      - 語り: 『甫庵太閤記』は、3人の使者がそろって高野山へ向かった、と書きます。けれど実際には、福原は12日、福島と池田は13日に、別々に出ていました。
        card: {head: "3人の使者", body: 12日と13日に別々に出発}
      - 語り: 命令状は、ふたりとも信じない。それでも、ふたりの結論は、正反対です。
        tone: しみじみ
      # 矢部説（宮本 2017・東洋経済 2016）
      # fact: hidetsugu-06
      - 語り: 矢部健太郎さんは、2013年の論文と、2016年の本『関白秀次の切腹』で、こう考えました。秀吉には、秀次に腹を切らせる意思はなかった。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "矢部健太郎", body: 秀吉に切腹させる意思はなかった}
      # fact: hidetsugu-06
      - 語り: 秀次は、身の潔白を示すために、自ら腹を切った。切腹には、「究極の請願の形態」という一面があり、自分から行う例があった、と矢部さんは書いています。
      # fact: hidetsugu-06
      - 語り: 秀吉にとっては、想定外の死。政権はそれを取り繕うために、「天下の大罪人、秀次」という謀反人の姿を作り上げ、妻子の処刑で、幕を引いた。
        tone: 重い
      # 勢田説（2015）
      # fact: hidetsugu-07
      - 語り: これに対して、勢田さんは、2015年の論文で、雪冤のための自刃、つまり、無実を晴らすために自ら命を絶ったという説は、うなずけない、と書きました。
        card: {head: "勢田勝郭 2015年", body: 「首肯できない」}
      # fact: hidetsugu-07
      - 語り: 勢田さんの見方では、8日の時点で、殺す気はなかった。けれど、13日までに、秀吉の方針が変わった。そして15日、秀次は、秀吉の命令で腹を切った。
      # 食い違い①：表で3点
      # fact: hidetsugu-08
      - 語り: ふたりの読みが、はっきり分かれるところが、3つあります。まず、冒頭の「むしちゆへ」です。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 1}
      # fact: hidetsugu-08
      - 語り: 『御湯殿上日記』の、「むしちゆへ、かくの事候のよし申すなり」。矢部さんは、無実を証明するために、こうなった、と読みます。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 1}
      # fact: hidetsugu-08
      - 語り: 勢田さんは、無実なのに、こんなことになった、と人々が言っている、という伝え聞きだ、と読みます。同じ一言が、まったく逆の意味になるんです。
        tone: 強調
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 1}
      # fact: hidetsugu-09
      - 語り: ふたつめは、時間です。矢部さんは、13日に出た命令を、15日の午前10時までに高野山へ届けるのは、物理的に不可能だ、とします。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 2}
      # fact: hidetsugu-09
      - 語り: 勢田さんは、伏見を出た使者は、14日の午前中には、余裕で高野山に着ける、と反論します。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 2}
      # fact: hidetsugu-05, hidetsugu-11
      - 語り: みっつめは、どの記録を重んじるか。矢部さんの本は、12日の条々の「住まわせる」を重く見ます。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 3}
      # fact: hidetsugu-11
      - 語り: 勢田さんは、その場にいた者の聞き書きといわれる『川角太閤記』の、15日の朝に命令が届いた、という一文を重く見ます。
        figure: {type: table, title: 秀次の切腹　ふたつの説, cols: [矢部健太郎, 勢田勝郭], rows: [[「むしちゆへ」, 無実を示すため切腹, 無実なのにと人が言う], [13日の命令, 15日朝に届かない, 14日の午前に着く], [重んじる記録, 12日の条々, 川角太閤記の聞き書き]], upto: 3}
      # fact: hidetsugu-07
      - 語り: 2021年には、藤井讓治さんも、「秀次切腹をめぐって」という論文を出しています。答えは、まだ一つに決まっていません。
        figure: null
        tone: しみじみ
      # 【想像3】秀次。記録：15日の朝、腹を切った（hidetsugu-01・08）。気持ちの言葉だけ（自らか命令か、どちらにも寄せない）
      - 人物: 「……もはや、これまで」
        who: 秀次想像
        imagined: true
        tone: 重い
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
      - 語り: 命令で切ったのか。自ら切ったのか。どちらにしても、秀次の死のあと、政権は、秀次を「謀反人」として扱っていきます。
        portrait: null
        hook: true
      - 語り: その姿を、いちばん強く人々に焼きつけたのが、ひとつの呼び名でした。
