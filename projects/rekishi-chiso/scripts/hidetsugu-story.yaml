# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  文禄4年7月12日。秀吉は、高野山にあてて、甥の豊臣秀次を「高野山に住まわせる」ための決まりを書きました。供は15人まで、刀も脇差も帯びさせない。
  その3日後、関白だった秀次は、高野山の青巌寺で腹を切りました。
  なぜ秀次は、高野山で腹を切ったのか。秀吉は、本当に切腹を命じたのか。
  この動画でわかること
  ・7月12日付の「高野住山」の決まりと、14日に使者が伝えた「仲直り」の言葉
  ・切腹の命令状が『甫庵太閤記』にしか出てこないわけと、矢部健太郎さん・勢田勝郭さんの正反対の読み
  ・「殺生関白」という呼び名の出どころと、近江八幡に残る秀次の町
  ・「一宇も残さず」壊された聚楽第、1611年に建った京都の寺、2024年に重要文化財になった建物
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（秀吉の条々、『兼見卿記』『御湯殿上日記』『川角太閤記』『甫庵太閤記』など）を語りで示してから読んでいます。

en:
  title: "Toyotomi Hidetsugu: Did Hideyoshi Really Order His Seppuku?"
  description: |-
    On the 12th day of the 7th month of Bunroku 4 (1595), Hideyoshi sent rules to Mount Koya for his nephew Hidetsugu to "live on the mountain": no more than fifteen attendants, and no swords.
    Three days later Hidetsugu, the former Kampaku, took his own life at Seiganji on Mount Koya.
    Why did he die there, and did Hideyoshi really order it?
    In this video you will learn:
    - The rules of the 12th and the envoy's promise of reconciliation on the 14th
    - Why the seppuku order appears only in the Hoan Taikoki, and two historians who read the same diary line in opposite ways
    - Where the nickname "the Killing Regent" came from, and the town of Omi-Hachiman that Hidetsugu founded
    - Jurakudai torn down "without leaving a single building", a Kyoto temple founded in 1611, and a hall designated an Important Cultural Property in 2024
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Did Hidetsugu Die on Mount Koya? The Rules of the 12th"
    - "Why Did the Regent Leave Fushimi for Mount Koya? July 1595"
    - "Did Hideyoshi Mean for Him to Live on the Mountain? The Rules and the Envoy"
    - "Did Hideyoshi Really Order the Seppuku? Two Historians, One Diary Line"
    - "Why Was He Called the Killing Regent? Omi-Hachiman"
    - "What Was Erased, and What Remained? Jurakudai, Zuisenji and Zuiryuji"

