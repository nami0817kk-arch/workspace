sections:
  # ================================================================ 導入（冒頭 約1分40秒）
  - title: なぜ秀次は高野山で腹を切ったのか　文禄4年7月12日の条々
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
    # AI絵：Mount Koya in summer 1595, a quiet Buddhist temple compound among tall cedar trees in mountain mist, seen from far away, muted colors, painterly, no people
    year: 1595
    lines:
      # 0〜10秒：知らない事実（切腹の3日前の「住まわせる」条々）
      # fact: hidetsugu-05
      - 語り: 秀次が高野山で腹を切る3日前。秀吉は、秀次を「高野山に住まわせる」ための、決まりを書いていました。
        tone: 重い
        card: {head: "切腹の3日前", body: 「高野山に住まわせる」}
      # fact: hidetsugu-05
      - 語り: 供の者は、15人まで。刀も脇差も、帯びさせない。山の出入り口には、番を置く。
        card: {head: "7月12日の条々", body: 供15人・刀を帯びない}
      - 語り: それは、死なせる相手への言葉ではなく、山で暮らし続ける人のための、決まりでした。
        tone: しみじみ
      # fact: hidetsugu-01
      - 語り: けれど、文禄4年、1595年の7月15日。秀吉の甥で、関白にまでなった豊臣秀次は、高野山の青巌寺で、腹を切りました。
        tone: 重い
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
        card: {head: "文禄4年7月15日", body: 高野山 青巌寺}
      # fact: hidetsugu-02
      - 語り: 秀吉が、切腹を命じた。そう語られてきました。けれど、その命令状の写しは、見つかっていません。
        tone: 強調
      # fact: hidetsugu-02
      - 語り: 歴史学者の矢部健太郎さんは、2016年の記事で、その命令は、江戸時代の『甫庵太閤記』に記されているだけだ、と書いています。
        portrait: null
        card: {head: "切腹の命令状", body: 『甫庵太閤記』にだけ}
      - 語り: なぜ秀次は、高野山で腹を切ったのか。秀吉は、本当に、切腹を命じたのか。
        tone: 疑問
        pause: 0.8
      # fact: hidetsugu-08
      - 語り: 手がかりのひとつは、切腹の翌日、宮中の『御湯殿上日記』に書かれた、「《むしちゆへ》」という、短い言葉です。
        tone: 強調
        card: {head: "御湯殿上日記", body: 「むしちゆへ」}
      # fact: hidetsugu-08
      - 語り: この同じ一言を、ふたりの研究者が、正反対に読んでいます。
      # その後の予告（第5章）
      # fact: hidetsugu-17
      - 語り: 秀次がいなくなったあと、京都の聚楽第は、「一宇も残さず」壊されました。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        card: {head: "聚楽第", body: 「一宇も残さず」}
      # fact: hidetsugu-23
      - 語り: そして京都の三条には、今も、49の五輪塔が並ぶ寺があります。
        background: {image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg, credit: "歌川広重《京師 三条大橋》1833年ごろ"}
        card: {head: "京都 三条", body: 49の五輪塔}
        # AI絵：rows of small weathered stone five-tiered gorinto pagodas in a quiet temple yard in Kyoto, soft rain, muted colors, painterly, no people
      # fact: hidetsugu-04
      - 語り: 秀次に付けられた、「殺生関白」という悪い呼び名にも、はっきりした出どころがあります。
      # 約束の1文
      - 語り: これは、秀吉の跡継ぎとして関白になった男が、高野山で迎えた最後の数日の、ひとつの「なぜ」の記録です。
        tone: しみじみ
        pause: 0.6
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
      # 橋渡し
      - 語り: 話は、その一週間ほど前。伏見から始まります。
        pause: 0.6

  # ================================================================ 第1章 失脚（文禄4年7月8日〜13日）
  - title: 関白は、なぜ伏見から高野山へ向かったのか　文禄4年7月
    background: {image: paintings/nene_fushimi_earthquake_yoshitoshi.jpg, credit: "月岡芳年《伏見大地震桃山御殿図》1885年（国立国会図書館蔵。伏見城を描いた後世の絵）"}
    year: 1595
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 豊臣秀次は、秀吉の姉の子です。子のいなかった秀吉の跡を継いで、関白の位に就いていました。
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
      - 語り: その秀次に、謀反の疑いがかけられます。
        tone: 重い
      # 大垣城主歴代記（1921）の記述・勢田 2015
      # fact: hidetsugu-01, hidetsugu-07
      - 語り: 文禄4年の7月8日。秀次は、伏見から、紀伊の高野山へ向かいました。入ったのは、山の寺の、青巌寺です。
        card: {head: "7月8日", body: 伏見から高野山へ}
        figure: {type: map, title: 文禄4年7月 秀次の道のり, bounds: [135.2, 136.2, 34.0, 35.2], places: [[伏見, 135.77, 34.93], [高野山, 135.59, 34.21]], route: [伏見, 高野山], note: 7月8日に伏見を発つ}
        # AI絵：a small group of travelers in plain clothes climbing a steep mountain path through tall cedar forest toward Mount Koya, summer 1595, seen from far away, muted colors, painterly, no faces
      # 兼見卿記 7月9日（勢田 2015 注16）
      # fact: hidetsugu-15
      - 語り: その翌日、7月9日。公家の吉田兼見は、日記『兼見卿記』に、こう書きました。「《御謀反治定》」。謀反は、決まった、と。
        figure: null
        tone: 重い
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        card: {head: "兼見卿記 7月9日", body: 「御謀反治定」}
      # fact: hidetsugu-15
      - 語り: 続けて、仲間の者が何人もいて、これから取り調べがある、とも。そして、大名たちが、恐れおののいている、と。
      # 御湯殿上日記 7月13日（勢田 2015）
      # fact: hidetsugu-15
      - 語り: 一方、宮中の『御湯殿上日記』は、7月13日、秀吉のことを、「御わづらひ」と書いています。
        card: {head: "御湯殿上日記 7月13日", body: 秀吉は「御わづらひ」}
      - 語り: 謀反が決まった、と書く日記と、秀吉が思いわずらっている、と書く日記。同じ数日を、ふたつの日記は、違う温度で書きとめていました。
        tone: しみじみ
      # 銀5000枚（勢田 2015 注28・矢部書の目次）
      # fact: hidetsugu-13
      - 語り: そして、もうひとつ。秀次は、失脚の直前に、秀吉に断りなく、《銀5000枚》を、朝廷の側に差し出していました。
        tone: 強調
        card: {head: "銀5000枚", body: 秀吉に断りなく朝廷へ}
      # fact: hidetsugu-13
      - 語り: 『御湯殿上日記』に、この銀のことが初めて出てくるのは、7月12日。秀次が、高野山に入ったあとのことです。
      - 語り: 秀吉の知らないところで、関白が、朝廷に大金を差し出していた。そのことが、どう受け止められたのか。
        tone: 疑問
      # 勢田 2015
      # fact: hidetsugu-07
      - 語り: ただ、2015年に、奈良工業高等専門学校の研究紀要に論文を出した勢田さんは、7月8日に高野山行きを命じた時点では、秀吉に、秀次を殺す気はなかった、と見ています。
        background: {image: paintings/nene_fushimi_earthquake_yoshitoshi.jpg, credit: "月岡芳年《伏見大地震桃山御殿図》1885年（国立国会図書館蔵。伏見城を描いた後世の絵）"}
        card: {head: "勢田勝郭 2015年", body: 8日の時点で殺す気はなかった}
      - 語り: 命を取るつもりなら、遠い山に送る必要は、ありません。秀次は、山に送られたんです。
        tone: しみじみ
      - 語り: 伏見から高野山までは、山道を越える長い旅です。関白だった人が、わずかな供を連れて、その道を登っていきました。
        tone: しみじみ
      # 【想像1】秀次。記録：7月8日に伏見から高野山へ（hidetsugu-01・07）。気持ちの言葉だけ（どちらの説にも寄せない）
      - 人物: 「……なぜ、こうなった」
        who: 秀次想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
      - 語り: 秀次が山に入って、4日後。秀吉は、高野山にあてて、1通の文書を出します。
        portrait: null
        hook: true
      - 語り: そこに書かれていたのは、秀次の、山での暮らし方でした。
        tone: 重い
        hook: true

  # ================================================================ 第2章 7月12日の条々と14日の使者
  - title: 秀吉は、秀次を高野山に住まわせるつもりだったのか　7月12日の条々
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
    # AI絵：an old Japanese document of numbered articles written in brush calligraphy on washi paper, lying on a dark wooden desk in a mountain temple, close-up, soft light, no readable text
    year: 1595
    lines:
      # 宮本義己 2017（矢部書の紹介）・勢田 2015
      # fact: hidetsugu-05
      - 語り: 7月12日の日付で、秀吉は、高野山の木食応其にあてて、箇条書きの決まりを出しました。応其は、秀吉が頼りにしていた高野山の僧です。
        card: {head: "7月12日", body: 秀吉から木食応其へ}
      # fact: hidetsugu-05
      - 語り: 写しは、『佐竹家旧記』と『南行雑録』に残っています。その書き出しは、「秀次を、高野山に住まわせる」。
        tone: 強調
        card: {head: "佐竹家旧記・南行雑録", body: 「高野山に住まわせる」}
      # fact: hidetsugu-05
      - 語り: 続いて、秀次のそばに置く者の数です。原文は、「召し使い候者、侍十人。このうち坊主、台所人ども、下人、小者、下男ども五人。都合十五人たるべく候」。
        figure: {type: stats, title: 7月12日の条々, items: [[供の者, 15人まで, 侍10人とほか5人], [刀と脇差, 帯びない, 秀次も供も], [山の出入り口, 番を置く, 出入りを見る]], upto: 1}
      # fact: hidetsugu-05
      - 語り: 侍が10人と、身の回りの者が5人。あわせて、15人です。
