  # ================================================================ 第4章 「殺生関白」の出どころと近江八幡
  - title: 秀次は、なぜ「殺生関白」と呼ばれたのか　甫庵太閤記の落書
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    year: 1595
    lines:
      # 甫庵太閤記（正保3年刊本）
      # fact: hidetsugu-04
      - 語り: 「殺生関白」。この呼び名は、どこから来たのか。
        tone: 疑問
      # fact: hidetsugu-04
      - 語り: 江戸時代の『甫庵太閤記』は、そのころ、京の町の辻々に、夜ごと落書が出た、と書きます。
        card: {head: "甫庵太閤記", body: 京の辻々に夜ごと落書}
      # fact: hidetsugu-04
      - 語り: 落書の文句は、「院の御所、手向けのための狩りなれば、これを殺生関白という」。
        tone: 重い
        card: {head: "落書", body: 「せっしょう関白」}
      # 本朝通鑑・渡辺世祐 1929
      # fact: hidetsugu-04
      - 語り: 江戸幕府の儒者、林羅山と林春斎の『本朝通鑑』は、殺生と摂政は、音が近い、と書き添えました。摂政と並ぶ関白の位に、殺生の字を重ねた、言葉遊びです。
      # 続撰清正記（国史叢書 1916）
      # fact: hidetsugu-04
      - 語り: 別の江戸時代の書物、『続撰清正記』は、鳥や獣を殺す狩りを好んだので、世の人が殺生関白と呼んだ、とします。
      # 絵本太閤記（明治刊本 1884 p.322）
      # fact: hidetsugu-04
      - 語り: 明治17年、1884年に刷られた『絵本太閤記』では、一条の辻に札が立ち、先帝への手向けのための狩りなれば、これや殺生関白、と書かれていた、という形になっています。
      # 渡辺世祐『稿本石田三成』1929
      # fact: hidetsugu-04
      - 語り: 1929年、渡辺世祐は『稿本石田三成』で、世の人が殺生関白と呼んだ、殺生は摂政と音が通じるからだ、と書きました。
      # 小和田哲男 2002（書名）
      # fact: hidetsugu-04
      - 語り: 2002年には、小和田哲男さんの本が、『豊臣秀次　「殺生関白」の悲劇』という題で出ています。この呼び名は、400年をこえて、秀次の名に付いて回ってきました。
      - 語り: 辻の落書から、江戸の書物へ、そして明治の本へ。呼び名は、書き写されるたびに、少しずつ形を整えていきました。
        tone: しみじみ
      # 矢部 2016
      # fact: hidetsugu-04
      - 語り: 矢部健太郎さんは、2016年の記事で、秀次の「殺生関白」も、「信頼すべき根拠のない作り話であった」と書いています。
        tone: 強調
        card: {head: "矢部健太郎 2016年", body: 「根拠のない作り話」}
      # 今泉 2026
      # fact: hidetsugu-21
      - 語り: 古城探訪家の今泉慎一さんも、2026年の記事で、秀次の悪い行いの話は、あくまで後世の創作だ、としています。
      - 語り: では、作り話の外に残る秀次は、どんな人だったのか。その手がかりが、近江にあります。
        tone: 疑問
      # 近江八幡（観光庁の解説文 2022・2024）
      # fact: hidetsugu-19
      - 語り: 1585年。まだ若い秀次は、近江の八幡山に城を築き、その麓に、町を開きました。今の、滋賀県近江八幡市です。
        background: {image: paintings/mitsunari_omi_hakkei_seta_hiroshige.jpg, credit: "歌川広重《近江八景 瀬田夕照》1857年ごろ（メトロポリタン美術館蔵）"}
        card: {head: "1585年", body: 八幡山城の城下町を開く}
        figure: {type: map, title: 1585年 秀次の町, bounds: [135.6, 136.4, 34.8, 35.4], places: [[近江八幡, 136.09, 35.13], [安土, 136.14, 35.16], [京都, 135.77, 35.01]], note: 八幡山の麓に城下町}
      # fact: hidetsugu-19
      - 語り: 秀次は、商人を広く呼び集め、税を免じ、自由に商いができる町にしました。そして、町に、八幡堀を掘らせます。
        figure: null
        card: {head: "八幡堀", body: 秀次が掘らせた}
        # AI絵：a calm canal lined with old white-walled merchant storehouses and willow trees in Omi-Hachiman, a small wooden boat, early morning mist, painterly, no people
      # 今泉 2026
      # fact: hidetsugu-21
      - 語り: 城下には、安土の町をにぎわせていた商人たちを移した、といわれています。
      # fact: hidetsugu-21
      - 語り: 近江八幡の側からは、整然とした城下町にこそ、秀次の本当の資質が見える、という評価があります。
        tone: しみじみ
      - 語り: 殺生関白と呼ばれた人が、商人の町を開いた人でもあった。ふたつの姿は、どうにも重なりません。
        tone: しみじみ
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
      # 【想像4】秀次。記録：1585年に八幡山城の城下町を開いた（hidetsugu-19）。気持ちの言葉だけ
      - 人物: 「……よい町に、なれ」
        who: 秀次想像
        imagined: true
        tone: しみじみ
      - 語り: けれど、秀次の死のあと、秀次にまつわるものは、次々と消されていきます。
        portrait: null
        hook: true
      - 語り: 消されたのは、人だけではありませんでした。
        tone: 重い
        hook: true

  # ================================================================ 第5章 その後（消されたもの・残ったもの）
  - title: まとめ：秀次のあと、何が消され、何が残ったのか　三条河原と聚楽第
    background: {image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg, credit: "歌川広重《京師 三条大橋》1833年ごろ"}
    year: 1595
    lines:
      # 兼見卿記（勢田 2015 注24）。方法は言わない
      # fact: hidetsugu-16
      - 語り: 処罰は、秀次ひとりで終わりませんでした。『兼見卿記』によれば、秀次の側近だった木村重茲の家族も、7月の下旬に、命を奪われています。
        tone: 重い
      # 食い違い②：妻子の処刑の日付と人数（勢田 2015・日本歴史地名大系・矢部書の目次）
      # fact: hidetsugu-03, hidetsugu-25
      - 語り: そして、秀次の妻と子どもたち。勢田さんの論文は、8月2日、妻妾三十人あまりが、その子とともに、京都の三条河原で命を奪われた、と書きます。
        card: {head: "8月2日", body: 三条河原}
      # fact: hidetsugu-25
      - 語り: ところが、この日付も、記録によって違います。
        tone: 強調
        figure: {type: stats, title: 秀次の妻子の処刑　日付の食い違い, items: [[勢田勝郭 2015年, 8月2日, 妻妾三十人あまりと子], [矢部健太郎の本, 8月2日, 目次「妻子の公開処刑」], [日本歴史地名大系, 7月15日, 遺児と妻妾三十人あまり]], upto: 2}
      # fact: hidetsugu-25
      - 語り: 平凡社の『日本歴史地名大系』は、7月15日、秀次が腹を切ったのと同じ日付で書いています。人数も、本によって、数人ずつ違います。
        figure: {type: stats, title: 秀次の妻子の処刑　日付の食い違い, items: [[勢田勝郭 2015年, 8月2日, 妻妾三十人あまりと子], [矢部健太郎の本, 8月2日, 目次「妻子の公開処刑」], [日本歴史地名大系, 7月15日, 遺児と妻妾三十人あまり]], upto: 3}
      - 語り: 多くの人の命が奪われた出来事なのに、その日付と数さえ、記録はそろっていないんです。
        tone: しみじみ
        figure: null
      # 銀の返却（勢田 2015 注28）
      # fact: hidetsugu-13
      - 語り: 秀次が差し出した銀5000枚は、8月5日、そっくり秀吉の側へ返されたようです。
        card: {head: "8月5日", body: 銀5000枚が返される}
      # 聚楽第の破却（京都市 2023・日本西教史）
      # fact: hidetsugu-17
      - 語り: そして、京都の聚楽第。秀吉が築いた、豪華な城です。秀次の失脚とともに、この城も壊されました。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      # fact: hidetsugu-17
      - 語り: 宣教師の側の記録をもとにした『日本西教史』は、聚楽第を、「一宇も残さず、基礎にいたるまで、ことごとく壊させた」と書いています。
        tone: 重い
        card: {head: "日本西教史", body: 「一宇も残さず」}
      # fact: hidetsugu-17
      - 語り: 建物や石垣の材は、伏見などへ運ばれました。築かれてから壊されるまで、わずか9年でした。
        card: {head: "聚楽第", body: 築城から破却まで9年}
      # 発掘（京都府埋文 2013・京都市 2023）
      # fact: hidetsugu-26
      - 語り: その聚楽第が、地面の下から姿を見せ始めます。2012年の発掘で、本丸の南の濠の石垣が、初めて見つかりました。濠からは、金箔の瓦も出ています。
        card: {head: "2012年の発掘", body: 本丸南の濠の石垣・金箔瓦}
        # AI絵：an archaeological excavation site in a Kyoto residential street, exposed old stone wall foundations in a trench, gold-leaf roof tile fragments on a tray, daylight, documentary style, no faces
      # fact: hidetsugu-27
      - 語り: 2023年には、絵図にも描かれていない西の外堀の跡とみられる、幅およそ12メートル、深さおよそ3メートルの堀の跡が、初めて確かめられました。
        card: {head: "2023年の発掘", body: 幅約12m・深さ約3mの堀}
      # 京都市 2023 記者発表
      # fact: hidetsugu-01
      - 語り: 2023年の京都市の記者発表も、秀次が失脚した文禄4年に、聚楽第は徹底的に壊された、と考えられる、と書いています。
      - 語り: 一つも残さず壊された城が、400年あまりたって、少しずつ、地面の下から戻ってきています。
        tone: しみじみ
      # 瑞泉寺（日本歴史地名大系・精選版 日本国語大辞典・ニッポン旅マガジン）
      # fact: hidetsugu-23
      - 語り: 三条河原の塚は、「悪逆塚」とも、「畜生塚」とも呼ばれました。
        background: {image: paintings/ryoma_kyoto_sanjo_ohashi_hiroshige_1833.jpg, credit: "歌川広重《京師 三条大橋》1833年ごろ"}
        card: {head: "三条河原の塚", body: 「悪逆塚」「畜生塚」}
      # fact: hidetsugu-22
      - 語り: 慶長16年、1611年。高瀬川を開いた豪商、角倉了以が、僧の桂叔とはかって、この塚を建て直します。これが、今の瑞泉寺の始まりです。
        card: {head: "1611年", body: 角倉了以が瑞泉寺を開く}
      # fact: hidetsugu-23
      - 語り: 寺の言い伝えでは、了以は、高瀬川の工事の途中で、「秀次悪逆塚、文禄四年七月十四日」と刻まれた墓石を、掘り当てたといいます。
        tone: しみじみ
      # fact: hidetsugu-23
      - 語り: 刻まれた日付は、14日。秀次が腹を切った15日とも、妻子の8月2日とも、合いません。これも、伝承のなかの日付です。
        card: {head: "墓石の言い伝え", body: 「七月十四日」}
      # fact: hidetsugu-23
      - 語り: 瑞泉寺の境内には、今も、49の五輪塔が並んでいます。
        tone: しみじみ
        card: {head: "瑞泉寺", body: 49の五輪塔}
      # 瑞龍寺（精選版 日本国語大辞典・観光庁）。移転年の食い違いは語りだけ
      # fact: hidetsugu-20
      - 語り: 秀次の母、日秀尼は、文禄5年、1596年、息子の菩提をとむらうために、京都に瑞龍寺を開きました。村雲御所と呼ばれた寺です。
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
        card: {head: "1596年", body: 日秀尼が瑞龍寺を開く}
      # fact: hidetsugu-20
      - 語り: その瑞龍寺は、昭和になって、京都から、近江八幡の八幡山の上へ移されました。建っているのは、秀次の八幡山城の、本丸の跡です。移った年は、1961年とも、1963年ともいわれます。
        portrait: null
        background: {image: paintings/mitsunari_omi_hakkei_seta_hiroshige.jpg, credit: "歌川広重《近江八景 瀬田夕照》1857年ごろ（メトロポリタン美術館蔵）"}
        card: {head: "瑞龍寺", body: 八幡山城の本丸跡へ}
      - 語り: 母が息子のために建てた寺は、息子が開いた町を見下ろす山の上に、帰ってきたことになります。
        tone: しみじみ
      - 語り: 京都の三条と、近江の八幡山。秀次をとむらう寺は、ふたつの土地に分かれて、今も残っています。
      # 柳の間（まっぷる・文化遺産オンライン）
      # fact: hidetsugu-24
      - 語り: 高野山の金剛峯寺には、「柳の間」と呼ばれる部屋があります。山本探斎が描いた、柳と鷺の襖絵から付いた名で、「秀次自刃の間」とも呼ばれてきました。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "金剛峯寺", body: 柳の間（秀次自刃の間）}
        # AI絵：a quiet tatami room in a Japanese temple with sliding doors painted with willow branches and white herons, soft daylight, empty room, painterly, no people
      # fact: hidetsugu-24
      - 語り: ただ、今の建物、大主殿は、幕末の文久2年、1862年に建てられたものです。2024年の1月に、国の重要文化財になりました。
        card: {head: "大主殿", body: 1862年の建物・2024年に重要文化財}
      - 語り: 秀次が最期を迎えた部屋そのものは、もう、ありません。今の建物ができたのは、秀次の死から、260年あまりのちです。その名前だけが、建て直された部屋に、受け継がれています。
        tone: しみじみ
      # 食い違い③：享年（宮本 2017 が紹介する矢部書の目次）
      # fact: hidetsugu-14, hidetsugu-28
      - 語り: 秀次の年も、記録によって違います。『甫庵太閤記』や『公卿補任』による通説は、28歳。
        figure: {type: stats, title: 秀次の享年　2つの説, items: [[甫庵太閤記・公卿補任, 28歳, 通説], [所三男氏持参文書, 32歳, 矢部健太郎の説]], upto: 1}
      # fact: hidetsugu-14
      - 語り: 矢部さんは、『所三男氏持参文書』という史料から、32歳という説を出しています。
        figure: {type: stats, title: 秀次の享年　2つの説, items: [[甫庵太閤記・公卿補任, 28歳, 通説], [所三男氏持参文書, 32歳, 矢部健太郎の説]], upto: 2}
      - 語り: 命令か、自らか。28か、32か。秀次の最期は、日付も年も、まだ揺れたままです。
        tone: しみじみ
        figure: null

      # 締め：冒頭の条々（7月12日）に戻る
      # fact: hidetsugu-05
      - 語り: 文禄4年7月12日。秀吉は、秀次を、高野山に住まわせる、と書きました。供は15人。刀は帯びない。
        tone: しみじみ
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "7月12日の条々", body: 「高野山に住まわせる」}
      # fact: hidetsugu-08
      - 語り: その3日後に、秀次は腹を切りました。命令だったのか、潔白を示すためだったのか。答えは、「むしちゆへ」という一言を、どう読むかにかかっています。
        tone: しみじみ
      - 語り: 伏見を出た使者は、仲直りを告げ、別の使者は、何かを運んでいた。15日の朝、高野山で何が伝えられたのか。その場の言葉は、聞き書きの中にしか残っていません。
        tone: しみじみ
      - 語り: 山で暮らすための決まりは、守られることのないまま、写しだけが残りました。
        tone: しみじみ
        portrait: {image: paintings/hidenaga_hidetsugu.jpg, caption: "豊臣秀次（17世紀前半の肖像）"}
        pause: 0.8

