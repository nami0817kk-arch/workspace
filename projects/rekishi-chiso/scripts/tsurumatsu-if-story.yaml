# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と france-if-story.yaml の型）。もしも鶴松が生きていたら。2026-11-05 下書き。
# 公開の予定は 11/7 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型：
#   分岐は誰でも知る大事件の逆（秀吉の跡継ぎ・鶴松が1591年8月に死ぬ→生きていたら）／一点だけ変える／史実の条件の範囲内／推論と明かす／台詞は使わない／対象は滅んだ有名な家（豊臣家）。
#   秀長の延命は混ぜない（秀長の死は史実のまま1行だけ）。大河の中身には触れない。
#   語り手は剣崎1人。想像の台詞は入れない。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない。言えないことは言えないと言う。
#   冒頭（10秒以内）＝秀吉が明への出兵の決定を示したのは、跡継ぎが死んで18日後（池内宏 1914）。
#   序章／第1章 1589年 棄と呼ばれた子／第2章 1591年8月 髻の塚／第3章 分岐1 唐入り／第4章 分岐2 秀次の関白／第5章 分岐3 秀次事件／
#   第6章 分岐4 秀吉の死（1598）／第7章 分岐5 関ヶ原と大坂の陣／まとめ（言えること・言えないこと、祥雲寺と智積院、おもちゃの船）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 公開済みとの重なり：秀次（10/28）は切腹の命令の有無が主題。この回は秀次事件を1章で短く、記録の食い違いの1つとして扱う。
#   朝鮮出兵if（10/21）は「出兵しなかったら」。この回は出兵の分岐を立てず、鶴松の死と唐入りの関係だけを見る。淀殿（10/30）は鶴松の誕生を短く扱った。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/豊臣鶴松_facts_20261105.yaml）にあるものだけ。行の上に `# fact: tsurumatsu-NN`。
#   誰でも知る前置き（秀長・利休の死、小田原攻め、関ヶ原、大坂の陣、秀吉が太閤になる）は短く使い、# fact を付けない。
#   記録の食い違いは3つだけ並べる：①鶴松が生まれた年の秀吉の年齢（52・54、生年の天文5年・6年）②秀次が関白になった日（27日・28日）③秀吉は秀次に切腹を命じたか（矢部説と反論）。
#   ほかに割れる数（名護屋の陣屋の数・秀次の妻妾の数・秀頼の元服の日・関ヶ原後の石高・祥雲寺の造営の年・小早川秀秋の養子の年）は、1つの出どころの数として言うか、数を言わない。
#   年齢は全部数え。自分で計算した：秀吉（天文6年生まれとして）1589年に53・1598年に62／鶴松（1589生）1595年に7・1598年に10・1600年に12・1615年に27／
#   秀頼（1593生）1595年に3・1597年に5・1598年に6・1615年に23。鶴松の満の歳は天正17年5月27日→天正19年8月5日で2年2か月あまり。
#   日数：8月5日→18日後＝8月23日（池内の数）／8月5日→12月27日は4か月22日（5か月たたない）／文禄4年4月16日→27日は11日／4月27日→7月8日は2か月あまり。
#   確かめられなかったこと（台本では言わない）：鶴松が死んだ場所・名護屋城の築城の月・春日社への寄進の石高・秀吉の自筆の遺言状の文言・秀頼の生まれた場所・鶴松の法号の読み。
# 絵：AI 絵は今回作らない（Cloudflare FLUX の無料枠が11/5に切れていた）。前の回の Gemini の絵（淀殿・秀次・小早川秀秋・数正・利休・三種の神器）を写して使う。
#   一覧は scripts/story/tsurumatsu_main_look.yaml の頭。実在の絵は Commons ほかのパブリックドメインの絵画・屏風・肖像。処刑・切腹・戦の場面は描かない。
