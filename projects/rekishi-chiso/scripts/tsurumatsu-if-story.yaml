sections:
  # ================================================================ 序章
  - title: 「跡継ぎが死んで、18日後」　1591年8月
    background: {image: paintings/kanbei_nagoya_jinei_map.jpg, credit: "吉村茂三郎《西肥名古屋城豊太閤陣営図》1934年（近代の絵地図）"}
    year: 1591
    lines:
      # fact: tsurumatsu-09
      - 語り: 豊臣秀吉が、明の国へ攻め込む決定を世に示したのは、跡継ぎの男の子が死んで、わずか《18日後》のことでした。
        tone: 重い
        card: {head: "1591年8月", body: 跡継ぎの死から18日後}
      # fact: tsurumatsu-03
      - 語り: その子の名は、鶴松。天正19年、1591年の8月5日に亡くなりました。数えで3歳。生まれてから、2年と2か月あまりでした。
      # fact: tsurumatsu-06
      - 語り: 京都の東山、智積院には、金色の地に満開の桜を描いた、国宝の障壁画が残っています。桜図です。
      # fact: tsurumatsu-05, tsurumatsu-06
      - 語り: この絵は、もともと、秀吉が鶴松を弔うために建てた寺、祥雲寺のために描かれたものでした。
      # fact: tsurumatsu-04, tsurumatsu-16
      - 語り: 鶴松の死を知った秀吉は、髻、つまり頭の上で結った髪を切りました。公家の日記『三藐院記』によると、大名たちも人に負けじと髻を切り、切った髻は、塚を築いたようになりました。
        tone: 重い
      # fact: tsurumatsu-07, tsurumatsu-34
      - 語り: 鶴松が使った、子ども用の小さな鎧と、おもちゃの木の船は、今も京都の妙心寺と、その中の寺に残り、国の重要文化財になっています。
        card: {head: "京都・妙心寺", body: 小さな鎧とおもちゃの船}
      # fact: tsurumatsu-08
      - 語り: そして、鶴松の死から5か月たたないうちに、秀吉は、甥の秀次に、関白の位を譲ります。
      - 語り: 跡継ぎが死に、海の向こうへ兵を出すことが決まり、甥が関白になる。豊臣家の行く先は、この年に、大きく曲がりました。
        tone: しみじみ
      - 語り: もしも、鶴松が生きていたら。豊臣家は、どうなっていたのでしょうか。
        tone: 疑問
      - 語り: 変えるのは、鶴松が死ななかった、という一点だけ。ここから先は、記録に残る条件から考える、もしもです。
      - 語り: 明の国への出兵は、止まったのか。そして、秀吉が死んだ日、豊臣家には、誰が残っていたのか。
        tone: 疑問
        hook: true
      - 語り: 最初に見るのは、鶴松が生まれた日です。父の秀吉は、50歳を過ぎていました。
        hook: true

  # ================================================================ 第1章 1589年
  - title: 「その子は、なぜ棄と呼ばれたのか」　1589年 淀城
    background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
    year: 1589
    lines:
      # fact: tsurumatsu-01
      - 語り: 天正17年、1589年の5月27日。秀吉の側室の茶々が、山城の淀城で、男の子を産みました。
        card: {head: "1589年5月27日", body: 淀城で男の子が生まれる}
      # fact: tsurumatsu-01
      - 語り: 京都市の遺跡の地図によると、秀吉は弟の秀長に淀城を直させ、産所として茶々に与えました。
      # fact: tsurumatsu-36
      - 語り: ただ、この淀城は、今、淀城跡として知られる石垣の城とは、別の城です。今の淀城は、1623年に松平定綱が築き始めたものです。
      # fact: tsurumatsu-36
      - 語り: 鶴松が生まれた城は、伏見区の納所のあたりにあったと推定されています。文禄3年、1594年に壊されました。
      # fact: tsurumatsu-02
      - 語り: 男の子は、はじめ、棄と呼ばれました。1932年の『国史大図鑑』の説明では、この子が育つように祈って、わざと棄丸と呼ばせたのでした。
        card: {head: "幼い名", body: 棄（すて）}
      - 語り: 秀吉は、このとき何歳だったのか。ここで、記録が割れます。
        tone: 疑問
      # fact: tsurumatsu-24
      - 語り: 1914年の『豊公遺文』の年譜は、この年の秀吉を54歳とします。1926年の文部省の『日本国宝全集』は、52歳で初めて男の子を挙げた、と書きます。
        figure: {type: stats, title: 鶴松が生まれた年の秀吉の年齢, items: [[豊公遺文, 54歳, 1914年], [日本国宝全集, 52歳, 1926年], [天文6年生まれ, 53歳, 数えで]], upto: 3}
      # fact: tsurumatsu-23
      - 語り: 秀吉の生まれ年は、天文5年と天文6年に割れています。54歳は、天文5年の生まれとして数えた歳です。52歳がどう数えた歳なのかは、本には書かれていません。
      # fact: tsurumatsu-23
      - 語り: 秀吉に仕えた大村由己の『関白任官記』は、天文6年の2月6日の生まれとしています。その年、1537年の生まれなら、天正17年には、数えで53歳です。
      - 語り: どの数え方でも、50歳を過ぎてから得た跡継ぎでした。
        figure: null
      # fact: tsurumatsu-53
      - 語り: 子が生まれたその年に、動いたことがあります。秀吉の猶子、つまり形だけの子になっていた、後陽成天皇の弟、智仁親王が、その縁を解かれたのです。
      # fact: tsurumatsu-53
      - 語り: 代わりに、秀吉の願い出で、知行3000石の宮家、八条宮が立てられました。京都市の二条城の研究ノートも、鶴松が生まれたために縁が解かれた、としています。
        card: {head: "1589年", body: 智仁親王との縁を解き、八条宮を立てる}
      # fact: tsurumatsu-53
      - 語り: 八条宮は、のちに桂宮と呼ばれる宮家です。跡継ぎが生まれたことで、天皇の家との約束が、1つ書き換えられたのです。
      # fact: tsurumatsu-01
      - 語り: 東京大学史料編纂所の『史料綜覧』によると、生まれた翌日には、宮中から、この子に太刀が贈られています。
      # fact: tsurumatsu-12
      - 語り: その年の9月13日、鶴松は、淀城から大坂城へ移されました。
        card: {head: "1589年9月13日", body: 淀城から大坂城へ}
      # fact: tsurumatsu-25
      - 語り: 鶴松の世話を初めから任されたのは、石川豊前守光重という家臣でした。1919年、渡辺世祐の『豊太閤と其家族』に、その名があります。
      - 語り: 跡継ぎを得た秀吉は、翌年、小田原の北条氏を下し、天下を一つにまとめます。
        hook: true
      - 語り: けれど、そのまた翌年の天正19年。豊臣家には、悲しい知らせが続きます。
        hook: true

  # ================================================================ 第2章 1591年8月
  - title: 「なぜ大名たちは、髻を切ったのか」　1591年8月 京都・東福寺
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    year: 1591
    lines:
      - 語り: 天正19年の1月、秀吉の弟の秀長が病で亡くなります。2月には、千利休が腹を切りました。
      # fact: tsurumatsu-17
      - 語り: 同じころ、鶴松も病んでいました。奈良の興福寺の僧、英俊の『多聞院日記』によると、閏正月、つまりその年に2度あった正月の、3日ごろから、淀城で具合が悪くなっています。
        card: {head: "1591年閏正月", body: 鶴松が淀城で病む}
      # fact: tsurumatsu-17
      - 語り: 日記には、淀の若君の病のために、神前で特に心をこめて祈った、という記事もあります。
      # fact: tsurumatsu-17
      - 語り: いったん持ち直した鶴松は、8月2日から、また病みます。
      # fact: tsurumatsu-03
      - 語り: 毛利輝元が、6日に一族の吉川広家へ書いた手紙には、こうあります。若君様は、昨日5日に亡くなられた。どうにもならないことです。
        tone: 重い
        card: {head: "1591年8月5日", body: 鶴松が亡くなる}
      # fact: tsurumatsu-15
      - 語り: 一方、『多聞院日記』の6日の記事は、昨日だろうか、若君が亡くなったそうだ、という伝え聞きです。
      # fact: tsurumatsu-15
      - 語り: 毛利輝元の手紙では、秀吉は、すぐに京都の東福寺へ出て、髻を切りました。
      # fact: tsurumatsu-04
      - 語り: 8日の『多聞院日記』には、遺骸が東福寺へ移され、秀吉の嘆きは目も当てられないほどで、髪を切った。大名も小名も、そば近くに仕える者も、みな切ったそうだ、とあります。
        tone: 重い
      # fact: tsurumatsu-16
      - 語り: さきほどの、『三藐院記』の髻の塚は、このときのことです。
      # fact: tsurumatsu-18
      - 語り: 渡辺世祐によると、秀吉は7日に清水寺へ出かけて心を慰め、9日からは摂津の有馬へ湯治に向かいました。江戸の初めの林羅山の『秀吉譜』は、清水寺に3日とどまった、とします。
      # fact: tsurumatsu-25
      - 語り: 葬儀は、京都の妙心寺で行われました。世話役の石川光重が、妙心寺の南化玄興という僧を深く敬っていたためだ、と渡辺世祐は記します。
      # fact: tsurumatsu-28, tsurumatsu-29
      - 語り: 平凡社の日本歴史地名大系によると、8月のうちに、前田玄以を奉行にして、東山に、鶴松を弔う寺の工事が始まります。祥雲寺です。初めの住職には、その南化玄興が迎えられました。
        card: {head: "1591年8月", body: 祥雲寺の工事が始まる}
      # fact: tsurumatsu-34
      - 語り: 鶴松の小さな鎧2領と兜と鞍は、妙心寺に。おもちゃの船は、妙心寺の中の玉鳳院に。鶴松の木の坐像は、同じく隣華院に残ります。どれも、明治45年の2月8日に、当時の国宝に指定され、今は国の重要文化財です。
        figure: {type: stats, title: 鶴松の遺品（重要文化財）, items: [[小さな鎧・兜・鞍, 妙心寺], [おもちゃの船, 玉鳳院], [木の坐像, 隣華院]], upto: 3}
      # fact: tsurumatsu-35
      - 語り: 2014年の秋、京都国立博物館は、隣華院の坐像と、妙心寺の小さな武具を、同じ展示で見せています。
        figure: null
      - 語り: ここが、この話の分かれ道です。もしも、8月5日に、鶴松が死ななかったら。
        tone: 重い
        hook: true
      - 語り: 最初に変わりそうに見えるのは、18日後の、あの決定です。
        hook: true

  # ================================================================ 第3章 分岐1 唐入り
  - title: 「分岐1　鶴松が生きていたら、唐入りは止まったのか」　1585年から1592年
    background: {image: paintings/hideyoshi_nagoya_castle_screen.jpg, credit: "伝 狩野光信《肥前名護屋城図屏風》（1590年代）"}
    year: 1591
    lines:
      # fact: tsurumatsu-09
      - 語り: 1914年、池内宏の『文禄慶長の役』は、鶴松が死んで18日後に、明を討つ決定が発表された、と書きました。
      # fact: tsurumatsu-09
      - 語り: 1943年の辻善之助の本は、もっと早く、死の翌日の6日には、秀吉は朝鮮への出兵の用意に取りかかっていた、とします。
      # fact: tsurumatsu-09
      - 語り: 悲しみをまぎらわすために、海の向こうへ兵を出した。そう書く本もあります。江戸の初めの林羅山の『秀吉譜』では、鶴松が死んでから初めて、朝鮮に入る志が起きたことになっています。
      - 語り: けれど、秀吉の唐入りの言葉は、鶴松が生まれるより、ずっと前からあります。
        tone: 疑問
      # fact: tsurumatsu-13
      - 語り: 天正13年、1585年の9月3日。秀吉が家臣の一柳末安に宛てた、朱印を押した手紙に、こうあります。日本のことは言うまでもなく、唐の国まで従わせるつもりだ。
        tone: 重い
        card: {head: "1585年9月3日", body: 一柳末安への朱印状「唐国まで」}
      # fact: tsurumatsu-13
      - 語り: 鶴松が生まれる4年前の手紙です。国立国会図書館が持つ、一柳家の文書の1通で、東京大学史料編纂所の『大日本史料』に収められています。
      # fact: tsurumatsu-14
      - 語り: 翌年の覚書にも、唐の国までなりとも、という言葉があります。ただ、歴史家の田中義成は、1925年の『豊臣時代史』で、これをすぐ攻め込む意志と見るのは誤りで、威勢を示す大げさな言い方だ、と読みました。
      # fact: tsurumatsu-26
      - 語り: 天正19年の春の計画も、記録にあります。『三藐院記』には、その春、秀吉には唐入りの心づもりがあったが、まず大仏を造ることを先にしていたところへ、若君が病んだ、とあります。
      # fact: tsurumatsu-09
      - 語り: 鶴松の病より前に、計画はあった。池内宏は、唐入りの決意と鶴松の死は、互いに関わるものではない、と論じました。
      # fact: tsurumatsu-09
      - 語り: 一方で、徳富蘇峰は、鶴松の死は、動かし始めた力ではないが、押し進めた力だった、と書きます。辻善之助は、出兵の動機とするのは当たらない、としながら、死の翌日には用意が始まっていた、と見ました。
        figure: {type: stats, title: 鶴松の死と唐入り（記録と研究者）, items: [[池内宏（1914年）, 互いに関わらない], [徳富蘇峰, 押し進めた力], [辻善之助（1943年）, 動機ではない]], upto: 3}
      # fact: tsurumatsu-10
      - 語り: 出兵の拠点、肥前の名護屋城の築城も、その年に始まりました。佐賀県立名護屋城博物館によると、諸大名が分けて受け持ち、わずか数か月で仕上がったといわれます。
        figure: null
        card: {head: "1591年", body: 名護屋城の築城が始まる}
      # fact: tsurumatsu-38
      - 語り: 博物館の解説では、名護屋には160もの大名が集まったといわれます。名護屋の人口は、およそ20万人にのぼったともいわれます。
      # fact: tsurumatsu-40
      - 語り: 名護屋城の跡と、まわりの陣の跡は、1955年に、国の特別史跡になりました。指定されているのは、城と、陣の跡のうち23か所で、合わせて73.1ヘクタールです。
      - 語り: 天正20年、1592年の4月、最初の軍勢が、朝鮮へ渡ります。
      - 語り: では、もしも鶴松が生きていたら。唐入りの計画は、鶴松の死の前からありました。止まった、と考える材料は、見当たりません。唐入りは、ほぼ同じように進んだと考えられます。
        tone: しみじみ
      - 語り: 変わったかもしれないのは、時期です。鶴松の死が押し進めた、という見方に立てば、出陣は少し遅れたかもしれません。
      - 語り: 唐入りを決めた年の暮れ、秀吉は、もう一つ、豊臣家の行く先を変える決断をします。
        hook: true
      - 語り: それは、鶴松が座るはずだった席に、関わるものでした。
        hook: true

  # ================================================================ 第4章 分岐2 秀次の関白
  - title: 「分岐2　鶴松が生きていたら、秀次は関白になったのか」　1591年から1592年
    background: {image: paintings/hideyoshi_jurakudai_screen_mitsui.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
    year: 1591
    lines:
      # fact: tsurumatsu-19
      - 語り: 鶴松が死んで3日後。8日の『多聞院日記』には、早くも、天下を中納言殿、つまり秀次へ譲るそうだ、という噂が書かれています。
      # fact: tsurumatsu-08
      - 語り: 小学館の日本大百科全書によると、11月、秀次は秀吉の跡を継ぐ養子となり、12月4日に内大臣、そして関白になりました。
      # fact: tsurumatsu-08
      - 語り: その関白になった日が、また割れます。東京大学史料編纂所の『史料綜覧』は、12月27日。1938年の『伊達政宗卿伝記史料』や、日本大百科全書は、28日です。
        figure: {type: stats, title: 秀次が関白になった日, items: [[『史料綜覧』, 天正19年12月27日], [『伊達政宗卿伝記史料』ほか, 12月28日]], upto: 2}
        card: {head: "1591年12月", body: 秀次が関白に}
      - 語り: 秀吉は、関白を退いて、太閤と呼ばれるようになります。
        figure: null
      # fact: tsurumatsu-08
      - 語り: なぜ、秀次だったのか。平凡社の世界大百科事典で、三鬼清一郎さんは、実の子の鶴松が死んだことによって、秀次は1591年の末に関白となった、と書きます。
      # fact: tsurumatsu-19
      - 語り: 池内宏は、別の見方です。関白を退くという秀吉の考えは、鶴松の死と前後して、もう奈良に聞こえていた、と。
      # fact: tsurumatsu-20
      - 語り: 手がかりになる文書が、翌年にあります。天正20年の5月18日。朝鮮の都が落ちたと聞いた秀吉は、秀次に、明と朝鮮の処置と、出兵の支度を命じました。
        card: {head: "1592年5月18日", body: 秀次に、明と朝鮮の処置を命じる}
      # fact: tsurumatsu-20
      - 語り: 覚書には、大唐の関白は秀次に譲る、都のまわりの100か国を渡す、とあります。秀吉は、秀次を、明の国の関白にするつもりでした。
        tone: 重い
      - 語り: 秀吉が海を渡れば、日本に残って政をみる人が要ります。秀次の関白は、跡継ぎの死の穴埋めだけでなく、唐入りの備えでもあった、と読むこともできます。
      - 語り: もしも、鶴松が生きていたら。数えで3歳の子に、関白は務まりません。唐入りの備えが要るなら、大人の誰かが、関白か、それに近い役に就いた、と考えるのが自然です。
        tone: しみじみ
      - 語り: それが秀次だった、とまでは言い切れません。ただ、その人は跡継ぎではなく、鶴松が育つまでの、つなぎの役になったでしょう。
      - 語り: そして文禄2年、秀吉に、もう一人の男の子が生まれます。
        hook: true
      - 語り: 史実の豊臣家を大きく揺らしたのは、その子の誕生でした。
        hook: true

  # ================================================================ 第5章 分岐3 秀次事件
  - title: 「分岐3　拾が生まれたあと、秀次事件は起きたのか」　1593年から1595年
    background: {image: paintings/hidenaga_hidetsugu.jpg, credit: "《豊臣秀次像》17世紀前半"}
    year: 1595
    lines:
      # fact: tsurumatsu-11
      - 語り: 文禄2年、1593年の8月3日。茶々が、また男の子を産みました。拾、のちの秀頼です。
        card: {head: "1593年8月3日", body: 拾（のちの秀頼）が生まれる}
      # fact: tsurumatsu-21
      - 語り: 秀吉は、拾と秀次を、どう並べるつもりだったのか。秀次の書記役、駒井重勝の日記には、拾と秀次の娘を、ひとつにする、つまり縁組させる、という秀吉の言葉が書き留められています。
      # fact: tsurumatsu-22
      - 語り: 公家の山科言経の日記には、日本を5つに分けて、そのうち4つを秀次に、という秀吉の言葉も残る、と紹介されています。
      - 語り: 秀吉は、甥と息子を、縁組でつなごうとしていました。
        tone: しみじみ
      # fact: tsurumatsu-52
      - 語り: 秀吉の妻、ねねの甥で、秀吉の養子になっていた秀俊、のちの小早川秀秋は、ブリタニカの事典によると、拾が生まれたあと、小早川隆景の養子に出されています。
      # fact: tsurumatsu-51
      - 語り: そのあいだに、秀次の兄弟は、次々にいなくなっていました。拾が生まれる前の年、天正20年の9月9日、秀次の弟の秀勝が、唐入りのさなか、朝鮮の巨済島で病で亡くなりました。数えで24歳です。
      # fact: tsurumatsu-50
      - 語り: 文禄4年、1595年の4月16日には、もう一人の弟、秀保が、大和の十津川で死にます。数えで17歳でした。
      # fact: tsurumatsu-49
      - 語り: その11日後の、4月27日付の木下吉隆の手紙によると、秀吉は前の日の26日に、主のいなくなった大和の国を、秀次の数えで2歳の若君に継がせる、と言い出していました。
        card: {head: "1595年4月27日", body: 大和を秀次の若君に}
      - 語り: 秀次事件の、2か月あまり前のことです。
        tone: 重い
      # fact: tsurumatsu-41
      - 語り: 奈良工業高等専門学校の紀要に載った、2015年の論文によると、7月8日、秀次は聚楽第から伏見城へ向かいました。
      # fact: tsurumatsu-41
      - 語り: けれど、秀吉に会うことも許されず、そのまま高野山へ行くよう命じられます。
        card: {head: "1595年7月8日", body: 伏見で会えず、高野山へ}
      # fact: tsurumatsu-45
      - 語り: 7月12日の定めは、秀次の召し使いを15人に限っています。高野山に当分住み続けることを前提にした決まりでした。
      # fact: tsurumatsu-46
      - 語り: 同じ12日、石田三成と増田長盛は、血判を押した起請文で、御ひろい様、つまり数えで3歳の拾に、裏表なく尽くすと誓いました。
      # fact: tsurumatsu-41
      - 語り: 15日、秀次は、高野山の青巌寺で腹を切ります。
        tone: 重い
      # fact: tsurumatsu-43
      - 語り: 『川角太閤記』は、15日の朝、命令が届いたとき、秀次は、僧と将棋を指していた、と書いています。
      # fact: tsurumatsu-42
      - 語り: ここで、記録の読みが割れます。國學院大學の矢部健太郎さんは、2016年の『関白秀次の切腹』などで論じました。秀吉に切腹させる考えはなく、秀次が身の潔白を示すために、自ら腹を切った、と。
      # fact: tsurumatsu-42
      - 語り: 先の2015年の論文は、『川角太閤記』の目撃談などから、秀吉が切腹を命じる使いを送った、として、この説を退けています。
        figure: {type: stats, title: 秀吉は切腹を命じたか, items: [[矢部健太郎（2016年ほか）, 命じていない・自ら切った], [奈良高専の紀要（2015年）, 使いを送って命じた]], upto: 2}
      # fact: tsurumatsu-44
      - 語り: 宮中の女官たちの日記、『御湯殿上日記』にある、無実ゆえこうなった、という一言も、2人は違う意味に読んでいます。
        figure: null
      # fact: tsurumatsu-41, tsurumatsu-47, tsurumatsu-48
      - 語り: 8月2日、百科事典などによれば30人あまりの、秀次の妻や側室が、子とともに、京都の三条河原で命を奪われました。聚楽第は、築いてから9年で、跡形もなく壊されます。
        tone: 重い
      - 語り: もしも、鶴松が生きていたら。拾は、跡継ぎの弟になります。
      # fact: tsurumatsu-08
      - 語り: 京都市が聚楽第の跡の発掘を伝えた資料は、秀吉に実の子が生まれたことで、秀吉と秀次の仲が悪くなった、と書いています。
      - 語り: もし秀次が、初めから、鶴松が育つまでのつなぎの関白だったなら。拾が生まれても、跡継ぎの座を追われる大人は、いません。史実で秀次を追い詰めたとみられる事情の一つが、ここで消えます。
        tone: しみじみ
      - 語り: ただ、鶴松が生まれた年に、秀吉が天皇の弟との縁を解いたように、実の子は、それまでの約束を動かします。事件が起きなかったとまでは言い切れませんが、火種は、史実より小さかったと考えられます。
      - 語り: そして、三成たちが誓いを向ける相手も、数えで3歳の拾ではなく、7歳の跡継ぎ、鶴松だったでしょう。
      - 語り: 史実では、文禄4年の秋には、秀吉の弟の秀長も、姉の子の秀次と、その2人の弟も、もうこの世にいませんでした。
        tone: 重い
        hook: true
      - 語り: その3年後、秀吉が、伏見城で倒れます。
        hook: true

  # ================================================================ 第6章 分岐4 秀吉の死
  - title: 「分岐4　秀吉が死んだ日、鶴松は何歳だったのか」　1598年 伏見城
    background: {image: paintings/oichi_hideyori.jpg, credit: "伝《豊臣秀頼像》（養源院本の模写、1914年）"}
    year: 1598
    lines:
      - 語り: 慶長3年、1598年の8月18日。秀吉は、伏見城で亡くなりました。天文6年の生まれなら、数えで62歳です。
        tone: 重い
        card: {head: "1598年8月18日", body: 秀吉が伏見城で亡くなる}
      # fact: tsurumatsu-56
      - 語り: 拾、秀頼は、数えで6歳。本郷和人さんの2026年の『インテリジェンス関ヶ原』によれば、豊臣政権の弱点が跡継ぎにあることは、当時から誰の目にも明らかでした。
      # fact: tsurumatsu-55
      - 語り: 立命館大学の谷徹也さんの論文が引く秀吉の遺言は、宇喜多秀家に、5人の年寄の中に入って、えこひいきなく取り仕切るよう求めています。5人の年寄は、のちに五大老と呼ばれる大名たちです。
      # fact: tsurumatsu-54
      - 語り: 死の1週間後の8月25日。5人の奉行は、朝鮮にいた鍋島直茂に、太閤様のご病気は、いよいよよくなられた、と書き送りました。秀吉の死は、伏せられていたのです。
        tone: 重い
      # fact: tsurumatsu-55
      - 語り: 翌年の正月19日には、徳川家康が、伊達政宗らと勝手に縁組みを結んだことを、ほかの年寄と奉行たちが、秀吉の遺した命に背く、と責めました。
        card: {head: "1599年正月19日", body: 家康の縁組みを責める}
      - 語り: もしも、鶴松が生きていたら。秀吉が死んだこの日、鶴松は、数えで10歳です。
        tone: 疑問
        figure: {type: stats, title: 1598年8月、秀吉が死んだ日の年齢（数え）, items: [[秀吉, 62歳（天文6年生まれとして）], [秀頼（史実）, 6歳], [鶴松（もしも）, 10歳]], upto: 3}
      - 語り: 秀頼より4つ年上でも、10歳の子が、大名たちを率いることはできません。年寄と奉行が、幼い主を支える形は、変わらなかったと考えられます。
        figure: null
      # fact: tsurumatsu-57
      - 語り: 元服や官位は、早まったかもしれません。日本大百科全書によると、史実の秀頼は、慶長2年の9月、数えで5歳のとき、宮中で元服しています。
      - 語り: 10歳の鶴松に、家康を抑える力は、まだありません。頼りになるのは、大人の一門です。
      - 語り: 2年後、関ヶ原。
        hook: true
      - 語り: 豊臣家の行く先を決めたこの戦いに、もし鶴松がいたら、何が違ったのでしょうか。
        hook: true

  # ================================================================ 第7章 分岐5 関ヶ原と大坂の陣
  - title: 「分岐5　関ヶ原と大坂の陣は変わったのか」　1600年から1615年
    background: {image: paintings/ieyasu_osaka_summer_screen_kuroda.jpg, credit: "《大坂夏の陣図屏風》右隻（黒田屏風、大阪城天守閣蔵、17世紀）"}
    year: 1615
    lines:
      # fact: tsurumatsu-58
      - 語り: 慶長5年、1600年の関ヶ原の戦いのあと、豊臣家は、摂津、河内、和泉を治める、一つの大名になりました。日本大百科全書は、約70万石とします。
        card: {head: "1600年", body: 関ヶ原の戦いのあと、摂津・河内・和泉の大名に}
      # fact: tsurumatsu-57
      - 語り: 秀頼は、慶長8年の4月に、内大臣になります。
      - 語り: 慶長19年、1614年の冬。そして翌年の夏。大坂の陣です。
      # fact: tsurumatsu-59
      - 語り: 大阪市教育委員会の解説によると、慶長20年5月7日の最後の戦いは、徳川方15万5千、豊臣方5万5千。翌8日、秀頼と、母の茶々は自害し、豊臣家は滅びました。
        tone: 重い
        card: {head: "1615年5月8日", body: 豊臣家が滅びる}
      - 語り: 秀頼は、数えで23歳でした。
      - 語り: もしも、鶴松が生きていたら。この年、数えで27歳です。
        tone: 疑問
        figure: {type: stats, title: もしも鶴松が生きていたら（数え）, items: [[1595年 秀次事件, 7歳], [1600年 関ヶ原, 12歳], [1615年 大坂の陣, 27歳]], upto: 3}
      - 語り: 4つ上の兄が1人いて、何が変わったのか。言えるのは、秀吉が死んだ日に跡継ぎが子どもだった、という条件は、変わらないことです。
        figure: null
      - 語り: 秀長は、鶴松が死ぬ半年あまり前、天正19年の1月に亡くなっています。これは、鶴松が生きていても、変わりません。秀勝も、唐入りが同じように進んだなら、そのさなかに病で亡くなった、と考えるのが自然です。
      - 語り: 変わりうるのは、秀次事件です。事件が起きなければ、秀吉が死んだ日、幼い鶴松のそばには、関白を務めた大人の秀次が、残っていたことになります。
        tone: しみじみ
      - 語り: それでも、家康を相手に、豊臣家を守り切れたかどうか。そこから先は、記録からは言い切れません。
        hook: true
      - 語り: 最後に、鶴松のために建てられた寺が、豊臣家の滅んだ年に、どうなったのかを見ます。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも鶴松が生きていたら、豊臣家はどうなったのか
    background: {image: paintings/hideyoshi_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》1796年以前（方広寺の大仏殿、江戸時代に建て直した姿）"}
    lines:
      # fact: tsurumatsu-13
      - 語り: 鶴松が生きていても、唐入りは、おそらく止まりませんでした。唐の国までという言葉は、鶴松が生まれる4年前の、天正13年の手紙にあるからです。
      # fact: tsurumatsu-49
      - 語り: 変わったかもしれないのは、秀次の立場です。事件の2か月あまり前まで、秀吉は、秀次の子に大和を継がせようとしていました。
      - 語り: 初めからつなぎの関白なら、拾が生まれても、跡継ぎ争いの形には、なりにくかったはずです。
      - 語り: それでも、秀吉が死んだ慶長3年、鶴松は数えで10歳。幼い跡継ぎを、大人たちが支えなければならない、という条件は、変わりません。
      - 語り: 秀次事件は起きたのか。関ヶ原で、家康は勝ったのか。鶴松がいた豊臣家は、何年続いたのか。そこから先は、記録からは言い切れません。
        tone: 重い
      # fact: tsurumatsu-31
      - 語り: 鶴松のために建てられた祥雲寺の建物は、豊臣家が滅んだ1615年、元和元年に、智積院に与えられました。
        tone: しみじみ
        card: {head: "1615年", body: 祥雲寺の建物が智積院へ}
      # fact: tsurumatsu-33, tsurumatsu-28
      - 語り: 桜図を描いた、長谷川等伯の息子の久蔵は、文禄2年の6月15日に、数えで26歳で亡くなっています。祥雲寺で、鶴松の三回忌が営まれた年です。
      # fact: tsurumatsu-32
      - 語り: 智積院は、天和2年、1682年に焼け、1947年の火事でも、障壁画のうち16面を失いました。それでも、桜図は、今も残っています。
      - 語り: 3歳で死んだ男の子の、おもちゃの船は、今も京都の寺にあります。
        tone: しみじみ
      # fact: tsurumatsu-09
      - 語り: 跡継ぎが死んで18日後、秀吉は、海の向こうへ兵を出すと示しました。明への出兵の決定は、鶴松が生きていても、いずれ出ていたでしょう。
        tone: しみじみ
      - 語り: もしもで変わるのは、そのあとです。秀吉が死んだ日、幼い跡継ぎのそばに、どんな大人が残っていたのか。豊臣家の行く先は、そこで分かれたのかもしれません。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
