# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  豊臣秀吉が、明の国へ攻め込む決定を示したのは、跡継ぎの男の子が死んで18日後のことでした。
  その子の名は鶴松。数えで3歳でした。5か月たたないうちに、秀吉は甥の秀次に関白の位を譲ります。
  もしも鶴松が生きていたら、豊臣家はどうなっていたのでしょうか。
  この動画でわかること
  ・鶴松が生まれた年、秀吉の年齢が本によって割れる理由と、天皇の弟との縁が解かれたこと
  ・鶴松の死の知らせと、大名たちが切った髻の塚
  ・唐入りの言葉は、鶴松が生まれる4年前の手紙にあったこと
  ・秀次の関白、秀次事件、秀吉の死、関ヶ原、大坂の陣を、鶴松が生きていた場合に記録から言えること、言えないこと
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（『多聞院日記』『三藐院記』、毛利輝元の書状、『大日本史料』、『史料綜覧』、駒井重勝の日記、木下吉隆の書状、池内宏・辻善之助・田中義成・渡辺世祐の研究書、文化庁の国指定文化財等データベース、京都市・佐賀県立名護屋城博物館・大阪市の解説、奈良工業高等専門学校・立命館大学の紀要の論文など）を語りで示してから、今の言葉にして読んでいます。
  鶴松が生まれた年の秀吉の年齢、秀次が関白になった日、秀吉が秀次に切腹を命じたかどうかは、記録や研究者によって書き方が割れています。年齢は数え年です。
  鶴松が生きていた場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、狩野光信と伝わる《肥前名護屋城図屏風》、《聚楽第図屏風》、《大坂夏の陣図屏風》ほかの絵画・屏風・肖像（パブリックドメイン）と、画像生成AIで作った想像上の人物と風景です。
  サムネイルの人物像と燃える大坂城も、画像生成AIによる想像図です。

en:
  title: "If Tsurumatsu Had Lived: What Would Have Become of the Toyotomi?"
  description: |-
    Toyotomi Hideyoshi announced his decision to invade Ming China just 18 days after his infant heir died.
    The boy's name was Tsurumatsu. He was three by the Japanese count. Within five months, Hideyoshi handed the post of kampaku to his nephew Hidetsugu.
    If Tsurumatsu had lived, what would have happened to the Toyotomi family?
    In this video you will learn:
    - Why books disagree on Hideyoshi's age when Tsurumatsu was born, and how an imperial prince's adoption was dissolved
    - How news of the death spread, and the "mound" of topknots cut by the daimyo
    - That Hideyoshi spoke of conquering China in a letter four years before Tsurumatsu was born
    - What the records can and cannot tell us about Hidetsugu, the Hidetsugu Incident, Hideyoshi's death, Sekigahara and the Siege of Osaka, had Tsurumatsu lived
    Japanese-language history video (Japanese audio).
  chapters:
    - "Eighteen Days After the Heir Died: 1591"
    - "Why Was the Boy Called Sute? 1589, Yodo Castle"
    - "Why Did the Daimyo Cut Their Topknots? August 1591"
    - "Turning Point 1: Would the Invasion Have Stopped? 1585-1592"
    - "Turning Point 2: Would Hidetsugu Have Become Kampaku? 1591-1592"
    - "Turning Point 3: After Hideyori's Birth, the Hidetsugu Incident 1593-1595"
    - "Turning Point 4: How Old Would Tsurumatsu Have Been When Hideyoshi Died? 1598"
    - "Turning Point 5: Sekigahara and Osaka, With an Older Brother? 1600-1615"
    - "Summary: What Can Be Said If Tsurumatsu Had Lived"

