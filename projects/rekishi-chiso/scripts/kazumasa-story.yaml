# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  天正13年11月13日の夜。徳川家康の右腕と呼ばれた男が、岡崎城から消えました。石川数正です。
  向かった先は、それまで徳川の側で交渉を受け持ってきた相手、羽柴秀吉のもとでした。
  なぜ、家康の右腕は、秀吉のもとへ走ったのか。
  この動画でわかること
  ・2023年に初めて公開された織田信雄の手紙と、数正の立場が2週間で崩れたという新しい読み
  ・辞典・研究者で割れる「出奔の理由」と、スパイ説が退けられる理由
  ・出奔の16日後の天正地震と、秀吉の正月の徳川攻めの命令
  ・松本城の天守の年代調査、子の康長の改易、今も続く子孫の法要
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（徳川家康の書状・フロイスの書簡・一柳家文書など）を語りで示してから読んでいます。

en:
  title: "Ishikawa Kazumasa: Why Did Ieyasu's Right-Hand Man Defect to Hideyoshi?"
  description: |-
    One night in the 13th year of Tensho, the man known as Tokugawa Ieyasu's right hand vanished from Okazaki Castle: Ishikawa Kazumasa. He went to Hashiba Hideyoshi, the very rival he had been negotiating with on Ieyasu's behalf.
    Why did Ieyasu's right-hand man go over to Hideyoshi?
    In this video you will learn:
    - A letter from Oda Nobukatsu first shown in 2023, and a new reading that Kazumasa's position collapsed within two weeks
    - How dictionaries and historians disagree on the reason, and why the "spy" theory is rejected
    - The great Tensho earthquake 16 days later, and Hideyoshi's order to attack Ieyasu in the New Year
    - The tree-ring dating of Matsumoto Castle's keep, the fall of his son Yasunaga, and the memorial still held by descendants
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Did Ieyasu's Right-Hand Man Go to Hideyoshi? Okazaki Castle"
    - "Why Were Kazumasa's Sons in Osaka? The Departure of Ogimaru"
    - "What Changed in Two Weeks? A Letter from Oda Nobukatsu"
    - "What Happened That Night at Okazaki Castle?"
    - "Traitor, Spy, or Cornered? What the Dictionaries and Historians Say"
    - "Did the Earthquake 16 Days Later Save Ieyasu?"
    - "Where Did His Family Go? Matsumoto Castle and the Descendants"

