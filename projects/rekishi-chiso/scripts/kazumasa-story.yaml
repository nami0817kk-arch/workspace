  # ================================================================ 第6章（最後）その後：数正の家はどこへ ＋ 冒頭に戻る締め
  - title: まとめ：家康の右腕の家は、どこへ行ったのか　松本城と子孫
    background: {image: paintings/sanada_shinano_hiroshige2_1862.jpg, credit: "歌川広重（二代）《諸国六十八景 信濃 久米路橋》1862年"}
    # AI絵：Matsumoto Castle keep with the Northern Alps behind it, late autumn, clear sky, painterly, muted colors
    year: 1590
    lines:
      # 菊地浩之：出奔後は秀吉の偏諱で出雲守吉輝
      # fact: kazumasa-15
      - 語り: 秀吉の家臣になった数正は、名を改めます。菊地浩之さんによれば、秀吉の「吉」をもらって、「出雲守、《吉輝》」と名乗りました。
        card: {head: "出奔のあと", body: 出雲守吉輝（よしてる）}
        figure: {type: stats, title: 数正の名乗り（菊地浩之さんの整理）, items: [[天正の前半, 数正, 若いころからの名], [天正13年ごろ, 康輝, 家康の「康」], [出奔のあと, 吉輝, 秀吉の「吉」]], upto: 3}
      - 語り: 家康の「康」から、秀吉の「吉」へ。名前の一字が、仕える相手を物語っています。
        figure: null
        tone: しみじみ
      # 文化遺産オンライン（松本城天守の解説）：天正18年に封ぜられた石川数正はただちに改修に着手
      # fact: kazumasa-05
      - 語り: 天正18年。数正は、信濃の松本に領地を与えられ、城の改修に取りかかります。
        card: {head: "天正18年", body: 信濃の松本へ}
      # 観光庁 多言語解説文 R4-00230：古山寺御殿は数正の別名から
      # fact: kazumasa-23
      - 語り: 松本城の黒門の南には、数正の屋敷として建てられた、古山寺御殿がありました。古山寺は、数正のもう一つの呼び名です。
      # 文化庁 国指定文化財等データベース（1930 指定の説明文）
      # fact: kazumasa-21
      - 語り: 呼び名といえば、1930年に国が松本城を史跡に指定したときの説明文では、城を営んだ人は「石川康昌」、その子は「光長」と書かれています。今の呼び名の、数正と康長とは、違う名前です。
        background: {image: paintings/sanada_shinano_suwako_hiroshige2.jpg, credit: "歌川広重（二代）《諸国名所百景 信州諏訪湖》1860年"}
        card: {head: "1930年の説明文", body: 「石川康昌」「光長」}
      # 没年の食い違い③：文禄元年に没・12月14日七条河原で葬礼（サライ.jp）⇔ 文化遺産オンライン「文禄二年に没」
      # fact: kazumasa-31
      - 語り: けれど、松本での暮らしは、長くは続きません。文禄元年、数正は亡くなり、その年の12月14日、京都の七条河原で、葬礼が営まれました。
        tone: しみじみ
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "文禄元年12月14日", body: 京都の七条河原で葬礼}
      # fact: kazumasa-05
      - 語り: ただ、文化庁の文化遺産オンラインの解説は、数正が亡くなったのを、翌年の文禄2年としています。亡くなった年さえ、記録が割れているんです。
        figure: {type: stats, title: 数正が亡くなった年, items: [[文禄元年（1592年）, 12月14日に七条河原で葬礼, 葬礼の記録から], [文禄2年（1593年）, 文化遺産オンラインの解説, 松本城天守の説明]], upto: 2}
      # 天守の食い違い④：松本市「文禄2〜3年に数正・康長父子が築造」⇔ 2025年の年輪年代調査（光谷拓実・麓和善）
      # fact: kazumasa-05
      - 語り: 数正の名と結びついて語られてきたのが、松本城の天守です。松本市は、天守を、文禄2年から3年にかけて、数正と康長の父子が築いた、と説明してきました。
        figure: null
        background: {image: paintings/sanada_shinano_hiroshige2_1862.jpg, credit: "歌川広重（二代）《諸国六十八景 信濃 久米路橋》1862年"}
        # AI絵：Matsumoto Castle keep close view, black lacquered wooden walls and white plaster, painterly
        card: {head: "これまでの説明", body: 数正と康長の父子が築いた}
      # fact: kazumasa-18
      - 語り: ところが、文献の記録だけでは、天守がいつ建ったのかを決められませんでした。昭和の初めから、天正19年の説から慶長5年から6年の説まで、5つもの説が並んでいたんです。
      # fact: kazumasa-17
      - 語り: そこで松本市は、令和4年度から6年度にかけて、天守の柱の木の年輪を調べました。分かったのは、1階、3階、4階の柱が、1596年に伐られた木だったことです。
        tone: 強調
