      # fact: kazumasa-09, kazumasa-10
      - 語り: そして、第2章の菅原義勝さんの読み。貞慶の離反の責任を負わされ、家康の決別で、立場が2週間で崩れた、というものです。
        portrait: null
        background: {image: paintings/sanada_shinano_suwako_hiroshige2.jpg, credit: "歌川広重（二代）《諸国名所百景 信州諏訪湖》1860年"}
        figure: {type: stats, title: 出奔の理由の読み, items: [[呉座勇一さん, 家中で孤立, 取次の立場], [本郷和人さん, 秀吉の引き抜き, スパイ説は退ける], [菅原義勝さん, 貞慶の離反と2週間, 2023年の手紙から]], upto: 3}
      # fact: kazumasa-02
      - 語り: ただ、菅原さん自身も、これを確かめる決め手の史料は無い、としています。新しい手紙は、手がかりであって、答えそのものではありません。
        tone: しみじみ
        figure: null
        card: {head: "菅原さんの留保", body: 決め手の史料は無い}
      - 語り: 辞典は、理由を書くものと、書かないものに分かれました。研究者は、孤立、引き抜き、2週間の急転と、それぞれ違う所に光を当てています。
        tone: しみじみ
      - 語り: 裏切り者か、主君のために動いたのか、追い詰められたのか。記録が語るのは、数正が城を出た日と、家康がそれを「退出」と書いたことまでです。
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
        tone: しみじみ
        hook: true
      - 語り: そして、出奔から16日後。日本の真ん中を、大きな地震が襲います。
        tone: 重い
        hook: true

  # ================================================================ 第5章 天正地震（天正13年11月29日）
  - title: 16日後の大地震は、家康を救ったのか　天正13年11月29日
    background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
    portrait: {image: paintings/hidenaga_hideyoshi_portrait_1600.jpg, caption: "豊臣秀吉（1600年ごろの肖像）"}
    # AI絵：a great earthquake at night in a 16th-century Japanese castle town, collapsing wooden houses and fire in the distance, people silhouettes running, painterly, muted colors, not graphic
    year: 1585
    lines:
      # 一柳家文書（香原斗志 2023・呉座勇一 2023 が引く）
      # fact: kazumasa-30
      - 語り: 数正を迎えた秀吉は、動き出していました。翌年の正月に、家康を討つ、と決めたんです。
        tone: 重い
      # fact: kazumasa-30
      - 語り: 『一柳家文書』という古文書には、このときの秀吉の指図が残っています。正月15日より前に、自分は大垣城まで出向く。準備を怠るな、と。
        card: {head: "一柳家文書", body: 正月15日より前に大垣城へ}
        figure: {type: map, title: 天正13年 秀吉の徳川攻めの道, bounds: [135.3, 137.6, 34.5, 36.3], places: [[大坂, 135.52, 34.69], [大垣, 136.61, 35.36], [岡崎, 137.16, 34.95], [長浜, 136.27, 35.38]], route: [大坂, 大垣, 岡崎], note: 正月15日より前に大垣城へ}
      # 【想像6】秀吉。記録：正月に家康を討つと決め、諸将に準備を命じた（kazumasa-30）。命令の中身の言葉だけ
      - 人物: 「正月には、家康を討つ」
        who: 秀吉想像
        imagined: true
        tone: 重い
        figure: null
        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵）"}
      # 天正地震：天正13年11月29日（岐阜県防災課）・西暦1586年1月18日（松浦律子 2011）
      # fact: kazumasa-12, kazumasa-26
      - 語り: その準備のさなか、天正13年11月29日の夜。西暦では、1586年1月のことです。中部から近畿の一帯を、大きな地震が襲いました。天正地震です。
        tone: 重い
        portrait: null
        background: {image: paintings/mikata_okazaki_castle_ndl_41.jpg, credit: "〔日本古城絵図〕三州岡崎城図（江戸時代、国立国会図書館蔵）"}
        card: {head: "天正13年11月29日", body: 天正地震（1586年1月）}
      # fact: kazumasa-12
      - 語り: 地震の研究者、松浦律子さんの2011年の論文では、その大きさは、マグニチュード7.8から8.0ほどと見積もられています。
        card: {head: "松浦律子さん 2011年", body: マグニチュード7.8〜8.0ほど}
      # 小松原琢（産総研 地質調査総合センター 2019）
      # fact: kazumasa-25
      - 語り: 産業技術総合研究所の小松原琢さんの2019年の報告では、この地震は、29日の夜と30日の夜に続けて起きた、「《双子の地震》」だった可能性も示されています。
        card: {head: "双子の地震？", body: 29日夜と30日夜}
      # fact: kazumasa-40
      - 語り: どの断層が動いたのかも、今も、研究者のあいだで説が分かれています。
