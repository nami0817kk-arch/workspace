# 型（ユーザーと決めた物語型）：1本に1つの「なぜ」＝「なぜ家康の右腕は、秀吉のもとへ走ったのか」を、再現ドラマ（場面を語りで描き、台詞も入れる）で掘る。
#   語り手は剣崎1人（つむぎは出ない）。最後の章で「その後」（松本・死・天守・改易・子孫）まで語り、冒頭の場面（岡崎城の夜と家康の「退出」）に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（10-24 ユーザー決定。story: true）。
# 冒頭：場面（0〜10秒に知らない事実＝家康の手紙の「退出」）→ずれ（秀吉との交渉役で、息子も大坂にいた）→「なぜ」1文→答えのかけら（2023年初公開の手紙）
#   →その後の予告（16日後の地震・天守の年代）→約束の1文→橋渡し（およそ1年前、於義丸の旅立ち）。あいさつ・章の予定・断り書きはしない。
# 通説・説の検証は第4章だけ（辞典の食い違い・呉座・本郷のスパイ説の否定と引き抜き・菅原の新説と本人の留保）。
# 大河「豊臣兄弟！」第40回（2026-10-18）で出奔が描かれたが、ドラマの台詞・創作は使っていない（ドラマの名前も語りに出さない）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/石川数正_facts_20261026.yaml、kazumasa-01〜51）にあるものだけ。行の上に `# fact: kazumasa-NN`。
#   カードに無い「誰でも知っている前置き」（徳川家の重臣・家康のそばに長く仕えた・小牧・長久手のあと和睦・秀吉がのちの豊臣秀吉・康長が子）は短く使い、# fact を付けない（知らない事実に数えない）。
#   日付は和暦を主に。出奔は「天正13年11月13日」（西暦の年を付けない。和暦の月日に西暦の年を付けた形は誤り）。地震は「天正13年11月29日」＋「西暦では1586年1月」だけ。
#   石高はカードに無いので言わない。伝承（玄蕃石・名医の昔話）は使わない（玄蕃石は残酷・名医は伝承）。帰雲城の300人は「と伝わります」。
#
# 台詞の決まり（ユーザー決定 10-24）：記録の言葉＋想像の台詞。
#   記録＝出どころを語りで言ってから `- 人物:`（who: 家康＝書状の一節。config の roles に足した）。現代語にした所は語りで「今の言葉にすると」と言う。
#   想像＝ (1)記録と食い違わない (2)新しい事実を足さない（気持ち・決意の言葉だけ） (3)1本8か所まで（この台本は6か所） (4)画面に「想像」の札 (5)人を貶めない。
#   各台詞のコメントに【記録】／【想像】と、食い違わない記録を書いた。数正の気持ちの台詞は、出奔の理由を言わせない（理由は記録に無い＝kazumasa-02）。
#
# 絵：paintings/ の既存の絵で仮置き（素材の置き場にあるものだけ）。松本城・天正地震・出奔の夜などの足りない場面は「AI絵：<英語の指示>」をコメントに。
