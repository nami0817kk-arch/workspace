sections:
  # ================================================================ 導入（冒頭 約1分40秒）
  - title: なぜ家康の右腕は、秀吉のもとへ走ったのか　天正13年 岡崎城
    background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
    # AI絵：a Japanese castle on a hill at night in winter, 1580s, a few torches, a small group of riders leaving through a gate, seen from far away, muted colors, painterly, no faces
    year: 1585
    lines:
      # 0〜10秒：場面から（あいさつなし）。日付は和暦のまま。西暦の年は付けない
      # fact: kazumasa-01
      - 語り: 徳川家康の右腕と呼ばれた男が、ある夜、岡崎城から消えました。天正13年11月13日のことです。
        tone: 重い
        card: {head: "天正13年11月13日", body: 岡崎城から消えた重臣}
      # 10秒以内の知らない事実：家康の北条氏規あて書状（高岡市立博物館蔵）の「退出」
      # fact: kazumasa-11
      - 語り: その15日後、家康は手紙の中で、この出来事を、「《退出》」という言葉で書いています。
        tone: しみじみ
        card: {head: "15日後の家康の手紙", body: 「退出」と書いた}
      - 語り: 男の名は、石川数正。家康のそばに、長く仕えてきた重臣です。
        portrait: {image: paintings/mikata_ishikawa_kazumasa_portrait.jpg, caption: "石川数正と伝わる武者（長篠合戦図屏風の一部）"}
      # fact: kazumasa-01
      - 語り: 向かった先は、家康と張り合っていた、羽柴秀吉のもとでした。のちの豊臣秀吉です。
        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵）"}
      # 10〜40秒：ずれ。取次（呉座勇一、『当代記』など）
      # fact: kazumasa-28
      - 語り: 実は、数正は、その秀吉との交渉を、徳川の側で受け持ってきた人でした。
        tone: 強調
        portrait: null
        card: {head: "数正の役目", body: 秀吉との交渉の窓口}
      # fact: kazumasa-29
      - 語り: 前の年、家康の子が秀吉のもとへ送られたときには、数正の2人の息子も、一緒に大坂へ行っています。
        background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
        # AI絵：Osaka Castle in the 1580s seen across the river, golden roof tiles, painterly, muted colors（豊期大坂図屏風は 2.6:1 で細い帯になるので外した）
        card: {head: "前の年", body: 数正の息子2人も大坂へ}
      - 語り: 息子たちまで秀吉のもとに置いていた男が、今度は、自分が秀吉の側へ身を移した。
        tone: しみじみ
      # 40〜80秒：「なぜ」を1文
      - 語り: なぜ、家康の右腕は、秀吉のもとへ走ったのか。
        tone: 疑問
        pause: 0.8
        background: {image: paintings/mikata_okazaki_castle_ndl_41.jpg, credit: "〔日本古城絵図〕三州岡崎城図（江戸時代、国立国会図書館蔵）"}
      # fact: kazumasa-02
      - 語り: 数正自身が、その理由を書き残した記録は、見つかっていません。
      # 答えのかけら（名詞1つ）：2023年初公開の織田信雄の書状（菅原義勝 2024）。答えそのものは言わない
      # fact: kazumasa-08
      - 語り: 手がかりは、2023年に、致道博物館で初めて公開された、《1通の手紙》にあります。
        tone: 強調
        card: {head: "2023年 初公開", body: 出奔のおよそ1か月前の手紙}
      # fact: kazumasa-10
      - 語り: その手紙から、数正の立場は、出奔の前の、わずか2週間で崩れていた、という読みが出てきました。
      # その後の予告（第5・6章）
      # fact: kazumasa-04
      - 語り: そして、出奔から16日後。大きな地震が、家康と秀吉の運命を揺さぶります。
        tone: 重い
        background: {image: paintings/hanbei_mino_map.jpg, credit: "《美濃国郡県人跡路程図》（19世紀）"}
        card: {head: "出奔の16日後", body: 大地震}
      # fact: kazumasa-17
      - 語り: 数正が建てたと言われてきた松本城の天守も、2025年の調べで、数正が亡くなったあとに建った、という結果が出ました。
        card: {head: "2025年の調べ", body: 天守は数正の死後に建った}
        background: {image: paintings/sanada_shinano_hiroshige2_1862.jpg, credit: "歌川広重（二代）《諸国六十八景 信濃 久米路橋》1862年"}
        # AI絵：Matsumoto Castle keep, black wooden walls, reflected in a moat, early morning mist, painterly, muted colors
      # 約束の1文
      - 語り: これは、主君のもとを去った男と、その家族が背負った、ひとつの「なぜ」の記録です。
        tone: しみじみ
        pause: 0.6
        portrait: {image: paintings/mikata_ishikawa_kazumasa_portrait.jpg, caption: "石川数正と伝わる武者（長篠合戦図屏風の一部）"}
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
      # 橋渡し：出奔のおよそ1年前（天正12年12月、於義丸が大坂へ）
      # fact: kazumasa-29
      - 語り: 話は、出奔のおよそ1年前にさかのぼります。家康の子が、秀吉のもとへ旅立つ日からです。
        portrait: null
        pause: 0.6

  # ================================================================ 第1章 人質と取次（天正12〜13年）
  - title: 数正の息子は、なぜ大坂にいたのか　天正12年 於義丸の旅立ち
    background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
    year: 1584
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 天正12年。家康は、尾張の小牧・長久手で、秀吉の大軍と戦いました。戦いのあと、両者は和睦します。
        card: {head: "天正12年", body: 小牧・長久手のあと和睦}
      # 昼間たかし（PRESIDENT Online 2026）：和睦の条件の要旨＝家康の実子と数正の実子を人質に
      # fact: kazumasa-29
      - 語り: その和睦の条件には、家康の子だけでなく、数正の子も、人質として出すことが含まれていた、と見られています。
        tone: 強調
      # fact: kazumasa-29
      - 語り: 天正12年12月。家康の次男、於義丸が、秀吉の養子として大坂へ向かいました。のちに結城家を継ぎ、越前の大名になる、結城秀康です。
        portrait: {image: paintings/mikata_yuki_hideyasu_portrait.jpg, caption: "結城秀康（於義丸）"}
        card: {head: "天正12年12月", body: 於義丸が秀吉の養子に}
      # fact: kazumasa-29
      - 語り: その列には、数正の息子、康長と康勝の姿も、ありました。
        portrait: null
        background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
        detail: {box: [0.3, 0.0, 0.7, 1.0], label: 大坂（豊臣期大坂図屏風の一部）}
        # AI絵：a small procession of samurai boys on horseback leaving a castle town in winter, 1580s Japan, seen from behind, muted colors, no faces
      # 取次（呉座勇一、アゴラ 2023。『当代記』など）
      # fact: kazumasa-28
      - 語り: 歴史学者の呉座勇一さんは、『当代記』などの記録をもとに、数正を徳川家の《取次》と見ています。秀吉との交渉の窓口です。
        background: {image: paintings/ieyasu_nagakute_yasunobu.jpg, credit: "狩野安信《長久手戦役の徳川家康像》17世紀（徳川美術館蔵）"}
        card: {head: "取次", body: 秀吉との交渉の窓口}
      - 語り: 秀吉の言葉を家康に伝え、家康の答えを秀吉に返す。戦のあとの、いちばん難しい役目でした。
      # 名乗り：菊地浩之（PRESIDENT WOMAN Online 2026）
      # fact: kazumasa-15
      - 語り: 系図研究者の菊地浩之さんによれば、このころの数正は、「数正」ではなく、「《康輝》」と名乗っていたといいます。
        card: {head: "当時の名", body: 康輝（やすてる）}
        background: {image: paintings/mikata_okazaki_castle_photo_2012.jpg, credit: "取り壊し前の岡崎城（古写真。写る天守は江戸時代のもの）"}
      # fact: kazumasa-15
      - 語り: 康輝の「康」は、家康の「康」。主君から、名の一字をもらった名前です。
        figure: {type: stats, title: 数正の名乗り（菊地浩之さんの整理）, items: [[天正の前半, 数正, 若いころからの名], [天正13年ごろ, 康輝, 家康の「康」], [出奔のあと, 吉輝, 秀吉の「吉」]], upto: 2}
      - 語り: 家康の名の一字を名乗る、家康の交渉役。その人が、秀吉と向き合っていたんです。
        figure: null
        tone: しみじみ
      - 語り: 家康の子と、家康の重臣の子。その両方が、秀吉のもとに置かれたんです。
        tone: しみじみ
        background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
        detail: {box: [0.3, 0.0, 0.7, 1.0], label: 大坂（豊臣期大坂図屏風の一部）}
      - 語り: 人質を出すとは、家の子を相手のもとに置いて、裏切らない証しにすることです。主君の子と並んで、自分の子を差し出す。それだけ、数正は徳川の要の人でした。
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
      # 【想像1】数正→息子たち。記録：康長・康勝が於義丸に従って大坂へ行った（kazumasa-29）。別れの言葉は記録に無い。気持ちだけ
      - 人物: 「康長、康勝。……体を、いとえよ」
        who: 数正想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/mikata_ishikawa_kazumasa_portrait.jpg, caption: "石川数正と伝わる武者（長篠合戦図屏風の一部）"}
      - 語り: 数正が、このとき息子たちに何を言ったのか。その言葉は、残っていません。
        portrait: null
        background: {image: paintings/mikata_okazaki_castle_ndl_41.jpg, credit: "〔日本古城絵図〕三州岡崎城図（江戸時代、国立国会図書館蔵）"}
