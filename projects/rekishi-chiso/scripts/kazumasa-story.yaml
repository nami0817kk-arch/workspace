      # fact: kazumasa-41
      - 語り: 実は、数正が城を出るおよそ3か月半前の夏にも、強い揺れがあった、という説があります。松浦さんが示したもので、三河や伊勢、京都が揺れたといいます。
      # fact: kazumasa-26, kazumasa-30
      - 語り: 岐阜県の防災の資料によれば、大垣城は、全壊して焼けました。秀吉が、正月に出向くと言っていた、あの城です。
        tone: 強調
        figure: {type: map, title: 天正13年 秀吉の徳川攻めの道, bounds: [135.3, 137.6, 34.5, 36.3], places: [[大坂, 135.52, 34.69], [大垣, 136.61, 35.36], [岡崎, 137.16, 34.95], [長浜, 136.27, 35.38]], route: [大坂, 大垣, 岡崎], note: 大垣城は全壊して焼けた}
        mark: {type: circle, at: 2}
        card: {head: "大垣城", body: 全壊して焼けた}
      # 鎌田浩毅（現代ビジネス 2025）：岡崎城・長浜城も大きく損壊
      # fact: kazumasa-26
      - 語り: 鎌田浩毅さんによれば、三河の岡崎城や、近江の長浜城も、大きく傷みました。数正が去ったばかりの、あの岡崎城です。
        figure: null
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
      # 帰雲城（岐阜県防災課・白川村）
