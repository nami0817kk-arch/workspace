      # fact: kazumasa-13
      - 語り: しかも松浦さんは、帰雲城を埋めたのは、本震の2日前に起きた、別の地震だった、という見方も示しています。
      # フロイスの書簡（1586年10月15日付、下関発。ケンペル『日本誌』英訳に全文引用）
      # fact: kazumasa-36
      - 語り: この地震を、ヨーロッパに書き送った人がいます。宣教師のルイス・フロイスです。1586年10月15日付け、下関から出した手紙に、こうあります。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》江戸時代"}
        card: {head: "フロイスの手紙", body: 1586年10月15日 下関から}
      # fact: kazumasa-36
      - 語り: 大地は、40日のあいだ、揺れ続けた。
        tone: 重い
        card: {head: "フロイス", body: 揺れは40日続いた}
      # fact: kazumasa-37
      - 語り: 近江の長浜は、1000軒ほどの町でした。大地が裂けて、町の半分が呑み込まれ、残りの半分は、火事で焼けた、とフロイスは書いています。
        detail: {box: [0.15, 0.1, 0.85, 0.8], label: 長浜の町（江戸時代の絵図）}
      - 語り: 長浜は、かつて秀吉が、初めて自分の城を持った町でもありました。
      # 長浜市（広報ながはま 2013年11月）：長浜町遺跡の発掘
      # fact: kazumasa-24
      - 語り: 長浜市の発掘では、波打って落ち込んだ地面の上に、厚い焼けた土の層が見つかりました。フロイスの手紙を、地面の下が裏付けたんです。
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
