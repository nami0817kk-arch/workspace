        card: {head: "長浜の発掘", body: 波打つ地面と厚い焼けた土}
      # fact: kazumasa-39
      - 語り: フロイスは、秀吉自身も、御殿が激しく揺れたので、急いで大坂へ引き上げた、と書いています。
      # fact: kazumasa-38
      - 語り: フロイスの手紙には、海辺のある町が、数日揺れ続けたあと海に呑まれ、城の跡だけが水の下に残った、という話も出てきます。
