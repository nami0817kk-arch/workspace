# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸城を出るとき、篤姫は「3日だけ」の立ち退きだと言いくるめられていたといいます。持っていったのは、身の回りの物だけ。そして二度と、城には戻りませんでした。
  それから15年あまり。勝海舟に「私の姉」と呼ばれて料理屋や芸者屋を歩き、シャツを着て、こうもり傘をついて出かけるようになった、元将軍の妻。
  篤姫は、江戸城を出たあと、どう生きたのか。当時の新聞、勝海舟の談話、昭和の本を並べてたどりました。
  この動画でわかること
  ・「3日だけ」と言われて出た江戸城と、170人から15人ほどに減った役人
  ・薩摩の仕送りを断った話と、記録の食い違い
  ・4歳で徳川を継いだ家達の育て方
  ・勝海舟が語った、料理屋・鉄瓶のお茶・シャツ・こうもり傘
  ・千駄ヶ谷の屋敷での最期と、記録で割れる亡くなった日
description_note: |-
  亡くなったときの様子は『東京日日新聞』明治16年11月22日の記事（『新聞集成明治編年史』第5巻に収録）と『幟仁親王日記』、明治の暮らしは勝海舟の談話『海舟座談』、城を出たときと仕送りの話は井原頼明『禁苑史話』（1944年）によります。
  年月日・年齢・年数は、自分で計算し直したものです。生まれは天保6年12月19日（1836年2月5日）として、満年齢と数え年を分けて言っています。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。天璋院とされる写真、家達・勝海舟の写真、西郷隆盛・徳川慶喜・和宮の肖像、江戸城の写真は、パブリックドメインのものです。サムネイルの絵も、AI による想像図です。

en:
  title: "How Did Atsuhime Live After Leaving Edo Castle? \"Only Three Days\" and Katsu Kaishu's \"Elder Sister\""
  description: |-
    When Atsuhime left Edo Castle in 1868, she was reportedly told it would be for only three days. She took only her personal belongings, and she never went back.
    Over the next fifteen years, the widow of the 13th shogun walked through restaurants and geisha houses with Katsu Kaishu, who introduced her as his "elder sister", and came to wear shirts and carry a Western umbrella.
    How did she live after leaving the castle? We follow a Meiji newspaper, Katsu Kaishu's talks, and later books.
    In this video you will learn:
    - "Only three days": leaving the castle, and her staff of officials cut from 170 to about 15
    - The story that she refused money from Satsuma, and how records differ
    - How she raised Iesato, who inherited the Tokugawa house at age four
    - Katsu Kaishu's stories: restaurants, tea from an iron kettle, shirts and umbrellas
    - Her death at the Sendagaya residence, and records that disagree on the date
    Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "\"Only Three Days\""
    - "Leaving Edo Castle, 1868"
    - "Did She Refuse Money from Satsuma?"
    - "Raising a Four-Year-Old Head of the Tokugawa"
    - "Katsu Kaishu's \"Elder Sister\""
    - "Her Last Days at Sendagaya, 1883"
    - "Summary: How Did Atsuhime Live?"

