# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。篤姫（天璋院）は、江戸城を出たあとどう生きたのか（1868〜1883）。2026-11-17 作成。公開の予定は 11/22 12:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の A その後型（幕末〜明治）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。大河ドラマの話はしない。
# 1本に1つの問い＝「篤姫は、江戸城を出たあとどう生きたのか」。主役は篤姫1人。答えの席＝15年あまりの暮らし（題名でもサムネでも明かさない）。
#   冒頭＝「3日だけの立ち退き」と言われて城を出た（atsuhime-50）→着替えと化粧道具だけ→二度と戻らない／勝海舟の「姉」として料理屋・芸者屋（25）／シャツと蝙蝠傘（27）／新聞「母と子のように」（54）。
#   和宮の回（10/29）と重ねない：和宮は勝の談話の1か所（55）だけ。大奥の暮らし・婚礼・家定との日々は前置き1行。
#   型の作り：序章／第1章 「3日だけ」の立ち退き（1868）／第2章 薩摩の仕送り（食い違い②）／第3章 家達を育てる（1868〜1882）／第4章 勝海舟の「姉」（明治の暮らし）／
#   第5章 千駄ヶ谷の最期（1883、食い違い①③）／まとめ（死のあとに残ったもの→答え→冒頭の「3日」に戻る）。
# 記録の食い違い：①亡くなった日と年齢（東京日日 20日午前8時・49歳／幟仁親王日記 20日8時30分／日本人名大辞典 12日・48歳／nippon.com 10日・49歳）
#   ②薩摩の仕送り（『禁苑史話』1944 年3万円・西郷も頼みに来た／サライ 2023 一切受け取らず／円は明治4年からの単位。同書は慶応4年正月の費用も「三千余円」と書く＝atsuhime-57）
#   ③同じ15年の描かれ方（東京日日の死亡記事＝読経のほか他念なし／勝海舟＝料理屋・芸者屋・シャツ・こうもり傘）。
# 計算（自分で計算し直した）：生まれ 天保6年12月19日＝1836年2月5日（天保6年は1835年の始まりなので数えは1835から）。
#   城を出た 慶応4年4月10日＝1868年5月2日 → 満32歳。亡くなった 1883年11月20日 → 満47歳・数え49歳（1883−1835＋1）。48は生まれを天保7年とした数え年（日本人名大辞典は天保7年生まれとする）。
#   城を出てから亡くなるまで 1868年5月→1883年11月＝15年6か月（15年あまり）。二丸の火事 慶応3年12月23日＝1868年1月17日 → 城を出るまで約3か月半。
#   家達 文久3年7月11日＝1863年8月24日生まれ → 家を継いだ慶応4年閏4月29日（1868年6月19日）に満4歳・数え6歳。1882年に数え20歳。
#   付き人 男の役人 総勢170人 → 約15人（女中は別に12人。170は男だけの数なので27とは言わない）。7月9日は1868年8月26日＝城を出て116日（閏4月があるので約4か月）。1864年の女中78人。入輿 安政3年11月11日＝1856年12月8日 → 家定の死 1858年8月14日まで2年たらず。
#   勝の勘定 明治20年＝1887年。一周忌 明治17年＝1884年。用箪笥の展示 2016年。円の単位 明治4年＝1871年（新貨条例）。
# 事実は事実カード（dev/output/rekishi-chiso/research/天璋院_facts_20261117.yaml、atsuhime-06〜56）にあるものだけ。行の上に `# fact: atsuhime-NN`。
#   使わないこと：死んだときの所持金（3円・6円の話。明治〜昭和の本に出どころが見つからない）・葬列の人数（1万人の出典は大河の紀行）・
#   鹿児島に帰らなかった理由（本人の言葉の記録が無い）・英字紙の盗賊の記事（天璋院の霊屋かは不明）・箱根や熱海の旅・倒れた日の細部（幟仁日記の「去二日」は読みが不確か）。
#   「と伝わる」「とされる」「といわれる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
