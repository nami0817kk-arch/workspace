sections:
  # ================================================================ 序章（冒頭30秒：3日だけ→身の回りの物だけ→戻らない→問い→勝の姉→シャツと傘→母と子）
  - title: 「3日だけ」のはずだった　1868年、江戸城を出た日
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1868
    lines:
      # fact: atsuhime-50
      - 語り: 江戸城を出るとき、篤姫は、《3日だけ》の立ち退きだと、言いくるめられていた、と伝わります。
        tone: 重い
      # fact: atsuhime-50
      - 語り: 持っていったのは、身の回りの物だけ。付き添いの女中たちも、着替えと化粧の道具くらいでした。
      - 語り: そして篤姫は、二度と、城には戻りませんでした。
        tone: しみじみ
      - 語り: 篤姫は、江戸城を出たあと、どう生きたのか。
        tone: 疑問
        pause: 0.5
      # fact: atsuhime-25
      - 語り: それからの15年あまりのあいだに、13代将軍の妻だった人は、勝海舟に《私の姉》と呼ばれて、料理屋や、芸者屋まで、歩くようになります。
      # fact: atsuhime-27
      - 語り: シャツを着て、こうもり傘を、杖にして。
      # fact: atsuhime-54
      - 語り: 亡くなったとき、新聞は書きました。仕える者には、主従というより、《母と子》のように思う者が多い、と。
        tone: しみじみ
      # fact: atsuhime-32
      - 語り: ふるさとの薩摩から届いた、仕送りの申し出を、断ったという話もあります。けれど、その金額の書き方には、おかしなところがあります。
      - 語り: 篤姫は、薩摩の島津家から、13代将軍、徳川家定に嫁ぎました。夫を亡くしたあとは、髪を下ろして、天璋院と呼ばれます。
      - 語り: 江戸城を出たとき、満32歳。なぜ「3日だけ」と言われたのか。そこから、篤姫の15年が始まります。
        tone: しみじみ
        pause: 0.6
      - 語り: その3か月半前。篤姫の住む江戸城の御殿が、焼け落ちます。
        pause: 0.6

  # ================================================================ 第1章 「3日だけ」の立ち退き（1868）
  - title: なぜ「3日だけ」と言われたのか　慶応4年、江戸城西丸
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1868
    lines:
      # fact: atsuhime-09
      - 語り: 慶応3年の暮れ、12月23日。西暦では1868年1月17日に、江戸城の二丸の御殿が、火事で焼けました。
        card: {head: "1868年1月", body: 二丸の御殿が焼ける}
      # fact: atsuhime-09
      - 語り: 篤姫は、城の庭へ逃れ、同じ江戸城の中の、西丸という御殿に移ります。
      # fact: atsuhime-09
      - 語り: 江戸東京博物館の畑尚子さんの、2015年の論文によれば、篤姫は、そのまま西丸で、城の明け渡しを迎えました。
        card: {head: "最後の住まい", body: 江戸城の西丸}
      # fact: atsuhime-10
      - 語り: 同じ論文には、城を出る4年前の元治元年に、篤姫に付いていた女中が《78人》いた、とあります。
        card: {head: "1864年", body: 篤姫付きの女中78人}
      - 語り: その正月、京都の南の鳥羽と伏見で、旧幕府の軍が敗れました。15代将軍の徳川慶喜は、船で江戸へ逃げ帰ります。
        tone: 重い
      # fact: atsuhime-53
      - 語り: 昭和19年に出た、井原頼明の『禁苑史話』によれば、慶喜は、江戸に着いた翌日の朝早く、篤姫に会いました。そして、朝敵の汚名を許されるよう、京都へ願い出てほしい、と頼んだ、といいます。
      # fact: atsuhime-12
      - 語り: 篤姫も、手紙を書きます。その相手のひとりが、官軍を率いる側の、薩摩の西郷隆盛でした。慶喜の命を助け、徳川の家を残してほしい、と訴えたんです。
        card: {head: "西郷隆盛への手紙", body: 慶喜の命と徳川の家を}
      # fact: atsuhime-12
      - 語り: この手紙が、西郷の気持ちを揺り動かした。研究者の畑尚子さんのそうした見方を、2022年のニッポンドットコムの記事が紹介しています。
      # fact: atsuhime-13
      - 語り: 同じ記事によれば、篤姫は、薩摩の海江田信義にも、ひそかに手紙を出して、城の明け渡しを延ばしてほしいと、願っていたらしい、といいます。
      - 語り: ふるさと薩摩の人たちに、嫁いだ徳川の家を、守ってくれと頼む。それが、城を出る前の篤姫の、仕事でした。
        tone: しみじみ
      # fact: atsuhime-50
      - 語り: それでも、城を出る日は来ます。同じ『禁苑史話』は、こう書きます。城を出るのを渋る篤姫に、老中たちは、ずいぶん手こずった。
      # fact: atsuhime-50
      - 語り: そこで、《3日間》だけ、と言いくるめて、ようやく承知させた。
        tone: 強調
      # fact: atsuhime-50
      - 語り: 3日の立ち退きなら、身の回りの物だけで足りる。付き添いの女中たちも、着替えと、化粧の道具くらいを用意して、出ていった、とあります。
        card: {head: "女中たちの支度", body: 着替えと化粧の道具くらい}
      # fact: atsuhime-11
      - 語り: 慶応4年4月10日、西暦1868年5月2日。篤姫は江戸城を出て、いまの竹橋駅の近くにあった、一橋家の屋敷に移りました。千代田区の観光協会も、この日付で紹介しています。
        card: {head: "1868年5月2日", body: 江戸城を出て一橋邸へ}
      - 語り: 翌日の4月11日、江戸城は、官軍に引き渡されました。
      # fact: atsuhime-52
      - 語り: 空になった大奥の座敷には、雪舟や狩野探幽の掛け軸が掛けられ、硯箱や、古今集が、きちんと並べてあった、と『禁苑史話』は書いています。
      # fact: atsuhime-52
      - 語り: 城を改めにきた尾張藩の者たちは、主な座敷のほかは、廊下の真ん中から四方を眺めるだけで、座敷の引き渡しを終えた、といいます。
      # fact: atsuhime-51
      - 語り: 3日のはずの立ち退き。けれど、何日たっても、篤姫を訪ねてくる人も、知らせも、無かった。
        tone: 重い
      - 語り: うるう4月の末、徳川の家は、4歳の田安亀之助、のちの徳川家達が継ぎ、5月には、駿府、いまの静岡に、70万石で移されることが決まります。
      # fact: atsuhime-34
      - 語り: 『禁苑史話』によれば、それまで篤姫に付いていた男の役人は、総勢《170人》。それが、15人ほどに減らされ、女中も、12人になりました。
        tone: 強調
        figure: {type: bars, title: 篤姫に付いた男の役人, bars: [[70万石の前, 170], [70万石のあと, 15]], labels: ["170人", "15人ほど"]}
      - 語り: 170人いた役人が、15人ほどに。新しい暮らしが、始まります。
        tone: しみじみ
        figure: null
      # fact: atsuhime-14
      - 語り: それでも篤姫は、手紙を書くのを、やめていません。城を出て4か月ほどたった、慶応4年7月9日。まだ新政府の軍と戦っていた、仙台藩主の伊達慶邦に、手紙を送っています。
        card: {head: "慶応4年7月", body: 仙台藩主に手紙}
      # fact: atsuhime-14
      - 語り: 同じ中身の手紙は、会津の松平容保にも、届いていました。
      - 語り: その暮らしぶりを聞きつけて、ふるさとの薩摩から、ある申し出が届きます。
        hook: true
      - 語り: やがて、その申し出のために、あの西郷隆盛までが、一橋の屋敷を訪ねてきます。
        tone: 重い
        hook: true

  # ================================================================ 第2章 薩摩の仕送り（食い違い②）
  - title: 薩摩の仕送りは本当に断ったのか　年3万円の食い違い
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1868
    lines:
      # fact: atsuhime-32
      - 語り: 『禁苑史話』は、こう書いています。薩摩の島津家は、篤姫の暮らしが苦しいのを察して、1年に、金3万円を贈りたい、と言ってきた。
        card: {head: "島津家の申し出", body: 1年に3万円}
      # fact: atsuhime-32
      - 語り: 篤姫は、固く断って、受け取らない。
        tone: 強調
      # fact: atsuhime-32
      - 語り: 西郷隆盛が、あらためて一橋の屋敷まで出向き、受け取ってほしいと頼んでも、とうとう聞き入れなかった、といいます。
        portrait: {image: paintings/saigo_takamori_portrait.jpg, caption: "西郷隆盛（キヨッソーネ系の肖像画。本人の写真は残っていない）"}
      # fact: atsuhime-43
      - 語り: 2023年の雑誌サライの記事も、島津家が生活費や養育費を援助しようとしたが、篤姫は一切受け取らなかった、と書いています。
        portrait: null
      # fact: atsuhime-43
      - 語り: ただ、この記事が参考に挙げているのは、百科事典と人名事典の3つだけ。いつ、誰が書き残した話なのかは、示されていません。
      # 食い違い②（円の単位は明治4年の新貨条例から。誰でも知る制度の年なので fact は付けない）
      - 語り: そして、もうひとつ、合わないことがあります。円というお金の単位が決まったのは、明治4年、1871年。篤姫が一橋の屋敷にいた慶応4年には、まだ、円はありません。
        tone: 強調
        figure: {type: stats, title: 薩摩の仕送り　書き方の違い, items: [[禁苑史話（1944年）, 年3万円, 西郷も頼みに来た], [サライ（2023年）, 一切受け取らず, 金額は書かない], [円という単位, 1871年から, 慶応4年には無い]], upto: 3}
      # fact: atsuhime-57
      - 語り: 同じ本は、慶応4年の正月に、城の非常口に格子戸を付けた費用も、3千円あまり、と円で書いています。
      - 語り: 昭和の書き手が、のちのお金の言い方に、置き換えたのかもしれません。もとの金額は、記録からは決められません。
        tone: しみじみ
      - 語り: ただ、どの書き方でも、篤姫が受け取らなかった、という筋は、変わりません。
        figure: null
      # fact: atsuhime-33
      - 語り: 同じ本によれば、篤姫は、のちに、築地にあった一橋家の下屋敷に移ります。
      # fact: atsuhime-33
      - 語り: そして、江戸城の二丸に預けておいた道具を、願い出て取り寄せ、要らない品は、売って、お金に換えていた、といいます。
        card: {head: "城の道具", body: 要らない品は売って金に}
      - 語り: 将軍の妻だった人が、自分の道具を、売りに出す。仕送りは、断ったままでした。
        tone: しみじみ
      # fact: atsuhime-23
      - 語り: けれど、篤姫が手元に置いた品には、ふるさとの物も、ありました。桜島を描いた掛け軸。薩摩切子の、酒の瓶。苗代川焼の人形。
        card: {head: "篤姫の手元の品", body: 桜島の掛け軸・薩摩切子}
      # fact: atsuhime-23
      - 語り: いまは、徳川記念財団が持っていて、2018年の東京の特別展に、篤姫が使った品として並びました。
      - 語り: 仕送りは断っても、ふるさとを、手放したわけでは、なかったのかもしれません。
        tone: しみじみ
      - 語り: そして篤姫は、残りの年月の多くを、ひとりの男の子のために使います。
        hook: true
      - 語り: その子に篤姫が着せたのは、徳川の当主とは思えない、ある着物でした。
        tone: 重い
        hook: true

  # ================================================================ 第3章 家達を育てる（1868〜1882）
  - title: 4歳の当主をどう育てたのか　家達と千駄ヶ谷の屋敷
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1871
    lines:
      - 語り: 田安亀之助、のちの徳川家達は、文久3年、1863年の生まれ。徳川の家を継いだとき、満で4歳、数えで6歳でした。
        portrait: {image: paintings/kakeizu_iesato_child.jpg, caption: "徳川家達の少年時代の写真"}
      # fact: atsuhime-15
      - 語り: 明治4年、1871年。家達は、駿府から東京へ出ます。やがて赤坂に落ち着いた家達の屋敷の中で、篤姫は、別の棟に暮らしていた、と2017年のサライの記事にあります。
        card: {head: "赤坂", body: 家達の屋敷の別棟に}
      # fact: atsuhime-16
      - 語り: 日本大百科全書は、篤姫が移り住んだ屋敷を、一橋家、紀伊藩、尾張藩、相良藩と並べています。赤坂の、もと相良藩の下屋敷に移ったのは、明治6年、1873年でした。
        portrait: null
        figure: {type: stats, title: 篤姫が移り住んだ屋敷, items: [[一橋家の屋敷, 1868年, 竹橋の近く], [紀伊藩・尾張藩の屋敷, そのあと, 日本大百科全書の順], [もと相良藩の下屋敷, 1873年, 赤坂]], upto: 3}
      - 語り: 城を出てから5年で、住まいは、何度も替わりました。
        figure: null
      # fact: atsuhime-29
      - 語り: その間、篤姫は、家達を、どう育てたのか。勝海舟は、篤姫の話の続きで、家達のことを、こう語っています。家達は、そういうふうにして育てたから、たいへん質素だ。
      # fact: atsuhime-29
      - 語り: 外に出るときでも、ふたこおりという、木綿のふだん着のほかは、着せなかった。
        tone: 強調
        card: {head: "家達の外出着", body: 木綿のふだん着だけ}
      - 語り: 徳川の当主に、木綿を着せる。篤姫が見ていたのは、もう将軍ではない、徳川の家の、これからでした。
        tone: しみじみ
      # fact: atsuhime-17
      - 語り: 明治10年、1877年。家達は、イギリスへ留学します。国立国会図書館の「近代日本人の肖像」によれば、留学は、明治15年までの5年。篤姫は、遠い国の当主の帰りを、待つことになります。
        card: {head: "1877〜1882年", body: 家達のイギリス留学}
      # fact: atsuhime-18, atsuhime-40
      - 語り: 家達が遠い国にいる間に、千駄ヶ谷に、徳川家の屋敷が出来上がりました。篤姫は、そこへ移ります。ここが、篤姫の、最後の住まいになりました。
        card: {head: "千駄ヶ谷の屋敷", body: 篤姫の最後の住まい}
      # fact: atsuhime-19
      - 語り: 明治15年、1882年。留学から戻った家達を、篤姫は、近衛家の泰子と、結婚させます。
        card: {head: "1882年", body: 家達と近衛泰子の結婚}
      - 語り: 篤姫自身も、将軍に嫁ぐ前に、近衛家の養女になっていました。自分と同じ近衛家から、家達の妻を迎えたんです。
        tone: しみじみ
      - 語り: 家達は、数えで20歳。4歳で家を継いだ男の子が、一家のあるじになりました。
        portrait: {image: paintings/kakeizu_iesato_peers.jpg, caption: "徳川家達（のちの貴族院議長の写真）"}
      - 語り: 家達が一家のあるじになるまでの年月。その間に、篤姫自身の暮らしも、大きく変わっていました。
        hook: true
        portrait: null
      - 語り: それを、いちばん詳しく語り残したのが、あの勝海舟です。
        hook: true

  # ================================================================ 第4章 勝海舟の「姉」（明治の暮らし）
  - title: 「私の姉」と呼んで連れ歩いた　勝海舟が語った篤姫
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1875
    lines:
      - 語り: 勝海舟が、晩年に語った言葉を、巌本善治が書き留めた本が、『海舟座談』です。篤姫の話は、明治31年、海舟が亡くなる2か月あまり前の聞き書きです。
        portrait: {image: paintings/yoshinobu_katsu_kaishu.jpg, caption: "勝海舟"}
      # fact: atsuhime-25
      - 語り: その中で、海舟は、篤姫のことを、こう語っています。天璋院の用で、あちこちへ行ったよ。八百善にも、二、三度。向島の柳屋へも、2度かね。
        card: {head: "海舟の談話", body: 八百善に二、三度・柳屋に2度}
        portrait: null
      # fact: atsuhime-25
      - 語り: 吉原にも、芸者屋にも行って、みんな、町の暮らしを、見せたよ。
        tone: 強調
      # fact: atsuhime-25
      - 語り: 連れて歩くとき、海舟は、篤姫を、《私の姉》と言っていました。
        card: {head: "海舟の呼び方", body: 「私の姉」}
      # fact: atsuhime-27
      - 語り: 明治43年に出た、戸川残花の『海舟先生』にも、海舟が、町をお忍びで歩くよう勧め、はじめて、料理屋の食事を差し上げた、と書かれています。
      # fact: atsuhime-27
      - 語り: 海舟の談話に戻ると、船宿で、篤姫に、火鉢の鉄瓶の湯で、お茶が一杯出されました。それが、たいそう、うまかった。
      # fact: atsuhime-27
      - 語り: 次に海舟が訪ねると、篤姫の部屋には、ちゃんと鉄瓶が掛かっていた。海舟が、それは下々のすることです、銀の瓶がたくさんあるのだから、と言うと、いや、これがいい、と答えたそうです。
        card: {head: "篤姫の部屋", body: 銀の瓶より鉄瓶}
      # fact: atsuhime-56
      - 語り: お風呂も、変わります。それまで篤姫の湯は、別に沸かして、羽二重の布で、こしたものでした。
      # fact: atsuhime-56
      - 語り: ところが、柳屋で風呂に入って、浴衣を出されると、着物はべたべたする、浴衣の方がいい、と言うようになった。
      # fact: atsuhime-27
      - 語り: 海舟の話では、シャツを見て、あれは何というものか、と聞き、2つ3つ買って帰ると、すぐに着た。はじめは変だったが、もう離せない、と言うようになった、といいます。
        card: {head: "明治の篤姫", body: 浴衣・シャツ}
      # fact: atsuhime-27
      - 語り: 海舟は、こうも語っています。わしの家にも、二、三度来た。こうもり傘を、杖にしてね。どうも、日傘よりもいい、と言っていたよ。
        card: {head: "海舟の家へ", body: こうもり傘を杖に}
      # fact: atsuhime-27
      - 語り: そして、こう付け加えます。そんなふうに、何でも、自分で改めた。こっちは、少しも、かかわっていない。
        tone: しみじみ
      # fact: atsuhime-28
      - 語り: のちには、自分で、縫い物もした。だいぶ上手になったから、縫ってあげた、と言って、海舟にも、羽織を1枚くれたそうです。
        tone: しみじみ
        card: {head: "篤姫の縫い物", body: 海舟に羽織を1枚}
      - 語り: 大奥で、女中78人にかしずかれていた人が、自分で針を持ち、羽織を縫って、人に贈る。
        tone: しみじみ
      # fact: atsuhime-55
      - 語り: 海舟は、和宮とのことも、語っています。和宮と天璋院は、はじめは、たいそう仲が悪かった。会うまではね。お付きの者のせいだよ。
        portrait: {image: paintings/kazu_portrait_toyobunka.jpg, caption: "和宮（昭和初期の刊行物より）"}
      # fact: atsuhime-55
      - 語り: それが、のちには、天璋院は、何ごとも、和宮と相談した、といいます。
        portrait: null
      # fact: atsuhime-26
      - 語り: ただ、慶喜のことは、最後まで嫌っていた、と海舟は語ります。慶喜が、女の方は、とても何も分かりはしない、と言ったのが、すぐに、奥へ伝わっていたからだ、と。
        tone: 重い
        portrait: {image: paintings/yoshinobu_portrait_kawamura_oil.jpg, caption: "徳川慶喜（川村清雄画）"}
      - 語り: 城を出る前、助けてほしいと頼んできた、あの慶喜です。
        portrait: null
      - 語り: そして、明治16年の秋。千駄ヶ谷の屋敷で、思いがけないことが起きます。
        hook: true
      - 語り: それは、湯殿で、始まりました。
        tone: 重い
        hook: true

  # ================================================================ 第5章 千駄ヶ谷の最期（1883、食い違い①③）
  - title: 湯殿で何があったのか　明治16年、千駄ヶ谷の最期
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1883
    lines:
      # fact: atsuhime-35
      - 語り: 明治16年、1883年11月22日の『東京日日新聞』は、こう伝えています。17日ごろだとか、千駄ヶ谷の住まいで、湯に入ったとき、湯殿で、つまずいた。
        card: {head: "東京日日新聞", body: 湯殿でつまずく}
      # fact: atsuhime-35
      - 語り: そして、にわかに、激しい中風になった。中風は、急に倒れて、手足がきかなくなる病です。
        tone: 重い
      # fact: atsuhime-35
      - 語り: 外国の医師まで呼んで、手を尽くしましたが、その甲斐もなく、11月20日の、午前8時に亡くなった。記事は、年は49と書いています。
        tone: 重い
        card: {head: "1883年11月20日", body: 午前8時に亡くなる}
      # fact: atsuhime-36
      - 語り: 有栖川宮幟仁親王の日記にも、知らせを聞いたことが書き留められています。こちらは、20日の、8時30分に亡くなった、とあります。
      # fact: atsuhime-41
      - 語り: ところが、亡くなった日と年は、のちの本で、ばらばらになります。日本人名大辞典は、11月12日に、48歳。2022年のニッポンドットコムの記事は、11月10日に、49歳。
        tone: 強調
        figure: {type: stats, title: 亡くなった日と年齢　記録の違い, items: [[東京日日新聞（当時）, 11月20日午前8時, 49歳], [日本人名大辞典, 11月12日, 48歳], [ニッポンドットコム（2022年）, 11月10日, 49歳]], upto: 3}
      # 食い違い①：自分で計算（天保6年12月19日＝1836年2月5日。数えは天保6年＝1835年から。辞典は天保7年生まれとする）
      - 語り: 生まれを天保6年とすると、数えで49歳、満で47歳。48歳は、生まれを1年遅い、天保7年とした数え方です。
      - 語り: 当時の新聞と日記は、ともに20日です。日付は、のちに書き写されるうちに、ずれていったのかもしれません。
        tone: しみじみ
        figure: null
      # fact: atsuhime-54
      - 語り: 新聞は、篤姫の人柄を、こう書いています。夫の家定が亡くなってからは、お経を読むほかに、心を移すこともなく、ひたすら、夫の冥福を祈った。
      # fact: atsuhime-54
      - 語り: 下々を、深く憐れんだので、仕える者たちも恩に感じて、主従というより、むしろ、母と子のように思う者が多い、と聞いた。
        tone: しみじみ
        card: {head: "新聞が書いた篤姫", body: 主従より母と子のよう}
      # 食い違い③：同じ15年の描かれ方
      - 語り: お経のほかは、何も考えなかった未亡人。そして、勝海舟と料理屋や芸者屋を歩き、シャツを着て、こうもり傘をついた人。
        figure: {type: stats, title: 篤姫の明治　記録の描き方, items: [[東京日日新聞（1883年）, お経のほか他念なし, 亡くなった時の記事], [勝海舟の談話, 料理屋・芸者屋・シャツ, 明治31年の聞き書き]], upto: 2}
      - 語り: 同じ人の15年が、記録によって、まるで違って見えます。新聞は、亡くなった人を悼む記事。海舟の話は、そばで見ていた人の、思い出話です。
        tone: しみじみ
      - 語り: どちらかが、うそというより、ひとりの人の、別の顔だったのでしょう。
        tone: しみじみ
        figure: null
      # fact: atsuhime-37
      - 語り: 明治16年12月5日。篤姫は、上野で葬られました。幟仁親王の日記には、この日の埋葬の式に、有栖川宮家から使いが出たことが記されています。
        card: {head: "1883年12月5日", body: 上野で埋葬の式}
      # fact: atsuhime-38
      - 語り: 葬儀のあと、会葬に来た人々へのお礼が、新聞に載りました。新聞を使って、略式ながらお礼を申し上げます、という文です。
      # fact: atsuhime-06
      - 語り: 墓は、上野の寛永寺。夫の家定の墓所に、並んで建っています。
        tone: しみじみ
        card: {head: "寛永寺", body: 夫の家定の墓所に並ぶ}
      # fact: atsuhime-30
      - 語り: 葬式の費用は、海舟が、徳川家のために預かって殖やしてきたお金からも、出ていました。その間に天璋院の葬式もあった、と海舟は語っています。
        portrait: {image: paintings/yoshinobu_katsu_kaishu.jpg, caption: "勝海舟"}
      - 語り: 篤姫が亡くなったあと、残されたものがあります。
        hook: true
        portrait: null
      - 語り: それは、130年あまりのちに、ある展示で、人の目に触れることになります。
        hook: true

  # ================================================================ まとめ（死のあとに残ったもの→答え→冒頭の「3日」に戻る）
  - title: まとめ：篤姫は、江戸城を出たあとどう生きたのか
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め"}
    year: 1884
    lines:
      # fact: atsuhime-31
      - 語り: 翌年、明治17年の一周忌に、勝海舟は、歌を詠みました。「くちもせで、のこれるこぞの、たもとともしらで、しぐれのまなく、ふるらん」。
        tone: しみじみ
        card: {head: "一周忌の海舟の歌", body: 「のこれる去年の袂」}
      - 語り: 朽ちもせずに残る、去年の袂。そうとも知らずに、時雨が、降りやまない。そんな歌です。
        tone: しみじみ
      # fact: atsuhime-21
      - 語り: 同じ1884年、徳川家とつながりの深い洋画家、川村清雄が、篤姫の肖像の下絵を描いています。その下絵は、いま、江戸東京博物館にあります。
      # fact: atsuhime-22
      - 語り: 亡くなって3年後の、明治19年。やまと新聞の付録、『近世人物誌』の第1号に、月岡芳年の描いた天璋院が、載りました。
        card: {head: "1886年", body: 近世人物誌の第1号に}
      # fact: atsuhime-24, atsuhime-46
      - 語り: そして、篤姫が手元に置いた、用箪笥。中には、文房具と、近衛家の人々や家達からの手紙が入っていました。この箪笥は、そのあとの、徳川宗家の夫人たちへ、受け継がれていきます。
        card: {head: "篤姫の用箪笥", body: 宗家の夫人へ受け継がれる}
      # fact: atsuhime-24
      - 語り: 2016年。亡くなってから、133年後。この箪笥は、江戸東京博物館と、徳川記念財団の企画展で、並べられました。
      # fact: atsuhime-44
      - 語り: 徳川の家では、戦前まで、篤姫の月命日に、好きだった物を供えていた、といいます。
        tone: しみじみ
      - 語り: 篤姫は、江戸城を出たあと、どう生きたのか。
        tone: 疑問
        pause: 0.6
      - 語り: ふるさとの仕送りは受け取らず、要らない城の道具は、売って、お金に換えた。4歳で家を継いだ家達には、木綿を着せて、育てた。
        tone: しみじみ
      - 語り: 勝海舟の姉として町を歩き、シャツを着て、こうもり傘をついた。自分で針を持ち、羽織を縫った。
        tone: しみじみ
      - 語り: 篤姫は、城を出ても、徳川の家からは、最後まで、出なかった人でした。
        tone: しみじみ
        pause: 0.6
      - 語り: 身の回りの物だけを持って出た、3日のはずの立ち退き。その3日は、15年あまりの、新しい暮らしになりました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
