  # ================================================================ 第3章 語られてきた話を記録で読む（検証はこの章だけ）
  - title: 旭は、本当に無理やり離縁させられたのか　前の夫と天正14年の朱印状
    background: {image: paintings/ieyasu_hamamatsu_hiroshige_1834.jpg, credit: "歌川広重《東海道五十三次之内 濱松 冬枯の図》1834年ごろ"}
    year: 1586
    lines:
      # 通説：愛知県 Aichi Now・濱田浩一郎（PRESIDENT Online 2026）
      # fact: asahi-01
      - 語り: 愛知県の観光のページには、旭について、こんな一文があります。すでに44歳、夫もいたが、無理やり離縁させられた。
