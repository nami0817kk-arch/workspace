sections:
  # ================================================================ 導入（冒頭 約1分40秒）
  - title: なぜ秀吉は、妹と母を家康に差し出したのか　天正14年 池鯉鮒の野
    background: {image: paintings/kira_okazaki_hiroshige.jpg, credit: "歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ"}
    # AI絵：a wide open field in Mikawa province in early summer, 1580s Japan, a long bridal procession of palanquins and attendants meeting a group of samurai, seen from far away, muted colors, painterly, no faces
    year: 1586
    lines:
      # 0〜10秒：場面から（あいさつなし）。44歳（岡崎市史 1926・渡辺世祐 1919）と、野原での受け渡し（家忠日記）
      # fact: asahi-03, asahi-08
      - 語り: 44歳の花嫁が、野原の真ん中で、兄の家来の手から、夫の家来の手へと、渡されました。
        tone: 重い
        card: {head: "44歳の花嫁", body: 野原で受け渡された}
      # fact: asahi-08
      - 語り: 天正14年5月11日。三河の池鯉鮒の、西の野でのことです。
        card: {head: "天正14年5月11日", body: 三河 池鯉鮒の西の野}
      # fact: asahi-08
      - 語り: 迎えに出た徳川の家臣、松平家忠は、その日の日記に、「西の野まで、請け取った」と記しました。
        tone: しみじみ
      - 語り: 花嫁の名は、旭。豊臣秀吉の妹です。嫁ぎ先は、徳川家康でした。
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）"}
      # fact: asahi-09
      - 語り: 輿は12丁、釣輿は15丁。付き従う女性と従者は、150人あまり。
        portrait: null
        card: {head: "嫁入りの行列", body: 輿12丁・釣輿15丁・150人あまり}
      # 10〜40秒：ずれ。前の夫がいた（asahi-01）
      # fact: asahi-01
      - 語り: けれど、この花嫁には、前の夫がいました。
        tone: 強調
      # fact: asahi-02
      - 語り: その夫が誰だったのか。記録は、ひとつに定まっていません。
      # fact: asahi-41
      - 語り: そして5か月後。今度は、秀吉の母、大政所が、同じ池鯉鮒を通って、三河の岡崎城へ入ります。
        portrait: {image: paintings/hidenaga_omandokoro.jpg, caption: "大政所（秀吉・秀長の母、江戸時代の肖像）"}
        background: {image: paintings/mikata_okazaki_castle_ndl_41.jpg, credit: "〔日本古城絵図〕三州岡崎城図（江戸時代、国立国会図書館蔵）"}
        card: {head: "5か月後", body: 母の大政所も三河へ}
      # fact: asahi-11
      - 語り: 表向きの理由は、「娘に会いたい」。けれど、同じ時代の日記は、その姿を、「《人質》」と書きました。
        tone: 重い
      # 40〜80秒：「なぜ」を1文
      - 語り: なぜ秀吉は、妹と母を、家康に差し出したのか。
        tone: 疑問
        pause: 0.8
        portrait: null
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
      # 答えのかけら：天正14年5月24日付の秀吉の朱印状（八幡和郎・濱田浩一郎 2026 が引く）。婚礼（14日）の10日後。答えそのもの（誰が望んだか）は第3章で
      # fact: asahi-38
      - 語り: 手がかりは、婚礼の10日後に、秀吉自身が出した、《1通の朱印状》にあります。
        tone: 強調
        card: {head: "天正14年5月24日", body: 秀吉の朱印状}
      # fact: asahi-38
      - 語り: そこには、縁組をしきりに望んだのは誰だったのか、秀吉の言い分が書かれていました。
      # その後の予告（第5章）
      # fact: asahi-05, asahi-16
      - 語り: 旭が家康の妻でいたのは、4年足らず。48歳で亡くなったとき、徳川の家は、その死を伏せました。
        tone: 重い
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "48歳の死", body: 徳川は喪を伏せた}
      # fact: asahi-26
      - 語り: 旭が眠る京都の寺が、初めて一般に公開されたのは、2021年の秋。そこには、旭の肖像も並びました。
        card: {head: "2021年の秋", body: 京都の寺が初めて公開}
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）"}
      # 約束の1文
      - 語り: これは、兄の天下取りのさなかに、東へ送られた妹と母の、ひとつの「なぜ」の記録です。
        tone: しみじみ
        pause: 0.6
        background: {image: paintings/kira_okazaki_hiroshige.jpg, credit: "歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ"}
      # 橋渡し：輿入れの半年ほど前（天正13年の冬）
      - 語り: 話は、輿入れの半年ほど前にさかのぼります。家康が、秀吉のもとへ、なかなか来ようとしなかったころです。
        portrait: null
        pause: 0.6

  # ================================================================ 第1章 輿入れ（天正14年4〜5月）
  - title: 44歳の花嫁は、なぜ野原で渡されたのか　天正14年 池鯉鮒
    background: {image: paintings/hidenaga_komaki_nagakute_screen.jpg, credit: "《小牧長久手合戦図屏風》18世紀（豊田市郷土資料館保管）"}
    year: 1586
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）。数正の出奔は2文まで（19:00 の回と重ねない）
      - 語り: 天正12年。家康と秀吉は、尾張の小牧・長久手で戦い、そのあと和睦しました。
        card: {head: "天正12年", body: 小牧・長久手のあと和睦}
      - 語り: けれど家康は、秀吉のいる大坂へ、あいさつに出向こうとはしません。天正13年の冬には、家康の重臣の石川数正が、秀吉のもとへ走りました。
        background: {image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg, credit: "《龍城図》岡崎城（江戸時代）"}
      - 語り: 張りつめたままの、徳川と秀吉。そこへ持ち上がったのが、縁組の話でした。秀吉の妹の旭を、家康の妻に迎える話です。
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）"}
      # 黒田基樹（プレジデントオンライン 2026）
      # fact: asahi-07
      - 語り: 歴史学者の黒田基樹さんが、2026年にプレジデントオンラインで書いた記事によれば、婚礼は、はじめ4月28日の予定でした。
        portrait: null
        background: {image: paintings/hideyoshi_osaka_zu_byobu.jpg, credit: "《豊臣期大坂図屏風》1607〜1615年ごろ（エッゲンベルク城蔵）"}
