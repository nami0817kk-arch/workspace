        background: {image: paintings/mikata_hamamatsu_hiroshige_1855.jpg, credit: "歌川広重《東海道五十三次之内 浜松》1848年ごろ"}
        portrait: {image: paintings/ieyasu_portrait_toshodaigongen.jpg, caption: "徳川家康（伝 狩野探幽画）"}
      # fact: asahi-49
      - 語り: 別居だったから、愛情が薄かった。そう見る人もいます。けれど濱田さんも、それは推測にとどまる、と断っています。ふたりの間の言葉は、何も残っていません。
        tone: しみじみ
        background: {image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg, credit: "歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ"}
        portrait: null
        hook: true
      - 語り: 有馬の湯から、8か月。天正18年の正月が、やってきます。秀吉が、関東の北条を攻めようとしていた、その正月でした。
        tone: 重い
        hook: true

  # ================================================================ 第5章（最後）その後：旭の死と2つの寺 ＋ 冒頭に戻る締め
  - title: まとめ：48歳の旭は、どこに眠っているのか　南明院と瑞龍寺
    background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
    year: 1590
    lines:
      # 岡崎市史 1935・渡辺世祐 1919・濱田 2026（徳川幕府家譜・幕府祚胤伝）
      # fact: asahi-05
      - 語り: 天正18年1月14日。旭は、亡くなりました。48歳でした。
        tone: 重い
        card: {head: "天正18年1月14日", body: 48歳で亡くなる}
      # fact: asahi-05
      - 語り: 1935年の『岡崎市史』は、京の聚楽第で亡くなった、と書きます。多くの書物が、そう伝えています。
      # 食い違い③：亡くなった場所（岡崎市史 1935 が雍州府志を引く）
      # fact: asahi-17
      - 語り: ところが、『雍州府志』という書物は、伏見で亡くなった、としています。
        tone: 疑問
        figure: {type: stats, title: 旭が亡くなった場所, items: [[聚楽第, 岡崎市史・多くの書物, 京の秀吉の屋敷], [伏見, 雍州府志, 岡崎市史が引く]], upto: 2}
      # fact: asahi-17
      - 語り: 『岡崎市史』は、旭が最後にいつ京へ上ったのかも、記録が無い、としています。どこで最期を迎えたのかさえ、記録が割れているんです。
        figure: {type: stats, title: 旭が亡くなった場所, items: [[聚楽第, 岡崎市史・多くの書物, 京の秀吉の屋敷], [伏見, 雍州府志, 岡崎市史が引く]], upto: 2}
      # 当代記（岡崎市史 1935 が引く）・渡辺 1919
      # fact: asahi-16
      - 語り: 『当代記』という記録には、こうあります。家康公の奥方が、京都で病で亡くなった。小田原へ兵を出すころだったので、隠しておかれた。
        figure: null
        background: {image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg, credit: "歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ"}
        card: {head: "当代記", body: 小田原への出陣のころで、隠した}
      # 烈祖成績・濱田 2026
      # fact: asahi-48
      - 語り: 徳川の家臣たちが、関東へ兵を出そうとしていた、その時でした。家康が、葬儀のために京へ上ることは、ありませんでした。
        tone: しみじみ
      - 語り: 妻の死が、戦の前の秘密になった。旭の死は、最後まで、兄と夫の戦の都合の中にありました。
        tone: しみじみ
      # 烈祖成績（江戸時代の編纂物。カードは1つの出どころ）→「伝わります」
      # fact: asahi-50
      - 語り: 旭が亡くなった翌日。家康の子の、12歳の秀忠が、京の聚楽に上がりました。そのとき大政所は、自分の手で、秀忠の髪を結い直した、と伝わります。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
        portrait: {image: paintings/oichi_hidetada.jpg, caption: "徳川秀忠（江戸時代）"}
        card: {head: "翌日", body: 大政所、秀忠の髪を結う}
      # 【想像5】大政所。記録：旭の死の翌日に秀忠の髪を結い直したと伝わる（asahi-50）。気持ちの言葉だけ（旭の名も出来事も足さない）
      - 人物: 「……さあ、これで、よい」
        who: 大政所想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/hidenaga_omandokoro.jpg, caption: "大政所（秀吉・秀長の母、江戸時代の肖像）"}
      - 語り: 娘を亡くした次の日に、娘の夫の子の髪を整える。その手が何を思っていたのかは、どこにも書かれていません。
        portrait: null
        tone: しみじみ
      # 岡崎市史 1935・渡辺 1919・烈祖成績
      # fact: asahi-06
      - 語り: 旭は、京都の東福寺の塔頭、南明院に葬られました。のちに旭が南明院とも呼ばれるのは、このためです。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        # AI絵：a quiet Zen sub-temple in Kyoto in autumn, a small stone five-tiered pagoda grave on a high spot in the garden, red maple leaves, soft light, painterly, no people
        card: {head: "東福寺 南明院", body: 旭の墓所}
      # おにわさん（2021）
      # fact: asahi-28
      - 語り: ただ、南明院の創建は、室町時代の応永21年、1414年。足利義持によるもので、旭のために建てた寺では、ありません。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 語り: 旭は、もとからあった寺に、迎え入れられたことになります。
      # おにわさん（2021）・京都風光
      # fact: asahi-27
      - 語り: 境内の高い所には、旭の五輪塔が残ります。方丈には、徳川家の歴代の位牌が、まつられています。
      # おにわさん（2021）・京都古文化保存協会
      # fact: asahi-26
      - 語り: ふだんは公開されていないこの寺が、初めて公開されたのは、2021年の秋。第57回の京都非公開文化財特別公開で、旭の肖像画と、徳川秀忠の書状が並びました。
        tone: 強調
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）"}
        card: {head: "2021年の秋", body: 南明院、初めての公開}
      - 語り: 旭が亡くなって、430年あまり。その寺の門が、ようやく開いたんです。
        tone: しみじみ
      # ニッポン旅マガジン（2022）・静岡県『名蹟勝地』（1921）
      # fact: asahi-06
      - 語り: 旭の骨は分けられ、駿府の瑞龍寺にも墓が築かれました。1921年の静岡県の案内書は、苔むした五輪の大きな石塔が、その墓だ、と案内しています。
        portrait: null
        background: {image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg, credit: "歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ"}
        # AI絵：an old mossy stone five-tiered pagoda grave behind a small Zen temple in Shizuoka, quiet morning, painterly, no people
      # ニッポン旅マガジン（2022）：駿国雑志（1843）の開基・秀吉の墓参
      # fact: asahi-29
      - 語り: 江戸時代の地誌『駿国雑志』は、旭を、この寺を開いた人としています。秀吉は、小田原攻めに向かう途中、この墓に参った、と伝わります。
        portrait: {image: paintings/hideyoshi_portrait_osaka_city_1600.jpg, caption: "豊臣秀吉（大阪市立美術館蔵、1600年）"}
      # 静岡市大河ドラマ活用推進協議会（2023）
      # fact: asahi-24
      - 語り: 瑞龍寺には、旭が亡くなって半年あまりのちの、天正18年8月22日付けの、秀吉の朱印状が残っています。
        background: {image: paintings/ieyasu_kunozan_kunitsuna_1863.jpg, credit: "歌川国綱《東海道名所之内 久能山》1863年"}
        portrait: null
        card: {head: "天正18年8月22日", body: 瑞龍寺に残る秀吉の朱印状}
      # fact: asahi-22
      - 語り: 2023年4月12日。静岡市は、瑞龍寺に伝わる旭ゆかりの品5点を、市の有形文化財に指定しました。
        tone: 強調
        card: {head: "2023年4月12日", body: 瑞龍寺の5点が市の文化財に}
        figure: {type: stats, title: 瑞龍寺関係資料（静岡市の文化財 2023年）, items: [[打敷, 旭の小袖を仕立て直したと伝わる, 仏前の敷物], [豊臣秀吉朱印状, 天正18年8月22日, 旭の死の半年あまり後], [由緒書（覚）, 寛永11年6月, 寺と旭の結びつき]], upto: 3}
      # fact: asahi-23
      - 語り: その一つ、仏前に掛ける打敷は、旭が身に着けた小袖を、仕立て直したものと伝わります。
        figure: {type: stats, title: 瑞龍寺関係資料（静岡市の文化財 2023年）, items: [[打敷, 旭の小袖を仕立て直したと伝わる, 仏前の敷物], [豊臣秀吉朱印状, 天正18年8月22日, 旭の死の半年あまり後], [由緒書（覚）, 寛永11年6月, 寺と旭の結びつき]], upto: 3}
        # AI絵：an old Japanese silk altar cloth with a woven crest pattern, laid on a dark wooden altar table, soft light, close-up, no text
      # fact: asahi-25
      - 語り: 寺の由緒を書いた覚え書きは、寛永11年、1634年の6月のもの。寺と旭の結びつきを書き留めた、江戸の初めの記録です。
        background: {image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg, credit: "歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ"}
        figure: null
      # 静岡新聞（2022）
      # fact: asahi-33
      - 語り: 2022年には、瑞龍寺の檀家の有志が、創建460年と、旭の没後430年に合わせて、『瑞龍寺史』をまとめています。
      - 語り: 没後430年。地元の人たちは、今も、旭を寺の始まりの人として、語り継いでいるんです。
        tone: しみじみ
      # 三溪園保勝会・文化庁（旧天瑞寺寿塔覆堂、1931年 重要文化財）
      # fact: asahi-32
      - 語り: 母の大政所にも、いまに残るものがあります。天正19年、1591年。秀吉は、病から回復した母の長寿を祈って、生きているうちの墓、寿塔を建てました。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        portrait: {image: paintings/hidenaga_omandokoro.jpg, caption: "大政所（秀吉・秀長の母、江戸時代の肖像）"}
        card: {head: "天正19年", body: 大政所の寿塔}
      # fact: asahi-32
      - 語り: その寿塔を覆っていた建物は、いま、横浜の三溪園にあり、国の重要文化財になっています。
        card: {head: "三溪園", body: 寿塔の覆堂（重要文化財）}
        # AI絵：a small ornate wooden Momoyama-period hall with a curved roof standing among trees in a Japanese garden, autumn, soft light, painterly, no people
      - 語り: 娘の旭は、母より先に亡くなりました。母の長寿を祈る塔が建ったのは、その翌年です。
        tone: しみじみ
      # 締め：冒頭の場面（池鯉鮒の西の野）と問いに戻る
      # fact: asahi-08
      - 語り: 天正14年5月11日。池鯉鮒の西の野で、44歳の花嫁は、兄の家から、夫の家へ渡されました。
        tone: しみじみ
        portrait: null
        background: {image: paintings/kira_okazaki_hiroshige.jpg, credit: "歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ"}
        card: {head: "天正14年5月11日", body: 池鯉鮒の西の野}
      - 語り: なぜ秀吉は、妹と母を差し出したのか。母については、秀吉の書状と、同じ時代の日記が答えています。家康を京へ呼ぶための、証人でした。
        background: {image: paintings/mikata_okazaki_castle_ndl_41.jpg, credit: "〔日本古城絵図〕三州岡崎城図（江戸時代、国立国会図書館蔵）"}
        card: {head: "母は", body: 家康を京へ呼ぶための証人}
        tone: しみじみ
      - 語り: 秀吉は、ふたりを差し出して、家康を、自分の家臣の列に加えました。
      - 語り: けれど妹については、無理やり別れさせたという話と、家康の側が望んだという秀吉の手紙が、今も並んでいます。
        background: {image: paintings/ieyasu_hamamatsu_hiroshige_1834.jpg, credit: "歌川広重《東海道五十三次之内 濱松 冬枯の図》1834年ごろ"}
        card: {head: "妹は", body: 無理やりか、家康の望みか}
        tone: しみじみ
      - 語り: 44歳で野原を渡り、48歳で、その死を伏せられた人。
        tone: しみじみ
      - 語り: 旭自身の言葉は、一つも残っていません。残ったのは、京都と駿府の、ふたつの墓です。
        portrait: {image: paintings/hidenaga_asahihime.jpg, caption: "朝日（秀吉・秀長の妹、江戸時代の肖像）"}
        tone: しみじみ
        pause: 0.8

