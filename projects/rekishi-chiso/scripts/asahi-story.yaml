# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  天正14年5月11日。三河の池鯉鮒の野原で、44歳の花嫁が、兄の家来から夫の家来へと渡されました。豊臣秀吉の妹、旭です。嫁ぎ先は、徳川家康でした。
  5か月後には、秀吉の母、大政所も三河へ下ります。表向きは「娘に会いたい」。けれど同じ時代の日記は、その姿を「人質」と書きました。
  なぜ秀吉は、妹と母を、家康に差し出したのか。
  この動画でわかること
  ・婚礼の10日後に秀吉が出した朱印状と、「縁組を望んだのは家康の側」という読み
  ・前の夫は誰だったのか。2つの説と、100倍違う見返りの話
  ・大政所の三河下りの日々と、「薪の山」の話の出どころ
  ・48歳の死が伏せられたわけと、2021年に初めて公開された寺、2023年に文化財になった品
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（秀吉の朱印状・書状、『家忠日記』『宇野主水日記』『当代記』など）を語りで示してから読んでいます。

en:
  title: "Asahi-hime: Why Did Hideyoshi Send His Sister and His Mother to Ieyasu?"
  description: |-
    On the 11th day of the 5th month of Tensho 14, in a field at Chiryu in Mikawa, a 44-year-old bride was handed over from her brother's men to her husband's men. She was Asahi, the younger sister of Toyotomi Hideyoshi, and the groom was Tokugawa Ieyasu.
    Five months later Hideyoshi's mother, Omandokoro, also went to Mikawa. Officially she wanted to see her daughter; a diary of the time called her a hostage.
    Why did Hideyoshi send his sister and his mother to Ieyasu?
    In this video you will learn:
    - Hideyoshi's red-seal letter written ten days after the wedding, and the reading that it was Ieyasu's side that wanted the marriage
    - Two different names for Asahi's first husband, and two rewards that differ a hundredfold
    - Omandokoro's weeks at Okazaki Castle, and where the "pile of firewood" story comes from
    - Why her death at 48 was kept secret, the Kyoto temple first opened to the public in 2021, and the items designated cultural properties in 2023
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Did Hideyoshi Send His Sister and Mother? A Field at Chiryu"
    - "Why Was the 44-Year-Old Bride Handed Over in a Field? The Wedding of 1586"
    - "Why Send His One and Only Mother? Omandokoro in Okazaki"
    - "Was Asahi Really Forced to Divorce? Her First Husband and Hideyoshi's Letter"
    - "Why Did Lady Suruga Ride Through the Night? Sunpu and Kyoto"
    - "Where Does Asahi Rest? Nanmeiin and Zuiryuji"

