# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml を写した）。旭姫（秀吉の妹）と大政所（秀吉の母）。2026-10-26 下書き（ユーザーに見せる前。reading-ok・approve はまだ）。
# 公開の予定は 10/27 12:00。同じ日の 19:00 は石川数正の本編（scripts/kazumasa-story.yaml）。数正の出奔は第1章の前置きの2文だけにして、中身を重ねない。
# 型（ユーザーと決めた物語型）：1本に1つの「なぜ」＝「なぜ秀吉は、妹と母を家康に差し出したのか」を、再現ドラマ（場面を語りで描き、台詞も入れる）で掘る。
#   主役は旭（44歳で家康に嫁ぎ、48歳で亡くなるまで）。語り手は剣崎1人（つむぎは出ない）。
#   最後の章で「その後」（死・喪を伏せた・南明院と瑞龍寺・大政所の寿塔）まで語り、冒頭の場面（池鯉鮒の西の野）に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（10-24 ユーザー決定。story: true）。
# 冒頭：場面（0〜10秒に知らない事実＝44歳の花嫁が野原で受け渡された）→ずれ（前の夫がいた・5か月後に母も「人質」として）→「なぜ」1文
#   →答えのかけら（婚礼の10日後の秀吉の朱印状）→その後の予告（喪を伏せた・2021年に初公開の寺）→約束の1文→橋渡し（輿入れの半年ほど前）。
#   あいさつ・章の予定・断り書きはしない。
# 通説・説の検証は第3章だけ（無理やりの離縁・前の夫の2つの説・朱印状の「懇望」・薪の山の話）。
# 記録の食い違いを並べたのは3か所：①前の夫（佐治日向守／副田吉成、500石／5万石、自害／出家）②縁組を望んだのは誰か（通説／朱印状）③亡くなった場所（聚楽第／伏見）。
#   薪の山の話は、江戸時代の書物の話と『岡崎市史』の判断を並べる形で「伝承」として言った（図は出さない）。
# 大河「豊臣兄弟！」第40〜41回で描かれたが、ドラマの台詞・創作は使っていない（ドラマの名前も語りに出さない）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/旭姫_facts_20261026.yaml、asahi-01〜51）にあるものだけ。行の上に `# fact: asahi-NN`。
#   カードの中で重複の疑いのある組（11と40・13と42・16と48・18と38）は、言う中身に近いほうの ID を付けた。
#   カードに無い「誰でも知っている前置き」（小牧・長久手のあと和睦・家康がなかなか上洛しない・数正の出奔・家康が大坂で臣従・小田原攻め）は短く使い、# fact を付けない。
#   数字は出どころの文にあるものだけ。『家忠日記』のくずし字を担当が読んだ数（3000貫など）は使わない。
#   亡くなった場所の食い違いは、カード（asahi-17）にある聚楽第と伏見だけ。有馬は前の年の湯治（asahi-15）としてだけ言う（有馬で亡くなったという記録はカードに無い）。
#   法名（南明院光室總旭大姉など）は読みが割れるので声にしない。多伊城も読みを確かめられないので「但馬の城」と言う。
#
# 台詞の決まり（ユーザー決定 10-24）：記録の言葉＋想像の台詞。
#   記録＝出どころを語りで言ってから `- 人物:`（who: 秀吉書状＝天正14年の朱印状・書状の一節。config の roles に足した）。現代語にした所は語りで「今の言葉にすると」と言う。
#   日記（『家忠日記』『宇野主水日記』『当代記』）は語りの中で読む（日記の書き手の声は作らない）。
#   想像＝ (1)記録と食い違わない (2)新しい事実を足さない（気持ちの言葉だけ） (3)1本8か所まで（この台本は5か所） (4)画面に「想像」の札 (5)人を貶めない。
#   各台詞のコメントに【記録】／【想像】と、食い違わない記録を書いた。家康の気持ちの台詞は作らない（夫婦仲の記録が無い＝asahi-49）。
#
# 絵：paintings/ の既存の絵で仮置き（素材の置き場にあるものだけ）。池鯉鮒の野・輿入れの行列・夜の早駆け・南明院・瑞龍寺などの足りない場面は「AI絵：<英語の指示>」をコメントに。
#   旭の肖像は hidenaga_asahihime.jpg（南明院殿の賛のある縦長の肖像。738x2400）、大政所は hidenaga_omandokoro.jpg。
# 広告の配慮：前の夫の最期は「自ら命を絶った」まで。薪の話は「火を放つ構え」まで（焼き殺す等は言わない）。死は「亡くなった」。
