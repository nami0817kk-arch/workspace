#   - 秀吉「そうであれば、二人といない母を、浜松まで行かせよう。馬に乗る供も、一人も付けずに、そちらへ送ろう」……天正14年9月の書状（岡崎市史 別巻下巻 1935 の引用「左候者二人與無之母於濱松迄相越可申候。馬乘一人不添可進候」、asahi-39）。今の言葉にした
#   - 秀吉「家康は、縁組のことまで、いろいろと、しきりに望んできた」……天正14年5月24日付の朱印状（「家康の事、種々縁辺等の儀迄懇望せしめ候」、八幡和郎・濱田浩一郎 2026 が引く、asahi-38）。今の言葉にした。原文も語りで読む
