        figure: {type: stats, title: 天正14年 旭の婚礼の日取り, items: [[はじめの予定, 4月28日, 使者と起請文でもつれる], [一日ずつ延びる, 5月9日・10日, 黒田基樹さんの紹介], [池鯉鮒で受け渡し, 5月11日, 家忠日記]], upto: 3}
      - 語り: 花嫁の来る日が、一日ずつ先へ延びていく。送る側にとっても、迎える側にとっても、気の張る初夏でした。
        figure: null
        tone: しみじみ
      # 渡辺世祐『豊太閤と其家族』（1919）
      # fact: asahi-09
      - 語り: 大正8年、1919年に出た、渡辺世祐の『豊太閤と其家族』は、このときの行列を、こう記します。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
      # fact: asahi-09
