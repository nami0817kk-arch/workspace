#     宇野主水日記「御證人之躰也。面向ハ御息女ニ逢被申度ニ付而」／当代記「家康公妻室於京都病死給。小田原爲出勢比之間令隱密」／岡崎市史 1935「此事の實否は明ならず」「恐く事實にあらざるべし」
