# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  天皇のそばにまつられていた神鏡は、火事で、形を失いました。1040年の秋のことです。残ったのは、鏡だった破片と、金属の粒でした。
  三種の神器。剣と、鏡と、勾玉。天皇でさえ見たことがない、とよく言われる宝です。
  盗まれ、沈み、焼け、偽物だと言われた3つの宝は、本当に、今も、そこにあるのでしょうか。
  この動画でわかること
  ・668年に草薙剣が盗まれ、686年に「祟り」として熱田へ送られた、日本書紀の記事
  ・宮中の神鏡が960年・1005年・1040年に焼けた記録と、3枚あった鏡の話
  ・壇ノ浦で沈んだ宝剣と、浮かんだ勾玉の箱。記録ごとに違う書き方
  ・南北朝の「偽物」の神器、1443年に奪われた勾玉が戻るまでの15年
  ・江戸時代の熱田の書き付け、1945年の昭和天皇の言葉、2019年の剣璽等承継の儀
description_note: |-
  原典は、国立国会図書館デジタルコレクションの公開本（国史大系・群書類従・史籍集覧ほか）と、ウィキソースの翻刻で読みました。古い活字本の字は、画像で確かめています。
  1005年・1040年の神鏡の記事は、斎木涼子「内侍所神鏡をめぐる儀礼」（洛北史学19、2017年）が引く『小右記』『春記』によります。木戸幸一日記は、辻田真佐憲さんの記事の引用で読みました。
  熱田の剣を見たという話は、玉木正英『玉籤集』の裏書の伝えで、明治の栗田寛『神器考証』などの引用によります。書かれた年は分かっておらず、事実として確かめられたものではありません。
  神器の現在の姿を示す画像はありません。画面の箱・社殿・海などは、画像生成AIで作った想像上のイメージで、実在の神器や写真ではありません。絵は、絵巻・浮世絵・名所図会などのパブリックドメインの作品（ウィキメディア・コモンズ）です。

en:
  title: "The Three Sacred Treasures of Japan: Stolen, Sunk, Burned - Are They Still There?"
  description: |-
    In 1040, the sacred mirror kept beside the emperor was lost in a palace fire. What remained were fragments and grains of metal.
    The sword, the mirror and the jewel: treasures often said to be unseen even by the emperor.
    Stolen, sunk, burned and called fakes - are the three treasures really still there today?
    In this video you will learn:
    - How the Nihon Shoki records the theft of the Kusanagi sword in 668 and its return to Atsuta in 686
    - The palace fires of 960, 1005 and 1040, and the discovery that there were three mirrors
    - The sword lost at Dan-no-ura in 1185, the jewel box that floated, and how the records disagree
    - The "fake" regalia of the Northern and Southern Courts, and the jewel taken in 1443 and recovered in 1458
    - An Edo-period note about the Atsuta sword, the Showa Emperor's words in 1945, and the 2019 accession ceremony
    The Edo-period account of seeing the sword is a later tradition, not a verified fact. Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Mirror That Became Fragments, 1040"
    - "Why Is the Sword at Atsuta? 668 and 686"
    - "What Happened to the Mirror in the Fires? 960-1040"
    - "Why Did the Sword Never Return? Dan-no-ura, 1185"
    - "Were the Regalia Fakes? 1331-1392"
    - "How Was the Jewel Recovered? 1443-1458"
    - "Did Anyone See the Atsuta Sword? An Edo-Period Note"
    - "Summer 1945 and the Morning of 2019"
    - "Summary: What Is There Today?"

