# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と sankin-story.yaml の型）。三種の神器（モノの回）。2026-10-31 下書き。
# 公開の予定は 11/05 19:00（日本史枠）。型：謎解き型＋モノの旅型（ユーザーと決めた）。創作の筋・想像の台詞は入れない（imagined なし）。
# 1本に1つの「なぜ」＝「天皇でさえ見たことがない、と言われる3つの宝は、本当に今もそこにあるのか」。
#   語り手は剣崎1人（つむぎは出ない）。冒頭（10秒以内）＝1040年の火事で宮中の神鏡は破片と金属の粒になり、それがそのまま神鏡として安置された（jingi-24）。
#   「天皇も見たことがない」は政府・宮内庁の言葉としては確かめられない（jingi-72）ので、「とよく言われる」とし、確かめられた1959年の国会の前置き（jingi-61）を出す。
#   第1章 剣は、なぜ熱田にあるのか（古語拾遺の作り直し・書紀との食い違い・668年の盗難・686年の祟り・清雪門・酔笑人神事）
#   第2章 鏡は、火の中でどうなったのか（960年 同じ日記の2日・3枚の鏡・著聞集の桜の話・1005年・1040年の破片と粒・神楽）
#   第3章 剣は、なぜ戻らなかったのか（1183年の都落ち・壇ノ浦の食い違い・神璽の箱・鏡の唐櫃・捜索・占い・代わりの剣・愚管抄）
#   第4章 渡したのは偽物だったのか（笠置・1336年の似せ物・行器・正平一統の食い違い・如在の礼・伊勢の宝剣・1392年の約束と実際）
#   第5章 勾玉は、どう取り戻されたのか（1443年の禁闕の変・剣の捨てられ方の食い違い・長禄の変・日付の食い違い）
#   第6章 熱田の剣を見た者はいたのか（玉籤集の裏書＝伝え。伝聞の伝聞・年月不明・本ごとの違い・中山太郎の推測）。実物の姿は断定しない
#   第7章 1945年の夏と、2019年の朝（皇室典範・木戸日記・皇室経済法・国会答弁・剣璽動座・剣璽等承継の儀）
#   まとめ（今あるのは何か：記録で言えること／言えないこと）。締めは余韻の一文＋登録のお願い（story: true）。
# 記録の食い違いを柱にした所（流れの確認で10か所→絞った）：①960年の日記の23日と24日（＋古今著聞集）②壇ノ浦で天皇を抱いた人 ③正平一統（太平記／続神皇正統記）④1392年の約束と実際。
#   崇神朝の鏡剣（書紀／古語拾遺）は「天皇のそばの鏡と剣は作り直された方」の説明として使う。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/三種の神器_facts_20261031.yaml、jingi-01〜72）にあるものだけ。行の上に `# fact: jingi-NN`。
#   原典の多くは NDL デジタルの公開本（国史大系・国書刊行会本・群書類従・史籍集覧）の全文 OCR と Wikisource の翻刻で読んだ。OCR の字は頁の画像で確かめる。
#   木戸幸一日記は辻田真佐憲の記事の引用で読んだ（原本は未見）。1005年・1040年の記事は斎木涼子 2017（洛北史学19）が引く『小右記』『春記』による。
#   使わないこと：熱田の剣の1945年の疎開（出どころ未見）・1210年の伊勢の剣の年（原典で言えない）・東洋経済の「天皇も見たことがない」（有料で未見）。
#   「とされる」「といわれる」「と伝わる」は、伝え・伝聞の事実にだけ使う（1本10回まで）。
