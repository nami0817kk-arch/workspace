  # サムネは別に作る（out/jingi-story_thumbnail.png。全面1枚の絵＋白と赤の文字。10-31 の型）。この欄は check のための仮。

sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 破片と粒になった神鏡　1040年
    background: {image: paintings/jingi_heiji_sanjo_fire.jpg, credit: "平治物語絵巻 三条殿夜討の巻の部分（13世紀後半。ボストン美術館所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1040
    lines:
      # fact: jingi-24, jingi-06
      - 語り: 天皇のそばにまつられていた神鏡は、火事で、形を失いました。1040年の秋のことです。残ったのは、鏡だった破片と、《金属の粒》でした。
        tone: 重い
      # fact: jingi-24
      - 語り: それでも、その破片と粒は、神鏡として、丁重に安置されました。この火事のことは、当時の貴族の日記に、書き残されています。
        card: {head: "1040年", body: 残ったのは金属の粒}
      # fact: jingi-61
      - 語り: 三種の神器。剣と、鏡と、勾玉。天皇でさえ見たことがない、とよく言われる宝です。
      # fact: jingi-61
      - 語り: 1959年の国会では、神器について尋ねた議員が、こう前置きしました。「われわれ、見たことはありませんけれども」。
      # fact: jingi-01
      - 語り: 剣は、668年に一度、盗まれています。『日本書紀』によれば、僧の道行が草薙剣を盗み、新羅へ逃げようとして、嵐で迷い、戻ってきました。
        card: {head: "668年", body: 盗んで新羅へ}
      # fact: jingi-03, jingi-29
      - 語り: 1185年、壇ノ浦では、天皇のそばにあった剣が、海に沈みました。幼い安徳天皇を抱いて沈んだのは誰か。『吾妻鏡』と『平家物語』では、名前が違います。
      # fact: jingi-31, jingi-47, jingi-49
      - 語り: 勾玉は、箱ごと海に浮かび、拾い上げられました。1443年には内裏から奪われ、都に戻るまで、15年近くかかっています。
      # fact: jingi-04, jingi-05, jingi-06
      - 語り: 鏡は、960年、1005年、1040年と、たびたび火に包まれました。
        card: {head: "宮中の神鏡", body: 960年・1005年・1040年}
      # fact: jingi-43, jingi-07
      - 語り: 南北朝の時代には、後醍醐天皇が北朝に渡した神器は似せ物だった、と『太平記』に書かれました。
      # fact: jingi-11, jingi-71
      - 語り: そして、2019年5月1日。新しい天皇が受け継いだのは、剣と勾玉でした。鏡は、その儀式に入っていません。
      - 語り: 盗まれ、沈み、焼け、偽物だと言われた3つの宝。本当に今も、そこにあるのでしょうか。
        tone: 疑問
      - 語り: その旅を、1300年あまり前の、剣の盗難から、たどっていきます。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 剣は、なぜ熱田にあるのか
  - title: 剣は、なぜ熱田にあるのか　668年の盗難と686年の祟り
    background: {image: paintings/toshiie_owari_atsuta_zue.jpg, credit: "岡田啓・野口道直『尾張名所図会』熱田大宮全図（1880年刊）"}
    year: 668
    lines:
      # fact: jingi-01
      - 語り: 天智天皇の7年、668年。『日本書紀』の、その年の記事に、短い一文があります。
        year: 668
        card: {head: "668年（天智天皇7年）", body: 『日本書紀』の一文}
      # fact: jingi-01
      - 語り: 僧の道行が、草薙剣を盗み、新羅へ逃げようとした。ところが途中で、風と雨にあい、道に迷って、戻ってきた。
      # fact: jingi-13
      - 語り: では、戻った剣は、どこにあったのか。『日本書紀』は、何も書いていません。宮中に留め置かれた、というのは、熱田の側の伝えです。
      # fact: jingi-02
      - 語り: 18年後の686年、朱鳥元年の6月。天武天皇の病を占うと、草薙剣の祟りだ、と出ました。
        year: 686
        card: {head: "686年（朱鳥元年）6月", body: 天皇の病を占う}
      # fact: jingi-02
      - 語り: 『日本書紀』は、続けてこう記します。その日のうちに、尾張国の熱田社に、送り置いた。今の名古屋の、熱田神宮です。
        tone: 重い
      # fact: jingi-14
      - 語り: 熱田神宮には、清雪門という門があります。俗に、開かずの門と呼ばれてきました。
      # fact: jingi-14
      - 語り: 剣を盗んだ僧が通った、不吉な門だから。あるいは、剣がふたたび皇居へ移らないよう、閉ざした門だから。そう伝わります。
      # fact: jingi-15
      - 語り: 毎年5月4日の夜には、酔笑人神事が行われます。剣が熱田に戻ったとき、人々が喜び笑った様子を伝える、といわれる神事です。
      # fact: jingi-15
      - 語り: 文明17年、1485年の年中行事には、すでに、この神事の名が見えます。
      - 語り: では、剣が熱田へ移ったあと、天皇のそばには、何が残ったのか。
        tone: 疑問
      # fact: jingi-16
      - 語り: 答えに近い話が、807年、斎部広成が書いた『古語拾遺』にあります。崇神天皇のとき、鏡と剣を、新しく作らせた、というのです。
        year: 807
        card: {head: "807年『古語拾遺』", body: 崇神天皇のとき}
      # fact: jingi-16
      - 語り: 天皇の身を守る、しるしとするためでした。そして、こう続きます。これが、今、天皇が位につく日に献じる、鏡と剣である、と。
      # fact: jingi-16, jingi-18, jingi-28
      - 語り: つまり、『古語拾遺』に従えば、天皇のそばの鏡と剣は、作り直された方だ、ということになります。もとの剣は、のちに熱田へ。もとの鏡、八咫鏡は、皇居の外でまつられるようになった、と伊勢神宮は説明しています。
        figure: {type: stats, title: 鏡と剣は2つずつ, items: [[剣のもと, 熱田神宮, 686年に熱田へ（日本書紀）], [鏡のもと（八咫鏡）, 伊勢神宮, 皇居の外でまつる（神宮の説明）], [天皇のそばの鏡と剣, 作り直された方, 崇神天皇のとき（古語拾遺）]], upto: 3}
      # fact: jingi-17
      - 語り: ただ、『日本書紀』の崇神天皇の記事に、鏡や剣を作った話はありません。天照大神を、宮の外の笠縫邑へ移した、と記すだけで、剣には触れていないのです。
        figure: null
      # fact: jingi-18
      - 語り: その『古語拾遺』は、草薙剣は今、熱田社にあるのに、まだ朝廷の祭りの格付けに入っていない、と不満も書き添えています。
      - 語り: 天皇のそばの剣と鏡。その鏡が、都で、何度も火に包まれます。
        tone: 疑問
        hook: true
      - 語り: 960年、内裏が燃えます。
        hook: true

  # ================================================================ 第2章 鏡は、火の中でどうなったのか
  - title: 鏡は、火の中でどうなったのか　960年から1040年の内裏焼亡
    background: {image: paintings/jingi_heiji_sanjo_fire.jpg, credit: "平治物語絵巻 三条殿夜討の巻の部分（13世紀後半。ボストン美術館所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 960
    lines:
      # fact: jingi-19
      - 語り: 天徳4年、960年の9月23日。平安京の内裏が、燃えました。
        year: 960
        card: {head: "960年（天徳4年）9月23日", body: 内裏が燃える}
      # fact: jingi-19
      - 語り: 平安時代の歴史書『扶桑略記』が、村上天皇の日記を引いています。その23日の記事では、神鏡を置いていた温明殿の鏡も太刀も、皆、灰になった、とあります。
      # fact: jingi-19
      - 語り: ところが翌日、焼け跡を探させると、話が変わります。源重光が、温明殿の跡の瓦の上で、鏡を一面見つけました。
      # fact: jingi-19
      - 語り: 直径はおよそ24センチ。小さな傷はあるものの、損なわれてはいない。24日の日記は、そう伝えています。
        card: {head: "直径8寸", body: およそ24センチ}
      # fact: jingi-27
      - 語り: 神鏡をまつる内侍所の、2つの箱も、別の殿舎へ移されました。『本朝世紀』は、この箱を、伊勢大神の分身と伝える、と記しています。
      # fact: jingi-21
      - 語り: そして、この火事で、宮中の神鏡は、3枚あったことが、わかります。伊勢の鏡と、紀伊の、日前と国懸の社の鏡です。
        card: {head: "宮中の神鏡", body: 3枚}
      # fact: jingi-20
      - 語り: 鎌倉時代、1254年の『古今著聞集』には、別の話が載っています。火の中から、神鏡が自ら飛び出し、南殿の桜の木にかかった。それを、小野宮殿が、袖で受けた。
        figure: {type: stats, title: 960年の火事　3つの書き方, items: [[天皇の日記の23日, 皆、灰になった, 扶桑略記が引く], [天皇の日記の24日, 瓦の上で見つかる, 小さな傷だけ], [古今著聞集（1254年）, 自ら飛び出して桜に, 著聞集も「おぼつかなし」]], upto: 3}
      # fact: jingi-20
      - 語り: ただ、著聞集自身が、この話はおぼつかない、と断っています。天皇の日記に、小野宮殿のことは見えない、と。
      # fact: jingi-05, jingi-22
      - 語り: 45年後の1005年。寛弘2年11月の火事で、鏡はまた焼けました。3枚のうち、残ったのは1枚だけです。
        figure: null
        year: 1005
        card: {head: "1005年（寛弘2年）11月", body: 3枚のうち1枚}
      # fact: jingi-21, jingi-22
      - 語り: 斎木涼子さんは、2017年の論文で、藤原実資の日記『小右記』から、そう読み解いています。このときの公卿たちは、鏡が3枚あったことさえ、知らなかったらしい、といいます。
      # fact: jingi-22, jingi-23
      - 語り: 焼けた鏡を、鋳直してよいか。公卿たちは、話し合いました。焼けた神鏡を鋳直してよいか、という問いへの答えを集めた本が、今も宮内庁の書陵部に伝わっています。
      # fact: jingi-06, jingi-24
      - 語り: そして1040年。長暦4年9月の火事で、神鏡は、完全に壊れました。
        year: 1040
        tone: 重い
      # fact: jingi-24
      - 語り: このときは、新しく作る話は出ませんでした。鏡だった破片や、金属の粒が、そのまま神鏡として、安置されたのです。
      # fact: jingi-24
      - 語り: 『古今著聞集』は、焼けた灰を取って、唐櫃、つまり脚の付いた箱に入れた、と伝えます。
      # fact: jingi-26
      - 語り: 藤原資房の日記『春記』の、9月28日の記事です。一条天皇の時代、1005年に神鏡が焼けたとき、女官に舞わせ、近衛に神楽をさせた。するとその夜、神の光が、建物を照らした。
      # fact: jingi-26
      - 語り: その例にならって、1040年には、神楽が三夜、続けられました。
      # fact: jingi-26
      - 語り: 宮内庁の祭儀の一覧には、今も、賢所御神楽があります。神霊をなごめる祭典、と書かれています。
      # fact: jingi-51
      - 語り: 壊れても、神鏡は、守られ続けました。時代は下って1159年、平治の乱では、源師仲が袖に移して守った、と『吾妻鏡』にあります。
      - 語り: 鏡は、都で守られました。けれど、剣は、都を離れます。
        tone: 疑問
        hook: true
      - 語り: 1183年、平家の都落ちです。
        hook: true

  # ================================================================ 第3章 剣は、なぜ戻らなかったのか
  - title: 剣は、なぜ戻らなかったのか　1185年 壇ノ浦と宝剣の捜索
    background: {image: paintings/jingi_antoku_engi_dannoura.jpg, credit: "安徳天皇縁起絵図 壇ノ浦合戦（土佐光信と伝わる。赤間神宮所蔵、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1185
    lines:
      # fact: jingi-41
      - 語り: 寿永2年、1183年の7月。平家は、幼い安徳天皇とともに、都を離れました。天皇のそばの剣と鏡、そして勾玉も、一緒です。
        year: 1183
        card: {head: "1183年（寿永2年）7月", body: 平家の都落ち}
      # fact: jingi-41
      - 語り: 九条兼実は、日記『玉葉』に、神璽も宝剣も内侍所も、すべて持ち去られた、と記しました。神璽は勾玉、内侍所は鏡のことです。
      # fact: jingi-41
      - 語り: 都では8月20日、後鳥羽天皇が位につきました。神器のないまま位を継いだ、初めての例です。『増鏡』は、めずらしき例、と書いています。
      # fact: jingi-03
      - 語り: 2年後の、元暦2年、1185年3月24日。壇ノ浦です。
        year: 1185
        card: {head: "1185年（元暦2年）3月24日", body: 壇ノ浦}
      # fact: jingi-29, jingi-30
      - 語り: 『平家物語』では、平清盛の妻、二位尼が、勾玉の箱を脇に挟み、宝剣を腰に差し、8歳の天皇を抱いて、海に入ります。
      # fact: jingi-29
      - 語り: ところが『吾妻鏡』では、宝剣を持ったのが二位尼。天皇を抱いたのは按察局で、しかも按察局は、生き残っています。
        figure: {type: stats, title: 壇ノ浦　天皇を抱いて沈んだのは, items: [[平家物語, 二位尼, 勾玉と宝剣も], [愚管抄・神皇正統記, 二位尼, 同じ書き方], [吾妻鏡, 按察局, 二位尼は宝剣を持つ]], upto: 3}
      # fact: jingi-31
      - 語り: 勾玉の箱は、海に浮かびました。拾い上げたのは、片岡太郎経春だと『平家物語』は名を挙げます。慈円の『愚管抄』は、名を出さず、ただ、武者が拾った、とします。
        figure: null
      # fact: jingi-32
      - 語り: 鏡は、船の上にありました。兵が、鏡を納めた唐櫃を開けようとすると、目がくらんだ。『平家物語』は、鼻血も出た、と語ります。
      # fact: jingi-32
      - 語り: それを止めたのが、捕らえられた平時忠でした。『吾妻鏡』によれば、鏡が無事に戻ったのは時忠の功だとして、その死罪は、一段軽くされています。
      # fact: jingi-34
      - 語り: 宝剣だけが、戻りませんでした。5月5日、源頼朝は、九州にいた弟の範頼に、飛脚を出して、宝剣を探させます。
      # fact: jingi-37
      - 語り: 8月、宝剣が海の底から見つかった、という話が、九条兼実に届きました。兼実は、思わず涙を流した、と日記に書いています。
      # fact: jingi-37
      - 語り: ただ、飛脚はまだ来ていない、とも書き添えていました。結局、宝剣が見つかった、という話は、誤りでした。
      # fact: jingi-35
      - 語り: 文治3年、1187年。朝廷は、厳島神社の神主、佐伯景弘に、海に潜る海人を使って、探させました。
        year: 1187
      # fact: jingi-35
      - 語り: 兼実は、春から秋まで、何一つ進まない、と嘆いています。
      # fact: jingi-36
      - 語り: 8月には、陰陽寮が、宝剣のありかを占いました。竜宮には納まっていない。ほかの国へも流れていない。沈んだ所から、5町の内の、海の底にある。
        card: {head: "5町", body: 約550メートル}
      # fact: jingi-36
      - 語り: 前の年の占いは、6月より前に出てくる、というものでした。外れています。
      # fact: jingi-38
      - 語り: 剣の無いまま、行列は続きました。1190年の正月の『玉葉』には、剣を持たない女官が後ろに付き、ほかの剣を仮に用いている、とあります。
        year: 1190
      # fact: jingi-38
      - 語り: 北畠親房の『神皇正統記』によれば、昼の御座の剣を宝剣に見立て、のちに、伊勢神宮のお告げで献じられた剣を、宝剣としました。
      # fact: jingi-39
      - 語り: 慈円は、『愚管抄』で、こう考えました。宝剣が失われたのは、武士が、天皇の守りとなる世になったからではないか。
        card: {head: "慈円『愚管抄』", body: 武士の世}
      - 語り: 剣は、別の剣に替わりました。それから、およそ150年。今度は、神器そのものが、偽物だと言われます。
        tone: 疑問
        hook: true
      - 語り: 南北朝の時代です。
        hook: true

  # ================================================================ 第4章 渡したのは偽物だったのか
  - title: 渡したのは偽物だったのか　後醍醐天皇と南北朝　1331年から1392年
    background: {image: paintings/takauji_godaigo_emaki.jpg, credit: "《太平記絵巻》の部分（江戸時代初めごろの絵巻。当時の絵ではない）"}
    year: 1336
    lines:
      # fact: jingi-42
      - 語り: 元弘元年、1331年。笠置山で敗れた後醍醐天皇は、『太平記』の中で、神器を渡すのを拒みます。
        year: 1331
      # fact: jingi-42
      - 語り: 鏡は、笠置の本堂に捨て置いた。勾玉は、山の中で、木の枝に掛けておいた。それが、天皇の言い分でした。
      # fact: jingi-42
      - 語り: ところが、同じ『太平記』の続きでは、神器は、新しく立った光厳天皇の側に、渡されています。
      # fact: jingi-43, jingi-07
      - 語り: 建武3年、1336年。比叡山から都へ戻る途中、後醍醐天皇は、前もって用意した似せ物と取り替えて、渡した。『太平記』の巻17です。
        year: 1336
        card: {head: "『太平記』巻17", body: 用意してあった「似せ物」}
      # fact: jingi-43
      - 語り: 一方で、同じ『太平記』の中で、新田の側は、三種の神器は春宮、つまり皇太子に渡してあった、と語ります。
      # fact: jingi-43
      - 語り: 吉野へ逃れるとき、神器は、足の付いた行器に入れられました。お参りの人が、弁当を運ばせているように見せたのです。
      # fact: jingi-07
      - 語り: 南朝に仕えた北畠親房は、1339年の『神皇正統記』に、鏡も移り、勾玉も天皇が身に添えた、と記しています。
      # fact: jingi-44
      - 語り: 1351年からの正平一統。北朝が退き、南朝は、北朝の内裏にあった神器を、受け取ります。
      # fact: jingi-44
      - 語り: 『太平記』によれば、南朝は、それを後醍醐天皇がすり替えた偽物だとして、勾玉の箱を捨て、剣と鏡は、ふつうの太刀と鏡にしてしまいます。
        figure: {type: stats, title: 正平一統の神器　2つの書き方, items: [[太平記, 偽物として箱を捨てた, 剣と鏡はふつうの品に], [続神皇正統記, 賀名生へ移した, 南朝の使いが受け取る]], upto: 2}
      # fact: jingi-44
      - 語り: 北朝の側の『続神皇正統記』は、南朝の使いが受け取って、賀名生へ移した、と書くだけです。
      # fact: jingi-45
      - 語り: 1352年、北朝の後光厳天皇は、神器のないまま位につきました。
        figure: null
        year: 1352
      # fact: jingi-45
      - 語り: 八幡宮の宝殿に置かれていた、鏡を納めるための唐櫃を、夜ひそかに、内裏へ運び入れます。神器があるものとしての礼に、見立てたのだろう、と『続神皇正統記』は記しています。
      - 語り: 偽物だったのか。同じ『太平記』の中でさえ、答えは、一つではありません。
        tone: 重い
      # fact: jingi-46, jingi-08
      - 語り: 明徳3年、1392年。南北朝が、一つになります。足利義満の書状は、神器が戻るなら、南朝の天皇から位を譲る、譲国の儀式にする、と約束していました。
        year: 1392
        card: {head: "1392年（明徳3年）", body: 約束は「譲国の儀式」}
      # fact: jingi-46, jingi-08
      - 語り: 閏10月5日、三種の神器は、土御門の内裏に入りました。
      # fact: jingi-46
      - 語り: 『続神皇正統記』は、このとき、1185年に鏡が西の海から帰ってきた時の例にならった、と書きます。約束の、譲国の儀式ではありませんでした。
      - 語り: 神器は、ふたたび一つの朝廷に戻りました。けれど、51年後。勾玉が、奪われます。
        tone: 疑問
        hook: true
      - 語り: 1443年、秋の夜です。
        hook: true

  # ================================================================ 第5章 勾玉は、どう取り戻されたのか
  - title: 勾玉は、どう取り戻されたのか　1443年 禁闕の変から1458年まで
    background: {image: paintings/takauji_hyogo_taiheiki_kuniyoshi_ndl.jpg, credit: "歌川国芳《太平記》の一場面（江戸時代後期。国立国会図書館所蔵、パブリックドメイン）"}
    year: 1443
    lines:
      # fact: jingi-47
      - 語り: 嘉吉3年、1443年9月23日の夜。内裏が襲われ、剣と勾玉が奪われました。禁闕の変です。
        year: 1443
        card: {head: "1443年（嘉吉3年）9月23日", body: 禁闕の変}
      # fact: jingi-47
      - 語り: 剣は、すぐに見つかります。清水寺のそばに捨てられていたのを、寺の僧、心月坊が拾って、届けました。
      # fact: jingi-48
      - 語り: 鏡の唐櫃も、持ち出されかけました。取り戻したのは、内裏の東の門を守っていた、佐々木黒田です。
      # fact: jingi-49
      - 語り: 勾玉だけが、南朝の側に、残りました。
        tone: 重い
      # fact: jingi-49
      - 語り: それを取り戻したのは、赤松家の、生き残りの家臣たちでした。
      # fact: jingi-49
      - 語り: その中の上月満吉らが、1478年に書き残した『上月記』に、経緯があります。
      # fact: jingi-49
      - 語り: 長禄元年、1457年の12月2日、夜半。吉野の奥で、南朝の皇子を討ち、勾玉を奪います。
        year: 1457
      # fact: jingi-49
      - 語り: ところが、追ってきた吉野の村人に、伯母谷で、取り返されてしまいます。
      # fact: jingi-49
      - 語り: 小寺藤兵衛入道が大和へ下り、仲間と策をめぐらして、もう一度、取り戻しました。
      # fact: jingi-49
      - 語り: 長禄2年、1458年の8月の末日。勾玉は、都に入りました。
        year: 1458
        card: {head: "1458年（長禄2年）8月", body: およそ15年ぶり}
      # fact: jingi-49
      - 語り: その功で、赤松家は、加賀の半国などを与えられた、と『上月記』は伝えます。
      - 語り: 剣、鏡、勾玉。3つは、ふたたびそろいました。では、熱田の剣を、誰かが、見たことはあるのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 江戸時代の、ある書き付けが、残っています。
        hook: true

  # ================================================================ 第6章 熱田の剣を見た者はいたのか（伝え）
  - title: 熱田の剣を見た者はいたのか　江戸時代の『玉籤集』の裏書
    background: {image: paintings/toshiie_owari_atsuta_zue.jpg, credit: "岡田啓・野口道直『尾張名所図会』熱田大宮全図（1880年刊）"}
    year: 1700
    lines:
      # fact: jingi-09, jingi-52
      - 語り: 江戸時代の神道家、玉木正英の『玉籤集』。その裏書に、こんな話があります。
      # fact: jingi-52
      - 語り: 書き手から見て、80年ほど前。熱田の大宮司と、神職の4、5人が、心を合わせ、ひそかに御神体をうかがった。
      # fact: jingi-53
      - 語り: 長さ5尺、およそ1.5メートルの木の箱。その中に石の箱。さらに中に、樟の丸木をくり抜いた箱があり、黄金が敷かれていた。箱と箱の間は、赤土で詰めてあった、と。
      # fact: jingi-52
      - 語り: 剣の形も、記されています。長さ、2尺7、8寸。80センチあまり。刃先は、菖蒲の葉のような形。色は、全体に白い。
      # fact: jingi-54
      - 語り: 見た大宮司は、思いがけないことで流罪になり、ほかの者も、重い病で亡くなった。1人だけが免れて、この話を伝えた、とされます。
        tone: 重い
      # fact: jingi-54
      - 語り: しかも、その話は、松岡正直という人から、書き手に伝わった、とあります。聞いた話を、さらに聞いた話です。
      # fact: jingi-55
      - 語り: 明治の国学者、栗田寛は、1898年の『神器考証』で、この裏書が書かれた年月は分からない、と書きました。
        year: 1898
      # fact: jingi-56
      - 語り: 引かれ方も、本によって違います。1890年の、飯田武郷『日本書紀通釈』の引用には、栗田寛の引用に無い話が付いています。
        card: {head: "玉籤集の裏書", body: 本ごとに違う引用}
      # fact: jingi-56
      - 語り: 熱田が燃えたとき、社人が斧で戸を破ろうとすると、水が流れ出た、という話です。
      # fact: jingi-57
      - 語り: 民俗学者の中山太郎は、1930年、この形と白い色から、銅剣のように思われる、と書きました。書かれたものからの推し量りで、見たわけではありません。
      - 語り: 書かれた年も、話の通り道も、たどりきれない伝えです。
        tone: 重い
      - 語り: 明治になると、神器は、法律の言葉になります。そして、1945年の夏が来ます。
        tone: 疑問
        hook: true
      - 語り: 昭和天皇の言葉が、日記に残っています。
        hook: true

  # ================================================================ 第7章 1945年の夏と2019年の朝
  - title: 「運命を共にする外ない」　1945年の夏と2019年の剣璽等承継の儀
    background: {image: paintings/jingi_ise_naiku_zue.jpg, credit: "蔀関月『伊勢参宮名所図会』内宮宮中図（1797年。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1945
    lines:
      # fact: jingi-58
      - 語り: 1889年、明治22年の皇室典範。第10条に、こうあります。天皇崩ずるときは、皇嗣、即ち践祚し、祖宗の神器を承く。
        year: 1889
      # fact: jingi-58
      - 語り: 天皇が亡くなれば、跡継ぎがすぐに位を継ぎ、代々の神器を受け継ぐ、という意味です。
        card: {head: "1889年 皇室典範", body: 第10条}
      # fact: jingi-63
      - 語り: 1945年の7月25日。『木戸幸一日記』には、こうあります。ここに、真剣に考えなければならないのは、三種の神器の護持である。
        year: 1945
      # fact: jingi-10, jingi-63
      - 語り: 7月31日。昭和天皇は、内大臣の木戸に、こう語りました。伊勢と熱田の神器は、結局、自分の身近に移して、お守りするのが一番よいと思う。
        tone: 重い
      # fact: jingi-10
      - 語り: そして、万一の場合には、自分がお守りして、運命を共にするほかない、と。『木戸幸一日記』に残る言葉です。
        tone: 重い
      # fact: jingi-59
      - 語り: 1947年の皇室経済法。第7条は、皇位とともに伝わるべき由緒ある物は、皇位とともに、皇嗣が、これを受ける、と定めました。神器、という言葉は、条文にありません。
        year: 1947
      # fact: jingi-60
      - 語り: 1959年の国会で、宮内庁の宇佐美毅は、三種の神器は国の財産ではなく、陛下とともに伝わる、御私有だ、と答えています。
      # fact: jingi-65
      - 語り: 戦前、天皇が1泊以上の旅に出るときは、剣と勾玉が、ともに動きました。剣璽動座です。戦後の地方への旅では、いったん、これがなくなります。
      # fact: jingi-65
      - 語り: 1975年の国会で、質問した議員は、1974年11月、伊勢神宮への参拝で、剣璽動座が復活した、と述べています。
        card: {head: "1974年11月", body: 伊勢神宮へ}
      # fact: jingi-67
      - 語り: 1989年1月7日、午前10時。剣璽等承継の儀。侍従が、剣と勾玉、国の印と天皇の印を捧げ持ち、新しい天皇の前の台に置きました。
        year: 1989
      # fact: jingi-70, jingi-11
      - 語り: 2019年、剣と勾玉は、退位の日の4月30日には、渡されませんでした。受け継がれたのは、翌5月1日の、午前10時30分です。
        year: 2019
        card: {head: "2019年5月1日", body: 午前10時30分}
      # fact: jingi-70
      - 語り: 宮内庁が比べた、1817年の光格天皇の譲位では、同じ日のうちに、2人の中将が、剣と勾玉を、新しい天皇のもとへ運んでいます。
      # fact: jingi-71
      - 語り: 鏡は、この儀式には入りません。5月1日から3日の賢所の儀で、皇位を継いだことを告げる形をとりました。
      - 語り: 最初の問いに、戻ります。
        hook: true
      - 語り: 3つの宝は、本当に今も、そこにあるのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（冒頭の問いに戻る。余韻の一文）
  - title: まとめ：3つの宝の、今わかること
    background: {image: paintings/jingi_ise_naiku_zue.jpg, credit: "蔀関月『伊勢参宮名所図会』内宮宮中図（1797年。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: 記録が答えてくれることと、答えてくれないこと。宝ごとに、見ていきます。
        tone: しみじみ
      # fact: jingi-02
      - 語り: まず剣。熱田の剣は、686年に熱田へ送られた、と『日本書紀』にあります。
      # fact: jingi-03, jingi-38
      - 語り: 天皇のそばの剣は、1185年に海に沈みました。その後、伊勢神宮のお告げで献じられた剣が、宝剣となった、と『神皇正統記』は伝えます。
      # fact: jingi-28, jingi-24
      - 語り: 次に鏡。八咫鏡は、皇居の外でまつられるようになった、と伊勢神宮は説明しています。天皇のそばの鏡は、1040年に壊れ、その破片と粒が、神鏡として安置されました。
      # fact: jingi-31, jingi-49
      - 語り: そして勾玉。壇ノ浦で箱ごと浮かび、1443年に奪われ、1458年に都へ戻りました。
      # fact: jingi-11
      - 語り: 2019年、新しい天皇に受け継がれたのは、剣と勾玉でした。
      - 語り: 答えてくれないことも、あります。箱の中が、今どんな姿なのか。それを示した公の記録は、ありません。熱田の剣の姿は、江戸の裏書が伝える話です。
        tone: しみじみ
      - 語り: 天皇でさえ見たことがない、という言葉が本当かどうかも、公の記録からは、言えません。南北朝の似せ物の話も、記録どうしで、食い違ったままです。
        tone: しみじみ
        pause: 0.8
      - 語り: 1040年、火のあとに残った、破片と、金属の粒。人々は、それを神鏡として安置し、三夜、神楽を奏しました。形を失っても、神鏡は、神鏡としてまつられ続けたのです。
        tone: しみじみ
        pause: 0.8
