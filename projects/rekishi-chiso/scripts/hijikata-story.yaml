# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と masamune-story.yaml の型）。土方歳三。2026-10-29 下書き。
# 公開の予定は 10/30 19:00。
# 型：1本に1つの「なぜ」＝「なぜ土方は、最後に自分の写真をふるさとへ送ったのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝あの洋装の写真の一枚は、少年が箱館から日野へ運んだもの（hijikata-01）。届いたのは本人の死の2か月後（11）。
#   導入では答え（理由を書いた記録は無い・送り先が剣の道へ導いた義兄の家・少年の身を頼んだ）を言わず、最後の章で出す。
#   第1章 石田散薬の若者（生家の移築・石田散薬250年と配達・大黒柱・彦五郎の道場・八坂神社の額・中極位目録・豊玉発句集の恋の句）／
#   第2章 鬼の副長は本当に鬼だったのか（通説の検証はこの章：「局中法度」の名・小島鹿之助への手紙の追伸・報国の句・鎖帷子・鳥羽伏見と近藤の死は短く・茂辺地の硬貨）／
#   第3章 洋装の写真（蝦夷の地位の食い違い・撮った人と時期の食い違い・後年のプリント・台紙・柔和な表情）／
#   第4章 市村鉄之助（大垣・両長召抱人・兄の脱走・命令・紙きれ・2人だった・身をやつして・7月に届く・討死のメモ・襟の書状・かくまわれる・最期の食い違い）／
#   第5章 まとめ（最期の場所の食い違い・埋葬地・碧血碑・殉節両雄之碑・遺品の処分・残った写真・資料館・答え）→ 冒頭の写真に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを表で並べたのは3か所：①写真を撮った人と時期（佐藤家の目録／東京都写真美術館 2013／土方愛さんの話）
#   ②鉄之助の最期（明治6年に病死／明治10年に西南戦争で戦死）③最期の場所（函館市／日本大百科全書／世界大百科事典）。
#   ほかに語りだけで：蝦夷での地位（陸軍奉行／陸軍奉行並）、届けたのは1人か2人か。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/土方歳三_facts_20261029.yaml、hijikata-01〜80）にあるものだけ。行の上に `# fact: hijikata-NN`。
#   カードに無い「誰でも知っている前置き」（1835年に石田村に生まれた・新選組の副長・1863年に京へ・鳥羽伏見・近藤の板橋での処刑・宇都宮と会津への転戦・
#   榎本らと蝦夷地へ・明治2年5月11日の死）は短く使い、# fact を付けない。
#   重なるカードは片方だけ使う：10＝23（裏の漢詩）、24＝48（撮った人）、37＝57（時期）、34＝41・58（鉄之助の最期）、30＝55（生家の移築）、29＝56（石田散薬）、19＝28（兼定）、25＝38（後年のプリント）。
#   遺髪は出どころに無い（hijikata-01 の主張を直した）ので言わない。届けた物は「写真などの形見」。
#   出どころが1つで本文を開けていないもの（05 埋葬地・15 局中法度の名）は「といわれます」「と題した記事」で言う。
#   『多摩乃腥風』は原文を見ていない（77）。「書いている、といいます」まで。鉄之助の年齢（明治6年に20歳）から「十代」とだけ言う。
#   最期の場面は描かない・語らない（場所の記録の食い違いだけ。銃弾の細部・亡骸の様子は言わない）。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（紙きれの言葉・句・目録の言葉。声は作らない）。
#   想像の台詞は4か所（土方想像。config の roles に足した：栗田まろん）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の hijikata_*（10-29 に Commons から落とした）＋ AI 絵（J01〜J15、一覧は dev/output/rekishi-chiso/research/hijikata_ai_images.md）。
#   AI 絵の土方は後ろ姿か横顔。実在の写真の土方に似せない・俳優に似せない。顔の分かるのは実在の写真（額）だけ。
# 広告の配慮：戦死の場面・亡骸は描かない。刀を抜いた場面も描かない。
