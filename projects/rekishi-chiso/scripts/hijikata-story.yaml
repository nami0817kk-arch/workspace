sections:
  # ================================================================ 導入（冒頭 約1分40秒）。答え（理由を書いた記録は無い・送り先・少年の身）は最後の章まで言わない
  - title: 土方の写真を運んだのは誰か　1869年 箱館から日野へ
    background: {image: paintings/hijikata_hakodate_war_1869.jpg, credit: "箱館のフランス軍事顧問と旧幕府軍の人々（1869年の写真）"}
    # AI絵：J01（箱館の港の夜明け、小さな包みを胸に抱いて船に向かう少年の後ろ姿）
    year: 1869
    lines:
      # 0〜10秒：知らない事実（あの写真の一枚は少年が運んだ）
      # fact: hijikata-01
      - 語り: よく知られた、洋装の土方歳三の写真。その一枚は、ひとりの少年が、箱館から、ふるさとの日野まで、《運んだもの》でした。
        tone: 強調
        portrait: {image: paintings/hijikata_photo_1869.jpg, caption: "土方歳三の洋装の写真（明治2年ごろ）"}
        card: {head: "洋装の写真", body: 少年が日野へ運んだ}
      # fact: hijikata-34
      - 語り: 少年の名は、市村鉄之助。十代の隊士です。
        portrait: null
      # fact: hijikata-01
      - 語り: 大垣市立図書館の調べによれば、鉄之助は、土方から、写真などの形見を、日野の佐藤家へ届けるよう、命じられました。
      # fact: hijikata-11
      - 語り: 佐藤彦五郎新選組資料館の目録によれば、写真が佐藤家に届いたのは、明治2年の7月。
        card: {head: "明治2年7月", body: 写真が日野に届く}
      # fact: hijikata-11
      - 語り: 土方は、その2か月前の5月11日に、箱館で、もう亡くなっていました。
        tone: 重い
      # fact: hijikata-23
      - 語り: 手のひらに乗るほどの、小さな写真。その裏には、土方を悼む漢詩が、書かれています。
        card: {head: "写真の裏", body: 土方を悼む漢詩}
      # 【記録】土方愛さんの話として和樂web 2021 が紹介する紙きれの言葉「この者の身の上をお頼み申します」（hijikata-01）
      # fact: hijikata-01
      - 語り: そして、写真には、土方の書いた紙きれが、添えられていた、と子孫の土方愛さんは語っています。
      # fact: hijikata-01
      - 語り: 「この者の身の上を、お頼み申します」。
        tone: しみじみ
        card: {head: "添えられた紙きれ", body: 「この者の身の上を」}
      - 語り: 自分の写真に添えた、たった一行。頼まれていたのは、誰の、何だったのか。
        tone: しみじみ
      - 語り: 新選組の「鬼の副長」は、なぜ、最後に、自分の写真を、ふるさとへ送ったのか。
        tone: 疑問
        pause: 0.8
      - 語り: 話は、多摩の村で、家の薬を届けていた、ひとりの若者から始まります。
        pause: 0.6

  # ================================================================ 第1章 石田散薬の若者（1835〜1863）
  - title: 若い歳三を支えたのは誰か　1835年 多摩の石田村と日野宿
    background: {image: paintings/hijikata_tamagawa_hiroshige.jpg, credit: "歌川広重《江戸近郊八景之内 玉川秋月》1838年ごろ（メトロポリタン美術館）"}
    # AI絵：J02（多摩川の土手の道、薬箱を背負って歩く若者の後ろ姿）
    year: 1835
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 土方歳三は、1835年、武蔵の国、多摩郡の石田村に生まれました。今の東京都日野市です。
      # fact: hijikata-30
      - 語り: 生家は、弘化3年の洪水で流されそうになったとき、村の人々が駆けつけて、今の場所へ移した、と伝わります。
        card: {head: "弘化3年の洪水", body: 村の人が家を移す}
      # fact: hijikata-29
      - 語り: 土方の家には、代々伝わる薬がありました。石田散薬です。
        background: {image: paintings/hijikata_ishida_sanyaku.jpg, credit: "石田散薬（土方家の家伝薬）"}
      # fact: hijikata-29, hijikata-75
      - 語り: 土方歳三資料館によれば、宝永年間から昭和まで、およそ《250年》作られ、打ち身やくじきに効く、と言われました。
        card: {head: "石田散薬", body: 約250年作られた家の薬}
      # fact: hijikata-75, hijikata-06
      - 語り: 若いころの歳三も、得意先へ、この薬を届ける役をしていた、と資料館は紹介しています。
      # fact: hijikata-67
      - 語り: 資料館の入り口の梁には、生家の大黒柱が使われています。幼い歳三が、風呂あがりに、相撲の稽古をした柱だ、といいます。
        tone: しみじみ
      # fact: hijikata-07
      - 語り: その歳三を、剣の道へ導いたのは、日野宿の問屋で、名主もつとめた、佐藤彦五郎でした。歳三の姉の、夫です。
        background: {image: paintings/hijikata_musashi_tamagawa_1858.jpg, credit: "歌川広重《六十余州名所図会 武蔵 玉川》1858年（米国議会図書館）"}
        portrait: {image: paintings/hijikata_sato_hikogoro.jpg, caption: "佐藤彦五郎"}
      # fact: hijikata-07
      - 語り: 彦五郎は、屋敷に道場を開いていました。歳三は、そこに通って、天然理心流の稽古に励んだ、と伝えられています。
        card: {head: "佐藤彦五郎の道場", body: 天然理心流の稽古}
      # fact: hijikata-68
      - 語り: 日野の八坂神社には、1858年に、日野宿の天然理心流の門人23人が奉納した額が、今も残っています。のちの近藤勇、沖田総司、それに佐藤彦五郎の名も、そこにあります。
        portrait: null
      # fact: hijikata-70
      - 語り: 文久2年の9月には、歳三は、近藤勇から、天然理心流の「中極位目録」を受けています。
      # fact: hijikata-03
      - 語り: 剣だけではありません。歳三は、句もよみました。俳号は「豊玉」。京へ上る直前に、自分の句を一冊にまとめています。『豊玉発句集』です。
        card: {head: "豊玉発句集", body: 京へ上る直前にまとめた句集}
      # fact: hijikata-71
      - 語り: 土方愛さんによれば、この句集には、恋の句を消して、格調の高い句に、書き直した跡があります。
      # fact: hijikata-71
      - 語り: 京へ行く前に、恋の句など、よんでいる場合ではない。そう思ったのだろう、と愛さんは話しています。
        tone: しみじみ
      # 【想像1】土方。記録：恋の句を消して格調の高い句に書き直した跡がある（hijikata-71。土方愛さんの読み）。気持ちの言葉だけ
      - 人物: 「……恋の句は、もう、よい」
        who: 土方想像
        imagined: true
        tone: しみじみ
      - 語り: 薬を届け、剣を習い、句をよんだ若者。そのそばには、いつも、日野の人々がいました。
        tone: しみじみ
      - 語り: 1863年、歳三は、近藤勇らと、京へ上ります。のちの新選組です。
        hook: true
      # fact: hijikata-47
      - 語り: けれど、京に出てからも、歳三は、多摩の人々に、手紙を送っています。
        tone: 重い
        hook: true

  # ================================================================ 第2章 通説の検証（鬼の副長）
  - title: 鬼の副長は、本当に鬼だったのか　京都から多摩への手紙
    background: {image: paintings/ryoma_kyoto_shijo_kamogawa_hiroshige2.jpg, credit: "二代歌川広重《四条河原》1860年ごろ"}
    # AI絵：J03（京の町家の奥、灯の下で手紙を書く男の手もとと横顔の影）
    year: 1863
    lines:
      - 語り: 新選組の副長として、隊の決まりを厳しく守らせた、土方歳三。今では、「鬼の副長」と呼ばれる人です。
      - 語り: その決まりは、「局中法度」という名でも、よく知られています。
      # fact: hijikata-15
      - 語り: けれど、その名は、昭和3年に作家の子母沢寛が書いた『新選組始末記』から広まったもので、当時の記録には見えない、ともいわれます。
        card: {head: "「局中法度」の名", body: 昭和3年の本から広まった？}
      # fact: hijikata-15
      - 語り: 2000年には、歴史研究家の菊地明さんが、『局中法度書は、子母沢寛のつくり話だ』と題した記事を書いた、といわれます。
      - 語り: 決まりの名前ひとつにも、のちの時代の物語が、混じっているのかもしれません。
        tone: しみじみ
      - 語り: では、歳三本人の手紙からは、どんな姿が見えるのか。
        tone: 疑問
      # fact: hijikata-47
      - 語り: 文久3年の11月。歳三は、多摩の小島鹿之助に、手紙を書いています。
        card: {head: "文久3年11月", body: 小島鹿之助への手紙}
      # fact: hijikata-47
      - 語り: 小島資料館の解説によれば、その追伸で、歳三は、京と大坂の、なじみの女性の名前を挙げて、自慢しています。
        tone: 強調
      # fact: hijikata-47
      - 語り: この手紙を多摩へ持ち帰ったのは、新選組に入ろうとして断られた、親類の松本捨助でした。
      # fact: hijikata-72
      - 語り: 土方愛さんは、京都へ行って半年ほどたったころから、芸妓や舞妓と、なじみが深くなったようだ、と話しています。
      # 【記録】土方愛さんが、もらった恋文を多摩の親類へ送ったときに末尾に添えた句として紹介（hijikata-72）。語りの中で読む
      # fact: hijikata-72
      - 語り: もらった恋文を、多摩の親類へ送ったとき、末尾に添えた句、として愛さんが紹介するのが、こちらです。「報国の、心を忘るる、婦人かな」。
        card: {head: "歳三の句", body: 報国の心を忘るる婦人かな}
      - 語り: 国に尽くす心を、忘れさせてしまう女たちだ。冗談めかした句にも、聞こえます。
        tone: しみじみ
      - 語り: 鬼と呼ばれた人の、ふるさとへの便りは、意外なほど、くだけていました。
        tone: しみじみ
      # fact: hijikata-45
      - 語り: もちろん、命がけの日々でもありました。土方歳三資料館には、池田屋事件で歳三が使った、鎖帷子が伝わっています。
        card: {head: "池田屋事件", body: 歳三が使った鎖帷子}
      # fact: hijikata-82
      - 語り: 八月十八日の政変などで、歳三の頭を守った鉢金も、そこに残っています。
      # fact: hijikata-45
      - 語り: ただ、その鎖帷子は、傷みが進み、今は公開できなくなっている、と2025年に発表されています。
      - 語り: 慶応4年、1868年の1月、鳥羽・伏見の戦いで、旧幕府軍は敗れます。
        background: {image: paintings/hijikata_toba_fushimi_1868.jpg, credit: "鳥羽・伏見の戦いの図（1868年）"}
        year: 1868
      - 語り: 4月には、近藤勇が、板橋で処刑されました。
        tone: 重い
        portrait: {image: paintings/hijikata_kondo_isami.jpg, caption: "近藤勇（1865〜68年ころの写真）"}
      - 語り: 歳三は、宇都宮、会津と、北へ戦いを続けていきます。
        portrait: null
      # fact: hijikata-31
      - 語り: のちに渡る蝦夷地での、歳三の、もうひとつの顔を、2025年10月の北海道新聞が伝えています。
        background: {image: paintings/hijikata_hakodate_land_naval.jpg, credit: "箱館の陸と海の戦いの図"}
      # fact: hijikata-31
      - 語り: 箱館戦争のさなか、歳三が泊まった、茂辺地、今の北斗市の宿。その子孫のもとに、歳三が、宿の娘に渡したという硬貨が、伝わっていたんです。
        card: {head: "北海道新聞 2025年", body: 宿の娘に渡した硬貨}
        # AI絵：J06（宿の土間で、小さな娘の手のひらに硬貨を置く大人の手。顔は描かない）
      # 【想像2】土方。記録：宿の娘に硬貨を渡したと伝わる（hijikata-31）。気持ちの言葉だけ
      - 人物: 「……取っておけ」
        who: 土方想像
        imagined: true
        tone: しみじみ
      - 語り: 隊士に恐れられた顔と、宿の娘に硬貨を渡す顔。ふるさとへの手紙と同じ顔を、歳三は、北の宿でも見せていたのかもしれません。
        tone: しみじみ
      - 語り: そして、この北の地で、歳三は、一枚の写真を残します。
        hook: true
      - 語り: のちに、ふるさとへ帰っていく、あの写真です。
        tone: 重い
        hook: true

  # ================================================================ 第3章 洋装の写真（1868〜1869）
  - title: 洋装の写真は、いつ誰が撮ったのか　1869年 箱館
    background: {image: paintings/hijikata_goryokaku_honjin_1868.jpg, credit: "五稜郭の箱館奉行所（1868年ごろの写真）"}
    # AI絵：J04（箱館の写真館、黒い布をかぶった写真機と、椅子の後ろ姿の男）
    year: 1868
    lines:
      - 語り: 1868年の暮れ、榎本武揚たちの旧幕府軍は、蝦夷地に渡り、箱館の五稜郭に入ります。歳三も、その中にいました。
        background: {image: paintings/hijikata_tokugawa_fleet_1868.jpg, credit: "小杉雅之進《品川沖を出る旧幕府の艦隊》1868年"}
      # fact: hijikata-50
      - 語り: このとき歳三は、どんな立場だったのか。函館市中央図書館の写真資料の題は、歳三を「陸軍奉行」と書きます。
        background: {image: paintings/hijikata_goryokaku_honjin_1868.jpg, credit: "五稜郭の箱館奉行所（1868年ごろの写真）"}
      # fact: hijikata-50
      - 語り: ところが、大鳥圭介の『南柯紀行』をもとにした2024年の研究では、陸軍奉行の大鳥の下の、副大臣にあたる立場。陸軍奉行並、と呼ばれる役です。
        card: {head: "蝦夷での立場", body: 陸軍奉行か　陸軍奉行並か}
      # fact: hijikata-02, hijikata-27
      - 語り: 箱館で、歳三は、写真を撮ります。洋服を着て、椅子に腰かけた姿です。
        background: {image: paintings/hijikata_goryokaku_honjin_1868.jpg, credit: "五稜郭の箱館奉行所（1868年ごろの写真）"}
        portrait: {image: paintings/hijikata_photo_1869.jpg, caption: "土方歳三の洋装の写真（明治2年ごろ）"}
      # fact: hijikata-02
      - 語り: 撮ったのは、箱館の写真師、田本研造だ、と伝えられています。
      # 食い違い①：撮った人と時期（佐藤家の目録／東京都写真美術館 2013／土方愛さんの話）
      # fact: hijikata-24
      - 語り: ところが、いつ撮ったのか。本当に田本なのか。記録の書き方は、そろっていません。
        tone: 疑問
        figure: {type: stats, title: 洋装の写真　食い違う記録, items: [[佐藤家の写真の目録, 田本研造, 明治元年12月], [東京都写真美術館 2013年, 田本研造か, 明治2年ごろ], [土方愛さんの話, 函館で, 亡くなる半年前]], upto: 1}
      # fact: hijikata-24, hijikata-37
      - 語り: 日野の佐藤家の写真の目録は、田本研造が写した、と言い切り、年代を、明治元年の12月と記します。
        figure: {type: stats, title: 洋装の写真　食い違う記録, items: [[佐藤家の写真の目録, 田本研造, 明治元年12月], [東京都写真美術館 2013年, 田本研造か, 明治2年ごろ], [土方愛さんの話, 函館で, 亡くなる半年前]], upto: 1}
      # fact: hijikata-24
      - 語り: 東京都写真美術館は、2013年の展示で、撮った人を「田本研造か」とし、時期を「明治2年ごろ」としました。
        figure: {type: stats, title: 洋装の写真　食い違う記録, items: [[佐藤家の写真の目録, 田本研造, 明治元年12月], [東京都写真美術館 2013年, 田本研造か, 明治2年ごろ], [土方愛さんの話, 函館で, 亡くなる半年前]], upto: 2}
      # fact: hijikata-37
      - 語り: そして、子孫の土方愛さんは、亡くなる半年前に、函館で撮られたもの、と話しています。明治元年の12月に、近い言い方です。
        figure: {type: stats, title: 洋装の写真　食い違う記録, items: [[佐藤家の写真の目録, 田本研造, 明治元年12月], [東京都写真美術館 2013年, 田本研造か, 明治2年ごろ], [土方愛さんの話, 函館で, 亡くなる半年前]], upto: 3}
      - 語り: 撮った人も、撮った時も、言い切る記録と、言い切らない記録がある。よく知られた一枚にも、分からないことが、残っているんです。
        tone: しみじみ
        figure: null
      # fact: hijikata-38
      - 語り: 函館市中央図書館にも、この写真があります。ただし、撮ったときに焼いたものではなく、のちの時代に焼き直したものです。
        card: {head: "函館市中央図書館", body: のちの時代に焼いた写真}
      # fact: hijikata-49
      - 語り: 図書館には、旧幕府軍の幹部の小さな写真を、大きな台紙に並べた資料もあります。台紙は、歳三を「箱館市中取締」、「裁判局頭取」と書いています。
      # fact: hijikata-73
      - 語り: 土方愛さんは、この写真について、最後はつらい状況だったのに、柔和な表情で写っているのがよかった、と話しています。
        tone: しみじみ
        portrait: {image: paintings/hijikata_photo_1869.jpg, caption: "土方歳三の洋装の写真（明治2年ごろ）"}
      # 【想像3】土方。記録：箱館で写真を撮った（hijikata-02・27）。気持ちの言葉だけ
      - 人物: 「……この姿を、残しておくか」
        who: 土方想像
        imagined: true
        tone: しみじみ
      - 語り: 明治2年。新政府軍が、蝦夷地に迫ります。
        portrait: null
        background: {image: paintings/hijikata_hakodate_nishikie_mosai.jpg, credit: "永島孟斎《箱館戦争》の錦絵（明治初め）"}
        hook: true
      # fact: hijikata-01
      - 語り: 歳三は、そばに仕えていた少年に、ある役目を与えます。
        tone: 重い
        hook: true

  # ================================================================ 第4章 市村鉄之助（1869〜1873）
  - title: 「この者の身の上を、お頼み申します」　市村鉄之助の旅
    background: {image: paintings/hijikata_ogaki_castle_pre1945.jpg, credit: "戦災で焼ける前の大垣城"}
    # AI絵：J07（大垣の城下、堀ばたを歩く兄と弟の後ろ姿）
    year: 1869
    lines:
      # fact: hijikata-59
      - 語り: 市村鉄之助。美濃の大垣藩の家に生まれました。父の半右衛門は、大垣藩の重臣、小原鉄心の、直属の部下だった、と大垣市立図書館の調べにあります。
      # fact: hijikata-59
      - 語り: 慶応3年の秋、鉄之助は、兄の辰之助と一緒に、新選組に入ります。
        card: {head: "慶応3年の秋", body: 兄と弟で新選組へ}
      # fact: hijikata-83
      - 語り: 和樂webの記事によれば、このとき鉄之助は、まだ13歳でした。
      # fact: hijikata-76
      - 語り: 兄は、局長付き。弟の鉄之助は、「両長召抱人」。近藤と土方の、そば付きの役でした。
      # fact: hijikata-59
      - 語り: 兄の辰之助は、やがて隊を抜け、大垣藩の兵として、戦いました。
      # fact: hijikata-60
      - 語り: 弟の鉄之助は、残りました。そして、歳三について、箱館まで来ていたんです。
        tone: しみじみ
        background: {image: paintings/hijikata_hakodate_war_1869.jpg, credit: "箱館のフランス軍事顧問と旧幕府軍の人々（1869年の写真）"}
      # fact: hijikata-01
      - 語り: その鉄之助に、歳三は、写真などの形見を、日野の佐藤家へ届けるよう、命じます。
        tone: 重い
        # AI絵：J08（灯の下、小さな包みを差し出す男の手と、受け取る少年の手。顔は描かない）
      # 【想像4】土方。記録：写真などの形見を日野の佐藤家へ届けるよう命じた（hijikata-01）。気持ちの言葉だけ
      - 人物: 「……これを、日野へ、届けてくれ」
        who: 土方想像
        imagined: true
        tone: しみじみ
      # fact: hijikata-01
      - 語り: 写真に添えた紙きれの言葉は、冒頭で見た、「この者の身の上を、お頼み申します」。
        card: {head: "添えられた紙きれ", body: 「この者の身の上を」}
      - 語り: 届けてほしかったのは、写真だけではありませんでした。運んでいく少年の身も、日野に、頼んでいたんです。
        tone: しみじみ
      # fact: hijikata-83
      - 語り: 和樂webの記事は、歳三が、亡くなる数日前に、鉄之助を船に乗せ、江戸へ送り出した、と書いています。
        tone: 重い
      # 食い違い（語りだけ）：届けたのは1人か2人か
      # fact: hijikata-60
      - 語り: ただ、船に乗せられたのは、ひとりではなかった、と土方愛さんは語ります。もうひとり、渡辺市造という、若い隊士がいた、と。
      # fact: hijikata-84
      - 語り: 市造は、そのころ16、7歳だったそうです。
        card: {head: "土方愛さんの話", body: 帰されたのは2人}
      # fact: hijikata-60
      - 語り: 佐藤家の目録に書かれているのは、日野に届けた、鉄之助の名だけ。箱館を出たのがふたりだったことは、子孫の話として伝わっています。
      # fact: hijikata-35, hijikata-78
      - 語り: 市造は、江戸で鉄之助と別れ、実家には戻らず、川越で米を運ぶ人足として、一生を終えたそうです。
      # fact: hijikata-77
      - 語り: 鉄之助は、ひとりで、日野をめざしました。大正のころ、『国民新聞』に載った聞き書きは、鉄之助が、身なりを変えて、日野の親類を訪ねた様子を、書いている、といいます。
      # fact: hijikata-83
      - 語り: もっとも、愛さんは、鉄之助の話は、箱館の美談として伝わったために、盛られている所もある、とも話しています。
        background: {image: paintings/hijikata_musashi_tamagawa_1858.jpg, credit: "歌川広重《六十余州名所図会 武蔵 玉川》1858年（米国議会図書館）"}
        # AI絵：J09（夏の街道、粗末な身なりで歩く少年の後ろ姿。胸に小さな包み）
      # fact: hijikata-11
      - 語り: 写真が日野に着いたのは、冒頭でお話しした、明治2年の7月。歳三は、もう、この世にいませんでした。
        tone: 重い
        card: {head: "明治2年7月", body: 日野の佐藤家に届く}
      # fact: hijikata-12
      - 語り: 佐藤家には、歳三の討死について、沢忠助の届けを、彦五郎が書きとめたメモが、掛け軸に仕立てられて、残っています。
        portrait: {image: paintings/hijikata_sato_hikogoro.jpg, caption: "佐藤彦五郎"}
        card: {head: "彦五郎のメモ", body: 沢忠助が討死を知らせる}
      # fact: hijikata-44
      - 語り: 歳三の戦死を知らせる、安富才介の手紙も、伝わっています。その手紙は、紙縒りのように細く折られ、届けた人の、着物の襟の内側に、縫いこまれて運ばれた、と伝わります。
        portrait: null
      # fact: hijikata-78
      - 語り: 鉄之助は、日野の親類の家に、数年のあいだ、かくまわれました。土方の写真を持ってきた人として、大事にされた、といいます。
        background: {image: paintings/hijikata_tamagawa_hiroshige.jpg, credit: "歌川広重《江戸近郊八景之内 玉川秋月》1838年ごろ（メトロポリタン美術館）"}
      # fact: hijikata-78
      - 語り: やがて、兄から手紙が届きます。鉄之助は、ふるさとの大垣へ。
      # fact: hijikata-76
      - 語り: 兄の辰之助は、明治5年に、亡くなっています。
      # 食い違い②：鉄之助の最期（明治6年に病死／明治10年に西南戦争で戦死）
      # fact: hijikata-58
      - 語り: では、その鉄之助は、どんな最期を迎えたのか。記録は、2つに分かれます。
        tone: 疑問
        background: {image: paintings/hijikata_ogaki_castle_pre1945.jpg, credit: "戦災で焼ける前の大垣城"}
        figure: {type: stats, title: 市村鉄之助の最期　2つの説, items: [[病で亡くなった説, 明治6年, 20歳で], [戦いで亡くなった説, 明治10年, 西南戦争で]], upto: 1}
      # fact: hijikata-34
      - 語り: 菩提寺の住職への取材をもとにした和樂webの記事は、明治6年、20歳で、病で亡くなった、とします。
        figure: {type: stats, title: 市村鉄之助の最期　2つの説, items: [[病で亡くなった説, 明治6年, 20歳で], [戦いで亡くなった説, 明治10年, 西南戦争で]], upto: 1}
      # fact: hijikata-58
      - 語り: 一方で、明治10年の西南戦争で戦って亡くなった、という説もあります。大垣市立図書館の調べも、2つの説を並べています。
        figure: {type: stats, title: 市村鉄之助の最期　2つの説, items: [[病で亡くなった説, 明治6年, 20歳で], [戦いで亡くなった説, 明治10年, 西南戦争で]], upto: 2}
      # fact: hijikata-34
      - 語り: 和樂webの記事は、西南戦争の話を、フィクションだ、としています。
        figure: null
      # fact: hijikata-58
      - 語り: 市村家の墓は、大垣の全昌寺にあります。
        tone: しみじみ
      - 語り: 少年が運んだ写真は、日野に届きました。
        hook: true
      # fact: hijikata-43
      - 語り: けれど、受け取った日野の家には、敗れた側の家としての、つらい日々が待っていました。
        tone: 重い
        hook: true

  # ================================================================ 第5章 まとめ（最期の場所・碧血碑・残った写真・答え）
  - title: まとめ：歳三は、なぜ写真をふるさとへ送ったのか　箱館と日野
    background: {image: paintings/hijikata_hakodate_monument_2014.jpg, credit: "函館・若松町の土方歳三最期の地碑（2014年）"}
    # AI絵：J12（夕暮れの函館山と港の遠景、人物なし）
    year: 1869
    lines:
      # 食い違い③：最期の場所（函館市／日本大百科全書／世界大百科事典）
      # fact: hijikata-04
      - 語り: 歳三が亡くなった場所も、記録によって、書き方が違います。函館市は、一本木関門のあたり、今の若松町で、と言われている、と書きます。
        figure: {type: stats, title: 歳三が亡くなった場所　記録の書き方, items: [[函館市の案内, 一本木関門のあたり, 今の若松町と言われる], [日本大百科全書, 箱館一本木, 小島政孝の執筆], [世界大百科事典, 五稜郭の戦争で, 高木俊輔の執筆]], upto: 1}
      # fact: hijikata-16
      - 語り: 日本大百科全書は、「箱館一本木」。世界大百科事典は、「五稜郭の戦争で」と書き、場所の名は、挙げていません。
        figure: {type: stats, title: 歳三が亡くなった場所　記録の書き方, items: [[函館市の案内, 一本木関門のあたり, 今の若松町と言われる], [日本大百科全書, 箱館一本木, 小島政孝の執筆], [世界大百科事典, 五稜郭の戦争で, 高木俊輔の執筆]], upto: 3}
      # fact: hijikata-61
      - 語り: 若松町に立つ「最期の地」の碑は、1958年の12月に、地元の若松小学校の同窓会と、父母と先生の会の有志が、建てたものです。
        figure: null
        card: {head: "1958年12月", body: 地元の有志が碑を建てる}
      # fact: hijikata-05
      - 語り: 歳三がどこに葬られたのかも、分かっていない、といわれます。2022年にも、「土方歳三はどこに埋葬されたのか」と題した報告が、出ています。
      # fact: hijikata-08
      - 語り: 箱館の戦いで亡くなった旧幕府軍の人々は、賊軍と呼ばれ、弔う人もいなかった、と、南北海道の博物館や資料館でつくる協議会の解説は書いています。
        background: {image: paintings/hijikata_hakodate_war_1869.jpg, credit: "箱館のフランス軍事顧問と旧幕府軍の人々（1869年の写真）"}
        tone: 重い
      # fact: hijikata-65
      - 語り: 旧幕府軍の人々の亡骸を集めて葬ったのが、箱館にいた侠客、柳川熊吉です。
      # fact: hijikata-63
      - 語り: 1875年の5月、東京の碧血会が、函館に碧血碑を建てます。伊豆の石を東京で刻み、船で函館へ運んだ碑です。
        card: {head: "1875年5月", body: 函館に碧血碑}
        # AI絵：J13（函館山のふもと、木立の中の大きな石の碑。人物なし）
      # fact: hijikata-63
      - 語り: 建てられてから150年の2025年にも、函館碧血会が、恒例の慰霊祭を行う、と報じられました。
      # fact: hijikata-64
      - 語り: その碑の裏の文は、誰をまつるのかを、書いていません。賊軍の死者を、おおやけにまつることが、はばかられたためだろう、と見られています。
      # fact: hijikata-14
      - 語り: ふるさとでも、碑はすぐには建ちませんでした。近藤と土方をたたえる碑を、高幡不動に建てようと、明治9年に準備が始まります。
        background: {image: paintings/hijikata_takahata_fudodo.jpg, credit: "高幡不動尊の不動堂"}
      # fact: hijikata-14
      - 語り: けれど、神奈川県令の許しが下りず、碑が建ったのは、明治21年でした。
        card: {head: "殉節両雄之碑", body: 許しが下りず明治21年に}
      # fact: hijikata-81
      - 語り: 準備を進めたのは、佐藤彦五郎ら、ふたりを支えた人々でした。碑の題は、元会津藩主の松平容保。文は、元仙台藩の儒者、大槻磐渓。書いたのは、元幕府の医師、松本順です。
      # fact: hijikata-43
      - 語り: 土方愛さんは、敗れた側の家として、一族が根絶やしにされる、という噂が立ち、親族は、遺品を処分したようだ、と語っています。手紙も、燃やしたのかもしれない、と。
        tone: 重い
        background: {image: paintings/hijikata_museum_2024.jpg, credit: "土方歳三資料館（2024年）"}
      # fact: hijikata-74
      - 語り: それでも、剣術の免状など、残してあげたい、と思った物は、まとめて残してあった、と愛さんは話しています。
        tone: しみじみ
      # fact: hijikata-19
      - 語り: 土方歳三資料館には、慶応3年に京都で鍛えられた愛刀、和泉守兼定も伝わります。刀身が公開されるのは、命日の5月11日の前後など、限られた時だけです。
      # fact: hijikata-80
      - 語り: 最後に腰にしていた刀の拵えには、柄糸のすり減りや、鞘の傷が残り、この刀への思いがうかがえる、と資料館は紹介しています。
        tone: しみじみ
      # fact: hijikata-79
      - 語り: 仲間の隊士、中島登は、明治3年に許されたあと、土方家を訪ね、甲州勝沼から先の、旧幕府軍の足どりを書いた覚え書きを、写して残しています。
      # fact: hijikata-01
      - 語り: そして、鉄之助が運んだ写真も、日野の佐藤家に残りました。
        portrait: {image: paintings/hijikata_photo_1869.jpg, caption: "土方歳三の洋装の写真（明治2年ごろ）"}
      # fact: hijikata-10, hijikata-23
      - 語り: その裏には、漢詩人の大沼枕山が作った、歳三を悼む漢詩が記されています。縦11センチ、横6.5センチほどの写真です。
        card: {head: "写真の裏", body: 大沼枕山の漢詩}
      # fact: hijikata-13
      - 語り: 明治15年には、歳三の姿をもとに、松原三五郎が肖像画を描き、これも佐藤家に伝わっています。
      # fact: hijikata-39
      - 語り: 生家の土方家にも、明治21年に写した、写真の複写が伝わっています。
        portrait: null
      # fact: hijikata-17
      - 語り: 葬られた場所は分からなくても、歳三の墓は、ふるさと日野の、石田寺にあります。
        background: {image: paintings/hijikata_grave_ishidaji_2024.jpg, credit: "石田寺の土方家の墓（2024年）"}
      # fact: hijikata-85
      - 語り: 命日の5月11日だけでなく、今も、多くの人が、この墓を訪れています。
      # fact: hijikata-09
      - 語り: 1994年、平成6年。生家の子孫が、土方歳三資料館を開きました。館長の土方愛さんは、歳三の兄から数えて、6代目の子孫です。
        background: {image: paintings/hijikata_museum_2024.jpg, credit: "土方歳三資料館（2024年）"}
        card: {head: "1994年", body: 土方歳三資料館が開く}
      # fact: hijikata-66, hijikata-45
      - 語り: 2025年、遺品の修復と複製のための呼びかけには、5,488人から、8,000万円を超える支援が、集まりました。
        card: {head: "2025年", body: 5,488人から8,000万円超}
      # 結び：なぜの答え
      - 語り: なぜ歳三は、最後に、自分の写真をふるさとへ送ったのか。
        tone: しみじみ
        background: {image: paintings/hijikata_tamagawa_hiroshige.jpg, credit: "歌川広重《江戸近郊八景之内 玉川秋月》1838年ごろ（メトロポリタン美術館）"}
      # fact: hijikata-01
      - 語り: 土方愛さんによれば、鉄之助が運んできたのは、写真と、「この者の身の上を、お頼み申します」と書いた紙きれだけでした。歳三自身が理由を書き残したものは、見つかっていません。
      # fact: hijikata-07, hijikata-76, hijikata-34
      - 語り: けれど、送り先は、剣の道へ導いてくれた義理の兄、佐藤彦五郎の家でした。そして、運び手に選んだのは、そば付きの、十代の隊士でした。
        tone: しみじみ
      # fact: hijikata-78
      - 語り: その鉄之助は、土方の写真を持ってきた人として、日野でかくまわれました。
      - 語り: 写真は、歳三の姿をふるさとへ帰し、運んだ少年を、日野の人々に守らせた。一枚の写真で、その両方を頼んだのかもしれません。
        tone: しみじみ
      # fact: hijikata-43
      - 語り: 手紙は、燃やされたのかもしれない。それでも、その写真は、今も、日野に残っています。
        tone: しみじみ
        portrait: {image: paintings/hijikata_photo_1869.jpg, caption: "土方歳三の洋装の写真（明治2年ごろ）"}
      # 締め：冒頭の写真に戻る
      # fact: hijikata-01
      - 語り: よく知られた、洋装の土方歳三の写真。その一枚の向こうには、箱館から日野まで、写真を運んだ、ひとりの少年がいました。
        tone: しみじみ
        pause: 0.8

