# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  よく知られた、洋装の土方歳三の写真。その一枚は、ひとりの少年が、箱館から、ふるさとの日野まで運んだものでした。
  写真が日野の佐藤家に届いたのは、明治2年の7月。土方は、その2か月前に、箱館で亡くなっていました。
  新選組の「鬼の副長」は、なぜ、最後に、自分の写真を、ふるさとへ送ったのか。
  この動画でわかること
  ・石田散薬を届けていた若者と、『豊玉発句集』から消された恋の句
  ・ふるさとへの手紙に見える、「鬼の副長」の別の顔
  ・洋装の写真を撮った人と時期をめぐって、食い違う記録
  ・写真を運んだ市村鉄之助の旅と、その後をめぐる2つの説
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（佐藤彦五郎新選組資料館の目録、土方歳三資料館の展示、大垣市立図書館の調べ、土方歳三資料館の土方愛さんの話など）を語りで示してから読んでいます。

en:
  title: "Hijikata Toshizo: Why Did He Send His Own Photograph Home at the End?"
  description: |-
    The well-known photograph of Hijikata Toshizo in Western dress - one print of it was carried by a teenage boy from Hakodate all the way to Hino, his home town.
    It reached the Sato family in Hino in the seventh month of 1869. Hijikata had died in Hakodate two months earlier.
    Why did the "demon vice-commander" of the Shinsengumi send his own photograph home at the very end?
    In this video you will learn:
    - The young man who delivered his family's Ishida medicine, and the love poems crossed out of his haiku collection
    - Another face of the "demon vice-commander" seen in his letters home
    - The records that disagree about who took the photograph and when
    - The journey of Ichimura Tetsunosuke, who carried the photograph, and the two stories of what became of him
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Who Carried His Photograph Home? Hakodate to Hino, 1869"
    - "Who Stood Behind the Young Toshizo? Ishida Village and Hino"
    - "Was the Demon Vice-Commander Really a Demon? Letters from Kyoto"
    - "Who Took the Photograph in Western Dress, and When? Hakodate"
    - "'I Ask You to Look After This Boy': Ichimura Tetsunosuke's Journey"
    - "Why Did Hijikata Send His Photograph Home? The Monuments of Hakodate and the Museum in Hino"

