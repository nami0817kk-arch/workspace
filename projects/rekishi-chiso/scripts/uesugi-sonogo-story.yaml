# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  人口およそ6千人の町に、3万人が引っ越してきた。1601年、いまの山形県の米沢で起きたことです。
  関ヶ原で徳川に逆らった上杉家は、会津120万石から米沢30万石へ。領地は4分の1、家臣の知行は3分の1になりました。それでも上杉家は、米沢の殿様として続いていきます。
  なぜ、上杉家は続いたのか。上杉景勝と直江兼続のその後を、昭和の伝記に引かれた当時の書状と覚書、江戸時代の記録、博物館と図書館の調べで、年の順にたどりました。
  この動画でわかること
  ・伏見へ謝りに行った景勝と、30万石が決まるまで
  ・6千人の町に来た3万人と、城下の外れの「原方衆」
  ・兼続が築いた堤と堀、400年後まで残るもの
  ・徳川の重臣・本多正信の息子を婿に迎えた約束と、同じ年に生まれた跡継ぎ
  ・兼続と景勝の最期と、記録で割れる年齢・禄・笑顔の場面
description_note: |-
  減封と米沢への移り、兼続の治水、本多政重の養子入り、兼続の最期は、木村徳衛『直江兼続伝』（1944年）と、それが引く上杉家の記録・書状（『景勝卿記』、兼続の覚書、鎌田政近の書状、本多家譜など）、『大日本史料』第12編之32（1935年）に収められた『上杉年譜』『上杉家中諸士略系譜』によります。米沢の人口と移った人数は山形大学附属図書館・附属博物館の展示解説（2009年）、原方衆は長井政太郎「上杉藩の郷士聚落の研究」（1936年）、直江版文選と兼続の蔵書は市立米沢図書館の展示解説によります。
  年月日・石高・年齢・年数は、自分で計算し直したものです。年齢は数え年で言っています。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。上杉景勝・直江兼続・徳川家康の肖像、関ヶ原と大坂の陣の絵図は、パブリックドメインのものです。サムネイルの絵も、AI による想像図です。

en:
  title: "Uesugi Kagekatsu and Naoe Kanetsugu: Cut to a Quarter of Their Land, How Did the Uesugi Survive?"
  description: |-
    In 1601, about 30,000 people moved into Yonezawa, a town of about 6,000. They were the retainers of the Uesugi clan and their families.
    After opposing Tokugawa Ieyasu at Sekigahara, the Uesugi were cut from 1.2 million koku at Aizu to 300,000 koku at Yonezawa. Their land became a quarter, and their retainers' stipends a third. Yet the Uesugi house continued as the lords of Yonezawa.
    How did they survive? We follow Uesugi Kagekatsu and Naoe Kanetsugu after Sekigahara, through letters and memoranda quoted in a 1944 biography, Edo-period records, and museum and library research.
    In this video you will learn:
    - Kagekatsu's apology at Fushimi and the decision of 300,000 koku
    - 30,000 people in a town of 6,000, and the "Harakata-shu" samurai farmers
    - The embankments and canals built by Kanetsugu, still there 400 years later
    - Why Kanetsugu adopted the son of Tokugawa adviser Honda Masanobu, and the heir born the same year
    - The last days of Kanetsugu and Kagekatsu, and how records differ
    Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "30,000 People in a Town of 6,000"
    - "The Apology at Fushimi, 1601"
    - "Where Did the Retainers Go?"
    - "Kanetsugu's Rivers and Town"
    - "The Son of Honda Masanobu"
    - "Books and Learning in Yonezawa"
    - "The Last Days of Kanetsugu and Kagekatsu"
    - "Summary: Why Did the Uesugi Survive?"

