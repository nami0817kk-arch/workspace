sections:
  # ================================================================ 序章（冒頭30秒：6千人の町に3万人→関ヶ原で逆らった家→4分の1→3分の1・入りきらない→それでも続いた→問いと手がかり）
  - title: 6千人の町に3万人が来た　1601年、米沢
    background: {image: paintings/mitsunari_uesugi_kagekatsu_armor.jpg, credit: "《上杉景勝像》17世紀（米沢市上杉博物館蔵）"}
    year: 1601
    lines:
      # fact: uesugi-38
      - 語り: 領地を4分の1に減らされても、なぜ上杉家は続いたのか。1601年、人口6千人ほどの町に、およそ3万人が、引っ越してきました。
        tone: 重い
      # fact: uesugi-38
      - 語り: やってきたのは、関ヶ原の年に家康に逆らった、上杉家の家臣と家族。場所は、いまの山形県の米沢です。
      # fact: uesugi-13
      - 語り: 上杉家の領地は、会津の120万石から、米沢の30万石へ。《4分の1》です。
        tone: 強調
      # fact: uesugi-16
      - 語り: 家臣の取り分は、前の《3分の1》。町には、入りきりません。
      - 語り: それでも上杉家は、米沢の殿様として、江戸時代の終わりまで、続いていきます。
        tone: しみじみ
      - 語り: その手がかりは、いまも米沢に残る石の堤と、城下の外れの田畑にあります。
        tone: しみじみ
        pause: 0.5
      # fact: uesugi-24
      - 語り: 家臣のかしら、家老の直江兼続は、やがて、家康の重臣、本多正信の息子を、婿養子に迎えます。
      # fact: uesugi-30
      - 語り: 主君の上杉景勝は、謙信の跡を継いだ殿様。家来たちは、その笑顔を、一度しか見たことがない、と言われた人です。
      # fact: uesugi-17
      - 語り: 木村徳衛が昭和19年に出した伝記、『直江兼続伝』によれば、当時の米沢は、人口6千27人。家は、803軒しかありませんでした。
        card: {head: "当時の米沢", body: 人口6,027人・803戸}
      - 語り: 30万石になってから、ふたりが生きた、20年ほど。その間に、何をしたのか。
        tone: しみじみ
        pause: 0.6
      - 語り: 始まりは、1601年の夏。景勝は、会津から、家康のいる京へ向かいます。
        pause: 0.6

  # ================================================================ 第1章 伏見への謝罪（1601）
  - title: 景勝はどう謝ったのか　1601年、伏見と大坂
    background: {image: paintings/sekigahara_tokugawa_ieyasu.jpg, credit: "《徳川家康像》17世紀"}
    year: 1601
    lines:
      - 語り: その前の年、1600年。会津にいた上杉家は、家康と対立し、家康は、上杉を討つために、東へ兵を向けました。
      - 語り: その途中で、石田三成たちが西で兵を挙げ、関ヶ原の戦いになります。勝ったのは、家康でした。
      # fact: uesugi-14
      - 語り: 負けた側についた上杉家は、まず、重臣の本庄繁長を、京へ送ります。景勝の罪を、謝るためです。
        card: {head: "まず送った使い", body: 重臣・本庄繁長}
      # fact: uesugi-14
      - 語り: 取りなしに動いたのは、家康の次男の結城秀康や、家康の重臣、本多正信たち。木村の伝記は、そう書いています。
        figure: {type: people, title: 謝罪の取りなし, nodes: [[上杉景勝, 会津の大名], [本庄繁長, 謝りに出た重臣], [結城秀康, 家康の次男], [本多正信, 家康の重臣], [徳川家康, 関ヶ原の勝者]], edges: [[上杉景勝, 本庄繁長, 使い], [結城秀康, 徳川家康, 取りなし], [本多正信, 徳川家康, 取りなし]]}
      - 語り: この本多正信の名前は、このあとも、上杉家の行く先に、何度も出てきます。
        tone: 強調
        figure: null
      # fact: uesugi-14
      - 語り: 慶長6年、1601年の7月1日。景勝は、兼続を連れて、会津の若松を発ちました。伏見の屋敷に入ったのは、7月24日です。
        card: {head: "慶長6年7月", body: 景勝と兼続、伏見へ}
      # fact: uesugi-15, uesugi-82
      - 語り: このころの京のうわさを、薩摩の島津家の家臣、鎌田政近が、書状に書き留めています。
      # fact: uesugi-15
      - 語り: 景勝の供の騎馬は、《10騎》ほど。家老の兼続の供は、30騎あまり。
        tone: 強調
        card: {head: "鎌田政近の書状", body: 京のうわさ「景勝10騎・兼続30騎」}
      # fact: uesugi-82
      - 語り: 木村は、これは実際には、あり得ない話だ、と書いています。それでも、主君より家老の供が多い、と京でうわさされるほど、兼続は目立っていました。
        tone: しみじみ
      # fact: uesugi-13
      - 語り: そして8月16日。景勝は大坂で、まず豊臣秀頼に会い、そのあと家康に会って、処分を言い渡されました。
        tone: 重い
      # fact: uesugi-13
      - 語り: 残されたのは、いまの山形県の置賜地方と、福島県の北の一部。合わせて、30万石でした。
        figure: {type: map, title: 会津から米沢へ, bounds: [139.3, 141.0, 37.2, 38.3], places: [[会津若松, 139.93, 37.49], [米沢, 140.12, 37.91], [福島, 140.47, 37.76]], route: [会津若松, 米沢]}
      - 語り: 120万石が30万石。4分の1です。残りの4分の3にあたる、90万石分の土地は、取り上げられました。
        tone: 強調
        figure: {type: bars, title: 上杉家の石高, bars: [[会津のころ, 120], [米沢へ移ったあと, 30]], labels: ["120万石", "30万石"]}
      # fact: uesugi-36
      - 語り: 一方で、木村は、こんなことも書いています。関ヶ原の張本人と言われた兼続は、何の咎めも、受けなかった。
        figure: null
      # fact: uesugi-83
      - 語り: 減封、つまり領地を減らす処分が決まった年の、10月4日。兼続は、京で、漢詩と和歌をつなぐ、聯句の会を開いています。用事が山のようにある中でも、余裕たっぷりだった、と木村は書きます。
        card: {head: "慶長6年10月4日", body: 兼続、京で聯句の会}
      - 語り: けれど、米沢では、もっと大きな問題が、待っていました。
        hook: true
      - 語り: 120万石の家臣を、30万石の土地に、どうやって入れるのか。
        tone: 重い
        hook: true

  # ================================================================ 第2章 6千人の町に3万人（家臣の行き先・原方衆。「一人も手放さなかった」の検証はここだけ）
  - title: 家臣はどこに住んだのか　6千人の町と原方衆
    background: {image: paintings/mitsunari_uesugi_kagekatsu_armor.jpg, credit: "《上杉景勝像》17世紀（米沢市上杉博物館蔵）"}
    year: 1601
    lines:
      # fact: uesugi-16
      - 語り: 上杉家は、家臣を、新しい領地へ移しました。その代わりに、知行、つまり家臣が受け取る取り分を、それまでの3分の1にしました。
        card: {head: "家臣の知行", body: それまでの3分の1}
      # fact: uesugi-16
      - 語り: 兼続の覚書には、こうあります。知行は、これまでの3分の1ずつを渡す。伊達と信夫と米沢で、取り合わせて渡せ。
      # fact: uesugi-16
      - 語り: 上杉家は、越後から会津に移ったとき、越後以来の家臣の知行を、越後のころの2倍にしていました。その知行が、3年で、3分の1になったんです。
        tone: 重い
      # fact: uesugi-39
      - 語り: 米沢に移ってすぐの、慶長6年10月16日。その日付で、家臣の平林正恒に、新しい知行を割り当てた書状が、米沢市上杉博物館に残っています。
        card: {head: "慶長6年10月16日", body: 米沢で新しい知行を割り当て}
      - 語り: 上杉家は、家臣を一人も手放さなかった。そんなふうに、語られることがあります。
      # fact: uesugi-81
      - 語り: けれど、木村が引く、景勝の記録、『景勝卿記』は、こう書きます。会津で召し抱えた浪人たちは、散り散りになり、供をしたのは、古くからの家臣ばかりだった。
        tone: 強調
        card: {head: "景勝卿記", body: 浪人は散り、譜代の家臣だけが供を}
      - 語り: 去った者もいました。それでも、残った家臣と、その家族だけで、町の何倍もの人数でした。
      # fact: uesugi-31
      - 語り: 移った先の米沢の城は、もともと、兼続が、慶長3年から預かっていた城です。
      # fact: uesugi-31
      - 語り: 江戸時代の地誌、『米沢事跡考』によれば、兼続が預かったころの城は、堀が一重で、本丸があるだけでした。
        card: {head: "米沢事跡考", body: 堀は一重・本丸だけ}
      # fact: uesugi-38
      - 語り: そこへ、家臣と家族、およそ3万人が移ったことになる。山形大学の附属図書館と博物館は、2009年の展示の解説で、そう書いています。
        figure: {type: bars, title: 米沢の町と移ってきた人, bars: [[もとの町の人口, 6027], [移ってきた家臣と家族, 30000]], labels: ["6,027人", "およそ3万人"]}
      - 語り: もとの町の、5倍ほどの人です。
        tone: 強調
      # fact: uesugi-19
      - 語り: 城下に、入りきるはずがありません。昭和11年に出た、長井政太郎の研究は、城下に入りきらない下級の武士が、南原など、城下の外れに置かれた、と書きます。
        figure: null
      # fact: uesugi-19
      - 語り: 身分の軽い者たちが移ったのは、翌年の2月だった、といいます。
      # fact: uesugi-19, uesugi-43
      - 語り: 城下の外れに住む彼らは、原方衆と呼ばれました。荒れた土地を開いて、田畑を耕しながら、武士として、仕えたんです。
        card: {head: "原方衆", body: 城下の外れで田畑を耕す家臣}
      # fact: uesugi-19
      - 語り: 240年ほどのち、江戸の終わり近くの旅日記は、こう書きます。山や野に住む、禄の少ない侍は、およそ8つの組。1つの組に、200人あまり。耕して、雇われ仕事もして、自分で暮らしを立てている。
        card: {head: "天保の旅日記", body: 8つの組・1組200人あまり}
      # fact: uesugi-19
      - 語り: そして、ある人は語った。原方の者の力は、城下の侍の、3倍だ、と。
        tone: 強調
      - 語り: 取り分が3分の1でも、自分の田畑を耕せば、食べていける。米沢に移った家臣たちは、そうやって、根を下ろしました。
        tone: しみじみ
      # fact: uesugi-40
      - 語り: 残った家臣の中には、関ヶ原の年に、兼続から、退く軍のしんがりを任された、前田慶次もいました。
        portrait: {image: paintings/toshiie_portrait_keiji.jpg, caption: "前田慶次（江戸時代の浮世絵・想像図）"}
      # fact: uesugi-40
      - 語り: 慶長7年、1602年。兼続や慶次たち、上杉家の家臣20人あまりが、漢詩と和歌を百首、奉納します。「亀岡百首」です。兼続は漢詩を7首、慶次は和歌を5首。市立米沢図書館の解説にあります。
        card: {head: "1602年", body: 亀岡百首を奉納}
        portrait: null
      - 語り: 30万石に減らされた翌年に、家臣たちは、歌を詠んでいました。
        tone: しみじみ
      - 語り: けれど、3万人が暮らすには、米沢の土地は、まだ足りません。そして、町のすぐそばには、暴れる川が、流れていました。
        hook: true
      - 語り: 兼続は、その川の様子を、山の上から、確かめます。
        hook: true

  # ================================================================ 第3章 兼続の川と町（直江石堤・帯刀堰・堀立川）
  - title: 兼続は山の上から何を見たのか　直江石堤と帯刀堰
    background: {image: paintings/mitsunari_naoe_kanetsugu_portrait.jpg, credit: "《直江兼続像》"}
    year: 1609
    lines:
      # fact: uesugi-44
      - 語り: 米沢の町のそばを流れる松川。いまの最上川の、上の流れです。この川は、大雨のたびにあふれる、暴れ川でした。
        portrait: {image: paintings/mitsunari_naoe_kanetsugu_portrait.jpg, caption: "直江兼続像"}
      # fact: uesugi-20
      - 語り: 木村が引く伝えによれば、『軒の玉水』という記録に、こうあります。兼続は、自分で赤崩の山に登り、米沢の城と、松川の流れを見渡した。
        portrait: null
      # fact: uesugi-20
      - 語り: そして、谷地河原という場所に、堤を築かせた。
        tone: 強調
        card: {head: "軒の玉水", body: 赤崩の山から城と川を見る}
      # fact: uesugi-44, uesugi-84
      - 語り: 石を積んだこの堤は、のちに、直江石堤と呼ばれます。その一部、およそ1.2キロが、米沢市の文化財に指定されています。国土交通省の東北地方整備局の案内に、そうあります。
        card: {head: "直江石堤", body: 一部の約1.2キロが市の文化財}
      # fact: uesugi-21
      - 語り: 兼続は、川を抑えるだけでなく、水を引くことも、考えました。
      # fact: uesugi-21
      - 語り: 鬼面川という別の川から、城下へ水を分ける堰を、家臣の松本助兵衛らに掘らせます。はじめは、西川堰と呼ばれました。
      # fact: uesugi-45
      - 語り: この堰は、武士たちが、自分で工事に出たので、のちに、帯刀堰と呼ばれます。刀を帯びる、と書いて、帯刀です。国土交通省の案内にある、名前の由来です。
        card: {head: "帯刀堰", body: 武士が工事に出た堰}
      # fact: uesugi-45
      - 語り: この堰は、薪を流して運ぶのにも使われ、木場川とも、呼ばれました。
      # fact: uesugi-21
      - 語り: 町の中にも、堀を通します。堀立川を掘ったのは、慶長14年、1609年の夏でした。
        card: {head: "慶長14年夏", body: 堀立川を掘る}
      # fact: uesugi-41
      - 語り: 同じ1609年。山形大学の解説によれば、米沢の城が、ようやく出来上がります。そのあと三の丸が作られ、家臣たちに、屋敷が割り当てられていきました。
        card: {head: "1609年", body: 米沢城が出来上がる}
      # fact: uesugi-42
      - 語り: 米沢市上杉博物館の紹介では、米沢城は、本丸を、二の丸と三の丸が囲む、平らな土地の城です。城の目印になったのは、三階の櫓でした。
        card: {head: "米沢城", body: 目印は三階の櫓}
      # fact: uesugi-42
      - 語り: いまも、本丸のまわりには、堀と、土を盛った土塁が、残っています。
      # fact: uesugi-69
      - 語り: 米沢市の観光の冊子は、兼続が、ほかにも、猿尾堰などを築き、布の原料の青苧、漆、紅花といった、お金になる作物を勧めた、と紹介しています。
      # fact: uesugi-47
      - 語り: 猿尾堰の取り入れ口の上流には、龍師火帝の碑、という石碑があります。洪水と日照りから民を守るため、兼続が水の神と火の神を祀った、と伝わります。
      # fact: uesugi-46
      - 語り: 堤は、そのあとも、大雨のたびに壊れました。山形県の紹介によれば、文化9年、1812年の修理には、延べ9,727人の藩士が、駆り出されています。
        tone: 強調
        card: {head: "1812年の修理", body: 延べ9,727人の藩士}
      - 語り: 兼続が築かせた堤を、200年あまりたっても、藩士たちが、自分の手で、直していたんです。
        tone: しみじみ
      - 語り: 話を、米沢に移ってまもないころに戻します。川と町の工事が始まるころ、上杉家には、もっと危ない問題が、ありました。
        hook: true
      - 語り: 景勝には、跡継ぎの男の子が、いなかったんです。
        tone: 重い
        hook: true

  # ================================================================ 第4章 徳川の重臣の息子を婿に（本多政重・定勝の誕生・軍役の免除）
  - title: なぜ家康の重臣の息子を婿にしたのか　本多政重と1604年
    background: {image: paintings/sekigahara_tokugawa_ieyasu.jpg, credit: "《徳川家康像》17世紀"}
    year: 1604
    lines:
      # fact: uesugi-24
      - 語り: その上杉家に、思いがけない人が、入ってきます。本多政重。家康の重臣、本多正信の、次男です。
        card: {head: "本多政重", body: 本多正信の次男}
      # fact: uesugi-85
      - 語り: 本多家の家譜、つまり家の歴史の記録は、こう書きます。景勝には、実の子が無い。そこで、兼続の娘を景勝の養女にして、政重に嫁がせ、生まれた男の子に、上杉家を継がせたい。
        tone: 強調
      # fact: uesugi-25
      - 語り: 1604年、兼続には、数えで7歳の息子、景明がいました。それでも兼続は、政重を、自分の家の婿に迎えます。
      # fact: uesugi-24
      - 語り: 慶長9年、1604年の秋。兼続は、政重を養子に迎え、自分の長女と、夫婦にしました。
        card: {head: "慶長9年", body: 政重が兼続の婿養子に}
      # fact: uesugi-24
      - 語り: 景勝は、たいへん喜んで、政重に、1万石を与えた、といいます。名乗りは、直江大和守勝吉。
        card: {head: "直江勝吉", body: 景勝から1万石}
      # fact: uesugi-29
      - 語り: ところが、同じ1604年の、5月5日。米沢で、景勝に、初めての男の子が生まれていました。のちの、上杉定勝。景勝は、数えで50歳でした。
        tone: 強調
        card: {head: "慶長9年5月5日", body: 跡継ぎ・定勝が生まれる}
      # fact: uesugi-29, uesugi-56
      - 語り: 母は、京の公家、四辻家の娘。けれど、産後の具合が悪く、8月17日に、亡くなりました。子が生まれて、3か月あまりでした。
        tone: 重い
      # fact: uesugi-56
      - 語り: 山形県の資料によれば、同じ年の2月には、景勝の正室、武田信玄の娘の菊姫も、47歳で亡くなっています。
      - 語り: 1年のうちに、景勝は、正室と、跡継ぎの母を失い、跡継ぎを、ひとり得ました。
        tone: しみじみ
      # fact: uesugi-85
      - 語り: 跡継ぎが生まれたのに、なぜ、上杉家を継がせる約束の婿が来たのか。木村は、約束そのものは、定勝が生まれる前の、1602年か1603年だったのだろう、と見ています。
      # fact: uesugi-85
      - 語り: そして、本多家の家譜の書き方も、まったくの誤りとは言えない、と結んでいます。
      # fact: uesugi-86
      - 語り: 政重に嫁いだ長女は、まもなく病で亡くなります。慶長14年、1609年。兼続は、弟の大国実頼の娘を、自分の養女にして、あらためて政重に嫁がせました。
        card: {head: "慶長14年", body: 兼続の姪を養女にして政重へ}
      # fact: uesugi-51
      - 語り: 米沢市上杉博物館は、2018年の特別展で、正信と政重の親子を、上杉家と幕府の仲を安定させるのに、大事な役目を果たした人たち、と紹介しています。
      # fact: uesugi-33
      - 語り: その同じ1609年の6月。幕府は、上杉家の軍役を、3分の1減らしました。軍役とは、石高に応じて、幕府に出す兵と、負担のことです。
        card: {head: "慶長14年6月", body: 軍役の3分の1を免除}
      # fact: uesugi-33
      - 語り: 30万石の3分の1にあたる、10万石分です。米沢と福島は、やせた土地で、家臣に分ける余りがない、というのが理由でした。
        tone: 強調
      # fact: uesugi-33
      - 語り: 木村は、兼続がひそかに願い出て、本多正信が取りなした結果だ、と書いています。
      # fact: uesugi-24
      - 語り: その2年後の、慶長16年、1611年。政重は、上杉家を去ります。のちには、加賀の前田家に、仕えました。
        card: {head: "慶長16年", body: 政重が上杉家を去る}
      - 語り: 婿は去り、兼続の家の跡継ぎは、実の息子の景明だけになりました。
      - 語り: 政重が上杉家にいたあいだ、兼続は、京都のある寺に、ひとつの頼みごとをしていました。
        hook: true
      - 語り: それは、堤でも、堀でもありませんでした。
        hook: true

  # ================================================================ 第5章 本と学問（直江版文選・禅林寺）
  - title: 30万石の家老は何を残そうとしたのか　直江版と禅林寺
    background: {image: paintings/mitsunari_naoe_kanetsugu_portrait.jpg, credit: "《直江兼続像》"}
    year: 1607
    lines:
      # fact: uesugi-22, uesugi-48
      - 語り: 慶長12年、1607年。兼続は、京都の要法寺という寺に頼んで、中国の古い詩文集、『文選』を、活字で刷らせました。
        card: {head: "1607年", body: 京都の要法寺で『文選』を刷る}
      # fact: uesugi-48
      - 語り: のちに、直江版、と呼ばれる本です。市立米沢図書館には、31冊が、伝わっています。
      # fact: uesugi-50
      - 語り: 兼続が集めた本は、850冊にのぼります。その中には、いまは国宝になっている、中国の宋の時代に刷られた、『史記』『漢書』『後漢書』もありました。
        card: {head: "兼続の本", body: 850冊・国宝の宋版も}
      # fact: uesugi-89
      - 語り: 明治41年、米沢の郷土史家、伊佐早謙は、ある話を紹介しました。兼続は、朝鮮に攻め込んだとき、現地で本を集めさせた。
      # fact: uesugi-70
      - 語り: けれど、山形大学の解説によれば、昭和32年の調べで、もとは、京都の大きな禅寺の僧から譲られた本だと分かり、朝鮮で集めた話は、伝説とされました。
        tone: 強調
      # fact: uesugi-23
      - 語り: 元和4年、1618年。兼続は、いまの栃木県にあった学問所、足利学校で学んだ僧、九山を招いて、米沢に禅林寺を建てます。本を置いて、家臣の子どもたちが、学ぶ場所にしました。
        card: {head: "1618年", body: 禅林寺を建てる}
      - 語り: 領地が4分の1になった家でも、家臣の子が学ぶ場所は、作ったんです。
        tone: しみじみ
      # fact: uesugi-49
      - 語り: 禅林寺は、のちの法泉寺です。そして明治42年、1909年。その境内に、米沢図書館が開きました。
      - 語り: 禅林寺から数えて、291年後のことです。
        tone: しみじみ
      # fact: uesugi-71
      - 語り: 江戸の半ば、延享2年、1745年。米沢藩の藩士が、同僚に、直江様の書状を譲ってほしい、と頼んだ手紙が、残っています。
        card: {head: "1745年の手紙", body: 「直江様の書状を譲って」}
      # fact: uesugi-71
      - 語り: 藩士たちにとって、兼続の書状は、大切にしたい宝になっていました。
        tone: しみじみ
      - 語り: けれど、本を集め、学ぶ場を作った兼続にも、守れなかったものがあります。
        hook: true
      - 語り: 1615年の7月。直江家を、悲しみが襲います。
        tone: 重い
        hook: true

  # ================================================================ 第6章 二人の最期（鴫野・景明・兼続・景勝、食い違い①禄②兼続の死③猿）
  - title: 兼続と景勝はどう最期を迎えたのか　1620年と1623年
    background: {image: paintings/ieyasu_osaka_winter_siege_map_1614.jpg, credit: "《大坂城仕寄之図》（江戸時代）"}
    year: 1615
    lines:
      # fact: uesugi-32
      - 語り: その前の年、1614年の大坂冬の陣。上杉家は、徳川の側について、大坂の城の東、鴫野という場所で戦いました。
        card: {head: "慶長19年11月26日", body: 鴫野の戦い}
      - 語り: 関ヶ原で家康に逆らった家が、14年後には、徳川の側で、戦っていました。
        tone: しみじみ
      # fact: uesugi-25
      - 語り: その翌年、元和元年、1615年の7月12日。兼続の息子、景明が、亡くなります。数えで、18歳でした。
        tone: 重い
        card: {head: "元和元年7月12日", body: 兼続の息子・景明が18歳で死去}
      # fact: uesugi-25
      - 語り: 景明は、慶長14年の暮れに、本多正信の仲人で、大名の戸田氏鉄の娘と、結婚していました。
      - 語り: 婿の政重は、もういません。兼続の家を継ぐ男子は、いなくなりました。
        tone: しみじみ
      # fact: uesugi-27
      - 語り: それから4年あまり。元和5年の12月19日。兼続は、江戸の屋敷で亡くなります。西暦では、1620年の1月でした。
        tone: 重い
        card: {head: "元和5年12月19日", body: 兼続、江戸の屋敷で死去}
      # fact: uesugi-27
      - 語り: 上杉家がまとめた記録、『上杉年譜』は、年は60と書きます。ところが、家臣の系図を集めた、『上杉家中諸士略系譜』では、亡くなった日は12月9日。年は62です。
        figure: {type: stats, title: 兼続の最期　記録の違い, items: [[上杉年譜, 12月19日, 60歳], [上杉家中諸士略系譜, 12月9日, 62歳]], upto: 2}
      - 語り: 生まれを永禄3年、1560年とすると、数えで60歳。62歳は、2年多い数字です。
        figure: null
      # fact: uesugi-34
      - 語り: 兼続の禄も、記録で違います。慶長16年の知行の目録では、3万石。ところが、明治の『郡村誌』は、6万石と書きます。
      # fact: uesugi-34
      - 語り: その『郡村誌』には、こんな話も載っています。兼続は、自分の6万石のうち、5万石を差し出して、家臣を助けるのに使わせた。
        figure: {type: stats, title: 兼続の禄　記録の違い, items: [[知行の目録（慶長16年）, 3万石], [郡村誌（明治）, 6万石, 5万石を家臣のために]], upto: 2}
      # fact: uesugi-88
      - 語り: けれど木村は、6万石も、この話も、誤って伝わったもので、実際は3万石だった、と見ています。
        tone: 強調
        figure: null
      # fact: uesugi-28
      - 語り: 兼続の死から3年あまり。元和9年、1623年の3月20日。今度は、景勝が亡くなります。数えで、69歳。跡は、19年前に生まれた、あの定勝が継ぎました。
        tone: 重い
        card: {head: "元和9年3月20日", body: 景勝が死去・定勝が継ぐ}
        portrait: {image: paintings/mitsunari_uesugi_kagekatsu_armor.jpg, caption: "上杉景勝像（米沢市上杉博物館蔵）"}
      # fact: uesugi-30
      # 『近古史談』の初版 元治元年（1864）は国立国会図書館サーチの書誌（uesugi-90）。明治15年（1882）は再刊。
      - 語り: ふだん、喜ぶ顔を見せなかった景勝。その景勝が笑った話を、幕末の学者、大槻磐渓が、1864年に出した『近古史談』に書いています。
        portrait: null
      # fact: uesugi-30
      - 語り: 飼っていた猿が、景勝の脱いだ頭巾をかぶって、庭の木に登り、景勝に向かって、3度うなずいた。景勝は、はじめて、にっこりした。家来が景勝の笑顔を見たのは、この一度だけだった。
        card: {head: "近古史談", body: 猿を見て一度だけ笑う}
      # fact: uesugi-30
      - 語り: ところが、岡谷繁実の『名将言行録』では、猿は、景勝のいつも座る場所に上がって、手を組み、家来に指図するように、うなずいた、とあります。
        figure: {type: stats, title: 景勝が笑った猿　書き方の違い, items: [[近古史談（1864年）, 頭巾をかぶり木の上で, 3度うなずく], [名将言行録, 景勝の座に上がり, 家来に指図するしぐさ]], upto: 2}
      - 語り: どちらも、景勝の死から、240年ほどのちの本です。
        figure: null
      # fact: uesugi-87
      - 語り: 景勝の死から2年後の、寛永2年、1625年。上杉家は、兼続の妻、お船に、3千石を与えました。家中の人々は、お船を名前では呼ばず、後室と呼びました。
        card: {head: "寛永2年", body: 兼続の妻・お船に3千石}
      # fact: uesugi-53, uesugi-72
      - 語り: 兼続が亡くなって9年後の、寛永6年、1629年。妻のお船は、夫と子を弔うために、高野山に塔を建てました。
        card: {head: "寛永6年", body: お船が高野山に塔を建てる}
      # fact: uesugi-72
      - 語り: 市立米沢図書館の解説によれば、その塔の壁には、兼続と息子の姿が描かれていました。塔は、文化6年、1809年に焼けてしまいます。
      # fact: uesugi-72
      - 語り: いま、よく知られている兼続の肖像は、江戸時代の図録、『集古十種』が、その壁の絵を写したものです。
        tone: しみじみ
      # fact: uesugi-58
      - 語り: 米沢には、歴代の殿様を祀る建物、霊屋が並ぶ、上杉家廟所があります。景勝の霊屋も、そこにあります。1984年に、国の史跡になりました。
        card: {head: "上杉家廟所", body: 国の史跡（1984年）}
      # fact: uesugi-73
      - 語り: 米沢の林泉寺の、上杉家と家臣たちの墓所は、2019年に、山形県の史跡になりました。そこには、菊姫の墓と、兼続とお船の、夫婦の墓があります。
        card: {head: "林泉寺", body: 菊姫の墓・兼続夫婦の墓}
      - 語り: 二人が去ったあとも、米沢には、二人が置いていったものが、残りました。
        hook: true
      - 語り: それが、上杉家が続いた理由と、つながっています。
        hook: true

  # ================================================================ まとめ（答え→冒頭の「6千人の町に3万人」に戻る）
  - title: まとめ：120万石から30万石に減っても、なぜ上杉家は続いたのか
    background: {image: paintings/mitsunari_uesugi_kagekatsu_armor.jpg, credit: "《上杉景勝像》17世紀（米沢市上杉博物館蔵）"}
    year: 1623
    lines:
      - 語り: 120万石から30万石に減っても、なぜ、上杉家は続いたのか。
        tone: 疑問
        pause: 0.6
      - 語り: 記録から見えてくるのは、3つです。
      - 語り: ひとつは、家臣を、城下の外れで田畑を耕す武士として、住まわせたこと。取り分が3分の1でも、自分で食べていける形でした。
        tone: しみじみ
      - 語り: ふたつめは、川を抑え、水を引いて、3万人を迎えた町を、整えたこと。その堤は、200年あまりたっても、藩士たちが、自分の手で直していました。
        tone: しみじみ
      - 語り: そして、みっつめは、逆らった相手、徳川の重臣の本多正信と、縁を結んだこと。その取りなしで、幕府は、上杉家の軍役を、3分の1減らしました。
        tone: しみじみ
      - 語り: その間に、兼続の家は、跡継ぎを失いました。続いたのは、主君の上杉家のほうでした。
        tone: しみじみ
        pause: 0.6
      - 語り: 人口6千人の町に、3万人が、引っ越してきた。その町に、上杉家は、江戸の終わりまで、住み続けました。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
