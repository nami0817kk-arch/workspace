# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。上杉景勝と直江兼続のその後（1601〜1629）。2026-11-18 作成。公開の予定は 11/23 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の A その後型（戦国〜江戸初期）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「120万石から30万石に減っても、なぜ上杉家は続いたのか」。主役は景勝と兼続の主従（上杉家）。答えの席＝まとめで出す3つ（家臣を城下の外れで耕す武士として住まわせた／川と町を整えた／本多正信と縁を結び軍役を減らされた）。題名・サムネでは明かさない。
#   冒頭＝6千人の町に3万人（uesugi-17・38）→領地は4分の1・知行は3分の1（16）→問いと手がかり（石の堤・城下の外れの田畑）→本多正信の息子を婿に（24）→笑顔は一度だけ（30）。
#   他チャンネル（歴史横丁「120万石から30万石へ」＝家臣を一人も解雇しなかった美談＋大坂の陣の陣所）と重ねない：「一人も手放さなかった」は第2章で『景勝卿記』（浪人は散り、譜代だけが供をした、uesugi-81）と並べて1回だけ。大坂の陣は鴫野の2行だけ。
#   謙信の回（kenshin-story.yaml）と重ねない：謙信の遺骸を会津・米沢へ運んだ話（uesugi-75）は使わない。吉良の回（kira.yaml）の15万石への半減は使わない。
#   型の作り：序章／第1章 伏見への謝罪（1601）／第2章 6千人の町に3万人（家臣の行き先・原方衆）／第3章 兼続の川と町（直江石堤・帯刀堰・堀立川）／
#   第4章 徳川の重臣の息子を婿に（本多家譜の約束・定勝の誕生・軍役の免除）／第5章 本と学問（直江版文選・禅林寺）／第6章 二人の最期（景明・兼続・景勝、食い違い①②③）／まとめ。
# 記録の食い違い：①兼続の禄（慶長16年の知行目録＝3万石／明治の郡村誌＝6万石・5万石を家臣に。木村は誤伝とする uesugi-88）
#   ②兼続の死（上杉年譜＝12月19日・60歳／諸士略系譜＝12月9日・62歳）
#   ③景勝の笑顔の場面（大槻磐渓『近古史談』1864（元治元年。明治15年は再刊）＝頭巾をかぶって木に登りうなずく猿／岡谷繁実『名将言行録』＝景勝の座に上がって家来に指図するしぐさの猿）。
# 計算（自分で計算し直した）：120万石→30万石＝4分の1（25%）。知行は前の3分の1。6,027人の町に約3万人＝約5倍（30000÷6027≒4.98）。
#   軍役の3分の1＝30万石の3分の1＝10万石分。景勝 弘治元年（1555）11月27日生まれ・元和9年（1623）3月20日没＝数え69（1623−1555＋1）。
#   兼続 永禄3年（1560）生まれ・元和5年12月19日没（西暦では1620年1月）＝数え60（1619−1560＋1）。略系譜の62は2年多い。
#   景明 慶長3年（1598）生まれ・元和元年（1615）没＝数え18。1604年に数え7。結婚 慶長14年（1609）＝死の6年前。定勝 慶長9年（1604）5月5日生まれ＝景勝は数え50。生母は同年8月17日没（約3か月あまり後）。
#   減封（1601）から兼続の死（1620年1月）まで18年あまり、景勝の死（1623）まで22年。禅林寺（1618）から米沢図書館（1909）まで291年。1745年の手紙は兼続の死から120年あまり後（1745−1620＝125）。
#   石堤の修理 文化9年（1812）＝延べ9,727人。お船の宝塔 寛永6年（1629）＝兼続の死から9年後、焼失 文化6年（1809）。
