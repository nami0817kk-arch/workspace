# 石田三成（A作品・10/21 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：石田三成とは何者だったのか」）
# 冒頭の一点：徳川方の医師・板坂卜斎は『慶長年中卜斎記』に、佐和山城（19万4千石）には金銀の蓄えがまったくなかった、と書いた。蓄えは無かった、とだけ言う（使い道は分かっていない。9/12増田あて書状の「兵に使った」は未確認なので使わない）。
#   もう一つの問い：三献茶は『武将感状記』（1716）＝死の約116年あとの書。吉継の茶会は福本日南『英雄論』（1911）。名場面は後の層、と分ける（答えは第2・4節、まとめで冒頭の問いに戻る）。
# 事実の出どころは dev/output/rekishi-chiso/research/mitsunari_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/mitsunari_assets.md。
# 決まり：①日付は和暦で言う。西暦は『武将感状記』の1716年・『英雄論』の1911年と、年表・card の年だけ。誕生日は不明なので「永禄3年」。
#   ②使わない話（入れない）：水口4万石／島左近の禄の数字／「問い鉄砲」を事実として／島津の夜襲案を事実として／首・斬首・晒し首の細部／「大一大万大吉」の意味の断定／
#     処刑前の「大義を思う者は…」のせりふ／七将の動機の断定（朝鮮での処分への不満説などがある、と言うだけ）／ネットの個人ブログ。
#   ③三献茶（武将感状記1716）・吉継の茶会（英雄論1911）・干し柿（明良洪範）・甲子夜話の質素な居間・岩淵夜話の「家康邸に逃げた」・吉継の辞世（常山紀談）は後世の話（出典名を言う）。
#   ④七将の顔ぶれ・動機・襲撃か訴訟か・家康の関与は割れる。兵数は石田隊「約6,000」と西軍全体「諸説」。石田堤28kmは行田市の紹介。忍城は落ちなかった（水攻めは三成だけの判断か疑問）。
#   ⑤人物のセリフは入れない。辞世は「伝わる歌」。⑥年齢は数え。肖像の「この時○歳」は出さない（誕生日が不明のため）。
#   ⑦背景に人物の肖像・拡大絵を使わない。NDL 系は detail の box で枠内だけ。血・遺体・首・切腹の絵は使わない。
#   ⑧三成を悪人扱いしない。「嫌われ者」を事実としては言わない（「と語られてきた」）。
#   読みの注意：石田三成＝いしだみつなり／佐和山＝さわやま／板坂卜斎＝ばんざかぼくさい／慶長年中卜斎記＝けいちょうねんじゅうぼくさいき／武将感状記＝ぶしょうかんじょうき／
#     明良洪範＝めいりょうこうはん／常山紀談＝じょうざんきだん／甲子夜話＝かっしやわ／桃源遺事＝とうげんいじ／甫庵太閤記＝ほあんたいこうき／大谷吉継＝おおたによしつぐ／
#     治部少輔＝じぶしょうゆう／忍城＝おしじょう／今在家村＝いまざいけむら／水口＝みなくち／長束正家＝なつかまさいえ／増田長盛＝ましたながもり／前田玄以＝まえだげんい／
#     碧蹄館＝へきていかん／幸州山城＝こうしゅうさんじょう／岩淵夜話＝いわぶちやわ／結城秀康＝ゆうきひでやす／古橋村＝ふるはしむら／六条河原＝ろくじょうがわら。
title: 石田三成｜19万4千石の城に、金銀の蓄えは無かった
