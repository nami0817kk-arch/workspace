en:
  title: "Ishida Mitsunari: A 194,000-koku Castle With No Stored Gold or Silver"
  description: |-
    A physician on the Tokugawa side, Banzaka Bokusai, wrote that Mitsunari's Sawayama Castle held no stored gold or silver at all, although its lord held 194,000 koku. This video digs into the life of Ishida Mitsunari and separates what records show from what later books say. The famous story of the three cups of tea appears in the Busho Kanjoki, completed in 1716, about 116 years after his death; the tea-party story about Otani Yoshitsugu has its oldest confirmed record in a 1911 essay.
    We follow him from his birth in Omi Province to his work as a land-survey magistrate, the reconstruction of Hakata, the failed flooding of Oshi Castle, the Korean campaign, the Seven Generals incident, Sekigahara, his capture at Furuhashi village and his death at Rokujo riverbed. We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1600: A Castle Without Gold, and Stories Told Later"
    - "1560: Born in Omi, Serving Hideyoshi and the Three Cups of Tea"
    - "1584: Land Surveys, Hakata and the Flooding of Oshi Castle"
    - "1592: The Korean Campaign and Otani Yoshitsugu"
    - "1595: Sawayama Castle and the Five Magistrates"
    - "1599: The Seven Generals Incident"
    - "1600: The Road to Sekigahara"
    - "1600: Capture and Death at Rokujo Riverbed"
    - "Summary: Who Was Ishida Mitsunari?"

