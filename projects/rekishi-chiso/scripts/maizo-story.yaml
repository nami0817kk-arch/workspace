  # ================================================================ 第7章 説5 金蔵はもう空だった
  - title: 江戸城の金蔵は幕末にはもう空だったのか　家康の200万両と幕末の財政
    background: {image: paintings/ieyasu_edo_zu_byobu_castle_detail.jpg, credit: "《江戸図屏風》江戸城の部分（17世紀）"}
    lines:
      # fact: maizo-56
      - 語り: 家康が亡くなった1616年。駿府の久能山の蔵に納められた金銀は、およそ200万両だった、とされます。尾張徳川家に伝わった帳面によるものです。
        year: 1616
        card: {head: "1616年", body: 家康の遺金 約200万両}
      # fact: maizo-15
      - 語り: 時代は下って、天保8年、1837年。幕府の文書によれば、この年から奥御金蔵に残っていた額は、金43万8千両と、金と銀の分銅でした。
        year: 1837
      # fact: maizo-16, maizo-57
      - 語り: 飯島千秋さんの研究では、奥御金蔵の金銀の貨幣は、いちばん多かった時でも、171万7千両あまり。ほかに、金の分銅20個と、銀の分銅206個がありました。
      # fact: maizo-57
      - 語り: そして、それは、幕末には、使い果たされていた、といいます。
        tone: 重い
        figure: {type: bars, title: 両で比べる, bars: [[家康の遺金（1616年）, 200], [金蔵の貨幣の最多, 171.7], [語られる埋蔵金, 360]], labels: [約200万両, 171万7千両, 360万両], note: 単位は万両}
      # fact: maizo-20
      - 語り: 幕末の幕府は、小判を小さく作り直し、その差額で、しのいでいました。1860年からの、万延の改鋳です。
        figure: null
        year: 1860
      # fact: maizo-21
      - 語り: 研究者の大口勇次郎さんは、文久3年、1863年の幕府の勘定帳から、その年の収入の68%が、この作り直しの益だった、としています。
        card: {head: "1863年", body: 収入の68%が改鋳の益}
      # fact: maizo-20
      - 語り: ただ、改鋳でどれだけ得たかは、研究者で大きく割れます。1,000万両を超えるとする表もあれば、まったく得られなかった、という見方も、かつてありました。
      - 語り: 採点です。早さ。金蔵が空だった、と書くのは、1912年からの本と、研究です。1点。中身は、額はあっても、どこへ使われたかまでは書かれず、1点。
        figure: {type: stats, title: 金蔵はもう空だった説の点, items: [[早さ, 1点, 1912年からの本と研究], [中身, 1点, 使い道までは書かれない], [裏づけ, 2点, 研究と2つの話]], upto: 2}
      # fact: maizo-57, maizo-18, maizo-19
      - 語り: 裏づけは、飯島千秋さんの研究と、勝海舟の話、伊藤痴遊の話が、金が少なかった点で同じです。2点。
        figure: {type: stats, title: 金蔵はもう空だった説の点, items: [[早さ, 1点, 1912年からの本と研究], [中身, 1点, 使い道までは書かれない], [裏づけ, 2点, 研究と2つの話]], upto: 3}
      - 語り: 金蔵はもう空だった説は、《4点》です。
        figure: {type: bars, title: 採点の途中, bars: [[赤城山, 3], [日光, 0], [浅草の堀, 3], [大坂城の軍艦, 5], [金蔵はもう空, 4]], labels: [3点, 0点, 3点, 5点, 4点], note: 6点満点}
