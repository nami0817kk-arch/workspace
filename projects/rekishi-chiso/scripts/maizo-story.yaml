# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。徳川埋蔵金。2026-11-05 作成。公開の予定は 11/06 12:00。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（11-06 の12時はユーザーの選びで もしも ではなくこの回）。創作の筋・想像の台詞は入れない（imagined なし）。
# 1本に1つの問い＝「1868年に消えたと言われる幕府の金は、どこへ行ったのか」。説を5つ、記録だけで採点する。
#   冒頭（10秒以内）＝語られる額は360万両、ところが金蔵の金銀の貨幣は、いちばん多い時でも171万7千両あまり（maizo-57）。
#   採点の決まり（第2章、約20%）：「記録」＝金が運ばれた・埋められた・あった、と書いたもの（推理・読み解きは数えない）。
#     早さ（その中身を書いた記録が1868年から10年以内なら2点・後の記録だけなら1・無ければ0）／中身（額とありか・行き先が両方2・片方1・無ければ0）／
#     裏づけ（別の記録が2つ以上同じことを書けば2・1つなら1・無ければ0。書き手が得をする話は0）。各2点、6点満点。
#   説：赤城山 3点（1・2・0）／日光 0点／浅草御蔵の堀 3点（2・1・0）／大坂城の18万両 5点（1・2・2）／金蔵はもう空だった 4点（1・1・2）。
#   採点の結果は第8章（約77%）、答えはまとめ（約90%）。
#   答え＝記録で行き先まで追えた幕府の金は、山の中ではなく「大坂から江戸へ向かった軍艦」に積まれた金（その先は江戸で慶喜に差し出された）。
#   「埋蔵金が見つかった」「埋められなかった」とは言わない。言えないことは言えないと言う。
#   小栗忠順の斬首の場面は深掘りしない（同じ日の19時は別の担当の「小栗忠順の最期」）。日付を1行で言うだけ。首・処刑の様子は語らない。
#   流れの確認・事実照合（前半・後半）の指摘を11-05 に1回にまとめて直した（採点の当て方をそろえた・覚書を1868年の記録と言い切らない・浅草の願書の中身・片品村は八重野充弘の聞き取り）。
# 計算（自分で計算し直した）：1868→2026 は158年／171.7万÷360万＝47.7%（半分に届かない）／1912−1868＝44年／18万−3万＝15万両／明治元年→明治10年＝9年／1994−110＝1884年／
#   28万＋15万＝43万両（竹越の講演）／7万両＝二分金14万枚＝420kg（高崎市の冊子：二分金1枚3グラム）。同じ二分金で360万両＝720万枚＝21,600kg＝21.6トン（前提を語りで言う）／
#   牛8頭×千両箱2箱＝16箱＝1万6千両（千両箱1つ千両として）。360万÷1.6万＝225。
# 事実は事実カード（dev/output/rekishi-chiso/research/徳川埋蔵金_facts_20261105.yaml、maizo-09〜64）にあるものだけ。行の上に `# fact: maizo-NN`。
#   NDL デジタルの公開本は lab.ndl.go.jp の全文の OCR で読んだ。願書（maizo-49〜51）は東京都公文書館の解読文を後半の照合の担当が開いて確かめた（夜、船で通ると千両箱という声と箱を崩す音・4年前に甥に話した・役人も認めたと本人が書く）。
#   片品村の話（maizo-62）は文春 2023 の記事を開いて確かめた（八重野充弘が約30年前に1人の老人から聞いた話）。
#   使わないこと：360万両が勝海舟の日記に出るという話（原文未見）・早丸の沈没の話（原本未見）・明治6年の外国人の発掘・1970年の英字紙（抜き出しだけ）・水野家三代目の没年・
#     見舞金の合計1,250両と土産225両（引用で未確認。400両だけ言う）・水野家の叔父の名・『大阪市史』『七年史』の軍艦の名。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
