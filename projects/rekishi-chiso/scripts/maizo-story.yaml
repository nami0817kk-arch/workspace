      - 語り: 江戸の金蔵が尽きていたなら、大坂の18万両は、幕府にとって、手放せない金だったはずです。
      # fact: maizo-11
      - 語り: 竹越与三郎は、1938年の講演で、大坂城の金を28万両と言い、ほかの15万両を足した43万両でも、幕府の兵を1か月動かす分しかなかった、と述べました。
      # fact: maizo-11
      - 語り: 幕府は、財政で倒れたのだ、と。ただ、講演の28万両は、自分の本の18万両と、合いません。
        card: {head: "竹越与三郎", body: 本は18万両・講演は28万両}
      - 語り: 最後に、もう一つ、確かめておきます。360万両は、そもそも、運べる重さだったのか。
        tone: 疑問
      # fact: maizo-26
      - 語り: 高崎市の冊子は、風聞記の7万両を、二分金で14万枚、重さは420キロ、と計算しています。二分金は、2枚で1両になる金貨で、1枚、3グラムです。
      - 語り: 同じ二分金で360万両を数えると、720万枚。重さは、21.6トンになります。
        figure: {type: calc, title: 360万両の重さ（二分金で数えると）, terms: [[720万枚, 1両＝2枚], [3グラム, 1枚], [21.6トン]], ops: [×, ＝]}
      # fact: maizo-62
      - 語り: トレジャーハンターの八重野充弘さんは、約30年前、群馬で、ある老人から聞いたといいます。幕末に、牛8頭の背に千両箱を2箱ずつ積んだ一行が、山へ向かった、と。
        figure: null
      - 語り: 千両箱16箱で、1万6千両。360万両の、225分の1です。同じ運び方なら、360万両には、牛が1,800頭いります。
      - 語り: 金が運ばれた話は、残っています。けれど、語られる額を運んだ、という記録には、行き当たりません。
        hook: true
      - 語り: では、158年の問いに、記録は、どう答えるのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（約90%）
  - title: まとめ：徳川埋蔵金は、どこへ消えたのか
    background: {image: paintings/yoshinobu_osaka_palace_butt_1868.jpg, credit: "J.H.バット《大坂城》水彩、1868年1月"}
    lines:
      - 語り: 記録で、行き先まで追えた幕府の金は、山の中には、ありませんでした。大坂から江戸へ向かった、《軍艦》に積まれた金です。
        tone: しみじみ
      # fact: maizo-55
      - 語り: その金は、江戸で慶喜に差し出され、一部は、榎本の手に渡りました。
      - 語り: ただ、それは、埋蔵金が見つかった、という話ではありません。記録で行き先まで追えたのは、埋められた金ではなく、運ばれ、手渡された金でした。
      # fact: maizo-29, maizo-28
      - 語り: 1868年の新政府の日記も、分家の届けも、小栗の荷から金が出た、とは書いていません。
      - 語り: 言えないことも、あります。360万両という額を、いつ、誰が初めて書いたのか。大坂の金の残りは、何に使われたのか。赤城山に、本当に何も無いのか。
        tone: しみじみ
      - 語り: どれも、記録からは言えません。
        tone: しみじみ
        pause: 0.8
      # fact: maizo-37
      - 語り: 1868年、小栗が斬られたあと、権田村に来た役人たちは、毎日のように、金はないか、と荷を調べたといいます。
        tone: しみじみ
      - 語り: 158年が過ぎた今も、その問いだけが、山の中に、埋まり続けているのかもしれません。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、金がどこにあると思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
