  # ================================================================ 第6章 説4 大坂城の18万両
  - title: 大坂城の18万両はどこへ運ばれたのか　1868年1月 榎本武揚と軍艦
    background: {image: paintings/yoshinobu_osaka_palace_butt_1868.jpg, credit: "J.H.バット《大坂城》水彩、1868年1月"}
    year: 1868
    lines:
      # fact: maizo-09
      - 語り: 慶応4年、1868年の1月。慶喜が大坂城を出たあと、城には、勘定奉行並の小野友五郎が、残っていました。金蔵には、古い金が、18万両ありました。
        year: 1868
        card: {head: "大坂城の金蔵", body: 古い金が18万両}
      # fact: maizo-09
      - 語り: 渋沢栄一が1918年にまとめた『徳川慶喜公伝』は、友五郎が、その古金18万両を、榎本武揚に託し、軍艦に積ませた、と書きます。
        portrait: {image: paintings/yoshinobu_enomoto_portrait.jpg, caption: "榎本武揚（晩年の写真）"}
      # fact: maizo-12
      - 語り: 1915年の『大阪市史』は、運んだ場面まで書いています。荷車5台と人足を集め、刀を抜いて、人足が逃げるのを防ぎながら、八軒屋の船着き場へ運んだ。
        portrait: null
      # fact: maizo-13
      - 語り: 城の銀8万両あまりと、米1万石は、大坂の町の人々に配られました。
      # fact: maizo-52
      - 語り: 9日には、大坂の金奉行も、千両箱を20個ほど、城の外へ運び出した、と『慶喜公伝』は伝えます。
      # fact: maizo-10, maizo-53
      - 語り: ただ、細かい所は、本で食い違います。運んだ日は、7日とも8日とも。額は、25万両とする談話も。船の名を書く本は、1941年の『維新史』などで、富士山丸です。
        figure: {type: stats, title: 大坂城の金　記録の食い違い, items: [[額, 18万両, 25万両とする談話も], [運んだ日, 7日か8日, 本によって違う], [積んだ船, 富士山丸, 船の名を書く本]], upto: 3}
      # fact: maizo-54
      - 語り: 竹越与三郎は、1925年の『日本経済史』に、この18万両で、大坂の金蔵の黄金は、すべて尽きた、と書きました。
        figure: null
      # fact: maizo-55
      - 語り: 金は、海を渡り、江戸へ着きました。榎本は、江戸で18万両を慶喜に差し出し、そのうち3万両を、もらい受けたい、と願い出ます。
      # fact: maizo-14
      - 語り: 歴史家の幸田成友は、1940年、その3万両が、横浜のオランダ領事にかかわる用に充てられた、と書いています。
      - 語り: 榎本に渡らなかった分の使い道は、記録をたどっても、行き当たりません。
      - 語り: 大坂城の金の採点です。早さは、1904年からの本で、10年以内の記録は、見当たりません。1点。
        figure: {type: stats, title: 大坂城の金の点, items: [[早さ, 1点, 1904年からの本], [中身, 2点, 18万両を軍艦で江戸へ], [裏づけ, 2点, 4つ以上の本が合う]], upto: 1}
      # fact: maizo-09, maizo-12, maizo-53
      - 語り: 中身は、額も、運ばれた先も書かれていて、2点。裏づけは、日付や額は食い違っても、金が船で運ばれたことを、少なくとも4つの本が書いています。2点。
        figure: {type: stats, title: 大坂城の金の点, items: [[早さ, 1点, 1904年からの本], [中身, 2点, 18万両を軍艦で江戸へ], [裏づけ, 2点, 4つ以上の本が合う]], upto: 3}
      - 語り: 大坂城の金は、《5点》。1位が、入れ替わります。
