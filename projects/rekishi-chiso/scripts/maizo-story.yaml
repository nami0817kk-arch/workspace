sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 消えた徳川の金　語られる額は360万両
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
    year: 1868
    lines:
      # fact: maizo-57, maizo-40
      - 語り: 徳川の埋蔵金は、360万両とも言われます。ところが、江戸城の非常用の金蔵でも、金と銀の貨幣がいちばん多かった時で、《171万両》あまりでした。
        tone: 重い
