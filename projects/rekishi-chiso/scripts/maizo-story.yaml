      # fact: maizo-51
      - 語り: 裏づけ。役人に口止めされた、と願書にはありますが、それを書いたのも、島村本人です。引き上げて得をするのも、本人。0点。
        figure: {type: stats, title: 浅草の堀の点, items: [[早さ, 2点, 9年後の願書], [中身, 1点, 堀の番号だけ], [裏づけ, 0点, 書いたのは本人だけ]], upto: 3}
