# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  徳川の埋蔵金は、360万両とも言われます。ところが、江戸城の非常用の金蔵でも、金と銀の貨幣がいちばん多かった時で、171万両あまりでした。
  1868年、江戸城が明け渡されたとき、金蔵は空だった、と言われています。幕府の金は、どこへ消えたのか。
  赤城山、日光、江戸の浅草の堀、大坂から江戸へ向かった軍艦、そして「幕末には、もう無かった」。5つの説に、記録だけで点を付けました。
  この動画でわかること
  ・1868年の新政府の日記と小栗家の届けに、小栗忠順の金はどう書かれているか
  ・赤城山を明治から掘り続けた水野家、水野家の銅板が使われた1933年の埋蔵金の裁判、テレビの発掘
  ・明治10年、東京府に出された「埋メ金引上ケ願書」
  ・大坂城の古金18万両を運んだ軍艦と、記録どうしの食い違い
description_note: |-
  採点の決まり（早さ：その中身を書いた記録が1868年から10年以内か／中身：金の額とありかが書いてあるか／裏づけ：別の記録が同じことを書いているか）は、この動画で決めたものです。点は、今回たどれた記録の範囲での目安で、決まりを変えれば順位も変わりえます。
  明治〜昭和の本は、国立国会図書館デジタルコレクションの公開本を、全文検索の文字で読みました。明治10年の願書は、東京都公文書館の解読によります。権田村の覚書は、蜷川新の本（1928年）に載る写しで読みました。
  360万両という額が初めて書かれた記録は、今回たどれた範囲では見つかりませんでした。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Where Did the Tokugawa Gold Go? Following the Records, It Was Not in the Mountains"
  description: |-
    The Tokugawa treasure is often said to be 3.6 million ryo. Yet even at its peak, the shogunate's emergency vault in Edo Castle held only about 1.72 million ryo in gold and silver coin.
    In 1868, when Edo Castle was handed over, the vault is said to have been empty. Where did the shogunate's gold go?
    Mount Akagi, Nikko, a canal in Asakusa, a warship sailing from Osaka to Edo - and the idea that the vault was already empty by the end. We scored five theories using only the records.
    In this video you will learn:
    - What the new government's 1868 diary and the Oguri family's report say about Oguri Tadamasa's money
    - The Mizuno family who dug Mount Akagi from the Meiji era, a 1933 fraud case, and the TV excavation
    - The 1877 petition to the Tokyo government to raise "sunken gold" in Asakusa
    - The 180,000 ryo of old gold taken from Osaka Castle by warship, and where the records disagree
    The scoring rules were set for this video; the scores reflect only the records we could trace. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "The Gold Said to Have Vanished in 1868"
    - "Where Was the Shogunate's Gold in 1868?"
    - "Three Rules: Timing, Content, Corroboration"
    - "Did Oguri Carry Gold to Gunma? The Records of 1868"
    - "Three Generations Digging Mount Akagi"
    - "Nikko, and the Asakusa Canal Petition of 1877"
    - "Where Did Osaka Castle's 180,000 Ryo Go?"
    - "Was the Edo Castle Vault Already Empty?"
    - "The Scores"
    - "Summary: Where Did the Tokugawa Gold Go?"

