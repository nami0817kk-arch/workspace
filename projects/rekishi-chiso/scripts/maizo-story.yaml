        card: {head: "金蔵の貨幣の最多", body: 171万7千両あまり}
      - 語り: それでも、この謎は、158年が過ぎた今も、語られ続けています。
      # fact: maizo-39, maizo-42
      - 語り: 群馬の赤城山では、明治のころから、ひとつの家が、三代にわたって山を掘り続けました。
      # fact: maizo-45, maizo-46
      - 語り: 1990年には、テレビ局のチームが、そこに重機を入れました。何も出ないまま、費用は、3億5000万円にのぼった、と後に明かされています。
      # fact: maizo-17
      - 語り: 話の舞台は、1868年です。江戸城が明け渡されたとき、金蔵は空だった、と言われています。
        card: {head: "1868年", body: 金蔵は空だった？}
      - 語り: 幕府の金は、どこへ消えたのか。
        tone: 疑問
      # fact: maizo-63, maizo-49, maizo-09
      - 語り: 言い伝えや記録に出てくる場所は、いくつもあります。赤城山。日光。江戸の、浅草の堀。そして、大坂から江戸へ向かった、軍艦。
      # fact: maizo-57
      - 語り: 幕末には、金蔵の金は、もう無かった、という見方もあります。
      - 語り: 言い伝えを、脇に置きます。残っている記録だけで、説ごとに点を付けたら、どこが残るのか。
        tone: 疑問
      - 語り: 最後に残ったのは、山の中ではない、意外な場所でした。
        hook: true
      - 語り: 1868年に、戻ります。
        hook: true

  # ================================================================ 第1章 1868年、幕府の金はどこにあったのか
  - title: 1868年、幕府の金はどこにあったのか　江戸城の金蔵と2つの話
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め（明治初期の東京のあたり）"}
    year: 1868
    lines:
      - 語り: 慶応4年、1868年の1月。鳥羽・伏見の戦いに敗れた徳川慶喜は、大坂城を出て、軍艦で江戸へ戻ります。
        year: 1868
      - 語り: 4月11日には、江戸城が、新政府の側に明け渡されました。
        card: {head: "慶応4年4月11日", body: 江戸城の明け渡し}
      # fact: maizo-16
      - 語り: 江戸城には、非常用の金庫がありました。奥御金蔵です。幕府の財政を調べてきた飯島千秋さんの研究では、天守の下の穴蔵にあった、とされます。
      # fact: maizo-18
      - 語り: その金蔵が空だった、という話は、どこから来たのか。1912年の本には、こんな話が載っています。
      # fact: maizo-18
      - 語り: 勝海舟が、維新の前に、幕府の金庫を調べた。すると、黄金の分銅、つまり金を大きな塊にして蓄えたものが、たった1個しかなかった。ほかの金の箱は、封がしてあるだけで、中は空だった。
      # fact: maizo-19
      - 語り: ところが、講談師の伊藤痴遊は、1926年の本で、別の場面を語っています。城を受け取った新政府の海江田信義が、金蔵を見て、金の分銅の数が少ない、と小言を言った、というのです。
        figure: {type: stats, title: 金蔵は空だった？　2つの話, items: [[勝海舟が調べた話, 分銅は1個だけ, 1912年の本], [海江田信義の小言, 分銅が少ない, 伊藤痴遊 1926年の本]], upto: 2}
      # fact: maizo-18, maizo-19
      - 語り: 1個しか無かったのか。少なかったのか。どちらも、開城から40年以上たってから語られた話で、1868年に書かれた記録ではありません。
      # fact: maizo-24
      - 語り: 一方で、金を持ち去った、と疑われた人がいました。勘定奉行だった、小栗忠順です。
        figure: null
      # fact: maizo-24
      - 語り: 小栗は、1月15日に役を解かれ、2月28日に江戸を発ちました。向かったのは、領地の上州、権田村。今の群馬県高崎市です。
        card: {head: "慶応4年2月28日", body: 小栗、江戸を発つ}
      # fact: maizo-22
      - 語り: では、360万両という額は、どこから出たのか。いつ、誰が初めて書いたのか。記録をたどっても、行き当たりませんでした。
      # fact: maizo-33, maizo-34, maizo-40
      - 語り: 1928年の本では、350万両。1933年の新聞の広告では、250万両。1982年の本の題では、400万両。
        figure: {type: stats, title: 語られた額, items: [[1928年の本, 350万両, 蜷川新], [1933年の広告, 250万両, 判決要録], [1982年の本の題, 400万両, 水野家三代目]], upto: 3}
      # fact: maizo-22
      - 語り: 戦前には、3億8000万円、3億5000万円と、円で語られたこともあります。
      - 語り: 額が、語り手ごとに動く。それが、この謎の、最初の手がかりです。
        figure: null
        hook: true
      - 語り: では、どの説を、どう採点するのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 採点の決まり（約20%）
  - title: 採点の決まりは3つ　早さ・中身・裏づけ
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の濠》1863〜70年代初め（明治初期の東京のあたり）"}
    lines:
      - 語り: 採点の決まりは、3つです。ここで言う記録は、金が運ばれた、埋められた、あった、無かった、と書いたものです。推理や読み解きは、数えません。
      - 語り: 1つ目は、《早さ》。その中身を書いた記録が、1868年から10年以内のものなら、2点。後の記録だけなら1点。無ければ0点。当時に近いほど、点が高くなります。
        figure: {type: stats, title: 採点の決まり（各2点）, items: [[早さ, 10年以内なら2点, 後の記録だけなら1点], [中身, 額とありかで2点, 片方なら1点], [裏づけ, 2つ以上なら2点, 得をする話は0点]], upto: 1}
      - 語り: 2つ目は、《中身》。金の額と、ありかや運ばれた先が、書かれているか。両方なら2点、片方なら1点、どちらも無ければ0点。
        figure: {type: stats, title: 採点の決まり（各2点）, items: [[早さ, 10年以内なら2点, 後の記録だけなら1点], [中身, 額とありかで2点, 片方なら1点], [裏づけ, 2つ以上なら2点, 得をする話は0点]], upto: 2}
      - 語り: 3つ目は、《裏づけ》。別の記録が、同じことを書いているか。2つ以上なら2点、1つなら1点、無ければ0点。書いた人が得をする話も、0点です。
        figure: {type: stats, title: 採点の決まり（各2点）, items: [[早さ, 10年以内なら2点, 後の記録だけなら1点], [中身, 額とありかで2点, 片方なら1点], [裏づけ, 2つ以上なら2点, 得をする話は0点]], upto: 3}
      - 語り: 満点は、6点。どれほど有名な話でも、記録が無ければ、点は入りません。
        card: {head: "満点", body: 6点}
      - 語り: 最初の説は、いちばん有名な、赤城山です。
        figure: null
        hook: true
      - 語り: 小栗忠順は、本当に、金を上州へ運んだのか。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 説1 赤城山（小栗の荷物）
  - title: 小栗忠順は金を上州へ運んだのか　権田村の覚書と新政府の日記
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
    year: 1868
    lines:
      # fact: maizo-24
      - 語り: 慶応4年の3月1日。小栗は、権田村に着きました。
        card: {head: "慶応4年3月1日", body: 権田村に着く}
      # fact: maizo-25
      - 語り: 1928年、小栗の伝記を書いた蜷川新は、こう書いています。小栗は、大砲1門と小銃を、小箱や長持に入れて運んだ。それが重かったので、世間は、数十万両の幕府の金だと思った。
      # fact: maizo-25, maizo-32
      - 語り: 3月の初め、近くの村の百姓たちが、小栗の屋敷に押し寄せます。1921年の本は、小栗が多くの軍用金を持って来た、という噂を聞いて、奪いに来たのだ、と書いています。
      # fact: maizo-31
      - 語り: このあと、焼けた家への見舞金として、小栗は400両を出しました。権田村の古老が持っていた古文書、覚書の写しにある数です。
        card: {head: "見舞金", body: 小栗が400両}
      # fact: maizo-31
      - 語り: 小栗の手元にあった金の大きさが分かる、数少ない記録です。
      # fact: maizo-26
      - 語り: 噂のもとらしい記録も、残っています。群馬県立文書館の「風聞記」には、小栗が横浜奉行のとき、7万両ほどを私腹に入れ、油や酒の樽に詰めて国元へ送った、とあります。
      # fact: maizo-26
      - 語り: 高崎市の冊子は、これが埋蔵金の噂のもとだろう、としています。ただ、この記録は、名前を取り違えるなど、確かではない噂の書き留めで、山へ運んだとは書いていません。
      # fact: maizo-38
      - 語り: やがて、新政府の東山道総督府の命令で、高崎など3つの藩の兵が来ます。小栗は大砲を預け、兵は、いったん引き揚げました。
      # fact: maizo-38
      - 語り: そして、閏4月6日。小栗は、斬首されました。
        tone: 重い
      # fact: maizo-27
      - 語り: 覚書によれば、兵はおよそ700人。何日にもわたって、小栗の財産、宝物、荷物を調べた、と書かれています。
      # fact: maizo-37
      - 語り: 1931年の蜷川新の本には、村の古老の話が載っています。官軍の役人たちは、毎日のように、金はないか、と荷を調べていた、と。
      # fact: maizo-29
      - 語り: 総督府の日記に、権田村から送られてきた物として書かれたのは、器械、つまり武器などです。金を押さえた、という記述は、見当たりません。
      # fact: maizo-28
      - 語り: 6日後に、小栗の分家が出した届けには、持ち物も、家来の品も、残らず荷造りされ、どこかへ持ち去られた、とあります。どこへ持ち去られたのか。届けは、そこまで書いていません。
      # fact: maizo-33
      - 語り: 蜷川新は、小栗が持っていた金は、二、三千両ほどで、寺に残ったのは、拝領の黄金2枚だけだった、と書きました。赤城山に350万両を埋めた、という話は、信じがたい、と。
      # fact: maizo-29, maizo-28
      - 語り: 1868年に書かれた新政府の日記にも、分家の届けにも、山へ金を運んだ、とは書かれていません。では、赤城山の話は、どこから来たのか。
        tone: 疑問
        hook: true
      - 語り: 山を掘った家に、その話が伝わっていました。
        hook: true

  # ================================================================ 第4章 説1 赤城山（掘った三代）
  - title: 赤城山を掘った三代　明治の水野智義から1990年のテレビまで
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城》1860年代"}
    year: 1886
    lines:
      # fact: maizo-39
      - 語り: 赤城山の発掘を始めたのは、水野智義という人です。始めた年は、記録で違います。
      # fact: maizo-39
      - 語り: 映画の紹介は、明治19年、1886年。取材の記事は、明治の初めから。1994年の三代目の本の題には、発掘110年、とあります。逆に数えると、1884年ごろです。
        figure: {type: stats, title: 掘り始めた年　3つの書き方, items: [[映画の紹介, 1886年, 明治19年], [取材の記事, 明治の初め, 2025年の記事], [三代目の本, 110年前, 1994年の題]], upto: 3}
      # fact: maizo-41
      - 語り: きっかけは、幕末に勘定吟味役だった叔父から聞いた噂だった、と紹介されています。
        figure: null
      # fact: maizo-36
      - 語り: 小栗が、金を、利根川をさかのぼって運ばせ、赤城山に埋めた。水野家に伝わったこの話を、誰が最初に言い出したのか。今回たどれた記録では、分かりませんでした。
      # fact: maizo-42
      - 語り: 明治23年、1890年には、家康の像を見つけた、とされます。
        year: 1890
      # fact: maizo-43
      - 語り: その像を、黄金の像と書く紹介もあれば、ただ家康像とだけ書く記事もあります。今どこにあるのかを示す、公の記録は、見当たりません。
      # fact: maizo-42
      - 語り: 昭和7年、1932年には、二代目が、巨大な石灰の亀を掘り当てた、とされます。二代目は、1975年まで掘りましたが、黄金は出ていません。
      # fact: maizo-34
      - 語り: その翌年、1933年。埋蔵金は、裁判の記録に残ります。
        year: 1933
      # fact: maizo-34
      - 語り: 漢学者の関儀一郎らが、幕末の軍用金250万両が、群馬の子持山に眠っている、と新聞に広告を出し、発掘の資金を集めたのです。判決の題は、赤城山の埋蔵金の事件でした。
      # fact: maizo-34
      - 語り: 2,189人から、当時のお金で、およそ3万5,370円。関儀一郎らは、詐欺の罪に問われ、二審で有罪とされました。重い者で、懲役10か月。1935年の『判決要録』に載る判決です。
        card: {head: "1933年の事件", body: 2,189人から集めた}
      # fact: maizo-35, maizo-58
      - 語り: 判決が引く趣意書には、埋めた場所を示すとされる、水野家の銅板のことも書かれていました。小栗の部下が、死ぬ前に言い残し、井戸の底から引き揚げさせたもの、というのです。
      # fact: maizo-46, maizo-45
      - 語り: そして、1990年6月。TBSの番組『ギミア・ぶれいく』のチームが、水野家の土地に入ります。
        year: 1990
      # fact: maizo-45
      - 語り: 糸井重里さんたちが、重機で掘りました。何も見つかりませんでした。掘った深さは、50メートル近くとも、60メートルとも書かれています。
      # fact: maizo-45
      - 語り: 2023年、同じ局の番組は、当時の費用を、3億5000万円と明かしています。
      - 語り: 赤城山の採点です。早さ。赤城山に埋めた、という話が出てくるのは、昭和の本からです。風聞記も、山へ運んだとは書いていません。1点。
        figure: {type: stats, title: 赤城山の点, items: [[早さ, 1点, 埋めた話は昭和の本から], [中身, 2点, 額も場所も書かれる], [裏づけ, 0点, 書くのは得をする側だけ]], upto: 1}
      - 語り: 中身。額も、場所も、書かれています。ただ、額は250万両から400万両まで、語り手で違います。2点。
        figure: {type: stats, title: 赤城山の点, items: [[早さ, 1点, 埋めた話は昭和の本から], [中身, 2点, 額も場所も書かれる], [裏づけ, 0点, 書くのは得をする側だけ]], upto: 2}
      - 語り: 裏づけ。同じ話を書くのは、山を掘る側と、資金を集めた側だけです。どちらも、得をする側です。0点。
        figure: {type: stats, title: 赤城山の点, items: [[早さ, 1点, 埋めた話は昭和の本から], [中身, 2点, 額も場所も書かれる], [裏づけ, 0点, 書くのは得をする側だけ]], upto: 3}
      - 語り: いちばん有名な赤城山は、6点満点の、《3点》です。
        figure: {type: bars, title: 採点の途中, bars: [[赤城山, 3]], labels: [3点], note: 6点満点}
        hook: true
      - 語り: 次は、家康をまつる日光。そして、江戸のまん中の、ある堀です。
        figure: null
        hook: true

  # ================================================================ 第5章 説2 日光・説3 浅草の堀
  - title: 日光と浅草の堀　明治10年の「埋メ金引上ケ願書」
    background: {image: paintings/ieyasu_nikko_yomeimon_kiyochika_1897.jpg, credit: "小林清親《日本名勝図絵 陽明門》1897年"}
    lines:
      # fact: maizo-63
      - 語り: 日光には、家康をまつる東照宮があります。ここに埋蔵金がある、という説も、本に書かれてきました。
      # fact: maizo-63
      - 語り: 宇都宮の出版社の本は、童謡のかごめの歌に、財宝のありかが隠されている、と読み解き、日光を含む8つの候補を挙げて、額を一千万両と見積もります。
      # fact: maizo-63
      - 語り: ただ、これは歌の読み解き、つまり推理です。日光へ金が運ばれた、埋められた、と書いた記録は、今回、1つも出てきませんでした。
      - 語り: 早さも、中身も、裏づけも、0点。日光は、《0点》です。
        figure: {type: bars, title: 採点の途中, bars: [[赤城山, 3], [日光, 0]], labels: [3点, 0点], note: 6点満点}
      # fact: maizo-49
      - 語り: 次は、江戸です。明治10年、1877年の7月14日。東京府の知事に、一通の願書が出されました。
        figure: null
        year: 1877
        card: {head: "1877年7月14日", body: 東京府への願書}
      # fact: maizo-49, maizo-51
      - 語り: 出したのは、豊島村の島村弥三郎。題は、埋め金、引き上げ願書。
      # fact: maizo-49
      - 語り: 明治元年の夜、浅草の御蔵の、五番と六番の堀を、船で通りかかった。すると、大勢が騒がしく、千両箱という声と、箱を崩す音が聞こえた。金が沈められたのだ、と島村は考えます。
      - 語り: 浅草の御蔵は、隅田川のほとりにあった、幕府の米蔵です。
      # fact: maizo-51
      - 語り: 島村は、御蔵の役人から、これからは誰にも話すな、と固く止められた、と書いています。4年前に甥に話し、証人になると言われながら、10年近くが過ぎていました。
      # fact: maizo-50
      - 語り: 東京府は、大蔵省に問い合わせ、米を運ぶ妨げにならなければよい、との答えを得て、7月28日に、探すことを許しました。
      # fact: maizo-50
      - 語り: 掘ったのか。何か出たのか。記録は、そこで終わっています。東京都公文書館に残る、明治の公文書です。
      - 語り: 浅草の堀の採点です。早さは、明治元年から9年後の願書で、2点。中身は、堀の番号まで書かれていますが、額は無く、1点。
