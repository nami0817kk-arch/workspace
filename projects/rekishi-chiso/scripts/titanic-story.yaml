# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  タイタニックが沈んだ時刻は、午前2時20分とされています。この時刻を、二等航海士のライトラーは、時計で見ていません。アメリカ上院の調査で、士官どうしで出した結論だった、と答えています。
  氷山にぶつかる2時間前、氷の警報は、無線室に届いていました。ところが、英国の報告書は、船橋には届いたとは見られない、としています。
  衝突から沈没までの2時間40分。時刻も、人数も、近くにいた船までの距離も、アメリカ上院と英国の調査では食い違います。
  無線の記録、証言、2つの報告書を、時刻の順にたどります。
  この動画でわかること
  ・氷の警報が、船橋に届かなかった経路（英国の報告書）
  ・カリフォルニアン号の無線士エバンズが受けた返事が、米英の調査で違う件
  ・近くの船までの距離が、5マイルとも19.7マイルとも書かれる理由
  ・最初の遭難信号の時刻と、カルパチア号が着くまで（無線の記録）
  ・乗船した人・助かった人の数が、米英で違う件
description_note: |-
  亡くなった方々と、ご遺族に、敬意を払って作っています。創作の台詞は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  証言と報告書は、titanicinquiry.org（Titanic Inquiry Project）の米上院調査と英国調査の記録を、要約の道具を通して読んでいます。引用の言葉は、原文で見直した所だけを、そのまま出しています。encyclopedia-titanica などの一部のページは開けませんでした。
  日数・時間の差・速さ・距離・割合は、記録の数字から計算し直したものです。残骸の位置（1985年の発見）は、公開されている資料の数字を使っています。船長ロードの船の位置と、タイタニックが送った位置の差は、緯度と経度から計算した値です。
  SOS という言葉は、無線士ブライドの米上院・英国の証言では確かめていません。事故後の4月27日付の手紙に出てきます。ブライドが SOS を勧めたという有名な話は、一次の証言では確かめられていません。
  乗船・助かった人・亡くなった人の数は、アメリカ上院と英国の報告書で違います。この動画では、それぞれの数を出どころを付けて並べています。
  画面の情景・人物の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の人物の姿ではありません。サムネイルの船も、AIによる想像図です。

en:
  title: "Titanic: What Happened in the 2 Hours 40 Minutes? Wireless Logs vs. the US and British Inquiries"
  description: |-
    Second Officer Lightoller told the US Senate that Titanic sank at 2:20 a.m. He had no watch; it was a time the officers agreed on.
    Two hours before the collision, an ice warning had reached the wireless room. The British report found that it did not reach the bridge.
    From the collision to the sinking, the US and British inquiries disagree on the times, the numbers and the distance to the nearest ship.
    This video follows the night hour by hour, from the wireless logs, the testimony and the two reports.
    In this video you will learn:
    - How the ice warnings failed to reach the bridge
    - Why the reply to the Californian's wireless operator differs between the two inquiries
    - Why the Californian is placed 5 miles and 19.7 miles away
    - When the first distress call went out and when Carpathia arrived
    - Why the US and British counts of the saved differ
    Recorded words are read with their sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "Prologue: A Warning That Reached the Wireless Room"
    - "Ice Warnings That Did Not Reach the Bridge: April 14, 1912"
    - "From the Collision to the First Lifeboat: 11:40 p.m. to 12:45 a.m."
    - "Five Miles or Nineteen? The Lights and the Ship That Did Not Move"
    - "Who Heard the CQD? Carpathia and Mount Temple"
    - "2:20 a.m.: The Last Signal and the Time of the Sinking"
    - "How Many Aboard, How Many Saved? The Numbers"
    - "After the Inquiries: Recommendations and the False Report"
    - "Summary: What the Records Can Tell Us"

