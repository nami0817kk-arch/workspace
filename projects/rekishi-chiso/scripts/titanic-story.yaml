sections:
  # ================================================================ 序章（冒頭 約2.5分）。答えはまとめまで言わない
  - title: 氷の警報は届いていた　1912年4月14日の夜
    background: {image: paintings/titanic_S01.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: C-19
      - 語り: タイタニックが沈んだ、午前2時20分。この時刻を、二等航海士のライトラーは、時計で見ていません。
        tone: 重い
        card: {head: "沈没の時刻", body: "午前2時20分"}
      # fact: C-19
      - 語り: アメリカ上院の調査で、ライトラーは、2時20分は聞いた話で、士官どうしで出した結論だ、と答えています。時計は、部屋に置いたままでした。
      # fact: A-10
      - 語り: 氷山に当たる、2時間前。夜9時40分には、氷の警報が、無線室に届いていました。重い氷原と、大きな氷山がたくさん、という知らせです。
        card: {head: "21時40分", body: "メサバ号の氷の警報"}
      # fact: A-10
      - 語り: ところが、英国の報告書は、この警報が、船橋の士官にも、船長にも、届いたとは見られない、と判断しています。
      # fact: A-04
      - 語り: さらに、近くにいた船の無線士は、遭難信号が出る前に、ヘッドホンを外して、寝ていました。
      - 語り: 沈むまでの2時間40分に、何があったのか。アメリカと英国の2つの調査は、時刻も、人数も、船までの距離も、食い違います。
        tone: 疑問
        pause: 0.8
      # fact: B-01
      - 語り: 手がかりは、1912年のアメリカ上院と、英国の調査の記録、そして、無線士たちの証言です。時刻の順に、並べていきます。
      - 語り: まずは、氷山に当たる前の、午後に戻ります。
        hook: true

  # ================================================================ 第1章 氷の警報
  - title: 氷の警報は、なぜ船橋に届かなかったのか　4月14日の午後から夜
    background: {image: paintings/titanic_S02.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: B-05
      - 語り: タイタニックは、4月14日の日曜日、英国からニューヨークへ向かう途中でした。乗っていたのは、2,200人ほどです。
        card: {head: "4月14日　日曜日", body: "ニューヨークへ向かう途中"}
      # fact: B-18
      - 語り: この日、氷の警報は、何通も入っていました。英国の報告書は、5通を数えます。アメリカ上院の報告書は、少なくとも3通は、船長に直接届いた、と書きます。
      # fact: A-11
      - 語り: 英国の報告書によれば、ボルチック号の警報は、午後1時42分ごろ、船長に届きました。
      # fact: A-11
      - 語り: 船長は、ほぼすぐ、船に乗っていた運航会社の代表、イズメイに渡します。海図室に貼られたのは、午後7時15分です。
      # fact: A-12
      - 語り: アメリカ号の警報は、ワシントンの水路部にあてた電報でした。無線室の外の誰も、知らなかった、と英国の報告書は認めています。
      # fact: A-02
      - 語り: その夜、近くにいたカリフォルニアン号の無線士、エバンズは、タイタニックに、氷に囲まれて、止まっている、と送りました。
        card: {head: "カリフォルニアン号から", body: "氷に囲まれて、止まっている"}
      # fact: A-03
      - 語り: 返事は、証言によって、違います。アメリカ上院で、エバンズは、黙れ、黙れ、私は忙しい、ケープレースと交信中だ、と返された、と述べています。
      # fact: A-03
      - 語り: ところが、英国の調査では、同じエバンズが、返事は、邪魔するな、だった、と述べています。同じ夜の返事が、2つの調査で違います。
        figure: {type: table, title: エバンズへの返事　証言の違い, cols: [返事, 場面], rows: [[米上院, "黙れ、黙れ、私は忙しい", 1912年4〜5月], [英国調査, "邪魔するな", 1912年5〜7月]], upto: 2}
      # fact: A-04
      - 語り: エバンズが、ヘッドホンを外して寝たのは、カリフォルニアン号の時計で、英国の調査では11時30分、アメリカでは11時35分です。この船の無線士は、エバンズ1人でした。
        figure: null
      # fact: C-01
      - 語り: 11時40分の少し前、見張りが鐘を3回鳴らし、電話で船橋に、氷山、真正面、と伝えた、と英国の報告書は書いています。
        card: {head: "11時40分ごろ", body: "氷山に衝突"}
      # fact: C-02
      - 語り: 見張りのフリートは、英国調査で、見えたのは、黒い物だった、と述べています。
      # fact: C-03
      - 語り: ただし、フリート本人は、時計を持っていませんでした。11時40分は、質問した側の数字です。乗客のビーズリーは、本に11時45分と書き、アメリカ上院の報告書は、11時46分です。
      # fact: B-17
      - 語り: 英国の報告書は、ボクソールの見積もり、22ノットを、機関の回転の証言が裏づける、としています。
      # fact: B-17
      - 語り: 甲板員のロウは、正午に合わせた計器が、260マイルだった、と述べています。260を、11時間40分で割ると、22.3ノットです。
      - 語り: 氷山に当たったあと、船の中では、何が起きていたのか。
        hook: true

  # ================================================================ 第2章 衝突から最初のボート
  - title: 衝突から最初のボートまで　23時40分〜0時45分
    background: {image: paintings/titanic_S05.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: C-06
      - 語り: 造船所の技師、トマス・アンドリューズが、船長に告げた見積もりは、1時間から1時間半、と言われています。
      # fact: C-06
      - 語り: ただし、これは、四等航海士のボクソールが、英国調査で、船長から聞いた話として述べたものです。ボクソールは、その時刻を、言えませんでした。
      # fact: B-23
      - 語り: 英国の報告書は、浸水を時間で追っています。船首側の6つの区画が海に開き、10分後には、水位が竜骨から約14フィートまで上がっていました。
      # fact: B-23
      - 語り: 船首の先の倉が満水になったのは、1時間後。4番ボイラー室に水が入り始めたのは、1時間40分後です。
      # fact: C-09
      - 語り: 英国の報告書によれば、12時30分ごろ、女性と子供をボートに乗せる命令が出ました。12時45分ごろ、右舷の7号艇が、降ろされます。
        card: {head: "12時45分ごろ", body: "最初のボート　7号艇"}
      # fact: C-09
      - 語り: ただし、衝突のあとの時刻は、あてにならない、と、同じ報告書が断っています。
      # fact: B-12
      - 語り: 7号艇に乗っていたのは、27人。乗組員3人、男の乗客4人、女性と子供20人です。定員は65人で、席は38、空いていました。
        card: {head: "7号艇", body: "乗った人 27人　定員 65人"}
      # fact: B-13
      - 語り: 三等航海士のピットマンは、英国調査で、5号艇が着水したのは12時30分ごろで、7号艇は、その前だった、と述べています。
      # fact: B-13
      - 語り: 英国の報告書の7号艇12時45分より、少なくとも15分早い計算です。
      # fact: C-11
      - 語り: 1号艇は、定員40人に、12人。30パーセントです。英国の報告書は、凪の海で、これほど満たずに出したのは、説明が難しい、と書きます。
        figure: {type: table, title: ボートに乗った人　英国の報告書, cols: [乗った人, 定員], rows: [[7号艇, 27人, 65人], [6号艇, 28人, 65人], [1号艇, 12人, 40人]], upto: 3}
      # fact: B-07
      - 語り: 船には、ボートが20隻。定員の合計は、英国の報告書で1,178人、アメリカ上院の報告書では1,176人です。
        figure: null
      # fact: B-09
      - 語り: ボートが少なかったのは、規則違反ではありません。1894年の規則は、1万トン以上の船を16隻で打ち止めにしていて、タイタニックは、その容積の2.06倍を積んでいました。
      # fact: B-08
      - 語り: それでも、アメリカ上院は、ボートの定員を使い切らなかったことを、数百人の命の、無駄な犠牲、と呼びました。
        tone: 重い
      - 語り: 同じころ、水平線に、あかりが、見えていました。
        hook: true

  # ================================================================ 第3章 見えた船、動かなかった船
  - title: 5マイルか、19マイルか　カリフォルニアン号は見ていたのか
    background: {image: paintings/titanic_S08.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: B-32
      - 語り: 四等航海士のボクソールは、船のあかりを見ていました。マストのあかりが2つ。距離は、アメリカ上院で5マイル、英国調査で5マイルから6マイル、と答えています。
      # fact: C-28
      - 語り: 信号ロケットも、打ち上げました。何発かは、ボクソールが、英国調査で、半ダースから1ダースのあいだ、と答えています。
      # fact: B-29
      - 語り: そのあかりの側、カリフォルニアン号。二等航海士のストーンは、白いロケットを、合計8発見た、と英国調査で述べています。見習いのギブソンが、自分で見たのは、3発です。
      # fact: B-28
      - 語り: 船長のロードは、アメリカ上院で、船が氷で止まったのは22時21分、位置は北緯42度5分、西経50度7分。
      # fact: B-28
      - 語り: タイタニックまでは、19.5マイルから19.75マイルだった、と述べます。
        card: {head: "ロード船長の証言", body: "19.5〜19.75マイル"}
      # fact: A-30
      - 語り: この位置と、タイタニックが送った遭難位置との差を、緯度と経度から計算すると、約19.7海里です。ロードの数字と合います。
      # fact: B-26
      - 語り: ところが、英国の報告書は、ロードの話でも約5マイル、遠くても、8マイルから10マイル以内、と認定しました。見えたロケットは、約8発です。
      # fact: B-27
      - 語り: アメリカ上院の報告書は、船長の言う19.5マイルより、近かった、としています。
        figure: {type: table, title: カリフォルニアン号までの距離, cols: [距離, 言った人], rows: [[ロード船長, 19.5〜19.75マイル, 米上院で], [位置から計算, 約19.7海里, この動画], [英国の報告書, 5〜10マイル以内, 1912年], [米上院の報告書, 19.5マイルより近い, 1912年]], upto: 4}
      # fact: B-26
      - 語り: 英国の報告書は、最初のロケットのとき、氷を抜けて、救助に向かっていれば、失われた命の、多くを、あるいは全てを、救えたかもしれない、と書きました。
        figure: null
      # fact: B-28
      - 語り: ロード本人は、英国調査で、あの船はタイタニックではない、と答えています。あの手の客船は、光の量で見間違えない、という理由でした。
      # fact: B-31
      - 語り: 見えたあかりの数も、食い違います。ボクソールは、マストのあかりが2つ。ギブソンは、白いマストのあかりと赤いあかり。三等航海士のグローブスは、白いあかりが2つ、と述べています。
      - 語り: ロケットを見て、動いた船は、あったのか。無線は、誰に届いたのか。
        hook: true

  # ================================================================ 第4章 無線が呼んだ船
  - title: CQDは誰に届いたのか　カルパチア号とマウント・テンプル号
    background: {image: paintings/titanic_S10.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: A-17
      - 語り: 最初のCQDは、英国の報告書で、タイタニックの時計の0時15分。衝突から、35分後です。
        card: {head: "0時15分", body: "最初のCQD　衝突から35分後"}
      # fact: A-16
      - 語り: ただし、無線士のブライドは、アメリカ上院で、起きてから船長が無線室に来るまで、10分ほどだった、と述べています。アメリカの報告書は、衝突から15分から20分以内、と書きます。
      # fact: A-17
      - 語り: この信号の時刻は、3つの記録で、そろいます。ケープレースの無線局は、ニューヨーク時間の22時25分。
      # fact: A-17
      - 語り: マウント・テンプル号は、自分の船の0時11分で、ニューヨーク時間との差は1時間46分。引くと、同じ22時25分です。
      # fact: A-17
      - 語り: タイタニックの0時15分は、カルパチア号の時計の差、1時間50分を当てはめると、これも22時25分になります。2つは証言で合い、3つ目は計算で合います。
      # fact: A-19
      - 語り: カルパチア号の船長ロストロンは、カルパチア号の時計で0時35分に、遭難を知りました。距離は58海里。機関を止めたのは、4時ごろです。
      # fact: A-19
      - 語り: 3時間25分で、58海里。時速にすると、およそ17ノット。英国の報告書が書く、この船の最高速度は、17.5ノットです。
        card: {head: "カルパチア号", body: "58海里を3時間25分"}
      # fact: A-18
      - 語り: カルパチア号の無線士コッタムが、最初の信号を受けた時刻は、アメリカ上院では、ニューヨーク時間の夜11時20分ごろ。英国調査では、あとで10時35分と分かった、と訂正しています。
      # fact: A-26
      - 語り: マウント・テンプル号は、タイタニックの西、およそ49マイル。
      # fact: A-26
      - 語り: 船長のムーアは、最初に受け取った位置を、北緯41度44分、西経50度24分、と述べています。のちに、41度46分、50度14分に直されました。
      # fact: A-26
      - 語り: 2つの位置の差は、約7.7海里です。
      # fact: A-25
      - 語り: ドイツ船フランクフルトは、マウント・テンプル号の無線士の記録で、1時11分に、船長が向かう、と伝えました。
      # fact: A-25
      - 語り: 1時31分には、そちらにもうボートはいるか、と聞き、返事はありませんでした。
      # fact: A-31
      - 語り: 送られた位置は、北緯41度46分、西経50度14分。1985年9月1日に見つかった残骸の位置とは、約13海里、24キロあまり、ずれています。
        card: {head: "送られた位置と残骸", body: "約13海里（24km）のずれ"}
      # fact: A-23
      - 語り: 遭難信号といえば、SOSを思い浮かべる人も、多いでしょう。ブライドが、事故のあとの4月27日に書いた手紙には、フィリップスが、CQDとSOSを打った、とあります。
      - 語り: 最後の信号は、いつだったのか。記録は、ここでも、食い違います。
        hook: true

  # ================================================================ 第5章 最後の信号と沈没
  - title: 2時20分　最後の信号と、沈んだ時刻
    background: {image: paintings/titanic_S11.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: A-20
      - 語り: カルパチア号のコッタムが、最後に聞いた言葉は、できるだけ急いで来てくれ、機関室が、ボイラーまで満ちてくる、という言葉です。英国の報告書は、時刻を、船内の1時45分としています。
        card: {head: "1時45分", body: "機関室がボイラーまで満ちてくる"}
      # fact: A-21
      - 語り: 最後の信号が、いつ、誰に聞こえたかは、記録で違います。マウント・テンプル号は、ニューヨーク時間の23時47分。コッタムは、23時55分。
      # fact: A-21
      - 語り: 英国は、船内の2時17分に、ヴァージニアン号が、かすかに聞いたとします。
      # fact: A-21
      - 語り: 2時17分を、ニューヨーク時間に直すと、0時27分。23時47分とは、40分の開きがあります。
        figure: {type: table, title: 最後の信号　記録の違い, cols: [ニューヨーク時間, 船内時刻], rows: [[マウント・テンプル号の記録, 23時47分, 1時37分（1時間50分で換算）], [コッタムの証言, 23時55分, 1時45分（換算）], [ヴァージニアン号（米上院）, 0時27分, 2時17分（換算）]], upto: 3}
      # fact: A-22
      - 語り: ブライドは、アメリカ上院で、無線室を離れたのは、船が沈む、約10分前だった、と述べました。英国の報告書は、最後の信号を、2時17分とします。沈没の、3分前です。
        figure: null
      # fact: C-10
      - 語り: 最後のボート、D号が降りたのは、英国の報告書で、2時5分。船が沈む、15分前です。
      # fact: C-19
      - 語り: そして、2時20分。英国の報告書が、船が沈んだ、とする時刻です。
        card: {head: "2時20分", body: "沈没（英国の報告書）"}
      # fact: C-20
      - 語り: ビーズリーは、どの話も、2時20分ごろで一致する、と書き、沈んだ少しあとに、自分の艇の時計は、2時30分だった、とも書いています。
      # fact: B-21
      - 語り: アメリカ上院の報告書は、沈没を、ニューヨーク時間の0時47分としています。
      # fact: B-21
      - 語り: 衝突は、船の時刻の23時46分、ニューヨーク時間の22時13分。つまり、この報告書の差は、1時間33分です。
      # fact: A-17
      - 語り: ところが、カルパチア号の時計とニューヨーク時間の差は、ロストロンの証言から、1時間50分。同じ夜の差が、17分、食い違っています。
      # fact: B-21
      - 語り: 衝突の時刻は、英国が23時40分、アメリカが23時46分。6分の差です。衝突から沈没までは、英国で2時間40分、アメリカで2時間34分になります。
        figure: {type: table, title: 衝突から沈没まで, cols: [時刻, 長さ], rows: [[英国の報告書, "23時40分→2時20分", 2時間40分], [ビーズリーの時刻から計算, "23時45分→2時20分", 2時間35分], [米上院の報告書, "22時13分→0時47分（NY時間）", 2時間34分]], upto: 3}
      # fact: C-24
      - 語り: 船は、沈む前に、折れたのか。ライトラーは、アメリカ上院で、まったく無傷だった、と答えました。
        figure: null
      # fact: C-25
      - 語り: 一方、水夫のポインドストルは、英国調査で、前の煙突のところで割れたと思った、と述べています。
      # fact: B-24
      - 語り: 英国も、アメリカ上院も、船は割れずに沈んだ、と認定しました。1985年、船は、2つに分かれた姿で、海底で見つかりました。
      - 語り: 数にも、食い違いがあります。
        hook: true

  # ================================================================ 第6章 数の食い違い
  - title: 何人乗って、何人助かったのか　米英の数字
    background: {image: paintings/titanic_S14.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: B-05
      - 語り: 乗っていた人は、アメリカ上院の報告書で、2,223人。英国の報告書で、2,201人。22人の差です。
      # fact: B-05
      - 語り: 助かったのは、アメリカで706人、英国で711人。亡くなったのは、アメリカで1,517人。英国で1,490人。差は27人で、22人と5人を足した数と、合います。
        figure: {type: table, title: 乗船・生存・死者　米英の報告書, cols: [米上院, 英国], rows: [[乗っていた人, "2,223人", "2,201人"], [助かった人, "706人", "711人"], [亡くなった人, "1,517人", "1,490人"]], upto: 3}
      # fact: C-15
      - 語り: カルパチア号の船長ロストロンは、ニューヨークで降ろしたのは705人、と英国調査で述べています。ボートで亡くなっていた3人と、乗船後に亡くなった1人は、数えていません。
        figure: null
      # fact: C-13
      - 語り: 英国の報告書は、18艇に、854人が乗った、と書きます。乗組員107人、男の乗客43人、女性と子供704人です。
      # fact: C-13
      - 語り: 同じ部分で、カルパチア号が助けたのは、712人しかおらず、数字は、あてにならない、とも断っています。
        figure: {type: table, title: カルパチア号が運んだ人数, cols: [人数, 出どころ], rows: [[ロストロンの証言, 705人, 英国調査], [ビーズリーの本, "705人（210＋495）", 1912年], [米上院の報告書, 706人, 1912年], [英国調査のまとめ, 711人, 名簿705＋名簿にない6人], [英国のボートの項目, 712人, 報告書]], upto: 5}
      # fact: C-12
      - 語り: 854を、定員の1,178で割ると、72.5パーセント。712で割ると、60.4パーセントです。
        figure: null
      # fact: C-14
      - 語り: 英国の報告書の表の合計欄は、右舷のボートに乗った人が461人、左舷は393人。男の乗客は、右舷に36人、左舷に7人でした。
        card: {head: "右舷と左舷", body: "右 461人　左 393人"}
      - 語り: 調査は、何を変えるよう求めたのか。
        hook: true

  # ================================================================ 第7章 その後
  - title: 調査のあと　勧告と、4月15日の誤報
    background: {image: paintings/titanic_S13.jpg, credit: "AI生成の想像画"}
    year: 1912
    lines:
      # fact: B-01
      - 語り: アメリカ上院は、4月19日から5月25日まで。英国は、5月2日から7月3日まで、調べました。
      # fact: B-36
      - 語り: アメリカ上院は、全員分のボートと、無線を昼も夜も動かし続けること、を求めました。
      # fact: B-37
      - 語り: 英国は、ボートの数を、船に乗る人の数で決めること、氷の知らせがあれば、暗い時間は速度を落とすか、大きく迂回することを求めました。
      # fact: B-37
      - 語り: アメリカの勧告に、氷についての勧告は、ありません。
        card: {head: "英国の勧告", body: "ボートは乗る人の数で決める"}
      # fact: B-10
      - 語り: 規則の見直しは、事故の前から動いていました。1911年に、諮問委員会の小委員会が報告を出しましたが、実施されないまま。
      # fact: B-10
      - 語り: 商務省の返信は、4月16日付で用意されましたが、沈没のため、送られませんでした。
      # fact: A-36
      - 語り: 通信社の編集者ファレルが、上院で説明した話です。4月15日の朝、ニューヨークの運航会社の事務所は、乗客はボートで移動中、近くの2隻が待機している、と取材に答えた、といいます。
      # fact: A-36
      - 語り: 待機している、は、船乗りの言葉で、応じて向かっている、という意味でした。読む人は、すぐ近くにいる、と受け取った、とファレルは述べています。
      # fact: A-36
      - 語り: ファレルによれば、ボストンの会社は、モントリオールの会社に、全員がヴァージニアン号に移り、ハリファックスへ向かう、という知らせを、電話で確かめました。
      # fact: A-36
      - 語り: そういう知らせがある、という答えを、確認と受け取りました。
        card: {head: "4月15日の誤報", body: "全員救助・ハリファックスへ"}
      - 語り: では、これらの記録から、何が言えるのでしょうか。
        hook: true
        tone: 疑問

  # ================================================================ まとめ
  - title: まとめ：タイタニックの最期、記録から言えること
    background: {image: paintings/titanic_S01.jpg, credit: "AI生成の想像画"}
    lines:
      - 語り: 言えることと、言えないことを、分けます。
      # fact: B-18
      - 語り: 言えること。氷の警報は、その日、何通も、無線室に入っていました。英国の報告書は、船橋には届いたとは見られない、と判断しました。
      # fact: C-11
      - 語り: 言えること。最初のボートは、定員65人に、27人で出ました。英国の報告書は、これを、説明が難しい、と書いています。
      # fact: B-26
      - 語り: 言えること。近くの船は、ロケットを見ていました。ただし、その船までの距離は、5マイルから10マイル以内、とも、19.7海里とも、記録が食い違います。
        tone: しみじみ
      - 語り: 言えないこと。エバンズへの返事が、黙れ、だったのか、邪魔するな、だったのか。最後の信号は、いつだったのか。
      # fact: B-05
      - 語り: 言えないこと。乗っていた人は、2,223人か、2,201人か。助かった人は、706人か、711人か。
      # fact: B-21
      - 語り: 衝突から沈むまでの長さも、英国の2時間40分と、アメリカの2時間34分で、違います。
      - 語り: 氷山に当たった11時40分から、沈むまでの、2時間40分。
        pause: 0.8
      # fact: C-19
      - 語り: 午前2時20分。時計を持たなかった士官が、仲間と出した答えです。
        tone: しみじみ
        pause: 0.8
      - 語り: 亡くなった方々を悼みながら、記録を、たどりました。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、この夜のどの時刻を、いちばん信じられると思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
