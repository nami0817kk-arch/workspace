# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。想像の台詞は入れない（imagined なし）。創作の台詞・遺体や惨状の描写は入れない。人物の顔は絵にしない。
# 1本に1つの問い＝「沈むまでの2時間40分に何があったのか。無線の記録と、英米2つの調査はなぜ食い違うのか」。題名は問いの形。
#   冒頭（10秒以内）＝沈没の2時20分は、二等航海士ライトラー自身が時計で見た時刻ではない（titanic C-19）。
#   続く意外な一点＝氷の警報は無線室に届いていたが船橋に届いたとは見られない（A-10）・近くの船の無線士は遭難信号の前に受信機を外して寝ていた（A-04）。
# 記録の食い違い（本編に表で並べるもの）：
#   ①エバンズへの返事（米上院「Shut up, shut up, I am busy」／英国「Keep out」。A-03）
#   ②カリフォルニアン号までの距離（ロード19.5〜19.75マイル／英国 5〜10マイル以内／米上院 19.5より近い。B-26〜28）
#   ③最後の信号の時刻（NY 23:47・23:55・0:27。A-21）／時差（米上院の報告書 1時間33分・ロストロンの証言 1時間50分。B-21・A-17）
#   ④衝突から沈没まで（英 2時間40分・米 2時間34分・ビーズリー 2時間35分。B-21・C-05）
#   ⑤数（乗船・助かった人・亡くなった人・カルパチアが運んだ人。B-05・C-13〜C-16）
# 計算（自分で計算し直した）：23:40→2:20＝160分／21:40→23:40＝ちょうど2時間／23:40→0:15＝35分／0:35→4:00＝3時間25分、58海里÷3.417時間≒17.0ノット／
#   ログ260÷11.67時間（正午→23:40）≒22.3ノット／カルパチア信号 NY 10:25→（23:20と22:35）＝45分／CQD の位置と残骸の位置＝約13.1海里≒24km／ロードの位置とタイタニックの位置＝約19.7海里／
#   最後の信号 NY 23:47→0:27＝40分／沈没前 2:20−2:05＝15分／2:20−2:17＝3分／米 22:13→0:47＝2時間34分（154分）、差は6分／1:50−1:33＝17分／
#   2,223−2,201＝22、711−706＝5、1,517−1,490＝27（22+5）／854÷1,178＝72.5%、712÷1,178＝60.4%／107+43+704＝854／461+393＝854／27÷65＝41.5%、65−27＝38／12÷40＝30%／11,327.9÷5,500＝2.06／210+495＝705。
# 事実は事実カード（dev/output/rekishi-chiso/research/titanic_facts_20261115.yaml の A-xx（無線）・B-xx（英米の調査）・C-xx（船内の時刻））にあるものだけ。行の上に `# fact: A-10`。
#   使わないこと：Bride が SOS を勧めたという話（一次の証言で確かめられない）／Scarrott・Thayer の「割れた」証言（逐語を開けていない）／Beesley を「割れた」側に数えること（本人は割れたと書いていない）／
#   MAIB 1992 の 17〜20 マイル（要約のみ）／遺体・惨状／人物の内心／楽団の演奏の細部。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
