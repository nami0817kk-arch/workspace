# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  『史記』の秦始皇本紀に、兵馬俑のことは書かれていません。「俑」の字さえ、出てきません。それでも地下には、約8000体といわれる兵士の像が並んでいました。
  その8000という数は、掘って数えた数ではなく、推算です。見つけた農民たちのうち、誰が第一発見者なのか、博物院は2015年の時点で、誰も認めていませんでした。
  記録で言えること、言えないことを分けて、なぜ地下に埋められたのかをたどりました。
  この動画でわかること
  ・『史記』が始皇帝陵について書いたことと、書かなかったこと
  ・1974年の発見の日と発見者が、資料で割れる様子
  ・秦が人を埋めていた記録と、「人の代わり」と言い切れない理由
  ・体に刻まれた陶工の名前と、武器の製作年
  ・8000体という数について、博物院院長が語った説明
description_note: |-
  発見の日・発見者の人数、陵園の面積、工期、70万人の数、水銀の倍率、掘り出した体数は、資料によって数字が割れています。動画ではそれぞれの数を出どころつきで並べました。
  『史記』の本文（秦始皇本紀・秦本紀）の引用、秦始皇帝陵博物院・陝西省文物局の発表、Antiquity（2017）などの論文、新華社・人民日報海外版などの報道で確かめました。なぜ埋めたのかについての直接の史料は確認できず、動画では「言えること」「言えないこと」に分けました。2026年10月発表の指紋の研究は、発表の直後の報道によります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "Why Was the Terracotta Army Buried Underground? Not One Word in the Shiji, and a Well in 1974"
  description: |-
    The Shiji's chapter on the First Emperor does not mention the Terracotta Army. It does not even contain the character for a burial figure.
    Yet some 8,000 soldiers are said to stand underground. That 8,000 is an estimate, not a count, and as of 2015 the museum had recognized none of the farmers as the first discoverer.
    We sorted what the records let us say from what they do not.
    In this video you will learn:
    - What the Shiji wrote about the tomb, and what it left out
    - Why the discovery date and the discoverers differ between sources
    - The records of human burial in Qin, and why "a substitute for people" cannot be claimed
    - The potters' names and the weapon dates written on the figures
    - Where the number 8,000 really comes from
    Numbers differ between sources and are shown with their sources. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Not One Word in the Shiji"
    - "A Well in 1974"
    - "What the Shiji Wrote"
    - "A State That Buried People"
    - "Names Written on the Bodies"
    - "Is Every Face Different?"
    - "Colour and Fire"
    - "The People Who Built the Tomb"
    - "Counting 8,000"
    - "Summary: What Can We Say?"

