# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。兵馬俑は、なぜ地下に埋められたのか（秦・紀元前3世紀〜1974年・中国）。2026-11-15 作成。公開の予定は 11/19 19:00（本編）。
# 型：docs/story-main.md「00. 伸びる型」の E 暮らし型の応用（世界史・秦〜今の中国）。語りは剣崎1人。主役は人でなくモノ（像）。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「なぜ、秦の人々は兵士の像を地下に埋めたのか」。答えの席＝『史記』は理由を書いていない。記録から「言えること」「言えないこと」に分けて最後に並べる。
#   冒頭＝『史記』秦始皇本紀に「俑」の字が無い（WebFetch で本文を確認）＋8000は推算（李岡院長 2024-12）＋第一発見者を博物院は誰も認めていない。
#   型の作り：序章（3つの意外な一点）／第1章 1974年の井戸の底／第2章 『史記』が書いたことと書かなかったこと／第3章 人を埋めていた国（人殉→俑。理由の史料は無い）／
#   第4章 体に刻まれた名前（陶工・武器の年・髪型）／第5章 顔は1体ずつ違うのか／第6章 色と火／第7章 陵を造った人々／第8章 8000体の勘定／まとめ。
# 記録の食い違い（誰のどの記録が何と書くか）：①発見の日・発見者の人数（3月29日／4月25日の電話・3人から9人・博物院は誰も認めず）②70万人（阿房宮と分けた数／『漢旧儀』は陵の数／ナショジオは誇張）と水銀の倍率（7倍・70倍）
#   ③顔（中国側「千人千面・8000」／Quinn「型の部品の組み合わせ・約7000」）④彩色の「15秒／数分」は測る段階の違いかもしれない（食い違いとは言い切らない）⑤8000体（推算／「掘り出した8000余件」と書く新華社）。
# 計算（自分で計算し直した）：1974→2026＝52年／3月29日→7月15日＝108日／前384→前210＝174年／前246→前210＝36年／前246→前244＝即位から3年目、→前228＝19年目／前228→前221＝7年／
#   6000+1300+68＝7368、8000−7368＝632／14260+6000+520＝20780㎡、20780÷2130000＝0.98%／430÷14260＝3.0%／13年（2009〜2022）／8000−7000＝1000／464点中37点＝8%（7.97）／1440÷205＝7.0／45.0+32.7+22.3＝100.0／2024−1974＝50年。
# 照合（Agent 3人：前半・後半・流れ）の指摘は11-15 に反映済み：8000は陶俑＋陶馬・3%は第三次発掘だけ・「今も」は2015年の時点・信立祥は前漢の墓の話・7368は「あまり」・指紋は群の推定でT23区画。
# 事実は事実カード（dev/output/rekishi-chiso/research/兵馬俑_facts_20261115.yaml、heibayo-A／B／C）にあるものだけ。行の上に `# fact: heibayo-xx`。
#   使わないこと：呂不韋の刻銘（本文未確認）・陶工87人（未見）・「1角3分」の褒美の話・発見の日の断定・クロムメッキは「あった」と言わない・「型の組み合わせ」を結論として言わない・指紋の結果を「女性が作った」と断定すること・
#   「人殉の代わりに俑を作った」という言い切り（直接の史料は確認できない）・「3つの坑で8000」を事実として言い切ること。
