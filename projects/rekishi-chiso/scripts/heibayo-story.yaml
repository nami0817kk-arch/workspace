sections:
  # ================================================================ 序章（冒頭 約1分半）。答えの席：なぜ地下に埋められたのか
  - title: 一言もない8000体　兵馬俑
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    year: 1974
    lines:
      # fact: heibayo-A01, heibayo-A40
      - 語り: 約8000体といわれる、兵士と馬の像。ところが、始皇帝の時代を書いた『史記』は、この像のことを、《書いていません》。『俑』、つまり、墓に納める人形の字さえ、出てきません。
        tone: 重い
      # fact: heibayo-A32
      - 語り: その8000は、《掘って数えた数》では、ありません。秦始皇帝陵博物院の院長は、推算から来た数字かもしれない、と説明しています。
        tone: 重い
      # fact: heibayo-A26
      - 語り: 見つけたのは、井戸を掘っていた農民たち。ところが、誰が第一発見者なのか、博物院は、2015年の時点で、誰も認めていませんでした。
      - 語り: なぜ、秦の人々は、これだけの像を、地下に埋めたのか。この動画の終わりまでに、記録で言えることと、言えないことを、分けてお見せします。
        tone: 疑問
        hook: true
      # fact: heibayo-C01
      - 語り: 掘り出した像の色は、15秒で、変わり始める、という報道もあります。
        tone: 重い
      # fact: heibayo-A20, heibayo-A44
      - 語り: そして、この像の坑は、始皇帝の墓のまわりに散らばる、坑の、ほんの一組でした。3つの坑を合わせても、約2万平方メートル。
      - 語り: 陵園の外城、約213万平方メートルと比べても、およそ1パーセントです。
      - 語り: まず、1974年の、井戸の底から。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 井戸の底
  - title: 井戸の底の陶片　1974年・西楊村
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    year: 1974
    lines:
      # fact: heibayo-A24
      - 語り: 1974年3月。場所は、陝西省の臨潼県、西楊村。始皇帝陵の、東へ約1.5キロです。村人たちが、井戸を掘っていました。
        year: 1974
      # fact: heibayo-A23
      - 語り: 井戸の底から、陶器の人の、上半身が出てきました。日付は、3月29日と書く記事が、多くあります。
        figure: {type: stats, title: 発見の日と、発見者の数, items: [[発見の日, 3月29日が多い, 記事によって違う], [発見者の人数, 3人から9人, 資料で割れる], [認めた人, ゼロ, 博物院]], upto: 1}
      # fact: heibayo-A23
      - 語り: 井戸の日とは別に、地元の文化館の趙康民が、電話を受けた日を、4月25日とする報道もあります。
        tone: 重い
      # fact: heibayo-A25
      - 語り: 発見者の人数も、割れます。2015年の中国新聞網には、発見者は3人だった、という話が載っています。2003年には、地元の新聞が、申請された9人の名前を、載せました。
        figure: {type: stats, title: 発見の日と、発見者の数, items: [[発見の日, 3月29日が多い, 記事によって違う], [発見者の人数, 3人から9人, 資料で割れる], [認めた人, ゼロ, 博物院]], upto: 2}
      # fact: heibayo-A26
      - 語り: 博物院の担当者は、同じ2015年の記事で、こう答えています。どの人も、秦俑の発見人と、認めたことはない、と。
        figure: {type: stats, title: 発見の日と、発見者の数, items: [[発見の日, 3月29日が多い, 記事によって違う], [発見者の人数, 3人から9人, 資料で割れる], [認めた人, ゼロ, 博物院]], upto: 3}
        tone: 重い
      # fact: heibayo-A27
      - 語り: 第一発見者をめぐっては、ほかにも名前が挙がります。作家の岳南は、こう書きます。井戸が水に当たらないのを見て、もう掘るな、と言ったのは、水管員の房樹民だった、と。
        figure: null
      # fact: heibayo-A27
      - 語り: 岳南によれば、自分こそ、発見から発掘までの第一人だ、としたのは、趙康民です。名乗りは、重なったままです。
      # fact: heibayo-A28
      - 語り: 趙康民は、破片を集めて、文化館へ運び、2体の武士俑を復元して、秦の俑だと鑑定した、と澎湃新聞は書きます。
      # fact: heibayo-A30
      - 語り: 秦俑考古隊が、正式に現地へ入ったのは、7月15日。3月29日と数えれば、井戸の日から、108日あとです。
        year: 1974
      # fact: heibayo-A33
      - 語り: 掘り進めると、陶片は、1体では終わりませんでした。一号坑は、約14260平方メートル。陶俑と陶馬が、6000あまり並ぶ、と見積もられています。
      - 語り: 陶片だった像は、どんな墓に、納められたものなのか。まず、史記が書いた墓から。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 『史記』が書いたこと
  - title: 紀元前246年　史記が書いた始皇帝陵
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    year: -246
    lines:
      # fact: heibayo-A06, heibayo-C36
      - 語り: 『史記』が書かれたのは、始皇の死から、100年以上あと。アメリカの雑誌ナショナルジオグラフィックの記事が、そう指摘しています。書いた司馬遷は、始皇を直接見た人では、ありません。
      # fact: heibayo-A01
      - 語り: その秦始皇本紀には、こうあります。始皇は、即位してすぐ、墓のある驪山を、掘り始めた、と。
        year: -246
      # fact: heibayo-A01
      - 語り: 天下を統一したあとは、天下の労役の者、70万人あまりを送り、泉を3重に掘り、銅で外側の棺を固めて、宮殿、役人、珍しい器を、運び込んで満たした、とあります。
        tone: 重い
      # fact: heibayo-A02
      - 語り: 仕掛けも、書かれている。近づく者を射る、機械仕掛けの弩。水銀で、川と海を作り、上には天文、下には地の形。
      # fact: heibayo-A05
      - 語り: 同じ70万という数は、始皇35年の記事にも出ます。そちらは、阿房宮という宮殿と、驪山の墓に、分けて使った、という書き方です。
        tone: 重い
      # fact: heibayo-C29
      - 語り: 水銀の数字は、測り方で、別々に出てきます。2020年の論文は、過去の研究の値として、土壌の水銀が、平均205ppb、最高1440ppb、と書きます。
      # fact: heibayo-A16
      - 語り: そして、2026年9月の博物院の発言では、封土の水銀は、大地本体の70倍を超える、とされました。どれも、同じ物差しの数では、ありません。
      # fact: heibayo-A14, heibayo-A15
      - 語り: 墓の盛り土、封土は、秦のころ、約470メートル四方とされ、今は、350メートル四方です。物理探査では、墓室は約4000平方メートル、深さは約30メートル、と報告されています。
      # fact: heibayo-A03
      - 語り: 史記は、埋葬のあとのことも書きます。仕掛けを知る職人が、秘密を漏らすのを恐れて、墓の通路を閉じ、職人は、誰も出られなかった、と。
        tone: 重い
      # fact: heibayo-A04
      - 語り: 始皇の次の皇帝、二世は、始皇の後宮のうち、子のない者に、皆、従死を命じました。従死とは、主の死に合わせて、人を死なせて葬ること。死者は、とても多かった、とあります。
      - 語り: 宮殿も、役人も、仕掛けも、人の死も、書かれている。それなのに、地下の軍には、一言もありません。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 人を埋めていた国
  - title: 人を埋めていた国　従死と俑
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    year: -384
    lines:
      # fact: heibayo-A07
      - 語り: 史記は、人の死は、はっきり書きます。秦本紀を開くと、秦は、墓に人を従わせることを、長く続けた国でした。武公のとき、初めて人を従死させた、従死者は66人、とあります。
      # fact: heibayo-A08
      - 語り: 穆公が亡くなったときは、177人。秦の人は、これを哀しんだ、と書かれています。
        tone: 重い
      # fact: heibayo-A10
      - 語り: 発掘でも確かめられています。秦公一号大墓、景公の墓からは、殉じた人の骨が、186体、出ています。中国の論文が、そう書いています。
      # fact: heibayo-A09
      - 語り: その秦で、献公の元年、紀元前384年とされる年に、史記は、こう書きます。従死を、止めた、と。理由は、一言も、ありません。
        year: -384
        tone: 重い
      # fact: heibayo-A09, heibayo-A04
      - 語り: 紀元前384年から、始皇の死の紀元前210年まで、174年。その始皇の葬でも、二世は、さきほどの後宮の女性たちに、従死を命じています。従死は、記録の上で、完全には消えていません。
        tone: 重い
      # fact: heibayo-A11
      - 語り: では、俑は、人の代わりだったのか。ある論文は、献公のとき、はっきり従死が止められ、陶俑が、これに伴って興った、と整理しています。
      # fact: heibayo-A11
      - 語り: ただし、俑が人の代わりだ、と書いた史料は、確認できていません。
        tone: 重い
      # fact: heibayo-A12
      - 語り: 前漢の海昏侯墓を調べた考古学者、信立祥は、2015年の取材で、孔子の言葉を引きます。始めて俑を作った者には、子孫がなくなるだろう。人の形に似せて、使うからだ、と。
      # fact: heibayo-A12
      - 語り: 信立祥の説明では、俑は、人の形をしたものです。儀式をして埋めれば、あの世で、生きた人になって《仕える》、と考えられていた、といいます。
      - 語り: ただし、これは、前漢の墓の専門家の説明で、秦の人が、そう書き残したわけでは、ありません。
        tone: 重い
      # fact: heibayo-C27, heibayo-C28
      - 語り: 秦の坑は、兵士だけでもありません。曲芸をする人の俑が出た坑もあり、専門家は、宮廷の娯楽を担う機関を表すのでは、と推測しています。
      - 語り: では、この像は、誰が、いつ作ったのか。体には、名前が刻まれていました。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 体に刻まれた名前
  - title: 体に刻まれた名前　陶工・宮丙と武器の年
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    year: -244
    lines:
      # fact: heibayo-B01
      - 語り: 秦の俑の体には、押した印、刻んだ線、朱で書いた字が、付いています。漢字、数字、記号。役人が、人と材料と製品を、動かすための管理の仕組みだった、と研究されています。
      # fact: heibayo-B04
      - 語り: 陶工の名には、「宮」の字を頭につけた名と、咸陽など、地名をつけた名があります。博物院の夏寅は、2020年の取材で、「宮」は宮廷の工房の職人だ、と説明しています。
      # fact: heibayo-B05
      - 語り: 文匯報は、2019年に、こう書きました。宮丙という陶工は、陶俑を45体、作った、と。
        tone: 重い
      # fact: heibayo-B06
      - 語り: 同じ記事には、咸陽敬という陶工が、髭のない俑を作った、という例も出てきます。
      # fact: heibayo-B14
      - 語り: 武器にも、年が刻まれていました。のちの始皇帝、秦王政の元年、紀元前246年から数えて、槍や戈の製作年は、3年目から19年目。紀元前244年から、228年です。
        year: -244
      # fact: heibayo-B14
      - 語り: 統一の紀元前221年より、7年から23年前。つまり、年が刻まれた武器は、統一する前に作られたものです。
      # fact: heibayo-B15
      - 語り: ただし、年が刻まれたものは、ごく一部です。大半は、年が無く、もっとあとに作られた可能性も、消えません。2014年の論文が、そう断っています。
        tone: 重い
      # fact: heibayo-B04
      - 語り: 同じ論文は、弩の引き金に、「宮」の字が入ったものがある、と書きます。官営の工房に関わる字らしい、という書き方です。
      # fact: heibayo-B17
      - 語り: 引き金は、少数ずつの組で作られ、組み立ても、同じ作業班の中で済ませた、と見られています。
      - 語り: 年のほかに、材料の話もあります。
      # fact: heibayo-B22
      - 語り: 秦の青銅の武器は、錆びないよう、クロムの処理をしていた。長く、そう言われてきました。
      # fact: heibayo-B22
      - 語り: ところが、2019年の論文は、否定します。クロムが見つかったのは、464点のうち37点、約8パーセント。出どころは、遺跡に大量にある、漆でした。
        tone: 重い
      # fact: heibayo-B23
      - 語り: 錆びずに残った理由は、土のやや弱いアルカリ性と、錫を含む青銅の組成だ、と論文は書きます。
      # fact: heibayo-B24
      - 語り: 兵士の髪型も、手がかりです。髪型と、持つ武器の種類が、対応する傾向がある、と2023年の報道は伝えます。
      - 語り: 名前と、年と、髪型。では、この兵士たちの顔は、本当に、1体ずつ違うのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 顔は1体ずつ違うのか
  - title: 顔は1体ずつ違うのか　千人千面
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    lines:
      # fact: heibayo-B35
      - 語り: 中国の報道には、決まり文句があります。8000体の兵馬俑、千人千面。一人ずつ、顔が違う、という意味です。
      # fact: heibayo-B28
      - 語り: 2014年、ロンドン大学と博物院は、30体の左の耳を、3Dにして調べました。結果は、同じ耳は、一つもなかった、というものです。
        tone: 重い
      # fact: heibayo-B28
      - 語り: ロンドン大学の研究者、マルティノン・トーレスは、最初の標本では、実在の兵士の肖像の連なりに、見える、と語りました。
      # fact: heibayo-B29
      - 語り: ただし、調べたのは、30体だけです。アメリカの考古学の雑誌は、2014年の時点で、研究チームが、さらに大きな標本を、調べている最中だ、と伝えました。
      # fact: heibayo-B31
      - 語り: 一方、2017年のクインたちの論文は、型で同じ部品を作り、それを何通りにも組み合わせた、という作り方を、前提にしています。
        tone: 重い
      # fact: heibayo-B35
      - 語り: その論文は、兵士や将軍と馬を、あわせて、約7000体と書きます。8000との差は1000ですが、数え方が同じかどうかは、分かりません。
      # fact: heibayo-B32
      - 語り: 一号坑の発掘報告は、顔を、8種類に分けた、と伝えられています。分類の名前は、田や国など、漢字の形にちなんでいます。
      # fact: heibayo-B43
      - 語り: 2026年10月、新しい研究が出ました。俑の表面に残った指紋、79個から、作り手を推定した研究です。
        year: 2026
      # fact: heibayo-B43
      - 語り: 結果は、残った指紋のうち、成人の男性のものが約45パーセント、成人の女性が約33パーセント、15歳未満が約22パーセントという推定です。合計は100パーセントです。
        tone: 重い
        figure: {type: pie, title: 指紋から推定した作り手, parts: [[成人の男性, 45.0], [成人の女性, 32.7], [15歳未満, 22.3]], unit: "%"}
      # fact: heibayo-B45
      - 語り: ただし、限界も、書かれています。比べた基準が、現代のチェコの白人の指紋で、東アジアの人ではないこと。調べた俑が、一号坑の一部の、T23という区画のものだけだったこと。
        figure: null
      # fact: heibayo-B45
      - 語り: 同じ人の指紋が、何個も混じっている可能性があり、熟練した人ほど、指紋を残しにくいので、少年の割合は、高く出るかもしれない、とも書かれています。
      # fact: heibayo-B45
      - 語り: 女性や、少年が関わった可能性は、あります。けれど、そうだった、とは、まだ言えません。
        tone: しみじみ
      # fact: heibayo-B31, heibayo-B28, heibayo-B30
      - 語り: 顔は、調べた30体の耳では、同じものがありませんでした。型で部品を作る作り方は、2017年の論文が前提にしています。そのうえで、一体ずつが、実在の兵士を写したものかどうかは、まだ決着していません。
      - 語り: 顔の次に気になるのは、色です。この像たちは、はじめから、灰色だったのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 色と火
  - title: 色と火　項羽と、15秒の彩色
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    lines:
      # fact: heibayo-C03
      - 語り: 俑は、はじめ、鮮やかな色をしていました。生の漆を、体に塗り、その上に、絵の具を重ねる、2層の作りです。
      # fact: heibayo-C05
      - 語り: 秦始皇帝陵博物院の研究者、夏寅は、人民日報海外版で、硅酸銅バリウムの紫を、自然界で見つかっていない顔料だ、と語っています。
      # fact: heibayo-C01
      - 語り: その色が、掘り出すと、傷みます。冒頭で触れた《15秒》です。人民日報海外版は、出土後15秒で、変わり始める、と書きました。
        tone: 重い
      # fact: heibayo-C02
      - 語り: 一方、澎湃新聞の、2023年の記事は、数分で、色が剥がれ落ちる、と書きます。15秒は変わり始めるまで、数分は剥がれ落ちるまで。測っている段階が、違うのかもしれません。
      # fact: heibayo-C04
      - 語り: 理由を、2003年の記事で説明したのは、ドイツの大学の研究者、ランガルスです。水を含んだ土が、漆を変質させ、掘り出すと、塗膜が割れる、という説明です。
      # fact: heibayo-C07
      - 語り: 今の現場では、出土したら、すぐに保湿剤を吹き、食品用のラップで包んで、湿度を保ちます。一号坑には、現場の保護修復の実験室もあります。
      # fact: heibayo-C20
      - 語り: 俑は、色だけでなく、焼けてもいました。原因は、自然に火がついた説、葬送で自ら燃やした説、そして、秦を倒した側の武将、項羽の軍が、焼いた説の、3つがあります。
        tone: 重い
      # fact: heibayo-C21
      - 語り: 一号坑には、黒い木炭の跡と、焼けた敷き煉瓦があります。発掘隊は、坑が崩れたのは、火で焼かれたためと見ています。
      # fact: heibayo-C22, heibayo-A17
      - 語り: 2023年の発表では、坑の通路が、一度、人の手で掘り開けられていた、と分かりました。博物院の研究員、申茂盛は、項羽の破壊を示す、非常に強い裏づけだ、と述べますが、推測として出しています。
        tone: 重い
      - 語り: 像を焼いたのが誰かは、決め手がありません。では、そもそも、この陵を造った人たちは、どんな扱いを受けていたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 陵を造った人々
  - title: 陵を造った人々　刑徒の墓
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    lines:
      # fact: heibayo-C12
      - 語り: 始皇帝陵の西、趙背戸村の西では、墓が114基、見つかりました。そのうち32基が調べられました。
      # fact: heibayo-C12
      - 語り: 瓦に刻まれた文から、秦に滅ぼされた国々の、刑徒、つまり罰として働かされた人の墓だと、分かりました。
      # fact: heibayo-A21
      - 語り: 兵馬俑博物館の東北の窯の跡からは、人骨が、121体、見つかっています。修陵にかかわった人たちとされ、刑徒か自由民かは、はっきりしません。
        tone: 重い
      # fact: heibayo-C14
      - 語り: 後漢の『漢旧儀』は、刑を受けた人と、奴隷、70万人あまりを使って、陵を作らせた、と書く、と紹介されています。工期は、37年だといいます。
      # fact: heibayo-C15
      - 語り: ナショナルジオグラフィックは、70万人を、誇張がすぎる、と見ています。一方、2017年のクインたちの論文は、最大で70万人だった可能性も、あると書きます。
      # fact: heibayo-C18
      - 語り: 工期の数字も、割れます。『漢旧儀』は37年、2016年の論文は39年、とされます。
      # fact: heibayo-C18
      - 語り: 即位の翌年の元年、紀元前246年から、始皇の死の紀元前210年までなら、36年。即位の年から数えれば37年で、数え方で、1年変わります。
        tone: 重い
      # fact: heibayo-C37
      - 語り: ナショナルジオグラフィックによれば、陵の近くには、空の墓室や、遺骸が散らばった墓が、約100基あります。意味は、分かっていません。
      # fact: heibayo-C16
      - 語り: 2017年の論文は、俑の粘土が、陵の近くで取れたものだ、と分析します。粘土は、一か所で処理して、各工房へ配られた、という見方も、示します。
      # fact: heibayo-B12
      - 語り: 印は、驪山だけでなく、約50キロ離れた、咸陽の工房の関与を示すのかもしれない、とも書きます。ただし、自分たちの成分分析では、支持されませんでした。
      # fact: heibayo-B40
      - 語り: 粘土の処理と配分は、別の班が受け持った可能性がある、と論文は書きます。分業があったとみられますが、班の分け方は、研究で、見方が分かれています。
      - 語り: 名前を刻んだ陶工、陵の工事に送られた刑徒、そして、指紋の主。陵のまわりには、いくつもの人の手が、残っています。
        tone: しみじみ
      - 語り: では、掘り出された像の、数のほうは、どうなのか。
        tone: 疑問
        hook: true

  # ================================================================ 第8章 8000体の勘定
  - title: 8000体の勘定　推算の中身
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    lines:
      # fact: heibayo-A32
      - 語り: 2024年12月、博物院の李岡院長は、央視のニュースで、こう説明しました。正確な数字は、ない、と。
        year: 2024
      # fact: heibayo-A32
      - 語り: 一号坑の面積と、出土の密度から、6000あまり。そこへ、二号坑、三号坑を足して、8000近くになる。社会に流れた8000は、ここから来たのかもしれない、と。
        figure: {type: stats, title: 坑ごとの広さと、推定の数, items: [[一号坑, 6000余, 約14260平方m], [二号坑, 1300余, 約6000平方m], [三号坑, 68, 約520平方m]], upto: 3}
      # fact: heibayo-A33
      - 語り: ただ、坑ごとの数字を足すと、6000あまりと、1300あまりと、68で、7368あまり。8000近く、という言い方は、この足し算を、丸めたものかもしれません。
        tone: 重い
      # fact: heibayo-A35
      - 語り: しかも、新華社は2019年に、すでに掘り出された陶俑と陶馬は、あわせて8000あまり、と書いています。院長の説明とは、食い違います。
        figure: null
      # fact: heibayo-A34
      - 語り: 実際に掘り出された数も、時点や数え方で、違います。シンガポールの記事は、2011年までに約1900体。ニュースサイトのシックス・トーンは、1000体あまり。光明網は、一号坑の推定の、約5分の1。
        tone: 重い
      # fact: heibayo-A34
      - 語り: 一号坑の第三次発掘は、2009年から2022年まで、約13年間で、陶俑が220あまり。広さは、一号坑の約《3パーセント》です。
      # fact: heibayo-A37
      - 語り: 発見から、2026年まで、52年。それでも、掘り終えてはいません。
      # fact: heibayo-A19
      - 語り: 一号坑の南には、空の坑も、あります。像が入るはずで、入れられなかった、未完成の坑と見られています。
      # fact: heibayo-C35
      - 語り: そして、始皇帝陵の本体は、今も、掘られていません。1997年の国務院の通知は、大型の帝王陵は、必要な技術の条件がそろうまで、発掘しない、としています。
        tone: しみじみ
      # fact: heibayo-A16
      - 語り: 博物院の名誉院長も、2026年9月、緊急の救出でなければ、陵は掘らない、と述べました。
      - 語り: 数えきれない兵士たちは、なぜ、地下に埋められたのか。いよいよ、言えることと、言えないことを、分けます。
        tone: 疑問
        hook: true

  - title: まとめ：なぜ兵馬俑は地下に埋められたのか
    background: {image: paintings/heibayo_ai_pit.jpg, credit: "AI生成画像（Google Gemini）による想像図"}
    lines:
      # fact: heibayo-A20
      - 語り: 確かなことから。この像の坑は、始皇帝陵のまわりに造られた、陪葬の坑、つまり、墓に添えて造られた坑の、一組です。
      # fact: heibayo-A20
      - 語り: 陪葬の坑は、陵のまわりで、180あまり見つかり、55基が、調べられています。
        tone: しみじみ
      # fact: heibayo-A07, heibayo-A08, heibayo-A10
      - 語り: そして、秦は、人を墓に従わせることを、長く続けた国でした。
        tone: しみじみ
      # fact: heibayo-A09, heibayo-A11, heibayo-A12
      - 語り: ひとつの見方もあります。献公が従死を止め、これに伴って、陶の俑が興った、と整理する論文があります。
      # fact: heibayo-A12
      - 語り: また、前漢の墓の専門家は、人の形のものを、儀式をして埋めれば、あの世で、人として仕える、と考えられていた、と説明します。ただし、秦の人の記録ではありません。
      - 語り: 言えないことも、あります。なぜ地下に埋めたのか、それを書いた史料は、確認できていません。人の代わりだった、とも、言い切れません。なぜ地下に、は、記録が語りません。
        tone: しみじみ
        pause: 0.8
      # fact: heibayo-A32, heibayo-B35
      - 語り: ほかにも、8000という数、顔が実在の兵士を写したものかどうか、最初に見つけた人の名は、まだ決まっていません。
        pause: 0.8
      - 語り: 史記が、書かなかった兵士たちは、2000年あまりのあと、井戸の底から、出てきました。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、なぜ地下に埋められたのだと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
