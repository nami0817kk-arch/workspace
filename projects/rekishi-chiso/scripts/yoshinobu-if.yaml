  - 聞き: 全部、ありそうに聞こえる……。理由は、ひとつじゃなくて、いくつも重なってたのかもね。
    tone: しみじみ
    figure: null
  - 語り: 慶喜は後年、鳥羽・伏見で開戦を抑えきれなかったことを「一期の失策」と振り返ったと伝わりますが、私たちは、その原典を確かめられていません。
