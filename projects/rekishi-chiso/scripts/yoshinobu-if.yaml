en:
  title: What If Tokugawa Yoshinobu Had Kept Fighting at Osaka Castle? | Japan After Toba-Fushimi
  description: 'On the night of the 6th day of the 1st month of Keio 4 (January 30, 1868), about 15,000 men of the old shogunate side were in Osaka Castle against roughly 5,000 from Satsuma and Choshu. Yoshinobu left that night with only four or five companions. This video asks: what if he had stayed?

    We keep records, theories and imagination apart. First, what the sources say: the numbers, the imperial brocade banner, the defections of Yodo and Tsu, the night of the 6th, and the competing explanations for why he left. Then, clearly marked imagination with reasons: Osaka Castle, the fleet and the foreign legations, Oguri Tadamasa''s pincer plan in the east, a table of what becomes of Enomoto, Katsu, Saigo and others, how Japan would differ, and the chains to modern Japan.

    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.

    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - '1868: The Night 15,000 Men Held a Castle'
  - 'December 1867: Yoshinobu Moves to Osaka'
  - 'January 3: 15,000 Against 5,000 - What the Numbers Mean'
  - 'January 5-6: The Brocade Banner and the Defections'
  - 'The Night of January 6: Yoshinobu Leaves the Castle'
  - Why Did He Leave? The Competing Theories
  - 'Imagination 1: The First Two Weeks at Osaka Castle'
  - 'Imagination 2: The Fleet in Osaka Bay and the Foreign Legations'
  - 'Imagination 3: Edo''s Hardliners and Oguri''s Pincer Plan'
  - 'Imagination 4: A Table of Fates - Who Becomes What?'
  - 'Imagination 5: How Japan Changes, and the Chains to Today'
  - 'Summary: A Map of the Night of January 6'
