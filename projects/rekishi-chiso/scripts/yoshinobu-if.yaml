  - 聞き: 錦の御旗が上がった瞬間に、朝敵だもんね。水戸の家の人なら、なおさら動けなくなりそう。
  - 語り: ふたつ目は、江戸で立て直す、という説。江戸には、兵も艦隊もありました。
    background: *id011
    portrait: *id010
    figure:
      type: stats
