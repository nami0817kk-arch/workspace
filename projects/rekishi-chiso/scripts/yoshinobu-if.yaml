# B（歴史の転換点の if ストーリー）の2本目。型：事実 → 史料に残る別の道 → 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/yoshinobu_if_facts.md（確実／有力／説／未確認の区分もそこ）。既存：yoshinobu_facts.md・akechi_if_facts.md
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節だけ ②字幕に「（想像）」（roles の慶喜想像・榎本想像・勝想像・西郷想像） ③記録のセリフ（第5節の「では、打ち立つぞ」）と同じ節では混ぜない
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。事実の部分は「分かっていません」と言う。
# 範囲は 史実（大坂城・1月6日の夜）→ なぜ城を出たか → 想像（大坂城・海と外国・江戸と東）→ 運命表 → 日本の変化点 → 現代の鎖。
# 数字は「何の数か」を言う（大坂に集まった総数／伏見方面に配置された数／戦死者の数）。日付は和暦（慶応4年）の月日。西暦は換算。慶応4年1月6日＝1868年1月30日。
# 使わない話：戦死者・負傷者の描写／小栗の斬首の描写／「馬印は置き忘れたのに愛妾は連れて」等の揶揄／大村益次郎が小栗の策を恐れた話／勝の「江戸焦土作戦」を事実として／「ドイツが北海道を植民地化」／ネットの「勝てた」論／大坂城を「難攻不落」と断定すること。
