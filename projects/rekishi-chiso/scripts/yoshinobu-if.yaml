      - - 列強の介入を恐れた
        - 説
        - 本人の後年の言い分
      upto: 1
  - 語り: 出どころは、光圀以来とも、斉昭の教えとも言われます。
    figure:
      type: stats
      title: 城を出た理由の説（その1）
      items:
