terms:
  錦の御旗: 天皇の軍であることを示す旗。掲げた側が朝廷の軍とされた
  局外中立: 内乱の両方を交戦団体とみなし、外国が手を出さないこと
  辞官納地: 官職と領地を朝廷に返すこと。慶喜に求められた
  王政復古: 慶応3年12月9日（1868年1月3日）、天皇中心の政府に戻すと宣言
  開陽丸: オランダで造られた木造の蒸気軍艦
  挟み撃ち案: 小栗忠順の作戦。箱根の陸軍と駿河湾の艦隊で挟む
  交戦団体: 内乱で、国の政府と同じように扱われる側
  慶応の改革: 慶喜の幕政改革。洋式陸軍や横須賀製鉄所が進んだ
