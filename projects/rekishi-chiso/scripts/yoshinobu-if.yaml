- title: 想像① 慶喜が残ったら 大坂城の最初の2週間
  background: *id001
  year: 1868
  lines:
  - 語り: ここから先は、想像です。仮定は、ひとつだけ。1月6日の夜、慶喜は大坂城に残り、裏の門から出ません。
    portrait: *id004
    card:
      head: ここから想像
      body: 慶喜は大坂城に残る
    short: s3
  - 聞き: 総大将が、城にいる。それだけで、何が変わるの？
    short: s3
  - 語り: まず、城です。大坂城は、江戸時代の城で、内堀、外堀と石垣は、健在でした。本丸の東側の石垣は、堀底から約32メートル。天守は、1665年の落雷で、すでにありません。
    figure:
      type: stats
      title: 江戸時代の大坂城
      items:
      - - 本丸東面の石垣
        - 約32m
        - 堀底から
      - - 本丸の三重やぐら
        - 11基
        - 1月9日に焼失
      - - 天守
        - なし
        - 1665年に落雷で焼失
  - 聞き: 守りは固そうだけど、兵糧とか弾薬は？
    figure: null
  - 語り: そこは、数字が見つかりませんでした。城の兵糧、弾薬、大砲の数は、今回の調査では、分かっていません。事実として言えるのは、金が約18万両あったことまでです。
    background: *id012
  - 語り: 想像は、ここからです。新政府軍は、開戦時で約5千。増援は来ますが、32メートルの石垣と水堀を、力ずくで攻める数ではありません。大坂城は、2週間では落ちません。
    background: *id001
    card:
      head: ありうる
      body: 大坂城は2週間では落ちない
  - 聞き: 城に詳しい人は、どう見てるの？
  - 語り: 噺家で城マニアの春風亭昇太さんは、慶喜が籠城していたら、落城させられなかったと思う、と語っています。個人の感想で、兵力の数字は示されていません。
    background: *id012
  - 語り: 反対の見方もあります。堅城でも、兵も食料も弾薬も、指揮も、地元の協力も要る。味方の藩が離れれば、一つの城では、広い戦に勝てない、という解説です。
    background: *id001
  - 聞き: 城は持っても、戦争に勝てるとは限らない、ってことか。城が持つかどうかと、戦争に勝つかどうかは、別の話なんだね。
  - 語り: ここから、想像劇場、第1幕です。1月7日の朝、大坂城の大広間。榎本武揚が、金を積んだ船ではなく、艦隊を率いて、慶喜の前に現れます。
    background: *id003
    card:
      head: 想像劇場 第1幕
      body: 1月7日 大坂城の大広間
    short: s3
  - 人物: 「上様、榎本、ただいま戻りました。開陽は、大坂湾に出ております」
    who: 榎本想像
    portrait: *id013
    short: s3
  - 人物: 「榎本、よく戻った。城は、わしが守る。海は、そなたに任せる」
    who: 慶喜想像
    portrait: *id010
    short: s3
  - 人物: 「承知いたしました。天保山沖で、薩摩の船を一隻も通しませぬ」
    who: 榎本想像
    portrait: *id013
    short: s3
  - 聞き: おお、ちゃんと役割分担してる。……でも、津と淀は、もう敵に回ってるんだよね。
    portrait: null
    short: s3
  - 語り: はい。これは、想像でも変わりません。津も淀も彦根も、すでに新政府側です。大坂城の北と東は、新政府側の藩に囲まれます。
    background: *id007
  - 聞き: お金のほうは？ 戦いが長引いたら、どっちが先に苦しくなるの？
  - 語り: 大商人は、勢力に応じて立場を変えました。小野組と島田組は、旧幕府の為替の御用から、新政府の御用へ移っています。
    background: &id014
      image: paintings/yoshinobu_tokugawa_warships_shinagawa.png
      credit: 小杉雅之進 幕府軍艦八隻の品川沖出帆の図（1868年）
  - 語り: 想像です。大坂城が落ちなければ、様子を見る商人が増えて、新政府の金は集まりにくくなります。
    background: *id001
    card:
      head: ありうる
      body: 新政府の金は集まりにくくなる
    hook: true
  - 聞き: お金も、勝ちそうな側に流れていくんだ。……海のほうは、どうなるの？
    hook: true
- title: 想像② 大坂湾の艦隊と外国の公使たち
  background: &id015
    image: paintings/yoshinobu_kaiyo_maru_konb_4519.jpg
    credit: 開陽丸の石版画（1866年）
  year: 1868
  lines:
  - 語り: 海です。開陽丸は、オランダで造られた木造の蒸気フリゲートで、満載排水量は約2,590トン。1月4日の阿波沖海戦では、薩摩の軍艦を追って、旧幕府側が優位に立ちました。
    card:
      head: 開陽丸
      body: 約2,590トン
  - 聞き: 海では、旧幕府のほうが強かったんだ。陸で押されても、海なら有利、ってことか。
  - 語り: 旧幕府の艦隊は、のちに品川を出たときの数で、蒸気軍艦8隻、乗員2,000余名。薩摩も、幕府に次ぐ西洋艦の買い手でした。
    background: *id014
    card:
      head: 旧幕府艦隊
      body: 蒸気軍艦8隻・2,000余名
  - 語り: 史実では、阿波沖海戦のあと、近畿の海は新政府側に移りました。ここでは、慶喜が大坂に残っています。
    background: &id016
      image: paintings/yoshinobu_enomoto_fleet_1868.png
      credit: 榎本艦隊の写真（1868〜69年）
  - 語り: 想像です。開陽丸を中心にした榎本の艦隊が、大坂湾の入り口、天保山沖を押さえます。西国から大坂へ向かう新政府の船は、湾に入れません。
    background: *id015
    card:
      head: ありうる
      body: 艦隊が大坂湾の入り口をふさぐ
  - 聞き: じゃあ、新政府軍の兵や武器は、陸の道で運ぶしかないんだ。
  - 語り: そうなります。近畿以西の諸侯は急速に新政府に従った、と辞典は書きます。ただ、それは新政府が勝ったからです。大坂城が落ちず、海もふさがれていれば、様子を見る藩が増えます。
    background: *id016
    figure:
      type: map
      title: 新政府の本国から大坂城まで（直線）
      bounds:
      - 129.6
      - 140.4
      - 31.0
      - 36.4
      places:
      - - 鹿児島
        - 130.56
        - 31.6
      - - 山口
        - 131.47
        - 34.19
      - - 大坂城
        - 135.52
        - 34.69
      - - 江戸
        - 139.77
        - 35.68
      route:
      - 鹿児島
      - 山口
      - 大坂城
      note: 山口から約380km、鹿児島から約580km
  - 聞き: 薩摩と長州の本国は、遠いもんね。補給が止まったら、持久戦は苦しいはず。
    figure: null
  - 語り: ここで、外国です。兵庫と大坂は、慶応3年12月7日、西暦の1868年1月1日に外国に開かれたばかりで、各国の公使団も近くにいました。
    background: *id015
  - 語り: 史実では、1月25日、イギリス、アメリカ、フランス、オランダ、イタリア、プロイセンの6か国が、新政府と旧幕府を、戦う二つの側を、どちらも正式な当事者として扱います。
    card:
      head: 1月25日（2月18日）
      body: 6か国が局外中立を宣言
  - 語り: 内乱が終わるまで手を出さない、という宣言です。局外中立です。
    background: *id001
  - 聞き: 外国は、どっちの味方もしないって、宣言したんだ。でも、宣言しただけで、本当に何もしなかったのかな。
  - 語り: 慶喜が大坂城で戦っていても、この宣言は変わりません。札は、ありうる、です。
    card:
      head: ありうる
      body: 局外中立の宣言は変わらない
  - 聞き: 外国は、どっちが勝つか、様子を見てたってことだよね。慶喜が残っても、それは同じなんだ。
  - 語り: ただし、武器を売る商人は、どちらにも売り続けました。イギリスのグラバー、プロイセンのスネル兄弟です。局外中立は、建前でした。
    background: &id021
      image: paintings/yoshinobu_beato_yokohama_1865.jpg
      credit: F.ベアト 横浜の運河と家並（1865年）
  - 聞き: じゃあ、外国が戦争に加わる、はないの？ ロッシュはフランスの公使でしょ。フランスが後ろにいるなら、ありそうなのに。
    tone: 疑問
  - 語り: 英国とフランスが、日本で代理戦争をする。これを論じた研究は、見つかりませんでした。
    background: *id001
    portrait: &id022
      image: paintings/yoshinobu_leon_roches_1865.jpg
      caption: レオン・ロッシュ（1865年ごろ）
      age: false
  - 語り: 想像で言えば、ロッシュ個人が援助を続ける、まではありうる。本国から帰国の命令が出ていたので、本格的な介入は、ほぼ妄想です。
    card:
      head: ほぼ妄想
      body: 英仏の本格的な介入
  - 聞き: 外国は助けてくれない。……じゃあ、東は？
    background: *id012
    portrait: null
    hook: true
  - 語り: 江戸には、徹底抗戦を唱える人たちがいました。
    hook: true
- title: 想像③ 江戸の主戦派と、小栗忠順の挟み撃ち
  background: *id012
  year: 1868
  lines:
  - 語り: 次は、東です。史実では、1月12日、江戸城の評定で、小栗忠順、大鳥圭介らが、徹底抗戦を主張しました。
    card:
      head: 1月12日（2月5日）
      body: 江戸城の評定で徹底抗戦を主張
  - 聞き: 慶喜がいなくても、江戸の人たちは、戦う気だったの？
    tone: 疑問
  - 語り: 1月12日の評定で、財政と軍制改革を担った幕臣の小栗忠順が唱えた作戦は、こうです。箱根を下りた新政府軍を、陸軍で迎え撃つ。
    background: &id017
      image: paintings/yoshinobu_keiheitai.jpg
      credit: 幕府の軽兵隊（1864〜65年）
    figure:
      type: map
      title: 小栗の挟み撃ち案
      bounds:
      - 137.6
      - 140.4
      - 34.4
      - 36.2
      places:
      - - 江戸
        - 139.77
        - 35.68
      - - 小田原（箱根の下り口）
        - 139.16
        - 35.26
      - - 駿府（駿河湾）
        - 138.38
        - 34.97
      route:
      - 江戸
      - 小田原（箱根の下り口）
      - 駿府（駿河湾）
      note: 陸軍で迎え撃つ、艦隊で補給を断つ
    short: s4
  - 語り: 同時に、榎本の艦隊を駿河湾へ入れ、後続の補給部隊を砲撃する。挟み撃ちです。
    short: s4
  - 聞き: 作戦としては、筋が通ってる気がする。敵を細い道で止めて、後ろの補給を海から断つ、ってことでしょ。
    figure: null
  - 語り: 通る条件は、ひとつ。大坂で、時間を稼ぐことです。慶喜が大坂城に残れば、新政府軍は、西と東の二つの戦線を持つことになります。
    background: *id012
    short: s4
  - 語り: 想像です。ただ、この挟み撃ちは、成功しにくい。作戦に要る艦隊は、大坂湾に張りついていて、駿河湾へ回せないからです。
    background: *id017
    card:
      head: ありうる
      body: 挟み撃ちは成功しにくい
    short: s4
  - 語り: 想像です。新政府は、東海道、東山道、北陸道の3軍を東へ向けながら、大坂城も囲まなければなりません。兵は分かれ、戦いは、史実より長引きます。
    background: *id011
    card:
      head: ありうる
      body: 新政府は二つの戦線を持つ
    short: s4
  - 聞き: 5千で始めた戦いが、あちこちに広がっちゃうんだ。じゃあ、江戸は誰が守るの？
  - 語り: 想像劇場、第2幕です。江戸、薩摩藩邸。史実では3月に、勝海舟と西郷隆盛が会談して、江戸総攻撃は止まりました。ここでは、慶喜が大坂で戦っています。
    background: *id012
    portrait: &id018
      image: paintings/yoshinobu_katsu_kaishu.jpg
      caption: 勝海舟（1899年以前）
      age: false
    card:
      head: 想像劇場 第2幕
      body: 江戸 薩摩藩邸 勝と西郷
  - 人物: 「西郷さん。江戸で戦えば、民の暮らしが焼かれる。大坂の決着を待って、刀を収められぬか」
    who: 勝想像
    portrait: *id018
  - 人物: 「勝さん。大坂が落ちておらん以上、江戸を見逃せば、背中を突かれもす」
    who: 西郷想像
    background: *id011
    portrait: &id019
      image: paintings/yoshinobu_saigo_takamori.jpg
      caption: 西郷隆盛（肖像画）
      age: false
  - 人物: 「ならば、江戸を戦場にせず、双方の損の少ない道を探そう」
    who: 勝想像
    portrait: *id018
  - 聞き: 勝海舟、したたかだなあ。西郷は、うなずくの？
    portrait: null
  - 語り: 想像では、うなずきません。大坂が落ちていない以上、新政府は、江戸を押さえるしかない。無血開城は、起きません。江戸は、戦場になります。
    background: &id023
      image: paintings/yoshinobu_ueno_yoshitora_1868.jpg
      credit: 歌川芳虎 上野戦争の錦絵（1868年）
    card:
      head: ありうる
      body: 江戸は戦場になる
  - 聞き: 江戸が戦場に……。街が焼ける想像は、きついなあ。
    tone: しみじみ
  - 語り: 想像でも、細かい描写はしません。ただ、鳥羽・伏見から始まる内戦を戊辰戦争といいますが、史実では約1年5か月。それが、もっと長くなります。札は、ありうる、です。
    hook: true
  - 聞き: 長くなった戦争で、あの人たちは、どうなるの？
    hook: true
