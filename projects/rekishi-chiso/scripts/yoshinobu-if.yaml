sections:
- title: 1868年1月30日の夜 1万5千人の城
  background: &id001
    image: paintings/yoshinobu_osaka_palace_butt_1868.jpg
    credit: J.H.バット《Tycoon's Palace, Osaka》1868年1月（水彩）
  year: 1868
  lines:
  - 語り: 慶応4年1月6日、1868年1月30日の夜。大坂方面には、旧幕府側の兵が、総数でおよそ1万5千集まっていました。攻めてくる薩長の兵は、開戦時でおよそ5千です。
    card:
      head: 1868年1月30日
      body: 旧幕府軍 約1万5千（総数）
    short: s1
  - 語り: その夜、総大将の徳川慶喜は、幕府の大臣にあたる老中や、藩主たち、4、5人だけを連れて、大坂城を出ます。向かった先は、海の上の軍艦でした。
    background: &id008
      image: paintings/yoshinobu_escape_yoshitoshi.jpg
      credit: 月岡芳年 慶喜が大坂湾の小舟から軍艦へ（1877年ごろ）
    short: s1
  - 聞き: 3倍の兵が集まった大坂の城を、総大将が、夜のうちに出ちゃったの？
    tone: 驚き
    short: s1
  - 語り: そして3日後。誰も攻めないまま、大坂城は燃えました。本丸御殿も、やぐらも、ほとんどが焼けています。
    background: *id001
    short: s1
  - 聞き: 守る人がいなくなった城、ってことか……。
    tone: しみじみ
    short: s1
  - 語り: もし、慶喜が城に残って、戦い続けていたら。日本は、どうなっていたのでしょうか。今日は、その先を掘ります。
    background: &id003
      image: paintings/yoshinobu_osaka_defense_kiyochika.jpg
      credit: 小林清親 錦絵 馬上の一橋慶喜公（1870年代）
    portrait: &id009
      image: paintings/yoshinobu_portrait_1867_full.jpg
      caption: 徳川慶喜（フランス式軍装、1867年）
      age: false
    short: s1
  - 聞き: 歴史に「もしも」はない、ってよく聞くけど……慶喜が残ってたら、って、一回は考えたくなるよね。ちゃんと掘れるの？
    tone: 疑問
  - 語り: 掘れます。問いは3つ。大坂城は、落ちたのか。江戸は、無血開城できたのか。日本は、二つに割れたのか。
    background: *id001
    card:
      head: 今日の3つの問い
      body: 大坂城は？ 江戸は？ 日本は？
  - 聞き: 3つ目、いきなりスケールが大きいんだけど。
    tone: 驚き
  - 語り: 遠くへ行くほど、妄想に近づきます。だから約束は2つ。事実と想像は分ける。想像のあいだは《ここから想像》の札を出して、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background: &id002
      image: paintings/yoshinobu_kimbei_mikado_garden.jpg
      credit: 日下部金兵衛 京都御所（1890年ごろ）
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
  - 聞き: 研究者は、この「もしも」を論じてないの？
    tone: 疑問
  - 語り: 慶喜が戦い続けた場合を正面から論じた学術研究は、今回の調査では、見つかりませんでした。
    background: *id001
  - 聞き: じゃあ、何を材料に掘るの？ 全部、妄想になっちゃわない？
    tone: 疑問
  - 語り: 材料は、当時の人が実際に考えていた選択肢です。大坂城に拠る。江戸で迎え撃つ。ロッシュの勧めに乗る。戦わずに従う。この4つだけを、事実と組み合わせます。
  - 聞き: 材料が本物なら、安心して妄想できる。まずは、慶喜が大坂城に来るまでから、掘ろう。
- title: 慶応3年12月 慶喜は大坂城へ
  background: *id002
  year: 1867
  lines:
  - 語り: 話は、年の暮れにさかのぼります。慶応3年12月9日。王政復古の大号令が出て、慶喜は、官職と領地を差し出すことになりました。辞官納地です。
    portrait: &id010
      image: paintings/yoshinobu_portrait_shogun.jpg
      caption: 徳川慶喜（将軍時代）
      age: false
    card:
      head: 1868年1月3日
      body: 王政復古の大号令
  - 聞き: 将軍だった人が、官職も領地も差し出すの？ 会社でいえば、社長を降ろされて、持ち株まで手放せ、って言われたようなものだよね。きびしい……。
    tone: 驚き
  - 語り: 慶喜は、京都の二条城から、大坂城へ移ります。会津や桑名の兵、幕府の将士も、大坂に集まりました。
    background: *id003
    portrait: &id004
      image: paintings/yoshinobu_portrait_sutton_osaka_1867.jpg
      caption: 徳川慶喜（大坂城で撮影、F.サットン、1867年）
      age: false
    card:
      head: 慶応3年12月
      body: 慶喜が大坂城へ移る
  - 聞き: なんで、わざわざ大坂なの？ 京都にいたほうが、朝廷に近くない？
  - 語り: 大坂は、京都から直線で約39km。港も近く、外国の公使たちもいました。京都の動きを見ながら、朝廷に働きかけて、薩摩を除こうとした、と見られています。
    figure:
      type: map
      title: 大坂城のまわり
      bounds:
      - 134.6
      - 140.3
      - 34.2
      - 36.3
      places:
      - - 大坂城
        - 135.52
        - 34.69
      - - 京都
        - 135.77
        - 35.01
      - - 兵庫
        - 135.19
        - 34.69
      - - 江戸
        - 139.77
        - 35.68
      route:
      - 京都
      - 大坂城
      note: 大坂城から京都まで、直線で約39km
  - 聞き: 戦う気で来たっていうより、立て直しの拠点だったんだね。京都ににらみをきかせつつ、海にも近い場所、ってことか。
    figure: null
  - 語り: イギリス公使のパークスは、大坂で慶喜に会っています。パークスは、慶喜を、今まで会った日本人の中で最もすぐれた人物、と評したと伝わります。時期は、確かめられていません。
    background: *id001
    portrait: *id004
  - 聞き: 外国の公使にまで、そこまで評価されてたんだ。じゃあ、慶喜は、期待されてた人だったんだね。
  - 語り: ところが12月25日、江戸で、薩摩側に浪人の引き渡しを拒まれた末、庄内藩士らが薩摩藩邸を焼き討ちします。報せは28日に大坂へ届き、「薩摩討つべし」の声が、一気に高まりました。
    background: &id011
      image: paintings/yoshinobu_beato_yedo_inner_moat.jpg
      credit: F.ベアト 江戸城の内濠（1863〜73年）
    portrait: null
    card:
      head: 12月25日
      body: 江戸の薩摩藩邸を焼き討ち
  - 聞き: 火に油、だ。慶喜は、止めなかったの？ 総大将なら、止められそうなのに。
  - 語り: 慶喜は当初、こちらから戦を挑まないよう、諸隊を抑えていました。
  - 語り: ところが、老中の板倉勝静らが、従わなければ兵が慶喜を刺してでも脱走しかねない、と訴え、慶喜は抑えきれなかった、といいます。
    background: *id003
    portrait:
      image: paintings/yoshinobu_itakura_katsukiyo.jpg
      caption: 板倉勝静
      age: false
  - 聞き: 総大将なのに、兵を止められなかったんだ……。部下に突き上げられて、動くしかなかった、ってことか。
    tone: しみじみ
  - 語り: 慶応4年1月2日、旧幕府軍は、大坂を出て京都へ北上します。慶喜本人は、風邪を理由に、寝室から出ず、軍装もしなかった、という話です。
    portrait: *id004
    card:
      head: 1868年1月26日
      body: 旧幕府軍が京都へ北上
  - 聞き: 大将が風邪で寝てる軍って……。それで、どうなったの？
    tone: 疑問
    hook: true
  - 語り: 翌日の1月3日、鳥羽と伏見で、戦いが始まりました。
    hook: true
- title: 1月3日 鳥羽・伏見 1万5千と5千の中身
  background: &id005
    image: paintings/yoshinobu_toba_fushimi_screen.jpg
    credit: 鳥羽伏見の戦いの黒白図（1868年）
  year: 1868
  lines:
  - 語り: 戦いが始まったのは、正月の3日。西暦では、1868年1月27日です。
    card:
      head: 1868年1月27日
      body: 鳥羽・伏見の戦い
  - 語り: ここで、数の話をします。旧幕府軍は、大坂に集まっていた総数で、およそ1万5千。新政府軍は、開戦時の概数で、およそ4,500から5千です。
    figure:
      type: bars
      title: 開戦時の兵力（概数）
      bars:
      - - 旧幕府軍
        - 15000
      - - 新政府軍
        - 5000
      labels:
      - 約1万5千
      - 約5千
  - 聞き: 3倍も違うの？ それなら、楽勝じゃない？ 数だけで見たら、旧幕府の圧勝でしょ。
    tone: 驚き
  - 語り: 数の種類に、気をつけてください。戦場で向き合った数は、もっと少なくなります。たとえば伏見方面は、旧幕府軍およそ4,000に対して、新政府軍およそ1,200です。
    background: &id006
      image: paintings/yoshinobu_toba_aizu_fushimi.jpg
      credit: 会津藩兵、伏見に上陸（1868年1月）
    figure:
      type: bars
      title: 伏見方面に配置された数
      bars:
      - - 旧幕府軍
        - 4000
      - - 新政府軍
        - 1200
      labels:
      - 約4千
      - 約1千2百
  - 聞き: 伏見でも、3倍以上……。なのに、負けたの？
    figure: null
  - 語り: 旧幕府軍は、行軍の隊列のまま、小銃に弾を込めていない状態で、攻撃を受けた、とされます。鳥羽街道は、狭い街道でした。
    background: *id005
  - 聞き: 弾を込めてない行軍って、戦う用意をしてないのと同じじゃん。まさか攻撃されるとは、思ってなかったのかな。
    tone: 驚き
  - 語り: 装備にも、差がありました。英語圏の概説では、長州が最良、次に幕府の歩兵、薩摩。会津と、多くの譜代藩は、その下とされています。
    background:
      image: paintings/yoshinobu_toba_toyogobashi.jpg
      credit: 「豊進図」豊後橋の戦い（錦絵、1870年ごろ）
  - 聞き: 数が多いだけじゃ、勝てないんだ。銃も大砲も指揮も、全部そろってないと、数は力にならないんだね。
  - 語り: 『会津戊辰戦史』は、敗因を3つ挙げた、と紹介されています。統一した指揮がなかったこと。狭い鳥羽街道に兵を集めすぎたこと。京都の情勢を見誤ったこと。
    background: &id007
      image: paintings/yoshinobu_toba_tominomori.jpg
      credit: 富ノ森の戦い（黒白図、1868年）
    card:
      head: 敗因 3つ
      body: 指揮・街道・京都の情勢
  - 聞き: 3つとも、戦う前の準備と、頭の中の問題だよね。始まる前に、半分は負けてたってことか。
  - 語り: 戦死者は、新政府軍が112人、旧幕府軍が278人。旧幕府軍のほうが多いのです。ただ、この戦いの行方は、戦場の外で、決まっていきます。
    figure:
      type: bars
      title: 戦死者の数
      bars:
      - - 旧幕府軍
        - 278
      - - 新政府軍
        - 112
      labels:
      - 278人
      - 112人
  - 聞き: 戦場の外って、どういうこと？
    tone: 疑問
    figure: null
    hook: true
  - 語り: 1月5日。戦場に、一本の旗が上がりました。
    hook: true
- title: 1月5日・6日 錦の御旗と寝返り
  background:
    image: paintings/yoshinobu_toba_banner_1868.jpg
    credit: 錦の御旗（1868年）
  year: 1868
  lines:
  - 語り: 1月5日、1868年1月29日。前線に、錦の御旗が上がります。赤地に金の日と銀の月を描いた、天皇の軍の旗です。
    background: *id006
    portrait:
      image: paintings/yoshinobu_toba_banner_1868.jpg
      caption: 錦の御旗（1868年）
      age: false
    card:
      head: 1868年1月29日
      body: 錦の御旗が上がる
  - 聞き: 旗が上がると、何が変わるの？ ただの旗でしょ、って思っちゃうんだけど。
  - 語り: 旗を掲げた側が、朝廷の軍です。向き合った側は、朝敵、つまり朝廷の敵になります。
  - 聞き: 同じ日本人どうしなのに、旗1本で、立場が逆になっちゃうんだ。さっきまで味方だった人が、いきなり敵、ってこともあるよね。
    tone: 驚き
  - 語り: この旗は、岩倉具視と薩摩藩が、前もって用意したものです。偽物だという説もありますが、朝廷が許して掲げた、とも書かれます。ここでは、「前もって用意した」までを、事実にします。
    background: *id007
    portrait:
      image: paintings/yoshinobu_iwakura_tomomi.jpg
      caption: 岩倉具視
      age: false
  - 聞き: 本物かどうかより、旗が出たことで、みんなが動いた、ってことだね。信じた人が動いたら、本物でも偽物でも、同じ力になっちゃう。
    portrait: null
  - 語り: まず淀。1月5日、淀藩は、退却してきた旧幕府軍の入城を拒みます。藩主の稲葉正邦は、老中として江戸にいました。
    background: *id005
    figure:
      type: stats
      title: 離れていった藩
      items:
      - - 彦根藩
        - 新政府側に
        - 1月4日ごろ
      - - 淀藩
        - 入城を拒む
        - 1月5日
      - - 津藩
        - 味方を砲撃
        - 1月6日
      upto: 2
  - 語り: 翌6日の午前11時ごろ。山崎を守っていた津藩の藤堂勢が、高浜砲台から、旧幕府軍を砲撃します。味方だったはずの藩が、後ろから撃ってきたのです。
    figure:
      type: stats
      title: 離れていった藩
      items:
      - - 彦根藩
        - 新政府側に
        - 1月4日ごろ
      - - 淀藩
        - 入城を拒む
        - 1月5日
      - - 津藩
        - 味方を砲撃
        - 1月6日
  - 聞き: 後ろから撃たれたら、前線は総崩れだよね……。数や装備だけじゃなくて、味方の寝返りも、大きかったんだ。
    tone: 驚き
    figure: null
  - 語り: 旧幕府軍は、山崎で総崩れになりました。のちに慶喜は、朝廷が薩長の行動を認めたことと、錦旗が、自分の戦意を砕いた、と述べたと伝わります。後年の言い分です。
    background: *id003
    portrait: *id004
  - 聞き: 戦いより先に、心が折れてたんだ。
    tone: しみじみ
    hook: true
  - 語り: ここまでが、昼の話です。この夜、大坂城の大広間で、何が起きたのか。
    hook: true
- title: 1月6日の夜 慶喜は城を出た
  background: *id001
  year: 1868
  lines:
  - 語り: 慶応4年1月6日の夜。大坂城の大広間に、諸隊長が集まります。慶喜に、出馬を求めたのです。
    portrait: *id004
    card:
      head: 1月6日の夜
      body: 大広間で出馬を求められる
    short: s2
  - 語り: このとき慶喜は、こう答えたと伝わります。
    short: s2
  - 人物: 「では、打ち立つぞ」
    who: 慶喜の言葉
    short: s2
  - 聞き: やる気だ。……じゃあ、なんで？
    tone: 疑問
    short: s2
  - 語り: この夜、会津藩士の神保修理が建言し、若年寄の永井尚志も賛同した、といいます。ただし、建言の中身は、確かめられていません。
    background: *id003
    portrait: null
  - 聞き: 中身が分からないのが、もどかしいなあ。誰かが、背中を押したってことだよね。
  - 語り: 諸隊長が持ち場へ戻ったあと、慶喜は、裏の門から城を出ます。同行は、老中の板倉勝静と酒井忠惇、会津藩主の松平容保、桑名藩主の松平定敬ら、4、5人でした。
    background: *id001
    portrait: *id004
    card:
      head: 同行は4、5人
      body: 老中2人・藩主2人ほか
  - 聞き: 兵には、何も言わずに？ 兵は、まだ大勢いたんじゃないの？
    tone: 驚き
  - 語り: 容保は、家臣に知らせる間もなかった、といいます。
    background: *id008
    portrait: &id020
      image: paintings/yoshinobu_matsudaira_katamori.jpg
      caption: 松平容保（1863年）
      age: false
    short: s2
  - 語り: 慶喜は、大坂湾へ出て、軍艦を探しました。
    portrait: *id009
    short: s2
  - 語り: 旧幕府の最新の軍艦、開陽丸は、このとき見つかりません。艦長の榎本武揚は上陸中で、不在でした。慶喜は、まず米国の軍艦に乗り、そのあと開陽丸に移った、と伝わります。
    background:
      image: paintings/yoshinobu_kaiyo_maru_dordrecht_1866.png
      credit: 開陽丸（ドルドレヒト、1866年）
    card:
      head: 開陽丸
      body: 艦長の榎本は不在
  - 聞き: 艦長のいない船で、逃げたのか……。榎本さんは、そのあと、どうしたの？
    tone: しみじみ
  - 語り: 翌7日、慶喜に追討令が出て、官位は剥奪されます。榎本は、大坂城に入りましたが、慶喜は、もういませんでした。榎本はのち、城にあった金およそ18万両を、船で江戸へ運びます。
    background: *id001
    portrait: &id013
      image: paintings/yoshinobu_enomoto_portrait.jpg
      caption: 榎本武揚（晩年）
      age: false
    card:
      head: 1月7日
      body: 追討令。榎本が大坂城へ入る
  - 聞き: 城に残された人たちは、将軍がいなくなったことを、いつ知ったの？ 朝起きて社長がいなかったら、ふつうに終わりじゃん。
    portrait: null
  - 語り: 将軍の退去を知らされていなかった城内は、大混乱になりました。
    background: &id024
      image: paintings/yoshinobu_choshu_modern_troops_1865.jpg
      credit: 第二次長州征討の幕府洋式部隊の絵巻（1865年）
    portrait: null
  - 語り: そして1月9日、新政府軍の長州軍が、空の城を受け取るとき、本丸御殿の台所から出火します。
    background: *id001
    card:
      head: 1月9日（2月2日）
      body: 大坂城が燃える
    short: s2
  - 語り: 本丸御殿も、三重のやぐら11基も、ほとんどが焼けました。誰も攻めなかったのに、燃えたのです。
    short: s2
  - 聞き: あーし、ちょっと信じられない。守る人がいなくなった城って、こうなるんだ……。
    tone: しみじみ
    short: s2
    hook: true
  - 語り: では、慶喜は、なぜ城を出たのでしょうか。
    hook: true
- title: 慶喜はなぜ城を出たのか 分かれる説
  background: *id002
  year: 1868
  lines:
  - 語り: 決め手になる史料は、ありません。主な説を並べます。確かさは、画面の札で示します。
    background: *id002
    portrait: *id010
    card:
      head: なぜ城を出たのか
      body: 決め手になる史料はない
  - 聞き: 本人は、なんて言ってるの？
  - 語り: 慶喜は後年、京へ兵を送るつもりはなかった、と語っています。ただ、自分に都合のいい弁明の面もあるので、割り引いて聞く必要があります。
  - 語り: ひとつ目は、朝敵になりたくなかった、という説です。水戸藩には、幕府に背いても朝廷に弓を引いてはならない、という教えがあった、といいます。
    background: &id012
      image: paintings/yoshinobu_beato_yedo_castle_moat.jpg
      credit: F.ベアト 江戸城の濠と櫓（1863〜68年）
    portrait:
      image: paintings/yoshinobu_nariaki_portrait.jpg
      caption: 徳川斉昭
      age: false
    figure:
      type: stats
