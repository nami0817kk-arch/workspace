  - 聞き: 近いところほどしっかりしてて、遠くなるほど妄想になる。札で見せてたの、こういうことか。
    figure: null
  - 語り: ただし、全部、想像です。史実で言えることは、はっきりしています。1月6日の夜、総大将は大坂城を出ました。大坂に集まっていた旧幕府側は約1万5千、薩長は約5千でした。
    background: *id003
  - 語り: 戦い続けた世界は、誰にも分かりません。ただ、戦わなかった世界は、記録に残っています。江戸城は、5月3日に、戦わずに明け渡されました。
    background: *id012
  - 聞き: どっちが正しかったかは、決められないよね。逃げたって言う人もいれば、街を救ったって言う人もいるし。
  - 語り: 渋沢栄一は、慶喜を、明治維新最大の功績者の一人と評しました。一方で、当時は「敵前逃亡」と非難されました。評価は、割れたままです。
    portrait:
      image: paintings/yoshinobu_portrait_late_14.jpg
      caption: 徳川慶喜（晩年）
      age: false
  - 語り: その慶喜は、そのあと45年生きました。静岡では、写真を撮って過ごしたと伝わります。飼い猫の写真も残っています。
    background:
      image: paintings/yoshinobu_cat_photo.jpg
      credit: 徳川慶喜が撮影した写真（飼い猫）
    card:
      head: 慶喜が撮影した写真
      body: 飼い猫
  - 聞き: 最後は、写真を撮って暮らしたんだね。逃げたのか、守ったのか……。あーしは、あの夜の4、5人が、どんな顔をしてたのか、気になるなあ。
    tone: しみじみ
  - 語り: 分かれ道を一つ挙げるなら、1月6日の夜、大広間から裏の門までの、短い道のりでした。
    background: *id001
    portrait: null
  - 語り: 今日の地層は、ここまでです。
  - 聞き: 次の「もしも」は、誰の、どの分かれ道かな。
    tone: 疑問
  - 語り: あなたが気になる、歴史の分かれ道を、コメントで教えてください。
  - 二人: また一緒に、掘りましょう！
    tone: 明るい
