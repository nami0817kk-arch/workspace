  - 語り: みっつ目は、内乱が長引けば、清やインドのように、列強に侵食される、と恐れた、という説です。ただしこれは、慶喜自身の言い分で、研究者の評価ではありません。
    background: *id003
    figure:
      type: stats
      title: 城を出た理由の説（その1）
      items:
      - - 朝敵を恐れた
        - 有力
        - 水戸家の教え
      - - 江戸で立て直す
        - 説
        - 江戸に兵と艦隊
      - - 列強の介入を恐れた
        - 説
        - 本人の後年の言い分
  - 聞き: 本人の言い分と、研究者の評価は、別物なんだね。本人が言うことを、そのまま信じたら、危ないんだ。
    figure: null
  - 語り: よっつ目は、天皇の権威に支えられた政権が、権威を別の所に移されて、居場所を失った、と見る近年の研究です。
