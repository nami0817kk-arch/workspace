- title: まとめ：1月6日の夜 分かれ道の地図
  background: *id001
  year: 1868
  lines:
  - 語り: 冒頭の3つの問いに、順に答えます。1つ目。大坂城は、落ちたのか。想像では、少なくとも2週間は、落ちません。これは、ありうる話です。
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 大坂城は？
        - 落ちない
        - ありうる
      - - 江戸は？
        - 戦場になる
        - ありうる
      - - 日本は？
        - 東西に割れる
        - ほぼ妄想
      upto: 1
  - 語り: 2つ目。江戸は、無血開城できたのか。想像では、できません。江戸は戦場になります。可能性は、ありうる、です。
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items:
      - - 大坂城は？
        - 落ちない
        - ありうる
      - - 江戸は？
        - 戦場になる
        - ありうる
      - - 日本は？
        - 東西に割れる
        - ほぼ妄想
      upto: 2
  - 語り: 3つ目。日本は、二つに割れたのか。割れた世界は、ほぼ妄想です。戦いが史実より長引く点だけは、札は、ありうる、です。
