# 型の比べ方 #1 日本史の悪人 吉良上野介（10-05 決定。10/7 公開）
# 事実の出どころは dev/output/rekishi-chiso/research/kira_facts.md と、末尾の「事実の控え」。確認の記録は dev/output/rekishi-chiso/review/kira/
# お金は「日雇いの日当200文を今の1万円」（1両＝4000文≒20万円）。語りで「ざっくり」と断る。
# 広告の点：討ち入り・切腹は事実だけを短く。血や刃物の大写しの絵を使わない。首の話はしない。
# 年齢は満で言う（肖像の「この時○歳」と合わせる）。数えは「数えで」と断ってから。
title: 吉良上野介は本当に意地悪な悪役だったのか｜忠臣蔵の「顔」は誰の顔か
series: ""
timeline:
  start: 1641
  end: 1750
  events: [[1641, 誕生], [1664, 綱憲], [1683, 肝煎], [1701, 刃傷], [1748, 忠臣蔵]]
tags: [吉良上野介, 吉良義央, 忠臣蔵, 赤穂事件, 赤穂浪士, 浅野内匠頭, 松の廊下, 討ち入り, 仮名手本忠臣蔵, 日本史, 江戸時代, 歴史, 日本史 雑学, 歴史 雑学, 歴史解説, 元禄, 吉良町, 歴史の地層]

shorts:
  s1:
    title: "忠臣蔵の悪役の顔は／別人の顔？"
    yt_title: "吉良上野介の悪役の顔は、別の人物の顔だった？｜仮名手本忠臣蔵"
    lead: "1748年の『仮名手本忠臣蔵』は、吉良を室町時代の悪役・高師直に置き換えました。私たちの知る吉良の顔は、まず役柄の顔でした。"
    tags: [仮名手本忠臣蔵, 高師直, 忠臣蔵 史実, 吉良上野介 悪役]
  s2:
    title: "斬られた理由を／誰も知らない"
    yt_title: "浅野内匠頭はなぜ吉良を斬ったのか｜理由は今も分からない"
    lead: "浅野は「遺恨がある」と言っただけで、中身を語らないまま、その日のうちに切腹を命じられました。いじめや賄賂の話は、噂と後の聞き書き、お芝居が出どころです。"
    tags: [松の廊下, 松之大廊下, 浅野内匠頭, 刃傷事件, 忠臣蔵 理由]
  s3:
    title: "塩が原因説は／戦後生まれ"
    yt_title: "吉良と浅野の塩田説は本当か｜原因と言われたのは戦後だった"
    lead: "赤穂の塩の作り方を聞き出そうとした、という説。事件の原因として言われ出したのは戦後で、当時の吉良の領地に塩田はなかったという反論があります。"
    tags: [赤穂の塩, 塩田説, 忠臣蔵 塩, 吉良町]
  s4:
    title: "悪役の息子は／米沢藩主"
    yt_title: "吉良上野介の息子は上杉家の殿様だった"
    lead: "米沢藩主の上杉綱勝が跡継ぎのないまま急死。生まれて半年あまりの吉良の長男が養子に入り、上杉家は15万石に減らされて残りました。"
    tags: [上杉綱憲, 米沢藩, 上杉家, 吉良 上杉]
  s5:
    title: "斬られた側の家が／消えた"
    yt_title: "討ち入りのあと吉良家はどうなったのか｜斬られた側の家が消えた"
    lead: "浪士が切腹を命じられたのと同じ日、吉良の孫の義周は領地を取り上げられ、諏訪へ。数えで21歳で亡くなり、吉良家は絶えました。"
    tags: [吉良義周, 吉良家 断絶, 赤穂浪士 その後, 諏訪]
  s6:
    title: "名君の伝説も／記録にない"
    yt_title: "吉良上野介は名君だったのか｜黄金堤の話は記録にない"
    lead: "地元で語られる、一夜で築いた堤「黄金堤」。吉良家の日記には一行も出てこず、名前が初めて出るのは明治17年でした。"
    tags: [黄金堤, 吉良上野介 名君, 吉良町, 赤馬]
  s7:
    title: "京都へ24回／儀礼のプロ"
    yt_title: "吉良上野介の本業は何だったのか｜京都へ24回の儀礼のプロ"
    lead: "吉良の家は「高家」。幕府の儀式を取り仕切る家で、吉良は朝廷への使いとして京都へ24回上ったとされます。"
    tags: [高家, 高家肝煎, 吉良上野介 仕事, 江戸幕府 儀式]
  s8:
    title: "討ち入りの費用は／約700両"
    yt_title: "赤穂浪士の討ち入りにかかったお金｜大石内蔵助の帳簿"
    lead: "大石内蔵助が残した帳簿から、討ち入りまでに使ったお金は約700両と分かっています。日当を1万円とすると、ざっくり1億4000万円です。"
    tags: [大石内蔵助, 討ち入り 費用, 忠臣蔵 お金, 赤穂浪士]
  s9:
    title: "浅野の辞世の句は／本人作か不明"
    yt_title: "浅野内匠頭の辞世の句は本人が詠んだのか｜立ち会った役人の覚書"
    lead: "切腹に立ち会った役人・多門伝八郎の覚書は、事件からかなりたって書かれ、誇張や作り話が混じると見る研究者が多い記録です。有名な辞世「風さそふ花よりもなほ」も、本人が詠んだのかは疑われています。"
    tags: [浅野内匠頭 辞世, 風さそふ花よりもなほ, 多門伝八郎, 忠臣蔵 史実]
  s10:
    title: "47人で討ち入り／着いたのは46人"
    yt_title: "討ち入りは47人、泉岳寺に着いたのは46人｜寺坂吉右衛門の謎"
    lead: "討ち入ったのは47人、泉岳寺に着いたのは46人。足軽の寺坂吉右衛門が引き揚げのころに姿を消したとされ、理由は昔から謎のままです。この人だけは切腹にならず、80歳を過ぎるまで生きたと伝えられています。"
    tags: [寺坂吉右衛門, 赤穂浪士, 泉岳寺, 討ち入り, 四十七士]

