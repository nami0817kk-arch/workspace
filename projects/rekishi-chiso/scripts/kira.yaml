  高師直: 室町時代の武将。『太平記』で強欲な悪役として描かれる

sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：忠臣蔵いちばんの悪役
    background: {image: TODO, credit: TODO}
    portrait: {image: TODO, caption: TODO}
    year: 1701
    lines:
      - 語り: 若い殿様に意地悪をして、恥をかかせた。付け届けが少ないと、作法も教えなかった。
        tone: 重い
      - 聞き: うわ、感じ悪っ。剣崎さん、それ誰の話？
        tone: 驚き
      - 語り: 忠臣蔵の悪役、吉良上野介です。江戸城で浅野内匠頭に斬りつけられ、のちに赤穂浪士に討たれた人物ですね。
      - 聞き: あー、年末のドラマで見るやつ。いじめた側だから、討たれても仕方ないって感じの。
        tone: 納得
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: でも、いじめたのは本当なんでしょ？ だから斬られたんだよね？
        short: s2
        tone: 疑問
      - 語り: 実は、浅野がなぜ斬りかかったのか、その理由は、記録からは分かっていません。
        short: s2
        card: {head: "1701年", body: "斬りつけた理由は記録に残らず"}
      - 聞き: え、分かってないの？ あんなに有名な話なのに？
        short: s2
        tone: 驚き
      - 語り: 浅野は取り調べで、「遺恨がある」とだけ言いました。何の恨みなのかは語らないまま、その日のうちに切腹を命じられています。
        short: s2
      - 聞き: 本人が言わないまま、いなくなっちゃったんだ。
        short: s2
        tone: しみじみ
      - 語り: いじめの話も、付け届けの話も、ほとんどは事件のあとに書かれた聞き書きや、お芝居から出てきたものです。
        short: s2
      - 聞き: じゃあ、あの意地悪なおじいさんの顔は、どこから来たの？
        short: s1
        tone: 疑問
      - 語り: そこが今日の一番の掘りどころです。私たちが思い浮かべる吉良の顔は、実は、別の人物の顔と重なっています。
        short: s1
      - 聞き: 別の人物？ 誰？
        tone: 疑問
      - 語り: それは、最後に掘り当てましょう。まずは、吉良という人が、どんな家に生まれたのかから。
      - 聞き: 了解。今日もヘルメット、しっかりかぶっとく。
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: 儀礼の名門に生まれて
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1641
    lines:
      - 語り: 吉良上野介、本当の名前は吉良義央。1641年、江戸で生まれました。
        card: {head: "1641年", body: "江戸で生まれる"}
      - 聞き: 上野介って、名前じゃないの？
        tone: 疑問
      - 語り: 上野介は、朝廷からもらった役職の名前です。いまで言えば、肩書きで呼ばれているようなものですね。
      - 聞き: ずっと肩書きで呼ばれてたんだ。それはそれで、なんか偉そう。
        tone: 笑い
      - 語り: 実際、家柄はとても高いんです。吉良家は、室町幕府を開いた足利氏の一門でした。
      - 語り: 将軍の家が絶えたら、吉良が継ぐ。そんな言い回しまであった、と伝えられています。
      - 聞き: え、将軍の親戚レベルってこと？
        tone: 驚き
      - 語り: 母は、幕府の大老、酒井忠勝の姪です。父の吉良義冬も高家で、吉良は、生まれたときから儀式の家の跡取りでした。
      - 聞き: 生まれたときから、行き先が決まってたんだ。
        tone: しみじみ
      - 語り: 江戸時代の吉良家は、《高家》という家柄でした。幕府の儀式を取り仕切り、朝廷とのやりとりを受け持つ家です。
        short: s7
        icon: scroll
      - 聞き: 儀式の係？ なんか地味そう。
        short: s7
        tone: 疑問
      - 語り: ところが、これが大事な仕事なんです。天皇の使いを迎えるときの作法を間違えれば、幕府の顔に泥を塗ることになります。
        short: s7
      - 聞き: 失敗できない本番を、ずっと任されてる感じか。
        short: s7
        tone: 納得
      - 語り: そのぶん、位は高く、身分は大名と並ぶほどでした。ただし、領地はそれほど大きくありません。
      - 語り: 吉良家の石高は、4200石。三河と上野、今の愛知県と群馬県にあわせて11の村を持っていました。
        card: {head: "4200石", body: "三河3200石・上野1000石"}
      - 聞き: 4200石って、多いの？ 少ないの？
        tone: 疑問
      - 語り: 比べてみましょう。のちに吉良に斬りつける浅野内匠頭の赤穂藩は、5万石です。
        figure: {type: bars, title: 石高の大きさ（石）, bars: [[吉良家, 4200], [赤穂藩・浅野家, 50000]], labels: ["4200石", "5万石"]}
      - 聞き: 浅野さんのほうが、10倍以上大きいじゃん。
        tone: 驚き
      - 語り: そうなんです。お金や領地では浅野が上、作法と位では吉良が上。この二人は、そういう組み合わせでした。
      - 聞き: なんか、もめそうな組み合わせ……。
        tone: 疑問
        figure: null
      - 語り: 吉良は16歳で、朝廷から位をもらい、上野介になります。
        card: {head: "1658年", body: "上野介に任じられる"}
      - 語り: 同じころ、結婚もしました。相手は、米沢藩の上杉家の姫、富子です。
        icon: heart
      - 聞き: 上杉って、あの戦国の上杉謙信の？
        tone: 驚き
      - 語り: その上杉家です。この結婚が、のちに吉良家と上杉家を、切っても切れない関係にしていきます。
      - 聞き: 切っても切れないって、どういうこと？
        tone: 疑問
      - 語り: 6年後、上杉家に、家が消えるかもしれない大事件が起きるんです。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 息子が米沢藩主に
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1664
    lines:
      - 語り: 1664年、米沢藩主の上杉綱勝が、27歳で急に亡くなりました。富子の兄、つまり吉良の義理の兄です。
        short: s4
        card: {head: "1664年", body: "米沢藩主・上杉綱勝が急死"}
      - 聞き: 跡継ぎは？
        short: s4
        tone: 疑問
      - 語り: いませんでした。当時は、跡継ぎを決めないまま殿様が亡くなると、家ごと取り潰されるのが決まりです。
        short: s4
      - 聞き: 上杉家が、なくなっちゃう！？
        short: s4
        tone: 驚き
      - 語り: そこで、会津藩主の保科正之が間に入りました。亡くなった綱勝の妻の父で、将軍の叔父にあたる実力者です。
        short: s4
      - 語り: 話はこうまとまります。吉良の長男、2歳の三之助を上杉家の養子にする。その代わり、30万石を半分の15万石に減らす。
        short: s4
        card: {head: "30万石 → 15万石", body: "吉良の長男が上杉家を継ぐ"}
      - 聞き: 2歳で、殿様に！？
        short: s4
        tone: 驚き
      - 語り: この三之助が、のちの米沢藩主、上杉綱憲です。
        short: s4
        figure: {type: people, title: 吉良家と上杉家, nodes: [[吉良上野介, 高家], [富子, 上杉家の姫], [上杉綱勝, 米沢藩主・急死], [上杉綱憲, 吉良の長男], [吉良義周, 吉良の孫]], edges: [[吉良上野介, 富子, 夫婦], [富子, 上杉綱勝, 兄と妹], [吉良上野介, 上杉綱憲, 父と子・上杉家へ], [上杉綱憲, 吉良義周, 父と子・吉良家へ]]}
      - 聞き: 悪役の息子が、米沢の殿様……。全然知らなかった。
        short: s4
        tone: 驚き
      - 語り: しかも話はここで終わりません。のちに、綱憲の次男が、今度は吉良家の跡継ぎとして戻ってきます。孫の義周です。
      - 聞き: 子どもを交換しあってるみたい。家と家が、がっちり組み合ってるんだ。
        tone: 納得
      - 語り: まさに、そういう関係でした。そして、お金の面でも、上杉家は吉良家を支えたとされます。
        figure: null
      - 語り: 吉良が江戸の屋敷を新しく建てたとき、その費用2万5500両を上杉家が出した、と伝わっています。
        card: {head: "2万5500両", body: "屋敷の新築を上杉家が負担"}
      - 聞き: 両って、今だといくら？
        tone: 疑問
      - 語り: 当時の日雇いの日当が、およそ200文。日当を今の1万円とすると、1両は、ざっくり20万円です。2万5500両なら、およそ51億円になります。
        figure: {type: money, title: 屋敷の新築の費用, then: "2万5500両", yen: 5100000000, basis: "日雇いの日当200文を今の1万円とした目安（1両＝4000文≒20万円）。比べる物で大きく変わる"}
      - 聞き: 51億！？ 屋敷1つで？
        tone: 驚き
      - 語り: 数字は、のちの書き物によるものなので、目安と考えてください。それでも、上杉家にとって吉良家が重たい存在だったことは、よく語られます。
      - 聞き: 親戚づきあいが、重すぎる……。
        tone: 笑い
        figure: null
      - 語り: ここで覚えておいてほしいのは、吉良の後ろには、15万石の米沢藩がついていた、ということです。
      - 聞き: それって、あとで何か関係あるの？
        tone: 疑問
      - 語り: 討ち入りのとき、大きな意味を持ってきます。その前に、吉良の本業を見ていきましょう。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 京都へ24回、儀礼のプロ
    background: {image: TODO, credit: TODO}
    portrait: {image: TODO, caption: TODO}
    year: 1680
    lines:
      - 語り: 吉良の本業は、儀式です。中でも大事なのが、江戸と京都の朝廷をつなぐ役目でした。
        short: s7
      - 聞き: 京都まで行くの？ 歩いて？
        short: s7
        tone: 疑問
      - 語り: 将軍の代わりに、正月のあいさつなどの使いとして、京都へ上ります。吉良は、生涯に24回、京都へ上ったとされます。
        short: s7
        figure: {type: map, title: 吉良の行き来した場所, bounds: [133.5, 141.0, 33.6, 38.6], route: [江戸, 京都], places: [[江戸, 139.77, 35.68], [京都, 135.77, 35.01], [吉良, 137.15, 34.80], [赤穂, 134.39, 34.75], [米沢, 140.12, 37.92]], note: 江戸から京都までおよそ500km}
      - 聞き: 24回！？ 片道だけで、何日もかかるよね。
        short: s7
        tone: 驚き
      - 語り: 東海道を通って、片道2週間ほどかかったと言われます。往復と京都での務めを合わせると、人生のうち、ずいぶん長い時間を旅に使ったことになります。
      - 聞き: 出張のプロじゃん。
        tone: 笑い
      - 語り: 行き来は、両方向でした。正月には、将軍があいさつの使いを京都へ送ります。すると春に、天皇の側から、お返しの使いが江戸へやって来ます。これが《勅使》です。
      - 聞き: 勅使を迎える儀式も、吉良さんたち高家が仕切るの？
        tone: 疑問
      - 語り: そうです。そして、勅使をもてなす係には、毎年、大名が一人ずつ選ばれました。何をどう出すか、どこに座るか。その作法を教えるのが、高家の役目です。
      - 聞き: 大名に、作法を教える先生かあ。教わる側は、ちょっと気をつかいそう。
        tone: 納得
      - 語り: 地図の真ん中あたりに、吉良の領地があります。今の愛知県西尾市、吉良町のあたりです。東海道の途中ですね。
      - 聞き: 浅野さんの赤穂は、もっと西なんだ。
        figure: null
      - 語り: そうです。1680年、吉良は、高家として最高の位、左近衛権少将に上ります。
        card: {head: "1680年", body: "左近衛権少将に"}
      - 語り: そして1683年、高家のまとめ役、《高家肝煎》になりました。
        short: s7
        card: {head: "1683年", body: "高家肝煎になる"}
      - 聞き: まとめ役ってことは、儀式のいちばん偉い先生、みたいな？
        tone: 疑問
      - 語り: そう思ってください。江戸幕府の公式の歴史書『徳川実紀』には、吉良は、朝廷と武家の礼儀としきたりを、よく知り尽くしていた、と書かれています。
        short: s7
        card: {head: "『徳川実紀』", body: "礼儀としきたりを知り尽くした人"}
      - 聞き: 公式の本で褒められてるんだ。意地悪なおじいさんのイメージと、全然ちがう。
        short: s7
        tone: 驚き
      - 語り: 同じ1683年、ある若い大名が、天皇の使いをもてなす係に選ばれています。まだ10代半ばの、浅野内匠頭です。
        portrait: {image: TODO, caption: TODO}
      - 聞き: え、ここで浅野さん登場！？
        tone: 驚き
      - 語り: このとき浅野に作法を教えたのも、吉良だったとされます。このときは、何も問題は起きていません。
      - 聞き: 1回目は、うまくいったんだ。
        tone: 納得
      - 語り: もてなし係は、大名が順番に受け持つ大役です。費用も、もてなす側の大名が出しました。
        icon: coins
      - 聞き: 自腹なの？ それはきつい。
        tone: 驚き
      - 語り: このお金の話が、のちの事件の説明に、何度も出てきます。それから18年後、浅野に、2回目の順番が回ってきました。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 松之大廊下の刃傷
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1701
    lines:
      - 語り: 1701年、旧暦の3月14日。今の暦で4月21日です。
        card: {head: "元禄14年3月14日", body: "江戸城・松之大廊下（1701年4月）"}
        year: 1701
      - 語り: この日は、天皇の使いが将軍に返事を伝える、いちばん大事な儀式の日でした。
      - 聞き: 失敗できない本番の日……。
        tone: 重い
      - 語り: 昼前、江戸城の松之大廊下で、吉良は、梶川与惣兵衛という役人と立ち話をしていました。
      - 語り: そこへ浅野が後ろから近づき、小刀で吉良に切りかかります。
        tone: 重い
        icon: lightning
      - 聞き: え、後ろから！？
        tone: 驚き
      - 語り: その場にいた梶川が書き残した記録では、浅野はこう声をかけた、とされています。
      - 人物: 「この間の遺恨、覚えたるか」
        who: 浅野
      - 聞き: この間の恨み、覚えてるかって……。
        tone: 重い
      - 語り: ただ、この言葉は、写本によっては書かれていないものもあります。「声をかけた」とだけあるものです。
      - 聞き: 記録によって、ちがうんだ。
        tone: 疑問
      - 語り: 吉良は、額と背中にけがを負いました。梶川が浅野を後ろから抱き止め、その場は収まります。
        card: {head: "吉良のけが", body: "額と背中。どちらも浅い傷"}
      - 聞き: 吉良さん、もう60歳近いよね。いきなり斬られて、怖かっただろうな。
        tone: しみじみ
      - 語り: 傷は浅く、命に別状はありませんでした。でも、問題は、場所と日でした。
      - 語り: 天皇の使いを迎える儀式の日に、江戸城の中で刀を抜いた。これは、将軍の顔をつぶす、重い罪です。
        portrait: {image: TODO, caption: TODO}
      - 聞き: 将軍って、誰だっけ？
        tone: 疑問
      - 語り: 五代将軍、徳川綱吉です。浅野は、その日のうちに切腹を命じられ、赤穂の浅野家は取り潰されました。
        card: {head: "同じ日の夕方", body: "浅野は切腹、浅野家は改易"}
      - 聞き: その日のうちに！？ 早すぎない？
        tone: 驚き
      - 語り: 浅野は取り調べで、こう述べたと記録されています。
        portrait: null
      - 人物: 「将軍様に恨みはありません。ただ、私の恨みがあって、斬りつけました」
        who: 浅野
      - 聞き: 恨みの中身は、言ってないんだ。
        short: s2
        tone: 疑問
      - 語り: そうなんです。中身を語らないまま、裁きらしい裁きもなく、その日のうちに。だから、本当の理由は、誰にも分からなくなりました。
        short: s2
      - 語り: この日の浅野については、もう一つ、有名な記録があります。取り調べと切腹に立ち会った役人、多門伝八郎が書いた覚書です。
        card: {head: "『多門伝八郎覚書』", body: "浅野に同情的な、のちの覚書"}
      - 聞き: 立ち会った人の記録なら、確かそう。
        tone: 納得
      - 語り: ところが、これが要注意なんです。覚書の中で、多門は、庭先での切腹はひどいと上役に食ってかかる、正義の役人として描かれています。
      - 聞き: 自分で自分を、かっこよく書いてる……？
        tone: 疑問
      - 語り: 研究者の多くは、事件からかなりたってから書かれ、誇張や作り話が混じっている、と見ています。人の呼び名に、事件のときにはまだ使われていなかったものが出てくるんです。
      - 語り: 浅野の辞世の句として有名な、「風さそふ花よりもなほ」という歌も、この覚書が出どころです。本人が詠んだのかは、疑われています。
        icon: flower
      - 聞き: え、あの名場面の歌も！？ ドラマで何回も聞いたのに。
        tone: 驚き
      - 語り: 忠臣蔵の名場面には、こうした、後から書かれた記録から生まれたものが、たくさんあるんです。
      - 聞き: 吉良さんのほうは、どうなったの？
        tone: 疑問
      - 語り: お咎めなしです。それどころか、年も年だから、よく養生するように、とお見舞いの言葉までありました。
        card: {head: "吉良はお咎めなし", body: "「よく養生するように」"}
      - 聞き: 片方は切腹、片方はお見舞い……。浅野さんの家来からしたら、納得いかないよね。
        tone: 重い
      - 語り: この差が、のちの討ち入りにつながっていきます。では、浅野はなぜ斬りかかったのか。残っている説を、一つずつ掘ってみましょう。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 斬られた理由を掘る
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1701
    lines:
      - 語り: いちばん有名なのは、付け届けが少なかった、という説です。浅野が吉良に十分な礼をせず、吉良が冷たくした、という話ですね。
      - 聞き: 賄賂をくれないから、意地悪したってやつ。
        tone: 疑問
      - 語り: この話を書きとめた学者は、事件から10年以上たってから書いています。しかも本人が、結局のところ分からない、と断っているんです。
        card: {head: "付け届け説", body: "書いた本人も「分からない」"}
      - 聞き: 書いた人まで分からないって言ってるの！？
        tone: 驚き
      - 語り: それに、作法を教わったら礼をするのは、当時のふつうの習わしでした。賄賂というより、お月謝のようなものです。
      - 聞き: 習い事のお礼みたいなもんか。それなら、悪いことじゃないよね。
        tone: 納得
      - 語り: もてなしの費用をめぐる話もあります。例年は1200両かかるところを、浅野は700両しか出さなかった、というものです。
        figure: {type: bars, title: もてなしの費用（両）・伝わる話, bars: [[1683年の浅野, 400], [1701年の浅野, 700], [例年かかるとされた額, 1200]], labels: ["400両", "700両", "1200両"], note: 一人の書き付けによる伝聞}
      - 聞き: 700両でも、今のお金だと……1億4000万円くらい？
        tone: 疑問
      - 語り: そうです。ただ、この数字も、赤穂藩士の俳句の先生が書いたとされる書き付けだけが出どころです。
      - 聞き: 一人の話だけかあ。
        figure: null
      - 語り: 次は、作法を教えなかった、意地悪をした、という説。屏風の話や、お寺の畳替えの話が有名ですね。
        icon: warning
      - 聞き: それそれ！ ドラマで、吉良さんがわざと嘘を教えるやつ。
        tone: 明るい
      - 語り: その多くは、後の時代に作られた本や、講談と呼ばれる語り物で、どんどん膨らんだ話です。
      - 聞き: え、ドラマの名場面が、後から作られた話だったの……。
        tone: 驚き
      - 語り: もう一つ、塩の話もあります。吉良が、赤穂の塩の作り方を聞き出そうとして断られた、という説です。
        short: s3
        icon: drop
      - 聞き: 赤穂の塩って、有名だもんね。それはありそう。
        short: s3
        tone: 納得
      - 語り: ところが、この説が出てきたのは、戦後なんです。1982年の大河ドラマで、広く知られるようになりました。
        short: s3
        card: {head: "塩の説", body: "出てきたのは戦後"}
      - 聞き: 戦後！？ 事件から250年以上たってから？
        short: s3
        tone: 驚き
      - 語り: しかも、当時の吉良の領地には塩田がなかった、という反論が、地元から出ています。
        short: s3
      - 聞き: 塩田がないなら、聞き出す理由もないじゃん。
        short: s3
        tone: 納得
      - 語り: 浅野の体の具合を挙げる研究者もいます。浅野には、胸がつかえる持病があったと記録されています。
      - 聞き: それが、事件の日に悪くなったってこと？
        tone: 疑問
      - 語り: その可能性はあります。でも、それが理由だと言い切れる記録は、ありません。
      - 語り: 吉良のほうは、取り調べで、浅野は乱心したのではないか、と答えたとされます。
      - 聞き: 乱心って、気が変になったってこと？ 自分を斬った人を、かばってるみたい。
        tone: 疑問
      - 語り: 歴史学者の山本博文さんは、ここに注目しています。もし浅野が乱心を認めていれば、もっと軽い処分で済んだかもしれない、というんです。
      - 聞き: でも浅野さんは、恨みがあったって言っちゃった。
        tone: しみじみ
      - 語り: そうなんです。山本さんは、偉い人たちの前で、吉良に面目をつぶされるようなことを言われ、武士として引けなくなったのではないか、とも考えています。ただ、これも推測です。
      - 聞き: 結局、どの説も決め手がないんだ。
        tone: 納得
      - 語り: そうなんです。研究者の多くも、本当の理由は史料からは分からない、と考えています。
        short: s2
        card: {head: "研究者の見方", body: "理由は史料からは分からない"}
      - 聞き: 理由が分からないのに、なんで吉良さんだけ悪者になっちゃったの？
        tone: 疑問
      - 語り: それも見立ての節で掘ります。その前に、事件のあとの吉良を見ておきましょう。斬られたあと、吉良の暮らしは、静かに追い込まれていきます。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 本所へ、そして討ち入り
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1701
    lines:
      - 語り: 事件から半月ほどで、吉良は、高家のまとめ役を辞めたいと願い出ました。
        card: {head: "元禄14年3月26日", body: "役を辞めたいと願い出る"}
      - 聞き: お咎めなしだったのに、辞めちゃうんだ。
        tone: 疑問
      - 語り: 8月には、屋敷を移るよう命じられます。江戸城のすぐ近くの呉服橋から、隅田川を渡った向こう、本所へ。
        card: {head: "元禄14年8月", body: "呉服橋から本所へ屋敷替え"}
      - 聞き: 本所って、遠いの？
        tone: 疑問
      - 語り: 当時の本所は、江戸の中心から川を隔てた、外れのほうでした。のちに、討ちに行きやすくするためだった、と語られることもあります。
      - 語り: ただ、幕府がどういうつもりだったのかは、記録からは分かりません。
      - 聞き: また分からないんだ。この話、分からないことだらけ。
        tone: 笑い
      - 語り: そして、その年の暮れ、吉良は隠居して、家を孫の義周に譲りました。義周は、あの上杉綱憲の次男です。
        card: {head: "元禄14年の暮れ", body: "隠居し、孫の義周に家を譲る"}
      - 聞き: 浅野さんの家来たちは、そのあいだ何してたの？
        tone: 疑問
      - 語り: 赤穂の城を明け渡したあと、家老の大石内蔵助を中心に、浅野家を立て直してもらえないか、幕府に願い続けていました。
        portrait: {image: TODO, caption: TODO}
      - 語り: でも、その望みが絶たれると、1702年の夏、京都で、討ち入りを決めます。
        card: {head: "元禄15年7月", body: "京都で討ち入りを決める"}
        year: 1702
      - 聞き: ついに……。
        tone: 重い
      - 語り: 大石が残した帳簿が、今も残っています。討ち入りまでに使ったお金は、およそ700両。日当を1万円とすると、ざっくり1億4000万円です。
        short: s8
        figure: {type: money, title: 討ち入りまでに使ったお金, then: "約700両", yen: 140000000, basis: "大石内蔵助の帳簿による。日雇いの日当200文を今の1万円とした目安（1両≒20万円）"}
      - 聞き: 帳簿まで残ってるの！？ 大石さん、几帳面。
        short: s8
        tone: 驚き
      - 語り: 江戸に潜むための家賃や、旅の費用、武具などが、細かく書き込まれています。
        short: s8
        icon: notebook
      - 聞き: 討ち入りにも、お金がいるんだなあ。
        short: s8
        tone: しみじみ
        figure: null
        portrait: null
      - 語り: そして、元禄15年の12月14日の夜から、翌15日の明け方にかけて。今の暦では、1703年の1月30日の夜から、31日の未明です。
        card: {head: "元禄15年12月14日", body: "討ち入り（今の暦で1703年1月30日の夜）"}
        year: 1703
      - 語り: 47人の浪士が、表と裏の二手に分かれて、本所の吉良の屋敷に入りました。
        background: {image: TODO, credit: TODO}
      - 聞き: 吉良さんの家にも、家来はいたんだよね。
        tone: 疑問
      - 語り: 屋敷のあった場所は、今の東京都墨田区の両国です。跡地の一部は、小さな公園になっています。
      - 聞き: 両国って、相撲の？ 今は都会のど真ん中じゃん。
        tone: 驚き
      - 語り: 当時は、隅田川の向こうの新しい町でした。
      - 語り: 家来は、たくさんいました。屋敷の側では、十数人が亡くなり、二十人前後がけがをしたと伝わります。当主の義周も、なぎなたで戦って、けがを負いました。
      - 聞き: 義周さんって、まだ十代でしょ……。
        tone: 重い
      - 語り: 数えで17歳です。吉良は、台所のそばの物置のような部屋で見つかり、討たれました。満で61歳でした。
        tone: 重い
        card: {head: "吉良の最期", body: "満61歳（数えで62歳）"}
      - 聞き: ……そっか。
        tone: 重い
      - 語り: 浪士たちは、主君の墓のある泉岳寺へ向かい、仇を討ったと報告しました。
      - 語り: ちなみに、討ち入ったのは47人ですが、泉岳寺に着いたのは46人でした。寺坂吉右衛門という足軽が、引き揚げの途中で姿を消しています。
      - 聞き: え、一人いなくなったの？ なんで？
        tone: 驚き
      - 語り: 理由は、昔から謎のままです。この人だけは切腹にならず、80歳を過ぎるまで生きたと伝えられています。
      - 聞き: 忠臣蔵って、ほんとに分からないことだらけ。
        tone: 笑い
      - 聞き: 上杉家は？ 15万石の息子の家が、黙ってたの？
        tone: 疑問
      - 語り: 綱憲が兵を出そうとして、家老に止められた、という話が有名です。ただ、これは劇や講談で知られた話で、当時の記録では確かめられていません。
      - 語り: そして、この話には、あまり語られない続きがあります。
        hook: true
      - 聞き: 続き？
        tone: 疑問

