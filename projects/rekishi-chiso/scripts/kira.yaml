# 事実の控え（2026-10-05。詳細は dev/output/rekishi-chiso/research/kira_facts.md）
# - 生 1641-10-06（寛永18年9月2日）江戸。没 1703-01-31（元禄15年12月15日）。刃傷のとき満59、討ち入りのとき満61（数え62）
# - 上野介叙任 1658（明暦3年12月27日＝1658年1月。満16）。結婚 1658（万治元年4月）
# - 上杉綱勝の急死 1664（寛文4年閏5月、満25・数え27）。保科正之の取りなしで三之助（1663-11-27生、生後7か月ほど）が養子、30万→15万石
# - 屋敷の新築費2万5500両・借金6000両など上杉家の負担は Wikipedia の記述（原典未確認）→「伝わっています」「目安」と言う
# - 京都24回は Wikipedia の記述（原典未確認）→「とされます」
# - 左近衛権少将 1680、高家肝煎 1683。『徳川実紀』元禄14年3月14日条「世に伝ふる所は…公武の礼節典故を熟知精練…されば賄賂をむさぼり」（一続きの言い伝え。江戸後期の編纂）
# - 浅野の1回目の饗応役 1683（17歳。数え）。このときも吉良が指南役（有力）→「とされます」
# - 刃傷 元禄14年3月14日（1701-04-21）巳の下刻。梶川筆記の「此間の遺恨覚えたるか」は写本で異同 → 台本で断っている
# - 浅野の言葉：梶川筆記「上野介、此間中、意趣これあり候故…是非におよび申さず討ち果たし候」を今の言葉に。「上へ対し奉り…」は多門筆記にしか無いので使わない
# - 吉良は「老体のことであるから、ずいぶん保養するように」
# - 付け届け説：三宅観瀾が10年以上あとに書きとめ「結局不明」と断り書き
# - 饗応費 400/700/1200両：水間沾徳の書き付けとされる伝聞（説）→ 図に「伝わる話」「伝聞」と出す
# - 塩田説：戦後の説（1947『裏返し忠臣蔵』、1954『きらのしお』、1972『赤穂義士事典』）、1982 大河『峠の群像』で広まる。吉良領に塩田なし（饗庭塩の会）
# - 痞の持病：記録あり、原因とは断定できない
# - 屋敷替え 元禄14年8月13日、隠居 12月11日（西暦では1702年1月）。台本は「元禄14年の暮れ」と和暦で言う
# - 討ち入りの決定 元禄15年7月28日（円山会議）
# - 討ち入り 元禄15年12月14日夜〜15日未明＝1703-01-30夜〜01-31未明。台本は和暦で言い、「今の暦で1703年1月の終わり」と添える
# - 吉良側の死者15〜18・負傷19〜23（幅）→「十数人」「二十人前後」
# - 義周 数え17、薙刀で応戦し負傷。改易は元禄16年2月4日（浪士の切腹と同じ日）。1706 諏訪で病死（数え21）
# - 軍資金約700両：大石の『預置候金銀請払帳』（山本博文『「忠臣蔵」の決算書』）
# - 色部又四郎が出兵を止めた話：劇・講談の伝承 → 台本で断っている
# - 黄金堤：『吉良家日記』に記述なし、名の初出 明治17年（1884）。赤馬の玩具は天保年間〜。領地に来た記録は1677の1回
# - 華蔵寺の毎歳忌 12月14日、木像は県指定文化財、自ら彩色は「伝える」
# - 『鸚鵡籠中記』「吉良は欲深き者故」
# - 仮名手本忠臣蔵 1748年8月 大坂・竹本座、同年に歌舞伎。高師直＝吉良、塩冶判官＝浅野、大星由良助＝大石
# - 明治41年 福本日南『元禄快挙録』（新聞連載）
