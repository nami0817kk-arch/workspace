sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：忠臣蔵いちばんの悪役
    background: {image: paintings/kira_night_attack_kuniyoshi.jpg, credit: "歌川国芳《忠臣蔵十一段目 夜討之図》1831〜35年ごろ（芝居の絵）"}
    portrait: {image: paintings/kira_statue_bust.jpg, caption: "吉良上野介の木像（華蔵寺、1910年ごろの写真）", age: false}
    year: 1701
    lines:
      - 語り: 若い殿様に意地悪をして、恥をかかせた。付け届けが少ないと、作法も教えなかった。
        tone: 重い
      - 聞き: うわ、感じ悪っ。剣崎さん、それ誰の話？
        tone: 驚き
      - 語り: 忠臣蔵の悪役、吉良上野介です。江戸城で浅野内匠頭に斬りつけられ、のちに赤穂浪士に討たれた人物ですね。
        short: [s1, s2]
      - 聞き: あー、年末のドラマで見るやつ。いじめた側だから、討たれても仕方ないって感じの。
        tone: 納得
      - 語り: それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: でも、いじめたのは本当なんでしょ？ あーし、そこは疑ったことなかった。
        tone: 疑問
      - 語り: 実は、浅野がなぜ斬りかかったのか、その理由は、記録からは分かっていません。
        short: s2
        card: {head: "1701年", body: "恨みの中身は語られず"}
      - 聞き: え、分かってないの？ あんなに有名な話なのに？
        short: s2
        tone: 驚き
      - 語り: 浅野は、取り押さえられながら、この間からの恨みがあった、と言っただけでした。何の恨みなのかは語らないまま、その日のうちに切腹を命じられています。
        short: s2
      - 聞き: 本人が理由を言わないまま、いなくなっちゃったんだ。じゃあ、いじめの話はどこから？
        short: s2
        tone: 疑問
      - 語り: 当時の噂や、事件のあとに書かれた聞き書き、そしてお芝居です。確かな記録で裏づけられたものは、ありません。
        short: s2
      - 聞き: じゃあ、あの意地悪なおじいさんの顔は、どこから来たの？
        tone: 疑問
      - 語り: そこが今日の一番の掘りどころです。私たちが思い浮かべる吉良の顔は、実は、別の人物の顔と重なっています。
      - 聞き: 別の人物？ 誰？
        tone: 疑問
      - 語り: それは、最後に掘り当てましょう。そして、もう一つ。討たれたあと、吉良の家はどうなったと思いますか？
      - 聞き: え、吉良さんは斬られた側でしょ？ 家は、そのまま続いたんじゃないの？
        tone: 疑問
      - 語り: それも、今日掘ります。まずは、吉良という人が、どんな家に生まれたのかから。
      - 聞き: 了解。今日もヘルメット、しっかりかぶっとく。
        tone: 明るい

  # ---------------------------------------------------------------- 2
  - title: 儀礼の名門に生まれて
    background: {image: paintings/kira_edo_castle_beato.jpg, credit: "フェリーチェ・ベアト撮影《江戸城の門と石垣》1860年代"}
    portrait: null
    year: 1641
    lines:
      - 語り: 吉良上野介、本当の名前は吉良義央。1641年、江戸で生まれました。
        short: s7
        card: {head: "1641年", body: "江戸で生まれる"}
      - 聞き: 上野介って、名前じゃないの？
        tone: 疑問
      - 語り: 上野介は、朝廷からもらった役職の名前です。いまで言えば、肩書きで呼ばれているようなものですね。
      - 聞き: ずっと肩書きで呼ばれてたんだ。それはそれで、なんか偉そう。
        tone: 笑い
      - 語り: 実際、家柄はとても高いんです。吉良家は、室町幕府を開いた足利氏の一門でした。
      - 語り: 室町時代には、足利の将軍家が絶えたら吉良が継ぐ、そんな言い回しまであった、と伝えられています。
      - 聞き: 将軍の親戚レベルってこと？ すごい家じゃん。
        tone: 驚き
      - 語り: 母は、幕府の大老、酒井忠勝の姪です。父の吉良義冬も高家で、吉良は、生まれたときから儀式の家の跡取りでした。
      - 聞き: 高家？ 今さらっと言ったけど、それ何？
        tone: 疑問
      - 語り: 《高家》は、幕府の儀式を取り仕切り、朝廷とのやりとりを受け持つ家柄です。
        short: s7
        icon: scroll
      - 聞き: 儀式の係？ なんか地味そう。あーしなら3日で飽きる。
        tone: 笑い
      - 語り: ところが、これが大事な仕事なんです。天皇の使いを迎えるときの作法を間違えれば、幕府の顔に泥を塗ることになります。
      - 聞き: 失敗できない本番を、ずっと任されてる感じか。
        tone: 納得
      - 語り: そのぶん、朝廷からもらう位は高く、大名と並ぶほどでした。ただ、身分は旗本。領地も、それほど大きくありません。
      - 語り: 吉良家の石高は、4200石。三河と上野、今の愛知県と群馬県に、あわせて11の村を持っていました。
        card: {head: "4200石", body: "三河3200石・上野1000石"}
      - 聞き: 4200石って、多いの？ 少ないの？
        tone: 疑問
      - 語り: 比べてみましょう。のちに吉良に斬りつける浅野内匠頭の赤穂藩は、5万石です。
        figure: {type: bars, title: 石高の大きさ（石）, bars: [[吉良家, 4200], [赤穂藩・浅野家, 50000]], labels: ["4200石", "5万石"]}
      - 聞き: 浅野さんのほうが、10倍以上大きいじゃん。
        tone: 驚き
      - 語り: お金や領地では浅野が上、位と作法では吉良が上。この二人は、そういう組み合わせでした。
      - 聞き: なんか、もめそうな組み合わせ……。
        tone: 疑問
        figure: null
      - 語り: 吉良は16歳で、朝廷から位をもらい、上野介になります。
        card: {head: "1658年", body: "上野介に任じられる"}
      - 語り: 同じころ、結婚もしました。相手は、米沢藩の上杉家の姫、富子です。
        icon: heart
      - 聞き: 上杉って、あの戦国の上杉謙信の？
        tone: 疑問
      - 語り: その上杉家です。この結婚が、のちに吉良家と上杉家を、切っても切れない関係にしていきます。
      - 聞き: 切っても切れないって、どういうこと？
        tone: 疑問
      - 語り: 6年後、上杉家に、家が消えるかもしれない大事件が起きるんです。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 息子が米沢藩主に
    background: {image: paintings/kira_edo_birdseye_keisai_1803.jpg, credit: "鍬形蕙斎《江戸名所之絵》1803年"}
    portrait: null
    year: 1664
    lines:
      - 語り: 1664年、米沢藩主の上杉綱勝が、25歳の若さで急に亡くなりました。富子の兄、つまり吉良の義理の兄です。
        short: s4
        card: {head: "1664年", body: "米沢藩主・上杉綱勝が急死"}
      - 聞き: 跡継ぎは？
        short: s4
        tone: 疑問
      - 語り: いませんでした。当時は、跡継ぎを決めないまま殿様が亡くなると、家ごと取り潰されるのが決まりです。
        short: s4
      - 聞き: でも上杉家って、今も米沢で有名だよね。どうやって残ったの？
        tone: 疑問
      - 語り: 会津藩主の保科正之が、間に入りました。亡くなった綱勝の妻の父で、将軍の叔父にあたる実力者です。
      - 語り: 話はこうまとまります。吉良の長男、生まれてまだ半年あまりの三之助を、上杉家の養子にする。その代わり、30万石を半分の15万石に減らす。
        short: s4
        card: {head: "30万石 → 15万石", body: "吉良の長男が上杉家を継ぐ"}
      - 聞き: 赤ちゃんが、殿様に！？
        short: s4
        tone: 驚き
      - 語り: この三之助が、のちの米沢藩主、上杉綱憲です。
        short: s4
        figure: {type: people, title: 吉良家と上杉家, nodes: [[吉良上野介, 高家], [富子, 上杉家の姫], [上杉綱勝, 米沢藩主・急死], [上杉綱憲, 吉良の長男], [吉良義周, 吉良の孫]], edges: [[吉良上野介, 富子, 夫婦], [富子, 上杉綱勝, 兄と妹], [吉良上野介, 上杉綱憲, 父と子・上杉家へ], [上杉綱憲, 吉良義周, 父と子・吉良家へ]]}
      - 聞き: 待って。じゃあ、のちに吉良さんが討たれるとき、米沢の殿様は、自分の父親を討たれるってこと？
        short: s4
        tone: 疑問
      - 語り: そういうことになります。しかも、のちに綱憲の次男が、今度は吉良家の跡継ぎとして戻ってきます。孫の義周です。
        short: s4
      - 聞き: 子どもを交換しあってるみたい。家と家が、がっちり組み合ってるんだ。
        tone: 納得
      - 語り: まさに、そういう関係でした。お金の面でも、上杉家は吉良家を支えたとされます。
        figure: null
      - 語り: 屋敷が火事で焼けて建て直したとき、その費用2万5500両を、上杉家が出したと伝わっています。
        card: {head: "2万5500両", body: "屋敷の建て直しを上杉家が負担"}
      - 聞き: 両って、あーしには全然ピンとこない。今だといくら？
        tone: 疑問
      - 語り: 当時の日雇いの日当が、およそ200文。日当を今の1万円とすると、1両は、ざっくり20万円です。
      - 聞き: じゃあ、2万5500両だと……？
        tone: 疑問
      - 語り: およそ51億円です。もとの記録がはっきりしない数字なので、目安と考えてください。
        figure: {type: money, title: 屋敷の建て直しの費用, then: "2万5500両", yen: 5100000000, basis: "日雇いの日当200文を今の1万円とした目安（1両＝4000文≒20万円）。比べる物で大きく変わる"}
      - 聞き: 51億！？ 親戚づきあいが、重すぎる！
        tone: 笑い
      - 語り: ここで覚えておいてほしいのは、吉良の後ろには、15万石の米沢藩がついていた、ということです。
        figure: null
      - 聞き: それって、あとで何か関係あるの？
        tone: 疑問
      - 語り: 討ち入りのとき、上杉家がどう動いたか。そこにも、有名な話があります。その前に、吉良の仕事を見ていきましょう。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 京都へ24回、儀礼のプロ
    background: {image: paintings/kira_okazaki_hiroshige.jpg, credit: "歌川広重《東海道五十三次 岡崎》1833年ごろ"}
    portrait: {image: paintings/kira_statue_bust.jpg, caption: "吉良上野介の木像（華蔵寺、1910年ごろの写真）", age: false}
    year: 1680
    lines:
      - 語り: 高家の仕事で、いちばん目立つのが、京都への使いでした。
        short: s7
      - 聞き: 京都まで行くの？ 歩いて？
        tone: 疑問
      - 語り: 将軍の代わりに、正月のあいさつなどの使いとして、京都へ上ります。吉良は、生涯に24回、京都へ上ったとされます。
        short: s7
        figure: {type: map, title: 吉良の行き来した場所, bounds: [133.5, 141.0, 33.6, 38.6], route: [江戸, 京都], places: [[江戸, 139.77, 35.68], [京都, 135.77, 35.01], [吉良, 137.07, 34.80], [赤穂, 134.39, 34.75], [米沢, 140.12, 37.92]], note: 江戸から京都までおよそ500km}
      - 聞き: 24回！？ 片道だけで、何日もかかるよね。
        tone: 驚き
      - 語り: 東海道を通って、片道2週間ほどかかったと言われます。
      - 聞き: 出張のプロじゃん。
        tone: 笑い
      - 語り: 地図の真ん中あたり、東海道から少し南に入った所に、吉良の三河の領地があります。今の愛知県西尾市、吉良町のあたりです。
      - 聞き: 浅野さんの赤穂は、もっと西なんだ。
      - 語り: 行き来は、両方向でした。春には、天皇の側から、お返しの使いが江戸へやって来ます。これが《勅使》です。
        figure: null
      - 聞き: 勅使を迎える儀式も、吉良さんたち高家が仕切るの？
        tone: 疑問
      - 語り: そうです。勅使をもてなす係には、毎年、幕府が大名を選んで命じました。何をどう出すか、どこに座るか。その作法を教えるのが、高家の役目です。
      - 聞き: 大名に、作法を教える先生かあ。教わる側は、ちょっと気をつかいそう。
        tone: 納得
      - 語り: 1680年、吉良は、高家として最高の位に上ります。
        card: {head: "1680年", body: "左近衛権少将に"}
      - 語り: そして1683年、高家のまとめ役、《高家肝煎》になりました。
        short: s7
        card: {head: "1683年", body: "高家肝煎になる"}
      - 聞き: まとめ役ってことは、儀式のいちばん偉い先生、みたいな？
        short: s7
        tone: 疑問
      - 語り: そう思ってください。幕府がのちにまとめた歴史書『徳川実紀』は、世に伝わる話として、吉良は朝廷と武家の礼儀としきたりを知り尽くしていて、右に出る者はいなかった、と書いています。
        short: s7
        card: {head: "『徳川実紀』", body: "礼儀としきたりを知り尽くした（世の評判）"}
      - 聞き: 儀式の腕は、評判だったんだ。意地悪なおじいさんのイメージと、逆だね。
        short: s7
        tone: 納得
      - 語り: ところが、同じ文には続きがあります。だから皆が頭を下げ、吉良は付け届けをむさぼって、大きな財産をためた、と。
        card: {head: "同じ文の続き", body: "「賄賂をむさぼり」という世の噂"}
      - 聞き: 褒めたと思ったら、落としてる！ 噂は、ちゃんと本に残ってるんだ。
        tone: 驚き
      - 語り: 噂があったのは確かです。それが本当だったのかどうか。それは、この先で掘っていきます。
      - 語り: 同じ1683年、ある若い大名が、勅使をもてなす係に選ばれています。まだ10代半ばの、浅野内匠頭です。
        portrait: {image: paintings/kira_asano_portrait.jpg, caption: "浅野内匠頭（肖像画）"}
      - 聞き: あ、ここでもう会ってるんだ。じゃあ、そのときもう何かあった？
        tone: 疑問
      - 語り: このとき浅野に作法を教えたのも、吉良だったとされます。でも、このときは、何も問題は起きていません。
      - 聞き: 1回目は、うまくいったんだ。
        tone: 納得
      - 語り: この係の費用は、もてなす側の大名が出しました。
        icon: coins
      - 聞き: 自腹なの？ あーしだったら、その時点で泣いてる。
        tone: 笑い
      - 語り: このお金の話が、のちの事件の説明に、何度も出てきます。それから18年後、浅野に、2回目の係が回ってきました。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 松之大廊下の刃傷
    background: {image: paintings/kira_act3_kuniteru.jpg, credit: "歌川国輝《仮名手本忠臣蔵 三段目》（芝居の場面）"}
    portrait: null
    year: 1701
    lines:
      - 語り: 1701年、旧暦の3月14日。今の暦で4月21日です。
        short: s9
        card: {head: "元禄14年3月14日", body: "江戸城・松之大廊下（1701年4月）"}
      - 語り: この日は、将軍が、天皇の使いに返事を伝える、いちばん大事な儀式の日でした。
      - 聞き: 失敗できない本番の日。こういう日に限って、何か起きるんだよね……。
        tone: 重い
      - 語り: 昼前、江戸城の松之大廊下で、吉良は、梶川与惣兵衛という役人と立ち話をしていました。
      - 語り: そこへ浅野が後ろから近づき、小刀で吉良に切りかかります。
        tone: 重い
        icon: lightning
      - 聞き: え、後ろから！？
        tone: 驚き
      - 語り: その場にいた梶川が書き残した記録では、浅野はこう声をかけた、とされています。
      - 人物: 「この間の遺恨、覚えたるか」
        who: 浅野
      - 聞き: この間の恨み……。前に、何かあったってこと？
        tone: 疑問
      - 語り: それが、分からないんです。しかも、この言葉は、写本によっては書かれていないものもあります。「声をかけた」とだけあるものです。
      - 語り: 吉良は、額と背中にけがを負いました。梶川が浅野を後ろから抱き止め、その場は収まります。
        card: {head: "吉良のけが", body: "額と背中"}
      - 聞き: 吉良さんって、このとき何歳？
        tone: 疑問
      - 語り: 59歳です。傷は浅く、命に別状はありませんでした。でも、問題は、場所と日でした。
      - 語り: 天皇の使いを迎える儀式の日に、江戸城の中で刀を抜いた。これは、将軍の顔をつぶす、重い罪です。
        portrait: {image: paintings/kira_tsunayoshi_tosa.jpg, caption: "徳川綱吉（伝 土佐光起筆）"}
      - 聞き: 将軍って、誰だっけ？
        tone: 疑問
      - 語り: 五代将軍、徳川綱吉です。浅野は、その日のうちに切腹を命じられ、赤穂の浅野家は取り潰されました。
        card: {head: "同じ日の夕方", body: "浅野は切腹、浅野家は取り潰し"}
      - 聞き: 斬ったその日に切腹？ 裁判とか、無かったの？
        tone: 疑問
      - 語り: 裁きらしい裁きは、ありませんでした。抱き止めた梶川の記録では、浅野はこう言い続けたとあります。
        portrait: null
      - 人物: 「上野介には、この間から恨みがあった。殿中で、大事な日に申し訳ないが、討ち果たすしかなかった」
        who: 浅野
      - 聞き: 最初に聞いた「恨みがある」って、これか。殿中で悪いとは、分かってたんだ。
        tone: 納得
      - 語り: 中身は、最後まで語りませんでした。
      - 語り: この日の浅野については、もう一つ、有名な記録があります。取り調べと切腹に立ち会った役人、多門伝八郎の覚書です。
        short: s9
        card: {head: "『多門伝八郎覚書』", body: "立ち会った役人の名で伝わる覚書"}
      - 聞き: 立ち会った人の記録なら、あーしは信じちゃうけど。
        tone: 納得
      - 語り: ところが、これが要注意なんです。覚書の中で、多門は、庭先での切腹はひどいと上役に食ってかかる、正義の役人として描かれています。
        short: s9
      - 聞き: 自分で自分を、かっこよく書いてる……？
        tone: 疑問
      - 語り: 研究者の多くは、事件からかなりたってから書かれ、誇張や作り話が混じっている、と見ています。書かれている人の肩書きが、事件のときには、まだ無かったものなんです。
        short: s9
        card: {head: "覚書の注意", body: "のちに書かれ、誇張が混じる"}
      - 語り: 浅野の辞世の句として有名な、「風さそふ花よりもなほ」という歌も、この覚書や、のちの読み物に出てくるものです。本人が詠んだのかは、疑われています。
        short: s9
        icon: flower
      - 聞き: え、あの名場面の歌も！？ ドラマで何回も聞いたのに。
        short: s9
        tone: 驚き
      - 語り: 忠臣蔵の名場面には、こうした、後から書かれたものから生まれた場面が、たくさんあるんです。
      - 聞き: 吉良さんのほうは、どうなったの？
        tone: 疑問
      - 語り: お咎めなしです。それどころか、年も年だから、よく養生するように、とお見舞いの言葉までありました。
        card: {head: "吉良はお咎めなし", body: "「よく養生するように」"}
      - 聞き: 片方は切腹、片方はお見舞い……。浅野さんの家来からしたら、納得いかないよね。
        tone: 重い
      - 語り: この差が、のちの討ち入りにつながっていきます。では、浅野はなぜ斬りかかったのか。残っている説を、一つずつ掘ってみましょう。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 斬られた理由を掘る
    background: {image: paintings/kira_edo_nihonbashi_settan.jpg, credit: "長谷川雪旦《江戸名所図会 日本橋》1834年"}
    portrait: null
    year: 1701
    lines:
      - 語り: いちばん有名なのは、付け届けが少なかった、という説です。浅野が吉良に十分な礼をせず、吉良が冷たくした、という話ですね。
      - 聞き: 『徳川実紀』にあった、付け届けをむさぼったってやつだ。
        tone: 納得
      - 語り: そうです。この噂は、事件の当時からありました。ただ、どれも人づての話です。
        card: {head: "付け届け説", body: "当時からの噂。ただし人づて"}
      - 語り: のちにこの話を書きとめた学者の三宅観瀾も、結局のところ分からない、と断っているんです。
      - 聞き: 書いた人まで、分からないって言ってるの！？
        tone: 驚き
      - 語り: それに、作法を教わったら礼をするのは、当時のふつうの習わしでした。賄賂というより、お月謝のようなものです。
      - 聞き: 習い事のお礼みたいなもんか。それなら、悪いことじゃないよね。
        tone: 納得
      - 語り: もてなしの費用をめぐる話もあります。例年は1200両かかるところを、浅野は700両しか出さなかった、というものです。
        figure: {type: bars, title: もてなしの費用（両）・伝わる話, bars: [[1701年の浅野, 700], [例年かかるとされた額, 1200]], labels: ["700両", "1200両"], note: 一人の書き付けによる伝聞}
      - 聞き: 700両でも、大金だよね？
        tone: 疑問
      - 語り: 今のお金で、ざっくり1億4000万円です。ただ、この数字も、赤穂藩士の俳句の先生が書いたとされる書き付けだけが出どころです。
      - 聞き: 一人の話だけじゃ、決め手にならないか。
        tone: 納得
        figure: null
      - 語り: 次は、作法を教えなかった、意地悪をした、という説。屏風の話や、お寺の畳替えの話が有名ですね。
        icon: warning
      - 聞き: それそれ！ ドラマで、吉良さんがわざと嘘を教えるやつ。
        tone: 明るい
      - 語り: その多くは、後の時代に作られた本や、講談と呼ばれる語り物で、どんどん膨らんだ話です。
      - 聞き: ドラマで見た意地悪って、だいたい後付けなんだ。じゃあ、残る説は？
        tone: 疑問
      - 語り: 塩の話があります。吉良が、赤穂の塩の作り方を聞き出そうとして断られた、という説です。
        short: s3
        icon: drop
      - 聞き: 赤穂の塩って、有名だもんね。あーし、それが一番ありそうって思った。
        short: s3
        tone: 納得
      - 語り: ところが、これを事件の原因とする説が出てきたのは、戦後なんです。1982年の大河ドラマで、広く知られるようになりました。
        short: s3
        card: {head: "塩の説", body: "事件の原因と言われ出したのは戦後"}
      - 聞き: 戦後！？ 事件から250年近くたってから？
        short: s3
        tone: 驚き
      - 語り: しかも、当時の吉良の領地には塩田がなかった、という反論が、地元から出ています。
        short: s3
      - 聞き: 塩田がないなら、聞き出す理由もないじゃん。
        short: s3
        tone: 納得
      - 語り: 浅野の体の具合を挙げる研究者もいます。浅野には、胸がつかえる持病があったと記録されています。
      - 聞き: それが、事件の日に悪くなったってこと？
        tone: 疑問
      - 語り: その可能性はあります。でも、それが理由だと言い切れる記録は、ありません。
      - 語り: 吉良のほうは、取り調べで、浅野は乱心したのではないか、と答えた、とあの覚書にはあります。
      - 聞き: 乱心って、気が変になったってこと？ 自分を斬った人を、かばってるみたい。
        tone: 疑問
      - 語り: 歴史学者の山本博文さんは、ここに注目しています。もし浅野が乱心を認めていれば、もっと軽い処分で済んだかもしれない、というんです。
      - 聞き: でも浅野さんは、恨みがあったって言っちゃった。
        tone: しみじみ
      - 語り: 山本さんは、偉い人たちの前で、吉良に面目をつぶされるようなことを言われ、武士として引けなくなったのではないか、とも考えています。
      - 聞き: それも、ありそう。でも、証拠は？
        tone: 疑問
      - 語り: これも推測です。
      - 語り: 研究者の多くも、本当の理由は史料からは分からない、と考えています。
        short: s2
        card: {head: "研究者の見方", body: "理由は史料からは分からない"}
      - 聞き: 理由が分からないのに、なんで吉良さんだけ悪者になっちゃったの？
        tone: 疑問
      - 語り: それは、最後の層で掘ります。その前に、事件のあとの吉良を見ておきましょう。斬られたあと、吉良の暮らしは、静かに追い込まれていきます。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 本所へ、そして討ち入り
    background: {image: paintings/kira_ryogoku_hiroshige.jpg, credit: "歌川広重《名所江戸百景 両国橋大川ばた》1856年"}
    portrait: null
    year: 1701
    lines:
      - 語り: 事件から半月ほどで、吉良は、高家のまとめ役を辞めたいと願い出ました。
        card: {head: "元禄14年3月26日", body: "役を辞めたいと願い出る"}
      - 聞き: お咎めなしだったのに、辞めちゃうんだ。
        tone: 疑問
      - 語り: 8月には、屋敷を移るよう命じられます。江戸城のすぐ近くの呉服橋から、隅田川を渡った向こう、本所へ。
        card: {head: "元禄14年8月", body: "呉服橋から本所へ屋敷替え"}
      - 聞き: 本所って、遠いの？
        tone: 疑問
      - 語り: 当時の本所は、江戸の中心から川を隔てた、外れのほうでした。のちに、討ちに行きやすくするためだった、と語られることもあります。
      - 語り: ただ、幕府がどういうつもりだったのかは、記録からは分かりません。
      - 聞き: また分からないんだ。この話、分からないことだらけ。
        tone: 笑い
      - 語り: そして、その年の暮れ、吉良は隠居して、家を孫の義周に譲りました。あの上杉綱憲の次男です。
        card: {head: "元禄14年の暮れ", body: "隠居し、孫の義周に家を譲る"}
      - 聞き: 浅野さんの家来たちは、そのあいだ何してたの？
        short: s8
        tone: 疑問
      - 語り: 赤穂の城を明け渡したあと、家老の大石内蔵助を中心に、浅野家を立て直してもらえないか、幕府に願い続けていました。
        short: s8
        portrait: {image: paintings/kira_oishi_portrait_edo.jpg, caption: "大石内蔵助（江戸時代の肖像画）"}
      - 語り: でも、その望みが絶たれると、1702年の夏、京都で、討ち入りを決めます。
        short: s8
        card: {head: "元禄15年7月", body: "京都で討ち入りを決める"}
        year: 1702
      - 聞き: ついに、決めちゃったんだ……。
        tone: 重い
      - 語り: 大石が付けていた帳簿が、今も残っています。討ち入りまでに使ったお金は、およそ700両です。
        short: s8
        figure: {type: money, title: 討ち入りまでに使ったお金, then: "約700両", yen: 140000000, basis: "大石内蔵助の帳簿による。日雇いの日当200文を今の1万円とした目安（1両≒20万円）"}
      - 聞き: 帳簿まで残ってるの！？ 大石さん、几帳面。
        short: s8
        tone: 驚き
      - 語り: 日当を1万円とすると、ざっくり1億4000万円です。
        short: s8
      - 語り: 偶然ですが、もてなしの費用として伝わる額と、同じくらいです。
      - 語り: 江戸に潜むための家賃や、旅の費用、武具などが、細かく書き込まれています。
        short: s8
        icon: notebook
      - 聞き: 家賃に旅費に武具……。1年以上、大勢の暮らしって考えたら、むしろ安いくらいかも。
        short: s8
        tone: 納得
        figure: null
        portrait: null
      - 語り: そして、元禄15年12月14日の夜。今の暦で言うと、1703年の1月の終わりです。
        card: {head: "元禄15年12月14日", body: "討ち入り（今の暦で1703年1月30日の夜）"}
        year: 1703
      - 語り: 47人の浪士が、表と裏の二手に分かれて、本所の吉良の屋敷に入りました。
        short: s10
        background: {image: paintings/kira_night_attack_shunsen.jpg, credit: "勝川春扇《浮絵忠臣蔵 十一段目》1806年以降（芝居の絵）"}
      - 語り: 屋敷のあった場所は、今の東京都墨田区の両国です。跡地の一部は、小さな公園になっています。
      - 聞き: 両国って、相撲の？ 今だと、駅から歩いて行ける所じゃん。
      - 語り: 当時は、隅田川の向こうの新しい町でした。
      - 聞き: 吉良さんの家にも、家来はいたんだよね。
        tone: 疑問
      - 語り: たくさんいました。屋敷の側では、十数人が亡くなり、二十人前後がけがをしたと伝わります。
      - 語り: 跡を継いでいた孫の義周も、なぎなたで戦って、けがを負いました。
      - 聞き: 義周さんって、孫だよね。まだ若いんじゃない？
        tone: 疑問
      - 語り: 数えで17歳です。
      - 語り: 吉良は、台所のそばの物置のような部屋で見つかり、討たれました。61歳でした。
        short: s10
        tone: 重い
        card: {head: "吉良の最期", body: "満61歳（数えで62歳）"}
      - 聞き: ……そっか。
        tone: 重い
      - 語り: 浪士たちは、主君の墓のある泉岳寺へ向かい、仇を討ったと報告しました。
        short: s10
        background: {image: paintings/kira_sengakuji_entry_hiroshige.jpg, credit: "歌川広重《忠臣蔵 夜討 焼香場》1835〜39年ごろ（芝居の絵）"}
      - 語り: ちなみに、討ち入ったのは47人ですが、泉岳寺に着いたのは46人でした。寺坂吉右衛門という足軽が、引き揚げのころに姿を消したとされます。
        short: s10
      - 聞き: え、一人いなくなったの？ なんで？
        short: s10
        tone: 驚き
      - 語り: 理由は、昔から謎のままです。この人だけは切腹にならず、80歳を過ぎるまで生きたと伝えられています。
        short: s10
      - 聞き: それで、上杉家は？ あーしが息子なら、絶対黙ってない。
        tone: 疑問
      - 語り: 綱憲が兵を出そうとして、家老に止められた、という話が有名です。ただ、これは劇や講談で知られた話で、当時の記録では確かめられていません。
      - 語り: そして、この話には、あまり語られない続きがあります。
        hook: true
      - 聞き: 続きって、討ち入りで終わりじゃないの？
        tone: 疑問

  # ---------------------------------------------------------------- 8
  - title: 消えた吉良家と、名君の伝説
    background: {image: paintings/kira_takanawa_hiroshige.jpg, credit: "歌川広重《東都名所 高輪之図》1837年ごろ"}
    portrait: null
    year: 1703
    lines:
      - 語り: 年が明けた、元禄16年の2月4日。今の暦で1703年3月です。浪士たちは、預けられていた大名の屋敷で、切腹を命じられます。
        short: s5
        card: {head: "元禄16年2月4日", body: "浪士46人に切腹の命令"}
      - 語り: そして、まったく同じ日。吉良の孫、義周も、呼び出されていました。
        short: s5
      - 聞き: 義周さんも？ 討ち入りされた側なのに？
        short: s5
        tone: 驚き
      - 語り: 言い渡されたのは、討ち入りへの対応がよくなかった、というものです。領地を取り上げられ、信濃の諏訪へ預けられました。
        short: s5
        card: {head: "同じ日", body: "義周は領地を取り上げられ諏訪へ"}
      - 聞き: 斬られて、守ろうとしてけがして、それで罰を受けるの……。
        short: s5
        tone: 重い
      - 語り: 義周は、3年後の1706年、諏訪で病気で亡くなりました。数えで21歳です。こうして、吉良の家は絶えました。
        short: s5
        card: {head: "1706年", body: "義周が諏訪で死去。吉良家は断絶"}
      - 聞き: 家はそのまま続くと思ってた。斬られた側なのに、まるごと消えちゃったんだ。
        short: s5
        tone: しみじみ
      - 語り: 米沢藩主だった息子の綱憲も、父が討たれた翌年、1704年に亡くなっています。
        card: {head: "1704年", body: "息子の上杉綱憲も死去"}
      - 聞き: 親子そろって……。上杉家にとっても、つらい数年だったんだ。
        tone: 重い
      - 語り: 物語では、ここはまず描かれません。
      - 聞き: じゃあ、地元の人は、吉良さんのこと、どう思ってたの？
        tone: 疑問
      - 語り: 今の愛知県西尾市、吉良町では、吉良は名君として語られてきました。
        short: s6
        background: {image: paintings/kira_okazaki_hiroshige.jpg, credit: "歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ"}
      - 語り: 有名なのは、黄金堤です。水害に苦しむ村のために、吉良が、領民と一緒に、たった一晩で堤を築いた。そのおかげで良い田んぼになったので、黄金の堤と呼んだ、という話です。
        short: s6
      - 聞き: え、すごくいい人じゃん！ あーし、名君説に乗り換える。
        tone: 明るい
      - 語り: ここも、掘ってみましょう。吉良家には、当主3代が書きついだ日記が残っています。
        short: s6
        icon: book-open
      - 語り: ところが、その日記には、黄金堤の話が、一行も出てきません。黄金堤という名前が初めて記録に出るのは、明治17年です。
        short: s6
        card: {head: "黄金堤", body: "名前の初出は明治17年（1884年）"}
      - 聞き: 名君の話まで、記録なし……。じゃあ、吉良さんって、そもそも領地にいたの？
        tone: 疑問
      - 語り: 24回も京都へ行き来して、東海道を何度も通ったはずなのに、吉良が三河の領地に来たと記録で確かめられるのは、生涯でたった1回。1677年、京都からの帰り道です。
        short: s6
        card: {head: "1677年", body: "領地に来た記録はこの1回だけ"}
      - 聞き: 1回だけ！？ それで一晩で堤を作るのは、さすがに無理がある。
        short: s6
        tone: 驚き
      - 語り: 赤い馬に乗って領地を見回った、という話もありますが、郷土玩具の赤馬が作られ始めたのは、吉良が亡くなって130年ほどあとです。
      - 聞き: 悪く言う話にも、よく言う話にも、裏づけが薄いってことか。
        tone: 納得
      - 語り: それでも地元では今も、毎年12月14日に、吉良の菩提寺、華蔵寺で法要が開かれています。
        card: {head: "毎年12月14日", body: "華蔵寺で吉良の法要"}
      - 聞き: 討ち入りの日に、地元では吉良さんのために手を合わせてるんだ。
        tone: しみじみ
      - 語り: 華蔵寺には、吉良の墓もあります。吉良が自分で色を塗ったと伝わる木像も、その日に見ることができます。50歳のころの姿と伝えられる像です。
      - 聞き: 50歳の吉良さん。どんな顔なんだろう。
        tone: 疑問
        portrait: {image: paintings/kira_statue_bust.jpg, caption: "吉良上野介の木像（華蔵寺、1910年ごろの写真）", age: false}
      - 語り: 穏やかな顔つきの、品のいい像です。物語の憎らしい顔とは、ずいぶん印象がちがいますよ。
      - 語り: では、最後の層です。記録の少ない一人の役人が、なぜ、日本でいちばん有名な悪役になったのか。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：悪役の顔は、誰の顔か
    background: {image: paintings/kira_kenkaba_kunisada_1856.jpg, credit: "歌川国貞《けんくわ場 高師直・塩谷判官》1856年（芝居の役者絵）"}
    portrait: null
    year: 1703
    lines:
      - 語り: 悪役になった理由は、大きく3つあると、僕は見ています。
      - 聞き: 3つも？ 聞かせて。
        tone: 疑問
      - 語り: 一つ目は、浪士たちが、正しい行いをした「義人」になったことです。
        card: {head: "理由1", body: "浪士が「義人」になった"}
      - 語り: 討ち入りの年、儒学者の室鳩巣は、浪士たちを「義人」とたたえる本を書きます。
      - 聞き: 当時の人は、みんなそう思ってたの？
        tone: 疑問
      - 語り: 学者のあいだでは、意見が割れました。荻生徂徠たちは、浅野を罰したのは幕府で、吉良は主君の仇ではない、と批判しています。
      - 語り: でも、たたえる声のほうが、ずっと大きく広がっていきました。浪士が義人なら、討たれた吉良は、悪人でなければ話が合いません。
      - 聞き: 浪士がヒーローになるほど、吉良さんは悪くされていく……。主役を立てるための悪役、みたいな。
        tone: 重い
      - 語り: そうです。二つ目が、お芝居です。幕府は、今の出来事を芝居にすることを禁じていました。
        card: {head: "理由2", body: "芝居で悪役の役柄に重ねられた"}
      - 語り: そして、討ち入りから45年後の1748年。大坂で、ある人形浄瑠璃が初めて上演されました。『仮名手本忠臣蔵』です。
        short: s1
        card: {head: "1748年", body: "『仮名手本忠臣蔵』初演"}
        year: 1748
      - 聞き: 忠臣蔵の、元祖みたいなやつ？
        tone: 疑問
      - 語り: そうです。大当たりして、その年のうちに歌舞伎にもなりました。ただし、幕府の禁止を避けるために、話の舞台を、およそ400年前の室町時代に移しています。
      - 語り: 浅野も大石も名前を変え、そして吉良は、高師直という人物に置き換えられました。
        short: s1
        figure: {type: compare, title: 吉良は誰に置き換えられたか, people: [[吉良上野介, paintings/kira_statue_bust.jpg, 実在の高家・儀礼の役人], [高師直（芝居の絵）, paintings/kira_moronao_kuniyoshi_c.jpg, 『太平記』の強欲な悪役]]}
      - 聞き: 高師直って、誰？
        short: s1
        tone: 疑問
      - 語り: 室町時代の武将です。軍記物語の『太平記』で、人の妻に横恋慕する、強欲な権力者として描かれてきました。
        short: s1
      - 聞き: もともと悪役の人なんだ！
        short: s1
        tone: 驚き
      - 語り: つまり吉良は、はじめから「悪役の役柄」に重ねて描かれたんです。私たちが思い浮かべる吉良の顔は、まず、高師直の顔だったのかもしれません。
        short: s1
      - 聞き: 最初に剣崎さんが言ってた、別の人物の顔って、これか！
        tone: 驚き
        figure: null
      - 語り: 三つ目は、語られるたびに、足されていったことです。
        card: {head: "理由3", body: "語られるたびに意地悪が足された"}
      - 語り: 講談や浪曲で、付け届けや意地悪の場面が、どんどん足されていきます。明治には新聞の連載や映画、戦後はテレビ。忠臣蔵は、年末の定番になりました。
        card: {head: "講談 → 新聞・映画 → テレビ", body: "意地悪の場面が足されていく"}
      - 聞き: 伝言ゲームみたいに、話すたびに意地悪が増えていったんだ。
        tone: 納得
      - 語り: 一方で、地元の名君の話も、記録で確かめられるのは、黄金堤の名前が出てくる明治からです。悪役の像が大きくなるほど、そうじゃない、という声も生まれたのかもしれません。
      - 聞き: 悪役も名君も、どっちも後から作られた顔。じゃあ、本当の吉良さんは？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。儀礼をよく知る高家のまとめ役で、京都へ何度も上り、息子を米沢の殿様に出した名門の当主。
      - 語り: 59歳で突然斬りつけられ、理由も分からないまま役を退き、61歳で討たれ、孫の代で家が絶えた人。
        tone: しみじみ
      - 聞き: 意地悪な悪役でも、名君でもなくて……。理由も分からないまま、巻き込まれた人、なのかも。
        tone: しみじみ
      - 語り: つむぎさんの言うとおりだと、僕も思います。いじめたかどうかは、記録からは分かりません。でも、分からないまま悪役にされてきたことは、はっきりしています。
        tone: しみじみ
      - 聞き: 地表の下に、ぜんぜん別の吉良さんがいた。今日も、ちゃんと掘れた気がする。
        tone: 納得
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、戦国から、明智光秀。「敵は本能寺にあり」って言ったことになってるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

