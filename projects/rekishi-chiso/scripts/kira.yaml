      - 語り: 赤い馬に乗って領地を見回った、という話もありますが、郷土玩具の赤馬が作られ始めたのは、吉良が亡くなって130年ほどあとです。
        short: s6
      - 語り: しかも、吉良が自分の領地に来たと、記録で確かめられるのは、生涯でたった1回。1677年、京都からの帰り道です。
        card: {head: "1677年", body: "領地に来た記録はこの1回だけ"}
      - 聞き: 1回だけ！？ じゃあ、一晩で堤を作るのも、難しくない？
        tone: 驚き
      - 語り: 悪役の話にも記録がなく、名君の話にも記録がない。どちらも、後の時代の人が作っていった姿なんです。
      - 聞き: 悪く言う側も、よく言う側も、盛ってるってことか。
        tone: 納得
      - 語り: それでも地元では今も、毎年12月14日に、吉良の菩提寺、華蔵寺で法要が開かれています。吉良が自分で色を塗ったと伝わる木像も、その日に開かれます。
        card: {head: "毎年12月14日", body: "華蔵寺で吉良の法要"}
      - 聞き: 討ち入りの日に、地元では吉良さんのために手を合わせてるんだ。
        tone: しみじみ
      - 語り: 華蔵寺は、吉良の曾祖父が、1600年に建てたお寺です。吉良の墓もここにあります。木像は、50歳のころの姿を刻んだものと伝えられ、愛知県の文化財になっています。
      - 聞き: 50歳の吉良さん。どんな顔なんだろう。
        tone: 疑問
      - 語り: 穏やかな顔の、品のいい老人の像です。物語の憎らしい顔とは、ずいぶん印象がちがいますよ。
      - 語り: では、最後の層です。記録の少ない一人の役人が、なぜ、日本でいちばん有名な悪役になったのか。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：悪役の顔は、誰の顔か
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1748
    lines:
      - 語り: 悪口は、生きているうちからありました。尾張藩の武士の日記には、吉良は欲深い者だから、という噂が書きとめられています。
        card: {head: "当時の日記", body: "「吉良は欲深き者」という噂"}
      - 聞き: 噂は、もうあったんだ。
        tone: 疑問
      - 語り: 事件の直後には、この事件をもとにした芝居も作られました。でも幕府は、今の出来事を芝居にすることを禁じます。
      - 語り: 学者のあいだでも、意見は割れました。儒学者の室鳩巣は、浪士たちを「義人」とたたえる本を書きます。一方で、荻生徂徠たちは、浪士の行いを、法を破ったものだと批判しました。
        card: {head: "1703年〜", body: "浪士は「義人」か、法を破った者か"}
      - 聞き: 当時から、ほめる人と、批判する人がいたんだ。
        tone: 疑問
      - 語り: はい。でも、ほめる声のほうが、ずっと大きく広がっていきました。浪士が義人なら、討たれた吉良は、悪人でなければ話が合わない。
      - 聞き: 浪士がヒーローになるほど、吉良さんは悪くされていく……。
        tone: 重い
      - 聞き: じゃあ、どうやって、あんなに有名になったの？
        tone: 疑問
      - 語り: 討ち入りから45年後の1748年。大坂で、ある人形浄瑠璃が初めて上演されました。『仮名手本忠臣蔵』です。
        short: s1
        card: {head: "1748年", body: "『仮名手本忠臣蔵』初演"}
      - 聞き: 忠臣蔵の、元祖みたいなやつ？
        short: s1
        tone: 疑問
      - 語り: そうです。大当たりして、その年のうちに歌舞伎にもなりました。ただし、幕府の禁止を避けるために、話の舞台を、400年近く前の室町時代に移しています。
      - 聞き: 時代ごと、変えちゃったんだ。じゃあ、登場人物は？
        short: s1
        tone: 疑問
      - 語り: 浅野は、塩冶判官。大石は、大星由良助。そして吉良は、高師直という人物に置き換えられました。
        short: s1
        figure: {type: compare, title: 吉良は誰に置き換えられたか, people: [[吉良上野介, TODO, 実在の高家・儀礼の役人], [高師直, TODO, 『太平記』の強欲な悪役]]}
      - 聞き: 高師直って、誰？
        short: s1
        tone: 疑問
      - 語り: 室町時代の武将です。軍記物語の『太平記』で、人の妻に横恋慕する、強欲な権力者として描かれてきました。
        short: s1
      - 聞き: もともと悪役の人なんだ！
        short: s1
        tone: 驚き
      - 語り: そうなんです。つまり吉良は、はじめから「悪役の役柄」に重ねて描かれたんです。
        short: s1
      - 聞き: それって、吉良さん本人を見て描いたんじゃなくて、悪役の型に、はめこんだってこと？
        tone: 疑問
      - 語り: そう見ることができます。私たちが思い浮かべる吉良の顔は、まず、高師直の顔だったのかもしれません。
        short: s1
        figure: null
      - 聞き: 最初に剣崎さんが言ってた、別の人物の顔って、これか！
        tone: 驚き
      - 語り: そのあと、講談や浪曲で、付け届けや意地悪の場面が、どんどん足されていきます。明治には新聞の連載、昭和には映画とテレビ。忠臣蔵は、年末の定番になりました。
        card: {head: "講談 → 新聞 → 映画", body: "意地悪の場面が足されていく"}
      - 聞き: 足されるたびに、吉良さんが、どんどん意地悪になっていったんだ。
        tone: 納得
      - 語り: 戦争に負けたあとの一時期、占領軍は、忠臣蔵の上演を制限しました。仇討ちをたたえる、古い考えの話だ、という理由です。
        card: {head: "1947年", body: "忠臣蔵の上演の制限が解かれる"}
      - 聞き: 忠臣蔵が、止められた時期もあったんだ。
        tone: 驚き
      - 語り: 1947年に制限が解かれると、ふたたび何度も作られ、そのうち、吉良の側や、討ち入りに加われなかった人の側から描く作品も、増えていきました。
      - 語り: 物語には、悪役が要ります。47人の忠義が輝くためには、討たれる側は、憎らしいほどいい。
      - 聞き: 主役を立てるために、悪役が盛られていったってことか……。
        tone: しみじみ
      - 語り: 一方で、地元の名君の話も、明治のころから語られ始めます。悪役の像が大きくなるほど、そうじゃない、という声も生まれたのかもしれません。
      - 聞き: 悪役も名君も、どっちも後から作られた顔。じゃあ、本当の吉良さんは？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。儀礼をよく知る高家のまとめ役で、京都へ何度も上り、息子を米沢の殿様に出した名門の当主。
      - 語り: 59歳で突然斬りつけられ、理由も分からないまま役を退き、61歳で討たれ、孫の代で家が絶えた人。
        tone: しみじみ
      - 聞き: 意地悪な悪役でも、名君でもなくて……。理由も分からないまま、巻き込まれた人、なのかも。
        tone: しみじみ
      - 語り: 僕も、そう思います。いじめたかどうかは、記録からは分かりません。でも、分からないまま悪役にされてきたことは、はっきりしています。
        tone: しみじみ
      - 聞き: 地表の下に、ぜんぜん別の吉良さんがいた。今日も、ちゃんと掘れた気がする！
        tone: 明るい
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、戦国から、明智光秀。「敵は本能寺にあり」って言ったことになってるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

