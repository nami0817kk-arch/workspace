# 想像（6か所。roles の淀殿想像＋imagined: true）：
#   1 「父上、母上。茶々は、生きております」……二度の落城を逃れた（前置き・yodo-17）。気持ちだけ
#   2 「秋刀魚、とは……。殿下らしいこと」……秀吉の手紙（yodo-25・49）。気持ちだけ
#   3 「この子だけは……。この子だけは、守らねば」……1601年の診療・幼い秀頼（yodo-27）。気持ちだけ
#   4 「この身を、江戸へ……」……人質の条件（yodo-06）。どう答えたかは言わない
#   5 「初……。どうか、頼みます」……常高院を頼んで詫びた（yodo-10）。気持ちだけ
#   6 「……三度目、なのですね」……三度目の落城（前置き）。気持ちだけ（最期の前に置く。場面の細部は無し）
