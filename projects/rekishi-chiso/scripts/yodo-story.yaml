      # fact: yodo-15
      - 語り: 明治26年の『日本史料』は、大野治長ら25人と、侍女7人。明治29年の竹越与三郎の本は、男女あわせて42人。山路愛山の『徳川家康』では、30人あまりです。
        figure: {type: bars, title: 淀殿・秀頼とともに死んだ人の数　本による違い, bars: [[日本史料（1893年）, 32], [山路愛山『徳川家康』, 30], [竹越与三郎（1896年）, 42]], labels: ["25人と侍女7人", "30人あまり", "42人"]}
      - 語り: 誰が、何人、その場にいたのか。確かな数は、本の数字からは、決められません。
