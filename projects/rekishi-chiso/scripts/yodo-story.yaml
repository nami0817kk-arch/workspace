# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  口が耳まで広がり、蛇の性を帯びた女。江戸時代の大坂で読まれた絵本は、豊臣秀頼の母、淀君を、そう描きました。
  けれど、その200年ほど前。秀吉は、灸をすえた「おちゃちゃ」の体を案じ、秋刀魚を送ったから食べなさい、と手紙に書いていました。
  秋刀魚を受け取った女性が、どうして、蛇の女になったのか。なぜ淀殿は、「悪女」にされたのか。
  この動画でわかること
  ・1938年から行方が分からず、2017年に79年ぶりの発見として公表された、秀吉の「おちゃちゃ」あての手紙
  ・父のための養源院、石山寺や京の大仏殿の建て直しと、「秀頼御袋より」という記録
  ・大坂の陣の最期をめぐって食い違う記録と、イギリス商館長コックスの日記
  ・「淀君」と蛇の話はどこから来たのか――『絵本太閤記』と、その元になった怪談
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（秀吉の書状、『当代記』、『時慶卿記』、曲直瀬玄朔の診療の記録、コックスの日記、『近世日本国民史』など）を語りで示してから読んでいます。
  『絵本太閤記』と『唐土の吉野』の話は、飯倉洋一さんの論文（『語文』114、大阪大学、2020年）によっています。

en:
  title: "Lady Yodo: Why Was Toyotomi Hideyori's Mother Turned Into a Villain?"
  description: |-
    A woman whose mouth spread to her ears, possessed by the nature of a snake - that is how a popular illustrated book of Edo-period Osaka portrayed Lady Yodo, mother of Toyotomi Hideyori.
    Yet some two hundred years earlier, Hideyoshi wrote to his "O-Chacha," worried about her health, and told her he had sent her saury to eat.
    How did the woman who received that fish become a snake-woman? Why was Lady Yodo made into a villain?
    In this video you will learn:
    - Hideyoshi's letter to "O-Chacha," lost after 1938 and made public in 2017 as a rediscovery after 79 years
    - The temples she built and rebuilt, and a court diary that credits "Hideyori's mother"
    - Conflicting records of the fall of Osaka Castle, including the diary of the English merchant Richard Cocks
    - Where the name "Yodo-gimi" and the snake story came from: the Ehon Taikoki and the ghost story behind it
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Who Turned Lady Yodo Into a Snake? The Ehon Taikoki, 1802"
    - "Why Did Chacha Build a Temple for Her Father? Two Fallen Castles and Yogen-in"
    - "\"I Am Sending You Saury\": Yodo Castle and Hideyoshi's Letter"
    - "\"From Hideyori's Mother\": Temples and Osaka Castle After Hideyoshi"
    - "What Happened at the Third Fall? Osaka, 1615"
    - "When Was \"Yodo-gimi\" Born? From the Osaka Monogatari to the Ehon Taikoki"
    - "Summary: Why Was Lady Yodo Made a Villain?"

