        figure: null
      # fact: yodo-33
      - 語り: そのあと、コックスは、秀頼が生きていて、薩摩か琉球へ逃げた、といううわさも、書きとめます。ただし、自分は、それを疑っている、と。
      - 語り: 茶々の亡骸は、見つかった、と書かれた。コックスの日記で、生き延びたといううわさが書きとめられたのは、息子の秀頼のほうでした。
        tone: しみじみ
      # Pagès p.310
      # fact: yodo-34
      - 語り: 宣教師の記録をまとめたパジェスの本は、また違います。秀頼は、町の中で、死に方も知られないまま倒れたらしい、と書き、母の最期には、触れていません。
        figure: {type: stats, title: 秀頼と茶々の最期　書き方の違い, items: [[明治〜昭和の日本の本, 山里丸の蔵で自ら命を絶つ, ともに死んだ人は30あまり〜42人], [コックスの日記, 母は見つかり 秀頼は見つからない, 平戸で聞いた知らせ], [パジェスの本, 秀頼は町の中で倒れたらしい, 母の最期は書かない]]}
      # 観光庁 多言語解説文（大阪国防館跡 2022）
      # fact: yodo-24
      - 語り: 秀頼が最後にいた場所も、ひとつではありません。観光庁の解説の一つは、本丸の真ん中、いまの大阪国防館の跡を、秀頼が最後の抵抗をしたと言われる場所としています。
        figure: null
      - 語り: こうして、茶々は、大坂城で、生涯を終えました。けれど、茶々の物語は、ここから、書き換えられていきます。
        hook: true
      - 語り: 蛇の女の話は、どこから来たのでしょうか。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 検証「淀君」はいつ生まれたのか（この章だけ通説の検証）
  - title: 「淀君」はいつ生まれたのか　『大坂物語』から『絵本太閤記』へ
    background: {image: paintings/yodo_yoshitoshi_1873.jpg, credit: "月岡芳年《淀の君》1873年"}
    # AI絵：Y14 は使わない。Y15 以外の読本の場面は Y01（行灯の下の本）・Y03（江戸の大坂の本屋の店先）
    year: 1802
    lines:
      # fact: yodo-01
      - 語り: まず、冒頭でも触れた、呼び名です。歴史家の濱田浩一郎さんは、2026年の記事で、淀君と呼んだものは、彼女の生きた時代の史料には無い、としています。
      # fact: yodo-01
      - 語り: ところが、江戸時代の後半の『絵本太閤記』では、もう、淀君です。明治13年に出た歴史の本でも、「秀頼の母、淀君」。
        card: {head: "明治13年の本", body: 「秀頼の母 淀君」}
      # fact: yodo-43
      - 語り: 悪い女としての茶々も、少しずつ、作られていきました。飯倉さんの論文が紹介する整理では、淀君を悪女として描く作品は、徳川の世を正しいとする見方のものに、多い。
        card: {head: "悪女の淀君", body: 徳川の世を正しいとする見方に多い}
      # fact: yodo-43
      - 語り: 例に挙がるのは、江戸の初めの読み物、『大坂物語』や、合戦の物語、『難波戦記』などです。
        figure: {type: numberline, title: 淀君の悪女像にかかわる本, items: [[大坂物語, 1615], [難波戦記, 1672], [唐土の吉野, 1783], [絵本太閤記, 1797], [胆大小心録, 1808], [明治の歴史の本, 1880]], unit: 年, focus: 絵本太閤記}
      - 語り: 勝った側の物語の中で、滅びた城の女主人は、悪役にされやすかったのかもしれません。
        tone: しみじみ
      # fact: yodo-11
      - 語り: ところが、飯倉さんは、悪女の像を形づくるのに大きく関わったのは、徳川の側が書いたわけではない本だった、と見ています。それが、『絵本太閤記』です。
        tone: 強調
        background: {image: paintings/yodo_ehon_taikoki_kiyosu.jpg, credit: "岡田玉山画『絵本太閤記』の挿絵（1797〜1802年）"}
      # fact: yodo-44
      - 語り: 『絵本太閤記』は、大坂の版元から、寛政9年、1797年に出始めた、秀吉の一代記です。七つの編、84冊。挿絵が、全体の4割ほどを占める本で、大いに読まれました。
        figure: null
        card: {head: "絵本太閤記", body: 大坂の版元 七編84冊}
      # fact: yodo-45
      - 語り: その五編の挿絵には、北政所の像と、淀君の像が、左右に並びます。そして、淀君の像の上には、大きな蛇が、描かれていました。
        tone: 強調
        portrait: {image: paintings/yodo_kodaiin.jpg, caption: "高台院・北政所（高台寺本の模写、1910年）"}
        card: {head: "五編の挿絵", body: 淀君の像の上に大蛇}
      # fact: yodo-11
      - 語り: 飯倉さんによれば、この本は、正室の北政所を、貞淑で賢い妻として、淀君を、その正反対の女として、はっきり書き分けています。
        portrait: null
      # fact: yodo-12
      - 語り: 最後の巻の、「淀君行状」では、淀君は、祈祷で美しさを取り戻したあと、蛇の性を帯び、口が耳まで広がった、と書かれます。
        tone: 重い
        portrait: null
        # AI絵：Y01（行灯の下の挿絵入りの本・大蛇の挿絵）
      # fact: yodo-13
      - 語り: この話は、天明3年、1783年に、同じ大坂で出た読み物、『唐土の吉野』の、ある怪談と、文章も、挿絵の構図も、よく似ています。
        card: {head: "1783年の怪談", body: 『唐土の吉野』の一話}
      # fact: yodo-13
      - 語り: その怪談でも、鏡で衰えに気づいた女性が、僧の祈祷で美しさを取り戻し、やがて、蛇の姿になっていきます。
      # fact: yodo-13
      - 語り: 飯倉さんは、断言はできないとしながらも、『絵本太閤記』が、そこから《借りた》可能性が高い、と見ています。
        tone: 強調
      - 語り: では、なぜ、蛇にしたのか。
        tone: 疑問
      # fact: yodo-46
      - 語り: 飯倉さんの見立ては、こうです。淀君を蛇の性にすれば、正室の北政所の正しさが、いっそう引き立つ。
        portrait: {image: paintings/yodo_kodaiin.jpg, caption: "高台院・北政所（高台寺本の模写、1910年）"}
      # fact: yodo-46
      - 語り: そして、淀君をかわいがった秀吉も、相手が実は蛇だったのなら、仕方がなかった、と、かばうことができる。
        portrait: {image: paintings/yodo_hideyoshi_portrait.jpg, caption: "豊臣秀吉（狩野光信筆、高台寺）"}
      - 語り: 秀吉の一代記の中で、秀吉と北政所を立てるために、蛇の淀君が、使われた、というわけです。
        tone: しみじみ
        portrait: null
      # 呉座勇一（PRESIDENT Online 2025、『真説 豊臣兄弟とその一族』より）
      # fact: yodo-30
      - 語り: 北政所と淀殿の仲が悪かった、という話も、よく語られます。けれど、歴史学者の呉座勇一さんは、この不仲の説は、一次史料による確かめを、欠いている、と指摘しています。
        card: {head: "北政所と淀殿の不仲", body: 一次史料での確かめが無い}
      # fact: yodo-44
      - 語り: 『絵本太閤記』は、文化元年、1804年に、絶板を命じられます。けれど、話は、残りました。
        card: {head: "1804年", body: 絵本太閤記に絶板の命令}
      # 小林明（PRESIDENT Online 2026）
      # fact: yodo-29
      - 語り: 文化5年、1808年の『胆大小心録』という本には、淀君は、顔がよいだけでなく、色を好む性だった、と書かれます。
        background: {image: paintings/yodo_yoshitoshi_1873.jpg, credit: "月岡芳年《淀の君》1873年"}
        # AI絵：Y03（江戸時代の大坂の本屋の店先・積まれた本）
      # 『國史略』（1880）・『全学科表解』（1912）・『少国民の日本史』（1926）
      # fact: yodo-14
      - 語り: 明治から大正の歴史の本や学習書も、「淀君」の名のまま、その最期を書きました。秀頼は二十三、淀君は三十九。何冊もの本が、同じ書き方を、並べています。
        card: {head: "明治・大正の本", body: 「淀君」の名のまま}
      # 奈良県立美術館（Google Arts & Culture の所蔵品の題）・アートアジェンダ（2020）
      # fact: yodo-08
      - 語り: この動画で映してきた肖像も、奈良県立美術館では、「伝淀殿画像」。淀殿と伝わる女性の肖像、という題です。本人を描いたと、確かめられているわけでは、ありません。
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
        card: {head: "伝淀殿画像", body: 淀殿と「伝わる」肖像}
      # 『国史大辞典』（山本博文執筆）。飯倉論文 p.1 が引く
      # fact: yodo-47
      - 語り: そして、日本史の大きな辞典、『国史大辞典』で、歴史学者の山本博文さんは、淀君の乱行などというのは、江戸時代の臆説だ、と書きました。
        tone: 強調
        card: {head: "国史大辞典", body: 淀君の乱行は江戸時代の臆説}
      - 語り: 蛇の女は、記録の中の茶々ではありません。200年のあいだに、読み物の中で、育っていった姿だったんです。
        tone: しみじみ
      - 語り: では、記録に残る茶々は、いま、どこに眠っているのでしょうか。
        hook: true
      - 語り: その答えも、ひとつでは、ありませんでした。
        tone: 重い
        hook: true

  # ================================================================ まとめ ③亡骸の在りか→答え→冒頭に戻る
  - title: まとめ：淀殿はなぜ悪女にされたのか　太融寺の墓と「おちゃちゃ」
    background: {image: paintings/yodo_natsunojin_byobu.jpg, credit: "《大坂夏の陣図屏風》17世紀前半（大阪城天守閣蔵）"}
    # AI絵：Y15（終了画面用。夕暮れの大坂城の石垣と堀、右半分を空ける）
    year: 1615
    lines:
      # 食い違い③：亡骸の在りか
      # 大阪観光局 OSAKA-INFO（太融寺）
      # fact: yodo-05
      - 語り: 大阪の太融寺には、淀殿の墓があります。大阪観光局の案内にも、そう書かれています。
        card: {head: "大阪の太融寺", body: 淀殿の墓}
      # ニッポン旅マガジン（2022）
      # fact: yodo-38
      - 語り: その墓は、もとは、大坂城の外の鴫野にあって、明治10年、軍の練兵場を造るときに、太融寺へ移された、と伝わります。
      # 観光庁 多言語解説文（奇妙な元興寺のかえる石の歴史 2022）
      # fact: yodo-18
      - 語り: 一方、奈良の元興寺には、別の言い伝えがあります。淀殿の亡骸は、大坂城の堀の向こうの、かえる石という石の下に、埋められた。
        background: {image: paintings/yodo_osaka_castle_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城）"}
      # fact: yodo-18
      - 語り: その石は、のちに、元興寺に移された、と観光庁の解説にはあります。
        figure: {type: stats, title: 淀殿の亡骸はどこに, items: [[大阪の太融寺, 淀殿の墓, もとは鴫野から移したと伝わる], [奈良の元興寺, かえる石, 石の下に埋めたという言い伝え]]}
      - 語り: 亡骸の在りかは、いまも、二つの寺の話に、分かれたままです。
        tone: しみじみ
        figure: null
      # 大阪市の報道発表（2026年8月5日）・主要展示品解説
      # fact: yodo-42
      - 語り: 記録の外に残った、茶々のものもあります。大阪城天守閣では、淀殿が使ったと伝わる、金めっきの燭台が、11月23日まで、特別展に出ています。
        card: {head: "大阪城天守閣", body: 伝 淀殿の燭台}
      # 答え：なぜ悪女にされたのか（記録と研究から言えること）
      - 語り: なぜ淀殿は、「悪女」にされたのか。
        tone: 疑問
        pause: 0.6
        background: {image: paintings/yodo_yoshitoshi_1873.jpg, credit: "月岡芳年《淀の君》1873年"}
      # fact: yodo-43, yodo-46
      - 語り: 徳川の世を正しいとする物語には、淀君を悪い女に描くものが、多かった。そして、飯倉さんの見立てでは、大坂で読まれた秀吉の一代記も、秀吉と北政所を立てるために、蛇の淀君を必要とした。
      - 語り: 勝った側にとっても、秀吉をしのぶ人々にとっても、茶々は、都合のよい悪役だったのかもしれません。
        tone: しみじみ
      - 語り: けれど、記録に残る茶々は、父の寺を建て、伯母の像を納め、気がふさいで医師に診てもらい、寺を建て直し続けた人です。
        tone: しみじみ
        background: {image: paintings/yodo_ishiyamadera_hiroshige.jpg, credit: "歌川広重《近江八景之内 石山秋月》1834年ごろ（メトロポリタン美術館）"}
        figure: {type: numberline, title: 記録に残る茶々, items: [[父の寺 養源院, 1594], [玄朔の診療, 1601], [石山寺の蓮如堂, 1602], [人質の条件, 1614]], unit: 年, focus: 父の寺 養源院}
      # fact: yodo-25
      - 語り: そして、秀吉から、体を心配する手紙と、秋刀魚を、受け取った人でした。
        tone: しみじみ
        figure: null
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 締め：冒頭の蛇の女と、秀吉の手紙に戻る
      # fact: yodo-12, yodo-49
      - 語り: 口が耳まで広がった、蛇の女。その200年ほど前、秀吉は、その人を、「おちゃちゃ」と、呼んでいました。
        tone: しみじみ
        pause: 0.8
        portrait: null
        card: {head: "秀吉の手紙の宛名", body: 「おちゃちゃ」}

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。

# ============================================================================
# 台詞の一覧（記録／想像）
# 記録（出どころを語りで言ってから、語りの中で読む。声は作らない）：
#   - 秀吉の茶々あての自筆書状（文禄2〜5年ごろ、個人蔵。2015年に兵庫県の商家から報告、2017年公表）：灸・熱・秋刀魚。宛名「おちゃちゃ」、差出「大かう」、日付「六日」（yodo-25・48・49）
#   - 『当代記』（『史籍雑纂 第二』1911 p.274）「此腹に淺井息女二人有之、於越前希有にして逃此難出玉、姉公は後秀吉公に嫁」（yodo-17）
