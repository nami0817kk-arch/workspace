        background: {image: paintings/yodo_osaka_meisho_tenmabashi_hokusai.jpg, credit: "葛飾北斎《諸国名橋奇覧 摂州天満橋》1835年ごろ（ロサンゼルス郡立美術館）"}
        card: {head: "コックスの日記", body: 1615年 平戸で書く}
      # fact: yodo-31
      - 語り: 最期について、最初に届いた知らせは、秀頼と、その母と、その子が、そろって、自ら命を絶った、というものでした。
      # fact: yodo-31
      - 語り: 同じ知らせには、秀頼の妻は、父である江戸の将軍のもとへ、送り返された、ともあります。秀頼の妻、千姫は、茶々の妹、お江の娘。茶々にとっては、姪でした。
        tone: しみじみ
      # fact: yodo-32
      - 語り: 続いて届いた知らせでは、秀頼の母は、亡くなって見つかった。けれど、秀頼の亡骸は見つからず、焼けた櫓の中で、灰になったと考えられた。秀頼の子は、生きている。
