sections:
  # ================================================================ 導入（冒頭 約2分30秒）
  - title: 蛇になった淀君は誰が作ったのか　享和2年『絵本太閤記』
    background: {image: paintings/yodo_ehon_taikoki_kiyosu.jpg, credit: "岡田玉山画『絵本太閤記』の挿絵（1797〜1802年）"}
    # AI絵：Y01（行灯の下で挿絵入りの古い本を開く手・大蛇の挿絵）
    year: 1802
    lines:
      # 0〜10秒：知らない事実（蛇にされた淀君）
      # fact: yodo-12
      - 語り: 口が耳まで広がり、《蛇》の性を帯びた女。江戸時代の大坂で読まれた絵本は、豊臣秀頼の母を、そう描きました。
        tone: 重い
        card: {head: "江戸時代の絵本", body: 蛇の性を帯びた女}
      # fact: yodo-44, yodo-29
      - 語り: 本の名は、『絵本太閤記』。最後の巻が出たのは、享和2年、1802年。淀殿が大坂城で亡くなって、180年あまりのちのことです。
        card: {head: "絵本太閤記", body: 最後の巻は1802年}
      # 飯倉洋一（『語文』114、大阪大学、2020）
      # fact: yodo-13
      - 語り: 実は、この蛇の話には、元になったかもしれない、別の怪談がありました。
        card: {head: "蛇の話", body: 元になった別の怪談？}
      - 語り: けれど、蛇にされる200年ほど前。ひとりの男が、この人に、こんな手紙を書いています。
        tone: しみじみ
        background: {image: paintings/yodo_yodo_river_hiroshige.jpg, credit: "歌川広重《京都名所之内 淀川》1834年ごろ（メトロポリタン美術館）"}
      # 和樂web（2019）・ETtoday（2017、神戸新聞の報道を引く）
      # fact: yodo-25
      - 語り: 灸をすえたと聞いて、体を心配した。よくなったと聞いて、安心した。《秋刀魚》を送ったから、食べなさい。
        tone: しみじみ
        card: {head: "秀吉の手紙", body: 秋刀魚を送ったから食べなさい}
      # fact: yodo-49
      - 語り: 差出人は、「大かう」。太閤、秀吉です。そして宛名は、「おちゃちゃ」。
        card: {head: "宛名", body: 「おちゃちゃ」}
        portrait: {image: paintings/yodo_hideyoshi_portrait.jpg, caption: "豊臣秀吉（狩野光信筆、高台寺）"}
      # fact: yodo-48
      - 語り: 1938年に東京大学が調べたあと、行方が分からなくなっていた手紙です。2015年、兵庫県の商家から知らせがあり、調べた結果、2017年に、79年ぶりの発見として、公表されました。
        card: {head: "2017年に公表", body: 79年ぶりに見つかった手紙}
        portrait: null
      # fact: yodo-26
      - 語り: 秀吉が自分で書いた手紙は、約60通。そのうち淀殿にあてたものは5通で、名前で「茶々」と呼んだものは、3通だけだと報じられています。
        card: {head: "秀吉の自筆の手紙", body: 「茶々」あては3通だけ}
      - 語り: 茶々。浅井長政とお市の方の、長女。のちに秀吉の側室となって、秀頼を産み、淀殿と呼ばれた人です。
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 濱田浩一郎（PRESIDENT Online 2026）
      # fact: yodo-01
      - 語り: 淀君、という呼び名も、実は、彼女が生きた時代の史料には、見当たりません。
        card: {head: "「淀君」の名", body: 同じ時代の史料に無い}
        portrait: null
      - 語り: 秋刀魚を受け取った女性が、どうして、蛇の女になったのか。
        tone: しみじみ
      - 語り: なぜ淀殿は、「悪女」にされたのか。
        tone: 疑問
        pause: 0.8
        background: {image: paintings/yodo_yoshitoshi_1873.jpg, credit: "月岡芳年《淀の君》1873年"}
      # 先の章の予告（第4章・まとめ）
      # fact: yodo-15
      - 語り: 最期に、ともに命を絶った人の数は、本によって、30人あまりとも、42人とも、書かれています。
        card: {head: "ともに死んだ人", body: 30人あまりとも42人とも}
      # fact: yodo-18
      - 語り: そして、その亡骸は、ある石の下に埋められた、という言い伝えまで、残っています。
        tone: 重い
        card: {head: "言い伝え", body: 亡骸は石の下に}
      # 約束の1文
      - 語り: これは、三度の落城を生きた女性の、記録に残る姿と、死んだあとに作られた姿を、くらべていく物語です。
        tone: しみじみ
        pause: 0.6
      # 橋渡し
      - 語り: 始まりは、近江の小谷城。茶々が、最初の落城を見た城です。
        pause: 0.6

  # ================================================================ 第1章 二度の落城と父の寺（1573〜1594）
  - title: なぜ茶々は父の寺を建てたのか　小谷・北ノ庄の落城と養源院 1594年
    background: {image: paintings/yodo_odani_castle_ezu.jpg, credit: "小谷城の絵図（江戸時代）"}
    # AI絵：Y02（遠くの山城から上る煙を見る三人の少女の後ろ姿）
    year: 1573
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 天正元年、1573年。織田信長に攻められて、小谷城は落ちました。父の浅井長政は、城で命を絶ちます。茶々は、まだ幼い子どもでした。
        tone: 重い
        portrait: {image: paintings/yodo_nagamasa.jpg, caption: "浅井長政（持明院蔵）"}
      # 広報ながはま 2011年4月号 p.31（長浜市）
      # fact: yodo-40
      - 語り: 長浜市の広報によれば、市内の実宰院という寺には、落城の前の夜、三人の姉妹が、ここにかくまわれた、という話が伝わっています。
        portrait: null
        card: {head: "長浜の実宰院", body: 落城の前夜 三姉妹をかくまう}
        # AI絵：Y02
      # fact: yodo-40
      - 語り: その寺には、のちに茶々が納めた、伯母の尼の木像が、寺の宝として伝わっている、と広報は書いています。
        card: {head: "実宰院の寺宝", body: 茶々が納めた伯母の木像}
      - 語り: 母のお市は、娘たちを連れて、織田家に戻りました。そして天正11年、1583年。母が再婚した柴田勝家の北ノ庄城も、秀吉に攻められて、落ちます。母は、勝家とともに、亡くなりました。
        tone: 重い
        portrait: {image: paintings/yodo_oichi.jpg, caption: "お市の方（持明院蔵）"}
        background: {image: paintings/yodo_kitanosho_fukui_map.jpg, credit: "《越前国福井城図》江戸時代（国立国会図書館。北ノ庄城の跡に建った城）"}
        figure: {type: map, title: 茶々の歩いた城, bounds: [135.3, 136.6, 34.5, 36.3], places: [[小谷城, 136.27, 35.46], [北ノ庄城, 136.22, 36.06], [京都, 135.77, 35.01], [淀, 135.72, 34.91], [大坂城, 135.53, 34.69]], route: [小谷城, 北ノ庄城, 京都, 淀, 大坂城], note: 二度の落城のあと 秀吉のもとへ}
      # 『当代記』（『史籍雑纂 第二』1911 所収 p.274）
      # fact: yodo-17
      - 語り: 江戸時代の初めの記録、『当代記』には、このときのことが、こうあります。浅井の娘が、《「二人」》、越前で、かろうじて、難を逃れた。
        portrait: null
        figure: null
        card: {head: "当代記", body: 浅井の娘「二人」が逃れた}
      # fact: yodo-17
      - 語り: いまは、三人の姉妹、と言われます。けれど、この記録が数えたのは、二人でした。そして、こう続けます。姉は、のちに、秀吉公に嫁いだ、と。
        tone: 強調
      - 語り: 父を攻めた側の、さらにその先の、母を攻めた男。姉の茶々は、その秀吉のもとへ、行くことになったんです。
        tone: しみじみ
      # 【想像1】淀殿。記録：小谷と北ノ庄の二度の落城（前置き）・『当代記』の「難を逃れた」（yodo-17）。気持ちの言葉だけ
      - 人物: 「父上、母上。茶々は、生きております」
        who: 淀殿想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 文化遺産オンライン（養源院の解説）・観光庁 多言語解説文（養源院 2022）
      # fact: yodo-02
      - 語り: 文禄3年、1594年。茶々は、京の都に、父、浅井長政の菩提を弔う寺を建てました。養源院です。
        portrait: null
        card: {head: "1594年 養源院", body: 父 浅井長政のための寺}
        background: {image: paintings/yodo_daibutsuden_17c.jpg, credit: "《方広寺大仏殿図》17世紀（京の東山）"}
        # AI絵：Y05（京の寺の本堂で手を合わせる茶々・横顔）
      # fact: yodo-02
      - 語り: 文化庁の文化遺産オンラインの解説も、観光庁の解説も、淀殿が父のために建てた寺、としています。
      # fact: yodo-19
      - 語り: 養源院は、1619年に火事で焼けます。それを、1621年に建て直したのは、妹のお江でした。
        card: {head: "1621年", body: 妹のお江が建て直す}
      # fact: yodo-19
      - 語り: そのとき、徳川の家臣たちの血のしみた城の床板を、ここに祀った、と観光庁の解説にはあります。
        tone: 重い
      - 語り: その床板は、いまも天井に張られ、血天井と呼ばれています。
        tone: 重い
      - 語り: 姉が建て、妹が建て直す。のちの悪女の物語には出てこない、父の寺を守った、姉妹の姿です。
        tone: しみじみ
      - 語り: 父の寺を建てたころ、茶々は、もう、秀吉の子を、二人、産んでいました。
        hook: true
      - 語り: 一人目の子のために、ひとつの城が、用意されます。
        tone: 重い
        hook: true

  # ================================================================ 第2章 淀城と秀吉の手紙（1589〜1598）
  - title: 「秋刀魚を送る」　淀城と秀吉の手紙 1589年
    background: {image: paintings/yodo_yodo_river_hiroshige.jpg, credit: "歌川広重《京都名所之内 淀川》1834年ごろ（メトロポリタン美術館）"}
    # AI絵：Y06（城の奥の部屋で産着の赤子を抱く茶々・後ろ姿）
    year: 1589
    lines:
      # 渡辺世祐『豊太閤と其家族』（1919）p.86
      # fact: yodo-07
      - 語り: 大正8年に出た、渡辺世祐の『豊太閤と其家族』によれば、天正17年、1589年の5月27日。茶々は、山城の淀城で、男の子を産みました。鶴松です。
        card: {head: "1589年5月27日", body: 淀城で鶴松を産む}
      # fact: yodo-07
      - 語り: 30日には、天皇の御所から、産着と、祝いの品が届いた、と同じ本にあります。
        card: {head: "豊太閤と其家族", body: 御所から産着と祝いの品}
      # 前置き（誰でも知っている：淀城に住んで淀殿と呼ばれた）
      - 語り: 淀の城に住んだことから、茶々は、淀殿と、呼ばれるようになります。
      # 京都市埋蔵文化財研究所 リーフレット京都 No.367（2019）・No.428（2024）
      # fact: yodo-39
      - 語り: ただ、京都の伏見に、いま石垣が残る淀城の跡は、この城では、ありません。
        tone: 強調
        card: {head: "いまの淀城跡", body: 茶々の城ではない}
      # fact: yodo-39
      - 語り: 京都市埋蔵文化財研究所によれば、秀吉が茶々の産所として築いたのは、淀古城と呼ばれる、別の城。いま跡が残るのは、1623年から、徳川秀忠の命で築かれた、江戸時代の淀城です。
        card: {head: "淀古城と淀城", body: 茶々の城は「淀古城」}
        figure: {type: stats, title: 二つの淀城, items: [[淀古城, 茶々の産所, 秀吉が築く], [淀城, 1623年から築く, いま跡が残る]]}
      - 語り: 茶々が子を産んだ城は、いま、目に見える形では、残っていないんです。
        tone: しみじみ
        figure: null
      # 前置き（誰でも知っている流れ）
      - 語り: 鶴松は、数えで3歳で、亡くなります。そして、文禄2年、1593年。茶々は、もう一人の男の子を産みました。のちの、秀頼です。
        tone: 重い
        portrait: {image: paintings/yodo_hideyori_portrait.jpg, caption: "豊臣秀頼（養源院蔵）"}
        # AI絵：Y06
      # 和樂web（2019）のキャプション
      # fact: yodo-49
      - 語り: 冒頭の、秋刀魚の手紙。和樂webの記事によれば、書かれたのは、文禄2年から5年ごろ。ちょうど、秀頼が生まれたころです。
        portrait: null
        card: {head: "秋刀魚の手紙", body: 文禄2〜5年ごろ}
        # AI絵：Y07（文机の手紙と、盆の上の秋刀魚・手元だけ）
      # fact: yodo-25
      - 語り: 灸をすえるほど具合を悪くした茶々を、秀吉は、遠くから、案じていました。
        tone: しみじみ
      # fact: yodo-48
      - 語り: 手紙には、「六日」という日付が、添えられています。
        card: {head: "秀吉の手紙", body: 日付は「六日」}
      # 【想像2】淀殿。記録：熱を案じ、秋刀魚を送るという秀吉の手紙（yodo-25・49）。気持ちの言葉だけ
      - 人物: 「秋刀魚、とは……。殿下らしいこと」
        who: 淀殿想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      - 語り: のちの読み物は、茶々を、秀吉の心を乱した女として描きます。けれど、残っている手紙の中の茶々は、秀吉に、体を心配される、ひとりの女性でした。
        tone: しみじみ
        portrait: null
      # 前置き（誰でも知っている流れ）
      - 語り: 慶長3年、1598年。秀吉は、伏見城で亡くなります。秀頼は、まだ、数えで6歳でした。
        tone: 重い
        portrait: {image: paintings/yodo_hideyoshi_portrait.jpg, caption: "豊臣秀吉（狩野光信筆、高台寺）"}
      - 語り: 夫を失ったあと、茶々は、心と体を、崩していきます。
        portrait: null
        hook: true
      - 語り: それでも、茶々の手で、いくつもの寺が、建て直されていくんです。
        hook: true

  # ================================================================ 第3章 「秀頼御袋より」（1601〜1614）
  - title: 「秀頼御袋より」　秀吉のあとの寺と大坂城 1601年
    background: {image: paintings/yodo_osaka_castle_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城）"}
    # AI絵：Y08（大坂城の奥で薬湯の器を前に座る茶々・横顔・30代）
    year: 1601
    lines:
      # 黒田基樹（PRESIDENT Online 2023）が引く玄朔の診療の記録
      # fact: yodo-27
      - 語り: 慶長6年、1601年の6月。医師の曲直瀬玄朔が、茶々を、診ました。
        card: {head: "1601年6月", body: 医師 曲直瀬玄朔の診療}
      # fact: yodo-27
      - 語り: 歴史学者の黒田基樹さんが紹介した、玄朔の記録には、こうあります。秀頼公の御母、御年、三十余り。気がふさぎ、食べられず、目がくらむ。
        tone: しみじみ
        card: {head: "玄朔の記録", body: 気がふさぎ 食べられず 目がくらむ}
      - 語り: 関ヶ原の戦いの、翌年でした。徳川家康の力が強まる中で、茶々は、まだ幼い秀頼を抱えて、大坂城にいました。
        # AI絵：Y08
      # 【想像3】淀殿。記録：1601年の玄朔の診療（yodo-27）・幼い秀頼（前置き）。気持ちの言葉だけ
      - 人物: 「この子だけは……。この子だけは、守らねば」
        who: 淀殿想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 滋賀県 指定文化財の解説（石山寺蓮如堂）
      # fact: yodo-41
      - 語り: その茶々が、力を注いだのが、寺の建て直しです。近江の、石山寺。滋賀県の文化財の解説によれば、慶長のころの石山寺の建て直しは、淀殿によるもの。寺に残る文書から、分かるといいます。
        portrait: null
        background: {image: paintings/yodo_ishiyamadera_hiroshige.jpg, credit: "歌川広重《近江八景之内 石山秋月》1834年ごろ（メトロポリタン美術館）"}
        card: {head: "石山寺", body: 慶長の建て直しは淀殿}
      # fact: yodo-41
      - 語り: 境内の蓮如堂は、慶長7年、1602年、そのときに建てられた建物の一つです。
        # AI絵：Y09（石山寺の山あいで進む堂の建て直し・遠景）
      # 『滋賀県史』第3巻（1928）が引く『時慶卿記』
      # fact: yodo-09
      - 語り: 当時の公家の日記、『時慶卿記』には、石山寺の堂は、ことごとく再興された、「秀頼御袋より」、とあります。
        tone: 強調
        card: {head: "時慶卿記", body: 「秀頼御袋より」}
      - 語り: 御袋、つまり、秀頼の母から。記録が名を挙げたのは、まだ若い秀頼ではなく、母の茶々でした。
        tone: しみじみ
      # 南孝雄（京都市考古資料館文化財講座 2026）
      # fact: yodo-09
      - 語り: 京の大仏殿も、秀頼の時代に、建て直されました。京都市埋蔵文化財研究所の南孝雄さんの資料は、費用は豊臣家が負ったが、徳川家康の意向もあったとされる、と書いています。
        background: {image: paintings/yodo_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》（眼鏡絵、18世紀）"}
      # fact: yodo-21
      - 語り: 同じ資料によれば、当時、この寺は、まだ方広寺とは呼ばれていなかったようで、東山の大仏、大仏殿、などと呼ばれていました。
        card: {head: "当時の呼び名", body: 方広寺ではなく「大仏殿」}
      # fact: yodo-23
      - 語り: その柱は、一本の大木ではなく、木を寄せ合わせたもの。それを束ねた鉄の輪が、いまも、方広寺や、京都国立博物館の敷地に、残っています。
        card: {head: "大仏殿の柱", body: 束ねた鉄の輪が今も残る}
        # AI絵：Y10（巨大な柱を鉄の輪で束ねる大工たち・遠景）
      # fact: yodo-22
      - 語り: ただ、この大仏殿は、完成を祝う法要を、迎えないまま、豊臣家が滅びることになります。
        tone: 重い
      # Léon Pagès（1869）、Internet Archive の本文
      # fact: yodo-35
      - 語り: 茶々と秀頼が、キリスト教の宣教師に、目をかけた時期もありました。
        background: {image: paintings/yodo_osaka_castle_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城）"}
      # fact: yodo-35
      - 語り: フランスのレオン・パジェスが、1869年に、宣教師の記録をまとめた本によれば、1613年ごろ、大坂の宣教師の住まいは、秀頼とその母にひいきにされ、助けまで受けていました。
        card: {head: "パジェスの本（1869年）", body: 宣教師も秀頼と母の助けを受ける}
      # fact: yodo-09
      - 語り: 同じ本は、宣教師の側から、秀頼とその母が、毎日のように新しい寺を建てている、と、とがめる調子でも書いています。
      # Elizabeth Self（ピッツバーグ大学 博士論文 2017）の要旨
      # fact: yodo-37
      - 語り: アメリカのピッツバーグ大学で、2017年に出た博士論文は、茶々たち浅井の三姉妹を、寺や肖像を作らせた、注文主として、とらえ直しています。
        card: {head: "2017年の博士論文", body: 浅井三姉妹は「注文主」}
      # fact: yodo-37
      - 語り: 女性も、男性と同じように、建てることで、自分の立場を示していた、という見方です。
        tone: しみじみ
      # 前置き（誰でも知っている流れ：方広寺の鐘の文字）
      - 語り: そして、慶長19年、1614年。その大仏殿の鐘に刻まれた文字をきっかけに、豊臣と徳川の間が、こじれていきます。
        tone: 重い
        background: {image: paintings/yodo_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》（眼鏡絵、18世紀）"}
      # 香原斗志（PRESIDENT Online 2023）・勝諺蔵『魁難波戦記』（1894）・Pagès p.306
      # fact: yodo-06
      - 語り: 豊臣家の家老、片桐且元は、駿府に出向き、三つの条件を、大坂に持ち帰ります。そのひとつが、茶々を、人質として、江戸へ出すことでした。
        card: {head: "三つの条件", body: 茶々を人質として江戸へ}
        background: {image: paintings/yodo_osaka_castle_zu_byobu.jpg, credit: "《大坂図屏風》1607〜15年ごろ（豊臣期の大坂城）"}
        # AI絵：Y11（大坂城の広間で文を前に座る茶々の横顔と、青年の後ろ姿）
      # 【想像4】淀殿。記録：茶々を人質として江戸へ出す条件（yodo-06）。気持ちの言葉だけ（どう答えたかは言わない）
      - 人物: 「この身を、江戸へ……」
        who: 淀殿想像
        imagined: true
        tone: 重い
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 黒田基樹（PRESIDENT WOMAN Online 2023、元は『羽柴家崩壊』2017）
      # fact: yodo-28
      - 語り: 大野治長らと対立した且元は、茶々にも疑われ、豊臣家の中で、遠ざけられていきます。
        tone: 重い
        portrait: null
      # fact: yodo-28
      - 語り: 黒田基樹さんによれば、且元は、大坂城の門の番所、7か所のうち6か所を、弟とともに受け持ち、豊臣家のお金も、外との交渉も、取り仕切っていた人でした。
        card: {head: "片桐且元", body: 門の番所7か所のうち6か所}
      # fact: yodo-28
      - 語り: その且元が、城を去る。黒田さんは、これが、豊臣家の滅びる決め手になった、と見ています。
        tone: 重い
      - 語り: やがて、大坂城に、大砲の弾が、撃ち込まれます。
        hook: true
      - 語り: その一発が、城の奥の、ある部屋を、揺らします。
        tone: 重い
        hook: true

  # ================================================================ 第4章 三度目の落城（1614〜1615）①ともに死んだ人の数 ②落城の知らせ
  - title: 三度目の落城で何が起きたのか　大坂の陣と山里丸の蔵 1615年
    background: {image: paintings/yodo_natsunojin_castle.jpg, credit: "《大坂夏の陣図屏風》の大坂城の部分（17世紀前半、大阪城天守閣蔵）"}
    # AI絵：Y12（砲撃で壊れた城の奥の部屋・倒れた茶箪笥と割れた茶碗・人物なし）
    year: 1614
    lines:
      - 語り: 慶長19年、1614年の冬。大坂冬の陣です。
      # 観光庁 多言語解説文（歴史に残る鉄砲戦：大坂の陣 2023）
      # fact: yodo-20
      - 語り: 観光庁の解説には、徳川方の大砲の弾が、淀殿の部屋を破り、茶箪笥を壊した、という話が、載っています。
        card: {head: "冬の陣の砲撃", body: 淀殿の部屋の茶箪笥が壊れた}
        # AI絵：Y12
      # 前置き：冬の陣は和睦で終わる
      - 語り: 冬の戦いは、和睦で終わります。けれど、翌年。家康の側は、さらに、城を明け渡し、集めた浪人を、城から出せ、と求めてきました。
      # 徳富猪一郎『近世日本国民史』家康時代 中巻（1925）p.229
      # fact: yodo-10
      - 語り: 徳富蘇峰の『近世日本国民史』が引く記録には、淀殿は、大いに驚き、妹の常高院、初に頼んで、いろいろと詫びを申し入れた。けれど、まったく、聞き入れられなかった、とあります。
        card: {head: "近世日本国民史", body: 妹の常高院に頼んで詫びる}
      # 【想像5】淀殿。記録：常高院を頼んで詫びを申し入れた（yodo-10）。気持ちの言葉だけ
      - 人物: 「初……。どうか、頼みます」
        who: 淀殿想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/yodo_portrait_nara.jpg, caption: "伝淀殿画像（奈良県立美術館蔵）"}
      # 前置き（誰でも知っている流れ）
      - 語り: 慶長20年、1615年の5月。大坂夏の陣。城は、燃え始めます。
        tone: 重い
        portrait: null
        background: {image: paintings/yodo_natsunojin_castle.jpg, credit: "《大坂夏の陣図屏風》の大坂城の部分（17世紀前半、大阪城天守閣蔵）"}
        # AI絵：Y13（夕方の煙の上がる天守の遠景・人物なし）
      # Pagès（1869）p.308〜311
      # fact: yodo-36
      - 語り: この戦いでも、豊臣方には、キリシタンが多く加わっていました。パジェスの本は、十字架とともに、キリストや聖人の姿を描いた大きな旗が、掲げられていた、と書いています。
        background: {image: paintings/yodo_natsunojin_byobu.jpg, credit: "《大坂夏の陣図屏風》17世紀前半（大阪城天守閣蔵）"}
      - 語り: 小谷、北ノ庄、そして、大坂。茶々にとって、三度目の落城でした。
        tone: しみじみ
        background: {image: paintings/yodo_natsunojin_castle.jpg, credit: "《大坂夏の陣図屏風》の大坂城の部分（17世紀前半、大阪城天守閣蔵）"}
      # 【想像6】淀殿。記録：三度目の落城（前置き）。気持ちの言葉だけ（場面の細部は描かない）
