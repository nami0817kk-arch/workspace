# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml の型。見本は scripts/kazunomiya-story.yaml・masamune-story.yaml）。淀殿（茶々）。2026-10-29 下書き。
# 公開の予定は 10/30 12:00。
# 型：1本に1つの「なぜ」＝「なぜ淀殿は『悪女』にされたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝『絵本太閤記』（1797〜1802）の「淀君行状」で、淀君は口が耳まで広がる蛇の女にされた（yodo-12）。
#   対比＝その200年あまり前、秀吉は熱を出した「おちゃちゃ」に秋刀魚を送っていた（1938年のあと行方不明→2015年に商家が報告→2017年に79年ぶりの発見として公表。yodo-25・48・49）。
#   導入では『唐土の吉野』の名と「借りた」の答えは言わず「元になったかもしれない別の怪談」まで（10-29 の流れの点検）。
#   第1章 二度の落城と父の寺（小谷・『当代記』の「二人」・実宰院・北ノ庄・養源院と血天井）／
#   第2章 淀城と秀吉の手紙（鶴松の産所＝淀古城は今の淀城跡ではない・秋刀魚の手紙）／
#   第3章 「秀頼御袋より」（1601年の玄朔の診療・石山寺・京の大仏殿・宣教師・博士論文・且元と人質の条件）／
#   第4章 三度目の落城（砲撃と茶箪笥・常高院の詫び・十字架の旗（夏の陣）・山里丸の蔵・殉じた人数・コックスの日記・パジェス・国防館跡）／
#   第5章 検証「淀君」はいつ生まれたのか（呼び名・『大坂物語』『難波戦記』・『絵本太閤記』の挿絵と蛇・『唐土の吉野』・飯倉の見立て・不仲説・絶板・『胆大小心録』・明治〜大正の本の「淀君」と39・伝淀殿画像・『国史大辞典』）／
#   まとめ 墓と石（太融寺・かえる石）・燭台の展示→答え→冒頭の蛇と「おちゃちゃ」に戻って閉じる。締めは余韻の一文＋登録のお願い。次回予告なし（story: true）。
# 記録の食い違いを並べたのは3か所：①ともに死んだ人の数（『日本史料』1893 治長ら25人と侍女7人／竹越与三郎 1896 42人／山路愛山『徳川家康』30余人）
#   ②最期の書き方（日本の本＝山里丸の蔵で自害／コックスの日記＝最期の第一報は三人そろって、続報は母は見つかり秀頼は見つからず／パジェス＝秀頼は町の中で倒れたらしい・母は書かない。
#     秀頼の最後の場所は観光庁の国防館跡の解説も）
#   ③亡骸の在りか（太融寺の墓＝もと鴫野から明治10年に移した／元興寺＝堀の向こうのかえる石の下）。ほかに語りだけで：『当代記』の「二人」と三姉妹、蔵の呼び名（土倉・糒蔵）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/淀殿_facts_20261029.yaml、yodo-01〜49）にあるものだけ。行の上に `# fact: yodo-NN`。
#   カードに無い「誰でも知っている前置き」（浅井長政とお市の長女・小谷城と北ノ庄城の落城・秀吉の側室・鶴松と秀頼・秀吉の死・
#   関ヶ原・方広寺の鐘の文字・冬の陣と夏の陣・5月8日に秀頼とともに亡くなった）は短く使い、# fact を付けない。
#   yodo-03（武具を着けて見回った）は出どころが見つからないので使わない。yodo-10 は『近世日本国民史』の引く記録（夏の陣の前の明け渡しの要求に、常高院を頼んで詫びた）の中身で言う。
#   秀吉の自筆書状の数（yodo-26）は台湾の報道の又引きなので「と報じられています」。玄朔の医師名・症状は nippon.com と食い違うので、黒田基樹の紹介する記録の文で言う。
#   かえる石（yodo-18）は観光庁の解説も「と言われている」なので言い伝えとして。『胆大小心録』は書名と年だけ（作者はカードに無いので言わない）。
#   淀殿の生まれた年は言わない（説が割れ、カードに出どころが無い）。「三十九」は明治〜大正の本がそう書いていた事実として言うだけ（教科書とは言わない）。
#   血天井の床板の血は観光庁の解説のとおり「徳川の家臣たち」の血。且元は黒田の記事の本文どおり「大野治長らと対立し、茶々にも疑われ」（茶々が一人で切ったとは言わない）。
#   『唐土の吉野』から借りたは、飯倉の「断言はできない」の留保ごと言う。答えの行は「多かった」「飯倉さんの見立てでは」まで（動機を断定しない）。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（書状・日記の声は作らない。原文の一節は語りで今の言葉に）。
#   想像の台詞は6か所（淀殿想像。config の roles に足した：No.7 のノーマル）。気持ちの言葉だけ・新しい事実を足さない。ほかの人物の台詞は作らない。
#
# 女性の扱い：最期は「自ら命を絶った」まで（場面の細部・亡骸の様子は語らない）。『絵本太閤記』の祈祷の細部（肉を切る話）は言わない。
#   人を貶めない：北政所・徳川方・『絵本太閤記』の作者も悪く言わず、「なぜそう書いたか」を研究の見立てとして言う。
# 絵：paintings/ の実在の絵（yodo_*：伝淀殿画像・芳年の淀の君・秀吉像・秀頼像・高台院像・長政像・お市像・夏の陣図屏風・大坂図屏風・
#   小谷城の絵図・福井城図・広重の石山寺と淀川・応挙の京大仏図・『絵本太閤記』の挿絵）＋ AI 絵（Y01〜Y15、
#   一覧は dev/output/rekishi-chiso/research/yodo_ai_images.md）。落城・最期の場面は AI 絵でも人を描かない（燃える城の遠景・蔵の外観だけ）。
