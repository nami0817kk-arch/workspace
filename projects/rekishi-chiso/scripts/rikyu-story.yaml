      # fact: rikyu-11
      - 語り: ひとりの茶人に、3,000の兵。福井さんは、これを、出兵に力を貸すよう求められていた、諸大名への、無言の警告だった、と読みます。
        figure: {type: stats, title: 利休が罰せられた理由　諸説, items: [[公に示された罪, 木像の不敬・茶道具の売買, 福井幸男さんのまとめ], [権力争い, 秀吉政権の中の争い, 田中仙堂さんが有力と紹介], [三成の讒言, 朝鮮出兵をめぐって, 福井幸男さん 2012年]], upto: 3}
      - 語り: 逆らえば、天下一の茶人でも、こうなる。見せしめだったとすれば、木像を橋でさらしたことも、同じ筋の上に乗ってきます。
        tone: しみじみ
      - 語り: 翌年には、秀吉の軍勢が、海を渡ります。その前の年の京で、茶人の屋敷を、兵が取り巻いていた。福井さんは、そこに、出兵へ向かう政権の、張りつめた空気を見ているんです。
