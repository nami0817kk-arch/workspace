        background: {image: paintings/hideyoshi_daitokuji_funeral_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（三法師を抱く秀吉、後世の場面）"}
      # 伊達家文書（rikyu-02 の伊達家文書の引用・rikyu-16 和樂web の引用）
      # fact: rikyu-16, rikyu-02
      - 語り: その門の上に、利休の像が、置かれます。伊達家に届いた書状には、こうあります。「宗易、その身の形を、木像に作り立て、紫野大徳寺に、納められ候」。
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
        card: {head: "伊達家に届いた書状", body: 「その身の形を木像に」}
      - 語り: 宗易とは、利休のことです。自分の姿を写した木の像が、門の上の階に、納められたんです。
      # fact: rikyu-02
      - 語り: 書状は続けます。その木像を、「殿下様」、つまり秀吉が、召し上げた。
