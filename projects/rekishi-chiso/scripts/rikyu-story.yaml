        figure: {type: stats, title: 利休が罰せられた理由　諸説, items: [[公に示された罪, 木像の不敬・茶道具の売買, 福井幸男さんのまとめ], [権力争い, 秀吉政権の中の争い, 田中仙堂さんが有力と紹介]], upto: 2}
      - 語り: 茶の席は、大名たちが顔を合わせる場でもありました。そこを取り仕切る利休が、政権の争いと、無縁でいられたとは、考えにくい、ということです。
