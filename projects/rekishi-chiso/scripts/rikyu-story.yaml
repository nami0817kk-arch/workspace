        portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵）", age: false}
      # fact: rikyu-03
      - 語り: そして、「聚楽の大門、もどり橋と申す所に、張付に、かけさせられ候」。張付とは、磔のことです。
        tone: 重い
        background: {image: paintings/hideyoshi_jurakudai_3.jpg, credit: "《聚楽古城之図》江戸時代中期〜末期"}
        card: {head: "伊達家に届いた書状", body: 「もどり橋…張付に」}
        portrait: null
      # fact: rikyu-03
      - 語り: もどり橋は、いまの一条戻橋。秀吉の屋敷、聚楽第の大門の近くです。明治の終わりに、この書状を活字にした東京帝国大学の編者は、その頭に、「秀吉、利休の木像を磔す」と、注を付けました。
      # fact: rikyu-10
      - 語り: 木像の脇には、罪を書き並べた札。見物の人は、際限なく集まった。京の人たちは、口々に、前代未聞だ、と言い合った。
        tone: しみじみ
        card: {head: "京の人々", body: 「前代未聞」}
      - 語り: 人を罰する前に、まず、その人の姿をした像を、罪人のように、人目にさらす。見せるための罰でした。
        tone: 重い
      - 語り: しかも、この知らせは、京から遠く離れた、奥州の伊達家にまで、書状で届けられています。京の出来事として、それだけ大きく受け止められていたんです。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
      # 【想像2】利休。記録：利休の木像が一条戻橋で磔にされ、見物人が際限なく集まった（rikyu-03・rikyu-10）。気持ちの言葉だけ（その場にいたとは言わない）
      - 人物: 「わしの姿が、橋の上で、さらされておるか……」
        who: 利休想像
        imagined: true
        tone: 重い
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
      # 福井幸男（桃山学院大学 2011）：公に示された罪
      # fact: rikyu-05
      - 語り: では、札に書かれた罪とは、何だったのか。桃山学院大学の福井幸男さんは、2011年の論文で、公に示された罪を、こうまとめています。
        portrait: null
        background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
      # fact: rikyu-05
      - 語り: ひとつは、秀吉と、天皇への、不敬。門の上の階を造り、そこに自分の木像を置いたことも、この不敬に入る、と。
        card: {head: "公に示された罪①", body: 秀吉と天皇への不敬}
      # fact: rikyu-05
      - 語り: もうひとつは、茶道具に、不当な値を付けて、売り買いしたこと。
        card: {head: "公に示された罪②", body: 茶道具の不当な売買}
      - 語り: 天皇や秀吉もくぐる門の上から、自分の像が、見下ろしている。そう受け取られたのなら、門の寄進は、たちまち罪に変わります。
        tone: しみじみ
      # fact: rikyu-13
      - 語り: 磔にされた初代の木像は、そのあと壊された、と言われています。
      - 語り: 木像の罪と、茶道具の罪。表向きの理由は、この二つでした。けれど、多くの人が、それだけでは、腑に落ちないと考えてきました。
        hook: true
      - 語り: 木の像ひとつで、天下一の茶人が、命を落とすだろうか。理由をめぐる説は、ここから、いくつにも枝分かれしていきます。
