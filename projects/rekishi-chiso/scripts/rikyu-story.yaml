  # ================================================================ 第2章 木像と金毛閣（④木像の磔・公に示された罪）
  - title: なぜ木の像が罪になったのか　大徳寺の三門 金毛閣
    background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
    # AI絵：a large two-story Zen temple gate with a red upper story in Kyoto, late winter morning, mist, monks walking under it, seen from below, muted colors, painterly, no faces
    year: 1591
    lines:
      # 山本兼一（プレジデント 2009）
      # fact: rikyu-02
