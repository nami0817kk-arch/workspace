# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  天正19年、1591年の2月。京の都の橋のたもとで、一体の木像が、罪人として磔にされました。見物の人は、身分を問わず、際限なく集まったといいます。木像の主は、茶人、千利休でした。
  そして利休本人も、この月、命を落とします。けれど、同じ時代の記録は、その最期を、同じ言葉では書いていません。
  なぜ利休は、切腹させられたのか。そして、本当に、切腹したのか。
  この動画でわかること
  ・『北野社家日記』の「成敗」、『多聞院日記』の「うわさ」と「高野山へ追放」――食い違う同時代の記録
  ・切腹の場面を詳しく書いたのは、後の時代の『千利休由緒書』だったこと
  ・公に示された罪と、権力争い・朝鮮出兵・娘の話の諸説
  ・「利休は生きていた」という新説と、その根拠の秀吉の書状
  ・2026年に初めて公開された三門の利休像と、新たに見つかったかもしれない利休の手紙
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（伊達家に届いた書状、『北野社家日記』『多聞院日記』『千利休由緒書』、秀吉の書状など）を語りで示してから読んでいます。

en:
  title: "Sen no Rikyu: Why Was He Ordered to Die, and Did He Really Commit Seppuku?"
  description: |-
    In the 2nd month of 1591, a wooden statue was crucified like a criminal by a bridge in Kyoto, and crowds of every rank came to see it. The statue was of the tea master Sen no Rikyu.
    That same month Rikyu himself died. Yet the records of the time do not describe his end in the same words.
    Why was Rikyu ordered to commit seppuku, and did he really do it?
    In this video you will learn:
    - How the Kitano Shake Nikki says he was "punished," while the Tamon-in Nikki calls his seppuku a rumor and also reports he was exiled to Mount Koya
    - That the detailed scene of his seppuku comes from a later document, the Sen no Rikyu Yuishogaki
    - The official charges and the competing theories about the real reason
    - The theory that Rikyu survived, and the Hideyoshi letter it rests on
    - The Rikyu statue from Daitokuji's gate shown to the public for the first time in 2026, and a letter that may be a new discovery
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Was Rikyu's Statue Crucified by a Bridge? Kyoto, 1591"
    - "Did Rikyu Really Commit Seppuku? Three Records That Disagree"
    - "Why Was a Wooden Statue a Crime? The Gate of Daitokuji"
    - "What Was the Real Reason? Four Theories"
    - "Was Rikyu Still Alive? Hideyoshi's Letter About Rikyu's Tea"
    - "Where Does Rikyu Rest? Shoan, Sotan and the Statue of Today"

