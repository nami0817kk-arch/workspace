sections:
  # ================================================================ 導入（冒頭 約2分）
  - title: なぜ利休の木像は、橋の上で磔にされたのか　天正19年2月 京
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    # AI絵：a small wooden bridge over a narrow canal in Kyoto in late winter, 1590s Japan, a crowd of townspeople in the distance gathered around a wooden frame holding a statue of a seated old man in black robes, a wooden notice board beside it, overcast sky, muted colors, painterly, no gore, faces not detailed
    year: 1591
    lines:
      # 0〜10秒：場面から（あいさつなし）。木像の磔（伊達家文書・観光庁の解説・Impress Watch）
      # fact: rikyu-03
      - 語り: 京の都の、橋のたもと。一体の木像が、罪人として、《磔》にされました。
        tone: 重い
        card: {head: "木像が磔に", body: 京の一条戻橋}
      # fact: rikyu-03, rikyu-01
      - 語り: 天正19年、1591年の2月。場所は、一条戻橋。聚楽第の大門の近くにあった橋です。
        card: {head: "天正19年2月", body: 一条戻橋}
      # 伊達家に届いた書状（大日本古文書 伊達家文書之二）
      # fact: rikyu-10
      - 語り: 遠く奥州の、伊達家に届いた書状は、この様子を、こう伝えています。京の中では、「まことに、《前代未聞》」と言い合っている。
        tone: しみじみ
        card: {head: "伊達家に届いた書状", body: 「前代未聞」}
      # fact: rikyu-10
      - 語り: 見物に来る人は、身分の高い者も低い者も、際限がない。そして木像の脇には、罪を書き連ねた札が、立てられた、と。
        card: {head: "木像の脇に", body: 罪を書いた札}
      # fact: rikyu-16
      - 語り: 木像の姿は、ひとりの茶人のものでした。宗易、のちの名を、千利休。豊臣秀吉に仕えた、茶の湯の第一人者です。
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
      # fact: rikyu-02
      - 語り: この木像は、もともと京の大徳寺の、大きな門の上に、置かれていたものでした。
        background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
        card: {head: "大徳寺の門の上", body: 利休の木像}
      - 語り: 人ではなく、像が、罰を受けた。それだけでも、ただごとではありません。
        tone: しみじみ
      # fact: rikyu-01
      - 語り: そして同じ月、利休本人も、秀吉の命で、腹を切った、と伝えられてきました。
        tone: 重い
        portrait: null
      # fact: rikyu-07
      - 語り: ところが、北野天満宮の『北野社家日記』は、「切腹」とは書いていません。書いてあるのは、利休が、「《成敗》された」。
        tone: 強調
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: "北野社家日記", body: 「成敗された」}
      # fact: rikyu-06
      - 語り: 奈良の興福寺の僧が書いた『多聞院日記』は、2月28日の切腹を、「うわさ」として書きました。しかも同じ日記に、利休は高野山に追放された、という話まで、載せているんです。
        card: {head: "多聞院日記", body: 切腹は「うわさ」・高野山へ追放とも}
      # fact: rikyu-08
      - 語り: 切腹の場面を、天気や、見張りの様子まで詳しく書いた記録は、ずっと後の時代に、利休の子孫が差し出した文書でした。
        card: {head: "切腹の場面", body: 後の時代の文書が詳しく書く}
      # 40〜80秒：「なぜ」を1文
      - 語り: なぜ利休は、切腹させられたのか。そして、本当に、切腹したのか。
        tone: 疑問
        pause: 0.8
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
      # 答えのかけら：中村修也さんの生存説と秀吉の書状（第4章）
      # fact: rikyu-09
      - 語り: 実は、「利休は切腹せずに、生きていた」という説まで、唱えられています。根拠は、利休の死の翌年に書かれたという、秀吉の《1通の手紙》です。
        tone: 強調
        card: {head: "新説", body: 利休は生きていた？}
      # その後の予告（第5章）
      # fact: rikyu-13, rikyu-14
      - 語り: そして2026年の秋。いま大徳寺の門の上にある利休の像が、東京国立博物館で、初めて公開されました。その像は、磔にされた木像では、ありません。
        card: {head: "2026年の秋", body: 三門の利休像を初公開}
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
      # 約束の1文
      - 語り: これは、天下人に仕えた茶人の最期を、食い違う記録の中から、掘り出していく物語です。
        tone: しみじみ
        pause: 0.6
        portrait: null
      # 橋渡し
      - 語り: まずは、利休の最期を書いた、三つの記録から、見ていきましょう。
        pause: 0.6

  # ================================================================ 第1章 三つの記録（①同時代の記録の食い違い）
  - title: 利休は、本当に切腹したのか　三つの記録の食い違い
    background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
    year: 1591
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 千利休は、堺の商人の家に生まれ、茶の湯で名を上げた人です。織田信長に、そして豊臣秀吉に仕えました。
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
        background: {image: paintings/ieyasu_sakai_montanus_engraving.jpg, credit: "モンタヌス『日本誌』「堺」1669年ごろ"}
      - 語り: 秀吉が天下をほぼ手にしたころ、その茶の席を取り仕切っていたのが、利休でした。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      # fact: rikyu-01
      - 語り: その利休が、天正19年、1591年の2月、秀吉の命で、腹を切った。多くの解説には、そう書かれています。
        portrait: null
        card: {head: "天正19年2月", body: 秀吉の命で切腹}
      # 田中仙堂（PRESIDENT Online 2017）
      # fact: rikyu-06, rikyu-07
      - 語り: けれど、大日本茶道学会の会長、田中仙堂さんは、2017年の記事で、そのころの記録を並べ直しています。そこから見えてくるのは、ひとつに定まらない、利休の最期です。
        tone: 強調
      # fact: rikyu-07
      - 語り: ひとつ目は、北野天満宮の『北野社家日記』。神社に仕える家の日記です。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
      # fact: rikyu-07
      - 語り: そこには、利休は「成敗された」とあります。成敗は、罰として命を取られた、という言葉です。けれど、自分で腹を切ったとは、書いていません。
        card: {head: "北野社家日記", body: 「成敗された」}
        figure: {type: stats, title: 利休の最期　記録はどう書いたか, items: [[北野社家日記, 成敗された, 同じ時代の京の日記]], upto: 1}
      # 前置き（誰でも知っている流れ：北野大茶湯。fact は付けない）
      - 語り: 北野天満宮といえば、天正15年に、秀吉が、身分を問わず人を招いて、大きな茶会を開いた場所です。その茶会を支えた茶人の一人が、利休でした。
        figure: null
        background: {image: paintings/hideyoshi_daigo_hanami_screen.jpg, credit: "《醍醐花見図屏風》桃山時代（国立歴史民俗博物館蔵）"}
      - 語り: それから4年。同じ北野の日記が、利休の最期を、「成敗」という短い言葉で、書き留めたことになります。
        tone: しみじみ
      # fact: rikyu-06
      - 語り: ふたつ目は、奈良の興福寺の僧たちが書き継いだ、『多聞院日記』です。
        background: {image: paintings/hideyoshi_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》1796年以前（方広寺の大仏殿、江戸時代に建て直した姿）"}
      # fact: rikyu-06
      - 語り: この日記は、2月28日に利休が切腹した、と書きます。ただし、それは、「うわさ」としてでした。
        tone: しみじみ
        card: {head: "多聞院日記", body: 2月28日の切腹は「うわさ」}
      # fact: rikyu-06
      - 語り: しかも同じ日記には、利休は、高野山に追放された、という話も、載っています。切腹と、追放。同じ日記の中で、話が食い違っているんです。
        tone: 強調
        figure: {type: stats, title: 利休の最期　記録はどう書いたか, items: [[北野社家日記, 成敗された, 同じ時代の京の日記], [多聞院日記, 切腹は「うわさ」, 高野山へ追放の話も]], upto: 2}
      - 語り: 京から少し離れた奈良の寺には、確かな知らせではなく、うわさが届いていた。それほど、京の外からは、何が起きたのか、見えにくかったのかもしれません。
        tone: しみじみ
      # 千利休由緒書（田中仙堂 2017）
      # fact: rikyu-08
      - 語り: では、私たちがよく知る、利休の切腹の場面は、どこから来たのでしょうか。
        tone: 疑問
        background: {image: paintings/hidenaga_rikyu_death_poem_met.jpg, credit: "《千利休像》辞世の偈入り、17世紀前半（メトロポリタン美術館）"}
      # fact: rikyu-08
      - 語り: 三つ目の記録、『千利休由緒書』です。その日の天気や、見張りの様子まで、場面を詳しく書いているのは、この文書なんです。
        card: {head: "千利休由緒書", body: 切腹の場面を詳しく書く}
      # fact: rikyu-08
      - 語り: ところが、これを書いて差し出したのは、千家の4代目、江岑宗左。利休の、ひ孫の世代にあたる人です。
        tone: 強調
      # fact: rikyu-08
      - 語り: 江岑宗左は、紀州の徳川家に仕えていました。その紀州徳川家に命じられて、家の由来を書いて出したのが、この由緒書でした。
        figure: {type: stats, title: 利休の最期　記録はどう書いたか, items: [[北野社家日記, 成敗された, 同じ時代の京の日記], [多聞院日記, 切腹は「うわさ」, 高野山へ追放の話も], [千利休由緒書, 切腹の場面を詳しく, ひ孫の世代が後年に]], upto: 3}
