# 公開の予定は 10/28 12:00。
# 型：1本に1つの「なぜ」＝「なぜ利休は切腹させられたのか――本当に切腹したのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭は天正19年2月の京の場面（伊達家に届いた書状の言葉＝木像の磔）から。0〜10秒に知らない事実（木像が罪人として磔にされた）。
#   最後の章で「その後」（少庵・宗旦・聚光院・高岡の新収蔵の書状・いまの三門の像は2代目）まで語り、冒頭の橋に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。次回予告なし（story: true）。
# 記録の食い違いを表で並べたのは3か所：①利休の最期（北野社家日記「成敗」／多聞院日記「切腹のうわさ」と「高野山へ追放」／千利休由緒書の切腹の場面）
#   ②切腹の理由（公に示された罪／権力争い／三成の讒言／娘の話）③切腹したのか、生きていたのか（由緒書の辞世／中村修也さんの読む秀吉の書状）。
# 「首を木像に踏ませた」は一次史料が無い（rikyu-04、出どころ0）ので使わない。首がさらされた話も、福井幸男さんの論文の抄録だけなので言わない。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/千利休_facts_20261028.yaml、rikyu-01〜22）にあるものだけ。行の上に `# fact: rikyu-NN`。
#   カードに無い「誰でも知っている前置き」（利休は秀吉に仕えた茶人・堺の出・宗易は利休の前の名・秀吉の天下統一）は短く使い、# fact を付けない。
#   中村修也さんの説の年（2015）はカードに無いので言わない（紹介した田中仙堂さんの記事の 2017 年だけ言う）。朝尾の名はカードで誤記の疑いがあるので言わない。
#   『北野社家日記』の仲裁（rikyu-17）は「大徳寺の僧も罰せよという声」と「大政所・秀長の後室のとりなし」だけ。誰をとりなしたかは断定しない。
#
# 台詞の決まり（10-24）：記録の言葉＋想像の台詞。
#   記録＝出どころを語りで言ってから読む。伊達家文書・北野社家日記・多聞院日記・由緒書は語りの中で読む。秀吉の書状の一節は who: 秀吉書状。
#   想像＝ 3か所（利休想像。気持ちの言葉だけ、新しい事実を足さない）。各台詞のコメントに【記録】／【想像】と、食い違わない記録を書いた。
#
# 絵：paintings/ の既存の絵で仮置き。一条戻橋・金毛閣・聚楽の屋敷の警固・茶杓を削る手・聚光院などの足りない場面は「AI絵：<英語の指示>」をコメントに。
# 広告の配慮：切腹は「腹を切る」「命を絶つ」まで。磔は木像のことだけ。死は「亡くなった」。
