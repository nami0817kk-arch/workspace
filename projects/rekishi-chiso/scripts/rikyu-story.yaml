      - 語り: 原文は、「きのふ、りきうの茶にて、御膳も、あがり」。昨日は、利休の茶で、食事も進んだ。今の言葉にすると、そうなります。
        card: {head: "秀吉の書状", body: 「きのふりきうの茶にて」}
      - 語り: 死んだはずの利休の茶を、その翌年に、秀吉が飲んでいる。もし書状の年が、そのとおりなら、利休は、生きていたことになります。
        tone: 強調
        portrait: null
      - 語り: もしそうなら、あの木像の磔も、違って見えてきます。人を罰する代わりに、姿を写した像を罰したのか。それとも、像を罰したあとで、人も罰したのか。
        tone: 疑問
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
      - 語り: 同じ時代の記録が、「切腹」と言い切っていない以上、この問いは、簡単には、閉じられません。
        tone: しみじみ
      # fact: rikyu-09, rikyu-08
      - 語り: 一方には、切腹の場面と辞世を詳しく書いた、千家の由緒書。もう一方には、翌年に利休の茶を楽しむ、秀吉の手紙。
        figure: {type: stats, title: 利休は切腹したのか, items: [[千利休由緒書, 切腹の場面と辞世, 千家4代 江岑宗左が後年に], [秀吉の書状, 「きのふりきうの茶にて」, 利休の死の翌年とされる], [多聞院日記, 切腹は「うわさ」, 高野山へ追放の話も]], upto: 3}
      - 語り: ここでも、記録は、ふたつの話を、並べたままです。
        tone: しみじみ
      # fact: rikyu-09
      - 語り: ただ、気をつけたいのは、この書状の年が、「翌年に書かれたという」見立てだ、ということです。手紙の年が一つずれれば、利休の生前の茶の話になります。
        figure: null
      # fact: rikyu-09
      - 語り: 田中仙堂さんの記事の題は、「千利休は、切腹せず生きていた？」。最後に、問いの印が付いています。
        tone: しみじみ
      - 語り: 新説を、新説として紹介しながら、言い切ってはいない。題の終わりの、たった一文字が、この話の難しさを、物語っています。
      - 語り: 切腹の場面を詳しく書いたのは、後の時代の、子孫の文書。生きていたという説の根拠は、年が一つずれれば崩れる、一通の手紙。どちらの側にも、確かな決め手は、ありません。
        background: {image: paintings/hidenaga_rikyu_death_poem_met.jpg, credit: "《千利休像》辞世の偈入り、17世紀前半（メトロポリタン美術館）"}
        tone: しみじみ
      # fact: rikyu-06
      - 語り: 思い出してください。同じ時代の『多聞院日記』は、切腹を「うわさ」と書き、高野山へ追放された、という話も載せていました。
        background: {image: paintings/hideyoshi_daibutsu_okyo.jpg, credit: "円山応挙《京大仏図》1796年以前（方広寺の大仏殿、江戸時代に建て直した姿）"}
      - 語り: 追放された利休が、どこかで、生きていたのか。それとも、うわさは、うわさに過ぎなかったのか。記録だけでは、まだ、決めきれません。
        tone: しみじみ
      # 【想像3】利休。記録：秀吉の書状「きのふりきうの茶にて御せんもあがり」（rikyu-09）。茶を点てる人としての気持ちの言葉だけ（生きていたとは言わない）
      - 人物: 「……一服、いかがでございましょう」
        who: 利休想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
      - 語り: 利休が、どこで、どう世を去ったのか。確かなのは、この年を境に、利休が、秀吉の茶の席から、姿を消したことです。
        portrait: null
        hook: true
      - 語り: そして、残された家族には、長い冬が、始まりました。
        tone: 重い
        hook: true

  # ================================================================ 第5章 その後（⑥）
  - title: まとめ：利休はどこに眠るのか　1594年 少庵の許しといまの像
    background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
    year: 1594
    lines:
      # ニッポン旅マガジン（2021）
      # fact: rikyu-18
      - 語り: 利休の死のあと、跡を継ぐはずだった養子の少庵は、京を離れ、会津の蒲生氏郷のもとで、ひっそりと、こもって暮らしました。
        card: {head: "少庵", body: 会津の蒲生氏郷のもとに蟄居}
        # AI絵：a quiet snowy castle town in northern Japan, 1590s, a lone man in plain robes walking along a wooden corridor, seen from far away, muted colors, painterly, no faces
      # fact: rikyu-18
      - 語り: 許しが出たのは、文禄3年、1594年。徳川家康と、蒲生氏郷のとりなしでした。少庵は京に戻り、千家を、もう一度、興します。
        card: {head: "文禄3年 1594年", body: 家康と氏郷のとりなしで許される}
      - 語り: 利休の死から、3年。茶の家は、途切れずに、つながりました。
        tone: しみじみ
      - 語り: 罰を受けた茶人の跡継ぎを、大名たちが、とりなして京へ戻した。利休の茶は、秀吉に罰せられたあとも、大名たちの間で、求められ続けていたのかもしれません。
        background: {image: paintings/hidenaga_jurakudai_screen.jpg, credit: "《聚楽第図屏風》桃山時代（三井記念美術館蔵）"}
      # fact: rikyu-19
      - 語り: 少庵は、大徳寺で僧になっていた、息子の宗旦を、ふつうの暮らしに戻させます。
        background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
      # fact: rikyu-19
      - 語り: その宗旦が、寛永10年、1633年ごろに建て直したのが、茶室、「《不審菴》」です。
        card: {head: "1633年ごろ", body: 宗旦が不審菴を再建}
      # fact: rikyu-19
      - 語り: そして、宗旦の子どもたちが、表千家、裏千家、武者小路千家。いまに続く、三つの千家の祖となりました。
        figure: {type: stats, title: 利休のあとの千家, items: [[少庵, 1594年に許され京へ, 家康と蒲生氏郷のとりなし], [宗旦, 1633年ごろ不審菴を再建, 大徳寺から還俗], [宗旦の子ら, 表・裏・武者小路, 三千家の祖]], upto: 3}
      # fact: rikyu-20
      - 語り: 利休の墓は、大徳寺の中の小さな寺、聚光院にあります。聚光院は、三つの千家の菩提寺で、ふだんは、公開されていません。
        figure: null
        card: {head: "聚光院", body: 利休の墓・三千家の菩提寺}
        # AI絵：a small quiet Zen subtemple garden inside a large Kyoto temple complex, moss and stone lanterns, a simple stone grave marker under trees, autumn, soft light, painterly, no people
      - 語り: 木像が罪になった、あの大徳寺。その同じ寺の中に、利休は、眠っているんです。
        tone: しみじみ
      # 堺市・ニッポン旅マガジン
      # fact: rikyu-22
      - 語り: 生まれた町の堺には、利休の屋敷の跡が、残っています。ただし、ここは、あくまで、言い伝えの地として、市の史跡になっている場所です。
        background: {image: paintings/ieyasu_sakai_montanus_engraving.jpg, credit: "モンタヌス『日本誌』「堺」1669年ごろ"}
        card: {head: "堺の屋敷跡", body: 伝承地として市の史跡}
      # fact: rikyu-22
      - 語り: そこに残る、椿の井戸。その井戸の屋根は、大徳寺の門の、古い材木で建てた、と伝わります。
        tone: しみじみ
      # 高岡市立博物館・文化遺産オンライン（2026）
      # fact: rikyu-21
      - 語り: そして、2026年の9月。富山県の高岡市立博物館が、宗易、つまり利休の書状を、新たに収めました。
        card: {head: "2026年9月", body: 高岡市立博物館が利休の書状を収蔵}
        background: {image: paintings/hidenaga_letter_1586.jpg, credit: "豊臣秀長の書状（寿福院宛）1586年"}
      # fact: rikyu-21
      - 語り: 日付は、2月10日。年は、わかっていません。宛先は、徳川家の重臣、榊原康政と考えられています。
      # fact: rikyu-21
      - 語り: この書状は、これまでの史料集にも、利休の手紙を集めた研究書にも、載っていません。博物館は、「新発見史料の、可能性がある」としています。
        tone: 強調
        card: {head: "利休の書状", body: 新発見の可能性}
      - 語り: 400年以上たった今も、利休の言葉は、まだ、見つかり続けているんです。
        tone: しみじみ
      # 東博の大徳寺展（2026）
      # fact: rikyu-14
      - 語り: そして、この秋。東京国立博物館の特別展「大徳寺」では、ふだんは入れない、三門の上の階、金毛閣の中が、再現されています。会期は、2026年10月14日から、12月6日まで。
        background: {image: paintings/hidenaga_daitokuji_shoko_yoshitoshi.jpg, credit: "月岡芳年《紫野大徳寺焼香之図》1877年ごろ（信長の葬儀で焼香に進む秀吉）"}
        card: {head: "東京国立博物館", body: 特別展「大徳寺」10/14〜12/6}
      # fact: rikyu-14, rikyu-13
      - 語り: そこで、初めて公開されたのが、いま金毛閣に置かれている、千利休の立像です。
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
        card: {head: "初公開", body: 三門の千利休立像}
        # AI絵：a carved wooden statue of an old Japanese tea master in black robes standing on a pedestal inside a dim museum gallery, soft spotlight, 2020s, seen from a distance, painterly, no visitors' faces
      # fact: rikyu-13, rikyu-15
      - 語り: ただし、この像は、磔にされた初代ではありません。2代目です。頭の部分は、天保11年、1840年。体の部分は、明治2年、1869年に、田中浄慶が作りました。
        tone: 強調
        figure: {type: stats, title: 三門の利休像, items: [[初代の木像, 1591年, 秀吉が磔に], [今の像の頭, 1840年, 天保11年], [今の像の体, 1869年, 明治2年 田中浄慶の作]], upto: 3}
      - 語り: 秀吉が罪とした、門の上の利休の像。それを、寺は、200年以上ののちに、もう一度、門の上に戻したんです。
        tone: しみじみ
        figure: null
        portrait: null
      # 締め：冒頭の場面（一条戻橋）と問いに戻る
      # fact: rikyu-03
      - 語り: 天正19年、1591年の2月。一条戻橋で、利休の木像は、罪人として、さらされました。
        tone: しみじみ
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_right.jpg, credit: "狩野永徳《洛中洛外図屏風》（上杉本）右隻"}
        card: {head: "天正19年2月", body: 一条戻橋}
      - 語り: なぜ利休は、切腹させられたのか。公に示された罪のほかに、権力争い、三成の讒言、娘の話と、答えは、今も一つに定まりません。
        tone: しみじみ
        card: {head: "なぜ", body: 理由は今も定まらない}
      - 語り: そして、本当に切腹したのか。同じ時代の記録は、「成敗」と「うわさ」。詳しい場面は、後の時代の文書の中にだけ、ありました。
        tone: しみじみ
        card: {head: "本当に切腹したのか", body: 「成敗」と「うわさ」}
      - 語り: 磔にされた木像は、もう残っていません。けれど、門の上には、今も、利休が立っています。
        portrait: {image: paintings/hidenaga_rikyu_tohaku.jpg, caption: "千利休（長谷川等伯画、1595年）"}
