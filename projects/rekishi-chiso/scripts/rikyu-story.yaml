terms:
  磔: 罪人を柱や板にしばりつけて、さらす刑
  楼上: 二階建ての門や建物の、上の階
  塔頭: 大きな寺の境内にある小さな寺
  蟄居: 家にこもらせて、外へ出さない罰
  還俗: 僧が僧をやめて、ふつうの人に戻ること
  讒言: 人を陥れるために、事実でない悪口を告げること
  菩提寺: 一家の墓を置き、供養をする寺
  由緒書: 家や物の起こり・いわれを書いて差し出した文書

