# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  万里の長城を守った兵が、毎朝まず確かめたのは、敵の姿ではありませんでした。砂の上の、足跡です。
  壁の外の砂をならしておき、夜のあいだに誰かが越えなかったかを見て回る。その結果を「29日のあいだ、人も馬も、越えて出入りした跡なし」と木の札に書き残しました。
  2000年あまり前の漢の時代、長城の兵は、どんな毎日を送っていたのか。砂の中から見つかった木の札の記録で、たどります。
  この動画でわかること
  ・兵はどこから、どれだけの道のりを来たのか
  ・毎朝の砂の見回りと、のろしの決まり
  ・ひと月の食べ物と塩、家族の分
  ・日干し煉瓦づくりと、長たちの秋の弓の試験
  ・靴を頼む手紙、つけ売りと借金、病気と故郷へ帰る棺
description_note: |-
  この動画に、想像の台詞や作った話はありません。記録の言葉は、出土した木の札（居延漢簡・居延新簡・敦煌の懸泉置の札など）を引いた研究から取り、今の言葉にして読んでいます。
  おもな出どころ：高村武幸（駿台史学 2000、鷹取祐司の研究の要約を含む）、高震寰（中央研究院 歴史語言研究所 2024）、邢義田（集刊 1995）、侯旭東（人民論壇 2024）、黄永美（中国辺疆史地研究 2021）、特日格楽（内蒙古大学）、鲁西奇（史学集刊 2020）、張俊民（簡帛網 2018・2019）、王子今、馬彪、丘光明（1992）、黄浩波（簡帛網 2012）、黎明釗・馬增榮（中國文化研究所學報 2011）、于振波（2005）、魏永康（2025）、劉金華（2005）、鄭伊凡（史語所集刊 2023）、馬怡（2008）、唐俊峰（中國文化研究所學報 2014）、姚磊（中国社会科学報 2026）、郭永秉（文匯報 2018）、Charles Sanft（Renditions 2013）、スタイン『Serindia』（1921）、『漢書』武帝紀・『史記』匈奴列伝、中央研究院 歴史語言研究所の文物陳列館、新華社と甘粛簡牘博物館（2024）、澎湃新聞（2023）ほか。
  ひと月のアワの量と、のろし台のあいだの長さは、資料によって違います。リットルへの換算は、漢の1升をおよそ200ミリリットルとした目安です。のろしの速さの「時」は当時の時間の区切りで、今の時間には直していません。月日は当時の暦のものです。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "Great Wall Soldiers Weren't There to Fight? What They Checked in the Sand Every Morning"
  description: |-
    The first thing a soldier on the Great Wall checked every morning was not the enemy. It was footprints in the sand.
    They smoothed a strip of sand outside the wall and walked it to see whether anyone had crossed in the night, then wrote on a wooden slip: "For 29 days, no tracks of men or horses crossing."
    How did the soldiers of the Han-dynasty wall live, more than 2,000 years ago? We follow them through the wooden slips found in the desert.
    In this video you will learn:
    - Where the soldiers came from, and how far they traveled
    - The morning sand patrol and the rules for beacon signals
    - A month of grain and salt, and rations for their families
    - Making mud bricks, and the officers' autumn crossbow test
    - A letter asking for shoes, debts and credit sales, sickness, and the coffins that carried the dead home
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "For 29 Days, No Tracks"
    - "Where Did the Soldiers Come From?"
    - "What Did They Do Every Morning?"
    - "How Did They Signal an Attack?"
    - "What Did They Eat?"
    - "Mud Bricks and the Autumn Archery Test"
    - "Clothes, Shoes and Debts"
    - "Sickness, Death and the Journey Home"
    - "Summary: How the Wall's Soldiers Lived"

