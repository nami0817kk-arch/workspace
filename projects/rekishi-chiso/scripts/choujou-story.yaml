# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と ise-story.yaml・rouyashiki-story.yaml の型）。万里の長城を守った兵の暮らし。2026-11-22 作成。
# 公開の予定は 11/29 19:00（19時枠）。型は docs/story-main.md「00. 伸びる型」の E 暮らし型（ユーザーの○済み）。主語は「漢の長城を守った兵」という1つの役目で、最後まで主役。
#   誰でも持つ像＝長城の兵は、壁の上で敵と戦っていた。裏返す一点＝毎朝まず確かめたのは、敵ではなく砂の上の足跡。そして何でも木の札に書き残した（見回り・食料・病気・借金・試験）。
#   問い＝「長城の兵は、どんな毎日を送っていたのか」。答え＝砂の見回りと、のろしの決まりと、作業。食べ物も着る物も足りず、借金と病に追われ、死ねば小さな棺で故郷へ送られた。何も起きなかった日まで札に書き、その札が2000年後に残った。
#   時代は漢（前漢の後半〜後漢のはじめ、前102年〜後29/30年の記録）。明のレンガの長城ではない、と第1章の頭で一度だけ言う。始皇帝の回（shikoutei）とは重ねない（あちらは「長城を誰が作ったか」。こちらは兵の暮らし）。
#   秋射を受けたのは兵ではなく長たち（士吏・候長・隧長）。靴の手紙の元・宣の手紙の宣は下級の役人。語りでそう言う。
#   想像の台詞なし。記録の言葉は語りで「今の言葉にすると」と言って読む（roles を足さない＝config.yaml を変えない）。語りは剣崎1人。
# 既出と重ねない：posted.json・scripts/ に居延漢簡・烽火・漢の兵の回は無い（11-22 grep。shikoutei の長城は始皇帝が壁をつないだ話とショート s3 だけ）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/万里の長城の兵の暮らし_facts_20261122.yaml、choujou-01〜62。担当A=のろしと天田・B=出身と食料と衣とお金・C=仕事と試験と病と手紙・D=発見と塞の造りと事件）にあるものだけ。行の上に `# fact: choujou-NN`。
# 記録の食い違い（並べたもの2つ）：①1か月のアワの量（記録の数のまま漢の升を当てれば約67リットル／小さな石の数とみて大きな石に直せば2石＝約40リットル。馬彪・高自強。決着していない）
#   ②のろし台と台のあいだ（侯旭東 2024：1.2〜2キロ／黄永美 2021：0.5〜2キロ）。
#   並べなかった食い違い：最初の発掘の札の数（約1万3千／1万あまり）、木中隧の候長の名（王褒・周褒）、1日の時の数（16か18）、居延新簡の発掘の期間、破城子の札の数、懸泉置の札の数。
# 自分で計算した数（全部計算し直した。11-22 の事実照合2人も同じ値）：
#   前102年→2026年＝2,127年。記録の年は前102〜後30年なので「2000年あまり前」。
#   1か月の食 三石三斗三升少＝333と1/3升×0.2リットル＝66.7リットル→約67リットル。大石2石＝200升×0.2＝40リットル。大人の女 2石1斗6升大÷3石＝0.72→「男の7割ほど」。
#   塩 3升×0.2＝0.6リットル。894g÷30＝29.8g→「1日30グラム近く」。726g÷30＝24.2g。
#   庸 2万9千÷4,600＝6.3→「6倍あまり」。
#   秋射 12本・合格6本・1本15日 → 全部当てれば (12−6)×15＝90日の労を足す。1本も当たらなければ 6×15＝90日を削られる。中労は1年、功1つは中労4年。
#   のろし 159里、1時に100里 → 1.59時（札の「1時6分」＝1.6時）。5時かかった → 遅れ 5−1.6＝3.4（札の「3時4分」）。5÷1.6＝3.1→「3倍あまり」。檄 10里÷100里＝10分の1。
#     漢の「時」は1日を16か18に分けた区切りで今の時間に直せないので、語りでは「1つの時」と言い、時刻に聞こえる「1時6分」は言わない。
#   1里はおよそ400メートル（侯旭東の3〜5里＝1,200〜2,000メートルから。照合では416メートル）→100里＝約40キロ。
#   屯田 27,143÷224＝121.2→「毎日120人ほど」。
#   煉瓦 80×3＝240個。
#   槥 38銭、下級の役人の月の給料600銭 → 600÷38＝15.8→「16分の1ほど」。
#   居延漢簡 1940年8月4日に香港を出る→1965年10月21日に受け取る＝25年あまり。
#   魏郡（鄴、東経114.4・北緯36.3）→居延（東経101・北緯41.8）の直線：東西 13.4度×111×cos39°≒1,156キロ、南北 5.5度×111≒611キロ → √(1156²+611²)≒1,308キロ→「まっすぐ測っても1,300キロほど」。
#   スタイン：9ヤード＝8.2メートル、1.5〜2フィート＝46〜61センチ、4〜5インチ＝10〜13センチ。葦の層2〜4インチ＝5〜10センチ、粘土6〜7インチ＝15〜18センチ。
#   和暦：太初3年＝前102年、始元2年＝前85年、五鳳4年＝前54年、永光2年＝前42年、建昭2年＝前37年、河平元年＝前28年、永始4年＝前13年、建武5年＝後29年（ただし建武5年12月11日は、
#     冬至29年12月22日ごろ・次の新月12月24日ごろから計算して、西暦30年の1月はじめごろ。語りは「西暦では、30年の年明けのころ」。照合の担当の計算）。
# 確かめられなかったこと（台本では言わない）：茭を1日何束刈るか、日作簿の原文、守御器簿の品目の全部、候長の月給1,200銭、故郷から居延までの里数、官衣の品目、寇恩が魚を売りに行った先、スタインの敦煌の札の数、
#   のろしの時速（1日を16時とするか18時とするかで変わる）、「百人以下1烽」のような人数の段階（簡文で確かめられず）、見回りの道が今も残るか。寇恩の争いは兵の暮らしから外れるので使わない。
# 絵：AI 絵（Gemini。一覧は scripts/story/choujou_main_look.yaml の頭）だけ。実在の人物の顔は描かない。字・旗の字は描かない。
