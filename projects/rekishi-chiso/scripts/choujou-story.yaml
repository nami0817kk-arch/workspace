sections:
  # ================================================================ 序章
  - title: 「29日のあいだ、越えた跡なし」　砂の上の足跡
    lines:
      # fact: choujou-10
      - 語り: 万里の長城を守った兵が、毎朝、まず確かめたのは、敵の姿ではありません。砂の上の、足跡でした。
        tone: 重い
      # fact: choujou-10, choujou-09
      - 語り: 壁の外の砂を、平らにならしておき、夜のあいだに、誰かが越えなかったかを、見て回るのです。
      # fact: choujou-10
      - 語り: その結果は、木の札に、こう書かれて残りました。29日のあいだ、人も馬も、越えて出入りした跡なし。
        card: {head: "木の札の記録", body: 29日間、越えた跡なし}
      - 語り: 長城の兵は、いったい、どんな毎日を送っていたのか。何を食べ、何を着て、家族に、何を書き送ったのか。
        tone: 疑問
      # fact: choujou-47, choujou-52
      - 語り: その答えは、砂の中から見つかった、2000年あまり前の木の札に、残っています。その数は、1万枚を超えます。
      - 語り: 名前と、数と、日付。札の記録から、長城の兵の暮らしを、1つずつ、たどっていきます。
      - 語り: まずは、兵が、どこから来たのか。
        hook: true
      - 語り: その故郷は、壁から、思いのほか遠い所でした。
        hook: true

  # ================================================================ 第1章 兵はどこから来たのか
  - title: 「兵はどこから来たのか」　前102年 居延の塞と、遠い故郷
    lines:
      # fact: choujou-55
      - 語り: 舞台は、今の中国の内モンゴル、居延と呼ばれた土地です。紀元前102年、漢の武帝の命で、武将の路博徳が、ここに塞を築きました。
        figure: {type: map, title: 兵の故郷から居延へ, bounds: [93.0, 116.0, 33.0, 43.5], places: [[魏郡, 114.4, 36.3], [長安, 108.9, 34.3], [姑臧, 102.6, 37.9], [張掖, 100.4, 38.9], [居延, 101.0, 41.8], [敦煌, 94.7, 40.1]], route: [魏郡, 長安, 姑臧, 張掖, 居延], upto: 1, note: 漢の西北の長城}
      # fact: choujou-55
      - 語り: 漢書の武帝紀には、ただ一行、路博徳、居延を築く、とあります。同じ年の秋、北の匈奴が、酒泉と張掖に攻め入っています。
      # fact: choujou-56
      - 語り: ここでいう長城は、観光地で見る、レンガの長城ではありません。2000年あまり前の、漢の時代の壁です。
      # fact: choujou-56
      - 語り: 探検家スタインは、1921年に出した報告で、敦煌に残る漢の長城を、葦の束の層と、砂利まじりの粘土の層が、交互に重なった壁、と記録しています。
      # fact: choujou-56
      - 語り: 葦の層は、厚さ5センチから10センチほど。粘土の層は、15センチから18センチほど。材料は、近くに生えている葦や、ポプラの枝でした。
        card: {head: "漢の長城の壁", body: 葦の束と粘土を交互に積む}
      # fact: choujou-18
      - 語り: その壁を守る兵の任期は、1年。高村武幸さんが、2000年に、駿台史学という雑誌に書いた論文によると、毎年4月1日に、入れ替わりました。
        tone: 重い
      # fact: choujou-18
      - 語り: 兵は、県ごとに、車を連ねて旅をしました。車1台に、兵がおよそ10人。故郷の郡で着る物を受け取り、武威郡の姑臧で武器を受け取ってから、任地へ向かいます。
        figure: {type: map, title: 兵の故郷から居延へ, bounds: [93.0, 116.0, 33.0, 43.5], places: [[魏郡, 114.4, 36.3], [長安, 108.9, 34.3], [姑臧, 102.6, 37.9], [張掖, 100.4, 38.9], [居延, 101.0, 41.8], [敦煌, 94.7, 40.1]], route: [魏郡, 長安, 姑臧, 張掖, 居延], upto: 3, note: 漢の西北の長城}
      # fact: choujou-19
      - 語り: では、兵の故郷は、どこだったのか。高村さんは、出身の郡が分かる札を、268点数えました。
        figure: {type: bars, title: 札に書かれた兵の出身（点）, bars: [[魏郡, 75], [東郡, 37], [淮陽郡, 33], [南陽郡, 26], [昌邑国, 19], [河東郡, 17]], upto: 1}
      # fact: choujou-19
      - 語り: いちばん多いのは、魏郡、75点。今の河北省の南から、河南省の北にかけての、黄河の下流の平野です。
      # fact: choujou-19
      - 語り: 居延の兵では、魏郡の出身だけで、およそ4割。東郡、南陽郡、河東郡を足した、4つの郡だけで、8割を超えていました。
        figure: {type: bars, title: 札に書かれた兵の出身（点）, bars: [[魏郡, 75], [東郡, 37], [淮陽郡, 33], [南陽郡, 26], [昌邑国, 19], [河東郡, 17]], upto: 6}
      - 語り: 魏郡から居延まで、地図の上で、まっすぐ測っても、1,300キロほど。その道を、車を連ねて来たのです。
        figure: {type: map, title: 兵の故郷から居延へ, bounds: [93.0, 116.0, 33.0, 43.5], places: [[魏郡, 114.4, 36.3], [長安, 108.9, 34.3], [姑臧, 102.6, 37.9], [張掖, 100.4, 38.9], [居延, 101.0, 41.8], [敦煌, 94.7, 40.1]], route: [魏郡, 長安, 姑臧, 張掖, 居延], upto: 5, note: 漢の西北の長城}
      # fact: choujou-21
      - 語り: なぜ、そんな遠くから来たのか。高村さんは、黄河の水害で家を失った人々が、大勢、河西へ移されていて、同じ郷里の人が、現地にいたことが大きい、と見ています。
        figure: null
      # fact: choujou-26
      - 語り: ただ、行きたくなければ、人を雇って、代わりに行かせることもできました。庸と呼ばれる、身代わりです。
      # fact: choujou-26
      - 語り: ある名簿では、24歳の若者が、29歳の男の代わりに来て、その代金は、2万9千銭。別の札では、4,600銭。6倍あまりの開きです。
        card: {head: "身代わりの代金", body: 2万9千銭と4600銭}
      # fact: choujou-46
      - 語り: 黎明釗さんたちは、2011年に、香港中文大学の学術誌に載せた論文で、両方の年が分かる11枚のうち、9枚で、身代わりの方が若かった、と数えています。
      # fact: choujou-46, choujou-27
      - 語り: 年の差は、いちばん大きくて、19歳。若者が、代金を受け取って、年上の人の代わりに、長城へ行ったのです。
      - 語り: そうしてたどり着いた兵を、最初に待っていたのは、砂でした。
        hook: true
      - 語り: その砂は、毎日、ならし直さなければなりません。
        hook: true

  # ================================================================ 第2章 毎朝の見回り
  - title: 「毎朝、何をしていたのか」　天田の足跡と、のろし台の数人
    lines:
      # fact: choujou-15
      - 語り: 兵が暮らしたのは、長城に沿って並ぶ、のろし台です。1つの台を守るのは、隧長と呼ばれる長と、兵が2人か3人。
        card: {head: "のろし台の守り", body: 隧長と兵2〜3人}
      # fact: choujou-15
      - 語り: 清華大学の侯旭東さんは、2024年の論考で、台と台のあいだは、1.2キロから2キロ、と書いています。
      # fact: choujou-15
      - 語り: ところが、江蘇師範大学の黄永美さんは、2021年の論文で、0.5キロから2キロ、としています。近い所では、500メートルおきに、台が立っていたことになります。
        tone: 疑問
      # fact: choujou-10
      - 語り: 台の外側には、天田と呼ばれる、砂の帯がありました。砂を平らにならしておけば、越えた者の足跡が、必ず残ります。
        card: {head: "天田", body: 砂をならした見張りの帯}
      # fact: choujou-10
      - 語り: 武漢大学の魯西奇さんが、2020年に史学集刊で取り上げた札には、9人で、砂をならす、という割り振りまで、書かれています。
      # fact: choujou-09
      - 語り: その帯を歩いて見回る仕事を、日迹といいました。日ごとに、跡を見る、という意味です。
      # fact: choujou-09
      - 語り: ひと月の見回りを、兵3人で、10日ずつ、交代で受け持った記録があります。4月の10日間は、張富という兵の番でした。
      # fact: choujou-09
      - 語り: 別の札には、第九隧の北の境から、第四隧の南の境まで、29日間、見回って、越えて出入りした跡なし、とあります。
      # fact: choujou-12
      - 語り: 本当に最後まで歩いたかは、どう確かめたのか。新華社が、甘粛簡牘博物館と、2024年に作った紹介によると、木の印を使いました。
      # fact: choujou-12
      - 語り: 隣ののろし台まで歩いたら、自分の印を砂に挿し、前の日の兵が挿していった印を、抜いて持ち帰るのです。
        card: {head: "見回りの証拠", body: 前の日の兵の印を持ち帰る}
      # fact: choujou-11
      - 語り: 見回りの結果は、帳面にまとめられ、ひと月ごとに、上の役所へ送られました。
      # fact: choujou-16
      - 語り: その見回りの道は、100年あまり前に、スタインが訪れたときにも、残っていました。壁から8メートルほど離れて、踏み固められた細い道が、続いていたのです。
      # fact: choujou-16
      - 語り: 幅は、50センチほど。深さは、10センチあまり。2000年近く、消えずに残っていた、兵の足の跡です。
        tone: しみじみ
      # fact: choujou-13
      - 語り: のろし台には、備えておく道具の帳面もありました。台湾の中央研究院が持つ1枚には、40種類あまりの道具が並びます。
      # fact: choujou-14
      - 語り: その中には、犬も入っていました。紀元前28年の札では、将軍の見回りで、ある隧長の剣が錆びていて、犬が1匹足りない、とされ、隧長を辞めさせるよう求められています。
        tone: 重い
        card: {head: "前28年", body: 剣が錆び、犬が1匹足りない}
      # fact: choujou-14
      - 語り: のろしを見るための、照準の道具3つが、見るべき所を見通せず、3点減らされた、という採点の札もあります。
      - 語り: 毎朝の砂は、ほとんどの日、何も語りません。
        hook: true
      - 語り: けれど、ある日の夕暮れ、砂の帯に、人が入りました。
        hook: true

  # ================================================================ 第3章 のろしの決まり
  - title: 「敵が来たら、どう知らせたのか」　のろしの決まりと、建武5年の夕暮れ
    lines:
      # fact: choujou-01
      - 語り: 敵が来たときの合図には、細かい決まりがありました。のろしの決まりを書いた、17枚の札が、残っています。
        card: {head: "のろしの決まり", body: 17枚の札に書かれた}
      # fact: choujou-01
      - 語り: たとえば、匈奴が昼に、北の塞に入ったら、のろしを2つ上げ、積んだ柴を1つ燃やす。夜なら、柴を燃やし、たいまつの火を、明けるまで、絶やさない。
      # fact: choujou-02
      - 語り: 千騎以上の匈奴が入ったときや、見張り台や畑の小屋を襲ったときは、柴を2つ燃やします。
      # fact: choujou-02
      - 語り: ある関所の門の外の台では、天田に越えた跡があれば、のろし1つ、大きな旗1つ、柴を2つ。跡がなければ、柴は燃やしません。砂の足跡が、合図の大きさを変えていたのです。
      # fact: choujou-08
      - 語り: 柴の山は、敦煌で見つかったもので、縦横2メートルを超え、高さは1メートルあまり。重さは、1.5トンほどと見られています。
        card: {head: "のろしの柴", body: 1つでおよそ1.5トン}
      # fact: choujou-08
      - 語り: 葦を束ねたたいまつは、大きいもので、長さ2メートル33センチもありました。
      # fact: choujou-04
      - 語り: のろしの伝わる速さにも、決まりがありました。ただ、ここでいう時は、今の1時間ではなく、1日をいくつかに分けた、当時の時の区切りです。
      # fact: choujou-04
      - 語り: 決まりの速さは、1つの時に、100里。今の距離で、40キロほどです。
      # fact: choujou-04
      - 語り: ある札は、159里先の役所まで、1つ半ほどの時で届くはずののろしが、5つの時もかかったとして、遅れの理由を、問いただしています。決まりの、3倍あまりの時間です。
        figure: {type: bars, title: 159里ののろしにかかった時, bars: [[決まり, 1.6], [かかった, 5]], labels: [1つ半ほど, 5つ]}
      # fact: choujou-05
      - 語り: のろしは、隣の台へ順に渡すのではなく、いくつか先の台へ、飛ばして渡しました。
        figure: null
      # fact: choujou-03
      - 語り: 大風や雨で火が使えないときは、人が走り、馬で駆けて、文書を届けます。ただ、その速さは、のろしの10分の1でした。
      # fact: choujou-06
      - 語り: 決まりを覚えていない者は、罰せられました。のろしの合図が読めない役人2人が、職を解かれた札があります。
      # fact: choujou-06
      - 語り: いくつかの台をまとめる長、候長が、のろしを遅らせたときには、赤い土を、300丈分運べ、という罰が科されています。
      # fact: choujou-07, choujou-58
      - 語り: そして、後漢の建武5年の12月。西暦では、30年の年明けのころです。日が沈みかけたころ、匈奴が、木中隧という台の、天田に入りました。
        tone: 重い
        card: {head: "建武5年12月の夕暮れ", body: 木中隧に匈奴が入る}
      # fact: choujou-07
      - 語り: 隧長は、のろしを2つ、大きな旗を1つ上げ、柴を1つ燃やしました。
      # fact: choujou-07
      - 語り: ところが、隣の城北隧から見えたのは、煙だけ。のろしは、見えませんでした。
        tone: 疑問
      # fact: choujou-58
      - 語り: 確かめに行かされたのは、李丹という、下の役人です。駅の馬に乗って、木中隧へ向かう途中、伏せていた匈奴6人に、馬ごと連れ去られました。
        tone: 重い
      # fact: choujou-58, choujou-07
      - 語り: 内モンゴル大学の特日格楽さんの論文によると、22枚の札に残るこの記録で、候長は、のろしが決まりどおりでなかったとして訴えられ、居延の獄に入れられています。
      # fact: choujou-59
      - 語り: 別の札の束には、鎧を着た匈奴40騎あまりが、台を焼いた報告もあります。兵も食料も足りず、守りきれないかもしれない、と書かれています。
      # fact: choujou-59
      - 語り: 報告を書いた塞の長は、文書の結びに、頭を地につけ、死罪に当たる、という決まりの言葉を添えていました。
      - 語り: 合図を上げる兵も、腹が減っては、立っていられません。
        hook: true
      - 語り: その食べ物の名簿には、兵ではない、15歳の名前も、載っていました。
        hook: true

  # ================================================================ 第4章 食べ物
  - title: 「何を食べていたのか」　アワと塩と、15歳の妻の分
    lines:
      # fact: choujou-22
      - 語り: ある名簿の1行です。砦の兵、張竟。塩を3升。12月の分のアワを、11月に、自分で受け取る。
        card: {head: "張竟の受け取り", body: 塩3升と、12月の分のアワ}
      # fact: choujou-22
      - 語り: 王子今さんが、塩の受け取りの名簿を調べた論文で、この札を取り上げています。前の月のうちに、本人が、取りに来ていたのです。
      # fact: choujou-22, choujou-24
      - 語り: アワの量は、3石3斗3升あまり。これが、兵1人の、ひと月の分でした。別の札では、兵9人で、アワ30石。割ると、同じ量になります。
      # fact: choujou-24
      - 語り: では、今の量にすると、どれだけか。ここで、記録の読み方が、分かれます。
        tone: 疑問
      # fact: choujou-24, choujou-23
      - 語り: 記録の数に、そのまま漢の升を当てれば、およそ67リットル。けれど札には、大きな石と、小さな石という、2つの量り方が出てきます。
        figure: {type: bars, title: 兵1人のひと月のアワ（リットル）, bars: [[記録の数のまま, 67], [大きな石に直す, 40]], labels: [約67リットル, 約40リットル]}
      # fact: choujou-24
      - 語り: この数を、小さな石の数とみて、大きな石に直せば、2石。およそ40リットルになります。
      # fact: choujou-24
      - 語り: 山口大学の馬彪さんは、2つの石がなぜあるのかは、60年以上議論が続いて、決着していない、と書いています。
        figure: null
      # fact: choujou-23
      - 語り: 塩は、ひと月に3升。漢の1升は、およそ200ミリリットルなので、600ミリリットルです。
      # fact: choujou-23
      - 語り: 王子今さんが、今の塩で量ってみると、1日に、30グラム近く。敦煌の、粗い塩でも、24グラムほどでした。
        card: {head: "兵の塩", body: 1日に30グラム近く}
      # fact: choujou-25
      - 語り: 塞で受け取ったのは、兵だけではありません。家族の分の名簿も、残っています。
      # fact: choujou-25
      - 語り: 大人の男は、ひと月3石。大人の女は、男の7割ほど。子どもは、年と男女で、細かく決まっていました。
      # fact: choujou-25
      - 語り: ある札には、第四隧の兵、伍尊の妻、15歳、とあります。長城の任地に、15歳の妻がいたのです。
        tone: しみじみ
      # fact: choujou-25
      - 語り: 別の名簿には、62歳の母と、1歳の子まで、載っていました。
      - 語り: 食べ物は、運ばれてくるだけではありません。兵は、畑も耕しました。
      # fact: choujou-44
      - 語り: 香港中文大学の唐俊峰さんが、2014年の論文で読み解いた、田の成績表には、224日のあいだ、ならすと1日120人ほどが、田で働いた、とあります。
        card: {head: "田の成績表", body: 224日、ならすと1日120人}
      # fact: choujou-45
      - 語り: 紀元前85年には、兵と、畑の兵、合わせて1,500人が、用水路を掘る仕事に回されています。
      - 語り: 見張りと畑のあいだにも、兵には、毎日の割り当てがありました。
        hook: true
      - 語り: そして秋には、兵を率いる長たちに、点数のつく試験が、待っていました。
        hook: true

  # ================================================================ 第5章 仕事と試験
  - title: 「毎日の仕事と、秋の試験は？」　日干し煉瓦80個と、12本の矢
    lines:
      # fact: choujou-36
      - 語り: ある兵の9日間の働きを書いた、作業の札があります。于振波さんが、2005年の論文で引いた、第三十四隧の兵、富承の記録です。
      # fact: choujou-36
      - 語り: 最初の3日は、毎日、日干し煉瓦を80個つくる。残りの6日は、土を片付ける。3日で、240個です。
        card: {head: "富承の9日間", body: 日干し煉瓦を毎日80個}
      # fact: choujou-38
      - 語り: 家畜のえさにする草を刈る仕事もありました。草刈りに出た兵が、病気になり、働けなくなった、と記す札もあります。
      # fact: choujou-33
      - 語り: そして秋。弓の試験、秋射です。受けたのは、兵ではなく、のろし台の長や、それをまとめる長たち。法令に、決まりが書かれていました。
      # fact: choujou-33
      - 語り: 弩という、引き金で放つ弓で、矢を12本。当たりが6本で、合格です。
        figure: {type: calc, title: 秋の弓の試験, terms: [[12本, 放つ矢], [6本, 合格], [1本ごと, 15日]], ops: [→, →]}
      # fact: choujou-33
      - 語り: 6本を超えると、1本ごとに、労を15日、もらえます。足りなければ、1本ごとに、15日、削られます。
      # fact: choujou-35
      - 語り: 労とは、勤めた日数で数える、点数です。1年分たまると、中労。中労が4年分で、功が1つ。空いた役には、功と労の順番で、引き上げられました。
      - 語り: 12本全部を当てれば、90日分の加点。1本も当たらなければ、90日分を失います。
        tone: 重い
        figure: null
      # fact: choujou-35
      - 語り: 東北師範大学の魏永康さんが、2025年の論考で引いた記録には、中労2年8か月14日、のように、日にちまで書かれています。
      # fact: choujou-34
      - 語り: 実際の試験の記録も、残っています。紀元前37年の秋射。矢12本を放ち、当たった数に応じて、決まりのとおり、労を与えた。
        card: {head: "前37年の秋射", body: 矢12本を放つ}
      - 語り: 試験の点とは別に、着る物や履き物は、自分で手配しなければならないこともありました。
        hook: true
      - 語り: ある下級の役人は、友に、靴を頼む手紙を書いています。
        hook: true

  # ================================================================ 第6章 着る物とお金
  - title: 「着る物とお金は？」　靴を頼む手紙と、つけ売りと借金
    lines:
      # fact: choujou-32
      - 語り: 兵の服には、2つありました。国から配られる官の服と、故郷から持ってきた、自分の服です。
      # fact: choujou-32
      - 語り: 配られる服が遅れると、仲間から借りました。服を借りた覚え書きの札も、見つかっています。
      # fact: choujou-31, choujou-42
      - 語り: 敦煌の懸泉置という、駅の跡からは、絹に書いた手紙が出ました。復旦大学の郭永秉さんが、2018年に紹介した、元という下級の役人の手紙です。
      # fact: choujou-31
      - 語り: 元は、敦煌へ守りに行くことになったのに、靴がない、と書きます。今の言葉にすると、こうです。
      # fact: choujou-42, choujou-31
      - 語り: 子方さん、どうか靴を1足、買ってください。絹と革の靴で、長さは1尺2寸。厚くて、歩けるものを。
        tone: しみじみ
        card: {head: "元の手紙", body: 厚くて歩ける靴を1足}
      # fact: choujou-42
      - 語り: 頼みは、まだ続きます。よい筆を5本。それから、預かった200銭で、よく鳴る鞭を1本。
      # fact: choujou-28
      - 語り: お金の札も、たくさんあります。兵どうしは、服や持ち物を、つけで売り買いしました。
      # fact: choujou-28
      - 語り: そのつけ売りは、役所に届けられ、記録になりました。兵が服をつけで売った件を、上の役所へ知らせた文書が残っています。
      # fact: choujou-29
      - 語り: 下級の役人の給料は、ひと月600銭が、ひとつの目安でした。
      # fact: choujou-29
      - 語り: 欠けた札には、前の役人の、紀元前13年の、600銭の給料を調べた記録と並んで、商人が役所に来て、548銭を取り立てたい、と申し出たことが、書かれています。
        card: {head: "前13年", body: 商人が548銭の取り立てを申し出る}
      # fact: choujou-30
      - 語り: もっと重い借金もありました。武漢大学の姚磊さんが、2026年に、離れた2枚の札をつなげて読み解いた記録です。
      # fact: choujou-30
      - 語り: ある男は、3,600銭を借りて、質に入れていた妻を、取り戻しました。
        tone: 重い
      # fact: choujou-30
      - 語り: けれど、貧しくて、返すお金がない。貸した側が、役所に訴え出ています。
      - 語り: 借金よりも、兵を苦しめたものがあります。
        hook: true
      - 語り: 病です。そして、帰れなかった者の、帰り道です。
        hook: true

  # ================================================================ 第7章 病と死
  - title: 「病気になったら、死んだら？」　薬の処方と、故郷へ帰る小さな棺
    lines:
      # fact: choujou-37
      - 語り: 病気の兵の名簿には、病名と、かかった日が、書かれました。第三十一隧の兵、王章、4月1日、傷寒を病む。第一隧の兵、孟慶、4月5日、傷寒を病む。
        card: {head: "病気の兵の名簿", body: 4月1日と4月5日、傷寒}
      # fact: choujou-37
      - 語り: 傷寒は、昔の医学の言葉で、寒さに当たって起こると考えられた、熱の病です。居延からは、その薬の処方も見つかっています。4つの薬を合わせ、ぬるい湯で飲む。昼に3回、夜に2回。
      # fact: choujou-37
      - 語り: 華中科技大学の劉金華さんが、2005年に、辺境の札に散らばる処方を集めて、紹介しています。その中には、猛毒のトリカブトの仲間も入っていました。
      # fact: choujou-38
      - 語り: 矢の傷の処方もあります。薬を酒に入れて飲むと、刺さった矢じりが出る、と書かれています。
      # fact: choujou-41
      - 語り: 家族を亡くせば、休みがもらえました。紀元前42年の札では、候長の父が亡くなり、上の役所が、喪の休みを与えています。
      # fact: choujou-39
      - 語り: そして、塞で死んだ兵は、故郷へ送り返されました。紀元前54年の札に、病で死んだ兵を、小さな木の棺に入れて送る、とあります。
        tone: 重い
      # fact: choujou-39
      - 語り: 役所は、その棺を、いつも備えていました。ある月の帳面には、残りの棺が6つ、と数えられています。
      # fact: choujou-39
      - 語り: 棺を1つ、38銭で買った、という記録もあります。下級の役人の、ひと月の給料の、16分の1ほどです。
        card: {head: "小さな棺", body: 1つ38銭}
      # fact: choujou-40
      - 語り: 亡くなった兵の服と持ち物は、3つに割る割り符に書き、棺と一緒に送りました。
      # fact: choujou-40
      - 語り: 鄭伊凡さんは、2023年に、台湾の中央研究院の学術誌に載せた論文で、居延から故郷まで棺が届くのに、少なくとも3か月から4か月、半年かかることもあり得た、と見積もっています。
        tone: しみじみ
      # fact: choujou-43
      - 語り: 生きて、家族に手紙を書いた者もいます。宣という、辺境の役人が、家族に宛てた私信です。
      # fact: choujou-43
      - 語り: 中国社会科学院の馬怡さんが、2008年に読み解いたその手紙を、今の言葉にすると、こうです。
      # fact: choujou-43
      - 語り: 塞の上は、ひどくつらい。暑い時だから、着る物も、食べる物も、十分にしてほしい。
        tone: しみじみ
        card: {head: "宣の手紙", body: 塞の上は、ひどくつらい}
      - 語り: つらいと書いた本人が、家族には、十分に食べて、と書いていました。
        hook: true
      - 語り: その手紙を含む札の束は、2000年後、もう一度、長い旅をすることになります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：長城の兵は、どう暮らしたのか
    lines:
      # fact: choujou-47
      - 語り: 居延の札を掘り出したのは、1930年から31年の、中国とスウェーデンの調査団。スウェーデンのベリイマンです。
      # fact: choujou-48, choujou-49, choujou-50
      - 語り: 戦争のさなか、札は、香港からアメリカへ渡り、ワシントンで、鍵のかかった箱に納められました。台湾の中央研究院に届いたのは、1965年。25年あまり、箱は一度も開けられませんでした。
        tone: 重い
        card: {head: "札の旅", body: 香港からアメリカ、台湾へ}
      - 語り: 長城の兵は、どう暮らしたのか。
        tone: 疑問
      - 語り: 遠い故郷から、車を連ねて来て、1年。毎朝、砂の帯を歩き、のろしの決まりを覚え、日干し煉瓦をつくりました。長たちは、秋に、弓の試験を受けました。
      - 語り: 食べ物の量は、名簿に書かれ、服はつけで売り買いされ、借金は役所に届けられ、死ねば、小さな棺で、故郷へ送られました。
      - 語り: ここまで見てきた札の多くは、戦いではなく、名前と、数と、日付の、暮らしの記録でした。
        tone: しみじみ
      # fact: choujou-10
      - 語り: 29日のあいだ、人も馬も、越えて出入りした跡なし。何も起きなかったことを、毎日、書き残す。それが、長城を守る仕事でした。
        tone: しみじみ
      - 語り: その何も起きなかった日々の記録が、2000年後、兵1人1人の暮らしを、今に伝えています。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
