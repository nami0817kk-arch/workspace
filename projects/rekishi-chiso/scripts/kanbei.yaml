en:
  title: "Kuroda Kanbei: The 'Your Luck Is Opening' Line Is the Form Edo-Period Books Gave It"
  description: |-
    When news of the Honnoji Incident reached Hideyoshi's camp in 1582, Kuroda Kanbei is said to have remarked that his luck was about to open. That exact form of the line appears in Edo-period books such as the Rojin Zatsuwa and the Kuroda Kafu; the Kuroda Kafu itself was completed in 1688, about 84 years after his death. According to Wikipedia's summary, earlier records such as the Mori family documents say he spoke of having gained heaven's protection, and that everything would now go as he wished. The wording differs from book to book.
    This video digs into Kanbei's life from the small Himeji outpost of the Kodera retainers to his death in the 9th year of Keicho, and separates what records show from what later books and missionary accounts say: the year in the Arioka Castle prison (the "dungeon" and the leg injury come from later books), the flooding of Takamatsu Castle (no source confirms he proposed it), the Great Return from Bitchu, the 120,000-koku fief in Buzen compared with his neighbours, the Kii Valley fight in which his son Nagamasa's assault was repulsed and the banquet killing of Kii Shigefusa (how far Kanbei was involved is disputed), his tonsure, the separate war he fought in Kyushu during Sekigahara and the letter to Kikkawa Hiroie that is read in different ways, and his very detailed will.
    We say plainly where sources disagree. Dates are in the Japanese calendar of the time.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1582: A Famous Line and Three Layers of Sources"
    - "1546: Born at a Small Outpost, Choosing Oda over Mori"
    - "1578: About a Year in Arioka Castle"
    - "1582: The Flooding of Takamatsu and the Night of the Honnoji News"
    - "1587: The Kyushu Campaign and a 120,000-koku Reward"
    - "1587: The Kii Valley Fight, Nagamasa's Defeat and a Killing at a Banquet"
    - "1593: Korea, Tonsure and the Name Josuiken Ensei"
    - "1600: Sekigahara and a Separate War in Kyushu"
    - "1604: Death and a Very Detailed Will"
    - "Summary: Who Was Kuroda Kanbei?"

