# 黒田官兵衛（A作品・10/17 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：黒田官兵衛とは何者だったのか」）
# 冒頭の一点：名セリフ「ご運が開く」の形が出てくるのは江戸の書物（老人雑話・明良洪範・黒田家譜）。84年あとと確かめたのは黒田家譜（1688）だけ。
#   Wikipedia「中国大返し」の整理では、毛利家文書・當代記など早い時期の記録は「天の加護を得た、これで何事も思いのままになった」という趣旨。
#   野心か加護かの温度差とは言わない。同じ場面でも本によって言葉の形が違う、と言う（写された・書き継がれたとは断定しない）（答えは第4節、まとめで冒頭の問いに戻る）。
# 事実の出どころは dev/output/rekishi-chiso/research/kanbei_facts.md（確実／有力／説／後世の話／未確認の区分もそこ）。素材は research/kanbei_assets.md。
# 決まり：①日付は和暦で言う。西暦は『黒田家譜』の1688年と、年表・card の年だけ（「西暦だと」とは言わない）。誕生日は割れる（11月15日／29日）ので生まれは「天文15年の冬」。
#   ②使わない話（入れない）：城井鎮房の謀殺の細部（鶴姫の磔・13人の侍女・血の壁・祟り・朝房の暗殺）／有岡城の荒木一族の処刑／松寿丸の偽首／
#     牢番・輿に乗る話／「左手は何をしていた」／「草履片々、木履片々」／司馬遼太郎・大河の場面／「よく見ておけ」／遺体の埋葬の細部（夜の松林）／ネットの個人ブログ。
#   ③「ご運が開く」の形・「100万石で天下を奪う」・「土牢・頭の瘡」・「足の障害」・「官兵衛の献策」は後世の話（出典名を言う）。『名将言行録』は幕末〜明治の成立（江戸の書とは言わない）。
#     宣教師の「キリシタンゆえ減らされた」は「宣教師はこう書いた」と断る。毛利家文書・當代記は本文未読でWikipedia経由なので「ウィキペディアの整理では」と断る。
#   ④数字は何の数かを言い、割れていれば割れていると言う（約12万石と12万5千石は混ぜない。有岡城は約1年）。兵数・9,000人・1万・水攻めの規模は二次の数字。長政の17万石は検地のあとの数字。
#   ⑤人物のセリフは入れない。吉川広家宛書状は「趣旨」としか言えない。⑥年齢は数え。肖像の「この時○歳」は出さない（誕生日が割れるため）。
#   ⑦背景に人物の肖像・拡大絵を使わない。NDL 系（古城絵図）は detail の box で枠内だけ。血・遺体・首・切腹の絵は使わない。
#   ⑧城井谷で退けられたのは長政の力攻め。官兵衛は付け城の持久戦に切り替えて降伏させた（「官兵衛が負けた」とは言わない）。
#   読みの注意：官兵衛＝かんべえ／孝高＝よしたか／如水＝じょすい／城井＝きい（鎮房＝しげふさ）／鶴姫＝つるひめ／晋州城＝しんしゅうじょう／石垣原＝いしがきばる／
#     黒田家譜＝くろだかふ／老人雑話＝ろうじんざつわ／明良洪範＝めいりょうこうはん／兼見卿記は出さない／名護屋＝なごや／杵築＝きつき／臼杵＝うすき／水俣＝みなまた／
#     金蔵＝かねぐら／辞世の句は台本の中でかなに開いてある。
title: 黒田官兵衛｜「ご運が開く」の名セリフは、江戸の書の形だった
