  タエス: 遺言に出る、お金の単位。2,000タエスは約320石

shorts:
  s1:
    title: "官兵衛の囁き／いつの本？"
    yt_title: "黒田官兵衛の「ご運が開く」は本当に言った？｜名セリフは江戸の書の形"
    hook: "『ご運が開く』は、／官兵衛が言った／そのままの形？"
    tease: "じゃあ、早い時期の記録は、／同じ場面の官兵衛の言葉を何と書いている？"
    lead: "天正10年6月。本能寺の変の知らせを聞いた秀吉に、黒田官兵衛が、ご運が開く、という趣旨の言葉を囁いた。そう語られてきました。"
    tags: [黒田官兵衛, 本能寺の変, 老人雑話, 歴史の地層]
  s2:
    title: "有岡城の土牢／どの本の話？"
    yt_title: "黒田官兵衛の有岡城の土牢は本当にあった？｜黒田家譜の話と秀吉の手紙"
    hook: "官兵衛が閉じ込められた／有岡城の土牢は、／本当にあった？"
    tease: "じゃあ、閉じ込められた官兵衛を／助け出したのは、誰？"
    lead: "天正6年、織田方だった荒木村重が、突然、謀反を起こします。村重の城は、摂津の有岡城。官兵衛は、村重を説得するため、その城へ入ります。"
    tags: [有岡城, 黒田官兵衛, 荒木村重, 歴史の地層]
  s3:
    title: "九州平定の褒美／12万石"
    yt_title: "黒田官兵衛は九州で冷遇された？｜豊前12万石を周りの石高と比べる"
    hook: "官兵衛の褒美は12万石。／冷遇されたって、／本当？"
    tease: "じゃあ、その12万石の豊前で、／官兵衛が最初に苦戦した相手は？"
    lead: "天正15年の夏、九州の国分け。官兵衛に与えられたのは、豊前6郡です。いまの福岡県東部から、大分県北部にあたります。"
    tags: [黒田官兵衛, 九州平定, 豊前, 歴史の地層]
  s4:
    title: "豊前の城井谷／長政の敗北"
    yt_title: "黒田軍は城井谷で負けた？｜豊前の領主・城井鎮房と長政の力攻め"
    hook: "豊前の城井谷で、／黒田軍の力攻めが／退けられた？"
    tease: "じゃあ、官兵衛はそのあと、／どんな作戦に切り替えた？"
    lead: "豊前には、地元の領主、城井鎮房がいました。秀吉は鎮房に国替えを命じますが、鎮房は拒み、天正15年、山あいの城井谷城に立てこもります。"
    tags: [城井谷, 城井鎮房, 黒田官兵衛, 歴史の地層]
  s5:
    title: "関ヶ原の2日前／九州の戦い"
    yt_title: "黒田官兵衛は関ヶ原の裏で九州の別の戦いをしていた？｜石垣原の戦い"
    hook: "関ヶ原の2日前、／九州でも戦があった？"
    tease: "じゃあ、官兵衛の九州の戦いを／終わらせたのは、何だった？"
    lead: "慶長5年7月、石田三成らが挙兵します。官兵衛の息子、長政は、東軍の家康方について、関ヶ原へ向かいます。官兵衛は、豊前の中津に残りました。"
    tags: [石垣原の戦い, 関ヶ原の戦い, 黒田官兵衛, 歴史の地層]

