        short: s5
        tone: 疑問
      - 語り: 町の人たちは驚いたでしょう。でも、幕府にとっては、まったくの不意打ちではありませんでした。
        short: s5
      - 聞き: 知ってたけど、準備が間に合わなかった、ってことか。
        short: s5
        tone: しみじみ
      - 語り: その黒船が来る前から、別の国の船が、日本の扉をたたいていました。
