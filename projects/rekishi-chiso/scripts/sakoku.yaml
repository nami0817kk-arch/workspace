  # ---------------------------------------------------------------- 9
  - title: 見立て：「鎖国」という言葉は、いつ生まれたか
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1801
    lines:
      - 語り: 「鎖国」が今の意味で定着するまでには、大きく3つの段階があったと、僕は見ています。
      - 聞き: 3つ？ 聞かせて。
        tone: 疑問
      - 語り: 一つ目は、外国人の本です。さっきのケンペルが日本を去ったあと、その遺した原稿が、1727年に『日本誌』という本になりました。
        card: {head: "段階1", body: "ケンペル『日本誌』の翻訳から"}
        year: 1727
      - 語り: その付録に、日本が国の出入りを閉ざしているのは正しい、とほめる論文がありました。
      - 聞き: 外国の人が、閉じてるのは正しいって、ほめてたんだ。
        tone: 驚き
      - 語り: 1801年、長崎のオランダ語の通訳、《志筑忠雄》が、この論文を訳しました。元の題がとても長かったので、志筑は短く『鎖国論』と名づけます。
        short: s1
        card: {head: "1801年", body: "志筑忠雄が『鎖国論』と訳す"}
        year: 1801
      - 語り: 「鎖国」という言葉は、ここで初めて生まれた、とされます。のちに「鎖国令」とまとめられる命令から、160年ほどあとのことです。
        short: s1
        figure: {type: bars, title: 命令から何年後に言葉が出たか, bars: [[「鎖国」の言葉（1801年）, 162], [幕府の文書に出る（1853年ごろ）, 214]], labels: ["約160年後", "約210年後"], note: 1639年のポルトガル船の禁止から数えた}
      - 聞き: 160年後の翻訳で生まれた言葉が、江戸時代全体の名前になっちゃったんだ。
        short: s1
        tone: しみじみ
      - 語り: この訳は、本として出されず、書き写されて、学者たちのあいだで読まれました。
        figure: null
      - 語り: 本として出たのは、1850年。それも『異人恐怖伝』、外国人が怖い話、というような題が付けられていました。
      - 聞き: 題名が全然ちがうものになってる……。
        tone: 笑い
      - 語り: 二つ目は、幕府が外国を断る理由として使い始めたことです。さっきのロシアへの返事のように、「先祖からの決まり」という考えが先にでき、1853年ごろからは、幕府の文書にも「鎖国」の言葉が出てくるようになります。
        card: {head: "段階2", body: "幕府が断る理由に使う"}
        year: 1853
      - 聞き: 言葉ができてから、あとで中身の理由づけに使われたんだ。
        tone: 納得
      - 語り: 三つ目は、明治のあとです。「開国」して近代化した、という話の反対側に、「鎖国」が置かれました。
        card: {head: "段階3", body: "「開国」と対になって広まる"}
      - 語り: 閉じていた時代と、開いた明治。その対が分かりやすかったので、教科書でも長く使われてきたんです。
      - 聞き: 開国のすごさを言うために、鎖国が暗く描かれたってこと？
        tone: 疑問
      - 語り: そういう面もあったと思います。そして2017年、国の学習指導要領の案で、「鎖国」を「幕府の対外政策」と言い換える案が出されました。
        short: s7
        card: {head: "2017年", body: "「鎖国」を言い換える案"}
      - 聞き: え、教科書から消えるところだったの？
        short: s7
        tone: 驚き
      - 語り: 意見を募ると、1万1000件を超える声が集まりました。「開国」があるのに「鎖国」がないと教えにくい、という声が多かったそうです。
        short: s7
      - 語り: 結局、最後は「鎖国などの幕府の対外政策」という形に戻りました。
        short: s7
      - 聞き: 開国と対になってるから、鎖国も残ったんだ。言葉って、ペアで生き残るんだね。
        short: s7
        tone: 納得
      - 語り: そうなんです。今の教科書では、「鎖国」にかぎかっこを付けたり、「いわゆる鎖国」と書いたりして、その中身を説明するようになっています。
      - 語り: ある教科書会社は、かぎかっこを付ける理由を3つ挙げています。当時は使われていない言葉だったこと。幕府は4つの窓口で、外とのやりとりを管理していたこと。そして、幕府がこの言葉を使い始めたのは、19世紀に外国を断るためだったこと。
      - 聞き: 今日掘ったこと、全部そこに入ってる。
        tone: 納得
      - 聞き: じゃあ、本当の江戸の日本は？
        tone: 疑問
      - 語り: 記録から言えるのは、ここまでです。キリスト教の国と、日本人の海外渡航は閉め出した。でも、4つの窓口で、オランダ、中国、朝鮮、琉球、アイヌとつながっていた。
      - 語り: 長崎には中国の船が押し寄せ、江戸には朝鮮の大行列が来て、毎年、海外のニュースが届いていた。閉ざした国ではなく、扉を選んで、開け閉めを管理した国です。
        tone: しみじみ
      - 聞き: 鎖国っていうより、門番がきびしい家、って感じかな。
        tone: 納得
      - 語り: つむぎさんのたとえ、分かりやすいです。そして、その「鎖」という強い言葉は、中にいた人ではなく、外から見た人の本から生まれた。そこが、一番面白いところだと思います。
        tone: しみじみ
      - 聞き: 外から見た言葉が、中の歴史の名前になっちゃった。今日も、だいぶ深く掘れた。
        tone: 納得
      - 語り: 今日の地層は、ここまでです。
        tone: 明るい
      - 聞き: 次回は、フランスの英雄、ナポレオン。「背の低い独裁者」って言われてるけど……本当？
        tone: 疑問
      - 語り: 知っている通説があれば、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい

