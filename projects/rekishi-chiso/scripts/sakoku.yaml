# 型の比べ方 #4 時代の常識 江戸の鎖国（10/10 公開）
# 事実の出どころは dev/output/rekishi-chiso/research/sakoku_facts.md と、末尾の「事実の控え」。確認の記録は dev/output/rekishi-chiso/review/sakoku/
