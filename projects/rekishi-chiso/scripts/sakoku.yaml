# 事実の控え（2026-10-06。詳細は dev/output/rekishi-chiso/research/sakoku_facts.md）
# - 「鎖国」：1801 志筑忠雄がケンペル『日本誌』（1727英語版、蘭語第2版1733）付録第6章を訳し『鎖国論』。写本で流布、1850『異人恐怖伝』刊。幕府文書は1853ごろ〜（W経由）
# - いわゆる鎖国令：1633（奉書船以外の渡航禁止・5年以上在住者の帰国禁止）、1635（渡航・帰国全面禁止、中蘭船は長崎に限る）、1636（ポルトガル人の子孫ら追放、出島へ）、1639（ポルトガル船来航禁止）、1641（オランダ商館を出島へ）
# - 出島 3969坪（約1.5ha、東京ドーム約4.7haの約1/3）。オランダ人は18世紀に20人あまり。オランダ船 1621〜1847 延べ700隻以上、年2隻→1790から年1隻
# - 唐船 1684 清の展海令の後に急増、1688 193隻（194とも）延べ9128人（二次資料）→「190隻を超え」「9000人あまり」。長崎の人口約5万
# - 唐人屋敷 1689 約9400坪（出島の約3倍）。1685 定高貿易法、1715 正徳新例（唐船30隻・蘭船2隻）
# - 輸出 銀→銅・俵物、世界の銀の約1/3（幅あり）。輸入 生糸・絹織物・砂糖・薬種・書籍
# - 四つの口：荒野泰典1980ごろの用語。倭館（草梁倭館1678）約10万坪・400〜500人。朝鮮人参。琉球 1609 薩摩侵攻、中国へ進貢継続。松前 商場知行制、鮭・昆布・毛皮、山丹交易（蝦夷錦）
# - 朝鮮通信使 1607〜1811 12回（最後は対馬）、一行400〜500、警護含め約1500。初期は日光へ。2017 世界の記憶。琉球 江戸上り 1634〜1850 18回。江戸参府 1850までに166回（1790から4年に1度）
# - ケンペル 1690〜92 出島、1691・92 江戸参府で綱吉に謁見。トビ：使節迎えは将軍の権威づくり
# - 風説書 1641〜、別段風説書 1840〜（アヘン戦争を機に）、1852 ペリー予告。1720 吉宗 洋書緩和、1774 解体新書
# - ラクスマン1792 根室、レザノフ1804 長崎、1805 祖法として拒否（藤田覚：鎖国祖法観はこのころ）。1825 異国船打払令、1842 薪水給与令
# - 1853-07-08 ペリー浦賀（4隻）、1854-03-31 和親条約（下田・箱館、通商なし）、1858 修好通商条約、1859 貿易開始
# - 海禁：明1371、清1655海禁・1661遷界令・1683〜84解除、朝鮮も。荒野泰典：海禁と華夷秩序
# - 2017-02-14 指導要領案「幕府の対外政策」、パブコメ11210件、3-31告示「鎖国などの幕府の対外政策」。帝国書院はかぎかっこを付ける
