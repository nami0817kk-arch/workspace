terms:
  出島: 長崎の港に造られた扇形の人工の島。オランダ商館が置かれた
  唐人屋敷: 長崎で中国の人を住まわせた区画。1689年から。出島の2倍あまり
  四つの口: 長崎・対馬・薩摩・松前の4つの窓口。1980年ごろの研究の言葉
  倭館: 朝鮮の釜山にあった、対馬の人が住む日本人の町
  朝鮮通信使: 朝鮮の国王が江戸の将軍に送った使節
  風説書: オランダ船などが幕府に出した、海外の出来事の報告書
  海禁: 国が民間の海外渡航や海上の貿易を禁じ、管理する政策
  志筑忠雄: 長崎の蘭学者。もとオランダ語の通訳。1801年に「鎖国」という言葉を作った

sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：日本は国を閉ざしていた
    background: {image: paintings/sakoku_nagasaki_bay_keiga_1820.jpg, credit: "川原慶賀《長崎港図》1820年ごろ"}
    portrait: null
    year: 1639
    lines:
      - 語り: 江戸幕府は、国を閉ざしました。外国との行き来を断ち、日本は200年以上、世界から取り残された。そう言われてきました。
        tone: 重い
      - 聞き: 鎖国でしょ！ だからペリーが来て、びっくりしたんだよね。
        tone: 明るい
      - 語り: そう習った人が多いと思います。それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: え、鎖国も掘れるの？ 人じゃないのに。
        tone: 疑問
      - 語り: 掘れます。
      - 語り: まず、「鎖国」という言葉。実は、江戸幕府が始めたころには、なかった言葉なんです。
        short: s1
        card: {head: "「鎖国」という言葉", body: "幕府が始めたころには、なかった"}
      - 聞き: うそでしょ！？ じゃあ、なんて呼んでたの？
        short: s1
        tone: 驚き
      - 語り: 特に名前はありませんでした。この言葉は、ずっとあとになって、しかも幕府の外から生まれたんです。
        short: s1
      - 聞き: 幕府が作った言葉じゃないんだ……。じゃあ、誰が？
        short: s1
        tone: 疑問
      - 語り: それは、最後に掘り当てましょう。もう一つ。閉ざしていたはずの長崎に、1年で190隻を超える中国の船が来た年がありました。
      - 聞き: 190隻！？ それ、閉ざしてなくない？
        tone: 驚き
      - 語り: それを、これから確かめていきます。まずは、のちに「鎖国令」と呼ばれる命令からです。
      - 聞き: 了解。あーし、今日はヘルメットに双眼鏡もつけとく。
        tone: 笑い

  # ---------------------------------------------------------------- 2
  - title: 「鎖国令」はなかった
    background: {image: paintings/sakoku_edo_nihonbashi_hiroshige.jpg, credit: "歌川広重《東海道五十三次 日本橋 朝之景》1833〜34年ごろ"}
    portrait: null
    year: 1633
    lines:
      - 語り: 教科書では、「鎖国令」という言葉を習ったかもしれません。でも、「鎖国令」という名前の法令は、出ていません。
        short: s2
      - 聞き: え、テストに出たのに？
        short: s2
        tone: 疑問
      - 語り: 1633年から1639年にかけて、幕府はいくつもの命令を出しました。それを、のちの人が「鎖国令」とまとめて呼んでいるんです。
        short: s2
        card: {head: "1633〜1639年", body: "のちに「鎖国令」とまとめられる命令"}
      - 語り: 1633年には、幕府の許しを得た船以外が海外へ行くのを禁じ、海外に長く住んだ日本人の帰国を禁じました。
        short: s2
      - 語り: 1635年には、日本人が海外へ行くことも、帰ってくることも、すべて禁じます。中国の船が入れる港も、長崎だけにしました。
        short: s2
        card: {head: "1635年", body: "日本人の海外渡航と帰国を禁止"}
      - 聞き: 出るのも帰るのもダメ……。海外にいた人は、帰れなくなっちゃったんだ。
        short: s2
        tone: しみじみ
      - 語り: 1636年には、ポルトガル人と、その妻や子ども、日本人とのあいだに生まれた子など、287人を、中国のマカオへ送り出しています。
        card: {head: "1636年", body: "ポルトガル人と妻子ら287人をマカオへ"}
        year: 1636
      - 聞き: 家族ごと……。日本で生まれた子もいたんだよね。
        tone: しみじみ
      - 語り: その少しあと、九州で島原・天草の一揆が起こります。キリスト教の信者も多く加わった、大きな一揆でした。
        card: {head: "1637〜38年", body: "島原・天草の一揆"}
        year: 1637
      - 語り: そして1639年、幕府は、ポルトガルの船が来ることを禁じました。
        short: s2
        card: {head: "1639年", body: "ポルトガル船の来航を禁止"}
        year: 1639
      - 聞き: ポルトガルだけ？ ほかの国は？
        tone: 疑問
      - 語り: 閉め出したのは、キリスト教を広めようとするポルトガルやスペインと、日本人の海外渡航です。
      - 語り: オランダは、キリスト教を広めない約束で、取り引きを続けました。はじめは長崎ではなく、平戸に商館がありました。
      - 聞き: 閉め出したのは、キリスト教の国だけってこと？ あーしなら、もう少しゆるくするけど。
        tone: 納得
      - 語り: ほぼ、そうです。そして1641年、幕府は、そのオランダの商館を、長崎のある小さな島に移させます。その島には、少し前まで、別の国の人たちが住んでいました。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 長崎の出島と唐人屋敷
    background: {image: paintings/sakoku_dejima_plan_titsingh.jpg, credit: "《出嶋阿蘭陀屋舗景》（ティツィング旧蔵の出島図）"}
    portrait: null
    year: 1641
    lines:
      - 語り: 長崎の港に造られた、扇の形をした小さな人工の島。《出島》です。
        short: s6
      - 語り: 1634年から2年ほどかけて築かれました。お金を出したのは、長崎の町人25人です。門や橋、塀は幕府が造りました。
      - 聞き: 出島って、オランダの人のための島でしょ？
        tone: 疑問
      - 語り: ところが、最初に住まわされたのは、ポルトガル人でした。1639年に来航が禁じられて、ポルトガル人は去り、空いた島に、1641年、平戸からオランダの商館が移ってきたんです。
        card: {head: "1641年", body: "オランダ商館が出島へ"}
      - 聞き: 元はポルトガルの人の島だったんだ。知らなかった。
        tone: 納得
      - 語り: 広さは、およそ1.5ヘクタール。東京ドームの3分の1ほど、サッカー場なら2面分くらいです。
        short: s6
        card: {head: "出島", body: "約1.5ヘクタール（東京ドームの約3分の1）"}
      - 聞き: 思ったより小さい！ そこにオランダの人たちが住んでたの？
        short: s6
        tone: 驚き
      - 語り: はい。商館長をはじめ、十数人から20人ほどが住んでいたとされます。船は、今のインドネシアのジャカルタから、季節風に乗ってやって来ました。
        short: s6
      - 語り: はじめは年に何隻も来ていましたが、1715年からは年2隻まで、1790年からは年1隻になります。それでも227年のあいだに、延べ700隻以上の船が来ています。
        card: {head: "オランダ船", body: "227年で延べ700隻以上"}
      - 聞き: 1隻になっても、毎年ちゃんと来てたんだ。
        tone: 納得
      - 語り: 長崎にいちばん多く来ていた外国の船は、中国の船でした。
        background: {image: paintings/sakoku_nagasaki_ships_hiroshige2.jpg, credit: "二代歌川広重《諸国名所百景 肥前長崎唐船の津》1859年"}
        short: s3
      - 語り: 長崎に限られた直後は、年に50隻ほど。そのあと中国で明から清へ国が替わる混乱があり、20隻ほどに減ります。
        short: s3
      - 語り: そして1684年、清が海に出ることをすべて許すと、中国の船は一気に増えました。1688年には、1年で190隻を超え、延べ9000人あまりが長崎に来たとされます。
        short: s3
        card: {head: "1688年", body: "中国船が190隻を超える"}
        year: 1688
        figure: {type: bars, title: 長崎に来た中国の船（1年あたり）, bars: [[長崎に限った直後, 50], [明から清への混乱のころ, 20], [1688年, 193]], labels: ["約50隻", "約20隻", "190隻あまり"], note: 数は資料によって少しちがう}
      - 聞き: ほぼ2日に1隻……。長崎、めちゃくちゃにぎやかじゃん。
        short: s3
        tone: 明るい
      - 語り: 当時の長崎の人口は、およそ5万人です。そこに1年で9000人あまりですから、町の大きさから見ても、かなりの数です。
        short: s3
        figure: null
      - 語り: 1689年には、中国の人を住まわせる《唐人屋敷》が造られました。広さは、出島の2倍あまりあります。
        background: {image: paintings/sakoku_tojin_yashiki.jpg, credit: "《唐人屋舗景》（江戸時代）"}
        short: s6
        card: {head: "1689年", body: "唐人屋敷（出島の2倍あまり）"}
      - 聞き: 出島より、中国の人の町のほうが、ずっと大きかったんだ。
        short: s6
        tone: 納得
      - 語り: 中国の船は、何を積んできたのか。1698年、五島に流れ着いた中国の船の記録が残っています。
      - 聞き: 何だろう。お茶とか、陶器とか？
        tone: 疑問
      - 語り: 生糸、反物、鹿の皮、薬の原料、漆、砂糖、墨、絵、骨董、そして書物です。
      - 聞き: 鹿の皮に、骨董に、本まで！ 船ごと、お店みたいじゃん。
        tone: 笑い
      - 語り: 日本から出ていったのは、はじめは銀、のちに銅です。16世紀の終わりから17世紀の初めには、世界の銀の3分の1ほどを日本がつくっていた、とも言われます。
      - 語り: 銅は、中国でお金をつくる材料として、とても大事にされ、日本の銅は大きな頼りだったとされます。
      - 語り: 銅の次に大事だったのが、俵物と呼ばれる海の幸です。干したアワビや、フカヒレ、干したナマコ。どれも、中国料理の高級な材料でした。
      - 聞き: フカヒレ！ 江戸の日本から、中国の高級料理の材料が出ていってたんだ。
        tone: 明るい
      - 語り: 幕府は、取り引きの量にも上限をかけていきます。まず1685年、1年に取り引きしてよい額を、中国は銀6000貫目、オランダは銀3000貫目までと決めました。
      - 語り: さらに1715年には、中国の船は年30隻まで、と決め、あらかじめ許可証を渡した船だけが入れるようにしました。
        card: {head: "1715年", body: "中国船は年30隻、許可証を持つ船だけ"}
        year: 1715
      - 聞き: 予約の整理券みたい。閉ざすっていうより、蛇口をしめたりゆるめたり、調節してる感じだね。
        tone: 納得
      - 語り: ちなみに出島は、明治の工事で埋め立てられ、1904年に島の形が消えました。長崎市は1951年から復元に取り組み、2016年までに16の建物がよみがえっています。
        background: {image: paintings/sakoku_dejima_photo_beato_1864.jpg, credit: "フェリーチェ・ベアト撮影《出島》1863〜65年ごろ"}
      - 語り: いずれは、周りを水で囲んだ扇の形に戻すことも、目指されています。
      - 聞き: 今も、掘り起こして戻してる途中なんだ。地層を掘るのとちょっと似てる。
        tone: しみじみ
      - 語り: 長崎の北、朝鮮の目の前に浮かぶ島にも、日本の窓口がありました。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 対馬・薩摩・松前
    background: {image: paintings/sakoku_nagasaki_harbour_keiga_1833.jpg, credit: "川原慶賀《長崎港図》1833年ごろ"}
    portrait: null
    year: 1700
    lines:
      - 語り: 江戸時代の日本には、外の世界へ開いた窓口が、4つありました。研究者は《四つの口》と呼んでいます。
        figure: {type: map, title: 四つの口, bounds: [125.0, 146.0, 24.0, 44.0], places: [[長崎, 129.87, 32.75], [対馬, 129.30, 34.40], [薩摩, 130.55, 31.60], [松前, 140.10, 41.43], [江戸, 139.77, 35.68], [釜山, 129.04, 35.10], [那覇, 127.68, 26.21]], note: 長崎・対馬・薩摩・松前}
      - 聞き: 長崎のほかに、まだ3つも？
        tone: 疑問
      - 語り: 長崎がオランダと中国。対馬が朝鮮。薩摩が琉球。そして松前が、北のアイヌの人々との窓口です。
        card: {head: "四つの口", body: "長崎・対馬・薩摩・松前"}
      - 語り: ただ、「四つの口」は、1980年ごろに研究者が使い始めた言葉です。当時の人がそう呼んでいたわけではありません。
      - 聞き: そこも、あとからの言葉なんだ。
        tone: 納得
      - 語り: 幕府は相手を、2つに分けて考えていました。朝鮮と琉球は、国と国の使節をやりとりする「通信の国」。オランダと中国は、取り引きだけをする「通商の国」です。
      - 聞き: 仲良くする国と、商売だけの国、みたいな？
        tone: 疑問
      - 語り: おおまかには、そういう分け方です。
      - 語り: 対馬の宗氏は、朝鮮の釜山に、《倭館》という日本人の町を持っていました。広さは10万坪ほど。出島の25倍くらいあります。
        card: {head: "釜山の倭館", body: "約10万坪。400〜500人の日本人"}
        figure: {type: bars, title: 外国の人と会う町の広さ（坪）, bars: [[長崎の出島, 3969], [長崎の唐人屋敷, 9400], [釜山の倭館, 100000]], labels: ["約4000坪", "約9400坪", "約10万坪"]}
      - 聞き: 出島の25倍！？ 日本の外に、日本人の町があったの？
        tone: 驚き
      - 語り: はい。対馬の人が、400人から500人ほど住んでいたとされます。朝鮮からは朝鮮人参などが入り、朝鮮を通って、中国の生糸や絹も入ってきました。
        figure: null
      - 語り: 薩摩と琉球の関係は、少し複雑です。1609年、薩摩藩が琉球に攻め入り、琉球の貿易を見張るようになりました。奄美の島々は、この侵攻のあと、薩摩の領地になっています。
        background: {image: paintings/sakoku_ryukyu_mission_17c.jpg, credit: "琉球使節の江戸上りの絵巻（部分）"}
        card: {head: "1609年", body: "薩摩藩が琉球に攻め入る"}
      - 語り: でも琉球は、そのあとも中国への使いを続けます。薩摩は琉球を通して、中国の生糸や薬の原料を手に入れ、琉球からは黒砂糖も運ばれました。
      - 聞き: 琉球は、中国とも日本ともつながってたんだ。あーし、そこ全然知らなかった。
        tone: 納得
      - 語り: 北の松前藩は、米がほとんどとれない土地でした。そこで家臣に、土地の代わりに、アイヌの人々と取り引きする権利を与えていました。
        background: {image: paintings/sakoku_matsumae_byobu.jpg, credit: "小玉貞良《松前屏風》1754〜64年ごろ"}
      - 語り: 18世紀の前半からは、その取り引きを商人に任せるようになります。
      - 語り: アイヌの人々からは、鮭や昆布、毛皮などが届きました。ニシンは、しぼって畑の肥料にもなりました。
      - 聞き: 畑の肥料が、北の海から来てたんだ。
        tone: 疑問
      - 語り: さらにその先の樺太や大陸を通って、中国の絹織物まで入ってきたんです。北から来た絹の着物は、「蝦夷錦」と呼ばれて珍しがられました。
      - 聞き: 北から中国の絹！？ 4つの窓口で、ぐるっとつながってる。
        tone: 驚き
      - 語り: そして、窓口を通ってきたのは、物だけではありませんでした。1500人を超える行列が、江戸まで歩いてきたこともあるんです。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 江戸へ来た使節の行列
    background: {image: paintings/sakoku_korean_embassy_hanegawa.jpg, credit: "羽川藤永《朝鮮通信使来朝図》1748年ごろ"}
    portrait: null
    year: 1711
    lines:
      - 語り: 朝鮮の国王は、江戸の将軍に、使節を送っていました。《朝鮮通信使》です。
        short: s4
      - 語り: 1607年から1811年までに、12回。最初の3回には、豊臣秀吉の朝鮮出兵のときに日本へ連れて来られた人々を、連れ帰る目的もありました。
        short: s4
        card: {head: "朝鮮通信使", body: "1607〜1811年に12回"}
      - 聞き: 戦の後始末から始まった付き合いなんだ……。
        short: s4
        tone: しみじみ
      - 語り: 一行は400人から500人ほど。画家や医者、通訳、楽士もいました。そこに対馬藩の案内や警護が加わって、千数百人から2000人ほどの大行列になったとされます。
        short: s4
      - 聞き: 2000人の行列が、江戸まで歩いてきたの？
        short: s4
        tone: 驚き
      - 語り: 2回目は京都の伏見で、最後の1回は対馬で迎えたので、江戸まで来たのは10回です。通る町々には、見物の人が集まったと伝えられています。
        short: s4
      - 聞き: 鎖国中に、外国の大行列が江戸を歩いてたなんて……。あーし、完全に見に行ってる。
        short: s4
        tone: 笑い
      - 語り: その記録は、2017年、日本と韓国の両方の資料をあわせて、ユネスコの「世界の記憶」に登録されています。
        card: {head: "2017年", body: "朝鮮通信使の記録が世界の記憶に"}
      - 語り: 琉球からも、使節が来ていました。1634年から1850年までに、18回。中国風の装いで江戸を目指した、とされます。最初の1回は、京都で将軍に会っています。
        background: {image: paintings/sakoku_ryukyu_mission_17c.jpg, credit: "琉球使節の江戸上りの絵巻（部分）"}
        card: {head: "琉球の使節", body: "18回（1634〜1850年）"}
      - 語り: そしてオランダの商館長も、江戸へ上って将軍にあいさつしています。1850年までに、166回です。
        background: {image: paintings/sakoku_nagasakiya_hokusai.jpg, credit: "葛飾北斎『画本東都遊』江戸の長崎屋"}
        card: {head: "オランダ商館長", body: "江戸参府166回"}
        figure: {type: bars, title: 使節が将軍に会いに来た回数, bars: [[朝鮮通信使（江戸まで）, 10], [琉球の使節, 18], [オランダ商館長, 166]], labels: ["10回", "18回", "166回"], note: 朝鮮の2回目は伏見、琉球の最初の1回は京都}
      - 聞き: 166回！？ ほぼ毎年じゃん。
        tone: 疑問
      - 語り: はじめは毎年、のちには4年に1度でした。
        figure: null
      - 語り: 元禄のころには、ドイツ人の医者ケンペルも、この旅について行き、将軍の綱吉に会っています。この人のことは、覚えておいてください。
      - 聞き: 覚えとく。ケンペルさんね。
        tone: 納得
      - 語り: アメリカの研究者、ロナルド・トビさんは、こうした外国の使節を迎えることが、将軍の力を国の内に見せる場にもなっていた、と考えています。
      - 聞き: 外国の人が会いに来るほどの将軍、ってアピールにもなるんだ。
        tone: 納得
      - 語り: 1641年から200年以上、オランダの船は、長崎に着くたびに、ある書類を幕府に出していました。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 届いていた世界のニュース
    background: {image: paintings/sakoku_dutch_ship_arrival_keiga.jpg, credit: "川原慶賀《オランダ船の入港を見る人々》19世紀前半"}
    portrait: null
    year: 1641
    lines:
      - 語り: その書類が、海外の出来事をまとめた報告書。《風説書》です。
        card: {head: "1641年〜", body: "オランダ風説書が毎年届く"}
      - 聞き: 海外ニュースの報告書？ そんなのがあったんだ。
        tone: 疑問
      - 語り: オランダの商館長が話したことを、長崎の通訳が日本語に訳して書きました。ヨーロッパやインド、中国のようすまで書かれていたんです。
      - 語り: 1720年には、8代将軍の吉宗が、西洋の学問を中国語に訳した本のうち、キリスト教にかかわらないものの輸入を許しました。
        card: {head: "1720年", body: "吉宗が漢訳洋書の輸入を緩める"}
        year: 1720
      - 聞き: 中国語に訳した本なら、オランダ語が読めなくてもいいもんね。
        tone: 納得
      - 語り: はい。それでも吉宗は、学者の青木昆陽や野呂元丈に、オランダ語を学ばせています。
      - 語り: そして1774年。杉田玄白たちが、オランダ語の解剖の本を訳して、『解体新書』を出しました。
        background: {image: paintings/sakoku_kaitai_shinsho_preface_page.jpg, credit: "『解体新書』序（1774年）"}
        card: {head: "1774年", body: "『解体新書』"}
        year: 1774
      - 聞き: 歴史の授業で聞いたやつ！ 鎖国中に、西洋の医学を学んでたんだ。
        tone: 明るい
      - 語り: 1823年には、ドイツ人の医者シーボルトが出島に来て、翌年、長崎の郊外に塾を開きました。日本中から、学びたい人が集まります。
        card: {head: "1823年", body: "シーボルトが出島に来る"}
        year: 1823
      - 聞き: 外国の先生に習いに、長崎まで行ってたんだ。
        tone: 納得
      - 語り: 風説書は、のちには世界全体の出来事を伝えるようになります。幕府は、江戸にいながら、ヨーロッパの戦争や新しい国の動きを知っていたんです。
      - 聞き: ネットもないのに、毎年ちゃんと世界のニュースが届いてたんだ。あーし、ちょっと感動。
        tone: しみじみ
      - 語り: こうして、海の外の知らせも、学問も、細い窓口を通って、少しずつ入ってきていました。
      - 語り: シーボルトが来る30年ほど前、北の根室に、ロシアの船が来ていました。
        hook: true

  # ---------------------------------------------------------------- 7
  - title: 扉をたたいた船と「開国」
    background: {image: paintings/sakoku_nagasaki_harbour_keiga_1833.jpg, credit: "川原慶賀《長崎港図》1833年ごろ"}
    portrait: null
    year: 1792
    lines:
      - 語り: 1792年、ロシアのラクスマンが、北海道の根室に来て、取り引きを求めました。幕府は、すぐには応じず、長崎に来るための許可証を渡して帰らせます。
        card: {head: "1792年", body: "ロシアのラクスマンが根室に"}
      - 語り: 1804年、その許可証を持って、レザノフが長崎に来ました。
        card: {head: "1804年", body: "レザノフが長崎に"}
        year: 1804
      - 聞き: 今度こそ、取り引きできたの？
        tone: 疑問
      - 語り: いいえ。幕府は、決まった国以外とは付き合わないのが、先祖からの決まりだ、と答えて断りました。
        card: {head: "1805年", body: "「先祖からの決まり」として断る"}
        year: 1805
      - 聞き: 先祖からの決まり？ でも、最初の命令に、そんなこと書いてあったっけ。
        tone: 疑問
      - 語り: いい所に気づきましたね。研究者の藤田覚さんは、この「先祖からの決まり」という考え方は、ラクスマンに対応したころ、老中の松平定信が作り出したものだ、と見ています。
      - 聞き: 断るために、昔からそうだったことにしたんだ。
        tone: 納得
      - 語り: 1825年には、外国の船を見たら追い払え、という命令も出しました。
        card: {head: "1825年", body: "外国船を追い払う命令"}
        year: 1825
      - 語り: 1837年には、日本人の漂流民を送り届けに来たアメリカの船を、そうとは知らずに大砲で追い返しています。
      - 聞き: 送り届けに来てくれた船だったのに……。あとで知ったら、気まずいね。
        tone: しみじみ
      - 語り: 1840年、中国でアヘン戦争が起こります。大国の清がイギリスに負けたことも、風説書で幕府に届きました。オランダは、もっとくわしい特別の報告書も出すようになります。
        card: {head: "1840年〜", body: "アヘン戦争の知らせ"}
        year: 1840
      - 聞き: 清が負けたって聞いたら、幕府もあせりそう。
        tone: 疑問
      - 語り: 実際、幕府は方針を変えました。1842年、外国の船を追い払う命令をやめて、困っている船には水や燃料を与えることにしたんです。
        card: {head: "1842年", body: "外国船に水や燃料を与える方針へ"}
        year: 1842
      - 語り: 1852年。オランダが幕府に出した特別の報告書に、アメリカの艦隊が日本に来る、という知らせが書かれていました。
        short: s5
        card: {head: "1852年", body: "アメリカ艦隊の来航の予告"}
        year: 1852
      - 聞き: それって、ペリーのこと！？
        short: s5
        tone: 驚き
      - 語り: はい。ペリーが来る1年ほど前に、幕府は知っていたんです。この報告書は秘密でしたが、幕府の外にも漏れていました。
        short: s5
      - 聞き: じゃあ、黒船にいきなりびっくり、っていうのは……。
        short: s5
        tone: 疑問
      - 語り: 町の人たちは驚いたでしょう。でも、幕府にとっては、まったくの不意打ちではありませんでした。
        short: s5
      - 聞き: 知ってたけど、準備が間に合わなかった、ってことか。
        short: s5
        tone: しみじみ
      - 語り: 1853年、アメリカのペリーが艦隊を率いて浦賀沖に来ます。翌1854年、日米和親条約が結ばれ、下田と箱館の2つの港が開かれました。
        background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年）"}
        portrait: {image: paintings/sakoku_perry_portrait_japanese.jpg, caption: "日本で描かれたペリー（1854年ごろの版画）"}
        card: {head: "1853年・1854年", body: "ペリー来航と日米和親条約"}
        year: 1853
      - 聞き: これで、開国！
        tone: 明るい
      - 語り: ただ、この条約には、貿易はまだ入っていません。本格的に貿易が始まるのは、1858年の通商条約のあと、1859年からです。
      - 聞き: 開国って一言で言うけど、何段階もあったんだ。
        tone: 納得
      - 語り: 1639年から1854年まで、数えると215年。200年以上というのは、数としては合っています。
      - 聞き: そういえば、こういうやり方って、日本だけだったの？
        tone: 疑問
      - 語り: 海の向こうの中国にも、海に出ることを禁じた決まりがありました。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 日本だけではなかった
    background: {image: paintings/sakoku_chinese_ship_17c.jpg, credit: "長崎版画《唐船図》（江戸時代）"}
    portrait: null
    year: 1655
    lines:
      - 語り: 中国の明は、1371年に、民間の人が勝手に海へ出て外国と取り引きすることを禁じました。《海禁》と呼ばれる政策です。
        short: s8
        card: {head: "1371年", body: "明の海禁"}
      - 聞き: 中国も、海に出るのを禁止してたの！？
        short: s8
        tone: 驚き
      - 語り: はい。海賊への対策でもありました。明は、のちに一部を緩めますが、次の清も、1655年に海禁を出しています。
        short: s8
      - 語り: 清は、海沿いに住む人々を内陸へ移す命令まで出しました。海禁をすべて解いたのは1684年。長崎に来る中国の船が一気に増えるのは、このあとです。
        short: s8
      - 聞き: 長崎に中国の船があふれたのは、清の方針が変わったからだったんだ。つながった！
        short: s8
        tone: 納得
      - 語り: 朝鮮も、似た政策をとっていました。国が海の外との行き来を管理するのは、東アジアでは珍しくなかったんです。
        short: s8
      - 語り: 研究者の荒野泰典さんは、1980年代から、江戸幕府の政策も、この「海禁」の一つとして見るべきだ、と考えました。
      - 語り: そして、自分の国を中心に、周りの国を位置づける考え方とあわせて、説明しています。
      - 聞き: 日本だけが特別に閉じこもってた、ってわけじゃないんだ。あーし、ちょっと見方が変わった。
        tone: しみじみ
      - 語り: では、最後の層です。1801年、長崎のある学者が、一冊の外国の本を訳していました。
        hook: true

  # ---------------------------------------------------------------- 9
  - title: 見立て：「鎖国」という言葉は、いつ生まれたか
    background: {image: paintings/sakoku_edo_sanpu_kaempfer.jpg, credit: "ケンペル『日本誌』（1727年）の挿絵 オランダ商館長の江戸参府"}
    portrait: null
    year: 1801
    lines:
      - 語り: 「鎖国」が今の意味で定着するまでには、大きく3つの段階があったと、僕は見ています。
      - 聞き: 3つ？ 聞かせて。
        tone: 疑問
      - 語り: 一つ目は、外国人の本です。覚えていますか、ケンペル。
        card: {head: "段階1", body: "ケンペル『日本誌』の翻訳から"}
      - 聞き: 綱吉に会った、ドイツ人のお医者さん！
        tone: 明るい
      - 語り: そうです。ケンペルは日本の記録を書き残しましたが、本を見ないまま、1716年に亡くなります。
      - 語り: 遺した原稿は、1727年にロンドンで英語の本になり、のちにオランダ語にも訳されました。そのオランダ語の本が、長崎に届きます。
        year: 1727
      - 聞き: ドイツの人が書いて、ロンドンで本になって、オランダ語になって、長崎に。すごい旅。
        tone: 驚き
      - 語り: その付録に、日本が国の出入りを閉ざしているのは正しい、とほめる論文がありました。
      - 語り: 1801年、長崎のもとオランダ語の通訳、《志筑忠雄》が、ドイツ人ケンペルが書いた論文を訳します。とても長い題が付いていたので、志筑は短く『鎖国論』と名づけました。
        short: s1
        card: {head: "1801年", body: "志筑忠雄が『鎖国論』と訳す"}
        year: 1801
      - 語り: 「鎖国」という言葉は、ここで初めて生まれた、とされます。のちに「鎖国令」とまとめられる命令から、160年ほどあとのことです。
        short: s1
      - 聞き: 題名を縮めたら、時代の名前になっちゃったんだ。
        short: s1
        tone: しみじみ
      - 語り: この訳は、本として出されず、書き写されて、学者たちのあいだで読まれました。本として出たのは1850年。それも『異人恐怖伝』、外国人が怖い話、というような題が付けられていました。
      - 聞き: 題名が全然ちがうものになってる……。
        tone: 笑い
      - 語り: 二つ目は、幕府が外国を断る理由として使い始めたことです。ロシアへの返事のように、「先祖からの決まり」という考えが先にできました。
      - 語り: そして1853年ごろからは、幕府の文書にも「鎖国」の言葉が出てくるようになります。
        card: {head: "段階2", body: "幕府が断る理由に使う"}
        year: 1853
        figure: {type: bars, title: 命令から何年後に言葉が出たか, bars: [[「鎖国」の言葉（1801年）, 162], [幕府の文書に出る（1853年ごろ）, 214]], labels: ["約160年後", "約210年後"], note: 1639年のポルトガル船の禁止から数えた}
      - 聞き: 言葉ができてから、あとで中身の理由づけに使われたんだ。
        tone: 納得
        figure: null
      - 語り: 三つ目は、明治のあとです。「開国」して近代化した、という話の反対側に、「鎖国」が置かれました。
        background: {image: paintings/sakoku_nagasaki_photo_beato_1867.jpg, credit: "フェリーチェ・ベアト撮影《長崎港》1867〜68年"}
        card: {head: "段階3", body: "「開国」と対になって広まる"}
      - 語り: 閉じていた時代と、開いた明治。その対が分かりやすかったので、教科書でも長く使われてきたんです。
      - 聞き: 開国のすごさを言うために、鎖国が暗く描かれたってこと？
        tone: 疑問
      - 語り: そういう面もあったと思います。
      - 語り: そして2017年、国の学習指導要領の案で、「鎖国」を「幕府の対外政策」と言い換える案が出されました。
        short: s7
        card: {head: "2017年", body: "「鎖国」を言い換える案"}
      - 聞き: え、授業で習わなくなるところだったの？
        short: s7
        tone: 驚き
      - 語り: 同じ案では、「聖徳太子」を「厩戸王」と書く案も出ていました。
      - 語り: 案全体に、1万1000件を超える意見が集まりました。「開国」があるのに「鎖国」がないと教えにくい、という声が多かったそうです。
        short: s7
      - 語り: 結局、最後は「鎖国などの幕府の対外政策」という形に戻りました。
        short: s7
