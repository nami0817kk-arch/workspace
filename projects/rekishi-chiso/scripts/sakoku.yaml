  # ---------------------------------------------------------------- 7
  - title: 扉をたたいた船と「開国」
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1792
    lines:
      - 語り: 1792年、ロシアのラクスマンが、北海道の根室に来て、取り引きを求めました。1804年には、レザノフが長崎に来ます。
        card: {head: "1792年・1804年", body: "ロシアが取り引きを求める"}
      - 語り: 幕府は、どちらも断りました。そのとき幕府は、決まった国以外とは付き合わないのが、先祖からの決まりだ、と言い始めます。
        card: {head: "1805年", body: "「先祖からの決まり」として断る"}
        year: 1805
      - 聞き: 先祖からの決まり？ でも、最初の命令に、そんなこと書いてあったっけ。
        tone: 疑問
      - 語り: いい所に気づきましたね。研究者の藤田覚さんは、この「先祖からの決まり」という考え方は、このころに作られたものだ、と見ています。
      - 聞き: 断るために、昔からそうだったことにしたんだ。
        tone: 納得
      - 語り: 1825年には、外国の船を追い払う命令も出しました。
        card: {head: "1825年", body: "外国船を追い払う命令"}
        year: 1825
      - 語り: 1837年には、日本人の漂流民を送り届けに来たアメリカの船にまで、大砲を撃って追い返しています。
      - 聞き: 送り届けに来てくれたのに……。それは、ひどい。
        tone: 重い
      - 語り: その追い払う命令を、アヘン戦争の知らせを受けて取り下げたのが、さっきの1842年です。
      - 語り: そして1853年、アメリカのペリーが、4隻の艦隊で浦賀沖に来ます。
        card: {head: "1853年", body: "ペリーが浦賀沖に来る"}
        year: 1853
      - 語り: 翌1854年、日米和親条約が結ばれ、下田と箱館の2つの港が開かれました。
        card: {head: "1854年", body: "日米和親条約"}
        year: 1854
      - 聞き: これで、開国！
        tone: 明るい
      - 語り: ただ、この条約には、貿易はまだ入っていません。本格的に貿易が始まるのは、1858年の通商条約のあと、1859年からです。
      - 聞き: 開国って一言で言うけど、何段階もあったんだ。
        tone: 納得
      - 語り: 1639年から1854年まで、数えると215年。200年以上というのは、数としては合っています。でも、その中身は、閉ざしたのではなく、選んでつながっていた215年でした。
      - 聞き: そういえば、こういうやり方って、日本だけだったの？
        tone: 疑問
      - 語り: 実は、海の向こうの国々も、似たことをしていました。
        hook: true

  # ---------------------------------------------------------------- 8
  - title: 日本だけではなかった
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1655
    lines:
      - 語り: 中国の明は、1371年に、民間の人が勝手に海へ出て外国と取り引きすることを禁じました。《海禁》と呼ばれる政策です。
        short: s8
        card: {head: "1371年", body: "明の海禁"}
      - 聞き: 中国も、海に出るのを禁止してたの！？
        short: s8
        tone: 驚き
      - 語り: はい。海賊への対策でもありました。明は、のちに一部を緩めますが、次の清も、1655年に海禁を出しています。
        short: s8
      - 語り: 清は、海沿いに住む人々を内陸へ移す命令まで出しました。それを解いたのが1684年。長崎に中国の船が一気に増えた、あの年です。
        short: s8
      - 聞き: あの190隻は、清の方針が変わったからだったんだ。つながった！
        short: s8
        tone: 納得
      - 語り: 朝鮮も、似た政策をとっていました。国が海の外との行き来を管理するのは、東アジアでは珍しくなかったんです。
        short: s8
      - 語り: 研究者の荒野泰典さんは、江戸幕府の政策も、この「海禁」の一つとして見るべきだ、と考えました。そして、自分の国を中心に周りの国を位置づける考え方とあわせて、説明しています。
      - 聞き: 日本だけが特別に閉じこもってた、ってわけじゃないんだ。
        tone: しみじみ
      - 語り: では、最後の層です。なぜ、この時代を「鎖国」と呼ぶようになったのか。
