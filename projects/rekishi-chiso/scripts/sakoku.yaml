sections:
  # ---------------------------------------------------------------- 1
  - title: 地表：日本は国を閉ざしていた
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1639
    lines:
      - 語り: 江戸幕府は、国を閉ざした。外国との行き来を断ち、日本は200年以上、世界から取り残された。
        tone: 重い
      - 聞き: 鎖国でしょ！ だからペリーが来て、びっくりしたんだよね。
        tone: 明るい
      - 語り: そう習った人が多いと思います。それが、今日の《地表》です。みんなが知っている通説。今日は、その下を掘っていきます。
      - 聞き: え、鎖国も掘れるの？ 人じゃないのに。
        tone: 疑問
      - 語り: 掘れます。まず、「鎖国」という言葉。実は、江戸幕府が始めたころには、なかった言葉なんです。
        short: s1
        card: {head: "「鎖国」という言葉", body: "幕府が始めたころには、なかった"}
      - 聞き: うそでしょ！？ じゃあ、なんて呼んでたの？
        short: s1
        tone: 驚き
      - 語り: 特に名前はありませんでした。この言葉が生まれたのは、始まってから160年ほどあと。しかも、外国人の本を訳したときに作られた言葉です。
        short: s1
      - 聞き: 翻訳から生まれた言葉なんだ……。
        short: s1
        tone: 疑問
      - 語り: そのいきさつは、最後に掘り当てましょう。もう一つ。閉ざしていたはずの長崎には、1年で190隻を超える中国の船が来た年もありました。
      - 聞き: 190隻！？ それ、閉ざしてなくない？
        tone: 驚き
      - 語り: それを、これから確かめていきます。まずは、のちに「鎖国令」と呼ばれる命令からです。
      - 聞き: 了解。あーし、今日はヘルメットに双眼鏡もつけとく。
        tone: 笑い

  # ---------------------------------------------------------------- 2
  - title: 「鎖国令」はなかった
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1633
    lines:
      - 語り: 教科書では、「鎖国令」という言葉を習ったかもしれません。でも、「鎖国令」という名前の法令は、出ていません。
        short: s2
      - 聞き: え、テストに出たのに？
        short: s2
        tone: 疑問
      - 語り: 1633年から1639年にかけて、幕府はいくつもの命令を出しました。それを、のちの人が「鎖国令」とまとめて呼んでいるんです。
        short: s2
        card: {head: "1633〜1639年", body: "のちに「鎖国令」とまとめられる命令"}
      - 語り: 1633年には、幕府の許しを得た船以外が海外へ行くのを禁じ、海外に長く住んだ日本人の帰国を禁じました。
        short: s2
      - 語り: 1635年には、日本人が海外へ行くことも、帰ってくることも、すべて禁じます。中国とオランダの船が入れる港も、長崎だけにしました。
        short: s2
        card: {head: "1635年", body: "日本人の海外渡航と帰国を禁止"}
      - 聞き: 出るのも帰るのもダメ……。海外にいた人は、帰れなくなっちゃったんだ。
        short: s2
        tone: しみじみ
      - 語り: 1636年には、ポルトガル人の子どもや孫など、287人を、中国のマカオへ送り出しています。
        card: {head: "1636年", body: "ポルトガル人の子孫ら287人をマカオへ"}
        year: 1636
      - 聞き: 家族ごと……。日本で生まれた子もいたんだよね。
        tone: しみじみ
      - 語り: その少しあと、九州で島原・天草の一揆が起こります。キリスト教の信者も多く加わった、大きな一揆でした。
        card: {head: "1637〜38年", body: "島原・天草の一揆"}
        year: 1637
      - 語り: そして1639年、幕府は、ポルトガルの船が来ることを禁じました。
        short: s2
        card: {head: "1639年", body: "ポルトガル船の来航を禁止"}
        year: 1639
      - 聞き: ポルトガルだけ？ ほかの国は？
        tone: 疑問
      - 語り: いい所に気づきましたね。閉め出したのは、キリスト教を広めようとするポルトガルやスペインと、日本人の海外渡航です。
      - 語り: 1641年には、オランダの商館を、平戸から長崎の出島に移しました。ここで、長崎でオランダと中国と取り引きする形が固まります。
        card: {head: "1641年", body: "オランダ商館を出島へ移す"}
        year: 1641
      - 聞き: 閉ざしたっていうより、相手を選んで、場所を決めた感じ？
        tone: 納得
      - 語り: そう言えそうです。では、その窓口の一つ、長崎をのぞいてみましょう。
        hook: true

  # ---------------------------------------------------------------- 3
  - title: 長崎の出島と唐人屋敷
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1641
    lines:
      - 語り: 長崎の港には、扇の形をした小さな人工の島が造られていました。《出島》です。
        short: s6
      - 語り: 1634年から2年ほどかけて築かれました。お金を出したのは、長崎の町人25人です。門や橋、塀は幕府が造りました。
      - 語り: 広さは、およそ1.5ヘクタール。東京ドームの3分の1ほど、サッカー場なら2面分くらいです。
        short: s6
        card: {head: "出島", body: "約1.5ヘクタール（東京ドームの約3分の1）"}
      - 聞き: 思ったより小さい！ そこにオランダの人たちが住んでたの？
        short: s6
        tone: 驚き
      - 語り: はい。18世紀には、20人あまりが住んでいたとされます。オランダの船は、今のインドネシアのジャカルタから、季節風に乗ってやって来ました。
        short: s6
      - 語り: はじめは年に2隻ほど。のちには年1隻になります。それでも227年のあいだに、延べ700隻以上の船が来ています。
        card: {head: "オランダ船", body: "227年で延べ700隻以上"}
      - 聞き: 1隻でも、毎年ちゃんと来てたんだ。
        tone: 納得
      - 語り: ただ、長崎にもっと多く来ていたのは、中国の船でした。
        short: s3
      - 語り: 1684年に、清が海に出ることを許すと、中国の船は一気に増えます。1688年には、1年で190隻を超え、延べ9000人あまりが長崎に来たとされます。
        short: s3
        card: {head: "1688年", body: "中国船が190隻を超える"}
        year: 1688
      - 聞き: ほぼ2日に1隻……。長崎、めちゃくちゃにぎやかじゃん。
        short: s3
        tone: 驚き
      - 語り: 当時の長崎の人口は、およそ5万人です。そこに1年で9000人あまりですから、町の大きさから見ても、かなりの数です。
        short: s3
      - 語り: 翌年には、中国の人を住まわせる《唐人屋敷》が造られました。広さは、出島の3倍ほどあります。
        short: s6
        card: {head: "1689年", body: "唐人屋敷（出島の約3倍）"}
        figure: {type: bars, title: 長崎と釜山の外国人の町（坪）, bars: [[出島, 3969], [唐人屋敷, 9400], [釜山の倭館, 100000]], labels: ["約4000坪", "約9400坪", "約10万坪"], note: 倭館は朝鮮の釜山にあった対馬の人の町}
      - 聞き: 出島より、中国の人の町のほうが、ずっと大きかったんだ。
        short: s6
        tone: 納得
      - 語り: 日本から出ていったのは、はじめは銀、のちに銅です。16世紀の終わりから17世紀の初めには、世界の銀の3分の1ほどを日本がつくっていた、とも言われます。
        figure: null
      - 聞き: 世界の銀の3枚に1枚が、日本産！？
        tone: 驚き
      - 語り: そう言われるほどでした。オランダは1668年まで日本の銀を運び出し、そのあとは金や銅に移っています。
      - 語り: 銅は、中国でとても大事にされました。1705年に中国の雲南で銅山が見つかるまで、日本の銅が、ほとんど唯一の頼りだったんです。
      - 語り: 銅の次に大事だったのが、俵物と呼ばれる海の幸です。干したアワビや、フカヒレ、干したナマコ。どれも、中国料理の高級な材料でした。
      - 聞き: フカヒレ！ 江戸の日本から、中国の高級料理の材料が出ていってたんだ。
        tone: 明るい
      - 語り: 中国からは、生糸や絹織物、砂糖、薬の原料、それに書物が入ってきました。
      - 聞き: 着物の生地も、砂糖も、海の向こうから来てたんだ。
        tone: 疑問
      - 語り: 幕府は、取り引きの量にも上限をかけていきます。1715年には、中国の船は年30隻、オランダの船は年2隻まで、と決めました。
        card: {head: "1715年", body: "中国船は年30隻、オランダ船は年2隻まで"}
        year: 1715
      - 聞き: 閉ざすっていうより、蛇口をしめたりゆるめたり、調節してる感じ。あーし、イメージ変わってきた。
        tone: 納得
      - 語り: ちなみに出島は、明治の工事で埋め立てられ、1904年に島の形が消えました。長崎市は1951年から元の姿に戻す工事を続けていて、2016年までに16の建物がよみがえっています。
      - 語り: いずれは、周りを水で囲んだ扇の形に戻す計画です。
      - 聞き: 今も、掘り起こして戻してる途中なんだ。地層を掘るのとちょっと似てる。
        tone: しみじみ
      - 語り: そして、窓口は長崎だけではありませんでした。
        hook: true

  # ---------------------------------------------------------------- 4
  - title: 対馬・薩摩・松前
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1700
    lines:
      - 語り: 江戸時代の日本には、外の世界へ開いた窓口が、4つありました。研究者は《四つの口》と呼んでいます。
        figure: {type: map, title: 四つの口, bounds: [125.0, 146.0, 24.0, 44.0], places: [[長崎, 129.87, 32.75], [対馬, 129.30, 34.40], [薩摩, 130.55, 31.60], [松前, 140.10, 41.43], [江戸, 139.77, 35.68], [釜山, 129.04, 35.10], [那覇, 127.68, 26.21]], note: 長崎・対馬・薩摩・松前}
      - 聞き: 4つも！？ 長崎だけだと思ってた。
        tone: 驚き
      - 語り: 長崎がオランダと中国。対馬が朝鮮。薩摩が琉球。そして松前が、北のアイヌの人々との窓口です。
        card: {head: "四つの口", body: "長崎・対馬・薩摩・松前"}
      - 語り: ただ、「四つの口」は、1980年ごろに研究者が使い始めた言葉です。当時の人がそう呼んでいたわけではありません。
      - 聞き: そこも、あとからの言葉なんだ。
        tone: 納得
      - 語り: 幕府は相手を、2つに分けて考えていました。朝鮮と琉球は、国と国の使節をやりとりする「通信の国」。オランダと中国は、取り引きだけをする「通商の国」です。
      - 聞き: 仲良くする国と、商売だけの国、みたいな？
        tone: 疑問
      - 語り: おおまかには、そういう分け方です。
      - 語り: 対馬の宗氏は、朝鮮の釜山に、《倭館》という日本人の町を持っていました。広さは10万坪ほど。出島の25倍くらいあります。
        figure: null
        card: {head: "釜山の倭館", body: "約10万坪。400〜500人の日本人"}
      - 聞き: 出島の25倍！？ 日本の外に、日本人の町があったの？
        tone: 驚き
      - 語り: はい。対馬の人が、400人から500人ほど住んでいたとされます。朝鮮からは朝鮮人参などが入り、朝鮮を通って、中国の生糸や絹も入ってきました。
      - 語り: 薩摩と琉球の関係は、少し複雑です。1609年、薩摩藩が琉球に攻め入り、琉球の貿易を見張るようになりました。
        card: {head: "1609年", body: "薩摩藩が琉球に攻め入る"}
      - 語り: でも琉球は、そのあとも中国への使いを続けます。薩摩は琉球を通して、中国の生糸や薬の原料を手に入れていました。
      - 聞き: 琉球は、中国とも日本ともつながってたんだ。
        tone: 納得
      - 語り: 琉球からは、黒砂糖も薩摩へ運ばれました。奄美の島々は、このとき薩摩の直接の領地になっています。
      - 語り: 北の松前藩は、米がほとんどとれない土地でした。そこで家臣に、土地の代わりに、アイヌの人々と取り引きする権利を与えていました。
      - 語り: 18世紀の前半からは、その取り引きを商人に任せるようになります。
      - 語り: アイヌの人々からは、鮭や昆布、毛皮などが届きました。さらにその先の樺太や大陸を通って、中国の絹織物まで入ってきたんです。
      - 聞き: 北から中国の絹！？ 地図で見ると、ほぼ一周してる。
        tone: 驚き
      - 語り: 4つの窓口で、日本は周りの国や地域とつながっていました。そして、つながりは物だけではありませんでした。
        hook: true

  # ---------------------------------------------------------------- 5
  - title: 江戸へ来た使節の行列
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1711
    lines:
      - 語り: 朝鮮の国王は、江戸の将軍に、使節を送っていました。《朝鮮通信使》です。
        short: s4
      - 語り: 1607年から1811年までに、12回。一行は400人から500人ほどで、対馬藩の警護などを含めると、1500人ほどの行列になったとされます。
        short: s4
        card: {head: "朝鮮通信使", body: "12回。警護を含め約1500人の行列"}
      - 聞き: 1500人の行列が、江戸まで歩いてきたの？
        short: s4
        tone: 驚き
      - 語り: そうです。最後の1回は対馬で迎えたので、江戸まで来たのは11回です。初めのころは、日光の東照宮まで足を延ばしたこともありました。
        short: s4
      - 語り: 通る町々では、行列を見ようと、たくさんの人が集まったと伝えられています。
        short: s4
      - 聞き: 鎖国中に、外国の大行列が江戸を歩いてたなんて……。あーし、完全に見に行ってる。
        short: s4
        tone: 笑い
      - 語り: その記録は、2017年、日本と韓国の両方の資料をあわせて、ユネスコの「世界の記憶」に登録されています。
        short: s4
        card: {head: "2017年", body: "朝鮮通信使の記録が世界の記憶に"}
      - 語り: 琉球からも、江戸へ使節が来ていました。1634年から1850年までに、18回。中国風の装いで江戸を目指した、とされます。
        card: {head: "琉球の使節", body: "18回（1634〜1850年）"}
      - 語り: そしてオランダの商館長も、江戸へ上って将軍にあいさつしています。1850年までに、166回です。
        card: {head: "オランダ商館長", body: "江戸参府166回"}
        figure: {type: bars, title: 江戸へ来た回数, bars: [[朝鮮通信使, 12], [琉球の使節, 18], [オランダ商館長, 166]], labels: ["12回", "18回", "166回"]}
      - 聞き: 166回！？ ほぼ毎年じゃん。
        tone: 疑問
      - 語り: はじめは毎年、のちには4年に1度でした。元禄のころには、ドイツ人の医者ケンペルも、この江戸参府について行き、将軍の綱吉に会っています。この人は、あとで大事になります。
        figure: null
      - 聞き: 覚えとく。ケンペルさんね。
        tone: 納得
      - 語り: アメリカの研究者、ロナルド・トビさんは、こうした外国の使節を迎えることが、将軍の力を国の内に見せる場にもなっていた、と考えています。
      - 聞き: 外国の人が会いに来るほどの将軍、ってアピールにもなるんだ。
        tone: 納得
      - 語り: 人だけではありません。海の外の出来事も、毎年、江戸に届いていました。
        hook: true

  # ---------------------------------------------------------------- 6
  - title: 届いていた世界のニュース
    background: {image: TODO, credit: TODO}
    portrait: null
    year: 1641
    lines:
      - 語り: 1641年から、オランダの船は、来るたびに、海外の出来事をまとめた報告書を幕府に出していました。《風説書》です。
        card: {head: "1641年〜", body: "オランダ風説書が毎年届く"}
      - 聞き: 海外ニュースの報告書？ そんなのがあったんだ。
        tone: 疑問
      - 語り: ヨーロッパやインド、中国のようすまで書かれていました。それが200年以上、続いたんです。
      - 語り: 1720年には、8代将軍の吉宗が、キリスト教にかかわらない洋書の輸入を許しました。
        card: {head: "1720年", body: "吉宗が洋書の輸入を緩める"}
        year: 1720
      - 語り: そして1774年。杉田玄白たちが、オランダ語の解剖の本を訳して、『解体新書』を出しました。
        card: {head: "1774年", body: "『解体新書』"}
        year: 1774
      - 聞き: 歴史の授業で聞いたやつ！ 鎖国中に、西洋の医学を学んでたんだ。
        tone: 明るい
      - 語り: 1823年には、ドイツ人の医者シーボルトが出島に来て、長崎の郊外に塾を開きました。日本中から、学びたい人が集まります。
        card: {head: "1823年", body: "シーボルトが長崎に塾を開く"}
        year: 1823
      - 語り: 風説書は、オランダの商館長の話を、長崎の通訳が日本語に訳して書いたものです。あとで出てくる「鎖国」という言葉も、この通訳たちから生まれます。
      - 語り: 1840年、中国でアヘン戦争が起こります。大国の清がイギリスに負けたことも、報告書で幕府に届きました。
        card: {head: "1840年〜", body: "アヘン戦争の知らせ"}
        year: 1840
      - 語り: このころから、オランダは、もっとくわしい特別の報告書も出すようになります。
      - 聞き: 清が負けたって聞いたら、幕府もあせりそう。
        tone: 疑問
      - 語り: 実際、幕府は方針を変えました。1842年、外国の船を追い払う命令をやめて、困っている船には水や燃料を与えることにしたんです。
        card: {head: "1842年", body: "外国船に水や燃料を与える方針へ"}
        year: 1842
      - 語り: そして1852年。オランダの特別の報告書に、アメリカの艦隊が日本に来る、という知らせが書かれていました。
        short: s5
        card: {head: "1852年", body: "アメリカ艦隊の来航の予告"}
        year: 1852
      - 聞き: それって、ペリーのこと！？
        short: s5
        tone: 驚き
      - 語り: はい。ペリーが来る1年ほど前に、幕府は知っていたんです。この報告書は秘密でしたが、幕府の外にも漏れていました。
        short: s5
