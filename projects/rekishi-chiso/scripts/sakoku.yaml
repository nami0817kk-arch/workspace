  s4:
    title: "江戸を歩いた／朝鮮の大行列"
    yt_title: "鎖国中に江戸まで来た朝鮮通信使｜警護も加えた大行列"
    lead: "朝鮮通信使は12回。一行400〜500人に対馬藩の案内や警護が加わり、千数百人から2000人ほどの大行列になったとされます。"
    tags: [朝鮮通信使, 鎖国 外交, 対馬藩, 江戸時代 外交]
  s5:
    title: "黒船は／1年前に予告されていた"
    yt_title: "ペリー来航は1年前に予告されていた｜オランダ風説書"
    lead: "1852年、オランダが幕府に出した報告書に、アメリカの艦隊が来るという知らせが書かれていました。"
