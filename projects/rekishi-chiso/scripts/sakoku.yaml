    lead: "「鎖国」という言葉が生まれたのは1801年。長崎の元通訳・志筑忠雄が、ドイツ人ケンペルの論文を訳したときに付けた題からでした。"
    tags: [鎖国 言葉, 志筑忠雄, ケンペル, 鎖国論]
  s2:
    title: "「鎖国令」という／法令はない"
    yt_title: "「鎖国令」という名前の法令はなかった"
    lead: "1633年から1639年にかけて出された一連の命令を、のちに「鎖国令」とまとめて呼んでいるだけです。"
    tags: [鎖国令, 江戸幕府, 徳川家光, 日本史 テスト]
  s3:
    title: "長崎に1年で／190隻の中国船"
    yt_title: "鎖国中の長崎に、1年で190隻を超える中国船が来た年があった"
    lead: "1688年、長崎に来た中国船は190隻を超え、延べ9000人あまりが訪れたとされます。"
