        tone: しみじみ
      # fact: yoshimitsu-09
      - 語り: 死の時刻は、午後3時から9時まで、記録によって割れます。病は、『鹿苑院殿追善記』には、流布の御所労、とだけあります。
      # fact: yoshimitsu-07
