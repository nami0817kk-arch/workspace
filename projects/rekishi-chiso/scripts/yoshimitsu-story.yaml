# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  足利義満は、死んだあとに、上皇になりかけました。
  朝廷が、太上天皇、つまり上皇の称号を贈ろうとしたのです。ところが、その称号は、無かったことにされました。
  1408年、応永15年5月6日。金閣を建てた義満は、北山第で亡くなります。その夜のうちに、遺体はひそかに運び出されました。
  病の始まり、死の時刻、朝廷の尊号、明からの弔い。最期の前後を、日記や公家の記録の順に、たどります。
  この動画でわかること
  ・義満が病に倒れる2日前、次男の義嗣が親王に準ずる扱いで元服した件（『続史愚抄』ほか）
  ・死の時刻が、日記によって午後3時から9時まで割れる件
  ・朝廷が贈ろうとした「太上天皇」の尊号が、なぜ消えたのか（小川剛生さん・石原比伊呂さんの論文）
  ・明の永楽帝が贈った諡「恭献」と、義持の受け止め方（『明実録』『善隣国宝記』）
description_note: |-
  日記・記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。応永15年の月日は旧暦で、西暦（ユリウス暦）への直しは、日干支と新月の計算で確かめた目安です（宣明暦は平朔のため、前後1日ほどの幅があります）。
  『教言卿記』『荒暦』は、『後鑑』『続史愚抄』・小川剛生論文の引用を通して読みました（原本・史料集の本文は見ていません）。『鹿苑院殿薨葬記』『北山殿行幸記』『椿葉記』は、国立国会図書館デジタルコレクション（群書類従）の全文OCRと頁の画像で読みました。『明実録』『善隣国宝記』『明史』は、ウィキソースの転写で読みました。
  小川剛生「足利義満の太上天皇尊号宣下」（『藝文研究』101巻1号、2011年）と、石原比伊呂「足利義持と後小松「王家」」（『史学雑誌』116編6号、2007年）、村井章介（『史学雑誌』127巻2号、2018年）の論文は、慶應義塾大学のリポジトリ・J-STAGE の公開ページで読みました（PDFの文字層には誤字があります）。『満済准后日記』『康富記』『看聞日記』などの本文は読めていません。
  画面の情景・人物の画像の多くは、画像生成AIで作った想像上のイメージで、記録映像・実在の肖像ではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Ashikaga Yoshimitsu: Why Did His Posthumous Title Vanish? The Last Days, Per the Records"
  description: |-
    Ashikaga Yoshimitsu almost became a retired emperor after he died.
    The imperial court tried to grant him the title of a retired emperor (Daijo Tenno). Then that title was made to disappear.
    On the 6th day of the 5th month, Oei 15 (1408), the builder of the Golden Pavilion died at his Kitayama mansion. That same night his body was quietly carried away.
    This video follows the weeks before and after his death through courtiers' diaries and other records.
    In this video you will learn:
    - How his second son Yoshitsugu came of age with near-imperial rank two days before Yoshimitsu fell ill
    - How the diaries disagree on the hour of his death
    - Why the title Daijo Tenno was proposed and then dropped
    - The posthumous name Kyoken sent by the Ming court, and how his son Yoshimochi reacted
    Recorded words are read with their sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "Almost a Retired Emperor: Kitayama, 1408"
    - "The Emperor Visits Kitayama: March 8"
    - "A Coming-of-Age at the Palace: April 25"
    - "The Illness: April 27 to May 5"
    - "The Night of May 6"
    - "The Title That Vanished: May 8 and 9"
    - "The Ming Court Sends a Name"
    - "What Happened to Kitayama and the Golden Pavilion"
    - "Summary: What the Records Can Tell Us"

