sections:
  # ================================================================ 序章（冒頭 約2.5分）。答えはまとめまで言わない
  - title: 上皇になりかけた男　1408年5月 北山第
    background: {image: paintings/yoshimitsu_S01.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-01, yoshimitsu-02
      - 語り: 足利義満は、死んだあとに、上皇になりかけました。朝廷が、太上天皇、つまり上皇の称号を、贈ろうとしたのです。ところが、その称号は、無かったことにされました。
        tone: 重い
      # fact: yoshimitsu-06
      - 語り: 応永15年5月6日。西暦なら、1408年の5月31日ごろ。金閣を建てた足利義満は、北山第で亡くなります。数えで51歳でした。
        card: {head: "義満の最期", body: 応永15年5月6日}
      # fact: yoshimitsu-07
      - 語り: その夜のうちに、遺体は、北山第から、ひそかに運び出されました。行き先は、等持院です。『鹿苑院殿薨葬記』という記録が、そう書いています。
      # fact: yoshimitsu-08
      - 語り: しかも、跡継ぎについて、言い置いた様子は、無かったといいます。貞成親王の『椿葉記』が、そう書きます。
      # fact: yoshimitsu-10, yoshimitsu-19
      - 語り: 『鹿苑院殿追善記』によれば、病が始まったのは、4月27日。その2日前、次男の義嗣が、宮中の清涼殿で、元服をすませていました。後小松天皇の猶子。つまり、親王に準ずる扱いでした。
        card: {head: "義嗣の元服", body: 4月25日 清涼殿}
      # fact: yoshimitsu-20
      - 語り: 『椿葉記』は、そのときの世間の声を、書き留めています。義嗣が、兄の義持をも、押しのけるのではないか。人々は、あれこれ、言い合ったのです。
      - 語り: 兄の義持は、すでに将軍でした。
      - 語り: 朝廷は、なぜ、贈ろうとしたのか。その称号は、なぜ、受けられなかったのか。誰が、止めたのか。
        tone: 疑問
        pause: 0.8
      - 語り: 手がかりは、死の前の2か月足らずと、死のあとの7か月の、記録の中にあります。記録を書いた人たちは、日付も、時刻も、それぞれ、違うことを書きました。
      - 語り: まずは、その2か月前。天皇が、北山第にやってきた日から、たどります。
        hook: true

  # ================================================================ 第1章 行幸
  - title: 天皇を迎えた北山第　3月8日 北山第
    background: {image: paintings/yoshimitsu_S03.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-14
      - 語り: 応永15年3月8日。西暦では、4月4日ごろです。後小松天皇が、義満の屋敷、北山第に、行幸しました。天皇のお出かけ、という意味です。
      # fact: yoshimitsu-33
      - 語り: 北山第は、義満が京都の北山に造った屋敷です。のちに鹿苑寺となり、金閣が立つ場所です。
      - 語り: 義満は、応永元年の暮れに、将軍を子の義持に譲り、同じ月に、太政大臣になりました。翌応永2年には、出家しています。
      # fact: yoshimitsu-15
      - 語り: 当初の予定は、2月28日でした。花の咲くのを待って、日が改まった、と飛鳥井雅縁が書いています。義満の死を悼んだ文、『鹿苑院殿をいためる辞』です。
        card: {head: "行幸の予定", body: 2月28日から3月8日へ}
      # fact: yoshimitsu-16
      - 語り: 天皇が着いた門で、迎える少年がいました。次男の義嗣です。大人の髪に結わない、子どもの髪型、総角のままでした。
      # fact: yoshimitsu-16
      - 語り: 『北山殿行幸記』は、この姿を、こう書きます。光源氏の少年の姿も、こうだったかと思う。子どもの姿で、こんな場に出る例は、昔にも無いだろう、と。
      # fact: yoshimitsu-14
      - 語り: 天皇が帰ったのは、3月28日。『続史愚抄』は、御逗留、二十一日、と数えます。
        card: {head: "天皇の滞在", body: 3月8日から28日}
      # fact: yoshimitsu-14
      - 語り: 『続史愚抄』は、江戸時代の後半にまとめられた、朝廷の歴史書です。同じ時代の『後鑑』と並んで、当時の日記の文を引いています。
      # fact: yoshimitsu-14
      - 語り: 3月9日は雨で、童舞が延びました。10日には、宝物が、天皇に献じられます。14日に、童舞の御覧。青海波が舞われ、垣代が50人、舞う童が37人でした。
      # fact: yoshimitsu-14
      - 語り: 15日は、崇賢門院の御所で、猿楽がありました。17日と18日は蹴鞠。20日には、音楽と、和歌と、漢詩を、同じ日に催す、三船の会が開かれました。
      # fact: yoshimitsu-14
      - 語り: 24日は早歌。25日は、白拍子。もてなしは、『続史愚抄』の数えでは、21日に及びました。『椿葉記』は、十日ばかり、と書いていて、日数は割れます。
      # fact: yoshimitsu-21
      - 語り: この行幸を、東京大学史料編纂所の桑山浩然さんらの報告は、跡継ぎの問題に対する、示威行動、と位置づけています。
        card: {head: "行幸のねらい", body: 跡継ぎ問題への示威行動}
      # fact: yoshimitsu-21
      - 語り: 示威。つまり、力を見せつける行動です。その場には、総角の少年、義嗣もいました。
      # fact: yoshimitsu-21
      - 語り: 行幸の記録は、2種類あります。催しを、網羅的に書いたものと、和歌や音楽に偏ったものです。
      - 語り: 行幸の前後、義嗣の位は、立て続けに上がっていきます。
        hook: true

  # ================================================================ 第2章 元服
  - title: 元服は宮中で　4月25日 清涼殿
    background: {image: paintings/yoshimitsu_S05.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-17
      - 語り: 義嗣の昇進を、日付で並べます。2月27日に、童殿上。3月4日、従五位下。3月24日、左馬頭。3月28日、従四位下。3月29日、左近衛中将。
        figure: {type: table, title: 義嗣の昇進（応永15年）, cols: [官位, 注], rows: [[2月27日, 童殿上, 義満と同じ車で参内], [3月4日, 従五位下, 叙爵], [3月24日, 左馬頭, 正五位下　行幸の賞], [3月28日, 従四位下, 天皇が帰った日], [3月29日, 左近衛中将, その翌日]], upto: 5}
      # fact: yoshimitsu-17
      - 語り: 西暦に直すと、およそ1か月。そのあいだに、五つ、昇っています。
        figure: null
      # fact: yoshimitsu-17
      - 語り: 童殿上は、元服の前の子どもが、宮中の殿上の間に出入りを許されること。叙爵は、貴族として、最初の位をもらうことです。
      # fact: yoshimitsu-17
      - 語り: 義満自身も、元服の前に叙爵しています。貞治5年、40年あまり前の、その例にならった、と『北山殿行幸記』は書きます。
      # fact: yoshimitsu-17
      - 語り: 義嗣という名は、東坊城秀長が選んだ。山科教言の日記『教言卿記』にそうある、と『後鑑』が引いています。
      # fact: yoshimitsu-18
      - 語り: 4月10日から17日まで、義満は、義嗣を連れて、伊勢へ参宮しています。これも『教言卿記』の記事です。
      # fact: yoshimitsu-35
      - 語り: このころ、『荒暦』を書いた一条経嗣は、もう関白ではありません。4月20日に辞め、近衛忠嗣に替わっていました。義満が病に倒れる、7日前です。
      # fact: yoshimitsu-19
      - 語り: そして、4月25日。西暦では、5月20日ごろ。義嗣は、清涼殿で、元服しました。清涼殿は、天皇が日ごろを過ごす御殿です。
        card: {head: "義嗣の元服", body: 応永15年4月25日}
      # fact: yoshimitsu-19
      - 語り: 加冠、つまり、冠をかぶせる役は、内大臣の二条満基。髪を整える理髪は、蔵人頭の豊光でした。『続史愚抄』が、そう書きます。
      # fact: yoshimitsu-19
      - 語り: 後小松天皇の猶子。准親王の扱い。そして、その日のうちに、参議、従三位。位の段を飛び越えての昇進でした。
      # fact: yoshimitsu-20
      - 語り: 『椿葉記』は、この元服を、先例に準じたもの、と聞こえた、と書きます。けれど、続けて、兄をも押しのけるのでは、という世間の声を、書き留めました。
      - 語り: 元服を終えた義嗣。その2日後に、義満は、病に倒れます。
        hook: true

  # ================================================================ 第3章 病
  - title: 病の日々　4月27日から5月5日 北山第
    background: {image: paintings/yoshimitsu_S02.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-10
      - 語り: 応永の月日は、旧暦です。4月27日は、西暦では、5月22日ごろ。『鹿苑院殿追善記』は、この日から、御不例、と書きます。流布の、御所労。流行りの病、と読める言い方で、病名は出てきません。
        card: {head: "病の始まり", body: 4月27日 流布の御所労}
      # fact: yoshimitsu-11
      - 語り: 同じ27日。義満は、山科家の少年、嗣教の元服に、自分で加冠しました。16歳の少年に、烏帽子を、手ずからかけたのです。
      # fact: yoshimitsu-11
      - 語り: 『教言卿記』は、これを、希代の事なり、頗る過分、と書きます。めったにない、身に余ることだ、という意味です。
      # fact: yoshimitsu-12
      - 語り: 29日、祈祷が結願します。『後鑑』が引く『教言卿記』が、そう書いています。
      # fact: yoshimitsu-12
      - 語り: 5月1日。西暦では、5月26日ごろ。『後鑑』は、御病悩、漸く篤し、と書きます。病が、だんだん重くなった、という意味です。
        card: {head: "5月1日", body: 御病悩 漸く篤し}
      # fact: yoshimitsu-12
      - 語り: 高僧の祈祷が続き、陰陽師の在弘が、泰山府君祭を行いました。命を延ばすための、陰陽道の祭です。
      # fact: yoshimitsu-13
      - 語り: 5日は、端午の節供。この朝、義満は、少し持ち直しました。人々は、菖蒲を祝って、喜んだ、と雅縁は書いています。
      # fact: yoshimitsu-13
      - 語り: けれど、午の刻、昼ごろから、病は再び重くなりました。人々は、徹夜で、見守ります。
        tone: 重い
      - 語り: そして、5月6日。義満は、何時に、亡くなったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第4章 5月6日の夜
  - title: 5月6日の夜　北山第から等持院へ
    background: {image: paintings/yoshimitsu_S08.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-06
      - 語り: 5月6日。義満は、北山第で亡くなります。法名は道義。号は鹿苑院。享年、数えで51。『続史愚抄』の記述です。
        tone: しみじみ
      - 語り: 当時は、一日を十二の刻に分けました。申の刻は午後3時から5時、酉の刻は5時から7時、戌の刻は7時から9時です。
      # fact: yoshimitsu-09
      - 語り: 『教言卿記』は、申の斜め。『続史愚抄』は、申の刻。つまり、午後3時から5時ごろです。
        figure: {type: table, title: 死の時刻　記録の食い違い, cols: [書いた時刻, 今の時刻], rows: [[教言卿記, 申の斜め, 午後3〜5時ごろ], [続史愚抄, 申の刻, 午後3〜5時], [薨葬記・追善記, 酉の刻, 午後5〜7時], [飛鳥井雅縁, 戌の時ばかり, 午後7〜9時]], upto: 4}
      # fact: yoshimitsu-09
      - 語り: ところが、『鹿苑院殿薨葬記』と『追善記』は、酉の刻。雅縁は、戌の時ばかり、と書きます。
      # fact: yoshimitsu-09
      - 語り: いちばん早い記録と、いちばん遅い記録では、刻の幅で数えて、最大で6時間、開きます。
        figure: null
      # fact: yoshimitsu-07
      - 語り: ところが、同じ夜のうちに、事は動きます。遺体は、北山第の北御所から、人知れず運び出されました。時刻は、寅の刻。午前3時から5時ごろです。
        card: {head: "寅の刻", body: 遺体が等持院へ}
      # fact: yoshimitsu-07
      - 語り: 御輿と、担ぐ力者6人は、座主が出しました。『鹿苑院殿薨葬記』は、盗み出す、という字を使っています。
      # fact: yoshimitsu-07
      - 語り: 火葬は、10日と決まりました。日柄が悪いため、と薨葬記は添えています。
      - 語り: 『椿葉記』は、貞成親王が、後の年に書いた回想です。その場で書いた日記では、ありません。
      # fact: yoshimitsu-08
      - 語り: では、跡継ぎは。『椿葉記』は、こう書きます。跡継ぎを言い置いた様子も無い。この若君、義嗣が継ぐのでは、という噂もあった、と。
        card: {head: "跡継ぎ", body: 言い置いた様子は無し}
      # fact: yoshimitsu-08
      - 語り: 結局、管領の勘解由小路入道、つまり斯波義将の計らいで、嫡子の義持が、家を継いだのだ、と。
      # fact: yoshimitsu-32
      - 語り: 葬儀には、五山以下の長老が集まり、僧は3000人に及んだ、と『鹿苑院殿薨葬記』にあります。下火は、鹿苑院主の大岳周崇だった、と相国寺の冊子は書きます。
      # fact: yoshimitsu-32
      - 語り: 中陰のあと、遺骨は、塔所の相国寺鹿苑院に納められました。分骨は、高野山の安養院にあります。鹿苑院は、義満の御影堂と定められました。
      # fact: yoshimitsu-31
      - 語り: 35日目の、五七日。相国寺で、花が降るのを、貴賤の人々が目にした、という話を、雅縁は書き留めています。
      # fact: yoshimitsu-31
      - 語り: 6月21日には、客星が現れ、天文博士が、凶兆8か条を奏上しました。『続史愚抄』の記事です。
      - 語り: 時間を、少し戻します。死の2日後、朝廷は、もう動いていました。
        hook: true

  # ================================================================ 第5章 尊号
  - title: 上皇の称号はなぜ消えたのか　5月8日・9日
    background: {image: paintings/yoshimitsu_S09.jpg, credit: "AI生成の想像画"}
    year: 1408
    lines:
      # fact: yoshimitsu-01
      - 語り: 死から2日か、3日。朝廷は、義満に、太上天皇の尊号を、贈ろうとしました。天皇を退いた人の、称号です。
        card: {head: "太上天皇", body: 天皇を退いた人の称号}
      - 語り: 太上天皇は、略して、上皇とも呼びます。出家していれば、太上法皇、とも書かれます。
      - 語り: 義満は、天皇では、ありません。それでも、贈られかけたのです。
      # fact: yoshimitsu-01
      - 語り: 贈ると決めた日が、記録で割れます。武家昇晋年譜は、9日。東寺執行日記は、8日。西暦では、6月2日か、3日です。
        figure: {type: table, title: 尊号をめぐる記録, cols: [日付, 書いた内容], rows: [[武家昇晋年譜, 5月9日, 尊号を贈り奉る], [東寺執行日記, 5月8日, 先例が無く斯波義将が申し止めた], [続史愚抄, 5月9日, 義持が固辞]], upto: 3}
      # fact: yoshimitsu-01
      - 語り: 『東寺執行日記』は、こう書きます。昔より、この例が無いので、勘解由小路禅門が、申し止めた。勘解由小路禅門は、斯波義将のことです。
        figure: null
      # fact: yoshimitsu-02
      - 語り: 一方、『続史愚抄』は、辞退したのは義持だ、と書きます。
      # fact: yoshimitsu-02
      - 語り: 慶應義塾大学の小川剛生さんは、2011年の論文で、表向きは嫡子の義持、実際には斯波義将の意向で辞退した、と見ます。
        card: {head: "辞退したのは", body: 表向きは義持　実際は斯波義将}
      # fact: yoshimitsu-02
      - 語り: 小川さんは、これは受ける前提の、形だけの辞退ではない、と書きます。尊号宣下の事実そのものが、無かったことにされた、というのです。
      # fact: yoshimitsu-02
      - 語り: 石原比伊呂さんの2007年の論文は、この拒否を、室町殿は公家社会の代表者として扱われることを拒む、という意思表示だった、と解釈します。
      # fact: yoshimitsu-02
      - 語り: そう読めるなら、斯波義将ら宿老が拒んだ事実は、大きな意味を持つ、と言います。
      # fact: yoshimitsu-03
      - 語り: 記録に書かれた理由は、先例が無いこと。臣下が、この尊号を受けた例は、無かった、というのです。
      # fact: yoshimitsu-03
      - 語り: 結果は、こうです。尊号を贈った事実は、無かったことにされました。当時の史料は、義満を、上皇とは書かず、鹿苑院入道前太政大臣、と呼びます。
      # fact: yoshimitsu-03
      - 語り: 勅撰和歌集『新続古今集』に入った歌の作者名も、この呼び名です。
      # fact: yoshimitsu-03
      - 語り: 後の時代は、違います。1678年、延宝6年の木像の銘には、鹿苑天皇尊像、とあります。義満の死の、270年後です。
        card: {head: "延宝6年（1678年）の木像銘", body: 鹿苑天皇尊像}
      # fact: yoshimitsu-04
      - 語り: ところが、小川さんは、義満は生きているあいだに、この称号を求めていた、と読みます。
        tone: 疑問
      # fact: yoshimitsu-05
      - 語り: 死の3年前に、戻ります。応永12年、1405年の書状には、尊号は、年齢がまだ早い、と読める言葉があります。小川さんは、朝廷が先送りする口実、と読みます。
      # fact: yoshimitsu-04
      - 語り: 『荒暦』は、関白だった一条経嗣の日記です。原本は伝わらず、応永13年と14年の部分は、後の人の抜き書きで残っています。
      # fact: yoshimitsu-04
      - 語り: 応永13年12月26日。西暦では、1407年2月4日ごろ。義満の意向が、裏松重光から、経嗣に、内々に伝えられます。経嗣は、その言葉を、『荒暦』に書き留めました。
      # fact: yoshimitsu-04
      - 語り: 急ぎ、尊号のことを申し出て、沙汰があるように。
        card: {head: "荒暦（応永13年12月26日）", body: 急ぎ尊号を申し出よ}
      # fact: yoshimitsu-04
      - 語り: 翌27日、経嗣は義満に、妻、日野康子の准三后の前に、まず尊号の沙汰があるべきか、と述べます。
      # fact: yoshimitsu-04
      - 語り: 義満の死の、およそ1年4か月前です。小川さんの論文が、これを引いています。
      # fact: yoshimitsu-04
      - 語り: 年が明けた、応永14年正月4日。経嗣は、唐橋兼宣と、康子を女院にする案を話し合います。前の年の暮れの29日、義満が、清盛の妻の時子は、准三后にならなかったのか、と問いかけたからです。
      # fact: yoshimitsu-04
      - 語り: 経嗣は、清盛夫妻が、そろって准三后だったことを思い出し、義満の謎かけだ、と受け取りました。
      # fact: yoshimitsu-04
      - 語り: 小川さんは、義満は康子の准三后だけでは満足せず、自分の尊号を望んでいた、と読みます。このとき経嗣は、北山殿の尊号の事、まず沙汰があるなら、と口にしています。
      # fact: yoshimitsu-05
      - 語り: 生きているあいだは、年が早い、と先送りされた。死んだあとは、先例が無い、と止められた。
        tone: しみじみ
      - 語り: 一方、海の向こうでは、別の贈り物が、用意されていました。
        hook: true

  # ================================================================ 第6章 明
  - title: 明が贈った名　恭献　1409年1月
    background: {image: paintings/yoshimitsu_S11.jpg, credit: "AI生成の想像画"}
    year: 1409
    lines:
      # fact: yoshimitsu-26
      - 語り: 明の記録は、義満を、どう呼んだのか。『明史』は、義満を、王、源道義、と書きます。
      # fact: yoshimitsu-26
      - 語り: 永楽元年、義満の使者が、表と貢物をたてまつると、永楽帝は、冠服と、亀の形のつまみの金印などを賜った、とあります。
      # fact: yoshimitsu-26
      - 語り: 『明史』は、清の時代に編まれた歴史書です。明の時代の実録そのものでは、ありません。
      # fact: yoshimitsu-26
      - 語り: 日本国王に封じた、とはっきり書くのは、子の義持のほうです。
      # fact: yoshimitsu-36
      - 語り: 『善隣国宝記』には、義満の国書が載り、書き出しは、日本准三后、です。1401年、応永8年5月13日付。これに答えた1402年の詔で、日本国王、源道義、と呼んだのは、明の側でした。
      # fact: yoshimitsu-27
      - 語り: では、義満が日本国王に封じられたのは、いつか。1402年か、1404年か。
        figure: {type: table, title: 日本国王に封じられたのはいつか, cols: [年, 立場], rows: [[建文4年, 1402年, 従来の見方], [永楽2年, 1404年, 有力になっているとされる説]], upto: 2}
      # fact: yoshimitsu-27
      - 語り: 村井章介さんは、2018年の論文で、1404年が正しいとする説が有力になっている、と紹介します。そして、その説の読み方は、厳密ではない、と批判しています。
        figure: null
      # fact: yoshimitsu-22
      - 語り: 義満の死の知らせは、明に届きます。『明実録』永楽6年12月17日の条。西暦では、1409年1月2日ごろです。
        card: {head: "明実録", body: 永楽6年12月17日}
      - 語り: 義満の死から、およそ7か月。明の記録に、義満の死の知らせが載ります。
      # fact: yoshimitsu-22
      - 語り: 日本国世子の義持が、父の死を告げる使いを出した。そこで、中官の周全を祭りに遣わし、諡を、恭献とし、絹と布を、各500匹、贈った。
      # fact: yoshimitsu-22
      - 語り: さらに、義持を日本国王に封じる詔を持たせた使者も、送りました。
      # fact: yoshimitsu-23
      - 語り: 『善隣国宝記』は、室町時代の僧、瑞溪周鳳が、外国との文書を集めた本です。そこには、12月21日付の三通が載っています。
      # fact: yoshimitsu-23
      - 語り: 実録の記事は17日、文書の日付は21日と、4日ずれています。制書には、今、特に諡を賜う、恭献、とあります。
      # fact: yoshimitsu-23
      - 語り: 義持あての勅には、こう書かれています。国王道義が亡くなった知らせが届き、朕は深く悼む。世子は、悲しみを抑え、この変事を受け入れ、葬儀に力を尽くせ。
      # fact: yoshimitsu-23
      - 語り: 世子は、跡継ぎのことです。明は、義持を、そう呼んでいました。
      # fact: yoshimitsu-24
      - 語り: 義持は、これを、どう受け止めたのか。11年後、応永26年、1419年。『善隣国宝記』は、義持の言葉を載せます。
      # fact: yoshimitsu-24
      - 語り: 先君は、臨終に、神々に誓って、外国との通交を、永く絶った。それでも、明の使者を迎えたのは、先君を弔いに来たのでもあるから、誓いに背いて迎えたのだ、と。
        card: {head: "義持の言葉（1419年）", body: 誓いに背いて迎えた}
      # fact: yoshimitsu-24
      - 語り: ただし、これは、11年後の義持の説明です。1409年当時の記録では、ありません。
      # fact: yoshimitsu-25
      - 語り: 1411年、応永18年。清の黄遵憲の『日本国志』は、明の内官、王進が、兵庫まで来て、引き返した、と書きます。義満の死から、3年後です。
      # fact: yoshimitsu-26
      - 語り: 義満は、明から見れば、日本の王でした。日本の朝廷から見れば、前の太政大臣です。同じ人が、国の内と外で、違う名で呼ばれていたことになります。
      # fact: yoshimitsu-22
      - 語り: 朝廷が贈ろうとした、上皇の称号は、無かったことになりました。明が贈った、恭献の名は、明の記録に残りました。
        tone: しみじみ
      - 語り: では、義満が最後に残した北山第は、どうなったのか。
        hook: true

  # ================================================================ 第7章 北山第と金閣
  - title: 北山第と金閣のその後　1416年から1420年
    background: {image: paintings/yoshimitsu_S13.jpg, credit: "AI生成の想像画"}
    year: 1416
    lines:
      # fact: yoshimitsu-33
      - 語り: 北山第の造営が始まったのは、1397年、応永4年。鹿苑寺の年表に、そう記されています。義満の死の、11年前です。
      # fact: yoshimitsu-30
      - 語り: 金閣は、その中の舎利殿です。文化庁の解説は、二層と三層は全面に金箔を押している、と書き、義満の権威と、王朝への憧れを示している、と説明します。
        card: {head: "文化庁の解説", body: 義満の権威と王朝への憧れ}
      # fact: yoshimitsu-37
      - 語り: ただし、いまの金閣は、1950年の火事で焼け、1955年に再建されたものです。義満の時代の金閣は、もうありません。
      # fact: yoshimitsu-29
      - 語り: 義満が亡くなって8年後の、1416年。北山第に造営中だった七重の大塔が、雷で焼けました。鹿苑寺の年表に、そう記されています。
      # fact: yoshimitsu-28
      - 語り: そして、1420年。鹿苑寺の年表は、義満の遺言により、北山第は禅院、鹿苑寺に改められた、と書きます。死の12年後です。
        card: {head: "鹿苑寺の年表", body: 1420年 遺言で禅院に}
      # fact: yoshimitsu-28
      - 語り: 文化庁の解説は、1422年には禅寺の鹿苑寺となった、と書いています。
      # fact: yoshimitsu-04
      - 語り: 太政大臣。出家。准三后。そして、明から見た日本国王。肩書きを重ねた義満が、晩年に求めていた、と小川さんが読むのが、上皇の称号でした。
        tone: しみじみ
      - 語り: ここまでの記録から、言えることと、言えないことを、分けてみます。
        hook: true
        tone: 疑問

  # ================================================================ まとめ
