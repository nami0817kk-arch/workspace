# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。想像の台詞は入れない（imagined なし）。「もしも」は使わない（今回は記録の型）。
# 1本に1つの問い＝「死の直後に朝廷が贈ろうとした上皇の称号は、なぜ無かったことにされたのか。最期の記録は、なぜ時刻も言葉も食い違うのか」。題名は問いの形で、答え（辞退・先例）は伏せる。
#   冒頭（10秒以内）＝義満は死んだあと、一度だけ上皇になりかけた。ところがその称号は無かったことにされた（yoshimitsu-01, -02）。
#   続く意外な一点＝その夜に遺体がひそかに運び出された（-07）・跡継ぎの遺言が無かった（-08）・5月6日は旧暦で西暦なら5月31日ごろ（-06）・病の2日前に次男が親王に準ずる元服（-19）。
# 記録の食い違い（本編に表で並べるもの3つ）：
#   ①死の時刻（教言卿記＝申斜／続史愚抄＝申刻／薨葬記・追善記＝酉刻／雅縁＝戌ばかり）
#   ②尊号を贈ると決めた日と止めた人（武家昇晋年譜＝9日／東寺執行日記＝8日で斯波義将が申し止め／続史愚抄＝義持固辞）
#   ③義満が日本国王に封じられた年（1402年か1404年か。村井章介 2018）
# 計算（自分で計算し直した）：応永15年5/6＝1408-05-31（ユリウス暦）・4/25＝05-20・4/27＝05-22・3/8＝04-04・5/1＝05-26／発病4/27→死5/6＝9日／元服4/25→発病＝2日／昇進2/27（03-24）→3/29（04-25）＝32日／
#   応永13年12月26日（1407-02-04）→死（1408-05-31）＝約1年4か月／1678（延宝6）−1408＝270年／明実録 永楽6年12月17日＝1409-01-02＝死の約7か月後／1419−1408＝11年／1411−1408＝3年／1416−1408＝8年／1420−1408＝12年／1397→1408＝11年／五七日＝35日目／申＝15〜17時・酉＝17〜19時・戌＝19〜21時→最大6時間。
# 事実は事実カード（dev/output/rekishi-chiso/research/足利義満_facts_20261113_hand.yaml、yoshimitsu-01〜）にあるものだけ。行の上に `# fact: yoshimitsu-NN`。
#   使わないこと：足利治乱記だけにある記述（遺言で北山を義嗣へ・宝石と太刀の献上・毎日の見舞い）／座主＝青蓮院義円の推定／義持が北山第に移った日（6/26か6/7か未確認）／皇位簒奪説の賛否の数え方／義満の満年齢（誕生日は一次未見）／「金閣」呼称の初出。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
