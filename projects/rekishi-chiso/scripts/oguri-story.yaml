# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  横須賀の製鉄所を造らせた幕府の切れ者は、1868年、河原で首を斬られました。小栗家の届けには「少しの尋ねもなく」とあります。斬首を言い渡したのは、19歳と22歳の、新政府の使いでした。
  斬られた河原には、「偉人小栗上野介、罪なくして此所に斬らる」と刻まれた碑が立っています。罪がないのなら、なぜ斬られたのか。
  この動画でわかること
  ・新政府の命令書に書かれた「罪」と、3つの藩への「捕らえよ」という命令
  ・謝罪を退けた2人の若い使いと、記録ごとに違う「斬られた理由」
  ・取り調べはあったのか。藩の記録と小栗家の届けが正反対に書く、閏4月6日の朝
  ・首の行方、逃げた家族、碑が立つまでの64年
description_note: |-
  原典は、国立国会図書館デジタルコレクションの公開本（『復古記』・『戊辰戦史』・『高崎市史』1927年・『群馬県史』1927年・塚越芳太郎『読史余録』・蜷川新『維新前後の政争と小栗上野の死』ほか）で読みました。古い活字本の字は、画像で確かめています。
  19歳・22歳の年齢（数え年）と出身は、丑木幸男「小栗上野介忠順と会津」（高崎市立中央図書館『市史のひろば』第7号、2026年）によります。『高崎市史』（1927年）は2人を長州藩士と書いています。
  最期の言葉は、蜷川新の1928年・1931年の本が伝える話で、本ごとに違います。東郷平八郎の礼の言葉は、上毛新聞（2023年）などの記事によります。
  画面の風景・室内・人物の後ろ姿は、画像生成AIで作った想像上のイメージで、実在の写真ではありません。小栗忠順の肖像と、1860年の使節団の写真は、パブリックドメインの写真です（ウィキメディア・コモンズ）。
  サムネイルの人物像と兵の姿は、画像生成AIによる想像図です。

en:
  title: "Oguri Tadamasa: Why Was He Beheaded Without a Trial? The Cruel End of the Shogunate's Sharpest Mind"
  description: |-
    The shogunate official who launched the Yokosuka ironworks was beheaded on a riverbank in 1868. His family's report says he was killed "without a single question." The sentence was delivered by two envoys of the new government, aged 19 and 22.
    On that riverbank stands a stone: "The great Oguri Kozukenosuke was executed here without guilt." If he had no guilt, why was he killed?
    In this video you will learn:
    - What the new government's order said, and its instruction to three domains: arrest him
    - The two young envoys who rejected the apology, and the different reasons the records give
    - Whether there was any questioning: the domain records and the Oguri family's report say the opposite
    - Where his head went, how his family escaped, and the 64 years before the monument
    Japanese-language history video (Japanese audio).
  chapters:
    - "Sentenced by Envoys Aged 19 and 22"
    - "Who Was Oguri? 1860 to 1867"
    - "Why Did Yoshinobu Dismiss Him? January 1868"
    - "The Residence Called a Fortress: Gonda Village, March 1868"
    - "What Did the Order Say? April 1868"
    - "Why Was the Apology Rejected? Takasaki, 1868"
    - "The Morning on the Karasu River"
    - "Where Did His Head Go?"
    - "\"Executed Here Without Guilt\": 1912 to 1932"
    - "Summary: Why Was Oguri Killed?"

