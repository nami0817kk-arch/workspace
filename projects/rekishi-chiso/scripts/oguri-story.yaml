#   話の組み方は「謎解き型」：謎（序章）→ 人（第1章）→ 説を章ごとに（主戦論・金の噂・命令書・2人の使い）→ 最期の場面（第6章、約70%）→ 首と家族 → 碑 → まとめ。
#   創作の筋・想像の台詞は入れない（imagined なし）。記録の言葉は語りの中で出どころを言ってから引く。語りは剣崎1人。
#   残虐な場面の細部（太刀の数・首の切り口・塚本家の子の話）は入れない。大河の内容・キャストには触れない（入口の一言だけ）。
#   同じ日の12時は別担当の「徳川埋蔵金の謎」（scripts/maizo-story.yaml）。埋蔵金は入口と「金の噂」の数行だけ。採点はしない。
# 1本に1つの「なぜ」＝「幕府随一の切れ者は、なぜ取り調べもなく斬られたのか」。冒頭10秒＝斬首を言い渡したのは19歳と22歳の使いだった（oguri-62、丑木 2026 の本文で確認）。
# 記録の食い違いを柱にした所：①取り調べの有無（吉井藩の家記「糺問」／小栗仁右衛門の届け・高崎市史「尋ねなし」）②最期の言葉（蜷川 1928／1931）
#   ③首の行方（法輪寺・茂林寺・観音山・不明）。小さいもの：暴徒の人数・差し出した武器の数・2人の出身（長州藩士／土佐と丹波）・捕縛の日・家来の名・立札の文言。
# 事実は事実カード（dev/output/rekishi-chiso/research/小栗忠順_facts_20261105.yaml、oguri-01〜86）にあるものだけ。行の上に `# fact: oguri-NN`。
