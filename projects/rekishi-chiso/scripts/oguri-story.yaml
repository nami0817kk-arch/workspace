  # サムネは別に作る（out/oguri-story_thumbnail.png。全面1枚の肖像＋白と赤の文字。10-31 の型）。この欄は check のための仮。

sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 19歳と22歳の使いが言い渡した斬首　1868年 上州権田村
    background: {image: paintings/oguri_portrait.jpg, credit: "小栗忠順の肖像（撮影年不明、1868年以前。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-21, oguri-32
      - 語り: 横須賀の製鉄所を造らせた、幕府の切れ者は、1868年、河原で首を斬られました。家の者の届けには、少しの尋ねもなく、とあります。
        tone: 重い
      # fact: oguri-62, oguri-19
      - 語り: 斬首を言い渡したのは、《19歳と22歳》の、新政府の使いでした。
        tone: 重い
        card: {head: "新政府の使い", body: 19歳と22歳}
      # fact: oguri-73, oguri-60
      - 語り: 小栗忠順。小栗上野介とも呼ばれます。2027年の大河ドラマの主人公で、徳川の埋蔵金の伝説にも、名前が出てくる人です。
      # fact: oguri-52, oguri-67
      - 語り: 斬られたのは、今の群馬県高崎市倉渕町、烏川の河原です。そこには、こう刻まれた石碑が立っています。
      # fact: oguri-67
      - 語り: 偉人小栗上野介、罪なくして、此所に斬らる。
        tone: 重い
      # fact: oguri-67
      - 語り: 石碑が立ったのは1932年。斬首から、64年後のことでした。
        card: {head: "1932年", body: 斬首から64年後の碑}
      # fact: oguri-24
      - 語り: 罪がないのなら、なぜ斬られたのか。新政府の命令書には、罪が書かれています。陣屋を厳重に構え、砲台を築いた、と諸方から知らせがあり、探ったところ、逆謀、判然。
      # fact: oguri-24
      - 語り: ところが、その命令の言葉は、追捕。つまり、捕らえよ、でした。
      # fact: oguri-32
      - 語り: 一方、吉井藩の記録は、問いただしたところ罪を認めた、と書いているのです。
      # fact: oguri-41
      - 語り: 首がどこへ行ったのかも、今に至るまで、決まっていません。
      - 語り: 家の届けのとおり、取り調べもなく斬られたのなら、それは、なぜだったのか。
        tone: 疑問
      - 語り: その答えを探しに、斬首の8年前、1860年の、アメリカから、たどっていきます。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 小栗は何をした人だったのか
  - title: 「土蔵付きの売家」　小栗忠順は何をした人だったのか　1860年から1867年
    background: {image: paintings/oguri_embassy_navy_yard_nh51119.jpg, credit: "ワシントン海軍造船所の遣米使節団（1860年5月15日。米国海軍歴史センター NH 51119、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1860
    lines:
      # fact: oguri-84
      - 語り: 1860年、万延元年。小栗は、日米修好通商条約の批准のための使節団の一員として、アメリカの軍艦ポーハタン号で、海を渡りました。役は、使節団の目付、監察です。
        year: 1860
        card: {head: "1860年（万延元年）", body: 遣米使節の監察}
      # fact: oguri-85
      - 語り: ワシントンの海軍造船所で、使節団と造船所の士官たちが並んだ写真が、今もアメリカ海軍に残っています。1860年5月15日の日付です。
      # fact: oguri-07
      - 語り: 使節団は、ワシントンで、小判9枚などをアメリカの役人に渡し、フィラデルフィアで、金の分析をさせました。使節の1人、村垣範正の日記に、そうあります。
      # fact: oguri-07
      - 語り: 明治の本は、日本とアメリカの金と銀の量の比べに目を付けたのを、小栗の手柄として書きます。ただ、村垣の日記は、使節3人の仕事として書いていて、小栗ひとりの手柄とは書いていません。
      # fact: oguri-30
      - 語り: 帰国した小栗は、勘定奉行などを務めます。幕府のお金をあずかる役です。
      # fact: oguri-30
      - 語り: 1900年、福地源一郎は『幕末政治家』に、こう書きました。無駄な出費と、無駄な人を削ったために、小栗は、役人たちの恨みを集めた。
      # fact: oguri-30
      - 語り: 1918年に出た使節団の日記の本は、さらに踏み込みます。大奥から下の役人まで、みな小栗を恨んだ。のちに斬られたのも、務めに忠実だったからだ、と。
        card: {head: "1つ目の理由？", body: 削った出費の恨み}
      # fact: oguri-80
      - 語り: 西暦1865年の11月15日。横須賀で、製鉄所のくわ入れ式が行われました。計画を立てたのが小栗、技術を担ったのが、フランスのヴェルニーです。
        year: 1865
        card: {head: "1865年11月15日", body: 横須賀製鉄所のくわ入れ式}
      # fact: oguri-81
      - 語り: フランスからは、およそ130人の技師や職工、医師、教師が、横須賀の村にやって来ました。
      # fact: oguri-82, oguri-83
      - 語り: 1871年、第1号ドックが完成し、名前は横須賀造船所に変わります。のちの、横須賀海軍工廠です。
        year: 1871
      # fact: oguri-46
      - 語り: 福地は、小栗の、こんな言葉を書き残しています。たとえ徳川家が、幕府を他人に渡すことになっても、土蔵付きの売家なら、また快いではないか。
        tone: しみじみ
      - 語り: 幕府がなくなっても、造りかけたものは残る。そう語った男に、最後の年が来ます。
        tone: 疑問
        hook: true
      - 語り: 1868年の、正月です。
        hook: true

  # ================================================================ 第2章 主戦論と罷免
  - title: 「一たび懲らしめてから」　慶喜が退けた主戦論　1868年1月
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "フェリーチェ・ベアト撮影 江戸城の堀（1860年代。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-28
      - 語り: 1868年1月。鳥羽・伏見の戦いに敗れた徳川慶喜は、大坂から江戸へ戻りました。
        year: 1868
        portrait: {image: paintings/yoshinobu_portrait_1867_1.jpg, caption: "徳川慶喜（1867年ごろの写真）"}
      # fact: oguri-28
      - 語り: 江戸城で、小栗は、戦うことを説きます。1927年の『高崎市史』は、その言葉を、こう伝えます。一たび懲らしめて、そののちに恭順しても、まだ遅くはない。
        portrait: null
      # fact: oguri-28
      - 語り: 小栗は、兵を挙げるよう、しきりに勧めて止まなかった。慶喜は大いに怒り、自ら、その職を免じた、と。
        card: {head: "1868年1月", body: 慶喜が自ら職を免じる}
      # fact: oguri-28
      - 語り: 1901年、塚越芳太郎の『読史余録』は、別の面を書きます。小栗は、戦う側の頭だった。だから、降参する側からは、和平の邪魔をするに違いない、と、最も疑われた。
      # fact: oguri-28
      - 語り: 戦えと説いた男。その印は、江戸を離れても、ついて回りました。
        card: {head: "2つ目の理由？", body: 戦えと説いたこと}
      # fact: oguri-14
      - 語り: 2月28日、小栗は、家族を連れて江戸を発ちます。向かったのは、知行所、つまり自分の領地の、上州群馬郡、権田村です。
      # fact: oguri-14
      - 語り: 3月1日。権田村に着きました。今の、高崎市倉渕町です。
        card: {head: "1868年3月1日", body: 上州 権田村に着く}
      # fact: oguri-53
      - 語り: 仮の住まいは、村の寺、東善寺でした。
      - 語り: その村で、2か月もたたないうちに、小栗は、大罪人と呼ばれることになります。
        tone: 疑問
        hook: true
      - 語り: 始まりは、3月4日の朝でした。
        hook: true

  # ================================================================ 第3章 権田村の2か月
  - title: 「陣屋厳重に構え」と言われた屋敷　権田村の2か月　1868年3月
    background: {image: paintings/oguri_portrait.jpg, credit: "小栗忠順の肖像（撮影年不明、1868年以前。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-15
      - 語り: 3月4日の朝。博徒を頭にして、隣の村々の百姓も加わった大勢の人々が、権田村を取り囲み、火を放ちました。権田村の長老が持っていた覚書に、そうあります。
        card: {head: "1868年3月4日", body: 権田村が囲まれる}
      # fact: oguri-15
      - 語り: その数は、記録によって違います。6千あまり、7千あまり、そして、数千。
      # fact: oguri-15
      - 語り: 小栗と家来たちは、鉄砲と刀で、これを追い払いました。
      # fact: oguri-29
      - 語り: 1928年、小栗の伝記を書いた蜷川新は、この暴徒は、薩摩の側が放った浪人たちの、芝居ではなかったか、と疑いました。ただ、この暴徒と薩摩を直接むすぶ史料は、挙げていません。
      # fact: oguri-27
      - 語り: 重い荷物の噂も、ありました。江戸から運んだ荷は、幕府の金だと言われ、漬物の樽にまで、貨幣が詰まっている、と想像された。『読史余録』は、そう書きます。
      # fact: oguri-27
      - 語り: 同じ本は、荷の中身は弾薬で、小栗の死後の形見は、大判2枚だけだった、と続けます。
        card: {head: "重い荷の噂", body: 中身は弾薬}
      # fact: oguri-59
      - 語り: 群馬県立文書館の「風聞記」は、小栗が横浜で7万両ほどを私腹に入れた、と記します。丑木幸男さんは、これが埋蔵金の噂のもとだろう、と見ます。ただ、取り違えも混じる、不確かな噂の書き留めです。
      # fact: oguri-53
      - 語り: 騒ぎのあと、小栗は、近くの観音山に、田畑と水路を開き、屋敷の普請を始めました。
      # fact: oguri-53
      - 語り: 田を開き、水を引く。この村で、暮らしていくつもりだったのでしょう。
        tone: しみじみ
      # fact: oguri-53
      - 語り: その丘に建ちかけた家は、新政府の軍の命令書で、こう呼ばれることになります。陣屋、厳重に構え。
        tone: 重い
      # fact: oguri-53
      - 語り: 屋敷は、完成しませんでした。
      - 語り: 4月22日。1通の命令書が出ます。
        tone: 疑問
        hook: true
      - 語り: そこには、捕らえよ、のほかに、もう一言、書き添えられていました。
        hook: true

  # ================================================================ 第4章 命令書には何と書かれていたのか
  - title: 「追捕であって、殺害の命ではない」　命令書には何と書かれていたのか　1868年4月22日
    background: {image: paintings/yoshinobu_beato_samurai.jpg, credit: "フェリーチェ・ベアト撮影 武士たち（1860年代。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-16
      - 語り: 4月22日付で、東山道を進んできた新政府の軍の本営、東山道総督府は、高崎・安中・吉井の、3つの藩に、小栗を捕らえるよう命じました。
        card: {head: "1868年4月22日", body: 3つの藩に追捕を命じる}
      # fact: oguri-24
      - 語り: 明治政府が編んだ『復古記』に写された命令書には、こうあります。陣屋などを厳重に構え、その上、砲台を築き、容易ならぬ企てがあると、諸方から知らせがある。
      # fact: oguri-24
      - 語り: 深く探ったところ、逆謀は、はっきりした。万一、手に余れば、すぐ本陣に申し出よ。先鋒の隊で、一気に誅戮、つまり討ち取る。
        tone: 重い
      # fact: oguri-24
      - 語り: 1928年、蜷川新は、ここに目を止めます。3藩への命令は、追捕であって、殺害の命ではなかった。
      # fact: oguri-17
      - 語り: 4月29日、3藩の兵が出ました。
      # fact: oguri-36
      - 語り: 明治から昭和の本の多くは、出た藩の1つを、小幡藩と書いています。総督府の達しでは、吉井藩です。
      # fact: oguri-17, oguri-49
      - 語り: 閏4月1日。兵は東善寺で、小栗と会いました。小栗は、謀反の気持ちがない証しに、武器を差し出します。
      # fact: oguri-35
      - 語り: その数も、記録によって違います。大砲2門と小銃5挺。大砲と小銃を合わせて5挺。そして、大砲1門と、小銃20挺。
        figure: {type: stats, title: 差し出した武器　3つの書き方, items: [[吉井藩の家記, 大砲2門・小銃5挺, 復古記に写された記録], [権田村の覚書, 合わせて5挺, 大砲と小銃], [蜷川新（1928年）, 大砲1門・小銃20挺, 伝記の書き方]], upto: 3}
      # fact: oguri-17, oguri-49
      - 語り: 小栗は、総督府に詫びるため、養子の又一を、3藩に付き添わせて高崎へ出しました。3藩の兵は、引き揚げます。
        figure: null
      - 語り: 話は、ここで終わるはずでした。
        tone: 重い
      # fact: oguri-18
      - 語り: 閏4月3日、総督府から、2人の使いが、向かいます。
        tone: 疑問
        hook: true
      - 語り: 2人とも、まだ、若者でした。
        hook: true

  # ================================================================ 第5章 なぜ謝罪は退けられたのか
  - title: 19歳と22歳の使い　謝罪は、なぜ退けられたのか　1868年閏4月4日 高崎
    background: {image: paintings/yoshinobu_beato_samurai.jpg, credit: "フェリーチェ・ベアト撮影 武士たち（1860年代。パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-18
      - 語り: 総督府の日記によれば、閏4月3日、豊永貫一郎と原保太郎が、監察の使いとして、権田村の方へ向かいました。
        card: {head: "1868年閏4月3日", body: 2人の使いが出る}
      # fact: oguri-62
      - 語り: 2026年、高崎市立中央図書館の『市史のひろば』で、丑木幸男さんは、2人をこう書いています。豊永は土佐の出身で、19歳。原は丹波の園部の出身で、岩倉具視の側近、22歳。
        card: {head: "豊永 19歳・原 22歳", body: 丑木幸男 2026年}
      # fact: oguri-31
      - 語り: ところが、1927年の『高崎市史』は、2人とも長州藩士としています。使いの素性さえ、記録が食い違います。
      # fact: oguri-19
      - 語り: 閏4月4日、2人は高崎に着きました。3藩は、小栗の謝罪を、取り次ぎます。
      # fact: oguri-19
      - 語り: 答えは、吉井藩の記録に残っています。上野、つまり小栗は、逆謀、判然たり。父子ともに、速やかに召し捕れ。
        tone: 重い
      # fact: oguri-19, oguri-48
      - 語り: 高崎藩の記録には、もっと強い言葉があります。どのように恭順し、謝っても、天地の間に容れられない、大罪人だ。
        tone: 重い
      # fact: oguri-31
      - 語り: なぜ、そこまで言ったのか。『高崎市史』は、こう書きます。使いの豊永と原は、もとより小栗を憎んでいた。流れてきた噂を、よい機会とした。
        card: {head: "3つ目の理由？", body: 使いが憎んでいた}
      # fact: oguri-26
      - 語り: 総督府の側の、大音龍太郎の届けは、別の理由を挙げます。会津の松平容保らと通じていた。雷管の付いた鉄砲を、数十挺、土の中に隠していた。
      # fact: oguri-26
      - 語り: その届けは、即時、父子と家来6人を斬った、と書いています。家来の数は、記録によって違います。
      # fact: oguri-25
      - 語り: 総督府に加わった新田俊純の従軍の記録にも、似た知らせが写されています。要の地に砦を構え、大小の砲を多く持ち、浪人を召し抱えている。
      # fact: oguri-25, oguri-24, oguri-26
      - 語り: 新田の記録も、命令書も、諸方からの知らせ、つまり噂をもとにしていました。大音の届けは、そのうえで問いただし、罪がはっきりした、と書いています。
      # fact: oguri-29
      - 語り: 蜷川新は、さらに先を見ます。使いたちは、総督府の参謀、板垣退助らの命令を受け、初めから殺すつもりだった。ただし、板垣の指図は、伝え聞いた話として書かれたものです。
      # fact: oguri-58
      - 語り: 丑木さんは、別の見方をしています。権田村に移ってからも、小栗が軸になり、会津や越後と組んで、官軍と戦う道は、あり得た。処刑を急いだことで、その芽が摘まれた、と。
        card: {head: "4つ目の理由？", body: 会津と組む恐れ}
      # fact: oguri-31
      - 語り: 『高崎市史』は、高崎の藩主が、小栗を救おうと急いで戻ったけれど、間に合わず、大いに悔やんだ、とも書いています。
      - 語り: 恨み、戦えと説いたこと、使いの憎しみ、会津との結びつき。理由は、記録ごとに、違う顔を見せます。
        figure: {type: stats, title: 記録が挙げる「斬られた理由」, items: [[福地源一郎（1900年）, 出費を削った恨み, 幕末政治家], [塚越芳太郎（1901年）, 戦う側の頭, 読史余録], [高崎市史（1927年）, 使いが憎んでいた, 噂を機会に], [大音龍太郎の届け, 会津と通じた, 鉄砲を隠した]], upto: 4}
      # fact: oguri-20
      - 語り: 閏4月5日。兵は、ふたたび東善寺へ向かいます。
        figure: null
        tone: 疑問
        hook: true
      - 語り: その陰で、小栗は、家族を逃がそうとしていました。
        hook: true

  # ================================================================ 第6章 閏4月6日の朝（最期の場面）
  - title: 「婦女子には寛典を」　閏4月6日の朝、烏川の河原で何が起きたのか
    background: {image: paintings/oguri_portrait.jpg, credit: "小栗忠順の肖像（撮影年不明、1868年以前。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-10
      - 語り: 1927年の『群馬県史』によれば、小栗は、斬られる前の夜、年老いた母と、妻のみち子、又一の許婚の3人を、村の中島三左衛門に託して、逃がしました。
      # fact: oguri-10
      - 語り: 妻は、身ごもっていました。
        tone: しみじみ
      # fact: oguri-20
      - 語り: 閏4月5日、吉井藩の兵たちが東善寺に入り、小栗と家来3人を捕らえて、三ノ倉の本陣へ引き立てました。
        card: {head: "1868年閏4月5日", body: 東善寺で捕らえられる}
      # fact: oguri-21, oguri-52
      - 語り: 閏4月6日。今の暦で、5月27日。朝の四ツ半ごろ、昼の少し前です。小栗は、烏川の河原に、引き出されました。
        tone: 重い
        card: {head: "1868年閏4月6日", body: 今の暦で5月27日}
      # fact: oguri-32
      - 語り: 取り調べは、あったのか。ここで、記録が、真っ二つに分かれます。
        tone: 疑問
      # fact: oguri-32
      - 語り: 吉井・高崎・安中、3つの藩の記録は、どれも、問いただした、と書きます。吉井藩の記録では、3藩の隊長が立ち会い、小栗は罪を認めた、と。
      # fact: oguri-21
      - 語り: 一方、小栗家の親族、小栗仁右衛門が、閏4月12日に出した届けは、こうです。三之倉宿の河原で、少しの尋ねもなく、家来3人とともに、斬首。
      # fact: oguri-32
      - 語り: 1927年の『高崎市史』も、2人は、一つも尋ねずに斬った、と記します。
        figure: {type: stats, title: 取り調べはあったのか, items: [[吉井藩の家記, 問いただし、罪を認めた, 復古記に写された記録], [小栗仁右衛門の届け, 少しの尋ねもなく, 閏4月12日], [高崎市史（1927年）, 一つも尋ねず, 二人一モ訊問セズ]], upto: 3}
      # fact: oguri-37
      - 語り: 最期の言葉も、本ごとに違います。
        figure: null
      # fact: oguri-37
      - 語り: 蜷川新の1928年の本では、言い残すことを問われて、こう答えます。何事もない。ただ、母と妻は、すでに逃がした。この婦女子には、寛大な扱いを望む。
        tone: 重い
      # fact: oguri-37
      - 語り: 1931年の続きの本では、別の話です。首を斬りやすくしようとした者に、小栗は、無礼をするな、と一喝した。安中藩士の話を、さらに聞いて書いたものです。
      # fact: oguri-40
      - 語り: 立てられた札の言葉も、違います。藩の記録に写された札は、朝廷に対し、叛状明白。東善寺の記録では、大逆を企てた。
      # fact: oguri-48, oguri-50
      - 語り: 高崎藩の留守居役が、2週間後に藩へ出した報告書には、短く、こうあります。罪状明白につき、天誅を加える。
        tone: 重い
      # fact: oguri-22, oguri-63
      - 語り: 翌7日。高崎の牢に入れられていた又一も、家来とともに、斬られました。21歳でした。
        tone: 重い
        card: {head: "1868年閏4月7日", body: 養子の又一も}
      - 語り: 父と子は、2日のうちに、命を奪われました。
        tone: 重い
      - 語り: では、首は、どこへ行ったのか。
        tone: 疑問
        hook: true
      - 語り: その首が、今どこに眠っているのか。言い切れる人は、いません。
        hook: true

  # ================================================================ 第7章 首はどこへ行ったのか
  - title: 首はどこへ行ったのか　館林の首実検と、逃げた家族　1868年閏4月から6月
    background: {image: paintings/oguri_portrait.jpg, credit: "小栗忠順の肖像（撮影年不明、1868年以前。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1868
    lines:
      # fact: oguri-64
      - 語り: 高崎藩の報告によれば、父と子の首は、原保太郎が持ち帰り、家来の首は、さらされました。
      # fact: oguri-18
      - 語り: 総督府の日記は、閏4月10日、豊永と原が、小栗父子の首と武器を携えて戻った、と記します。
      # fact: oguri-41
      - 語り: 首は、館林にあった総督の本陣で、本人の首かを確かめる、首実検を受けました。
      # fact: oguri-41
      - 語り: その後の行方は、記録によって、分かれます。館林の法輪寺。同じ館林の茂林寺。権田村の観音山。
        figure: {type: stats, title: 小栗の首の行方, items: [[高崎市史（1927年）, 法輪寺に葬る, のちに領民が権田へ], [伝え, 館林の茂林寺, 蜷川新が書く説], [蜷川新（1928年）, 永遠に所在不明, 法輪寺とも茂林寺とも]], upto: 3}
      # fact: oguri-41
      - 語り: 『高崎市史』は、法輪寺に葬られた首を、のちに領民がひそかに掘り出し、権田へ戻した、と書きます。蜷川新は、その所在は、永遠に不明だ、と書きました。
      # fact: oguri-42
      - 語り: 体は、村の名主が貰い受け、東善寺の墓地に葬りました。
        figure: null
      # fact: oguri-42, oguri-70
      - 語り: 又一の体は、領地の村の人たちが貰い受けて葬り、墓を建てました。村では、小栗様と呼んで、供養を続けてきた、と高崎市は伝えています。
      # fact: oguri-44
      - 語り: 斬首から間もなく、総督府の側の大音龍太郎が、権田村の名主に、25両を渡しています。供養を頼む、弔いの金でした。
        card: {head: "弔いの金", body: 25両}
      # fact: oguri-23
      - 語り: 閏4月12日、総督府は、小栗の領地を取り上げ、彦根藩に管理させました。
      # fact: oguri-10
      - 語り: 逃げた家族は、越後を通って、会津へ入りました。
      # fact: oguri-10
      - 語り: 6月14日。妻のみち子は、女の子を産みます。のちの、国子です。
        tone: しみじみ
        card: {head: "1868年6月14日", body: 会津で娘が生まれる}
      # fact: oguri-10
      - 語り: 『群馬県史』は、のちに大隈重信の世話で、国子が婿を迎え、小栗の家が続いた、と伝えます。
      - 語り: けれど、小栗の名には、長く、反逆人の印が付いたままでした。
        tone: 疑問
        hook: true
      - 語り: 石碑が立つまで、64年かかります。
        hook: true

  # ================================================================ 第8章 碑が立つまでの64年
  - title: 「罪なくして此所に斬らる」　碑が立つまでの64年　1912年から1932年
    background: {image: paintings/oguri_yokosuka_stillfried_1872.png, credit: "ライムント・フォン・シュティルフリート撮影 横須賀造船所の明治天皇と一行（1872年1月1日。ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1912
    lines:
      # fact: oguri-72
      - 語り: 斬首から44年後の、1912年、明治45年の夏。東郷平八郎は、小栗の家族を、自宅に招きました。
        year: 1912
        card: {head: "1912年（明治45年）夏", body: 東郷平八郎が家族を招く}
      # fact: oguri-72
      - 語り: 上毛新聞の2023年の記事などによれば、東郷は、日本海海戦の勝利は、小栗が造った横須賀造船所のおかげだ、と礼を述べ、のちに、仁義礼智信の書を、小栗家に届けています。
      # fact: oguri-45
      - 語り: 蜷川新によれば、昭和の初めまで、小栗の反逆人の名は、公には解かれていませんでした。養子の貞雄は、皇后から下された200円で、罪の名は償われた、と受け止めた、といいます。
      # fact: oguri-45
      - 語り: 1927年10月10日、蜷川は、村の人たちと、墓の前に、2本の杉を植えました。
        year: 1927
      # fact: oguri-38
      - 語り: 1931年、蜷川は、こう書いています。小栗の斬首を命じた人は、今も生きている。けれど、私が問うても、事情を語らない。
        tone: 重い
        year: 1931
        card: {head: "1931年 蜷川新", body: 命じた人は語らない}
      # fact: oguri-67
      - 語り: 翌1932年。斬られた河原に、石碑が立ちました。上毛新聞によれば、建てたのは、当時の倉田村と、烏渕村の人たちです。
        year: 1932
      # fact: oguri-67
      - 語り: 刻まれた言葉は、偉人小栗上野介、罪なくして、此所に斬らる。
        tone: しみじみ
      # fact: oguri-69, oguri-68
      - 語り: 1953年、東善寺の墓は群馬県の史跡に。1982年には、終焉の地も史跡に指定され、今は高崎市の史跡です。
      # fact: oguri-79
      - 語り: 横須賀では、1952年、市役所前のセメントの像をもとに、小栗の胸像が鋳直されました。今は、製鉄所の跡を望むヴェルニー公園に立っています。
      # fact: oguri-78
      - 語り: 横須賀市は、ヴェルニーと小栗をしのぶ式典を開いています。2026年は、11月14日です。
      # fact: oguri-77
      - 語り: 2025年の上毛新聞は、敵と味方に分かれた家の子孫が、今は交流している、と伝えました。総督府の側だった豊永家の子孫も、その1人です。
      # fact: oguri-73
      - 語り: 2025年3月、NHKは、2027年の大河ドラマの主人公を、小栗とする、と発表しました。2027年は、小栗が生まれて、200年の年です。
      # fact: oguri-75, oguri-54
      - 語り: 東善寺の近くでは、記念館の建設が進んでいます。完成は2026年12月の予定で、斬首の直前まで小栗が乗っていた、と伝わる駕籠も、展示されると報じられました。
      - 語り: 最初の問いに、戻ります。
        hook: true
      - 語り: 小栗は、なぜ、取り調べもなく斬られたのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（冒頭の問いに戻る。余韻の一文）
  - title: まとめ：小栗忠順は、なぜ斬られたのか
    background: {image: paintings/oguri_portrait.jpg, credit: "小栗忠順の肖像（撮影年不明、1868年以前。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      # fact: oguri-24
      - 語り: 命令書が挙げた罪は、陣屋と砲台、そして逆謀でした。3藩への命令の言葉は、捕らえよ、でした。討ち取る、という言葉は、手に余ったときの話でした。
        tone: しみじみ
      # fact: oguri-19, oguri-62
      - 語り: 謝罪の取り次ぎを退け、大罪人と言い切ったのは、高崎に着いたばかりの、19歳と22歳の使いでした。
      # fact: oguri-16, oguri-21, oguri-19
      - 語り: 命令書の日付から、2週間たらず。使いが高崎に着いてからは、わずか2日でした。どう謝っても大罪人。そう決まっていたのなら、尋ねることに、意味は無かったのかもしれません。
        tone: 重い
      # fact: oguri-30, oguri-28, oguri-31, oguri-26
      - 語り: その理由として、記録が挙げるものは、ばらばらです。出費を削った恨み。戦えと説いたこと。使いの憎しみ。会津と通じたという疑い。どれも、決め手にはなっていません。
      # fact: oguri-32
      - 語り: 取り調べがあったのかも、3藩の記録と、小栗家の届けとで、正反対です。
      # fact: oguri-38
      - 語り: そして、斬首を命じた人は、のちに問われても、語りませんでした。
        tone: しみじみ
      # fact: oguri-66
