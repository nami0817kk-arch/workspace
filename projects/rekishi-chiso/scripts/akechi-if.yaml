en:
  title: "What If Akechi Mitsuhide Had Not Betrayed Nobunaga? | Japan After the Honnō-ji Incident"
  description: |-
    On the morning of June 2, 1582, about 13,000 of Akechi Mitsuhide's troops surrounded Honnō-ji, where Oda Nobunaga had only 20-30 pages with him. This video asks: what if Mitsuhide had not moved?
    We keep records, speculation and imagination apart. First, what the sources say: Nobunaga had decided on May 17 to go west himself, and was due to leave Kyoto on June 4. Then, what is known and unknown about Mitsuhide's motive, including the Shikoku theory. Finally, clearly marked imagination with reasons: the western campaign, Shikoku, the east, Nobunaga's heir Nobutada, the unfinished parts of his regime, and Mitsuhide himself.
    We never say "it would certainly have happened." Where historians disagree, we say so.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "June 2, 1582: The Morning at Honnō-ji and Three Promises"
    - "May 1582: Nobunaga's Plans and Days in Kyoto"
    - "Why Did Mitsuhide Move? What We Know"
    - "Imagination 1: If Mitsuhide Had Not Moved - The West"
    - "Imagination 2: Shikoku and Chōsokabe Motochika"
    - "Imagination 3: The East and the New Territories"
    - "Imagination 4: The Heir Nobutada and the Retainer System"
    - "Imagination 5: The Court, Hideyoshi and Ieyasu"
    - "Imagination 6: How Japan Might Have Changed - Compared With History"
    - "Conclusion: Could the Oda Have Unified Japan?"
    - "Imagination 7: Mitsuhide Himself"
    - "Summary: A Map of the Forks in the Road"
texture: true
recap: true

