# B（歴史の転換点の if ストーリー）の1本目。型：事実 → 史料に残る別の道 → 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/akechi_if_facts.md（確実／有力／説／未確認の区分もそこ）。既存：akechi_facts.md・nobunaga_facts*.md・hideyoshi_facts.md
# 決まり（ユーザー決定 10/14）：B は1日1本・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい（10-14 ユーザー「ミニ劇場・セリフを増やす」）。①「ここから想像」の札が出ている節だけ ②字幕に「（想像）」（roles の信長想像・光秀想像・秀吉想像・家康想像） ③記録のセリフと同じ節では混ぜない
# 想像の部分は言い切る（10-14 ユーザー「分からないとか曖昧な表現はやめる」）。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。事実の部分は今までどおり「分かっていません」と言う。
# 範囲は 運命表（誰がどうなる）→ 日本の変化点（史実との比較）→ 現代の日本（ほぼ妄想）まで。遠くなるほど札を落とす。
# 数字は「何の数か」を言う（現地の軍勢／集めた軍勢／供の人数）。足し合わせない。日付はユリウス暦のまま（6月2日＝本能寺の変）。
# 使わない話：燃える本能寺・最期の描写／光秀折檻の逸話を事実として／黒幕説を事実として／信長の大陸構想を事実として／信澄唆し説／検地の範囲・総石高・柴田勝家が変を知った日（未確認）。
title: もし明智光秀が裏切らなかったら｜本能寺の変のあと、日本はどうなったか
