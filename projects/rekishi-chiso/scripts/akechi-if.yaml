sections:

  # ---------------------------------------------------------------- 1 導入
  - title: 1582年6月2日 本能寺の朝と3つの問い
    background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《本能寺焼討之図》1893年"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 1582年6月2日の明け方、京都の本能寺にいた織田信長の供は、小姓衆の二、三十人。そのまわりを、通説で約1万3千の明智光秀の軍が囲みました。
        card: {head: 1582年6月2日, body: 本能寺の変}
        short: s1
      - 語り: この朝、信長は討たれ、息子の信忠も、同じ日に亡くなります。《本能寺の変》です。
        short: s1
      - 聞き: 二、三十人対、1万3千……。勝負にならないよね。
        tone: 驚き
        short: s1
      - 語り: もし、この朝、光秀が動かなかったら。日本は、どうなっていたのでしょうか。今日は、その先を、掘ります。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
        portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
        short: s1
      - 聞き: 歴史に「もしも」はない、ってよく聞くけど……ちゃんと掘れるの？
        tone: 疑問
        short: s1
      - 語り: 掘れます。しかも今日は、遠くまで行きます。問いは3つ。豊臣秀頼は、生まれたのか。江戸幕府は、できたのか。今の東京は、今の東京だったのか。
        card: {head: 今日の3つの問い, body: 秀頼は？ 幕府は？ 東京は？}
        short: s1
      - 聞き: え、本能寺の話なのに、東京まで行っちゃうの？
        tone: 驚き
      - 語り: 行きます。ただし、遠くへ行くほど、妄想に近づきます。だから、約束は3つ。事実と想像を分ける。想像のあいだは《ここから想像》の札を出す。想像には、可能性の高さを付ける。
        card: {head: この回の約束, body: 事実と想像を分け、可能性を付ける}
        background: {image: paintings/nobunaga_document_shuin_5articles.jpg, credit: "織田信長の五か条の書き付け（1570年、宛名に「明智十兵衛尉」）"}
      - 聞き: 札が出たら、あーしたちの妄想タイムってことね。で、可能性は？
      - 語り: 高い、ありうる、ほぼ妄想の、3段階です。札が出ている間は、言い切ります。そのかわり、確かさは、画面の札が正直に言います。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: 言い切るけど、確かさは札で見せる、か。それなら、安心して妄想できる。……でも、そもそも光秀が動いた理由が分からないと、動かなかった世界も、言いにくくない？
        tone: 疑問
      - 語り: そこも、ちゃんと見ます。では、5月の信長の予定から、掘りましょう。

  # ---------------------------------------------------------------- 2 信長の予定と京都の数日
  - title: 1582年5月 信長の予定と、京都の数日
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: まず、5月15日から17日まで。安土では、徳川家康の接待が開かれていました。『信長公記』では、光秀が、京と堺で珍しい品を調えさせ、3日間、接待を務めたことになっています。
        card: {head: 1582年5月15日〜17日, body: 安土で家康を接待。光秀も務める}
      - 聞き: 光秀が、接待役をクビになった、って話、聞いたことあるよ。腐った魚の。
      - 語り: その話は、『川角太閤記』など、後の本にしか出てきません。
      - 聞き: 後の本の話だったんだ。有名な話ほど、疑ってみないと、だめだね。
      - 語り: 5月17日、備中で毛利と向き合う羽柴秀吉から、急ぎの知らせが、安土の信長に届きます。毛利の大軍が、すぐ近くまで来た、と。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        card: {head: 1582年5月17日, body: 秀吉から急報。信長が出陣を決める}
        short: s3
      - 聞き: 秀吉が、ピンチってこと？
        tone: 疑問
        short: s3
      - 語り: 『信長公記』は、信長の決意を、こう書きます。今の言葉にすると、こうです。
        short: s3
      - 人物: 「毛利が間近に集まったのは、天の巡り合わせだ。自ら出陣して、中国の有力者たちを討ち果たし、九州まで一気に平らげよう」
        who: 信長
        short: s3
      - 聞き: 信長本人が行くつもりだったんだ。いつもは、家臣に任せてたのに。
        tone: 驚き
        short: s3
      - 語り: 先陣を命じられたのは、明智光秀たちです。『信長公記』は、光秀が「暇を下され」、つまり出陣の許しを受けて、坂本へ戻った、と書きます。
        background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
        card: {head: 1582年5月17日, body: 光秀に秀吉救援の先陣を命じる}
        short: s3
      - 聞き: 失脚してるわけじゃないんだ。ちゃんと、次の仕事をもらってる。
        short: s3
      - 語り: 同じころ、四国でも動きがありました。信長の三男、神戸信孝が、約1万4千の軍を集めて、5月11日、住吉に着陣します。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》四国征伐（後の1585年の戦いの絵）"}
      - 語り: 6月2日ごろの織田軍は、5つの方面に分かれて、散らばっていました。数の種類は、方面ごとに違います。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        figure: {type: bars, title: 6月2日ごろの織田軍（数の種類は目安）, bars: [[柴田勝家（北陸）, 48000], [羽柴秀吉（備中）, 30000], [滝川一益（関東）, 26200], [神戸信孝（四国の手前）, 14000], [明智光秀（丹波の亀山）, 13000]], labels: [約4万8千, 3万〜6万, 約2万6千, 約1万4千, 約1万3千]}
      - 聞き: 日本中に、散らばってたんだ。じゃあ、信長のそばには、誰がいたの？
        figure: null
      - 語り: そこへ、5月29日。信長は、安土から、小姓衆二、三十人だけを連れて、上洛します。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
        card: {head: 1582年5月29日, body: 信長が小姓衆二、三十人で上洛}
      - 語り: 『信長公記』は、陣の用意をして、知らせ次第出発せよ、と各隊に触れ、軍勢は連れなかった、と書きます。
      - 聞き: 軍を連れずに、京都へ？ なんで？
        tone: 疑問
      - 語り: 理由は、分かっていません。6月1日の茶会、朝廷との交渉など、説が並んでいます。
      - 語り: 6月1日、信長は、名物の茶道具を披露する茶会を開き、近衛前久ら、公家や僧侶、約40人を招いた、と伝わります。
        background: {image: paintings/akechi_honnoji_nobukazu_1896.jpg, credit: "楊斎延一《本能寺焼討之図》1896年"}
      - 語り: その夜、信長は、息子の信忠と酒を酌み交わし、囲碁の対局を見てから、眠りについた、と伝わります。信忠も、京の妙覚寺にいました。
      - 聞き: 信長も信忠も、少人数で京にいた。……ここだけ見ると、すごく、無防備だよね。
      - 語り: 出発の予定は、6月4日です。京を発ち、まず淡路で信孝の軍を見る予定だった、とも伝わります。中国への出陣は、早くても5日以降、とする見方もあります。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: じゃあ、6月2日は、出発の2日前。……ぎりぎりだったんだ。
        tone: 驚き
      - 語り: 予定の2日前に、光秀の軍は動きました。なぜ動いたのか。実は、本人が書いた史料は、ありません。
        hook: true
      - 聞き: 書いた史料がない……動機の謎の話、だね。
        hook: true

  # ---------------------------------------------------------------- 3 光秀はなぜ動いたのか
  - title: 光秀はなぜ動いたのか 分かっていること
    background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
    portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
    year: 1582
    lines:
      - 語り: 変の動機を、光秀本人が書いた史料は、ありません。研究者のあいだでも、定説は、ありません。
        short: s2
      - 聞き: 有名な事件なのに、分かってないんだ。
        tone: 驚き
        short: s2
      - 語り: 説は、たくさんあります。恨み、野望、朝廷や足利義昭が裏で動かした説。候補は、いくつもあるのに、どれにも決め手がありません。
        short: s2
      - 聞き: 決め手がない、って……あーし、ちょっとモヤモヤするかも。ほかの大事件なら、動機くらい分かってそうなのに。
        short: s2
      - 語り: 研究者の中には、これほど説が入り乱れた陰謀は、日本史でほかにない、と言う人もいます。
        short: s2
      - 語り: 確かさで、並べてみます。近年、有力と見られることが多い説の一つが、《四国説》です。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 1}
      - 聞き: 四国？ 信長の次の相手が、四国ってこと？
        tone: 疑問
      - 語り: 光秀は、四国の長宗我部元親と、信長のあいだを取り次ぐ役を務めていました。ところが信長は、元親に厳しい方針へ変えて、信孝の軍を送ろうとします。
        figure: {type: people, title: 四国をめぐる取次, nodes: [[織田信長, 方針を変えた], [明智光秀, 取次役], [長宗我部元親, 四国の大名], [神戸信孝, 渡海する軍]], edges: [[明智光秀, 長宗我部元親, 取次], [織田信長, 神戸信孝, 出兵を命じる]]}
      - 聞き: 紹介した相手が、急に攻められる。それは、面目、つぶれるかも。会社で言ったら、取引先を紹介したのに、急に契約を切られる感じでしょ？
      - 語り: 2014年に公表された石谷家文書に、5月21日付で、元親が、光秀の家老、斎藤利三に送った手紙があります。一部の城から退く、という、歩み寄りの内容です。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
        card: {head: 1582年5月21日, body: 元親が利三に歩み寄りの書状}
      - 語り: ただ、この手紙が信長に届いたのか、信長がどう受け止めたのかは、分かっていません。
      - 聞き: 直接の証拠、とまでは言えないんだね。手紙が届いてなかったら、光秀も、知らなかったかもしれないし。
      - 語り: そのとおりです。討伐を避けるために謀反した、とする史料はない、と慎重な研究者もいます。
        background: {image: paintings/akechi_atago_renga_ehon_taikoki.jpg, credit: "『絵本太閤記』光秀連歌の図（江戸後期の読み物の挿絵）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 2}
      - 語り: 恨みで討った、という説は、信長に屈辱を受けた、という逸話が中心ですが、多くが後世の本の話です。
      - 語り: 天下がほしかった、という野望説は、光秀の心の中に頼る説で、決め手になる史料がありません。
      - 聞き: 屈辱の話は、おもしろいけど、あとから作られた可能性が高い、ってことだね。
      - 語り: 朝廷や足利義昭が裏にいた、という黒幕説もあります。ただ、光秀とどう結びついたのか、裏づけの史料は、ほとんど見つかっていません。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 3}
      - 聞き: 結局、はっきり分かる答えは、ないんだ。
      - 語り: この状況のどこかが、少し違っていたら。それが、今日の「もしも」の入り口です。では、その入り口に、立ってみましょう。
        hook: true
      - 聞き: ここから、想像のターンだね。
        hook: true

  # ---------------------------------------------------------------- 4 想像① 西
  - title: 想像① 光秀が動かなかったら 西の毛利
    background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
    portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵、1601年ごろ）", age: false}
    year: 1582
    lines:
      - 語り: ここから先は、想像です。仮定は、ひとつだけ。1582年6月2日、光秀は動かず、亀山で、中国への出陣の準備を続けます。
        card: {head: ここから想像, body: 光秀は6月2日に動かない}
      - 聞き: 本能寺の朝は、何も起きずに終わる、ってことだね。
      - 語り: 信長は、予定どおり6月4日に京を発ちます。まず淡路で信孝の軍を見て、そのまま備中へ。想像劇場、第1幕。高松の陣です。
        background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
        card: {head: 想像劇場 第1幕, body: 備中高松の陣}
      - 人物: 「上様ご自身のお越し。これで毛利は、すっかり腰が引けましょう」
        who: 秀吉想像
      - 人物: 「猿、よう持たせた。毛利は、わしが踏みつぶす。そのまま九州まで、一気にゆく」
        who: 信長想像
      - 人物: 「先陣は、この光秀に、お任せくだされ」
        who: 光秀想像
      - 聞き: 光秀が、ちゃんと先頭に立ってる。……でも、秀吉の下で戦うんだよね。悔しくないのかな。
      - 語り: 悔しかったはずです。それでも先陣を務めます。光秀は、実際に出陣の準備を進めていました。5月26日には、坂本から亀山へ移っています。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
      - 語り: 戦いの数を並べます。毛利は3万5千から5万。秀吉は3万から6万。そこに、光秀の約1万3千と、池田たちの8千5百以上が加わります。
        background: {image: paintings/hidenaga_mori_terumoto.jpg, credit: "《毛利輝元像》江戸時代初め"}
        figure: {type: bars, title: 西の軍の数（数の種類は目安）, bars: [[毛利方の現地の軍勢, 50000], [秀吉の現地の軍勢, 30000], [光秀が亀山を出た兵, 13000], [池田・高山・中川（準備中）, 8500]], labels: [3万5千〜5万, 3万〜6万, 約1万3千, 8千5百以上]}
      - 聞き: 秀吉だけでも毛利と並ぶのに、そこに2万も。数では、織田が上になるんだ。
        tone: 驚き
        figure: null
      - 語り: 現実の秀吉は、6月3日の夜に変を知ると、毛利に隠して、翌4日に和睦しました。備中、美作、伯耆の3か国と、清水宗治の切腹です。
        background: {image: paintings/hideyoshi_takamatsu_news_yoshitoshi_1885.jpg, credit: "月岡芳年《教導立志基》信長の死を知る秀吉（1885年）"}
        card: {head: 1582年6月4日, body: 現実の秀吉が毛利と和睦（変を隠して）}
      - 語り: 毛利は、その前に、5か国の割譲を申し出ていました。信長本人が来れば、毛利はそれを飲んで、降伏します。中国地方は、半年のうちに、織田のものになります。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
        card: {head: 想像 ありうる, body: 毛利は半年で降りる}
      - 聞き: 社長本人が現場に来たら、交渉は一気に進むやつだ。
      - 語り: ただし、代わりに、畿内から信長がいなくなります。京の守りは、薄くなります。次は、同じころ動く、四国です。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        hook: true
      - 聞き: 信孝の軍だね。
        hook: true

  # ---------------------------------------------------------------- 5 想像② 四国
  - title: 想像② 1582年 四国と長宗我部元親
    background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
    portrait: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, caption: "長宗我部元親（後世の想像図）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。信孝の軍は、1万4千。6月2日に淡路へ、3日に四国へ、とする記述があります。日付は、資料によって割れています。
        card: {head: 史料に残る事実, body: 信孝の軍は渡海の準備を進めていた}
      - 聞き: 変がなければ、ほんとうに、渡ってたんだね。
      - 語り: 5月7日には、四国の国分案が伝わります。讃岐は信孝、阿波は三好康長。土佐と伊予は後日とされ、元親の名前は、案に入っていません。阿波には、康長が先に入っていました。
        background: {image: paintings/hideyoshi_shikoku_chikanobu_1883.jpg, credit: "楊洲周延《豊公四国征討図》1883年（後の1585年の戦いの絵）"}
      - 聞き: 国の分け方を、もう決めてたんだ。元親の分は、後回しなんだね。
      - 語り: ここから先は、想像です。信孝の軍は、海を渡ります。阿波にいた長宗我部方は約3千。織田は、数の上で、圧倒します。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》四国征伐（後の1585年の戦いの絵）"}
        card: {head: ここから想像, body: 光秀が動かず、信孝の軍が四国へ渡る}
      - 語り: 元親は、5月21日の書状で見せた歩み寄りよりも、さらに引きます。土佐一国を守って、織田に従います。
        card: {head: 想像 ありうる, body: 元親は土佐一国で降りる}
      - 聞き: 光秀、取次役だったのに、いちばん苦しい立場だね。
      - 語り: 想像劇場の、小さな場面です。光秀が、元親へ、使いを出す場面です。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
      - 人物: 「元親殿には、気の毒をした。だが、殿の命には、背けぬ」
        who: 光秀想像
      - 聞き: 上の命令を、飲み込む会社員みたい。でも、これは、あーしたちの想像だからね。
      - 語り: 史実では、元親が降るのは、1585年。秀吉の四国攻めのあとです。この世界では、3年早く、決着がつきます。
        background: {image: paintings/hideyoshi_shikoku_chikanobu_1883.jpg, credit: "楊洲周延《豊公四国征討図》1883年（後の1585年の戦いの絵）"}
      - 語り: 西と四国が片づけば、残るのは東です。信長の領地になったばかりの、遠い東国です。
        hook: true
      - 聞き: 東国って、何かあったの？
        hook: true

  # ---------------------------------------------------------------- 6 想像③ 東国
  - title: 想像③ 1582年 東国と新しい領地
    background: {image: paintings/nobunaga_katsuyori_portrait.jpg, credit: "《武田勝頼像》16世紀後半"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。1582年3月、武田氏が滅び、信長の領地は、一気に東へ広がりました。滝川一益は上野一国と信濃の2郡、河尻秀隆は甲斐、森長可は北信濃を、受け取ります。
        card: {head: 史料に残る事実, body: 武田氏が滅び、織田の領地が東へ広がる}
      - 聞き: 一気に広がった領地。守るのも、大変そう。
      - 語り: 変が起きたのは、それからわずか3か月後でした。
        short: s4
      - 語り: 変のあと、東国は、2週間余りで崩れました。6月7日、関東で、変が知られます。12日、北条が動員をかけます。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        figure: {type: stats, title: 変のあとの東国（現実）, items: [[6月7日, 関東で変が知られる], [6月12日, 北条が動員], [6月19日, 神流川で敗れる]]}
        short: s4
      - 語り: 18日、甲斐で一揆が起き、河尻が討たれます。19日、神流川で、織田の軍が北条に敗れます。
        short: s4
      - 聞き: 2週間ちょっとで、ほとんど崩れたんだ。領地が広がってから、まだ3か月なのに。支配が、固まる時間が、なかったんだね。
        tone: 驚き
        short: s4
      - 語り: 変から神流川の戦いまで、16日か17日です。東国の新しい領地は、それほど、もろい状態でした。
        short: s4
      - 語り: このとき、関東を任されていたのが、滝川一益です。一益は、7月1日に伊勢へ戻り、織田家の跡継ぎを決める会議にも、出られませんでした。
        background: {image: paintings/nobunaga_katsuyori_jimyoin_full.jpg, credit: "《武田勝頼像》（持明院蔵）"}
        figure: null
      - 聞き: では、信長が生きていたら、崩れなかったの？
        tone: 疑問
      - 語り: ここから先は、想像です。信長がいれば、あの2週間の崩れ方は、起きません。理由は2つ。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        card: {head: 想像 高い, body: 信長がいれば東国は崩れない}
      - 語り: 1つ目。敵だった上杉は、魚津城を助けに出していた軍を、引き上げようとしていました。東国で表立って敵対していたのは、上杉だけです。
      - 語り: 2つ目。北条は、3月から4月にかけて、馬や鷹、酒などを、立て続けに信長へ贈っていました。馬と鷹は返されましたが、贈り物を続けた北条は、信長と戦う道を選びません。
      - 聞き: 敵は弱ってたし、北条も、仲よくしようとしてたんだ。贈り物を返されたのは、ちょっと、気まずいけど。
      - 語り: 想像劇場、第2幕。関東の一益へ、信長から、手紙が届く場面です。
        background: {image: paintings/nobunaga_katsuyori_jimyoin_full.jpg, credit: "《武田勝頼像》（持明院蔵）"}
        card: {head: 想像劇場 第2幕, body: 関東の一益への信長の言葉}
      - 人物: 「一益、関東の国衆は、まだ心から従ってはおらぬ。急がず固めよ」
        who: 信長想像
      - 聞き: 領地が増えたばっかりの社長の言葉、って感じ。……東国は、信長の存在で、持つんだ。
      - 語り: 信長のもとで、東国は固まります。上杉が弱り、北条が従う。残る敵は、少なくなります。では、織田家の中は、誰がどうなるのか。運命表を作ります。
        background: {image: paintings/nobunaga_katsuyori_portrait.jpg, credit: "《武田勝頼像》16世紀後半"}
        hook: true
      - 聞き: 運命表！ 誰がどうなるか、いちばん気になる。
        hook: true

  # ---------------------------------------------------------------- 7 想像③ 人物の運命表
  - title: 想像④ 信長が生きていたら 1582年からの運命表
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
    portrait: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, caption: "織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）", age: false}
    year: 1582
    lines:
      - 語り: ここが、今日いちばんの見どころです。信長が生き続けたとき、あの人たちは、どうなるのか。人物の運命表を、作ります。
        card: {head: ここから想像, body: 人物の運命表}
      - 聞き: 運命表。史実との違いが、すぐ分かるやつだ。
      - 語り: 1人目は、織田信忠。信長の跡継ぎは、信忠のまま、揺らぎません。信忠は、変の7年前に家督と美濃、尾張を譲られ、甲州攻めでは、総大将を務めました。
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 1, note: もしもは想像。右の札は可能性の高さ}
        short: s5
      - 聞き: 変の7年前に、もう跡継ぎを決めてたんだ。
        background: {image: paintings/nobunaga_document_shuin_5articles.jpg, credit: "織田信長の五か条の書き付け（1570年、宛名に「明智十兵衛尉」）"}
        short: s5
      - 語り: 戦国史研究家の和田裕弘さんは、信忠が健在なら、秀吉の台頭はなかっただろう、と見ています。決まり、とまでは言っていません。
        card: {head: ここから想像・研究者の見立て, body: 信忠が健在なら秀吉は台頭しなかった}
        short: s5
      - 語り: 理由も挙げています。丹羽長秀や池田恒興が秀吉に付くとは考えにくく、柴田勝家ら北陸の将も、阻んだだろう、と。
        short: s5
      - 聞き: 信長が死んだから、秀吉に、チャンスが来たってことか。
        short: s5
      - 語り: ただし和田さんは、信忠を、買いかぶりすぎてはいけない、とも注意しています。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 語り: 2人目は、信長本人です。朝廷は、4月から5月、太政大臣、関白、将軍のどれかへの就任を打診しました。三職推任です。信長は、返事をしませんでした。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        card: {head: 史料に残る事実, body: 三職推任に返事は無かった}
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 2, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 返事がないから、研究者の読みも、割れてるんだよね。
      - 語り: 将軍を選べば、足利の後を継ぐことになります。関白を選べば、公家の頂点です。どちらも、信長らしくありません。信長は、太政大臣に就きます。
        card: {head: 想像 ありうる, body: 信長は太政大臣に就く}
      - 聞き: 将軍でも関白でもなく、太政大臣。ここも言い切るんだ。
      - 語り: 3人目と4人目は、秀吉と家康です。この世界では、信長が生きている間、二人とも、信長の下の大きな家臣のまま。想像劇場、第3幕。安土城の年賀の席です。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        card: {head: 想像劇場 第3幕, body: 安土城の年賀の席}
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 4, note: もしもは想像。右の札は可能性の高さ}
      - 人物: 「猿。そちには、西の果てまで、任せる」
        who: 信長想像
      - 人物: 「ははっ。上様の天下のためなら、どこへでも参りまする」
        who: 秀吉想像
      - 人物: 「家康。そちは、東をにらめ」
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
        who: 信長想像
      - 人物: 「承知つかまつった。それがしは、気長に、構えており申す」
        who: 家康想像
      - 聞き: 二人とも、素直に頭を下げてる。家康の「気長に」が、ちょっと含みありげなんだけど。
      - 語り: 含みがあるように聞こえるのは、史実を知っているからです。この世界の二人は、信長の世のあいだ、家臣のまま。天下人にはなりません。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        figure: null
      - 語り: 5人目は、柴田勝家です。史実の勝家は、1583年、賤ヶ岳で秀吉に敗れ、自害しました。この世界では、秀吉が台頭しないので、勝家は、北陸の将として、健在です。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
        card: {head: 想像 ありうる, body: 勝家は北陸で健在}
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 5, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 勝家、生き残るんだ。……で、光秀は、軍団長のまま、だね。これは、あとでゆっくり見よう。
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 6, note: もしもは想像。右の札は可能性の高さ}
      - 語り: そして、最後の1人。豊臣秀頼です。この運命表で、いちばん大きな変化は、ここに出ます。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        figure: {type: table, title: 人物の運命表（史実ともしも）, cols: [史実, もしも], rows: [[織田信忠, 変の日に死去, 跡を継ぐ, 高い], [織田信長, 変で死去, 太政大臣に, ありうる], [羽柴秀吉, 天下人に, 信長の家臣, 高い], [徳川家康, 幕府を開く, 織田の大名, 高い], [柴田勝家, 賤ヶ岳で敗死, 北陸で健在, ありうる], [明智光秀, 山崎で敗れる, 軍団長のまま, ありうる], [豊臣秀頼, 1593年に誕生, 生まれない, 高い]], upto: 7, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 秀頼が、生まれない？ 光秀が動かなかっただけで？ ……順番に聞くね。お市の方って、信長の妹だよね。勝家とは、いつ結婚したの？
        tone: 驚き
      - 語り: 変のあとの、1582年8月です。信長が生きていれば、この結婚は、ありません。
        card: {head: 史料に残る事実, body: お市は1582年8月に勝家と再婚}
        figure: null
      - 聞き: お市の娘が、茶々だよね。勝家が敗れたあと、秀吉のところへ行って……のちに秀吉の側室になって、1593年に秀頼を産んだ。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 語り: 勝家が敗れず、お市が嫁がなければ、この道は、消えます。秀頼は、史実の形では、生まれません。
        card: {head: 想像 高い, body: 史実の秀頼は生まれない}
      - 聞き: 本能寺の朝ひとつで、大坂城の秀頼まで、消えるんだ。……鳥肌立った。
        tone: 驚き
      - 語り: 秀頼が生まれなければ、大坂の陣の主役も、いません。では、そこから先の、日本の仕組みは、どう変わるのか。比べます。
        hook: true
      - 聞き: 史実と、並べて見たい。
        hook: true

  # ---------------------------------------------------------------- 8 想像④ 日本の変化点
  - title: 想像⑤ 日本の変化点 もしもの年表と史実の比較
    background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
    portrait: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, caption: "織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）", age: false}
    year: 1582
    lines:
      - 語り: ここまでの分かれ道を、年表にします。もしもの年表です。1582年、毛利が降る。1583年、九州へ。1584年、西日本が織田のものに。1587年、東北まで届いて、統一です。
        card: {head: ここから想像, body: もしもの年表 統一は1587年}
        figure: {type: numberline, title: 天下統一の年, items: [[史実（秀吉）, 1590], [もしも（信長）, 1587], [もしも（西日本が終わる）, 1584]], unit: 年, focus: もしも（信長）, note: もしもは想像（ありうる）}
      - 聞き: 秀吉が1590年。信長なら、3年早いんだ。
      - 語り: 理由は、信長本人が先頭に立つこと。毛利、四国、東国での織田の数の差。そして上杉の弱りです。秀吉は、引き継いで8年かかりました。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
      - 語り: では、日本の仕組みは、どう変わるのか。史実と、並べます。
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1587年 信長, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [朝鮮出兵, 1592年から, 起きない, ほぼ妄想]], upto: 1, note: もしもは想像。右の札は可能性の高さ}
      - 語り: 1つ目は、幕府です。史実の江戸幕府は、1603年。秀吉の死と関ヶ原のあとに、できました。この世界の家康は、織田政権の大名のままなので、江戸幕府は、できません。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        card: {head: 想像 ありうる, body: 江戸幕府はできない}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1587年 信長, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [朝鮮出兵, 1592年から, 起きない, ほぼ妄想]], upto: 2, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 江戸幕府が、ない。……教科書の、江戸時代の章が、まるごと消えるってこと？
        tone: 驚き
      - 語り: 2つ目は、キリスト教です。信長は、1569年に、京都での布教の許可状を、宣教師のフロイスに与えています。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
      - 語り: 史実では、秀吉が、1587年の九州平定のあとに、バテレン追放令を出しました。信長が生きていれば、この追放令は出ません。信長の保護は、続きます。
        card: {head: 想像 ありうる, body: 追放令は出ず保護が続く}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1587年 信長, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [朝鮮出兵, 1592年から, 起きない, ほぼ妄想]], upto: 3, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 信長って、新しいもの好きなイメージあるけど、それが理由なんだね。
      - 語り: 研究者の渡邊大門さんは、保護の理由を、こう考えています。当時は、特定の宗教を排撃するのは良くない、という空気があったこと。南蛮貿易の利益も、理由の一つです。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
      - 語り: 3つ目は、朝鮮出兵です。史実では、秀吉が、1592年から、朝鮮へ軍を送りました。この戦争は、秀吉が起こしたものです。秀吉が天下人にならない世界では、起きません。
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
        card: {head: 想像 ほぼ妄想, body: 朝鮮出兵は起きない}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1587年 信長, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [朝鮮出兵, 1592年から, 起きない, ほぼ妄想]], upto: 4, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 「ほぼ妄想」の札が付いてるのは、信長が別の戦争を起こすかもしれないからだね。
      - 語り: そのとおりです。信長にも、大陸への構想があった、と宣教師が書いていますが、日本側の史料に裏づけはありません。だから、この札です。
        figure: null
      - 語り: 以上が、日本の変化点です。では、ここから先。現代の日本にまで、鎖をつないでみます。
        hook: true
      - 聞き: 現代！ 東京が、東京じゃなくなるやつだ。
        hook: true

  # ---------------------------------------------------------------- 9 想像⑤ 現代の日本
  - title: 想像⑥ 現代の日本 信長が統一した1587年の先
    background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: ここから先は、いちばん遠い想像です。信長が統一した世界の、現代の日本を見ます。全部、ほぼ妄想の札つきです。それでも、鎖は一本ずつ、理由でつないでいきます。
        card: {head: ここから想像 ほぼ妄想, body: 信長が統一した世界の現代日本}
      - 聞き: ほぼ妄想、きた。でも、聞きたい！
      - 語り: 最初の鎖は、鎖国です。史実の鎖国は、江戸幕府が、キリスト教の禁止と貿易の管理を進めて、1630年代に整えたものです。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        figure: {type: table, title: 現代日本への鎖（史実ともしも）, cols: [史実, もしも], rows: [[鎖国, 1630年代に整う, 起きない, ありうる], [幕末, 黒船で開国, 起きない, ほぼ妄想], [首都, 江戸から東京へ, 畿内が中心, ほぼ妄想], [食べ物, 肉食は明治から, 早く広がる, ほぼ妄想]], upto: 1, note: すべて想像。右の札は可能性の高さ}
      - 語り: 幕府がなく、信長がキリスト教を保護し、南蛮貿易を続ける世界では、鎖国は、起きません。海は、開いたままです。
        card: {head: 想像 ありうる, body: 鎖国は起きない}
      - 聞き: 海が開いたまま。それだけで、国の形が、全然違う。……鎖国が起きないなら、幕末も変わるよね。ペリーの黒船って、1853年だっけ。
      - 語り: そのとおりです。鎖国をしていた日本に、黒船が来て、開国を迫りました。海を閉じていないなら、このショックは、起きません。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        card: {head: 想像 ほぼ妄想, body: 黒船の衝撃は起きない}
        figure: {type: table, title: 現代日本への鎖（史実ともしも）, cols: [史実, もしも], rows: [[鎖国, 1630年代に整う, 起きない, ありうる], [幕末, 黒船で開国, 起きない, ほぼ妄想], [首都, 江戸から東京へ, 畿内が中心, ほぼ妄想], [食べ物, 肉食は明治から, 早く広がる, ほぼ妄想]], upto: 2, note: すべて想像。右の札は可能性の高さ}
      - 聞き: 黒船が、ない。じゃあ、明治維新も、教科書のとおりには、ならないんだ。
      - 語り: 倒すべき幕府がありません。維新は、別の形になるか、起きません。
      - 聞き: 明治維新も、教科書どおりには、ならない。じゃあ、首都はどうなるの？
      - 語り: 次の鎖は、首都です。江戸は、家康の領地になってから、開発が進んだ町です。家康が織田の大名のままなら、江戸は、今ほど大きな町には、なりません。政権の中心は、畿内にあります。
        background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
        card: {head: 想像 ほぼ妄想, body: 東京は今の東京にならない}
        figure: {type: table, title: 現代日本への鎖（史実ともしも）, cols: [史実, もしも], rows: [[鎖国, 1630年代に整う, 起きない, ありうる], [幕末, 黒船で開国, 起きない, ほぼ妄想], [首都, 江戸から東京へ, 畿内が中心, ほぼ妄想], [食べ物, 肉食は明治から, 早く広がる, ほぼ妄想]], upto: 3, note: すべて想像。右の札は可能性の高さ}
      - 聞き: 今の東京は、江戸幕府があったから、あの大きさなんだ。……大阪のほうが、東京より大きい国。ありえそう。
      - 語り: 最後の鎖は、食べ物です。南蛮の船が、堺に着き続ける世界。そこでは、パンやカステラ、ワインが、早くから暮らしに広がります。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        card: {head: 想像 ほぼ妄想, body: 南蛮の食べ物が早く広がる}
        figure: {type: table, title: 現代日本への鎖（史実ともしも）, cols: [史実, もしも], rows: [[鎖国, 1630年代に整う, 起きない, ありうる], [幕末, 黒船で開国, 起きない, ほぼ妄想], [首都, 江戸から東京へ, 畿内が中心, ほぼ妄想], [食べ物, 肉食は明治から, 早く広がる, ほぼ妄想]], upto: 4, note: すべて想像。右の札は可能性の高さ}
      - 聞き: お寿司の隣に、ワインとパンが並んでるのか。それ、ちょっと見てみたい。
      - 語り: 想像劇場、最後の場面です。堺の港で、南蛮船を迎える信長です。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        card: {head: 想像劇場 第4幕, body: 堺の港の信長}
        figure: null
      - 人物: 「海の向こうから、船が来る限り、この国の扉は、閉ざさぬ」
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        who: 信長想像
      - 聞き: 扉を閉めない国、か。……全部ほぼ妄想だけど、鎖が一本ずつつながってるから、変に納得しちゃう。
      - 語り: ただ、ここまでが、動かなかった光秀から始まる、鎖です。では、この世界の織田は、統一できたのか。結論を、言います。
        figure: null
        hook: true
      - 聞き: 結局、織田は、統一できたの？
        hook: true

  # ---------------------------------------------------------------- 10 結論と光秀自身
  - title: 結論 織田は統一できたのか 動かなかった光秀のその後
    background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 結論です。織田は、統一できたのか。答えは、できた。時期は、時間の長さごとに、言います。
        card: {head: ここから想像, body: 織田は統一できたのか}
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 西日本まで, 高い], [5年ほど, 統一に届く, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 1}
      - 聞き: 時間の長さで、分けるんだね。
      - 語り: 2年のあいだに、終わるのは、西日本までです。統一には、足りません。毛利、四国が片づいても、東国と、東北が残るからです。
      - 語り: 5年ほどで、統一に届きます。理由は、信長本人の出陣、数の差、上杉の弱り、北条との協調。この4つです。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 西日本まで, 高い], [5年ほど, 統一に届く, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 2}
      - 語り: ただし、東国がこじれれば、史実と同じ、1590年ごろ。分かれ道は、上杉と北条の動きになります。
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 西日本まで, 高い], [5年ほど, 統一に届く, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 3}
      - 聞き: 統一はできる。時期は、5年から8年の幅。国の形が変わるのが、いちばん大きいんだね。
        figure: null
      - 語り: 最後に、動かなかった光秀自身です。光秀は、丹波と、近江の坂本を合わせた、約34万石の軍団長のまま。信長の家臣団の中で、重臣の一人です。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
        card: {head: ここから想像, body: 動かなかった光秀のその後}
      - 語り: 光秀は、年齢が分かりません。生まれた年は、1513年から1540年以降まで、幅があります。変の年に、数えで43歳前後から70歳です。
      - 聞き: 43歳なら現役ばりばり。70歳なら、そろそろ引退の年だよね。
      - 語り: 嫡男は光慶です。谷口克広さんは、光秀が67歳なら、光慶はまだ10代前半、と見ています。光秀は、息子のために、長く働く道を選びます。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
        card: {head: 想像 ありうる, body: 光秀は息子のため長く働く}
      - 人物: 「光慶が一人前になるまでは、まだ退けぬ」
        who: 光秀想像
      - 聞き: 動いた光秀は、息子のために踏み切ったかもしれなくて、動かなかった光秀も、息子のために働く。どっちも、親なんだね。
      - 語り: 皮肉なことに、動かなかった光秀は、日本史で、いまほど有名になりません。教科書では、数行の重臣です。変を起こしたから、光秀は、日本史の主役になったのです。
        background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
        card: {head: 想像 ありうる, body: 光秀の知名度は今より低い}
      - 聞き: 動かなかったら、名前が残らない。それって、すごく、皮肉。
        tone: しみじみ
      - 語り: では、ここまでを、まとめます。何が言えて、何が言えなかったのか。
        hook: true
      - 聞き: 言えたことと、言えなかったこと。整理したいな。
        hook: true

  # ---------------------------------------------------------------- 11 まとめ
  - title: まとめ：1582年 分かれ道の地図
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
    year: 1582
    lines:
      - 語り: 冒頭の3つの問いに、答えます。豊臣秀頼は、生まれたのか。江戸幕府は、できたのか。今の東京は、今の東京だったのか。
        figure: {type: stats, title: 3つの問いの答え（想像）, items: [[秀頼は？, 生まれない, 高い], [江戸幕府は？, できない, ありうる], [今の東京は？, ならない, ほぼ妄想]], upto: 1}
      - 聞き: 秀頼は生まれない、幕府もできない、東京も今の東京じゃない。全部、あの数日が、出発点なんだ。
      - 語り: 札の高さも、思い出してください。秀頼は、高い。幕府は、ありうる。東京は、ほぼ妄想。遠くなるほど、札の色が薄くなります。
        figure: {type: stats, title: 3つの問いの答え（想像）, items: [[秀頼は？, 生まれない, 高い], [江戸幕府は？, できない, ありうる], [今の東京は？, ならない, ほぼ妄想]], upto: 3}
      - 聞き: 近いところほど、しっかりしてて、遠くなるほど、妄想になる。だから、札で見せるんだね。
        background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《本能寺焼討之図》1893年"}
      - 語り: そして、変わらないものも、あります。信長の存命中、秀吉も家康も、家臣のままだったこと。それは、史料に残る、織田政権の姿から言えることです。
        figure: null
      - 語り: 最後に、誰にも分からないことも、あります。光秀が、なぜ動いたのか。本人が書いた史料は、ありません。それが分からないので、動かなかった世界も、想像のままです。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
      - 聞き: 動いた光秀も、動かなかった光秀も、本人の気持ちは、謎のまま。……あーしは、そこが、いちばん気になるかな。
        tone: しみじみ
      - 語り: 分かれ道を一つ挙げるなら、5月29日から6月4日。信長が小姓衆だけで、京にいた、この数日でした。
        background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《本能寺焼討之図》1893年"}
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 「もしも」の意味って、答えを当てることじゃなくて、どこが分かれ道だったか、を見つけること、って覚えとく。次の「もしも」は、誰の、どの分かれ道かな。
        tone: 疑問
      - 語り: あなたが気になる、歴史の分かれ道を、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
