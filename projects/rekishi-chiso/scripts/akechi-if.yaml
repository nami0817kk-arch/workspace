en:
  title: "What If Akechi Mitsuhide Had Not Betrayed Nobunaga? | Japan After the Honnō-ji Incident"
  description: |-
    On the morning of June 2, 1582, about 13,000 of Akechi Mitsuhide's troops surrounded Honnō-ji, where Oda Nobunaga had only 20-30 pages with him. This video asks: what if Mitsuhide had not moved?
    We keep records, speculation and imagination apart. First, what the sources say: Nobunaga had decided on May 17 to go west himself, and was due to leave Kyoto on June 4. Then, what is known and unknown about Mitsuhide's motive, including the Shikoku theory. Finally, clearly marked imagination with reasons: the western campaign, Shikoku, the east, a table of what becomes of Nobutada, Hideyoshi, Ieyasu, Katsuie and Hideyori, how Japan would differ, and even modern Japan.
    In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. Where historians disagree, we say so.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "June 2, 1582: The Morning at Honnō-ji and Three Questions"
    - "May 1582: Nobunaga's Plans and Days in Kyoto"
    - "Why Did Mitsuhide Move? What We Know"
    - "Imagination 1: The West and Mōri"
    - "Imagination 2: Shikoku and Chōsokabe Motochika"
    - "Imagination 3: The East and the New Territories"
    - "Imagination 4: A Table of Fates - Who Becomes What?"
    - "Imagination 5: How Japan Changes, Compared With History"
    - "Imagination 6: Modern Japan - No Shogunate, No Isolation"
    - "Conclusion: Could the Oda Have Unified Japan? And Mitsuhide"
    - "Summary: A Map of the Forks in the Road"
texture: true
recap: true

