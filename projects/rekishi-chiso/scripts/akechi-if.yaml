sections:
  # ---------------------------------------------------------------- 1 導入
  - title: 1582年6月2日 本能寺の朝と3つの約束
    background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《本能寺焼討之図》1893年"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 1582年6月2日の明け方、京都の本能寺にいた織田信長の供は、小姓衆の二、三十人。そのまわりを、通説で約1万3千の明智光秀の軍が囲みました。
        card: {head: 1582年6月2日, body: 本能寺の変}
        short: s1
      - 語り: この朝、信長は討たれ、息子の信忠も、同じ日に亡くなります。《本能寺の変》です。
        short: s1
      - 聞き: 二、三十人対、1万3千……。勝負にならないよね。
        tone: 驚き
        short: s1
      - 語り: もし、この朝、光秀が動かなかったら。日本は、どうなっていたのでしょうか。今日は、その「もしも」を掘ります。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
        portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
        short: s1
      - 聞き: 歴史に「もしも」はない、ってよく聞くけど……ちゃんと答えは出るの？
        tone: 疑問
        short: s1
      - 語り: 答えは、出ません。出せるのは、分かれ道の地図です。ここは変わりそう。ここは変わらなそう。ここは誰にも分からない。この3つに分けて掘ります。
        short: s1
      - 聞き: 答えを当てる動画じゃなくて、地図を作る動画、ってことだね。
      - 語り: 約束は、3つです。1つ、事実と想像を分けます。2つ、想像のあいだは、《ここから想像》の札を出します。3つ、想像には、必ず理由と、可能性の高さをつけます。
        card: {head: この回の約束, body: 事実と想像を分け、理由と可能性を付ける}
        background: {image: paintings/nobunaga_document_shuin_5articles.jpg, credit: "織田信長の五か条の書き付け（1570年、宛名に「明智十兵衛尉」）"}
      - 聞き: 札が出たら、あーしたちが想像してる時間、理由つきで。ちゃんと線を引いて掘るんだね。
      - 語り: 話す範囲は、分かれ道ごとに、数年から十数年先までです。先へ行くほど、妄想に近づきます。だから、可能性の高さを、高い、ありうる、ほぼ妄想の、3段階で、画面に出します。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: けっこう先まで飛ぶんだね。でも、3段階の札があれば、どこまで根拠があるか、分かりやすいか。……そもそも、光秀が動いた理由が分からなかったら、動かなかった世界も、言いにくくない？
        tone: 疑問
      - 語り: そこも、ちゃんと見ます。では、信長の予定から、掘りましょう。

  # ---------------------------------------------------------------- 2 信長の予定と京都の数日
  - title: 1582年5月 信長の予定と、京都の数日
    background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: まず、5月15日から17日まで。安土では、徳川家康の接待が開かれていました。『信長公記』では、光秀が、京と堺で珍しい品を調えさせ、3日間、接待を務めたことになっています。
        card: {head: 1582年5月15日〜17日, body: 安土で家康を接待。光秀も務める}
      - 聞き: 光秀が、接待役をクビになった、って話、聞いたことあるよ。腐った魚の。
      - 語り: その話は、『川角太閤記』など、後の本にしか出てきません。
      - 聞き: 後の本の話だったんだ。有名な話ほど、疑ってみないと、だめだね。
      - 語り: 5月17日、備中で毛利と向き合う羽柴秀吉から、急ぎの知らせが、安土の信長に届きます。毛利の大軍が、すぐ近くまで来た、と。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        card: {head: 1582年5月17日, body: 秀吉から急報。信長が出陣を決める}
        short: s3
      - 聞き: 秀吉が、ピンチってこと？
        tone: 疑問
        short: s3
      - 語り: 『信長公記』は、信長の決意を、こう書きます。今の言葉にすると、こうです。
        short: s3
      - 人物: 「毛利が間近に集まったのは、天の巡り合わせだ。自ら出陣して、中国の有力者たちを討ち果たし、九州まで一気に平らげよう」
        who: 信長
        short: s3
      - 聞き: 信長本人が行くつもりだったんだ。いつもは、家臣に任せてたのに。
        tone: 驚き
        short: s3
      - 語り: 先陣を命じられたのは、明智光秀たちです。『信長公記』は、光秀が「暇を下され」、つまり出陣の許しを受けて、坂本へ戻った、と書きます。
        background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
        card: {head: 1582年5月17日, body: 光秀に秀吉救援の先陣を命じる}
        short: s3
      - 聞き: 失脚してるわけじゃないんだ。ちゃんと、次の仕事をもらってる。
        short: s3
      - 語り: 一緒に先陣を命じられたのは、池田恒興など、畿内の大名たちです。
      - 語り: 同じころ、四国でも動きがありました。信長の三男、神戸信孝が、約1万4千の軍を集めて、5月11日、住吉に着陣します。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》四国征伐（後の1585年の戦いの絵）"}
      - 聞き: 毛利と、四国と、同時進行……。軍は、足りるのかな。
      - 語り: 6月2日ごろの織田軍は、5つの方面に分かれて、散らばっていました。数の種類は、方面ごとに違います。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
        figure: {type: bars, title: 6月2日ごろの織田軍（数の種類は目安）, bars: [[柴田勝家（北陸）, 48000], [羽柴秀吉（備中）, 30000], [滝川一益（関東）, 26200], [神戸信孝（四国の手前）, 14000], [明智光秀（丹波の亀山）, 13000]], labels: [約4万8千, 3万〜6万, 約2万6千, 約1万4千, 約1万3千]}
      - 聞き: 日本中に、散らばってたんだ。じゃあ、信長のそばには、誰がいたの？
        figure: null
      - 語り: そこへ、5月29日。信長は、安土から、小姓衆二、三十人だけを連れて、上洛します。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
        card: {head: 1582年5月29日, body: 信長が小姓衆二、三十人で上洛}
      - 語り: 『信長公記』は、陣の用意をして、知らせ次第出発せよ、と各隊に触れ、軍勢は連れなかった、と書きます。
      - 聞き: 軍を連れずに、京都へ？ なんで？
        tone: 疑問
      - 語り: 理由は、分かっていません。6月1日の茶会、朝廷との交渉など、説が並んでいます。
      - 語り: 6月1日、信長は、名物の茶道具を披露する茶会を開き、近衛前久ら、公家や僧侶、約40人を招いた、と伝わります。
        background: {image: paintings/akechi_honnoji_nobukazu_1896.jpg, credit: "楊斎延一《本能寺焼討之図》1896年"}
      - 聞き: 40人もお客さんがいたのに、守りの兵は、ほとんどいなかった、ってこと？
        tone: 疑問
      - 語り: その夜、信長は、息子の信忠と酒を酌み交わし、囲碁の対局を見てから、眠りについた、と伝わります。信忠も、京の妙覚寺にいました。
      - 聞き: 信長も信忠も、少人数で京にいた。……ここだけ見ると、すごく、無防備だよね。
      - 語り: 出発の予定は、6月4日です。京を発ち、まず淡路で信孝の軍を見る予定だった、とも伝わります。中国への出陣は、早くても5日以降、とする見方もあります。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: じゃあ、6月2日は、出発の2日前。……ぎりぎりだったんだ。
        tone: 驚き
      - 語り: 予定の2日前に、光秀の軍は動きました。なぜ動いたのか。実は、本人が書いた史料は、ありません。
        hook: true
      - 聞き: 書いた史料がない……動機の謎の話、だね。
        hook: true

  # ---------------------------------------------------------------- 3 光秀はなぜ動いたのか
  - title: 光秀はなぜ動いたのか 分かっていること
    background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
    portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
    year: 1582
    lines:
      - 語り: 変の動機を、光秀本人が書いた史料は、ありません。研究者のあいだでも、定説は、ありません。
        short: s2
      - 聞き: 有名な事件なのに、分かってないんだ。
        tone: 驚き
        short: s2
      - 語り: 説は、たくさんあります。恨み、野望、朝廷や足利義昭が裏で動かした説。候補は、いくつもあるのに、どれにも決め手がありません。
        short: s2
      - 聞き: 決め手がない、って……あーし、ちょっとモヤモヤするかも。ほかの大事件なら、動機くらい分かってそうなのに。
        short: s2
      - 語り: 研究者の中には、これほど説が入り乱れた陰謀は、日本史でほかにない、と言う人もいます。
        short: s2
      - 語り: 確かさで、並べてみます。近年、有力と見られることが多い説の一つが、《四国説》です。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 1}
      - 聞き: 四国？ 信長の次の相手が、四国ってこと？
        tone: 疑問
      - 語り: 光秀は、四国の長宗我部元親と、信長のあいだを取り次ぐ役を務めていました。ところが信長は、元親に厳しい方針へ変えて、信孝の軍を送ろうとします。
        figure: {type: people, title: 四国をめぐる取次, nodes: [[織田信長, 方針を変えた], [明智光秀, 取次役], [長宗我部元親, 四国の大名], [神戸信孝, 渡海する軍]], edges: [[明智光秀, 長宗我部元親, 取次], [織田信長, 神戸信孝, 出兵を命じる]]}
      - 聞き: 紹介した相手が、急に攻められる。それは、面目、つぶれるかも。会社で言ったら、取引先を紹介したのに、急に契約を切られる感じでしょ？
      - 語り: 2014年に公表された石谷家文書に、5月21日付で、元親が、光秀の家老、斎藤利三に送った手紙があります。一部の城から退く、という、歩み寄りの内容です。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
        card: {head: 1582年5月21日, body: 元親が利三に歩み寄りの書状}
      - 語り: ただ、この手紙が信長に届いたのか、信長がどう受け止めたのかは、分かっていません。
      - 聞き: 直接の証拠、とまでは言えないんだね。手紙が届いてなかったら、光秀も、知らなかったかもしれないし。
      - 語り: そのとおりです。討伐を避けるために謀反した、とする史料はない、と慎重な研究者もいます。
        background: {image: paintings/akechi_atago_renga_ehon_taikoki.jpg, credit: "『絵本太閤記』光秀連歌の図（江戸後期の読み物の挿絵）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 2}
      - 語り: 恨みで討った、という説は、信長に屈辱を受けた、という逸話が中心ですが、多くが後世の本の話です。
      - 語り: 天下がほしかった、という野望説は、光秀の心の中に頼る説で、決め手になる史料がありません。
      - 聞き: 屈辱の話は、おもしろいけど、あとから作られた可能性が高い、ってことだね。
      - 語り: 朝廷や足利義昭が裏にいた、という黒幕説もあります。ただ、光秀とどう結びついたのか、裏づけの史料は、ほとんど見つかっていません。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
        figure: {type: stats, title: 光秀が動いた理由の説（確かさ）, items: [[四国説, 有力, 書状はある。決め手ではない], [怨恨・野望, 説, 逸話は後世の本が中心], [黒幕説, 説, 裏づけの史料が乏しい]], upto: 3}
      - 聞き: 結局、はっきり分かる答えは、ないんだ。
      - 語り: 変の数日前、5月28日には、光秀が愛宕山で連歌会を開いています。発句は「ときは今 あめが下しる 五月かな」。謀反の決意を詠んだ、という読みも、そうでない、という読みもあります。
        background: {image: paintings/akechi_atago_renga_ehon_taikoki.jpg, credit: "『絵本太閤記』光秀連歌の図（江戸後期の読み物の挿絵）"}
        figure: null
      - 聞き: 有名な句だよね。「とき」が土岐氏、って読みでしょ？ でも、それも、決め手じゃないんだ。
      - 語り: もう一つ、光秀の立場の特徴があります。柴田、滝川、秀吉は、遠い方面に出ていました。光秀は、京のすぐそばの丹波や坂本に、軍を置いていました。
      - 語り: 京にいちばん近い場所に、まとまった軍を持っていたのは、光秀でした。そこが、光秀の立場の、特殊な点です。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
      - 聞き: 京のそばにいて、軍も持ってた。だから、動こうと思えば、動けたんだね。それって、重い立場だよね。
      - 語り: ただ、変の直前の状況は、史料から言えます。光秀は、先陣を命じられ、軍を動かせる立場にいました。同時に、四国の方針は、揺れていました。
        background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
      - 聞き: 少なくとも『信長公記』には、光秀が追い出された様子は、書かれていないんだね。でも、四国の件は、本人には重かったかも。
      - 語り: この状況のどこかが、少し違っていたら。それが、今日の「もしも」の入り口です。では、その入り口に、立ってみましょう。
        hook: true
      - 聞き: ここから、想像のターンだね。
        hook: true

  # ---------------------------------------------------------------- 4 想像① 西
  - title: 想像① 光秀が動かなかったら 西の毛利
    background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
    portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵、1601年ごろ）", age: false}
    year: 1582
    lines:
      - 語り: ここから先は、想像です。仮定は、ひとつだけ。1582年6月2日の明け方、光秀の軍は、亀山で、予定どおり、中国への出陣の準備を続ける。
        background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
        card: {head: ここから想像, body: 光秀は6月2日に動かない}
      - 聞き: 本能寺の朝は、何も起きずに終わる、ってことだね。
      - 語り: 信長は、予定どおり、西へ向かうはずでした。想像ですが、出発の前の言葉は、こんなふうだったかもしれません。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
      - 人物: 「光秀、秀吉が待っておる。先陣を急げ」
        who: 信長想像
      - 聞き: 先陣……。光秀は、秀吉の下で戦う形になるんだ。光秀、悔しくなかったのかな。
      - 語り: 小和田哲男さんは、光秀が動いた理由の一つに、秀吉の下に付く命令があったかもしれない、と述べます。ただ、これも推測です。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
      - 語り: 動かなかったことを想像する理由は、光秀が、実際に出陣の準備を進めていたことです。変の数日前の5月26日、光秀は、坂本から亀山へ移っていました。
      - 聞き: 準備まで進んでた人が、そのまま出発した、って考えるのは、自然かも。
      - 語り: では、信長が西へ着いたら、毛利との戦いは、どうなるのか。数字を並べます。
        background: {image: paintings/hidenaga_mori_terumoto.jpg, credit: "《毛利輝元像》江戸時代初め"}
      - 語り: 毛利は、3万5千から5万。ただし、この数は、史料によって大きく割れます。秀吉は、3万から6万。そこに、光秀の約1万3千と、池田たちの8千5百以上が、加わる形です。
        figure: {type: bars, title: 西の軍の数（数の種類は目安）, bars: [[毛利方の現地の軍勢, 50000], [秀吉の現地の軍勢, 30000], [光秀が亀山を出た兵, 13000], [池田・高山・中川（準備中）, 8500]], labels: [3万5千〜5万, 3万〜6万, 約1万3千, 8千5百以上]}
      - 聞き: 秀吉だけでも、毛利と並ぶのに、そこに2万も？ 数では、織田が上になるんだ。
        tone: 驚き
      - 語り: ここからは、可能性です。信長本人が西にいる、という事実が、毛利に、もう一つの圧力になります。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
        figure: null
      - 語り: 毛利が、和睦の条件を譲った可能性があります。逆に、押し切られた可能性もあります。どちらも、ありうる、です。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
      - 聞き: 毛利から見たら、信長本人が来るのは、すごい圧力だよね。会社に、社長が視察に来る感じでしょ？
      - 語り: 実際、現実の秀吉は、6月3日の夜に変を知ると、毛利に隠して、翌4日に和睦しました。備中、美作、伯耆の3か国と、清水宗治の切腹です。
        background: {image: paintings/hideyoshi_takamatsu_news_yoshitoshi_1885.jpg, credit: "月岡芳年《教導立志基》信長の死を知る秀吉（1885年）"}
        card: {head: 1582年6月4日, body: 現実の秀吉が毛利と和睦（変を隠して）}
      - 語り: 毛利は、その前に、5か国の割譲を申し出ていました。信長が来ていたら、この条件を、さらに上げさせたか、そもそも和睦を認めず、押し切ったか。史料には、書かれていません。
      - 聞き: どっちもあるんだ。信長は、九州まで、って言ってたもんね。
      - 語り: 戦いの長さも、割れます。毛利が早く降りれば、数か月で片づく。信長が九州まで進めれば、長引く。どちらにも、理由があります。
      - 語り: ただ、信長が西へ出るなら、畿内には、信長がいなくなります。畿内の守りは、薄くなります。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: 京都の守りが、薄くなる……。東や四国は、どうなってたんだろう。
      - 語り: 次は、四国です。信長の命令で動く軍が、ほかにもありました。
        hook: true
      - 聞き: 信孝の軍だね。
        hook: true

  # ---------------------------------------------------------------- 5 想像② 四国
  - title: 想像② 四国と長宗我部元親
    background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
    portrait: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, caption: "長宗我部元親（後世の想像図）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。信孝の軍は、1万4千。6月2日に淡路へ、3日に四国へ、とする記述があります。日付は、資料によって、割れています。
        card: {head: 史料に残る事実, body: 信孝の軍は渡海の準備を進めていた}
      - 聞き: 変がなければ、ほんとうに、渡ってたってこと？
        tone: 疑問
      - 語り: 渡る準備は、進んでいました。5月7日には、四国の国分案が、伝わっています。讃岐は信孝、阿波は三好康長。土佐と伊予は後日とされ、元親の名前は、案に入っていません。
        background: {image: paintings/hideyoshi_shikoku_chikanobu_1883.jpg, credit: "楊洲周延《豊公四国征討図》1883年（後の1585年の戦いの絵）"}
      - 聞き: 国の分け方を、もう決めてたんだ。元親の分は、後回しなんだね。
      - 語り: 阿波には、三好康長が、先に入っていました。信孝の到着を、待っていました。
      - 聞き: 先に、足がかりを作ってたんだ。信孝が来る準備は、ばっちりだったんだね。
      - 語り: 一方で、元親の側にも、動きがありました。5月21日の書状は、一部の城から退き、そのほかは保ちたい、という妥協案です。
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
      - 聞き: 歩み寄りは、してたんだ。でも、信長は、受け入れたのかな。
      - 語り: そこが、分かりません。熊田千尋さんは、信長が、光秀の交渉を無視する形で、信孝に出兵を命じた、と論じています。
      - 語り: ここから先は、想像です。変がなければ、信孝の軍は海を渡り、元親は、戦うか、さらに譲るかを迫られます。光秀の取次は、実らなかった可能性が高い、と考えられます。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》四国征伐（後の1585年の戦いの絵）"}
        card: {head: ここから想像, body: 光秀が動かず、信孝の軍が四国へ渡る}
      - 聞き: 光秀、苦しい立場になるね。信長に逆らうわけにも、いかないし。
      - 語り: 動かなかった光秀の気持ちを、想像のセリフで置いてみます。
      - 人物: 「元親殿の件、力が及ばなかった。だが、殿の命には、背けぬ」
        background: {image: paintings/hidenaga_chosokabe_yoshiiku.jpg, credit: "落合芳幾《太平記英勇伝 長曽我部元親》1867年（後世の想像図）"}
        who: 光秀想像
      - 聞き: 上の命令だから、って飲み込む会社員っぽい感じだね。……でも、これは、あーしたちの想像だよ。
      - 語り: 元親のその後も、見てみます。現実では、1585年、秀吉の四国攻めのあとで、元親は降伏します。秀長の回で掘りました。
        background: {image: paintings/hidenaga_shikoku_seito_toyonobu.jpg, credit: "歌川豊宣《新撰太閤記》四国征伐（後の1585年の戦いの絵）"}
      - 聞き: 秀長の回だ。あのとき、元親は、秀吉の軍に降りたんだよね。信長の軍に降りるか、秀吉の軍に降りるかの違い、ってことか。
      - 語り: 想像の理由は、数です。阿波にいた長宗我部方は、約3千。信孝の軍は、1万4千。数の種類は違いますが、阿波では、数の上で、織田が大きく上回ります。
      - 聞き: 数が違いすぎるもんね。じゃあ、元親は、戦うのは厳しい形だったのかな。
        background: {image: paintings/hideyoshi_shikoku_chikanobu_1883.jpg, credit: "楊洲周延《豊公四国征討図》1883年（後の1585年の戦いの絵）"}
      - 語り: 元親がどう動いたかは、分かりません。土佐の本拠での戦いも、別の話です。そこから先は、言えません。
      - 語り: そのころ、遠い東国は、どうなっていたのでしょうか。信長の領地になったばかりの土地です。
        hook: true
      - 聞き: 東国……って、何かあったの？
        hook: true

  # ---------------------------------------------------------------- 6 想像③ 東国
  - title: 想像③ 東国と新しい領地
    background: {image: paintings/nobunaga_katsuyori_portrait.jpg, credit: "《武田勝頼像》16世紀後半"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。1582年3月、武田氏が滅び、信長の領地は、一気に東へ広がりました。滝川一益は上野一国と信濃の2郡、河尻秀隆は甲斐、森長可は北信濃を、受け取ります。
        card: {head: 史料に残る事実, body: 武田氏が滅び、織田の領地が東へ広がる}
      - 聞き: 一気に広がった領地。守るのも、大変そう。
      - 語り: 変が起きたのは、それからわずか3か月後でした。
        short: s4
      - 語り: 変のあと、東国は、2週間余りで崩れました。6月7日、関東で、変が知られます。12日、北条が動員をかけます。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
        figure: {type: stats, title: 変のあとの東国（現実）, items: [[6月7日, 関東で変が知られる], [6月12日, 北条が動員], [6月19日, 神流川で敗れる]]}
        short: s4
      - 語り: 18日、甲斐で一揆が起き、河尻が討たれます。19日、神流川で、織田の軍が北条に敗れます。
        short: s4
      - 聞き: 2週間ちょっとで、ほとんど崩れたんだ。領地が広がってから、まだ3か月なのに。支配が、固まる時間が、なかったんだね。
        tone: 驚き
        short: s4
      - 語り: 変から神流川の戦いまで、16日か17日です。東国の新しい領地は、それほど、もろい状態でした。
        short: s4
      - 語り: このとき、関東を任されていたのが、滝川一益です。一益は、7月1日に伊勢へ戻り、織田家の跡継ぎを決める会議にも、出られませんでした。
        background: {image: paintings/nobunaga_katsuyori_jimyoin_full.jpg, credit: "《武田勝頼像》（持明院蔵）"}
        figure: null
      - 聞き: では、信長が生きていたら、崩れなかったの？
        tone: 疑問
      - 語り: ここから先は、想像です。信長がいたなら、あの2週間の崩れ方は、起きにくかった可能性があります。理由は、2つ。
        card: {head: ここから想像, body: 信長が生きていた場合の東国}
      - 語り: 1つ目。敵だった上杉は、魚津城を助けに出していた軍を、引き上げようとしていた、と伝わります。東国で表立って敵対していたのは、上杉だけでした。
        background: {image: paintings/akechi_rakuchu_rakugai_uesugi_left.jpg, credit: "《上杉本洛中洛外図屏風》（上杉家蔵）"}
      - 語り: 2つ目。北条は、3月から4月にかけて、馬や鷹、酒などを、立て続けに信長へ贈っていました。ただし、馬と鷹は、気に入られず、返されたと伝わります。
      - 聞き: 敵は弱ってたし、北条も、仲よくしようとしてたんだ。でも、贈り物を返されちゃったのは、ちょっと、気まずいじゃん。
      - 語り: 一方で、崩れる要因も、すでにありました。4月には、信濃の飯山城で、一揆が起きています。武田の旧領は、まだ、織田の支配が固まっていませんでした。
        background: {image: paintings/nobunaga_katsuyori_portrait.jpg, credit: "《武田勝頼像》16世紀後半"}
      - 聞き: 敵は弱ってたけど、中は不安定、ってことだね。
      - 語り: だから、そのあとも抑えきれたのかは、割れます。信長の存在が重しになった可能性。信長が生きていても、一揆や北条との関係が揺らいだ可能性。
      - 聞き: 信長がいたら、少なくとも、あの2週間の崩れ方には、なりにくそう。でも、その先は、割れるんだね。
        background: {image: paintings/nobunaga_katsuyori_jimyoin_full.jpg, credit: "《武田勝頼像》（持明院蔵）"}
      - 語り: 想像のセリフで、信長の指示を置いてみます。新しい領地の、もろさを知っていた信長なら、こう言ったかもしれません。
      - 人物: 「一益、関東の国衆は、まだ心から従ってはおらぬ。急がず固めよ」
        who: 信長想像
      - 聞き: 急がず固めよ、か。領地が増えたばっかりの、社長の言葉って感じだね。
      - 語り: では、信長が生きていた場合、織田家の中は、どうなるのか。後継ぎの話に、進みます。
        hook: true
      - 聞き: 信忠、だよね。
        hook: true

  # ---------------------------------------------------------------- 7 想像④ 後継ぎと家臣団
  - title: 想像④ 後継ぎの信忠と、家臣団の仕組み
    background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
    portrait: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, caption: "織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。信長の後継ぎは、嫡男の信忠でした。1575年、信長は、19歳の信忠に、家督と、美濃、尾張を譲っています。
        card: {head: 史料に残る事実, body: 信忠は1575年に家督を継いでいた}
        short: s5
      - 聞き: 変の7年前に、もう、後継ぎを決めてたんだ。
        short: s5
      - 語り: 1582年の甲州攻めでは、信忠が総大将として、美濃、尾張の軍5万を率い、武田氏を滅ぼしました。3月には、信長が、天下のことも与えてよい、と信忠に話した、と伝わります。
      - 聞き: じゃあ、次の天下人は、信忠って、ほぼ決まりじゃない？
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
      - 語り: 戦国史研究家の和田裕弘さんは、信忠が健在なら、秀吉の台頭は、なかっただろう、と見ています。決まり、とまでは言っていません。
        card: {head: ここから想像・研究者の見立て, body: 信忠が健在なら秀吉は台頭しなかった}
        short: s5
      - 語り: 理由も挙げています。丹羽長秀や池田恒興が秀吉に付くとは考えにくく、柴田勝家ら北陸の将も、阻んだだろう、と。
        short: s5
      - 聞き: 信長が死んだから、秀吉に、チャンスが来たってことか。
        short: s5
      - 語り: ただし和田さんは、信忠を、買いかぶりすぎてはいけない、とも注意しています。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 聞き: 優秀な二代目でも、信長の代わりには、ならないってことかな。信長がやってたことを、全部、引き継ぐのは、難しそう。
      - 語り: 織田政権には、まだ未完成の所がありました。池上裕子さんは、織田家で明文化された軍役の規定は、光秀の家中軍法のほかに、見つかっていない、と指摘します。
        background: {image: paintings/nobunaga_document_shuin_5articles.jpg, credit: "織田信長の五か条の書き付け（1570年、宛名に「明智十兵衛尉」）"}
      - 語り: あったかどうかは、研究者の間で割れています。
      - 聞き: 記録に残ってるのが、光秀のだけ、なんだ。ほかの家は、どうやって兵を集めてたのかな。
      - 語り: 皮肉なことに、いちばん仕組みを整えていたのは、光秀でした。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
      - 語り: 平井上総さんは、安土城を築いたあとは、重臣と話し合う場もなく、約束の書き付けも、人質も取らなかった、と述べます。意思を伝えるのは、近くに仕える人を通して、でした。
      - 聞き: ルールより、信長の一声で、動いてた感じ？ それって、信長がいなくなったら、困るやつだよね。
      - 語り: ここから先は、想像です。信長は、家督を譲ってから7年かけて、信忠を総大将に育てていました。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
        card: {head: ここから想像, body: 信長が生きていた場合の家臣団の仕組み}
      - 語り: 同じ速さで進めば、1、2年のあいだにも、軍役や、合議の仕組みが、整った可能性があります。ただし、期間は分かりません。
      - 聞き: 整える時間が、あったかもしれないんだね。
      - 語り: 現実では、信長の死のあと、6月27日の清洲会議で、家督は、信忠の子で3歳の三法師に決まります。
        background: {image: paintings/oichi_katsuie_portrait.jpg, credit: "《柴田勝家像》桃山〜江戸初期"}
      - 語り: 柴裕之さんは、三法師を後継ぎにする方針は、信長の生前から決まっていた、と見ています。
      - 聞き: じゃあ、信忠が生きてたら、清洲会議みたいな場面は、なかったかもしれないんだね。
      - 語り: では、朝廷との関係と、秀吉、家康は、どうなっていたのでしょうか。
        hook: true
      - 聞き: 信長は、朝廷から、何か言われてたんだよね。
        hook: true

  # ---------------------------------------------------------------- 8 想像⑤ 朝廷と秀吉・家康
  - title: 想像⑤ 朝廷と、秀吉・家康の位置
    background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
    portrait: {image: paintings/akechi_hideyoshi_kodaiji.jpg, caption: "豊臣秀吉（狩野光信画、高台寺蔵、1601年ごろ）", age: false}
    year: 1582
    lines:
      - 語り: 史料に残る事実から。1582年4月から5月、朝廷の側から、信長に、太政大臣、関白、将軍の、どれかへの就任を、打診した、と伝わります。
        card: {head: 史料に残る事実, body: 朝廷側から三つの官職を打診された}
      - 語り: 三職推任です。誰の発案かは、研究者の間で割れています。
      - 聞き: 信長は、何て答えたの？
        tone: 疑問
      - 語り: 返事を、しませんでした。研究者の読みは、4つに割れています。太政大臣、関白、将軍、そして、断る。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
      - 聞き: 返事がないから、誰にも、決められないんだね。
      - 語り: 信長が、何になるつもりだったのか。これは、史料上、分からない、のが事実です。返事のないまま、1か月近くがたって、変の日が来ました。
      - 聞き: 生きていても、1、2年のうちに決まったとは、限らない、ってことか。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
      - 語り: 秀吉と家康の位置も、見ます。ここは、研究者も、はっきりとは言っていません。変がなければ、二人が天下人になれたのか、正面から論じた研究は、見つかっていません。
      - 語り: だから、言える範囲だけ、言います。
      - 語り: 秀吉は、中国攻めの司令官。家康は、武田の滅亡のあと、駿河を与えられた、織田政権の一大名でした。
        card: {head: 史料に残る事実, body: 秀吉は司令官。家康は織田政権の一大名}
        background: {image: paintings/nene_ieyasu_portrait.jpg, credit: "狩野探幽《徳川家康像》17世紀"}
      - 語り: ここから先は、想像です。信長が生きているあいだ、二人とも、信長の下の、大きな家臣のままだった可能性は、高いです。
        card: {head: ここから想像, body: 信長が生きている間は家臣のまま（高い）}
      - 語り: 理由は、二人とも、織田政権の中で、その位置にいたからです。その先は、次の節で、飛びます。
      - 聞き: 天下人への道は、信長が生きてるあいだは、閉じてたかもしれないんだ。……でも、信長だって、いつかは死ぬよね。
      - 語り: 渡邊大門さんも、変の歴史的な意味を、信長が死んだことと、秀吉が台頭したこと、と整理しています。
        background: {image: paintings/akechi_hideyoshi_kodaiji.jpg, credit: "狩野光信《豊臣秀吉像》1601年ごろ（高台寺蔵）"}
      - 聞き: 信長が死んだことと、秀吉が出てきたこと。セットで、歴史が動いたんだね。
      - 語り: では、動かなかった光秀自身は、どうなっていたのでしょうか。
        hook: true
      - 聞き: 光秀、最後に、ちゃんと見ておきたい。
        hook: true

  # ---------------------------------------------------------------- 9 想像⑥ 日本の変化点
  - title: 想像⑥ 日本の変化点 史実との比較
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
    portrait: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, caption: "織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）", age: false}
    year: 1582
    lines:
      - 語り: ここまでの分かれ道を、日本全体の変化に、つなげてみます。ここから先は、かなり遠い想像です。史実と並べて、可能性の高さを、3段階で付けます。
        card: {head: ここから想像, body: 史実ともしもを比べる（可能性は3段階）}
      - 聞き: 史実と並べて見るんだね。どこが変わって、どこが変わらないのか、楽しみ。
      - 語り: まず、統一の時期です。史実では、秀吉が関東の北条を降し、奥州仕置を終えた、1590年です。この年が、天下一統とされます。
        background: {image: paintings/hideyoshi_takamatsu_flood_toyonobu_1883.jpg, credit: "歌川豊宣《新撰太閤記》備中高松城の水攻め（1883年）"}
        figure: {type: numberline, title: 天下統一の年, items: [[史実（秀吉）, 1590], [もしも（西と東が順調）, 1585], [もしも（東がこじれる）, 1590]], unit: 年, focus: もしも（西と東が順調）, note: もしもは想像（ありうる）}
      - 語り: もしも信長が生きていて、西と東が順調に進めば、1585年ごろに早まる可能性があります。理由は、信長本人の出陣と、毛利、四国、東国での、織田の数の差、そして、上杉の弱りです。
      - 聞き: 秀吉は、信長の仕事を引き継いで、8年かかったんだよね。信長本人なら、もっと早いかも。
      - 語り: ただ、東国がこじれれば、史実と同じ、1590年ごろになる可能性もあります。分かれ道は、上杉と北条の動きです。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
      - 聞き: 同じ年になっちゃうこともあるんだ。分かれ道は、東国か。
      - 語り: では、日本の仕組みは、どう変わるのか。比べてみます。
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1585年ごろから, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [検地, 秀吉が全国へ, 織田でも進む, ありうる], [朝鮮出兵, 1592年から, 別の形か無し, ほぼ妄想]], upto: 1, note: もしもは想像。右の札は可能性の高さ}
      - 語り: 1つ目は、幕府です。史実の江戸幕府は、1603年。秀吉の死と、関ヶ原のあとにできました。家康は、織田政権の大名のままだったなら、この形には、ならない可能性があります。
        background: {image: paintings/hideyoshi_kiyosu_sanboshi_ehon_taikoki.jpg, credit: "岡田玉山『絵本太閤記』の挿絵（1797〜1802年）"}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1585年ごろから, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [検地, 秀吉が全国へ, 織田でも進む, ありうる], [朝鮮出兵, 1592年から, 別の形か無し, ほぼ妄想]], upto: 2, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 江戸幕府がないなら、江戸が大きな街になる話も、変わるのかな。
      - 語り: そこは、さらに遠い想像です。江戸は、家康の領地になってから、開発が進んだ町です。家康の立場が違えば、別の町が、中心になったかもしれません。ここは、ほぼ妄想です。
      - 聞き: 「ほぼ妄想」って、ちゃんと言ってくれるの、好き。
      - 語り: 2つ目は、キリスト教です。信長は、1569年に、京都での布教の許可状を、宣教師のフロイスに与えています。
        background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
      - 聞き: 信長って、新しいもの好きなイメージあるけど。それが、関係あるのかな。
      - 語り: 史実では、秀吉が、1587年の九州平定のあとに、バテレン追放令を出しました。信長が生きていれば、この追放令は、出なかった可能性があります。
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1585年ごろから, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [検地, 秀吉が全国へ, 織田でも進む, ありうる], [朝鮮出兵, 1592年から, 別の形か無し, ほぼ妄想]], upto: 3, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 理由は、信長が、特定の宗教を押さえつける人じゃなかったから、ってことだね。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
      - 語り: はい。研究者の渡邊大門さんは、信長がキリスト教を保護した理由を、当時は特定の宗教を排撃するのは良くないとされていたことなども含めて、考えています。
      - 語り: 南蛮貿易の利益も、理由の一つと言われます。
      - 語り: 3つ目は、検地です。史実では、1582年に山城から、太閤検地が全国へ広がります。ただ、秀吉は、長浜で、1573年に早くも検地をしていました。
        background: {image: paintings/hanbei_nagahama_map.jpg, credit: "《長浜町絵図》（江戸時代）"}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1585年ごろから, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [検地, 秀吉が全国へ, 織田でも進む, ありうる], [朝鮮出兵, 1592年から, 別の形か無し, ほぼ妄想]], upto: 4, note: もしもは想像。右の札は可能性の高さ}
      - 聞き: 検地って、秀吉の手柄、って聞いてたけど、信長の政権の中で、もう始まってたんだ。
      - 語り: そうです。織田政権でも、検地は進んだ可能性があります。ただ、織田政権で、明文化された軍役の規定が、光秀のもの以外に見つかっていない、という指摘も、さっき見ました。
      - 語り: 4つ目は、朝鮮出兵です。史実では、秀吉が、1592年から、朝鮮へ軍を送りました。
        background: {image: paintings/hideyoshi_nagoya_departure_yoshitoshi_met.jpg, credit: "月岡芳年《真柴秀吉公名護屋陣先手諸将繰出之図》19世紀"}
        figure: {type: table, title: 日本の変化点（史実ともしも）, cols: [史実, もしも], rows: [[統一, 1590年 秀吉, 1585年ごろから, ありうる], [幕府, 1603年 江戸幕府, 織田政権が続く, ありうる], [キリスト教, 1587年に追放令, 保護が続く, ありうる], [検地, 秀吉が全国へ, 織田でも進む, ありうる], [朝鮮出兵, 1592年から, 別の形か無し, ほぼ妄想]], upto: 5, note: もしもは想像。右の札は可能性の高さ}
      - 語り: 信長にも、大陸への構想があった、とイエズス会の宣教師が書いています。ただ、日本側の史料に、裏づけはありません。
      - 聞き: 信長が先に海外へ出てた、なんて想像も、できちゃうけど……。
      - 語り: そこは、ほぼ妄想です。朝鮮出兵が、起きなかったのか、別の形で起きたのか。理由になる史料が、ないからです。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
      - 聞き: 根拠が薄いところは、薄いって、はっきり言うんだね。
      - 語り: 以上が、日本の変化点です。統一は早まるかもしれない。幕府の形は変わるかもしれない。その結論を、次で言います。
        figure: null
        hook: true
      - 聞き: 結局、織田は、統一できたの？
        hook: true

  # ---------------------------------------------------------------- 11 結論
  - title: 結論 織田は統一できたのか
    background: {image: paintings/nobunaga_portrait_chokoji.jpg, credit: "狩野宗秀《織田信長像》1583年（長興寺蔵）"}
    portrait: {image: paintings/nobunaga_portrait_chokoji.jpg, caption: "織田信長（狩野宗秀画、長興寺蔵、1583年）", age: false}
    year: 1582
    lines:
      - 語り: 結論です。織田は、統一できたのか。時間の長さごとに、答えを言います。
        card: {head: ここから想像, body: 織田は統一できたのか}
      - 聞き: 時間の長さで分けるんだ。……2年、5年、8年。
      - 語り: 2年のあいだでは、統一は終わらなかった可能性が高いです。理由は、毛利、四国、東国、九州、奥羽が、まだ残っているからです。
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 終わらない, 高い], [5年ほど, 届きそう, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 1}
      - 聞き: 全部、2年で終わらせるのは、さすがに無理か。
      - 語り: 5年ほどなら、西と東が順調に進んだ場合、統一に届いた可能性があります。理由は、信長本人の出陣と、数の差と、上杉の弱り、北条との協調です。
        background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 終わらない, 高い], [5年ほど, 届きそう, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 2}
      - 語り: ただ、東国でこじれれば、史実の1590年と同じ頃になります。分かれ道は、上杉と北条の動きです。
        figure: {type: stats, title: 織田は統一できたのか, items: [[2年のあいだ, 終わらない, 高い], [5年ほど, 届きそう, ありうる], [8年ほど, 史実と同じ頃, ありうる]], upto: 3}
      - 聞き: つまり、統一できた可能性は、ありうる。時期は、5年から8年ほどの幅、ってことだね。
      - 語り: そのとおりです。そして、できたとしても、その国の形は、史実と違った可能性があります。幕府、キリスト教の扱い、検地の進み方。
        background: {image: paintings/nene_kyoto_map_1696.jpg, credit: "《京都の地図》元禄9年（1696年）"}
      - 聞き: 統一の時期より、国の形が変わるのが、いちばん大きい変化かも。
        background: {image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg, credit: "狩野永徳（伝）《織田信長像》1584年（大徳寺 総見院）"}
      - 語り: 一方で、九州と奥羽が、どう組み込まれたかは、史料がなく、分かりません。ここは、ほぼ妄想です。
        figure: null
      - 聞き: 「ほぼ妄想」も、ちゃんと札が付いてるから、安心して聞けるね。
      - 語り: 最後に、動かなかった光秀自身は、どうなっていたのか。もう一度、光秀に戻ります。
        hook: true
      - 聞き: 動いたか、動かなかったかで、光秀が主役なんだよね。
        hook: true

  # ---------------------------------------------------------------- 9 想像⑥ 光秀自身
  - title: 想像⑦ 動かなかった光秀のその後
    background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
    portrait: {image: paintings/akechi_portrait_hontokuji.jpg, caption: "明智光秀（本徳寺蔵の肖像画）", age: false}
    year: 1582
    lines:
      - 語り: 最後に、光秀自身です。動かなかった光秀は、丹波と、近江の坂本を合わせた、約34万石の軍団長のままです。34万人が、1年に食べる米がとれる領地です。
        card: {head: ここから想像, body: 動かなかった光秀のその後}
        figure: {type: stats, title: 光秀の領地, items: [[丹波, 約29万石, 亀山・福知山など], [坂本, 約5万石, 近江], [合計, 約34万石, 34万人が1年食べる米]]}
      - 聞き: 織田家の重臣の中でも、かなり大きいほうだよね。34万人分の米って、一つの大きな国くらいかな。
        figure: null
      - 語り: はい。光秀は、織田家では新参者でしたが、重臣の中で、早く城持ちになった一人でした。信長の個人の信任で、のし上がった人です。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
      - 語り: ただ、年齢が、分かりません。生まれた年は、1513年から1540年以降まで、幅があります。変の年に、数えで43歳前後から70歳。
      - 聞き: 43歳なら現役ばりばり。70歳なら、今の定年よりずっと先。同じ働き方は、できないよね。
      - 語り: 嫡男は、光慶、通称は十五郎です。谷口克広さんは、67歳説なら、光慶はまだ10代前半で、光秀は、子の将来を案じて変に踏み切ったのでは、と見ています。これは、動機の説の一つです。
        background: {image: paintings/akechi_tamba_kameyama_castle_map.jpg, credit: "《丹波国亀山城絵図》（正保城絵図、1640年代。光秀より後の姿）"}
      - 聞き: 子どもが10代前半なら、親は、そりゃ、心配するよね。
      - 語り: 実際、光秀は、変のあとの6月9日、味方を求める細川父子あての覚書に、50日か100日で近国を固めたら、息子に譲って引退する、と書いています。
        card: {head: 1582年6月9日, body: 光秀の覚書「近国を固めたら息子へ」}
      - 聞き: そう書いてはいたんだね。でも、味方になってほしい相手に宛てた手紙だから、本心かは、別かも。
      - 語り: だから、分かれ道は、光秀の年齢です。若ければ、長く働く。年なら、早く退く。年齢が分からない限り、ここは決まりません。若かった場合を、想像のセリフで、一つ置きます。
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
      - 人物: 「光慶が一人前になるまでは、まだ退けぬ」
        who: 光秀想像
      - 聞き: 動いた光秀も、動かなかった光秀も、息子のことは、考えてたのかな。
      - 語り: 動かなかった光秀と、動いた光秀。同じ人の、別の道です。変の直前に、光秀が心を書き残した史料は、ありません。分かっているのは、動いたあとに書いたものだけです。
        background: {image: paintings/akechi_fukuchiyama_castle_map.jpg, credit: "《丹波国福知山平山城絵図》（正保城絵図、1640年代）"}
      - 語り: では、ここまでを、まとめます。何が言えて、何が言えなかったのか。
        hook: true
      - 聞き: 言えたことと、言えなかったこと。整理してみたいな。
        hook: true

  # ---------------------------------------------------------------- 10 まとめ
  - title: まとめ：分かれ道の地図 変わりそう、変わらなそう、分からない
    background: {image: paintings/nobunaga_azuchi_castle_zu.jpg, credit: "《近江国蒲生郡安土城之図》（1855年に写された図。天主の姿は後世の想像）"}
    year: 1582
    lines:
      - 語り: 冒頭で約束した、3つに分けて、まとめます。1つ目。変わりそうなものです。
        figure: {type: stats, title: 分かれ道の地図, items: [[変わりそう, 西・四国・東国, 信長本人がいる圧力と数の差], [変わらなそう, 1、2年は家臣のまま, 秀吉も家康も信長の下], [誰にも分からない, 動機・官職・光秀の気持ち, 史料が無い]], upto: 1}
      - 語り: 西では、信長本人がいる圧力と、数の差。阿波では、数の上で織田が大きく上回ること。東国では、少なくとも、あの2週間の崩れ方は、起きにくかった可能性があること。
      - 聞き: 信長がいることと、数。この2つが、大きいんだね。
      - 語り: 2つ目。変わらなそうなものです。1、2年のあいだは、秀吉も家康も、信長の下の、大きな家臣のまま。後継ぎの重さや、家臣団の未完成な所も、変がなくても、残った可能性があります。
        figure: {type: stats, title: 分かれ道の地図, items: [[変わりそう, 西・四国・東国, 信長本人がいる圧力と数の差], [変わらなそう, 1、2年は家臣のまま, 秀吉も家康も信長の下], [誰にも分からない, 動機・官職・光秀の気持ち, 史料が無い]], upto: 2}
      - 聞き: 信長が生きてても、すぐ天下が変わる、わけじゃないんだね。
      - 語り: 3つ目。誰にも分からないものです。光秀が、なぜ動いたのか。信長が、何の官職を選んだのか。西の戦いが、どれくらい続いたのか。光秀の年齢と、気持ち。
        figure: {type: stats, title: 分かれ道の地図, items: [[変わりそう, 西・四国・東国, 信長本人がいる圧力と数の差], [変わらなそう, 1、2年は家臣のまま, 秀吉も家康も信長の下], [誰にも分からない, 動機・官職・光秀の気持ち, 史料が無い]], upto: 3}
        background: {image: paintings/akechi_portrait_hontokuji.jpg, credit: "《明智光秀像》（本徳寺蔵）"}
      - 聞き: いちばん大きな「分からない」は、光秀がなぜ動いたのか、だよね。それが分からないから、動かなかった世界も、想像のままなんだ。
      - 語り: 分かれ道を一つ挙げるなら、5月29日から6月4日。信長が小姓衆だけで、京にいた、この数日でした。
        figure: null
        background: {image: paintings/akechi_honnoji_nobukazu_1893.jpg, credit: "楊斎延一《本能寺焼討之図》1893年"}
      - 聞き: 動いた光秀も、動かなかった光秀も、本人の気持ちは、謎のまま。……あーしは、そこが、いちばん気になるかな。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
      - 聞き: 「もしも」の意味って、答えを当てることじゃなくて、どこが分かれ道だったか、を見つけること、って覚えとく。次の「もしも」は、誰の、どの分かれ道かな。
        tone: 疑問
      - 語り: あなたが気になる、歴史の分かれ道を、コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
