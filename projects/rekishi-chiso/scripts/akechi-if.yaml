terms:
  四国説: 信長の四国方針の転換で、取次役の光秀の立場が危うくなった、とする説
  取次役: 大名と信長のあいだをつなぐ役。光秀は長宗我部元親の担当だった
  石谷家文書: 光秀の家臣・斎藤利三の親戚の家に伝わった文書。2014年に公表
  三職推任: 朝廷側から信長に、太政大臣・関白・将軍の就任が打診された話。返事は無かった
  方面軍: 地域ごとに大名級の家臣に軍を任せる、信長の軍のしくみ
  国分案: 四国をどう分けるかの案。信長が5月7日に示したと伝わる
  家中軍法: 光秀が1581年に定めた、家臣の軍役などの決まり
  反実仮想: 実際には起きなかったことを仮定して、結果を考えること
  神流川の戦い: 1582年6月、北条軍が織田方の滝川一益軍を破った戦い

