# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  戦国の足軽の心得には、こうあります。梅干は、食べてはいけない。なめてもいけない。ちょっと見るだけにしろ。
  米は3日か4日分ずつ。まとめて渡すと、酒好きが米を酒に造って飲んでしまうから。鍋は持たない。頭の陣笠で炊く。
  もしも今の私たちが、戦国の足軽になったら。何を持たされ、何を食べ、何で傷を負い、何のために戦うのか。足軽たちが話し言葉で語る『雑兵物語』と、当時の記録でたどります。
  この動画でわかること
  ・足軽はどうやって集められ、何人で、何を持って戦場へ行ったか
  ・『雑兵物語』が教える、米・水・塩・味噌の量と、陣中の食べ方
  ・足軽の傷は何によるものが多かったか、手当てはどうしたか
  ・手柄の首の数え方と、戦場の「稼ぎ」を禁じた札の値段
description_note: |-
  この動画に、想像の台詞や作った話はありません。「もしも」は入口の問いだけで、中身は記録（『雑兵物語』弘化3年刊本〈国立国会図書館デジタルコレクション〉、『樵談治要』、『信長公記』、『北条五代記』、『おあむ物語』、フロイス『日欧文化比較』『日本史』、豊臣秀吉の文書など）と研究（藤木久志、小和田哲男、湯本軍一、鈴木眞哉、漆原徹、中原寛貴、羅麗馨、藤井讓治、渡邊大門、坂本直紀ほか、山口県文書館、南相馬市博物館、観光庁の多言語解説、琉球大学附属図書館、国立公文書館）から取りました。
  『雑兵物語』の言葉は、江戸の話し言葉を今の言葉に直して読んでいます。作者は分かっておらず、松平信興とする説は確かではありません。
  長さ・重さは、1間＝約1.82メートル、1合＝米約150グラムとして計算した目安です。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "What If You Became a Sengoku Foot Soldier? A Soldiers' Manual Said: Only Look at Your Pickled Plum"
  description: |-
    A manual for Japan's foot soldiers says: do not eat your pickled plum. Do not even lick it. Just take it out and look at it.
    Rice was handed out only three or four days at a time, because heavy drinkers would brew it into sake. There was no pot: the foot soldiers cooked in the hats on their heads.
    What if you became an ashigaru, a foot soldier of Japan's Warring States period? What would you carry, eat, and suffer? We follow the Zohyo Monogatari, a book in which some thirty low-ranking soldiers speak in their own words, together with other records.
    In this video you will learn:
    - How foot soldiers were gathered, and what they carried
    - The daily amounts of rice, water, salt and miso, and how they ate in camp
    - What caused most battle wounds, and how they were treated
    - How heads were counted for rewards, and the price list for protection notices
    Japanese-language history video (Japanese audio). "What if" is only the question; everything else comes from records.
  chapters:
    - "Only Look at Your Pickled Plum"
    - "Foot Soldiers Were Called Villains"
    - "If It Rains, You Need Not Come"
    - "What You Carry: Guns and Long Spears"
    - "What You Eat: Six Go of Rice and a Rope of Taro Stems"
    - "What Wounds You: Arrows, Snakes and First Aid"
    - "How Merit Was Counted: Heads and Passwords"
    - "Why Go to War: Plunder and Protection Notices"
    - "Summary: If You Were a Foot Soldier"

