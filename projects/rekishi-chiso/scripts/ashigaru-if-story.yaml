sections:
  # ================================================================ 序章
  - title: 「梅干は見るだけ」　雑兵物語
    lines:
      # fact: ashigaruif-09
      - 語り: 戦国の足軽の心得には、こうあります。梅干は、食べてはいけない。なめてもいけない。ちょっと見るだけにしろ。
        tone: 重い
        card: {head: "梅干は見るだけ", body: 鉄砲足軽の教え}
      # fact: ashigaruif-06
      - 語り: 米も、まとめて渡すな。3日か4日分ずつにしろ。まとめて渡すと、酒好きが、米を酒に造って、飲んでしまうから。
      # fact: ashigaruif-18
      - 語り: 鍋は、持たない。頭にかぶった陣笠を、鍋にする。
      # fact: ashigaruif-15
      - 語り: そして、むやみに死ぬな。ただ死ねば、今までもらった扶持、つまり給料の米が、無駄になる。
        tone: 重い
      - 語り: もしも、今の私たちが、戦国の足軽になったら。何を持たされ、何を食べ、何で傷を負い、何のために、戦場へ行くのか。
        tone: 疑問
      # fact: ashigaruif-01
      - 語り: 手がかりは、雑兵物語という本です。江戸時代の前半、1657年から1683年のあいだに、まとめられたといいます。
      # fact: ashigaruif-04
      - 語り: 鉄砲足軽や、馬を引く口取りなど、およそ30人の雑兵が、話し言葉で、戦場の心得を語ります。
      # fact: ashigaruif-22
      - 語り: 本の終わりで、語り手は嘆きます。関ヶ原や大坂の陣に出た者は、もう死んでしまった。島原の乱さえ昔のことで、出た者は、海老のように腰が曲がって、口もろくにきけない。
        tone: しみじみ
      # fact: ashigaruif-22
      - 語り: 戦を知る人が、いなくなっていくころに、書き残された心得です。その教えと、ほかの記録を合わせて、足軽の戦場を、たどります。
      - 語り: ただ、足軽という言葉は、はじめ、ほめ言葉ではありませんでした。
        hook: true
      # fact: ashigaruif-23
      - 語り: 京の都で、足軽は、悪党と呼ばれたのです。
        hook: true

  # ================================================================ 第1章 応仁の乱の足軽
  - title: 「足軽は悪党だった？」　応仁の乱の京都
    lines:
      # fact: ashigaruif-23
      - 語り: 1467年から、足かけ11年続いた、京都の大乱、応仁の乱。その乱のさなかに、足軽は、記録の中で、目立ち始めます。
      # fact: ashigaruif-23
      - 語り: 公家の一条兼良は、1480年ごろ、将軍の足利義尚に宛てた意見書、樵談治要に、こう書きました。
      # fact: ashigaruif-23
      - 語り: このたび、はじめて出てきた足軽は、度を超えた悪党だ。
        tone: 重い
        card: {head: "樵談治要", body: 足軽は度を超えた悪党}
      # fact: ashigaruif-23
      - 語り: 寺や公家の屋敷を壊し、火をかけて、財宝を奪う。これは、昼の強盗と言うべきだ、と。
      # fact: ashigaruif-25
      - 語り: 1468年の3月ごろには、骨皮道賢と呼ばれた足軽が、東軍の命で、京都の南東のあたりを、脅かしました。
      # fact: ashigaruif-26
      - 語り: 立教大学の研究が、禅僧の日記、碧山日録から、伝えています。
      # fact: ashigaruif-26
      - 語り: 同じ年の秋には、西軍の足軽、およそ2000人が、京都の東の山科の、花山に攻め込みます。このときは、村の人々に防がれて、退きました。
        card: {head: "1468年", body: 西軍の足軽およそ2000人}
      # fact: ashigaruif-27
      - 語り: 足軽を雇うための、専用の取り立てもありました。河内の守護、畠山義就は、1470年ごろ、足軽段米という取り立てを作ります。
      # fact: ashigaruif-27
      - 語り: 2025年に、坂本直紀さんらが書いた論文では、その取り立ては、1550年には、免除されていた寺の領地にまで、広がっています。
      # fact: ashigaruif-28
      - 語り: 足軽が、自分で取り立てることもありました。信貴山城の足軽衆は、黒い印を押した書状で、法隆寺に、米100石を、16日までに出せ、と命じています。
        card: {head: "足軽衆の書状", body: 法隆寺に米100石を出せ}
      # fact: ashigaruif-24
      - 語り: その一方で、足軽の名前は、記録に残りにくいものでした。山口県文書館が紹介する、応仁の乱のけが人の報告書があります。西軍の、大内方の武将が出したものです。
      # fact: ashigaruif-24
      - 語り: そこには、大和足軽5人、いずれも矢傷1か所ずつ、うち深手2人、とだけあります。
        card: {head: "大和足軽五人", body: 名前はなく、人数だけ}
      # fact: ashigaruif-24
      - 語り: 名前は書かれず、数だけ。足軽は、そう記録される人たちでした。
        tone: しみじみ
      - 語り: では、もしもあなたが戦国の世にいたら、どうやって、足軽に集められるのか。
        hook: true
      # fact: ashigaruif-31
      - 語り: ある大名の決まりには、雨なら来なくてよい、という一文があります。
        hook: true

  # ================================================================ 第2章 集め方
  - title: 「雨なら来なくてよい？」　足軽の集め方
    lines:
      # fact: ashigaruif-55
      - 語り: 歴史学者の藤木久志さんの研究によれば、16世紀の軍勢の、およそ9割は、雑兵だった、といいます。1995年の本、雑兵たちの戦場です。
        card: {head: "軍勢の約9割", body: 雑兵（藤木久志）}
      # fact: ashigaruif-55
      - 語り: 雑兵は、3つに分かれます。侍と呼ばれた、若党や足軽。武家の下人の、中間や小者。そして、荷を運ぶ、村の百姓です。
      # fact: ashigaruif-36
      - 語り: 豊臣秀吉の法令も、戦に連れて行く者を、侍、中間、小者、あらし子、と分けて呼びました。
      # fact: ashigaruif-30
      - 語り: では、何人を連れて行くのか。北条家では、知行、つまり領地の取り分ごとに、決まっていました。
      # fact: ashigaruif-30
      - 語り: 取り分が25貫文の、ある家臣は、本人が馬に乗り、鑓持ち1人と、指物持ち1人を連れて、合わせて3人で、出陣する決まりでした。
        card: {head: "25貫文で3人", body: 本人・鑓持ち・指物持ち}
      # fact: ashigaruif-30
      - 語り: 小和田哲男さんは、1977年の静岡大学の論文で、こうした決まりから、1559年ごろの北条の軍勢を、およそ1万人と、計算しています。
      # fact: ashigaruif-29
      - 語り: 武田信玄が、1562年の10月に、家臣に出した、軍役の書状もあります。並ぶのは、長柄の鑓が31本、弓が5張、鉄砲が1挺、持道具が2本、小旗が1本、馬に乗る者が5騎。
        figure: {type: bars, title: 武田信玄の軍役の書状（1562年）, bars: [[長柄の鑓, 31], [弓, 5], [馬に乗る者, 5], [持道具, 2], [小旗, 1], [鉄砲, 1]], labels: [31本, 5張, 5騎, 2本, 1本, 1挺]}
      # fact: ashigaruif-29
      - 語り: 長柄のうち5本は、免除されていましたが、それでも、いちばん多いのは、長い鑓。鉄砲は、たった1挺でした。1977年に、湯本軍一さんが、論文で紹介した書状です。
      # fact: ashigaruif-31
      - 語り: 危ないときには、村の男を、根こそぎ集めました。北条家の動員の決まりでは、15歳から70歳までの男は、身分を問わず出る。弓でも、鑓でも、鉄砲でも、持って来い。
        figure: null
      # fact: ashigaruif-31
      - 語り: 良い者を村に隠したら、村の有力者の首を斬る。人数と武具を改める日が雨なら、来なくてよい。とどまるのは、20日間。
        card: {head: "北条の動員", body: 15〜70歳を根こそぎ}
      # fact: ashigaruif-31
      - 語り: ところが、1587年7月の、北条家の決まりには、良い者を村に残して、荷運びの人夫と変わらない者を差し出す村がある、と書かれています。
        tone: 疑問
      # fact: ashigaruif-37
      - 語り: 手柄で、侍になった百姓もいます。北条五代記によると、1571年の秋、岩井の百姓が、自分で用意した竹槍1本で夜討ちに加わり、侍の首を取りました。
      # fact: ashigaruif-37
      - 語り: 北条氏政は、この百姓を侍にして、岩井兵庫助と名乗らせた、といいます。
      - 語り: もしも、あなたが足軽として集められたら。まず身につけるのは、自分の鎧ではないかもしれません。
        tone: 疑問
      # fact: ashigaruif-33
      - 語り: 南相馬市博物館の、2019年の展示の解説では、足軽は、城などに置かれた御貸具足、足軽胴と呼ばれる、大量に作られた簡単な具足を、着ました。
      # fact: ashigaruif-33
      - 語り: 南相馬の小高神社に残る、江戸時代に作られた御貸具足は、2015年まで、100年近く、相馬野馬追の行列で、使われていました。
        card: {head: "御貸具足", body: 大名が貸した足軽の具足}
      - 語り: では、配られた米を、足軽は、どう持ち歩いたのか。
        hook: true
      # fact: ashigaruif-11
      - 語り: 雑兵物語の最初の教えは、首にかける袋の、結び目の位置でした。
        hook: true

  # ================================================================ 第3章 持ち物と武器
  - title: 「何を持たされる？」　鉄砲と長い鑓
    lines:
      # fact: ashigaruif-04
      - 語り: 雑兵物語の最初の話し手は、鉄砲足軽の小頭、朝日出右衛門です。相方の鉄砲足軽は、夕日入右衛門。朝日が出て、夕日が入る。名前が、対になっています。
      # fact: ashigaruif-04
      - 語り: 弓足軽や、長い鑓の小頭も、役目にかけた、しゃれの名前です。
      # fact: ashigaruif-01
      - 語り: その雑兵物語を、誰が書いたのかは、分かっていません。観光庁の解説は、大名の松平信興の作とされることもあるが、確かではない、と書きます。
      # fact: ashigaruif-01
      - 語り: 図書館の目録にも、松平信興の名に、かっこを付けて載せるものがあります。
      # fact: ashigaruif-02
      - 語り: そもそも、1846年に出た刊本の序は、もとの写本の終わりにも、誰が書いたのかは記されていない、と書いています。
        tone: 疑問
      # fact: ashigaruif-11
      - 語り: 朝日出右衛門の、最初の教えは、首にかけた打飼袋のことです。米を、数珠玉のように結んで入れた袋です。
      # fact: ashigaruif-11
      - 語り: その結び目は、襟の真ん中、うなじのほうへ回せ。胸の前に玉があると、鉄砲が構えられない。
        card: {head: "打飼袋の結び目", body: うなじへ回せ}
      # fact: ashigaruif-12
      - 語り: 鉄砲の狙いは、1町から。およそ109メートルです。馬に乗った敵は、まず馬を撃て。火縄が消えたら、替えの火縄に、取り替えろ。
      # fact: ashigaruif-12
      - 語り: 玉薬を撃ち尽くしたら、刀を抜いて、敵の手足を狙え。兜の正面を打てば、なまくら刀は、鍋のつるのように、曲がってしまう。
      # fact: ashigaruif-21
      - 語り: 玉を運ぶ玉箱持ちは、足軽の失敗を語ります。1発分ずつ筒に詰めておいた火薬が、固まっていて、撃った玉が、5間も飛ばずに、転がった。5間は、およそ9メートルです。
      # fact: ashigaruif-32
      - 語り: 長い鑓は、どれほど長いのか。信長公記によると、若いころの織田信長は、竹槍の叩き合いを見て、槍は短くては悪い、と言い、柄を、3間と、3間半にさせました。
      # fact: ashigaruif-32
      - 語り: 3間半は、およそ6.4メートルです。
        card: {head: "三間半の鑓", body: およそ6.4メートル}
      # fact: ashigaruif-14
      - 語り: その長い鑓を、どう使うのか。長柄の小頭は、こう教えます。鑓は、突くものと思うな。
      # fact: ashigaruif-14
      - 語り: みんなで心を一つにして、穂先をそろえ、拍子を合わせて、上から叩け。突くのは、1人か2人で向き合ったときだけだ。
        tone: 重い
      # fact: ashigaruif-16
      - 語り: 馬の口取りの藤六は、別の心得を語ります。昔、ある陣で、二十日ねずみが1匹逃げて騒ぎになり、5万から6万の大軍が崩れて、10日の道のりを、逃げた。
      # fact: ashigaruif-16
      - 語り: ねずみの何百倍もある馬を放せば、大軍が総崩れになる。だから、馬は、絶対に放すな。
      - 語り: もしもあなたが足軽なら、戦場で、何を食べるのか。
        hook: true
      # fact: ashigaruif-07
      - 語り: 荷物を縛る縄まで、食べ物になりました。
        hook: true

  # ================================================================ 第4章 食べ物
  - title: 「何を食べる？」　米6合と、芋がらの縄
    lines:
      # fact: ashigaruif-56
      - 語り: まず、食べ物は、誰が用意したのか。宣教師のルイス・フロイスは、1585年の、日欧文化比較に、こう書きました。ヨーロッパの王や隊長は、兵に給料を払う。日本では、戦のあいだ、めいめいが、自分の費用で、食べ、飲み、着る。
      # fact: ashigaruif-52
      - 語り: 戦国大名は、兵糧を、兵に自分で用意させた。長くそう考えられてきましたが、1990年代から、この見方は疑われています。
        tone: 疑問
      # fact: ashigaruif-52
      - 語り: 中原寛貴さんが、2023年の論文で紹介する研究では、毛利家は、年貢のほか、石見銀山の銀まで使って兵糧を買い集め、戦場へ送っていました。
      # fact: ashigaruif-05
      - 語り: 雑兵物語では、荷を運ぶ夫丸の馬蔵が、祖父から聞いた、籠城の目安を語ります。
      # fact: ashigaruif-05
      - 語り: 水は、1人1日、1升。米は、1人6合。塩は、10人に1合。味噌は、10人に2合。夜に戦があれば、米は増やす。
        card: {head: "籠城の1人1日", body: 水1升・米6合}
      # fact: ashigaruif-05
      - 語り: 1升は、およそ1.8リットル。米6合は、炊く前で、およそ900グラムです。
      # fact: ashigaruif-53
      - 語り: 江戸幕府の扶持は、1人1日、玄米およそ5合が、基準でした。籠城の目安の6合は、その1.2倍です。
      # fact: ashigaruif-06
      - 語り: その米は、まとめて渡さない。3日か4日分ずつ。5日分より多くは、一度に渡さない。それが古いやり方だ、と馬蔵は言います。
      # fact: ashigaruif-06
      - 語り: 理由は、酒です。まとめて渡すと、酒好きが、米を酒に造って、飲んでしまう。荷を運ぶ係の五蔵も、10日分を渡せば、8日か9日分は、酒にしてしまう、と応じます。
        tone: 重い
      # fact: ashigaruif-07
      - 語り: 五蔵は、もう一つ、知恵を語ります。芋の茎で縄をなって、味噌で煮ておく。それで、荷をからげて来る。
      # fact: ashigaruif-07
      - 語り: いざとなれば、その縄を刻んで水に入れれば、汁の実になる。陣中は飢饉だと思え。松の皮も、よくさらして、粥にして食え。
        card: {head: "芋がらの縄", body: 味噌で煮て、刻めば汁の実}
      # fact: ashigaruif-18
      - 語り: 冒頭の鍋の話は、夫丸の茂助の言葉です。鍋は、足軽から下の者は、頭にかぶっている。
      # fact: ashigaruif-18
      - 語り: 頭の陣笠を、鍋にするのです。腹を壊さないように、飯は、やわらかく炊いてやろう。
      # fact: ashigaruif-09
      - 語り: 梅干の話は、鉄砲足軽の小頭、朝日出右衛門の教えです。戦って息が切れたら、梅干を、ちょっと出して見ろ。なめてもいけない。なめれば、喉が渇く。
      # fact: ashigaruif-09
      - 語り: 梅干は、陣中に1つで、まかなえ。それでも喉が渇くなら、泥の澄んだ上水でも、すすれ。
        tone: 重い
      # fact: ashigaruif-10
      - 語り: 胡椒は、陣にいる日数のぶん持て。夏も冬も、朝に1粒ずつかじれば、冷えにも、暑さにも当たらない。唐辛子をすりつぶして、足の爪先まで塗れば、凍えない。
      # fact: ashigaruif-08
      - 語り: 敵の土地の井戸は、飲むな。底に、糞を沈めてあるからだ。川の水を飲め。これは、五蔵の教えです。
      # fact: ashigaruif-08
      - 語り: 敵の土地では、米や着物を、鍋や釜に入れて、埋めてある。霜の降りた朝は、そこだけ霜が消えている。それを見つけて、掘り出せ。
        card: {head: "霜の消えた所", body: 埋めた米がある}
      # fact: ashigaruif-08
      - 語り: 薪が無ければ、干した馬の糞を、燃やせ。
      - 語り: もしもあなたが足軽なら、何で傷を負うのか。
        hook: true
      # fact: ashigaruif-38
      - 語り: 刀の傷は、思ったより、ずっと少なかった、とされます。
        hook: true

  # ================================================================ 第5章 傷と手当て
  - title: 「何で傷を負う？」　矢と、マムシと、手当て
    lines:
      # fact: ashigaruif-24
      - 語り: 応仁の乱の、大和足軽5人の傷は、5人とも、矢傷でした。
      # fact: ashigaruif-38
      - 語り: 戦った者は、自分の手柄やけがを書いた報告書、軍忠状を出しました。
      # fact: ashigaruif-38, ashigaruif-39, ashigaruif-40
      - 語り: 歴史研究家の鈴木眞哉さんは、2015年の本で、こうした報告書など、およそ2000件の記録から、死傷の原因を数えました。刀による傷は、ごくわずかだった、とされます。
        card: {head: "刀の傷はわずか", body: 約2000件の記録から}
      # fact: ashigaruif-13
      - 語り: 傷は、敵からだけでは、ありません。鉄砲足軽の夕日入右衛門は、長い陣で野山に伏せていると、マムシに噛まれる者が出る、と言います。
      # fact: ashigaruif-13
      - 語り: 噛まれたら、そこに火薬を少し乗せて、火をつけろ。毒が抜ける。遅ければ、効かない。
      # fact: ashigaruif-17
      - 語り: 矢傷や刀傷の、手当ても語られます。風に当てるな。大声、笑い、怒りは、禁物。眠るな。
      # fact: ashigaruif-17
      - 語り: 湯も水も粥も与えず、飯をやわらかく炊いて、食わせろ。傷がうずけば、小便を飲め。
        tone: 重い
      # fact: ashigaruif-54
      - 語り: 戦場の傷を治す医術は、金瘡と呼ばれました。琉球大学の図書館には、1526年のものとされる、金瘡一部之書という書物が、残っています。
      # fact: ashigaruif-48
      - 語り: ただ、医者は、足りませんでした。台湾の歴史学者、羅麗馨さんの2017年の論文では、朝鮮に兵を出したとき、秀吉は、京都と奈良の医師を呼び、1593年の4月に、20人を、各軍へ分けて送りました。
      # fact: ashigaruif-49
      - 語り: ある大名の、700人の部隊には、医師と、書記と、僧が、合わせて5人しか、いませんでした。
        card: {head: "700人の部隊", body: 医師・書記・僧は5人}
      # fact: ashigaruif-48
      - 語り: 医師は50歳以下とされましたが、のちの1597年の出兵では、僧で医師の慶念が、62歳で海を渡り、日記に、老いた体での出陣を、嘆いています。
      # fact: ashigaruif-50
      - 語り: 病も、兵を倒しました。伊達政宗は、手紙に、朝鮮で、腫れの病に苦しむ者は、10人に9人、と書いています。
        tone: 重い
      - 語り: もしもあなたが手柄を立てたら、それは、どうやって数えられるのか。
        hook: true
      # fact: ashigaruif-19
      - 語り: 首の代わりに、鼻を持ち帰った者が、いました。
        hook: true

  # ================================================================ 第6章 首と手柄
  - title: 「手柄はどう数える？」　首と、合言葉
    lines:
      # fact: ashigaruif-44
      - 語り: 漆原徹さんは、2017年の論文で、戦国時代も、首を持ち帰って、首実検をするのが原則だった、と書いています。
      # fact: ashigaruif-19
      - 語り: 雑兵物語の、草履取りの嘉助は、取った首の代わりに、鼻だけを持ち帰りました。
      # fact: ashigaruif-19
      - 語り: すると、旦那に叱られます。鼻だけでは、ひげが無い。男か女かも、分からない。嘉助は、その鼻を、捨てました。
      # fact: ashigaruif-20
      - 語り: 味方に首を取られた、侍の話もあります。合い印をなくし、合言葉も忘れた侍が、敵と間違われて、討たれた。
        tone: 重い
      # fact: ashigaruif-20
      - 語り: 頭にも、額にも、首にも、背中にも、尻にも、印があればよかったのに、と話し手は嘆きます。
      # fact: ashigaruif-15
      - 語り: 冒頭の、むやみに死ぬな、という言葉は、馬の口取りの藤六が、相方の金六に言ったものです。侍は、討ち死にが手柄だと言う。けれど、ただ死ねば、敵が得をして、今までもらった扶持が、無駄になる。
      # fact: ashigaruif-15
      - 語り: 死ぬなら、敵を1人でも倒してからにしろ、と。
      # fact: ashigaruif-42
      - 語り: 1575年、長篠の戦いのあと、織田信長は首実検をして、討ち取った首の一覧、首注文を作り、その写しを、上杉謙信らに送りました。
      # fact: ashigaruif-42
      - 語り: 鉄砲で、多くの武将が倒れ、誰の手柄か、分からない。漆原さんは、鉄砲が、手柄を、個人から集団へ移した、と書きます。
      # fact: ashigaruif-43
      - 語り: 戦国の終わりには、1人1人が出す軍忠状は、姿を消し、部隊全体の損害と戦果をまとめた一覧に、変わっていきました。
      # fact: ashigaruif-45
      - 語り: その一覧の数も、食い違います。1598年、朝鮮での泗川の戦いについて、島津家の文書には、討ち取った首の数が、3万8,717と、3万817の、2通り残っています。
        tone: 疑問
      # fact: ashigaruif-45
      - 語り: 手柄をほめて出された書状、感状には、多いほうの数が書かれました。けれど、実際の数は、少ないほうでした。その差は、7,900です。
      # fact: ashigaruif-46
      - 語り: 首は、きれいに整えられました。関ヶ原のとき、大垣城にいた女性の回想、おあむ物語には、味方が取った首を、天守に集め、札を付け、首に、お歯黒を付けた、とあります。
        card: {head: "おあむ物語", body: 首にお歯黒を付けた}
      # fact: ashigaruif-47
      - 語り: ただ、おあむ物語が書き留められたのは、正徳のころ、1711年からの数年とされます。関ヶ原から、110年あまり後のことです。
      - 語り: そして、もしもあなたが足軽なら、戦場へ行く理由は、手柄だけでは、ありません。
        hook: true
      # fact: ashigaruif-57
      - 語り: 戦場では、人までが、売り買いされたのです。
        hook: true

  # ================================================================ 第7章 乱取りと禁制
  - title: 「なぜ戦場へ行く？」　乱取りと、禁制の値段
    lines:
      # fact: ashigaruif-56
      - 語り: フロイスは、日欧文化比較に、こうも書きました。日本の戦は、ほとんど、小麦や、米や、大麦を、奪うためのものだ。
      # fact: ashigaruif-56
      - 語り: 藤木久志さんは、この言葉を、戦は、生きるために奪いに行くものでもあった、という見方の証しにしました。
      # fact: ashigaruif-57
      - 語り: 1566年の2月。上杉謙信が、常陸の小田城を落とします。
      # fact: ashigaruif-57
      - 語り: 歴史学者の渡邊大門さんが、2021年の本で紹介する記録、別本和光院和漢合運には、謙信の意向で、春のあいだ、人が、20銭、30銭で、売り買いされた、とあります。
        tone: 重い
        card: {head: "1566年 小田城", body: 人が20銭・30銭で売り買い}
      # fact: ashigaruif-58
      - 語り: 九州では、島津勢が豊後で捕らえた人々が、肥後へ売られ、さらに島原へ、転売された、とフロイスの日本史は書きます。
      # fact: ashigaruif-58
      - 語り: 秀吉は、立花宗茂らに、豊後の男女を買い取った分は、買い損として返させよ、と命じました。
      # fact: ashigaruif-59
      - 語り: 秀吉が1587年の夏に出した、11か条の覚えは、日本人を、大唐、南蛮、高麗へ売ることを、罪としています。この覚えの写しは、1933年に、伊勢神宮の神宮文庫で、見つかりました。
      # fact: ashigaruif-60
      - 語り: 藤木さんは、秀吉が人の売り買いを禁じたのは、道徳のためではなく、九州の田畑の働き手が減るのを、防ぐためだった、と見ています。
      # fact: ashigaruif-61
      - 語り: 村や寺は、身を守るため、攻めて来る軍勢から、禁制という札を、手に入れました。乱暴を禁じると約束する札です。
      # fact: ashigaruif-61
      - 語り: 1573年、信長が越前を攻めたとき、敦賀の西福寺は、秀吉を通じて、禁制を求めました。返事は、お礼を持って来れば、すぐに渡す。
      # fact: ashigaruif-61, ashigaruif-62
      - 語り: 藤井讓治さんが、2017年の論文で紹介した書状です。
      # fact: ashigaruif-62
      - 語り: 禁制には、値段の決まりまで、ありました。1590年、秀吉が石田三成に出した掟では、村の格で、上は永楽銭3貫200文、中は2貫200文、下は1貫200文。ほかに、筆の代が200文。
        figure: {type: bars, title: 禁制の値段（1590年の掟）, bars: [[上の村, 3200], [中の村, 2200], [下の村, 1200]], labels: [3貫200文, 2貫200文, 1貫200文]}
      # fact: ashigaruif-63
      - 語り: それでも、連れ去られた人は、村が身代金を払って、取り戻さなければなりませんでした。
        figure: null
      # fact: ashigaruif-68
      - 語り: 牧英正さんの研究では、徳川幕府が、人の売り買いを禁じた最初の法は、1616年。かどわかして売った者は、死罪です。
      - 語り: では、もしもあなたが足軽なら、何を覚えて、生きて帰ればよいのか。
        hook: true
      # fact: ashigaruif-09
      - 語り: 答えは、あの梅干の教えに、戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしも戦国の足軽になったら
    lines:
      - 語り: もしも、今の私たちが、戦国の足軽になったら。
      # fact: ashigaruif-11, ashigaruif-06
      - 語り: 首には、米を結んだ打飼袋。結び目は、うなじへ。米は、3日か4日分ずつ。
      # fact: ashigaruif-18, ashigaruif-09
      - 語り: 鍋は、頭の陣笠。梅干は、見るだけ。
      # fact: ashigaruif-14, ashigaruif-12
      - 語り: 長い鑓は、突かずに、皆で叩く。馬に乗った敵は、まず馬を撃つ。
      # fact: ashigaruif-17
      - 語り: 傷を負えば、眠るな、小便を飲め。
      # fact: ashigaruif-15
      - 語り: そして、むやみに死ぬな。
        tone: 重い
      # fact: ashigaruif-22
