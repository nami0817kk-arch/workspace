# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と nagaya-if-story.yaml の型）。もしも現代人が戦国の足軽になったら。2026-11-22 下書き。
# 公開の予定は 11/29 12:00（12時の もしも 枠）。型は docs/story-main.md「00. 伸びる型」の もしも×暮らし（「もしあなたが江戸に」の形。長屋の回と同じ）。
#   歴史の分岐の if ではない。「もしも」は入口と章の頭の問いだけで、中身は記録に残る言葉と研究だけ（想像の台詞・作った筋・架空の人物なし）。
#   背骨は『雑兵物語』（弘化3年＝1846年の刊本 上下2巻、国立国会図書館デジタルコレクション pid 2583523・2583524 の全文で本文を確かめた）。
#   冒頭（10秒以内）＝梅干は食べるな、なめるな、見るだけにしろ。米は3〜4日分ずつ（まとめて渡すと酒に造る）。鍋は頭の陣笠。むやみに死ぬな、扶持が無駄になる。
#   序章 梅干は見るだけ／第1章 足軽は悪党だった（応仁の乱）／第2章 雨なら来なくてよい（集め方）／第3章 何を持たされる（鉄砲と長い鑓）／
#   第4章 何を食べる（米6合と芋がらの縄）／第5章 何で傷を負う（矢・鉄砲・手当て）／第6章 手柄はどう数える（首と合言葉）／第7章 なぜ戦場へ行く（乱取りと禁制）／まとめ。
#   締めは余韻の一文＋登録のお願い（story: true）。
# 既出と重ねない：関ヶ原if（sekigahara-if）・長篠if（nagashino-if）は合戦の分岐の回。こちらは合戦の勝ち負けに触れない。足軽・雑兵物語の回は過去に無い（posted.json と scripts/ を grep で確認）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/戦国の足軽if_facts_20261122.yaml、担当A=雑兵物語の本文・B=身分と集め方・C=傷と食と病・D=乱取りと禁制）にあるものだけ。行の上に `# fact: ashigaruif-09`。
# 記録の食い違い（3つ）：①作者（観光庁の解説・図書館の目録の「[松平信興]著」／刊本の序「奥書に誰の書いたものか無い」）
#   ②兵糧（フロイス 1585「日本では各自が自分の費用で食べる」／中原寛貴 2023「毛利は銀で兵糧を買い集めて送った。自弁説は1990年代から疑われている」）
#   ③泗川の戦いの首の数（島津家文書の首注文 38,717／30,817、感状は多い方・実数は少ない方）。
# 自分で計算した数（全部計算し直した）：
#   応仁の乱 1467〜1477＝足かけ11年。1間＝約1.818m：3間＝5.45m、3間半＝6.36m→約6.4m、5間＝9.09m→約9m。1町＝60間＝109.1m→約109m。
#   1升＝約1.8L。米6合＝1合150gとして900g。玄米5合の扶持と比べて 6÷5＝1.2倍。泗川 38,717−30,817＝7,900。
#   雑兵物語の成立 1657〜1683：関ヶ原（1600）から57〜83年、大坂の陣（1615）から42〜68年。おあむ物語 正徳（1711〜16）：関ヶ原から111〜116年→110年あまり。
#   禁制の値 上3貫200文＝3,200文・中2,200文・下1,200文（1貫＝1,000文）。円への換算はしない（物差しで大きく変わるため）。
# 確かめられなかったこと（台本では言わない）：鈴木眞哉の傷の割合の数字（刀疵0.67%・鉄砲疵45%などは原著未見）・コンランの南北朝の割合・上杉家軍役帳の数・
#   大坂の陣の蜂須賀勢の捕虜の内訳・藤木の「端境期の出陣」・死人の血（本文にはあるが入れない）・「ちつなひ玉」の意味。
# 読みが確かでない名：朝日出右衛門（あさひいでえもん）・夕日入右衛門（ゆうひいりえもん）は役目にかけた洒落の名。readings.yaml に足して kana で確かめる。
# 絵：AI 絵（Gemini。一覧は scripts/story/ashigaru_if_main_look.yaml の頭）だけ。実在の人物の顔は描かない。字・家紋・旗の字は描かない。人の死・傷の細部は描かない。
