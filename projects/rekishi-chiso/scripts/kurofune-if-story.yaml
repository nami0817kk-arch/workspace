# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と genkou-if-story.yaml の型）。黒船（もしもシリーズ）。2026-10-31 下書き。
# 公開の予定は 11/4 12:00（昼＝B作品のif）。
# 型：1本に1つの「なぜ」＝「もしもペリーが来なかったら、日本は、いつ、誰に、どんな形で開いたのか」。語り手は剣崎1人（つむぎは出ない）。想像の台詞は入れない。
#   冒頭（10秒以内）＝黒船の提督ペリーは、この遠征の「代役」（2人目の司令官）だった。1851年、1人目の提督オーリックのために国書が用意されていた。
#   （「日本に送られた2人目の提督」とは言わない。1846年のビッドルも交渉に送られた提督で、事実の確認で指摘された）
#   導入では答えを言い切らない。最後に「言えること／言えないこと」を分けて出す。
#   第1章 7年前、浦賀の沖で何があったのか（1845年マンハッタン号・1846年ビッドル艦隊。警備船約400隻、滞在日数・返答・突かれた逸話が記録で割れる）／
#   第2章 幕府は、開く気があったのか（1842年薪水給与令・1844年オランダ国王の親書・1845年の返書。親書は「開国勧告」か「探り」か＝松方冬子さんの説）／
#   第3章 オランダは、なぜペリーの来航を知らせたのか（1852年。中立を守るため。1851年には黙っていた）／
#   第4章 石炭が、ペリーを動かした（出航の経緯・石炭の壁・小笠原・訓令・白旗の食い違い）／
#   第5章 国書は、日本中に回された（久里浜・阿部正弘の諮問・島津斉彬の上書・品川台場・狂歌）／
#   第6章 ロシアとイギリスは、いつ来たのか（プチャーチン・ディアナ号の津波・スターリング・日英約定）／
#   第7章 ペリーが来なかったら、何が言えるのか（研究者の見方・条約の中身・オランダの総督の言葉）／まとめ（言えること／言えないこと→冒頭に戻る）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/黒船_facts_20261031.yaml、kurofune-if-03〜75）にあるものだけ。行の上に `# fact: kurofune-if-NN`。
#   kurofune-if-01・02 は調べの種の行で出どころが無い（使わない）。誰でも知る前置き（ペリー来航・日米和親条約・開国）は短く使い、# fact を付けない。
#   国書・訓令・『日本遠征記』・フォスター（1903）・松方冬子さんの論文（2011の英訳）・条約の本文は、本文を開いて確かめた出どころ。
#   書誌止まり・単独の出どころ・解説サイトだけのもの（719通の数・狂歌の最古の書簡・四藩の反対・75万両）は台本に入れない。
#   三谷博さんの55家の分類は解説記事の引用で、本人の論文は未見＝「解説記事によれば」と出どころを言う。
#   確かめられなかったこと：三谷博『ペリー来航』の本文／「ペリーが来なくても数年内に誰かが来た」と本人が書いた研究／ビッドルの公式報告の全文／日本側の浦賀奉行・老中の書付の原文／白旗の原本。台本では言い切らない。
#
# 絵：paintings/ の sakoku_perry_*（ペリー来航の瓦版・海陸御固泰平鑑・ペルリ像・合衆国水師提督口上書。パブリックドメイン）＋ AI 絵（K01〜K15、一覧は dev/output/rekishi-chiso/research/kurofune_ai_images.md）。
#   AI 絵の人物は描かない（遠景の船・海・浜・港の景色だけ）。実在の人物（ペリー・ビッドル・阿部正弘ほか）の顔は AI で描かない。顔が分かるのは実在の絵だけ。
# 広告の配慮：戦闘・負傷・死の場面は描かない（津波は町と海の景色だけ・人は描かない）。
