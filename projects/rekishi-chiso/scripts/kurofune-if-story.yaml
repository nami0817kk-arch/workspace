  name: 黒船
  lead: ペリーは
  main: 代役だった
  # 2段：上に小さい問い（lead）、下に特大の一言（main）。絵は仮（作ってから目で見て合わせる）。サムネは確認の関門（人が見る）。

sections:
  # ================================================================ 序章（冒頭 約2分30秒）
  - title: 「黒船の提督は、代役だった」　1851年
    background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K01（夜明けの江戸湾の入り口。沖に大きな船の影。人物なし）
    year: 1851
    lines:
      # fact: kurofune-if-28, kurofune-if-30
      - 語り: 黒船の提督ペリーは、実は、この遠征の《代役》でした。
        tone: 重い
        card: {head: "1851年", body: 1人目の司令官に、国書が用意された}
      # fact: kurofune-if-28, kurofune-if-30
      - 語り: 1851年。アメリカの国務長官は、別の提督に日本との交渉を任せ、国書を用意していました。
      # fact: kurofune-if-28
      - 語り: ペリーが久里浜で渡した国書は、その2通目です。1通目は、その1年半前に、もう書き上がっていました。
        card: {head: "2通の国書", body: 1851年5月10日と1852年11月13日}
      # fact: kurofune-if-28
      - 語り: 国務長官のウェブスターは、提督のオーリックに宛てた1851年6月10日の命令書で、日本の石炭を、神が日本の島々の地中に置いた贈り物、と呼びました。
      - 語り: 日本の石炭を、神の贈り物と呼ぶ。アメリカが日本へ向かう理由のひとつは、最初から、文書に書かれていたのです。
        tone: 重い
      # fact: kurofune-if-30
      - 語り: ところが、オーリックは解任されて、あとを継いだのがペリーでした。
      # fact: kurofune-if-28, kurofune-if-30
      - 語り: つまり、ペリーでなくても、日本へ向かう遠征は、1851年に、すでに決まっていました。
      # fact: kurofune-if-14, kurofune-if-15
      - 語り: しかも、アメリカの軍艦は、それ以前に一度、浦賀に来て、断られて帰っています。1846年のことです。
        tone: 疑問
      # fact: kurofune-if-14
      - 語り: 浦賀の沖に入った艦隊を、日本の警備船が取り囲みました。その数は、ペリーの公式記録『日本遠征記』によると、約400隻です。
        card: {head: "1846年", body: 警備船が約400隻}
      # fact: kurofune-if-15
      - 語り: 『日本遠征記』によると、艦隊は10日ほど浦賀にいて、誰も上陸せず、何も得られないまま、帰りました。
      # fact: kurofune-if-20
      - 語り: その前の年、1845年には、日本人を無事に送り届けたアメリカの捕鯨船が、「二度と日本へ来るな」と追い返されています。フォスターという外交官が、1903年の本に書いた話です。
        tone: 重い
      - 語り: ペリーより前に、アメリカの船は何度も来ていて、少なくとも2回は、江戸湾で断られていました。
      - 語り: もし、ペリーが来なかったら。日本は、いつ、誰に、どんな形で開いたのか。
        tone: 疑問
        hook: true
      - 語り: その答えを考える前に、まず、7年前の浦賀の沖へ行きます。
        hook: true

  # ================================================================ 第1章 7年前、浦賀の沖で
  - title: 「7年前、浦賀の沖で何があったのか」　1845年から1846年
    background: {image: paintings/sakoku_perry_coastal_defense_kawaraban.jpg, credit: "瓦版「海陸御固泰平鑑」（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K02（朝の江戸湾。沖に2隻の大きな帆船の影。人物なし）／K03（湾を囲む、小さな無地の舟の群れの遠景。人物なし）
    year: 1846
    lines:
      # fact: kurofune-if-14
      - 語り: 1846年7月、浦賀の沖に、アメリカの軍艦が2隻、入りました。戦列艦のコロンバス号と、小型の軍艦のヴィンセンス号です。
        card: {head: "1846年7月", body: コロンバス号とヴィンセンス号が浦賀沖へ}
      # fact: kurofune-if-19
      - 語り: 提督はビッドル。最近の英語の研究書は、艦隊が、100門を超える大砲を積んで江戸湾に入った、と述べています。
      # fact: kurofune-if-14
      - 語り: すぐに、日本の警備船が取り囲みました。約400隻。『日本遠征記』は、そう書いています。
      # fact: kurofune-if-15
      - 語り: ここで、記録が割れます。この艦隊が浦賀にいた日数は、書き手によって違うのです。
        tone: 疑問
        figure: {type: stats, title: ビッドル艦隊が浦賀にいた日数, items: [[『日本遠征記』（1856）, 10日], [同じ本の別の頁, 8から10日], [1848年の石版画の展示文, 9日間]], upto: 3}
      # fact: kurofune-if-15
      - 語り: 1903年にアメリカの外交官フォスターが書いた本は、7月20日に錨を下ろし、日本側の返答が渡されたのは27日、と書いています。
        figure: null
      # fact: kurofune-if-16
      - 語り: ビッドルが尋ねたのは、通商ができるかどうかでした。『日本遠征記』は、日本側の返答を「オランダ以外のどの国とも、通商は許されない」と記しています。
      # fact: kurofune-if-16
      - 語り: 同じ返答を、フォスターは、外国人が受け入れられるのは長崎だけ、という趣旨で書いています。
      # fact: kurofune-if-17
      - 語り: もうひとつ、食い違う話があります。ビッドルが、日本の兵に突かれた、という逸話です。
        tone: 疑問
      # fact: kurofune-if-17
      - 語り: フォスターは、ビッドルが日本の兵に一撃か突きを受け、日本側が謝罪した、と記します。『日本遠征記』には、この話が見当たりません。
      # fact: kurofune-if-17
      - 語り: 2007年のニューヨーク・レビュー・オブ・ブックスの書評は、2つの版を並べています。ビッドルは侮辱と受け取り、日本側は、ビッドルが別の船に乗り込んだのだと説明した、というのです。
        tone: 重い
      # fact: kurofune-if-15
      - 語り: 結末は、どの記録でも変わりません。『日本遠征記』には、10日いても誰も上陸せず、何も得られなかった、とあります。
        tone: しみじみ
      # fact: kurofune-if-19
      - 語り: ただ、日本が何も変えなかったわけではありません。先ほどの研究書は、老中首座の阿部正弘が、江戸湾の防備を急いだ、と書いています。
      # fact: kurofune-if-20
      - 語り: ビッドルの前の年、1845年には、アメリカの捕鯨船マンハッタン号が、小笠原で救った日本人22人を、江戸湾へ送り届けています。
        card: {head: "1845年", body: 日本人22人を送り届けた捕鯨船}
      # fact: kurofune-if-20
      - 語り: フォスターは、船が1000隻近い日本の船に囲まれ、4日間の滞在を許されたと書きます。江戸の奉行の返事は、「オランダの港へ運べ。二度と日本へ来るな」でした。
        tone: 重い
      - 語り: 日本人を無事に連れてきても、断られる。幕府は、本当に、開く気がなかったのでしょうか。
        tone: 疑問
        hook: true
      - 語り: その手がかりが、1842年の法令に残っています。
        hook: true

  # ================================================================ 第2章 幕府は開く気があったのか
  - title: 「幕府は、開く気があったのか」　1842年から1845年
    background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K04（古い日本の港の石段と、無地の帆の小舟。人物なし）／K05（海に面した広い座敷の障子と、書状を置いた文机。人物なし）
    year: 1842
    lines:
      # fact: kurofune-if-11
      - 語り: 1842年8月28日、幕府は、異国船打払令をやめて、薪水給与令を出しました。
        card: {head: "1842年8月28日", body: 異国船打払令をやめ、薪水給与令を出す}
      # fact: kurofune-if-11
      - 語り: 1825年の打払令は、国立公文書館の展示によると、一切無差別に砲撃を加えよ、という命令でした。
      # fact: kurofune-if-11
      - 語り: きっかけとみられるのは、その年の7月20日付の、オランダ商館長ビクの知らせです。アヘン戦争が終われば、イギリスが日本へ艦隊を送る、という内容でした。
      # fact: kurofune-if-25
      - 語り: 幕府の方針は、何度も揺れています。1806年に緩め、1825年に強め、1842年に、再び緩めました。
        figure: {type: stats, title: 外国船への方針は3回揺れた, items: [[薪水給与令, 1806年, 漂流船には薪水を与える], [異国船打払令, 1825年, 一切無差別に砲撃], [薪水給与令, 1842年, 再び緩める]], upto: 3}
      # fact: kurofune-if-04
      - 語り: 1844年、オランダ国王ウィレム2世が、将軍に親書を送りました。2月15日付で、8月15日に、長崎に着いています。
        figure: null
        card: {head: "1844年", body: オランダ国王が将軍に親書を送る}
      # fact: kurofune-if-04
      - 語り: 歴史学者の松方冬子さんによると、親書の原本は失われていて、口調は、上から下へ書いたような、高圧的なものでした。
      # fact: kurofune-if-06
      - 語り: 国立国会図書館の解説には、この親書に、シーボルトの助言もあった、とあります。
      # fact: kurofune-if-05
      - 語り: オランダ政府は、特使を送るはずでしたが、財政難でやめて、長崎の商館長が渡すだけになりました。
      # fact: kurofune-if-03, kurofune-if-07
      - 語り: この親書は、長く、日本に開国を勧めた手紙だと言われてきました。ところが、松方さんは、勧告はごく控えめで、主な狙いは別にあった、と論じています。
        tone: 疑問
      # fact: kurofune-if-03, kurofune-if-07
      - 語り: 親書に、具体的な開港の案はありません。主な狙いは、1842年の薪水給与令が、小さな譲歩なのか、鎖国をやめる一歩なのか、幕府の出方を探ることだった、と松方さんは書きます。
        figure: {type: stats, title: 1844年の親書は何だったのか, items: [[従来の見方, 開国を勧める手紙], [松方冬子さん, 出方を探る手紙]], upto: 2}
      # fact: kurofune-if-08
      - 語り: 幕府の返答は、1845年7月5日付です。将軍ではなく、老中が連名で出し、国王への返事は祖法に反する、今後の親書は開封せずに返す、という内容でした。
        figure: null
        card: {head: "1845年7月5日", body: 今後の親書は開封せずに返す}
      # fact: kurofune-if-09
      - 語り: 松方さんは、この返書を、使者を送り合う朝鮮・琉球と、商売だけを許すオランダ・中国、そのほかとは付き合わない、という祖法を、最もはっきり文章にしたものだ、と位置づけています。
      # fact: kurofune-if-12
      - 語り: その後も、方針は変わりません。1850年には、長崎奉行が商館長に、薪水給与令は人道的な措置にすぎず、祖法は変わらない、と各国へ伝えさせています。
      - 語り: 薪水は渡す。けれど、新しい国とは、付き合わない。幕府の方針は、書面でそこまで固まっていました。
        tone: 重い
      - 語り: アメリカが断られたのも、この方針の延長でした。そんなとき、思わぬ所から、予告が届きます。
        tone: 疑問
        hook: true
      - 語り: 1852年。差出人は、オランダでした。
        hook: true

  # ================================================================ 第3章 オランダはなぜ知らせたのか
  - title: 「オランダは、なぜ黒船の来航を知らせたのか」　1852年
    background: {image: paintings/sakoku_perry_adams_portraits.jpg, credit: "「合衆国水師提督口上書」（1854年ごろの版画。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K06（長崎の入り江の石畳と、文机に置いた書状。人物なし）
    year: 1852
    lines:
      # fact: kurofune-if-13
      - 語り: 実は、オランダは、一度は、風説書に書かないことにしていました。松方さんの論文によると、1851年6月7日のことです。
        card: {head: "1851年6月7日", body: オランダは、アメリカの計画を伏せると決めた}
      # fact: kurofune-if-13
      - 語り: バタヴィアの総督府、今のジャカルタにあったオランダの役所は、アメリカの計画を、日本人に無用の不安を与えないため、伏せると決めています。
      # fact: kurofune-if-70, kurofune-if-40
      - 語り: それが、1852年4月17日の協議で変わります。アメリカが日本と衝突すれば、イギリスも黙っていない。そうなれば、中立のオランダも巻き込まれる。オランダ政府は、それを恐れました。
      # fact: kurofune-if-70
      - 語り: ヘルマン・モースハルトさんは、オランダが恐れたのは、衝突に巻き込まれて、日本での自分の立場を失うことで、外交の柱は中立だった、と書きます。日本のためというより、自分の国のための知らせでした。
        tone: しみじみ
      # fact: kurofune-if-40
      - 語り: 新しい商館長ドンケル・クルチウスは、1852年7月21日に長崎へ着きました。持ってきた書簡を、長崎奉行は、一度、受け取りませんでした。
      # fact: kurofune-if-40
      - 語り: 受け取ったのは、9月です。11月2日、クルチウスは、幕府がこの件を終わったものとみなす、と伝えられます。そのあと、内々の話し合いで、条約案の要旨を渡しました。
        card: {head: "1852年11月2日", body: 幕府が、この件は終わりだと伝える}
      # fact: kurofune-if-40
      - 語り: ワシントンのオランダ公使の知らせは、重要な海軍力が日本へ向かう、というものでした。
        tone: 重い
      # fact: kurofune-if-40
      - 語り: オランダ商館長は、毎年、海外の情報を幕府に報告していました。別段風説書です。東京大学の解説によると、1840年から1857年まで、提出されています。
      - 語り: 予告は、確かに届いていました。幕府は、オランダの申し出には、取り合いませんでした。
        tone: 重い
      - 語り: ペリーは、その間に、どこで何をしていたのか。
        tone: 疑問
        hook: true
      - 語り: アメリカの艦隊は、石炭が足りずに、苦しんでいました。
        hook: true

  # ================================================================ 第4章 石炭がペリーを動かした
  - title: 「石炭が、ペリーを動かした」　1852年から1853年
    background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K07（夜の港の石炭の山と、黒い煙を上げる大きな船の影。人物なし）／K08（南の島の入り江と、岸の小さな木造の小屋の遠景。人物なし）／K09（朝の大海原を進む、煙を上げる大きな船の影。人物なし）
    year: 1852
    lines:
      # fact: kurofune-if-31
      - 語り: 1852年11月24日、蒸気船ミシシッピ号は、仲間の船を待たずに、ノーフォークを出航しました。
        card: {head: "1852年11月24日", body: ミシシッピ号が単独で出航}
      # fact: kurofune-if-31
      - 語り: いっしょに行くはずだった船が、ボイラーの不良で使えず、別の船に替えたためです。『日本遠征記』には、司令官は遅れに嫌気がさし、これ以上待つ気がなかった、とあります。
      # fact: kurofune-if-32
      - 語り: 当初の計画は、もっと大きなものでした。74門の戦列艦を含む艦隊の案が、『日本遠征記』にあります。実際に浦賀に着いたのは、4隻でした。
      # fact: kurofune-if-29
      - 語り: ペリーへの訓令のもとになった、1852年11月5日付の国務省の書簡は、任務は平和的で、自衛以外では武力に訴えない、と書きます。
      # fact: kurofune-if-29
      - 語り: ただし、難破した人々への非人道的な扱いが続くなら、口調を変えて、断固として求めよ、ともあります。
      # fact: kurofune-if-27
      - 語り: フィルモア大統領の国書も、蒸気船が、カリフォルニアから日本まで18日で行けること、大量の石炭を燃やすことを、並べています。
      # fact: kurofune-if-27
      - 語り: アメリカ国務省の歴史局は、動機として、石炭の補給地、捕鯨船や難破船のための港、太平洋の航路の増加などを挙げています。
        figure: {type: stats, title: アメリカが日本へ向かった主な理由, items: [[石炭の補給地, 蒸気船], [避難・補給の港, 捕鯨船], [航路の増加, 太平洋]], upto: 3}
      # fact: kurofune-if-34
      - 語り: 往路で、艦隊を苦しめたのは、石炭です。セイロンのポイント・ド・ガルでは、イギリスの汽船会社が、外国の軍艦には1トンも売るな、と厳命していました。
        figure: null
        tone: 重い
      # fact: kurofune-if-34
      - 語り: シンガポールでは、石炭を1ポンドも買えませんでした。いずれも、『日本遠征記』にある話です。
      # fact: kurofune-if-33
      - 語り: 石炭の消費は、ジョン・ダワーさんの解説によると、1854年の再来のとき、ミシシッピ号で1時間に約1トン、2336ポンドです。蒸気船は、帆も張って節約しました。
        figure: {type: stats, title: 1時間の石炭の消費（1854年）, items: [[ミシシッピ号, 2336ポンド], [サスケハナ号, 3310ポンド], [ポウハタン号, 3248ポンド]], upto: 3}
      # fact: kurofune-if-39
      - 語り: だから、ペリーは、石炭を置く場所を、先に押さえました。1853年6月、小笠原の父島で、初期の入植者のひとり、セイヴァリーから、土地を買っています。
        figure: null
        card: {head: "1853年6月", body: 小笠原の父島で土地を買う}
      # fact: kurofune-if-39
      - 語り: 父島に住んでいたのは、31人ほど。ペリーが想定したのは、カリフォルニアと中国を結ぶ蒸気船の、石炭置き場でした。
      # fact: kurofune-if-36, kurofune-if-47
      - 語り: 1853年7月8日。ペリーは、4隻で浦賀の沖に着きました。『日本遠征記』は、長崎を、意図的に避けた、と書きます。
        card: {head: "1853年7月8日", body: 4隻で浦賀沖に着く（嘉永6年6月3日）}
      # fact: kurofune-if-37
      - 語り: 有名な話があります。ペリーは、白旗を2本渡し、戦うなら、これを揚げよ、と書き添えた、というものです。
        tone: 疑問
      # fact: kurofune-if-37
      - 語り: この説明書きの根拠として教科書が引いたのは、日本側の文書、『大日本古文書』の幕末外国関係文書之一の、第119号です。編者自身が、疑問の印を付けています。
      # fact: kurofune-if-37
      - 語り: 2002年7月、宮地正人さんら日本の歴史学者3人は、この書簡はアメリカ側に存在せず、噂を役人が後で書き留めたものだろう、と声明を出しました。
        figure: {type: stats, title: 白旗をめぐる記録, items: [[日本側の文書, 「戦うなら揚げよ」の説明書き], [斉昭の書簡, 和を結ぶ意思を示す白旗], [学者3人の声明, アメリカ側に存在せず]], upto: 3}
      # fact: kurofune-if-38
      - 語り: 別の記録には、白旗は和を求める印だった、とあります。徳川斉昭の1853年8月7日付の書簡を、解説が伝えています。
        figure: null
      - 語り: 白旗ひとつにも、書き手によって、意味が違う。ペリーの国書を前にした日本は、さらに割れていきました。
        tone: 疑問
        hook: true
      - 語り: 阿部正弘は、国書を、日本中に回します。
        hook: true

  # ================================================================ 第5章 国書は日本中に回された
  - title: 「国書は、日本中に回された」　1853年
    background: {image: paintings/sakoku_perry_coastal_defense_kawaraban.jpg, credit: "瓦版「海陸御固泰平鑑」（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K10（江戸湾の海岸線に並ぶ、埋立て途中の小さな島の遠景。人物なし）／K11（朝の久里浜の砂浜。白い砂の遠景。人物なし）
    year: 1853
    lines:
      # fact: kurofune-if-48
      - 語り: 浦賀では、奉行所の役人が、奉行の身代わりとして黒船に乗り込みました。通詞の堀達之助が、最初に口を開いたと、『日本遠征記』は伝えます。
        card: {head: "1853年7月", body: 役人が奉行の身代わりとして乗り込む}
      # fact: kurofune-if-49, kurofune-if-50
      - 語り: 国書が受け取られたのは、7月14日。場所は、浦賀に隣り合う久里浜でした。上陸したアメリカ側は、海兵隊と水兵と楽隊を合わせて、約300人です。
        card: {head: "1853年7月14日", body: 久里浜で国書を受け取る（嘉永6年6月9日）}
      # fact: kurofune-if-50
      - 語り: 浦賀奉行は、日本側の兵力を5000人と告げた、と『日本遠征記』にあります。
      # fact: kurofune-if-51
      - 語り: 受け取った親書を、阿部正弘は、国立国会図書館の解説によると、諸侯に示し、意見を募りました。
        card: {head: "1853年夏", body: 国書を諸大名に示し、意見を求める}
      # fact: kurofune-if-52
      - 語り: 大名の意見は、どう割れたのか。三谷博さんの分類を引いた解説記事によると、隠居や世子を除く55家のうち、通商を積極的に認めたのは、佐倉・彦根・福岡の3家だけです。
      # fact: kurofune-if-52
      - 語り: はっきり断るべきだとしたのは、24家。約43パーセントです。残りの28家は、そのどちらでもない答えでした。
        figure: {type: stats, title: 大名55家の意見（三谷博さんの分類を引いた解説）, items: [[積極的に認めた, 3家, 佐倉・彦根・福岡], [断るべきだとした, 24家, 約43パーセント], [その他, 28家]], upto: 3}
      # fact: kurofune-if-53
      - 語り: 薩摩の島津斉彬の上書は、3年ほどの猶予があれば、海防を整えられる、という内容でした。新名一仁さんらの『島津氏』によると、藩の原案の4つの項目は、幕府に出す前に消されています。
        figure: null
      # fact: kurofune-if-53
      - 語り: 軍資金を幕府が負担すること。軍艦を造ること。軍備が整ったあとの通商の許可。ロシアやアメリカとの、数年の通商の試行。本音は、8月29日付の、水戸の徳川斉昭への書状に残りました。
      # fact: kurofune-if-55
      - 語り: 広く意見を求めたことは、「言路洞開」、つまり、意見を聞く道を開いた、と言われます。
        tone: しみじみ
      # fact: kurofune-if-56
      - 語り: 備えも、急がれました。品川沖の台場は、計画が11基。嘉永6年に3基が着工し、完成したのは6基です。残りは、未完成か未着手に終わりました。
        figure: {type: stats, title: 品川台場の計画と結果, items: [[計画, 11基, のち12基], [嘉永6年に着工, 3基], [完成, 6基, 未完成2基・未着手4基]], upto: 3}
      # fact: kurofune-if-56
      - 語り: 埋立ての土は、御殿山などを切り崩して採りました。数え方は資料で割れ、港区の資料は、着工を7基と数えています。
        figure: null
      # fact: kurofune-if-58
      - 語り: 同じ年の9月には、大船建造の禁が、解かれたとされます。ペリーの到着から、3か月もたっていません。
      - 語り: この年の騒ぎは、狂歌にも残りました。「太平の眠りを覚ます上喜撰、たった四杯で夜も寝られず」です。
        card: {head: "狂歌", body: 太平の眠りを覚ます上喜撰}
      - 語り: 上喜撰は、高級なお茶の名前です。蒸気船と音が似ていて、お茶を四杯飲むと眠れなくなる、に、黒船の四杯を掛けた歌です。
      # fact: kurofune-if-46
      - 語り: 「四杯」は黒船が4隻、という意味ですが、蒸気船は、サスケハナ号とミシシッピ号の2隻だけです。残りのプリマス号とサラトガ号は、帆船でした。
        tone: しみじみ
      # fact: kurofune-if-45
      - 語り: 作者を老中の間部詮勝とする資料に、1917年の『久里浜村誌』があります。ただし、何を根拠にしたかは書かれていません。国立国会図書館の調べです。
      - 語り: この慌ただしい日本の外で、もうひとつの艦隊が、動いていました。ロシアです。
        tone: 疑問
        hook: true
      - 語り: ペリーの来航から、1か月半ほどあとのことです。
        hook: true

  # ================================================================ 第6章 ロシアとイギリスはいつ来たのか
  - title: 「ロシアとイギリスは、いつ来たのか」　1853年から1855年
    background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K12（冬の入り江の港町の、静かな朝。人物なし）／K13（長崎の港を見下ろす山の斜面と、遠くの帆船の影。人物なし）／K14（建造中の小さな木造船の骨組みと、削りくずが積まれた浜。人物なし）
    year: 1853
    lines:
      # fact: kurofune-if-61, kurofune-if-60
      - 語り: ロシアのプチャーチンの艦隊が長崎に着いたのは、旧暦の嘉永6年7月18日、西暦の8月22日ごろです。ペリーの約1か月半後でした。
        card: {head: "1853年8月", body: プチャーチンが長崎へ来る}
      # fact: kurofune-if-61
      - 語り: 文化庁の解説は、国書の手交を、嘉永6年8月19日としています。
      # fact: kurofune-if-64
      - 語り: ロシアは、ペリーに無い目的を持っていました。国境です。
      # fact: kurofune-if-62
      - 語り: 交渉は、1854年12月22日に、下田で始まりました。その翌日、12月23日。安政東海地震の津波が、下田を襲います。
        tone: 重い
      # fact: kurofune-if-62
      - 語り: 下田市の資料によると、841戸が全壊し、流れ出ました。無事だったのは、高台の4戸だけです。港にいたロシアの軍艦ディアナ号は、渦に巻かれて、何十回も回転した、と伝わります。
        card: {head: "1854年12月23日", body: 下田の841戸が全壊・流出}
      # fact: kurofune-if-63
      - 語り: ディアナ号は、修理のために戸田へ向かう途中で沈みました。雑誌 Russian Life は、ロシア人技師の図面をもとに、日本の船大工が、約2か月半で、洋式の帆船ヘダ号を造った、と書いています。
        tone: しみじみ
      # fact: kurofune-if-64
      - 語り: 日露和親条約は、1855年2月7日の調印です。択捉島は日本、得撫島から北の千島はロシアと決めました。
        card: {head: "1855年2月7日", body: 日露和親条約。国境は択捉島と得撫島のあいだ}
      # fact: kurofune-if-64
      - 語り: 樺太は、境を分けず、これまでどおりとされました。貿易を定める条文は無く、開かれたのは、箱館・下田・長崎の3港です。
      # fact: kurofune-if-60
      - 語り: 同じ雑誌は、プチャーチンは、ペリーのやり方に従え、と指示されていた、と伝えます。
        tone: 疑問
      # fact: kurofune-if-43
      - 語り: イギリスは、日米和親条約の約5か月半後、1854年9月に、スターリング提督が長崎に来ました。
      # fact: kurofune-if-43
      - 語り: イギリスとロシアは、その年の3月から、クリミア戦争の最中でした。ロシア艦を捜す英国の艦が動き、スターリングの来航は、その流れの中でした。
      # fact: kurofune-if-66
      - 語り: 日英約定は、10月14日に調印されます。歴史家のビーズリーさんは、本国の外務省の権限も知識も無いまま結ばれた、と評しています。
        card: {head: "1854年10月14日", body: 日英約定。外務省の権限も知識も無いまま}
      # fact: kurofune-if-67
      - 語り: 英語側の通訳は、漂流民だった日本人、音吉でした。スターリングの意を伝えるには、英語力が全く足りなかった、と、コータッツィさんは書いています。
      # fact: kurofune-if-68
      - 語り: 英語版と日本語版で、文言も違いました。第7条の「高官」は、日本語版で「船の指揮官」になり、より限定的になっています。
        tone: 疑問
      # fact: kurofune-if-69
      - 語り: ロンドンは、1852年、アメリカの遠征計画を、無頓着に受け止めていました。1854年2月、のちに香港の総督になるボーリングには、見込みがあれば日本と交渉してよい、と指示します。
      # fact: kurofune-if-69
      - 語り: ただし、対中国が優先で、日本との交渉は、アメリカの遠征の結果を指針にするよう、求められていました。ボーリングは、1854年に、日本へ行くことを見送りました。
        tone: 重い
      # fact: kurofune-if-74
      - 語り: コータッツィさんは、日本との関係を切り開く動きを主導したのは、主にアメリカで、ロシアとオランダがそれに次ぎ、イギリスが主導権を握るのは1859年以降だ、と整理しています。
        figure: {type: stats, title: 来た順番と目的, items: [[アメリカ, 1853年7月, 石炭・捕鯨船・太平洋航路], [ロシア, 1853年8月, 国境の画定], [イギリス, 1854年9月, クリミア戦争の最中]], upto: 3}
      - 語り: ペリーがいなかったら、この順番は、どう変わったのか。
        tone: 疑問
        hook: true
      - 語り: 来たあとの動きから、整理してみます。
        hook: true

  # ================================================================ 第7章 最初の条約は何を決めたのか
  - title: 「ペリーのあとの国々は、何を見ていたのか」　1854年から1855年
    background: {image: paintings/sakoku_perry_adams_portraits.jpg, credit: "「合衆国水師提督口上書」（1854年ごろの版画。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：K15（夕暮れの江戸湾。沖に船影が1つ、浜に誰もいない。右半分を空けた構図）
    year: 1854
    lines:
      - 語り: ここからは、記録をもとにした整理です。ペリーが来なかった場合を、記録は教えてくれません。ただ、来たあとの動きは、分かります。
      # fact: kurofune-if-73
      - 語り: 1854年3月31日の日米和親条約は、通商条約ではありません。アメリカ国務省歴史局も、そう書いています。
        card: {head: "1854年3月31日", body: 日米和親条約。通商の条文は無い}
      # fact: kurofune-if-73
      - 語り: 開かれたのは、下田と箱館。薪水や食料、石炭を手に入れるための港でした。通商の規定も、外国人が日本の法に従わない特権も、ありません。
      # fact: kurofune-if-73
      - 語り: 第11条は、アメリカの役人を下田に置く条件を決めています。日本語版は、「やむを得ない事情があるとき」です。
      # fact: kurofune-if-73
      - 語り: 『日本遠征記』の邦訳に載る英語版の訳は、「両国政府のいずれかが、必要とみなす場合」です。条件が、違っています。
        tone: 疑問
        figure: {type: stats, title: 第11条の2つの版, items: [[日本語版, やむを得ない事情があるとき], [英語版の訳, いずれかの政府が必要とみなす場合]], upto: 2}
      # fact: kurofune-if-71
      - 語り: そして、オランダ。1854年10月、長崎のクルチウスは、アメリカと日本の条約の写しを受け取ります。
        figure: null
      # fact: kurofune-if-71
      - 語り: バタヴィアの総督は、それを知ったあとで、「力を見せず、求めもせず、全てを得た」と本国へ書き送りました。
      # fact: kurofune-if-71
      - 語り: モースハルトさんは、この報告を、あまりに楽観的だと見ています。
      # fact: kurofune-if-71
      - 語り: オランダとは、1855年11月に、日蘭和親仮条約が結ばれました。第4条は、日本のほかの港がほかの国に開かれたら、オランダにも直ちに同じ免許を与える、という最恵国の規定です。
        card: {head: "1855年11月9日", body: 日蘭和親仮条約}
      # fact: kurofune-if-72
      - 語り: 三谷博さんの『ペリー来航』の英訳を評した書評で、コータッツィさんは、三谷さんが、オランダの助言は後から見れば合理的で誠実だった、と判断した、と紹介しています。
      # fact: kurofune-if-72
      - 語り: 幕府は、情報をオランダに頼りながら、その助言を退けていました。
      # fact: kurofune-if-60, kurofune-if-69
      - 語り: ペリーのあとに来た国は、アメリカの動きを見ていました。ロシアについては、雑誌 Russian Life が、ペリーの先導に従え、という指示を伝えています。
      # fact: kurofune-if-69
      - 語り: イギリスの訓令には、アメリカの遠征の結果を指針にする、とありました。
        tone: しみじみ
      - 語り: もし、ペリーが来なかったら。最初に来る国が別の国だったのか、条約の形が同じになったのか。記録は、教えてくれません。
        tone: 重い
        hook: true
      - 語り: ロシアは国境を、イギリスは自国民の特権を求めるなど、国ごとに狙いも違っていました。
        hook: true
      - 語り: 最後に、言えることと、言えないことを、分けます。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：ペリーが来なかったら、何が言えるのか　1846年から1855年
    background: {image: paintings/sakoku_perry_arrival_kawaraban.jpg, credit: "ペリー来航の瓦版（1853年ごろ。ウィキメディア・コモンズ、パブリックドメイン）"}
    lines:
      - 語り: ペリーが来なかったら、日本は開かなかったのか。史料と研究から言えるのは、そこまで単純ではない、ということです。
        tone: しみじみ
      # fact: kurofune-if-28, kurofune-if-30
      - 語り: 言えること。アメリカは、1851年に、別の提督と国書を用意していました。ペリーの前から、日本へ送る計画は進んでいたのです。
      # fact: kurofune-if-16, kurofune-if-08
      - 語り: 言えること。1846年のアメリカの艦隊も、1845年の捕鯨船も、断られています。幕府は、1845年の返書で、祖法を書面にしていました。
      # fact: kurofune-if-69, kurofune-if-74
      - 語り: 言えること。イギリスは、主導していません。ロシアは、ペリーの約1か月半後に来ました。
      - 語り: 言えること。ロシアもイギリスも、アメリカの動きを見ながら、自分の行動を決めていました。
      - 語り: 言えないこと。ペリーがいなかったら、誰が、いつ、どんな条約で日本を開いたのか。それは、史料からは、言い切れません。
        tone: 重い
      # fact: kurofune-if-28
      - 語り: 「ペリーが日本を開いた」という通念は、神話に近い、と書く研究者もいます。それでも、1851年の国書と、石炭を神の贈り物と呼んだ命令書は、確かに残っています。
        tone: しみじみ
        pause: 0.8
      # 余韻の一文：冒頭の1851年に戻る。締めは登録のお願いを短く
      - 語り: 1851年に書かれた最初の国書は、日本に着かないまま、残りました。浦賀の沖に錨を下ろしたのは、代役の提督でした。
        tone: しみじみ
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
