# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  黒船の提督ペリーは、実は、この遠征の「代役」でした。
  1851年、アメリカの国務長官は、別の提督に日本との交渉を任せ、国書を用意していました。
  その1人目の提督は、日本に着く前に外されます。ペリーが久里浜で渡した国書は、1852年11月13日付の、2通目でした。
  もし、ペリーが来なかったら。日本は、いつ、誰に、どんな形で開いたのでしょうか。
  この動画でわかること
  ・ペリーの7年前、1846年に浦賀へ来たアメリカの軍艦が、断られて帰った経緯と、記録の食い違い
  ・1842年から1845年に、幕府が「開く気」を見せたのか、見せなかったのか
  ・オランダが1852年にペリーの来航を知らせた本当の理由
  ・石炭が、アメリカを日本へ向かわせたこと。ペリーが小笠原で買った土地
  ・ロシアとイギリスは、ペリーのあとに、どう来たのか
  ・ペリーが来なかった場合に、史料から言えること、言えないこと
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（国書、アメリカ海軍省の訓令、ペリー艦隊の公式記録『日本遠征記』、フォスター『東洋のアメリカ外交』、松方冬子さんの論文、日米・日英・日露・日蘭の条約の本文、国立国会図書館、下田市、品川区、アメリカ国務省歴史局の解説など）を語りで示してから読んでいます。
  三谷博さんの大名の意見の分類は、解説記事の引用です。ビッドルの浦賀滞在、返答、突かれた逸話は、記録によって書き方が割れています。
  ペリーが来なかった場合に、日本がいつ・誰に・どう開いたかは、史料から言い切れません。
  絵は、ペリー来航の瓦版・「海陸御固泰平鑑」・「ペルリ像」・「合衆国水師提督口上書」（いずれも江戸時代の版画。ウィキメディア・コモンズ、パブリックドメイン）の一部と、画像生成AIで作った想像上の風景です。
  サムネイルの人物像は AI による想像図で、実在の肖像ではありません。

en:
  title: "If Perry Had Never Come: The Black Ships' Commodore Was a Replacement"
  description: |-
    Commodore Perry was, in fact, a replacement for the first commander of the Japan expedition.
    In 1851 the Secretary of State had already chosen another commodore, John Aulick, and prepared a letter for the mission.
    That first commodore was removed before reaching Japan. The letter Perry handed over at Kurihama, dated November 13, 1852, was the second one.
    If Perry had never come, when, by whom, and in what form would Japan have been opened?
    In this video you will learn:
    - How an American squadron came to Uraga seven years before Perry, was refused, and went home, and where the records disagree
    - Whether the shogunate had any intention of opening the country between 1842 and 1845
    - Why the Dutch warned Japan about Perry in 1852
    - How coal drove the American expedition, and the land Perry bought in the Bonin Islands
    - How Russia and Britain arrived after Perry
    - What can be said, and what cannot, about a Japan without Perry
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Perry Was a Replacement: 1851"
    - "What Happened Off Uraga Seven Years Earlier: 1845-1846"
    - "Did the Shogunate Mean to Open the Country? 1842-1845"
    - "Why the Dutch Warned Japan: 1852"
    - "Coal Moved Perry: 1852-1853"
    - "The Letter Sent Around Japan: 1853"
    - "When Did Russia and Britain Come? 1853-1855"
    - "Without Perry, What Can Be Said?"
    - "Summary: What Can Be Said Without Perry?"

