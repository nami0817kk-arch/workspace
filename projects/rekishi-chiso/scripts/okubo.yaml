# 大久保利通（A作品・10/25 19時公開予定）。型：掘り下げ型（生まれから順・節ごとに1つの山場・最後は「まとめ：大久保利通とは何者だったのか」）
# 冒頭の一点：暗殺の朝（明治11年5月14日）、大久保は福島県令・山吉盛典に「30年を10年ずつ3期に分ける計画」を語っていた（第1期＝創業・兵事、第2期＝内治整理と殖産興業、第3期＝後継者の守成。
#   自分は第2期まで）。明治元年から数えると明治11年は第2期の最初の年。のち「済世遺言」と呼ばれるが遺言ではなく最後の談話。出どころは山吉の記録（ウィキペディア「紀尾井坂の変」「山吉盛典」）。
#   襲われたのは午前8時30分ごろ。答えは第8節（襲撃・斬奸状）とまとめで冒頭に戻る。
# 事実の出どころは dev/output/rekishi-chiso/research/okubo_facts.md（確実／有力／説／後世の話の区分もそこ）。素材は research/okubo_assets.md。
# 決まり：①日付は和暦で言い、西暦は年表・card の年（year:）にだけ出す。肖像は1872年のワシントンの写真なので「この時○歳」は出さない（age: false）。
#   ②使わない話（入れない）：畳を回す芸／浜寺公園の松／伊地知貞馨の賄賂／西郷が月照と入水した後に大久保が励ました話／「畏友で手駒」／重野安繹に西郷の伝記を頼んだ話／佐賀の乱で江藤の首を晒した細部／
#     西南戦争の戦場の細部（B作品・昼の「もし西郷が勝っていたら」の領分）／島津久光が廃藩置県で花火を上げた話／傷の数・血の細部（暗殺は抑制的に）。
#   ③後世の話（出どころを言う）：久光に近づくための囲碁（日記には1848年にも碁の記述）／西郷の死に号泣した話（中西進監修『実はこの人こんな人』2002年）／前島密が聞いた悪夢／西郷の手紙を読んでいた話（報道）／
#     家での逸話（子煩悩・土曜の夕食）／遺産140円・借金8,000円（服部敏良『事典有名人の死亡診断 近代編』2010年。二次の本で、一次史料は未確認）／西郷が「大久保も自分を刺す計画に同意した」と考えた話（野村綱の自首の内容が根拠。事実かは確かめられない）。
#   ④数字は何の数かを言う。薩長同盟での大久保の役割は記録が薄い（出席者に挙げる記述はあるが発言は不明）。寺田屋事件で大久保が現場にいたとは言わない。討幕の密勅は偽造説あり。
#     台湾出兵の死者の数は資料で食い違うので言わない。葬儀の人数・費用も食い違うので言わない。哀悼碑の建立年も資料で割れるので言わない。
#   ⑤人物のセリフは入れない（西郷の死を聞いた言葉は「趣旨」だけを「と伝わる」で）。⑥背景に人物の肖像・拡大絵を使わない。NDL 系は detail で枠内だけ。
#   ⑦現代の写真は「画面は現在の〜」とその行で断る。⑧B作品の内容を先取りしない（「西郷が勝っていたら」には触れない）。⑨暗殺・死は抑制的に。「悪人」扱いはしない。
#   読みの注意：大久保利通＝おおくぼとしみち／島津久光＝しまづひさみつ／島津斉彬＝しまづなりあきら／西郷隆盛＝さいごうたかもり／税所篤＝さいしょあつし／吉井友実＝よしいともざね／乗願＝じょうがん／吉祥院＝きっしょういん／
#     精忠組＝せいちゅうぐみ／郷中＝ごじゅう／御小姓与＝おこしょうぐみ／加治屋町＝かじやちょう／高麗町＝こうらいちょう／喜界島＝きかいじま／お由羅騒動＝おゆらそうどう／寺田屋＝てらだや／有馬新七＝ありましんしち／
#     小松帯刀＝こまつたてわき／木戸孝允＝きどたかよし／柏村数馬＝かしむらかずま／正親町三条実愛＝おおぎまちさんじょうさねなる／後藤象二郎＝ごとうしょうじろう／小御所＝こごしょ／辞官納地＝じかんのうち／
#     岩倉具視＝いわくらともみ／山口尚芳＝やまぐちますか／三条実美＝さんじょうさねとみ／板垣退助＝いたがきたいすけ／江藤新平＝えとうしんぺい／副島種臣＝そえじまたねおみ／釜山＝ふざん／広津弘信＝ひろつひろのぶ／
#     西郷従道＝さいごうつぐみち／恭親王＝きょうしんのう／互換条款＝ごかんじょうかん／撫恤金＝ぶじゅつきん／宮古島＝みやこじま／牡丹社＝ぼたんしゃ／陸義猶＝りくよしなお／斬奸状＝ざんかんじょう／
#     島田一郎＝しまだいちろう／長連豪＝ちょうつらひで／脇田巧一＝わきたこういち／芳松＝よしまつ／北白川宮＝きたしらかわのみや／清水谷＝しみずだに／紀尾井＝きおい／山吉盛典＝やまよしもりつね／済世遺言＝さいせいゆいごん／
#     前島密＝まえじまひそか／青山霊園＝あおやまれいえん／市谷＝いちがや／服部敏良＝はっとりとしよし／中西進＝なかにしすすむ。
