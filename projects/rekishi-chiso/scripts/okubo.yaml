en:
  title: "Okubo Toshimichi: The 30-Year Plan He Described on the Morning He Was Killed"
  description: |-
    On the morning of May 14, 1878 (Meiji 11), Okubo Toshimichi, Japan's first Home Minister, reportedly told the governor of Fukushima about a plan to divide the thirty years from the Meiji era's start into three ten-year periods, and said he intended to see the second one through. A few hours later, at about 8:30, he was attacked in Shimizudani, Tokyo, and killed.
    This video digs into his life from his birth in Kagoshima as the son of a low-ranking Satsuma samurai: his friendship with Saigo Takamori, his approach to Shimazu Hisamitsu, the Satsuma-Choshu alliance, the abolition of the domains in 1871, the Iwakura Mission, the political crisis of 1873, the Home Ministry, the Taiwan expedition, the first domestic industrial exposition, and the Kioizaka (Shimizudani) incident. We separate what records show from what later books say, including the stories about Saigo, a dream before his death, and the debt he is said to have left.
    Dates are given in the Japanese calendar of the time. A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1878: The Morning of the Attack and a 30-Year Plan"
    - "1830: Born in Kagoshima, Saigo and Hisamitsu"
    - "1866: The Satsuma-Choshu Alliance, the Restoration and the End of the Domains"
    - "1871: The Iwakura Mission"
    - "1873: The Crisis Over Korea and Saigo's Exit"
    - "1873: Home Minister, Industry and the Taiwan Expedition"
    - "1877: The Exposition, Saigo's Death and the Letters"
    - "1878: The Kioizaka Incident"
    - "Summary: Who Was Okubo Toshimichi?"

