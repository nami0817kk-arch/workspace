sections:
  # ================================================================ 序章（冒頭 約2分）。答えはまとめまで言わない
  - title: 切腹の二文字はない電報　1877年9月24日 鹿児島 城山
    background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
    year: 1877
    lines:
      # fact: saigo-01, saigo-02
      - 語り: 西郷隆盛は、切腹して死んだ。そう信じられています。ところが、死んだその日に官軍が打った電報に、切腹の二文字は見当たりません。
        tone: 重い
      # fact: saigo-01, saigo-02
      - 語り: 参軍、山縣有朋の電報が使った言葉は、《斃す》。東伏見少将の電報は、《打ち取り》です。
        card: {head: "当日の電報", body: 「斃す」「打ち取り」}
      # fact: saigo-03
      - 語り: しかもその電報には、西郷を追いかけた安村という将校が、首を取りそこねた、とまで書かれています。
      # fact: saigo-01
      - 語り: 洞窟を出てから、岩崎口まで。1877年9月24日、午前4時に始まった、城山の最後の一日です。
        background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
      - 語り: 西郷は、いつ、どこで、誰の手で、命を落としたのか。記録は、時刻も、数も、言葉も、驚くほど食い違っています。
        tone: 疑問
        pause: 0.8
      - 語り: その答えは、午前4時の号砲から、最期の一日を、時刻どおりにたどった先にあります。
      # fact: saigo-13
      - 語り: 官軍の側の記録は、電報だけではありません。各旅団が書いた日記にも、24日の戦いは残っています。その一つは、西郷は、当時は死体だけ。のち、士族折田庄輔の屋敷で、首を得た、と書きます。
        card: {head: "第4旅団の日記", body: 首は折田庄輔の屋敷で}
        background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
      # fact: saigo-14
      - 語り: 一方、首を見つけたと言われる軍人の履歴書には、首は、門のわきの、小さな溝に埋まっていた、とあります。金沢で見つかった文書で、2014年に本になりました。
      # fact: saigo-05
      - 語り: 西郷の死を書いた言葉。首の書かれ方。そして、戦いが終わった時刻。ここまでで、もう、記録の違いが3つ見えています。
      - 語り: 物語は、その23日前、1877年9月1日の鹿児島から始まります。
        hook: true

  # ================================================================ 第1章 城山に入った人数
  - title: 洞窟に、何人がいたのか　9月1日 鹿児島 城山
    background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
    year: 1877
    lines:
      # fact: saigo-30
      - 語り: 1877年9月1日。西郷隆盛は、鹿児島の城山に入ります。鹿児島の町を見下ろす、標高およそ107メートルの山です。
      # fact: saigo-25
      - 語り: このとき西郷は、満49歳。1828年1月23日の生まれです。昔の数え方なら、51歳です。
        card: {head: "西郷隆盛", body: 満49歳（数えで51）}
      # fact: saigo-12
      - 語り: 付き従った兵は、何人だったのか。9月18日付の山縣参軍の報を、小沢大佐が転電した文によれば、囲まれた賊は、人夫を込めても、六、七百人に過ぎまい、と見られていました。
        card: {head: "山縣の報（9月18日）", body: 人夫込みで六、七百人}
      # fact: saigo-12
      - 語り: 別働第1旅団の連隊長、茨木中佐が9月26日付で出した戦闘報告は、敵の総員を、500余名と数えます。
      # fact: saigo-12
      - 語り: 今よく語られる数は、372人です。解説の本や記事に出てきますが、数えた人の名は、示されないことが多い数字です。
        figure: {type: table, title: 城山の薩軍は何人か, cols: [数え方, 人数], rows: [[山縣の報（9月18日）, 人夫込み, 六、七百人], [茨木中佐の報告（9月26日付）, 敵の総員, 500余名], [後の解説書, 籠城した人数, 372人]], upto: 3}
        background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
      # fact: saigo-07
      - 語り: 官軍の囲みは、日ごとに固まります。国立国会図書館が翻刻を公開している、砲兵の報告、『攻城砲隊戦闘報告』によれば、城山を囲んだ砲は、53門。31の分隊に分かれていました。
        figure: null
      # fact: saigo-07
      - 語り: 9月19日から23日までは、1門ごとに、10発以内。昼も夜も、城山の前と後ろの賊の塁に、撃ち込まれていました。
      - 語り: 西郷がいたのは、城山の東がわ、岩崎谷の横穴です。西郷洞窟として知られています。
      # fact: saigo-22
      - 語り: その洞窟の数が、案内ごとに違います。鹿児島の観光案内は9つ、日本語版ウィキペディアの西南戦争の項は11と書き、今も残る2つの洞窟に西郷が実際に居たという記録はない、と添えています。
        card: {head: "西郷洞窟", body: 9つとも、11とも}
        background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
      - 語り: 洞窟の外では、囲みが、日ごとにせばまっていました。
        hook: true
      - 語り: その囲みの外から、ある日、2人の使者が、官軍の陣へ歩いてきます。
        hook: true

  # ================================================================ 第2章 使者と期限
  - title: 使者は、何を問うたのか　9月21日から23日 城山の外
    background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
    year: 1877
    lines:
      # fact: saigo-09
      - 語り: 薩軍の隊長、河野主一郎と山野田一輔。2人が官軍の哨兵線に現れた日は、記録によって、21日とも、22日とも読める。
      # fact: saigo-09
      - 語り: 9月22日付の官軍本営の文書は、2人が別働第1旅団の哨兵線に来た、と書きます。同じ綴りの別の文書は、翻刻は崩れていますが、九月二十一日、と書いています。
      # fact: saigo-09
      - 語り: そして23日発の電報は、別働第2旅団の哨兵線、と読めます。
        card: {head: "使者の来た日", body: 21日か22日・旅団も割れる}
      # fact: saigo-10
      - 語り: 平佐大尉が小沢大佐に宛てた電報は、2人が持ってきたのは、願い事ではなく質問だった、と書きます。
      # fact: saigo-10
      - 語り: 西郷が上京しようとしたのを、熊本で止めたのは、どういうお考えか。そう尋ねた、と読めます。
      # fact: saigo-10
      - 語り: アジア歴史資料センターは、この電報に、助命請願、という題を付けています。ところが、翻刻された電報の文面に、助命の言葉は、読める範囲では見当たりません。
        card: {head: "目録の題と電報の文面", body: 「助命請願」と質問}
      # fact: saigo-08
      - 語り: 官軍の総指揮は、どう答えたのか。参軍、山縣有朋の達しが、第4旅団の日記に写されています。今の言葉にすると、こうです。
        background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
      # fact: saigo-08
      - 語り: 22日に、河野と山野田が、賊の一同の総代として、請願に来た。断然、拒絶した。願いがあるなら、23日の午後5時を限りに申し出よ。そう言い含めて、帰した。
        card: {head: "山縣参軍の達し", body: 23日午後5時を限りに}
      # fact: saigo-08
      - 語り: 午後5時。それが、官軍の示した、回答の期限でした。
        tone: 重い
      # fact: saigo-31
      - 語り: 西郷は、これに、回答の要なし、と答えた、と伝わります。ただ、この言葉の出どころの書名を示す解説は、多くありません。
        background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
      # fact: saigo-31
      - 語り: その夜、洞窟の前では、別れの宴が開かれた、と伝わります。翌朝の号砲まで、半日足らずでした。
        tone: しみじみ
      - 語り: その号砲は、何発、鳴ったのか。
        hook: true
        tone: 疑問
      - 語り: そして、それは、本当に午前4時だったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第3章 号砲
  - title: 号砲は何発、何時に鳴ったのか　9月24日 午前4時
    background: {image: paintings/saigo_bg_tabaru_smoke.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
    year: 1877
    lines:
      - 語り: 9月24日。城山の四方から、官軍が攻め上ります。合図は、大砲の3発でした。
      # fact: saigo-06
      - 語り: 砲兵の報告には、こうあります。24日午前4時、城山の四面から大攻撃。その合図として、別働第2旅団が、四斤山砲を3発撃たせた。
        card: {head: "砲兵の報告", body: 午前4時 山砲3発}
      # fact: saigo-01
      - 語り: 山縣参軍の電報も、午前4時に開戦。そう打っています。
      # fact: saigo-06
      - 語り: ところが、別働第2旅団自身の日記は、午前3時に、3発の砲を合図として、各旅団が一斉に攻撃した、と書きます。
        figure: {type: table, title: 号砲の時刻　記録の食い違い, cols: [合図の時刻, 書いた記録], rows: [[山縣参軍の電報, 午前4時, 開戦], [砲兵の報告, 午前4時, 山砲3発], [別働第2旅団の日記, 午前3時, 3発で一斉攻撃]], upto: 3}
      # fact: saigo-06
      - 語り: 別の報告は、午前2時に宿陣を出て、3時には一部が岩崎山へ向かって進み、4時に号砲3発で開戦した、としています。
        figure: null
      # fact: saigo-06
      - 語り: 号砲のあと、砲は一斉に火を噴きます。数が分かる4つの部隊だけで、第3旅団が74発、第4旅団が8発、別働第2旅団が20発、熊本鎮台が43発。足すと、145発です。
        card: {head: "24日の砲弾", body: 4部隊で145発}
        background: {image: paintings/saigo_bg_tabaru_pines.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
      # fact: saigo-06
      - 語り: けれど砲撃は、長く続きません。歩兵が瞬く間に賊の塁へ突入したので、各門は撃つのをやめた、と報告は書いています。
      # fact: saigo-24
      - 語り: 岩崎谷では、第4旅団と、東伏見少将の隊が、はさみ撃ちにしました。岩崎谷で死んだ薩軍は、およそ50人。攻撃隊を率いたのは立見少佐だった、と少将は伝えています。
        card: {head: "岩崎谷のはさみ撃ち", body: 死んだ薩軍 およそ50人}
      - 語り: 西郷は、そのとき、どこにいたのか。
        hook: true
        tone: 疑問
      - 語り: 洞窟を出たのは、何時だったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第4章 洞窟を出た時刻と戦いの終わり
  - title: 洞窟を出たのは何時か　午前4時か6時か 岩崎口
    background: {image: paintings/saigo_bg_tabaru_pines.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
    year: 1877
    lines:
      - 語り: 広く語られる場面があります。西郷が、洞窟の前に集まった40人あまりの先頭に立って、岩崎口へ下っていく。そう伝わる場面です。
      - 語り: 洞窟を出た時刻は、案内ごとに違う。観光の案内には、午前4時、とするものもあります。
      # fact: saigo-15
      - 語り: 鹿児島の別府晋介の墓の解説は、午前6時ごろ、洞窟から岩崎口まで下って、最後の戦いに挑むことを決めた、と書きます。
        card: {head: "洞窟を出た時刻", body: 4時とも、6時ごろとも}
      # fact: saigo-16
      - 語り: 官軍の日記は、6時ごろに賊の塁を抜き、賊を岩崎谷へ追い込んだ、と書きます。同じ日の別の報告は、7時に賊をことごとく平らげた、とします。
      # fact: saigo-23
      - 語り: 西郷が撃たれたことを伝える電報があります。田ノ浦から午前10時に出た電報の翻刻には、西郷は小銃に当たり、桐野は大砲に当たった、とあります。
        card: {head: "午前10時の電報", body: 西郷は小銃、桐野は大砲}
        background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
      - 語り: 当たった所は、日本語版ウィキペディアの西郷の項では、股と腹。別の解説では、腰と太もも。腹に当たったのかどうかも、書き方が分かれます。
      # fact: saigo-26
      - 語り: 撃たれた場所は、島津応吉の邸の門の前、と書かれています。ウィキペディアの西郷の項の記述です。
      # fact: saigo-05
      - 語り: では、戦いは、いつ終わったのか。山縣参軍は、午前8時に収まった、と打ちました。
      # fact: saigo-05
      - 語り: ところが、渡辺中佐の電報は、午前7時。別働第2旅団の日記は、8時30分。東伏見少将は、9時ごろ。小沢大佐の電報は、9時30分です。
        figure: {type: table, title: 戦いはいつ終わったのか, cols: [終わった時刻, 書いた言葉], rows: [[渡辺中佐の電報, 午前7時, 略平定], [山縣参軍の電報, 午前8時, 収まる], [別働第2旅団の日記, 8時30分, 賊ことごとく滅亡], [東伏見少将の電報, 9時ごろ, 全く平定], [小沢大佐の電報, 9時30分, 平定]], upto: 5}
      - 語り: 基準にしやすいのは、山縣参軍の電報の、午前8時でしょう。開戦の午前4時から、4時間です。
        figure: null
        background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
      - 語り: ただし、戦いの終わり、が何を指すのかが、記録ごとに違います。塁が落ちた時か。銃声が止んだ時か。平定した時か。
      - 語り: この間に、別府晋介が、西郷の後ろに立ちます。
        hook: true
      - 語り: そのとき、西郷は何と言ったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第5章 最期の言葉と介錯
  - title: 「もう、ここらでよか」は本当の言葉か　別府晋介の介錯
    background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
    year: 1877
    lines:
      - 語り: 広く知られる最期は、こうです。傷ついて歩けなくなった西郷が、東を向いて、手を合わせる。別府晋介が、刀を振るう。
      - 語り: 西郷は、別府に、こう言った、と言われます。「晋どん、晋どん、もう、ここらでよか」。
        tone: しみじみ
      # fact: saigo-18
      - 語り: けれど、この言葉の形が、書物ごとに揺れます。徳富蘇峰の『近世日本国民史』を紹介する文では、「晋殿、もうここでよか」。
      # fact: saigo-18
      - 語り: 井上清が1970年に出した『西郷隆盛』は、「介錯をお頼み申す」と、微笑して言った、と書く。書評は、そう紹介しています。
        card: {head: "最期の言葉", body: 「ここでよか」「ここらでよか」}
      # fact: saigo-02
      - 語り: 官軍の電報は、どうか。山縣は「斃す」。東伏見少将は、西郷は「打ち取り」、桐野、別府、逸見は「自殺」と、書き分けています。
        background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
      # fact: saigo-02
      - 語り: 介錯、という言葉は、読めた山縣、東伏見、渡辺の電報の翻刻には、見当たりません。
      # fact: saigo-04
      - 語り: 官軍の電報で、はっきりしているのは、死体検査が済んだことです。24日、山縣は鳥尾中将に打ちます。
      # fact: saigo-04
      - 語り: 西郷、桐野、村田新八、別府晋介、逸見十郎太、池上四郎、桂久武らの死体検査が済んだ。みな、銃丸か、バヨネット、つまり銃剣で斃れた者だ、と。
        card: {head: "死体検査の電報", body: 銃丸かバヨネットで斃れた}
        background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
      # fact: saigo-04
      - 語り: この電報の発信は、控えによって、午後3時10分、3時55分、4時35分と、3通りに残っています。
      - 語り: 西郷の体は、この検査で確かめられました。では、首は。
        hook: true
      - 語り: 首は、そのとき、どこにあったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第6章 首
  - title: 西郷の首はどこにあったのか　折田の屋敷の溝
    background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
    year: 1877
    lines:
      # fact: saigo-03
      - 語り: 官軍の電報は、24日のうちに、首のことを伝えています。東伏見少将の電報。西郷を追った安村は、手負いとなり、首を取りかねたのは、残念だ。
        card: {head: "東伏見少将の電報（24日）", body: 首を取りかねたのは残念}
      # fact: saigo-17
      - 語り: 安村は、中隊長の中尉でした。少将の26日の答えによれば、駕籠に乗って岩崎谷を走る者を見つけ、兵を率いて追った。ところが、塁から狙撃されて、負傷した。
        background: {image: paintings/saigo_bg_tabaru_smoke.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
      # fact: saigo-17
      - 語り: 小隊長の石神警部が駆けつけた時には、すでに首はなかった。死体は確かに西郷で、弾の傷がある。少将は、そう答え、持っていたピストルを、印として取った、とあります。
      - 語り: 首がなくても、本人と分かった。右腕の古傷も手がかりの一つだった、と書く解説があります。
      # fact: saigo-13
      - 語り: では、首は、どこにあったのか。第4旅団の日記は、24日の条に、こう書きます。西郷は、当時は死体だけ。のち、士族折田庄輔の屋敷で、首を得た。
      # fact: saigo-14
      - 語り: それから、半世紀ほど後に書かれた、首を見つけたと言われる人の履歴書が、金沢で見つかりました。千田登文。元は加賀藩の士族で、陸軍の軍人です。
        card: {head: "千田登文の履歴書", body: 金沢で見つかった}
      # fact: saigo-14
      - 語り: 履歴書には、こうあります。西郷の首がないので、探せ、と命じられた。門のわきの小さな溝に、埋めてあるのを見つけた。浄光明寺へ運び、山縣参軍と曾我少将に、差し出した。
      # fact: saigo-14
      - 語り: 溝があったのは、折田庄助の屋敷の前だ、と説明する本や記事もあります。日記は庄輔、解説は庄助。屋敷の主の名の字さえ、割れています。
      # fact: saigo-26
      - 語り: 首を埋めた場所は、折田邸の門前説が最も有力で、『西南記伝』は9つの説を挙げている、とあります。ウィキペディアの注の記述です。
        background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
      # fact: saigo-14
      - 語り: この履歴書をもとに、大野敏明さんが、2014年2月に、文春新書『西郷隆盛の首を発見した男』を書きました。
      # fact: saigo-16
      - 語り: 別働第2旅団の日記は、西郷、桐野ら17人を、浄光明寺山に仮に埋めて、墓標を建てた、と書きます。ただし、と云う、という、聞いた話の書き方です。
        card: {head: "別働第2旅団の日記", body: 17人を仮に埋め、墓標を建てた}
      - 語り: 官軍の記録は、ここまでです。では、切腹の話は、いつ、生まれたのか。
        hook: true
      - 語り: 公文書の言葉と、広く知られた最期は、どこで、すれ違ったのか。
        hook: true
        tone: 疑問

  # ================================================================ 第7章 切腹の話はいつ生まれたか
  - title: 切腹の話は、いつ生まれたのか　2010年のラヴィーナ論文と公文書
    background: {image: paintings/saigo_nishiki_saigo_fighting.jpg, credit: "《西南戦争の錦絵》（中央に西郷隆盛と伝わる）19世紀"}
    lines:
      # fact: saigo-29
      - 語り: 国立公文書館の、あの日の公文書、という解説は、西郷を、銃弾に倒れ、自決した、と説明しています。
      # fact: saigo-02
      - 語り: 官軍の電報は、斃す、打ち取り。公文書館の解説は、自決。同じ国の側でも、言葉は一つではありません。
      # fact: saigo-27
      - 語り: アメリカの歴史学者、マーク・ラヴィーナは、2010年、アジア研究の学術誌に、論文を出しました。題を日本語にすれば、西郷隆盛の、作り話の自害、といったところです。
        card: {head: "ラヴィーナ論文", body: 西郷の切腹は作り話か}
      # fact: saigo-27
      - 語り: 論文の要旨は、西郷は、銃弾で動けなくなり、従者に首を斬られた、と見ます。
      # fact: saigo-27
      - 語り: そして、切腹の話が定着するのは、20世紀の初め。武士道が、国全体の考え方になっていく時期だ、と。
        background: {image: paintings/saigo_bg_tabaru_smoke.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
      # fact: saigo-27
      - 語り: それまでは、火星に昇った、ロシアへ逃げた、といった噂と並ぶ、数ある話の一つだった、というのです。
      # fact: saigo-27
      - 語り: 論文の参考文献には、英語で書かれた、新渡戸稲造の『武士道』が挙がっています。出たのは1900年。西郷の死の、23年後です。
        card: {head: "新渡戸稲造『武士道』", body: 1900年・英語（西郷の死の23年後）}
      - 語り: 並べてみます。当日の官軍の電報は、斃す、打ち取り。論文は、動けない体に、従者が首を斬った。公文書館の解説は、自決です。
        figure: {type: table, title: 西郷の最期は、どう書かれたか, cols: [時期, 書いた言葉], rows: [[山縣参軍の電報, 1877年当日, 斃す], [東伏見少将の電報, 1877年当日, 打ち取り], [ラヴィーナの論文, 2010年, 動けず、従者が首を斬る], [国立公文書館の解説, 近年, 銃弾に倒れ自決]], upto: 4}
      - 語り: どれが正しいのか、という問いに、ここで答えを出すことは、できません。ただ、公開されている当日の電報の翻刻に、切腹という言葉は見当たらない。確かめられるのは、そこまでです。
        figure: null
        tone: しみじみ
      - 語り: ところが、西郷の死の16日前。東京の絵草紙屋に、すでに、星になった西郷が並んでいました。
        hook: true
      - 語り: 死ぬ前の西郷が、なぜ星に。
        hook: true
        tone: 疑問

  # ================================================================ 第8章 西郷星と生存説
  - title: 死ぬ前に、なぜ西郷は星になったのか　西郷星と生存説
    background: {image: paintings/saigo_bg_tabaru_smoke.jpg, credit: "小林永濯《田原坂激戦之図》（三連の一部）1877年"}
    year: 1877
    lines:
      # fact: saigo-19
      - 語り: 1877年9月。火星が、地球に近づいていました。9月3日ごろが、大接近です。
      # fact: saigo-19
      - 語り: 赤く光る星の中に、陸軍大将の姿の西郷が見える。そんな噂が広がり、錦絵になりました。千葉市の博物館や、アメリカの大学の収蔵品にも、西郷星の絵が残っています。
        card: {head: "西郷星", body: 火星の中に西郷が見える}
      # fact: saigo-19
      - 語り: アメリカの動物学者、エドワード・モースは、9月8日の日記に、東京の絵草紙屋で見た絵を書き留めています。火星の中に、反乱軍の頭領、西郷将軍が描かれている。
      # fact: saigo-19
      - 語り: 9月8日は、西郷が亡くなる、16日前です。星になった西郷が、先に、売られていたのです。
        tone: しみじみ
      - 語り: 亡くなったあと、噂は形を変えます。西郷は生きている。ロシアに逃れた。
      # fact: saigo-20
      - 語り: 1891年、ロシアの皇太子が来日するころ、西郷が皇太子と一緒に帰ってくる、という噂が強まった、と言われます。歴史作家の河合敦さんが、そう書いています。西郷の死から、14年後です。
        card: {head: "西郷の生存説", body: 1891年 皇太子と帰国する噂}
      # fact: saigo-21
      - 語り: 官位を取り上げられていた西郷が赦されたのは、1889年2月11日。憲法発布の大赦で、正三位が贈られた、とあります。死から、11年あまり後です。
        portrait: {image: paintings/saigo_takamori_portrait.jpg, caption: '西郷隆盛（キヨッソーネ系の肖像画。本人の写真は現存しない）'}
      # fact: saigo-28
      - 語り: 上野の銅像の除幕は、1898年12月18日。高村光雲の作で、死から21年後でした。本人の写真は、現存しないとされます。
        background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
      - 語り: 西郷の最期の一日は、星になり、銅像になり、また、物語になっていきました。
        hook: true
      - 語り: では、記録から、いま、言えることは何なのか。
        hook: true
        tone: 疑問

  # ================================================================ まとめ
  - title: まとめ：西郷隆盛の最期、記録から言えること
    background: {image: paintings/saigo_nishiki_kagoshima_battle_shozan.jpg, credit: "早川松山《鹿児島の戦い》錦絵（三連の一部）1877年"}
    lines:
      # fact: saigo-01
      - 語り: 1877年9月24日。午前4時に始まった戦いは、山縣参軍の電報では、午前8時に収まりました。
        tone: しみじみ
      # fact: saigo-04
      - 語り: 西郷隆盛は、その日の戦いの中で、岩崎谷で亡くなりました。官軍の死体検査の電報は、桐野利秋、別府晋介らと並べて、みな銃丸かバヨネットで斃れた、と書いています。
      # fact: saigo-02
      - 語り: 官軍の電報の言葉は、斃す。打ち取り。切腹も、介錯も、読めた電報の翻刻には見当たりません。
      - 語り: 言えないことも、あります。洞窟を出た時刻。倒れた場所。最期の言葉の形。首を隠した人。そして、切腹だったのか、動けない体に首を斬られたのか。
        tone: しみじみ
      # fact: saigo-03
      - 語り: ただ、24日の電報に、首の話が出てくる。それだけは、当日の記録にあります。
      # fact: saigo-27
      - 語り: 切腹の話は、記録の中よりも、後の時代の中で、大きくなっていった。そう見る研究者がいます。
      # fact: saigo-25
      - 語り: 西郷隆盛は、1828年1月23日に生まれ、1877年9月24日、満49歳8か月で亡くなりました。
        pause: 0.8
        background: {image: paintings/saigo_nishiki_kagoshima_departure_yoshitoshi.jpg, credit: "月岡芳年《鹿児島暴徒出陣図》錦絵（三連の一部）1879年"}
      - 語り: 切腹の二文字のない電報の向こうで、西郷は、何を思って、岩崎口へ下ったのか。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、西郷隆盛の最期を、どう思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
