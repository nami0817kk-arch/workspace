# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  西郷隆盛は、切腹して死んだ。そう信じられています。
  ところが、死んだその日に官軍が打った電報に、切腹の二文字は見当たりません。使われた言葉は「斃す」と「打ち取り」でした。
  洞窟を出てから、岩崎口まで。1877年9月24日、午前4時に始まった城山の最後の一日を、時刻どおりにたどります。
  西郷は、いつ、どこで、誰の手で命を落としたのか。記録は、時刻も、人数も、言葉も食い違います。
  この動画でわかること
  ・官軍の電報・日記が、西郷の死をどう書いたか（山縣参軍・東伏見少将ほか）
  ・号砲の時刻、洞窟を出た時刻、戦いが終わった時刻の食い違い
  ・西郷の首をめぐる記録（第4旅団の日記と、2014年に見つかった千田登文の履歴書）
  ・切腹の話は、いつ広まったのか（ラヴィーナ論文）と、死ぬ前に生まれた「西郷星」
description_note: |-
  記録の言葉は、出どころ（山縣有朋・東伏見少将の電報、第4旅団・別働第2旅団の日記など）を語りで示してから、今の言葉に直して読んでいます。電報・日記は、アジア歴史資料センター（JACAR）が公開する防衛省防衛研究所の資料の翻刻で読みました（翻刻には誤りや読めない字が混じります）。砲兵の報告は、国立国会図書館「史料にみる日本の近代」の翻刻で読みました。
  切腹の話の研究は、Mark Ravina, "The Apocryphal Suicide of Saigō Takamori"（Journal of Asian Studies 69(3), 2010）の要旨と参考文献表で確かめました（本文は読めていません）。
  画面の情景・人物の画像の多くは、画像生成AIで作った想像上のイメージで、記録映像・実在の写真や肖像ではありません。サムネイルの人物像も、AI による想像図です。西郷隆盛本人の写真は現存しないとされます。

en:
  title: "Saigo Takamori: Did He Really Commit Seppuku at Shiroyama? The Last Day, Cave to Iwasaki Gate"
  description: |-
    Saigo Takamori died by seppuku. That is what most people believe.
    Yet the telegrams the government army sent on the day he died never use the word seppuku. They say "struck down" and "killed".
    From the cave to the Iwasaki gate: this video follows the last day at Shiroyama, September 24, 1877, hour by hour.
    When, where, and at whose hand did he die? The records disagree on times, numbers and even his last words.
    In this video you will learn:
    - How army telegrams and unit diaries described Saigo's death
    - Conflicting times for the signal guns, the exit from the cave, and the end of the fighting
    - The records about his head, including a memoir found in Kanazawa in 2014
    - When the seppuku story spread, and why "Saigo's star" appeared before he died
    Recorded words are read with their sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "No Mention of Seppuku: September 24, 1877"
    - "How Many Men Were in the Cave?"
    - "What Did the Two Envoys Ask?"
    - "How Many Signal Guns at 4 a.m.?"
    - "What Time Did He Leave the Cave?"
    - "Did He Really Say 'This Is Enough'?"
    - "Where Was Saigo's Head?"
    - "When Was the Seppuku Story Born?"
    - "Why Did Saigo Become a Star Before He Died?"
    - "Summary: What the Records Can Tell Us"

