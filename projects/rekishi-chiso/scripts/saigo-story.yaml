# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。想像の台詞は入れない（imagined なし）。「もしも」は使わない。
# 1本に1つの問い＝「西郷は城山で切腹したのか。最期の一日の記録は、なぜ時刻も言葉も食い違うのか」。題名で死に方を言い切らない（問いの形）。
#   冒頭（10秒以内）＝切腹と信じられているのに、死んだ日に官軍が打った電報（山縣参軍・東伏見少将）の言葉は「斃す」「打ち取り」で、切腹の語がない（saigo-01, saigo-02）。
#   答え（まとめ）：言えること＝午前4時に開戦、山縣電では午前8時に収まる、西郷は岩崎谷で死に、首は後に見つかった、官軍の電報の語は「斃す」「打ち取り」。
#     言えないこと＝洞窟を出た時刻・倒れた場所・最期の言葉の形・首を隠した者・切腹か介錯か。切腹の話は20世紀初めに定着した、とラヴィーナ（2010）は見る。
#   「他チャンネルの当たり『遺体の真相』の切り口は写さない」＝遺体の傷・陰嚢水腫の話は小さく（本人確認の一行だけ）。主軸は官軍の電報・日記どうしの食い違いと、時刻の実況。
# 記録の食い違い（本編に並べるもの）：
#   ①官軍の電報の言葉（山縣＝斃す／東伏見＝西郷は打ち取り・桐野別府逸見は自殺／公文書館の解説＝自決）
#   ②号砲の時刻（砲兵報告・山縣電＝午前4時／別働第2旅団日記＝午前3時／後の本＝3時50分・55分）
#   ③戦いの終わった時刻（山縣8時／渡辺中佐7時／別2日記8時30分／東伏見9時ごろ／小沢報9時30分）
#   ④使者の来た日（21日・22日）と来た先（別働第1旅団・第2旅団）／薩軍の数（官軍の見積もり600〜700・500余／後の解説372）
#   ⑤首の場所（折田庄輔の屋敷＝第4旅団日記／門脇の小溝＝千田の履歴書／折田庄助邸の前の溝）
# 計算（自分で計算し直した）：1828-01-23〜1877-09-24＝満49歳8か月（数え51）／9/1→9/24＝23日／死の16日前＝9/8（モース日記）／
#   4時→8時＝4時間／4部隊の砲弾 74+8+20+43＝145発／1877→1900（『武士道』）＝23年／→1891＝14年／→1889-02-11＝11年4か月／→1898＝21年／→2014＝137年／→履歴書の書かれた大正末〜昭和初＝約半世紀。
# 事実は事実カード（dev/output/rekishi-chiso/research/西郷隆盛_facts_20261111.yaml、saigo-01〜）にあるものだけ。行の上に `# fact: saigo-NN`。
#   使わないこと：西郷の死亡時刻「午前7時」・洞窟から何メートル・「回答の要なし」の一次・「腹に刀傷あり／なし」の断定・大内山の談話・ロシア説の細部・津田三蔵との因果・「折田・柴山・益満・吉井」・西郷が洞窟に暮らした日数。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
# 広告の配慮：死は「亡くなった」。首のことは記録の言葉で淡々と。傷の細部・遺体の描写は避ける。
