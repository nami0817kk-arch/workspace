# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型（世界史・エジプト〜フランス〜イギリス）。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「ギリシャ語つきの石なのに、エジプトの文字が読まれるまでなぜ23年かかったのか。そして、解いた人は1人なのか」。主役は石と、謎解きの過程。
#   冒頭＝「石に答え（同じ文のギリシャ語）が書いてあったのに23年」＋「読んだ本人が、ヤングが先に公刊したと書いた」＋「1821年には本人も音は無いと書いていた」＋「側面にジョージ3世寄贈（実は戦利品）」。答えの席＝解読者は1人か。
#   型の作り：第1章 石の中身と最初の誤訳／第2章 戦利品と写し（外に出ない3年・戦争の12年）／第3章 1802年の最初の突破と行き止まり／第4章 ヤング／第5章 シャンポリオンの1822年／第6章 先取り争い（記録を並べる）／第7章 23年の勘定／まとめ。
# 記録の食い違いは3つ（それぞれ誰のどの記録が何と書くか）：①発見の日（15日／19日の元／ルクラントの幅 7/14〜25）・見つかり方 ②ヤングが当てた字の数（シャンポリオン1822「4字」・ヤング1823「9字」・シャンポリオン1824「15字中5字」・ロビンソン「13個中6つ正解」）
#   ③「わかった！」と倒れた逸話（最古の本文・台詞・決め手の写しの出どころ）。
# 計算（自分で計算し直した）：1822−1799＝23年（1799年7月→1822年9月＝23年2か月）／発見→1803年4月末〜5月＝3年9〜10か月／1803→1815＝12年／1814−1799＝15年／1799年7月→1821年12月＝22年5か月（22年≒5か月）／
#   196 BC→1799＝1994年（紀元0年なし）／1835−1822＝13年／1856−1822＝34年／1906−1822＝84年／1822-08-05→1822-09-22＝48日／1822-09-22→09-27＝5日／1822-09-27→09-29＝2日／1790-12-23→1832-03-04＝41歳2か月／1822−1819＝3年／1829年5月→1834年／1802→1814＝12年／1815−1802＝13年。
# 事実は事実カード（dev/output/rekishi-chiso/research/ロゼッタ_facts_20261114.yaml、rosetta-A01〜／B01〜／C01〜）にあるものだけ。行の上に `# fact: rosetta-xx`。
#   使わないこと：ブシャールの階級の断定（大尉／中尉で割れる）・石の重さ・「白ペンキ」の語・『クーリエ』37号の日付・ターナー書簡の原典を見ていない細部・「5日間寝込んだ」・ヤングの正解数の断定・ロゼッタ石の枠の総数・「Je tiens」の台詞を事実として言い切ること。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
