# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  ロゼッタストーンには、同じ内容の文が、ギリシャ語でも刻まれていました。ところが、エジプトの文字の読み方が発表されたのは、石が見つかった1799年から、23年後の1822年でした。
  読んだ本人のシャンポリオンは、1824年の本に、最初にいくつかの正確な知見を公刊したのは、イギリスのヤングだった、と書いています。
  壁の中の石、戦利品になった石、1802年の最初の突破と行き止まり、ヤングの1814年、シャンポリオンの1822年、先取り争い。記録をたどって、23年の中身を数えました。
  この動画でわかること
  ・石が見つかった日の、記録の食い違い
  ・最初に新聞に出たギリシャ語の訳の、取り違え
  ・写しの配布が進まなかった3年と、戦争で止まった12年
  ・ヤングが当てた字の数が、数える人によって違う理由
  ・「わかった！」と倒れた逸話の、出どころ
description_note: |-
  年数の割り振り（写しが外に出なかった期間・戦争の期間・オベリスクが着くまでの期間）は、記録の年代を並べて整理したもので、重なる期間があります。ヤングが当てた字の数は、本人・シャンポリオン・後世の研究者で数え方が違い、動画ではそれぞれの数を並べました。
  発見の日・見つかり方、メンフィスの勅令の行数、降伏協定の条文、1802年の訳、ヤングとシャンポリオンの本の記述は、ルクラント（1999）、トマソン（2020）、クァーク（2023）、ポリス（2022）、ハルトレーベン（1906）、ヤング全集などの論文・原典の全文テキストで確かめました。一部は二次的な紹介（百科事典・博物館の解説）からで、台詞の細部などは「伝えられる話」として扱っています。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "How Was the Rosetta Stone Read? Why It Took 23 Years Even With a Greek Text on the Stone"
  description: |-
    The Rosetta Stone carried the same text in Greek. Yet the reading of its Egyptian scripts was announced in 1822, 23 years after the stone was found in 1799.
    In his 1824 book, Champollion himself wrote that the first accurate notions were published by the Englishman Thomas Young.
    We follow the records: the stone in the wall, the stone as war booty, the first breakthrough and dead end in 1802, Young's years, Champollion's 1822, and the priority dispute.
    In this video you will learn:
    - How the records disagree about the day it was found
    - The mistake in the first newspaper translation of the Greek
    - Three years when copies stayed in France, and twelve years of war
    - Why the number of signs Young got right depends on who counts
    - Where the story of Champollion's collapse comes from
    Year spans are our arrangement of the dates and may overlap. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "The Stone With an Answer"
    - "A Stone in the Wall"
    - "The Stone Becomes War Booty"
    - "The First Breakthrough and a Dead End"
    - "Young and the Names in Ovals"
    - "Champollion's 1822"
    - "The Priority Dispute"
    - "Where Did the 23 Years Go?"
    - "Summary: Who Read It?"

