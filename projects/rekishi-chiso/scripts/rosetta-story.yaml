  # サムネは別に作る（out/rosetta-story_thumbnail.png）。この欄は check のための仮。

sections:
  # ================================================================ 序章（冒頭 約2分）。答えの席：解読者は1人なのか
  - title: 答えつきの石　ロゼッタストーン
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1799
    lines:
      # fact: rosetta-A11
      - 語り: ロゼッタストーンには、《答え》が、書いてありました。それでも、エジプトの文字は、《23年》のあいだ、誰にも読めませんでした。
        tone: 重い
      # fact: rosetta-B33
      - 語り: おなじ文が、読めるギリシャ語でも、刻まれていたのに。発見は1799年7月、読み方の発表は、1822年9月です。
      # fact: rosetta-C03
      - 語り: 解読を発表した、フランスのシャンポリオンが、1824年の本に、こう書いています。最初に、いくつかの正確な知見を公刊したのは、イギリスの医者、ヤングだった、と。
        tone: 重い
      - 語り: 23年のあいだに、誰が、何をしたのか。そして、解いたのは、本当に1人なのか。記録を、たどっていきます。
        tone: 疑問
        hook: true
      # fact: rosetta-B22
      - 語り: 突破の1年前の1821年、シャンポリオン自身が、民衆の手書きの文字には、音を表す字はない、と書いていました。
      # fact: rosetta-A22
      - 語り: そして、この石の側面には、「イギリス軍がエジプトで捕獲」と、「ジョージ3世寄贈」の、2つの文字があります。取り上げた石を、国王が博物館に贈った形です。
        tone: 重い
      # fact: rosetta-A04, rosetta-A06
      - 語り: 1799年7月。ナイルのほとり、ロゼッタの町で、ナポレオンの軍が、古い砦を、直していました。
        year: 1799
      # fact: rosetta-A05
      - 語り: 工事の途中で、黒っぽい石が、出てきます。見つけたのは、工兵将校のブシャール、と伝わります。
      # fact: rosetta-A05
      - 語り: 見つかり方は、記録で違います。大英博物館は、砦の増築部の、基礎を掘っていた、と書き、研究者のルクラントは、古い壁の中に、再利用されていた、と書きます。
      # fact: rosetta-A01, rosetta-A02, rosetta-A03
      - 語り: 見つかった日も、はっきりしません。よく言われる15日と19日は、どちらも、当時の記録では、裏づけられません。19日は、当時の雑誌が、会合の日付を取り違えたことと、関係があるとみられ、ルクラントも、根拠は恣意的だと指摘します。
        tone: 重い
      # fact: rosetta-A01
      - 語り: ルクラントは、7月14日から25日のあいだ、と見ています。
      # fact: rosetta-A07
      - 語り: しかも、石は、もとからロゼッタに、あったのではない、と考えられています。ナイル・デルタ内陸の神殿、おそらくサイスから、運ばれてきた、という説が、有力です。
      - 語り: では、石に刻まれた《答え》とは、どんな文だったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 石の中身と、最初の取り違え
  - title: 壁の中の石　メンフィスの勅令
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1799
    lines:
      # fact: rosetta-A08
      - 語り: 大英博物館の項目では、石の最大の長さが112.3センチ、幅75.7センチ、厚さ28.4センチです。
      # fact: rosetta-A09
      - 語り: 刻まれた文字は、3種類。上が、ヒエログリフ、聖なる絵文字。中が、デモティック、それを崩した、民衆の文字。下が、ギリシャ語です。
        figure: {type: stats, title: 石に刻まれた3つの文字, items: [[ヒエログリフ, 14行, 上が欠けた], [デモティック, 32行, 中段], [ギリシャ語, 54行, いちばん残った]], upto: 3}
      # fact: rosetta-A09
      - 語り: ただし、ヒエログリフは、上が欠けて、最後の14行しか、残っていません。いちばん多く残ったのが、ギリシャ語です。
      # fact: rosetta-A10
      - 語り: 中身は、紀元前196年3月27日の、神官たちの決議です。神官たちが、王を称えて決めた、メンフィスの勅令。王は、プトレマイオス5世。石は、発見の日から、およそ2000年前の文書でした。
        figure: null
      # fact: rosetta-A11
      - 語り: 石は、自分の刻み方まで、命じていました。勅令の最後には、こう書かれています。この勅令を、硬い石の碑に、聖なる文字と、土地の文字と、ギリシャの文字で、刻みなさい、と。
        tone: 重い
      # fact: rosetta-A27
      - 語り: ルクラントは、ナポレオンが、石を見る前に、エジプトを離れていた、と書きます。それでも、1799年10月27日、パリの学士院で、こう言ったと記録されています。ヒエログリフの欄も、同じ碑文を含むのは、疑いなさそうだ、と。
        year: 1799
      # fact: rosetta-B06
      - 語り: カイロのフランス語の新聞は、この石が、ヒエログリフを読む鍵に、なるかもしれない、と書きました。
      # fact: rosetta-A12
      - 語り: ところが、ルクラントが引く当時の新聞は、ギリシャ語の訳を、こう報じました。プトレマイオス・フィロパトルが、運河を再び開かせた、と。
        tone: 重い
      # fact: rosetta-A12
      - 語り: 実際の石の文は、プトレマイオス5世の話です。反乱を起こした町を囲み、増水の年に、水路の出口を堰き止めて、攻め落とした出来事でした。運河を再び開く工事の話では、ありません。
      - 語り: 石は、カイロの研究所へ。けれど、そこで作られた写しは、フランスの外の学者には、なかなか渡されませんでした。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 戦利品になった石・外に出ない写し・戦争
  - title: 戦利品になった石　1801年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1800
    lines:
      # fact: rosetta-A16
      - 語り: カイロの研究所は、石が着くとすぐ、3つの方法で、写しを作りました。石を版にして刷る方法、銅版の方法、そして、硫黄で型を取る方法です。
        year: 1800
      # fact: rosetta-B07
      - 語り: ところが、フランスの学者は、写しを、外国人に渡すのを、急ぎませんでした。スウェーデンのオーケルブラードは、1800年10月、デンマークの学者への手紙に、書いています。フランスの学者は、写しを外国人へ急いで渡したがらない、と。
        tone: 重い
      # fact: rosetta-B07
      - 語り: フランスの大学者ド・サシも、同じ学者に詫びました。学士院の気に障るので、ギリシャ語の写しすら、渡せない、と。
      # fact: rosetta-B07
      - 語り: 1799年から3年ほどのあいだ、外国人が読める写しは、ほとんど、ありませんでした。
        tone: 重い
      # fact: rosetta-A26
      - 語り: 1801年4月、ジュリアン砦が、降伏します。見つけた本人のブシャールも、守備側の捕虜に、なっていました。
        year: 1801
      # fact: rosetta-A19
      - 語り: 1801年の8月末から9月初め、アレクサンドリアの降伏協定が、結ばれます。ルクラントによれば、第16条は、フランスの案を、イギリス軍が書き換えました。遺物は、公有財産とし、連合軍の将軍の処分に、委ねる、と。
        tone: 重い
      # fact: rosetta-A20
      - 語り: フランス軍の将軍メヌーは、石を、自分の私物だと、言い張りました。イギリス軍の司令官への手紙には、ロゼッタで私が掘り出させた石を持っている、とあります。英訳で伝わる文面です。
      # fact: rosetta-A21
      - 語り: 石を受け取ったイギリスのターナー大佐は、のちの書簡に、砲兵の運搬車で、メヌーの家から運び出した、と書いています。本人の言い分です。
      # fact: rosetta-A21
      - 語り: 同じ書簡によれば、出発の前、フランスの学者たちは、型を取らせてほしい、と頼み、ターナーは、石を傷つけない条件で、許しました。
      # fact: rosetta-A23
      - 語り: 1802年、石は、イギリスへ。ロンドンの古物協会は、その年の7月、4つの大学へ石膏の型を贈り、ギリシャ語の版画を、ヨーロッパの大学や図書館へ配りました。
        year: 1802
      # fact: rosetta-A22
      - 語り: 石が黒く見えたのは、彫り溝に白いチョークを入れ、全体に蝋を塗ったためだ、と説明されています。1999年の洗浄で、暗い灰色の地と、桃色の脈が、現れました。
      # fact: rosetta-A24
      - 語り: ギリシャ語は、先に読まれました。1802年4月、ステファン・ウェストン牧師が、ロンドンの古物協会で、英訳を口頭で発表しています。
      # fact: rosetta-B09
      - 語り: ところが、デモティックとヒエログリフの版は、作るのが難しく、古物協会が刷ったのは、1803年の4月末から5月。発見から、3年9か月から10か月後です。トマソンによれば、部数は、ギリシャ語の半分でした。
        tone: 重い
      # fact: rosetta-B09, rosetta-B14
      - 語り: その1803年5月、英仏の戦争が、再開します。解読の休止期と呼ばれる、1803年から1815年は、戦争の期間と重なる、とトマソンは指摘します。12年です。手紙も旅も妨げられ、新しい碑文や写しの行き来は、滞りました。
      # fact: rosetta-B14
      - 語り: オーケルブラード自身も、1814年のころに、こう書いています。石は、発見当初、ヨーロッパ中の注目を集めたのに、その後は、考えられないほど、放置された、と。
      - 語り: その休止の前、1802年に、最初に読もうとした人がいました。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 1802年の最初の突破と行き止まり
  - title: 最初の突破と行き止まり　1802年
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1802
    lines:
      # fact: rosetta-B01
      - 語り: ヒエログリフは、神秘的な意味を隠した文字だ。そう見る常識は、長く残りました。フランスのアカデミー辞典は、1835年まで、ヒエログリフを、何か神秘的な意味を含む文字、と定義していました。解読の13年後です。
        year: 1802
      # fact: rosetta-B02
      - 語り: ルネサンス以来、読まれていた本に、ホラポロンの『ヒエログリフィカ』があります。永遠は、太陽と月、というように、1つの絵に、1つの観念を当てた本です。15世紀の初めに、ギリシャで写本が見つかり、欧州に広まりました。
      # fact: rosetta-B04
      - 語り: 17世紀のキルヒャーは、コプト語が、古いエジプト語の子孫で、ヒエログリフを解く鍵だ、と主張しました。のちに正しいと分かる考えです。ただ、彼のヒエログリフの読みは、ほとんど空想だった、と評されます。
      # fact: rosetta-B11
      - 語り: 1802年の初め、ド・サシは、ギリシャ語の固有名が、デモティックの、どこにあるかを、示しました。位置を示しただけで、読めたわけではありません。
      # fact: rosetta-B12
      - 語り: スウェーデンの外交官、オーケルブラードは、その年の秋のはじめに、『ロゼッタのエジプト碑文に関する手紙』を出します。29字の、デモティックの字母を、作りました。およそ半分が、音として当たっていました。
        tone: 重い
      # fact: rosetta-B12
      - 語り: コプト語が、古いエジプト語の、後の姿だと、実際に示した最初の人は、彼だった、とトマソンは見ています。
      # fact: rosetta-B12
      - 語り: けれど、デモティックは、全部アルファベット、と、固く信じていました。意味を表す字が混ざっている、という点を、見抜けず、行き止まりになります。
        tone: 重い
      # fact: rosetta-B13
      - 語り: 1802年11月、彼は、ハーグの公使館書記官に任命され、パリを去ります。当時のドイツの新聞は、彼がパリにいれば、読めたはず、と惜しんだそうです。
        year: 1802
      # fact: rosetta-B13
      - 語り: 次の突破まで、十年あまり。オーケルブラードは、1819年に、ローマで亡くなりました。
      - 語り: 1814年の夏、イギリスの、海べの町で、1人の医者が、石に向かいました。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 ヤング
  - title: 1814年　枠の中の名前　トマス・ヤング
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1814
    lines:
      # fact: rosetta-B16
      - 語り: トマス・ヤング。イギリスの医者で、物理学者でもあります。1814年の夏、ウォーシングでの休暇中に、ロゼッタストーンの仕事に、取りかかりました。発見から、15年後です。
        year: 1814
      # fact: rosetta-B17
      - 語り: ヤングが、1823年の本で、自分の発見として挙げたのは、7つ。そのうち3つは、数は、縦の棒が1、アーチの形が10を表す。銘文は、前から後ろへ読む。固有名は、楕円の枠で、囲まれている、というものです。
      # fact: rosetta-B24
      - 語り: ところが、石のヒエログリフは、欠けていて、枠に入った名は、プトレマイオスしか、ありません。シャンポリオン自身も、『手紙』に、そう書いています。
        tone: 重い
      # fact: rosetta-B19, rosetta-C15
      - 語り: ヤングは、プトレマイオスとベレニケの二つの名に、音を当てようとしました。1819年、『ブリタニカ百科事典』の補遺に載せた、「エジプト」の項です。ベレニケの名の、最初の記号は、かごの形だと見て、コプト語で、かごは「ビル」、と読みました。
        year: 1819
      # fact: rosetta-B19
      - 語り: この読みを、のちにシャンポリオンが、誤りだと批判します。ヤングが、2つの名前だけから、音節の字母を作ったことが、ほかの名に合わない原因だ、と。
      - 語り: 確かめるには、ほかの名前の枠が、もっと必要でした。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 シャンポリオン
  - title: 兄に呼ばれた少年と1822年　シャンポリオン
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1790
    lines:
      # fact: rosetta-B20
      - 語り: ジャン＝フランソワ・シャンポリオンは、1790年12月23日、フランス南西部のフィジャックで、7人きょうだいの末っ子として、生まれました。
        year: 1790
      # fact: rosetta-B20
      - 語り: 12歳上の兄、ジャック＝ジョゼフが、先にグルノーブルへ出て、1801年3月、弟を呼び寄せます。
      # fact: rosetta-B21
      - 語り: パリでは、エジプト出身の聖職者に、コプト語を教わりました。1807年には、ド・サシが、彼を、迎え入れています。
      # fact: rosetta-B23
      - 語り: 手がかりは、石の外から、来ました。収集家バンクスが運んだ、フィラエのオベリスクが、1821年12月、ロンドンに着きます。ロゼッタストーンの発見から、22年5か月後です。
        year: 1821
        tone: 重い
      # fact: rosetta-B23
      - 語り: オベリスクの台座には、ギリシャ語の請願文。ヒエログリフの柱には、枠に入った名前。バンクスは、石版画の余白に、枠の中身は、クレオパトラ、と書き添えました。
      # fact: rosetta-B23, rosetta-C30
      - 語り: シャンポリオンは、2つの枠を比べ、クレオパトラの、ヒエログリフの形を、石版画で、確かめました。プトレマイオスにも、クレオパトラにも、出てくる記号が、同じ音を表していました。これが、読みの手がかりになりました。
      # fact: rosetta-B27
      - 語り: エジプト学者のクァークは、シャンポリオンが、音で書く用法は、外国の名前だけの例外ではなく、体系の、正規の一部だと、論じ始めたことが、決定的だった、と評します。
        tone: 重い
      # fact: rosetta-B30
      - 語り: 決め手は、1822年9月14日だった、と語られます。建築家ユヨの写しにあった、エジプト人の王、ラムセスとトトメスの名を見て、彼は、兄の仕事場に走る。わかった、と叫び、そのまま倒れた、という話です。
        year: 1822
      # fact: rosetta-B29, rosetta-C19, rosetta-B30
      - 語り: この話の出どころは、はっきりしません。研究者のフルネは、出どころとして、1856年の伝記を挙げます。詳しい場面が載るのは、1906年のハルトレーベンの伝記です。34年後と、84年後です。2025年の論文は、この朝のひらめきの物語に、重大な疑問を示しています。
        tone: 重い
      # fact: rosetta-C20
      - 語り: 台詞も、伝える本で割れます。「ジュ・ティアン・ラフェール」と、「ジュ・ティアン・モン・アフェール」の、2通りです。
      # fact: rosetta-B30
      - 語り: さらに、エジプト学者のクァークは、ラムセスとトトメスの枠が、いつ、どの写しから来たのか、分からない、と書いています。
      # fact: rosetta-B35
      - 語り: ただし、彼が読んだのは、写しでした。1822年の時点で、ロゼッタストーンの実物も、フィラエのオベリスクの実物も、見ていません。エジプトへ渡るのは、1828年から29年です。
      # fact: rosetta-B26, rosetta-C21
      - 語り: 『手紙』は、学会の書記ダシエにあてたもので、日付は、1822年9月22日。9月27日、金曜日に、碑文・文芸アカデミーで、読み上げられました。
        tone: 重い
      # fact: rosetta-B26
      - 語り: シャンポリオンが、確定した、と書いたのは、ギリシャ・ローマ時代の、王や女王の名を書く、音の記号、15個です。ラムセスも、トトメスも、この『手紙』の本文には、出てきません。
      # fact: rosetta-B26
      - 語り: ただし、この『手紙』で、エジプト語の文章を、読んだわけでは、ありません。
      # fact: rosetta-B32
      - 語り: 会場には、ヤングも来ていて、その隣に、座りました。王立内科医協会は、2人のはじめての対面だった、と紹介しています。
        tone: 重い
      # fact: rosetta-A26
      - 語り: 『手紙』の日付の48日前、1822年8月5日、ルクラントによれば、石を見つけたブシャールは、フランスの町ジヴェで、亡くなっていました。
        tone: しみじみ
      - 語り: では、この2人の争いは、記録の上では、どうなっているのか。
        tone: 疑問
        hook: true

  # ================================================================ 第6章 先取り争い（記録を並べる）
  - title: 1823年　先取り争い　ヤングとシャンポリオン
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1815
    lines:
      # fact: rosetta-C11, rosetta-B34
      - 語り: 争いの前触れは、読み上げの7年前にありました。1815年7月20日、ド・サシは、ヤングに手紙を書きます。発見をシャンポリオンに、教えすぎないように。あとで、先取りを主張するかもしれない、と。ド・サシは王党派で、ボナパルト派のシャンポリオンを、警戒していました。
        year: 1815
        tone: 重い
      # fact: rosetta-C11
      - 語り: ヤングが、のちにこの手紙を、雑誌に載せたとき、この警告の部分は、削られていました。
      # fact: rosetta-C12
      - 語り: 2人は、1814年から、手紙をやりとりしていました。1815年5月9日付のシャンポリオンの返信は、ロゼッタ碑文についての、あなたの学識ある仕事に、触れています。
      # fact: rosetta-C13, rosetta-C05
      - 語り: では、彼は、ヤングの1819年の項を、いつ読んだのか。決める文書は、ありません。1824年の本には、ヤングの意見を知らないまま、似た結果に達していた、とあります。ただし、手書きの文字についての話とみられます。
        year: 1824
      # fact: rosetta-C13
      - 語り: 一方、1822年の『手紙』の注には、この項の巻と刊行月まで書かれ、引かれています。少なくとも、印刷の時点では、読んでいました。
      # fact: rosetta-C04
      - 語り: ヤングが当てた字は、いくつか。数える人によって、答えが違います。
        year: 1822
        figure: {type: stats, title: ヤングの取り分は何字か, items: [[シャンポリオン1822, 4字, ヤングを認めた数], [ヤング1823, 9字, 自分で挙げた数], [シャンポリオン1824, 15字中5字, ヤングの取り分と見た15字のうち一致]], upto: 3}
      # fact: rosetta-C04
      - 語り: 後世の研究者の見積もりとして、ヤングが提案した13個の音のうち、6つが正解、という数も、紹介されています。何を数えるかが、人によって違うのです。
        figure: null
      # fact: rosetta-C01
      - 語り: ただし、シャンポリオンは、1822年の『手紙』の本文と注で、ヤングの名を挙げています。最初の正確な知見の恩人に数え、注では、4つの記号を、ヤングが見つけた、と認めました。
      # fact: rosetta-C03, rosetta-C29
      - 語り: 1824年の『概説』では、ヤングが最初に、いくつかの正確な知見を公刊した、と明言します。同じ章で、ヤングの結果は、体系を知る確かな光を、1つも与えていない、とも書きました。
      # fact: rosetta-C06
      - 語り: 争いが公になったきっかけは、2人ではありません。『クォータリー・レヴュー』1823年2月号の、無署名の書評です。
        year: 1823
      # fact: rosetta-C02
      - 語り: ヤングは、1823年3月1日付の序文で、シャンポリオンの注を、無意識の曲解に近い、と批判しました。自分が挙げたのは9字、シャンポリオンが足したのは、3字か4字だ、と。
      # fact: rosetta-C08
      - 語り: それでも、シャンポリオンに、不名誉な意図があったことは、完全に、誠実に否定する、とも書いています。
      # fact: rosetta-C09
      - 語り: 朗読の2日後、1822年9月29日、ヤングは友人のハミルトンに、手紙を書きました。シャンポリオンの進歩を、巨大、と呼び、こう続けます。彼は、英国で鍵を見つけた、と言うこともできる。だが、もし英国の鍵を借りたとしても、錠は、ひどく錆びていて、並の腕では、回せなかった、と。
        year: 1822
        tone: 重い
      # fact: rosetta-C16
      - 語り: ヤングの友人ウィリアム・ゲルは、あなたこそ唯一の発明者、と手紙に書き、1855年のヤングの伝記が、その手紙を載せています。友人の目から見た、当時の見方です。
      # fact: rosetta-C17, rosetta-B31
      - 語り: ヤングは、1829年5月に亡くなります。シャンポリオンは、1832年3月4日、41歳で亡くなりました。ヤングの記念碑は、1834年、ウェストミンスター寺院に建ちます。友人のガーニーが、碑文を書き、費用を出し、ヒエログリフの暗がりに、最初に踏み入った、と刻まれました。
        year: 1829
        tone: しみじみ
      # fact: rosetta-C26
      - 語り: では、解読者は、誰と呼ぶのか。大英博物館のパーキンソンは、ヤングは、アルファベットの一部、つまり鍵を見つけ、シャンポリオンは、文字体系を、丸ごと解いた、と整理している、と、歴史メディアの記事は紹介しています。
      # fact: rosetta-C26
      - 語り: ロビンソンは、ヤングが1814年から19年に、決定的な最初の歩みを作り、シャンポリオンが、1822年から23年に、体系を見つけた、と書きます。
      # fact: rosetta-C27
      - 語り: 2020年には、ブフヴァルトとヨゼフォヴィッツが、『ロゼッタの謎』を出しました。1855年に、ヤングの未亡人が、大英図書館に寄贈した、手紙の包みから、1814年夏の、最初の覚え書きを、調べています。
        year: 2020
      - 語り: では、23年のうち、石が答えを渡さなかったのは、何年だったのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 23年の勘定
  - title: 23年は、どこで消えたのか　年数の勘定
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: rosetta-B33
      - 語り: 発見は、1799年7月。『手紙』は、1822年9月。23年と、2か月です。この年月を、3つの区間に分けます。
      # fact: rosetta-B07, rosetta-A24
      - 語り: 最初の区間は、1799年から1803年の、約4年。写しが、外国人になかなか渡らず、1802年に、最初の突破があった時期です。
        figure: {type: stats, title: 23年の中の区間, items: [[写しと最初の突破, 約4年, 1799〜1803], [戦争の休止, 12年, 1803〜1815], [その後, 約7年, 1815〜1822]], upto: 1}
      # fact: rosetta-B14
      - 語り: 次は、戦争の12年。1803年から1815年です。
        figure: {type: stats, title: 23年の中の区間, items: [[写しと最初の突破, 約4年, 1799〜1803], [戦争の休止, 12年, 1803〜1815], [その後, 約7年, 1815〜1822]], upto: 2}
      # fact: rosetta-B16, rosetta-B23
      - 語り: 残りは、1815年から1822年の、約7年。この間に、ヤングの項が出て、オベリスクが着き、『手紙』が書かれます。4年と12年と7年で、23年です。
        figure: {type: stats, title: 23年の中の区間, items: [[写しと最初の突破, 約4年, 1799〜1803], [戦争の休止, 12年, 1803〜1815], [その後, 約7年, 1815〜1822]], upto: 3}
      # fact: rosetta-B01, rosetta-B12
      - 語り: 区間のほかにも、常識の壁がありました。ヒエログリフは、意味だけの絵。デモティックは、全部アルファベット。冒頭で見た、1821年の言葉も、その1つです。
        figure: null
      # fact: rosetta-B24, rosetta-B23
      - 語り: そして、石そのものの壁です。ヒエログリフが欠け、枠に入った名は、プトレマイオスだけ。比べる名前は、石の外のオベリスクにあり、ロンドンへ着いたのは、1821年12月でした。
        tone: 重い
      - 語り: 石には、答えが、ありました。けれど、答えの読み方は、石の外に、あったのです。
        tone: しみじみ
      - 語り: では、石は、誰に、読まれたのか。
        tone: 疑問
        hook: true

  - title: まとめ：ロゼッタストーンは、どうやって読めたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: rosetta-A24, rosetta-B33
      - 語り: 言えることから。ギリシャ語は、先に読まれました。けれど、エジプトの文字の読み方は、写しの遅れと、戦争と、思い込みのあいだで、23年かかりました。
        tone: しみじみ
      # fact: rosetta-C26
      - 語り: ヤングが、最初の歩みを作り、シャンポリオンが、体系を見つけた。そう整理する研究者が、よく見られます。
        tone: しみじみ
      - 語り: 言えないことも、あります。解いたのは1人だった、と言うのは、早すぎます。2人の功績が、同じだった、とも言えません。ヤングが当てた字の数は、何を数えるかで、変わります。
        tone: しみじみ
        pause: 0.8
      # fact: rosetta-A11
      - 語り: この勅令を、3つの文字で刻みなさい。そう命じた石は、2000年のあと、いくつもの国の学者の手で、読まれました。
        tone: しみじみ
        pause: 0.8
      - 語り: あなたは、ロゼッタストーンを読んだのは、誰だと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
