# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸城を戦わずに明け渡した勝海舟は、その30年後、毎月200両が足りない家計で、人に金を渡し続けていました。
  旧幕臣を静岡へ移し、官職を辞め続け、赤坂氷川の屋敷で暮らした30年。勝は、有栖川宮の件で「此方で三十年突張ッて置た」と語っています。
  勝が待っていた日とは、いつの、何の日だったのか。『氷川清話』『海舟座談』『海舟日記』、国立公文書館や大田区の解説をたどって、確かめます。
  この動画でわかること
  ・旧幕臣を静岡へ移した数が、勝自身の記録でも合わない理由
  ・官職を辞め続けた勝の言い分と、年譜の食い違い
  ・赤坂氷川の屋敷と、月に200両足りない暮らし
  ・『氷川清話』は勝の言葉そのままなのか
  ・福沢諭吉『痩我慢の説』と勝の返事、徳川慶喜との30年
  ・1899年1月19日の最期と、墓、没後に起きたこと
description_note: |-
  記録に残る言葉は、出どころ（『海舟日記』『解難録』『海舟座談』『氷川清話』『徳川慶喜公伝』、青空文庫、国立国会図書館、国立公文書館、慶應義塾の解題、大田区立勝海舟記念館、髙橋秀悦さん・飯田鼎さんの論文、サライ、Wikipediaなど）を語りで示してから読んでいます。引用は、読みやすいように今の言葉づかいに直した所があります。
  明治5年12月までの月日は、当時の暦（旧暦）のままです。『海舟座談』は、新しい日付が先に並ぶ本で、日付は見出しの並びから読んでいます。
  国立国会図書館デジタルコレクションの全文を文字にしたもの（OCR）を使った所は、原本の画像までは確かめられていません。『氷川清話』の「三月二日」「五月二日」の違い、「コレデオシマイ」の出どころ、叙爵の逸話、榎本武揚の赦免への勝の関わり、勝が辞職した本当の理由は、確かめられなかったため、言い切らないか、取り上げていません。
  画面の人物・情景の画像の多くは、画像生成AI（Gemini）による想像図です。勝海舟の人物像も、AIによる想像図で、実在の肖像ではありません（画面の右上に「AI生成画像」と出しています）。
  実在の写真・絵は、勝海舟・徳川慶喜の肖像写真、F.ベアト撮影の江戸城の濠（いずれもウィキメディア・コモンズ、パブリックドメイン）などです。

en:
  title: "Katsu Kaishu After Edo: 200 Ryo Short Every Month, and the Day He Waited 30 Years For"
  description: |-
    Katsu Kaishu handed over Edo Castle without a fight. Thirty years later he was running a household that fell 200 ryo short every month, and still giving money away.
    He moved the former shogunate retainers to Shizuoka, resigned one government post after another, and lived in Akasaka Hikawa. About one particular day he said, "I had held out for thirty years for this."
    Which day was it? We follow his diary, his talks, and the records of others to find out.
    In this video you will learn:
    - Why the number of retainers he moved to Shizuoka does not match, even in his own records
    - Why he kept resigning, and where his account and the chronology disagree
    - Life in the Hikawa house, and the monthly 200 ryo shortfall
    - Whether "Hikawa Seiwa" is really his own words
    - Fukuzawa Yukichi's essay and Katsu's reply, and his thirty years with Tokugawa Yoshinobu
    - January 19, 1899, his grave, and what happened after
    Portraits and scenes are AI-generated imagery. Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Man Who Saved Edo Was Short 200 Ryo a Month"
    - "How Many Retainers Went to Shizuoka? 1868"
    - "Why Did He Keep Resigning? 1869-1875"
    - "The House in Akasaka Hikawa: 1872"
    - "Short 200 Ryo a Month: Where the Money Went"
    - "Is Hikawa Seiwa His Own Voice?"
    - "Fukuzawa's Essay and Katsu's Reply: 1892"
    - "Thirty Years With Yoshinobu: March 2, 1898"
    - "January 19, 1899"
    - "The Grave and What Happened After"
    - "Summary: What Was the Day He Waited For?"

