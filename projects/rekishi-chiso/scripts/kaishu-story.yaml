sections:
  # ================================================================ 序章（冒頭 約3分）。答え（勝が突っ張って待った日）は第7章まで言わない
  - title: 江戸を救った男は、なぜ30年、金を配り続けたのか　1868年〜1898年
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1898
    lines:
      # 0〜10秒：意外な一点（戦わず明け渡した男が毎月200両足りない家計）。0〜約30秒：知らない事実3つ（月200両の不足・沢庵漬が3〜4日で尽きた・慶喜に嫌われたと自分で語る）＋答えの席＋約束
      # fact: kaishu-B08, kaishu-B11, kaishu-B15
      - 語り: 江戸城を戦わずに明け渡した勝海舟は、その30年後、毎月200両が足りない家計で、人に金を渡し続けていました。
        tone: 重い
        card: {head: "勝海舟", body: 毎月200両足りない家計}
      # fact: kaishu-A02
      - 語り: 旧幕臣を静岡へ移すと、3日か4日で、なくなったのは、沢庵漬でした。
      # fact: kaishu-B22
      - 語り: そして海舟は、晩年、こう語っています。徳川慶喜に嫌われ、海舟がいては良くない、とまで言われた、と。
        tone: 強調
      # 答えの席＋約束
      # fact: kaishu-B29
      - 語り: その海舟が、「三十年、突っ張っておいた」と語った場面があります。海舟が待っていた日とは、いつの、何の日だったのか。答えは、最後に、記録で確かめます。
        tone: 疑問
      # fact: kaishu-B08
      - 語り: 1898年、明治31年の10月。海舟は、座談で、こう打ち明けました。月の入用は500両、月給は300両。毎月200両は、何とか工面しなければならない、と。
        card: {head: "1898年10月", body: 入用500両・月給300両}
      # fact: kaishu-B09
      - 語り: 同じ月には、こうも語っています。匹田という人から2千両を借り、月に20両ずつ、利子を払っている、と。
      - 語り: 20両を12か月で240両。2千両に対して、年12パーセントです。
        tone: 強調
        figure: {type: bars, title: 海舟の月の家計（1898年10月の座談）, bars: [[入用, 500], [月給, 300], [足りない分, 200]], labels: [500両, 300両, 200両]}
      # fact: kaishu-A01
      - 語り: 話は、30年前にさかのぼります。1868年、江戸城の明け渡しのあと、海舟は、旧幕臣を静岡へ移す世話に、追われました。
        figure: null
        card: {head: "1868年", body: 江戸城の明け渡し}
      # fact: kaishu-A13
      - 語り: ところが、徳川家の金庫には、金の分銅が、たった一つあるだけだった、と海舟は『解難録』に書いています。
      # fact: kaishu-B24, kaishu-B28
      - 語り: 一方の慶喜は、静岡で、29年あまり暮らしました。東京へ出たのは、1897年の11月です。
      - 語り: 無血開城のあと、海舟は、どう暮らし、誰のために動いたのか。江戸を救った男の、そのあとの30年を、たどります。
        tone: 疑問

  # ================================================================ 第1章 静岡へ移した八万人（1868）。記録の食い違い①
  - title: 静岡へ移した八万人？　1868年　旧幕臣たちの引っ越し
    background: {image: paintings/yoshinobu_beato_yedo_palace_kitlv.jpg, credit: "F.ベアト 江戸城のあたり（1860年代〜70年代初め、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1868
    lines:
      # fact: kaishu-A01
      - 語り: 海舟は、後年の談話「旗本移転後の始末」で、こう語っています。旧旗本を静岡へ移したのは、およそ八万人。政府は、十日で移せと言ったが、それは無理なので、二十日の猶予を願い、汽船二艘で運んだ、と。
        card: {head: "八万人", body: 海舟が語った、静岡へ移した数}
      # fact: kaishu-A02
      - 語り: そして、移してから3日か4日で沢庵漬がなくなり、4日か5日で、ちり紙がなくなった。「おれも実に狼狽したよ」と、海舟は語ります。
      - 語り: ところで、この八万人という数は、本当なのでしょうか。
        tone: 疑問
      # 食い違い①
      # fact: kaishu-A04
      - 語り: 海舟は、1868年に、新政府から、旗本・御家人の総員を調べて出せと命じられました。人員帳が西の丸の火事で焼けていたので、一から調べ直した。出てきた家の数は、3万3千4百あまりでした。
      # fact: kaishu-A07
      - 語り: さらに、同じ年の閏4月13日、田安殿への書で、海舟は、子どもや使用人まで含めて、主が領地を失い飢える者は、おおよそ37万人か38万人を下らない、と書いています。
      - 語り: 八万人、3万3千4百あまりの家、37万人か38万人。数えている単位が違うので、同じ物差しでは比べられません。それでも、海舟自身の記録のなかで、これだけ数が動きます。
        figure: {type: stats, title: 海舟自身の記録に出る数, items: [[静岡へ移した（後年の談話）, 八万人, 旧旗本], [旗下の総員（解難録）, 3万3千4百余家, 家の数], [飢える者（閏4月の書）, 37〜38万人, 子弟・使用人込み]], upto: 3}
      # fact: kaishu-A09
      - 語り: 1868年の6月20日。旧幕臣には、三つの道が示されました。朝臣になるか、暇を願って帰農・帰商するか、無禄で駿河へ移るか。6月26日までに選べ、という通達です。
        figure: null
        card: {head: "1868年6月20日", body: 三つの道を選べ}
      # fact: kaishu-A09
      - 語り: 無禄の移住でも、道中の費用も、住む所も、新政府は、出さないと、はっきり書かれていました。
      # fact: kaishu-A12
      - 語り: 徳川家の家計と、藩士を養う費用のために、海舟は、三条実美の許しを得て、1万石以上の大名家に、助成を頼んだと、『解難録』に書いています。
      # fact: kaishu-A12
      - 語り: 1869年の4月27日までに、集まったのは、米400俵と、金82,845両あまり、紙幣14,684両。金と紙幣を足すと、およそ9万7千5百両です。
      # fact: kaishu-A14
      - 語り: 江戸城の明け渡しのあと、精鋭隊の中条金之助らは、隊士500名のうち100名が、城の中で割腹する、と海舟に申し出ました。海舟は、それを止めて、久能山で、家康の廟を守ってはどうか、と勧めたと、書いています。
        tone: 重い
      # fact: kaishu-A15
      - 語り: 海舟自身も、1868年の10月11日に、移住者と同じ船で、東京を発ちました。
      # fact: kaishu-A15
      - 語り: 12日に駿府へ着いて慶喜に会いますが、11月9日、箱館の脱走艦の件で徳川家に譴責の書付が出て、大久保一翁とともに、急ぎ東京へ戻れと命じられます。静岡にいたのは、およそ4週間でした。
      - 語り: 八万人を送り出した海舟は、静岡に、長くはいられなかった。次に、海舟の身に何が起きたのか。
        tone: 疑問
        hook: true
      - 語り: 新政府が、海舟に用意した席は、いくつもありました。
        hook: true

  # ================================================================ 第2章 官職を辞め続けた勝（1869〜1875）。記録の食い違い②
  - title: 官職を辞め続けた勝海舟　1869年〜1875年　外務大丞から元老院議官まで
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1869
    lines:
      # fact: kaishu-A17
      - 語り: 1869年、明治2年の7月18日。海舟は、外務大丞に任じられます。翌日には、三条実美に会って辞退を願い、慶喜の謹慎が許されるなら働く、という趣旨の、交換条件を持ち出しました。
        card: {head: "1869年7月", body: 外務大丞を辞退}
      # fact: kaishu-A18
      - 語り: 日記は、同じ年の9月28日に、こう記します。慶喜の謹慎は、天皇の意向で、許された、と。
      # fact: kaishu-A19
      - 語り: 11月23日には、兵部大丞を命じられます。海舟は、その場で、岩倉具視に、兵部は不案内、海軍なら少しは努力する、と断りました。
      # fact: kaishu-A25
      - 語り: 1873年、明治6年の10月25日。日記に、海舟は、こう書いています。参議兼海軍卿を、直接命じられた。岩倉公へ、才がなく、勤めがたい、と申し上げた、と。
        card: {head: "1873年10月25日", body: 参議兼海軍卿を命じられる}
      # fact: kaishu-A26
      - 語り: ところが、その海軍卿として、何をしたのか。海舟は、後年の座談で、時々出ていって小さな印を押すだけで、何もしない。川村が次官だから、功は、川村のものにさせた、と語っています。
      # fact: kaishu-A26
      - 語り: Wikipediaも、海軍と直接関わった形跡はない、と書きます。
      # fact: kaishu-A27, kaishu-A42
      - 語り: 辞表を出したのは、1874年の8月。台湾出兵に反対したためと、ある論文とWikipediaは書きますが、海舟本人の言葉で確かめられた記録は、見つかりませんでした。
      # fact: kaishu-A28
      - 語り: 1875年の4月25日、海舟は元老院議官に移されます。そして、4月27日には、もう辞表を出しました。承認されたのは、11月28日。議官に移されてから数えて、217日です。
        card: {head: "1875年4月27日", body: 元老院議官の辞表}
        tone: 強調
      # fact: kaishu-A28
      - 語り: その間、海舟は出勤せず、引き籠っていました。それでも、給料は支払われ、日記には、5月29日に315円、6月17日に350両、とあります。
      # fact: kaishu-A28
      - 語り: 海舟は、これを政府に返すのも変なものだ、と考えていました。
      # fact: kaishu-A29
      - 語り: 官職の話では、海舟の語りと年譜が、食い違う所があります。1873年の、島津久光の上京です。海舟は座談で、長崎へ御用がある、という書付をもらい、一人で行って、久光を連れて来た、と語ります。
      - 語り: ところが年譜類は、3月22日に、勅使の西四辻公業と共に鹿児島へ下り、4月に久光を上京させた、と書いています。
        figure: {type: stats, title: 島津久光の上京の話, items: [[海舟の座談, 一人で行って連れて来た, 書付をもらって], [年譜類, 勅使と共に下向, 3月22日・4月に上京]], upto: 2}
      # fact: kaishu-A30
      - 語り: 海舟が、官職の外で使った金もあります。1875年の8月28日。商法講習所の金に困っていると聞いて、海舟は、千両の援助を申し出ました。9月4日の東京日日新聞は、金千円を助力、と報じています。
        figure: null
        card: {head: "1875年8月28日", body: 商法講習所に千両を申し出る}
      - 語り: 官職の外で、海舟は、どんな暮らしをしていたのか。
        tone: 疑問
        hook: true
      - 語り: その舞台は、赤坂の、ある屋敷でした。
        hook: true

  # ================================================================ 第3章 赤坂氷川の屋敷（1872〜）
  - title: 赤坂氷川の屋敷　1872年からの住まい
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1872
    lines:
      # fact: kaishu-B04
      - 語り: 大田区の勝海舟記念館の解説によると、海舟は、5500石の元旗本、柴田七九郎の屋敷を買い、1872年、明治5年の8月に、赤坂氷川のその屋敷に、移り住みました。
        card: {head: "1872年8月", body: 赤坂氷川の柴田邸へ}
      # fact: kaishu-B05, kaishu-A39
      - 語り: 座談の記録には、編者の注つきで、この家は5千石の旗本の家だ、とあります。大田区の5500石とは、500石の差があります。
      # fact: kaishu-B04
      - 語り: この赤坂氷川の屋敷は、1927年に旧氷川小学校が移るまで、勝家の本宅でした。海舟がここで暮らしたのは、1872年から1899年まで、26年半あまりです。
      # fact: kaishu-B01
      - 語り: 巌本善治は、その屋敷を、こう記します。門から玄関まで、十四、五間、およそ25メートルから27メートルの石だたみ。左右の黒塀には、所々に、継ぎや繕いがありました。
      # fact: kaishu-B02
      - 語り: 晩年の海舟が、日夜を過ごしたのは、六畳と八畳の二間。客が4人で、六畳の間が、いっぱいになりました。茶は二度、菓子、コーヒーの順で、膳は一汁一菜でした。
      # fact: kaishu-B03
      - 語り: 巌本善治は、田舎から親しく出入りする者だけで、3千人を超えるそうだ、と書いています。海舟は、その生国、住所、職業を、手帳と地図に書き込んでいた、というのです。
      # fact: kaishu-B07
      - 語り: 洋画家の川村清雄は、一時期、この屋敷の敷地で暮らしました。客間の床には、『蛟龍天に昇る』の大きな油絵が掛かり、その上に、大久保一翁と山岡鉄舟の肖像が掛かっていました。
      # fact: kaishu-A38
      - 語り: 海舟のもとには、旧幕臣が預けられていたこともありました。海舟は、座談で、沼間守一や江原素六らは、みんな自分に預けになっていた、書付が今も残っている、と語ります。500人もあったろう、というのです。
      # fact: kaishu-A37
      - 語り: 新政府は、海舟の暮らしを、見ていました。1877年、西南戦争のさなか、新政府は、海舟と山岡鉄舟の動静を探らせます。
      # fact: kaishu-A37
      - 語り: 国立公文書館は、西郷らに同情的で、旧幕臣へ金銭の援助をしていた海舟を、不穏な人物として警戒していた、と解説しています。
      - 語り: 金を配る海舟の家計は、どうなっていたのか。
        tone: 疑問
        hook: true
      - 語り: 海舟は、その数字を、自分から語っています。
        hook: true

  # ================================================================ 第4章 月に200両足りない暮らし（1898）。記録の食い違い③
  - title: 月に200両足りない暮らし　1898年　金の出ていく先
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1898
    lines:
      # fact: kaishu-B11
      - 語り: 座談で、海舟は、こうも語ります。あちこちへ、月々、10円、20円、30円、40円と渡すのが大変だ、と。別の日の座談では、ホイットニーの妹に、60円ずつ渡している、とも話しています。
        card: {head: "1898年10月", body: 月々の渡し金}
      # fact: kaishu-B10
      - 語り: 郵船の払い込みに、6千両が要りました。海舟は、借りようとしましたが、千駄ヶ谷の徳川家が横槍を入れる。結局、徳川家からは取らず、公債を売って払い込んだ、と語っています。
      # fact: kaishu-B12
      - 語り: 11月の座談では、書を書くと、墨と紙で、月に30円ほどかかる。礼に7両2歩をもらった日に、貧民に7両をねだられた、と話しています。
      # fact: kaishu-B13
      - 語り: 『氷川清話』の海舟は、1円、1円の金をもらいに来る者は、昔から今まで毎日絶えないが、来るのは、大抵男だ、と語ります。
      # fact: kaishu-B14
      - 語り: 零落した旗本が、古道具屋を始めると、夜に、知らぬふりで冷やかしに行って、言い値で高く買ってやる。それが、自分の金の使い方だ、とも語っています。
      # fact: kaishu-B15
      - 語り: 牧之原、金谷の開墾に入った旧幕臣には、食い扶持を送り続けた。いま残っているのは、百人ほど、と海舟は語ります。
      # fact: kaishu-B15
      - 語り: 1897年にも、200円を求めて来た服部を、叱ったあとで、200円を渡した、というのです。
      # fact: kaishu-B19
      - 語り: 勝家の資産は、どれほどだったのか。海舟は、家禄が3万5千円、それと家屋敷で、10万円ほどだ、と語ります。1895年に書いた遺言状を、書き直さなければならない、とも言っています。
        figure: null
      # fact: kaishu-B17
      - 語り: 一方、慶喜の暮らし向きについて、海舟は、徳川家の経済は年に5万円、慶喜の方は年に2万円、と語ります。慶喜には別に金があり、渋沢栄一が、その利子を出している、というのです。
      # fact: kaishu-B18
      - 語り: ところが、海舟は、別の所では、慶喜に禄はないが、別に10万円ほどあり、それを渋沢に預けた利子で暮らしている、とも語っています。
      # fact: kaishu-B18
      - 語り: 利率を5分とすると、10万円の利子は、年に5千円。年に2万円とは、合いません。
      - 語り: 海舟の語る金の話は、どこまで、海舟の言葉そのままなのか。
        tone: 疑問
        hook: true
      - 語り: 海舟の談話をまとめた本には、書き換えの跡がありました。
        hook: true

  # ================================================================ 第5章 検証：『氷川清話』は勝の言葉そのままか。記録の食い違い④
  - title: 検証：『氷川清話』は、勝海舟の言葉そのままなのか　1897年
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1897
    lines:
      # fact: kaishu-C20
      - 語り: 『氷川清話』は、1897年の11月22日、鉄華書院から出ました。編んだのは、吉本襄。続編が1898年の5月27日、続々編が11月17日。初版は、海舟が亡くなる423日前でした。
        card: {head: "1897年11月22日", body: 『氷川清話』初版}
      # fact: kaishu-C23
      - 語り: 海舟は、最初の本の計画を、認めていた、と伝わっています。1897年10月6日の『海舟座談』に、勝手にしなさいと言っておいた、とあります。
      # fact: kaishu-C23
      # fact: kaishu-C21
      - 語り: Wikipediaによると、吉本襄は、1896年以前の談話から、伊藤博文、陸奥宗光、松方正義の名前を削りました。
        tone: 強調
      # fact: kaishu-C21
      - 語り: 1896年5月28日の『国民新聞』にあった、伊藤博文への批判は、「今の政治家」への批判に書き換えられ、知行合一の一文まで、付け加えられた、とWikipediaは書いています。
      # fact: kaishu-C22
      - 語り: そもそも、成り立ちの説明が、割れています。飯田鼎さんの1997年の論文は、海舟の屋敷で人々が回顧談を引き出し、速記させたもの、と書きます。
      - 語り: 松岡正剛さんは、来訪した記者の聞き書き、と書き、Wikipediaは、新聞や雑誌にあった談話を、吉本が編み直した本、と書きます。
        figure: {type: stats, title: 『氷川清話』の成り立ち, items: [[飯田鼎（1997）, 速記, 海舟の屋敷で語らせた], [松岡正剛, 聞き書き, 来訪した記者], [Wikipedia, 再編集, 既存の談話を吉本襄が]], upto: 3}
      # fact: kaishu-C24
      - 語り: もう一つの本が、『海舟座談』です。元になったのは、巌本善治が、海舟の死のすぐ後に出した『海舟余波』。『女学雑誌』の480号、1899年の1月25日号に、海舟を失う嘆きが載りました。
        figure: null
      # fact: kaishu-C26
      - 語り: 『海舟座談』は、海舟が亡くなる5日前、1899年1月14日から、1895年の7月までの談話を、新しい日付が先に来る形で並べています。
      # fact: kaishu-C26
      - 語り: ある紹介には、速記ではなく、巌本善治の記憶による聞き書きだ、と書かれています。
      # fact: kaishu-B23
      - 語り: 海舟の語りには誇張がある、と、慶喜自身が評しています。渋沢栄一の『徳川慶喜公伝』には、慶喜の談話が載ります。
        tone: 強調
      # fact: kaishu-B23
      - 語り: 海舟は、恭順を勧めたというが、世に伝わる所とは、少し違う。「海舟の談話として世に伝わるものには、多少の誇張を免れない」と、慶喜は評しました。
      - 語り: 海舟の言葉には、編む人の手が入り、誇張も混じる、と慶喜は見ていた。そのことを頭に置いたうえで、海舟が語った、慶喜との30年を、たどります。
      - 語り: その前に、海舟を名指しで批判した、ある文章があります。
        tone: 疑問
        hook: true
      - 語り: 福沢諭吉が書いた、海舟への批判です。
        hook: true

  # ================================================================ 第6章 福沢諭吉『痩我慢の説』と勝の返事（1891〜1892）
  - title: 福沢諭吉『痩我慢の説』と、勝の返事　1892年2月6日
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1892
    lines:
      # fact: kaishu-C10
      - 語り: 海舟は、1887年の5月9日に伯爵になり、1888年の4月30日には、枢密顧問官になりました。叙爵から枢密顧問官まで、357日です。
        card: {head: "1887年5月9日", body: 海舟が伯爵になる}
      # fact: kaishu-C09
      - 語り: 福沢諭吉は、この海舟を、批判します。『痩我慢の説』で、福沢は、海舟に、断然、政府の寵遇を辞し、官爵を棄て、利禄を抛ち、単身去って、跡を隠すことを求めました。
      # fact: kaishu-C05
      - 語り: 脱稿の日は、慶應義塾の解題とWikipediaが、1891年の11月27日とします。国立国会図書館の解説は、明治24年の冬ごろで、海舟と榎本への送付は、明治25年の1月末、とします。
      # fact: kaishu-C01
      - 語り: 海舟の返事、答書は、1892年の2月6日付です。福沢の手紙と、榎本武揚の返事は、前日の2月5日付でした。11月27日に書き上げたとすると、返事まで、71日です。
        card: {head: "1892年2月6日", body: 海舟が福沢へ答書}
      # fact: kaishu-C02
      - 語り: 海舟の答書は、有名な一句の前に、こう書きます。福沢の批判を、実に慙愧に堪えない、深い志、ありがたく存じます、と受けとめます。一句のあとには、異存はない、草稿はいただきたい、と続け、末尾には、病気で臥せっている、と書き添えました。
      - 語り: そして、あの一句です。「行蔵は我に存す、毀誉は他人の主張、我に与からず我に関せずと存候」。出るも退くも、自分で決めたこと。ほめるのも、けなすのも、他人のこと。自分は、関わらない、という意味です。
        tone: 強調
      # fact: kaishu-C40
      - 語り: この一句を、飯田鼎さんは、強烈な個人主義、と読みます。答書の冒頭は、皮肉、と読みました。
      # fact: kaishu-C03
      - 語り: 福沢は、手紙の追伸で、草稿は、2、3人の親友のほかには、誰にも見せていない、と書きました。
      # fact: kaishu-C03
      - 語り: ところが、慶應義塾の解題によると、草稿の写しは、海舟と榎本のほか、木村芥舟、栗本鋤雲、徳川頼倫にも、送られていました。
      # fact: kaishu-C04
      - 語り: 写しは、栗本鋤雲を通じて『奥羽日日新聞』に渡り、1894年ごろに、書き手と相手の名を伏せて載りました。1900年の12月20日には、『日本人』が、全文を再録しました。
      # fact: kaishu-C06
      - 語り: 『時事新報』に初めて載ったのは、慶應義塾の解題によれば、1901年の1月1日と3日。海舟が亡くなってから、712日後です。
        card: {head: "1901年1月1日", body: 『時事新報』に載る}
      # fact: kaishu-C07, kaishu-C08
      - 語り: 海舟は、新聞に載った『痩我慢の説』を、読んでいません。福沢が亡くなったのは、2月3日。掲載の33日後でした。徳富蘇峰は、1月13日に海舟を弁護する文を書き、福沢の反駁は、1月25日に載りました。
      - 語り: 海舟は、新聞に載った形では、これを読めませんでした。では、その30年、海舟は、誰のために、突っ張っていたのか。
        tone: 疑問
        hook: true
      - 語り: 相手は、静岡にいた、ある人でした。
        hook: true

  # ================================================================ 第7章 慶喜と30年（答え）
  - title: 徳川慶喜と30年　1892年から1898年3月2日の参内まで
    background: {image: paintings/yoshinobu_beato_yedo_castle_moat.jpg, credit: "F.ベアト 江戸城の濠（1860年代〜70年代初め、ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1892
    lines:
      # fact: kaishu-C36
      - 語り: 1892年、海舟の長男、小鹿が亡くなります。海舟の答書の2日後、2月8日でした。サライは、返書の翌日、と書き、1日ずれます。
        card: {head: "1892年2月8日", body: 長男・小鹿が亡くなる}
      # fact: kaishu-B20
      - 語り: 海舟は、小鹿の棺の横で、こう言ったといいます。自分の死んだあと、勝家を徳川氏に奉還したい。そして、慶喜公の末子を貰いたい、と。それを聞いた慶喜は、涙にむせんだ、と座談は記します。
      # fact: kaishu-C36
      - 語り: 慶喜が、末子の件を承諾したのは、2月14日。小鹿の死の、6日後です。
      # fact: kaishu-B21
      - 語り: ただ、小鹿の死のとき世話をした人は、座談で、こう語っています。末子を差し上げる話になったが、その後は一向に進まないまま、海舟が亡くなった、と。
      # fact: kaishu-B31
      - 語り: 海舟は、慶喜が東京へ来てから忙しくなった、と語ります。それまで、海舟は、一門が、慶喜のもとへ往来しないよう、止めてありました。党を作るおそれがある、からです。
      # fact: kaishu-B22
      - 語り: その慶喜に、海舟は、嫌われていた、と自分で語ります。慶喜公に嫌われて、海舟がいては良くない、とまで言われた。書面にも、徳川家を禍いするものは勝海舟である、と書かれたのを見た、というのです。
        tone: 重い
      # fact: kaishu-B24
      - 語り: 慶喜は、1897年の11月16日に静岡を発ち、19日に千駄ヶ谷に着きました。そのまま、巣鴨の別邸に入り、1901年の12月まで、およそ4年1か月を、そこで過ごします。
        card: {head: "1897年11月", body: 慶喜が東京へ}
      # fact: kaishu-B29
      - 語り: 1898年の2月。有栖川宮が、慶喜に会いたい、と言ってきました。『徳川慶喜公伝』によれば、慶喜が宮に初めて会ったのは、2月9日です。
      - 語り: 海舟は、座談で、こう語っています。慶喜に、どうだろう、と聞かれて、「此方で三十年突張ッて置たのだ、もう、また機を失っても宜しくない」と答えた、と。
        tone: 強調
      # fact: kaishu-B29
      - 語り: 同じ記事で、海舟は、こうも言っています。今日まで、私が突っ張っておいたから、こうなった。もういい加減、機会の時にしないと、機会が去ってしまう、と。
      # fact: kaishu-B29
      - 語り: 『氷川清話』では、参内についても、徳川家から相談を受け、海舟は、内々に奔走した、と語っています。
      # fact: kaishu-C35
      - 語り: 1898年の3月2日。慶喜は参内し、明治天皇に拝謁しました。江戸城の引き渡しから、およそ30年です。
        card: {head: "1898年3月2日", body: 慶喜が参内、明治天皇に拝謁}
        tone: 重い
      # fact: kaishu-B25
      - 語り: 『氷川清話』の海舟は、慶喜が、参内の翌日に、わざわざ訪ねて来て、拝謁と下賜品の話をしたので、嬉し涙がこぼれた、と語ります。
      # fact: kaishu-B25
      - 語り: 『徳川慶喜公伝』は、3月2日の参内で、銀の花瓶一対、紅白の縮緬、銀の杯一組を賜った、と記し、同じ品が並びます。
      # fact: kaishu-B27
      - 語り: その翌日、海舟は、慶喜に勧めました。昔の小大名などとは交際するな。馬車に乗らず、一人引きの車で出よ。時々徒歩で市中を見よ。慶喜は、「楽天理」と書いてくれ、と頼んだ、といいます。
      # fact: kaishu-B26
      - 語り: ここにも、食い違いがあります。『氷川清話』が参内の日を書く版は、1898年版、1902年版、1909年版が「三月二日」、1927年版と1933年版は、文字にしたものが「五月二日」です。
        figure: {type: stats, title: 参内の日の書かれ方, items: [[氷川清話 1898・1902・1909年版, 三月二日, 参内の日], [氷川清話 1927・1933年版, 五月二日, OCRの文字], [徳川慶喜公伝, 3月2日と5月20日, 参内と東宮御所]], upto: 3}
      # fact: kaishu-B26
      - 語り: 『徳川慶喜公伝』は、3月2日の参内と、5月20日の東宮御所を、分けて記します。
      # fact: kaishu-B28
      - 語り: もう一つ。海舟は、「この間は二十年ぶりで慶喜公にお目にかかった」と語ります。
        figure: null
      # fact: kaishu-B28
      - 語り: しかし、慶喜は静岡に29年あまりいて、江戸城の引き渡しから参内まででは、30年です。どの再会を指すのかは、文章からは分かりません。
      - 語り: この日が、海舟が、三十年、突っ張って待った日だったのか。海舟の言葉で、確かめます。
        tone: 疑問
      # fact: kaishu-B32
      - 語り: 海舟は、徳川家を立てたのは、慶喜が3度頭を下げて、お前に全く任せるから、良いようにしてくれ、と頼んだからだ、と語ります。
      # fact: kaishu-B32
      - 語り: 別の所では、慶喜が涙をこぼして、ぜひお前でなくては、と頼んだ、とも言っています。
      # fact: kaishu-B33
      - 語り: 徳川氏から、海舟の暮らしに何かしよう、という相談が出たとき、海舟は怒りました。慶喜か、大久保か、あまり人を見下げた話だ。
      # fact: kaishu-B33
      - 語り: 報いるというなら、70万石をこちらによこしなさい、と言い放ったと語っています。
      # fact: kaishu-B34
      - 語り: 宮内省が、慶喜を、家達の養父のように書いてよこすと、海舟は、以後、養父と心得て宜しいのか、と突き返しました。慶喜は、上野で謹慎し、水戸、静岡へ行った、無爵で無籍の人だ、とも語っています。
      # fact: kaishu-B30
      - 語り: その年の11月30日の座談で、海舟は、こう語っています。慶喜が、夜に訪ねて来て、有栖川宮から、なぜ出ないのか、と言われたが、どうしよう、と相談した。海舟は、お出なさい、と答え、あなたはぶち壊すことが上手だから、と添えた、と。
      - 語り: 海舟は、この参内を、慶喜が表に出る機会と見ていた。記録は、そう読めます。
        tone: しみじみ
        hook: true
      - 語り: では、参内のあと、海舟には、どれだけの時間が、残っていたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第8章 1899年1月19日
  - title: 1899年1月19日　勝海舟が亡くなった日
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1899
    lines:
      # fact: kaishu-C35
      - 語り: 慶喜の参内、1898年の3月2日から、海舟が亡くなる1899年の1月19日まで。323日です。
        card: {head: "323日", body: 参内から海舟の死まで}
        tone: 重い
      # fact: kaishu-C34
      - 語り: 同じ年の12月18日に、上野の西郷隆盛像の除幕式がありました。海舟が亡くなったのは、その32日後です。
      # fact: kaishu-C27
      - 語り: 亡くなった日の様子は、伝えが2つに分かれます。Wikipediaは、女中の増田糸子さんの話として、死ぬかもしれないよと言って、ショウガ湯を持って来いと言った。
      # fact: kaishu-C27
      - 語り: 間に合わないので、ブランデーを持って行った、と書きます。
      - 語り: サライは、午後5時ごろ、入浴のあと、胸が苦しいからブランデーを持ってこい、と自分で命じ、一口飲んで倒れた、とします。
        figure: {type: stats, title: 最期の場面の書かれ方, items: [[Wikipedia（増田糸子の話）, ショウガ湯→ブランデー, 間に合わず], [サライ, 自分でブランデーを命じた, 入浴後・午後5時ごろ]], upto: 2}
      # fact: kaishu-C28
      - 語り: 最期の言葉として知られる「コレデオシマイ」は、どうか。サライは、駆け付けた旧幕臣が、海舟の妹から聞いた話、とします。
        figure: null
        tone: 重い
      # fact: kaishu-C28
      - 語り: Wikipediaは、勝部真長さんの本を出典に置くだけで、同時代の記録での裏づけは、確かめられませんでした。
      # fact: kaishu-C29
      - 語り: 年齢も、揺れます。大田区は、享年77と書きます。サライは、数えで77歳、満で75歳とします。1823年生まれで、1899年1月19日に亡くなったので、満年齢は、75歳です。
      # fact: kaishu-C37
      - 語り: その翌日、1899年1月20日。慶喜の末の子、精が、海舟の家に入りました。小鹿の娘、伊代子の婿として、です。1888年8月23日生まれの精は、10歳。海舟の死で、勝家の家督と伯爵を継ぎました。
        card: {head: "1899年1月20日", body: 慶喜の末子・精が勝家に入る}
      # fact: kaishu-C37
      - 語り: 海舟は、最初、慶喜の子として、慶久を望みました。しかし、慶喜は、あれは当家の嗣子だから、と断り、末の男の子の精を出しました。
      # fact: kaishu-C30
      - 語り: 葬儀は、亡くなって6日後の、1月25日。棺は、青山の葬祭場から、洗足池のほとりへ送られて、埋葬されました。戒名は、大観院殿海舟日安大居士です。
      - 語り: 海舟が生前に自分で選んでいた墓所は、洗足池のほとりでした。
        tone: しみじみ
        hook: true
      - 語り: その墓には、墓石の字を巡る、小さな食い違いがありました。
        hook: true

  # ================================================================ 第9章 墓と没後
  - title: 洗足池の墓と、没後　勝海舟が選んだ場所
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1899
    lines:
      # fact: kaishu-C32
      - 語り: 海舟は、1890年に、洗足池の土地を手に入れ、1892年ごろにかけて、別荘、洗足軒を建てました。遺言は、洗足池のほとりに葬ってほしい。洗足軒の裏には、生前に、自分で墓所を用意していました。
        card: {head: "1890年", body: 洗足池に別荘「洗足軒」}
      # fact: kaishu-C31
      - 語り: 墓石は、海舟自身が描いた図をもとにした、簡素な五輪塔です。青山の石工が、1899年の11月に完成させました。亡くなって、およそ10か月後です。
      # fact: kaishu-C31
      - 語り: 水の輪に彫られた「海舟」の字は、長く、徳川慶喜の筆だと言われてきました。ところが、調べると、徳川家達の字だと分かった、と大田区の解説に書かれています。
        tone: 強調
      # fact: kaishu-C33
      - 語り: 墓の隣には、西郷南洲留魂詩碑があります。海舟が、1879年に、私費で建てました。
      # fact: kaishu-C33
      - 語り: 1913年に、荒川放水路の工事のため、洗足池公園へ移されています。西郷の罪が許されたのは、1889年の憲法発布の大赦でした。
      # fact: kaishu-C35, kaishu-B36
      - 語り: 慶喜が公爵になったのは、1902年の6月3日。海舟の死から、3年4か月後です。『徳川慶喜公伝』は、今は、わずかな汚名の影も留めない、と記します。
      # fact: kaishu-C38
      - 語り: 妻の民子は、1905年の5月23日に、享年85で亡くなりました。
        tone: しみじみ
      - 語り: 無血開城のあとの、海舟の30年。その答えを、記録から、まとめます。
        tone: 疑問
        hook: true
      - 語り: 海舟が、突っ張って待った日とは。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：勝海舟が、三十年突っ張って待った日　1868年から1898年
    background: {image: paintings/yoshinobu_katsu_kaishu.jpg, credit: "《勝海舟》（ウィキメディア・コモンズ、パブリックドメイン）"}
    year: 1898
    lines:
      # 答え
      # fact: kaishu-B29, kaishu-C35
      - 語り: 海舟が、三十年、突っ張っておいた、と語った場面。有栖川宮が、慶喜に会いたいと言ってきたときで、座談の日付の並びでは、1898年の2月です。海舟は、その機を失ってはいけない、と語っています。海舟は、待っていた日を、日付では言っていません。ただ、その機が実を結んだ日として、いちばん近いと言えるのは、1898年3月2日、慶喜が参内し、明治天皇に拝謁した日です。
        tone: 重い
      # fact: kaishu-B22, kaishu-B23
      - 語り: その慶喜に、海舟は、嫌われていたと語り、慶喜は、海舟の談話には誇張がある、と評しました。2人を、同じ物差しでは、測れません。
      # fact: kaishu-B08, kaishu-A28
      - 語り: 晩年の海舟は、官職を辞め続けたあと、月に200両足りない家計で、旧幕臣や貧しい人に金を渡し続けました。議官に移されてから217日のあいだ、出勤せずに、給料を受け取った時期もありました。
      # fact: kaishu-B04, kaishu-C20
      - 語り: 赤坂氷川の屋敷で、26年半あまり。語った言葉は、『氷川清話』と『海舟座談』に残り、編む人の手が入ったと、指摘されています。
      # fact: kaishu-C35
      - 語り: 参内のあとの時間は、323日でした。
        tone: しみじみ
      # 余韻：冒頭に戻る
      - 語り: 江戸城を戦わずに明け渡した勝海舟は、30年後、毎月200両足りない家計で、人に金を渡し続けながら、慶喜が表に出る日を、見届けました。
        tone: しみじみ
        pause: 0.8
        year: 1898

