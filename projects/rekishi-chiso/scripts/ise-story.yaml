sections:
  # ================================================================ 序章
  - title: 「旅の総額の3分の1あまり」　村人30人の餞別
    lines:
      # fact: ise-07
      - 語り: 江戸の庶民が、一生に一度はと夢見た、伊勢参り。その旅の総額の、3分の1あまりにあたるお金を、ある旅人は、村人からの餞別で受け取っていました。
