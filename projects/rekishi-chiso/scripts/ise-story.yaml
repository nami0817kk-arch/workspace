# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  江戸の庶民が、一生に一度はと夢見た伊勢参り。1845年、今の世田谷区の村を出た農民は、旅の総額の3分の1あまりにあたるお金を、村人30人から餞別で受け取っていました。
  その農民は、伊勢までの16日間に使ったお金を、宿場ごとに書き残しています。一方で、銭を持たずに家を出ても、伊勢まで行けた年もありました。
  江戸の庶民は、いったいいくらで伊勢まで旅をしたのか。道中日記に残る数字を、1日ずつ積み上げます。
  この動画でわかること
  ・旅のお金を、村の伊勢講と餞別でどう集めたか
  ・1日目から16日目まで、伊勢までの1日ずつの出費と、いちばん高くついた日
  ・宿代・食べ物・草鞋・川を渡る代金の内訳
  ・伊勢で待つ御師の宿のもてなしと、神楽の値段
  ・銭が無くても伊勢へ行けた、おかげ参りの施行
description_note: |-
  この動画に、想像の台詞や作った話はありません。数字は記録（田中国三郎『伊勢参宮覚』1845年を分析した谷釜尋徳の論文〔東洋法学 2009・2010・2012・2015〕、紀伊国屋長三郎『道中記』、清河八郎『西遊草』、大倉与市の道中日記〔鈴木景二、富山史壇〕、高橋陽一〔郵政博物館 研究紀要 2017〕、山本志乃〔国立歴史民俗博物館研究報告 2010〕、山本博文〔imidas〕、永嶋氏の「伊勢参宮道中記」〔横須賀市博物館研究報告 2023〕、長野市誌、松尾充晶・山田恭大〔皇學館論叢〕・中村和行・佐藤一伯〔國學院大學研究開発推進センター紀要〕・櫻井治男の論考、伊勢市史〔三重県立図書館のレファレンス回答による〕、橘敏夫・中井陽一・青木郁夫の論考、国立国会図書館、観光庁、nippon.com、静岡県立中央図書館、日本銀行金融研究所 貨幣博物館、東京都公文書館、名古屋市、島田市、静岡県、山口県文書館など）から取りました。
  1日ずつの額は、谷釜尋徳の論文の表にある区間ごとの額です。円への換算は、江戸の大工の日当（銀5匁4分、1842年からの幕府の決まりで銭およそ585文）を今の1万円とした目安で、長屋の回と同じ物差しです。換算の物差しによって、額は大きく変わります。
  旅の総額、おかげ参りの人数、抜け参りの扱いは、資料によって違います。年のあとの月日は、当時の暦のものです。太々神楽の値段は、伊勢市史を引く三重県立図書館の回答で確かめたもので、原本は確かめていません。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵は、AI による想像図です。

en:
  title: "The Ise Pilgrimage: How Much Did a Commoner Spend to Walk from Edo to Ise? A Day-by-Day Travel Diary"
  description: |-
    The Ise pilgrimage was the once-in-a-lifetime dream of Edo commoners. In 1845 a farmer left a village in today's Setagaya, Tokyo, and he received farewell gifts from 30 villagers worth more than a third of the whole trip's cost.
    He wrote down what he spent at each post town on the 16-day road to Ise. And in some years, people set out with no money at all and still reached Ise.
    How much did a commoner really spend? We add it up, day by day, from the numbers in surviving travel diaries.
    In this video you will learn:
    - How villages raised travel money through Ise confraternities and farewell gifts
    - The daily costs from day 1 to day 16, and the most expensive day
    - The breakdown of lodging, food, straw sandals and river crossings
    - The hospitality of the Ise oshi lodges, and the price of a kagura dance
    - How free alms let penniless pilgrims reach Ise in the okage-mairi years
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "Farewell Gifts Worth a Third of the Trip"
    - "Where Did the Travel Money Come From?"
    - "Day 1: Leaving Edo for Hakone"
    - "The Most Expensive Day"
    - "What Did a Night at an Inn Cost?"
    - "The Last Stretch to Ise"
    - "What Did the Oshi Lodges Charge?"
    - "Reaching Ise Without a Coin"
    - "Summary: The Cost of the Whole Journey"

