      # fact: ise-01, ise-07
      - 語り: 1845年の正月、今の世田谷区の村を出た、1人の農民です。餞別をくれた村人は、30人。
      # fact: ise-01
      - 語り: そして農民は、伊勢までの16日間に使ったお金を、宿場ごとに、書き残しています。
        card: {head: "伊勢まで16日", body: 宿場ごとの出費の書き留め}
      # fact: ise-36
      - 語り: 一方で、銭を持たずに家を出ても、伊勢まで行けた年がありました。
        tone: 疑問
      - 語り: 江戸の庶民は、いったい、いくらで、伊勢参りの旅をしたのか。
        tone: 疑問
      - 語り: 宿代、昼の弁当、草鞋、川を渡る代金。そして伊勢で待つ、もてなしの代。
      # fact: ise-01
      - 語り: 手がかりは、その農民、田中国三郎が残した、伊勢参宮覚という、道中の覚え書きです。
      - 語り: その数字を、1日ずつ、積み上げていきます。
      - 語り: ただ、旅に出る前に、まず、お金を集めなければなりません。
        hook: true
      - 語り: そのお金の集め方には、村ごとの決まりがありました。
        hook: true

  # ================================================================ 第1章 旅のお金はどこから
  - title: 「旅のお金はどこから？」　伊勢講と餞別
    lines:
      # fact: ise-24
      - 語り: 伊勢参りのお金は、多くの村で、伊勢講という集まりが用意しました。みんなで旅費を積み立て、くじ引きなどで、旅に出る人を決めます。
        card: {head: "伊勢講", body: 積み立てて、くじで代わりの人を送る}
      # fact: ise-24
      - 語り: 國學院大學の研究開発推進センターが、2022年に出した紀要の論文は、講の道中記が、仲間への会計報告の役目も果たした、とまとめています。
      - 語り: 旅費を出した仲間に、何にいくら使ったかを、見せるのです。
      # fact: ise-23
      - 語り: 信濃の、今の長野市にあった南堀村の講は、文政4年、1821年の正月に始まりました。
      # fact: ise-23
      - 語り: 村のおよそ50人が、家の豊かさに応じて、1人3文から36文。集まったのは、金1分と、銭540文でした。
        card: {head: "1821年", body: 1人3文から36文を出し合う}
      # fact: ise-23
      - 語り: その積み立てを、毎年の出し合いと、貸し付けの利息で増やし、7年後の1828年には、金22両2分あまり。
      # fact: ise-23
      - 語り: 翌年、村は、2人に金1両ずつを渡して、伊勢へ送り出しました。
        tone: 重い
      # fact: ise-24
      - 語り: 長野市誌によると、この講では、くじに当たった家は、1年のうちいつでも、家族の誰が行ってもよい、という決まりでした。
      # fact: ise-23
      - 語り: 同じ長野の押鐘村では、毎年1人を、講の29人が1人112文ずつ出し合って、送り出しています。
      # fact: ise-07
      - 語り: そして国三郎は、出がけに、村人30人から、餞別を受け取りました。合わせて、金1両2朱と、銭5貫600文。銭にして、およそ1万2,400文です。
        tone: 重い
        card: {head: "餞別 30人から", body: 約1万2400文}
      # fact: ise-07, ise-01
      - 語り: これは、国三郎が、伊勢までの片道で使う額よりも、多いお金です。それでも、旅の総額の、3分の1あまりでした。
      # fact: ise-08
      - 語り: もっと多い例もあります。安政5年、1858年に、今の横須賀市の名主の家から出た旅では、餞別が、合わせておよそ19両。横須賀市自然・人文博物館が、2023年の研究報告で取り上げています。
      # fact: ise-08
      - 語り: この旅は、駕籠をよく使い、本陣の次の格の宿、脇本陣にも泊まる、ゆとりのある旅でした。
      # fact: ise-50
      - 語り: お金のほかに、もう1つ、要るものがありました。寺や村役人が書く、往来手形です。山口県文書館には、延享4年、1747年の、伊勢参りの手形が残っています。
      # fact: ise-50
      - 語り: 文面は、宗門を改めた、紛れのない者なので、海と陸の関所を通してほしい、という頼みです。持ち歩きやすいように、小さく折った跡があります。
      # fact: ise-51
      - 語り: 旅の途中で死んだら、その土地のやり方で葬ってよい、と書いた手形もありました。国元への知らせも要らない、とまで書いたものは、捨往来と呼ばれます。
        tone: 重い
      - 語り: お金と手形を持って、国三郎は、東海道へ出ます。
        hook: true
      - 語り: 1日目、国三郎は、いくら使ったのか。
        hook: true

  # ================================================================ 第2章 1日目から箱根まで
  - title: 「1日目はいくら？」　戸塚・小田原・箱根
    lines:
      # fact: ise-01
      - 語り: 弘化2年、1845年の正月22日。国三郎は、喜多見村を出ました。
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 1, note: 16日}
      # fact: ise-01
      - 語り: 東洋大学の谷釜尋徳さんが、2010年の論文で、国三郎の区間ごとの出費を、一覧にまとめています。1日目は、戸塚まで。使ったお金は、275文です。
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 2, note: 16日}
      # fact: ise-56, ise-54
      - 語り: これを、今のお金の目安にします。江戸の大工の日当は、文政のころの記録で、銀5匁4分。
      # fact: ise-54
      - 語り: 金1両は、銀60匁。そして1842年からの幕府の決まりで、銭6,500文。これで直すと、大工の日当は、およそ585文です。
        figure: null
      - 語り: この日当を、今の1万円とします。すると1文は、およそ17円。1日目の275文は、4,700円ほどです。
        card: {head: "1日目 275文", body: 目安で約4700円}
      # fact: ise-53
      - 語り: ただ、この目安は、物差しで大きく変わります。日本銀行の貨幣博物館は、18世紀の1両を、米の値段なら約6万円、大工の賃金なら約35万円、としています。
        tone: 疑問
      # fact: ise-53
      - 語り: どちらも、18世紀の数字です。この動画の目安では、1両は、およそ11万円です。
      # fact: ise-03, ise-04
      - 語り: 同じ1日目を、江戸の豪商はどう過ごしたか。嘉永4年、1851年に、神田の商人、紀伊国屋長三郎が、供の2人と京へ向かった道中記が残っています。
      # fact: ise-04
      - 語り: 江戸を出た日の記事に、824文、保土ヶ谷、ふじ屋泊まり、3人。宿代だけで、1人およそ275文。国三郎が1日目に使った全部と、ほぼ同じ額です。
        card: {head: "保土ヶ谷の宿", body: 3人で824文}
      # fact: ise-04
      - 語り: 翌日、戸塚では、弁当4人前に、332文。1人前、83文です。
      # fact: ise-03
      - 語り: 長三郎の旅は、江戸から京まで22日で、1日平均およそ714文。国三郎の1日のおよそ1.6倍を使う、豪商の旅でした。
      # fact: ise-01
      - 語り: 国三郎の2日目は、戸塚から小田原まで、712文。3日目は、小田原から箱根まで、358文。
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 4, note: 16日}
      # fact: ise-55
      - 語り: 1日に歩く道のりは、谷釜さんが東北の人の道中日記を調べた2015年の論文で、平均およそ34.8キロ。多い日は、60キロから70キロ歩いています。
        figure: null
      # fact: ise-49
      - 語り: 箱根には、関所がありました。江戸から出る女は、幕府の役人が出す女手形がないと、通れません。大名の妻や子が、国元へ逃げるのを防ぐためです。
      # fact: ise-49
      - 語り: 関所を避けて山を越える関所破りは、磔の重い罪。ただ、歴史学者の山本博文さんは、見つけても道に迷ったとして追い返すことが多く、処刑された者はほとんどいない、と書いています。
      # fact: ise-10
      - 語り: 実際、手形のない女を連れた、旅日記があります。幕末の志士、清河八郎の西遊草です。安政2年、1855年、八郎は、母を連れて、庄内から越後、信濃を回って、伊勢へ向かいました。
      - 語り: 箱根を越えると、いちばん高くつく日が、待っていました。
        hook: true
      - 語り: その先には、深さで値段の変わる川があります。
        hook: true

  # ================================================================ 第3章 いちばん高い日
  - title: 「いちばん高い日は？」　久能山と大井川
    lines:
      # fact: ise-01
      - 語り: 4日目、箱根から吉原まで、823文。
        figure: {type: bars, title: 国三郎の1日ずつの出費（文）, bars: [[1日目, 275], [2日目, 712], [3日目, 358], [4日目, 823], [5日目, 1009], [6日目, 487], [7日目, 492]], upto: 4}
      # fact: ise-01
      - 語り: そして5日目、吉原から久能山まで、1,009文。16日の中で、いちばん多い日です。今の目安で、およそ1万7千円。
        tone: 重い
        figure: {type: bars, title: 国三郎の1日ずつの出費（文）, bars: [[1日目, 275], [2日目, 712], [3日目, 358], [4日目, 823], [5日目, 1009], [6日目, 487], [7日目, 492]], upto: 5}
      # fact: ise-01
      - 語り: この日に何がかさんだのかは、日ごとの内訳が論文に無く、分かりません。久能山には、家康を祀った東照宮があります。
      # fact: ise-01
      - 語り: 6日目は、久能山から岡部まで、487文。7日目は、岡部から掛川まで、492文。この日の額には、川越人足の代が入っています。
        figure: {type: bars, title: 国三郎の1日ずつの出費（文）, bars: [[1日目, 275], [2日目, 712], [3日目, 358], [4日目, 823], [5日目, 1009], [6日目, 487], [7日目, 492]], upto: 7}
      # fact: ise-47
      - 語り: 大井川です。ここでは旅人は、川越人足に、担いで渡してもらいました。
        figure: null
      # fact: ise-47
      - 語り: 旅人は、川会所で、その日の水の深さで値段の決まった、川札を買います。肩車にするか、板の台に乗る連台にするかを選び、要る枚数を買って、人足に渡しました。
        card: {head: "大井川", body: 川札を買って人足に担がれる}
      # fact: ise-46
      - 語り: 島田市博物館によると、いちばん浅い、股のあたりまでの深さで、川札1枚が48文。ふだんの深さは、およそ76センチ。136センチを超えると、川留め。渡ることが止められました。
        card: {head: "川札1枚", body: いちばん浅い日で48文}
      # fact: ise-47
      - 語り: 川越人足は、幕末には、島田の宿に600人、川の向こうの金谷の宿に500人ほどいた、といわれます。
      # fact: ise-10
      - 語り: 清河八郎は、手形のない母を連れていたので、旅の途中のいくつもの関所を、抜け道で越えています。
      # fact: ise-10
      - 語り: 伊勢と西国を回った帰り道には、浜名湖の北にある気賀の関所を避けて、夜の舟で湖を渡りました。
      # fact: ise-10
      - 語り: 船頭は、舟1艘で金1分などと、ふっかけてきました。八郎は掛け合って、銭1貫文、つまり1,000文に決めています。
        card: {head: "1855年", body: 浜名湖の舟を1000文に値切る}
      # fact: ise-10
      - 語り: 旅の文化研究所の山本志乃さんは、2010年に、国立歴史民俗博物館の研究報告に載せた論文で、この旅を、女の関所抜けの実態として読み解いています。
      # fact: ise-01
      - 語り: 国三郎の旅は、8日目から、1日300文台が続きます。
      - 語り: では、毎日の出費で、いちばん重かったのは、何だったのか。
        hook: true
        figure: null
      - 語り: 食べ物でも、草鞋でも、ありませんでした。
        hook: true

  # ================================================================ 第4章 宿代は1泊いくら
  - title: 「宿代は1泊いくら？」　旅籠と木賃宿
    lines:
      # fact: ise-02
      - 語り: 国三郎の16日分の出費の内訳です。谷釜さんの表で、いちばん多いのは、宿代。2,804文。全体のおよそ4割です。
        figure: {type: pie, title: 国三郎の伊勢までの出費, parts: [[宿, 40], [交通, 27], [食べ物, 23], [草鞋・お参りほか, 10]], unit: "%"}
      # fact: ise-02
      - 語り: 次が交通の代で、3割近く。食べ物が、2割あまり。草鞋は、3%にもなりません。
      # fact: ise-02
      - 語り: 1日あたりにすると、宿代はおよそ175文、食べ物はおよそ103文でした。
        figure: null
      # fact: ise-09
      - 語り: 宿には、2つの種類がありました。食事のつく旅籠と、薪代だけを払って、食べ物は自分で用意する木賃宿です。
      # fact: ise-09
      - 語り: 天保11年、1840年に、越後の村から伊勢へ向かった大倉与市の小遣い帳では、旅籠が1泊140文から185文。木賃宿は、35文から65文です。
        card: {head: "1840年", body: 旅籠140〜185文、木賃宿35〜65文}
      # fact: ise-09
      - 語り: 鈴木景二さんが、2022年に、富山の歴史の雑誌、富山史壇で、この帳面を紹介しています。旅の感想はほとんど無く、行き先と出費だけを、淡々と書いた帳面です。
      # fact: ise-52
      - 語り: 安くなる泊まり方も、ありました。浪花講という講が決めた、定宿に泊まることです。
      # fact: ise-52
      - 語り: 高橋陽一さんが、2017年に郵政博物館の研究紀要に書いた論文によると、安政3年、1856年に東北から伊勢へ向かった道中記では、浪花講の定宿が1泊およそ170文。それ以外の宿は、およそ198文でした。
        card: {head: "1856年", body: 講の定宿170文、ほかの宿198文}
      # fact: ise-05
      - 語り: 草鞋の値段は、幕末に大きく上がりました。谷釜さんが、関東の人の伊勢参りの日記11冊を比べた2009年の論文では、草鞋1足が、1803年に12文。
        figure: {type: bars, title: 草鞋1足の値段（文）, bars: [[1803年, 12], [1845年, 15], [1853年, 32], [1863年, 72]], upto: 2}
      # fact: ise-05
      - 語り: 国三郎の1845年は15文。それが1853年に32文、1863年には72文。60年で、6倍です。
        figure: {type: bars, title: 草鞋1足の値段（文）, bars: [[1803年, 12], [1845年, 15], [1853年, 32], [1863年, 72]], upto: 4}
      # fact: ise-05
      - 語り: 国三郎のころの草鞋の値は、酒や餅と同じくらい。そばの半分ほどでした。
        figure: null
      # fact: ise-06
      - 語り: では、旅の1日に、いくら見ておけばよかったのか。谷釜さんは、今野信雄さんの、江戸の旅という本を引いて、江戸からの伊勢参りは、ふつう2か月ほど。1日400文として、4両が要った、とまとめています。
      # fact: ise-01
      - 語り: 国三郎の伊勢までの1日平均は、およそ440文。その見積もりに近い数字です。
        card: {head: "1日平均", body: 約440文}
      - 語り: 箱根も、大井川も、越えました。残るは、尾張から伊勢への道です。
        hook: true
      - 語り: 伊勢の手前の、最後の1日。国三郎の出費は、意外な額でした。
        hook: true

  # ================================================================ 第5章 伊勢までの最後の道
  - title: 「伊勢まであと何日？」　尾張から伊勢路へ
    lines:
      # fact: ise-12
      - 語り: 東海道の本道には、宮の宿から桑名の宿へ、海を渡る七里の渡しがありました。海の上を七里、およそ27.5キロ。順調でも、4時間から6時間の船旅です。
      # fact: ise-12
      - 語り: 名古屋市熱田区によると、船賃は、正徳元年、1711年の記録で、旅人1人45文と決められていました。
        card: {head: "七里の渡し", body: 旅人1人45文（1711年）}
      # fact: ise-01
      - 語り: ただ、国三郎の書き留めでは、12日目に池鯉鮒、13日目には、宮より北の甚目寺に泊まり、14日目は冨田。この3日は、300文台と400文台です。
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 8, note: 16日}
      # fact: ise-45
      - 語り: 四日市の日永の追分という分かれ道で、東海道と分かれて、伊勢へ向かう道に入ります。白子、津、松阪を通る、伊勢街道です。
      # fact: ise-01
      - 語り: 15日目は、津まで、330文。
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 9, note: 16日}
      # fact: ise-01
      - 語り: そして16日目、津から伊勢まで、169文。16日の中で、いちばん少ない日です。いちばん多かった5日目の、6分の1ほど。目安にして、2,900円ほどです。
        tone: しみじみ
        figure: {type: map, title: 国三郎の伊勢への道, bounds: [136.3, 139.95, 34.3, 35.8], places: [[喜多見村, 139.59, 35.63], [戸塚, 139.53, 35.40], [小田原, 139.16, 35.26], [箱根, 139.03, 35.19], [吉原, 138.70, 35.16], [久能山, 138.47, 34.97], [掛川, 138.01, 34.77], [池鯉鮒, 137.05, 35.00], [津, 136.51, 34.72], [伊勢, 136.72, 34.49]], route: [喜多見村, 戸塚, 小田原, 箱根, 吉原, 久能山, 掛川, 池鯉鮒, 津, 伊勢], upto: 10, note: 16日}
      # fact: ise-01
      - 語り: 16日を合わせて、7,048文。大工の日当にして、12日分。今の目安で、およそ12万円です。
        tone: 重い
        figure: {type: calc, title: 伊勢までの16日, terms: [[7048文, 16日の合計], [585文, 大工の日当], [約12日分, 約12万円]], ops: [÷, ＝]}
      # fact: ise-13
      - 語り: 谷釜さんの2012年の論文では、1768年に、今の埼玉県鶴ヶ島市の村を出た14人は、13日目に伊勢へ着いています。国三郎の16日は、それより3日長い旅でした。
        figure: null
      - 語り: 伊勢の宮川に着くと、川の向こうで、迎えの者が待っていました。
        hook: true
      - 語り: 伊勢では、宿代とは別の、支払いが待っています。
        hook: true

  # ================================================================ 第6章 御師
  - title: 「御師の宿でいくら払った？」　伊勢のもてなし
    lines:
      # fact: ise-26
      - 語り: 伊勢の手前の宮川。その川辺まで、使いの者、手代を迎えに出していたのが、御師です。
      # fact: ise-17
      - 語り: 御師は、伊勢の神宮の神職で、全国の村々の家を、檀那、つまりお得意先として受け持ちました。参詣者を自分の家に泊め、もてなし、神楽をあげます。
        card: {head: "御師", body: 参詣者を泊めて神楽をあげた神職}
      # fact: ise-15
      - 語り: 島根県立古代出雲歴史博物館の松尾充晶さんは、2025年のコラムで、明治4年に御師が廃止される直前、719家もの御師がいた、と書いています。
      # fact: ise-17
      - 語り: 松尾さんによると、御師の稼ぎは、2本立てでした。1つは、伊勢の家に泊めて神楽をあげる、宿と神楽の代。もう1つは、毎年、檀那の村へお札を配って受け取る、お札の代の初穂料です。
      # fact: ise-19
      - 語り: 村々を回ってお札を配ったのは、御師本人ではありません。出雲の村々を回った例では、御師の代わりの手代が2人か3人と、下働きが1人でした。
      # fact: ise-17
      - 語り: 受け持ちの檀那は、権利として、売り買いされました。
      # fact: ise-18
      - 語り: 外宮の御師、丸岡家の帳面が残っています。皇學館大学の紀要、皇學館論叢に、2013年に載った研究によると、明治12年の調べに残る、幕末にお札を配った先は、8,768戸。お札は、1万4,954体です。
        card: {head: "丸岡家のお札", body: 8768戸に1万4954体}
      # fact: ise-18
      - 語り: 受け取った額は、明治のお金で、お札の初穂料が448円あまり。泊める代は、234円あまり。お札の初穂料は、泊める代の、およそ2倍でした。
        figure: {type: bars, title: 御師 丸岡家の受け取った額（明治のお金）, bars: [[お札の初穂料, 448], [泊める代, 234]], labels: [448円あまり, 234円あまり]}
      # fact: ise-27
      - 語り: 泊まった旅人は、どうもてなされたのか。1858年の横須賀の名主の家の道中記では、御師の家に逗留して、種々の珍味を、1日じゅうごちそうになっています。
        figure: null
      # fact: ise-27
      - 語り: 旅立つ日には、御師の手代とみられる2人に、紀州の領の新茶屋まで、送られました。
      # fact: ise-09
      - 語り: 越後の大倉与市は、1840年8月13日に、600文、伊勢御師へ、と書き、その夜は、御師の家に泊まりました。600文は、大工の日当の1日分ほどです。
        card: {head: "伊勢御師へ", body: 600文（1840年）}
      # fact: ise-20
      - 語り: 神楽の代には、決まった値段がありませんでした。伊勢市史によると、旅人は、着いて一段落してから、御師の手代と額を掛け合い、神楽の代を値切る旅人もいました。
      # fact: ise-21
      - 語り: いちばん大きな太々神楽では、ある講が、講の中から75両を集め、ほかの人の分も合わせて、104両を納めた例があります。
        tone: 重い
      # fact: ise-21
      - 語り: この動画の目安で、1両はおよそ11万円。104両は、1,100万円を超えます。
        card: {head: "太々神楽", body: 講で104両を納めた例}
      # fact: ise-11
      - 語り: 伊勢には、もう1つ、お金のかかる所がありました。古市です。1855年、清河八郎は、母と供の3人で、古市の油屋で伊勢音頭を見て、その代を、1両と書いています。
      # fact: ise-11
      - 語り: 山本さんは、見物の代が、1組で1両という決まりだった、と読んでいます。1両を6,500文とすると、国三郎が伊勢まで16日間に使った、7,048文に迫る額です。
      # fact: ise-28
      - 語り: その御師は、明治4年、1871年の7月12日の太政官の達しで、お札を配ることを止められ、姿を消していきます。
      - 語り: ところが、御師にも宿にも、ほとんど払わずに、伊勢へ向かった人々がいました。
        hook: true
      - 語り: それも、何百万人もです。
        hook: true

  # ================================================================ 第7章 おかげ参り
  - title: 「銭なしでも行けた？」　おかげ参りと施行
    lines:
      # fact: ise-29
      - 語り: 江戸時代に、何度か、伊勢へ人々が一度に押し寄せた年がありました。おかげ参りです。大きなものは、1650年、1705年、1771年、1830年の4回。およそ60年おきです。
      # fact: ise-31
      - 語り: 1830年、文政13年のおかげ参りは、子どもから始まった、と記録されています。1832年に刊行された、御蔭参宮文政神異記によると、3月20日、阿波の徳島の手習いの子ども、20人か30人が、そろって伊勢へ向かいました。
      # fact: ise-30
      - 語り: このときの人数は、資料で違います。国立国会図書館の解説は、およそ430万人。観光庁の解説は、400万人から500万人。nippon.com の記事は、およそ500万人。
        tone: 疑問
      # fact: ise-30
      - 語り: 当時の日本の人口は、およそ3,200万人。500万人なら、6人か7人に1人です。
      # fact: ise-33
      - 語り: 幕府の大津代官の手代の書き付けでは、大津の宿を通る人は、1日に、およそ7万人。路銀も持たず、着の身着のままの人が多く、空き家や芝居小屋に入れた、とあります。
        card: {head: "1830年の大津", body: 1日におよそ7万人}
      # fact: ise-32
      - 語り: 大阪編年史に引かれた記録、反古籠には、播磨では、親や主人に断らずに出る抜け参りが大はやりで、残らず柄杓を持ち、施しを受けた、と書かれています。
      # fact: ise-36
      - 語り: 銭が無くても行けたのは、施行があったからです。三河の牛川村の暦の書き込みには、銭なしでも参り、所々に施行がある、とあり、食べ物、馬、駕籠、草履、草鞋が並びます。
        card: {head: "施行", body: 食べ物・馬・駕籠・草鞋をただで}
      # fact: ise-34
      - 語り: 岡崎の町々は、接待の駕籠を出し、餅や粥、ところてんをふるまいました。
      # fact: ise-37
      - 語り: 大和の御所町の施行の宿には、181日の間に、9,729人が泊まりました。関西大学の中井陽一さんが、2007年の論文で、宿の名簿を数えています。
      # fact: ise-37
      - 語り: 寄せられたものは、米22石あまりに、草鞋730足。施行の宿は、毎朝の出がけに、1人に銭を1枚か2枚、持たせています。
        card: {head: "御所町の施行", body: 9729人が泊まり、草鞋730足}
      # fact: ise-39
      - 語り: 遠江の見付村は、1830年8月21日、旅人1人に12文ずつを配りました。1日だけで、1,400人から1,500人。1万6,800文から、1万8,000文です。
      # fact: ise-39
      - 語り: 国三郎が伊勢まで16日で使った額の、2倍を超えるお金が、1日で施されたことになります。
        tone: 重い
      # fact: ise-39
      - 語り: 静岡県立中央図書館の解説は、おかげ参りの年には、子が親に、妻が夫に、奉公人が主人に断らず、路銀も持たずに出かけることもできた、と述べています。
      # fact: ise-40
      - 語り: ただ、咎めが無かったとは、言い切れません。愛知大学の橘敏夫さんが2020年に紹介した、三河の吉田藩の1830年4月11日の触書があります。
        tone: 疑問
      # fact: ise-40
      - 語り: 奉公人が、主人の差し支えも顧みずに参るのは、かえって神のお心に叶わない。藩は、参宮には役所への届けを求め、7月6日には、街道での食べ物や駕籠や馬の施行も、差し止めました。
      - 語り: では、国三郎の旅は、全部で、いくらかかったのか。
        hook: true
      - 語り: 伊勢に着いても、旅は、終わっていませんでした。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：伊勢参りの旅は全部でいくらだったか
    lines:
      # fact: ise-01
      - 語り: 国三郎が伊勢まで16日間に使ったのは、7,048文。大工の日当の12日分、目安にして、およそ12万円でした。
        figure: {type: bars, title: 国三郎の旅の出費（文）, bars: [[伊勢まで16日, 7048], [同じ道を帰ったら, 14096], [旅の全部 86日, 33608]], labels: [7048文, 1万4096文, 3万3608文], upto: 1}
      - 語り: もし、同じ道をまっすぐ帰ったら、往復で、1万4,096文。日当の24日分、およそ24万円です。
        figure: {type: bars, title: 国三郎の旅の出費（文）, bars: [[伊勢まで16日, 7048], [同じ道を帰ったら, 14096], [旅の全部 86日, 33608]], labels: [7048文, 1万4096文, 3万3608文], upto: 2}
      # fact: ise-01
      - 語り: けれど国三郎の旅は、伊勢で終わりませんでした。谷釜さんの2015年の論文では、旅の全部は86日。毎日の出費の合計は、5両と1貫108文。銭にして、3万3,608文です。
        figure: {type: bars, title: 国三郎の旅の出費（文）, bars: [[伊勢まで16日, 7048], [同じ道を帰ったら, 14096], [旅の全部 86日, 33608]], labels: [7048文, 1万4096文, 3万3608文], upto: 3}
      # fact: ise-01
      - 語り: 往復の見積もりの、2倍を超えます。日当の57日分。今の目安で、およそ57万円。1日平均は、391文でした。
        tone: 重い
      # fact: ise-01
      - 語り: ただ、同じ谷釜さんの2010年の論文は、同じ旅の総額を、5両と5貫771文、銭にして3万5,771文としています。銭の端数も、1両を何文で数えるかも、違います。
        tone: 疑問
        figure: null
      # fact: ise-07
      - 語り: その旅の総額の、3分の1あまりにあたる、およそ1万2,400文を、国三郎は、村人30人から、餞別で受け取っていました。
        card: {head: "餞別", body: 旅の総額の3分の1あまり}
      - 語り: 宿代が4割。草鞋は3%にもならない。いちばん高い日は、1万7千円ほど。いちばん安い日は、3千円足らず。
      - 語り: そして伊勢では、神楽に1,000万円を超えて納める講もあれば、銭を持たずに、施しだけで歩き通した人々もいました。
      - 語り: 一生に一度の伊勢参りは、1人の貯えでは、なかなか届かない旅でした。だから村は、お金を出し合い、餞別を持たせ、道の人々は、見知らぬ旅人に、草鞋と飯を差し出したのです。
        tone: しみじみ
      # fact: ise-24, ise-07
      - 語り: 講の道中記は、旅費を出した仲間への、会計報告でもありました。30人の餞別を受け取った国三郎が、宿場ごとに書き留めた数字は、村のみんなに見せる、旅の答えだったのかもしれません。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
