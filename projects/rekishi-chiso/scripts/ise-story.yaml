# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と nagaya-if-story.yaml・rouyashiki-story.yaml の型）。伊勢参りの旅費。2026-11-21 下書き。
# 公開の予定は 11/27 12:00（12時枠）。型は docs/story-main.md「00. 伸びる型」の E 暮らし型＋数字を積み上げる型。主語は「江戸の庶民の伊勢参り」という1つの旅で、最後まで主役。
#   誰でも持つ像＝一生に一度の伊勢参り（お金を貯めて行く夢の旅）。裏返す一点＝旅の総額の3分の1あまりにあたるお金を、旅人は村人30人から餞別で受け取っていた。銭を持たずに行けた年もあった。
#   餞別を旅の出費に充てたとは論文に書いていないので「受け取った」とだけ言う（11-21 事実照合）。国三郎が講の代参・くじで選ばれたとも書いていないので言わない。
#   問い＝「江戸の庶民は、いくらで伊勢まで旅をしたのか」。答え＝片道16日で7,048文（日当の12日分、目安で約12万円）。旅の全体は86日で5両あまり（約57万円）。その3分の1あまりにあたる額を、村の餞別で受け取っていた。
#   背骨の記録は、田中国三郎『伊勢参宮覚』（弘化2年＝1845年、多摩郡喜多見村。谷釜尋徳 2010・2015 の分析、東洋法学）。区間ごとの額は谷釜 2010 の表3。
#   想像の台詞なし。語りは剣崎1人。人物の作った話なし。
# 既出と重ねない：posted.json・scripts/ に伊勢参り・御師・おかげ参りの回は無い（11-21 grep）。
#   換算は長屋の回（nagaya-if-story）と同じ物差し：文政のころの大工の日当 銀5匁4分＝1842年からの公定（1両＝銀60匁＝銭6,500文）で約585文＝今の1万円。1両は約11万円（長屋の回と同じ）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/伊勢参りの旅費_facts_20261121.yaml、ise-01〜56。担当A=道中の出費・B=伊勢講と御師・C=おかげ参りと施行・D=道のりと換算・E=換算の物差し）にあるものだけ。行の上に `# fact: ise-01`。
# 記録の食い違い（並べたもの3つ）：①国三郎の旅の総額（谷釜 2010：5両と5貫771文＝35,771文／谷釜 2015：5両1貫108文＝33,608文）
#   ②1830年のおかげ参りの人数（国立国会図書館 約430万人／観光庁 400万〜500万人・nippon.com 約500万人）③抜け参りは咎められなかったか（静岡県立中央図書館の解説／吉田藩の触書 1830年4月11日）。
#   並べなかった食い違い：1日の旅費の目安（400文・300文）、御師の数（719家・約700軒・800軒）、伊勢街道の長さ（18里・13.9里）、三村大夫の檀那の数、東海道の長さ（495.5km・492km）。
# 自分で計算した数（全部計算し直した）：
#   16区間 275+712+358+823+1009+487+492+300+374+309+348+327+304+431+330+169＝7,048（論文の総額と合う）。7,048÷16＝440.5→約440文。最多1,009（5日目 吉原〜久能山）・最少169（16日目 津〜伊勢）。1,009÷169＝5.97→約6倍。
#   内訳 2,804+1,911+1,655+327+195+156＝7,048。宿 2,804÷7,048＝39.8%→約4割。交通 27.1%。食 23.5%。草鞋 195÷7,048＝2.8%。宿 2,804÷16＝175.25文。
#   物差し 5.4匁×6,500÷60＝585文＝1万円 → 1文＝17.09円。275文＝4,701円→約4,700円。712文＝12,171円→約1万2千円。1,009文＝17,248円→約1万7千円。169文＝2,889円→約2,900円。
#   7,048文÷585＝12.05→日当の12日分。7,048×17.09＝120,479円→約12万円。往復を同じ道とすると 7,048×2＝14,096文＝日当24.1日分→約24万円。
#   全体 33,608文（2015）÷585＝57.4日分→約57万円（33,608×17.09＝574,496）。35,771文（2010）＝611,470円→約61万円。33,608÷86＝390.8→391文。14,096との比 33,608÷14,096＝2.38→2倍を超える。
#   2010 の総額 5両×6,000＋5,771＝35,771。2015 の総額 5両×6,500＋1,108＝33,608。
#   餞別 12,400÷35,771＝34.7%・12,400÷33,608＝36.9%→どちらでも「3分の1あまり」。12,400÷585＝21.2→日当の21日分。
#   保土ヶ谷 824÷3＝274.7→約275文。弁当 332÷4＝83文。紀伊国屋の1日714÷440＝1.6倍。草鞋 72÷12＝6倍（1803年→1863年）。
#   南堀村 1821年→1828年＝7年。御師への600文÷585＝1.03→日当の1日分ほど。
#   1両＝6,500文＝約11万円（6,500×17.09＝111,111）。古市の伊勢音頭 1両≒6,500文→国三郎の片道7,048文の92%（「片道の旅費に迫る」）。講の太々神楽 104両×111,111＝1,155.6万円→「1,100万円を超える」。
#   丸岡家 初穂448円÷止宿234円＝1.91→約2倍。おかげ参り 3,200万÷500万＝6.4→「6人か7人に1人」。見付村 12文×1,400＝16,800・12文×1,500＝18,000。
#   御所町 閏3月4日〜9月8日＝181日（論文の数）。
#   和暦：弘化2年＝1845年、嘉永4年＝1851年、安政5年＝1858年、天保11年＝1840年、安政2年＝1855年、正徳元年＝1711年、文政4年＝1821年、文政11年＝1828年、文政12年＝1829年、
#   嘉永2年＝1849年、宝永2年＝1705年、明和8年＝1771年、文政13年＝1830年、慶安3年＝1650年、延享4年＝1747年、明治4年＝1871年、明治12年＝1879年、安政3年＝1856年、文久2年＝1862年、慶応3年＝1867年。
# 確かめられなかったこと（台本では言わない）：国三郎の旅の行き先の全部（86日のうち伊勢のあとどこを回ったか）、掛川〜池鯉鮒の泊まり（一ノ瀬・石打・かとや・佐助）がどの道か、
#   国三郎が通った道（甚目寺に泊まり、七里の渡しは使っていないとみられる。谷釜 2012 の別の一行は佐屋路）、5日目が高い理由、1830年の「457万人」、宮川の渡しが無料か、古市の揚代、六郷・天竜川・今切の渡し賃、関所手形の値段、木賃宿の公定、犬の伊勢参りの原文、丸岡宗大夫の名の読み。
# 絵：AI 絵（Gemini。一覧は scripts/story/ise_main_look.yaml の頭）だけ。実在の人物の顔は描かない。字・紋・のぼりの字は描かない。
