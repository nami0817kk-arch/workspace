sections:
  # ================================================================ 序章
  - title: 「日本の3分の1近く」　1日の戦いのあとで
    lines:
      # fact: sekimap-107, sekimap-05
      - 語り: 関ヶ原の戦いは、1日で決着がつきました。けれど、そのあと持ち主が替わった領地は、日本全体の石高の、3分の1近くにのぼります。
        tone: 重い
        card: {head: "日本の3分の1近く", body: 戦いのあとで持ち主が替わる}
      # fact: sekimap-107
      - 語り: 取りつぶされた大名は、88人。領地を削られた大名が、5人。取り上げた石高は、合わせて、632万石あまりです。
      # fact: sekimap-21
      - 語り: そして、その大部分を受け取ったのは、徳川の家臣では、ありませんでした。
        tone: 重い
      # fact: sekimap-21
      - 語り: 空いた領地の大部分は、もとは豊臣の家臣だった大名たちに、配られたのです。
      - 語り: 勝った家康は、なぜ、豊臣の大名たちに、これほどの領地を配ったのか。
        tone: 疑問
      - 語り: その答えは、配った先の地図に、表れています。
      # fact: sekimap-94
      - 語り: 東海道に城を持っていた豊臣の大名たちは、戦いのあと、ある決まりで、動かされました。
      - 語り: 関ヶ原の前と後で、石高の数字がどう動いたのか。1つずつ、積み上げていきます。
      - 語り: ところが、取り上げた数そのものが、本によって違います。
        hook: true
      - 語り: しかも、処分が全部決まるまでには、3年あまりかかりました。
        hook: true

  # ================================================================ 第1章 何万石を取り上げた？
  - title: 「何万石を取り上げた？」　1600年の改易と減封
    lines:
      # fact: sekimap-16
      - 語り: 慶長5年、1600年の9月15日、関ヶ原で西軍は崩れました。家康は、9月27日に大坂城に入り、戦いのあとの処分を始めます。
      # fact: sekimap-107, sekimap-81
      - 語り: 歴史学者の藤野保さんが、世界大百科事典に書いた数では、取りつぶしが88名、領地を削られたのが5名。合わせて93名から、632万4194石を取り上げました。
        figure: {type: calc, title: 取り上げた石高（藤野保の数）, terms: [[416万石, 取りつぶし 88名], [216万石, 削った 5名], [632万石, 合わせて 93名]], ops: [＋, ＝]}
      # fact: sekimap-02, sekimap-21, sekimap-81
      - 語り: ところが、同じ事典の別の項を書いた高木昭作さんは、取りつぶしを90人、削られたのを4人とし、ブリタニカ国際大百科事典は、取りつぶしを91家としています。
        tone: 疑問
        figure: null
      # fact: sekimap-21, sekimap-81
      - 語り: 数え方によって、家の数も、石高も、少しずつずれるのです。
      # fact: sekimap-21, sekimap-05
      - 語り: 高木さんの数では、空いた土地は660万石。当時の日本全体は、2000万石に少し足りない、と書かれています。
      - 語り: どちらの数でも、日本全体の石高の、3割を超える土地が、持ち主を替えたことになります。
        tone: 重い
        card: {head: "3割を超える土地", body: 持ち主が替わる}
      # fact: sekimap-06
      - 語り: 熊本大学に2011年に出された、林さんという研究者の博士論文は、西軍の大名の領地を、1つずつ足しています。
      # fact: sekimap-06
      - 語り: 戦いの前の、西軍の領地は、およそ966万石。そのうち、取り上げられたのは、およそ620万石。西軍の領地の、およそ64%です。
        figure: {type: pie, title: 西軍の大名の領地（林千寿の集計）, parts: [[取り上げられた, 64], [残された, 36]], unit: "%"}
      # fact: sekimap-07
      - 語り: ただ、地方で比べると、大きな差があります。北陸では、西軍の領地が、全部取り上げられました。ところが九州では、71%が、そのまま残されています。
        figure: null
      # fact: sekimap-08
      - 語り: いちばん多く取り上げられたのは、中国と四国。190万4000石です。
      # fact: sekimap-12
      - 語り: 九州の取り上げは、家康が決めるより先に、現地で済んでいた所があります。肥後の小西行長の領地は、加藤清正が自分の兵で押さえ、そのまま加藤の領地になりました。
      # fact: sekimap-19
      - 語り: 豊前の毛利吉成の領地は、10月の中ごろには、黒田如水が押さえていました。それを細川忠興に回すと家康が決めたのは、10月の末から11月の初めです。
      # fact: sekimap-16
      - 語り: 高木さんは、家康が、翌年の2月ごろまでに、大名の大移動をやってのけた、と書いています。
      # fact: sekimap-16
      - 語り: けれど、上杉の処分は翌1601年。佐竹と島津は、1602年です。
      # fact: sekimap-17
      - 語り: そして、戦いで死んだ島津豊久の、日向の佐土原の領地の処分が決まったのは、1603年の10月でした。関ヶ原から、3年あまりあとです。
        card: {head: "1603年10月", body: 最後の処分が決まる}
      - 語り: では、取り上げた土地は、誰の手に渡ったのか。
        hook: true
      - 語り: いちばん多く増えたのは、豊臣の大名では、ありませんでした。
        hook: true

  # ================================================================ 第2章 いちばん増えたのは誰？
  - title: 「いちばん増えたのは誰？」　加増の順位
    lines:
      # fact: sekimap-40, sekimap-49
      - 語り: 日本大百科全書などの数で、前と後を比べます。いちばん大きく増えたのは、家康の次男、結城秀康。下総の結城、10万1000石から、越前の68万石へ。増えた分は、57万石あまりです。
        figure: {type: bars, title: 関ヶ原のあとに増えた石高（万石）, bars: [[結城秀康, 57.9], [蒲生秀行, 48], [松平忠吉, 42], [黒田長政, 40.3], [池田輝政, 36.8], [加藤清正, 34.5]], labels: [約58万, 48万, 42万, 約40万, 約37万, 約35万], upto: 1}
      # fact: sekimap-42, sekimap-49
      - 語り: 2番目は、家康の娘の夫、蒲生秀行。下野の宇都宮、12万石から、会津の60万石へ。48万石の増加です。
        figure: {type: bars, title: 関ヶ原のあとに増えた石高（万石）, bars: [[結城秀康, 57.9], [蒲生秀行, 48], [松平忠吉, 42], [黒田長政, 40.3], [池田輝政, 36.8], [加藤清正, 34.5]], labels: [約58万, 48万, 42万, 約40万, 約37万, 約35万], upto: 2}
      # fact: sekimap-41, sekimap-49
      - 語り: 3番目は、家康の四男、松平忠吉。武蔵の忍、10万石から、尾張の清洲、52万石へ。
        figure: {type: bars, title: 関ヶ原のあとに増えた石高（万石）, bars: [[結城秀康, 57.9], [蒲生秀行, 48], [松平忠吉, 42], [黒田長政, 40.3], [池田輝政, 36.8], [加藤清正, 34.5]], labels: [約58万, 48万, 42万, 約40万, 約37万, 約35万], upto: 3}
      # fact: sekimap-49
      - 語り: 上の3人は、家康の息子2人と、娘の夫の蒲生秀行です。3家だけで、増えた分は、150万石近くになります。
        tone: 重い
      # fact: sekimap-25, sekimap-26, sekimap-27
      - 語り: その次から、豊臣に仕えてきた大名が並びます。黒田長政は、40万石あまり。池田輝政が、およそ37万石。加藤清正が、およそ35万石の増加です。
        figure: {type: bars, title: 関ヶ原のあとに増えた石高（万石）, bars: [[結城秀康, 57.9], [蒲生秀行, 48], [松平忠吉, 42], [黒田長政, 40.3], [池田輝政, 36.8], [加藤清正, 34.5]], labels: [約58万, 48万, 42万, 約40万, 約37万, 約35万], upto: 6}
      - 語り: 関ヶ原で東軍として戦った大名の多くは、福島正則や黒田長政のように、豊臣に仕えてきた大名でした。
        figure: null
      # fact: sekimap-25
      - 語り: 黒田長政の、前の石高は、旺文社の日本史事典で、豊前の中津12万石。筑前では、52万石あまりになりました。4倍を超えます。
      # fact: sekimap-26
      - 語り: 池田輝政は、三河の吉田15万2000石から、播磨の52万石へ。姫路の城を築きます。一族の領地を合わせると92万石に達し、西国の将軍と呼ばれました。
        card: {head: "池田家 一族で92万石", body: 西国の将軍と呼ばれる}
      # fact: sekimap-09
      - 語り: 一人ひとりの増え方では、家康の息子と娘の夫が、上に並びます。けれど、全部を合わせると、話が変わります。
      # fact: sekimap-09
      - 語り: 歴史学者の笠谷和比古さんは、取り上げた土地の、8割を超える分が、豊臣の大名たちへのほうびに回った、とみています。
        tone: 重い
        card: {head: "取り上げた土地の8割超", body: 豊臣の大名へのほうびに}
      # fact: sekimap-38
      - 語り: 加賀の前田家も、このとき大きくなりました。前田利長は82万石あまりから、加賀の南半分と、弟の利政から取り上げた能登を加えられます。
      # fact: sekimap-38
      - 語り: 1634年の朱印状で、119万2760石。のちに加賀百万石と呼ばれる形は、関ヶ原のあとにできたのです。
      # fact: sekimap-36
      - 語り: 城を明け渡したのに、増えた大名もいます。東軍についた、近江の大津6万石の京極高次は、西軍に城を攻められて降参し、高野山に入りました。
      # fact: sekimap-36
      - 語り: それでも、戦いのあと、若狭の小浜で8万5000石。翌年には、9万2000石に増えています。
      # fact: sekimap-48
      - 語り: 一方、家康の古い家臣は、意外なほど増えていません。世界大百科事典では、本多忠勝は、上総の大多喜10万石から、伊勢の桑名10万石へ。移っただけです。
      # fact: sekimap-47
      - 語り: 井伊直政は、12万石から、近江の佐和山18万石へ。
      # fact: sekimap-105
      - 語り: 江戸時代を通じても、譜代の大名でいちばん大きな井伊家が35万石。大部分は、5万石以下でした。
      # fact: sekimap-44
      - 語り: 約束どおりには、増えなかった大名もいます。伊達政宗です。仙台市博物館には、関ヶ原の直前に、家康が政宗に与えた覚書が残っています。
      # fact: sekimap-44
      - 語り: 上杉の領地になっていた、もとの伊達の土地を返す、という約束でした。全部が叶えば、合わせて100万石を超えるので、百万石のお墨付き、と呼ばれます。
        card: {head: "百万石のお墨付き", body: 家康の覚書（仙台市博物館）}
      # fact: sekimap-44, sekimap-45
      - 語り: けれど、実際に増えたのは、政宗が自分の兵で攻め取った、刈田郡だけ。伊達の石高は60万石。のちに近江と常陸の2万石が加わって、62万石でした。
        tone: 重い
      - 語り: 豊臣の大名たちに、大きな領地が配られました。ただ、その場所には、ある決まりがありました。
        hook: true
      - 語り: 東海道に城を持っていた7つの家は、1つも、そこに残れなかったのです。
        hook: true

  # ================================================================ 第3章 東海道の城はどうなった？
  - title: 「東海道の城はどうなった？」　7つの家は西へ
    lines:
      # fact: sekimap-82, sekimap-83, sekimap-84
      - 語り: 時を、天正18年、1590年に戻します。家康が、関東へ移されたあとの東海道です。駿府には中村一氏、掛川には山内一豊、浜松には堀尾吉晴。
        figure: {type: map, title: 関ヶ原の前の東海道の城（豊臣の大名）, reveal: true, bounds: [136.4, 138.9, 34.35, 35.55], places: [[駿府, 138.38, 34.98], [掛川, 138.01, 34.77], [浜松, 137.73, 34.71], [吉田, 137.39, 34.77], [岡崎, 137.16, 34.96], [横須賀, 137.99, 34.69], [清洲, 136.84, 35.22]], note: 7つの家}
      # fact: sekimap-86, sekimap-87
      - 語り: 三河の吉田には池田輝政。そして家康が生まれた岡崎には、田中吉政が入りました。
        figure: {type: map, title: 関ヶ原の前の東海道の城（豊臣の大名）, reveal: true, bounds: [136.4, 138.9, 34.35, 35.55], places: [[駿府, 138.38, 34.98], [掛川, 138.01, 34.77], [浜松, 137.73, 34.71], [吉田, 137.39, 34.77], [岡崎, 137.16, 34.96], [横須賀, 137.99, 34.69], [清洲, 136.84, 35.22]], note: 7つの家}
      # fact: sekimap-85, sekimap-88
      - 語り: 横須賀と清洲は、少しあとに城主が替わり、関ヶ原のころは、横須賀に有馬豊氏、清洲に福島正則がいました。正則が清洲に入ったのは、1595年です。
        figure: {type: map, title: 関ヶ原の前の東海道の城（豊臣の大名）, reveal: true, bounds: [136.4, 138.9, 34.35, 35.55], places: [[駿府, 138.38, 34.98], [掛川, 138.01, 34.77], [浜松, 137.73, 34.71], [吉田, 137.39, 34.77], [岡崎, 137.16, 34.96], [横須賀, 137.99, 34.69], [清洲, 136.84, 35.22]], note: 7つの家}
      - 語り: 江戸から京へ向かう道の城を、豊臣の大名たちが、ずらりと握っていたのです。
        figure: null
      # fact: sekimap-94
      - 語り: 関ヶ原のあと、この7つの家の行き先です。駿府の中村家は、子の忠一が、伯耆の米子へ。浜松の堀尾家は、出雲と隠岐へ。
        figure: {type: map, title: 関ヶ原のあとの7つの家の行き先, reveal: true, bounds: [130.0, 139.0, 32.8, 35.9], places: [[米子, 133.33, 35.43], [出雲, 133.19, 35.36], [土佐, 133.53, 33.56], [福知山, 135.13, 35.30], [姫路, 134.69, 34.83], [筑後, 130.41, 33.16], [広島, 132.46, 34.40]], note: 7つとも西へ}
      # fact: sekimap-94, sekimap-31
      - 語り: 掛川の山内一豊は、土佐へ。5万石から、20万2600石。およそ4倍です。横須賀の有馬豊氏は、丹波の福知山へ。
        figure: {type: map, title: 関ヶ原のあとの7つの家の行き先, reveal: true, bounds: [130.0, 139.0, 32.8, 35.9], places: [[米子, 133.33, 35.43], [出雲, 133.19, 35.36], [土佐, 133.53, 33.56], [福知山, 135.13, 35.30], [姫路, 134.69, 34.83], [筑後, 130.41, 33.16], [広島, 132.46, 34.40]], note: 7つとも西へ}
      # fact: sekimap-94, sekimap-32, sekimap-22
      - 語り: 吉田の池田輝政は、播磨の姫路へ。岡崎の田中吉政は、九州の筑後へ。清洲の福島正則は、安芸と備後の広島へ。
        figure: {type: map, title: 関ヶ原のあとの7つの家の行き先, reveal: true, bounds: [130.0, 139.0, 32.8, 35.9], places: [[米子, 133.33, 35.43], [出雲, 133.19, 35.36], [土佐, 133.53, 33.56], [福知山, 135.13, 35.30], [姫路, 134.69, 34.83], [筑後, 130.41, 33.16], [広島, 132.46, 34.40]], note: 7つとも西へ}
      # fact: sekimap-94
      - 語り: 7つの家の石高を足すと、前は、およそ79万石。後は、およそ202万石。2.5倍になりました。そして7つとも、東海道を離れて、西へ移っています。
        tone: 重い
        figure: {type: bars, title: 東海道の7つの家の石高の合計（万石）, bars: [[関ヶ原の前, 79.4], [関ヶ原の後, 202.1]], labels: [約79万石, 約202万石]}
      # fact: sekimap-11
      - 語り: 林さんの論文によると、東海の豊臣の大名たちを西へ移すのに要った土地の、およそ半分は、中国と四国で取り上げた土地で、まかなわれました。
        figure: null
      # fact: sekimap-95, sekimap-96, sekimap-97, sekimap-98, sekimap-99, sekimap-100
      - 語り: 空いた6つの城には、3万石から6万石の、家康の家臣や親類が入りました。吉田に入った松平家清は、3万石。池田の15万2000石の、およそ5分の1です。
      # fact: sekimap-101
      - 語り: そして清洲には、家康の四男、松平忠吉が、52万石で入りました。
      # fact: sekimap-102
      - 語り: 7つの城を足すと、後は78万石。前とほとんど同じです。けれど、清洲を除くと、残る6つの城は、前のおよそ55万石から、26万石。半分以下の、小さな大名ばかりです。
        figure: {type: bars, title: 東海道の7つの城の石高（万石）, bars: [[前の7家, 79.4], [後の7家, 78], [清洲を除く前, 55.4], [清洲を除く後, 26]], labels: [約79万石, 78万石, 約55万石, 26万石]}
      - 語り: 豊臣の大名は、大きくなって、遠くへ。東海道には、小さな家康の家臣たち。
        figure: null
      - 語り: では、遠くへ移った大名たちは、どんな土地に入ったのか。
        hook: true
      - 語り: 福島正則が入った広島は、関ヶ原の前まで、ある大きな大名の領地でした。
        hook: true

  # ================================================================ 第4章 毛利はどれだけ減った？
  - title: 「毛利はどれだけ減った？」　防長2か国と返した年貢
    lines:
      # fact: sekimap-23
      - 語り: 中国地方の大半を持っていた、毛利家です。安芸と備後は、毛利の時代には、40万石あまりの土地でした。
      # fact: sekimap-52, sekimap-53
      - 語り: 毛利は、一門の吉川広家が徳川方に通じていたこともあり、取りつぶしは免れました。家康が、周防と長門の2か国を与えた起請文は、毛利博物館に残っています。
      # fact: sekimap-52
      - 語り: 家康は、広家に厚く報いようとしましたが、広家は毛利の領地を残すために動き、自分は、岩国の3万石にとどまりました。
      # fact: sekimap-50
      - 語り: では、毛利はどれだけ減ったのか。関ヶ原の前の石高からして、本によって違います。日本大百科全書や山川の日本史小辞典は、112万石。ブリタニカや旺文社の事典は、120万石あまりです。
        tone: 疑問
      # fact: sekimap-51
      - 語り: 戦いのあとの、周防と長門の石高は、山川の辞典で、36万9411石。前の石高のどちらで比べても、3分の1ほどです。
        figure: {type: bars, title: 毛利家の石高（万石）, bars: [[前（112万石説）, 112], [前（120万石説）, 120], [後 周防・長門, 36.9]], labels: [112万石, 120万石あまり, 36万9411石]}
      # fact: sekimap-55
      - 語り: しかも毛利は、移る前に、もとの6か国で集めた年貢を、返すように求められました。大阪学院大学の紀要に、2021年に載った論文は、これを6か国の返租と呼んでいます。
        figure: null
      # fact: sekimap-55
      - 語り: 1600年の検地で、実際に手に入る年貢の高は、21万石あまり。そのうち、およそ10万石を、ついてきた家臣たちの扶持に、充てました。
        card: {head: "手に入る高 21万石あまり", body: うち約10万石を家臣の扶持に}
      # fact: sekimap-54
      - 語り: 輝元は、髪をそって宗瑞と名乗り、家督を子の秀就に譲りました。1604年には、日本海に面した萩に、新しい城を築き始めます。
      # fact: sekimap-51, sekimap-56
      - 語り: 徳山大学論叢の論文によると、1600年の検地で、29万8480石だった周防と長門は、1610年に終わった検地で、53万9286石と出ました。8割増しです。
        tone: 重い
      # fact: sekimap-56
      - 語り: その論文は、高く打ち出した理由を、返した年貢と、城の建築と、幕府の工事の手伝いで、藩のお金が苦しかったためとみています。
      # fact: sekimap-56
      - 語り: それでも、幕府に認められた表向きの石高は、36万9411石のままでした。
      # fact: sekimap-57
      - 語り: 萩の藩の借金は、1623年に、銀4000貫目に達しました。藩士の禄に応じて、毎年、銀を出させる方法で、ようやく片づいたのは、1632年の8月です。
        card: {head: "借金 銀4000貫目", body: 片づくまで9年}
      - 語り: 関ヶ原の翌年、北でも、大きな大名が、4分の1に減らされていました。
        hook: true
      - 語り: そしてもう1つの家は、石高の書かれていない文書1枚で、国を移されます。
        hook: true

  # ================================================================ 第5章 上杉と佐竹は？
  - title: 「上杉と佐竹は？」　北へ移された2つの家
    lines:
      # fact: sekimap-58
      - 語り: 上杉家は、1601年に、会津の120万石から、米沢の30万石へ。4分の1です。
        figure: {type: map, title: 北へ移された2つの家, bounds: [136.8, 143.2, 35.6, 40.4], places: [[会津, 139.93, 37.49], [米沢, 140.12, 37.92], [水戸, 140.47, 36.37], [秋田, 140.10, 39.72]], route: [会津, 米沢], note: 120万石→30万石}
      # fact: sekimap-60
      - 語り: 世界大百科事典によると、米沢の30万石は、もともと、家老の直江兼続の領地でした。上杉家は、家老1人の領地に、家ごと移ったのです。
        figure: null
      # fact: sekimap-59
      - 語り: ついていった家臣の数も、本によって違います。日本大百科全書は、およそ6000人。世界大百科事典は、およそ5000人です。
        tone: 疑問
      # fact: sekimap-58
      - 語り: それでも、家臣を大きく減らすことは、しませんでした。米沢市上杉博物館によると、1769年になっても、3500家を超える藩士が、城下と、そのまわりに住んでいました。
        card: {head: "1769年の米沢", body: 藩士3500家あまり}
      # fact: sekimap-58
      - 語り: 上杉家は、そのあと1664年に、さらに15万石へ減らされています。
      # fact: sekimap-63
      - 語り: もう1つは、常陸の佐竹家です。日本大百科全書によると、常陸で54万石の大名でした。
      # fact: sekimap-62
      - 語り: 秋田県公文書館が、2010年に紹介した文書があります。1602年に、家康が佐竹義宣に与えた判物です。
      # fact: sekimap-62
      - 語り: そこには、出羽の国のうち、秋田と仙北の2つを与える、とあるだけ。石高が、書かれていませんでした。
        tone: 重い
        card: {head: "1602年の判物", body: 石高が書かれていない}
      # fact: sekimap-79
      - 語り: 秋田には、もとの領主、秋田実季がいました。実季は同じ年に、常陸の宍戸、5万石へ移され、佐竹の入る土地を空けています。
        figure: {type: map, title: 北へ移された2つの家, bounds: [136.8, 143.2, 35.6, 40.4], places: [[会津, 139.93, 37.49], [米沢, 140.12, 37.92], [水戸, 140.47, 36.37], [秋田, 140.10, 39.72]], route: [水戸, 秋田], note: 石高は書かれず}
      # fact: sekimap-64
      - 語り: 義宣は、秋田の湊の城で、ひと冬を越し、1603年の5月に、久保田城を築き始めて、翌年の8月に入りました。いまの秋田市の千秋公園です。
        figure: null
      # fact: sekimap-62, sekimap-63
      - 語り: 佐竹の石高が文書に書かれたのは、60年あまり後の、1664年。4代将軍の家綱が出した判物で、20万5800石あまりでした。常陸の54万石の、4割に満たない数字です。
        tone: 重い
      - 語り: ここまでは、減らされた大名でした。ところが、西軍で戦ったのに、領地を少しも削られなかった家があります。
        hook: true
      - 語り: 一方、すぐに家康に詫びた大名は、国を失いました。
        hook: true

  # ================================================================ 第6章 西軍なのに減らなかった家は？
  - title: 「西軍なのに減らなかった家は？」　遠い島津と、国を失った大名
    lines:
      # fact: sekimap-66
      - 語り: 九州の南の端、薩摩の島津家です。関ヶ原から2年にわたる交渉のあと、1602年の4月に、家康から、薩摩・大隅と、日向の諸県郡の領地を、そのまま認められました。
      # fact: sekimap-67
      - 語り: 1966年に鹿児島大学の紀要に出た論文によると、島津は西軍で戦ったのに、領地は無傷。家臣にも、処罰された者は1人もいませんでした。
        card: {head: "島津家", body: 領地は無傷、処罰は0人}
      # fact: sekimap-67
      - 語り: 島津義久は、家康からの、京へ上れという求めに、病気などを理由に応じませんでした。
      # fact: sekimap-67
      - 語り: その論文は、毛利が井伊直政らの起請文を受け取りながら、領地の大半を取り上げられたことを、義久が知っていたからだろう、とみています。
      # fact: sekimap-18
      - 語り: その安堵が固まったのは、義弘の子で、義久の跡を継いだ忠恒が、京へ上って家康に会った、1602年の12月。義久本人の上京は、最後までありませんでした。
      # fact: sekimap-18
      - 語り: 林さんは、家康の島津への態度を、異様なまでに寛容、と書いています。
        tone: 重い
      # fact: sekimap-18, sekimap-71
      - 語り: 対照的なのが、土佐の長宗我部盛親です。関ヶ原では南宮山に陣を構え、戦わずに国へ帰り、井伊直政を通じて、家康に詫びました。
      # fact: sekimap-71
      - 語り: けれど、兄の津野親忠を殺したことで家康の怒りを買い、土佐を取り上げられます。
      # fact: sekimap-72
      - 語り: 浦戸の城を明け渡すことを拒んだ、長宗我部の家臣たちは戦い、273名が討ち死にしました。浦戸一揆と呼ばれます。
      # fact: sekimap-73
      - 語り: 盛親は、京都の上立売に住み、大岩祐夢と名乗って、子どもたちに読み書きを教える師匠として、14年を過ごしました。そして大坂の陣で、豊臣方につきます。
        tone: しみじみ
      # fact: sekimap-69
      - 語り: 備前と美作の大名、宇喜多秀家は、関ヶ原のあと薩摩の島津に匿われ、島津家と前田家の命乞いで、死罪を免れました。1606年の4月、八丈島へ流されます。
      # fact: sekimap-70
      - 語り: 岡山県によると、2人の息子など13人で島へ渡り、84歳で亡くなるまで、50年近くを島で過ごしました。
      # fact: sekimap-70
      - 語り: 江戸時代に八丈島へ送られた流人は、1800人を超えます。その最初が、秀家の一行でした。
      # fact: sekimap-70
      - 語り: そして加賀の前田家は、明治2年に一族が許されるまで、1年おきに、白米70俵と、金子35両などを、島へ送り続けました。
        tone: しみじみ
        card: {head: "前田家の仕送り", body: 白米70俵・金子35両}
      # fact: sekimap-74
      - 語り: 取りつぶされた大名が、もとの国へ戻った例もあります。筑後の柳川を取り上げられた立花宗茂は、陸奥の棚倉で、1万石の大名に戻りました。
      # fact: sekimap-74
      - 語り: そして1620年に、柳川の10万9600石へ。関ヶ原から20年後のことでした。
        tone: しみじみ
      - 語り: では、関ヶ原で大きく増えた大名たちは、そのあと、どうなったのか。
        hook: true
      - 語り: 33年のうちに、8つの家が、取りつぶしや、跡継ぎがないことで、関ヶ原で得た大きな領地を失っていきます。
        hook: true

  # ================================================================ 第7章 勝った大名たちはその後どうなった？
  - title: 「勝った大名たちはその後どうなった？」　33年で領地を失った8つの家
    lines:
      # fact: sekimap-39
      - 語り: 最初は、小早川秀秋です。備前と美作の50万石へ移りましたが、1602年の10月18日、21歳で亡くなります。子がなく、小早川家は絶えました。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 1}
      # fact: sekimap-41
      - 語り: 清洲の松平忠吉は、1607年に28歳で亡くなり、跡継ぎがなく、家は絶えます。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 2}
      # fact: sekimap-34
      - 語り: 米子へ移った中村家は、1603年に、殿様が家老を自ら討つ騒ぎを起こし、1609年に、跡継ぎのないまま絶えました。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 3}
      # fact: sekimap-24
      - 語り: 広島の福島正則は、1619年、広島城を断りなく直したとして、安芸と備後を取り上げられ、信濃と越後の4万5000石に移されます。翌年には、越後の2万5000石も返しました。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 4}
      # fact: sekimap-32, sekimap-43
      - 語り: 筑後の田中家は1620年に跡継ぎがなく絶え、山形の最上家は1622年、一族と家臣の争いで取りつぶされ、近江などの1万石に移されました。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 6}
      # fact: sekimap-28
      - 語り: 肥後の加藤家は、清正の子の忠広の代、1632年に取りつぶされ、忠広は出羽の庄内へ流されます。
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 7}
      # fact: sekimap-33
      - 語り: そして出雲の堀尾家は、1633年、吉晴の孫の忠晴が跡継ぎなく亡くなり、絶えました。関ヶ原から、33年です。
        tone: 重い
        figure: {type: line, title: 関ヶ原で得た領地を失った家（数）, points: [[1602年, 1], [1607年, 2], [1609年, 3], [1619年, 4], [1620年, 5], [1622年, 6], [1632年, 7], [1633年, 8]], unit: 家, upto: 8}
      # fact: sekimap-94
      - 語り: 中村、福島、田中、堀尾。東海道から西へ移った7つの家のうち、4つが、こうして大きな領地を失いました。
        figure: null
      # fact: sekimap-24
      - 語り: 福島が去った広島には、和歌山から、浅野長晟が、42万6500石で入りました。取りつぶされた大名の後に、別の大名が入る形で、地図は塗り替わり続けます。
      # fact: sekimap-109
      - 語り: 藤野さんの数では、家康・秀忠・家光の3代の将軍のあいだに、取りつぶされた大名は224名。
      # fact: sekimap-109
      - 語り: 代わりに、延べ172名の親藩と譜代の大名が、新しく取り立てられました。
        card: {head: "取りつぶし224名", body: 取り立ては延べ172名}
      # fact: sekimap-113
      - 語り: 地図を塗り替えたのは、領地だけではありません。城もです。1601年、家康は近江の膳所に城を築かせ、譜代の戸田一西を、3万石で置きました。
      # fact: sekimap-113
      - 語り: 大津市は、この城を、矢橋の渡しと瀬田の唐橋を押さえて、東西の行き来を見張るためのものだった、と考えられる、としています。
      # fact: sekimap-114
      - 語り: 三成の佐和山に入った井伊家の、彦根城は、1603年に工事が始まり、7か国の12の大名に工事を割り当てて、1622年まで、およそ20年かかりました。
      # fact: sekimap-117
      - 語り: 1609年から翌年の名古屋城の工事は、西国の大名と、紀伊・加賀に割り当てられました。合わせて536万7824石です。
      # fact: sekimap-117
      - 語り: その55%を、九州と加賀が占めていたと、歴史学者の服部英雄さんは数えています。
        card: {head: "名古屋城の工事", body: 九州と加賀で55%}
      - 語り: 西へ移った大名たちは、遠くの国から、徳川の城を造りに来ていたのです。
        hook: true
      - 語り: では、関ヶ原の前と後で、大名の地図は、どう塗り替わったのか。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：関ヶ原の前と後で大名の地図はどう変わったか
    lines:
      # fact: sekimap-107
      - 語り: 関ヶ原のあと、藤野さんの数で、93名から、632万4194石が取り上げられました。日本全体の、3分の1近くです。
        figure: {type: stats, title: 関ヶ原の前と後, items: [[取り上げた石高, 632万石, 93名から], [東海道の7つの家, 2.5倍, 7つとも西へ], [領地を失った家, 8家, 33年のうちに]]}
      # fact: sekimap-09, sekimap-49
      - 語り: いちばん大きく増えたのは、家康の息子と娘の夫。けれど、取り上げた土地の8割を超える分は、豊臣の大名たちに配られた、という見方があります。
      # fact: sekimap-94, sekimap-102
      - 語り: その代わり、東海道の7つの家は、そろって西へ。空いた城には、小さな一門や譜代と、家康の子が入りました。
      # fact: sekimap-93
      - 語り: 掛川市は、山内一豊を紹介する広報の連載で、この配置を、領地を増やしながら、豊臣の大名を要の地から遠くへ追いやるもの、と説明しています。
        figure: null
      # fact: sekimap-10
      - 語り: 林さんの論文によると、中国・四国・九州には、徳川の一門や譜代の領地が、1つも置かれませんでした。
        tone: 重い
      # fact: sekimap-104
      - 語り: 藤野さんは、外様の大名はしだいに遠い土地へ移され、代わって親藩と譜代が、関東から東海、畿内の真ん中に置かれた、とまとめています。
      # fact: sekimap-110
      - 語り: ブリタニカ国際大百科事典によると、江戸の後期、266家の大名のうち、譜代は145家。大きな外様が遠くに、小さな譜代が真ん中に、という地図は、この後も続きました。
      - 語り: 勝った家康は、なぜ、豊臣の大名たちに、これほどの領地を配ったのか。
        tone: しみじみ
      - 語り: 関ヶ原で東軍として戦った大名の多くは、豊臣の大名たちでした。だから、大きく報いる。その代わりに、遠くへ。そして江戸への道は、自分の一門と家臣で固める。
        tone: しみじみ
      - 語り: 地図が、その答えを見せています。
        tone: しみじみ
      # fact: sekimap-103
      - 語り: 土佐へ移った山内一豊は、新しい高知の城の天守を、掛川の天守のとおりに建てるよう、指示したと伝わります。
        tone: しみじみ
      - 語り: それは、東海道から遠ざけられた大名の、地図の上の思い出だったのかもしれません。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
