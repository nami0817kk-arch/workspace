# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  関ヶ原の戦いは、1日で決着がつきました。けれど、そのあと持ち主が替わった領地は、日本全体の石高の、3分の1近くにのぼります。
  取りつぶされた大名は88人。削られた大名は5人。取り上げた石高は、合わせて632万石あまり。そしてその大部分を受け取ったのは、徳川の家臣ではありませんでした。
  勝った家康は、なぜ、豊臣の大名たちに領地を配ったのか。関ヶ原の前と後の大名の地図を、石高の数字で積み上げます。
  この動画でわかること
  ・取りつぶし・削られた大名の数と、資料で割れる石高
  ・加増の順位と、東海道の城にいた7つの家の行き先
  ・毛利・上杉・佐竹は、減らされた領地でどう暮らしたか
  ・西軍なのに減らなかった島津と、取りつぶされた大名のその後
  ・大きく増えた大名の家は、そのあとどうなったか
description_note: |-
  この動画に、想像の台詞や作った話はありません。数字は記録と研究（藤野保・高木昭作ほかの辞典の項〔改訂新版 世界大百科事典・日本大百科全書・山川 日本史小辞典・ブリタニカ国際大百科事典 ほか〕、林千寿「慶長五年の戦争と戦後領国体制の創出」〔熊本大学 2011〕、郡司健〔大阪学院大学 2021〕、徳山大学論叢の萩藩の検地の論文、四本健光〔鹿児島大学 1966〕、加藤理文〔東京都江戸東京博物館研究報告 2008〕、服部英雄〔名古屋城調査研究センター〕、秋田県公文書館、秋田市、米沢市上杉博物館、山口県文書館、仙台市博物館、静岡市、掛川市、浜松市、大津市、岡山県、鹿児島市史 など）から取りました。
  石高は、土地でとれる米の量で表した領地の大きさで、資料によって数が違います。取りつぶされた大名の数、関ヶ原の前の毛利の石高、米沢へ移った上杉の家臣の数は、資料ごとに並べました。年のあとの月日は、当時の暦のものです。
  絵は、画像生成AIで作った想像上の場面です。サムネイルの絵も、AI による想像図です。

en:
  title: "After Sekigahara: How Was the Map of Japan's Daimyo Redrawn? Who Got the 6.32 Million Koku?"
  description: |-
    The Battle of Sekigahara was decided in a single day. But the land that changed hands afterward came to nearly a third of all the rice yield of Japan.
    88 lords were abolished and 5 were cut down, a total of more than 6.32 million koku. And most of that land did not go to Tokugawa retainers.
    Why did the victor, Tokugawa Ieyasu, hand land to lords who had served the Toyotomi? We add it up, number by number, comparing the map before and after Sekigahara.
    In this video you will learn:
    - How many lords were abolished or reduced, and why the totals differ between sources
    - Who gained the most, and where the seven houses of the Tokaido castles were sent
    - How the Mori, Uesugi and Satake lived on their reduced domains
    - Why the Shimazu, who fought for the West, lost nothing, and what became of the lords who lost everything
    - What happened to the families that gained the most
    Japanese-language history video (Japanese audio). Everything comes from records; there are no invented lines.
  chapters:
    - "Nearly a Third of Japan Changed Hands"
    - "How Much Land Was Taken?"
    - "Who Gained the Most?"
    - "What Happened to the Tokaido Castles?"
    - "How Much Did the Mori Lose?"
    - "The Uesugi and the Satake: Sent North"
    - "Western Lords Who Kept Their Land, and Those Who Lost Everything"
    - "What Became of the Winners?"
    - "Summary: How the Map Was Redrawn"

