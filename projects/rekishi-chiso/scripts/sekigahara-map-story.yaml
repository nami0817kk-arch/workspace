# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と ise-story.yaml の型）。関ヶ原の前と後の大名の地図。2026-11-21 下書き。
# 公開の予定は 11/28 12:00（12時枠）。型は「勢力図」の数字を積み上げる型。主語は「関ヶ原のあとの大名の地図」1つで、最後まで主役。
#   誰でも持つ像＝関ヶ原で勝った家康が、負けた西軍の領地を取って徳川のものにした。裏返す一点＝取り上げた領地の大部分は、もと豊臣の家臣だった大名に配られた。
#   その代わり、東海道の城にいた豊臣系の大名は7人そろって西へ（石高は約2.5倍、ただし遠くへ）。空いた東海道は一門・譜代で埋めた。中国・四国・九州に一門・譜代の領国は1つも無い。
#   問い（1本に1つのなぜ）＝「勝った家康は、なぜ、豊臣の大名たちに領地を配ったのか」。答え＝大きくする代わりに遠くへ（掛川市の説明・藤野保の辞典の項）。
#   その後＝関ヶ原で大きな領地を得た家のうち8つ（東海道の7家のうち4つ）が、33年のうちにその領地を失う。
# 既出と重ねない：scripts/sekigahara-if.yaml（もしも関ヶ原で西軍が勝ったら）は合戦の経過・秀秋の離反・輝元の退去が主で、戦後は1節（家康255万→400万・豊臣222万→65万の棒）だけ。
#   この回は合戦の経過を1行にし、家康の255万→400万（出どころの本文が見つからない）と豊臣家の222万→65万は使わない。毛利の減封は数字と暮らし（返租・検地・負債）で、別の中身。
#   上杉景勝の回（11-18）とは米沢の数行だけ重なる（家臣を減らさず移った・兼続の旧領）。
# 事実は事実カード（dev/output/rekishi-chiso/research/関ヶ原の戦後処理_facts_20261121.yaml、sekimap-01〜120。担当A=総量・B=加増・C=負けた側・D=配置）にあるものだけ。行の上に `# fact: sekimap-NN`。
# 記録の食い違い（並べたもの3つ）：①取りつぶされた大名の数と石高（藤野保 88名・632万4194石／高木昭作 90人・空白地660万石／ブリタニカ 91家・420万石）
#   ②関ヶ原の前の毛利の石高（日本大百科全書ほか 112万石／ブリタニカほか 120万石余）③米沢へ移った上杉の家臣の数（日本大百科全書 約6000人／世界大百科事典 約5000人）。
#   並べなかった食い違い：没収の総量の 622万石余（北島・高埜）、福島・黒田・加藤ほか各大名の石高の端数、豊臣家の蔵入地、毛利の表高の端数、佐竹の20万5800石と20万5810石。
# 自分で計算した数（全部計算し直した）：
#   藤野 416万1084＋216万3110＝632万4194（辞典の合計と合う）。88＋5＝93名。632万4194÷2000万＝31.6%（全国は「2000万石弱」なので実際はこれより少し大きい）→「3分の1近く」。660÷2000＝33%。
#   林千寿の集計 619万7250÷965万7087＝64.17%→「およそ64%」。九州の没収 73万1000÷251万3837＝29.1%（安堵71%と合う）。
#   加増の幅（辞典の数）：結城 68−10.1＝57.9（67なら56.9）。蒲生 60−12＝48。松平忠吉 52−10＝42。3家で 57.9＋48＋42＝147.9（または146.9）→「150万石近く」。
#     黒田 52.3−12＝40.3、52.3÷12＝4.36→「4倍あまり」。池田 52−15.2＝36.8。加藤 54−19.5＝34.5。福島 49.8−24＝25.8、49.8÷24＝2.08→「2倍あまり」。細川 39.9−12＝27.9。
#     山内 20.26÷5＝4.05→「およそ4倍」。前田 119万2760−82万＝37万あまり。京極 6→8.5→9.2。本多忠勝 10→10。井伊 12→18。
#   東海道7家 前：中村14.5＋堀尾12＋山内5＋有馬3＋池田15.2＋田中5.74＋福島24＝79.44万。後：米子17.5＋出雲24＋土佐20.26＋福知山6＋姫路52＋筑後32.5＋広島49.8＝202.06万。
#     202.06÷79.44＝2.54→「およそ2.5倍」（中村14.2・田中10で計算すると 81.4→202.06 で 2.48）。
#   入れ替わり：内藤4＋松平定勝3＋松平忠頼5＋大須賀6＋松平家清3＋本多康重5＋松平忠吉52＝78万。清洲を除く 78−52＝26、79.44−24＝55.44。26÷55.44＝0.47→「半分以下」。
#   池田 15.2→松平家清3：3÷15.2＝0.197→「およそ5分の1」。
#   毛利：36万9411÷112万＝33.0%、36万9411÷120万＝30.8%→「3分の1ほど」。慶長15年検地 53万9286÷29万8480＝1.807→「8割増し」。1623→1632＝9年。
#   上杉：120→30＝4分の1。1601→1664＝63年。佐竹：20万5800÷54万＝38.1%→「4割に満たない」。1602→1664＝62年→「60年あまり」。
#   宇喜多：1606→1655＝49年→「50年近く」。立花：1600→1620＝20年。佐土原：1600年9月→1603年10月＝3年あまり。
#   領地を失った家：小早川1602（断絶）・松平忠吉1607（断絶）・中村1609（断絶）・福島1619（4万5000石へ）・田中1620（断絶）・最上1622（1万石へ）・加藤1632（改易）・堀尾1633（断絶）＝8家。1633−1600＝33年。
#   黒田：前は旺文社の12万石、後は52万（旺文社）〜52万3000石（世界大百科ほか）。52÷12＝4.33・52.3÷12＝4.36→「4倍を超える」。林の集計は 965万7087→「およそ966万石」・619万7250→「およそ620万石」。
#   11-21 照合の指摘で直した所：家康の家族→息子2人と娘の夫、京極は「東軍・城を明け渡した」、有馬の横須賀入りは1590年でない、出雲の点は富田寄り、島津の安堵は4月→12月に固まる、毛利の8割増しの元は29万8480石。
#   名古屋城の普請 294万3857÷536万7824＝54.8%→「55%」。
#   和暦：慶長5年＝1600年、慶長6年＝1601年、慶長7年＝1602年、慶長8年＝1603年、慶長9年＝1604年、慶長11年＝1606年、慶長15年＝1610年、元和6年＝1620年、元和9年＝1623年、
#     寛永9年＝1632年、寛永10年＝1633年、寛文4年＝1664年、明暦元年＝1655年、明和6年＝1769年、天正18年＝1590年、文禄4年＝1595年。
# 確かめられなかったこと（台本では言わない）：全国1850万石・家康の戦後400万石・慶長7年5月8日の国替えの命・島津の4月11日・伊達の覚書の日付（8月22日）・覚書が反故になった理由、
#   立花が「旧領に戻った唯一の例」、膳所城が最初の天下普請、天正18年の配置が「家康を囲む」意図だったこと（静岡市が「金箔瓦包囲網」という先行研究を紹介しているだけ）、宇喜多の57万4千石・長宗我部の22万2千石。
# 想像の台詞なし。語りは剣崎1人。
# 絵：AI 絵（Gemini と過去の回の AI 絵。一覧は scripts/story/sekigahara_map_main_look.yaml の頭）。実在の人物の顔は描かない（後ろ姿・遠景・誰とも名指さない武士）。字・紋・旗の字は描かない。
