# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  コロンブスは、キューバを日本だと思っていました。1492年10月の航海日誌には、キューバ島はジパングに違いないと思う、とあります。
  彼の計算では、日本は西へ約2400海里。本当の距離は、その4倍あまりでした。
  もしも、あの航海が大西洋の真ん中で引き返していたら、世界はどうなっていたのでしょうか。
  この動画でわかること
  ・コロンブスが日本を近いと考えた理由と、計算の誤り
  ・1492年10月10日、船乗りたちが何を迫ったのか、記録ごとの違い
  ・コロンブスが来なくても、ほかの航海者が来ていたのか
  ・じゃがいも・唐辛子・さつまいも・銀・疫病が、世界と日本の何を変えたのか
description_note: |-
  この動画に、想像の台詞はありません。記録に残る言葉は、出どころ（コロンブスの航海日誌（ラス・カサスの要約）・サンタンヘルへの手紙・ジャマイカからの手紙、ラス・カサス『インディアス史』、フェルナンド・コロン『提督伝』、オビエド『インディアス博物誌』、ピエトロ・マルティレ『新世界について』、カミーニャの手紙、アコスタ『新大陸自然文化史』、『鉄炮記』、『芝峰類説』、A. W. クロスビー、N. ナンとN. チエン、S. チェンとJ. クン、A. コッホほか、K. ポメランツ、ホー・ピンティ、J. B. ラッセル、E. J. ハミルトン、島根県・農畜産業振興機構・千葉県・仙台市・メキシコ国立人類学歴史研究所・米国議会図書館の資料など）を語りで示してから、今の言葉にして読んでいます。
  10月10日の船乗りとの約束、イスパニョーラ島の人口、唐辛子の伝わり方は、記録や研究者によって書き方が割れています。
  コロンブスがアメリカに着かなかった場合にどうなったかは、記録から言い切れません。「もしも」と言ってから話している部分は、記録ではなく考え方の整理です。
  絵は、《南蛮屏風》、『和泉名所図会』、《支倉常長像》ほかの絵画・絵図（パブリックドメイン）と、画像生成AIで作った想像上の人物と風景です。コロンブスの姿は、画像生成AIによる想像図です。
  サムネイルの人物像は、画像生成AIによる想像図です。

en:
  title: "What If Columbus Had Never Reached America? How the World Would Have Changed"
  description: |-
    Columbus believed Cuba was Japan. In October 1492 he wrote in his journal that the island of Cuba must be Cipango.
    By his reckoning, Japan lay about 2,400 nautical miles to the west. The real distance was more than four times that.
    If that voyage had turned back in the middle of the Atlantic, how would the world have changed?
    In this video you will learn:
    - Why Columbus believed Japan was close, and where his calculation went wrong
    - What the sailors demanded on October 10, 1492, and how the records disagree
    - Whether other navigators would have reached America without Columbus
    - What potatoes, chili peppers, sweet potatoes, silver and disease changed in the world and in Japan
    Japanese-language history video (Japanese audio).
  chapters:
    - "He Thought Cuba Was Japan: October 1492"
    - "How Close Did Japan Seem? Books and Miscalculations"
    - "How Did the Rejected Plan Get Moving? Granada and Santa Fe, 1492"
    - "What Did the Sailors Demand on October 10, 1492?"
    - "Turning Point 1: Who Else Was Sailing West? 1021-1500"
    - "How Many People Did the Potato Feed?"
    - "Where Did the Silver Go? Potosi, Manila and Iwami"
    - "What Did Disease and Sugar Change?"
    - "Turning Point 2: How Did Japan's Fields Change?"
    - "Summary: If Columbus Had Never Reached America"

