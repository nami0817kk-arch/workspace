# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と hojo-if-story.yaml の型）。もしもコロンブスがアメリカにたどり着かなかったら。2026-11-06 下書き。
# 公開の予定は 11/9 12:00（昼＝B作品の if）。型は docs/story-main.md「00. 伸びる型」の もしも型：
#   分岐は誰でも知る大事件（1492年のアメリカ到達）の逆＝1492年10月10日、不満を募らせた船乗りに押されて船団が引き返していたら／一点だけ変える／
#   史実の条件の範囲内（記録に、船乗りが引き返せと迫った話が残る）／推論と明かす／台詞は使わない（想像の台詞なし）／対象は「世界」（日本まで届かせる）。
#   語り手は剣崎1人。「もしも」の部分は「もしも」と言ってから話し、事実と混ぜない。予想の席は研究者の説（Crosby・Nunn と Qian・Koch ほか・Pomeranz・ホー・ピンティ・Chen と Kung）に置く。
#   冒頭（10秒以内）＝コロンブスは、キューバを日本だと思った（航海日誌 10月21〜24日）。彼の計算では日本はカナリア諸島の西 約2400海里。
#   序章／第1章 日本は近いと思われた（本と計算）／第2章 女王の許可（委員会・ピノスの呼び戻し・協約）／第3章 1492年10月10日（不満と陸）／
#   第4章 ほかに誰が来ていたか（ヴァイキング・ブリストル・カボット・カブラル）→分岐1／第5章 作物（じゃがいも・とうもろこし・トマト・唐辛子）／
#   第6章 銀（ポトシ・ガレオン・石見）と鉄砲／第7章 疫病と砂糖／第8章 日本の畑（唐辛子・さつまいも・たばこ）→分岐2／まとめ。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 公開済みとの重なり：コロンブスの回は無い（旧型ナポレオンの回の次回予告で名前だけ出た）。支倉（政宗の回）・南蛮屏風（信長の回）は短く使う。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/コロンブス_facts_20261106.yaml）にあるものだけ。行の上に `# fact: columbus-NN`。
#   誰でも知る前置き（1492年にアメリカに着いた・鉄砲伝来）は短く使う。
#   記録の食い違いは3つだけ並べる：①10月10日に「3日」の約束があったか（日誌・オビエド・ラス・カサス）②イスパニョーラ島の1492年の人口（ラス・カサス300万超・研究者6万〜800万）
#   ③唐辛子はどちらから来たか（朝鮮の『芝峰類説』は日本から、日本の記録は朝鮮から）。
#   ほかに割れるもの（出航の時刻・人数90/120・褒美・ピノスの使いと金額・鉄砲の年 1539/1542/1543・さつまいもの年・じゃがいも・トマトの年・ガレオン貿易の始まり 1565/1571・
#   日本の銀の「3分の1」・じゃがいもの効き目 12%/約4分の1・死者 5000万/5600万）は、1つの出どころの数として言うか、言わない。
# 自分で計算した数：
#   2400海里×1.852＝4445km≒約4400キロ。1万600海里×1.852＝19631km≒約2万キロ。10600÷2400＝4.4＝4倍あまり。
#   1477m÷1975m＝0.748→約25％小さい（Williams の数と合う）。
#   1492−1021＝471年。1497−1492＝5年。1500−1492＝8年。1506−1492＝14年。1545−1492＝53年。
#   ハミルトン 16,886,815kg≒約1万6900トン。シュルース：日本 年77トン、ポトシ1か所 年200トン超→2倍半を超える（200÷77＝2.6）。
#   生糸 80両→140〜150両＝1.75〜1.9倍≒2倍近く。1609年 373−56＝317人（カードと合う）。
#   Koch：6050万の90％＝5445万≒約5400万（台本は「9割が失われた」だけ。5600万は言わない）。
#   キャッサバ 4800万トン÷2800万トン＝1.7倍。中部メキシコ 1500万→150万＝10分の1。
#   さつまいも 1597（宮古）→1735（蕃藷考）＝138年。
# 確かめられなかったこと（台本では言わない）：委員会の長の名（本文に「タラベラ」の名が無い）・「平らな大地」の会議の実在・Crosby がこの言葉を作ったという文（本の題と年は書誌）・
#   「誰かが数年で来た」と書いた歴史家の名前つきの文・Pomeranz のゴースト・エーカーの面積・探幽の「唐なすび」の年・ガレオンが運んだ銀の量・ポトシの人口。
# 絵：Gemini（Chrome）で新しく作った AI 絵（C01〜、一覧は scripts/story/columbus_main_look.yaml の頭）＋実在の絵（南蛮屏風・『和泉名所図会』・支倉常長像・ル・ブトゥーの日本図）。
#   先住民の死・奴隷の場面は描かない（数と事実だけを語る）。
