sections:
  # ================================================================ 序章
  - title: 「この島は、日本に違いない」　1492年10月 カリブ海
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    year: 1492
    lines:
      # fact: columbus-31
      - 語り: コロンブスは、キューバを、日本だと思っていました。1492年10月の航海日誌に、こうあります。キューバ島は、《ジパング》に違いないと思う。
        tone: 重い
        card: {head: "1492年10月23日", body: 「キューバは、ジパングに違いない」}
      # fact: columbus-48
      - 語り: ミネソタ大学の講義の資料によると、コロンブスの計算では、日本は、カナリア諸島から西へ約2400海里。およそ4400キロ先にあるはずでした。
      # fact: columbus-48
      - 語り: 本当の距離は、約1万600海里。見積りの4倍あまりです。
        tone: 重い
        figure: {type: stats, title: 西へ、日本まで, items: [[コロンブスの見積り, 約2400海里, 約4400キロ], [本当の距離, 約1万600海里, 約2万キロ]], upto: 2}
      - 語り: その途中に、当時のヨーロッパの地図には無い、大きな陸がありました。
        figure: null
      # fact: columbus-76, columbus-27
      - 語り: 航海の途中、船乗りたちは、引き返せと迫っていました。
      - 語り: もしも、あの航海が、大西洋の真ん中で引き返していたら。世界は、どうなっていたのでしょうか。
        tone: 疑問
      - 語り: 変えるのは一点だけ。1492年10月10日、船団が東へ引き返していたら。
      - 語り: じゃがいも、唐辛子、銀、そして日本のさつまいも。アメリカとつながらない世界で、消えるものと、それでも届くもの。分かれ目は、どこにあるのでしょうか。
        tone: 疑問
        hook: true
      - 語り: 彼の計算は、どこで4倍も狂ったのでしょうか。
        hook: true

  # ================================================================ 第1章 本と計算
  - title: 「日本は、どれほど近いと思われたのか」　1480年代 リスボン・セビーリャ
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    year: 1484
    lines:
      # fact: columbus-37
      - 語り: 息子のフェルナンドは、父の伝記に、その根拠を並べています。マルコ・ポーロの旅行記、フィレンツェの学者トスカネッリの手紙、そしてピエール・ダイイの『世界像』。
      # fact: columbus-37
      - 語り: 16世紀の修道士ラス・カサスは、コロンブスが持っていたダイイの本を、自分の目で見ています。余白は、コロンブスの書き込みで埋まっていた、と書きました。
      # fact: columbus-49
      - 語り: 決め手は、9世紀の天文学者、アルフラガヌスの数でした。緯度1度の長さは、56と3分の2マイル。
        card: {head: "アルフラガヌス", body: 緯度1度＝56と3分の2マイル}
      # fact: columbus-49
      - 語り: ところがコロンブスは、これを、長いアラビアのマイルではなく、短いイタリアのマイルで読みました。1マイルは、約1975メートルではなく、約1477メートル。
      # fact: columbus-49
      - 語り: 航海学者のウィリアムズが1988年の論文で示した、この2つの長さで割ると、地球を約25％小さく見たことになります。
        tone: 重い
        figure: {type: stats, title: 1マイルの長さの読み違い, items: [[アラビアのマイル, 約1975メートル, アルフラガヌスの意味], [イタリアのマイル, 約1477メートル, コロンブスの読み]], upto: 2}
      # fact: columbus-46
      - 語り: よく語られる、中世の人は大地が平らだと信じていた、という話は、記録とは違います。歴史家のジェフリー・バートン・ラッセルは、これを19世紀の作り話だと論じました。
        figure: null
      # fact: columbus-46
      - 語り: ラッセルは、この話を広めた始まりの1つに、1828年に出た、ワシントン・アーヴィングのコロンブスの伝記を挙げています。
      # fact: columbus-74
      - 語り: コロンブスは、まずポルトガル王ジョアン2世に計画を持ち込みます。王は、顧問たちに意見を求めました。
      # fact: columbus-73
      - 語り: 計画は退けられました。1488年12月、アフリカの南の端を回ったバルトロメウ・ディアスが、リスボンに戻ります。その報告を王が受けた場に、コロンブスも居合わせた、と、20世紀の初めの研究者ラーフェンシュタインは書いています。
      - 語り: ポルトガルは、アフリカを回って東へ行く道を、もう手にしかけていたのです。
        tone: しみじみ
      - 語り: 西へ行く計画を拾ったのは、隣の国、スペインでした。
        hook: true
      - 語り: けれど、そこでも一度、計画は退けられます。
        hook: true

  # ================================================================ 第2章 女王の許可
  - title: 「退けられた計画は、どう動き出したのか」　1492年 グラナダ・サンタフェ
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    year: 1492
    lines:
      # fact: columbus-04
      - 語り: スペインの両王、イサベル女王とフェルナンド王は、計画を学者たちの委員会に調べさせました。
      # fact: columbus-04
      - 語り: ラス・カサスの『インディアス史』は、委員会が退けた理由を並べています。何千年も誰も知らなかった土地が、今さらあるはずがない。
      # fact: columbus-04
      - 語り: 西へ下るように進めば、帰りは坂を上ることになり、船は戻れない。フェルナンドの伝記には、3年かけても東の果てには届かない、ともあります。
        card: {head: "委員会の理由", body: 世界は広すぎる・帰れない}
      - 語り: 地球が丸いことは、誰も疑っていません。問題は、距離と、帰り道でした。
        tone: しみじみ
      # fact: columbus-87
      - 語り: 1492年1月、イスラムの王国グラナダが、両王に城を明け渡します。同じころ、コロンブスの計画は、再び退けられました。
      # fact: columbus-87
      - 語り: ラス・カサスによると、去りかけたコロンブスを、宮廷の役人が追いかけ、グラナダの近くのピノスの橋で呼び戻しました。女王の心を変えたのは、宮廷のルイス・デ・サンタンヘルだった、とラス・カサスは書きます。
        card: {head: "1492年1月", body: ピノスの橋で呼び戻される}
      # fact: columbus-75
      - 語り: サンタンヘルが用立てた金は、記録では114万マラベディ。ただ、それが本人の財産だったのかは、説明が割れています。
      # fact: columbus-24
      - 語り: 4月17日、サンタフェの陣で、協約が結ばれます。コロンブスは、見つけた島と陸の提督となり、そこで手に入る品の10分の1を受け取る、という約束でした。
        card: {head: "1492年4月17日", body: サンタフェの協約。取り分は10分の1}
      # fact: columbus-23
      - 語り: 3隻のうち2隻は、南の港町パロスが出しました。パロスは、以前の罪の罰として、船2隻を武装して12か月、王に仕える務めを負っていたのです。
      - 語り: 女王の許しと、パロスの罰。2つがそろって、船団が動き出します。
        tone: しみじみ
        hook: true
      - 語り: そして大西洋の上で、船乗りたちは、限界に近づいていきました。
        hook: true

  # ================================================================ 第3章 1492年10月10日
  - title: 「1492年10月10日、船乗りは何を迫ったのか」　大西洋
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    year: 1492
    lines:
      # fact: columbus-21
      - 語り: 1492年8月3日、船団はパロスを出ました。航海日誌の記録では、朝8時です。
        card: {head: "1492年8月3日", body: パロスを出航}
      # fact: columbus-36
      - 語り: ただ、この日誌の原本は残っていません。今まとまった形で読めるのは、ラス・カサスが手で書き写した要約です。
      # fact: columbus-22
      - 語り: 乗っていた人数も、ラス・カサスとフェルナンドは90人、オビエドの『インディアス博物誌』は、全部で120人ほどと書きます。
      # fact: columbus-25
      - 語り: 9月6日、カナリア諸島のゴメラ島を出る前、コロンブスは知らせを受けます。ポルトガルの船3隻が、自分を捕らえようと待っている。
        figure: {type: map, title: 1492年 第1回の航海, bounds: [-82, -2, 15, 45], places: [[パロス, -6.89, 37.23], [ゴメラ島, -17.2, 28.1], [グアナハニ, -74.5, 24.1], [キューバ, -77.9, 21.5]], route: [パロス, ゴメラ島, グアナハニ, キューバ], note: 9月6日にゴメラ島を出て、10月12日に陸}
      # fact: columbus-26
      - 語り: 長い航海で船乗りがおびえないよう、コロンブスは、走った距離より短い数を見せました。日誌の10月1日は、見せた数が584レグア、本当は707レグアです。
        figure: null
        card: {head: "10月1日", body: 見せた数584・本当は707}
      # fact: columbus-76
      - 語り: イタリアの人文学者ピエトロ・マルティレの『新世界について』は、カナリア諸島を出て30日を過ぎると、船乗りたちが引き返せと迫り、コロンブスを海に投げ込むことまで企てた、と書いています。
        tone: 重い
      # fact: columbus-27
      - 語り: そして10月10日。何が話し合われたのかは、記録によって違います。
        tone: 疑問
      # fact: columbus-27
      - 語り: 航海日誌の要約では、船乗りたちが不平を言い、コロンブスは励まして、インディアスに着くまで進むと言った。それだけです。
        figure: {type: stats, title: 10月10日、船乗りとの話, items: [[航海日誌（要約）, 励まして進む, 約束なし], [オビエド, 3日のうちに陸, 3日だけ待つ], [ラス・カサス, 数日がまんを, 3日とは書かない]], upto: 1}
      # fact: columbus-27
      - 語り: ところがオビエドは、コロンブスが、3日のうちに陸が見つかると約束し、船乗りたちは、3日だけ付いていくと応じた、と書きました。
        figure: {type: stats, title: 10月10日、船乗りとの話, items: [[航海日誌（要約）, 励まして進む, 約束なし], [オビエド, 3日のうちに陸, 3日だけ待つ], [ラス・カサス, 数日がまんを, 3日とは書かない]], upto: 2}
      # fact: columbus-27
      - 語り: ラス・カサスは、数日がまんしてくれ、と頼んだとは書きますが、3日とは書きません。
        figure: {type: stats, title: 10月10日、船乗りとの話, items: [[航海日誌（要約）, 励まして進む, 約束なし], [オビエド, 3日のうちに陸, 3日だけ待つ], [ラス・カサス, 数日がまんを, 3日とは書かない]], upto: 3}
      # fact: columbus-28
      - 語り: 翌11日の夜10時、コロンブスは、遠くに明かりを見たと言います。陸が見えたのは、12日の夜中の2時。最初に見たのは、水夫のロドリゴ・デ・トリアナでした。
        figure: null
      # fact: columbus-30
      - 語り: 着いた島を、住む人々はグアナハニと呼んでいました。コロンブスは、書記を証人に、両王のための領有を宣言し、サン・サルバドルと名づけます。
        card: {head: "1492年10月12日", body: グアナハニに着く}
      # fact: columbus-31
      - 語り: 10月21日、日誌には、もっと大きな島、ジパングだと思う、とあります。23日には、キューバ島はジパングに違いない。冒頭の、あの言葉です。
      # fact: columbus-32
      - 語り: 11月2日には、ヘブライ語やアラビア語のできるルイス・デ・トーレスらを、内陸へ送りました。その土地の王を探させるためです。
      # fact: columbus-35
      - 語り: 2度目の航海の1494年6月、コロンブスは、キューバが島ではなく大陸だと、乗組員に誓わせる記録まで作らせています。違うことを言えば、重い罰がありました。
      # fact: columbus-88
      - 語り: 1503年、4度目の航海のジャマイカからの手紙でも、インドのガンジス川までは10日の行程だ、と書いています。1506年に亡くなるまで、彼はアジアに着いたと考えていました。
        tone: しみじみ
      - 語り: 10月10日に引き返していれば、この島々を、コロンブスは見ていません。
        hook: true
      - 語り: では、その場合、アメリカは誰にも見つからなかったのでしょうか。
        hook: true

  # ================================================================ 第4章 分岐1 ほかの航海者
  - title: 「分岐1 コロンブスが来なければ、誰が来たのか」　1021年から1500年
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    year: 1500
    lines:
      # fact: columbus-45
      - 語り: 実は、コロンブスより前に、海を渡った人々がいました。カナダのニューファンドランド島、ランス・オ・メドーの遺跡です。
      # fact: columbus-45
      - 語り: 2021年に科学誌のネイチャーに出た研究は、木の年輪を数え、ヴァイキングがここで木を切った年を、西暦1021年と決めました。コロンブスの471年前です。
        card: {head: "西暦1021年", body: ヴァイキングがカナダで木を切る}
      # fact: columbus-51
      - 語り: 1480年7月15日には、イングランドのブリストルから、80トンの船が、西の海にあると信じられた伝説の島を探しに出ています。嵐で押し戻され、約9週間で戻りました。
      # fact: columbus-52
      - 語り: 1486年7月24日には、ポルトガル王ジョアン2世が、フランドル出身の航海者に、西の海の島と、その先にあるかもしれない陸を探す許しを与えていました。
      - 語り: 西を目指したのは、コロンブス1人ではありませんでした。
        tone: しみじみ
      # fact: columbus-71
      - 語り: 1496年3月5日、イングランド王ヘンリー7世は、ジョン・カボットに特許状を与えます。行ってよい海は、東と西と北。南は入っていません。
      # fact: columbus-72
      - 語り: 1956年にスペインの文書館で見つかったジョン・デイの手紙によると、1497年のカボットの船は、35日で陸を見ました。
        card: {head: "1497年", body: カボット、35日で陸を見る}
      # fact: columbus-10
      - 語り: そして1500年。インドのカリカットへ向かうポルトガルの艦隊が、4月、大西洋の西で、見知らぬ陸を見ます。指揮していたのは、ペドロ・アルヴァレス・カブラルです。
        figure: {type: map, title: 1500年 カブラルの艦隊, bounds: [-60, 20, -25, 45], places: [[リスボン, -9.14, 38.72], [カーボベルデ, -23.6, 15.1], [ポルト・セグーロ, -39.06, -16.44]], route: [リスボン, カーボベルデ, ポルト・セグーロ], note: インドへ向かう途中で陸を見た}
      # fact: columbus-10
      - 語り: 艦隊にいたペロ・ヴァス・デ・カミーニャは、5月1日付の手紙で、王に知らせました。この土地は、カリカットへの航海の寄港地に使える。今のブラジルです。
        figure: null
      # fact: columbus-77
      - 語り: 1507年、ドイツのヴァルトゼーミュラーの世界地図に、アメリカという名が初めて載ります。1000部刷られたと伝わりますが、残るのは1部だけ。アメリカ議会図書館が、1000万ドルで買い取りました。
      - 語り: ここから、もしもの話です。1492年10月10日に、船団が東へ戻っていたら。ここから先は、記録と研究者の説から考える推論です。
        tone: 疑問
      - 語り: カブラルの艦隊は、コロンブスの島々を目指したのではなく、アフリカを回ってインドへ行く途中で、陸を見ています。この道は、コロンブスとは別に、ポルトガルが開いてきた道でした。
      - 語り: 記録を並べて考えると、ポルトガルの船は、1500年ごろには、やはりアメリカの陸を見ていたかもしれません。遅れは、8年ほどで済んだかもしれない、とこの動画では考えます。
        figure: {type: table, title: もしも1492年に引き返していたら（推論）, cols: [史実, もしも], rows: [[ヨーロッパとアメリカ, 1492年につながる, 1500年ごろか, ありうる], [最初に着く国, スペイン, ポルトガルかもしれない, ありうる]], upto: 2, note: もしもは推論。右の札は見込みの高さ}
      - 語り: ただし、カボットの航海が、コロンブスの知らせに動かされたものかどうかは、言い切れません。
        figure: null
      - 語り: ポルトガルがブラジルの陸を見つけたと知れば、スペインも、西へ船を出したでしょう。
      - 語り: ただ、カリブ海とメキシコ、アンデスに、どの国が先に着くか。じゃがいもと銀の行方は、そこで分かれます。
        tone: しみじみ
      - 語り: つながったことで、世界の食卓は、どれほど変わったのでしょうか。
        hook: true
      - 語り: 手がかりは、1972年に出た、1冊の本です。
        hook: true

  # ================================================================ 第5章 作物
  - title: 「じゃがいもは、何人を養ったのか」　1492年から1900年
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    lines:
      # fact: columbus-11
      - 語り: 1972年、アメリカの歴史家アルフレッド・クロスビーは、『コロンブス交換』という本を出しました。1492年のあと、2つの世界のあいだで、作物、家畜、病気、そして人が行き来したことを、この言葉で呼んだのです。
        card: {head: "1972年", body: クロスビー『コロンブス交換』}
      # fact: columbus-38
      - 語り: クロスビーは1987年の小論で、こう書いています。1983年には、アメリカ原産のとうもろこしが、世界の穀物の6分の1を超えていた。
      # fact: columbus-38
      - 語り: 南アメリカ原産のキャッサバという芋は、アフリカでは4800万トンあまり。原産地の南アメリカの2800万トンより、多く作られていました。
        figure: {type: stats, title: キャッサバの生産（1983年ごろ、クロスビー）, items: [[アフリカ, 4800万トンあまり], [南アメリカ（原産地）, 2800万トン]], upto: 2}
      # fact: columbus-40
      - 語り: じゃがいもは、アンデスの山の作物です。経済学者のネイサン・ナンとナンシー・チエンは、2011年の論文で計算しました。
        figure: null
      # fact: columbus-40
      - 語り: 控えめに見積もっても、1700年から1900年に、アメリカの外の世界で人口が伸び、都市に住む人の割合が伸びた。その約4分の1は、じゃがいもで説明できる、というのです。
        tone: 重い
      # fact: columbus-84
      - 語り: ただ、広まるのは簡単ではありません。プロイセンのフリードリヒ大王は、1740年代の初めから栽培を勧め、治世のあいだに少なくとも15回、じゃがいもを広める命令を出しています。
      # fact: columbus-85
      - 語り: 頼りすぎた国もありました。じゃがいもの病気が広がったアイルランドの大飢饉では、今の歴史家の多くが、少なくとも100万人が余計に亡くなったとみています。
        tone: 重い
      # fact: columbus-82
      - 語り: トマトは、ヨーロッパで長く毒と恐れられた、と語られがちです。けれど、最初に記したイタリアのマッティオリは、1554年の本で、油と塩とこしょうで揚げて食べる、と書いていました。
      # fact: columbus-83
      - 語り: 唐辛子は、驚くほど速く広まりました。1542年、ドイツの植物学者フックスは、これを、インドのカリカットのこしょう、と呼んでいます。
      # fact: columbus-83
      - 語り: 1492年からわずか50年。ドイツの学者でさえ、唐辛子をインドから来たものだと思っていたのです。
        tone: しみじみ
      - 語り: もしもの世界でも、唐辛子やとうもろこしは、いずれヨーロッパの船で運ばれたでしょう。けれど、じゃがいもと銀は、アンデスとメキシコに誰かが着くまで動きません。遅れは、8年より長くなりえます。
      - 語り: 作物と同じ道を、もう一つ、世界を動かしたものが流れていきます。
        hook: true
      - 語り: 銀です。そのころ、日本もまた、銀の国でした。
        hook: true

  # ================================================================ 第6章 銀と鉄砲
  - title: 「銀は、どこへ流れたのか」　16世紀 ポトシ・石見
    background: {image: paintings/nobunaga_nanban_screen_naizen.png, credit: "《南蛮屏風》（安土桃山時代）"}
    year: 1545
    lines:
      # fact: columbus-13
      - 語り: 1545年、今のボリビアの山、ポトシで、銀の鉱脈が見つかります。1590年に出た、スペインの宣教師アコスタの『新大陸自然文化史』は、最初の登録を、1545年4月21日と書いています。
        card: {head: "1545年4月21日", body: ポトシの銀の最初の登録}
      # fact: columbus-78
      - 語り: 経済史家のハミルトンは、1934年、セビーリャの登録の記録から、アメリカから運ばれた銀を数えました。1503年から1660年で、純銀およそ1万6900トンです。
      # fact: columbus-14
      - 語り: 銀は、太平洋も渡ります。メキシコ国立人類学歴史研究所によると、1565年10月8日、修道士で航海者のウルダネータの船が、フィリピンからメキシコのアカプルコに帰り着きました。太平洋を東へ戻る道が見つかったのです。
      # fact: columbus-14
      - 語り: 1571年には、スペイン人がマニラを町とします。メキシコの銀を、マニラで中国の品と替える道が、ここに通じました。
        figure: {type: map, title: マニラ・マカオ・長崎（16世紀後半）, bounds: [105, 145, 5, 40], places: [[マカオ, 113.54, 22.2], [長崎, 129.87, 32.75], [マニラ, 120.98, 14.6]], route: [マカオ, 長崎], note: メキシコの銀はマニラへ。ポルトガル船はマカオと長崎を往復}
      # fact: columbus-57
      - 語り: 日本にも、銀の山がありました。島根県の石見銀山です。1533年、灰吹法という技術が入り、銀の生産が本格化しました。
        figure: null
        card: {head: "1533年", body: 石見銀山に灰吹法}
      # fact: columbus-58
      - 語り: 日本の銀は、世界の3分の1、とよく言われます。けれど、一橋大学の研究班の2017年の論文の推計では、日本の最盛期の1611年から1630年は、年に平均77トン。
      # fact: columbus-58
      - 語り: 同じ論文で、今のボリビアの銀山は、1601年から1620年に、年に200トンを超えていました。日本の2倍半を超えます。
        figure: {type: stats, title: 銀の産出（年平均）, items: [[日本（1611〜1630年）, 年77トン, 一橋大学の研究班], [ボリビア（1601〜1620年）, 年200トン超, 同じ論文]], upto: 2}
      # fact: columbus-59
      - 語り: 日本の銀を求めて来た船の一つが、ポルトガルの船でした。島根県の資料によると、広東で80両の中国の白い生糸を、日本では140両から150両で売っています。2倍近い値です。
        figure: null
      # fact: columbus-53, columbus-55
      - 語り: 1543年、種子島に鉄砲が伝わります。1606年に書かれた『鉄炮記』によれば、伝来は天文12年の8月25日。ポルトガル人は、中国の船に乗っていました。
        card: {head: "1543年", body: 種子島に鉄砲}
      # fact: columbus-55
      - 語り: ポルトガル側の記録では、彼らはタイから中国の寧波へ向かう途中、嵐で流されて日本に着いています。アフリカとインドを回る道で、アジアに来ていた人々です。
      # fact: columbus-60
      - 語り: 1609年9月、メキシコへ向かうスペインの船、サン・フランシスコ号が、千葉県の御宿の沖で座礁しました。373人のうち、317人が村人に助けられています。
      # fact: columbus-60
      - 語り: 船の一行に会った徳川家康は、メキシコから、銀を取り出す技術者を送ってほしい、と伝えました。
      # fact: columbus-61
      - 語り: 1613年、伊達政宗の使節、支倉常長は、太平洋を渡り、翌年1月にメキシコのアカプルコへ上陸します。ヨーロッパへの道は、アメリカを通っていました。
        portrait: {image: paintings/masamune_hasekura_portrait.jpg, caption: "支倉常長像（1615年、仙台市博物館蔵・国宝）"}
      - 語り: もしもの世界に戻ります。種子島の鉄砲は、アメリカとは別の道で来ているので、来た、と考えられます。日本の銀と中国の生糸の商売も、同じです。
      - 語り: 変わったかもしれないのは、メキシコと日本をつなぐ太平洋の道です。最初にアメリカを押さえた国が違えば、御宿の船も、支倉の旅も、別の形になりえました。
        tone: しみじみ
      - 語り: けれど、海を渡ったのは、作物と銀だけではありませんでした。
        hook: true
      - 語り: 目に見えないものが、いちばん多くの命を変えました。
        hook: true

  # ================================================================ 第7章 疫病と砂糖
  - title: 「疫病と砂糖は、何を変えたのか」　1492年から1600年 カリブ海・メキシコ
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    lines:
      # fact: columbus-41
      - 語り: 1492年より前のアメリカ大陸に、何人が暮らしていたのか。研究者の見積りは、約800万から、1億1000万を超える数まで、10倍以上も割れています。
      # fact: columbus-42
      - 語り: コロンブスが最初の航海で訪れたイスパニョーラ島でも、記録と研究が食い違います。
        tone: 疑問
      # fact: columbus-42
      - 語り: ラス・カサスは、1552年の本で、300万を超える人がいた、と書きました。今の研究者の見積りは、6万から800万まで割れています。
        figure: {type: stats, title: イスパニョーラ島の1492年の人口, items: [[ラス・カサス（1552年）, 300万超], [今の研究者の見積り, 6万〜800万]], upto: 2}
      # fact: columbus-43
      - 語り: 2019年、ロンドン大学のコッホらは、ヨーロッパから来た病気などで、アメリカ大陸の人口の約9割が失われた、と計算しました。
        figure: null
        tone: 重い
      # fact: columbus-43
      - 語り: 人のいなくなった畑は、森に戻ります。その広さは5580万ヘクタール。日本の国土のおよそ1.5倍です。森が吸った炭素で、地球の大気の二酸化炭素まで、わずかに下がった、と研究者たちは見ています。
      # fact: columbus-80
      - 語り: メキシコでは、16世紀の修道士サアグンがまとめた『フィレンツェ写本』が、天然痘は、ちょうど60日続いて収まった、と書いています。
      # fact: columbus-17
      - 語り: もう一つ、コロンブス自身が運んだものがあります。サトウキビです。1494年1月、2度目の航海の覚え書きに、少しだけ植えたサトウキビが根付いた、と書きました。
        card: {head: "1494年1月", body: サトウキビが根付く}
      # fact: columbus-79
      - 語り: 砂糖の畑などで働かされたのは、アフリカから連れてこられた人々でした。大西洋の奴隷貿易で船に乗せられた人は、推計で1250万人。生きて上陸したのは、1070万人です。
        tone: 重い
      # fact: columbus-50
      - 語り: 歴史家のケネス・ポメランツは、18世紀の中国の長江の下流は、イギリスと同じくらい経済が栄えていた、と見ます。どちらも、燃料と土地が足りなくなる行き詰まりに近づいていました。
      # fact: columbus-50
      - 語り: 同じ行き詰まりから、イギリスだけが抜け出せたのは、石炭と、アメリカの植民地のおかげだった。アメリカの土地が、イギリスの土地を使わずに、その経済を支えたのです。ポメランツは、これを、幽霊の土地という言葉で表しています。
      - 語り: もしもの話に戻ります。1492年に引き返していても、ヨーロッパの船が通うようになれば、病気も、いずれ海を渡ったと考えられます。
      - 語り: 一点を変えても、ヨーロッパの船が来るかぎり、この悲劇が消えたとは言えません。
        tone: しみじみ
      - 語り: 一方で、つながりが遅れ、アメリカの土地が別の国のものになっていたら。産業革命の形も、変わっていたかもしれません。ここから先は、記録からは言えません。
        tone: しみじみ
      - 語り: そして、アメリカの作物は、遠く日本の畑にも届いていました。
        hook: true
      - 語り: その伝わり方は、日本と朝鮮で、記録が逆になっています。
        hook: true

  # ================================================================ 第8章 分岐2 日本の畑
  - title: 「分岐2 日本の畑は、どう変わったのか」　1542年から1735年
    background: {image: paintings/nobunaga_teppo_sakai_gunsmith.jpg, credit: "『和泉名所図会』堺の鉄砲鍛冶（1796年）"}
    lines:
      # fact: columbus-66
      - 語り: まず、唐辛子です。朝鮮の学者、イ・スグァンは、1614年の『芝峰類説』に、南蛮の唐辛子は日本から入ったので、倭芥子と呼ぶ、と書きました。
      # fact: columbus-66
      - 語り: ところが、日本には逆に、朝鮮から来た、という記録が残っています。ポルトガル人が伝えた、という記録とともにです。互いに、相手から来たと書いているのです。
        figure: {type: stats, title: 唐辛子は、どちらから来たのか, items: [[朝鮮『芝峰類説』（1614年）, 日本から, 倭芥子], [日本の記録, 朝鮮から, ポルトガル説も]], upto: 2}
      # fact: columbus-62
      - 語り: さつまいもも、何段階にも分かれて来ました。宮古島の記録では1590年代。沖縄本島へは1605年、野国総管が中国の福建から持ち帰ります。
        figure: null
      # fact: columbus-62
      - 語り: 鹿児島で育てた記録の最初は1698年の種子島。よく言われる前田利右衛門は、そのあとの1705年です。青木昆陽が『蕃藷考』を書いたのは、1735年でした。
        figure: {type: table, title: さつまいもが日本に来るまで, cols: [年, 出来事], rows: [[宮古島, 1590年代, 中国から芋づる], [沖縄本島, 1605年, 野国総管が福建から], [種子島, 1698年, 鹿児島で育てた最初の記録], [江戸, 1735年, 青木昆陽『蕃藷考』]], upto: 4}
      # fact: columbus-63
      - 語り: 中国のさつまいもは、福建の商人がフィリピンのルソンから持ち帰った話が有名です。けれど、歴史家のホー・ピンティは、それより早い1560年代から70年代の、雲南の地方の記録にあると見ました。
        figure: null
      # fact: columbus-65
      - 語り: 2016年の、チェン・シュオとジェームズ・クンの研究は、1776年から1910年のあいだに、とうもろこしが中国の人口を、19％近く押し上げた、と推計しています。
      # fact: columbus-67
      - 語り: かぼちゃは、16世紀ころ、ポルトガルの船から、豊後の大友宗麟に献じられたのが始まり、という説があります。
      # fact: columbus-68
      - 語り: じゃがいもの伝来は、1600年ごろとも、1601年とも言われ、年が定まっていません。オランダ船がジャカルタから長崎へ運んだ、という話もありますが、オランダの船が初めて日本に着いたのは1600年、商館が平戸にできたのは1609年で、年は合いにくいのです。
      # fact: columbus-89
      - 語り: たばこも、アメリカの作物です。国立国会図書館の展示によると、1607年の記録に、このごろたばこがはやる、南蛮から渡ったもの、とあります。
      - 語り: では、もしもの世界で、日本の畑は、どうなったのでしょうか。
        tone: 疑問
      - 語り: 唐辛子、さつまいも、かぼちゃ、たばこは、どれもアメリカの作物です。アメリカとつながらないかぎり、日本には来ません。
      - 語り: けれど、ヨーロッパの船が8年ほど遅れて着くだけなら、ポルトガルやスペインの船、中国の商人の手で、やはり届いたでしょう。届いた年が少し遅れ、通った道が違ったかもしれない。言えるのは、そこまでです。
        figure: {type: table, title: もしも1492年に引き返していたら、日本は（推論）, cols: [史実, もしも], rows: [[鉄砲, 1543年 種子島, 来た, 高い], [南蛮の銀と生糸, ポルトガル船, 続いた, 高い], [唐辛子・さつまいも, 16〜17世紀, 少し遅れて来た, ありうる], [太平洋の道, マニラとメキシコ, 別の形, 言い切れない]], upto: 4, note: もしもは推論。右の札は見込みの高さ}
      - 語り: では、コロンブスの航海は、世界の何を変えたのでしょうか。
        figure: null
        hook: true
      - 語り: 最後に、キューバを日本だと思った、あの日誌に戻ります。
        hook: true

  # ================================================================ まとめ
  - title: まとめ：もしもアメリカにたどり着かなかったら
    background: {image: paintings/kanbei_japan_map_portuguese.jpg, credit: "ル・ブトゥー《日本の王国と地方の新しい正確な記述》17世紀"}
    lines:
      - 語り: もしも1492年10月10日に、船団が東へ戻っていたら。ヨーロッパの船がアメリカの陸を見るのは、カブラルの1500年ごろまで、8年ほど遅れるだけだったかもしれません。
      - 語り: 変わるのは、何が届くかより、誰が運ぶかだったでしょう。作物も、銀も、病気も、いずれは海を渡ったでしょう。けれど、最初に着く国が違えば、マニラの銀の道も、支倉の旅も、別の形になりえたのです。
      # fact: columbus-55
      - 語り: 日本の鉄砲は、アメリカとは別の道で来ていました。唐辛子とさつまいもは、少し遅れて、やはり届いたでしょう。
      - 語り: 本当の距離は、コロンブスの見積りの4倍あまり。途中に陸が無ければ、とても届かない距離でした。
        tone: しみじみ
      # fact: columbus-88
      - 語り: キューバを日本だと書いたあの男は、1506年に亡くなるまで、自分がどこに着いたのかを知りませんでした。
        tone: しみじみ
      - 語り: 日本を目指した計算違いの航海が、遠い日本の畑に、唐辛子とさつまいもを届ける道を開いたのです。
        tone: しみじみ
        pause: 0.8
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
