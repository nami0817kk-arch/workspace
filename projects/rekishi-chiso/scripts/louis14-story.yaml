# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  「暦と時計があれば、300里離れていても、王がいま何をしているか言い当てられる」。ルイ14世の宮廷で24年を過ごしたサン=シモン公爵は、そう書きました。
  サン=シモンによれば、朝8時、王の寝室に、客としていちばん先に入るのは、医者でした。起きてから寝るまで、王の1日は、本当に全部が人に見られていたのでしょうか。
  この動画でわかること
  ・起床の儀で、部屋に入れる人が段階に分けられていたこと
  ・昼の「小さな食事」で、座れたのは誰か
  ・王の医師が書いた『王の健康日誌』の、ある1日の体の様子
  ・夜10時の大食卓と、燭台を持つ栄誉
  ・記録どうしの食い違いと、後年の文章の誇張
description_note: |-
  ルイ14世の1日は、サン=シモン『回想録』（Chéruel 版、Boislisle 版の注）と『三人の初代ブルボン王の比較』、ダンジョー侯爵の日記、『王の健康日誌』（Le Roi 編、1862年）、リーゼロッテ（王の弟の妃）の手紙（フランス語訳）、『Etat de la France』1674年版、ヴェルサイユ城研究センターのダ・ヴィニャ（2011年）・ガロ（2008年）の論文などをもとにしています。
  サン=シモンは王の死の30年ほどあとに日課の節を書いています。時刻は記録によって食い違うので、動画のなかでは出どころごとに分けて言っています。
  「8時半起床・13時昼食・22時夕食・23時就寝」の時刻表は、研究者が1701年以降の平均の1日として組み立てたもので、同時代に印刷された表ではありません。
  足し算・掛け算（皿の数、下剤の回数の目安、焼きごての回数など）は動画のなかの計算です。
  画面の室内・人物・風景の画像の一部は、画像生成AIで作った想像上のイメージで、実在の写真や肖像ではありません。サムネイルの人物像も AI による想像図です。

en:
  title: "Was Louis XIV Watched All Day? His Day From the 8 a.m. Lever to Bedtime, in the Records"
  description: |-
    "With an almanac and a watch, you could say from three hundred leagues away what the king was doing." So wrote Saint-Simon, who spent twenty-four years at Louis XIV's court.
    According to Saint-Simon, at eight in the morning the first visitors to enter the king's bedchamber were his doctors. From waking to sleeping, was the king's whole day really on display?
    In this video you will learn:
    - How the lever let people into the room in stages
    - Who could sit at the king's small midday meal
    - One day recorded hour by hour in the king's health journal
    - The 10 p.m. grand couvert and the honor of holding the candlestick
    - Where the records disagree, and where later writers exaggerated
    Japanese-language history video (Japanese audio).
  chapters:
    - "\"Almanac and Watch\": A Day Fixed to the Minute?"
    - "8 a.m.: The First to Enter Were the Doctors"
    - "Morning: Dressing, Orders for the Day, Mass and Council"
    - "1 p.m.: A Meal Where Only the King Sat"
    - "The Doctors' Journal: The Other Side of the Day"
    - "10 p.m.: The Grand Couvert and the Watchers"
    - "Bedtime: Who Holds the Candlestick?"
    - "In the King's Own Words"
    - "Summary: A Day on Display"

