# 物語型の本編（scripts/_template_story.yaml・inou-story.yaml の型）。ルイ14世の1日（暮らしの回・世界史）。2026-11-12 下書き。公開の予定は 11/15 19:00。
# 型：docs/story-main.md の E 暮らし型。主語はルイ14世ひとり。
#   誰でも持つ像＝「太陽王は、豪華な宮殿で、一日じゅう大勢に見られて暮らした」。裏返す像＝見られたのは確かだが、入れる人は段階で絞られ、
#   見られない入口・時間もあり、晩年は夜の儀礼をやめ、「暦と時計で言い当てられる」という書き方自体が後年の誇張を含む。
#   問いは「どうしてた」。「なぜ」は字に出さない。語りは剣崎1人。想像の台詞なし。ネットの声なし。
#   既出の「ヴェルサイユの作法が厳しすぎる｜寒さに震えて待った王」（スペイン王の話）とは重ねない。1日の通しを時刻・数・記録の食い違いで追う。
#   題名は答えを明かさない（「見られていた？」の問いだけ。段階・裏の入口・大就寝の廃止は伏せる）。
# 章立て（時刻の順）：序章／第1章 朝8時 起床／第2章 午前 日課とミサ／第3章 昼1時 小さな食事／第4章 医師の日誌／第5章 夜10時 大食卓／第6章 夜 就寝／第7章 王自身は何と書いたか／まとめ。
# 出どころ：サン=シモン『回想録』（Chéruel 版・Boislisle 版の注）と『三人の初代ブルボン王の比較』、ダンジョー侯爵の日記、『王の健康日誌』（Le Roi 編、1862）、
#   パラティーヌ侯爵夫人の手紙（仏訳）、『Etat de la France』1674年版、ヴェルサイユ城研究センターの ダ・ヴィニャ論文（2011）・ガロ論文（2008）・城の教育資料。
#   Agent 3人が WebFetch で原文を開いて集めた（事実カード 72件）。ダンジョー日記は本文を直接開いていない所が一部ある（サン=シモン注の Boislisle 経由）。
# 照合しにくい所（報告に書く）：「暦と時計」の一節は回想録ではなく『比較』の87頁（綴りは almanac）／「陛下、お時間です」と起床8時半ごろは Boislisle 注が引く 1712年版（原本未見）／
#   乳母の死（1688年10月）は Boislisle 注経由／1705年の大就寝の廃止は Boislisle 注（サン=シモン本文は「死の10〜12年前」）／1702年の燭台の出来事の年は復活祭からの逆算／
#   ダ・ヴィニャの時刻表は研究者が組み立てた平均の1日／パラティーヌ侯爵夫人はフランス語訳（ドイツ語原文は未見）／ヴィスコンティは全文を開けなかったので使わない。
# 計算（自分で計算し直した）：
#   サン=シモンが宮廷に入った年 1691 → 王の死 1715 ＝ 24年。王の死 1715 → 『比較』の着手 1740 ＝ 25年。日課の節の執筆 1745 − 王の死 1715 ＝ 30年、1745 − 生年 1675 ＝ 70歳。
#   乳母の死 1688 ← 宮廷入り 1691 ＝ 3年差（見ていない）。「7分半」＝15分の半分（demi-quart d'heure）。
#   1サービス5〜7皿（Boislisle 注）× 3サービス ＝ 15〜21皿。
#   下剤5週間ごと ＝ 35日 → 365 ÷ 35 ＝ 約10.4回/年。「年に10回ほど」。
#   歯の焼きごて 14回（1月10日）＋3回 ＝ 17回ほど。
#   大就寝の廃止 1705 → 王の死 1715 ＝ 10年（サン=シモン本文は10〜12年前）。
#   城内 約4000人 ＋ 城外 約3000人 ＝ 約7000人（1722年の公式調べ）。1715年の城内 20戸＋189戸 ＝ 209戸。
#   1715年8月25日 → 9月1日（王の死）＝ 7日。
#   1647年：1638年生まれの王は9歳。1686年11月18日は月曜、1710年8月9日は土曜、1685年1月10日は水曜（暦で確かめた）。
