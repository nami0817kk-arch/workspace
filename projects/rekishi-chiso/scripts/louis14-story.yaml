  name: ルイ14世
  lead: 朝8時から夜まで
  main: どうしてた？
  # サムネは別に AI の絵で作り込む（out/louis14-story_thumbnail.png）。この欄は check と仮の thumb のため。

sections:
  # ================================================================ 序章（冒頭 約1分）。答えは最後の章まで言わない
  - title: 「暦と時計があれば、300里先でも言い当てられる」
    background: {image: paintings/louis14_versailles_patel_1668.jpg, credit: "ピエール・パテル《1668年のヴェルサイユ城》（パブリックドメイン）"}
    lines:
      # fact: l14-ss-01
      # fact: l14-ss-03
      - 語り: サン=シモンによれば、朝8時。王の寝室に、客としていちばん先に入ってくるのは、家来でも妃でもなく、医者でした。
        tone: 重い
      # fact: l14-ss-18, l14-ss-01
      - 語り: 太陽王は、起きてから寝るまで、本当に一日じゅう、人に見られていたのでしょうか。
        tone: 疑問
      - 語り: 宮廷で24年を過ごしたサン=シモン公爵は、こう書きました。暦と時計があれば、300里、1,000キロ以上離れていても、王がいま何をしているか、言い当てられる。
        tone: 重い
        card: {head: "サン=シモン公爵", body: 『三人の初代ブルボン王の比較』}
      # fact: l14-ss-18, l14-ss-01
      - 語り: 王が亡くなって25年ほどあと、1740年に書き始めた、『三人の初代ブルボン王の比較』の一節です。
      - 語り: この1日を、宮廷人の日記と、医者の日誌の時間どおりに、朝から夜まで追います。
      # fact: l14-ss-03
      - 語り: 寝室で寝ていた側近の第一侍従が、王を起こすと同時に、医者の長の第一医師と、外科医の長が、部屋へ入ります。
      # fact: l14-hd-05
      - 語り: ファゴンの日誌には、王が起きしなに、靴をはく前に、用便の椅子へ行った日が、記されています。1704年2月5日です。
      # fact: l14-ss-02
      - 語り: 同じ人の『回想録』には、こうもあります。王が書斎で一人ひとりに日課を命じるので、廷臣は、15分の半分、7分半ほどの誤差で、王の予定が分かった、と。
        hook: true
      - 語り: 朝8時の寝室で、何が起きたのか。順に見ていきます。
        hook: true

  # ================================================================ 第1章 朝8時 起床
  - title: 朝8時　王の部屋に最初に入ったのは医者だった
    background: {image: paintings/louis14_rigaud_1701.jpg, credit: "ヤサント・リゴー《ルイ14世》（1701年。パブリックドメイン）"}
    lines:
      # fact: l14-ss-03
      - 語り: サン=シモンの本によると、起床の儀は、こう始まります。8時、寝室で寝ていた第一侍従が、王を起こす。
      # fact: l14-ss-03
      - 語り: 起こす言葉は、「陛下、お時間です」。この言葉は、20世紀はじめの編者ボワリルが、注に引いた『国家年鑑』にあります。王宮の役職と名簿を毎年のせた本で、1712年版です。
        card: {head: "起こす言葉", body: 「陛下、お時間です」}
      # fact: l14-et-14
      - 語り: 1674年版の『国家年鑑』には、王の身の回りを世話する第一侍従が4人、年に700リーヴル、と載っています。リーヴルは、当時のお金の単位です。寝る所は、王の寝室の床に敷いた寝台です。
      # fact: l14-ss-03, l14-hd-01, l14-hd-03
      - 語り: ところが、記録によって、時間が違います。サン=シモンは、8時。1712年版の『国家年鑑』は、第一侍従が入るのを、8時半ごろとしています。宮廷で日記をつけた侯爵ダンジョーの、1684年のまとめは、起床が8時から9時の間です。
        year: 1684
        figure: {type: stats, title: 起床の時間（記録ごと）, items: [[サン=シモン, 8時, 『回想録』（1745年ごろ執筆）], [国家年鑑1712年版, 8時半ごろ, 第一侍従が入る時間], [ダンジョー1684年, 8〜9時, 日記のまとめ]], upto: 3}
      # fact: l14-hd-03
      - 語り: 子どものころは、もっと早起きでした。1647年、天然痘にかかった9歳の王について、当時の新聞の記事は、起床は朝7時、これがふだんの時刻だ、と書いています。
        figure: null
        year: 1647
      # fact: l14-ss-04
      - 語り: サン=シモンは、この朝の場面に、乳母が入って王に口づけする、と書きます。ただし原文は、乳母が生きているあいだは、と断っています。
      - 語り: 乳母が亡くなったのは、ボワリルの注によれば1688年。サン=シモンが宮廷に入ったのは、1691年10月です。本人が見た場面ではなく、伝え聞いた習慣です。
        tone: 重い
      # fact: l14-et-01, l14-et-02
      - 語り: 王の部屋に入れる人は、段階に分かれていました。医者のあとで、最初に入る人々が、大入室です。王が寝台にいるうちに入れる、特権でした。大侍従長、第一侍従貴族の4人、王の庶子など、ごく少数です。
      # fact: l14-et-02
      - 語り: サン=シモンは、役職のない人がこれを持つのは、ごく稀で、大きな恩賞か寵愛のしるしだった、と書きます。
      # fact: l14-et-04, l14-et-05
      - 語り: そのあと、王の秘書や読み役が続き、最後に大勢が入ります。ヴェルサイユ城研究センターのダ・ヴィニャは、このとき部屋に、100人を超える、と書きます。数え方の根拠は、示されていません。
      # fact: l14-et-05
      - 語り: 研究者のガロは、別の数え方をしました。1687年の名簿から、王がまだ寝台にいる段階だけで、40人を超える、という控えめな数です。
        tone: 疑問
      # fact: l14-et-17
      - 語り: 宮廷全体の数も、残っています。ルイ14世の死の7年後、1722年の最初の公式な調べでは、王から宿を割り当てられうる人が、約7,000人。そのうち約4,000人が、城の敷地の中でした。
      # fact: l14-et-17
      - 語り: ヴェルサイユ城は、この数はルイ14世のころと大差ないはずだ、と説明しています。起床の場にいた人数ではなく、宮廷に住めた人の数です。
      # fact: l14-ss-06, l14-hd-05
      - 語り: 王は、寝ている間に、汗をかく体質でした。起きるとき、医師などが体を拭き、シャツをよく替えた、とサン=シモンは書きます。ファゴンの日誌も、1700年ごろから、朝、下着が湿っていれば替えた、と書いています。
      # fact: l14-hd-24
      - 語り: 王が用を足しながら人に会った、という話を、聞いたことがあるかもしれません。出どころとして知られるのは、まず、王に仕えた高官ブリエンヌ伯の回想録の、一句です。1661年ごろの場面を、のちに書いたもので、ブリエンヌ自身が、王が用便椅子に座っているときも、衣装部屋に入っていた、と。
      # fact: l14-hd-24, l14-et-20
      - 語り: ブリエンヌは、謁見を受けた、とは書いていません。城の資料も、王はもう椅子の上では人を受けず、人目につかない場所を設けた、と説明しています。
      # fact: l14-hd-22
      - 語り: 起きてすぐの飲み物も、記録にあります。ファゴンは1696年、朝の氷水と酒が胃を酸っぱくするので、コーヒーを勧め、それが効いた、と書きます。
        hook: true
      - 語り: 着替えが終われば、王は、寝台のそばで祈ります。そのあと王が移る書斎には、入れる人が、さらに少なくなります。
        hook: true

  # ================================================================ 第2章 午前
  - title: 午前9時から　着替え、日課の命令、ミサと会議
    background: {image: paintings/louis14_versailles_patel_1668.jpg, credit: "ピエール・パテル《1668年のヴェルサイユ城》（パブリックドメイン）"}
    lines:
      # fact: l14-ss-05
      - 語り: 王は、着替えの大部分を、自分でやりました。ひげは、1日おきに、人前で剃ります。かつらは短いもので、化粧台はなく、鏡を持たせるだけだった、とサン=シモンは書きます。
      # fact: l14-ss-05
      - 語り: ただし、いつも同じではありません。ボワリルの注によると、1705年には、半年だけ、ひげを剃るのをやめています。
      # fact: l14-ss-07
      - 語り: 祈りは、寝台のそばで、聖職者はひざまずき、ほかの人は立ったまま。枢機卿だけが、クッションなしで、ひざまずきました。
      # fact: l14-ss-07, l14-ss-02
      - 語り: それから、王は書斎へ移ります。残るのは、庶子たちなど、ごく限られた人。ほかの人は、廊下で待ちます。ここで、その日の命令が出されました。
      # fact: l14-ss-17
      - 語り: ところが、編者のボワリルは、別の箇所の注で、こう指摘します。サン=シモンは、日課の規則正しさを、大げさに書いている。実際はもっと変化があり、動かなかったのは、会議の時間だけだ、と。
        tone: 重い
      # fact: l14-hd-01
      - 語り: 同じ1684年のまとめで、ダンジョーは、王が身支度のあと、大臣たちと12時半まで部屋にこもり、そのあと音楽つきのミサへ出る、と書いています。
        year: 1684
      # fact: l14-hd-02
      - 語り: ダンジョーの1684年のまとめでは、会議は曜日で決まっていました。日曜は国務会議、火曜と土曜は財務会議。金曜は「良心会議」で、大司教、次いで、告解を聞く神父の聴罪司祭と、個別に話します。
        card: {head: "1684年の会議", body: 日曜 国務／火・土 財務／金 良心}
      # fact: l14-hd-02
      - 語り: 午後には、海軍の担当大臣が、王とふたりだけで会議をし、軍の担当大臣が、軍隊と要塞と建築を報告しました。
      - 語り: 会議の曜日が決まっていた、というのは、ダンジョーの1684年の記録です。ミサの時間も、時代で動き、晩年は9時から10時、1684年は昼すぎでした。けれど、昼になると、見られ方が変わります。
        tone: 疑問
        hook: true
      - 語り: 昼の食卓に、座れる人は、誰だったのでしょうか。
        hook: true

  # ================================================================ 第3章 昼の食事
  - title: 昼1時　食卓に座れるのは王だけだった
    background: {image: paintings/louis14_rigaud_1701.jpg, credit: "ヤサント・リゴー《ルイ14世》（1701年。パブリックドメイン）"}
    lines:
      # fact: l14-ss-08
      - 語り: サン=シモンが描く晩年の昼食は、ふつう13時。寝室の四角い食卓で、座って食べるのは王ひとり。主な廷臣が入り、顔の知れた人も入って、それを見ていました。「小さな食事」と呼ばれた食事です。
      # fact: l14-ss-08
      - 語り: 名前は小さくても、いちばん簡素な日でも、料理は3回に分けて出されました。果物は別です。
      # fact: l14-ss-08
      - 語り: サン=シモンの本文は、たくさんの皿、としか書きません。ボワリルの注によれば、1回分が5皿から7皿。3回分を掛けると、15皿から21皿です。
        figure: {type: stats, title: 小さな食事の皿の数, items: [[1回分, 5〜7皿, ボワリルの注], [回数, 3回, サン=シモン], [合計, 15〜21皿, 5×3〜7×3]], upto: 3}
      # fact: l14-ss-09
      - 語り: 食卓に座れるのは、原則として、王だけ。王太子とその息子も、王が勧めない限り、立ったままです。
        figure: null
      # fact: l14-ss-09
      - 語り: 王の弟は、特別でした。王が「弟よ、さあ、お座りなさい」と言うと、背中の後ろに、丸椅子が置かれます。やっと座れるのは、そのときです。
      # fact: l14-ss-16b
      - 語り: 戦場では、もっと厳しい。サン=シモンが現地にいた、1692年のナミュール包囲。名将ヴォーバンでさえ、包囲の終わりになって、初めて、王と同じ食卓につきました。
        year: 1692
      # fact: l14-hd-26
      - 語り: ダンジョーは、1691年10月31日、王が昼に「大食卓」で食べた、と書き、珍しい日だ、と添えています。人に見せる正式な食事が、大食卓です。
      # fact: l14-hd-19
      - 語り: この昼食を見せる習慣は、死の直前まで続きました。1715年8月25日、死の7日前も、ダンジョーは、昼食に人を入れる力が残っていた、と書きます。
        year: 1715
      # fact: l14-et-06
      - 語り: ダ・ヴィニャの平均の1日では、午後は狩りか散歩です。ここで、王の体の記録を開きます。王の医師たちが、日誌に書き続けたものです。
        hook: true
      - 語り: その日誌には、体調の悪かった日の王の1日が、細かく残っています。
        hook: true

  # ================================================================ 第4章 医師の日誌
  - title: 医師が書いた王の体　1710年8月9日の記録
    background: {image: paintings/louis14_versailles_patel_1668.jpg, credit: "ピエール・パテル《1668年のヴェルサイユ城》（パブリックドメイン）"}
    lines:
      # fact: l14-hd-05
      - 語り: 王の医師は、1647年から1711年まで、ヴァロ、ダカン、ファゴンと代わりながら、王の体の様子を日誌に書き続けました。1862年に、ル・ロワが、これを1冊の本にして出しています。
      # fact: l14-hd-06
      - 語り: その中の、1710年8月9日、土曜。ファゴンは、体調の悪かったこの日の王を、細かく記しています。
        year: 1710
      # fact: l14-hd-06
      - 語り: ミサの前に、用便。ミサ、会議。会議から出ると、大量の排便があり、そのまま食卓へ。汗が止まらず、食欲がなく、ポタージュは食べずに、卵2個と桃だけ。
        card: {head: "1710年8月9日（土）", body: ファゴンの日誌}
      # fact: l14-hd-06
      - 語り: 食卓を離れると吐き気がして、汗を拭き、下着を替えて、軍の大臣と執務。そのあと、王の信頼が厚かったマントノン夫人の部屋へ行き、20時と22時に、また用便。それから、就寝。
      # fact: l14-hd-08
      - 語り: 下剤の記録も残ります。1684年の総括では、4か月から5か月に1回飲むのが習慣でした。それが1696年には5週間から6週間ごと、1702年と1707年には、5週間ごとになります。
      # fact: l14-hd-08
      - 語り: 5週間は35日です。1年を35日で割ると、年に10回ほどです。
      # fact: l14-hd-09
      - 語り: 下剤の日は、排便が9回から14回。1699年1月5日は14回、1704年4月2日は13回と、日誌にあります。
      # fact: l14-hd-10, l14-hd-11
      - 語り: では、「王は生涯で2,000回、浣腸された」という数字は、どこにあるのでしょうか。日誌のどこにも、出てきません。日誌は年ごとの所見で、生涯の総数は、数えられないのです。
        tone: 重い
      # fact: l14-hd-11
      - 語り: 瀉血、つまり血を抜く治療も、ファゴンの時代にはまれでした。1696年に、ファゴンは、王は1693年5月から、ずっと瀉血されていない、と書いています。
      # fact: l14-hd-07
      - 語り: 昼食の前の用便も、習慣でした。1709年3月6日、ファゴンは、いつものとおり椅子に座ったが、痛みがひどく、昼食をやめた、と書いています。
        year: 1709
      # fact: l14-hd-12
      - 語り: 歯の記録もあります。1685年。日誌は、左の上あごの歯が、すでに全部抜かれた状態から書き始めます。抜いたあと、あごの骨に穴があき、水を飲むと、鼻から泉のように流れ出た、と。
        year: 1685
      # fact: l14-hd-12
      - 語り: 治療は、焼きごてです。1月10日に14回、そのあとさらに3回。あわせて17回ほどでした。
      # fact: l14-hd-14
      - 語り: ところが、同じ1月10日について、ダンジョーは、王はミサのあと、公園で銃猟に出た、と書いています。時刻が書かれていないので、両立するのかは、分かりません。
        tone: 疑問
        figure: {type: stats, title: 1685年1月10日（水）の記録, items: [[ダカンの日誌, 焼きごて14回, 医師の記録], [ダンジョーの日記, ミサのあと銃猟, 宮廷人の記録]], upto: 2}
      # fact: l14-hd-16
      - 語り: 1686年11月18日の大手術も、食い違います。時刻を、ダンジョーは朝7時ごろ、立ち会ったダカンは、朝8時ごろと書きました。
        year: 1686
        figure: null
      # fact: l14-hd-16
      - 語り: しかも、ダンジョーは、その日の午後に、王は会議を開き、多くの宮廷人に会った、と書いています。
        hook: true
      - 語り: 夜になると、見られ方は、また変わります。
        hook: true

  # ================================================================ 第5章 夜10時
  - title: 夜10時　大食卓と、見に来る人たち
    background: {image: paintings/louis14_rigaud_1701.jpg, credit: "ヤサント・リゴー《ルイ14世》（1701年。パブリックドメイン）"}
    lines:
      # fact: l14-hd-01
      - 語り: 夜に戻ります。1684年のダンジョーのまとめでは、王はふつう、夕方7時か8時に、マントノン夫人の部屋へ行き、22時の夕食まで過ごしました。
        year: 1684
      # fact: l14-hd-15
      - 語り: 夜の宮廷の遊びも、記録にあります。1685年1月4日は、19時にフランス劇、21時にアパルトマンが開かれ、王は夕食の前後にビリヤードをしました。
        year: 1685
      # fact: l14-hd-15
      - 語り: 1月12日は、21時から大広間で仮面舞踏会。王は少し顔を出して場を盛り上げ、それから0時まで、ビリヤードをしました。
      # fact: l14-ss-10
      - 語り: 夜10時。サン=シモンによれば、夕食はいつも「大食卓」です。給仕長が、マントノン夫人の控室で、お食事の用意ができました、と告げます。その15分後に、王が席に着きます。
        card: {head: "夜10時", body: 大食卓の用意／10時15分に着席}
      # fact: l14-ss-11
      - 語り: 席に着いた王は、座る権利のある貴婦人、つまり王族の女性や公爵夫人が入ってくるたびに、椅子から半分腰を浮かせて挨拶しました。それ以外の女性や、王族の男性には、立ちません。
      # fact: l14-ss-12
      - 語り: 見に来る廷臣は、大勢でした。人数は、サン=シモンも書いていません。マルリーへのお供を望む男は、その日の朝、王に「陛下、マルリーを！」と言って、廊下で名簿に書かせました。
      # fact: l14-hd-20
      - 語り: 王の弟の妃、リーゼロッテは、王の死の3年後、1718年12月5日の手紙に、こう書きました。食べる量が多いのは王だけではなく、夫も、王太子も、ベリー公もそうだった、と。
      # fact: l14-hd-20
      - 語り: 王が、様々なスープを4皿、雉1羽、ヤマウズラ1羽、サラダ、ハム、羊の肉、菓子、さらに果物とゆで卵を平らげるのを、何度も見た、と。
      # fact: l14-hd-20
      - 語り: 「何度も」であって、毎日ではありません。
        tone: 重い
      # fact: l14-hd-21
      - 語り: 医師たちも、書いています。1675年のダカンは、生まれつきの大食。1682年には、狩りの日は、肉の食事を2回にとどめてほしい、と願っています。
      # fact: l14-hd-19
      - 語り: 最晩年の1715年も、ダンジョーは、王は22時に大食卓で夕食をとり、就寝は夜0時、いつもの習慣どおりだった、と書きます。
        year: 1715
      # fact: l14-hd-19
      - 語り: 8月13日からは、夕食を寝室で、人前でとるようになった、と。体が弱っても、見せる食事は、やめませんでした。
        hook: true
      - 語り: では、夜の就寝は、どうだったのでしょうか。
        hook: true

  # ================================================================ 第6章 就寝
  - title: 夜11時ごろ　燭台を持つのは誰か
    background: {image: paintings/louis14_versailles_patel_1668.jpg, credit: "ピエール・パテル《1668年のヴェルサイユ城》（パブリックドメイン）"}
    lines:
      # fact: l14-ss-13
      - 語り: 夕食のあと、王は少し立ったまま、寝台の柵に背を向けて、宮廷に囲まれます。それから書斎へ移り、1時間足らず、子や孫やその配偶者と過ごしました。
      # fact: l14-ss-13
      - 語り: 王と弟は肘掛け椅子。王太子や王族の男は立ち、王女たちは丸椅子でした。ここは、宮廷全体に見せる時間では、ありません。
      # fact: l14-ss-14
      - 語り: 晩年の就寝の儀は、短いものでした。寝台のそばで祈り、服を脱ぎ、会釈で「おやすみ」を言う。暖炉の隅で、護衛連隊長だけに合言葉を伝え、あとは特権のある人々などが残る「小就寝」になります。王が寝台に入ると、全員が部屋を出ました。
      # fact: l14-hd-17
      - 語り: ダンジョーの日記に、この小就寝が、病後に再開する日があります。1686年12月28日。特権のある宮廷人の前で、寝床につき始めた、と。
        year: 1686
      # fact: l14-hd-17
      - 語り: 翌1687年1月2日には、起床と就寝に特権者を入れるが、人数の多い「大起床」「大就寝」は、まだない、と書いています。
      # fact: l14-et-06, l14-et-07, l14-hd-01, l14-hd-19
      - 語り: 就寝の時間も、記録で違います。ダ・ヴィニャの表は、23時。城の英語の公式ページは、23時30分。ダンジョーは、1684年は小就寝が0時半、遅くても1時に終わった、1715年は就寝が0時、と書きます。
        figure: {type: stats, title: 就寝の時間（出どころごと）, items: [[ダ・ヴィニャの時刻表, 23時, 研究者の組み立て], [ダンジョー1684年, 0時半〜1時, 小就寝の終わり], [ダンジョー1715年, 0時, 最晩年]], upto: 3}
      # fact: l14-et-15, l14-ss-15
      - 語り: サン=シモンによれば、就寝の儀には、燭台を持つ栄誉がありました。祈りのあと、王が廷臣を、声に出して指名します。指名された人は、手袋を外して燭台を受け取り、就寝が終わるまで持っていました。
        figure: null
      # fact: l14-et-15
      - 語り: 燭台を持たせる決まりそのものは、1674年版の『国家年鑑』に、すでに印刷されています。ただし、そこでは、部屋にいる最も位の高い貴人に持たせる、とあり、王が指名する、というサン=シモンの書き方とは、少し違います。
      # fact: l14-ss-15, l14-ss-16
      - 語り: サン=シモンは、この栄誉を、何度も受けました。書き残す例の一つが、1702年です。軍務を辞めて、王の不興を買った直後に、王は、不機嫌を気づかれまいとして、サン=シモンを指名した、と本人は書きます。
        year: 1702
      # fact: l14-ss-16
      - 語り: 王の気持ちは、サン=シモン本人の受け取り方です。
        tone: 重い
      # fact: l14-et-08, l14-ss-14
      - 語り: ところが、晩年の王は、宮廷全体が見る「大就寝」を、やめていました。サン=シモンは、死の10年から12年前から、就寝には、入る権利のある者しか残らなくなった、と書きます。編者のボワリルは、これを1705年と注記しています。
        tone: 重い
      # fact: l14-et-08
      - 語り: 1705年から王の死の1715年まで、10年です。夜11時に、毎晩、宮廷じゅうが王の寝支度を見守った、という姿は、晩年には、あてはまりません。
      # fact: l14-et-19
      - 語り: 見られない入口も、ありました。サン=シモンによれば、「裏の入口」の人は、小さな裏階段や、書斎の裏口から、人目につかずに、王の書斎に入れました。会議と、大臣との特別な執務のとき以外は、いつでもです。
      # fact: l14-et-09, l14-et-10
      - 語り: 寝室そのものも、動いています。ガロによれば、1684年までは、王の寝室は2つ。私的な部屋と、宮廷に見せる部屋です。1684年から1つになり、1701年に、宮殿の中央の部屋へ移して、完成します。
        year: 1701
      # fact: l14-et-09
      - 語り: 理由を、ダ・ヴィニャは、起床のあいだに場所を変えるのに飽きたから、と書きます。ガロは、増えた人数と、広くて窓の多い部屋だったことを、可能性として挙げ、断定はしていません。
        hook: true
      - 語り: 見せることを、王自身は、どう考えていたのでしょうか。
        hook: true

  # ================================================================ 第7章 王自身
  - title: 「人びとは見せ物を好む」　王自身の言葉と、書き手の癖
    background: {image: paintings/louis14_rigaud_1701.jpg, credit: "ヤサント・リゴー《ルイ14世》（1701年。パブリックドメイン）"}
    lines:
      # fact: l14-et-11
      - 語り: 王の名で残る『王太子への教え』に、こうあります。側近が下書きした部分を含む文書です。見られないことが王の威厳だという国もあるが、フランスは、臣民が君主に自由に近づける、と。研究者のガロが引く一節です。
        card: {head: "『王太子への教え』", body: 臣民が君主に自由に近づける}
      # fact: l14-et-12
      - 語り: 同じ『王太子への教え』の、1662年の部分に、こういう一節もあります。人びとは見せ物を好み、私たちが彼らの好むものを好むと見て、喜ぶ。そうして私たちは、彼らの精神と心をつかむ。
      # fact: l14-et-12
      - 語り: ただし、これは、馬上の華やかな見世物、カルーゼルなど、宮廷の祝宴を人々に見せる理由の説明です。起床や就寝のことを、語った文ではありません。
        tone: 重い
      # fact: l14-ss-18, l14-ss-19
      - 語り: では、「暦と時計」の一節を書いたサン=シモンは、どんな書き手だったのでしょうか。宮廷に入ったのは1691年。日課の部分を書いたのは、1745年。王の死から30年後、70歳のときです。
        year: 1745
      # fact: l14-ss-19
      - 語り: 同じ時期の文で、サン=シモンは、ルイ14世を「平均以下の知性」と書き、宮廷の仕組みを「専制政治の策略」と呼びます。日課の部分の前には、情熱なしで書く、と断っています。
      # fact: l14-ss-17
      - 語り: 編者のボワリルは、時刻の規則正しさは誇張だ、と注をつける一方で、証人としての細かい正確さは、争えない、とも評価します。
      # fact: l14-ss-01
      - 語り: この一節は、『三人の初代ブルボン王の比較』の87頁にあります。『回想録』の日課の部分には、同じ言葉は出てきません。
        tone: 重い
      # fact: l14-et-06
      - 語り: ダ・ヴィニャが組み立てた、1701年以降の平均の1日は、こうです。8時半に起床、10時にミサ、13時に小さな食事、22時に大食卓、23時に就寝。
        figure: {type: stats, title: 研究者が組み立てた平均の1日（1701年以降）, items: [[起床, 8時30分, ダ・ヴィニャ], [昼食, 13時, 小さな食事], [夕食, 22時, 大食卓]], upto: 3}
        hook: true
      # fact: l14-et-06
      - 語り: 同時代の表ではなく、研究者が、記録をもとに組み立てた表です。ここまで見たとおり、日によって、時代によって、動きます。
        figure: null
        hook: true

  # ================================================================ まとめ
  - title: まとめ　見せ物の1日と、見せなかった時間
    background: {image: paintings/louis14_versailles_patel_1668.jpg, credit: "ピエール・パテル《1668年のヴェルサイユ城》（パブリックドメイン）"}
    lines:
      - 語り: 答えは、見られていた。けれど、一日じゅうではありませんでした。
      - 語り: 朝は、医師と侍従が入り、段階ごとに部屋に人が増えます。寝台の段階で40人を超え、最後は100人を超える、と研究者は数えます。昼は、座れるのは原則として王だけの、小さな食事。夜は、10時の大食卓です。
      - 語り: けれど、全部が見せ物ではありません。書斎の1時間は、ほぼ家族だけ。夕方には、マントノン夫人の部屋で過ごす時間がありました。裏の入口を使う人もいました。
      - 語り: 晩年の王は、宮廷じゅうが見る大就寝を、やめています。就寝の時間も、記録によって、23時から1時ごろまで、ばらつきます。
      - 語り: そして、「暦と時計で言い当てられる」という言葉も、書き手の事情と、編者の注によって、割り引かれます。書いたのは王の死の25年後。批判的な立場で書かれ、編者は、動かなかったのは会議の時間だけだ、と注記しています。
        tone: しみじみ
      - 語り: 見せる1日と、見せない時間。その境目は、場面と時代によって、動いていました。
        tone: しみじみ
      - 語り: 朝8時、最初に部屋へ入った医者は、王の体の1日を、日誌に書き残しました。見られた王の姿を残したのは、いちばん近くで見ていた人たちでした。
        tone: しみじみ
      - 語り: ご視聴、ありがとうございました。
      - 語り: チャンネル登録も、よろしくお願いします。
