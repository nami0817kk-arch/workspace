    background:
      image: paintings/shingen_kai_fuji_hiroshige_1852.jpg
      credit: 歌川広重《不二三十六景 甲斐 夢山裏富士》1852年
  - 語り: 「公家かぶれの無能な大名」という義元の像は、いまは見直されています。お歯黒や化粧の話は、後世の書に出るもので、確かではありません。内政も軍事も力のある大名だった、という再評価です。
