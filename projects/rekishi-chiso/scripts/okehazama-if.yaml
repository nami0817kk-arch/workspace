    card:
      head: 1554年
      body: 甲相駿三国同盟
  - 語り: 義元の娘は武田義信へ、信玄の娘は北条氏政へ、氏康の娘は氏真へ。今川の狙いは、東と西に敵を持たず、争う相手を織田に絞ること、とされます。
