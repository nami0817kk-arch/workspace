# B（歴史の転換点の if ストーリー）。型：事実（桶狭間の戦い・兵数の諸説・奇襲説と正面攻撃説・義元の目的・戦後の今川と元康）→ 史料に残る別の道 → 「こうなった可能性」（理由つき）。
# 仮定はひとつだけ：永禄3年5月19日、信長の突入が義元に届かず、義元は討たれなかった（どう討たれなかったかは決めない。戦の描写もしない）。
# 事実の出どころは dev/output/rekishi-chiso/research/okehazama_if_facts.md（確実／有力／説／後世の話の区分もそこ）。絵の一覧は okehazama_if_assets.md。
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①〜④）だけ ②字幕に「（想像）」（roles の義元想像・朝比奈想像・信長想像・柴田想像・元康想像・忠次想像・氏真想像）③記録のセリフは本編に置かない
#   同じ幕で声が重ならない：第1幕＝義元（麒ヶ島宗麟）と朝比奈（雀松朱司）／第2幕＝信長（青山龍星）と柴田（黒沢冴白）／第3幕＝元康（白上虎太郎）と忠次（離途）／第4幕＝義元（麒ヶ島宗麟）と氏真（玄野武宏）。
#   幕割り：想像①＝第1幕（5/19夕・桶狭間山）／想像②＝第2幕（5/20・尾張の清洲）／想像③＝第3幕（5/19夜・大高城）／想像④＝第4幕（永禄3年夏・駿府）。
#   出てくる人が実際にその場にいたかも想像（柴田勝家・酒井忠次・朝比奈泰朝）。第1幕の頭で断る。
# 想像の部分は言い切る。確かさは画面の札（ありうる／ほぼ妄想）と運命表で出す。声に出すのは「ほぼ妄想」を中心に、言い回しは変える。
# 冒頭の強い一点：『信長公記』の今川軍4万5千・信長軍2千未満という数字を、いまの研究は信じていない（2万5千の通説・渡邊大門の試算約1万2千）。
#   3つの問い：今川は？（答え＝三河を保つ・5字）／信長は？（答え＝美濃が遠のく・6字）／家康は？（答え＝1560年は戻れない）。まとめの stats・運命表・サムネの伏せ字（今川は5＝三河を保つ・信長は6＝美濃が遠のく）を一致させる。家康は7字で札と重なるのでサムネでは「家康は？」の札にする。
# 数字は「何の数か」を言う（4万5千＝『信長公記』、2万5千＝参謀本部、約1万2千＝渡邊大門の試算。損害は書物ごと）。日付は和暦の月日、西暦は「一般に1560年6月12日とされる」。
#   年齢は数え：義元42（1519生）・信長27・元康19・氏真23（1538生）。
# 使わない話：奇襲・迂回を事実として／簗田政綱の勲功第一を事実として／毛利の指を噛み切った話を事実として／「捨城ならば拾はん」を元康の言葉として／義元の首・遺体・流血の描写／
#   「義元が生きていれば今川は滅びなかった」「家康・信長は天下を取れなかった」の断定／善徳寺の会盟／黒田基樹を桶狭間の論者として（出どころでは黒田日出男）。
# 研究：「義元が討たれなかったら」を正面から論じた研究は見つからない（冒頭と運命表で断る）。論じられているのは奇襲説の見直し（藤本正行・渡邊大門）・義元の目的（高柳光壽・小和田哲男・久保田昌希・大石泰史・小林正信）・兵数（太田満明・橋場日月・渡邊大門）。
#   本文は未読（Wikipedia と一般向け記事経由）と冒頭で断る。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像は額）／極端に横長の絵は使わない（桶狭間の三連絵2枚は額だけ）／後世の絵（名所図会・錦絵・国絵図）は語りで断る／現代の写真は今回は使っていない。
title: もし桶狭間で今川義元が討たれなかったら｜今川は三河を保てたか、信長と家康はどうなったか、そのあとどうなったか
