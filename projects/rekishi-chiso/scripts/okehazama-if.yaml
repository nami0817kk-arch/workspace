    image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg
    credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
  year: 1560
  lines:
  - 語り: 想像劇場、第4幕です。永禄3年の夏、駿府。義元と、氏真が、向き合います。
    portrait: null
    card:
      head: ここから想像
      body: 第4幕 永禄3年夏 駿府
  - 人物: 「尾張では、勝ち切れなんだ。だが、三河は、守れておる」
    who: 義元想像
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 人物: 「父上、北条の氏康殿から、援軍をと、文が参っております」
    background:
      image: paintings/shingen_odawara_sakawa_hiroshige.jpg
      credit: 歌川広重《東海道五拾三次之内 小田原 酒匂川》1833年ごろ
    who: 氏真想像
    portrait: null
  - 人物: 「三国同盟は、わしの代に結んだ。西を向くために、東を安んじたのだ。援軍は、送れ」
    who: 義元想像
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 人物: 「承知いたしました。尾張は、いかがいたしましょう」
    who: 氏真想像
    portrait: null
  - 人物: 「続ける。ただし、焦るな。年をまたいで、兵を整えよ」
    who: 義元想像
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 人物: 「甲斐からは、義信殿のご様子を知らせる文が参りました。お変わりないと」
    background:
      image: paintings/shingen_kai_fuji_hiroshige_1852.jpg
      credit: 歌川広重《不二三十六景 甲斐 夢山裏富士》1852年
    who: 氏真想像
    portrait: null
  - 人物: 「娘が嫁した家だ。西を向く間、東は静かでなければならぬ」
    who: 義元想像
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 聞き: 義元が生きてると、氏真は、父の下で実務を続けるのか。
    portrait: null
  - 語り: 史実を1つ挟みます。氏真は、1558年ごろから文書を出し、そのころ家督を譲られた、とするのが研究上の見解です。ここでは、義元が実権を保ち、氏真が支える形を、思い描きます。
    background:
      image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
    card:
      head: 史実を1つ
      body: 氏真は1558年ごろ家督を譲られた
  - 語り: 同盟の結び目は、結婚です。義元の娘は、武田義信の妻でした。
  - 語り: 義元が生きていれば、この糸は切れにくく、三国同盟も、当面は保たれる、と見ます。氏真の代で重臣や国衆が揺れたのは、義元の死のあとの動きだからです。
    background:
      image: paintings/shingen_odawara_sakawa_hiroshige.jpg
      credit: 歌川広重《東海道五拾三次之内 小田原 酒匂川》1833年ごろ
    card:
      head: ありうる
      body: 義元が実権を保ち同盟は当面保たれる
  - 語り: 1568年に武田が駿河へ入った流れが、義元の代でも起きたのか。今川が、いつまで続くのか。答えは、材料の外にあります。
    background:
      image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
    card:
      head: ほぼ妄想
      body: 今川の滅ぶ日は材料なし
  - 聞き: 滅びた日を知ってると、生きてても結局、って思っちゃうけど、材料はないよね。
    background:
      image: paintings/shingen_kai_fuji_hiroshige_1852.jpg
      credit: 歌川広重《不二三十六景 甲斐 夢山裏富士》1852年
  - 語り: では、ここまでの想像を、一枚の表にまとめます。
    hook: true
  - 聞き: 誰がどうなるのか、一覧で見たい。
    hook: true
- title: 想像⑤ 義元が討たれなかった世界の運命表
  background:
    image: paintings/mikata_totomi_kuniezu_1838.jpg
    credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
  year: 1560
  lines:
  - 語り: ここが、今日いちばんの見どころです。前提は、ひとつ。史実の義元は、桶狭間で討たれました。もしも、討たれなかったら。あの人たちは、どうなるのか。
    portrait: null
    card:
      head: ここから想像
      body: 人物と流れの運命表
  - 聞き: 誰がどうなるのか、一覧で見られるの？ この表も、研究はあるのかな。
    tone: 疑問
  - 語り: この表を正面から論じた研究も、今回の調査では、見つかっていません。材料は、これまで見た事実だけです。札は画面に出します。声に出すのは、ほぼ妄想の所だけです。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
  - 語り: 1つ目は、今川の三河です。史実では、元康の離反で、揺れました。もしもは、三河を保ちます。
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: &id002
      - - 今川の三河
        - 元康の離反で揺れた
        - 三河を保つ
        - ありうる
      - - 松平元康
        - 1560年に岡崎へ入る
        - 1560年は戻れない
        - ありうる
      - - 織田信長
        - 尾張を固め美濃へ
        - 美濃が遠のく
        - ありうる
      - - 三国同盟
        - 1567〜68年に崩れる
        - 当面は続く
        - ありうる
      - - 清洲同盟
        - 1562年ごろ 信長と元康
        - 結ばれたか不明
        - ほぼ妄想
      - - 信長の上洛
        - 1568年
        - 時期は変わるか不明
        - ほぼ妄想
      - - 今川の終わり
        - 1569年 掛川城を開城
        - 終わる日は不明
        - ほぼ妄想
      - - 武田の侵攻
        - 1568年12月
        - 同じ形かは不明
        - ほぼ妄想
      note: もしもは想像。右の札は可能性の高さ
      upto: 1
  - 聞き: 三河を保つ、か。じゃあ、元康は？
  - 語り: 2つ目は、松平元康。史実では、1560年に岡崎へ入ります。もしもは、岡崎に戻れません。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画。後世の絵）
      age: false
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: *id002
      note: もしもは想像。右の札は可能性の高さ
      upto: 2
  - 聞き: 元康のところは、岡崎に戻れない、って言い切るんだね。
  - 語り: 3つ目は、織田信長。史実では、尾張を固めて、美濃へ向かいます。もしもは、東の守りで、美濃が遠のきます。
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: *id002
      note: もしもは想像。右の札は可能性の高さ
      upto: 3
  - 聞き: 信長は、美濃が遠のく、で止まるのか。尾張を失う、とは言ってないね。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
  - 語り: 4つ目は、甲相駿三国同盟。史実では、1567年から68年にかけて崩れます。もしもは、当面は続きます。
    portrait: null
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: *id002
      note: もしもは想像。右の札は可能性の高さ
      upto: 4
  - 聞き: 同盟は続く、か。その先は？
  - 語り: 5つ目と6つ目。清洲同盟と、信長の上洛です。結ばれたか、時期が変わるかは、史料の外です。札は、ほぼ妄想です。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: *id002
      note: もしもは想像。右の札は可能性の高さ
      upto: 6
  - 聞き: 同盟も上洛も、元康と信長の動きがずれたら、全部ずれるのか。
  - 語り: 最後に、今川氏の終わりと、武田の駿河侵攻。終わる日も、侵攻が同じ形で起きたかも、答えは史料の外です。ほぼ妄想の札が、並びます。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    figure:
      type: table
      title: 運命表（史実ともしも）
      cols:
      - 史実
      - もしも
      rows: *id002
      note: もしもは想像。右の札は可能性の高さ
      upto: 8
  - 聞き: 表を見ると、ありうると、ほぼ妄想ばっかりで、すっきりしないね。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: 札を数えると、ありうるが4つ、ほぼ妄想が4つです。根拠の足りない所は、足りない、と言います。
    figure: null
    hook: true
  - 聞き: じゃあ、日本全体では、何が変わるの？
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    tone: 疑問
    hook: true
- title: 想像⑥ 日本の変化点と、現代につながる鎖
  background:
    image: paintings/mikata_totomi_kuniezu_1838.jpg
    credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
  year: 1569
  lines:
  - 語り: 最後に、日本全体の流れです。史実では、桶狭間のあと、織田と徳川が力をつけ、今川は、1569年に戦国大名として終わります。
    portrait: null
    card:
      head: 史実の流れ
      body: 織田・徳川が伸び、今川は終わる
  - 聞き: 義元が生き残ってたら、信長も家康も、天下に近づけなかったのかな。
  - 語り: ここから先は、想像です。遅れた、とも言えますが、根拠がありません。信長の足場、家康の独立、今川の存続。どれも、他の人の動き次第です。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    card:
      head: ここから想像
      body: 日本全体の流れ（ほぼ妄想）
  - 聞き: 天下人の話まで届くかどうかは、決められないか。
  - 語り: もうひとつ、想像します。義元が生きていたら、桶狭間は、いま、どう語られているか。「信長の奇襲」という物語は、討ち取ったから生まれました。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: 討ち取れなければ、尾張の東の小競り合いとして、名前だけが残ったかもしれません。
    card:
      head: ほぼ妄想
      body: 桶狭間がどう語られるかは材料なし
  - 聞き: 勝ったから語られるのか。勝たなかった戦は、教科書に載らないのか。
  - 語り: 元康が独立しなければ、のちの江戸幕府へ続く鎖が、どこかで切れるのか。切れたとも、つながったとも、言い切れません。
    background:
      image: paintings/ieyasu_edo_zu_byobu_castle_detail.jpg
      credit: 《江戸図屏風》江戸城の部分（17世紀）
  - 聞き: 鎖の1個目が違うだけで、最後の形が変わるかもしれない。想像するだけで、くらくらするよ。
  - 語り: ここで、想像を離れて、史実の話です。「桶狭間は奇襲だった」という像が、はっきり残っています。江戸初期の書物が迂回を書き、明治の戦史が定着させ、教科書を通って、今も語られます。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
  - 語り: ここで、想像は終わりです。まとめに入ります。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    card:
      head: 想像はここまで
      body: 次はまとめ
    hook: true
  - 聞き: 最初の3つの問いに、答えるのか。
    hook: true
- title: まとめ：永禄3年5月19日 桶狭間の雨の中の分かれ道
  background:
    image: paintings/nobunaga_okehazama_owari_meisho.jpg
    credit: 『尾張名所図会』桶狭間古戦場（1844年）
  year: 1560
  lines:
  - 語り: 冒頭の3つの問いに答えます。1つ目。今川は、三河を保てたのか。想像では、三河を保ちます。
    portrait: null
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items: &id003
      - - 今川は？
        - 三河を保つ
        - ありうる
      - - 信長は？
        - 美濃が遠のく
        - ありうる
      - - 家康は？
        - 1560年は戻れない
        - ありうる
      upto: 1
  - 語り: 2つ目。信長は、どう動くのか。想像では、東の守りで、美濃が遠のきます。尾張を失うかどうかは、ほぼ妄想です。
    background:
      image: paintings/ieyasu_hamamatsu_hiroshige_1834.jpg
      credit: 歌川広重《東海道五十三次之内 濱松 冬枯の図》1834年ごろ
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items: *id003
      upto: 2
  - 語り: 3つ目。家康は、どうなるのか。想像では、1560年のうちには、岡崎に戻れません。岡崎に今川の残兵がいたのは、史実です。
    background:
      image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
      credit: 《龍城図》岡崎城（江戸時代）
    figure:
      type: stats
      title: 3つの問いの答え（想像）
      items: *id003
      upto: 3
  - 聞き: 三つとも、細い道の話だったね。
    figure: null
  - 語り: もう一度、要点を番号で。1つ目。兵数は、4万5千、2万5千、約1万2千と割れていて、何の数かを分けて読みます。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    card:
      head: 要点
      body: 兵数・奇襲説・目的・義元の死の影響
  - 語り: 2つ目。奇襲説は、江戸初期の書物と明治の戦史から広まった話で、いまは正面攻撃説を支持する研究者が多い。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
    portrait:
      image: paintings/nobunaga_okehazama_toyonobu.jpg
      caption: 尾州桶狭間合戦（歌川豊宣、1882年。後世の錦絵）
      age: false
    figure: null
  - 聞き: 1つ目は、数字が割れてること。2つ目は、奇襲が後付けかもってことだね。
  - 語り: 3つ目。義元の目的は、上洛説から、尾張や三河の確保説へ動いています。4つ目。義元の死が、元康の独立と、三国同盟の動揺の起点になりました。
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 聞き: 義元ひとりの死で、東海の地図が動いたのか。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    tone: しみじみ
  - 語り: さきほどの3つの答えは、全部、想像です。史実で言えるのは、永禄3年5月19日、義元が討たれ、今川軍が総崩れになったこと。兵数・奇襲・目的は、割れたままだということです。
    portrait: null
    card:
      head: 史実で言えること
      body: 義元が討たれ、今川軍が総崩れになった
  - 聞き: ここまでで、今川の人たちの顔が、だいぶ見えてきたよ。最後に、人柄が分かる話は、ないの？
    tone: 疑問
  - 語り: 1人、挙げます。氏真です。桶狭間の日に数え23歳だった氏真は、のちに家康の庇護を受け、慶長19年に江戸で亡くなります。77歳でした。和歌は、1千6百首あまりが収録されています。
    background:
      image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
    card:
      head: 今川氏真
      body: 数え77歳で没・和歌は1千6百首あまり
  - 聞き: 蹴鞠と和歌の人、って言われがちだけど、お父さんを失ってから、50年あまり生きたのか。
    tone: しみじみ
  - 語り: 氏真の評価は、いまも割れています。文弱で国を滅ぼした人、とも、治水に力を入れた人でもあった、とも読まれます。
  - 語り: 分かれ道を1つ挙げるなら、史実で5月19日の昼に起きた、あの雨の中の突入です。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 聞き: もし、あの雨の中で、突入が外れていたら……って、つい考えちゃうね。
  - 語り: 今日の地層は、ここまでです。
    card:
      head: 今日の地層
      body: ここまで
  - 聞き: 次の「もしも」は、誰の、どの分かれ道かな。
