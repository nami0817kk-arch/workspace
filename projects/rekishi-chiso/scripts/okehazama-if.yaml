en:
  title: What If Imagawa Yoshimoto Survived Okehazama? | What Happens to Imagawa, Nobunaga, Ieyasu?
  description: 'On the 19th day of the 5th month of Eiroku 3 (generally given as June 12, 1560), Imagawa Yoshimoto, aged 42 by Japanese count, was killed at Okehazama. The Shincho-ko-ki puts his army at 45,000 and Nobunaga''s at under 2,000, but modern research does not accept those figures. This video asks: what if Yoshimoto had not been killed?


    We keep records, theories and imagination apart. First, what the sources and historians say: Yoshimoto''s domains and the Three-Way Alliance, why he marched into Owari (the old Kyoto-march theory versus territorial theories), Matsudaira Motoyasu (the young Ieyasu, 19) bringing rice into Odaka Castle, the three competing army-size figures, the surprise-attack theory versus the frontal-attack theory, the hail and rain, Yoshimoto''s death, the widely differing casualty figures, and what happened to Ujizane, Motoyasu and the alliance afterwards.


    Then, clearly marked imagination with reasons: the evening on Mount Okehazama, Nobunaga at Kiyosu, Motoyasu at Odaka Castle, Yoshimoto and Ujizane in Sunpu, a table of fates, and the chains to today. In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    The accounts of historians'' views follow summaries on Wikipedia and magazine articles; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'May 19, 1560: Do the Numbers 45,000 vs 2,000 Hold Up?'
  - 'Imagawa Yoshimoto: Lord of Suruga, Totomi and Mikawa'
  - 'May 1560: Why March Into Owari? Kyoto or Territory'
  - 'The Night of May 18: Motoyasu Brings Rice Into Odaka Castle'
  - 'May 19: What Are the Army Figures Counting?'
  - 'Noon on May 19: Mount Okehazama, Dengaku-hazama, the Hail'
  - 'Surprise Attack or Frontal Attack? Research Revisited'
  - 'Yoshimoto''s Death and the Disputed Casualty Figures'
  - 'After Okehazama: Motoyasu Enters Okazaki and Allies with Nobunaga'
  - 'Ujizane''s Imagawa, 1560-1569: The Fate of the Three-Way Alliance'
  - 'Other Paths in the Sources'
  - 'Imagination 1: Evening on Mount Okehazama'
  - 'Imagination 2: Nobunaga and Shibata Katsuie at Kiyosu'
  - 'Imagination 3: Motoyasu and Sakai Tadatsugu at Odaka Castle'
  - 'Imagination 4: Yoshimoto and Ujizane in Sunpu'
  - 'Imagination 5: A Table of Fates'
  - 'Imagination 6: How Japan Changes, and the Chains to Today'
  - 'Summary: The Fork in the Rain at Okehazama'
