      head: 別の道 1
      body: 突入が本陣に届かない
  - 聞き: 偶然、当たったのなら、偶然、外れてもおかしくない、ってことか。
  - 語り: 2つ目の道。義元が、混乱の中を動く道です。『信長公記』は、塗輿が捨てられたと伝えます。義元は、輿を離れて動いた、と読めます。
