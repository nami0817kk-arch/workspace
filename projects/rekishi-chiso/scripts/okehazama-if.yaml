  background:
    image: paintings/nobunaga_okehazama_owari_meisho.jpg
    credit: 『尾張名所図会』桶狭間古戦場（1844年）
  year: 1560
  lines:
  - 語り: 永禄3年、今川義元は尾張へ進みます。かつては、京へ上るための軍だと言われました。『甫庵信長記』以来の旧説です。
    short: s4
    figure:
      type: map
      title: 義元の進軍（経路の目安）
      bounds:
      - 136.6
      - 138.6
      - 34.7
      - 35.4
      places:
      - - 駿府
        - 138.38
        - 34.98
      - - 岡崎
        - 137.16
        - 34.96
      - - 桶狭間
        - 136.99
        - 35.07
      - - 清洲
        - 136.84
        - 35.22
      route:
      - 駿府
      - 岡崎
      - 桶狭間
      note: 駿河から尾張へ。地図は経路の目安
  - 聞き: 天下を取りに行った、って話だよね。
    short: s4
    figure: null
  - 語り: いまは、尾張や三河を確保するための軍、という見方が有力です。高柳光壽さんは、領土の拡大。小和田哲男さんは、鳴海城と大高城の救援。久保田昌希さんは、西三河の確保と見ます。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    card:
      head: 義元の目的
      body: 領土の拡大・城の救援・西三河の確保
    short: s4
  - 聞き: 目的が、割れるの？ 決め手は、ないの？
    tone: 疑問
    short: s4
  - 語り: 決め手は、ありません。大石泰史さんは、上洛説は成り立ちにくいとして、説を6つの型に分けました。
    short: s4
  - 語り: 一方で、小林正信さんは、上洛が目的だった説を、改めて唱えています。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 聞き: 目的が割れたままなのに、戦いは起きたのか。
  - 語り: 鳴海城と大高城は、今川方の城でした。
  - 語り: 信長は、鳴海城を囲む砦と、大高城を押さえる砦を築いていました。善照寺、丹下、中島。そして丸根と、鷲津です。
  - 語り: その大高城に、5月18日の夜、兵糧が運び込まれます。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    hook: true
  - 聞き: 運んだのは、誰？
    hook: true
- title: 5月18日の夜 元康、大高城へ兵糧を入れる
  background:
    image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
    credit: 《龍城図》岡崎城（江戸時代）
  year: 1560
  lines:
  - 語り: 桶狭間の前の夜、数え19歳の松平元康が、今川の先鋒として動きます。のちの徳川家康です。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画。後世の絵）
      age: false
    card:
      head: 5月18日の夜
      body: 元康、大高城へ兵糧を入れる
    short: s5
  - 語り: 織田方の砦に囲まれた大高城は、兵糧が尽きかけていました。
    short: s5
  - 語り: 城の鵜殿長照が義元に訴え、義元が補給を命じた、とされます。
  - 語り: 元康は、鷲津と丸根の砦のあいだを抜けて、兵糧を入れました。
    short: s5
  - 聞き: 敵の砦のすきまを通るの？ 19歳で、それは胃が痛くなりそう。
    background:
      image: paintings/kira_okazaki_hiroshige.jpg
      credit: 歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ
    short: s5
  - 語り: 夜が明けた5月19日。元康の隊が丸根砦を、朝比奈泰朝の隊が鷲津砦を攻めます。鷲津では飯尾定宗と織田秀敏が、丸根では佐久間盛重が、戦死します。
    card:
      head: 5月19日の朝
      body: 丸根・鷲津の砦が落ちる
    short: s5
  - 聞き: 朝のうちに、砦が2つも落ちたのか。織田は、押されてるね。
    short: s5
  - 語り: 清洲の信長にも、知らせが届きます。『信長公記』によれば、信長は、幸若舞『敦盛』の一節を舞い、立ったまま食事をして、具足をつけて出陣しました。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    portrait:
      image: paintings/nobunaga_portrait_eitoku_daitokuji.jpg
      caption: 織田信長（狩野永徳（伝）画、大徳寺 総見院、1584年）
      age: false
    card:
      head: 敦盛を舞い、出陣
      body: 『信長公記』の記述
  - 語り: 「人間五十年」は、信長の作った言葉ではなく、舞の詞章です。『信長公記』が舞を書くのは、この出陣の前です。本能寺ではありません。
  - 聞き: 炎の中で舞った、っていうイメージだった。あれは、あとから付いた話か。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: 供は6騎だけだった、と『信長公記』は書きます。信長は、朝のうちに熱田へ向かいます。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    hook: true
  - 聞き: たった6騎で出るの？ そこから、兵は集まるのかな。
    hook: true
- title: 5月19日 信長の進路と、兵数は何の数か
  background:
    image: paintings/toshiie_owari_atsuta_zue.jpg
    credit: 『尾張名所図会』熱田神宮（江戸後期）
  year: 1560
  lines:
  - 語り: 信長は、辰の刻、朝8時ごろに熱田に着き、そのあと善照寺砦に入ります。画面は、江戸後期の『尾張名所図会』の、熱田神宮です。
    portrait: null
    figure:
      type: map
      title: 信長の進路（経路の目安）
      bounds:
      - 136.7
      - 137.1
      - 35.0
      - 35.3
      places:
      - - 清洲
        - 136.84
        - 35.22
      - - 熱田
        - 136.91
        - 35.13
      - - 桶狭間
        - 136.99
        - 35.07
      route:
      - 清洲
      - 熱田
      - 桶狭間
      note: 清洲から熱田へ。地図は経路の目安
  - 聞き: 熱田って、いまの名古屋だよね。清洲から、けっこう距離があるよ。
    figure: null
  - 語り: 信長の兵は、『信長公記』で「二千にも満たない」。通説でも、2千から3千。信長側が数で劣った、という点は、多くの見積もりが一致しています。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: 今川軍の数は、割れます。渡邊大門さんの試算は、駿河と遠江の石高から出した、約1万2千。桶狭間に着いた時点で約2万、義元の本陣は5千から6千、とも言われています。
    card:
      head: 今川軍の数
      body: 何の数かを分けて読む
  - 聞き: 全軍の数と、本陣の数は、別ものってことか。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
  - 語り: 太田満明さんや橋場日月さんは、石高から見て、2万5千でも多すぎる、と論じます。数字を並べるほど、はっきりしなくなります。
  - 聞き: 大きい数字ほど、あとから盛られやすいのかな。
  - 語り: 次は、昼の桶狭間です。
    hook: true
  - 聞き: 昼の桶狭間で、義元は、何をしてたの？
    hook: true
- title: 5月19日の昼 桶狭間山と田楽狭間、石混じりの雨
  background:
    image: paintings/nobunaga_okehazama_owari_meisho.jpg
    credit: 『尾張名所図会』桶狭間古戦場（1844年）
  year: 1560
  lines:
  - 語り: 義元は、桶狭間山で人馬を休めていた、と『信長公記』は書きます。昼ごろに着いて、戦勝を祝いながら休んだ、という整理もあります。
    portrait:
      image: paintings/okehazama_imagawa_yoshimoto_portrait.jpg
      caption: 今川義元（肖像画、作者・制作年不詳）
      age: false
  - 聞き: 砦を2つ落として、ひと息ついてたのかな。
  - 語り: 地名にも、違いがあります。「桶狭間山」は『信長公記』の地名。「田楽狭間」は『甫庵信長記』に出て、江戸時代に広まりました。
    portrait: null
    card:
      head: 桶狭間山と田楽狭間
      body: 書物ごとに地名が違う
  - 語り: 1587年の太原雪斎の三十三回忌の記録に「田楽窪」とあり、これが戦死地の根拠の一つとされます。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
  - 聞き: 地名ひとつにも、書物ごとの違いがあるのか。
  - 語り: そこへ、激しい雨が降ります。『信長公記』は、石や氷の混じった雨と書き、雹ではないか、という指摘があります。
    card:
      head: 石混じりの雨
      body: 『信長公記』の記述・雹の可能性
  - 聞き: 雹まで降ったの！？ 兵も馬も、びっくりしただろうな。
    tone: 驚き
  - 語り: 画面は、1844年の『尾張名所図会』の桶狭間古戦場です。後世の絵で、当日の様子を写したものではありません。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: この雨の中で、何が起きたのか。奇襲だったのか、正面からだったのか。研究は割れています。
    hook: true
  - 聞き: 教科書では、奇襲だった気がするけど……。
    hook: true
- title: 奇襲説と正面攻撃説 研究の見直し
  background:
    image: paintings/nobunaga_okehazama_owari_meisho.jpg
    credit: 『尾張名所図会』桶狭間古戦場（1844年）
  year: 1560
  lines:
  - 語り: 桶狭間の「奇襲説」。信長が迂回して、義元の本陣の背後を突いた、という話です。画面は、後世の錦絵です。
    portrait:
      image: paintings/nobunaga_okehazama_toyonobu.jpg
      caption: 尾州桶狭間合戦（歌川豊宣、1882年。後世の錦絵）
      age: false
    card:
      head: 奇襲説
      body: 迂回して本陣の背後を突く
    short: s2
  - 語り: 迂回を書いたのは、江戸時代初めの小瀬甫庵『信長記』です。明治の参謀本部の戦史が、事実として定着させた、とされます。
    short: s2
  - 聞き: 戦の本が、物語を足してたってこと？ そこが出どころなら、教科書の絵は、ずいぶんあとの話か。
    short: s2
  - 語り: 『信長公記』を重んじる正面攻撃説が、いまは有力です。藤本正行さんらが支持します。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    portrait: null
    card:
      head: 正面攻撃説
      body: 『信長公記』を重んじる
    short: s2
  - 聞き: 教科書の絵とは、正面攻撃説のほうが、地味に聞こえるね。
    short: s2
  - 語り: 信長は、義元の居場所を知らず、中島砦から向かった先で、偶然、本陣に突き当たった。これが、正面攻撃説の見方です。
    portrait: null
  - 語り: 渡邊大門さんは、奇襲説の根拠になる史料は信頼度が低く、いまは正面攻撃説を支持する研究者が多い、と書いています。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 聞き: 偶然、本陣に突き当たったの？ それはそれで、すごい運だな。
  - 語り: ほかにも説があります。別働隊を使ったとする橋場日月さん。乱取りの最中の急襲とする黒田日出男さん。撤退中の急襲とするかぎや散人さんと水野誠志朗さん。決着は、ついていません。
    background:
      image: paintings/mikata_mitsuke_tenryu_cleveland.jpg
      credit: 歌川広重《東海道五十三次之内 見附 天竜川》1833年ごろ
    card:
      head: ほかの説
      body: 別働隊・乱取り急襲・撤退中の急襲
  - 聞き: 説が5つもあって、決着なし。それでも、結果は同じなんだよね。
  - 語り: では、肝心の、義元の最期です。
    hook: true
  - 聞き: 残酷な話は少し苦手だけど、ぼかさずに、知りたいな。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    hook: true
- title: 5月19日 未の刻 義元の最期と、割れる損害
  background:
    image: paintings/nobunaga_okehazama_owari_meisho.jpg
    credit: 『尾張名所図会』桶狭間古戦場（1844年）
  year: 1560
  lines:
  - 語り: 『信長公記』によれば、未の刻、午後1時から2時ごろ。信長の旗本が、東から義元の隊へ突き入った。混乱の中で、義元の塗輿も、捨てられたと伝わります。
    portrait:
      image: paintings/ieyasu_imagawa_yoshimoto_yoshiiku.jpg
      caption: 今川義元（落合芳幾、1867年。後世の武者絵）
      age: false
    card:
      head: 未の刻
      body: 旗本が義元の隊へ突入
  - 語り: 服部小平太、のちの一忠が、義元の膝を斬ります。毛利新介、良勝が、討ち取ります。名前が残るのは、この2人です。
    portrait: null
  - 聞き: 義元は、数え42歳で亡くなったのか。
    tone: しみじみ
  - 語り: 損害は、書物ごとに割れます。今川側は、『信長公記』が首3千あまり。『落穂集』が約2千5百。『改正三河後風土記』が約3千9百です。
    background:
      image: paintings/toshiie_owari_atsuta_zue.jpg
      credit: 『尾張名所図会』熱田神宮（江戸後期）
    figure:
      type: stats
      title: 今川側の損害（書物ごとの記述）
      items:
      - - 『信長公記』
        - 首3千あまり
        - 首の数
      - - 『落穂集』
        - 約2千5百
        - 今川側
      - - 『改正三河後風土記』
        - 約3千9百
        - 今川側
  - 聞き: 数字が、こんなに割れるのか。何を信じていいか、分からなくなるね。
    figure: null
  - 語り: 今川は約2千7百、織田は990あまり、と書く記録もありますが、偽情報という見方もあります。確実なのは、義元が討たれて、今川軍が総崩れになったことです。
    background:
      image: paintings/nobunaga_okehazama_owari_meisho.jpg
      credit: 『尾張名所図会』桶狭間古戦場（1844年）
  - 語り: 義元を失った今川家は、このあと、どうなったのか。
    portrait: null
    hook: true
  - 聞き: 家来の人たちは、どうしたんだろう。
    hook: true
- title: 永禄3年5月〜 元康の岡崎入りと、氏真の今川家
  background:
    image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
    credit: 《龍城図》岡崎城（江戸時代）
  year: 1560
  lines:
  - 語り: 義元の死は、5月19日の夕方、大高城に伝わります。水野信元の使者の知らせを、元康は、物見で確かめ、その夜のうちに大高城を退きます。
    portrait:
      image: paintings/ieyasu_yoshitora_mikawa_eiyuden.jpg
      caption: 徳川家康（武将姿、歌川芳虎画。後世の絵）
      age: false
  - 語り: 岡崎城には、まだ今川の残兵がいました。元康は、5月20日に菩提寺の大樹寺へ入り、23日に岡崎城へ入ります。画面は、江戸時代の岡崎城の絵図です。
    card:
      head: 5月23日
      body: 元康、岡崎城へ入る
  - 語り: 「捨城ならば拾はん」という言葉は有名ですが、出どころは昭和9年の本で、後世の話です。
    background:
      image: paintings/kira_okazaki_hiroshige.jpg
      credit: 歌川広重《東海道五十三次 岡崎》（三河の国）1833年ごろ
  - 聞き: 有名な名ゼリフなのに、昭和の本か。
  - 語り: 独立の理由には、見方があります。ひとつは、武田や北条への援軍を後回しにした氏真に、元康が失望した、という見方。
    portrait: null
    card:
      head: 元康の独立
      body: 氏真への失望／帰還を許した新説
  - 語り: 近年は、織田の三河侵攻を警戒した氏真が、岡崎への帰還を許した、という新説もあります。
    background:
      image: paintings/ieyasu_okazaki_castle_ryujo_zu.jpg
      credit: 《龍城図》岡崎城（江戸時代）
  - 語り: 1562年ごろ、元康は信長と講和します。清洲同盟です。年は、永禄4年と5年で、記述が割れています。
    year: 1562
    card:
      head: 1562年ごろ
      body: 元康と信長、講和（清洲同盟）
  - 聞き: 敵だった信長と組むなんて、すごい切り替えだね。
  - 語り: 元康の側は、ここまでです。今川の側は、どうなったのか。
    hook: true
  - 聞き: 当主を失った家は、どうなったんだろう。
    hook: true
- title: 氏真の今川家 1560年から1569年、三国同盟の行方
  background:
    image: paintings/mikata_totomi_kuniezu_1838.jpg
    credit: 《天保国絵図 遠江国》1838年（国立公文書館蔵）
  year: 1560
  lines:
  - 語り: 今川の側です。当主の氏真は、1538年生まれ。数え23歳でした。重臣や国衆の戦死が相次ぎ、三河では元康が離れ、遠江では飯尾連龍らの反乱、遠州忩劇が起きます。
    background:
      image: paintings/ieyasu_fuchu_abe_river_hiroshige_1833.jpg
      credit: 歌川広重《東海道五十三次之内 府中 安部川》1833年ごろ
    year: 1560
    card:
      head: 氏真の今川
      body: 離反と反乱が重なる
