# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  クレオパトラの墓は、死後2000年あまりたった今も、見つかっていません。しかも古代の記録が、その場所について残した手がかりは、「イシス神殿の近く」と「王宮の敷地の中」の、たった二つです。
  勝ったローマの将軍は、アレクサンドロス大王の遺体は見に行き、プトレマイオス家の墓は、見るのを断りました。
  古代の記録と発掘の手がかり3つで、タポシリス・マグナ・水没した王宮区・ソーマの3つの候補に、点を付けました。
  この動画でわかること
  ・古代の記録が「書いていること」と「書いていないこと」
  ・タポシリス・マグナの発掘で、見つかったもの・見つかっていないもの
  ・水の下に沈んだ、アレクサンドリアの王宮区
  ・採点の結果と、記録から言えること・言えないこと
description_note: |-
  採点の決まり（3つの手がかり、①王宮の敷地の中・②イシス神殿の近く・③墓の証拠が出ているか、を2点・1点・0点で数える）は、この動画で決めたものです。点は、今回たどれた記録と発掘の報告・報道の範囲での目安です。決まりを変えれば順位も変わりえます。
  プルタルコス・カッシウス・ディオ・スエトニウス・ストラボンほかの原文は、Thayer 版の英訳（Loeb）とラテン語原文で読みました。発掘と調査は、エジプト観光・考古省の発表、ナショナル ジオグラフィック、AFP・AP の報道、欧州水中考古学研究所（IEASM）、学術論文などによります。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。クレオパトラの姿も、特定の資料を写したものではありません。サムネイルの人物像も、AI による想像図です。

en:
  title: "Where Is Cleopatra's Tomb? Scoring the Records and Digs, an Unexpected Place Emerged"
  description: |-
    Cleopatra's tomb has not been found, more than 2,000 years after her death. And the ancient records leave only two hints about its location: "near the temple of Isis" and "within the palace grounds".
    The Roman victor went to see the body of Alexander the Great, but he declined to see the tombs of the Ptolemies.
    We took three clues from the ancient records and the excavations, and scored three candidate places: Taposiris Magna, the sunken royal quarter of Alexandria, and the Soma.
    In this video you will learn:
    - What the ancient records say about the tomb, and what they do not
    - What the Taposiris Magna excavations have and have not found
    - The royal quarter of Alexandria, now under the sea
    - The final scores, and what can and cannot be said
    The scoring rules were set for this video; the scores reflect only the reports we could trace. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "An Unfinished Tomb"
    - "What Do the Ancient Records Say?"
    - "Three Clues, Two Points Each"
    - "Taposiris Magna"
    - "The Sunken Royal Quarter"
    - "The Soma"
    - "Why Does Nothing Come Out of the Ground?"
    - "The Scores"
    - "Summary: Where Is Cleopatra's Tomb?"

