sections:
  # ================================================================ 序章（冒頭 約2分）。答えは最後の章まで言わない
  - title: 完成しなかった墓　クレオパトラ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: -30
    lines:
      # fact: cleopatra-59
      - 語り: クレオパトラの墓は、死から2000年あまりたった今も、見つかっていません。
        tone: 重い
      # fact: cleopatra-06, cleopatra-02
      - 語り: その墓は、生きているうちに造り始め、アントニウスが運び込まれたときも、まだ完成していませんでした。
      # fact: cleopatra-25, cleopatra-92
      - 語り: 勝ったオクタウィアヌスは、アレクサンドロス大王の遺体は見に行きました。ところが、プトレマイオス家の墓は、見るのを断りました。
      # fact: cleopatra-01, cleopatra-04
      - 語り: 記録に残る場所の手がかりは、たった二つ。「イシス神殿の近く」と、「王宮の敷地の中」です。
        card: {head: "記録が残した場所の手がかり", body: イシス神殿の近く／王宮の敷地の中}
      - 語り: 墓はどこか。記録と発掘の手がかりで採点すると、意外な場所が浮かび上がりました。
        tone: 疑問
        hook: true
      # fact: cleopatra-59
      - 語り: 近ごろは、「ついに墓を発見」とうたう題名も、目にします。けれど、ナショナル ジオグラフィックやCBSなど、2025年の報道は、どれも、墓はまだ見つかっていない、と書いています。
      # fact: cleopatra-08, cleopatra-03
      - 語り: 場面を、紀元前30年のアレクサンドリアに戻します。王宮の敷地に、クレオパトラが造らせた、高い墓がありました。
        year: -30
      # fact: cleopatra-02
      - 語り: カッシウス・ディオによれば、その戸は、一度閉めると、開かない仕掛けでした。屋根に近い上の方は、まだ、できあがっていませんでした。
      # fact: cleopatra-03
      - 語り: プルタルコスによれば、傷ついたアントニウスは、その墓の窓から、綱で引き上げられました。引き上げたのは、クレオパトラ本人と、墓に入れた2人の侍女だけです。
      # fact: cleopatra-08
      - 語り: 死の直前、クレオパトラは、オクタウィアヌスに、封をした書簡を送りました。願いは、アントニウスと一緒に、葬ってほしい、というものでした。
      # fact: cleopatra-07, cleopatra-06
      - 語り: 願いは、かなえられました。記録は、2人が同じ墓に葬られた、と書きます。ところが、その墓が、町のどこにあるのかは、はっきり書いていないのです。
        tone: 重い
      - 語り: 手がかりは、古代の記録に、ほんの少しだけ、残っています。
        hook: true
      - 語り: まず、記録は、墓について、何を書いたのか。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 記録は、墓について何を書いたのか
  - title: 記録は、墓について何を書いたのか　プルタルコスとディオ
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: -30
    lines:
      # fact: cleopatra-01
      - 語り: 墓のことを書いた人たちは、クレオパトラの死から、ずっとあとの時代の人です。
      # fact: cleopatra-01
      - 語り: ギリシャ人のプルタルコスは、100年以上あと。ローマの歴史家、カッシウス・ディオは、200年以上あとです。
      # fact: cleopatra-01
      - 語り: プルタルコスは、こう書きます。クレオパトラは、イシス神殿の近くに、きわめて高く美しい墓と記念碑を造らせ、王家の財宝を、運び込んだ。
        figure: {type: stats, title: 墓の場所の手がかり, items: [[プルタルコス, イシス神殿の近く, 墓と記念碑], [ディオ, 王宮の敷地の中, 造っていた墓], [場所の特定, なし, どちらも]], upto: 1}
      # fact: cleopatra-90
      - 語り: ところが、ディオは、財宝を集めた場所を、王宮の敷地の中で、造っていた墓、と書きます。場所の言い方が、2人で違います。両方に合う場所も、ありえます。
        figure: {type: stats, title: 墓の場所の手がかり, items: [[プルタルコス, イシス神殿の近く, 墓と記念碑], [ディオ, 王宮の敷地の中, 造っていた墓], [場所の特定, なし, どちらも]], upto: 2}
      # fact: cleopatra-04
      - 語り: どちらも、それが町のどこなのかは、書いていません。地理学者ストラボンは、アレクサンドリアの町を案内していますが、クレオパトラの墓には、一言も触れません。
        figure: {type: stats, title: 墓の場所の手がかり, items: [[プルタルコス, イシス神殿の近く, 墓と記念碑], [ディオ, 王宮の敷地の中, 造っていた墓], [場所の特定, なし, どちらも]], upto: 3}
      # fact: cleopatra-06
      - 語り: 2人が同じ墓に葬られたことは、ローマの伝記作家スエトニウスが、書いています。オクタウィアヌスは、2人に葬儀を許し、二人が始めた霊廟を完成させよ、と命じた。
        figure: null
      # fact: cleopatra-07, cleopatra-09
      - 語り: プルタルコスは、その葬りを、豪華で、王にふさわしいものだった、と書きます。アントニウスの遺体は、クレオパトラ自身の手で、葬られました。
      # fact: cleopatra-10
      - 語り: 捕らわれの身になったクレオパトラは、アントニウスの墓に、酒を注ぎ、遺灰の壺を抱いて、別れを告げた、とも書かれています。
      # fact: cleopatra-11, cleopatra-12
      - 語り: では、クレオパトラは、どう死んだのか。1つ目の食い違いです。プルタルコスは、イチジクの籠の蛇、水壺の蛇、髪の櫛の毒、と3つの説を並べ、真実は、誰も知らない、と書きます。
        card: {head: "死因の記録", body: 説がいくつも並ぶ}
      # fact: cleopatra-12, cleopatra-13
      - 語り: ストラボンは、蛇の毒か、毒の軟膏か、の2つ。オロシウスは、蛇に咬まれた、と思われ、左の腕に傷があった、と書きます。
      # fact: cleopatra-17
      - 語り: オクタウィアヌスは、死んだと聞くと、薬と、蛇の毒を吸い出す男たちを使って、生き返らせようとした、とも、スエトニウスらは書きます。
      # fact: cleopatra-32
      - 語り: プルタルコスは、こんなことも書いています。アントニウスの像は倒されましたが、クレオパトラの像は、残されました。友人のアルキビオスが、2000タラントンを、オクタウィアヌスに払ったからだ、といいます。
      # fact: cleopatra-25
      - 語り: そのオクタウィアヌスは、エジプトで、アレクサンドロス大王の遺体を、石棺ごと、祠から出させ、黄金の冠をのせ、花をまきました。
      # fact: cleopatra-25, cleopatra-92
      - 語り: プトレマイオス家の墓も見るか、と聞かれると、スエトニウスによれば、こう答えました。私は、王を見たかったのであって、死体ではない。
        tone: 重い
      - 語り: 手がかりは、3つに絞れます。王宮の敷地の中、イシス神殿の近く、そして、実際に墓の証拠が出たか。この3つで、候補に点を付けます。
        hook: true
      - 語り: その候補とは、どこなのか。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 採点の決まり（約20%）
  - title: 採点の決まり　3つの手がかりと3つの候補
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: cleopatra-90
      - 語り: 1つ目の手がかりは、《王宮の敷地の中》。ディオの書いた、造っていた墓の場所です。
        figure: {type: table, title: 墓を探す3つの手がかり, cols: [出どころ, 見るもの], rows: [[王宮の敷地の中, ディオ, 王宮のそばか], [イシス神殿の近く, プルタルコス, 神殿のそばか], [墓の証拠, 発掘の発表, 遺体・名の碑文・墓室]], upto: 1}
      # fact: cleopatra-01
      - 語り: 2つ目は、《イシス神殿の近く》。プルタルコスの書いた場所です。
        figure: {type: table, title: 墓を探す3つの手がかり, cols: [出どころ, 見るもの], rows: [[王宮の敷地の中, ディオ, 王宮のそばか], [イシス神殿の近く, プルタルコス, 神殿のそばか], [墓の証拠, 発掘の発表, 遺体・名の碑文・墓室]], upto: 2}
      # fact: cleopatra-72
      - 語り: 3つ目は、《墓の証拠》。掘って、遺体か、クレオパトラの名の碑文か、墓の部屋が、出たかどうかです。
        figure: {type: table, title: 墓を探す3つの手がかり, cols: [出どころ, 見るもの], rows: [[王宮の敷地の中, ディオ, 王宮のそばか], [イシス神殿の近く, プルタルコス, 神殿のそばか], [墓の証拠, 発掘の発表, 遺体・名の碑文・墓室]], upto: 3}
      - 語り: 点の付け方です。はっきり合えば、2点。合うかもしれないが、記録が場所を決めていないか、確かめられていなければ、1点。合わなければ、出ていなければ、0点。
        figure: {type: stats, title: 点の付け方, items: [[はっきり合う, 2点, 場所と証拠], [かもしれない, 1点, 確かめられない], [合わない, 0点, 出ていない]], upto: 3}
      - 語り: 3つの手がかりで、6点満点です。
        figure: null
      # fact: cleopatra-41, cleopatra-24
      - 語り: 候補は、3つ。1つ目は、アレクサンドリアの西の、タポシリス・マグナ。2つ目は、町の中の、海の下に沈んだ王宮区。3つ目は、王たちの墓所の囲い、ソーマです。
        figure: {type: map, title: 墓の3つの候補, bounds: [29.2, 30.2, 30.7, 31.5], reveal: true, places: [[タポシリス・マグナ, 29.52, 30.94], [アレクサンドリアの王宮区, 29.92, 31.2]]}
      - 語り: 点は、今回たどれた記録と発掘の報告での、目安です。見当たらないのは、無いとは限りません。
        figure: null
      - 語り: まず、いま、いちばん話題になっている場所から。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 タポシリス・マグナ
  - title: タポシリス・マグナ　2005年から続く発掘
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 2005
    lines:
      # fact: cleopatra-41
      - 語り: タポシリス・マグナ。意味は、「オシリスの大きな墓」です。アレクサンドリアから、西へ、およそ50キロ。海沿いの、神殿の跡です。
      # fact: cleopatra-37
      - 語り: ここを掘っているのは、ドミニカ共和国の考古学者、キャスリーン・マルティネス。発掘を始めたのは、2005年の10月。2026年までで、21年です。
        card: {head: "2005年10月", body: マルティネスが発掘を始める}
      # fact: cleopatra-39, cleopatra-40
      - 語り: マルティネスが、ここを選んだ理由は、いくつかあります。クレオパトラは、女神イシスと重ねられた女王でした。
      # fact: cleopatra-39, cleopatra-40
      - 語り: この神殿は、オシリスの聖地でした。そして、ローマ人が探そうとも思わない場所だった、と考えたのです。
      # fact: cleopatra-45
      - year: 2021
        語り: 2021年の1月。エジプトの省と発掘隊は、16の埋葬室を見つけた、と発表しました。口の中に、金箔の舌の形のお守りを入れた、ミイラも出ています。神殿からは、それまでに、クレオパトラ7世の名と姿のある、コインも、見つかっていました。
      # fact: cleopatra-52, cleopatra-53
      - 語り: 2025年の記事では、コインは337枚と伝わりますが、出どころによって、数え方が違います。
      # fact: cleopatra-66
      - 語り: マルティネスは、2025年9月、CBSに、掘り終えた地下の墓は21、人骨は600体を超え、ミイラは30体を超える、と話しました。竪穴も、7つあります。
      # fact: cleopatra-100
      - 語り: ただし、オックスフォードのアシュモレアン博物館のウォーカーは、ここで見つかったミイラは、王族よりも、高位の神官の可能性が高い、と述べています。
      # fact: cleopatra-52, cleopatra-53
      - 語り: ハーバード大のイレーネ・ソト・マリンは、コインの肖像は、古代で最も多く見られた、女王の姿だ、と述べています。
      - 語り: 広く、使われたコインです。出たからといって、ここに葬られた証拠には、ならないのです。
      # fact: cleopatra-46
      - 語り: 2022年の11月。エジプトの考古最高評議会は、神殿の下で、岩を掘った長いトンネルを見つけた、と発表しました。
      # fact: cleopatra-46
      - 語り: 長さは、1305メートル。高さは、約2メートル。地下、約13メートルです。
        card: {head: "2022年11月", body: 長さ1305mのトンネル}
      # fact: cleopatra-47
      - 語り: 省は、ギリシャのサモス島にある、紀元前6世紀のトンネル、エウパリノスのトンネルに、設計がよく似ている、と説明しました。
      # fact: cleopatra-47
      - 語り: 長さは1036メートル。それより、約1.26倍、長いことになります。
      # fact: cleopatra-49
      - 語り: ただし、このトンネルが、何のために掘られたのか。墓に通じているのか。2022年の報道は、どちらも分かっていない、と書いています。
      # fact: cleopatra-50
      - 語り: トンネルの泥からは、陶器の破片と、小さなアラバスターの頭部が、いくつか出ました。主任の考古学者は、身分の高い人物の頭部とみています。
      # fact: cleopatra-56, cleopatra-57
      - 語り: 2025年の9月には、神殿の沖の、海の中で、水没した古い港のような跡が、見つかった、と発表されました。当時の浜辺は、今より、約4キロ沖だったとされます。
      # fact: cleopatra-71
      - 語り: この海の調べには、1985年にタイタニックを見つけた、ボブ・バラードも、加わりました。
      # fact: cleopatra-58
      - 語り: マルティネスの考えは、こうです。クレオパトラの遺体は、ここへ運ばれ、トンネルを通って、沖へ出て、ローマ人の手の届かない場所に、隠された。
        tone: 疑問
      # fact: cleopatra-59, cleopatra-67
      - 語り: ですが、2025年11月の報道でも、墓の部屋も、クレオパトラの名の碑文も、見つかっていません。2026年3月の記事でも、墓は、見つかっていません。
        tone: 重い
      # fact: cleopatra-54, cleopatra-55
      - 語り: 2024年の12月に出た、白い大理石の女性の小像も、マルティネスは、クレオパトラかもしれない、と言いました。
      # fact: cleopatra-54, cleopatra-55
      - 語り: ところが、省の事務局長自身が、顔立ちは、知られたクレオパトラ像と、大きく違う、と述べています。
      # fact: cleopatra-65, cleopatra-62
      - year: 2009
        語り: この発掘に、ずっと関わってきた、エジプトの考古学者、ザヒ・ハワスの言葉も、変わっていきます。2009年には、見つけたら21世紀で最も重要な発見だ、と語りました。
      # fact: cleopatra-62, cleopatra-63
      - 語り: ところが、2019年には、墓が見つかりそうだ、という報道を、まったくの誤報だと否定します。神殿は礼拝の場で、墓にする可能性は低い、とも述べました。
      # fact: cleopatra-64
      - 語り: 2024年の5月には、神殿に墓の手がかりは、もう無い、と語り、探索を打ち切ったと述べています。
      - 語り: ここまでを、採点します。王宮の敷地の中からは、アレクサンドリアの王宮から、およそ50キロ離れているので、0点。
        figure: {type: table, title: タポシリス・マグナの点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮から約50キロ, 0点], [イシス神殿の近く, イシス信仰と重なる, 1点], [墓の証拠, 墓も遺体も出ていない, 0点]], upto: 1}
      # fact: cleopatra-72
      - 語り: イシス神殿の近くは、イシスに捧げた神殿という銘板が出ていますが、プルタルコスの言う神殿が、ここだとは、書かれていません。1点。
        figure: {type: table, title: タポシリス・マグナの点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮から約50キロ, 0点], [イシス神殿の近く, イシス信仰と重なる, 1点], [墓の証拠, 墓も遺体も出ていない, 0点]], upto: 2}
      - 語り: 墓の証拠は、0点。合計は、1点です。
        figure: {type: table, title: タポシリス・マグナの点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮から約50キロ, 0点], [イシス神殿の近く, イシス信仰と重なる, 1点], [墓の証拠, 墓も遺体も出ていない, 0点]], upto: 3}
      - 語り: では、王宮のそば、と書かれた場所は、いま、どうなっているのか。
        tone: 疑問
        hook: true
        figure: null

  # ================================================================ 第4章 水没した王宮区
  - title: 水の下の王宮区　アンティロドス島とロキアス岬
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: cleopatra-22
      - 語り: ストラボンは、王宮の建物は、とても広く、町の周りの長さの、4分の1から3分の1にのぼる、と書きます。割合にして、25パーセントから、33パーセントです。
        figure: null
      # fact: cleopatra-24
      - 語り: ストラボンは、ロキアス岬の王宮、人工の港、沖のアンティロドス島の王宮、そして、アントニウスが、海の岬に築いた、王の別荘、ティモニオンを案内します。
      # fact: cleopatra-87
      - 語り: ティモニオンは、アクティウムで敗れたアントニウスが、世捨て人のように引きこもるために建てさせ、完成する前に死んだ、と2010年のAPの報道は書きます。
      # fact: cleopatra-28
      - 語り: その王宮区の一部は、今、海の下です。
      # fact: cleopatra-82
      - 語り: 水没した桟橋は、基部が海面下8メートルから9メートルで、上の端でも、5メートルから6メートルの水の下にある、とスミソニアンのスタンリーは書きます。
      # fact: cleopatra-28
      - 語り: アンミアヌス・マルケリヌスは、紀元365年の7月21日、夜明けの少しあとに、大きな地震と津波が、地中海各地を襲い、アレクサンドリアでは、大きな船が、建物の屋根に乗り上げた、と書きます。今から、1661年前です。
        card: {head: "365年7月21日", body: 地震と津波の記録}
      # fact: cleopatra-81
      - 語り: いまの水深は、出どころによって、約6メートルから8メートルなど、言い方が違います。沈んだ原因も、研究者の見方が、分かれています。
      # fact: cleopatra-73, cleopatra-75
      - 語り: この海の下を、1992年から調べてきたのが、フランク・ゴディオの、欧州水中考古学研究所です。25年あまり調べて、東の港の海底の、正確な地図を作りました。
      # fact: cleopatra-74, cleopatra-80
      - 語り: アンティロドス島では、宮殿と、イシス神殿が見つかっています。この島やポセイディウム岬は、カエサルも、アントニウスも、クレオパトラも、滞在した場所とされます。
      # fact: cleopatra-93
      - 語り: ギリシャの調査隊は、ロキアス岬の水深2メートルから10メートルに、約400の建築の部材が散らばっている、と報告しました。
      # fact: cleopatra-93
      - 語り: そして、その一部が、イシス・ロキアスの神殿や、クレオパトラの霊廟の入口だったかもしれない、と考えました。
      # fact: cleopatra-93
      - 語り: ただし、プルタルコスは、イシス神殿の近く、と書いただけです。ロキアスとも、アンティロドス島とも、書いていません。これは、1つの見立てです。
      # fact: cleopatra-94
      - 語り: 2011年のナショナル ジオグラフィックは、水中の調査は、まだ墓を見つけていない、と書きました。2026年5月、ゴディオは、霊廟の証拠は、今のところ無い、と答えています。
      # fact: cleopatra-94
      - 語り: それでも、プルタルコスの記述は正確で、墓は沈んだ都市にある、とみています。
        tone: 重い
      # fact: cleopatra-95, cleopatra-99
      - 語り: ザヒ・ハワスは、2011年に、発掘を始める前は、クレオパトラは宮殿に面して葬られたと思っていた、と話しています。
      # fact: cleopatra-95, cleopatra-99
      - 語り: ケンブリッジ大のポール・カートレッジも、2025年に、アレクサンドリアの王家の墓地に葬られた、との見方を示しました。
      - 語り: 採点します。王宮の敷地の中は、王宮区そのものなので、2点。
        figure: {type: table, title: 水没した王宮区の点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮区の一部は海の下, 2点], [イシス神殿の近く, 島にイシス神殿の遺構, 1点], [墓の証拠, 霊廟の証拠は無い, 0点]], upto: 1}
      # fact: cleopatra-80
      - 語り: イシス神殿の近くは、アンティロドス島に、イシス神殿の遺構がありますが、プルタルコスの神殿とは、決まっていません。1点。
        figure: {type: table, title: 水没した王宮区の点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮区の一部は海の下, 2点], [イシス神殿の近く, 島にイシス神殿の遺構, 1点], [墓の証拠, 霊廟の証拠は無い, 0点]], upto: 2}
      - 語り: 墓の証拠は、調べた本人が、無いと言っているので、0点。合計は、3点です。
        figure: {type: table, title: 水没した王宮区の点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮区の一部は海の下, 2点], [イシス神殿の近く, 島にイシス神殿の遺構, 1点], [墓の証拠, 霊廟の証拠は無い, 0点]], upto: 3}
      - 語り: 3つ目の候補は、王たちの墓所そのもの。ソーマです。
        tone: 疑問
        hook: true
        figure: null

  # ================================================================ 第5章 ソーマ
  - title: ソーマ　アレクサンドロスの墓さえ分からない
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: cleopatra-22, cleopatra-23
      - 語り: ストラボンは、王宮区の中の、ソーマを案内します。王たちと、アレクサンドロス大王の墓所を含む、囲いです。大王の遺体は、そのころ、ガラスの棺に入っていた、とあります。
      # fact: cleopatra-76
      - 語り: そのソーマの場所は、2つ目の食い違いとも読めます。ストラボンは、王宮の中、と書きます。後2世紀のゼノビオスは、町の真ん中に、プトレマイオス4世が建てた、と伝えます。場所の指定ではない、と読む研究者もいます。
        card: {head: "ソーマの場所", body: 王宮の中か、町の真ん中か}
      # fact: cleopatra-04
      - 語り: ただし、ストラボンは、ソーマに、クレオパトラの墓があるとは、書いていません。イシス神殿にも、触れません。
      # fact: cleopatra-29, cleopatra-30
      - 語り: そのソーマも、消えました。ディオの要約によれば、2世紀の終わりごろ、皇帝セプティミウス・セウェルスは、アレクサンドロスの墓を、封鎖させました。
      # fact: cleopatra-103
      - 語り: 3世紀の初めには、その息子のカラカラが、アレクサンドロスに、自分のマントをかけて敬意を示しました。ソーマが確かにあった、最後の記録の1つです。
      # fact: cleopatra-29, cleopatra-30
      - 語り: 4世紀の末ごろの説教者は、その墓を、彼自身の人々も、知らない、と語っています。
      # fact: cleopatra-101
      - 語り: エジプト当局が、公式に認めた、アレクサンドロスの墓の探索は、古い報告で、140件を超えます。すべて、失敗に終わった、と伝えられます。
      # fact: cleopatra-107
      - 語り: 2018年の7月。アレクサンドリアで、重さおよそ30トンの黒い花崗岩の石棺が、開けられました。大王の遺体では、と話題になりました。省は、事前に強く否定していて、出てきたのは、3人分の骨と、汚れた水でした。
      # fact: cleopatra-104
      - 語り: ネビ・ダニエル・モスクの下に墓がある、という言い伝えも、学者に否定されました。1991年にモスクで発掘が行われましたが、建物への影響を恐れた宗教関係者が、その後の発掘を止めました。
      # fact: cleopatra-108
      - 語り: ギリシャの考古学者リアナ・スヴァルツィは、シワ・オアシスの神殿の跡を、1990年代に、大王の墓だと発表しました。ギリシャ政府の首相らが、調査の中止を促しています。
      - 語り: 大王の墓さえ、見つからない町です。採点します。ストラボンは、ソーマを王宮の一部と書きますが、その場所そのものが割れていて、確かめられないので、王宮の敷地の中は、1点。
        figure: {type: table, title: ソーマの点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮の一部とストラボンは書く, 1点], [イシス神殿の近く, 触れていない, 0点], [墓の証拠, クレオパトラの墓の証拠は無い, 0点]], upto: 1}
      - 語り: イシス神殿には、触れていないので、0点。墓の証拠も、0点。合計は、1点です。
        figure: {type: table, title: ソーマの点, cols: [手がかり, 点], rows: [[王宮の敷地の中, 王宮の一部とストラボンは書く, 1点], [イシス神殿の近く, 触れていない, 0点], [墓の証拠, クレオパトラの墓の証拠は無い, 0点]], upto: 3}
      - 語り: では、なぜ、掘っても、墓は出てこないのでしょうか。
        tone: 疑問
        hook: true
        figure: null

  # ================================================================ 第6章 なぜ掘っても出ないのか
  - title: なぜ掘っても出ないのか　町の下と海の下
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: cleopatra-111
      - 語り: 理由の1つは、今のアレクサンドリアが、古代の町の上に、そのまま、立っていることです。たとえば、旧英国領事館の庭では、病院の増築のために、基礎の杭が打たれた土地で、急いで発掘が入りました。
      # fact: cleopatra-109
      - 語り: ギリシャの調査隊は、王宮区にあたる、シャララート庭園を、2007年から調べました。
      # fact: cleopatra-109
      - 語り: 建物が少なく、掘りやすいと見込んだのです。ところが、大量の近代の瓦礫と、深さ7.5メートルに現れる地下水に、阻まれました。
      # fact: cleopatra-110
      - 語り: それでも、41.5メートル×34メートルの、大きな公共の建物の基礎を、掘り当てました。広さは、約1411平方メートルです。何の建物なのかは、まだ、分かっていません。
      # fact: cleopatra-105
      - 語り: ポーランドの調査隊が、1960年から掘ったコム・エル・ディッカでは、ローマ時代の小さな劇場と浴場が出ましたが、墓と見なせる遺構は、出ませんでした。
      # fact: cleopatra-96
      - 語り: ザヒ・ハワスは、のちに、タポシリス・マグナに、墓がある証拠は、まったく無い、と述べたと伝わります。墓は、宮殿の隣にあって、水の中なので、見つからないだろう、とも。
      # fact: cleopatra-61
      - 語り: クレオパトラ研究者のデュアン・ローラーは、2011年に、墓を隠そうとした証拠は、無い、と述べました。
      # fact: cleopatra-34
      - 語り: ディオによれば、オクタウィアヌスは、エジプトを自分の支配下に置き、元老院議員が、許しなくそこに住むことを、認めませんでした。
      # fact: cleopatra-61
      - 語り: 同じ記事で、マルティネスは、オクタウィアヌスは、場所を知り、許したはずだ、と話しています。
      - 語り: 記録は、場所の手がかりをわずかしか残さず、町は、掘らせてくれず、王宮の一部は、海の下です。
        tone: しみじみ
        hook: true
      - 語り: では、採点の結果を、見てみます。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 採点の結果
  - title: 採点の結果　1位と、点の中身
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      - 語り: 結果です。1位は、水没したアレクサンドリアの王宮区、3点。タポシリス・マグナと、ソーマは、1点で並びました。
        figure: {type: bars, title: 記録の手がかりで採点した結果, bars: [[水没した王宮区, 3], [タポシリス・マグナ, 1], [ソーマ, 1]], labels: [3点, 1点, 1点], note: 6点満点}
      - 語り: 話題になっている場所では、ありませんでした。
        figure: null
        tone: しみじみ
      - 語り: 点の中身を見ます。3つの候補で、墓の証拠は、どこも、0点でした。点が付いたのは、記録が書いた、場所の手がかりのほうです。
        figure: {type: stats, title: 点の中身, items: [[王宮区, 3点, 場所の手がかりで2点＋1点], [タポシリス, 1点, イシス信仰で1点], [墓の証拠, どこも0点, 出ていない]], upto: 3}
