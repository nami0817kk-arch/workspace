# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。クレオパトラの墓はどこにあるのか。2026-11-11 作成。公開の予定は 11/14 12:00（世界史枠）。
# 型：docs/story-main.md「00. 伸びる型」の C 謎の推理型。語りは剣崎1人。創作の筋・想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「クレオパトラの墓は、どこにあるのか」。古代の記録（プルタルコス・カッシウス・ディオ・スエトニウス・ストラボン）の手がかり3つで、候補を3つ採点する。
#   記録が書くのは「アントニウスと並べて、同じ墓に葬られた」まで。場所は「イシス神殿の近く」（プルタルコス）、「王宮の敷地の中」（ディオ）としか書かない。
#   冒頭（10秒以内）＝墓は2000年あまり見つかっていない。30秒までに知らない事実3つ（墓は完成前だった・勝者は王族の墓を見なかった・場所の手がかりは一言）＋答えの席＋約束。
#   採点の決まり（第2章、約20%）：手がかり3つ、各2点の6点満点。
#     ①「王宮の敷地の中」（ディオ）に合うか　②「イシス神殿の近く」（プルタルコス）に合うか　③墓の証拠（遺体・クレオパトラの名の碑文・墓室）が出ているか
#     2点＝はっきり合う／1点＝合うかもしれないが、記録が場所を特定していない・確かめられていない／0点＝合わない・出ていない。
#   点（自分で数え直した）：        ①  ②  ③ ＝計
#     タポシリス・マグナ             0   1   0 ＝ 1  （アレクサンドリアから西へ約50km。オシリス神殿でイシス信仰とも重なる。墓・遺体・名の碑文は出ていない）
#     水没したアレクサンドリアの王宮区  2   1   0 ＝ 3  （王宮区の海の下。アンティロドス島にイシス神殿の遺構。霊廟の証拠は無い）
#     ソーマ（王家の墓所の囲い）       1   0   0 ＝ 1  （ストラボンは王宮の一部と書くが、クレオパトラの墓にも、イシス神殿にも触れない）
#   結果＝水没した王宮区が3点で1位、タポシリス・マグナとソーマが1点で並ぶ。③はどこも0点。「そこに墓がある」とは言わない。記録が指すのは王宮のそばで、墓の場所そのものは分かっていない。
# 記録の食い違いは3つ：①死因（プルタルコス3説・ストラボン2説・ディオ・オロシウス）②墓の場所の言い方（プルタルコス「イシス神殿の近く」／ディオ「王宮の敷地の中」）③ソーマの場所（ストラボン「王宮の中」／ゼノビオス「市の真ん中」）。
# 計算（自分で計算し直した）：前30年→2026年は2055年（紀元前→紀元後は0年が無いので 30＋2026−1。「2000年あまり」）／2005→2026は21年／365年→2026年は1661年／
#   1,305m÷1,036m＝約1.26倍／ストラボン「王宮は市の4分の1から3分の1」＝25〜33%／41.5m×34m＝1,411㎡／プルタルコスは前30年の100年以上あと、ディオは200年以上あと。
#   ハワスの「11年」（2024年）は発掘開始2005年と数えが合わない→使わない。2025年2月の「階段・墓の入り口」の発表は確認できなかった→使わない。
# 事実は事実カード（dev/output/rekishi-chiso/research/クレオパトラ_facts_20261111.yaml、cleopatra-01〜111）にあるものだけ。行の上に `# fact: cleopatra-NN`。
#   原文は Thayer 版 Loeb 英訳（プルタルコス・ディオ・スエトニウス・ストラボン・アッピアノス・アンミアヌス）とラテン語原文（オロシウス・フロールス・ホラティウス）で読んだ。
#   使わないこと：ファロス灯台の指輪（2026年10月、本文が確認できず）・ハワスの「11年」・2025年2月の階段の発表・ネビ・ダニエルの逸話の細部・シリッツィ/シュリーマン・「アウグストゥスが隠した」説。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
