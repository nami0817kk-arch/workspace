terms:
  大政奉還: 1867年、将軍が政権を朝廷に返したこと。上表は旧暦10月14日（11月9日）
  将軍後見職: 幼い将軍や若い将軍を助ける役。慶喜は1862年に就いた
  禁裏御守衛総督: 京都の御所を守る軍の総指揮。慶喜は1864年に就いた
  慶応の改革: 1867年、慶喜がフランスの助けを借りて進めた幕府の立て直し
  諸侯会議: 大名が集まって国の政治を決める会。慶喜の狙いはここでの主導権と説明される
  議題草案: 1867年、西周が書いた新しい政治の設計図。将軍が「大君」になる案
  王政復古: 1868年1月3日、将軍職をなくして天皇中心の政府を作ると宣言したこと
  小御所会議: 王政復古の夜に開かれた会議。慶喜の扱いが決まった
  辞官納地: 官職を辞めて領地を返すこと。小御所会議で慶喜に求められた
  錦の御旗: 天皇の軍のしるしの旗。立てられた側が官軍になった
  開陽丸: 幕府がオランダに造らせた最新の軍艦。1867年に横浜に着いた
  恭順: 戦わず、相手の言うことに従う態度をとること
  昔夢会筆記: 晩年の慶喜が、渋沢栄一たちに昔を語った聞き取りの記録
  家扶日記: 慶喜の家の家扶がつけた日記。静岡時代の暮らしが分かる

