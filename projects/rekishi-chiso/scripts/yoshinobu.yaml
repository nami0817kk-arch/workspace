en:
  title: "Tokugawa Yoshinobu: 76 Years of the Last Shogun | The Return of Power Was Not a Surrender"
  description: |-
    On the 14th day of the 10th month of 1867 (November 9 in today's calendar), Tokugawa Yoshinobu submitted the memorial returning political power to the imperial court. Dictionaries describe the aim as keeping the initiative for the Tokugawa in the new order, not simply giving up.
    We follow his life in order: born in 1837 in the Mito domain's residence in Edo and raised in Mito, adopted into the Hitotsubashi family at 10, the shogunal succession dispute and the Ansei Purge, the Kinmon Incident, a shogun for about one year who never entered Edo Castle, the Taisei Hokan and the Kogosho Conference, the night he left Osaka Castle after the Battle of Toba-Fushimi, and about 30 years in Shizuoka with photography and bicycles, until he died in 1913.
    We separate what Yoshinobu said later in life from what the records show, and we say plainly where historians disagree.
    A Japanese history video to listen to while you work (Japanese audio).
  chapters:
    - "1867: The Return of Power and Why It Was Not a Surrender"
    - "1837-1847: Shichirōmaro of Mito"
    - "1858-1862: The Man Who Missed the Shogunate"
    - "1864: Guardian of the Court and the Man of Two Minds"
    - "1866-1867: The Last Shogun and the Keiō Reforms"
    - "1867: Taisei Hōkan and the Kogosho Conference"
    - "1868: The Night He Left Osaka Castle"
    - "1868-1897: Thirty Years in Shizuoka"
    - "1897-1913: Tokyo, the Emperor and the End"
    - "Summary: Who Was Tokugawa Yoshinobu?"

