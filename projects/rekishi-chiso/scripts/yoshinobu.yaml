  # ---------------------------------------------------------------- 10 まとめ
  - title: まとめ：徳川慶喜とは何者だったのか
    background: {image: paintings/yoshinobu_portrait_late_14.jpg, credit: "晩年の徳川慶喜（写真、1913年以前）"}
    year: 1913
    lines:
      - 語り: 要点を3つにまとめます。1つ目は、大政奉還です。形では、政権を返しました。ただ、百科事典は、新しい政治で主導権を握り続けるねらいがあった、と説明します。
        figure: {type: stats, title: 徳川慶喜の3つの地層, items: [[大政奉還, 返したのは形, 主導権を握るねらい], [大坂城の夜, 理由は3つの見方, 決め手はない], [静岡の30年, 趣味に打ち込む, 自転車・写真・油絵]], upto: 1}
      - 聞き: 降参っていうより、一歩下がって、次の主導権を狙った、ってことだね。小御所の夜で逆転されたけど。
      - 語り: 答えは、少なくとも、ただの降参ではありませんでした。ただ、そのねらいが慶喜本人の考えだったのかは、分かっていません。そして、小御所の夜で、思い通りにはなりませんでした。
      - 語り: 2つ目は、大坂城の夜です。理由は今も割れていて、本人の回想には、自己弁護の面もあります。逃げた将軍と見る人もいれば、内戦を小さくした将軍と見る人もいます。
        figure: {type: stats, title: 徳川慶喜の3つの地層, items: [[大政奉還, 返したのは形, 主導権を握るねらい], [大坂城の夜, 理由は3つの見方, 決め手はない], [静岡の30年, 趣味に打ち込む, 自転車・写真・油絵]], upto: 2}
        background: {image: paintings/yoshinobu_osaka_palace_butt_1868.jpg, credit: "J.H.バット《大坂城》水彩、1868年1月"}
      - 聞き: 決め手がないから、逃げた、って決めつけるのも、立て直しのためだった、って信じるのも、どっちも言い切れないんだ。
      - 語り: 3つ目は、静岡の30年です。政治から退いても、人生は終わっていませんでした。自転車に乗り、写真を撮り、油絵を描いた時間の記録が残っています。
        figure: {type: stats, title: 徳川慶喜の3つの地層, items: [[大政奉還, 返したのは形, 主導権を握るねらい], [大坂城の夜, 理由は3つの見方, 決め手はない], [静岡の30年, 趣味に打ち込む, 自転車・写真・油絵]], upto: 3}
        background: {image: paintings/yoshinobu_cat_photo.jpg, credit: "徳川慶喜が撮影した写真《猫》19世紀"}
      - 聞き: 負けた人の、その後の人生が、日記や写真で残ってるんだね。
      - 語り: 記録に残るのは、将軍としての顔だけではありません。静岡で、夜を徹して写真機を研究し、自分の手で色を塗っていた、一人の趣味人の姿も残っています。
        background: {image: paintings/yoshinobu_portrait_hunting.png, credit: "狩猟姿の徳川慶喜（1870年代）"}
        figure: null
        tone: しみじみ
      - 聞き: あーし的には、慶喜は、政権は返したけど、主導権は手放したくなかった人、って覚えとく。思い通りにはいかなかったけど。静岡の30年は、やっと自分の時間だったのかも。
        tone: しみじみ
      - 語り: 今日の地層は、ここまでです。
        background: {image: paintings/yoshinobu_portrait_shogun.jpg, credit: "将軍時代の徳川慶喜（写真、幕末）"}
      - 聞き: 次回はベートーヴェン。「運命」を書いた人ってことしか知らないけど……耳が聞こえなくなっても、曲を書き続けたって、本当？
        tone: 疑問
      - 語り: 大政奉還は、あなたには降参に見えましたか、それとも次の一手に見えましたか。コメントで教えてください。
      - 二人: また一緒に、掘りましょう！
        tone: 明るい
