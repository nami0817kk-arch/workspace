# 徳川慶喜（10/14 19時公開・大政奉還の上表の日）。型：掘り下げ型（見どころ → 生まれから順に → まとめ：徳川慶喜とは何者だったのか）
# 事実の出どころは dev/output/rekishi-chiso/research/yoshinobu_facts.md（確実／有力／説の言い分けもそこ）。絵は research/yoshinobu_assets.md
# 慶喜は史料が多い人物。ただし『昔夢会筆記』『徳川慶喜公伝』は本人側の言い分なので、「本人はこう語った」と「記録ではこうだった」を分ける。
# 年齢は満年齢（肖像の「この時○歳」と同じ）で言い、冒頭で断る。和暦の月日は旧暦なので、西暦で言うときは換算した日を言う。
# 前後の回と重ねない：秀吉の回の最後で次回は新選組と予告したが、新選組は10/26へ回ったので、この回の次回予告はベートーヴェン（10/15 12時）。
# 弱めて言うもの：「二心殿」（出どころ未確認）・木戸孝允の「家康の再来」（原文未確認）・「千騎が一騎になろうとも」の演説（同時代史料なし）・
#   西周「議題草案」と慶喜本人の意図・大坂脱出の理由（決め手なし）・写真の「名人」（言わない）・東京へ移った日と行き先（月までにとどめる）。
# 数字を出さないもの：辞官納地の石高・静岡での生活費の額・幕府の借金・旗本領を含む総石高。
# 広告の点：戦闘の細部・流血は語らない。鳥羽伏見は兵の数と結果だけ。桜田門外の変は「井伊が討たれた」の一言。
title: 徳川慶喜の76年｜大政奉還は「降参」ではなかった 大坂城の夜と静岡の30年
