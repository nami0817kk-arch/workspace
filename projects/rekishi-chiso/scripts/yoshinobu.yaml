        card: {head: 1918年, body: 渋沢栄一編『徳川慶喜公伝』が出る}
      - 聞き: 死んだあとも、語り直されたんだ。
      - 語り: では、最後に、この徳川慶喜とは何者だったのか、まとめてみましょう。
        hook: true
      - 聞き: 降参だったのか、逃げたのか……答え、聞きたい。
