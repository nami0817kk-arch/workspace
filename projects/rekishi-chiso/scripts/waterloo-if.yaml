      body: ネイ元帥が寝返る
    figure: null
    short: s2
  - 語り: 国王ルイ18世は、パリを出ました。
  - 聞き: ネイって、王様に仕える元帥だったんでしょ？ それが、ナポレオンの側に？
    tone: 疑問
    short: s2
  - 語り: そうです。3月20日、ナポレオンはパリに入ります。ここから、約100日の天下が始まります。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background:
      image: paintings/waterloo_elba_garneray.jpg
      credit: ナポレオンを乗せて仏へ向かうブリッグ『アンコンスタン』（アンブロワーズ・ルイ・ガルヌレ、19世紀前半）
    card:
      head: 3月20日
      body: パリに入る。百日天下の始まり
    short: s2
  - 聞き: 島を出て、約3週間で、またパリの皇帝かあ。お話みたいな帰り道だね。
    tone: しみじみ
  - 語り: それより前の3月13日、ウィーン会議は、ナポレオンを「法の保護の外」に置くと宣言していました。25日には、各国が15万人ずつ出す約束をします。第七次の対仏大同盟です。
    portrait: null
    background:
      image: paintings/waterloo_congress.jpg
      credit: ウィーン会議（イザベ原画、19世紀前半の版画）
    card:
      head: 3月13日
      body: ウィーン会議の宣言
  - 聞き: 戻ってすぐに、ヨーロッパ中を敵に回したのか。クラス全員から、いっぺんに絶交されたみたいなものだよね。
    tone: 重い
  - 語り: 兵の数を並べます。ナポレオン側は約25万人、連合側は約85万人、という見積もりがあります。連合は、4つの戦線に分かれて攻める計画でした。
    background:
      image: paintings/waterloo_mapc.jpg
      credit: 《ベルギー戦役の歴史地図》（シドニー・ホール、1816年。部分）
    figure: &id011
      type: bars
      title: 兵力の見積もり（1815年）
      bars:
      - - フランス軍
        - 25
      - - 連合軍
        - 85
      labels:
      - 約25万人
      - 約85万人
      note: 連合は4つの戦線。数は文献で割れる
  - 聞き: 3倍以上かあ。数だけ見ると、重たいね。サッカーで、11人対33人くらいの差だもん。
    tone: しみじみ
  - 語り: ただ、連合はまだ、そろっていませんでした。オーストリアとロシアの大軍は遠く、侵攻の予定日は7月1日。全軍で同時に攻めるためです。
    background:
      image: paintings/waterloo_map_strat.jpg
      credit: 1815年6月1日の欧州北西部の配置図（米国陸軍士官学校歴史学科の地図。部分）
    figure: null
  - 語り: 先に動けたのは、ブリュッセル近くの、ウェリントンの軍とブリュッヘルの軍でした。
  - 聞き: じゃあ、7月1日の前に動けば、ナポレオンにも勝ち目があるんだ。ナポレオンも、それを狙ったのかな。
    tone: 納得
    hook: true
  - 語り: ナポレオンも、そう考えました。6月15日、国境を越えます。
    hook: true
- title: 6月16日〜17日 リニーとカトル・ブラ 雨の前夜
  background: &id003
    image: paintings/waterloo_cuirass.jpg
    credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
  year: 1815
  lines:
  - 語り: 北部軍は、いまのベルギーに入ります。兵は、約12万。2つの軍が1つになる前に、1つずつ叩こうとした、と説明されます。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background: *id003
  - 聞き: ウェリントンの軍と、ブリュッヘルの軍が、くっつく前に、1つずつ倒せば、数は足りるってことか。
    tone: 納得
    portrait: null
  - 語り: 6月16日、リニー。ナポレオンは、ブリュッヘルのプロイセン軍と戦います。フランスは約6万3千、プロイセンは約8万3千、とされます。結果は、フランスの勝ちです。
    portrait:
      image: paintings/waterloo_blucher.jpg
      caption: ブリュッヘル（1818年の肖像、ジョージ・ドーウ）
      age: false
    background:
      image: paintings/waterloo_map2.jpg
      credit: ワーテルローの戦い 第2図 危機（アリソン『欧州史』の地図、1852年。部分）
    card:
      head: 6月16日
      body: リニーの戦い。フランスの勝ち
  - 語り: 72歳のブリュッヘルは、騎兵の先頭で突撃し、馬が撃たれて下敷きになります。もうろうとして運び出され、参謀長のグナイゼナウが指揮を引き継ぎました。
  - 聞き: 72歳で先頭って、元気すぎない？ 今なら、定年後の年齢だよ。それで、馬に乗って突撃って。
    tone: 驚き
  - 語り: 6月16日、カトル・ブラの交差点では、ネイ元帥が、ウェリントン側と戦っていました。ネイの兵は約1万8千から2万4千。相手は、はじめ約8千です。
    portrait:
      image: paintings/waterloo_ney.jpg
      caption: ネイ元帥（1805年ごろの肖像、ジェラール）
      age: false
    background:
      image: paintings/waterloo_butler.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年）
    card:
      head: 6月16日
      body: カトル・ブラの戦い
    short: s3
  - 語り: ところがネイは、昼ごろまで、本格的に攻めませんでした。さらに、ダルロン軍団、約2万が、リニーとカトル・ブラのあいだを行き来して、どちらの戦いにも出ませんでした。
    background:
      image: paintings/waterloo_cuirass_b.jpg
      credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
    card:
      head: ダルロン軍団
      body: どちらの戦場にも出ず
    short: s3
  - 聞き: 2万人が、2つの戦場の真ん中を、うろうろしてたの？ もったいなさすぎない？ どっちかに入ってれば、結果が変わったかもしれないのに。
    tone: 驚き
    short: s3
  - 語り: 6月17日。ナポレオンは、遅く出発し、昼すぎにカトル・ブラに着きます。ウェリントンは、もう北へ退いていました。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background:
      image: paintings/waterloo_sadler_mid.jpg
      credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
  - 語り: ウェリントンは、ナポレオンと同じ1769年の生まれです。2人が戦場で向き合うのは、これが初めてでした。
    portrait:
      image: paintings/waterloo_wellington.jpg
      caption: ウェリントン公（1815〜16年ごろの肖像、ローレンス）
      age: false
  - 語り: プロイセン軍も、北のワーヴルへ退いていました。ブリュッヘルは、グナイゼナウが折れた、公爵に合流する、と語ったと伝わります。
    portrait:
      image: paintings/waterloo_blucher.jpg
      caption: ブリュッヘル（1818年の肖像、ジョージ・ドーウ）
      age: false
  - 聞き: 72歳の元帥が、ウェリントンのほうへ向かう、って決めたんだね。ここで2つの軍が、つながるんだ。
    tone: 納得
  - 語り: ナポレオンは、グルーシーに約3万3千を預け、プロイセンを追わせます。夜、大雨が降りました。
    portrait:
      image: paintings/waterloo_grouchy.jpg
      caption: グルーシー元帥（1835年の肖像、ルイヤール）
      age: false
    background:
      image: paintings/waterloo_map1_c.jpg
      credit: ワーテルローの戦い 第1図 朝（アリソン『欧州史』の地図、1852年。部分）
    card:
      head: 6月17日
      body: グルーシーに約3万3千を預ける
  - 聞き: その雨は、次の日の戦いに、関係したの？
    tone: 疑問
    hook: true
  - 語り: はい。6月18日の朝から、見ていきます。
    hook: true
- title: 6月18日 午前11時のワーテルロー 近衛隊が退くまで
  background: &id004
    image: paintings/waterloo_cuirass.jpg
    credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
  year: 1815
  lines:
  - 語り: 6月18日の朝、雨は止みましたが、地面はぬかるんでいました。ナポレオンは、大砲と騎兵のために、乾くのを待ちます。開戦は、午前11時から正午ごろ、とされます。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background: *id004
    card:
      head: 開戦の遅れ
      body: ぬかるみで午前11時すぎ
  - 聞き: 待った分だけ、プロイセンが近づくじゃん。あーしなら、ぬかるみでも、早く始めたくなっちゃうけど。待たなくてよかったんじゃない？
    tone: 疑問
  - 語り: そういう議論はあります。けれど、地面がどれだけ乾くかも、開戦の時刻も、文献で割れていて、確定していません。
  - 語り: まず、兵の数です。ナポレオン軍は、歩兵が約5万、騎兵が約1万5千、砲兵と工兵が約8千。大砲は約250門です。ウェリントン側は約6万8千で、大砲は156門。数は文献で割れます。
    background:
      image: paintings/waterloo_cuirass_b.jpg
      credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
  - 語り: ウェリントン側は、英国人だけの軍ではありません。英国人は約3万1千。残りは、オランダ・ベルギー人、ハノーファー人、ブランシュヴァイク人、ナッサウ人です。
    background:
      image: paintings/waterloo_andrieux.jpg
      credit: 《ワーテルローの戦い》（クレマン＝オーギュスト・アンドリュー、1852年）
    figure:
      type: bars
      title: ウェリントン軍の内訳（千人・約）
      bars:
      - - 英国
        - 31
      - - オランダ・ベルギー
        - 17
      - - ハノーファー
        - 11
      - - ブランシュヴァイク
        - 6
      - - ナッサウ
        - 3
      labels:
      - 約3万1千
      - 約1万7千
      - 約1万1千
      - 約6千
      - 約3千
      note: 合計は約6万8千。数は文献で割れる
  - 聞き: 英国の軍だと思ってたけど、英国人は半分もいないんだ。いろんな国の人の寄せ集めで、よく持ちこたえたね。
    tone: 驚き
  - 語り: さらに約1万7千は、ハレという町に置かれ、戦場にいなかった、とも書かれます。後方の守りです。
    figure: null
  - 語り: 午前から、ユーゴモンの農場では、ナポレオンの弟ジェロームの師団が、陽動のつもりで攻めていました。ところが、一日の消耗戦に変わります。
    portrait: null
    background:
      image: paintings/waterloo_cuirass.jpg
      credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
    card:
      head: ユーゴモン
      body: 陽動が一日の消耗戦に
  - 語り: ウェリントンの言葉と伝わるのが、戦いの成否は、ここを守れるかにかかっていた、です。
  - 聞き: 囮のつもりが、いちばん長引くなんて。ナポレオン、計算が狂っちゃったね。
    tone: 驚き
  - 語り: 正午前後から、ナポレオンの大砲84門が、ウェリントンの陣を撃ちました。ぬかるみで砲弾が跳ねず、被害は小さかった、という説明です。
    background:
      image: paintings/waterloo_butler.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年）
  - 聞き: 砲弾が跳ねないと、威力が落ちちゃうのか。ぬかるみは、ウェリントンの味方だったんだね。
    tone: 納得
  - 語り: 午後1時半ごろ、ダルロンの軍団が、横に約250人の幅の縦隊で、ライ麦畑を進みました。丘の上まで迫りましたが、ピクトン隊と、スコッツ・グレイズの騎兵に押し戻されたのです。
    portrait: null
    background:
      image: paintings/waterloo_butler_l.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年。部分）
    card:
      head: 午後1時半
      body: ダルロン軍団の攻撃
  - 語り: 同じころ、ナポレオンは、東の遠くに、プロイセンの先頭を見ました。
  - 語り: 午後4時ごろ、ネイの騎兵が、何度も突撃します。ぬかるみと、英軍の方陣と砲に阻まれました。ナポレオンは「1時間早すぎた」と言ったと伝わりますが、止めなかった、とされます。
    background:
      image: paintings/waterloo_cuirass_b.jpg
      credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
    card:
      head: 午後4時ごろ
      body: ネイの騎兵の突撃
  - 聞き: 騎兵が、何度もはね返されて……。馬で突っ込んで、四角い壁にぶつかるって、想像するだけで怖いね。
    tone: しみじみ
  - 語り: 午後4時までに、フランス軍の約7千が、プロイセン軍の約3万を足止めしていました。ビューローは、午後4時半、プランスノワへの道が開いた、と記します。
    portrait: null
    background:
      image: paintings/waterloo_plance.jpg
      credit: プランスノワへのプロイセン軍の攻撃（アドルフ・ノルテン、1864年。部分）
    card:
      head: 午後4時半
      body: プランスノワへの道が開く
  - 語り: 午後6時ごろ、ネイの攻撃で、ラ・エー・サントの農場が落ちます。ツィーテンのプロイセン軍が、戦いに入ってきたのも、このころです。
    portrait:
      image: paintings/waterloo_ney.jpg
      caption: ネイ元帥（1805年ごろの肖像、ジェラール）
      age: false
    background:
      image: paintings/waterloo_haye.jpg
      credit: ラ・エー・サントの攻防（リヒャルト・クネーテル、19世紀後半〜20世紀初め）
    card:
      head: 午後6時ごろ
      body: ラ・エー・サントが落ちる
  - 語り: 午後7時半ごろ、ナポレオンは、近衛隊、約4千を前に出します。しかし、反撃で崩れ、「近衛が退く」という叫びが広がり、フランス軍は総崩れになりました。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background:
      image: paintings/waterloo_crofts.jpg
      credit: 《ワーテルローでの最後の総攻撃》（アーネスト・クロフツ、1895年。部分）
    card:
      head: 午後7時半ごろ
      body: 近衛隊約4千の攻撃
    short: s5
  - 聞き: 近衛隊って、最強の部隊でしょ？ それが退いたら、みんな逃げるよね。
    tone: 驚き
    short: s5
  - 語り: 損害は、文献で割れます。フランス軍は、約2万5千から3万3千。ウェリントン軍は、約1万7千。プロイセン軍は、約6千6百から7千です。
    portrait: null
    background:
      image: paintings/waterloo_andrieux.jpg
      credit: 《ワーテルローの戦い》（クレマン＝オーギュスト・アンドリュー、1852年）
    figure:
      type: stats
      title: ワーテルローの損害（文献の幅）
      items:
      - - フランス軍
        - 約2万5千〜3万3千
        - 文献で割れる
      - - ウェリントン軍
        - 約1万7千
      - - プロイセン軍
        - 約7千
        - 約6600〜7000
    short: s5
  - 聞き: ウェリントン側も、1万7千も……。勝った側でも、これだけ減るんだ。ぎりぎりの勝負だったんだね。
    tone: 重い
    short: s5
  - 語り: 戦場では、少なくとも7千頭の馬が、死ぬか傷つきました。戦いのあと、フランス軍では、約1万5千が脱走し、大砲約220門が失われた、とされます。
    figure: null
  - 語り: 夜、ウェリントンとブリュッヘルは、ラ・ベル・アリアンスの近くで会った、とされます。
    portrait:
      image: paintings/waterloo_wellington.jpg
      caption: ウェリントン公（1815〜16年ごろの肖像、ローレンス）
      age: false
    background:
      image: paintings/waterloo_cuirass_b.jpg
      credit: 《ワーテルローの胸甲騎兵の突撃》（アンリ・フェリックス・エマニュエル・フィリポトー、1874年。部分）
  - 聞き: 勝った側の2人が、顔を合わせたんだね。この場面が、無かったことになる世界を、考えるのかな。
    tone: しみじみ
  - 語り: ここで、冒頭の数字に戻ります。3万3千人と、約5万人の、行方です。
    portrait: null
    hook: true
- title: 6月18日 グルーシーとプロイセン 負けた理由
  background: &id005
    image: paintings/waterloo_map1_c.jpg
    credit: ワーテルローの戦い 第1図 朝（アリソン『欧州史』の地図、1852年。部分）
  year: 1815
  lines:
  - 語り: グルーシーの軍は、約3万3千。18日は、ワーヴルで、プロイセンの後衛、約1万7千と戦っていました。
    portrait:
      image: paintings/waterloo_grouchy.jpg
      caption: グルーシー元帥（1835年の肖像、ルイヤール）
      age: false
    background: *id005
    card:
      head: 6月18日
      body: グルーシーはワーヴルで戦う
  - 語り: 午前11時半ごろ、遠い戦場の方角から、大砲の音が聞こえます。部下のジェラール将軍は、砲声に向かって進もう、と勧めました。グルーシーは、命令どおり、ワーヴルの戦いを続けます。
    background:
      image: paintings/waterloo_sadler_right.jpg
      credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
  - 聞き: 音が聞こえてたのに、行かなかったの？ あーしなら、胸騒ぎして走っちゃうかも。でも、勝手に動いて外れたら、責任重大だよね。
    tone: 疑問
  - 語り: グルーシーは、17日、プロイセンがどの道を退いたか、つかめていませんでした。命令も、あいまいでした。
  - 聞き: 命令があいまいだと、現場は迷うよね。
    tone: しみじみ
  - 語り: ナポレオンも、午前10時ごろ、新しい命令を出しています。プロイセンを攻めろという、スールトの手紙は、午後1時に書かれました。
    background:
      image: paintings/waterloo_andrieux_b.jpg
      credit: 《ワーテルローの戦い》（クレマン＝オーギュスト・アンドリュー、1852年。部分）
    card:
      head: 午後1時
      body: スールトが手紙を書く
  - 語り: その手紙が届いたのは、夕方から夜で、時刻は文献で割れます。グルーシーが、ワーテルローの敗北を知ったのは、翌19日の午前10時半です。
    card:
      head: 夕方以降
      body: 手紙がグルーシーに届く
  - 語り: ワーヴルの戦いは、18日から19日まで続きました。戦術では、フランスの勝ちです。でも、プロイセンの後衛が足止めに成功したので、戦略では、プロイセンの成功とされます。
  - 聞き: 戦いに勝っても、足止めされたら、負けみたいなものか。
    tone: しみじみ
  - 語り: ブリュッヘル側は、1個軍団をワーヴルに残してグルーシーを止め、約4万8千から5万のプロイセン軍を、ワーテルローへ向かわせていました。
    background:
      image: paintings/waterloo_plance.jpg
      credit: プランスノワへのプロイセン軍の攻撃（アドルフ・ノルテン、1864年。部分）
    card:
      head: ブリュッヘルの手
      body: 1個軍団でグルーシーを止める
    figure:
      type: bars
      title: 動かせた軍の数（約）
      bars:
      - - ワーヴルのグルーシー軍
        - 33000
      - - 戦場へ向かったプロイセン軍
        - 48000
      labels:
      - 約3万3千
      - 約4万8千〜5万
      note: 数は文献で少し割れる
  - 聞き: 同じ3万3千が、もし、戦場にいたら……。冒頭の数字が、ここでつながるんだね。
    tone: しみじみ
    figure: null
  - 語り: ナポレオンの体調も、よく話題になります。痔や膀胱の病気で、動きが鈍かった、という見方があります。ただ、これは推測で、確かめられた事実ではありません。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background:
      image: paintings/waterloo_crofts.jpg
      credit: 《ワーテルローでの最後の総攻撃》（アーネスト・クロフツ、1895年。部分）
  - 語り: 歴史家のアンドリュー・ロバーツは、痔があったことは認めつつ、それでは遅れは説明できないとみます。ナポレオンは、午前8時には、服を着て馬に乗っていたからです。
    card:
      head: ロバーツの見方
      body: 痔では遅れを説明できない
  - 聞き: 仕事でも、体調のせいにしたくなる日はあるけど、時間で見ると別の話になるんだね。体調だけじゃ、決め手にならないのか。
    tone: 納得
  - 語り: 戦場の指揮は、多くをネイに任せていました。ナポレオン自身は、ロソムの丘から、ラ・ベル・アリアンスの近くへ動いたとされます。
    background:
      image: paintings/waterloo_butler_r.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年。部分）
  - 語り: 負けた原因は、ひとつでは言えません。遅れ、ネイの突撃、グルーシー、プロイセンの到着。どれが決め手だったかは、歴史家のあいだで、議論が続いています。
    background:
      image: paintings/waterloo_sadler_left.jpg
      credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
  - 聞き: じゃあ、ひとつだけ変えたら、どうなるの？
    tone: 疑問
    hook: true
  - 語り: その前に、負けたあとの史実を見ます。
    hook: true
- title: 6月22日〜1821年 退位とセントヘレナ ウィーン体制
  background: &id006
    image: paintings/waterloo_pieneman_c.jpg
    credit: 《ワーテルローの戦い》（ヤン・ウィレム・ピーネマン、1824年。部分）
  year: 1815
  lines:
  - 語り: 6月22日、ナポレオンは、息子のナポレオン2世に譲る形で、2度目の退位をします。百日天下は、ここで終わりました。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background: *id006
    card:
      head: 6月22日
      body: 2度目の退位
    figure:
      type: stats
      title: 百日天下の年表（1815年）
      items:
      - - パリ入り
        - 3月20日
        - 百日天下の始まり
      - - 2度目の退位
        - 6月22日
        - 約94日後
      - - ルイ18世が復位
        - 7月8日
        - 約110日後
  - 語り: 百日天下という名ですが、実際は約3か月です。パリ入りから退位まで約94日、ルイ18世の復位までなら、約110日と数えます。
  - 聞き: 100日って、数え方しだいなんだね。ぴったりじゃないのに、名前だけ残ったよ。
    tone: 納得
  - 語り: 7月7日、連合軍はパリに入り、翌8日、ルイ18世が戻ります。ナポレオンは、7月15日に英艦ベレロフォン号に身を預け、10月、南大西洋のセントヘレナ島へ送られました。
    background:
      image: paintings/napoleon_saint_helena_ship_1826.jpg
      credit: セントヘレナ島沖の英国軍艦（ウィリアム・ジョン・ハギンズ、1826年ごろ）
    figure: null
  - 聞き: 逃げ場が、島ひとつになっちゃった。南大西洋の、ぽつんとした島だよね。
    tone: 重い
  - 語り: 1821年5月5日、島で亡くなります。51歳でした。
    year: 1821
    background:
      image: paintings/waterloo_sainthelena.jpg
