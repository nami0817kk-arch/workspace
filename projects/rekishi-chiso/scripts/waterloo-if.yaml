sections:
- title: 1815年6月18日 戦場にいなかった3万3千人
  background: &id001
    image: paintings/waterloo_sadler_left.jpg
    credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
  year: 1815
  lines:
  - 語り: 1815年6月18日、いまのベルギーのワーテルロー。ワーテルローの戦いは、2つの数字で語られます。戦場にいなかった約3万3千人と、午後に戦場へ着いた約4万8千から5万人です。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background: *id001
    card:
      head: 6月18日
      body: ワーテルローの戦い
    short: s1
  - 聞き: 戦場にいなかった人たちが、勝ち負けを決めたってこと？ 約3万3千って、大きなスタジアムが満員になる数だよ。すごい数じゃない？
    tone: 驚き
    short: s1
  - 語り: 約3万3千は、ナポレオンがグルーシー元帥に預けた軍です。プロイセン軍を追うため、前の日に別れました。この日は、ワーヴルという町で戦っていました。
    background:
      image: paintings/waterloo_butler_l.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年。部分）
    figure:
      type: stats
      title: 6月18日の数字（約）
      items:
      - - グルーシーの軍
        - 約3万3千
        - 戦場の外にいた
      - - 午後に着いたプロイセン軍
        - 約4万8千〜5万
        - 戦場へ向かった
      - - ナポレオンの軍
        - 約7万2千
        - ワーテルローの兵
    short: s1
  - 聞き: 別の町に3万人、横から5万人。数だけ聞くと、ナポレオンが気の毒になるよ。でも、それで負けたって、いったい何があったんだろう。
    tone: しみじみ
  - 語り: そこで、今日の問いです。もし、プロイセン軍の到着が間に合わず、ナポレオンが勝っていたら。ヨーロッパの行く先は、どうなったのか。問いは3つあります。
    portrait: null
    background:
      image: paintings/waterloo_map1.jpg
      credit: ワーテルローの戦い 第1図 朝（アリソン『欧州史』の地図、1852年。部分）
    card:
      head: 今日の3つの問い
      body: 連合は？ 帝政は？ 欧州は？
    figure: null
  - 語り: 1つ目。連合軍は、侵攻をやめたのか。2つ目。ナポレオンの帝政は、続いたのか。3つ目。その先のヨーロッパは、どう変わったのか。
  - 聞き: その3つって、連合と、ナポレオン本人と、ヨーロッパ全体、ってことでいいのかな。
    tone: 疑問
  - 語り: ここでいう勝ちは、翌日も戦場を押さえること、とします。連合軍が退き、ナポレオン軍が戦場に残る形です。
  - 聞き: ワーテルローの「もしも」って、有名すぎない？ ゲームや小説なら山ほどありそうだけど、ちゃんと研究した人、いるの？
    tone: 疑問
    background:
      image: paintings/waterloo_pieneman_b.jpg
      credit: 《ワーテルローの戦い》（ヤン・ウィレム・ピーネマン、1824年。部分）
  - 語り: 先に断ります。ワーテルローの勝利のあとを、正面から数字で論じた学術研究は、今回の調査では見つかっていません。見つかったのは、歴史家の見方と、思考実験です。
    background:
      image: paintings/waterloo_sadler_right.jpg
      credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
    card:
      head: 最初の断り
      body: 論じた研究は見つからない
  - 聞き: じゃあ、想像ばっかりになっちゃわない？ あーし、根拠のない話って、ちょっと苦手かも。材料って、あるの？
    tone: 疑問
  - 語り: 材料は、史料に残る事実だけです。想像のあいだは《ここから想像》の札を出し、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background:
      image: paintings/waterloo_andrieux.jpg
      credit: 《ワーテルローの戦い》（クレマン＝オーギュスト・アンドリュー、1852年）
    card:
      head: この回の約束
      body: 事実と想像を分け、札を付ける
  - 聞き: 事実と想像は、ちゃんと分けてくれるんだね。それで、最初は何から見るの？
    tone: 納得
  - 語り: はい。1815年2月、エルバ島から掘ります。
    hook: true
- title: 1815年2月〜6月 エルバ島から百日天下へ 連合の大軍
  background: &id002
    image: paintings/waterloo_elba_beaume.jpg
    credit: 《エルバ島を発つナポレオン》（ジョゼフ・ボーム、1836年）
  year: 1815
  lines:
  - 語り: 1815年2月26日、ナポレオンは、約1千人を連れて、地中海のエルバ島を出ます。3月1日、南フランスのゴルフ・ジュアンに上陸しました。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
