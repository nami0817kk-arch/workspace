# B（歴史の転換点の if ストーリー）。型：事実（百日天下・リニーとカトル・ブラ・6月18日・グルーシーとプロイセンの到着）→ 史料と論考に残る別の道（朝の攻撃／グルーシーが砲声へ向かう／プロイセンが合流しない）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/waterloo_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は waterloo_if_assets.md。ナポレオンの回（napoleon.yaml）とは、身長・独裁・辞書・毒殺・ハイチを扱わず、ワーテルローと百日天下に絞って重ならないようにした。
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles のナポレオン想像・ネイ想像・ウェリントン想像・ブリュッヘル想像・アレクサンドル想像・メッテルニヒ想像） ③記録のセリフは本編に置かない。
#   同じ幕で声が重ならない：第1幕＝ナポレオン（玄野武宏）とネイ（黒沢冴白）／第2幕＝ウェリントン（麒ヶ島宗麟）とブリュッヘル（雀松朱司）／第3幕＝アレクサンドル（白上虎太郎）とメッテルニヒ（離途）。
# 分岐点は1つだけ：1815年6月18日、プロイセン軍の到着が間に合わず、夜、ナポレオンが戦場を押さえた（どう間に合わなかったかは決めない。史実で割れる分かれ目＝開戦の遅れ・グルーシー・プロイセンの合流を「別の道」の節で並べる）。ほかは史実のまま（連合の大軍と7月1日の侵攻予定・ウィーン会議の宣言・国内の分裂）。
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で出す。声に出す札は、各幕に1回と最後のまとめに絞る（「可能性は、〜、です」の連発を避けた）。
#   高い＝プロイセン軍は壊滅しない（リニーのあと2日で戦場に来た史実）／連合は侵攻をやめない（3/13の宣言・3/25の約束・7/1の予定が史実）／ありうる＝ウェリントン軍は退くが壊滅しない・ナポレオンは翌日も追撃する・数週間から数か月で帝政が続かなくなる／ほぼ妄想＝追撃の成果・オーストリアの単独和平・ウィーン体制の形・100年先の因果。
# 研究：「ワーテルローで勝ったあと」を正面から論じた学術研究は見つかっていない（冒頭と想像の節で断る）。見つかったのは、ロバーツ（良かったとみる）・ザモイスキ（和平の条件は無理）・トレヴェリアン（敵は常備軍を保つ）・フォレストら（結末は変わらない）の見方と、思考実験（アロン・ユフェンデルほか）。本文は未読（紹介記事の要約）。
# 数字は何の数かを言う：兵力は文献で割れる（ワーテルローの仏7.2〜7.4万、グルーシー約3.3万＝約1.7万のティールマンと戦う、プロイセン約4.8万〜5万が戦場へ（図の注・語りとも「約4万8千〜5万」に統一））。損害は幅で言う。年齢は ブリュッヘル72歳（出典あり）以外は言わない。
# 使わない話：血・遺体の細部／ウェリントンの発言（「一番きわどい勝負」は「伝わる話」「確かな記録とは言えない」と断る）／ロスチャイルドの株の逸話／日本との接点／ネットの意見・ブログ。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像は額）／縦横比2.4:1以上の絵は使わない（サドラーの横長は左右に切り出した版）／大字の図・地図は全面背景に使いすぎない／現代の写真は使っていない。
# 10-22 確認3件の指摘を反映：スールトの手紙は午後1時に書かれ、届いた時刻は割れる／ネイは「寝返る」（14日）／ザモイスキは出典未確認と断る／ウェリントン軍の損害は史実の数字と断る／歴史家4人の見方は想像の外（札「ここからは歴史家の見方」）／退位の行は百日天下の年表の図。napoleon.yaml と重なる死因・退位の細部は削った。
title: もしナポレオンがワーテルローで勝っていたら｜プロイセン軍の到着が間に合わなかった日、ヨーロッパはどうなったか
