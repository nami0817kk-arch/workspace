en:
  title: What If Napoleon Had Won at Waterloo? | The Day the Prussians Arrived Too Late
  description: 'On June 18, 1815, near Waterloo in today''s Belgium, Napoleon''s last battle can be told with two numbers: about 33,000 men under Marshal Grouchy who were not on the battlefield, and about 50,000 Prussians who arrived in the afternoon. This video asks: what if the Prussians had been too late and Napoleon had won?


    We keep records, theories and imagination apart. First, what the sources say: the Hundred Days from Elba to Paris, the Seventh Coalition and its planned invasion date of July 1, Ligny and Quatre Bras, the rain, the delayed start, Marshal Ney''s cavalry, the Imperial Guard, Grouchy at Wavre, and the aftermath through Saint Helena and the Congress of Vienna.


    Then, clearly marked imagination with reasons: the night of June 18, Wellington and Blucher on June 19, the allied sovereigns'' headquarters, a table of fates, and how Europe might differ. In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual in detail, and we say so. Views by Andrew Roberts, Adam Zamoyski, G. M. Trevelyan and Alan Forrest are summarized from articles; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'June 18, 1815: 33,000 Men Who Were Not on the Battlefield'
  - From Elba to the Hundred Days, and the Coalition
  - 'June 16-17: Ligny, Quatre Bras and the Rain'
  - 'June 18: Waterloo from Eleven in the Morning'
  - Grouchy, the Prussians and Why Napoleon Lost
  - 'After Waterloo: Abdication, Saint Helena, the Vienna Order'
  - 'Other Paths in the Sources: Earlier Attack, Grouchy, the Prussians'
  - 'Imagination 1: The Night of June 18'
  - 'Imagination 2: Wellington and Blucher on June 19'
  - 'Imagination 3: The Allied Headquarters'
  - 'Imagination 4: A Table of Fates'
  - 'Imagination 5: Europe''s Turning Points and Rival Views'
  - 'Summary: Two Numbers on June 18'
