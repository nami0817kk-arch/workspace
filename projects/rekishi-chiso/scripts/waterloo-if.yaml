    card:
      head: 1821年5月5日
      body: セントヘレナ島で没、51歳
  - 語り: ネイ元帥は、8月に逮捕され、11月に裁判を受け、12月7日に処刑されます。3月に寝返った、あの決断の結末です。
    year: 1815
    portrait:
      image: paintings/waterloo_ney.jpg
      caption: ネイ元帥（1805年ごろの肖像、ジェラール）
      age: false
    background:
      image: paintings/waterloo_elba_steuben.jpg
      credit: 《エルバ島からのナポレオンの帰還》（シャルル・ド・ステューベン、1818年）
    card:
      head: 12月7日
      body: ネイ元帥が処刑される
  - 語り: 第7連隊を率いて合流したラ・ベドワイエール大佐も、国王の政府に処刑されました。
    portrait: null
  - 聞き: 勝つ側につくか、負ける側につくかで、こんなに違うなんて。ネイも、3月の時点では、どっちが勝つか分からなかったはずなのに。
    tone: 重い
  - 語り: 11月には、パリで条約が結ばれ、連合軍の占領軍が、北フランスに残りました。指揮は、ウェリントンです。
    portrait:
      image: paintings/waterloo_wellington.jpg
      caption: ウェリントン公（1815〜16年ごろの肖像、ローレンス）
      age: false
    background:
      image: paintings/waterloo_map_strat.jpg
      credit: 1815年6月1日の欧州北西部の配置図（米国陸軍士官学校歴史学科の地図。部分）
    card:
      head: 11月
      body: 占領軍が北フランスに残る
  - 語り: 戦いの9日前、6月9日に、ウィーン会議の最終議定書は、すでに結ばれていました。国境と勢力均衡を守る、いわゆるウィーン体制です。1914年ごろまで、外交の指針になったと言われます。
    portrait:
      image: paintings/waterloo_metternich.jpg
      caption: メッテルニヒ（1815年の肖像、ローレンス）
      age: false
    background:
      image: paintings/waterloo_congress2.jpg
      credit: 《ヨーロッパの再生》ウィーンの君主の集い（1814年の彩色版画。部分）
    card:
      head: 6月9日
      body: ウィーン会議の最終議定書
  - 聞き: 戦いの前に、もう取り決めはできてた、ってこと？
    tone: 疑問
  - 語り: では、史料や研究に、別の道は残っているのか。次は、そこを見ます。
    hook: true
- title: 1815年6月 史料と論考に残る別の道 グルーシーとプロイセン
  background: &id007
    image: paintings/waterloo_butler_l.jpg
    credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年。部分）
  year: 1815
  lines:
  - 語り: 想像の前に、実際に議論されてきた別の道を、4つ見ます。1つ目。開戦が早い道です。
    portrait:
      image: paintings/napoleon_study_david.jpg
      caption: ナポレオン（1812年の肖像、ダヴィッド）
      age: false
    background: *id007
    card:
      head: 別の道 1
      body: 朝に攻める
  - 語り: 前夜の雨で、地面はぬかるんでいました。もっと早く攻めていれば、という議論があります。とはいえ、早く攻めても、ぬかるみが砲と騎兵を鈍らせたかもしれず、結果は分かりません。
  - 聞き: 早く攻めても、ぬかるみにはまるだけかもしれないのか。戦いを決めるのは、天気と地面でもあるんだね。
    tone: 納得
  - 語り: 2つ目。グルーシーが、砲声に向かう道です。ジェラールの進言どおりなら、約3万3千が戦場に近づきます。ロベール・アロンの『ワーテルローの勝利』などが、この道を描きました。
    portrait:
      image: paintings/waterloo_grouchy.jpg
      caption: グルーシー元帥（1835年の肖像、ルイヤール）
      age: false
    background:
      image: paintings/waterloo_map1.jpg
      credit: ワーテルローの戦い 第1図 朝（アリソン『欧州史』の地図、1852年。部分）
    card:
      head: 別の道 2
      body: グルーシーが砲声に向かう
  - 語り: 3つ目。プロイセンが、ウェリントンに合流しない道です。グナイゼナウの退く先は、研究で見方が割れます。
    portrait:
      image: paintings/waterloo_blucher.jpg
      caption: ブリュッヘル（1818年の肖像、ジョージ・ドーウ）
      age: false
    background:
      image: paintings/waterloo_map2.jpg
      credit: ワーテルローの戦い 第2図 危機（アリソン『欧州史』の地図、1852年。部分）
    card:
      head: 別の道 3
      body: プロイセンが合流しない
  - 語り: ウェリントンと連絡を保つため北へ退いた、とみる人もいれば、リエージュのほうへ向かっていた、とみる人もいます。
  - 語り: 4つ目。カトル・ブラで、違いが出る道です。ウェリントンの命令に、現地の将軍たちが従っていれば、カトル・ブラは、おそらくフランス側に落ちた、という見方です。
    portrait:
      image: paintings/waterloo_ney.jpg
      caption: ネイ元帥（1805年ごろの肖像、ジェラール）
      age: false
    background:
      image: paintings/waterloo_butler.jpg
      credit: 《スコットランドよ永遠に》（エリザベス・トンプソン〈レディ・バトラー〉、1881年）
    card:
      head: 別の道 4
      body: カトル・ブラで違いが出る
  - 語り: 歴史家ロングフォードの論として紹介されます。
  - 聞き: カトル・ブラは、ネイが迷った場所でもあったよね。そこで違いが出るなら、確かに大きいかも。でも、どれか1つだけで、ひっくり返るの？
    tone: 疑問
  - 語り: そこは、分かりません。歴史家の本にも、フランスの勝ちから書いた思考実験があります。戦場の別の道を描いた本は、いくつもあります。
    portrait: null
    background:
      image: paintings/waterloo_pieneman_b.jpg
      credit: 《ワーテルローの戦い》（ヤン・ウィレム・ピーネマン、1824年。部分）
  - 語り: 分かれ目は、ひとつだけ。プロイセンの到着が間に合わず、夜、ナポレオンが戦場を押さえた、という形です。どう間に合わなかったかは、決めません。
    background:
      image: paintings/waterloo_sadler_left.jpg
      credit: ワーテルローの戦い（ウィリアム・サドラー2世、19世紀前半。部分）
  - 聞き: 勝った夜、ナポレオンは、何て言うんだろう。
    tone: しみじみ
    hook: true
  - 語り: 場面は、勝った夜の戦場です。
    hook: true
