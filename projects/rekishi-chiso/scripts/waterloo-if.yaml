    short: s2
  - 聞き: たった1千人で、国に戻ってきたの？ あーしなら、怖くて足が止まっちゃう。王様の軍隊は、どうしたの？
    tone: 驚き
  - 語り: 送り込まれた軍が、次々と彼の側につきました。3月5日に、グルノーブルの第5連隊。14日には、ネイ元帥が、約6千人を連れて、寝返ります。
    portrait:
      image: paintings/waterloo_ney.jpg
