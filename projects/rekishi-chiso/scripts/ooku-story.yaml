thumbnail:
  layout: classic
  cast: false
  image: paintings/ooku_chiyoda_371.jpg
  crop: [0, 0, 2600, 1300]
  name: 大奥
  lead: 休日なし・手紙は親類だけ
  main: どうしてた？
  # サムネは別に Gemini の絵で作り込む（out/ooku-story_thumbnail.png）。この欄は check と仮の thumb のため。

sections:
  # ================================================================ 序章（冒頭 約3分）。答えは最後の章まで言わない
  - title: 華やかな大奥の絵は、大奥がなくなってから描かれた　1895年
    background: {image: paintings/ooku_chiyoda_371.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1895
    lines:
      # fact: ooku-47, ooku-79
      - 語り: 大奥と聞いて浮かぶ、着飾った女性たちが、花見や遊びに興じる、あの絵。描かれたのは、大奥がなくなって、《26年》もたってからでした。
        tone: 重い
        card: {head: "明治27〜29年（1894〜96年）", body: 大奥がなくなって26〜28年後の錦絵}
      # fact: ooku-47
      - 語り: 絵の題は、《千代田の大奥》。明治の半ばに刷られた、40枚の錦絵です。
      # fact: ooku-64
      - 語り: では、本当の奥女中は、どんな毎日を送っていたのか。大奥にいた、ある元女中は、のちに、こう語っています。奥の者には、休日というものが、《ありません》。
        tone: 重い
      # fact: ooku-07
      - 語り: いちばん下の女中は、3年のあいだ、足袋をはくことも、できなかったといいます。
      # fact: ooku-01, ooku-32
      - 語り: 給金は、役ごとに、米と金で、細かく決まっていました。金の手当がいちばん多い御年寄と、いちばん下とでは、40倍の開きです。
        card: {head: "給金の開き", body: 金の手当だけで40倍}
      # fact: ooku-16, ooku-38
      - 語り: しかも、上の女中は、自分の給金で、自分の使用人を、何人も雇っていました。
      # fact: ooku-21
      - 語り: 手紙を出せる相手も、法令で、決められていました。祖父母、親、兄弟姉妹、おじおば、甥や姪、子や孫まで、です。
      # fact: ooku-71
      - 語り: そして、家に帰れる休みは、上の女中には、ありませんでした。
        tone: 重い
      - 語り: 花見の絵の裏で、奥女中は、毎日、何をしていたのか。元女中たちの話と、幕府の法令、給金の帳面から、その毎日を、たどっていきます。
        tone: 疑問
        hook: true
      - 語り: まずは、朝十時です。
        hook: true

  # ================================================================ 第1章 1日はどう始まったか
  - title: 朝十時の総触　奥女中の1日は、どう始まったのか
    background: {image: paintings/ooku_chiyoda_364.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1858
    lines:
      # fact: ooku-59
      - 語り: 奥女中が住んだのは、長局と呼ばれる、大奥の中の宿舎です。毎朝、そこから、御殿の中の持ち場へ、通いました。
      # fact: ooku-80
      - 語り: 住む棟は、役ごとに決まっていました。一の側に御年寄、二の側に御客会釈や御錠口、三の側と四の側に表使など。どの側に住むかで、すぐに格式が分かった、と三田村鳶魚は書き添えています。
      # fact: ooku-58
      - 語り: 1日の大きな行事は、朝の総触でした。将軍が、御鈴廊下を通って大奥へ入り、朝のあいさつを受ける儀式です。
        card: {head: "総触", body: 朝、御鈴廊下でご機嫌伺い}
      # fact: ooku-58
      - 語り: 一般の女中たちは、御鈴廊下に平伏して、あいさつするだけだった、と、山本博文さんの講座の資料にあります。
      # fact: ooku-10
      - 語り: 明治の聞き書き、『旧事諮問録』で、元女中は、朝十時に御鈴廊下へ入って、ご機嫌伺いをする、と答えています。
      # fact: ooku-29
      - 語り: ただ、三田村鳶魚は、御鈴廊下は名のとおり廊下なのに、入って、どこでするのか分からない、と、この答えを疑っています。
      # fact: ooku-08
      - 語り: 元女中の大岡ませ子さんが仕えた天璋院は、総触のときは、必ず足袋をはきました。夏などは、総触が済むと、すぐに脱がせた。足袋は、1日限りで、替えたといいます。
      # fact: ooku-64, ooku-65
      - 語り: では、女中の勤めは、どうなっていたのか。三田村鳶魚が、1930年の本、『御殿女中』に書き留めた、大岡ませ子さんの話があります。
        card: {head: "三田村鳶魚『御殿女中』", body: 1930年・元女中の聞き書き}
      # fact: ooku-64
      - 語り: 奥の者には、休日というものがありません。八ッ出と、明け番とが、あるだけです。
        tone: 重い
      # fact: ooku-65
      - 語り: 八ッ出というのは、午後の2時に出て、七つ、午後4時に引く勤めです。わずか、2時間でした。
        figure: {type: stats, title: 大岡ませ子が語った勤めの表, items: [[八ッ出, 2時間, 午後2時〜4時], [明け番, 3時間, 午前7時〜10時], [お中臈の泊り, 12時間, 夜10時〜翌朝10時]], upto: 1}
      # fact: ooku-66
      - 語り: 明け番は、泊りの翌日です。午前6時に、いったん帰って、7時に、ちょっと出て、10時に引きます。
        figure: {type: stats, title: 大岡ませ子が語った勤めの表, items: [[八ッ出, 2時間, 午後2時〜4時], [明け番, 3時間, 午前7時〜10時], [お中臈の泊り, 12時間, 夜10時〜翌朝10時]], upto: 2}
      # fact: ooku-67
      - 語り: 将軍や御台所のそば近くに仕える、お中臈の泊りは、前の夜の10時から、翌朝の10時まで。12時間です。
        figure: {type: stats, title: 大岡ませ子が語った勤めの表, items: [[八ッ出, 2時間, 午後2時〜4時], [明け番, 3時間, 午前7時〜10時], [お中臈の泊り, 12時間, 夜10時〜翌朝10時]], upto: 3}
      # fact: ooku-11
      - 語り: 御年寄の泊りは、また違います。朝の10時に出て、午後の2時に、一度帰り、夜の8時に、また出るのです。
        figure: null
      # fact: ooku-66
      - 語り: しかも、早く帰れたのは、御年寄と、将軍付きのお中臈だけ。御台所付きなどのお中臈は、用が多くて、昼過ぎでないと、引けなかったといいます。
      # fact: ooku-83
      - 語り: 食事も、勤めの場で取りました。御台所付きのお中臈は、奥で食べるときは、お下段に毛氈を敷いて、人数分の膳を、御膳所から運ばせた、といいます。
      # fact: ooku-82
      - 語り: 静かなだけでも、ありません。毎日ではないものの、精進日のほかは、正午から、夜の6時か10時まで、お鳴り物、つまり、音曲がありました。
      - 語り: 休みの日は無く、短い勤めと、長い泊りが、順に回ってくる。今でいえば、交代の勤務表です。
        tone: 重い
      # fact: ooku-34
      - 語り: では、この勤めで、いくらもらえたのか。
        tone: 疑問
        hook: true
      - 語り: 給金の帳面を、開いてみます。
        hook: true

  # ================================================================ 第2章 給金
  - title: 給金はいくらだったのか　切米・合力金・扶持
    background: {image: paintings/ooku_chiyoda_379.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1853
    lines:
      # fact: ooku-34
      - 語り: 奥女中の給金は、武士と同じ形で、3つありました。米で渡す切米。着物などのための金、合力金。そして、毎日の米、扶持です。10人扶持なら、10人分の米という意味です。
      # fact: ooku-34
      - 語り: 給金は、5月と10月の、年2回に分けて渡された、と nippon.com の連載は書いています。
        card: {head: "給金の3つ", body: 切米・合力金・扶持}
      # fact: ooku-15
      - 語り: 合力金は、着物などの費用の、特別な手当のようなもの。三田村鳶魚は、そのはじまりは、春日局の申し出にある、と書いています。
      # fact: ooku-01
      - 語り: 幕末の13代将軍、家定付きの女中の表が、残っています。御年寄は、切米50石、合力金80両、10人扶持。
        figure: {type: stats, title: 家定付きの奥女中の給金（一部）, items: [[御年寄, 合力金80両, 切米50石・10人扶持], [上臈御年寄, 合力金60両, 切米50石・10人扶持], [御半下（いちばん下）, 合力金2両, 切米4石・1人扶持]], upto: 1}
      # fact: ooku-31
      - 語り: おもしろいのは、その上です。最も位の高い、上臈御年寄の合力金は、60両。下の御年寄より、20両、少ないのです。
        figure: {type: stats, title: 家定付きの奥女中の給金（一部）, items: [[御年寄, 合力金80両, 切米50石・10人扶持], [上臈御年寄, 合力金60両, 切米50石・10人扶持], [御半下（いちばん下）, 合力金2両, 切米4石・1人扶持]], upto: 2}
      # fact: ooku-31
      - 語り: この表は、松尾美恵子さんの論文の表を、nippon.com の記事が引いたもの。山本博文さんの講座の資料も、御年寄を、50石、80両としています。
      # fact: ooku-32
      - 語り: そして、いちばん下の御半下は、切米4石、合力金2両、1人扶持。
        figure: {type: stats, title: 家定付きの奥女中の給金（一部）, items: [[御年寄, 合力金80両, 切米50石・10人扶持], [上臈御年寄, 合力金60両, 切米50石・10人扶持], [御半下（いちばん下）, 合力金2両, 切米4石・1人扶持]], upto: 3}
      # fact: ooku-01, ooku-32
      - 語り: 御年寄と比べると、切米で12倍あまり、合力金では、40倍の開きです。
        tone: 重い
        figure: null
      # fact: ooku-14
      - 語り: ただ、記録によって、数が違います。三田村鳶魚が載せた、別の分限の書付では、上臈御年寄は、切米100石、合力金100両、15人扶持。
        card: {head: "上臈御年寄の給与", body: 記録で100石・100両と50石・60両}
      # fact: ooku-14
      - 語り: 幕末の『御老女衆記』では、50石、60両、10人扶持です。鳶魚は、自分の載せた書付は寛政のころのものらしく、文久になって、大きく改められた、と書いています。
        figure: {type: stats, title: 上臈御年寄の給与　記録ごとの違い, items: [[『御殿女中』の書付, 100石・100両, 寛政ごろか・15人扶持], [『御老女衆記』, 50石・60両, 幕末・10人扶持], [家定付きの表, 50石・60両, 松尾美恵子・10人扶持]], upto: 3}
      # fact: ooku-78
      - 語り: では、今のお金なら、いくらか。日本銀行の貨幣博物館は、18世紀の1両を、米の値段で比べると、約6万円。大工の賃金で比べると、約35万円、と書いています。
        figure: null
        card: {head: "1両の目安（18世紀）", body: 米で約6万円・大工の賃金で約35万円}
      # fact: ooku-78
      - 語り: 幕末になると、米の値段で比べた1両は、4千円から1万円ほどまで下がる、とも書いています。
      # fact: ooku-78, ooku-01
      - 語り: その目安で、御年寄の合力金、80両だけを換えてみます。18世紀の米の値段なら480万円、大工の賃金なら2800万円。幕末の米の値段なら、32万円から80万円です。
        figure: {type: stats, title: 御年寄の合力金80両を今のお金にすると, items: [[18世紀・米の値段で, 約480万円, 1両＝約6万円], [18世紀・大工の賃金で, 約2800万円, 1両＝約35万円], [幕末・米の値段で, 約32万〜80万円, 1両＝約4千〜1万円]], upto: 3}
      # fact: ooku-52, ooku-53
      - 語り: 何と比べるか、いつの値段かで、桁まで変わる。記事ごとに換算の前提が違うので、御年寄の年収は、1200万円とも、2600万円とも書かれます。切米と扶持の米は、ここでは換えません。
        figure: null
      - 語り: 御年寄の給金は、確かに、大きかった。けれど、その給金で、養わなければならない人たちがいました。
        tone: 疑問
        hook: true
      - 語り: 部屋の中に、もう一つの職場があったのです。
        hook: true

  # ================================================================ 第3章 部屋方
  - title: 女中が女中を雇っていた？　長局の部屋方とゴサイ
    background: {image: paintings/ooku_chiyoda_394.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1858
    lines:
      # fact: ooku-55
      - 語り: 部屋方。奥女中が、自分で雇った使用人です。長局の、その女中の部屋に、一緒に住んで、働きました。山本博文さんの、大奥の用語の解説にあります。
        card: {head: "部屋方", body: 奥女中が自分で雇った使用人}
      # fact: ooku-16
      - 語り: 大岡ませ子さんの話では、御年寄の部屋には、局が1人、側が6人、炊事をするタモンという下女が4人。ほかに、男のゴサイが2人いました。
        figure: {type: stats, title: 御年寄の部屋の使用人（大岡ませ子の話）, items: [[局, 1人, 大岡ませ子の話], [側, 6人, 大岡ませ子の話], [タモン（炊事の下女）, 4人, ほかに男のゴサイ2人]], upto: 3}
      # fact: ooku-17
      - 語り: 御年寄より下の、二の側と呼ばれる部屋でも、局が1人、相の間が2人、小僧が1人、タモンが2人。都合、6、7人いた、と語っています。
        figure: null
      # fact: ooku-38
      - 語り: いちばん下の女中、お末でさえ、自分の召使いを、1人使っていた、と、山本さんの資料は、柴田宵曲の本から引いています。
      # fact: ooku-16
      - 語り: 男のゴサイは、奥の部屋までは来られません。毎日、大奥の入口の、役人の詰め所の裏まで来て、実家への使いや、町の買い物など、外の用を足しました。
      # fact: ooku-18
      - 語り: その給金は、1年に、2両2分。ませ子さんは、こうも語っています。ゴサイは、雇われている女主人の物を盗むのが、仕事だと言われておりました。
        card: {head: "ゴサイの給金", body: 1年に2両2分}
      # fact: ooku-77
      - 語り: ゴサイが出入りするには、御門の札が要りました。御年寄は、男の扶持が3人ぶんなので、札も3枚。ませ子さん自身は、1枚だった、といいます。
        card: {head: "御門の札", body: 御年寄は3枚・ませ子は1枚}
      # fact: ooku-30
      - 語り: 一生勤める部屋方のために、主人が、頼母子講の無尽を組んでやることも、あったといいます。積み立てで、まとまったお金を作る仕組みです。
      - 語り: 大奥は、女中の上に、女中がいて、その下に、また女中がいる。長局のひと部屋ひと部屋が、小さな家でした。
        tone: 重い
      # fact: ooku-68
      - 語り: では、その、いちばん下の働き手は、何をしていたのか。
        tone: 疑問
        hook: true
      - 語り: 水汲みから、始まります。
        hook: true

  # ================================================================ 第4章 いちばん下の勤め
  - title: いちばん下の勤めは何をしていたのか　オタモンと御末
    background: {image: paintings/ooku_chiyoda_398.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    lines:
      # fact: ooku-68
      - 語り: もう一つの聞き書きがあります。大野という人が、母の話を書いた、『母の御本丸の話』。三田村鳶魚は、それを本に収めています。母は、大奥で、部屋方として勤めた人です。
      # fact: ooku-68
      - 語り: 部屋方に上がると、はじめは、オタモンをしなければならない。オタモンは、ずいぶん、つらい役で、水を汲むだけでも、たやすいことではない。
        tone: 重い
        card: {head: "オタモン", body: 部屋方のはじめの下働き}
      # fact: ooku-68
      - 語り: 大きな玄蕃桶を持って行って、深い井戸から、大きな釣瓶で、かけ声をかけながら、二人で汲み上げる。二人で担ぐと、太い杉丸太の棒が、しなるほどの重さだった、といいます。
      # fact: ooku-69
      - 語り: 日を決めて、オタモンどうしで、廊下と台所を掃除する、大掃除の日もありました。その日には、台所の上の天井まで、水を、ざぶざぶかけて、少しのちりも、残らないようにした。
        card: {head: "大掃除", body: 台所の天井まで水をかけた}
      # fact: ooku-70
      - 語り: 米の仕事もあります。扶持の米は、1人前、1日3合。それを、1か月分ずつ、玄米で渡されました。
      # fact: ooku-70
      - 語り: 扶持の数だけ人を置く部屋では、毎日毎日、オタモンが、大きなすり鉢で、ごりごりと、手で白くしました。人を減らして、白い米を取り寄せる部屋も、あったといいます。
        tone: 重い
      # fact: ooku-07
      - 語り: そして、お末です。大奥の雑用を受け持つ、いちばん下の女中です。お末は、3年のあいだは、足袋をはくことができず、はきものは、せんぞく草履でした。
        card: {head: "お末", body: 3年のあいだ足袋をはけない}
      # fact: ooku-54
      - 語り: 柴田宵曲の本によれば、お末は、将軍家の駕籠を担いだり、召し上がりものの水仕事をしたりしました。ただ、同じ本は、同僚が50人もいて、さほどの苦労でもなかった、とも書いています。
      # fact: ooku-26
      - 語り: お末は、町人の娘でも、取り親を立てれば、奉公できた、と、江戸の記録『青標紙』は書いています。
      # fact: ooku-36
      - 語り: 山本博文さんの資料では、お末頭から下には、御家人、町人、名主、百姓の娘が、混ざっていました。
      - 語り: 錦絵の、絹の着物の女性たち。その裏で、毎日の水と米を運んでいたのは、別の女性たちでした。
        tone: 重い
      # fact: ooku-71
      - 語り: では、この人たちは、いつ、家に帰れたのか。
        tone: 疑問
        hook: true
      - 語り: 休みの決まりも、法令に書かれていました。
        hook: true

  # ================================================================ 第5章 宿下りと手紙（通説の検証はこの章）
  - title: 休みと手紙はどうしてた？　宿下りの法度と誓詞　1670年から1721年
    background: {image: paintings/ooku_chiyoda_386.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1721
    lines:
      # fact: ooku-71
      - 語り: 宿下り。奉公人が、休みをもらって、家へ帰ることです。三田村鳶魚は、こう書きます。宿下りは、将軍に会える身分、御目見以上の者には、ない。
        card: {head: "宿下り", body: 御目見以上には無い}
      # fact: ooku-71
      - 語り: それより下の者は、5年目ごとに宿下りするのと、3年目ごとに宿下りするのとが、あった。
        figure: {type: stats, title: 宿下り　三田村鳶魚の書き方, items: [[御目見以上, なし, 将軍に会える上の女中], [御目見以下, 5年目ごと, または3年目ごと], [家族が会いに来る, 長局へ呼べる, 享保6年の定で親族を限る]], upto: 2}
      # fact: ooku-19
      - 語り: 寛文10年、1670年の女中の法度は、宿へ出るときは、老女4人に伺って、その指図しだいで、日数を決めて出るように、と定めています。
        figure: null
        year: 1670
      # fact: ooku-20
      - 語り: 奉公のはじめに出す誓いの書き物には、こうあります。宿下りのときも、見物や遊びの場所へは、行かないこと。
      # fact: ooku-21
      - 語り: 享保6年、1721年の定めです。女中の手紙のやりとりは、祖父、祖母、父母、兄弟、姉妹、おじ、おば、甥、姪、子や孫までに、限ること。
        year: 1721
        card: {head: "享保6年（1721年）", body: 手紙は親族の中だけ}
      # fact: ooku-72
      - 語り: 宿下りのない女中のところへ、長局まで呼び寄せてよいのは、祖母、母、娘、姉妹、伯母、姪。男の子は、9歳までの子どもと、兄弟、甥、孫。
        figure: {type: stats, title: 宿下り　三田村鳶魚の書き方, items: [[御目見以上, なし, 将軍に会える上の女中], [御目見以下, 5年目ごと, または3年目ごと], [家族が会いに来る, 長局へ呼べる, 享保6年の定で親族を限る]], upto: 3}
      # fact: ooku-61
      - 語り: 奥のことは、親兄弟であっても、一切、話さない。その誓いも、立てたといいます。
        figure: null
      - 語り: では、奥女中は、城の中に、閉じ込められていたのか。
        tone: 疑問
      # fact: ooku-45, ooku-56
      - 語り: 2025年、東京国立博物館の特別展を伝えた美術手帖の記事は、御年寄について、大奥のことを外に出さないため、生涯、江戸城から出てはいけない決まりがあった、と紹介しています。
        card: {head: "閉じ込められていたのか", body: 記録と研究で見方が分かれる}
      # fact: ooku-43
      - 語り: ところが、研究者の見方は違います。畑尚子さんの2010年の博士論文は、女だけが奥に閉じ込められていた、という世間の見方を、否定しています。
      # fact: ooku-44
      - 語り: 福田千鶴さんも、2019年の講演で、大奥は、閉鎖的な空間だが、実際の出入りは、緩やかだったと見る必要がある、と話しています。理由の一つは、春日局のような有力な女中が、大奥の外に、屋敷を持っていたことです。
        figure: {type: stats, title: 奥女中は閉じ込められていたのか, items: [[東博展の記事（2025）, 城を出られない, 御年寄について], [畑尚子（2010）, 閉鎖性を否定, 博士論文], [福田千鶴（2019）, 出入りは緩やか, 講演]], upto: 3}
      # fact: ooku-81
      - 語り: 大岡ませ子さんの話にも、部屋へ物売りの婆さんがやって来て、包みを広げ、かんざしや紅白粉を出した、という場面があります。
        figure: null
      - 語り: 法令は、厳しく書かれていました。実際に、どこまで守られていたのかは、研究者のあいだでも、見方が分かれています。
        tone: 重い
        figure: null
      - 語り: 休みも手紙も、限られた職場で、女中たちは、何を目指していたのか。
        tone: 疑問
        hook: true
      - 語り: 出世の道があったのです。
        hook: true

  # ================================================================ 第6章 出世と辞めたあと
  - title: 出世はできたのか　双六と、30年勤めた人の年金　1744年
    background: {image: paintings/ooku_chiyoda_372.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1744
    lines:
      # fact: ooku-63
      - 語り: 江戸の終わりに、《奥奉公出世双六》という双六が、出ています。マスには、お末から、御部屋様までの役が並びます。御部屋様は、将軍の子を産んだ女性の呼び名です。江戸東京博物館が持っています。
        card: {head: "奥奉公出世双六", body: 江戸の終わりの双六}
      # fact: ooku-48
      - 語り: 2025年、東京国立博物館で展示を担当した人は、取材に、この双六は、なかなか上がれない、と話しています。ゴールの手前で、御小姓に戻されることも、ある。
      # fact: ooku-63
      - 語り: 国立国会図書館は、町人の層から奥仕えをする者が選ばれることは少なく、当時の女性の、夢を描いた双六だろう、と説明します。
      # fact: ooku-37
      - 語り: 女中の手紙も、残っています。八王子千人同心の娘で、使番という役を勤めた女性は、同僚に、自分の経歴や実家を、高く見せていた。実家への手紙から、それが分かる、と畑尚子さんの研究は伝えます。
      # fact: ooku-39
      - 語り: 部屋方の吉野みちは、実家に、こう書き送りました。もはや、お部屋に、11年も勤めております。
        tone: 重い
      # fact: ooku-39
      - 語り: 30歳を過ぎ、一生奉公か、暇をもらって嫁ぐか。占いやおみくじまで引いて、迷っていた、と山本博文さんの資料は紹介します。
        tone: 重い
      # fact: ooku-42
      - 語り: 上の女中は、一生奉公が原則でした。下の女中には、町家の娘が行儀見習いに来て、決まった年数で、暇をもらって帰る者もいた、と、世界大百科事典は書きます。
      # fact: ooku-57
      - 語り: 大奥に勤めたという箔をつけて、よい縁談を得る。それが一つの目標だった、と和樂webの記事は書いています。
      # fact: ooku-27
      - 語り: その縁談について、驚くような記録があります。正徳4年、1714年。儒学者の室鳩巣が、手紙に書きました。
        year: 1714
      # fact: ooku-27
      - 語り: 器量のよい女中、50人余りに、暇を出した。器量の悪い女は、人の妻にも望まれないだろうから、そのまま召し使う、と。
        year: 1714
        card: {head: "正徳4年（1714年）", body: 器量のよい50人余りに暇}
      # fact: ooku-22, ooku-35
      - 語り: 一方、勤め続けた人には、手当がありました。延享元年、1744年。30年以上勤めた女中が、病気で辞めるときは、切米か合力金の多い方と、扶持を、一生、渡す。
        year: 1744
        card: {head: "延享元年（1744年）", body: 30年以上勤めた人に一生の手当}
      # fact: ooku-22
      - 語り: 鳶魚は、大奥の職員は、病気か老いのほかは、引退を許されない、と書いています。だからこその、年金でした。
      # fact: ooku-23
      - 語り: 嘉永6年、1853年には、髪を下ろして尼の姿になるのは、原則、60歳以上で、長く勤めた者に限る、という達しも出ています。
        year: 1853
      # fact: ooku-40
      - 語り: 大岡ませ子さんは、安政5年、1858年に、13歳で大奥に入り、それから10年、勤めました。
        year: 1858
      - 語り: 双六と、手紙と、年金の決まり。そこに見えるのは、華やかさではなく、勤めの年数と、身の振り方でした。
        tone: 重い
      # fact: ooku-73
      - 語り: では、華やかな大奥という像は、どこから来たのか。
        tone: 疑問
        hook: true
      - 語り: その像は、明治に、作られていきました。
        hook: true

  # ================================================================ 第7章 華やかな像はどこから来たのか
  - title: 華やかな大奥は、どこから来たのか　1891年の聞き書きと1895年の錦絵
    background: {image: paintings/ooku_chiyoda_363.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    year: 1891
    lines:
      # fact: ooku-25
      - 語り: 大奥の人数は、時代で大きく変わりました。慶安4年、1651年。3代将軍家光が亡くなると、女中1000人余りと、下働きの女性2700人余りに、暇が出された、と『玉露叢』にあります。
        year: 1651
        card: {head: "慶安4年（1651年）", body: 合わせて3700人余りに暇}
      # fact: ooku-73
      - 語り: その大奥がなくなって、23年後。明治24年、1891年から、帝国大学の史学会の人たちが作った会が、旧幕府の人々に話を聞き、本にしていきました。『旧事諮問録』です。元女中も、そこで答えています。
        year: 1891
        card: {head: "明治24年（1891年）から", body: 『旧事諮問録』で元女中に聞く}
      # fact: ooku-73
      - 語り: 答えたのは、12代将軍家慶の大奥で中臈だったという、箕浦はな子さん。そして、14代家茂の大奥で、お次という役を勤めた女性です。
      # fact: ooku-74
      - 語り: ところが、同じ大奥にいた大岡ませ子さんは、はな子さんについて、こう言います。はな子は、天璋院様のお小姓でした。父が二の丸にいたというのは、嘘です。
        tone: 重い
        card: {head: "元女中どうしの食い違い", body: 父が二の丸に居たは嘘}
      # fact: ooku-75, ooku-29
      - 語り: 三田村鳶魚は、『旧事諮問録』を読んで、こうした話は、誰にも上手に聞けないものだ、と書きました。ある問答には、答えが曖昧で、まったく分からなくなってしまった、とも書いています。
      # fact: ooku-46
      - 語り: 研究も、長く、この形でした。1970年ごろまで、明治の回顧録や、好事家の話が中心で、確かな研究は無理だと言われていた、と、畑尚子さんの研究の審査の要旨は書いています。
      # fact: ooku-47, ooku-79
      - 語り: そして、明治27年から29年。楊洲周延の《千代田の大奥》が、40点、刷られました。花見や舟遊び、雛人形の飾り。着飾った女性たちの、年中行事の絵です。
        year: 1895
        card: {head: "《千代田の大奥》", body: 明治27〜29年・全40点}
      # fact: ooku-47
      - 語り: 2025年、東京国立博物館の特別展、江戸大奥展は、その第1章を、「あこがれの大奥」と名づけました。人々が、大奥に抱いてきた、あこがれを、見る章です。
      - 語り: 誰も見ることのできなくなった大奥を、明治の人たちは、聞き書きと、錦絵で、思い描いた。華やかな大奥の像は、なくなってから、さらに形づくられていきました。
        tone: 重い
      - 語り: 最後に、冒頭の絵に、戻ります。
        hook: true
      - 語り: 花見の絵の、外側の1日です。
        tone: 疑問
        hook: true

  # ================================================================ まとめ（冒頭の錦絵に戻る。余韻の一文）
  - title: まとめ：奥女中の1日は、どんなものだったのか
    background: {image: paintings/ooku_chiyoda_371.jpg, credit: "楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）"}
    lines:
      - 語り: 奥女中の1日の大きな行事は、朝十時の総触でした。勤めは、八ッ出と、明け番と、泊り。休日というものは、ありませんでした。
        tone: しみじみ
      - 語り: 給金は、役ごとに、米と金で決まり、上の女中は、その給金で、自分の部屋の女中を雇いました。いちばん下では、井戸の水を担ぎ、玄米をすり鉢で白くし、足袋もはかずに、働く人もいました。
      - 語り: 宿下りと手紙は、法令で限られ、出世の双六は、なかなか上がれない。30年以上勤めて、病で辞める人には、一生の手当が出ました。
      - 語り: 花見の錦絵に描かれたのは、行事の日の大奥です。その外側に、毎日の、職場がありました。
        tone: しみじみ
        pause: 0.8
      - 語り: 着飾った女性たちの絵を、次に見るときは、その裏で、水を運び、米を白くしていた女性たちのことも、思い出してください。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null

