# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  大奥と聞いて思い浮かぶ、着飾った女性たちが花見や遊びに興じる、あの錦絵。描かれたのは、大奥がなくなって26年もたってからでした。
  記録に残る奥女中の毎日は、だいぶ違います。ある元女中は「奥の者には、休日というものがありません」と語りました。
  この動画でわかること
  ・朝十時の総触と、八ッ出・明け番・泊りの勤めの表
  ・切米・合力金・扶持。役ごとに決まっていた給金と、記録ごとの違い
  ・女中が自分で雇った女中「部屋方」と、天井まで水をかける大掃除
  ・宿下りと手紙の決まり、出世の双六、30年勤めた人の年金
  ・華やかな大奥の像は、いつ、どこから来たのか
description_note: |-
  元女中の話は、三田村鳶魚『御殿女中』（春陽堂、1930年）の頁の画像で読みました。『旧事諮問録』（1891年）の本文は確認できておらず、『御殿女中』が引いた部分によります。法令と分限は『古事類苑』（1914年）の翻刻（文字の読み取り）で読みました。
  給金の数は、松尾美恵子さんの表を引いた nippon.com の記事（小林明さん）と、山本博文さんの講座資料（東京都立中央図書館）によります。円の目安は日本銀行貨幣博物館の「18世紀の1両は、米価で約6万円、大工の賃金で約35万円」「幕末は米価で約4千円〜1万円」を使い、合力金だけを換えました。比べる物と時代で桁まで変わるので、目安です。
  『母の御本丸の話』は、大野若三郎さんが母の話を書いたもので、三田村鳶魚『御殿女中』に収められています。
  絵は、楊洲周延《千代田の大奥》（1895年ごろ。メトロポリタン美術館、CC0）などのパブリックドメインの作品です。室内・人物の後ろ姿や手もとの画像の一部は、画像生成AIで作った想像上のイメージで、実在の写真ではありません。サムネイルの人物像も AI による想像図です。

en:
  title: "Was the Ōoku Really Glamorous? A Day of the Shogun's Ladies-in-Waiting Was More Like a Job"
  description: |-
    The famous prints of richly dressed women enjoying cherry blossoms in the shogun's inner palace were made 26 years after the Ōoku ceased to exist.
    The records tell a different story. One former lady-in-waiting said: "In the inner palace, there was no such thing as a day off."
    In this video you will learn:
    - The 10 a.m. morning greeting and the shift system of the inner palace
    - How salaries were set for each rank in rice and gold, and how the records disagree
    - The maids hired by the maids themselves, and a cleaning day that splashed water up to the ceiling
    - The rules on home leave and letters, a promotion board game, and the pension for 30 years of service
    - Where the glamorous image of the Ōoku came from
    Japanese-language history video (Japanese audio).
  chapters:
    - "The Glamorous Prints Were Made After the Ōoku Was Gone"
    - "What Did a Day Look Like? 10 a.m. and the Shift System"
    - "What Were They Paid? Rice, Gold, and Rations"
    - "Maids Who Hired Their Own Maids"
    - "The Lowest Jobs: Water, Rice, and No Tabi Socks"
    - "Home Leave and Letters: Were They Locked In?"
    - "Promotion, and Life After Service"
    - "Where Did the Glamorous Image Come From? 1891 and 1895"
    - "Summary: What Was a Day in the Ōoku Like?"

