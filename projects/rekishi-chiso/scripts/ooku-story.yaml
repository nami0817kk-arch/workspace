# 物語型の本編（scripts/_template_story.yaml・sankin-story.yaml の型）。大奥の奥女中（役目の回）。2026-11-06 下書き。公開の予定は 11/08 19:00（日本史枠）。
# 型：docs/story-main.md「00. 伸びる型」の E 暮らし型。主語は「奥女中」という1つの役目で、最後まで主役。
#   誰でも持つ像＝「華やかな大奥」（着飾った女たち・花見・遊び）。裏返す像＝勤めの表・給金の表・誓詞・宿下りの決まりがある「職場」。
#   入口（冒頭10秒）＝華やかな大奥の絵の代表《千代田の大奥》は、大奥がなくなって26〜28年後（明治27〜29年）に描かれた（ooku-47・79）。
#   問いは「何をしていた／どうしてた」。「なぜ」は字に出さない。語りは剣崎1人。想像の台詞なし（imagined なし）。
#   和宮の回（10/29）とは中身を重ねない：和宮・天璋院・家茂の話はしない（天璋院は大岡ませ子の話の中の名前だけ）。将軍の側室・大奥の権力争い・絵島事件もしない。
#   第1章 朝十時の総触と勤めの表（休日なし・八ッ出・明け番・泊り）
#   第2章 給金の中身（切米・合力金・扶持。上臈御年寄の給与の食い違い。日銀の目安で自分で換算）
#   第3章 女中が雇う女中（部屋方・ゴサイ・御門札）
#   第4章 一番下の勤め（オタモンの水汲み・天井まで水の大掃除・玄米を擂鉢で・足袋なしの3年）
#   第5章 宿下りと手紙（法度・誓詞。通説の検証「閉じ込められていたのか」：東博の展示解説と畑尚子・福田千鶴）
#   第6章 出世と、辞めたあと（双六・身分・手紙・年金・剃髪・器量の話）
#   第7章 華やかな像はどこから来たのか（明治の聞き書き『旧事諮問録』と、ませ子の「嘘です」・鳶魚の「曖昧」・1895年の錦絵・2025年の東博展）
#   まとめ（冒頭の錦絵に戻る）。締めは余韻の一文＋登録のお願い（story: true）。
# 記録の食い違いを並べたのは3か所：①上臈御年寄の給与（『御殿女中』所引の分限 切米百石・合力金百両・十五人扶持／『御老女衆記』五十石・六十両・十人扶持）
#   ②旧事諮問録の答え手の素性（はな子本人の答え／大岡ませ子「父が二の丸に居たと云ふのは嘘です」）③閉じ込められていたのか（東博展の解説／畑尚子・福田千鶴）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/奥女中_facts_20261106.yaml、ooku-01〜79）にあるものだけ。行の上に `# fact: ooku-NN`。
#   三田村鳶魚『御殿女中』（春陽堂、1930。NDL デジタル 1447416）は、頁の画像で読んだ（91・250・251・364・365・374・375・42・43頁）。OCR だけのもの（コマ88・162・190 など）は画像と照らしていない。
#   ooku-09（お末が井戸で水汲み）は読み違い：画像では「オタモン」（部屋方の下働き）の仕事。台本は ooku-68 を使う。
#   『旧事諮問録』の本文は開けなかった（NDL の画像の取得が止まった）。答え手と総触の答えは『御殿女中』が引いた部分で言う。
#   『古事類苑』（1914。NDL 897657）の法令・分限・鳩巣の書簡は OCR で読んだ（画像は未見）。
# 計算（自分で計算し直した）：
#   《千代田の大奥》明治27〜29年＝1894〜96年。江戸城の明け渡し 1868年 → 26〜28年後。旧事諮問録 明治24年＝1891年 → 23年後。
#   八ッ出 14時→16時＝2時間。中臈の泊り 22時→翌10時＝12時間。明け番 6時に帰り 7時→10時＝3時間。
#   御年寄 切米50石・合力金80両・10人扶持（松尾美恵子の表を転載した nippon.com・山本博文）／御半下 4石・2両・1人扶持 → 切米 12.5倍・合力金 40倍・扶持 10倍。
#   上臈御年寄 合力金60両（nippon.com の表）＜ 御年寄 80両 → 20両多い。
#   円は日本銀行貨幣博物館の目安（18世紀の1両＝米価で約6万円・大工の賃金で約35万円、幕末＝米価で約4千〜1万円）で、合力金だけを換える：80両 → 480万円／2,800万円／32万〜80万円。切米・扶持は換えない。
#   慶安4年 1,000余＋2,700余＝3,700余。弘化3年 469人 → 慶応元年 411人＝58人減。延享元年＝1744年。享保6年＝1721年。寛文10年＝1670年。正徳4年＝1714年。嘉永6年＝1853年。安政5年＝1858年、13歳＋10年。
# 「と伝わる」「といわれる」は出どころが1つで本文を開けていない事実と、出どころ自身が「と言われ」と書く事実にだけ使う（1本10回まで）。
