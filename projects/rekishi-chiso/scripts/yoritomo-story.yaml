sections:
  # ================================================================ 導入（冒頭 約3分）。答え（欠けた理由を言い切れる史料は無い・確かなのは日付だけ）は最後の章まで言わない
  - title: 創業者の死は、幕府の歴史書から消えた　1199年
    background: {image: paintings/yoritomo_azuma_najda_v16.jpg, credit: "『吾妻鏡』第16巻（国立公文書館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：Q01（夜明けの鎌倉の海と、浜に向かう谷の遠景。人物なし）
    year: 1199
    lines:
      # 0〜10秒：知らない事実（吾妻鏡に頼朝の死が書かれていない・約3年分の記事が無い）
      # fact: yoritomo-01
      - 語り: 鎌倉幕府が自らまとめた歴史書、『吾妻鏡』。その中に、初代の将軍、源頼朝が、いつ、どうやって死んだのかは、書かれていません。
        tone: 強調
        card: {head: "『吾妻鏡』", body: 頼朝の死の記事が無い}
      # fact: yoritomo-01
      - 語り: 第15巻は、建久6年、1195年の12月で終わります。次の第16巻は、建久10年、1199年の2月から。頼朝が亡くなった1月を含む、およそ3年分の記事が、まるごと、ありません。
      # fact: yoritomo-07
      - 語り: 『吾妻鏡』が、頼朝の落馬と死に、初めて触れるのは、それから13年後。建暦2年、1212年の2月28日です。相模川の橋の修理を話し合う記事の、途中に出てきます。
        card: {head: "1212年2月28日", body: 橋の修理の記事で初めて触れる}
        year: 1212
      # fact: yoritomo-10
      - 語り: その記事で、将軍は、こう命じたと書かれています。頼朝の死は、橋を架けた過ちではない。不吉だと、口にしてはならない、と。
        tone: 重い
      # fact: yoritomo-09
      - 語り: しかも、同じ記事は、橋を架けた御家人、稲毛重成も、のちに災いに遭った、と書きます。
      # fact: yoritomo-15
      - 語り: 同じころ、京都の公家は、別のことを書いていました。藤原定家の『明月記』は、頼朝は、1月13日に亡くなった。おそらく、急な病だろう、と。
        background: {image: paintings/kazu_kyoto_sanjo_hiroshige.jpg, credit: "歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ（メトロポリタン美術館）"}
        year: 1199
        card: {head: "『明月記』", body: おそらく急な病}
      # fact: yoritomo-04
      - 語り: 関白、近衛家実の『猪隈関白記』には、頼朝が、「飲水の病」で重い、という話が、書かれています。いまの糖尿病に当たる、と説明される病です。
      # fact: yoritomo-21
      - 語り: 江戸時代、元禄8年、1695年の『東鑑集要』は、「頼朝の薨去を、隠すと見えたり」と書きました。300年以上前の人も、不自然だと感じていたのです。
        tone: 重い
      - 語り: 幕府の歴史書は、なぜ、創業者の死を書かなかったのか。そして、書いたときには、なぜ、「橋のせいではない」と、念を押したのか。
        tone: 疑問
        pause: 0.8
      - 語り: 答えを探して、まず、『吾妻鏡』が、どこで途切れているのか、見ていきます。
        pause: 0.6

  # ================================================================ 第1章 『吾妻鏡』はどこで途切れているか
  - title: 『吾妻鏡』は、どこで途切れているのか　1195年12月
    background: {image: paintings/yoritomo_azuma_najda_v16.jpg, credit: "『吾妻鏡』第16巻（国立公文書館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：Q02（灯のもとで綴じ本を開く、静かな書院。人物なし）／Q03（谷あいの武家屋敷の門。夜の遠景。人物なし）
    year: 1195
    lines:
      # fact: yoritomo-34
      - 語り: 『吾妻鏡』は、治承4年、1180年の挙兵から、文永3年、1266年までを、将軍の年代記の形で記した書です。国立公文書館の解説では、まとめられたのは、1300年前後と推定されています。
        card: {head: "成立", body: 1300年前後と推定}
      # fact: yoritomo-52
      - 語り: 五味文彦さんは、書いたのは幕府の奉行人と考えられるが、史料を徹底的に集めて調べて書くタイプの本ではない、と話しています。
      # fact: yoritomo-50
      - 語り: いま読まれている写本の一つには、こんな伝わり方があります。1590年、小田原の北条氏から、黒田孝高に、『吾妻鑑』の写本が贈られました。
        card: {head: "1590年", body: 北条氏から黒田孝高へ}
      # fact: yoritomo-50
      - 語り: その写本が、のちに、2代将軍、徳川秀忠に献上されたと伝わります。nippon.com の記事です。
      # fact: yoritomo-05
      - 語り: 第15巻の、最後の日付は、解説によって分かれます。nippon.com の記事は、建久6年12月16日。和樂web は、22日としています。
      # fact: yoritomo-06
      - 語り: 私たちが開いた翻刻には、12月22日の記事までありました。将軍が、家臣の安達盛長の、甘縄の家に入り、今夜は、お泊まりになった、という記事です。
        card: {head: "12月22日", body: 安達盛長の家に泊まる}
      # fact: yoritomo-01
      - 語り: 生きている頼朝の記録は、ここで、止まります。次の頁は、3年以上あと。第16巻は、建久10年の2月、息子の頼家が、父の跡を継ぐ記事から始まります。
        tone: しみじみ
      # fact: yoritomo-44
      - 語り: このあいだに、何があったのか。JBpress の記事で、西股総生さんは、1196年に、長女、大姫の入内をめぐって、九条兼実との関係が悪くなり、兼実が失脚した、と書いています。
      # fact: yoritomo-44
      - 語り: 1197年には、大姫が、病気で亡くなりました。
      # fact: yoritomo-29
      - 語り: 欠けているのは、頼朝の最晩年だけでは、ありません。ブリタニカ国際大百科事典は、寿永2年、仁治3年、弘長2年、文永元年など、記事の欠けた年を、ほかにも挙げています。
        card: {head: "欠けた年", body: 寿永2年・仁治3年ほか}
      # fact: yoritomo-30
      - 語り: 益田宗さんが書いた、世界大百科事典の解説は、中間の10年分が欠けていて、書物として完成したのかどうかも、はっきりしない、としています。
      # fact: yoritomo-31
      - 語り: では、なぜ欠けたのか。歴史学者の五味文彦さんは、2008年の座談会で、担当者が、そこまでやらなかったと考えた、と話しています。
        figure: {type: stats, title: 欠けた理由　3つの見方, items: [[五味文彦さん（2008年の座談会）, 担当者が、そこまでやらなかった, 書かれなかった], [石井進さん（五味さんが紹介）, 北条氏の作為で、書けなかった, 隠された], [永井晋さん（2008年の座談会）, 編集の途中で終わった本, 未完成]], upto: 1}
      # fact: yoritomo-32
      - 語り: 五味さんが紹介する、故・石井進さんの説は、頼朝の重要な時期の欠落に注目し、北条氏による作為があって、書けなかったのではないか、というものです。
        figure: {type: stats, title: 欠けた理由　3つの見方, items: [[五味文彦さん（2008年の座談会）, 担当者が、そこまでやらなかった, 書かれなかった], [石井進さん（五味さんが紹介）, 北条氏の作為で、書けなかった, 隠された], [永井晋さん（2008年の座談会）, 編集の途中で終わった本, 未完成]], upto: 2}
      # fact: yoritomo-33
      - 語り: 永井晋さんは、同じ座談会で、編集の途中で、終わってしまった本ではないか、と話しています。
        figure: {type: stats, title: 欠けた理由　3つの見方, items: [[五味文彦さん（2008年の座談会）, 担当者が、そこまでやらなかった, 書かれなかった], [石井進さん（五味さんが紹介）, 北条氏の作為で、書けなかった, 隠された], [永井晋さん（2008年の座談会）, 編集の途中で終わった本, 未完成]], upto: 3}
      - 語り: 欠けた理由の見方は、3つに割れています。どれが正しいと決められる史料は、私たちの調べでは、見つかりませんでした。
        figure: null
        tone: 重い
      - 語り: では、欠けた頁の外で、京都の人たちは、頼朝の死を、どう書いていたのか。
        tone: 疑問
        hook: true
      - 語り: そこには、『吾妻鏡』に無い、死の知らせが、残っていました。
        tone: 重い
        hook: true

  # ================================================================ 第2章 京都の日記は死をどう書いたか（1199年1月）
  - title: 京都の日記は、頼朝の死をどう書いたのか　1199年1月
    background: {image: paintings/kazu_kyoto_sanjo_hiroshige.jpg, credit: "歌川広重《東海道五十三次之内 京師 三条大橋》1833年ごろ（メトロポリタン美術館）"}
    # AI絵：Q04（雪の降る京の町並みと御所の屋根の遠景。人物なし）／Q05（灯の下の文机と、開かれた日記の巻物。人物なし）
    year: 1199
    lines:
      # fact: yoritomo-12
      - 語り: 天台座主の慈円が書いた、『愚管抄』は、頼朝が、1月11日に出家して、13日に世を去った、と記します。その知らせが、京に聞こえはじめたのは、15日、16日ごろからでした。
        card: {head: "『愚管抄』", body: 十一日出家・十三日に死去}
      # fact: yoritomo-13
      - 語り: 慈円は、こうも書いています。頼朝は、今年こそ、必ず静かに上洛して、世の中のことを、取りはからおうと、思っていた、と。
      # 【想像1】頼朝。記録：愚管抄に「今年必しづかにのぼりて世の事沙汰せんと思ひたりけり」とある。気持ちだけ
      - 人物: 「……今年こそ、静かに、京へ上ろう」
        who: 頼朝想像
        imagined: true
        tone: しみじみ
      # fact: yoritomo-14
      - 語り: 藤原定家の『明月記』、1月18日。街の噂として、前の右大将が、病のために11日に出家した、と、飛脚が院に知らせてきた、とあります。「すでに、亡くなった」という説も、書かれています。
        card: {head: "1月18日", body: 「すでに、亡くなった」の説も}
      # fact: yoritomo-14
      - 語り: 定家は、こう続けます。朝廷の一大事として、これに勝るものがあろうか。恐れと切迫の世だ、と。
        tone: しみじみ
      # fact: yoritomo-15
      - 語り: 20日の条は、「前の将軍、去る11日に出家、13日に入滅。おおよそ、急な病か」。定家は、死因を、急な病と、推測しました。
        card: {head: "『明月記』", body: 十三日入滅・大略頓病か}
        figure: {type: stats, title: 同じ死　記録の食い違い, items: [[明月記（定家）, 急な病か, 1199年1月], [猪隈関白記（近衛家実）, 重い飲水の病, 1199年1月], [吾妻鏡（鎌倉）, 橋供養の帰りに落馬, 1212年2月]], upto: 1}
      # fact: yoritomo-55
      - 語り: 『明月記』は、同じ20日の条に、京都の除目のことも書いています。頼家は、このとき、左中将に任じられました。『愚管抄』も、同じことを記しています。
      # fact: yoritomo-04
      - 語り: 近衛家実の『猪隈関白記』は、頼朝が、飲水の病にかかって重い、という話を、書きとめています。和樂web の解説は、いまの糖尿病に当たるとしています。
        figure: {type: stats, title: 同じ死　記録の食い違い, items: [[明月記（定家）, 急な病か, 1199年1月], [猪隈関白記（近衛家実）, 重い飲水の病, 1199年1月], [吾妻鏡（鎌倉）, 橋供養の帰りに落馬, 1212年2月]], upto: 2}
      # fact: yoritomo-16
      - 語り: 頼朝が亡くなると、京都は、ざわつきました。『明月記』は、「院中の警固、軍陣の如し」と書き、「公卿七人が、滅びるだろう」という噂まで、記しています。
        figure: null
      # fact: yoritomo-45
      - 語り: 2月18日には、院の御所で、御読経が結願しました。『明月記』は、「もっぱら、前の右大将の追善」と書いています。京都の朝廷でも、頼朝のための読経が行われたのです。
      - 語り: 私たちが開いた京都の記事に、落馬という言葉は、ありませんでした。京都では、頼朝の死は、病として書かれたのです。
        tone: しみじみ
        figure: {type: stats, title: 同じ死　記録の食い違い, items: [[明月記（定家）, 急な病か, 1199年1月], [猪隈関白記（近衛家実）, 重い飲水の病, 1199年1月], [吾妻鏡（鎌倉）, 橋供養の帰りに落馬, 1212年2月]], upto: 3}
      - 語り: 落馬という話は、13年後の鎌倉で、橋の話の中に、突然、現れます。その前に、欠けた3年のあとの、最初の頁を見てみます。
        figure: null
        tone: 疑問
        hook: true
      - 語り: そこで頼朝は、すでに、別の名前で、呼ばれていました。
        tone: 重い
        hook: true

  # ================================================================ 第3章 再開した最初の頁は、もう「故将軍」と呼んでいた
  - title: 再開した最初の頁は、もう「故将軍」と呼んでいた　1199年2月
    background: {image: paintings/yoritomo_azuma_najda_v16.jpg, credit: "『吾妻鏡』第16巻（国立公文書館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：Q06（朝の政所の広い板の間。文机と巻物だけ。人物なし）／Q07（鶴岡八幡宮の石段と門の遠景。人物なし）
    year: 1199
    lines:
      # fact: yoritomo-11
      - 語り: 『吾妻鏡』の第16巻、建久10年の2月。nippon.com は、2月6日の条から始まる、と書きますが、私たちが開いた翻刻では、2月4日の記事です。
      # fact: yoritomo-11
      - 語り: 息子の頼家が、左中将になり、朝廷から、前の征夷将軍の跡を継げ、という宣旨が届きました。
        card: {head: "建久10年2月", body: 頼家が跡を継ぐ宣旨}
      # fact: yoritomo-11, yoritomo-48
      - 語り: 政所で、吉書始めが行われました。吉書は、大江広元が持参し、頼家は、寝殿を出て、これに目を通した、とあります。
      # fact: yoritomo-11
      - 語り: 記事には、「故将軍が亡くなってから、まだ20日も経たないが」と、あります。頼家の政務の記録は、ここから始まります。
      - 語り: 亡くなったことは、書いてある。けれど、いつ、どこで、どうして亡くなったのかは、この記事には、ありません。
        tone: しみじみ
      # fact: yoritomo-35
      - 語り: 約3か月後の4月12日。有力な御家人13人の、話し合いで訴えを裁く、「13人の合議制」が始まります。下野市教育委員会の解説です。
        card: {head: "4月12日", body: 13人の合議制が始まる}
      # fact: yoritomo-35
      - 語り: 下野市の解説は、御家人たちが、頼家は18歳で、政務の経験も足りないと考えて、この仕組みを作ったのだろう、と書いています。
      # fact: yoritomo-36
      - 語り: その年の10月には、頼朝の側近だった、結城朝光が、頼朝をしのんで、「忠臣は二君に仕えず」と話し、「今の幕府は、薄い氷の上を歩くようだ」と語った、と『吾妻鏡』にあります。
      # fact: yoritomo-36
      - 語り: 聞いた御家人たちは、涙したといいます。
        tone: しみじみ
        background: {image: paintings/takauji_kamakura_tsurugaoka.jpg, credit: "Ocdp撮影《鶴岡八幡宮》2017年（CC0）。現在の姿"}
      # fact: yoritomo-37
      - 語り: この発言を、梶原景時が、「謀反を企てている」と、頼家に訴えます。けれど、御家人たちが、鶴岡八幡宮に集まり、景時のほうが、失脚しました。翌年1月20日には、景時の一族が、滅びています。
        card: {head: "1200年1月20日", body: 梶原景時の一族が滅ぶ}
      - 語り: 創業者の死のあとに、争いが、続けざまに起こる。それは書かれているのに、死そのものは、書かれていない。
        tone: 重い
      - 語り: その死が、書かれる日は、13年後に来ます。橋の修理の記事の中で。
        tone: 疑問
        hook: true
      - 語り: 話は、頼朝が亡くなる、3年前に、さかのぼります。
        tone: 重い
        hook: true

  # ================================================================ 第4章 橋の修理の記事は、頼朝の死をどう書いたか
  - title: 橋の修理の記事は、頼朝の死をどう書いたのか　1195〜1212年
    background: {image: paintings/yoritomo_sagami_pier_gaikan.jpg, credit: "旧相模川橋脚（茅ヶ崎市）の現在の姿（ウィキメディア・コモンズ、CC0）"}
    # AI絵：Q08（川にかかる、長い木の橋の遠景。夕暮れ。人物なし）／Q09（馬の影が、水辺の道を走る遠景。人物なし）
    year: 1195
    lines:
      # fact: yoritomo-46
      - 語り: 橋を架けた稲毛重成は、頼朝の側近くに仕えた、有力な御家人です。養和元年、1181年には、所領の偽装申告で、頼朝本人から怒りを受けた、と『吾妻鏡』にあります。
        card: {head: "稲毛重成", body: 頼朝の義理の兄弟}
      # fact: yoritomo-46
      - 語り: それでも、一の谷の戦いなどに加わり、北条時政の娘を妻にして、頼朝の義理の兄弟になりました。川崎市公文書館の、稲毛三郎重成伝の記述です。
      # fact: yoritomo-24
      - 語り: 建久6年、1195年。重成は、頼朝の上洛に従って、京都へ行っていました。
      # fact: yoritomo-24
      - 語り: その帰り道、重成は、妻が危篤だと知らされます。重成の妻は、北条政子の妹です。頼朝は、重成に、駿馬を与えて、急がせました。
        card: {head: "1195年", body: 妻の危篤・駿馬を与えられる}
      # 【想像2】重成。記録：頼朝から駿馬を与えられ、帰路を急いだ（川崎市公文書館）。気持ちだけ
      - 人物: 「……間に合ってくれ」
        who: 重成想像
        imagined: true
        tone: 重い
      # fact: yoritomo-24
      - 語り: けれど、妻は、亡くなっていました。
        tone: 重い
      # fact: yoritomo-03
      - 語り: 建久9年、1198年。重成は、亡き妻の追善供養のために、相模川に橋を架けます。その橋の供養に、頼朝も、出席しました。
        card: {head: "1198年", body: 重成が相模川に橋を架ける}
        year: 1198
      # fact: yoritomo-22
      - 語り: 供養の日は、12月27日。『鎌倉大日記』が挙げる日付で、下野市と神奈川県観光協会の解説も、同じ日です。
        figure: {type: stats, title: 橋供養の日　記録の食い違い, items: [[鎌倉大日記・下野市・神奈川県観光協会, 12月27日, 頼朝が落馬した日], [言い伝え（さんたつの記事）, 12月5日, 馬が亡霊に驚いた日]], upto: 1}
      # fact: yoritomo-23
      - 語り: 一方、橋の完成式を12月5日とし、頼朝の馬が、平家の亡霊に驚いて暴れ、川へ落ちた、という言い伝えもあります。「さんたつ」の記事が、紹介しています。
        figure: {type: stats, title: 橋供養の日　記録の食い違い, items: [[鎌倉大日記・下野市・神奈川県観光協会, 12月27日, 頼朝が落馬した日], [言い伝え（さんたつの記事）, 12月5日, 馬が亡霊に驚いた日]], upto: 2}
      # fact: yoritomo-07, yoritomo-08
      - 語り: そして、建暦2年、1212年の2月28日。『吾妻鏡』に、橋の記事が出ます。
        year: 1212
        figure: null
        card: {head: "1212年2月28日", body: 橋の修理を評議}
      # fact: yoritomo-08
      - 語り: 相模川の橋が、数間、朽ちて傷んだ。三浦義村が、修理を申し出た、と。北条義時、大江広元、三善康信らが、評議しました。
      # fact: yoritomo-09
      - 語り: 記事は、橋の由来を、こう書きます。建久9年に、重成法師が、新しく造った。供養の日に、故将軍が、縁を結ぶために渡った。帰りに、落馬した。いくらも経たないうちに、亡くなった。
        tone: 重い
        card: {head: "記事の由来", body: 重成法師が新造・帰りに落馬}
      # fact: yoritomo-09
      - 語り: 「重成法師も、また、災いに遭った。どちらも、吉事ではない」。評議の人たちは、いまさら無理に建て直さなくても、何の災いがあろうか、という意見でそろった、と、将軍に申し上げます。
      # fact: yoritomo-10
      - 語り: 将軍は、こう答えます。故将軍が亡くなったのは、武家の権柄を握って20年、官位を極めた、あとのこと。重成法師は、自分の不義によって、天の咎めを受けたのだろうか。全く、橋を建てた過ちでは、ない。
        tone: 強調
      # fact: yoritomo-10
      - 語り: 「この上は、一切、不吉と言ってはならない」。あの橋は、箱根と伊豆山への参詣の大切な道で、人々の往来にも役立つ。倒れる前に、早く修理せよ、と命じました。
        card: {head: "将軍の命令", body: 橋のせいではない・不吉と言うな}
      - 語り: 頼朝の死が、歴史書に初めて書かれた場面は、橋は不吉ではない、と言い切るための、説明でした。私たちは、そう読みました。
        tone: しみじみ
      # fact: yoritomo-49
      - 語り: 13年後に書かれたことを、nippon.com の記事は、「ほとぼりが冷めたころ」に記されたと見る人もいる、と紹介しています。
        card: {head: "13年後", body: 「ほとぼりが冷めたころ」説}
      # fact: yoritomo-49
      - 語り: ただし、そう見る人もいる、というだけで、確かな根拠は、確かめられませんでした。
      # fact: yoritomo-25
      # fact: yoritomo-47
      - 語り: 記事にある、「重成法師も、また、災いに遭った」。妻を失ったあと、重成は、隠遁していました。
        year: 1205
      # fact: yoritomo-47
      - 語り: 元久2年、1205年の4月、舅の北条時政に招かれて、久しぶりに鎌倉を訪れます。その2か月後、畠山重忠が、謀反の疑いをかけられて、滅びました。
        year: 1205
      # fact: yoritomo-25
      - 語り: 重成が殺されたのは、6月23日。畠山重忠が滅びた翌日で、一族も、ともに殺されています。川崎市公文書館によれば、重忠の謀反の疑いは、重成の謀略とされました。
        card: {head: "1205年6月23日", body: 重成が殺される}
      # fact: yoritomo-19
      - 語り: 『承久記』は、頼朝が子の頼家に、「畠山を頼りにして、日本国を鎮護せよ」と遺言した、と載せています。軍記物語なので、確かな記録かどうかは、分かりません。
        tone: しみじみ
      - 語り: 『承久記』が、頼れと書いた畠山。その畠山を陥れる謀略をめぐらしたと見られたのが、頼朝が最後に渡った橋を、架けた人でした。
        tone: 重い
        hook: true
      - 語り: その橋は、いまも、地面の下にあります。
        tone: 重い
        hook: true

  # ================================================================ 第5章 800年後に水田から出てきた橋
  - title: 橋は、800年後に、水田から出てきた　1923年
    background: {image: paintings/yoritomo_sagami_pier_gaikan.jpg, credit: "旧相模川橋脚（茅ヶ崎市）の現在の姿（ウィキメディア・コモンズ、CC0）"}
    # AI絵：Q10（早朝の水田と、地面から突き出た木の柱の遠景。人物なし）／Q11（水を張った池に、並ぶ木の柱の影。夕景。人物なし）
    year: 1923
    lines:
      # fact: yoritomo-26
      - 語り: 大正12年、1923年9月1日。関東大震災の揺れで、茅ヶ崎の水田の中から、木の柱が、地面に現れました。翌年1月の余震でも、柱が見つかりました。文化庁の、文化遺産オンラインの説明です。
        card: {head: "1923年9月1日", body: 水田から木の柱が現れる}
      # fact: yoritomo-26
      - 語り: 地上に現れていたのは、7本。その後、地下に隠れていた3本も、見つかりました。液状化現象が、地下の柱を、押し上げたのです。
        card: {head: "7本＋3本", body: 水田から出た橋の柱}
      # fact: yoritomo-53
      - 語り: 茅ヶ崎出身の和田清は、震災のとき、東京帝国大学の講師でした。帰省して、水田から出た丸柱の話を聞くと、すぐに実地を調べ、写真を撮って、歴史学者の沼田頼輔に、調査を託しました。
      # fact: yoritomo-26
      - 語り: 沼田頼輔は、『吾妻鏡』などの記録をもとに、稲毛重成が架けた橋の橋脚だと考証しました。
      # fact: yoritomo-54
      - 語り: 1924年4月25日に、神奈川県が仮指定。大正15年、1926年10月20日に、国の史跡に指定されます。
        year: 1926
        card: {head: "1926年", body: 国の史跡に指定}
      # fact: yoritomo-54
      - 語り: 素早く進んだのは、内務省の考査員だった、柴田常恵の働きが大きい、と茅ヶ崎市の季刊誌は書いています。
      # fact: yoritomo-27
      - 語り: 2001年以降の発掘で、ヒノキ製の橋杭は、あわせて10本、確認されました。2013年には、液状化現象の痕跡として、全国で初めて、国の天然記念物にも、指定されています。
        card: {head: "橋杭10本", body: 2013年に天然記念物}
      # fact: yoritomo-27
      - 語り: 茅ヶ崎市の季刊誌によれば、10本は、いまは地中に埋め戻して保存され、その上に、レプリカが置かれています。
      # fact: yoritomo-28
      - 語り: ただし、さんたつの記事によれば、年輪年代では、伐採は、1126年から1260年のあいだ、とされます。1198年に、絞り込めるわけでは、ありません。
        tone: しみじみ
        year: 1198
      - 語り: 頼朝の死を、橋の修理の記事の中でしか語らなかった歴史書が、800年あまりのち、その橋を、探し出す手がかりになった。
        tone: しみじみ
      - 語り: では、頼朝は、本当に、橋の帰りの落馬で、亡くなったのか。
        tone: 疑問
        hook: true
      - 語り: 死因は、書かれた時代ごとに、違っていました。
        tone: 重い
        hook: true

  # ================================================================ 第6章 死因は何と書かれてきたか
  - title: 死因は、何と書かれてきたのか　落馬・病・亡霊・暗殺
    background: {image: paintings/yoritomo_sagami_pier_gaikan.jpg, credit: "旧相模川橋脚（茅ヶ崎市）の現在の姿（ウィキメディア・コモンズ、CC0）"}
    # AI絵：Q12（霧の立つ川と、岸に残された一頭の馬の遠景。人物なし）／Q13（暗い部屋の灯と、閉じた書物。人物なし）
    year: 1199
    lines:
      # fact: yoritomo-43
      - 語り: 歴史学者の細川重男さんは、週刊現代で、死因は確かなことが分からない、としたうえで、建久9年12月27日に体調を崩し、翌年1月13日に死んだことは、ほぼ確実だ、と述べています。
        card: {head: "確かなこと", body: 12月27日に不調・1月13日に死去}
      # fact: yoritomo-17
      - 語り: 南北朝のころの歴史書、『保暦間記』は、頼朝が、義経や行家ら、源氏の一門と、安徳天皇の亡霊を見て、病んだ、と書きます。
        card: {head: "『保暦間記』", body: 亡霊を見て病む}
      # fact: yoritomo-17
      - 語り: 茅ヶ崎市の解説は、鶴嶺八幡宮のあたりで、義経主従などの亡霊にあい、落馬した、と紹介しています。
      # fact: yoritomo-18
      - 語り: 『承久記』は、頼朝が、「水神に領せられ」た、と書きます。水の神に、取り憑かれたということでしょう。
      # fact: yoritomo-21
      - 語り: 江戸時代の『東鑑集要』は、「頼朝の薨去を隠すと見えたり」と書きました。nippon.com は、暗殺説を支える材料の一つとして、この一文を紹介しています。
        card: {head: "暗殺説", body: 根拠は確かめられなかった}
      - 語り: 暗殺だったと言える史料は、私たちの調べでは、見つかりませんでした。
        tone: 重い
      # fact: yoritomo-51
      - 語り: 江戸時代には、徳川家康が、英雄、頼朝の死の真相をはばかって、『吾妻鏡』の記述を脱落させた、という噂もあった、と週刊現代は書いています。噂であって、根拠は、示されていません。
        card: {head: "家康の噂", body: 根拠は示されていない}
      # fact: yoritomo-20
      - 語り: 昭和7年、1932年4月、東京の歌舞伎座で初演された、『頼朝の死』は、頼朝が、女装して忍び込み、御家人に斬られ、北条政子たちが、落馬死として隠した、という筋です。
        tone: 強調
      # fact: yoritomo-20
      - 語り: 歌舞伎の創作で、史料にある話では、ありません。
      # fact: yoritomo-56
      - 語り: 和樂web は、いま最も支持されているのは、落馬による怪我、あるいは、落馬の原因になった病気、という見方だと、紹介しています。
      - 語り: 病気、亡霊、水の神、暗殺、そして創作。頼朝の死は、書かれた時代ごとに、違う姿で、語られてきました。
        tone: しみじみ
      - 語り: 確かなのは、体調を崩した日と、亡くなった日。それだけです。
        tone: しみじみ
        hook: true
      - 語り: では、亡くなったあとの、頼朝を、いまに伝えているものは、何なのか。
        tone: 疑問
        hook: true

  # ================================================================ 第7章 墓と肖像と書状
  - title: 墓と肖像と書状　確かめられるものは、どれか　1779年
    background: {image: paintings/yoritomo_haka_ndl.jpg, credit: "頼朝墓の挿絵（国立国会図書館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
    # AI絵：Q14（山あいの石段の上、小さな石塔の遠景。人物なし）
    year: 1200
    lines:
      # fact: yoritomo-38
      - 語り: 頼朝の墓がある、法華堂は、もとは、頼朝の持仏堂でした。念持仏の、銀の正観音像をまつる堂で、法華堂と呼ばれたと、神奈川県観光協会は書いています。
        card: {head: "法華堂", body: もとは頼朝の持仏堂}
      # fact: yoritomo-38
      - 語り: 亡くなったあとに、墓所になった、と文化遺産オンラインは説明しています。
      # fact: yoritomo-38
      - 語り: 文化遺産オンラインの旧い説明には、石畳を敷いた上に、高さ七尺、およそ2メートルの、多重塔が一基、建っている、とあります。
        card: {head: "七尺", body: およそ2メートルの多重塔}
      # fact: yoritomo-39
      - 語り: 一周忌は、正治2年、1200年の1月13日。法華堂で、導師を務めたのは、栄西でした。
      # fact: yoritomo-40
      - 語り: 北条義時も、元仁元年、1224年に、頼朝の法華堂の東の、山の上に葬られます。平成17年の発掘で、建物の跡が確認され、『吾妻鏡』の記事が、裏付けられました。
        year: 1224
      # fact: yoritomo-02
      - 語り: いま、墓として立っているのは、安永8年、1779年に、薩摩藩主の、島津重豪が建てたものです。頼朝の死から、およそ580年後のことでした。
        card: {head: "1779年", body: 島津重豪が墓を建てる}
        year: 1779
      # fact: yoritomo-41
      - 語り: 肖像も、同じです。京都の神護寺に伝わる、頼朝を描いたと言われてきた肖像画。1995年、美術史学者の米倉迪夫さんが、足利直義の像だという説を、出しました。
        portrait: {image: paintings/yoritomo_portrait_jingoji.jpg, caption: "神護寺に伝わる、頼朝とされてきた肖像画（京都・神護寺蔵。別人説がある）"}
        year: 1995
      # fact: yoritomo-41
      - 語り: 神護寺は、これに強く反論し、像主は、頼朝の可能性が高い、と主張しています。
      # fact: yoritomo-41
      - 語り: nippon.com によれば、いまは「伝」を付けて呼ばれ、教科書には、甲斐善光寺の木造の頼朝坐像が、載るようになりました。
        portrait: null
      # fact: yoritomo-42
      - 語り: 書状も、そうです。東京国立博物館の解説は、頼朝の書状は、30通ほど知られているが、最近の研究では、頼朝自筆のものは、ほとんどなく、右筆が書いたものとされています。
        card: {head: "頼朝の書状", body: 自筆はほとんど無い}
      - 語り: 死も、顔も、手紙も。創業者のものは、確かめにくいのです。
        tone: しみじみ
        hook: true
      - 語り: では、なぜ、頼朝の死は、書かれなかったのか。
        tone: 疑問
        hook: true

  # ================================================================ まとめ
  - title: まとめ：なぜ、頼朝の死は書かれなかったのか　鎌倉
    background: {image: paintings/yoritomo_sagami_pier_gaikan.jpg, credit: "旧相模川橋脚（茅ヶ崎市）の現在の姿（ウィキメディア・コモンズ、CC0）"}
    # AI絵：Q15（終了画面用。夕暮れの川と橋の遠景、右半分を空けた構図）
    year: 1212
    lines:
      # 答え
      - 語り: 『吾妻鏡』が、頼朝の死を書かなかった理由を、言い切れる史料は、私たちの調べでは、見つかりませんでした。
        tone: 重い
      # fact: yoritomo-31, yoritomo-32, yoritomo-33
      - 語り: 五味文彦さんは、担当者が、そこまでやらなかった、と考えます。石井進さんは、北条氏の作為の可能性を、指摘しました。永井晋さんは、編集の途中で終わった本ではないか、と話します。
        background: {image: paintings/yoritomo_azuma_najda_v16.jpg, credit: "『吾妻鏡』第16巻（国立公文書館蔵。ウィキメディア・コモンズ、パブリックドメイン）"}
      # fact: yoritomo-43, yoritomo-15
      - 語り: 確かなのは、頼朝が、建久9年の12月27日に体調を崩し、翌年の1月13日に亡くなったこと。京都の日記は、それを、病として書いたことです。
      # fact: yoritomo-07, yoritomo-10
      - 語り: そして、鎌倉が、頼朝の落馬を書いたのは、13年後。橋のせいではない、不吉と言うな、と命じる場面でした。
        background: {image: paintings/yoritomo_sagami_pier_gaikan.jpg, credit: "旧相模川橋脚（茅ヶ崎市）の現在の姿（ウィキメディア・コモンズ、CC0）"}
      - 語り: 創業者の最期は、幕府の歴史書にではなく、京都の日記と、橋の修理の記事に、残りました。
        tone: しみじみ
      # fact: yoritomo-26
      - 語り: 欠けた3年の頁は、いまも、戻っていません。けれど、橋の柱は、800年あまり、地面の下に、残っていました。
        tone: しみじみ
        pause: 0.8
        year: 1212

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
