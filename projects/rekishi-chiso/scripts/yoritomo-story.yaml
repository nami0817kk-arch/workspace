# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と musashi-story.yaml・takasugi-story.yaml の型）。源頼朝。2026-10-29 下書き。
# 公開の予定は 11/2 12:00。
# 型：1本に1つの「なぜ」＝「なぜ、頼朝の死は『吾妻鏡』から消えたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝鎌倉幕府が自らまとめた歴史書『吾妻鏡』に、初代の主・頼朝がいつ・どう死んだのかが書かれていない（約3年分の記事が無い）。
#   次に、死に初めて触れるのは13年後・橋の修理の記事／その記事で「橋のせいではない、不吉と言うな」と命じている／京都の公家の日記は別のこと（急病・飲水の病）を書く／江戸時代の『東鑑集要』も「隠す」と書いた。
#   導入では答え（欠けた理由を言い切れる史料は見つからなかった。確かなのは日付だけ）を言わず、最後の章で出す。
#   第1章 『吾妻鏡』はどこで途切れているか（最後の日付 12/16と12/22・安達盛長の家に泊まった記事・欠けた3年のあいだの出来事・ほかにも欠けた年・欠けた理由の3つの見方）＝記録の食い違い①（欠落の理由）／
#   第2章 京都の日記は死をどう書いたか（愚管抄・明月記・猪隈関白記・京の騒ぎ）＝記録の食い違い②（京都は病・鎌倉は落馬）／
#   第3章 再開した最初の頁は、もう「故将軍」と呼んでいた（頼家・13人の合議制・結城朝光・梶原景時）／
#   第4章 橋の修理の記事は死をどう書いたか（稲毛重成と妻・橋供養の日 12/27と12/5＝食い違い③・建暦2年の記事・重成のその後・『承久記』の遺言）／
#   第5章 800年後に水田から出てきた橋（関東大震災・沼田頼輔・史跡・天然記念物・年輪）／
#   第6章 死因は何と書かれてきたか（細川重男さん・保暦間記・承久記・東鑑集要・歌舞伎の創作）／
#   第7章 墓と肖像と書状（法華堂・栄西・義時の法華堂の発掘・島津重豪の墓・神護寺の肖像の別人説・書状は右筆）／まとめ（答え→冒頭に戻る）。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/源頼朝_facts_20261029.yaml、yoritomo-01〜44）にあるものだけ。行の上に `# fact: yoritomo-NN`。
#   カードに無い「誰でも知っている前置き」（鎌倉幕府を開いた・落馬して亡くなった・1199年1月13日）は短く使い、# fact を付けない。
#   『吾妻鏡』『明月記』『愚管抄』『承久記』の原文は、個人サイトの翻刻（読み下し）から。「私たちが開いた翻刻では」と言う。第15巻の最後の日付は解説が16日と22日に割れる。
#   落馬の日12/27（鎌倉大日記ほか）と12/5（言い伝え）は並べて言う。死因は言い切らない。暗殺説は「根拠は確かめられなかった」と言う。
#   確かめられなかったこと：欠けた理由／『猪隈関白記』『東鑑集要』の原文（解説を通して）／吾妻鏡の第15・16巻の頁の画像の読み。台本では「確かめられなかった」と言う。
#   最期（落馬・病・死）の場面に人物の絵は当てない。橋・川・馬の遠景・書物・灯だけ。戦闘・負傷・遺体は描かない。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（吾妻鏡・明月記・愚管抄）。声は作らない。
#   想像の台詞は2か所（重成想像・頼朝想像。config の roles に足した：離途・黒沢冴白）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の yoritomo_portrait_jingoji（神護寺の肖像画。頼朝像とされてきたが別人説あり）・yoritomo_sagami_pier_gaikan（旧相模川橋脚の現在の姿）ほか＋ AI 絵（Q01〜Q15、一覧は dev/output/rekishi-chiso/research/yoritomo_ai_images.md）。
#   AI 絵の人物は後ろ姿か遠景。実在の誰か・俳優に似せない。顔が分かるのは実在の肖像画（額）だけ。
# 広告の配慮：戦闘・負傷・死の場面は描かない。
