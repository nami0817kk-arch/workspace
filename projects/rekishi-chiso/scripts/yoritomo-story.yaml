# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  鎌倉幕府が自らまとめた歴史書『吾妻鏡』に、初代の主・源頼朝がいつ、どうやって死んだのかは、書かれていません。
  頼朝が亡くなった年を含む、およそ3年分の記事が、まるごとありません。
  『吾妻鏡』が頼朝の落馬と死に初めて触れるのは、13年後。橋の修理を話し合う記事の、途中です。
  幕府の歴史書は、なぜ創業者の死を書かなかったのか。そして、書いたときは、なぜ「橋のせいではない」と念を押したのか。
  この動画でわかること
  ・『吾妻鏡』が途切れる日付と、欠けた理由についての3つの見方
  ・京都の公家の日記（『明月記』『愚管抄』『猪隈関白記』）が書いた、頼朝の死
  ・建暦2年（1212年）の『吾妻鏡』の記事が、頼朝の死をどう書いたか
  ・1923年の関東大震災で水田から出てきた、橋の柱の話
  ・墓・肖像・書状の、確かめにくい点
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札を出しています。
  記録に残る言葉は、出どころ（国立公文書館、川崎市公文書館、茅ヶ崎市教育委員会、下野市教育委員会、神奈川県観光協会、文化庁の文化遺産オンライン、nippon.com、和樂web、Web版 有鄰の座談会などの記事）を語りで示してから読んでいます。
  『吾妻鏡』『明月記』『愚管抄』『承久記』の原文は、個人サイトの翻刻（読み下し）をもとにしています。頼朝が亡くなった理由・『吾妻鏡』が欠けた理由は、史料から言い切れません。
  肖像は、京都・神護寺に伝わる絵（ウィキメディア・コモンズ、パブリックドメイン）です。頼朝を描いたものかどうかは、研究者のあいだで議論があります。

en:
  title: "Minamoto no Yoritomo: Three Years Missing from the Azuma Kagami, His Death Told 13 Years Later"
  description: |-
    The Azuma Kagami, the history compiled by the Kamakura shogunate itself, does not say when or how its founder Minamoto no Yoritomo died.
    About three years of entries, including the year of his death, are simply missing.
    The record first mentions his fall from a horse and his death 13 years later, in the middle of a discussion about repairing a bridge.
    Why did the shogunate's history leave out the founder's death? And why, when it finally mentioned it, did it insist that the bridge was not to blame?
    In this video you will learn:
    - Where the Azuma Kagami breaks off, and three views on why entries are missing
    - What the diaries of Kyoto courtiers (Meigetsuki, Gukansho, Inokuma Kampakuki) wrote about his death
    - How the entry of 1212 describes his death
    - The bridge pillars that surfaced from a rice field in the 1923 Great Kanto Earthquake
    - What is hard to confirm about his grave, portrait and letters
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "The Founder's Death Vanished from the History: 1199"
    - "Where Does the Azuma Kagami Break Off? December 1195"
    - "How Did the Kyoto Diaries Describe His Death? January 1199"
    - "The First Page After the Gap Already Says 'the Late Shogun'"
    - "How Did the Bridge Repair Entry Describe His Death? 1195-1212"
    - "The Bridge That Surfaced from a Rice Field 800 Years Later: 1923"
    - "What Was Written About the Cause of Death?"
    - "Grave, Portrait and Letters: What Can Be Confirmed?"
    - "Summary: Why Was His Death Not Written?"

