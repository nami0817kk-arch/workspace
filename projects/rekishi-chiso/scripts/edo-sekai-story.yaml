# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  1603年3月24日、徳川家康が将軍になりました。イングランドの女王エリザベス1世の死も、記録の上では同じ1603年3月24日です。同じ日に見えて、じつは10日ずれていました。
  家康から慶喜まで、およそ260年。誰でも知っている日本の年に、同じ年の世界を並べ、人口・町の大きさ・船・数え方を、記録と研究者の推計で比べました。
  この動画でわかること
  ・家康の将軍の日と、エリザベス1世の死の「10日のずれ」
  ・鎖国が完成したころ、ヨーロッパと中国で起きていた戦
  ・元禄の江戸は、ロンドンやパリより大きかったのか（推計の食い違い）
  ・アメリカより70年早く始まった、幕府の人口の調べ
  ・ペリーの来航を、幕府は前の年に知らされていた
description_note: |-
  創作の台詞・想像の場面は入れていません。人口・死者の数は、ほとんどが研究者の推計です。推計どうしが違うところは、誰の推計かを言って並べました。
  出どころは、国立天文台の暦のデータ、オランダ国立公文書館、長崎市、国立国会図書館、東京大学史料編纂所の紀要（別段風説書の翻刻）、内閣府の報告書、東京都立図書館、観光庁の多言語解説文、アメリカ国勢調査局、京都大学・一橋大学ほかの論文（速水融、斎藤修・高島正憲、鬼頭宏、本庄栄治郎、Schreurs、Hanley、Rozman、Schaede、Hacker、Wilson ほか）、研究書の書評によります。
  日付は、日本のものは当時の暦と、今の暦（グレゴリオ暦）に直したものを並べています。年数・倍率は、記録と推計の数から計算し直したものです。
  画面の情景の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の写真ではありません。サムネイルの絵も、AI による想像図です。

en:
  title: "What Was the World Like During Japan's Edo Period? 260 Years from Ieyasu to Yoshinobu, Year by Year"
  description: |-
    On March 24, 1603, Tokugawa Ieyasu became shogun. English records say Queen Elizabeth I died on the very same date, March 24, 1603. It looks like the same day, but the two were actually ten days apart.
    From Ieyasu to Yoshinobu, about 260 years. We set famous years of Japanese history beside the same years in the rest of the world, and compare population, city size, ships and census-taking, using records and historians' estimates.
    In this video you will learn:
    - The ten-day gap between Ieyasu's appointment and Elizabeth I's death
    - The wars in Europe and China while Japan was closing its doors
    - Was Genroku-era Edo bigger than London or Paris? (estimates differ)
    - Japan's population surveys, begun about 70 years before the first US census
    - How the shogunate was warned of Perry's arrival a year in advance
    Most population and death figures are estimates; where historians disagree, we say whose estimate it is. Scene images are AI-generated illustrations, not real photos. Japanese-language history video (Japanese audio).
  chapters:
    - "Ieyasu and Elizabeth I: The Same March 24?"
    - "1603: The Year Ieyasu Became Shogun"
    - "1639: Closing the Doors While the World Was at War"
    - "Around 1700: Was Edo the Biggest City in the World?"
    - "1774-1801: Independence, Steam Engines and the Kansei Reforms"
    - "1853-1867: Perry's Four Ships and the Wars of the Same Years"
    - "Summary: Was Closed Japan Left Behind?"

