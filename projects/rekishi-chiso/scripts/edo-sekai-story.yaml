# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。江戸時代、世界はどうだった？（1603〜1867）。2026-11-19 作成。公開の予定は 11/24 12:00（本編）。
# 型：新しい「同じ時代の世界くらべ」。主役は江戸時代の日本、ほかの国は比べる相手（各時点で3〜4か国まで）。語りは剣崎1人。想像の台詞は入れない（imagined なし）。「AI」とは言わない。
# 1本に1つの問い＝「鎖国の日本は、世界から取り残されていたのか」。答えの席＝まとめ（窓を小さくして世界を見ていた／それでも1850年には差が開いていた）。題名で言い切らない。
#   冒頭（10秒以内）＝家康の将軍の日とエリザベス1世の死が、記録の上では同じ「1603年3月24日」、実は10日ずれ（edo-01・edo-02）。
#   区切り：1603（家康・エリザベス・VOC）／1639（ポルトガル船の禁止・出島・三十年戦争・明の滅亡）／1700ごろ（綱吉・ルイ14世・ピョートル・康熙帝、都市の人口）／
#           1774〜1801（解体新書・独立宣言・蒸気機関・ラキと浅間・天明の飢饉・寛政の改革とフランス革命・ラクスマン・『鎖国論』）／1840〜1867（風説書・ペリー・太平天国・クリミア・南北戦争・大政奉還）。
#   11/15 のルイ14世の回とは切り口が違う（ルイ14世は比べる相手の1人として数行だけ）。
# 記録・推計の食い違い：①1600年の日本の人口（速水 約1200万／斎藤・高島 1700万／吉田 1800万。edo-04）②日本の銀は世界の3分の1か（Schreurs 2017。edo-06〜08）
#   ③島原・天草の一揆の人数（観光庁 3万7千／コレア 3万5千／クーケバッケル 1万8千。edo-16）④江戸100万の根拠と都立図書館の90万（edo-32・33）
#   ⑤天明の飢饉の「死者90万」と人口の調べの92万減（edo-54・55）⑥ペリー艦隊の予告 13隻・3125人／実際は4隻（edo-73・74）⑦南北戦争の死者 62万→75万（edo-79）。
# 計算（自分で計算し直した）：慶長8年2月12日＝グレゴリオ暦1603年3月24日（ユリウス暦3月14日）、女王の死 ユリウス暦3月24日＝グレゴリオ暦4月3日→10日／
#   1603→1867（大政奉還）＝264年→「およそ260年」／平戸1609→出島1641＝32年→「30年あまり」／1700−1200＝500万、1700÷1200≈1.42／
#   4人の君主が並んだ 1682〜1709＝27年／1721 調べ 26,065,422×1.2＝31,278,506→約3100万／3100÷520≈6.0（イングランド1701）、3100÷2000≈1.5（フランス）／
#   1730→1848＝118年／1780→1786：26,010,600−25,086,466＝924,134（3.55%）／24,891,441÷3,929,214＝6.33／1790−1721＝69→約70年、1801−1721＝80年／
#   1787→1789＝2年／1801→1853＝52年→「およそ50年後」／1774→1776＝2年／62万→75万＝1.21倍／2,362,236÷約100万≈2.4／33,110,825−31,443,321＝1,667,504、1.05倍。
# 事実は事実カード（dev/output/rekishi-chiso/research/江戸の世界くらべ_facts_20261119.yaml、edo-01〜91）にあるものだけ。行の上に `# fact: edo-xx`。
#   使わないこと：元禄小判の金の割合（買取業者の頁だけ）／江戸の識字率・出版点数（根拠が弱い）／エリザベスの死を1602年と書く件（1件だけ）／
#   明治の江戸の人口の急減（二次資料だけ）／南北戦争の余った銃（研究の要旨に言い切る文が無い）／徳川昭武の年齢。
#   「とされる」「といわれる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
