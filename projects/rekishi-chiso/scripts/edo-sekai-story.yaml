sections:
  # ================================================================ 序章。答えの席：鎖国の日本は、取り残されていたのか
  - title: 家康とエリザベス1世　同じ「1603年3月24日」は同じ日か
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1603
    lines:
      # fact: edo-01, edo-02
      - 語り: 記録の上では、徳川家康が将軍になった日に、イングランドの女王、エリザベス1世が、亡くなっています。どちらも、1603年の3月24日です。
        tone: 重い
      # fact: edo-02
      - 語り: 同じ日に見えます。ところが、じつは違います。女王が亡くなったのは、家康が将軍になった、《10日》あとでした。
      - 語り: 江戸幕府の始まりは、イングランドの、ひとつの時代の終わりと、ほとんど重なっていたのです。
      - 語り: 江戸時代、世界は、どうだったのか。
        tone: 疑問
      - 語り: 鎖国で、日本は、世界から取り残された。そう習った人も、多いはずです。
      # fact: edo-24
      - 語り: けれど、2017年、文部科学省は、学校で教える中身を決める、学習指導要領の案から、鎖国という言葉を、いったん外そうとしました。
      # fact: edo-22
      - 語り: 鎖国という言葉そのものも、家康の時代には、まだありません。生まれたのは、1801年です。
      - 語り: 家康から慶喜まで、およそ260年。同じ年の世界を並べると、見えてくることがあります。鎖国の日本は、本当に、世界から取り残されていたのか。
        tone: 疑問
      # fact: edo-10
      - 語り: その1603年。日本の浜には、もう、ヨーロッパの船が来ていました。
        tone: 疑問
        hook: true

  # ================================================================ 第1章 1603
  - title: 1603年、家康が将軍になった年　世界はどうだった？
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1603
    lines:
      # fact: edo-01
      - 語り: 家康が将軍になったのは、慶長8年の2月12日。国立天文台の暦のデータで、今の暦に直すと、1603年の3月24日です。
      # fact: edo-02
      - 語り: イングランドは、このころまだ、古いユリウス暦を使っていました。ウェストミンスター寺院の紹介が書く、女王の死の3月24日は、今の暦では、4月3日にあたります。
        card: {head: "同じ3月24日", body: "今の暦では10日ずれ"}
      # fact: edo-11
      - 語り: その1年前、1602年の3月には、オランダで、東インド会社が生まれています。
      # fact: edo-11
      - 語り: オランダの議会から、喜望峰より東の貿易を、21年のあいだ、独り占めにする許しを得た会社でした。
      # fact: edo-12
      - 語り: オランダ国立公文書館によれば、1602年から1700年までのあいだだけで、31万7千人が、この会社の船で、ヨーロッパからアジアへ向けて、船出しています。
      # fact: edo-10
      - 語り: 日本にも、その少し前の1600年、オランダの船、リーフデ号が、豊後、今の大分の浜に流れ着いていました。
      # fact: edo-10
      - 語り: 乗っていたイングランド人、ウィリアム・アダムスは、家康の外交の相談役になり、三浦按針と名乗ります。
      # fact: edo-13
      - 語り: 1609年には、オランダ東インド会社の船が、長崎の北西の平戸に入り、オランダの商館が開かれました。
      - 語り: では、そのころの日本には、どれだけの人がいたのか。
        tone: 疑問
      # fact: edo-04
      - 語り: じつは、全国の人口を数えた記録は、まだありません。今ある数字は、どれも、研究者の推計です。そして、その推計が、大きく割れています。
      # fact: edo-04
      - 語り: 歴史人口学の速水融は、1600年の日本を、1000万から1400万人とみました。そのあいだを取った1200万が、よく使われてきた数です。
        figure: {type: table, title: 1600年の日本の人口　推計の違い, cols: [推計, だれの推計か], rows: [[1910年の推計, 1800万人, 吉田東伍], [よく使われてきた数, 1200万人, 速水融], [2015年の推計, 1700万人, 斎藤修・高島正憲]], upto: 3}
      # fact: edo-04
      - 語り: ところが、2015年に、斎藤修と高島正憲が出した推計は、1700万人です。
      - 語り: 1200万と1700万。その差は、500万人。同じ日本の、同じ年の数が、およそ1.4倍も違います。
      - 語り: もう1つ、よく聞く数字があります。日本の銀は、世界の銀の、3分の1だった。
        figure: null
      # fact: edo-06
      - 語り: 一橋大学の研究会が出した、2017年の論文で、スフルールスが推計した日本の銀の産出は、いちばん多い1630年ごろで、1年に90トンあまり。
      # fact: edo-06, edo-08
      - 語り: 同じころ、南アメリカのボリビアの銀山は、それだけで1年に200トンを超えていました。この推計から計算すると、3分の1には、届きません。
      # fact: edo-07
      - 語り: 中国へ出した銀の量も、日本の歴史家、岩生成一と、アメリカのフォン・グラーンとで、推計が3倍ほど違います。
        figure: {type: table, title: 日本から出た銀　1年あたりの推計, cols: [1年あたり, だれの推計か], rows: [[17世紀の初め, 140〜180トン, 岩生成一], [1601〜1645年, 54トン, フォン・グラーン]], upto: 2}
      - 語り: それでも、鎖国の前の日本は、銀で、世界の商いの輪の中にいました。
        figure: null
      # fact: edo-14
      - 語り: そして、1603年から36年後。日本は、ヨーロッパの船の一つを、締め出します。
        tone: 疑問
        hook: true

  # ================================================================ 第2章 1639
  - title: 1639年、鎖国が完成した年　世界は戦のさなかだった？
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1639
    lines:
      # fact: edo-14
      - 語り: 寛永16年、1639年。幕府は、ポルトガル人の来航を禁じます。
      # fact: edo-14
      - 語り: 長崎の出島は、もともと、そのポルトガル人を住まわせるために、海を埋め立てて造った島でした。でき上がったのは、1636年。禁止のあと、空き家になります。
      # fact: edo-15
      - 語り: そこへ移されたのが、平戸のオランダ商館です。長崎市の紹介によれば、移ったのは、寛永18年の5月17日。今の暦で、1641年の6月25日でした。
      # fact: edo-16
      - 語り: その少し前、九州では、島原・天草の一揆が起きていました。一揆に加わった人の数は、記録で、大きく違います。
      # fact: edo-16
      - 語り: 観光庁の解説は、女性や子どもも入れて、およそ3万7千人。ポルトガル人のコレアは、女性と子どもを除いて、およそ3万5千人と書きました。
        figure: {type: table, title: 島原・天草の一揆　加わった人の数, cols: [人数, 書いた人], rows: [[観光庁の解説, 約3万7千人, 女性と子どもも入れて], [ポルトガル人コレア, 約3万5千人, 女性と子どもを除いて], [平戸のオランダ商館長, 1万8千人, 1638年1月の記録]], upto: 3}
      # fact: edo-16
      - 語り: 一方、原城に立てこもる前、1638年の1月に、平戸のオランダ商館長、クーケバッケルが書いた数は、1万8千人。ほぼ半分です。
      # fact: edo-17
      - 語り: 原城が落ちたのは、寛永15年の2月28日。今の暦で、1638年の4月12日のことでした。
        figure: null
      - 語り: 日本で、大きな一揆が鎮められたころ。世界は、何をしていたのか。
        tone: 疑問
      # fact: edo-18
      - 語り: ヨーロッパでは、1618年から、三十年戦争が続いていました。宗教の争いから始まり、ヨーロッパの大国が次々に加わった戦です。
      # fact: edo-18
      - 語り: 戦場になったドイツの人口が、どれだけ減ったのか。これも、推計が割れます。1940年に、ギュンター・フランツは、農村で4割が失われたとみました。
      # fact: edo-18
      - 語り: 2008年に、ピーター・ウィルソンは、もっと控えめに、2割ほどとみています。それでも、2割です。
        card: {head: "三十年戦争のドイツ", body: "推計で人口の2割〜4割を失う"}
      # fact: edo-20
      - 語り: 1642年には、イングランドで、国王と議会の内戦が始まります。
      # fact: edo-19
      - 語り: そして、1644年の4月25日。反乱軍が北京に入り、明の最後の皇帝、崇禎帝は、宮殿の北の丘で、自ら命を絶ちました。
        tone: 重い
      # fact: edo-19
      - 語り: このあと、北の満州から入った清が、北京を首都にします。日本は、寛永21年。家光が、将軍の時代です。
      # fact: edo-21
      - 語り: 1648年、三十年戦争を終わらせた、ウェストファリア条約。その日付は、10月14日と24日の、2つで記録されています。
      # fact: edo-21
      - 語り: プロテスタントの土地は古いユリウス暦、カトリックの土地は今の暦を使っていて、ここでも、同じ日が、10日ずれて書かれたのです。
      - 語り: 日本が戸を閉めたころ、ヨーロッパと中国は、戦のさなかにありました。
        tone: しみじみ
      # fact: edo-23
      - 語り: もっとも、歴史家の荒野泰典は、日本は国を閉ざしたのではない、と説いてきました。長崎、対馬、薩摩、松前。限られた窓口で、周りの国々とつながっていた、というのです。
      # fact: edo-29
      - 語り: 出島の移転から、およそ50年後。江戸城で、将軍が、ヨーロッパ人に、踊れと命じます。
        tone: 疑問
        hook: true

  # ================================================================ 第3章 1700ごろ
  - title: 1700年ごろ、元禄の江戸　ロンドンとパリより大きかったのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1700
    lines:
      # fact: edo-25
      - 語り: 1680年、5代将軍、徳川綱吉の時代が始まります。やがて、元禄の時代が来ます。
      # fact: edo-25
      - 語り: このころ、世界には、名前を知られた君主が、そろっていました。フランスのルイ14世。ロシアのピョートル1世。清の康熙帝。
        figure: {type: table, title: 同じ時代の4人の君主, cols: [在位, 国], rows: [[徳川綱吉, 1680〜1709年, 日本の将軍], [ルイ14世, 1643〜1715年, フランス], [ピョートル1世, 1682〜1725年, ロシア], [康熙帝, 1661〜1722年, 清]], upto: 4}
      # fact: edo-25
      - 語り: 綱吉を入れた4人が、そろって位にあったのは、1682年から1709年までの、27年間です。
      # fact: edo-26
      - 語り: 1682年は、ルイ14世が、宮廷をヴェルサイユ宮殿に移した年。同じ年に、ピョートル1世が、位につきました。
        figure: null
      # fact: edo-29
      - 語り: そのころ、江戸城で、綱吉に会ったヨーロッパ人がいました。出島のオランダ商館の医者、ドイツ人のケンペルです。1691年のことでした。
      # fact: edo-29
      - 語り: 綱吉は、すだれの向こうから、一行に、次々と注文を出しました。羽織を脱げ。歩け。踊れ。跳ねろ。酔っぱらいのまねをしろ。歌え。
      # fact: edo-29
      - 語り: ケンペルは、自分の手記に、これを、猿芝居と書いています。のちに校訂されて本になった、手稿に残る言葉です。
      # fact: edo-30
      - 語り: 135年後、1826年に江戸へ行ったシーボルトは、この余興が、もう無くなっていたのを、幸運だった、と書きました。
      - 語り: では、綱吉の江戸は、どれほどの町だったのか。
        tone: 疑問
      # fact: edo-34, edo-36
      - 語り: 1700年のロンドンは、イギリスの歴史人口学者、リグリーの推計で、およそ57万5千人。パリは、50万人あまりとされます。
      # fact: edo-32
      - 語り: 江戸は、およそ100万人。そう言われてきました。ただ、その中身を見ると、町人は、1721年の調べで、およそ50万人。
      # fact: edo-32
      - 語り: 残りの50万人は、武士とその家族の推計です。内閣府の報告書も、その50万人を、どう数えたのかは書いていません。
        figure: {type: table, title: 1700年ごろの町の大きさ　推計, cols: [人口, 数え方], rows: [[江戸, 約100万人, 町人の調べ50万＋武家の推計50万], [ロンドン, 約57万5千人, リグリーの推計], [パリ, 50万人あまり, 研究者の推計]], upto: 3}
      # fact: edo-34
      - 語り: アメリカの研究者、ハンレーも、武家の数は推計だと断ったうえで、1700年の江戸は、ロンドンを含む、どのヨーロッパの町より大きかった、と書きました。
      # fact: edo-33
      - 語り: 一方、東京都立図書館は、当時の江戸の人口を、正確に見積もるのは難しい、とします。1800年代の初めの数として、江戸90万、ロンドン86万という比べも、載せています。
        figure: null
      # fact: edo-35
      - 語り: 都市の研究者、ロズマンは、北京と江戸が、18世紀を通して、世界でいちばん大きな町だった見込みが高い、としています。
      # fact: edo-37
      - 語り: 1721年、8代将軍、吉宗の命で、幕府は、全国の人口を数え始めます。数は、およそ2607万人。ただし、武士などは、入っていません。
      # fact: edo-38
      - 語り: 歴史人口学の鬼頭宏は、幕府の数に2割を足して、全体の人口としました。同じやり方で計算すると、1721年の日本は、およそ3100万人です。
      # fact: edo-40
      - 語り: 同じころのイングランドは、ケンブリッジの研究者たちの推計で、1701年におよそ520万人とされます。フランスは、1900万から2200万人ほどとされます。
        figure: {type: table, title: 1700年ごろの国の人口　推計, cols: [人口, 出どころ], rows: [[日本（1721年）, 約3100万人, 幕府の調べ＋鬼頭宏の2割], [フランス, 1900万〜2200万人, 研究者の推計], [イングランド（1701年）, 約520万人, ケンブリッジの推計], [清, 5600万〜1億6000万人, 推計の幅が約3倍]], upto: 4}
      - 語り: 日本は、イングランドの、およそ6倍。フランスと比べても、1.5倍ほどです。
      # fact: edo-39
      - 語り: 清は、もっと大きな国です。ただ、ロンドン・スクール・オブ・エコノミクスの研究者がまとめた表では、1700年の中国の人口の推計は、5600万から1億6000万。3倍近い幅があります。
        figure: null
      # fact: edo-45
      - 語り: お金の集め方も、比べてみます。1694年、イングランドでは、新しくできたイングランド銀行が、1268人の市民から、11日で120万ポンドを集めます。
      # fact: edo-45
      - 語り: そのお金を、フランスとの戦の資金として、政府に貸しました。
      # fact: edo-45
      - 語り: その翌年、1695年。幕府は、小判に含まれる金を減らす、元禄の改鋳をします。イングランドは借りて、幕府は金を薄めて、同じころに、お金を工面していました。
      # fact: edo-41
      - 語り: そして1730年。大坂の堂島の米の市場が、幕府に認められます。先の日の値段を、今のうちに決めて売り買いする、先物の取引も、一緒に開かれていました。
        card: {head: "1730年 大坂・堂島", body: "米の先物の取引を幕府が認める"}
      # fact: edo-42
      - 語り: 1989年に、ドイツ出身の研究者、シェーデは、今の先物取引所の条件をそろえた、最初の組織的な取引所は、18世紀の日本にあった、と書きました。
      # fact: edo-42
      - 語り: シカゴの商品取引所ができるのは、1848年。堂島が認められた、118年後です。
      # fact: edo-48
      - 語り: 堂島から46年後の1776年。海の向こうでは、1つの国と、1つの機械が、生まれようとしていました。
        tone: 疑問
        hook: true

  # ================================================================ 第4章 1774〜1801
  - title: 1776年から1789年　独立宣言と蒸気機関と、寛政の改革
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1776
    lines:
      # fact: edo-48
      - 語り: 1776年の7月4日。アメリカの13の植民地の代表が、独立宣言を採択しました。
      # fact: edo-49
      - 語り: 同じ1776年。イギリスでは、ワットの改良した蒸気機関の、最初の2台が、製鉄所と炭鉱に据え付けられます。
        card: {head: "1776年", body: "独立宣言と、ワットの蒸気機関"}
      # fact: edo-47
      - 語り: その2年前、1774年の日本では、杉田玄白たちが訳した、解体新書が出ていました。オランダ語の解剖の本を、日本の言葉に直した本です。
      # fact: edo-51
      - 語り: そして1783年。アイスランドのラキ火山が、翌年の2月まで、およそ8か月、噴き続けます。
      # fact: edo-51
      - 語り: 2011年のアメリカの科学誌の論文によれば、アイスランドでは、人口の、およそ21パーセントが亡くなりました。
      # fact: edo-52
      - 語り: 噴煙は、北半球の広い範囲を覆い、続く冬のヨーロッパは、いつもの年より、3度ほど寒くなりました。
      # fact: edo-50
      - 語り: 同じ1783年の夏、日本では、浅間山が噴火します。内閣府の報告書は、死者を1624人としています。
        figure: {type: map, title: 1783年　同じ年の2つの噴火, bounds: [-30, 150, 10, 72], reveal: true, places: [[ラキ火山, -18.2, 64.1], [浅間山, 138.5, 36.4]]}
      - 語り: 東北を中心に、天明の飢饉が、広がっていきます。
        figure: null
      # fact: edo-54
      - 語り: 幕府の人口の調べは、その減り方を、数で残していました。1780年は、およそ2601万人。6年後の1786年は、およそ2509万人。
        figure: {type: table, title: 幕府の全国の人口の調べ（武士などを除く）, cols: [人口, 前の調べからの差], rows: [[1780年, 2601万600人, ""], [1786年, 2508万6466人, 92万4134人減], [1792年, 2489万1441人, さらに19万5025人減]], upto: 3}
      # fact: edo-54
      - 語り: 6年で、およそ92万人。3.5パーセントあまりが、減っています。
      # fact: edo-55
      - 語り: ところが、辞典によっては、この飢饉の死者を、90万人以上と書きます。この数は、人口の調べの差と、ほとんど同じです。
      # fact: edo-55
      - 語り: 人口の差には、生まれる子が減った分も、入っています。人口の減りが、死者の数に、言い換えられているのかもしれません。
        figure: null
      # fact: edo-57
      - 語り: アメリカで、最初の国勢調査が行われたのは、1790年。数は、およそ393万人でした。
      # fact: edo-59
      - 語り: 幕府が全国の人口を数え始めたのは、1721年。アメリカより、およそ70年。イギリスの最初の国勢調査、1801年より、80年早いのです。
        card: {head: "人を数え始めた年", body: "幕府は1721年から"}
      # fact: edo-58
      - 語り: 1792年の幕府の数は、およそ2489万人。武士を入れなくても、同じころのアメリカの、およそ6.3倍です。
      # fact: edo-61
      - 語り: 天明7年の6月、西暦では1787年の夏。松平定信が、老中の筆頭になり、寛政の改革が始まります。
      # fact: edo-61
      - 語り: その2年後、1789年の7月14日。パリでは、民衆が、バスティーユの牢獄を襲いました。フランス革命です。
      # fact: edo-60
      - 語り: このころのフランスの人口は、およそ2800万人。武士を除いた日本の数より、1割あまり多いくらいです。
      # fact: edo-62
      - 語り: 1791年、林子平が、海国兵談という本を出します。海からの守りを説いた本でした。定信は、世の中に無用の不安を起こすとして、この本を絶版にします。
      # fact: edo-62
      - 語り: 翌年の1792年、本が絶版になった、わずか4か月後。ロシアの使節、ラクスマンが、北海道の根室に来ました。漂流した伊勢の船頭、大黒屋光太夫を送り届け、通商を求めるためでした。
      # fact: edo-65
      - 語り: ヨーロッパの戦は、長崎にも届きます。1795年、オランダの本国は、フランス革命の軍に占領され、1799年には、オランダ東インド会社が、解散しました。
      # fact: edo-65
      - 語り: このころ、出島に来た、オランダの船の中には、オランダが雇った、アメリカの船がありました。
      # fact: edo-67
      - 語り: のちに、オランダ本国がフランスに併合された1810年から数年、世界でオランダの旗が揚がっていたのは、出島だけだった、といわれます。
      # fact: edo-67
      - 語り: 長崎市は、出島の商館長、ドゥーフの回想を、その根拠に挙げています。
      # fact: edo-22, edo-31
      - 語り: 話を1801年に戻します。もとオランダ通詞の、志筑忠雄が、ケンペルの論文を訳して、鎖国論と題しました。鎖国という言葉は、ここから始まります。
      # fact: edo-31
      - 語り: ケンペルの論文の、もとの題を訳すと、こうです。最良の見識によって、国を閉ざしている日本王国。ケンペルは、国を閉ざすことを、ほめていました。
      # fact: edo-22, edo-71
      - 語り: 鎖国という言葉が生まれて、およそ50年。黒い船が来ることを、幕府は、その前の年に、知らされていました。
        tone: 疑問
        hook: true

  # ================================================================ 第5章 1840〜1867
  - title: 1853年から1867年　ペリーの4隻と、同じ年の世界の戦
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    year: 1853
    lines:
      # fact: edo-69
      - 語り: 話は、少し前の1840年から。この年から、オランダは、幕府に、別段風説書という、特別の海外の知らせを、出すようになります。
      # fact: edo-69
      - 語り: 最初の中身は、イギリスと清の、アヘン戦争でした。
      # fact: edo-70
      - 語り: 清の負けは、すぐに日本に伝わり、幕府は、外国の船を打ち払えという命令を和らげて、1842年、薪や水を与えてよい、とする命令を出します。
      # fact: edo-71
      - 語り: そして1852年。長崎に着いたオランダ商館長、クルティウスは、アメリカが日本へ艦隊を送る、と知らせる書簡を、長崎奉行に差し出しました。
      # fact: edo-73
      - 語り: 翌年、1853年の別段風説書も、1852年11月の知らせとして、アメリカの日本遠征の計画を、こう伝えています。船は13隻。大砲は236門。人は3125人。
        tone: 重い
      # fact: edo-73
      - 語り: この中身は、2008年の東京大学史料編纂所の紀要に、オランダ語の原文が翻刻されています。ただ、この風説書が長崎に届いたのが、ペリーの来る前だったのかは、分かっていません。
      # fact: edo-74
      - 語り: けれど、1853年の7月8日、浦賀の沖に来た艦隊は、4隻でした。
        figure: {type: table, title: ペリー艦隊　1852年11月の知らせと実際, cols: [船, 人], rows: [[オランダの知らせ, 13隻, 3125人], [浦賀に来た艦隊, 4隻, 1000人弱]], upto: 2}
      # fact: edo-74
      - 語り: 蒸気で動く大きな船が2隻、ミシシッピとサスケハナ。帆で走る船が2隻。乗っていたのは、1000人足らず。知らせより、ずっと小さな艦隊でした。
      # fact: edo-75
      - 語り: 旗艦のサスケハナは、長さ、およそ78メートル。水かきの車を回して進む、外輪の蒸気船でした。
        figure: null
      - 語り: 同じ1853年。世界では、何が起きていたのか。
        tone: 疑問
      # fact: edo-77
      - 語り: その年の3月、中国では、太平天国の軍が、南京を落として、首都にしていました。
      # fact: edo-77
      - 語り: 1851年から1864年まで続いた、この乱の死者は、2000万から3000万人と書かれることが多くあります。数に幅があるのは、戦の中で記録が途切れ、推計に頼るしかないからです。
      # fact: edo-78
      - 語り: 10月には、オスマン帝国がロシアに戦を宣言し、クリミア戦争が始まります。
      # fact: edo-78
      - 語り: 死者は、病気で亡くなった人も入れて、少なくとも75万人。歴史家のファイジズは、100万人を超えたとみています。
        figure: {type: table, title: 1853年に続いていた戦　死者の推計, cols: [死者の推計, 期間], rows: [[太平天国の乱, 2000万〜3000万人, 1851〜1864年], [クリミア戦争, 75万〜100万人あまり, 1853〜1856年]], upto: 2}
      # fact: edo-77, edo-87
      - 語り: ペリーが浦賀に来たころ。太平天国の死者は、少なく見積もっても、当時の日本の人口の、6割ほどにあたります。
        figure: null
      # fact: edo-81
      - 語り: 1860年、幕府は、アメリカへ使節を送ります。従う人も入れて、77人。アメリカの軍艦、ポーハタン号で海を渡り、幕府の船、咸臨丸も、サンフランシスコまで、ついていきました。
      # fact: edo-79
      - 語り: その翌年、1861年。アメリカでは、南北戦争が始まります。
      # fact: edo-79
      - 語り: 死者は、長いあいだ、およそ62万人と言われてきました。2011年、ビンガムトン大学のハッカーは、国勢調査から数え直して、およそ75万人と推計しています。2割ほど多い数です。
        card: {head: "南北戦争の死者", body: "62万人→75万人（2011年の推計）"}
      # fact: edo-87
      - 語り: そのアメリカの、1860年の国勢調査の人口は、およそ3144万人。同じころの日本は、鬼頭宏の推計で、3200万から3400万人あまりです。
        figure: {type: table, title: 幕末の日本とアメリカの人口, cols: [人口, 出どころ], rows: [[日本（1846〜1865年）, 3200万〜3400万人あまり, 鬼頭宏の推計], [アメリカ（1860年）, 約3144万人, 国勢調査]], upto: 2}
      - 語り: 幕末の日本とアメリカは、人口では、ほぼ同じ大きさの国でした。
      # fact: edo-82
      - 語り: 1862年には、幕府の使節が、ロンドンに着き、第2回ロンドン万博の、開会式に招かれています。
        figure: null
      # fact: edo-90
      - 語り: ただ、町の大きさは、もう逆になっていました。1851年の国勢調査で、ロンドンは、およそ236万人。
      # fact: edo-90
      - 語り: 江戸は、町人がおよそ50万人のまま、武家を足して、100万前後と見られています。ロンドンは、江戸の、2倍あまりに育っていたのです。
        card: {head: "1851年", body: "ロンドンは江戸の2倍あまり"}
      # fact: edo-83
      - 語り: そして1867年。パリの万国博覧会に、日本は、初めて正式に加わりました。幕府と、薩摩藩と、佐賀藩が、それぞれ品を出しています。
      # fact: edo-84
      - 語り: 同じ1867年。慶応3年の10月14日、今の暦では11月9日。将軍、徳川慶喜は、政権を朝廷に返すと申し出ます。大政奉還です。
        tone: 重い
      - 語り: では、鎖国の日本は、世界から取り残されていたのか。
        tone: 疑問
        hook: true

  - title: まとめ：1603年から1867年、鎖国の日本は世界から取り残されていたのか
    background: {image: paintings/hidenaga_yamato_province_map_1735.jpg, credit: "中村寒翠《大和国細見図》1735年"}
    lines:
      # fact: edo-24
      - 語り: 2017年、鎖国という言葉は、学校で教える中身から外されかけて、結局、ほぼ元に戻りました。完全に国を閉ざしていたわけではない、というのが、外そうとした理由でした。
        tone: しみじみ
      - 語り: 並べてみた数字も、閉じた国の像とは、少し違います。
        tone: しみじみ
      # fact: edo-38
      - 語り: 1721年の日本の人口は、およそ3100万人。1701年のイングランドの、およそ6倍。江戸は、ロンドンやパリより大きかった、とみる研究者がいます。
        tone: しみじみ
      # fact: edo-59
      - 語り: 人口の調べは、アメリカより、およそ70年早く始まっていました。
        tone: しみじみ
      # fact: edo-71, edo-73
