    short: s1
  - 語り: 通説で、決め手とされるのは、小早川秀秋です。松尾山を下りて、味方のはずの大谷吉継の陣を攻めた、とされます。
    short: s1
  - 聞き: 主役は家康と三成じゃないの？ 決め手が、ひとりの武将の一歩って、すごい話だよね。
    tone: 驚き
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: この日の3人です。徳川家康は数え59歳、石田三成は41歳。そして、小早川秀秋は、わずか19歳でした。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    figure:
      type: stats
      title: 関ヶ原の年（数え）
      items:
