        - 59歳
        - 数え。東軍
      - - 石田三成
        - 41歳
        - 数え。西軍の中心
      - - 小早川秀秋
        - 19歳
        - 数え。松尾山
    short: s1
  - 聞き: 19歳って、高校3年生くらいじゃん。その子が、天下分け目を決めたの？
    tone: 驚き
    short: s1
  - 語り: そこで、今日の問いです。もし、小早川秀秋が松尾山から動かなかったら。西軍は、勝っていたのか。問いは3つあります。
    portrait: null
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 今日の3つの問い
      body: 戦いは？ 西軍は？ 毛利は？
    figure: null
    short: s1
  - 語り: 1つ目。戦いは、続いたのか。2つ目。西軍は、勝てたのか。3つ目。南宮山の毛利勢は、動いたのか。ここでいう西軍の勝ちは、東軍が攻め切れずに引くこと、とします。
  - 聞き: 関ヶ原の「もしも」って、よく聞くけど。ちゃんと考えた研究って、あるの？
    tone: 疑問
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 先に断ります。関ヶ原で西軍が勝った場合を、正面から論じた学術研究は、今回の調査では見つかりませんでした。
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
    card:
      head: 最初の断り
      body: 論じた研究は見つからない
  - 聞き: 研究がないなら、ほとんど想像、ってこと？ 材料は、ちゃんとあるのかな。想像だけで話されると、ちょっと不安かも。
    tone: 疑問
  - 語り: 約束が2つ。事実と想像は分けます。想像のあいだは《ここから想像》の札を出し、可能性を、高い、ありうる、ほぼ妄想の3段階で示します。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: この回の約束
      body: 事実と想像を分け、可能性を付ける
  - 聞き: 材料は、本物だけなんだよね？
    tone: 疑問
  - 語り: はい。史料に残る動きと、研究で割れている点だけです。まずは、天下分け目の前の、夏から掘ります。
