  background:
    image: paintings/hanbei_gifu_castle_zu.jpg
    credit: 《岐阜城図》（江戸時代）
  year: 1600
  lines:
  - 語り: 8月22日から23日、東軍の池田輝政らが木曽川を渡り、岐阜城を攻めます。城主の織田秀信は、降伏しました。
    portrait: null
    card:
      head: 8月23日
      body: 岐阜城が降伏
    figure: null
  - 語り: 救援に向かった石田三成と島津の隊も、撃退されました。
  - 聞き: 西軍、前哨戦は負けから始まったんだ。
  - 語り: 同じころ、信濃の上田城です。真田昌幸と信繁は、下野の犬伏で東軍を離れ、西軍につきます。昌幸の長男、信之は、東軍に残りました。
    background:
      image: paintings/shingen_ueda_castle_map_trim.jpg
      credit: 《信州上田城図》（江戸時代）
    card:
      head: 犬伏
      body: 真田父子は西軍、信之は東軍
  - 語り: 9月、徳川秀忠が約3万8千の軍で、上田城を囲みます。ただ、8日に、家康から上洛を命じられました。秀忠は、関ヶ原に遅れます。
    card:
      head: 9月8日
      body: 秀忠、上洛を命じられる
  - 語り: 秀忠が家康と合流するのは、9月20日です。関ヶ原の戦いの5日後でした。
    background:
      image: paintings/shingen_ueda_castle_map_trim.jpg
      credit: 《信州上田城図》（江戸時代）
  - 聞き: 息子の軍が間に合わないって、家康、困ったよね。
  - 語り: 上田で徳川が大敗した、という話は、江戸時代の『烈祖成績』に出ます。ただ、同時代の史料の裏づけは無く、近年は小競り合い程度だった、とみる見方が有力です。
  - 聞き: そっちも、後から大きくなった話かもしれないんだ。勝った側の記録だと、負けた話は小さく書きそうだけど、逆なんだね。
    tone: 納得
    background:
      image: paintings/hanbei_gifu_castle_zu.jpg
      credit: 《岐阜城図》（江戸時代）
  - 語り: 9月14日の夜、島清興、通称、島左近が、杭瀬川で東軍に奇襲をかけた、とされます。家康が赤坂に着き、西軍が動揺したからです。
    background:
      image: paintings/hanbei_mino_map.jpg
      credit: 《美濃国郡県人跡路程図》（19世紀）
    card:
      head: 9月14日夜
      body: 杭瀬川の奇襲（島清興）
  - 語り: 同じ夜、石田三成や島津義弘ら西軍の主力は、大垣城を出て、関ヶ原へ向かいます。小早川秀秋は、松尾山に入りました。
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 9月14日夜
      body: 西軍、関ヶ原へ。秀秋は松尾山へ
  - 聞き: 島左近の奇襲は、勢いをつけたかったのかな。いよいよ、関ヶ原に集まったんだね。陣は、どんな並びだったの？
    tone: 疑問
    hook: true
  - 語り: 次は、9月15日の朝の布陣です。
    hook: true
- title: 9月15日の朝 桃配山と松尾山 布陣と兵数
  background:
    image: paintings/sekigahara_map_1926.jpg
    credit: 関ヶ原の布陣図（午前なかば、藤井治左衛門、1926年）
  year: 1600
  lines:
  - 語り: 東軍の家康は、桃配山に本陣を置きました。江戸を出たときの家康の兵は、約3万3千、とされます。
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
    card:
      head: 桃配山
      body: 家康の本陣
  - 語り: 西軍は、関ヶ原を囲む山にいました。南西の松尾山に小早川秀秋。南東の南宮山に毛利秀元と吉川広家。位置は、史料で表記が違います。
    portrait: null
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 聞き: 西軍が山の上から囲んでる形なんだね。なんだか、西軍が有利そうに見えるけど。
  - 語り: この布陣を見て、ドイツの軍人メッケルが「西軍の勝ちだ」と言った、という話があります。ただ、その発言の出典は無く、布陣図が作られたのは、メッケルの帰国後だとする指摘もあります。
    portrait: null
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: メッケルの逸話
      body: 出典が見つからない
  - 聞き: 有名な話なのに、出典が無いんだ。じゃあ、西軍有利って印象も、ちょっと怪しいのかな。
    tone: 納得
  - 語り: 兵の数も、割れます。西軍は8万以上、東軍は7万4千から10万4千と、見積もりに幅があります。西軍の主な隊を、史料の一つの数で並べます。
    background:
      image: paintings/sekigahara_map_1926.jpg
      credit: 関ヶ原の布陣図（午前なかば、藤井治左衛門、1926年）
    card:
      head: 兵数
      body: 史料で大きく割れる
    figure:
      type: bars
      title: 西軍の主な隊の数（史料の一つの数）
      bars:
      - - 宇喜多秀家
        - 15000
      - - 小早川秀秋
        - 8000
      - - 石田三成
        - 6000
      - - 小西行長
        - 5000
      - - 島津義弘
        - 3000
      labels:
      - 1万5千
      - 8千
      - 6千
      - 5千
      - 3千（別の記述は約300）
  - 語り: 東軍の主な隊も、同じく史料の一つの数で並べます。家康は、江戸を出たときの数です。福島正則が8千、井伊直政の先手が2千、本多忠勝が4百です。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    figure:
      type: bars
      title: 東軍の主な隊の数（史料の一つの数）
      bars:
      - - 徳川家康（江戸出陣時）
        - 32730
      - - 福島正則
        - 8000
      - - 井伊直政（先手）
        - 2000
      - - 本多忠勝
        - 400
      labels:
      - 約3万3千
      - 8千
      - 2千
      - 4百
  - 聞き: 島津さんが3千って、別の記述だと約300なんだ。何の数かで、桁が変わるの？
    tone: 疑問
  - 語り: はい。島津隊は、別の記述で約300、1千人説もあります。戦場にいた数か、率いてきた数かで、数字が変わります。
    figure: null
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 聞き: 桁が違うのは、もう別の軍だよ。
  - 語り: 戦いの始まりも、割れます。午前8時ごろとも、10時ごろとも言われます。笠谷和比古さんは、8時ごろに小さな戦いが始まり、霧が晴れた10時ごろに本格化した、とみます。
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 開戦の時刻
      body: 午前8時ごろ〜10時ごろ
  - 聞き: そのあいだに、秀秋は、いつ動いたの？
    tone: 疑問
    hook: true
  - 語り: ここから、秀秋の一歩を掘ります。
    hook: true
- title: 1582年〜1599年 小早川秀秋 幼少から松尾山まで
  background:
    image: paintings/sekigahara_zubyobu_p3a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1590
  lines:
  - 語り: 小早川秀秋は、1582年、木下家定の五男として生まれます。母は杉原家次の娘です。呼び名の辰之助は、同時代の史料で確かめられていません。
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    card:
      head: 1582年
      body: 木下家定の五男として誕生
  - 語り: 数え3歳で、叔父の羽柴秀吉の猶子になり、4歳で養子になります。7歳で従五位下・侍従になり、秀俊と名乗り、丹波亀山10万石を与えられました。
    card:
      head: 7歳
      body: 丹波亀山10万石
  - 聞き: 7歳で、10万石の城主なの？ 小学生で、もう偉い人なんだ。
    tone: 驚き
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 語り: 10歳で参議、11歳で権中納言。肩書は、どんどん上がります。数え13歳の1594年ごろ、秀吉の命で、小早川隆景の養子になりました。
    card:
      head: 1594年ごろ
      body: 小早川隆景の養子に
  - 語り: 翌1595年、秀次事件に連座して、亀山領を改易されます。12月ごろ、隆景の隠居で、小早川領30万7千石を継ぎ、筑前国主になります。14歳でした。
    card:
      head: 1595年
      body: 14歳で筑前国主に
  - 聞き: 取られたり、もらったり、自分で決めたことって、あったのかな。
    tone: 疑問
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 養父の隆景が、数え16歳の6月に亡くなります。秀秋は朝鮮への出兵に加わり、のちに越前12万石へ減封されます。
    card:
      head: 数え16歳
      body: 隆景が没、朝鮮出兵に加わる
  - 語り: 秀吉が亡くなったのは、8月18日。翌年2月5日、五大老連署の知行宛行状で、筑前・筑後に復領し、59万石になります。
    card:
      head: 1599年2月5日
      body: 筑前・筑後に復領、59万石
  - 聞き: 出世して、減らされて、また戻って、周りの大人の都合で、動かされっぱなしだったんだね。自分で決めた経験が少ないまま、天下分け目に立ったって、重いなあ。
    background:
      image: paintings/sekigahara_zubyobu_p2b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: その秀秋が、数え19歳で、あの山にいました。次は、松尾山を下りた時期です。
    hook: true
  - 聞き: 動いたのは、いつなの？
    tone: 疑問
    hook: true
- title: 慶長5年9月15日 小早川秀秋 松尾山を下りたのはいつか
  background:
    image: paintings/sekigahara_zubyobu_p3a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1600
  lines:
  - 語り: 秀秋の兵は、書状では約8千です。ほかに、松尾山のふもとには、脇坂安治の約1千2百、小川祐忠の約2千5百らがいました。
    background:
      image: paintings/sekigahara_map_1926.jpg
      credit: 関ヶ原の布陣図（午前なかば、藤井治左衛門、1926年）
  - 聞き: 8千に、ふもとの隊を足したら、けっこうな数だね。山の上は、人でいっぱいだったんだ。
  - 語り: 9月14日、秀秋は松尾山城に入ります。15日、西軍を離れ、大谷吉継の陣を攻めました。ここまでは、確かです。
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
    card:
      head: 9月15日
      body: 秀秋が西軍を離れる
    short: s2
  - 語り: 割れるのは、時期です。研究者の説は、3つあります。
    figure: null
    short: s2
  - 語り: 1つ目は、白峰旬さん。開戦の午前10時ごろに、秀秋はすぐ山を下りた、とみます。
    figure:
      type: stats
      title: 小早川秀秋の離反 3つの説
      items:
      - - 白峰旬
        - 開戦直後
        - 午前10時ごろ
      - - 笠谷和比古
        - 正午ごろ
        - 数刻の戦いのあと
      - - 渡邊大門
        - 戦いの前
        - 決定の可能性
      upto: 1
    short: s2
  - 語り: 2つ目は、笠谷和比古さん。島津義弘の『惟新公御日記』が、数刻の戦いのあとの裏切りと書くことなどから、正午ごろとみます。
    figure:
      type: stats
      title: 小早川秀秋の離反 3つの説
      items:
      - - 白峰旬
        - 開戦直後
        - 午前10時ごろ
      - - 笠谷和比古
        - 正午ごろ
        - 数刻の戦いのあと
      - - 渡邊大門
        - 戦いの前
        - 決定の可能性
      upto: 2
    short: s2
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 3つ目は、渡邊大門さん。工作は8月28日以前からあり、戦いの前に、家中で裏切りが決まっていた可能性を示します。
    figure:
      type: stats
      title: 小早川秀秋の離反 3つの説
      items:
      - - 白峰旬
        - 開戦直後
        - 午前10時ごろ
      - - 笠谷和比古
        - 正午ごろ
        - 数刻の戦いのあと
      - - 渡邊大門
        - 戦いの前
        - 決定の可能性
      upto: 3
    short: s2
  - 聞き: 同じ山、同じ日なのに、朝と昼と、前の日まで割れるんだ。
    tone: 驚き
    short: s2
  - 語り: 有名な『問鉄砲』も確かめます。家康が小早川の陣へ鉄砲を撃ち込み、決断を迫った、という話です。画面は、後世の屏風の一部です。
    portrait: null
    background:
      image: paintings/sekigahara_senjinzu_toiteppo.jpg
      credit: 関ヶ原戦陣図屏風（右隻の一部、19世紀）
    card:
      head: 問鉄砲
      body: 江戸時代の二次史料にだけ出る
    figure: null
  - 語り: 初出は、1663年の『慶長軍記』です。続いて1688年の『黒田家譜』。同時代の史料では、確かめられていません。
  - 聞き: ドラマの名場面が、後付けかもしれないんだ。
    tone: 納得
  - 語り: 一方、笠谷さんは、『備前老人物語』に秀秋が迷う様子があることから、迷った、という点は信じてよい、とみます。
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 聞き: 迷ったのは、本当かもしれないんだね。迷って、もし動かなかったら……。
    tone: しみじみ
    hook: true
  - 語り: その前に、動かなかった人たちを見ます。
    hook: true
- title: 南宮山の毛利勢と島津義弘 動かなかった味方
  background:
    image: paintings/sekigahara_zubyobu_p2a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1600
  lines:
  - 語り: 南宮山には、毛利秀元、吉川広家、安国寺恵瓊らがいました。あわせて約4万1千5百、と書状にあります。
    portrait:
      image: paintings/sekigahara_kikkawa_hiroie.jpg
      caption: 吉川広家（江戸時代の肖像）
      age: false
    card:
      head: 南宮山
      body: 毛利勢は約4万1千5百（書状の数）
    short: s3
  - 聞き: 4万って、家康の本隊より多いんじゃない？ それが、戦わなかったの？
    tone: 驚き
    short: s3
  - 語り: 長宗我部盛親、長束正家も、南宮山のふもとにいました。どの隊も、戦いに加わっていません。経緯は分かっていません。
  - 語り: 理由とされるのは、前日の9月14日の動きです。吉川広家は、黒田長政を通じて東軍と交渉し、本多忠勝と井伊直政の起請文を得ました。領国を守る代わりに、毛利勢は戦わない、という密約です。
    card:
      head: 9月14日
      body: 吉川広家の密約
    short: s3
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 語り: 広家は、毛利の諸将と協議せず、結んだとされます。15日、広家の隊が前をふさぎ、毛利秀元は動けず、戦わずに退いた、とされます。
    short: s3
  - 聞き: 味方の前を、味方がふさいでるの？ 毛利の中でも、割れてたんだね。
    tone: 驚き
  - 語り: 総大将の毛利輝元は、大坂城にいました。西軍の取り決めでは、家康が西へ来たら、輝元が出陣して指揮する手はずでした。しかし、関ヶ原が終わるまで、大坂城を動いていません。
    portrait:
      image: paintings/sekigahara_mori_terumoto.jpg
      caption: 毛利輝元（江戸初期の肖像）
      age: false
    card:
      head: 毛利輝元
      body: 大坂城から動かず
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 聞き: 総大将が、戦場にいなかったの？ それって、かなり痛くない？ 現場の人たちも、動きにくいよね。
    tone: 疑問
  - 語り: 島津義弘も、本戦では兵をほとんど動かさなかった、とされます。夜襲を進言した話は、1727年の『落穂集』にだけあり、島津側の史料には見えません。史実とは言えません。
    portrait: null
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
    card:
      head: 島津義弘
      body: 夜襲の進言は『落穂集』だけ
  - 語り: 9月15日、島津義弘の隊は、小早川の離反のあと、孤立します。そこから敵の中へ突き進み、戦場を離れました。島津の退き口です。
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 島津の退き口
      body: 生還は80数名と言われる
    short: s5
  - 語り: 生きて戻ったのは、80数名、と言われます。母数も、約300、約1千、約1千5百と、史料で割れます。後世の軍記には、別の数もあります。
    short: s5
  - 聞き: 80人しか戻れなかった、って……。数字が重いね。戦う気がなかったのか、様子を見てたのか、そこも気になるな。
    tone: 重い
    short: s5
    background:
      image: paintings/sekigahara_zubyobu_p2b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 井伊直政と松平忠吉が負傷し、追撃が緩んだ、とも伝わります。島津は、のちに本領を安堵されました。
    short: s5
  - 聞き: じゃあ、史料に残る、別の道はあったの？
    tone: 疑問
    hook: true
  - 語り: 次は、そこを掘ります。
    hook: true
- title: 9月25日と10月1日 関ヶ原のあと 約束は覆された
  background:
    image: paintings/sekigahara_zubyobu_p2a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1600
  lines:
  - 語り: 戦いは、東軍の勝ちで終わりました。9月25日、毛利輝元は、領国を守るという条件で、大坂城を出ます。
    portrait:
      image: paintings/sekigahara_mori_terumoto.jpg
      caption: 毛利輝元（江戸初期の肖像）
      age: false
    card:
      head: 9月25日
      body: 輝元が大坂城を退去
  - 聞き: じゃあ、毛利は、守られたんじゃない？
    tone: 疑問
  - 語り: ところが、輝元が総大将として積極的に動いていたことが分かると、家康は約束を覆します。広家らの尽力で、取りつぶしは免れましたが、毛利は周防・長門の2か国に減らされます。
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
    card:
      head: 毛利の減封
      body: 約120万石から防長2か国へ
  - 聞き: 密約で戦わなかったのに、守られなかったの？ 広家、かなり苦しい立場だね。
    tone: 驚き
  - 語り: 10月1日、石田三成、小西行長、安国寺恵瓊が、京都の六条河原で処刑されます。
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 10月1日
      body: 三成ら3人が処刑
  - 聞き: 負けた側は、そうなるんだ。……重いね。
  - 語り: 石高も動きました。家康は255万石から400万石へ、145万石の増加です。豊臣の直轄領は、222万石から約65万石へ減りました。
    portrait: null
    card:
      head: 石高の移り変わり
      body: 東軍が勝ち、領地が動いた
    figure:
      type: bars
      title: 関ヶ原の前と後（万石）
      bars:
      - - 豊臣直轄領・前
        - 222
      - - 豊臣直轄領・後
        - 65
      - - 徳川家康・前
        - 255
      - - 徳川家康・後
        - 400
      - - 毛利・前
        - 120
      - - 毛利・後
        - 30
      labels:
      - 222万石
      - 約65万石
      - 255万石
      - 400万石
      - 120万石
      - 約30万石
  - 聞き: 勝った側と負けた側で、領地が一気に入れ替わったんだ。上杉や佐竹も、ずいぶん減らされたって聞くよね。家康の増えかた、会社なら、とんでもない大型買収だよね。
    tone: 驚き
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 語り: 一方、立花宗茂や丹羽長重らは、のちに大名へ復帰します。負けた側が、全員、そのまま消えたわけではありません。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    figure: null
  - 聞き: 負けた人が、また戻れる場合もあったんだね。全部が全部、終わりじゃなかったんだ。
  - 語り: この結果を知っているから、私たちは、関ヶ原を、天下分け目、と呼びます。では、史料に残る別の道は、あったのか。
    hook: true
  - 聞き: 動かなかった選択肢が、本当にあったのか、気になるな。
    tone: 疑問
    hook: true
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
- title: 史料に残る別の道 迷い・出陣・密約
  background:
    image: paintings/sekigahara_screen_gifu_L.jpg
    credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  year: 1600
  lines:
  - 語り: 想像の前に、史料に残る別の道を、3つ見ます。当時の人が実際に考えていた選択肢だけです。1つ目。秀秋が迷い続ける道。
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    card:
      head: 別の道 1
      body: 秀秋が迷い続ける
  - 語り: 『備前老人物語』に、迷う様子が書かれ、笠谷さんは信じてよい、とみます。ただ、迷ったあと、山を下りたのが史実です。動かなかった記録は、今回の調査では見つかっていません。
  - 聞き: 迷ったことは残ってるけど、動かない、は書いてないんだ。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 2つ目。毛利輝元が出陣する道です。取り決めは、輝元が大坂から出て指揮するものでした。実際には、動きませんでした。経緯は分かっていません。
    portrait:
      image: paintings/sekigahara_mori_terumoto.jpg
      caption: 毛利輝元（江戸初期の肖像）
      age: false
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 別の道 2
      body: 輝元が出陣する
  - 語り: 3つ目。吉川広家の密約が、なかった道です。広家は、西軍の敗北を予想して交渉した、とされます。
    portrait:
      image: paintings/sekigahara_kikkawa_hiroie.jpg
      caption: 吉川広家（江戸時代の肖像）
      age: false
    card:
      head: 別の道 3
      body: 広家の密約がない
  - 聞き: どれも、実際に選べた道なんだね。どれか1つで、西軍は勝てたのかな？
    tone: 疑問
  - 語り: そこは分かりません。しかも、秀秋の離反は、戦前から工作されていた、とみる見方もあります。渡邊さんの見方です。動かない道は、史料では見えにくくなります。
    portrait: null
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 聞き: 史料が無いなら、どうやって考えるの？
    tone: 疑問
    hook: true
  - 語り: 当時の人の選択肢を土台に、想像で掘ります。分岐点は、ひとつだけ。秀秋が、松尾山から動かないことです。
    hook: true
- title: 想像① 9月15日の昼ちかく 桃配山に動かない松尾山
  background:
    image: paintings/sekigahara_screen_gifu_L.jpg
    credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  year: 1600
  lines:
  - 語り: ここから先は、想像です。仮定は、ひとつだけ。9月15日、小早川秀秋は、松尾山から動きません。西軍にも東軍にも、手を出さずに、山にいます。
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    card:
      head: ここから想像
      body: 秀秋は松尾山から動かない
    short: s4
  - 語り: ほかは史実のままです。毛利勢は戦わず、輝元は大坂城にいます。ここでいう西軍の勝ちは、東軍が攻め切れずに引くこと、とします。
  - 語り: この場面を正面から論じた研究は、今回の調査では見つかっていません。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: ただ、一つ、分かれ目があります。松尾山のふもとの脇坂安治ら4隊です。史実では、秀秋のあとに寝返った、と二次史料にあります。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 分かれ目
      body: 松尾山のふもとの4隊
  - 語り: 4隊が史実どおり寝返れば、大谷隊は持ちません。4隊も動かなければ、大谷隊は持ちます。どちらになるかは、材料がありません。
  - 聞き: 秀秋が動かなくても、ほかの4隊が動いたら、結局、同じになっちゃうの？
    tone: 疑問
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: はい。だから、ここは2つに分けて考えます。まず、家康の本陣から見ます。
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
  - 語り: 想像劇場、第1幕です。9月15日の昼ちかく、桃配山の本陣。家康と井伊直政が、向き合います。
    background:
      image: paintings/sekigahara_zubyobu_p2a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: 想像劇場 第1幕
      body: 9月15日昼ちかく 桃配山の本陣
  - 語り: 本陣は、のちに前へ進んだとも言われますが、一次史料は未確認です。ここでは桃配山のままとします。
  - 人物: 「直政、松尾山は、まだ動かぬか」
    who: 家康想像
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
    short: s4
  - 人物: 「動きませぬ。大谷殿の陣へ向かう様子も、ありませぬ」
    who: 直政想像
    portrait:
      image: paintings/sekigahara_ii_naomasa.jpg
      caption: 井伊直政（江戸時代の肖像）
      age: false
    short: s4
    background:
      image: paintings/sekigahara_zubyobu_p2b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 人物: 「あの若者は、何を考えておる」
    who: 家康想像
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
  - 人物: 「分かりませぬ。ただ、待つほど、ほかの隊が苦しくなります」
    who: 直政想像
    portrait:
      image: paintings/sekigahara_ii_naomasa.jpg
      caption: 井伊直政（江戸時代の肖像）
      age: false
    short: s4
  - 人物: 「福島や黒田は、まだ戦えるか」
    who: 家康想像
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
  - 人物: 「戦えます。ただ、決め手がありませぬ」
    who: 直政想像
    portrait:
      image: paintings/sekigahara_ii_naomasa.jpg
      caption: 井伊直政（江戸時代の肖像）
      age: false
    background:
      image: paintings/sekigahara_screen_gifu_R.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 人物: 「決め手は、あの山にある。それを、わしは、待つしかないのか」
    who: 家康想像
    portrait:
      image: paintings/sekigahara_tokugawa_ieyasu.jpg
      caption: 徳川家康（江戸前期の肖像、伝・狩野探幽）
      age: false
    short: s4
  - 聞き: 家康が、人に頼るしかない顔をしてる。……あーしなら、胃が痛くなりそう。
    tone: しみじみ
    portrait: null
  - 語り: ここでは、戦いが昼を過ぎても続く、と想像します。決め手の離反が無ければ、東軍の攻めは、すぐには決まらないからです。可能性は、ありうる、です。
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: ありうる
      body: 戦いは昼を過ぎて続く
    short: s4
  - 語り: ただ、続いた戦いが、どちらへ傾くか。秀忠は、史実で9月20日に家康と合流します。長引けば、合流の余地はあります。傾く先は、材料がなく、ほぼ妄想です。
    card:
      head: ほぼ妄想
      body: どちらに傾くかは材料なし
  - 聞き: 秀忠の軍は、5日後にやっと来るんだよね。それまで、持つのかな。
    tone: 疑問
    hook: true
    background:
      image: paintings/sekigahara_zubyobu_p3b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 語り: 次は、秀秋のいる山のほうに、場面を移します。
    hook: true
- title: 想像② 午後の松尾山 三成と秀秋
  background:
    image: paintings/sekigahara_zubyobu_p2a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1600
  lines:
  - 語り: 想像劇場、第2幕です。午後の松尾山。石田三成が、秀秋に直接、問いかけます。2人が会った記録は、ありません。
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: ここから想像
      body: 第2幕 午後 松尾山
  - 人物: 「内府殿に付くのか、わが方に付くのか。今、ここで答えてもらいたい」
    who: 三成想像
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
  - 人物: 「……わしは、どちらにも、味方せぬ。ここで、戦を見ておる」
    who: 秀秋想像
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
  - 人物: 「見ておるだけで、よいのか。ここが動けば、勝負が決まる」
    who: 三成想像
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
  - 人物: 「決まるからこそ、動けぬのだ。どちらが勝つか、まだ分からぬ」
    who: 秀秋想像
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
  - 人物: 「ならば、せめて、大谷殿に、手を貸してもらいたい」
    who: 三成想像
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
    background:
      image: paintings/sekigahara_zubyobu_p3a.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 人物: 「手を貸せば、内府殿が許さぬ。貸さねば、そなたが許さぬ。……わしは、まだ十九じゃ」
    who: 秀秋想像
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
  - 人物: 「十九の者が、天下の分かれ目に立っておる。腹をくくれ」
    who: 三成想像
    portrait:
      image: paintings/sekigahara_ishida_mitsunari.jpg
      caption: 石田三成（18〜19世紀ごろの肖像）
      age: false
  - 人物: 「くくれぬ。それが、わしの答えじゃ」
    who: 秀秋想像
    portrait:
      image: paintings/sekigahara_kobayakawa_hideaki_portrait_trim.jpg
      caption: 小早川秀秋（17世紀前半の肖像）
      age: false
    background:
      image: paintings/sekigahara_zubyobu_p2b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
  - 聞き: 秀秋、ほんとに追い詰められてるね。あーしなら、動けないかも。どっちに付いても、誰かに恨まれるもんね。
    tone: しみじみ
    portrait: null
  - 語り: ここでは、秀秋が最後まで動かない、と想像します。史料に残る迷いが、そのまま続く形です。可能性は、ありうる、です。
    background:
      image: paintings/sekigahara_screen_gifu_L.jpg
      credit: 関ヶ原合戦図屏風（部分、岐阜市歴史博物館蔵、江戸後期）
    card:
      head: ありうる
      body: 秀秋は最後まで迷い続ける
  - 語り: 大谷吉継の隊は、書状で約1千2百、別の記述では約600です。4隊が史実どおり寝返れば、側面を攻められます。動かなければ、持ちこたえます。この分かれ目は、ほぼ妄想です。
    background:
      image: paintings/sekigahara_zubyobu_p2b.jpg
      credit: 関ヶ原合戦図屏風（部分、江戸時代）
    card:
      head: ほぼ妄想
      body: 大谷隊は4隊の動き次第
  - 聞き: 持ちこたえるかどうかは、ふもとの4隊しだい、なんだね。西軍の本拠は、どうなってるんだろう。
    tone: 疑問
    hook: true
  - 語り: 場面は、翌日の大坂城に移ります。
    hook: true
- title: 想像③ 9月16日 大坂城に届く口上
  background:
    image: paintings/sekigahara_zubyobu_p3a.jpg
    credit: 関ヶ原合戦図屏風（部分、江戸時代）
  year: 1600
  lines:
  - 語り: 想像劇場、第3幕です。9月16日、大坂城。輝元のもとへ、吉川広家の使者が着きます。広家は南宮山にいるので、使者が口上を伝える形にします。広家の言葉は、使者の口上として読みます。
