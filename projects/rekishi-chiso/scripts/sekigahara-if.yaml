en:
  title: What If the Western Army Had Won Sekigahara? | The Day Kobayakawa Hideaki Did Not Move
  description: 'On the 15th day of the 9th month of Keicho 5 (October 21, 1600), the Battle of Sekigahara was decided within hours. The traditional account says the turning point was Kobayakawa Hideaki, aged 19 by Japanese count, who came down from Mount Matsuo and attacked his own side. This video asks: what if he had not moved?


    We keep records, theories and imagination apart. First, what the sources say: Tokugawa Ieyasu''s Aizu campaign and the rising of Ishida Mitsunari, the skirmishes at Gifu, Ueda and the Kuise River, the deployment and the numbers that historians cannot agree on, three competing theories about WHEN Hideaki switched sides, the ''warning shot'' story that appears only in later sources, and the Mori army that never fought.


    Then, clearly marked imagination with reasons: noon at Ieyasu''s camp, Mitsunari and Hideaki on the mountain, a messenger reaching Osaka Castle, a table of fates, and how Japan might differ. In imagined parts we speak plainly, and the on-screen label tells you how likely it is: likely, possible, or nearly fantasy. We found no study that argues this counterfactual directly, and we say so.


    The accounts of competing theories follow summaries on Wikipedia and similar sources; we have not checked the original texts.


    A Japanese history video to listen to while you work (Japanese audio).'
  chapters:
  - 'September 15, 1600: The Turning Point Was a 19-Year-Old'
  - 'Summer 1600: Ieyasu to Aizu, Mitsunari and Terumoto Rise'
  - 'Skirmishes: Gifu Castle, Ueda Castle, the Kuise River'
  - 'Morning of the 15th: Deployment and Troop Numbers'
  - 'Kobayakawa Hideaki: A Boy Moved by Adults, 1582-1599'
  - 'September 15: When Did He Come Down from the Mountain?'
  - 'Mori and Shimazu: The Allies Who Did Not Move'
  - 'After Sekigahara: A Promise Broken, Domains Redrawn'
  - 'Other Paths in the Sources: Hesitation, Terumoto, the Secret Pact'
  - 'Imagination 1: Noon at Momokubari Hill'
  - 'Imagination 2: Mitsunari and Hideaki on the Mountain'
  - 'Imagination 3: A Messenger Reaches Osaka Castle'
  - 'Imagination 4: A Table of Fates'
  - 'Imagination 5: How Japan Changes, and the Chains to Today'
  - 'Summary: The Fork on Mount Matsuo'
