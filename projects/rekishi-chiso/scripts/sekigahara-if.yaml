# B（歴史の転換点の if ストーリー）。型：事実（関ヶ原の戦い・小早川秀秋の離反の時期＝研究で割れる分かれ道）→ 史料に残る別の道（秀秋の迷い／輝元の出陣／広家の密約がない）→ 「こうなった可能性」（理由つき）。
# 事実の出どころは dev/output/rekishi-chiso/research/sekigahara_if_facts.md（確実／有力／説／未確認の区分もそこ）。絵の一覧は sekigahara_if_assets.md。
# 決まり：B は昼12時・約30分／題名は「もし〇〇だったら｜…どうなったか」／再生リストは A と分ける（歴史のif）／想像の部分は画面に「ここから想像」の札
#   人物のセリフは B では想像のセリフを入れてよい。①「ここから想像」の札が出ている節（想像①②③）だけ ②字幕に「（想像）」（roles の家康想像・直政想像・三成想像・秀秋想像・輝元想像・広家想像）
#   ③記録のセリフは本編に置かない。同じ幕で声が重ならない：第1幕＝家康（麒ヶ島宗麟）と直政（黒沢冴白）／第2幕＝三成（玄野武宏）と秀秋（白上虎太郎）／第3幕＝輝元（離途）と広家（雀松朱司）
# 分岐点は1つだけ：小早川秀秋が松尾山から動かなかったら。ほかは史実のまま（毛利勢の不戦・輝元は大坂城・秀忠の遅参）。
# 想像の部分は言い切る。確かさは画面の札（高い／ありうる／ほぼ妄想）で正直に出す。札の名は声に出す型を「可能性は、〜、です」に統一。
#   高い＝広家の密約は9月14日で秀秋の動きと別（事実の並置）／ありうる＝戦いが昼を過ぎて続く・秀秋は迷い続ける（備前老人物語の迷い）・大谷隊が側面を突かれない・輝元は大坂に残る（史実でも動かず）・毛利家が減封されない／
#   ほぼ妄想＝戦いの傾く先・ふもとの隊の動き・西軍が勝ち切れるか・三成の行方・島津の退き口の有無・豊臣政権と江戸幕府の有無・長州の因果。
# 研究：「西軍が勝っていたら」を正面から論じた研究は見つかっていない（冒頭と各想像の節で断る）。論じられているのは秀秋の離反の時期（白峰旬・笠谷和比古・渡邊大門）と問鉄砲（藤本正行・三池純正・呉座勇一が疑問視）。本文は未読（Wikipedia 経由）。
# 年齢は数えの自分の計算：家康1542生→59、三成1560生→41、秀秋1582生→19（1602没は数え21）。メッケルの逸話は出典なしと断る。島津隊の数（約300／3千）は何の数かで割れると言う。
# 使わない話：問鉄砲を事実として／三成の讒言／メッケルの逸話を事実として／島津の夜襲進言を事実として／血・遺体・首／三成の最期の描写／ネット掲示板・個人ブログの「もし西軍が〜」／淀殿・秀頼の最期。
# 画面の決まり：背景に人物の肖像・拡大絵を使わない（肖像は額）／縦横比2.4:1以上の絵は使わない（大坂図屏風は detail で寄せる）／黒縁は切り抜いた版を使う／現代の写真は今回は使っていない。
