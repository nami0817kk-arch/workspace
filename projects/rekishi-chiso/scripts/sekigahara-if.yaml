  - 語り: 関ヶ原では、小早川の裏切りに備えて、直属の約600で迎えた、と後世の軍記にあります。茶会の逸話や白頭巾の姿も、典拠が分かりません。事実で言えるのは、9月15日に亡くなったことです。
