# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  右目に眼帯をつけた、独眼竜。その姿で描かれた江戸時代の肖像画は、実は一枚もありません。
  仙台藩の記録には、政宗が「わたしが死んだあと像を造るなら、両方の目を正しく造れ」と命じた、と書きとめられています。
  右目を失った男は、なぜ、両目のある自分を残させたのか。
  この動画でわかること
  ・『治家記録』が書く右目の話――「年月知らず」の疱瘡、片目を恥じて隠したこと、片倉小十郎の言い伝え
  ・眼帯の姿と「独眼竜」という呼び名は、どこから来たのか
  ・妻の陽徳院の記憶から作られた瑞巌寺の木像と、その右目をめぐる食い違う記録
  ・1974年の墓の発掘でわかったこと、2019年の調べで頭の骨に残っていた2.5ミリの差、2021年に作り直された顔
description_note: |-
  再現の場面の台詞の一部は、記録をもとにした想像です。画面に「想像」の札と「（想像）」の名札を出しています。
  記録に残る言葉は、出どころ（仙台藩の『治家記録』、仙台市博物館・瑞鳳殿・瑞巌寺の解説など）を語りで示してから読んでいます。

en:
  title: "Date Masamune: Why Did the One-Eyed Dragon Want to Be Remembered With Two Eyes?"
  description: |-
    The One-Eyed Dragon with a patch over his right eye - yet not a single Edo-period portrait shows Date Masamune wearing an eye patch.
    A Sendai domain record says Masamune ordered that any statue made after his death should have both eyes.
    Why did the man who lost his right eye want to be remembered with two?
    In this video you will learn:
    - What the domain chronicle says about his right eye: smallpox in an unrecorded year, the shame he felt, and the legend of Katakura Kojuro
    - Where the eye patch and the name "One-Eyed Dragon" really came from
    - The wooden statue at Zuiganji made from his widow's memory, and the records that disagree about its right eye
    - What the 1974 excavation of his tomb revealed, a 2.5 mm difference found in his skull in 2019, and the face reconstructed in 2021
    Some lines in the re-enacted scenes are imagined and marked "imagined" on screen; recorded words are read with their sources.
    Japanese-language history video to listen to while you work (Japanese audio).
  chapters:
    - "Why Was the One-Eyed Dragon Remembered With Two Eyes?"
    - "Why Did Bontenmaru Hide His Right Eye? Childhood in Yonezawa"
    - "Where Did the Eye Patch and the One-Eyed Dragon Come From?"
    - "'Make Both Eyes Right': Masamune's Last Days, Edo 1636"
    - "How Did Yotoku-in Remember Her Husband's Face? Zuiganji, 1652"
    - "Did His Bones Remember the Right Eye? The 1974 Excavation and the Face of 2021"

