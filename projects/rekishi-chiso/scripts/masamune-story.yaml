sections:
  # ================================================================ 導入（冒頭 約1分40秒）。答え（1974年の結果・2019年の数字・2021年の顔の中身）は最後の章まで言わない
  - title: なぜ独眼竜は、両目で残されたのか　江戸の肖像と瑞鳳殿
    background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
    # AI絵：M01（灯の下、右の横顔を影に沈めた晩年の政宗。眼帯は付けない）
    year: 1636
    lines:
      # 0〜10秒：知らない事実（江戸時代の肖像に眼帯の姿は無い）
      # fact: masamune-05
      - 語り: 右目に眼帯をつけた、独眼竜。その姿で描かれた江戸時代の肖像画は、実は、《一枚もありません》。
        tone: 強調
        card: {head: "江戸時代の肖像画", body: 眼帯の姿は一枚も無い}
      # fact: masamune-05
      - 語り: 仙台市博物館の学芸員、佐々木徹さんは、2017年の仙台市の広報で、そう記しています。
      # fact: masamune-84, masamune-06
      - 語り: 仙台市博物館にある、江戸時代の政宗の画像にも、両方の目が、ふつうに描かれています。
        portrait: {image: paintings/masamune_portrait_yasunobu.jpg, caption: "伊達政宗画像（狩野安信筆、1676年ころ）"}
        tone: しみじみ
      # fact: masamune-06, masamune-79
      - 語り: そして、仙台藩がまとめた伊達家の記録には、政宗が、こう命じた、と書きとめられています。
        portrait: null
      # 【記録】『性山公治家記録』「薨去ノ後尊像ヲ造ラハ兩眼正クセヨ」（masamune-06）。冒頭は今の言葉だけ。原文は第3章で読む
      # fact: masamune-06
      - 語り: わたしが死んだあと、像を造るなら、《両方の目》を、正しく造れ。
        tone: 強調
        card: {head: "仙台藩の記録", body: 像は両方の目を正しく}
      # fact: masamune-07
      - 語り: 政宗は、幼いころに、右目の光を失った人です。
        tone: しみじみ
      - 語り: その人が、なぜ、死んだあとの自分の像には、両方の目を求めたのか。
        tone: 疑問
      # fact: masamune-01
      - 語り: それから、300年あまりのちの、1974年。政宗の墓が開かれ、骨が調べられました。
        background: {image: paintings/masamune_zuihoden_1912.jpg, credit: "経ヶ峯の瑞鳳殿（戦災で焼ける前。田山宗尭編『日本写真帖』1912年）"}
        card: {head: "1974年", body: 政宗の墓が開かれる}
        # AI絵：M11（1974年の発掘。石段の下の穴と、作業着の調査員の後ろ姿）
      # fact: masamune-59
      - 語り: その骨には、政宗が、生きているあいだ隠し続けた右目のことが、ひっそりと残っていました。
        tone: しみじみ
      # fact: masamune-09, masamune-63
      - 語り: それでも、2021年に作り直された政宗の顔にも、義眼が入れられています。
        card: {head: "2021年", body: 作り直された政宗の顔}
      - 語り: 右目を失った男は、なぜ、両目のある自分を、残させたのか。
        tone: 疑問
        pause: 0.8
      - 語り: これは、隠し続けた右目と、両目で残された像をめぐる、ひとつの「なぜ」の記録です。
        tone: しみじみ
        pause: 0.6
        background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
      - 語り: 話は、政宗がまだ、梵天丸と呼ばれていた、幼いころに始まります。
        pause: 0.6

  # ================================================================ 第1章 梵天丸の右目
  - title: 梵天丸は、なぜ右目を隠したのか　米沢の幼いころ
    background: {image: paintings/masamune_smallpox_tametomo_yoshitoshi.jpg, credit: "月岡芳年《新形三十六怪撰 為朝の武威痘鬼神を退く図》1890年（疱瘡の神を退ける図）"}
    # AI絵：M02（米沢の城の奥、熱にうなされる幼い子と、見守る母の手。顔ははっきり描かない）
    year: 1567
    lines:
      # 前置き（誰でも知っている流れ。fact は付けない）
      - 語り: 伊達政宗は、1567年、出羽の国の米沢に生まれました。幼い名は、梵天丸です。
      # fact: masamune-07
      - 語り: その梵天丸が、疱瘡、今でいう天然痘にかかります。
        tone: 重い
      # 【記録】『治家記録』「疱瘡ヲ患ヒシ時年月不知餘毒御目ニ聚テ、其ヨリ右ノ方盲ヒ玉ヒシナリ」（masamune-07・81。「年月不知」は割注）
      # fact: masamune-07
      - 語り: 仙台藩の記録、『治家記録』は、そのとき、病の毒が目に集まり、それから、右の目が見えなくなった、と書いています。
        card: {head: "治家記録", body: 疱瘡の毒が右目に}
      - 語り: 幼い子にとって、片方の目の光を失うことが、どれほどのことだったのか。記録は、そこまでは書いていません。
        tone: しみじみ
      # fact: masamune-81
      - 語り: では、それは、いつのことだったのか。記録は、そこに小さな字で、「年月知らず」と添えています。
        tone: 疑問
        card: {head: "失明の時期", body: 「年月知らず」}
      # fact: masamune-07, masamune-81
      - 語り: 5歳のときと書く文章もあります。けれど、藩の記録そのものは、その年を書いていないんです。
      # fact: masamune-83
      - 語り: 同じ記録には、ふしぎな説も載っています。片目の行者、萬海上人の生まれ変わりだから、政宗も片目なのだ、という説です。
        card: {head: "萬海上人の説", body: 生まれ変わりだから片目}
      # 【記録】「萬海上人ハ隻眼ナリシニヨリ其垢離ヲセシ黑沼ノ魚皆隻眼ナリ」（masamune-83）
      # fact: masamune-83
      - 語り: 萬海上人は片目だったので、上人が身を清めた黒沼の魚まで、みな片目になった。そんな言い伝えまで、記録は書きとめています。
      # fact: masamune-83
      - 語り: そのうえで、片目になったのは、疱瘡のせいだ、と、その説を退けています。
      # fact: masamune-82
      - 語り: もうひとつ、よく知られた話があります。家臣の片倉小十郎景綱が、その右目を取り去った、という話です。
        background: {image: paintings/masamune_sendai_castle_fans.jpg, credit: "《仙台城本丸大広間障壁画 扇面図》1600年ごろ（仙台市博物館蔵）"}
        # AI絵：M03（若い家臣が、少年の前に深く頭を下げる。刃物も傷も描かない）
      # fact: masamune-82
      - 語り: ただ、藩の記録は、この話を、「云ひ伝ふ」。つまり、言い伝えとして書いています。
        tone: 強調
        card: {head: "片倉小十郎の話", body: 記録も「云ひ伝ふ」}
      - 語り: 生まれ変わりの説も、家臣の話も。片目になったわけを、何かに求めようとした、のちの人々の言葉なのかもしれません。
        tone: しみじみ
      # fact: masamune-21
      - 語り: 右目を失った梵天丸は、天正12年の10月12日、数えで18歳のとき、伊達家を継ぎます。
        background: {image: paintings/masamune_sendai_castle_map_edo.jpg, credit: "《仙台城絵図》江戸時代（宮城県図書館蔵）"}
        card: {head: "家督を継いだ日", body: 天正12年10月12日}
        # AI絵：M09（若い当主が、広間の上座で家臣たちの礼を受ける。右目は前髪と影でかくれる。眼帯は付けない）
      # fact: masamune-21
      - 語り: その日付は、山形大学の松尾剛次さんが、政宗の書状から絞り込んだものです。
      # fact: masamune-18
      - 語り: 1590年には、小田原で、天下人の豊臣秀吉の前に、白装束で現れた、と伝えられています。
        # AI絵：M13（小田原へ向かう白装束の政宗。左の横顔）
      - 語り: 天下人の前に立つ、片目の若い当主。けれど、その右目のことを、本人は、どう思っていたのか。
        tone: 疑問
      # 【記録】『治家記録』「政宗君常ニ隻眼ヲ愧チ玉ヒテ、輙モスレハ其方ノ御目ヲ隱シ玉フ」（masamune-79）。語りの中で読む
      # fact: masamune-79
      - 語り: 『治家記録』は、はっきり書いています。「政宗君、常に隻眼を愧ぢたまひて」。
        tone: 重い
        card: {head: "治家記録", body: 「常に隻眼を愧ぢ」}
      # fact: masamune-79
      - 語り: いつも、片目を恥じて、ことあるごとに、その目を、隠していた。
        tone: しみじみ
      # fact: masamune-79
      - 語り: そして、人が片目の話をすると、機嫌を損ねた、とも書いています。
      # 【記録】「此等ノ事書著マシキ義ナリ、然レトモ御隻眼ハ世間ニ普ク書記シ、殊ニ不正ノ說アリ、因テ玆ニ記ス」（masamune-79）
      # fact: masamune-79
      - 語り: 記録は、こうしたことは、本来、書くべきではない、と断っています。それでも、世の中には正しくない説もあるので、ここに記す、と。
      - 語り: 藩の記録が、書くのをためらうほど。右目は、政宗にとって、人に触れられたくない傷でした。
        tone: しみじみ
      # 【想像1】政宗。記録：片目を恥じて隠し、人が片目の話をすると機嫌を損ねた（masamune-79）。気持ちの言葉だけ
      - 人物: 「……この目のことは、言うてくれるな」
        who: 政宗想像
        imagined: true
        tone: しみじみ
        portrait: {image: paintings/masamune_portrait_yasunobu.jpg, caption: "伊達政宗画像（狩野安信筆、1676年ころ）"}
      - 語り: 本人が隠し続けた、右目。ところが、のちの時代の人々は、その右目を、政宗のいちばんの印にしていきます。
        portrait: null
        hook: true
      - 語り: 黒い眼帯と、「独眼竜」という呼び名です。
        tone: 重い
        hook: true

  # ================================================================ 第2章 通説の検証（眼帯と独眼竜）
  - title: 独眼竜の眼帯は、どこから来たのか　1987年の大河ドラマ
    background: {image: paintings/masamune_sendai_castle_hasui_1933.jpg, credit: "川瀬巴水《仙台城の櫓》1933年（国立国会図書館蔵）"}
    # AI絵：M04（撮影所の灯の下、黒い眼帯と鎧が台に置かれている。俳優は描かない）
    year: 1987
    lines:
      - 語り: 右の目を、黒い眼帯で覆った政宗。多くの人が思い浮かべるのは、この姿でしょう。
      # fact: masamune-05
      - 語り: けれど、冒頭で見たとおり、江戸時代の肖像画に、その姿はありません。
        card: {head: "仙台市博物館 2017年", body: 眼帯の肖像画は一つも無い}
      # fact: masamune-77
      - 語り: 佐々木さんは、眼帯の姿は、映画やドラマ、ゲームなどによって広がったイメージだろう、と書いています。
      # fact: masamune-78
      - 語り: 1987年。NHKの大河ドラマ『独眼竜政宗』は、平均視聴率、《39.7パーセント》。大河ドラマの歴代最高といわれます。
        tone: 強調
        figure: {type: stats, title: 1987年の大河ドラマ, items: [[独眼竜政宗, 39.7%, 平均視聴率]]}
      - 語り: 題名そのものが、「独眼竜」でした。
        figure: null
      - 語り: 多くの人にとって、政宗の顔は、このころから、眼帯の顔になっていったのかもしれません。
        tone: しみじみ
      # fact: masamune-24
      - 語り: では、その「独眼竜」という呼び名は、どこから来たのか。
        tone: 疑問
      # fact: masamune-24
      - 語り: もとは、中国の唐の終わりごろの武将、李克用のあだ名です。片目の英雄として、語り継がれてきた人でした。
        card: {head: "独眼竜", body: もとは唐の李克用}
      # fact: masamune-24
      - 語り: 熊本大学の眼科の谷原秀信さんは、2013年に、江戸時代の学者、頼山陽が、政宗を李克用になぞらえたことで、この名が広まった、と述べています。
        card: {head: "頼山陽", body: 政宗を李克用になぞらえる}
      - 語り: 独眼竜の名が広まったきっかけは、政宗が亡くなったあとの、学者のたとえだった、というわけです。
        tone: しみじみ
      # fact: masamune-84
      - 語り: では、江戸時代の肖像は、政宗を、どう描いたのか。仙台藩は、1676年、先祖をまつる堂を建て、政宗らの画像を掛けるならわしを始めます。
        background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
        card: {head: "1676年", body: 先祖をまつる堂に画像を掛ける}
      # fact: masamune-84
      - 語り: そのころに描かれた、狩野安信の画像。冒頭で見た、両方の目が描かれた政宗です。
        portrait: {image: paintings/masamune_portrait_yasunobu.jpg, caption: "伊達政宗画像（狩野安信筆、1676年ころ）"}
      # fact: masamune-06
      - 語り: 熊本大学の谷原さんも、政宗の木像や肖像画は、すべて両目が入れられていた、と紹介しています。
      # 右目を白く描いた像は出どころが1つ（masamune-10）。「伝わる」「といわれ」で言い、所蔵・絵師の名は語りで言わない
      # fact: masamune-10
      - 語り: ただ、江戸時代の政宗の像には、右目を、白く濁ったように描いたものも、わずかに伝わっている、といわれます。
        portrait: {image: paintings/masamune_portrait_mitsusada.jpg, caption: "伊達政宗像（土佐光貞筆と伝わる、江戸時代）"}
        card: {head: "右目を白く描いた像", body: それでも眼帯は無い}
      # fact: masamune-10
      - 語り: 片目の政宗です。けれど、その像にも、眼帯はありません。
      # fact: masamune-05
      - 語り: 2022年に福岡で開かれた特別展でも、眼帯をかけていない政宗像が、見どころのひとつとして紹介されていました。
      - 語り: 両目の像と、片目の像。どちらも、江戸時代の政宗です。眼帯の政宗だけが、その中にいません。
        tone: しみじみ
        portrait: null
      - 語り: 恥じて隠した右目と、のちの人が描いた眼帯。では、政宗本人は、死んだあとの自分を、どう残せと言ったのか。
        tone: 疑問
        hook: true
      # fact: masamune-06
      - 語り: 答えは、冒頭の、あの言葉にあります。
        tone: 重い
        hook: true

  # ================================================================ 第3章 1636年の死と『治家記録』の言葉
  - title: 「両眼正しくせよ」　1636年 江戸　政宗の最期
    background: {image: paintings/masamune_hasekura_paul5_audience.jpg, credit: "《教皇パウロ5世に謁見する支倉常長とソテロ》1615年ごろ（銅版画）"}
    # AI絵：M05（江戸の屋敷の奥、早朝の淡い光、病床の脇に置かれた文机と硯。人物は描かない）
    year: 1636
    lines:
      # 晩年の暮らし（短く）
      # fact: masamune-16
      - 語り: 政宗は、遠いヨーロッパへも、使いを送っていました。1615年、ローマで教皇パウロ5世に会った、支倉常長たちです。
        card: {head: "1615年", body: 支倉常長がローマで教皇に会う}
      # fact: masamune-38
      - 語り: ユネスコに出された資料によれば、使節が持ち帰った教皇の油絵の肖像は、帰国してすぐ、政宗に差し出されたといいます。
      # fact: masamune-29
      - 語り: 使節を率いた支倉常長の肖像も、実在の日本人を描いた、国内に残るいちばん古い油絵、といわれています。
        portrait: {image: paintings/masamune_hasekura_portrait.jpg, caption: "支倉常長像（1615年、仙台市博物館蔵・国宝）"}
        card: {head: "支倉常長像", body: 国内に残る最古の日本人の油絵}
      - 語り: 人の顔を、そのまま写しとる、西洋の油の絵。政宗は、そうした肖像を、手もとで見ていたことになります。
        tone: しみじみ
      # fact: masamune-27
      - 語り: 晩年の政宗は、酒が好きでした。酔いすぎや二日酔いを詫びる手紙まで残っている、と仙台市博物館の学芸員は紹介しています。
        portrait: null
        background: {image: paintings/masamune_sendai_castle_hasui_1933.jpg, credit: "川瀬巴水《仙台城の櫓》1933年（国立国会図書館蔵）"}
      # fact: masamune-30
      - 語り: 2023年には、亡くなる前の年と見られる手紙も見つかりました。細川忠利が訪ねてくるので、一緒にどうか、と、旗本を誘う手紙です。
        card: {head: "2023年に見つかった書状", body: 細川忠利と一緒にどうか}
      # fact: masamune-66
      - 語り: 寛永13年、1636年の5月24日、早朝。政宗は、江戸の桜田の屋敷で、70年の生涯を閉じました。
        tone: 重い
        background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
        card: {head: "1636年5月24日", body: 江戸の桜田の屋敷で}
      - 語り: 片目の少年は、仙台藩の初代の藩主として、その生涯を終えたんです。
        tone: しみじみ
      # fact: masamune-52
      - 語り: 亡骸は、その夜のうちに江戸を発ち、6月3日、仙台に着きます。
        figure: {type: map, title: 1636年 政宗の亡骸の道のり, bounds: [139.0, 141.5, 35.4, 38.6], places: [[江戸, 139.76, 35.68], [仙台, 140.87, 38.26]], route: [江戸, 仙台], note: 6月3日に仙台に着く}
      # 殉死は人数だけ（masamune-67）
      # fact: masamune-67
      - 語り: 瑞鳳殿の案内によれば、その死に、石田将監ら、家臣15人と、その家来5人が、あとを追って亡くなっています。
        figure: null
      # fact: masamune-42
      - 語り: 眠る場所に選ばれたのは、仙台の経ヶ峯。政宗が、ほととぎすの初音を聞きに訪れたとき、ここを自分の墓所にせよ、と家臣に命じた、と伝わる場所です。
        tone: しみじみ
        card: {head: "経ヶ峯", body: ほととぎすの初音の地}
        # AI絵：M06（初夏の早朝、杉と広葉樹の山の上に立つ政宗の後ろ姿。眼帯は付けない）
      # 【想像2】政宗。記録：経ヶ峯を自分の墓所にせよと命じたと伝わる（masamune-42）。気持ちの言葉だけ
      - 人物: 「……ここが、よい」
        who: 政宗想像
        imagined: true
        tone: しみじみ
      # fact: masamune-66
      - 語り: 翌年、その経ヶ峯に、政宗をまつる霊屋、瑞鳳殿が建てられました。
        background: {image: paintings/masamune_zuihoden_1912.jpg, credit: "経ヶ峯の瑞鳳殿（戦災で焼ける前。田山宗尭編『日本写真帖』1912年）"}
        card: {head: "1637年", body: 瑞鳳殿が建つ}
      # 【記録】『治家記録』の流れ（masamune-79・06）：常に隻眼を愧ぢ → 人が隻眼の話をすれば御意に障った → 末代に人の申すところもあれば → 尊像は両眼正しく → 故に、尊像は隻眼に造り奉らず
      # fact: masamune-06
      - 語り: そして、像のこと。『治家記録』の原文は、こうです。「薨去の後、尊像を造らば、両眼正しくせよ」。
        background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
        tone: 強調
        card: {head: "治家記録", body: 「両眼正しくせよ」}
      # fact: masamune-06
      - 語り: 亡くなったあと、像を造るなら、両方の目を正しく造れ。冒頭の言葉です。
      # fact: masamune-79
      - 語り: 記録は、この言葉の前に、理由を書いています。政宗は、いつも片目を恥じていた。人に言われるのを、嫌っていた。
      # fact: masamune-79
      - 語り: そして、のちの世まで、人に何か言われることも、あるだろうから、と。
        tone: しみじみ
      - 語り: 生きているうちに言われることは、まだ我慢もできる。けれど、死んだあとの姿は、もう自分では、隠すことができません。
        tone: しみじみ
      # fact: masamune-06
      - 語り: 記録は、こう結びます。「故に、尊像は、隻眼に造り奉らず」。だから、像は、片目には造らなかった。
        tone: 強調
        card: {head: "治家記録", body: 「尊像は隻眼に造り奉らず」}
      # 食い違い①：両目にした理由（『治家記録』／仙台市博物館）
      # fact: masamune-80
      - 語り: ところが、仙台市博物館の説明は、理由が少し違います。
        figure: {type: stats, title: 両目で残した理由　食い違う説明, items: [[仙台藩の治家記録, 片目を恥じた, 人に言われるのを嫌った], [仙台市博物館の解説, 親不孝と考えた, 親から授かった体]], upto: 1}
      # fact: masamune-80
      - 語り: 政宗は、親から授かった体の一部を欠いたことを、親不孝と考えた、というのです。
        figure: {type: stats, title: 両目で残した理由　食い違う説明, items: [[仙台藩の治家記録, 片目を恥じた, 人に言われるのを嫌った], [仙台市博物館の解説, 親不孝と考えた, 親から授かった体]], upto: 2}
      # fact: masamune-06
      - 語り: 博物館の解説には、肖像画にも右目を描くように、と政宗が語った、ともあります。
        figure: {type: stats, title: 両目で残した理由　食い違う説明, items: [[仙台藩の治家記録, 片目を恥じた, 人に言われるのを嫌った], [仙台市博物館の解説, 親不孝と考えた, 親から授かった体]], upto: 2}
      - 語り: 人の目への恥ずかしさか。親への思いか。藩の記録と、今の博物館とで、理由の書き方が違うんです。
        tone: しみじみ
        figure: null
      - 語り: それでも、行き着く先は同じです。政宗の姿は、両目で残すこと。
        tone: しみじみ
      # fact: masamune-08
      - 語り: 政宗が亡くなって16年目、17回忌の年。その言葉どおりの像が、松島の寺に、まつられます。
        hook: true
      # fact: masamune-43
      - 語り: 像の顔を決めたのは、政宗の顔を、いちばん近くで見てきた人でした。
        tone: しみじみ
        hook: true

  # ================================================================ 第4章 瑞巌寺の木像（1652年）
  - title: 陽徳院は、夫の顔をどう残したのか　1652年 松島の瑞巌寺
    background: {image: paintings/masamune_matsushima_hiroshige_1853.jpg, credit: "歌川広重《六十余州名所図会 陸奥 松島風景富山眺望之略図》1853年（サンディエゴ美術館蔵）"}
    # AI絵：M07（瑞巌寺の本堂の奥、灯に照らされた木像の台座と、手を合わせる年配の女性の後ろ姿）
    year: 1652
    lines:
      # fact: masamune-44
      - 語り: 松島の瑞巌寺。瑞巌寺の案内によれば、政宗が建て直したこの寺の本堂は、1609年、紀州の熊野から運んだ木で建てられました。
        card: {head: "瑞巌寺の本堂", body: 1609年・熊野から運んだ木}
      # fact: masamune-08
      - 語り: その瑞巌寺に、ほぼ等身大の、政宗の木像があります。1652年、政宗の17回忌にあたって作られました。
        background: {image: paintings/masamune_zuiganji_1912.jpg, credit: "瑞巌寺の参道（田山宗尭編『日本写真帖』1912年）"}
        card: {head: "1652年", body: 瑞巌寺の木像}
      # fact: masamune-85
      - 語り: 鎧をつけて、腰をかけた姿です。群馬県立女子大学の塩澤寛樹さんは、2023年の報告で、武家の肖像の彫刻としては、めずらしい甲冑の像だ、としています。
        portrait: {image: paintings/masamune_zuiganji_statue_1912.jpg, caption: "瑞巌寺の伊達政宗甲冑倚像（『日本写真帖』1912年の写真）"}
        card: {head: "塩澤寛樹 2023年", body: 類例のまれな甲冑の像}
      # fact: masamune-85
      - 語り: 高さは88.6センチ。目には、玉眼という技が使われています。
      # fact: masamune-85
      - 語り: 足もとから頭のてっぺんまでは、126.3センチあります。
      # fact: masamune-43
      - 語り: 瑞巌寺の案内によれば、この像は、政宗の正室、陽徳院が、覚えていた夫の姿を、まず絵師に描かせ、それをもとに、京都の仏師に作らせたものです。
        portrait: null
        card: {head: "陽徳院の記憶", body: 絵師に描かせ京都の仏師へ}
        # AI絵：M08（灯の下、年配の陽徳院が絵師の描いた下絵を見つめる。下絵の顔は見せない）
      # fact: masamune-43, masamune-08
      - 語り: 陽徳院。若いころの名を、愛姫といいます。夫が亡くなって、16年目のことでした。
        tone: しみじみ
      # 【想像3】陽徳院。記録：陽徳院の記憶に残る夫の姿を絵師に描かせた（masamune-43）。気持ちの言葉だけ
      - 人物: 「……殿のお顔は、このようでございました」
        who: 陽徳院想像
        imagined: true
        tone: しみじみ
      - 語り: 16年がたっても、妻の記憶の中の夫の顔は、薄れていなかったのでしょう。
        tone: しみじみ
      # 食い違い②：作らせた人（瑞巌寺／塩澤／観光庁）
      # fact: masamune-86
      - 語り: ただ、誰がこの像を作らせたのかは、説明によって、少しずつ違います。
        tone: 強調
        figure: {type: stats, title: 瑞巌寺の木像を作らせたのは, items: [[瑞巌寺の案内, 忠宗と陽徳院, 2代藩主と正室の願い], [塩澤寛樹の報告, 陽徳院, 陽徳院が作らせたとされる], [観光庁の解説文, 政宗自身, 本人が望んだと言われる]], upto: 1}
      # fact: masamune-86
      - 語り: 瑞巌寺の案内は、2代藩主の忠宗と、陽徳院の、ふたりの願いで作られた、とします。
        figure: {type: stats, title: 瑞巌寺の木像を作らせたのは, items: [[瑞巌寺の案内, 忠宗と陽徳院, 2代藩主と正室の願い], [塩澤寛樹の報告, 陽徳院, 陽徳院が作らせたとされる], [観光庁の解説文, 政宗自身, 本人が望んだと言われる]], upto: 1}
      # fact: masamune-86
      - 語り: 塩澤さんの報告は、陽徳院が作らせた像だ、と伝えています。
        figure: {type: stats, title: 瑞巌寺の木像を作らせたのは, items: [[瑞巌寺の案内, 忠宗と陽徳院, 2代藩主と正室の願い], [塩澤寛樹の報告, 陽徳院, 陽徳院が作らせたとされる], [観光庁の解説文, 政宗自身, 本人が望んだと言われる]], upto: 2}
      # fact: masamune-86
      - 語り: そして、国の観光庁の解説文は、政宗自身が、両方の目のある像を望んだと言われる、と書いています。
        figure: {type: stats, title: 瑞巌寺の木像を作らせたのは, items: [[瑞巌寺の案内, 忠宗と陽徳院, 2代藩主と正室の願い], [塩澤寛樹の報告, 陽徳院, 陽徳院が作らせたとされる], [観光庁の解説文, 政宗自身, 本人が望んだと言われる]], upto: 3}
      - 語り: 妻の記憶と、息子の願いと、本人の言葉。どの説明も、この像に、政宗と、そばにいた人の思いを重ねています。
        tone: しみじみ
        figure: null
      # fact: masamune-28
      - 語り: そして、もうひとつ。この像の、右目です。
        tone: 疑問
        portrait: {image: paintings/masamune_zuiganji_statue_1912.jpg, caption: "瑞巌寺の伊達政宗甲冑倚像（『日本写真帖』1912年の写真）"}
      # fact: masamune-28
      - 語り: 観光庁の解説文は、右目を、やや細く作ることで、政宗の本来の姿をほのめかしている、と書きます。塩澤さんも、右目をすがめた姿、と記しています。
        card: {head: "観光庁・塩澤寛樹", body: 右目はやや細い}
      # fact: masamune-28
      - 語り: ところが、瑞巌寺の案内は、遺言によって、幼いときに失った右目が、開いている、とするんです。
        tone: 強調
        card: {head: "瑞巌寺の案内", body: 右目が開いている}
      - 語り: 同じ一体の像の、同じ右目を、ある解説は「細い」と言い、寺の案内は「開いている」と言う。
        tone: しみじみ
      - 語り: 細いのか、開いているのか。見る人によって、答えが分かれる右目です。
        tone: しみじみ
      - 語り: 両目で造れ、という言葉を守りながら、どこかに、本当の姿も、そっと残したのかもしれません。
        tone: しみじみ
        portrait: null
      - 語り: 像は、両目で残りました。けれど、政宗の本当の顔を知っていたのは、像ではなく、墓の中の骨でした。
        hook: true
      # fact: masamune-01
      - 語り: 1974年。その墓が、開かれます。
        tone: 重い
        hook: true

  # ================================================================ 第5章 その後（1945年の焼失・1974年の発掘・2019年・2021年）
  - title: まとめ：骨は、右目を覚えていたのか　1974年の発掘
    background: {image: paintings/masamune_zuihoden_1912.jpg, credit: "経ヶ峯の瑞鳳殿（戦災で焼ける前。田山宗尭編『日本写真帖』1912年）"}
    # AI絵：M10（焼け跡の経ヶ峯、杉木立と残った石段。人物なし）
    year: 1974
    lines:
      # fact: masamune-13
      - 語り: 政宗の墓の上に建つ瑞鳳殿は、国宝に指定されていました。けれど、1945年7月10日の仙台空襲で、焼けてしまいます。
        tone: 重い
        card: {head: "1945年7月10日", body: 仙台空襲で瑞鳳殿が焼ける}
      # fact: masamune-50, masamune-01
      - 語り: 建て直す建物は、350トンを超える重さになると見込まれました。そこで、伊達家の許しを得て、1974年、地下が調べられることになります。
        card: {head: "1974年の発掘", body: 建物は350トンを超える見込み}
        # AI絵：M11
      # fact: masamune-51
      - 語り: 瑞鳳殿の学芸員の報告によれば、政宗の墓の部屋は、床から、およそ3メートルの深さ。石の部屋の中には、水が一滴も、無かったといいます。
      # fact: masamune-53
      - 語り: 記録では、政宗は、束帯という正装で葬られた、とあります。けれど、棺に残っていた布は、麻だけでした。
        tone: 強調
      # fact: masamune-52
      - 語り: 記録にある水銀と塩も、分析では見つからず、代わりに、木炭が出てきました。記録と、地面の下は、ここでも、食い違っていたんです。
      # fact: masamune-69, masamune-70
      - 語り: 一緒に納められた品は、30点あまり。その中には、煙管が2本ありました。使われた年代のはっきりした煙管としては、日本でいちばん古いものになる、と学芸員の報告にあります。
        card: {head: "副葬品", body: 30点あまり・最古の煙管2本}
        # AI絵：M12（黒い布の上に並べた煙管・硯・小さな金のブローチ・日時計。手元だけ）
      # fact: masamune-71, masamune-12
      - 語り: 革の袋の中には、慶長の一分金が3枚と、日時計を兼ねた方位磁石、金のブローチ。ヨーロッパから来たと思われる品には、鉛筆もありました。
      # fact: masamune-72
      - 語り: 硯には、墨が残っていました。亡くなる前の日まで、手紙を書いたときのものだろう、と見られています。
        tone: しみじみ
      - 語り: 墓の中の品は、どれも、晩年の政宗が、身近に置いていたものだったのでしょう。
        tone: しみじみ
      # fact: masamune-61
      - 語り: 骨を調べたのは、東京大学の鈴木尚さんたちだった、と伝えられています。
      # fact: masamune-02, masamune-03
      - 語り: 身長は、およそ《159.4センチ》。当時としては、平均の背たけです。髪の毛から、血液型は、B型と分かりました。
        card: {head: "骨から", body: 身長159.4センチ・B型}
      # fact: masamune-54, masamune-55
      - 語り: 手足の骨は太く、筋肉のつく所が、よく発達していました。鍛えた体だったと、見られています。左の腓骨、すねの外側の骨には、治った骨折の跡もありました。
      # fact: masamune-56
      - 語り: 頭の骨は、平均より大きく、前後に長い形でした。顔は面長で、鼻筋の通った顔立ちだった、と見られています。
      # 食い違い③：頭の骨から片目と分かるか（発掘まもなく／2019年）
      # fact: masamune-04, masamune-60
      - 語り: そして、目です。発掘からまもなくの調べでは、頭の骨の、目のくぼみに傷は無く、片目だったことは、証明できませんでした。
        tone: 疑問
        figure: {type: stats, title: 頭の骨から片目と分かるか, items: [[発掘まもなくの調べ, 証明できない, 目のくぼみに傷は無い], [国立科学博物館の調べ, 証明された, 2019年・左右で2.5ミリの差]], upto: 1}
      # fact: masamune-58
      - 語り: 疱瘡は、骨に跡を残さなかったからだ、と説明されてきました。
        figure: {type: stats, title: 頭の骨から片目と分かるか, items: [[発掘まもなくの調べ, 証明できない, 目のくぼみに傷は無い], [国立科学博物館の調べ, 証明された, 2019年・左右で2.5ミリの差]], upto: 1}
      # fact: masamune-60
      - 語り: そのため、1975年ごろから資料館で見せている政宗の顔は、両方の目がそろった姿で作られています。
        figure: {type: stats, title: 頭の骨から片目と分かるか, items: [[発掘まもなくの調べ, 証明できない, 目のくぼみに傷は無い], [国立科学博物館の調べ, 証明された, 2019年・左右で2.5ミリの差]], upto: 1}
      # fact: masamune-59
      - 語り: ところが、2019年。国立科学博物館の調べで、目のくぼみの高さが、左と右で、《2.5ミリ》違うことが分かります。
        tone: 強調
        figure: {type: stats, title: 頭の骨から片目と分かるか, items: [[発掘まもなくの調べ, 証明できない, 目のくぼみに傷は無い], [国立科学博物館の調べ, 証明された, 2019年・左右で2.5ミリの差]], upto: 2}
      # fact: masamune-59
      - 語り: 瑞鳳殿は、失った右目のまわりの骨が、そこで育つのをやめたためだろう、とし、片目だったことが、頭の骨からも証明された、としています。
        figure: {type: stats, title: 頭の骨から片目と分かるか, items: [[発掘まもなくの調べ, 証明できない, 目のくぼみに傷は無い], [国立科学博物館の調べ, 証明された, 2019年・左右で2.5ミリの差]], upto: 2}
      - 語り: 発掘から、45年。同じ骨が、新しい調べで、別の答えを返したことになります。
        tone: しみじみ
      - 語り: 本人が隠し続け、像には残さなかった右目のことを、骨は、墓の中で400年近く、覚えていたんです。
        tone: しみじみ
        figure: null
        card: {head: "2019年の調べ", body: 骨は右目を覚えていた}
      # fact: masamune-74, masamune-73
      - 語り: 調べのあと、よろいは、ふたたび墓に納められました。ほかの品の一部は、いま、仙台市博物館で見ることができます。
        card: {head: "その後", body: よろいは墓へ・品の一部は博物館へ}
      # fact: masamune-76
      - 語り: 瑞鳳殿は、1979年、焼ける前の姿にならって、建て直されています。
        # AI絵：M14（今の瑞鳳殿。杉木立の中の霊屋、人物なし）
      # fact: masamune-62, masamune-09
      - 語り: 2021年。NHKの番組、『歴史探偵』の依頼をきっかけに、政宗の顔が、もう一度、作り直されます。
        card: {head: "2021年", body: 政宗の顔を作り直す}
      # fact: masamune-09
      - 語り: 監修は、国立科学博物館の坂上和弘さん。顔を形にしたのは、京都芸術大学の戸坂明日香さんだと、瑞鳳殿は紹介しています。
      # fact: masamune-61
      - 語り: 坂上さんは、1974年に政宗の骨を調べた鈴木尚さんの、孫弟子にあたる、といわれます。
      # fact: masamune-64
      - 語り: 肌の色は、骨からは分かりません。坂上さんは、東北地方に多い肌の色のうち、男性にいちばん多い色を、少し日焼けした状態で選んだ、と話しています。
      # fact: masamune-63
      - 語り: そして、肌の色を塗ったあと、義眼が入れられました。
        tone: しみじみ
      # fact: masamune-09
      - 語り: 伊達家の18代当主、伊達泰宗さんは、1974年の発掘に、遺族として立ち会った人です。
      # fact: masamune-06
      - 語り: 泰宗さんは、2021年の取材で、政宗公は「両の目をそなえよ」と遺言されています、と話しています。
      # fact: masamune-89
      - 語り: そして、もし片目の顔として作られたら、今までの政宗像が壊れてしまうのでは、と悩んだ、とも明かしています。
        tone: しみじみ
      - 語り: 子孫もまた、400年前の言葉と、骨が語ることとのあいだで、迷っていたんです。
        tone: しみじみ
      # fact: masamune-65
      - 語り: この新しい顔も、いま、瑞鳳殿の資料館にあります。
      # 結び：なぜの答え（『治家記録』の理由に戻る）
      # fact: masamune-79
      - 語り: なぜ政宗は、両目のある自分を、残させたのか。藩の記録は、片目を恥じ、人に言われるのを嫌い、のちの世まで言われることを気にしたからだ、と書きます。
        tone: しみじみ
        background: {image: paintings/masamune_sendai_castletown_1789.jpg, credit: "《仙台城下絵図》1789年ごろ（仙台市博物館蔵）"}
      - 語り: 生きているあいだは、右目を隠した。そして、死んだあとの、のちの世の人に見られる自分の姿まで、両目と決めておこうとしたのでしょう。
        tone: しみじみ
      # fact: masamune-80
      - 語り: 博物館は、そこに、親から授かった体への思いを見ています。
      - 語り: 恥ずかしさでも、親への思いでも。その根にあるのは、幼い日に失った、右目でした。
        tone: しみじみ
      - 語り: 骨は右目を覚えていて、像と多くの絵は、両目で伝わった。本当の姿と、望んだ姿。そのどちらも、今の仙台にあります。
        tone: しみじみ
        portrait: {image: paintings/masamune_portrait_yasunobu.jpg, caption: "伊達政宗画像（狩野安信筆、1676年ころ）"}
      # 締め：冒頭の眼帯に戻る
      # fact: masamune-05, masamune-06
      - 語り: 右目に眼帯をつけた、独眼竜。その姿は、政宗が望んだものでは、ありませんでした。記録が伝える政宗の望みは、両方の目のそろった、自分の姿です。
        tone: しみじみ
        pause: 0.8

      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: 感想は、コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
        portrait: null
        # AI絵：M15（終了画面用。夕暮れの松島、右半分を空ける）

