# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml と hidetsugu-story.yaml の型）。伊達政宗。2026-10-28 下書き（reading-ok・approve・build はまだ）。
# 公開の予定は 10/29 19:00。
# 型：1本に1つの「なぜ」＝「なぜ政宗は『両目のある自分』を残させたのか」。語り手は剣崎1人（つむぎは出ない）。
#   冒頭（10秒以内）＝江戸時代の肖像画に眼帯の姿は一枚も無い（masamune-05）。
#   導入では答え（1974年に分からなかったこと・2019年の2.5ミリ・2021年の顔の中身）を言わず、最後の章で初めて出す（10-28 の流れの点検）。
#   第1章 梵天丸の右目（疱瘡・年月不知・萬海上人の説・片倉の言い伝え・家督と小田原は2行・恥じて隠した・書くべきでないという記録の断り）／
#   第2章 眼帯と「独眼竜」はどこから来たのか（通説の検証はこの章：映画・ドラマのイメージ・大河・李克用と頼山陽・両目の画像と右目を白く描いた像）／
#   第3章 「両眼正しくせよ」（晩年は短く：パウロ5世の肖像・支倉常長像・酒・2023年の書状 → 1636年の死・経ヶ峯・治家記録の言葉と理由）／
#   第4章 瑞巌寺の木像（陽徳院の記憶・作らせた人・右目）／
#   第5章 まとめ（1945年の焼失・1974年の発掘・骨・2019年の調べ・2021年の顔・泰宗さんの悩み）→「なぜ」の答え→冒頭の眼帯に戻って閉じる。
#   締めは余韻の一文＋登録のお願い。「今日の地層は」・次回予告・二人の締めは無し（story: true）。
# 記録の食い違いを表で並べたのは3か所：①両目にした理由（『治家記録』＝片目を恥じた／仙台市博物館＝親不孝と考えた）
#   ②瑞巌寺の木像を作らせた人（忠宗と陽徳院／陽徳院／政宗自身）。右目の「細い」と「開いている」は語りで
#   ③頭の骨から片目と分かるか（発掘まもなくの調べ＝分からない／2019年の国立科学博物館＝左右で2.5ミリの差）。
#   ほかに語りだけで：記録の束帯と棺の麻布、記録の水銀・塩と分析の木炭。
#
# 事実は事実カード（dev/output/rekishi-chiso/research/伊達政宗_facts_20261028.yaml、masamune-01〜88）にあるものだけ。行の上に `# fact: masamune-NN`。
#   カードに無い「誰でも知っている前置き」（1567年に米沢で生まれた・幼名は梵天丸・仙台藩の初代）は短く使い、# fact を付けない。
#   遺言：『性山公治家記録』永禄十年八月三日条（『伊達政宗卿伝記史料』1938 所収）に「薨去ノ後尊像ヲ造ラハ兩眼正クセヨト仰アリシ故ニ尊像ハ隻眼ニ造リ奉ラス」（masamune-06）。
#     藩が後の時代にまとめた記録なので、政宗の言葉としては「記録は伝えています」「と書きとめられています」と言い、政宗が言ったと断定しない。
#   片倉景綱の話は記録自身が「云ヒ傳フ」（masamune-82）。目の処置の様子は描かない（「取り去った、という話」まで）。
#   右目を白く描いた像（masamune-10。絵師・所蔵はカードの本文に無いので語りでは言わない）・鈴木尚の孫弟子（masamune-61）は出どころが1つなので「といわれます」「と伝えられています」。
#   2021年の顔が両目とも開いているとは出どころに書いていない（義眼を入れた、まで。masamune-63）。
#   殉死は「あとを追って亡くなった」と人数だけ（masamune-67）。
#   「生前に独眼竜と呼ばれた記録は無い」（masamune-88）は出どころが無いので言わない。「5歳で失明」も公的な出どころが無いので、「5歳のときと書く文章もある」まで。
#   政宗の死から木像（1652年2月の開眼供養）までは「16年目・17回忌」と言う（観光庁の「死後17年」は回忌の数え）。
#
# 台詞の決まり（10-24）：記録の言葉は出どころを語りで言ってから、語りの中で読む（『治家記録』の原文は語りで「今の言葉にすると」）。
#   想像の台詞は3か所（政宗想像・陽徳院想像。config の roles に足した）。気持ちの言葉だけ・新しい事実を足さない。
#
# 絵：paintings/ の絵（10-28 に Commons から落とした masamune_*）で仮置き。顔の場面・墓・発掘・木像を作る場面は「AI絵：」をコメントに
#   （一覧は dev/output/rekishi-chiso/research/masamune_ai_images.md の M01〜M15）。
# 広告の配慮：骨・遺体は「骨」「亡骸」まで。棺の中の様子・目の処置の様子は描かない。
