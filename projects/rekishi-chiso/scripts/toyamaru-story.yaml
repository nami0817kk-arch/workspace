# 日本語の概要欄の頭（describe が一番上に出す）
description_head: |-
  青函連絡船の洞爺丸は、1954年9月26日、函館で、出航を見合わせました。理由は、台風ではなく、停電でした。
  出航が決まったのは、17時40分ごろ。風が、いちど弱まった、そのころでした。洞爺丸は18時39分に出港し、乗っていた1,314人のうち、1,155人が亡くなりました。
  風が弱まったとき、船は、台風の目に入ったかのような様子だった、と記録にあります。ところが、あとの解析は、別の説明をしています。
  出航の判断、気象の情報、当時の記録の食い違いを、時刻の順にたどります。
  この動画でわかること
  ・出航が、風ではなく停電で延びた件（海難審判の裁決）
  ・17時ごろ風が弱まった現象を、記録はどう見たか、あとの解析はどう説明したか（気象研究所・運輸安全委員会）
  ・出港から22分で錨を入れ、4時間後にSOSが出るまでの時刻（裁決・国会会議録）
  ・裁決が、船長の職務上の過失のほかに、船の構造と運航管理も一因とした件
description_note: |-
  亡くなった方々と、ご遺族に、敬意を払って作っています。創作の台詞は入れていません。記録の言葉は、出どころを語りで示してから、今の言葉に直して読んでいます。
  高等海難審判庁の裁決は、和文の原本を開けなかったため、日本財団図書館の英訳（Judgements of Four Major Marine Accidents）と、海難審判所の裁決の要旨で読みました。国会会議録（昭和29年）は、国会会議録検索システムの全文を、要約の道具を通して読んでいます。引用の言葉は、原文で見直した所だけを、そのまま出しています。
  気象庁の事後の位置の記録や、村松照男さん（1983年）・佐々木さん（1954年）の論文は、整理された二次の紹介を通して読みました（原本は見ていません）。日数・時間の差・速さは、記録の数字から計算し直したものです。船長の氏名は、二次資料（公開の解説）によります。運輸安全委員会の資料が紹介する、気象庁の解析（寒冷前線）は、気象庁の原典の記録を確かめられていません。
  死者の数は、資料によって違います。この動画では、高等海難審判庁の裁決の数（死者・行方不明1,155人）を使っています。
  画面の情景・人物の画像は、画像生成AIで作った想像上のイメージで、記録映像・実在の人物の姿ではありません。サムネイルの船も、AIによる想像図です。

en:
  title: "The Toya Maru Disaster: Why Did It Sail When the Wind Dropped? The Four Hours, Per the Records"
  description: |-
    On September 26, 1954, the Aomori-Hakodate ferry Toya Maru could not leave Hakodate at its scheduled time of 2:40 p.m. The cause was not the typhoon. It was a power failure.
    Four hours after it finally sailed, the ship was lost. Of the 1,314 people aboard, 1,155 died or remain missing.
    Around 5:40 p.m., when the departure was decided, the wind had dropped for a while. People at the time took it to be the eye of the typhoon. Later research explains it differently.
    This video follows the decision to sail, the weather information and the conflicting records, hour by hour.
    In this video you will learn:
    - How the scheduled departure was delayed by a blackout, not by wind
    - How the lull at 5 p.m. was read then, and how later research explains it
    - The times between leaving port and the distress call, from the marine accident inquiry
    - Why the ruling blamed the ship's design and the operations management as well
    Recorded words are read with their sources. Scene images are AI-generated illustrations. Japanese-language history video (Japanese audio).
  chapters:
    - "The Departure That Never Left on Time: Hakodate, September 26, 1954"
    - "The Blackout and the Storm Warning: 2:40 p.m."
    - "The Wind Drops: 5:40 p.m."
    - "Leaving Port and Dropping Anchor: 6:39 p.m."
    - "The Last Hour: 9:25 p.m. to 10:45 p.m."
    - "Was It the Eye of the Typhoon?"
    - "Whose Decision Was It? The Ruling and the Records"
    - "After the Toya Maru"
    - "Summary: What the Records Can Tell Us"

