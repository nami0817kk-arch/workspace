sections:
  # ================================================================ 序章（冒頭 約2.5分）。答えはまとめまで言わない
  - title: 出航できなかった船　1954年9月26日 函館
    background: {image: paintings/toyamaru_S01.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-13
      - 語り: 青函連絡船、洞爺丸は、1954年9月26日、遭難しました。
        tone: 重い
        card: {head: "洞爺丸の遭難", body: "乗船1,314人　生存159人"}
      # fact: toyamaru-13
      - 語り: 乗っていた1,314人のうち、亡くなったのは、1,155人です。
      # fact: toyamaru-01
      - 語り: その日の昼、この船は、函館で、出航できませんでした。理由は、台風ではありません。停電でした。
      # fact: toyamaru-05
      - 語り: 出航が決まったのは、風がいちど弱まった、17時40分ごろ。出港は18時39分。助かったのは、159人でした。
      # fact: toyamaru-04
      - 語り: 風が弱まったとき、船は、台風の目に入ったかのような様子だった、と記録にあります。ところが、あとの解析は、別の説明をしています。
      - 語り: 風はなぜ弱まったのか。船はなぜ出たのか。記録は、時刻も、見立ても、食い違います。
        tone: 疑問
        pause: 0.8
      # fact: toyamaru-11
      - 語り: 手がかりは、海難審判の裁決と、国会での答弁と、気象の観測です。
      - 語り: まずは、停電のあった午後に、戻ります。
        hook: true

  # ================================================================ 第1章 停電と警報
  - title: 14時40分、出航できなかった理由　停電と暴風雨警報
    background: {image: paintings/toyamaru_S02.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-01
      - 語り: 洞爺丸は、青森と函館を結ぶ、国鉄の青函連絡船です。国鉄は、今のJRの前身です。この日は、日曜日。函館に11時5分に着き、14時40分に、青森へ向けて出航する態勢に入っていました。
        card: {head: "出航の態勢", body: 14時40分　青森行き}
      # fact: toyamaru-02
      - 語り: 午前11時。函館海洋気象台が、暴風雨警報を出しています。中央気象台の予報部長、肥沼寛一さんは、国会で、海上で25メートルから30メートルの風、という内容だった、と答えています。
      # fact: toyamaru-28
      - 語り: 肥沼さんは、国会で、予報では、台風は函館の付近を通って、釧路の沖へ抜ける見込みだった、と答えています。実際には、台風は日本海側を北上しました。
      # fact: toyamaru-01
      - 語り: ところが、15時ごろ、出航は延びます。理由は、風ではありません。停電で、船と桟橋をつなぐ可動橋を、外せなかったのです。
        card: {head: "出航の見合わせ", body: 15時ごろ　理由は停電}
      # fact: toyamaru-01
      - 語り: 裁決の要旨は、停電で出られないまま時間が過ぎ、船長は、出航の時機を失した、として、見合わせることにした、と書いています。
      # fact: toyamaru-03
      - 語り: そのころ、台風はどこにいたのか。国鉄の副総裁、天坊裕彦さんは、国会で、15時の台風は、青森の西、およそ100キロ、時速およそ110キロで進んでいた、と説明しています。
        figure: {type: table, title: 15時の台風　国会での説明, cols: [内容, 時点], rows: [[位置, 青森の西 約100km, 15時], [速さ, 時速 約110km, 15時], [放送, 15時現在の状況, 16時]], upto: 3}
      # fact: toyamaru-03
      - 語り: ただし、16時の放送は、15時現在の状況を伝えるものだった、と天坊さんは説明しています。
        figure: null
      # fact: toyamaru-04
      - 語り: 16時の函館桟橋の気圧は、985.2ミリバール。ミリバールは、今のヘクトパスカルと同じ大きさです。風は、東から、10メートルから15メートルでした。
        card: {head: "16時　函館桟橋", body: 985.2ミリバール　東風10〜15m}
      - 語り: 17時になると、状況が変わります。
        hook: true

  # ================================================================ 第2章 風が弱まった
  - title: 風が弱まった17時、出航を決めた17時40分
    background: {image: paintings/toyamaru_S04.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-04
      - 語り: 17時。函館桟橋の気圧は、982.6ミリバール。風が、急に弱まりました。青空が見え、台風の目のような状態になった、と、裁決の英訳は書いています。
        card: {head: "17時", body: 982.6ミリバール　風が急に弱まる}
      # fact: toyamaru-04
      - 語り: ただし、気象台の記録では、17時も、風は17メートルから18メートルありました。肥沼さんが、国会で示した数字です。観測した場所で、弱まり方は違いました。
      # fact: toyamaru-26
      - 語り: この風の弱まりは、津軽海峡のほぼ全域で起きた現象とみてよい、と、中央気象台の佐々木さんが、1954年に書いています。灯台の記録が根拠でした。
      # fact: toyamaru-05
      - 語り: 17時40分ごろ。船長の近藤平市さんは、出航の時刻を、18時30分と決めます。
        card: {head: "17時40分ごろ", body: 出航を18時30分と決める}
      # fact: toyamaru-05
      - 語り: このとき、函館にいた、ほかの船は、出航を待っていました。青函丸の6号と11号です。青森でも、渡島丸と羊蹄丸が、出航を見合わせていた、と裁決の英訳にあります。
      # fact: toyamaru-06
      - 語り: 出航が遅れるあいだに、輸送指令は、乗客をいったん降ろして、桟橋を空けるよう、指示しました。輸送指令とは、運航を指示する部署です。
      # fact: toyamaru-06
      - 語り: ところが、船長は、そのまま桟橋に着けていたい、と申し出ます。
        card: {head: "輸送指令の指示", body: 乗客を降ろし、桟橋を空ける}
      # fact: toyamaru-06
      - 語り: さらに、洞爺丸は、青函丸11号の車両と乗客も、受け入れました。裁決の英訳が、そう書いています。
      # fact: toyamaru-19
      - 語り: 船長は、なぜ、出ると決めたのか。船長は亡くなり、本人の言葉は残っていません。
        tone: 重い
      # fact: toyamaru-19
      - 語り: 国鉄の副総裁は、10月1日の国会で、20メートルから25メートル程度の風なら、出られると見たのではないか、と述べています。
      # fact: toyamaru-19
      - 語り: 10月12日には、冬場は15メートルから20メートルで出ることも再三あり、50メートル以上は考えていなかっただろう、と述べました。ただし、自信を持って言える段階ではない、とも。
      - 語り: どちらも、副総裁の推測です。船長の記録では、ありません。
      - 語り: そして、18時39分。洞爺丸は、桟橋を離れます。
        hook: true

  # ================================================================ 第3章 出港から投錨
  - title: 18時39分、出港から22分で錨を入れた　防波堤の沖
    background: {image: paintings/toyamaru_S07.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-07
      - 語り: 洞爺丸は、遅れ4便として、18時39分に出港しました。出航を決めてから、59分後です。
        card: {head: "出港", body: 18時39分　遅れ4便}
      # fact: toyamaru-07
      - 語り: 乗っていたのは、1,314人。列車の車両も、12両積んでいました。裁決の英訳では、重さにして、およそ313トンです。
      # fact: toyamaru-08
      - 語り: 18時55分ごろ、防波堤の西口を通過。船長は、危険だ、錨を入れる、と言った、と裁決の英訳にあります。
      # fact: toyamaru-21
      - 語り: ちょうど同じころ、函館の気象台で、この日の最低気圧、980.0ヘクトパスカルが記録されています。気象庁の事後の記録です。
        card: {head: "18時55分", body: 函館の最低気圧 980.0hPa}
      # fact: toyamaru-08
      - 語り: 19時1分。洞爺丸は、防波堤灯台の沖、およそ0.8海里で、錨を入れました。出港から、わずか22分です。
        card: {head: "19時1分", body: 錨を入れる　出港から22分}
      # fact: toyamaru-09
      - 語り: 19時30分ごろ、船尾の車両甲板に、海水が打ち込みました。20時ごろには、錨が効かず、船が流される、走錨が始まります。同じころ、機械室にも、浸水が始まりました。
      # fact: toyamaru-29
      - 語り: 運輸安全委員会の資料によれば、20時40分、洞爺丸の風速計は、突風57メートルを記録しました。裁決の英訳は、錨を入れた場所の波を、平均6メートルと書きます。
      # fact: toyamaru-29
      - 語り: 一方、函館の気象台の最大風速は、気象庁の記録で、25.8メートル。肥沼さんは、国会で、瞬間の風は、平均より5割ほど強いのが普通、と説明しています。
      # fact: toyamaru-09
      - 語り: 21時ごろ、船は、左に傾き始めました。
        tone: 重い
      - 語り: 一方、陸の上では、船の様子が、どう受け取られていたのか。
        hook: true

  # ================================================================ 第4章 最後の1時間
  - title: 21時25分、無線が伝えたこと　SOSまで
    background: {image: paintings/toyamaru_S10.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-10
      - 語り: 国鉄の無線の記録によれば、21時25分から26分ごろ、洞爺丸から、連絡が入ります。エンジン、ダイナモ、とまりつつあり。突風55メートル。
        card: {head: "21時25分ごろ", body: 機関が止まりつつある　突風55m}
      # fact: toyamaru-10
      - 語り: 裁決の英訳によれば、運航管理の側は、これを、重大な事故だとは受け取らず、上司に直ちには報告しませんでした。
      # fact: toyamaru-10
      - 語り: この連絡から、SOSまで、1時間14分です。
      # fact: toyamaru-11
      - 語り: 裁決の要旨によれば、21時50分ごろ、左舷の主機が止まります。22時5分、右舷の主機が止まりました。22時15分ごろ、乗客に、救命胴衣を着けるよう、指示が出ます。
      # fact: toyamaru-11
      - 語り: 22時26分ごろ、船は、浅瀬に乗り上げます。傾きは、左から右へ替わり、このとき、右に45度あまりでした。
        card: {head: "22時26分ごろ", body: 座礁　右に45度あまり傾く}
      # fact: toyamaru-11
      - 語り: 22時39分。海上保安庁の長官は、国会で、SOSを受けたのは、この時刻ごろだ、と答えています。出港から、ちょうど4時間。座礁から、13分後です。
        card: {head: "22時39分", body: SOS　出港からちょうど4時間}
      # fact: toyamaru-11
      - 語り: 22時45分ごろ、船は、右に大きく傾いて、転覆しました。座礁から19分、SOSから6分後です。
      # fact: toyamaru-12
      - 語り: 巡視船が、現場に着いたのは、翌0時30分。時刻は、海上保安庁の長官の答弁です。ほかの救助に出ていた巡視船が、引き返して着いた時刻でした。SOSから、1時間51分後です。
      # fact: toyamaru-11
      - 語り: 最後の時刻は、記録によって違います。座礁は、22時26分と、22時30分。機関の停止も、裁決と、国鉄の副総裁の説明で、数分から十数分ずれます。
        figure: {type: table, title: 最後の時刻　記録の食い違い, cols: [書いた時刻, 書いた人], rows: [[座礁, 22時26分, 裁決の英訳], [座礁, 22時30分, 国鉄調査団の無線記録（国会）], [発電機・主機の停止, 21時50分・22時5分, 裁決の英訳], [発電機・主機の停止, 21時36分・22時8分, 国鉄副総裁（国会）], [SOS, 22時39分, 海上保安庁長官（国会）], [SOS, 22時40分, 参議院の派遣議員の報告]], upto: 6}
      - 語り: 風は、なぜ弱まったのか。記録の中には、いくつかの説明が並びます。
        figure: null
        hook: true

  # ================================================================ 第5章 風はなぜ弱まったのか
  - title: 風はなぜ弱まったのか　台風の目だったのか
    background: {image: paintings/toyamaru_S14.jpg, credit: "AI生成の想像画"}
    year: 1954
    lines:
      # fact: toyamaru-22
      - 語り: 17時に風が弱まったとき、台風の中心に入ったかのような様子だった、と記録にあります。台風の目とは、台風の中心の、風が弱い所です。見方は、4つ並びます。
      # fact: toyamaru-23
      - 語り: 1つめは、高等海難審判庁の、1959年の裁決です。気圧は下がったまま停滞して、台風が通過し去ったとは認められない荒天下に出航した、と判断しました。
        card: {head: "高等海難審判庁（1959年）", body: 台風が通過し去ったとは認められない}
      # fact: toyamaru-22
      - 語り: 国鉄の函館桟橋の気圧は、17時、18時、19時と、3時間続けて、982.6ミリバール。同じ値でした。
      # fact: toyamaru-21
      - 語り: 気象庁の記録と比べます。台風の中心は、15時に960ヘクトパスカル、21時に956。函館の最低は、18時55分の980.0で、20ヘクトパスカルほど高いのです。
        figure: {type: table, title: 気圧の比べ　気象庁の記録, cols: [気圧, 時刻], rows: [[函館 最低, 980.0hPa, 18時55分], [台風の中心, 960hPa, 15時], [台風の中心, 956hPa, 21時]], upto: 3}
      # fact: toyamaru-26
      - 語り: 2つめは、事故のあとの、中央気象台の佐々木さんです。風の弱まりが、台風の目に付いて起きた現象でないなら、今後の研究が必要だ、と書きました。
        figure: null
        card: {head: "佐々木（1954年）", body: 台風眼でないなら今後の研究が必要}
      # fact: toyamaru-24
      - 語り: 3つめは、事故から29年後の、1983年。気象研究所の村松照男さんは、台風は、26日の15時から18時に、温帯低気圧になっていた、と考えました。
        card: {head: "村松照男（1983年）", body: 15〜18時に温帯低気圧になっていた}
      # fact: toyamaru-24
      - 語り: 洞爺丸は、再び発達する低気圧の、南側の、30メートルを超える南西風の中で、遭難した。当時は観測が乏しく、動きから導いた説明です。
      # fact: toyamaru-27
      - 語り: 台風の動きにも、手がかりがあります。気象庁の記録から計算すると、26日15時から21時は、平均で時速およそ37キロ。日本海を進んだ、およそ100キロの、3分の1ほどでした。
      # fact: toyamaru-25
      - 語り: 4つめは、気象庁の解析です。運輸安全委員会の資料が、こう紹介しています。風の弱まりは、冷たい空気が流れ込み、もとの風と弱め合ったためで、台風の中心が函館を通ったのではない、と。
        figure: {type: table, title: 風の弱まりの説明, cols: [誰が, 説明], rows: [[1954年 当日, 記録, 台風の目に入ったかのよう], [1959年, 高等海難審判庁, 台風が通過し去ったとは認められない], [1983年, 気象研究所 村松, 温帯低気圧になっていた], [年は不明, 気象庁（運輸安全委員会の資料が紹介）, 寒冷前線の寒気流]], upto: 4}
      - 語り: 説明は、ひとつではありません。では、気象の知らせは、船に、どう届いていたのか。
        figure: null
        hook: true

  # ================================================================ 第6章 誰の判断か
  - title: 誰の判断だったのか　気象台・国鉄・裁決
    background: {image: paintings/toyamaru_S09.jpg, credit: "AI生成の想像画"}
    year: 1955
    lines:
      # fact: toyamaru-20
      - 語り: 国会では、気象台の情報の出し方も、問われました。16時に出した情報と同じ内容が、18時55分にも放送された、という指摘です。
        card: {head: "放送", body: 18時55分　16時と同じ内容}
      # fact: toyamaru-20
      - 語り: 肥沼さんの説明では、放送局が気象台と連絡が取れず、前の内容を流したためです。15時以降の情報で、風が弱まる点を、もっと親切に流すべきだった、とも認めています。
      # fact: toyamaru-20
      - 語り: 気象台と鉄道管理局のあいだに、専用の電話は、ありませんでした。国鉄の天坊さんが、そう答えています。気象台の公衆電話は、3本だけだった、と肥沼さんは述べています。
      # fact: toyamaru-19
      - 語り: 国鉄の側は、どうか。荒木善之さんは、風が北西に変わる、という放送が盛んだったので、船長は、波を軽く見たのだろう、と推測しています。実際は、南西の風が続きました。
      - 語り: 船長が何を考えたのかは、すべて、後から出た推測です。船長本人の記録では、ありません。
        tone: 重い
      # fact: toyamaru-17
      - 語り: では、裁決は、何と言ったのか。警報が出て、青森と函館の車を積む船が、定時の出航を見合わせていた。
      # fact: toyamaru-17
      - 語り: それなのに、青函局長、海務部長、海務課長は、部下を非常勤務につかせず、自分で出勤して指揮することも、ありませんでした。
        card: {head: "裁決（運航管理）", body: 非常勤務につかせず、自ら指揮もしなかった}
      # fact: toyamaru-16
      - 語り: 管理する側は、安全な運航は、すべて船長に任せればよい、として、介入しなかった。裁決は、そう認定しています。
      # fact: toyamaru-16
      - 語り: 結論は、こうです。遭難は、船長の、運航上の職務の過失から起きた。さらに、船の構造と、運航の管理が、適当でなかったことも、一因だ、と。
        card: {head: "裁決の結論（1959年）", body: 船長の職務上の過失　船の構造と運航管理も一因}
      # fact: toyamaru-16
      - 語り: 船の構造とは、船尾の大きな開口と、低い縁、閉めにくい車両甲板です。海水が入った道すじでした。
      # fact: toyamaru-18
      - 語り: 一審の裁決は、1955年9月22日。二審の裁決は、1959年2月9日で、事故から4年4か月あまりです。
      # fact: toyamaru-18
      - 語り: 国鉄が、裁決の取り消しを求めて裁判を起こしましたが、最高裁が上告を退け、1961年4月20日に、確定しました。
        card: {head: "裁決の確定", body: 1961年4月20日　最高裁が上告を棄却}
      - 語り: 事故のあと、船と運航は、どう変わったのか。
        hook: true

  # ================================================================ 第7章 その後
  - title: 洞爺丸のあと　5隻の船と、変わった運航
    background: {image: paintings/toyamaru_S13.jpg, credit: "AI生成の想像画"}
    year: 1955
    lines:
      # fact: toyamaru-15
      - 語り: この夜、遭難したのは、洞爺丸だけではありません。北見丸、日高丸、十勝丸、第十一青函丸も、この夜のうちに、遭難しました。
      # fact: toyamaru-15
      - 語り: ほかの4隻の乗組員の死者は、北見丸が70人、日高丸が56人、十勝丸が59人、第十一青函丸が90人。合わせて275人です。洞爺丸の1,155人を足して、5隻で、1,430人になります。
        card: {head: "5隻の死者", body: "1,430人"}
      # fact: toyamaru-14
      - 語り: 数字は、資料によって違います。気象庁は、乗員乗客1,139人が亡くなった、と書いています。事故の2日後、国会で国鉄の総裁が示した、乗船の途中の数字は、旅客1,142人でした。
        figure: {type: table, title: 死者の数　資料の違い, cols: [死者, 注], rows: [[高等海難審判庁, "1,155人", 裁決の数], [気象庁, "1,139人", 災害事例の数]], upto: 2}
      # fact: toyamaru-14
      - 語り: 違いの理由は、はっきりしません。この動画では、裁決の数を使います。
        figure: null
      # fact: toyamaru-30
      - 語り: 事故のあと、船は変わりました。運輸安全委員会の資料は、車両甲板の船尾の開口の、防水装置の改善などを挙げています。
      # fact: toyamaru-30
      - 語り: 荒れた日の退避先が、函館から青森に変わった、出航は、船長と指令の合議で決めるようになった、とも伝えられています。
        card: {head: "事故のあとの変更", body: 防水装置の改善　合議制　退避先は青森}
      # fact: toyamaru-31
      - 語り: 青函トンネルは、洞爺丸のあとに始まった、と言われることがあります。JR北海道の年表は、地質の調査の開始を1946年4月、洞爺丸の事故を1954年9月、と並べて載せています。
      # fact: toyamaru-31
      - 語り: 調査は、事故の8年前から、始まっていました。事故をきっかけに、構想が具体的になった、とも言われます。
      # fact: toyamaru-32
      - 語り: 北斗市の七重浜には、翌年、台風海難者の慰霊の碑が建てられました。2024年9月26日にも、70年の法要が営まれました。
        card: {head: "慰霊", body: 北斗市七重浜　2024年に70年の法要}
      - 語り: ここまで並べた記録から、言えることと、言えないことを、分けます。
        hook: true
        tone: 疑問

  # ================================================================ まとめ
  - title: まとめ：洞爺丸の最期、記録から言えること
    background: {image: paintings/toyamaru_S01.jpg, credit: "AI生成の想像画"}
    lines:
      # fact: toyamaru-13
      - 語り: 洞爺丸は、1954年9月26日、台風の夜に、遭難しました。
      - 語り: 乗船1,314人。亡くなったのは、1,155人です。
        tone: しみじみ
      # fact: toyamaru-01
      - 語り: 出航は、風ではなく停電で、延びました。出港は18時39分、投錨は19時1分、SOSは22時39分ごろです。
      # fact: toyamaru-23
      - 語り: 17時ごろの風の弱まりは、台風の目に入ったかのように見えました。裁決は、台風が通過し去ったとは認められない、と判断し、あとの解析は、温帯低気圧や寒冷前線で説明しています。
      # fact: toyamaru-16
      - 語り: 記録から言えるのは、ほかの船が出航を待つなか、洞爺丸は出たこと。そして、運航の管理の側が、止める指揮を取らなかったと、裁決が認定したことです。
      - 語り: 言えないことも、あります。船長が、何を根拠に出航を決めたのか。風の弱まりを、船の上で、どう見ていたのか。本人の記録は、ありません。
        tone: しみじみ
      # fact: toyamaru-20
      - 語り: 気象の知らせの、何が、どう、出航を決める場に伝わったのかは、今も、記録の中で、揺れています。
      - 語り: 出航を決めた17時40分から、沈むまでの、およそ5時間。
        pause: 0.8
      - 語り: 亡くなった方々を悼みながら、記録を、たどりました。
        tone: しみじみ
        pause: 0.8
      # 締め（物語型、10-24 ユーザー決定）：余韻の一文のあと、登録のお願いを短く
      - 語り: あなたは、どんな情報が、出航を決める場に届いていれば、違ったと思いますか。コメントで聞かせてください。チャンネル登録も、よろしくお願いします。
