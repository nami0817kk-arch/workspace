# 物語型の本編（10-22 の見直し・scripts/_template_story.yaml）。洞爺丸の最期（1954年9月26日）。2026-11-14 作成。公開の予定は 11/18 19:00（日本史枠）。
# 型：docs/story-main.md「00. 伸びる型」の D 最期。語りは剣崎1人。想像の台詞は入れない（imagined なし）。創作の台詞・遺体や惨状の描写は入れない。
# 1本に1つの問い＝「出航を決めた17時40分ごろ、風はなぜ弱まったのか。船はなぜ出たのか。記録はなぜ食い違うのか」。題名は問いの形で、答え（台風の目ではなかったという研究）は伏せる。
#   冒頭（10秒以内）＝定刻14時40分に船は出られなかった。理由は台風ではなく停電（toyamaru-01）。
#   続く意外な一点＝出港から投錨まで22分（-08）・4時間後にSOS（-11）・風が弱まったのは台風の目ではなかったという研究（-24,-25,-26）・裁決は船長だけでなく運航管理も一因とした（-16,-17）。
# 記録の食い違い（本編に表で並べるもの3つ）：
#   ①死者・乗船者の数（裁決1,155人／1,153／1,139／国会の途中経過 旅客1,142）
#   ②風の弱まりの説明（当時＝台風の目／裁決＝台風は通過していない／気象研究所1983＝温帯低気圧化／運輸安全委員会が紹介する気象庁解析＝寒冷前線）
#   ③座礁・SOS・機関停止の時刻（22:26/22:30、22:39/22:40/22:41、21:50・22:05/21:36・22:08）
# 計算（自分で計算し直した）：定刻14:40→出港18:39＝3時間59分／17:40→18:39＝59分／出港→投錨19:01＝22分／出港18:39→SOS22:39＝ちょうど4時間／座礁22:26→SOS22:39＝13分／座礁→転覆22:45＝19分／
#   21:25の無線→SOS22:39＝1時間14分／SOS→救助船到着0:30＝1時間51分／座礁→0:30＝2時間4分／1,314−1,155＝159／旅客1,041＋乗組員73＋その他41＝1,155／他の4隻の乗組員の死者70＋56＋59＋90＝275、1,155＋275＝1,430／
#   台風の移動 15→21時＝約37km/h（気象庁の事後位置の記録から。26日3→15時は約100km/h）／函館最低気圧980.0hPa（18:55）と事後位置の記録の中心気圧15時960hPa＝約20hPaの差／1954→1983＝29年／事故1954-09-26→二審1959-02-09＝4年4か月余／→最高裁1961-04-20＝6年7か月余。
# 事実は事実カード（dev/output/rekishi-chiso/research/洞爺丸_facts_20261114_hand.yaml、toyamaru-01〜）にあるものだけ。行の上に `# fact: toyamaru-NN`。
#   使わないこと：船長の内心の断定（船長は亡くなり、本人の記録は無い）／出航を強要したという噂の断定／『19時に台風が過ぎたと判断』（Wikipedia のみ）／羊蹄丸の「台風の目と見て延期」（Wikipedia のみ）／宣教師の手品／遺体の収容・火葬の細部／国鉄職員の名前。
#   「とされる」「と伝わる」は、伝え・紹介の事実にだけ使う（1本10回まで）。
# 広告の配慮：死は「亡くなった」。遭難の場面は時刻と記録の言葉で淡々と。
