# 用語の札（10-04「難しい言葉に小さな解説の札」）。台本に初めて出た行から3行のあいだ、画面の右上に出る。
# 説明は40字まで。事実だけを書く。その回だけの言葉は台本の terms: に書く（こちらより優先）。
外交革命: 1756年、長く敵どうしだったオーストリアとフランスが結んだ同盟
三部会: 聖職者・貴族・平民の代表が集まる議会。1614年を最後に開かれていなかった
王太子: 王の位を継ぐ予定の王子。フランスでは「ドーファン」と呼ぶ
神聖ローマ皇帝: いまのドイツ・オーストリアあたりの国々を束ねた皇帝
枢機卿: ローマ教皇の次に位の高い、カトリックの聖職者
革命裁判所: 革命政府が「革命の敵」を裁くために、1793年に置いた裁判所
コンシェルジュリー: パリのシテ島にあった牢獄。「断頭台の控えの間」と呼ばれた
ヴァレンヌ: 逃げる途中の国王一家が見つかり、捕まったフランス東部の町
プチ・トリアノン: ヴェルサイユの庭の中にある小さな館。王妃が自分の場所にした
テュイルリー: パリの宮殿。ヴェルサイユを出された国王一家が住まわされた
バスティーユ: パリの要塞で、牢獄としても使われた。1789年7月14日に民衆が襲った
リーヴル: 当時のフランスのお金の単位
断頭台: フランス革命で使われた処刑の台。ギロチン
聖職者: 教会に仕える人。当時は税をほとんど納めなくてよい特権があった
天然痘: 高い熱と体じゅうのできものが出る感染症。当時は多くの命を奪った
王政: 王が国を治めるしくみ
