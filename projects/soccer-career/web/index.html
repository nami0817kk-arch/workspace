<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    サブディレクトリ配信のための基準パス。flutter build web が置き換える。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="1人の選手を作って、引退までのキャリアを進めるサッカーゲーム。1シーズン38試合すべてを、試合中の判断で戦い抜く。">

  <!-- 共有したときに出るもの。無いとURLだけが貼られる。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="選手キャリア">
  <meta property="og:title" content="選手キャリア">
  <meta property="og:description" content="1人の選手を作って、引退までのキャリアを進めるサッカーゲーム。1シーズン38試合すべてを、試合中の判断で戦い抜く。">
  <meta property="og:url" content="https://soccer-career-49p.pages.dev/">
  <meta property="og:image" content="https://soccer-career-49p.pages.dev/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="選手キャリア">
  <meta name="twitter:description" content="1人の選手を作って、引退までのキャリアを進めるサッカーゲーム。">
  <meta name="twitter:image" content="https://soccer-career-49p.pages.dev/icons/Icon-512.png">

  <meta name="theme-color" content="#1B5E3F">

  <!-- iOS のホーム画面 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="選手キャリア">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>選手キャリア</title>
  <link rel="manifest" href="manifest.json">

  <!--
    起動を待つ間の画面。
    Flutter は本体とフォントを読み終えるまで何も描かないので、
    これが無いと数秒間まっ白なページを見せることになる。
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1B5E3F; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #1B5E3F;
      color: #F5F6F3;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot img { width: 88px; height: 88px; }
    #boot p { margin: 0; font-size: 14px; letter-spacing: .08em; }
    #boot .bar {
      width: 148px;
      height: 3px;
      border-radius: 2px;
      background: rgba(245, 246, 243, .25);
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #F5F6F3;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar span { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <p>選手キャリア</p>
    <div class="bar"><span></span></div>
  </div>

  <script>
    // 最初の1フレームが描かれたら待ち画面を消す。
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
