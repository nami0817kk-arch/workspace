# 2本目。個人情報の流出（2026-10-10 に原典を当たって作った）
# 材料と出典の一覧は research/kojin/sources.md（守る線も同ファイル冒頭）
# 守る線: 会社を悪者にしない／侵入経路を推測で結び付けない／1億円は漏えいへの罰金ではない／件数は公式の書き方のまま

title: なぜ今、企業の個人情報の流出が相次ぐのか
question: 今週だけで1000万件規模の流出が続いた。なぜ今なのか
date: 2026-10-10
sources:
  - 個人情報保護委員会『年次報告』令和3年度〜令和7年度
  - e-Gov 法令検索「個人情報の保護に関する法律」
  - 個人情報保護委員会「令和2年改正個人情報保護法の概要」
  - 警察庁「令和７年におけるサイバー空間をめぐる脅威の情勢等について」
  - 警察庁「令和８年上半期におけるサイバー空間をめぐる脅威の情勢等について」
  - IPA「情報セキュリティ10大脅威 2026」・解説書
  - IPA「2024年度 中小企業における情報セキュリティ対策に関する実態調査」
  - 経済産業省・IPA「サイバーセキュリティ経営ガイドライン Ver3.0」
  - 経済産業省「サプライチェーン強化に向けたセキュリティ対策評価制度」
  - 各社の公式発表（物語コーポレーション・アドベンチャー・ブックオフグループHD・JR東日本・ビューカード・IDCフロンティア・スカラコミュニケーションズ・損害保険ジャパン・大和証券）
  - ベネッセコーポレーション「お客様へのお詫びと対応」
  - 最高裁判所 平成29年10月23日判決／大阪高等裁判所 令和元年11月20日判決／東京地方裁判所 令和5年2月27日判決
  - EU 一般データ保護規則（GDPR）第33条・第83条
  - 英国 ICO「British Airways」「Marriott International」制裁金通知

