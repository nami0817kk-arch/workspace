        sub: 登録1080万8784件のうち、1078万8963件が漏えい（こちらで割った値）
        note: 物語コーポレーション（2026年10月5日）
      - kind: hero
        from: 国に届いた漏えいの報告は
        title: 国に届いた漏えいの報告
        value: 4年で約3倍
        sub: 2021年度 5846件 → 2025年度 1万7139件
        note: 個人情報保護委員会『年次報告』（年度）
    lines:
      - 語り: 2026年10月の第1週。個人情報の流出の発表が、次々に出ました。
      - 語り: 焼肉きんぐのアプリでは、登録1080万件のうち、1078万件あまりが漏れました。
      - 聞き(強): ほぼ全部じゃないですか。
      - 語り: 割ると99.8%です。こちらで割った数字です。
      - 語り: 旅行予約のスカイチケットは約1464万件。ブックオフは最大約643万件。
      - 語り: ブックオフの数は会員番号の数で、人の数ではありません。
      - 語り: JR東日本とビューカードも、3つの会員の情報が漏れた可能性があると発表しました。
      - 聞き: JRまで……。全部、同じ犯人なんですか。
      - 語り: 分かっていません。各社とも、入られた経路は調査中としています。
        face: 真剣
      - 語り: なので今日は、どの会社が悪いかではなく、流出が続く仕組みを見ます。
      - 聞き: でも正直、ニュースで見ても「またか」って思っちゃいます。
      - 語り: その「またか」に、数字で答えます。
      - 語り: 国に届いた漏えいの報告は、4年でおよそ3倍になりました。
      - 聞き(強): 3倍。

