          - { label: 2位, values: ["サプライチェーンや委託先を狙った攻撃", "8年連続"] }
          - { label: 3位, values: ["AIの利用をめぐるサイバーリスク", "初めて"] }
        note: IPA「情報セキュリティ10大脅威 2026」組織編
