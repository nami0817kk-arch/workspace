        note: 個人情報保護委員会『令和7年度 年次報告』p.9
      - kind: hero
        from: 1つのランサムウェアの事件だけで
        title: 2024年度、1つの事件から
        value: 2745件
        sub: ランサムウェアの事件1件から出た報告の数
        note: 個人情報保護委員会『令和6年度 年次報告』p.9
        point: 件数では4%でも、1件の大きさが違う
    lines:
      - 語り: 個人情報保護委員会という国の役所が、毎年、報告の件数を出しています。
      - 語り: 2021年度は5846件。
      - 語り: 2022年度は7685件。2023年度は1万2120件。
      - 語り: 2024年度は1万9056件。2025年度は1万7139件です。
      - 聞き: やっぱり増えてる……。
      - 語り: ただ、2022年の4月に決まりが変わっています。
      - 語り: 漏えいが起きたら、国に報告することが、法律で義務になりました。
      - 聞き: それまでは、報告しなくてもよかったんですか。
      - 語り: 義務ではありませんでした。委員会自身も、増えた理由をこう書いています。
      - 語り: 報告が義務化されたこと、及びその周知が進んだこと等によるものと考えられる。
      - 聞き: じゃあ、ふたつ目が答え……？
      - 語り: それだけではありません。中身を見ます。
      - 語り: 2025年度、委員会に直接届いた報告で、いちばん多い原因は誤交付です。45.5%。
      - 聞き: 誤交付？
      - 語り: 渡す相手を間違えることです。次が誤送付、送る先の間違いで21.6%。
      - 語り: 不正アクセスは、4.0%です。
      - 聞き(強): 4%しかないんですか。ニュースは不正アクセスばっかりなのに。
      - 語り: そして、漏れた人数が1000人以下の報告が、93.6%です。
      - 聞き: ほとんどは、小さなうっかり……。
      - 語り: 件数の山は、小さなミスでできています。
      - 聞き: じゃあ、今週のニュースは何なんですか。1000万件ですよ。
      - 語り: そこです。件数では4%でも、1件の大きさが違います。
      - 語り: 2024年度は、1つのランサムウェアの事件から、2745件の報告が出ています。
      - 聞き(強): 1つの事件で、2745件。
      - 語り: なぜ1つの事件から、何千件も出るのか。今週の件にも、同じ形があります。

