    lines:
      - 語り: 警察庁が、ランサムウェアの被害に遭った組織に、どこから入られたかを聞いています。
      - 語り: 小倉さん、いちばん多い入口は何だと思いますか。
      - 聞き: えっと……怪しいメールを開いちゃった、とかですか。
      - 語り: 2025年、答えた92件のうち、メールから入られたのは2件です。
      - 聞き(強): 2件！
      - 語り: いちばん多いのはVPN機器で61件。次がリモートデスクトップで19件です。
      - 聞き: VPN……。在宅勤務で、会社につなぐやつですか。
      - 語り: そうです。社外から会社のネットワークに入るための、玄関のような機器です。
      - 語り: 個人情報保護委員会は、原因のひとつをこう書いています。
      - 語り: 機器の弱点が公開され、直し方も出ていたのに、事業者が放置していた。
      - 聞き: 直し方が出てたのに……。
      - 語り: 鍵の壊れ方が知られていて、新しい鍵も配られていた。でも、替えていなかった。
      - 聞き: それなら、攻撃する側は、替えていない所を探すだけでいい。
      - 語り: 被害の数も増えています。2026年の上半期は123件。
      - 語り: 統計を取り始めてから、半期で最多です。
      - 語り: 被害の約6割は中小企業です。
      - 聞き: 大きい会社じゃないんですね。
      - 語り: 警察庁は、攻撃する側の変化も書いています。
      - 語り: 高度な技術が無くても、ランサムウェアの攻撃ができるようになっている。
      - 語り: 攻撃者の裾野が広がっている、と。
      - 聞き: 誰でもできちゃう……。
      - 語り: 入られたあとも重い。調査と復旧に、1000万円以上かかった組織が6割です。
      - 語り: 1億円以上かかった所も、4件ありました。
      - 聞き: バックアップを取っておけば、大丈夫なんじゃないですか。
      - 語り: 取っていて、戻せたかを答えた40件のうち、元に戻せたのは11件です。
      - 聞き(強): 11件だけ？
      - 語り: バックアップも一緒に暗号化される場合が多い、と警察庁は書いています。
