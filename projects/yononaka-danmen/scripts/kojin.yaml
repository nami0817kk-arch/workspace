          - { label: 誤送付（送る先の間違い）, value: 21.6, note: 21.6% }
          - { label: 不正アクセス, value: 4.0, note: 4.0% }
        note: 個人情報保護委員会『令和7年度 年次報告』付表2(2)⑤
