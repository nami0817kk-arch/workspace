    lines:
      - 語り: 今週の発表を、線でつないでみます。
      - 語り: JR東日本とビューカードの発表には、こう書いてあります。
      - 語り: IDCフロンティア社で発生した不正アクセスに伴い。
      - 聞き: IDCフロンティア？
      - 語り: ソフトバンクの子会社で、会社や自治体にサーバーを貸しています。
      - 語り: 10月7日の未明に、ランサムウェアの攻撃を受けました。
      - 語り: 契約していたのは、495の企業や自治体です。
      - 聞き(強): 495！
      - 語り: 損保ジャパンと大和証券も、同じ形です。
      - 語り: 問い合わせの管理を頼んでいた会社で、不正アクセスがありました。
      - 語り: スカラコミュニケーションズという会社です。影響が出たのは最大5社。
      - 聞き: じゃあ、JRも大和証券も、自分のところは破られてないんですか。
      - 語り: 各社の発表では、不正アクセスがあったのは、仕事を頼んでいた先です。
      - 聞き: 頼んでいた先から、漏れる。
      - 語り: 国の数字でも、この形が見えます。
      - 語り: 2024年度、不正アクセスが原因の報告のうち、報告した会社自身で起きたのは431件。
      - 語り: 委託先で起きたのは1429件。3倍です。
      - 聞き(強): 自分のところより、頼んだ先の方が多い。
      - 語り: IPAが中小企業に聞いた調査では、不正アクセスを受けた会社の19.8%が、
      - 語り: 取引先やグループ会社を経由して、入られていました。
      - 聞き: 5社に1社……。
      - 語り: IPAが毎年出している、組織への脅威の順位があります。
      - 語り: 2026年の1位はランサムウェア。2位は、サプライチェーンや委託先を狙った攻撃です。
      - 聞き: サプライチェーン？
      - 語り: 仕事を頼んだり、頼まれたりする、会社のつながりです。この2位は8年連続です。
      - 語り: 解説には、守りの固い組織を直接ではなく、つながりの中の弱い所を狙う、とあります。
      - 聞き: 大きい会社は守りが固いから、頼まれている側から入る。
      - 語り: そういう狙われ方です。では、その弱い所は、どこから入られているのか。

