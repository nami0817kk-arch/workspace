    lines:
      - 語り: 2026年10月10日。将棋の女流タイトル、白玲戦の第5局がありました。
      - 語り: 西山朋佳さんが勝って、4勝1敗で白玲を防衛。白玲は通算5期目です。
      - 語り: 日本将棋連盟は、これで西山さんが、棋士になることができる権利も獲得した、と発表しました。
      - 聞き: え、西山さんって、もうプロの棋士じゃないんですか。
      - 語り: 西山さんは、女流棋士です。棋士とは、別の制度です。
      - 聞き(強): 別なんですか。
      - 語り: 連盟は、女性の棋士は歴史上まだ一人もいない、と書いています。
      - 語り: 女流棋士の制度ができたのは1974年。そこから52年です。
      - 聞き: 52年、ゼロ……。
      - 語り: 権利を使うかについて、西山さんは会見で、
      - 語り: いろんな方の意見をうかがっていけたら、と答えています。まだ決めていません。
        face: 真剣
      - 語り: なので今日は、西山さんがどうするかではなく、制度を見ます。
      - 聞き: でも正直、女流棋士と棋士の違いが、まず分からないです。

