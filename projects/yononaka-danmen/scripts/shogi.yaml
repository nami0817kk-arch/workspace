    lines:
      - 語り: 連盟のよくある質問に、こう書いてあります。
      - 語り: いわゆる男性棋士と女流棋士は、違う制度で対局しています。
      - 語り: 区別の意味もあり、女流がつきます。
      - 聞き: 男性棋士、って言い方なんですね。
      - 語り: ただ、続きがあります。女性でも、奨励会を卒業して四段になれば、
      - 語り: 男性棋士と全く同じ条件で対局し、肩書きも棋士になる、と。
      - 聞き(強): じゃあ、女性もなれるんですか。
      - 語り: なれます。棋士になる道に、性別の条件はありません。
      - 聞き: え、じゃあ答えはみっつ目……。私、ひとつ目って言いました。
      - 語り: 女流棋士は、別の入口です。研修会に入って、規定の成績を挙げると女流2級になります。
      - 語り: 研修会に入れるのは、25歳以下の女性です。
      - 聞き: こっちは女性だけ。
      - 語り: 出る棋戦も違います。女流棋士は女流の公式戦に出て、女流のタイトルは8つあります。
      - 語り: 人数は、連盟の一覧で、現役の棋士が174人。
      - 語り: 現役の女流棋士が73人です。こちらで数えた数です。
      - 聞き: 2つの世界が、並んで動いてるんですね。
      - 語り: では、性別の条件が無いのに、なぜ52年、
      - 語り: 女性の棋士が出なかったのか。棋士になる道を見ます。

