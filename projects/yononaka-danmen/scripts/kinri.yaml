      - 語り: 差は、毎月4万3千円あまりです。
      - 聞き: 7万円よりは少ないけど……それでも毎月4万円。
      - 語り: 35年で同じ金利のまま返すとして、こちらで計算した値です。
      - 語り: 固定金利は、借りたときの金利でずっと返します。
      - 語り: 今借りている人の返済が、急に変わるわけではありません。
