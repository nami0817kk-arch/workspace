      - 聞き(強): 4人に3人が変動。
      - 語り: 金利が上がったら返済がどう増えるかを、少し不安、よく理解していない、全く理解していない、と答えた人が、合わせて52.0%でした。
      - 聞き: 半分以上……。私も分かってないです。
      - 語り: どちらが得かは、ここでは言いません。
      - 語り: 言えるのは、線が2本あって、変動は短期の線につながっている、ということです。
        face: 真剣
      - 聞き: 金利が上がって重くなるのは、家計だけじゃないんですか。
      - 語り: もうひとつ、大きな借り手がいます。国です。

