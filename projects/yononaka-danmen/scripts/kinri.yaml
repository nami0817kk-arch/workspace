# 5本目。長期金利3.1%（2026-10-11 に原典を当たって作った）
# 材料と出典の一覧は research/kinri/sources.md（守る線も同ファイル冒頭）
# 守る線: 投資・借入の助言をしない／見通しを言わない／財務省の値と新発10年債は算出が違う／フラット35の過去は読み取り値

title: 長期金利3.1%、約30年ぶり。上がると暮らしの何が変わるのか
question: 長期金利が30年ぶりの高さになった。暮らしのどこに、どう効いてくるのか
date: 2026-10-11
sources:
  - 財務省「国債金利情報」（jgbcm.csv・jgbcm_all.csv）
  - 財務省「令和８年度予算のポイント」「我が国の財政事情」「令和８年度予算の後年度歳出・歳入への影響試算」
  - 日本銀行「金融市場調節方針の変更について」（2026年9月18日）ほか各回の公表文
  - 日本銀行「長期国債の買入れ計画について」（2026年6月16日）
  - 日本銀行「基準割引率および基準貸付利率の推移」
  - 住宅金融支援機構「フラット35 借入金利の推移」「住宅ローン利用者の実態調査」（2026年1月調査）
  - 三菱ＵＦＪ銀行・三井住友銀行「住宅ローン金利」「預金金利」（2026年10月）
  - 米国財務省「Daily Treasury Par Yield Curve Rates」
  - イングランド銀行 統計データベース（IUDMNPY）
  - ドイツ連邦銀行 時系列データ（BBSIS）

