# 試作30秒。節02「一の断面」の冒頭だけ。
# `screen:` の行で画面を切り替え、`cast:` の行で立ち絵を出す。
# `cast: auto` と書くと、そのあとずっと、しゃべっている人の立ち絵が出る。
title: ガソリンはなぜ高いのか（試作30秒）
sections:
  - id: "02"
    name: 一の断面
    lines:
      - cast: auto right 470
      - screen: s05
      - 語り: レギュラーガソリン、1リットル175円。
      - screen: s06
      - 語り: このうち、ガソリンそのものの値段は92円です。
      - 聞き(強): え、半分くらいしかないんですか。
      - screen: s08
      - 語り: 残りは、税金です。ガソリン税が、本則で28.7円。
      - screen: s09
      - 語り(強): そこに、上乗せ分が25.1円。
      - screen: s13
      - 語り(抑): この上乗せは、1974年に、2年だけという約束で始まりました。
      - 聞き: 2年だけ、ですか。
      - screen: s14
      - 聞き(強): え、半分近くが税金なんですか。
      - screen: s13
      - 語り(強): いまも、続いています。
