  # 2026-10-10 ユーザー「サムネはもっとカルテルとは？を強くする」→ 言葉を主役にする構図
  layout: term
  photo: businessmen            # スーツの2人。道路の写真だと「道路の話」に見える
  main: カルテルとは？
  lead: 同じカルテルをした9社のうち
  tail: 1社だけ0円
  tail2: ほかは最大127億円
  bubble: そもそも何？

# 冒頭の10秒。**ここで離脱が決まる**（CLAUDE.md）。数字を先に出し、そこから問いを立てる
# 2026-10-10 流れから組み直した（ユーザー「最初に報道」）。冒頭の数字の掴みはやめ、報道から入る
shorts:                       # 本編の行に short: sN を付けた行を集める（各60秒以内）
  s1:
    title: 同じ罪で／0円と127億円
    hook: 同じカルテルをした9社。／なぜ1社だけ0円だったのか？
    tease: その1社は、／何をしたから0円になったのか？
  s2:
    title: アメリカでは／142人が入った
    hook: カルテルで刑務所に入った人は、／アメリカで何人いると思いますか？
    tease: では、／日本では何人が入ったのか？
  s3:
    title: 日本では／0人
    hook: 日本でカルテルで刑務所に入った人は、／何人だと思いますか？
    tease: 条文には「5年以下」とあるのに、／なぜ使われないのか？
  s4:
    title: 課徴金の平均／6558万円
    hook: 課徴金を命じられた会社は、／1社あたりいくら取られたと思いますか？
    tease: なぜ年によって、／348倍も変わるのか？
  s5:
    title: 国が作った／1つだけの席
    hook: 黙っていれば全員が得をする約束に、／国は何を置いたのか？
    tease: その席へ走るなと言った会社は、／どうなるのか？

