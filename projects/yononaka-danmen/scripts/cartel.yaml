# 1本目。カルテル（2026-10-09 に原典を当たって作った）
# 材料と出典の一覧は research/cartel/sources.md
# 守る線（同ファイル末尾）: ビールの過去のカルテルには触れない／
#   「過去最高」の3種類を混ぜない／上位件数は公取委の公式順位ではないと注記する

title: なぜカルテルは「最初に自白した1社」だけ0円なのか
question: 同じカルテルをした会社が、なぜ0円と127億円に分かれるのか
date: 2026-10-10
sources:
  - e-Gov 法令検索「私的独占の禁止及び公正取引の確保に関する法律」
  - 公正取引委員会「課徴金制度」
  - 公正取引委員会「独占禁止法の規制内容」（カルテル・入札談合の説明）
  - 公正取引委員会（令和元年7月30日）報道発表・別表
  - 公正取引委員会（令和7年5月14日）報道発表（ごま油の事件）
  - 公正取引委員会（令和5年3月30日）報道発表（電力カルテル）
  - 公正取引委員会「独占禁止法改正法（令和元年改正）に関するQ&A」
  - 公正取引委員会『令和7年度 年次報告』第2部第2章 第7表
  - 公正取引委員会『令和7年度における独占禁止法違反事件の処理状況』
  - 公正取引委員会「告発事件一覧」
  - 欧州委員会「CARTEL STATISTICS」
  - 米国司法省反トラスト局「Antitrust Division Workload Statistics FY2015-2024」
  - 欧州委員会「Fines for breaking EU competition law」（ファクトシート）
  - 米国連邦法 15 U.S.C. §1・18 U.S.C. §3571
  - 写真：「Robert F. Kennedy Department of Justice Building」APK／Wikimedia Commons（CC BY 4.0）

