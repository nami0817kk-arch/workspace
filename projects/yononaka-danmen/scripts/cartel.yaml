      - 聞き: 競争するはずの相手と、相談しちゃうんですか。
      - screen: s0005
      - 語り: そうです。役所の工事で、取る会社を先に決めるのは「入札談合」と呼ばれます。
      - 語り: 法律では、どちらもまとめて「不当な取引制限」と言います。
      - 聞き: じゃあ、ビールの4社は、それをやったんですか。
      - 語り: まだ分かりません。報じられたのは立入検査まで。公正取引委員会は発表していません。
