      - 語り: なので今日は、この件の行方ではなく、カルテルという仕組みそのものを見ます。
      - 聞き: 仕組み……正直、やったら罰金、くらいしか思い浮かばないです。
      - 語り: その罰金が、同じことをした会社のあいだで、まるで違うんです。
      - 語り: 0円の会社と、127億円の会社がありました。
