        note: ドイツ連邦統計局「WISTA 3/2021」／連邦議会 資料 19/20058
        point: 下げたぶんは、一部しか値札に届かなかった
    lines:
      - 語り: さきほどのお弁当。計算すると、1010円です。
      - 聞き: 1010円……。私、1000円ちょっとって言いました。
      - 語り: 近いです。ただ、7%下がるわけではありません。
      - 語り: 1080円の中の税は、1000円の8%です。
      - 語り: それが1%になるので、下がるのは最大で6.48%。
      - 聞き: 最大で、ってことは……。
      - 語り: お店が、税が下がった分をすべて値札に反映した場合です。
      - 語り: 過去に、消費税の税率が変わった月を見ます。消費者物価指数です。
      - 語り: 1997年の4月、3%から5%に上がった月。
      - 語り: 物価の上がり方は、前の月の0.5%から1.9%に跳ねました。
      - 語り: 2014年の4月、5%から8%。1.6%から3.4%です。
      - 聞き: 上げたときは、すぐ値段に出たんですね。
      - 語り: 2019年の10月は、8%から10%でしたが、全体は0.2%のまま、動いていません。
      - 聞き: え、なんでですか。
      - 語り: 食料品が8%のまま据え置かれたからです。
      - 語り: 統計局は、物価指数の中身の3割ほどはもともと税がかからない物、2割ほどは軽減税率の対象だった、と書いています。
      - 語り: 中身で分けると、はっきりします。
      - 語り: 税率が上がった外食は、9月の1.0%から、10月は3.0%。
      - 語り: お酒もマイナス1.4%から1.5%に。
      - 語り: 8%のままの食料は、1.0%から1.7%でした。
      - 聞き: 上がった物だけ、ちゃんと上がってる。
      - 語り: 上げるときは、値札にそのまま出てきました。では、下げるときはどうか。
      - 語り: 日本では、消費税の税率を下げたことが、一度もありません。
      - 聞き(強): 一度も？
      - 語り: 一度もありません。なので、外国を見ます。
      - 語り: ドイツは2020年の7月から半年だけ、税率を19%から16%に、食料品などは7%から5%に下げました。
      - 語り: 計算上は、物価が最大で1.6%下がるはずでした。
      - 聞き: 実際は？
      - 語り: 7月に下がったのは、0.5%です。
      - 聞き(強): 3分の1くらいしか下がってない。
      - 語り: ドイツの統計局は、消費者への反映は一部だけだった、と書いています。
      - 聞き: 下げても、値札は全部は下がらないかもしれないんだ。
      - 語り: ドイツでは、そうでした。日本でどうなるかは、まだ数字がありません。
      - 語り: もうひとつ、下げると起きることがあります。線の引き方です。

