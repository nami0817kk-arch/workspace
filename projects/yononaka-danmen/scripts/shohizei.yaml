      - 語り: 差は9ポイントに広がります。
      - 聞き(強): 9ポイント！ 1080円のお弁当なら……。
      - 語り: 税抜1000円なら、店の中で1100円、持ち帰ると1010円です。
      - 聞き: 90円も違う。私、絶対に持ち帰ります。
