      - 聞き(強): 1%！ ほとんど無くなるじゃないですか。
      - 語り: 国の分が0.78%、地方の分が0.22%。合わせて1%です。
      - 語り: 対象は、今8%になっている食料品と同じ範囲です。
      - 語り: 外食とお酒は、10%のままです。
