      - 語り: おもちゃ付きのお菓子のように、食べ物と物がセットのものもあります。
      - 語り: 税抜1万円以下で、食べ物の値段が3分の2以上なら、食料品の扱いです。
      - 聞き: 細かい……。その線の両側で、差が9ポイントになるんですね。
      - 語り: そうです。政府の大綱も、外食と持ち帰りの税率の差で影響を受ける業態への対応を、検討するとしています。
