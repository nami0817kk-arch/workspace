# 3本目。食料品の消費税の引き下げ（2026-10-10 に原典を当たって作った）
# 材料と出典の一覧は research/shohizei/sources.md（守る線も同ファイル冒頭）
# 守る線: 減税の是非・財源のあて・戻すべきかに踏み込まない／4.3兆円は「報じられた試算」／見通しを言わない／外国の例は「その国の制度」

title: 食料品の消費税を下げると、何がどう変わるのか
question: 食料品の消費税が1%になる。値段も暮らしも、そのまま変わるのか
date: 2026-10-10
sources:
  - 内閣官房「飲食料品に係る消費税率の臨時的な引下げ」法律案・要綱・概要（令和8年10月）
  - 内閣官房「飲食料品消費税率の臨時的な引下げ及び就業者負担軽減支援金の導入に関する大綱」（令和8年9月15日閣議決定）
  - e-Gov 法令検索「消費税法」第1条・第29条
  - 財務省「令和７年度一般会計税収の予算額と決算額」
  - 財務省「消費税の使途（令和８年度予算）」
  - 国税庁「消費税の軽減税率制度に関するQ&A（制度概要編）」
  - 国税庁「飲食料品に係る２年間の消費税率引下げに関するＱ＆Ａ」（令和8年9月）
  - 総務省統計局「消費者物価指数」長期時系列・消費税調整済指数・2019年10月の試算
  - OECD「Consumption Tax Trends 2024」
  - 英国政府「Rates of VAT on different goods and services」
  - フランス政府 service-public「TVA」
  - ドイツ 売上税法 第12条／連邦議会 資料 19/20058・21/1974
  - ドイツ連邦統計局「WISTA 3/2021」
  - ポーランド財務省「食品の付加価値税」（2023年6月・2024年3月）

