title: 倒産が半年で5000件超。なぜ今、会社が潰れるのか
question: 倒産が半年で5000件を超えた。潰れているのは、どんな会社で、何が原因なのか
date: 2026-10-11
sources:
  - 帝国データバンク「倒産集計 2026年度上半期報（4月～9月）」「2026年9月報」「2025年報」
  - 帝国データバンク「全国企業『倒産リスク』分析調査（2025年）」
