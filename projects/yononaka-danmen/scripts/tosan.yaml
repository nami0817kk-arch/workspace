      - 語り: 2026年10月8日。帝国データバンクが、この半年の倒産件数を発表しました。
      - screen: s0002
      - 語り: 4月から9月で、5362件。年度の上半期で5000件を超えたのは、2年連続です。
      - screen: s0003
      - 聞き(強): 半年で5000件。
      - 語り: 1年に直すと1万件ほどです。2025年は、年間で1万261件でした。
      - 語り: 年間で1万件を超えたのは、12年ぶりです。
      - 聞き: 1日に何件くらいなんですか。
      - 語り: 5362件を183日で割ると、1日に約29件です。こちらで計算した数です。
      - 語り: 前の年の同じ時期と比べて増えたのは、これで10期連続。
      - 語り: 2000年度以降で、いちばん長い続き方です。
      - 聞き: ずっと増えてる……。
      - 語り: ただ、数え方によって数字が変わります。この動画は、帝国データバンクの数字で見ます。
        face: 真剣
      - 聞き: でも正直、どんな会社が潰れてるのか、全然イメージが湧かないです。
      - 語り: そこから、数字で見ます。

