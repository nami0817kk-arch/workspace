name: baseball_manager
description: "野球の監督・育成シミュレーション。"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # 日本語フォントを同梱する(Web は足りない字形を外から取りに行って豆腐になる)。
  # 選手名は自由入力なので、サブセットはソースの文字に絞らない。assets/fonts/README.md 参照。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
