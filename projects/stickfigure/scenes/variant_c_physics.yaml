    color: [0.3, 0.68, 0.1]
    scale: 1.0
    base_x: -2.0
    facing: 1
  B:
    color: [0.8, 0.1, 0.08]
    scale: 1.0
    base_x: 2.4
    facing: -1
stage: {wall_x: 6.0, style: cave}
slow:
- {start: 1.85, end: 2.4, rate: 0.35}
