# 比較用: 同じ大きさの2人が、同じ振り付け(接近→蹴り→敵が壁まで飛ぶ)を、3つの作り方で作る
# C: 物理シミュレーション
name: variant_c_physics
fps: 30
tau_end: 5.5
actors:
