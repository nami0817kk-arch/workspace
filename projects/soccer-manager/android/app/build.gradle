plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// リリース署名の鍵情報は android/key.properties から読み込む。
// このファイルは .gitignore 済みで、リポジトリには絶対に含めない。
// CI では GitHub Secrets から復元して同じ場所に書き出す
// (手順は docs/RELEASE_GUIDE.md を参照)。
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.kabuagari.soccer_manager"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Google Play 上のアプリを一意に識別する ID。公開後は変更できない。
        applicationId = "com.kabuagari.soccer_manager"
        // AdMob のアプリID。リリース時は gradle.properties か
        // -PADMOB_APP_ID=... で自分のIDを渡す。既定は Google のテスト用ID。
        manifestPlaceholders["admobAppId"] =
            project.findProperty("ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"

        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // key.properties がある時だけリリース署名を定義する。
        // ない環境 (新しくクローンした開発機など) では下の buildTypes が
        // debug 署名にフォールバックするので、flutter run --release は動き続ける。
        if (hasKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
            // R8 による縮小・難読化は既定で無効にしてある。
            // Dart のコードは AOT でネイティブに落ちるため R8 が触るのは
            // 薄い Java/Kotlin 層だけで、削減効果に対して実機でしか
            // 検出できない ClassNotFoundException のリスクが割に合わない。
            // 有効にする場合は下の 2 行を true にし、必ず実機の
            // リリースビルドで起動確認をすること (ルールは proguard-rules.pro に用意済み)。
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}
