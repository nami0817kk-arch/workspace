{# 手順や項目に添える線画のアイコン（24×24、線の色は currentColor）。外部の素材は使わない。 #}
{% macro icon(name, size=28) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "globe" -%}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>
{%- elif name == "passport" -%}<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>
{%- elif name == "money" -%}<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>
{%- elif name == "form" -%}<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>
{%- elif name == "shield" -%}<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "plane" -%}<path d="M3 13l7-2 4-7 2 1-2 7 6 2v2l-7-1-3 5H8l1-6-6-1z"/>
{%- elif name == "home" -%}<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>
{%- elif name == "id" -%}<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.8-2.3 3-2.3s2.4.7 3 2.3M14 10h4M14 13h3"/>
{%- elif name == "bank" -%}<path d="M3 9l9-5 9 5M5 9v8M9.5 9v8M14.5 9v8M19 9v8M3 20h18"/>
{%- elif name == "hospital" -%}<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>
{%- elif name == "briefcase" -%}<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/>
{%- elif name == "phone" -%}<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>
{%- elif name == "pin" -%}<path d="M12 21s-6-5.5-6-11a6 6 0 0112 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>
{%- elif name == "siren" -%}<path d="M6 18v-5a6 6 0 0112 0v5"/><path d="M4 18h16v3H4zM12 3v2M4.5 6.5l1.4 1.4M19.5 6.5l-1.4 1.4"/>
{%- elif name == "yen" -%}<circle cx="12" cy="12" r="9"/><path d="M8.5 7l3.5 5 3.5-5M12 12v5M9 13h6M9 15.5h6"/>
{%- elif name == "check" -%}<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{%- elif name == "suitcase" -%}<rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V4h6v3M9 11v5M15 11v5"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "coins" -%}<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v4c0 1.7 2.7 3 6 3s6-1.3 6-3V7M9 14v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-4c0-1.6-2.4-2.9-5.5-3"/>
{%- elif name == "city" -%}<path d="M4 21V9l5-3v15M9 21V4l6 3v14M15 21v-9l5 2v7M3 21h18"/>
{%- elif name == "calendar" -%}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>
{%- elif name == "users" -%}<circle cx="9" cy="8" r="3"/><path d="M3 20c.8-3.5 3.2-5 6-5s5.2 1.5 6 5M16 5.5a3 3 0 010 5.5M18 15c1.6.6 2.6 2.2 3 5"/>
{%- elif name == "flag" -%}<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro flag(c, cls="flag") -%}
<img class="{{ cls }}" src="{{ base_url }}static/flags/{{ c.flag }}.svg" alt="" width="24" height="18">
{%- endmacro %}
