name: basketball_career
description: "バスケットボールの選手育成シミュレーション。"
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.2
  in_app_purchase_storekit: ^0.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-NotoSansJP.txt
    - assets/art/title.jpg
    - assets/art/ending_glory.jpg
    - assets/art/ending_quiet.jpg
    - assets/art/path.jpg
    - assets/art/hall.jpg
    - assets/art/scene_minibasket.jpg
    - assets/art/scene_junior.jpg
    - assets/art/scene_high.jpg
    - assets/art/scene_university.jpg
    - assets/art/scene_corporate.jpg
    - assets/art/scene_pro.jpg
    - assets/art/scene_abroad.jpg
    - assets/art/scene_national.jpg
    - assets/art/icons/
    - assets/art/players/

  # 日本語フォントを同梱する(Web は足りない字形を外から取りに行って豆腐になる)。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
