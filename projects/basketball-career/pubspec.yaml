name: basketball_career
description: "バスケットボールの選手育成シミュレーション。"
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.2
  in_app_purchase_storekit: ^0.4.13
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 本物の購入処理を偽の App Store につないで試す(test/store_purchase_test.dart)
  in_app_purchase_platform_interface: ^1.4.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-NotoSansJP.txt
    - assets/art/title.jpg
    - assets/art/scene_national.jpg
    - assets/art/scene_final.jpg
    - assets/art/players/

  # 日本語フォントを同梱する(Web は足りない字形を外から取りに行って豆腐になる)。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
