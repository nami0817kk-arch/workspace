<title>ひかりの指名</title>
<style>
:root{
  --bg:#f6f3fa;--fg:#231d33;--muted:#5a5370;--card:#ffffff;--card2:#f0ebf7;--line:#e0d8ec;
  --accent:#7445d6;--accent-fg:#ffffff;--gold:#7d5600;--gold-bg:#fff6dc;--ok:#13663f;--ok-bg:#e3f5ec;--bad:#c23848;--bad-bg:#fdecee;
  --c-v:#d6407a;--c-d:#2d6bd3;--c-r:#cf7210;--c-t:#1a9468;
  --shadow:0 1px 3px rgba(40,20,80,.08),0 6px 18px rgba(40,20,80,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111c;--fg:#ece8f5;--muted:#a49db8;--card:#211c2c;--card2:#2a2438;--line:#3a3249;
    --accent:#a47cf2;--accent-fg:#150f22;--gold:#e9ba4b;--gold-bg:#3a3020;--ok:#4cc38a;--ok-bg:#1c3328;--bad:#ef6b79;--bad-bg:#3a1f26;
    --c-v:#f0709c;--c-d:#6c9cf0;--c-r:#f0a14a;--c-t:#45c592;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c;--fg:#ece8f5;--muted:#a49db8;--card:#211c2c;--card2:#2a2438;--line:#3a3249;
  --accent:#a47cf2;--accent-fg:#150f22;--gold:#e9ba4b;--gold-bg:#3a3020;--ok:#4cc38a;--ok-bg:#1c3328;--bad:#ef6b79;--bad-bg:#3a1f26;
  --c-v:#f0709c;--c-d:#6c9cf0;--c-r:#f0a14a;--c-t:#45c592;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:680px;margin:0 auto;padding:0 16px 120px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hdr .logo{font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.hdr .wk{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .rt{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.btn-s{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12px;min-height:34px;white-space:nowrap}
.btn-s.warn{border-color:var(--bad);color:var(--bad)}
.dots{display:flex;gap:4px;margin:10px 0 4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--gold)}
h1{font-size:24px;margin:8px 0}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin:10px 0}
.card.fmt{border-left:5px solid var(--accent)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-fg);min-height:52px;margin:10px 0}
.btn.sub{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ad{background:var(--gold-bg);color:var(--fg);border:1px dashed var(--gold);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;text-align:left}
.btn.ad svg{flex:none}
/* 顔（ユーザー提供の絵。小さい所は角丸の四角、大きい所は元の比率のまま拡大しない） */
.face{flex:none;display:block;width:48px;height:48px;border-radius:12px;object-fit:cover;object-position:50% 22%;border:2.5px solid var(--line);background:var(--card2)}
.face.sm{width:36px;height:36px;border-radius:9px;border-width:2px}
.face.md{width:64px;height:64px;border-radius:14px}
.face.lg{width:120px;height:154px;border-radius:14px;border-width:3px;object-position:50% 50%}
.face.xl{width:126px;height:162px;border-radius:16px;border-width:4px;object-position:50% 50%}
.face.b-v{border-color:var(--c-v)}.face.b-d{border-color:var(--c-d)}.face.b-r{border-color:var(--c-r)}.face.b-t{border-color:var(--c-t)}
.face.dim{filter:grayscale(.7);opacity:.7}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;vertical-align:middle}
.sp-v{background:#b02c60}.sp-d{background:#2253a8}.sp-r{background:#9a5205}.sp-t{background:#11704c}
.tag.lt{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.tag.warn{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.tag.good{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;margin-top:4px}
.stats b{font-weight:800}
.stats .q{color:var(--muted)}
.cand{display:flex;gap:10px;align-items:flex-start;cursor:pointer;border:2px solid var(--line);position:relative}
.cand.on{border-color:var(--accent);background:var(--card2)}
.cand .chk{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.cand.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cand .body{flex:1;min-width:0;padding-right:28px}
.nm{font-weight:800;font-size:16px}
.line{font-size:13px;color:var(--muted);margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .cnt{font-size:13px;flex:1;min-width:0;line-height:1.35}
.foot .cnt b{font-size:17px}
.foot .btn{width:auto;margin:0;padding:10px 16px;min-height:46px;font-size:15px;flex:none}
.pl{padding:12px}
.pl .top{display:flex;gap:10px;align-items:center}
.pl .who{flex:1;min-width:0}
.bars{display:flex;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.bars>div{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:3px}
.bar .pop{background:var(--accent)}.bar .cf{background:var(--c-t)}
.bar .f0{background:var(--ok)}.bar .f1{background:var(--gold)}.bar .f2{background:var(--bad)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.acts.c3{grid-template-columns:repeat(3,1fr)}
.acts.c2{grid-template-columns:1fr 1fr}
.acts button,.posr button{border:1px solid var(--line);background:var(--card2);border-radius:9px;min-height:40px;font-size:12.5px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:800}
.acts button.pass.on{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button.fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
.posr{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px;margin-top:6px;align-items:center;font-size:12px}
.posr button.on{outline:2px solid var(--fg);font-weight:800}
.posr .pv.on{background:#b02c60;color:#fff}.posr .pd.on{background:#2253a8;color:#fff}.posr .pr.on{background:#9a5205;color:#fff}
.ev .ttl{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em}
.evfaces{display:flex;gap:14px;justify-content:center;margin:10px 0}
.evfaces>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:52px}
.choice b{display:block;font-size:15px}
.choice span{font-size:12.5px;color:var(--muted)}
.res-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.res-row:last-child{border-bottom:none}
.res-row .mid{flex:1;min-width:0}
.res-row .mid .nm{font-size:14px}
.res-row .bar{height:9px}
.res-row .sc{width:38px;text-align:right;font-weight:800;font-size:15px;flex:none}
.grow{animation:grow 1s ease-out both}
@keyframes grow{from{width:0}}
.team{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.team.win{border:2px solid var(--gold);background:var(--gold-bg)}
.team .th{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.call{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.call.new{animation:pop .55s ease-out both}
.call .no{font-weight:800;color:var(--ok);font-size:13px;flex:none;width:44px;text-align:center}
.call.debut .no{color:var(--gold)}
.call .who{flex:1;min-width:0}
.call.out{opacity:.8;background:var(--card2)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.lastseat{text-align:center;padding:18px 12px;border:2px dashed var(--gold);background:var(--gold-bg)}
.lastseat .vs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cmt{border-left:3px solid var(--accent);background:var(--card);padding:8px 12px;margin:6px 0;border-radius:0 10px 10px 0;font-size:14px}
.cmt.angry{border-left-color:var(--bad)}
.cmt .h{font-size:11.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.grade{font-size:64px;font-weight:800;line-height:1;color:var(--gold);text-align:center;margin:8px 0}
.debut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:10px 0}
.debut-grid>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero{text-align:center;padding:10px 0}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.gsel button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:800;min-height:56px}
.gsel button.on{border-color:var(--accent);background:var(--card2);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--card2);border-radius:10px;padding:8px 12px;margin:8px 0}
.toast{background:var(--card2);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
.react{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--card2)}
.big-num{font-size:34px;font-weight:800;text-align:center;line-height:1.2}
ul.tight{margin:6px 0;padding-left:20px}
.facerow{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.budget{display:flex;justify-content:space-between;align-items:center;background:var(--gold-bg);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;margin:10px 0;font-size:14px}
.budget b{font-size:20px}
.pickrow{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.pk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;width:66px;font-size:11.5px}
.pk span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk em{font-style:normal;color:var(--muted);font-size:12px}
.pk.on{border-color:var(--accent);background:var(--card2);font-weight:800}
.trow{display:flex;align-items:center;gap:8px;padding:4px 0}
.trow .nm2{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-width:40px;min-height:34px;font-weight:800}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0}
.act{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:2px}
.act.on{border-color:var(--accent);background:var(--card2)}
.actb{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;min-height:64px}
.actb:disabled{opacity:.45}
.actb b{display:block;font-size:14px}
.actb .cost{float:right;font-weight:800;color:var(--gold);font-size:13px;margin-top:-20px}
.act .acts,.act .pickrow{padding:0 8px 8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:14px}
.row .btn-s:disabled{opacity:.45}
.seg{display:flex;gap:4px;flex:none}
.seg button{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-height:38px;min-width:46px;font-size:12px;padding:0 6px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:800}
.seg button.pass.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
.jrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.jrow .mid{flex:1;min-width:0}
.jrow .nm{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.feat{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-height:32px;font-size:11.5px;padding:0 8px;flex:none}
.feat.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:800}
.choice.sel{border:2px solid var(--accent);background:var(--card)}
img.face[data-a]{cursor:pointer}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,12,35,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(40px + env(safe-area-inset-top,0px))}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:100%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.sheet .close{position:sticky;top:0;float:right;z-index:2}
.ptop{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.ptop>div{flex:1;min-width:180px}
.pname{font-size:20px;font-weight:800}
.prow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.prow>span:last-child{flex:1;min-width:0}
.pl2{flex:none;width:68px;color:var(--muted);font-size:12px;font-weight:700;padding-top:2px}
.spark{display:flex;align-items:flex-end;gap:6px;height:58px}
.spark i{display:block;width:24px;background:var(--accent);border-radius:4px 4px 0 0;position:relative}
.spark i.rest{background:var(--line)}
.spark i em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;color:var(--muted)}
.rel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;margin:0 4px 4px 0;font-size:13px;font-weight:700}
.rel small{font-weight:400;color:var(--muted);margin-left:4px}
ul.log li{margin:3px 0}
.epi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.epi:last-child{border-bottom:none}
.ap{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.ap i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.ap i.on{background:var(--accent)}
.trow2{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.trow2 .mid{flex:1;min-width:0}
.trow2 .nm{font-size:14.5px}
.trow2 .seg button:disabled{opacity:.4}
.card.req{border-left:4px solid var(--gold)}
.req .top{display:flex;gap:10px;align-items:center}
.req .who{flex:1;min-width:0}
.memo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 0 6px}
.stagec{background:radial-gradient(ellipse 70% 50% at 50% -8%,rgba(255,236,190,.4),transparent 70%),linear-gradient(180deg,#261745,#0d0919);color:#f4effd;border-radius:18px;padding:16px;margin:10px 0;position:relative;overflow:hidden}
.stagec .ttl{font-size:12px;letter-spacing:.14em;color:#e9ba4b;font-weight:800}
.stagec h2{color:#fff}
.stagec .who{text-align:center;margin:8px 0}
.stagec .who .face{margin:0 auto;border-color:#e9ba4b}
.stagec .facerow .face{margin:0}
.stagec .song{font-size:12.5px;color:#cfc3ee;margin:2px 0}
.pname2{font-size:19px;font-weight:800;margin-top:6px}
.beats p{opacity:0;animation:fadeup .5s ease-out forwards;margin:7px 0;font-size:15px}
.live{min-height:40px;margin:6px 0}
.live div{opacity:0;animation:fadeup .4s ease-out forwards;font-size:12.5px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px 9px;margin:3px 4px 3px 0;display:inline-block}
.live small{opacity:.6}
.gauge{height:12px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 2px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0709c,#e9ba4b);animation:gfill 1.2s ease-out forwards}
.scorepop{font-size:46px;font-weight:800;text-align:center;opacity:0;animation:pop2 .5s ease-out forwards;color:#ffe08a;line-height:1.15;margin-top:6px}
.scorepop small{font-size:16px;margin-left:2px}
.hl{display:inline-block;background:#e9ba4b;color:#1c1330;font-weight:800;border-radius:6px;padding:0 8px;font-size:13px;vertical-align:middle}
.judge{text-align:center;opacity:0;animation:fadeup .4s forwards;color:#e6dcff;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;opacity:0;animation:fadeup .4s forwards}
.chips span{background:rgba(255,255,255,.12);border-radius:999px;padding:1px 9px;font-size:12px}
.featrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}
.stagec .btn-s{background:rgba(255,255,255,.1);color:#f4effd;border-color:rgba(255,255,255,.28)}
.stagec .btn-s.on{background:#e9ba4b;color:#1c1330;border-color:#e9ba4b;font-weight:800}
.stagec .btn-s:disabled{opacity:.4}
.pen{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pen i{width:6px;height:20px;border-radius:3px;animation:bob 1.1s ease-in-out infinite;opacity:.9}
.noanim .beats p,.noanim .live div,.noanim .gauge i,.noanim .scorepop,.noanim .judge,.noanim .chips{animation-delay:0s!important;animation-duration:.01s!important}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes gfill{to{width:var(--w)}}
@keyframes pop2{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.stagec *{animation-delay:0s!important;animation-duration:.01s!important;animation-iteration-count:1!important}}
.choice .hint{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.tone{font-size:12px;letter-spacing:.02em;font-weight:800;border-radius:5px;padding:0 6px;color:#fff}
.t-s{background:#11704c}.t-h{background:#5b3fa0}.t-a{background:#9a5205}.t-f{background:#2253a8}
.hp{font-size:12px;border-radius:5px;padding:0 6px;border:1px solid var(--line)}

/* ===== 画面の動きと構成（2026-10-03「有料アプリレベル」） ===== */
/* 合格発表の舞台 */
.cstage{position:relative;overflow:hidden;border-radius:20px;margin:8px 0 12px;padding:14px 12px 16px;color:#f4effd;text-align:center;
  background:radial-gradient(ellipse 55% 60% at 50% 18%,rgba(255,236,190,.28),transparent 70%),linear-gradient(180deg,rgba(30,18,58,.55),rgba(11,7,22,.92) 70%),var(--bgi-stage2,linear-gradient(#261745,#0d0919));background-size:cover;background-position:center top;box-shadow:0 12px 30px rgba(20,10,50,.3)}
.cstage.fin{background:radial-gradient(ellipse 55% 60% at 50% 18%,rgba(255,215,106,.34),transparent 70%),linear-gradient(180deg,rgba(30,18,58,.5),rgba(11,7,22,.92) 70%),var(--bgi-hall,linear-gradient(#261745,#0d0919));background-size:cover}
.cshd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.14em;color:#e9ba4b;font-weight:800}
.cshd b{font-size:22px;letter-spacing:0;color:#fff;font-variant-numeric:tabular-nums}.cshd b small{font-size:13px;color:#cfc5ee}
.crev{position:relative;padding:8px 0 4px;min-height:270px}
.crev::before{content:'';position:absolute;left:50%;top:-40px;width:240px;height:330px;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0,transparent 0 6deg,rgba(255,240,200,.32) 14deg 26deg,transparent 34deg 360deg);animation:spotIn .6s ease-out both}
.crev>*{position:relative}
.crno{font-size:13px;font-weight:800;color:#e9ba4b;letter-spacing:.2em;animation:fadeup .35s ease-out both}
.crev .face{margin:6px auto 0;border-color:#e9ba4b;box-shadow:0 0 0 4px rgba(233,186,75,.25),0 0 40px rgba(255,220,140,.45);animation:revealPop .55s cubic-bezier(.2,1.4,.4,1) .15s both}
.crnm{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:26px;margin-top:8px;text-shadow:0 2px 14px rgba(0,0,0,.6);animation:nameIn .6s ease-out .35s both}
.crtg{margin-top:4px;animation:fadeup .4s ease-out .55s both}
.crln{font-size:14px;color:#efe8ff;margin-top:8px;min-height:1.6em;animation:fadeup .4s ease-out .75s both}
.cseats{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px 6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.cseat{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#efe8ff;min-height:66px}
.cseat i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.3);font-style:normal;font-size:12px;color:rgba(255,255,255,.55)}
.cseat .face{width:44px;height:44px;border-radius:12px;border-width:2px;border-color:#e9ba4b}
.cseat span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cseat.nw{animation:seatIn .5s cubic-bezier(.2,1.4,.4,1) .5s both}
@keyframes spotIn{from{opacity:0;transform:translateX(-50%) scaleY(.6)}to{opacity:1;transform:translateX(-50%)}}
@keyframes revealPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes nameIn{from{opacity:0;letter-spacing:.5em;filter:blur(4px)}to{opacity:1;letter-spacing:.02em;filter:none}}
@keyframes seatIn{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1;transform:none}}
/* アイキャッチ */
#eyec{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;animation:eyeBg 1s ease both}
#eyec .ein{position:relative;padding:16px 34px;text-align:center;color:#fff;background:linear-gradient(90deg,transparent,rgba(26,16,52,.94) 18%,rgba(26,16,52,.94) 82%,transparent);width:100%;animation:eyeBar 1s cubic-bezier(.2,.8,.2,1) both}
#eyec .ein::after{content:'';position:absolute;left:18%;right:18%;bottom:8px;height:2px;background:linear-gradient(90deg,transparent,#e9ba4b,transparent)}
#eyec small{display:block;font-size:12px;letter-spacing:.3em;color:#e9ba4b;font-weight:800}
#eyec b{display:block;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:30px;letter-spacing:.06em;margin-top:2px}
@keyframes eyeBg{0%{background:rgba(10,6,22,0)}20%,70%{background:rgba(10,6,22,.25)}100%{background:rgba(10,6,22,0)}}
@keyframes eyeBar{0%{opacity:0;transform:translateX(-30px)}22%{opacity:1;transform:none}75%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30px)}}
/* 画面に入るとき、上から順に少しずつ */
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}
#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
/* 下から出てくるシート */
#app.enter .ov{animation:ovIn .2s ease-out both}#app.enter .ov .sheet{animation:sheetUp .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
body.reduce .crev::before,body.reduce .crev .face,body.reduce .crnm,body.reduce .crtg,body.reduce .crln,body.reduce .crno,body.reduce .cseat.nw,body.reduce #app.enter .ov,body.reduce #app.enter .ov .sheet{animation:none}
@media (prefers-reduced-motion:reduce){.crev::before,.crev .face,.crnm,.crtg,.crln,.crno,.cseat.nw,#app.enter .ov,#app.enter .ov .sheet{animation:none}}

.cseats{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px 4px}
.cseat{min-height:0;font-size:12px}
.cseat i,.cseat .face{width:38px;height:38px;border-radius:10px}
.cseat span{max-width:46px}
.crev{min-height:250px}

/* ===== レッスン結果（ゲージで見せる） ===== */
.lrsum{display:flex;gap:8px;margin:0 0 10px}.lrsum span{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;font-size:12.5px;color:var(--muted)}
.lrsum b{display:block;font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}.lrsum .g{border-color:var(--gold);background:var(--gold-bg)}
.lrcard{padding:6px 12px}
.lritem{padding:10px 0;border-bottom:1px solid var(--line);animation:fadeup .35s ease-out both}.lritem:last-child{border-bottom:none}
.lrhd{display:flex;align-items:center;gap:8px}.lrnm{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}.lrnm b{font-size:15px}.lrk{font-size:12.5px;color:var(--muted)}
.lrbadge{font-weight:900;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);animation:bpop .4s cubic-bezier(.2,1.5,.4,1) both}
.lrbadge.great{background:linear-gradient(160deg,#ffe08a,#d9a420);color:#3a2600;border-color:#c9951a;box-shadow:0 2px 10px rgba(217,164,32,.45)}
.lrrow{display:grid;grid-template-columns:40px 1fr 62px;align-items:center;gap:8px;margin-top:6px}
.lrl{font-size:12.5px;font-weight:700;color:var(--muted)}
.lrbar{position:relative;height:12px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.lrbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.lrbar i.old{background:rgba(124,77,232,.35)}
.lrbar i.new{width:var(--b);background:linear-gradient(90deg,#8a5ff0,#c7a8ff);box-shadow:0 0 10px rgba(124,77,232,.5);animation:lgrow .9s cubic-bezier(.2,.8,.2,1) both}
.lrbar i.fz{width:var(--b);animation:lgrow .9s ease-out both}.lrbar i.fz.ok{background:#4cb38a}.lrbar i.fz.warn{background:#e0a92e}.lrbar i.fz.bad{background:#e0606f}
.lrrow.fat .lrbar{height:8px}
@keyframes lgrow{from{width:var(--a)}to{width:var(--b)}}
.lrv{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrv em{font-style:normal;font-size:12px;font-weight:900;color:var(--ok);margin-left:3px;display:inline-block;animation:bpop .4s cubic-bezier(.2,1.5,.4,1) both}
.lrrow.fat .lrv{font-size:13px;color:var(--muted)}.lrrow.fat .lrv em.up{color:var(--bad)}.lrrow.fat .lrv em.dn{color:var(--ok)}
.dl span{animation:bpop .4s cubic-bezier(.2,1.5,.4,1) both}
body.reduce .lritem,body.reduce .lrbadge,body.reduce .lrbar i,body.reduce .lrv em,body.reduce .dl span{animation:none}
@media (prefers-reduced-motion:reduce){.lritem,.lrbadge,.lrbar i,.lrv em,.dl span{animation:none}}

/* レッスン結果を詰める：1人2行、伸びた分は金色 */
.lritem{display:flex;gap:10px;align-items:center;padding:8px 0}
.lrmain{flex:1;min-width:0}
.lrhd{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}.lrhd b{font-size:15px;white-space:nowrap}.lrhd .lrk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrbadge{padding:1px 8px;font-size:12px;flex:none}
.lrfat{margin-left:auto;flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}.lrfat em{font-style:normal;margin-left:2px;color:var(--bad)}.lrfat em.dn{color:var(--ok)}.lrfat.warn{color:#b07800}.lrfat.bad{color:var(--bad)}
.lrrow{grid-template-columns:1fr 58px;margin-top:5px}
.lrbar i.old{background:linear-gradient(90deg,#8a5ff0,#a985f5)}
.lrbar i.gain{width:var(--g);background:linear-gradient(90deg,#f6d77e,#e9ba4b);box-shadow:0 0 8px rgba(233,186,75,.7);animation:ggrow .8s cubic-bezier(.2,.8,.2,1) both}
.lrbar.rest i.old{background:#4cb38a;opacity:.7}
.lrv.rest{font-size:12.5px;color:var(--ok)}
@keyframes ggrow{from{width:0}to{width:var(--g)}}
body.reduce .lrbar i.gain{animation:none}@media (prefers-reduced-motion:reduce){.lrbar i.gain{animation:none}}

/* 上の帯：制作費と視聴率を札に、審査の中の段階を並べる */
.hdr .rt{display:flex;align-items:center;gap:6px}
.hudc{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 5px;border-radius:999px;background:var(--gold-bg);border:1px solid var(--gold);color:var(--fg);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.hudc small{font-size:12px;font-weight:700;color:var(--muted)}
.hudc svg{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hudc.tv{background:var(--card2);border-color:var(--line)}.hudc.tv svg{stroke:var(--accent)}
.steps{display:flex;gap:3px;margin:6px 0 2px}
.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:3px 0;border-radius:6px;background:var(--card2);white-space:nowrap}
.steps span.done{opacity:1;color:var(--accent)}
.steps span.now{opacity:1;background:var(--accent);color:var(--accent-fg);box-shadow:0 2px 8px rgba(124,77,232,.35)}

.hdr .wk2{white-space:nowrap}
.steps .stw{flex:none;font-size:12px;font-weight:800;color:var(--fg);padding:3px 4px 3px 0;white-space:nowrap}

/* 信頼・自信・疲れのゲージ */
.gg{margin-top:8px;display:grid;gap:5px}
.ggr{display:grid;grid-template-columns:34px 1fr 64px;align-items:center;gap:8px}
.ggl{font-size:12px;font-weight:700;opacity:.85}
.ggb{height:8px;border-radius:5px;background:rgba(127,127,127,.22);overflow:hidden}
.ggb i{display:block;height:100%;width:var(--b);border-radius:5px;animation:lgrow .8s cubic-bezier(.2,.8,.2,1) both}
.ggb.tr i{background:linear-gradient(90deg,#5aa9ff,#8fc6ff)}.ggb.cf i{background:linear-gradient(90deg,#f0a43c,#ffd27a)}.ggb.ft i{background:linear-gradient(90deg,#4cb38a,#e0606f)}
.ggv{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ggv em{font-style:normal;font-size:12px;margin-left:3px}.ggv em.up{color:var(--ok)}.ggv em.dn{color:var(--bad)}
body.reduce .ggb i{animation:none}@media (prefers-reduced-motion:reduce){.ggb i{animation:none}}

/* ===== タイトル：全面の写真・題字・七つの席・メニュー ===== */
.tscr{position:relative;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);display:flex;flex-direction:column;align-items:center;color:#fff;padding:0 4px 18px;text-align:center}
body.ttl{background-attachment:fixed;background-color:#0c071c}body.ttl{background:radial-gradient(ellipse 70% 45% at 50% 30%,rgba(255,226,150,.28),transparent 70%),linear-gradient(180deg,rgba(18,10,40,.55) 0,rgba(12,7,28,.35) 35%,rgba(12,7,28,.9) 75%,#0c071c),var(--bgi-cg_penlight,var(--bgi-stage2,linear-gradient(#2a1b52,#0c071c)));background-size:cover;background-position:center 30%;background-attachment:fixed}
body.ttl::before{content:'';position:fixed;inset:0;z-index:0;background:conic-gradient(from 180deg at 50% -5%,transparent 0 150deg,rgba(255,240,200,.18) 165deg 195deg,transparent 210deg);animation:tbeam 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes tbeam{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.tscr .tbgm{align-self:stretch;margin:8px 0 0}
.tlogo{margin-top:6vh}
.tkick{font-size:12px;letter-spacing:.35em;color:#e9ba4b;font-weight:800;animation:fadeup .6s ease-out .1s both}
.logo7.tbig{font-size:62px;line-height:1.05;margin-top:6px;animation:tlogoIn .9s cubic-bezier(.2,.9,.25,1) .2s both,glow 3.6s ease-in-out 1.2s infinite}
.logo7.tbig span{display:block;font-size:.42em;letter-spacing:.3em;color:#f6e7c1;margin-bottom:2px}
.ttag{margin:10px 0 0;font-size:14px;color:#efe8ff;text-shadow:0 1px 8px rgba(0,0,0,.7);animation:fadeup .6s ease-out .6s both}
@keyframes tlogoIn{from{opacity:0;transform:scale(1.15);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.tseats{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:5vh 0 0;width:100%}
.tseat{position:relative;display:flex;flex-direction:column;align-items:center;animation:seatIn .6s cubic-bezier(.2,1.4,.4,1) both}
.tseat .face{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.75);box-shadow:0 6px 16px rgba(0,0,0,.45);object-fit:cover}
.tseat i{display:block;width:34px;height:10px;margin-top:4px;border-radius:3px;background:#4d3c80;box-shadow:0 3px 0 #2c2150}
.tseat.mid .face{width:58px;height:58px;border-color:#e9ba4b;box-shadow:0 0 0 3px rgba(233,186,75,.35),0 0 30px rgba(255,220,140,.6)}
.tseat.mid i{width:44px;background:#e9ba4b;box-shadow:0 3px 0 #a97f1e}
.tmenu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:auto;padding-top:5vh;animation:fadeup .6s ease-out .9s both}
.tbtn{min-height:56px;font-size:18px}.tbtn small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:1px}
.tmenu .btn.sub{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.tmrow{display:flex;gap:10px}.tmrow .btn{flex:1;min-height:46px;font-size:14px}
.trank{display:flex;gap:8px;justify-content:center;margin-top:14px;font-size:12px;color:#e8def9}.trank span{padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.tnote{color:var(--fg);text-align:left;width:100%;max-width:420px}
.tapp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.tapp .btn-s{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}.tapp .small{color:#e8def9}
.tcopy{margin-top:14px;font-size:12px;color:rgba(255,255,255,.7)}
.tsubhd{display:flex;align-items:center;gap:10px;margin:10px 0 8px}.tsubhd b{font-size:18px}
body.reduce.ttl::before,body.reduce .logo7.tbig,body.reduce .tseat,body.reduce .tmenu,body.reduce .tkick,body.reduce .ttag{animation:none}
@media (prefers-reduced-motion:reduce){body.ttl::before,.logo7.tbig,.tseat,.tmenu,.tkick,.ttag{animation:none}}
@media (min-height:760px){.tseat .face{width:46px;height:46px}.tseat.mid .face{width:64px;height:64px}}

.tscr{z-index:1}
.tscr .bgmb{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.tseats{gap:4px}.tseat .face{width:38px;height:38px}.tseat i{width:30px}.tseat.mid .face{width:56px;height:56px}
@media (min-height:760px){.tseat .face{width:40px;height:40px}.tseat.mid .face{width:60px;height:60px}}
body.ttl .hdr{display:none}

/* ===== ステージの見た目（2026-10-03 指摘「他の画面もしょぼい」）：場面ごとの写真を暗く敷き、札は半透明の暗い板に ===== */
body.stg:not(.ttl){background:#0d0a18}
body.stg::before{content:'';position:fixed;inset:-24px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 50% 0,rgba(199,168,255,.16),transparent 70%),linear-gradient(180deg,rgba(13,9,26,.62),rgba(13,9,26,.86) 45%,rgba(13,9,26,.96)),var(--phbg,var(--bgi-practice,none));
  background-size:cover;background-position:center 30%;filter:saturate(1.05)}
body.stg[data-ph=select],body.stg[data-ph=prep],body.stg[data-ph=interview]{--phbg:var(--bgi-studio,var(--bgi-practice))}
body.stg[data-ph=format],body.stg[data-ph=plan]{--phbg:var(--bgi-meeting,var(--bgi-practice))}
body.stg[data-ph=lesson],body.stg[data-ph=lres]{--phbg:var(--bgi-practice)}
body.stg[data-ph=talk]{--phbg:var(--bgi-dining,var(--bgi-practice))}
body.stg[data-ph=event],body.stg[data-ph=night]{--phbg:var(--bgi-night,var(--bgi-hallway))}
body.stg[data-ph=show],body.stg[data-ph=stage],body.stg[data-ph=critique]{--phbg:var(--bgi-stage)}
body.stg[data-ph=judge],body.stg[data-ph=result]{--phbg:var(--bgi-hall)}
body.stg[data-ph=call],body.stg[data-ph=month]{--phbg:var(--bgi-stage2,var(--bgi-stage))}
body.stg[data-ph=new],body.stg[data-ph=rec],body.stg[data-ph=menu]{--phbg:var(--bgi-cg_penlight,var(--bgi-stage))}
body.stg.ttl::before{display:none}
body.stg:not(.ttl){--card:rgba(30,24,46,.86);--card2:rgba(52,42,74,.72);--line:rgba(255,255,255,.12);--bg:rgba(13,10,24,.9)}
body.stg .card,body.stg .cand,body.stg .call,body.stg .seat,body.stg details.status,body.stg .lrsum span{box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
body.stg .hdr{background:rgba(13,10,24,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom-color:rgba(255,255,255,.1)}
body.stg .foot{background:rgba(13,10,24,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top-color:rgba(255,255,255,.1)}
body.stg h2{position:relative;padding-left:12px;letter-spacing:.02em}
body.stg h2::before{content:'';position:absolute;left:0;top:.25em;bottom:.25em;width:4px;border-radius:2px;background:linear-gradient(#f6d77e,#e9ba4b)}
body.stg h3{color:#efe8ff}
body.stg .btn:not(.sub):not(.ad){box-shadow:0 8px 22px rgba(124,77,232,.45),inset 0 1px 0 rgba(255,255,255,.25)}
body.stg .btn.sub{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
body.stg .telop{box-shadow:0 10px 28px rgba(0,0,0,.35)}
body.stg .dots i:not(.on):not(.now){background:rgba(255,255,255,.14)}
body.stg .ov{background:rgba(5,3,12,.6)}body.stg .sheet{background:#17121f}

body.stg .btn:not(.sub):not(.ad):not(.warnb){color:#fff;text-shadow:0 1px 2px rgba(40,10,90,.45)}

/* ===== 30回ループ 1〜5 ===== */
/* 1. 疲れの限界・けが */
.face.f-tired{box-shadow:0 0 0 3px rgba(239,107,121,.55);animation:tiredRing 1.6s ease-in-out infinite}
.face.f-inj{box-shadow:0 0 0 3px #ef6b79,0 0 12px rgba(239,107,121,.6)}
@keyframes tiredRing{50%{box-shadow:0 0 0 5px rgba(239,107,121,.25)}}
/* 2. 選択肢の帯 */
.choice{position:relative;overflow:hidden}
.choice[class*=" tn-"]::before,.choice:has(.tone)::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.choice.tn-s::before,.choice:has(.t-s)::before{background:#3fb37d}.choice.tn-h::before,.choice:has(.t-h)::before{background:#8a5ff0}.choice.tn-a::before,.choice:has(.t-a)::before{background:#4a8df0}.choice.tn-f::before,.choice:has(.t-f)::before{background:#e39a3b}
/* 3. 世間の声 */

@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
/* 5. 最後の評価を判子のように押す */
.rcard{position:relative;overflow:hidden}
.rcard .rg .gr{font-size:40px;padding:4px 16px;border-radius:14px;animation:stampIn .7s cubic-bezier(.2,1.5,.35,1) .3s both;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rcard .rg span{animation:fadeup .5s ease-out .8s both}
@keyframes stampIn{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}60%{opacity:1;transform:scale(.92) rotate(3deg)}100%{transform:none}}
body.reduce .face.f-tired,body.reduce .cmt.sns,body.reduce .apptoast,body.reduce .rcard .rg .gr,body.reduce .rcard .rg span{animation:none}
@media (prefers-reduced-motion:reduce){.face.f-tired,.cmt.sns,.apptoast,.rcard .rg .gr,.rcard .rg span{animation:none}}

.card.ev .evfaces .face.f-tired,.stagec .face.f-tired{box-shadow:0 0 0 4px rgba(239,107,121,.7),0 8px 22px rgba(0,0,0,.45)}
.card.ev .evfaces .face.f-inj,.stagec .face.f-inj{box-shadow:0 0 0 4px #ef6b79,0 8px 22px rgba(0,0,0,.45)}

/* ===== 30回ループ 6〜10 ===== */
/* 6. 表彰台 */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin:6px 0 10px}
.pd{display:flex;flex-direction:column;align-items:center;gap:3px;animation:seatIn .6s cubic-bezier(.2,1.4,.4,1) both}
.pd b{font-size:14px}.pd span{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pd i{display:block;width:100%;border-radius:10px 10px 4px 4px;margin-top:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pd.p1 i{height:64px;background:linear-gradient(180deg,#ffe08a,#d9a420)}.pd.p2 i{height:44px;background:linear-gradient(180deg,#f1f3f8,#aab2c3)}.pd.p3 i{height:30px;background:linear-gradient(180deg,#f3c79a,#b8763c)}
.pdm{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#2a1a00;background:#e9ba4b}
.pd.p2 .pdm{background:#cfd5e2}.pd.p3 .pdm{background:#e6a978}
.pd.p1 .face{border-color:#e9ba4b;box-shadow:0 0 0 3px rgba(233,186,75,.3),0 0 22px rgba(255,220,140,.5)}
/* 7. プロフィールの色の帯 */
.ptop{position:relative;padding-top:12px;border-top:4px solid var(--sc,var(--accent));border-radius:4px 4px 0 0;margin-top:30px}
/* 8. 信頼の小さなゲージ */
.smini>span.trc{display:inline-flex;align-items:center;gap:3px;border-color:rgba(90,169,255,.45)}
.trc i{display:inline-block;width:28px;height:5px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden;vertical-align:middle}.trc u{display:block;height:100%;background:#5aa9ff}
/* 9. 制作費の増減 */
.hudc.hup{animation:hudUp .8s ease-out}.hudc.hdn{animation:hudDn .8s ease-out}
@keyframes hudUp{30%{transform:scale(1.15);box-shadow:0 0 0 4px rgba(76,195,138,.35)}}
@keyframes hudDn{30%{transform:scale(1.1);box-shadow:0 0 0 4px rgba(239,107,121,.35)}}
/* 10. 審査の始まりのタイトルカード */
#eyec.big{animation-duration:1.7s}#eyec.big .ein{animation-duration:1.7s;padding:22px 30px}
#eyec.big b{font-size:34px}#eyec.big i{display:block;font-style:normal;color:#e9ba4b;letter-spacing:.3em;font-size:16px;margin-top:4px}
body.reduce .pd,body.reduce .hudc{animation:none}@media (prefers-reduced-motion:reduce){.pd,.hudc.hup,.hudc.hdn{animation:none}}

/* ===== 30回ループ 11〜15 ===== */
/* 11. 使い道の札 */
.actb{position:relative;padding-left:52px}
.aico{position:absolute;left:10px;top:12px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.aico svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,77,232,.22)}.act.on .aico{background:var(--accent)}.act.on .aico svg{stroke:#fff}
.aon{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;animation:bpop .35s cubic-bezier(.2,1.5,.4,1) both}
.actb .cost{margin-right:24px}
/* 12. 講評の色 */
.seg button.cr0.on{background:#2e9e6a;border-color:#2e9e6a;color:#fff}
.seg button.cr1.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg button.cr2.on{background:#c23848;border-color:#c23848;color:#fff}
.seg button.best:not(.on){border-color:var(--gold);color:var(--gold)}
/* 13. 合格人数のゲージ */
.jbar{position:relative;display:block;width:96px;height:6px;border-radius:3px;background:rgba(127,127,127,.25);margin-top:4px;overflow:visible}
.jbar i{display:block;height:100%;border-radius:3px;background:var(--muted);transition:width .3s}
.jbar.ok i{background:var(--ok)}.jbar.over i{background:var(--bad)}
.jbar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold);border-radius:1px}
/* 14. デビュー後の看板の顔 */
.mfaces{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.mfaces .face{width:36px;height:36px;border-radius:10px;border:2px solid rgba(255,255,255,.7)}
.weeks{position:relative}
/* 15. お出かけ先の写真の札 */
.otiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.otile{position:relative;height:92px;border-radius:14px;border:1px solid rgba(255,255,255,.2);overflow:hidden;text-align:left;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(10,6,22,.05),rgba(10,6,22,.78)),var(--ob);background-size:cover;background-position:center 40%;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.otile b{font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.7)}.otile span{font-size:12px;font-weight:700;color:#f6e7c1}
.otile:disabled{opacity:.45}

/* ===== 30回ループ 16〜20 ===== */
/* 16. 書類審査：選んだ子に金の縁と札 */
.cand{transition:border-color .2s,box-shadow .2s}
.cand.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,186,75,.25),0 8px 20px rgba(0,0,0,.2)}
.cand.on .chk{background:var(--gold);border-color:var(--gold);color:#2a1a00;animation:bpop .35s cubic-bezier(.2,1.5,.4,1) both}
/* 17. レッスンの色 */
.lrow{border-left:3px solid transparent;padding-left:8px;margin-left:-8px;transition:border-color .2s}
.lrow.lk-v{border-left-color:var(--c-v)}.lrow.lk-d{border-left-color:var(--c-d)}.lrow.lk-r{border-left-color:var(--c-r)}.lrow.lk-e{border-left-color:var(--c-t)}.lrow.lk-rest{border-left-color:#4cb38a}
/* 18. 出演者の顔が流れる */
.castrow{overflow:hidden;margin:10px -16px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.castin{display:flex;gap:6px;width:max-content;animation:castScroll 40s linear infinite}
.castin .face{width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.6);flex:none}
@keyframes castScroll{to{transform:translateX(-50%)}}
/* 19. 設定の区切り */
.setsheet h3{display:flex;align-items:center;gap:8px;margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.setsheet h3::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--accent)}
.setsheet h2+h3{border-top:none;padding-top:0}
/* 20. 新しく得たもの：トロフィーの丸 */
.newu{padding:6px 0 6px 32px!important;animation:fadeup .45s ease-out both}
.newu::before{content:'★'!important;left:0!important;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:linear-gradient(160deg,#ffe08a,#d9a420);color:#3a2600!important;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(217,164,32,.45)}
.newu:nth-child(3){animation-delay:.1s}.newu:nth-child(4){animation-delay:.2s}.newu:nth-child(5){animation-delay:.3s}
body.reduce .castin,body.reduce .newu,body.reduce .cand.on .chk{animation:none}
@media (prefers-reduced-motion:reduce){.castin,.newu,.cand.on .chk{animation:none}}

/* ===== 30回ループ 21〜25 ===== */
/* 21. エンドロールの写真がゆっくり寄る */
.ending::before{content:'';position:absolute;inset:-6%;background:var(--bgi-cg_debut,none) center/cover;opacity:.22;animation:kenburns 40s ease-in-out infinite alternate;pointer-events:none}
.ending>*{position:relative}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translateY(-2%)}}
/* 22. 合格にした行 */
.jrow{transition:background .25s;border-radius:10px}
.jrow.jon{background:linear-gradient(90deg,rgba(76,195,138,.16),transparent 70%);box-shadow:inset 3px 0 0 var(--ok)}
/* 23. 夜の画面に星 */
.stagec.night::after{content:'';position:absolute;inset:0 0 50% 0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#fff,transparent),radial-gradient(1px 1px at 76% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 30%,#fff,transparent),radial-gradient(1px 1px at 44% 34%,#fff,transparent);
  animation:twinkle 3.2s ease-in-out infinite alternate;transform:none;clip-path:none;width:auto;height:auto;top:0;left:0;right:0}
@keyframes twinkle{from{opacity:.35}to{opacity:.9}}
/* 24. 押した瞬間に光る */
.btn,.choice,.otile,.actb,.tacts button,.seg button{position:relative;overflow:hidden}
.btn::after,.choice::after,.otile::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .35s;pointer-events:none}
.btn:active::after,.choice:active::after,.otile:active::after{opacity:1;transition:none}
/* 25. いまの審査の印が脈打つ */
.dots i.now{animation:nowPulse 2s ease-in-out infinite}
@keyframes nowPulse{50%{box-shadow:0 0 14px rgba(233,186,75,.9)}}

@media (prefers-reduced-motion:reduce){.ending::before,.stagec.night::after,.dots i.now{animation:none}}

.seg button.ptog.on{background:var(--ok);border-color:var(--ok);color:#0e2a1c}

/* ===== 30回ループ 26〜30 ===== */
/* 26. 構成会議：盛り上がりの棒を光らせ、決めた審査の札に色の縁 */
.fstep i{background:linear-gradient(180deg,#f6d77e,#8a5ff0);border-radius:6px 6px 2px 2px;box-shadow:0 0 10px rgba(233,186,75,.35);animation:barUp .6s cubic-bezier(.2,.8,.2,1) both}
.fstep i.empty{background:none;border:1.5px dashed var(--line);box-shadow:none;animation:none}
.fstep:nth-child(2) i{animation-delay:.08s}.fstep:nth-child(3) i{animation-delay:.16s}.fstep:nth-child(4) i{animation-delay:.24s}.fstep:nth-child(5) i{animation-delay:.32s}
@keyframes barUp{from{transform:scaleY(.1);transform-origin:bottom}to{transform:none}}
.fslot:not(.empty):not(.in){border-left:4px solid var(--accent)}
.fslot.empty{background:transparent}
/* 27. 用語集を札に */
.gloss{display:grid;gap:8px;margin:0}

.gloss dd{margin:0 0 4px;padding:4px 12px 10px;background:var(--card2);border-radius:0 0 12px 12px;font-size:13.5px;line-height:1.7}

button:focus-visible,select:focus-visible,summary:focus-visible,[data-a]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 評価の内訳 */
.bdown .brow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}

.pk{position:relative}.pk .wish{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:12px;font-weight:800;background:var(--gold);color:#2a1a00;border-radius:999px;padding:0 6px;z-index:1}

function morphNode(p,x,y){

function gauges(t,list){if(!t)return '';var G=[['trust','信頼','tr'],['conf','自信','cf'],['fat','疲れ','ft']];
  return '<div class="gg">'+G.map(function(g,i){var cur=Math.round(clamp(t[g[0]],0,100)),d=0;(list||[]).forEach(function(x){if(x[0]===g[1])d=x[1];});var prev=Math.round(clamp(cur-d,0,100));

function deltaHtml(list){if(!list||!list.length)return '<div class="dl"><span class="small" style="opacity:.7">目に見える変化はなかった</span></div>';
  return '<div class="dl">'+list.map(function(x,i){return '<span class="'+(x[2]?'up':'dn')+'" style="animation-delay:'+(.15+i*.09).toFixed(2)+'s">'+(x[2]?'▲ ':'▼ ')+x[0]+' '+(x[1]>0?'+':'')+x[1]+'</span>';}).join('')+'</div>';}

(function(){try{ui.set=loadSet();applySet();}catch(e){}try{applyPacks();}catch(e){}var sv=load();if(sv){ui.g=sv.g||'m';if(sv.fmt)buildRounds(sv);}
