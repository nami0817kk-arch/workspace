<title>ひかりの七席</title>
<style>
:root{
  --bg:#f6f3fa;--fg:#231d33;--muted:#5a5370;--card:#ffffff;--card2:#f0ebf7;--line:#e0d8ec;
  --accent:#7445d6;--accent-fg:#ffffff;--gold:#7d5600;--gold-bg:#fff6dc;--ok:#13663f;--ok-bg:#e3f5ec;--bad:#c23848;--bad-bg:#fdecee;
  --c-v:#d6407a;--c-d:#2d6bd3;--c-r:#cf7210;--c-t:#1a9468;
  --shadow:0 1px 3px rgba(40,20,80,.08),0 6px 18px rgba(40,20,80,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111c;--fg:#ece8f5;--muted:#a49db8;--card:#211c2c;--card2:#2a2438;--line:#3a3249;
    --accent:#a47cf2;--accent-fg:#150f22;--gold:#e9ba4b;--gold-bg:#3a3020;--ok:#4cc38a;--ok-bg:#1c3328;--bad:#ef6b79;--bad-bg:#3a1f26;
    --c-v:#f0709c;--c-d:#6c9cf0;--c-r:#f0a14a;--c-t:#45c592;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c;--fg:#ece8f5;--muted:#a49db8;--card:#211c2c;--card2:#2a2438;--line:#3a3249;
  --accent:#a47cf2;--accent-fg:#150f22;--gold:#e9ba4b;--gold-bg:#3a3020;--ok:#4cc38a;--ok-bg:#1c3328;--bad:#ef6b79;--bad-bg:#3a1f26;
  --c-v:#f0709c;--c-d:#6c9cf0;--c-r:#f0a14a;--c-t:#45c592;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:680px;margin:0 auto;padding:0 16px 120px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hdr .logo{font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.hdr .wk{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .rt{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.btn-s{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12px;min-height:34px;white-space:nowrap}
.btn-s.warn{border-color:var(--bad);color:var(--bad)}
.dots{display:flex;gap:4px;margin:10px 0 4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--gold)}
h1{font-size:24px;margin:8px 0}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin:10px 0}
.card.fmt{border-left:5px solid var(--accent)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-fg);min-height:52px;margin:10px 0}
.btn.sub{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ad{background:var(--gold-bg);color:var(--fg);border:1px dashed var(--gold);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;text-align:left}
.btn.ad svg{flex:none}
/* 顔（ユーザー提供の絵。小さい所は角丸の四角、大きい所は元の比率のまま拡大しない） */
.face{flex:none;display:block;width:48px;height:48px;border-radius:12px;object-fit:cover;object-position:50% 22%;border:2.5px solid var(--line);background:var(--card2)}
.face.sm{width:36px;height:36px;border-radius:9px;border-width:2px}
.face.md{width:64px;height:64px;border-radius:14px}
.face.lg{width:120px;height:154px;border-radius:14px;border-width:3px;object-position:50% 50%}
.face.xl{width:126px;height:162px;border-radius:16px;border-width:4px;object-position:50% 50%}
.face.b-v{border-color:var(--c-v)}.face.b-d{border-color:var(--c-d)}.face.b-r{border-color:var(--c-r)}.face.b-t{border-color:var(--c-t)}
.face.dim{filter:grayscale(.7);opacity:.7}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;vertical-align:middle}
.sp-v{background:#b02c60}.sp-d{background:#2253a8}.sp-r{background:#9a5205}.sp-t{background:#11704c}
.tag.lt{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.tag.warn{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.tag.good{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;margin-top:4px}
.stats b{font-weight:800}
.stats .q{color:var(--muted)}
.cand{display:flex;gap:10px;align-items:flex-start;cursor:pointer;border:2px solid var(--line);position:relative}
.cand.on{border-color:var(--accent);background:var(--card2)}
.cand .chk{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.cand.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cand .body{flex:1;min-width:0;padding-right:28px}
.nm{font-weight:800;font-size:16px}
.line{font-size:13px;color:var(--muted);margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .cnt{font-size:13px;flex:1;min-width:0;line-height:1.35}
.foot .cnt b{font-size:17px}
.foot .btn{width:auto;margin:0;padding:10px 16px;min-height:46px;font-size:15px;flex:none}
.pl{padding:12px}
.pl .top{display:flex;gap:10px;align-items:center}
.pl .who{flex:1;min-width:0}
.bars{display:flex;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.bars>div{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:3px}
.bar .pop{background:var(--accent)}.bar .cf{background:var(--c-t)}
.bar .f0{background:var(--ok)}.bar .f1{background:var(--gold)}.bar .f2{background:var(--bad)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.acts.c3{grid-template-columns:repeat(3,1fr)}
.acts.c2{grid-template-columns:1fr 1fr}
.acts button,.posr button{border:1px solid var(--line);background:var(--card2);border-radius:9px;min-height:40px;font-size:12.5px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:800}
.acts button.pass.on{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button.fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
.posr{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px;margin-top:6px;align-items:center;font-size:12px}
.posr button.on{outline:2px solid var(--fg);font-weight:800}
.posr .pv.on{background:#b02c60;color:#fff}.posr .pd.on{background:#2253a8;color:#fff}.posr .pr.on{background:#9a5205;color:#fff}
.ev .ttl{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em}
.evfaces{display:flex;gap:14px;justify-content:center;margin:10px 0}
.evfaces>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:52px}
.choice b{display:block;font-size:15px}
.choice span{font-size:12.5px;color:var(--muted)}
.res-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.res-row:last-child{border-bottom:none}
.res-row .mid{flex:1;min-width:0}
.res-row .mid .nm{font-size:14px}
.res-row .bar{height:9px}
.res-row .sc{width:38px;text-align:right;font-weight:800;font-size:15px;flex:none}
.grow{animation:grow 1s ease-out both}
@keyframes grow{from{width:0}}
.team{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.team.win{border:2px solid var(--gold);background:var(--gold-bg)}
.team .th{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.call{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.call.new{animation:pop .55s ease-out both}
.call .no{font-weight:800;color:var(--ok);font-size:13px;flex:none;width:44px;text-align:center}
.call.debut .no{color:var(--gold)}
.call .who{flex:1;min-width:0}
.call.out{opacity:.8;background:var(--card2)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.lastseat{text-align:center;padding:18px 12px;border:2px dashed var(--gold);background:var(--gold-bg)}
.lastseat .vs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cmt{border-left:3px solid var(--accent);background:var(--card);padding:8px 12px;margin:6px 0;border-radius:0 10px 10px 0;font-size:14px}
.cmt.angry{border-left-color:var(--bad)}
.cmt .h{font-size:11.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.grade{font-size:64px;font-weight:800;line-height:1;color:var(--gold);text-align:center;margin:8px 0}
.debut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:10px 0}
.debut-grid>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero{text-align:center;padding:10px 0}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.gsel button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:800;min-height:56px}
.gsel button.on{border-color:var(--accent);background:var(--card2);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--card2);border-radius:10px;padding:8px 12px;margin:8px 0}
.toast{background:var(--card2);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
.react{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--card2)}
.big-num{font-size:34px;font-weight:800;text-align:center;line-height:1.2}
ul.tight{margin:6px 0;padding-left:20px}
.facerow{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.budget{display:flex;justify-content:space-between;align-items:center;background:var(--gold-bg);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;margin:10px 0;font-size:14px}
.budget b{font-size:20px}
.pickrow{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.pk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;width:66px;font-size:11.5px}
.pk span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk em{font-style:normal;color:var(--muted);font-size:10.5px}
.pk.on{border-color:var(--accent);background:var(--card2);font-weight:800}
.trow{display:flex;align-items:center;gap:8px;padding:4px 0}
.trow .nm2{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-width:40px;min-height:34px;font-weight:800}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0}
.act{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:2px}
.act.on{border-color:var(--accent);background:var(--card2)}
.actb{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;min-height:64px}
.actb:disabled{opacity:.45}
.actb b{display:block;font-size:14px}
.actb .cost{float:right;font-weight:800;color:var(--gold);font-size:13px;margin-top:-20px}
.act .acts,.act .pickrow{padding:0 8px 8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:14px}
.row .btn-s:disabled{opacity:.45}
.seg{display:flex;gap:4px;flex:none}
.seg button{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-height:38px;min-width:46px;font-size:12px;padding:0 6px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:800}
.seg button.pass.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
.jrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.jrow .mid{flex:1;min-width:0}
.jrow .nm{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.feat{border:1px solid var(--line);background:var(--card2);border-radius:8px;min-height:32px;font-size:11.5px;padding:0 8px;flex:none}
.feat.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:800}
.choice.sel{border:2px solid var(--accent);background:var(--card)}
img.face[data-a]{cursor:pointer}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,12,35,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(40px + env(safe-area-inset-top,0px))}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:100%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.sheet .close{position:sticky;top:0;float:right;z-index:2}
.ptop{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.ptop>div{flex:1;min-width:180px}
.pname{font-size:20px;font-weight:800}
.prow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.prow>span:last-child{flex:1;min-width:0}
.pl2{flex:none;width:68px;color:var(--muted);font-size:12px;font-weight:700;padding-top:2px}
.spark{display:flex;align-items:flex-end;gap:6px;height:58px}
.spark i{display:block;width:24px;background:var(--accent);border-radius:4px 4px 0 0;position:relative}
.spark i.rest{background:var(--line)}
.spark i em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-style:normal;font-size:10.5px;color:var(--muted)}
.rel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;margin:0 4px 4px 0;font-size:13px;font-weight:700}
.rel small{font-weight:400;color:var(--muted);margin-left:4px}
ul.log li{margin:3px 0}
.epi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.epi:last-child{border-bottom:none}
.ap{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.ap i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.ap i.on{background:var(--accent)}
.trow2{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.trow2 .mid{flex:1;min-width:0}
.trow2 .nm{font-size:14.5px}
.trow2 .seg button:disabled{opacity:.4}
.card.req{border-left:4px solid var(--gold)}
.req .top{display:flex;gap:10px;align-items:center}
.req .who{flex:1;min-width:0}
.memo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 0 6px}
.stagec{background:radial-gradient(ellipse 70% 50% at 50% -8%,rgba(255,236,190,.4),transparent 70%),linear-gradient(180deg,#261745,#0d0919);color:#f4effd;border-radius:18px;padding:16px;margin:10px 0;position:relative;overflow:hidden}
.stagec .ttl{font-size:12px;letter-spacing:.14em;color:#e9ba4b;font-weight:800}
.stagec h2{color:#fff}
.stagec .who{text-align:center;margin:8px 0}
.stagec .who .face{margin:0 auto;border-color:#e9ba4b}
.stagec .facerow .face{margin:0}
.stagec .song{font-size:12.5px;color:#cfc3ee;margin:2px 0}
.pname2{font-size:19px;font-weight:800;margin-top:6px}
.beats p{opacity:0;animation:fadeup .5s ease-out forwards;margin:7px 0;font-size:15px}
.live{min-height:40px;margin:6px 0}
.live div{opacity:0;animation:fadeup .4s ease-out forwards;font-size:12.5px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px 9px;margin:3px 4px 3px 0;display:inline-block}
.live small{opacity:.6}
.gauge{height:12px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 2px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0709c,#e9ba4b);animation:gfill 1.2s ease-out forwards}
.scorepop{font-size:46px;font-weight:800;text-align:center;opacity:0;animation:pop2 .5s ease-out forwards;color:#ffe08a;line-height:1.15;margin-top:6px}
.scorepop small{font-size:16px;margin-left:2px}
.hl{display:inline-block;background:#e9ba4b;color:#1c1330;font-weight:800;border-radius:6px;padding:0 8px;font-size:13px;vertical-align:middle}
.judge{text-align:center;opacity:0;animation:fadeup .4s forwards;color:#e6dcff;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;opacity:0;animation:fadeup .4s forwards}
.chips span{background:rgba(255,255,255,.12);border-radius:999px;padding:1px 9px;font-size:12px}
.featrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}
.stagec .btn-s{background:rgba(255,255,255,.1);color:#f4effd;border-color:rgba(255,255,255,.28)}
.stagec .btn-s.on{background:#e9ba4b;color:#1c1330;border-color:#e9ba4b;font-weight:800}
.stagec .btn-s:disabled{opacity:.4}
.pen{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pen i{width:6px;height:20px;border-radius:3px;animation:bob 1.1s ease-in-out infinite;opacity:.9}
.noanim .beats p,.noanim .live div,.noanim .gauge i,.noanim .scorepop,.noanim .judge,.noanim .chips{animation-delay:0s!important;animation-duration:.01s!important}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes gfill{to{width:var(--w)}}
@keyframes pop2{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.stagec *{animation-delay:0s!important;animation-duration:.01s!important;animation-iteration-count:1!important}}
.choice .hint{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.tone{font-size:12px;letter-spacing:.02em;font-weight:800;border-radius:5px;padding:0 6px;color:#fff}
.t-s{background:#11704c}.t-h{background:#a82a39}.t-a{background:#9a5205}.t-f{background:#2253a8}
.hp{font-size:12px;border-radius:5px;padding:0 6px;border:1px solid var(--line)}

function makeRecap(S){var A=S.tr.filter(function(t){return t.snap&&(t.status==='alive'||t.status==='debut');});
  var grow=A.map(function(t){return {id:t.id,d:(t.st.v+t.st.d+t.st.r+t.st.e)-t.snap.sk};}).sort(function(a,b){return b.d-a.d;}).filter(function(x){return x.d>=2;}).slice(0,3);
  var down=A.map(function(t){return {id:t.id,d:t.conf-t.snap.conf};}).sort(function(a,b){return a.d-b.d;}).filter(function(x){return x.d<=-8;}).slice(0,2);
  var nx=ROUNDS[S.rnd+1],fit=[];
  if(nx&&!ROUNDS[S.rnd].fin){var w=nx.w,al=S.tr.filter(function(t){return t.status==='alive';});
    fit=al.map(function(t){var v;if(w==='spec'){var k=t.spec==='t'?bestVDR(t)[0]:t.spec;v=t.st[k]*.7+t.st.e*.3;}else if(w==='pos'||w==='all'){var o=bestVDR(t);v=t.st[o[0]]*.5+t.st[o[1]]*.25+t.st.e*.25;}else{v=0;for(var k2 in w)v+=t.st[k2]*w[k2];}return {id:t.id,v:v};}).sort(function(a,b){return b.v-a.v;}).slice(0,3);}
  S.recap={grow:grow,down:down,fit:fit,next:nx&&!ROUNDS[S.rnd].fin?nx.name:null};}

  if(a!=='reset'&&ui.resetArm){ui.resetArm=false;}
  if(ui.prof!=null&&a!=='prof'&&a!=='profclose'&&a!=='noop'){ui.prof=null;}
  switch(a){
    case 'g':ui.g=v;render();break;
    case 'new':stopTimer();ui.prof=null;S=newGame(ui.g,ui.diff);ui.filter='all';save();render();window.scrollTo(0,0);break;

    case 'showfast':ui.showFast=!ui.showFast;ui.showKey=null;try{HStore.set('hikari7_showfast',ui.showFast?'1':'');}catch(e){}render();break;
    case 'watch':go(function(){watchVideo(S,id);});break;
