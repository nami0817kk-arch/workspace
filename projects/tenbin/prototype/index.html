<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もじつみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link href="fonts/kana.css" rel="stylesheet">
<style>
:root{
  --bg:#f4ede1; --panel:#fffaf1; --ink:#3b2f24; --sub:#8a7663; --line:#e2d6c2;
  --accent:#d9472f; --accent2:#f2a33a; --ok:#2f9a5c; --scrim:rgba(52,38,24,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --panel:#2a2520; --ink:#f1e8da; --sub:#b3a493; --line:#40382f;
    --accent:#ee6a50; --accent2:#f2b24f; --ok:#5fb77f; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a17; --panel:#2a2520; --ink:#f1e8da; --sub:#b3a493; --line:#40382f;
  --accent:#ee6a50; --accent2:#f2b24f; --ok:#5fb77f; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* .items の display:grid が hidden に勝って、結果画面でもアイテムの段が残っていた */
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus:not(:focus-visible){outline:none}
.app{max-width:440px;margin:0 auto;padding:10px 16px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:19px;margin:0;letter-spacing:.04em;font-weight:800;white-space:nowrap}
h1 span{color:var(--accent)}
.hbtn{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 11px;font-size:12px;line-height:1;white-space:nowrap}
.chip.off{color:var(--sub);text-decoration:line-through}
.chip b{color:var(--accent)}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#efe7d8;touch-action:none;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px rgba(80,50,20,.08)}
canvas{display:block;width:100%;height:auto;touch-action:none}
.bar{display:flex;align-items:center;gap:10px;margin-top:10px}
.next{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 6px 4px 10px;writing-mode:horizontal-tb}
.next canvas{width:108px;height:40px}
.hint{flex:1;min-width:0;font-size:11px;color:var(--sub);line-height:1.45}
.rot{font-size:17px;font-weight:800;border:0;border-radius:16px;padding:14px 18px;background:var(--accent);color:#fff;min-width:100px;
  box-shadow:0 3px 0 rgba(0,0,0,.18)}
@media (max-width:430px){.hint{display:none}.bar{justify-content:space-between}}
.items{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.items button.vid{background:var(--ok);color:#fff;border-color:var(--ok)}
.items button.vid small{color:#e6f5ea}
.items button{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 2px;font-size:14px;font-weight:800;line-height:1.2}
.items button small{display:block;font-size:9px;font-weight:400;color:var(--sub)}
.items button b{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px}
.items button:disabled{opacity:.4}
.items button.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 0;font-weight:700;font-size:13px}
.seg button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.rot.back{min-width:0;padding:14px 13px;background:var(--panel);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.bar .rot.back{margin-left:auto;margin-right:-4px}
.rot:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
/* 重ねる画面（はじめ・けっか・ことば帳） */
.sheet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:16px}
.sheet.show{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:18px;padding:18px 16px 16px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.card h2{margin:0 0 2px;font-size:19px}
.card p{margin:4px 0;font-size:13px;color:var(--sub);line-height:1.6}
.big{font-size:60px;font-weight:800;line-height:1;margin:6px 0 0}
.big small{font-size:20px}
.big.sm{font-size:46px}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}
/* 中身が長くても、ボタンの段はカードの下にいつも見える */
.card > .row:last-child,.card .dict > .row:last-child{position:sticky;bottom:-16px;background:var(--panel);margin:12px -16px -16px;padding:10px 16px 16px;box-shadow:0 -8px 12px -8px rgba(0,0,0,.12)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;background:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.plats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.plats button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px 6px;font-size:14px;font-weight:700;line-height:1.25}
.plats button small{display:block;font-size:11px;font-weight:400;color:var(--sub)}
.plats button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.plats button.lock,.themes button.lock{opacity:.55;cursor:default}
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.themes button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 0;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;white-space:nowrap}
.themes button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.dots{display:flex;gap:1px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
.unlock{font-weight:700;color:var(--accent) !important;margin-top:8px !important}
.revive{background:var(--bg);border:2px solid var(--accent2);border-radius:14px;padding:10px;margin:10px 0 4px}
.revive .btn{width:100%;background:var(--ok)}
.ad{display:flex;flex-direction:column;align-items:center;gap:8px}
.ad .ring{width:72px;height:72px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--ok);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;max-height:120px;overflow:auto}
.w{font-family:TenbinKana,"M PLUS Rounded 1c",sans-serif;font-weight:900;font-size:16px;border-radius:10px;padding:5px 9px;background:var(--bg);border:1px solid var(--line)}
.w.new{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
.w.new::after{content:"あたらしい";display:block;font:700 9px "M PLUS Rounded 1c",sans-serif;color:var(--accent)}
.w .pt{display:block;font:700 10px "M PLUS Rounded 1c",sans-serif;color:var(--ok)}
.w.lock{color:var(--sub);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:400;letter-spacing:2px}
.badge{display:inline-block;background:var(--accent2);color:#3b2f24;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;margin-top:6px}
.dict .words{max-height:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar2{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 0}.bar2 i{display:block;height:100%;background:var(--ok)}
.credits{text-align:left}.credits p{font-size:11px}
.coach{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(59,47,36,.82);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;animation:fade .3s}
.dict h3{font-size:13px;color:var(--sub);margin:12px 0 0;font-weight:700}
</style></head><body>
<div class="app">
  <header>
    <h1>もじ<span>つみ</span></h1>
    <div class="hbtn">
      <button class="chip" id="pauseBtn" hidden aria-label="一時停止">とめる</button>
      <button class="chip" id="soundBtn" aria-label="音のオンとオフ">おと</button>
      <button class="chip" id="dictBtn">ことば帳 <b id="dictN">0</b></button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="400" height="560" role="img" aria-label="ゲームの画面。ひらがなを積む台"></canvas>
    <div class="sheet" id="sheet"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
    <div class="sr" id="live" aria-live="polite"></div>
    <div class="coach" id="coach" hidden></div>
  </div>
  <div class="items" id="items" hidden></div>
  <div class="bar" id="bar">
    <div class="next"><span>つぎ</span><canvas id="nextCv" width="216" height="80" role="img" aria-label="つぎの字"></canvas></div>
    <div class="hint" id="hint">なぞって、はなすと落ちる</div>
    <button class="rot back" id="rotL" aria-label="持っている字を左に45度まわす">↺</button><button class="rot" id="rot" aria-label="持っている字を右に45度まわす">まわす</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="decomp.min.js"></script>
<script src="glyphs.js"></script>
<script src="words.js"></script>
<script src="core.js"></script>
<script src="monetization.js"></script>
<script>
(function () {
  var C = TenbinCore, W = C.W, G = C.GLYPHS;
  var VIEW_H = 560, BASE_TOP = C.GROUND + 30 - VIEW_H, M_PER_PX = 0.01;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), nextCv = document.getElementById('nextCv');
  var sheet = document.getElementById('sheet'), card = document.getElementById('card'), hint = document.getElementById('hint');
  // 字の色。ことば帳に集めた数で開く
  var THEMES = [
    { key: 'base', name: 'いつもの', need: 0, ink: ['#d9472f', '#e98a1f', '#2f9a5c', '#2f6fc2', '#7b4fc0', '#d8508f', '#1f9a9a', '#b5552a'] },
    { key: 'sakura', name: 'さくら', need: 30, ink: ['#e2577f', '#f08aa8', '#c9476e', '#e98fae', '#d86a8f', '#b84a6a'] },
    { key: 'umi', name: 'うみ', need: 70, ink: ['#2f6fc2', '#1f9a9a', '#4b8fd8', '#2a5aa0', '#3fb0c8', '#5577cc'] },
    { key: 'mori', name: 'もり', need: 150, ink: ['#2f9a5c', '#5a9a2f', '#3e7a48', '#6fae4f', '#2a8070', '#7a9a3a'] },
    { key: 'sumi', name: 'すみ', need: 250, ink: ['#3b2f24', '#5a4a3a', '#2a2420', '#4a3f36', '#6a5848'] },
    { key: 'kin', name: 'きんいろ', need: 400, ink: ['#c8961e', '#e0ad2c', '#b5832a', '#d9a441', '#caa23a'] }
  ];
  // 台も、ことば帳に集めた数で開く（ふつう→てんびん→さか→ふたつ→ゆらゆら→せまい）
  var PLAT_NEED = { flat: 0, seesaw: 10, slope: 25, twin: 50, sway: 90, narrow: 140 };
  var PLAT_ORDER = ['flat', 'seesaw', 'slope', 'twin', 'sway', 'narrow'];
  var INK = THEMES[0].ink;
  function inkOf(ch) { return INK[C.KINDS.indexOf(ch) % INK.length]; }

  // --- 保存（端末の中だけ。読めなくても遊べる） ---
  var store = { get: function (k, d) { try { var v = localStorage.getItem('tenbin-kana-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('tenbin-kana-' + k, JSON.stringify(v)); } catch (e) {} } };
  // 壊れた値・古い形の値が入っていても遊べるように、型を確かめてから使う
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  var bests = obj(store.get('bests2', {})), dict = obj(store.get('dict', {})), plat = String(store.get('plat', 'flat')), muted = store.get('muted', false) === true;
  var theme = String(store.get('theme', 'base')), useItems = store.get('items', true) !== false;
  // 記録はアイテムの あり／なし で分ける（使った点と使わない点を混ぜない）
  function bkey(k) { return (k || plat) + (useItems ? '+i' : ''); }
  function themeOf(k) { return THEMES.filter(function (t) { return t.key === k; })[0] || THEMES[0]; }
  function isOpenPlat(k) { return dictCount() >= PLAT_NEED[k]; }
  function isOpenTheme(t) { return dictCount() >= t.need; }
  if (!C.PLATFORMS[plat]) plat = 'flat';
  var ALL_WORDS = C.WORDS.short.concat(C.WORDS.middle, C.WORDS.long);
  // ことば帳の数は、いまの単語表にあることばだけ数える（表から外したことばで台がひらかないように）
  var WORD_SET = {}; ALL_WORDS.forEach(function (w) { WORD_SET[w] = 1; });
  function dictCount() { var n = 0; for (var w in dict) if (WORD_SET[w]) n++; return n; }
  if (!isOpenPlat(plat)) plat = 'flat';
  if (!isOpenTheme(themeOf(theme))) theme = 'base';
  INK = themeOf(theme).ink;
  // 次に開くもの（ことば帳とはじめの画面に出す）
  function nextUnlock() {
    var n = dictCount(), list = [];
    PLAT_ORDER.forEach(function (k) { if (PLAT_NEED[k] > n) list.push({ need: PLAT_NEED[k], text: '「' + C.PLATFORMS[k].name + '」の台' }); });
    THEMES.forEach(function (t) { if (t.need > n) list.push({ need: t.need, text: '字の色「' + t.name + '」' }); });
    list.sort(function (a, b) { return a.need - b.need; });
    return list[0] ? 'あと ' + (list[0].need - n) + '語で ' + list[0].text + 'がひらく' : 'ぜんぶ ひらいた！';
  }

  // --- 音（Web Audio でその場で鳴らす） ---
  var ac = null;
  function audio() { if (muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state !== 'running') { try { ac.resume(); } catch (e) {} } return ac; }   // iOS は電話などのあと 'interrupted' になる
  // 音を重ねても割れないよう、全部をひとつのコンプレッサーに通す
  var out = null;
  function outNode(a) { if (!out) { try { out = a.createDynamicsCompressor(); out.threshold.value = -14; out.ratio.value = 6; out.connect(a.destination); } catch (e) { out = a.destination; } } return out; }
  function tone(freq, dur, type, vol, when, slide) {
    var a = audio(); if (!a) return; var t = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain(); o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(outNode(a)); o.start(t); o.stop(t + dur + 0.02);
  }
  var SND = {
    land: function (mass, speed) { var f = 520 / Math.sqrt(mass); tone(f, 0.09, 'sine', Math.min(0.28, 0.08 + speed * 0.03), 0, f * 0.6); tone(f * 2.02, 0.05, 'triangle', 0.05); },
    rot: function () { tone(1400, 0.03, 'square', 0.03); },
    word: function (len) { [0, 4, 7, 12, 16, 19, 24].slice(0, 2 + (len || 2)).forEach(function (n, i) { tone(523 * Math.pow(2, n / 12), 0.22, 'triangle', 0.16, i * 0.07); }); },
    fail: function () { tone(330, 0.5, 'sawtooth', 0.08, 0, 110); tone(220, 0.6, 'sine', 0.12, 0.05, 80); },
    record: function () { [0, 4, 7, 12, 16].forEach(function (n, i) { tone(587 * Math.pow(2, n / 12), 0.3, 'triangle', 0.14, i * 0.09); }); }
  };
  function drawSoundBtn() { var el = document.getElementById('soundBtn'); el.textContent = 'おと'; el.className = 'chip' + (muted ? ' off' : ''); el.setAttribute('aria-pressed', String(!muted)); }
  document.getElementById('soundBtn').onclick = function () { muted = !muted; store.set('muted', muted); drawSoundBtn(); if (!muted) SND.rot(); };
  drawSoundBtn();

  // 手ごたえの振動（使える端末だけ。音を切っていても振動は残す）。アプリでは HapticFeedback に置きかえる
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  // 動きを減らす設定の人には、揺れ・光・粒を控える
  var calm = false; try { var mq = window.matchMedia('(prefers-reduced-motion: reduce)'); calm = mq.matches; mq.addEventListener && mq.addEventListener('change', function () { calm = mq.matches; }); } catch (e) {}
  // --- 字の絵（当たり判定と同じ字形） ---
  // 字は毎回 文字として描くと重い（縁取り・光・影で3回描く）。画面の倍率ごとに一度だけ絵にして使い回す
  var SPRITE = {}, SPR = 128, ctxScale = 1, fontsReady = false;
  function sprite(ch, k) {
    var key = ch + '|' + inkOf(ch) + '|' + k.toFixed(3), c = SPRITE[key];
    if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = Math.ceil(SPR * k);
    var g = c.getContext('2d'); g.setTransform(k, 0, 0, k, SPR * k / 2, SPR * k / 2);
    glyphPaint(g, ch);
    return (SPRITE[key] = c);
  }
  function glyphPaint(g, ch) {
    g.font = '900 ' + G.size + 'px ' + G.font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = 3.5; g.strokeStyle = 'rgba(70,45,20,.6)'; g.strokeText(ch, 0, 1.5);
    g.fillStyle = inkOf(ch); g.fillText(ch, 0, 0);
    g.globalAlpha *= 0.28; g.fillStyle = '#fff'; g.save(); g.beginPath(); g.rect(-50, -50, 100, 40); g.clip(); g.fillText(ch, 0, 0); g.restore();
  }

      g.globalAlpha = alpha == null ? 1 : alpha;
      if (glow) { g.shadowColor = 'rgba(255,214,90,' + glow + ')'; g.shadowBlur = 22 * glow * ctxScale; }

      g.restore(); return;
    }
    g.save(); g.translate(ox, oy); g.rotate(ang); if (sx) g.scale(sx, sy);
    g.globalAlpha = alpha == null ? 1 : alpha;

      g.fillStyle = bg; roundRect(g, -65, -6, 130, 12, 3); g.fill(); g.strokeStyle = '#8f5a2a'; g.lineWidth = 1.5; roundRect(g, -65, -6, 130, 12, 3); g.stroke();
      g.strokeStyle = 'rgba(110,60,20,.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-60, 0); g.lineTo(60, 0); g.stroke();
      g.restore(); return;
    }
    g.font = '900 ' + G.size + 'px ' + G.font; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (glow) { g.shadowColor = 'rgba(255,214,90,' + glow + ')'; g.shadowBlur = 22 * glow; }
    g.lineJoin = 'round'; g.lineWidth = 3.5; g.strokeStyle = 'rgba(70,45,20,.6)'; g.strokeText(ch, 0, 1.5);
    g.shadowBlur = 0; g.fillStyle = inkOf(ch); g.fillText(ch, 0, 0);
    g.globalAlpha *= 0.28; g.fillStyle = '#fff'; g.save(); g.beginPath(); g.rect(-50, -50, 100, 40); g.clip(); g.fillText(ch, 0, 0); g.restore();
    g.restore();
  }
  window.__drawAt = function (g, ch, x, y, a, al) { drawGlyph(g, ch, x, y, a, al); };
  function drawBody(g, b) {
    var o = C.OFFSET[b.kind], c = Math.cos(b.angle), s = Math.sin(b.angle), sq = b.squash || 0;
    drawGlyph(g, b.kind, b.position.x - (o.x * c - o.y * s), b.position.y - (o.x * s + o.y * c), b.angle, 1, b.glow || 0, 1 + 0.1 * sq, 1 - 0.12 * sq);

    });
  }
  var ads = new TenbinMoney.FakeAds({ mode: store.get('adMode', 'normal'), present: presentAd });
  var money = new TenbinMoney.Money(moneyPrefs, ads, new TenbinMoney.FakeStore(), { isForeground: function () { return document.visibilityState !== 'hidden'; } });
  money.start();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') money.refresh(); });
  var GATE_MSG = { cancelled: '', declined: '最後まで見ると もらえます', unavailable: 'いまは動画を読み込めません。少しあとで ためしてください', showFailed: '動画を出せませんでした。少しあとで ためしてください' };
  // 動画を見てごほうび。ごほうびは画面の状態を見ずに必ず渡す（docs/app-pitfalls.md の2）
  function rewardThen(onGranted, onOther) {
    var back = phase, cancelled = false; phase = 'ad';
    // 読み込みを待つ間（最長6秒）も「やめる」で戻れる
    money.beforeReward(function () {
      showSheet('<div class="ad"><div class="ring"></div><h2>動画を読み込み中…</h2><p>少しだけ まってください</p><button class="btn sec" id="adCancel">やめる</button></div>');
      document.getElementById('adCancel').onclick = function () { cancelled = true; phase = back; onOther(''); };
    }, function () { return cancelled; })
      .then(function (gate) { if (cancelled) return; phase = back; if (gate === 'granted') onGranted(); else onOther(GATE_MSG[gate] || ''); });
  }
  // 使わせてもらっているもの（ライセンスの表示）
  function showCredits() {
    showSheet('<div class="credits"><h2 style="text-align:center">クレジット</h2>' +
      '<p><b>もじつみ</b> © つるはし社</p>' +
      '<p><b>字形</b>: M PLUS Rounded 1c（© The Rounded M+ Project Authors）SIL Open Font License 1.1</p>' +
      '<p><b>ことば</b>: wordfreq（Robyn Speer）の頻度データ（CC BY-SA 4.0）で選び、UniDic（UniDic Consortium・BSD ライセンス）で品詞と読みを確かめた。ことばの一覧は CC BY-SA 4.0 で扱います</p>' +
      '<p><b>物理</b>: matter.js（Liam Brummitt・MIT）／ poly-decomp.js（Stefan Hedman・MIT）</p>' +
      '<div class="row"><button class="btn" id="close">とじる</button></div></div>');
    document.getElementById('close').onclick = showMenu;
  }
  function showDict() {
    // 開いている間にもう一度押されたら何もしない（2度目で「遊んでいなかった」扱いになり、はじめの画面へ飛んでいた）
    // 広告の待ち中も開かない（待ちの時計が裏で進み、閉じたあとの画面が食い違う）
    if (phase === 'pause' || phase === 'ad') return;
    // 崩れていく途中（結果がまだ出ていない）は開かない。閉じたときに結果が先に出て、あとでもう一度出ていた
    if (phase === 'end' && endTimer > 0) return;
    var wasPlay = phase === 'play'; if (wasPlay) phase = 'pause';
    // 五十音の順に並べる。集めた割合を棒で
    function list(title, arr) { arr = arr.slice().sort(function (a, b) { return a.localeCompare(b, 'ja'); }); var got = arr.filter(function (w) { return dict[w]; }).length;
      return '<h3>' + title + '（' + got + '/' + arr.length + '）</h3><div class="bar2"><i style="width:' + (100 * got / arr.length).toFixed(1) + '%"></i></div><div class="words">' +
      // まだのことばは数だけ（2000語ぶんの「・・」の箱が並ぶと、集めたことばが埋もれた）
      arr.filter(function (w) { return dict[w]; }).map(function (w) { return '<span class="w">' + w + '</span>'; }).join('') +
      (got < arr.length ? '<span class="w lock">まだ ' + (arr.length - got) + '語</span>' : '') + '</div>'; }
    showSheet('<div class="dict"><h2>ことば帳</h2><p>くっつけてできたことばが ここに入る。' + dictCount() + ' / ' + ALL_WORDS.length + '</p><p class="unlock">' + nextUnlock() + '</p>' +
      list('2字', C.WORDS.short) + list('3字', C.WORDS.middle) + list('4字より長い', C.WORDS.long) +
      '<div class="row"><button class="btn" id="close">とじる</button></div></div>');
    document.getElementById('close').onclick = function () { if (wasPlay) { phase = 'play'; hideSheet(); } else if (phase === 'end') showResult(); else showMenu(); };
  }
  document.getElementById('dictBtn').onclick = showDict;
  // 一時停止（ボタン・Esc・アプリが裏に回ったとき）
  var pauseBtn = document.getElementById('pauseBtn');
  function showPause() {
    if (phase !== 'play') return;
    phase = 'pause'; pointer.active = false;
    showSheet('<h2>ひとやすみ</h2><p>' + s.points + '点・' + s.score + '字</p>' +
      '<div class="row" style="flex-direction:column"><button class="btn" id="resume">つづける</button>' +
      '<button class="btn sec" id="retry">はじめから</button><button class="btn sec" id="toMenu">台をえらぶ画面へ</button></div>' +
      (matchMedia('(hover: hover)').matches ? '<p style="font-size:11px">キーボード: ←→ 動かす（Shift で細かく）・↑/E と Q でまわす・スペースで落とす・Esc でとめる</p>' : ''));
    document.getElementById('resume').onclick = function () { phase = 'play'; hideSheet(); };
    document.getElementById('retry').onclick = function () { saveBest(); start(); };
    document.getElementById('toMenu').onclick = function () { saveBest(); showMenu(); };
  }
  pauseBtn.onclick = showPause;
  // 裏に回ったら止めて、記録も残しておく（そのままアプリを終了されても消えない）
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { if (phase === 'play' || phase === 'pause') saveBest(); showPause(); } });
  document.getElementById('dictN').textContent = dictCount();

  // --- 進行 ---
  function tick() {
    frameN++;
    if (phase === 'play') {
      C.step(s); handleEvents();
      if (s.failed) { phase = 'end'; endTimer = 110; shake = 9; SND.fail(); buzz([40, 60, 80]); }
    } else if (phase === 'end') {
      // 崩れていく様子をゆっくり見せる
      // 結果画面が出たら物理は止める（出たあとも回り続けて電池を使っていた）
      if (endTimer > 0) { if (endTimer % 2 === 0) C.physics(s); if (--endTimer === 0) showResult(); }
    }
  }
  var acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(100, now - last); last = now;
    var n = 0; while (acc >= C.DT && n < 5) { tick(); acc -= C.DT; n++; }
    if (n === 5) acc = 0;
    render(); requestAnimationFrame(frame);
  }
  function toWorldX(e) { var r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
  // 指を置いた位置ではなく、動かした分だけ字が動く（指で字を隠さない）
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (phase !== 'play') return; audio();
    pointer.active = true; dragFrom = { px: toWorldX(e), x: pointer.x };
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  });
  cv.addEventListener('pointermove', function (e) {
    if (!pointer.active || phase !== 'play') return;
    var hp = holdPos(); pointer.x = C.clampX(hp.kind, ang, dragFrom.x + (toWorldX(e) - dragFrom.px) * 1.2);
  });
  cv.addEventListener('pointerup', function () {
    if (!pointer.active) return; pointer.active = false;
    dropNow();
  });
  cv.addEventListener('pointercancel', function () { pointer.active = false; });
  function rotate(dir) {
    if (phase !== 'play') return;
    ang += dir * C.ROT_STEP;
    if (ang >= Math.PI * 2 - 1e-6) { ang -= Math.PI * 2; visAng -= Math.PI * 2; }
    if (ang < -1e-6) { ang += Math.PI * 2; visAng += Math.PI * 2; }
    pointer.x = holdPos().x; SND.rot(); preview.key = '';
  }
  document.getElementById('rot').onclick = function () { rotate(1); };
  document.getElementById('rotL').onclick = function () { rotate(-1); };

  // キーボード（パソコンで遊ぶとき）: ←→ で動かす（Shift で細かく）、↑ か R でまわす、スペース・↓・Enter で落とす
  function dropNow() { if (phase === 'play' && C.canDrop(s)) { audio(); var hp = holdPos(); C.drop(s, hp.x, ang); ang = visAng = 0; drawNext(); drawItems(); } }
  document.addEventListener('keydown', function (e) {
    // はじめの画面は Enter で はじめる、結果は Enter で もう一度（ボタンに枠が当たっているときはそのボタン）
    if (e.key === 'Enter' && (phase === 'menu' || (phase === 'end' && !endTimer)) && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
      var def = document.getElementById(phase === 'menu' ? 'go' : 'again'); if (def) { def.click(); e.preventDefault(); return; }
    }
    if (e.key === 'Escape' && phase === 'pause' && document.getElementById('resume')) { document.getElementById('resume').onclick(); return; }
    if (phase !== 'play') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { showPause(); e.preventDefault(); return; }
    var k = e.key, step = e.shiftKey ? 2 : 8;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { pointer.x = C.clampX(C.current(s), ang, pointer.x + (k === 'ArrowLeft' ? -step : step)); }
    else if (k === 'ArrowUp' || k === 'r' || k === 'R' || k === 'e' || k === 'E') rotate(1);
    else if (k === 'q' || k === 'Q') rotate(-1);
    else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') dropNow();
    else return;
    e.preventDefault();
  });

  // 字形が読み込まれる前に描くと、当たり判定と見た目がずれる
  var ready = document.fonts && document.fonts.load ? document.fonts.load('900 72px ' + G.font, C.KINDS.join('')) : Promise.resolve();
  ready.catch(function () {}).then(function () { fontsReady = true; s = C.create(null, plat); drawNext(); showMenu(); requestAnimationFrame(frame); });
})();
</script>
</body></html>
