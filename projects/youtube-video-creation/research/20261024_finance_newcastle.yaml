# クラブの財政：ニューカッスル・ユナイテッド（10/24 土、シリーズ「クラブの財政」、key: finance_newcastle、型は news）。
#
# 軸は「**買収後の4年で初めての黒字（3470万ポンド）は、何で生まれたのか。処分益1億3320万ポンドを除くと、約9840万ポンドの赤字（分析記事の試算）。リーグの規則（3年で最大1億500万ポンド）とどう向き合うのか**」。
#   ・デロイト Football Money League 2026（2024/25）：17位、収入 3億9840万ユーロ（+7%）。16位ユヴェントス 4億170万、18位シュトゥットガルト 2億9630万。
#   ・クラブ公式（2026-03-31、2025年6月期）：収入 3億3530万ポンド（過去最高、前の年から+1500万）、税引後 3470万ポンドの黒字（前の年は1110万の赤字＝報道）、商業収入 +44%、
#     処分益（profit on disposal）1億3320万ポンド＝2025-26で少し調整される。
#   ・クラブ公式に無い内訳（試合日・メディア・商業・UEFA・人件費・営業費用・処分益の中身）は ESK の分析記事（決算書の読み）と Sportcal（クラブの発表の報道）。
#   ★他の財政回（バルサ・シティ・アルテタ・レアル・PSG・バイエルン・リヴァプール・マンU・トッテナム・シティ×アーセナル・チェルシー・インテル・ヴィラ・ユヴェントス・アトレティコ・ミラン）の軸は繰り返さない。
#     この回の軸は「**黒字の中身（不動産の処分益）と、規則の物差し**」。
#   ★アルファベット（PSR・PZ・UEFA）は読み上げに出さない。女子・監督・選手の個人名・制裁の話はしない。選手の移籍金・給料の額は出さない。「違反した」と断定しない（分析記事の見方と書く）。
#
# **決算期**：6月30日決算。2024-25＝2025年6月期（決算書の公表は2026-03-31）。2025-26 の決算は未公表。
#
# **出どころ（読んだもの）**
#   ○ クラブ公式 https://www.newcastleunited.com/en/news/newcastle-united-announces-record-income（2026-03-31、WebFetch）
#       「turnover £335.3m, up £15m」「profit after tax of £34.7m」「44% rise in commercial revenue」「profit on disposal of £133.2m, which will be slightly adjusted in Financial Year 2026」。
#       試合日・メディア・費用・人件費・PSR は本文に無い。
#   ○ クラブ公式（2021-22 決算）https://www.newcastleunited.com/en/news/financial-results-for-year-ended-30-june-2022
#       「loss after tax of £70.7m」「revenues £180m from £140.2m」。
#   ○ クラブ公式（2022-23 決算）https://www.newcastleunited.com/en/news/newcastle-united-limited-announces-financial-results-for-year-ended-30-june-2023
#       「revenue rose 39% to £250.3m」「loss after tax of £73.4m」（当時の発表。翌年の報道は前年の赤字を71.8mと書く＝組み替えの可能性。台本は当時の発表の73.4を使う）。
#   ○ クラブ公式（2023-24 決算）https://www.newcastleunited.com/en/news/newcastle-united-announces-financial-results-for-the-year-ended-june-2024
#       「£320.3 million, up from £250.3 million」「+28%」「commercial +90%・matchday +32%」「return to the UEFA Champions League」。損益は本文に無い。
#       赤字 1110万ポンドは報道（Offaly Express／City AM／Arab News／Sportcal 等が一致）。
#   ○ ESK 分析 https://theesk.org/2026/04/14/the-analysis-series-analysis-of-newcastle-united-limited-financial-results-2024-2025/（WebFetch）
#       2024/25 対 2023/24（百万ポンド）：総収入 335.3/320.3、試合日 51.6/50.1、メディア（UEFA除く）161.1/154.0、商業 120.2/83.6、UEFA 0/29.8、人件費 243.5/218.7、償却と減損 99.9/97.5、税引後損益 +34.7/−11.1。
#       処分益 133.2＝スタジアムの leasehold improvements 129.0（PZ Holdings へ 172.1 で売却、帳簿 43.1）＋ストロベリー・プレイスの土地 4.2（17.1 で売却、帳簿 12.9）。
#       「処分益を除く税引前の赤字は約98.4」「処分益が無ければ PSR に抵触した可能性が高い」「PSR は3年で最大1億500万ポンド」。純債務の額は記事に無い。
#   ○ Sportcal https://www.sportcal.com/financial/stadium-sale-commercial-income-help-newcastle-post-first-profit-in-pif-era/
#       商業 83.6→120.1、試合日 50.1→51.6、メディア 154→161.1、営業費用 +53.4（+18%）→344.9（前年 291.5）。
#       クラブの説明：売却は不動産の整理（再開発か新スタジアムの可能性）のためで、PSR の遵守のためではない。
#   ○ Newcastle World（別の報道）https://www.newcastleworld.com/sport/football/newcastle-united/newcastle-united-news-st-james-park-6531441
#       クラブは控除できる費用と年度末までの選手の売却を入れれば PSR を守れていると見られる、という報道（検索結果の要約で確認。本文の全文は403で読めず）。
#   ○ Goal（Deloitte の数字の転載）https://www.goal.com/en-om/news/deloitte-football-money-league-2026/bltedf9c4b411ec7212 と
#     Deloitte 一次ページ（17位、前後は16位ユヴェントス・18位シュトゥットガルトを確認）：ニューカッスル €398.4m（+7%）。14位ヴィラ 450.2、15位ミラン 410.4、16位ユヴェントス 401.7、18位シュトゥットガルト 296.3。
#       プレミアの数：上位20のうち9（リヴァプール・シティ・アーセナル・マンU・トッテナム・チェルシー・ヴィラ・ニューカッスル・ウェストハム）。
#   ○ 買収の完了：2021-10-07（On the Money／Arab News の要約。クラブの2021-22決算の発表も「買収後の最初の決算」と書く）。サウジアラビアの公共投資基金が中心（City AM）。
#   × 確かめられなかったもの：Deloitte のニューカッスルの内訳（試合日・放映権・商業のユーロ）と前年の順位、2025-26 の決算、
#     決算の純債務、プレミアリーグの公式な PSR 判断、商業収入が増えた契約ごとの内訳、ポンドとユーロの換算（為替）、
#     Deloitte €398.4m とクラブ £335.3m の差の中身（通貨・集計範囲が違うので台本では並べない）、Deloitte の16位以下の数字は Goal 転載を一次ページの順位で確認した範囲。
#
# 自分で計算した数（検算済み）
#   デロイト 401.7−398.4＝3.3。398.4−296.3＝102.1。クラブ 335.3÷180.0＝1.863→約1.9倍。335.3−320.3＝15.0（+4.7%）。
#   商業 120.2−83.6＝36.6（+43.8%）。ユーロ除く収入：320.3−29.8＝290.5 → 335.3−290.5＝44.8。36.6÷44.8＝81.7%→約8割。商業の割合 120.2÷335.3＝35.8%、83.6÷320.3＝26.1%。
#   人件費 243.5−218.7＝24.8。243.5÷335.3＝72.6%、218.7÷320.3＝68.3%。営業費用 344.9−291.5＝53.4。53.4÷15.0＝3.56倍。344.9−335.3＝9.6。
#   処分益 129.0+4.2＝133.2。172.1−43.1＝129.0。17.1−12.9＝4.2。34.7÷133.2＝26%。98.4÷105＝93.7%→約94%。
#
