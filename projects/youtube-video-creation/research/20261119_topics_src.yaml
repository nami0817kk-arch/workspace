title: 11月19日のショート題材（Claude選）
lead: 森保ジャパン最終戦の翌日、選手たちの言葉を中心に日本人6本・海外4本を選びました。
note: 確認なしの運用（11/4〜）のため、Claude が選んだ結果です。日本人の題は 9〜17時の枠、海外は18時以降の枠。外した題：久保・堂安・田中・福田・伊東・森保の最終戦の言葉（11/18に扱い済み）／ルカク引退（扱い済み）／ギュレルの契約延長（9月に扱い済み）／ルーニーの告白（動画向きでない）／ハーランド（直近に重ねている）／高校選手権・J・女子。次点：プリシッチのバイシクル弾、上田綺世の復帰。
