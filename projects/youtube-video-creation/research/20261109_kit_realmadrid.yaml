- id: crest
  heading: 胸の紋章の王冠は、なぜ一度消えたのか
  bg: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1920年に称号「レアル」と王冠。1931年に共和国となり王冠が消え、紫の帯。1941年に王冠が戻る
  card: *crest
  say:
  - text: 胸の紋章にも、白と同じくらい長い歩みがあります。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: none
  - text: 最初の印は、1902年。クラブの頭文字を、組み合わせたものでした。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 1908年に、その頭文字が丸の中に入ります。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 1920年、国王アルフォンソ13世から、称号を授かります。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: 「王の」という意味の、レアルです。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: none
  - text: 紋章の上に、王冠が乗ったのは、このときです。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: none
  - text: ところが1931年4月、スペインは国王のいない共和国になります。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
  - text: 王冠は、紋章から消えました。代わりに入ったのが、斜めの紫の帯です。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card:
      <<: *crest
      highlight_row: 3
    emph: true
    callword: 王冠が消えた
  - text: 紫は、マドリードを含むカスティーリャ地方の色だ、という説がよく知られています。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
  - text: 王冠が戻ったのは、内戦のあとの1941年。いまの名前になったのも、この年です。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: 王冠が紋章から消えていたのは、10年でした。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
    emph: true
  - text: 紫の帯は、王冠が戻ったあとも残り、いまは青に近い色になっています。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: none
  sources:
  - https://www.realmadrid.com/static/sobre-el-real-madrid/historia/futbol/1911-1920
  - https://www.realmadrid.com/static/sobre-el-real-madrid/historia/futbol/1931-1940
  - https://www.realmadrid.com/static/sobre-el-real-madrid/historia/futbol/1941-1950
  - https://en.wikipedia.org/wiki/Real_Madrid_CF
  - https://es.wikipedia.org/wiki/Real_Madrid_Club_de_F%C3%BAtbol
- id: chest
  heading: 白い胸に、最初に入った名前は何だったのか
  bg: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1982年に初めての胸の名前、ザヌッシ。テカが9季、2001年からはクラブの公式サイトの名前も
  card: *chest
  say:
  - text: レアル・マドリードの白いシャツに、初めて会社の印が入ったのは1981年5月。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card: none
  - text: パリでのヨーロッパの決勝で、用具の会社、アディダスの3本線が、紫で入りました。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card: none
  - text: 胸に名前が入ったのは、翌年の1982年。イタリアの家電の会社、ザヌッシでした。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card:
      <<: *chest
      highlight_row: 0
    emph: true
    callword: 最初の胸はザヌッシ
  - text: 1985年からは、イタリアの乳製品の会社、パルマラット。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card:
      <<: *chest
      highlight_row: 1
  - text: ただ、当時のヨーロッパの大会では、シーズン途中に胸の広告を替えられません。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: そのため、ヨーロッパの3試合では、パルマラットを付けられませんでした。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: 1992年からは、スペインの台所の設備の会社、テカが9シーズン。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card:
      <<: *chest
      highlight_row: 3
  - text: 変わっているのは、2001年からの1シーズンです。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: 胸に入れたのは、クラブ自身の、公式サイトの名前でした。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card:
      <<: *chest
      highlight_row: 4
    emph: true
  - text: そのあとは、電機のシーメンス、ネットの会社のビーウィンと続きます。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card:
      <<: *chest
      highlight_row: 6
  - text: そして2013年。胸に入ったのが、ドバイの航空会社、エミレーツです。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card:
      <<: *chest
      highlight_row: 7
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Real_Madrid_Club_de_F%C3%BAtbol
  - https://en.wikipedia.org/wiki/Real_Madrid_CF
- id: now
  heading: 今季の白いシャツには、何が起きているのか
  bg: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
  tier: 背景
  narrator: 解説
  telop: エミレーツは今季で14季目。2031年までの延長で、ラ・リーガでいちばん長いシャツのスポンサーに
  say:
  - text: エミレーツの胸は、今季で14シーズン目。テカの9シーズンを超えました。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: none
  - text: 2026年6月、クラブは、この契約を2031年まで延ばすと発表します。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: *emirates
  - text: クラブによれば、ラ・リーガの歴史で、いちばん長いシャツのスポンサーになります。
    image: assets/images/20261109_kit_realmadrid/p_ronaldo_w.jpg
    card: *emirates
    emph: true
    callword: ラ・リーガで最長
  - text: 2024年2月には、初めて袖にも名前が入りました。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: アメリカのパソコンの会社、エイチピーです。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: 今季のシャツは、白に、深い緑の縁取りと、桃色の3本線。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: 生地の模様は、紋章の王冠にある、ダイヤと真珠の形からとったとされています。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: この白は、ほかのクラブのシャツまで動かしました。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
  - text: 1960年代、イングランドのリーズ・ユナイテッドは、青いシャツを白に替えます。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
    emph: true
  - text: 当時、ヨーロッパで勝ち続けていた、レアル・マドリードにならったものでした。
    image: assets/images/20261109_kit_realmadrid/p_cup18_w.jpg
    card: none
  - text: スペインで初めて、背番号を付けて試合をしたのも、レアル・マドリードです。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card: none
  - text: 1947年11月、アトレティコとの試合でした。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card: none
