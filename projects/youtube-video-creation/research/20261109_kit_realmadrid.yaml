# ユニフォームとエンブレムの歴史 レアル・マドリード（11/6 作成、11/9 分）。ラ・リーガの2本目。雛形は 11/7 バルセロナ回。
# 題の問い：1902年から白のレアル・マドリードが、1シーズンだけパンツと靴下を黒にした。なぜ1年でやめたのか（答え＝コパでバルセロナに1対5・0対2で敗れ、会長が「縁起が悪い」と白に戻した）
# 選んだ理由：指示書 20261109「ユニフォームはラ・リーガの続き（バルセロナは済み）。次はレアル・マドリード → アトレティコ」。
#   同じ日（11/9）のスタジアム紹介はラ・リーガの続き（ビルバオ・セビージャ・バレンシアなど）で、レアルのベルナベウは 11/7 に済み → 同じ日に同じクラブにならない（research/20261109_picks.txt に先に書いた）。
# 重なり確認（2026-11-06）：scripts/*kit_* にレアル・マドリードは無し。直近30日の近いもの：20261107_stadium_realmadrid（2日前・スタジアム）、20261009_finance_realmadrid（28日前・財政）、20261018_finance_real_barca。
#   この回では、本拠地の名前・収容・改装・お金（エミレーツ・アディダスの額）は言わない。
# 今季のリーグ：ウィキペディア en "2026–27 Real Madrid CF season"（ラ・リーガ96季連続の1部。監督モウリーニョ）。
# 取材：requests と WebFetch・WebSearch だけ。ブラウザ操作・JS実行は使っていない。
#   読んだ：クラブ公式 歴史の頁（realmadrid.com/static/sobre-el-real-madrid/historia/futbol/1902-1910・1911-1920・1931-1940・1941-1950）
#     ＝1902年3月6日に会として成立／1920年 王室の称号「レアル」／1931年4月 共和国で王冠が消え、斜めの紫の帯が現れる／1941年 いまの名前、王冠が戻る。
#   クラブの発表（2026-06-09、puromarketing が全文を転載）＝エミレーツと2031年まで延長。2011年から協賛、2013年から胸。「ラ・リーガの歴史でいちばん長いシャツの協賛」。
#   ウィキペディア es "Historia del uniforme del Real Madrid Club de Fútbol"、en "Real Madrid CF"（Crests and colours・Kit suppliers and shirt sponsors）、es "Real Madrid Club de Fútbol"（Símbolos）。
#   今季のシャツ：SuperSport（アディダスの発表、2026-06-04）＝白、深い緑の襟と袖口、肩の3本線は桃色、模様は王冠のダイヤと真珠から。
# ---- 食い違い・断ったこと ----
#   ・黒いパンツの年：es は 1925-1926（表）・「1925年」、en は「1926年の1シーズン」→ 台本は「1925年から26年のシーズン」（どちらにも当たる言い方）。
#   ・コパの敗戦：en ＝1926年のコパでバルセロナにホーム1対5・アウェー0対2、会長パラヘスが「縁起が悪い」と白に戻した。es は「いくつかのつまずきのあと、縁起が悪いとされた」で相手は書かない → 台本は en の数字。会長の名前は言わない。
#   ・お手本のコリンチャンス：en・es とも「初めの白の手本」「創設のころの手本」→「とされる」。
#   ・紫の帯の出どころ：クラブ公式は 1931年に「現れる」。es は 1902年の新聞（ヘラルド・デ・マドリード）に「紫の帯」の記述があり、1920年代の資料にも紫があったとする → 台本は公式どおり「1931年に紋章に入った」とだけ言い、それ以前の話はしない。
#     色の意味（カスティーリャ）：es は「いちばん広く知られた説」で、クラブの公式文書には無いとする →「説が、よく知られています」。
#   ・帯が青に近くなった年：en は 2001、es は 1998（いまの版は 2003）→ 年は言わない。
#   ・レニー・ピコ：en の表は 1989-1991、es の本文は 1989-90 の1季だけ → 年数は言わない（表は「1989年から　レニー・ピコ、オタイサ」とまとめる）。
#   ・パルマラットを欧州の試合で付けられなかった：es（UEFA の決まりで季の途中に替えられず、3試合のあと 1986-01-08 に許可）。
#   ・アディダスの3本線が初めて入ったのは 1981-05-27 の欧州カップ決勝（パリ、対リヴァプール）：es。
#   ・リーズ・ユナイテッドが1960年代に白へ替えた・1947-11-23 に背番号（スペインで初）：en。
#   ・HP が袖に入ったのは 2024-02-03（初めての袖の協賛）：es。
# ---- 自分で数えた数 ----
#   白いシャツ：1902→2026＝124年。白一色（靴下まで）：1955→2026＝71年。白一色まで：1902→1955＝53年。王冠が消えていた：1931→1941＝10年。
#   胸の名前（en の表、1982-83〜今季 2026-27 の45季）：ザヌッシ3・パルマラット4・レニー・ピコ2・オタイサ1・テカ9・Realmadrid.com 1・シーメンス・モバイル3・シーメンス1・ベンキュー・シーメンス1・ビーウィン6・エミレーツ14＝11の表記で45季（足して45を確かめた）。
#   エミレーツ 14÷45＝31.1%（およそ3割）。2031年まで＝2030-31 季までで18季。
# ---- 日本との接点 ----
#   ユニフォームとエンブレムの話で日本との縁は見つからなかった（胸に日本の会社は入っていない）。2016年の横浜のクラブW杯決勝（鹿島）は胸・紋章の話ではないので入れない（10/6 の決まり：無理に押し込まない）。
# 言わなかったもの：エミレーツ・アディダス・HP の額／本拠地の名前と工事（2日前のスタジアム回）／1985年のバルセロナ五輪の印／会長の名前。
# 写真：assets/images/20261109_kit_realmadrid/（credits.json）。Commons（CC BY-SA・PD）。代理店・放送映像・エンブレム画像は使っていない。
