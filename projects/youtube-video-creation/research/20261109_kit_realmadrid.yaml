sections:
- id: white
  main: true
  heading: レアル・マドリードの白は、なぜ1年だけ黒になったのか
  bg: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1902年から白。1925年から26年のシーズンだけ、パンツと靴下が黒。コパでバルセロナに敗れ、白に戻した
  card: *white
  say:
  - text: 今回はレアル・マドリード。白いシャツ、王冠の紋章、胸のスポンサーをたどります。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: クラブが会としてまとまったのは、1902年3月。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card:
      <<: *white
      highlight_row: 0
  - text: 決めた色は、シャツもパンツも白でした。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: お手本にしたとされるのが、イングランドのコリンチャンス。
    image: assets/images/20261109_kit_realmadrid/p_bwin_w.jpg
    card: none
  - text: 上品な試合ぶりで知られた、アマチュアの名門です。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card: none
  - text: その白が、一度だけ崩れます。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card: none
    emph: true
  - text: 1925年から26年のシーズン。パンツと靴下が、黒になりました。
    image: assets/images/20261109_kit_realmadrid/p_benq_w.jpg
    card:
      <<: *white
      highlight_row: 2
    callword: パンツが黒に
  - text: コリンチャンスの姿に、もっと近づけようという試みでした。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card: none
  - text: ところが、その年のスペインのカップ戦、コパ・デル・レイで、バルセロナに敗れます。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card: none
  - text: ホームで1対5の負け、アウェーでも0対2の負けでした。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card: *cup
  - text: 会長は、黒は縁起が悪いと言って、白に戻しました。
    image: assets/images/20261109_kit_realmadrid/p_bwin13_w.jpg
    card:
      <<: *cup
      focus: 2
    emph: true
  - text: 黒いパンツは、1シーズンで消えたことになります。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: それでも、頭から足の先まで白になるのは、まだ先です。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
  - text: 靴下は、黒と紺を行ったり来たりして、白になったのは1955年でした。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card:
      <<: *white
      highlight_row: 4
  - text: クラブができてから53年。ようやく、白一色がそろいました。
    image: assets/images/20261109_kit_realmadrid/p_lineup_w.jpg
    card: none
    emph: true
  sources:
