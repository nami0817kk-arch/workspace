# 自分で数えた比べ（見立て）: 15年前＝3部リーグのホームでベリーに敗戦。2026年＝欧州の大会で3戦全勝（9点・得失点差+7）。今季の次の2試合は 10/25 マンU（アウェー）と 11/5 スパルタ・プラハ（アウェー）。
