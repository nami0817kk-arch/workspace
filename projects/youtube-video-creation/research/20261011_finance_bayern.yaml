# クラブの財政：バイエルン・ミュンヘン（10/11 日、シリーズ「クラブの財政」、key: finance_bayern、型は news）。
#
# 軸は「**稼いだお金の持ち主が、株主ではなく会員である**」。
#   10/10 の PSG 回の軸（関連当事者取引・公正価値・連盟の値付け直し）は**1行も出さない**。
#   10/9 のレアル回の軸（スクワッド・コスト・ルール／ベルナベウの改修費）も出さない。
#   PSG 回の「1席あたりの入場料」「器の大きさで割る」、レアル回の「稼ぎは世界の頂点」は使わない。
#
# **PSG 回と同じ形にそろえた所**（ユーザー指示）:
#   冒頭の節に stats の板（3つの数字）、2つ目の節に waterfall（収入の内訳）。
#   ただし**中身の出どころが違う**。PSG は放映権の額が非公表で「総額から2つを引いた」が、
#   こちらは**クラブ自身が6項目を全部出している**ので、引き算をしていない。
#   その代わり「集計の8億6100万と、クラブの帳簿の線の引き方が違う」という形にした。
#
# ★**数字が3種類あるので混ぜない**:
#   (1) **8億6100万ユーロ** … デロイト・フットボール・マネーリーグ2026（2024/25）の集計。世界3位。
#   (2) **9億7830万ユーロ** … クラブが出した**連結**の売上（FCバイエルン・ミュンヘンAG グループ）。
#   (3) **9億2650万ユーロ** … クラブが出した**AG単体**の収入の項目の合計（waterfall の合計。260.7+240.4+150.5+117.7+105.3+51.9）。
#   **(1)(2)(3) を足し引きして橋をかけない。**台本では「線の引き方が違う」とだけ言う。
#
# ★**放映権1億530万ユーロは「AG単体の媒体収入」**で、**チャンピオンズリーグとクラブW杯の分は
#   「試合の興行（2億6070万ユーロ）」に入っている**（クラブの発表の原文にそう書いてある）。
#   だから「放映権が11.4%しかない」と言うときは、**必ず次の行でこの線引きを言う**。言わないと誤解になる。
#
# 自分で計算した数（機械は検算しない）:
#   waterfall の合計 926.5 ＝ 260.7＋240.4＋150.5＋117.7＋105.3＋51.9（足し算を確かめた）
#   放映権の割合 105.3 ÷ 926.5 ＝ 11.4%
#   会員1人あたり 861,000,000 ÷ 432,500 ＝ 1,990.75 →「およそ1991ユーロ」
#   円 1991 × 177 ＝ 352,407 →「およそ35万2000円」（1ユーロ＝177円。ECB 2026-10-09 の 177.34 を丸めた）
#   税金 ÷ 放映権 257.7 ÷ 105.3 ＝ 2.447 →「2.4倍」
#   人件費 ÷ 連結の売上 408.3 ÷ 978.3 ＝ 41.74% →「41.7%」
#   5季の増加 861.0 − 611.4 ＝ 249.6 →「2億4960万ユーロ」
#   3社の払った額 77＋90＋110 ＝ 277 →「2億7700万ユーロ」で株の25%
#   **「1.41倍」「1年あたり◯%」は使わない**（PSG 回が「1.50倍・1年あたり10.8%」でそろえていたため）。
#
# **言い切っていないもの**:
#   50プラス1の**条文そのものは取れていない**（dfl.de は画面を組み立てる作りで本文が取れず、
#   Satzung の PDF は 403）。だから語りは「元のクラブが議決権の過半を持っていなければライセンスが出ない」
#   という**決まりの中身まで**にとどめ、条番号も原文の引用もしていない。
#   競争当局の決定も**当局自身の発表は取れていない**（bundeskartellamt.de は 404／403）ので、
#   「8年かけた審査が今年8月に終わり、決まりはそのまま残る」「リーグには運用を直すよう求めがついた」
#   までにした。**処分・罰・個別クラブの名前は出していない**。
#   2025-26 の決算は**まだ外に出ていない**（会計年度は7月1日〜6月30日。前回の発表は2025年11月2日）。
#
# **50プラス1の例外の節（④）について**（2026-10-11 追記）:
#   例外のあるクラブは レバークーゼン（バイエル）・ヴォルフスブルク（フォルクスワーゲン）の2つで、
#   どちらも**サッカー部門の会社を100%持っている**。ホッフェンハイムも同じ形だったが2023年の終わりに戻した。
#   ★**例外が認められる条件（長く支えてきた会社がある場合の決まり）は、原文に届いていない**ので
#     **台本では理由を一切書いていない**。「例外がある」「これ以上は認めない」「2026年8月の決定で
#     いまある2つは決まりに合っていないとされた」までで止め、**条番号も、認められたときの経緯も出していない**。
#   競争当局自身の発表も取れていないので、語りは「〜とされています」の形のまま（tier は 報道）。
#   8年の審査の話は③から④へ移した（同じ決定を2つの節で言わないため）。③の年表は4行にして focus を2025年11月にした。
#
# 写真は2枚、入れ替えは1本1回（冒頭＝外から見たアリアンツ・アレーナ → ②の節から中の写真）。
#   どちらも Commons・CC BY-SA で、credits.json は assets/backgrounds/ にある。
#   **顔が入っていないので板が顔にかからない**（PSG 回と同じ理由）。
#   stadium_バイエルン.png は 10/11 にこのセッションで取った（CC BY-SA 2.5 / Richard Bartz）。
#   stadium_バイエルン_in.png は前からある（CC BY-SA 2.0 / Michal Osmenda）。
# アルファベットは読み上げに出さない（AG →「株式会社」、DFL →「ドイツのリーグ」、
#   e.V. →「会員の組織」、UEFA →「ヨーロッパの大会」と言い換え）。板の題にも出していない。
# サムネは構図 number（10/10 の PSG は scene、10/9 のレアルは number、10/8 のアルテタは face）。
#   **ユーザーと相談して決める**ので、ここに書いたのは案A。案B・Cは報告に出す。
