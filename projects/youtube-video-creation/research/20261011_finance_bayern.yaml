  topic: バイエルン・ミュンヘン
  title: バイエルン・ミュンヘン、収入は世界で3番目。その株の4分の3は誰のものか
  question: 世界で3番目に稼ぐクラブの株は、誰が持っているのか
  lead: 会員の数が、世界のどのスポーツクラブよりも多いクラブ。
  hook: 稼いだお金の使い道を決める側にも、その人たちがいます。
  takeaway: バイエルン・ミュンヘンの2024-25の収入は、集計で8億6100万ユーロ。世界のクラブで3番目で、5季前の6億1140万ユーロから2億4960万ユーロ増えた。クラブ自身が出した連結の売上は9億7830万ユーロ、営業の利益は1億8780万ユーロ、最終の利益は2710万ユーロ。収入の項目はクラブが6つとも公表していて、試合の興行2億6070万ユーロ、スポンサーと広告2億4040万ユーロ、物販1億5050万ユーロ、移籍1億1770万ユーロ、放映権1億530万ユーロ、そのほか5190万ユーロで合計9億2650万ユーロ。放映権が全体の11.4%にとどまるのは、ヨーロッパの大会とクラブ世界一を決める大会の分が「試合の興行」に入っているため。株は会員の組織が75%を持ち、アディダス・アウディ・アリアンツが8.33%ずつ。外へ出たのは2002年のアディダス7700万ユーロ、2011年のアウディ9000万ユーロ、2014年2月のアリアンツ1億1000万ユーロの3回だけで、合計2億7700万ユーロで25%。会員は2025年11月の総会で43万2500人。ドイツのリーグには会社が過半を持てる例外もあり、レバークーゼンはバイエル、ヴォルフスブルクはフォルクスワーゲンがサッカー部門の会社を100%持っている（ホッフェンハイムは2023年末に元へ戻した）。2026年8月の決定で、50+1の決まりそのものは残る一方、この2つの例外は決まりに合っていないとされ、リーグは使い方をそろえるよう求められた。収入を会員の数で割ると1人あたりおよそ1991ユーロ、円でおよそ35万2000円。納めた税金2億5770万ユーロは放映権から入った分の2.4倍で、人件費4億830万ユーロは連結の売上の41.7%にあたる
  opening_image: assets/backgrounds/stadium_バイエルン.png
short_title: バイエルンの株主は、43万2500人の会員と3つの会社だけ
