# 久保建英について、スペイン紙が「2度目」と書いた（2026-09-13 の試合）
#
# **引用の回。**現地紙の表現がそのまま引きになる。
# 「1度目」は前節エルチェ戦の出番なし、「2度目」がこのアトレティコ戦。
#
# 引きは**「2度目、と数えられている」**。ここが山場（@main）。
#
# **責める書き方にしない。**指摘しているのは現地紙であって、こちらではない。
# **代役のオチエングが1得点2アシストという事実**を添えると、
# 何が起きているかが説明なしで伝わる
#
# **出典が footballchannel に寄っている。**同じ試合を別の媒体でも確かめたが、
# 「2度目の明確な警告」の訳文を載せていたのはここだけだった
