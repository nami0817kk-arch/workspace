  - id: said
    heading: 現地紙が書いたこと
    main: true
    tier: 報道
    telop: 「奮起しなければならないという2度目の明確な警告だ」
    narrator: 解説
    say:
      - {short_only: true, text: ラ・リーガ第5節、ソシエダはアトレティコに0対3で負けました。}
      - 記事は「警告を受けた」という一文から始まります。
      - {voice: 記者, text: 奮起しなければならないという2度目の明確な警告だ}
      - 1度目は、その前のエルチェ戦です。出番そのものがありませんでした。
      - 2度目が、このアトレティコ戦になります。
      - {voice: 記者, text: エルチェ戦では出場機会がなかった}
      - {voice: 記者, text: 今回は72分から出場した}
      - {voice: 記者, text: しかし、存在感を示すことができなかった}
      - {voice: 記者, text: ソシエダの攻撃にあまり貢献できなかった}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/14/post1010427/

  - id: replacement
    heading: そのあいだに起きていたこと
    tier: 報道
    telop: 代役のオチエングが1得点2アシスト
    narrator: キャスター
    say:
      - 久保が出なかったエルチェ戦を、チームは3対2で勝っています。
      - 代わりに先発したジョブ・オチエングが、1つ決めて2つ演出しました。
      - 同じ紙は、その前にもこう書いていました。
      - {voice: 記者, text: 不動の地位は危うくなる}
      - 監督のマタラッツォは、このアトレティコ戦でも71分まで久保を使いませんでした。
      - チームは終盤の10分あまりで3点を失っています。
    official: false
    sources:
