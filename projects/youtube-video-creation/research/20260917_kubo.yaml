    narrator: キャスター
    say:
      - 現地時間13日、ラ・リーガ第5節です。
      - レアル・ソシエダはホームでアトレティコ・マドリードに0対3で負けました。
      - 久保建英はベンチから始まり、72分から入っています。
      - 先発を外れたのは、これで2試合続けてです。
    official: false
