  say:
  - text: 松井大輔の生まれは、1981年5月11日。京都府の出身で、いま45歳です。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: 海外でプレーしたのは、5か国の9クラブ。
    card: {<<: *datacard, highlight_row: 2}
    emph: true
  - text: 中心はフランス。1部と2部で、4つのクラブを渡りました。
    card: {<<: *datacard, highlight_row: 3}
  - text: 引退の発表は、2024年2月。42歳でした。
    card: {<<: *datacard, highlight_row: 6}
