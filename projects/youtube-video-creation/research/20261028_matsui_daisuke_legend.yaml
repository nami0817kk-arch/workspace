    title: 数字の外にある、2つの話
    columns:
    - いつ
    - 何があったか
    rows:
    - - 2004年
      - セリエAのラツィオより、仏2部のル・マン
    - - 2008年
      - シュトゥットガルトを視察し、サンテティエンヌへ
    source: Wikipedia
    highlight_row: 0
  say:
  - text: 松井大輔の、数字の外にある話を2つ。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 1つ目は2004年。イタリア1部の名門、ラツィオも候補にありました。
    card: {<<: *secretcard, highlight_row: 0}
  - text: それでも選んだのは、当時フランス2部のル・マン。
    card: {<<: *secretcard, highlight_row: 0}
    emph: true
  - text: 理由は、イタリアのサッカーは守備的すぎると考えたから、と伝えられています。
    card: none
  - text: 2つ目は2008年。ル・マンとの契約を終えるときです。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - text: ドイツのシュトゥットガルトからも誘いが来て、現地まで見に行きました。
    card: {<<: *secretcard, highlight_row: 1}
  - text: それでも言葉の負担を考えて、サンテティエンヌを選びます。
    card: {<<: *secretcard, highlight_row: 1}
  - text: その街は、2003年に日本代表として初めて試合に出た場所でした。
    card: none
    emph: true
