  say:
  - text: 元日本代表のミッドフィールダー、松井大輔。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: none
    short_only: true
  - text: 2010年、南アフリカ大会。松井大輔は29歳でした。
    image: assets/images/20261028_matsui_daisuke_legend/11_w.jpg
    card: none
  - text: 初戦のカメルーン戦。右サイドで先発します。
    card: {<<: *wccard, highlight_row: 0}
  - text: 前半39分。右から上げたボールを、本田圭佑が決めました。
    card: none
    emph: true
  - text: この1点を守り切り、初戦を白星で終えます。
    card: none
  - text: オランダには0対1で敗れ、デンマークには3対1。日本はグループを突破します。
    image: assets/images/20261028_matsui_daisuke_legend/11_w.jpg
    card: {<<: *wccard, highlight_row: 2}
  - text: 決勝トーナメントの1回戦は、パラグアイ。
    card: {<<: *wccard, highlight_row: 3}
  - text: 前半、松井大輔の遠くからのシュートが、ゴールのバーを叩きます。
    image: assets/images/20261028_matsui_daisuke_legend/11_w.jpg
    card: none
    emph: true
  - text: 試合は0対0のまま、PK戦へ。日本は3対5で敗れ、ベスト16で大会を終えました。
    card: {<<: *wccard, highlight_row: 4}
  - text: 大会のあと、国際サッカー連盟の技術研究グループは報告書で、
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: none
  - text: 松井大輔と本田圭佑を、ドリブルの技術が高い選手として挙げました。
    card: none
    emph: true
