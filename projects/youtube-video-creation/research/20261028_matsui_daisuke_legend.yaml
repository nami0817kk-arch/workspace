- id: after
  heading: 引退した松井大輔は、いま、どこで何をしているのか
  tier: 報道
  telop: 42歳での引退と、フットサルの舞台へ
  card: &aftercard
    type: table
    title: 最後の数年と、引退のあと
    columns:
    - いつ
    - 何があったか
    rows:
    - - 2021年9月
      - フットサルのチームとも契約
    - - 2024年2月20日
      - SNSの配信で引退を発表。42歳
    - - 2024年7月
      - Fリーグを運営する法人の理事長に
    highlight_row: 0
  say:
  - text: 2021年9月、40歳の松井大輔は、フットサルのチームとも契約します。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: サッカーとフットサル、2つの競技を同時に続けました。
    card: none
  - text: 2024年2月20日の夜。自分のインターネットの配信で、現役の引退を発表します。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 1}
  - text: これからについて、こう話しています。
    card: none
  - voice: 松井大輔
    text: ドリブルなどの技術に特化したスクールを立ち上げたりしたい。
    card: none
  - voice: 松井大輔
    text: これから第2の人生が始まるので応援お願いします。
    card: none
    cont: true
  - text: 2024年7月。フットサルのFリーグを運営する法人で、
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 2}
  - text: 日本フットサルトップリーグの理事長に就きました。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 2}
    emph: true
  - text: ピッチの外から、競技そのものを動かす側に回っています。
    card: none
