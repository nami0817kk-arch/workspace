  say:
  - text: 2000年、鹿児島実業高校から、京都パープルサンガへ入ります。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *careercard, highlight_row: 0}
  - text: 2004年9月、23歳でフランス2部のル・マンへ。最初は期限付きの移籍でした。
    card: {<<: *careercard, highlight_row: 1}
  - text: 2部の中ほどにいたチームは、その季を2位で終え、昇格を決めます。
    card: none
    emph: true
  - text: その中心にいた松井大輔は、地元で「ル・マンの太陽」と呼ばれました。
    card: none
  - text: 2006年1月。フランス1部の、月間最優秀選手に選ばれます。
    image: assets/images/20261028_matsui_daisuke_legend/12_w.jpg
    card: none
    callword: 月間最優秀選手
  - text: 投票で38%。リヨンのヴィルトールの37%を、わずかに上回りました。
    card: none
    emph: true
  - text: 2008年からはサンテティエンヌ、グルノーブルと、フランス1部のクラブを渡ります。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *careercard, highlight_row: 3}
  - text: その後はロシア、ブルガリア、ポーランドへ。行き先を選ばず、ボールを追いました。
    card: {<<: *careercard, highlight_row: 4}
