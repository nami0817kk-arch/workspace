# 松井大輔（元日本代表MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-28。型は 10/27 の岡崎慎司と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は NHK・UNFP（仏プロ選手連合）・スポニチ・サッカーキング・英語版/日本語版 Wikipedia の成績表と試合記録、自分で足した値だけ。
# **私生活（結婚・離婚・家族）・怪我の中身は入れない。女子サッカーは入れない**。Jリーグは経歴の事実（京都の所属）だけで、題材にしない。
#
# **重なりの確認（2026-10-28）**：scripts/・research/covered.yaml・research/posted.json を「松井大輔」で grep → 0件。
#   直近の日本人レジェンド（中田英寿・長谷部誠・中村俊輔・内田篤人・川口能活・小野伸二・稲本潤一・遠藤保仁・大久保嘉人・岡崎慎司）とも別人。
# **引退の確認（一次情報に近いもの）**：NHK 2024-02-21 0:13「サッカー 松井大輔が現役引退発表 元日本代表 W杯などで活躍」（元URLは404、web.archive.org の控えで本文を確認）
#   「松井選手は20日夜、自身のSNSで…ライブ配信し、この中で現役引退を発表しました」「京都府出身の42歳」。→ **現役ではない**。
# **いまの立場**：サッカーキング 2024-07-18「松井大輔氏が日本フットサルトップリーグ新理事長に就任」。**2026年のいまも理事長かは確かめられなかった**ので、台本は「2024年7月に就任」と時点で言う。
# **日本との接点**：全体が日本代表・W杯の話。基礎DATAの次に代表の節を置いた。
#
# **数字の出どころと台本での扱い**
# - **生年月日** 1981-05-11 京都（英語版 infobox）→ 2026-10-28 で45歳、2010-06-14 で29歳、2024-02-20 で42歳（NHK も42歳）。
# - **日本代表 31試合1得点（2003〜2011）**：英語版の年別 2003=1・2005=3（1得点）・2007=2・2008=7・2009=8・2010=8・2011=2。区切りは自分で足した：2003〜2007 = 6試合1得点、2008〜2011 = 25試合0得点（うち2008〜2010 = 23試合）。
#   デビューは 2003-06-22 コンフェデ杯コロンビア戦（日本語版の出場一覧で開催地サンテティエンヌ、0対1）。唯一の得点は 2005-11-16 アンゴラ戦（国立、1対0。英語版の得点一覧と日本語版の一致。英語版本文の「11 October」は表と食い違うので使わない）。
#   2006年W杯は選外（日本語版「期待されながらも落選」、英語版はトルシエの批判を引く）。
# - **2010年W杯**：日本語版「全4試合にスタメン出場」。英語版の先発表でカメルーン戦 RM（69分交代）・パラグアイ戦 RW（65分交代）。
#   カメルーン戦（6月14日）：英語版 2010 Group E「On the 39th minute, from a surprising Daisuke Matsui cross from the right wing, Keisuke Honda … give Japan the lead」「Japan's first World Cup win away from home soil」。1対0。
#   パラグアイ戦（6月29日）：英語版 knockout stage「a long-distance shot from Daisuke Matsui hit the crossbar」。0対0、PK戦3対5（パラグアイは5本すべて成功）。
#   FIFA の技術研究グループの報告：スポニチ 2010-09-03「ともにドリブル技術が高いとして松井大輔（トム）と本田圭佑」。
# - **クラブ（リーグ戦）**：英語版の成績表。ル・マン 119試合15得点（25+33+27+34／3+3+4+5 を足して確かめた）、サンテティエンヌ 22/1、グルノーブル 45/5、ディジョン 3/0。フランスのリーグ戦は 189試合21得点（自分で足した）。189÷21＝9.0 →「9試合に1点」。
#   トム・トムスク 7/0、スラヴィア・ソフィア 11/0、レヒア・グダニスク 16/4。オドラ・オポーレは infobox 4・表 3 で食い違うので数字は言わない。
#   海外は5か国（フランス・ロシア・ブルガリア・ポーランド・ベトナム）9クラブ（英語版のクラブ欄から数えた）。日刊スポーツ 2020-12-03 の見出し「39歳６カ国目」（日本を含む数）とも合う。
# - **ル・マン**：日本語版「2004年9月1日に…フランス2部…ル・マンUCにレンタル移籍」「2部の中位から一気に1部昇格圏の2位」「le soleil du Mans（ル・マンの太陽）と呼ばれた」。英語版も Football.fr の「the sun of Le Mans」を引く。
#   2006年1月の月間最優秀選手：UNFP の記事（web.archive 2007-10-13）「vainqueur du Trophée UNFP-CANAL+-L'EQUIPE du meilleur joueur du mois de janvier」「Matsui (38% des suffrages exprimés) … Wiltord (37%) … Kahlenberg (25%)」。同じ記事が「次のドイツW杯に出るはず」と書いている。
#   「日本人初」は日本語版だけなので台本では言わない。
# - **ラツィオではなくル・マン**：英語版（Maxifoot 2005-10-26 引用）「Matsui chose Le Mans, then a second division club, over Lazio … because he believed that the style of Italian football was too defensive」。
# - **シュトゥットガルトの話**：日本語版（スポーツナビ 2008-08 引用）「サンテティエンヌと…シュトゥットガルトからオファー…現地視察まで行ったが言語の負担を考慮しサンテティエンヌと3年契約」。日刊ゲンダイ 2024-06-22 の見出し「年俸倍額提示した独クラブのオファーを蹴った」。
# - **本人の言葉**：NHK 2024-02-21 が伝えたライブ配信での言葉「ドリブルなどの技術に特化したスクールを立ち上げたりしたい。これから第2の人生が始まるので応援お願いします」を原文のまま。
# - **引退後**：サッカーキング 2024-07-18（日本フットサルトップリーグ理事長。「昨年度からは Fリーグ アンバサダー」）。日本語版「2021年9月10日、Y.S.C.C.横浜フットサルと契約」。
#
# **入れなかったもの**：結婚・離婚（日本語版にある）、アジアカップ2011の負傷離脱の中身、サンテティエンヌでの会長の批判、ディジョンの監督との確執、オドラの数字、Jリーグ各クラブの細かい数字、
#   アシストの数（2005-06 の8アシスト・リーグ3位はスポニチの控えを当たれず）、「日本人初の月間MVP」。
# **写真（10/28 差し替え）**：引き伸ばしを避けるため 02・03・04 は使わず、11 Commons 2009年 日本対オーストラリア（横浜、sean、CC BY-SA 2.0。松井本人とは言わない）、12 Commons 2011年 ル・マンの試合（MMArena、Broken72、CC BY-SA 3.0。松井の在籍後の本拠地なので『その試合』『その本拠地』とは言わない）を足した。サムネは 11 の上に 01 を中央に差し込んだ合成。
# 旧メモ：01 Commons 2012年スラヴィア時代（Biser Todorov、CC BY 3.0）、04 Commons 2009年 日本代表（Chong Fat、CC BY-SA 3.0。480×870 と小さいので表の節で右に置くだけ）、
#   02 サッカーキング 2024-07-18 の理事長就任会見、03 サッカーキング 2024-04-05 掲載（2022年の試合。©Hikaru Miyachi）。代理店の写真は無し。ル・マン時代・2010年W杯の写真は使えるものが無かった（行では「その試合の写真」と言わない）。
