    card: none
  - text: クロスを上げたのは、松井大輔。
    image: assets/images/20261028_matsui_daisuke_legend/11_w.jpg
    card: {<<: *hookcard, focus: 0}
  - text: この大会は、4試合すべてに先発しました。
    card: {<<: *hookcard, focus: 1}
  - text: 23歳で、フランス2部のクラブに飛び込んだ男の歩みを、たどります。
    card: {<<: *hookcard, focus: 2}
