  say:
  - text: 松井大輔の日本代表を、3つの時期で並べます。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *jpncard, highlight_row: 3}
  - text: デビューは2003年6月、コンフェデレーションズカップのコロンビア戦。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 唯一の得点は、2005年11月のアンゴラ戦。この1点で、日本は1対0の勝ちでした。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 最初の5年の出場は、6試合。京都からフランスへ渡った前後の時期です。
    card: {<<: *jpncard, highlight_row: 0}
    emph: true
  - text: 2006年のワールドカップは、23人の枠に届いていません。
    card: none
  - text: 流れが変わるのは2008年から。3年で23試合に出ます。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *jpncard, highlight_row: 1}
    emph: true
  - text: そして2011年、カタールのアジアカップで、日本は優勝しました。
    card: {<<: *jpncard, highlight_row: 2}
