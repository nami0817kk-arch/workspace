  say:
  - text: 最後に、松井大輔の数字を並べます。
    image: assets/images/20261028_matsui_daisuke_legend/21_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: フランスのリーグ戦は、189試合で21得点。およそ9試合に1点のペースです。
    card: {<<: *viewcard, highlight_row: 0}
    mark:
      kind: circle
      row: 0
      col: 何試合に1点
  - text: 点を取るより、右から崩して点を作る選手でした。
    card: {<<: *viewcard, highlight_row: 0}
    emph: true
  - text: 代表の出番は、フランスで1部に定着したあとの3年で、
    card: {<<: *viewcard, highlight_row: 2}
  - text: 最初の5年のおよそ4倍に増えました。
    card: {<<: *viewcard, highlight_row: 2}
    emph: true
  - text: その中に、南アフリカの4試合の先発があります。
    image: assets/images/20261028_matsui_daisuke_legend/11_w.jpg
    card: none
  - text: 初戦の決勝点を右から送り、パラグアイ戦ではバーを叩いた。
    card: none
  - text: 2部のル・マンから始まった遠回りが、日本の16強を支えた。
    card: none
  - text: それが、松井大輔というミッドフィールダーでした。
    card: none
