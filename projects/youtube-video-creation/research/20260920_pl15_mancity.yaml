- id: rival
  heading: 宿敵
  tier: 背景
  telop: マンチェスター・ダービー。相手は今季もプレミアにいる
  narrator: 解説
  card:
    type: table
    title: マンチェスター・ダービー
    columns:
    - ''
    - ''
    rows:
    - - 初対戦
      - 1881年11月12日／3-0
    - - 当時の名前
      - セント・マークス 対 ニュートン・ヒース
    - - 1973-74年
      - ローの1点で、相手の降格が決まる
    - - 今季
      - 相手もプレミアリーグにいる
  say:
  - 相手は、同じ街の**ユナイテッド**です。呼び名は**マンチェスターダービー**。
  - 初めて当たったのは1881年11月12日。**3対0**という結果でした。
  - このときの両者は、セント・マークスと、ニュートン・ヒースと名乗っています。
  - いちばん語られるのは、1973年から74年の終盤の一戦です。
  - もともとユナイテッドにいたデニス・ローが、シティの選手として**バックヒール**で決勝点を入れました。
  - この1点で、**ユナイテッドの降格が決まりました。**
  - 相手は**今季もプレミアリーグにいます。**
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Manchester_derby
