      - 東マンチェスターの街
  say:
  - text: マレスカのサッカーは、ボールを持って崩し、奪われたらその場で奪い返す。グアルディオラ譲りです。
    image: assets/photos/pl/mancity_manager_71dabf8d.jpg
  - オーナー資金で買う型。買収の翌年だけで1億ポンド超を選手に注ぎ、4年で優勝まで駆け上がりました。
  - 始まりは東マンチェスターの労働者の街。いまも本拠地は、その東側にあります。
  sources:
