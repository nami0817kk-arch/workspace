- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 開幕5連勝で首位。新監督マレスカ
  narrator: キャスター
  say:
  - text: 開幕から**5連勝**。いま、プレミアの首位にいるクラブです。
    image: assets/stats/pl_mancity_data_r1.png
    no_telop: true
  - text: 監督はエンツォ・マレスカ。かつてグアルディオラを支えた助手が、**1年目**の指揮です。
    image: assets/stats/pl_mancity_data_r2.png
    no_telop: true
  - voice: エンツォ・マレスカ
    text: 「シティは、信じられないほどよく運営されているクラブだ」
    image: assets/stats/pl_mancity_data_r2.png
  - text: 昨季はリーグ2位で、カップは**2つ**。リーグの優勝からは、2シーズン遠ざかっています。
    image: assets/stats/pl_mancity_data_r3.png
    no_telop: true
  - text: 3部にいたのは1998年。転機は10年後の買収でした。
    image: assets/stats/pl_mancity_data_r3.png
    no_telop: true
  - image: assets/stats/pl_mancity_data0.png
    text: 創立は**1880年**。教会のチーム、セント・マークスから、1894年に今の名前になりました。
    no_telop: true
  - image: assets/stats/pl_mancity_data1.png
    text: 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
    no_telop: true
  - image: assets/stats/pl_mancity_map.png
    text: ホームタウンはマンチェスター。イングランド北西部です。
    no_telop: true
  - image: assets/backgrounds/stadium_マンチェスターシティ.png
    text: 本拠地はエティハド・スタジアム。**約6万1000人**が入ります。
  - image: assets/photos/pl/mancity_owner_90b48e45.jpg
    text: オーナーは、アブダビの投資グループです。
  - image: assets/stats/pl_mancity_cups.png
    text: 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回。
    no_telop: true
  - image: assets/stats/pl_mancity_cups.png
    text: チャンピオンズリーグ1回、カップウィナーズカップ1回、スーパーカップ1回、クラブワールドカップ1回。
    no_telop: true
  - image: assets/stats/pl_mancity_data6.png
    text: 1シーズン勝ち点100を挙げたのは、2017年から18年です。
    no_telop: true
  - image: assets/stats/pl_mancity_last.png
    text: 昨季は**2位**、勝ち点78。FAカップとリーグカップの**2冠**でした。
    no_telop: true
