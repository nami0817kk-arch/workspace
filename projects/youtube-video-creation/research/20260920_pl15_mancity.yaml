  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_mancity_data0.png
    text: 創立は**1880年**。セント・マークスという名前で始まり、1894年に今の名前になりました。
    no_telop: true
  - image: assets/backgrounds/stadium_マンチェスターシティ_in.png
    text: 本拠地はエティハド・スタジアム。**6万1038人**が入ります。
  - image: assets/stats/pl_mancity_map.png
    text: ホームタウンはマンチェスター。イングランド北西部です。
    no_telop: true
  - image: assets/photos/pl/mancity_owner_90b48e45.jpg
    text: オーナーはシティ・フットボール・グループ。2008年からクラブを持っています。
  - image: assets/stats/pl_mancity_cups.png
    text: 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回、チャンピオンズリーグも獲っています。
    no_telop: true
  - image: assets/stats/pl_mancity_data5.png
    text: 昨季はFAカップとリーグカップの**2冠**でした。
    no_telop: true
  - image: assets/stats/pl_mancity_data6.png
    text: 2017年から18年には、勝ち点**100**。プレミアリーグの記録です。
    no_telop: true
  - image: assets/stats/pl_mancity_data8.png
    text: 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
    no_telop: true
  - image: assets/stats/pl_mancity_last.png
    text: 昨季は**2位**。勝ち点は78でした。
    no_telop: true
