- id: data
  heading: マンチェスター・シティ 基礎DATA
  main: true
  tier: 背景
  telop: 1880年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_mancity_data.png
    text: 創立は**1880年**。セント・マークスという名前で始まり、1894年に今の名前になりました。
  - image: assets/stats/pl_mancity_data.png
    text: 本拠地はエティハド・スタジアム。**6万1038人**が入ります。
  - image: assets/stats/pl_mancity_data.png
    text: オーナーはシティ・フットボール・グループ。2008年からクラブを持っています。
  - image: assets/stats/pl_mancity_data.png
    text: 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回、チャンピオンズリーグも獲っています。
  - image: assets/stats/pl_mancity_data.png
    text: 昨季はFAカップとリーグカップの**2冠**でした。
  - image: assets/stats/pl_mancity_data.png
    text: 2017年から18年には、勝ち点**100**。プレミアリーグの記録です。
  - image: assets/stats/pl_mancity_data.png
    text: 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
  sources:
  - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  bg: assets/backgrounds/stadium_マンチェスターシティ.png
  official: false
- id: fall
  heading: 3部まで落ちたクラブ
  tier: 背景
  telop: 1998年、3部へ。ヨーロッパを獲った経験がありながら
  narrator: 解説
  card:
    type: table
    title: 落ちて、変わるまで
    columns:
    - ''
    - ''
    rows:
    - - 1998年
      - 3部へ降格
    - - 2008年8月
      - アブダビの投資グループが買収
    - - 2012年
      - 初のプレミアリーグ優勝
    - - その最終節
      - 決勝点はアグエロ（追加4分目）
  say:
  - 1998年、このクラブは**3部**まで落ちました。
  - しかもヨーロッパのタイトルを獲った経験のあるクラブで、**ヨーロッパの優勝クラブが自国の3部に落ちたのは、これが2例目**でした。
  - 1990年代、経営が傾いた末の降格です。いまの姿からは想像しにくい話です。
  - 転機は2008年8月。アブダビの投資グループがクラブを買い取りました。
  - そして2012年、プレミアリーグで最初の優勝を果たします。
  - 最終節、**アディショナルタイムに2点**を取って逆転しました。2点目を決めたのはセルヒオ・アグエロ、**追加された4分目**のことです。
  - この1点で優勝が決まりました。決まり方が、いまも語り草になっています。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  bg: assets/backgrounds/stadium_マンチェスターシティ.png
