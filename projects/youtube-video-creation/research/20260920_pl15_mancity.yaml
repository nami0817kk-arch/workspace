- id: fall
  heading: 3部まで落ちたクラブ
  tier: 背景
  telop: 1998年、3部へ。ヨーロッパを獲った経験がありながら
  narrator: 解説
  card:
    type: table
    title: 落ちて、変わるまで
    columns: &id001
    - ''
    - ''
    rows:
    - - 1998年
      - 3部へ降格。1990年代に経営が傾いた末
    - - 1970年
      - カップウィナーズカップ優勝
  say:
  - text: 1998年、このクラブは**3部**まで落ちました。
    image: assets/images/pl_mancity_story/01.jpg
  - 1990年代、経営が傾いた末の降格でした。
  - 1970年にヨーロッパの**カップウィナーズカップ**を獲ったクラブです。
  - text: ヨーロッパを制したクラブの3部落ちは、ドイツのマクデブルクに続く**2例目**でした。
    card:
      type: table
      title: 落ちて、変わるまで
      columns: *id001
      rows:
      - - 2008年8月
        - アブダビの投資グループが買収
      - - 2012年 最終節
        - QPRに3-2。決勝点はアグエロ（追加4分目）
  - 転機は2008年8月。いまのオーナー、アブダビの投資グループがクラブを買い取りました。
  - 2012年の最終節は、クイーンズ・パーク・レンジャーズ戦でした。
  - 1対2で負けたまま、**アディショナルタイム**に入ります。
  - text: そこから2点。2点目を決めたのはセルヒオ・アグエロ、試合終了の直前でした。
    card:
      type: table
      title: 落ちて、変わるまで
      columns: *id001
      rows:
      - - 同じ日
        - 1968年以来、44年ぶりの優勝
  - 3対2で勝ち、同じ勝ち点のマンチェスター・ユナイテッドを得失点差で上回りました。
  - 1968年以来、**44年ぶり**の優勝でした。
  official: false
  sources:
