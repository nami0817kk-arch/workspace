title: 10月6日の題材
lead: シリーズ6本は決めました。ニュースは16件から○×をお願いします
note: '<b>ニュースに○×を付けてください。</b>今日の本編10本は、シリーズ6本＋ニュース4本（日本人3・ほか1）の予定です。シリーズの6本（21〜26）はこちらで決めました。外したいものがあれば×を付けてください。ニュースは見出しと記事の冒頭まで見ています。○が付いたものから本文と出典を確かめます。<br>メッシの代表最後の試合（ベナン戦）は日本時間7日の朝なので、今日は「試合の前」の回、結果は明日になります。代表ウィークでリーグ戦が無いので、火曜の「順位表」のシリーズは今週は休みます。'
items:
- num: 21
  slot: シリーズ
  fmt: クラブ紹介
  head: ラ・リーガ紹介⑦セルタ
  why: 9/26 に作った台本を、今日の数字・見立ての節・冒頭の一言（「スペインで、いちばん〜」と揃えない）に合わせて直して出す
  src: 作り置き（20260926_ll07_celta）
- num: 22
  slot: シリーズ
  fmt: 選手紹介
  head: 選手紹介⑥ジュード・ベリンガム（レアル・マドリード）
  why: ヴィティーニャの回で予告済み。クロアチア戦1点3アシストのあと、イングランドの新しい形で「本来の力が引き出されている」と英紙。エムバペ・ヴィティーニャと同じ形で作る
  src: 選手紹介の型（tools/player_intro.py）
- num: 23
  slot: シリーズ
  fmt: 試合の数字
  head: フランス対ベルギー、途中から入ったオリーセとドゥエが逆転を生んだ数字
  why: ジダン体制の無敗が続く。交代の2人が全ゴールに絡んだ。オリーセは10/3 の紹介の回の続き
  src: UEFA・FotMob・サッカーキング
- num: 24
  slot: シリーズ
  fmt: 監督の経歴
  head: 森保一、日本代表監督としての8年。国内最後の試合で「涙がこみ上げてきた」
  why: 契約は2027年1月のアジアカップまで。5日の決勝が国内で最後の試合。「監督業はおそらく続ける」。監督としての勝率と大会ごとの成績を数字で並べる
  src: サッカーキング（10/5）・JFA
- num: 25
  slot: シリーズ
  fmt: 記録
  head: ハリー・ケイン、イングランド代表の最多記録まであと少し
  why: クロアチア戦で2点、年間10点以上は3度目。英BBC「イングランド史上最高の選手の候補」。バイエルンとの契約の話も最終段階と報道
  src: BBC・Sky Sports・kicker（10/5）
- num: 26
