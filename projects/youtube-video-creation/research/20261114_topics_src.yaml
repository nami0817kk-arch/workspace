title: 11月14日のショート題材
lead: 海外フィード（今朝の gather）と日本語3サイト（ゲキサカ・サッカーキング・フットボールチャンネル）から10件。ユーザー確認なしの自動運用のため、Claude が○を付けて選びました（日本人6・海外4）。
note: 今日は土曜（14日）、日本時間の朝（7時台）に集めました。日本代表は今夜ブラジル戦（森保体制ラスト2連戦の1戦目）なので、試合の結果が絡む題材は作らず、前日・当日朝までの本人の言葉と記録に絞りました。日本人の題は9〜17時、海外は18時以降に予約。外した題：U-21日本代表（育成年代）・久保や遠藤の移籍話（まとめブログのみ）・田中碧への批判（まとめブログ）・予想スタメン（予想）・ヤマル/ムバッペ/ケイン126試合/前田/田中/中村/伊東（11/12〜13 に扱済み）・オウォノの出場停止（人の死が絡む）・Jリーグ・高校・女子・MLSは対象外。検索AI要約は使っていません。
