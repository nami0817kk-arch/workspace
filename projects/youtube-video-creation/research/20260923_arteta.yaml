  - id: said
    main: true
    heading: 本人が言っていたこと
    tier: 報道
    telop: 「私たちは皆、完全に同じ方向を向いている」
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - text: 'アーセナルのアルテタ監督が、**4年**の新しい契約で合意しました。'
        short_only: true
      - まとまる**4日前**、契約について聞かれた本人は、こう答えていました。
      - voice: アルテタ
        text: 私たちは皆、**完全に同じ方向を向いている。**
      - voice: アルテタ
        text: 時が来れば、契約はまとめる。心配することは何もない。
      - voice: アルテタ
        text: 両方が同じ野心と、同じ意志を持っている。だから、時間ができたときに解決する。
    sources:
      - https://www.skysports.com/football/news/13588507/mikel-arteta-contract-arsenal-boss-agrees-new-deal-to-extend-stay-at-premier-league-champions
      - https://x.com/search?q=from%3AFabrizioRomano%20Arteta&f=live
  - id: loss
    heading: その2日後の黒星
    tier: 報道
    telop: ブライトンに0対2。今季初めての黒星
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - その2日後、ブライトンに**0対2**。今季初めての黒星でした。試合直後の言葉です。
      - voice: アルテタ
        text: ブライトンのほうが良いチームだった。プレミアリーグでやらなければならない基本から、私たちはかけ離れていた。
      - voice: アルテタ
        text: あれだけの技術的なミス……プレーの原則を、何ひとつ守れなかった。
    sources:
      - https://www.skysports.com/football/news/13588507/mikel-arteta-contract-arsenal-boss-agrees-new-deal-to-extend-stay-at-premier-league-champions
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: これを見た人が書いていたこと
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - voice: ネット民
        text: アーセナルはヴェンゲルが22年、その後任のアルテタは、この契約が終わるころには11年以上いることになる。33年で監督が2人……それがアーセナルの伝統だ
      - voice: ネット民
        text: ブライトンに0-3で負けた後にアルテタへ4年契約。基準が落ちてる
      - voice: ネット民
        text: 悪い試合から目をそらさせる達人。交渉を切り上げて、テーブルに載っていたものをそのまま受け入れたんだ。俺たちの監督
      - voice: ネット民
        text: アルテタ政権更にめちゃくちゃ安定するじゃん。この間負けたけど。まあここ数年のチームの感じからしたら契約延長するのは当たり前だなと思う。
      - voice: ネット民
        text: 去年優勝しておいて本当によかった。でなきゃファンは大荒れだ。アルテタを信じる
      - voice: ネット民
        text: このタイミングでアルテタと契約延長するのはフロントからの信頼も感じられていいね
      - voice: ネット民
        text: この人が大好きだ。他のクラブの混乱を見てみろ。どこだって、うちの状況と一瞬で交換したがるよ
      - voice: ネット民
        text: エミレーツであと4年のアルテタ。アーセナルは明らかにプロジェクトを信じている。大きな問いは、その4年で何をもたらすかだ
      - voice: ネット民
        text: アルテタ長期契約素晴らしい。選手の延長にも影響あっていいことだ
      - voice: ネット民
        text: 1月にフォワードを少なくとも1人は取る、と書面に入れておいてくれ。できれば2人
      - voice: ネット民
        text: 次は誰だ？ライス？
        short_voice: true
