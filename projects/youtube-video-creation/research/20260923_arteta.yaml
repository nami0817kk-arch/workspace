    say:
      - アーセナルのアルテタ監督が、新しい長期契約で合意しました。期間は**4年**の見込みです。
      - 昇給があり、移籍の統括にも引き続き関わります。合意は口頭で、正式な手続きはこれからです。
      - そして**コーチ陣も全員**、新しい契約を結びます。
      - いまの契約は来年6月まで。2019年12月の就任なので、2030年まで率いることになります。
