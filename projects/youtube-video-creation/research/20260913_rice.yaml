# デクラン・ライスが、猛暑のワールドカップでの体調を語った（2026年9月13日）
#
# **出どころはサッカーキング。**イギリス紙『ガーディアン』の記事を伝えたもの。
#
# 引きは**「100パーセントの状態ではないことにもどかしさを感じる場面もあった」**。
# 出続けている選手が、**中では万全ではなかった**と明かしたところが芯。ここが山場（@main）。
#
# **けがの程度をこちらで診断しない。**「ハムストリングの神経系に問題」
# 「前年12月にハムストリング負傷」以上のことは書かない。
#
# **数字は記事どおり。**昨季は公式戦55試合・4,456分。3季連続で50試合超。
# 今季は公式戦4試合すべて先発
format: quote
# **引ける発言は4つ。**本人ひとりの言葉なので、その分だけ下げる
voice_min: 30
slot: premier_1
date: "2026年9月13日"

people:
  - デクラン・ライス

short_title: "ライスがW杯で抱えていたもの"

theme:
  id: rice_workload
  league: england
  kind: other
  topic: アーセナル
  title: デクラン・ライスが、猛暑のワールドカップで抱えていたものを明かした一言
  hook: 出ずっぱりの選手でした。本人は、万全ではなかったと言います。
  question: 体に何が起きていたのか

thumbnail:
  line1: ライスが明かしたW杯
  line2: 抱えていたのは ●●●●
  photo: "assets/photos/20260913_rice/01.jpg"
  tags: []
  points:
    - 昨季は公式戦55試合
    - 3季連続で50試合超

sections:
  - id: what
    heading: どれだけ出ている選手か
    tier: 報道
    telop: 昨季 公式戦55試合・4,456分
    narrator: キャスター
    card:
      type: bars
      title: デクラン・ライスの出場
      unit: 試合
      items:
        - label: 昨季の公式戦
          value: 55
          highlight: true
        - label: 今季ここまで（全て先発）
          value: 4
    say:
      - アーセナルのデクラン・ライスは、昨シーズン公式戦55試合、4,456分をプレーしています。
      - 3シーズン続けて50試合を超えました。今季もここまで4試合、すべて先発です。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260911/2203671.html

  - id: words
    heading: 本人が明かしたこと
    main: true
    tier: 報道
    telop: 「100パーセントの状態ではない」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 出続けた事実ではなく、**中では万全ではなかった**ところが芯
    card:
      type: quote
      title: デクラン・ライス
      text: 自分自身に対して、100パーセントの状態ではないことにもどかしさを感じる場面もあったよ
    say:
      # **並べる順を変えた**（2026-09-13）。もどかしさの一言が題名の答えなのに、
      # 尺を詰める処理に真っ先に消されていた。**締めの手前から削られる**ので、
      # 長い「猛暑」の一言をそちらへ回した
      - 昨季55試合に出た選手です。
      - {voice: デクラン・ライス, text: ハムストリングの神経系に問題を抱えていたことは、誰もが知っていると思う}
      - {voice: デクラン・ライス, text: 自分自身に対して、100パーセントの状態ではないことにもどかしさを感じる場面もあったよ}
      - {voice: デクラン・ライス, text: 非常に過酷だったプレミアリーグやチャンピオンズリーグを戦い抜いた後、あの猛暑の中でワールドカップを戦うというのは、やはり体に大きな負担がかかるものだ}
      # **「それでも出る」までを山場に入れる**（2026-09-13 ユーザー
      # 「ショートでも、それでも本人が言うことをつけて」）
      - それでも、本人はこう言います。
      - {voice: デクラン・ライス, text: 過去6シーズン、毎シーズン60試合近くプレーしてきたと思う。自分にはそれができると証明してきたわけだし、十分可能だと考えている}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260911/2203671.html

  - id: next
    heading: それでも、本人が言うこと
    tier: 報道
    telop: 「毎シーズン60試合近く」
    narrator: キャスター
    card:
      type: quote
      title: デクラン・ライス
      text: 今は本当に調子が良くて、コンディションも万全なので、この状態を維持していきたい
    say:
      - 今季もここまで4試合、すべて先発で出ています。
      - {voice: デクラン・ライス, text: 今は本当に調子が良くて、コンディションも万全なので、この状態を維持していきたい}
      - {voice: デクラン・ライス, text: 重要なのは状態を維持すること。つまりパフォーマンスのレベルと安定性を保つことだ}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260911/2203671.html
