title: 9月29日の題材（昼用）
lead: 夜のうちに出た代表戦の結果と、ベネズエラ戦の選手コメントから13件
note: <b>○×を付けてください。</b>今日は 10:00〜15:30 に6本（本編＋ショート）が予約済み。次に空くのは 16:00 で、<b>今日足せるショートはあと4本</b>（本編は制限なし）。ロマーノの投稿は手元の Chrome が応答せず読めていません。中身は記事の本文まで確かめてあります。
items:
- num: 1
  slot: 日本人
  head: 久保建英、瀬古歩夢を大絶賛。「今の瀬古選手にケチつける人はサッカー分かってないんじゃないか」
  why: '瀬古（ル・アーヴル）は9月の2試合で唯一の連続先発。久保は「クレバーになった」「ベテランのような風格」「過小評価」「信頼でメンタルが落ち着いた」と語った。本人の言葉が主役。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459925-459925-fl
  fmt: quote
- num: 2
  slot: 日本人
  head: 鈴木彩艶「今日のパフォーマンスは攻守ともにひどかった」。後半1分の失点と、雨のピッチで続いたミス
  why: '後半から出て27秒で失点。キャッチング・ハイボール・ビルドアップでらしくないミスが続いた。「自分の技術的なミス」「もう少し自分のアイデアを共有しないと」「アジアの戦いならもっと悪いこともある」。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459920-459920-fl
  fmt: news
- num: 3
  slot: 日本人
  head: 伊東純也、33歳で2戦連続アシスト「今が一番調子いい」。PKの場面で主審に言い続けていたこと
  why: '相馬のバックパスからのクロスで上田の同点弾。「タケに『絶対ファウルだから言って』と言われて主審に言っていた」「チェックしているからと言われ、待って、こっちのファウルが先になって良かった」。今日 11:00 の逆転VARの回とは久保側と伊東側で切り口が違う。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459923-459923-fl
  fmt: quote
- num: 4
  slot: 日本人
  head: 佐藤龍之介（バレンシア、19歳）、前半45分で途中離脱してスペインへ。「そのレベルに達する自信はある」
  why: 'アギーレ新監督のチーム再構築の時期で、出場機会を失わないよう森保監督の判断で帰還。「後半のようなメンバーとプレーするためにも、クラブでもっと結果を残して序列を上げる」。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459921-459921-fl
  fmt: quote
- num: 5
  slot: 日本人
  head: 小久保玲央ブライアンの横っ飛びに、ファンが叫んだ2文字「国防」。パリ五輪世代から付いていた呼び名
  why: '前半終了間際のヘディングをかき出した場面。「国防ブライアン心強えええ」など投稿が並ぶ。今日 12:00 の新顔5人の回で小久保のセーブは触れているので、あだ名と反応の側から作る回。
    '
  src: Football ZONE（9/29）
  url: https://www.football-zone.net/archives/676278
  fmt: news
  weak: true
- num: 6
  slot: 日本人
  head: 中野就斗、地元広島でのデビューで悔やんだワンプレー「国際舞台ではやられてしまう」。久保が称えた持ち味とは
  why: '後半1分にバルボに振り切られて失点の起点に。久保は中野の持ち味を認めた。今日 12:00 の回で中野は1節触れているので、本人の言葉の回にするなら。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459922-459922-fl
  fmt: quote
  weak: true
- num: 7
  slot: 日本人
  head: JFL出身の28歳・谷村海那がA代表デビュー「もう緊張してらんないな」。緊急事態の左サイドで献身
  why: '後半36分投入直後に渡辺剛が負傷して10人に。左サイドハーフに回って守った。JFLからA代表までの道が話の芯。
    '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459926-459926-fl
  fmt: quote
  weak: true
- num: 8
  slot: 試合結果
  head: イタリア、敵地でトルコに4対1。マンチーニ第2次政権の初白星は前半3点、初戦のベルギー戦0対2から一変
  why: 'バストーニ9分・フラッテージ22分・カヨデ27分・エスポジト50分。グループA1はイタリア・トルコ・フランス・ベルギー。得点者と時間で表が作れる。
    '
  src: サッカーキング（9/29）・ESPN
  url: https://www.soccer-king.jp/news/world/ita/20260929/2210760.html
  fmt: news
- num: 9
  slot: 試合結果
  head: ジダンのフランス、敵地でベルギーに1対0。エムバペ不在の試合をオリーズが88分に決めた
  why: '自陣でシェルキから受けてドリブルで運び、左足。前節から先発9人を替え、主将はメニャン。ジダン体制は2戦2勝で、次は10月2日ホームでイタリア。オリーズは有名選手の紹介③で台本を作ってある。
    '
  src: サッカーキング（9/29）・ESPN
  url: https://www.soccer-king.jp/news/world/fra/20260929/2210758.html
  fmt: news
- num: 10
  slot: 試合結果
  head: スウェーデン、ポーランドに3対1。ルーマニアはボスニアに2対4
  why: '同じ夜のネーションズリーグ。得点者と選手の言葉はまだ当たっていない（ESPN の結果のみ）。○なら記事を探す。
    '
  src: ESPN（9/28）
  url: https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?dates=20260928
  fmt: news
  weak: true
- num: 11
  slot: プレミア
  head: マンC幹部、114件の違反認定の報道にも強気。徹底抗戦で事態はさらに長期化へ
  why: '9/28 に2本（訴える権利を残した4クラブ／ギャラガーとキーン）を出しているので続報の扱い。幹部側の言い分が主役。
    '
  src: サッカーキング（9/29）
  url: https://www.soccer-king.jp/news/world/eng/20260929/2210771.html
  fmt: news
  weak: true
- num: 12
  slot: プレミア
  head: イングランド代表、コンサとオライリーが次戦欠場の可能性。トゥヘル監督「軽度の問題」
  why: 'アストン・ヴィラのコンサ、マンCのオライリー。代表ウィークの負傷の話で、鈴木彩艶の所属ヴィラにも関わる。
    '
  src: サッカーキング（9/29）
  url: https://www.soccer-king.jp/news/world/eng/20260929/2210773.html
  fmt: news
  weak: true
- num: 13
  slot: 日本人
  head: 田中聡、前半8分からの緊急出場「全てにおいてまだまだ」。絶好のスルーパスも
  why: '熊坂の負傷交代で入り、10人になったあとも中盤を支えた。本人の言葉が主役。
    '
