sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: クリスタル・パレス 3対0 ミドルスブラ
    narrator: キャスター
    card:
      type: table
      title: カラバオ・カップ3回戦 クリスタル・パレス 3-0 ミドルスブラ
      columns: ["時間", "得点者"]
      rows:
        - ["37分", "ストランド・ラーセン"]
        - ["53分", "ストランド・ラーセン"]
        - ["72分", "鎌田大地（今季初ゴール）"]
    say:
      - 現地時間8日のカラバオ・カップ3回戦、クリスタル・パレスがミドルスブラを3対0で下しました。
      - 鎌田大地はベンチスタートで、59分から途中出場します。
      - 先制は37分、ヨルゲン・ストランド・ラーセン。53分にも決めて、この日2点目を挙げました。
      - そして72分。最終ラインでボールを持った冨安健洋が、前線へ鋭い縦パスを送ります。
      - 抜け出したラーセンが反転して前へ出したところに、鎌田が走り込みました。
      - ペナルティエリアの少し手前から、ゴールキーパーの位置を見てループシュート。これが3点目になります。
      - 鎌田にとっては、今季初ゴールでした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007040/
      - https://web.ultra-soccer.jp/news/all/35690/

  - id: larsen
    heading: 同僚には何が見えていたか
    tier: 報道
    telop: 「最初は何をしているのか分からなかった」
    narrator: 解説
    say:
      - ここからが本題です。鎌田は、シュートを放つ前からすでに両手を広げていました。
      - この場面を作ったラーセンが、試合後に聞かれています。クラブの公式サイトが伝えました。
      - {voice: ストランド・ラーセン, text: 彼が決める予感はあった}
      - {voice: ストランド・ラーセン, text: だけど最初は、彼が何をしているのか分からなかったよ}
      - 70分すぎという時間帯も関係していました。
      - {voice: ストランド・ラーセン, text: 時間を稼ごうとしているのかと思った}
      - {voice: ストランド・ラーセン, text: だけど突然、あんな魔法のようなプレーを見せてくれた}
      - {voice: ストランド・ラーセン, text: 彼もあれが最後の選択肢だと分かっていたんだろう}
      - {voice: ストランド・ラーセン, text: やっぱりダイチのクオリティの高さだよね}
      - 鎌田自身のここまでについても、こう話しています。
      - {voice: ストランド・ラーセン, text: 彼はトッププレーヤーだし、チームに自信をもたらしてくれる}
      - {voice: ストランド・ラーセン, text: シーズン序盤は少し苦戦したし、不運な面もあったかもしれない}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35690/
      - https://www.soccer-king.jp/news/world/eng/20260909/2202733.html

  - id: tomiyasu
    heading: 起点になった側にも、意味があった
    tier: 報道
    telop: 冨安が移籍後初のフル出場
    narrator: 解説
    say:
      - 縦パスを出した冨安健洋にとっても、この試合は大きな意味がありました。
      - 冨安は8月7日にフリーでクリスタル・パレスへ加入しています。
      - 開幕節のエバートン戦で途中出場し、第2節のマンチェスター・シティ戦で移籍後初先発。74分までプレーしました。
      - ところが、そのシティ戦のあとにコンディションを心配する声が出ます。
      - 現地メディア『ウィー・アー・パレス』は、交代のときに足を気にする様子だったと指摘しました。
      - {voice: ウィー・アー・パレス, text: 負傷してしまった可能性がある}
      - その後に公開された練習映像で、冨安は全体練習に姿がなく、治療台で運動をしていたためです。
      - 5日のフラム戦はベンチ入りのみ。そして中2日で迎えたこの試合に、3バックの一角として先発しました。
      - 結果は90分フル出場で、チームは無失点。移籍後初めてのフル出場でした。
      - アーセナル時代から度重なる負傷に苦しんできた選手です。これだけで断定はできませんが、明るい材料になりました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007040/
      - https://www.footballchannel.jp/2026/09/09/post1007751/
