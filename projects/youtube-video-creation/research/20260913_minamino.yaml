# 南野拓実が8か月ぶりに遠征へ帯同した。それでもベンチ外だった（2026年9月13日）
#
# **出どころはゲキサカ。**モナコの監督が9月11日に話したもの。
#
# 引きは**「ベンチにも入れなかったのに、なぜ連れて行ったのか」**。
# 監督は「感覚を味わってほしかった」と答えている。ここが山場（@main）。
#
# **けがの程度をこちらで診断しない。**「昨年12月21日に左膝前十字靱帯断裂」
# 「8か月近く離脱」以上のことは書かない。
#
# **復帰時期を断定しない。**記事は「今後数試合、または国際Aマッチウィーク明け」
# の見込みと書いている。**その幅のまま置く。**
#
# **かわいそうに書かない。**監督の言葉は前向きなので、そのままの調子で終わる
