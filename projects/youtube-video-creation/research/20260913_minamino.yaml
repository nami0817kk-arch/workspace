      - {voice: モナコの監督, text: チームの完全な一員だと感じてもらい感覚を味わってもらい、ウォーミングアップにも参加してほしかったからだ}
      - {voice: モナコの監督, text: 8か月近く負傷離脱していたから、徐々にフィットネスを上げていく必要がある}
      - そして、チームの側の話もしました。
      - {voice: モナコの監督, text: チームメイトは南野をとても気に入っているから、よりポジティブなエネルギーをもたらしてくれる}
