    text: オーナーはブルーコという投資グループです。
    no_telop: true
  - image: assets/stats/pl_chelsea_cups.png
    text: 1部リーグの優勝は**6回**。FAカップは8回、ヨーロッパのタイトルは9回あります。
    no_telop: true
  - image: assets/stats/pl_chelsea_data6.png
    text: UEFAの主要な大会を**すべて獲った**、史上唯一のクラブです。
    no_telop: true
  - image: assets/stats/pl_chelsea_data5.png
