  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_chelsea_data.png
    text: 創立は**1905年**。ロンドンのクラブです。
  - image: assets/stats/pl_chelsea_data.png
    text: 本拠地には**4万44人**が入ります。
  - image: assets/stats/pl_chelsea_data.png
    text: オーナーはブルーコという投資グループです。
  - image: assets/stats/pl_chelsea_data.png
    text: 1部リーグの優勝は**6回**。FAカップは8回、ヨーロッパのタイトルは9回あります。
  - image: assets/stats/pl_chelsea_data.png
    text: UEFAの主要な大会を**すべて獲った**、史上唯一のクラブです。
  - image: assets/stats/pl_chelsea_data.png
    text: 直近のタイトルは2025年のクラブワールドカップ。決勝でパリ・サンジェルマンを破りました。
  - image: assets/stats/pl_chelsea_data.png
    text: 愛称は「ザ・ブルーズ」。青です。
