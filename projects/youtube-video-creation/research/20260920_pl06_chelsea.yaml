- id: origin
  heading: 順番が逆だった
  tier: 背景
  telop: スタジアムが先。断られたので、クラブを作った
  narrator: 解説
  say:
  - image: assets/images/pl_chelsea_story/scene.jpg
    text: 1904年、実業家のガス・ミアーズが、スタンフォード・ブリッジを手に入れます。
  - そして近くのクラブ、フラムに「ここを借りないか」と持ちかけました。
  - フラムは、断ります。
  - 借り手がいないなら、自分でクラブを作ればいい。そう考えて生まれたのがチェルシーです。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Chelsea_F.C.
  bg: assets/backgrounds/stadium_チェルシー.png
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 持って崩し、資金で買う
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 持って崩し、奪って速い
    - - 運営の型
      - 投資会社が42億で買収
    - - クラブの気質
      - 土地の主はサポーター
  say:
  - text: アロンソのサッカーは、ボールを持って崩し、奪ったら高い位置から速く前へ運ぶ。
    image: assets/photos/pl/chelsea_manager_5f5bf55b.jpg
  - 投資会社が買う型です。2022年に42億ポンド超で買収し、直近の赤字は英国記録の3億5500万ポンド。
  - 本拠地の土地とクラブ名の権利はサポーターの会社が持ち、開発業者への売却を防いでいます。
  sources:
  - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - https://en.wikipedia.org/wiki/Xabi_Alonso
