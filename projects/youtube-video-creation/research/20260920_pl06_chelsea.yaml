  say:
  - text: あだ名はもともと「ペンショナーズ」、年金暮らしの人たち。近くの王立チェルシー病院の退役軍人です。
    image: assets/images/pl_chelsea_episode/scene.jpg
  - 最初の紋章も、選手でもライオンでもなく、その赤い制服の退役軍人でした。
  - '**1952年**に監督になったテッド・ドレイクが、これを「古くさい」と言いました。'
  - 翌年、いまのライオンの紋章に替えさせました。
  - 年金暮らしのあだ名も、およそ半世紀でその役目を終えました。
  sources:
  - https://en.wikipedia.org/wiki/Chelsea_F.C.
