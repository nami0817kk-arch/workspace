      - text: 60分、ベリンガムが自分で浮かせたボールを、落とさずに蹴り込んで逆転。
        card: {type: table, title: レアル・マドリード 5-1 PSV, columns: [分, 得点], rows: [[32分, ペリシッチ（PK）], [50分, ヴァルベルデ], [60分, ベリンガム], [64分, エムバペ], [84分, エムバペ], [87分, ヴィニシウス]], highlight_row: 2}
      - text: 64分、キーパーからのパスを受けた佐野の、ダイレクトのパスが相手に渡ります。
        image: assets/images/20261125_sano_bernabeu/02_w.jpg
