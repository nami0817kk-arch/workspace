        image: assets/images/20261125_sano_bernabeu/06_w.jpg
        emph: true
      - text: 佐野は78分に交代。そのあとエムバペとヴィニシウスも決めます。
        card: {type: table, title: レアル・マドリード 5-1 PSV, columns: [分, 得点], rows: [[32分, ペリシッチ（PK）], [50分, ヴァルベルデ], [60分, ベリンガム], [64分, エムバペ], [84分, エムバペ], [87分, ヴィニシウス]], highlight_row: 5}
        image: assets/images/20261125_sano_bernabeu/02_w.jpg
      - text: 前半を1点リードで終えたPSVは、後半だけで5点を失いました。
