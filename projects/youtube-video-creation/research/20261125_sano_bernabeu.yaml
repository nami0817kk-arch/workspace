        image: assets/images/20261125_sano_bernabeu/07_w.jpg
      - text: 直後の32分、PKをペリシッチが決めて、PSVが先制します。
      - text: 前半の終わりにも、佐野がヘディング。これも左へ外れます。
      - text: PSVの1点リードで、前半を折り返しました。
      - text: 後半の頭、レアルは一度に3人を代え、攻め方を変えます。
        image: assets/images/20261125_sano_bernabeu/03_w.jpg
      - text: 50分に、ヴァルベルデが決めて同点。
