# 取材メモ（2026年10月24日）チュアメニ、バルベルデとの更衣室の件を自分のYouTube番組で説明（ニュースのショート。見せ方 Y＝チュアメニ本人の言葉から始める）
# 取材: 2026-10-24。ESPN 記事API（now.core.api.espn.com/v1/sports/news/50257348）で本文を全部読んだ。控え research/raw/20261024_tchouameni_espn_story.txt。
#   ・ESPN（Alex Kirkland、2026-10-23 18:30Z）「Tchouaméni: 'There was no fight' in Real Madrid dressing room with Valverde」
#       5月の更衣室の件で、バルベルデは頭を負傷して入院（hospitalised with a head injury）。2人はクラブから合計100万ユーロの罰金が科されました。
#       件はリーガでバルサと対戦する数日前に起きた。今季最初のクラシコは日曜、カンプ・ノウ。2人とも出場の見込み（set to feature）。
#       チュアメニは木曜、自分の YouTube 番組『The Bridge』で話した。
#       2人は今季、モウリーニョ監督のもとで中盤で並んで先発することが多い。モウリーニョは8月に「問題は見ていない」と話していた。
#       レアルは首位バルサに勝ち点6差。バルサはリーグ戦で全勝。バルベルデは直近2試合、右サイドバックで先発（ダンフリース、アレクサンダー＝アーノルドより先に）。
# 発言（ESPN が引いた英語の原文を訳した。言い換えない）:
#   チュアメニ: "I want to clear things up. There was no fight like people said there was."
#     "Things happen in a changing room, it happens, you see little scuffles and things. ... The only problem is, when you are at Real, something small like that becomes like that"
#     "It was such a minor thing" / "Now in the changing room, the coach said it... we're cool. There is no problem at all. On the field, it is completely the same and life goes on."
#     "Someone told me actually that stuff like this brings people closer"
#   モウリーニョ（8月）: "I decided to start from zero... I've seen that everything is normal. Seeing how they've interacted, you couldn't imagine what happened."
# 確度: 発言・罰金・負傷は 報道（ESPN 1社。本人の番組の原本は見ていない）。順位・勝ち点差は 報道（ESPN）。見立ては 背景。
# 使わなかったもの: 件の中身の細部（誰が何をしたか。記事に無い）。NFL のドキュメンタリーの話（脇道）。バルベルデ本人の言葉（記事に無い）。
#   「勝てば9差」（別の記事。この記事には無い）。2人を悪く見せる言い方は使わない。罰金は事実として1回だけ言う。
# 反応: 取らない（作らない）。approve は --no-voices で。
# 写真: Commons（CC BY-SA 4.0、Bryan Berlin 撮影のW杯2026のフランス代表の写真）7枚（01〜05・07・08）。行の image は横長の 04・05・07・08 を回す（01〜03 は縦の写真で、横に切ると頭の帯になるので short_photos だけ）。レアルの写真は Commons に新しいものが無く、代表の写真にした。
#   バルベルデの写真（Commons 2022、jikatu）は縦に切ると本人が小さく背を向けるので外した。ESPN の記事写真は Getty なので使わない。
