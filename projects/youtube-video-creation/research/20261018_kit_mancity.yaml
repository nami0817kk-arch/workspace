  telop: クラブは4種類、ウィキペディアの年は5つ。1976年は紋章院が認めた年で、新しい絵ではない
  narrator: 解説
  card: &id_cmp
    type: table
    title: エンブレムの数え方の違い
    columns:
    - 資料
    - 数え方
    rows:
    - - クラブ公式
      - 原型・1972・1997・2016
    - - ウィキペディア
      - 1970・1972・1976・1997・2016
    - - この動画
      - クラブの数え方
    highlight_row: 0
  say:
  - text: ただ、マンチェスター・シティのエンブレムの数え方は、資料によって違います。
    card:
      <<: *id_cmp
      highlight_row: 0
  - text: クラブは、原型、バラ、ワシ、2016年の丸い形の、4つです。
    card:
      <<: *id_cmp
      highlight_row: 0
  - text: ウィキペディアは、1970年、1972年、1976年と、年を分けて挙げます。
    card:
      <<: *id_cmp
      highlight_row: 1
  - text: 1976年は、紋章を管理する紋章院が、バラの紋章を正式に認めた年です。
    card:
      <<: *id_cmp
      highlight_row: 1
  - text: 紋章の研究論文は、それを盾の形に入れて、しばらく使ったと書きます。
    card:
      <<: *id_cmp
      highlight_row: 1
  - text: 船の上、バラの下という、1972年と同じ要素です。
    card:
      <<: *id_cmp
      highlight_row: 1
  - text: そこで、新しい絵としては、数えません。
    emph: true
    card:
      <<: *id_cmp
      highlight_row: 2
  - text: クラブの文章に、1970年のエンブレムは出てきません。
    card:
      <<: *id_cmp
      highlight_row: 2
  - text: この動画は、クラブの数え方に従います。
    card:
      <<: *id_cmp
      highlight_row: 2
