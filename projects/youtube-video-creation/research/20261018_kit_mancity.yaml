- id: view
  viewpoint: true
  heading: 見立て・絵は22年に1回、丸い形が4つのうち3つ
  tier: 背景
  telop: 絵の替わり方は平均22年に1回。丸い形は4つのうち3つ。ワシの19年に並ぶのは2035年
  narrator: 解説
  card: &id_ratio
    type: calc
    title: 丸い形は、4つのうちいくつか
    terms:
    - - 3つ
      - 原型・バラ・2016年
    - - 4つ
      - エンブレムの絵の種類
    - - 75%
      - 割った答え
    ops:
    - ÷
    - ＝
  say:
  - text: マンチェスター・シティのエンブレムが替わる速さを、数字で比べます。
    image: assets/images/20261018_kit_mancity/m02_badge_flag.jpg
    card: none
  - text: まず、絵が替わる間隔。
    card: none
  - text: 1972年から1997年までは25年。1997年から2016年までは19年。
    card: none
  - text: 足すと44年。2つの間隔で割ると、22年。
    card: &id_avg
      type: calc
      title: エンブレムの絵は、何年に1回替わったか
      terms:
      - - 44年
        - 1972〜2016
      - - 2つ
        - 25年と19年の間隔
      - - 22年に1回
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 22年に1回。ワシの19年は、それより3年短い計算です。
    emph: true
    card: *id_avg
  - text: ふたつ目は、形です。丸い形を数えます。
    image: assets/images/20261018_kit_mancity/m03_1970s_shirt.jpg
    card: none
  - text: 原型とバラと2016年が丸く、ワシだけが丸くありません。
    card: none
  - text: 4つのうちの3つを、割り算にします。
    card: *id_ratio
  - text: 75%。ワシの19年は、丸くない唯一の期間でした。
    emph: true
    card: *id_ratio
    mark:
      kind: circle
      item: 2
  - text: みっつ目は、バラの25年のうち、市の紋章だった5年です。
    image: assets/images/20261018_kit_mancity/m01_2627_home.jpg
    card: none
  - text: 5年を25年で割ります。
    card: &id_coat
      type: calc
      title: バラの25年のうち、リーグ戦が市の紋章だった割合
      terms:
      - - 5年
        - 1976〜81
      - - 25年
        - 1972〜97
      - - 20%
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 20%。5年に1年は、バラの年でも、胸は別でした。
    card: *id_coat
  - text: いまのエンブレムは、2016年から、10年目です。
    card: none
  - text: ワシの19年に並ぶのは、2035年になります。
    card: none
  - text: 次の絵を、クラブが決めたという記事は、読んだ範囲にありません。
    card: none
