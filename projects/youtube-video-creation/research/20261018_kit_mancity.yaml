# ユニフォームとエンブレムの歴史 マンチェスター・シティ（10/18 作成。プレミア⑪→⑳→①→⑩→⑪ の2周目ではなく、10/17 アーセナルの次の回）。
# 軸：胸のエンブレムが何回形を変えたか。何を1回と数えるかを冒頭で言い、数えて答えを出す（アーセナルの回と同じ型。言い回しは変える）。
# 一次情報（mancity.com 公式の本文）を requests のブラウザ User-Agent で読み、Wikipedia(en) の本文「Club badge and colours」節・
#   ガーディアン（PA 配信）・紋章学会の論文（Phillips 2015）と突き合わせた。2026-10-18 取材。ブラウザ操作なし。WebFetch 不使用。
#   指示にあった「Manchester City F.C. crest and colours」という名前の Wikipedia 記事は存在しない（404）。本文の同名の節を読んだ。
#   mancity.com の「club crest」「kit history」という名前の記事も存在しない（/news/club-news/club-crest は 404）。検索で出た下記の公式記事を読んだ。
#
# ---- 何を1回と数えるか（冒頭で言う）----
#   **「胸に付く図柄が、前とは別の形で出た年を1回。市の紋章をそのまま付けた試合・色の手直しは数えない」。**
#   数える材料は、クラブ公式「Badge consultation」（2015-10、mancity.com/news/club-news/club-news/2015/october/badge-announcement）と
#   「Badge Consultation ends on Saturday」（同 /badge-consultation）の、クラブ自身の数え方：
#     「Excluding the City of Manchester's Coat of Arms, we have had three key badges since the 1930s, with the present design being used since 1997.」
#     (2)The Original (1930s-1972)：盾・船・川。市の紋章を除けばいちばん長く使った。
#     (3)The Rose (1972-97)：川がバラに替わる。「Worn on league shirts from 1972-6 and 1981-1997 (Coat of Arms in the intervening years)」
#     (4)The Eagle (1997-present)：「abandonment of the round shape ... flat topped shield, an Eagle and, purely for style, three stars」
#   → 2016年の新エンブレム（クラブ公式 2015-12 / 2016-06）を4つ目に足す。
#   →数えると 原型・1972・1997・2016 の**4種類**。最初の原型を除いた**替わった回数は3回**（1972・1997・2016）。
#
# ---- 読んだ根拠の年の一覧（クラブ公式の原文）----
#   1884        最初に知られているシャツ：黒に、マルタ十字風の白い十字（club history ページ。「Some say ... Freemasonry ... others ... St Mark's」と2説）
#   1965        「A new club badge is developed in 1965, based around the central part of the City of Manchester coat of arms」（club history ページ）
#   1972        「The City badge is replaced with the red rose of Lancashire」（同）
#   1997        「City unveil a new club badge ... Superbia in proelio ‘Pride in battle’」（同）
#   2015-10-17  意見募集が始まる（土曜、対ボーンマス戦の前）／11-14 に終わる＝4週間（「will run for 4 weeks」）。
#   2015-12-26  新しい絵を公開（クラブ公式 mancity.com/citytv/.../new-badge-launch、ガーディアン 2015-12-26：対サンダーランド戦の前、エティハドの大型ビジョン）。
#               「Only one third (34%) of supporters expressed a desire to retain the existing Eagle badge shape.」
#               「round design, as used in two of the Club’s three previous crests」
#   2016-06-30  （木曜の夜）マンチェスター市庁舎に映し出し、正式の公開（クラブ公式 2016-06「City's new badge is here!」）。
#               「marks a return to its historical round shape ... the ship, the three rivers and the red rose of Lancashire」
#               「For the first time the Club has included the year of its foundation - 1894」
#   2016/17     シャツに付くのはこのシーズンの始まりから（ガーディアン）。
#
# ---- シャツの色（クラブ公式）----
#   「City DNA #65: How City came to play in red and black」：マルコム・アリソンが提案。ミラン（1967/68にカップウィナーズカップ）の色。
#     1968-10-05 に初めて着て 0-2 でエヴァートンに負け。1969年のFAカップを赤と黒で優勝（決勝の相手はレスター、ウェンブリー）。
#     翌シーズンにカップウィナーズカップとリーグカップ。「only been in existence for 50 years or so」。
#   「City and PUMA bring the sash home with our 2025/26 Home kit」：ホームの胸に斜めの帯（sash）が付くのは「For the first time in the Club's history」。帯は1970年代から（アウェー）。
#   「City and PUMA unveil the 2026/27 Home Kit」：空色のグラデーション・「metallic monochrome crest」。**エンブレムの形を変えたとは書いていない**（公式写真は丸い形のまま）。
#   空色がいつからかは、クラブの記事に**書いていない**（読んだ範囲）。
#
# ---- 食い違い（台本で断る／言わないもの。ここに残す）----
#   ・**エンブレムの数**：クラブ公式の意見募集の案内は「市の紋章を除き、1930年代から主要なエンブレムは3つ」＝2016年を足して4種類。
#     Wikipedia（Club badge and colours 節）は 1970・1972・1976・1997・2016 の年を挙げ、5つに見える。→ **台本はクラブの数え方に従い、違いを1節で断る**。
#   ・**最初のエンブレムの年**：クラブの意見募集は「Original (1930s-1972)」、クラブの年表は「1965年に新しい紋章を作った」、Wikipedia は「1970年に導入。1960年代なかばから文書に使っていた」。
#     → **台本は始まりの年を言わない**（「1972年まで」だけ言う）。
#   ・**1976年**：Wikipedia は「紋章院が1976年に、船とバラの紋章を円形で認めた」。紋章学会の論文（Phillips 2015）は「1976-12-23の付与は3回目の付与に含まれる。
#     円ではなく盾の輪郭に入れて、1970年代なかばからしばらくクラブが使った。長い歴史の大半は市の紋章がもと」と書く。→ 1976年は**登録の年であって、1972年のバラとは同じ要素**
#     （船の上・バラの下）＝新しい絵とは数えない。台本はそう断る。ただし「1972年と同じ要素」は2つの記述（Wikipedia・論文）の突き合わせで、クラブ公式は1976年を書いていない → 確度は背景。
#   ・**意見募集の期間**：クラブの10月の案内は「4週間」（10/17〜11/14＝28日）、12月の公開記事は「30-day consultation period」。→ 台本は「4週間」（10月の原文）。
#   ・**意見募集の開始日**：Wikipedia は 2015-10-16 に発表、クラブの案内は「土曜 10/17 の午前9時に始まった」。→ 台本は「10月」まで。
#   ・**ワシのエンブレムが付いた年**：クラブ年表は1997、Wikipedia は「商標登録できなかったため1997年に採用」（理由はクラブ公式に書いていない → 言わない）。
#   ・**エンブレムの下の言葉（Superbia in Proelio）の意味**：クラブ年表の英訳 ‘Pride in battle’ → 「戦いの誇り」（訳）。
#   ・**2011年のFAカップ決勝**：Wikipedia は「通常のエンブレム＋特別な文字」。クラブ公式を読んでいないので言わない。
#   ・**空色がいつから**：Wikipedia は「遅くとも1892年には青を着た証拠がある」（本文）。クラブ公式に年が無い → 台本は「はっきりしない」とだけ言い、年は言わない。
#
# ---- 言わないと決めたもの ----
#   ・**契約の額**：Wikipedia の表（プーマ 2025年から年約1億ポンド など）は ESPN の「情報筋」報道＋Wikipedia。クラブの発表に額が無い → 言わない。
#   ・**胸のスポンサー（サーブ1982年〜・エティハド2009年〜 など）**：クラブ公式に表が無く、Wikipedia だけが根拠 → 言わない（エティハド・プーマの社名は写真に写る範囲で触れない）。
#   ・**クラブの歴史の他の話（1894年の名前の変更以外）・女子チーム・育成年代**。
#   ・**エンブレムの下の細かい意味（船＝マンチェスター船舶運河の意味 など）**は Wikipedia 単独 → 言わない。「船と3つの川とバラ」だけ、クラブ公式（2016-06）の言い方で。
#   ・**ガーディアンが書く「金の船が約1世紀前から使われてきた」「星は嘲笑されてきた」**：評価の言葉 → 言わない。
#   ・**ジョー・ハートの感想**など選手の発言：本題から外れる → 言わない。
#
# ---- 自分で数えた数（検算した）----
#   ・絵の種類：原型・1972・1997・2016 → 4種類／替わった回数 4−1 ＝ 3回（1972・1997・2016）。
#   ・間隔：1972→1997 ＝ 25年／1997→2016 ＝ 19年／44年（2016−1972）÷ 2つの間隔 ＝ 22年に1回。
#   ・バラのあいだのリーグ戦のシャツ：1972〜76 ＝ 4年／1976〜81 ＝ 5年（市の紋章）／1981〜97 ＝ 16年。4+5+16 ＝ 25（1997−1972 と一致）。5 ÷ 25 ＝ 20%。
#   ・丸い形：原型・バラ・2016 の3つ（ワシだけが丸くない）／3 ÷ 4 ＝ 75%。クラブ公式「two of the Club’s three previous crests」とも合う（過去3つのうち2つ）。
#   ・2016 + 19 ＝ 2035（ワシの19年に並ぶ年）。2026 − 2016 ＝ 10（いまのエンブレムは10年目）。
#   ・意見募集 10/17〜11/14：14日（10/17→10/31）＋14日（11/1→11/14）＝ 28日。
#   ・新エンブレム公開 2015-12-26 → 市庁舎 2016-06-30：6か月と4日。
#
# ---- 一次情報に届かなかったところ ----
#   ・エンブレムの変遷の年（1930年代の始まり・1970・1976）は Wikipedia と論文で補った（確度は背景）。クラブの「club crest」専用の記事は見つからなかった。
#   ・mancity.com の「history」のページ（club/manchester-city-history）の年表は読んだが、空色の始まりは書いていない。
#   ・Guardian の記事は PA 配信（報道）。クラブ公式の補強として「2016/17 から」の1点だけに使った。
#
# ---- 写真（assets/images/20261018_kit_mancity/、出典は credits.json） ----
#   m01_2627_home = 2026/27 ホームのキット写真（mancity.com の記事の og:image、1920x1080。人物なし。胸の丸いエンブレムが写る）。
#   m02_badge_flag = 2015-12 の新エンブレムの大きな旗（mancity.com City TV の「New badge revealed」の画像、1500x844。エティハドのピッチ）。
#   m03_1970s_shirt = 1970年代のホームのシャツ（mancity.com の history ページの画像、1620x911。胸にバラのエンブレム）。人物はファイル名（colinbell）からの推定。**台本で名前を出さない**。
#   すべて取り込んだあと開いて見た（透かしなし・代理店の表記なし・頭と顎が入る）。クラブ公式（権利は晴れていない＝引き受ける危険）。
#   （1024x576 の 2枚＝市庁舎の映写・2025/26 ホームは、1.9倍に引き伸ばすため外した。赤黒の縞の写真も原寸1023pxで外した）
#   クラブの現行エンブレム assets/crests/マンチェスターシティ.png（2016年の丸い形）・assets/backgrounds/cut_マンチェスターシティ.png（節の頭の紋章の差し込み）。権利は晴れていない。
#   **過去のエンブレムの画像は使っていない**（権利が晴れない）。板は文字だけの年表。ただし m03 の写真には1970年代の胸のバラが写っている（クラブ公式の写真）。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**。ここの thumbnail は点検用の1案（案A）。
