- id: chest
  heading: 胸には、いつ何が付いていたのか
  tier: 確定
  official: true
  telop: 最初に知られるシャツは1884年の黒。1976〜81年のリーグ戦は市の紋章。2016年から丸い形
  narrator: 解説
  card: &id_chest
    type: timeline
    title: シャツの胸に付いたもの（クラブ公式）
    rows: &rows_chest
    - - 1884年
      - 黒に白い十字
    - - 1972〜76
      - リーグ戦はバラ
    - - 1976〜81
      - リーグ戦は市の紋章
    - - 1981〜97
      - バラが戻る
    - - 1997〜2016
      - ワシの盾
    - - 2016年〜
      - 丸いエンブレム
    focus: 1884年
  say:
  - text: 次は、マンチェスター・シティのシャツの胸の中身を見ます。
    image: assets/images/20261018_kit_mancity/m01_2627_home.jpg
    card: none
  - text: 最初に知られているシャツは、1884年。黒に、白い十字でした。
    emph: true
    card:
      <<: *id_chest
      highlight_row: 0
  - text: 十字は教会との縁だという説と、フリーメイソンとの縁だという説があります。
    card:
      <<: *id_chest
      highlight_row: 0
  - text: 1972年からは、リーグ戦のシャツに、バラのエンブレムが付きます。
    image: assets/images/20261018_kit_mancity/m03_1970s_shirt.jpg
    card:
      <<: *id_chest
      highlight_row: 1
  - text: ところが1976年から81年までは、リーグ戦のシャツに市の紋章でした。
    emph: true
    card:
      <<: *id_chest
      highlight_row: 2
  - text: 5年のあと、1981年にバラが戻り、1997年まで続きます。
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 1997年から2016年は、ワシの盾です。
    image: assets/images/20261018_kit_mancity/m02_badge_flag.jpg
    card:
      <<: *id_chest
      highlight_row: 4
  - text: クラブは、エンブレムの議論は、とくにカップ決勝の前後に大きくなった、と書きます。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 2016年からは、丸いエンブレムです。
    card:
      <<: *id_chest
      highlight_row: 5
  - text: 2026/27のホームでは、胸のエンブレムが、単色の金属調になります。
    image: assets/images/20261018_kit_mancity/m01_2627_home.jpg
    card: none
  - text: 形は丸いままなので、色の手直しとして、数えません。
    card: none
  sources:
  - https://www.mancity.com/club/manchester-city-history
  - https://www.mancity.com/news/club-news/club-news/2015/october/badge-consultation
  - https://www.mancity.com/news/club-news/club-news/2015/october/badge-announcement
  - https://www.theguardian.com/football/2015/dec/26/manchester-city-unveil-new-club-crest
  - https://www.mancity.com/news/club/manchester-city-202627-home-kit-launched-63914816
- id: colour
  heading: 空色のシャツに、赤と黒は、いつ入ったのか
  tier: 確定
  official: true
  telop: 赤と黒の縞を初めて着たのは1968年10月5日。1969年のFAカップを赤と黒で優勝。ホームの帯は2025/26が初
  narrator: 解説
  card: &id_colour
    type: table
    title: シティのシャツの歩み（クラブ公式）
    columns: &cols_colour
    - いつ
    - できごと
    rows: &rows_colour
    - - 1884
      - 最初のシャツは黒
    - - 1968-10-05
      - 赤黒の縞を初めて着る
    - - 1969
      - FAカップを赤黒で優勝
    - - 1970
      - 欧州杯とリーグ杯を獲る
    - - 2025/26
      - ホームに初めて斜めの帯
    highlight_row: 0
  say:
  - text: 最後に、マンチェスター・シティのシャツの色です。
    image: assets/images/20261018_kit_mancity/m01_2627_home.jpg
    card: *id_colour
  - text: 空色がいつから始まったかは、クラブの記事に載っていません。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 赤と黒の縞は、アリソンコーチの提案でした。
    image: assets/images/20261018_kit_mancity/m03_1970s_shirt.jpg
    emph: true
    card:
      <<: *id_colour
      highlight_row: 1
  - text: イタリアのミランが優勝した色に、あやかった提案でした。
    card:
      <<: *id_colour
      highlight_row: 1
  - text: 1968年10月5日に初めて着て、エヴァートンに0対2で負けました。
    card:
      <<: *id_colour
      highlight_row: 1
  - text: ファンは不満でしたが、翌1969年のFAカップは、この色で優勝します。
    card:
      <<: *id_colour
      highlight_row: 2
  - text: 次のシーズンには、欧州のカップ戦とリーグカップも獲りました。
    card:
      <<: *id_colour
      highlight_row: 3
  - text: 2025/26には、ホームのシャツに、初めて斜めの帯が付きました。
    image: assets/images/20261018_kit_mancity/m01_2627_home.jpg
    card:
      <<: *id_colour
      highlight_row: 4
  - text: 帯は1970年代から、アウェーで着られてきたものです。
    card:
      <<: *id_colour
      highlight_row: 4
