    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
  - text: 2024年のヤマルは、9試合に全部出場して724分。4得点5アシストです。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 0
  - text: その年の11月、17歳で受賞者に選ばれました。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 0
  - text: 2025年のドゥエは、同じ時点で169分。9月半ばから、けがで離れていました。
    image: assets/images/20261007_young_goldenboy/05_v.jpg
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 1
  - text: 724分と169分。4倍以上の差があっても、2人とも受賞しています。
    emph: true
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 1
  - text: ドゥエの1年の山は、5月31日のチャンピオンズリーグ決勝でした。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 1
  - text: インテルに5対0の勝ち。チームの5点のうち3点に、ドゥエが絡みました。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 1
  - text: 賞を作ったマッシモ・フランキは、選び方をこう書いています。
    image: assets/images/20261007_young_goldenboy/06_v.jpg
    card: none
  - voice: マッシモ・フランキ
    text: 候補の出来は、直近の12か月で見ています。
  - text: クバルシの12か月には、スペイン代表でつかんだワールドカップの優勝があります。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 2
  - text: 大会の最優秀若手選手の賞も受けています。今季の出場時間は、2人のあいだです。
    card:
      type: table
      title: 10月上旬までのリーグ戦（受賞した年）
      columns: *vwcol
      rows: *vwrow
      highlight_row: 2
  - text: 投票は27か国の記者50人。1人が5人を選び、1位に10点、2位に7点を配ります。
    card: none
  - text: 受賞者の発表は11月の会見。12月に、トリノで表彰されます。
    card: none
