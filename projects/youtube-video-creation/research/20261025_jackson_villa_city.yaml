# 取材メモ（2026年10月25日）ニコラス・ジャクソン、マンC相手に2発（ニュースのショート。見せ方 Y＝本人の一言から始める）
# 題材の元: research/20261025_topics_src.yaml 番号6（ユーザー○）。
# 取材: 2026-10-25。requests（ブラウザUA）と ESPN の API で本文を全部読んだ。
#   ・BBC スポーツ「From Chelsea reject to Watkins 'upgrade' - Jackson makes fast Villa start」
#       - チェルシーから最大6,500万ポンド（up to £65m）で今夏加入。ワトキンスの直接の後釜。25歳のセネガル代表。
#       - ヴィラで最初の11試合で7点、最近の6試合で6点。CLは全勝のスタート。
#       - チェルシーではプレミア65試合24点、平均210分に1点、シュートの決定率15%。ヴィラではリーグ7試合4点、138分に1点、決定率21%。
#         xG を2上回っている。BBC 自身が「標本はずっと小さい」と断っている。
#       - この試合のヴィラの枠内シュート2本は、どちらもジャクソンの右足で、どちらもゴール。
#       - ワトキンスはヴィラでプレミア221試合91点、8月にアル・ヒラルへ。
#       - エメリとはビジャレアル時代に一緒（3年）。チェルシーは3,500万ポンドで獲得。
#       - 本人（BBC Match of the Day）'The players, the manager, the team - everything is incredible' 'I'm very happy that I'm here and hopefully we can do amazing things together.'
#       - エメリ（MOTD）'I knew him at Villarreal ... I know, as well, his humility.'
#   ・ESPN（ESPN News Services、10/24 18:09Z）「Man City lose 100% Premier League record with defeat at Aston Villa」
#       - ジャクソン 'It is incredible. It was difficult, but we got the win and that is the most important thing. Now we can focus on the next one.'
#       - 6分、グエヒがボールを収められずマッギン→ジャクソンが先制。2点目は1時間のところ（試合記録は60分）、ムバイェのパスからドンナルンマの下を抜けた。今季4点目（リーグ）。
#       - シティはヴィラ・パークでリーグ4連敗。プレミアで今季初の黒星。
#       - 鈴木彩艶が何度もセーブ。グヴァルディオルの強烈なシュートをバーへ（「決定的だった」）。
#   ・ESPN 試合記録（gameId 401879256）: 2-1。6分ジャクソン（アシスト マッギン）、52分ハーランド、60分ジャクソン（アシスト ムバイェ）。
#       ヴィラ：シュート8・枠内2・支配率36.8%・セーブ6。シティ：シュート15・枠内7。
#   ・AP（ESPN 経由）: シティはリーグ8連勝を狙っていた。ジャクソンは全大会で今季7点。
# 自分で数えた比べ（見立て）: 210分 ÷ 138分 ≒ 1.5。1点までにかかる時間が、チェルシー時代の約3分の2（72分短い）。
# 確度: 確定（スコア・得点者・時間は ESPN の試合記録）。移籍金・分あたりの数字は報道（BBC）。
# 鈴木彩艶: 同じ試合。1行だけ（6セーブは ESPN の試合記録のヴィラの Saves）。主にしない。
# 反応: 0件。作らない。approve は --no-voices で。
# 読み: 「ワトキンスの後」は「ノゴオ」と読まれたので「あと」とひらがなで書いた。
# 写真: Commons。01・03・04・05 は Bryan Berlin（CC BY-SA 4.0、2026年W杯 フランス対セネガル）、06 は Timmy96（CC0、2025年4月のチェルシー）。
#   ヴィラでの写真は見つからない（BBC・ESPN の記事の写真は Getty）。04 は背中の「N. JACKSON 11」で顔は写らない。05 は縦版が720px幅なのでショートに使わない。
