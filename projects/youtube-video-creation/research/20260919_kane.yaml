      - この結果を見ていた人たちのコメントです。
      - {voice: ネット民, text: ケインの通算100ゴール、オリーセハットトリック、サイバリのリーグ初ゴール。気持ちの良い勝ちっぷりだった}
      - {voice: ネット民, text: 最高の朝だね。今季も頼みます。まずは定位置にもっかい戻ろう}
      - {voice: ネット民, text: 3シーズンと数試合で100ゴール……1試合1ゴール。すげぇ}
      - {voice: ネット民, text: ウニオン・ベルリンはバイエルン相手に戦術を間違えたよな。オリーセの好調ぶりが凄いね}
      - {voice: ネット民, text: ニャブリの復帰とムシアラの今季初フル出場。サイバリもゴール決めたし2列目のポジション争いが熾烈だね}
      - {voice: ネット民, text: バイエルン、バルセロナ、鹿島……最近7得点ゲームが多いな}
      - {voice: ネット民, text: こんな一方的な試合でも出してもらえない伊藤って……, short_voice: true}
      - {voice: ネット民, text: 伊藤はかなり序列が下がったよね。どこか出られそうなチームに移籍したほうが良さそう}
      - {voice: ネット民, text: もうバイエルンは前半だけ2軍でやってあげたら？}
      - {voice: ネット民, text: 色々言われてたキム・ミンジェだけど、コンパニに信頼されているな。1節と3節はスタメンで使われている}
