    say:
      - ブンデスリーガ第4節、バイエルンは本拠地でウニオン・ベルリンを迎えました。
      - 18分にジャマル・ムシアラが先制すると、39分、バイエルンがPKを獲得。
      - キッカーはハリー・ケイン。ゴール左下に沈め、これがブンデスリーガでの節目、100点目のゴールとなりました。
      - 前半だけで3点をリードすると、後半もオリーズがハットトリック、ケインも54分に追加点。
      - 試合はバイエルンが7-0で大勝。伊藤洋輝はベンチスタートで、出番はありませんでした。
