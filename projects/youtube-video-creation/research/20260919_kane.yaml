# ケインがブンデスリーガ通算100ゴール、バイエルンはウニオン・ベルリンに7-0（2026-09-19）
#
# **news の型。**記録の中身（98試合・従来記録を31試合更新）が主役。
# 「100ゴール」には2種類ある——**公式戦通算**（2025年9月・104試合）と
# **リーグ戦単独**（今回・98試合）。**混同しない。**今回はリーグ戦単独の記録。
#
# 本人の言葉は2つの取材から。①ゴール直後（AP／ESPN、試合後会見）
# ②バロンドールについて（マルカのインタビュー、9/18掲載）。**別の場面の発言を
# 混ぜているので、それぞれ「いつ・どこで」を語りに残す。**
#
# 伊藤洋輝はベンチ外の出番なしだった事実は本文に入れるが、日本との接点を
# 無理に膨らませない（この試合の主役はケイン）。
#
# **反応は Yahoo!ニュースのコメント欄から。**海外の匿名反応（現地掲示板・
# nofootynolife 等）はケインが対象だと網に無く、この日のうちには見つからなかった。
# **取れなかった。**バロンドール論争そのものへの海外の反応は世界サッカーファン等に
# あるが、ドメインが情報源の網に無いため出典として使わない。
