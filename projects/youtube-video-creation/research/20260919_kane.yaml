  - id: record
    heading: どれくらいの速さなのか
    main: true
    tier: 報道
    bg: assets/backgrounds/kane_20260919.png
    telop: 98試合で100ゴール、従来記録を31試合更新
    narrator: 解説
    card:
      type: table
      title: ケインのブンデス100ゴール
      columns: [項目, 数字]
      rows:
        - [到達した試合数, "98試合"]
        - [従来の最速記録, "129試合（ディーター・ミュラー、1970年代）"]
        - [短縮した試合数, "31試合"]
        - [バイエルンでの公式戦通算, "154試合151得点"]
    say:
      - ケインがこの記念すべき100ゴールに要したのは、わずか98試合。
      - これまでの最速記録は、1970年代にケルンでプレーしたディーター・ミュラー氏が持っていた129試合でした。
      - ケインはこれを31試合も上回り、ブンデスリーガ史上最速で100ゴールに達した選手になりました。
      - 2023年夏にトッテナムから加入したケインは、公式戦通算でも154試合151得点という数字を残しています。
      - 試合後、ケインは本人の言葉でこう振り返っています。
      - {voice: ケイン, text: 正直、ブンデスリーガで100ゴールに到達できて誇らしい。プレミアリーグでは経験していたけど、違うリーグで達成できたのはとても誇らしいことだ}
      - {voice: ケイン, text: とにかくチームに感謝したい}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/19/post1014342/
      - https://www.espn.com/soccer/story/_/id/49965151/harry-kane-fastest-record-100-bundesliga-goals-bayern-munich

  - id: said
    heading: バロンドールについては
    tier: 報道
    bg: assets/backgrounds/kane_20260919.png
    telop: 「昨シーズンはもう過去のこと」
    narrator: キャスター
    say:
      - この記録の前日にあったインタビューで、ケインは10月26日に発表されるバロンドールについて聞かれました。ケインは有力候補の一人に名前が挙がっています。
      - {voice: ケイン, text: バロンドール受賞は自分次第ではない。投票する人たちにかかっている}
      - {voice: ケイン, text: だから、僕としては、昨シーズンはすでに過去のことなんだ。今は今シーズンに集中しており、さらに何ができるかを楽しみにしている}
      - 昨シーズンの公式戦73ゴールという数字を残したうえで、ケイン自身は次のシーズンにもう目を向けています。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/ger/20260918/2206507.html

