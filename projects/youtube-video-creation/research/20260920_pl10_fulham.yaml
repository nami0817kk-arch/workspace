- id: titles
  heading: ヨーロッパを獲った日
  tier: 背景
  telop: 決めたのは稲本潤一。決勝でハットトリック
  narrator: キャスター
  card:
    type: table
    title: 獲ってきたもの
    columns:
    - ''
    - ''
    rows:
    - - インタートトカップ
      - 1回（2002年）
    - - 決勝のハットトリック
      - 稲本潤一（2002年8月27日）
    - - FAカップ
      - 準優勝（1974-75）
    - - ヨーロッパリーグ
      - 準優勝（2009-10）
  say:
  - クラブの歴史でただ1つのヨーロッパのタイトルを決めたのは、**稲本潤一**でした。
  - 2002年、夏に行われていたヨーロッパの大会、インタートトカップの決勝です。
  - 相手はイタリアのボローニャ。敵地での第1レグは、2対2の引き分けでした。
  - 第2レグは12分、47分、50分、稲本の**ハットトリック**で3対1。2試合合計5対3で勝ちました。
  - 稲本はこのクラブで2シーズンを過ごし、9得点を残しています。
  - 大きな決勝はほかに2度。1975年のFAカップと2010年のヨーロッパリーグ、どちらも準優勝でした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Fulham_F.C.
  - https://en.wikipedia.org/wiki/Junichi_Inamoto
  - https://en.wikipedia.org/wiki/2002_UEFA_Intertoto_Cup
  - https://en.wikipedia.org/wiki/Craven_Cottage
  bg: assets/backgrounds/stadium_フラム.png
