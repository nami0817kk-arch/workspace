  say:
  - text: 本拠地の名前、クレイヴン・コテージは、**1780年**にクレイヴン男爵が建てた小さな屋敷から来ています。
    image: assets/images/pl_fulham_episode/scene.jpg
  - その建物は1888年の火事で焼けました。いまスタンドの角にある「コテージ」は、1905年に建てたものです。
  - 選手の更衣室であり、選手の家族がバルコニーから試合を見る場所でもあります。
  sources:
  - https://en.wikipedia.org/wiki/Craven_Cottage
