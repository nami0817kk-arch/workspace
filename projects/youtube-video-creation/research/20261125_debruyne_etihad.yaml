    heading: エティハドに戻ったデ・ブライネに、何が起きたのか
    tier: 報道
    telop: デ・ブライネ、ナポリの選手としてエティハドで75分
    say:
      - text: ナポリのデ・ブライネが、古巣シティの本拠地エティハドに戻りました。
        image: assets/images/20261125_debruyne_etihad_cm133/01_w.jpg
      - text: 試合の前、デ・ブライネはこう話していました。
      - voice: デ・ブライネ
        text: 去年ここに来たときは、26分しかプレーしませんでした。
      - voice: デ・ブライネ
        text: まだサッカーができると、見せられたらいい。
        emph: true
      - text: 昨季の帰還は、味方が21分に退場。デ・ブライネは26分で代えられていました。
      - text: 今回は、スタジアムが試合の前から彼を迎えます。
      - text: 「King Kev」、王様ケヴィンという横断幕。
      - text: シティ時代の写真に「我らの王」と書いた紙も、スタンドで配られました。
      - text: ボールに触るたびに、スタンドから拍手が起きます。
      - text: そして75分。デ・ブライネが代わると、シティのファンが立ち上がって送り出しました。
        image: assets/images/20261125_debruyne_etihad_pair/01.jpg
        emph: true
      - text: 昨季の26分から、今回は75分。試合は2対2の引き分けでした。
