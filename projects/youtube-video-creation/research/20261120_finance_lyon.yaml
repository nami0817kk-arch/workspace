# 題材：デロイト順で未出の大きいクラブ（セルティックの次）。リヨンは収入2億2230万ユーロ（2025-26）。2025-26 の決算（2026-10-21 公表）が最新。
#   外した候補：スポルティング・ポルト（一次の決算書に辿り着けず）、ラツィオは11/22に使用、レバークーゼン・ライプツィヒ（一次を読めない）。
# ★日本との接点：中村敬斗（2026夏にランスから1550万ユーロで獲得）。台本は発表文の事実だけ。
# ★出どころ：Olympique Lyonnais Groupe「Résultats annuels 2025/2026」（2026-10-21 公表、会計監査は手続き中）。
#   読んだのは abcbourse.com に載った発表文の転載。公式の発表文PDFそのものは未確認。
#   前の年（2024-25）の数字は同社の2025-11-28 の発表文PDF（英語）を pypdf で読んで突き合わせた（収入2億7370万・人件費1億7770万・EBITDA −4770万・最終 −2億110万）。
