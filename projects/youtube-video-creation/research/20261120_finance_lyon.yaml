  question: リヨンは2025-26に、人件費を前の年より約36%減らし、本業の稼ぎをほぼ収支ゼロまで戻した。それなのに、最終の損益は8710万ユーロの赤字。赤字は、何から生まれたのか
  lead: 人件費を約36%減らして、本業はほぼ収支ゼロ。それでも、赤字は8710万ユーロ。リヨン。
  opening_image: assets/images/20261120_finance_lyon/01_w.jpg
  takeaway: リヨンの2025-26の決算（2026年6月まで、会計監査の手続き中の発表）は、収入が2億2230万ユーロ（約19%の減り）、人件費は約36%減の1億1450万ユーロで、本業の稼ぎ（EBITDA）はマイナス470万ユーロまで戻った。最終の損益は8710万ユーロの赤字。償却・評価減・引当の2億6980万ユーロのうち約2億510万は貸付や未収の評価減で、一方で前の親会社側への債務2億4220万の免除が収益に入っている。情報は11月12日時点。
  short_title: リヨン、人件費36%減でも赤字8710万ユーロ
