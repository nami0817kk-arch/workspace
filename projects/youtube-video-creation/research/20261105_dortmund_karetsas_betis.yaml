#         ②sport1 は交代を「後半の中ごろ」と書くが、ESPN と t-online は34分（前半）。台本は34分（ESPN）。
#         ③スコアの書き方（サッカーキング「2－1」、ESPN は「ドルトムント2 ベティス1」）は一致。
