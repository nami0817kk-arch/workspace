#   ・sport1.de「Karetsas-Premierentor erlöst den BVB」（全部読んだ。DAZN の試合後インタビューの引用）:
#       カレツァス: „Um ehrlich zu sein: Als ich eingewechselt wurde, kam ich gerade von der Toilette. … Deswegen kam es keine Instruktionen. Einfach nur nach vorne gehen und intensiv spielen. Und das war mein Spiel“
#       コヴァチ: „Ich hab ihn gesucht. Ich hatte überlegt: Komm, jetzt gehst du rein, aber dann war er nicht da. Auf die Geschichte habe ich dann Carney (Chukwuemeka) gerufen – und schwupp, kam er um die Ecke. …“
#       「ドルトムントでの公式戦初ゴール」「12位、勝ち点で並ぶのはベティスほか7チーム、4位まで（コモ）」。
#   ・sportschau.de（ARD）: カレツァス（DAZN）„Ich habe ehrlich gesagt kaum Anweisungen bekommen, weil ich da gerade von der Toilette kam“ ← sport1 と言い回しは少し違うが、内容（トイレから戻ったところ・指示はほとんど無し）は一致。台本は共通の内容だけを使う。
#   ・t-online.de（DAZN の取材）: コヴァチ „Ich habe ihn gesucht“／“Plötzlich war er nicht da …“／“ganz gute Haken geschlagen wie so ein Hase“／“Es ist schwierig, ihn zu verteidigen“。ギラシが長引けばカレツァスの先発を増やす見込みをコヴァチが示した（t-online の言い換え。直接の引用ではない）。
#   → 確かめられた＝本人（コヴァチ監督・カレツァス）の言葉。DAZN の試合後の取材を複数の独立した報道が同じ内容で引いている。台本は独語を日本語にした（語順はなぞらない）。
