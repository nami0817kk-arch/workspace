- id: colours
  heading: 赤と白の縞は、最初からの色だったのか
  bg: assets/images/20261027_kit_sunderland/f01_wembley.jpg
  tier: 背景
  narrator: 解説
  telop: 最初は青一色。1884年に赤と白、縦縞は1887年から。パンツの黒は2018年にも揺れた
  card: *colours
  say:
  - text: 続いては、色。サンダーランドのホームは、赤と白の縦縞に、黒いパンツです。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  - text: でも、1879年の創立のころの色は、青一色でした。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *colours
      highlight_row: 0
    emph: true
  - text: 1884年12月、赤と白に。最初は、左右で色を分けたシャツです。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *colours
      highlight_row: 1
  - text: 縦縞になったのは、1887年。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *colours
      highlight_row: 2
  - text: 1913年のFAカップ決勝。12万人の前で、胸には、街の紋章を付けていました。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 相手はアストン・ヴィラ。0対1で、優勝には届きません。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 1950年代には、照明の下で見えやすいよう、光る素材の赤いシャツを着た試合も。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 1972年10月、監督ボブ・ストーコウが、最初にしたこと。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: それは、パンツを、伝統の黒に戻すことでした。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card:
      <<: *colours
      highlight_row: 3
    emph: true
  - text: 1981年からの2年は、フランスのル・コック・スポルティフの、変わったデザイン。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: これは、とても不評でした。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: 2018年には、パンツを赤にします。新しい出発の印でした。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card:
      <<: *colours
      highlight_row: 4
  - text: ところが、サポーターの反発は強く、ホームは黒、アウェーは赤に落ち着きます。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - https://www.historicalkits.co.uk/Sunderland/Sunderland.htm
- id: crest
  heading: 紋章から消えた船は、何を表していたのか
  bg: assets/images/20261027_kit_sunderland/v01_vaux.jpg
  tier: 背景
  narrator: 解説
  telop: 最初の紋章には船と黒猫。1972年に黒猫が消え、1997年に船も外れた
  card: *crest
  say:
  - text: 最初の紋章には、船と、街の紋章の上の部分、黒猫、そしてボール。
    image: assets/images/20261027_kit_sunderland/v01_vaux.jpg
    card: none
  - text: 船は、造船の街だった印です。
    image: assets/images/20261027_kit_sunderland/v01_vaux.jpg
    card: none
  - text: 1972年、紋章が替わり、黒猫が消えます。残ったのは、船とボールと縞。
    image: assets/images/20261027_kit_sunderland/v01_vaux.jpg
    card:
      <<: *crest
      highlight_row: 1
    emph: true
  - text: ただ、この紋章がシャツに付くのは、1977年からでした。
    image: assets/images/20261027_kit_sunderland/v01_vaux.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: その前の1973年、2部にいながら、FAカップの決勝で、リーズに1対0。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: このときの胸は、クラブの頭文字を組んだ印でした。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 1997年、本拠地の移転に合わせて、新しい紋章。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  - text: 造船はもう無く、船は外されました。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card:
      <<: *crest
      highlight_row: 3
    emph: true
  - text: 左上には、古代ギリシャの神殿の形をした、ペンショー・モニュメント。
    image: assets/images/20261027_kit_sunderland/l01_penshaw.jpg
    card: none
  - text: 右下には、ウェア川にかかる橋、ウェアマス・ブリッジ。
    image: assets/images/20261027_kit_sunderland/l02_bridge.jpg
    card: none
  - text: いちばん上の輪は、炭鉱の巻き上げ機。本拠地が、炭鉱の跡に建つからです。
    image: assets/images/20261027_kit_sunderland/l02_bridge.jpg
    card: none
  - text: そして、両脇の2頭。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  - text: ウィキペディアが引くクラブの説明では、これがサンダーランドの黒猫です。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  - text: ラテン語の標語は、卓越を求めて。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - https://www.historicalkits.co.uk/Sunderland/Sunderland.htm
  - https://en.wikipedia.org/wiki/Penshaw_Monument
- id: view
  viewpoint: true
  heading: 見立て・縞は139年、メーカーは51年で14回。何が残り、何が替わったのか
  bg: assets/images/20261027_kit_sunderland/f01_wembley.jpg
  tier: 背景
  narrator: 解説
  telop: 縞は139年。メーカーは51年で14回、平均3.6年。縞はその、およそ38倍
  card: *view
  say:
  - text: サンダーランドの縞と紋章、愛称、メーカー。何年続いたかを、比べます。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
    emph: true
  - text: 赤と白の縦縞は、1887年から。139年です。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *view
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: いまの紋章は、1997年から29年。黒猫の愛称は、2000年から26年。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card:
      <<: *view
      highlight_row: 1
  - text: 一方、シャツのメーカーは、1975年からの51年で、14回替わりました。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: ナイキは3回、アンブロとヒュンメルは2回、戻ってきています。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: 51を14で割ると、およそ3.6。1回あたり、4年に届きません。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card:
      type: calc
      title: メーカー1回あたりの平均（自分で割った）
      terms:
      - - 51年
        - 1975年から
      - - 14回
        - メーカーの交代
      - - 約3.6年
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: アシックスの3年は、平均より少し短い。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: それでも、昇格とプレミア7位の3年でした。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: そして、縞の139年は、3.6年の、およそ38倍です。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      type: calc
      title: 縞はメーカーの平均の何倍か（自分で割った）
      terms:
      - - 139年
        - 赤と白の縦縞
      - - 約3.6年
        - メーカーの平均
      - - 約38倍
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: メーカーは替わり続け、縞は残る。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  - text: 黒猫は、2000年に、やっと正式な名前になりました。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - https://www.theguardian.com/football/2000/feb/22/newsstory.sport4
