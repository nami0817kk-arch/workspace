sections:
- id: cat
  main: true
  heading: サンダーランドの黒猫は、なぜ2000年まで正式な愛称ではなかったのか
  bg: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
  tier: 背景
  narrator: 解説
  telop: 黒猫が正式な愛称になったのは2000年2月。1万票の投票で48%
  card: *nick
  say:
  - text: 今回は、サンダーランドの、胸の紋章と、愛称です。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
    emph: true
  - text: 愛称は、ブラック・キャッツ。黒猫たち、です。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  - text: ところが、これが正式な愛称になったのは、2000年。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card:
      <<: *nick
      highlight_row: 3
    emph: true
  - text: それまでは、本拠地ローカー・パークの名前から取った呼び名でした。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 1997年、クラブは本拠地を移します。古い呼び名は、使えなくなりました。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card:
      <<: *nick
      highlight_row: 1
  - text: そこから3年近く、クラブには、正式な愛称がありません。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: プレミアリーグで、正式な愛称を持たない、最後のクラブになっていました。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 移転から2年あまりの1999年12月、クラブは愛称の投票を始めます。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *nick
      highlight_row: 2
  - text: 黒猫のほか、街の人の呼び名マッケムズ、炭鉱夫を意味するマイナーズなど。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  - text: およそ1万票のうち、黒猫が48%。2位のマッケムズは、37%でした。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: *vote
    emph: true
  - text: 当時の会長、ボブ・マレーの言葉です。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  - text: これからは、サポーターが選んだ名前として、ブラック・キャッツを誇りにできる。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      type: document
      label: ボブ・マレー会長（ガーディアン 2000年2月22日。英文を訳した）
      paragraphs:
      - これからは、サポーターが選んだ名前として、ブラック・キャッツであることを誇りにできる。
      highlight:
      - サポーターが選んだ
  - text: では、なぜ黒猫なのか。
    image: assets/images/20261027_kit_sunderland/k01_xhaka.jpg
    card: none
  - text: 当時の新聞によれば、もとは、ウェア川の河口を守った、大砲の陣地。
    image: assets/images/20261027_kit_sunderland/l02_bridge.jpg
    card: none
  - text: その陣地が、黒猫の名で呼ばれていました。
    image: assets/images/20261027_kit_sunderland/l02_bridge.jpg
    card: none
  - text: もう1つの話は、1937年。イングランドのカップ戦、FAカップの決勝です。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card:
      <<: *nick
      highlight_row: 0
  - text: ファンの1人が、黒猫を連れて、会場に行った、と伝わります。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
    emph: true
  - text: サンダーランドは、プレストンに3対1で勝ち、初めて、FAカップを取りました。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  sources:
  - https://www.theguardian.com/football/2000/feb/22/newsstory.sport4
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - https://www.chroniclelive.co.uk/sport/football/football-news/why-sunderland-called-black-cats-17687845
  - https://en.wikipedia.org/wiki/1937_FA_Cup_final
- id: japan
  heading: 新しい本拠地で、最初のシャツを作ったのはどこか
  bg: assets/images/20261027_kit_sunderland/k03_match.jpg
  tier: 背景
  narrator: 解説
  telop: 1997年から2000年まで、シャツを作ったのは日本のアシックス。昇格とプレミア7位の3年
  card: *asics
  say:
  - text: 日本との接点は、サンダーランドのシャツの、メーカーです。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: 1997年、本拠地を移したその年から、シャツを作ったのは、アシックス。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card:
      <<: *asics
      highlight_row: 0
    emph: true
  - text: 神戸に本社を置く、日本のスポーツ用品の会社です。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card: none
  - text: 新しい本拠地と、新しい紋章。その最初の3シーズンを、アシックスが担いました。
    image: assets/images/20261027_kit_sunderland/k03_match.jpg
    card:
      <<: *asics
      highlight_row: 0
  - text: この3年で、チームは大きく動きます。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card: none
  - text: 1998年から99年の季、2部で優勝。勝ち点は105。当時の記録です。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card:
      <<: *asics
      highlight_row: 1
    emph: true
  - text: 次の季は、プレミアリーグで7位。
    image: assets/images/20261027_kit_sunderland/k02_lineup.jpg
    card:
      <<: *asics
      highlight_row: 2
  - text: フォワードのケヴィン・フィリップスは、30得点。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
  - text: ヨーロッパのリーグの得点王に贈られる、ゴールデンシューを受けます。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
    emph: true
  - text: フィリップスにとって、1部で戦う、初めての季でした。
    image: assets/images/20261027_kit_sunderland/f01_wembley.jpg
    card: none
