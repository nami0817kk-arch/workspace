# ユニフォームとエンブレムの歴史 サンダーランド（10/27 作成）。雛形は 10/26 クリスタル・パレス回。
# 題の問い：サンダーランドの黒猫は、なぜ2000年まで正式な愛称ではなかったのか。
# 重なり確認（2026-10-26）：scripts/・research/covered.yaml の kit_*・research/posted.json を grep。サンダーランドのユニフォーム回は無し
#   （20260920_pl19_sunderland はクラブ紹介＝愛称は「ブラック・キャッツ。黒猫です」の1行だけ。20261025_stadium_sunderland はスタジアム＝
#    デイビー・ランプ・日産・ローカー・パーク。20261026_tanaka_ao_sunderland はニュース。いずれも別シリーズ。紋章・縞・投票・メーカーは言っていない）。
#   この回では、スタジアムの回で言った名前の由来（デイビー・ランプ）・日産・入場の数は言わない。紋章のてっぺんの輪だけ1行。
# 今季のリーグ：ウィキペディア en "2026–27 Premier League" の本文と順位表にサンダーランドがある（プレミアの1部）。
#   "2026–27 Sunderland A.F.C. season"：2026-09-05 ブレントフォード 1-1 サンダーランド（写真の試合）。
# 取材：requests（ブラウザ User-Agent）と WebFetch だけ。ブラウザ操作・JS実行・検索のAI要約を根拠にはしていない。
#   読んだ：ウィキペディア en "Sunderland A.F.C."（Colours and crest／Nicknames／Kit sponsorship の表）、"1937 FA Cup final"、"ASICS"、"Penshaw Monument"。
#   ガーディアン 2000-02-22「Sunderland find new identity as The Black Cats」：投票1万票で黒猫48%・マッケムズ37%、候補5つ
#     （ライト・ブリゲード、マイナーズ、SOLs も）、1997年の移転から3年近く正式な愛称が無かった、プレミアで最後、
#     ウェア川の河口を守った大砲の陣地の名前が元、12月に募集、会長ボブ・マレーの言葉。
#   クロニクル 2020-02-04：1937年のFAカップ決勝で、ファンのビリー・モリスが黒猫をコートの下に隠して行った話。決勝はプレストンに3対1。
#   Historical Football Kits（HFK。ファンの資料サイトだが典拠を明記）：1884年12月まで紺一色、赤と白の左右分け、縦縞は1887-09-24、
#     1913年FAカップ決勝（クリスタル・パレス、12万人、ヴィラに0対1、胸に街の紋章）、1950年代半ばの光る素材の赤（照明の試合）、
#     1972年10月 ストーコウが最初にしたのが黒いパンツに戻すこと、1973年決勝の頭文字の印、1977-78 から船の紋章（1972年から公式）、
#     1981〜83 ル・コック・スポルティフのデザインは不評、1991年の手直し、1997年の新しい紋章（船を外す＝造船はもう無い、輪は炭鉱の跡）、
#     2018年の赤いパンツ→反発でホーム黒・アウェー赤。
#   読めなかった：クラブ公式の過去の紋章・愛称・ユニフォームのページ（web.archive が 429、WebFetch も web.archive 不可）。safc.com は JS で本文が出ない。
# ---- 食い違い・断ったこと ----
#   ・正式な愛称になった年：ウィキペディア・ガーディアン（当時の記事）は2000年、HFK とクロニクルは1997年とも読める→当時の記事の2000年2月で言う。
#   ・投票の数：ガーディアン「1万票の48%」、HFK「1万1000人の半分以上」→ガーディアンの数で言う。
#   ・大砲の陣地の時代：ガーディアン「18世紀」、ウィキペディア「ナポレオン戦争」→年代は言わない。
#   ・黒猫がローカー・パークにいた時期（ウィキペディア 1900〜10年代、クロニクル 1960年代）→言わない。
#   ・1937年の黒猫：クロニクル「コートの下」、ウィキペディア「胸のポケット」→「黒猫を連れて行った、と伝わります」。
#   ・縦縞の始まり：HFK 1887-09-24、ウィキペディア 1887–88 季、HFK が引くクラブ公式の別説 1886年9月→「1887年」とだけ言う。
#   ・1997年の紋章の両脇の2頭：ウィキペディアは "two lions, the black cats of Sunderland"（クラブ公式の紋章ページを典拠）。獅子か黒猫か読みが割れる
#     →「ウィキペディアが引くクラブの説明では、両脇の2頭が、サンダーランドの黒猫」とだけ言い、「黒猫が戻った」とは言い切らない。
#   ・1972年に黒猫が消えた理由は、どの出典にも無い→理由は言わない。
#   ・アシックスの年：ウィキペディアの表 1997–00、HFK 1997-1999・1999-2000 → 1997〜2000年の3シーズン。
# ---- 自分で数えた数 ----
#   縦縞 2026−1887=139年。いまの紋章 2026−1997=29年。黒猫の愛称 2026−2000=26年。
#   シャツのメーカー（ウィキペディアの表）：アンブロ75-81・ル・コック81-83・ナイキ83-86・パトリック86-88・ヒュンメル88-94・アヴェック94-97・
#     アシックス97-00・ナイキ00-04・ディアドラ04-05・ロンズデール05-07・アンブロ07-12・アディダス12-20・ナイキ20-24・ヒュンメル24-＝14回（10社）。
#     ナイキ3回、アンブロ2回、ヒュンメル2回。1975年から 2026−1975=51年。51÷14≒3.64→約3.6年。139÷3.64≒38.2→およそ38倍。
#   投票：100−48−37=15（残り3つの合計）。
# ---- 日本との接点 ----
#   シャツのメーカーがアシックス（神戸に本社。ウィキペディア ASICS）1997〜2000年。新しい本拠地・新しい紋章と同じ年から。
#   その3年に2部優勝（勝ち点105は当時の記録）、翌季プレミア7位・フィリップス30得点でゴールデンシュー（ウィキペディア）。
#   日本人選手の在籍は無い（research/pl_data/japan.json）。第2節に置いた。
# ---- 写真（assets/images/20261027_kit_sunderland/、出典は credits.json）----
#   Commons の CC0・CC BY・CC BY-SA のみ。代理店・放送映像なし。ジャカは2枚（ホームの縞＝サムネだけ／紺のアウェー）。
#   2026-09-05 ブレントフォード戦はアウェーの紺なので、縞は 2025-05-24 ウェンブリーのサポーターの写真で見せる。
#   船の紋章（1972〜97年の型）はヴォークスの名入りの旗の写真（CC0）。スタジアム回の写真とは別のファイル。エンブレム画像は使っていない。
