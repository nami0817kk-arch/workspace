# レアル、ラ・リーガ会長テバスの即時辞任を要求 の取材メモ（2026年10月17日・ショートだけ）
# **重い話題**（ナチスの宣伝大臣への言及）。テバス会長の言葉とレアルの声明は原文（スペイン語）から訳し、言い換えない。煽らない。断定しない。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・Marca 10/16「El tuit de Tebas que incendió al Madrid」……テバス会長のXの投稿の全文（スペイン語）を載せている。
#   ・Marca 10/16「El CSD estudia actuar de oficio…」……EFE の報。CSD が職権で動くことを検討（"según pudo saber Efe"）。
#   ・Marca 10/16「Tebas responde a la petición de dimisión…」……テバス会長の返答の全文。
#   ・Marca 10/16「Tebas, posible actuación del CSD: no doy crédito…」……CSD の報へのテバス会長の返答と、本人が自分の言葉を引き直している箇所。
#   ・レアル・マドリード公式サイト「Comunicado Oficial 16/10/2026」……**声明の原文を読んだ（一次情報）**。
#   ・同 22/09/2026 の声明（比べるために読んだ。「辞任」の語は1つも無い。grep で確認）。
#   控えは research/raw/20261017_marca_*.txt・20261017_realmadrid_comunicado.txt・20261017_realmadrid_comunicado_0922.txt。
# 出来事の順（すべて16日・金曜）: テバス会長が X に投稿（記者2人に宛てた長い文）→ レアルが声明（その日の午後）で即時辞任を要求
#   → テバス会長が返答（「あらゆるこれには名前がある。威嚇だ」）→ EFE が「CSD が職権で動くことを検討」と報道 → テバス会長が「信じられない」と返答。
# テバス会長の投稿のうち、ゲッベルスに触れる一文（原文）:
#   "Ese método recuerda a mecanismos de propaganda que explotó Goebbels, ministro de Propaganda de la Alemania nazi: repetición sistemática, construcción de un enemigo y subordinación de los hechos al relato. La comparación es con esas técnicas de propaganda, no con una ideología ni, por supuesto, con la afición madridista."
#   **この2文は両方入れる**（後ろの1文を落とすと、言っていないことを言ったことになる。レアルの声明も「その説明がある」ことを前提にしている）。
# レアル声明の原文（該当）:
#   "El Real Madrid C. F. considera absolutamente intolerable y de extraordinaria gravedad que quien ocupa dos cargos de máxima responsabilidad en el fútbol español recurra a una comparación con los métodos de propaganda del régimen nazi…"
#   "La aclaración de que no se refiere a la ideología nazi no atenúa el carácter profundamente ofensivo, moralmente repugnante e institucionalmente indigno de sus manifestaciones."
#   "…el Real Madrid C. F. exige su dimisión inmediata como presidente de LaLiga y vicepresidente de la Real Federación Española de Fútbol."
# テバス会長の返答（原文）: "Todo esto tiene un nombre: intimidación."（返答の最後の一文）。→ **台本には入れていない**（他人の声が半分を超えるのを避けるため。ショート60秒に収まらない）。
# 確度: レアルの声明は公式サイトの原文まで辿った＝確定。テバス会長の投稿は Marca が全文を載せ、本人が後の投稿で同じ文を引き直している＝報道（X の原文は読んでいない）。
#   CSD は EFE 経由の報（CSD 自身の発表は無い）＝報道。
# 数字（自分で数えた）: レアルの前回の声明は 9月22日。10月16日までは **24日**（30−22＋16）。前回の声明には「辞任」の語が無く、今回は「即時辞任」。
# 本人の言葉: 双方とも原文から訳した。訳は日本語で通るように語順を整えたが、語は足していない。
# メディア名は台本で言わない。「現地の報道」「通信社の報道」と言う。
# 反応: **0件**。当たった先: NO FOOTY NO LIFE の一覧（レアル・マドリー、10/17 昼）に今回の件の記事はまだ無かった。この題材はナチスへの言及を含み、
#   匿名の書き込みを引くと煽る形になりやすいので、反応なしで出すのが適切と判断（ユーザー確認事項）。
# 写真: 代理店は使わない。assets/images/20261017_tebas_resign_demand/（出典は credits.json）。
