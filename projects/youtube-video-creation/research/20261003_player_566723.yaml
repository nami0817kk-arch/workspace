  say:
  - text: オリーズの17歳は、イングランド2部レディングの育成組織。
    image: assets/images/20261003_olise_palace2022/01.jpg
  - 市場価値は20万ユーロでした。
  - text: 19歳で1500万ユーロ。2部で7点12アシストを挙げた年です。
    image: assets/stats/player_20261003_1029063_value.png
    no_telop: true
  - 年間最優秀若手賞も、この年です。
  - 2021年7月8日、契約解除金の800万ポンドと報じられた額で、クリスタル・パレスへ。
  - 転機は2024年7月7日。ボーナス込み6,000万ユーロで、バイエルンが獲得しました。
  - 1年目で新人王、2年目でリーグの最優秀選手。
  - 市場価値は5500万から、いまの額に。
  sources:
