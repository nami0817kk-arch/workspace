- id: style
  heading: プレースタイル
  tier: 報道
  telop: 右から中へ、左足で決めて、作る
  narrator: 解説
  card:
    type: bars
    title: 同じ攻撃的MF・ウイングの中での位置（100が最上位）
    unit: ''
