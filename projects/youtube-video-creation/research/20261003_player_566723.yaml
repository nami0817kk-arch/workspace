  - https://www.goal.com/en/news/should-not-mix-too-much-vincent-kompany-and-max-eberl-react-to-bayern-star-michael-olise-s-no-desire-interview/blt3e4a9b6838561e77
  - https://www.highsnobiety.com/p/michael-olise-france-fifa-world-cup-interview/
  - https://www.goal.com/en-us/lists/what-could-have-been-chelsea-jamal-musiala-long-standing-connection-michael-olise-bayern-munich/bltdc0c00f947321b40
- id: view
  heading: 見立て
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月10日、アウクスブルク戦
  say:
  - text: 話を数字に戻して、最後に見立てです。
    image: assets/images/20261003_olise_norway_w/01.jpg
  - 比べる相手は、同じ右ウイングのヤマル。今季9試合で9点6アシスト。
  - オリーズは8試合で8点5アシスト。1試合1点の形で並んでいます。
  - 世界年間最優秀選手、バロンドールの候補30人に、今年は2人とも入っています。発表は10月26日。
  - クラブの次の試合は10月10日、アウクスブルク戦。
  - リーグ最多のドリブルとシュートが続くか。そして、2人で挟まれたときに消えないかを見ます。
