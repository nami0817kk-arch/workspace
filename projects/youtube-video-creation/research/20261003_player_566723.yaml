    source: FotMob
  say:
  - text: では、オリーセはどんな形で点に絡むのか。同じ位置の選手と比べてみます。
    image: assets/stats/player_20261003_1029063_radar.png
    no_telop: true
  - text: 6つの軸で突き抜けているのは、シュートにつながるパスと、ボールタッチの多さ。
    image: assets/stats/player_20261003_1029063_radar.png
    no_telop: true
  - text: 空中戦と守備は少ない側。その分、持てば必ず何かを起こします。
    image: assets/images/20261003_olise_spain_w/01.jpg
  - text: 主な持ち場は、右サイドの敵陣深く、そしてその内側。
    image: assets/stats/player_20261003_1029063_heat.png
    no_telop: true
    card: none
  - text: そこから中へ切れ込み、左足で自分が打つか、味方に通すか。
    image: assets/images/20261003_olise_spain_w/01.jpg
  - 作る力はリーグ随一です。
  - 2024年からの季は、15アシストでリーグ最多。
  - シュートにつながるパスも83本で、リーグでいちばん多かったんです。
  - text: 今季はリーグで17本のシュート。15本が左足で、ペナルティエリアの外から2点。
    image: assets/stats/player_20261003_1029063_shots.png
    no_telop: true
  - text: 気がかりを挙げるなら、けがです。
    image: assets/images/20261003_olise_bayern2026_w/01.jpg
  - 2023年からの季は太もも裏を痛め、リーグ戦の出場は19試合でした。
  - それでもバイエルンでは2季で107試合。けがの心配を、出場で打ち消しています。
  sources:
  - https://www.fotmob.com/players/1029063
  - https://www.bundesliga.com/en/bundesliga/news/michael-olise-hitting-new-heights-bayern-munich-kane-kompany-39317
  - https://www.bundesliga.com/en/bundesliga/news/olise-wirtz-top-5-assist-providers-2024-25-grifo-brandt-gross-32460
