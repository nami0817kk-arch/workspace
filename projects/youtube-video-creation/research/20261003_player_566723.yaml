  say:
  - text: オリーズのプレースタイルを、同じ攻撃的MF・ウイングと比べた数字で見ます。
    image: assets/stats/player_20261003_1029063_radar.png
    no_telop: true
  - 6つの軸のうち、チャンス創出とボールタッチは最上位。空中戦と守備の関与は最下位です。
  - つまり、右サイドで受けて中へ切れ込み、左足で決めるか作るかの選手です。
  - text: では、どこでボールを持つか。右サイドの高い位置と、その内側。
    image: assets/stats/player_20261003_1029063_heat.png
    no_telop: true
  - 作る数はリーグ1位。2024年からのシーズンはチャンス創出83回、アシスト15でどちらも最多でした。
  - text: 今季のシュートは17本、うち左足が15本。ペナルティエリアの外から2点を決めています。
    image: assets/stats/player_20261003_1029063_shots.png
    no_telop: true
  - 弱点は空中戦で、同じ位置の中で下から23番目。
  - もう1つは負傷歴。2023年からのシーズンは太もも裏を痛め、リーグ戦19試合しか出ていません。
