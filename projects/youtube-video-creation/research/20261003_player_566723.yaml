- id: story
  heading: マル秘話
  tier: 報道
  telop: 「振り返るって何？」と、右脚の「改善」
  narrator: 解説
  card:
    type: points
    title: オリーズの人となり
    items:
    - インタビューが短い。「振り返るって何？ ゴール？」（2022年）
    - 右脚に漢字の「改善」のタトゥー。パレスのコーチの言葉から
    - チェスの相手はムシアラ。チェルシーの育成で一緒だった
  say:
  - text: 数字の外側に、この選手らしい話が2つあります。
    image: assets/images/20261003_olise_paraguay_wide/01.jpg
  - 1つ目は、インタビューが極端に短いこと。
  - 2022年、決勝点を決めたあとに「振り返ってみて」と聞かれて、こう答えました。
  - voice: オリーズ
    text: 振り返るって何？ ゴール？
  - voice: オリーズ
    text: ザハがパスをくれ、シュート、ゴール
    cont: true
    pause: 0.6
  - 今年9月にも、25メートルのゴールを聞かれて「わからない」と答えて話題になりました。
  - 監督のコンパニは、本人をかばう側に回っています。
  - 2つ目は右脚のタトゥー。漢字で「改善」と彫ってあります。
  - クリスタル・パレスのコーチが練習場で話していた言葉で、毎日少しずつ良くなる、という考え方です。
  - text: 感情を表に出さない選手が、その言葉だけは体に残しています。
    pause: 0.5
  sources:
