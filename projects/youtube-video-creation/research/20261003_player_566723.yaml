- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 3つの名門を追われ、ワールドカップでペレの記録を抜いた
  narrator: キャスター
  say:
  - text: ミカエル・オリーズ。育成組織を3度追い出された少年が、ワールドカップでペレの記録を破りました。
    image: assets/images/20261003_olise_face_w/01.jpg
  - 2026年の大会で1大会7アシスト。1970年のペレの6を、56年ぶりに更新した数字です。
  - ロンドン生まれで、代表の資格は4つの国にありました。選んだのはフランス。
  - 理由を、本人はこう言っています。
  - voice: オリーズ
    text: 子どもの頃に見ていた選手はみんなフランス人だった。
  - voice: オリーズ
    text: ジネディーヌ・ジダン、ティエリ・アンリ、
    cont: true
  - voice: オリーズ
    text: フランク・リベリーだ。
    cont: true
  - voice: オリーズ
    text: それに幼い頃から何度もフランスへ行っていたし、
    cont: true
  - voice: オリーズ
    text: 自分にとってはそちらの方が自然だった
    cont: true
    pause: 0.5
  - 同じ攻撃的MFとウイング100人の中で、作ったチャンスは1位、空中戦は下から23番目。
  - その作りを、数字と話で見ます。
  sources:
  - https://www.fotmob.com/players/1029063
  - https://www.bundesliga.com/en/bundesliga/news/michael-olise-france-fifa-world-cup-assist-record-pele-38193
