  say:
  - text: バイエルンのオリーズ、24歳。ペレを抜いた左足は、いま得点ランキングの首位に並んでいます。
    short_only: true
  - text: 今季はここまで8試合で8得点5アシスト、出場時間は648分。81分に1点のペースです。
    image: assets/images/20261003_olise_spain_wide/01.jpg
  - ブンデスリーガは4試合で4点2アシスト、スーパーカップは1試合で1点1アシスト。
  - 直近5試合は5点3アシスト。ウニオン・ベルリン戦は3点1アシストで、評点は9.9。
  - 10点満点の評点は、直近5試合のうち4試合で8.4以上です。
  - リーグの得点ランキングは首位に並び、ドリブルとシュートの数も最多です。
  sources:
