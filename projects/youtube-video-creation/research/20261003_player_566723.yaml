- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 3つの名門を離れた左足が、ワールドカップでペレを超えた
  narrator: キャスター
  say:
  - text: マイケル・オリーセ。育成組織を3度去った少年が、いま世界の記録を持っています。
    image: assets/images/20261003_olise_paraguay_wide/01_w.jpg
  - 2026年のワールドカップで、1大会7アシスト。
  - text: 記録が残る1966年以降で最多。1970年のペレの6を、56年ぶりに超えました。
    emph: true
  - ロンドン生まれで、選べた代表はイングランドなど4つ。選んだのはフランスでした。
  - voice: オリーセ
    text: 子どもの頃に見ていた選手はみんなフランス人だった。
  - voice: オリーセ
    text: ジネディーヌ・ジダン、ティエリ・アンリ、
    cont: true
  - voice: オリーセ
    text: フランク・リベリーだ。
    cont: true
  - voice: オリーセ
    text: それに幼い頃から何度もフランスへ行っていたし、
    cont: true
  - voice: オリーセ
    text: 自分にとってはそちらの方が自然だった
    cont: true
    pause: 0.5
  - 右から中へ入り、左足で決めて、作る。それがオリーセの形です。
  - その左足が、どんな挫折を越えて世界に届いたのか。順番にたどっていきます。
  sources:
  - https://www.bundesliga.com/en/bundesliga/news/michael-olise-france-fifa-world-cup-assist-record-pele-38193
  - https://theanalyst.com/articles/most-assists-at-a-world-cup-tournament
  - https://news.yahoo.co.jp/articles/689536b52579a6eb86b0e88700371ef0d0b3b555
