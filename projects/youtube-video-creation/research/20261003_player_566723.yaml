- id: story
  heading: マル秘話
  tier: 報道
  telop: 「振り返るって何？」と、右脚の「改善」
  narrator: 解説
  card:
    type: points
    title: オリーセの人となり
    items:
    - インタビューが短い。「振り返るって何？ ゴール？」（2022年）
    - 右脚に漢字の「改善」のタトゥー。パレスのコーチの言葉から
  say:
  - text: 数字を離れて、人となりが伝わる話を2つ。
    image: assets/images/20261003_olise_spain_wide/01.jpg
  - 1つ目は、とにかくインタビューが短いこと。
  - 2022年、ザハのパスから決勝点。「振り返ってみて」と聞かれた答えがこれです。
  - voice: オリーセ
    text: 振り返るって何？ ゴール？
  - voice: オリーセ
    text: ザハがパスをくれ、シュート、ゴール
    cont: true
    pause: 0.6
  - 今年9月にも、25メートルのゴールの感想を聞かれ、「わからない」と答えています。
  - そっけなさが話題になると、監督のコンパニは逆に、質問した記者へ問い返しました。
  - 2つ目は右脚のタトゥー。漢字で「改善」と彫ってあります。
  - パレスの練習場でコーチが話していた言葉で、毎日少しずつ良くなる、という考え方です。
  - text: 多くを語らない選手が、その一語は体に刻んでいるんです。
    pause: 0.5
  sources:
  - https://www.footballista.jp/news/173918
  - https://www.goal.com/en/news/should-not-mix-too-much-vincent-kompany-and-max-eberl-react-to-bayern-star-michael-olise-s-no-desire-interview/blt3e4a9b6838561e77
  - https://www.highsnobiety.com/p/michael-olise-france-fifa-world-cup-interview/
- id: view
  heading: ヤマルと同じ8点、1試合少ない今季のペース
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月10日、アウクスブルク戦でリーグ再開
  say:
  - text: 締めくくりに、同じ左利きの右ウイングと並べてみます。
    image: assets/images/20261003_olise_face_w/01.jpg
  - text: バルセロナのヤマルは、クラブで8試合8点。オリーセは7試合で、同じ8点です。
    emph: true
  - 代表も入れると、ヤマルは10試合11点、オリーセは10試合10点。ほぼ横並び。
  - 2人はそろって、世界最優秀選手を決めるバロンドールの30人の候補です。
  - 発表は10月26日。その前の10日、バイエルンはアウクスブルク戦でリーグを再開します。
  - 育成組織を転々とした左足が、世界一の個人賞にどこまで迫るのか。
  - 再開後も、この得点の速さを保てるか。そこに注目です。
  sources:
