# 田中碧 の取材メモ（2026年10月18日・ショートだけ）
# 取材: 2026-10-18。requests（ブラウザUA）で原文を全部読んだ。
#   ・フットボールトライブ 2026-10-17 19:02（日本時間）「田中碧のせいで『リーズのスター選手が退団の危機に』『構想に再び食い込めず』」
#     https://football-tribe.com/japan/2026/10/17/360474/ 。**英国メディア Football Fancast の記事の転載・要約**（本文にそう書いてある）。原文の英語は読めていない＝確度は報道止まり、媒体名は台本で言わない。
#   ・リーズ公式サイト（leedsunited.com）の試合前会見の記事。ファルケ監督の言葉（英語）の全文を読んだ。
#     https://www.leedsunited.com/en/news/daniel-farke-addresses-favourites-tag-and-balancing-act-ahead-of-manchester-united-clash
#   ・サッカーキング 10/10 アーセナル戦の試合記事（4試合連続先発・71分に交代・今季リーグ戦初黒星）。https://www.soccer-king.jp/news/world/eng/20261010/2215180.html
# **見出しと本文が合わない点**: 見出しは「田中碧のせいでリーズのスター選手が退団の危機に」。本文は、田中が昨季の不調を脱した経緯を伝え、その復活で
#   序列を下げた26歳のMFイリア・グルエフ（ドイツ人指揮官の構想に再び食い込めずにいる）が来年1月に離れる展開も「十分に考えられる」と書く。
#   退団は**英国メディアの見立て**で、田中に責任があるとは言っていない。台本は本文の中身（田中の1年・辛抱）だけを使い、見出しの「せい」は使わない。退団の見込みは言わない（序列が下がったことまで）。
# **試合の状態（2026-10-18 10:30 日本時間に確認）**: リーズ対マンチェスター・ユナイテッドは 13:00 UTC＝日本時間 22:00 キックオフ（ESPN の日程。status=Scheduled）。**結果はまだ出ていない**。
#   → 台本は「試合前の見立て」と明記し、結果に触れない。**22:00 までに公開できなければ作り直す**（公開が試合後になると「試合前」が古くなる）。
# 本文が言うこと（フットボールトライブ。英国メディアの記述の訳）: 1年前（2025年の今頃）は、リーズでのキャリアが終わりに近づいて見えた／2部からプレミアに上がり、試合強度とフィジカルに対応する準備ができていないように見えた／
#   先発から外れる時期があった／辛抱強く待ち、1月に他クラブへの移籍を要求しなかった／1月から3月にかけて7試合連続で出番のない控え選手だった／それでも主力に返り咲くため努力を続けた。
# ファルケ監督（リーズ公式の会見記事。原文は英語）: 「田中は、いつも自分に厳しすぎる。時には肩に腕を回して、君は本当にいい選手だと伝えてやる必要がある。それをやってきた」「最近の試合で彼は素晴らしかった。いまは最高の状態にある」。
#   （同じ発言の中の、手袋をした田中に「ゴールキーパーではないのだから」と言った小話は、題に関係が無いので使わない）。
# 自分で数えた比べ: 1〜3月は7試合連続で出番なし → 今季は10日のアーセナル戦までリーグ戦4試合連続先発（71分に交代）。
# 本人の言葉: 田中碧本人の言葉は記事に無い。反応: 探していない（0件。作らない）。
# 写真: 配信写真（AFLO）は取り込まない。Commons の Ao Tanaka（Timmy96、CC0、2025-09-13、フルハム戦の会場入り＝練習着）2枚。**ユニフォーム姿ではない**。10/17 に使ったリーズ公式の写真は使い回さない。
