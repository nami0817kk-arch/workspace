- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: 10か月の離脱と、フランクフルトの夜
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['2022年3月', 前十字靭帯を切り、10か月離脱した]
    - ['2025年10月', 数字の付かない10試合のあと、2アシスト]
    source: 各報道
  say:
  - text: ヴィルツは、プレミアで今季0ゴール。昨季は5。数字の外の話を、2つ。
    image: assets/images/20261018_wirtz/07_v.jpg
    short_only: true
    card: none
  - text: 1つ目は、あの10か月の話。2022年3月13日、古巣ケルン戦での大けがです。
    image: assets/images/20261018_wirtz/05_w.jpg
    card: none
  - text: その年のワールドカップも、逃しました。
    card: none
  - text: 復帰を前にした2023年1月、本人が、公式のインタビューで話しています。
    card: none
  - voice: ヴィルツ
    text: 10か月は、とても長い時間です。
  - voice: ヴィルツ
    text: でも振り返ると、そんなに長くは感じませんでした。
    cont: true
    pause: 0.5
  - voice: ヴィルツ
    text: ワールドカップは、夢でした。
  - voice: ヴィルツ
    text: でも、悲しむ時間は、あまりなかった。
    cont: true
  - voice: ヴィルツ
    text: 回復だけに、集中していたからです。
    cont: true
    pause: 0.6
  - text: 2つ目は、リヴァプール1年目の秋。2025年10月22日、フランクフルト戦です。
    image: assets/images/20261018_wirtz/06.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 1
  - text: 10試合を終えて、数字はゼロ。ゴールも、アシストも、ありません。
    card:
      <<: *story_card
      highlight_row: 1
  - text: この夜、チームは5対1で勝ちます。ヴィルツは、4点目と5点目を、続けて演出。
    emph: true
    image: assets/images/20261018_wirtz/06.jpg
    card: none
  - text: 試合直後、ドイツのテレビ局のインタビューで、本人は、こう答えました。
    card: none
  - voice: ヴィルツ
    text: 後半は、もっといいスペースに入ろうとしました。
  - voice: ヴィルツ
    text: とくに、僕がボールを失って、失点したあとは。
    cont: true
  - voice: ヴィルツ
    text: 僕は、もっとできると分かっています。
    cont: true
    pause: 0.6
  - text: 2つのアシストを喜ぶより、失点した場面を、先に挙げる選手でした。
    pause: 0.5
    card: none
  quotes_from:
  - https://www.bundesliga.com/en/bundesliga/news/florian-wirtz-injury-comeback-favourite-position-xabi-alonso-bayer-leverkusen-22274
  - https://www.getfootballnewsgermany.com/2025/exhausted-florian-wirtz-belittles-two-assist-match-for-liverpool
  sources:
