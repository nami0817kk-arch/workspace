- id: view
  heading: ブンデスの2季と、プレミアの2季を数えると
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: ブンデスリーガからプレミアリーグへ
  card:
    type: table
    title: ブンデスとプレミア、リーグ戦の比べ
    columns: [項目, ブンデス（23/24・24/25）, プレミア（25/26・26/27）]
    rows: &cmp_rows
    - ['試合', '63', '40']
