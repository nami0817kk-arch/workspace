      <<: *past_card
      highlight_row: 3
  - text: そして、リヴァプール1年目の25/26。49試合で7得点。0.18まで下がります。
    emph: true
    card:
      <<: *past_card
      highlight_row: 4
  - text: 通算です。レヴァークーゼンで、197試合57得点。
    image: assets/images/20261018_wirtz/02.jpg
    card: &total_card
      type: table
