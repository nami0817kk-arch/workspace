# フロリアン・ヴィルツ（リヴァプール／ドイツ代表）の紹介。選手紹介の8節の型（2026-10-18、シリーズ「有名選手の紹介」）。
# 見本は research/20261017_kvaratskhelia.yaml。**FotMob は使わない**ので、雛形（player_intro.py の FotMob 部分）は使わず手で書いた。
# パーセンタイル・同じ位置との順位・レーダー・シュートマップは出さない。数字は基本の数と自分で割った90分あたり。
# 10/14 に「イラオラ監督、ヴィルツとバルコラに100パーセント信頼」のショートを出した。そこ（会見の発言）には触れない。
#
# **題の数字を直した点**：題材一覧の題案は「市場価値1億ユーロ」だったが、Transfermarkt の API で 2026-10-07 付けの市場価値は
# 8500万ユーロ（その前は 2026-06-03 の1億）。題には市場価値を入れず、移籍金（報道の1億ポンド）と今季の数字にした。
#
# **数字の出どころ**
# - Transfermarkt（API tmapi-alpha: /player/598577 の詳細・market-value-history・performance-season 2021〜2026・performance-game 2026。
#   各1回ずつ、1.5秒空けて取得。控えは research/raw/20261018_wirtz_tm.json）：生年月日・身長・契約・市場価値の推移、
#   季ごとの試合・得点・アシスト・出場時間（クラブの全公式戦、代表は除く）。
#   **アシストの食い違い**：TM は 25/26 のプレミアで4、ESPN は3（ESPN の選手統計）。Flashscore の記事（Opta 系の数え方）は
#   23/24 を「18得点20アシスト」、24/25 を「16得点15アシスト」と書き、TM のクラブ全大会（20・15）と一致。→ 比べは **TM で2リーグとも同じ数え方** にし、
#   語りでは「ゴール＋アシスト」を小数1〜2桁で言う（4でも3でも 0.3 台）。
# - 英語版 Wikipedia（Career statistics・Honours・本文。クラブは 2026-10-11 の試合まで、代表は 2026-10-04 まで）：クラブ別の試合・得点、
#   ケルンとの紳士協定、デビュー（17歳15日）・最年少ゴール（17歳34日）、前十字靭帯（2022-03-13）と復帰（2023-01-22）、ブレーメン戦ハットトリックでの優勝（2024-04-14）、
#   EURO2024 開幕戦ゴール（21歳42日）、フランス戦7秒ゴール、プレーの特徴、リヴァプール加入（2025-06-20）、初アシスト・初ゴール（2025-12-20／12-27）。→ 背景。
# - Flashscore（2025-06 の加入発表の記事）：移籍金「前払い1億ポンド＋最大1600万ポンド」、本人の言葉（liverpool.com への談話）。→ 報道。
# - Bundesliga.com（公式、2023-01-21 のインタビュー）：前十字靭帯からの復帰を前にした本人の言葉。→ 確定（公式の記事）。
# - Get German Football News（2025-10-22）：フランクフルト戦（CL 1-5）の試合後に DAZN で語った本人の言葉。「8試合と2試合、数字なし」。→ 報道。
# - ESPN（site.api.espn.com の試合記録・日程）：直近5試合の出場・交代・アシスト（62分ムニョスのゴール、37分バルコラのゴール）、スコア、シュート数（プレミア今季14本＋10/17の1本）、次の試合（10/25 ブライトン）。
# - 取材はブラウザの道具・JavaScript実行を使っていない（requests と WebSearch）。
#
# **自分で数えたもの**
# - 90分あたり＝数÷出場時間×90。シーズンの得点／90分は全公式戦（TM の出場時間）：21/22 10÷2327×90=0.39、22/23 4÷1816×90=0.20、
#   23/24 18÷3475×90=0.47、24/25 16÷3391×90=0.42、25/26 7÷3504×90=0.18（クラブの試合だけ。代表は含めない）。試合・得点は Wikipedia の表と一致。
# - 通算：Wikipedia（10/11 まで）レヴァークーゼン197試合57得点、リヴァプール56試合7得点、代表48試合12得点（10/4 まで）。
#   リヴァプールは 10/14（CL・LASK）と 10/17（プレミア・ブレントフォード）の2試合を足して58試合7得点（2試合とも0得点、TM と ESPN で確認）。合計303試合76得点。
# - 見立ての比べ（リーグ戦のみ）：ブンデスリーガ 23/24＋24/25＝63試合・4739分・21得点・25アシスト → (21+25)÷4739×90＝0.87。
#   プレミア 25/26＋26/27(7試合)＝40試合・2950分・5得点・6アシスト → (5+6)÷2950×90＝0.34。0.874÷0.336＝2.6。
# - 23/24 の得点＋アシスト：ブンデス 11+12=23、ヨーロッパリーグ 4+4=8、ポカール 3+4=7 → 38（18得点20アシスト）。
# - 今季のクラブの試合：9試合・740分・0得点・3アシスト（プレミア7試合560分 0G2A、CL2試合180分 0G1A）。リーグカップ(9/15)は招集外。
#
# **入れなかったもの**：私生活（交際・きょうだい）、父が代理人である点、移籍の別のクラブ（バイエルンなど）の話（読んだ出典が無い）、
#   リヴァプールの前の背番号の話。W杯2026 の敗退（6/29 の試合記録は TM にあるが出典の本文を読んでいない）。
# **日本語名・読みで怪しいもの**：フロリアン・ヴィルツ（ヴィルツ）、プルハイム、ハフェルツ（カイ・ハフェルツ）、ブラウヴァイラー、アレクサンダー・イサク、ヴィクトル・ムニョス、
#   バルコラ、LASK（リンツ）、ブレントフォード、ボーンマス、フルアム。
#
# 本人の言葉は5か所（自訳。原文は上の出典）：①フック（加入の日）②移籍の節 ③けがの話（Bundesliga.com）④フランクフルト戦（GGFN）⑤見立て。
