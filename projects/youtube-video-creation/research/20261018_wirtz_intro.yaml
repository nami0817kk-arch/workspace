    - ['ゴール', '21', '5']
    - ['アシスト', '25', '6']
    - ['ゴール＋アシスト／90分', '0.87', '0.34']
    source: Transfermarkt
  say:
  - text: 最後に、レヴァークーゼンの2季と、リヴァプールの2季を、同じ条件で並べます。
    image: assets/images/20261018_wirtz/05_w.jpg
    card: &cmp_card
      type: table
      title: ブンデスとプレミア、リーグ戦の比べ
      columns: [項目, ブンデス（23/24・24/25）, プレミア（25/26・26/27）]
      rows: *cmp_rows
      source: Transfermarkt
      highlight_row: 0
  - text: ただし、リーグが違います。ブンデスからプレミアへ。割り引いて見てください。
    card: none
  - text: 試合は、63と40。出場時間は、4739分と2950分です。
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: ゴールは、21と5。アシストは、25と6。
    card:
      <<: *cmp_card
      highlight_row: 3
  - text: 90分あたりのゴールとアシストは、0.87が0.34に。およそ2.6分の1です。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 4
    mark: {kind: circle, row: 4}
  - text: ただし、今季のプレミアは、まだ7試合。今季のぶんは、まだ途中の数字です。
    card: none
  - text: 加入のときの本人は、こうも話していました。
    image: assets/images/20261018_wirtz/06.jpg
    card: none
  - voice: ヴィルツ
    text: どれだけやれるか、見てみたい。
  - voice: ヴィルツ
    text: 自分のベストを出せたらいいと思います。
    cont: true
    pause: 0.6
  - text: 1億ポンドの問いの答えは、まだ出ていません。
    image: assets/images/20261018_wirtz/07_w.jpg
    card: none
  - text: ただ、今季の3アシストのうち、2つは直近の2試合です。
    card: none
