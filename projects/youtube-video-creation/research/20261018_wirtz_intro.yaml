      highlight_row: 2
  - text: リヴァプールの史上最高額。ブンデスリーガから出ていく移籍としても、史上最高額です。
    emph: true
    card: none
  - text: 目標については、こう語っていました。
    card: none
  - voice: ヴィルツ
    text: 毎年、すべてを勝ち取りたい。
  - voice: ヴィルツ
