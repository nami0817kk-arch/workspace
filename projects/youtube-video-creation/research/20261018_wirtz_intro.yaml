  - text: リヴァプールは58試合で7得点。ドイツ代表は48試合で12得点。
    card:
      <<: *total_card
      highlight_row: 1
  - text: 合計は、303試合で76得点です。
    emph: true
    card:
      <<: *total_card
      highlight_row: 3
