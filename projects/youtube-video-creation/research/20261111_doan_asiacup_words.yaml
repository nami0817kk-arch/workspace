# 取材メモ（2026年11月11日）堂安律、アジア杯延期のあとに森保一監督への思いを語った（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-11。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: ゲキサカ 2026-11-10（取材・文 竹内達也）「森保J初陣初招集から8年3か月…集大成のアジア杯延期惜しんだ堂安律「彼は結果以上のものを日本サッカーに残した」」（全文）
#   https://web.gekisaka.jp/news/japan/detail/?462936-462936-fl
#   サッカーキング 2026-11-10 の見出し「堂安律、アジア杯延期で森保監督への思いを吐露「最後に監督と一緒にタイトルを取りたい思いだった」」は一覧で確認（本文は読んでいない。題材の一覧の url はゲキサカ）。
# 出典で確かめたこと:
#   ・10日、シンガポール遠征中の日本代表が「MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE」（ブラジル・パラグアイ戦）へ合宿初日の練習。堂安（フランクフルト）が取材に答えた（ゲキサカ）。
#   ・堂安の言葉（ゲキサカ、記事は鉤括弧で引いている。台本は句点・読点で行に分けた。字は変えていない）:
#       「僕は彼は結果以上のものを日本代表、日本サッカーに残したと思っている。ただ結果でしか評価しないというサッカービジネスにおいて、最後に監督と一緒にタイトルを取りたいという思いだった。」（ここまで続けて読む。このあとに記事の中の別の文が3つ続くが、使わない）
#       「僕も8年間代表にいて、日本サッカーの発展には携わっているとは思うけど、結果だけが取れていないというもどかしさもあった。(アジア杯で)あと一つ何かを残したいという思いだった」
#         （「(アジア杯で)」は記者の補足なので、台本では地の文「アジア杯で残したかったものを」に直した。前の引用とのあいだの文は略したので、続けず別の発言として読む）
#       「僕の感覚的にですよ。勝手な感覚なんですが、これがなんか最後じゃない気もする。彼がこれからどういうキャリアで、僕もどういうキャリアなのかも分からないけど、選手と監督としての立場だけじゃなく、何かしらの縁があるのではないかなと勝手に思っている。」（途中を略さず全部読む）
#       「監督のおかげで今の自分があるというのは包み隠さず言えること。」（記事の「監督と話したことも昨日のことのように全て思い出せるし、」に続く文。後半の「成長した姿をこれからも見せていけたら」は使わない）
#       「まだそれほど感情的にはなれていない感じ」（記事の引用。台本は地の文で「まだそれほど感情的にはなれていないと話しました」）
#   ・地の文（ゲキサカ）: 堂安は第1次森保ジャパンの初陣でA代表に初招集されて以降の8年3か月を共にしてきた。多くの選手にとって森保監督と迎える最後の活動が始動。
#       アジア杯は延期。森保監督は当初アジア杯に向けて契約更新していたが、監督としての契約内容は明らかにされていない。来年3月の国際Aマッチウインドーは大岩剛新監督体制が確実視され、年内限りでの契約満了が有力。
#       JFA は12月30日のキリンチャレンジカップ（アジア杯壮行試合として組んだもの）を開催する予定で、開催されればこの試合が森保監督のラストマッチになる見込み。ただ国際Aマッチウインドー外なので欧州組の招集は難しいとみられ、国内組主体の可能性が高い。
#       → 欧州組にとって今回のシンガポール遠征が森保ジャパンでの最後の活動。（記事の見立て＝報道）
#   ・【食い違い】ゲキサカの本文は「アジア杯の中止が決定」と書くが、見出し・サッカーキング（同じ日の佐野の記事は「延期も正式決定」）・AFC の発表（11/3、20261104_asiancup_delay_moriyasu の取材メモ）は延期。→ 台本は「延期」。
#   ・日程: 11/14 ブラジル戦、11/17 パラグアイ戦（シンガポール。サッカーキング・ゲキサカ。20261104_japan_squad_brazil_paraguay の取材メモと同じ）。
#   ・堂安の写真の出どころ: 01＝ゲキサカ 10日の練習後の本人（©Koki NAGAHAMA/GEKISAKA）。02〜04＝20261108_doan_frankfurt_last_play で使った Commons の写真を再掲（credits.json をそのまま写した）。
#       05＝Commons File:Hajime Moriyasu in Columbus.jpg を再掲したが、一覧で見たら森保監督の顔がはっきり写っていないので外した（06 の「Japan-vs-Thailand」だけ使う）。
#       01_v は顔のアップなので頭の上が切れる→ショートの冒頭は02_v（練習中）にした。
#       サッカーキングの練習の集合写真は「SOCCERKING」の透かしが入るので外した。
# 前の本との重なり: 20261104_asiancup_delay_moriyasu（延期の発表・退任の見通し・宮本会長の声明）／20261108_doan_frankfurt_last_play（フランクフルトの試合）。
#   → 今回の初出: 堂安本人の言葉（最後にタイトルを取りたかった・最後じゃない気もする）。延期の発表そのものと宮本会長の話は繰り返さない。
# 【言わないこと】堂安のブラジル戦への言葉（執念深くこだわらない。同じ日の佐野の回と重なるため）／サウジの情勢／後任の大岩監督の時期（3月からと報じられるのみで確定ではない）／「中止」という言い方／契約内容（明らかにされていない）。
# 本人の言葉: あり（堂安律。ゲキサカ）。Y。
