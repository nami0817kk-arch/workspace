# 取材メモ（2026年10月23日）ムバッペ「僕らのような選手は、現状に満足することは決してない」＋ヴィニシウスへの励まし（ニュースのショート。見せ方 Y＝ムバッペ本人の実在の発言から始める）
# 取材: 2026-10-23。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261023_*。
#   ・ゲキサカ（2026-10-22 12:39 JST）「大勝導く1G1AのムバッペがMOM受賞『僕はもっとできる。満足することは決してない』」— 全文読んだ。レアル公式サイトが伝えたコメントの引用。
#       ムバッペは先発し、後半7分（52分）にギュレルの追加点をアシスト、同38分（83分）に右足で追加点。4-1。レアルは開幕3連勝で、首位パリSGと同勝ち点の4位。次戦は25日、首位を快走するバルセロナの本拠地。
#       発言（クラブ公式サイト経由）:「僕はもっとできると思う。僕は常により多くを求められる数少ない選手の1人だ。僕のような選手にとって満足することは決してない。常に向上を目指している。」
#                                   「エル・クラシコは完全に別物だ。今日はこの試合だけに集中していた」
#   ・サッカーキング（2026-10-22）「エンバペ、低調なパフォーマンス＆ディオマンデの台頭で焦燥感募らせるヴィニシウスに『彼は最高の選手』」— 全文読んだ。スペインメディア Movistar Plus のインタビュー。
#       公式戦3戦連発で今季12点（サッカーキング）。発言:「調子はいい感じだけど、もっとできるはずだ。僕は、どんな時もさらなる高みを求められる選手だから。僕らのような選手は、現状に満足することは決してない」
#                     「ヴィニシウスなら大丈夫だよ。彼が落ち込むのは理解できる。チームやファンのために貢献したい、という思いが強いからね」「冷静になって、自分を認めてあげてほしい。彼は、素晴らしい才能を秘めた最高の選手なんだから」
#   ・ESPN 試合記録API（site.api.espn.com/.../uefa.champions/summary?event=401915313）— 得点・交代・シュート。4-1。得点 43分B・シウバ／52分ギュレル（ムバッペのアシスト）／83分ムバッペ（ディオマンデのアシスト）／85分ゴミス（ライプツィヒ）／87分ディオマンデ。
#       70分にヴィニシウスがディオマンデと交代。ムバッペ＝シュート4本・枠内2本・1得点1アシスト。ヴィニシウス＝シュート3本・枠内2本。
# 資料のずれ（台本では言わない）:
#   ・ベルナルド・シウバの先制：ゲキサカ記事に分の記載なし／ESPN＝43分／サッカーキング（モウリーニョ記事）＝44分 → 台本では分を言わない。
#   ・ムバッペの3点目の「ゴール」の分：ゲキサカ＝後半38分（83分）、ESPN・サッカーキング＝83分 → 一致。ただし台本では分を言わない（題材の答えに要らない）。
#   ・同じ言葉の2つの訳：「僕のような選手にとって満足することは決してない」（ゲキサカ＝レアル公式の訳）／「僕らのような選手は、現状に満足することは決してない」（サッカーキング＝Movistar の訳）→ 別のインタビュー（公式サイトと Movistar）。台本は Movistar の訳に統一し、公式サイトの訳は混ぜない。
# 使わなかったもの:
#   ・ヴィニシウスの今季1得点・「低調」「焦燥感」といった媒体の評価（ヴィニシウスを小さく見せる言い方になる）。ムバッペ本人の言葉と、ヴィニシウス本人の試合の数字（シュート3本・枠内2本）だけを使う。
#   ・モウリーニョ監督のヴィニシウス交代の説明（題材10のモウリーニョ「彼は成長する」と重なる。この本はムバッペの言葉に絞る）。
#   ・ヴィニシウスの出場停止・クラシコに出られるか（BBC 等で読めていない）。
# 確度: 試合結果・得点・シュート数は 確定（ESPN 試合記録＋ゲキサカ。クラブ公式の発言引用も）。ムバッペの発言は 報道（ゲキサカ＝クラブ公式サイトの引用、サッカーキング＝Movistar の引用。原文のスペイン語・フランス語は読めていない）。見立ては 背景。
# 10/22 の本（ムバッペが語ったバロンドールの条件）とは別の発言・別の試合。9/23 以降の『ムバッペ』の本とも、この発言（満足しない・ヴィニシウスへの言葉）は重ならない。
# 反応: 取らない。ネットの反応は集めていない（作らない）。approve は --no-voices で。
# 写真: Commons（CC BY / BY-SA）。ムバッペはレアルのユニフォーム姿（2025-10-22 ユベントス戦）と W杯2026。ヴィニシウスは 2025-04-26 コパ・デル・レイ決勝（レアルの姿）と W杯2026。10/15〜10/22 の他の本と重ならない写真を選んだ。
