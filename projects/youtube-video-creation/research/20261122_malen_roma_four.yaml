# ガスペリーニ監督の言葉（試合後の DAZN 取材。TuttoMercatoWeb がイタリア語で全文を引用、ガゼッタが同じ内容を引用）:
#   ・「イタリアで彼より上は？ 思いつくのはラウタロくらいか。いまのマレンは、とくにうちのチームとの組み合わせで見れば、素晴らしい」（"se guardiamo Malen in questo momento è straordinario, soprattutto per come si combina con la nostra squadra"）
#   ・ガゼッタ引用: "Era un grande giocatore anche prima. Non vai in club come l'Aston Villa se non hai valori notevoli. Io forse l'ho messo a giocare dove lui si esprime meglio. In Italia parlano i numeri. Meglio di lui? Posso pensare solo a Lautaro forse. Bobby è straordinario e la squadra lo valorizza al meglio proprio in virtù delle sue caratteristiche"
#   ・ガゼッタの副見出し: ガスペリーニは以前「ヒグアインの36点を超えられる」と話している（"Può superare i 36 gol di Higuain"）。→ 使う（「話していた」。いつかは言わない）
#   ・台本のセリフは、私がイタリア語を日本語にした訳。「ボビー」は監督のマレンの呼び名（ガゼッタの引用のまま）。
# マレン本人の言葉（ガゼッタ。イタリア語）: 試合球を持ち帰る。"A chi lo darò? A uno dei miei figli, magari litigheranno per contenderselo. Questo almeno è giallo, finora avevo soltanto palloni bianchi. Quindi è una bella cosa" → 台本は訳。
