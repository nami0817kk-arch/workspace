# 「何を超えたのか」（ガゼッタ本文）: **セリエA、シーズンの最初の12節（1929-30 シーズン以降）の得点数**。マレンは12点（12試合のうち11試合出場。"12 gol in 11 presenze"）。
#   ・食い違い: ガゼッタは「12位（dodicesimo）」と書くが、本文の一覧（マレンより多い人）は 延べ10件（ピオラ・バティストゥータ・イムモービレ×2・メアッツァ・グアイタ・マンフレディーニ・トーニ・ボレル・アンジェリーロ）で、数えると11位。→ 台本は順位を言わず「限られた数字」。
#   ・開幕12節で得点が多かった顔ぶれ（本文のとおり）: アンジェリーロ20／ボレル17／メアッツァ15・グアイタ15（ローマ・1934-35）・マンフレディーニ15（ローマ・1960-61）・トーニ15／イムモービレ14（2回）／ピオラ13・バティストゥータ13。マレンは12点で「12位」（"dodicesimo"）。
#   ・ヒグアインは36点を取った記録の年に、同じ12節で10点。
#   ・ガゼッタは**見出しで**「ファン・バステンとシェフチェンコより多い」と書くが、**本文にはこの2人の数字が無い**（上の一覧にも2人は入っていない＝12点より少ない側のはず、ただし2人の数は本文で確かめられない）。→ 台本は「報じられている」と断り、2人の数字は言わない。
#   ・（ガゼッタ）ローマ史上、セリエAの1暦年で25点超えは、ペドロ・マンフレディーニ（1960年に26点）だけだった。マレンは2026年に26点で並んだ。→ TuttoMercatoWeb も Opta のデータとして同じ内容（26点・66年ぶり・カーンとラフィーニャは21点）。
