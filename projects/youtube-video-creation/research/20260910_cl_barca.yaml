    narrator: キャスター
    card:
      type: table
      title: CLリーグフェーズ第1節 バルセロナ 5-1 フェイエノールト
      columns: ["時間", "得点者"]
      rows:
        - ["3分", "ハフィーニャ（バルセロナ）"]
        - ["22分", "アデイェミ（バルセロナ）"]
