  - id: voices
    heading: 敗れた側と欧州の各紙は何と言ったか
    tier: 報道
    telop: 「現時点で世界最高のチーム」
    narrator: 解説
    say:
      - 試合のあと、フェイエノールトを率いるファン・ブロンクホルスト監督がこう話しました。
      - {voice: ファン・ブロンクホルスト監督, text: 今のプレーを見る限り}
      - {voice: ファン・ブロンクホルスト監督, text: バルサは現時点で世界最高のチームだ}
      - 優勝候補かと問われて、こうも答えています。
      - {voice: ファン・ブロンクホルスト監督, text: このチームならCLを勝てる}
      - スペイン紙『AS』は、見出しでこう書きました。
      - {voice: スペイン紙AS, text: ラミン・ヤマルのバルサは懇願しない。相手を屈服させる}
      - {voice: スペイン紙AS, text: 国内だけでなく、欧州でもライバルには届かないレベルだ}
      - 同じくスペインの『ムンド・デポルティーボ』。
      - {voice: ムンド・デポルティーボ, text: リズム、選択肢、チームとしての構造を備えている}
      - オランダの『NLタイムズ』は、負けた側の紙面でこう書いています。
      - {voice: NLタイムズ, text: 残りのCLで、バルセロナほど優れた相手と}
      - {voice: NLタイムズ, text: 対戦することはおそらくないだろう}
    official: false
    sources:
