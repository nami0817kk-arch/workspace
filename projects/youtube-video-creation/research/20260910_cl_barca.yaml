    say:
      - チャンピオンズリーグのリーグフェーズ第1節、バルセロナがフェイエノールトを5対1で下しました。
      - 開始3分、ヤマルの折り返しをハフィーニャが左足で決めて先制します。
      - 22分にはアデイェミがペナルティエリア手前から右足を振り抜き、2点目。
      - 前半のバルセロナは支配率75%、シュート12本。フェイエノールトを押し込み続けました。
      - 57分、ペドリの縦パスに抜け出したハフィーニャがこの日2点目を決めます。
      - 77分にはヤマルが直接フリーキックを沈めて4点目。
      - 82分にスタインが1点を返しましたが、その3分後にジェズスがヘディングで加入後初ゴールを決めました。
      - フェイエノールトの日本代表ディフェンダー、渡辺剛はフル出場。最終ラインで5失点を受ける厳しい一戦になりました。
    official: false
