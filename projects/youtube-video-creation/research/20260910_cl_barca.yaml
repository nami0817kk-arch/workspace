    say:
      - この試合を含めて、バルセロナは公式戦5試合で22得点を挙げています。
      - ラ・リーガは開幕4連勝で17得点2失点。
      - 5点以上取ったのは今季4回目で、しかもこれで3試合連続です。
      - 国内で見せていた勢いが、そのまま欧州の初戦にも出た形になりました。
