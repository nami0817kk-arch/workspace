  title: 'ユヴェントスの先発から消えたもの。クラブの歴史で一度もなかった光景'
  question: ユヴェントスの先発から何が消えたのか
short_title: ユヴェントスの先発から消えたもの
thumbnail:
  photo: assets/stats/20260926_juve_xi.png
  line1: ユヴェントスの先発から
  line2: 消えた●●●●人
sections:
  - id: what
    main: true
    heading: 先発の11人
    tier: 報道
    telop: イタリア人はキーパーのヴィカーリオ1人だけ
    narrator: キャスター
    say:
      - text: 'イタリア代表の供給源と言われてきたユヴェントスの先発で、クラブの歴史にない出来事がありました。'
        short_only: true
      - 9月13日、セリエAのサッスオーロ戦。ユヴェントスは2対3で敗れました。
      - text: この日の先発11人。イタリア人は、キーパーのヴィカーリオ**1人だけ**でした。
        image: assets/stats/20260926_juve_xi_f.png
      - 残りの10人は、8つの国から来ています。
      - フランス、ブラジル、コロンビア、トルコ、オランダ、ポルトガル、アルゼンチン、ボスニアです。
      - フィールドプレーヤーにイタリア人がいない先発は、クラブ始まって以来のことです。
      - 途中から入った5人も、全員が外国の選手。最後までピッチにいたイタリア人は、ヴィカーリオだけでした。
      - そのヴィカーリオは、試合のあと、こう話しています。
      - voice: グリエルモ・ヴィカーリオ
        text: 言い訳の陰には隠れられない。最高に名誉あるユニフォームを着ているのだから、誇りと責任感を持たなければ
    sources:
      - https://www.juventus.com/it/news/articoli/serie-a-sassuolo-juventus-la-partita
      - https://www.ansa.it/amp/sito/notizie/sport/calcio/2026/09/13/serie-a-in-campo-sassuolo-juventus-diretta_48fdc61e-1f1c-41f6-975e-ca747d608379.html
      - https://www.fantacalcio.it/news/calcio-italia/13_09_2026/col-sassuolo-nessun-italiano-tra-i-titolari-di-movimento-per-la-juve-e-la-prima-volta-nella-storia-497899
      - https://www.gazzetta.it/Calcio/Serie-A/Juventus/10-09-2026/juve-formazione-titolare-sassuolo-vicario-unico-italiano.shtml
  - id: why
    heading: なぜこうなったのか
    tier: 報道
    telop: 主将ロカテッリは半年の離脱。夏にイタリア人を放出
    narrator: キャスター
    say:
      - 夏には、イタリア人の選手を何人も放出しています。
      - そのうえ主将のロカテッリは、およそ半年の離脱。カンビアーゾも足首を痛めていました。
      - 9月の代表でも、ユヴェントスからイタリア代表に選ばれたのはヴィカーリオ1人。
      - このクラブから代表に選ばれたほかの11人は、それぞれ別の国の代表です。
    sources:
      - https://www.gazzetta.it/Calcio/Serie-A/Juventus/10-09-2026/juve-formazione-titolare-sassuolo-vicario-unico-italiano.shtml
      - https://www.ansa.it/amp/sito/notizie/sport/calcio/2026/09/21/serie-a-12-della-juve-in-nazionale-solo-vicario-con-litalia_4325d817-5b31-43c2-ab57-07f67e5b69c0.html
  - id: said
    heading: OBの言葉
    tier: 報道
    telop: OBのマウロ「このクラブのことを知らなければならない」
    narrator: キャスター
    say:
      - OBのマッシモ・マウロは、厳しく言いました。
      - voice: マウロ
        text: ヴィカーリオを除いて全員が外国人の選手たちは、このクラブのことを知り、何かを見てきていなければならない
      - voice: マウロ
        text: 唯一のイタリア人はキーパーで、1か月前に来たばかり。ユヴェントスのことは何も知らない
    sources:
      - https://www.gazzetta.it/Calcio/Serie-A/Juventus/13-09-2026/vicario-sassuolo-juventus-zero-alibi.shtml
      - https://www.tuttosport.com/news/calcio/serie-a/juventus/2026/09/14-151233293/conte_torna_di_corsa_cosa_ha_fatto_gatti_a_spalletti_scapoli_e_ammogliati_fuoco_sulla_juve/
      - https://www.gazzetta.it/Calcio/Serie-A/Juventus/15-09-2026/juve-spalletti-conte-analisi-mauro.shtml
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「これ本当にユヴェントスなのか？」と「前節のミランにも言ってくれ」
    narrator: キャスター
    say:
      - voice: ネット民
        text: その上ピッチにはキーパーしかイタリア人がいねぇってさぁ これ本当にユヴェントスなのか？ もうNext GenとWomenだけ観てた方がいい気がしてくるわ
      - voice: ネット民
        text: 古手のユベントスのファンとしては、他所から買い漁ってでもきちんとイタリア人の優秀な選手を仕上げてたイメージがあるので、ここ数年のやすい外国人を寄せ集めてしかも弱いチームだとがっかりしてしまうね。
      - voice: ネット民
        text: ユベントスがイタリア人使わんのが悪！みたいに言うなら前節のミランにも言ってくれ。笑 たしか11人中イタリア人0人じゃなかった？
      - voice: ネット民
        text: TLにミランとユベントスはイタリア人を育成しろ以下略みたいな内容のポストが流れてきたけど、W杯優勝からユーロ優勝までの十数年間ほぼミランとユベントスだけで耐えてた(耐えれてないけど)のにこの数年ちょっと転換期に入っただけでそんなに文句言うかよって感じでしかない。
      - voice: ネット民
        text: ユーヴェのアイデンティティはイタリア やっぱりイタリア人中心のユヴェントスが見たいです
      - voice: ネット民
        text: ユーベからヴィカーリオだけか、 よく考えたら万全なイタリア人いないわ
      - voice: ネット民
        text: フラッテージの言うこともわかるけど、ロカテッリ大怪我、ガッティはアホのせいで出遅れ、ルガーニは4番手ポジから脱却出来ず、ヴィカーリオとピンちゃんはポジション被りでイタリア人の出場機会増やすのは無理なのよ
      - voice: ネット民
        text: 直近の試合、コモとユヴェントスの先発を合わせてもイタリア人は1人だけ。9月10日、コモのチャンピオンズリーグの先発はゼロ。9月13日、ユヴェントスのセリエAの先発は、フィールドプレーヤーにゼロ
      - voice: ネット民
        text: スパレッティ出ていけ、コンテが必要だ
      - voice: ネット民
        text: 試合を捨てた！！！ アジッチにしてやられた…
        short_voice: true
