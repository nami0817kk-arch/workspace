# 監督紹介：マッシミリアーノ・アッレグリ（11/26 木、シリーズ「監督紹介」、key: manager_allegri、型は news）。8節（日本との接点は無し）。見本は 20261122_manager_scaloni。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-13）**：既出20人以外の大物から。ユベントスでリーグ5連覇・コッパ・イタリア5回（史上初）、現職はナポリ監督（2026-07-03 就任）。
#   いま見る理由＝ナポリでの苦戦（リーグ11試合で勝ち点15・10位、11/8 時点）。**11/26 公開までに状況が動く**ので、台本の「いま」は日付つきの事実だけにし、評価の言葉は書かない。
#   **重なりの確認（2026-11-13 に自分で）**：scripts/・posted.json・covered.yaml に、アッレグリを主題にした本は無い（covered.yaml 116 行のアモリム/ミランは別人・別件）。
#   同じ日（11/26）の他担当の picks は未記入。同じ担当の 11/24 はインザーギ（同じ日ではない）。次点（外した）：ガスペリーニ・アモリム（今季の状況を確かめきれず）。
#
# **いまの立場**：ナポリ監督。2026-07-03 に3年契約で就任（クラブ声明「2029年6月30日まで」、WebSearch：beIN Sports・ESPN ほか。2026-11-13 に確認）。コンテの後任。
#   ○ 英語版 Wikipedia「Massimiliano Allegri」（2026-11-13 に action=raw で読んだ）：「SSC Napoli head coach」、成績表は 2026-11-08 まで更新。
#   ○ ナポリの足元：リーグ11試合で勝ち点15、10位（Tuttomercatoweb 2026-11-08）。同じ勝ち点15は 2007-08 以来という記事。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（2026-11-08 時点、全大会）。クラブ別の行の合計と通算の行は一致（879試合469勝203分207敗、得点1383失点832）。
#   アリャネーゼ・SPAL・グロッセート・サッスオーロ・カリアリ時代を含む。勝率 469÷879＝53.4%。
#   ミラン1期 178試合91勝（51.1%）／ユベントス1期 271試合191勝（70.5%、クラブ史上最高）／ユベントス2期 149試合80勝（53.7%）／ミラン2期 42試合22勝10分10敗（52.4%）／ナポリ 15試合5勝3分7敗（33.3%）。
#   ユベントス1期の負け37試合。割合はすべて自分で割った。
#   タイトル14個＝リーグ6（ミラン2010-11・ユベントス2014-15〜2018-19）＋コッパ・イタリア5（2014-15〜2017-18・2023-24）＋スーペルコッパ3（ミラン2011・ユベントス2015・2018）。ほかにサッスオーロの C1 優勝（2007-08）。
#
# **歩み**（英語版）：2010 ミラン。2011-05-07 セリエA優勝決定（ローマ戦の引き分け）。2014-01 ミラン解任。2014-07 ユベントス（コンテの辞任の翌日）。2015-06-06 CL決勝 1-3 バルセロナ。
#   2017-06-03 CL決勝 1-4 レアル・マドリード。2019 退任。2021 ユベントスに復帰。2024-05-15 コッパ決勝 1-0 アタランタ（5回目＝監督として史上初）、2024-05-17 解任。
#   2025-05-30 ミラン。2026-05-25 解任（CL出場権を逃した）。2026-07-03 ナポリ。
# **戦術の色**＝2024 コッパ・イタリア決勝（英語版）：1-0 アタランタ、ユベントス5回目のコッパ。形の話：コンテの 3-5-2 を土台に、CLでは4バックも使い、競った終盤に3-5-2へ切り替える（英語版）。
#   守りの3人「BBC」（バルザーリ・ボヌッチ・キエッリーニ）。
# **日本との接点**：無し（入れない）。
#
# **本人の言葉**：2026年10月中旬、ヴェネツィア戦を前に（SoccerNews・Stats Perform、2026-10-17。英語で配信された訳）：
#   “I'm not concerned; we need to find solutions to the problems.” ／ “We just need to work, get all the players back and available, and manage playing every three days.” ／ “We need everyone.”
#   ※原語はイタリア語の会見で、英語訳からの重訳。
# **マル秘話**（英語版）：1967-08-11 リボルノ生まれ。選手のころはMFで、ナポリでも1997-98年にプレー（374試合56得点）。愛称「アッチュジーナ（小さなカタクチイワシ）」。2018年、イタリアサッカー殿堂入り。
#   2024年のコッパ決勝後の言動を理由にユベントスが解任（英語版）。
#
# **入れなかったもの**：私生活（結婚・家族・交際）、2000年の出場停止とその後の無罪（法的な話）、「コルト・ムーゾ」（英語版に出典が無かった）、ナポリ内部の対立・会長の最後通告の報道（確かめられない）、
#   CLリーグフェーズの順位（動く数字）、ファンの解任要求、FotMob、女子、他の監督との優劣。
