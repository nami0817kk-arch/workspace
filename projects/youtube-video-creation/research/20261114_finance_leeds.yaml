# クラブの財政：リーズ・ユナイテッド（11/14 土、シリーズ「クラブの財政」、key: finance_leeds、型は news）。
#
# 題材の選び方：11/12 のブレントフォード（デロイト28位）の次。デロイトの順で未出のクラブは、29位フラメンゴ（ブラジル）・30位マルセイユ（決算が一次で読めない）しか残らないので、
#   一次の決算（Companies House）が読めて、今季プレミアにいる大きめのクラブへ広げた。リーズは 2024-25 に2部で優勝した年の決算で、「昇格の年の財政」が他の財政回と軸が違う。
#   外した候補：ノッティンガム・フォレスト（決算は読めるが、日本との接点・軸が弱い）、エヴァートン（女子チーム絡みで外す）、ウルヴス（今季2部）。
#   日本人（田中碧）が所属し、決算書の本文にも名前がある（日本との接点・ヒットの条件）。
#
# 重なりの確認（2026-11-11）：scripts/*finance_* にリーズは無い。直近30日のリーズの本は、10/16 ユニフォーム・10/18〜19 田中碧のニュース・10/26 スタジアム・11/8 田中碧のニュース（別のシリーズ）。
#   財政の切り口は無い。research/20261112_picks.txt に同日のクラブは無い（11/14 の他の担当と別）。
# ★今季も1部：ESPN の 2026-27 English Premier League 順位表 API（2026-11-11 取得）で 9位・勝点14・10試合。台本では順位を言わない（小さく見せない）。
# ★日本との接点：決算書の Strategic Report に「Ao Tanaka」が、決算の年に加わった選手として書かれている（永久移籍の獲得）。台本は「この年に加わった選手の1人が、日本代表の田中碧」とだけ言う。
#
# 軸は「**2部優勝・勝ち点100の年に、赤字は4918万ポンド。それを埋めたのは、親会社の出資1億800万ポンドだった。プレミアに上がると、何が変わるのか**」。
#   ★他の財政回と軸を重ねない：11/12 ブレントフォード＝給料の重さと売却の時間差、11/10 ボーンマス＝売却益、11/8 パレス＝勝つと費用が増える。今回は「出資で赤字を埋める」と「昇格で条件が付く支払い」。
#   ★ブレントフォードと同じ「リーグの分配」の話は、2部では収入の約33%と小さい、と1行だけ。
#   ★決算のあとの2025-26 の数字は出ていない。台本は決算の1年（2024-25）と、決算書に書かれた条件付きの支払い（2025/26 の成績に応じる）だけ。
#   ★オーナー（親会社）の個人名は言わない。決算の「controlling party」の記載の範囲（アメリカの会社が親会社）だけ。
#
# **出どころ（読んだもの）**
#   ○ Leeds United Football Club Limited（会社番号 06233875）Consolidated Financial Statements for the year ended 30 June 2025（Companies House、2026-04-12 提出、34頁、監査 Gibson Booth、画像PDF。頁を画像にして目で読んだ）
#       https://find-and-update.company-information.service.gov.uk/company/06233875/filing-history/MzUxMzY0MzA3NWFkaXF6a2N4/document?format=pdf&download=0
#       Strategic Report p.2：「securing promotion back to the Premier League ... with the club winning the title with 100 points」
#            「permanent additions were made to the squad with the arrivals of Jayden Bogle, Alex Cairns, Ao Tanaka, Largie Ramazani, Joe Rodon, Isaac Schmidt」
#            「A fine 17 game unbeaten run began in December and lasted until March, which included a 7-0 home win against Cardiff City」「Promotion ... following the 6-0 victory over Stoke City at Elland Road. The league title was then secured on the final day ... 2-1 victory away at Plymouth Argyle, the club's sixth victory in a row」
#            「partnering with global leader in the energy drink and sports media sectors Red Bull on a new multi-year sponsorship deal, with BOXT moving from the front of the shirt to the sleeve」
#            「Record breaking numbers for ticketing and membership sales」「record breaking sales for the away shirt, with 15,000 sold on the first day」
#       p.3 KPI：「increase in turnover from £127.6m to £136.8m driven by strong commercial revenues」（本文は136.8。損益計算書は136.989。台本は損益計算書と注4の値を使う）「Ticketing revenues increased by 3% from £30.6m to £31.7m」
#            「other commercial revenue ... increased by £16.2m from £9.5m to £25.7m」（注4は25.890。台本は注4の値）「the only club in the United Kingdom's third biggest metropolitan area」
#       p.13 損益計算書（£、2025／2024）：Turnover 136,989,330／127,558,280、Cost of sales (21,973,543)／(26,243,272)、Gross profit 115,015,787／101,315,008、Administrative expenses (183,417,168)／(177,568,583)、
#            Operating loss (68,401,381)／(76,253,575)、Gain on disposal of players' registrations 24,765,848／33,694,289、Interest receivable 6,527,809／3,395,256、Interest payable (12,070,164)／(21,647,455)、
#            Loss before taxation (49,177,888)／(60,811,485)、Tax –／–
#       p.22 注4 Turnover：Gate receipts 31,647,912／30,633,661、Television and broadcasting income 1,619,209／2,626,275、Merchandising income 24,560,557／25,410,723、Central distributions 45,609,311／51,017,155、
#            Other commercial revenue 25,890,452／9,496,047、Catering income 7,614,479／8,314,712、Educational services 47,410／59,707
#       p.23 注5 Amortisation of intangible assets 45,727,629／59,590,307。注7 Staff costs：Wages and salaries 90,806,450／73,952,221、Social security 11,648,886／9,797,841、Pension 268,918／280,374、計 102,724,254／84,030,436
#       p.24 注11：「The company has losses of approximately £296 million (2024: £291 million) to carry forward against future profits.」
#       p.31 注26 Contingencies：「future payments of up to £22,742,918 (2024: £9,580,109) may be payable dependent on the club's retention of (2024: promotion to) FA Premier League status and/or players appearances for the club. ... may also incur bonuses payable of £39,454,389 (2024: £19,247,061) conditional on the performance of both players and football management throughout the 2025/26 season.」
#            注27 Related party：「Capital contributions 107,996,000 (2024: 140,736,100) ... £44,750,000 in July 2024; £25,000,000 in September 2024; £8,246,000 in October 2024; and £30,000,000 in June 2025; from a shareholder of the company.」
#       p.32 注28：「49ers Enterprises Global Football Group LLC, a company registered in USA, is the immediate and ultimate parent company.」
#   ○ ESPN 順位表 API（2026-11-11）：9位 Leeds United 14点 10試合（台本には入れない）
#   × 確かめられなかったもの：売った選手ごとの売却益の内訳（決算に無い）、昇格後のプレミアの分配金の額（決算のあとの数字。台本に入れない）、2025-26 の決算（まだ出ていない）、
#     出資の「shareholder」が1つの会社かどうか（注27の記載のまま「親会社」と言わず「株主」の範囲）→ 台本は「株主」と言い、親会社の名前は出さない。
#
# 自分で計算した数（検算済み）
#   損益の底：−68.401＋24.766＋6.528−12.070＝−49.177 ✓（決算 −49.178、丸め）。前の年：−76.254＋33.694＋3.395−21.647＝−60.812 ✓（決算 −60.811）
