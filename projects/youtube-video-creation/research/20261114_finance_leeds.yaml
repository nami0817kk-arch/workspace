  takeaway: リーズの2024-25の決算（クラブの運営会社の年次報告、監査済み）は、2部で勝ち点100の優勝をした年で、収入は1億3699万ポンド（約940万の増え）。2部のリーグからの分配は約33%と小さく、増えたのはスポンサーなどの商業収入（約1640万の増え）。人件費は約1870万増えて収入の約75%、税引き前は4918万ポンドの赤字（前の年は6081万）。それを埋めたのは株主の出資1億800万ポンドで、赤字の約2.2倍。決算には、プレミアの順位などに応じて払う条件付きの支払いが最大約6220万ポンド（前の年の約2.2倍）書かれている。昇格で変わるのは、収入の形と、条件付きの支払いの重さ
