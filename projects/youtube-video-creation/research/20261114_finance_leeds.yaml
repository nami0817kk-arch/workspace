  say:
  - text: リーズの最新の決算は、2026年4月に公表されています。
    image: assets/images/20261114_finance_leeds/01_w.jpg
    card: none
  - text: 2024年から25年のシーズン、リーズは2部で戦いました。
    image: assets/images/20261114_finance_leeds/02_w.jpg
    card: none
  - text: 12月から3月まで、17試合負けませんでした。カーディフには7対0。
    image: assets/images/20261114_finance_leeds/03_w.jpg
    card: none
  - text: 結果は、勝ち点100で優勝。昇格はストーク戦の6対0で決まり、優勝は最終節でした。
    image: assets/images/20261114_finance_leeds/01_w.jpg
    card: none
  - text: その1年の収入は、1億3699万ポンド。前の年から、約940万の増えです。
    emph: true
    card: *rev_bars
  - text: ただし、プレミアのような巨額の放映権は、2部にはありません。
    card: *rev_bars
  - text: リーグからの分配は4561万ポンド。収入の約33%にとどまります。
    card:
      <<: *rev_bars
      items:
      - {label: リーグの分配, value: 45.6, highlight: true}
      - {label: 入場料, value: 31.6}
      - {label: スポンサーなど商業, value: 25.9}
      - {label: グッズ, value: 24.6}
      - {label: 飲食など, value: 9.3}
  - text: 前の年から、約540万ポンド減っています。
    image: assets/images/20261114_finance_leeds/01_w.jpg
    card: none
  - text: かわりに伸びたのが、スポンサーなどの商業収入です。
    image: assets/images/20261114_finance_leeds/02_w.jpg
    card: none
  - text: 949万から2589万ポンドへ。約2.7倍です。
    emph: true
    card:
      <<: *rev_bars
      items:
      - {label: リーグの分配, value: 45.6}
      - {label: 入場料, value: 31.6}
