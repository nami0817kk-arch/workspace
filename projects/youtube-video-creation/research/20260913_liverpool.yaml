sections:
  - id: flow
    heading: 何が起きた試合か
    tier: 報道
    telop: アンフィールドで0対0
    narrator: キャスター
    card:
      type: table
      title: リヴァプール 0 - 0 フラム
      columns: ["", ""]
      rows:
        - ["会場", "アンフィールド"]
        - ["相手", "18位のフラム"]
        - ["この試合の初先発", "バルコラ（ローマからの復帰）"]
    say:
      - リヴァプールとフラム。アンフィールドでの一戦です。
      - 相手は18位に沈んでいたフラム。それでも90分、点は入りませんでした。
      - ローマへの期限付き移籍から戻ったバルコラが、プレミアリーグで初めて先発しています。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458730-458730-fl=

  - id: saves
    heading: 決まらなかった場面
    main: true
    tier: 報道
    telop: 22分、レノが片手で止めた
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 0対0そのものより、**止めた側**が芯
    card:
      type: table
      title: ゴールの手前で止まった場面
      columns: ["", ""]
      rows:
        - ["9分", "イサクの左足シュートが枠を外れる"]
        - ["11分", "フラムのカウンター。ジャケがクリア"]
        - ["22分", "ムニョスのヘディングをレノが片手で弾く"]
    say:
      # **ショートは山場の節だけを切り出すので、状況もここに入れる**
      - 場面はありました。9分、イサクが左足で狙いますが、枠を外れます。
      - 22分、ショボスライのコーナーキックからムニョスがヘディング。これをフラムのベルント・レノが片手で弾き出しました。
      - フラムも攻めています。11分のカウンターではゴンサロ・ガルシアが狙い、ジャケがかき出しました。
      - 中盤ではイウォビが違いを作り、最終ラインからはバッシーが何度も上がっています。
      - 止め切ったのは、18位のほうでした。
      # **ショートでも試合の内容に触れる／反応は一部**（2026-09-13 ユーザー指示）
      - 90分を終えて0対0。リヴァプールは4試合で3度目の引き分けになりました。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458730-458730-fl=

  - id: endo
    heading: 日本人選手は
    tier: 背景
    telop: 遠藤航はベンチ
    narrator: キャスター
    card:
      type: table
      title: この試合のまわり
      columns: ["", ""]
      rows:
        - ["遠藤航", "ベンチ入り、出場なし"]
        - ["リヴァプール", "4試合で3度目の引き分け"]
        - ["フラム", "3連敗を止め、新監督のリーグ初勝ち点"]
        - ["日程", "中3日でCLアトレティコ戦のあと"]
    say:
      - 遠藤航はベンチに入りましたが、出場はありませんでした。
      - リヴァプールはこの4試合で3度目の引き分けです。相手のフラムは3連敗中で、この試合が新監督アルベロアにとってリーグ戦で初めての勝ち点になりました。
      - 中3日でチャンピオンズリーグのアトレティコ・マドリード戦を戦った直後でもありました。
    official: false
    sources: []

  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    telop: 「負けに等しい引き分け」
    narrator: キャスター
    say:
      - {voice: ネット民, text: 負けに等しい引き分け。フラムの4連敗を防いだ優しいリバプール}
      - {voice: ネット民, text: 連敗中の相手にアンフィールドでこの内容と結果は、これはひどいとしか言いようのない試合だった}
      - {voice: ネット民, text: 3連敗フラム相手にアンフィールドだと、疲れがあっても何とかしなきゃね}
      - {voice: ネット民, text: ボールは握れるリバプールだが、やりたい事ができたのはフラム。堅い守備からカウンターで決定機も作る}
      - {voice: ネット民, text: フラムにとっては価値ある1点、リバプールにとっては痛い1点}
      - {voice: ネット民, text: バルコラ上手い。ジャケ、縦パスと神ブロックすごい}
      - {voice: ネット民, text: アトレティコ戦の疲れが残ってたのか、前半から全く点の入る気配がなかった}
    official: false
    sources:
      - https://x.com/search?q=%E3%83%AA%E3%83%90%E3%83%97%E3%83%BC%E3%83%AB%20%E3%83%95%E3%83%A9%E3%83%A0&f=live
