# リヴァプール 0-0 フラム（2026年9月12日・プレミアリーグ第4節）
#
# 引きは**「18位が相手のアンフィールドで、0点だった」**。
# 芯は**バルコラのプレミア初先発**と、**フラムの2人のGKと守備が止め切った**こと。
#
# **遠藤航はベンチで出場なし。**9/12 に「遠藤航がW杯を振り返る」を出しているので、
# **出番なしを主役にしない。**事実として1行置くだけにする
format: news
voice_min: 30
