# 取材メモ（10/10 題材 psv_sano、型は news、日本人枠）。材料の控えは research/raw/20261010_psv_sano_material.md。
# **この1本だけ本編とショートの両方を作る。**ほかの5本はショートだけ。
# **材料から出ない。**数字は材料の「2.」「3.」「5.」「6.」から取り、式は材料の「6.」のまま。
# 効く一点：**佐野の評点8.0は、この試合の22人で2位。上はGKコバーシュ（8.5）だけで、フィールドでは最高**。
#   そこを①に置いた（冒頭に強い一点）。
# **佐野本人の言葉は 10/10 10:00 時点で見つかっていない**（材料 4-1）。無いまま作る。推測で書かない。
#   代わりに置いたのは、①のボス監督の佐野評（オランダ『ESPN』→フットボールチャンネルの訳、2026-09-11。
#   原文は未取得。訳の形のまま引く）と、④のボス監督の試合後会見（PSV公式、オランダ語の原文あり）:
#   "Ik heb sommige jongens gister pas voor het eerst de hand kunnen schudden." /
#   "Ja dat heeft invloed, maar wij moeten alsnog onze wedstrijden winnen."
# **goal.com 日本版の「信じてほしい。彼はとても素晴らしい選手になる」は18歳コルネシオンの話**（材料 4-3 の注意）。
#   佐野のことではないので使っていない。
# 数字の食い違い（材料 8）の扱い：
#   ・出場時間は **PSV公式の568分**を採った（FotMob は567分）。クラブ公式を上に置く。sources に両方。
#   ・得点数は **リーグ公式の順位表の「8試合26得点」**を採った（PSV公式の試合前記事は「7試合22得点」）。
#     材料の指示どおり、リーグ公式のほうが安全。
#   ・代表4連戦の出場数は **1試合とも2試合とも確定できない**ので、台本に出していない。
#   ・次のCLの相手は **PSV公式のマッチセンターの「ライプツィヒ」**（NL Times の「ザルツブルク」は誤り）。
# **順位は「暫定」と書く**（AZ は 10/10 にまだ試合が残っている。材料 1-1 の注）。
# 媒体名は画面にも読み上げにも出していない（評点も「この試合に付いた点」とだけ言う）。出典は節の sources。
# 数字の重なり対策（別の節で同じ数字を読まない）：『8.0』『8.5』は①だけ（③の表には出るが読まない）。
#   『90分』は③だけ（①は「フル出場」、⑤は「一度もベンチに戻らず」で受ける）。
#   『29分』『68分』『65分』は②だけ。『17人』は④だけ。『3.25点』『勝ち点19』は⑤だけ。
# 写真は Commons の1枚だけ（File:Kodai Sano.JPG、CC BY-SA 4.0 / Hans Reefman、2026年、PSVのユニフォーム・背番号24）。
#   facecrop で 01_w（16:9・冒頭とサムネ）と 01_v（9:16・ショート）を切った。**入れ替えは無し**（下地は1本のあいだ変えない）。
#   記事の写真は当たったが、この試合の佐野が主役の横長は取れなかったので Commons の1枚で通す。
# サムネ：構図 face（横長・顔が大きい）。10/10 は carrick が face、maresca と emirates が number、around が versus なので3回続きにならない。
# ネットの反応は集めていない（材料の方針）。反応の節は無い。
