  title: 佐野航大に8.0。ピッチの20人でいちばん高い点が付いた夜
  question: 佐野航大はこの試合で何をして、なぜいちばん高い点が付いたのか
  takeaway: 佐野航大に付いた8.0は、この試合に出た22人のうち2位。上はゴールキーパーのコバーシュ8.5だけで、フィールドを走った20人では最も高い数字だった。試合はPSVが2-0で勝ったが、自分たちの足で決めたのは29分のティルのヘッドだけで、68分の2点目はコーナーからのオウンゴール。1試合あたり3.25点を取っているチームが1点しか決めず、それでも勝てたのは今季のリーグ戦で初めて無失点に抑えたからだった。佐野は先発6試合がすべて90分で、途中で下げられたことが一度もない。クラブの紹介文では堂安律以来はじめてのPSVの日本人選手にあたる。代表ウィークが明けて最初の一戦で、PSVからは17人が代表に呼ばれており、全員での練習は前日の1日だけ。ボス監督は「何人かの選手とは、昨日はじめて握手できた」と言っている。勝ち点19で暫定2位、次は13日にアウェイでライプツィヒと戦う
  opening_image: assets/images/20261010_psv_sano/01_w.jpg
