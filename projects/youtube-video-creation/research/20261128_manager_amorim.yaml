# 監督紹介：ルベン・アモリム（11/28 土、シリーズ「監督紹介」、key: manager_amorim、型は news）。9節（日本との接点＝守田英正）。骨組みは 20261126_manager_allegri を写した。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→日本との接点→マル秘話→見立て。
#
# **題材の選び方（2026-11-21）**：既出22人（グアルディオラ〜アッレグリ）以外の大物から。スポルティングを19年ぶりのリーグ優勝、マンUではEL決勝、いまはミラン監督。
#   日本との接点が太い（守田英正がスポルティングでアモリムの中盤を担った）。
#   **重なりの確認（2026-11-21）**：scripts/・posted.json・picks（1109〜1127）に、アモリムを主題にした監督紹介は無い。ニュースでは 20261106_amorim_milan_no_excuses（EL フェレンツヴァーロシュ戦の会見）がある→その会見の言葉は使わず、別の言葉（手本の監督）を使った。
#   同じ日（11/28）の他担当の picks：セリエAのクラブ紹介はユヴェントス（ミランではない）。
#   次点（外した）：ジダン（10/03 coach_zidane・10/18 レジェンドで出している）、森保一（10/06 coach_moriyasu とニュースが多い）。
#
# **いまの立場**：ACミラン監督。2026-06-16 就任、契約は2028年まで（英語版 Wikipedia「Ruben Amorim」、2026-11-21 に action=raw で読んだ。最終更新 2026-11-17）。アッレグリの後任。
#   ○ ミランのセリエAの足元：11試合 7勝3分1敗 勝ち点24、4位（ESPN の順位 API、2026-11-21 に取得。2026-27 シーズン）。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（2026-11-08 時点、全大会）。
#   表の行：カーザ・ピア 4試合3勝0分1敗／ブラガB 11試合8勝2分1敗／ブラガ 13試合10勝1分2敗／スポルティング 231試合164勝34分33敗／マンU 63試合24勝18分21敗／ミラン 15試合8勝3分4敗。通算 337試合217勝58分62敗（行の合計と一致）。
#   **下部組織（ブラガB）を除いたトップチーム**：326試合209勝56分61敗。勝率 209÷326＝64.1%。
#   スポルティング 164÷231＝71.0%／マンU 24÷63＝38.1%（英語版本文「38%、ファーガソン引退後の正式な監督で最も低い」）／ミラン 8÷15＝53.3%。カーザ・ピアとブラガの合計 17試合13勝。割合はすべて自分で割った。
#   ミランの15試合＝セリエA 11試合（7勝3分1敗）＋EL 4試合（1勝3敗）で、表の8勝3分4敗と一致。
#   監督のタイトル（トップチーム）6個＝ブラガ タッサ・ダ・リーガ 2019-20／スポルティング リーグ 2020-21・2023-24、タッサ・ダ・リーガ 2020-21・2021-22、スーペルタッサ 2021。マンUは2024-25 EL準優勝。
#
# **歩み**（英語版）：2018-19 カーザ・ピア（3部）。2019-09 ブラガB、2019-12-23 ブラガのトップ（2020-01 リーグ杯優勝）。2020-03-04 スポルティング（移籍金1000万ユーロ＝監督では史上3番目）。
#   2021-05-11 ボアビスタに1-0で19年ぶりのリーグ優勝（国内記録の32試合無敗の途中）。2024-05-05 2度目のリーグ優勝。
#   2024-11-01 マンU就任発表（11日から）。2025-05-21 EL決勝 0-1 トッテナム。2026-01-05 退任（前日のリーズ戦1-1のあと）。2026-06-16 ミラン。
# **戦術の色**＝2024-11-05 CL スポルティング 4-1 マンチェスター・シティ（本拠地での最後の試合。ギェケレシュのハットトリック＝TNT Sports の見出し。グアルディオラのチームがCLで4点取られたのは3度目）。
#   形：3-4-3。中盤の2人が守りの前に立ち、両サイドのウイングバックが攻める。前から奪いに行く（英語版 Tactics）。
#
# **本人の言葉**（英語版 Tactics の引用。出典は GiveMeSport 2024-10-29「Ruben Amorim's Managerial Career So Far」。いつの発言かは書かれていない＝台本は「こう話しています」とだけ書く）：
#   “There are coaches who have a way of watching the game that I like, like Guardiola, but for me, the role model is Mourinho, because I watch the ball in a way that's more similar to [Mourinho], that is, he analyses the opponents very well and sets his team up, not just with a certain style of play but thinking a lot about how to adapt to win.”
#   ※原語はポルトガル語のはずで、英語訳からの重訳。
# **日本との接点**：守田英正。2022-07-01 スポルティングに加入（英語版「Hidemasa Morita」）。アモリムの3-4-3で、中盤の2人（ヒュルマンドと守田）が守りの前に立つ（アモリムの英語版 Tactics）。
#   守田のタイトル：リーグ 2023-24（アモリムのもと）・2024-25、タッサ・デ・ポルトガル 2024-25。2026-05-15 に契約を延長しないと発表。
# **マル秘話**（英語版）：カーザ・ピアで最初の2試合に負け、3試合目も負けたら辞めると言った→次の試合で初めて3バックにし、無敗が続いた（BBC 2024-10-29）。現役の終わりに、マンUのモウリーニョのもとで1週間の研修。
#   スポルティング最後の試合（2024-11-10 ブラガ戦）は前半0-2から4-2、リーグ開幕11連勝はクラブ記録に並んだ。
#
# **入れなかったもの**：私生活（結婚・家族）、カーザ・ピアの資格の処分（法的な話に近い）、マンU退任前の会見の中身（ネヴィル・スコールズ・強化部への言葉＝人を責める話）、「史上最悪のチーム」発言（選手を小さく見せる）、
#   EL のいまの順位（動く数字）、FotMob、女子、他の監督との優劣。
