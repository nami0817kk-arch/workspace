    highlight_row: 0
  say:
  - text: 見立てです。アモリムの勝率を、クラブごとに並べます。
    image: assets/images/20261128_manager_amorim/01_w.jpg
    card: *view_table
  - text: スポルティングとユナイテッドの勝率の差は、32.9ポイントあります。
    emph: true
    mark: {"kind": "circle", "row": 1, "col": 2}
    card:
      <<: *view_table
      highlight_row: 1
  - text: どちらのクラブでも、形は3-4-3。
  - text: ユナイテッドでは、その形に合う顔ぶれではなかったと言われました。
    card:
      <<: *view_table
      highlight_row: 1
  - text: ミランでは、15試合で8勝。53.3%です。
    image: assets/images/20261128_manager_amorim/03_w.jpg
    card:
      <<: *view_table
      highlight_row: 2
  - text: セリエAは、11月21日時点で、11試合を終えて7勝3分1敗。4位です。
    emph: true
    card: none
  - text: 契約は2028年まで。71%と38%、どちらに近づくのか。
  - text: 答えは、このシーズンの残りに出ます。
    card: none
