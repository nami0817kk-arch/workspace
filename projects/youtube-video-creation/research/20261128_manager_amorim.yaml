  heading: 見立て・71%と38%。同じ3-4-3で、何が分かれたのか
  tier: 背景
  telop: 勝率71.0%から38.1%へ。そしてミランで53.3%
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（アモリムの勝率）
    columns: [時期, 試合, 勝率]
    rows:
