        - ["収容人数", "24,983人"]
    say:
      - アルファベット順では、11番目に来ます。
      - 創設は1904年6月28日。イングランド北東部の港町のクラブです。
      - 愛称は「タイガース」。**虎**です。
      - 由来はユニフォームの色。**黒と琥珀色**の縞模様を、昔から着てきました。
      - 本拠地はMKMスタジアム。収容は2万4983人です。
      - 監督はセルゲイ・ヤキロビッチ。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: rise
    heading: 4部からプレミアまで5年
    main: true
    tier: 背景
    telop: 2008年、ボレー1本で初めて1部へ
    narrator: 解説
    card:
      type: table
      title: 駆け上がった5シーズン
      columns: ["", ""]
      rows:
        - ["出発点", "4部"]
        - ["2008年", "プレーオフ決勝でブリストル・シティに1-0"]
        - ["速さ", "イングランドで3番目"]
    say:
      - このクラブは、長いあいだ1部にいませんでした。
      - 1930年に2部から落ちたあと、下のリーグで何十年も過ごしています。
      - 転機は2008年でした。
      - チャンピオンシップのプレーオフ決勝、相手はブリストル・シティ。
      - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
      - 1対0。**クラブの歴史ではじめて、1部に上がります。**
      - しかも、そこまでの上がり方が異常でした。
      - 4部からプレミアリーグまで、**5シーズン**です。
      - イングランドのサッカーで**3番目に速い**駆け上がりとされています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: japan
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。守田英正
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "セルゲイ・ヤキロビッチ"]
        - ["日本人選手", "守田英正"]
        - ["加入", "2026年7月24日（2年契約）"]
        - ["この夏の補強", "18人"]
    say:
      - このクラブには、日本人選手がいます。**守田英正**です。
      - スポルティングを離れ、2026年7月24日に加入しました。契約は2年です。
      - 8月29日のコヴェントリー戦で、プレミアリーグで初めて先発しています。
      - ハル・シティはこの夏、移籍期限の最終日だけで6人、**合わせて18人**を獲得しました。
      - 上がってきたクラブが、1部に残るために人を入れ替えた形です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/07/post1005300/
      - https://www.footballchannel.jp/2026/09/03/post1003017/
  - id: cup
    heading: 2014年の決勝
    tier: 背景
    telop: 先に2点を取って、延長で逆転された
    narrator: 解説
    card:
      type: table
      title: 2014年のFAカップ決勝
      columns: ["", ""]
      rows:
        - ["相手", "アーセナル"]
        - ["立ち上がり", "ハルが2点を先行"]
        - ["結果", "2-3。クラブ唯一の決勝"]
    say:
      - もうひとつ、忘れられない試合があります。
      - 2014年のFAカップ決勝。クラブとして**はじめての決勝**でした。
      - 相手はアーセナル。ハルは立ち上がりに**2点**を先に取ります。
      - そこから追いつかれ、延長までもつれました。
      - 結果は2対3。**あと一歩のところで、タイトルを逃しています。**
      - このクラブには名前をめぐる騒動もありました。
      - オーナー側が「ハル・タイガース」への改名を持ちかけ、サポーターが強く反発しています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝0回、FAカップ0回（準優勝 2013-14）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "0回"]
        - ["FAカップ", "0回（準優勝 2013-14）"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "0回"]
        - ["3部優勝", "4回（直近 2020-21）"]
    say:
      - 数えると、大きなタイトルは**ゼロ**です。
      - 創設1904年から**122年、ひとつも獲っていません。**
      - 決勝に立ったのも、2014年のFAカップの1度だけです。
      - そのクラブに、いま**守田英正**がいます。
      - 日本代表で40試合6得点を積んだ選手が、タイトルゼロのクラブにいる。
      - 昇格を決めた試合にも、日本人が絡んでいました。
      - "2026年5月23日のプレーオフ決勝。後半45分過ぎ、**平河悠**のドリブルとクロスから決勝点が生まれています。"
      - 1対0。ハルは2017年以来の1部復帰を決めました。ただし平河は、レンタルが終わって今はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
