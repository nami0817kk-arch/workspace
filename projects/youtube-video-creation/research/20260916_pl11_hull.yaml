# プレミアリーグ20クラブ紹介 ⑪ハル・シティ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**守田英正（2026年7月24日に加入、2年契約）。
# Wikipedia のクラブ記事には名前が載っていなかったので、**日本語の報道で裏を取った。**
#
# 引きは**「4部からプレミアまで5シーズン」**。ここが山場（@main）
