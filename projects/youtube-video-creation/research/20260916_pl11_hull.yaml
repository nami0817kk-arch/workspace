        - ["収容人数", "24,983人"]
    say:
      - "**黒と琥珀色**の縞模様を、このクラブは昔から着てきました。"
      - だから愛称は「タイガース」。虎です。
      - 創設は1904年6月28日。イングランド北東部の港町のクラブです。
      - 本拠地はエムケーエム・スタジアム。収容は2万4983人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: rise
    heading: 4部からプレミアまで5年
    main: true
    tier: 背景
    telop: 4部からプレミアまで5シーズン
    narrator: 解説
    card:
      type: table
      title: 駆け上がった5シーズン
      columns: ["", ""]
      rows:
        - ["出発点", "4部"]
        - ["2008年", "プレーオフ決勝でブリストル・シティに1-0"]
        - ["速さ", "イングランドで3番目"]
    say:
      - はじめて1部に上がったのは**2008年**。4部から**5シーズン**で駆け上がりました。
      - イングランドのサッカーで**3番目に速い**上がり方とされています。
      - 舞台は2部のプレーオフ決勝。相手はブリストル・シティ。
      - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
      - "1対0で勝って、**クラブの歴史ではじめて、1部に上がりました。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには守田英正がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "セルゲイ・ヤキロビッチ"]
        - ["主将", "ルーイ・コイル（右SB・イングランド）"]
        - ["出身", "ハル生まれ。2022-23から主将"]
        - ["エース", "オリ・マクバーニー（FW・スコットランド）"]
        - ["日本人選手", "守田英正（守備的MF・背番号5）"]
    say:
      - このクラブには、**守田英正**がいます。
      - 守備的な中盤なので点を取る役ではありませんが、**日本代表で40試合を積んだ**選手です。
      - 監督はセルゲイ・ヤキロビッチ。
      - 主将はルーイ・コイル。右サイドバックで、**この街、ハルの生まれ**です。
      - 腕章を巻いているのは2022年からになります。
      - エースはオリ・マクバーニー。スコットランド人のフォワードです。
      - 昨季は**19点**。昇格を決めたプレーオフ決勝で、**95分に決勝点を決めた**のもこの人です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 宿敵が1つに定まっていないクラブ
    narrator: 解説
    card:
      type: table
      title: ハンバー・ダービー
      columns: ["", ""]
      rows:
        - ["呼び名", "ハンバー・ダービー"]
        - ["相手", "グリムズビー・タウン／スカンソープ・ユナイテッド"]
        - ["初の公式戦", "1905年12月16日（0-1で敗戦）"]
        - ["今季", "相手はプレミアリーグにいない"]
    say:
      - このクラブは、**宿敵が1つに定まっていません。**
      - 英語版ウィキペディアには、グリムズビー・タウンとスカンソープ・ユナイテッドの**両方と**ハンバー・ダービーを争う、と書かれています。
      - どちらが最大の相手なのかは、書かれていません。**そのまま正直にお伝えします。**
      - 呼び名の由来は、この地方を流れるハンバーです。
      - 初の公式戦は**1905年12月16日**。ハルのホームで、相手はグリムズビー・タウンでした。
      - 結果は0対1。グリムズビーが勝っています。
      - ただし、そのグリムズビーも、スカンソープも、**今季のプレミアリーグにはいません。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Humber_derby
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 520試合のデイヴィッドソン、222得点のチルトン
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["アンディ・デイヴィッドソン", "リーグ520試合（クラブ最多出場）"]
        - ["クリス・チルトン", "公式戦222得点（クラブ最多得点）"]
        - ["ディーン・ウィンダス", "1期目176試合57得点"]
    say:
      - いちばん多く出たのは**アンディ・デイヴィッドソン**。1952年から1968年で、リーグ520試合18得点です。
      - 1965年から66年の3部優勝のときは、1試合を除いて全部に出ました。
      - いちばん多く決めたのは**クリス・チルトン**。1960年から1971年までの11年です。
      - リーグ415試合193得点、公式戦では222得点。クラブの最多得点者です。
      - 3人目は**ディーン・ウィンダス**。1期目だけで176試合57得点。
      - そして2008年5月24日、このクラブを**104年の歴史ではじめて1部へ**押し上げた人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Andy_Davidson_(footballer)
      - https://en.wikipedia.org/wiki/Chris_Chilton
      - https://en.wikipedia.org/wiki/Dean_Windass
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 昇格を決めた試合にも、日本人が絡んでいた
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["3部優勝", "4回（直近 2020-21）"]
        - ["2026年", "プレーオフ決勝を1-0で制して昇格"]
        - ["FAカップ", "準優勝（2013-14）"]
    say:
      - 昇格を決めた試合にも、日本人が絡んでいました。
      - "2026年5月23日のプレーオフ決勝。後半45分過ぎ、**平河悠**のドリブルとクロスから決勝点が生まれています。"
      - 1対0。ハルは2017年以来の1部復帰を決めました。
      - ただし平河は、レンタルが終わって今はいません。
      - 獲ってきたのは、3部優勝が4回。直近は2020年から21年です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
