    telop: 4部からプレミアまで5シーズン
    narrator: 解説
    card:
      type: table
      title: 駆け上がった5シーズン
      columns: ["", ""]
      rows:
        - ["出発点", "4部"]
        - ["2008年", "プレーオフ決勝でブリストル・シティに1-0"]
        - ["速さ", "イングランドで3番目"]
    say:
      - 4部からプレミアリーグまで、**5シーズン**で駆け上がったクラブです。
      - イングランドのサッカーで**3番目に速い**上がり方とされています。
      - その締めくくりが2008年でした。
      - チャンピオンシップのプレーオフ決勝、相手はブリストル・シティ。
      - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
      - 1対0。**クラブの歴史ではじめて、1部に上がります。**
      - それまでは長いあいだ、1部にいませんでした。
      - 1930年に2部から落ちたあと、下のリーグで何十年も過ごしています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには守田英正がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "セルゲイ・ヤキロビッチ"]
        - ["主将", "ルーイ・コイル（右SB・イングランド）"]
        - ["出身", "ハル生まれ。2022-23から主将"]
        - ["エース", "オリ・マクバーニー（FW・スコットランド）"]
        - ["日本人選手", "守田英正（守備的MF・背番号5）"]
    say:
      - このクラブには、**守田英正**がいます。
      - 守備的な中盤なので点を取る役ではありませんが、**日本代表で40試合を積んだ**選手です。
      - 監督はセルゲイ・ヤキロビッチ。
      - 主将はルーイ・コイル。右サイドバックで、**この街、ハルの生まれ**です。
      - 腕章を巻いているのは2022年からになります。
      - エースはオリ・マクバーニー。スコットランド人のフォワードです。
      - 昨季は**19点**。昇格を決めたプレーオフ決勝で、**95分に決勝点を決めた**のもこの人です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: cup
    heading: 2014年の決勝
    tier: 背景
    telop: 先に2点を取って、延長で逆転された
    narrator: 解説
    card:
      type: table
      title: 2014年のFAカップ決勝
      columns: ["", ""]
      rows:
        - ["相手", "アーセナル"]
        - ["立ち上がり", "ハルが2点を先行"]
        - ["結果", "2-3。クラブ唯一の決勝"]
    say:
      - 2014年のFAカップ決勝、ハルは立ち上がりに**2点**を先に取りました。
      - 相手はアーセナル。クラブとして**はじめての決勝**です。
      - そこから追いつかれ、延長までもつれました。
      - 結果は2対3。**あと一歩のところで、タイトルを逃しています。**
      - このクラブには名前をめぐる騒動もありました。
      - オーナー側が「ハル・タイガース」への改名を持ちかけ、サポーターが強く反発しています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 昇格を決めた試合にも、日本人が絡んでいた
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["3部優勝", "4回（直近 2020-21）"]
        - ["2026年", "プレーオフ決勝を1-0で制して昇格"]
        - ["FAカップ", "準優勝（2013-14）"]
    say:
      - 昇格を決めた試合にも、日本人が絡んでいました。
      - "2026年5月23日のプレーオフ決勝。後半45分過ぎ、**平河悠**のドリブルとクロスから決勝点が生まれています。"
      - 1対0。ハルは2017年以来の1部復帰を決めました。
      - ただし平河は、レンタルが終わって今はいません。
      - 獲ってきたのは、3部優勝が4回。直近は2020年から21年です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
