  say:
  - text: 最後に、点を取るDFとしての数字を比べます。
    image: assets/images/20261109_makino_tomoaki_legend/02_w.jpg
    card: none
  - text: 槙野はJ1で415試合46得点。100試合あたり、およそ11点です。
    image: assets/images/20261109_makino_tomoaki_legend/01_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 同じく代表の守りの柱だった中澤佑二は、593試合で36得点。
    card: {<<: *viewcard, highlight_row: 1}
  - text: こちらは100試合あたり、約6点でした。
    card: {<<: *viewcard, highlight_row: 1}
  - text: 槙野の点の取り方は、その約1.8倍です。
    card: {<<: *viewcard, highlight_row: 0}
    mark:
      kind: circle
      row: 0
      col: 100試合あたり
    emph: true
  - text: その頭でブラジルのゴールを破りました。
    card: none
  - text: そして2018年のW杯では、世界のエースを止める側に回ります。
    image: assets/images/20261109_makino_tomoaki_legend/01_w.jpg
    card: none
  - text: どちらも、試合の前に相手の映像を見て準備していました。
    card: none
  - text: 11月14日のブラジル戦。点を取りにいくDFが日本にいるかも、見どころの1つです。
    card: none
