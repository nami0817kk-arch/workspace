  say:
  - text: 槙野智章の生まれは、1987年5月11日。広島市の出身です。
    image: assets/images/20261109_makino_tomoaki_legend/05_w.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: クラブは広島、ドイツのケルン、浦和、神戸。4つのクラブを渡りました。
    card: {<<: *datacard, highlight_row: 2}
  - text: J1で挙げたゴールは46。守る位置にいながら、点を取り続けた選手です。
    card: {<<: *datacard, highlight_row: 3}
  - text: ワールドカップには、2018年のロシア大会に出ています。
    image: assets/images/20261109_makino_tomoaki_legend/05_w.jpg
    card: none
