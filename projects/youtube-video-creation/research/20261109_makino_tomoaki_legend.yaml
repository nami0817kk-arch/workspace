  say:
  - text: 槙野が代表でいちばん多く出たのは、2015年と2018年。8試合ずつです。
    image: assets/images/20261109_makino_tomoaki_legend/01_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: 2022年は、ヴィッセル神戸でプレーしました。
    card: {<<: *aftercard, highlight_row: 1}
  - text: その年の12月、35歳で引退を発表。プロ17年でした。
    card: {<<: *aftercard, highlight_row: 2}
  - text: J2の41試合、ドイツの8試合も合わせて、槙野は最後までピッチに立ち続けました。
    image: assets/images/20261109_makino_tomoaki_legend/05_w.jpg
    card: none
