# 槙野智章（元日本代表 DF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-09。型は 11/7 の中澤佑二と同じ8節の変形。
# **情報の時点は 2026-11-06。**年齢は当時のものだけ（生年月日 1987-05-11 から計算）。いまの仕事（監督）と、その処分の話は言わない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字はヴィッセル神戸公式（2022-12-25 の引退の発表）・サッカーキング（2018-06-29、2025-10-14）・
#   フットボールチャンネル（2017-11-11）・英語版/日本語版 Wikipedia の成績表と大会の記事だけ。
# **私生活（妻・テレビ・YouTube）・引退試合の退場の演出・いまの監督業とJリーグの処分は入れない**。J リーグは経歴の事実だけにとどめ、サムネの主役にしない（主役は日本代表）。
#
# **題材を選んだ理由**：直近30日に未出の、日本代表の大物DF。**11月14日に日本代表はブラジルと戦う**（JFA 公式 2026-11-04 発表、11/5 の指示書）。
#   槙野は2017年11月にブラジルから得点した日本の選手で、それまでブラジルから点を取った日本の選手（福田正博・中村俊輔・大黒将志・玉田圭司）はどれも攻撃の選手（サッカーキング 2025-10-14 の対戦一覧）。
#   さらに2018年W杯のポーランド戦で、レヴァンドフスキの見張り役を任された（本人の言葉がある。サッカーキング 2018-06-29）。ヒットの条件（日本代表・W杯・本人の言葉）に当たる。
#   ブンデスリーガ（ケルン）にも8試合出ている（ヴィッセル神戸公式）。
#   候補から外したもの：名波浩（引退は確か。JFA 公式の経歴は 2008年まで。ただ**使える現役時代の写真が無い**。Commons は引退試合の進行台本の写真1枚だけ、記事の写真は Getty か2020年の取材写真）、
#   細貝萌（2024年引退。Commons が2枚だけで小さい）、今野泰幸（Commons は縦長と小さいものだけ）、柳沢敦・楢崎正剛・中田浩二・小笠原満男（11/7 の担当と同じく写真が無い）、
#   中山雅史（本人が「引退」の言葉を使っていない。日本語版「（引退の）2文字に抗いたい」）、釜本邦茂（2025年に死去）、本田圭佑・香川真司・長友佑都（現役）、
#   高原直泰（11/11 に回した）。
# **重なりの確認（2026-11-06）**：scripts/・research/covered.yaml を「槙野」「Makino」で grep → scripts は 20261110_manager_emery.md（他の担当の書きかけ。別人の話）だけ、covered.yaml は0件。
#   research/posted.json は build 名だけで、makino を含む本は無い。research/20261109_picks.txt の他の担当とも重ならない。
#   同じ時期の日本人レジェンドでは、中澤佑二（11/7）が2006・2010年W杯の守り、宮本恒靖（10/29）が2006年W杯。この回は「ブラジル戦の1点」と「2018年のポーランド戦」に絞る。
# **引退の確認**：ヴィッセル神戸公式 2022-12-25「DF槙野智章選手 現役引退および会見実施のお知らせ」。日本語版・英語版 Wikipedia も同じ。→ **現役ではない**。
#
# **数字の出どころ**
# - 生年月日 1987-05-11・広島市（ヴィッセル神戸公式）。引退の発表時 35歳（同）。
# - 所属：サンフレッチェ広島 → 1.FCケルン → 浦和レッズ → ヴィッセル神戸（同）。
# - J1 通算 415試合46得点、J2 41試合7得点、ブンデスリーガ 8試合（同）。ACL 56試合5得点。主なタイトルに AFCチャンピオンズリーグ 2017（同）。Jリーグベストイレブン3回（同）。
# - 日本代表 38試合4得点（同）。年ごと（日本語版の表）：2010:4 2011:4 2012:3 2013:3 2015:8 2016:2 2017:4 2018:8 2019:2 ＝38。
# - 代表デビュー：2010年1月、アジアカップ予選のイエメン戦でゲームキャプテン（日本語版）。代表初得点 2012-02-24 アイスランド戦（日本語版）。
# - ケルン：2010年12月30日に完全移籍、2011-01-29 ザンクトパウリ戦でブンデスリーガ初出場（日本語版）。1年目5試合、2年目3試合（日本語版の表。合計8はヴィッセル神戸公式と一致）。2012年1月に浦和へ（英語版）。
# - ブラジル戦：2017-11-10、フランスのリールで国際親善試合、日本1対3（サッカーキング 2025-10-14 の一覧、フットボールチャンネル 2017-11-11）。
#   「3点ビハインドで迎えた63分、CKから槙野智章がヘディングシュートを決めて1点を返した」（フットボールチャンネル）。**分はサッカーキングが62分と書くので、台本では分を言わない**。
#   日本のブラジル戦の得点者：1995 福田正博、2005 中村俊輔・大黒将志、2006 玉田圭司、2017 槙野智章、2025 南野拓実・中村敬斗・上田綺世（サッカーキング 2025-10-14）。2025-10-14 に日本が3対2で初めて勝った（同）。
# - 2018年W杯：メンバー入り。1・2戦目は出番なし、3戦目のポーランド戦で W杯初出場（日本語版・サッカーキング 2018-06-29）。
#   2018-06-28 ヴォルゴグラード、日本0対1ポーランド。失点はベドナレクの59分。日本は警告の少なさ（フェアプレーの点）でセネガルを上回り2位で突破（英語版 2018 Group H）。槙野はセンターバックで先発、66分に警告（英語版の先発表）。
#   レヴァンドフスキはこの試合で無得点（英語版の得点者の欄に名前が無い）。日本は2大会ぶりのベスト16（日本語版）。
# - 本人の言葉（原文のまま、短く切る）：
#   ①フットボールチャンネル 2017-11-11「ブラジルのセットプレーの守備の映像をかなり見ていたんですけど、僕が入っていったところがルーズなのはわかっていた」
#   ②同「チームとして0-3で終わるより、『まだ死んでいない』という意味でも大事な一発だったと思う」
#   ③サッカーキング 2018-06-29「試合までに時間があったので、彼のプレー集を見ていました。」「彼を自由にさせないことが仕事だったので、その部分の手応えはあります」
#   ④同「忘れられない一戦になったと思いますね」
# - 見立て（自分で割った）：J1 で 415試合46得点 → 100試合あたり約11点。中澤佑二は J1 593試合36得点（J リーグ公式 2019-01-08）→ 100試合あたり約6点。槙野は約1.8倍。
#
# **入れなかったもの**：妻・テレビ・YouTube、「槙野劇場」、引退試合の退場の演出、いまの監督業とその処分、2007年U-20W杯の髪型、2010年W杯の予備登録、
#   ケルン時代の雑誌の評価（日本語版だけで原文を読めない）、2021年の最終節の話、ブラジル戦の分（62分と63分で割れている）。
# **写真**：assets/images/20261109_makino_tomoaki_legend/（Commons だけ。報道写真は Getty ばかりだった）
#   01 = 「JAP-POL (6).jpg」（Светлана Бекетова、CC BY-SA 3.0、1594x1200、2018-06-28 W杯 日本対ポーランド、レヴァンドフスキ・グロシツキと）
#   02 = 「Tomoaki Makino.jpg」（yoppy、CC BY 2.0、1299x2106、2010年 サンフレッチェ広島）
#   （03 に取った「槙野智章選手（浦和レッズ）.jpg」は動画の1コマで、背景に団体のロゴが大きく入るので外した）
#   01_t = 01 の右側（グロシツキと槙野）を切って1920x1080 にしたサムネ用。panel_01 はこれに表を描いた絵。
#   04 = 「Tomoaki Makino 2018.jpg」（Светлана Бекетова、CC BY-SA 3.0、720x1164、2018年W杯の日本代表、背番号20）
#   05 = 「Sanfrecce Hiroshima Wall.jpg」（yoppy、CC BY 2.0、4057x2693、2010年11月3日 ナビスコカップ決勝、背番号5）
