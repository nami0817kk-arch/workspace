title: 収益化に向けた整理（2026年9月28日）
lead: 目的は「登録1,000人＋本編の視聴時間4,000時間」に届き、審査に通ること
legend: false
labels: ["○ そうする", "△ 保留", "✖ しない"]
note: |
  <b>いまの位置（9/28 に測った数字）</b><br>
  ・登録者 <b>70人</b>（この11日で+36人＝1日3.3人）→ 1,000人まで<b>約280日（2027年7月ごろ）</b><br>
  ・本編の視聴時間 <b>172時間</b>（直近1週間は1日15時間）→ 4,000時間まで<b>約255日</b><br>
  ・審査はチャンネル全体が対象で、結果まで通常1か月。落ちたら30日後に再申請（2回目からは90日後）。<b>審査が重く見るのは「再生上位・視聴時間上位・最新の動画」</b>で、いまそこは他人の声が半分以上の動画が中心（本編の視聴時間の66%）<br>
  ・「500人の早期枠」は公式ヘルプ（日本語・英語）で確かめられなかったので、この整理には入れていません<br>
  <b>「要判断」の札が付いた項目は、○△✖を押してください。「入れた／入れる」は決まりとして進めます（推しは全部○）。</b>
items:
- num: 1
  slot: 数字
  fmt: 要判断
  head: 登録者を増やす柱は「日本人選手の本編」に置く。1日の題材は日本人の5枠を先に埋め、タイトルに名前を出す
  why: '検索で来る言葉の上位5語のうち4語が日本人選手名。本編の再生上位4本（上田9,666回・伊東8,776回・松木8,488回・中村6,533回）も全部日本人の回。本編の再生は中央値42回で、当たりは日本人の回に集中している。登録者の伸びは、この当たりの数で決まる。
    '
- num: 2
  slot: 数字
  fmt: 要判断
  head: 本編の視聴時間の柱は「クラブ紹介のシリーズ」。ラ・リーガ20本を仕上げ、次はブンデスリーガ、セリエAへ
  why: '1本4〜5分、他人の声は0、板や表は自作。審査にいちばん強い型で、視聴時間も1本あたり大きい（プレミア20本で26時間）。プレミアの20本は再生22,066回。
    '
- num: 3
  slot: 数字
  fmt: 要判断
  head: 1日の本数を「題材5本＋シリーズ1本」（本編6・ショート6）に絞る。※9月10日の「本数は減らさない」の見直し
  why: 'ショートは1日10本までしか配られない（実測）。本編は中央値42回で、11本目以降を出しても届く先が無い。直近14日は中央値20本・最大38本で、審査の「量産型」の見え方に直に効く。減らしたぶんの時間を、見立て・自作の絵・用語の説明に回す。
    '
- num: 4
  slot: 審査
  fmt: 入れた
  head: 他人の声は尺の半分まで。ネットの反応は3件まで。voices型は作らない。各本に「見立て」の節を置く
  why: '今日の4本から適用。点検（review）が上限を超えると×を出す。公式ヘルプが対象外とする「他の資料を読み上げただけ」「SNSのコンテンツを集めた短い動画」から離れるため。
    '
- num: 5
  slot: 審査
  fmt: 入れた
  head: 用語は初めて聞く人に通じる形で書く（例：ネーションズリーグの階層、リーグB）。流れの点検の問いに足した
  why: 'ハーランドの回で「リーグBって何？」。事実は合っていたが、説明が無かった。
    '
- num: 6
  slot: 審査
  fmt: 入れる
  head: 型をばらす。節の並び（数字→なぜ→次）を題材ごとに入れ替え、画面の型を「写真が主役」「自作の板が主役」の2つ持つ
  why: '公式ヘルプの「続けて数本視聴した後、繰り返しのように感じられる」に当たらないため。並びの同じさは variety が見る。
    '
- num: 7
  slot: 審査
  fmt: 入れる
  head: 概要欄に「この動画の見立て」を1行置く。チャンネル説明に「独自に数えて比べる」ことを書く（文面は見せてから）
  why: '審査はメタデータ（タイトル・説明・チャンネルの概要）も見る。「独自の解説」があることを、説明の側でも示す。
    '
- num: 8
  slot: 権利
  fmt: 要判断
  head: 写真は Commons・公式サイト・自作の板を先にし、報道写真は「他に無いとき」だけに戻す。写真代理店は禁止のまま
  why: '写真の申し立ては警告になり、3回でチャンネルが消える。9月17日に報道写真まで広げてから、控えでは報道137枚・Commons 269枚。審査は著作権の申し立てとは別に「自分で作ったか」も見るので、自作の板・表を絵の主役にする方向と合う。
    '
- num: 9
  slot: 権利
  fmt: 要判断
  head: Xの投稿の画像（スクショ）は使わない。エンブレムは自作の板の中で小さく使う（今の形）
  why: 'スクショは他人の著作物で、@ハンドルも写る。反応は文字で3件だけになったので、画像で見せる必要が薄い。
    '
- num: 10
  slot: 運用
  fmt: 入れた
  head: 月に1回、審査の目でチャンネルを点検する（tools/ypp_audit.py）。再生上位・視聴時間上位・最新20本の他人の声の割合、1日の本数、写真の出どころ
  why: '9/28 が基準値。新しい形の本が上位に入れ替わってきたかを、数字で追う。
    '
- num: 11
  slot: 運用
  fmt: その時に
  head: 1,000人が近づいたら、公開済みの反応中心の動画（本編86本・ショート88本）の扱いを決める
  why: '非公開にすると本編の視聴時間の66%が消える。残せば審査で見られる。どちらが得かは、その時の上位の顔ぶれで決まるので、今は決めない。
    '
- num: 12
  slot: 運用
  fmt: 入れた
  head: 決まりの整理。CLAUDE.md の頭に「目的は収益化」の節を置き、反する古い決まり（他人の声4割以上・反応10〜20件・voices型）はその節が上書きすると明記した
  why: '本数の扱いは3の判断で決まる。
    '
