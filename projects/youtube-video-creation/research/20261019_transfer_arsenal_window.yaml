- id: sold
  heading: 売ったのは7人。最大の1人は、窓が閉まった2日後に発表された
  tier: 報道
  telop: 売った7人で1億3515万ユーロ。マルティネッリ1人で52%
  narrator: 解説
  card: &outlist
    type: table
    title: 売った選手（受け取った額の大きい順）
    columns: ['選手', '行き先', '百万ユーロ']
    rows:
    - &o1 [ガブリエウ・マルティネッリ, アル・ヒラル, '70.00']
    - &o2 [レアンドロ・トロサール, ベシクタシュ, '18.00']
    - &o3 [ヤクブ・キヴィオル, ポルト, '17.00']
    - &o4 [ガブリエウ・ジェズス, バルセロナ, '10.00']
    - &o5 [ファビオ・ヴィエイラ, ハンブルク, '9.00']
    - &o6 [クリスティアン・ノアゴール, エヴァートン, '8.15']
    - &o7 [カール・ハイン, ブレーメン, '3.00']
    - &o8 [貸し出し2人（額なし）, ドルトムントほか, '－']
  say:
  - text: 次は、アーセナルが売った側。移籍金が入ったのは7人。買いより、3人多い。
    image: assets/images/20261019_transfer_arsenal_window/b08_martinelli_bruges_wr.jpg
    card: *outlist
  - text: いちばん高いのは、マルティネッリ。アル・ヒラルへ、7000万ユーロ。
    emph: true
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 0}
  - text: マルティネッリの退団を伝えた発表文は、こうです。
    card: &doc_mart
      type: document
      label: アーセナル 公式発表（9月3日）マルティネッリ退団の文（訳）
      paragraphs:
      - ガブリエウ・マルティネッリが、サウジ・プロリーグのアル・ヒラルへ、完全移籍した。
      - 2019年7月にブラジルのイトゥアノから加わり、公式戦278試合で62得点。昨季のプレミアリーグ優勝にも貢献した。
      highlight:
      - 完全移籍
      - 278試合
  - text: 7年間で、278試合に出て、62得点。額の記載は、この文にもありません。
    card: *doc_mart
  - text: 報道は、固定で6000万ポンド。アーセナルが売った額で、史上最高です。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 0}
  - text: マルティネッリは昨季、リーグ戦30試合に出て、先発は11試合。
    image: assets/images/20261019_transfer_arsenal_window/b07_martinelli_wr.jpg
    card: none
  - text: この1人で、売った額の52%です。
    emph: true
    card: &calc_mart
      type: calc
      title: 売った額のうち、マルティネッリの割合
      terms:
      - ['7000万ユーロ', マルティネッリ]
      - ['1億3515万ユーロ', 売った7人の合計]
      - [約52%, 1人の割合]
      ops: ['÷', ＝]
  - text: 2人目は、トロサール。ベシクタシュへ、1800万ユーロ。
    image: assets/images/20261019_transfer_arsenal_window/a02_emirates_w.jpg
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 1}
  - text: 報道は、1700万ポンド。集計の額との比が、他の選手と違います。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 1}
  - text: トロサールは約1.06倍。ほかの選手は、約1.17倍でした。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 1}
  - text: キヴィオル、ヴィエイラ、ハインの3人は、貸し出し先に買い取られました。
    emph: true
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 2}
  - text: 3人で2900万ユーロ。売った7人の合計の21%。
    card: &calc_loanbuy
      type: calc
      title: 売った額のうち、貸し出し先に買い取られた3人の割合
      terms:
      - ['2900万ユーロ', キヴィオル・ヴィエイラ・ハイン]
      - ['1億3515万ユーロ', 売った7人の合計]
      - [約21%, 3人の割合]
      ops: ['÷', ＝]
  - text: ジェズスは、バルセロナへ1000万ユーロ。
    image: assets/images/20261019_transfer_arsenal_window/a01_emirates_w.jpg
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 3}
  - text: ノアゴールは、エヴァートンへ815万ユーロ。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 5}
  - text: 貸し出しは2件。ヌワネリはドルトムントへ、セットフォードはスティーブニッジへ。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5, *o6, *o7, *o8], highlight_row: 7}
  - text: どの順番で動いたのか。発表の日付で見ます。
    image: assets/images/20261019_transfer_arsenal_window/b09_tzolis_first_wr.jpg
    card: &when
      type: timeline
      title: アーセナルが発表した主な動き
      rows:
      - ['6月25日', インカピエを完全移籍に（7月1日付）]
      - ['7月15日', トロサールの退団を発表]
      - ['7月23日', ツォリスの加入を発表]
      - ['8月8日', ギマランイスの加入を発表]
      - ['8月21日', コンサの加入を発表]
      - ['9月3日', マルティネッリの退団を発表]
      focus: 8月21日
  - text: 選手を動かせる期間を、窓と言います。夏の窓は、6月15日に開きました。
    card: *when
  - text: 買いが終わったのは、8月21日のコンサです。
    emph: true
    card:
      <<: *when
      highlight_row: 4
  - text: この日までに売れたのは、4人。4615万ユーロで、買いに使った額の約20%。
    emph: true
    card: &calc_early
      type: calc
      title: 買い終えた8月21日までに売った額は、払った額の何割か
      terms:
      - ['4615万ユーロ', 8月21日までの売り]
      - ['2億2710万ユーロ', 買った4人の合計]
      - [約20%, 買い終えた時点の割合]
      ops: ['÷', ＝]
  - text: 残りの8900万ユーロは、9月1日と3日に決まりました。
    card:
      <<: *when
      highlight_row: 5
  - text: ジェズスとヴィエイラが1日。マルティネッリが3日です。
    image: assets/images/20261019_transfer_arsenal_window/b08_martinelli_bruges_wr.jpg
    card:
      <<: *when
      highlight_row: 5
  - text: 窓が閉まったのは、9月1日の23時。マルティネッリの発表は、その2日後でした。
    emph: true
    card: &calc_late
      type: calc
      title: 売った額のうち、買い終えたあとに決まった割合
      terms:
      - ['8900万ユーロ', 9月1日と3日の3人]
      - ['1億3515万ユーロ', 売った7人の合計]
      - [約66%, 買い終えたあとの割合]
      ops: ['÷', ＝]
  - text: 売った額の約66%は、買い終えたあとに動きました。
    card: *calc_late
