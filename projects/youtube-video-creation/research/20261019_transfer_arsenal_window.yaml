  - text: 4人目は、ツォリス。クラブ・ブルッヘから、4000万ユーロ。
    image: assets/images/20261019_transfer_arsenal_window/b09_tzolis_first_wr.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた4人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6], highlight_row: 3}
  - text: 報道は、3400万ポンド。ベルギー・リーグの史上最高額です。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた4人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6], highlight_row: 3}
  - text: ツォリスは昨季のベルギーで、リーグ戦36試合17得点、23アシスト。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた4人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6], highlight_row: 3}
  - text: 移籍金なしで、リーズからメリエも加わりました。ゴールキーパーです。
    image: assets/images/20261019_transfer_arsenal_window/a01_emirates_w.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた4人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6], highlight_row: 4}
  - text: 昨季は貸し出していた5人が、夏に戻りました。この額には入りません。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた4人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6], highlight_row: 5}
  - text: この5人のうち3人は、そのまま売られました。次に見ます。
    card: none
    image: assets/images/20261019_transfer_arsenal_window/b08_martinelli_bruges_wr.jpg
