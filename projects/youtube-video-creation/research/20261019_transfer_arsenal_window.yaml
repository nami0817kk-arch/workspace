# 移籍の深掘り 第8回：アーセナルの2026年夏（「1クラブの移籍期間」の回）。10/19 作成（10/18 夜に取材）。
# 材料の控え：research/raw/20261019_transfer_arsenal_window.md。**材料から出ない。**
#
# **角度：「払った額は世界7位。売って戻った額は、何割か」。**
#   順位の物差しは**公式ではなく移籍サイト Transfermarkt の集計**（2026年夏・支出順の一覧の1ページ目＝支出の上位25クラブ）。
#   7位アーセナル 227.10（加入12）／収入 135.15（退団11）／差し引き −91.95。8位レアル 225.00、6位リヴァプール 264.60。
#   戻った割合 135.15÷227.10＝59.5%（約60%）。**売り（移籍金の付いた7人）だけの収入。貸し出し料は無い**（貸し出し2件は額なし）。
#   **報道のポンドで数え直しても近い**：スカイ・スポーツの夏の一覧（出来高込み）で 買い 75＋55＋34.5＋34＝198.5／売り 60＋7.7＋19＋17＋8.6＋7＋2.6＝121.9 → 61.4%。
#
# **数字の確度。**移籍金は Transfermarkt の集計で**確度は「報道」**。
#   - **クラブ公式（arsenal.com）の発表文を読んだ**：買い（ギマランイス 8/8・コンサ 8/21・ツォリス 7/23・インカピエ＝6/25に7/1付で完全移籍・メリエ 7/9）、
#     売り（トロサール 7/15・キヴィオル 7/1・ノアゴール 8/5・ジェズス 9/1・ヴィエイラ 9/1・マルティネッリ 9/3・ハイン 5/23に発表→7月に完了）、貸し出し（ヌワネリ→ドルトムント・セットフォード→スティーブニッジ）。
#     **額は1つも書かれていない**（公式の移籍一覧は全部「undisclosed＝非公表」）。
#   - 報道の額は**ポンド**：ギマランイス 7500万（Sky、固定か出来高かは書いていない）、コンサ 固定5100万＋出来高最大400万（Sky）、ツォリス 3400万（Sky・ベルギー・リーグ最高額）、
#     インカピエ 去年9月の貸し出し時の報道は買い取り4500万／今夏の Sky 一覧は3450万（**割れている**）、マルティネッリ 6000万・固定・次の売却の取り分つき・クラブ売却額の最高（Sky）。
#   - **集計のユーロは、報じられた「固定の額」のポンドの約1.17倍**：ギマランイス 87.50÷75＝1.167、コンサ 59.60÷51＝1.169、ツォリス 40÷34＝1.176、マルティネッリ 70÷60＝1.167。
#     **コンサの集計は固定の5100万に近く、出来高の400万は入っていない**。合わない：トロサール（集計18.00ユーロ、報道1700万ポンド＝約1.06倍）。
#   - 固定かボーナス込みかは、クラブの発表に無い。マルティネッリの次の売却益の取り分と、コンサの出来高は数に入っていない（言う）。
#   - Sky の夏の一覧には、ヴィエイラの行き先が「ポルト」と書かれている（クラブ公式はハンブルク）。**使わない**。
#
# **自分で数えた数**（百万ユーロ。足し算で一覧と一致を確かめた）:
#   払った額 87.50＋59.60＋40.00＋40.00＝227.10 ← 一覧と一致（移籍金の付いた加入4人。メリエは移籍金なし）。
#   戻った額 70.00＋18.00＋17.00＋10.00＋9.00＋8.15＋3.00＝135.15 ← 一覧と一致。差し引き 135.15−227.10＝−91.95 ← 一覧と一致。
#   戻った割合 135.15÷227.10＝59.51%（約60%）／戻らなかった 91.95（40%）。
#   買い上位2人（8月の2人）87.50＋59.60＝147.10 → ÷227.10＝64.8%（65%）。
#   売り：マルティネッリ 70÷135.15＝51.8%（52%）。貸し出し先の買い取りの3人（キヴィオル17＋ヴィエイラ9＋ハイン3）＝29.00 → 21.5%（21%）。
#   発表日で数える：買い終えた8月21日までの売り キヴィオル17＋トロサール18＋ノアゴール8.15＋ハイン3＝46.15 → ÷227.10＝20.3%（約20%）。
#     その後（ジェズス10・ヴィエイラ9 が9/1、マルティネッリ70 が9/3）＝89.00 → ÷135.15＝65.9%（66%）。
#   市場価値（Transfermarkt のクラブ詳細表の「Market value」＝移籍時）：
#     買い4人 70＋45＋50＋40＝205 → 227.10÷205＝1.108（約1.11倍）／コンサ 59.60÷45＝1.32／線より下はインカピエ（50→40）の1人、ツォリスは線の上（40→40）。
#     売り7人 45＋18＋35＋17＋18＋5＋3＝141 → 135.15÷141＝0.958（約0.96倍）／線より上：マルティネッリ（45→70、1.56倍）・ノアゴール（5→8.15、1.63倍）／
#     線の上：トロサール（18→18）・ハイン（3→3）／線より下：キヴィオル（35→17）・ジェズス（17→10）・ヴィエイラ（18→9）。
#   為替：ECB 参照相場 2026-10-16＝1ユーロ177.82円（再確認）。91.95×177.82＝16,351百万円＝約164億円（163.5億）。
#   支出の上位7クラブ（世界の一覧）の戻った割合：リヴァプール 31.20÷264.60＝11.8%／トッテナム 44.8%／アーセナル 59.5%／シティ 64.0%／ニューカッスル 89.2%／チェルシー 109.9%／ヴィラ 121.7%。下から3番目。
#   プレミア20クラブの差し引きのマイナス（大きい順）：リヴァプール −233.40／トッテナム −202.10／イプスウィッチ −201.29／シティ −189.18／コヴェントリー −155.40／ハル −155.39／ユナイテッド −117.55／ブレントフォード −111.45／アーセナル −91.95（9番目）。
#   報道のポンド（Sky の夏の一覧。出来高込み）：買い 75＋55＋34.5＋34＝198.5、売り 60＋7.7＋19＋17＋8.6＋7＋2.6＝121.9 → 61.4%（約61%）。
#   次の窓：プレミアリーグ公式 — 夏は6/15〜9/1 23:00 BST、冬は2027/1/1〜2/1。
# 数字の重なり対策：10/17（チェルシー）・10/18（トッテナム）とは別のクラブ・別の数字。『2億2710万』『1億3515万』『9195万』『60%』『65%』『52%』『21%』『20%』『66%』『1.11倍』『0.96倍』『61%』はこの回だけ。
# 板：①table・document・waterfall・calc・convert ②table・document・convert・calc・table ③table・document・calc・timeline・calc ④scatter 2枚・calc・table（赤ペン）・calc。
# 写真（10/18 取得）：クラブ公式（arsenal.com の記事の写真）。ギマランイス・コンサ・ツォリス・インカピエ・マルティネッリ。エミレーツは Commons（10/17 の財政の回と同じ2枚）。
