  say:
  - text: 買いは高かったのか。売りは安かったのか。市場価値を当てて、数えます。
    image: assets/images/20261019_transfer_arsenal_window/b04_konsa_match_wr.jpg
    card: none
  - text: 市場価値は、移籍サイトの推定値で、実際の値段ではありません。
    card: *scat_in
  - text: 買った4人の市場価値は、合計で2億500万ユーロ。
    card: *scat_in
  - text: 払った額は、その約1.11倍です。
    emph: true
    card: &calc_in
      type: calc
      title: 買った4人は市場価値の何倍か
      terms:
      - ['2億2710万ユーロ', 買った4人の合計]
      - ['2億500万ユーロ', 直前の市場価値の合計]
      - [約1.11倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: いちばん離れたのは、コンサ。市場価値の約1.32倍。
    card:
      <<: *scat_in
      highlight: コンサ
  - text: 線より下は、インカピエだけ。市場価値より、安く買いました。
    card:
      <<: *scat_in
      highlight: インカピエ
  - text: 売った7人は、どうか。同じ図にします。
    image: assets/images/20261019_transfer_arsenal_window/a01_emirates_w.jpg
    card: &scat_out
      type: scatter
      title: 売った7人の、移籍直前の市場価値と、受け取った額
      x: {label: 移籍直前の市場価値, unit: 百万ユーロ}
      y: {label: 受け取った額, unit: 百万ユーロ}
      points:
      - [マルティネッリ, 45, 70]
      - [トロサール, 18, 18]
      - [キヴィオル, 35, 17]
      - [ジェズス, 17, 10]
      - [ヴィエイラ, 18, 9]
      - [ノアゴール, 5, 8.15]
      - [ハイン, 3, 3]
      diagonal: 市場価値と同じ額
      focus: マルティネッリ
  - text: 売った7人の市場価値は、合計で1億4100万ユーロ。
    card: *scat_out
  - text: 受け取った額は、その約0.96倍です。ほぼ、市場価値どおり。
    emph: true
    card: &calc_out
