  viewpoint: true
  heading: 買いは市場価値の約1.11倍、売りは約0.96倍。戻った割合は、支出上位7クラブで下から3番目
  tier: 報道
  telop: 買った4人は市場価値の約1.11倍、売った7人は約0.96倍
  narrator: 解説
  card: &scat_in
    type: scatter
    title: 買った4人の、移籍直前の市場価値と、払った額
    x: {label: 移籍直前の市場価値, unit: 百万ユーロ}
    y: {label: 払った額, unit: 百万ユーロ}
