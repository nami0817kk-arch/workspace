      - [約0.96倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: 線より上は、2人。マルティネッリとノアゴールです。
    card:
      <<: *scat_out
      highlight: マルティネッリ
  - text: マルティネッリは、市場価値の約1.56倍で売れました。
    card:
      <<: *scat_out
      highlight: マルティネッリ
  - text: 線より下は、キヴィオル、ジェズス、ヴィエイラの3人です。
    card:
      <<: *scat_out
      highlight: キヴィオル
