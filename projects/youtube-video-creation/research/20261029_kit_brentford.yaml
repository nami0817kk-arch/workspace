  - text: 指摘を受けて、この紋章は数年で外されました。
    image: assets/images/20261029_kit_brentford/k01_lineup.jpg
    card: none
  - text: 1990年代の半ばには、ファンが描いた紋章が使われ始めます。
    image: assets/images/20261029_kit_brentford/k01_lineup.jpg
    card:
      <<: *crest
      highlight_row: 3
  - text: そして2017年から、いまの形。二重の丸に、大きな蜂を1匹置いた紋章です。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card:
      <<: *crest
      highlight_row: 4
    emph: true
  sources:
