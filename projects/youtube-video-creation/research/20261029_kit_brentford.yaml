# ユニフォームとエンブレムの歴史 ブレントフォード（10/29 作成）。雛形は 10/28 ボーンマス回。
# 題の問い：ブレントフォードの胸の蜂は、本当に蜂だったのか（答え＝1890年代、学生の応援「バック・アップ、ビーズ（Bの字）」を新聞が蜂と聞き違えた）。
# 重なり確認（2026-10-28 夜）：scripts/*kit_*・research/covered.yaml・research/posted.json を grep。ブレントフォードのユニフォーム回は無し。
#   20260920_pl04_brentford（クラブ紹介・39日前）は「愛称は『ビーズ』。蜂です。」の1行だけ（由来は言っていない）。酒場の投票の話はそちらで済み→この回では言わない。
#   20261012_stadium_brentford（スタジアム・17日前）は競技場の話。この回では競技場の話はしない（写真だけ流用）。
#   フラムは 10/24 にスタジアム回、ハルは 10/29 のスタジアム回なので避けた。
# 今季のリーグ：ウィキペディア en "2026–27 Brentford F.C. season"（league = Premier League、「6季連続でプレミア」）。
# 取材：requests だけ。ブラウザ操作・JS実行・検索のAI要約は使っていない。
#   読んだ：ウィキペディア en "Brentford F.C."（Nickname 節、Colours and badge 節、Kit suppliers の表）、"2026–27 Brentford F.C. season"、
#     Historical Football Kits（HFK。ファンの資料サイトだが典拠を明記）：Brentford の Background。
#   読めなかった：クラブ公式の紋章の告知（crest.brentfordfc.co.uk、2016-11-10）は開いていない。紋章の話はウィキペディアと HFK の一致した所だけ使う。
# ---- 食い違い・断ったこと ----
#   ・愛称の年：ウィキペディア「1890年代」、HFK「1893年ごろ」→「1890年代」とだけ言う。
#   ・聞き違えたのは誰か：ウィキペディア「地元の新聞」、HFK「観客が取り違え、地元紙が広めた」→「周りと地元の新聞が、蜂と受け取った」。
#   ・1893年ごろの最初の印：ウィキペディア「1893年、白い盾に BFC と青い波線。川とボートのクラブを表すと考えられる」、
#     HFK「1893〜94年のチーム写真に、頭文字と川らしい模様の印」→「1890年代の写真に、頭文字と波の線。川を表す、と考えられています」。
#   ・1938〜39年の町の紋章：HFK「確かではないが、ブレントフォード＆チズウィックの紋章らしい」→「町の紋章とされる印を、1季だけ」。
#   ・1888年の紋章を外した年：ウィキペディア「1975年5月まで使い、1975〜76年から新しい紋章」、HFK「新しい図案は1976年」→年は言わず「数年で外した」。
#   ・ファンが描いた紋章：ウィキペディア「1993年に描き、1994年から」、HFK「1995年2月に発表」→「1990年代の半ば」とだけ言う。
#     ウィキペディアは「シーズンチケット2枚と引き換えに描いた」。2011年に別の人（ラッセル・グラント）が「自分が描いた」と言ったが誤り、とも書く→その話は入れない。
#   ・金と青の1季：ウィキペディア「1960〜61年、うまくいかなかった」、HFK「1960年に戻したが効かず、季の終わりに4部へ」。
#     ただし降格は1962年の季の終わりで HFK の表とも合わない→降格は言わない。「うまくいかず、1季で縞に戻した」まで。
#   ・2季続けて着た：HFK「ファンの負担を軽くするため、2021〜22年のシャツをもう1季。2023〜25年にも繰り返した」。ウィキペディアの表も 2021–2023・2023–2025 の区切り。
#   ・1部への昇格：HFK「2021年、1946〜47年の季以来」。
# ---- 自分で数えた数 ----
#   赤と白の縞：1925〜26年の季から。2026−1925＝101年。外したのは1960〜61年の1季だけ（ウィキペディア）。
#   愛称から紋章の蜂まで：愛称1890年代（HFK 1893年ごろ）、蜂の入った紋章 1971〜72年（ウィキペディア）。1971−1893＝78→「80年近く」。
#   2季ずつ：2021年から2025年までの4季でホームのシャツは2着。毎季新しくすれば4着。4÷2＝2季に1着。
#   紋章の創立年：1888年と書いたが、本当は1889年（ウィキペディア）。差は1年。
# ---- 日本との接点 ----
#   無し（research/pl_data/japan.json にブレントフォードの日本人は無い）。入れない。
# ---- 写真（assets/images/20261029_kit_brentford/、出典は credits.json）----
#   k01〜k04 は Commons（10/12 のスタジアム回・9/20 のクラブ紹介で使ったもの。wt-yt-0906 から写した）。
#   k05 は Commons の CC0（2025-11-29 バーンリー戦、背番号24）。原版は 429 で取れず、960px の縮小版から切った。
#   エンブレム画像そのもの・放送映像・代理店の写真は使っていない（k02 は競技場の壁の紋章を撮った写真）。
