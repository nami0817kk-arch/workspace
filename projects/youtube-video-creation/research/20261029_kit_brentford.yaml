sections:
- id: bees
  main: true
  heading: ブレントフォードの胸の蜂は、本当に蜂だったのか
  bg: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
  tier: 背景
  narrator: 解説
  telop: 愛称ビーズは、学生の応援「Bの字」を、周りが蜂と聞き違えたもの
  card: *bees
  say:
  - text: 今回は、ブレントフォードの、赤と白の縞と、胸の蜂です。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card: none
    emph: true
  - text: ブレントフォードの愛称は、ビーズ。紋章の真ん中にも、大きな蜂がいます。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card: none
  - text: ところが、この愛称の始まりは、虫の蜂とは別のものでした。
    image: assets/images/20261029_kit_brentford/k01_lineup.jpg
    card: none
    emph: true
  - text: 1890年代、近くのボロー・ロード・カレッジの学生たちが、試合を見に来ていました。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card:
      <<: *bees
      highlight_row: 1
  - text: お目当ては、ブレントフォードでプレーしていた、仲間のジョセフ・ゲッティンズ。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card: none
  - text: 学生たちは、学校の応援の言葉で叫びます。バック・アップ、ビーズ。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card:
      type: document
      label: ウィキペディア英語版「ブレントフォードFC」愛称の節（訳）
      paragraphs:
      - 学生たちは、学校の応援「バック・アップ、ビーズ（Bの字）」で仲間を励ました。地元の新聞はこれを「バック・アップ、ビーズ（蜂）」と聞き違え、愛称が残った。
      highlight:
      - Bの字
      - 聞き違え
  - text: このビーズは、蜂ではなく、アルファベットのビーの字でした。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card: none
    callword: Bの字
    emph: true
  - text: ところが、周りと地元の新聞は、これを蜂と受け取ります。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card: none
  - text: こうして、聞き違いから、ビーズという愛称が残りました。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card: none
  - text: 蜂が紋章に入るのは、ずっとあとの1971年です。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card:
      <<: *bees
      highlight_row: 2
    emph: true
  sources:
  - https://en.wikipedia.org/wiki/Brentford_F.C.
  - https://www.historicalkits.co.uk/Brentford/Brentford.htm
