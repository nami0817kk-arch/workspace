    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card:
      <<: *colours
      highlight_row: 0
  - text: 最初のシャツは、そのボートのクラブの色。サーモン、えんじ、水色です。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card: none
  - text: 1903年には、後援者だったロスチャイルド卿の、競馬の勝負服の色、金と青に。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card:
      <<: *colours
      highlight_row: 1
  - text: 1920年、フットボールリーグに入るときは、白いシャツでした。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card:
      <<: *colours
      highlight_row: 2
  - text: そして1925年、いまの赤と白の縞が始まります。
    image: assets/images/20261029_kit_brentford/k01_lineup.jpg
    card:
      <<: *colours
      highlight_row: 3
    emph: true
  - text: その後、縞を外したのは一度だけ。
    image: assets/images/20261029_kit_brentford/k01_lineup.jpg
    card: none
  - text: 1960年からの1季、運を変えようと、昔の金と青に戻しました。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card:
      <<: *colours
      highlight_row: 4
  - text: けれど、うまくいかず、1季で縞に戻しています。
    image: assets/images/20261029_kit_brentford/k03_griffin1982.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Brentford_F.C.
  - https://www.historicalkits.co.uk/Brentford/Brentford.htm
- id: crest
