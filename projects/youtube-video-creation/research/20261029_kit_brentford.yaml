    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card: none
  - text: 1890年代の写真には、頭文字と波の線の印。川を表す、と考えられています。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 1971年、4つに割った盾の1つに、蜂の巣と蜂が入ります。
    image: assets/images/20261029_kit_brentford/k02_crest_stadium.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 愛称が生まれてから、80年近くあとのことです。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card: none
  - text: 翌年には、新しい紋章をファンから募ります。選ばれたのは、丸の中に蜂と縞の図案。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: ところが、その紋章には、創立の年が1888年と書かれていました。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
    card: *wrongyear
    emph: true
  - text: 本当の創立は、1889年。1年ずれていたのです。
    image: assets/images/20261029_kit_brentford/k04_griffin2013.jpg
