  - id: trend
    heading: 2人の数字は、いつ入れ替わったのか
    tier: 報道
    telop: シーズンごとの90分あたり
    narrator: 解説
    card: &trendcard
      type: line
      title: 得点＋アシスト、90分あたり（クラブの全公式戦）
      x: [23/24, 24/25, 25/26, 26/27]
      series:
        - [ヤマル, [0.49, 0.85, 1.02, 1.78]]
        - [サカ, [0.86, 0.89, 0.55, 0.62]]
      focus: ヤマル
      note: 年齢はシーズンが終わる6月末のもの。26/27は10月20日までの数字（ヤマル1011分・サカ727分）
    say:
      - text: シーズンごとに並べます。同じ数字を、季ごとに追います。
        image: assets/images/20261022_yamal/fra143/01_w.jpg
        card: *trendcard
      - text: 23/24。ヤマルは16歳で0.49。サカは22歳で0.86でした。
        card: {<<: *trendcard, highlight: 23/24}
      - text: 24/25。ヤマルは0.49から0.85へ。
        image: assets/images/20261022_saka/gha296/01_w.jpg
        card: {<<: *trendcard, highlight: 24/25}
      - text: サカは0.86から0.89へ。ほぼ並びます。
        card: {<<: *trendcard, highlight: 24/25}
      - text: 25/26。ヤマルが1.02、サカが0.55。ここで、ヤマルが上に出ました。
        emph: true
        card: {<<: *trendcard, highlight: 25/26}
      - text: 今季は、ここまで。ヤマルが1.78、サカが0.62。昨季より、2人とも上です。
        image: assets/images/20261022_yamal/arg144/01_w.jpg
        card: {<<: *trendcard, highlight: 26/27}
      - text: サカの今季は727分。試合が増えれば、動く数字です。
        card: {<<: *trendcard, highlight: 26/27}
    sources:
      - https://www.transfermarkt.com/lamine-yamal/leistungsdaten/spieler/937958
      - https://www.transfermarkt.com/bukayo-saka/leistungsdaten/spieler/433177

  - id: value
    heading: 市場価値は、同じ年齢で並べると、どれだけ違うのか
    tier: 報道
    telop: 同じ年齢での市場価値
    narrator: 解説
    card: &valuecard
      type: duel
      left: {name: ヤマル, club: バルセロナ, photo: assets/images/20261022_yamal/arg144/01_sq.jpg, color: "#004d98"}
      right: {name: サカ, club: アーセナル, photo: assets/images/20261022_saka/pan065/01_sq.jpg, color: "#ef0107"}
      rows:
        - [18歳の最高値, 2億€, 3500万€]
        - [19歳の最高値, 2.2億€, 6500万€]
      bars: [18歳の最高値, 19歳の最高値]
      note: Transfermarkt の市場価値の推移。年齢ごとの最高値
    say:
      - text: 市場価値は、各年齢の最高値で見ます。
        image: assets/images/20261022_saka/gha284/01_w.jpg
        card: *valuecard
      - text: 18歳は、ヤマルが2億ユーロ。サカが3500万ユーロ。
        card: {<<: *valuecard, highlight_row: 18歳の最高値}
      - text: 19歳は、サカが6500万ユーロ。
        image: assets/images/20261022_yamal/fra057/01_w.jpg
        card: {<<: *valuecard, highlight_row: 19歳の最高値}
      - text: ヤマルの19歳の値は、サカの3.4倍あまりになります。
        emph: true
        card: {<<: *valuecard, highlight_row: 19歳の最高値}
      - text: サカが22歳でつけた最高値は、1.4億ユーロ。
        image: assets/images/20261022_saka/pan065/01_w.jpg
        card: none
      - text: ヤマルは、17歳で2億ユーロに届いていました。
        image: assets/images/20261022_yamal/arg144/01_w.jpg
        card: none
    sources:
      - https://www.transfermarkt.com/lamine-yamal/marktwertverlauf/spieler/937958
      - https://www.transfermarkt.com/bukayo-saka/marktwertverlauf/spieler/433177

  - id: view
    heading: 見立て・差は、出始めた早さか、1分あたりの数字か
    tier: 背景
    viewpoint: true
    narrator: 解説
    telop: 数字の違いが示すもの
    card: &viewcard
      type: duel
      left: {name: ヤマル, club: バルセロナ, photo: assets/images/20261022_yamal/arg144/01_sq.jpg, color: "#004d98"}
      right: {name: サカ, club: アーセナル, photo: assets/images/20261022_saka/pan065/01_sq.jpg, color: "#ef0107"}
      rows:
        - [0.85前後に届いた年齢, 17歳, 22歳]
        - [19歳の誕生日までの出場, 11219分, 2827分]
        - [昨季の90分あたり, "1.02", "0.55"]
        - [19歳の最高値, 2.2億€, 6500万€]
      bars: [19歳の誕生日までの出場, 昨季の90分あたり, 19歳の最高値]
      note: 90分あたりは得点＋アシスト。クラブの全公式戦
    say:
      - text: 見立てです。0.85前後に届いたのは、ヤマルが17歳、サカが22歳。
        mark: {kind: circle, row: 0}
        image: assets/images/20261022_saka/pan130/01_w.jpg
        card: {<<: *viewcard, highlight_row: 0.85前後に届いた年齢}
      - text: 19歳の誕生日までに、クラブで出た時間は、ヤマルのほうが4倍ほど。
        card: {<<: *viewcard, highlight_row: 19歳の誕生日までの出場}
      - text: ヤマルは、早くから長く出て、数字も高い水準へ届きました。
        emph: true
        image: assets/images/20261022_yamal/fra057/01_w.jpg
        card: {<<: *viewcard, highlight_row: 昨季の90分あたり}
      - text: ただ、チャンピオンズリーグの通算は、0.86と0.91でした。
        image: assets/images/20261022_saka/gha296/01_w.jpg
        card: none
      - text: サカの22歳と23歳も、0.86と0.89。サカの高い水準です。
        card: none
      - text: 差は、出始めた早さと、昨季の1分あたりの数字の、2つに見えます。
        image: assets/images/20261022_yamal/fra143/01_w.jpg
        card: {<<: *viewcard, highlight_row: 19歳の最高値}
      - text: 次は、バルセロナ対レアル・マドリード。日本時間26日の午前5時です。
        card: none
      - text: アーセナルは、日本時間24日の午後11時、エヴァートン戦。
        image: assets/images/20261022_saka/pan065/01_w.jpg
        card: none
      - text: ヤマルの1.78と、サカの0.62が、どう動くか。見届けます。
        image: assets/images/20261022_yamal/arg144/01_w.jpg
        card: none
    sources:
