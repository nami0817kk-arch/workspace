# 中村俊輔が、A代表に初めて呼ばれた日のことを話した（2026年9月13日）
#
# **出どころはサッカーキング。**9月12日、JFAサッカー文化拠点「blue-ing！」で
# 行われた『キリンカップサッカー2026開催トークイベント』での話。
# **会見ではない。**イベントの場であることを必ず言う。
#
# 引きは**「促されて座ったのが、カズの席だった」**。初招集の緊張ではなく、
# **序列がそのまま席になっていた**ところが芯。ここが山場（@main）。
#
# **引ける発言は2つだけ。**記事にある3つめの「俊さんからいつも声かけてもらって」は、
# **誰の発言か記事から特定できない**ので使わない。
#
# **昔話として面白がるだけにしない。**いまはコーチとして代表にいる人の話
format: quote
# **発言が2つしかない回。**トークイベントの一部なので、その分だけ下げる
voice_min: 40
slot: japan_4
