    say:
      - 9月12日のトークイベントで、中村俊輔がA代表への初招集を振り返りました。1998年、オーストラリア遠征です。
      - いまは日本代表のコーチとして、チームの中にいる人です。
    official: false
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260912/2203965.html

  - id: bus
    heading: バスで起きたこと
    main: true
    tier: 報道
    telop: 「一番後ろだよ」と促されて
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 緊張した話ではなく、**序列がそのまま席になっていた**ところが芯
    card:
      type: quote
      title: 中村俊輔
      text: わかんないわけですよ、一番端。そしたらカズさんが来られて…
    say:
      # **ショートは山場の節だけを切り出すので、状況もここに入れる**
      - 19歳での初招集でした。
      - {voice: 中村俊輔, text: もうド緊張で行きました}
      - 移動のバスで、どこに座ればいいか分からない。先輩に「お前、一番後ろだよ」と促されます。
      - {voice: 中村俊輔, text: わかんないわけですよ、一番端。そしたらカズさんが来られて…}
      - 促された先は、三浦知良の席でした。
      # **反応もここに入れる**（2026-09-13 ユーザー「この内容、ショートにも入れて」）。
      # ショートは山場の節しか切り出さないので、別の節に置くと入らない。
      # **4件はユーザーが貼ったもの。**こちらで作った文は1つも無い。
      # 3件目は元の改行のまま2行に分けた（切らない決まり）
      - {voice: ネット民, text: その後が気になる！}
      - {voice: ネット民, text: カズが来てどうなったのか？周囲の先輩たちのフォローアップはあったのか？？当時の状況を知りたい！}
      - {voice: ネット民, text: 最後部の左側はカズの指定席。}
      - {voice: ネット民, text: 通称「キングシート」}
      - {voice: ネット民, text: フランスでカズが外れた後、中田がその席に座ってたのが象徴的だったみたいな記事があったなぁ}
    official: false
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260912/2203965.html
