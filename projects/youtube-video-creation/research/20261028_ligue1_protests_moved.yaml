#     記事の主写真は「Kiran RIDLEY / AFP via Getty Images」なので使わない。
#   ・ESPN の日程（https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard?dates=20261030〜20261102）:
#     ニース対レンヌ 10/30 18:00Z（現地19時）、リヨン対アンジェ 11/1 16:15Z（現地17時15分）、ロリアン対ブレスト 11/2 19:45Z（現地20時45分）。
#     フランスは 10/25 から冬時間（UTC+1）。台本では細かい時刻は言わず、記事の言い方（日曜の午後・金曜の夜・月曜の夜）に合わせる。
#   ・ESPN の各クラブの日程（site.api.espn.com/.../teams/<id>/schedule?fixture=true）:
#     リヨン 11/5 ヨーロッパリーグ（アウェーでレアル・ソシエダ）→ 11/8 アウェーでブレスト。
#     レンヌ 11/5 ヨーロッパリーグ（ホームでオリンピアコス）。ブレスト 11/2 ロリアン → 11/8 リヨン。ロリアン 11/2 → 11/8 ル・アーヴル。
#   ・LFP（ligue1.com）の声明の原文は検索で見つけられず読めていない → 確度は「報道」どまり（確定と言わない）。
# 決まり: デモの政治的な中身（何に抗議しているか）は台本に入れない。サッカーへの影響と、理由として発表された言葉（地元の行政当局の要請）だけ。
# 本人の言葉: 無し（クラブ・監督・選手のコメントは読めていない）→ Y にしない。反応: 0件（作らない）。
# 写真: Commons のスタジアム・試合の場面4枚（人物の題ではない）。グルパマ・スタジアム2枚、アリアンツ・リヴィエラ1枚、ムストワール1枚。
# 見立ての「あいだの日数」は、上の日程から自分で数えた（日付の差。時刻は数えていない）。
#   リヨン: 土曜→木曜なら あいだ4日 / 日曜→木曜で あいだ3日。木曜→日曜（ブレスト戦）は あいだ2日。
#   レンヌ: 土曜→木曜なら あいだ4日 / 金曜→木曜で あいだ5日。ブレスト: 月曜→日曜で あいだ5日。
