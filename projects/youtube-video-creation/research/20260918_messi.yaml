# バロンドールでメッシを推している人たち（2026-09-18）
#
# **軸はユーザー指定**（「メッシを推す人という軸でまとめましょう」）。
# 誰が獲るかを当てる回ではない。**推している顔ぶれそのもの**を見る回。
#
# **前提の確認（ここを間違えると全部が崩れる）**
#   2026年のバロンドールは**まだ授賞式前**。候補30人が9月9日に発表され、
#   授賞式は10月26日。**投票の結果は出ていない。**
#   だから「誰が誰に入れた」という話は**存在しない**。書かない。
#
# **ジダンの「メッシに100回投票する」は使わない**（2026-09-18 に裏取り）。
#   最初は5人目として扱う気でいたが、反応を集める過程で
#   日本語のコメントと海外のコメントの**両方から独立に**捏造の疑いが出た。
#   確かめた結果：
#     ・英語・フランス語・スペイン語の記事は**すべてマルカを出典としている**
#     ・マルカの**元記事にあたる取材（日付・媒体・録音）が見つからない**
#     ・フランスの媒体が検証して「元のインタビューも、その日付も、
#       録音も、我々の確認では見つけられなかった」と書いている
#       → https://www.shango.media/foot-365-ballon-dor-je-voterais-100-fois-le-choix-attribue-a-zidane-fait-parler-11825675
#   最初は「出回っているが、たどれない」という節を立てたが、
#   **その節ごと落とした**（2026-09-18 ユーザー指示「ジダンはややこしいので、やめよう」）。
#   たどれない話を説明すること自体が回をややこしくする、という判断。
#   **この回にジダンは一切出さない。蒸し返さない。**
#   （記録として：ジダンがフランス代表監督なのは確定。2026年7月28日就任、
#   4年契約、8月1日から。初戦は9月25日のトルコ戦。肩書きのほうは間違っていない）
#
# **残った4人。並べると、こうなっている**
#   デ・パウル   … メッシと同じインテル・マイアミの選手
#   ベッカム     … インテル・マイアミの共同オーナー
#   シメオネ     … アルゼンチン人
#   ラウタロ     … アルゼンチン代表でメッシと同じチーム
#   **4人とも、クラブか国でメッシとつながっている。**そこが引き。
#
# **「身内だから信用できない」とは言わない。**事実を並べるだけにする。
# 本心で言っている可能性は当然ある。断じない。
#
# **ヤマルとムバッペは題材にしない**（9/15 に2本とも扱っている）。
# マテウスの発言とネットの声に出てくるぶんだけ。**この2人の主張は引かない。**
#
# **反対意見は入れない**（2026-09-18 ユーザー指示「反対意見はいらない」）。
# 用意していたマテウス（1990年の受賞者。ケイン推し）の節は**落とした**。
# 軸は「推している人」なので、推していない人を並べると軸がぼける。
# 空いた声（13）はラウタロに回した。**蒸し返さない。**
# ネットの声のほうは、賛否を選り分けずにそのまま載せている（従来どおり）
#
# **喋っている人の写真を出す**（2026-09-18 ユーザー指示
# 「その人の声の時はその人の写真を出して」）。デ・パウル・ベッカム・シメオネ・
# ラウタロの4人ぶんを Commons から取って、その人の節の行に `image:` で貼った。
# デ・パウルとラウタロは**2026年ワールドカップの写真**、シメオネは2024年、
# ベッカムは2021年（現役ではないので古くても差し支えない）
#
# **名前と肩書きは1行にまとめる**（2026-09-18）。分けて書いたら、
# ショートの尺詰めで名前の行だけが落ち、**デ・パウルの発言が誰の言葉か
# 分からないまま**流れた。振り（「こう言いました。」）だけを別行にして、
# 切るならそこを切らせる
#
# **写真はユーザー指定**（「バロンドール受賞した時のメッシがよい」）。
# 2019年の受賞時、バルセロナの自宅でフランスフットボール誌の取材を受けた
# ときの1枚（Commons, CC BY-SA 4.0）。**7年前の写真だが、意図して選んでいる**
# ——トロフィーが写っている写真は Commons にこれしか無い
#
# **海外の声は「海外の反応」ブログの訳文**（英語の原文そのものではない）。
# X はログイン壁、r/soccer には到達できなかった。9/18 のクロップの回と同じ扱い
