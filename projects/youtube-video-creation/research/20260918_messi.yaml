  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    bg: assets/backgrounds/messi_20260918.png
    telop: 「そりゃアルゼンチン人だから推すよね」
    narrator: キャスター
    say:
      - {short_only: true, text: メッシを推した人の顔ぶれについて、こんな声が出ています。}
      - {voice: ネット民, text: そりゃアルゼンチン人だから推すよね。とれなくてもバロンドールを今メッシが競ってる事実が信じられないくらい凄いこと}
      - {voice: ネット民, text: マイアミのオーナーってのもあるだろうけど、そこは同国のケインって言わないのか}
      - {voice: 海外のファン, text: もし彼がイングランド人だったら、ハリー・ケインと言っていたはずだ}
      - {voice: ネット民, text: アルゼンチン人からしたらそうでしょうね。ただ真面目に選考するなら、年齢を評価基準に入れてはダメでしょう}
      - {voice: ネット民, text: 年齢は関係なくて、パフォーマンスでしょ。その歳にしては頑張ってるみたいになるが、バロンドールはそれじゃない。それなら我らがキングカズもノミネートされるわ}
      - {voice: ネット民, text: 所属がMLSだからね。メッシの成し遂げた事は素晴らしいけど、バロンドールは無いかな}
      - {voice: 海外のファン, text: MLSかサウジでプレーしている時点で、自動的に対象外にすべきだと思う}
      - {voice: 海外のファン, text: メッシはワールドカップでかなりの差をつけて最高の選手だった。レベルが落ちるリーグかもしれないけど、世界的なトップ選手でも彼ほどの数字を残せていない人は多い}
      - {voice: ネット民, text: ケインとメッシなら、議論の余地なくケインでしょ}
      - {voice: ネット民, text: メッシはもうスーパーバロンドールを与えるべきなんじゃないですかね。メッシでダメならもう誰も受賞出来ないでしょ, short_voice: true}
      - {voice: 海外のファン, text: あいつは死体同然の状態からでも決勝まで運んだんだ。他の誰にもできないことだし、やっぱり彼が最高だ}
      - {voice: 海外のファン, text: でも誰が獲ろうと、結局みんな「本当はあいつが獲るべきだった」と言い合って、誰も満足しないと思う, short_voice: true}
