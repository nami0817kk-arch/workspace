    telop: 「議論の余地はない」「彼が受賞すべきだ」
    narrator: キャスター
    say:
      - {short_only: true, text: バロンドールでメッシを推しているのは誰か、という話です。}
      - {text: "まず、ロドリゴ・デ・パウル、32歳。インテル・マイアミの選手です。", image: assets/photos/20260918_2s_depaul/01.png}
      - {text: アルゼンチンの番組で、こう言いました。, image: assets/photos/20260918_2s_depaul/01.png}
      - {voice: デ・パウル, text: 議論の余地はない, image: assets/photos/20260918_2s_depaul/01.png}
      - {voice: デ・パウル, text: ワールドカップの年に、メッシに肩を並べた選手は誰もいない, image: assets/photos/20260918_2s_depaul/01.png}
      - {voice: デ・パウル, text: これからも出ないだろう。しかも彼は39歳だ, image: assets/photos/20260918_2s_depaul/01.png}
      - {text: "デービッド・ベッカム、51歳。インテル・マイアミの共同オーナーです。", image: assets/photos/20260918_2s_beckham/01.jpg}
      - {voice: ベッカム, text: 39歳であれだけのことを、しかもあのレベルで成し遂げている選手は他にいない, image: assets/photos/20260918_2s_beckham/01.jpg}
      - {voice: ベッカム, text: 私の意見では、彼が受賞すべきだ, image: assets/photos/20260918_2s_beckham/01.jpg}
      - {text: ディエゴ・シメオネ、56歳。アトレティコ・マドリーの監督です。, image: assets/photos/20260918_pair_simeone/01.jpg}
      - {text: 15日の会見で問われ、こう答えました。, image: assets/photos/20260918_pair_simeone/01.jpg}
      - {voice: シメオネ, text: メッシ。間違いなく, image: assets/photos/20260918_pair_simeone/01.jpg}
      - {voice: シメオネ, text: あの年齢で、あのワールドカップをやったことを考えれば, image: assets/photos/20260918_pair_simeone/01.jpg}
      - {voice: シメオネ, text: 疑いなくメッシ, image: assets/photos/20260918_pair_simeone/01.jpg}
      - {text: ラウタロ・マルティネス、29歳。インテルの選手です。, image: assets/photos/20260918_messi_lautaro/01.jpg}
      - {voice: ラウタロ, text: 間違いない。彼は世界最高, image: assets/photos/20260918_messi_lautaro/01.jpg}
    official: false
