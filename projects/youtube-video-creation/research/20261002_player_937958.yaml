- id: view
  heading: 見立て
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月11日、バルセロナ対ヘタフェ
  say:
  - text: 最後に、数字でこの先を見ます。
    image: assets/images/20261002_yamal_semi_face_w/01.jpg
  - 世界年間最優秀選手、バロンドールの発表は10月26日。
  - 本人は9月に、エムバペとの2人を挙げてこう言いました。
  - voice: ヤマル
    text: 世界最高の選手は僕たち2人だと思っていて、
  - voice: ヤマル
    text: 今年は勝ち取ったタイトルから僕が受賞に値するはずだ
    cont: true
    pause: 0.6
  - そのエムバペは今季9試合で9点、779分。
  - ヤマルも9試合で9点、時間もほぼ同じ。点は同じで、そこに6アシストが乗ります。
  - リーグの再開は10月11日、ヘタフェ戦です。
  - 発表までにこの差が動くか。1試合5本のシュートが続くかを見ます。
  sources:
