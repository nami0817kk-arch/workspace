- id: hook
  heading: どんな選手か
  tier: 報道
  telop: メッシに抱かれた赤ん坊が、メッシからワールドカップを奪った
  narrator: キャスター
  say:
  - text: ラミン・ヤマル。メッシの腕の中にいた赤ん坊が、そのメッシからワールドカップを奪いました。
    image: assets/images/20261002_yamal_final_face_w/01.jpg
  - 2007年12月、生後5か月。ユニセフの撮影で、20歳のメッシが沐浴させた写真が残っています。
  - 19年後のワールドカップ決勝で、その2人が対戦。勝ったあと、本人はこう言いました。
  - voice: ヤマル
    text: もし数年前にメッシと対戦した後に
  - voice: ヤマル
    text: ワールドカップを掲げることになると誰かに言われていたら、
    cont: true
  - voice: ヤマル
    text: その人のことをどうかしてると思っただろうね
    cont: true
    pause: 0.5
  - 10代でユーロとワールドカップを両方獲った、史上ただ1人の選手。
  - 同じ攻撃的MFとウイング100人の中で、シュートの数は1位、空中戦は最下位。
  - どうしてそうなったのかを、順に見ていきます。
  sources:
