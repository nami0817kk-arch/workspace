  say:
  - text: ヤマルの道は、7歳で入ったバルセロナの育成組織から、一度も外に出ていません。
    image: assets/images/20261002_yamal_semi_face/01.jpg
  - text: そのあいだの市場価値の線は、16歳のときから一度も下がっていません。
    image: assets/stats/player_20261002_1467236_value.png
    no_telop: true
  - 転機は2023年4月29日、ベティス戦。
  - 15歳290日で、クラブ最年少のトップデビューでした。
  - 同じ年の9月に代表デビューして初ゴール。
  - 10月にはラ・リーガの最年少ゴールも塗り替えました。
  - 翌年のユーロ準決勝、フランス戦。16歳362日で、大会の最年少ゴールです。
  - text: 2025年7月16日、契約を2031年まで延ばした日に10番を受け取り、
    image: assets/images/20261002_yamal_barca10/01.jpg
  - その1年後、19歳でワールドカップを掲げました。
