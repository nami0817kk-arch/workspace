sections:
- id: hook
  heading: どんな選手か
  tier: 報道
  telop: メッシに抱かれた赤ん坊が、メッシからワールドカップを奪った
  narrator: キャスター
  say:
  - text: ラミン・ヤマル。メッシの腕の中の赤ん坊は、19年後、そのメッシから世界一を奪いました。
    image: assets/images/20261002_yamal_final_face_w/01.jpg
  - ユニセフの撮影で、20歳のメッシが、生後わずか5か月の赤ん坊を沐浴させました。
  - 2007年12月の、その写真が今も残っています。
  - 舞台はワールドカップ決勝。2人は敵として向き合います。
  - 勝ったヤマルが口にしたのが、この言葉です。
  - voice: ヤマル
    text: もし数年前にメッシと対戦した後に
  - voice: ヤマル
    text: ワールドカップを掲げることになると誰かに言われていたら、
    cont: true
  - voice: ヤマル
    text: その人のことをどうかしてると思っただろうね
    cont: true
    pause: 0.5
  - 10代でユーロとワールドカップを両方獲った選手は、歴史上ヤマルただ1人。
  - しかも同じ攻撃的MFとウイング100人の中で、シュートの数は1位、空中戦は最下位。
  - とことん尖ったこの形は、どこから来たのか。順番にひもといていきます。
  sources:
  - https://www.fotmob.com/players/1467236
  - https://www.soccer-king.jp/news/world/wc/20260717/2184841.html
  - https://qoly.jp/q1/17853871
  - https://www.nbcsports.com/soccer/news/lamine-yamal-shines-in-world-cup-final-as-lionel-messi-passes-the-baton
