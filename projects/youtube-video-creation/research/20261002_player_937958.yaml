  say:
  - text: 7歳でバルセロナの育成組織に入ってから、ヤマルは一度もクラブの外に出ていません。
    image: assets/images/20261002_yamal_semi_face/01.jpg
  - text: 市場価値の線も、16歳から一度も下がらず右肩上がりです。
    image: assets/stats/player_20261002_1467236_value.png
    no_telop: true
  - 最初の転機は2023年4月29日、ベティス戦。
  - 15歳290日。クラブ史上最年少で、トップチームのピッチに立ちました。
  - 同じ年の9月には代表デビュー。その試合で、いきなり初ゴールです。
  - 10月には、ラ・リーガの最年少ゴール記録まで塗り替えました。
  - 翌年のユーロ準決勝では、16歳362日で大会の最年少ゴールを叩き込みます。
  - text: 2025年7月16日、契約を2031年まで延ばしたその日に、クラブの10番を受け取り、
    image: assets/images/20261002_yamal_barca10/01.jpg
  - その1年後には、19歳で世界の頂点。ワールドカップを掲げました。
  sources:
