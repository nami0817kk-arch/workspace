- id: story
  heading: マル秘話
  tier: 報道
  telop: 「304」と、メッシではない10番
  narrator: 解説
  card:
    type: points
    title: ヤマルの原点
    items:
    - 「304」：育ったロカフォンダ地区の郵便番号の下3桁
    - 子どもの頃の憧れはメッシではなくネイマール
    - 背番号は41→27→19→10。10番はアンス・ファティから
  say:
  - text: ここからは数字を離れて、ヤマルらしい話を2つ。
    image: assets/images/20261002_yamal_medal_w/01.jpg
  - 1つ目は「304」。ワールドカップのサウジアラビア戦で、ゴールのあと両手で作った数字です。
  - 育ったマタロのロカフォンダ地区、郵便番号の下3桁。移民の労働者が多く住む街です。
  - 子どもの頃を、本人はこう話しています。
  - voice: ヤマル
    text: 昔はキッチンと寝室が一緒になっているような
  - voice: ヤマル
    text: 狭いアパートに住んでいました。
    cont: true
  - voice: ヤマル
    text: だから今、母が幸せそうにしていて、
    cont: true
  - voice: ヤマル
    text: 弟が僕の理想としていたような
    cont: true
  - voice: ヤマル
    text: 恵まれた子供時代を送れているのを見ることが、
    cont: true
  - voice: ヤマル
    text: 僕にとって一番の幸せなんです
    cont: true
    pause: 0.6
  - 2つ目は背番号。41、27、19と来て、2025年7月16日に10番を受け取りました。
  - 子どもの頃の憧れはメッシではなくネイマールだった、と本人が話しています。背負った背番号の重さは、本人の言葉で。
  - voice: ヤマル
    text: バルサは私の人生です。7歳からここにいます
  - voice: ヤマル
    text: メッシは自分の道を歩んだ。私も自分の道を歩む
    cont: true
    pause: 0.6
  - text: その翌年の夏、代表の19番で世界一になりました。
    pause: 0.5
  sources:
  - https://www.jiji.com/jc/article?k=2026071400210&g=spo
  - https://news.yahoo.co.jp/articles/4465c4d1b687c1fea77c97420097e2810d8bde6f
  - https://www.fcbarcelona.com/en/news/4314453/lamine-yamal-is-the-fc-barcelona-no10
  - https://www.tokyo-sports.co.jp/articles/-/352354
