  say:
  - text: バルセロナのヤマル、19歳。ユーロもワールドカップも10代で獲った左足が、今季はさらに加速しています。
    short_only: true
  - text: 今季は9試合で9得点6アシスト。761分の出場で、84分ごとに1点という速さ。
    image: assets/images/20261002_yamal_final_wide/01.jpg
  - ラ・リーガは7試合で7点4アシスト。チャンピオンズリーグは1試合で1点2アシスト。
  - 直近5試合に絞ると、5点6アシスト。評点は10点満点で、5試合すべて8.8以上です。
  - シュートは同じ位置で1位、守備は下から9番目。
  - その極端な形のまま、今季も点が止まらないんです。
  sources:
  - https://www.transfermarkt.com/lamine-yamal/profil/spieler/937958
  - https://www.fotmob.com/players/1467236
- id: story
  heading: マル秘話
  tier: 報道
  telop: 「304」と、メッシではない10番
  narrator: 解説
  card:
    type: points
    title: ヤマルの原点
    items:
    - 「304」：育ったロカフォンダ地区の郵便番号の下3桁
    - 子どもの頃の憧れはメッシではなくネイマール
    - 背番号は41→27→19→10。10番はアンス・ファティから
  say:
  - text: ここからは数字を離れて、ヤマルらしさが詰まった話を2つ。
    image: assets/images/20261002_yamal_medal_w/01.jpg
  - 1つ目は「304」。ワールドカップのサウジアラビア戦、ゴールのあとに両手で作った数字です。
  - これは育ったマタロのロカフォンダ地区の、郵便番号の下3桁。移民の労働者が多く暮らす街です。
  - 子どもの頃のことを、本人はこう振り返っています。
  - voice: ヤマル
    text: 昔はキッチンと寝室が一緒になっているような
  - voice: ヤマル
    text: 狭いアパートに住んでいました。
    cont: true
  - voice: ヤマル
    text: だから今、母が幸せそうにしていて、
    cont: true
  - voice: ヤマル
    text: 弟が僕の理想としていたような
    cont: true
  - voice: ヤマル
    text: 恵まれた子供時代を送れているのを見ることが、
    cont: true
  - voice: ヤマル
    text: 僕にとって一番の幸せなんです
    cont: true
    pause: 0.6
  - 2つ目は背番号。41、27、19と変わってきて、2025年7月16日、ついに10番を受け取りました。
  - 実は、子どもの頃の憧れはメッシではなくネイマールだった、と本人が話しています。
  - では、あの10番をどう背負っているのか。本人の言葉です。
  - voice: ヤマル
    text: バルサは私の人生です。7歳からここにいます
  - voice: ヤマル
    text: メッシは自分の道を歩んだ。私も自分の道を歩む
    cont: true
    pause: 0.6
  - text: そして翌年の夏、代表の19番を背負って、世界一になりました。
    pause: 0.5
  sources:
  - https://www.jiji.com/jc/article?k=2026071400210&g=spo
  - https://news.yahoo.co.jp/articles/4465c4d1b687c1fea77c97420097e2810d8bde6f
  - https://www.fcbarcelona.com/en/news/4314453/lamine-yamal-is-the-fc-barcelona-no10
  - https://www.tokyo-sports.co.jp/articles/-/352354
  - https://www.sportbible.com/football/la-liga/fc-barcelona/lamine-yamal-lionel-messi-barcelona-257853-20241022
- id: view
  heading: バロンドールまでのエムバペとの差
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月11日、バルセロナ対ヘタフェ
  say:
  - text: 最後に、ここから先を数字で見通します。
    image: assets/images/20261002_yamal_semi_face_w/01.jpg
  - 世界年間最優秀選手、バロンドールの発表は10月26日。
  - 本人は9月、エムバペと自分の2人を挙げて、こう言い切りました。
  - voice: ヤマル
    text: 世界最高の選手は僕たち2人だと思っていて、
  - voice: ヤマル
    text: 今年は勝ち取ったタイトルから僕が受賞に値するはずだ
    cont: true
    pause: 0.6
  - そのライバル、エムバペも今季9試合で9点。ただ9月の代表戦で、左ひざを痛めました。
  - ヤマルも9試合で9点。点は互角で、そこにヤマルは6アシストを上乗せしています。
  - リーグの再開は10月11日、ヘタフェ戦。
  - 発表までにこの差が開くのか。1試合5本のシュートが続くかどうかに注目です。
  sources:
  - https://www.espn.com/soccer/story/_/id/50055928/zidane-goes-wild-olise-wonder-goal-france-late-victory
  - https://www.transfermarkt.com/lamine-yamal/profil/spieler/937958
  - https://www.transfermarkt.com/kylian-mbappe/profil/spieler/342229
  - https://www.fotmob.com/players/1467236
  - https://www.goal.com/jp/ニュース/barcelona-yamal-mbappe-real-madrid-loga-football-soccer-20260914/blt1cbcbe62c89b3ec7
