  say:
  - text: 同じ攻撃的MF・ウイングの中で、ヤマルはどこが尖っているか。レーダーで見ます。
    image: assets/stats/player_20261002_1467236_radar.png
    no_telop: true
  - レーダーの6つの軸のうち、シュートの数と得点は最上位。空中戦と守備の関与は最下位です。
  - text: ボールを持つ場所は、右サイドの高い位置。ヒートマップの赤いところです。
    image: assets/stats/player_20261002_1467236_heat.png
    no_telop: true
  - そこから中へ持ち込んで、左足で自分が打つ選手。
  - ドリブルは今季30回成功、成功率60%。作ったチャンスは27回で、上位3%です。
  - text: 今季のシュートは、ラ・リーガ7試合で38本。1試合に5本以上打って、7点を取っています。
    image: assets/stats/player_20261002_1467236_shots.png
    no_telop: true
  - 弱点は守備。タックルやボール奪取といった守備の数は、同じ位置の中で下から9番目。
  - 2025年4月のドルトムント戦では走る量がチームでいちばん少なく、
  - 努力なしでは最高の選手になれない、と味方から直接言われました。
