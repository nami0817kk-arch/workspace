# 板倉滉のアジア杯辞退報道に、日本協会が答えた（2026年9月13日）
#
# **出どころはゲキサカ。**山本技術委員長の囲みでの発言。
# 報道そのものはドイツ紙『ライニッシュ・ポスト』など。
#
# 引きは**「技術委員長が、何度も言葉を選んでいる」**。
# 辞退が決まったとは誰も言っていない。**濁していること自体が中身。**ここが山場（@main）。
#
# **辞退が決まったかのように書かない。**JFAは肯定も否定もしていない。
# **こちらで「事実上の辞退」などと解釈しない。**発言を並べて、聞く人に委ねる。
#
# **クラブ側の言い分は記事に無い。**ボルシアMGのコメントは出さない。
#
# **板倉を責める書き方にしない。**契約の話はクラブと選手のもので、
# 技術委員長自身が「我々が入り込むことはできない」と言っている
format: news
# **発言が6つ並ぶ回。**技術委員長ひとりの言葉なので、その分だけ下げる
