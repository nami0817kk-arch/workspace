  - id: jfa
    heading: 日本協会は何と答えたか
    main: true
    tier: 報道
    telop: 「我々がここで発言する立場じゃない」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 辞退するかどうかではなく、**協会が言葉を選び続けていること**が芯
    card:
      type: quote
      title: 山本技術委員長
      text: クラブと選手の話なので、我々がここで発言する立場じゃない
    say:
      # **ショートは山場の節だけを切り出すので、報道の中身もここに入れる**
      - 板倉が今夏の加入時に、クラブへ「アジア杯出場を見送る用意がある」と伝えていた。そう報じられました。
      - これについて、日本サッカー協会の山本技術委員長がこう答えました。
      - {voice: 山本技術委員長, text: ルール上は決まっているものは決まっているので、それに沿って準備をする}
      - {voice: 山本技術委員長, text: クラブと選手の話なので、我々がここで発言する立場じゃない}
      - {voice: 山本技術委員長, text: クラブと個人の契約に我々が入り込むことはできない。大陸大会の招集はルールで決まっているので、それに沿って実行している}
      - 本人とのやり取りについては、こう述べています。
      - {voice: 山本技術委員長, text: 板倉選手とは常にコミュニケーションは取っている}
      - {voice: 山本技術委員長, text: 日常的にコミュニケーションは取っている。いろんな状況を把握した上で今の現状があるので、可能性も含めて考えている}
    official: false
    sources:
      - https://web.gekisaka.jp/news/japan/detail/?458639-458639-fl

