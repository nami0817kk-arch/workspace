# 町田浩樹が1年ぶりにブンデスへ戻った（2026-09-17）
#
# **ほぼ全部が確定事実。**試合結果・出場時間・負傷の中身・順位まで裏が取れている。
# 報道の要素がないので、断定してよい回。
#
# **引きは「デビュー戦で怪我をした」**。移籍初年度の開幕節、ブンデスデビューの
# その試合の45分で左ひざ前十字靱帯を断裂している。そこから1年3週間。
# ここが山場（@main）。
#
# **候補ファイルの topic は「FC町田ゼルビア」になっていた**（クラブ名の町田と
# 取り違え）。league も japan だった。どちらも直してある。
#
# **「元日本代表」と書かない。**日本語版Wikipediaの冒頭がそう書いているが、
# 代表引退の記述はどこにもなく、単に更新が止まっているだけ（2025年6月で停止）。
#
# **本人の復帰コメントは入れない。**クラブ公式が403で開けず、確認できていない。
