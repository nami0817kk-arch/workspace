    tier: 報道
    telop: 9月12日、69分から出場。約1年ぶりのブンデス
    narrator: キャスター
    card:
      type: table
      title: 復帰した試合
      columns: ["", ""]
      rows:
        - ["日付", "2026年9月12日（ブンデス第3節）"]
        - ["結果", "ホッフェンハイム 2-1 シュツットガルト"]
        - ["町田", "69分から出場"]
        - ["得点", "フロジェク（13分・67分）／ミッテルステット（48分）"]
    say:
      - 町田浩樹が、ブンデスリーガのピッチに戻ってきました。
      - 9月12日、第3節のシュツットガルト戦です。
      - ホッフェンハイムが2対1で勝ち、町田は**69分から**出場しました。
      - 得点はアダム・フロジェクが13分と67分。シュツットガルトは48分にミッテルステットが返しています。
      - この出場が、**約1年ぶり**でした。
    official: false
    sources:
      - https://web.gekisaka.jp/photonews/world/detail/?458964-458964-pn

  - id: injury
    heading: 1年前に何があったか
    main: true
    tier: 報道
    telop: 2025年8月23日、ブンデスデビュー戦の45分で左ひざを断裂
    narrator: 解説
    card:
      type: table
      title: デビューから復帰まで
      columns: ["", ""]
      rows:
        - ["2025年6月27日", "ユニオンSGからホッフェンハイムへ"]
        - ["2025年8月23日", "開幕節でブンデスデビュー。45分に交代"]
        - ["2025年8月24日", "クラブが左ひざ前十字靱帯断裂を発表"]
        - ["2026年9月12日", "2試合目。385日ぶり"]
    say:
      - なぜ1年も空いたのか。
      - 町田がホッフェンハイムに来たのは、2025年6月27日でした。
      - ベルギーのユニオン・サンジロワーズからの完全移籍です。
      - そして迎えた2025年8月23日、開幕節のレヴァークーゼン戦。
      - "**これが、町田のブンデスリーガでのデビュー戦**でした。"
      - その試合の**45分**に、町田は交代しています。
      - 翌24日、クラブが発表しました。**左ひざの前十字靱帯断裂**です。
      - つまり、**デビューしたその試合で怪我をした**ことになります。
      - クラブのスポーツディレクターは、こう話しています。
      - {voice: ホッフェンハイムの責任者, text: 我々にとって、そして当然コウキ本人にとって、苦い知らせだ}
      - {voice: ホッフェンハイムの責任者, text: 彼は新加入でありながら、ごく短い時間でチームに完全に溶け込み、守備で重要な役割を担っている}
      - {voice: ホッフェンハイムの責任者, text: この離脱は痛い。長期になると見ている}
      - そこから復帰までが、**385日**でした。1年と20日です。
    official: false
    sources:
      - https://www.getfootballnewsgermany.com/2025/hoffenheim-confirm-brutal-acl-tear-for-defender-koki-machida/
      - https://en.wikipedia.org/wiki/Koki_Machida

  - id: club
    heading: 戻った先のチーム
    tier: 報道
    telop: ホッフェンハイムは3試合目で今季初勝利
    narrator: キャスター
    card:
      type: table
      title: ホッフェンハイムの今季
      columns: ["", ""]
      rows:
        - ["第1節", "2-3 アウクスブルク（黒星）"]
        - ["第2節", "2-3 ドルトムント（黒星）"]
        - ["第3節", "2-1 シュツットガルト（初勝利）"]
        - ["順位", "13位・勝点3・得失点6対7"]
    say:
      - 町田が戻った試合は、チームにとっても意味がありました。
      - "ホッフェンハイムにとって、**今季リーグ戦の初勝利**だったからです。"
      - 第1節はアウクスブルクに2対3、第2節はドルトムントに2対3。
      - どちらも2点を取りながら、3点を返されています。
      - 3試合目でようやく勝ち、順位は13位。勝ち点3です。
      - 相手のシュツットガルトも、同じ1勝0分2敗で14位でした。
      - "つまり**初勝利を探していた者どうしの一戦**で、町田が戻ってきたことになります。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Bundesliga

