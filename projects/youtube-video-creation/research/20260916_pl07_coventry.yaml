sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: ミシンの会社のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1883年8月13日"]
        - ["最初の名前", "Singers F.C."]
        - ["改名", "1898年"]
        - ["愛称", "The Sky Blues（スカイブルーズ）"]
    say:
      - 最初の名前は「**シンガーズ**」でした。ミシンや自転車を作っていた会社の名前です。
      - 会社のチームとして始まり、いまの名前になったのは1898年です。
      - 創設は1883年8月13日。イングランド中部の街のクラブです。
      - 愛称は「スカイブルーズ」。**空色**です。
      - 由来はそのまま、ユニフォームの色です。1962年からずっと、この色を着ています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには坂元達裕がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "フランク・ランパード"]
        - ["主将", "マット・グライムズ（MF・イングランド）"]
        - ["エース", "ハジ・ライト（FW・アメリカ）"]
        - ["昨季", "18点。25年ぶりの昇格を牽引"]
        - ["日本人選手", "坂元達裕（右ウイング・背番号7）"]
    say:
      - "このクラブには、**坂元達裕**がいます。右ウイングです。"
      - エースはハジ・ライト。ロサンゼルス生まれのアメリカ代表フォワードです。
      - "昨季は**18点**。25年ぶりの1部復帰を、点で引っ張りました。"
      - 監督はフランク・ランパードです。
      - 主将はマット・グライムズ。イングランド人の中盤です。
      - "昨季は46試合のうち**42試合**で腕章を巻いていました。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: exile
    heading: 本拠地を追われた
    main: true
    tier: 背景
    telop: 70マイル離れた街のスタジアムを間借りした
    narrator: 解説
    card:
      type: table
      title: 落ちていった10年
      columns: ["", ""]
      rows:
        - ["2001年", "34年続いた1部から降格"]
        - ["2013年", "ノーサンプトンへ間借り（往復70マイル）"]
        - ["2017年", "4部まで落ちる"]
        - ["2026年4月17日", "25年ぶりの1部復帰"]
    say:
      - このクラブは、一度**家を追われています。**
      - 経営の行き詰まりから、2013年、本拠地を離れることになりました。
      - 移った先はノーサンプトン・タウンのスタジアム。**往復70マイル**、およそ113キロの道のりです。
      - そこで**1年以上**戦いました。
      - 落ちるところまで落ちて、2017年には4部にいます。
      - そこから戻ってきました。
      - "**2026年4月17日**、プレミアリーグへの昇格が決まります。"
      - 1部に戻るのは、2000年から01年のシーズン以来、25年ぶりでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 1987年のFAカップ。ウェンブリーでトッテナムを3対2
    narrator: 解説
    card:
      type: table
      title: 1987年のFAカップ決勝
      columns: ["", ""]
      rows:
        - ["会場", "ウェンブリー"]
        - ["相手", "トッテナム"]
        - ["結果", "3対2"]
        - ["1部にいた期間", "1967年から2001年まで34季"]
    say:
      - 1987年のFAカップ。ウェンブリーでの決勝で、トッテナムを3対2で下しました。
      - 「名勝負」として残っている試合です。
      - このクラブは、1967年から2001年まで**34シーズン続けて**1部にいました。
      - "その34年のあいだに獲った大きなタイトルが、**この1987年のひとつ**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 決まった呼び名が無い。残るのは1977年の最終節
    narrator: 解説
    card:
      type: table
      title: 宿敵をめぐる記録
      columns: ["", ""]
      rows:
        - ["サポーターが挙げる相手", "アストン・ヴィラ（2020年の調査で83%）"]
        - ["ダービーの呼び名", "ヴィラ戦には無い"]
        - ["1976-77年の最終節", "引き分けで両者残留。事実上プレーが止まる"]
        - ["M69ダービー", "レスター戦。今季その相手はプレミアにいない"]
        - ["今季", "ヴィラはプレミアリーグにいる"]
    say:
      - "この街のクラブの宿敵には、**決まった呼び名がありません。**"
      - "2020年の調査では、**83%**のサポーターがアストン・ヴィラを5大ライバルに挙げています。"
      - ただ、いつ何があってそうなったのかは書かれていないのです。
      - そのヴィラは、今季もプレミアリーグにいます。
      - 年号つきで残っている出来事は、別の相手とのものでした。
      - 1976年から77年のシーズン最終節。相手はサンダーランドです。
      - 2対2の引き分けなら両方が残り、サンダーランドが落ちる。それが分かった時点で、こちらとブリストル・シティは事実上プレーをやめました。
      - ウルヴァーハンプトンとは、1960年代の終わりから70年代のはじめにかけて激しく争っています。
      - 1967年にそろって昇格し、のちにFAカップの準々決勝で当たりました。
      - "レスター・シティとの一戦は「**M69ダービー**」と呼ばれ、2023年から24年に11年ぶりに戻りました。ただしレスターは、今季のプレミアリーグにいません。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 209試合続けて出場。5年間ひとつも休まなかった
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["スティーブ・オグリゾビッチ", "601試合／209試合連続出場"]
        - ["キース・ハウチェン", "66試合12得点／1987年決勝の同点弾"]
        - ["クラリー・ボートン", "182得点。クラブ史上最多得点"]
    say:
      - "1984年8月から1989年9月まで、**209試合続けて**リーグに出た選手がいます。"
      - スティーブ・オグリゾビッチ。ゴールキーパーです。
      - 在籍は1984年から2000年で601試合。クラブ史上最多の出場数になります。
      - "**1987年にFAカップを獲ったとき**、ゴールを守っていたのもこの人でした。"
      - その決勝で名前を残したのが、キース・ハウチェンです。
      - 63分、デイブ・ベネットのクロスへ飛び込んだダイビングヘッドで、2対2に追いつきました。
      - この一撃がクラブ唯一の主要タイトルにつながり、BBCの番組では年間最優秀ゴールにも選ばれています。
      - 在籍は1986年から89年。公式戦は66試合12得点でした。
      - 得点の記録を持つのはクラリー・ボートン。1931年から37年に182得点です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Steve_Ogrizovic
      - https://en.wikipedia.org/wiki/Keith_Houchen
      - https://en.wikipedia.org/wiki/List_of_Coventry_City_F.C._records_and_statistics
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 持っている大きなタイトルは、1987年のFAカップ
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "1回（1986-87）"]
        - ["2部優勝", "2回（直近 2025-26）"]
        - ["2026年4月17日", "25年ぶりの1部復帰"]
    say:
      - "持っている大きなタイトルは、**1987年のFAカップ**です。"
      - 昨季はチャンピオンシップ、つまり2部で優勝しました。2部優勝はこれで2回目です。
      - その優勝メンバーに、坂元達裕がいます。
      - そのクラブが、25年ぶりに1部へ戻ってきました。
      - "**坂元がプレミアのピッチに立つこと自体、このクラブでは初めて**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
