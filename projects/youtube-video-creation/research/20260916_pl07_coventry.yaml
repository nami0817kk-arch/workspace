sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: ミシンの会社のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1883年8月13日"]
        - ["最初の名前", "Singers F.C."]
        - ["改名", "1898年"]
        - ["愛称", "The Sky Blues（スカイブルーズ）"]
    say:
      - アルファベット順では、7番目に来ます。
      - 創設は1883年8月13日。イングランド中部の街のクラブです。
      - 最初の名前は「**シンガーズ**」でした。ミシンや自転車を作っていた会社の名前です。
      - いまの名前になったのは1898年です。
      - 愛称は「スカイブルーズ」。**空色**です。
      - 由来はそのまま、ユニフォームの色です。1962年からずっと、この色を着ています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.

  - id: exile
    heading: 本拠地を追われた
    main: true
    tier: 背景
    telop: 70マイル離れた街のスタジアムを間借りした
    narrator: 解説
    card:
      type: table
      title: 落ちていった10年
      columns: ["", ""]
      rows:
        - ["2001年", "34年続いた1部から降格"]
        - ["2013年", "ノーサンプトンへ間借り（往復70マイル）"]
        - ["2017年", "4部まで落ちる"]
        - ["2026年4月17日", "25年ぶりの1部復帰"]
    say:
      - このクラブは、一度**家を追われています。**
      - 経営の行き詰まりから、2013年、本拠地を離れることになりました。
      - 移った先はノーサンプトン・タウンのスタジアム。**往復70マイル**、およそ113キロの道のりです。
      - そこで**1年以上**戦いました。
      - 落ちるところまで落ちて、2017年には4部にいます。
      - そこから戻ってきました。
      - "**2026年4月17日**、プレミアリーグへの昇格が決まります。"
      - 1部に戻るのは、2000年から01年のシーズン以来、25年ぶりでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.

  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。坂元達裕
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "フランク・ランパード"]
        - ["日本人選手", "坂元達裕"]
        - ["本拠地", "ビルディング・ソサエティ・アリーナ"]
        - ["収容人数", "32,609人"]
    say:
      - 監督はフランク・ランパードです。
      - このクラブには、日本人選手がいます。**坂元達裕**です。
      - 本拠地はビルディング・ソサエティ・アリーナ。収容は3万2609人です。
      - 昇格したばかりのクラブとしては、大きいほうの器になります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.

  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 34年1部にいて、タイトルは1987年の1つだけ
    narrator: 解説
    say:
      - このクラブは、1967年から2001年まで**34シーズン続けて**1部にいました。
      - そのあいだに獲った大きなタイトルは、ひとつだけです。
      - 1987年のFAカップ。ウェンブリーでの決勝で、トッテナムを3対2で下しました。
      - 「名勝負」として残っている試合です。
      - "**クラブの歴史で、いまのところ唯一の大きなタイトル**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
