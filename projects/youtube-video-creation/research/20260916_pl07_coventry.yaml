# プレミアリーグ20クラブ紹介 ⑦コヴェントリー・シティ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**坂元達裕。
#
# 引きは**「本拠地を追われ、70マイル離れた街で1年以上戦った」**。
# ここが山場（@main）。25年ぶりの1部復帰は、そこからの話
