# プレミアリーグ20クラブ紹介 ⑦コヴェントリー・シティ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**坂元達裕。
#
# 引きは**「本拠地を追われ、70マイル離れた街で1年以上戦った」**。
# ここが山場（@main）。25年ぶりの1部復帰は、そこからの話
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では7番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「1部優勝ゼロ、リーグカップもゼロ」の数え上げと「39年更新できていない」を
#   やめ、1987年のFAカップと昨季の2部優勝だけにした。カードの「0回」の行も消した。
#
# **見てもらえる形にした**（2026-09-18 ユーザー指示「もっと見てる人の興味や
# 関心を引き立てる内容にしてください」）。
#   ・題とサムネを坂元達裕の引きに変え、**今季の顔ぶれの節を2番目へ前出し**した
#   ・**宿敵**の節を足した。ヴィラ戦には呼び名が無いので決めつけず、年号の残る
#     1977年のサンダーランド戦を使った。**レジェンド3人**の節も足した
