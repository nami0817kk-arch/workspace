sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: ミシンの会社のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1883年8月13日"]
        - ["最初の名前", "Singers F.C."]
        - ["改名", "1898年"]
        - ["愛称", "The Sky Blues（スカイブルーズ）"]
    say:
      - 最初の名前は「**シンガーズ**」でした。ミシンや自転車を作っていた会社の名前です。
      - 会社のチームとして始まり、いまの名前になったのは1898年です。
      - 創設は1883年8月13日。イングランド中部の街のクラブです。
      - 愛称は「スカイブルーズ」。**空色**です。
      - 由来はそのまま、ユニフォームの色です。1962年からずっと、この色を着ています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: exile
    heading: 本拠地を追われた
    main: true
    tier: 背景
    telop: 70マイル離れた街のスタジアムを間借りした
    narrator: 解説
    card:
      type: table
      title: 落ちていった10年
      columns: ["", ""]
      rows:
        - ["2001年", "34年続いた1部から降格"]
        - ["2013年", "ノーサンプトンへ間借り（往復70マイル）"]
        - ["2017年", "4部まで落ちる"]
        - ["2026年4月17日", "25年ぶりの1部復帰"]
    say:
      - このクラブは、一度**家を追われています。**
      - 経営の行き詰まりから、2013年、本拠地を離れることになりました。
      - 移った先はノーサンプトン・タウンのスタジアム。**往復70マイル**、およそ113キロの道のりです。
      - そこで**1年以上**戦いました。
      - 落ちるところまで落ちて、2017年には4部にいます。
      - そこから戻ってきました。
      - "**2026年4月17日**、プレミアリーグへの昇格が決まります。"
      - 1部に戻るのは、2000年から01年のシーズン以来、25年ぶりでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには坂元達裕がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "フランク・ランパード"]
        - ["主将", "マット・グライムズ（MF・イングランド）"]
        - ["エース", "ハジ・ライト（FW・アメリカ）"]
        - ["昨季", "18点。25年ぶりの昇格を牽引"]
        - ["日本人選手", "坂元達裕（右ウイング・背番号7）"]
    say:
      - このクラブには、**坂元達裕**がいます。右ウイングです。
      - エースはハジ・ライト。ロサンゼルス生まれのアメリカ代表フォワードです。
      - 昨季は**18点**。25年ぶりの1部復帰を、点で引っ張りました。
      - 監督はフランク・ランパードです。
      - 主将はマット・グライムズ。イングランド人の中盤です。
      - 昨季は46試合のうち**42試合**で腕章を巻いていました。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 1987年のFAカップ。ウェンブリーでトッテナムを3対2
    narrator: 解説
    card:
      type: table
      title: 1987年のFAカップ決勝
      columns: ["", ""]
      rows:
        - ["会場", "ウェンブリー"]
        - ["相手", "トッテナム"]
        - ["結果", "3対2"]
        - ["1部にいた期間", "1967年から2001年まで34季"]
    say:
      - 1987年のFAカップ。ウェンブリーでの決勝で、トッテナムを3対2で下しました。
      - 「名勝負」として残っている試合です。
      - このクラブは、1967年から2001年まで**34シーズン続けて**1部にいました。
      - "その34年のあいだに獲った大きなタイトルが、**この1987年のひとつ**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 持っている大きなタイトルは、1987年のFAカップ
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "1回（1986-87）"]
        - ["2部優勝", "2回（直近 2025-26）"]
        - ["2026年4月17日", "25年ぶりの1部復帰"]
    say:
      - "持っている大きなタイトルは、**1987年のFAカップ**です。"
      - 昨季はチャンピオンシップ、つまり2部で優勝しました。2部優勝はこれで2回目です。
      - その優勝メンバーに、坂元達裕がいます。
      - そのクラブが、25年ぶりに1部へ戻ってきました。
      - "**坂元がプレミアのピッチに立つこと自体、このクラブでは初めて**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
