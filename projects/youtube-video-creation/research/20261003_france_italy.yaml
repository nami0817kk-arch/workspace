# 事実の裏:
#   55分のFK: AP「シェルキの短いFKから20メートル」、ESPN レポート「25ヤード」、FotMob の位置で約23メートル。距離は言わず「エリアの手前、右寄り」「シェルキが横へ」まで。
#   xG 0.098（FotMob）→「10本に1本」。スタッド・ドゥ・フランスで2本目のFK（2025-03-23 クロアチア戦以来）は Foot Mercato。
#   68分の同点はダ・クーニャのボールロスト（ESPN「ゴールキックからつなぐ途中」）。バストーニは前節トルコ戦（9分）に続く2戦連発（FotMob）。
#   ウパメカノの退場は85分（FotMob・ESPN・franceinfo ライブ。franceinfo の記事だけ87分）。2枚目はキーンを引っ張った（franceinfo ライブ）。
#   3試合の数字は FotMob（シュート 12/18/18、xG 1.17/1.22/1.26、相手 1.21/0.69/1.54）。ベルギー戦のオリーセは77分から出場、88分に自陣から独走。
#   頭突きの話は 10/2 の題材ページで×が付いたので1行だけ。
# 本人（オリーセ）の試合後の言葉は見つからなかった。
