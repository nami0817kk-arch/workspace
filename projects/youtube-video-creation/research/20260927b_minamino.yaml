      - https://www.youtube.com/shorts/01WcdHX4ShQ
  - id: answer
    main: true
    heading: 南野の答え
    tier: 報道
    telop: 南野拓実「タケフサ・クボ！」
    narrator: キャスター
    say:
      - text: 'モナコが残った選手に聞いた「あなたの国の代表で、史上最高の選手は？」'
        short_only: true
      - 南野はカメラを見て、こう答えました。
      - voice: 南野拓実
        text: タケフサ・クボ！
      - text: 南野が挙げたのは、代表の仲間の久保建英でした。
        image: assets/images/20260927b_pair_minamino_kubo/01.jpg
      - ほかの答えには、ペレやジダン、イニエスタ、ロナウジーニョが挙がっています。
    sources:
      - https://soccerhihyo.futabanet.jp/articles/-/111862
      - https://news.yahoo.co.jp/articles/e5ac09ab1b070be02bdce264fa76428c446805a7
      - https://www.youtube.com/shorts/01WcdHX4ShQ
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「最高選手をたけって答えてくれる南野最高」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 自国の代表チームで最高な選手は？に、拓実くんは久保くんを指名
      - voice: ネット民
        text: ミナミーノ好きや
      - voice: ネット民
        text: 南野がタケを絶賛するのも納得。やっぱり同業者であるプロの目から見ても別格なんだな。
      - voice: ネット民
        text: アジアのサッカー史上で見ても、間違いなく歴代トップの選手だよ。
        cont: true
      - voice: ネット民
        text: 同じセレッソ出身の香川でもなく久保を選ぶか。見て育ったヒデや俊輔でもなく。
      - voice: ネット民
        text: チームメイトからの信頼は相当厚いんだなー。
        cont: true
      - voice: ネット民
        text: 鎌田も守田も久保は上手すぎるって言うくらい全く違うんだろうね。
      - voice: ネット民
        text: チーム全体が久保を認めてるから代表では上手くいくんじゃないかな？
        cont: true
      - voice: ネット民
        text: 南野拓実が日本で最高の選手は久保建英と言っていて、おーー！！と思ったんだけど
      - voice: ネット民
        text: GOAT史上最高と言ったんだね！それは言いすぎ！
        cont: true
      - voice: ネット民
        text: やっぱ久保選手だよなあ。上手いもんなあ。クラブで何であんなに不調なのか謎すぎる。
      - voice: ネット民
        text: ミナミノ？まだ生きていたか。
      - voice: ネット民
        text: サッカー技術も勿論高いたけだけど、性格も良くて愛されて、信頼も厚いんだろうなあ。
        short_voice: true
      - voice: ネット民
        text: たけが結構言われてる中で最高選手をたけって答えてくれる南野最高。
        cont: true
        short_voice: true
