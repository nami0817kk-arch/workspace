  - id: question
    heading: モナコの企画
    tier: 報道
    telop: 「あなたの国の代表で、史上最高の選手は誰？」
    narrator: キャスター
    say:
      - 代表ウィークのあいだ、モナコがクラブに残った選手たちに、1つだけ質問をしました。
      - 「あなたの国の代表で、史上最高の選手は誰？」
      - 南野拓実も、今回は代表に入らず、モナコに残っていた1人です。
    sources:
      - https://soccerhihyo.futabanet.jp/articles/-/111862
