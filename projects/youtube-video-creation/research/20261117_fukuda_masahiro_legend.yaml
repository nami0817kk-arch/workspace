# 福田正博（元日本代表 FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-17。型は 11/13 の城彰二と同じ8節の変形（「あの試合」の代わりに「あの1年」＝1995年を主役にした）。
# **情報の時点は 2026-11-12。**年齢は出さない。いまの仕事は言わない（解説・浦和のコーチ・JFA アンバサダーは入れない）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は日本語版 Wikipedia「福田正博」の成績表・代表の年別表と出場表、英語版「Masahiro Fukuda」、NUMBER（飯尾篤史、2023-04-24「福田正博が惚れた最高のパサーは…」#3）の1頁だけ。
# **病気・私生活・法的な問題は入れない。**
# **題材を選んだ理由**：引退した日本人の大物。「日本人初のJリーグ得点王」「ミスター・レッズ」「ブラジル戦の日本人初ゴール」と強い事実が3つあり、既出の国内レジェンドに無い（posted.json・covered.yaml・scripts/・picks のどれにも無い。
#   scripts/20261109_makino_tomoaki_legend.md に「ブラジルから点を取った日本の選手」として名前が出るだけ）。11/15 の北澤豪（ドーハ・ジョホールバル）とは舞台が違う（Jリーグ1995年）。
# **引退の確認**：日本語版・英語版とも「2002年シーズン限りで引退」「2003年に引退試合（5万人以上）」。現役ではない。
# **候補から外したもの**：柳沢敦・名波浩・楢崎正剛・中山雅史・小笠原満男・福西崇史（Commons に使える大きな写真が無い）、前園真聖（写真は多いが大物度で劣る）、本田・香川・長友（現役）。
# **数字の出どころ**
# - 1966-12-27・神奈川県横浜市緑区生まれ。FW/MF（日本語版）。クラブ：三菱／浦和 1989-2002 287試合143得点（日本語版・英語版の infobox）。
#   内訳（日本語版の表）：JSL2部 26-36、JSL1部 33-14、J1 216-91、J2 12-2。足すと 287-143（一致）。J1年別：1993 27-4、1994 25-6、1995 50-32、1996 4-3、1997 29-21、1998 17-7、1999 23-13、2001 14-2、2002 27-3（216-91 と一致）。J2 2000 12-2。
# - 1995年：J1 50試合32得点、日本人選手初のJリーグ得点王、ベストイレブン（日本語版の本文）。英語版も「32 goals, top scorer, Best XI」。「日本人初」は日本語版が NUMBER を引いて言う。
# - 日本代表 45試合9得点（1990〜95年）。年別：1990 5-0、1991 2-0、1992 8-3、1993 15-3、1994 0-0、1995 15-3（足して 45-9）。1990〜91年＝7試合0点（自分で束ねた）。
#   1992年アジアカップ優勝（英語版 Medal 欄・日本語版）。1993年ドーハは4試合すべて（日本語版の出場表 No.27〜30）、イラク戦は途中出場（日本語版本文）、2-2。
#   1995-08-09 国立、ブラジル戦 1-5（サン・スパークカップ。日本語版の出場表・英語版の試合一覧）。福田が得点（日本語版）。「日本人初のブラジル相手の得点」は日本語版の記述。
#   日本の2025-10-14 のブラジル戦3-2は、11/9 の槙野の取材メモが引くサッカーキング 2025-10-14 の対戦一覧（日本が初めて勝った）。
# - 1993年：Jリーグ開幕、サントリー・NICOS 両シリーズとも最下位（日本語版）。1994年：スポーツヘルニアで長期離脱（日本語版）。1995年：オジェック監督、ウーベ・バイン（1994年夏加入。NUMBER）。
# - 1996年：開幕直前に負傷、8月に練習中に左足首を骨折、リーグ4試合（日本語版）。1997年：左足首のプレートの痛みの中で 29試合21得点（日本語版）。
# - 1999-11-27 最終節広島戦：途中出場、延長のVゴール。延長に入る時点で浦和の残留の可能性は消えていた（日本語版。出典は FOOT×BRAIN と Sportiva）。2000年は J2。
# - 引退：2002年シーズン限り。引退試合 2003-06-15、埼玉スタジアム2002、5万人以上（日本語版・英語版）。
# - 本人の言葉（NUMBER 2023-04-24、飯尾篤史。原文のまま。**WebFetch の抽出で取った文面で、原記事と一字ずつ突き合わせてはいない**）：
#   ①「93年、94年は自分がなんでもやろうとしていたんだな。『点を取ることだけに集中すべきだ』と指摘されて、落ち着きを取り戻したというか、自分の中で余裕が生まれた」（誰が指摘したかは文面で分からないので台本では言わない）
#   ②「ウーベとは、最初はまったく合わなかったんだけど、彼の感覚に合わせられるようになると、面白いようにパスが出てきてね……」
#   ③「『足もとで欲しいのか、スペースで欲しいのか』と聞かれて、『スペースで欲しい』と答えたら、『分かった』と。」「それからは裏にポンポン、ボールが出てきた。」（②と③は記事の中で近い位置だが、間の文は省いた。「バイン」の読みは辞書で確かめる）
# **入れなかったもの**：PK得点の数（要出典）、「PK職人」、ゴールの8秒後に同点にされた逸話（浦和の低迷の象徴として紹介されるが、選手を小さく見せる）、1999年のVゴールのあとの表情の逸話、
#   少年時代の野球・お汁粉、トーシンパートナーズのCM、解説・コーチ、AFC月間最優秀選手（Wikipedia の本文は「選出」のみ）、私生活。
# **写真**：assets/images/20261117_fukuda_masahiro_legend/（Commons の1枚だけ。ほかに無い）。01＝「福田正博.jpg」（昼蔵医務、CC BY-SA 4.0、2016-11-19、イオンモール与野でのトークショー。現役時代ではない）。
