  - id: view
    heading: 見立て・アシスト14の差は、出場時間か、90分あたりか
    tier: 背景
    viewpoint: true
    narrator: 解説
    telop: 数字の違いが示すもの
    card: &viewcard
      type: duel
      left: {name: ブルーノ, club: マンチェスター・U, photo: assets/images/20261026_compare_240306_316264/b_cro3/01_sq.jpg, color: "#da291c"}
      right: {name: ウーデゴール, club: アーセナル, photo: assets/images/20261026_compare_240306_316264/o_wc1/01_sq.jpg, color: "#063672"}
      rows:
        - [25/26 プレミアのアシスト, "21", "7"]
        - [プレミアの出場時間, 3068分, 1371分]
        - [90分あたり, "0.62", "0.46"]
        - [同じ出場時間なら, "21", 約16]
      bars: [25/26 プレミアのアシスト, プレミアの出場時間, 90分あたり]
      note: 25/26 のプレミアリーグ。90分あたりと「同じ出場時間なら」は自分で計算した値
    say:
      - text: 見立てです。25/26のプレミアで開いたアシストの差は、14。
        mark: {kind: circle, row: 0}
        image: assets/images/20261026_compare_240306_316264/pair_cap/01_w.jpg
        card: {<<: *viewcard, highlight_row: 25/26 プレミアのアシスト}
      - text: その半分を超える約9は、プレミアで2.24倍あった、出場時間から来ています。
        image: assets/images/20261026_compare_240306_316264/o_ars1/01_w.jpg
        card: {<<: *viewcard, highlight_row: プレミアの出場時間}
      - text: 同じ時間で比べても、0.62と0.46。90分あたりでも、ブルーノが上です。
        emph: true
        image: assets/images/20261026_compare_240306_316264/b_cro2/01_w.jpg
        card: {<<: *viewcard, highlight_row: 90分あたり}
      - text: 出場時間がそろえば、差は計算の上で約5まで縮まります。
        image: assets/images/20261026_compare_240306_316264/o_wc1/01_w.jpg
        card: {<<: *viewcard, highlight_row: 同じ出場時間なら}
      - text: 裏づけになるのは、出場時間の比の2.24と、90分あたりの0.16の差。この2点。
        image: assets/images/20261026_compare_240306_316264/pair_b/01.jpg
        card: none
      - text: 2人の次の試合。ユナイテッドは31日に、アウェーでチェルシー戦。
        image: assets/images/20261026_compare_240306_316264/b_cro1/01_w.jpg
        card: none
      - text: アーセナルは、日本時間で11月2日の未明にアウェーでリヴァプール戦です。
        image: assets/images/20261026_compare_240306_316264/o_mar1/01_w.jpg
        card: none
      - text: 今季、いま同じ4得点1アシストの2人。出場時間の差がどう動くか、見ていきます。
        image: assets/images/20261026_compare_240306_316264/pair_a/01.jpg
        card: none
