        image: assets/images/20261026_compare_240306_316264/o_mar2/01_w.jpg
        card: *calccard
      - text: つまり14の差のうち、約9は出場時間の差。
        image: assets/images/20261026_compare_240306_316264/pair_a/01.jpg
        card: none
      - text: 残りの約5は、90分あたりで比べた分の開きです。
        image: assets/images/20261026_compare_240306_316264/pair_a/01.jpg
        card: none
