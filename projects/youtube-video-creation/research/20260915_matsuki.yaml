      - {short_only: true, text: 9月12日のイングランド2部、サウサンプトン対ブリストル・シティの一戦です。}
      - 松木が決めたのは後半37分でした。
      - 後方から走り込んでフィン・アザズのパスを受け、ペナルティエリアの中央から左足を振っています。
      - シュートは相手ディフェンダーの足下を抜けて、ゴール右へ。
      - 今季7試合目での初得点です。フル出場でした。
      - チームはこれで2連勝。6試合負けなしとなり、13位から暫定7位まで上がりました。
