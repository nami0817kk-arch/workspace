# スタジアム紹介シリーズ③：ヴィラ・パーク（アストン・ヴィラ、10/11）。
# **節の並びは①ヴァイタリティ（10/9）②エミレーツ（10/10）と同じ型**：
#   オープニング → 基礎DATA(main・強い一点を頭に) → この競技場だけの話(年表) → ここで起きた試合(表) →
#   見立て(viewpoint・自分で数えた比べ)。**文は全部言い換えてある。**
#
# 強い一点：**今季（2026-27）は北スタンドを1シーズン丸ごと閉じていて、収容が 43,205 → 36,887 に落ちている**
#   （差は6318席＝14.6%）。工事が終わるのは2027年8月、そのとき5万65人。確度は**報道**
#   （2026-04-22 の各社。クラブの発表文そのものには当たれていない。名前のある人の言葉も見つからなかった → 声は0件）。
#   台本は「報じられました」「とされています」の線を越えない。
#
# **重なりで外したもの（クラブ紹介③ヴィラ 2026-09-24 公開・17日前／zion_mvp 10/01・10日前）**
#   **創立1874年・ウィリアム・マクレガーとリーグ創設・鈴木彩艶は一度も出していない。**
#   クラブ紹介が読み上げた「ホルト・エンドは1995年の完成時、イギリス最大のゴール裏スタンド」も使わない
#   → ホルト・エンドは**名前の由来**（サー・トマス・ホルトの菜園だった土地）でだけ触れる。
#   エメリ・サウィリス・1982年の欧州制覇・昨季のEL優勝・ホルト・エンドの大きさも出していない。
#
# **エミレーツの回（10/10）と重ねないようにしたもの**
#   あちらは「拡張をやめた」、こちらは「拡張のために1季閉めた」で**向きが逆**。
#   **1席あたりの値段を割る形は使わない**（あちらの見立て）。こちらは**最多入場との比**と**閉じた席の割合**。
#   **20クラブの収容の順位表（rank.json）も使わない**（あちらが表1枚まるごと使った）。
#   締めも変えた（あちらは「3日後のCLのリール戦」。こちらは2027年8月の完成と2028年の欧州選手権で締める。
#   次の試合＝10月14日のフェネルバフチェ戦には触れない。2本続けて「3日後のCL」で終わると同じ形になる）。
#
# **言わないと決めたもの**
#   **最多入場の 76,588人が「1946年3月2日のFA杯6回戦 対ダービー」なのは Wikipedia 本文のみ**で、
#   その試合の結果まで辿れていないので**結果は言わない**（表の列も「入場」だけにした）。
#   **「3つの世紀で国際試合を開いた最初のイングランドの競技場」は言わない**（どの3世紀かが原文にも無い）。
#   1914年のライチの構想「12万人」は**実現していない計画**なので、必ず「構想」と言う。
#   トリニティ・ロード・スタンドの建設費は**89,000ポンド（1922年の発表は41,775ポンド）**と食い違うので、
#   台本では**8万9000ポンド**だけを言い、発表額には触れない。
#   工事費の**1億ポンド**はバーミンガム市の見通しで、クラブの数字ではないので「およそ」を付けた。
#   ホルト・エンドの立ち見がいつ終わったかは原文に無いので言わない（テイラー報告の1994年8月も当てない）。
#   オジー・オズボーンの最後の公演（2025-07-05）は入れていない（亡くなった人の話になるので外した）。
#
# 写真は assets/backgrounds/ から assets/images/20261011_stadium_villapark/ へ写した2枚
#   （01_w＝ピッチとスタンドの中／02_w＝上空からの外観。どちらも Commons・CC BY-SA、credits.json も同じ場所）。
#   **assets/backgrounds/ のまま使うと、ショートが assets/stats/stadium_アストンヴィラ_v.png
#   （クラブ紹介③の基礎DATAの縦板）に化ける**（スタジアム紹介①で踏んだ）。
#
# 自分で割った数（検算した）: 76,588 ÷ 43,205 = 1.7727 →「1.77倍」／43,205 − 36,887 = 6,318席／
#   6,318 ÷ 43,205 = 0.14624 →「14.6%」／50,065 ÷ 36,887 = 1.3573 →「1.36倍」／50,065 − 43,205 = 6,860席。
#
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11「サムネは相談して決めよう」）。
#   ここに書いた thumbnail は案A（scene）。B（number）・C（face）は報告に書いた。
