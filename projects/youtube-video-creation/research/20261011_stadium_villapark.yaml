  question: 129年つづくこの器で、いま何が起きているのか
  lead: ヴィクトリア時代の遊び場と、観賞用の池があった土地。
  hook: 今季のこの器には、入れない区画があります。
  takeaway: ヴィラ・パークは収容4万3205人だが、今季2026-27は北スタンドを1シーズン丸ごと閉じているため3万6887人に落ちている。消えた席は6318で、収容の14.6%にあたる。2026年4月に、工事を2季にまたがせず1季で終わらせるために丸ごと閉じると報じられた。開場は1897年4月17日、ブラックバーンとの親善試合で、その場所は18世紀のアストン・ホールの菜園から、ヴィクトリア時代の水族館と大広間のある遊び場になり、1889年に池を抜いて自転車と陸上の競技場になった土地だった。1911年に8250ポンドで土地を買い、1914年にはアーチボルド・ライチが12万人まで広げる構想を描いた。1924年1月26日に開いたトリニティ・ロード・スタンドはステンドグラスとイタリアのモザイクを備え、イギリスの競技場で最初のレストランが入っていたが、2000年に取り壊された。最多入場は1946年の7万6588人で、いまの収容の1.77倍。全席が椅子になってからの最多は2025年12月21日の4万3157人。FA杯の準決勝を55回開いていて、どの競技場より多い。1966年のワールドカップで3試合、1996年の欧州選手権で4試合、1999年にはカップウィナーズカップの最後の決勝を開いた。工事が終わるのは2027年8月で、収容は5万65人、いま閉じている6318席が戻り、さらに6860席増える。2028年の欧州選手権では、ここで4試合が行われる
  opening_image: assets/images/20261011_stadium_villapark/01_w.png
