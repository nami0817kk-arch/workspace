  - text: 開けたまま2季かけるのではなく、閉めて1季で終わらせる形を選んでいます。
  - text: 工事は今季のあいだ続き、終わるのは2027年の夏とされています。
  - text: では、戻ったあとはどうなるか。こちらも足してみます。
    card: &id_back
      type: waterfall
      title: 工事が終わると、こう増える（自分で足した）
      start:
      - 今季の収容
      - 36887
      steps:
      - - 閉じた席が戻る
        - 6318
      - - 新しく増える席
        - 6860
      total:
      - 2027年8月から
      - 50065
      unit: 人
  - text: 閉じた6318席が戻り、そこへ6860席が足されます。
    card: *id_back
  - text: 5万65人。今季の3万6887人と比べて、1.36倍になります。
    emph: true
    card: *id_back
    mark:
      kind: circle
      row: 2
      text: 1.36倍になる
  - text: 車椅子で見る区画も、50以上増える予定だと伝えられています。
    card: none
  - text: 工事の費用は、市の見通しでおよそ1億ポンドとされています。
  - text: ここで、昔の数字と並べてみます。
    card: &id_line
      type: line
      title: 収容はこう動いてきた（自分で並べた）
      x: &lx
      - '2000'
      - '2001'
      - 昨季
      - 今季
      - '2027'
      series: &ls
      - - 収容
        - [39399, 42682, 43205, 36887, 50065]
      unit: 人
      focus: 収容
      highlight: 今季
  - text: 2000年までは3万9399人。建て替えで3283人ぶん増えました。
    card:
      type: line
      title: 収容はこう動いてきた（自分で並べた）
      x: *lx
      series: *ls
      unit: 人
      focus: 収容
      highlight: '2001'
  - text: 昨季までが4万3205人。今季だけ3万6887人まで下がります。
    card: *id_line
  - text: そして2027年に5万65人。27年で1万666人ふえる計算です。
    card:
      type: line
      title: 収容はこう動いてきた（自分で並べた）
      x: *lx
      series: *ls
      unit: 人
      focus: 収容
      highlight: '2027'
  - text: それでも、1946年の7万6588人には届きません。
    card: &id_calc
      type: calc
      title: 1946年の入りは、いまの収容の何倍か（自分で割った）
      terms:
      - - 7万6588人
        - 1946年の最多入場
      - - 4万3205人
        - もとの収容
      - - 1.77倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 7万6588人を4万3205人で割ると、1.77倍です。
    emph: true
    card: *id_calc
  - text: 立って見る区画が無くなったぶんは、増築では埋まらない計算になります。
    card: none
  - text: 工事が終わるのは2027年8月、新しいシーズンの始めとされています。
  - text: その翌年、1966年と1996年に続いて3度目の大きな大会が来ます。
  - text: 2028年の欧州選手権。ここで4試合が行われます。
    emph: true
