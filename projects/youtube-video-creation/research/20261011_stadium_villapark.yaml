- id: ground
  heading: 水族館と自転車競技場があった土地
  tier: 背景
  telop: 池を抜いて1889年に競技場が開き、その8年後にヴィラが移ってきた
  narrator: 解説
  card: &id_time
    type: timeline
    title: この土地に建ったもの
    rows: &rows_time
    - - 1889年6月
      - 池を抜いて競技場が開く
    - - 1897年4月
      - ヴィラが移り、最初の試合
    - - 1911年
      - 土地を8250ポンドで買う
    - - 1914年
      - 12万人に広げる構想
    - - 1924年1月
      - トリニティ・ロードが開場
    - - 2000年
      - その建物を取り壊す
    focus: 1924年1月
  say:
  - text: この場所は、もともとサッカーのための土地ではありませんでした。
    image: assets/images/20261011_stadium_villapark/02_w.png
    card: *id_time
  - text: 18世紀の屋敷、アストン・ホールの菜園でした。
    card: none
  - text: 持ち主の名はサー・トマス・ホルト。いまのゴール裏の名前になっています。
  - text: ヴィクトリア時代には、水族館と大広間のある遊び場に変わります。
  - text: 1889年、観賞用の池を抜いて、自転車と陸上の競技場が開きました。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 0
  - text: 6月10日のこけら落としには、1万5000人が集まっています。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 0
  - text: いまのピッチは、その抜いた池の上にあります。
    card: none
  - text: ヴィラが移ってきたのは、その8年後。前の家に3つの不満がありました。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 1
  - text: ピッチが凸凹で、見る側の設備が貧弱で、借地の値段が高すぎました。
  - text: 借りた値段は年300ポンド。21年の約束で、途中で買う権利が付いていました。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 1
  - text: その権利を使ったのが1911年です。8250ポンドで土地を買っています。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 2
  - text: 1914年、建築家アーチボルド・ライチが広げる構想を描きます。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 3
  - text: 描かれていたのは12万人。実際には、ここまで建っていません。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 3
  - text: 建ったのは、そのうちの1つのスタンドです。
    card: none
  - text: 1924年1月26日、トリニティ・ロード・スタンドが開きました。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 4
  - text: 8万9000ポンド。ステンドグラスと、イタリアのモザイクが入っていました。
    emph: true
  - text: イギリスの競技場で最初のレストランも、この建物の中にありました。
  - text: 76年たった2000年、この建物は取り壊されます。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 5
  - text: かわりに建った3層のスタンドで、収容は4万2682人になりました。
    card:
      type: timeline
      title: この土地に建ったもの
      rows: *rows_time
      focus: 1924年1月
      highlight_row: 5
