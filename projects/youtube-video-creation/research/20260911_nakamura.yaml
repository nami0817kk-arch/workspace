sections:
  - id: conf
    heading: 合流から1週間で、何を話したか
    tier: 確定
    telop: 「リヨンはフランスのトップ3に入るクラブ」
    narrator: キャスター
    say:
      - リヨンに加入した中村敬斗が、移籍後はじめて記者会見に出ました。クラブの公式サイトが内容を伝えています。
      - 合流からおよそ1週間。まず、いまの状態を聞かれました。
      - {voice: 中村敬斗, text: 時間が過ぎるのがとても早かった}
      - {voice: 中村敬斗, text: 最初は少し緊張していたけど}
      - {voice: 中村敬斗, text: チームメイトがとても優しく接してくれた。今は良い状態です}
      - 日本からの反響も届いているといいます。
      - {voice: 中村敬斗, text: 日本からたくさんのメッセージをもらった}
      - {voice: 中村敬斗, text: 大きな注目が集まっていると感じている}
      - {voice: 中村敬斗, text: リヨンは自分にとってフランスのトップ3に入るクラブだ}
      - {voice: 中村敬斗, text: このユニフォームを着てプレーするのが待ち切れない}
    official: true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458613-458613-fl

  - id: diff
    heading: 日本と欧州は、どこが違うのか
    tier: 確定
    main: true
    telop: 「一番の違いは、プレーの縦への速さ」
    narrator: 解説
    say:
      - 17歳で日本を離れ、オーストリアのLASKリンツからフランスのランスへ移りました。そのときに感じたことを、こう振り返っています。
      - {voice: 中村敬斗, text: プレースタイル、強度、競技レベルの違いを感じた}
      - {voice: 中村敬斗, text: フランスのレベルはずっと高い}
      - 昨季はランスの一員で、2部のリーグドゥを戦っています。
      - {voice: 中村敬斗, text: 選手であれば、より高いレベルでプレーしたいと思うもの}
      - {voice: 中村敬斗, text: 昨季リーグドゥを経験したことで}
      - {voice: 中村敬斗, text: 改めてリーグアンのレベルの高さを感じた}
      - 日本の育成についても、印象を語りました。
      - {voice: 中村敬斗, text: ボールを使った技術的なトレーニングが多い}
      - そして、日本と欧州の一番の違いを聞かれて挙げたのが、これでした。
      - {voice: 中村敬斗, text: 日本とフランスの一番の違いは、プレーの縦への速さだと思う}
      - {voice: 中村敬斗, text: 欧州やフランスのほうが、より縦に速くプレーする}
    official: true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458613-458613-fl

  - id: next
    heading: 監督の評価と、デビューまで
    tier: 確定
    telop: 12日のパリFC戦へ
    narrator: 解説
    say:
      - パウロ・フォンセカ監督は、個人で仕掛けるだけでなく、周囲との連係で局面を打開できる選手だと評価しています。本人もそこは認めました。
      - {voice: 中村敬斗, text: 監督の言う通り、自分は周囲と連係してプレーすることを得意としている}
      - {voice: 中村敬斗, text: ただ、1対1でも仕掛けられるので、そうした部分も見せていきたい}
      - このクラブは、子どもの頃から知っていたと言います。
      - {voice: 中村敬斗, text: 特にジュニーニョがプレーしていた時代が好きだった}
      - {voice: 中村敬斗, text: 自分にとっては昔から知っているクラブです}
      - いまは戦術の理解を進めている段階です。
      - {voice: 中村敬斗, text: 練習中や練習後に、監督やスタッフと映像を見ながら作業をしている}
      - {voice: 中村敬斗, text: このクラブにはプレーに関する多くの決まり事がある}
      - {voice: 中村敬斗, text: 吸収していかなければいけない}
      - 公式戦は、ワールドカップのブラジル戦が最後でした。12日の第4節、パリFC戦が新天地での初戦になります。
    official: true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458613-458613-fl
