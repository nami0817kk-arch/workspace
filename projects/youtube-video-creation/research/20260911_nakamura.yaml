# 中村敬斗がリヨンで初会見（2026年9月10日）。ユーザー指示「cl順位表以外作って」
#
# **クラブ公式サイトが会見の内容を伝えている**のでtierは確定。
# ゲキサカがその中身を日本語で出しており、発言はそちらから引いた。
#
# 引きは**「日本とフランスの一番の違いに挙げたのは何か」**。
# 移籍の事実そのものは既報で、**本人が言葉にした中身**のほうが新しい。
#
# **検索で来ている語の1位**（28日で44回）。ゲキサカのアクセスも1位だった
#
# **反応は入れない。**読める形のスレが無かった
format: news
voice_min: 40
slot: japan
