    text: 佐藤龍之介は、バレンシアでの最初のシーズンで、
  - voice: スペイン紙マルカ
    text: もう修士課程を修めたと言っていい。
    cont: true
  - voice: スペイン紙マルカ
    text: いや、わずか90日で、と言うべきか。
    cont: true
  - voice: スペイン紙マルカ
    text: ほとんど何でも経験したのだから。
    cont: true
  - text: 修士課程は、大学を出たあとに専門を深める学びのこと。
  - text: それほど中身の詰まった日々だった、という書き方です。
