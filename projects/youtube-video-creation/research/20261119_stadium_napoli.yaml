# スタジアム紹介シリーズ：ナポリの本拠地（スタディオ・ディエゴ・アルマンド・マラドーナ、11/19 予定）。雛形は 11/17 ベティスの回。
# 題材の選び方（2026-11-12）：指示書 20261119 の「大物のクラブの本拠地から」。プレミア20は全て済み、ラ・リーガの残りは中堅。セリエAの大物としてナポリ。
#   選んだ理由：マラドーナの名／「1990年W杯準決勝（イタリア対アルゼンチン）をナポリの器が開いた」という強い一点／9万736人→5万4732席の縮み／2026年8月に出たばかりの建て直し計画で見立て（基準を満たす席）が作れる。
#   重なりの確認：scripts/*stadium_*・posted.json・covered.yaml に無し（grep 済み）。同じ11/19のユニフォームはインテル、比べるはサリバ×クバルシ、選手紹介はロジャーズ。ナポリは重ならない。11/21 は別クラブ（マルセイユ）。picks は research/20261119_picks.txt。
# 一次情報の突き合わせ：
#   en・it ウィキペディア（開場1959-12-06 ナポリ2-1ユヴェントス／礎石1952-04-27／設計コッキア・コラディ／1963 サン・パオロ／2020-12-04 マラドーナ／最多 90736＝1974-12-15 ナポリ対ユヴェントス／1990後 72810席／3層目閉鎖後 60240／2019改修後 54726（en infobox）・54732（it 本文）／1968ユーロ準決勝 0-0 コイントス／1990W杯 5試合 6/13-7/3、準決勝 7/3 1-1 PK 3-4／1990改修 1320億リラ(it)）。
#   建て直し：ナポリ市の公式発表（2026-08-04）＝現在54732席（うち欧州の基準を満たす3万4287）→63300席（同5万270）、3期、3層目の再建・新しい下層・屋根15m延長、車いす672・ボックス36×16席。費用は報道で約2億（市・州）〜2.5億（Il Mattino）。工事の時期は報道で割れる（2027年5月〜／7月）ので台本に入れない。
#   ユーロ2032：en ウィキペディアで開催地候補に載る（54726席・to be renovated）。「UEFAが承認したのはトリノのみ」の記述があり確定ではないので「候補」と書いた。
#   食い違い（台本には入れない）：1990後の席は en「約76000」・it「72810」（it を採用）。3層目の閉鎖は it「2005-06から」と別の報道「2004」で時期を台本に書いていない。ESPN の今季ホーム入場は0が多く使えなかったので入場の数字は使っていない。2025-07 に「新スタジアムを建てる」と述べたとの en の記述は 2026-08 の市の計画と食い違うので触れない。
# 読みが割れる名前：スタディオ・デル・ソーレ／サン・パオロ／コッキア／コラディ／デ・マジストリス／デ・ラウレンティス／スキラッチ／カニーヒア（カニージャ）／ユニバーシアード。
