# 取材メモ（11/27 金、シリーズ「比べる」、key: compare_937958_709187）。ラミン・ヤマル（バルセロナ・19歳）×ニコ・ウィリアムズ（アスレティック・ビルバオ・24歳）。
# **情報の時点は 2026-11-21**。FotMob・DataMB は使っていない。数字は Transfermarkt の API（2026-11-21 取得。控え: research/raw/20261127_yamal_tm.json・20261127_nico_tm.json・*_profile.json）。
#   番号：ヤマル 937958・ニコ 709187。profile・market-value-history・performance-season（2023〜2026季）を2.5秒あけて取得。
# **選んだ理由**：EURO2024 で優勝したスペインの両翼（決勝 2024-07-14 ベルリン、47分にヤマルのクロスからニコが先制・ニコが試合の最優秀選手。Wikipedia「UEFA Euro 2024 final」で確認）。誕生日が1日違い（ニコ 2002-07-12・ヤマル 2007-07-13、TM と Wikipedia）。
#   軸：クラブの公式戦の（得点＋アシスト）÷出場時間×90 を4季。23/24 はニコが上、24/25 から逆転。市場価値は 2024-06 に 9000万€ と 6000万€（1.5倍）→ いま 2億2000万€ と 4000万€（5.5倍）。代表戦は混ぜない（TM の clubId 3375＝スペイン代表を除外）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて（ヤマルは 10/22 にサカと、10/20・11/22 のランキングに名前。ニコは比べるに未登場）。
#   同じ日（11/27）の picks（選手紹介ケイン・スタジアム ドルトムント）と人もクラブも重ならない（バルセロナ・アスレティックは 11/27 の他シリーズに無い。公開前にもう一度）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：バルセロナ（ラ・リーガ。TM clubId 131）・アスレティック（ラ・リーガ。clubId 621）。
# **使った数**（クラブのトップチームの公式戦だけ）
#   ヤマル：23/24 50試合 2957分 7点9A／24/25 55試合 4553分 18点25A／25/26 45試合 3702分 24点18A／26/27 16試合 1355分 13点12A
#   ニコ：23/24 37試合 2729分 8点18A／24/25 45試合 3130分 11点7A／25/26 32試合 2101分 6点7A／26/27 11試合 706分 2点2A
#   90分あたり（自分で割った値）：ヤマル 0.49, 0.85, 1.02, 1.66／ニコ 0.86, 0.52, 0.56, 0.51
# 市場価値（TM）：ヤマル 2024-06-07 9000万→2024-12-27 1億8000万→2025-06 2億→2026-07-22 2億2000万（最高）／ニコ 2024-06-07 6000万→2024-07-18 7000万（最高）→2025-12 6000万→2026-03 5000万→2026-06-05 4000万。
# ニコの契約：Wikipedia「Nico Williams」に 2025-07-04 に2035年までの10年契約、2025年6月にバルセロナと条件で合意と広く報じられた、とある。25/26 は pubalgia（恥骨まわりの痛み）で欠場が続いた、とも（台本は「恥骨まわりの痛み」）。
#   **確かめていない**：ニコの欠場の試合数（台本では「何試合も」だけ）。ヤマルの身長 1.83m は TM の値（公式の発表は見ていない）。市場価値の差の理由は見立て（算定理由は確かめていない）。
