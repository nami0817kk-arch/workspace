  title: ブライトン、選手を売って稼ぐクラブが赤字に。何が変わったのか
  question: ブライトンは2024-25のプレミアリーグで、クラブ史上2番目の8位。それなのに、営業の損益は前の年の7330万ポンドの黒字から、5440万ポンドの赤字に変わった。選手を売って稼いできたクラブで、何が変わったのか
  lead: 史上2番目の8位。それでも、5440万ポンドの赤字。ブライトン。
  opening_image: assets/images/20261106_finance_brighton/01_w.jpg
  takeaway: ブライトンの2024-25の決算（クラブ公式の年次報告）は、営業の損益が5440万ポンドの赤字（前の年は7330万の黒字）。振れ幅約1億2770万のうち約73%は選手の売り買いで、+6810万から−2500万へ。買った選手の償却が3940万から8200万へ2倍あまりに増え、売った利益は1億1030万から5700万へ約半分に減った。収入は開発を除けば横ばい（約2億2240万）で、ヨーロッパリーグが無くなった分、放映権は約1270万減。人件費は開発を除く収入の約74%（前の年は約66%）。オーナーのブルーム氏からの借入は4億650万ポンドで、利息は無い。2025年夏の主力の売却はこの決算に入っていない
  short_title: ブライトン、売って稼ぐクラブが赤字に
