# クラブの財政：ブライトン（11/6 金、シリーズ「クラブの財政」、key: finance_brighton、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブから。
#   1〜22位は既出または対象外（20位ウェストハムは今季2部、21位ガラタサライはトルコ）。27位ローマは 10/31、11/2 はアヤックス（30位の外）。
#   未出の最上位は **23位ブライトン（2億3870万ユーロ）**。11/2 の担当は「Companies House の画像PDFで読めない」として外したが、
#   クラブ公式サイトの記事（2026-01）から年次報告書の全文PDF（48頁、監査済み）に辿れた。PDF の文字は字の割り当てが壊れていて取れないので、頁を画像にして目で読んだ（下の数字はすべて画像で読んだ値）。
#   外した候補：24位エヴァートン（11/2 の担当が「女子チームの売却益が損益の主役」で外した理由のまま）、25位クリスタル・パレス（今季18位。一次資料は未確認）。
#
# 重なりの確認（2026-11-04）：scripts/*finance_* にブライトンは無い。直近30日のブライトンの本は、10/14 スタジアム・10/23 ユニフォーム（別のシリーズ）、
#   ニュースのショート（10/17 三笘の関心・冨安・10/19 鎌田・10/24 グロス・10/29 シティ戦）。財政の切り口は無い。picks（research/20261105_picks.txt）にもブライトンは無かった。
# ★今季も1部：ESPN の 2026-27 Premier League 順位表（2026-11-04 取得）で3位・勝点19・9試合。
# ★日本との接点：三笘薫が所属（英語版 Wikipedia「Kaoru Mitoma」の infobox：clubs2 = Brighton & Hove Albion、years2 = 2021–。前は川崎フロンターレ 2018–2021）。
#   台本では「所属する」と「2021年に川崎フロンターレから」だけ。怪我・移籍のうわさは入れない。
#
# 軸は「**選手を売って稼いできたクラブが、過去2番目の8位の年に赤字になった。何が変わったのか**」。
#   答え：選手の売り買いの損益が +6810万 → −2500万ポンド（償却が2倍あまり、売却益は約半分）。営業の損益の変化 1億2770万のうち約73%がここ。
#   ★他の財政回と軸を重ねない：11/2 アヤックス＝本業は赤字・売却益で黒字（逆向き）、10/31 ローマ＝赤字を続ける・オーナーの貸付。
#     今回は「売る利益が減り、買った分の償却が増えて赤字に転じた」。オーナーの貸付は見立ての1行に留める（ローマと重ならないように）。
#   ★女子チームの話は入れない（年次報告に女子の順位・投資額が出てくるが、台本には書かない）。
#   ★住宅・商業開発（New Monks Farm）の売上が収入に入っている。サッカーの収入として比べる所はそれを除いた数を使い、そう言う。
#
# **出どころ（読んだもの）**
#   ○ クラブ公式記事「Club publish annual accounts for 2024/25 season」（2026-01）
#       https://www.brightonandhovealbion.com/media-article/club-news-annual-accounts-published-2024-25-season-january-2026
#       「an operating loss of £54.4m before interest and taxation up to 30 June 2025」「player trading results, which shifted from a profit of £68.1m to a loss of £25m」
#       「an increase in amortisation of £39.8m as a result of a £210m investment in significant additions to the playing squad during 2024/25」
#       「These accounts do not reflect major player sales last summer, including Joao Pedro, Simon Adingra, Julio Enciso and Pervis Estupinan.」
#       Tony Bloom「we finished eighth, the second-highest league position in our history」「we dream of winning the first major trophy in our history」
#   ○ 年次報告書 Brighton & Hove Albion Holdings Limited, Annual Report and Financial Statements for the Year Ended 30 June 2025（監査 BDO、2025-12-23 署名）
#       https://images.ctfassets.net/rrpvignygaa1/5Pa3F0cMAACmehuKnGziTe/d174f9c54a90be016f74e5592369f93d/BHA_Holdings_25.pdf
#       p.5 Business review（£000、2025／2024）：Turnover 242,672／260,849、Other operating income 5,060／3,760、Cost of sales (36,305)／(46,417)、
#            Administrative and operational costs (41,076)／(38,147)、Depreciation (8,298)／(8,231)、Player trading (24,971)／68,140、Football costs (191,502)／(166,678)、
#            Operating (loss)/profit (54,420)／73,276。「Turnover decrease: 0.1% (excluding £20.3m (2024 - £38.3m) of revenue from the New Monks Farm development project)」「Football costs increase: 14.9%」
#            「finishing in 8th position (2024 - 11th position). The higher league finish and associated merit income compensated somewhat for the Club not competing in European Competition」
#       p.6：Matchday 27.9 横ばい、Broadcasting 163.8→151.1（「due to the loss of income from the Europa League which offset increased Premier League income」）、Commercial 20.7→22.8、Other 48.4→40.9。
#            「Player amortisation has increased to £82.0m compared to £39.4m」「New players were added to the squad at a discounted value of £210.5m (2024 - £122.4m)」
#            「Profit on player disposals was £57.0m which compares with a profit on disposal of £110.3m」「impairment ... £Nil compared to £2.8m」
#       p.20 損益計算書：Loss before taxation (55,805)／75,126、Tax 4,905／(14,888)、Loss after taxation (50,900)／60,238（2024 は修正後）
#       p.33 注3 Turnover：Matchday 27,878／27,944、Broadcasting 151,090／163,808、Commercial 22,774／20,709、Other 40,930／48,388
#       p.34 注7 人件費：Wages and salaries 144,454／128,836、社会保険 19,567／16,775、年金 531／611、合計 164,552／146,222
#       p.45 注28 純負債：現金 40,933、オーナー（Director's loan）406,541、純負債 365,608（期首 126,061）
#       p.46 注32「the group owed A G Bloom £406,541,000 (2024 - £299,672,000). £406,541,000 (2024 - £99,672,000) of this amount is interest free and repayable on demand.」
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（requests で本文、2026-11-04）：「23 Brighton & Hove Albion 238.7」（€m。デロイトは移籍・開発の売上を含めない数え方）
#   ○ ESPN 順位表 API（2026-11-04）：3位 Brighton 19点 9試合
#   ○ 英語版 Wikipedia「Kaoru Mitoma」（infobox）
#   × 確かめられなかったもの：2025-26（2026年6月期）の決算（例年1〜2月に出るので、まだ無い）、2025年夏の4人の移籍金（台本に額を入れない）、
#       放映権のうちヨーロッパリーグの分の額（年次報告は理由だけ書く）。どれも台本に入れない。
#
# 自分で計算した数（検算済み）
#   収入の内訳 2025：27.878＋151.090＋22.774＋40.930＝242.672 ✓／2024：27.944＋163.808＋20.709＋48.388＝260.849 ✓
#   開発を除く収入：242.672−20.3＝222.4／260.849−38.3＝222.5（発表「−0.1%」✓）
#   放映権の割合：151.090÷222.372＝67.9%（開発を除く収入に対して）→約68%。全体に対しては62.3%
#   放映権の減り：163.808−151.090＝12.718→約1270万
#   人件費：146.222→164.552＝+18.330（+12.5%）。開発を除く収入に対する割合 164.552÷222.372＝74.0%／146.222÷222.549＝65.7%→約66%
#   償却：39.374→81.976＝2.08倍→2倍あまり（減損を足すと 42.158→81.976＝+39.8 ✓ クラブの「+39.8」）
#   売却益：110.299→57.005＝51.7%→約半分
#   選手の売り買い：57.005−81.976＝−24.971 ✓／110.299−39.374−2.784＝68.141 ✓。振れ幅 68.140＋24.971＝93.111→約9310万
#   営業の損益の振れ：73.276＋54.420＝127.696→約1億2770万。うち選手の売り買い 93.111÷127.696＝72.9%→約73%
#   それ以外の振れ：127.696−93.111＝34.585→約3460万（収入 −18.177、その他営業収入 +1.300、売上原価 +10.112、管理費 −2.929、減価償却 −0.067、サッカーの費用 −24.824 の合計 −34.585 ✓）
#   サッカーの費用：166.678→191.502＝+24.824（+14.9% ✓）
#   オーナーからの借入：299.672→406.541＝+106.869→約1億690万増
#   新加入の選手：210.5（前の年 122.4）→ 1.72倍
#
# 写真：assets/images/20261106_finance_brighton/（Commons、出典は credits.json）。01〜04 は本拠地アメックス・スタジアム（10/14 スタジアム回の取り込み分を再利用）、
#   06 は三笘薫（2026-01-24 撮影、CC0。目で本人と確認：ブライトンの黄色のユニ、背番号22）。
