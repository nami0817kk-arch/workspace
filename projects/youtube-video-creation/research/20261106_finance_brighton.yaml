  say:
  - text: この動画は、2026年11月4日時点で見られる、クラブの発表をもとにしています。
    image: assets/images/20261106_finance_brighton/01_w.jpg
    card: none
  - text: イングランドのブライトン。日本代表の三笘薫が所属するクラブです。
    image: assets/images/20261106_finance_brighton/06_w.jpg
    card: none
  - text: 三笘は2021年に、川崎フロンターレから加わりました。
    card: none
  - text: 今季は9試合を終えて、プレミアリーグの3位につけています。
    image: assets/images/20261106_finance_brighton/02_w.jpg
    card: none
  - text: 決算は、7月から6月で区切ります。
    card: none
  - text: いちばん新しい決算は、2024年から25年のシーズンです。
    card: none
  - text: 収入は、2億4270万ポンド。
    emph: true
    card: *rev_bars
  - text: いちばん大きいのは、テレビの放映権で、1億5110万ポンド。
    card: *rev_bars
  - text: 次が、その他。試合の日と、スポンサーなどが続きます。
    card: *rev_bars
  - text: ブライトンは、住宅と商業施設の開発も手がけています。
    card: none
  - text: その他の4090万には、その開発の売上が2030万入っています。
    image: assets/images/20261106_finance_brighton/03_w.jpg
    card: none
  - text: 開発を除くと、収入は約2億2240万ポンドになります。
    card: none
  - text: 開発を除いた収入の、約68%が放映権。テレビのお金が、柱のクラブです。
    card: none
