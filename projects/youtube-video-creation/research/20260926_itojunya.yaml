sections:
  - id: eldest
    main: true
    heading: 最年長の自覚
    tier: 報道
    telop: 今回の代表で最年長。本人は「あんまり自覚ない」
    narrator: キャスター
    say:
      - 今回の日本代表30人の中で、伊東がいちばん年上です。
      - 代表に集まってすぐの取材で、そこに話が及びました。
      - voice: 伊東純也
        text: そうですね。あんまり自覚ないですし、周りもそんな思ってないと思います
      - チームの中での役割を聞かれると、こう答えています。
      - voice: 伊東純也
        text: 積極的に声を出すタイプではないので、プレーで引っ張っていければいいかなと思ってます
      - 若い選手が増えたことについては。
      - voice: 伊東純也
        text: 新しい選手が入ってきて、新しい競争が始まる。今までいた選手も安泰じゃないよっていうのはあると思います
    sources:
      - https://www.youtube.com/watch?v=yHhR-3hFNBY
      - https://football-tribe.com/japan/2026/09/26/359729/
      - https://news.yahoo.co.jp/articles/8c3c9bb49e15a683cae1493597117f3fc6c1f074
  - id: uruguay
    heading: その夜のウルグアイ戦
    tier: 報道
    telop: 途中出場で2点に絡む。90+6分に上田へのアシスト
    narrator: キャスター
    card:
      type: table
      title: ウルグアイ戦の伊東純也
      columns: ['', '']
      rows:
        - [63分, 途中から出場]
        - [2点目, 起点のパス]
        - [90+6分, 上田綺世へのアシスト]
    say:
      - このインタビューが公開された日の夜、ウルグアイ戦。
      - 伊東は63分から出て、塩貝健人と上田綺世のゴールに絡みました。
      - 試合終了間際、上田へのパスでダメ押しの3点目。試合のあと、こう振り返っています。
      - voice: 伊東純也
        text: 綺世が完全に見えたので、いいボールを出したら抜けるんじゃないかなと思った。そこはやれる自信もありました
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260924/2209051.html
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「最年長に見えない」と「伊東の代わりは存在しない」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 純也くんもぜんぜん若い
      - voice: ネット民
        text: それすごく聞きたかったやつだよ
      - voice: ネット民
        text: 後輩達に最年長だと思われない伊東純也
      - voice: ネット民
        text: 伊東純也が最年長だと思われてないの面白すぎる。
      - voice: ネット民
        text: あの見た目と雰囲気でベテラン枠なの反則だろwww 後輩たちの中に混ざってても違和感ゼロ。
      - voice: ネット民
        text: 気付いたら代表の最年長になってるの、なんか信じられないんだよな
      - voice: ネット民
        text: サムネ、純也選手が1番若く見える。可愛い
      - voice: ネット民
        text: 4年後のジョーカー伊東純也でいいやろ
      - voice: ネット民
        text: 日本は長らく戦術伊東であったことを忘れてはいけない。
      - voice: ネット民
        text: 久保、堂安など良い選手はたくさんいるが、伊東は替えがきかない。
      - voice: ネット民
        text: 前回のアジアカップで負けたのも、伊東が不当なことで離脱を余儀なくされたから
      - voice: ネット民
        text: 三苫の代わりは怪我もなくていつも安定している中村になったけど、伊東の代わりだけは存在しないんだよね。
      - voice: ネット民
        text: 出たら試合をひっくり返すほどの力は年齢なんか関係ないと思わせる。
      - voice: ネット民
        text: メッシが40でW杯出たから次も出てくれないかな
      - voice: ネット民
        text: 伊東と三笘はドリブルやスピードに注目が行きがちだけど、何気にパスのスキルがめちゃくちゃ高いよね。
      - voice: ネット民
        text: 上田綺世に通したアシストは絶品でした
      - voice: ネット民
        text: 塩貝がゴール後、無表情でいたけど、伊東純也が近づいた時に少し笑顔になったような(気のせい？
      - voice: ネット民
        text: )最年長の愛されキャラは人間力、人格者じゃなきゃ出来ない。戦力的にも必要だし長く頑張って欲しい
        short_voice: true
