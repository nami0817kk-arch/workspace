  title: 上田綺世が初先発で決めた日、ベンチにいたのは誰か
  hook: リールでの2試合目。今度は最初から出て、12分でした。
  question: なぜ加入2試合目でいきなり先発だったのか

thumbnail:
  line1: 加入後2試合連続ゴール
