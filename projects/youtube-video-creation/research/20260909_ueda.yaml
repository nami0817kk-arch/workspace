      - {voice: ネット民, text: ジルーってまだ現役だったんか}
      - {voice: ネット民, text: 39って、、、、}
      - {voice: ネット民, text: ジルーはカップ戦要員でええやん}
      - {voice: ネット民, text: ごめんねジルー}
      - {voice: ネット民, text: ジルーを信じる～}
      - {voice: ネット民, text: ジルーも歳だしそのうち出るだろ}
      - {voice: ネット民, text: あせる必要はない 相手はただのジジイだ}
      - {voice: ネット民, text: カズみたいに粘る気はないんやろ}
      - {voice: ネット民, text: ジルー師匠が師匠 ゴールが止まりそう}
      - {voice: ネット民, text: 汁ーなんかにまけるわけねーだろw}
