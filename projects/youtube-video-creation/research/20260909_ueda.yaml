sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 加入後初先発で先制点
    say:
      - チャンピオンズリーグ第1節、リールはレアル・ベティスと戦いました。
      - うえだあやせは加入後はつの先発出場です。
      - 12分、エタン・エムバペのクロスに合わせて先制点を決めました。
      - 3日のトゥールーズ戦につづいて、公式戦2試合連続のゴールです。
      - 試合は33分に追いつかれ、36分に勝ち越し。
      - 後半に2失点して2対3、リールの逆転負けでした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202633.html
      - https://web.gekisaka.jp/news/ucl/detail/?458511-458511-fl
      - https://www.footballchannel.jp/2026/09/09/post1006932/

  - id: rating
    heading: 現地はどう評価したか
    tier: 報道
    telop: 「11分しか必要としなかった」
    say:
      - フランスの媒体、ゲット・フレンチ・フットボール・ニュースは6点を付けました。
      - {voice: 現地メディア, text: 今夜は得点まで11分しか必要としなかった}
      - {voice: 現地メディア, text: リールでの夢のようなスタートが続いている}
      - {voice: 現地メディア, text: ストライカーらしいゴールだった}
      - {voice: 現地メディア, text: 監督の判断を正当化するものになった}
      - デビュー戦のトゥールーズ戦は、途中出場から16分で決勝点でした。
    official: false
    sources:
