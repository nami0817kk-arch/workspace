sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 加入後初先発で先制点
    narrator: キャスター
    say:
      - チャンピオンズリーグ第1節、リールはレアル・ベティスと戦いました。
      - うえだあやせは加入後はつの先発出場です。
      - 12分、エタン・エムバペのクロスに合わせて先制点を決めました。
      - 3日のトゥールーズ戦につづいて、公式戦2試合連続のゴールです。
      - 試合は33分に追いつかれ、36分に勝ち越し。
      - 後半に2失点して2対3、リールの逆転負けでした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202633.html
      - https://web.gekisaka.jp/news/ucl/detail/?458511-458511-fl
      - https://www.footballchannel.jp/2026/09/09/post1006932/

  - id: rating
    heading: 現地はどう評価したか
    tier: 報道
    telop: 「11分しか必要としなかった」
    narrator: 解説
    say:
      - フランスの媒体、ゲット・フレンチ・フットボール・ニュースは6点を付けました。
      - {voice: 現地メディア, text: 今夜は得点まで11分しか必要としなかった}
      - {voice: 現地メディア, text: リールでの夢のようなスタートが続いている}
      - {voice: 現地メディア, text: ストライカーらしいゴールだった}
      - {voice: 現地メディア, text: 監督の判断を正当化するものになった}
      - デビュー戦のトゥールーズ戦は、途中出場から16分で決勝点でした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006986/
      - https://www.footballchannel.jp/2026/09/09/post1006932/

  - id: bench
    heading: ベンチにいたのは誰か
    tier: 背景
    telop: 39歳のジルーがベンチスタート
    narrator: 解説
    say:
      - この日、1トップに入ったのはうえだでした。
      - もとフランス代表のオリビエ・ジルーは、ベンチスタートです。
      - ジルーは39歳。リールの実績あるストライカーです。
      - うえだが8月31日にフェイエノールトから完全移籍してきて、まだ9日でした。
      - 現地メディアは、このペースが続けばジルーを見る機会が減るかもしれない、と書いています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006860/
      - https://www.footballchannel.jp/2026/09/09/post1006986/

  - id: reactions
    heading: ネットではどう見られているか
    tier: 未確認
    telop: 22件の書き込みから
    narrator: キャスター
    say:
      - これに対して、日本のネットではどう見られているのか。
      - {voice: ネット民, text: 上田がゴール決めた後の落ち着きのなさはちょっとワロタ}
      - {voice: ネット民, text: ヘッドは上田のほうが強い}
      - {voice: ネット民, text: ポストプレーは強豪相手だといつも空気}
      - {voice: ネット民, text: 上田はポストプレーが超下手糞だからな}
      - {voice: ネット民, text: 上田は最終的にはプレミアを目指しているだろう}
      - {voice: ネット民, text: 今後もどんどん行くだろう}
      - {voice: ネット民, text: ファンペルシーに信頼されジルーに教わるとかいい環境だな}
      - {voice: ネット民, text: ジルーが初っ端からかなり優しく接してくれてるよね}
      - {voice: ネット民, text: あの金額で控えってｗ}
      - {voice: ネット民, text: ジルーってまだ現役だったんか}
    official: false
    sources:
      - https://sakarabo.blog.jp/archives/1084479704.html
