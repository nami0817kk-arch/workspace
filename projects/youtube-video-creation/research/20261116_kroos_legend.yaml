# トニ・クロース（元ドイツ代表MF、レアル・マドリード10シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-16 用。型は 11/14 ザネッティと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Toni Kroos の成績表・本文・Honours、2016 FIFA Club World Cup final、2014 FIFA World Cup knockout stage）と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（結婚・家族・住まい・政治的発言は台本に出さない）。引退後の活動も言わない。
# **重なりの確認（2026-11-12）**：scripts/・research/covered.yaml・research/posted.json・research/2026111*_picks.txt を「クロース／Kroos」で grep。主役の回は無し（ジダンの回に名前が出るだけ）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス・ルーニー・ブッフォン・ラウール・ザネッティ）と重ならない。同じ日（11/16）の別シリーズとは題材が別（research/20261115_picks.txt）。11/18 のレジェンドはプジョル（バルセロナ）で、クラブも別。
# **引退の確認**：Wikipedia「On 21 May 2024, Kroos announced that he would retire from club and international football after UEFA Euro 2024」「(Euro 2024 quarter-final loss to Spain 2–1 after extra time) would be his last career match」。出典に Real Madrid 公式発表・BBC Sport（2024-05-21）。→ 現役ではない（36歳）。
# **日本との接点**：2016-12-18 クラブW杯決勝（横浜国際総合競技場、観客68,742、鹿島アントラーズ 2-4 レアル、延長）。得点：ベンゼマ9分・柴崎44分・52分・ロナウド60分(PK)・98分・104分。ロナウドの3点目は「following a pass from Toni Kroos」（Wikipedia の試合ページ）。ラインナップ表でクロースは先発（背番号8）、交代の印なし＝120分間出場。2016-17 シーズンの成績表の注にクラブW杯2試合。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：バイエルン 205試合25点、レバークーゼン 48試合10点、レアル 465試合28点（ラ・リーガ306/22、国内カップ23/0、欧州110/5、その他26/1）。ドイツ代表 114試合17点。Bayern II（13試合4点）は除く。サムネの表：レアル 465/28、他クラブ（バイエルン205/25＋レバークーゼン48/10）253/35、ドイツ代表 114/17、合計 832/80（自分で足した値：465+205+48+114、28+25+10+17）。Wikipedia 冒頭の career total 731試合67点は Bayern II を含み代表を含まないので使わない。
# - レアルでの22個のタイトル（うちラ・リーガ4・CL5）、通算34個（本文）。レアルのCL優勝：2015-16・2016-17・2017-18・2021-22・2023-24。ラ・リーガ：2016-17・2019-20・2021-22・2023-24。クラブW杯：バイエルン2013、レアル2014・2016・2017・2018・2022（6度、本文）。
# - 2014 W杯準決勝（2014-07-08）：11分クロースのCK→ミュラー、クローゼの2点目はクロースとの連携、クロース24分・26分、ケディラ（6分間で4点目＝29分）、前半5-0、後半シュールレ2点、90分オスカル。7-1。クロースはFIFAの試合最優秀選手・大会4つ目のアシスト。ブラジルのW杯最大の敗戦。クローゼがW杯通算16点目でロナウドを抜く（Wikipedia 2014 World Cup knockout stage）。決勝の相手アルゼンチン（Wikipedia Honours の出典）。
# - 持ち味：長く正確なパス・セットプレー・「Kroos shuffle」（Wikipedia Style of play）。ブラジルでの呼び名「Garçom（給仕）」（本文）。
# - 2021-04-10 クラシコ28分のFKが決勝点（2-1）、レアルで初のFKゴール（6本目の試み）。2022-09-11 マジョルカ戦で初めてレアルの主将を務める。2022-10-30 ジローナ戦でプロ初の赤（2枚目の警告）。2024-05-25 ベルナベウ最後のリーグ戦（レアル・ベティス 0-0、86分交代）、2024-06-01 CL決勝（ドルトムント 2-0、カルバハルの1点目をコーナーからアシスト、ヘントの欧州杯6度に並ぶ）。2024-07-05 EURO準々決勝が最後の試合（日付は AP の記事見出しの日付）。
# **山場**：2014年W杯準決勝。クロース本人のゴール2つと連携を、結果と記録で語る。
# **本人の言葉**：取れていない（公式の引退声明の全文は未確認）。声の行は置かない。
# **見立て（自分で足した・割った値）**：レアルの季ごと（公式戦）14-15 55、15-16 44、16-17 48、17-18 43、18-19 43、19-20 45、20-21 42、21-22 45、22-23 52、23-24 48（合計465と一致、最少は20-21の42）。1季平均 46.5（465÷10）。CL優勝は10シーズン中5回、ラ・リーガ優勝は4回。
# **入れなかったもの**：私生活・家族・政治的な発言、サウジへの批判、引退後の活動、ほかの選手との比較、「最多」（クラブW杯の最多は当時の記録として一度だけ使用）、2022年W杯の日本戦（出場を確かめていない）。
# **読みで怪しいもの**：トニ・クロース、グライフスヴァルト、レバークーゼン、ベンゼマ、柴崎、ロナウド、ミュラー、クローゼ、ケディラ、カルバハル、ジローナ、マジョルカ、ガルソン、ベルナベウ、クラシコ、クロース・シャッフル。
