sections:
- id: hook
  heading: モロッコは、監督が替わって、何が起きたのか
  tier: 背景
  telop: 大会3か月前に監督交代。それでもベスト8
  narrator: 解説
  main: true
  say:
  - text: モロッコ代表。フィファランクは7位の国です。
    image: assets/stats/tb_morocco_data_t.png
    short_only: true
    no_telop: true
  - text: 2026年のワールドカップで、モロッコは、ベスト8に進みました。
    image: assets/stats/tb_morocco_data_t.png
    no_telop: true
  - text: 2022年のベスト4に続いて、今回も準々決勝まで残りました。
    image: assets/stats/tb_morocco_data_r1.png
    no_telop: true
    emph: true
  - text: ところが、その3か月前の2026年3月に、監督が替わっていました。
    image: assets/images/20261126_team_morocco/b01_w.jpg
    no_telop: true
  - text: 新しい監督は、U-20ワールドカップで優勝したばかりの、ワフビです。
    image: assets/images/20261126_team_morocco/b03_w.jpg
    no_telop: true
  - text: 監督が替わったモロッコは、どうやって8強に残ったのでしょうか。
    image: assets/stats/tb_morocco_data_t.png
    no_telop: true
