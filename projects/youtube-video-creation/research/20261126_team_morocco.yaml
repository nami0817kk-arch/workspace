- id: data
  heading: モロッコ代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: モロッコ代表の基礎DATA
  narrator: 解説
  say:
  - text: モロッコのフィファランクは、10月7日の発表で**7位**。日本は17位です。
    image: assets/stats/tb_morocco_data0.png
    no_telop: true
  - text: W杯の本大会に出るのは、7回目。最高成績は、2022年のベスト4です。
    image: assets/stats/tb_morocco_data1.png
    no_telop: true
  - text: 直近は2026年。フランスに0対2で負けて、ベスト8でした。
    image: assets/stats/tb_morocco_data2.png
    no_telop: true
  - text: アフリカ選手権は、優勝2回。1976年と、2025年です。
    image: assets/stats/tb_morocco_data3.png
    no_telop: true
  - text: 監督は、ワフビ。2026年3月に就任しました。
    image: assets/stats/tb_morocco_data5.png
    no_telop: true
  - text: 主将はハキミ。パリ・サンジェルマンのディフェンダーです。
    image: assets/stats/tb_morocco_data6.png
    no_telop: true
  - text: 日本とは、A代表どうしでは、まだ対戦がありません。
    image: assets/stats/tb_morocco_data8.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Morocco_at_the_FIFA_World_Cup
  - https://en.wikipedia.org/wiki/Morocco_national_football_team
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
