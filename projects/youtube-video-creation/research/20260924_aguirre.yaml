  - id: who
    main: true
    heading: どんな監督か
    tier: 背景
    telop: 日本代表・メキシコ代表・アトレティコを率いた67歳
    narrator: 解説
    say:
      - text: 'バレンシアは勝ち点4の19位で前の監督を解任し、9月23日にアギーレの就任を発表しました。'
        short_only: true
      - アギーレは**日本代表**のほか、メキシコ代表、アトレティコ・マドリー、エスパニョール、マジョルカなどを率いてきました。
      - 2026年のワールドカップでは、母国メキシコを**ベスト16**へ導いています。
      - マジョルカの監督だったとき、**久保建英を指導**しています。
      - そしていまのバレンシアには、**佐藤龍之介**がいます。日本と縁のある監督が、日本人のいるクラブへ来たことになります。
    sources:
      - https://web.gekisaka.jp/news/world/detail/?459589-459589-fl
  - id: club
    heading: クラブの側の事情
    tier: 報道
    telop: 14年で24人目。監督が代わり続けている
    narrator: キャスター
    say:
      - ただ、その椅子は長く座れる椅子ではありません。アギーレはバレンシアにとって、**14年で24人目**の監督です。
      - 平均すると**7か月に1人**替わっている計算になります。
      - 腰を据えて仕事をできた監督は、多くありません。
    sources:
      - https://www.vi.nl/nieuws/getroebleerd-valencia-presenteert-24ste-trainer-in-veertien-jaar
