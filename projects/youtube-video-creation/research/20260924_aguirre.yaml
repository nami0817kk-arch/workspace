    say:
      - バレンシアはリーグ7試合を終えて**1勝1分け5敗、勝ち点4で19位**。降格圏です。開幕のあと、4連敗もありました。
      - 前の監督カルロス・コルベランは解任され、Bチームのオスカル・サンチェスが一時的に指揮を執っていました。
      - そして9月23日、**ハビエル・アギーレの監督就任**が発表されました。67歳です。
      - 契約は**今季終了まで**。1年の延長オプションが付いています。
      - voice: ネット民
        text: 彼の運は、俺たちの運だ
