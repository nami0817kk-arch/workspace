# アレッサンドロ・デル・ピエロ（元イタリア代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-02。型は 10/29 のトッティと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役を終えたあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Alessandro Del Piero の成績表・本文、1996 Intercontinental Cup、2002 FIFA World Cup Group G）と、自分で足した・割った値だけ。引退の確認だけ The Guardian 2015-10-12 本文を requests で取得。
# **私生活・法的な問題は入れない**（2005・06年のスクデット剥奪と2006年の降格の「理由」、1999年の薬物疑惑と無罪、家族、父の死は使わない。2部への降格は「クラブが2部へ落ちた」という事実の一言だけ）。女子サッカーは入れない。
#
# **重なりの確認（11/2 作成時、日付は 10/31）**：scripts/・research/covered.yaml・research/posted.json を「デル・ピエロ／デルピエロ／Del Piero」で grep。主役の回は無し（10/18 中田英寿の回に「開始4分、デル・ピエロ」が1行、10/28 ピルロの回に 2006年W杯準決勝の得点者として名前が出る）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ）と重ならない。11/1 以降の同日分はカシージャス（10/31）。
# **山場の選び方**：2006年W杯準決勝（ドイツ戦）は 10/28 ピルロの山場なので使わない。山場は **1996-11-26 東京・国立競技場のクラブ世界一決定戦（トヨタカップ）**。日本との接点の節では 少年期のキャプテン翼・2002-06-13 大分のメキシコ戦の同点ヘッドを扱い、東京の試合は山場で深掘りする。
# **引退の確認**：**英語版 Wikipedia は「2015年10月に引退を公式に伝えた」とするが、出典の Guardian（2015-10-12）本文は「Del Piero officially hung up his boots after a brief stint in the inaugural Indian Super League with Delhi Dynamos, calling it a day at the end of the 2014 season」。日付が食い違う → 台本は「2014年のシーズンを最後に現役を終えた」とだけ言い、2015年10月の発表とは言わない。イタリア語版 Wikipedia「Dopo il ritiro」は「2015年から Sky Sport の解説者」。→ **選手としては現役ではない（51歳）**。いまの立場：解説者（2015〜、Wikipedia 英・伊）、2025年にUEFAプロライセンス（伊語版 Wikipedia のみ・確度は報道止まり）。
# **日本との接点**：①少年期の憧れの1つが日本のサッカー漫画『キャプテン翼』（英語版 Wikipedia 本文）。②2002-06-13 大分ビッグアイ、日韓W杯 G組 メキシコ1-1イタリア、メキシコが34分に先制、途中出場のデル・ピエロが85分にヘディングで同点（試合表と本文。引き分けでイタリアは決勝トーナメントへ）。③**1996-11-26 東京・国立競技場、Intercontinental Cup（日本ではトヨタカップ。英語版の脚注が "Toyota Cup" と呼ぶ）ユヴェントス1-0リーベル・プレート、81分デル・ピエロ、試合の最優秀選手、観客48,305人、前半0-0、後半ディ・リーヴィオのCKをジダンが頭で、こぼれをデル・ピエロが決める**（英語版 "1996 Intercontinental Cup"、試合表 81'）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：ユヴェントス 705試合290点（Total 行。出場クラブ記録・得点クラブ記録）、うちセリエA 478試合188点（本文、2部の35試合20点を除く）、2部セリエB 2006-07 35試合20点、欧州 127試合51点。パドヴァ 14試合1点、シドニーFC 48試合24点、デリー 10試合1点（Career total 777試合316点と一致）。他の3クラブ＝14+48+10＝72試合、1+24+1＝26点（自分で足した値）。
# - イタリア代表 91試合27点（Wikipedia）。クラブと代表の合計 868試合343点（自分で足した値：777+91＝868、316+27＝343）。**Wikipedia 冒頭の「462 goals」とは数え方が違う（親善試合・年代別などを含む）。台本・サムネは自分で足した343点に統一し、「公式戦のクラブと代表の合計」と断る。**
# - ユヴェントスのチャンピオンズリーグ 92試合44点＝クラブ歴代1位（得点）、出場はブッフォンに次ぐ2位（Wikipedia）。
# - アシスト：ユヴェントスの公式戦134、セリエA歴代3位（トッティ・バッジョに次ぐ。Wikipedia）。1999-2000 はセリエA14アシストでリーグ最多（Wikipedia）。
# - フリーキック：クラブ46＋代表6＝52点、イタリア人で歴代1位（Wikipedia）。
# - 見立て（自分で割った値）：1997-98 セリエA 32試合21点＝0.656→0.66、2007-08 セリエA 37試合21点＝0.568→0.57、ユヴェントスのセリエA通算 478試合188点＝0.393→0.39。0.57÷0.39＝1.46、0.66÷0.39＝1.69。1997-98 は23歳（1974-11-09生まれ、シーズン途中の11月に23歳）、2007-08 は33歳。2007-08 は21点でセリエA得点王（トレゼゲ20・ボッリエッロ19を上回る。Wikipedia）。2006-07 のセリエBも20点で得点王。2001-02・2002-03 は各16点（成績表）。
# - 1992-03-15 メッシーナ戦でパドヴァの17歳デビュー（途中出場）。1993 ユヴェントスへ移籍金50億リラ。1994-95 初のスクデット（9年ぶり）で8点。1995 バッジョの10番を継ぐ。1995-96 CL優勝、6点で大会2位の得点。1998-11-08 ウディネーゼ戦で膝を大けが。2001 主将（リッピの復帰時）。2006 クラブが2部へ→主将のまま残留、1年で復帰。2012-05-20 コッパ・イタリア決勝（ナポリに0-2）が最後の試合で67分に交代（以上 Wikipedia）。
# - 本人の言葉：2012-06-30 のファンへの手紙（Wikipedia が英訳を引用）「From tomorrow I will no longer be a Juventus player, but I will always be one of you」。10番の永久欠番を断った言葉（同 Wikipedia）「I've really had so much that I would never want it to be retired, this way, every child can dream one day of wearing it」。**原文のイタリア語は未確認。訳は Wikipedia の英訳から。**
# - マル秘話：子どもの頃にゴールキーパー（母が汗をかかない・けがしにくいと考えた。兄が攻撃向きと言ってFWに）／あだ名ピントゥリッキオ（アニェッリ会長が、バッジョを「ラファエロ」にたとえた流れで、その弟子の画家の名を与えた）／10番の永久欠番を断った（Wikipedia）。
# **入れなかったもの**：スクデット剥奪と降格の理由、薬物疑惑、家族・父の死、ツイッターなどの発言、Wikipedia の「Personal life」、2000年の年俸世界一、2000年決勝のミス。
# **読みで怪しいもの**：デル・ピエロ（ピエーロと読まれないか）、リーベル・プレート、ディ・リーヴィオ、ジダン、コネリアーノ、パドヴァ、ピントゥリッキオ、ラファエロ、キャプテン翼、コッパ・イタリア、スカイ・スポーツ、大分。「最多」は使わず「いちばん多い」。「2007年から08年」は「ニセンナナ、ゼロハチ」と読まれないよう年号を言い換える。
