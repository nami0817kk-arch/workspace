  - {text: デル・ピエロ。, short_only: true, card: none, image: assets/images/20261102_delpiero_legend/11_w.jpg}
  - {text: 日本との縁がいちばん深いのは、1996年の東京です。, short_only: true, card: none, image: assets/images/20261102_delpiero_legend/11_w.jpg}
  - {text: 1996年11月26日、東京の国立競技場。, card: none, image: assets/images/20261102_delpiero_legend/03_w.jpg}
  - {text: ヨーロッパ王者のユヴェントスと、南米王者のリーベル・プレートが戦います。, card: none}
  - {text: 当時のクラブ世界一を決める試合で、日本ではトヨタカップと呼ばれました。, card: none}
  - text: 前半は0対0の同点。枠内シュートはユヴェントス8本、リーベル2本です。
    card: *mt
    image: assets/images/20261102_delpiero_legend/12_w.jpg
  - text: 後半81分、コーナーキック。ジダンが頭で合わせ、こぼれ球がデル・ピエロの前へ。
    card:
      type: timeline
      title: 1996年11月26日 クラブ世界一決定戦
      rows: *mtr
      focus: 1
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/02_w.jpg
    emph: true
    callword: 81分
  - {text: ゴール前で打ち込んで、これが決勝点になりました。, card: none, image: assets/images/20261102_delpiero_legend/13_w.jpg}
  - text: 1対0でユヴェントスの勝ち。この試合の最優秀選手は、デル・ピエロでした。
    card:
      type: timeline
      title: 1996年11月26日 クラブ世界一決定戦
      rows: *mtr
      focus: 2
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/13_w.jpg
  - {text: 日本の人たちの前で決めた、クラブ世界一の1点でした。, card: none, image: assets/images/20261102_delpiero_legend/12_w.jpg}
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/1996_Intercontinental_Cup', 'https://en.wikipedia.org/wiki/Alessandro_Del_Piero']
- id: after
  heading: 現役を終えたあと、デル・ピエロは何をしてきたのか
  tier: 報道
  telop: ファンへの手紙と、そのあと
  card: &af
    type: timeline
    title: 現役のあと
    rows: &afr
    - [2012年6月, ファンへ手紙を書く]
    - [2012〜14年, シドニーFCで24点]
    - [2014年, インドのデリーで現役を終える]
    - [2015年, 解説者に]
    focus: 0
    highlight_row: 0
  say:
  - text: ユヴェントスを去る2012年6月30日。デル・ピエロは、ファンへ手紙を書きました。
    card: *af
    image: assets/images/20261102_delpiero_legend/13_w.jpg
  - {voice: デル・ピエロ, text: 明日からは、もうユヴェントスの選手ではありません。, card: none, pause: 0.6}
  - {voice: デル・ピエロ, text: でも、これからもずっと、あなたたちの仲間です。, card: none, cont: true}
  - {text: そのあとは、オーストラリアのシドニーFCへ。, card: none, image: assets/images/20261102_delpiero_legend/06_w.jpg}
  - text: 1年目の14点は、クラブの1シーズンの記録。2年目は10点でした。
    card:
      type: timeline
      title: 現役のあと
      rows: *afr
      focus: 1
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/06_w.jpg
  - text: 最後のクラブはインドのデリー。2014年のシーズンを最後に、現役を終えます。
    card:
      type: timeline
      title: 現役のあと
      rows: *afr
      focus: 2
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/10_w.jpg
  - text: 2015年からは、イタリアのテレビ局で、解説者を務めています。
    card:
      type: timeline
      title: 現役のあと
      rows: *afr
      focus: 3
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/07_w.jpg
  - {text: いまの肩書きは、2026年10月30日時点のものです。, card: none, image: assets/images/20261102_delpiero_legend/07_w.jpg}
  quotes_from: ['https://en.wikipedia.org/wiki/Alessandro_Del_Piero']
  sources: ['https://en.wikipedia.org/wiki/Alessandro_Del_Piero', 'https://www.theguardian.com/football/2015/oct/12/alessandro-del-piero-and-roberto-carlos-touted-for-a-league-coaching-roles']
- id: secret
  heading: デル・ピエロは、なぜ10番を永久欠番にしなかったのか
  tier: 報道
  telop: ゴールキーパー、画家、そして10番
  card: &sc
    type: table
    title: 知られざる、3つの話
    columns: [いつ, 何があったか]
    rows: &scr
    - [子どものころ, ゴールキーパーをしていた]
    - [1994〜95年, 会長が「ピントゥリッキオ」と呼ぶ]
    - [2012年, 10番の永久欠番を断る]
    source: Wikipedia
    highlight_row: 0
  say:
  - {text: デル・ピエロには、意外な話が3つあります。, card: none, image: assets/images/20261102_delpiero_legend/04_w.jpg}
  - text: 1つ目。子どものころは、ゴールキーパー。母は、汗もけがも少ないと考えました。
    card: *sc
    image: assets/images/20261102_delpiero_legend/04_w.jpg
  - {text: 兄が「その腕前なら、攻撃向きだ」と母に話して、フォワードになりました。, card: none}
  - text: 2つ目。あだ名は「ピントゥリッキオ」。ルネサンスの画家になぞらえた名です。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261102_delpiero_legend/03_w.jpg
    emph: true
  - {text: 会長はバッジョをラファエロにたとえ、その弟子の名を贈りました。, card: none, image: assets/images/20261102_delpiero_legend/03_w.jpg}
  - text: 3つ目。2012年、クラブから背番号10を永久欠番にする申し出がありました。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      source: Wikipedia
      highlight_row: 2
    image: assets/images/20261102_delpiero_legend/02_w.jpg
  - {voice: デル・ピエロ, text: 僕は、もう十分すぎるものをもらいました。欠番にはしたくない。, card: none, pause: 0.6, image: assets/images/20261102_delpiero_legend/11_w.jpg}
  - {voice: デル・ピエロ, text: そうすれば、どんな子どもも、, card: none, cont: true}
  - {voice: デル・ピエロ, text: いつかこの番号を着る夢を見られるから。, card: none, cont: true}
  - {text: 背番号に、自分の名前を閉じ込めない。デル・ピエロらしい断り方でした。, card: none, image: assets/images/20261102_delpiero_legend/13_w.jpg}
  quotes_from: ['https://en.wikipedia.org/wiki/Alessandro_Del_Piero']
  sources: ['https://en.wikipedia.org/wiki/Alessandro_Del_Piero', 'https://it.wikipedia.org/wiki/Alessandro_Del_Piero']
- id: view
  heading: 東京の1点から11年、デル・ピエロの点はなぜ減らなかったのか
  tier: 背景
  viewpoint: true
  telop: 23歳も33歳も、同じ21点
  card: &vw
    type: table
    title: デル・ピエロ セリエAの得点ペース
    columns: [期間, 試合, 得点, 1試合あたり]
    rows: &vwr
    - [ユヴェントス通算, '478', '188', '0.39']
    - [23歳の季, '32', '21', '0.66']
    - [33歳の季, '37', '21', '0.57']
    source: Wikipedia
    highlight_row: 0
  say:
  - text: 最後に、デル・ピエロのセリエAの得点ペースを、3つの数字で比べます。
    card: *vw
    image: assets/images/20261102_delpiero_legend/04_w.jpg
  - text: ユヴェントスでのセリエA通算は、478試合で188点。1試合0.39点です。
    card:
      type: table
      title: デル・ピエロ セリエAの得点ペース
      columns: [期間, 試合, 得点, 1試合あたり]
      rows: *vwr
      source: Wikipedia
      highlight_row: 0
    image: assets/images/20261102_delpiero_legend/04_w.jpg
  - text: 23歳のシーズンは、32試合で21点。1試合あたり0.66点です。
    card:
      type: table
      title: デル・ピエロ セリエAの得点ペース
      columns: [期間, 試合, 得点, 1試合あたり]
      rows: *vwr
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261102_delpiero_legend/03_w.jpg
    emph: true
    mark: {kind: circle, row: 1, col: 3}
  - text: そして10年後、33歳の季。37試合で、またも21点。1試合0.57点でした。
    card:
      type: table
      title: デル・ピエロ セリエAの得点ペース
      columns: [期間, 試合, 得点, 1試合あたり]
      rows: *vwr
      source: Wikipedia
      highlight_row: 2
    image: assets/images/20261102_delpiero_legend/13_w.jpg
  - {text: どちらも通算の1.4倍を超えるペース。33歳の季は、得点王にも立ちました。, card: none, image: assets/images/20261102_delpiero_legend/12_w.jpg}
  - {text: けがのあと、1999年から2000年は、点より先にアシスト。, card: none, image: assets/images/20261102_delpiero_legend/13_w.jpg}
  - {text: 14本は、セリエAでいちばん多い数でした。, card: none}
  - {text: 役を変えて、また点へ。2001年から2002年も、次の年も、16点ずつでした。, card: none, image: assets/images/20261102_delpiero_legend/11_w.jpg}
  - {text: 役を変えながら、同じ21点まで戻る。デル・ピエロの点は、そうして減らなかった。, card: none, image: assets/images/20261102_delpiero_legend/03_w.jpg}
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/Alessandro_Del_Piero', 'https://it.wikipedia.org/wiki/Alessandro_Del_Piero']
