  - text: ローマの何が特別か。10月の会見で聞かれて、マレンはこう答えています。
    image: assets/images/20261111_player_326029/d2/01_w.jpg
    card: none
  - voice: マレン
    text: まずは監督です。僕を信じて、たくさん試合に出してくれました。
    card: *words_card
  - voice: マレン
    text: ここに来たとき、大きな目標の1つは、
    card: *words_card
    cont: true
  - voice: マレン
    text: チャンピオンズリーグに戻ることでした。
    card: *words_card
    cont: true
    pause: 0.5
  - text: ローマのファンがつけたあだ名は、ボビー・マレン。
    image: assets/images/20261111_player_326029/v1/01_w.jpg
    card: none
  - text: 名字の響きが、ボブ・マーリーに似ているからです。
    card: none
