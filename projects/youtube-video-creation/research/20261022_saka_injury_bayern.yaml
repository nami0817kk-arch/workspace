# 題材: research/20261022_topics_src.yaml の番号11。題材ページの「確かめられなかったこと」＝アルテタの発言の全文が未確認、程度・離脱期間は未発表。
# 取材: 2026-10-22。requests（ブラウザUA／ESPN は記事API）で本文を全部読んだ。検索エンジンのAI要約は使っていない。控えは research/raw/20261022_saka_*.txt。
#   ・Arsenal.com（クラブ公式）「Every word from Arteta's post-Bayern presser」（2026-10-21 22:13Z）……試合後会見の全文を読んだ（一次情報）。
#       「On Bukayo's injury… It's his quad. It was early in the game, and the level of intensity his game requires is something incredible. … those things happen unfortunately. It doesn't look good at all, but we have to wait and see.」
#       **ここで『全文』が確かめられた**（題材ページでは未確認だった）。ただし「They are a bit concerned」「really sharp pain」はこの会見録に**無い**。試合直後の取材（ミックスゾーンなど）の発言らしく、下の2紙が引いている。
#   ・Arsenal.com 試合レポート「Report: Bayern Munich 2-2 Arsenal」……「forced off with a non-contact injury after just nine minutes」（**接触のない負傷**。クラブ公式）。交代は「Eze – an early replacement for Bukayo Saka」。**公式は「9分」、他紙は10分交代**——台本は「開始10分に交代」（ESPN・ガーディアン・フットボールチャンネルが10分）。
#   ・ESPN（記事API・AP配信）「Saka forced off after 'sharp pain;' Arteta says 'doesn't look good'」……「"They are a bit concerned," Arteta said after the game, while confirming the injury was to Saka's quad. "A player who has to come off with a really sharp pain is never good news but we have to wait and see." … "It doesn't look good."」、左の太ももを押さえた、エゼと交代した時点で0-0、25歳、近年はけがが多い（ハムストリングとアキレス）。
#   ・ガーディアン（2026-10-21）「'A player off with really sharp pain is never good news'」……「"It doesn't look good at all but we have to wait and see," Arteta said. "They [the medics] are a bit concerned. A player who has to come off with a really sharp pain is never good news. Bukayo did not start the game against Lille last Tuesday, then he started at Nottingham Forest on Sunday and it happened very early in this game."」**「They」は記事の補足で『医療班』**（括弧書き）。
#   ・フットボールチャンネル（2026-10-22）……8分に接触なしで太もも付近を押さえて倒れ、10分にエゼと交代。「今後の欠場の有無にも注目が集まる」（記事の書き方。**欠場は未発表**）。
#   ・スカイスポーツ：題材ページの見出し『Gunners 'concerned' by Saka injury, says Arteta』は**見出しだけ**。本文（ライブブログ）は読めていない。**使わない**。BBC は採点記事に「thigh injury」とあるのみ。
# **「懸念している」はアルテタの言葉そのものではない。** 原文は「They [the medics] are a bit concerned」＝医療班が少し懸念している。台本は『医療班は、少し懸念している』と訳し、監督自身が懸念していると言わない。
# 出来事の順（現地21日・水曜、アリアンツ・アレーナ、CL リーグフェーズ第3節）: 8分に倒れ込む → 10分にエゼと交代（0-0）→ 25分エゼ先制（VAR で認められる）→ 35分デイビスが同点 → 61分ケインPKで逆転 → 82分ライスが同点、2-2。アーセナルは2勝1分で無敗。
# 数字（自分で数えた）: 交代の10分→エゼの先制25分＝**15分後**。サカは 13日のリール戦＝先発でない／18日のフォレスト戦＝先発／21日＝10分で交代（監督の振り返り。ESPN の日程で13日・18日を確認）。
# 言わないこと: 負傷の程度・離脱期間・次の試合への影響は憶測になるので書かない。診断結果は、会見録・試合レポート・arsenal.com のニュース一覧のどこにも出ていない（10/22 昼の時点）。
#   「ハムストリング／アキレスの既往」は台本に入れない（今回の負傷と結びつけて読まれるため）。
# 反応: **当たっていない（作らない）**。承認は --no-voices で。
# 確度: 負傷交代・大腿四頭筋・接触なし＝確定（クラブ公式）。「医療班は少し懸念」「鋭い痛み」の言葉＝報道（ガーディアン・ESPN）。診断は未発表。
# 本人の言葉: アルテタ本人の発言が実在する（英語を訳した。語は足していない）。サカ本人の言葉は無い。
# 写真: 負傷の場面は使わない。代理店（Getty・AP など）は取り込まない。assets/images/20261022_saka_injury_bayern/（出典は credits.json）。
