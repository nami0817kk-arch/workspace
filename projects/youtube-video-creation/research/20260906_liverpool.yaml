slot: world
date: 2026年9月6日
theme:
  id: hughes_liverpool
  league: england
  prefix: 速報
  title: 監督を2人選んだ男が去る リヴァプールSD、2年で退任
  hook: クロップの後任を選び、その次の監督も選んだ人が、クラブを離れます。
  question: 強化を任された人が2年で去るとき、クラブに何が残るのか
thumbnail:
  line1: SDが2年で退任
  line2: 監督2人を選んだ人
  tags:
  - リヴァプール
  - ヒューズ
answer: 退任はクラブの公式発表。サウジ行きは関係者の話で、公式には何も出ていない
watch: 後任が誰になるか。人選はFSG会長のマイク・ゴードンが率いる
sections:
- id: what
  heading: 何が起きたか
  tier: 確定
  telop: クラブが公式に退任を発表
  say:
  - voice: キャスター
    text: リヴァプールが、スポーティングディレクターのリチャード・ヒューズの退任を発表しました。
  - voice: キャスター
    text: よんじゅうななさい。にせんにじゅうよねん、ろくがつにボーンマスから加入し、にねんあまりでの退任です。
    telop: 2024年6月就任、2年あまり
    card:
      type: points
      title: ヒューズがリヴァプールでしたこと
      items:
      - クロップ退任後の再建を任される
      - 後任にアルネ・スロットを指名 → 2024-25にリーグ20回目の優勝
      - 翌シーズンはCL出場権を獲得
      - スロット退任後、アンドニ・イラオラを招く
      - イサク、ヴィルツ、バルコラの大型補強
  - voice: キャスター
    text: クラブのサイトに出た本人の言葉です。
    card:
      type: quote
      source: Richard Hughes（クラブ公式）
      color: '#c8102e'
      text: It has been a source of great pride to have been given the opportunity to serve this incredible and unique institution.
      translation: この比類のないクラブに仕える機会をもらえたことは、大きな誇りだった
  - voice: キャスター
    text: クラブは、本人が新しい挑戦を望むと伝えてきた、としています。
    telop: 「新しい挑戦を望むと伝えてきた」
    card:
      type: quote
      source: マイク・ゴードン（FSG会長・クラブ公式）
      color: '#00b2a9'
      text: Richard joined us at the start of a period of change... we respect Richard's life choices and wish him and his family well.
      translation: リチャードは変化の時期の始まりに加わってくれた。彼の人生の選択を尊重し、家族ともども幸多からんことを願う
  official: true
  sources:
  - https://www.liverpoolfc.com/news/liverpool-fc-statement-14
  - https://www.espn.com/soccer/story/_/id/49833840/liverpool-richard-hughes-sporting-director-transfer-window-premier-league-saudi-pro-league-al-hilal
- id: why
  heading: 何をした人なのか
  tier: 報道
  telop: クロップの後任も、その次も、この人が選んだ
  say:
  - voice: キャスター
    text: ヒューズは、クロップの後任にアルネ・スロットを据えた人です。
  - voice: キャスター
    text: スロットは、一年目にプレミアリーグを制しました。
  - voice: キャスター
    text: そのスロットが昨シーズン限りで去ったあと、いまのイラオラ監督を招いたのも、ヒューズです。
    telop: 評価は割れている
  - voice: キャスター
    text: いっぽうで評価は割れています。イサク、ヴィルツ、バルコラといった大型補強を優先し、選手層を薄くしたという批判があります。
  official: false
  sources:
  - https://www.espn.com/soccer/story/_/id/49833840/liverpool-richard-hughes-sporting-director-transfer-window-premier-league-saudi-pro-league-al-hilal
  - https://www.theguardian.com/football/2026/sep/05/liverpool-new-sporting-director-after-richard-hughes-leaves-fsg
- id: next
  heading: これからどうなる
  tier: 報道
  telop: サウジ行きは「関係者の話」の段階
  say:
  - voice: キャスター
    text: 次の行き先については、慎重に見る必要があります。
    card:
      type: points
      title: 確かめられていることと、そうでないこと
      items:
      - 【確定】クラブが退任を発表した
      - 【報道】アル・ヒラルで同じ役職に就く見込み（関係者の話）
      - 【未確認】本人・アル・ヒラルからの発表はまだ無い
  - voice: キャスター
    text: サウジアラビアのアル・ヒラルで同じ役職に就く見込み、と伝えられていますが、これは関係者の話です。
  - voice: キャスター
    text: クラブからも本人からも、そこはまだ発表されていません。
  - voice: キャスター
    text: つぎに見るべきは、後任が誰になるかです。人選は、エフエスジー会長のマイク・ゴードンが率いています。
    telop: 後任の人選はFSG会長が率いる
  official: false
  sources:
  - https://www.espn.com/soccer/story/_/id/49833840/liverpool-richard-hughes-sporting-director-transfer-window-premier-league-saudi-pro-league-al-hilal
  - https://www.kicker.de/liverpool-sportdirektor-hughes-tritt-zurueck-1249904/artikel#omrss
