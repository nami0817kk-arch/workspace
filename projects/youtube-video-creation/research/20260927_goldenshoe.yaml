  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「ゴールデンシューいけるレベルじゃない？」
    narrator: キャスター
    say:
      - voice: ネット民
        text: ジョセフ・エデ・オロコ、ヴィルスリーガでの量産でベナン代表初招集。
      - voice: ネット民
        text: エデ・オロコ、爆発的な8月で、またも月間最優秀選手
      - voice: ネット民
        text: ラフィーニャ、欧州ゴールデンシューの有力候補に浮上
      - voice: ネット民
        text: ラフィーニャドブレテ！！やっと裏抜けに出してもらえたな。しかしこんな決定力高い人だったっけ？
      - voice: ネット民
        text: 怪我しなけりゃゴールデンシューいけるレベルじゃない？
        cont: true
