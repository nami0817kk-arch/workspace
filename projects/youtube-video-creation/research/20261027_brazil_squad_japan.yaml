        image: assets/images/20261027_brazil_squad_japan/c/01_w.jpg
        card: {type: timeline, title: 日本とブラジル, rows: [[6月, W杯ラウンド32 日本1-2ブラジル], [10月29日, ブラジルのメンバー発表], [11月14日, シンガポールで日本戦]], highlight_row: 0}
      - text: ただ今回、ブラジル国内のリーグでプレーする選手は、大きく減りそうです。
