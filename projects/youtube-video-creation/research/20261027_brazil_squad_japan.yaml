    tier: 報道
    telop: リーグ終盤のクラブが、招集を避けるよう求めている
    say:
      - text: ブラジルのリーグは終盤。選手が代表から戻るのは、第36節の2日前です。
        image: assets/images/20261027_brazil_squad_japan/a/01_w.jpg
      - text: 優勝、南米の大会リベルタドーレス杯の出場権、残留を争うクラブ。
        image: assets/images/20261027_brazil_squad_japan/a/01_w.jpg
        card: none
      - text: そうしたクラブが、招集を避けるよう求めていると報じられています。
        image: assets/images/20261027_brazil_squad_japan/a/01_w.jpg
        card: none
      - text: 9月と10月は、国内組が11人いました。
        image: assets/images/20261027_brazil_squad_japan/a/01_w.jpg
        card: {type: stats, title: ブラジル代表の国内組, items: [[11, 人, 9月・10月の国内組], [4, 人, 外れる見込みのフラメンゴ勢]], focus: 0}
      - text: 優勝を争うフラメンゴの4人は、最終メンバーに入らない見込みです。
        image: assets/images/20261027_brazil_squad_japan/a/01_w.jpg
        card: {type: table, title: 外れる見込みのフラメンゴの4人, columns: [所属, 名前, 位置, 年齢], rows: [[フラメンゴ, ペドロ, FW, 29], [フラメンゴ, サムエウ・リーノ, FW, 26], [フラメンゴ, パケタ, MF, 29], [フラメンゴ, エメルソン, DF, 27]]}
      - text: ヨーロッパでプレーする選手には、制限はありません。
        image: assets/images/20261027_brazil_squad_japan/b/01_w.jpg
        card: none
    official: false
    sources:
