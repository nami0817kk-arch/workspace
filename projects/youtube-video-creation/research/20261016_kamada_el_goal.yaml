# 日本人選手 の取材メモ（2026年10月16日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 取材: 2026-10-16。requests（ブラウザUA）で原文を読んだ。サッカーキング（試合記事）・ゲキサカ（鎌田のゴール記事・試合記事・試合記録）・フットボールチャンネル（試合記事）。
#   控えは research/raw/20261016_gekisaka_*.txt・20261016_kamada_sk.txt・20261016_nakamura_fc.txt・20261016_nfnl_9421.txt。
# 日付・場所: 現地10月15日、リヨン（グルパマ・スタジアム）、ELリーグフェーズ第2節。リヨン3-2クリスタル・パレス。3紙で一致。
# 得点: パレスの2点＝50分ピノ、81分鎌田。リヨン＝8分トリッソ、45+2分ヌアマ、76分シュルツ。
# 資料間のずれ:
#   ・鎌田の入った時間: ゲキサカの試合記事「後半18分」、ゲキサカの鎌田記事「後半17分」、サッカーキング「62分」→ 分は言わず「後半の途中から」。入ってからの分数も数えない。
#   ・鎌田のゴールの分: ゲキサカ「後半36分」＝81分、試合記録「81分」、FC「試合終盤」、サッカーキング「81分」→ 81分。
#   ・ゴールの描写: ゲキサカ「カライリの右サイドからの折り返しは相手に渡るが、相手のクリアミスを拾って押し込んだ」（試合記事ではニアサイドの混戦）、サッカーキング「ゴール前でルーズボールを拾い右足」、ABEMAの速報「ゴール前こぼれ球に反応して押し込み」→ 「右からの折り返しが相手のクリアミスになり、拾って右足で」と言う。
#   ・ゲキサカの鎌田記事・試合記事は11日のゴールを「プレミアリーグ初ゴール」と書く。昨季もパレスにいたので「初」が何を指すか確かめられなかった → 「初」は言わず、「11日のプレミア、ノッティンガム・フォレスト戦」（サッカーキング・ゲキサカ）とだけ言う。
#   ・ELの得点: ゲキサカ「フランクフルト時代にはELで11得点」。パレスでの1点を足して12点になるが、他クラブでのELの得点は未確認 → 「2つのクラブで合わせて12ゴール」と言う（自分で足した）。
# 本人の試合後の言葉: 当たった記事（ゲキサカ・サッカーキング・FC）のどれにも無かった → 入れない。
# 反応: NO FOOTY NO LIFE（海外の反応まとめ・10/16。クリスタル・パレスのサポーターのコメントの日本語訳）から3件。匿名。原文は未確認（まとめ側の訳）。切らずに全文。
#   当たった先: 上のまとめ1本のみ（X は個別URLが取れないので当たっていない）。
# 自分で数えた比べ: 11日→15日で4日に2ゴール。ELは2クラブ合わせて12ゴール（上記の注意つき）。パレスは1-3から2-3に。
# 次の試合: パレスは22日、敵地でベシクタシュ戦（サッカーキング）。
# 写真: 配信写真は Getty / Icon Sport。取り込まない。assets/images/20261016_kamada_el_goal/ は photopool と Commons で集めた。
