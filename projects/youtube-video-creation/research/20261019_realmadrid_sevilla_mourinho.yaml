# 取材メモ（2026年10月19日）レアル対セビージャ4-1と、モウリーニョ監督の「肘の話への執着が分からない」（ニュースのショート。見せ方 Y＝本人の一言から始める）
# 取材: 2026-10-19。
#   ・サッカーキング 2026-10-19「レアルがエル・クラシコへ弾みをつける4発快勝！」本文を読んだ（得点者と時間のみ。モウリーニョの肘の発言・ガルシア・プラサの主張は本文に無い）。
#   ・ESPN 2026-10-18 23:04Z「Mou doesn't understand 'obsession' with elbow from Madrid's Güler」（Alex Kirkland）。ESPN は WAF で開けないので、公開の記事API
#     （content.core.api.espn.com/v1/sports/news/50213726）で本文を全部読んだ。控え research/raw/20261019_mou_espn.txt。
#   ・ESPN 試合記録（site.api.espn.com summary?event=401882839。控え research/raw/20261019_rm_sevilla_summary.json）と試合レポート（news/50192148。PA 配信）。
# 【「肘」は何の話か】ESPN の本文: 前半、0-0 のとき、ギュレルがセビージャのジェラール“ペケ”フェルナンデスに肘を当てたとされる場面で、主審は動かなかった（no intervention）。
#   セビージャのガルシア・プラサ監督が「退場だった」と主張した。モウリーニョ監督は「その映像を1つも見ていない」と答えた。
#   → ギュレルが肘を当てたと確かめられているわけではない。台本は「されている場面」「と主張」「見ていないと答えた」で書き、事実として断定しない。
#   → モウリーニョの『執着』は、記者からその質問が繰り返されることへの言葉（"the obsession with asking about it"）。ギュレル本人を責める言葉ではない。
# 【モウリーニョの発言（ESPN の英語から訳）】原文のスペイン語は読めていない。ESPN の英訳からの日本語訳であることを控える。
#   "Nobody has been able to show me what they say happened." / "There aren't any images. I've asked for TV images, and for images from my staff who have the tactical camera,
#   and I haven't been able to see any image of what's being talked about, what annoyed Luis." / "…if someone gets a clear and objective image to me of something I haven't seen
#   -- and which my player says didn't happen -- I'll be there [to talk about it], but until then, nothing." / "Have any of you seen it clearly?" /
#   "That's why I don't understand the obsession with asking about it."
#   Y の冒頭の一言（hook_quote）＝ "Nobody has been able to show me what they say happened." の訳。
#   使わなかった: "Until Saturday"（何の期限か本文から分からない）、"if one day something happens that benefits us…"（別の話に広がる）、ベティス対バルサの手のあとのゴール取り消しの話（題の外）、
#   "I understand Luis, with a team that loses 4-1…"（ガルシア・プラサ監督を責める言い方に取られる）。
# 【ガルシア・プラサ監督の発言（ESPN の英訳）】"denied the chance to play another game, 11 against 10." / "Today we should have played with an extra man, from the 25th minute, 11 against 10."
#   "I saw it. Peque at halftime was saying 'he hit me.' It's a red card." / "Maybe we wouldn't have won, but we should have been playing 11 against 10, for 65 minutes."
# 【試合の事実】ESPN 試合記録: 2026-10-18、ラ・リーガ第9節、サンティアゴ・ベルナベウ。レアル4-1セビージャ。
#   30分ギュレル（左足、ESPN は curling strike）／37分エンバペ／63分エンバペ（PK）／80分ブエノ（セビージャ）／82分ディオマンデ。
#   サッカーキング本文の得点者・時間とも一致。ギュレルの30分は試合記録（ESPN）で確かめた（題材の一覧どおり）。
#   試合記録の前半23〜25分に「ペケ・フェルナンデスの負傷で試合が中断」とある。ただし原因は書かれていないので台本には入れない。
#   ESPN: エンバペのPKは Panenka。レアルは代表ウィーク明けから3連勝、ヴィニシウスは4試合の出場停止の最初の試合。次は水曜(21日)CLライプツィヒ、日曜(25日)カンプ・ノウでバルセロナ（クラシコ）。
# 自分で数えた比べ（見立て）: ESPN 試合記録の順位表（第9節終了）。バルセロナ9試合9勝・勝ち点27・得失点+30、アトレティコ22、レアル9試合7勝2敗・勝ち点21・得失点+14（3位）。
#   差は27-21＝6（ESPN 本文も「首位と6差」）。クラシコ25日：勝てば24対27で3差、引き分けなら22対28で6差のまま、負ければ21対30で9差（勝ち点だけの単純計算。他クラブの試合は数えない）。
# 本人の言葉: ギュレル本人の今回の言葉は ESPN 本文に無い（モウリーニョが「選手は起きなかったと言っている」と伝えているだけ）→ ギュレルの言葉は作らない。
# 反応: 0件。この件への実在の投稿は当たっていない。作らない。approve は --no-voices で。
# 前の本との重なり: 10/15 real_roma_cl・vinicius_ban、10/17〜18 モウリーニョ・ヴィニ。今回は試合結果と新しい発言のみ。ヴィニの出場停止の経緯・ローマ戦の中身は入れない。
# 写真: realmadrid.com（クラブ公式）の試合レポート（cronica-real-madrid-sevilla-18-10-2026）の写真。assets/images/20261019_realmadrid_sevilla_mourinho/。
#   01＝会見場のモウリーニョ（見出し帯の ND-RP-MOURINHO＝記者会見の写真。日付は未確認）、02＝ギュレルのゴール（小さく写る・本文のみ）、04＝エンバペ、05＝エンバペとディオマンデ、06＝ディオマンデ。
#   10/15・10/17〜18 とは別の写真（10/15 のレアル写真はローマ戦のもの）。03（エンバペ2点目の遠景）は縦切りで別の選手になったので外した。Commons のギュレル（441x515）は小さいので外した。
#   ギュレル本人が大きく写る写真は取れなかった（ゴールの写真は遠景）。
