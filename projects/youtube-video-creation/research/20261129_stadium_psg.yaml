# スタジアム紹介シリーズ：パリ・サンジェルマンの本拠地（パルク・デ・プランス、11/29 予定）。雛形は 11/25 バイエルンの回。
# 題材の選び方（2026-11-21）：大物のクラブで残っていた器。PSG のユニフォームは 11/25 に済み、11/29 のユニフォームはアヤックスなので同じ日に重ならない。
#   同日 11/29 の他シリーズ（選手紹介＝ロドリ、比べる＝クルトワとアリソン）とクラブが重ならない（research/20261127_picks.txt）。
# 選んだ理由：「欧州王者が、自分の本拠地を持たずに借りている」という強い一点／買い取りの話が 2026 年に動いている（市長交代→4月に交渉の許し→10月に長期の賃貸を外す→11月に7万席・15〜20億ユーロの案の報道）。
# 重なりの確認：scripts/*stadium_*・posted.json・covered.yaml・research/*picks.txt に無し（grep 済み）。
# 一次情報の突き合わせ：en・fr ウィキペディア（Parc des Princes）、パリ市の発表（2026-06-26 の見出し「La Ville de Paris et le PSG entament leurs discussions」。本文は未読）、
#   報道の要約（Le Monde 2026-04-14 の見出し「Grégoire mandaté par le Conseil de Paris」、Le Parisien 2026-10-06 と L'Équipe 2026-11-04 を引いた lestitisdupsg.fr の記事）。
#   開場 1897-07-18（自転車の競技場）／ツール・ド・フランスのゴール 1903〜1967（en・fr 一致）／1932 改築 4万（en）／1956 最初の欧州チャンピオンズカップ決勝（en・fr）／
#   1967-07-08 取り壊し開始・いまの器は 1972 年（設計ロジェ・タイユベール、en・fr）／周回道路が一部のスタンドの下を通る（fr）／PSG は 1974-07 から（en）・1998 年から唯一の使い手（en は 1997）／
#   2013-11-26 に 30 年の契約（fr は 2044 年まで、en は 2043 年まで→「30年」だけ言う）／2014〜16 の改修 7500 万ユーロは PSG が負担（fr）・席 4万8583（fr、2016-05-10 の発表）／
#   改修で器の収入が 2000万→1億ユーロ（en だけ→「とされます」）／2021 に買い取りと拡張を求める・タイユベールは 2013 年に 5万5000 までと見た（fr）／
#   市（イダルゴ市長）が拒む、2024-02 に PSG が新しい器の計画、2025 にマッシー・ポワシーを調べる（en・fr）／2026 春 グレゴワール市長、4月に議会が交渉を許す（en・fr・Le Monde）／
#   2026-10 長い賃貸の案は外れ、最大7万席（Le Parisien）／2026-11-04 拡張の案 15〜20億ユーロ・7万席（L'Équipe）／11/21 時点でパリ・マッシー・ポワシーのどれかは決まっていない（報道）。
#   PSG の最多入場 4万9575（1983、en）。
#   食い違い（台本に入れない）：席（en 4万7929・fr 4万8583→fr を使う）、契約の終わり（2043 か 2044）、PSG が唯一の使い手になった年（1997 か 1998）、1932 年の席（4万か別の数）。
#   確かめられなかった：パリ市・PSG の発表の本文（見出しのみ）、L'Équipe・Le Parisien の本文（転載の要約で読んだ）、売値（市長は「機密」と述べたと伝えられる）。
#   写真：Commons。場内の全景は CC BY 3.0、真上の写真は Licence Ouverte（パリの公開の航空写真）、1913 年はパブリックドメイン、ほかは CC BY-SA。観客は遠景で、顔が分かる人は写らない。
# 読みが割れる名前：パルク・デ・プランス／ロジェ・タイユベール／グレゴワール／イダルゴ／マッシー／ポワシー／ランス（スタッド・ド・ランス）。
