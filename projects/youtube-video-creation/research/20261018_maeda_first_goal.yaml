# 取材メモ（2026年10月18日）前田大然、プレミア初ゴール「夢が叶いました」（ニュースのショート。見せ方 Y＝本人の一言から始める）
# 取材: 2026-10-18。requests（ブラウザUA）で原文を読んだ。控えは research/raw/20261018_maeda_*。
#   ・サッカーキング 2026-10-18（題材の出典）「『夢が叶いました！』前田大然、プレミア初ゴールに万感…」— 本文を全部読んだ。控え research/raw/20261018_maeda_sk.txt・.html
#       本人の言葉は、前田が試合後に更新した自身の公式Xの投稿を、この記事が引いたもの。Xの元の投稿ページは読んでいない（記事経由。ブラウザの道具を使わない決まり）。
#   ・ゲキサカ 10/17 23:27・10/18 01:02（試合の描写。「プレミア7試合目の出場で初ゴール」）— 全文読んだ。
#   ・フットボールチャンネル 10/18 06:30（オニール監督の言葉。地元メディア TWTD の報道を引いたもの）・08:36（TWTD のサポーター採点）— 全文読んだ。
#   ・イプスウィッチ公式（itfc.co.uk）の試合レポートは JavaScript 描画で本文が読めなかった（写真も別の選手）。使っていない。
# 本人の言葉（SK の引用のまま。言い換えない）:
#   「プレミアリーグでの初ゴール。夢が叶いました！」「最高の瞬間でした！　このゴールは僕にとって本当に特別な意味があって、多くの方々のサポートがなけれな成し遂げられなかったことです。皆さん、応援ありがとうございます！」
#   ※「なけれな」は記事の誤植と思われる（元は「なければ」だろうが、Xの原文を読んでいないので確かめられない）。誤植を含む文は引用せず、
#     「特別な意味がある」「応援への感謝」は地の文で言い換えた（本人の言葉として引いたのは 夢が叶いました／最高の瞬間でした まで）。
#   冒頭に出す発言（short_hook_quote）: 「プレミアリーグでの初ゴール。」→ 続けて「夢が叶いました！」「最高の瞬間でした！」。題の言葉（シティ戦・初ゴール）と同じ「初ゴール」を含むが、題は「何と書いたのか」と問う形にしたので、重ならないようにした。
# 資料のずれ:
#   ・パスの出し手：フットボールチャンネル＝ウアタラ／ゲキサカ＝ワタラ。→ 台本は名前を言わない（「右サイドからのスルーパス」）。
#   ・シュートの形：FC＝GKのニアサイドを抜いた／ゲキサカ＝左足シュート／SK＝1対1を冷静に制した。→ 台本は「1対1を冷静に決めた」だけ。
#   ・マッチ番号：SK・ゲキサカ・FC＝プレミア第7節。前田は移籍後、この日が7試合目（ゲキサカ）。
#   ・シティ戦の得点：フォーデン19分・前田21分・ハーランド34分・ハーランド69分・（イプスウィッチ）90分（ゲキサカ）。台本は前田の21分と「先制された2分後」だけ言う（19→21 は FC・ゲキサカ・SK で一致）。
# 確度: 試合結果・前田の得点は 報道（ゲキサカ・SK・FC が一致。クラブ公式の本文は読めず確定には上げない）。前田本人の投稿は SK が引いた報道。
#   オニール監督の言葉と TWTD の採点は FC が TWTD を引いた報道（TWTD の原文は読んでいない。日本語は FC の訳をそのまま）。見立ては 背景。
# 数えた比べ（見立て）: TWTD のサポーター採点で前田7.2点（チーム最高）、2位ディオプ6.9・3位ウアタラ6.8 → 前田は2位より0.3点高い（自分で引いた）。
#   前半のボール保持率は シティが約80%（FC）→ イプスウィッチの攻撃は少なかった。dave.sport も前田に7点（チーム最高タイ）。
# 反応: サカラボの記事（10/17 23:32 立て、コメント35件）のうち、前田のゴールそのものへの声を2件。匿名。全文（改行は元のまま）。
#   ほかは代表の話・他の選手との比べ・シティへの悪口が多く、題の中身ではないので使っていない。2chの書き込み（>>2）はサカラボの記事本文にそのまま載っている。X は使っていない。
