  question: ラツィオは2025-26に、最終で1004万ユーロの赤字を出した。それなのに、純資産は約1億3040万ユーロ増えた。増えたお金は、どこから来たのか
  lead: 赤字なのに、純資産は約1億3000万ユーロの増え。現金は184万ユーロ。ラツィオ。
  opening_image: assets/images/20261122_finance_lazio/01_w.jpg
  takeaway: ラツィオの2025-26の決算案（2026年6月まで、報道による）は、最終の損益が1004万ユーロの赤字。それでも純資産はマイナス1680万からプラス1億1360万ユーロへ増えたが、理由は練習場の評価替え（約1億4040万ユーロ）で、現金は184万ユーロ、純借金は1億2640万ユーロ。評価替えを除くと純資産は約1000万減った。情報は11月12日時点。
  short_title: ラツィオ、赤字なのに純資産が1.3億増えた理由
