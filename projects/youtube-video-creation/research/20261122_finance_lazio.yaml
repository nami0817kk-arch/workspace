  say:
  - text: ラツィオの直近の決算は、2026年6月までの1年間のものです。
    image: assets/images/20261122_finance_lazio/01_w.jpg
    card: none
  - text: 2026年9月に、経営の評議会が、決算案を承認しました。
    image: assets/images/20261122_finance_lazio/01_w.jpg
    card: none
  - text: ここで読むのは、承認された決算案の数字です。
    image: assets/images/20261122_finance_lazio/02_w.jpg
    card: none
  - text: 売買を除いた収入は、1億3175万ユーロ。前の年から、約1174万の減りです。
    emph: true
    image: assets/images/20261122_finance_lazio/02_w.jpg
    card: none
  - text: ヨーロッパの大会の収入が減った影響が、挙げられています。
    image: assets/images/20261122_finance_lazio/03_w.jpg
    card: none
  - text: 放映権は、9450万から8850万ユーロへ。約6%の減りです。
