#   2026年夏の移籍は記事が数字（人数・額）を決算書から引いており、名前は記事の推定のため台本では人数と額だけ。
# ★日本との接点：無し（鎌田大地が記事に出ず、現所属も確かめていない。入れていない）。
# ★言わないこと：オーナーなど個人名・スポンサー契約の解除（賭けに関わる）・ファンの抗議の話・女子チーム。
