# 伊藤涼太郎が、9月半ばになっても決まらない（2026-09-18）
#
# **昨季ベルギー1部のベストイレブンで、2桁得点。それが無所属のまま。**
# 話の芯は「断り続けた結果、残ったのが古巣の誘いだけだった」というところ。
#
# 引きは**ブラックバーンでメディカルまで受けて、破談になった**こと（@main）。
#
# **本人の言葉が1つも無い。**当たった記事すべてに本人コメントが載っていない。
# 「伊藤は語った」という書き方はできない。喋るのは**モウブレイ監督とベルギー紙**だけ
#
# **「今後日本へ」は本人の言葉ではない。**ベルギー紙 VoetbalBelgie の見立てを
# Football Tribe が訳したもの。**サムネでも読み上げでも本人発言のように扱わない**
#
# **昨季のアシスト数が媒体で割れている**（5と7）。カップ戦を含むかどうかの差かも
# しれないが確かめていないので、**アシストの数字は出さない。**ゴールの10だけ使う
#
# **クラブ公式まで辿れたのは代表歴だけ**（JFA）。退団も破談も復帰打診も報道どまり
# **下地は本人の写真**（2026-09-18 ユーザー指摘「一瞬だけ背景が変わった」）。
# 写真は山場の節から出るので、それまでの節は下地が見えている。
# 既定は `stock/match_stadium.mp4` ＝**ヴォルフスブルクのスタジアム**で、
# LEDの看板にクラブ名が読める。既定も差し替えたが、この回は本人の写真を敷く
