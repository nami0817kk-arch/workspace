# ギャレス・ベイル（元ウェールズ代表FW、レアル・マドリード9シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-28 用。9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Gareth Bale の成績表・本文・Honours、2014/2016/2018/2022 UEFA Champions League final、2018 FIFA Club World Cup）と自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（家族・父の病気の話・ゴルフ・マルカとの言い合い・中国移籍の破談・ゴール後の振る舞いの騒ぎ・五輪代表の辞退の件は台本に出さない）。
# **重なりの確認（2026-11-21）**：scripts/・covered.yaml・posted.json・research/20261109〜20261127_picks.txt を「ベイル／Bale」で grep。主役の回は無し（20261016_record_transfer_fee に移籍金の1行が出るだけ）。同じ日（11/28）の別シリーズはユヴェントス・アモリム監督など（20261127_picks.txt）で重ならない。
# **引退の確認**：Wikipedia「On 9 January 2023 ... Bale announced his retirement from professional football」（出典 BBC Sport「Wales captain Bale retires from football aged 33」）→ 現役ではない（37歳）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：サウサンプトン 45試合5ゴール、トッテナム 203試合55ゴール＋期限付き移籍 2020-21 34試合16ゴール＝237試合71ゴール（自分で足した）、レアル・マドリード 258試合106ゴール、LAFC 13試合3ゴール。ウェールズ代表 111試合41ゴール（最多出場・最多得点）。サムネの表：レアル258/106＋トッテナム237/71＋ウェールズ代表111/41＝606試合218点（自分で足した値。サウサンプトン・LAFCは除く）。
# - レアルの欧州（すべてCL）：57試合16ゴール（成績表の Continental 列の合計）。CL決勝：2014（先発・110分に頭で勝ち越し、4-1）、2016（先発・ラモスの先制点をアシスト〔Bale本文〕、PK戦の3人目で成功）、2017（終盤に途中出場、4-1）、2018（61分にイスコと交代で出場、63分オーバーヘッド・83分の長いシュート、3-1、最優秀選手、途中出場で2点は初）、2022（ベンチ入り・出場なし〔2022決勝の出場表に subon なし〕）。→ 決勝に出た4試合で3ゴール（PK戦は数えない）＝1試合0.75点。決勝以外のCL：57−4＝53試合、16−3＝13ゴール＝0.245点。0.75÷0.245＝3.06→約3倍。
# - 2018-12-19 クラブW杯 準決勝（アブダビ、ザイード・スポーツシティ・スタジアム、観客30,554）鹿島アントラーズ1-3レアル。ベイル 44・53・55分、鹿島は土居 78分。クラブW杯でハットトリックは C・ロナウド、スアレスに次ぐ3人目。決勝はアル・アインに4-1、ベイルが大会最優秀選手（ゴールデンボール）。
# - 歩み：2006-04-17 サウサンプトンでデビュー（16歳275日）。2007-05-25 トッテナムへ（最初に500万ポンド）。2009-10からレドナップ監督のもとで左ウイングへ。2010-10-20 CLのインテル戦（サン・シーロ）でハットトリック（試合は3-4）。PFA年間最優秀選手 2010-11・2012-13。2013-09-01 レアルへ（当時の世界最高額。のちの流出文書で1億80万ユーロ）。2014 コパ・デル・レイ決勝でバルセロナから決勝点（残り5分、ピッチの外を回って走り抜けた）。2022-06 LAFCへ、2022 MLSカップ決勝 128分に頭で同点（MLS史上最も遅いゴール）、PK戦で優勝。2023-01-09 引退（33歳）。
# - ウェールズ：2006-05-27 デビュー 16歳315日で当時の最年少。ユーロ2016 準決勝（1958年W杯以来の大舞台）。2022 W杯出場（1958年以来）、アメリカ戦でPKを決め、1958年以来のW杯でのゴール。最後の試合は2022 W杯のイングランド戦。
# - マル秘話：2006 ウェールズ代表の最年少出場（当時）。2012-13 PFA年間最優秀選手・PFA若手最優秀・FWA年間最優秀の3冠は C・ロナウド（2007）と2人だけ。2016-03-20 セビージャ戦でラ・リーガ43点目、リネカーを抜いてイギリス人の最多得点。
# **本人の言葉**：取れていない（2022-06 W杯出場決定の言葉は本文にあるが、出典の取材元を確かめていないので置かない）。声の行は置かない。
# **入れなかったもの**：私生活・家族・父の病気・ゴルフ、移籍金の内訳、中国移籍の破談、マルカとの言い合い、ゴール後の振る舞いの騒ぎ、五輪代表の辞退、レアル終盤の出場の少なさの細部、2016クラブW杯（日本開催）はケガで出ていないので入れない。
# **読みで怪しいもの**：ギャレス・ベイル、カーディフ、サウサンプトン、トッテナム、レドナップ、サン・シーロ、ロス・アンジェレス（LAFC）、鹿島アントラーズ、土居、アブダビ、アル・アイン、キエフ（キーウ）、イスコ、マルセロ、カリウス、リバプール、アトレティコ、ラモス、リネカー、コパ・デル・レイ、ラ・リーガ。
