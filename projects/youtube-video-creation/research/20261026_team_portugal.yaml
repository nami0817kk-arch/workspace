    focus: 2016年
  say:
  - text: ポルトガルが、初めてワールドカップに出たのは1966年です。
    card: *id_histA
  - text: その大会で、いきなり3位。
    card:
      <<: *id_histA
      highlight_row: 0
  - text: 9点を決めて大会の得点王になったのが、エウゼビオでした。
    emph: true
    card:
      <<: *id_histA
      highlight_row: 0
  - text: 2004年は、自分の国で開いたヨーロッパ選手権。
    image: assets/images/20261026_team_portugal/p01_ronaldo_w.jpg
    card: none
  - text: 決勝でギリシャに0対1で敗れて、準優勝でした。
    card: none
  - text: 初めての大きなタイトルは、2016年のヨーロッパ選手権です。
    card:
      <<: *id_histA
      highlight_row: 2
  - text: 決勝はフランスと0対0のまま延長に入り、1対0で勝ちました。
    emph: true
    card:
      <<: *id_histA
      highlight_row: 2
  - text: そこからネーションズリーグを、2019年と2025年に2度制しました。
    card:
      <<: *id_histA
      highlight_row: 4
  - text: 2025年の決勝はスペインと2対2。PK戦を5対3で取っています。
    image: assets/images/20261026_team_portugal/p02_bruno_w.jpg
    card: none
  - text: そして2026年のワールドカップは、ベスト16で終わりました。
    card:
      <<: *id_histA
      highlight_row: 5
