# 代表チーム紹介 ポルトガル代表（10/26 作成。固定シリーズ9「代表チーム紹介」。見本は 10/25 のイングランド代表 scripts/20261025_team_england.md）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **軸（2026-10-26）**：「2026年W杯は16強（スペインに0対1、90+1分の失点）。監督がマルティネスからジェズスに替わり、秋のネーションズリーグは4戦4勝。何が変わったのか」。答えは見立ての節（直近3大会のW杯の1試合の得点と失点、W杯と秋の4試合の比べ、得点者の数）。
# **重なりの確認（2026-10-26）**：scripts/・research/covered.yaml・research/posted.json を grep。ポルトガル代表の「紹介」回（team_portugal）は無い。scripts/20261003_portugal_without.md（10/3 公開。ロナウド不在で4得点、得点者4人）と scripts/20261005_match_portugal_norway.md（10/5 公開。ノルウェー戦2対1）は試合の news で別題。ただし**秋の4試合の得点者が散った話は 10/3 の news と材料が重なる**（こちらは見立ての一部にとどめ、W杯3大会との比べを主にした）。covered.yaml の ronaldo_portugal_squad（9/20）・9/25・9/25・9/28 のロナウド／ジェズスの回も news。直近30日にポルトガル代表を主役にした紹介ものは無い（10/5 の coach_jesus は監督の経歴、10/17 の compare_pedri_vitinha は選手の比べ）。
# ---- 確かめたこと（2026-10-26。WebFetch の要約は使わず、requests で生の値を読んだ）----
#  ・FIFAランク：5位（2026-10-07 発表、2つ上げた）。FIFA 公式の記事（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain）の本文「Portugal (5th, up 2), who have leapfrogged both Brazil (6th, down 1) and Morocco (7th, also down 1)」「Portugal the sole climbers among top 10」。Wikipedia の Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）も Portugal 5・+2。点数は書かない。
#  ・W杯：出場9回（1966年が初）。最高は1966年の3位（Portugal at the FIFA World Cup の表。準決勝イングランドに1-2、3位決定戦ソ連に2-1）。エウゼビオが9得点で大会の得点王（1966 FIFA World Cup の記事本文）。
#  ・2026年W杯（Portugal national football team の試合一覧と ESPN の scoreboard を突き合わせた）：グループK 6/17 コンゴ民主共和国1-1（ジョアン・ネヴェス6分／ウィサ45+5分）／6/23 ウズベキスタン5-0（ロナウド6・39分、ヌーノ・メンデス17分、オウンゴール60分、レオン87分）／6/27 コロンビア0-0 → グループ2位（2026 FIFA World Cup Group K の本文「Portugal also advanced as group runners-up」）。ラウンド32 7/2 クロアチア2-1（ペリシッチ53分／ロナウド68分PK・ゴンサロ・ラモス90+4分）。ラウンド16 7/6 スペイン0-1（メリーノ90+1分）。＝5試合2勝2分1敗・8得点3失点（Portugal at the FIFA World Cup の 2026 の行と一致）。ロナウドは3点。
#  ・直近3大会のW杯（同じ表）：2018年 16強 4試合6得点6失点／2022年 8強 5試合12得点6失点／2026年 16強 5試合8得点3失点。自分で割った（検算した）：2018年 1.50・1.50／2022年 2.40・1.20／2026年 1.60・0.60。
#  ・EURO：優勝1回（2016年、決勝フランスに延長1-0。UEFA Euro 2016 final の infobox）。2004年は自国開催で準優勝（決勝ギリシャに0-1。UEFA Euro 2004 final）。ネーションズリーグ優勝2回：2019年（決勝オランダに1-0）・2025年（決勝スペインと2-2、PK戦5-3）。
#  ・監督：ジョルジェ・ジェズス。2026-07-10 に就任（Portugal national football team の本文、出典は FPF の発表「Jorge Jesus é o novo selecionador nacional」）。前任のロベルト・マルティネスはスペイン戦のあとに辞任（同）。
#  ・ロナウド：代表234試合・146得点はどちらも国の最多（infobox の Most caps・Top scorer）。2026年7月2日のクロアチア戦の得点が国の最年長得点（41歳。records の節）。**主将は板・語りに書かない**：infobox は Bruno Fernandes、名簿の印はロナウド＝captain／ベルナルド・シルヴァ＝vice、ブルーノ＝3rd で食い違う。さらに Cristiano Ronaldo の記事は 10/10 に FPF がロナウドを暫定の出場停止にしたと書く（処分の話は決まりで入れない）。
#  ・愛称：Seleção das Quinas（infobox）。キナスは国旗の盾の紋章。
#  ・名簿・年齢：Wikipedia の Current squad（9〜10月のネーションズリーグの名簿。caps と goals は 10/4 のノルウェー戦のあと）と各選手の記事の infobox。生年月日から 2026-10-26 時点で計算：ブルーノ・フェルナンデス 1994-09-08=32（マンチェスター・ユナイテッド、MF、97試合29得点）、ヴィティーニャ 2000-02-13=26（パリ・サンジェルマン、MF）、ジョアン・ネヴェス 2004-09-27=22（パリ・サンジェルマン、MF）、ヌーノ・メンデス 2002-06-19=24（パリ・サンジェルマン、DF）、ルベン・ディアス 1997-05-14=29（マンチェスター・シティ、DF、84試合）、ゴンサロ・ラモス 2001-06-20=25（ACミラン、FW。記事の currentclub で確認）。
#  ・W杯のあと（試合一覧と ESPN の scoreboard で日付・スコア・得点者を確認）：ネーションズリーグ 9/24 ウェールズ1-0（フェリックス22分）／9/27 ノルウェー2-1（敵地。フェリックス17分・ラモス54分／ハーランド51分）／10/1 デンマーク4-2（敵地。カンセロ13分・ラモス25分・ヴィティーニャ67分・フェリックス87分）／10/4 ノルウェー2-1（カンセロ38分・ラモス79分／アイエル36分）＝4戦4勝・9得点4失点。得点者：フェリックス3・ラモス3・カンセロ2・ヴィティーニャ1。ロナウドの得点は0（ESPN の名簿でロナウドは 9/24 先発・9/27 ベンチ・10/1 と 10/4 は名簿に無し）。次は 11/14 デンマーク（ホーム）、11/17 ウェールズ（敵地）。FIFA の記事は「ポルトガル・スペイン・スイスの3つがネーションズリーグを4連勝で始めた」と書く（「最初の4試合を全勝したのはポルトガルだけ」という Wikipedia の文は FIFA と食い違うので使わない）。
#  ・自分で割った数：秋の4試合 9÷4=2.25・4÷4=1.00。W杯2026 8÷5=1.60・3÷5=0.60。
#  ・日本との対戦：**国際Aマッチは0試合**。Japan national football team records and statistics の Head-to-head（updated 5 October 2026）に POR の行が無い。Portugal national football team records and statistics の Head-to-head（as of 4 October 2026）に Japan の行が無い。Japan national football team results の 1980–1989・1990–1999・2000–2009・2010–2019・2020–present の生の表にも Portugal の試合は無い（2020–present の Portugal は主審の国籍の1か所だけ）。JFA の通算表は見ていない。
#  ・日本との縁（サッカーだけ）：ゴンサロ・ゲデスは 2026年W杯のポルトガルの選手（記事のカテゴリ「2026 FIFA World Cup players」と Portugal squad 2026 FIFA World Cup のひな形）で、2025年からレアル・ソシエダ（infobox）。久保建英もレアル・ソシエダ（config/japan_abroad.yaml）。
# ---- 言わないもの ----
#  ・ロナウドとジェズス監督の対立・ロナウドの離脱と暫定の出場停止（処分）／主将の名前（食い違い）／背番号／私生活／怪我（コンセイソンの退場を含む）／監督の契約／戦術の説明／「4連勝で始めたのはポルトガルだけ」。
