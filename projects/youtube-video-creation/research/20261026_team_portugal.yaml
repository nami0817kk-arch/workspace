- id: data
  heading: ポルトガル代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: ポルトガル代表の基礎DATA
  narrator: 解説
  say:
  - text: フィファランクは**5位**。10月の発表で、トップ10の中で順位を上げたのはポルトガルだけでした。
    image: assets/stats/tb_portugal_data0.png
    no_telop: true
  - text: ワールドカップの最高成績は、初出場だった1966年の3位。
    image: assets/stats/tb_portugal_data1.png
    no_telop: true
  - text: ヨーロッパ選手権は、2016年に優勝しています。
    image: assets/stats/tb_portugal_data3.png
    no_telop: true
  - text: 監督は、ジョルジェ・ジェズス。2026年7月に就任しました。
    image: assets/stats/tb_portugal_data4.png
    no_telop: true
  - text: 代表の出場と得点の最多は、クリスティアーノ・ロナウド。234試合で146得点です。
    image: assets/stats/tb_portugal_data5.png
    no_telop: true
