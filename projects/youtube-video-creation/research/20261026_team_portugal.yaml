    image: assets/images/20261026_team_portugal/p02_bruno_w.jpg
    card:
      <<: *id_pl
      highlight_row: 0
  - text: 代表で97試合に出て29得点。中盤から点も取る選手です。
    card: none
  - text: 中盤は、パリ・サンジェルマンの3人が支えます。
