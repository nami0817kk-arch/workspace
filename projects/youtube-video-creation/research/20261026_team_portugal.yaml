  - text: 9月27日は、敵地でノルウェーに2対1の勝ち。
    card:
      <<: *id_nw
      highlight_row: 1
  - text: 10月1日は、敵地でデンマークに4対2の勝ち。
    emph: true
    image: assets/images/20261026_team_portugal/p02_bruno_w.jpg
    card: none
  - text: 10月4日は、ノルウェーにもう一度2対1で勝ちました。
    card:
      <<: *id_nw
      highlight_row: 3
  - text: 4試合で9得点、4失点。
    card: *id_nw
