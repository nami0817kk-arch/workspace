  - text: 秋のネーションズリーグで、ポルトガルはここまで4戦4勝です。
    card: *id_nw
  - text: ネーションズリーグは、ヨーロッパの代表チームが組に分かれて戦う公式戦です。
    card: *id_nw
  - text: 9月24日は、ウェールズに1対0の勝ち。
