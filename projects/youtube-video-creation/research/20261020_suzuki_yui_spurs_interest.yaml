# 取材メモ（2026年10月20日）鈴木唯人にトッテナムが関心か。移籍金4,000万〜4,500万ユーロを求める報道（ニュースのショート。見せ方 B）
# 取材: 2026-10-20。requests（ブラウザUA）で本文を全部読んだ。
#   ・フットボールトライブ・ジャパン（10/19 17:40、題材の出典）… 全文。控え research/raw/20261020_tribe_suzuki.txt・.html。CaughtOffside を引用した転載1本。
#   ・CaughtOffside（英、10/18 14:00）… 原文を全部読んだ。控え research/raw/20261020_co_1018.txt。「ドイツのメディア『Fussball News』によると」と書く（そちらの原文は読めていない）。
#   ・CaughtOffside（英、9/5）… 同じ媒体の前の記事。控え research/raw/20261020_co_0905.txt。元は「FussballDaten」と書く。
#   ※ 元はドイツのメディアの報道が2回、CaughtOffside が英語にし、フットボールトライブが日本語にした形。ドイツ側の原文は読めていないので、台本では媒体名を出さず「ドイツのメディア」にとどめる。
# 確度: 報道（弱い）。トッテナム・フライブルク・ミラン・ソシエダのどのクラブからも発表・コメントは記事に無い。確定とは言わない。
#   「関心か」「報じた」「という」で断る。「移籍する」「交渉している」とは言わない。
# 出典の中身（そのまま）:
#   ・フットボールトライブ：トッテナムが鈴木の獲得に関心を示しているようだ。2027年1月の移籍市場を前に複数の欧州クラブが検討しているようだ。
#     CaughtOffside は、トッテナムが鈴木の獲得を狙っており、フライブルクが移籍金として4,000万〜4,500万ユーロ（約71億〜80億円）を求めている、と報じた。
#     ミランも意欲、レアル・ソシエダも動向を注視。関心を寄せるクラブのスカウトが今2026/27シーズンの鈴木を実際に視察したと報じられている。
#     「鈴木は攻撃的ミッドフィールダーやセカンドストライカーとしてプレーできるほか、左右両サイドのウイングも務められる。この汎用性は、トッテナムにとって魅力的な要素だ」（CaughtOffside の言葉。記事の意見）
#   ・CaughtOffside 10/18：24歳。ブレンビー（ブレンビー＝デンマーク）からフライブルクへ。契約に解除条項は無いと報じられている。
#     トッテナムとミランは約3,500万ユーロ（成果報酬を含む）の提示を検討と報じられるが、フライブルクの求める額には届かない。
#   ・CaughtOffside 9/5：トッテナムが関心のクラブの1つ。「交渉を始めるには約3,500万〜4,000万ユーロが必要」。ミランとソシエダも注視。
# 自分で数えた比べ（見立て）:
#   ・金額：9/5「交渉を始めるには35〜40」→ 10/18「フライブルクが求めるのは40〜45」。下限・上限とも500万ユーロ上がっている。ただし書き方が違う（交渉開始の目安／クラブの評価額）ので「数字の上では」と断る。
#   ・約3,500万ユーロの提示と、求める4,000万〜4,500万ユーロの差は、500万〜1,000万ユーロ（4,000−3,500＝500、4,500−3,500＝1,000）。円には換算しない（記事の換算「約71億〜80億円」は記事のまま「記事は〜と書く」と言う）。
#   ・関心が報じられたクラブは3つ（トッテナム・ミラン・ソシエダ）。「関心」「意欲」「動向を注視」と、記事は段階を分けて書く。
# 本人の言葉: 無し（どの記事にも鈴木の発言なし）。作らない。トッテナム・フライブルクの発表も無し。
# 反応: 当たっていない（作らない）。approve は --no-voices で。
# 写真: Commons に4枚（鈴木唯人のカテゴリにある全部）。ストラスブール時代（2023年4月、Hugob67 CC BY-SA 4.0）の2枚、日本代表（2025年9月、Keiteay CC BY 4.0）の1枚、ブレンビー時代の3point.dk CC BY 3.0（895x915で引き伸ばすと粗いので使わない）。
#   使えるのは3枚の元写真から8枚の縦切り出し（short_photo_fx --mode B）。**今のフライブルクの姿・トッテナムの姿の写真は無い**（前のクラブ・代表の姿）。台本は写真と食い違う「フライブルクの姿」と言わない。
#   10/17 の三笘と同じ B の形。写真は前日までと重ならない。
