# 取材メモ（10/6 題材 nakamura_assist、型は quote）。材料の控え: research/raw/20261006_nakamura_assist.md
# 主役は、キリンカップ決勝（10/5 19:34 国立、日本 2-1 ニュージーランド）で64分から入り、71分に堂安律の決勝点をアシストした中村敬斗と、試合後の言葉。
# 昨日の回「堂安律、325日ぶりの代表弾でキリン杯V」（20261005_kirin_final_doan）と重ねない:
#   堂安の言葉は使わない。決勝点の場面は中村の側から短く。「15年ぶり」「2年半ぶりの4バック」「11月のシンガポール」「4連勝」は言わない。
# 上田の回（20261005_ueda_4goals）と重ねない: 後半30分の上田へのパス（オフサイド）は入れない。
# 同時に作る「久保のトップ下」と重ねない: 久保の話は入れない。
# 事実の裏:
#   決勝の出場・アシスト: JFA マッチレポート m04.pdf（#13 中村 64分 IN、71分 #10 堂安 アシスト #13）。ゲキサカ地の文の「後半36分」は誤記とみて JFA の71分（後半26分）を採った。
#   オーストラリア戦: JFA マッチレポート（2024/10/15 埼玉、W杯アジア最終予選、1-1。58分 日本のオウンゴール、中村 70分 IN、76分 オーストラリアのオウンゴール。中村が左で縦に運んで折り返し）。位置はゲキサカ地の文「左ウイングバック」。
#   9月からの4試合の出場: JFA マッチレポート 3本＋m04。83＋19＋79＋26＝207分（追加時間を除く）。9/24 の先制点の起点はスポニチ「中村敬斗が先制演出」と JFA の得点経過。
#   代表の年ごとの得点: 日本語版 Wikipedia の代表個人成績（33試合11得点）。2026年のアシスト4は JFA（イングランド戦レポート・m04）、サッカーキング（チュニジア戦）、スポニチ（ウルグアイ戦）で1本ずつ裏を取った。
#   リヨン: FotMob 887704（9/12 パリFC 15分、9/16 アンデルレヒト 90分1点、9/19 レンヌ 11分）。昨季フランス2部29試合14点。次は 10/9 18:45 UTC アウェーのランス戦（日本時間 10/10 3:45）。
# 反応: Yahoo!ニュース（サッカーマガジンWeb・ゲキサカの記事）のコメント欄から個人の投稿を頭から終わりまで3件。海外の声は X を requests で読めず入れていない。
# 写真: 02 サッカーマガジン（高原由佳）、03 日刊スポーツ（宮地輝）、05 スポニチ（小海途良幹）、01 ゲキサカ（©Koki NAGAHAMA/GEKISAKA）。代理店ではない。
