# 代表チーム紹介 フランス代表（10/24 作成。固定シリーズ9「代表チーム紹介」。見本は 10/23 のアルゼンチン代表）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **軸（2026-10-23）**：「2026年W杯でフランスは8試合20得点。それでも4位。どの試合で流れが変わったのか」。10/3 のフランス対イタリア（scripts/20261003_france_italy.md）・10/6 のフランス対ベルギー（20261006_match_france_belgium.md）は試合のニュースで別題。9/11・9/19 のジダン就任の回（covered.yaml の zidane_france・zidane_first_squad）は監督のニュースで別題（紹介ものではない）。
# **重なりの確認（2026-10-23）**：scripts/・research/covered.yaml・research/posted.json を grep。フランス代表の「紹介」回（team_france）は無い。直近30日に重なる紹介ものは無い（エムバペ・オリーズ・デンベレの選手紹介は10/24 の player 系の別担当。看板選手の表に名前が並ぶだけ）。
# ---- 確かめたこと（2026-10-23。WebFetch の要約は使わず requests で生の値を読んだ。検索のAI要約は根拠にしていない）----
#  ・FIFAランク：FIFA 公式（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain、2026-10-07）の本文「France still occupy the final place on the podium」＝3位（1位スペイン・2位アルゼンチン）。点数は書かない。
#  ・日本との対戦：日本代表の試合記録（Wikipedia en の Japan national football team results 1990–1999・2000–2009・2010–2019・2020–present の生の表を FRA で拾った）。1994-05-29 東京 キリンカップ 1-4／2000-06-04 カサブランカ ハッサン2世杯 2-2（PK 2-4）／2001-03-24 サン・ドニ 親善 0-5／2001-06-10 横浜 コンフェデ杯（決勝）0-1／2003-06-20 サン・テティエンヌ コンフェデ杯 1-2／2012-10-12 サン・ドニ 親善 1-0。＝6試合1勝1分4敗・5得点14失点（検算した。2000年のPK戦は引き分け扱い）。2010–2019 の表に FRA は2012年の1行だけ、2020–present（2026-09-24 更新）の表に FRA は無い。2012-10-12 のスコアは JFA（https://www.jfa.jp/samuraiblue/schedule_result/2012.html）の「○1-0 フランス スタッド・ド・フランス」でも確認した。1994・2000・2001・2003 年は JFA の年別ページが 404 で取れず、Wikipedia の表だけ（**JFA の通算対戦成績は取れていない**ので「1990年以降の記録で6試合」と言い、通算とは言わない）。補助：2001年のコンフェデ杯決勝は Wikipedia 2001 FIFA Confederations Cup の「Final」（日本0-1フランス、ヴィエラ30分、会場 横浜）、2003年は 2003 FIFA Confederations Cup（フランス2-1日本、ピレ43分PK・グヴ65分／中村59分）、2000年は 2000 King Hassan II International Cup Tournament（準決勝 2-2、日本の得点は森島34分・西澤70分、PK 日本2-4）。2012年の日本の得点者は確かめられていないので言わない。
#  ・W杯の成績（Wikipedia en の France at the FIFA World Cup の生の表）：優勝 1998（決勝ブラジル3-0、得点ジダン2・プティ）・2018（クロアチア4-2）、準優勝 2006（イタリア1-1、延長、PK 3-5）・2022（アルゼンチン3-3、延長、PK 2-4、得点はエムバペ3）。決勝は4回。3位 1958・1986、4位 1982・2026。準決勝で敗れた大会：1958（ブラジル2-5、3位決定戦は西ドイツに6-3）・1982（西ドイツ3-3延長、PK 4-5、3位決定戦はポーランドに2-3）・1986（西ドイツ0-2、3位決定戦はベルギーに4-2延長）・2026（スペイン0-2、3位決定戦はイングランドに4-6）。
#  ・2026年W杯（France at the FIFA World Cup の試合一覧、ESPN の scoreboard API で日付とスコアを突き合わせた）：6/16 セネガル3-1、6/22 イラク3-0、6/26 ノルウェー4-1、6/30 ラウンド32 スウェーデン3-0、7/4 ラウンド16 パラグアイ1-0、7/9 準々決勝 モロッコ2-0、7/14 準決勝 スペイン0-2（オヤルサバルPK22分・ポロ58分、アーリントン）、7/18 3位決定戦 イングランド4-6（マイアミ・ガーデンズ。エムバペ48・66分、バルコラ54分、デンベレ90+6分／ライス3分・コンサ18分・サカ37・45+1・87分PK・ベリンガム90+8分）＝8試合6勝2敗・20得点10失点。最初の6試合＝16得点2失点（セネガル1・ノルウェー1失点）、最後の2試合＝4得点8失点。無得点の試合は準決勝の1試合だけ。3位決定戦はW杯でフランスが初めて6失点した試合（Wikipedia 2026 FIFA World Cup knockout stage の記述）。エムバペは10得点で大会の得点王（Wikipedia 2026 FIFA World Cup の Awards：10 goals, 4 assists）、W杯通算22得点はフランスの最多（France at the FIFA World Cup の Top goalscorers、2位はフォンテーヌ13）。デンベレは大会6得点（同）。バルコラは3得点（セネガル戦・スウェーデン戦・イングランド戦の得点者の表から数えた）。
#  ・自分で割った数（検算した）：1試合あたり 1998年 得点15÷7=2.14・失点2÷7=0.29／2018年 14÷7=2.00・6÷7=0.86／2022年 16÷7=2.29・8÷7=1.14／2026年 20÷8=2.50・10÷8=1.25。2026年の前6試合 得点16÷6=2.67・失点2÷6=0.33、後2試合 得点4÷2=2.0・失点8÷2=4.0。（W杯の得点・失点は延長を含み、PK戦を除く。）
#  ・監督：ジダンは2026-07-28 に就任を発表（Wikipedia Zinedine Zidane の「named as coach on 28 July 2026」。出典 FFF・BBC）。契約の開始日は Wikipedia 内で 9/1 と 8/1 が食い違うので言わない。初戦は 9/25 トルコ戦（Kocaeli）。前任デシャンは2012–2026（Wikipedia France national football team の監督表）。1998年の決勝のジダンの2点は上の W杯の表。
#  ・W杯のあと（Wikipedia France national football team results 2020–present、ESPN の scoreboard API で日付とスコアを確認）：ネーションズリーグ 9/25 トルコ1-0（エムバペ54分）、9/28 ベルギー1-0（オリーズ88分）、10/2 イタリア1-1（オリーズ55分／バストーニ68分）、10/5 ベルギー4-1（ドゥエ77分・シェルキ81分・オリーズ88・90+1分）＝4試合3勝1分・7得点2失点（ジダンの記録 Wikipedia Zinedine Zidane の managerial statistics と一致）。オリーズの4点＝28日1・2日1・5日2。次は 11/12 イタリア対フランス（ミラノ。ESPN の scoreboard に 2026-11-12 19:45Z France at Italy）。
#  ・主将：エムバペ（Wikipedia France national football team の名簿・infobox）。所属 レアル・マドリード。愛称 Les Bleus（意味は「青」）。EURO 優勝 1984・2000（infobox）。
#  ・名簿・年齢：Wikipedia の代表名簿（2026-10-05 時点）。生年月日から2026-10-23 時点で計算（エムバペ 1998-12-20=27、デンベレ 1997-05-15=29、オリーズ 2001-12-12=24、チュアメニ 2000-01-27=26、サリバ 2001-03-24=25、メニャン 1995-07-03=31）。所属も同名簿（エムバペ・チュアメニ＝レアル・マドリード、デンベレ＝パリ・サンジェルマン、オリーズ＝バイエルン、サリバ＝アーセナル、メニャン＝ミラン）。
# ---- 言わないもの ----
#  ・背番号／私生活／怪我（エムバペの招集辞退を含む）／監督の契約／戦術の説明／日本戦の通算（JFA 未確認）／2012年の日本の得点者／パラグアイ戦後の騒動／選手を小さく見せる言い方。
