# 出典で確かめたこと:
#   ・10日、シンガポール遠征中の日本代表が練習。佐野（マインツ）が練習後に取材に答えた（ゲキサカ）。14日のブラジル戦は、北中米W杯ラウンド32の1-2の惜敗から4か月半後のリターンマッチ（ゲキサカ）。
#   ・W杯の試合（ESPN の試合データ site.api.espn.com fifa.world summary event=760487。キックオフ 2026-06-29 17:00 UTC、NRG スタジアム）:
#       ブラジル 2-1 日本。29分 佐野海舟（日本。エリアの外から右足でゴール左下。カウンターから）／56分 カゼミーロ（ブラジル。ヘディング。ガブリエウ・マガリャンイスのクロス）／90+5分 ガブリエウ・マルティネッリ（ブラジル。右足。ブルーノ・ギマランイスのアシスト）。
#       佐野は先発・枠内シュート1・1得点。
#   ・ゲキサカ: 佐野は「自らのボール奪取からミドルシュートを叩き込み、A代表初ゴールとなる先制点」。1-0で折り返した後半に押し込まれ続けた展開にチームとして悔いが残る。
#   ・ゲキサカの地の文: W杯のブラジル戦の翌日、佐野は後学のために試合映像を90分間通して見返したと話していたが、それ以降はゴールシーンさえも見ることは「ないですね」とのこと。
#   ・佐野の言葉（原文。ゲキサカ。字は変えていない。台本は句点・読点で行に分けた。両記事の言葉はどちらも同じ）:
#       「そのゴールで知ってくれるのは嬉しい。でも自分はあの試合に負けたことしか頭にないので……」（「……」は話の語尾が消えた形で、記事のとおり。台本は語尾をそのまま「ので」で止めて読む）
#       「あまり関係ないというわけではないけど、自分の中では今できることをしっかりやっている。あれは過去のことなので、しっかりと今にフォーカスしてやり続けていきたい」
#       「全員が勝利に向かってやっていて、その中で自分が得点を決めただけだと思っているので、そこはあまり気にせず、次の試合もいつも以上のベストのプレーをできるようにやっていきたいなと思います」
#       「前回(9月・10月)のシリーズから守備のところで(前から行く)チャレンジはしてきた。全部が全部それというわけではないけど、ああいう時に前から守備に行けるだとか、ボールを奪った後に自分たちのボールを持つ時間を増やすというのはやっていければ」
#         （括弧は記者の補足。台本は「ああいう時に…」の所だけ引く）
#   ・アジア杯の延期に触れた言葉（「代表でやる試合の重みは変わらない」）は、堂安の回（20261111_doan_asiacup_words）と重なるので使わない。
