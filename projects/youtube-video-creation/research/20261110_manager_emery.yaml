  telop: 戦術の色。2023年12月、前から奪いにいったヴィラ
  narrator: 解説
  card: &style_doc
    type: document
    label: 2023年12月6日 アストン・ヴィラ対マンチェスター・シティ
    paragraphs:
    - シュートはヴィラ22本、シティ2本。
    - 相手の陣地でボールを奪い返したのは13回。
    - 74分、ベイリーのゴールで1対0。
    - 4日後にはアーセナルにも1対0。
    highlight:
    - 22本
    - 13回
  say:
  - text: 戦い方の色がよく出たのが、2023年12月6日のマンチェスター・シティ戦です。
    image: assets/images/20261110_manager_emery/05_w.jpg
    card: *style_doc
  - text: 相手は、前の季に3冠を取ったチームでした。
    card: *style_doc
  - text: エメリのヴィラは前から奪いにいき、相手の陣地で13回、ボールを奪い返します。
    card: *style_doc
  - text: グアルディオラのシティを相手に、リーグ戦でいちばん多い回数でした。
    card: none
  - text: シュートは22本。シティには2本しか打たせていません。
    image: assets/images/20261110_manager_emery_b/03_w.jpg
    emph: true
    callword: 22対2
    card: none
  - text: 74分、ベイリーのゴールで1対0の勝ちです。
    card: none
  - text: 4日後には、アーセナルにも1対0で勝ちます。
    card: none
  - text: ホームのリーグ戦は15連勝。クラブの記録になりました。
    card: none
  - text: もう1つの色が、守りの最後の列を前に押し上げる、高いライン。
    image: assets/images/20261110_manager_emery_b/02_w.jpg
    card: none
  - text: 相手をオフサイドにした回数は、2026年1月の時点で、
    card: none
  - text: 3季続けてプレミアでいちばん多くなっています。
    card: none
  - text: やみくもに追いかけず、ボールを持たない時間もチームで相手を止めるやり方です。
    card: none
  sources:
