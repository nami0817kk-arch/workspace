# 監督紹介：ウナイ・エメリ（11/10 火、シリーズ「監督紹介」、key: manager_emery、型は news）。9節の型（2026-10-20 決定）。見本は 20261108_manager_conte。
# 順：フック→基礎DATA→日本との接点（久保建英・鈴木彩艶）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-06）**：既出13人（グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ベンゲル・ファーガソン・トゥヘル・ルイス・エンリケ・スロット・コンテ）以外の大物。
#   ・シャビ・アロンソ（チェルシー監督。英語版 Wikipedia 冒頭で確認）は大物だが、10/23 のレバークーゼンのクラブ紹介で無敗優勝の話を出しており、10/24 にチェルシーのニュースのショート（退場ゼロ）もある。中身の柱が重なる。日本との接点も無い。外した。
#   ・ジダンは 10/03 の「監督の経歴」と 10/18 のレジェンドで出ている（直近30日）。外した。
#   ・ポチェッティーノ（アメリカ代表監督）・インザーギ（アル・ヒラル）・ナーゲルスマン（ドイツ代表を離れた「most recently」）は、今季の欧州7リーグの監督ではないか、立場が動いている。後ろに回した。
#   ・エメリ：ヨーロッパリーグ5回優勝で歴代1位（英語版 Wikipedia 冒頭・ギネス世界記録の頁を出典に）。2026年5月にヴィラで5回目。日本との接点が2つ（ビジャレアルの久保建英、ヴィラの鈴木彩艶）。
#   **重なりの確認（2026-11-06 に自分で）**：research/posted.json の build 名に emery は0件。research/covered.yaml は 09-19 のニュース（エメリがデ・ゼルビについて）だけ。
#   scripts/ は 10/24 鈴木彩艶のヴィラ対シティのショート、11/04 鈴木彩艶のCLバルサ戦のショート（題に「エメリ監督」）に名前が出る。どちらもニュースのショートで、監督エメリを主役にした本は無い。
#   ヴィラは 10/20 財政・10/24 ユニフォーム・10/11 スタジアムで出ているが、クラブの話で、監督の経歴は扱っていない。
#   同じ 11/10 の他の担当（research/20261109_picks.txt）：レジェンド世界＝ブッフォン。重ならない。
#
# **いまの立場**：アストン・ヴィラ監督（2022年11月1日から）。
#   ○ 英語版 Wikipedia「Unai Emery」（2026-11-06 版。Managerial statistics は「updated match played 3 November 2026」）：「is the manager of Premier League club Aston Villa」。
#   ○ 英語版「2026–27 Aston Villa F.C. season」：infobox の manager、Overall record（u=3 November 2026）。プレミア 3勝3分3敗（10位）、CL リーグフェーズ 3勝1敗、UEFAスーパーカップ 1-2 で準優勝（8月12日、PSG）。
#   契約は2029年まで（英語版：2024-05-27 に延長）。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial record by team and tenure」（updated match played 3 November 2026）：
#   ロルカ 70試合34勝／アルメリア 84試合39勝／バレンシア 220試合107勝58分55敗／スパルタク・モスクワ 26試合12勝／セビージャ 205試合106勝43分56敗／パリSG 114試合87勝15分12敗／アーセナル 78試合43勝16分19敗／ビジャレアル 129試合64勝35分30敗／アストン・ヴィラ 212試合116勝37分59敗。Total 1138試合608勝244分286敗。
#   自分で足して一致（70+84+220+26+205+114+78+129+212＝1138、34+39+107+12+106+87+43+64+116＝608）。下部組織は無い（9チームともトップチーム）。
#   勝率（自分で割った）：通算 53.4%、パリSG 76.3%、アーセナル 55.1%、ヴィラ 54.7%、セビージャ 51.7%、ビジャレアル 49.6%、バレンシア 48.6%。
#   ※スパルタクとパリSGの行に「Failed verification」（就任日の出典の札）。数字は表のまま。確度は 報道。
#
# **ヨーロッパリーグの決勝（自分で数えた。英語版 Honours と本文）**：2014 セビージャ優勝（ベンフィカにPK）／2015 セビージャ優勝（ドニプロ）／2016 セビージャ優勝（リヴァプールに3-1、前半0-1）／2019 アーセナル準優勝（チェルシーに1-4）／2021 ビジャレアル優勝（マンU に1-1、PK 11-10）／2026 ヴィラ優勝（フライブルクに3-0）＝6回で5回優勝。
#   CL は、2022年のビジャレアルの準決勝（ユヴェントス・バイエルンを破り、リヴァプールに敗退）がいちばん上。ほかはバレンシア16強、パリSG 16強2回、ヴィラ 2025年の準々決勝（PSG に合計4-5）。
#   2026年の決勝（英語版「2026 UEFA Europa League final」）：5月20日、イスタンブール、ティーレマンス41分・ブエンディア45+3分・ロジャーズ58分で3-0。ヴィラは1982年のヨーロピアン・カップ以来のヨーロッパのタイトル（44年ぶり）、1996年のリーグ杯以来のタイトル。
#
# **基礎**：1971-11-03 スペイン・バスク地方ギプスコア県オンダリビア生まれ（2026-11-06 時点で55歳）。選手：左の中盤。レアル・ソシエダの下部組織、1部は5試合。主に2部で7季215試合9得点、32歳でロルカで引退。
# **歩みの細部**（英語版本文）：
#   2004-05 ロルカ（3部＝セグンダB）で、けがの間に会長から監督を頼まれ、その季にクラブ史上初の2部昇格。
#   2006 アルメリア（2部）、2007 にクラブ初の1部昇格、2007-08 は8位。
#   2008-12 バレンシア：6位→3位→3位→3位。
#   2012 スパルタク・モスクワ（11月に解任）。台本では触れない。
#   2013-01 セビージャ（途中就任）。2014・2015・2016 ヨーロッパリーグ3連覇。
#   2016 パリSG：2017-18 に国内4冠（リーグ・アン、フランス杯、リーグ杯、スーパー杯）。
#   2018 アーセナル：公式戦22試合負けなし、2019 EL 決勝でチェルシーに敗れ準優勝、2019-11 解任。台本では「アーセナルを経て」「アーセナルのあと」とだけ言う。
#   2020-07 ビジャレアル：2021 EL 優勝（クラブ初の大きなタイトル＝スカイスポーツ 2026-01 の記事の地の文）、2022 CL 準決勝。
#   2022-10 ヴィラ（11月1日から）：就任時16位、降格圏と勝ち点1差。2022-23 7位、2023-24 4位（CL 出場権）、2024-25 6位・CL 準々決勝、2025-26 4位・EL 優勝。2026-03-19 リール戦でヴィラ100勝目（クラブで3人目）。
#   プレミアの月間最優秀監督：2023年4月・2023年12月・2025年12月の3回。
#
# **戦術の色**＝2023年12月6日 ヴィラ 1-0 マンチェスター・シティ（英語版「2023–24 Aston Villa F.C. season」の試合記録：ベイリー74分）。
#   ガーディアンの試合記事（requests で本文を読んだ）：「Villa had 22 shots to City's two, seven of which were on target. Villa won the ball back 13 times in the opposition half, the most any team has done so in a league game against Guardiola's City.」
#   シティは前の季（2022-23）に3冠。4日後（12月9日）にアーセナルに1-0（マギン7分）。英語版 Emery：この勝利でホームのリーグ戦15連勝、クラブの149年の歴史でいちばん長い。
#   高い守りのライン（スカイスポーツ 2026-01-15、Adam Bate の取材記事）：「At Villa, that high line is fundamental. This season, as in the previous two, they have caught their opponents offside more than any other Premier League team. It requires meticulous planning because Villa control without the ball rather than press recklessly.」
#
# **日本との接点**：
#   ○ 久保建英：英語版「Takefusa Kubo」：2020-08-10 にビジャレアルへ期限付き、2021-01-08 に打ち切ってヘタフェへ。ビジャレアルでは公式戦19試合1得点（リーグ13・国王杯1・EL5、得点はEL）。英語版「2020–21 Villarreal CF season」：10月22日 EL グループ初戦 シヴァスシュポル戦 5-3、久保13分に得点。その季のELはビジャレアルが優勝。生年月日 2001-06-04（25歳）。
#   ○ 鈴木彩艶：英語版「Zion Suzuki」：2026-08-19 にヴィラへ。8月31日 アーセナル戦でデビュー、9月8日 クラブ・ブルッヘ戦（3-2 の勝ち）で日本人のGKとして初めてCLに出場。生年月日 2002-08-21（24歳）。
#
# **本人の言葉**：
#   ①スカイスポーツ 2026-01-15（Adam Bate の取材記事。requests で本文を読んだ）：
#     "I had a lot of key moments in my career but one of them was when I came back to Spain," / "I needed to perfect something in myself as a coach as well. I used the moment with Villarreal for myself to refresh a lot of things. I changed."
#     "Football is changing and we must adapt quickly because it demands that you update every day,"
#   ②スカイスポーツ 2026-05-20（EL 優勝の夜）："My dream when I started [at Villa] was to play in Europe and play for trophies - this is the first one." / "we're not going to stop."
#
# **マル秘話**（英語版本文と、スカイスポーツ 2026-01-15）：
#   ・父と祖父はどちらもGK。父は2部のレアル・ウニオンなど、祖父はレアル・ウニオンで1部。2021年7月、一家がレアル・ウニオンを引き受け、弟イゴールが会長。エメリは2021年から大株主。
#   ・アーセナルのあと、ヘタフェの試合を見に行って、高い守りのラインをもう一度強めた（ギジェム・バラゲの本「Rise of the Villans」にある、とスカイスポーツ）。最初の仕事のロルカでも取り組んでいた。
#   ・2021年11月、ニューカッスルの誘いを断り「ビジャレアルに100%打ち込んでいる」。
#
# **入れなかったもの**：スパルタクの解任、アーセナルの解任の経緯（選手・監督を小さく見せる）、ロルカのけが（けがの話）、妻・息子（私生活）、マンUのうわさ（10/27 の記事）、ニューカッスルへの「明確な展望が無い」発言（相手を下げる言葉）、FotMob・女子・ニュースの反応。
