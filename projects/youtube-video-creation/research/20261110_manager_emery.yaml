- id: secret
  heading: 数字に出ない話。エメリの祖父と父は、何をしていたのか
  tier: 背景
  telop: 祖父も父も、レアル・ウニオンのゴールキーパー
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [祖父と父, レアル・ウニオンのゴールキーパー]
    - [2021年7月, 一家でレアル・ウニオンを引き受ける]
    - [アーセナルのあと, ヘタフェの試合を見に行く]
    - [2021年11月, ニューカッスルの誘いを断る]
    highlight_row: 0
  say:
  - text: ここからは、数字に出ない話です。
    image: assets/images/20261110_manager_emery_b/01_w.jpg
    card: none
  - text: エメリの祖父と父は、どちらもゴールキーパー。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 地元バスクのクラブ、レアル・ウニオンでプレーしました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 2021年7月には、エメリの一家がそのクラブを引き受け、弟が会長になっています。
    card:
      <<: *sec_table
      highlight_row: 1
  - text: アーセナルのあと、エメリはヘタフェの試合を見に行きました。
    image: assets/images/20261110_manager_emery_b/03_w.jpg
    card: none
  - text: そこで、守りのラインを高くする考えを、もう一度強めたといいます。
    card:
      <<: *sec_table
      highlight_row: 2
  - text: 最初の仕事のロルカでも、取り組んでいたやり方でした。
    card: none
  - text: 2021年11月には、ニューカッスルからの誘いを断りました。
    image: assets/images/20261110_manager_emery_b/02_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  - text: ビジャレアルに100%打ち込んでいる、という理由でした。
    card:
      <<: *sec_table
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Unai_Emery
  - https://www.skysports.com/football/news/11096/13488340/unai-emery-exclusive-interview-aston-villa-manager-talks-evolving-and-updating-his-ideas-to-stay-ahead-of-the-rest
- id: view
  viewpoint: true
  heading: 見立て・決勝で勝ち続けるエメリは、チャンピオンズリーグでも届くのか
  tier: 背景
  telop: ヨーロッパリーグの決勝は6回で5回優勝
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（エメリのヨーロッパリーグの決勝）
    columns: [年, チーム, 結果]
    rows:
    - ['2014', セビージャ, 優勝]
    - ['2015', セビージャ, 優勝]
    - ['2016', セビージャ, 優勝]
    - ['2019', アーセナル, 準優勝]
    - ['2021', ビジャレアル, 優勝]
