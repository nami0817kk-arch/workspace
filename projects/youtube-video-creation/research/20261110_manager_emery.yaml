    highlight_row: 0
  say:
  - text: 見立てです。エメリが率いたチームの、ヨーロッパリーグの決勝を並べました。
    image: assets/images/20261110_manager_emery/05_w.jpg
    card: *view_table
  - text: 決勝に進んだのは6回。そのうち5回で優勝しています。
    emph: true
    mark: {kind: circle, row: 5, col: 2}
    card:
      <<: *view_table
      highlight_row: 5
  - text: 一方、チャンピオンズリーグでは、
    card: none
  - text: 準決勝まで進んだ2022年のビジャレアルが、いちばん上です。
    card: none
  - text: 前から奪う守りと高いライン、そして負けたあとに自分を変える準備。
    image: assets/images/20261110_manager_emery_b/02_w.jpg
    card: none
  - text: 16位のチームを王者にしたのは、その積み重ねだと考えます。
    card: none
  - text: 優勝の夜も、ここで止まるつもりはない、と口にしていました。
    card: none
  - text: いまのヴィラは、チャンピオンズリーグで4試合3勝。
    image: assets/images/20261110_manager_emery/05_w.jpg
    card: none
  - text: 前に出た2025年は、準々決勝まで進みました。
    card: none
  - text: ヨーロッパリーグで積んだ勝ち方を、いちばん上の大会でも出せるかに注目です。
    card: none
