title: 10月4日の題材（ニュース4枠）
lead: U-21の銀メダル、久保が語ったスペインと日本、キリンカップ決勝の前日など9件
note: '<b>○×を付けてください。</b>今日のニュースは日本人3本・ほか1本（本編＋ショート）。中身は記事の本文まで確かめてあります。スペイン対チェコ（41戦無敗）は、承認済みの「スペイン代表の40試合無敗」の回に結果を足して出す予定なので、ニュースの候補には入れていません。'
items:
- num: 1
  slot: 日本人
  fmt: quote
  head: 久保建英「模倣や真似はオリジナルには敵わない」。結婚発表の翌日、W杯王者スペインと日本の差を語る
  why: >-
    10/3 千葉での練習後。スペインは「どのポジションにも世界最高レベルの選手がわんさかいて、他の国でレギュラーの選手も1試合も出られない」「似たようなことをやっていても、突き詰める側と真似する側ではいつまでも追いつけない」「日本はまだ認められる側の国。スペインは認める側の国」。一方で「勤勉さや一つのことに取り組む姿勢は、ほぼどこの国にも負けない」「少しずつ確実に差は縮まってきている」。結婚については「今幸せということを僕の口から言えればいいかなと思っていた」。昨日の結婚の回とは別の、サッカーの話が主役
  src: ゲキサカ・中日スポーツ（10/3）
  url: https://web.gekisaka.jp/news/japan/detail/?460254-460254-fl=
- num: 2
  slot: 日本人
  fmt: news
  head: U-21日本代表、アジア大会決勝で韓国に0-1。3大会続けての銀メダル、石井久継「優勝させて帰りたかった」
  why: >-
    10/3 豊田、30,086人。後半16分に失点、34分に石井のシュートはポスト。韓国は大会4連覇。大岩監督「我々のスタイルは出せた試合だった。決勝を勝ちたいという気持ちだったので、非常に悔しい」。石井「本当にみんなに申し訳ない」「勝負強さ、決め切る力が本当に足りない」。表彰式で韓国国旗だけが国歌の間に上がらず、韓国メディアが「最後まで無様な大会」と批判（原因は機械の故障・紐の絡まりと報道）
  src: ゲキサカ・サッカーマガジン・サッカーダイジェスト（10/3〜4）
  url: https://web.gekisaka.jp/news/japan/detail/?460251-460251-fl=
- num: 3
  slot: 日本人
  fmt: quote
  head: キリンカップ決勝は明日5日、国立でニュージーランド戦。松木玖生「自分が劣っているとは一切思わない」
  why: >-
    19:30 国立。松木「5大リーグでやっている選手もいる中、劣っているとは一切思わないし、違いを作れる」。後藤啓介「ポストプレーは綺世くんから学ぶことしかない」。板倉滉「難しい相手に3連勝できたのはポジティブ。結果にこだわる」「五輪でも非常に苦戦した相手」。瀬古歩夢（唯一3戦連続先発）「全部出たいですね」。試合の前に出す予告の回
  src: ゲキサカ（10/3〜4）
  url: https://web.gekisaka.jp/news/japan/detail/?460258-460258-fl=
- num: 4
  slot: 日本人
  fmt: news
  weak: true
  head: 南野拓実、左ひざの大けがから約10か月。親善試合で先発57分、モナコ「タキが帰ってきた」
  why: >-
    昨年12月21日のオセール戦で左膝前十字靱帯断裂。10/3 の親善試合ピサ戦（2-0）で先発し57分まで、19分に左足の強いシュート。フィリペ・ルイス監督「可能な限り起用するし、常にポジションを勝ち取る競争をさせる」。本人の言葉はまだ無い。公式戦の復帰は代表ウィーク明け
  src: モナコ公式・フットボールチャンネル（10/3〜4）
  url: https://www.asmonaco.com/en/news/patient-as-monaco-see-off-pisa-in-composed-friendly-victory
- num: 5
  slot: 日本人
  fmt: quote
  weak: true
  head: 本田圭佑「監督に立候補した時は恒さんに無視された」。宮本会長の前で日本人指導者の競争の少なさを指摘
  why: >-
    10/2 のスポーツビジネスのサミットにオンラインで参加。本田「指導者の競争力があまりに少なすぎる」「神戸の監督を三木谷さんがやったっていい」。宮本会長「いや無視はしてないですよ」。中身は短い
  src: スポーツ報知・スポニチ（10/2〜3）
  url: https://news.yahoo.co.jp/articles/adb7e6495be7d3fe68f207bfb7a2d6e07aa047f6
- num: 6
  slot: その他
  fmt: news
  head: イングランド、クロアチアに7-0。クロアチア史上最大の大敗、ケインは代表で年間10点以上を3度記録した初の選手に
  why: >-
    10/3 リエカ（無観客の処分で子ども約6,000人だけ）。ケイン2点、サカ2点、ベリンガム、ゴードン、ロジャーズ。それまでの最大の負けは2018年のスペイン戦0-6。ケインは2019年12点、2021年16点、2026年10点で代表通算89点。トゥヘル監督「全員が90分高いレベルだった」。W杯の再戦
  src: Sky Sports・サッカーキング・Total Croatia（10/3〜4）
  url: https://www.skysports.com/football/news/13594637
- num: 7
  slot: その他
  fmt: quote
  weak: true
  head: ブルーノ「ロナウドはポルトガルのいちばんの象徴」。今夜のノルウェー戦の前に
  why: >-
    ロナウドが合宿を離れて初めて、主将を務めたブルーノがロナウドについて話した。今夜（日本時間5日3:45）ポルトでノルウェー戦、ジェズス監督が「この試合のあとで話す」としていた試合。昨日のポルトガルの回の続き
  src: ESPN ほか（10/3〜4）
  url: https://www.espn.com/soccer/
- num: 8
  slot: その他
  fmt: news
  weak: true
  head: グアルディオラ、マンCの有罪の判定のあと初めて公の場に。パリで目撃
  why: >-
    判定と控訴のあと、前監督が初めて姿を見せた。本人の発言があるかは要確認。昨日のマンCの回の続き
  src: 英各紙（10/3〜4）
  url: https://www.espn.com/soccer/
- num: 9
  slot: その他
  fmt: news
  weak: true
  head: ハフィーニャ、2か月続けてラ・リーガの月間MVP。9月は7点2アシスト、ハットトリックも
  why: >-
    バルセロナの主力。月間MVPの連続受賞。数字の話が中心
  src: サッカーキング（10/3）
  url: https://www.soccer-king.jp/
