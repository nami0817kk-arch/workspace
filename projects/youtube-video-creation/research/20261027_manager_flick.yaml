- id: words
  heading: 本人は、優勝の夜と契約のときに、何を語ったのか
  tier: 報道
  telop: 2026年5月、2連覇を決めた夜と、契約を延ばしたとき
  narrator: 解説
  card: &words_doc
    type: document
    label: フリックの言葉（2026年5月、訳）
    paragraphs:
    - 3年、4年、5年の契約を喜ぶ監督は多い。
    - でもバルサでは、期間を区切るのがいい。
    - 2028年まで。そこで全部うまくいっていれば、もう1年を決められる。
    highlight:
    - 期間を区切るのがいい
    - 全部うまくいっていれば
  say:
  - text: ここで、フリック本人の言葉。2026年5月、バルセロナと契約を延ばしたときです。
    image: assets/images/20261027_manager_flick/09.jpg
    card: *words_doc
  - voice: フリック
    text: 3年、4年、5年の契約をもらえたら、喜ぶ監督は多いでしょう。
  - voice: フリック
    text: でもバルサの場合は、期間を区切るのがいいんです。
    cont: true
  - voice: フリック
    text: 2028年まで。
    cont: true
  - voice: フリック
    text: そこで全部うまくいっていれば、もう1年を決められる。
    cont: true
    pause: 0.5
  - text: 長い約束より、1年ずつ結果で確かめる。勝ち続けることを前提にした言葉です。
    image: assets/images/20261027_manager_flick/01_w.jpg
    card: none
  quotes_from:
  - https://www.bbc.com/sport/football/articles/c3v2d7ww36lo
  sources:
  - https://www.bbc.com/sport/football/articles/c3v2d7ww36lo
