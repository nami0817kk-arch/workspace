  say:
  - text: 監督の始まりは1996年。ドイツ4部のクラブで、選手と監督を兼ねました。
    image: assets/images/20261027_manager_flick/05_w.jpg
    card: *career_tl
  - text: その後は代表のコーチや、連盟とクラブの役員。長く裏方を続けます。
    image: assets/images/20261027_manager_flick/06_w.jpg
    card:
      <<: *career_tl
      focus: 1
  - text: 転機は2019年11月。
    image: assets/images/20261027_manager_flick/05_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: コーチとして入ったバイエルンで、監督が去り、フリックが後を継ぎます。
    image: assets/images/20261027_manager_flick/05_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: 最初の25試合で22勝。バイエルン時代のグアルディオラより1つ多い勝ち数です。
    emph: true
    card:
      <<: *career_tl
      focus: 2
  - text: その季に、リーグ、カップ、チャンピオンズリーグの3冠。
    image: assets/images/20261027_manager_flick/09.jpg
    card:
      <<: *career_tl
      focus: 3
  - text: 翌年2月のクラブワールドカップまでに、獲ったタイトルは6つ。6冠と呼ばれます。
    card:
      <<: *career_tl
      focus: 3
  - text: 代表監督を経て、2024年5月にバルセロナへ。
    image: assets/images/20261027_manager_flick/09.jpg
    card:
      <<: *career_tl
      focus: 4
  - text: 前の季のバルセロナは、リーグ2位でタイトルなし。
    image: assets/images/20261027_manager_flick/02_w.jpg
    card: none
  - text: それが1年目で、リーグ、コパ・デル・レイ、スーペルコパの国内3冠。
    image: assets/images/20261027_manager_flick/07_w.jpg
    card: none
  - text: 2年目もリーグとスーペルコパを制しました。
    image: assets/images/20261027_manager_flick/07_w.jpg
    card: none
