  telop: 歩みと転機。4部から、コーチ8年、そして6冠
  narrator: 解説
  card: &career_tl
    type: timeline
    title: フリックの歩み
    rows:
    - [1996年, 4部のクラブで選手兼監督]
    - [2006〜14年, ドイツ代表のコーチ。W杯優勝]
    - [2019年11月, バイエルンのコーチから監督に]
    - [2020年, 3冠。翌年2月までに6冠]
    - [2024年5月, バルセロナの監督に]
