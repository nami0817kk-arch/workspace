# 監督紹介：フリック（10/27 火、シリーズ「監督紹介」、key: manager_flick、型は news）。9節の型（2026-10-20 決定）。見本は 20261026_manager_arteta。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-26 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。フリックを主題にした「人物紹介」（監督紹介）は無し。
#   既出の監督紹介：グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ。ルイス・エンリケは 10/26 にショートがあるので避けた。
#   フリックの名前が題に出る既存の本：10/10 ショート「フリックがヤマルに付けた条件」、10/17 ショート「フリック監督のヤマルへの答え」（どちらもヤマルの起用の話）。
#   → この回は「監督フリックの経歴・勝率・戦術・日本との縁」で主題が違う。ヤマルの起用の話・10/10・10/17 の発言は使わない。
#   10/24「ドイツ代表ってどんなチーム？」は代表の紹介。日本戦の2試合はあちらでも触れている可能性があるが、こちらは「監督フリックが率いた試合」として出す。
#   10/25 のクラシコ（バルサ 1-2 レアル）は 10/26 にニュース2本（ムバッペ・ペドリ）がある → 今季の成績の数字として1敗に数えるだけ。中身は語らない。
#
# **いまの立場（確かめた）**
#   ○ 英語版 Wikipedia「Hansi Flick」（控え research/raw/20261027_flick_wiki.txt）：currentclub = Barcelona (manager)。Managerial statistics は「match played 25 October 2026」まで。
#   ○ 同「2026–27 FC Barcelona season」（控え research/raw/20261027_barca_2026_27_wiki.txt、updated 25 October 2026）：Head coach = Hansi Flick。リーグは首位。
#   ○ ESPN の日程（site.api.espn.com esp.1 teams/83/schedule、控え research/raw/20261027_barca_espn_schedule.json）：今季のリーグ10試合。2026-10-25 バルセロナ 1-2 レアル・マドリード まで。今季も1部（ラ・リーガ）。
#   ○ BBC 2026-05（控え research/raw/20261027_flick_bbc_2026.txt）：2028年まで契約延長（さらに1年の選択肢）。
#   × クラブ公式（fcbarcelona.com）の監督ページは当たっていない。
#
# **通算の数え方（台本とサムネをそろえる）**＝1部のクラブと代表（バイエルン・ドイツ代表・バルセロナ）の全公式戦。
#   4部・5部時代のビクトリア・バムメンタールとホッフェンハイム（2000〜05、当時4部→3部）は数えない（地域カップを含まない数字で、トップの舞台ではないため）。
#   英語版 Wikipedia「Managerial statistics」：バイエルン 86試合 70勝9分7敗（255得点85失点）／ドイツ代表 25試合 12勝7分6敗（60得点30失点）／バルセロナ 130試合 99勝10分21敗（374得点155失点）
#   ＝241試合 181勝 26分 34敗。勝率 181/241＝75.1%（自分で割った）。
#     チームごとの勝率（自分で割った）：バイエルン 70/86＝81.4%、ドイツ代表 12/25＝48.0%、バルセロナ 99/130＝76.2%。
#     1試合あたりの勝ち点（3点・1点で自分で数えた）：バイエルン 219/86＝2.55、ドイツ代表 43/25＝1.72（Wikipedia の 1.72 と一致）、バルセロナ 307/130＝2.36。
#     1試合あたりの得点：バイエルン 255/86＝2.97、ドイツ代表 60/25＝2.40、バルセロナ 374/130＝2.88。
#   バルセロナの130試合の突き合わせ：2025-26 シーズン記事の Overall record＝57試合 44勝3分10敗、今季＝13試合 11勝0分2敗 → 残り 2024-25＝60試合 44勝7分9敗（記事の形式が違い直接は数えられなかった）。
#   優勝（Wikipedia Honours「Manager」）：バイエルン 7（ブンデスリーガ 2019-20・2020-21、DFBポカール 2019-20、DFLスーパーカップ 2020、チャンピオンズリーグ 2019-20、UEFAスーパーカップ 2020、クラブW杯 2020）
#     ／バルセロナ 5（ラ・リーガ 2024-25・2025-26、コパ・デル・レイ 2024-25、スーペルコパ 2025・2026）＝**12冠**。ホッフェンハイムの4部優勝・地域カップは数えない。
#   1部のクラブで率いた季：2019-20・2020-21（バイエルン）・2024-25・2025-26（バルセロナ）の4季すべてでリーグ優勝（BBC「has won a league title in each of his past four seasons in club management」）。
#   今季（Wikipedia の Overall record、2026-10-25 まで）：ラ・リーガ10試合 9勝1敗（40得点11失点、首位）／チャンピオンズリーグ3試合 2勝1敗＝13試合 11勝2敗。勝率 11/13＝84.6%（自分で割った）。
#
# **基礎**：1965-02-24 西ドイツ・ハイデルベルク生まれ（61歳）。MF。バイエルン（1985〜90）で104試合5得点、ブンデスリーガ優勝4回・DFBポカール1回。ケルンを経て1993年にプロを退く。A代表の出場は無し。
#   1996 4部のビクトリア・バムメンタールで選手兼監督 → 2000 ホッフェンハイム（4部優勝で3部へ）→ ザルツブルクのコーチ → 2006-08-23 ドイツ代表のコーチ（レーヴ監督のもと、2014 W杯優勝）
#   → 2014〜17 ドイツサッカー連盟のスポーツディレクター → 2019-07 バイエルンのコーチ → 2019-11-03 監督に（コヴァチの退任）→ 2021-08 ドイツ代表監督 → 2023-09-10 解任 → 2024-05-29 バルセロナ。
#   就任の前の季（2023-24、シャビ監督）：英語版 Wikipedia「2023–24 FC Barcelona season」（控え research/raw/20261027_2023-24_FC_Barcelona_season.txt）＝リーグ2位、コパ準々決勝、スーペルコパ準優勝、CL準々決勝＝タイトルなし。
#   バルセロナ公式（2024-05-29、控え research/raw/20261027_flick_fcb_new.txt）：バイエルンの最初の25試合で22勝。グアルディオラの最初の25試合の21勝を上回った。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**
#   ○ ESPN の試合記録（fifa.world summary?event=633797、控え research/raw/20261027_wc2022_ger_jpn_espn.json）：2022-11-23 カタール W杯 ドイツ 1-2 日本（ハリーファ国際スタジアム、42,608人）。
#       33分 ドイツのPK、75分 堂安律、83分 浅野拓磨。支配率 ドイツ73.9%・日本26.1%、シュート 26対12、枠内 9対4。
#   ○ ESPN（fifa.friendly summary?event=669756、控え research/raw/20261027_fr2023_ger_jpn_espn.json）：2023-09-09 親善試合 ドイツ 1-4 日本（ヴォルフスブルク）。
#       11分 伊東純也、19分 ドイツ（サネ）、22分 上田綺世、90分 浅野拓磨、90+2分 田中碧。
#   ○ Guardian 2023-09-10（控え research/raw/20261027_flick_guardian_sack.txt）：翌日に解任。1926年に代表監督の職ができてから、解任された初めての監督。25試合12勝。就任から8連勝。
#   ○ 英語版 Wikipedia：ドイツは2022年W杯でグループ3位、2大会続けてグループで敗退。
#   × フリックが日本の選手を率いたことは無い。バルセロナに日本人選手はいない。
#
# **戦術の色（実例の試合＝2024-10-26 ラ・リーガ、レアル・マドリード 0-4 バルセロナ、サンティアゴ・ベルナベウ）**
#   ○ ESPN の試合記録（esp.1 summary?event=704766、控え research/raw/20261027_clasico_20241026_espn.json）：54分・56分 レヴァンドフスキ、77分 ヤマル、84分 ラフィーニャ。
#       オフサイド レアル12・バルサ1。支配率 バルサ58.7%・レアル41.3%。シュート 15対9。
#   ○ 英語版 Wikipedia「Hansi Flick」Manager profile：高いライン・組織だったプレス・攻めたオフサイドトラップ。12回のオフサイドは2013年以降のラ・リーガの1試合で最多。基本は4-2-3-1。
#       バイエルンでは「奪ってから10秒以内」の得点（2020年の 8-2 バルセロナ戦で最初の4点のうち3点）。
#   ※ レヴァンドフスキの読みは「レバン/ドフスキ」と割れる → 名前を出さない（「54分と56分に2点」）。
# **本人の言葉（自訳。原文は出典）**：
#   ①2026-05-10 リーグ優勝を決めたクラシコ（バルサ 2-0 レアル）のあと、テレビで（Barca Blaugranes、控え research/raw/20261027_flick_bbg_title.txt）：
#     "I'll never forget this moment. My team is fantastic and I'm delighted. I'm very proud of my players."
#   ②2026-05 契約延長のとき（BBC、控え research/raw/20261027_flick_bbc_2026.txt）：
#     "A lot of coaches would be happy if they get a contract of three, four or five years, but in Barca's case it's good to limit it."
#     "We go to 2028 and then we'll see if everything is right, and, if so, we can decide on one more year."
#     ※同じ記事・同じ日の家族の話（父の死）は私生活なので入れない。
# **マル秘話**：
#   ・2020-08-14 チャンピオンズリーグ準々決勝、バイエルン 8-2 バルセロナ（英語版 Wikipedia／バルセロナ公式「a painful 8-2 defeat for Barça ... at the hands of Flick's team」）。4年後、そのバルセロナの監督に。
#   ・バイエルンは 2020年2月16日〜9月18日に公式戦23連勝。ドイツのプロサッカーの記録（英語版 Wikipedia）。
#   ・2024-25 は公式戦でレアル・マドリードに4戦4勝（リーグ2・スーペルコパ決勝 5-2・コパ決勝 3-2 延長）（英語版 Wikipedia）。
#   ・ドイツ代表のコーチを2006〜14年の8年。2014年 W杯優勝。
#
# **入れなかったもの**：家族・私生活（父の死・結婚・政治の役目）、解任の評価や批判の引用、選手交代への批判、契約の金額、ヤマルの起用の話（10/10・10/17 と重なる）、
#   10/25 のクラシコの中身、女子、Jリーグ、SNS の反応、ESPN 以外の数字の推測。
# **日本語名・読み（audio_query で確かめた）**：ハンジ・フリック／フリック監督／ハイデルベルク／バイエルン／ホッフェンハイム／堂安律（ドオアンリツ）／浅野拓磨／伊東純也／上田綺世（ウエダアヤセ）／
#   田中碧（タナカアオ）／ヴォルフスブルク／ドーハ／コパ・デル・レイ／スーペルコパ／ラミン・ヤマル／ラフィーニャ／ベルナベウ／クラシコ はどれも通った。
#   割れる：ギュンドアン（ギュ/ン/ドアン）→ 名前を出さない。レヴァンドフスキ（レバン/ドフスキ）→ 名前を出さない。「最多」は使わず「いちばん多い」。
