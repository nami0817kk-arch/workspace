  viewpoint: true
  heading: 見立て・同じ監督なのに、なぜ代表では数字が落ちたのか
  tier: 背景
  telop: 1試合あたりの勝ち点。バイエルン2.55、バルセロナ2.36、ドイツ代表1.72
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた
    columns: [チーム, 1試合あたりの勝ち点, 1試合あたりの得点]
    rows:
    - [バイエルン（86試合）, '2.55', '2.97']
    - [バルセロナ（130試合）, '2.36', '2.88']
    - [ドイツ代表（25試合）, '1.72', '2.40']
    - [今季のバルセロナ（13試合）, 11勝2敗, リーグ10試合で40点]
    highlight_row: 2
  say:
  - text: 見立てです。フリックの3つのチームを、1試合あたりの勝ち点で並べました。
    image: assets/images/20261027_manager_flick/09.jpg
    card: *view_table
  - text: バイエルンは2.55、バルセロナは2.36。
    card:
      <<: *view_table
      highlight_row: 0
  - text: ドイツ代表は1.72。クラブより、1試合あたり0.6点以上少ない数字です。
    emph: true
    mark: {kind: circle, row: 2, col: 1}
    card:
      <<: *view_table
      highlight_row: 2
  - text: 高いラインとそろったプレスは、毎日の練習で動きを体に入れてこそ働きます。
    image: assets/images/20261027_manager_flick/04_w.jpg
    card: none
  - text: 数日しか集まれない代表では、その時間が足りなかった。そう見ています。
    card: none
  - text: そして今季のバルセロナ。公式戦13試合で11勝2敗。
    image: assets/images/20261027_manager_flick/09.jpg
    card:
      <<: *view_table
      highlight_row: 3
  - text: リーグでは、1試合に4点のペースで点を取っています。
    image: assets/images/20261027_manager_flick/09.jpg
    card:
      <<: *view_table
      highlight_row: 3
  - text: 次に見るのは、リーグ3連覇に届くかどうかです。
    image: assets/images/20261027_manager_flick/01_w.jpg
