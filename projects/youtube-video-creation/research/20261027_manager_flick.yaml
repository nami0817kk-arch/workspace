- id: style
  heading: フリックのサッカーは、2024年のクラシコで、何を見せたのか
  tier: 報道
  telop: 戦術の色。2024年10月26日、レアル・マドリード 0対4 バルセロナ
  narrator: 解説
  card: &style_doc
    type: document
    label: 英語版Wikipediaの要約（訳）
    paragraphs:
    - 守備のラインを高く保つ。
    - チーム全体で、そろって前からプレスをかける。
    - 攻めたオフサイドトラップで、相手を止める。
    highlight:
    - ラインを高く保つ
    - 前からプレス
    - オフサイドトラップ
  say:
  - text: フリックのサッカーを形づくる約束事は、3つ。
    image: assets/images/20261027_manager_flick/09.jpg
    card: *style_doc
  - text: 守備のラインを高く保つこと。チーム全体で、そろって前からプレスをかけること。
    card: *style_doc
  - text: そして、守備の列を一斉に上げて相手を反則にする、オフサイドトラップです。
    card: *style_doc
  - text: いちばんよく表れたのは、就任1年目の2024年10月26日。
    image: assets/images/20261027_manager_flick/01_w.jpg
    card: none
  - text: 敵地ベルナベウでの、クラシコです。
  - text: レアル・マドリードは、この試合で12回もオフサイドにかかりました。
    image: assets/images/20261027_manager_flick/09.jpg
    emph: true
    card: &style_stats
      type: stats
      title: 2024年10月26日 レアル・マドリード 0-4 バルセロナ
      items:
      - ['12', 回, レアル・マドリードのオフサイド]
      - ['58.7', '%', バルセロナのボール支配率]
      - ['15', 本, バルセロナのシュート（レアルは9本）]
      focus: 0
  - text: 2013年以降のラ・リーガの1試合で、いちばん多い回数です。
    card:
      <<: *style_stats
      focus: 0
  - text: 支配率はバルセロナが58.7%。シュートは15本対9本。
    card:
      <<: *style_stats
      focus: 1
  - text: 54分と56分に、わずか2分で2点。
    image: assets/images/20261027_manager_flick/08_w.jpg
    card: none
  - text: 77分にラミン・ヤマル、84分にラフィーニャ。4対0の勝利でした。
    card: none
