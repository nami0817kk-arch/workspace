  say:
  - text: ここから、数字の外の話。2020年8月、チャンピオンズリーグの準々決勝。
    image: assets/images/20261027_manager_flick/03_w.jpg
    card: none
  - text: フリックのバイエルンは、バルセロナを8対2で破っています。
    image: assets/images/20261027_manager_flick/05_w.jpg
    emph: true
    card:
      <<: *sec_table
