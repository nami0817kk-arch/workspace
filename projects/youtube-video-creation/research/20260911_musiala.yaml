  - id: why
    heading: 頭を指したのは、なぜか
    tier: 報道
    main: true
    telop: 「久しくなかった感覚だ」
    narrator: 解説
    say:
      - 先発はプレシーズン以来。そのプレシーズンで、2試合続けてピッチに倒れていました。
      - 本人がSNSで公表した診断は、神経系の機能障害による欠神発作。健康上の危険はなく、プレーを続けるつもりだと述べています。
      - 薬の調整と、公になったことの衝撃で3試合を欠場。土曜のシャルケ戦に途中出場して戻っていました。
      - 試合後、本人はこう話しました。
      - {voice: ムシアラ, text: 今日感じたものは、久しくなかった感覚だ}
      - {voice: ムシアラ, text: 嬉しいし、まだ進むべき段階があることも分かっている}
      - {voice: ムシアラ, text: 体の状態は良い}
      - {voice: ムシアラ, text: この件は、自分にとってもう新しいことではない}
      - {voice: ムシアラ, text: またチームと一緒に、ピッチで楽しめた}
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/49896289/jamal-musiala-bayern-munich-goal-bodo-glimt-seizures
      - https://web.gekisaka.jp/news/world/detail/?458308-458308-fl

  - id: around
    heading: 監督とチームメイトは何と言ったか
    tier: 報道
    telop: 「彼の瞬間は来ると分かっていた」
    narrator: 解説
    say:
      - ヴァンサン・コンパニ監督は、こう話しています。
      - {voice: コンパニ監督, text: みんなが彼のために喜んだ}
      - {voice: コンパニ監督, text: スタジアムの7万5000人も、テレビの前の人たちも}
      - {voice: コンパニ監督, text: 彼の瞬間が来ることは分かっていた}
      - {voice: コンパニ監督, text: 本当に大きなゴールを決めてくれた}
      - そのうえで、これからについて言葉を選びました。
      - {voice: コンパニ監督, text: これからは、彼のプレーだけが注目されることを願う}
      - {voice: コンパニ監督, text: もう一方の話との向き合い方は、彼が分かっている}
      - {voice: コンパニ監督, text: 我々はこれからも全面的に支える}
      - パスを出した本人も、試合後に話しています。
      - {voice: ハリー・ケイン, text: 彼のために本当に嬉しい}
      - {voice: ハリー・ケイン, text: プレシーズンからシーズンの入りにかけて、つらい時期だった}
      - {voice: ハリー・ケイン, text: 笑顔が見られたのが良かった}
      - {voice: ハリー・ケイン, text: 重圧が取れたんだと思う。いまはとても良さそうだ}
      - {voice: ハリー・ケイン, text: 練習から鋭さがあるし、飢えも見える}
      - 公式戦の得点は、6月のワールドカップでドイツがキュラソーに7対1で勝った試合以来でした。
    official: false
    sources:
