title: 10月30日のショート題材
lead: 約435件（30時間以内）から21件（日本人9件・海外12件）。ショート10本ぶんを○で選んでください。
note: 今日は金曜（30日）、日本時間の朝に集めました。ショート10本ぶんを○で選んでください。<br><br><b>日本人の題は9件（1〜9）、海外は12件（10〜21）、計21件</b>です。<b>強いのは1（ブラジル代表の日本戦メンバー）・11（ロナウド）・12（ムバッペ）</b>。日本人のほかの題は弱めで、弱い題で埋めないよう、○は強いものに絞るのも手です。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは 1・2・3・4・5・6・7・8・9 と 10（パレス）と 20（FIFA）。本人（監督を含む）の言葉が取れそうなのは 2・3・6・13・14・15・16・17・19。各行の「条件：」に書きました。<br><br><b>昨日の続き：</b>3は、昨日 29日に作って投稿に至らなかった6本目（塩貝・後藤）と同じ試合です。作ってある動画を使うか、捨てるかを選んでください。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外にします。いまは9時台なので、日本人の題を先に仕上げます。<br><br><b>読めていないこと：</b>見出しだけを見た題が多く、本文は取材の段で読みます（読んでから落とす題も出ます）。<b>10月の題と重なるもの</b>：5（鈴木）・4（町野）・12（ムバッペ）・13（バロンドール）。<br><br><b>外した題：</b>マンUのキャリック続投（10/26・27・29 に3本）・リヴァプールのカラバオ杯の抽選（10/29 に出した）・アーセナルのダウマン（16歳の未成年）・ネイマール関連・女子・MLS・Jリーグ（槙野・町田のACL2・岡田氏のJFA）・高校サッカー・スペインの列車事故。FotMob は使っていません。
