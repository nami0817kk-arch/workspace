  - id: who
    heading: 「約束を破った」と言ったのは誰か
    main: true
    tier: 報道
    telop: 本人でも代理人でもない。英メディアの記者の言葉
    narrator: 解説
    card:
      type: table
      title: 誰が何を言ったか
      columns: ["", ""]
      rows:
        - ["「約束を破った」", "リバプールエコー（英メディア）の記事"]
        - ["遠藤本人", "この件で何も話していない"]
        - ["代理人・クラブ", "同じく発言なし"]
        - ["イラオラ監督", "「出番は来る」とだけ"]
    say:
      - この「約束を破った」という言葉です。
      - 日本で出た見出しは「リバプール監督が約束破った」でした。
      - "では、これを言ったのは誰か。**遠藤本人ではありません。**"
      - "代理人でもクラブでもありません。"
      - "**イギリスのメディア『リバプールエコー』が、記事にそう書いた**のです。"
      - 同じメディアは試合の前に、こうも書いていました。
      - {voice: リバプールエコー, text: イラオラ監督は遠藤に約束した。彼がトッテナム戦で出場機会を得る可能性がある}
      - つまり「約束」という言葉自体も、この記者のものです。
      - では、イラオラ監督が実際に言ったのは何だったのか。
      - 9月12日、フラムと0対0で引き分けた試合のあとの会見です。
      - {voice: イラオラ, text: ワタは、プレシーズンのかなりの部分を失ったと思う}
      - {voice: イラオラ, text: まだ最高の状態ではない。ただ、練習はとてもよくやっている}
      - {voice: イラオラ, text: 問題は、彼のポジションの前に多くの選手がいることだ}
      - {voice: イラオラ, text: それでもワタは、間違いなく私が好きな選手だ。きっと彼にも出番が来る}
      - "**「トッテナム戦で使う」とは、一言も言っていません。**"
      - 日本語で伝わったのは、この4つ目の一文だけでした。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/16/359308/
      - https://www.football365.com/news/andoni-iraola-wataru-endo-liverpool-fulham-verdict

  - id: transfer
    heading: 移籍の話はどこまで確かか
    tier: 未確認
    telop: クラブも本人も認めていない。移籍先の名前も出ていない
    narrator: キャスター
    say:
      - では、冬の移籍という話はどうなのか。
      - "これは**報道だけ**です。クラブも本人も、何も認めていません。"
      - 根拠として挙げられているのは、英メディアの2つの見立てです。
      - ひとつは「リバプールでは概ね戦力外と見なされている」という書き方。
      - もうひとつは「契約が今季で切れるので、1月が最後の売却の機会になる」という読みです。
      - "どちらも**記者の推測**で、関係者の発言は付いていません。"
      - "そして、**移籍先の候補となるクラブの名前は、どこにも出ていません。**"
      - 確かなのは3つだけです。今季0出場。CL登録外。契約は今季末まで。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/16/359308/
      - https://www.givemesport.com/liverpool-wataru-endo-career-over-iraola-decision-tottenham/

  - id: numbers
    heading: 積み上げてきたもの
    tier: 背景
    telop: リヴァプールで70試合。代表は73試合
    narrator: 解説
    card:
