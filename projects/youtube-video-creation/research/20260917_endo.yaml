# 遠藤航の「約束を破った」は誰が言ったのか（2026-09-17）
#
# **この回の芯は、発言の出どころを正すこと。**
# 見出しは「リバプール監督が約束破った」だが、**本人でも代理人でもクラブでもない。
# 英メディア『リバプールエコー』の記者の表現**。そしてイラオラ監督は
# 「トッテナム戦で使う」とは一言も言っていない。
# ここが山場（@main）。
#
# **確度をきれいに分ける。**
#   確定 … 今季公式戦0出場／CL登録25人から外れている／契約は2027年6月まで
#   報道 … 冬の移籍。クラブも本人も認めていない。移籍先の名前もどこにも出ていない
#
# **『リバプールエコー』本体と『This is Anfield』本体は403で開けていない。**
# 英語の原文（broke his promise 系）は未確認なので、
# **「リバプールエコーがそう書いた」までにとどめる。**
#
# 9/16 に「遠藤航がなぜ出ないのか、監督が口を開いた」を出している。
# **あの回は出場機会の話。この回は発言の出どころの話**で、別物にする。
#
# **`check_outlet_talk`（媒体名を読み上げない）が鳴るが、この回は例外。**
# 「報道機関の名前は、発言を引くときだけ」という決まりの、まさに引用の側にあたる。
# **どの媒体がそう書いたのかが、この動画の中身そのもの**なので、
# ここで媒体名を消すと「誰が言ったのか分からない話」になって本末転倒。
# CLAUDE.md にも「確度の『報道』は誰が言ったかを示すものなので、
# ここを消すと伝聞と事実の区別が消える」とある。**鳴っても直さない。**
