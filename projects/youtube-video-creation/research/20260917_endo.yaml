        - ["2025-26", "リーグ8試合0得点"]
        - ["日本代表", "73試合4得点。2026年6月に引退"]
    say:
      - リヴァプールでの通算は、公式戦**70試合**で1得点。
      - リーグ戦だけ見ると、1年目が29試合、2年目が20試合、3年目が8試合です。
      - "**出場は、年ごとに減ってきました。**"
      - 日本代表では73試合4得点。
      - 引退は今年の6月12日でした。ワールドカップの開幕の日に、怪我で離脱してのことです。
      - {voice: 遠藤航, text: 怪我をしてからここまで、自分にできることは全てやってきたので何も後悔はありません}
      - 主将の役目は、その日に板倉滉へ渡っています。
