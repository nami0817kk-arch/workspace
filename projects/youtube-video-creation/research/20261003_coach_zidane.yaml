    card:
      type: table
      title: レアル2期目 2019年3月〜2021年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id005
  - text: 戻って最初の1年で、2つのタイトルを取ります。
    card:
      type: table
      title: レアル2期目 2019年3月〜2021年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id005
