- id: france
  heading: 空白の5年、そしてフランス代表へ
  tier: 報道
  official: true
  telop: 誘いをすべて断った5年。7月28日、デシャンの後任に
  narrator: キャスター
  card:
    type: table
    title: 空白の5年からフランス代表へ
    columns: &id006
    - 時期
    - 出来事
    rows: &id007
    - - 2021年5月
      - レアルを退任。監督の仕事から離れる
    - - 2025年1月
      - デシャン監督が、W杯での退任を表明
    - - 2026年7月
      - W杯で4位。デシャンの14年が終わる
    - - 2026年7月28日
      - ジダンの就任を発表（2030年まで）
    - - 9月25日・28日
      - トルコ 1-0、ベルギー 1-0（ともに敵地）
    - - 10月2日
