  say:
  - text: レアルを離れてから5年、ジダンはどこの監督にも就きませんでした。
    image: assets/images/20261003_coach_zidane/05_w.jpg
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 0
  - text: その間のことを、就任の会見でこう明かしています。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 0
  - text: この4、5年、誘いはあった。だが全部断った。
    voice: ジネディーヌ・ジダン
  - text: フランス代表のためだ。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: 5年間、何もせずにいたわけではない。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: 本当にたくさんの試合を見てきた。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: レアルを率いていた頃よりも多くだ。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: 待っていた席は、14年続いたデシャン監督の後でした。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 1
  - text: デシャンは2025年1月、今年のW杯を最後に退くと明かします。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 1
  - text: W杯は4位。そして7月28日、連盟がジダンの就任を発表します。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 3
  - text: 契約は2030年まで。次のW杯までの4年を任されました。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 3
  - text: 迎えた9月、敵地でトルコとベルギーを続けて破り、ホームのイタリア戦は引き分け。
    card:
      type: table
      title: 空白の5年からフランス代表へ
      columns: *id006
      rows: *id007
      highlight_row: 5
