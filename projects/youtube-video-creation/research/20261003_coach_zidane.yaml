  heading: レアルの勝ち方は、代表でも同じか
  tier: 背景
  telop: 選手の回し方はレアルのまま。点の取り方は1試合2.67点から1点に
  narrator: 解説
  say:
  - text: レアルでのジダンは、戦術より選手の扱いで勝つ監督だと評されてきました。
    image: assets/images/20261003_coach_zidane/03.jpg
  - text: 3連覇を共にした主将、セルヒオ・ラモスの言葉です。
  - text: ジダンは、難しいロッカールームを繊細にまとめてくれた。
    voice: セルヒオ・ラモス
  - text: その扱い方は、代表でも見えています。3試合でピッチに立った選手は20人。
    image: assets/images/20261003_coach_zidane/05_w.jpg
  - text: トルコ戦からベルギー戦へは、先発11人のうち9人を入れ替えました。
    emph: true
  - text: ムバッペのけがもありましたが、残したのはゴールキーパーと守備の1人だけ。それでも勝っています。
  - text: 一方で、勝ち方の中身は大きく違います。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: &id008
      - 時期
      - 試合
      - 1試合の得点
      - 1試合の失点
      rows: &id009
      - - レアル1期目
        - '149'
        - '2.67'
        - '1.09'
      - - レアル2期目
        - '114'
        - '1.82'
        - '0.91'
      - - フランス代表
        - '3'
        - '1.00'
        - '0.33'
  - text: レアルの1期目は、1試合に2.67点を取って勝つチームでした。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 0
  - text: 代表の3試合は、1試合1点。そのかわり、失点は1試合0.33点に抑えています。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: 守りの数字は、むしろレアルの頃より上です。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: ジダン自身、代表の仕事をこう見ていました。
  - text: クラブとはまったく違う仕事だ。
    voice: ジネディーヌ・ジダン
  - text: 私には初めてのことだが、怖くはない。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: 選手を入れ替えながら勝つ形は、レアルの頃のまま。点を取りに行く形は、まだこれからです。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: 5日の相手は、9人を替えて破ったベルギー。今度はパリ郊外のホームで迎えます。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: 先発をどう組み、何点取るか。10番だった監督の答えが、そこで見えてきます。
    card:
      type: table
      title: ジダンのチームの得点と失点
      columns: *id008
      rows: *id009
      highlight_row: 2
