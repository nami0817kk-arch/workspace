  say:
  - text: フランス代表を率いるジダンは、レアルで3年続けて欧州の頂点に立った監督です。
    short_only: true
    image: assets/images/20261003_coach_zidane/01_w.jpg
  - text: 2016年1月、ジダンはレアル・マドリードの監督に就きます。
    image: assets/images/20261003_coach_zidane/01_w.jpg
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
  - text: 前の監督ベニテスが、シーズン途中で解任された日のことでした。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
  - text: それまで率いていたのは2軍のチーム。トップの監督は初めてです。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
  - text: 目指すのは、欧州のクラブ王者を決めるチャンピオンズリーグ。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 就任から5か月、ミラノでの決勝でアトレティコ・マドリードをPK戦で破ります。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 翌年はカーディフで、ユベントスに4対1の勝利。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 2018年はキーウで、リヴァプールに3対1で勝ちました。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 1992年に今の大会名になってから、3連覇した監督はジダンただ一人です。
    emph: true
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 2017年にはスペインのリーグも制し、2年半で手にしたタイトルは9つ。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 5
  - text: 149試合で105勝。勝率は70.5%に達しました。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: 3度目の欧州制覇から5日後、ジダンは自ら退任を発表します。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
  - text: チームには変化が必要だ、というのが理由でした。
    card:
      type: table
      title: レアル1期目 2016年1月〜2018年5月（PK戦の勝ちを含む）
      columns: *id003
      rows: *id004
