  say:
  - text: フランス代表を率いる、ジネディーヌ・ジダン。今年7月に監督に就きました。
    image: assets/images/20261003_coach_zidane/05_w.jpg
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 5
  - text: 就任の会見で、自分のことをこう話しています。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 5
  - text: 私は10番だった。私を突き動かすのは、点を取りに行くことだ。
    voice: ジネディーヌ・ジダン
  - text: かつては、ピッチの上のリーダーだった。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: いまは、経験で引っ張るリーダーになる。
    voice: ジネディーヌ・ジダン
    cont: true
  - text: 歩みの始まりは1972年、フランス南部の港町マルセイユです。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 選手としてはカンヌ、ボルドー、ユベントスを経て、レアル・マドリードへ。
    image: assets/images/20261003_coach_zidane/02.jpg
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 1998年、自国開催のW杯。決勝でブラジルから頭で2点を奪います。
    emph: true
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: フランスを、初めての世界一に導きました。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: その年、世界最高の選手に贈られるバロンドールも手にしました。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 代表では108試合で31点を挙げました。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: 最後の試合は2006年W杯の決勝。延長での退場が、現役の終わりでした。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: 監督としての舞台は、ずっとレアル・マドリードでした。
    card:
      type: table
      title: ジネディーヌ・ジダンの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 4
