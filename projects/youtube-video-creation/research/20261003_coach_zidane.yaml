# 監督の経歴：ジネディーヌ・ジダン（10/3）。2026年7月28日にフランス代表監督に就任（前任デシャン、14年）。ここまで3試合 2勝1分け。
# 監督歴の数字は Transfermarkt（trainer/21284 の詳細表示）と英語版Wikipedia（Managerial statistics、BDFutbol 由来）で突き合わせて一致。
#   1期目 149試合105勝28分16敗（得点2.67・失点1.09/試合）、2期目 114試合69勝25分20敗（1.82・0.91）、フランス 3試合2勝1分0敗（1.00・0.33）。
#   PK戦の勝ち（2016 CL決勝・2020 スペイン・スーパーカップ決勝）を勝ちに数える形。クラブの通算（172勝55分36敗）は PK戦を引き分けに数える。表の題に断る。
#   タイトルは Transfermarkt の称号ページ（1期目9・2期目2＝11）。退任の発表はクラブ（2021-05-27、Infobae が全文）。
# 同じ日のニュース「フランス対イタリア」（scripts/20261003_france_italy.md）が 10/2 の試合とジダンの試合後の言葉、3試合の得点の中身を扱う。
#   この回は試合の細部を1行に留め、ジダンの言葉は 7/28 の就任会見（Maxifoot の書き起こし。ESPN・Sky Sports の英訳で裏取り）から引く。
#   2006年決勝は「延長の退場」の1行だけ。頭突きの語は使わない。
# 「選手の扱いで勝つ監督」の評価は ESPN（Sid Lowe 2018-05-25）。そこで引かれた主将ラモスの言葉を1つ使う（発言の日付は記事に無い）。
# 見立ての数字（先発の入れ替え9人・3試合で20人）は FotMob と ESPN の先発表で自分で数えた（Transfermarkt の「使った選手20」とも一致）。
# ネットの反応は2件（Yahoo!ニュースのコメント欄、就任を伝えた記事 7/28〜29。個人の投稿を頭から終わりまで）。海外の声は取れていない。
#   acm********（THE DIGEST の記事）: レアルの戦力だったから、という見方。見立ての問いと同じ向きの声。bqw********（スポーティングニュースの記事）: 短いのでショートの締め。
# 写真: Commons 4枚（01 2018キーウ CC BY-SA 2.0 / 02 2006決勝 CC BY 2.0 / 03 ラモスと2016 CC BY 3.0 / 04 2019 CC BY-SA 4.0）と
#   レキップの記事の写真 05（P.Lahalle/L'Equipe、代理店ではない。同じ日のニュースの A. Réau の1枚とは別）。材料の控えは research/raw/20261003_coach_zidane.md。
