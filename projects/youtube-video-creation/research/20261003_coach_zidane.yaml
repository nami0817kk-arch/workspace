- id: voices
  heading: ネットの反応
  tier: 未確認
  telop: 「ここからがジダン監督の本当の手腕の見せどころ」
  narrator: キャスター
  say:
  - text: 正直言ってジダンの監督のキャリアの
    voice: ネット民
  - text: CL3連覇とかラ・リーガ制覇は素晴らしいと思うんだけど、
    voice: ネット民
    cont: true
  - text: 全部がレアルマドリードのキャリアだからなーとも思ってる。
    voice: ネット民
    cont: true
  - text: ロナウドやモドリッチ、クロースなど錚々たるメンバーもいたし。
    voice: ネット民
    cont: true
  - text: バルサのロナウジーニョやメッシのいた時の
    voice: ネット民
    cont: true
  - text: ライカールトのような印象があるんだよね。
    voice: ネット民
    cont: true
  - text: ここからがジダン監督の本当の手腕の
    voice: ネット民
    cont: true
  - text: 見せどころではないかと思います。
    voice: ネット民
    cont: true
  - text: 期待してます！
    voice: ネット民
    cont: true
  - text: 残るタイトルは代表監督のタイトルだけか
    voice: ネット民
    short_voice: true
  - text: 今のフランスなら十分狙える
    voice: ネット民
    cont: true
    short_voice: true
  - text: 頑張って欲しいね
