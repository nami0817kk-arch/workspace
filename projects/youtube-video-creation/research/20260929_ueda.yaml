  heading: 勝ち切れたことに意味があった
  tier: 報道
  telop: 上田「アクシデントもあった中で追加点も取れて勝ち切れたことには意味があった」
  narrator: キャスター
  say:
  - text: ベネズエラに2対1で勝ち。途中出場の上田綺世が、同点弾と判定が覆ったPKで決めました。
    short_only: true
  - text: 試合後、判定に納得しないベネズエラの選手は審判を囲みました。
    image: assets/images/20260929_ueda/07_wave2.jpg
  - 一方の上田の言葉です。
  - voice: 上田
    text: アクシデントもあった中で追加点も取れて
  - voice: 上田
    text: 勝ち切れたことには意味があった
  - voice: 上田
    text: 大会に近い状態を作れたと思います
  - 大会とは、2027年のアジアカップのこと。
  - 10人で守り切って勝つ形を、本番の前に経験できたという言葉です。
