  - text: 9月28日、広島。日本はベネズエラに2対1で勝ちました。
    image: assets/images/20260929_ueda/03_wave.jpg
  - 先発は大幅に入れ替え、前半はどちらも点が入りません。
  - 後半の頭に、上田、伊東純也、久保建英、田中碧、鈴木彩艶の5人を入れます。
  - ところが入れた直後、27秒でケルシーに先制されました。
  - text: 3分後の49分、伊東のクロスに上田が滑り込んで同点。
