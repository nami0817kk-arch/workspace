  say:
  - text: 同点弾は、上田のA代表通算20点目。日本代表で20点以上は、史上14人目です。
    image: assets/images/20260929_ueda/02.jpg
  - 45試合での到達。1試合あたりにすると0.44点になります。
  - その14人の中で、1試合あたりの得点が上田より高いのは5人だけ。
  - 途中出場で決めるのは、ウルグアイ戦に続いて2試合連続。どちらも伊東のアシストでした。
  - 森保監督のチームは、ベネズエラにこれまで1分け1敗。今回が初めての勝ちです。
  - 先発を10人替えても、後半に上田と伊東を入れれば点が入る。
  - 今の日本の勝ち方は、そこに寄っています。
  - 次は10月1日、横浜でエクアドル戦。中2日です。
