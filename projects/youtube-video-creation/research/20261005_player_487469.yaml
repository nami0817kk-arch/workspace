- id: story
  heading: マル秘話
  tier: 報道
  telop: 父と、幼なじみと、「イラク」と呼ばれた土のグラウンド
  narrator: 解説
  card:
    type: points
    title: ヴィティーニャの原点
    items:
    - 父もプロのMF。「監督より、父親でいることを選んだ人」
    - 幼なじみはGKのディオゴ・コスタ。同じ町のクラブで育った
    - 練習場は荒れた土のグラウンド。指導者は「イラク」と呼んでいた
  say:
  - text: 数字を置いて、育ちの話を2つ。
    image: assets/images/20261005_vitinha_usa2026_w/01.jpg
  - 1つ目は父。本人は、父は一度もサッカーを強いなかった、と話しています。
  - ロッカールームの流儀を知り尽くしていて、それでも監督より父親でいることを選んだ人だと。
  - 2つ目は幼なじみ。ポルトガル代表のGK、ディオゴ・コスタと同じ町のクラブで育ちました。
  - 練習場は荒れ果てた土のグラウンドで、指導者はそこを「イラク」と呼んでいたそうです。
  - そこから2人とも、ポルトを経てワールドカップの代表へ。
  - いまの監督、ルイス・エンリケについては、こう。
  - voice: ヴィティーニャ
    text: 彼はおそらく僕のキャリアに最も影響を与えた人物だ
  - voice: ヴィティーニャ
    text: すごく面倒だけど、でも、それがいいんだ。
    cont: true
  - voice: ヴィティーニャ
    text: だって、上達できるから
    cont: true
    pause: 0.6
  - text: その監督のもとで、副主将とPKのキッカーを任されています。
    pause: 0.5
  sources:
