  - text: レーダーの図で、同じ中盤の選手と比べたヴィティーニャの形を見てみます。
    image: assets/stats/player_20261005_1061249_radar.png
    no_telop: true
  - text: 高く張り出すのは、パスとボールタッチ。低いのは、空中戦と守備の関わりです。
    image: assets/stats/player_20261005_1061249_radar.png
    no_telop: true
  - text: ボールを受ける場所は、中盤のすべて。DFの隣にも、GKのそばにも降りていきます。
    image: assets/stats/player_20261005_1061249_heat.png
    no_telop: true
    card: none
  - text: 今季のリーグは5試合で、パス成功457本。1試合で90本を超えます。
    image: assets/images/20261005_player_487469/usa96/01_w.jpg
  - text: 昨季のチャンピオンズリーグでは、パス成功1,448本。なんと大会の記録です。
    emph: true
  - text: シュートは今季12本で1点。点は、あとから身に付けた武器です。
    image: assets/stats/player_20261005_1061249_shots.png
    no_telop: true
  - text: 初めてのハットトリックは、去年11月のトッテナム戦でした。
    image: assets/stats/player_20261005_1061249_shots.png
    no_telop: true
  - text: 守備の量は、比べた中では少ない側。そのぶん運ぶ仕事を磨いてきました。
    image: assets/images/20261005_player_487469/usa96/01_w.jpg
  - 対戦したスペイン代表のペドリは、こう驚いていました。
  - voice: ペドリ
