- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 干された1年に口にした未来を、2年で現実にした
  narrator: キャスター
  say:
  - text: ヴィティーニャ。すべてのパスを受けに行く、172センチの司令塔です。
    image: assets/images/20261005_player_487469/01_w.jpg
  - 20歳で渡ったイングランドのウルヴァーハンプトン、通称ウルブズ。
  - 1年でつかんだ先発は、公式戦でわずか7回でした。
  - それでも本人は、当時の同僚にこう言い切っていたそうです。
  - ポルトに戻って大暴れする。その次は、欧州のベスト8に入るクラブでやる、と。
  - text: そして本当に、宣言どおりパリへ。いまや欧州王者の中盤の柱です。
    emph: true
  - 今年5月の決勝では最優秀選手に選ばれ、胸を張りました。
  - voice: ヴィティーニャ
    text: 今日、僕らはヨーロッパで最高のチームだと言える
    pause: 0.5
  - その歩みを、表と本人の言葉で確かめていきましょう。
