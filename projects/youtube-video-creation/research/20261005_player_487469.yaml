  - https://afporto.pt/noticias/pinheirinhos-de-ringe-transformaram-o-iraque-em-oportunidade/
  - https://www.goal.com/jp/ニュース/psg-vitinha-luis/bltc8c45f96615df320
  - https://en.wikipedia.org/wiki/Vitinha
- id: view
  heading: 見立て
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月11日、ル・マン戦
  say:
  - text: 終わりに、この先のヴィティーニャを数字で。
    image: assets/images/20261005_vitinha_wc2026_wide/01.jpg
  - 比べるのは去年の自分。昨季のチャンピオンズリーグでパス成功は1試合90本。
  - 今季のリーグは1試合91本。量は落ちていません。
  - 世界最優秀選手を選ぶバロンドールは10月26日に発表。
  - 去年3位の本人は、今年も候補30人に入っています。
  - クラブの再開は10月11日、ル・マン戦。
  - 見るのは点ではなく、パスの本数と、90分出ているか。この2つが今季も続くかを見ます。
