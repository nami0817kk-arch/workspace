  say:
  - text: パリのヴィティーニャ、26歳。点を取らないまま、去年の世界3位まで来た司令塔です。
    short_only: true
  - text: 今季はここまで10試合で1得点1アシスト、出場時間は824分。
    image: assets/images/20261005_vitinha_wc2026_wide/01.jpg
  - 点ではなく、時間で見る選手です。
  - リーグ・アンは5試合で1点1アシスト。10点満点の評点の平均は7.9。
  - 直近5試合、クラブでは全部90分。マルセイユとのクラシックは評点8.3でした。
  - 代表の直近2試合は0点で、ノルウェー戦は35分で交代。評点6.4です。
  - 干された年から6年。いまは、欧州を2年続けて制したチームの中盤の真ん中にいます。
