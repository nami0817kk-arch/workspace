      - [形, キャリア初の頭でのゴール]
      - [時間, 2対2の67分]
      - [結果, 決勝点、4対2で勝利]
      source: ESPN・SAPO
      highlight_row: 0
  - text: 同点で迎えた67分。ブルーノ・フェルナンデスのボールに、頭で飛び込みます。
    emph: true
    card:
      <<: *goal_card
      highlight_row: 2
  - text: これが、その夜の決勝点になりました。
    card:
      <<: *goal_card
