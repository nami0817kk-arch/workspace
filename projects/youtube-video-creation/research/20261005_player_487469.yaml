  say:
  - text: ヴィティーニャの武器と弱点を、同じMFと並べた数字で。
    image: assets/stats/player_20261005_1061249_radar.png
    no_telop: true
  - レーダーの6つの軸のうち、パスとボールタッチは最上位。空中戦と守備の関与は最下位です。
  - text: ボールを持つ場所は中盤の全部。DFの隣にも、GKのそばにも降りていきます。
    image: assets/stats/player_20261005_1061249_heat.png
    no_telop: true
  - 今季のパス成功は5試合で457本、1試合90本以上。ロングボールの成功52本も最上位です。
  - 昨季のチャンピオンズリーグでは、パス成功1,448本。1大会の記録です。
  - text: シュートは今季12本で1点。得点力は後から付いた側で、初のハットトリックは去年11月でした。
    image: assets/stats/player_20261005_1061249_shots.png
    no_telop: true
  - 弱点は空中戦と守備の量。守備のアクションは同じMFの中で下から24番目。体は172センチです。
  - 他者の評を1つ。スペイン代表のペドリは、こう言っています。
  - voice: ペドリ
    text: 彼と対戦したとき、本当に驚いたのは、
  - voice: ペドリ
    text: とんでもなく走ることだ。
    cont: true
  - voice: ペドリ
    text: 彼は決して止まらない
    cont: true
    pause: 0.5
