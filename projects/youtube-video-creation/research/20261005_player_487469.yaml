  say:
  - text: ヴィティーニャは11歳でポルトへ。
    image: assets/images/20261005_vitinha_usa2026/01.jpg
  - 2019年、ヨーロッパのユースリーグの決勝で優勝しています。
  - text: 市場価値の線は、2020年のウルヴァーハンプトンで止まり、そこから跳ねています。
    image: assets/stats/player_20261005_1061249_value.png
    no_telop: true
  - 2020年9月9日、ウルヴァーハンプトンへレンタル。
  - プレミアリーグ19試合、先発は全公式戦で7回、1点。買い取りは見送られました。
  - 翌年ポルトへ戻り、47試合でリーグとカップの2冠。若手の年間最優秀です。
  - 2022年6月30日、契約解除金4,000万ユーロでパリ・サンジェルマンへ。
  - 2025年5月31日、チャンピオンズリーグ決勝でインテルに5対0。
  - 中盤の軸として、初優勝です。
  - 2026年5月30日、アーセナルとの決勝で連覇。市場価値はいまの額に。
  sources:
