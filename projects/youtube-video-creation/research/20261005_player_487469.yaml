- id: story
  heading: マル秘話
  tier: 報道
  telop: 父と、幼なじみと、「イラク」と呼ばれた土のグラウンド
  narrator: 解説
  card:
    type: points
    title: ヴィティーニャの原点
    items:
    - 父もプロのMF。「監督より、父親でいることを選んだ人」
    - 幼なじみはGKのディオゴ・コスタ。同じ町のクラブで育った
    - 練習場は荒れた土のグラウンド。指導者は「イラク」と呼んでいた
  say:
  - text: ピッチの外のヴィティーニャを支えるのは、元プロの父です。
    image: assets/images/20261005_player_487469/usa96/01_w.jpg
  - 1999年には、ポルトガル杯の決勝への勝ち上がりを支えた中盤の選手でした。
  - 本人いわく、その父は一度もサッカーを強いなかったそうです。
  - ロッカールームの流儀を知り尽くしながら、監督より父親でいることを選んだ人だと。
  - text: もう1人、欠かせないのが幼なじみです。
    card: none
  - 代表のGKディオゴ・コスタとは、同じ町のクラブで育ちました。
  - 練習場は荒れ果てた土のグラウンド。指導者はそこを「イラク」と呼んでいました。
  - そこから2人そろって、ポルトを経てワールドカップの舞台へ。
  - パリで才能を開かせてくれた指揮官のことは、こう語っています。
  - voice: ヴィティーニャ
    text: 彼はおそらく僕のキャリアに最も影響を与えた人物だ
  - voice: ヴィティーニャ
    text: すごく面倒だけど、でも、それがいいんだ。
    cont: true
  - voice: ヴィティーニャ
    text: だって、上達できるから
    cont: true
    pause: 0.6
  sources:
  - https://jornal-desportivo.pt/2025/06/06/vitinha/
  - https://www.elespanol.com/deportes/futbol/20260606/vitinha-anos-padre-nunca-obligo-jugar-gran-inspiracion-entiende-perfectamente-camino-dt/1003744275187_0.html
  - https://afporto.pt/noticias/pinheirinhos-de-ringe-transformaram-o-iraque-em-oportunidade/
  - https://www.goal.com/jp/ニュース/psg-vitinha-luis/bltc8c45f96615df320
- id: view
  heading: 去年の自分と比べたパスの量と、10月の2つの節目
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10日にル・マン戦、26日にバロンドール授賞式
  say:
  - text: 最後に、これからのヴィティーニャを、パスの数から見立てます。
    image: assets/images/20261005_player_487469/wc2026/01_w.jpg
  - 物差しは、去年の自分です。
  - 昨季のチャンピオンズリーグは、90分あたり90.6本のパス成功。
  - text: 大会は違いますが、今季のリーグは95.9本。量はむしろ増えています。
    emph: true
  - クラブは現地10日、本拠地でのル・マン戦から再び動き出します。
  - 26日はロンドンで、バロンドールの授賞式。
  - 去年3位の本人は、今年も30人の候補に入っています。
  - 去年、3位が決まったあとには、こう書いていました。
  - voice: ヴィティーニャ
    text: 今年より上を目指すのは難しいか？ そうだ。
  - voice: ヴィティーニャ
    text: でも、もっと欲しがるのをやめたくない
    cont: true
    pause: 0.6
  - パスの量と、90分出続けること。この2つが今季も続くかに注目です。
  sources:
  - https://theanalyst.com/articles/vitinha-psg-reinvention-champions-league-final-stats
  - https://www.fotmob.com/players/1061249
  - https://www.soccer-king.jp/news/world/20260909/2202579.html
  - https://www.goal.com/en-us/lists/vitinha-priviliged-finish-behind-ousmane-dembele-lamine-yamal-ballon-d-or-praises-psg-co-star-world-best/blt2e69b5aaf27ed094
