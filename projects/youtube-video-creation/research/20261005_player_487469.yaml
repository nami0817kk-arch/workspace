- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 干された年に言った未来を、2年で現実にした
  narrator: キャスター
  say:
  - text: ヴィティーニャ。全部のパスを自分で受けに行く、172センチの司令塔です。
    image: assets/images/20261005_vitinha_usa2026_w/01.jpg
  - 同じMF100人の中で、パスの成功数は最上位。空中戦と守備の関与は、最下位に近い。
  - 2020年、ウルヴァーハンプトンにレンタルされて1年干されました。プレミアの先発は数えるほど。
  - その年、同僚にこう言ったそうです。ポルトに戻って大暴れして、翌年は欧州ベスト8のクラブでやる、と。
  - そのとおりになりました。今年5月、チャンピオンズリーグ決勝の最優秀選手に選ばれて、こう。
  - voice: ヴィティーニャ
    text: 今日、僕らはヨーロッパで最高のチームだと言える
    pause: 0.5
  - その道のりを、数字と話でたどります。
