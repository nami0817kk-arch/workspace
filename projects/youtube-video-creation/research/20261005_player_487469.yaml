- id: goal
  heading: 代表46試合目の初ゴールは頭
  tier: 報道
  main: true
  telop: 10月1日、敵地デンマーク戦の67分
  narrator: 解説
  say:
  - text: パリ・サンジェルマンの司令塔ヴィティーニャが、代表46試合目でついに初ゴール。
    short_only: true
    image: assets/images/20261005_player_487469/usa93/01_w.jpg
  - voice: ヴィティーニャ
    text: 2つの初めてだった。キャリアで初めての頭のゴールで、
  - voice: ヴィティーニャ
    text: 代表でも初めてのゴールだ。
    cont: true
  - voice: ヴィティーニャ
    text: 遅くても、ないよりはずっといい
    cont: true
    pause: 0.5
  - text: 10月1日、敵地でのデンマーク戦。ポルトガルが4対2で勝った一戦です。
    image: assets/images/20261005_player_487469/wc2026/01_w.jpg
    card: &goal_card
      type: table
      title: 代表初ゴール（10月1日 デンマーク2-4ポルトガル）
      columns: [項目, 内容]
      rows:
