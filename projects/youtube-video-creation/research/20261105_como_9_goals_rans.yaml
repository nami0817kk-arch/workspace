#       69分 バトゥリナ（アシスト リベラリ）／90+1分 パパッチョーリ（アシスト リベラリ、VARで得点認定）。
#       シュート コモ18本（枠内12）・ランス11本（枠内3）、支配率 コモ57.3%。
