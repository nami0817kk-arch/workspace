# 食い違い: ・90分すぎの9点目: サッカーキングは「90+2分」、ESPN の試合データは「90+1分」→ ESPN に従い「90+1分」。
#   ・ダ・クーニャ（ESPN: Lucas da Cunha）・パパッチョーリ（Matteo Papaccioli）の表記はサッカーキングに合わせた。
