#   ・ESPN の試合データ（site.api.espn.com uefa.champions summary event=401915305、2026-11-04 20:00Z、スタッド・ボラールト＝ドゥリス）: ランス 1-9 コモ。
#       7分 ドゥヴィカス（アシスト ペローネ、CKの流れ）／32分 ドゥヴィカス（アシスト バジェ）／40分 ニコ・パス（アシスト ドゥヴィカス）／47分 ダ・クーニャ（アシスト ニコ・パス）／
