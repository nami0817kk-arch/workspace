        card: {<<: *nowcard, highlight_row: 得点}
      - text: ギュレルは10試合で2点3アシスト。出場時間は612分と594分で、ほぼ同じです。
        image: assets/images/20261029_compare_636703_861410/g3/01.jpg
        card: {<<: *nowcard, highlight_row: 出場時間}
      - text: 1つ点に絡むのにかかった時間は、フェルミンが約87分、ギュレルが約119分。
        emph: true
        image: assets/images/20261029_compare_636703_861410/f3/01.jpg
        card: {<<: *nowcard, highlight_row: 1つ絡むのにかかった時間}
      - text: ただ、2人とも出場はまだ600分ほど。シーズンは始まったばかりです。
        image: assets/images/20261029_compare_636703_861410/pair_b/01.jpg
        card: none
