# カルレス・プジョル（元スペイン代表DF、バルセロナ一筋・主将10シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-18 用。型は 11/14 ザネッティと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Carles Puyol の成績表・本文・Honours、2006 / 2011 FIFA Club World Cup final、2010 FIFA World Cup knockout stage）と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**。引退後の役職は台本で言わない。
# **重なりの確認（2026-11-12）**：scripts/・research/covered.yaml・research/posted.json・research/2026111*_picks.txt を「プジョル／Puyol」で grep。主役の回は無し（ロナウジーニョ・ガーディオラの回に名前が出るだけ）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス・ルーニー・ブッフォン・ラウール・ザネッティ）と重ならない。11/16 のレジェンドはクロース（レアル）で別。同じ日（11/18）の別シリーズとの重なりは research/20261115_picks.txt で確認。
# **引退の確認**：Wikipedia「Barcelona bid farewell to Puyol on 15 May 2014 ... He announced his retirement shortly after at the age of 36」。出典に CBC「Barcelona great Carlos Puyol retires」（2014-05-15）・The Independent（2014-03-04、退団の発表）。→ 現役ではない（48歳）。
# **日本との接点**：①2006-12-17 クラブW杯決勝（横浜国際総合競技場、観客67,128）インテルナシオナル 1-0 バルセロナ（82分）。ラインナップ表にプジョル（主将）が先発。②2011-12-18 クラブW杯決勝（同会場、観客68,166）サントス 0-4 バルセロナ（メッシ17・82分、シャビ24分、ファブレガス45分）。ラインナップ表でプジョル（主将）が先発、85分に交代。2011-12 の成績表の注にクラブW杯2試合。どちらも Wikipedia の試合ページ。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：バルセロナ 593試合18点（リーグ392/13、国内カップ58/4、欧州131/2、その他12/0）。スペイン代表 100試合3点。クラブと代表の合計 693試合21点（自分で足した値：593+100、18+3）。Barcelona B/C（90試合6点）は除く。infobox の「リーグのみ 482試合19点」は使わない。サムネの表：バルセロナ 593/18、スペイン代表 100/3、合計 693/21。
# - 主要タイトル18個（本文の冒頭）：ラ・リーガ6（2004-05・05-06・08-09・09-10・10-11・12-13）、国王杯2（08-09・11-12）、スーパーカップ（国内）4（2005・2006・2009・2010）、CL3（2005-06・08-09・10-11）、UEFAスーパー杯1、クラブW杯2（2009・2011）＝18。**全部、主将になった2004-05以降**（Honours の年）。Wikipedia の別の箇所には「15年で21個」とあり食い違うので、台本は18個（冒頭の数え方）だけを使う。
# - 主将：2004年8月（Wikipedia 冒頭）／「2003-04 の終わりにルイス・エンリケの引退を受けて」（本文）。どちらも 2004-05 の開幕からで一致。2014年まで。10シーズン。
# - 2010年W杯準決勝（2010-07-07、ダーバン）スペイン 1-0 ドイツ。73分、シャビのCKをプジョルがヘディング（Wikipedia 2010 World Cup knockout stage）。スペインのW杯決勝進出は初。決勝はオランダに1-0（延長、プジョルは120分出場）。全試合先発、失点は大会で2、決勝トーナメントは無失点（本文）。スペイン代表のゴールは3点（2002・2008・2010）。
# - 2009-05-02 ベルナベウのクラシコ（6-2）でゴール、カタルーニャ旗の腕章にキス。2011年CL決勝（ウェンブリー、マンU 3-1）は最後の6分に出場。19歳のとき（1999）、ファン・ハール監督に髪を切るよう言われたが切らなかった（本文）。
# - 2013-02-06 スペイン代表100試合目・最後の試合（ウルグアイ 3-1、ドーハ、主将）。2014-03-02 クラブの歴代リーグ戦出場で2位（1位シャビ）、2014-03-04 シーズン限りでの退団を発表、2014-05-15 別れの式。
# **山場**：2010年W杯準決勝。プジョルの決勝ゴールを、結果と記録で語る。
# **本人の言葉**：取れていない（本文の2010年の発言は英語の引用で、原文の確認が済んでいないので使わない）。声の行は置かない。
# **見立て（自分で足した・割った値）**：バルセロナの季ごと（公式戦）99-00 37、00-01 24、01-02 51、02-03 46、03-04 38（主将になる前の5季＝196試合）、04-05 45、05-06 52、06-07 55、07-08 47、08-09 45、09-10 48、10-11 27、11-12 44、12-13 22、13-14 12（主将の10季＝397試合）。合計593と一致。主要タイトル：主将になる前0個、主将の10季で18個（1季あたり1.8）。
# **入れなかったもの**：私生活・家族・慈善活動、引退後の役職、2012年の肘と膝の手術の細かい経過、2002年W杯のオウンゴール、ほかの選手との比較、「最多」「史上初」の数え方（W杯決勝進出が史上初である点だけ使用）。
# **読みで怪しいもの**：カルレス・プジョル（プヨルとも）、カタルーニャ、バルセロナ、ファン・ハール、インテルナシオナル、サントス、メッシ、シャビ、ファブレガス、ダーバン、ウェンブリー、クラシコ、ベルナベウ、マンチェスター・ユナイテッド。
