- id: view
  viewpoint: true
  heading: 見立て・ボーンマスは、売らずに黒字にできるのか
  tier: 背景
  telop: 売った利益は、入場料の約13.5倍。本業の赤字は約680万広がった
  narrator: 解説
  card: &view_wf
    type: waterfall
    title: 本業の損益の動き（百万ポンド）
    unit: 百万ポンド
    start: &vw_start [2023-24の本業の損益, -55.9]
    steps: &vw_steps
    - [収入（貸し出しを含む）, 29.5]
    - [人件費, -22.3]
    - [償却とその他の費用, -14.0]
    total: &vw_total [2024-25の本業の損益, -62.7]
  say:
  - text: ここからは見立てです。本業の動きと、売却の大きさを比べます。
    image: assets/images/20261110_finance_bournemouth/02_w.jpg
    card: none
  - text: 売却を除くと、本業の損益は、5595万から6274万ポンドの赤字へ。
    emph: true
    card: *view_wf
  - text: 記録の年に収入は増えても、赤字は約680万ポンド広がっていました。
    card: *view_wf
  - text: いちばん大きく引き下げたのは、人件費の増えです。
    card:
      type: waterfall
      title: 本業の損益の動き（百万ポンド）
      unit: 百万ポンド
      start: *vw_start
      steps: *vw_steps
      total: *vw_total
      highlight: 人件費
  - text: いっぽう売却の利益は、入場料の収入の約13.5倍にあたります。
    emph: true
    image: assets/images/20261110_finance_bournemouth/01_w.jpg
    card: &view_table
      type: table
      title: 自分で割ってみた（ボーンマスの決算）
      columns: [比べ, 答え]
      rows:
      - [選手を売った利益 ÷ 入場料, 約13.5倍]
      - [人件費 ÷ 入場料, 約23.5倍]
      - [人件費 ÷ 収入, 約87%]
      highlight_row: 0
    mark:
      kind: circle
      row: 0
      col: 1
  - text: 人件費は入場料の約23.5倍。スタジアムのお金だけでは、とても回りません。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 題への答えです。黒字に変えたのは、ソランケとハイセンたちの売却。
    image: assets/images/20261110_finance_bournemouth/07_w.jpg
    card: none
  - text: 親会社も7750万ポンドを貸し、年度末までに貸付は返済と株への切り替えで0に。
    image: assets/images/20261110_finance_bournemouth/03_w.jpg
    card: none
  - text: 決算のあとの夏にも、選手を売って3961万ポンドの利益が出ました。
    card: none
  - text: 同じ夏に、選手の獲得には1億1588万ポンドを使っています。
    card: none
  - text: 売って黒字、買って本業は赤字。
    image: assets/images/20261110_finance_bournemouth/04_w.jpg
    card: none
  - text: 次に売る選手が育つまで、ボーンマスはこの形を続けられるのか。
    emph: true
    image: assets/images/20261110_finance_bournemouth/04_w.jpg
    card: none
