  - text: 決まった額を払えば引き抜ける、5000万ポンドの条項を、レアルが使いました。
    card: none
  - text: 選手を貸し出して得たお金も、前の年の約1.8倍の1520万ポンドに。
    card: none
    image: assets/images/20261110_finance_bournemouth/08_w.jpg
  - text: 利息の支払いなどを差し引くと、税を引く前で1489万ポンドの黒字。
    emph: true
