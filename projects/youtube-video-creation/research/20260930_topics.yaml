  head: FIFA、UEFA を「誤情報キャンペーン」と非難。W杯の民間投資案をめぐって米国の裁判所で応酬
  why: 'インファンティーノ会長の投資案（評価額200億ドル）をめぐる法廷の争い。UEFA は来年の会長選に対立候補を立てようとしている。選手が出てこず、画にしにくい。 '
