title: 9月30日の題材
lead: 代表戦の翌々日の選手コメントと、欧州の移籍・けが・マンCの続報から17件。番号だけ振ってあります
note: <b>○×を付けてください。</b>9/29 の夜はクラブの試合がありません（代表ウィーク）。ロマーノの投稿は読めました（11・12・15番と10番の主将の件）。中身は記事の本文まで確かめてあります。今日の10本と同じ題材・同じ人の言葉は外しました。レオン（いまはトルコのリーグ）は扱うリーグの外なので外しました。
items:
- num: 1
  slot: 日本人
  head: 板倉滉が練習復帰「自分が合流できたので大丈夫」。主将に堂安律を推したのも自分だった
  why: '24日のウルグアイ戦で左足首を痛めた板倉が29日に練習復帰。10/1 エクアドル戦に出られる可能性。W杯で主将だった板倉が、森保監督に「律で間違いないと思います」と伝えたと明かした。本人の言葉が主役。 '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459942-459942-fl
  fmt: quote
- num: 2
  slot: 日本人
  head: 中村敬斗、10人のベネズエラ戦で初めての左サイドバック「想定としては良かった」。4-4-1で勝ち切った裏側
  why: '交代枠を使い切ったあとに渡辺剛が負傷し、DFは伊藤洋輝と鈴木淳之介の2人だけ。中村と伊東がサイドバックに入った。「一人足りない中でも点を取る力、勝ち切る力がある」。今日の VAR・伊東の回とは中村の側から。 '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459951-459951-fl
  fmt: quote
- num: 3
  slot: 日本人
  head: 主将・堂安律、23歳の松木玖生に「僕も教わるところがある」。若手の何を見ているのか
  why: '初招集でウルグアイ戦に代表初ゴールの松木について「一緒に生活していてメンタリティがすごい」。主将としての戦績は4戦全勝。松木本人の言葉は無い。 '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/japan/detail/?459954-459954-fl
  fmt: quote
- num: 4
  slot: 日本人
  head: 渡辺剛もケガで離脱し、望月ヘンリー海輝を約1年ぶりに追加招集。森保ジャパンのDF陣に負傷者が続く
  why: '渡辺（フェイエノールト）は右ふくらはぎ。冨安は不参加、安藤智哉・熊坂光希もケガで離脱、鈴木淳之介も試合後に病院へ。10/1 エクアドル戦の最終ラインが誰になるか。望月本人の言葉は無い。 '
  src: サッカーキング・スポニチ（9/29）
  url: https://www.soccer-king.jp/news/japan/national/20260929/2210889.html
  fmt: news
- num: 5
  slot: 日本人
  head: 齋藤俊輔、代表デビューの直後に英バーミンガムが関心か。本人は「鎌田大地、遠藤航のように」
  why: 'ウェステルローで今季リーグ7試合3得点。関心の根拠は英メディア1本の又聞きで、クラブの動きは確かめられていない。本人の言葉は9/29のものではない。 '
  src: Football Tribe Japan（9/29）
  url: https://football-tribe.com/japan/2026/09/29/359817/
  fmt: news
  weak: true
- num: 6
  slot: 日本人
  head: エクアドル代表、パリSGのパチョやミランのエストゥピニャンが来日。10月1日に日本と対戦する相手の顔ぶれ
  why: 'W杯ベスト32、24日に韓国に0-3で敗れている。日本人は出てこないので、「日本人の次の相手」の形（相手の今・顔ぶれ・過去の対戦）で作る回。 '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/world/detail/?459987-459987-fl
  fmt: news
  weak: true
- num: 7
  slot: 日本人
  head: 旗手怜央が結婚を報告。セルティックからバーンリーへ移った今季「僕たちにとっても新たなスタート」
  why: '本人のインスタグラムでの報告。サッカーの中身は薄い（今季リーグ4試合、代表は昨年3月が最後）。 '
  src: ゲキサカ（9/29）
  url: https://web.gekisaka.jp/news/world/detail/?459935-459935-fl
