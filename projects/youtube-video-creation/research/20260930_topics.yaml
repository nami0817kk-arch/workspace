  weak: true
- num: 8
  slot: プレミア
  head: ポチェッティーノ、マンCの違反報道に「欺かれていた時代を生きていたことになる」。補強できなかったスパーズ時代を振り返った
  why: 'トッテナムとチェルシーを率いた現アメリカ代表監督の言葉。「私たちにはとても厳しかったのに、よそにはずいぶん甘かった」「時間は巻き戻せない」。115件のほぼすべてが認められたという報道の段階で、正式発表ではない。9/28 の2本とは語る人が違う。 '
  src: Sky Sports・MARCA（9/29）、ロマーノの投稿
  url: https://www.skysports.com/football/news/11661/13593126/man-city-charges-we-lived-through-a-period-of-deception
  fmt: quote
- num: 9
  slot: プレミア
  head: ルーニー「2012年の優勝は受け取れない」。マンCが剥奪されてもメダルを求める元同僚と逆の立場
  why: 'ファーディナンドとデ・ヘアは優勝を回すよう求めた。ルーニーは「あの年、僕らは優勝に値しなかった」「持っている5つで満足だ」。アグエロの劇的な決勝点の年。元はポッドキャストで、記事はタブロイド1本。8番と1本にまとめることもできる。 '
  src: Daily Mail（9/29）
  url: https://www.dailymail.com/sport/football/article-16166817/wayne-rooney-man-united-man-city-title.html
  fmt: quote
  weak: true
- num: 10
  slot: ラ・リーガ
  head: ラフィーニャ、ブラジル代表の新主将に。偽9番でPK弾のあと前半で交代、右太ももに違和感でバルサに不安
  why: 'アンチェロッティ「プレーを次の段階に上げていて、統率でも助けてくれる」。オーストラリア戦でPK。今季はクラブと代表で毎試合得点に絡み、15得点4アシスト。けがの程度は検査待ちなので、結果が出てから作るほうが確実。 '
  src: MARCA（9/29）、ロマーノの投稿（CBF 発表）
  url: https://www.marca.com/futbol/barcelona/2026/09/29/raphinha-sustituido-brasil-molestias-musculares.html
  fmt: news
- num: 11
  slot: ラ・リーガ
  head: カマヴィンガ「W杯を逃したのは本当にこたえた」。レアルで先発に足りないものを聞かれて答えた一言
  why: 'ジダンのフランス代表に呼ばれて「僕にとっては勝ちだ」「落ち込みっぱなしにはならなかった」。先発に足りないのは「安定感だと思う」。本人の言葉が主役。 '
  src: ロマーノの投稿（9/28、フランスのメディアの取材）
  url: https://x.com/FabrizioRomano
  fmt: quote
- num: 12
  slot: その他
  head: ファビアン・ルイス「バロンドールのチャンスはある」「いつかベティスに戻りたい」。主要タイトルを全部獲った男の言い分
  why: 'パリSGのMF。30人の候補に入っていて、投票は締め切り済み（発表は10/26）。「宣伝するものじゃない」「今はパリSGで幸せ。いつか必ず戻る」。 '
  src: ロマーノの投稿（9/28）
  url: https://x.com/FabrizioRomano
  fmt: quote
- num: 13
  slot: その他
  head: コモのセスク監督に特別な退団条項か。バルサ・アーセナル・チェルシーから声がかかれば、安い違約金で出られる
  why: '2028年6月までの契約。コモを21年ぶりのセリエA、クラブ初のCLへ。記者1人の報道を伝え直したもので、金額は出ていない。実際に声がかかったわけではない。 '
  src: MARCA・Foot Mercato（9/29、元は Sky Sport イタリア）
  url: https://www.marca.com/futbol/barcelona/2026/09/29/cesc-ambicioso-asegura-liberacion-barca-le-llama.html
