# 取材メモ（10/10 題材 city_around、型は news、日本人以外の枠。**ショートだけ出す**）。
#   材料の控えは research/raw/20261010_city_around_material.md。
# **4人は「周りの第三者」ではない**。コンパニ＝バイエルンの監督でシティの元キャプテン、
#   ハーランド＝シティの選手、シャビ・アロンソ＝**チェルシー**の監督（2026-07-01 就任）、
#   イラオラ＝**リヴァプール**の監督（2026-06-04 就任）で、**10月11日にシティを迎える側**。
#   シャビ・アロンソをレアル・マドリード、イラオラをボーンマスと書かない。
# 事実の土台（判定の中身・一次情報・控訴の期限）は **city_carrick の本に置いた**。この本では繰り返さない。
# **件数は言わない**（判断の本文は「100を超える」だけ）。
# **タイトル剥奪ができるかは、公開された文書から確かめられていない**。「8個が消える」と言わず、
#   「8個が問われている季の中にある」までにする。剥奪の見通しは報道の見立てなので台本に置かない。
# 発言は各媒体の原文から。移籍情報の記者の投稿は、ハーランドの1行が写し間違い
#   （"We matter what happens in life" → 原文は **"No matter what happens in life"**）なので使わない。
#   シャビ・アロンソの2文も投稿では1文につながれているので、原文どおり分けて引く。
#   イラオラの原文にある補いの丸括弧は、括弧ごと引かない。
# **ハーランドは会見ではなく単独インタビュー（10月8日）**。台本で「会見で」と言わない。
# ハーランドの通算得点は1つの出典で日付つきに固められなかったので、**数字そのものを台本に置かない**。
# ESPN の20クラブのまとめは「全員が中身を避けた」という傾向を言うためだけに使い、個々の発言は引かない。
# **会見の場所は書かれていない**。媒体名は画面にも読み上げにも出さない。
# 写真：kompany/01＝Commons（CC0 / Timmy96、2023年）、haaland/01＝記事の og:image（シティの試合後、横1600）、
#   pair/01＝2枚を横に並べた1枚（冒頭と本文）、pair/01_v＝その縦版。サムネは versus で2人を左右に。
# ネットの反応は集めていない（この題材で実在する投稿を当たっていないため、作らない）。
