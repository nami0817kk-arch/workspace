    card:
      <<: *view_table
      highlight_row: 0
  - text: バルセロナとパリでは、勝率が7割前後に上がります。
    emph: true
    mark: {kind: circle, row: 2, col: 2}
    card:
      <<: *view_table
      highlight_row: 2
  - text: バルセロナの1年目、先発を固めた時期から、白星が続くようになります。
    image: assets/images/20261102_manager_luisenrique/03_w.jpg
    card: none
  - text: パリでの勝ち数127は、欧州5大リーグの監督で最も多い数字です。
    image: assets/images/20261102_manager_luisenrique/02_w.jpg
    card: none
