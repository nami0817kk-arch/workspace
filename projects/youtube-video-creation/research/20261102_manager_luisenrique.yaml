# 監督紹介：ルイス・エンリケ（11/2 月、シリーズ「監督紹介」、key: manager_luisenrique、型は news）。9節の型（2026-10-20 決定）。見本は 20261029_manager_ferguson。
# 順：フック→基礎DATA→日本との接点（基礎DATAの次）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-10-31）**：大物の監督で、まだ出していない人。出し済み＝グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ヴェンゲル・ファーガソン・トゥヘル。
#   ・ジダンは scripts に 20261003_coach_zidane・20261018_zidane_legend・20261024_team_france があり、直近30日に重なるので外した。
#   ・ポチェッティーノは 20260911_poch（30日より前だが近い）、コンテは日本との接点が薄い、シャビ・アロンソ（brief の候補10）は日本との接点が薄いと brief にある。
#   ・ルイス・エンリケ：欧州の大会で現役最多級の実績（CL3回）＋日本との接点が2つ（2015年クラブW杯＝横浜の決勝、2022年W杯＝日本に1対2）。
#   **重なりの確認（2026-10-31 に自分で）**：research/posted.json に「エンリケ」0件、research/covered.yaml は 2件のみ（10/15 PSG対シティ後の一言・10/26 クヴァラのショート。どちらもニュースの短い題材で「監督紹介」ではない）。
#   scripts は 20261026_luis_enrique_kvara・20261027_spain_three_awards・20261022_team_spain に名前が出るだけ（監督紹介としての本は無い）。同日10/31 の本は トゥヘル。
#
# **いまの立場（一次情報で確かめた）**：現役。パリ・サンジェルマンの監督（2023-07-05〜）。
#   ○ PSG公式（https://www.psg.fr/en/content/a-new-record-for-luis-enrique-havre-ac-paris-saint-germain-ligue-1-2026-2027 、控え research/raw/20261102_psg_a-new-record-for-lui.txt、2026-10-31 取得）：
#     「Paris Saint-Germain recorded a 5-1 win over Le Havre AC in Matchday 9 of Ligue 1 on Friday 30 October 2026 … the 127th victory in all competitions for coach Luis Enrique … a new record in club history.」
#     「127 wins and just 27 losses (a 67.6% win rate …) in 188 matches as head coach.」→ 引き分けは 188-127-27＝34。「he recently extended his contract … through to 2030」。
#     「The first coach to win the UEFA Champions League with Paris (2025, 2026) … French champion (2024, 2025, 2026), Coupe de France (2024, 2025), Trophée des Champions (2024, 2025, 2026), UEFA Super Cup (2025, 2026), FIFA Intercontinental Cup (2025)」→ 3+2+3+2+1+2＝13 個（自分で足した）。
#     「leads Mikel Arteta (121), Pep Guardiola (116), Diego Simeone (110), Unai Emery and Xabi Alonso (101)」「188 matches … ahead of Arteta (187), Simeone (186), Emery (183), Guardiola (180)」（欧州5大リーグの全大会の勝ち数・試合数。2023年夏から）。
#   ○ PSG公式の試合後コメント（…luis-enrique-be-as-competitive-as-possible-reactions-le-havre…、控え 20261102_psg_luis-enrique-be-as-c.txt）：英語の訳が公式サイトに載っている。台本は日本語に訳した（訳の訳であることは台本で断らず、取材メモに残す）。
#   ○ PSG公式トップページ：次の試合は 11月3日（火）ビジャレアル対パリ（大会名は未確認なので台本では「ビジャレアル戦」とだけ言う）。
#   ○ 英語版 Wikipedia「Luis Enrique」（控え research/raw/20261102_luisenrique_wiki.txt・_plain.txt、2026-10-31 取得。Managerial statistics は「match played 30 October 2026」まで更新）。
#
# **通算（台本とサムネをそろえる。トップチームのみ＝バルセロナBは除く）**＝英語版 Wikipedia「Managerial record by team and tenure」（UEFA の表が出典）：
#   バルセロナB 124試合59勝40分25敗（**除く**）／ローマ 42試合17勝9分16敗／セルタ 40試合15勝7分18敗／バルセロナ 181試合138勝22分21敗／
#   スペイン代表 8試合6勝0分2敗（2018-07〜2019-03）＋39試合20勝14分5敗（2019-11〜2022-12）＝47試合26勝14分7敗／パリ 188試合127勝34分27敗。
#   合計（表の Total 622試合382勝126分114敗）−バルセロナB（124・59・40・25）＝ 498試合323勝86分89敗。自分で足して一致（42+40+181+47+188＝498、17+15+138+26+127＝323、9+7+22+14+34＝86、16+18+21+7+27＝89）。
#   勝率（自分で割った）：通算 323/498＝64.9%、ローマ 17/42＝40.5%、セルタ 15/40＝37.5%、バルセロナ 138/181＝76.2%、スペイン代表 26/47＝55.3%、パリ 127/188＝67.6%（PSG公式の 67.6% と一致）。
#   ※パリ分は PSG公式で一致を確認。ほかのクラブ分は英語版 Wikipedia だけ（独立した出典では未確認）→ 台本は「通算」の数字を言うが、概要欄の確度は 報道。
#   タイトル（Honours・Manager）：バルセロナ＝リーグ2・国王杯3・スーパーカップ（スペイン）1・CL1・UEFAスーパーカップ1・クラブW杯1＝9（自分で数えた）。パリ＝13（上の PSG公式から）。合わせて22。
#
# **基礎**：1970-05-08 スペイン・ヒホン生まれ（56歳）。選手：MF／FW。レアル・マドリード（1991-96、5季）→バルセロナ（1996-2004、8季、のち主将）。スペイン代表62試合12得点、1992年バルセロナ五輪で金メダル。2004-08-10 に34歳で引退。
#   監督：2008-05-26 バルセロナB（グアルディオラの後任）→2011-06 ローマ→2013-06 セルタ→2014-05-19 バルセロナ→2017-03-01 契約満了での退任を発表（6/30）→2018-07-09 スペイン代表（2019-03 辞任、2019-11 復帰、2022-12-08 退任）→2023-07-05 パリ。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**：
#   ・2015 FIFA Club World Cup（日本開催、12/10〜20）：バルセロナ（監督ルイス・エンリケ）は準決勝で広州恒大に3-0、決勝は 2015-12-20 横浜の国際総合競技場でリーベル・プレートに3-0（英語版 Wikipedia「2015 FIFA Club World Cup」「…final」）。
#     「a record third Club World Cup title」。サンフレッチェ広島が3位（Wikipedia）。最優秀選手・得点王はスアレス（5点）。
#   ・2022 W杯 E組 最終戦 2022-12-01：日本2-1スペイン（英語版 Wikipedia「2022 FIFA World Cup Group E」）。前半モラタで1-0、後半の立ち上がりに堂安律、続けて田中碧。日本が首位、スペインは2位。
#     スペインは16強でモロッコにPK0-3で敗退、ルイス・エンリケはその大会のあと退任（stats の To＝2022-12-08）。
#   ※日本人選手との縁（指導した・対戦した個人）は確かめられていないので、台本に入れない。
#
# **戦術の色**（英語版 Wikipedia「FC Barcelona 6–1 Paris Saint-Germain FC」・Luis Enrique の Tactics）：2017-03-08 カンプ・ノウ、CL16強第2戦。第1戦（2017-02-14 パリ）は 0-4。
#   先発（Wikipedia の Details）：ブラボでなく ter Stegen、CB 3人＝マスチェラーノ・ピケ・ウンティティ、DM ブスケツ、RM ラキティッチ、LM イニエスタ、AM メッシ、前線＝ラフィーニャ・スアレス・ネイマール。
#   得点：スアレス3'、クルザワのオウンゴール40'、メッシ（PK）50'、カバーニ（PSG）62'、ネイマール88'（FK）・90+1'（PK）、セルジ・ロベルト90+5'。76分にラフィーニャ→セルジ・ロベルト。合計6-5。大会史上最大の逆転（Wikipedia）。
#   Wikipedia のプロフィール節「その季の3バックの形が、この逆転に効いた（instrumental）」。
#   ※その後：2023-24 準々決勝でパリ（監督ルイス・エンリケ）がバルセロナに合計6-4（1戦目 パリ 2-3 バルセロナ、2戦目 バルセロナ 1-4 パリ）。Wikipedia の match 記事。
#
# **本人の言葉**：2026-10-30 ル・アーヴル戦後の PSG公式コメント（上）。
#   ①「…that's what we're aiming for: to be as competitive as possible in every match, whoever the opponent.」
#   ②「The win record? I'm lucky enough to manage a club of this level and to have incredible players. I'm very happy and I hope to continue making history in Paris.」
#
# **マル秘話**：Wikipedia「Club career」「Personal life」：1995年1月にレアルの選手としてバルセロナに5-0で勝った試合で得点／1996年に契約満了で移籍金なしでバルセロナへ／最初はファンがためらったが主将に／
#   引退後はオーストラリアでサーフィン、2005 NYマラソン・2006 アムステルダム・2007 フィレンツェ・2007 フランクフルトのアイアンマン・2008 マラソン・デ・サーブルを完走。
#
# **入れなかったもの**：家族・娘の死去・病気、メッシ・トッティとのもめごと、ロベルト・モレノとの件（私生活ではないが審判の揉めごとと同じ扱いで外した）、レアル・マドリード選手を外した2020年の代表メンバー選び、
#   スペイン代表を2019年に離れた事情、PSGでのキックオフの戦術の細部（確かめきれない）、ニュースの反応・女子・お金・FotMob のパーセンタイル。
