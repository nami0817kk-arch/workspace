    highlight:
    - センターバック3人
    - あと3点
  say:
  - text: 戦い方の色がよく出たのが、2017年3月8日、カンプ・ノウでの試合です。
    image: assets/images/20261102_manager_luisenrique/03_w.jpg
    card: *style_doc
  - text: 決勝トーナメント1回戦の2試合目。相手はパリ・サンジェルマンでした。
    card: *style_doc
  - text: 第1戦はパリで0対4の負け。大会の歴史で、最大の逆転への挑戦です。
    card: *style_doc
  - text: ルイス・エンリケは、センターバックを3人並べて先発させます。
    image: assets/images/20261102_manager_luisenrique/01_w.jpg
    card: *style_doc
  - text: 前には、ラフィーニャ、スアレス、ネイマールの3人です。
    card: none
  - text: 3点をリードして迎えた62分、カバーニに決められ、あと3点が必要に。
    image: assets/images/20261102_manager_luisenrique/01_w.jpg
    card: *style_doc
  - text: 76分、ルイス・エンリケはセルジ・ロベルトを入れます。
    card: none
  - text: 88分にネイマールのフリーキック。追加タイムに入って、ネイマールのPK。
    image: assets/images/20261102_manager_luisenrique/01_w.jpg
    card: none
  - text: そして追加タイム5分、セルジ・ロベルトが押し込んで、6対1の勝ちです。
    emph: true
    callword: 6対1
    card: none
  - text: 最後の7分間で3点。合計6対5で勝ち上がりました。
    image: assets/images/20261102_manager_luisenrique/03_w.jpg
    card: none
  - text: その後、今度はパリの監督として、同じバルセロナと準々決勝で当たります。
    image: assets/images/20261102_manager_luisenrique/02_w.jpg
    card: none
  - text: 2023年から24年のシーズンです。合計6対4で、パリが勝ち上がりました。
    card: none
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona_6%E2%80%931_Paris_Saint-Germain_FC
  - https://en.wikipedia.org/wiki/Luis_Enrique
