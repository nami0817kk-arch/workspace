- id: now
  heading: 引退したシャビは、いま何をしているのか
  tier: 報道
  telop: アル・サッド、バルセロナ、オランダ代表
  narrator: 解説
  card:
    type: timeline
    title: 引退から、いままで
    rows:
    - ['2019年', 引退。アル・サッドの監督に]
    - ['2021年11月', バルセロナの監督に]
    - ['2022-23季', リーガ優勝]
    - ['2024年', バルセロナを離れる]
    - ['2026年8月', オランダ代表の監督に]
    - ['9〜10月', 4戦して、2勝2分け]
    focus: 4
    highlight_row: 4
  say:
  - text: シャビが現役を退いたのは、2019年。すぐに、監督になります。
    image: assets/images/20261018_xavi_legend/x19_last_w.jpg
    card: &now_tl
      type: timeline
      title: 引退から、いままで
      rows:
      - ['2019年', 引退。アル・サッドの監督に]
      - ['2021年11月', バルセロナの監督に]
      - ['2022-23季', リーガ優勝]
      - ['2024年', バルセロナを離れる]
      - ['2026年8月', オランダ代表の監督に]
      - ['9〜10月', 4戦して、2勝2分け]
      focus: 4
      highlight_row: 0
  - text: アル・サッドでは、7つのタイトルを獲りました。
    card:
      <<: *now_tl
      highlight_row: 0
  - text: 2021年11月、古巣のバルセロナへ。
    card:
      <<: *now_tl
      highlight_row: 1
  - text: 就任して最初の通しのシーズン、リーガで優勝します。
    emph: true
    card:
      <<: *now_tl
      highlight_row: 2
  - text: 2024年に、バルセロナを離れました。
    card:
      <<: *now_tl
      highlight_row: 3
  - text: そして今年8月12日。オランダ連盟が、就任を発表します。
    image: assets/images/20261018_xavi_legend/x26_knvb.jpg
    card:
      <<: *now_tl
      highlight_row: 4
  - text: 契約は4年。オランダ人以外の監督は、1978年のハッペル以来です。
    card: none
  - text: 前任のクーマンは、W杯の決勝トーナメント初戦で、モロッコに敗れて辞めました。
    card: none
  - text: 初戦は9月24日。ヨーロッパの代表戦、ネーションズリーグのドイツ戦。
    card:
      <<: *now_tl
      highlight_row: 5
  - text: 終了間際のガクポのゴールで、1対1の引き分け。
    card:
      <<: *now_tl
      highlight_row: 5
  - text: 3日後のセルビア戦は、2対1。最初の勝ちです。
    card:
      <<: *now_tl
      highlight_row: 5
  - text: ギリシャと2対2、セルビアと2対1。ここまで、2勝2分けです。
    emph: true
    card:
      <<: *now_tl
      highlight_row: 5
