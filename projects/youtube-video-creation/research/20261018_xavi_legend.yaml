- id: story
  heading: 12歳の涙と、バイエルンの話
  tier: 報道
  telop: マル秘話 ウェンブリーの涙と、バイエルンの話
  narrator: 解説
  card:
    type: table
    title: マル秘話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['1992年', 12歳のシャビは、ウェンブリーに行けなかった]
    - ['2008年', ユーロの最中、バイエルンの話が届いた]
    source: The Guardian・Marca
  say:
  - text: マル秘話を2つ。1つ目は、少年時代の涙です。
    image: assets/images/20261018_xavi_legend/x12_capt_w.jpg
    card: &story_card
      type: table
      title: マル秘話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: The Guardian・Marca
      highlight_row: 0
  - text: 1992年、バルセロナが欧州王者になった、ロンドンのウェンブリー。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 12歳のシャビは、兄たちが行くのに、親に止められました。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 泣いても、行けませんでした。のちに、本人はこう口にしています。
    emph: true
    card:
      <<: *story_card
      highlight_row: 0
  - voice: シャビ
    text: ウェンブリーでやりたい。バルサにとって特別な場所だ。
  - voice: シャビ
    text: サッカーにとっても、特別な場所なんだ。
    cont: true
    pause: 0.5
  - text: その3か月半後、2011年5月28日。
    card:
      <<: *story_card
      highlight_row: 0
  - text: ウェンブリーの決勝で、バルセロナは、マンチェスター・Uに3対1。
    card:
      <<: *story_card
      highlight_row: 0
  - text: シャビは先発して、1アシストでした。
    emph: true
    card:
      <<: *story_card
      highlight_row: 0
  - text: 2つ目は、2008年のヨーロッパ選手権の最中です。
    image: assets/images/20261018_xavi_legend/x10_train_w.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 本人は、クラブが自分を売りたがっていると、聞かされていました。
    card:
      <<: *story_card
      highlight_row: 1
  - text: 代理人を通じて、バイエルンの話も届きます。
    card:
      <<: *story_card
      highlight_row: 1
  - text: ところが、バルセロナは、グアルディオラ、愛称ペップを監督に迎えます。
    card:
      <<: *story_card
      highlight_row: 1
  - text: のちに、本人はこう振り返っています。
    card: none
  - voice: シャビ
    text: ペップは、動くな、と言った。
  - voice: シャビ
    text: 君のいないチームは、想像できない、と。
    cont: true
  - voice: シャビ
    text: 僕は、心を奪われたよ。
    cont: true
    pause: 0.5
  quotes_from:
  - https://www.theguardian.com/football/2011/feb/11/xavi-barcelona-spain-interview
  - https://www.football-espana.net/2015/09/15/xavi-nearly-left-in-2008
  sources:
  - https://www.theguardian.com/football/2011/feb/11/xavi-barcelona-spain-interview
  - https://www.football-espana.net/2015/09/15/xavi-nearly-left-in-2008
  - https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/summary?event=316520
- id: view
  heading: 選手の25個と、監督の9個を、数えて比べると
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 11月16日、初戦と同じドイツ戦
  card:
    type: table
    title: シャビの選手時代と監督時代（自分で数えた比べ）
    columns: [物差し, 選手時代, 監督時代]
    rows: &cmp_rows
    - ['タイトル', '25個', '9個']
    - ['試合数（全大会）', '884試合', '248試合']
    source: クラブ公式・BBC・ESPN・Wikipedia（数えたのは当チャンネル）
  say:
  - text: 終わりに、シャビの数字を並べて比べます。
    image: assets/images/20261018_xavi_legend/x26_knvb.jpg
    card: &cmp_card
      type: table
      title: シャビの選手時代と監督時代（自分で数えた比べ）
      columns: [物差し, 選手時代, 監督時代]
      rows: *cmp_rows
      source: クラブ公式・BBC・ESPN・Wikipedia（数えたのは当チャンネル）
      highlight_row: 0
  - text: バルセロナで獲ったタイトルは、選手として25個。
    card:
      <<: *cmp_card
      highlight_row: 0
  - text: 監督では、アル・サッドで7個、バルセロナで2個。合わせて9個です。
    card:
      <<: *cmp_card
      highlight_row: 0
  - text: 選手のタイトルは、監督の約2.8倍です。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 0
    mark: {kind: circle, row: 0}
  - text: 次に、シャビのスペインが勝った、3つの決勝を数えます。
    card: &final_stats
      type: stats
      title: 3つの決勝（ユーロ2008・W杯2010・ユーロ2012）
      items:
      - ['6', 得点, 3試合の合計]
      - ['0', 失点, 3試合とも無失点]
      focus: 1
  - text: 1対0の勝ち、1対0の勝ち、4対0の勝ち。6得点で、失点は0です。
    emph: true
    card: *final_stats
  - text: 本人は、勝ち負けの先にあるものを、語っていました。
    card: none
  - voice: シャビ
    text: 結果より大きくて、長く残るものがある。遺産だ。
    pause: 0.5
  - text: オランダ代表は、4戦して、2勝2分け。負けていません。
    card: none
  - text: 次の節目は、11月13日のギリシャ戦。続く16日は、初戦と同じドイツ戦です。
    card: none
  - text: 4年契約は、まだ始まったばかりです。
    emph: true
    card: none
