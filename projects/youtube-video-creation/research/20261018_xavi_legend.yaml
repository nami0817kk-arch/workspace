  - text: 会場は、ウクライナのキエフ。相手は、イタリアでした。
    card:
      <<: *match_card
      highlight_row: 1
  - text: スペインは、2008年のユーロ、2010年のW杯と、決勝を勝ち続けていました。
    card: none
  - text: 前半14分、シルバのヘディングで先制します。
    card:
      <<: *match_card
      highlight_row: 3
  - text: 41分。シャビのスルーパスに、アルバが走り込んで、決めます。
    emph: true
    card:
      <<: *match_card
      highlight_row: 4
  - text: 84分。今度は、シャビのパスから、トーレスが3点目。
    card:
      <<: *match_card
      highlight_row: 4
  - text: 88分に、マタが加えて、スペインの4対0の勝ちです。
    card:
      <<: *match_card
      highlight_row: 3
  - text: 実況は、欧州選手権の決勝で2度アシストした初めての選手、と伝えました。
    emph: true
    card: none
  - text: 2008年の決勝にも、シャビのパスがありました。
    card: none
  - text: トーレスの決勝点の前の、スルーパスです。
    card: none
  quotes_from: []
  sources:
