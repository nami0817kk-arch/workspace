# シャビ・エルナンデス（元バルセロナ／スペイン代表・現オランダ代表監督）の紹介。シリーズ「レジェンドの紹介（世界）」。試験の見本はジダン・ロナウジーニョ（research/20261018_*_legend.yaml）。
# 型は引退した選手向けの8節：①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（＋通算の表） ⑤あの試合 ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob は使わない**。レーダー・シュートマップ・パーセンタイルは出さない。数字は基本の数と、自分で割った・数えた値。Transfermarkt は見ていない（必要な数字はクラブ公式・ESPN・BBC で足りた）。
# 公開予定は 10/18 以降。**台本は draft まで**（approve・build・screen・upload はしない）。
#
# **数字・出来事の出どころ（本文を実際に読んだもの。取材は requests と WebFetch／WebSearch の URL 探しのみ。ブラウザの道具は不使用）と確度**
# - BBC Sport（2026-08-12、Alastair Telfer、requests で本文を読んだ）：シャビがオランダ代表の新監督（4年契約）、1978年のハッペル（オーストリア人）以来の外国人監督、前任クーマンは今夏のW杯32強でモロッコに敗れて辞任、
#   初戦は9/24 ドイツ（Nations League）、アルネ・スロットが話し合いのあと辞退、シャビは2010年W杯決勝でオランダを破ったスペインの一員、2019年に引退・アル・サッドで監督・2021年11月にバルセロナ・就任1年目の通年でリーガ優勝・2024年に退く、
#   写真の説明「シャビは選手時代にバルセロナで25のタイトル」、本人の言葉（「大変な名誉」「ある意味、オランダ・サッカーの息子」「ファン・ハールの下でバルサでデビュー」）。→ 報道（確度の上限が高い連盟発表の報道）。
# - KNVB（オランダ連盟）公式の発表ページ：本文はサイトのメンテナンス表示で読めなかった（og:image の写真だけ取れた。シャビの写真）。→ 本文は BBC で確かめた。
# - FC バルセロナ公式（fcbarcelona.com「Xavi by the numbers」2021-11-06、requests で本文を読んだ）：バルセロナで767試合85得点（リーガ505・CL157・国王杯70・UEFAカップ13・スペイン・スーパーカップ14・欧州スーパーカップ3・クラブW杯5）、
#   タイトル25（リーガ8・CL4・国王杯3・クラブW杯2・欧州スーパーカップ2・スペイン・スーパーカップ6。年も列挙）、17シーズン（1998〜2015）、42回のクラシコ、最後の試合は2015-06-06 CL決勝、アル・サッドの監督で7タイトル。→ 確定（クラブ公式の記録）。
# - The Guardian 2011-02-11「I'm a romantic, says Xavi」（Sid Lowe のインタビュー。requests で全文）：本人の言葉（空いた場所を探す・ロンド・クライフのアヤックスの型・ウェンブリーに行けなかった12歳・結果より遺産・
#   2005年ごろは絶滅しかけていた）、同ページの経歴欄（2008年ユーロ最優秀選手、2010年W杯でパス成功が2位より104本多い、直近2シーズンのリーガ・CLでアシスト最多）。→ 報道。
# - Football España 2015-09-15「Xavi ‘nearly left in 2008’」（Marca への本人の言葉を引いた記事。requests で全文）：2008年にバイエルンの話・グアルディオラが「動くな」。→ 報道。
# - ESPN（site.api.espn.com の試合記録・実況・出場記録。requests）：ユーロ2012決勝 スペイン4-0イタリア（キエフ・シルバ14・アルバ41＝シャビのアシスト・トーレス84＝シャビのアシスト・マタ88。実況「欧州選手権の決勝で2度アシストした最初の選手」）／
#   ユーロ2008決勝 ドイツ0-1スペイン（実況：トーレスがシャビのスルーパスに走って決勝点）／W杯2010決勝 オランダ0-1スペイン（イニエスタ116分）／CL決勝2011 バルセロナ3-1マンU（ウェンブリー・シャビ先発1アシスト）／
#   スペイン・スーパーカップ決勝2023 レアル1-3バルセロナ／オランダの4試合（9/24 ドイツ1-1・9/27 セルビア2-1・10/1 ギリシャ2-2・10/4 セルビア2-1）と次の日程（11/13 ギリシャ戦・11/16 ドイツ戦）。→ 報道（統計の出どころ）。
# - Omroep Brabant（2026-09-27）：セルビア戦 1-2（オランダの勝ち）の報。→ 報道。
# - 英語版 Wikipedia（本文・Career statistics・Honours・Managerial statistics）：アル・サッド117試合25得点（スペイン語版の合計884/110と一致）・スペイン代表133試合13得点（英・西・日の3つが一致）・
#   監督成績（アル・サッド102試合67勝・バルセロナ142試合89勝）・スペイン代表デビュー（2000-11-15 オランダ戦。英・西が一致）・バロンドール3位3回。→ 背景。
#
# **食い違いと台本での扱い**
# - 依頼の「9/25 初戦、9/28 初勝利」は日本時間。ESPN の試合記録・BBC・Wikipedia はどれも現地の 9/24 と 9/27（キックオフは現地 20:45）。→ 台本は現地の日付で言う（9月24日・9月27日）。
# - バルセロナの試合数：クラブ公式は767試合85得点（全大会）。同じクラブ公式の別ページは869試合97得点・32タイトル（Bチームなども含む数え方と思われる）と書く。→ 1つ目（767/85/25、BBC もタイトル25）を採った。
# - アル・サッドのリーグ戦の得点：英語版 Wikipedia の infobox は20、同じページの表は21。→ 表は全大会（117試合25得点）だけを使い、リーグ戦の得点は言わない。
# - 「2009-05-02 のクラシコ6-2で4アシスト」（英語版 Wikipedia）：ESPN の実況では、ヘンリーの1点目はメッシのチップ、メッシの1点目は単独で奪って決めた形で、確認できたシャビのアシストは2つだけ。→ 「あの試合」には使わず、ユーロ2012決勝（ESPN の出場記録で2アシスト）にした。
# - ユーロ2008決勝のシャビのアシスト：ESPN の統計欄は0だが、実況はシャビのスルーパスでトーレスが決めたと書く。→ 「アシスト」とは言わず「決勝点の前のスルーパス」と言う。
# - 時刻：ユーロ2012決勝のトーレスの得点は ESPN の得点記録で84分、実況は83分。→ 得点記録の84分。
# - オランダの「初勝利」：Omroep Brabant・ESPN の記録から、初戦（9/24）は引き分けで、次の9/27が最初の勝ち。BBC・公式の「初勝利」の記事は読めていない。→ 試合記録から言える形（「3日後、最初の勝ち」）にした。
# - Gulf News の「Xavi Hernandez: I exceeded all my dreams」は、日付と中身（バルセロナの3冠を「昨季」と言う）が合わず読み捨てた。Eurosport／TNT のバイエルンの記事は 403 で読めず、Football España の転載で代えた。
#
# **自分で数えた比べ（⑧）**
# - タイトル：選手＝バルセロナで25（クラブ公式）／監督＝アル・サッド7（クラブ公式）＋バルセロナ2（2022-23 のリーガ〈BBC〉と2023-01 のスペイン・スーパーカップ〈ESPN の決勝記録〉）＝9。25÷9＝約2.8倍。
# - 試合数：選手（クラブ・全大会）＝767＋117＝884／監督（クラブ＋代表）＝102＋142＋4＝248（Wikipedia の合計と一致。代表の4は ESPN の記録）。
# - 監督の勝率（Wikipedia）：アル・サッド 67÷102＝65.7%、バルセロナ 89÷142＝62.7%。オランダは4戦2勝2分0敗（ESPN）。標本が小さいので勝率は出さない。
# - 決勝3試合（ユーロ2008・W杯2010・ユーロ2012）：1-0・1-0・4-0＝6得点0失点（ESPN の決勝の記録）。
# - 1試合あたりの得点：クラブ全大会 110÷884＝0.12／スペイン代表 13÷133＝0.10（得点の人ではない、の説明）。
# - 通算：クラブ全大会 884試合110得点、クラブ＋代表で1,017試合（884＋133。自分で足した）。
#
# **入れなかったもの**：引退後の私生活・法的な問題・バルセロナ監督時代の解任のいきさつ（brief の決まり）。2009-05-02 のクラシコ（上の食い違い）。ラ・マシア時代の写真（Commons に無かった）。
#   監督としてのバルセロナの試合の細部（勝率の一言だけ）。ガクポの「非スポーツ的」の話（9/25 の別の回で扱っている）。
#
# **日本語名・読みで怪しいもの**：シャビ・エルナンデス／タラサ／ラ・マシア／ファン・ハール／クライフ／アヤックス／グアルディオラ／ハッペル／クーマン／ガクポ／ウェンブリー／キエフ／トーレス／アルバ／マタ／シルバ／アル・サッド／KNVB。
#
# 本人の言葉は4か所（自訳。原文は上の出典）：①フック（BBC 2026-08）②プレースタイル（Guardian 2011：探す・ロンド・クライフ・屈辱）③マル秘話①（Guardian 2011：ウェンブリー）④マル秘話②（Marca 2015 経由：グアルディオラ）⑤見立て（Guardian 2011：結果より大きいもの）。
