  - text: 2026年のW杯は、ベスト16。ベルギーに、1対4の負けでした。
    image: assets/images/20261118_team_usa/b04_w.jpg
    card: none
  - text: グループ初戦は、パラグアイに4対1の勝ち。
    card: none
  - text: 2戦目も、オーストラリアに2対0の勝ち。首位で抜けました。
    card: none
  - text: 決勝トーナメント1回戦は、ボスニア・ヘルツェゴビナに2対0の勝ち。
    image: assets/images/20261118_team_usa/b02_w.jpg
    card: none
  - text: そのあとのアメリカは、4試合で4連勝。
