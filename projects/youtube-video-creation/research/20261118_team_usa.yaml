  - text: 負けた2試合は、トルコ戦が2対3の負け、ベルギー戦が1対4の負け。
    card: none
  - text: 勝った試合より、失点がかさみました。トルコ戦は、控え10人で臨んでいます。
    card: none
  - text: ただ、W杯のあとの4試合は4勝。12得点で3失点です。
    image: assets/images/20261118_team_usa/b03_w.jpg
    card: none
  - text: ポチェッティーノ監督の契約は、2030年まで。
    card: none
  - text: 次のW杯で、アメリカが勝ち数を結果につなげられるか。そこが注目点です。
    card: none
