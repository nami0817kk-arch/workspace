  - text: チリ戦では、17歳のマティス・アルベルトが、代表の最年少得点の記録を作りました。
    card: none
  - text: そのあと、メキシコ戦で、17歳のカバン・サリバンが、記録を更新しています。
    image: assets/images/20261118_team_usa/b01_w.jpg
    card: none
  - text: ポチェッティーノ監督は、8月に2030年まで契約を延ばしました。
    card: none
  - text: マンチェスター・ユナイテッドが交渉に入った、という話も出ています。
    image: assets/images/20261118_team_usa/b02_w.jpg
    card: none
  - text: 本人の発表は、まだありません。
    card: none
  - text: 11月は、ネーションズリーグの準々決勝で、ハイチと2試合です。
