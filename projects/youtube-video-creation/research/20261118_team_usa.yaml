sections:
- id: hook
  heading: アメリカは、自国のW杯で、何が変わったのか
  tier: 背景
  telop: 自国W杯で過去最多の3勝。結果はベスト16
  narrator: 解説
  main: true
  say:
  - text: アメリカ代表。フィファランクは16位の国です。
    image: assets/stats/tb_usa_data_t.png
    short_only: true
    no_telop: true
  - text: 2026年、自国で開かれたワールドカップで、アメリカは3勝を挙げました。
    image: assets/stats/tb_usa_data_t.png
    no_telop: true
  - text: それまでの11大会は、あわせて9勝。1大会で、その3分の1に届きました。
    image: assets/stats/tb_usa_data_r1.png
    no_telop: true
  - text: 11得点も、W杯の1大会では、アメリカで過去最多。
    image: assets/stats/tb_usa_data_r1.png
    no_telop: true
    emph: true
  - text: ところが結果は、ベスト16。1994年の自国開催と、同じところで終わりました。
    image: assets/images/20261118_team_usa/b01_w.jpg
    no_telop: true
  - text: 勝ち数は増えたのに、なぜ到達点は変わらなかったのでしょうか。
    image: assets/stats/tb_usa_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/United_States_men's_national_soccer_team
  - https://en.wikipedia.org/wiki/United_States_at_the_FIFA_World_Cup
- id: data
  heading: アメリカ代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: アメリカ代表の基礎DATA
  narrator: 解説
  say:
  - text: アメリカのフィファランクは、10月7日の発表で**16位**。日本は17位です。
    image: assets/stats/tb_usa_data0.png
    no_telop: true
  - text: ワールドカップは12回出場。いちばん上は、1930年の第1回大会の3位。
    image: assets/stats/tb_usa_data1.png
    no_telop: true
  - text: 直近は2026年。自国開催で、決勝トーナメントの2回戦まで進みました。
    image: assets/stats/tb_usa_data2.png
    no_telop: true
  - text: 北中米のゴールドカップは、7回の優勝。
    image: assets/stats/tb_usa_data3.png
    no_telop: true
  - text: 監督は、アルゼンチン出身のポチェッティーノ。2024年9月に就任しました。
    image: assets/stats/tb_usa_data5.png
    no_telop: true
  - text: 主将はタイラー・アダムス。代表62試合です。
    image: assets/stats/tb_usa_data6.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
  - https://en.wikipedia.org/wiki/United_States_men's_national_soccer_team
