  - text: クラブ史上最高額で、トッテナムに来たイタリア代表のトナーリ。今季の中身を見ます。
    image: assets/images/20261027_player_397033/pool/01_w.jpg
    card: none
    short_only: true
  - text: トッテナムでは、リーグ戦の8試合すべてに先発。699分に出ています。
    image: assets/images/20261027_player_397033/pool/01_w.jpg
    card: none
  - text: デビュー戦は8月22日、ブレントフォードとの敵地の一戦。0対3の完敗でした。
    card:
      <<: *season_card
      highlight_row: 0
  - text: 次の試合の相手は、前の所属のニューカッスル。ここも0対2の負けでした。
    image: assets/images/20261027_player_397033/pool/04_w.jpg
    card: none
  - text: 最初の5試合で、勝ち点は2。昨季17位のチームは、今季も苦しい出だしでした。
    image: assets/images/20261027_player_397033/pool/03_w.jpg
    card:
      <<: *season_card
      highlight_row: 1
  - text: 流れが変わったのは10月。マンチェスター・ユナイテッド戦は1対1の引き分けです。
    card:
      <<: *season_card
      highlight_row: 2
  - text: 追いついた終盤のゴールは、トナーリのクロスからでした。
    card: none
    emph: true
  - text: そこからコヴェントリーに3対1、チェルシーに敵地で2対0の連勝。
    card: none
  - text: 直近の3試合で、勝ち点7を積みました。
    image: assets/images/20261027_player_397033/pool/01_w.jpg
    card:
      <<: *season_card
      highlight_row: 2
  - text: イタリア代表でも、9月からの4試合に出ています。
    image: assets/images/20261027_player_397033/pool/03_w.jpg
    card:
      <<: *season_card
      highlight_row: 3
