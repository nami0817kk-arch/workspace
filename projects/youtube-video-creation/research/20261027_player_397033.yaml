      row: 4
  - text: シュートも、90分あたり1.31本から1.67本に増えました。
    image: assets/images/20261027_player_397033/pool/01_w.jpg
    card: none
  - text: とはいえ、トッテナムでの出場はまだ8試合。勝ち始めたのも、直近の3試合です。
