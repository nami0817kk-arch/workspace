    card:
      type: table
      title: 復帰までの順番
      columns: ["", ""]
      rows:
        - ["昨年8月", "レヴァークーゼン戦で左ヒザの前十字靱帯を断裂"]
        - ["8月15日", "プレシーズンのトッテナム戦で実戦復帰"]
        - ["9月6日", "セカンドチーム（3部）で45分"]
        - ["9月12日", "トップチームの公式戦へ"]
    say:
      - 385日。町田浩樹がピッチを離れていた長さです。
      - けがをしたのはレヴァークーゼン戦でした。
      - いきなり公式戦に戻ったわけではありません。まず8月15日、プレシーズンのトッテナム戦に途中から出ています。
      - 次に9月6日、セカンドチームのドイツ3部で45分。
      - そして9月12日、トップチームの公式戦です。3つの段階を踏んでいます。
      - そのチームは開幕から連敗していて、この試合が今季初勝利でした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/ger/20260913/2204269.html

