# 監督紹介：ファーガソン（10/29 木 13:00 予定、シリーズ「監督紹介」、key: manager_ferguson、型は news）。9節の型（2026-10-20 決定）。見本は 20261028_manager_wenger。
# 順：フック→基礎DATA→日本との接点（基礎DATAの次）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-28 夜に自分で）**：scripts/*manager_*・research/covered.yaml・research/posted.json を grep。
#   ファーガソン／Ferguson は posted.json・covered.yaml に 0件。scripts は脇役として名前が出るだけ（マンUのクラブ紹介・ユニフォーム・ベッカム・グアルディオラ・シメオネ・ブライトン）。
#   既出の監督紹介：グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ベンゲル。research/20261029_* にほかの監督の回は無い。
#
# **いまの立場（確かめた）**：引退した監督（2026-10-20 決定「退任した監督も扱ってよい」）。
#   ○ 英語版 Wikipedia「Alex Ferguson」（控え research/raw/20261029_ferguson_wiki.txt・_plain.txt、2026-10-28 取得）：
#     冒頭「He retired from management at the end of the 2012–13 season, having won the Premier League in his final season.」
#     生年月日 1941-12-31（存命の書き方）。2013-05-08 に引退を発表、最後の試合は 2013-05-19 ウェスト・ブロムウィッチ戦 5-5（通算1500試合目）。
#     クラブのアンバサダーは 2024年10月に「季の終わりで退く」と発表（Wikipedia Charitable work 節）→ 台本では「2013年に監督を退いた」までにする。
#   × マンU公式・プレミア公式のページは当たっていない（時間の都合）。
#
# **通算（台本とサムネをそろえる）**＝英語版 Wikipedia「Managerial record by team and tenure」：
#   イースト・スターリングシャー 17試合 9勝2分6敗／セント・ミレン 169試合 74勝41分54敗／アバディーン 459試合 272勝105分82敗
#   ／スコットランド代表 10試合 3勝4分3敗／マンチェスター・ユナイテッド 1500試合 895勝338分267敗 ＝合計 2155試合 1253勝 490分 412敗（表の Career Total）。
#   勝率（自分で割った）：合計 1253/2155＝58.1%、セント・ミレン 43.8%、アバディーン 59.3%、マンU 59.7%。
#   ※サムネの表は「ほか2つ」＝イースト・スターリングシャー17試合9勝＋スコットランド代表10試合3勝＝27試合12勝。
#   タイトル：マンUで38（冒頭「he won 38 trophies」。Honours の内訳：リーグ13・FA杯5・リーグ杯4・チャリティ／コミュニティ・シールド10・CL2・カップウィナーズ杯1・スーパーカップ1・インターコンチネンタル杯1・クラブW杯1＝38、自分で足して一致）。
#   アバディーン：リーグ3・スコットランド杯4・リーグ杯1・ドライブラ杯1・カップウィナーズ杯1・スーパーカップ1。
#   「has won more trophies than any other manager in the history of football」（冒頭）→ 台本は「いちばん多いとされる」。
#   イングランド1部の優勝13回は記録（「won the top division title in England a record 13 times」）。リーグ3連覇を2回（初の監督）。
#   マンUのリーグ優勝の分布（自分で数えた）：就任から6季（1986-87〜1991-92）で0回、続く21季（1992-93〜2012-13）で13回。
#
# **基礎**：1941-12-31 スコットランド・グラスゴー生まれ（84歳）。選手としてはFW、スコットランド代表4試合。ダンファームリンで 1965-66 にスコットランド1部の得点王。
#   1974 イースト・スターリングシャー → 1974〜78 セント・ミレン（2部優勝 1976-77）→ 1978〜86 アバディーン → 1985〜86 スコットランド代表（1986年W杯）→ 1986-11-06 マンU → 2013 引退。
#   就任時のマンUは21位（22クラブ中）、その季は11位で終える。最初のタイトルは 1990年の FA カップ（クリスタル・パレスに再試合で1-0）。
#   リーグ優勝は 1992-93、26年ぶり（「ended United's 26-year wait」）。マンUの監督で最も長い在任（2010-12-19 にバスビーを抜く）。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**：
#   ・1999-11-30 インターコンチネンタル杯（東京・国立競技場、53,372人）パルメイラスに1-0、キーンの得点。イングランドのクラブで初めてで唯一（英語版 Wikipedia「1999 Intercontinental Cup」）。
#   ・2008年12月 クラブワールドカップ（日本開催）：準決勝でガンバ大阪に5-3、決勝は12月21日 横浜でリガ・デ・キトに1-0（英語版 Wikipedia「2008 FIFA Club World Cup」。得点者は確かめていないので言わない）。
#   ・香川真司（英語版 Wikipedia「Shinji Kagawa」）：2012-06-05 加入発表、クラブ初の日本人選手。2013-03-02 ノリッジ戦4-0でハットトリック、プレミアでアジアの選手初。
#     2013-04-22 優勝を決めたヴィラ戦に出場、日本人で初めてプレミアの優勝。2013-05-12 ファーガソン最後のホームゲーム（スウォンジーに2-1）でマン・オブ・ザ・マッチ。
#
# **戦術の色**（英語版 Wikipedia「1999 UEFA Champions League final」・Ferguson の本文）：1999-05-26 バルセロナ、バイエルンに2-1。
#   ベッカムを中央、ギグスを右で始め、シェリンガムをブロンクヴィストに替えて形を戻す。残り10分でスールシャールをコールに替える。
#   ロスタイムに途中出場の2人が得点（シェリンガム、スールシャール）。3冠（リーグ・FA杯・CL）。
#   本人の言葉①（延長に向けて準備を、と言ったマクラーレンに）「Steve, this game isn't finished.」
#   本人の言葉②（直後のインタビュー）「I can't believe it. Football, bloody hell. But they never gave in and that's what won it.」
#   ※「ファーギー・タイム」：1992-93 の大事な試合でブルースが97分に決勝点（Wikipedia 本文）。
#
# **マル秘話**：1987-88 のバミューダ遠征の親善試合で、ファーガソン自身がピッチに立った。マンUのトップチームでの唯一の出場（Wikipedia）。
#   2011-11-05 北側スタンドが「サー・アレックス・ファーガソン・スタンド」に／2012-11-23 オールド・トラッフォードの外に像／最後の試合は 5-5（1500試合目）。
#
# **入れなかったもの**：家族・夫人の死去・健康（脳出血）・認知症の慈善活動・政治・競走馬の争い・ベッカムとの件・審判とのもめごと・ニュースの反応・女子・お金。
