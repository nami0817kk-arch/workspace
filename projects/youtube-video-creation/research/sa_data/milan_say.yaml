episode:
  id: episode
  heading: 1991年から93年、ミランはなぜ、58試合も負けなかったのか
  tier: 背景
  telop: 1991年5月から93年3月、リーグ戦58試合負けなし。1991年から92年は無敗で優勝
  narrator: 解説
  card:
    type: table
    title: 58試合の無敗
    columns: ["", ""]
    rows:
      - ["無敗の試合数", "58試合"]
      - ["始まり", "1991年5月、パルマと0対0"]
      - ["終わり", "1993年3月、パルマに0対1"]
      - ["1991-92年", "負けなしで優勝"]
  say:
    - text: 1991年。サッキに代わって監督になったのは、元選手のカペッロです。
      image: assets/backgrounds/stadium_ミラン_in.png
    - この年から、ミランは3年続けて、リーグ優勝します。
    - 負けない日々の始まりは、1991年5月26日。パルマと0対0の引き分けでした。
    - 1991年から92年は、リーグ戦で1度も負けずに優勝します。
    - 無敗で優勝したのは、イタリアの1部で初めてです。
    - 前にシーズン無敗だったのは、1978年から79年のペルージャだけ。ただ2位でした。
    - 負けなしは、**58試合**続きます。セリエAの記録です。
    - 止めたのは、1993年3月21日。ホームでのパルマ戦で、0対1で負けました。
    - 始まりも終わりも、パルマとの試合でした。
  sources:
    - https://en.wikipedia.org/wiki/AC_Milan

legends:
- - マルディーニは、1984年から2009年まで、ミラン一筋のディフェンダーです。
  - リーグ戦**647試合**は、セリエAの最多記録。ミランでの全大会では**902試合**でした。
  - 在籍中のミランは、ヨーロッパの頂点に5回立ちました。
- - シェフチェンコは、ウクライナ代表のフォワード。1999年から2006年まで。
  - リーグ戦**208試合127得点**。ミランでの通算は**175得点**で、クラブ歴代2位です。
  - 2006年にチェルシーへ移り、2008年に、貸し出しでミランに戻りました。
- - カカは、ブラジル代表のミッドフィールダー。2003年にミランへ来ました。
  - リーグ戦**193試合70得点**。
  - 2009年、6700万ユーロの移籍金で、スペインの名門へ。
  - 当時の世界最高額でしたが、記録は1か月もたたずに破られました。
  - 2013年には、ミランに戻っています。
