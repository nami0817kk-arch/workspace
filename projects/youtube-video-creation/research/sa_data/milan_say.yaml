data:
- 創立は**1899年**。イングランド人のハーバート・キルピンが作りました。
- 本拠地はサン・シーロ。収容は**7万5710人**で、イタリア最大。インテルと共用です。
- リーグ優勝は**19回**。ヨーロッパ王者は**7回**、イタリアのクラブで最多です。
- 昨シーズンは**5位**。勝ち点70、4位のコモと1点差でした。
data_focus: [0, 3, 5, 8]

story_sections:
  - id: rise
    heading: 2部に落ちたミランは、どうやって欧州王者に戻ったのか
    tier: 背景
    telop: 1980年に八百長事件の罰で初の2部。1986年にベルルスコーニが買収。1989年から欧州王者
    narrator: 解説
    main: true
    say:
      - text: 1980年。ミランは、八百長事件の罰で、初めて2部に落とされます。
        image: assets/backgrounds/stadium_ミラン_in.png
        card:
          type: table
          title: ミランの歩み
          columns: ["年", "出来事"]
          rows:
            - ["1980年", "八百長事件で初めて2部へ"]
            - ["1983年", "2度目の2部優勝で1部へ"]
            - ["1986年", "ベルルスコーニが買収"]
            - ["1989年", "欧州王者に（翌年も）"]
            - ["2007年", "7度目の欧州王者"]
      - 1年で2部を優勝して戻りますが、翌年にまた落ちます。
      - 1983年に、2度目の2部優勝で、1部へ戻りました。
      - text: 1986年。実業家のシルヴィオ・ベルルスコーニが、倒産寸前のクラブを買います。
        card: none
        image: assets/backgrounds/stadium_ミラン.png
      - 巨額のお金を入れて、監督にアリゴ・サッキを呼びました。
      - 獲得したのは、オランダ代表のフリット、ファン・バステン、ライカールトです。
      - 1988年、9年ぶりのリーグ優勝。
      - 翌年は、ヨーロッパの頂点を決める決勝で、ステアウア・ブカレストに4対0で勝ちます。
      - 翌1990年も、ベンフィカに1対0で勝ちました。
      - 連覇は、2017年にレアル・マドリードが達成するまで、ミランが最後でした。
      - 1994年は、決勝でバルセロナに4対0で勝ちました。
      - 2003年は、PK戦でユベントスに勝ちます。
      - 2007年は、リヴァプールに2対1で、7度目の優勝です。
    sources:
      - https://en.wikipedia.org/wiki/AC_Milan
  - id: japan
    heading: 本田圭佑はミランで、どんな時間を過ごしたのか
    tier: 背景
    telop: 2014年1月にCSKAモスクワから加入。リーグ戦81試合9得点、2017年まで
    narrator: 解説
    say:
      - text: ミランでプレーした日本人に、本田圭佑がいます。
        image: assets/images/sa_milan_honda_w/01.jpg
        card:
          type: table
          title: ミランと日本
          columns: ["年", "出来事"]
          rows:
            - ["2014年", "CSKAモスクワから加入"]
            - ["2014-15年", "リーグ戦29試合6得点"]
            - ["2017年", "パチューカへ"]
      - 2014年1月、ロシアのツェスカモスクワから加わりました。
      - 2017年までのリーグ戦は、**81試合9得点**。
      - 2014年から15年は、リーグ戦**29試合6得点**でした。
      - text: 2017年に、メキシコのパチューカへ移ります。
        card: none
        image: assets/backgrounds/stadium_ミラン_in.png
    sources:
      - https://en.wikipedia.org/wiki/Keisuke_Honda

features:
- "クラブの色は、赤と黒です。"
- "創立者のキルピンが、前のクラブから持ってきたシャツの色でした。"
- "赤は選手の燃える情熱。黒は、相手の恐れを表すと、キルピンは語りました。"
- "クラブ名は、英語のつづりの「ミラン」。イタリア語の「ミラノ」ではありません。"
- "本拠地のサン・シーロは、地区の名前です。"
- "正式な名前は、ジュゼッペ・メアッツァ・スタジアムです。"
