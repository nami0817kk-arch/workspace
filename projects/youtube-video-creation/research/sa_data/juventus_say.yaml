manager:
- ユヴェントスの今季の監督は、イタリア人のルチアーノ・スパレッティ。**67歳**です。
- 監督の仕事は、1993年にエンポリで始めました。
- ナポリでは、2022年から23年にリーグ優勝。
- そのあと、イタリア代表の監督も務めました。
- ユヴェントスの監督になったのは、2025年10月です。
