episode:
  id: episode
  heading: 1996年の欧州王者のあと、ユヴェントスの決勝はどうなったのか
  tier: 背景
  telop: 1996年5月、ローマでアヤックスにPK戦で勝ち、2度目の欧州王者。その後の決勝は5回とも負け
  narrator: 解説
  card:
    type: table
    title: ヨーロッパの頂点を決める決勝
    columns: ["年", "相手と結果"]
    rows:
      - ["1996年", "アヤックスにPK戦で勝ち"]
      - ["1997年", "ドルトムントに1対3"]
      - ["1998年", "レアル・マドリードに0対1"]
  say:
    - text: 1994年。マルチェロ・リッピが、ユヴェントスの監督になります。
      image: assets/backgrounds/stadium_ユヴェントス_in.png
    - 1996年5月22日。ヨーロッパの頂点を決める決勝は、ローマで行われました。
    - 相手は、前の年の王者アヤックス。
    - 12分、ラバネッリが角度のない所から決めて先制します。
    - 41分に追いつかれ、延長を終えても1対1。
    - PK戦を4対2で制して、2度目の欧州王者になりました。
    - text: 翌1997年と98年も決勝へ。3年続けての決勝です。
      card:
        type: table
        title: ヨーロッパの頂点を決める決勝
        columns: ["年", "相手と結果"]
        rows:
          - ["2003年", "ミランにPK戦で負け"]
          - ["2015年", "バルセロナに負け"]
          - ["2017年", "レアル・マドリードに負け"]
    - ただ、ドルトムントに1対3、レアル・マドリードに0対1で負けます。
    - そのあとの2003年、2015年、2017年の決勝も、勝てませんでした。
    - 1996年のローマの夜が、いまも最後の欧州王者です。
  sources:
    - https://en.wikipedia.org/wiki/1996_UEFA_Champions_League_final
    - https://en.wikipedia.org/wiki/1997_UEFA_Champions_League_final
    - https://en.wikipedia.org/wiki/1998_UEFA_Champions_League_final
    - https://en.wikipedia.org/wiki/Juventus_FC

legends:
- - デル・ピエロは、1993年から2012年まで在籍したフォワードです。
  - 全大会**705試合290得点**は、どちらもクラブの最多記録。
  - 2部に落ちた2006年、「本当の紳士は貴婦人を離れない」と話して残りました。
- - ブッフォンは、2001年にパルマから来たゴールキーパー。
  - 移籍金5290万ユーロは、当時のゴールキーパーの世界最高額でした。
  - 最後の試合は2021年、コッパ・イタリアの決勝。クラブで**685試合**目でした。
- - ネドベドは、チェコ代表のミッドフィールダー。2001年にラツィオから来ました。
  - 2003年には、その年の最優秀選手に贈られるバロンドールを受けます。
  - 2部でもリーグ戦11得点。外国人選手として、クラブ最多の**327試合**に出ました。
legend_rows:
- ["デル・ピエロ", "1993-2012", "705試合290得点"]
- ["ブッフォン", "2001-2021", "685試合"]
