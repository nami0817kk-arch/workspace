manager:
- ローマの今季の監督は、イタリア人のジャン・ピエロ・ガスペリーニ。**68歳**です。
- 前のアタランタでは、チャンピオンズリーグの出場権を5度取りました。
- 2024年には、そのアタランタでヨーロッパリーグに優勝しています。
- ローマに来たのは、2025年6月です。
- 1年目で3位に入り、チャンピオンズリーグの出場権を取りました。
manager_telop: 監督はガスペリーニ。2025年6月に就任。前はアタランタの監督
