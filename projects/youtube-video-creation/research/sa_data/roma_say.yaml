episode:
  id: episode
  heading: 2018年、ローマはどうやってバルセロナに1対4から勝ち上がったのか
  tier: 背景
  telop: 2018年4月、チャンピオンズリーグ準々決勝。1試合目は1対4、ホームで3対0。合計4対4、アウェーの得点で勝ち上がり
  narrator: 解説
  card:
    type: table
    title: 2018年 準々決勝
    columns: ["", ""]
    rows:
      - ["1試合目（アウェー）", "1対4"]
      - ["2試合目（ホーム）", "3対0"]
      - ["2試合の合計", "4対4"]
  say:
    - text: 2018年4月4日。チャンピオンズリーグ準々決勝、バルセロナとのアウェー戦。
      image: assets/backgrounds/stadium_ローマ_in.png
    - ローマは1対4で負けます。
    - 4点のうち2点は、デ・ロッシと、守備のマノラスのオウンゴールでした。
    - 4月10日、ホームのオリンピコでの2試合目。
    - 6分、フォワードのジェコが決めて先制。
    - 58分、デ・ロッシがPKを決めます。
    - 82分、マノラスが決めて、3対0の勝ち。
    - 2試合の合計は4対4。アウェーで取った点の差で、ローマが勝ち上がりました。
    - オウンゴールをした2人が、どちらも点を取り返したことになります。
    - 準決勝は、1984年から数えて34年ぶりでした。
  sources:
    - https://en.wikipedia.org/wiki/2017%E2%80%9318_AS_Roma_season
    - https://en.wikipedia.org/wiki/AS_Roma

legends:
- - トッティは、1993年から2017年まで、ローマ一筋のフォワードです。
  - 全大会で**786試合307得点**。出場も得点も、クラブで最多です。
  - セリエAの250得点は歴代2位。2006年には、ワールドカップを勝ち取りました。
- - デ・ロッシは、ローマ生まれのミッドフィールダー。2001年から2019年まで。
  - 全大会**616試合**は、トッティに次ぐクラブ2位です。
  - 2017年、引退したトッティから、主将を受け継ぎました。
- - バティストゥータは、アルゼンチン代表のフォワード。2000年に来ました。
  - 移籍金3600万ユーロは、30歳を超えた選手の額として、2018年まで最高でした。
  - 2000年から01年は、リーグ戦**20得点**。自身初めてのセリエA優勝でした。
legend_rows:
- ["トッティ", "1993-2017", "786試合307得点"]
- ["デ・ロッシ", "2001-2019", "616試合"]
