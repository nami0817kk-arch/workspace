data:
- 創立は**1927年**。ローマの3つのクラブが合併して生まれました。
- 本拠地はスタディオ・オリンピコ。収容は**7万634人**で、ラツィオと共用です。
- リーグ優勝は**3回**。1942年、1983年、そして2001年。
- 昨シーズンは**3位**。勝ち点73でした。
data_focus: [0, 3, 5, 8]

story_sections:
  - id: rise
    heading: ローマは、どんな道のりで3度の優勝をつかんだのか
    tier: 背景
    telop: 1927年に3クラブの合併で誕生。1942年に初優勝。2部は1951年の1度だけ。1983年に41年ぶりの優勝
    narrator: 解説
    say:
      - text: 合併を進めたのは、イタロ・フォスキという人物でした。
        image: assets/backgrounds/stadium_ローマ_in.png
        card:
          type: table
          title: ローマの歩み
          columns: ["年", "出来事"]
          rows:
            - ["1927年", "3つのクラブの合併で誕生"]
            - ["1942年", "初めてのリーグ優勝"]
            - ["1951年", "ただ1度の2部降格"]
            - ["1983年", "41年ぶりのリーグ優勝"]
            - ["2001年", "3度目のリーグ優勝"]
      - 目的は、北の強いクラブに対抗できる、首都のクラブを作ることです。
      - 最初のリーグ優勝は、1941年から42年のシーズンです。
      - 2部に落ちたのは、1951年の1度だけ。1年で戻りました。
      - text: 1982年から83年には、41年ぶりのリーグ優勝。
        card: none
        image: assets/backgrounds/stadium_ローマ.png
      - 翌1984年は、ヨーロッパ王者を決める決勝へ進みます。
      - リヴァプールと1対1。PK戦で負けました。
      - 3度目の優勝は、2000年から01年のシーズンです。
    sources:
      - https://en.wikipedia.org/wiki/AS_Roma
  - id: japan
    heading: 中田英寿は、2001年の優勝で何をしたのか
    tier: 背景
    telop: 2000年1月にペルージャから加入。2001年5月のユヴェントス戦で1得点、同点弾も演出。リーグ戦30試合5得点
    narrator: 解説
    main: true
    say:
      - text: ローマの3度目の優勝には、日本人の中田英寿がいました。
        image: assets/images/sa_roma_nakata_w/01.jpg
        card:
          type: table
          title: ローマと中田英寿
          columns: ["年", "出来事"]
          rows:
            - ["2000年1月", "ペルージャから加入"]
            - ["2001年5月", "ユヴェントス戦で1得点"]
            - ["2001年6月", "リーグ優勝"]
            - ["2001年夏", "パルマへ"]
      - 2000年1月、同じセリエAのペルージャから加わりました。
      - 山場は2001年5月6日。優勝を争うユヴェントスとのアウェー戦です。
      - ローマは0対2で負けていました。後半、トッティに代わって中田が入ります。
      - 残り11分。中田が、ゴールから約27メートルの所から決めます。
      - text: 終了間際には、中田のシュートをキーパーがはじき、モンテッラが押し込みます。
        card: none
        image: assets/backgrounds/stadium_ローマ_in.png
      - 2対2の引き分け。ローマは首位のまま、6点差を保ちました。
      - 6月17日、最終節でパルマに3対1。2位ユヴェントスと2点差で優勝します。
      - 中田のローマでのリーグ戦は、**30試合5得点**でした。
      - 2001年の夏、パルマへ移ります。アジアの選手として、当時の最高額でした。
    sources:
      - https://en.wikipedia.org/wiki/Hidetoshi_Nakata
      - https://en.wikipedia.org/wiki/AS_Roma

features:
- "クラブの色は、赤と黄色。ローマ市の紋章と同じ色です。"
- "紋章には、狼と2人の赤ん坊が描かれています。"
- "ローマを作ったとされる、ロムルスとレムスの伝説です。"
- "狼に育てられた双子の話から、愛称は「狼」とも呼ばれます。"
- "もう1つの愛称は、色をそのまま呼んだ「ジャッロロッシ」。黄色と赤という意味です。"
features_telop: クラブの色は赤と黄色でローマ市と同じ。紋章は狼と双子。愛称は「狼」
