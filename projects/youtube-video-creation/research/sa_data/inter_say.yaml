episode:
  id: episode
  heading: 2010年、インテルはなぜ、イタリアのクラブで唯一の3冠を取れたのか
  tier: 背景
  telop: 2009-10年、リーグ・カップ・欧州の3冠。決勝でバイエルンに2対0
  narrator: 解説
  card:
    type: table
    title: 2009年から10年のシーズン
    columns: ["", ""]
    rows:
      - ["リーグ", "2位ローマに勝ち点2差"]
      - ["カップ", "決勝でローマに1対0"]
      - ["欧州", "決勝でバイエルンに2対0"]
  say:
    - text: 2009年から10年。監督は、ジョゼ・モウリーニョでした。
      image: assets/backgrounds/stadium_インテル_in.png
    - 夏には、エトーをバルセロナから、スナイデルをレアル・マドリードから迎えます。
    - チャンピオンズリーグは、16強でチェルシーに2戦とも勝ちます。
    - 準決勝は、グアルディオラのバルセロナ。第2戦は、10人で戦い抜きました。
    - 決勝は、マドリードでバイエルンに2対0。ミリートが2ゴールです。
    - リーグは、ローマに2点差で優勝。カップも、決勝でローマに1対0で勝ちました。
    - 3つとも取ったイタリアのクラブは、インテルだけです。
  sources:
    - https://en.wikipedia.org/wiki/Inter_Milan

legends:
- - ザネッティは、アルゼンチン出身のディフェンダーです。
  - 1995年から2014年まで、19年プレーしました。
  - 全大会で**858試合**は、クラブ最多です。
  - 主将を務めたのは13シーズンで、これも記録です。
- - ロナウドは、ブラジル代表のフォワード。1997年から2002年にプレーしました。
  - リーグ戦**68試合49得点**。1997年の移籍金は、当時の世界最高額でした。
  - 1998年には、ユーエファカップの優勝。ただ、右ひざの大けがが続きました。
  - 2002年、スペインの名門へ移ります。移籍金は、4500万ユーロでした。
- - ミリートは、アルゼンチン出身のフォワード。2009年に、ジェノアから加わりました。
  - リーグ戦**128試合62得点**。2014年までプレーしました。
  - 2010年のチャンピオンズリーグ決勝で、バイエルンから点を奪ったのは、この人です。
