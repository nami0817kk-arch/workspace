# セリエA チーム紹介 インテル（見本は 11/18 のパーダーボルン・11/14 のアウクスブルク）。2026-11-13 作成。情報は11月13日時点。
# 事実は research/sa_data/inter_research.md から。今季の結果は ESPN の試合データで数えた。
title: インテルは1度も2部に落ちない。なぜ、ミランから分かれて21回優勝できたのか？
