manager:
- インテルの今季の監督は、ルーマニア人のクリスティアン・キヴ。**46歳**です。
- 選手としても、2007年から2014年までインテルにいました。
- 2010年の3冠のメンバーです。
- 監督としては、ユースを率いたあと、2025年2月にパルマの監督に。
- 2025年6月に、インテルの監督になりました。
- 1年目に、リーグとカップの2冠を取っています。
