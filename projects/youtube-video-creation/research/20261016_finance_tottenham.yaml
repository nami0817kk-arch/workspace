# クラブの財政：トッテナム・ホットスパー（10/16 金、シリーズ「クラブの財政」、key: finance_tottenham、型は news）。
#
# 軸は「**ヨーロッパリーグで優勝した年に、収入は5年でいちばん多いのに、最終の赤字も5年でいちばん大きい**」。
#   → 賞金が増えても放映権が減り、費用が収入より増え、売却益も減って、営業は黒字から赤字に戻った道筋を決算の順に追う。
#   他の財政回の軸（10/3 バルサ＝使える上限／10/7 シティ＝判決／10/8 アルテタ＝契約／10/9 レアル＝スクワッド・コスト・ルール／
#   10/10 PSG＝関連当事者取引／10/11 バイエルン＝株の持ち主／10/12 リヴァプール＝優勝の年に増えた収入の中身＝放映権が3分の2／
#   10/14 マンU＝本業の利益が償却・金融費用・借入を経て赤字になる道筋）は**1行も出さない**。
#   ★リヴァプール回は「優勝の年に何が増えたか」。この回は「欧州の優勝の年に、リーグ順位が落ちて何が減ったか」で、見る向きが逆。
#   ★スクワッド・コスト・ルール／利益と持続可能性の規則（PSR）は言わない（決算に「順守している」とあるだけ）。
#   ★売った選手・買った選手・監督の名前は言わない（決算に名前はあるが、台本の主役ではない）。決算期のあとの補強は額だけ。
#   ★クラブの数字は男女の合計（決算は1つの会社）。**部門名は並べない**（女子は扱わない決まり）。決算の「女子チームの成績」の文は使わない。
#   ★親会社の社名・出資者の名前は言わない（アルファベットは読み上げに出さない）。「親会社」とだけ言う。
#
# **決算の期**：トッテナム・ホットスパー・リミテッド（英国法人。Companies House 01706358）の**2025年6月期**（7月1日〜6月30日。シーズンは 2024-25）。
#   **これが最新**。クラブの発表は 2026-03-31、Companies House への提出（AA）は 2026-04-09。**2026年6月期はまだ出ていない**
#   （Companies House の提出履歴の最新の決算書は 2025年6月期。クラブ公式サイトの検索にも 2026年6月期の決算発表は無い。2026-10-16 確認）。
#   過去の発表は 2024年6月期＝2025年3月、2023年6月期＝2024年4月（URL の年月から）。次の日付は出ていない。
#
# **出どころ（一次情報まで辿れたもの）**:
#   ○ **Companies House の年次報告・連結決算書（2025年6月期、65ページ、スキャン画像）**。千ポンド単位の原数値を**ページ画像を目で読んで**書き起こした：
#       戦略報告 p1〜2（収入の内訳・営業費用・償却・売却益・金融費用・貸借・キャッシュフローの文）／5年の表 p3（2021〜2025年6月期）／
#       取締役報告 p12・p16（株の持ち主・継続企業の前提）／連結損益 p22／キャッシュフロー p25／注記 2・3・4・5・6・7（p32〜34）／
#       注記 16（借入の金利・借入枠 p43）／注記 29（決算期のあとの出来事 p53）。
#   ○ **クラブ公式の決算発表「Financial results year ended 30 June 2025」（tottenhamhotspur.com、2026-03-31）**。見出しの数字・17位・平均金利3.07%・平均満期17.6年・借入8億5170万。
#   ○ **デロイトのフットボール・マネー・リーグ 2026（2024/25）**：ランキングのページでトッテナムは **9位**（読めた）。**収入のユーロの額は読めなかった**（ページの本文に額が無い）→ 額は言わない。
#   ○ **ヨーロッパ中央銀行の参照相場（frankfurter.app 経由）2026-10-15：1ポンド＝209.27円**（丸めて209円。10/12・10/14 と同じ209円）。
#   × **2026年6月期の数字は読めなかった**（未提出）。シーズン 2025-26 の収入・成績は台本で言わない。
#   × **5年の純借入・5年の人件費・5年の放映権は読めなかった**（5年の表に純借入の行が無い。前の年のデータは 2024年6月期の決算書でないと出ない）→ 2年の比較に留める。
#   × 他の報道（Inside World Football など）は最終損失を 9740万ポンドと書く。**クラブと決算書は 9470万（94,666千）**。この台本はクラブ・決算書だけを使う（報道との差は定義の違いと思われるが未確認）。
#
# ★**数字が3種類あるので混ぜない**:
#   (1) 「収入」5億6530万ポンド … クラブの見出し「Total Revenue and Other income」（565,266）。売上 564,881 ＋ その他の収入 385。
#   (2) 「本業の利益」1億1230万ポンド … クラブが「Profit from Operations (EBITDA)」と呼ぶもの＝減価償却・選手の償却・選手の売買・利息・税の前（112,306）。
#   (3) 「営業損益」マイナス5040万ポンド … 決算書の「Profit/(loss) from operations」（−50,398）。選手の償却を引き、選手の売却益を足したあと、利息の前。
#   **決算書の「営業損益」は英国の用語で、利息の前の損益**。台本では「営業損益」と言い、本業の利益と言い分ける。
#
# 自分で計算した数（機械は検算しない）:
#   収入（£000）：361,872（2020-21）／444,028／549,633／528,191／565,266（2024-25）。5年の伸び 565.266−361.872＝203.394 →「2億340万」。565.266 は5年でいちばん多い。
#   収入の増加 565.266−528.191＝37.075 →「3710万」。内訳：試合日 126.473−105.847＝+20.626（2060万）／ヨーロッパの賞金 34.716−1.262＝+33.454（3350万）／
#     放映権 126.993−165.910＝−38.917（3890万）／商業など（商業 276.699＋その他の収入 0.385＝277.084 −（244.744＋10.428＝255.172））＝+21.912（2190万）。
#     20.626＋33.454−38.917＋21.912＝37.075 ✓。waterfall の丸め 33.5＋20.6＋21.9−38.9＝37.1 ✓（ずれなし）。
#   商業などの中身（戦略報告の文・百万ポンド）：スポンサー 160.0−144.5＝+15.5／グッズ 39.3−36.2＝+3.1／その他の売上 77.3−64.0＝+13.3／その他の収入 0.4−10.4＝−10.0。合計 21.9 ✓。
#   放映権の減り − 賞金の増え：38.917−33.454＝5.463 →「550万」（放映権の減りのほうが大きい）。
#   順位：2023-24 は5位、2024-25 は17位（戦略報告 p2）。
#   本業の利益 112.306（前の年 144.889、−32.583＝−22.5%。クラブの発表は「22%の減少」）。
#   損益の道筋（£000）：112,306 −68,549（減価償却 56,948＋特別な費用 11,601）＝43,757（売買の前の営業利益）／−146,720（選手の償却など）／＋52,565（選手の売却益）＝−50,398（営業損益）／
#     −70,230（金融の差し引き：金融費用 72,714−金融収入 2,484）＝−120,628（税引前）／＋25,962（税）＝−94,666（最終）。waterfall の丸め：112.3−68.5−146.7+52.6−70.2+26.0＝−94.5（決算 −94.7。0.2の端数）。
#   営業損益 −50.398（前の年 +21.287）。**売却益を引く**：−50.398−52.565＝−102.963 →「1億300万の赤字」（決算書の「Operating profit/(loss)」の行 −102,963 と一致）。前の年 21.287−82.305＝−61.018 →「6100万の赤字」。
#     102.963÷61.018＝1.69 →「1.7倍」。売却益 82.305→52.565＝−29.740 →「2970万」。
#   金融費用の中身（注記7・£000）：借入の利息 29,105／移籍金の分割払いの利息分 13,412／商業収入の前受けの利息分 5,716／リース 866＋債券の発行費 205＝1,071／
#     **株を買う権利（ワラント）などの時価の評価損 23,410（うちワラント 23,420、上場株の評価益 9。前の年は 0 に近い＝21）**／受取 −2,484。合計 70,230 ✓（丸め 29.1＋13.4＋5.7＋1.1＋23.4−2.5＝70.2 ✓）。
#     金融の差し引きは前の年 47,317 → 70,230（+22.913 →「2290万」）。評価損 23.4 とほぼ同じ額。
#     ワラント：取締役報告 p12「2022年6月に親会社が1億株を引き受けた際、ワラントを渡した。時価で負債に置く（FVTPL）」。戦略報告 p2「金融費用の増えは、ワラントの再評価による」。
#     ★「現金が出たわけではない」は、キャッシュフロー表の「利息の支払い」が 28.9 だけで評価損 23.4 が入っていないことからの**自分の読み**（評価損は会計上の再評価）。
#   5年の最終損益（£000）：−83,801／−50,117／−86,794／−26,226／−94,666。合計 −341,604 →「3億4160万」。2024-25 が5年でいちばん大きい。
#   5年の「利息の前の損益」：−43,386／−20,682／−49,911／+21,287／−50,398。合計 −143,090。黒字は 2023-24 だけ。
#   純借入：借入 851,652−現金 20,413＝831,239 →「8億3120万」（クラブの発表 831.2 ✓）。前の年 851,448−78,974＝772,474 →「7億7250万」（772.5 ✓）。増え 58.765 →「5880万」。
#     純借入÷収入 831.239÷565.266＝1.47倍。純借入÷本業の利益 831.239÷112.306＝7.40 →「7.4倍」。
#     借入のうち固定 770,719÷851,652＝90.5%（クラブ「90%超」）／変動 80,933。平均金利 3.07%（前の年 3.16%）。平均満期 17.6年（クラブの発表。注記の表は「17年」）。**2051年まで続くものもある**（クラブの発表）。
#     使っていない借入枠 55,000（借入枠 50,000＋当座貸越 5,000）。
#   利息の現金（キャッシュフロー）：28,912（前の年 29,742）。÷ 本業の利益 112.306 ＝ 25.7% →「約26%」。
#   人件費（注記5・£000）：255,811（前の年 221,929、+33.882 →「3390万」）。÷収入：255.811÷565.266＝45.3%、221.929÷528.191＝42.0%。収入の増え 37.075 のうち 33.882÷37.075＝91.4% →「9割」。
#     平均の従業員 877（前の年 820）。
#   選手の償却など（£000・5年）：82,888／79,893／127,106／135,583／146,720。146.720÷82.888＝1.77 →「1.8倍」。（償却そのもの 141,851。前の年 136,287）
#   営業損益の悪化の中身（営業損益 +21.287 → −50.398 ＝ −71.685 →「7170万」）：
#     収入の増加 +37.075／人件費 −33.882／その他の費用（other operating costs 197.259−161.367）−35.892／特別な費用 11.601−1.528 ＝ −10.073／
#     減価償却 68.796−56.948＝+11.848（＋設備の売却益の差 +0.116＝+11.964 →「+12.0」）／選手の償却など −11.137／売却益 −29.740。合計 −71.685 ✓。
#     waterfall の丸め 37.1−33.9−35.9−10.1+12.0−11.1−29.7＝−71.6（決算 −71.7。0.1の端数）。人件費＋その他の費用の増え 33.882＋35.892＝69.774 →「6980万」。
#   現金（£000）：本業で入った現金 62,301（前の年 91,680）／選手の獲得など −197,161（前 −223,637）／選手の売却など +66,968（前 +81,600）／
#     設備 −23,811＋売却 27＝−23,784（前の年の設備の支出 −43,300）／株の発行 +35,000／リース −1,885。合計 −58,561 ✓。現金 78,974 → 20,413。
#     選手の差し引き 197.161−66.968＝130.193 →「1億3020万」（前の年 142.037）。
#   決算期のあと（注記29）：選手の売買の差し引きの支出（リーグの負担金込み）約 158,590 →「1億5860万」。取締役報告 p16：**決算期のあと、1億ポンドの出資を確保**。債権の売却（ファクタリング）の取り決めを決算期のあとに結んだ。
#     親会社の株の引き受け：決算期のあと 2025-10-07 に 13,493,731株（Companies House の提出 SH01 と一致。額は注記に無い）。
#   円換算：831.239×209＝173,731 百万円 →「約1740億円」。
#
# **言い切っていないもの**:
#   ・放映権の減りの理由は「クラブの説明＝リーグ順位が5位から17位」まで。
#   ・金融費用の増えの理由は「ワラントの再評価」（クラブの説明）。ワラントの中身の細部（行使価格・期限）は決算書に無く、言わない。
#   ・決算期のあとの出資と補強は「数字だけ」。結びつけた言い方（補強のために出資した）はしない。出資と補強の額の大小も比べない。
#   ・2026年6月期の見通しは言わない（クラブは見通しを出していない）。
#
# 写真：assets/images/20261016_finance_tottenham/ に Commons の5枚（credits.json 同梱）。01_w＝周辺の住宅地から見たスタジアム CC BY-SA 4.0（冒頭）／
#   02_w＝ハイロード側の外観 CC BY-SA 4.0（サムネ・借入の節）／03_w＝場内（2024-09-21 の試合）CC BY-SA 4.0（試合日の行・現金の節）／
#   04_w＝ヨーロッパリーグ決勝の記念ユニフォームのアップ CC0（賞金の行）／05_w＝朝のスタジアム CC BY-SA 4.0（損益の節）。目で確認：すべてトッテナム・ホットスパー・スタジアムまたは決勝のユニフォーム。人物の顔は写っていない。
# 紋章の差し込み：assets/backgrounds/cut_トッテナム.png（tools/cutaway.py）。
# アルファベットは読み上げに出さない（ヨーロッパリーグ・チャンピオンズリーグ・イービットディーエーと書く）。
# サムネは構図 number（案A）。**ユーザーと相談して決める**ので、案B・Cは報告に出す。
