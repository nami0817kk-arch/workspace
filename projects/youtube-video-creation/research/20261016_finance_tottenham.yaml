  takeaway: トッテナムの2024-25（2025年6月期）の収入は5億6530万ポンドで5年でいちばん多く、ヨーロッパリーグで優勝した年。前の年より3710万ポンド増え、ヨーロッパの賞金が3350万ポンド、試合日が2060万ポンド、商業などが2190万ポンド増えた一方、リーグ順位が5位から17位に落ちて放映権が3890万ポンド減った。本業の利益（クラブの表記はイービットディーエー。償却などを引く前の利益）は1億1230万ポンドで22%減り、営業損益は5040万ポンドの赤字（前の年は2130万ポンドの黒字）。選手の売却益5260万ポンドを除くと1億300万ポンドの赤字で、前の年の6100万ポンドの1.7倍。金融費用は差し引き7020万ポンドで、親会社に渡した株を買う権利の評価損2340万ポンドが増えた分とほぼ同じ。最終は9470万ポンドの赤字で、5年でいちばん大きく、5年の合計は3億4160万ポンド。純借入は8億3120万ポンドで本業の利益の7.4倍、借入の9割超は固定金利で平均金利3.07%、満期の平均は17.6年。手元の現金は7900万から2040万ポンドに減り、決算期のあとに親会社が1億ポンドの出資を確保した。2026年6月期の決算は、まだ出ていない。デロイトの集計では2024-25の収入は世界9位。純借入は円でおよそ1740億円（1ポンド209円）
short_title: トッテナム、優勝の年は収入が最多でも最終は赤字。営業は黒字から赤字へ
