    - - ケルン
      - ザンクトパウリに5対0（奥寺が2点）
    - - 結果
      - 得失点差3で、ケルンが優勝
    highlight_row: 0
  say:
  - text: 日本人で初めてブンデスリーガでプレーした、奥寺康彦。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: none
    short_only: true
  - text: デビューは1977年10月22日、デュイスブルク戦。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
  - text: 始まってすぐにファウルで、PKを与えてしまいます。
    card: none
  - text: キーパーが止めてくれたものの、しばらくは味方からパスが来ませんでした。
    card: none
  - text: 流れを変えたのは12月、カップ戦の準々決勝です。
    card: none
  - text: 2点を決めて、2点をお膳立て。9対0の大勝でした。
    card: none
    emph: true
  - text: 最終節を前に、首位の2チームの差は得失点差だけでした。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: {<<: *finalcard, highlight_row: 0}
  - text: 得点から失点を引いた差は、ケルンが10上。そこへボルシアMGが迫ります。
    card: {<<: *finalcard, highlight_row: 1}
  - text: ケルンの相手は、ザンクトパウリ。途中から入った奥寺が、2点を決めます。
    card: {<<: *finalcard, highlight_row: 2}
    callword: 2ゴール
  - text: 2点目は、飛び込んでのダイビングヘッド。
    card: none
    emph: true
  - text: このゴールは、その月の最優秀ゴールに選ばれました。
    card: none
  - text: 試合は5対0。得失点差3で、ケルンが優勝します。
    card: {<<: *finalcard, highlight_row: 3}
  - voice: 奥寺康彦
    text: あそこで僕が２点取れたのは大きかったと思いますね。
    card: none
  - text: カップ戦も制して、二冠。ドイツに来て1年目の出来事でした。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
