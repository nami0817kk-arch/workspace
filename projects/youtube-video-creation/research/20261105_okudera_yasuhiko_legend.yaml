# 奥寺康彦（元日本代表、ブンデスリーガ初の日本人選手）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-05。型は 11/1 の中村憲剛と同じ8節。
# **情報の時点は 2026-11-04。**年齢は当時のものだけ（生年月日 1952-03-12 から計算）。いまの年齢は言わない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は JFA 日本サッカー殿堂の掲額文・ブンデスリーガ公式日本語版のインタビュー・Sportiva のインタビュー・
#   英語版/ドイツ語版/日本語版 Wikipedia の成績表と季の記事だけ。kicker・weltfussball・fussballdaten は 403 で読めなかった。
# **私生活（家族・子ども）は入れない。女子サッカーは入れない**。Jリーグは引退後の役職の事実だけで、題材にしない。
#
# **題材を選んだ理由**：直近30日に未出の大物で、チャンネルの主題（海外サッカー）にいちばん近い日本人レジェンド。日本人で初めてブンデスリーガでプレーし、1年目にリーグとカップの二冠、
#   欧州チャンピオンズカップでアジア人初の得点。ブンデスリーガ1部 234試合26得点は、得点は岡崎慎司（2014）、出場は長谷部誠（2017）が抜くまで日本人の最多。
#   候補から外したもの：中澤佑二（Commons の写真が小さく全面のサムネが組めない、と 11/1 の担当が報告済み）、本田圭佑・香川真司・長友佑都・川島永嗣（現役または引退が確かめられない）、
#   釜本邦茂（2025年に死去。追悼の回になるので見送り）、高原直泰（沖縄SVで選手登録が続いていたかを確かめきれない）。
# **重なりの確認（2026-11-04）**：scripts/・research/covered.yaml・research/posted.json を「奥寺」で grep → 岡崎慎司の台本（10/27）が「奥寺康彦以来2人目」と1か所書いているだけ。主役の回は無い。
#   research/20261105_picks.txt の他の担当（バリオス・ハキミとアレクサンダー＝アーノルド・バルセロナ・フラム・トーレス）とも重ならない。
# **引退の確認**：JFA 日本サッカー殿堂（2012年 第9回 掲額）の掲額文「1986年に…古河電工に再加入」「（JSL）1970～77、86～88年」、Sportiva 2020-11-20「古河電工復帰後、88年に引退」、
#   日本語版 Wikipedia「1987-88年シーズンを最後に現役を引退」。→ **現役ではない**（1988年に引退）。
# **いまの立場**：日本語版 Wikipedia は「2022年1月に横浜FC会長を退任、2月からシニアアドバイザー」「2026年2月からヴィアティン三重の強化アドバイザー」と書くが、
#   **一次情報（クラブの発表）まで辿れなかった**ので台本では言わない。言うのは「引退後、ジェフ市原の監督、横浜FCの社長・会長を務めた」（JFA の掲額文・Sportiva 2020・J リーグ公式 2017）と殿堂入りまで。
# **日本との接点**：全体が日本人選手の海外挑戦の話。日本代表 32試合9得点（JFA）。
#
# **数字の出どころ**
# - 生年月日 1952-03-12・秋田県生まれ（JFA 殿堂）。日本代表（国際Aマッチ）32試合9得点、1972〜1987年（JFA 殿堂の「国際Aマッチ32」「9」、英語版の年別表で 1987年が最後）。
# - ブンデスリーガ1部：ケルン 75試合15得点、ブレーメン 159試合11得点、合計 234試合26得点（ドイツ語版 Statistik・英語版の成績表。合計は Sportiva・ブンデスリーガ公式日本語版の「234試合」とも一致）。
#   2部：ヘルタ 25試合8得点（ドイツ語版・英語版）。JFA 殿堂の「ブンデスリーガ通算259試合34得点」は 1部234＋2部25、26＋8 で一致（自分で足した）。
#   ブレーメンの季ごと：30・34・29・33・33（英語版）＝159。5季×34節＝170 のうち 159 → **約94%**（自分で計算）。
#   1試合あたりの得点（自分で割った）：ケルン 75÷15＝**5試合に1点**、ブレーメン 159÷11＝**約14.5試合に1点**。
# - 1年目（1977-78）：リーグ 20試合4得点（英語版）。本人「1年目はリーグ戦で4ゴール…すべてシーズン終盤」（ブンデスリーガ公式日本語版インタビュー前編の問いと答え）。
# - 移籍：1977年夏、日本代表の西ドイツ合宿で、二宮寛監督とケルンのヘネス・バイスバイラー監督の縁でケルンの練習に参加（Sportiva 前編・ブンデスリーガ公式前編・JFA 殿堂）。
#   紅白戦でスタメン組の左サイドのFW（Sportiva）。合宿の終わりにオファー（Sportiva）。日本リーグの100試合まで「あと2試合」で、10月に渡った（ブンデスリーガ公式前編）。25歳（生年月日から）。
# - デビュー：1977-10-22 デュイスブルク戦、始まってすぐにファウルでPKを与え、GKシューマッハーが止めた（ブンデスリーガ公式前編の本人の言葉。日本語版 Wikipedia も 10月22日）。英語版の「10月5日」は採らない。
# - 初得点：DFB杯準々決勝、シュヴァルツヴァイス・エッセン戦 9対0、2得点2アシスト（Sportiva 前編p3の本人の言葉。英語版も12月20日・2得点・9対0）。
# - リーグ初得点：1978-04-08 カイザースラウテルン戦（英語版・日本語版）。
# - 最終節 1978-04-29：ケルンはボルシアMGと勝ち点で並び、得失点差は10上。MG はドルトムントに12対0、ケルンはザンクトパウリに5対0、得失点差3でケルン優勝
#   （英語版 1977–78 Bundesliga、Sportiva 後編p1 の本人の言葉「得失点差は10点開いていて」「12－０」「５－０」「得失点３差で優勝」）。
#   奥寺は途中出場で2得点、2点目はダイビングヘッド（Sportiva 後編・日本語版）。ドイツ語版「Flugkopfball…zum 0:5-Endstand…wurde zum Tor des Monats gewählt」→ 月間最優秀ゴール。26歳。
#   DFB杯も優勝で二冠（JFA 殿堂・英語版）。
# - 1978-79 欧州チャンピオンズカップ準決勝、ノッティンガム・フォレスト戦の第1戦（敵地）3対3、後半から出て終了間際に同点ゴール（ブンデスリーガ公式後編の本人の言葉）。
#   アジア人として大会で初めての得点（英語版・日本語版。日本語版は次のアジア人得点が16年後の1994-95季と書く）。第2戦はホームで0対1（日本語版）。フォレストはその季に優勝（英語版 1978–79 European Cup）。
# - 1980年：バイスバイラーがニューヨーク・コスモスへ。後任の下で出番を失い、2部のヘルタへ（Sportiva 後編p2・ブンデスリーガ公式後編）。当時の外国人枠は2つ（Sportiva 後編p2 の本人の言葉）。
#   ヘルタで右サイドバックに（試合当日に監督から。Sportiva 後編p3）。ブレーメンのオットー・レーハーゲルが呼び、右サイドバックで起用（同）。
# - ブレーメン：在籍中に2位3回・5位2回（Sportiva 後編p4 の本人の言葉。英語版 Honours：準優勝 1982-83・1984-85・1985-86）。
#   1985-86 はホームでバイエルンとの直接対決、終了間際のPKをクツォップがポストに当て、最終節で敗れて勝ち点で並ばれ得失点差で2位（Sportiva 後編p4）。
# - 1986年：古河電工に戻り、スペシャル・ライセンス・プレーヤー（JFA「わが国初のプロ選手登録」）。同年アジアクラブ選手権優勝に貢献（JFA）。34歳。1988年に引退（36歳）。
# - 記録：26得点は 2014年に岡崎慎司、234試合は 2017年に長谷部誠が抜く（Sportiva 前編プロフィール・ブンデスリーガ公式日本語版）。日本語版は日付まで（2014-09-13・2017-03-05）。
#   最後のドイツでの得点 1986-03-15 → 2014-09 まで **28年あまり**、ドイツでの最終季 1986年 → 2017-03 まで **30年あまり**（自分で数えた）。
# - 引退後：ジェフユナイテッド市原の監督（1996、JFA・英語版の監督成績）、横浜FCの GM・社長（JFA）、会長（Sportiva 2020・サッカーキング 2018）。2017年10月に横浜FCで1試合だけ暫定監督（J リーグ公式 2017-10-25）。
#   日本サッカー殿堂 2012年（JFA）、アジアサッカー殿堂 2014年（英語版）。
# - 愛称「東洋のコンピューター」（Sportiva 後編の前書き）。
# - 本人の言葉（原文のまま、短く切る）：
#   ①Sportiva 前編p3 バイスバイラーの言葉として「ケルンはお前を必要としている。だから来るべきなんだ」
#   ②Sportiva 前編p4 バイスバイラーの言葉として「サッカー選手に国は関係ない」
#   ③Sportiva 後編p1「あそこで僕が２点取れたのは大きかったと思いますね」
#   ④Sportiva 後編p3「でも仕方なくやったら、これがめちゃくちゃ面白かった。」
#   ⑤ブンデスリーガ公式後編「日本の選手のプロ化のきっかけを作れたことが、ドイツで9年間やってきたことの意義なのかなと思います。」
#   ⑥ブンデスリーガ公式後編（長谷部に記録を抜かれて）「うれしいですね。長くやっていなければ破られない記録でしたし」
#
# **入れなかったもの**：家族・出産、プリマハムのCM、「日本人初のプロ」の異説（佐田繁理）、63試合連続出場（1つの資料だけ）、プリマス・アーガイルの役職、ヴィアティン三重（一次情報に辿れない）、
#   ムルデカ大会の得点王、キャプテン翼、1986年キリンカップ、ソウル五輪予選の細部、年俸。
# **写真**：assets/images/20261105_okudera_yasuhiko_legend/
#   01・02 = ブンデスリーガ公式日本語版のインタビュー（前編・後編）の主写真（© Takehiko Noguchi、2017年の取材時、1920x1080）。代理店ではない。
#   04（assets/images/20261105_okudera_koln1977/01.jpg に移した。ショートの写真の入れ替えに拾われて2.4倍に伸びるため）= Flickr「Yasuhiko Okudera 1977 from japan and Köln」（riyanroco、全権利保有、640x812）。ケルンのユニフォームで入場する場面、後ろに MSV（デュイスブルク）の選手。撮影者・試合日は不明なので「その試合の写真」と言わない。
#   05 = Flickr（Sh@tei）ヴェルダー・ブレーメン博物館の展示（1984年の集合写真）。1024px で本編に敷くと1.88倍に伸びるので使わなかった（取り込んだが削除）。
#   バイスバイラー = Commons「Vogts Weisweiler.jpg」（Pelz、CC BY-SA 3.0、1970年）を 04 と並べた 20261105_okudera_pair_weisweiler/01.jpg。
#   03 = Sportiva 掲載の横浜FC提供写真（500x375 と小さく、三浦知良も写るので使わない）。Commons の「Yasuhiko Okudera.jpg」は YouTube 動画の切り出しなので使わない。
#   ケルン・ブレーメン時代の写真で使えるものは他に無かった（Sportiva の写真は Getty、ブンデスリーガ公式の現役時代の写真は imago で、どちらも不可）。
