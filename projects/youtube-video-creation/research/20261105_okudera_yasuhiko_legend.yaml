  say:
  - text: 2年目、ケルンは欧州チャンピオンズカップに出ます。いまのチャンピオンズリーグです。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
  - text: 準決勝の相手は、イングランドのノッティンガム・フォレスト。
    card: none
  - text: 敵地での第1戦。後半から入った奥寺が、終了間際に同点ゴールを決めます。
    card: {<<: *eurocard, highlight_row: 0}
