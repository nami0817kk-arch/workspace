- id: view
  heading: 奥寺康彦の234試合は、ケルンとブレーメンでどう違ったのか
  tier: 背景
  telop: 点を取るウイングから、休まないサイドバックへ
  viewpoint: true
  card: &viewcard
    type: table
    title: ブンデスリーガ1部の奥寺康彦
    columns:
    - クラブ
    - 試合
    - 得点
    - 1点あたり
    rows:
    - - ケルン
      - '75'
      - '15'
      - 5試合
    - - ブレーメン
      - '159'
      - '11'
      - 約14.5試合
    - - 合計
      - '234'
      - '26'
      - 9試合
    source: Wikipedia（ドイツ語版・英語版）から計算
    highlight_row: 0
  say:
  - text: 最後に、奥寺康彦の数字を並べます。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: none
  - text: ウイングだったケルンでは、75試合で15得点。5試合に1点のペースです。
    card: {<<: *viewcard, highlight_row: 0}
  - text: サイドバックになったブレーメンでは、159試合で11得点。
    card: {<<: *viewcard, highlight_row: 1}
  - text: およそ14.5試合に1点です。
    card: {<<: *viewcard, highlight_row: 1}
    mark:
      kind: circle
      row: 1
      col: 1点あたり
  - text: 一方で、ブレーメンの5季、170試合のうち、出たのは159試合。およそ94％です。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
    emph: true
  - text: 点を取る役から、休まずに出続ける役へ。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
  - text: 奥寺の価値は、得点よりも出場の数に表れていました。
    card: none
  - text: どこに置いても働き、休まず出続ける。
    card: none
  - text: 「東洋のコンピューター」は、その賢さへの呼び名でした。
    card: none
    emph: true
  - text: 得点の記録は28年あまり、出場の記録は30年あまり、日本人の最多でした。
    card: none
    emph: true
  - text: 日本人がブンデスリーガでプレーするのは、いまや当たり前です。
    card: none
  - text: その道を最初に開いたのが、奥寺康彦でした。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: none
  quotes_from: []
  sources:
  - https://de.wikipedia.org/wiki/Yasuhiko_Okudera
  - https://en.wikipedia.org/wiki/Yasuhiko_Okudera
  - https://ja.wikipedia.org/wiki/%E5%A5%A5%E5%AF%BA%E5%BA%B7%E5%BD%A6
