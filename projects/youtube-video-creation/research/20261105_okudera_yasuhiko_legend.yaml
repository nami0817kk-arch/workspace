  say:
  - text: 1977年の夏。日本代表が、西ドイツで合宿を張ります。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: {<<: *movecard, highlight_row: 1}
  - text: 監督の二宮寛は、ケルンの名将、バイスバイラー監督と親しい仲でした。
    image: assets/images/20261105_okudera_pair_weisweiler/01.jpg
    card: none
  - text: その縁で、奥寺康彦はケルンの練習に加わります。
    card: none
  - text: 紅白戦では、レギュラー組の左のフォワードに入ります。
    card: none
  - text: 本人はあとで、あれは事実上の入団試験だったと振り返っています。
    card: none
  - text: 合宿の終わり、ケルンから誘いが届きます。
    card: {<<: *movecard, highlight_row: 2}
    emph: true
  - text: 言葉も分からない国。迷う奥寺に、バイスバイラー監督はこう言いました。
    card: none
  - voice: バイスバイラー監督
    text: ケルンはお前を必要としている。だから来るべきなんだ。
    card: none
  - text: なぜ日本人なのかと聞かれた監督は、こう答えたといいます。
    card: none
  - voice: バイスバイラー監督
    text: サッカー選手に国は関係ない。
    card: none
    emph: true
  - text: 1977年10月、奥寺康彦は25歳で、ケルンへ渡りました。
