- id: bremen
  heading: ウイングの奥寺康彦は、なぜサイドバックとしてブレーメンに呼ばれたのか
  tier: 報道
  telop: ヘルタ・ベルリンから、ブレーメンへ
  card: &bremencard
    type: table
    title: 西ドイツの3クラブ
    columns:
    - クラブ
    - リーグ
    - 試合
    - 得点
    rows:
    - - ケルン
      - 1部
      - '75'
      - '15'
    - - ヘルタ
      - 2部
      - '25'
      - '8'
    - - ブレーメン
      - 1部
      - '159'
      - '11'
    source: Wikipedia（ドイツ語版・英語版）
    highlight_row: 2
  say:
  - text: 1980年、バイスバイラー監督がアメリカのクラブへ去ります。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
  - text: 当時、外国人の枠は2つ。新しい監督の下で、奥寺の出番は無くなりました。
    card: none
  - text: 自分から移籍を願い出て、向かったのは2部のヘルタ・ベルリン。
    card: {<<: *bremencard, highlight_row: 1}
  - text: ある試合の当日、右サイドバックの選手が病気で出られなくなります。
    card: none
  - text: 監督が代わりに指名したのは、奥寺でした。
    card: none
  - text: 守備の位置は、初めてでした。
    card: none
  - voice: 奥寺康彦
    text: でも仕方なくやったら、これがめちゃくちゃ面白かった。
    card: none
    emph: true
  - text: そのプレーを見ていたのが、ブレーメンの監督、オットー・レーハーゲル。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: none
  - text: 相手に付いて回るマンツーマンが主流の時代に、場所で守れる奥寺に目を付けます。
    card: none
  - text: 1981年、奥寺はブレーメンへ。5季で、リーグ2位が3回ありました。
    card: {<<: *bremencard, highlight_row: 2}
    emph: true
  - text: 最後の季は、バイエルンとの直接対決で、終了間際のPKが外れます。
    card: none
  - text: 最後は得失点差で、優勝を逃しました。
    card: none
  quotes_from:
  - https://sportiva.shueisha.co.jp/clm/football/wfootball/2020/11/20/post_251/
  sources:
  - https://sportiva.shueisha.co.jp/clm/football/wfootball/2020/11/20/post_251/
  - https://www.bundesliga.com/jp/bundesliga/news/20191022-okudera-interview02-7670
  - https://en.wikipedia.org/wiki/Yasuhiko_Okudera
  - https://de.wikipedia.org/wiki/Yasuhiko_Okudera
- id: after
  heading: 日本に戻った奥寺康彦は、何を変えたのか
  tier: 報道
  telop: 1986年、古河電工へ。日本で初めてのプロ選手登録
  card: &aftercard
    type: timeline
    title: 日本に戻ってから
    rows:
    - - 1986年
      - 古河電工へ。日本で初めてのプロ選手登録
    - - 1988年
      - 現役を引退
    - - 2012年
      - 日本サッカー殿堂に入る
    - - 2014年・2017年
      - 岡崎慎司が得点、長谷部誠が出場の記録を更新
    highlight_row: 0
  say:
  - text: 1986年、34歳の奥寺康彦は、古巣の古河電工に戻ります。
    image: assets/images/20261105_okudera_yasuhiko_legend/01_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: 日本サッカー協会は、日本で初めてのプロ選手として登録しました。
    card: {<<: *aftercard, highlight_row: 0}
  - text: Jリーグができる、7年前のことです。
    card: none
    emph: true
  - voice: 奥寺康彦
    text: 日本の選手のプロ化のきっかけを作れたことが、
    card: none
  - voice: 奥寺康彦
    text: ドイツで9年間やってきたことの意義なのかなと思います。
    card: none
    cont: true
  - text: 1988年に、現役を引退します。
    card: {<<: *aftercard, highlight_row: 1}
  - text: そのあとは、ジェフ市原の監督や、横浜FCの社長、会長を務めました。
    card: none
  - text: 2012年には、日本サッカー殿堂に入っています。
    card: {<<: *aftercard, highlight_row: 2}
  - text: ドイツで残した数字は、長く破られませんでした。
    image: assets/images/20261105_okudera_yasuhiko_legend/02_w.jpg
    card: none
  - text: 得点は2014年に岡崎慎司が、出場は2017年に長谷部誠が、ようやく上回ります。
    card: {<<: *aftercard, highlight_row: 3}
  - text: 長谷部に抜かれたとき、奥寺はこう話しています。
    card: none
  - voice: 奥寺康彦
    text: うれしいですね。長くやっていなければ破られない記録でしたし。
    card: none
  - text: ここまでは、2026年11月4日時点の情報です。
    card: none
