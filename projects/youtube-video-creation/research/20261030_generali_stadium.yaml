# 取材メモ（2026年10月30日）ミランとインテルの新スタジアム「ジェネラリ・スタジアム」。命名権の額（情報筋）と、設計者マニカの言葉（ニュースのショート。見せ方 Y＝設計者本人の言葉から始める）
# 取材: 2026-10-30。requests（ブラウザUA）で本文を全部読んだ。ESPN は記事API（now.core.api.espn.com/v1/sports/news/50317859）。
#   ・ESPN「Sources: New Milan, Inter stadium gets $725M naming rights deal with Generali」（10/29）— 題材の元。
#       地の文: 木曜（29日）のクラブ発表で命名権をジェネラリに売ったと発表。クラブは「世界のスポーツで最大級の命名権契約の一つ」と説明。
#       「Sources confirmed to ESPN that the deal is worth €650 million ($725 million) over 20 years.」＝金額は情報筋（クラブの発表の文言ではない）。
#       2021年11月、Crypto.com がロサンゼルスの競技場（レイカーズ等の本拠）に20年で約7億ドルと報じられ、当時は史上最高額と見られていた。
#       新スタジアムは7万1500席、設計はフォスター＋パートナーズとMANICA（ウェンブリーを一緒に設計）。着工は2028年、最初の試合は2031-32シーズンが目標（許認可しだい）。
#       デザインはミラノのドゥオーモの職人技に着想、2層の360度のすり鉢、傾斜は最大37度。サン・シーロは1926年開場、1990年W杯のために改修。
#       クラブが昨年11月に土地を1億9700万ユーロで買った（今日は使わない。10/4 の本と重なる）。
#   ・Football Italia「Architect insists new Generali Stadium ‘will be even more San Siro’ than it is today」（10/29 発表の夜）
#       マニカ: 「The most important thing that we realised when we designed this project is that San Siro is a feeling」
#               「It’s more than a building, it’s a feeling. We brought all the seats as close as possible to the field. They could not be any closer, it’ll actually feel as though you’re sitting on the grass.」
#               記事の地の文: 「even more San Siro than it is today」にすると保証した。
#       フォスター: 「low in the body, and rises up at either end」（ゴール裏の両端が立ち上がる形）。
#       発表は「ダービーの数日前」、ダービーは土曜（10/31）。
#   ・Football Italia「OFFICIAL: Generali Stadium presented」（10/29）— 一次の声明の紹介。欧州の大会では「Milano Stadium」と呼ぶ。
#       命名権は「報じられたところでは年2600万ユーロ×25年＝6億5000万ユーロ」と書く（ESPNは20年）。→ 年数が食い違うので、台本は総額だけ言い、年数は「20年」を ESPN の情報筋の形で言う。
#       外観はドゥオーモに着想のX字の構造と2重曲線の屋根。外側のLEDで試合ごとに色を変えられる。2層・傾斜37度。
#       着工は2028年（別の記事は2027年と書いていたが、ESPN と声明の紹介は2028年。2028年を使う）。
#   ・Guardian「Inter and Milan unveil plans for new shared stadium to replace San Siro」（10/29）
#       建設費は12億ユーロ（約10億ポンド）の見込み（ガーディアンの報道）。7万1500席。2031-32シーズンからサン・シーロに代わる。
#       発表の場（カステッロ・スフォルツェスコ）にインテルのファンの一団が入り、「you will never extinguish the lights at San Siro」の横断幕を広げ、「hands off San Siro」と叫んだ。
#       いまのサン・シーロは7万5000席。EURO 2032（イタリアとトルコの共催）の会場候補。
# 言わないこと: 命名権の年数（20年か25年かで報道が食い違う）。ミランとインテルの収入の話（財政の回と重ねない）。サン・シーロの買い取り額（10/4）。曲線席の席数（1万1500と1万1700で食い違う）。
#   ダービーの結果（土曜の試合で未出）。ジェネラリがどんな会社かの細部。
# 本人の言葉: 設計者マニカの言葉（2紙で一致）。ミラン・インテルの選手・監督の言葉は今日の本文に無い。反応: 0件（作らない。approve は --no-voices で）。
# 訳はこちらの自訳（英語から）。確度: 発表（名前・設計・席数・着工と開業の目標）は 報道（ESPN・Football Italia・Guardian の3紙で一致）。金額は 報道（情報筋）。建設費12億ユーロは 報道（1紙）。見立ては 背景。
# 写真: Commons のサン・シーロ（いまの競技場）。新スタジアムの完成予想図（Foster + Partners 提供）は使わない（クレジットが配信元）。サン・シーロの写真なので「新スタジアムの写真」とは言わない。
