# 朝の一報 の取材メモ（2026年9月4日）
slot: morning
date: "2026年9月4日"

theme:
  id: endo_ucl
  league: england
  prefix: ""
  title: 遠藤航がCL登録外 なぜ12月まで戻らない選手が選ばれたのか
  hook: リバプールのチャンピオンズリーグ登録メンバーから、遠藤航選手が外れました。
  question: なぜ、長期離脱中の選手が登録され、遠藤選手が外れたのか。

thumbnail:
  line1: 遠藤航 CL登録外
  line2: けが人が選ばれ、遠藤が外れた
  tags: [遠藤航, リバプール]

answer: 25人枠の使い方と、21歳未満の登録免除に2シーズンの在籍が要るという規定が、遠藤選手の枠を奪いました。
watch: 冬の移籍市場で遠藤選手が動くかどうかです。契約は2027年の夏までです。

sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 遠藤航とキエーザが登録外
    card:
      type: points
      title: リバプールのCL登録メンバー
      items:
        - 登録できるのは25人
        - 遠藤航が枠から外れた
        - フェデリコ・キエーザも外れた
    say:
      - リバプールが、チャンピオンズリーグの登録メンバーを確定させました。
      - この中に、日本代表の遠藤航選手の名前はありません。
      - イタリア代表のフェデリコ・キエーザ選手も、同じく外れています。
      - キエーザ選手は筋肉のけがで、8月のプレシーズン以降、試合に出ていません。
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/49818474/federico-chiesa-wataru-endo-left-liverpool-champions-league-sq
      - https://football-tribe.com/japan/2026/09/04/358882/

  - id: why
    heading: なぜ外れたのか
    tier: 報道
    telop: 21歳未満の枠に、2シーズンの壁
    card:
      type: points
      title: 枠が埋まった理由
      items:
        - 25人とは別に21歳未満の登録枠がある
        - 使うにはクラブに2シーズン以上いることが必要
        - 条件を満たさない若手が25人枠を使った
    say:
      - 理由は、ヨーロッパサッカー連盟の登録の決まりにあります。
      - 25人の枠とは別に、21歳未満の選手を登録できる枠があります。
      - ただしこの枠を使うには、そのクラブに2シーズン以上いることが必要です。
      - 条件を満たさないジェレミー・ジャケ選手とジョバンニ・レオーニ選手が、25人の枠を使いました。
      - さらに、ウーゴ・エキティケ選手も登録されています。
      - エキティケ選手は、早くても12月下旬まで復帰が見込まれていません。
      - 現地メディアは、けがで長期離脱中の選手が優先された点に驚きが集まっている、と伝えています。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/04/358882/
      - https://www.espn.com/soccer/story/_/id/49818474/federico-chiesa-wataru-endo-left-liverpool-champions-league-sq

  - id: next
    heading: これからどうなる
    tier: 報道
    telop: 「放出すべきだった」との声も
    card:
      type: quote
      label: Jamie Carragher
      text: Endo has done a great job, but he should have been sold.
      translation: 遠藤は素晴らしい仕事をしてきたが、放出すべきだった。
    say:
      - リバプールOBのジェイミー・キャラガー氏は、厳しい見方を示しています。
      - 遠藤は素晴らしい仕事をしてきたが、放出すべきだった、と話しています。
      - 遠藤選手は2023年にリバプールに加入し、公式戦87試合で2ゴール2アシストを記録しました。
      - 昨シーズンのプレミアリーグでの出場は8試合、そのうち7試合が途中からの出場でした。
      - 契約は2027年の夏までです。
      - 現地では、いまの体制で出場機会を得るのは難しい、との見方が出ています。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/04/358864/
      - https://www.kicker.de/tiefschlag-fuer-endo-und-eine-brutale-prognose-1249612/artikel
