- id: history
  heading: 1935年の頂点
  tier: 背景
  telop: 1935年、ただ一度の1部優勝
  narrator: 解説
  card:
    type: table
    title: 1935年の頂点
    columns:
    - ''
    - ''
    rows:
    - - 監督
      - アイルランド人のオコンネル
    - - 決めた試合
      - サンタンデールで5対0
    - - 2位との差
      - 勝ち点1
  say:
  - 1部の頂点に立ったのは**1935年**。率いたのはアイルランド人のオコンネル監督です。
  - 決めたのは北の町サンタンデール。**5対0**で勝ち、マドリードを勝ち点1差でかわしました。
  - その日のセビージャは春祭り。知らせは、祭りの小屋の黒板で伝えられました。
  sources:
  - https://en.wikipedia.org/wiki/Real_Betis
  - https://es.wikipedia.org/wiki/Real_Betis_Balomp%C3%A9
  bg: assets/backgrounds/stadium_レアルベティス_in.png
  official: false
- id: history2
  heading: 同じ町で3部へ
  tier: 背景
  telop: 優勝を決めた町で、12年後に3部へ
  narrator: 解説
  card:
    type: table
    title: 同じ町で3部へ
    columns: &id001
    - ''
    - ''
    rows:
    - - 1936年から
      - 内戦。優勝した選手が散る
    - - 1947年
      - サンタンデールで1対4。3部へ
  say:
  - ところが翌年から内戦。優勝した顔ぶれは散り、残ったのは**2人**だけでした。
  - 1947年には、あの優勝を決めたサンタンデールで**1対4**。3部へ落ちます。
  - text: 3部には7年。1954年に3部で優勝し、1部から3部まで、すべての優勝を持つクラブに。
    card:
      type: table
      title: 同じ町で3部へ
      columns: *id001
      rows:
      - - 1954年
        - 3部で優勝し、2部へ戻る
  - 負けても応援をやめない、あの合言葉がファンに根づいたのは、この苦しい時代です。
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_Real_Betis_Balomp%C3%A9
  - https://en.wikipedia.org/wiki/Real_Betis
  bg: assets/backgrounds/stadium_レアルベティス_in.png
  official: false
- id: history3
  heading: ファンが取り戻したクラブ
  tier: 背景
  telop: ファンが集めたお金と、筆頭株主との対立
  narrator: 解説
  card:
    type: table
    title: ファンが取り戻したクラブ
    columns: &id002
    - ''
    - ''
    rows:
    - - 1992年
      - 株式会社に。ファンが4億ペセタ
    - - 2009年
      - 2部へ。6万人を超える抗議
  say:
  - 1992年、法律で株式会社になるとき、ファンは3か月で**4億ペセタ**を集めました。
  - それでも足りず、残りを出した副会長のロペラが、筆頭株主になります。
  - text: 2009年に2部へ落ちると、**6万人**を超えるファンが町を歩き、身を引くよう求めました。
    card:
      type: table
      title: ファンが取り戻したクラブ
      columns: *id002
      rows:
      - - 2017年
        - 株をファンと株主へ売り出す
  - 2017年、株は1株**120ユーロ**でファンと株主に売り出され、ロペラはクラブを離れました。
  sources:
  - https://en.wikipedia.org/wiki/Real_Betis
  - https://es.wikipedia.org/wiki/Historia_del_Real_Betis_Balomp%C3%A9
  - https://es.wikipedia.org/wiki/Real_Betis_Balomp%C3%A9
  bg: assets/backgrounds/stadium_レアルベティス_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: とにかく打つ。実力者を拾う。落ちても戻る
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - とにかく打つ
    - - 運営の型
      - 行き場を失った実力者を拾う
    - - クラブの気質
      - 2部優勝7回。落ちても戻る
  say:
  - text: ペジェグリーニ監督のチームは、とにかく打つ。リーグ戦の開幕5試合で、シュートは**89本**です。
    image: assets/photos/ll/betis/betis_manager_56bb9280.jpg
  - ピッチの外は、行き場を失った実力者を拾う型。
  - イスコは2023年に加入。そのシーズン、試合の最優秀選手に**19回**。リーグ最多でした。
  - そして、落ちても戻ってくる。2部での優勝は**7回**あります。
  sources:
  - https://en.wikipedia.org/wiki/Real_Betis
  - https://www.marca.com/futbol/betis/2026/09/16/bombardeo-ofensivo-betis-100-remates-seis-partidos.html
  - https://en.wikipedia.org/wiki/Isco
  bg: assets/backgrounds/stadium_レアルベティス_in.png
  official: false
- id: episode
  heading: キーパーも蹴った決勝
  tier: 背景
  telop: 1977年の国王杯決勝、キーパーどうしのピーケー
  narrator: 解説
  card:
    type: table
    title: キーパーも蹴った決勝
    columns:
    - ''
    - ''
    rows:
    - - 1977年 国王杯決勝
      - アスレティックと2対2
    - - ピーケー戦
      - キーパーのエスナオラも成功
    - - 10人目
      - 相手のキーパーが失敗。8対7
  say:
  - text: 1977年、国王杯の決勝。アスレティックと**2対2**のまま、ピーケー戦に入りました。
    image: assets/images/ll_betis_episode/scene.jpg
  - 決着は10人目まで持ち越し。ベティスは、キーパーのエスナオラも決めていました。
  - 最後に外したのは、相手のキーパーのイリバル。**8対7**で勝ち、クラブ初の国王杯です。
  sources:
  - https://en.wikipedia.org/wiki/1977_Copa_del_Rey_final
  - https://en.wikipedia.org/wiki/Real_Betis
  bg: assets/backgrounds/stadium_レアルベティス_in.png
  official: false
