- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 21シーズンぶりの舞台と、73歳の監督
  narrator: キャスター
  say:
  - text: 今季は**21シーズン**ぶりに、チャンピオンズリーグへ。
    image: assets/stats/ll_betis_data_r1.png
    no_telop: true
  - text: 率いるペジェグリーニ監督は、誕生日にこう話しました。
    image: assets/stats/ll_betis_data_r2.png
    no_telop: true
  - voice: マヌエル・ペジェグリーニ
    text: いま、このレベルで働いている73歳は、わたしだけだ
    image: assets/stats/ll_betis_data_r2.png
  - text: そしてファンの合言葉は、「負けても、ベティス万歳」。
    image: assets/stats/ll_betis_data_r3.png
    no_telop: true
  - image: assets/stats/ll_betis_data0.png
    text: 創立は**1907年**。名前のベティスは、町を流れる川の、ローマ時代の呼び名です。
    no_telop: true
  - image: assets/stats/ll_betis_data1.png
    text: 愛称は「エリオポリタノス」。本拠地のある地区の名で、意味は**太陽の町**。
    no_telop: true
  - image: assets/stats/ll_betis_data2.png
    text: ホームタウンはセビージャ。アンダルシアの州都で、スペインで**5番目**に大きな町です。
    no_telop: true
  - image: assets/backgrounds/stadium_レアルベティス.png
    text: 本拠地はラ・カルトゥーハ。いつもの競技場を改修するあいだの仮住まいで、**7万人**が入ります。
  - image: assets/stats/ll_betis_data4.png
    text: 会長は**2016年**からアンヘル・アロ。株主が選ぶ形の株式会社です。
    no_telop: true
  - image: assets/stats/ll_betis_cups.png
    text: 1部の優勝は**1回**。国王杯は**3回**。スーペルコパとヨーロッパの大会は、まだ優勝がありません。
    no_telop: true
  - image: assets/stats/ll_betis_data6.png
    text: 最多出場は、2度在籍したホアキン。**528試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_betis_data7.png
    text: 直近のタイトルは2022年の国王杯。いまの本拠地で、ピーケー戦を**5対4**で制しました。
    no_telop: true
  - image: assets/stats/ll_betis_data8.png
    text: 昨季のリーグ戦は**5位**。勝ち点は**60**でした。
    no_telop: true
