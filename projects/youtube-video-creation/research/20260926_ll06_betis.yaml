  - text: ルベン・カストロは2010年、2部にいたベティスに加わった点取り屋です。
    image: assets/photos/ll/betis/betis_legend_db788c4e.jpg
  - 再び2部で戦った2014年からのシーズン、リーグ戦**31得点**。1年で1部へ戻しました。
  - リーグ戦で**260試合135得点**。公式戦の**148得点**は、クラブの歴代最多です。
