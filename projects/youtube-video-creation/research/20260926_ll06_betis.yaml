  - text: デニウソンは1998年、サンパウロから加わったブラジル代表のドリブラーです。
    image: assets/photos/ll/betis/betis_legend_62f14409.jpg
  - 移籍金は**2150万ポンド**で、当時の世界最高額。それでも2年目、チームは2部へ落ちます。
  - 残ってリーグ戦で**185試合**。在籍中の2002年、日韓ワールドカップで優勝しました。
