# ラミン・カマラ（モナコ／セネガル代表）の紹介。選手紹介の型（2026-11-17 公開分、シリーズ「有名選手の紹介」。key: player_918969）。情報の時点は 2026-11-12（クラブの試合は 11/8 のリーグ・アン第10節まで）。
# **FotMob は使わない。**数字は Transfermarkt API の試合記録（控え research/raw/20261115_camara_*.json）、英語版 Wikipedia、AS モナコ公式（2024-07-31）、AfricaSoccer の記者会見記事（2025-12-12・2026-02-28）。
# **選んだ理由（2026-11-12）**：player_pool.py list で紹介済みを除いた市場価値の上位は 26 ヌメチャ（11/15 に使う）・30 カマラ・33 ファン・ヘッケ・34 G.ラモス。TM の市場価値の推移（20万→5500万、およそ275倍）が題の引きになる。11/13 の担当は「今季13試合2点で題が弱い」と外したが、得点でなく値段と出場時間の話にした。
#   重なり：scripts/ を「カマラ」で grep → ニュース・10/14 の比べる（バレバ×カマラ）に名前が出るだけで紹介は0件。同じ日（11/17）の別シリーズでは使わない。
# **現役・今季もリーグ・アン**：TM の試合記録で 2026-11-08（ル・マン戦 1-1）まで90分出場。
# **数字の軸**：TM の試合記録。クラブ通算は メス37/2（Bチーム1試合除く）、モナコ85/7＝122試合9点、アシストはメス6＋モナコ12＝18。リーグ・アンは 23/24 31/1/4、24/25 29/2/7、25/26 24/3/4、26/27 10/0/1（900分＝全試合フル出場）。市場価値（TM）：2023-06 20万（メスB）→2024-06 1000万→2026-09 5500万（÷20万＝275）。
#   **代表の通算は台本に出さない**：TM は39試合5得点、英語版 Wikipedia は50試合7得点（2026-09-29 時点）で食い違うため。
# **本人の言葉**：AfricaSoccer（2025-12-12 の記者会見、2026-02-28 の取材）の英訳からの日本語訳。ほかの一次の原文（フランス語）は確かめられなかった。
# **入れなかったもの**：チェルシー移籍の破談報道（Wikipedia が未確認と明記）、2025年アフリカ選手権の結果（Wikipedia は準優勝、別の記事は優勝で食い違う）、W杯2・3戦目の相手名。
# **確かめられなかった**：モンペリエ戦の「2006年以降いちばん遅いゴール」は検索結果の要約（beIN SPORTS の見出し）から。58メートル弾の「歴代4番目」は AS モナコ公式の記述。
# **写真**：Commons の「Lamine Camara France v Senegal 16 June 2026」（CC BY-SA 4.0、Bryan Berlin）と、AfricaSoccer の記事写真2枚（モナコ時代。代理店のURLではない）。3枚だけなので、行ごとに入れ替える。
