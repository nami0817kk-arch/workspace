#   ・（2226636）11日の全体練習でフォーメーション練習。ブラジルメディア globo によると、GKベント、最終ラインは右からウェズレイ・フランカ、ジャイール・クーニャ、ガブリエウ・マガリャンイス、ドウグラス・サントスの4バック。前線は3トップで右にエステヴァン、左にヴィニシウス・ジュニオール、中央にハフィーニャ。この8名は「現時点で日本戦での先発出場が濃厚」。
#     中盤は流動的。マルロン・ゴメス、ガブリエル・ボンテンポ、ハイアンを並べる形を試し、その後はボンテンポを残してジョアン・ゴメスとアンドレイ・サントスを組み合わせた。中盤の核ブルーノ・ギマランイスは始動から3日連続で個別調整で、日本戦を欠場する可能性。残り2回の全体練習で状態を見極める。
#     日本対ブラジル: シンガポール・ナショナルスタジアム、11/14（土）日本時間19時15分（ESPN の fifa.friendly 11/14 は 10:15 UTC＝日本時間 19:15 と一致）。
#   ・（2226597）globo によると、W杯でキャプテンだったDFマルキーニョス（PSG）が不在のため、アンチェロッティ監督はハフィーニャに腕章を託す。前回の活動中に定めたリーダーシップの序列に従った。ブルーノ・ギマランイス、ヴィニシウス、ガブリエウ・マガリャンイスも候補だった。ハフィーニャの代表での振る舞いと、バルセロナでも主将を務めている点が高く評価された。ハフィーニャ不在の場合はギマランイスが腕章。
#     ハフィーニャは今夏のW杯メンバーに入っていたが、日本が1-2で敗れたラウンド32は負傷で欠場。日本が歴史的初勝利を収めた昨年10月の対戦時も出場していない。
#   ・（2226515）10日の練習は18名。ガブリエウ・マガリャンイス、ヴァンデルソン、ブルーノ・ギマランイス、ハフィーニャの4人は疲労を考慮してジムでのトレーニング。9月のオーストラリア遠征でも、ブルーノとガブリエウは全体練習を回避したが試合には問題なく出ている。ドウグラス・サントスらは11日から合流。
#   ・ESPN fifa.world summary event=760487（W杯ラウンド32 ブラジル2-1日本、2026-06-29）の出場メンバー（rosters。自分で数えた）:
#       ブラジルの先発11人: アリソン／ダニーロ・ガブリエウ・マガリャンイス・マルキーニョス・ドウグラス・サントス／カゼミーロ・パケタ・ブルーノ・ギマランイス／マテウス・クーニャ・ヴィニシウス・ジュニオール・ライアン。ベンチ14人: ネイマール、マルティネッリ、レオ・ペレイラ、イゴール・チアゴ、ダニーロ・サントス、エデルソン（2人）、ファビーニョ、エンドリック、ロジェル・イバニェス、ブレーメル、ルイス・エンリケ、アレックス・サンドロ、ウェヴェルトン。
#       → 今回先発濃厚の8人のうち、W杯のこの試合で先発したのは3人（ガブリエウ・マガリャンイス、ドウグラス・サントス、ヴィニシウス）。ベント、ウェズレイ・フランカ、ジャイール・クーニャ、エステヴァン、ハフィーニャの5人は、ESPN の出場メンバー表（先発11人とベンチ14人）に名前が無い（ハフィーニャは出典どおり負傷で欠場）。
#       W杯のこの試合の先発のうち、ブルーノ・ギマランイス（今回は欠場の可能性）、マルキーニョス（不在）、アリソン・ダニーロ・カゼミーロ・パケタ・マテウス・クーニャ・ライアンは、今回先発濃厚の8人に入っていない。
#   ・ESPN fifa.friendly summary event=757632（昨年10月14日 日本3-2ブラジル。日本が勝者）→ 出典の「歴史的初勝利」と一致。
#   ・ハフィーニャの今季の数字: ESPN（esp.1 / uefa.champions の teams/83/schedule と各試合の summary。自分で数えた）: バルセロナの8/23〜11/8の公式戦16試合のうち14試合に出場（10/10 ゲタフェ戦と10/13 ガラタサライ戦は不出場）、19得点。→ 2226597の「14試合19ゴール」と一致。
# 食い違い: ①ハフィーニャの出場数。2226597は「14試合19ゴール3アシスト」、サッカーキングの契約延長の記事の見出しは「今季13試合19ゴール」（延長記事は11/8のアトレティコ戦＝ハフィーニャ無得点の前の数字）。ESPN で14試合19得点と確かめ、台本は14試合19得点。②ブラジルの招集人数: 発表は26名、2226515は「招集メンバー25名が揃い」（台本では人数を言わない）。
