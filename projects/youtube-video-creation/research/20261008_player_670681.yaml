# ベリンガム（research/20261006_player_581678.yaml）の形にそろえた（2026-10-08）。雛形は tools/player_intro.py 670681。
# 材料は research/raw/20261008_joao_neves_material.md、数字と写真は research/raw/20261008_player_670681.md。
# 通算は Transfermarkt（performance-season を季ごとに合計）と FotMob（careerHistory）で突き合わせ、試合と得点は一致
#   （ベンフィカ75-4・パリ102-14・ポルトガル代表30-4 → 207試合22点。ベンフィカB 11試合と U19・U21 は入れない）。アシストは食い違うので出さない。
# 季ごとの数字はクラブW杯2025（7試合2点）の置き場が2社で違う（FotMob 25/26、TM 24/25）。台本は FotMob の割り振りで出す。
#   「ベンフィカの2季で4点、パリで14点」の比べは、この置き場に左右されない。
# 身長は**クラブ公式の174センチ**を使う（Transfermarkt は1.71m。食い違いは基礎DATAの書き込み＝添え書きで出す）。
# 契約の満了年は 2029/2030/2031 で割れているので**年を言わず**「2026年9月に延長」とだけ言う。
# 移籍金はベンフィカの CMVM 届け出（固定 59,921,587ユーロ／総額 69,908,518ユーロ）。報道の「6000万＋1000万」はこれを丸めたもの。
#   円は 1ユーロ＝177円（2026-10-07 実測の中ほど。open.er-api 178.13／frankfurter 176.85）で、6991万ユーロ＝約124億円。
# 2026年のバロンドールは授賞式が 10月26日で**まだ結果が出ていない**。順位を言うのは2025年の19位だけ。10/26 以降に出すなら作り直す。
# 2025年10月の「けがで代表離脱」の記事は**去年の話**（2025-09-17 アタランタ戦のハムストリング）。今季のけがの登録は無い。
# 2026-10-07 夜までに入った板（⑪⑬）を選手紹介で初めて使う：冒頭の強い一点に stats、マンC戦の1試合に stats、
#   パリでの10冠に verdict、移籍金に convert、年齢と市場価値に scatter、見立ての「この回だけの数字」に calc。書き込みは2か所（身長の添え書き・calc の丸）。
# 同じPSGのヴィティーニャの回（scripts/20261005_player_487469.md）と重ねない：あちらは「パスで試合を動かす司令塔」「バロンドール3位」。
#   こちらは「守る位置から点の取れる位置まで」。昨日のヴィニシウス（20261007）・ベリンガム（20261006）とも言い回しを重ねない。
# 写真は時期ごとに切り替える（ベンフィカ2023／パリ2024／代表2026年3月／W杯2026年7月）。同じ選手を横に並べない。スタジアムの写真は出さない。
#   4枚とも Commons で、代理店（Getty・AFLO・AFP・ロイター・IMAGO・AP・PA・Lusa・EPA）由来は1枚も無い。
