- id: view
  heading: 今季の0点を、どう見るか
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 今季は8試合0点。それでも形は作れている
  card:
    type: table
    title: 直近5試合（代表を含む）
    columns: [日付, 相手, 出場, 得点, 評点]
    rows: &recent_rows
    - ['10/1', デンマーク（代表）, 9分, 0G 0A, '-']
    - ['9/27', ノルウェー（代表）, 55分, 0G 0A, '7.1']
    - ['9/24', ウェールズ（代表）, 1分, 0G 0A, '-']
    - ['9/20', マルセイユ, 90分, 0G 0A, '8.0']
    - ['9/13', ブレスト, 90分, 0G 0A, '7.4']
    source: FotMob
  say:
  - text: ここからは、今季の出足をどう読むかです。
    image: assets/images/20261008_player_670681/psg2026/01.jpg
    card: &recent_card
      type: table
      title: 直近5試合（代表を含む）
      columns: [日付, 相手, 出場, 得点, 評点]
      rows: *recent_rows
      source: FotMob
  - text: ネヴェスはクラブと代表で8試合、470分。まだ0点0アシスト。
    card: *recent_card
  - text: 昨季は5試合に1点の割でしたから、出足は遅れています。
    card: *recent_card
  - text: ただ9月20日のマルセイユ戦は90分で評点8.0。
    card:
      <<: *recent_card
      highlight_row: 3
  - text: 過去2季の平均、7点台を上回る出来でした。
    card:
      <<: *recent_card
      highlight_row: 3
  - text: 点だけが出ていません。シュートは10本撃っています。
    image: assets/stats/player_20261008_1342757_shots.png
    no_telop: true
    card: none
  - text: 入りやすさを足し合わせたゴール期待値は、1.5ぶん。
    image: assets/stats/player_20261008_1342757_shots.png
    no_telop: true
  - text: 10本のうち8本は、ペナルティエリアの中か、その縁から。
    image: assets/stats/player_20261008_1342757_shots.png
    no_telop: true
  - text: 機会は作れていて、まだ決まっていないだけ、とも読めます。
    image: assets/stats/player_20261008_1342757_shots.png
    no_telop: true
  - text: ここで、ベンフィカとパリの点の出方を割ってみます。
    image: assets/images/20261008_player_670681/psg2026/01.jpg
    card: &calc_card
      type: calc
      title: パリでの1点あたりの試合数
      terms:
      - ['102試合', パリでの出場]
      - ['14点', 挙げた点]
      - ['7.3試合', 1点あたり]
      ops: ['÷', '＝']
  - text: パリでの出場を、挙げた点で割ると、1点あたり7.3試合。
    card: *calc_card
    mark: {kind: circle, item: 2}
  - text: ベンフィカでは18.8試合に1点。およそ2.6倍の速さです。
    emph: true
    card: *calc_card
    mark: {kind: circle, item: 2}
  - text: 代表では、ジェズス監督が9月の会見でこう話しました。
    image: assets/images/20261008_player_670681/wc2026/01_w.jpg
    card: none
  - voice: ジェズス監督
    text: ネヴェスは明日の試合に出る。
  - voice: ジェズス監督
    text: 彼は、とても大事な運動量と
    cont: true
  - voice: ジェズス監督
    text: 守備での激しさを与えてくれる子だ
    cont: true
    pause: 0.5
  - text: 9月からの代表4試合で、出た時間は合わせて65分。
  - text: 先発は1試合だけで、まだ序列の途中にいます。
  - text: クラブの次は日本時間11日の未明、本拠地でのル・マン戦。
    image: assets/images/20261008_player_670681/wc2026/01_w.jpg
  - text: 10月26日にはバロンドールの発表。去年は19位でした。
  - text: 174センチの22歳が、どこまで伸びるのか。見どころです。
