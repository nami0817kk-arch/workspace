#       F365 の本文: アリソンは34歳。シュートストップと1対1は世界屈指だが、配球でたびたびリバプールに不利益。フェネルバフチェ戦で「ふわっとした高いボールを処理できず」決勝点につながった。
#       今夏はユベントスが強く関心、リバプールは契約を12カ月延長するオプションを行使。契約は今季末まで。母国ブラジル復帰の話も。
#   ・Football ZONE 683248（TEAMtalk を引く。全文）: 鈴木は今夏パルマからヴィラへ完全移籍、エメリ監督の下でレギュラーに定着、公式戦13試合に出場。移籍金は推定3000万ポンド（約63億円）。
#       TEAMtalk は鈴木の「スイーパーキーパーとしての能力や、配球力を生かしたビルドアップ」を評価。関心を寄せるのはレアル・マドリード・PSG・アーセナル・マンC・リバプール・トッテナム（いずれも TEAMtalk の報道）。
#   ・リバプール公式サイトの media watch（https://www.liverpoolfc.com/news/zion-suzuki-transfer-eyed-by-arsenal-and-liverpool 。CaughtOffside の転載で、クラブの見解ではないと注記あり）: 鈴木は24歳。ヴィラ加入は今夏、パルマから。
#   ・ESPN（site.api.espn.com uefa.champions event=401915382）: フェネルバフチェ 3-2 リバプール（11/4 17:45 UTC＝日本時間11/5 未明）。79分 ムリキ（F、ヘディング、アシストはブラウン）。ESPN の試合記録はアリソンのプレーの中身（落球）を載せていない。
#   ・サッカーキング 2026-11-04（2224321）: 日本代表28人のGK3人に鈴木彩艶（アストン・ヴィラ）。14日にブラジル、17日にパラグアイ。
#   ・年齢は Wikidata の生年月日から 2026-11-08 時点: 鈴木彩艶 2002-08-21（24）／アリソン・ベッカー 1992-10-02（34）。
# 食い違い・扱い: ①「アリソンが高いボールを処理できなかった」は F365（と Tribe）だけで、ESPN では確かめられない → 「報道では」と断り、決勝点の分・得点者は言わない。
#   ②日付: Tribe は「11月5日」開催（日本時間）、ESPN は 11/4 の夜（UTC）→ 台本は日付を言わない。③獲得候補は Football Insider・TEAMtalk ともに 報道（クラブの発表なし）。→ 確度は報道どまり、「獲得へ」とは言わない。
#   ④F365 は「契約は今季末まで」、Tribe は「今季終了後に退団する可能性」→ 台本は「今季の終わりに」と報道の言い方に合わせる。
