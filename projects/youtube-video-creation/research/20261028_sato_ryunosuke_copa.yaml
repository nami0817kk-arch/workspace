# 佐藤龍之介（バレンシア）の取材メモ（2026年10月28日・ショートだけ・見せ方 X＝冒頭に強い一言）
# 題材の元: research/20261028_topics_src.yaml の num 2（フットボールゾーン 681196、地元紙スーペルデポルテの報道）。
# 読んだ出典（requests・ブラウザUAで本文。控え research/raw/20261028_sato_copa_src.txt）:
#   ・フットボールゾーン 681196（2026-10-28）: 今季からスペイン1部バレンシアに加入。開幕後は先発もあったが、成績不振で監督が交代し、
#     アギーレ監督の就任後はチャンスを得られていない。28日の国王杯タベルネス戦では「主力数人を休ませ、普段は出場機会の少ない選手にチャンスを与える考え」。
#     スーペルデポルテ「佐藤龍之介は、アギーレがタベルネス戦で送り出す先発の、大きな変更点の一つとなりそうだ…まだ1分も出場していない」。
#     「パテルナで通常どおり練習を続けているにもかかわらず、出場機会から遠ざかっている」。主写真は REX/アフロ → 使わない。
#   ・スーペルデポルテ原文 135778972（10/26）: Sato apunta a ser una de las grandes novedades del once de Aguirre contra el Tavernes / no ha disputado todavía ningún minuto desde la llegada del mexicano。
#     佐藤は Valencia Mestalla（Bチーム）の登録（ficha del filial）で、規定上は下部組織の選手として数える。1部のチームは下部組織の登録の選手を同時に4人までしかピッチに置けない → 佐藤が先発すれば残りは3枠。
#   ・スーペルデポルテ 135786729（10/27）: 試合は水曜21時、メスタージャ。主力を休ませ、出番の少ない選手に機会。Sato は todavía no ha debutado con Javier Aguirre。コルベランのもとでは機会があった。
#   ・スーペルデポルテ 135814108（10/27）: 「佐藤とエリオットは先発がほぼ確実」。
#   ・（使わない）スーペルデポルテ 135798850（10/27、見出しだけ）: バレンシアが100年以上の歴史で2度目、メスタージャで「アウェー」として戦う。ESPN の日程も「Valencia at Tavernes de la Valldigna」、2026-10-28T20:00Z（日本時間29日5時）。
#   ・スーペルデポルテ 135761497（10/26）: 次のリーグ戦は日曜、エルチェとアウェー（マルティネス・バレロ）。
# 所属の確認: ESPN の esp.1（2026年シーズン）の20チームにバレンシアがある。research/ll_data/clubs.json（2026-27）にもある → 今季ラ・リーガ1部。
# 試合は公開（10/28 11:30）の後（日本時間29日朝5時）。**結果は書かない。先発は地元紙の見込みと断る。**
# 言わないこと: 試合数・先発数（今日の出典に無い。10/20 の本は別の記事の数字）、タベルネスの所属リーグ（本文に無い。「格下」も言わない＝「カテゴリーの差」は本文にあるが具体は無い）、移籍の噂。
# 本人の言葉: 無い。アギーレ監督の佐藤についての言葉も、今日の出典の本文には無い（10/10 の動画の見出しだけ）→ 型は X。作らない。
# 反応: 0件。作らない。
# 重なり: 10/20 の本（ビルバオ戦も出番なし・オランダ紙の見立て）と言い回し・写真を重ねない。今日は「国王杯で先発の見込み」と「Bチーム登録の4人枠」が新しい。
# 写真: 01 スーペルデポルテ（Germán Caballero、ベティス戦でシュート）／03 スーペルデポルテ（Germán Caballero、10/22 のパテルナでの練習）／04 スーペルデポルテ（JM López、7月の入団会見）。
#   3枚とも本人を目で確かめた（キャプションに Sato の名前、顔も一致）。代理店ではない（新聞社の写真部）。許諾は得ていない＝引き受ける危険。
#   02（7月の記事の写真、キャプションに Sato）は顔の一致に自信が無いので外した。
# 確度: 報道（地元紙1社の見込み）。
