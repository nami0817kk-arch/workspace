  question: 控訴したシティと、告発の発端をつくった男に、これから何がいつ決まるのか
  takeaway: プレミアリーグの控訴で結果が動いた前例は、違反を認めたうえで罰の重さを争ったエヴァートン（勝ち点10から6）で、同じく罰の重さを争ったフォレストの4点は1点も戻らなかった。違反そのものを覆したのは2020年のシティ自身で、ウエファの出場停止を時効と立証不足で取り消させた。今回の控訴は最初の審理の証拠を見直す場で、新しい証拠は当時出せなかったものに限られ、シティが持ち出すとみられる「政府の資金」という説明は、最初の審理で後からこしらえた説明として退けられている。最初の分かれ目は、今季から入った12週の決まりを使うかを示す10月8日まで。使われれば答えは1月23日までに出る。10月8日の2日後には、告発の発端となったピントの保護が切れる
