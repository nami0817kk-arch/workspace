# 10/2 に「マンC、115件の告発のうち114件で有罪」を出している（scripts/20261002_city_verdict.md）。
# 件数・金額・前例・「上訴の期限」「新しい3人の委員会」「1月末まで」「罰は別の審理で時期未定」はそこで言った。この回は言い直さない。
# この回は、申し立てと声明・規則の日付（7日・84日・5日・30日）・告発の発端のピント・控訴で何が変わりうるか（争った点の比べ）に絞る。
# 事実の裏: 規則は PL ハンドブック 2026/27 の W.76・W.85・W.86・W.88・W.92・W.95。12週の決まりは 2025/26 の規則集に無い（新しい）。
#   「政府の資金」の説明を委員会が退けたのは判断の 76・77項（21ページ、画像）。2018年11月の記事・前年のサーバーへの侵入は 103・104項。
#   ピントの有罪判決（2023年9月、4年の執行猶予つき、不正なデータアクセス・恐喝未遂・通信の秘密の侵害）は RTÉ 2023-09-11。
