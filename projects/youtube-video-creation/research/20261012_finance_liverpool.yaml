# クラブの財政：リヴァプール（10/12 月、シリーズ「クラブの財政」、key: finance_liverpool、型は news）。
#
# 軸は「**優勝した年に、売上を増やしたのはリーグではなかった**」。
#   10/11 バイエルン回の軸（株の持ち主＝会員・50プラス1）／10/10 PSG 回（関連当事者取引・公正価値）／
#   10/9 レアル回（スクワッド・コスト・ルール）／10/3 バルサ回（使える上限）は**1行も出さない**。
#   ★**スクワッド・コスト・ルール（70%）は言わない**（レアル回の軸）。人件費の割合は「売上に対する割合」だけ。
#   ★**10/9 のユニフォームの回で言った胸スポンサー・用具メーカー・エンブレム・シャツの話は言い直さない**
#     （日立・スタンダードチャータード・トルコ航空・アディダス・ヒルズボロの炎は1行も出さない）。
#     商業収入は**総額（3億2347万ポンド）と前の季からの増減だけ**。内訳の社名・金額は言わない。
#   ★同じ日の他の回（ブレントフォード＝スタジアム、レバンテ＝クラブ紹介、イプスウィッチ＝ユニフォーム、
#     アトレティコ・アルバレス）の名前は1つも出していない。チャンピオンズリーグは大会名だけで、相手クラブは言わない。
#
# **出どころ（一次情報まで辿れたもの）**:
#   ○ **クラブの決算書**（The Liverpool Football Club and Athletic Grounds Limited、Companies House 00035668）。
#       2025年5月期（2026-03-04 提出、取締役会の承認は 2025-09-22）／2024年／2023年／2022年／2021年の5冊。
#       **画像のPDFなので1ページずつ開いて読んだ**（P&L・貸借・キャッシュフロー・注記2/3/4/9）。数字は千ポンド単位の原文から。
#   ○ **クラブ公式の決算発表**（liverpoolfc.com、2026-02-27）。CFO の言葉と前の季からの増減が出ている。
#   ○ **プレミアリーグの公式発表**（premierleague.com「2024/25 Payments to Clubs」「2023/24 Payments to Clubs」の表の画像）。
#       リヴァプールへの配分 2024/25＝1億7490万ポンド（20クラブで最高）、2023/24＝1億7100万ポンド。
#   ○ **デロイトのフットボール・マネー・リーグ 2026（2026-01-22、2024/25）**＝リヴァプール 5位 8億3600万ユーロ。
#   ○ ヨーロッパ中央銀行の参照相場（frankfurter.app 経由）2026-10-09：1ポンド＝209.22円（丸めて209円）。
#   × **ヨーロッパの大会からの配分額（クラブごと）は、UEFA の公式資料で見つけられなかった**
#       （uefa.com の配分の頁は総額と仕組みだけ。クラブごとの表は無い）。だから台本では
#       「ヨーロッパの大会でいくら入ったかは決算に別の行が無い」と言い、**額は言わない**。
#       「リーグ以外のメディア収入」は**決算の放映権収入からリーグの配分を引いた自分の引き算**で、台本でもそう言う。
#
# ★**数字が3種類あるので混ぜない**:
#   (1) **8億3600万ユーロ** … デロイトの集計（2024/25、世界5位）。ユーロ。
#   (2) **7億272万ポンド** … クラブの決算の売上（2025年5月期。クラブ公式の発表は「703百万ポンド」、戦略報告は702.8）。ポンド。
#   (3) **1億7490万ポンド** … プレミアリーグが公表した配分（リーグの中央支払い。メディア収入の一部）。
#   **(1) と (2) を為替で橋渡ししない。**台本では「集計はデロイト、決算はクラブ」と出どころを言い分けるだけ。
#   決算の季は 6月1日〜5月31日。「2024-25」＝2025年5月期。
#
# 自分で計算した数（機械は検算しない）:
#   売上の増加 702.722 − 613.764 ＝ 88.958 →「8900万」
#   メディア 263.659 − 203.705 ＝ 59.954 →「6000万」／商業 323.472 − 308.398 ＝ 15.074 →「1510万」／試合日 115.591 − 101.661 ＝ 13.930 →「1390万」
#   waterfall は 613.8＋60.0＋15.1＋13.9 ＝ 702.8（板の合計は決算の 702.7 を置く。0.1の端数）
#   放映権収入の増加 ÷ 売上の増加 59.954 ÷ 88.958 ＝ 67.4% →「3分の2」「67.4%」
#   売上の構成（2024-25）メディア 37.5%・商業 46.0%・試合日 16.4%（語りでは使わない）
#   試合日から補償金（前の季に含まれる860万）を除く：101.661 − 8.6 ＝ 93.061 →「9310万」。115.591 − 93.061 ＝ 22.53 →「2250万」
#   リーグの配分の増加 174.9 − 171.0 ＝ 3.9 →「390万」（2.3%）。売上の増加に対して 3.9 ÷ 88.958 ＝ 4.38% →「4.4%」
#   メディアからリーグ配分を引いた残り：前の季 203.705 − 171.0 ＝ 32.705 →「3270万」、今季 263.659 − 174.9 ＝ 88.759 →「8880万」、差 56.054 →「5610万」（2.7倍）
#   メディア収入に占めるリーグ配分：171.0 ÷ 203.705 ＝ 83.9% →「84%」、174.9 ÷ 263.659 ＝ 66.3% →「66%」
#   人件費 427.727（前の季 386.086、増加 41.641 →「4160万」）。売上に対して 60.87% →「60.9%」、前の季 62.90% →「62.9%」
#   5季：売上 487.4 → 702.7 ＝ +44.2%、人件費 314.354 → 427.727 ＝ +36.1%
#   割合の5季：2020-21 64.5%（314.354÷487.4）／2021-22 61.6%（366.092÷594.3）／2022-23 62.8%（372.881÷593.8）／2023-24 62.9%／2024-25 60.9%
#   償却 117.165（選手の獲得費用を契約の年数で割って毎年の費用にするもの）。人件費＋償却 ＝ 427.727 ＋ 117.165 ＝ 544.892 →「5億4490万」、売上の 77.54% →「77.5%」
#   現金（キャッシュフロー）2024-25：営業から 103.599／選手の獲得 −113.345／選手の売却 +53.828／設備 −19.370＋0.055 ＝ −19.315／
#     合計 24.767（=「借入を返す前の余り」）。検算 103.599−113.345+53.828−19.315 ＝ 24.767 ✓
#   獲得に出した現金 ÷ 営業の現金 113.345 ÷ 103.599 ＝ 1.094（約1割多い）
#   銀行借入の返済 48.946 →「4890万」。親会社グループからの借入は 19.216 増えて 217.916（語りでは返済だけ言う）
#   5季の現金（獲得／売却／差）：90.168/34.540/−55.628、97.201/32.170/−65.031、122.154/39.072/−83.082、181.568/49.061/−132.507、113.345/53.828/−59.517。
#     合計 604.436 / 208.671 / −395.765 →「6億440万」「2億870万」「3億9580万」。5季の平均の差 79.15 →「7920万」
#   ★2020-21 の現金は 2022年5月期の決算の「比較」欄（restated＝再計算済み）から取った。
#   売却益（5季）39.340 / 28.124 / 33.768 / 22.017 / 53.268 → 2024-25 が最大
#   1日あたり 702.722 ÷ 365 ＝ 1.9253 →「約193万ポンド」。×209 ＝ 402.4 →「約4億200万円」
#   営業の利益 23.761 − 選手の売却益 53.268 ＝ −29.507 →「2950万ポンドの赤字」（保険金1289万も入った上での数）
#   最終の利益 8.273 ÷ 702.722 ＝ 1.18% →「1.2%」
#
# **言い切っていないもの**:
#   ・メディアの増加の中身は「クラブは理由にチャンピオンズリーグ参加を挙げている」まで。
#     「引き算で出した目安」と必ず言う（リーグの配分は決算の季と1月ずれることがありうるため）。
#   ・5位と4位の差100万ユーロは**デロイトの端数**（8億3600万と8億3700万）。丸めのずれも含むので「たった100万ユーロ」と言う。
#   ・次の決算（2025-26）はまだ出ていない。例年2月末〜3月初め（2024-03-08・2025-03-03・2026-02-27〜03-04）。
#   ・この季のあとの夏の補強は**名前も金額も出さない**（クラブは「この期間のあとに大きく投資した」と書くだけ）。
#
# 写真は2枚、入れ替えは1本1回（冒頭＝スタンドを外から見た1枚 → ③の節から中の1枚）。
#   どちらも Commons・CC BY-SA 2.0（Mike Pennington）で、credits.json は assets/backgrounds/ にある。
#   10/9 のユニフォームの回は逆の順（中 → 外）で使っている。顔が入っていないので板が顔にかからない。
# アルファベットは読み上げに出さない（チャンピオンズリーグ・ヨーロッパリーグと書く）。
# サムネは構図 number（10/11 バイエルンは number、10/11 記録は versus、10/10 PSG は scene、10/9 ユニフォームは scene）。
#   **ユーザーと相談して決める**ので、ここに書いたのは案A。案B・Cは報告に出す。
