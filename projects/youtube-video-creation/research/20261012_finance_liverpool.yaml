  league: england
  league_name: プレミアリーグ
  kind: other
  topic: リヴァプール
  title: リヴァプール、優勝の年に7億ポンド超え。増えた収入の96%はどこから来たか
  question: 優勝した年に、収入を増やしたのは何だったのか
  lead: 収入がイングランドでいちばん多いクラブ。
  hook: ただ、優勝の年に、リーグから増えたお金はわずかでした。
  takeaway: リヴァプールの2024-25の収入は、デロイトの集計で8億3600万ユーロ。世界で5番目、イングランドでは最も多く、4位との差は100万ユーロだった。クラブの決算では売上が7億272万ポンドで過去最高、5季前の4億8740万ポンドから2億1530万ポンド増えた。前の季からは8900万ポンド増え、放映権収入が6000万ポンド（増加の67.4%）、商業収入が1510万ポンド、試合日の収入が1390万ポンド。プレミアリーグが公表した配分は1億7490万ポンドで20クラブ最高だが、前の季の1億7100万ポンドから増えたのは390万ポンドだけで、売上の増加の4.4%にすぎない。決算の放映権収入からリーグの配分を引いた残りは3270万ポンドから8880万ポンドへ増え、クラブは理由にチャンピオンズリーグ参加を挙げている。人件費は4億2770万ポンドで売上の60.9%（前の季は62.9%）、5季とも6割台。人件費に選手獲得費用の償却1億1720万ポンドを足すと売上の77.5%。現金の出入りでは、営業から入った現金およそ1億400万ポンドに対し選手の獲得に1億1330万ポンドを出し、売却で5380万ポンドが戻り、設備に1930万ポンドを使って2480万ポンドが残った。5季の選手の売り買いは6億440万ポンド出て2億870万ポンド戻り、差し引き3億9580万ポンドの持ち出し。営業の利益は2380万ポンドだが、選手の売却益5330万ポンドを引くと2950万ポンドの赤字になる。最終の利益は827万ポンドで売上の1.2%。1日あたりの売上はおよそ193万ポンド、円でおよそ4億200万円
  opening_image: assets/backgrounds/stadium_リヴァプール.png
short_title: リヴァプールの優勝の年、収入の増加のうちリーグの配分は4.4%だった
