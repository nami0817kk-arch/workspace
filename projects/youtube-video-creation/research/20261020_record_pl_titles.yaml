# 取材メモ（10/20 火、シリーズ「記録の解説」、key: record_pl_titles、型は news）。
# プレミアリーグの優勝回数（ユナイテッド13・シティ8）を、年代・初優勝からのシーズン数・勝ち点・連覇で数え直す。
#
# ★2026-10-19 に数字を読み直した（requests のブラウザ UA。ブラウザ操作の道具・JavaScript は使っていない）
#   ・プレミアリーグ公式「Premier League Explained」（premierleague.com/en/premier-league-explained）：
#       優勝は7クラブ。ユナイテッド13回は「34シーズンのうち」。1992/93〜2025/26 の優勝クラブを1季ずつ列挙
#       （自分で数え直して一致：ユナイテッド13・シティ8・チェルシー5・アーセナル4・リヴァプール2・ブラックバーン1・レスター1＝34）。
#       「シティは2017/18に2位ユナイテッドと19点差で、記録の最大差」「2011/12の最小の差は得失点差+8（アグエロの決勝弾）」
#       「アーセナルは2003/04に無敗で、チェルシーに11点差で優勝」。
#   ・プレミアリーグ公式記事「Arsenal end 22-year wait for Premier League title」（2026-05）：アーセナルの4回目（2025-26）。
#       本文の優勝回数の表も同じ（ユナイテッド13・シティ8・チェルシー5・アーセナル4・リヴァプール2・1・1）。
#   ・**brief の「昨季の優勝クラブ＝リヴァプール」は古い。** 昨季（2025-26）はアーセナル（勝ち点85、2位シティ78）。
#       リヴァプールは一昨季（2024-25）。2026-27 はいま進行中で、優勝回数はまだ動いていない。
#   ・勝ち点・試合数・2位との差：英語版ウィキペディアの各季（『1992–93 Premier League』〜『2025–26 Premier League』）の最終順位表。
#       34季ぶん全部を requests で読み、勝ち点が 3×勝＋分 と一致することを確かめた。**ウィキペディアは reference 群＝報道止まり**。
#       プレミア公式の「19点差」「+8」「11点差」とは一致。
#   ・38試合になったのは1995-96季から（1992-93〜1994-95は42試合。ウィキペディア『List of Premier League seasons』）。
#
# ★自分で数えたもの（python で再計算、検算済み）
#   年代ごと（季の始まりの年で区切る）：1990年代（1992-93〜1999-2000の8季）ユナイテッド6・アーセナル1・ブラックバーン1／
#     2000年代（2000-01〜2009-10の10季）ユナイテッド5・チェルシー3・アーセナル2／
#     2010年代（2010-11〜2019-20の10季）シティ4・ユナイテッド2・チェルシー2・レスター1・リヴァプール1／
#     2020年代（2020-21〜2025-26の6季）シティ4・リヴァプール1・アーセナル1。ユナイテッドの合計13、シティの合計8に一致。
#   重なり：ユナイテッドの13回は1992-93〜2012-13、シティの8回は2011-12〜2023-24。両方が優勝した季が重なるのは2011-12・2012-13の2季。
#   初優勝から数えた何シーズン目（初優勝の季を1つ目）：ユナイテッド 8回目＝2002-03（11季目）・13回目＝2012-13（21季目）／シティ 8回目＝2023-24（13季目）。
#   同じシーズン数の累計（3・6・9・12・15季目）：ユナイテッド 2・4・7・8・9／シティ 2・2・4・7・8。差 0・2・3・1・1。
#   38試合の季の優勝（1995-96以降）：ユナイテッド11回＝82・75・79・91・80・83・89・87・90・80・89（最高91＝1999-2000、最低75＝1996-97、90以上は2回）／
#     シティ8回＝89・86・100・98・86・93・89・91（最高100＝2017-18、最低86、90以上は4回）。
#   2位との勝ち点差：最大は ユナイテッド18（1999-2000、91対73）・シティ19（2017-18、100対81）。1点以内（0を含む）の優勝は
#     34季で7回：1994-95・1997-98・1998-99・2009-10・2011-12・2018-19・2021-22。うちシティ3回（0・1・1）、ユナイテッド1回（1998-99）。
#   連覇の最長：ユナイテッド3（1998-99〜2000-01、2006-07〜2008-09）・シティ4（2020-21〜2023-24）。34季で4連覇はシティだけ。
#   ユナイテッド最後の優勝（2012-13）のあとの13シーズン：シティ7（2013-14・2017-18・2018-19・2020-21・2021-22・2022-23・2023-24）・
#     チェルシー2・リヴァプール2・レスター1・アーセナル1・ユナイテッド0＝13。
#   直近5回の積み上げ：シティ2018-19〜2023-24＝6シーズン／ユナイテッド2006-07〜2012-13＝7シーズン。
#
# ★重ならないように
#   ・10/17 オールド・トラッフォード・10/20 エティハドは**収容席数**の回。今回は席数・建設・入場者数を使わない。
#   ・10/14 アーセナルの無敗は「2003-04の無敗」だけ。今回アーセナルは4回目の優勝の一言だけ。
#   ・10/19 のCL通算得点の「試合数で割る」物差しは使わない。今回は「シーズン数」「年代」「勝ち点差」で数える。
#   ・過去回への言及は台本に書かない。
#
# ★言い切っていないもの
#   ・シティが13回に並ぶ・追い抜く時期は言わない（予想しない）。事実の比べだけ。
#   ・「ユナイテッドが衰えた」等の理由は言わない（数字に出ない）。
#   ・コンパニの写真は Commons の題・説明（Vincent Kompany holds up the Premier League trophy 2012）による。
#
# ★写真（assets/images/20261020_record_pl_titles/、credits.json に控え。必ず開いて見た）
#   全部 Commons（CC BY / CC BY-SA）。代理店・透かしなし。01＝アーセナル2026の優勝（Chensiyuan, CC BY-SA 4.0）／
#   02・06＝シティ2012のパレード、コンパニ（Stuart Grout, CC BY 2.0）／03＝ユナイテッド1998-99の優勝（Seán Murray, CC BY-SA 2.0）／
#   04＝優勝杯の展示（CC BY-SA 4.0）／07＝シティ2014のパレード、ペジェグリーニ（Oldelpaso, CC BY-SA 3.0）／08＝ユナイテッド1999のパレード（Seán Murray）。
