# プレミアリーグ20クラブ紹介 ⑮マンチェスター・シティ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「ヨーロッパを獲ったクラブが、3部まで落ちた」**。ここが山場（@main）。
# いまの姿からは想像しにくい20年前の話
#
# **買収の是非には触れない。**事実（2008年8月／アブダビの投資グループ）だけ置く
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では15番目」の1行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替え（説明は後ろへ）。
# ③優勝の節は「数えると31個」をやめ、昨季持ち帰った2つから入る形にした
#
# 2026-09-18 追記。①タイトルとサムネを、20本で同じ文面からクラブごとの引きに変えた。
# ②宿敵の節（マンチェスター・ダービー）と「このクラブを語る選手」の節を足した。
# ③theme.hook を1行入れた
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 4節22行 → 2節14行にした。**「2012年の最終節」は山場の節へ、「積み上げた記録」は
# 「獲ってきたもの」へまとめた**（節としては落とした）。落としたできごとは
# クラブワールドカップの1行と、4連覇の言い直し。アグエロの1点は残している
# （「このクラブを語る選手」が「さきほどの最終節」と受けるため）
