sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 教会のチームから、2度の改名を経て
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1880年（St. Mark's）"]
        - ["1887年", "Ardwick Association F.C."]
        - ["1894年", "いまの名前に"]
        - ["愛称", "シチズンズ／ブルーズ／スカイブルーズ"]
    say:
      - 最初の名前は「**セント・マークス**」。教会のチームでした。創設は1880年です。
      - 1887年に「アードウィック・アソシエーション」へ。
      - いまの名前になったのは1894年でした。
      - 愛称は3つあります。「シチズンズ」「ブルーズ」「スカイブルーズ」。
      - 本拠地はエティハド・スタジアム。収容は**6万1038人**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: fall
    heading: 3部まで落ちたクラブ
    main: true
    tier: 背景
    telop: 1998年、3部へ。ヨーロッパを獲った経験がありながら
    narrator: 解説
    card:
      type: table
      title: 落ちて、変わるまで
      columns: ["", ""]
      # 2026-09-22 流れの点検2回目: 読み上げの順に合わせた（落ちた→理由→対比→転機→最終節→優勝）
      rows:
        - ["1998年", "3部へ降格。1990年代に経営が傾いた末"]
        - ["1970年", "カップウィナーズカップ優勝"]
        - ["2008年8月", "アブダビの投資グループが買収"]
        - ["2012年 最終節", "QPRに3-2。決勝点はアグエロ（追加4分目）"]
        - ["同じ日", "1968年以来、44年ぶりの優勝"]
    # 2026-09-22 流れの点検2回目: 落ちた理由を落ちた行の隣に。「44年ぶりの優勝」は最終節の
    # 実況のあとに回し、最後まで結果を知らずに聞ける順にした。「1対2」はどちらが負けているか言う
    say:
      - 1998年、このクラブは**3部**まで落ちました。
      - 1990年代、経営が傾いた末の降格でした。
      - 1970年にヨーロッパの**カップウィナーズカップ**を獲ったクラブです。
      - ヨーロッパを制したクラブの3部落ちは、ドイツのマクデブルクに続く**2例目**でした。
      - 転機は2008年8月。いまのオーナー、アブダビの投資グループがクラブを買い取りました。
      - 2012年の最終節は、クイーンズ・パーク・レンジャーズ戦でした。
      - 1対2で負けたまま、**アディショナルタイム**に入ります。
      - そこから2点。2点目を決めたのはセルヒオ・アグエロ、試合終了の直前でした。
      - 3対2で勝ち、同じ勝ち点のマンチェスター・ユナイテッドを得失点差で上回りました。
      - 1968年以来、**44年ぶり**の優勝でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
      - https://en.wikipedia.org/wiki/Vincent_Kompany
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: マンチェスター・ダービー。相手は今季もプレミアにいる
    narrator: 解説
    card:
      type: table
      title: マンチェスター・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1881年11月12日／3-0"]
        - ["当時の名前", "セント・マークス 対 ニュートン・ヒース"]
        - ["1973-74年", "ローの1点で、相手の降格が決まる"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "相手は、同じ街の**ユナイテッド**です。呼び名は**マンチェスターダービー**。"
      - 初めて当たったのは1881年11月12日。**3対0**という結果でした。
      - このときの両者は、セント・マークスと、ニュートン・ヒースと名乗っています。
      - いちばん語られるのは、1973年から74年の終盤の一戦です。
      - もともとユナイテッドにいたデニス・ローが、シティの選手として**バックヒール**で決勝点を入れました。
      - "この1点で、**ユナイテッドの降格が決まりました。**"
      - "相手は**今季もプレミアリーグにいます。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: オークス、ベル、アグエロ
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["アラン・オークス", "680試合（クラブ最多出場）"]
        - ["コリン・ベル", "リーグ394試合117得点"]
        - ["セルヒオ・アグエロ", "公式戦390試合260得点（クラブ最多）"]
    say:
      - 名前を挙げるなら、この3人です。
      - アラン・オークス。1959年から1976年までの17年間。
      - "リーグとカップを合わせて**680試合**。クラブ史上いちばん多く出場した選手です。"
      - コリン・ベル。1966年から1979年。リーグ394試合で117得点。
      - "「**キング・オブ・ザ・キッパックス**」と呼ばれ、1967年から68年の1部優勝を支えました。"
      - そしてセルヒオ・アグエロ。2011年から2021年まで。
      - "公式戦390試合で**260得点**。このクラブでいちばん多く点を取っています。"
      - さきほどの最終節の1点も、この選手のものでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Alan_Oakes
      - https://en.wikipedia.org/wiki/Colin_Bell_(footballer,_born_1946)
      - https://en.wikipedia.org/wiki/Sergio_Ag%C3%BCero
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースはアーリング・ハーランド
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "エンツォ・マレスカ"]
        - ["主将", "ルベン・ディアス（CB・ポルトガル）"]
        - ["エース", "アーリング・ハーランド（FW・ノルウェー）"]
        - ["今季", "6点。副主将でもある"]
        - ["日本人選手", "なし"]
    say:
      - エースはアーリング・ハーランド。説明の要らない、ノルウェー代表の9番です。
      - 今季すでに**6点**。しかも**副主将**を兼ねています。
      - 主将はルベン・ディアス。ポルトガル代表のセンターバックです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 昨季持ち帰ったのは、FAカップとリーグカップの2つ
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "8回（直近 2025-26）"]
        - ["リーグカップ", "9回（直近 2025-26）"]
        - ["1部優勝", "10回（直近 2023-24）"]
        - ["2022-23年", "リーグ・FAカップ・CLの3冠"]
        - ["2020-21年〜2023-24年", "リーグ4連覇（イングランド記録）"]
        - ["ヨーロッパ", "CL1回（2022-23）／CWC1回（2023）"]
    say:
      - 昨季持ち帰ったのは、FAカップとリーグカップの2つです。
      - FAカップは通算**8回**、リーグカップは**9回**になりました。
      - 1部優勝は**10回**。直近は2023年から24年です。
      - "2022年から23年は、リーグ、FAカップ、チャンピオンズリーグを同じ年に獲った**3冠**でした。"
      - "リーグは2020年から21年のシーズンから**4連覇**。イングランドの記録です。"
      - "ただし**その4連覇を最後に、2シーズン獲れていません。**"
      - 3部にいたクラブが世界一になり、そのあとリーグだけ取り返せていない。今季はそこを見ることになります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
