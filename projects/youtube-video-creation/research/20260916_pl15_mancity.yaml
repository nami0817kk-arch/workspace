sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 教会のチームから、2度の改名を経て
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1880年（St. Mark's）"]
        - ["1887年", "Ardwick Association F.C."]
        - ["1894年", "いまの名前に"]
        - ["愛称", "シチズンズ／ブルーズ／スカイブルーズ"]
    say:
      - アルファベット順では、15番目に来ます。
      - 創設は1880年。最初の名前は「**セント・マークス**」、教会のチームです。
      - 1887年に「アードウィック・アソシエーション」へ。
      - いまの名前になったのは1894年でした。
      - 愛称は3つあります。「シチズンズ」「ブルーズ」「スカイブルーズ」。
      - 本拠地はエティハド・スタジアム。収容は**6万1038人**です。
      - 監督はエンツォ・マレスカ。今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: fall
    heading: 3部まで落ちたクラブ
    main: true
    tier: 背景
    telop: 1998年。ヨーロッパを獲った経験がありながら
    narrator: 解説
    card:
      type: table
      title: 落ちて、変わるまで
      columns: ["", ""]
      rows:
        - ["1998年", "3部へ降格"]
        - ["2008年8月", "アブダビの投資グループが買収"]
        - ["2012年", "初のプレミアリーグ優勝"]
    say:
      - いまの姿からは想像しにくい話があります。
      - 1998年、このクラブは**3部**まで落ちました。
      - しかも、ヨーロッパのタイトルを獲った経験のあるクラブです。
      - "**ヨーロッパの優勝クラブが自国の3部に落ちたのは、これが2例目**でした。"
      - 1990年代、経営が傾いた末の降格です。
      - 転機は2008年8月。アブダビの投資グループがクラブを買い取りました。
      - そこからの動きは、みなさんがご存じのとおりです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: aguero
    heading: 2012年の最終節
    tier: 背景
    telop: アディショナルタイム4分、アグエロ
    narrator: キャスター
    card:
      type: table
      title: 2012年5月13日
      columns: ["", ""]
      rows:
        - ["前半終了時", "0-1"]
        - ["アディショナルタイム", "2点を返す"]
        - ["決勝点", "アグエロ（追加4分目）"]
    say:
      - プレミアリーグでの最初の優勝は、2012年でした。
      - 決まり方が、語り草になっています。
      - "**アディショナルタイムに2点**を取って逆転しました。"
      - 2点目を決めたのはセルヒオ・アグエロ。**追加された4分目**のことです。
      - この1点で、優勝がシティのものになりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: treble
    heading: 積み上げた記録
    tier: 背景
    telop: 4連覇はイングランドの記録
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["2022-23年", "リーグ・FAカップ・CLの3冠"]
        - ["2020-21年〜2023-24年", "リーグ4連覇（イングランド記録）"]
    say:
      - 2022年から23年のシーズンは、クラブの歴史でいちばんの年になりました。
      - リーグ、FAカップ、そしてチャンピオンズリーグ。**3つを同じ年に獲っています。**
      - さらに、2020年から21年のシーズンから**4年続けてリーグを制しました。**
      - 4連覇はイングランドの記録です。
      - 3部にいたのが1998年ですから、そこから25年での出来事でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝10回（直近 2023-24）、FAカップ8回（直近 2025-26）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "10回（直近 2023-24）"]
        - ["FAカップ", "8回（直近 2025-26）"]
        - ["リーグカップ", "9回（直近 2025-26）"]
        - ["ヨーロッパ", "CL1回（2022-23）／CWC1回（2023）"]
    say:
      - 数えると、大きなタイトルで**31個**です。
      - 1部優勝10回、FAカップ8回、リーグカップ9回。
      - 2023年にはチャンピオンズリーグとクラブワールドカップも獲っています。
      - 昨季も、FAカップとリーグカップの2つを持ち帰りました。
      - "ただし**リーグは2023年から24年の4連覇を最後に、2シーズン獲れていません。**"
      - 3部にいたクラブが世界一になり、そのあとリーグだけ取り返せていない。今季はそこを見ることになります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
