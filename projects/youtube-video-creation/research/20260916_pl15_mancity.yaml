sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 教会のチームから、2度の改名を経て
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1880年（St. Mark's）"]
        - ["1887年", "Ardwick Association F.C."]
        - ["1894年", "いまの名前に"]
        - ["愛称", "シチズンズ／ブルーズ／スカイブルーズ"]
    say:
      - 最初の名前は「**セント・マークス**」。教会のチームでした。創設は1880年です。
      - 1887年に「アードウィック・アソシエーション」へ。
      - いまの名前になったのは1894年でした。
      - 愛称は3つあります。「シチズンズ」「ブルーズ」「スカイブルーズ」。
      - 本拠地はエティハド・スタジアム。収容は**6万1038人**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: fall
    heading: 3部まで落ちたクラブ
    main: true
    tier: 背景
    telop: 1998年、3部へ。ヨーロッパを獲った経験がありながら
    narrator: 解説
    card:
      type: table
      title: 落ちて、変わるまで
      columns: ["", ""]
      rows:
        - ["1998年", "3部へ降格"]
        - ["2008年8月", "アブダビの投資グループが買収"]
        - ["2012年", "初のプレミアリーグ優勝"]
    say:
      - 1998年、このクラブは**3部**まで落ちました。
      - しかも、ヨーロッパのタイトルを獲った経験のあるクラブです。
      - "**ヨーロッパの優勝クラブが自国の3部に落ちたのは、これが2例目**でした。"
      - 1990年代、経営が傾いた末の降格です。いまの姿からは想像しにくい話です。
      - 転機は2008年8月。アブダビの投資グループがクラブを買い取りました。
      - そこからの動きは、みなさんがご存じのとおりです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: aguero
    heading: 2012年の最終節
    tier: 背景
    telop: アディショナルタイム4分、アグエロ
    narrator: キャスター
    card:
      type: table
      title: 2012年5月13日
      columns: ["", ""]
      rows:
        - ["前半終了時", "0-1"]
        - ["アディショナルタイム", "2点を返す"]
        - ["決勝点", "アグエロ（追加4分目）"]
    say:
      - "**アディショナルタイムに2点**を取って逆転しました。"
      - 2点目を決めたのはセルヒオ・アグエロ。**追加された4分目**のことです。
      - この1点で、優勝がシティのものになりました。
      - プレミアリーグでの最初の優勝は、2012年でした。
      - 決まり方が、いまも語り草になっています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: treble
    heading: 積み上げた記録
    tier: 背景
    telop: リーグ・FAカップ・CLを同じ年に
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["2022-23年", "リーグ・FAカップ・CLの3冠"]
        - ["2020-21年〜2023-24年", "リーグ4連覇（イングランド記録）"]
    say:
      - リーグ、FAカップ、そしてチャンピオンズリーグ。**3つを同じ年に獲っています。**
      - 2022年から23年のシーズンは、クラブの歴史でいちばんの年になりました。
      - さらに、2020年から21年のシーズンから**4年続けてリーグを制しました。**
      - 4連覇はイングランドの記録です。
      - 3部にいたのが1998年ですから、そこから25年での出来事でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_City_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースはアーリング・ハーランド
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "エンツォ・マレスカ"]
        - ["主将", "ルベン・ディアス（CB・ポルトガル）"]
        - ["エース", "アーリング・ハーランド（FW・ノルウェー）"]
        - ["今季", "6点。副主将でもある"]
        - ["日本人選手", "なし"]
    say:
      - エースはアーリング・ハーランド。説明の要らない、ノルウェー代表の9番です。
      - 今季すでに**6点**。しかも**副主将**を兼ねています。
      - 主将はルベン・ディアス。ポルトガル代表のセンターバックです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 昨季持ち帰ったのは、FAカップとリーグカップの2つ
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "8回（直近 2025-26）"]
        - ["リーグカップ", "9回（直近 2025-26）"]
        - ["1部優勝", "10回（直近 2023-24）"]
        - ["ヨーロッパ", "CL1回（2022-23）／CWC1回（2023）"]
    say:
      - 昨季持ち帰ったのは、FAカップとリーグカップの2つです。
      - FAカップは通算**8回**、リーグカップは**9回**になりました。
      - 1部優勝は**10回**。直近は2023年から24年です。
      - 2023年にはチャンピオンズリーグとクラブワールドカップも獲っています。
      - "ただし**リーグは4連覇を最後に、2シーズン獲れていません。**"
      - 3部にいたクラブが世界一になり、そのあとリーグだけ取り返せていない。今季はそこを見ることになります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
