# プレミアリーグ20クラブ紹介 ⑮マンチェスター・シティ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「ヨーロッパを獲ったクラブが、3部まで落ちた」**。ここが山場（@main）。
# いまの姿からは想像しにくい20年前の話
#
# **買収の是非には触れない。**事実（2008年8月／アブダビの投資グループ）だけ置く
