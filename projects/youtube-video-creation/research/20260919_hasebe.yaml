# 長谷部誠が、日本代表の守備メインコーチになる（2026-09-19）
#
# **取材の下請けが1時間かけて1本も上げられなかったので、こちらで書いた。**
#
# **スポニチの元記事は開けていない**（ユーザーが開くのを止めた）。
# 事実は Yahoo!ニュース に配信されたスポニチの記事2本と、サッカーキング、
# JFA公式で取った。**だから確度は「報道」まで。**
#
# **中村俊輔の担当（攻撃のセットプレー、4月就任）も同じ記事にある。**
# 長谷部だけの話にせず、2人の担当替えとして出す
#
# **斎藤俊秀コーチがどうなるかは、記事に書かれていない。**
# まとめサイトのスレでは「斎藤の立場がない」と書かれているが、
# **報道に無いので台本には入れない。**憶測を事実として出さない
#
# **反応は footballnet（2chまとめ）から。**「長谷部を監督にしろ」という声が
# いちばん多く、次いで「海外で経験を積んでほしい」。**どちらも載せる。**
# 日本語だけで、海外の反応は取れていない（日本の人事なので当然ではある）
