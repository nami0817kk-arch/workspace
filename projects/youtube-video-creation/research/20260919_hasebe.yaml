      title: 長谷部誠の2年
      columns: ["", ""]
      rows:
        - ["2024年5月", "フランクフルトで現役を終える"]
        - ["同シーズン", "フランクフルトU21のコーチに"]
        - ["2024年8月", "日本代表のコーチ陣へ"]
        - ["2026年1月", "クラブを一時離れ、代表に専念"]
    say:
      - "長谷部が現役を終えたのは、**2024年5月**です。"
      - 長く在籍したドイツのアイントラハト・フランクフルトで、選手生活を終えました。
      - そのシーズンから、同じクラブのU21でコーチを始めます。
      - 日本代表のコーチ陣に加わったのが、その年の8月。
      - "そして今年1月、**クラブを一時的に離れて、代表の仕事に専念**しています。"
      - 並行して、ドイツサッカー連盟のAライセンス取得も進めてきました。
      - 現役をやめてから2年で、守備を任されるところまで来たことになります。
    official: false
