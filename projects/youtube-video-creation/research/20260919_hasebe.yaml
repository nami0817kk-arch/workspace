      - 2024年8月にコーチ陣に加わってから、**3年目**を迎えるタイミングでの変更です。
      - 今年4月に就任した中村俊輔コーチが、**攻撃のセットプレー**を担当します。
      - 新しい体制は、9月21日から始まる国内合宿から動き出します。
