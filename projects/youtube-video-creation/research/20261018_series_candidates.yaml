# シリーズ本編10枠の題材候補（2026年10月18日・日）。名前の大きさ順（CLAUDE.md『シリーズの題材は、大物の名前に…』2026-10-16）
# 題材を決めるのはユーザー（○×）。数字は読んだものだけ。要確認と書いたものは未読。
title: 10月18日（日）シリーズ10枠の題材候補
lead: 10枠×候補＝30件。各枠の1番目が名前の大きさ順のおすすめです（○は枠ごとに1つ）。
note: '**並べ方の物差し**：選手は Transfermarkt の市場価値（player_pool）、クラブは世界の収入順位・本拠地の大きさ・CL常連か。軸は『2者の比べ』『順位』『答えを伏せた数字』。

  **足切り（比べる）**：今季リーグ戦の出場時間を Transfermarkt の API（tools/japan_abroad.py と同じ tmapi-alpha、1人1回）で読んだ。2026-10-18 時点。450分以上：ヤマル671・サカ509・ハーランド620・イサク494・ヴィニシウス585・ラフィーニャ555・ヴィルツ560・パーマー621・ライス504・ベリンガム619・エムバペ720・ペドリ530・ロジャーズ613・アンダーソン518。未達：オリーズ393・ケイン386・アルバレス173・クヴァラツヘリア314・ムシアラ148・デンベレ211・ドゥエ319・カイセド176。

  **同じ日にそろえる時の注意**：

  - 選手紹介でヴィルツを選ぶ日は、比べるの予備（ヴィルツ×パーマー）を使わない。

  - 比べるでヤマル×サカを選ぶなら、サカの紹介（10/16）から近い点を許容するか2番目に替える。

  - スタジアムでエティハドを選ぶ日は、ユニフォームのシティを選ばない。

  - 財政でチェルシーを選ぶ日は、移籍でチェルシー系を選ばない（今夏は 10/17 に出済み）。

  - レジェンド（世界）のシャビとイニエスタは同じバルサ中盤なので同じ日に出さない。

  **依頼文との差**：公開済みスタジアムは依頼の3つより多く、サン・シーロ・ボーンマス・エミレーツ・ヴィラ・パーク・ブレントフォードも出ている。財政はデロイト上位10のうちチェルシー以外が全部出済み。

  **レジェンドは毎日2本＝世界1・日本1**（ユーザー決定 10/18）。枠は全部で10。

  **ラ・リーガ**：ll15・ll16・ll20 の置き場は未定（1日1本だと 10/22 まで）。

  地の文は解説1人・FotMob 等は使わない・数字は基本の数と自分で割った90分あたり、はこれまでどおり。'
