# 取材メモ（2026年10月21日）前田大然「よりユニーク」オニール監督が語った使い方（ニュースのショート。見せ方 Y＝監督の一言から始める）
# 取材: 2026-10-21。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261021_ipswichstar_26652100.html（元記事）・_26646734.html（シティ戦後の会見）・20261021_qoly_maeda.txt（一覧の出典）。
#   ・**元記事**＝イプスウィッチ・スター（2026-10-20 13:30Z）「Ipswich Town - Gary O'Neil on what he likes about Jaden Philogene」（Stuart Watson 記者）。**一覧の出典 Qoly（10/21）はこの記事を『IpswichStar』として引いた日本語の孫引き**。
#     Qoly の訳は、原文の別々の箇所をつないでいる（「大然はよりユニークにプレーする、守備的な役割を担うこともあるからね。彼はその役割を完璧にこなしつつ、脅威にもなる」）。
#     原文は過去形（"has played a more unique, defensive role at times. He's carried that out excellently, but still managed to be a threat"）。**台本は原文から訳した**。
#   ・シティ戦後の会見＝同紙 2026-10-17「'Something I'll use again' - O'Neil on switching to wing-backs system at Man City」。3-4-2-1 のシャドー（"dual No.10s"）、前田は右側の10番。
# 【言葉の取り違えを原文で直した点】
#   ・一覧「『大然はよりユニークにプレーする』」→ 原文は "Daizen's played a more unique, defensive role at times"（**時に、より独特な、守備的な役割を担ってきた**）。現在形ではない。
#   ・一覧「次はフォレスト、ハル、ボーンマス」→ 原文は Nottingham Forest（home on Friday night）, Hull City (A), Bournemouth (H)。金曜＝23日（この記事は火曜20日の配信）。
#   ・Qoly の「Ipswich Star 引用」の「（ウィンガーたち）全ての選手が好きだ」は、原文では **"I like them all. We've got good options."**（ウイング4人の話のあとの一言）。
#   ・記事の末尾の表（TOWN'S WINGERS 26/27）：前田は サンダーランド・マンU・リヴァプール＝LW／パレス・エヴァートン＝控え（先発は Clarke）／フルアム＝RW／マンC＝R10（右のシャドー）。
#     → **自分で数えた見立て**：先発の位置は 左ウイング・右ウイング・右のシャドー の3つ（表は地元紙の作ったもの）。
# 【前の本と重ねない】10/18「初ゴール・本人のX・7.2点・保持率80%」／10/19「現地メディアの3つの評価・高い最終ラインの背後を突く狙い」。
#   → 今回は **「使い方の一般論」＝ウイング重視の監督が、前田をどう見ているか** と **位置が試合ごとに変わること**。初ゴール・本人のX・7.2点・グエヒ・ドンナルンマ・最終ラインの背後・保持率は言わない。
#   （初ゴールは「その試合で」と1語だけ触れる。新しい点ではないので詳しく言わない。）
# 本人（前田）の言葉：**今回の記事には無い**。Y の言葉は**オニール監督**の言葉（実在・原文から訳）。台本で「監督」と明記。前田の言葉は作らない。
# 反応：作らない（0件）。
# 確度：監督の言葉は 報道（イプスウィッチ・スターが伝えた会見の言葉。クラブの公式発表ではない）。位置の数えは 背景（自分で数えた見立て）。
# 写真：クラブ公式と記事の主写真ではシティ戦後の写真 01（itfc.co.uk の「3rdキットのギャラリー」の主写真。前田本人。顔あり）だけが前田だった。
#   ITFC の試合レポートの主写真（Enciso）・イプスウィッチ・スターの og 画像（Greaves 他・ファン・Ouattara と Egeli・オニール監督）は別人。**02＝オニール監督（イプスウィッチ・スター 10/17 の会見記事の主写真）**。
#   03＝日本代表（Keiteay、CC BY 4.0。後ろ向き）、04＝2023年セルティック（pantkiewicz、CC BY-SA 2.0）、05＝2024年セルティックの練習（Hameltion、CC BY-SA 4.0）。**03〜05 は 10/19 と同じ Commons の写真（今季のイプスウィッチの写真は Commons に無い）**。
#   一覧の「Commons に2枚だけ」は実際は10/19 時点で5枚取れていた。今回の新規はクラブ公式の01とオニール監督の02。
