# 取材メモ（10/1 の題材 1）。鈴木彩艶がアストン・ヴィラの9月の月間MVP（クラブ発表 9/29、ファン投票70%）＋代表でW杯後初の先発へ。
# 材料の控えは research/raw/20261001_zion_mvp.md（出典URL・原文・数字の食い違い）。
# **エクアドル戦（10/1 19:10）の前に公開する。試合の結果は書かない。**「先発」は前日会見での予定として書く。
# 事実の裏:
#   ヴィラ公式の発表ページは JavaScript で読み込むため読めなかった。発表文は日刊スポーツの訳で当てた（70%・9/29）。
#   9月の5試合は英語版 Wikipedia のヴィラの季の記事の試合記録と LiveScore（5試合・6失点・ハルの0-0）で一致。杯は後半から（相手の得点は27分）。
#   ベネズエラ戦はゲキサカ 460045 だけ「29日」。LiveScore の Monday・Yahoo!コメントの「月曜日」に合わせて 9月28日。
#   移籍金: 固定3000万€＋最大500万€（Qoly）／約3000万ポンド（Sky・BBC）／2560万ポンド＋430万ポンド（Wikipedia）。「およそ3000万ポンド」「最大3500万ユーロ」と言う。
#   マルティネスは 750万ポンドでチェルシーへ（Sky・Al Jazeera）。2022年W杯の優勝メンバー。4倍は 3000万÷750万。
#   GKの移籍金の順位は Qoly の特集（8/27）。見出しは「8位タイ」で相手は書いていないので「8番目に並ぶ」。
#   森保監督の言葉は原文から「(前日)」「(シーズン)」の補足だけ外した。1本目は頭の「デビュー戦から…序盤ではあるが」を省いて引く（補っていない）。
#   英BBCのベスト11は入れない（9/22 に扱った・媒体名を読まない決まり）。トッテナム戦の2点目の起点のキックは、見立ての根拠として1行だけ（BBC の Yahoo 転載 "the architect of Villa's second goal"）。
#   流れの点検（Claude が読んだ）の指摘で、見立ての節の頭に「話をヴィラに戻します」、クラブ名を略さない（ハル・シティ／ノッティンガム・フォレスト）、「ユーロでは」を通貨と分かる形に、を直した。
# 写真: ゲキサカ 460045 の記事の写真（9/28 ベネズエラ戦、©Kaoru WATANABE/GEKISAKA）。ヴィラのユニフォームの写真はゲキサカ・サッカーキングとも Getty なので使わない。
# 反応: 英語1件（X、9/19。footballinsider247 の記事に埋め込み。9/21・22 の回で使っていない1件）＋Yahoo!ニュースのコメント欄から2件、どれも全文。
