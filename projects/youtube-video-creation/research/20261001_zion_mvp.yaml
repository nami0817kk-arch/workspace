  telop: 森保監督「彩艶をこの練習で何もなければ、先発で起用しようかなと思っている」
  narrator: キャスター
  say:
  - text: 鈴木彩艶が、ファン投票の7割を集めてヴィラの9月の最優秀選手に選ばれました。
    short_only: true
  - text: その鈴木はいま、日本代表に呼ばれています。
  - text: 9月28日のベネズエラ戦は後半から出て、キャッチや味方へのパスでミスが出ました。
  - text: 試合のあと、本人はこう話しています。
  - voice: 鈴木彩艶
    text: 今日のパフォーマンスは攻守ともにひどかった
  - text: それでも森保監督は、エクアドル戦の前日に、こう話しました。
  - voice: 森保監督
    text: 彩艶をこの練習で何もなければ、
  - voice: 森保監督
    text: 先発で起用しようかなと思っている
    cont: true
  - voice: 森保監督
    text: 相手の攻撃を止める部分、攻撃の起点になる部分も
  - voice: 森保監督
    text: チームですでに絶大な信頼を得ていると感じる
    cont: true
  - text: 先発すれば、ワールドカップのあと代表では初めてです。鈴木は、こう話しています。
  - voice: 鈴木彩艶
    text: 前回のゲームは少しパフォーマンスが悪かったけれど、
  - voice: 鈴木彩艶
    text: 明日はまた違ったゲームになると思っている
    cont: true
  - voice: 鈴木彩艶
    text: まずはGKとしてゼロで抑えるところを
  - voice: 鈴木彩艶
    text: 意識して取り組むべきかなと思う
    cont: true
