- id: data
  heading: アストン・ヴィラ 基礎DATA
  main: true
  tier: 背景
  telop: 1874年創立
  narrator: 解説
  say:
  - short_only: true
    text: 鈴木彩艶の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_villa_data0.png
    text: 礼拝堂に集まった青年4人が始めたクラブ。1888年には、世界初のリーグを作る側に回ります。
    no_telop: true
  - image: assets/stats/pl_villa_data1.png
    text: 愛称は「ヴィランズ」。「ライオンズ」とも呼ばれます。
    no_telop: true
  - image: assets/stats/pl_villa_map.png
    text: ホームタウンはバーミンガム。イングランド第2の都市です。
    no_telop: true
  - image: assets/backgrounds/stadium_アストンヴィラ_in.png
    text: 本拠地はヴィラ・パーク。4万3205人が入ります。
  - image: assets/stats/pl_villa_cups.png
    text: 1部リーグの優勝は**7回**。FAカップ7回、リーグカップ5回。
    no_telop: true
  - image: assets/stats/pl_villa_data6.png
    text: 1930年から31年には、1シーズンで**128ゴール**。いまもイングランド1部の最多記録です。
    no_telop: true
  - image: assets/stats/pl_villa_data7.png
    text: ヨーロッパは、チャンピオンズリーグとヨーロッパリーグを1回ずつ。
    no_telop: true
  - image: assets/stats/pl_villa_data7.png
    text: スーパーカップとインタートトカップも、1回ずつ獲っています。
    no_telop: true
  - image: assets/stats/pl_villa_last.png
    text: プレミアリーグでの最高位は、初年度1992年から93年の2位です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
  bg: assets/backgrounds/stadium_アストンヴィラ.png
  official: false
- id: history
  heading: 歩んできた道
  tier: 背景
  telop: リーグそのものを作ったクラブ
  narrator: 解説
  card:
    type: table
    title: 残してきた記録
    columns:
    - ''
    - ''
    rows:
    - - 1888年
      - ヴィラの重役がフットボールリーグを創設
    - - 1982年
      - ヨーロッパカップ優勝（バイエルンに1-0）
    - - 2025-26年
      - ヨーロッパリーグ優勝。30年ぶりのタイトル
  say:
  - そのフットボールリーグを立ち上げたのは、ヴィラの重役だったウィリアム・マクレガーです。
  - 1982年には、ヨーロッパカップを勝ち取りました。イングランドのクラブでは**4番目**です。
  - 決勝はロッテルダムで、バイエルン・ミュンヘンに1対0の勝ち。
  - そして昨季、2025年から26年。ヨーロッパリーグで優勝します。
  - フライブルクを3対0で下しての優勝で、**30年ぶりのタイトル**でした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
  bg: assets/backgrounds/stadium_アストンヴィラ.png
