  - text: そのフットボールリーグを立ち上げたのは、ヴィラの重役だったウィリアム・マクレガーです。
    image: assets/images/pl_villa_story/scene.jpg
  - 1982年には、ヨーロッパカップを勝ち取りました。イングランドのクラブでは**4番目**です。
  - text: 決勝はロッテルダムで、バイエルン・ミュンヘンに1対0の勝ち。
    card:
      type: table
      title: 残してきた記録
      columns: *id001
      rows:
      - - 2025-26年
        - ヨーロッパリーグ優勝。30年ぶりのタイトル
  - そして昨季、2025年から26年。ヨーロッパリーグで優勝します。
  - フライブルクを3対0で下しての優勝。1996年のリーグカップ以来、**30年ぶりのタイトル**です。
  official: false
