  - text: エメリのサッカーは、守りで厳しく、ボールを持ったら主導権を握る。
    image: assets/photos/pl/villa_manager_4b03a7c7.jpg
  - 2018年に買ったエジプトの実業家サウィリスらが、4年で3億6000万ポンドを注いだ、資金で買う型。
  - 熱心なサポーターが集まるホルト・エンドは、1995年の完成時、イギリス最大のゴール裏スタンド。
  sources:
