- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 厳しく守る。資金で買う
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 厳しく守り、主導権を握る
    - - 運営の型
      - 4年で3億6000万ポンド
    - - クラブの気質
      - 最大のゴール裏スタンド
