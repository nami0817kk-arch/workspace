#       後半16分 ジャクソンが勝ち越し。後半23分 ブエンディアのクリアが当たり損ね、グバルディオールへ → 鈴木が飛び出して体でコースを消して止めた。後半44分 ハーランドの頭はマートセンがクリア。
#   ・ESPN 試合記録（site.api.espn.com summary event=401879256）: シティ シュート15・枠内7、ヴィラ 枠内2。鈴木のセーブ6。支配率 シティ63.2%・ヴィラ36.8%。
