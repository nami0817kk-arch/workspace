#   ・BBC ライブ（https://www.bbc.com/sport/football/live/cj62ynzwg4pet）: 鈴木は前半にエンディアイェ・シェルキ・フサノフのシュートを止め、ハーランドの同点直後のグヴァルディオルへのセーブが "proved pivotal"。
#     ヴィラの枠内シュート2本はどちらもジャクソンの右足で、2本とも得点（BBC c6p9gkdzzpnro）。ヴィラは直近7回のシティ戦で5勝。
#     BBC 採点（ck4g14j85y9xo）: 鈴木7「エンディアイェ、シェルキ、グヴァルディオルを止めた3つの重要なセーブ。見事な指先のセーブ」。
