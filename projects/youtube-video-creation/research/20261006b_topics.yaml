title: 10月6日の題材（残り4枠・ニュース以外）
lead: 直近30日に伸びたシリーズの型から、8件を選びました。4つに○をお願いします
note: '<b>4つに○を付けてください。</b>直近30日の自分のチャンネルの数字（Analytics）で、ニュース以外の回を再生の多い順に並べて、伸びた型を拾いました。<br>伸びたのは次の型です。<br>・<b>日本人がいるクラブの紹介</b>：田中碧のリーズ 1,985回、久保のソシエダ 1,644回、鈴木彩艶のヴィラ 1,233回（本編）<br>・<b>同じ年齢・2人の比較</b>：エムバペとハーランドのショート 1,569回、クラシコの比較の本編 1,192回<br>・<b>月間まとめ（欧州組）</b> 1,590回、<b>代表チームの紹介（日本の相手）</b>のショート 1,275回、<b>日本と縁のある監督の経歴</b>（アギーレ）のショート 1,006回<br>反対に、日本人が出てこないクラブ紹介や選手紹介は、本編が数百回にとどまっています。'
items:
- num: 1
  slot: シリーズ
  fmt: 代表チームの紹介
  head: ブラジル代表ってどんなチーム？11月14日、日本の次の相手
  why: エクアドル（ショート1,275回）・ニュージーランドと同じ型。W杯で日本が負けた相手（32強でブラジルに1対2）。アンチェロッティ監督の顔ぶれ
  src: CBF・FIFA・JFA
- num: 2
  slot: シリーズ
  fmt: 代表チームの紹介
  head: パラグアイ代表ってどんなチーム？11月17日、日本の2戦目の相手
  why: 同じ型。対戦成績・W杯2026の戦い
  src: APF・FIFA・JFA
- num: 3
  slot: シリーズ
  fmt: 監督の経歴
  head: ハリルホジッチ、日本代表で残した数字。W杯2か月前の解任まで
  why: アギーレ（ショート1,006回）と同じ「日本と縁のある監督」。3年の勝率と、W杯の出場を決めた予選
  src: JFA・Transfermarkt
- num: 4
  slot: シリーズ
  fmt: 監督の経歴
  head: ザッケローニ、日本代表を率いた4年。アジアカップ優勝とブラジルW杯
  why: 同じ型の2本目の候補
  src: JFA・Transfermarkt
- num: 5
  slot: シリーズ
  fmt: 有名選手の比較
  head: 三笘薫と久保建英を、同じ数字で並べる。日本の両翼はいまどちらが点に絡んでいるか
  why: 比較の型（エムバペとハーランドのショート1,569回）×日本人。どちらが上かは言い切らず、数字の違いを見立てにする
  src: FotMob・Transfermarkt
- num: 6
  slot: シリーズ
  fmt: 有名選手の比較
  head: 上田綺世と中村敬斗、同じリーグ・アン1年目。リールとリヨンでの出番と点
  why: 比較の型×日本人。2人とも代表ウィークで話題になったばかり
  src: FotMob・Transfermarkt
- num: 7
  slot: シリーズ
  fmt: 今季の軌跡
  head: 鎌田大地、クリスタル・パレスでの今季を数字で追う
  why: 久保の今季の軌跡（ショート1,174回）と同じ型。代表の主将を務めた選手
  src: FotMob・Transfermarkt
- num: 8
  slot: シリーズ
  fmt: 記録
  head: 日本代表の歴代得点ランキング。上田綺世が22点で13位、上にいるのは誰か
  why: 昨日の上田の回（中山雅史を抜いた）の続き。歴代の表と、次に抜く相手までの点差
  src: JFA
