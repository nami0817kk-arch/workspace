# **選んだ理由**：2024年夏から2季、同じパリの両翼にいた2人。その2季でクラブの公式戦で絡んだ点は 56 と 62、1つ絡むのにかかった時間は約109分と約111分でほぼ同じ。
#   ところが季ごとに分けると、1季目はバルコラ（約94分）、2季目はドゥエ（約107分）が速く、入れ替わっている。そのあとバルコラは 2026年8月31日にリバプールへ移った。
#   今季は2人ともCLで3点ずつ。比べる軸が立つ。日本との接点：バルコラはいま遠藤航（リバプール。TM の現所属 2023-08-18〜）のチームメート。
#   重なり：scripts/*compare*・posted.json・covered.yaml を grep。2人の比べは出ていない。ドゥエは 10/6 の代表戦ニュースに名前があるだけ（比べる・選手紹介なし）。
#   バルコラは 9/10（デビュー戦）・10/14（イラオラ監督の言葉）のニュースのみ。直近30日（10/8〜）に同じ組み合わせは無い。
#   picks（research/20261107_picks.txt）：選手紹介はシュロッターベック、スタジアムはレアル、ユニフォームはバルセロナ。人名は重ならない。
#   **外した候補**：ギョケレシュ×エキティケ（エキティケは今季の出場が0）・クヴァラツヘリア×ドゥエ（クヴァラツヘリアは 10/20 のバルセロナ戦で右ひざの前十字靭帯を痛めて長期離脱＝psg.fr の医療発表。けがの話を軸にしない）・
#   サラー／レオン（今季はトルコのリーグで扱う7リーグの外）・アルバレス×ラウタロ（ラウタロは 10/11 に比べるで出したばかり）。
# **2人とも今季も扱うリーグの1部**：PSG（リーグ・アン）・リバプール（プレミア）。ESPN の日程で確かめた（research/raw/20261107_psg_espn_schedule.json・20261107_liverpool_espn_schedule.json）。
# **使った数**（TM の performance-season。クラブのトップチームの公式戦＝リーグ・CL・国内カップ・スーパーカップ・クラブW杯・インターコンチネンタル杯。**代表戦・五輪・ユースは混ぜない**）
