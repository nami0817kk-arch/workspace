#   バルコラ（リバプール）：26/27 13試合 803分 3点2A（GB1 7/515/0/2・CL 4/239/3/0・CGB 2/49）。3点は 10/14 CL アウェー LASK 6-3 のハットトリック（ESPN の結果と Wikipedia で確かめた。リバプールでの初得点）。最後は 11/4 CL アウェー フェネルバフチェ 2-3（90分）
