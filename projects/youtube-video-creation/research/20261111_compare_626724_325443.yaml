# 取材メモ（11/11 水、シリーズ「比べる」、key: compare_626724_325443）。ジョアン・ペドロ（チェルシー・25歳）×ヴィクトル・ギェケレシュ（アーセナル・28歳）。
# **情報の時点は 2026-11-06**。**FotMob・DataMB は使っていない**。数字は Transfermarkt（2026-11-06 取得。控え: research/raw/20261111_joaopedro_tm.json・20261111_gyokeres_tm.json）。
#   Transfermarkt 番号：ジョアン・ペドロ 626724・ギェケレシュ 325443。API（tmapi-alpha）の player・market-value-history・performance-season（2019〜2026季）・performance-game（2023〜2026季）を2.5秒あけて取得。
# **選んだ理由**：2025年7月、同じ夏にロンドンのビッグクラブへ来たCF2人。基本の移籍金はどちらも5500万ポンド（報道）。1季目（25/26）の得点は 20 と 21 でほぼ同じ、
#   ところがアシストは 9 と 3。1点取るまでの時間はギェケレシュ（約166分）、1つ絡むまではジョアン・ペドロ（約127分）が速い。市場価値は 2026年3月までに入れ替わった。比べる軸が立つ。
#   日本との接点：ジョアン・ペドロはブライトンで三笘薫のチームメート（TM：三笘 504849 の 23/24・24/25 はブライトン 1237、ジョアン・ペドロも同じ2季ブライトン 1237）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・直近30日の scripts を grep。ジョアン・ペドロは 10/20 のランキング・11/6 のブライトンの財政に名前だけ。
#   ギェケレシュは 11/5 のニュース（アーセナルのスラヴィア戦「1ゴール1アシスト」）がある。**比べる・選手紹介で2人は出していない**。重なりの度合いは報告に書く。
#   picks（research/20261109_picks.txt）：11/11 の選手紹介はマレン、スタジアムはメスタージャ、ユニフォームはアトレティコ。人名は重ならない。
#   **最初に選んだルイス・ディアス×ガクポは替えた**：11/10 の代表チーム紹介がコロンビア（ディアスが看板選手になる）で、前日と人が重なるため。
#   **外した候補**：デ・ブライネ×モドリッチ（モドリッチは 11/8 のクロアチア代表の主役級）・エンソ×マック・アリスター（10/23 のアルゼンチン代表）・ガクポ×ニコ・ウィリアムズ（ニコは今季530分で強い軸が立たない）・
#   セシュコ（今季206分）・エキティケ（今季0分）・サラー／レオン（トルコ）。
# **2人とも今季も扱うリーグの1部**：チェルシー・アーセナル（プレミア）。TM の現所属（チェルシー 631 は 2025-07-02〜、アーセナル 11 は 2025-07-26〜）。
#   **注意**：11/7〜11/8 の週末にプレミアの試合がある（公開の11/11時点では1試合ぶん古い）。台本は「11月6日までの数字」と言い、次の試合の日程は言わない。
# **使った数**（TM の performance-season。クラブのトップチームの公式戦。**代表戦は混ぜない**）
#   ジョアン・ペドロ：23/24 ブライトン 40試合 2747分 20点3A（GB1 31/2047/9/3・EL 6/437/6/0・FAC 2/173/5/0・CGB 1/90）
#                    24/25 ブライトン 30試合 2136分 10点7A（GB1 27/1953/10/6・FAC 3/183/0/1）。2025年夏のクラブW杯（チェルシー 3/163/3/0）は TM では 24/25
#                    25/26 チェルシー 50試合 3694分 20点9A＝29（GB1 35/2674/15/8・CL 8/532/3/0・FAC 4/272/2/0・CGB 3/216/0/1）
#                    26/27 7試合 539分 5点3A＝8（GB1 6/522/5/3・CGB 1/17）
#   ギェケレシュ：23/24 スポルティング 50試合 4169分 43点15A（PO1 33/2915/29/9・EL 9/622/5/2・POPO 6/477/6/4・POCP 2/155/3/0）
#                24/25 スポルティング 52試合 4248分 54点13A（PO1 33/2804/39/8・CL 8/606/6/0・POPO 7/493/5/3・POCP 3/225/4/0・POSU 1/120/0/2）
#                25/26 アーセナル 55試合 3481分 21点3A＝24（GB1 36/2231/14/1・CL 13/915/5/1・CGB 4/260/1/1・FAC 2/75/1/0）。Wikipedia「early May 2026 … 20th goal of the season」と矛盾しない
#                26/27 13試合 587分 2点3A＝5（GB1 6/154/0/1・CL 4/238/1/2・CGB 2/180/1/0・GBCS 1/15）
#   計算：25/26 1点取るまで ジョアン・ペドロ 3694÷20＝184.7／ギェケレシュ 3481÷21＝165.8。1つ絡むまで 3694÷29＝127.4／3481÷24＝145.0
#         26/27 1つ絡むまで 539÷8＝67.4／587÷5＝117.4（どちらも 450分超・900分未満）
# 市場価値（TM の推移）：ジョアン・ペドロ 2024-12 5000万€→2025-05 5000万→2025-10 6500万→2025-12 6500万→2026-03 7500万→2026-06 8000万→2026-10-07 1億（最高）
#   ギェケレシュ 2024-12 7500万€（最高）→2025-05 7500万→2025-12 7000万→2026-03 6500万→2026-06 6500万→2026-10-07 5500万。2025-12 はギェケレシュが上、2026-03 で入れ替わり
# 経歴（Wikipedia・TM）：ジョアン・ペドロ 2001-09-26 ブラジル・リベイランプレト生、フルミネンセの下部組織→ワトフォード（2020）→ブライトン（2023、報道 3000万ポンド）→チェルシー 2025-07-02（報道 5500万ポンド＋追加500万）。
#   2025年のクラブW杯の決勝（3-0 PSG）で3点目。2025-26 チェルシーの年間最優秀選手。2026年8月のプレミア月間最優秀選手。2026-08-24 フラム戦で開始31秒の得点（開幕節の最速）。
#   ギェケレシュ 1998-06-04 ストックホルム生、ブロンマポイカルナ→ブライトン（2018-01 加入、貸し出しを経て 2021-07 にコヴェントリーへ完全移籍）→スポルティング（2023、2000万€）→アーセナル 2025-07-26（報道 5500万ポンド、最大6350万ポンド）。
#   アーセナルは 2025-26 にプレミア優勝、ギェケレシュはクラブの得点王（Wikipedia の冒頭）。
# 写真：j1〜j4 チェルシー公式（選手ページ・ニュースの写真。名前が GettyImages の写真は使っていない）・g1 アーセナル公式（選手ページ。透過の切り抜きを暗い地に合成）・
