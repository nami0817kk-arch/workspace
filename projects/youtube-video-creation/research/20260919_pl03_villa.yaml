        - ["1982年", "チャンピオンズカップ優勝（決勝でバイエルンに1対0）"]
        - ["2018年", "いまのオーナーが経営に"]
        - ["2026年", "ヨーロッパリーグ優勝。30年ぶりのタイトル"]
    say:
      - "1888年、ヴィラの重役だったウィリアム・マクレガーが、**世界で初めてのフットボールリーグ**を立ち上げました。"
      - "1982年にはチャンピオンズカップで優勝。決勝の相手はバイエルンで、**1対0**でした。"
      - 2018年には、エジプトの実業家ナセフ・サウィリスとアメリカのウェス・エデンスがクラブの経営を握ります。
      - "そして昨季、ヨーロッパリーグで優勝。**30年ぶりのタイトル**でした。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.

  # **1990年以降の選手だけ**（2026-09-18 ユーザー指示「過去の選手は1990年以降」）
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    bg: assets/backgrounds/stadium_アストンヴィラ.png
    telop: 生え抜き、1億ポンドの男、そして得点王
    narrator: キャスター
    card:
