# プレミアリーグ20クラブ紹介 ③アストン・ヴィラ（2026-09-19 作り直し。見本）
#
# **サッカーキングの紹介動画を手本に組み直した**（2026-09-19 ユーザー指示
# 「取り入れたいのは、全部」「スタメン図は不要、登録選手一覧だけでよい」）。
# 手本: https://www.youtube.com/watch?v=pCRlRj9HE5s
#   「【名門復活へ】鈴木彩艶が所属するアストン・ヴィラってどんなクラブ？」（41分・4.4万回）
#
# 取り入れたもの
#   ・題を日本人選手から入る形に（「鈴木彩艶がいる〜ってどんなクラブ？」）
#   ・**基礎DATAの板を1枚**（tools/clubdata.py。中身は research/pl_data/villa.json）
#   ・歴代の名選手を1990年以降に（アグボンラホー・グリーリッシュ・ワトキンス）
#   ・オーナー（歩んできた道の節）
#   ・**登録選手一覧**（tools/squadboard.py --full。29人を位置別に4枚）
# 取り入れなかったもの
#   ・予想スタメンの図（ユーザー指示で不要）
#   ・今夏の出入りの節（2026-09-19 ユーザー指示「今夏、出ていった主力と今夏、加わった選手は不要」）
#   ・**有名なファンの節**（2026-09-20 ユーザー指示「有名なファンは廃止」）。
#     手本には入っていたが、20本すべてで作らない。板の9枚目も愛称に替えた
#   ・バーミンガム・シティとの支持層の違い（労働者層／中流層）。手本は英語の資料で
#     調べたと言っていたが、**こちらでは裏が取れなかった**ので入れない
#
# **数字の出どころ**（すべて英語版 Wikipedia。2026-09-19 に原文を取得して確認）
#   ・創立・収容・オーナー・タイトル・128得点・1992-93の2位: Aston_Villa_F.C.
#   ・登録選手29人・背番号・国籍: 同ページ「First-team squad」
#   ・年齢: 各選手のページの生年月日から 2026-09-19 時点で計算
#   ・今夏の出入り・今季の結果: 2026–27_Aston_Villa_F.C._season
#   ・グリーリッシュ: Jack_Grealish（6歳で入団、2019年主将、2021年に1億ポンド）
#
# **鈴木の移籍金は2,560万ポンド**（上積み最大430万ポンドは別）。
# 手本では触れていない。読み上げでは「約2,560万ポンド」と丸めずに出す
