        - ["ジャック・グリーリッシュ", "2013-2021", "6歳で入団。1億ポンドでシティへ"]
        - ["オリー・ワトキンス", "2020-2026", "アグボンラホーを抜きプレミア最多に"]
    say:
      - 地元出身のガブリエル・アグボンラホーは、プレミアリーグで74得点。長くクラブの最多記録でした。
      - "ジャック・グリーリッシュは**6歳**でヴィラに入り、主将まで務めました。"
      - "2021年、**1億ポンド**でマンチェスター・シティへ。当時のイギリス人選手の最高額です。"
      - アグボンラホーの記録を抜いたのが、オリー・ワトキンス。2025年5月のことでした。
      - そのワトキンスも、今夏クラブを離れています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Gabriel_Agbonlahor
      - https://en.wikipedia.org/wiki/Jack_Grealish
      - https://en.wikipedia.org/wiki/Ollie_Watkins

