  # **基礎DATAの板**（手本の「アストン・ヴィラ基礎DATA」と同じ役目）。
  # 板は1枚で、読み上げが板の上を順に指していく
  - id: data
    heading: アストン・ヴィラ 基礎DATA
    main: true
    tier: 背景
    bg: assets/backgrounds/stadium_アストンヴィラ.png
    telop: 1874年創立、バーミンガムのクラブ
    narrator: 解説
    say:
      - {short_only: true, text: 鈴木彩艶が加わったクラブの、基本のデータです。}
      - {image: assets/stats/pl_villa_data.png, text: "創立は**1874年**。礼拝堂に集まっていた青年4人が立ち上げました。"}
      - {image: assets/stats/pl_villa_data.png, text: 本拠地はイングランド第2の都市バーミンガム。ヴィラ・パークは4万3205人が入ります。}
      - {image: assets/stats/pl_villa_data.png, text: "1部リーグの優勝は**7回**。FAカップ7回、リーグカップ5回。"}
      - {image: assets/stats/pl_villa_data.png, text: "ヨーロッパでは1982年にチャンピオンズカップ、そして昨季は**ヨーロッパリーグ**を獲りました。"}
      - {image: assets/stats/pl_villa_data.png, text: "1930年から31年には、1シーズンで**128ゴール**。いまもイングランド1部の最多記録です。"}
      - {image: assets/stats/pl_villa_data.png, text: プレミアリーグでの最高位は、初年度1992年から93年の2位です。}
      - {image: assets/stats/pl_villa_data.png, text: 愛称は「ヴィランズ」。「ライオンズ」とも呼ばれます。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.

