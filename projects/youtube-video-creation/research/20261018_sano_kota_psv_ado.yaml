# 佐野航大 の取材メモ（2026年10月18日・ショートだけ）
# 取材: 2026-10-18。requests（ブラウザUA）で原文を全部読んだ。
#   ・サッカーキング 10/18「佐野航大が9戦連続フル出場も、PSVは退場者響き敗戦…下位に沈むADOが後半AT弾で王者から今季初勝利」
#     https://www.soccer-king.jp/news/world/ned/20261018/2217675.html （試合記事。スコア・得点者・時間・退場・次節まで本文にある）
#   控え: scratchpad の 2217675.html.html。
# 使うのは本文にあること: 17日エールディヴィジ第9節、ADO（敵地）。PSVは8試合で勝点19の2位、首位フェイエノールトと勝点差1。ADOは開幕未勝利で17位。
#   21分 マイナンス先制（ティルのマイナスのクロス）／43分 マイナンスが2枚目のイエローで退場／後半頭 マン→フラミンゴ、守備は5-4／
#   55分 キロ同点（エドゥアルドのポストプレー）／90+3分 シンが逆転（ロティエの折り返し）／ADOは今季初勝利。次節 PSVは20日CLポルト戦、25日フェイエノールト戦。
# 「9戦連続フル出場」は見出し。本文は写真の説明に「フル出場を果たした」とあるだけ。何戦連続かは見出しの数字として言う（大会は言わない）。
# 10/14（CL ライプツィヒ戦）・10/17（評価額）に出した選手。今回の新しい点は「連続フル出場」と「退場者が出た敗戦」だけに絞る。評価額の話・CLの話は入れない。
# 自分で数えたこと: 43分の退場から90+3分の逆転まで、約50分。PSVが敗れて勝点は19のまま（勝ち点0なので）。
# 本人の言葉: 無し（記事に無い）。反応: 探していない・作らない（0件）。
# 写真: 配信写真（Getty）は取り込まない。Commons の Kodai Sano.JPG（Hans Reefman、CC BY-SA 4.0）1枚だけ（10/14 と同じ写真）。
#   02_g_v.jpg は G（切り抜き＋PSVの色の背景）。03〜06_v は同じ写真の別の切り出し（B）。01_w.jpg は題の写真用の16:9。
