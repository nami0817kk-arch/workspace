sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 報道
    telop: 佐野航大は9戦連続フル出場。PSVは1対2でADOに敗れた
    say:
      - 17日のエールディヴィジ第9節。ピーエスブイは敵地で、エーディーオーと戦いました。
      - 佐野航大は先発で、見出しでは9戦連続のフル出場と伝えられています。
      - ピーエスブイは21分、ティルのクロスにマイナンスが合わせて先制しました。
      - ところが43分、そのマイナンスが2枚目のイエローカードで退場になります。
      - 後半の頭に、マンに代えてフラミンゴを入れました。
      - 守備は、5人のラインの前に4人を並べる形です。
      - 55分にエーディーオーが同点に追いつきます。
      - 後半アディショナルタイム3分には、シンが押し込んで逆転しました。
      - エーディーオーは、開幕から勝てずにいた今季、これが初勝利です。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/ned/20261018/2217675.html

  - id: view
    viewpoint: true
    heading: 10人で戦った時間は、何分だったか
    tier: 報道
    telop: 退場から逆転されるまで、約50分
    say:
      - 43分の退場から、逆転されるまで。ピーエスブイは約50分を10人で戦いました。
      - フル出場の佐野航大も、その約50分をピッチで戦いました。
      - 試合前、ピーエスブイは勝点19の2位。首位フェイエノールトとは勝点1差でした。
      - 敗れたので、勝点は19のままです。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/ned/20261018/2217675.html

  - id: next
