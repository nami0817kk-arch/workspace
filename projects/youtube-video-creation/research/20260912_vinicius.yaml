  - id: after
    heading: 試合後、モウリーニョが話したこと
    tier: 報道
    telop: 9月8日 試合後の会見
    narrator: 解説
    # **カードを置く**（2026-09-12）。置かずに書き出したら、
    # 53秒のあいだ画面が変わらなかった
    card:
      type: quote
      title: モウリーニョ（9月8日）
      text: 彼が最高の状態でないことは、誰の目にも分かります
    say:
      - その日の試合後、モウリーニョが会見で答えています。
      - {voice: モウリーニョ, text: ファンを批判しているのではありません}
      - {voice: モウリーニョ, text: 私は監督として、彼との関係について話しています。彼は全面的な敬意に値する}
      - {voice: モウリーニョ, text: 彼が最高の状態でないことは、誰の目にも分かります}
      - {voice: モウリーニョ, text: しかし、それを誰より分かっているのは本人です}
      - {voice: モウリーニョ, text: 試合を決めるヴィニシウスに戻るために、彼は懸命に取り組んでいます}
      - {voice: モウリーニョ, text: 最高の状態でないにもかかわらず、練習でも試合でも、これまでで最も努力しています}
    official: false
    sources:
      - https://worldsoccertalk.com/news/real-madrid-boss-jose-mourinho-asks-for-respect-for-vinicius-jr-amid-form-struggles-in-ucl-debut/
      - https://www.espn.com/soccer/story/_/id/49902879/real-madrid-jose-mourinho-vinicius-best-yet-come

