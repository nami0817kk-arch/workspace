# ヴィニシウスがベルナベウでブーイングを浴び、モウリーニョが返した（2026年9月12日）
#
# **会見は2つある。混ぜない。**
#   9月8日 インテル戦の試合後 … 「彼は最高の状態ではない」「6回の50メートル」
#   9月11日 ラージョ戦の前日 … 「実のなる木にしか石は投げない」
# 日付を言い分けて、**別の日の言葉だと分かるように置く。**
#
# 引きは**「なぜモウリーニョはことわざを持ち出したのか」**。
# ブーイングそのものより、**守り方のほうが中身がある。**ここが山場（@main）。
#
# **ファンを責める話にしない。**モウリーニョ自身が
# 「ファンを批判しているのではない」と言っている。この一文は必ず入れる。
#
# format は quote。発言が主役なので、語りは最小にする
