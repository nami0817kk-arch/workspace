    narrator: 解説
    # **節を分けた**（2026-09-12）。1つの節に10行入れたら、
    # 同じカードのまま53秒画面が変わらなかった
    card:
      type: quote
      title: モウリーニョ（9月8日）
      text: ボールを持って50メートルのスプリントを6回しているのですから
    say:
      - 守れていない場面についても、理由を挙げました。
      - {voice: モウリーニョ, text: 味方と足並みをそろえて守れなかった数少ない場面は、疲労が原因です}
      - {voice: モウリーニョ, text: 彼はボールを持って50メートルのスプリントを6回しているのですから}
      - {voice: モウリーニョ, text: 簡単なことではありません。彼の献身は非常に良かった}
    official: false
    sources:
