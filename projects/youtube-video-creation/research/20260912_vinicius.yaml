  - id: proverb
    heading: 3日後、ことわざで答えた
    main: true
    tier: 報道
    telop: 9月11日 ラージョ戦の前日
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # ことわざ→説明→去年の例、の順で積み上がっていて、最後の一行がいちばん強い
    card:
      type: quote
      title: モウリーニョ
      text: 実のなる木にしか、石は投げない
    say:
      - 3日後、ラージョ・バジェカーノ戦の前日会見です。
      - モウリーニョは、ポルトガルのことわざを持ち出しました。
      - {voice: モウリーニョ, text: ポルトガルのことわざに、実のなる木にしか石は投げない、というものがあります}
      - {voice: モウリーニョ, text: 彼は実をたくさんつけた木です}
      - {voice: モウリーニョ, text: 人々が石を投げるのは、実がほしいからです}
      - {voice: モウリーニョ, text: そして最高のヴィニシウスは、まだこれからです}
      - そのうえで、具体的な日を挙げました。
      - {voice: モウリーニョ, text: 去年、ベンフィカ戦でベルナベウが張りつめていたとき、彼が試合を決めました}
      - {voice: モウリーニョ, text: あのヴィニシウスは、まだこれからです}
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/49902879/real-madrid-jose-mourinho-vinicius-best-yet-come
      - https://worldsoccertalk.com/news/real-madrid-boss-jose-mourinho-asks-for-respect-for-vinicius-jr-amid-form-struggles-in-ucl-debut/

  - id: support
    heading: 支持する条件も、はっきり言っている
    tier: 報道
    telop: 支持には条件がある
    narrator: キャスター
    say:
      - ただし、無条件ではありません。支持する理由を、条件の形で言っています。
      - {voice: モウリーニョ, text: 全てを出す選手を、私は尊重します}
      - {voice: モウリーニョ, text: 彼はプレーしたがり、助けたがり、チームの一員としてプレーし、クラブの紋章に敬意を示しました}
      - {voice: モウリーニョ, text: そういう選手は、いつでも私の支持を得られます}
      - 今季のヴィニシウスは、5試合で1ゴールです。
    official: false
