# 本人の発言（英語の原文のまま訳した。言い換えない）:
#   (1)「It was very difficult for me because I had an amazing relationship with everyone at Newcastle.」→ 僕にとって、とても難しいことでした。ニューカッスルの全員と、すばらしい関係だったからです。
