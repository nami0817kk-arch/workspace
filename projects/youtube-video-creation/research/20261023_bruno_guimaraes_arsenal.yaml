#   (3)「I lost many, many nights of sleep because it was difficult for me, for my family.」→ たくさん、たくさんの夜、眠れませんでした。僕にとっても、家族にとっても、難しかったからです。
#   (4)「We won a trophy after 70 years. We got into the Champions League twice. We got to two finals.」→ 70年ぶりのタイトルを獲りました。チャンピオンズリーグには2回出ました。決勝には2回行きました。
#   (5)「I never felt so loved like the way I was at Newcastle. I hope I can have the same love here at Arsenal」→ ニューカッスルほど愛されたと感じたことは、ありません。ここアーセナルでも、同じ愛をもらえたらと思います。
#   (6)「when I said bye to the lads, I was crying. They were crying as well, because we were a family there.」→ 仲間にさよならを言ったとき、僕は泣いていました。彼らも泣いていました。僕らは家族だったからです。
#   (7)「He [Arteta] is always a little bit addicted to videos… I think we have a top manager with a top mentality.」→ 台本には入れない（移籍の話に答えないため）。
