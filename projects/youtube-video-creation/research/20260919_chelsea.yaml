      - {voice: ネット民, text: チェルシー側の問題点は挙げればキリがないけど、とにかくブレントフォードが素晴らしかった。このままいけばCLいけるぞ}
      - {voice: ネット民, text: カイセドがいないとチェルシーの守備力が半減するね。ジョアンペドロがいないと得点力も落ちる}
      - {voice: ネット民, text: カイセド不在を言い訳にしては駄目だわ。守備がヤバすぎる。かと言って攻撃も完封された}
      - {voice: ネット民, text: シャビ・アロンソを神格化している人がたくさんいたけど、レバークーゼンの時から守備戦術は酷い}
      - {voice: ネット民, text: レバークーゼンの時はコンパクトにポゼッションを取れていたが、プレミアのプレス強度でそれを再現できていない}
      - {voice: ネット民, text: 前プレの連動が全くなんだよな。前3枚はプレス掛けるけど後ろが付いてこない分スペースを与えてやられてる}
      - {voice: ネット民, text: ここまで5試合で10得点12失点、得失点差マイナス2。期待していた声も多かったが、現状では期待外れです}
      - {voice: ネット民, text: アロンソは良い監督だと思うし、ここが正念場かな。ファンは長い目で信じるのも良いのではないかな}
      - {voice: ネット民, text: ブンデスで素晴らしい成績を収めてるので、あとはフロントが我慢できるかどうかでは？アルテタも危ない時期はあった}
      - {voice: ネット民, text: ブレントフォードはしっかりチームとして機能してて強いよね。個の力より、チームとして機能するほうが強いんだろうな, short_voice: true}
