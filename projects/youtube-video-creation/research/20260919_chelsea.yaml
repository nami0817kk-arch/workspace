# チェルシーが0-3でブレントフォードに完敗、プレミア3戦未勝利（2026-09-19）
#
# **news の型。**試合結果＋守備崩壊の中身＋監督とキャプテンの言葉＋反応。
#
# 引きは「開幕5試合、いちばん失点を重ねているのは新監督のチーム」という数字から。
#
# **事実は soccer-king・チェルシー公式・ESPN の一致で確認。**得点者・時間はどの
# 出典でも同じ（61分アンソニー／83分チアゴ／90+4分カルヴァーリョ）。
#
# **20試合連続クリーンシートなし・過去65年最長」は9月12日（前々節ハル戦後）
# 時点の数字。**ブレントフォード戦の結果はまだ反映されていないので、
# 「前節までの数字」と語りで断ってから使う。数字を勝手に21に伸ばさない。
#
# **反応は Yahoo!ニュースのコメント欄（52件中）から。**発生から数時間で、
# 5ch まとめ・海外の反応ブログのどちらにもこの試合そのものを扱った投稿は
# まだ無かった（footballnet・サカラボ・nofootynolife いずれも確認したが無し）。
# **海外の匿名反応は取れなかった。**代わりに、ブレントフォードの観客席が
# 「その場で起きたこと」として本編中に触れる。これは反応の節の代わりではない。
