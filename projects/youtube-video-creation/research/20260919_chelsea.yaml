  - id: numbers
    heading: 数字で見ると
    tier: 報道
    bg: assets/backgrounds/chelsea_20260919.png
    telop: 開幕5試合、5試合とも複数失点
    narrator: 解説
    card:
      type: table
      title: チェルシーの守備（開幕5試合）
      columns: [数字, 中身]
      rows:
        - ["5試合", 開幕から全試合で2失点以上]
        - ["12失点", リーグ最多]
        - ["20試合", 前々節時点でクリーンシートなしが継続。過去65年で最長]
    say:
      - 数字で見ると、この崩れ方がはっきりします。
      - アロンソ監督はプレミアリーグの歴代監督で、就任最初の5試合すべてで2失点以上を喫した、史上6人目の指揮官になりました。
      - 今季の失点は12。リーグで最も多い数字です。
      - 前々節のハル・シティ戦を終えた時点で、チェルシーは1月18日のブレントフォード戦以来、20試合連続でクリーンシートがありませんでした。これは過去65年で最長の記録だと、元ウェールズ代表DFアシュリー・ウィリアムズ氏はBBCでこう指摘しています。
      - {voice: アシュリー・ウィリアムズ, text: 個人としても、守備のユニットとしても、求められるレベルから遥かに遠い}
    official: false
    sources:
