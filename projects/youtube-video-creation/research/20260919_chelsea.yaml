    say:
      - プレミアリーグ第5節、チェルシーは敵地でブレントフォードと対戦しました。
      - 前半はスコアレス。均衡が破れたのは、後半61分です。
      - ブレントフォードが左コーナーキックからヤニク・シュスターが折り返し、ジェイドン・アンソニーがヘディングで先制。
      - 83分にはカウンターからイゴール・チアゴが追加点。90+4分にはファビオ・カルヴァーリョが3点目を決めました。
      - スコアは3-0。チェルシーはプレミアリーグで3戦未勝利となりました。
      - アウェーの客席は、試合を通して「ジョーダン、スコアは？」と歌い続けました。
