    say:
      - {short_only: true, text: チェルシーがブレントフォードに0対3で敗れ、リーグ3戦未勝利になりました。}
      - 試合後、シャビ・アロンソ監督はこう振り返りました。
      - {voice: シャビ・アロンソ, text: 後半の戦いぶりにも、結果にも失望している。これではプレミアリーグで戦えない}
      - {voice: シャビ・アロンソ, text: セットプレーだけでなく、デュエルも、ビルドアップも。形を失えば、コントロールを失う}
      - キャプテンのリヴァイ・コルウィルは、セットプレーの守備についてこう話しています。
      - {voice: リヴァイ・コルウィル, text: セットプレーでは、いじめられているようなものだった。そこは改善しないといけない}
      - {voice: リヴァイ・コルウィル, text: 前線の3人に頼り切ることはできない。全員で助け合う必要がある}
