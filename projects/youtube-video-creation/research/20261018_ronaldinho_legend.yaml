# ロナウジーニョ（元バルセロナ／ブラジル代表）の紹介。新シリーズ「レジェンドの紹介」（引退した過去の選手の掘り下げ）の試験3本目（2026-10-17 ユーザー決定）。
# 型は選手紹介の8節を引退した選手向けに変えた：①フック ②基礎DATA ③歩んできた道と転機（通算の表）④プレースタイル ⑤「あの試合」（2005-11-19 クラシコ）
# ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。**FotMob は使わない**（パーセンタイル・レーダー・シュートマップなし）。数字は基本の数と自分で割った値。
# 公開予定は 10/18 以降。**台本は draft まで**（approve・build・screen・upload はしない）。
#
# **数字・出典の出どころ（本文を実際に読んだもの。取材は requests と WebFetch のみ。ブラウザの道具は不使用）**
# - 英語版 Wikipedia（Ronaldinho 本文＋Career statistics の表、2026-10-17 取得）：クラブ別・代表の試合と得点（グレミオ125/58・PSG77/25・バルセロナ207/94・ミラン95/26・
#   フラメンゴ72/28・アトレチコ・ミネイロ85/27・ケレタロ29/8・フルミネンセ9/0、クラブ合計699/266。ブラジル代表97試合33得点）、優勝歴・個人賞、移籍金（PSG500万・バルセロナ3000万ユーロ）、
#   エラスチコ・プレースタイルの記述、2005/06 の大会別の得点（ラ・リーガ17・CL7・スペイン杯1・スーパーカップ1＝26）。**確度は 背景**（二次の整理）。
# - FC バルセロナ公式（fcbarcelona.com / .es）：
#   ・2020-11-19「15 años de un Clásico histórico」＝2005-11-19 の 0-3、エトー14分・ロナウジーニョ59分と77分、メッシ18歳で初のクラシコ（エトーの得点はメッシのパス）、
#     両チームの先発（レアルはカシージャス・サルガド・セルヒオ・ラモス・ロベルト・カルロス・ジダン・ベッカム・ロビーニョ・ラウール・ロナウド）、ロナウジーニョ「左から、サルガドとセルヒオ・ラモスを抜く2点がほぼ同じ形」、
#     ベルナベウが総立ち。2012-11 の「On this day」も 0-3・2得点・総立ち。
#   ・2020-05-01／2025-05-01 の記事＝メッシの初ゴール（2005-05-01 アルバセテ戦、ロナウジーニョのパス、17歳10か月、ラ・リーガ最年少得点者）。87分交代（2020）／88分交代（2025）、91分のゴール。
#   ・2013-07-19 のベストゴール特集＝2003年のセビージャ戦（午前0時5分、約25メートル、観測所の地震計が小さな揺れ）。2020-09-03 のドキュメンタリー紹介＝9月3日の水曜の深夜。
#   ・2017-02-02／02-03 の公式アンバサダー就任の記事＝契約は「今後数年」、ロナウジーニョ本人のコメント（「帰ってきた」「アシストが本当に好き」「メッシの最初の一歩に関われた」「ベルナベウで拍手された」）。
#   ・2013-07-19「Ronaldinho has left his mark」＝4年のタイトル無しのあとに来た／プジョル・メッシ・ロセイの言葉。**確度は 確定（クラブ公式の発言・記録）**。
# - RSSSF（France Football #3112 の掲載、2005-11-29）：バロンドール2005の得点（ロナウジーニョ225点・ランパード148・ジェラード142、1位票33・投票者52人）。
# - UEFA.com（2005年 FIFA 世界最優秀選手の記事、WebFetch で本文を読んだ）：ロナウジーニョ956点・ランパード306・エトー190、受賞の言葉。
# - Transfermarkt（1ページだけ。/ronaldinho/profil/spieler/3373）：生年月日・身長1.82m・ブラジル代表97/33・現所属ラヴェンナ（2026-07-01 加入）。
# - 2018-01-16〜17 の引退の報（theScore・Football España）：兄で代理人ロベルトが O Globo の「Gente Boa」欄で明かした。「He has stopped, it is ended.」
# - ラヴェンナ関連（2026-06-23 Quotidiano Sportivo＝クラブ発表とロナウジーニョのコメント／2026-08-20 EFE＝入団会見・公式戦に1試合は出る予定／2026-10-08 Khel Now＝デビューは
#   11/15 のフォルリ戦の見込み〈Il Resto del Carlino の報道〉）。**確度は 報道**。
# - バルセロナの第4ユニフォーム（2025-11 SoccerBible）：2005年のクラシコの3ゴールがモチーフ。報道。
# - 本人の言葉：FourFourTwo の2015年の取材（Soccer Laduma 転載 2015-12-14）。
# - 取材はどれも「検索結果の要約は使わず、出典の本文を読んで確かめた」。FIFA・CBF（ブラジルサッカー連盟）の一次ページは検索で見つからず（読めなかった）。ブラジル代表の97/33 は
#   Wikipedia と Transfermarkt が一致。Eurosport は 403、ESPN Deportes は空で読めなかった。
#
# **数字の食い違い・判断**
# - ロナウジーニョの1点目の分：クラブ公式（2020）は59分、別の報道・ユニフォームの記事は58分。**クラブ公式を採った**（59分と77分）。エトーの先制もクラブ公式の14分
#   （Soccer Laduma は15分）。
# - セビージャ戦のシュートの距離：クラブ公式は25メートル、Wikipedia は30ヤード（約27メートル）。**クラブ公式の25メートル**。日付はクラブ公式の別の記事が「9月1日」と書くが、
#   公式のドキュメンタリー紹介と Wikipedia は9月3日（水曜の深夜）。**9月3日**を採った。
# - メッシの交代：クラブ公式の2つの記事が87分と88分。台本は「終盤」とだけ言う。
# - 公式アンバサダーの契約：Wikipedia は10年、クラブ公式は「今後数年」。**クラブ公式に従う**。
# - 移籍金：PSG500万・バルセロナ3000万ユーロは Wikipedia の記述（確かめたのは1社）。台本は「報じられた」で断る。
# - 「六つ全部を持つのは彼だけ」（Wikipedia の冒頭）：自分で優勝・受賞を数え直した（W杯2002・コパ・アメリカ1999・コンフェデ杯2005・CL2005/06・リベルタドーレス2013・バロンドール2005）。
#   「唯一」とは言わず、「六つ」と言う。
# - 「最後の公式戦」：Khel Now は2015年9月24日（フルミネンセ対サントス）。Wikipedia は2015年9月28日にフルミネンセと契約解除。台本は「2015年9月」。
# - ラヴェンナへの「復帰」：クラブの声明は「登録する」。ラヴェンナの0試合0得点（Wikipedia）。**デビュー日は未発表**。11月15日は報道（Il Resto del Carlino 経由の Khel Now）。
#
# **自分で数えた比べ（⑧）**
# - バルセロナ5季：207試合94得点＝1試合0.454点。それ以外の7クラブ：492試合（125+77+95+72+85+29+9）172得点（58+25+26+28+27+8+0）＝0.350点。比＝1.30。
#   バルセロナはクラブ通算699試合の29.6%、通算266得点の35.3%。
# - 2005年の2つの賞：バロンドール225対148（1.52倍）、FIFA 956対306（3.12倍）。どちらも2位はランパード。
# - 六つの勝利（優勝・受賞）のうち、バルセロナ在籍中は3つ（コンフェデ杯2005・CL2005/06・バロンドール2005）。
# - 最後の公式戦（2015年9月）から11月15日までは11年2か月。引退の発表（2018年1月）は37歳、バロンドールは25歳。
#
# **入れなかったもの**：引退後の私生活・法的な問題・政治の話（brief の決まり）。夜遊びなど私生活の批判。ブラジル代表の2006年W杯の不振（シリーズの型に合わない）。
#   2015年のメキシコ（アステカ）での2度目の総立ち（⑤と重なるので落とした）。グレミオ・PSG・2002年W杯の写真（Commons に使える写真が無かった。**材料が足りず言えなかったこと**）。
#
# **日本語名・読みで怪しいもの**：ロナウジーニョ・ガウーショ／ロナウド・デ・アシス・モレイラ／ポルトアレグレ／オ・ブルッショ／ライカールト／ルシェンブルゴ／エラスチコ（リベリーノ）／ラヴェンナ／フォルリ／
#   ケレタロ／アトレチコ・ミネイロ／コパ・リベルタドーレス／セルヒオ・ラモス／サルガド／ラポルタ。
#
# 本人の言葉は5か所（自訳。原文は上の出典）：①フック「アシストが本当に好き」（クラブ公式2017）②「あの試合」FourFourTwo 2015 ③メッシの最初の一歩（クラブ公式2017）④ラヴェンナ（クラブ発表）
# ⑤兄ロベルトの引退の言葉・UEFA 受賞の言葉。
