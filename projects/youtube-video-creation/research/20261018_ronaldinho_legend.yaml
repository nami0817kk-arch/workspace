- id: view
  heading: バルセロナの5季と、ほかの7クラブを、1試合あたりで数えると
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 2005年、2つの賞と、1試合あたりの得点
  card:
    type: table
    title: バルセロナと、ほかの7クラブ（クラブの全公式戦）
    columns: [項目, バルセロナ, ほかの7クラブ]
    rows: &cmp_rows
    - ['試合', '207', '492']
    - ['得点', '94', '172']
    - ['1試合あたり', '0.45', '0.35']
    source: Wikipedia・自分で割った値
  say:
  - text: 最後に、ロナウジーニョの数字を、自分で並べてみます。
    image: assets/images/20261018_ronaldinho_legend/06.jpg
    card: &cmp_card
      type: table
      title: バルセロナと、ほかの7クラブ（クラブの全公式戦）
      columns: [項目, バルセロナ, ほかの7クラブ]
      rows: *cmp_rows
      source: Wikipedia・自分で割った値
      highlight_row: 0
  - text: バルセロナは、207試合で94得点。ほかの7クラブは、492試合で172得点。
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: 1試合あたりは、0.45点と0.35点。バルセロナの5季は、3割ほど高い。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 2
    mark: {kind: circle, row: 2}
  - text: 賞でも、差は開きました。2005年のバロンドールは、2位の1.5倍。
    image: assets/images/20261018_ronaldinho_legend/03_w.jpg
    card: none
  - text: 国際サッカー連盟の年間最優秀選手は、956点対306点。3倍を超えました。
    card: none
  - text: どちらも、2位はランパード。受賞式の言葉です。
    card: none
  - voice: ロナウジーニョ
    text: チームメートと、代表のみんながいなければ、
  - voice: ロナウジーニョ
    text: 僕はここにいません。
    cont: true
    pause: 0.6
  - text: 全盛期の5年が、キャリアの山。その頂点が、あの夜のベルナベウです。
    card: none
  quotes_from:
  - https://www.uefa.com/uefachampionsleague/news/01b0-0e108f2a3e26-02aeb84ff529-1000--ronaldinho-is-world-s-best-again
  sources:
  - https://en.wikipedia.org/wiki/Ronaldinho
  - https://www.rsssf.org/miscellaneous/europa-poy05.html
  - https://www.uefa.com/uefachampionsleague/news/01b0-0e108f2a3e26-02aeb84ff529-1000--ronaldinho-is-world-s-best-again
