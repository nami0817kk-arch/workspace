- id: after
  heading: 引退した日と、いま、名前が出る理由
  tier: 報道
  telop: 2018年1月、引退。2026年、ラヴェンナへ
  narrator: 解説
  card:
    type: table
    title: 引退のあと
    columns: [いつ, できごと]
    rows:
    - ['2017年2月', バルセロナの公式アンバサダーに]
    - ['2018年1月', 兄が引退を明かす]
    - ['2026年6月', ラヴェンナが登録を発表]
    - ['2026年11月', デビューの見込み（報道）]
  say:
  - text: 最後のクラブは、フルミネンセ。2015年9月に、契約を解除します。
    image: assets/images/20261018_ronaldinho_legend/11.jpg
    card: &after_tl
      type: table
      title: 引退のあと
      columns: [いつ, できごと]
      rows:
      - ['2017年2月', バルセロナの公式アンバサダーに]
      - ['2018年1月', 兄が引退を明かす]
      - ['2026年6月', ラヴェンナが登録を発表]
      - ['2026年11月', デビューの見込み（報道）]
      highlight_row: 0
  - text: 2017年2月、バルセロナの公式アンバサダー、クラブの顔役に。就任の日の言葉です。
    card:
      <<: *after_tl
      highlight_row: 0
  - voice: ロナウジーニョ
    text: 帰ってきた。言葉にならないほど、感謝している。
    pause: 0.6
  - text: 2018年1月16日。兄で代理人のロベルトが、引退を明かします。37歳でした。
    image: assets/images/20261018_ronaldinho_legend/07.jpg
    card:
      <<: *after_tl
      highlight_row: 1
  - voice: ロベルト・アシス
    text: もう止めた。終わったんだ。
    pause: 0.6
  - text: 2026年6月23日。イタリア3部のラヴェンナが、46歳の登録を発表。
    image: assets/images/20261018_ronaldinho_legend/11.jpg
    emph: true
    card:
      <<: *after_tl
      highlight_row: 2
  - text: 発表の場はマイアミ。本人は、こう話しました。
    card: none
  - voice: ロナウジーニョ
    text: 新しい色で、同じ笑顔。ボールと踊るのが、待ちきれない。
  - voice: ロナウジーニョ
    text: さあ、魔法を始めよう。
    cont: true
    pause: 0.6
  - text: デビューの日は未発表。クラブは、少なくとも1試合は出る、としています。
    card: none
  - text: 報道では、11月15日の地元ダービーが有力です。
    card:
      <<: *after_tl
      highlight_row: 3
  - text: 最後の公式戦から、11年余り。もう1つ、名前が出る理由。
    image: assets/images/20261018_ronaldinho_legend/07.jpg
    card: none
  - text: 2025年11月、バルセロナの第4ユニフォームのモチーフは、このクラシコ。
    card: none
