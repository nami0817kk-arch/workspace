- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  telop: メッシの最初のゴールと、午前0時5分のゴール
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['2005年5月', メッシの初ゴールを、パスで作った]
    - ['2003年9月', 午前0時5分のキックオフで、初ゴール]
    source: バルセロナ公式
  say:
  - text: ロナウジーニョの数字の外に、2つの話があります。
    image: assets/images/20261018_ronaldinho_legend/12.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: バルセロナ公式
      highlight_row: 0
  - text: 1つ目は、メッシのゴール。2005年5月1日、アルバセテ戦です。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 終盤、17歳のメッシが交代で入ります。最初のゴールは、オフサイドでした。
    card: none
  - text: 91分。もう一度、ロナウジーニョのパス。メッシが、ふわりと浮かせて決めます。
    emph: true
    card: none
  - text: 17歳10か月。当時、ラ・リーガ最年少の得点者です。2017年の、本人の言葉。
    card: none
  - voice: ロナウジーニョ
    text: あの瞬間、サッカー史の新しい章が生まれた。
  - voice: ロナウジーニョ
    text: メッシはとても若くて、すべてがそこから始まった。
    cont: true
  - voice: ロナウジーニョ
    text: 彼の最初の一歩に関われて、すばらしい。
    cont: true
    pause: 0.6
  - text: 2つ目は、その2年前。バルセロナでの、最初のゴールです。
    image: assets/images/20261018_ronaldinho_legend/09_w.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 2003年9月3日、セビージャ戦。キックオフは、午前0時5分。
    card: none
  - text: ドリブルで運んで、約25メートルのシュート。クロスバーの下に当たって、ネット。
    emph: true
    card: none
  - text: 観測所の地震計が、小さな揺れを記録した、とクラブは書いています。
    card: none
  quotes_from:
  - https://fcbarcelona.com/en/news/781521/ronaldinho-it-will-be-emotional-to-put-the-fc-barcelona-shirt-back-on
  sources:
