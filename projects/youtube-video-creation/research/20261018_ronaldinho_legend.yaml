    - ['59分', ロナウジーニョが追加点]
    - ['77分', ロナウジーニョが3点目]
    - ['試合後', ベルナベウが総立ちで拍手]
  say:
  - text: 2005年11月19日、ラ・リーガ第12節。伝統の一戦、クラシコです。
    image: assets/images/20261018_ronaldinho_legend/12.jpg
    card: &match_tl
      type: table
      title: 2005年11月19日 ラ・リーガ第12節 レアル0-3バルセロナ
      columns: [時刻, できごと]
      rows:
      - ['14分', エトーが先制（メッシのパスから）]
      - ['59分', ロナウジーニョが追加点]
      - ['77分', ロナウジーニョが3点目]
      - ['試合後', ベルナベウが総立ちで拍手]
      highlight_row: 0
  - text: 場所は、レアルの本拠地ベルナベウ。相手には、代表仲間のロナウドや、ジダン。
    card: none
  - text: バルセロナには、18歳のメッシ。初めてのクラシコでした。
    card: none
  - text: 14分、エトーが先制。パスを出したのは、そのメッシです。
    card:
      <<: *match_tl
      highlight_row: 0
  - text: 後半。ロナウジーニョが、左から運びます。
    card:
      <<: *match_tl
      highlight_row: 1
  - text: サルガドとセルヒオ・ラモスをかわして、ゴール。
    emph: true
    card:
      <<: *match_tl
      highlight_row: 1
  - text: 77分。ほとんど同じ形で、もう1点。
    card:
      <<: *match_tl
      highlight_row: 2
  - text: 3対0。バルセロナの勝ちです。
    card:
      <<: *match_tl
      highlight_row: 3
  - text: ここで、本拠地の観客が立ち上がります。
    callword: 総立ち
    image: assets/images/20261018_ronaldinho_legend/09_w.jpg
    card: none
  - text: 敵の選手に、この拍手が送られるのは、とても珍しいこと。
    card: none
  - text: バルセロナの選手では、それまでマラドーナだけ、と伝わります。
    card: none
  - text: 2015年の取材で、本人は振り返ります。
    card: none
  - voice: ロナウジーニョ
    text: 僕が知るかぎり、マドリードで、
  - voice: ロナウジーニョ
    text: これを受けたのは、マラドーナだけだ。
    cont: true
  - voice: ロナウジーニョ
    text: 僕の英雄が、最後にその栄誉を受けた人だと知って、
    cont: true
  - voice: ロナウジーニョ
    text: うれしさは2倍になった。
    cont: true
    pause: 0.6
  - text: 9日後の11月28日、バロンドールの発表。
    card: none
  - text: 52人の投票で、225点。2位のランパードは、148点でした。
    emph: true
    card: none
  quotes_from:
  - https://soccerladuma.co.za/local/archive/ronaldinho-what-standing-ovation-at-the-santiago-bernabeu-meant-to-me-20151214
  - https://www.soccerladuma.co.za/local/archive/ronaldinho-what-standing-ovation-at-the-santiago-bernabeu-meant-to-me-20151214
