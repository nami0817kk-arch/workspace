sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ポルト戦で2得点、CLは59試合59得点
    narrator: キャスター
    say:
      - チャンピオンズリーグのリーグフェーズ第1節、マンチェスター・シティが敵地でポルトを2対0で下しました。
      - 前半は相手ゴールキーパー、ディオゴ・コスタの好守もあってスコアレス。
      - 動いたのは後半立ち上がりの47分でした。エンソ・フェルナンデスのクロスを、ハーランドが頭で合わせます。
      - 後半アディショナルタイムには、アイト・ヌーリの折り返しを右足でねじ込んでこの日2点目。
      - この2得点で、ハーランドのチャンピオンズリーグ通算成績は59試合59得点になりました。
      - 単純計算で、1試合あたり1得点です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007448/
      - https://web.ultra-soccer.jp/news/all/35674/

  - id: fifty
    heading: 50得点に何試合かかったか
    tier: 報道
    telop: ハーランドは49試合、メッシは66試合
    narrator: 解説
    card:
      type: bars
      title: CL通算50得点に到達するまでの試合数
      items:
        - {label: "ハーランド", value: 49}
        - {label: "ファン・ニステルローイ", value: 62}
        - {label: "メッシ", value: 66}
        - {label: "C・ロナウド", value: 91}
      unit: 試合
    say:
      - ここからが本題です。UEFAによると、ハーランドが通算50得点に届いたのは49試合目でした。
      - これは大会の歴史で最速です。それまで最速だったファン・ニステルローイの62試合を、13試合も更新しました。
      - では、あの2人はどうだったか。
      - メッシが50得点に到達したのは66試合目。ハーランドより17試合遅い計算です。
      - クリスティアーノ・ロナウドは91試合目でした。差は42試合あります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007448/
      - https://www.soccer-king.jp/news/world/cl/20260909/2202672.html

  - id: sixty
    heading: 次に届くのは60得点
    tier: 報道
    telop: 最速はメッシの80試合
    narrator: 解説
    card:
      type: bars
      title: CL通算60得点に到達するまでの試合数
      items:
        - {label: "メッシ", value: 80}
        - {label: "レバンドフスキ", value: 85}
        - {label: "エムバペ", value: 89}
        - {label: "C・ロナウド", value: 98}
      unit: 試合
    say:
      - 目の前にあるのが、通算60得点です。
      - これまでの最速はメッシの80試合。レバンドフスキが85試合、エムバペが89試合、C・ロナウドが98試合と続きます。
      - いま59試合59得点のハーランドは、次のチャンピオンズリーグで決めれば60試合で60得点になります。
      - メッシの記録を20試合も更新する計算です。
      - クラブ単位でも記録に並びました。マンチェスター・シティの選手としてのCL得点は36。
      - これはアグエロが持っていたクラブ最多記録と同じ数字です。ただしアグエロは64試合、ハーランドは40試合での到達でした。
      - 次の第2節は10月14日、相手はパリ・サンジェルマンです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35674/
      - https://www.footballchannel.jp/2026/09/09/post1007448/

  - id: enzo
    heading: 同僚はどう見ているか
    tier: 報道
    telop: 「まさに野獣のような選手だ」
    narrator: 解説
    say:
      - 先制点をアシストしたのは、今夏チェルシーから加入したエンソ・フェルナンデスでした。加入後初のアシストです。
      - 試合後、ハーランドの印象を聞かれてこう答えています。
      - {voice: エンソ・フェルナンデス, text: アーリング・ハーランドはまさに野獣のような選手だ}
      - {voice: エンソ・フェルナンデス, text: ピッチに立つときは常に彼を探すようにしている}
      - {voice: エンソ・フェルナンデス, text: これからも彼に多くのアシストを供給したい}
      - {voice: エンソ・フェルナンデス, text: あのようなゴールをたくさん決めてもらいたいね}
      - {voice: エンソ・フェルナンデス, text: 単に素晴らしい選手というだけではない}
      - {voice: エンソ・フェルナンデス, text: 人間としても本当に素晴らしく、僕を温かく迎え入れてくれた}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35686/
