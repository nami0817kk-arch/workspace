# ハーランドのCL通算59試合59得点（2026年9月10日）。ユーザー指示「ハーランド」
#
# **こちらのハーランド回（ショート）は1,384回で、海外題材の最高値。**
# 100本を測り直したら、ショートの上位12本は日本人6/海外6で上限はほぼ同じだった。
# 効いているのは日本人かどうかではなく、**題材が大きいかどうか**。
#
# 引きは**「メッシとC・ロナウドは50点目に何試合かかったか」**。
# 59試合59得点という数字より、その2人との差のほうが効く。
#
# **反応は入れない。**読める形のスレが無かった
