  head: マンC、正式に控訴「クラブは無実」。UAEは英政府に「関係に大きな負担」、官邸は「誰もルールの上にはいない」
  why: '10/1の19時に控訴。声明「判断には法・原則・事実の明らかな誤りがある」「無実で、反論の余地のない証拠がある」。控訴は3人の独立した委員会が審理し、12週以内（クリスマス前の週まで）に終える決まり、判断は審理後30日以内。処分を決める聴聞は別で、日程は未定。Bloomberg によるとUAE側が英政府に、判決が今後の大型投資に響きかねないと伝えた（話した人の名前は出ていない）。官邸報道官「誰かがルールの上にいるということはありえない」。トゥヘル監督「シティの選手は準備ができている」。今日のマンCの回の続き

    '
  src: Sky Sports・ESPN・Daily Mail（Bloomberg 経由）（10/2）
