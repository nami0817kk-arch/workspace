  head: 久保建英、俳優の福原遥さんとの結婚を発表。2人のインスタに連名の文と直筆の署名
  why: 10/2の夜、2人がそれぞれのInstagramに同じ文を載せた。「お互い幼い頃から沢山の方の支えがあって今があります」「共に助け合い、笑顔あふれる温かい家庭を築いていきたい」。交際の報道は一度も無かった（報知）。入籍日は出ていない。長友佑都はXで「タケ結婚おめでとう　アモーレを大切に」。スペイン・ソシエダ側の反応はまだ見つからない。サッカーの数字と合わせるなら、代表で先発に戻った今季の流れと一緒に
