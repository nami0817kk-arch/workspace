title: 10月3日の題材（ニュース4枠）
lead: 夜に出た久保建英の結婚発表とマンCの控訴を足して12件
note: <b>○×を付けてください。</b>22時半に集め直し、「夜の新着」の印が付いたものが夜に入った話です。明日のニュースは日本人3本・ほか1本（本編＋ショート）。中身は記事の本文まで確かめてあります。まとめ系サイト（football-tribe）の移籍の話は元の記事までたどり、元に無い書き足しは外しました。昨日×が付いた題材（堂安の主将・佐野・メッシのクラブ・ハーランドの提訴・クロップ など）は載せていません。
