  head: ロナウド抜きのポルトガル、4-2で3連勝。ポルトの空港ではファン同士が言い争って警察が入り、連盟は歩み寄りを探る
  why: 'カンセロ、ゴンサロ・ラモス、ヴィティーニャ、ジョアン・フェリックスが得点、ブルーノが2アシストで主将、7番はレオン。10/2にポルトに着くと、空港で観客がジェズス監督に「エゴはエッフェル塔の大きさ」と叫び、ロナウドに不満の客と言い争いになって警察が割って入った。連盟（プロエンサ会長）は2人の「歩み寄りの場」を探っている（A Bola）。代表の各SNSは合計で200万近く減り、ジェズス個人も10万近く減、ロナウドは増えた。ジェズス「次の試合のあとで、この件は逃げずに話す」。次は10/4のノルウェー戦。今日のロナウドの回の続き

    '
