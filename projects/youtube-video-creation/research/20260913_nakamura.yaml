sections:
  - id: what
    heading: 夏に何があったか
    tier: 報道
    telop: 動いていたのはリヨンだけではない
    narrator: キャスター
    card:
      type: points
      title: 中村敬斗に動いたクラブ
      items:
        - エバートン
        - ボーンマス
        - ハル・シティ
        - マルセイユ（財政面で撤退）
    say:
      - 中村敬斗が、今年の夏にスタッド・ランスからオリンピック・リヨンへ移りました。
      - 獲得に乗り出していたのは、リヨンだけではありません。エバートン、ボーンマス、ハル・シティ。
      - マルセイユも関心を示しましたが、財政面の問題で撤退しています。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/11/359140/

  - id: why
    heading: 本人がリヨンを選んだ理由
    tier: 報道
    telop: 上位争いと、欧州の舞台
    narrator: 解説
    say:
      - 複数の選択肢があったなかで、中村が求めたのは上位を争えるクラブでした。
      - ヨーロッパの大会に出られること。この条件でリヨンを選んでいます。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/11/359140/

  - id: coach
    heading: 監督が並べた言葉
    main: true
    tier: 報道
    telop: 「フォファナとはまったく異なるタイプだ」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 褒め言葉ではなく、**名指しで別の選手と比べている**ところが芯
    card:
      type: quote
      title: パウロ・フォンセカ
      text: 敬斗はチームプレーのできる選手であり、フォファナとはまったく異なるタイプだ
    say:
      # **ショートは山場の節だけを切り出すので、状況もここに入れる**
      - リヨンを率いるパウロ・フォンセカが、中村についてこう話しました。
      - {voice: パウロ・フォンセカ, text: 中村は準備ができている。彼が今週取り組んだトレーニングの内容を気に入っているし、試合に出られる状態だ}
      - {voice: パウロ・フォンセカ, text: 非常に良いフィジカルコンディションで加入してきたし、練習で見せているプレーも私はとても気に入っている}
      - そのうえで、チームの別の選手の名前を出します。
      - {voice: パウロ・フォンセカ, text: 彼は頭の良い選手で、私たちのプレースタイルを理解している。敬斗はチームプレーのできる選手であり、フォファナとはまったく異なるタイプだ}
      - {voice: パウロ・フォンセカ, text: 周囲との連係により深く関与できるうえ、最後の局面で違いを生み出せる。シュートがうまく、決定力も高い}
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/11/359140/
