# 中村敬斗をリヨンのフォンセカ監督が語った（2026年9月13日）
#
# **出どころはフットボール・トライブ。**フット・メルカートに載ったフォンセカの
# 発言を日本語で伝えたもの。**会見の場までは辿れていない**ので、
# 「監督がこう話した」の形で置き、記者会見とは書かない。
#
# 引きは**「フォファナとはまったく異なるタイプだ」**。褒め言葉そのものより、
# **監督が名指しで別の選手と比べている**ところが芯。ここが山場（@main）。
#
# **中村敬斗は検索でいちばん来ている名前**（直近28日で44回、2位の久保の倍）。
# タイトルにも読み上げの1行目にも、必ずフルネームで入れる。
#
# **獲得に動いたクラブは記事どおり。**エバートン・ボーンマス・ハル。
# マルセイユは「関心を示したが財政面の問題で撤退」。**金額は書かれていないので出さない。**
format: quote
# **引ける発言は4つ。**すべて監督ひとりの言葉なので、その分だけ下げる
voice_min: 27
slot: japan_1
date: "2026年9月13日"

people:
  - 中村敬斗
  - パウロ・フォンセカ

short_title: "中村敬斗へのリヨン監督の評価"

theme:
  id: nakamura_fonseca
  league: france
  kind: other
  topic: オリンピック・リヨン
  title: 中村敬斗の今夏の移籍と、リヨンでの評価。監督は
  hook: 獲りにきたのは1クラブではありません。移った先で、監督は何と言っているか。
  question: リヨンの監督は、中村をどう見ているか

thumbnail:
  line1: 中村敬斗の移籍とリヨンでの評価
