- id: rival
  heading: 宿敵
  tier: 背景
  telop: ウェスト・ロンドン・ダービー。相手はフラム
  narrator: 解説
  card:
    type: table
    title: ウェスト・ロンドン・ダービー
    columns:
    - ''
    - ''
    rows:
    - - いちばん激しい相手
      - フラム／QPR
    - - 呼び名
      - ウェスト・ロンドン・ダービー
    - - 2020年8月4日
      - プレーオフ決勝。延長でフラムが2-1
    - - 今季
      - フラムもプレミアリーグにいる
  say:
  - ウェスト・ロンドン・ダービーと呼ばれる一戦があります。
  - 指しているのは4つのクラブです。チェルシー、フラム、QPR、そしてこのクラブ。
  - そのなかでいちばん激しいのが**フラム戦**、そしてQPR戦だと書かれています。
  - 熱を帯びたのは1980年代からです。フラムが下のリーグへ落ちていった時期でした。
  - 試合はいつも満員で、ピッチでもスタンドでも緊張が高まった、と残っています。
  - 近いところで決定的だったのは2020年8月4日。チャンピオンシップのプレーオフ決勝です。
  - 延長の末、フラムが2対1で勝ち、昇格していきました。
  - ジョー・ブライアンが105分と117分に2点。こちらはヘンリク・ダルスゴーが120分すぎに1点を返すのがやっとでした。
  - そのフラムは、今季もプレミアリーグにいます。
  - なお距離の近いチェルシーとは、むしろ「わりと良好な関係」だとも書かれています。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/West_London_derby
