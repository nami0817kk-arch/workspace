  - image: assets/stats/pl_brentford_data0.png
    text: 創立は**1889年**。ボートを漕ぐクラブの仲間たちが作りました。
    no_telop: true
  - image: assets/backgrounds/stadium_ブレントフォード_in.png
    text: 本拠地のスタジアムには、1万7250人が入ります。
  - image: assets/stats/pl_brentford_data.png
    text: 場所は西ロンドン、テムズ川沿いの町です。
    no_telop: true
  - image: assets/stats/pl_brentford_data3.png
    text: オーナーはマシュー・ベンハム。2012年からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_brentford_data.png
    text: 大きなタイトルはまだありません。いちばん大きな一歩は2021年、昇格プレーオフに勝って初めてプレミアに上がったことです。
    no_telop: true
  - image: assets/stats/pl_brentford_data7.png
    text: プレミアでの最高位は、2022年から23年の**9位**です。
    no_telop: true
  - image: assets/stats/pl_brentford_data8.png
    text: 愛称は「ビーズ」。蜂です。
    no_telop: true
