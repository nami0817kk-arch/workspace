    no_telop: true
  - image: assets/backgrounds/stadium_ブレントフォード_in.png
    text: 本拠地はブレントフォード・コミュニティ・スタジアム。2020年に移ってきました。
  - image: assets/stats/pl_brentford_data4.png
    text: オーナーはマシュー・ベンハム。2012年からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_brentford_cups.png
    text: 大きなタイトルはまだありません。プレミアに上がったのも、2021年が初めてです。
    no_telop: true
  - image: assets/stats/pl_brentford_last.png
    text: プレミアでの最高位は、2022年から23年の**9位**です。
