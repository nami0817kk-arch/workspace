      - 四つ角すべてにパブ
  say:
  - text: アンドリュースのサッカーは、長いボールと空中戦で押し、セットプレーは攻めも守りも武器。
    image: assets/photos/pl/brentford_manager_9acd4388.jpg
  - 変わったのは運営。育成組織を2016年に閉じ、賭けの統計会社を持つオーナーのデータで選手を選ぶ。
  - 2020年まで使ったグリフィン・パークは、四つ角すべてにパブがあるイングランド唯一の球場でした。
  sources:
