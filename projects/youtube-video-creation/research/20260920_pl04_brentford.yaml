- id: history
  heading: 歩んできた道
  tier: 背景
  telop: プレーオフに9回負けてから、10回目で上がった
  narrator: 解説
  card:
    type: table
    title: 残してきた記録
    columns:
    - ''
    - ''
    rows:
    - - 2021年
      - プレーオフ決勝でスウォンジーに2-0
    - - 1967年
      - QPRに吸収される話が白紙に。消滅を免れる
  say:
  - プレーオフに出ては敗れる。それが**9回**続きました。イングランドで、ほかにない数です。
  - そのうち4回は、決勝まで行って敗れました。1997年から2020年のあいだのことです。
  - 10回目が2021年でした。決勝でスウォンジー・シティを2対0で下します。
  - プレミアリーグになってからは初めて。1部としては**74年ぶり**でした。
  - 消えかけた年も、あります。
  - 1967年、クイーンズ・パーク・レンジャーズに吸収されて、クラブごと消える話がまとまりかけました。
  - 止めたのはサポーターです。抗議と寄付で、話は白紙に戻りました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Brentford_F.C.
  bg: assets/backgrounds/stadium_ブレントフォード.png
