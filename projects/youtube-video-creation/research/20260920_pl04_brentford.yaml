  say:
  - このクラブは、一度消えかけています。
  - 1967年、QPRへの身売りの話がまとまりかけました。止めたのはサポーターです。抗議と寄付で、話は白紙に戻りました。
  - そしてもうひとつ、長く続いた記録があります。
  - '**プレーオフで9回続けて敗れた。**これはリーグの記録です。'
  - 10回目が2021年でした。決勝でスウォンジー・シティを2対0で下します。
  - '**74年ぶり**の1部昇格でした。'
