  - text: まず、ボールを持って試合を支配すること。
    card: *style_doc
  - text: 次に、攻めているあいだも後ろに人を残し、相手の速攻を止めること。
    card: *style_doc
  - text: そして、コーナーキックやフリーキックのセットプレー。専門のコーチも置いています。
    card: *style_doc
  - text: その色がはっきり出たのが、2025年4月8日。チャンピオンズリーグの準々決勝です。
    image: assets/images/20261026_manager_arteta/01_w.jpg
