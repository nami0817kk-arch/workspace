- id: words
  heading: 本人は、就任の日と優勝のあとで、何を語ったのか
  tier: 報道
  telop: 2019年12月の就任の日と、2026年5月の優勝のあと
  narrator: 解説
  card: &words_doc
    type: document
    label: アルテタの言葉（2019年12月・2026年5月、訳）
    paragraphs:
    - いちばん大きなタイトルを争うチームでなければならない。
    - 一晩で変わらないことは、分かっている。
    - この選手たちを優勝に導くだけの力が、自分にあるのか。
    highlight:
    - いちばん大きなタイトル
    - 一晩で変わらない
    - 自分にあるのか
  say:
  - text: ここで、アルテタ本人の言葉。まずは6年前の冬、監督に決まったときです。
    image: assets/images/20261026_manager_arteta/02_w.jpg
    card: *words_doc
  - voice: アルテタ
    text: いちばん大きなタイトルを、争うチームでなければならない。
  - voice: アルテタ
    text: 一晩で変わらないことは、分かっています。
    cont: true
    pause: 0.5
  - text: もう1つは、優勝のあとの会見。重圧の中で、自分を疑ったことを認めました。
    image: assets/images/20261026_manager_arteta/03_w.jpg
    card: *words_doc
  - voice: アルテタ
    text: この選手たちを優勝に導く力が、自分にあるのか。
  - voice: アルテタ
    text: そう、自分に問いました。
    cont: true
  - voice: アルテタ
    text: 実際に勝つまでは、自分を認めることはできないんです。
    cont: true
    pause: 0.5
  quotes_from:
  - https://www.bbc.com/sport/football/50817660
  - https://www.aljazeera.com/sports/2026/5/21/arteta-built-a-fire-over-watching-arsenal-crowned-premier-league-winners
  sources:
  - https://www.bbc.com/sport/football/50817660
  - https://www.aljazeera.com/sports/2026/5/21/arteta-built-a-fire-over-watching-arsenal-crowned-premier-league-winners
- id: secret
  heading: 数字の外にある話。主将でも監督でも、FAカップを獲っていた
  tier: 背景
  telop: 主将と監督でFAカップ。優勝監督で3番目の若さ
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [2020年8月, 主将と監督の両方でFAカップ。クラブで初]
    - [2023年3月, 168試合目で100勝。当時のクラブ最高の勝率]
    - [2026年5月, 44歳54日でプレミア優勝。3番目の若さ]
    - [通算, 月間最優秀監督に8回]
    highlight_row: 0
    source: 英語版Wikipedia・プレミアリーグ公式
  say:
  - text: ここから、数字の外の話。アルテタは、選手としてもFAカップを2度獲っています。
    image: assets/images/20261026_manager_arteta/05_w.jpg
    card: none
  - text: 2020年には、監督でも優勝。
    image: assets/images/20261026_manager_arteta/01_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 主将と監督の両方でFAカップを獲った、クラブで初めての人です。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 2023年3月には、168試合目で100勝目。
    image: assets/images/20261026_manager_arteta/02_w.jpg
    card:
      <<: *sec_table
      highlight_row: 1
  - text: その時点で、アーセナルの歴代監督で最も高い勝率でした。
    card:
      <<: *sec_table
      highlight_row: 1
  - text: プレミアで優勝したとき、44歳54日。
    image: assets/images/20261026_manager_arteta/03_w.jpg
    emph: true
    card:
      <<: *sec_table
      highlight_row: 2
  - text: 優勝した監督で3番目の若さです。上の2つは、どちらもモウリーニョでした。
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Mikel_Arteta
  - https://www.premierleague.com/en/news/4660971/every-premier-league-title-winning-manager-in-history
- id: view
  viewpoint: true
  heading: 見立て・2位の季より少ない勝ち点で、なぜ優勝に届いたのか
  tier: 背景
  telop: 89点で2位、85点で優勝。シティとの差は、2点の負けから7点の勝ちへ
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた
    columns: [比べ, 答え]
    rows:
    - [2023-24 アーセナルとシティの勝ち点, 89対91（2点差で2位）]
    - [2025-26 アーセナルとシティの勝ち点, 85対78（7点差で優勝）]
    - [アーセナルの失点（2023-24→2025-26）, 29→27]
    - [今季の勝率（10月24日まで13試合）, 84.6%（通算は61.2%）]
    highlight_row: 0
  say:
  - text: 見立てです。アルテタのアーセナルが2位だった季と、優勝した季を並べました。
    image: assets/images/20261026_manager_arteta/01_w.jpg
    card: *view_table
  - text: 2位だった3季前は、勝ち点89。
    card:
      <<: *view_table
      highlight_row: 0
  - text: それでも優勝したシティの91に、2点届きませんでした。
    card:
      <<: *view_table
      highlight_row: 0
  - text: 優勝した昨季は85。2位の季より、4点少ない勝ち点です。
    emph: true
    card:
      <<: *view_table
      highlight_row: 1
  - text: ただ、2位のシティは78。差は2点の負けから、7点の勝ちに変わりました。
    emph: true
    mark: {kind: circle, row: 1, col: 1}
    card:
      <<: *view_table
      highlight_row: 1
  - text: 失点は29から27へ。勝ち点を落としながらも、守りの数字は締まっていました。
    image: assets/images/20261026_manager_arteta/03_w.jpg
    card: none
  - text: そして今季。10月24日まで13試合で11勝1敗、引き分けが1つ。勝率84.6%。
  - text: 通算の勝率を、大きく上回っています。
    card:
      <<: *view_table
      highlight_row: 3
    image: assets/images/20261026_manager_arteta/02_w.jpg
    emph: true
    card:
      <<: *view_table
      highlight_row: 3
  - text: リーグは8試合で7勝1敗の2位。次に見るのは、2連覇できるかどうかです。
    image: assets/images/20261026_manager_arteta/01_w.jpg
    card: none
