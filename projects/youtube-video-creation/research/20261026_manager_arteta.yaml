    card:
      <<: *career_tl
      focus: 2
  - text: クラブは、監督を代えませんでした。
    image: assets/images/20261026_manager_arteta/01_w.jpg
    card: none
  - text: その9月、リーグ戦を全勝して、初めての月間最優秀監督に選ばれます。
    card: none
  - text: 2023年からは、3季続けてリーグ2位。あと一歩が、続きました。
    image: assets/images/20261026_manager_arteta/02_w.jpg
    card:
      <<: *career_tl
      focus: 3
  - text: 迎えた2026年5月19日。
    card:
      <<: *career_tl
      focus: 4
  - text: 追っていたシティが引き分け、アーセナルが王者になります。
    image: assets/images/20261026_manager_arteta/03_w.jpg
    emph: true
    card:
      <<: *career_tl
      focus: 4
  - text: 同じ月にはチャンピオンズリーグでも、クラブとして20年ぶりに決勝へ。
    card: none
  - text: パリ・サンジェルマンとの決勝は1対1。PK戦の末に、準優勝でした。
    image: assets/images/20261026_manager_arteta/01_w.jpg
    card: none
