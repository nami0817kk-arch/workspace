# 監督紹介：アルテタ（10/26 月、シリーズ「監督紹介」、key: manager_arteta、型は news）。9節の型（2026-10-20 決定）。見本は 20261025_manager_simeone。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-26 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。アルテタを主題にした「人物紹介」（監督紹介）は無し。
#   アルテタの名前が題に出る既存の本：9/13 news「アルテタがプレシーズンに、わざと起こしていたことの中身」、9/23 news「アルテタがアーセナルと新たに4年契約…」、
#   10/8 財政「アルテタ、アーセナルで2030年まで。プレミア最高給の中身」（契約・年俸）、10/21 news「ラヤ…アルテタは『ごく少数』」、10/24 news「サカ…アルテタが口にした課題」。
#   → この回は「監督アルテタの経歴・勝率・戦術の色・優勝まで」で、財政の回（契約・年俸）とは主題が違う。**年俸・契約の期限・契約の中身は入れない**（10/8 と重なるため）。
#   9/13 の「プレシーズンにわざと起こしていたこと」（更衣室を暑く…）、10/21・10/24 の発言は使わない。直近30日にアルテタの本が4本ある（財政1・ニュース本編0・ショート2）ので報告に書く。
#
# **いまの立場（確かめた）**
#   ○ 英語版 Wikipedia「Mikel Arteta」（控え research/raw/20261026_arteta_wiki.txt）：currentclub = Arsenal (manager)。
#   ○ 同「2026–27 Arsenal F.C. season」（控え research/raw/20261026_arsenal_2026_27_wiki.txt）：manager = Mikel Arteta。
#   ○ ESPN の日程（site.api.espn.com eng.1 teams/359/schedule）：2026-10-24 アーセナル 2-0 エヴァートン ほか今季の試合。今季も1部（プレミア）。
#   × クラブ公式（arsenal.com）の監督ページは当たっていない。契約の期限は 10/8 の回と重なるので台本に入れない。
#
# **通算の数え方（台本とサムネをそろえる）**＝トップチームの全公式戦。監督はアーセナルだけ（シティのコーチ時代、代理の1試合は数えない）。
#   英語版 Wikipedia「Managerial statistics」（updated: match played 24 October 2026）：366試合 224勝 68分 74敗。勝率 224/366＝61.2%（自分で割った）。
#   就任の発表は 2019-12-20、指揮は 2019-12-22 から（12/21 エヴァートン戦は暫定のリュングベリ）。
#   優勝（Wikipedia Honours「Manager」欄）：プレミアリーグ 2025-26／FAカップ 2019-20／コミュニティ・シールド 2020・2023・2026＝**5冠**。
#     準優勝（EFLカップ 2025-26、チャンピオンズリーグ 2025-26）は数えない。
#   今季（ESPN・Wikipedia の Overall record、2026-10-24 まで）：プレミア8試合 7勝1敗（13得点5失点、勝ち点21・2位）／チャンピオンズリーグ3試合 2勝1分／EFLカップ1勝／コミュニティ・シールド1勝
#     ＝13試合 11勝1分1敗。勝率 11/13＝84.6%（自分で割った）。
#
# **基礎**：1982-03-26 スペイン・サン・セバスティアン生まれ（44歳）。MF。バルセロナの下部組織 → バルセロナB → パリ・サンジェルマン（期限付き）→ レンジャーズ → レアル・ソシエダ → エヴァートン → アーセナル（2011〜2016）。
#   アーセナルでは 2014-15 から主将（Wikipedia）、FAカップ優勝 2014・2015。スペインのA代表の出場は無し（世代別だけ）→ 台本では代表に触れない。
#   2016-07-03 マンチェスター・シティのコーチ（グアルディオラの下）。2016年の引退後すぐ。
#   就任時：BBC 2019-12-20「Arsenal are 10th in the Premier League with 22 points」（控え research/raw/20261026_arteta_bbc_appoint.txt）。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**
#   ○ 英語版 Wikipedia「Takehiro Tomiyasu」（控え research/raw/20261026_tomiyasu_wiki.txt）：2021-08-31 アーセナル加入、2021-09-11 ノリッジ戦（1-0）で初出場、
#     2021年9月のクラブの月間最優秀選手（ファン投票51%）。アーセナルでは 2021-22〜2024-25 に全公式戦 84試合2得点（Career statistics の表）。2025年7月に契約を解除して退団。
#     ボローニャでは全公式戦64試合（同じ表）。いまはクリスタル・パレス（2026-08-07 加入）。在籍はアルテタの就任後なので、84試合はすべてアルテタの指揮。
#   × アルテタが日本で指揮した試合・日本代表との接点は見つからない。けがの経緯は入れない（「けがが多かった」とも言わない）。
#
# **戦術の色（実例の試合＝2025-04-08 チャンピオンズリーグ準々決勝 第1戦、アーセナル 3-0 レアル・マドリード）**
#   ○ ESPN の試合記録（site.api.espn.com uefa.champions summary?event=733608、控え research/raw/20261026_arsenal_realmadrid_2025_espn.json）：
#       58分 ライスの直接フリーキック、70分 ライスの直接フリーキック、75分 メリーノ（ルイス＝スケリーのアシスト）。支配率 アーセナル53.4%・レアル46.6%。シュート 12対9。
#       ※ESPN の「枠内」は 11 と出ていて怪しい（シュート12本で枠内11）→ 枠内は使わない。
#   ○ 第2戦 2025-04-16 レアル・マドリード 1-2 アーセナル（ESPN scoreboard）→ 2戦合計 5-1。準決勝は 2008-09 以来（Wikipedia「Mikel Arteta」）。
#   ○ 英語版 Wikipedia「Declan Rice」：1試合に直接フリーキック2点は、チャンピオンズリーグの決勝トーナメントで初めて。
#   ○ 英語版 Wikipedia「Mikel Arteta」Style of management：4-3-3 が主、ボールを持って試合を支配する／攻めているあいだも後ろに3-2の形を残して相手の速攻を防ぐ／攻撃のセットプレーで点を取る。
#       セットプレー専門のコーチ（2021年7月からニコラ・ジョベール）を置く（同記事の Arsenal の節）。
# **本人の言葉（自訳。原文は出典）**：
#   ①2019-12-20 BBC：「We need to be competing for the top trophies in the game」「I'm realistic enough to know it won't happen overnight」
#   ②2026-05 優勝の直後（Irish News、PA配信の記事。控え research/raw/20261026_arteta_irishnews.txt）：
#     "We came very close. We fell short on three occasions, and that was very painful."
#   ③2026-05-21 Al Jazeera（控え research/raw/20261026_arteta_aljazeera.txt）："I've asked that question to myself, am I good enough to lead these players to win a major trophy? Until you do it, you cannot validate yourself."
#     ※同じ記事の家族の話（バーベキュー・息子）は私生活なので入れない。
# **マル秘話（英語版 Wikipedia・プレミアリーグ公式）**：
#   ・FAカップを、アーセナルの主将と監督の両方で獲ったのは初めて（2020年の決勝 2-1 チェルシー）。就任1年目の主要タイトルはジョージ・グラハム（1986-87）以来。
#   ・2021-22 は開幕3連敗、勝ち点0・得点0で最下位。9月のリーグ戦を全勝して初の月間最優秀監督。月間最優秀監督は計8回（Honours）。
#   ・2023年3月12日、168試合目で100勝。アーセナルの監督で、その時点の勝率は最高（Wikipedia）。
#   ・プレミアリーグ公式（2026-05-19、控え research/raw/20261026_arteta_pl_titlemanagers.txt）：プレミアで優勝した13人目の監督。プレーしたクラブでプレミア優勝した初の監督。
#     44歳54日は、プレミア優勝監督で3番目の若さ（上の2つはモウリーニョ）。スペイン人では、グアルディオラに次ぐ2人目。
#   ・2026-05-30 チャンピオンズリーグ決勝（ブダペスト）でパリ・サンジェルマンと1-1、PK 3-4。クラブとして20年ぶりの決勝。
# **勝ち点の推移（英語版 Wikipedia「List of Arsenal F.C. seasons」、控え research/raw/20261026_arsenal_seasons_wiki.txt）**：
#   2025-26 マンチェスター・シティ 23勝9分6敗＝78（2位）、2023-24 シティ 28勝7分3敗＝91（優勝）（英語版 Wikipedia 各季の Premier League の表、控え research/raw/20261026_2025_26_pl_wiki.txt ほか）。
#   2020-21 61（8位）／2021-22 69（5位）／2022-23 84（2位）／2023-24 89（2位、失点29）／2024-25 74（2位）／2025-26 85（1位、26勝7分5敗、71得点27失点）。2019-20 は途中就任なので並べない。
#
# **入れなかったもの**：家族・私生活、年俸・契約（10/8 の財政の回と重なる）、退場・処分、審判への発言、他の監督との優劣、選手のけがの経緯、女子チーム、Jリーグ、SNS の反応、
#   9/13・10/21・10/24 の回で使った発言とエピソード。ESPN の枠内シュートの数（怪しい）。
# **日本語名・読みで怪しいもの（audio_query で確かめた）**：メリーノ（メ'リイ/ノ'/ガ' と割れる）→ 台本では名前を出さない。ノリッジ（ノ'/リッジ'セン と割れる）→ 名前を出さない。
#   「グアルディオラの下で」はシタデと読む → 「もとで」と書く。アルテタ・サン・セバスティアン・冨安健洋（トミヤスタケヒロ）・エヴァートン・レンジャーズ・ブダペスト・レアル・マドリード・
#   デクラン・ライス・ボーンマス・コミュニティ・シールド・パリ・サンジェルマン・レアル・ソシエダ・マンチェスター・シティ はどれも通った。
