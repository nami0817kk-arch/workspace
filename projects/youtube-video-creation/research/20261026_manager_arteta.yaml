  - text: アルテタの最初のタイトルは、すぐに来ました。
    image: assets/images/20261026_manager_arteta/02_w.jpg
    card: *career_tl
  - text: 就任から8か月の2020年8月。イングランド伝統のカップ戦、FAカップです。
    card:
      <<: *career_tl
      focus: 1
  - text: 決勝でチェルシーに2対1。監督として最初のタイトルでした。
    card:
      <<: *career_tl
      focus: 1
  - text: ところが2021年の夏、開幕から3連敗。勝ち点0、得点0のスタートでした。
