      - ['1934-35の1季', えび茶の横縞。3部への降格が迫っていた]
  - text: 1922年から5季は、白いシャツに襟のまわりが深い赤のVでした。
    card:
      <<: *notred
      highlight_row: 0
  - text: 1934年3月、3部への降格が迫ると、縁起のよい横縞に変えています。
    card:
      <<: *notred
      highlight_row: 1
  - text: 色のせいで負けた、と言われた試合もあります。
    card: none
    image: assets/images/20261010_kit_manutd/pair_fergie/01.jpg
  - text: 1996年4月13日、サウサンプトンに1対3で負けた試合です。
  - text: 前半を終えて3点のビハインド。監督が青と白へ着替えさせます。
  - text: 灰色のシャツはこの日が5回目。前の4試合も、ひとつも勝てていません。
  # 原文（材料 6-①、Sky Sports）:
