  card: &mark_calc
    type: calc
    title: 胸に印があったのは、歴史のどれだけか
    terms:
    - ['55季', 紋章がシャツに付いていた季]
    - ['148年', 1878年から2026年まで]
    - ['37.2%', 歴史に占める割合]
    ops: ['÷', ＝]
  say:
  - text: ここからは、この回で数え直した数字を並べます。
    card: *mark_calc
    image: assets/backgrounds/stadium_マンチェスターユナイテッド.png
  - text: ひとつ目。胸に紋章があった55季を、148年の歴史で割ります。
    card: *mark_calc
  - text: 答えは37.2%。6割を超える年月、印はありませんでした。
    card: *mark_calc
    emph: true
  - text: ふたつ目は、色が動いた回数です。
    card: &colour_count
      type: table
      title: 色が動いた回数（自分で数えた）
      columns: &ccc
      - 時期
      - 長さ
      - 色の動き
      rows: &ccr
      - [ニュートン・ヒース, 24年, 色が5回変わった]
      - [マンチェスター・ユナイテッド, 125季, 赤でなかったのは6季]
  - text: ニュートン・ヒースだった24年で、色は5回変わっています。
    card:
      <<: *colour_count
      highlight_row: 0
  - text: 平均すると、5年と持たずに次の色へ移っています。
    card:
      <<: *colour_count
      highlight_row: 0
  - text: マンチェスター・ユナイテッドになってからの125季で、赤でなかったのは6季。
    card:
      <<: *colour_count
      highlight_row: 1
  - text: 割合にすると4.8%。残りの119季は、ずっと赤です。
    card:
      <<: *colour_count
      highlight_row: 1
    emph: true
  - text: みっつ目。胸と作り手に動いた金を、割ってみます。
    card: &times_calc
      type: calc
      title: 作り手の1年ぶんは、最初の胸の何倍か
      terms:
      - ['9000万ポンド', 2025年からのアディダスの1年]
      - ['10万ポンド', 1982年のシャープの1年]
      - [900倍, 43年でついた差]
      ops: ['÷', ＝]
  - text: いまの作り手は1年9000万ポンド。最初の胸は1年10万ポンドです。
    card: *times_calc
  - text: 割ると900倍。43年のあいだについた差になります。
    card: *times_calc
    emph: true
  - text: その9000万ポンドを、リーグ戦38試合で割ってみます。
    card: &permatch_calc
      type: calc
      title: 作り手の1年ぶんは、1試合いくらか
      terms:
      - ['9000万ポンド', アディダスの1年]
      - ['38試合', リーグ戦]
      - [約237万ポンド, 1試合あたり]
      ops: ['÷', ＝]
  - text: 1試合ぶんにすると、およそ237万ポンドです。
    card: *permatch_calc
    emph: true
  - text: それでも胸にいちばん長くいたのは、いちばん額の小さかった会社でした。
    card: none
  sources:
  - https://www.historicalkits.co.uk/Manchester_United/Manchester_United.htm
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - https://www.sec.gov/Archives/edgar/data/1549107/000110465926110384/manu-20260630x20f.htm
  - http://www.timesonline.co.uk/tol/sport/football/premier_league/manchester_united/article6426463.ece
