    card: none
  - voice: アレックス・ファーガソン
    text: 選手たちは、あの灰色を好まない。
    card: none
  - voice: アレックス・ファーガソン
    text: 顔を上げたとき、離れた味方が見えないそうだ。
    cont: true
  - voice: アレックス・ファーガソン
    text: 縁起をかつぐ話ではない。
    cont: true
