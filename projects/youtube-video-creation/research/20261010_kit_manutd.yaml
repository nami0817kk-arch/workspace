# ユニフォームとエンブレムの歴史 第2回：マンチェスター・ユナイテッド（10/10 公開）。
# 材料の控えは research/raw/20261010_kit_manutd_material.md。**この控えの外へ出ていない。**
# 節の並びは第1回（research/20261009_kit_liverpool.yaml）と同じ型:
#   ①オープニング（一言→題→引き）②エンブレムの年表（main・頭に強い一点・timeline の板・読み上げは5行）
#   ③色の歴史 ④胸スポンサーと用具メーカー（金額の伸びは折れ線）⑤見立て（自分で数えた比べ3つ）
#
# **強い一点は材料 §8 が推した (b)**：1998年から28年変わっていないこの紋章から、
#   「Football Club」の文字が消えている。②の年表の板がそのまま効き、⑥②のウッドワードの言葉に繋がる。
#
# **材料の食い違いの扱い**（§1）:
#   シャツに初めて付いた季は **1972-73** を採り、「1971年とする資料もある」と一行添えた
#   （Historical Football Kits は実際の着用シャツの写真にもとづく）。**1973年説は採らない**。
# **言わないと決めたもの**:
#   **「デイヴィスが赤を選んだ」とは言わない**（§2。赤を選んだ理由も決めた人も、一次に当たる記述が無い）。
#   語りは「1888〜89年ごろから赤と白を使っていて、1902年の改名のときに赤に固まった」までにした。
#   **1998年の意匠がその後変わっていないことは HFK の2015年時点までしか確認できていない**ので、
#   語りは「いまも基本の形は同じ」という言い方にしてある（§5 比べ③の注記）。
#   スナップドラゴンの金額は 20-F に書かれていないので「報道では」を付けた（§4 の注記）。
#   バスビーが「レッド・デビルズ」を採った理由の本人の言葉は見つかっていないので引かない（§6④）。
#
# **ミュンヘンの事故（1958年）はこの回に入れていない。**
#   材料 §1 の決まりは「不死鳥の話は誤り」と「2008年の追悼のユニフォーム」の2行まで、だが、
#   **語りの数字を自動で黄色くする仕組み（AUTO_STRONG）がある**以上、追悼に触れて数字が近くに並ぶ形を
#   作らないほうが安全だと判断した。**犠牲者の数も、事故そのものも、一度も出していない。**
# **女子チームの話は入れていない**（決まり）。
#
# 第1回（リヴァプール）と重ねないようにしたもの（材料 §8 の表のとおり）:
#   「◯年に1回」の形は使わない（あちらが「エンブレムは8.4年に1回」）。こちらは「24年で5回 → 125季で6季」。
#   「1年ぶんを時間に直す」形は使わない（あちらが「日立の1年分は今の7時間18分」）。こちらは**1試合あたり**。
#   胸スポンサーの社数の比べで**リヴァプールを持ち出さない**（あちらが使った比べ）。ユナイテッドの中だけで比べた。
#   更衣室で色が決まる逸話は無いので、**更衣室で色を脱いだ話**（灰色のシャツ）を使った。
#   「イングランド初」も「リヴァプールより3年あと」も言わない（あちらの回を前提にすることになる）。
#   見立ての1行目の言い回しも変えた（あちらは「ここからは、自分で数えた比べを3つ並べます」）。
#   問いの文も変えた（あちらは「どうやっていまの形になったのか」）。
#
# **プレミア20クラブ紹介 ⑯（2026-09-24 公開）と重ねない**:
#   あちらが読み上げたのは「創立1878年・鉄道の操車場・ニュートン・ヒース」「愛称はレッド・デビルズ」
#   「1902年1月、2670ポンドの借金で解散の命令」「実業家4人が500ポンドずつ出資」。
#   **借金の額・解散命令・4人の出資・操車場という言い方は、この回では一度も使っていない。**
#   1878年と親会社の鉄道会社は、緑と金の由来として必要なので1行だけ触れている。
#
# アルファベットは読み上げに出さない（§8）。
#   「Football Club」→「フットボール・クラブ」、AIG →「エーアイジー」、FA →「イングランドサッカー協会」は
#   罰金の行で「クラブは1万ポンドの罰金」と主語を変えて回避した。20-F・LUHG は読まない（板にも出さない）。
# ネットの反応は入れない（シリーズの回。ブラウザの道具を使っていないので集めていない）→ voice_min: 0。
#
# 写真は手元の2枚＋取材で取った1枚。入れ替えは2回:
#   ②③＝オールド・トラッフォードの中（手元） → 灰色のシャツの逸話＝ファーガソン（左）＋本拠地（右）の1枚
#   （2026-09-25「別の人がその人について語るときは、その人も画面に出す」。縦写真1枚は置けないので
#   tools/pairphoto.py で横に並べた） → ④⑤＝本拠地の外観（手元）。
#   ファーガソンは Commons に2013年の1枚しか無く、顔の検出も効かなかったので facecrop ではなく pairphoto で組んだ。
# サムネは構図 scene（横に広い1920x1080、クラブ名入り、答えは ●● で伏せた）。
#   同じ日のもう1本（記録の解説・代表の最多出場）は number なので、2本で構図を変えてある。
