  question: マンチェスター・ユナイテッドの胸にある印は、何が変わって何が残ったのか
  lead: 胸の真ん中にいる、三叉の槍を持った赤い悪魔。
  hook: 変わらなくなった、その始まりに何があったのかを見ます。
  takeaway: マンチェスター・ユナイテッドの紋章は1998年の作り直しから形が変わっていない。その作り直しで、帯から「Football Club」の2語が消えた。2013年にエド・ウッドワードが戻す意向を語ったが、2026年のシャツにも文字は無い。創立の1878年は白いシャツに青い紐で、1881年は親会社だった鉄道会社の色の緑と金、1888年ごろに赤と白、1892年にまた緑と金へ戻り、1902年の改名で赤に落ち着いた。赤を選んだ理由と決めた人は、どの資料にも書かれていない。胸スポンサーは1982年のシャープが最初で5年50万ポンド、いまのスナップドラゴンは報道で年6000万ポンド超。用具のアディダスは2035年6月まで、通算の最低保証が16億5000万ポンドで、チャンピオンズリーグに出ない年は年1000万ポンド減り、プレミアリーグにいない年は半分になる。自分で数えると、148年のうち胸に印があったのは55季で37.2%。ニュートン・ヒースだった24年で色は5回変わったが、そのあとの125季で赤でなかったのは6季だけで4.8%。アディダスの年9000万ポンドは1982年のシャープの年10万ポンドの900倍で、リーグ戦38試合で割ると1試合およそ237万ポンドになる
  opening_image: assets/backgrounds/stadium_マンチェスターユナイテッド_in.png
