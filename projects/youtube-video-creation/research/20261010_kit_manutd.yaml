  say:
  - text: 1878年に生まれたニュートン・ヒース。色は赤ではなく、白と青でした。
    card:
      <<: *colour_board
      highlight_row: 0
  - text: 1881年には緑と金のシャツを買います。親会社だった鉄道会社の色でした。
    card:
      <<: *colour_board
      highlight_row: 1
  - text: 赤と白が出てくるのは1888年か89年ごろ。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: ところが1892年に1部へ入ると、緑と金に戻します。
    card:
      <<: *colour_board
      highlight_row: 3
  - text: 1902年に名前がマンチェスター・ユナイテッドへ変わり、赤に決まります。
    card:
      <<: *colour_board
      highlight_row: 5
    emph: true
  - text: 赤を選んだ理由も、決めた人の名前も、どの資料にも残っていません。
    card: *colour_board
  - text: そのあとの125季で、ホームが赤でなかったのは2つの時期だけです。
    card: &notred
      type: table
      title: ホームが赤でなかった季
      columns: &nrc
