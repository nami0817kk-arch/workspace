      highlight: '2000'
  - text: 2006年からは保険のエーアイジー。4年で5650万ポンド。
    card:
      <<: *money_line
      highlight: '2006'
  - text: 2010年からは再保険のエーオン。4年で8000万ポンド、当時の最高額です。
    card:
      <<: *money_line
      highlight: '2010'
  - text: 2021年からはソフトの会社、チームビューアー。5年で2億3500万ポンド。
    card:
