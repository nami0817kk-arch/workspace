  # **ショートの16秒に間に合わせるため、言葉を山場の頭に置いた**（`_check_quote_timing`）。
  # 強い一点（28年変わっていない／Football Club が消えた）は、言葉のすぐ後ろの2行で言い切る
  - text: 紋章は1998年から28年そのまま。その文字について、こう言った人がいます。
    image: assets/backgrounds/stadium_マンチェスターユナイテッド_in.png
    card:
      <<: *crest_board
      highlight_row: 5
    emph: true
  # 原文（材料 6-②、Inside World Football 2013-07-23）:
  #   "We are a football club. We are not a business. The way I described it to the staff was
  #    'we are a 135-year-old club and that's what you have to remember.'"
  - voice: エド・ウッドワード
    text: 我々はフットボール・クラブだ。企業ではない。
    card: none
  - voice: エド・ウッドワード
    text: 職員にはこう説明した。創立135年のクラブなんだ、と。
    cont: true
    emph: true
  - text: エド・ウッドワード。2013年にクラブの経営を預かった人です。
    card: *crest_board
  - text: 真ん中の赤い悪魔は1970年から。帯のフットボール・クラブは消えています。
    card:
      <<: *crest_board
      highlight_row: 5
  - text: 消したのは1998年の作り直し。戻すと言われたまま、いまも文字はありません。
    card:
      <<: *crest_board
      highlight_row: 5
  - text: シャツに紋章が付いたのは1972-73シーズン。1971年とする資料もあります。
    card:
      <<: *crest_board
      highlight_row: 3
