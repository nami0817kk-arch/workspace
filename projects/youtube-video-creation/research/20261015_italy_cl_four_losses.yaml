# 試合結果 の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。出典は原文を読んだもの。
#  - 題材の元: フットボールチャンネル 2026-10-15「イタリア勢が第2節で4戦全敗の歴史的屈辱…」。
#    本文は「TUTTOmercatoWEB が（ローマ戦の前に）『過去に例のない事態だ』として、イタリアからCLに4クラブ以上が出場するように
#    なって以降、同じ節で4クラブすべてが敗れたことは一度もないと指摘していた」と書く。
#  - 「前例がない」の一次確認: UEFA 公式の統計までは辿れなかった（UEFA 公式は当たっていない）。TUTTOmercatoWEB の原文も検索で見つからなかった。
#    代わりにガゼッタ・デロ・スポルト 2026-10-14（4クラブ全敗の記事、本文を requests で読んだ）が
#    「Non era mai successo che le squadre italiane cadessero tutte nello stesso turno di Champions League」と書く。
#    → 台本では「これまで一度も起きていなかったと伝えられています」と報道止まり。確度は 報道。
#  - 自分で数えた比べ（見立て）: ESPN の試合記録（scoreboard API を日付ごとに引いた）で、2018-19〜2025-26 の8シーズン、
#    イタリア勢が4クラブ（2024-25 は5クラブ）出た 52 の節を数えた。全クラブが負けた節は 0。いちばん多かったのは
#    4クラブ中3クラブの敗戦で3回（2018-19 第6節・2021-22 第6節・2022-23 第6節）。今季第2節が 4クラブ中4クラブ。
#    節＝試合の日が2日以内に続くまとまりで切った。UEFA 公式の統計ではなく ESPN の記録から自分で数えたもの。それ以前（2017-18 まで）は数えていない。
#  - 試合の事実は ESPN の試合記録（summary API）で確かめた:
#      インテル 3-4 クラブ・ブルッヘ（サン・シーロ、10/13）／ビジャレアル 3-1 ナポリ（エスタディオ・デ・ラ・セラミカ、10/13）
#      ローマ 3-4 レアル・マドリード（オリンピコ、10/14）／フェイエノールト 3-2 コモ（デ・カイプ、10/14）
#    先制: ナポリ8分（ラフマニ）、コモ18分（ディアオ）、ローマ20分（デ・ローン）。インテルは一度もリードしていない。
#    ローマは3-1（57分）から、83分・85分・90分に失点。ガゼッタは「82分まで夢のようだった、そのあと8分間のブラックアウト」と書く。
#    ESPN の得点時間では83〜90分なので、台本では時間を言わず「終盤の3失点」にした。
#  - 第1節（フットボールチャンネル本文）: インテル 1-2 R・マドリード、ナポリ 0-1 アーセナル、ローマ 1-1 フェネルバフチェ、コモ 4-1 ライプツィヒ。開幕2節の合計 1勝1分6敗。
#    ESPN の第1節の記録（9/8〜9/10）で4試合とも一致を確認。
#  - 順位（ESPN standings、36クラブ）: コモ12位・勝ち点3、ローマ25位・勝ち点1、インテル29位・勝ち点0、ナポリ32位・勝ち点0。
#  - 第3節（ESPN scoreboard）: 現地20日 ナポリ-ボデ/グリムト、ローマ-スロヴァン・ブラチスラヴァ、21日 コモ-マンチェスターU、インテル-シャフタール（4クラブとも自分のホーム）。
#  - 監督の言葉（イタリア語の原文から日本語に。切らずに文として完結している部分だけ使った）:
#      アッレグリ（ナポリ）: ガゼッタ 10/14 の記事に引用。"Il livello della Champions è più alto. Quando giochi con le squadre medio-piccole non te ne accorgi, ma quando giochi in Champions te ne accorgi"
#      ガスペリーニ（ローマ）: ガゼッタ 10/14 "Ci siamo piantati sul traguardo nel modo meno previsto" / "Non stavamo soffrendo invece nel finale ci siamo come paralizzati dalla situazione"
#      ファブレガス（コモ）: ガゼッタ 10/14 "Sparate a me, non ai ragazzi" / "Se c'è un errore, è sempre tutto mio"
#    インテルのキヴ監督の言葉は 10/14 のブルッヘ戦の回で使ったので、今回は使わない。
#  - 読めなかったもの: UEFA 公式、TUTTOmercatoWEB の原文、france24（403）。X・Reddit・Bluesky は普通のUAの requests では読めない。
#  - ネットの反応: 実在の投稿が取れなかった。作らない → 反応の節は置かない。
