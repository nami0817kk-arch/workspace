takeaway: "チャンピオンズリーグ第2節で、イタリアの4クラブ（インテル・ナポリ・ローマ・コモ）がすべて負けた。9点を取って14点を取られ、先に点を取ったナポリ（8分）・コモ（18分）・ローマ（20分）は全部逆転された。同じ節で全部が負けたのは初めてだと伝えられた。自分で数えると、2018-19シーズンから昨季までの52の節で全部が負けた節は0回、最多は4クラブ中3クラブの3回。開幕2節の成績は1勝1分6敗、勝ち点4。第3節は現地20日と21日、4クラブとも自分のホーム"

answer: 先に点を取ったナポリ、コモ、ローマの3クラブが、終盤までに全部ひっくり返された。インテルは一度もリードしていない
watch: 現地20日と21日の第3節。4クラブとも自分のホームで、勝ち点を取れるか

