# 取材メモ（9/30 昼の題材 2）。UEFAネーションズリーグ A3 第2節 スペイン 4-1 クロアチア（9/29・セビージャ、サンチェス・ピスフアン）。
# 事実の裏:
#   得点: 2分（70秒）ヤマル／28分 ベーリョ（ペリシッチのクロスを頭）／31分 プビル（ヤマルのクロス）／63分 ヤマル（ペドリのスルーパス、角度のない所からニア）／89分 ニコ・ウィリアムズ。
#     時刻はゲキサカ・フットボールチャンネル（Yahoo!）・Al Jazeera（Reuters）で一致。ESPN はアシストを30分、RFEF は4点目を88分と書く。台本は31分・「終了間際」。
#   先制までのパス24本、相手に一度も触らせず（ゲキサカ）。ヤマルは68分にニコ・ウィリアムズと交代（RFEF の先発表・フットボールチャンネル）。
#   ウェンブリー（9/26 イングランド 2-3 スペイン）の先制は104秒、この日は70秒。「2試合続けて最初の2分で得点は初めて」（RFEF のクロニカ）。
#   40試合無敗: 365Scores の一覧（31勝9分、最後の負けは 2024-03-22 コロンビア 0-1）。年ごと: 2024 16試合14勝2分／2025 10試合6勝4分／2026 14試合11勝3分。
#     2025 NL 決勝ポルトガル 2-2（PK負け）は記録上は引き分け（elespanol・365Scores）。前の最長はイタリアの37（2018〜21、elespanol）。W杯決勝で38に（elespanol）。
#     W杯は初戦カーボベルデ 0-0、そこから7連勝で優勝（365Scores の一覧）。
#   ヤマルの代表の数字: RFEF の選手ページ（9/29 の試合まで）35試合10得点、27勝7分（負けは 2024-03-22 コロンビア戦の1つ）。
#     9月の2試合で3得点1アシスト（ウェンブリー1点、この日2点1アシスト）→ それまでの33試合で7点。
#     DAZN の「34試合8得点12アシスト」は内訳の合計が33試合で合わず、W杯の試合数も RFEF（8試合）と違うので使わない。通算アシストは言わない。
#   次: 10/3（土）オビエドでチェコ戦（RFEF のクロニカ）。
#   モドリッチへの拍手（MARCA「la ovación a Modric al entrar」）は題（ヤマル・40戦無敗）に答えないので入れない。「ありがとう、スペイン」は確かめられていない。
#   監督の言葉: ESPN の英語（試合後）。RFEF の会見記事のスペイン語（"pone su talento individual al grupo"）とは言い回しが違う。台本は ESPN のほうを訳した。
#   ヤマルの言葉: MARCA（lamine-yamal-muesca-balon-oro）"Otra más" / "Al final no solo juego para este Balón de Oro, juego para mí, para la afición,
#     para la siguiente temporada, para mi selección, para seguir ganando" / "No lo sé, no voto yo, ni sé quién ha ganado"。投票は締め切り済み（MARCA）。発表は10/26。
#   10/2 の有名選手の紹介②（scripts/20261002_player_937958.md）と重ねない: メッシの赤ん坊の写真・304・10番・ユーロ最年少・市場価値・レーダー・
#     「世界最高の選手は僕たち2人」・「世界年間最優秀選手、バロンドールの発表は10月26日」の言い方は使わない。写真も紹介の回と別の File。
# 写真: 記事（ESPN・MARCA・Yahoo!の5本）は全部 Getty か合成画像、RFEF の記事の写真はプビルたちでヤマルが写っていないので、Commons の W杯の2枚（紹介の回と別）。
#   01: Argentina v Spain 19 July 2026-144（赤のユニフォーム）、02: France v Spain 7.24.26-092（白、走る）。どちらも 3:2 を頭が入る位置で16:9に切った _w。
# 反応: Yahoo!ニュースのコメント欄（theWORLD・フットボールチャンネルの記事）から、個人の投稿を頭から終わりまで3件。
