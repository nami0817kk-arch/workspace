- id: ballon
  main: true
  heading: バロンドールを聞かれて
  tier: 報道
  telop: ヤマル「もう1つ」。投票はもう締め切られている
  narrator: キャスター
  say:
  - text: 9月29日、スペインはクロアチアに4対1で勝ちました。
    short_only: true
  - text: 年間の最優秀選手に贈られるバロンドール。今年の投票は、もう締め切られています。
    image: assets/images/20260930b_yamal_spain/01_w.jpg
  - text: 試合後、この活躍でバロンドールにふさわしい理由が増えたかと聞かれ、ヤマルは間を置かずに答えました。
  - voice: ヤマル
    text: もう1つ
  - text: 受賞に近づいたかと聞かれると、こう答えています。
  - voice: ヤマル
    text: 分からない。
  - voice: ヤマル
    text: 投票するのは僕じゃないし、誰が獲ったかも知らない
    cont: true
  - text: 結果が出るのは10月26日です。取材の中では、こうも話しています。
  - voice: ヤマル
    text: このバロンドールのためだけにプレーしているわけじゃない。
  - voice: ヤマル
    text: 自分のため、ファンのため、来季のため、
    cont: true
  - voice: ヤマル
    text: 代表のため、勝ち続けるためにやっている
    cont: true
