# グラスナーの言葉（Sky Sports への発言。尺に収まらず台本では使っていない）: "But it's another defeat and another game when we couldn't score at the City Ground."
# 次の試合: アーセナル 対 バイエルン・ミュンヘン、CL、現地2026-10-21 19:00 UTC（ESPN scoreboard uefa.champions 20261021）。アルテタは会見で『3日後』と言及。
