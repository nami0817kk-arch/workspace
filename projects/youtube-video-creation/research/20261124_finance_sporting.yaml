# クラブの財政：スポルティング（11/24 火、シリーズ「クラブの財政」、key: finance_sporting、型は news）。
# 題材：2025-26（2026年6月期）の決算が 2026-09-22 に公表。リヨン・ラツィオと軸を分け、「黒字なのに資産の約9割が負債」。ポルトガル1部（ベンフィカは 10/28 に済み）。picks・posted・scripts に既出無し。
# ★確かめられなかったこと（重要）：クラブの決算書・CMVM（証券監督当局）の提出文書の本文は読めなかった（sporting.pt は Cloudflare、CMVM は動的）。
#   数字は A Bola（2026-09-22）・RTP/Lusa・The Portugal Post が一致して伝える連結の数字：売上300・売買を除く収入187.7(+27%)・純利益34.7(前20、+74%)・営業の利益50.7(+12%)・資本75.6(+85%)・総資産726.9・負債651.3・買い入れ120.7(+62%)・売却117.2・欧州の大会80.3・法人席10.9・社債225(2025-10、5.75%、28年)。
#   台本は「報道」の確度。公開前に CMVM／クラブの Relatório e Contas 2025/26 で突き合わせることを勧める。
#   使わなかった数：EBITDA116（1社のみ）・前の年の総資産/負債（％からの逆算）・個々の選手の移籍金（記事で食い違い）。ギェケレシュのアーセナル移籍は名前と行き先だけ。法人席の+35%（1社のみ）。
# ★言わないこと：オーナー・個人名、女子チーム、賭け。日本との接点：無し。
# 自分で計算した数（検算済み）
#   純利益÷売上 34.7÷300=11.6%／営業の利益÷売上 50.7÷300=16.9%／売買を除く収入÷売上 187.7÷300=62.6%／欧州の大会÷売上 80.3÷300=26.8%
#   負債÷総資産 651.3÷726.9=89.6%／資本÷総資産 75.6÷726.9=10.4%／負債÷資本 651.3÷75.6=8.6倍／資本＋負債 75.6+651.3=726.9 ✓
#   社債 225×5.75%=12.94／12.94÷34.7=37.3%／225÷651.3=34.5%／買い入れ−売却 120.7−117.2=3.5／5年の黒字 約117
