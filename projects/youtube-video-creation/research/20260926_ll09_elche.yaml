- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 位置取りで握る。南米から補強。年間シートのスタンド
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
