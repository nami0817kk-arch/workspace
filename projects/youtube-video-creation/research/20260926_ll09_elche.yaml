    - - 運営の型
      - 南米から補強、6人
    - - クラブの気質
      - 8割超が年間シート
  say:
  - text: アンセルミ監督は、位置取りでボールを握るサッカー。自分たちから攻めに出ます。
    image: assets/photos/ll/elche/elche_manager_c06b49c5.jpg
  - 運営の型は、南米からの補強。登録選手の**6人**が、アルゼンチン国籍です。
  - 年間シートは**2万7000**席を超え、席の**8割**以上を占めます。
  - ホームの試合前には、スタンドで歌「アロマス・イリシタノス」を歌います。
  sources:
  - https://en.wikipedia.org/wiki/Elche_CF
