# ラ・リーガ20クラブ紹介 ⑨エルチェ（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/elche*.json と旧台本 -
# 2026-10-08 に出すために直した（⑧デポルティーボと同じ直し方）:
#   ・今季の数字を 10/08 の実測に合わせた（CLUB_LEAGUE=laliga python tools/llresults.py と
#     ESPN の standings。7試合1勝2分4敗・勝ち点5・18位・得点11・失点17。代表ウィークで第8節は未消化）
#   ・「今季のここまで」を見立ての節にした（自分で数えた1試合あたりの表＋計算の板）
#   ・冒頭を「いちばん強い一点」（7試合で17失点＝リーグで2番目に多い）から始め、
#     基礎DATAの読み上げを9行→5行に減らした（残りの板は出さない）
#   ・監督の言葉を基礎DATAから「今季の監督」の節へ移した（2026-10-06 の決まり）
#   ・監督の写真を代理店（Lusa）の Commons 写真から、クラブ公式の記事写真に差し替えた
# 為替: 1ユーロ＝176.85円（frankfurter.app / ECB 参照相場、2026-10-07）。
#   1220万ユーロ × 176.85 = 約21億5757万円 → 「21億円を超える」と読み上げる
