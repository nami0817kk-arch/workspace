  narrator: キャスター
  say:
  - text: アンセルミ監督のエルチェは、**7試合**で**17失点**。
    image: assets/stats/ll_elche_data_r1.png
    no_telop: true
    emph: true
  - text: ラシン・サンタンデールに次ぐ、リーグで2番目に多い数です。
    image: assets/stats/ll_elche_data_r1.png
    no_telop: true
  - text: その監督は、記者の学校を出た異色の人です。
    image: assets/stats/ll_elche_data_r1.png
    no_telop: true
  - text: 今季ただ1つの勝ちは、退場者が出て**10人**で戦った試合。**3対1**でした。
    image: assets/stats/ll_elche_data_r2.png
    no_telop: true
  - text: そして**2015年**、13位で1部に残ったはずが、2部に回されました。
    image: assets/stats/ll_elche_data_r3.png
    no_telop: true
  - text: 理由は借金。スペインで初めての例でした。
    image: assets/stats/ll_elche_data_r3.png
    no_telop: true
  - image: assets/stats/ll_elche_data0.png
    text: 創立は**1923年**。町のクラブの代表が、花火師の作業場に集まって作りました。
    no_telop: true
  - image: assets/stats/ll_elche_data1.png
    text: 愛称は「フランヒベルデス」。世界遺産のヤシ林と同じ、胸の緑の帯から。
    no_telop: true
  - image: assets/backgrounds/stadium_エルチェ.png
    text: 本拠地はマルティネス・バレーロ。クラブの発表では**3万1388人**。
  - image: assets/stats/ll_elche_cups.png
    text: 1部も、国王杯も、ヨーロッパも。優勝はまだ**1度**もありません。
    no_telop: true
  - image: assets/stats/ll_elche_data6.png
    text: 最多出場はニーノ。**461試合**で**135得点**。どちらもクラブ最多です。
    no_telop: true
