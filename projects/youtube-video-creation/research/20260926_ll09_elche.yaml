  main: true
  tier: 背景
  telop: 記者の学校を出た監督と、10人で挙げた初勝利
  narrator: キャスター
  say:
  - text: 率いるのはアンセルミ監督。記者の学校を出た人です。
    image: assets/stats/ll_elche_data_r1.png
    no_telop: true
  - text: 今季ただ一つの勝利は、ほぼ**10人**で挙げたもの。監督はこう話します。
    image: assets/stats/ll_elche_data_r2.png
    no_telop: true
  - voice: マルティン・アンセルミ
    text: リーグの初勝利は、エルチェらしい形で来るしかなかった
    image: assets/stats/ll_elche_data_r2.png
  - text: そして13位で落ちた理由は、借金。スペインで初めての例でした。
    image: assets/stats/ll_elche_data_r3.png
    no_telop: true
  - image: assets/stats/ll_elche_data0.png
    text: 創立は**1923年**。町のクラブの代表が、花火師の作業場に集まって作りました。
    no_telop: true
  - image: assets/stats/ll_elche_data1.png
    text: 愛称は「フランヒベルデス」。白いシャツに通した、緑の帯から来ています。
    no_telop: true
  - image: assets/stats/ll_elche_data2.png
    text: ホームタウンはエルチェ。ヤシの林は世界遺産で、胸の緑はその色だと伝わります。
    no_telop: true
  - image: assets/backgrounds/stadium_エルチェ.png
    text: 本拠地はマルティネス・バレーロ。クラブの発表では、**3万1388人**が入ります。
  - image: assets/stats/ll_elche_data4.png
    text: オーナーは**2019年**から、アルゼンチンのブラガルニク。元はレンタルビデオ店の店主です。
    no_telop: true
  - image: assets/stats/ll_elche_cups.png
    text: 1部、国王杯、スーペルコパ、ヨーロッパ。優勝はどれも、まだありません。
    no_telop: true
  - image: assets/stats/ll_elche_data6.png
    text: 最多出場はフォワードのニーノ。**461試合**に出て、**135点**もクラブ最多です。
    no_telop: true
  - image: assets/stats/ll_elche_data7.png
    text: 直近のタイトルは**2013年**の2部優勝。開幕から最終節まで、首位のままでした。
    no_telop: true
  - image: assets/stats/ll_elche_data8.png
    text: 昨季のリーグ戦は**15位**。勝ち点**43**で、1部に残りました。
    no_telop: true
