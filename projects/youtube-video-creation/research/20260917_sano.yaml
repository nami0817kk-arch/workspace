sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: PSVの佐野航大が、落選と4年後について語った
    narrator: キャスター
    say:
      - PSVの佐野航大が、現地のインタビューで口を開きました。
      - 話したのは、今夏のメンバーから外れたことについてです。
      - そして、4年後に見ているものについて。
      - 兄の佐野海舟は、あのとき選ばれていました。
      - ナイメヘンで一緒だった小川航基と塩貝健人も、メンバーに入っています。
      - そのなかで、航大は外れていました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012779/
      - https://football-tribe.com/japan/2026/09/16/359332/

  - id: said
    heading: 本人が語ったこと
    main: true
    tier: 報道
    telop: 「怒ってはいませんでした。監督の決断であって、僕の決断ではないので」
    narrator: 解説
    say:
      - 落ちたときのことです。
      - {voice: 佐野航大, text: 正直に言うと、本当に落ち込んだのは短い時間だけでした}
      - {voice: 佐野航大, text: 怒ってはいませんでした。監督の決断であって、僕の決断ではないので}
      - そして、4年後についてです。
      - {voice: 佐野航大, text: 4年後には、兄と一緒に日本代表の中盤でW杯に立ちたいです。佐野と佐野}
      - {voice: 佐野航大, text: 今はそのために努力しています}
      - チャンピオンズリーグの組み合わせについても話しています。
      - {voice: 佐野航大, text: 抽選結果を見たとき、いろいろな感情が湧きました}
      - {voice: 佐野航大, text: サンティアゴ・ベルナベウでプレーするなんて、正直まだ想像できません}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012779/

  - id: brothers
    heading: 兄と弟
    tier: 背景
    telop: 兄・海舟はマインツ。2025年6月に代表で並んだ
    narrator: キャスター
    card:
      type: table
      title: 佐野の兄弟
      columns: ["", ""]
      rows:
        - ["佐野海舟（兄）", "マインツ／ブンデスリーガ"]
        - ["佐野航大（弟）", "PSV／22歳"]
        - ["2025年6月", "W杯アジア予選で代表に同時選出"]
        - ["海舟の昨季", "2季連続で全試合先発"]
    say:
      - 兄の佐野海舟は、ドイツのマインツでプレーしています。
      - 中盤の選手で、昨季は**2シーズン続けて全試合に先発**しました。
      - 今季も開幕から3試合続けてスタメンです。
      - 二人がそろって日本代表に選ばれたことは、一度あります。
      - 2025年6月、ワールドカップのアジア予選でした。
      - "**双子ではありません。**海舟が兄、航大が弟です。"
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/11/post1009263/
      - https://web.gekisaka.jp/news/japan/detail/?430195-430195-fl

  - id: psv
    heading: いまのPSVでの佐野航大
    tier: 報道
    telop: 今夏に加入。9月13日に移籍後初ゴール
    narrator: 解説
    card:
      type: table
      title: PSVでの佐野航大
      columns: ["", ""]
      rows:
        - ["加入", "今夏、ナイメヘンから"]
        - ["契約", "2031年まで"]
        - ["9月13日", "ミドルシュートで移籍後初ゴール"]
        - ["CL初戦", "地元紙がチーム最高の採点"]
    say:
      - 航大がPSVへ移ったのは、今年の夏です。ナイメヘンからでした。
      - 契約は2031年まで。加入してすぐ、レギュラーに定着しています。
      - "9月13日のリーグ戦では、ミドルシュートから**移籍後初ゴール**を決めました。"
      - チャンピオンズリーグの初戦、シャフタール・ドネツク戦にも出ています。
      - オランダの地元紙は、この試合で**チームで単独最高の採点**をつけました。
      - 9月と10月の代表について、招集が予想されるという報道は出ています。
      - "ただし、**まだ発表されたわけではありません。**"
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/11/post1009263/
      - https://football-tribe.com/japan/2026/09/16/359332/

