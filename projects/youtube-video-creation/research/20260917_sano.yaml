# 佐野航大「日本の中盤に佐野と佐野で立ちたい」（2026-09-17）
#
# **双子ではない。**海舟が兄、航大が弟。取材で確かめた。
# ただし**正確な年齢差を明記した出典が取れなかった**ので、
# 「兄と弟」とだけ言い、年齢差には触れない。
#
# **代表招集は決まっていない。**football-tribe が「9月・10月の国際Aマッチデーで
# 招集が予想されている」と書いているだけ。**「選ばれた」と書かない。**
#
# **訳が2つある。**footballchannel「佐野と佐野」／football-tribe「サノとサノだ」。
# **footballchannel に統一する。**
#
# 引きは**「落ちたときの言葉」**。W杯メンバー落選について本人が語っている。
# ここが山場（@main）。兄弟の対決の話（9/13〜14）は繰り返さない。
