# フランク・ランパード（元イングランド代表MF、チェルシー13シーズン。現コヴェントリー・シティ監督）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-26 用。9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Frank Lampard の成績表・本文・Honours、2012 UEFA Champions League final、2012 FIFA Club World Cup）と自分で足した・割った値だけ。
# **私生活・法的な問題・論争は入れない**（結婚・家族・母の死・Ayia Napa の件・NYCFC の契約騒動・運転中の携帯の件は台本に出さない）。
# **重なりの確認（2026-11-13）**：scripts/・covered.yaml・posted.json・research/2026111*_picks.txt を「ランパード／Lampard」で grep。主役の回は無し（坂元達裕の回に「ランパード監督」が出るだけ。ロナウジーニョ・カシージャスの回に名前が出るだけ）。同じ日（11/26）の別シリーズに同名なし。
# **引退の確認**：Wikipedia「Lampard announced his retirement on 2 February 2017」→ 現役ではない（48歳）。いまは Coventry City のヘッドコーチ（2025-26 Championship 優勝・2026-11-06 時点の戦績の記載あり）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：ウェストハム 187試合39ゴール、チェルシー 648試合211ゴール（Total 行）、マンチェスター・シティ 38試合8ゴール、ニューヨーク・シティ 31試合15ゴール。イングランド代表 106試合29ゴール。サムネの表：チェルシー648/211＋イングランド代表106/29＝754試合240点（自分で足した値。ほかのクラブは除く）。
# - チェルシーのシーズン別ゴール（全大会）：01-02 7、02-03 8、03-04 15、04-05 19、05-06 20、06-07 21、07-08 20、08-09 20、09-10 27、10-11 13、11-12 16、12-13 17、13-14 8（合計211と一致）。期間ごと：01-02〜04-05＝49（÷4＝12.3）、05-06〜09-10＝108（÷5＝21.6）、10-11〜13-14＝54（÷4＝13.5）。108÷211＝51%。ほかの8年＝49＋54＝103（÷8＝12.9）、21.6÷12.9＝1.68。本文「fourth consecutive season he scored 20 or more goals」（08-09）・「fifth-consecutive season」（09-10）と一致。
# - プレミア通算177ゴール（中盤で歴代最多、本文）。最初の100ゴールのうち18点がPK（本文、2008-11-02の100点目の段）。プレミア10ゴール以上を9シーズン連続は2012-02-25時点で唯一（本文）。2005年のバロンドール・FIFA年間最優秀選手はともに2位（ロナウジーニョ）。2013-05-11 アストン・ヴィラ戦の2ゴールでタンブリングの記録を超えクラブ歴代最多に（本文）。移籍金1,100万ポンド（本文）。タイトル：プレミア2004-05・2005-06・2009-10、CL 2011-12、EL 2012-13。
# - 日本：2012 FIFA Club World Cup（日本開催）。2012-12-13 準決勝 横浜（日産スタジアム）モンテレイ1-3チェルシー、2012-12-16 決勝 横浜国際総合競技場 コリンチャンス1-0チェルシー（ゲレロ69分、観客68,275）。ランパードは「After six weeks out injured, on 16 December Lampard appeared in the final」（本文）。**準決勝に出たかは確かめていないので台本に書かない。**
# - 2012-05-19 CL決勝（アリアンツ・アレーナ）：ミュラー83分、ドログバ88分（コーナーからのヘディング）、延長でロッベンのPKをチェフが止める、PK戦 4-3。チェルシーのPKはマタ（止められる）→ダビド・ルイス→ランパード（ゴール中央・高め）→コール→ドログバ。テリーは準決勝の退場で出場停止、ランパードが主将（本文）。ロンドンのクラブ初のCL優勝。
# - 監督歴：ダービー 2018-05-31（昇格プレーオフ決勝でヴィラに敗れる）、チェルシー 2019-07-04〜2021-01-25（1年目リーグ4位・FAカップ決勝）、エバートン 2022-01-31〜2023-01-23、コヴェントリー 2024〜（2025-26 Championship 優勝）。
# **本人の言葉**：取れていない。声の行は置かない。
# **入れなかったもの**：私生活・家族・母の死、論争（ホテルの件・NYCFC の件・運転中の携帯）、2006年W杯のPK失敗、ゴールラインの誤審（2010年W杯のドイツ戦）、サウスゲートの比較評価、監督解任の経緯（移籍方針の対立）、エバートンの降格争いの詳細。
# **読みで怪しいもの**：フランク・ランパード、ウェストハム、モンテレイ、コリンチャンス、ゲレロ、ミュラー、ドログバ、チェフ、ダビド・ルイス、テリー、タンブリング、アストン・ヴィラ、コヴェントリー、ダービー・カウンティ、エバートン、ロナウジーニョ、ヨーロッパリーグ。
