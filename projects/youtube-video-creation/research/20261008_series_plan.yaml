title: シリーズの整理（10月8日）
lead: 実測で測り直しました。番号に○×を付けてください
note: '<b>測って分かったこといちばんの3つ。</b><br>① 本編の視聴時間1,606時間のうち、シリーズは<b>247時間＝15.4%</b>。残り84.6%はニュースで、しかも<b>久保の結婚の1本だけで623時間（全体の38.8%）</b>。9/28 に決めた「視聴時間の柱はシリーズ」は、合計ではまだ達成していません。<br>② <b>ただし1本あたりはシリーズが勝っています。</b>同じ時期に出した本で比べると、1本の視聴時間の中央値はシリーズ133分・ニュース113分。尺が2倍あるので、途中で離れる人が多くても1本あたりでは上。足りないのは<b>配られる量</b>（再生の中央値 154 対 251）。<br>③ 本編293本のうちシリーズは<b>50本＝17%</b>。決めた組み方（1日10本中6本＝60%）に遠く届いていません。原因は、<b>いちばん軽い3つ（週報・順位表・次の相手。どれも道具があって67〜316行で作れる）が1本も出ていない</b>のに、いちばん重い型（道具なし・500〜900行）を毎日作っていることです。<br><b>訂正</b>：最初に「プレミアの再生リストが無い」と書きましたが、<b>ありました</b>（20本入り）。手元の控えに記録されていなかっただけで、足しました。<br><br>測れなかったもの：若手の数字・数字で見るランキング・記録の3つは数字が1つもありません。1本しか出していないシリーズが10個あり、その中央値は当たり外れそのものなので言い切れません。'
items:
- num: 1
  slot: 案A（推し）
  fmt: 出し切る
  head: ラ・リーガ紹介⑩〜⑳の11本を、1日1本で10月19日までに出し切る
  why: 台本は20本すべて書き終わっているのに、投稿は⑨まで。作る手間はほぼゼロで、残り11本ぶんの視聴時間がそのまま積める
  src: 実測（台本20本・投稿9本）
- num: 2
  slot: 案A（推し）
  fmt: 埋める
  head: 欧州組の1週間（月曜）と5大リーグの順位表（火曜）を、今週から必ず出す
  why: どちらも道具があり、台本も作ってあるのに投稿0本。数字を取ってくるだけなので、いちばん軽い2つ
  src: tools/japan_abroad.py・tools/standings_week.py
- num: 3
  slot: 案A（推し）
  fmt: 埋める
  head: 日本人の次の相手（10/9）と欧州カップの相手紹介（10/12）を、予定どおり出す
  why: リーグ戦が10〜12日に再開する。道具があり、試合の前に出す意味もある
  src: tools/next_opponent.py
- num: 4
  slot: 案A（推し）
  fmt: 統合
  head: これから出す回のシリーズ名を「記録の解説」にそろえる
  why: 「記録」と「記録の解説」で名前が揺れている。名前をそろえないと、新しい回がどちらに入るか決まらない
  src: 取材メモの series
- num: 5
  slot: 案A（推し）
  fmt: 休む
  head: スタジアム紹介・若手の数字・序列の理由・同じ年齢での比較は、10月は休む
  why: どれも1本ずつしか出ておらず、専用の道具が無く、毎回ゼロから題材を探している。軽い型が埋まるまで止める
  src: 実測（各1本）
- num: 6
  slot: 案A（推し）
  fmt: 外す
  head: 10年前の今日・1年前の噂を、10月の表から外す
  why: 10年前の今日は手つかず。1年前の噂は、控えが1年ぶんたまる2027年8月まで材料が無い
  src: 10月のシリーズの表
- num: 7
  slot: 案B
  fmt: 直す
  head: 「記録」と「記録の解説」の再生リストを1つにまとめる
  why: 同じ型なのに名前が揺れ、再生リストが2つに割れている（1本と2本）。続けて見てもらう仕掛けが効かない
  src: YouTube の再生リスト20件を確かめた
- num: 8
  slot: 案C
  fmt: 決まり
  head: 曜日に置くのは、専用の道具がある型だけにする
  why: 水曜の仕組みの解説・金曜の比較は、毎回ゼロから題材を探すので続かない。随時の枠に戻し、曜日は道具のある型（週報・順位表・得点王）で固める
  src: 10月のシリーズの表
- num: 9
  slot: 案C
  fmt: 決まり
  head: 1本しか出していないシリーズを、これ以上増やさない
  why: いま10個ある。増やすほど1本ずつ切れて、続けて見る理由が作れない
  src: 実測（1本だけのシリーズ10個）
