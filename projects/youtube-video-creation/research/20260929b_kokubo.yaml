- id: words
  main: true
  heading: 「パーフェクトと言いたい」
  tier: 報道
  telop: 小久保「あだ名を付けてくれた人にはパーフェクトと言いたい」
  narrator: キャスター
  say:
  - text: デビュー戦のセーブにファンが返した「国防」の2文字。苗字と国を守るを掛けた呼び名です。
    short_only: true
    image: assets/images/20260929b_kokubo/03_k.jpg
  - text: 試合後、その呼び名について聞かれた本人の答えです。
    image: assets/images/20260929b_kokubo/03_k.jpg
  - voice: 小久保
    text: すごくうれしい。
  - voice: 小久保
    text: あだ名を付けてくれた人にはパーフェクトと言いたい。
    cont: true
  - voice: 小久保
    text: しっかり『国防』という名前で頑張っていきたい
    cont: true
  - 一方で、自分から課題に挙げたのは、キーパーから味方へパスをつなぐビルドアップでした。
  - voice: 小久保
    text: ビルドアップで落ち着きを見せられたら良かった。
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?459917-459917-fl
  - https://news.yahoo.co.jp/articles/3af9a620ae21c97c1061049e6ee84329244043c5
  - https://news.yahoo.co.jp/articles/67740d0ff3b5f96c45373c67cb87e01d1e51a24f
  - https://news.yahoo.co.jp/articles/2f92ea62434fe0009066800ce416f8d46ae041dc
