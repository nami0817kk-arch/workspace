  say:
  - text: 小久保の呼び名の中身は、シュートを止める力です。
    image: assets/images/20260929b_kokubo/03_k.jpg
  - text: 昨季はベルギー1部のシント・トロイデンで、38試合すべてに先発。110本を止め、無失点は9試合。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]], "highlight_row": 1}
  - text: 今季はここまで7試合で12失点、無失点は1試合。それでもセーブは27本あります。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]], "highlight_row": 2}
  - text: 止めた割合は、昨季の72%に対して今季は69%。ほとんど変わっていません。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]], "highlight_row": 2}
  - text: 正ゴールキーパーの鈴木彩艶との差が出るのは、止める手前の場面。本人が挙げたビルドアップです。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]]}
  - text: ザイオンと読むその鈴木彩艶は、W杯の全試合でゴールを守り、そこが強い。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]]}
  - text: 10月1日のエクアドル戦。ゴールを守るのが誰かで、キーパーの序列が見えます。
    card: {"type": "table", "title": "小久保玲央ブライアンの数字", "columns": ["", "試合", "失点", "無失点", "セーブ"], "rows": [["パリ五輪", 4, 3, 3, 14], ["昨季 ベルギー1部", 38, 43, 9, 110], ["今季 ベルギー1部", 7, 12, 1, 27]]}
