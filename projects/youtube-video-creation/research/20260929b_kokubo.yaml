    cont: true
  - voice: ネット民
    text: もし第1GKを誰にするか迷うくらいの存在になれば、
    cont: true
  - voice: ネット民
    text: 日本のGKは10年は安泰と言える。
    cont: true
  - voice: ネット民
    text: 初めてまともに試合でてるの見たけど、
  - voice: ネット民
    text: 反射神経含め悪くなかった。
    cont: true
  - voice: ネット民
    text: ザイオンの2番手はコイツでは。
    cont: true
