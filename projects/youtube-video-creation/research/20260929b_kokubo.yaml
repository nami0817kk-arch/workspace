  say:
  - text: 9月28日の広島、ベネズエラとの親善試合。小久保玲央ブライアンが先発で日本代表デビューしました。
    image: assets/images/20260929b_kokubo/01.jpg
  - 五輪代表ではなく、年齢の枠のないA代表では初めての試合です。
  - text: 前半45分、自陣でパスが詰まり、コーナーキックを与えます。
    card:
      type: table
      title: 前半終了間際の2つのコーナーキック
      columns: *cols_save
      rows:
      - *row_s1
  - アディショナルタイム1分。ベネズエラのマクンのヘディングに、一瞬、逆を取られました。
  - text: 体勢を崩しながら横っ飛び。右手でかき出しました。
    card:
      type: table
      title: 前半終了間際の2つのコーナーキック
      columns: *cols_save
      rows:
      - *row_s1
      - &row_s2
        - 45分+1
        - マクンのヘディングを、横っ飛びで弾く
  - text: 直後のコーナー、至近距離のヘディングは手をかすめ、味方の瀬古歩夢がゴールラインの上で蹴り出しました。
    card:
      type: table
      title: 前半終了間際の2つのコーナーキック
      columns: *cols_save
      rows:
      - *row_s1
      - *row_s2
      - &row_s3
        - 直後
        - カスティージョの至近距離。瀬古がライン上でクリア
  - text: この場面について、試合のあと本人の口から出たのは。
    card:
      type: table
      title: 前半終了間際の2つのコーナーキック
      columns: *cols_save
      rows:
      - *row_s1
      - *row_s2
      - *row_s3
      highlight_row: 1
  - voice: 小久保
    text: あそこがファーストシュートだった。
  - voice: 小久保
    text: そこに対しての準備は45分間ずっとしてきていたので、
    cont: true
  - voice: 小久保
    text: ああいう形で良いセーブができたのかなと思う
    cont: true
  - 「相変わらず国防してんな」「国防ブライアン心強えええ」。
  - こくぼ、と、こくぼう。苗字と、国を守る言葉を掛けた呼び名です。
