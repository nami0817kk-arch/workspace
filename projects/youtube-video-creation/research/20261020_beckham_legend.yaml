- id: now
  heading: 引退したベッカムは、いま何をしているのか
  tier: 報道
  telop: 引退から、インテル・マイアミへ
  narrator: 解説
  card:
    type: timeline
    title: 引退から、いままで
    rows: &id010
    - - 2013年5月
      - PSGで優勝、現役を引退
    - - 2014年2月
      - MLSの新クラブを持つ権利を使う
    - - 2020年3月
      - インテル・マイアミが初戦
    - - 2025年6月
      - 国王から、ナイトの称号
    - - 2025年12月
      - インテル・マイアミがMLSカップ優勝
    - - 2026年4月
      - マイアミ市内の新本拠地で初戦
    focus: 5
  say:
  - text: 2013年5月16日。ベッカムは、現役の引退を発表します。
    image: assets/images/20261020_beckham_legend/b12_face_w.jpg
    card: none
  - text: 引退を決めた理由を聞かれると、笑って、こう言いました。
    card: none
  - voice: ベッカム
    text: たぶん、メッシが、僕の横を走り抜けたときかな。
  - text: その10年後、メッシは、ベッカムが会長を務めるクラブへ移ります。
    emph: true
    card: none
  - text: 2014年2月、選手時代の契約にあった権利を使い、新クラブを作ります。
    image: assets/images/20261020_beckham_legend/b99_fa_w.jpg
    card:
      type: timeline
      title: 引退から、いままで
      rows: *id010
      focus: 5
      highlight_row: 1
  - text: 2025年6月14日。国王から、貢献を認められ、ナイトの称号。
    image: assets/images/20261020_beckham_legend/b12_face_w.jpg
    emph: true
    card: none
  - text: 2025年12月6日。インテル・マイアミが、アメリカのリーグの王者に。
    image: assets/images/20261020_beckham_legend/b99_fa_w.jpg
    card:
      type: timeline
      title: 引退から、いままで
      rows: *id010
      focus: 5
      highlight_row: 4
  - text: 今年4月、マイアミ市内の新本拠地で、初めての試合。本人の言葉です。
    image: assets/images/20261020_beckham_legend/b12_gal_w.jpg
    card: none
  - voice: ベッカム
    text: 13年前、マイアミを選んだ。
  - voice: ベッカム
    text: 名前も、ファンも、スタジアムも無かった。
    cont: true
  - voice: ベッカム
    text: 今日、僕らは新しい本拠地に立っている。僕らは王者だ。
    cont: true
    pause: 0.5
  quotes_from:
