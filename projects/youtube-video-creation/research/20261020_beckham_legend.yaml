- id: story
  heading: ハーフウェーラインの一撃と、給料を受け取らなかった5か月
  tier: 報道
  telop: マル秘話 開幕戦の一撃と、パリの5か月
  narrator: 解説
  card:
    type: table
    title: マル秘話
    columns: &id011
    - いつ
    - 何があったか
    rows: &id012
    - - 1996年8月
      - 開幕戦で、ハーフウェーラインから決めた
    - - 2013年
      - 給料を受け取らず、パリで優勝した
    source: Sky Sports・AP・FourFourTwo
    highlight_row: 0
  say:
  - text: 秘話は2つ。まず、1996年8月17日。21歳になったばかりの、開幕戦です。
    image: assets/images/20261020_beckham_legend/b99_fa_w.jpg
    card:
      type: table
      title: マル秘話
      columns: *id011
      rows: *id012
      source: Sky Sports・AP・FourFourTwo
      highlight_row: 0
  - text: 相手はウィンブルドン。マンUが、2点をリードしていました。
    card:
      type: table
      title: マル秘話
      columns: *id011
      rows: *id012
      source: Sky Sports・AP・FourFourTwo
      highlight_row: 0
  - text: 終了間際。ハーフウェーライン付近から、前に出たキーパーの頭上へ、右足を振ります。
    image: assets/images/20261020_beckham_legend/b99_cl_w.jpg
    emph: true
    card: none
  - text: 実は、その約10分前にも、似たシュートを狙っていました。
    card: none
  - text: ファーガソン監督は、そのとき、助手にこう言ったそうです。
    card: none
  - voice: ファーガソン
    text: もう一度やったら、交代させるぞ。
  - text: 決まったあと、本人が、うれしかったことがあります。
    card: none
  - voice: ベッカム
    text: ゴールよりも、カントナが「いいゴールだ」と、
  - voice: ベッカム
    text: 言ってくれたことが、うれしかった。
    cont: true
  - text: 2つ目は、2013年。37歳のベッカムが、パリへ向かった話です。
    image: assets/images/20261020_beckham_legend/b99_fa_w.jpg
    card:
      type: table
      title: マル秘話
      columns: *id011
      rows: *id012
      source: Sky Sports・AP・FourFourTwo
      highlight_row: 1
  - text: 契約は、5か月。給料は受け取らず、パリの子ども向けの慈善団体へ寄付します。
    emph: true
    card:
      type: table
      title: マル秘話
      columns: *id011
      rows: *id012
      source: Sky Sports・AP・FourFourTwo
      highlight_row: 1
  - text: 5月12日、19年ぶりのリーグ優勝。ベッカムは、4つ目の国で、優勝の一員に。
    image: assets/images/20261020_beckham_legend/b12_gal_w.jpg
    emph: true
    card: none
  - text: 5月18日、本拠地の最終戦。コーナーキックから、味方のゴールを生みました。
    card: none
