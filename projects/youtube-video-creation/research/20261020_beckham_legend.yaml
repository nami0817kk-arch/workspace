# ベッカム（元マンチェスター・U／レアル・マドリード／LAギャラクシー／PSG／イングランド代表主将・いまはインテル・マイアミ会長）の紹介。シリーズ「レジェンドの紹介（世界）」。見本は 10/19 のイニエスタ・10/18 のシャビ。
# 型は引退した選手向けの8節：①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（通算の表） ⑤あの試合（1999-05-26 CL決勝） ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **題の読み直し**（候補「右足のクロスが、4つの国で優勝をもたらした」）：
#   ・「4つの国で優勝」は本当（イングランド・スペイン・アメリカ・フランス）。ただし(1)アメリカは MLSカップ（プレーオフを勝ち上がる優勝）、(2)フランスは約5か月・全大会14試合の途中加入、(3)イタリア（ミランへの貸出）は優勝なし、(4)「クロスが優勝をもたらした」と言い切れるのは1999年CL決勝の2本のコーナーだけ。
#   ・リーグ優勝の回数は 6（プレミア）＋1（ラ・リーガ2006-07）＋2（MLSカップ2011・2012）＋1（リーグ・アン2012-13）＝10。AP（2013-05-12 SI掲載）も「4か国・リーグ優勝メダル10個」と書く（一致）。
#   → 題は「4つの国で、10回のリーグ優勝」（数字で言い、因果は言わない）。クロスの話は「あの試合」で、コーナー2本の事実として語る。
# **FotMob は使わない**。数字は基本の数と、自分で割った・数えた値。Transfermarkt・DataMB・FBref 等は見ていない。公開予定は 10/20。**台本は draft まで**（approve・build・screen・upload はしない）。
# **引退後の私生活・法的な問題は入れない**（結婚・家族・事業・報道のあった私的な話は不使用。ファーガソンとの確執・ブーツの件も、題に答えないので落とした）。
#
# **出どころ（本文を実際に読んだもの。requests と WebSearch の URL 探しのみ。ブラウザの道具は不使用）と確度**
# - FCバルセロナ公式（fcbarcelona.com「1999: Man United's miracle at Camp Nou」）：キーンとスコールズは出場停止／バスラーの先制／90分でも1-0／ベッカムのCKからギグスの弱いシュートをシェリンガムが足で同点／再開してすぐのCKからシェリンガムが頭、ソルシャールが決勝点／UEFA会長がトロフィーを渡しにピッチへ向かっていた。→ 報道（クラブ公式の記事）。2本目のCKを蹴った人は同記事に明記がないので、UEFA（検索結果の抜粋のみ・本文は接続切れで読めず）と Wikipedia（1999 UEFA Champions League final）の「ベッカムが再び」に従った。→ 背景。
# - 1999年ロスタイム：表示は3分、1点目はロスタイムに入って36秒、決勝点は「3分のうち残り43秒」（Wikipedia）。→ 背景。台本は「約2分のうちに」。
# - AP（2013-05-16。Boston Globe 掲載。本文を読んだ）：引退の言葉（「ひたむきに働いたサッカー選手として」「メッシが僕の横を走り抜けたとき」「代表の主将を務めたことが最も誇り」）、PSGでの給料の寄付、MLS・マンU・レアルでの優勝、1998年の退場と2001年ギリシャ戦。→ 報道。
# - SI（AP配信・2013-05-12）：PSGがリヨンに1-0、1994年以来のリーグ優勝／ベッカムは4か国で優勝、リーグ優勝メダル10個。→ 報道。
# - FourFourTwo（PA配信）：5か月契約・37歳・給料を寄付・全大会14試合。→ 報道。
# - Sky Sports（2016-08-17、2025-06-14）：ウィンブルドン戦のゴールの経緯と本人・ファーガソンの言葉、ナイトの称号（理由：選手としての実績と慈善）、マンU394試合85得点、代表115試合・主将59試合。→ 報道。
# - AP（2026-04-04。Fox Sports 掲載）：インテル・マイアミがマイアミ市内で初めての試合、昨季MLSカップを制した、ベッカムの言葉、2014年に新クラブの権利を行使。→ 報道。
# - Yahoo Sports（PA）：2001-10-06 ギリシャ戦、1-2でロスタイムに入り、ベッカムのFKで2-2、W杯出場。→ 報道。
# - ESPN（site.api.espn.com）：W杯1998 イングランド対アルゼンチン 2-2・PK 3-4 でベッカム退場（記録の赤カード1）／ラ・リーガ2007-06-17 レアル対マヨルカ（ベッカム先発・66分に交代）。→ 報道（統計の出どころ）。レアルの公式（realmadrid.com）：勝ち点76で並び、直接対決で優勝。→ 確定に近いが台本では「優勝」だけ使用。
# - Wikipedia（David Beckham／MLS Cup 2025／2026 Inter Miami CF season／1999 UEFA Champions League final）：出場・得点の表、優勝歴、ベッカム・ルール（指定選手制度）、新クラブの権利 2,500万ドル、インテル・マイアミの会長。→ 背景。
#
# **食い違い・不確かな点と台本での扱い**
# - PSGの出場数：FourFourTwo 14試合（全大会）／別の記事 12試合／Wikipedia リーグ10。→ 「全大会で14試合」（Wikipedia の表と一致）。
# - ウィンブルドン戦の距離：55ヤード・60ヤードと記事で違う。→ 言わない。GKは「少し離れていた」（Sky）。
# - ギリシャ戦のFKの分数：93分・94分・「ロスタイム2分」と食い違う。→ 分数は言わず「ロスタイム」。
# - ベッカム・ルールは「この移籍で作られ、のちにそう呼ばれた」（Wikipedia。MLSの公式ページは読めていない）。→ 背景。
# - 「優勝した季」：マンUは1995-96〜2002-03の8季（優勝6）、ほか3か国は レアル4季・ギャラクシー6季（暦年2007〜2012）・PSG1季＝11季（優勝4）。ミラン貸出の季は別に数えず、得点の割合にだけ入れた（85÷394＝0.22／42÷330＝0.13）。
# - 51歳：1975-05-02 生まれ。
# - FotMob 不使用。読めなかったもの：UEFA の記事本文（接続切れ）、MLS 公式、manutd.com の本文。
#
# **自分で数えた比べ（⑧）**：優勝した季の割合 マンU 6÷8＝75%／ほか 4÷11＝36%（約2倍）。1試合あたりの得点 0.22点／0.13点（約1.7倍）。
# **日本語名・読みで怪しいもの**：ベッカム／ファーガソン／シェリンガム／ソルシャール／シュマイケル／ギグス／キーン／スコールズ／バスラー（台本では「バイエルンが先制」とだけ言う）／カンプ・ノウ／インテル・マイアミ／パリ・サンジェルマン／カントナ。
# 本人の言葉は5か所（自訳。原文は上の出典）。
