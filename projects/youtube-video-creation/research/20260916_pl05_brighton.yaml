sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1901年創設。愛称は「シーガルズ」
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1901年"]
        - ["愛称", "The Seagulls／The Albion"]
        - ["本拠地", "ファルマー・スタジアム"]
        - ["収容人数", "32,176人"]
    say:
      - "アルファベット順では5番目。**14年間、自分の家が無かったクラブ**です。"
      - 創設は1901年。イングランド南部の海沿いの街、ブライトンのクラブです。
      - 正式には「ブライトン・アンド・ホーヴ・アルビオン」。隣り合う2つの街の名前が入っています。
      - 愛称は「シーガルズ」。**カモメ**です。
      - 海沿いの街らしい名前ですが、この呼び名がどこから来たのかは、記事には書かれていませんでした。
      - もうひとつ、「アルビオン」とも呼ばれます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
  - id: home
    heading: 本拠地を失った14年
    main: true
    tier: 背景
    telop: 1997年、取締役会が本拠地を売った
    narrator: 解説
    card:
      type: table
      title: 家を失っていた期間
      columns: ["", ""]
      rows:
        - ["1997年", "ゴールドストーン・グラウンドを売却"]
        - ["1997-1999年", "ジリンガムの本拠地を借りる"]
        - ["1999-2011年", "陸上競技場を改造したウィズディーン"]
        - ["2011年", "ファルマー・スタジアムへ"]
    say:
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: このクラブには、本拠地が無かった時期があります。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: 1997年、取締役会が歴史あるゴールドストーン・グラウンドを売却しました。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: 同じ年、リーグからの降格も、そして清算も、すれすれのところで免れています。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: ここから14年間、ブライトンは自分の家を持ちませんでした。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: はじめの2年はジリンガムの本拠地を借ります。1997年から1999年です。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: そのあとの12年は、陸上競技場を改造したウィズディーン・スタジアムでした。}
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: いまのファルマー・スタジアムに入ったのは2011年。収容は3万2176人です。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。三笘薫
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "ファビアン・ヒュルツェラー"]
        - ["日本人選手", "三笘薫"]
        - ["主な加入", "ヴシュコヴィッチ（4,600万ポンド）"]
        - ["主な退団", "バレバ（6,500万ポンド）"]
    say:
      - 監督はファビアン・ヒュルツェラー。2024年6月からの就任です。
      - このクラブには、日本人選手がいます。**三笘薫**です。
      - 今季の出場数は、シーズンの記事から読み取れませんでした。ここでは数字を出しません。
      - 今夏は、出入りがどちらも大きく動いています。
      - 出ていったほうでは、カルロス・バレバが**6500万ポンド**でユナイテッドへ。
      - ヤン・ポール・ファン・ヘッケはトッテナムへ5200万ポンドでした。
      - 入ってきたのは、そのトッテナムからルカ・ヴシュコヴィッチ、**4600万ポンド**。
      - AIKからザドク・ヨハンナが2150万ポンド、リーズからパスカル・ストライクが1500万ポンド。
      - ここまでの得点は、パスカル・グロス、ジャック・ヒンシェルウッド、マリック・ヤルクイエがそれぞれ2点です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Brighton_%26_Hove_Albion_F.C._season
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 34年かかって戻り、その6年後にヨーロッパへ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1983年", "FAカップ決勝。引き分けのあと再試合で0-4"]
        - ["2016-17年", "2位でプレミア復帰。34年ぶり"]
        - ["2022-23年", "6位。クラブ史上初のヨーロッパ"]
    say:
      - 語り継がれている試合が、1983年にあります。
      - クラブ史上はじめてのFAカップ決勝。相手はマンチェスター・ユナイテッドでした。
      - 試合は2対2で引き分け、再試合へ。その再試合は0対4でした。
      - この決勝では、ゴードン・スミスの決定機が語り草になっています。
      - そこから1部を離れ、戻るまでに**34年**かかりました。
      - 2016年から17年のシーズン、チャンピオンシップを2位で終えて昇格します。
      - そして2022年から23年、リーグ6位。
      - "**クラブの歴史ではじめて**、ヨーロッパの舞台に出る権利を得ました。"
      - 愛称の話も、ひとつ残っています。
      - このクラブは昔「**ドルフィンズ**」、イルカと呼ばれていました。
      - 変わったきっかけはパレス戦です。相手のサポーターが「イーグルス」と叫んだ。
      - "その替え歌として、観客席から「**シーガルズ**」が返りました。"
      - あとからクラブが、それを正式な愛称にしています。
      - "つまり**看板そのものが、ライバルへの当てこすりから生まれている**わけです。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
      - https://en.wikipedia.org/wiki/1910_FA_Charity_Shield
      - https://en.wikipedia.org/wiki/M23_derby
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝0回、FAカップ0回（準優勝 1982-83）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "0回"]
        - ["FAカップ", "0回（準優勝 1982-83）"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "0回"]
        - ["全国タイトル", "1910年のチャリティ・シールドだけ"]
    say:
      - 数字にすると、こうなります。
      - 1部優勝ゼロ。FAカップもゼロ。リーグカップもゼロ。ヨーロッパもゼロ。
      - "全国規模のタイトルは、**1910年のチャリティ・シールドがただ1つ**だけです。"
      - "その試合の会場は、**チェルシーのスタンフォード・ブリッジ**でした。"
      - "アストン・ヴィラを1対0で下し、地元では「全イングランドの王者」と呼ばれています。"
      - "**116年経っても、これを超える優勝がありません。**"
      - "そのうえで今季、三笘薫の契約は**2027年まで**残っています。"
      - 月間賞を獲った初の日本人で、月間ゴール賞はすでに3回。
      - "日本人のイングランド1部単シーズン最多得点も、本人が持っています。"
      - タイトルゼロのクラブと、記録を持つ日本人。そこが今季の見どころです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
