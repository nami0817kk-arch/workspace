# プレミアリーグ20クラブ紹介 ⑤ブライトン（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**三笘薫。ただし今季の出場記録は
# シーズン記事から読み取れなかった。**数字は書かない。**
# （9/17 に出す回では「退団報道」と「ベンチ外が続く」を扱っている。
# ここは紹介なので、その話には踏み込まない）
#
# **本拠地を失っていた14年間**が、このクラブのいちばんの芯。
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では5番目」を削り、後半の
# 「14年間、自分の家が無かったクラブです」だけを残した。②各節の1行目を、その節で
# いちばん引きの強い事実に入れ替えた。③優勝の節は「ゼロ」の数え上げをやめ、
# 1910年のチャリティ・シールドと三笘の記録だけにした。カードの「0回」の行も消した。
#
# **見てもらえる形にした**（2026-09-18 ユーザー指示「もっと見てる人の興味や
# 関心を引き立てる内容にしてください」）。
#   ・題とサムネを三笘薫の引きに変え、**今季の顔ぶれの節を2番目へ前出し**した
#   ・**宿敵**（M23ダービー。1976年の3試合とマラリーの5ポンド）と
#     **レジェンド3人**（ウィルソン／クック／マレー）の節を足した
#
# **歴史の節を短くした**（2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」）。
#   ・歴史にあたる2節が21行あった。「本拠地を失った14年」を6行→5行、
#     「歩んできた道」を15行→9行にして、合わせて14行に収めた
#   ・落としたできごとは無く、1983年の決勝・34年ぶりの復帰・初の欧州・愛称の由来は
#     残したまま、2行を1行にまとめて縮めた
format: news
