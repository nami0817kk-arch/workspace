# プレミアリーグ20クラブ紹介 ⑤ブライトン（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**三笘薫。ただし今季の出場記録は
# シーズン記事から読み取れなかった。**数字は書かない。**
# （9/17 に出す回では「退団報道」と「ベンチ外が続く」を扱っている。
# ここは紹介なので、その話には踏み込まない）
#
# **本拠地を失っていた14年間**が、このクラブのいちばんの芯。
