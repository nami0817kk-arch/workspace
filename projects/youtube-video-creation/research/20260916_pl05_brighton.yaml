sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 14年間、自分の家が無かったクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1901年"]
        - ["愛称", "The Seagulls／The Albion"]
        - ["本拠地", "ファルマー・スタジアム"]
        - ["収容人数", "32,176人"]
    say:
      - "**14年間、自分の家が無かったクラブ**です。"
      - 創設は1901年。イングランド南部の海沿いの街、ブライトンのクラブです。
      - 正式には「ブライトン・アンド・ホーヴ・アルビオン」。隣り合う2つの街の名前が入っています。
      - 愛称は「シーガルズ」。**カモメ**です。この呼び名の出どころは、あとの話に出てきます。
      - もうひとつ、「アルビオン」とも呼ばれます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには三笘薫がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ファビアン・ヒュルツェラー"]
        - ["主将", "ルイス・ダンク（CB・イングランド／背番号5）"]
        - ["エース", "今季は5人が2点ずつで並ぶ"]
        - ["昨季の得点王", "ウェルベック14点。今夏チェルシーへ"]
        - ["日本人選手", "三笘薫"]
    say:
      - "このクラブには、**三笘薫**がいます。"
      - 今季の出場記録は、シーズンの記事から読み取れませんでした。ここでは数字を出しません。
      - "エースは、今季まだ決まっていません。**5人が2点ずつで並んでいます。**"
      - 昨季14点を挙げたダニー・ウェルベックは、今夏チェルシーへ移りました。
      - 残っている選手でいちばん取っているのは、昨季10点のディエゴ・ゴメスです。
      - 監督はファビアン・ヒュルツェラーです。
      - 主将はルイス・ダンク。イングランド人のセンターバックです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: home
    heading: 本拠地を失った14年
    main: true
    tier: 背景
    telop: 1997年、経営陣が本拠地を売った
    narrator: 解説
    card:
      type: table
      title: 家を失っていた期間
      columns: ["", ""]
      rows:
        - ["1997年", "借金のためゴールドストーン・グラウンドを売却"]
        - ["1997-1999年", "ジリンガムの本拠地を借りる"]
        - ["1999-2011年", "陸上競技場を改造したウィズディーン"]
        - ["2011年", "ファルマー・スタジアムへ"]
    # 2026-09-22: なぜ売ったか（借金）が無く、「清算」「取締役会」は耳で立たなかった。
    # 降格・消滅の話は本拠地の流れを切っていたので節の最後へ。
    # 「すれすれ」の中身は最終節の引き分け（ヘレフォードと1対1）。
    # 2026-09-22（3回目）: 残留の行を売却の直後へ（「その年」が2011年に聞こえていた）。
    # 「フットボールリーグに残る」は耳で取れないので「4部に残る」。消滅の行は中身が1文で
    # 言えないので落とした。「ここから14年間」はオープニングの言い直しなので落とし、
    # 時系列を 売却 → 残留 → 2年 → 12年 → 2011年 の一本にした
    # 節の頭は売られた当のゴールドストーン・グラウンド（1996年4月、売却の前年の写真）にした
    # （2026-09-22）。それまでは5行ともファルマーの写真で、話と絵が合っていなかった。
    # 2〜4行目は写真を引き継ぐ（hold_photo）。最後の行だけ、いまのファルマーに切り替える。
    # 出典は assets/images/pl_brighton_story/credits.json
    say:
      - {image: "assets/images/pl_brighton_story/scene.jpg",
         text: 1997年、クラブの経営陣が、借金を返すために本拠地のゴールドストーン・グラウンドを売りました。}
      - その年は、最終節の引き分けで、ようやく4部に残りました。
      - 売ってからの2年間は、別のクラブ、ジリンガムの本拠地を借りました。
      - そのあとの12年は、陸上競技場を改造したウィズディーン・スタジアムです。
      - {image: "assets/images/pl_brighton/scene.jpg",
         text: いまのファルマー・スタジアムに入ったのは2011年です。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 34年かかって戻り、その6年後にヨーロッパへ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1983年", "FAカップ決勝。引き分けのあと再試合で0-4"]
        - ["2016-17年", "2位でプレミア復帰。34年ぶり"]
        - ["2022-23年", "6位。クラブ史上初のヨーロッパ"]
    say:
      - 語り継がれている試合が、1983年にあります。
      - クラブ史上はじめてのFAカップ決勝。相手はマンチェスター・ユナイテッドでした。
      - 試合は2対2で引き分け、再試合は0対4。ゴードン・スミスの決定機が語り草になっています。
      - そこから1部を離れ、戻るまでに**34年**かかりました。
      - 2016年から17年のシーズン、チャンピオンシップを2位で終えて昇格します。
      - "そして2022年から23年はリーグ6位。**クラブの歴史ではじめて**、ヨーロッパの舞台に出る権利を得ました。"
      - 愛称の話も、ひとつ残っています。このクラブは昔「**ドルフィンズ**」、イルカと呼ばれていました。
      - "変わったきっかけはパレス戦です。相手のサポーターの「イーグルス」に、観客席から「**シーガルズ**」が返りました。"
      - "あとからクラブが、それを正式な愛称にしています。**看板そのものが、ライバルへの当てこすりから生まれている**わけです。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
      - https://en.wikipedia.org/wiki/1910_FA_Charity_Shield
      - https://en.wikipedia.org/wiki/M23_derby
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 発端は、トッテナムで同僚だった2人の敵対心
    narrator: 解説
    card:
      type: table
      title: M23ダービー
      columns: ["", ""]
      rows:
        - ["相手", "クリスタル・パレス"]
        - ["呼び名", "M23ダービー（A23ダービー）"]
        - ["1976年", "FAカップ1回戦が3試合もつれる"]
        - ["1989年", "1試合5本のPK。27分の間に"]
        - ["今季", "パレスもプレミアリーグにいる"]
    say:
      - "宿敵はクリスタル・パレス。呼び名は**M23ダービー**です。"
      - "サセックスと南ロンドンを結ぶ道路の名前から来ています。**ただしサポーターはこの呼び名を嫌っています。**"
      - 最初に当たったのは1920年ですが、因縁が本物になったのは1970年代の半ばでした。
      - 発端は2人の人物です。パレスのテリー・ヴェナブルズと、こちらのアラン・マラリー。
      - 2人はトッテナムで同僚でした。
      - 1976年11月20日のFAカップ1回戦は2対2。11月23日の再試合は延長の末1対1。
      - 12月6日、スタンフォード・ブリッジでの3度目を、パレスが1対0で取ります。
      - 試合のあと、マラリーは警察に連れ出されながら、相手のサポーターへVサインを送って罵りました。
      - "さらに相手のロッカールームに入り、床に**5ポンド**を投げつけます。"
      - 「お前のチームはこの金の値打ちもない」。ヴェナブルズへ、そう言い放ちました。
      - 1989年には、1人の主審が1試合で5本のPKを、それも27分の間に与えた試合もあります。リーグの記録で、勝ったのはパレスでした。
      - そのパレスは、今季もプレミアリーグにいます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/M23_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 初のプレミア昇格を確定させた、先制点の主
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["グレン・マレー", "259試合103得点／昇格を決めた先制点"]
        - ["アーニー・ウィルソン", "566試合。クラブ史上最多出場"]
        - ["トミー・クック", "209試合123得点。クラブ史上最多得点"]
    say:
      - "クラブ史上はじめてのプレミアリーグ入りを確定させたのは、グレン・マレーの**先制点**でした。"
      - 2017年4月17日のウィガン戦。2対1で勝っています。
      - 在籍は2008年から11年と、2016年から20年。2期をあわせて259試合103得点です。
      - その昇格の年は、45試合で23得点でした。
      - "出場の記録を持つのはアーニー・ウィルソン。「**タグ**」と呼ばれた選手です。"
      - 1922年から36年まで、566試合に出ました。
      - 得点の記録はトミー・クック。同じころの1922年から29年に、209試合123得点です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Glenn_Murray
      - https://en.wikipedia.org/wiki/List_of_Brighton_%26_Hove_Albion_F.C._records_and_statistics
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 全国タイトルは1910年のチャリティ・シールド
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["全国タイトル", "1910年のチャリティ・シールド"]
        - ["FAカップ", "準優勝（1982-83）"]
        - ["プレミア復帰", "2016-17年に2位で昇格"]
        - ["クラブ史上初のヨーロッパ", "2022-23年（6位）"]
    say:
      - "このクラブの全国規模のタイトルは、**1910年のチャリティ・シールド**です。"
      - "その試合の会場は、**いまのチェルシーの本拠地**でした。"
      - "アストン・ヴィラを1対0で下し、地元では「全イングランドの王者」と呼ばれています。"
      - "そのうえで今季、三笘薫の契約は**2027年まで**残っています。"
      - 月間賞を獲った初の日本人で、月間ゴール賞はすでに3回。
      - "日本人のイングランド1部単シーズン最多得点も、本人が持っています。"
      - 116年前のタイトルを持つクラブと、記録を持つ日本人。そこが今季の見どころです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
