answer: 後半50分にフェルミンへのクロス、53分にゴードンへの折り返し。3分間の2アシストで試合をひっくり返した
watch: 土曜はレアル・ベティス戦。勝てばリーガ開幕9連勝のタイ記録。20日にはCLでパリ・サンジェルマン

sections:
  - id: score
    heading: 試合はこうなった
    tier: 報道
    telop: ガラタサライ 1-4 バルセロナ
    say:
      - チャンピオンズリーグ第2節、バルセロナは敵地イスタンブールでガラタサライに4対1で勝ちました。
      - 先に決めたのはガラタサライ。前半28分、レオンの折り返しから、バトラコフが決めました。
      - バルセロナは前半43分にカンセロが同点。後半は50分にフェルミン・ロペス、53分にゴードン、65分にアデイェミが決めました。
      - これで、今季の公式戦は10戦全勝です。リーガ8勝、チャンピオンズリーグ2勝。
    official: false
    sources:
      - https://www.fcbarcelona.com/en/football/first-team/news/4591863/galatasaray-1-4-fc-barcelona-heaven-in-hell
      - https://www.fcbarcelona.com/en/football/first-team/news/4591897/10-out-of-10-for-fc-barcelona
      - https://www.soccer-king.jp/news/world/cl/20261014/2216422.html
      - https://web.gekisaka.jp/news/ucl/detail/?460953-460953-fl

  - id: voices
    main: true
    heading: 試合後の言葉
    tier: 報道
    telop: フリック監督「素晴らしかった」
    say:
      - {text: 'チャンピオンズリーグ、敵地でのガラタサライ戦です。', short_only: true}
      - 試合後、フリック監督はヤマルについて、こう話しました。
      - voice: ハンジ・フリック
        text: ラミンは今日は点を取っていないが、2つのゴールで最後のパスを出した。素晴らしかった
      - voice: ハンジ・フリック
        text: 信じられない選手で、私たちにとってとても大切な存在だ
      - 先制された前半のことは、こう振り返っています。
      - voice: ハンジ・フリック
        text: 前半もいい試合をしていた。相手に1回チャンスがあって、決められた。戻ってこられたことが大きかった
      - voice: ハンジ・フリック
        text: チャンピオンズリーグでは、いい形でもゴール前の最後のところで、判断が良くない場面がある。そこは直さないといけない
      - 2点目を決めたフェルミン・ロペスは、ヤマルをこう呼んでいます。
      - voice: フェルミン・ロペス
        text: 友人で、素晴らしいチームメイトで、世界最高の選手でもある
    official: false
    sources:
      - https://www.marca.com/futbol/barcelona/2026/10/13/hansi-flick-lamine-marcado-excelente.html
      - https://www.footmercato.net/a9092118953344533206-barca-flick-et-fermin-lopez-a-genoux-devant-lamine-yamal

  - id: turning
    heading: 試合が決まった場面
    tier: 報道
    telop: 後半3分間で2アシスト
    say:
      - 前半のヤマルは目立ちませんでした。いつになく静かな45分でした。
      - 風向きが変わったのは後半です。50分、ヤマルの曲がるクロスに、フェルミンが頭で合わせて逆転。
      - その3分後。ヤマルは、マークについたエルマリを小さな空間で何度もかわして、折り返します。
      - それを、ゴードンが低く流し込みました。実はその少し前にも、ヤマルはゴードンの決定機をつくっていて、ゴードンは外していました。
      - 65分には、ヤマルのパスの流れからアデイェミが4点目。
    official: false
    sources:
      - https://www.fcbarcelona.com/en/football/first-team/news/4591863/galatasaray-1-4-fc-barcelona-heaven-in-hell
