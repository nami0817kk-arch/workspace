  - id: next
    heading: 順位と次の一戦
    tier: 報道
    telop: 土曜はベティス戦。20日はPSG
    say:
      - 次は土曜、敵地でレアル・ベティス戦です。勝てば、リーガ開幕9連勝。1968年から69年にかけてのレアル・マドリードの記録に並びます。
      - チャンピオンズリーグは、得失点差でバルセロナがリーグフェーズの首位です。
      - 次は20日、パリ・サンジェルマン戦。
    official: false
