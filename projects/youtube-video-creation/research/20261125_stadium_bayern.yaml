# スタジアム紹介シリーズ：バイエルンの本拠地（アリアンツ・アリーナ、11/25 予定）。雛形は 11/21 マルセイユの回。
# 題材の選び方（2026-11-13）：ブンデスの大物としてバイエルンの器。同日 11/25 の他シリーズ（ユニフォーム＝PSG）と重ならない。11/21 のユニフォーム（バイエルン）とは別の日。外した候補：ドルトムント（席・金額の数字が en・de で割れ、買い戻しの一次情報が取れなかった）、PSG（同日ユニフォーム）、ユヴェントス（11/23 のユニフォーム）、ローマ（11/23 のスタジアムで使用）。
# 選んだ理由：「半分ずつ持った器を、半分1100万ユーロで買い取った」という強い一点／2025-26 の入場（平均約7万5000・17試合が満員）で見立てを作れる。
# 重なりの確認：scripts/*stadium_*・posted.json・covered.yaml・research/*picks.txt に無し（grep 済み）。
# 一次情報の突き合わせ：en・de ウィキペディア（Allianz Arena）、fcbayern.com の10年の年表（2006-04-27）、diefalsche9.de の2025/26 観客表（バイエルン平均75,000・ドルトムント81,365）、kicker 系の要約（17試合中17試合が満員）、en の2025-26 Bayern season（平均75,000）。
#   起工2002-10-21／開場2005-05-30（1860 3-2 ニュルンベルク・親善）・05-31 バイエルン対ドイツ代表／工事費2億8600万・金利などを含め3億4000万（en・de 一致）／周辺整備は市と州で約2億1000万（en）／国内7万5024席（立見1万3342）・国際は約7万（de 6万9344・枠7万で割れる→台本に入れない）／外壁は赤（バイエルン）・青（1860）・白（代表）／2006-04-27 バイエルンが1860の半分を1100万ユーロ（en・de。business-punk は1130万＋買戻しオプション130万の記述で割れるので「と伝えられます」）／2017-07 バイエルンが1860の賃貸を終了（en）／2014 アリアンツ社へ株8.33%を売った金で器の借金を返すと発表（de。当初の返済計画は2028年）／命名権は2041年まで（de）／WC2006 6試合（開幕 ドイツ4-2コスタリカ 06-09、準決勝 ポルトガル0-1フランス 07-05）／CL決勝2012（チェルシーがPK4-3）・2025（PSG5-0インテル）／ユーロ2024 準決勝 スペイン2-1フランス。
#   食い違い（台本には入れない）：国際の席（7万か6万9344か）、外壁の膜の数（en 2760・de 2784）、1860の売却の理由（「破産を避けた」は en にある1860側の説明のみで、一次未確認）、2006-07〜の席の推移（66,000→69,901→…）、1860の賃貸の終了年（en 2017、fcbayern の年表は別の書き方）。
#   確かめられなかった：1860の2005/06の平均入場（de の67,588・41,932 は裏が取れず台本に入れない）。DFB の試合ページが404。
#   写真：Commons。外壁（赤）は CC BY 2.0、そのほか CC BY-SA。前景に観客が写る06は中央で切った。
# 読みが割れる名前：アリアンツ／ヘルツォーク・ド・ムーロン／ニュルンベルク／1860（ミュンヘン）／ドルトムント。
