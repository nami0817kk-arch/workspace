  title: 久保建英、5季目の立ち上がりに苦戦 スペイン紙「切れ味に欠けている」
  hook: ゴールもアシストも、まだありません。ただ、監督の見方は違いました。
  question: 評価が割れているとき、どちらを見ればよいのか
thumbnail:
  line1: 久保建英、苦戦
  line2: 監督「疑いはない」
  tags:
  - 久保建英
