# 取材メモ（10/8 題材 ronaldo_statement、型は quote）。材料の控え: research/raw/20261008_ronaldo_statement.md（頭に「## 精査」、原文と訳）
# 主役は「約束」。10月6日にロナウドが出した声明の原文（ポルトガル語の全文）を当たり、訳は日本語として自然になるように直した。
# 事実の裏:
#   声明の全文: A Bola 2026-10-06 19:26 掲載。本人はインスタグラムに出した（日刊スポーツ・スポーツ報知が一致）。X の @Cristiano には 10/6 の投稿が見つからない。
#   8項目: 声明の中に本人が全文を引用している。台本に出すのは①⑥⑦の3つ。
#   ジェズス監督の 9/30 の会見: CNN Portugal の書き起こし（20発言）と Renascença。誤りを認めたのは「アップに行かせた時間」だけで、8項目の⑥より狭い。ここが食い違いの中身。
#   ジェズス監督の 10/7: Record（自宅前、10:05 掲載）。
#   処分 1〜6か月: fpf.pt の原本は開けなかった（403・タイムアウト。10/2 と同じ）。ポルトガル紙が同じ文言で引いたものなので「報道」。10/8 朝まで処分の発表は見つからない。
#   出場時間・得点・日程: FotMob（選手 30893・代表 8361・アル・ナスル 101918）。W杯5試合441分3得点、ジェズス監督の3試合は67分0得点は自分で足した。
#   代表通算 234試合146得点は 10/2 の控え（Sky・Maisfutebol・英語版Wikipedia）。声明では本人が「230試合以上」「24年続けて」と書いている。
# 外したもの: モドリッチの言葉（10/7、スペイン紙アス。問い「破られた約束とは何か」に答えないので落とした）、
#   「ジェズスがいるかぎり戻らない」の報道（10/6 の昼。同じ日の夕方の声明と食い違い、声明のほうが後なので使わない）、
#   7番の背番号・空港・ブルーノの言葉・10/4 の試合内容（10/2〜10/5 の回で出している）。
# 反応: X の個人1件（10/8）、Lemmy の英語の個人1件（10/6、訳した）、Yahoo!ニュース（スポニチの記事）のコメント欄1件。全文。
#   ポルトガル語の個人の投稿は取れなかった（Bluesky 403・Reddit 403・Mastodon は報道アカウントの記事貼りだけ）。中身のあった1件は記者の投稿だったので外した。
# 写真: Commons「Cristiano Ronaldo Croatia v Portugal 2 July 2026-154.jpg」（Bryan Berlin、CC BY-SA 4.0、W杯のクロアチア戦）。
#   10/2 の回で使った同じ組の -087 とは別のファイル。facecrop で _w（1920x1080）と _v を切った。
#   監督が語る行は、ジェズス（Commons 2020、CC BY 2.0）を左に並べた pair/01.jpg。ショート用に pair/01_v.jpg。
#   代理店（Getty・AFLO・AFP・ロイター・IMAGO・AP・PA・Lusa・EPA）は使っていない。
