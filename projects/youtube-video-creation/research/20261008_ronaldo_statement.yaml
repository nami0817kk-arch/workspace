  - text: ノルウェー戦は、ポルトガルが2対1で勝ちました。
  - text: ロナウドはもともと、この日は出ない予定で動いていました。
  - voice: ロナウド
    text: 私の体の戻し方の予定にも、練習の予定にも無い話だった。
  - voice: ロナウド
    text: 10月4日の、ポルトでの試合にしか出ない予定だったからだ。
    cont: true
  - text: 2つめの約束は、その48時間後の話し合いで交わされます。
  - voice: ロナウド
    text: 監督が、いま私的な場で私に言ったことを、
  - voice: ロナウド
    text: 記者会見場で、もう一度言う。それだ。
    cont: true
  - voice: ロナウド
    text: 短い文書が作られ、それを私自身が確かめた。
  - text: 声明には、その文書の8項目が、そのまま書き写されています。
