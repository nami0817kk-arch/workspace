  tier: 報道
  telop: ロナウド「では準備しておけ、30分出てもらう、と監督は言った」
  narrator: キャスター
  say:
  - text: ポルトガル代表を離れたロナウドが、6日ぶりに書きました。
    short_only: true
    image: assets/images/20261008_ronaldo_statement/01_w.jpg
  - text: 話は、9月27日のノルウェー戦の日。その昼食の席です。
  - voice: ロナウド
    text: コーチの一人が、みんなで食事をしている席に来た。
  - voice: ロナウド
    text: 監督が話したがっている、と。
    cont: true
  - voice: ロナウド
    text: まったく思いがけないことに、監督はこう聞いてきた。
    cont: true
  - voice: ロナウド
    text: 30分プレーできるか、と。
    cont: true
    emph: true
  - voice: ロナウド
    text: もちろん、はい、と答えた。
    cont: true
  - voice: ロナウド
    text: 監督は、では準備しておけ、30分出てもらう、と言った。
    cont: true
  - voice: ロナウド
    text: あとは、みんなが知っているとおりだ。
  - voice: ロナウド
    text: ハーフタイムからずっとアップをして、
    cont: true
  - voice: ロナウド
    text: 時間が過ぎていくのを見ていた。呼ばれることはなかった。
    cont: true
  - voice: ロナウド
    text: 監督は、私との約束を破った。
    cont: true
    emph: true
  quotes_from:
