  title: ロナウド、代表離脱から6日。「監督は、私との約束を破った」
  question: ロナウドが「破られた」と言う約束とは、何だったのか
  opening_image: assets/images/20261008_ronaldo_statement/01_w.jpg
  takeaway: ロナウドが言う「約束」は2つ。ノルウェー戦の当日に監督から「30分出てもらう」と言われながら出番が無かったこと、48時間後の話し合いで会見の内容を8項目の文書にまとめながら、その通りには話されなかったこと。監督が9月30日の会見で認めた誤りは「アップに行かせた時間」だけで、文書の⑥「出さなかったこと自体が誤り」より狭い。数字で見ると、今夏のW杯5試合441分3得点が、新監督の3試合では67分0得点になっていた。本人は情状酌量なしの処分を求めつつ代表引退は否定していて、1か月なら11月14日のデンマーク戦に間に合い、6か月なら2027年3月末まで出られない
short_title: ロナウド、「30分出てもらう」と言われた日に起きたこと
