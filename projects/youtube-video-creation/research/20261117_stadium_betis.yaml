# スタジアム紹介シリーズ：ベティスの本拠地（エスタディオ・ベニート・ビジャマリン、11/17 予定）。雛形は 11/13 レアル・ソシエダの回。
# 題材の選び方（2026-11-12）：指示書 20261115 の「ラ・リーガの続き」。11/15 の自分の1本目はセビージャ。ベティスを2本目に。ユニフォーム担当は 11/15 バレンシア・11/17 ソシエダ（research/20261115_picks.txt）。重ならない。ビジャレアルは残す。
#   ベティスを選んだ理由：現役で話題の大きなクラブ／「6万席の本拠地を壊して3シーズン間借り」という強い一点／スペイン12対1マルタ・W杯1982などの歴史／今季の間借り先の入場3試合の数字で見立てが作れる。
#   重なりの確認：scripts/*stadium_* にベティスは無し（posted.json・covered.yaml も grep 済み）。同じ11/17のスタジアムは自分の1本だけ。
# 一次情報の突き合わせ：
#   ESPN esp.1 teams/244 の2026-27日程。ラ・カルトゥーハでのホームで入場の記録あり3試合＝ソシエダ 59490（8/21）・オサスナ 65484（10/11）・バルセロナ 66924（10/17）。レアル・マドリード（9/4）・マラガ（10/31）は入場0＝記録なしで除外。平均 191898÷3＝63966。
#   ★要確認：同じ ESPN は 9/17 のヘタフェ戦（入場57792）の会場を「Estadio Benito Villamarín」と表示。クラブ・es ウィキペディアは2025年8月からカルトゥーハ・メインスタンド解体済みなので、ESPN の会場表記の誤りと見て、この1試合は使わない。
#   es・en ウィキペディア：開場1929-03-17（スペイン5-0ポルトガル）／1936-07-16 賃貸契約／1939-03-12 再開／収容60721（スペイン5位・アンダルシア2位）／12-1マルタ 1983-12-21（Euro1984へ）／1997 新しい器発表（6.5万席・最低4200万）／1998-09-12 前半開場・2000-01-01 前半完成／2016-17 ゴール裏南 約1500万・5000→14700／2023-08 新メインスタンド計画 デ・ラ・オス＋ゲンスラー・計画の席60379／2025-08 カルトゥーハへ・2025-09 解体・2026-04 アクシオナの掘削／目標 2028-05-02。
#   金額：stadiumdb 2026-03（見積もり約1.6億・FCC 約2.7億・サクイル 約2.4億・アクシオナ・増額1億超を回避）。完成目標 2028年5月は El Gol Digital と es ウィキペディア、2027年秋は stadiumdb 2025-10。
#   食い違い（台本には入れない）：クラブ取得年は es=1960・en=1961。完成後の席は 60379（es）と7万に増えると書く報道（未確認）。El Gol Digital は「約1.7億ユーロ（2.5億から約8000万削減）」、stadiumdb は「2.7億未満」。投票の得票数は es の数字が合わない（67.4%のみ）ので使わない。
