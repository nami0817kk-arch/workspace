  say:
  - text: 上田は大会の最優秀選手にも選ばれました。
    image: assets/images/20261005_ueda_4goals/04_w.jpg
  - text: 2016年に賞ができてから、日本の選手が選ばれたのは初めてです。
  - text: それでも、本人の口から出たのは反省でした。
  - text: 後半3分、鈴木淳之介のクロスに頭で合わせた1本はクロスバー。
  - text: 後半30分には右足でネットを揺らしましたが、オフサイドでした。
  - voice: 上田綺世
    text: 今日の後半もシュートチャンスがあったし、
  - voice: 上田綺世
    text: もっとチームを楽にできるシーンがあったので、
    cont: true
  - voice: 上田綺世
    text: まだまだかなと思います
    cont: true
  - text: 次に目を向けたのは、自分のクラブでした。
  - voice: 上田綺世
    text: まずは自分のクラブで結果を残すことが、
  - voice: 上田綺世
    text: 各々大事だと思うので、
    cont: true
  - voice: 上田綺世
    text: また次呼ばれるように頑張りたい
    cont: true
