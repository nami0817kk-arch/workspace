# 取材メモ（10/5 題材 ueda_4goals、型は quote）。材料の控え: research/raw/20261005_ueda_4goals.md
# 主役は、キリンカップ決勝（10/5 19:30 国立、日本 2-1 ニュージーランド）の前半28分に先制点を決めた上田綺世と、試合後の言葉。
# 同時に作る別の回「堂安律、325日ぶりの代表弾でキリン杯V」（20261005_kirin_final_doan）と重ねない:
#   試合の流れ・堂安のゴールは1行まで。「2年半ぶりの4バック」「15年ぶり」「11月のシンガポール」「4連勝」は言わない。
#   昼の回（堂安の課題・鈴木彩艶とウッド・ニュージーランド代表紹介・移籍の答え合わせ）の数字も言わない。
# 事実の裏:
#   発言はすべて 10/5 試合後のフラッシュインタビュー。ゲキサカ 460362 の原文（スポニチ・サッカーマガジン・サッカーキング・サンスポで同旨）。
#   4試合の出場と得点の時間: JFA の試合記録（9/24・9/28・10/1 は PDF、10/5 は JFA の試合ページ m4.html）。raw の 2.
#     出場時間（追加時間を除く）は 27＋45＋45＋78 ＝ 195分。FotMob は 9/24 を26分・エクアドル戦を出場なし・NZ戦を90分としていて食い違うので JFA を採った。
#   代表通算: ゲキサカ 460359「A代表通算22、中山雅史氏を上回る単独13位」。FotMob 47試合22点（10/5 まで）、Transfermarkt 46試合21点（10/1 まで）。
#     → 9月の前は43試合18点。
#   リールの今季: FotMob 942393（全公式戦4試合271分3点）。次は日本時間 10/11 0:15 ホームでル・アーヴル（FotMob nextMatch 5802948）。
#   大会MVP、日本の選手は2016年に賞ができてから初めて: サッカーキング（Yahoo 88cd7c5e）。
#   後半のバー直撃のヘッドとオフサイドのゴール: スポニチ（後半3分・後半30分）・サッカーマガジン（48分・75分）。
# 反応: Yahoo!ニュース（スポニチの記事）のコメント欄から個人の投稿を頭から終わりまで3件。海外の声は Bluesky で個人の中身のある投稿が見つからず入れていない。
# 写真: 01・03 ゲキサカ（©Kaoru WATANABE/GEKISAKA）、04 サッカーマガジン（高野徹）、05 サンケイスポーツ（水島啓輔）。代理店ではない。
