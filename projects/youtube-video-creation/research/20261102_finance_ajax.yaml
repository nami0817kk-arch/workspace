- id: profit
  main: true
  heading: 本業が赤字なのに、なぜ黒字になったのか
  tier: 報道
  telop: 選手を売った利益は6550万ユーロ。最終の損益は200万ユーロの黒字
  narrator: 解説
  card: &pl_table
    type: table
    title: アヤックスの決算（百万ユーロ）
    columns: [項目, 2024-25, 2025-26]
    rows:
    - [本業の損益, '−19.4', '−18.2']
    - [選手の契約の償却, '−41.3', '−38.8']
    - [選手を売った利益, '+10.3', '+65.5']
    - [利息・税など, '+13.1', '−6.5']
    - [最終の損益, '−37.3', '+2.0']
