    card: none
  - text: 売却益は、収入の約35%。前の年の約6%より、大きく増えました。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 売却益を除いて、ほかの項目を足すと、およそ6350万ユーロのマイナス。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 人件費の増えは、賞金の増えの、約半分にあたります。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。
    image: assets/images/20261102_finance_ajax/01_w.jpg
    card: none
  - text: 黒字にしたのは、本業ではなく、選手の売却でした。
    emph: true
    card: none
  - text: 今季のアヤックスは、チャンピオンズリーグではなく、カンファレンスリーグ。
    image: assets/images/20261102_finance_ajax/04_w.jpg
    card: none
  - text: 賞金の少ない大会です。
    card: none
  - text: クラブは、このことが収入に重しになると書いています。
    card: none
  - text: そのうえで、費用を抑える方針です。
    card: none
  - text: 7月以降には、ニューカッスルとパリ・サンジェルマンへの移籍もありました。
    card: none
  - text: 今季の決算にプラスに働く見込み、とクラブは書いています。
    card: none
  - text: 賞金が減るなかで、本業の赤字を、次も売却益で埋められるのか。ここが見どころ。
    emph: true
    image: assets/images/20261102_finance_ajax/03_w.jpg
    card: none
