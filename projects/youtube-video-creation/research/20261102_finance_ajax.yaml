      label: アヤックスの運営会社 決算の発表（2026年9月、訳）
      paragraphs:
      - 費用が増えた理由は、チャンピオンズリーグに出たことによる、プロの選手の給料の増えと、一度きりの出費だ。
      - 一度きりの出費には、打ち切りになった試合の観客への補償と、シーズン中の監督の解任がある。
      highlight: [チャンピオンズリーグ, 一度きりの出費]
  - text: 一度きりの出費として、観客への補償と、監督の解任の費用も挙げています。
    card: *cost_doc
  - text: その結果、本業の損益は、1820万ユーロのマイナス。
    emph: true
    image: assets/images/20261102_finance_ajax/01_w.jpg
    card: none
  - text: 前の年も、1940万ユーロのマイナスでした。本業は、2年続けて赤字です。
    card:
      <<: *cost_table
      highlight_row: 3
  sources:
