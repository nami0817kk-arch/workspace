  say:
  - text: チャンピオンズリーグで32位のアヤックス。それでも、決算は黒字でした。
    short_only: true
    image: assets/images/20261102_finance_ajax/01_w.jpg
    card: none
  - text: まず、本業の損益。ここは、マイナスのままです。
    card: *pl_table
  - text: ここに、選手の契約の償却が加わります。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: 買った選手の移籍金を、契約の期間に分けて、費用にしたものです。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: 3880万ユーロ。前の年の4130万より、少なめです。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: 償却を引くと、約5710万ユーロのマイナス。
    emph: true
    image: assets/images/20261102_finance_ajax/02_w.jpg
    card: none
  - text: そこに、選手を売った利益、売却益が、6550万ユーロ入りました。
    emph: true
    card:
      <<: *pl_table
      highlight_row: 2
  - text: クラブが挙げるのは、ヨレル・ハトのチェルシーへの移籍。
    image: assets/images/20261102_finance_ajax/04_w.jpg
    card: none
  - text: ブロビーのサンダーランドへの移籍。ケネス・テイラーのラツィオへの移籍です。
    card: none
  - text: 利息や税などを引いて、最後に残ったのは、200万ユーロの黒字です。
    emph: true
    card:
      <<: *pl_table
      highlight_row: 4
  - text: 前の年は、売却益が1030万ユーロ。最終は、3730万ユーロの赤字。
    card:
      <<: *pl_table
      highlight_row: 2
  - text: 売却益は、6倍あまりに増えたことになります。
    card: none
    image: assets/images/20261102_finance_ajax/03_w.jpg
  sources:
  - https://www.ajax.nl/media/0k4ljz0e/persbericht-jaarcijfers-afc-ajax-nv-per-30-juni-2026-def.pdf
