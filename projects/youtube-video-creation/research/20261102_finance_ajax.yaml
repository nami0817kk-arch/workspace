# クラブの財政：アヤックス（11/2 月、シリーズ「クラブの財政」、key: finance_ajax、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブから。
#   1〜22位は既出（22位フランクフルト 10/29、27位ローマ 10/31）。20位ウェストハムは今季2部、21位ガラタサライ・28位フェネルバフチェはトルコ（欧州7リーグの外）、29位ウルヴスは今季2部。
#   残り：23位ブライトン・24位エヴァートン・25位クリスタルパレス・26位ボーンマス・30位ブレントフォード。
#   どれも決算の一次資料（Companies House の画像PDF、またはクラブ公式の全文）を、この担当の手元（WebFetch と requests だけ）で読めなかった／読めても要約止まり。
#     エヴァートンは公式の決算ページに当たれず、二次情報（theesk 等）しか無い上に、女子チームの売却益（4920万ポンド）が損益の主役で、女子サッカーは扱わない決まりに触れる。→ 題材を替えた。
#   → 「一次資料が取れる」を優先して、デロイトの上位30に入らないが、決算の全文（監査済みの年次報告書128頁）をクラブ公式サイトで読めるアヤックス（エールディヴィジ）にした。
#     ★「収益の大きいクラブから」からは外れる（アヤックスは2025/26の収入1億8830万ユーロで、デロイトの30位ブレントフォード 2億600万ユーロより下）。報告に書く。
#
# 重なりの確認（10/31）：scripts/*finance_* に ajax は無い。research/posted.json・covered.yaml の ajax は covered の「ジンチェンコがアヤックスを去る」（ニュース）だけ。
#   アヤックスの名前の入る本（直近30日）：無し（grep scripts/ で *ajax* 0件）。
# ★今季も1部：英語版 Wikipedia「2026–27 AFC Ajax season」の infobox「league = Eredivisie」「stadium = Johan Cruyff Arena」、2026-08 の試合（Heerenveen 戦 8/16、PSV 戦 9/5）が載っている。
#   エールディヴィジは欧州7リーグの1つ（ポルトガルのベンフィカを 10/28 に扱った前例と同じ「5大リーグの外」）。
# ★日本との接点：2025/26 の決算に日本人選手の話は無い（板倉滉は2023年にボルシアMGへ。いまのアヤックスの日本人は確認できず）。無理に入れない（10/6 の決定）。
#
# 軸は「**チャンピオンズリーグで32位、決勝トーナメントに進めなかった年に、なぜ最終の損益が黒字だったのか**」。
#   答え：本業（営業の損益）は2年続けてマイナスで、黒字は選手を売った利益（6550万ユーロ）から。ハト・ブロビー・テイラーの移籍。
#   ★他の財政回と軸を重ねない：10/29 フランクフルト＝出場を決めた年のお金の入る年のずれ、10/28 ベンフィカ＝本業の黒字、10/27 シュツットガルト＝伸び率と放映権。
#     今回は「本業は赤字のまま、売却益で黒字」。
#   ★アルファベット（AG・UEFA・CL・NV）は読み上げに出さない。「クラブの運営会社」と言う。
#   ★選手の名前は移籍の3人（クラブの発表に載っている）だけ。監督の話は「解任の費用」の1行だけ（名前は出さない）。女子の話・中止になった試合の経緯（騒ぎ）は入れない（「観客への補償」の費用の1行だけ）。
#
# **決算期**：AFC Ajax NV（上場しているクラブの運営会社）は7月〜6月。2025/26 は 2025-07-01〜2026-06-30。発表は 2026-09-25。監査済み（PwC の適正意見、2026-09-25）。
#
# **出どころ（読んだもの。2026-10-31 に requests で PDF を取って pypdf で全文を読んだ）**
#   ○ クラブ公式のプレスリリース「Jaarcijfers AFC Ajax NV」（2026-09-25、4頁）
#       https://www.ajax.nl/media/0k4ljz0e/persbericht-jaarcijfers-afc-ajax-nv-per-30-juni-2026-def.pdf
#       「Ajax heeft het boekjaar 2025/2026 afgesloten met een nettowinst van € 2,0 miljoen ten opzichte van een verlies van € 37,3 miljoen in het vorige boekjaar.」
#       「In de League Phase van de UEFA Champions League eindigde Ajax als 32e, waardoor kwalificatie voor de knock-outfase uitbleef. In de Eredivisie eindigde Ajax op de vijfde plaats. Via de play-offs plaatste Ajax zich voor de tweede kwalificatieronde van de UEFA Conference League.」
#       「De netto-omzet steeg met € 10,2 miljoen (+6%) naar € 188,3 miljoen, hoofdzakelijk door hogere Europese premies」
#       「De kosten stegen met € 9,0 miljoen naar € 206,5 miljoen (+5%). ... hogere salariskosten in het betaald voetbal vanwege deelname aan de UEFA Champions League en door diverse eenmalige financiële tegenvallers, waaronder de compensatie voor toeschouwers voor de gestaakte wedstrijd ... en het ontslag van de hoofdtrainer gedurende het seizoen.」
#       「Het operationeel resultaat kwam uit op € 18,2 miljoen negatief, tegenover ... € 19,4 miljoen negatief in 2024/2025.」
#       「Het resultaat uit transfers van spelers bedroeg € 65,5 miljoen. ... Jorrel Hato naar Chelsea, Brian Brobbey naar Sunderland en Kenneth Taylor naar Lazio Roma ... Na afschrijvingen op vergoedingssommen bedroeg het transferresultaat € 26,7 miljoen positief (2024/2025: € 31,0 miljoen negatief).」
#       「eigen vermogen € 191,0 miljoen」
#       「Voor het boekjaar 2026/2027 zal de deelname aan de UEFA Conference League, ten opzichte van deelname aan de UEFA Champions League in 2025/2026, druk zetten op de omzet. Ajax blijft daarom sturen op kostenbeheersing en financiële discipline. De vanaf 1 juli 2026 gerealiseerde transferresultaten, waaronder de transfers van Sean Steur naar Newcastle United FC en Mika Godts naar Paris Saint-Germain, zullen naar verwachting positief bijdragen aan het resultaat over 2026/2027.」
#       表（x €1 miljoen）：Netto-omzet 188,3／178,1、Bedrijfslasten 206,5／197,5、Bedrijfsresultaat vóór afschrijving en resultaat vergoedingssommen −18,2／−19,4、Afschrijving vergoedingssommen −38,8／−41,3、Resultaat vergoedingssommen 65,5／10,3、Saldo 26,7／−31,0、Financieel resultaat en waardeveranderingen −5,3／−1,1、Belastingen en aandeel derden −1,2／+14,2、Resultaat na belastingen 2,0／−37,3
#   ○ クラブ公式の年次報告書「Jaarverslag 2025/2026」（128頁、監査済み）https://www.ajax.nl/media/45peoljn/ajax-jaarverslag-2025_2026-def.pdf
#       セグメント表「Netto-omzet (24)」（千ユーロ、2025/26／2024/25）：Recettes competitie... 9.473／9.455、Recettes Europese competities 9.567／12.533、Premies Europese competities 43.521／20.752、Seizoenkaarten 14.553／14.799、Business-seats en skybox-plaatsen 23.968／23.038、Indirecte wedstrijdbaten 3.461／4.440、Partnerships 42.541／42.460、Televisie 11.367／11.724、Merchandising 26.085／33.408、Overige baten 3.743／5.520、Totaal 188.279／178.129
#       損益計算書：Lonen, salarissen en sociale lasten −120.597／−109.110、Afschrijvingen vergoedingssommen −38.840／−41.344、Resultaat vergoedingssommen 65.526／10.333、Financiële baten 3.099／8.719、Financiële lasten −8.429／−10.723、Resultaat vóór belastingen 3.138／−51.504、Belastingen −1.163／+14.165、Resultaat na belastingen 1.975／−37.339
#       本文「De totale kaartverkoop daalde echter met € 2,3 miljoen naar € 57,6 miljoen」「De Europese premies stegen met € 22,7 miljoen naar € 43,5 miljoen」「De omzet van merchandise daalde met € 7,3 miljoen naar € 26,1 miljoen」「Lonen... toegenomen met € 11,5 miljoen naar € 120,6 miljoen (+11%) ... als gevolg van het spelen in de UEFA Champions League, hogere kosten afkoopsommen en hogere vergoedingen tekengeld」
#       人件費の内訳（注26）：選手 76,2／67,3、技術・医療スタッフ 18,4／16,9（百万ユーロ）
#   ○ 前の年のプレスリリース（2025-09-29）https://www.ajax.nl/media/0qtdntsf/persbericht-jaarcijfers-afc-ajax-nv-per-30-juni-2025.pdf（2024/25：収入178,1・営業−19,4・売却益10,3・最終−37,3・純資産189,1、ヨーロッパリーグ16強・エールディヴィジ2位）
#   ○ 英語版 Wikipedia「2026–27 AFC Ajax season」（上の「今季も1部」）
#   ○ デロイト Football Money League 2026（2024/25）一次ページ：1〜30位にアヤックスは無い（30位ブレントフォード 206.0）。2026-10-31 に requests で確認。
#   × 確かめられなかったもの：ハト・ブロビー・テイラーの移籍金（クラブは「売却益の合計 6550万」だけ書く。台本に個別の額を入れない）、
#       デロイトの2025/26 の順位（2026年版は2024/25 まで）、今季の収入の見込み、オーナーなどの話（入れない）。
#
# 自分で計算した数（検算済み）
#   内訳（2025/26）：欧州大会の賞金 43.521／スポンサー 42.541／試合の日（国内recettes 9.473＋欧州recettes 9.567＋シーズンチケット 14.553＋ビジネスシート 23.968＝57.561）／グッズ 26.085／テレビ 11.367／その他（間接の試合収入 3.461＋その他 3.743＝7.204）。合計 188.279 ✓
#   内訳（2024/25）：賞金 20.752／スポンサー 42.460／試合の日（9.455＋12.533＋14.799＋23.038＝59.825）／グッズ 33.408／テレビ 11.724／その他（4.440＋5.520＝9.960）。合計 178.129 ✓
#   収入の増え：188.279−178.129＝10.150（発表は +10.2 ✓）
#   賞金の増え：43.521−20.752＝22.769（発表は +22.7／約2300万 ✓）、倍率 43.521÷20.752＝2.097→2倍あまり
#   賞金が収入に占める割合：43.521÷188.279＝23.1%／20.752÷178.129＝11.65%→約12%
#   賞金を除く収入：188.279−43.521＝144.758／178.129−20.752＝157.377。差 −12.619（−8.0%）→約1260万・約8%の減り
#   グッズの減り：33.408−26.085＝7.323（−21.9%）／試合の日の減り：59.825−57.561＝2.264
#   費用：197.5→206.5（+9.0, +4.6%＝発表「+5%」✓）
#   人件費：109.110→120.597＝+11.487（+10.5%＝発表「+11%」）。収入に対する割合 120.597÷188.279＝64.05%→64.1%／109.110÷178.129＝61.25%→61.3%
#   選手の人件費：67.3→76.2＝+8.9
#   人件費の増え÷賞金の増え：11.487÷22.769＝50.5%→約半分
#   本業の損益：188.279−206.5（概数）＝−18.2 ✓（損益計算書の −18.218）。2年連続のマイナス（−19.405、−18.218）
#   売却益 65.526÷収入 188.279＝34.8%→約35%。前の年の売却益 10.333 → 65.526＝6.34倍→6倍あまり
#   本業 −18.218＋償却 −38.840＝−57.058→約マイナス5710万。＋売却益 65.526＝＋8.468（損益計算書の8.468 ✓）
#   売却益を除く項目の合計：−18.218−38.840−5.330（金融 3.099−8.429）−1.163＝−63.551→約マイナス6350万。最終 1.975−65.526＝−63.551 ✓
#   最終の損益：8.468−5.330−1.163＝1.975 ✓（発表 2,0）
#   前の年：−19.405−41.344＋10.333−1.088＋14.165＝−37.339 ✓
#
# 写真：assets/images/20261102_finance_ajax/（Commons、出典は credits.json）。01 内部（ピッチ、ヨハン・クライフ・アレナ）、02 空撮、03 外観、04 スタンド（2012年のNAC戦）。
