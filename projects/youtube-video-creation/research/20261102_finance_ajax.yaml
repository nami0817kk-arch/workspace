- id: view
  viewpoint: true
  heading: 見立て・アヤックスの黒字は、来年も続くのか
  tier: 背景
  telop: 売った利益は収入の約35%。これを除くと約6350万ユーロのマイナス
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（アヤックスの決算）
    columns: [比べ, 答え]
    rows:
