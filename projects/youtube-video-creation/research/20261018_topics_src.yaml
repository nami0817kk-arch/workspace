  head: 前田大然、プレミア初ゴールで「夢が叶いました」。マンC戦、イプスウィッチは2-3で惜敗
  why: 17日のマンC戦、前田は21分に移籍後初得点。ウアタラのスルーパスに抜け出し、GKドンナルンマのニアを抜いた（イプスウィッチは2-3で敗戦、前田は71分に交代）。**本人の言葉あり**：試合後の自身のXで「プレミアリーグでの初ゴール。夢が叶いました！」「このゴールは僕にとって本当に特別な意味があって、多くの方々のサポートがなければ成し遂げられなかった」と投稿（サッカーキングが引用）。オニール監督は「練習で取り組んだ形」「高い位置で使ったのはシティの高いラインの背後を突くため」と語った（TWTD経由）。
