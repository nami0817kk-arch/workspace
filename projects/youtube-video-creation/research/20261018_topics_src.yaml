  slot: リーグ・アン
  head: PSGがストラスブールに逆転勝ち。デンベレは途中出場でPKを外しても2ゴール絡み、ルイス・エンリケ「25分でいい」
  why: 17日、ストラスブールが先制（レイナ）、後半にデンベレが同点のアシストと逆転ゴール、ドゥエも得点。ルイス・エンリケは「アシストとゴールに25分必要なら、それ以上プレーする必要はない」と述べた（vi.nlが仏メディアへの発言を引用）。**10/16 の『3月まで休暇を』のデンベレの話の続き**で、今回は試合の結果。
  src: サッカーキング／vi.nl／tmercato
  url: https://www.soccer-king.jp/news/world/fra/20261018/2217802.html
  fmt: quote
  new: true
- num: 24
  slot: リーグ・アン
  head: リールはブレストと1-1。40歳ジルーがPKで同点、首位に立つ機会を逃す
  why: 17日のリーグ・アン第7節。ブレストが先制し、リールは64分にジルーのPKで追いつく。ジルーはゴール後、負傷したティアゴ・サントスの背番号22のユニフォームを掲げて捧げた（ア・ボラ）。上田綺世は 10/17 時点で欠場の見込み。**出場記録は今回の取得物では未確認**。
  src: Foot Mercato（4.2時間前）／ア・ボラ
  url: https://www.footmercato.net/a6691990491322967638-ligue-1-le-losc-rate-loccasion-de-prendre-la-1ere-place-lens-enchaine-a-troyes
  fmt: news
  new: true
- num: 25
  slot: プレミア
  head: マンCの財務規則違反、他の35クラブに総額約8.38億ポンドの影響と英紙が試算。最大はトッテナム
  why: サンがBBCの試算を紹介（フットボールチャンネル経由）。2009/10〜2017/18シーズンが対象で、トッテナムは約1.2億ポンド、ハルは約9,900万ポンド。**実際の損害や賠償額が確定したものではなく、シティは控訴中**。重い話題で、数字は『試算』と明記する。
  src: フットボールチャンネル（17日）／サン／BBC
  url: https://www.footballchannel.jp/2026/10/17/post1034052/
  fmt: news
  new: true
- num: 26
  slot: プレミア
  head: 16歳JJ・ガブリエル（マンU）の移籍先がまもなく決まる。バルサとレアルが先行と報道
  why: ESPNの移籍まとめ。スペイン紙ディアリオ・スポルトによる報道で、バルセロナ近郊でひとり練習中。PSGとバイエルンより、レアルとバルサが先行。**クラブの発表は無く、確度は報道**。同じ記事にはシャーデ（ブレントフォード）にアーセナルとリバプールが関心という別の話（TEAMtalk、6,000万ポンド超）もある。
  src: ESPN（3.2時間前）／ディアリオ・スポルト
  url: https://www.espn.com/soccer/story/_/id/50200287/transfer-rumors-news-jj-gabriel-move-revealed-soon-amid-barcelona-real-madrid-talks
  fmt: news
  new: true
- num: 27
  slot: ラ・リーガ
  head: グアルディオラ、バルセロナに戻り総立ちの拍手。観戦したのはバスケのユーロリーグ
  why: BBCの動画の説明。グアルディオラ（元マンC・バルサ監督）が、バルセロナ対オリンピアコスのバスケットボールの試合を観戦して、観客から総立ちの拍手を受けた。サッカーの試合ではない。短い軽い話題で、動画の材料は少ない。
  src: BBC（14.9時間前）
  url: https://www.bbc.co.uk/sport/videos/cm9dzg38n6j7o?at_medium=RSS&at_campaign=rss
  fmt: news
  new: true
- num: 28
  slot: プレミア
  head: プレミア最高額の先発11人は総額11.6億ユーロ。サリバ、パーマー、ハーランドが入る
  why: トランスファーマルクトの10月更新。リーグ全体の価値は141.0億ユーロ（10月に9.45億ユーロ増）。各ポジションで最も高い選手を選ぶと総額約11.6億ユーロ。GKはドンナルンマ（4,500万）。**推定値のサイトで、クラブの発表ではない**。
  src: トランスファーマルクト（16.9時間前）
