  head: 田中碧のリーズ、18日にマンU戦。英メディアは「昨季の不調を脱した」と解説
  why: フットボールトライブが、英メディアFootball Fancastの記事を転載。1年前は出場機会を失ったが、移籍を要求せず辛抱強く待ったことで、プレミアの強度に慣れたと評価する（リーズは10日のアーセナル戦で今季初黒星）。**同サイトの見出しは「田中碧のせいでリーズのスター選手が退団の危機」と過激だが、本文は田中を持ち上げる内容で、見出しと中身が合わない**。10/17 に契約延長の報道を出している。出典は転載で弱い。**リーズ対マンUは今日18日なので試合後に作る**。田中本人の言葉は無い。
