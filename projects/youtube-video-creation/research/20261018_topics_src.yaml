title: 10月18日の題材（ショート）
lead: 今日は日曜、土曜の試合の翌日で、欧州カップ戦の夜ではありません。日本人は7件、続いて欧州の大きい話を21件。
note: '今日は日曜（18日）。昨夜（17日土曜）のプレミア・ブンデス・ラ・リーガ・セリエA・リーグ・アン・エールディヴィジの試合結果が、一覧の中心です。

  ロマーノなど移籍記者のXは、今回も読めませんでした。移籍の話は、サンデー・ミラー（ギェケレシュ）・ガゼッタ（ライモンド）・ディアリオ・スポルト（JJ・ガブリエル）と、媒体の報道として入れています（どれもクラブの発表は無い）。

  日本人本人の言葉が取れたのは前田大然（自身のX）の1件です。鈴木彩艶・佐野海舟・佐野航大・守田・佐藤・田中碧は、記事・フィードに本人の言葉は見つかりませんでした。

  日本人は7件に留まりました。森下龍矢・岩田智輝は英2部（欧州7リーグの外）、三笘・南野・久保・上田・冨安は 10/14〜17 に出した続報で新しい事実が無いため外しています。

  10/14〜10/17 に出した題材と重なる続報（鈴木・佐野航大・田中碧・ギェケレシュ・マンU・モウリーニョ2件）には 弱い印を付けています。

  今日18日に試合がある題材（リーズ対マンU＝田中碧・カリック、レアル対セビージャ＝モウリーニョ）は試合後に作る決まりです。アーセナルも今日ノッティンガム・フォレスト戦、ブライトン対パレスも18日です。

  取得で読めなかった点：ロマーノ等のX、ガゼッタの有料部分、マルカ・ASの本文の一部（見出しと読めた範囲だけを使用）。ロビーニョ・ジュニアのセリエAデビュー（父は服役中）は、題材として重いため入れていません。

