  head: バルサがベティスに5-2。ヤマルの先制ゴラッソでラ・リーガ開幕9連勝、レアルの記録に並ぶ
  why: 17日のラ・リーガ第9節。10分にヤマルがエリア手前右から左足ミドルで先制。ベティスのファクンド・ベルナルがヤマルに頭突きで退場（54分）し、のちにSNSで「自分を抑えるべきだった」と謝罪した（ア・ボラ・マルカ）。公式戦は11戦全勝、開幕から9連勝（クラブ記録更新、レアルのリーグ記録に並ぶ）。フリックは「いまのところ世界最高の選手」とヤマルを評した（AS）。次節は25日のクラシコ。**10/17 に出したフリックの出場時間の話とは別の、試合の話**。
