    text: 愛称は「赤い人たち」。ほかに、「南の星」とも呼ばれます。
    no_telop: true
  - image: assets/stats/bd_bayern_map.png
    text: ホームタウンはミュンヘン。人口は**158万人**で、ドイツで3番目に大きな街です。
    no_telop: true
  - image: assets/backgrounds/stadium_バイエルン.png
    text: 本拠地はアリアンツ・アレーナ。**7万5000人**が入ります。
  - image: assets/backgrounds/stadium_バイエルン.png
    text: 18クラブで、ドルトムントに次ぐ2番目の大きさです。
  - image: assets/stats/bd_bayern_data4.png
    text: オーナーは、クラブの会員組織。株の**75%**を持ちます。アディダス、アウディ、アリアンツは各8.33%。
    no_telop: true
  - image: assets/stats/bd_bayern_cups.png
    text: ブンデスリーガの優勝は**34回**。1932年を含めたドイツ王者は**35回**、カップは**21回**です。
    no_telop: true
  - image: assets/stats/bd_bayern_data6.png
    text: 最多出場は、トーマス・ミュラー。このクラブで**756試合**に出ました。
    no_telop: true
  - image: assets/stats/bd_bayern_data7.png
