  - text: 日本代表の伊藤洋輝が、バイエルンにいます。
    image: assets/stats/bd_bayern_data_r1.png
    no_telop: true
  - text: 今季は第6節まで無敗。22得点で、首位に立っています。
    image: assets/stats/bd_bayern_data_r2.png
    no_telop: true
  - text: 10月21日は、チャンピオンズリーグで、アーセナルを迎えます。
    image: assets/stats/bd_bayern_data_r3.png
    no_telop: true
  - image: assets/stats/bd_bayern_data0.png
