- id: history
  heading: ブンデスリーガに、入れなかった年
  tier: 背景
  telop: 1963年、南部の5クラブに入れず。1965年に昇格
  narrator: 解説
  card:
    type: table
    title: 1963年、ブンデスリーガの発足
    columns: &id001
    - ''
    - ''
    rows:
    - - 1963年
      - 全国リーグが発足
    - - 南部から選ばれた数
      - 5クラブ
  say:
  - 1963年、ドイツに、全国リーグのブンデスリーガが生まれます。
  - ドイツ南部から選ばれたのは、5クラブ。物差しは、過去12年の成績でした。
  - バイエルンは、その順位が**6位**。選ばれなかったのです。
  - text: 同じ街の1860ミュンヘンは7位でしたが、直前の優勝を評価されて入りました。
    card:
      type: table
      title: 1963年、ブンデスリーガの発足
      columns: *id001
      rows:
      - - バイエルン
        - 過去12年で6位。選ばれず
  - 若い選手は、ベッケンバウアー、ゲルト・ミュラー、マイヤー。
  - このチームで、**1965年**に昇格します。
  sources:
  - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  bg: assets/backgrounds/stadium_バイエルン_in.png
  official: false
- id: history2
  heading: 3年連続、ヨーロッパの頂点
  tier: 背景
  telop: 1974〜76年、ヨーロッパ杯3連覇
  narrator: 解説
  card:
    type: table
    title: ヨーロッパ杯、3連覇
    columns: &id002
    - ''
    - ''
    rows:
    - - 1974年
      - 初優勝。再試合で4対0
  say:
  - 1967年、バイエルンは、初めてヨーロッパの大会を制します。
  - 会場は、各国のカップ優勝クラブが集まる、カップウィナーズカップ。
  - 決勝は、レンジャーズに1対0でした。
  - text: 1974年は、ヨーロッパ杯の決勝。いまのチャンピオンズリーグの前身です。
    card:
      type: table
      title: ヨーロッパ杯、3連覇
      columns: *id002
      rows:
      - - 1975年
        - リーズを破る
  - アトレティコ・マドリードと引き分けます。
  - text: 再試合は**4対0**で勝って、初優勝です。
    card:
      type: table
      title: ヨーロッパ杯、3連覇
      columns: *id002
      rows:
      - - 1976年
        - サンテティエンヌを破り3連覇
  - 1975年はリーズ、1976年はサンテティエンヌを破りました。
  - 3年連続の優勝は、史上3番目のクラブでした。
  sources:
  - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  bg: assets/backgrounds/stadium_バイエルン_in.png
  official: false
- id: history3
  heading: ドイツ初の3冠
  tier: 背景
  telop: 2013年、リーグ勝ち点91の記録とドイツ初の3冠
  narrator: 解説
  card:
    type: table
    title: 2012-13の3冠
    columns: &id003
    - ''
    - ''
    rows:
    - - リーグ
      - 勝ち点91。最多記録
    - - 欧州の決勝
      - ドルトムントに2対1
  say:
  - 2012年、バイエルンは、チャンピオンズリーグの決勝を本拠地で戦います。
  - ところが、ピーケー戦でチェルシーに敗れました。
  - text: その翌シーズン。リーグは、勝ち点**91**の最多記録で優勝します。
    card:
      type: table
      title: 2012-13の3冠
      columns: *id003
      rows:
      - - 1週間後
        - カップも優勝。3冠
  - チャンピオンズリーグの決勝は、同じドイツのドルトムントに**2対1**。
  - 1週間後のカップ決勝にも勝って、ドイツのクラブとして初めて、3冠を達成しました。
  sources:
  - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  bg: assets/backgrounds/stadium_バイエルン_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 攻める。黒字を続ける。会員43万人
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 攻めて点を取り続ける
    - - 運営の型
      - 27年連続の黒字
    - - クラブの気質
      - 会員43万人のクラブ
  say:
  - text: プレーの色は、攻めて、点を取り続けること。
    image: assets/photos/bd/bayern/bayern_manager_841b42a0.jpg
  - 昨季のリーグ戦は**122得点**。それまでの最多は、1971-72の**101得点**でした。
  - 運営の型は、黒字。収入は**9億7830万ユーロ**で、**27年**続けて利益を出しています。
  - 気質は「ミア・サン・ミア」。バイエルン語で、「我々は我々だ」という意味です。
  - 会員は**43万人**を超え、世界で2番目に大きなスポーツクラブです。
  sources:
  - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  - https://en.wikipedia.org/wiki/2025%E2%80%9326_Bundesliga
  bg: assets/backgrounds/stadium_バイエルン_in.png
  official: false
- id: episode
  heading: 体操クラブを出た夜に
  tier: 背景
  telop: 1900年2月27日。その夜のうちに、新しいクラブができた
  narrator: 解説
  card:
    type: table
    title: 体操クラブを出た夜に
    columns: &id004
    - ''
    - ''
    rows:
    - - 1900年2月27日
      - 体操クラブの総会
    - - 決まったこと
      - サッカー部は連盟に入れない
  say:
  - 1900年2月27日、ミュンヘンの体操クラブの総会が開かれました。
  - 決まったのは、サッカー部員は、ドイツサッカー連盟に入れない、ということ。
  - text: サッカー部の11人は、その場を出て、同じ晩に新しいクラブを作りました。
    card:
      type: table
      title: 体操クラブを出た夜に
      columns: *id004
      rows:
      - - その夜
        - 11人が出て、新クラブを作る
  - それが、バイエルンです。数か月のうちに、地元のクラブに大勝を重ねました。
  sources:
  - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  bg: assets/backgrounds/stadium_バイエルン_in.png
  official: false
