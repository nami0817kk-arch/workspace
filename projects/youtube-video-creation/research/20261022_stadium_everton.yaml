# スタジアム紹介シリーズ：エヴァートンの本拠地（ヒル・ディキンソン・スタジアム、10/22）。雛形は 10/21 ニューカッスルの回。
# 軸：A＝収容5万2769席はプレミア6位（旧グディソン・パークより1万3355席多い）／B＝広げられない旧本拠地を離れるのに、移転案が3回つぶれ、使われなくなった港（ブラムリー・ムーア・ドック）に建った。
# 収容：PL公式ハンドブック2026/27（Ground Capacity at start of the Season、取得2026-10-21の控え research/raw/20261021_nufc_plhandbook.txt の同じ表）。
#   エヴァートン 52,769／アーセナル 60,704／ニューカッスル 52,729。60,704-52,769=7,935／52,769-52,729=40。ピッチ 105×68m（同ハンドブック）。所在 Bramley-Moore Dock, Liverpool L5 9SR。
# 旧本拠地：グディソン・パークの収容 39,414（ウィキペディア en "Goodison Park"）。52,769-39,414=13,355（自分で引いた）。52,769÷39,414=1.339→1.34倍（自分で割った）。
# 入場（PL公式の試合API、取得2026-10-22。控え research/raw/20261022_everton_matches_pl_api.json）：
#   2024/25 のグディソンのホーム19試合＝合計744,587・平均39,188.8（最多39,572・最少38,742、最終戦 5/18 サウサンプトン戦 39,201）。
#   2025/26 のヒル・ディキンソンのホーム19試合＝合計990,504・平均52,131.8（最多52,590＝5/17 サンダーランド戦・最少50,196＝2/10 ボーンマス戦）。
#   2026/27 ここまでのホーム4試合＝51,820／52,302／52,008／52,271、合計208,401・平均52,100.25。
#   自分で数えた：52,132-39,189=12,943／52,132÷39,189=1.33／990,504-744,587=245,917／52,132÷52,769=98.8%／52,590→52,769-52,590=179／50,196÷52,769=95.1%／52,100÷52,769=98.7%。
#   初戦 2025-08-24 ブライトン戦 2対0 の入場 51,759（API・ウィキペディアで一致）。
# 割れる点（台本で断った）：着工が2021年7月（ウィキペディア"Hill Dickinson Stadium"）か8月（"Bramley-Moore Dock"）か→「2021年の夏」と言う／移転案の最初の発表が1996年（HDS）か1997年（Goodison Park）か→「1990年代の後半、年は記事のあいだで1年割れる」と言う／総費用（約7.5億〜8億ポンド超など資料で幅がある。クラブの契約額5億の報道もあるが一次情報で確かめられなかった）→言わない。
# 言わなかった割れ：命名権の金額（クラブの発表文に無く、報道は600万〜1000万ポンド/年で割れる）／UEFA は会場名を「Everton Stadium」と書く（台本では「ユーロ2028の会場」とだけ言う）／ウィキペディア"HDS"の「会場は10」に対し UEFA の案内は9会場。
# 一次情報：①クラブの命名権の発表文（ヒル・ディキンソン社の公式サイトに全文、2025-05-16）＝52,888席・長期契約・金額なし。②ユネスコ世界遺産センター（whc.unesco.org/en/news/2314、2021-07-21）＝リヴァプールの削除、2004年登録・2012年危機遺産・3件目。③PL公式ハンドブックと試合API。④UEFA ユーロ2028の会場案内（uefa.com、WebFetch）＝Everton Stadium・大会時収容50,000・試合5つ（6/11・14・17・20、6/24 は決勝トーナメント1回戦）。
# 背景（ウィキペディア）：移転案の歩み、ドックの歴史（1848年開港・ジェシー・ハートリー・1988年に石炭の積み出し終了）、2017年の合意、2021年2月の承認、保存修復に最大5500万ポンド、2024年2月に構造完成・12月に引き渡し、2025年の試験の試合（2/17 ユース1万人・3/23 21歳以下2万5000人・8/9 ローマ戦 5万837人）、119席減った理由（ホームとアウェーの分離線・放送設備・カメラ位置）。
# 日本との接点：調べたが無し（ウィキデータで日本代表歴のあるエヴァートン所属選手は0。取材メモ pl_data の登録選手にも日本人なし）。無理に入れない。
# 重なりを避けた：10/21 ニューカッスルの回（稼働率の見せ方は同じ型だが数字は別）、アンフィールドの回の「1892年にエヴァートンが去った」話（旧本拠地の起源は言わない）、クラブ紹介⑨の話。女子チームの話はしない（旧本拠地の今の使い道は言わない）。
# 読めなかった：evertonfc.com の公式記事（本文を読める形で取れず。クラブ発表文はヒル・ディキンソン社のサイトで読んだ）。ブラウザ操作・JS実行は不使用（requests と WebFetch。WebSearch は題名とURLを探すためだけ）。
# 写真：assets/images/20261022_stadium_everton/（Commons、出典は credits.json）。人物は特定していない。
