  say:
  - text: 動けない旧本拠地から、出ようとした案は、何度もありました。
    image: assets/images/20261022_stadium_everton/08_w.jpg
    card: none
  - text: 1990年代の後半、当時の会長が、6万席の新しい競技場を発表します。
    image: assets/images/20261022_stadium_everton/08_w.jpg
    card:
      <<: *id_plans
      highlight_row: 0
  - text: 発表の年は、ウィキペディアの記事のあいだで、1年割れます。
    image: assets/images/20261022_stadium_everton/08_w.jpg
    card: none
  - text: 2001年。キングス・ドックに、5万5000席の案が出ます。
    emph: true
    image: assets/images/20261022_stadium_everton/07_w.jpg
    card:
      <<: *id_plans
      highlight_row: 1
  - text: 完成は2005年ごろの予定でした。資金が足りず、2003年4月に断念します。
    image: assets/images/20261022_stadium_everton/07_w.jpg
    card: none
  - text: 2006年、次の候補は、市の外の町、キルビー。大手スーパーのテスコと組む案です。
    image: assets/images/20261022_stadium_everton/04_w.jpg
    card:
      <<: *id_plans
      highlight_row: 2
  - text: クラブは、ファン投票を開きます。賛成59％、反対41％。
    emph: true
    image: assets/images/20261022_stadium_everton/04_w.jpg
    card: none
  - text: それでも、市の外に出ることに、反対する声がありました。
    image: assets/images/20261022_stadium_everton/04_w.jpg
    card: none
  - text: 近くの自治体は、大きな店の影響も、心配しました。
    image: assets/images/20261022_stadium_everton/08_w.jpg
    card: none
  - text: 公聴会のあと、国は案を退けます。2009年11月のことです。
    image: assets/images/20261022_stadium_everton/08_w.jpg
    card: none
  - text: 2014年9月、今度は市と組んで、ウォルトン・ホール・パークに建てる案が出ます。
    image: assets/images/20261022_stadium_everton/07_w.jpg
    card:
      <<: *id_plans
      highlight_row: 3
