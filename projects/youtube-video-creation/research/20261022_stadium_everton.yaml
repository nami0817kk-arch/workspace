  - text: ユネスコの委員会が、リヴァプールの港町を、世界遺産から外します。
    emph: true
    image: assets/images/20261022_stadium_everton/03_w.jpg
    card: &id_unesco
      type: document
      label: ユネスコ世界遺産センターの発表（2021年7月21日）の訳
      paragraphs:
      - 世界遺産委員会は、「リヴァプール海商都市」を世界遺産リストから削除すると決めた。
      - 理由は、遺産の価値を伝える特徴の、取り返しのつかない喪失。
      - 2004年に登録され、2012年に、リヴァプール・ウォーターズの開発への懸念で、危機遺産リストに載った。
      - 削除は、ドイツのエルベ渓谷、オマーンのアラビアオリックス保護区に続き、3件目。
      highlight:
      - 取り返しのつかない
      - 3件目
  - text: 外れたのは、世界で3件目です。
    image: assets/images/20261022_stadium_everton/06_w.jpg
    card: *id_unesco
  - text: ユネスコの発表文が挙げるのは、リヴァプール・ウォーターズなど、港町の開発です。
    image: assets/images/20261022_stadium_everton/06_w.jpg
    card: none
  - text: この競技場の計画も、理由の1つに数えられた、との記述があります。
    image: assets/images/20261022_stadium_everton/03_w.jpg
    card: none
  - text: 工事は、2021年の夏に始まりました。ドックには、マージー川の砂を詰めました。
    emph: true
    image: assets/images/20261022_stadium_everton/03_w.jpg
    card: none
  - text: 2024年12月、施工会社から、クラブに引き渡されます。
    image: assets/images/20261022_stadium_everton/01_w.jpg
    card:
      <<: *id_dock
      highlight_row: 5
