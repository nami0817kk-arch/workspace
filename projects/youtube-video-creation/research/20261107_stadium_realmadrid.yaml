# スタジアム紹介シリーズ：レアル・マドリードの本拠地（ベルナベウ、11/7 予定）。雛形は 11/5 バルセロナの回。
# 題材の選び方（2026-11-05）：指示書 20261107 の推し（ラ・リーガの続き。アトレティコ 11/1・バルセロナ 11/5 は済み）。
#   重なりの確認：scripts/*stadium_* にベルナベウ・レアルは無し。covered.yaml・posted.json にも stadium_realmadrid は無い。
#   直近30日のレアルの本：財政 finance_realmadrid（10/9、改修の投資14億770万ユーロ・借入11億7000万）・finance_real_barca（10/18）・ニュースのショート数本。
#     クラブ紹介 ll17 は 9/26 で30日の外。財政と重ねないよう、この回は改修の費用の額は言わない（借入の総額を1行だけ）。軸は「芝を地下にしまう」「収容の数字がそろわない」「W杯決勝の8万席」。
#   picks（research/20261107_picks.txt）に「スタジアム: レアル・マドリード（ベルナベウ）」を先に書いた（ユニフォームの担当がレアルを避けるため）。
# 今季のラ・リーガ所属（一次情報）：ESPN の ラ・リーガ（esp.1）2026-27 のレアル・マドリードの日程（teams/86/schedule?season=2026）に 8/22〜11/1 の11試合。会場は Santiago Bernabéu。
# 収容（クラブの公式の数字は無い。数字が割れていることそのものを見立てにする）：
#   改修の計画 8万1044／会長フロレンティーノ・ペレス「8万、上下1000」／FIFA の評価報告（2030年W杯の招致の書類）7万8297（StadiumDB 2025-03-04・2026-03-07）。
#   FIFA が決勝に求めるのは8万席（同）。8万−7万8297＝1703（StadiumDB 2026-03-07「約1700席の追加を検討」と合う）。
#   ウィキペディア en・es の表の 8万3186（2024年から）は出どころが書かれていないので言わない（9/26 のクラブ紹介 ll17 では 8万3186 と言っている）。
#   NFL 2025-11-16 の入場 7万8610（ウィキペディア en、Commons の写真の画面にも 78,610）。
# 入場（ESPN の試合記録。11月5日時点。記録が0の2試合＝8/30 マラガ・9/12 ラージョは使わない）：
#   8/26 レアル・ソシエダ 7万2226（4対1、久保建英が先発）／9/8 インテル（CL）7万4858（2対1）／10/10 ビジャレアル 7万5242（1対0）／10/18 セビージャ 7万3907（4対1）／10/21 ライプツィヒ（CL）7万3016（4対1）
#   合計36万9249・平均7万3849.8＝約7万3850。最多7万5242。8万−7万5242＝4758。
# 芝（ATJ の事例ページ・ウィキペディア es・SENER の発表 2021-12-09）：板6枚、1枚 107×11.6m・約1500トン、地下約30mの「ヒポゲウム」（光・水・空調のある部屋）。動かす時間は5時間未満と6時間で割れるので言わない。
# 屋根：開け閉めに15〜20分（ウィキペディア es）。360度の画面（同）。
# 歩み（ウィキペディア en・es）：1947年12月14日開場、最初の収容7万5145。1955年1月4日 会員の総会で会長サンティアゴ・ベルナベウの名に。会長は1943〜1978年。
#   最多の入場 12万9690（1956年4月19日 ミラン戦、en）。欧州杯・CL決勝 1957（レアル2対0フィオレンティーナ）・1969・1980・2010（インテル2対0バイエルン）。1964年欧州選手権決勝。1982年W杯決勝（イタリア3対1西ドイツ）。2018年リベルタドーレス杯決勝の第2戦（リーベル3対1ボカ）。
#   改修：2014年1月31日 設計の案が決まる／2015年2月 裁判所が街の計画の変更を無効に／2017年5月31日 マドリード市が承認／2019年6月 工事開始（FCC）。
#   2020年3月1日 クラシコ2対0が最後→アルフレド・ディ・ステファノ・スタジアム→2021年9月12日 セルタ戦5対2で560日ぶりに戻る（人数を絞って1万9874人。AP など）。
#   借入は11億7000万ユーロ、年6000万を30年（ウィキペディア es）。2025年11月に名前から「サンティアゴ」を外し「ベルナベウ」に（ウィキペディア es、Football España 2025-11-12）。
# 試合以外の催し：2024年5月29〜30日 テイラー・スウィフト（改修後初のコンサート）／2024年7月 カロルG 4公演／2024年9月から大きなコンサートは止まったまま（近くの住民の音の苦情。StadiumDB 2026-05・06）。
#   2025年11月16日 NFL ドルフィンズ16対13コマンダーズ（延長）7万8610／2025年12月 クリスマスの催し（Commons の写真）／2026年4月23〜30日 マドリード・オープンの練習コート（ATP・puntodebreak。試合は別会場）。
#   裁判の中身（2026年5月の判決・6月の最高裁）は言わない（法の話に寄せない。苦情で止まった事実だけ）。
# 2030年W杯決勝：FIFA は未発表（StadiumDB 2026-03 は「会場の一覧は2026年12月に承認」、10月の報道は「2028年より前には発表しない」）。台本は「まだ決まっていない」だけ。
# 日本との接点（サッカーの縁）：①工事が始まった2019年6月に久保建英がレアルに入った（同じ月。1行）②8/26 のレアル・ソシエダ戦で久保が先発（ESPN の先発表）。
# 言わなかったもの：改修の費用の総額（財政の回と重なる・出どころで割れる）／8万3186／コンサートの裁判／テニスの選手名／2030年決勝の見込みの%。
