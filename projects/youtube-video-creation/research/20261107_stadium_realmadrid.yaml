- id: events
  heading: 芝を地下にしまって、何に使ってきたのか
  bg: assets/images/20261107_stadium_realmadrid/07_w.jpg
  tier: 報道
  telop: 大きなコンサートは2024年9月から止まったまま。2025年11月のNFLには7万8610人
  narrator: 解説
  card: &id_ev
