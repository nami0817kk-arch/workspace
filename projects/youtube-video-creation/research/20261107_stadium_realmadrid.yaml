  say:
  - text: 芝をしまう仕組みを作ったのは、スペインの技術会社です。
    image: assets/images/20261107_stadium_realmadrid/03_w.jpg
    card: none
  - text: 芝の板は地下で、光と水と空調のある部屋に収まり、傷まずに待ちます。
    image: assets/images/20261107_stadium_realmadrid/03_w.jpg
    card: none
  - text: 空いた床は、コンサートや展示の会場になります。
    image: assets/images/20261107_stadium_realmadrid/07_w.jpg
    card: none
  - text: 2024年5月、改修のあと初めてのコンサート。テイラー・スウィフトの2日間でした。
    image: assets/images/20261107_stadium_realmadrid/08_w.jpg
    card:
      <<: *id_ev
      highlight_row: 0
  - text: ところが、2024年の9月から、大きなコンサートは止まったまま。
    emph: true
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card:
      <<: *id_ev
      highlight_row: 1
  - text: 近くに住む人たちから、音の苦情が出たためです。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card: none
  - text: 代わりに開いたのが、アメリカンフットボールでした。
    image: assets/images/20261107_stadium_realmadrid/04_w.jpg
    card: none
  - text: 2025年11月16日、アメリカのプロリーグ、エヌエフエルの公式戦です。
    image: assets/images/20261107_stadium_realmadrid/04_w.jpg
    card: none
  - text: 入ったのは、7万8610人です。
    emph: true
    image: assets/images/20261107_stadium_realmadrid/05_w.jpg
    card: none
  - text: 12月には、芝をしまった床で、クリスマスの催しも開かれました。
    image: assets/images/20261107_stadium_realmadrid/07_w.jpg
    card:
      <<: *id_ev
      highlight_row: 3
  - text: 2026年4月には、テニスの大会の練習コートが、ここに置かれています。
    image: assets/images/20261107_stadium_realmadrid/07_w.jpg
    card:
      <<: *id_ev
      highlight_row: 4
