  say:
  - text: この器の始まりは、1947年の12月。最初の収容は、7万5145人でした。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card:
      <<: *id_hist
      highlight_row: 0
  - text: 1955年1月、会員の総会で、当時の会長サンティアゴ・ベルナベウの名が付きます。
    emph: true
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card:
      <<: *id_hist
      highlight_row: 1
  - text: この器が建ったのは、その会長の時代でした。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card: none
  - text: 記録に残る最も多い入場は、1956年4月のミラン戦。12万9690人。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card:
      <<: *id_hist
      highlight_row: 2
  - text: 開いたときの収容と比べて、1.7倍あまり。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card:
      <<: *id_hist
      highlight_row: 2
  - text: ヨーロッパの王者を決める大会の決勝は、ここで4度。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card: none
  - text: 1957年には、地元のレアルが勝ちました。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card: none
  - text: 1982年には、ワールドカップの決勝。イタリアが、西ドイツを3対1で破りました。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card:
      <<: *id_hist
      highlight_row: 3
  - text: 2010年には、チャンピオンズリーグの決勝。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card: none
  - text: 優勝はインテル。バイエルンに2点差を付けました。
    image: assets/images/20261107_stadium_realmadrid/01_w.jpg
    card:
      <<: *id_hist
      highlight_row: 4
  - text: 2018年には、南米の王者を決める大会の決勝まで。
    image: assets/images/20261107_stadium_realmadrid/08_w.jpg
    card: none
  - text: リーベル・プレートとボカの一戦が、海を渡ってマドリードへ来ました。
    image: assets/images/20261107_stadium_realmadrid/08_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Santiago_Bernab%C3%A9u_Stadium
  - https://es.wikipedia.org/wiki/Estadio_Santiago_Bernab%C3%A9u
- id: rebuild
  heading: 改修は、なぜ工事の始まりまで5年かかったのか
  bg: assets/images/20261107_stadium_realmadrid/06_w.jpg
  tier: 背景
  telop: 案は2014年に決まり、工事は2019年6月から。2021年9月に560日ぶりに戻った
  narrator: 解説
  card: &id_reb
    type: timeline
    title: 改修の歩み
    rows:
    - - 2014年1月
      - 設計の案が決まる
    - - 2015年2月
      - 裁判所が街の計画の変更を無効に
    - - 2017年5月
      - マドリード市が認める
    - - 2019年6月
      - 工事が始まる
    - - 2021年9月
      - 560日ぶりに戻る
    focus: 2019年6月
    highlight_row: 0
  say:
  - text: いまの形に作り直す設計の案が決まったのは、2014年の1月です。
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card:
      <<: *id_reb
      highlight_row: 0
  - text: ところが2015年、裁判所が街の計画の変更を無効にして、話は止まります。
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card:
      <<: *id_reb
      highlight_row: 1
  - text: 案を作り直し、マドリード市が認めたのは、2017年の5月。
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card:
      <<: *id_reb
      highlight_row: 2
  - text: 重機が入ったのは、2019年の6月。案が決まってから、5年あまりあとでした。
    emph: true
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card:
      <<: *id_reb
      highlight_row: 3
  - text: 同じ2019年の6月、久保建英が、レアル・マドリードに入っています。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card: none
  - text: 2020年3月のクラシコを最後に、レアルはベルナベウを離れます。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card: none
  - text: その後のホームの試合は、練習場にある小さなスタジアムで。
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card: none
  - text: 名前は、アルフレド・ディ・ステファノ・スタジアムです。
    image: assets/images/20261107_stadium_realmadrid/06_w.jpg
    card: none
  - text: 戻ったのは、2021年9月12日。560日ぶりでした。
    emph: true
    image: assets/images/20261107_stadium_realmadrid/08_w.jpg
    card:
      <<: *id_reb
      highlight_row: 4
  - text: 工事中のまま迎えたセルタ戦は、5対2の勝ち。人数を絞り、1万9874人の前でした。
    image: assets/images/20261107_stadium_realmadrid/08_w.jpg
    card:
      <<: *id_reb
      highlight_row: 4
  - text: 改修のための借り入れは、全部で11億7000万ユーロ。30年かけて返していきます。
    image: assets/images/20261107_stadium_realmadrid/02_w.jpg
    card: none
