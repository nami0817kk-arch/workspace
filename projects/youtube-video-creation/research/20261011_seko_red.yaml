  topic: 瀬古歩夢
  title: 瀬古歩夢が61分で一発退場。ル・アーヴルが残りを10人で戦うことになった一度
  question: 瀬古歩夢はなぜ61分で退場になり、ル・アーヴルはそのあと何を抱えたのか
  takeaway: リーグ・アン第6節、ル・アーヴルは敵地で0対1で敗れ、センターバックの瀬古歩夢が61分に一発退場になった。退場の理由は決定的な得点機会の阻止で、警告ではなく一度でレッドカードだった。試合記録で追うと、ル・アーヴルは5分に失点して追いかける側になり、57分に相手が前線の2人を入れ替え、その4分後に瀬古が背後への抜け出しを止めている。2分後には味方にも警告が出たが退場は増えず、点は動かないまま終わった。ル・アーヴルはこれで6試合を終えて0勝2分4敗、4得点8失点、勝ち点2。リーグ・アンの18チームを並べて数えると、勝ちが1つも無いのはル・アーヴルだけで、残りの17チームはすべて1勝以上している。ただし守りが崩れているわけではなく、1試合あたりの失点は1.3で、リーグ全体の平均1.4よりむしろ少ない。足りていないのは取るほうで、1試合あたりの得点は0.7とリーグ平均の半分以下だった。その数少ない1点を探す時間を、退場から30分ほど10人で過ごしたことになる
  opening_image: assets/images/20261011_seko_red/01_w.jpg
