# 取材メモ（10/11 題材 seko_red、型は news、japan_1 の枠）。
# **ショートだけ作る**（本編は作らない。台本は1本で、`short` が山場の節を切り出す）。
# **この回は「ル・アーヴル側・瀬古の退場」だけで組んである**（ユーザー指示）。
#   同じ試合の表側（上田綺世がリールで途中出場）は別の回で作っているので、
#   **リールの順位にも、上田にも一行も触れていない。**相手の名前は試合の相手として出るだけ。
# **退場の時間は「61分」にした。**ここは出典が割れている:
#   ・サッカーキングの本文は「62分」
#   ・ゲキサカの試合記録（Opta）は「瀬古歩夢(61分)」
#   ・ESPN の試合データ（Opta）も Red Card / Ayumu Seko を 61' に置いている
#   2つのデータ提供元が61分で一致しているので、**試合記録の側を採った。**
#   同じ理由で、相手の交代は「56分」（サッカーキング本文）ではなく **57分**（ゲキサカ・ESPN）。
# **確かめた数字**（ESPN の順位表、10月11日時点）:
#   ル・アーヴル 6試合 0勝2分4敗、4得点8失点、勝ち点2、18位。
#   **18チームのうち勝ちが1つも無いのはル・アーヴルだけ**（残り17チームはすべて1勝以上）。
#   これは自分で全チームを並べて数えた。記事の「リーグ唯一の未勝利」と一致する。
# **本人・監督の言葉は取れなかった。**当たったのはサッカーキング／ゲキサカの試合記録／
#   ESPN の試合データ／ル・アーヴル公式（www.hac-foot.com/actualites は404）。
#   試合後のコメント記事は見つからなかったので、`voice_min: 0` で語りだけにしてある。
# **ネットの反応は集めていない**（ユーザー指示で、この3本は反応なしでよい）。
# 写真：記事の写真は**サッカーキングの og:image が Getty**（本文にも「[写真]=Getty Images」）なので使わない。
#   ゲキサカの試合記録ページには写真が無い。代わりに **Commons の CC BY 4.0**（File:Ayumu Seko Japan 2025 (cropped).jpg、
#   Keiteay、2025年、1538x2182）を取った。日本代表の姿で、クラブのユニフォームではない
#   （「他に無ければそのまま使ってよい」の扱い）。うつむいて歩いている1枚で、題材の空気に合う。
#   9/29 に使ったゲキサカの写真（assets/images/20260929b_seko）は**使い回さない**。
#   `tools/facecrop.py` で 01_w（1538x865）と 01_v（1227x2182）を作り、**どちらも開いて目で見た**。
#   縦は高さ2182pxで、ショートの下限1200pxを超えている。
# 数字の重なり対策：『第6節』は①だけ。『5分』『57分』『61分』『63分』は②だけ。
#   『6試合』『勝ち点2』『4得点8失点』『18チーム』は③だけ。『0対1』は②で一度だけ読む。
# サムネ：**点検を通すために1案だけ書いてある。決めるのはユーザー**（報告に3案を出す）。
