- id: pk
  heading: PK戦の勝ちと、アメリカの伸び
  tier: 確定
  official: true
  telop: PK戦の勝ちは勝ちと引き分けの間。90分で勝っていればプラス4.11だった
  narrator: キャスター
  card: *id005
  say:
  - text: 計算の中身は、試合の重みと、結果と見込みの差のかけ算です。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
  - text: 親善試合の重みは10。強い相手に勝つほど、見込みとの差が大きくなります。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
  - text: 2戦目は49位のベネズエラ。2対1の勝利で、3.09増えました。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: ニュージーランド戦の、1.8倍の点が入りました。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: 準決勝のエクアドル戦は、0対0からのPK戦で勝ちました。増えたのは1.61。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: 計算の決まりでは、PK戦の勝ちは、勝ちと引き分けの間として数えます。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: もし90分で勝っていれば、プラス4.11。PK戦で2.5ほど少なくなった形です。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: では4つ勝っても、なぜ16位との差は縮まらなかったのか。
    card:
      type: table
      title: 日本の4試合で増えたポイント
      columns: *id003
      rows: *id004
      highlight_row: 4
  - text: アメリカも同じ時期にペルー、チリ、メキシコに3連勝。
    card: none
  - text: 3試合でプラス11.29と、日本とほぼ同じだけ積んでいたんです。
    card: none
    emph: true
