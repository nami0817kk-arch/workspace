  say:
  - text: 日本代表は9月から4連勝。それでもフィファランキングの17位は動きません。
    short_only: true
  - voice: 国際サッカー連盟
    text: 足したり引いたりする点は、相手との力の差でも決まる。
  - voice: 国際サッカー連盟
    text: ランキングが上のチームは、下のチームに良い結果を出すはずだ。
    cont: true
  - voice: 国際サッカー連盟
    text: その見込みも、計算に含めている
    cont: true
  - text: 格下に勝っても、点はあまり増えないということです。4試合を並べます。
