- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: カルチンの村と、2025年3月12日
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['子どものころ', 小さな村で「クモ」と呼ばれた]
    - ['2025年3月12日', PKが取り消された夜]
    source: 各報道
  say:
  - text: アトレティコ・マドリードのフリアン・アルバレス。数字の外に、2つの話があります。
    short_only: true
    image: assets/images/20261012_player_576024/arg2026c/01_w.jpg
    card: none
  - text: 1つ目は、小さな村、カルチンの話。
    image: assets/images/20261012_player_576024/river2019/01.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 0
  - text: あだ名は、アラーニャ。スペイン語で、クモです。
    emph: true
    card: *story_card
  - text: 名づけ親は最初のコーチ、バラス。左右へ走る速さで、足が2本より多く見えた、と。
    card: *story_card
  - text: 本人は、こう話しています。
    card: *story_card
  - voice: アルバレス
    text: 4歳か5歳のときから、
  - voice: アルバレス
    text: アラーニャと呼ばれている。
    cont: true
  - voice: アルバレス
    text: よく覚えていないけど
    cont: true
    pause: 0.6
  - text: アルバレスは、そのバラスさんにトラックを贈りました。配達の仕事に使えるように。
    card: none
  - text: もう1つは、2025年3月12日の夜です。
    image: assets/images/20261012_player_576024/arg2026a/01.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: チャンピオンズリーグ、ベスト8をかけた第2戦。相手は同じ街のライバル。
    card:
      <<: *story_card
      highlight_row: 1
  - text: 2戦合計は2対2でPK戦に。アルバレスのPKは、キーパーをかわして決まります。
    card:
      <<: *story_card
      highlight_row: 1
  - text: ところが、ビデオ判定の確認でダブルタッチとされ、得点は取り消しに。
    emph: true
    card:
      <<: *story_card
      highlight_row: 1
  - text: 軸足がボールに触れていた、という判定でした。PK戦は2対4で敗れます。
    card:
      <<: *story_card
      highlight_row: 1
  - text: のちに本人は、こう話しています。
    card:
      <<: *story_card
      highlight_row: 1
  - voice: アルバレス
    text: 僕はそれを1000回見たよ
  - voice: アルバレス
    text: 実際、僕は触れた感覚がなかった
    cont: true
    pause: 0.6
  - text: それでもそのシーズン、アルバレスはチームの得点王でした。
    emph: true
    card: none
