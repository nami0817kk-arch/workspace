  - text: 2018年10月にデビュー。12月9日の南米の決勝に、延長の97分から出ます。
    card: *career_card
  - text: 2022年1月31日、22歳の誕生日。シティ入りが発表されました。
    card:
      <<: *career_card
      highlight_row: 1
  - text: 移籍金は報道で約1400万ポンド。7月まではリーベルに残る約束でした。
    card:
      <<: *career_card
      highlight_row: 1
  - text: その5月25日、コパ・リベルタドーレス。アリアンサ・リマ戦で、ひとりで6点。
    card:
      <<: *career_card
      highlight_row: 0
  - text: リーベルの選手では史上初。大会の1試合の最多にも並びました。
    emph: true
    card:
      <<: *career_card
      highlight_row: 0
  - text: 7月にシティへ。その冬のワールドカップは、初戦も2戦目もベンチから。
    image: assets/images/20261012_player_576024/arg2026c/01_w.jpg
    card: none
  - text: 3戦目のポーランド戦から先発に。決めて、次のオーストラリア戦でも決めます。
  - text: クロアチア戦で2点。22歳でした。
  - text: 準決勝か決勝で2点を取った選手では、1958年のペレ以来の若さ。
    emph: true
  - text: 決勝のフランス戦も先発。PK戦の末に世界の頂点へ。大会は7試合で4得点でした。
  - text: その5か月後、チャンピオンズリーグ準決勝は4対0。最後の1点を決めました。
    image: assets/images/20261012_player_576024/arg2026d/01.jpg
    card:
      <<: *career_card
      highlight_row: 1
  - text: 6月の決勝はベンチでしたが、欧州の頂点に立ちます。
    card:
      <<: *career_card
      highlight_row: 1
  - text: クラブワールドカップ決勝、キックオフから40秒。決勝で史上最速のゴール。
    emph: true
    card:
      <<: *career_card
      highlight_row: 1
  - text: 88分にも決めて、4対0。ワールドカップ優勝から、ちょうど1年と4日でした。
