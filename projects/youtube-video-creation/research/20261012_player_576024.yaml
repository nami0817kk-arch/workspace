# フリアン・アルバレス（アトレティコ・マドリード）の紹介。8節の型（2026-09-28）を、ライス（research/20261011_player_357662.yaml）の形にそろえた。
# 雛形は tools/player_intro.py 576024。材料は research/raw/20261012_alvarez_material.md。
# 数字は FotMob（974753）・Transfermarkt API（576024）・英語版Wikipedia・ESPN の試合記録。
#
# **鍵の付け方**：ライスと同じく Transfermarkt の番号（576024）。FotMob の番号（974753）は板のファイル名に入っている。
#
# **この回で避けたもの（ユーザー指示）**
# - **アトレティコというクラブの話をしない。**財政・本拠地・ユニフォーム・クラブの歴史・オーナーは1行も入れていない。
#   クラブ名が出るのは「どこに所属しているか」「移籍先」「次の試合」「本人の成績の主語」だけ。
# - **直近30日に出した話と重ねない。**9/25 に「バルサのデコがアルバレスについて初めて口にしたこと」（deco_summit）、
#   9/20 に「アトレティコ対レアル・マドリード 2対1」の回を出している。**デコの発言も、バルセロナの名前も、9/20 の試合の中身も入れていない。**
#   夏の移籍騒動は「本人が移籍を望むと語った／クラブは交渉に応じず、残っている」の1行だけ（今季の出番を読むのに要る）。
#   ブーイング・契約解除金・代理人の話は入れていない。
# - **同じ日に出す他の回と重ねない。**リヴァプール・ブレントフォード・イプスウィッチ・レバンテの名前は台本のどこにも出していない。
#   **同じ日の移籍の回（アザール：レアル・マドリード・チェルシー）とも重ねない**ため、レアル・マドリード・チェルシー・ベルナベウの名前は台本から外した（相手は「同じマドリードのライバル」）。
#   マンチェスター・シティは「前所属」として、マンチェスター・ユナイテッドは「次の試合の相手」として出る。
#
# **数字の食い違い・直したこと（材料 §8）**
# - **市場価値：雛形は 1.2億ユーロ（「前回の1億から、さらに上がりました」）と書いたが、古かった。**
#   雛形の元の選手控え（research/player_pool/profiles/576024.json、9/28 作成）は 7/22 の 1.2億ユーロのまま。
#   Transfermarkt API を引き直すと **2026-10-05 に 1.1億ユーロへ下がっている**（直前は 7/22 の 1.2億＝最高額）。
#   **1.1億ユーロ（10/5 更新、最高は 1.2億）に直した。**「さらに上がりました」も外した。FotMob は 1億1250万ユーロ（別の集計）。
# - 身長：Transfermarkt 1.70m・FotMob 170cm・英語版Wikipedia 1.70m で一致。**170センチ**。
# - クラブの通算：FotMob も英語版Wikipedia も **336試合139得点**（リーベル 122/54・シティ 103/36・アトレティコ 111/49）で一致。
#   代表は FotMob 62試合16得点（10/6 ベナン戦まで）。英語版Wikipedia は 61試合（10/3 まで。ベナン戦が未反映）。**62試合16得点を使う。**
# - **過去5季の表は、雛形（Transfermarkt の「代表を含む全公式戦」）から、クラブだけの数字に差し替えた。**
#   Transfermarkt の 22/23 は 19得点で、2022年ワールドカップの得点（4点）が入っていない（シティ17点＋W杯4点にならない）。
#   **FotMob と英語版Wikipedia で合う数字だけ**にした。**2025年6月のクラブワールドカップ（3試合1アシスト）は 24/25 に数える**
#   （英語版Wikipedia と Transfermarkt がそうしている。FotMob は 25/26 に入れている）。FotMob の 24/25（54試合・7アシスト）に足して 57試合・8アシスト、
#   25/26 は 52試合・10アシストから引いて 49試合・9アシスト。**この付け替えで、5つの季と2018〜2021年（96試合36得点）を足すと 336試合139得点に合う。**
#   21/22 はリーベルの2021年（暦年）と2022年前半がまたがるので、**2022年前半（26試合18得点6アシスト）の1行**にした。
# - 直近5試合の日付は**試合のあった現地の日付**（ESPN）。FotMob は UTC なので 10/1・10/4 になるが、ボリビア戦は 9/30、ブルキナファソ戦は 10/3。
# - 「ダブルタッチ」のPK順：Goal は2人目、サッカーキングは4人目。**順番は言わない**（Wikipedia は2人目）。PK戦は 2-4 でレアルが勝った。
# - 「369日」は 2022-12-18（W杯決勝）から 2023-12-22（クラブW杯決勝）の差。City 公式誌も同じ数え方。6つ＝W杯・CL・プレミア・FAカップ・UEFAスーパーカップ・クラブW杯。
# - アトレティコの1大会10得点がクラブ記録：UEFA の記事は読めなかった（タイムアウト）。El Gráfico・Wikipedia・複数報道で確認。
#
# **板の直し（道具）**：市場価値の板で、クラブ名の札が長いとき（「マンチェスター・シティ」と「アトレティコ・マドリード」）に
#   重なり、最新の額（1.1億€）が折れ線の頂点に被っていた。字の長さで札の段を選び、額は枠の上へ逃がすように直した
#   （tools/fotmob_player.py）。リーベルが「CA River Plate」のままだったので config/clubs.yaml に足した。
#
# **パーセンタイルを数として読まない**（10/01 の指摘）。レーダーの軸は「同じFWの中での位置の目安（100が最上位）」として
#   位置で言い、「得点 35」は今季0得点との食い違いが出るので読み上げていない。
#
# **入れなかった材料**
# - 夏の移籍騒動の中身（ブーイング・契約解除金・CEO の発言・代理人）。9/25 に出した話と重なり、選手を小さく見せるため。
# - 兄弟（アグスティンとラファエル）のノンリーグ・アベイヘイの話：Wikipedia だけで裏が取れていない。
# - レアル・マドリードのユース大会の話・ボカの練習参加：記事で年齢が食い違う（11歳／13歳未満の規則）。
# - 子どもの誕生・交際相手の話（私人の話）。
#
# **写真は2つの時期**：2019年のリーベル（Commons、CC BY-SA）と、2026年のアルゼンチン代表（W杯決勝・エジプト戦、Commons、CC BY-SA、撮影 Bryan Berlin）の4枚。
#   **シティ期・アトレティコ期の写真は使えなかった**：Commons にある本人の写真は、シティ（503x735、1.9倍に伸びて× ）・アトレティコ（本人は5606px の写真の中の小さな1人。顔が120px）・
#   2022年W杯（メッシが主役の拡大画像で、粗い）のどれも、本編で伸ばさずに使える大きさ・主役の写真が無かった。2026年のシャツには「2022年の世界王者」の星が付いているので、W杯・シティ期の行にもこの写真を使った。
#   同じ選手を横に並べていない。スタジアムの写真は出していない。
#
# **本人の言葉は3つ**
#   ①「小さすぎる夢はない。大きすぎる夢もない」（City 公式誌の特集。英語を自訳）
#   ②「4歳か5歳のときから、アラーニャと呼ばれている」（Billiken、2022-12-19。スペイン語を自訳）
#   ③「僕はそれを1000回見たよ」「実際、僕は触れた感覚がなかった」（Goal 日本版の訳そのまま。原文は SPORT 経由の ESPN）
