title: 11月12日のショート題材
lead: 海外フィード（今朝の gather）と日本語3サイト（ゲキサカ・サッカーキング・フットボールチャンネル）から10件。ユーザー確認なしの自動運用のため、Claude が○を付けて選びました（日本人7・海外3）。
note: 今日は木曜（12日）、日本時間の朝（9時台）に集めました。日本代表はシンガポールで合流済み（14日ブラジル戦、17日パラグアイ戦）。日本人の題は9〜17時、海外は18時以降に予約。外した題：マンUとポチェッティーノ（昨日 manutd_carrick_pochettino で扱済み）・マクトミネイの心臓・スビメンディ残留・パレスのフランク監督（次点）、女子W杯・MLS・Jリーグ・ユースは対象外。検索AI要約は使っていません。
