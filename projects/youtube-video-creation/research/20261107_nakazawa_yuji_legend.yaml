    highlight_row: 0
  say:
  - text: 最後に、中澤佑二の数字を並べます。
    image: assets/images/20261107_nakazawa_yuji_legend/03_w.jpg
    card: none
  - text: 2006年は3試合で7失点。1試合あたり、およそ2.3点を取られていました。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 2010年は4試合で2失点。1試合あたり0.5点です。
    card: {<<: *viewcard, highlight_row: 1}
    mark:
      kind: circle
      row: 1
      col: 1試合あたり
  - text: 同じ中澤が真ん中にいて、取られる点は5分の1ほどに減りました。
    card: {<<: *viewcard, highlight_row: 1}
    emph: true
  - text: 代表の110試合を年ごとに見ると、2002年はわずか1試合です。
    image: assets/images/20261107_nakazawa_yuji_legend/01_w.jpg
    card: none
  - text: それが2004年から2010年の7年間で、96試合。毎年12試合以上に出ています。
    card: none
    emph: true
  - text: ワールドカップに落ちた24歳が、32歳でベスト16の守りを支えました。
    card: none
  - text: 給料の出ない練習生から始まった道は、日本の守りの柱まで続いていました。
    card: none
