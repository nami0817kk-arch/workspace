  say:
  - text: 高校を出た中澤は、ひとりでブラジルへ渡ります。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *traineecard, highlight_row: 0}
  - text: スパイクは盗まれ、練習でもパスが回ってこない。
    card: none
  - text: それでも半年ほどで、試合に出られるまでになりました。
    card: none
  - text: 日本に戻ると、ヴェルディ川崎の練習生に。
    card: {<<: *traineecard, highlight_row: 1}
  - text: 給料の出ない立場で、片道2時間の道のりを自分のお金で通い続けます。
    card: none
  - text: のちに本人は、この頃をこう振り返っています。
    card: none
  - voice: 中澤佑二
    text: 苦しかったですね、あの頃は。若かったし、一直線だったので。
    card: none
  - voice: 中澤佑二
    text: もう一回と言われたらできないですね。
    card: none
    cont: true
    emph: true
  - text: 1999年、21歳でプロ契約。開幕2戦目で先発に入り、そのまま定位置をつかみます。
    card: {<<: *traineecard, highlight_row: 2}
  - text: その年、Jリーグの新人王に選ばれました。
    card: {<<: *traineecard, highlight_row: 3}
  - text: トレードマークは、大きなアフロの髪。名前は「ボンバーヘッド」です。
    image: assets/images/20261107_nakazawa_yuji_legend/01_w.jpg
    card: none
  - voice: 中澤佑二
    text: とにかく顔と名前を覚えてもらいたいという思いで、
    card: none
  - voice: 中澤佑二
    text: ああいう髪型にしていたんです。
    card: none
