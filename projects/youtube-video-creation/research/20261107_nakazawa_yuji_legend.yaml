# 中澤佑二（元日本代表 DF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-07。型は 11/5 の奥寺康彦・11/1 の中村憲剛と同じ8節の変形。
# **情報の時点は 2026-11-05。**年齢は当時のものだけ（生年月日 1978-02-25 から計算）。いまの年齢・いまの仕事は言わない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は J リーグ公式（2019-01-08 の引退の記事）・Goal.com 日本版のインタビュー（2017-07-14）・
#   Number Web（2011-01-05、無料で読める前半だけ）・英語版/日本語版 Wikipedia の成績表と大会の記事だけ。
# **私生活（家族・娘・ラクロスの指導）は入れない。女子のスポーツの話も入れない**。J リーグは経歴の事実だけにとどめ、サムネの主役にしない（主役は日本代表）。
#
# **題材を選んだ理由**：直近30日に未出の、日本代表の大物。110試合は日本代表で100試合を超えた数少ない1人（2010-02-14 に井原正巳・川口能活に続く3人目で100試合。英語版）。
#   W杯2大会（2006・2010）、2010年は田中マルクス闘莉王とセンターバックを組んで4試合2失点。高校から無名→給料の出ない練習生→代表の主将、の物語がある。
#   ヒットの条件（日本代表・W杯・本人の言葉）に当たる。
#   候補から外したもの：高原直泰（11/6 のハンブルガーSV・10/24 のフランクフルトのクラブ紹介に名前と節が出ている。続けて出すと重なる）、
#   中田浩二・柳沢敦・小笠原満男・楢崎正剛（使える現役時代の大きな写真が見つからない。Commons は別人の「Koji Nakata」か小さいものだけ）、
#   本田圭佑・香川真司・長友佑都（現役）、釜本邦茂（2025年に死去。追悼の回になる）、田中マルクス闘莉王（写真が無い。本編の中で名前を出す）。
# **重なりの確認（2026-11-05）**：scripts/・research/covered.yaml を「中澤」「Nakazawa」で grep → 0件。research/posted.json は build 名だけで人名は入っていない。
#   research/20261107_picks.txt の他の担当（シュロッターベック・クヴァラツヘリアとドゥエ・ベルナベウ・バルセロナのユニフォーム）とも重ならない。
#   同じ時期の日本人レジェンドでは、阿部勇樹（10/29）が2010年W杯の4試合、宮本恒靖（10/29）が2006年W杯、川口能活（10/22）が2004年アジアカップを扱っている。
#   この回は「中澤の守り」と「2006年と2010年の失点の比べ」に絞り、同じ説明（アンカーの話・PK戦）はしない。
# **引退の確認**：J リーグ公式 2019-01-08「横浜Ｆ・マリノスは8日、DF中澤 佑二が2018シーズン限りで現役を引退することを発表」。英語版・日本語版 Wikipedia も同じ。→ **現役ではない**。
#
# **数字の出どころ**
# - 生年月日 1978-02-25・埼玉県吉川市（日本語版）。身長187cm（日本語版）。
# - J1 通算 593試合36得点（J リーグ公式）。内訳：ヴェルディ 1999〜2001 = 28+29+26 = 83試合・1+4+0 = 5得点、横浜FM 2002〜2018 = 510試合31得点（日本語版の成績表。合計は自分で引いた）。
# - J1 連続フル出場 178試合（2013-07-06〜2018-08-15）は「フィールドプレーヤーとしては歴代最長」（J リーグ公式）。
# - 日本代表 110試合17得点（J リーグ公式「国際Aマッチ通算110試合・17得点」）。1999-09-08 イランとの親善試合でデビュー（英語版）。年ごとの数（英語版、RSSSF 典拠）：
#   1999:1 2000:6 2001:2 2002:1 2003:4 2004:15 2005:12 2006:12 2007:13 2008:16 2009:14 2010:14 ＝110。2004〜2010 の7年で 96試合（自分で足した）。
# - 100試合目：2010-02-14 東アジア選手権 韓国戦、国立。井原正巳・川口能活に続いて日本で3人目（英語版）。
# - 1999 J リーグ新人王（英語版・日本語版）。2004 J リーグ最優秀選手（J リーグ公式）。2003・2004 J1 優勝（J リーグ公式）。
# - プロ入り前：高校卒業後にブラジルのアメリカFCへ（日本語版・Goal.com 2017）。帰国後、ヴェルディの練習生（無給。日本語版・英語版「received no compensation」）。
#   「片道2時間の距離を毎日自費で通って…シーズン終了後にプロ契約」（Goal.com 2017）。1999年3月13日 C大阪戦で J1 初出場（英語版・日本語版）。21歳（生年月日から）。
# - 2002年W杯：本大会前最後のノルウェー戦（0対3）に出たが、メンバーから落ちた（日本語版「秋田豊のサプライズ選出に押し出され落選」、英語版「Yutaka Akita was preferred」）。24歳。
# - 2004年アジアカップ：全試合に出て3得点（英語版）。タイ戦の2得点（57分・87分）、準決勝バーレーン戦の90分の同点ゴール。
#   準決勝の流れ（英語版の試合記録）：バーレーン7分、中田浩二48分、玉田55分、バーレーン71分・85分（2対3）、中澤90分（3対3）、玉田93分（延長）→ 4対3。
# - 2006年W杯：3試合すべてに出場（英語版の先発表）。結果はオーストラリアに1対3、クロアチアに0対0、ブラジルに1対4（英語版 2006 Group F）＝3試合で7失点（自分で足した）。
#   ブラジル戦は主将（英語版の先発表の (c)、日本語版「宮本恒靖の代わりに主将」）。
#   大会後に代表から退く考えを示し（英語版「announced his retirement from the international football at the age of 28」、日本語版）、2007年2月にオシム監督の合宿に呼ばれて戻る（日本語版）。
# - 2010年W杯：4試合すべてに先発（英語版の先発表・日本語版）。結果はカメルーンに1対0、オランダに0対1、デンマークに3対1、パラグアイに0対0（PK3対5）（英語版）＝4試合で2失点（自分で足した）。
#   Number Web 2011-01-05「4試合を2失点」「名コンビはカメルーンのエース、エトーをシュート1本に抑えた」。
# - 引退：2019-01-08 発表、2018シーズン限り。40歳（J リーグ公式・生年月日から）。
# - 1試合あたりの失点（自分で割った）：2006年 7÷3 ＝ 約2.3、2010年 2÷4 ＝ 0.5。
# - 本人の言葉（原文のまま、短く切る）：
#   ①Goal.com 2017-07-14「苦しかったですね、あの頃は。若かったし、一直線だったので。もう一回と言われたらできないですね。」
#   ②Goal.com 2017-07-14「とにかく顔と名前を覚えてもらいたいという思いで、ああいう髪型にしていたんです。」
#   ③Number Web 2011-01-05「闘莉王のほうが強いっすよ！」
#   ④J リーグ公式 2019-01-08（クラブを通じたコメント）「最後は”中澤佑二”らしく、自分の決断を信じ、1ミリの後悔もなくピッチを去ろうと思います。」
#
# **入れなかったもの**：家族・娘・ラクロス、CM・テレビ、安室奈美恵の話、2010年5月のイングランド戦のオウンゴール、2004年アジアカップ準々決勝のPK（外した）、
#   「DFで代表最多の17得点」（日本語版だけで裏が取れない）、「代表で警告5回・退場0回」（日本語版が Number を引くが本文を読めない）、「歴代4位の110試合」（日本語版の書きぶりが古く、いまの順位と合わない）、
#   FIFA の技術報告の評価、エメルソンの言葉、いまの仕事。
# **写真**：assets/images/20261107_nakazawa_yuji_legend/
#   01 = Goal.com 日本版 2019-01 の引退の記事の主写真（（C）J.LEAGUE、1920x1080、2018年4月の横浜FM、腕章あり）。代理店ではない（J リーグの写真）。
#   02 = Goal.com 日本版 2017-07-14 のインタビューの主写真（記者会見、1920x1280、撮影者の表記なし）。現役中（2017年）。
#   03 = Commons「Nakazawa 20080622.jpg」（Neier、CC BY-SA 3.0、1289x1923、2008年6月22日の W杯予選バーレーン戦、日本代表の2番）。03_w は 1.49倍で本編に敷く。
#   Commons の「Yuji Nakazawa and Hide Nakatoshi 20120122.jpg」は人が小さく、ほかの人も写るので使わない（20261107_nakazawa_yuji_cm2 に取り込んだまま）。
#   ほかに当たったもの：フットボールチャンネル・SPREAD・サッカーキング（Getty）、Number（AFLO）、J リーグ公式（640px）、横浜FM 公式（660px）、Sportiva（600px）は使わない。
