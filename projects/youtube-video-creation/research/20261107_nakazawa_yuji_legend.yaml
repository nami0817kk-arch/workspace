  say:
  - text: 2004年の夏、中国で開かれたアジアカップ。準決勝の相手はバーレーンでした。
    image: assets/backgrounds/cut_日本.png
    card: none
  - text: 85分、日本は2対3と勝ち越されます。残りは、ほんのわずか。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *asiacard, highlight_row: 0}
  - text: 90分。同点のゴールを決めたのは、センターバックの中澤でした。
    card: {<<: *asiacard, highlight_row: 1}
    emph: true
    callword: 90分の同点弾
  - text: 延長に入ってすぐ、玉田圭司が決めて4対3。日本は決勝へ進み、大会を連覇します。
    card: {<<: *asiacard, highlight_row: 2}
  - text: この大会、中澤は3得点。玉田と並んで、チームでいちばん多い数でした。
    image: assets/images/20261107_nakazawa_yuji_legend/03_w.jpg
    card: none
