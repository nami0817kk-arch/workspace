  say:
  - text: 1998年。ヴェルディ川崎の練習場に、毎日、片道2時間かけて通う若者がいました。
    image: assets/images/20261107_nakazawa_yuji_legend/01_w.jpg
    card: none
  - text: 立場は練習生。給料は出ません。交通費も、自分で払っていました。
    card: none
  - text: 高校からは、どのクラブにも誘われなかった選手です。
    card: none
  - text: その若者は12年後、ワールドカップで日本の守りの真ん中に立っていました。
    card: none
    emph: true
  - text: 中澤佑二。日本代表で110試合に出た、守りの柱です。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *hookcard, focus: 1}
    callword: 中澤佑二
  - text: ワールドカップには2度出て、主将として腕章を巻いた試合もありました。
    card: {<<: *hookcard, focus: 2}
