  say:
  - text: 南アフリカ大会のあとも、中澤は横浜F・マリノスで出続けます。
    image: assets/images/20261107_nakazawa_yuji_legend/01_w.jpg
    card: none
  - text: 2013年から5年あまり、J1で178試合続けてフルに出ました。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: ゴールキーパーを除けば、J1でいちばん長い記録です。
    card: {<<: *aftercard, highlight_row: 0}
    emph: true
  - text: 2019年1月、40歳で引退を発表。クラブを通じて、こう言葉を残しました。
    card: {<<: *aftercard, highlight_row: 2}
  - voice: 中澤佑二
    text: 最後は中澤佑二らしく、自分の決断を信じ、
    card: none
  - voice: 中澤佑二
    text: 1ミリの後悔もなくピッチを去ろうと思います。
    card: none
