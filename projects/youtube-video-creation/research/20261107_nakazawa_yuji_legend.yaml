- id: view
  heading: 中澤佑二の110試合は、どの7年に詰まっていたのか
  tier: 背景
  telop: 2002年に落ちた男が、8年後に守りの真ん中へ
  viewpoint: true
  card: &viewcard
    type: table
    title: ワールドカップの日本の失点
    columns:
