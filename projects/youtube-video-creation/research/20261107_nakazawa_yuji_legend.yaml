- id: worldcup
  heading: 2006年と2010年、中澤の守る日本はどう変わったのか
  tier: 報道
  telop: ワールドカップ、ドイツ大会と南アフリカ大会
  main: true
  card: &wccard
    type: table
    title: 中澤佑二のワールドカップ
    columns:
    - 大会
    - 結果
    - 失点
    rows:
    - - 2006年 ドイツ
      - 1次リーグで敗退
      - 3試合で7
    - - 2010年 南アフリカ
      - ベスト16
      - 4試合で2
    highlight_row: 0
  say:
  - text: 2010年のW杯。中澤佑二と守りの真ん中を組んだのは、田中マルクス闘莉王。
    image: assets/images/20261107_nakazawa_yuji_legend/03_w.jpg
    card: none
  - text: 空中戦はどちらが上か。中澤は即答です。
    card: none
  - voice: 中澤佑二
    text: 闘莉王のほうが強いっすよ！
    card: none
  - text: ただ、その4年前のドイツ大会は、苦い大会でした。中澤は3試合すべてにフルで出ます。
    card: none
  - text: ブラジル戦は、中澤がキャプテンでした。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: none
  - text: それでも3試合で7失点。4年前のベスト16から、1次リーグ敗退に戻りました。
    card: {<<: *wccard, highlight_row: 0}
  - text: 大会のあと、中澤は代表から退く考えを口にします。28歳でした。
    card: none
  - text: 翌年、呼び戻したのはオシム監督。続く岡田監督のもとでは、主将も任されます。
    card: none
  - text: 2010年2月、日本で3人目となる代表100試合に届きました。
    card: none
  - text: そして迎えた南アフリカ大会。
    image: assets/images/20261107_nakazawa_yuji_legend/03_w.jpg
    card: none
  - text: 初戦はカメルーンに1対0の勝ち。相手のエース、エトーを封じました。
    card: none
  - text: 4試合すべてに先発し、失点はわずか2。日本はベスト16まで進みました。
    image: assets/images/20261107_nakazawa_yuji_legend/02_r.jpg
    card: {<<: *wccard, highlight_row: 1}
    emph: true
