  - text: この年から、中澤は横浜F・マリノスでプレーしていました。
    card: {<<: *backcard, highlight_row: 0}
  - text: 翌年からJ1を2年続けて制し、2004年にはJリーグの最優秀選手に選ばれました。
    card: {<<: *backcard, highlight_row: 2}
  - text: 代表にも戻り、ジーコ監督のもとで守りの軸になっていきます。
    image: assets/images/20261107_nakazawa_yuji_legend/01_w.jpg
    card: none
