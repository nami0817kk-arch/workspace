# CL第1節 リヴァプール 2-1 アトレティコ・マドリード（2026年9月10日）。
# ユーザー指示「6時にリヴァプール、PSG、アーセナル」
#
# 引きは**60分に起きたこと**。逆転勝ちの裏で、今朝出したバルコラの回の
# 続報にあたる負傷交代が起きている。同じ選手を続けて扱うので、
# 前の動画を見た人には「その後」になり、見ていない人には単独で成立する。
#
# もう1つの軸は**本職センターバックのアラウホが右サイドバックで評価を上げている**こと。
# 現地紙の採点と言葉があるので、他人の声はここで取る。
#
# **反応は入れない。**この試合のスレを探したが、読める形のものが無かった
