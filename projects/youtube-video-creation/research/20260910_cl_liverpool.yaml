sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: リヴァプール 2対1 アトレティコ
    narrator: キャスター
    card:
      type: table
      title: CLリーグフェーズ第1節 リヴァプール 2-1 アトレティコ・マドリード
      columns: ["時間", "得点者"]
      rows:
        - ["17分", "ジョレンテ（アトレティコ）"]
        - ["40分", "ソボスライ（リヴァプール）"]
        - ["50分", "マクアリスター（リヴァプール）"]
    say:
      - チャンピオンズリーグのリーグフェーズ第1節、リヴァプールがアトレティコ・マドリードを2対1で下しました。
      - 先に決めたのはアトレティコでした。17分、アルバレスのスルーパスに抜け出したジョレンテが左足で流し込みます。
      - リヴァプールは40分に追いつきます。こぼれ球を拾ったアラウホがヒールでつなぎ、ソボスライが決めました。
      - 逆転は後半開始直後の50分。エングモアのシュートがブロックされたこぼれ球を、マクアリスターがボックスの外から左足で叩き込みました。
      - リヴァプールはプレミアリーグで1勝2分と勝ち切れていませんでした。CLは白星スタートです。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007868/
      - https://www.footballchannel.jp/2026/09/10/post1007877/

  - id: araujo
    heading: 同点ゴールを生んだのは、本職ではない選手だった
    tier: 報道
    telop: 本職CBが右サイドバックで先発
    narrator: 解説
    say:
      - 同点ゴールの起点になったロナルド・アラウホは、本職がセンターバックです。
      - この試合は前の試合に続いて右サイドバックで先発し、フル出場しました。
      - 40分、ペナルティエリアの中でソボスライからパスを受けると、バックヒールで返します。
      - これがそのままアシストになりました。現地メディア『エンパイア・オブ・ザ・コップ』は、こう書いています。
      - {voice: エンパイア・オブ・ザ・コップ, text: 見事だ。素晴らしいアシストだった}
      - 英『ディス・イズ・アンフィールド』はアラウホに10点満点で8をつけました。
      - {voice: ディス・イズ・アンフィールド, text: センターバックのように守れるだけではない}
      - {voice: ディス・イズ・アンフィールド, text: 右サイドバックとして前にも出られることを示した}
      - {voice: ディス・イズ・アンフィールド, text: このポジションは彼のものになったようだ}
      - 前節のイプスウィッチ戦でも右サイドバックで先発し、デュエル10回中9回に勝っています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007931/
      - https://www.footballchannel.jp/2026/09/10/post1007868/

  - id: barcola
    heading: 60分に起きたこと
    tier: 報道
    telop: バルコラが初先発で負傷交代
    narrator: キャスター
    say:
      - ここからが本題です。60分を迎える直前、リヴァプールにアクシデントが起きました。
      - ブラッドリー・バルコラが左のふくらはぎあたりを押さえて、ピッチに倒れ込みます。
      - 治療を受けたものの続行は難しく、ビクトル・ムニョスと交代しました。
      - この試合はバルコラの加入後初先発で、アンフィールドでの初出場でもありました。
      - バルコラは8月31日にパリ・サンジェルマンから完全移籍で加入したばかりです。
      - 9月4日のイプスウィッチ戦で途中出場してデビューし、この日が2試合目でした。
      - 出場時間を伸ばそうとしていた矢先の負傷で、状態が心配されています。
      - 試合前、イラオラ監督はこの一戦をこう位置づけていました。UEFAがコメントを伝えています。
      - {voice: イラオラ監督, text: アトレティコは我々が対戦する中で最も手強い相手の一つだ}
      - {voice: イラオラ監督, text: 私にとっては初めてのCLの試合だ}
      - {voice: イラオラ監督, text: 自分たちが今どのレベルにいるのかを測る試金石にもなる}
      - {voice: イラオラ監督, text: アトレティコ相手に、自分たちの現在地を確かめたい}
      - {voice: イラオラ監督, text: そのためには攻めの姿勢を貫かなければならない}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007877/
      - https://web.ultra-soccer.jp/news/all/35699/
      - https://www.soccer-king.jp/news/world/cl/20260909/2202774.html
