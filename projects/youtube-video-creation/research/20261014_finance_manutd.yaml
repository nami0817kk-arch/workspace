  title: マンチェスター・ユナイテッド、欧州なしで過去最高の売上。赤字が残ったのはどこか
  question: 売上が過去最高でも、最終の損益が赤字になるのはなぜか
  lead: 収入の世界順位が、過去最低の8位だったクラブ。
  hook: ただ、営業が黒字になっても、最終は赤字でした。
  opening_image: assets/images/20261014_finance_manutd/01_w.jpg
  takeaway: マンチェスター・ユナイテッドの2025-26（2026年6月期）の売上は6億7760万ポンドで、ヨーロッパの大会に出なかったのに過去最高。前の季より1110万ポンド増え、放映権収入が3380万ポンド増えた一方、商業収入は1590万ポンド、試合日の収入は670万ポンド減った。本業の利益は過去最高の2億1640万ポンドで、営業損益は2260万ポンドの黒字（前の季は1840万ポンドの赤字）。ただ黒字の中には選手の売却益4690万ポンドが入り、引くと2430万ポンドの赤字になる。金融費用は6960万ポンドで営業の黒字の3.1倍。最終は4300万ポンドの赤字で、5季とも赤字、合計は3億3330万ポンド。純借入は6億2170万ポンドで5季でいちばん多く、売上の91.7%。借入の利息として払った現金は3890万ポンドで、2021-22の2060万ポンドの1.9倍。現金では、選手の獲得などに2億9230万ポンドを出して1億4860万ポンドが戻り、新しいスタジアムのための土地を含む設備に8590万ポンドを使った。デロイトの集計では2024-25の収入は7億9300万ユーロで世界8位、過去最低の順位。純借入は円でおよそ1299億円（1ポンド209円）
short_title: マンチェスター・ユナイテッド、売上は過去最高でも最終は赤字。金融費用は営業の黒字の3.1倍
