# クラブの財政：マンチェスター・ユナイテッド（10/14 水、シリーズ「クラブの財政」、key: finance_manutd、型は news）。
#
# 軸は「**ヨーロッパの大会に出なかった年に、売上は過去最高。営業は黒字になったのに、最終は赤字**」。
#   → 本業の利益が、償却・金融費用・借入を経て赤字になる道筋を、決算の順に追う。
#   10/12 リヴァプール回の軸（優勝の年に増えた収入の中身＝放映権が3分の2）／10/11 バイエルン（株の持ち主）／10/10 PSG（関連当事者取引）／
#   10/9 レアル（スクワッド・コスト・ルール）／10/8 アルテタ（契約）／10/7 シティ（判決）／10/3 バルサ（使える上限）は**1行も出さない**。
#   ★放映権の増加は「リーグの順位が15位→3位」を一言で言うだけ。**リーグの配分の額・割合は言わない**（リヴァプール回の軸）。
#   ★スクワッド・コスト・ルール／利益と持続可能性の規則（PSR）は言わない（決算にクラブが「順守している」と書くだけで、台本では触れない）。
#   ★**10/10 の「ユニフォームとエンブレムの歴史 マンチェスター・ユナイテッド」（scripts/20261010_kit_manutd.md）が、胸スポンサー（シャープ・スナップドラゴン）・用具メーカーの最低保証16億5000万ポンド・
#     「欧州に出ない年は年1000万ポンド減る」条項・エンブレムを言っている**。この回では**1行も言い直さない**（社名も出さない。条項は決算では収益が10年に均されて今季の売上への影響は80万ポンドだけ）。
#   ★練習着のスポンサー契約は「前の季に終わった」とだけ言う（社名なし）。売った選手の名前も出さない（決算に名前は書いてあるが、台本の主役ではない）。
#   ★クラブの数字は男女の合計（決算は1つの会社）。**部門名は並べない**（女子は扱わない決まり）。決算の「女子チームの成績」の文は使わない。
#
# **出どころ（一次情報まで辿れたもの）**:
#   ○ **クラブ（親会社 Manchester United plc）の年次報告 20-F（2026年6月期、SEC 提出 2026-09-24）**。損益・貸借・キャッシュフロー・注記（金融費用・純借入・従業員数）の数字は
#       千ポンド単位の原文から。前の季（2025年6月期）／2024年／2023年／2022年の数字は、各年の 20-F（2025-09-18／2024-09-13／2023-10-27 提出）で突き合わせた。
#   ○ **クラブの第4四半期・通期決算の発表（6-K の添付、2026-09-23）**。「過去最高の売上」「本業の利益が過去最高」「今季の見通し（売上7億4000万〜7億6000万ポンド）」の出どころ。
#   ○ **デロイトのフットボール・マネー・リーグ 2026（2026-01-22、2024/25）**＝マンチェスター・ユナイテッド 8位 7億9300万ユーロ（前の年は7億7100万ユーロ）。「過去最低の順位」とデロイトが書いている。
#   ○ ヨーロッパ中央銀行の参照相場（frankfurter.app 経由）2026-10-13：1ポンド＝209.46円（丸めて209円）。リヴァプール回（10/12）と同じ209円。
#   × **プレミアリーグの2025/26の配分（クラブごと）の公式表は見つけられなかった**（2024/25 の表までしか確認できない）。台本では配分の額を言わない。
#       20-F の「主な取引先」の割合（プレミアリーグ 30.1%・21.2%・24.3%）は使わない（丸めがあり、台本の主役でもない）。
#   × **デロイトの2025/26の数字は未公表**（次の版は2027年1月ごろ）。順位と収入は2024/25 のものとして、年を付けて言う。
#   × **第1四半期（2026年7〜9月）の決算の日付は未確認**（SEC の最新の提出は 2026-09-24 の 20-F）。去年は 2025-12-05 に日付を告知し 2025-12-11 に発表。
#
# ★**数字が3種類あるので混ぜない**:
#   (1) **7億9300万ユーロ** … デロイトの集計（2024/25、世界8位）。ユーロ。
#   (2) **6億7760万ポンド** … クラブの決算の売上（2025-26＝2026年6月期、過去最高）。ポンド。
#   (3) **2億1640万ポンド** … クラブが示す「本業の利益」（償却・金融費用・特別な費用・選手の売却益を除いたもの）。
#   **(1) と (2) は年が違う（2024/25 と 2025-26）。為替で橋渡ししない。**台本では「デロイトの集計」「クラブ自身の決算」と言い分ける。
#   決算の季は 7月1日〜6月30日。「2025-26」＝2026年6月期。
#
# **注意：20-F と発表の丸めが0.1ずれる所**（£000 の原文から自分で引いたほうを使った）:
#   放映権の増加：20-F の文は +33.9／表は 206,765−172,977＝33,788 →「3380万」。商業 317,329−333,274＝−15,945 →「1590万」。試合日 153,555−160,263＝−6,708 →「670万」。
#   売上の増加 677,649−666,514＝11,135 →「1110万」。waterfall は 33.8−15.9−6.7＝11.2 で、板の合計は決算の 11.1 を置く（0.1の端数）。
#   試合日の売上そのもの（153,555）は 20-F が「153.5」と書く。台本では額を読まず、増減だけ言う。
#   2022-23 の売上：2023年の 20-F の1か所に 643.9 とあるが、同じ書類の本文・2024年・2025年の 20-F はすべて 648.4。648.4（648,401）を使う。
#
# 自分で計算した数（機械は検算しない）:
#   売上（£000）：2021-22 583,201／2022-23 648,401／2023-24 661,755／2024-25 666,514／2025-26 677,649
#   5季の伸び 677.649 − 583.201 ＝ 94.448 →「9440万」（+16.2%）
#   放映権収入の5季：214.847 / 209.095 / 221.745 / 172.977 / 206.765。2025-26 は 5季で4番目（221.7＞214.8＞209.1＞206.8＞173.0）。2023-24 比 −14.98 →「1500万」（語りでは「下回る」まで）
#   本業の利益 216.4（前の季 182.8、+33.6 →「3360万」）。クラブの発表の数字そのまま
#   P&L の waterfall：216.4 − 232.444（償却 211.813＋減価償却 20.631）− 8.209（特別）＋ 46.881（売却益）− 69.620（金融費用）＋ 4.031（税金の戻り）＝ −42.961（決算の最終 −42.954。0.007の端数）
#   営業損益 22.635（前の季 −18.430）→「2260万」「1840万」。営業が黒字は 2019-20（+5.221）以来：5季の営業損益 −87.384 / −11.180 / −69.353 / −18.430 / +22.635、合計 −163.712
#   売却益を引く：22.635 − 46.881 ＝ −24.246 →「2430万の赤字」（決算書の「売却益の前の営業損益」の行 −24,246 と一致）。売却益 ÷ 営業の黒字 46.881 ÷ 22.635 ＝ 2.07 →「2.1倍」
#   金融費用 69.620 ÷ 営業の黒字 22.635 ＝ 3.08 →「3.1倍」。内訳：借入の利息 35.585＋0.775＝36.360／移籍金の割引の戻し 18.864／為替差損 9.963／その他 12.470／受取 −8.037
#     （その他＝発行費の償却 2.530＋債権の売却取引 4.820＋ヘッジの無効分 4.388＋リース 0.300＋引当金 0.374＋デリバティブ 0.058＋…＝合計 77.657 から逆算。差し引き 69.620）
#   前の季の金融費用 21.234（為替差益 22.931 とヘッジの戻り 11.400 があった）。為替の差損益の振れ 22.931＋9.963 ＝ 32.894 →「3290万」（金融費用の増加 48.4 のうち。語りでは額を言わず「前の季は為替差益があった」まで）
#   最終損益（£000）：−115,510 / −28,678 / −113,159 / −33,023 / −42,954。合計 −333,324 →「3億3330万」
#   純借入（£000）：514,899 / 537,277 / 473,072 / 550,869 / 621,708。2025-26 − 2024-25 ＝ 70.839 →「7080万」。÷ 売上 621.708 ÷ 677.649 ＝ 91.74% →「91.7%」
#   利息の支払い（現金）：20.6（2021-22）/ 32.0 / 37.2 / 37.2 / 38.9。38.9 ÷ 20.6 ＝ 1.89 →「1.9倍」。38.9 ÷ 22.635 ＝ 1.72 →「1.7倍」
#   人件費（£000）と割合：384,141 (65.9%) / 331,374 (51.1%) / 364,719 (55.1%) / 313,256 (47.0%) / 302,025 (44.6%)。人件費＋償却：513,838 → 75.8%
#   平均従業員数：1,140（2023-24）→ 932 → 808（2025-26）、−29.1%
#   営業損益の改善：22.635 − (−18.430) ＝ 41.065 →「4110万」。内訳：特別な費用 36.626→8.209（+28.417）／人件費 +11.231／その他の費用 +11.212／売上 +11.135／
#     償却・減価償却 −19.069（減価償却 −3.629、償却 −15.440）／売却益 −1.861。合計 41.065。特別な費用の分は 28.417 ÷ 41.065 ＝ 69.2% →「およそ7割」
#     板の段は 28.4／11.2／11.2／11.1／−19.1／−1.9 ＝ 40.9 で、合計は 41.1 を置く（0.2の端数＝0.5%）。
#   現金（20-F の表）：本業 178.7（前の季 72.7、178.7 ÷ 72.7 ＝ 2.46 →「2.5倍」）／獲得 −292.3／売却 +148.6／設備 −85.9（うち土地 63.5）。
#     178.7 − 292.3 + 148.6 − 85.9 ＝ −50.9 →「5090万の不足」。財務の純流入 +35.3（債券の借り換え 89.5、借入枠の返済 −50.0）。現金は 86.1→67.2（−18.9）
#   選手などの現金（5季）：出した 115.4 / 156.2 / 190.7 / 278.8 / 292.3＝合計 1033.4、戻った 30.3 / 31.6 / 37.0 / 48.8 / 148.6＝合計 296.3、差 −85.1 / −124.6 / −153.7 / −230.0 / −143.7＝合計 −737.1。
#     148.6 ÷ 48.8 ＝ 3.05 →「約3倍」。★20-F 本文の「5年平均 1億4610万」は**登録（選手）の分だけ**の別の集計。ここは表の「無形資産の支払いと収入」の行で、5年平均は 147.4。台本で平均は言わない。
#     ★「戻った現金」には、将来受け取る移籍金の債権を売って得た分が含まれる（クラブの発表の文）。額の内訳は出ていない。
#   決算期のあと（20-F の「重要な変更」）：選手の獲得・契約延長 191.731（支払いは5年以内）／売却の純額 9.780／借入枠で借りた分 110.0（6月末）→ 200.0（報告書の時点）。枠の上限 400.0、期限 2031…ではなく **2029-12-31**。
#   純借入 621.708 × 209 ＝ 129,937 百万円 →「約1299億円」（換算の板）。1日あたりの売上（677.649 ÷ 365 ＝ 1.8566 →「約186万ポンド」、×209 ＝ 約3億8800万円）は、尺を詰めるため台本では使っていない
#   今季の見通し：売上 7億4000万〜7億6000万ポンド（677.649 との差 62.351〜82.351 →「6240万」「8240万」）、本業の利益 2億500万〜2億2500万ポンド（今季 216.4）
#
# **言い切っていないもの**:
#   ・放映権の増加の理由は「クラブの説明＝リーグの順位が15位から3位に上がった。一方でヨーロッパの大会には出なかった」まで。
#   ・金融費用の「移籍金の割引の戻し」は、決算の注記の語（unwinding of discount relating to registrations）を「利息に当たる費用」と言い換えて説明する。
#   ・商業収入の増減の理由は、20-F の説明のまま（スポンサー −27.9：練習着の契約が前の季に終わった／グッズ等 +11.9：通販を自前で運営する形が丸1年になった、一度きりの戻りを含む）。
#   ・決算期のあとの借入と補強は「数字だけ」。この2つを結びつけた言い方（補強のために借りた、など）はしない。
#   ・次の決算の日付は出ていない、まで。
#
# 写真：assets/images/20261014_finance_manutd/ に Commons の3枚（credits.json 同梱。01_w＝上空 CC BY-SA 3.0 de＝冒頭／02_w＝アレックス・ファーガソン・スタンドの外観 CC BY-SA 2.0＝サムネ／03_w＝場内 CC0＝③の節）。
# アルファベットは読み上げに出さない（ヨーロッパの大会・チャンピオンズリーグ・ヨーロッパリーグと書く）。
# サムネは構図 number（案A）。**ユーザーと相談して決める**ので、案B・Cは報告に出す。
