# 取材メモ（2026年11月16日）46歳ロナウジーニョがセリエCのラヴェンナで11年ぶり復帰。前半45分で交代、ラヴェンナは1-0勝ち。試合後に語ったこと（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-16。ESPN の記事2本は requests が 202（空）だったので WebFetch で読んだ。サッカーキング2本は requests（ブラウザUA）で全文。検索エンジンのAI要約・ブラウザの道具は使っていない。
# 出典で確かめたこと:
#   ・サッカーキング 2228194（2026-11-16、全文。元は スカイ・スポルト）: 11年ぶりの現役復帰。フルミネンセ時代の 2015-09-26 以来。15日、本拠地スタディオ・ベネッリ、セリエC 第14節 対フォルリに先発、前半45分間の出場。
#       1万2000人収容のスタジアムは完売。守備は最前線、攻撃は攻撃的MF。ボールタッチ28回、ゴール・シュートなし。CKのキッカーとして味方のシュートを演出。
#       35分のジュリオ・ドナーティの中距離シュートのゴールは、ロナウジーニョがボックス手前で受けてロレンツォ・ロナルディ（記事表記「ロナアルディ」）へ横パスを出したのが起点。ラヴェンナは 1-0 で勝った。
#       あらかじめ前半のみの出場が決まっていた。ハーフタイムのスカイ・スポルトのインタビューと試合後の囲み取材で本人が語った（下）。
#   ・ESPN（story 50491487・50489043、WebFetch、2026-11-15）: 46歳。ラヴェンナ対フォルリ（地元のライバル）。前半45分でマッジョに交代（後半の頭）。引退時の通算299ゴール、ゴールなし。ドナーティが先制（分は書かれていない）。
#       本人の言葉（スカイ・イタリア）: "It went by too fast, that has always been football for me." "Is this my last one? I don't know." "It was lovely to be here, playing, having the build-up in the dressing room."
#       → サッカーキングの日本語と中身が合う。台本の言葉はサッカーキングの日本語を使い、言い回しだけ話し言葉に整えた。
#   ・サッカーキング 2227757（11/14）: 監督アンドレア・マンドルリーニ「彼は間違いなく先発する。我々には結果が必要だからだ」。チームトレーニングには2日ほどしか参加していない。ラヴェンナはセリエC 2位（11/14 時点）。
#   ・ESPN の試合データ（site.api.espn.com）は セリエC を持っていない（ita.3 系は空）。スコア 1-0 とドナーティ35分はサッカーキングのみ（ESPN の記事もドナーティの先制は確認）。→ 報道。
# 食い違い・扱い:
#   ①「300ゴールを目指す」という8月の発言は本文を読んでいない（サッカーキング 08-21 の見出しのみ）。台本には使わない。通算は ESPN の「299ゴール」だけ使う。
#   ②交代の分: ESPN は「後半の頭に交代」、サッカーキングは「前半45分間の出場」。「前半だけ出場」と言う。
#   ③写真: 記事の写真はすべて Getty/AFP なので使わない。Commons の CC BY-SA 2.0（Sports Festival 2025、2025-06-14）などを使った。ラヴェンナの試合の写真ではない（台本では「その試合の写真」と言わない）。
