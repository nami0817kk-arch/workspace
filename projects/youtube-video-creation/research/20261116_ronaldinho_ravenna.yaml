    say:
      - text: 46歳ロナウジーニョが、イタリア3部ラヴェンナで11年ぶりに復帰。
      - text: 前半の45分間、プレーしています。
        image: assets/images/20261116_ronaldinho_ravenna/02_w.jpg
      - voice: ロナウジーニョ
        text: あっという間だったね。
        emph: true
      - voice: ロナウジーニョ
        text: 私にとってサッカーとは、いつだってこういうものなんだ。
        cont: true
      - text: 復帰は、クラブと本人の意向で、1試合限定でした。
      - text: 最後の試合になるのかと聞かれて、こう答えています。
        image: assets/images/20261116_ronaldinho_ravenna/02_w.jpg
      - voice: ロナウジーニョ
        text: これが最後になるかって？さあ、どうだろう。
      - voice: ロナウジーニョ
        text: 会長がまた声をかけてくれたら、戻ってくるよ。
        cont: true
      - voice: ロナウジーニョ
        text: いつだって楽しいからね。
        cont: true
      - text: 試合後には、ロッカールームで過ごした時間についても語っています。
        image: assets/images/20261116_ronaldinho_ravenna/04_w.jpg
      - voice: ロナウジーニョ
        text: ここに来て、プレーして、ロッカールームで試合の準備をする。
      - voice: ロナウジーニョ
        text: その時間は、本当に素晴らしかった。
        cont: true
      - voice: ロナウジーニョ
        text: 若い選手たちと過ごせて楽しかったよ。
      - voice: ロナウジーニョ
        text: 僕のプレーを見て育った選手もいて、最高だった。
        cont: true
