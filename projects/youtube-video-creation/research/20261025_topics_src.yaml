  slot: 海外
  head: チェルシーから来たジャクソン、マンC相手に2発。ヴィラで11試合7点、うち最近の6試合で6点
  why: BBC：ワトキンスの代わりとしてチェルシーから最大6,500万ポンドで加入。ヴィラで11試合7点（直近6試合で6点）、CLは全勝。チェルシーではPL65試合24点（210分に1点）、ヴィラでは7試合4点（138分に1点）。ジャクソン：「選手も監督もチームも、全部が信じられないくらいいい。ここに来られてとても幸せ」（BBC）、「信じられない。難しかったけど勝った。それが一番大事」（ESPN）。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定。写真：コモンズは同名が多く未確認。**弱い：題1と同じ試合**。時刻：18時以降。試験：Y。
  src: BBC（ジャクソンの数字）、ESPN（試合）
  url: https://www.bbc.co.uk/sport/football/articles/c6p9gkdzzpnro
  fmt: quote
- num: 7
  slot: 海外
  head: マレスカ「グエヒのことは全く心配していない」。先制点を与えたトラップミス、前半で交代。代表戦のミスから続く
  why: ESPN（PA）：グエヒは高いボールを止め損ね、ジャクソンの先制点につながった。前半に警告を受け、ハーフタイムで交代。代表ウィークではスペイン戦で早い時間のミスから失点、先週のイプスウィッチ戦ではPKを与えていた。マレスカ：「戦術的な判断だ。全試合で起きること」「マルクのことは全く心配していない。今季始まってからクラブでも代表でも全部の時間に出ている」「警告を1枚もらっていると、攻撃的に行きたいときに危ない」。**条件：本人（監督）の言葉に当たる。代表戦（イングランド対スペイン）のミスに一言**。確度：確定。写真：未確認。**弱い：言葉は監督で、題の人物（グエヒ）本人の言葉は無い。選手のミスが主役なので、貶す語にしない**。時刻：18時以降。試験：Y。
  src: ESPN（PA）
  url: https://www.espn.com/soccer/story/_/id/50266772
  fmt: quote
- num: 8
  slot: 海外
  head: パーマー、プロで初めての退場。チェルシーはPLで通算100枚目、エヴァートン・アーセナルに次いで3チーム目
  why: ESPN：後半25分、ボールを手で止めた倒れたままのマテウス・フェルナンデスに詰め寄り1枚目、35分にギャラガーへの遅れたタックルで2枚目。チェルシーのPL通算の退場は100（エヴァートン113、アーセナル110に次ぐ3チーム目）。昨季は11回でリーグ最多。アロンソ：「まだ映像は見ていないが、たぶん正しかったと言われた。今季初めての退場だ」「1-0になってもまだ20分あった。冷静さと成熟が要る。将来に向けて学ぶ1枚だ」。出場停止は水曜のリーグ杯リヴァプール戦で、次節のマンU戦には出られる見込み。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定。写真：コモンズでパーマーは1,000件以上（同名を含む）。**弱い：10/24 に「アロンソ『感情のコントロールだ』、退場ゼロ」を作った直後の話（続きとして見せるなら強い）**。時刻：18時以降。試験：Y。
  src: ESPN（パーマーの退場）、ESPN（アロンソの会見）
  url: https://www.espn.com/soccer/story/_/id/50267923
  fmt: news
- num: 9
  slot: 海外
  head: デ・ゼルビ「仮面を外して、正直に話した」。スタンフォード・ブリッジで34回目にしてPL2勝目。序盤は最下位だったスパーズ
  why: ESPN：ペンダースのオウンゴール（77分）とテルの独走（87分）で0-2。スパーズはスタンフォード・ブリッジでPL34回の訪問で2勝目。約4億ポンドで10人を補強しながら序盤は最下位だった。デ・ゼルビ：「今は完成したチームだ」「夕食で一緒にいるとき、更衣室で一緒にいるとき、違うグループ、違う関係が見える」。今月のマンU戦（1-1）の前に「大きな、大きなミーティングをした。仮面を外して、自分たちの前で正直に、はっきり話した。あの時から何かが変わった」。BBCもこのミーティングを記事にしている。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定。写真：未確認（前回は2,707件ほど）。**弱い：10/24 の一覧でデ・ゼルビ（医療スタッフ）を出した。マディソンはまた負傷交代（題22）**。時刻：18時以降。試験：Y。
  src: ESPN（デ・ゼルビの会見）、BBC
  url: https://www.espn.com/soccer/story/_/id/50268600
  fmt: quote
- num: 10
  slot: 海外
  head: アロンソ「勝つときも負けるときも一緒だ」。PL初先発の21歳ペンダースが、CKをパンチして自分のゴールへ
  why: ESPN：負傷のE・マルティネスに代わってPL初先発のペンダースが、77分のCKを自陣ゴールへ殴り込んだ。アロンソ：「勝つときも負けるときも一緒だ。ミスに向き合い、乗り越えるのも仕事のうち。私自身も知っている」「マイクを支える。彼はそこから学び、もっとできると示したくなるはずだ」。ジョアン・ペドロは前日に痛めて欠場、「まだ分からない。明日検査する」。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定。写真：ペンダースは前回162件ほど。**弱い：10/24 の一覧に「アロンソ『クルトワもペンダースに自分を見ている』」を出した（✖）。若い選手のミスが主役なので、貶す語にしない。題8と同じ試合**。時刻：18時以降。試験：Y。
  src: ESPN（アロンソの会見）
  url: https://www.espn.com/soccer/story/_/id/50268841
  fmt: quote
  weak: true
- num: 11
  slot: 海外
  head: アルテタ「ほかの監督の分も、画像を大量にためてある」。今季2枚目の警告。あと1枚でベンチに入れない
  why: ESPN・BBC：エヴァートン戦（2-0）でアルテタは今季2枚目の警告（モイーズとアシスタントのエインセも警告）。アルテタ：「10分で36回テクニカルエリアを出て、警告なしという記録を持つ監督がいる。だから全部切り抜いている。画像を大量にためてある」「気をつけないといけない。いいセンサーが要る」。3枚目でベンチ入り禁止1試合。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。写真：未確認。**弱い：アルテタは10/21・22・24 と続いている**。時刻：18時以降。試験：Y。
  src: ESPN（アルテタの会見）、BBC
  url: https://www.espn.com/soccer/story/_/id/50269350
  fmt: quote
- num: 12
  slot: 海外
  head: アーセナル、今季初のセットプレー弾で首位マンCに勝ち点で並ぶ。コンサは移籍後初ゴール、ガブリエルはPL200試合目
  why: ESPN（PA）：昨季セットプレーから29点で優勝したアーセナルが、今季はここまでセットプレー0点。前半7分のCKからヴィラから来たコンサが押し込み、後半にガブリエルがPL200試合目を頭で決めた。リーグ8試合で7勝、公式戦13試合で11勝。マンCとは勝ち点で並び、得失点差で2位。ギェケレシュが今季リーグ初先発。**条件：代表・W杯は絡みません。本人の言葉は取れていません**。確度：確定。写真：未確認。**弱い：言葉が無い。アーセナルは10/21〜24 と続いている**。時刻：18時以降。試験：X。
  src: ESPN（PA）
  url: https://www.espn.com/soccer/story/_/id/50253048
  fmt: news
  weak: true
- num: 13
  slot: 海外
  head: アルバレス「W杯中の言葉を謝りたい」。バルサ行きを望んだ夏から、8か月ぶりのリーグ戦ゴールのあとで
  why: ESPN：デポルティーボ戦（1-0）の後半3分に決勝点。リーグ戦は8か月ぶり、ホームのリーグ戦では2025年11月以来。アトレティコは首位バルサと勝ち点2差。アルバレスはW杯中にクラブを出たい、行き先はバルサと話し、今季はスタジアムで口笛やブーイングを受けていた。アルバレス（Movistar）：「W杯中の自分の言葉について、ファンに謝りたい。言い方もタイミングも間違いだった」「来てからずっと、とても温かく支えてくれた。だから怒る気持ちは分かる」。シメオネ：「謝る人を、私はとても尊敬する。謝るのは簡単ではないから」「クラブがファンの夢見る高さに届くには、ジュリアンが最高の状態でいる必要がある」。**条件：W杯（アルゼンチン代表として臨んだ大会中の発言）に当たる。本人の言葉に当たる**。確度：確定。写真：未確認。**弱い：10/21 に「アルバレス174日」を作った。今日のシリーズはシメオネの監督紹介**。時刻：18時以降。試験：Y。
  src: ESPN（アルバレスの謝罪）
  url: https://www.espn.com/soccer/story/_/id/50270296
  fmt: quote
- num: 14
