  slot: 日本人
  head: 町田浩樹「ベルギーの時は連戦が楽だった」。前十字靭帯から戻った代表DFが語る、ブンデスの強度
  why: フットボールゾーンの取材コラム（中野吉之伴、ELリヨン戦のあと）。町田（ホッフェンハイム）：「ベルギーリーグの時は連戦が続くことも自分にとっては楽だったが、ブンデスリーガになるとリーグ戦のレベルが上がって、かなり疲労度が違う」。何が違うかと聞かれ「まあ、全部そうですね」「前から潰しに行くチームなので、機能しないとひっくり返されて長い距離を走らないといけない。それを連戦の中でも続けないといけない」。昨年8月に左膝の前十字靭帯を断裂し、今季第3節で約1年ぶりに復帰。「試合をするごとに身体は良くなってきている」。今夜23時30分にレヴァークーゼン戦。**条件：日本代表に当たる。本人の言葉に当たる**。確度：確定（取材）。写真：コモンズで8件ほど（本人確認前）。**弱い：出来事ではなく取材の話。出典は1本**。時刻：9〜17時。試験：Y。
  src: フットボールゾーン（町田の取材）
  url: https://www.football-zone.net/archives/680707
  fmt: quote
  weak: true
