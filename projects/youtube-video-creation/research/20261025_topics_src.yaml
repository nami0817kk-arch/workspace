  head: モウリーニョ「モウリーニョのマドリーはタイトルを獲る」。首位バルサと6差で、日曜のクラシコへ
  why: ESPN：前日会見。マドリーはベティス・アトレティコに敗れバルサと6差、代表ウィーク明けは4連勝。カンプ・ノウの試合が試金石かと問われて「違う。モウリーニョのマドリーはタイトルを獲る」。「1週間前にバルサに大敗すると思っていた人は、今も同じことを思っているだろう」「私たちは完成品のように見られているが、まったく違う。監督が選手を知り、道を決めている初めの段階だ。2〜3年一緒のチームと比べるのは公平ではない」。ヴィニシウスは出場停止。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。写真：未確認。**弱い：10/23 にモウリーニョの監督紹介、10/24 にクラシコの題を2本（チュアメニ・ヤマルとムバッペ）作った**。時刻：18時以降（試合は26日5時）。試験：Y。
  src: ESPN（モウリーニョの会見）
