title: 10月25日のショート題材
lead: 候補約70件から23件（日本人5件・海外18件）。ショート10本ぶんを○で選んでください。
note: 今日は日曜（25日）、日本時間8時すぎの時点で集めました。土曜（24日）の主な結果は、<b>ヴィラ2-1マンC（マンCの開幕8連勝を阻止。鈴木彩艶が6セーブ）</b>、アーセナル2-0エヴァートン（勝ち点でマンCに並ぶ）、<b>チェルシー0-2スパーズ（パーマー退場）</b>、ナポリ3-3ローマ、アトレティコ1-0デポルティーボ、ドルトムント1-0フランクフルト、マインツ2-3ブレーメン。今日の試合：リヴァプール対ブライトン・マンU対ボーンマス（23時）、ホッフェンハイム対レヴァークーゼン（23時30分）、フライブルク対バイエルン（26日1時30分）、<b>クラシコ（26日5時）</b>。月曜はバロンドール。<br><br><b>日本人の題は5件だけです。</b>新しい出来事があったのは鈴木彩艶（マンC戦）と、森保監督の発言（上田・冨安のケガ）、町田浩樹の取材の言葉です。堂安（ドルトムント戦先発・0-1）、佐野海舟（ブレーメン戦先発・2-3）、田中聡（シャルケ0-0）、菅原（途中出場）は、試合に出ただけで記事になる出来事が見つからず出していません。鈴木彩艶は2件（1・2）ありますが、同じ試合の話なので1件に絞るのを推奨します。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは、鈴木彩艶・森保監督（上田・冨安・アジア杯）・町田（代表DF）と、アルバレス（W杯中の発言を謝罪）、グエヒ（代表戦のミス）、ゴードン（イングランド代表）です。本人の言葉が取れたのは16件。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外。マンU（23時）・クラシコ（26日5時）の試合前の題は、試合より前に出す必要があります。<br><br><b>重なりの注意：</b>チェルシー対スパーズが5件（8・9・10・21・22）、ヴィラ対マンCが5件（1・2・6・7・23）、クラシコが3件（14・15・16）。同じ試合は1〜2件に絞るのを推奨します。10/24 に作ったアロンソ（退場ゼロ）・アルテタ（サカ）・コンパニ・ヤマルとムバッペ、10/21 のアルバレス（174日）、10/23 のモウリーニョ（監督紹介）、10/22 のキャリックとは一部重なるので、各行の「弱い」に書きました。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりのため<b>読めませんでした</b>。移籍の題は出していません。ガーディアンは記事APIが開けず、今回は使っていません。フットボールゾーンの検索は応答が無く、一覧の1〜4ページだけ見ました。ゲキサカは土曜夜（ドルトムント戦・チェルシー戦）の記事がまだ出ていませんでした。ESPN（記事API）・BBC・ゲキサカ・フットボールゾーンの本文は読みました。コモンズの件数は途中で制限がかかり、多くは「未確認」です（数は同名を含む検索の当たり数）。女子サッカー・Jリーグ・MLS・英2部は出していません。FotMobは使っていません。
