  slot: 日本人
  head: 「ミッドフィールダーを獲ったのかと思った」。ヴィラのキャッシュが語る、鈴木彩艶の足元
  why: フットボールゾーンが英TNT Sportsを紹介。右サイドバックのマティ・キャッシュ：「彼が来た最初の練習のポゼッションで、ミッドフィールダーを獲ったのかと思った」「視野の広さは信じられないほど。クロスを本当にうまく捕ってくれるので、サイドバックにとっては夢のよう」。マンC戦は6セーブで2-1。**条件：日本代表に当たる。言葉は同僚（キャッシュ）のもので、鈴木本人の言葉ではありません**。確度：確定（発言は孫引き。TNTの元の映像は見ていません）。写真：鈴木は11件ほど、キャッシュは未確認。**弱い：題1と同じ試合。出典は日本語の1本（元はTNT）**。時刻：9〜17時。試験：Y。
  src: フットボールゾーン（TNT Sportsの紹介）
