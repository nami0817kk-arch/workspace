  why: ESPN：マレスカ：「作ったチャンスと与えたチャンスの量からすれば、もっと値する試合だったと思う」「相手の箱の中で決め切れなかったから負けた」「1点目はミスから、2点目は切り替えから。避けにくい」。エンディアイェはポストに2度、グヴァルディオルはバー。試合前、マンCは財務規則違反の判定を受けたことで、敵地でまたブーイングを浴びた。ハーランドはリーグ9点目。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定。写真：マレスカは14件ほど。**弱い：題1・6・7と同じ試合。題7と言葉の出どころが同じ会見**。時刻：18時以降。試験：Y。
