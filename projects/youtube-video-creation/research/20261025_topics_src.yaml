  head: ゴードン、バルサでの自己採点は「10点中7.5」。初めてのクラシコへ「まだ長い、長い道のりがある」
  why: ESPNの単独取材。25歳のイングランド代表、バルサで11試合2点5アシスト。ゴードン：「数字を付けるなら7.5」「よかったが、まだずっとできる。PSG戦はもっとできた」「こういう試合でいつも最高の水準でいないと、なりたい選手にはなれない」。PLでは「いつも敬意を払われているとは感じなかった」と話していたが、今は「みんながバルサを見ているから、自分のプレーを見てもらえる」。**条件：本人の言葉に当たる。イングランド代表（W杯は絡まず）**。確度：確定（取材）。写真：未確認。**弱い：クラシコの題が続く（14・15）**。時刻：18時以降。試験：Y。
