  head: 心臓の手術から戻ったマクトミネイが2発。それでもナポリは、ローマに2度追いつかれ3-3
  why: ESPN（PA）：アングイサのオーバーヘッドで先制、後半3分にマクトミネイが頭（ゴリーニがかき出したこぼれを押し込む）で2-0。ローマはスーレとバレルディで追いつき、83分にマクトミネイが20メートルのグラウンダーで再び勝ち越すも、最後の1分にバレルディが頭で3-3。マクトミネイは週中のCLボデ／グリムト戦（4-3）でも2点、心臓の手術からの復帰が続いている。ナポリはリーグでつまずきが続く。**条件：代表・W杯は絡みません（記事に無い）。本人の言葉は取れていません**。確度：確定。写真：未確認。**弱い：言葉が無い。手術の中身は記事に無い**。時刻：18時以降。試験：X。
