  head: バルサ、勝てば開幕10連勝で1968-69年のマドリーを超える。フリックのムバッペ対策は「立ち位置」
  why: ESPN：バルサはリーグ9戦9勝。クラシコに勝てばマドリーと9差、1968-69年にマドリーが作ったスペイン1部の最高の滑り出しの記録を更新。ムバッペは今季12試合12点。フリック：「大事なのは、ボールを持たないときも持つときも立ち位置だ。互いの位置を正しく取り、コンパクトでいること。このラインの高さでやるなら、それが大事」。12試合で50点・15失点。エリック・ガルシア、クンデ、クリステンセン、オルモが欠場。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。記録の比べは ESPN の記述のまま（自分では数えていない）。写真：未確認。**弱い：10/24 の「ヤマル20、ムバッペ15」とクラシコの数字で重なる**。時刻：18時以降。試験：X。
