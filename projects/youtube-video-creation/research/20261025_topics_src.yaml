  head: 宇野禅斗が移籍後初アシスト。ダイレクトボレーをスカリーがかかとで変え、ボルシアMGの今季初勝利の1点目
  why: 23日のシュツットガルト戦（フットボールゾーン）。0-1の前半38分、相手のクリアをエリア内から右足でダイレクトボレー、スカリーがバックヒールでコースを変えて同点。清水から今季加入した22歳の初アシスト。現地紙の採点は3（「前半30分は精彩を欠いた」「終盤に不運なハンド」）。**条件：代表・W杯は絡みません。本人の言葉は取れていません**。確度：確定。写真：コモンズで0件。**弱い：10/24 の町野の本と同じ試合で、宇野にも触れている。写真が無い**。時刻：9〜17時。試験：X。
