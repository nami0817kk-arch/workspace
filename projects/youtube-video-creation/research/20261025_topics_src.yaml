  head: コンパニの離脱は「日単位ではなく週単位」。バイエルンのエベールが語った検査の今
  why: ESPN（AP）・BBC：金曜にリザーブの練習を見ていて倒れた。エベール：「状態は安定している」「検査ですでに結果は出ているが、何なのか、回復にどれだけかかるかはまだ要る」「戻るのは万全になってから。期間は決めない。日ではなく週の話だ」。先週からウイルス感染で、ライプツィヒ戦はずっと座ったまま、水曜のアーセナル戦（2-2）には戻っていた。今夜（26日1時30分）フライブルク戦、鈴木唯人と対戦の可能性。**条件：本人の言葉は取れていません（言葉はエベール）。代表・W杯は絡みません**。確度：確定（クラブの説明）。写真：未確認。**弱い：10/24 に「コンパニ入院」を作った。病気の話なので煽れない**。時刻：18時以降。試験：X。
