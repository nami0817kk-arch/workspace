- num: 3
  slot: 日本人
  head: 森保監督「全治の報告は受けていない」。上田綺世のケガと、また別の場所を痛めた冨安。1月のアジア杯は
  why: 24日、J1のG大阪対京都を視察したあとの囲み取材（フットボールゾーン）。上田について「報道で出ているような情報はいただいていない。軽いかどうかも分からない」「痛めたということは聞いているが、精密検査のうえ全治どれくらいかの報告は受けていない」。冨安は、パレスのサージュ監督が新たな負傷を認めていて、森保監督も「痛めたところと違う箇所をまた痛めてしまい、復帰までにはもう少し時間を要すると聞いている」。来年1月のアジア杯については「復帰できるとも言えるし、アジアカップはダメかもしれないというところもあるかもしれない。こんな言い方しかできない」。開催地サウジアラビアの情勢悪化にも触れた。**条件：日本代表に当たる。本人（森保監督）の言葉に当たる**。確度：確定（取材）。ただし上田がいつ・どこを痛めたかは、この記事に無く未確認。写真：森保は44件ほど、上田は6件ほど、冨安は26件ほど（本人確認前）。**弱い：冨安の離脱延長は10/20 に作った。上田のケガの元の報道は読めていない**。時刻：9〜17時。試験：Y。
  src: フットボールゾーン（森保監督の囲み取材）
  url: https://www.football-zone.net/archives/680722
  fmt: quote
