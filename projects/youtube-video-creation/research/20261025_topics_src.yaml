  slot: 日本人
  head: 鈴木彩艶が6セーブ。開幕7連勝のマンCを止めた、ヴィラ・パークの2-1
  why: 24日のPL第8節（ESPN・ゲキサカ・BBC）。前半6分、グエヒのトラップミスをマッギンが奪い、ジャクソンが先制。鈴木は前半13分にエンディアイェの巻くシュートを横っ飛びで、21分にはシェルキのダイレクトを体を倒して止めた。後半7分にハーランドの頭で同点にされたが、11分にグヴァルディオルの強烈な一撃を指先でバーへ。その5分後にジャクソンが勝ち越し。ESPN「このセーブが決定的だった」。マンCはヴィラ・パークでリーグ4連敗、PLで今季初の黒星。採点はBBCで7、バーミンガム・ライブで8（フットボールゾーン経由）。**条件：日本代表に当たる。鈴木本人の言葉は取れていません**。確度：確定（結果）。写真：コモンズで11件ほど（本人確認前）、10/21・22・24 にも鈴木の本を作っているので写真の使い回しに注意。**弱い：鈴木は10/20〜24 に5本（前日はこの試合の前の話）**。時刻：9〜17時。試験：X。
  src: ESPN（試合）、ゲキサカ（セーブの場面）、BBC（採点）
