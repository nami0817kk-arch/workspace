  head: キャリック「日曜は別のチームになる」。7戦勝ちなし、首がかかるボーンマス戦（日本時間23時）の前に
  why: ESPN・BBC：コモに1-4で敗れたあと、サポーターに謝罪。キャリック：「選手を間違いなく信頼している。100%だ」「日曜は別のチームになる。ならないといけない」。走らないという批判には「『走らない』とだけ言うのは気をつけたほうがいい。勝つのにいつもプレスが要るわけではない」。BBCには「マンUは手に負えないクラブではない」。マルティネスやブルーノの補強・戦術への発言で圧力が増している。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。写真：未確認。**弱い：10/22 にブルーノとキャリック、10/24 の一覧にキャリックの独白を出した。結果が出る前の話なので23時より前に出す必要**。時刻：18時以降（23時より前）。試験：Y。
