  opening_image: assets/images/20261004_bruno_ronaldo/01_w.jpg
  takeaway: 合宿を離れたロナウドについて、3日に主将の腕章を巻いたブルーノ・フェルナンデスが本人との会話を明かし、代表・サッカー・国の「いちばんの象徴」と言い切った。代表のアシストで歴代3位のブルーノが並べたのは、その上にいるフィーゴとロナウド。去るならお祝いの日に、という願いが叶うかは、4日のノルウェー戦のあとに監督と会長が何を話すかにかかっている
