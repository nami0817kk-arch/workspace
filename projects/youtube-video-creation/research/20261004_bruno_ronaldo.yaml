# 取材メモ（10/4 題材 bruno_ronaldo、型は quote）。材料の控えは research/raw/20261004_bruno_ronaldo.md。
# 10/2「ロナウドの代表離脱」、10/3「ロナウド不在のポルトガル」を出している。離脱の経緯は1行だけ。空港の騒ぎ・フォロワー・得点者の分散・146得点は言わない。
# 主役は、チームの中からロナウドをどう語っているか。ブルーノ（10/3 の会見とテレビ）、ヴェイガ・レオン・メンデス（10/1）、監督（10/3）。
# レオンの「7番」の言葉（10/3 で使用）とヴィティーニャの「距離を置こうとした」（10/2 で使用）は使わない。レオンは同じ日の別の答え。
# 試合（10/4 19:45 ポルト）の結果は書かない。試合の前に出す回。
# 事実の裏:
#   ブルーノの会見: FPF 公式 news/58103 と Record の質疑の書き起こし（ポルトガル語の原文から訳した）。「選手の部屋で」は A Bola の版。
#   テレビ: O Jogo・TSF の書き起こし（会見のあと、練習の前のインタビュー）。
#   選手: O Jogo の10/1 のミックスゾーン（ヴェイガ・レオン・メンデス）。
#   監督: A Bola の会見の全文（10/3）。
#   数字: 代表96試合（Record の「95」＋デンマーク戦）、アシスト27で歴代3位（Bola na Rede、Playmaker のデータ。フィーゴ40・ロナウド35）。
#   ロナウドの帰りの便: A Bola 10/3（着くのはポルトガル時間19:44、キックオフ19:45）。会長が試合後に話す見込み: Renascença 10/2。
# 写真: 01 は Commons（CC BY-SA 4.0 / Bryan Berlin、2026年W杯のクロアチア戦）。02・03 は FPF 公式（Diogo Pinto / FPF）。代理店は使っていない。
