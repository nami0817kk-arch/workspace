- id: festa
  heading: 去るなら、お祝いの日に
  tier: 報道
  telop: ブルーノ「もし去るなら、それはお祝いの日でなければならない」
  narrator: キャスター
  say:
  - text: 会見のあとのテレビのインタビューでは、さらに一歩踏み込みました。
    image: assets/images/20261004_bruno_ronaldo/02.jpg
  - voice: ブルーノ
    text: クリスと話したのは、敬意からだ。
  - voice: ブルーノ
    text: 願っているのは、彼がかっとなって、
    cont: true
  - voice: ブルーノ
    text: 代表を完全に去ると決めないこと。
    cont: true
  - voice: ブルーノ
    text: もし去るなら、それはお祝いの日でなければならない。
    cont: true
    emph: true
  - voice: ブルーノ
    text: 今回のようなやり方ではなく。
    cont: true
  - text: さらに、ポルトガルのサッカーの歴史に残るふたりの名前を挙げています。
  - voice: ブルーノ
    text: 彼は、この国の名前を、
  - voice: ブルーノ
    text: 来たことのない場所まで連れていった。
    cont: true
  - voice: ブルーノ
    text: エウゼビオとルイス・フィーゴには、敬意を払ったうえでね。
    cont: true
  - text: エウゼビオは1966年のワールドカップの得点王。フィーゴは2000年のバロンドールです。
  - text: そのふたりを前にしてもなお、ロナウドを上に置きました。
  quotes_from:
  - Record https://www.record.pt/futebol/selecoes/detalhe/bruno-fernandes-a-minha-esperanca-e-que-ronaldo-nao-tome-decisoes-a-quente-e-queira-abandonar-selecao-de-vez
