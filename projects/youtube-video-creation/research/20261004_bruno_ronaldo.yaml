  say:
  - text: 同じ日、先に話したジェズス監督も、ロナウドとの歩み寄りを聞かれていました。
    image: assets/images/20261004_bruno_ronaldo/03.jpg
    card: none
  - voice: ジェズス監督
    text: ロナウドは代表の、そしてポルトガルの象徴だ。
  - voice: ジェズス監督
    text: その話は、試合のあとに時間がたっぷりある。
    cont: true
  - text: 監督の言葉は「象徴」。ブルーノは、そこに「いちばんの」を重ねました。
    image: assets/images/20261004_bruno_ronaldo/01_w.jpg
  - text: そのブルーノは、代表で96試合に出て29得点。
    card:
      type: table
      title: ポルトガル代表 アシストの歴代上位
      columns: [選手, アシスト]
      rows: *assist
  - text: アシストは27で、ポルトガル代表の歴代3位です。
    card:
      type: table
      title: ポルトガル代表 アシストの歴代上位
      columns: [選手, アシスト]
      rows: *assist
      highlight_row: 2
  - text: 上にいるのは、敬意を払ったフィーゴと、象徴と呼んだロナウドの2人。
    card:
      type: table
      title: ポルトガル代表 アシストの歴代上位
      columns: [選手, アシスト]
      rows: *assist
      highlight_row: 1
  - text: 数字で自分の前を行く2人のうち、ロナウドをフィーゴより上に置いた形です。
    card:
      type: table
      title: ポルトガル代表 アシストの歴代上位
      columns: [選手, アシスト]
      rows: *assist
      highlight_row: 0
  - text: ノルウェー戦でも、腕章を巻くのはブルーノとみられています。
    card: none
  - text: キックオフは、日本では5日の明け方、3時45分。
  - text: 試合の日、ロナウドはマドリードからサウジアラビアへ飛ぶ予定です。
  - text: 着くのはポルトガルの時間で19時44分。試合が始まる、1分前です。
    emph: true
  - text: 監督が「話す時間がある」と言ったのも、連盟の会長が口を開くとみられるのも、この試合のあと。
  - text: ブルーノの願った「お祝いの日」が来るのか、その答えも、そこから見えてきます。
