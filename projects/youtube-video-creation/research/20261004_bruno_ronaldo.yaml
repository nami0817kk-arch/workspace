  heading: 腕章を巻いた男が明かした会話
  tier: 報道
  telop: ブルーノ「クリスは代表の、この国のいちばんの象徴であり続ける」
  narrator: キャスター
  say:
  - text: ロナウドがポルトガル代表を離れて4日。主将の腕章を巻いたブルーノが、本人との会話を明かしました。
    short_only: true
  - text: 10月3日の会見。デンマーク戦で主将を務めたブルーノです。
    image: assets/images/20261004_bruno_ronaldo/01_w.jpg
  - text: ロナウドのことを、愛称の「クリス」と呼びました。
  - voice: ブルーノ
    text: クリスとは、話をした。
  - voice: ブルーノ
    text: 伝えたことを、ここでもう一度言う。
    cont: true
  - voice: ブルーノ
    text: 何が起きても、クリスは代表の
    cont: true
  - voice: ブルーノ
    text: いちばんの象徴であり続ける。
    cont: true
    emph: true
  - voice: ブルーノ
    text: この国のサッカーの、そしてきっと、
    cont: true
  - voice: ブルーノ
    text: この国のいちばんの象徴だ。
    cont: true
  - voice: ブルーノ
    text: 彼の居場所は、史上最高の選手たちの中だけじゃない。
  - voice: ブルーノ
    text: ポルトガルのすべての人の、心の中にもある。
    cont: true
  quotes_from:
