  - id: said
    heading: 解説陣が言ったこと
    main: true
    tier: 報道
    telop: 「あれはフォーデンへのレッドではない」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 割れているのが芯。**片方に寄せない**
    say:
      # **ショートだけの前置き**。本編では前の節で言い終えている
      - {short_only: true, text: マンチェスター・ダービーの23分、フォーデンが蹴り返して一発退場になりました。先に倒したのはフェルナンデスです。}
      - この判定について、解説陣の見方が割れました。
      - {voice: ロイ・キーン, text: あれはフォーデンへのレッドカードだとは思わない。本当にそう思わない}
      - キーンは、フェルナンデスが明らかにファウルをして、倒れた相手を小突いたと指摘しています。
      - {voice: ミカ・リチャーズ, text: フェルナンデスが当てているじゃないか}
      - ゲイリー・ネヴィルは、フェルナンデスにお咎めがなかったことに驚いたと伝えられています。
      - 一方、シティのマレスカ監督は、フォーデンの退場そのものは妥当だと認めたうえで、こう言いました。
      - {voice: マレスカ, text: それなら、ブルーノにもレッドカードだ}
    official: false
    sources:
