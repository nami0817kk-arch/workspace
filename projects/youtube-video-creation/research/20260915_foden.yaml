    say:
      - マンチェスター・ダービーの23分。フェルナンデスに倒されたフォーデンが、蹴り返しました。
      - 主審が出したのは、フォーデンへの一発退場です。フェルナンデスにはカードが出ませんでした。
      - 主審の説明は「レッドカード、フィル・フォーデン。ブルーノの体への蹴り出し」。VARは「二次的な動き」と伝えています。
