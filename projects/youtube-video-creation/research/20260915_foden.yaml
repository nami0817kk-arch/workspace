  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    telop: 「ブルーノも普通に蹴ってる」
    narrator: キャスター
    say:
      - {voice: ネット民, text: フォーデン退場は妥当だけど、ブルーノも普通に蹴ってるからなんとも言えないですよね}
      - {voice: ネット民, text: 「見える見えない」とか限度で分け始めたら基準ガバガバな気がするし、行為として蹴ってる以上、そこは同列で見るべきやと思います}
      - {voice: ネット民, text: ブルーノがフォーデンを蹴ったのが発端になったフォーデンの退場で、ブルーノがカード貰ってなかったやつはどうなんだよ}
      - {voice: ネット民, text: フォーデン報復で退場してるの間抜けすぎる}
      - {voice: ネット民, text: ユナイテッド的にはフォーデンの退場が裏目に出た感じかな。引かれてスペース無くなって自分たちの得意な形が出なかった}
      - {voice: ネット民, text: ハーランド、ゴールも見事だったけど一番感動したのはこれ。蹴りで一発退場したフォーデンにブチギレていたシーン}
    official: false
