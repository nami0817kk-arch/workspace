  - id: two
    heading: 監督が名前を挙げた、22歳と23歳
    tier: 報道
    main: true
    telop: 「10番が失われつつあると感じる」
    narrator: 解説
    say:
      - セスク・ファブレガス監督が、2人の若い選手について話しました。
      - {voice: ファブレガス監督, text: 10番というものが、失われつつあると感じている}
      - {voice: ファブレガス監督, text: そのやり方でプレーできる才能ある2人がいるのは、幸運だ}
      - {voice: ファブレガス監督, text: 22歳と23歳。サッカーで遠くまで行ける}
      - 22歳がニコ・パス。レアル・マドリードの下部組織で育ち、いまはコモの10番です。
      - 23歳がマルティン・バトゥリナ。この日クラブ初のCL得点を決め、マン・オブ・ザ・マッチにも選ばれました。
      - {voice: バトゥリナ, text: そう、彼は多くの自由をくれる}
      - {voice: バトゥリナ, text: たまに、少しポジションを離れすぎて嫌がられることもある}
      - {voice: バトゥリナ, text: でも自由をくれるから、良いサッカーができる}
      - {voice: バトゥリナ, text: 僕たちは大胆だ}
    official: false
    sources:
