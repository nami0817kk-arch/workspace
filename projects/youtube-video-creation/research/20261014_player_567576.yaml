- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: 祖父の道と、憧れの選手
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['1968年9月11日', 祖父が、クラブ初の欧州戦で輝いた]
    - ['2025年9月', 憧れの選手を、こう語った]
    source: 各報道
  say:
  - text: シティのエリオット・アンダーソン。数字の外に、2つの話があります。
    image: assets/images/20261014_anderson/commons/01_v.jpg
    short_only: true
    card: none
  - text: 1つ目は、祖父の話。母方の祖父は、かつてニューカッスルの左ウイングでした。
    image: assets/images/20261014_anderson/ncl_contract/01_r.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 0
  - text: 名前はジェフ・アレン。1964年、17歳でデビューしたと伝えられています。
    card: *story_card
  - text: 1968年9月11日、クラブ初のヨーロッパの試合。
    emph: true
    card: *story_card
  - text: 相手はフェイエノールト。クラブ初の欧州でのゴールを、お膳立てしたといいます。
    card: *story_card
  - text: ところが数週間後、フォレスト戦で大けが。23歳で、現役を退いたとされています。
    card: none
  - text: 孫のエリオットは、その背中を、こう語っています。
    card: *story_card
  - voice: アンダーソン
    text: 祖父の歩んだ道を、受け継いでいきたい。
  - voice: アンダーソン
    text: 祖父は早くにケガで終わってしまった。
    cont: true
  - voice: アンダーソン
    text: だから、その分、力が湧くんです。
    cont: true
    pause: 0.6
  - text: 2つ目は、憧れの選手の話。名前は、ケヴィン・デ・ブライネ。
    image: assets/images/20261014_anderson/bbc/01_nologo_r.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 2025年9月、本人は憧れを、こう語りました。
    card:
      <<: *story_card
      highlight_row: 1
  - voice: アンダーソン
    text: この4、5年、プレミアで一番好きな選手でした。
  - voice: アンダーソン
    text: いつも見ていた。パスを出す目に、引きつけられた。
    cont: true
  - voice: アンダーソン
    text: 僕が真似しようとしていた選手です。
    cont: true
    pause: 0.6
  - text: その年の開幕戦では、クリス・ウッドの2点目を、鋭いパスで演出しています。
    card: none
  - text: そして2026年7月。シティ入りの日のインタビューで、こう続けました。
    image: assets/images/20261014_anderson/city_bts9/01_r.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - voice: アンダーソン
    text: いつも彼を見ていた。
  - voice: アンダーソン
    text: 彼のいたチームに、いま座っているのは、
    cont: true
  - voice: アンダーソン
    text: 特別なことです。
    cont: true
    pause: 0.6
  - text: 憧れた「パスを出す目」を、同じチームで磨く。その先を、数字で見ます。
    pause: 0.5
    card: none
