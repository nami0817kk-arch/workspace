# エリオット・アンダーソン（マンチェスター・シティ）の紹介。8節の型（2026-09-28）を、アルバレス（research/20261012_player_576024.yaml）の形にそろえた。
# 雛形は tools/player_intro.py 567576。材料は research/raw/20261014_anderson_material.md（出典URL・原文・自訳つき）。
# 数字は FotMob（1089691）・Transfermarkt API（567576）・英語版Wikipedia・シティ公式・BBC（Opta の集計）・ESPN の試合記録。
#
# **鍵の付け方**：Transfermarkt の番号（567576）。FotMob の番号（1089691）は板のファイル名に入っている。
#
# **雛形から直したこと・数字の食い違い（材料 §0）**
# - **雛形の「18歳の市場価値は1500万ユーロ」は誤り。**1500万は「ニューカッスル在籍中の最高額」（2024-05-27）で、18歳（2021-03-17）は **20万ユーロ**。
#   読み上げは20万に直した。20万→1.2億は600倍（自分で計算）。表の「最高 1500万」は在籍期間の最高額なので、そのまま。
# - **棒グラフはレーダーの数字（FotMob traits）にそろえた。**雛形の武器・弱点（パス成功100・ボールタッチ100・ライン96・得点0）は今季6試合の percentileRank で、
#   画面に出るレーダー（ボールタッチ97・空中戦91・守備84・チャンス創出68・シュート67・得点45）と数字が違う。画面で食い違わないよう、読み上げ・棒グラフ・レーダーを97/91/84/68/45に統一。
#   今季6試合の絶対値（ボールタッチ641・パス成功470・ラインを破るパス126）は季の節と見立ての節で「数」として読む（パーセンタイルは言わない）。
# - **過去5季の表は、雛形（Transfermarkt「代表を含む全公式戦」）から、クラブだけの数字（FotMob・シティ公式・英語版Wikipedia で一致）に差し替えた。**
#   雛形の 21/22（30試合12得点・2471分）はブリストル・ローヴァーズの21試合7得点と合わず（若い世代の試合が混ざる）、裏が取れなかった。
#   シティ公式の「クラブ174試合」は同じ記事の季ごとの表（168）と合わない。FotMob・Wikipedia（55/21/92）に合わせて168＋シティ8＝176、代表21を足して197試合13得点。
# - ブリストル・ローヴァーズの得点：BBC は途中の文で8、FotMob・シティ公式・Wikipedia は7。7を使った（BBC の8は未確認）。
# - 「3アシスト＋1ゴール」（2022-05-07）：BBC の最終節の記事（原文 hat-trick of assists・head in）。ESPN の試合記録は 2022-05-07 の League Two が引けず、BBC だけ。
# - 移籍金：シティ公式は金額を出していない。サッカーキング（ジ・アスレティック）・Sky が1億1600万ポンド。「報道で」と言う。Sky は発表時点で「英国人選手の史上最高額」。
#   のちに他の選手が抜いた（Sky・Wikipedia）が、翌日の回の主役なので触れていない。
# - **昨季3300回（Opta）と今季641回（FotMob）を出場1試合あたりで並べた（約87回→約107回。10/14 夜、90分あたり114回の言い方はやめて出場1試合あたりにそろえた。昨季の出場分数が取れず90分あたりに直せない）。**どちらも Opta 系だが、タッチの数え方が同じかは未確認。6試合の標本なので「まだ6試合ですが」と断っている。
# - 10/11 リバプール戦（ESPN の試合記録）：0対3でシティの勝ち。68分のドクのゴールをアンダーソンがアシスト（FotMob の1アシストと一致）。
# - 代表の対戦国名：Czechia は「チェコ」。クラブ名はリポジトリの正（clubs.yaml）に合わせて「リバプール」。
#
# **材料から入れなかったもの**
# - 家族の暮らし・兄の話（私生活）。祖父は「選手としての経歴」だけ（クラブ公式・地元紙が書いている）。母・父の名前は出していない。
# - 代表を選んだ経緯（スコットランドかイングランドか）。ジョーイ・バートンのマラドーナ評（19歳への比較で、今の形と合わない）。シティ公式の評（トゥヘル監督の1つに絞った）。
# - ニューカッスルの PSR の事情・クラブ側の話。ワールドカップ決勝トーナメントの細部。
#
# **日本語名・読みで怪しいもの（確認してほしい）**
# - ジェフ・アレン（Geoff Allen）：日本語の記事が見つからず、読みは未確認。「ゲオフ」ではなく「ジェフ」にした。
# - ケヴィン・デ・ブライネ（日本語版Wikipedia のページ名。「デ・ブルイネ」ではない）。トゥヘル・ジェレミー・ドク・クリス・ウッドはリポジトリ内の台本の表記。
# - ウィットリー・ベイ（日本語版Wikipedia は「ウィットリーベイ」、点を入れる表記にした）。ウォールセンド・ボーイズクラブ（日本語の記事が少なく、表記は未確認）。
# - フェイエノールト・スカンソープ・ブリストル・ローヴァーズ・オプタ（Opta の読み）。**オプタ**は draft の「媒体名」の検査に当たるかもしれない。
#
# **写真は 10/14 に取得済み（assets/images/20261014_anderson/。出典は各フォルダの credits.json）。**以下は取得前のメモ：thumbnail.photos は空のまま。thumbnail.photo も空。時期は 2019年前後のニューカッスル／2024-26年のフォレスト／2026年のイングランド代表（Commons の
#   「Elliot Anderson England v Ghana 23 June 2026」が候補。ライセンスは未確認）／シティ。**スタジアムの写真は使わない。**
#
# **本人の言葉は4か所**（自訳。原文は材料 §5）：①フック「スタンドのいちばん上から見ていた」（2019、地元紙）／②祖父「受け継ぎたい」（NUFC 公式 2020）／
#   ③憧れ「この4、5年いちばん好きな選手」（ガーディアン 2025-09-04）／④シティ入りの日（シティ公式 2026-07-23）。
