    image: assets/stats/player_20261014_1089691_heat.png
    no_telop: true
  - text: 昨季は411キロを走りました。これはプレミアで2番目に長い距離です。
    image: assets/images/20261014_anderson/sk_eng/01_w.jpg
    card: none
