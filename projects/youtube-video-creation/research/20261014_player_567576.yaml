  - text: ここからはアンダーソンの形。同じMFと比べた図です。
    image: assets/stats/player_20261014_1089691_radar.png
    no_telop: true
  - text: もっとも外へ張り出すのは、ボールタッチ。同じMFの中で、上位3%ほどに入る位置です。
    image: assets/stats/player_20261014_1089691_radar.png
    no_telop: true
  - text: 続くのが、空中戦で上位9%ほど、守備の関与で上位16%ほどの位置。
    image: assets/stats/player_20261014_1089691_radar.png
    no_telop: true
  - text: 触って、奪って、前へ運ぶ。中盤の底で、攻めと守りをつなぐ選手です。
