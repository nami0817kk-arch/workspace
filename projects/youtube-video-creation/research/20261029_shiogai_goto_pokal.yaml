#   ・サッカーキング（https://www.soccer-king.jp/news/world/ger/20261029/2222452.html 全文）: 塩貝は今季公式戦10試合目で初ゴール。
#   ・フットボールチャンネル（https://www.footballchannel.jp/2026/10/29/post1042098/ と post1042152。全文）: ドイツメディア『Get German Football News』
#       （報道。確度は報道止まり）は後藤に両チーム単独最高の9点・MOM、「赤髪の魔術師」。「23分間。8回のボールタッチ。2ゴール」。後藤はシュート3本で2得点、xG 0.53、デュエル3回中2勝、空中戦2戦2勝。
