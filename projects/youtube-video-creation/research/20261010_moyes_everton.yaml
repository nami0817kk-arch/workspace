# 取材メモ（10/10 題材 moyes_everton、型は news、その他枠）。材料の控えは research/raw/20261010_moyes_everton_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場の節を切り出す）。
# **「今朝はじめて知った」が何についてなのかを、本文まで当てて特定した**（材料 0）。
#   → **オーナーのザ・フリードキン・グループが、支配権の売却を含む投資の選択肢を探ると発表したこと**。
#   監督の去就でも、補強でも、選手の件でもない。①でそこを先に置いてから②の言葉に入る。
# **一次情報はエヴァートンの公式の声明**（クラブ名義）。公式サイトそのものは JavaScript で読めず（材料 7）、
#   同じ文面を2つの媒体が同一に引用しているのを突き合わせて確認した。だから確度は**報道**に置いた。
# モイーズの言葉は、**Sky Sports が引いた形**を採った（材料 6-2。同じ会見でも通信社と文言が違うので、
#   より会見の生に近いほうに1つ決める）。**2つの形を混ぜていない。**
# **言っていないことは言わない**（材料 5）：去就の話、買い手の名前、ローマの売却、モシリが受け取った額。
#   8億〜10億ポンドは **アナリストの見立て**で、オーナーが出した数字ではない。④でそう言う。
# 数字の食い違い（材料 6）：モイーズは「1年半」と言い、買収完了の2024年12月から数えると**約1年10か月**。
#   **本人の言葉はそのまま引き、こちらで数えた月数は別の行に置いた**（③）。
# **政治の話は使わない**（材料 3-4）。
# 数字の重なり対策：『4億ポンド』『8億』『10億』『2.5倍』は③だけ。『22か月』『20年』も③だけ。
#   『勝ち点9』『3失点』『1.8』は④だけ。
# 写真は記事の横長を先に当たった。02＝Sky Sports の記事の og:image（1600x900、エヴァートンの監督としての横顔）。
#   facecrop で 02_w（16:9）と 02_v（9:16、--center 0.53 で手で決めた）。
#   01（Commons、CC BY-SA 4.0 / Egghead06、2021年のウェストハム時代）は**所属が違うので使わない**。入れ替えは無し。
# サムネ：構図 face（顔が大きく写った横長）。
# ネットの反応は集めていない（材料の方針）。
