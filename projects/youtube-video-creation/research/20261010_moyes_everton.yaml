  title: エヴァートンが売りに出た。モイーズがそれを知ったのはいつだったか
  question: モイーズが「今朝はじめて知った」と言ったのは、何についてだったのか
  takeaway: 10月9日、エヴァートンのオーナーであるザ・フリードキン・グループが、新しい投資の選択肢を探ると発表し、その中に「支配権の売却」も含まれると明言した。クラブ名義の声明で、売却の助言役には投資銀行のモエリス・アンド・カンパニーが就いている。監督のデビッド・モイーズはその日の試合前会見で「私も今朝はじめて知った。ほかのみんなと一緒に」と話した。知らされなかったことに腹は立てておらず、気の毒に思うのはファンのほうだと言っている。この一族がクラブを買ったのは2024年12月で、額は4億ポンド超と伝えられた。いま言われている売却の規模は8億から10億ポンドだが、これはアナリストの見立てでオーナーが出した数字ではない。モイーズ自身は「彼らが来たのはたった1年半前」「20年から30年ここにいると思っていた」と言っており、買収完了から数えると約22か月。ピッチの上ではエヴァートンは5試合を終えて2勝3分の無敗で、失点3は上位8クラブでいちばん少ない
  opening_image: assets/images/20261010_moyes_everton/03.jpg
