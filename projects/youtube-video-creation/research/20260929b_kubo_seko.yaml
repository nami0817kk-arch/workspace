- id: words
  main: true
  heading: 久保建英の言葉
  tier: 報道
  telop: 「今の瀬古選手にケチつける人はサッカー分かってないんじゃないかと思いますよ」
  narrator: キャスター
  say:
  - text: 先発10人を入れ替えた夜に、ただ一人残った瀬古歩夢。仲間の久保建英が、その瀬古について。
    short_only: true
  - text: 瀬古本人は口を開かずに引き上げ、代わりに久保が語りました。
    image: assets/images/20260929b_pair_kubo_seko/01.jpg
  - voice: 久保建英
    text: なんでしょうね。今の瀬古選手にケチつける人は
  - voice: 久保建英
    text: サッカー分かってないんじゃないかと思いますよ。
    cont: true
  - voice: 久保建英
    text: マジで、マジでいいと思います
    cont: true
  - 仲の良さは置いておいて、と前置きしてから続けました。
  - voice: 久保建英
    text: 今日はもうベテランのような風格
  - voice: 久保建英
    text: ボランチやっていたのもあって、
  - voice: 久保建英
    text: もともと上手い選手でしたけど、
    cont: true
  - voice: 久保建英
    text: 上手さ、強さ、すごくいい選手だと思います。
    cont: true
  - voice: 久保建英
    text: 過小評価なんじゃないですかね。
    cont: true
  - voice: 久保建英
    text: そういうのもわかってくると
    cont: true
  - voice: 久保建英
    text: サッカーが楽しくなるんじゃないかなと思います
    cont: true
  - ボランチは中盤の底で守りと配球を担う位置。瀬古が昨季まで多く出ていた場所です。
  - なぜここまで伸びたのか。その問いには。
  - voice: 久保建英
    text: やっぱり信頼じゃないですかね。
  - voice: 久保建英
    text: いろいろと試合に出られるようになって
    cont: true
  - voice: 久保建英
    text: 使ってもらえるということで
    cont: true
  - voice: 久保建英
    text: メンタル面で大きく左右される選手でもあるので、
    cont: true
  - voice: 久保建英
    text: メンタルの落ち着きがすごい成長したんじゃないかなと思います
    cont: true
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?459925-459925-fl
  - https://www.footballchannel.jp/2026/09/29/post1021785/
- id: view
  heading: 見立て
  tier: 背景
  viewpoint: true
  telop: 久保の言う「信頼」は、先発に残った一人という形で先に出ていた
  narrator: 解説
  say:
  - text: 今回の代表は、守備の人が次々に減っています。
    image: assets/images/20260929b_pair_kubo_seko/01.jpg
  - 冨安健洋は招集を辞退、安藤智哉と板倉滉が負傷。
  - ベネズエラ戦でも渡辺剛と鈴木淳之介が途中で痛めました。
  - その中で先発を続け、守備の線を高く保つハイラインを90分こなしたのが瀬古です。
  - フランス1部のル・アーヴルは、開幕から勝ちがありません。
  - それでも瀬古はリーグ戦5試合すべてに先発してフル出場。
  - ル・アーヴルの監督は9月の会見で、瀬古はもっと上のクラブでやるべき選手だと話しました。
  - 久保が「信頼」と言った中身は、クラブでも代表でも、監督の起用に先に表れています。
  - 答え合わせは3日後、エクアドル戦の先発の顔ぶれで。3試合続けて残れば、その信頼の重さが分かります。
  sources:
  - https://www.footballchannel.jp/2026/09/29/post1021809/
  - https://web.gekisaka.jp/news/japan/detail/?459859-459859-fl
