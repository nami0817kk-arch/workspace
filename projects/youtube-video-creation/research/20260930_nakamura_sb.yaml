      rows: *sbrows
      highlight_row: 2
  - text: そこで後ろの守りを4人に、中盤も4人、前は1人に組み直します。
    card:
      type: table
      title: 10人になってからの並び（後半41分〜）
      columns: [名前, 所属, もとの位置, この場面]
      rows: *sbrows
  - text: その両端、サイドバックに回ったのが、中村とゲンクの伊東純也です。
