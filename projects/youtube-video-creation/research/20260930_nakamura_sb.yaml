# 取材メモ（9/30 の題材 2）。ゲキサカの一夜明けの囲み取材（9/29）が起点。
# 同じ取材の言葉は日刊スポーツ・サッカーキングでも当たった（言い回しが少しずつ違う。1つの行は1つの記事から引く）。
# 10人になってからの並びはスポーツ報知の「超スクランブル布陣」（GK鈴木彩艶／DF伊東・鈴木淳・伊藤・中村／MF田中碧・堂安・久保・谷村／FW上田）。
#   71分からの3バックは左から伊藤・渡辺・鈴木淳（ゲキサカの試合記事）。伊東の10人になる直前の位置は記事で確かめられないので「攻撃の位置」とだけ書く。
# 9/29 の「VARの逆転PK」「伊東が主審に言い続けた夜」と重ねない：10人になった経緯は2行、PKは1行、判定の中身は書かない。
# 見立て（2026-09-30 ユーザー指示「経験したことのあるポジションについて」）の位置の数は、Transfermarkt の試合記録（performance-game の positionId、
#   位置が記録された試合だけ。途中出場で位置の無い試合は数えない）を所属ごとに数えた。leistungsdatenpositionen のページは 404 で読めなかった。
#   ガンバ（U-23 を含む）左中盤17・CF7・右ウイング7／トゥウェンテ 左ウイング17／シント・トロイデン 左中盤2（表に入れない）／
#   LASK 左ウイング54・CF6／ランス 左ウイング70・CF12・トップ下2・左SB1（2026-03-03 のカップ戦。本人は「初めて」と言うので読み上げない）／
#   リヨン 左ウイング1／代表 左ウイング10（2023〜24年1月の8＋2026年W杯の2）・左中盤＝ウイングバック17（2024年6月〜）・トップ下（シャドー）3。
#   代表の「左ウイング8」は 2024年1月までの数（W杯の2試合は表に入れていない）。
#   代表の通算（試合数・得点）は Transfermarkt（31試合11得点）と Wikipedia（30試合12得点、9/24 まで）で食い違うので使わない。
