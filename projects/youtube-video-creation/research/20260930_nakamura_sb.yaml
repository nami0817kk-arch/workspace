- id: words
  main: true
  heading: 声を掛けてくれた人
  tier: 報道
  telop: 中村「伊藤洋輝選手がセンターバックで積極的に声を掛けてくれた」
  narrator: キャスター
  say:
  - text: ベネズエラ戦の終盤、交代を使い切ったあとのけがで10人に。中村敬斗は守りの端へ回りました。
    short_only: true
  - text: 試合の翌日、中村はこう振り返っています。
    image: assets/images/20260930_nakamura_sb/01_w.jpg
  - voice: 中村敬斗
    text: 実際に試合でサイドバックをやったのは初めてだった
  - 慣れない位置で支えになったのは、守りの真ん中のセンターバックでした。
  - voice: 中村敬斗
    text: 伊藤洋輝選手がセンターバックで
  - voice: 中村敬斗
    text: 積極的に声を掛けてくれたので、
    cont: true
  - voice: 中村敬斗
    text: 僕としては安心してやれてました
    cont: true
  - サイドで攻守に出るウイングバックでも、いつかこの役が来る。中村はそう見ていました。
  - voice: 中村敬斗
    text: ウイングバックをやっていても一人退場した場合は
  - voice: 中村敬斗
    text: 試合中にやる可能性があるので
    cont: true
  - voice: 中村敬斗
    text: 想定としては良かったんじゃないかなと思う
    cont: true
  - 日本はそのまま、終了間際のPKで勝ち越しました。
  - voice: 中村敬斗
    text: 日本代表は久保選手だったり、他にもいい選手がいるけど、
  - voice: 中村敬斗
    text: 人数が少ない中でも一人、二人剥がせる選手がたくさんいるので、
    cont: true
  - voice: 中村敬斗
    text: 一人足りない中でも点を取る力、勝ち切る力があると思う
    cont: true
