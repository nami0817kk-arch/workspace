  say:
  - text: 9月28日のベネズエラ戦。中村敬斗は後半26分、左のウイングバックで入りました。
    image: assets/images/20260930_nakamura_sb/01_w.jpg
  - 同点の終盤、3人で組む守りの真ん中から、渡辺剛が足を痛めて退きます。
  - 交代できる機会は3回までで、日本はそれを使い切っていました。
  - text: 3人の守りで残ったのは、伊藤洋輝と鈴木淳之介の2人。
