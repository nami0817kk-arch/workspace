# 取材メモ（9/30 の題材 2）。ゲキサカの一夜明けの囲み取材（9/29）が起点。
# 同じ取材の言葉は日刊スポーツ・サッカーキングでも当たった（言い回しが少しずつ違う。1つの行は1つの記事から引く）。
# 10人になってからの並びはスポーツ報知の「超スクランブル布陣」（GK鈴木彩艶／DF伊東・鈴木淳・伊藤・中村／MF田中碧・堂安・久保・谷村／FW上田）。
#   71分からの3バックは左から伊藤・渡辺・鈴木淳（ゲキサカの試合記事）。伊東の10人になる直前の位置は記事で確かめられないので「攻撃の位置」とだけ書く。
# 9/29 の「VARの逆転PK」「伊東が主審に言い続けた夜」と重ねない：10人になった経緯は2行、PKは1行、判定の中身は書かない。
# クラブの数字は Transfermarkt の試合記録（performance-game）と英語版 Wikipedia の Career statistics で一致を確かめた。
#   24-25 ランス 1部 32試合11得点／25-26 ランス 2部 29試合14得点／26-27 リヨン リーグ戦2試合26分0得点・EL 1試合90分1得点（9/16）。
#   代表の通算（試合数・得点）は Transfermarkt（31試合11得点）と Wikipedia（30試合12得点、9/24 まで）で食い違うので使わない。
