sections:
- id: gamble
  main: true
  heading: プレミアの胸の賭けの広告は、どのクラブから始まったのか
  bg: assets/images/20261105_kit_fulham/f03_match_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2002年から2003年のフラムの胸にベットフェア。今季、プレミアの胸から賭けの会社が消えた
  card: *gamble
  say:
  - text: 今回は、フラムの、白いシャツと、胸の紋章、そして胸の広告です。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  - text: 今季のプレミア。選手の胸に、賭けの会社の名前はありません。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
    emph: true
  - text: クラブどうしで決めた、自分たちの決まりです。合意は、2023年4月。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card:
      <<: *gamble
      highlight_row: 4
  - text: そのころは、フラムの胸も、賭けの会社。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: 今季は、アメリカのIT企業、クリックハウスに替わっています。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: プレミアが始まった1992年、胸が賭けの会社のクラブは、ゼロでした。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card:
      <<: *gamble
      highlight_row: 0
  - text: では、胸に賭けの広告を初めて入れたクラブは、どこだったのか。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: 2002年から2003年にかけてのシーズン。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: フラムの胸に入ったのは、ベットフェア。賭けの会社です。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card:
      <<: *gamble
      highlight_row: 1
    emph: true
    callword: 始まりはフラム
  - text: これが、イングランドのサッカーで初めての、賭けの会社の胸の広告とされています。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: *first
  - text: その季、フラムには、稲本潤一がいました。
    image: assets/images/20261105_kit_fulham/i01_inamoto_w.jpg
    card: none
  - text: 2002年の7月に、ガンバ大阪から加わっています。
    image: assets/images/20261105_kit_fulham/i01_inamoto_w.jpg
    card: none
  - text: 稲本の後ろに並ぶ、黒いシャツの胸には、ダブス・ドットコム。
    image: assets/images/20261105_kit_fulham/i01_inamoto_w.jpg
    card: none
  - text: フラムで、ベットフェアの次に胸に入った会社です。
    image: assets/images/20261105_kit_fulham/i01_inamoto_w.jpg
    card: none
  - text: 当時、テレビやラジオで、賭けの広告は、まだ流せませんでした。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  - text: 流せるようになったのは、2005年の法律からです。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card:
      <<: *gamble
      highlight_row: 2
  - text: そこから、プレミアのシャツに、賭けの名前が増えていきます。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  - text: 2016年から17年のシーズンには、半分のクラブの胸が、賭けの会社でした。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card:
      <<: *gamble
      highlight_row: 3
  - text: 2025年4月の時点でも、20クラブのうち、11クラブです。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card: none
  - text: そして今季、胸からは、いなくなりました。袖や練習着には、まだ残せます。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *gamble
      highlight_row: 5
  sources:
  - https://en.wikipedia.org/wiki/Fulham_F.C.
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_Premier_League
  - https://www.bbc.co.uk/news/business-45440347
  - https://www.bbc.co.uk/sport/football/articles/cge1lp0734jo
  - https://www.theguardian.com/football/2023/apr/13/premier-league-clubs-ban-gambling-sponsors-on-front-of-shirts-from-2026-27
  - https://clickhouse.com/blog/clickhouse-announced-principal-partner-sponsor-fulham-fc
  - https://en.wikipedia.org/wiki/Junichi_Inamoto
- id: colors
  heading: 白いシャツに黒いパンツは、いつからなのか
  bg: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
  tier: 背景
  narrator: 解説
  telop: 青い2色、黒と白の縦じま、赤と白。白いシャツと黒いパンツは1903年から
  card: *colors
  say:
  - text: フラムのシャツは、白。パンツは、黒です。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  - text: ただ、最初から白だったわけではありません。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
    emph: true
  - text: 記録に残るいちばん古い色は、明るい青と、濃い青。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card: none
  - text: 1883年の試合では、2色に分かれたシャツでした。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card:
      <<: *colors
      highlight_row: 0
  - text: 1888年12月、いまの名前になり、次の季は、黒と白の縦じまです。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card:
      <<: *colors
      highlight_row: 1
  - text: 1896年、いまの本拠地で、初めての試合。そのころの色は、赤と白です。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card:
      <<: *colors
      highlight_row: 2
  - text: 白いシャツと黒いパンツになったのは、1903年。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *colors
      highlight_row: 3
    emph: true
    callword: 1903年から白
  - text: イングランド南部のリーグで、上の部に上がった年でした。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *colors
      highlight_row: 3
  - text: そのころは、横じまのソックスも、ほかに無いほど珍しかったといいます。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card: none
  - text: それから123年。シャツの白と、パンツの黒は、ずっと変わっていません。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
    emph: true
  sources:
  - https://www.historicalkits.co.uk/Fulham/Fulham.htm
  - https://en.wikipedia.org/wiki/Fulham_F.C.
- id: crest
  heading: 胸の紋章は、何を描いてきたのか
  bg: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
  tier: 背景
  narrator: 解説
  telop: 本拠地の小屋、フラム区の紋章、頭文字の印、ハマースミス・アンド・フラム区の紋章、そして2001年の新しい紋章
  card: *crest
  say:
  - text: 胸の紋章は、白いシャツと違って、何度も替わっています。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card: none
  - text: シャツに初めて紋章が付いたのは、1931年。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 描かれていたのは、本拠地の小屋、クレイヴン・コテージでした。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card: none
  - text: この紋章は、1939年、戦争が始まるまで付いていました。
    image: assets/images/20261105_kit_fulham/s02_haynes_w.jpg
    card: none
  - text: 戦争のあとは、昔のフラム区の紋章。はじめは、とても大きな紋章でした。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 1951年からは、白と黒の、小さな形になります。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: この形は、1973年まで、20年あまり続きました。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
  - text: そのあとは、古く見えるとして、頭文字を組み合わせた、珍しい書体の印に替わります。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: 1977年には、ハマースミス・アンド・フラム区の紋章を、簡単にした形へ。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *crest
      highlight_row: 3
  - text: ところが、1季で丸いバッジに替わり、1984年に、また戻ってきます。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card: none
    emph: true
  - text: そして2001年。初めてプレミアに上がった季です。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  - text: 伝統から離れた、新しい紋章が生まれました。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: いまの胸にあるのも、その紋章です。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card: none
  sources:
  - https://www.historicalkits.co.uk/Fulham/Fulham.htm
  - https://en.wikipedia.org/wiki/Fulham_F.C.
- id: chest
  heading: 胸には、どんな会社が入ってきたのか
  bg: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1984年のビール会社から、航空会社、労働組合、ピザ、賭けの会社、そして今季のIT企業
  card: *chest
  say:
  - text: 胸の広告にも、話があります。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card: none
  - text: フラムの胸に、初めて会社の名前が入ったのは、1984年。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *chest
      highlight_row: 0
  - text: ビール会社の、ウィリアム・ヤンガーでした。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card: none
  - text: 1988年には、航空会社のエミレーツ。のちに、アーセナルの胸に入る会社です。
    image: assets/images/20261105_kit_fulham/s01_riverside_w.jpg
    card:
      <<: *chest
      highlight_row: 1
  - text: 1993年からは、労働組合のジーエムビーが、胸に入りました。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card:
      <<: *chest
      highlight_row: 2
    emph: true
  - text: 2001年は、ピザハット。その次の季が、ベットフェアです。
    image: assets/images/20261105_kit_fulham/s03_pitch_w.jpg
    card: none
  - text: そして今季は、IT企業の、クリックハウス。
    image: assets/images/20261105_kit_fulham/f03_match_w.jpg
    card:
      <<: *chest
      highlight_row: 5
