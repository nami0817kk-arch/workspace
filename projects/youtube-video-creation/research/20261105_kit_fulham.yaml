# ユニフォームとエンブレムの歴史 フラム（11/4 作成、11/5 分）。雛形は 11/1 コヴェントリー回。
# 題の問い：プレミアの胸から賭けの会社が消えた今季。24年前、最初に胸に入れたのはどこか（答え＝フラム。2002年から03年のベットフェア）。
# 選んだ理由：プレミア⑪→⑳→①→⑩の並びで残っているのは ⑩ フラムだけ（scripts/*kit_* に 20 クラブ中 19 クラブ＋Hull・Ipswich・Coventry 済み）。
#   2026-27 のプレミアの20クラブ＝スタジアム回の20本と同じ（ウェストハムは2部。ハル・イプスウィッチ・コヴェントリーが入る）。名前の大きいクラブは全部出し済み。
#   フラムは「白いシャツが変わらない」ので色の話は薄い→今季の「胸の賭けの広告の禁止」と、フラムが最初だった話を主にした。
# 重なり確認（2026-11-04）：scripts/*kit_*・research/covered.yaml・research/posted.json を grep。フラムのユニフォーム回は無し。
#   20260920_pl10_fulham（クラブ紹介・45日前）、20261024_stadium_fulham（スタジアム・11日前）、20261024_inamoto_legend は別シリーズ。
#   スタジアム回で言った「稲本のインタートトの4点」「ロフタス・ロードを借りた」「収容」はこの回では言わない。稲本は「ベットフェアの季にいた」の1行だけ。
# 今季のリーグ：ウィキペディア en "Fulham F.C."（current = 2026–27 Fulham F.C. season、top tier）と "2026–27 Premier League"（参加クラブに Fulham）、ClickHouse の発表（2026/27 Premier League campaign）。
# 取材：requests だけ。ブラウザ操作・JS実行・検索のAI要約は使っていない。
#   読んだ：ウィキペディア en "Fulham F.C."（History・Kit の節とスポンサーの表）、"2026–27 Premier League"（胸の賭けの広告の禁止）、"Junichi Inamoto"、
#     Historical Football Kitsの Fulham（色と紋章の年表）、ClickHouse の発表（2026-07-21）、
#     BBC News 2018-09-22「Premier League shirts row」、BBC Sport 2025-04-18「Premier League shirt sponsors」、Guardian 2023-04-13 の禁止の記事。
# ---- 食い違い・断ったこと ----
#   ・白いシャツの年：ウィキペディアの Kit の節は「1896年から」、同じ記事の History の節と HFK は「1896年は赤と白、白と黒は1903年から」→ 1903年を使う。
#   ・最初の色：HFK「明るい青と濃い青、1883年の記事では2色に分かれたシャツ」、ウィキペディア「1886–87に赤と白の半分ずつ」→ HFK の青を言い、赤と白は1896年の分だけ言う。
#   ・「初めての賭けの会社の胸の広告」：ウィキペディアの文（出典 SBC News 2018・BBC 2018）。BBC 2018 は「2005年の法律より前にも、2002–03 のフラムのベットフェアがあった」とだけ書く
#     →台本は「ウィキペディアは〜と書いています」と、言っている者を付けて言う。
#   ・いまの紋章の年：HFK「最初のプレミアの季（2001年）に新しい紋章」、ウィキペディアの画像の説明は「2000年から」→「2001年、初めてプレミアに上がった季」。
#   ・紋章の年表は HFK 1本だけ（クラブ公式の紋章の頁は読んでいない）。
#   ・今季の胸：ウィキペディアのスポンサーの表の 2026–27 と ClickHouse の発表（7月21日、男子トップチームの胸、複数年）。
#   ・袖などには賭けの会社を残せる：ウィキペディア "2026–27 Premier League"（Guardian・BBC を出典）。
# ---- 自分で数えた数（ウィキペディアのスポンサーの表）----
#   胸の会社：1984–85 William Younger／Prestige Travel／Emirates（1988）／TeleConnect／GMB／Demon Internet／Pizza Hut／Betfair／dabs.com／Pipex／LG／FxPro／
#     Marathonbet／Visit Florida／Grosvenor Casinos／Dafabet／BetVictor／World Mobile／W88／SBOBET／ClickHouse ＝ 21社。1984–85〜2026–27 ＝ 43シーズン。43÷21≈2.0。
#   賭けの会社だった季（2002–03〜2025–26 の24季）：Betfair 1・Marathonbet 2（2013–15）・Grosvenor 1・Dafabet 2・BetVictor 1・W88 1・SBOBET 3 ＝ 11季。11÷24＝45.8%→約46％。
#   白：2026−1903＝123年。ベットフェアから：2026−2002＝24年。紋章 1951→1973＝22年。禁止を決めてから：2023年4月→2026年夏＝約3年。
# ---- 日本との接点 ----
#   稲本潤一が 2002年7月にガンバ大阪から加入（ウィキペディア、クラブ発表 2002-07-15）＝ベットフェアの季。写真の後ろに dabs.com の黒いシャツ（プーマ。表の 2003–05 と一致）。
# ---- 写真（assets/images/20261105_kit_fulham/、出典は credits.json）----
#   Commons の CC0（2024年9月のフラムの選手たち）、スタジアム回の Commons の写真3枚、稲本レジェンド回の記事写真1枚。代理店・放送映像・エンブレム画像は使っていない。
