# 取材メモ（10/14 水、シリーズ「比べる」、key: compare_973085_918969、型は news）。2026-10-14 に組み直した（ネヴェス×カマラは research/dropped_1014/ に退避）。
# 材料の控えは research/raw/20261014_compare_973085_918969.md。
#
# **組み直しの理由**：最初の組み（ネヴェス×カマラ）はネヴェスが 10/8 の選手紹介・10/10 のPSG財政・10/12 のモナコ回で既に出ていた。
#   カマラ（モナコ、22歳）を軸に、**誕生日が2日違い（2004-01-01 と 2004-01-03）**のカルロス・バレバ（マンチェスター・ユナイテッド、22歳）に替えた。
#   候補：①バレバ（誕生日2日違い・市場価値がカマラと同じ帯・守備的MFとセントラルMFで役割が違う）／②パブロ・バリオス（アトレティコ、23歳・同額5500万）
#   ／③ギュレル（レアル、21歳、9/12 に契約の回で出している）。①に決めた。
#
# **重なりの確認（直近30日、research/posted.json の題と research/covered.yaml、research/20261*.yaml を人名・クラブ名で引いた）**:
#   バレバ本人が主題の回は 0件（9/24 マンUの財政、10/10 マンUの1週間に名前が出る脇役のみ）。カマラ本人は 0件
#   （10/12 ドルトムント×モナコはクラブの回）。この2人の組み合わせは 0件。
#   型は 10/12 のドルトムント×モナコ（得点の時間帯）・10/9 ベリンガム×ムシアラ（同じ日数）と重ならないようにした：
#   こちらは「21歳までの出場時間（ほぼ同じ）と、その時間に残した数字（違う）」。板は table・line・calc。
#   同じ日（10/14）にマンUの財政（finance_manutd）が出る。**クラブ名の重なりであって人の重なりではない**が、ユーザーに伝える。
#
# **強い一点**：誕生日が2日違いの2人が21歳までに積んだトップチームの公式戦の出場時間は 6414分と6102分、差は312分（1.05倍、約3.5試合ぶん）。
#   ところがその時間の中身は違う。90分あたりの得点＋アシストは 0.08 と 0.27（3.2倍）。得点は 4 と 3 で近く、差はアシスト 2 と 15。
#
# **数字はすべて自分で数えた。**Transfermarkt の1試合ずつの記録（tmapi の performance-game）を足したもの。
#   年齢は各試合の日の年齢。**トップチームの公式戦だけ**（リール・ブライトン・マンU・メス・モナコの試合。代表戦・親善試合・Bチーム・育成リーグ・
#   リールB（FR5G）・メスB（FR4B/FR5I）・メスの育成リーグ（FRR1）は除く）。基準は 2026年10月14日の朝（最後の試合は バレバ 10/13 CLアトレティコ戦、カマラ 10/10 リーグ・アン）。
#   バレバ：18歳 61分／19歳 1282分／20歳 2141分／21歳 2930分＝6414分（119試合・先発77・途中出場42・4得点2アシスト）。22歳は18試合918分。
#   カマラ：19歳 1409分／20歳 2399分／21歳 2294分＝6102分（87試合・先発73・途中出場14・3得点15アシスト）。22歳は27試合2325分。
#   **アシストは TM の「公式アシスト（assistsOfficial）」で数えた**。TM の assists はバレバの19歳に2つ多く（リール時代の2つは公式扱いでない）、
#     FotMob の経歴（ブライトン通算2アシスト・リール0）と合うのは公式のほう。カマラは両方15で同じ。
#   自分で割った数: 6414÷6102＝1.051／6414−6102＝312／312÷90＝3.47試合／6414÷119＝53.9分／6102÷87＝70.1分／
#     先発率 19歳 16÷34＝47%と16÷21＝76%、21歳 37÷41＝90%と28÷33＝85%／累計 19歳末 1343と1409、20歳末 3484と3808、21歳末 6414と6102／
#     (4+2)×90÷6414＝0.084（0.08）／(3+15)×90÷6102＝0.265（0.27）／0.265÷0.084＝3.15（3.2倍）／
#     得点 4×90÷6414＝0.056（0.06）と 3×90÷6102＝0.044（0.04）／アシスト 2×90÷6414＝0.028（0.03）と 15×90÷6102＝0.221（0.22）／
#     市場価値 6000÷3000＝2.0／6500÷5500＝1.18／22歳の日数 1/3〜10/14＝284日・1/1〜10/14＝286日
#   プレーの数字は FotMob の昨季（25/26）リーグ（バレバ＝プレミア1662分、カマラ＝リーグ・アン1851分、90分あたり）。
#     **リーグも戦い方も違うので、2人の優劣の根拠にはしない**と台本で言う。パーセンタイルは数として読まない（台本に出していない）。
#     （FotMob の「守備アクション」はバレバだけ二重に数えている疑いがあるので使わない。下の控え）空中戦勝ち 1.57÷0.78＝2.01／チャンス創出 1.70÷0.49＝3.47／ラインを破るパス 9.09÷6.44＝1.41
# **食い違いの控え**:
#   ⓪FotMob の「守備アクション」：カマラ 117（＝タックル55＋インターセプト37＋ブロック7＋クリア18、5.69/90）は内訳と一致するが、バレバは 209（11.32/90）で
#      内訳の合計 104（37＋29＋6＋32、5.63/90）のほぼ2倍。**バレバの数字は二重計上の疑い**＝台本では使わず、自分で足した「守る動きの合計」5.6回と5.7回（ほぼ同じ）を使った。
#   ①バレバの市場価値：FotMob は €63.2m、TM は 6500万（10/7 更新）。TM に揃えた（カマラも TM の 5500万）。
#   ②身長：TM はバレバ 1.79m・カマラ 1.74m、FotMob は 179cm・173cm。TM に揃えた（マンUの選手ページに身長は無い）。
#   ③カマラの今季のアシスト：TM・FotMob は1、AS モナコ公式の選手ページは0。**台本の今季の節ではアシストを言わない**。
#   ④TM の出場分は、バレバ昨季のプレミア31試合1662分が FotMob・マンU公式（31試合）と一致。カマラの今季 8試合720分は AS モナコ公式と一致。
#   ⑤TM の「ケガ」は participationState が injured の試合数で、診断名は見ていない。バレバ22歳の8試合（3/14 と 8/20〜9/16）。
#      プレシーズンの負傷は FotMob の記事（カリック監督の発言）にある。クラブの医療発表は取れていない。
# **一次情報まで辿れたもの**：マンU公式の選手ページ（生年月日・契約・昨季31試合・タックル＋インターセプトの位置）／AS モナコ公式の選手ページ
#   （生年月日・今季8試合720分・経歴）／ESPN scoreboard（10/13 アトレティコ 2-0 マンU、次の日程）。
# **辿れなかったもの**：移籍金（クラブは公表していない。報道は6500万＋500万ポンドで割れる＝台本に入れない）。
#   バレバ・カマラ本人の言葉（マンU公式・AS モナコ公式の選手ページに引用なし。モナコの9/11会見は本文が取れていない）＝台本に入れない。
#   TM の「ケガ」の診断名／試合記録（Opta）での出場分の突き合わせ（FotMob の数字とは一致を確認）。
# 言い切っていないもの: どちらが上かは一度も言わない。「だけ」「最下位」で小さく見せていない。守備・アシストの数字は役割とリーグでも動くと添えた。
# 板：①stats ②table（基礎DATA）③table（年齢別）＋line（累計）＋table（出場の中身）④table（22歳になってから）⑤table×2（プレー）⑥table（市場価値）⑦table＋calc×2（見立て）。
#   **`card: none` は明示してある**。赤ペン（mark）は使っていない。
# 写真：thumbnail.photos に2枚（左バレバ、右カマラ）、opening_image は2人を並べた1枚（pairphoto で作る）。出典は credits.json。
# 声：1件も無い（シリーズの回。ブラウザの道具を使わない約束なので反応は集めていない）。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは案A（versus、伏せるのは「差が何分か」）。
