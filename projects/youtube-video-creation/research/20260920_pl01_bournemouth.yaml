    no_telop: true
  - image: assets/backgrounds/stadium_ボーンマス_in.png
    text: 本拠地はディーン・コート。**1万2357人**。マンチェスター・ユナイテッドの**6分の1**です。
  - image: assets/photos/pl/bournemouth_owner_cf0347c5.jpg
    text: オーナーはアメリカのビル・フォーリー。2022年に買収。**1億ポンド超**と報じられました。
  - image: assets/photos/pl/bournemouth_owner_07f09a4e.jpg
    text: 共同オーナーには、ハリウッド俳優の**マイケル・ビー・ジョーダン**もいます。
  - image: assets/stats/pl_bournemouth_cups.png
    text: 1部の優勝も、FAカップも、リーグカップもゼロ。20クラブで3つとも無いのは**5クラブ**です。
    no_telop: true
  - image: assets/stats/pl_bournemouth_last.png
    text: そのボーンマスが昨季、**6位**。クラブ史上最高の順位でした。
    no_telop: true
