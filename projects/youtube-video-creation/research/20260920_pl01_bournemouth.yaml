- id: data
  heading: ボーンマス 基礎DATA
  main: true
  tier: 背景
  telop: 1899年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_bournemouth_data0.png
    text: 創立は**1899年**。前身はボスコム・セント・ジョンズというクラブです。
    no_telop: true
  - image: assets/backgrounds/stadium_ボーンマス_in.png
    text: 本拠地はディーン・コート。収容は1万2357人と、プレミアでもかなり小さなスタジアムです。
  - image: assets/stats/pl_bournemouth_map.png
    text: ホームタウンは、イングランド南部ドーセット州の海沿いの町ボーンマス。
    no_telop: true
  - image: assets/photos/pl/bournemouth_owner_cf0347c5.jpg
    text: オーナーはアメリカのビル・フォーリー。2022年からクラブを持っています。
  - image: assets/stats/pl_bournemouth_data5.png
    text: 1部リーグの優勝もカップのタイトルも、まだありません。直近のタイトルは2014年から15年の2部優勝です。
    no_telop: true
  - image: assets/stats/pl_bournemouth_data7.png
    text: そのかわり、昨季はプレミアリーグで**6位**。クラブ史上最高の順位で、初めてヨーロッパへの切符をつかみました。
    no_telop: true
  - image: assets/stats/pl_bournemouth_data8.png
    text: 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
