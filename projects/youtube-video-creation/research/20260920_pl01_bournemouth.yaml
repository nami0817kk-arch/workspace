  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_bournemouth_data.png
    text: 創立は**1899年**。前身はボスコム・セント・ジョンズというクラブです。
  - image: assets/stats/pl_bournemouth_data.png
    text: 本拠地はディーン・コート。収容は1万2357人と、プレミアでもかなり小さなスタジアムです。
  - image: assets/stats/pl_bournemouth_data.png
    text: ホームタウンは、イングランド南部ドーセット州の海沿いの町ボーンマス。
  - image: assets/stats/pl_bournemouth_data.png
    text: オーナーはアメリカのビル・フォーリー。2022年からクラブを持っています。
  - image: assets/stats/pl_bournemouth_data.png
    text: 1部リーグの優勝もカップのタイトルも、まだありません。直近のタイトルは2014年から15年の2部優勝です。
  - image: assets/stats/pl_bournemouth_data.png
    text: そのかわり、昨季はプレミアリーグで**6位**。クラブ史上最高の順位で、初めてヨーロッパへの切符をつかみました。
  - image: assets/stats/pl_bournemouth_data.png
    text: 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
