  - voice: マルコ・ローゼ
    text: 「ボールに対して、とても積極的に。たくさん走りたい」
  - 欧州の初戦は、久保建英が所属するクラブに勝ちました。
  - 17年前は4部、しかもマイナスの勝ち点から始めたクラブです。
