- id: squad
  heading: 今季の登録選手
  tier: 報道
  telop: 今季の登録選手
  narrator: キャスター
  say:
  - text: 今季の登録選手は28人です。
    image: assets/stats/pl_bournemouth_gk.png
    no_telop: true
  - image: assets/stats/pl_bournemouth_gk_f.png
    text: ゴールキーパーは3人。ジョルジェ・ペトロヴィッチはセルビア代表で**12試合**。
    no_telop: true
  - image: assets/stats/pl_bournemouth_df_f.png
    text: ディフェンダーは10人。主将を務めるのが**アダム・スミス**。リーグ戦で**350試合**に出ています。アントニオ・シウヴァはポルトガル代表で**20試合**。
    no_telop: true
  - image: assets/stats/pl_bournemouth_mf_f.png
    text: ミッドフィールダーは8人。ライアン・クリスティはスコットランド代表で**71試合**。デイヴィッド・ブルックスはウェールズ代表で**45試合**。
    no_telop: true
  - image: assets/stats/pl_bournemouth_fw_f.png
    text: フォワードは7人。ジャスティン・クライファートはオランダ代表で**14試合**。エヴァニウソンは**クラブ最高額の4020万ポンド**で加入しました。
    no_telop: true
  sources:
