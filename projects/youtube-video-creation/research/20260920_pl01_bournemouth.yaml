- id: data
  heading: ボーンマス 基礎DATA
  main: true
  tier: 背景
  telop: 1899年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_bournemouth_data0.png
    text: 創立は**1899年**。前身はボスコム・セント・ジョンズ・インスティチュートです。
    no_telop: true
  - image: assets/stats/pl_bournemouth_data8.png
    text: 愛称は「ザ・チェリーズ」。さくらんぼです。
    no_telop: true
  - image: assets/backgrounds/stadium_ボーンマス_in.png
    text: 本拠地はディーン・コート。**1万2357人**。マンチェスター・ユナイテッドの**6分の1**です。
  - image: assets/stats/pl_bournemouth_map.png
    text: 町はイングランド南部、ドーセット州の海沿いです。
    no_telop: true
  - image: assets/photos/pl/bournemouth_owner_cf0347c5.jpg
    text: オーナーはアメリカのビル・フォーリー。2022年に買収。**1億ポンド超**と報じられました。
  - image: assets/photos/pl/bournemouth_owner_07f09a4e.jpg
    text: 共同オーナーには、ハリウッド俳優の**マイケル・B・ジョーダン**もいます。
  - image: assets/stats/pl_bournemouth_cups.png
    text: 1部の優勝も、FAカップも、リーグカップもゼロ。20クラブで3つとも無いのは**5クラブ**です。
    no_telop: true
  - image: assets/stats/pl_bournemouth_last.png
    text: それが昨季、**6位**。クラブ史上最高の順位でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
  bg: assets/backgrounds/stadium_ボーンマス.png
