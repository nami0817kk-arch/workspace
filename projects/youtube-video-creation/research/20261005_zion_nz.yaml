- id: title
  heading: 小さなタイトルを、アジアカップへ
  tier: 報道
  telop: 鈴木彩艶「こういった積み重ねがアジアカップにもつながっていく」
  narrator: キャスター
  say:
  - text: 日本はキリンカップで、2016年と2022年、2大会続けて2位に終わっています。
    image: assets/images/20261005_zion_nz/01_w.jpg
  - voice: 鈴木彩艶
    text: 大きな大会ではないですけど、
  - voice: 鈴木彩艶
    text: こういった小さいところから
    cont: true
  - voice: 鈴木彩艶
    text: タイトルを穫ることが大事だと思います。
    cont: true
  - voice: 鈴木彩艶
    text: こういった積み重ねが
    cont: true
  - voice: 鈴木彩艶
    text: アジアカップにもつながっていくと思うので、
    cont: true
  - voice: 鈴木彩艶
    text: しっかりと勝ちきって優勝すること。
    cont: true
  - text: 準決勝はPK戦で勝ち上がった日本。決勝でまたPK戦になったら、と聞かれると。
  - voice: 鈴木彩艶
    text: 展開によってはPK戦ということもあるかもしれませんが、
  - voice: 鈴木彩艶
    text: GKとしてゴールを防ぐということは変わらない。
    cont: true
  - voice: 鈴木彩艶
    text: どんな展開になったとしても、
    cont: true
  - voice: 鈴木彩艶
    text: 自分としては最後までゴールを守って、
    cont: true
  - voice: 鈴木彩艶
    text: 結果につながるプレーをしたい
    cont: true
