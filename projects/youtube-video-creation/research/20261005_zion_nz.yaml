  title: 鈴木彩艶「彼が相手チームの特長」。決勝の前日、守護神が名指しで警戒したエース
  opening_image: assets/images/20261005_zion_nz/01_w.jpg
  takeaway: ニュージーランド歴代最多の45得点を持つクリス・ウッドは、今夏のワールドカップでは3試合で無得点だった。それでもイラン戦ではチームの2点をどちらもアシストしている。自分で決めなくても攻撃の起点になる、鈴木彩艶の言う「特長」は数字にも出ている。今季のクラブではリーグ戦の出場が途中からの62分にとどまり、代表期間の最初の2試合を休んで迎える決勝。代表30試合のうち17試合を無失点で終えてきた鈴木が、5日の国立でその起点を止められるか
