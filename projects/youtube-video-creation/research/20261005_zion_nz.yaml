  heading: ニュージーランドの起点
  tier: 報道
  telop: 鈴木彩艶「本当に起点になれるので彼が相手チームの特長」
  narrator: キャスター
  say:
  - text: キリンカップ決勝を前に、日本代表のゴールキーパーが相手をこう分析しました。
    short_only: true
    image: assets/images/20261005_zion_nz/01_w.jpg
  - voice: 鈴木彩艶
    text: これまでの3試合とは違って南米ではないチームになるけど、
  - voice: 鈴木彩艶
    text: 相手の特徴的に背の高い選手がいる。
    cont: true
  - voice: 鈴木彩艶
    text: ウッド選手も含めてかなり背の高い選手が多くて、
    cont: true
  - voice: 鈴木彩艶
    text: 彼を起点に攻撃を組み立ててくるチームなので、
    cont: true
  - voice: 鈴木彩艶
    text: まずはそこに警戒して臨みたい
    cont: true
  - text: 決勝の前の日、練習のあとに、相手のニュージーランドについて語った言葉です。
  - text: 名前を挙げたクリス・ウッドについては、こう言い切りました。
    image: assets/images/20261005_zion_nz/pair/01.jpg
  - voice: 鈴木彩艶
    text: 本当に起点になれるので彼が相手チームの特長
