  title: 鈴木彩艶「彼が相手チームの特長」。決勝の前日、守護神が名指しで警戒したエース
  opening_image: assets/images/20261005_zion_nz/01_w.jpg
  takeaway: 日本は9月のウルグアイ戦とベネズエラ戦で空中戦の勝率61%と54%と勝ち越したが、今夏のワールドカップの4試合ではちょうど5割、背の高いオランダには28回のうち7回しか勝てなかった。一方、191センチのクリス・ウッドはワールドカップの3試合で空中戦23回のうち12回に勝ち、チームが勝った38回のうち12回、エジプト戦では16回のうち10回を一人で取った。鈴木彩艶が「一発目の管理」と言うのは、この最初の競り合いのこと。5日の国立で日本がウッドとの空中戦に勝ち越せるかが、決勝の分かれ目になる
