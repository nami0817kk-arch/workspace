      highlight_row: 2
  - text: 鈴木が見ているのは、その高さを生かした攻めです。
    image: assets/images/20261005_zion_nz/pair/01.jpg
  - voice: 鈴木彩艶
    text: 空中戦を警戒しているところはあるので、
  - voice: 鈴木彩艶
    text: 自分がしっかりとパフォーマンスを発揮しないと
    cont: true
  - voice: 鈴木彩艶
    text: いけない場面が多くなる
    cont: true
  - voice: 鈴木彩艶
    text: どこからでも彼に放り込んできて、
  - voice: 鈴木彩艶
    text: 彼のポストプレーや、
    cont: true
  - voice: 鈴木彩艶
    text: 競り合ったセカンドボールを拾って
    cont: true
  - voice: 鈴木彩艶
    text: 攻撃してくるところがあるので、
    cont: true
  - voice: 鈴木彩艶
    text: 一発目の管理、セカンドボールの準備をしっかりしたい
    cont: true
  - text: ポストプレーは、前線で背中を向けてボールを受け、味方へ落とすプレーのこと。
  - text: 放り込まれたボールへの最初の競り合いが「一発目」。
  - text: そこからこぼれたボールが、セカンドボールです。
