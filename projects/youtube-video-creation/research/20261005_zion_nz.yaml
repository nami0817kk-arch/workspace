# 取材メモ（10/5 題材 zion_nz、型は quote）。材料の控え: research/raw/20261005_zion_nz.md
# 主役は鈴木彩艶が決勝の前日（10/4 の練習後）に語った言葉。相手のエース（クリス・ウッド）への警戒・空中戦の備え・タイトルへの思い・PK戦になったら。
# 決勝は 10/5（月）19:30 国立、相手ニュージーランド。試合の前に公開するので、結果は書かない。
# 重ねない: 10/2 doan_zion（堂安の評・PK戦の手渡し・PK戦の歴史）／10/2 japan_ecuador（PK戦のキッカー）／10/4 kirin_final_eve（若手の出場時間・NZとの対戦成績・東京五輪）。
#   10/1 zion_mvp（月間MVP・移籍金・9月の5試合6失点）とも重ねない。クラブの数字は今季の合計1行。同時に作っている堂安の回（主将）にも触れない。
#   PK戦は本人の言葉の前置きでひと言だけ（「15年ぶりのPK戦勝利」も言わない）。
# 事実の裏（raw の 2.・3.）:
#   ウッド: 代表94試合45得点（Transfermarkt の試合記録・サッカーキング。歴代最多は英語版 Wikipedia）。W杯2026は3試合0得点、イラン戦2-2で2アシスト（Transfermarkt と FotMob が一致。NZ の2点はジャスト）。
#     今季フォレスト: 公式戦5試合0得点、リーグは4試合とも途中から計62分（Transfermarkt・FotMob・RNZ）。今回の代表期間の最初の2試合（中国）は負担を抑えるために休んだ（RNZ 9/30）。
#     9/12 ヴィラ 1-2 フォレスト: 鈴木 先発90分2失点、ウッド 1分（Transfermarkt・FotMob）。191cm・プレミア通算92得点はゲキサカの地の文。
#   鈴木: 代表30試合20失点、無失点17試合（Transfermarkt。FotMob も30試合）。W杯2026は4試合5失点。今季ヴィラは公式戦6試合7失点（杯の後半45分を含む）。
#   見立て（10/5 作り直し、ユーザー「ウッドの見立ては、日本の空中戦の勝率で考えて」）: 空中戦の数字は FotMob の試合記録（Aerial duels won）。エクアドル戦・パナマ戦は FotMob に数字が無い（raw の 7.）。
#   スポニチの「14試合ぶり無失点」は Transfermarkt・JFA の紹介文と合わないので言わない（raw の 3.）。
#   発言はゲキサカ 460317（ウッド・空中戦）とサッカーキング 2212990（タイトル・PK戦）の原文のまま。同じ発言の言い回しが2社で少し違う（raw の 1.）。
# 写真: 01 はゲキサカ 460317 の 10/4 練習の写真（©Kaoru WATANABE/GEKISAKA、代理店ではない）。_w・_v は facecrop。
#   ウッドは Commons「File:Chris Wood, Nottingham Forest, 2025.jpg」（CC0 / Sebalston）。pair は鈴木（左）＋ウッド（右）、pair/01_v は上下。
# 反応: Yahoo!ニュース（ゲキサカの転載）のコメント欄の1件だけ（サッカーキングの転載はコメント0件）。
