# バルサのデコが RAC1 で全部答えた（2026年9月10日）。ユーザー指示「1番は作成してください」
#
# **1つの番組で11本ぶんの発言が出ている。**ロマーノが1時間で11投稿、
# どれも60〜100万表示。いちばん伸びたのは
# 「1億ユーロを3シーズンで払う提案をした。5回払いのクラブもある」（100万表示）。
#
# 型は `quote`。**事実は最初だけ。あとは本人の言葉を1つずつ読む。**
# 問いも答えも立てない（quote の決まり）。
#
# **「どこで読んだか」は言わない**（2026-09-10 ユーザー指示）。
# ロマーノの名前は、確度が「確定」である根拠なので1度だけ出す。
# 番組名（RAC1）はデコが話した場所そのものなので残す
#
# **反応は入れない。**読める形のスレが無かった
# **型は news にした**（2026-09-10）。最初は quote と書いたが、quote は
# 「30秒前後で言葉だけを切り出す」型で、この回は3分半・4節ある。
# **中身に合わない札を貼っていた。**他人の声は53%で、news の下限40%を超えている。
# 基準を下げるのではなく、型のほうを実態に合わせる
format: news
slot: laliga
date: "2026年9月10日"

# ハッシュタグに使う人の名前
people:
  - デコ
  - フリアン・アルバレス
  - ラッシュフォード
  - アンソニー・ゴードン
  - ベルナルド・シルバ
  - フェラン・トーレス
  - アラウホ
  - ラミン・ヤマル
  - ペドリ
  - ハフィーニャ

short_title: "デコが明かしたフリアンへの払い方"

theme:
  id: deco_rac1
  league: spain
  kind: other
  topic: バルセロナ
  title: バルサのデコが1時間で全部答えた。フリアンの1億ユーロ、どう払うつもりだったか
  hook: 逃した補強も、去った選手も、バロンドールも。
  question: 逃した補強について、当のスポーツディレクターは何と言ったか

thumbnail:
  line1: バルサがアトレティコに出した条件
  line2: ●億ユーロを ●●●●
  # **移籍交渉の裏側にする**（2026-09-10 ユーザー指示「デコと、フリアン、
  # アトレティコ、バルサで移籍交渉の裏側的なものにしてください」）。
  # デコ（バルサ側）とフリアン（アトレティコ側）を並べ、継ぎ目に「交渉」の札。
  # エンブレムは**それぞれの顔の上**に置く（どちらの側の人かが分からないと
  # 移籍の絵にならない）。
  # **並べるのは2人のスポーツディレクター**（2026-09-10 ユーザー
  # 「アトレティコのスポーツダイレクターの写真はある？」）。交渉した当人どうしで、
  # デコが名前を出して否定しているのもアレマニーに対してなので、選手より噛み合う。
  # アレマニーがアトレティコの football director であることは英語版Wikipediaで確認
  # （2025年10月から。それ以前はバルサ、その前はバレンシアとマジョルカ）。
  # デコの写真は現役時代のものしか無いが、**古いユニフォームでよい**（既決）
  photo: "assets/photos/20260910_deco/01.jpg"
  photos:
    - "assets/photos/20260910_deco/01.jpg"
    - "assets/photos/20260910_julian/01.jpg"
    - "assets/photos/20260910_alemany/01.jpg"
  face_link: "交渉"
  tags: [バルセロナ, アトレティコマドリード]
  points:
    - 支払いは3シーズン
    - 5回払いのクラブもある

sections:
  - id: where
    heading: デコが出た番組
    tier: 確定
    telop: バルサのSDがラジオで1時間
    narrator: キャスター
    say:
      - バルセロナのスポーツディレクター、アンデルソン・ルイス・デ・ソウザ。通称デコが、カタルーニャのラジオ局RAC1に出演しました。
      - 移籍情報の記者ファブリツィオ・ロマーノが、その中身を次々に伝えています。
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2098003985512714725
      - https://x.com/FabrizioRomano/status/2098007249713058053

  - id: julian
    heading: フリアン・アルバレスに、いくらをどう払うつもりだったか
    tier: 確定
    telop: 「1億ユーロを3シーズンで」
    narrator: 解説
    card:
      type: bars
      title: バルサがアトレティコに提示していた支払い
      items:
        - {label: "総額（百万ユーロ）", value: 100}
        - {label: "分ける回数", value: 3}
      unit: 単位ちがい
    say:
      - ここからが本題です。バルセロナは夏のあいだ、アトレティコのフリアン・アルバレスを追っていました。
      - {voice: デコ, text: 1億ユーロを3シーズンで払う提案をした}
      - {voice: デコ, text: 5回に分けて払うクラブもある}
      - 移籍が実らなかったことについて、外から圧力をかけたのではないかとも問われています。
      - {voice: デコ, text: バルサがフリアンに圧力をかけて}
      - {voice: デコ, text: アトレティコを出たいと公に言わせたわけではない}
      - {voice: デコ, text: 彼自身が決めたことだ}
      - アトレティコのスポーツディレクター、マテウ・アレマニーとの関係についても、こう言い切りました。
      - {voice: デコ, text: マテウ・アレマニーとは何の問題もない}
      - {voice: デコ, text: 私は彼に何もしていない}
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2098003985512714725
      - https://x.com/FabrizioRomano/status/2098007249713058053

  - id: gone
    heading: 来なかった選手と、出ていった選手
    tier: 確定
    telop: 「ゴードンのほうが監督の求めるものを持っている」
    narrator: 解説
    say:
      - 補強の話は、フリアンだけではありませんでした。
      - {voice: デコ, text: ラッシュフォードにはとても感謝している}
      - {voice: デコ, text: だがアンソニー・ゴードンのほうが}
      - {voice: デコ, text: 監督の求めるものを多く持っている}
      - ベルナルド・シルバについては、獲れなかった理由をこう説明しています。
      - {voice: デコ, text: 我々が探していたポジションではなかった}
      - {voice: デコ, text: 彼はバルサに来たがっていた}
      - {voice: デコ, text: だが我々には我々の基準がある}
      - {voice: デコ, text: 金額と出場時間の問題だった}
      - {voice: デコ, text: 彼はプレーしたがっていた。私は自分たちの選手を優先する}
      - 一方、退団してハットトリックを決めたフェラン・トーレスには、こう言いました。
      - {voice: デコ, text: 彼とハットトリックを喜んでいる}
      - {voice: デコ, text: バルサでは選手に幸せでいてほしい}
      - {voice: デコ, text: 出ていって主役になりたいと言うなら、行かせる}
      - 残す側の話もしています。バルデについてはこう言いました。
      - {voice: デコ, text: 彼は我々の選手だ}
      - {voice: デコ, text: 世界最高のクラブで、明るい未来がある}
      - {voice: デコ, text: このバルデが元気なら、バルサで出ないことは考えにくい}
      - {voice: デコ, text: 出るかどうかを決めるのは監督だ}
      - リヴァプールへ貸し出したアラウホについても触れました。
      - {voice: デコ, text: ロナルドが大好きだ。昨日の活躍を見られて嬉しかった}
      - {voice: デコ, text: 彼には成功してほしい}
      - {voice: デコ, text: バルサでの時間は素晴らしいものだった。契約はまだ残っている}
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2098001302693261449
      - https://x.com/FabrizioRomano/status/2098011687248936980
      - https://x.com/FabrizioRomano/status/2098005601598984399
      - https://x.com/FabrizioRomano/status/2098005964565676512

  - id: ballon
    heading: バロンドールについて言ったこと
    tier: 確定
    telop: 「世界的なスキャンダルだ」
    narrator: 解説
    say:
      - 最後は、8日に発表されたバロンドールの候補30人についてです。
      - {voice: デコ, text: ラミンが本命であるべきだ。私に迷いはない}
      - {voice: デコ, text: バルサと代表でやってきたことを思い出してほしい}
      - {voice: デコ, text: 決定的な場面がいくつもあった}
      - {voice: デコ, text: ケガを抱えてワールドカップにも行った}
      - そのうえで、選ばれなかった2人の名前を挙げました。
      - {voice: デコ, text: ペドリとハフィーニャが30人に入っていないのは}
      - {voice: デコ, text: 私の意見では、世界的なスキャンダルだ}
      - {voice: デコ, text: 2人は間違いなく、そこにいるべきだった}
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2097992913556762698
      - https://x.com/FabrizioRomano/status/2097992539030610267
