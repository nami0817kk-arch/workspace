        - [昨季の得点＋アシスト, "16", "11"]
        - [リーグ戦で出られた割合（昨季）, 91%, 42%]
        - [市場価値, 1.2億€, 1.4億€]
      bars: [得点＋アシスト（90分あたり）, 昨季の出場時間, 昨季の得点＋アシスト, リーグ戦で出られた割合（昨季）]
      note: 昨季25/26のクラブの全公式戦。90分あたりは自分で割った値
    say:
      - text: 見立てです。昨季の90分あたりは、ほぼ並んでいました。
        image: assets/images/20261021_rice/ghana305/01_w.jpg
        card: {<<: *viewcard, highlight_row: 得点＋アシスト（90分あたり）}
      - text: ただ、出た時間は、ライスのほうが、ずっと長い。
        emph: true
        card: {<<: *viewcard, highlight_row: 昨季の出場時間}
      - text: 合計の数は、ライスが16、ネヴェスが11になります。
        image: assets/images/20261021_neves/croatia232/01_w.jpg
        card: {<<: *viewcard, highlight_row: 昨季の得点＋アシスト}
        mark: {kind: circle, row: 2}
      - text: リーグ戦で出られた割合は、91%と42%。大きな差です。
        card: {<<: *viewcard, highlight_row: リーグ戦で出られた割合（昨季）}
      - text: 市場価値は、出た時間が短いほうの値が、高くなっています。
        card: {<<: *viewcard, highlight_row: 市場価値}
      - text: 年齢と1分あたりの数字が、値に出ているのかもしれません。
        image: assets/images/20261021_rice/ghana133/01_w.jpg
        card: none
      - text: アーセナルは、日本時間22日の午前4時、バイエルンとのチャンピオンズリーグ。
        card: none
      - text: ライスの出番が、ここでどう動くか。ネヴェスは、今季の72%が、どこまで伸びるか。
        image: assets/images/20261021_neves/croatia101/01_w.jpg
        card: none
