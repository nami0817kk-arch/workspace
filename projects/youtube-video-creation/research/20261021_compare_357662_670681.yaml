# 取材メモ（10/21 水、シリーズ「比べる」、key: compare_rice_neves）。デクラン・ライス（アーセナル）×ジョアン・ネヴェス（パリ・サンジェルマン）。
# **FotMob・DataMB は使っていない**。数字は Transfermarkt（2026-10-21 取得。控え: research/raw/20261021_rice_tm.json・20261021_neves_tm.json・*_erfolge.html）と ESPN の試合記録。
#   Transfermarkt 番号：ライス 357662・ネヴェス 670681。API を番号ごとに（プロフィール・市場価値の推移・季ごとの大会別成績・試合ごとの記録）3秒あけて取得。タイトルは実績ページ（erfolge）を1ページずつ。
#
# **スタッツの条件（足切り）**：クラブの全公式戦の出場時間。
#   昨季 25/26：ライス 55試合4456分／ネヴェス 38試合2701分（2人とも900分超。標本は十分）。
#   今季 26/27（10/18 まで）：ライス 10試合819分／ネヴェス 8試合540分（**450分は超えるが900分に届かない → 「いまの時点」と言う**）。ネヴェスは 10/20（PSG対バルセロナ）の分を含まない。
#   大会が違う（ライス＝プレミア・CL・リーグ杯、ネヴェス＝リーグ・アン・CL・各カップ）一言を入れる。位置は Transfermarkt 表記でどちらもセントラルMF（同じ群）。
# **使った数（基本の数）と自分で割った値**
#   昨季（クラブの全公式戦、TM の大会別を足した）：ライス＝試合55・得点5・アシスト11・出場4456分（プレミア36試合3099分・CL13試合1069分・リーグ杯6試合288分）。
#     ネヴェス＝試合38・得点7・アシスト4・出場2701分（リーグ・アン21試合1286分・CL14試合1144分・各カップ・インターコンチネンタル杯など3試合）。
#   90分あたり＝回数×90÷出場分：得点 ライス5×90÷4456＝0.10／ネヴェス7×90÷2701＝0.23、アシスト 11×90÷4456＝0.22／4×90÷2701＝0.13、
#     得点＋アシスト 16×90÷4456＝0.32／11×90÷2701＝0.37。
#   リーグ戦で出られた割合＝リーグ戦の出場分÷（そのリーグの全試合×90分）：ライス（プレミア38試合＝3420分）23/24 3231分＝94%・24/25 2833分＝83%・25/26 3099分＝91%・26/27（7試合630分）594分＝94%。
#     ネヴェス（23/24 ポルトガル1部34試合＝3060分）2314分＝76%・24/25 リーグ・アン 1851分＝60%・25/26 1286分＝42%・26/27（7試合630分）451分＝72%。**出られなかった理由は数字から分からないので言わない**。
# 年齢別の市場価値（TM の推移、年齢ごとの最高値、百万€）：ライス 18歳2・19歳20・20歳55・21歳55・22歳75・23歳80・24歳110・25歳120・26歳120・27歳120／ネヴェス 18歳10・19歳55・20歳80・21歳140。
#   21歳で 140÷55＝2.5倍あまり。現在値 ライス1.2億（2026-06-03）・ネヴェス1.4億（2026-06-01）。ネヴェスの 1.4億 は21歳の時点の値で、9/27 に22歳になっても更新は無い。
# タイトル（Transfermarkt 実績ページ、2026-10-21。英語版 Wikipedia の栄誉欄と一致）：ライス＝イングランドのリーグ優勝1（25/26）・カンファレンスリーグ1（22/23）・国内スーパーカップ（コミュニティ・シールド）2（2023・2026）、
#   ユーロ準優勝2・W杯3位1。／ネヴェス＝CL2（24/25・25/26）・リーグ（フランス2＋ポルトガル1＝3）・国内カップ（フランス1）・国内スーパーカップ（フランス2＋ポルトガル1＝3）・UEFAスーパーカップ1・インターコンチネンタル杯1・ネーションズリーグ1。
#   国内カップ＋スーパーカップ：ライス 0＋2＝2／ネヴェス 1＋3＝4。
# **CL決勝（2026-05-30、ブダペスト・プスカーシュ・アリーナ）**：ESPN の試合記録（site.api.espn.com/…/uefa.champions/summary?event=401862897）。1-1 の120分、PK戦 PSG 4-3。
#   6分ハヴァーツ（アーセナル）、65分デンベレのPK（PSG）。ライス・ネヴェスとも先発（ESPN の先発フラグ）で、TM の記録でも2人とも120分出場。
#   PK戦の蹴り順（ESPN の shootout）：PSG＝ラモス・ドゥエ・N.メンデス（失敗）・アクラフ・ベラルド／アーセナル＝ギェケレス・エゼ（失敗）・**ライス（成功・3人目）**・マルティネッリ・ガブリエウ（失敗）。
#   **ライスの3人目は ESPN の構造化データだけ**。スカイスポーツの記事は蹴り順を載せておらず（エゼの失敗・ライヤの止めたメンデス・ガブリエウの失敗だけ）、矛盾はしないが裏は取れていない。公開前に別の記録で確かめる。
#   ネヴェスは蹴っていない（ESPN）。警告（ライス103分・ネヴェス90+6分）は入れない。
# 日程（ESPN）：アーセナル対バイエルン（CL）2026-10-21 19:00 UTC＝日本時間22日4時。PSG対バルセロナ（CL）は 10/20 19:00 UTC（日本時間21日4時）で、**結果は読んでいないので触れない**。
# 経歴（英語版 Wikipedia 2026-10-18／10-17 更新。背景）：ライス＝2006年チェルシーの育成→14歳で退団→2013年ウェストハム、トップ初出場 2017-05-21（18歳）、245試合15得点（TM と一致）、2023-07 アーセナルへ（最初の支払い1億ポンド・追加分最大500万ポンド、報道）。
#   ネヴェス＝2016年ベンフィカの育成組織、トップ初出場 2023-01-01（18歳）、2024-08-05 PSGへ（5990万ユーロ＋追加分最大1000万ユーロ、報道。ベンフィカ会長の発表は7000万ユーロの提示）、75試合4得点（TM）。
# 入れなかったもの：身長（TM はネヴェス 1.71m・10/8 の選手紹介は 174cm で食い違う。確かめられない）、警告・退場・負傷の話、私生活、CL決勝のスコア以外の細部、ライスのアイルランド代表歴（10/11 の選手紹介の素材）、
#   ネヴェスとカマラの比べ（10/14）で使った「21歳までの積み方」、FotMob のパーセンタイル。
# **重なりの確認**：ライスの選手紹介（10/11）・ネヴェスの選手紹介（10/8）・ネヴェス×カマラ（10/14）を直近30日に出している。2人の組み合わせ（ライス×ネヴェス）は初めて。10/9 のベリンガム×ムシアラ・10/17 のペドリ×ヴィティーニャと同じ「比べる」の型だが、中身（CL決勝・出られた割合）は重ならない。
