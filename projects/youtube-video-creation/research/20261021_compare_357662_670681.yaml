  - id: view
    heading: 見立て・違いは1分あたりの数字か、出られる時間か
    tier: 背景
    viewpoint: true
    narrator: 解説
    telop: 数字の違いが示すもの
    card: &viewcard
      type: duel
      left: {name: ライス, club: アーセナル, photo: assets/images/20261021_rice/ghana133/01_sq.jpg, color: "#ef0107"}
      right: {name: ネヴェス, club: パリ・サンジェルマン, photo: assets/images/20261021_neves/croatia102/01_sq.jpg, color: "#004170"}
      rows:
