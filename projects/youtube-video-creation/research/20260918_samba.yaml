# マンCの17歳が、やったことのない位置で2発（2026-09-18）
#
# **取材で3つ訂正が出た。どれも踏みやすい:**
#   ①監督は**グアルディオラではなくエンツォ・マレスカ**（マンC公式が "Enzo Maresca's side"）
#   ②サッカーキングの「U-19ドイツ代表」は**招集段階**。クラブ公式の記載は
#     "An England youth international"。**ドイツU-19での出場は0**。
#     イングランド・ドイツ・フランス・コンゴの4か国の資格があり、本人はまだ決めていない
#   ③生年月日が**1月15日（ESPN）と1月17日（サッカーキング）で割れている**。
#     クラブ公式は出していない。**「2009年1月生まれ」「17歳」まで**にする
#
# **2点目の位置も割れている。**サッカーキングは「ボックス左」、
# クラブ公式は "on the right of the box"。**公式を採る**
#
# **ESPN は「4回戦」と誤記**。クラブ公式・Sky・サッカーキングは3回戦
#
# **話の順番を組み直した**（2026-09-18 ユーザー指摘「話の流れがとっちらかってる」）。
# 前は 試合 → 山場（なぜ9番か）→ 人物紹介 → 本人の言葉 という並びで、
# **山場のあとに人物紹介が来て話が戻り**、発言も2か所に散っていた。
# いまは **事実 → 誰なのか → なぜその位置だったのか → 本人 → 反応** の一本。
# 代表の4か国の話は**最後の一言**に回す（途中に置くと話が横へ逸れる）
#
# 引きは**マレスカの「9番でやったことがあるかと聞いたら、一度もないと言われた」**（@main）。
# これは**クラブ公式にしか載っていない**
#
# **「サンバのアシスト」は使わない。**サッカーキングとESPNは書いているが、
# クラブ公式の描写ではブアディ→シェルキで、サンバ経由と明記されていない
#
# **父の代表歴はサッカーキングにもクラブ公式にも無い。**SPORTbible だけなので、
# 「コンゴ代表」には触れず「元プレミアの選手」までにする
#
# **サムネはエンブレム2つ。**記事の写真は Getty 配信だった（代理店は避ける）
