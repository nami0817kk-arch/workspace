sections:
  - id: match
    heading: 何が起きたか
    tier: 確定
    bg: assets/backgrounds/samba_20260918.png
    telop: マンチェスター・シティ5-0ノリッジ。17歳が2点
    narrator: キャスター
    card:
      type: table
      title: カラバオカップ3回戦
      columns: ["", ""]
      rows:
        - ["29分", "サンバ（ヘディング）"]
        - ["32分", "シェルキ"]
        - ["48分", "アラン"]
        - ["54分", "サンバ（右から巻いて）"]
        - ["90分", "マカイドゥ"]
    say:
      - 17日のカラバオカップ3回戦。ホームでノリッジを5対0で下した試合です。
      - このうち2点を挙げたのが、**17歳のフロイド・サンバ**でした。
      - 29分に左からの折り返しをヘディングで流し込み、54分にはボックスの右から巻いたシュートを決めています。
      - "**トップチームでの、初めての試合でした。**"
    official: true
    sources:
