  - id: who
    heading: この17歳は何者か
    tier: 報道
    bg: assets/backgrounds/samba_20260918.png
    telop: 9歳からこのクラブにいる、中盤の選手
    narrator: キャスター
    card:
      type: table
      title: フロイド・サンバ
      columns: ["", ""]
      rows:
        - ["年齢", "17歳（2009年1月生まれ）"]
        - ["本職", "セントラルMF"]
        - ["身長", "183センチ"]
        - ["経歴", "アカデミーにU-9から"]
    say:
      - サンバは2009年1月生まれの17歳、183センチ。
      - このクラブのアカデミーには**U-9のときから**います。10年近くになります。
      - 父は元プレミアリーグの守備の選手、クリストファー・サンバ。
      - この日はスタンドから息子のデビューを見ていた、とスカイ・スポーツが伝えています。
      - "**サンバの本職は、センターフォワードではありません。**中盤の選手です。"
    official: false
    sources:
      - https://www.mancity.com/news/mens/who-is-city-s-floyd-samba-63925262
      - https://www.skysports.com/football/manchester-city-vs-norwich-city/report/577580

  - id: why
    heading: なぜその位置だったのか
    main: true
    tier: 確定
    bg: assets/backgrounds/samba_20260918.png
    telop: 「9番でやったことはあるか」
    narrator: 解説
    say:
      - {short_only: true, text: シティが10人を入れ替えた一戦。ハーランドは休養でした。}
      - 空いた9番に置かれたのが、中盤の17歳です。監督のマレスカが理由を明かしました。
      - {voice: シティの監督, text: 9番で使うと決めた3、4日前に本人に聞いたんだ。そこでプレーしたことはあるかと}
      - {voice: シティの監督, text: すると彼は、一度もないと言った}
      - "**一度もやったことのない位置で、2点を取ったことになります。**"
      - {voice: シティの監督, text: 彼は間違いなく9番ではない。だが若くて力にあふれ、強く、決められるし、良い判断もできる}
      - {voice: シティの監督, text: ただ、彼らは若い。ゆっくり進めていく必要がある}
    official: true
    sources:
      - https://www.mancity.com/news/mens/man-city-5-0-norwich-enzo-maresca-reaction-63925278

  - id: words
    heading: 本人が言ったこと
    tier: 確定
    bg: assets/backgrounds/samba_20260918.png
    telop: 「これはまだ始まりにすぎない」
    narrator: 解説
    say:
      - 当のサンバは、試合のあとこう話しています。
      - {voice: サンバ, text: あんなデビューになるなんて、頭が吹き飛ぶようだった。自分でも信じられなかった}
      - {voice: サンバ, text: トップチームの選手たちみんなと話した。試合の前に助言をくれたんだ}
      - {voice: サンバ, text: 自分のプレーをしろ、自分でいろ、と。その言葉が自信をくれて、今日の2点につながった}
      - {voice: サンバ, text: でも、これはまだ始まりにすぎない。僕の前には長いキャリアがある}
      - その先で、決めなければならないことが1つ残っています。
      - イングランドの年代別代表としてプレーしてきましたが、この代表ウィークに**ドイツのU-19に招集**されました。
      - "**イングランド、ドイツ、フランス、コンゴ。4つの資格があり、本人はまだ選んでいません。**"
    official: true
    sources:
      - https://www.mancity.com/news/mens/samba-post-norwich-reaction-cc-17-sep-63925243
      - https://www.sportbible.com/football/football-news/man-city/floyd-samba-man-city-england-allegiance-921940-20260917

  - id: voices
    heading: この2発をどう見たか
    tier: 未確認
    bg: assets/backgrounds/samba_20260918.png
    telop: 「17でマンCのトップチームはエグいな」
    narrator: キャスター
    say:
      - {voice: ネット民, text: 2点ともめちゃくちゃ上手かった。名前も特徴的で覚えやすいし、いい選手になりそう}
      - {voice: ネット民, text: 17でマンCのトップチームはエグいな}
      - {voice: ネット民, text: クリストファーサンバの息子なのか。父親もブラックバーンでCBだったけど、謎にFWやってた時期あったよな}
      - {voice: ネット民, text: このサンバは、本職は中盤真ん中なのにCFで出るということは、よっぽど出番をあげたかった、つまり期待されているんだろうね}
      - {voice: ネット民, text: シティで、17歳でトップチームに呼ばれただけでも超新星なのは間違いない}
      - {voice: ネット民, text: ブアディもまだ10代だし、シティの2列目3列目はほんと激戦区だね, short_voice: true}
      - {voice: ネット民, text: 将来どっちの代表選ぶんやろか, short_voice: true}
    official: false
    sources:
      - https://news.yahoo.co.jp/articles/e5181932b4ea672370490350b9dc2e6472f80044/comments
