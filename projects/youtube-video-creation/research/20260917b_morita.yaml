  - id: injury
    heading: いま起きていること
    main: true
    tier: 報道
    telop: 「あと2週間離脱する」
    narrator: 解説
    say:
      - {short_only: true, text: プレミアのハル・シティに移った守田英正の話です。}
      - その初先発の試合のあと、体に問題が出ました。
      - ハル・シティのヤキロビッチ監督が、アストン・ヴィラ戦のあとに説明しています。
      - {voice: ハルの監督, text: あと2週間離脱する}
      - {voice: ハルの監督, text: 内転筋に問題があり、コヴェントリー戦後に問題が発生した}
      - 全体では**3週間**の離脱で、そのうち1週間が過ぎた時点での話でした。
      - しかも、これが最初ではありません。
      - "**ハルに加入した時点で、すでにふくらはぎに問題を抱えていました。**"
      - 監督は当時、プレー可能になるまで10日ほどかかるという見通しを示しています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/07/post1005300/

  - id: squad
    heading: 序列という問題
    tier: 背景
    telop: ハルはこの夏、18人を獲得した
    narrator: キャスター
    say:
      - もうひとつ、待っているものがあります。
      - ハル・シティは移籍期限の最終日だけで6人、**この夏に合わせて18人**を獲得しました。
      - 昇格したクラブが、1部に残るために人を入れ替えた形です。
      - 怪我で離れているあいだに、同じ場所を争う選手が増えていきます。
      - 守田は今年1月のアジア杯をめぐって発言し、W杯の26人からは落選しました。
      - 森保監督は9月と10月について「基本的にはW杯に選んだメンバー」と話しています。
    official: false
    sources:
