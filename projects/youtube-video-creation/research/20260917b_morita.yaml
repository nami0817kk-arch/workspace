# 守田英正が、また離脱した（2026-09-06 の監督発言）
#
# **W杯に行けなかった選手の、その後を追う回。**スポルティングを離れ、
# プレミアのハル・シティへ。ところが加入前から体に問題を抱えていた。
#
# 引きは**「加入した時点で、すでに痛めていた」**。ここが山場（@main）。
#
# **「太い幹がない」のインタビューは使わない。**あれは2024年2月の記事で、
# しかも有料の壁の内側（2026-09-16 に確認）。**古い言葉を今日の話に混ぜない。**
#
# **鈴木彩艶と同じ試合の話が出てくる。**9/17 に出す鈴木彩艶の回とは
# 別の試合（あちらはフォレスト戦）なので重ならない
