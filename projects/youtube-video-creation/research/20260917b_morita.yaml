    say:
      - 守田英正は今夏、ポルトガルのスポルティングを離れました。
      - 移った先は、**ハル・シティ**。25年ぶりにプレミアリーグへ戻ってきたクラブです。
      - 7月24日に加入し、2年の契約を結んでいます。
      - 8月25日のカラバオ杯、ストーク・シティ戦で途中出場し、公式戦デビュー。
      - 29日のコヴェントリー戦では、プレミアリーグで初めて先発しました。
    official: false
