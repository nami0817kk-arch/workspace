title: 10月20日の題材（ショート）
lead: 今日は火曜で、昨夜（19日）の試合結果とCL第3節の試合前の話が中心です。日本人は10件、続いて欧州の大きい話を20件（弱い印は13件）。
note: "今日は火曜（20日）。昨夜（19日）の試合結果が一覧の中心です：トッテナム3-1コヴェントリー（坂元が初先発）、トリノ3-0パルマ、ラージョ1-1ヘタフェ（カルバハルのデビュー）。今夜はCL第3節（PSG対バルサほか）で、試合前の発言や負傷の話も入れました。
<br><br>持ち越し（一覧には入れていません）：前田大然（現地紙の評価）は 10/20 9:30 に予約済み、上田綺世（ブレスト戦の結果）は書き出し済みで未予約です。どちらも昨日の題材です。
<br><br>日本人は10件に届きましたが、新しい出来事は坂元（初先発）と三笘（復帰の見通し）の2件だけです。ほかの8件（遠藤・佐藤龍之介・冨安・久保・中村敬斗・田中碧・宇野・鈴木唯人）は、出典が転載1本か、10/16〜19に出した選手の続報なので弱い印を付けました。J1・J2・高校・大学、福田師王・塩貝健人（独2部）、小久保玲央・新川志音（ベルギー）は欧州7リーグの外なので除外しています。
<br><br><b>日本人本人の言葉が取れたのは0件</b>です。坂元はランパード監督（10/19 に出済み）、三笘はヒュルツェラー監督、中村敬斗はニアカテ、久保はマタラッツォ監督と現地紙の言葉で、本人の言葉は無し。外国人では、ルイス・エンリケ、ヴィティーニャ、トッティ、フェラッシ、サージュ（パレス）の本人の言葉が取れています。
<br><br>ロマーノなど移籍記者のXは読めませんでした。移籍・処分の話は、媒体の報道（デイリー・メール＝シティの降格見込み、スカイ・イタリア＝デ・ブルイネ）として入れ、クラブ・リーグの発表が無いものは本文に書きました。
<br><br>写真の見立て（各題材の最後に書きました）はウィキメディア・コモンズの検索の目安です（ファイル名に姓を含む画像の数。本人かどうかは取り込むときに目で確かめます）。坂元・中村敬斗・宇野・佐藤龍之介・カレツァスは数が足りず、クラブ公式やリーグ公式を当たる必要があります。代理店の配信は使いません。
<br><br>取得で読めなかった点：ESPN（アクセス拒否）、AS（カルバハルの記事、403）、kicker（403）、ロマーノ等のX、スカイのライブブログ（デ・ゼルビの『ファンのためにやった』は見出しのみ）。ASのカルバハルの記事とESPNのヘンダーソン（チェルシー）は見出ししか読めず、一覧から外すか弱い印にしました。"
