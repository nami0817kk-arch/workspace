  slot: プレミア
  head: マンC、セメニョが約8週間の離脱。マレスカ『今は回復することが一番重要だ』
  why: "ゲキサカ・サッカーキング（19日）。プレミア開幕7連勝のマンCで、FWセメニョが約8週間（スカイの見出しは『最長8週間』とマレスカが明かした）の離脱。ゲキサカの見出しにマレスカの『今は回復することが一番重要だ』。ESPNの見出しは『ハーランドへの打撃にクラブは望みを残す』と書くが本文は読めていない。独の見出しは『ハーランドに休みを与えるはずだった、いま長期離脱』。**クラブの発表は監督の会見まで**。10/18 にマレスカとハーランドの負傷（足を引きずる）を出している（別の話）。**写真：取れそう**（セメニョ約18枚、マレスカ約9枚）。"
  src: ゲキサカ／サッカーキング／スカイスポーツ（見出し）
