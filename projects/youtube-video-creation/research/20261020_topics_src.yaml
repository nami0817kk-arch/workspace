  head: スカイ・イタリアのウゴリーニ記者『デ・ブルイネは、ナポリ入りを正しい選択だと考える人の姿勢に欠ける』。1月にも整理を
  why: "フットボール・イタリア（イル・ナポリスタ経由）。『PKを外した点を別にしても、少なくともナポリに来たのが正しい選択だったと思う人の姿勢を持っていないように見える』『1月にも急いで整理を』『実力のある選手を半分の力で置いておくのは意味がない』。デ・ブルイネは土曜のヴェネツィア戦（0-1）で途中出場しPKを止められ、先週のCLビジャレアル戦（1-3）ではアレグリ監督と衝突したと記事は書く。**ウゴリーニ記者個人の意見で、クラブの動きは無い**。デ・ブルイネ本人の言葉は無い。**ナポリは 10/17・10/19 の一覧に載せている**ので続報の扱い。**写真：取れそう**（コモンズに約33枚）。"
