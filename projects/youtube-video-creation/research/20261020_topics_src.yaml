  head: パレスのサージュ監督、『時間をもらえるか』に『分からない』。解任の瀬戸際か
  why: "スカイ（19日）。クラブに今すぐ監督を代える予定は無いが、5-0でブライトンに敗れたあと、サージュは時間を与えられるかと問われて『分からない』と答え、全面的な支持の保証はできなかった。パレスは7試合で勝ち点7の14位、サージュは10試合で4勝（全大会）。会長パリッシュは移行期に『高い警戒』と述べている。元リヨン・ランスの47歳。**クラブの発表は無く、サージュ本人の言葉あり**。**10/19 に鎌田（パレス0-5ブライトン）を出している**ので続報の扱い。**写真：要確認**（コモンズの検索は別人が混ざる）。"
