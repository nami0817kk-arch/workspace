  slot: プレミア
  head: シティは2部降格か。デイリー・メール記者の見立て『重い罰金に加え、来季2部に落ちる規模の勝ち点剥奪』
  why: "A Bola・フット・メルカト・ASが、デイリー・メールのオリヴァー・ホルト記者の記事を引いた。『最も可能性が高いのは重い罰金に加え、来季は2部に落ちる規模の勝ち点剥奪』『さらなる勝ち点剥奪で、少なくともあと1シーズンはチャンピオンシップ』『自動的に4部へ落とす処分は想定しにくい』。プレミア側は、クラブが出した控訴の結果より前に処分を発表したい意向、とも。**処分はまだ発表されていない。匿名の情報源にもとづく1人の記者の見立てで、確度は未確認**。違反の件数はA Bolaが115、フット・メルカトが114と食い違う（数字は使わない）。**10/17（財政）・10/18（違反の試算）にシティを出している**ので続報の扱い。**写真：取れそう**（スタジアム・選手で足りる）。"
  src: A Bola／フット・メルカト／AS（デイリー・メール引用）
  url: https://www.abola.pt/noticias/avancam-em-inglaterra-manchester-city-vai-descer-de-divisao-2026101914140738880
  fmt: news
  weak: true
- num: 15
  slot: リーグ・アン
  head: PSG対バルサを前に、ルイス・エンリケ『ヤマルを止める一番の方法はボールを持つこと』
  why: "フット・メルカト（19日の会見）。『ヤマルを守る最良の方法はボールを持つこと。持っていれば彼は持てない。だから静かで穏やか』『バルサに今季初めて勝つチームになりたい』『ボールを自分から渡した試合は一度もない。この相手に勝ちたいなら、ボールを持たなければならない』。ヤマルは今季11試合で9得点10アシスト（同記事）。20日（火）のCL第3節、PSGはヌーノ・メンデスを欠く（10/19 の一覧に出した）。**ルイス・エンリケ本人の言葉あり**。**写真：取れそう**（ルイス・エンリケ約41枚、ヤマルは数が出ず要確認）。"
  src: フット・メルカト
  url: https://www.footmercato.net/a7275849256022169316-psg-luis-enrique-a-un-plan-pour-neutraliser-lamine-yamal
  fmt: quote
  new: true
- num: 16
  slot: リーグ・アン
  head: ヴィティーニャ、ヤマルを『怖がってはいない』。ネヴェスとクヴァラツヘリアの不調に『誰にでも浮き沈みはある』
  why: "フット・メルカト・A Bola（19日の会見）。ヤマルについて『怖がっているとは言わない。世界最高の一人で、やっていることは信じられない。でも彼だけじゃなく、まず大きなチームと戦う』。ネヴェスとクヴァラツヘリアについて『浮き沈みはある。試合に出ないとすぐ話が始まる。普通のこと、競争だ』。A Bola は、ネヴェスの出番減の報道への答えだと書く。**ヴィティーニャ本人の言葉あり**。10/17 にヴィティーニャとペドリの比較を出している（別の話）。**同じ試合がルイス・エンリケ（15番）と重なる**。**写真：取れそう**（ヴィティーニャ約18枚）。"
  src: フット・メルカト／A Bola
