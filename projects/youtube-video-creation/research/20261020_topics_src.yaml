  slot: セリエA
  head: トリノがパルマに3-0。シメオネが2得点、アバテ監督『ジョバンニは静かなリーダー』
  why: "ガゼッタ（19日）。アバテ監督『30分は高いレベルだった。後半の入りは苦しんだが、終盤は秩序よく守れた』『ジョバンニは静かなリーダー。頭を下げて働き、仲間に手本を示す。ようやく、広場が求めていたゴールが出た』。キッカーの見出しは『シメオネが距離弾で走りを締めくくる』『0-2はアダムス（24分）』。シメオネは2得点（ガゼッタの『二つの署名』）、ほかの得点の時間は取得できていない。**本人の言葉は無い**（監督の言葉）。**写真：厳しい寄り**（コモンズのシメオネは父ディエゴとの混在で、ジョバンニ本人は要確認）。"
  src: ガゼッタ／キッカー（見出しのみ）
  url: https://www.gazzetta.it/Calcio/Serie-A/Torino/19-10-2026/abate-dopo-parma-torino-spirito-da-toro-e-simeone-e-un-leader.shtml
