  slot: ブンデス
  head: ノイアーが全体練習に復帰、水曜のCLアーセナル戦に出られる可能性。足の負傷で2試合欠場
  why: "スカイ・ドイツの報道をサッカーキングが紹介（19日）。10日のアウクスブルク戦に出たあと、CLバイキング戦（13日）はベンチ、ライプツィヒ戦（17日）はメンバー外だった。足を負傷していたが19日のチーム練習に参加し、21日のCL第3節アーセナル戦でゴールを守る可能性が高まった。最終判断は試合直前のコンディション次第。バイキング戦は3-3の引き分け。40歳。**クラブの発表は無く、出場はスカイ・ドイツの見立て**。**写真：取れそう**（コモンズに約47枚）。"
  src: サッカーキング（スカイ・ドイツ紹介）
  url: https://www.soccer-king.jp/news/world/cl/20261019/2218619.html
  fmt: news
