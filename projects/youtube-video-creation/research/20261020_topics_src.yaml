  head: カルバハル、ヘタフェでデビュー。ラージョと1-1の引き分け
  why: "ASの見出し『カルバハルが引き分けでデビュー』と、キッカーの見出し『ヘタフェ対ラージョ：56分サトリアーノで1-1』だけが材料。**AS本文（403）は読めておらず、出場時間も内容も未確認**。サッカーキング（19日）によれば、カルバハルは昨季限りでレアルを退団してヘタフェ入りを発表済み。**ヘタフェを 10/16（サンチョ）・10/19（ラモス）に出している**ので、別の話でも3日連続になる。**写真：取れそう**（コモンズに約10枚）。"
