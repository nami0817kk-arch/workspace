  head: 鈴木唯人にトッテナムが関心か。移籍金は4,000万〜4,500万ユーロを求める報道
  why: "フットボールトライブ（19日）が、英『CaughtOffside』を引用。フライブルクが4,000万〜4,500万ユーロ（約71〜80億円）を求めている、と報じた。ミランも意欲、レアル・ソシエダも動向を注視、複数クラブのスカウトが今季の鈴木を視察したという。**クラブの発表は無く、確度は報道どまり**。出典は転載1本。**本人の言葉は無い**。**10/19 の一覧に鈴木唯人の移籍（3クラブ関心）を載せている**ので続報の扱い。**写真：ぎりぎり取れそう**（コモンズに約4枚）。"
