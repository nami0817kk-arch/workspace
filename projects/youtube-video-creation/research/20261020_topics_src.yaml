  slot: ラ・リーガ
  head: エンバペ、オンズドール初受賞。ファン投票48.2%でネヴェスに大差、バロンドール授賞式まであと数日
  why: "サッカーキング（19日）。仏誌『オンズ・モンディアル』が1976年から主宰する賞で、世界中のファン投票だけで決まる。エンバペ48.2％、2位ネヴェス11.9％、3位クヴァラツヘリア10.8％、ヤマル9.7％、ケイン4.4％、オリーズ2.9％。昨年はこの前哨戦を制したデンベレが、最終的にバロンドールも取った（同記事）。授賞式の司会はアンリとケイト・スコット（フット・メルカトの見出し）。**エンバペ本人の言葉は、この記事には無い**。10/19 にレアル対セビージャ（エンバペ2得点）を出しているが別の話。**写真：取れそう**（コモンズに約27枚）。"
  src: サッカーキング
  url: https://www.soccer-king.jp/news/world/esp/20261019/2218592.html
