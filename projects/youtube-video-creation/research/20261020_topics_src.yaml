  slot: セリエA
  head: ローマのディバラ、小さな断裂で復帰は11月か。ガスペリーニ『あと数週間かかる』
  why: "フットボール・イタリア（カルチョメルカート・コムを引用）。ディバラはレアル戦で疲れを訴えて前半で交代、検査で小さな断裂が分かった。ガスペリーニ監督は月曜に『回復にはあと数週間かかる』と話した。カルチョメルカートの見立ては、火曜のCLスロヴァン戦、土曜のナポリ戦、カリアリ戦、ウディネーゼ戦を欠場。11月3日のCLマンU戦と7日のサッスオーロ戦での復帰を期待、21日のパルマ戦が現実的、というもの。ディバラは32歳で今季はリーグ・CLの全試合に先発、セリエAで4アシスト。コネ、クリスタンテ、スヴィラルも離脱中。**欠場の日程はカルチョメルカートの見立てで、クラブの発表は無い**。**写真：取れそう**（コモンズに約18枚）。"
  src: フットボール・イタリア（カルチョメルカート引用）
  url: https://football-italia.net/what-games-will-dybala-miss-as-roma-crisis/
  fmt: news
