  head: パリFCのフェラッシ会長、退任を発表。2012年から務め、後任はアントワヌ・アルノー
  why: "フット・メルカト。月曜の夜、クラブのパートナー向けの会で本人が発表した。74歳、名誉会長に。取締役会は11月9日、最後の試合は11月1日のモナコ戦。当初はシーズン終了時の予定だった。『手を渡すのにちょうどいい時期。アントワヌ・アルノーは準備ができている』。パリFCは昨季（2025-26）にリーグ・アン昇格。**本人の言葉あり、クラブの発表**。**写真：要確認**（姓が一般的で、コモンズの検索では別人が混ざる）。"
  src: フット・メルカト
