  head: 田中碧に『謎』の評価。リーズ地元紙の採点、ファルケ監督を苛立たせた場面
  why: "フットボールトライブ（19日）。英『Leeds Live』のマンU戦（1-1）採点記事の題は『カルバート＝ルーウィンの節目のゴールと田中碧の謎』。『ボールを奪い返す良いプレーもあったが、パスの精度は必ずしも安定していなかった。前半にはグドムンドソンを裏へ走らせるチャンスがあったが、パスを選ばず、ファルケ監督を苛立たせた』『悪くないシュートも何本か放った一方で、非常に雑なプレーも散見された』。**田中本人の言葉は無い**。**10/17・10/18・10/19 に田中を3回出している**ので続報の扱い。**写真：取れそう**（コモンズに約9枚）。"
