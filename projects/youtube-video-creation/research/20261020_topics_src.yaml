  why: "スカイ（19日）。12/6（日）16:30（英国時間）に王者アーセナルがトッテナムを訪れるノースロンドン・ダービー、12/12（土）17:30にマンC対チェルシー、12/20（日）16:30にアーセナル対マンU。12/2（水）にはニューカッスル対マンU、ブレントフォード対アーセナルなど。**リーグの日程の発表で、確度は確定**。人の言葉は無い。**写真：スタジアムで足りる**（人物の写真は要らない）。"
