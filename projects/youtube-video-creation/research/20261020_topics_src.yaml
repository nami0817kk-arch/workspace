  slot: 日本人
  head: 三笘薫、復帰は『あと数週間』。ブライトン監督が11月の代表ウィーク前を示す
  why: "フットボールトライブ（19日）。ブライトンの公式サイト（18日）によると、ヒュルツェラー監督はパレス戦の前に『ミトマは代表ウィークまでに復帰してくれることを願っている。あと数週間で復帰する見込みだ。もう少し辛抱する必要がある』と話した。具体的な日付は言っていない。三笘は昨季終盤のハムストリング手術でW杯を欠場、今季は開幕から出遅れ、18日のパレス戦（5-0）も欠場。日本代表は11月中旬にブラジル、パラグアイと対戦する。**三笘本人の言葉は無い**（監督の言葉）。10/17 に三笘（リバプールなど3クラブの関心）を出しているが、今回は復帰の見通しで別の話。**写真：取れそう**（コモンズに約17枚）。"
  src: フットボールトライブ（ブライトン公式サイトの引用）
