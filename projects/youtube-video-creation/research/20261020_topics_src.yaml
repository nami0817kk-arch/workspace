  slot: 日本人
  head: 坂元達裕、プレミア初先発で78分まで。コヴェントリーはトッテナムに1-3、連勝止まる
  why: "19日のプレミア第7節、トッテナム3-1コヴェントリー。坂元はリーグ戦では今季初めての先発で、4-2-3-1の右サイドハーフ、守備では最終ラインまで落ちて走った（ゲキサカ）。前半8分に右からカットインして左足でクロス、10分にファンエバイクとのワンツーから左足シュート（ファン・ヘッケにブロックされた）。後半33分（78分）まで出場。得点はマディソン（14分）、ルドーニ（49分、コヴェントリー）、マルムーシュ（58分）、デイヴィス（90+6分）。次節は24日、ホームでフルアム戦。**坂元本人の言葉は無い**（ランパード監督の言葉は 10/19 に出した試合前の話で、今回は試合の結果）。**写真：厳しい**（コモンズは坂元の写真が0枚。クラブ公式を当たる）。"
  src: ゲキサカ／サッカーキング
  url: https://web.gekisaka.jp/news/world/detail/?461402-461402-fl
  fmt: news
  new: true
