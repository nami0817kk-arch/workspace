  head: 遠藤航、今季リバプールは10試合で出番ゼロ。ソボスライの負傷で出番の可能性と英メディア
  why: "フットボールトライブ（19日）が、英『Anfield Index』を引用。18日のブレントフォード戦（2-1の逆転勝ち）でソボスライが負傷交代し、中盤の起用が課題になっている。記事は『今季ここまで10試合を戦って、遠藤はいずれにも出場していない』『戦力外と決めつけるのは早計』『直近の出場は2月のサンダーランド戦（1-0）で、右サイドバックだった』と書く。33歳。**クラブの発表やイラオラ監督の言葉は無く、英メディア1本の見方**。**遠藤本人の言葉は無い**。出典は転載1本。**写真：取れそう**（コモンズに約7枚）。"
