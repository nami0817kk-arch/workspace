  head: 久保建英、現地紙が『約10カ月ぶりのゴールはこの試合最大の収穫』。『昇る太陽のように』
  why: "サッカーキング（19日）。アスは『ナイトメア・クボ』『さあ、侍が帰ってきたぞ！』、エル・デスマルケは評価点9でオヤルサバルとトップタイ、ムンド・デポルティーボは『ラ・レアルの右サイドがこれほど輝いたのは本当に久しぶり』『昇る太陽のように道を照らす』。2025年12月以来302日ぶりのゴール。マタラッツォ監督は『彼の試合に対する姿勢、集中力と覚悟の重さにとても満足している』（マルカ）。次戦は22日のEL第3節リールストロム戦。**久保本人の言葉は、これらの記事には無い**。**10/19 に久保の1ゴール1アシストを出している**ので続報の扱い。**写真：取れそう**（コモンズに約5枚）。"
