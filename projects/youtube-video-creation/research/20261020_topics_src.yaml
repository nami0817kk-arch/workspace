  slot: ブンデス
  head: ドルトムントの18歳カレツァス、足首のじん帯を痛めバクー遠征とフランクフルト戦を欠場
  why: "クラブ公式サイトをサッカーキングが紹介（19日）。17日のウニオン戦（0-0）で61分に出場し、67分に右足首をひねって交代。リッケンMDは『足のじん帯を負傷した。バクー遠征には同行せず、土曜のフランクフルト戦も欠場する』。今夏ゲンクから完全移籍、公式戦9試合1アシスト。10月末までに4試合が控える。**クラブの発表あり**。本人の言葉は無い。**写真：厳しい**（コモンズにカレツァスの写真は0枚。ドルトムント公式を当たる）。"
  src: サッカーキング（ドルトムント公式サイト紹介）
  url: https://www.soccer-king.jp/news/world/ger/20261019/2218604.html
  fmt: news
