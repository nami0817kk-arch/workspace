  head: AZのキース・スミット、2030年6月まで契約延長。夏の終わりにレアルなどが関心と言われていた
  why: "AS・vi.nl（19・20日）。移籍市場の終盤に出る寸前だったが残留し、契約を延長。ASは『レアル・マドリードが常に有力と噂された』『9月に市場が閉まったあと、AZから出なかったことが不思議だと本人が話した』と書く。今季はAZで8試合2アシスト、ケガで5試合欠場。トランスフェルマルクトの市場価値は約2,500万ユーロ（AS）。AZ公式のSNS投稿も引用。vi.nl の見出しは『AZは契約延長を誇りに思う』。**クラブ発表あり**。本人の言葉は、読めた範囲では無い（過去の発言をASが要約）。**写真：要確認**（コモンズの検索は姓が一般的で本人を絞れない）。"
  src: AS／vi.nl（見出し）
