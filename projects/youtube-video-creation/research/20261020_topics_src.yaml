  head: トッティ『ローマとの別れは、ある意味で死のようだった』。自伝『Oltre』の発表で、ガスペリーニへの本音も
  why: "ガゼッタ・フットボール・イタリア（19日、スカイ・スポーツ・イタリアなどの取材を引用）。ローマのブランカッチョ劇場での発表会。『ある意味で、僕は死んだ。強いられた別れで、望んでいなかった』『ガスペリーニの下でやりたかった。ゼーマンの後なら、僕は何でもできる』。会場にはサプライズでガスペリーニが中継で登場（ガゼッタの見出し）。トッティは先月50歳。**本人の言葉あり**。引退後の私生活や家族の話（ガゼッタ本文にある）は、決まりにより入れない。**写真：取れそう**（コモンズに約45枚）。"
  src: ガゼッタ／フットボール・イタリア
