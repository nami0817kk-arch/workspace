  head: 中村敬斗、一発退場のあとニアカテ『君のために頑張る』。リヨンは勝って首位に
  why: "ゲキサカ。18日のリーグアン第7節、リヨン2-1。中村は後半16分から出場、25分に足裏が相手DFの腹部に入って一発退場（中村のレッドは2019年9月以来）。試合後、チームメイトがロッカーで待つ中村を呼び、サポーターと勝利を喜ぶ場に迎えた。DFニアカテは『敬斗は謝ってきた。僕は謝らなくていい、僕たちは君のために頑張ると言った』『僕たちは一つのチーム』（クラブ公式サイトなど）。監督も一体感を称えた。**中村本人の言葉は無い**（ニアカテの言葉）。**10/19 に中村の一発退場を出している**ので続報の扱い。**写真：厳しい**（コモンズに中村敬斗の写真は0〜1枚。リヨン公式／ligue1.com を当たる）。"
