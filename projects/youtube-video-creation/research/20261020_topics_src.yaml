  slot: プレミア
  head: イラオラ、ビジャレアル戦は『私にとって特別な試合』。相手監督は元アシスタント
  why: "サッカーキング（リヴァプール・エコーの紹介、19日）。ビジャレアルのイニゴ・ペレス監督（38）は2022年にラージョのイラオラ監督のもとで1年間アシスタントを務めた。『多くのことをともに経験してきたので、光栄です』『彼をイングランドに連れて行こうとしたが、就労ビザでうまくいかなかった』『試合が近づくと話さなくなる』。リヴァプールはCL2連勝（アトレティコ2-1、LASK6-3）で、キックオフは日本時間21日4時。18日のブレントフォード戦（2-1）でソボスライが負傷交代した（フットボールトライブ）。**イラオラ本人の言葉あり**。**写真：取れそう**（イラオラ約10枚、ソボスライ約22枚）。"
  src: サッカーキング（リヴァプール・エコー紹介）
