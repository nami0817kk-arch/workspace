  slot: プレミア
  head: トッテナム、今季プレミア初勝利。ミドル3発でコヴェントリーに3-1、マディソンは536日ぶりの先発で先制
  why: "19日のプレミア第7節（スカイ、ゲキサカ）。14分マディソン（ゴール左隅へのミドル。536日ぶりの公式戦先発で、ゴールも536日ぶり）、49分ルドーニ（コヴェントリー）、58分マルムーシュ、90+6分デイヴィス。開幕6試合未勝利で最下位だったが16位に上がった。スカイはマディソンを、デ・ゼルビの『3億ポンド級』の補強をつないだ存在と書く。次節は24日、アウェイでチェルシー戦。10/18・10/19 にトッテナム（補強・携帯禁止）を出しているが、今回は試合の結果。**同じ試合が日本人の1番（坂元）**。**写真：取れそう**（マディソン・マルムーシュ各約7枚）。"
  src: スカイスポーツ／ゲキサカ／サッカーキング
  url: https://www.skysports.com/football/tottenham-hotspur-vs-coventry-city/report/559513
  fmt: news
  new: true
- num: 12
  slot: プレミア
  head: クルゼフスキ、526日ぶりに復帰。妻の手紙『もう二度とプレーできないかもしれないと言われた』
  why: "スカイ（19日）：トッテナム3-1の試合で、クルゼフスキが526日の離脱を経て復帰。デイリー・メール（10/7、19日更新）：昨季のパレス戦（ポステコグルー時代の終わり）で膝を痛め、9月1日に全体練習へ戻った日、妻エルディナがスウェーデン語の手紙をSNSに出した。『もう二度とプレーできないかもしれないと言われた』『彼らは、あなたが誰なのか分かっていない』。デ・ゼルビの『ファンのためにやった』（交代について）は、スカイのライブブログの見出しだけで本文は読めていない。**クルゼフスキ本人の言葉は、取得できた記事には無い**（妻の手紙）。デイリー・メールは単独だと未確認までだが、スカイの復帰の事実と合わせて報道。**写真：取れそう**（コモンズに約7枚）。"
  src: スカイスポーツ／デイリー・メール
  url: https://www.dailymail.com/sport/football/article-16189335/Dejan-Kulusevski-injury-return-513-days-hell-Tottenham.html
  fmt: quote
  new: true
