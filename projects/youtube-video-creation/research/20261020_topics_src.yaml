  head: ユーベ、スパレッティへの信頼は『期限つき』とガゼッタ。ファン投票で66％がコンテ復帰を望むと報じられる
  why: "ガゼッタ（20日付）：ラツィオに0-3で負けたあと、クラブ首脳は続投の方針。『誰も監督に敵対していない』（首脳の確信）という一方、スパレッティは『ユーベを見失った』と自ら認めたとガゼッタは書く。フット・メルカトは、スポーツメディアセットの約14,000票の投票で66％がコンテの復帰を望むと報じた（非公式の投票）。**クラブの発表は無く、確度は報道**。フット・メルカトの記事はコンテを『現ナポリ監督』と書くが、ほかの記事ではナポリはアレグリ監督。クラブ名は使わない。**10/19 の一覧に、ラツィオ戦のブレーメルの言葉を載せている**ので続報の扱い。**写真：取れそう**（スパレッティ約12枚、コンテ約39枚）。"
  src: ガゼッタ／フット・メルカト
