  - text: 釜本邦茂は早稲田大学で、関東大学リーグの得点王に、4年続けてなりました。
    image: assets/images/20261127_kamamoto_kunishige_legend/01_r.jpg
    card: none
  - text: 1964年、東京オリンピックに出ます。日本はベスト8でした。
    card: {<<: *roadcard, highlight_row: 0}
  - text: 1967年、ヤンマーに入ります。日本リーグの1年目は、14試合で14点。
    card: {<<: *roadcard, highlight_row: 1}
  - text: 1試合に1点のペースです。
    card: {<<: *roadcard, highlight_row: 1}
    emph: true
  - text: 同じ年の9月、オリンピックのアジア予選。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *roadcard, highlight_row: 2}
  - text: フィリピン戦で、1人で6点を取りました。試合は15対0の勝ちです。
    image: assets/images/20261127_kamamoto_kunishige_legend/01_r.jpg
    card: {<<: *roadcard, highlight_row: 2}
    emph: true
  - text: 日本は予選を抜け、1968年、メキシコへ向かいます。
    card: {<<: *roadcard, highlight_row: 3}
