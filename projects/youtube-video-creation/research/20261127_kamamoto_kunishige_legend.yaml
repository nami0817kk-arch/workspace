# 釜本邦茂（元日本代表 FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-27。型は 11/25 の名波浩と同じ6節（「あの大会」＝1968年のメキシコ五輪、「見立て」＝1試合あたりの点）。
# **情報の時点は 2026-11-21。**いまの年齢は出さない。引退後の仕事（監督・議員）は言わない。私生活・女子サッカーは入れない。
# 題材を選んだ理由：引退した日本人の最大の大物。日本代表の国際Aマッチ75点は歴代最多（JFA 2025-08-10 の発表）。既出の国内レジェンド（scripts/*_legend.md 25人）・posted.json・covered.yaml・picks に無い。同じ日の別シリーズ（ケイン・ヤマル×ニコ・ドルトムントのスタジアム・謎「日本人選手はなぜドイツに多いのか」）にも主役で出ない。
# 引退と死去は一次情報で確認：JFA「釜本邦茂氏が逝去」（2025-08-10。2025年8月10日、肺炎で大阪府内の病院で死去。日本代表1964〜1977年、Aマッチ76試合75得点、メキシコ五輪7得点で得点王、JSL 251試合202得点・得点王7回）。現役の最後は1984年（引退試合 1984-08-25）。
# 数字の出どころ：日本語版 Wikipedia「釜本邦茂」（raw の wikitext を読んだ）、「1968年メキシコシティーオリンピックのサッカー競技」（試合表）、JFA の訃報。
# - JSL年別 試合-得点：67 14-14、68 14-14、69 12-10、70 14-16、71 14-11、72 14-11、73 16-9、74 18-21、75 17-17、76 18-15、77 18-20、78 18-15、79 18-7、80 18-10、81 18-11、82 8-1、83 2-0＝251試合202点（自分で足して一致）。
# - 日本代表：Aマッチ76試合75点（JFA 基準。Wikipedia は FIFA 基準 84試合80点・総通算231試合153点も併記。本文と表で 231/153 と 233/154 が食い違う。台本は JFA の76試合75点だけを使う）。
# - メキシコ五輪（1968）：10/14 ナイジェリア 3-1（釜本 24・72・89分）、10/16 ブラジル 1-1（渡辺正）、10/18 スペイン 0-0、10/20 準々決勝 フランス 3-1（釜本 27・59分、渡辺 70分）、10/22 準決勝 ハンガリー 0-5、10/24 3位決定戦 メキシコ 2-0（釜本 20・40分）。日本の9点のうち7点（約78%）。7点のうち4点は杉山隆一のアシスト（Wikipedia 本文）。
# - 1967-09-27 五輪予選のフィリピン戦 15-0 で釜本6点（Wikipedia）。
# - 肝炎：Wikipedia は「1969年6月16日、代表合宿中に倒れウイルス性肝炎で入院、10月の予選は欠場」と「1970年にウイルス性肝炎」の2か所で食い違う。年別のAマッチ表は1969年が0試合なので、台本は1969年で書いた。
# - 1981-11-01 本田技研戦で通算200・201点。1982-05-20 右足首アキレス腱断裂、1983-11-03 に復帰。1984-08-25 国立で引退試合（ペレ・オヴェラートが出場、釜本は前半15分に得点）。
# - 本人の言葉：Number Web（二宮寿朗、2025-08-13）の生前のインタビュー。ナイジェリア戦の1点目のあとについて「楽にシュートを打てば、全部入るっていう感覚になりましたよ」。
# 写真：Number Web の記事の写真（引退試合。©Makoto Kemmisaki）。代理店ではない。
