  say:
  - text: 釜本邦茂の生まれは1944年、京都市。ポジションは、点を取るフォワードです。
    card: {<<: *datacard, highlight_row: 1}
  - text: 早稲田大学から、1967年にヤンマーへ入りました。
    card: {<<: *datacard, highlight_row: 2}
  - text: 日本リーグの得点王には、7回なっています。
    card: {<<: *datacard, highlight_row: 3}
  - text: 日本代表では、1964年から1977年まで戦いました。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *datacard, highlight_row: 4}
  - text: そして、1968年のメキシコ五輪で得点王になります。
    image: assets/images/20261127_kamamoto_kunishige_legend/01_r.jpg
    card: {<<: *datacard, highlight_row: 5}
