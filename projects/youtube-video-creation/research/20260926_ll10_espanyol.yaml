- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 元バス運転手の監督と、無敗で逃した頂点
  narrator: キャスター
  say:
  - text: 率いるのは、元市バスの運転手のマノロ・ゴンサレス監督。9月の敗戦のあと、こう話しました。
    image: assets/stats/ll_espanyol_data_r1.png
    no_telop: true
  - voice: マノロ・ゴンサレス
    text: すぐにでも頭を切り替えないといけない。責任は私にある
    image: assets/stats/ll_espanyol_data_r1.png
  - text: 今季は7試合で**2勝**。昨シーズンは**5連勝**で年を越し、欧州を狙える順位にいました。
    image: assets/stats/ll_espanyol_data_r2.png
    no_telop: true
  - text: そしてこのクラブは、一つの大会を無敗で戦い抜きながら、欧州の頂点を逃しています。
    image: assets/stats/ll_espanyol_data_r3.png
    no_telop: true
  - image: assets/stats/ll_espanyol_data0.png
    text: 創立は**1900年**。スペインで今も続くクラブの中で、**5番目**に古いクラブです。
    no_telop: true
  - image: assets/stats/ll_espanyol_data1.png
    text: 愛称は「ペリキートス」、インコのこと。始まりは、ネコのフィリックスでした。
    no_telop: true
  - image: assets/stats/ll_espanyol_data2.png
    text: ホームタウンはコルネリャ。バルセロナの南西にある、人口**9万**ほどの町です。
    no_telop: true
  - image: assets/backgrounds/stadium_エスパニョール.png
    text: 本拠地は、コルネリャ・エル・プラットのスタジアム。クラブの発表では、**4万人**が入ります。
  - image: assets/stats/ll_espanyol_data4.png
    text: オーナーは**2025年**から、アメリカのアラン・ペイスの投資会社。バーンリーも持っています。
    no_telop: true
  - image: assets/stats/ll_espanyol_cups.png
    text: 1部の優勝は**0回**。国王杯は**4回**。スーペルコパとヨーロッパは、まだありません。
    no_telop: true
  - image: assets/stats/ll_espanyol_data6.png
    text: 最多出場はフォワードのラウール・タムード。このクラブで**389試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_espanyol_data7.png
    text: 直近のタイトルは**2006年**の国王杯。決勝でサラゴサを**4対1**で破りました。
    no_telop: true
  - image: assets/stats/ll_espanyol_data8.png
    text: 昨季のリーグ戦は**11位**。勝ち点は**46**でした。
    no_telop: true
