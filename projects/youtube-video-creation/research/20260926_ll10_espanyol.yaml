- id: history
  heading: 名前は「スペインの」
  tier: 背景
  telop: 締め出された選手のために生まれた
  narrator: 解説
  card:
    type: table
    title: 名前は「スペインの」
    columns:
    - ''
    - ''
    rows:
    - - 1900年
