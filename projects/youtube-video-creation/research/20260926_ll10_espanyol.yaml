  say:
  - 2007年、ふたたびウエファカップの決勝へ。ここまで負けなしで勝ち上がりました。
  - 相手は同じスペインのセビージャ。**68分**に1人が退場します。
  - text: 10人のまま延長の終盤に追いつき、**2対2**の引き分け。ピーケー戦で敗れました。
    card:
      type: table
      title: 2007年 ウエファカップ決勝
      columns: *id002
      rows:
      - - 大会を通して
        - 無敗。ピーケー戦で準優勝
  - 無敗で優勝を逃したのは、この大会の歴史でこのクラブだけです。
  sources:
