- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 元バス運転手の監督と、無敗で逃した頂点
  narrator: キャスター
  say:
  - text: エスパニョールは、バルセロナで生まれたもう1つのラ・リーガのクラブ。
    image: assets/stats/ll_espanyol_data_r1.png
    no_telop: true
  - text: 監督は元市バスの運転手、マノロ・ゴンサレス。9月の敗戦後にこう話しました。
    image: assets/stats/ll_espanyol_data_r1.png
    no_telop: true
  - voice: マノロ・ゴンサレス
    text: すぐにでも頭を切り替えないといけない。責任は私にある
    image: assets/stats/ll_espanyol_data_r1.png
  - text: 昨シーズンは**5連勝**で年を越し、欧州を狙える順位にいました。
    image: assets/stats/ll_espanyol_data_r2.png
    no_telop: true
  - text: ところが年明けから、リーグ戦で**18試合**勝てず。**11位**まで落ちました。
    image: assets/stats/ll_espanyol_data_r2.png
    no_telop: true
  - text: 今季も、ここまで7試合で**2勝**です。
    image: assets/stats/ll_espanyol_data_r2.png
    no_telop: true
  - text: そして2007年、ウエファカップ。いまのヨーロッパリーグの前の大会です。
    image: assets/stats/ll_espanyol_data_r3.png
    no_telop: true
  - text: 一度も負けずに決勝へ。それでもピーケー戦で、欧州の頂点を逃します。
    image: assets/stats/ll_espanyol_data_r3.png
    no_telop: true
  - image: assets/stats/ll_espanyol_data0.png
    text: 創立は**1900年**。スペインで今も続くクラブの中で、**5番目**に古いクラブです。
    no_telop: true
  - image: assets/stats/ll_espanyol_data1.png
    text: 愛称は「ペリキートス」、インコのこと。もとは、からかいの言葉です。
    no_telop: true
  - image: assets/stats/ll_espanyol_cups.png
    text: 1部の優勝は**0回**。国王杯は**4回**。ヨーロッパのタイトルも、まだありません。
    no_telop: true
  - image: assets/stats/ll_espanyol_cups.png
    text: 1部を**89シーズン**戦ってきました。優勝の無いクラブでは、最も多い数です。
    no_telop: true
  sources:
