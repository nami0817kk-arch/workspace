  - その19年前、同じウエファカップの決勝。1988年、相手はレバークーゼンです。
  - ホームの1戦目は**3対0**。優勝に手がかかりました。
  - text: ところが敵地の2戦目で、そっくり追いつかれます。
    card:
      type: table
      title: 1988年 ウエファカップ決勝
      columns: *id001
      rows:
      - - 2戦目 敵地
        - 0対3。ピーケー戦で敗れる
  - 最後はピーケー戦。**2対3**の負けで、初めての頂点を逃しました。
  sources:
  - https://en.wikipedia.org/wiki/1988_UEFA_Cup_final
  bg: assets/backgrounds/stadium_エスパニョール_in.png
  official: false
- id: history3
  heading: 負けないまま
  tier: 背景
  telop: 2007年、大会で一度も負けずに準優勝
  narrator: 解説
  card:
