# 2026-10-08 流れの点検（output/flow/20260926_ll10_espanyol.md）と、2026-10-06 の「シリーズの回の質」⑩を反映。
#   **基礎DATAの読み上げを13行 → 4行**（創立・愛称・タイトル歴・1部89シーズン）。残り9項目は板だけに出す
#   （オープニングの3行が一覧板 ll_espanyol_data_t.png を敷いているので、9項目は画面に出ている）。
#   落としたのは：愛称の由来の3行・ホームタウン・本拠地・オーナー・最多出場・直近タイトル・昨季の勝ち点。
#   ほかに直したもの：山場の節の頭に、ショート単体で分かる1行（主役の名前もここで出る）／
#   冒頭で2007年の決勝を見せたあとに1988年が来るので「その19年前」を足した／ウエファカップに一言の説明／
#   「エースの後継ぎ」が誰か分からないので「クラブ最多出場の後を継ぎました」に／
#   「1部に戻ったここへ」「セカンドチーム」「ペーニャはおよそ200」を分かる言い方に／
#   「今季の監督」が3度目の初紹介になっていたのをやめた／最後の行の勝ち点7は前の行から出るので昨季との比べに替えた。
#   直していないもの：見立ての節が無い（20クラブ共通の並びを崩すので手を付けない）／
#   数字の行が並ぶ2節に表が無い（どちらも板が表の役。板の上にカードは重ねない決まり）。
# プレミアリーグ20クラブ紹介 ⑩エスパニョール（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/espanyol*.json と旧台本 -
