  - 相手は同じスペインのセビージャ。**68分**に、エスパニョールの1人が退場します。
  - text: 10人のまま延長の終盤に追いつき、**2対2**。ピーケー戦で、杯はセビージャへ。
    card:
      type: table
      title: 2007年 ウエファカップ決勝
      columns: *id002
      rows:
