- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 走る。育てて売る。世界に応援団
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 走って圧をかける
    - - 運営の型
      - 育てて売る
    - - クラブの気質
      - 公認の応援団が約200
  say:
  - マノロ・ゴンサレス監督のチームは、走って、相手に圧をかける。本人の言う持ち味です。
  - ピッチの外は、育てて売る型。
  - 下部組織育ちのゴールキーパー、ジョアン・ガルシアは昨年、**2500万ユーロ**でバルセロナへ。
  - スタンドを支える公認の応援団、ペーニャはおよそ**200**。日本にもあります。
  sources:
  - https://en.wikipedia.org/wiki/RCD_Espanyol
  - https://www.rcdespanyol.com/es/noticia/tenemos-que-volver-a-competir-como-toca/20782
  - https://www.rcdespanyol.com/ca/noticia/joan-garcia-abona-la-seva-clausula-de-rescissio/18773
  - https://en.wikipedia.org/wiki/Joan_Garcia
  - https://es.wikipedia.org/wiki/Real_Club_Deportivo_Espanyol
  bg: assets/backgrounds/stadium_エスパニョール_in.png
  official: false
- id: episode
  heading: 21分の拍手
  tier: 背景
  telop: 毎試合21分、スタンドから1分間の拍手
  narrator: 解説
  card:
    type: table
    title: 21分の拍手
    columns:
    - ''
    - ''
    rows:
    - - 2009年8月
      - 主将ハルケが急死、26歳
    - - 毎試合21分
      - 背番号にちなんで1分間の拍手
    - - 2010年
      - 親友イニエスタが決勝で追悼
  say:
  - text: 2009年8月、主将のダニエル・ハルケが、心臓の発作で亡くなりました。**26歳**でした。
    image: assets/images/ll_espanyol_episode/scene.jpg
  - それから毎試合、背番号と同じ**21分**に、スタンドが1分間の拍手を送ります。
  - 翌年のワールドカップ決勝、親友イニエスタは決勝点のあと、彼の名前を胸に見せました。
  sources:
  - https://en.wikipedia.org/wiki/RCD_Espanyol
  - https://en.wikipedia.org/wiki/Daniel_Jarque
  bg: assets/backgrounds/stadium_エスパニョール_in.png
  official: false
