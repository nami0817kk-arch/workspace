- id: history
  heading: 名前は「スペインの」
  tier: 背景
  telop: 締め出された選手のために生まれた
  narrator: 解説
  card:
    type: table
    title: 名前は「スペインの」
    columns:
    - ''
    - ''
    rows:
    - - 1900年
      - 街のクラブは外国人が中心
    - - 新しいクラブ
      - スペインの選手の受け皿
    - - 名前の意味
      - 「スペインの」
  say:
  - 1900年のバルセロナ。サッカーのクラブは、外国人の選手が中心でした。
  - 締め出されたスペインの若者のために、大学生たちが新しいクラブを作ります。
  - 名前は「スペインの」という意味。今はカタルーニャ語のつづりです。
  sources:
  - https://es.wikipedia.org/wiki/Real_Club_Deportivo_Espanyol
  - https://en.wikipedia.org/wiki/RCD_Espanyol
  bg: assets/backgrounds/stadium_エスパニョール_in.png
  official: false
