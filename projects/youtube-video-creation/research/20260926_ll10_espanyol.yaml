  say:
  - 1997年、借金を返すため、長く使った本拠地サリアを売りました。
  - そこから**12シーズン**、バルセロナ五輪の競技場を借りて戦います。
  - 自前の家に戻ったのは2009年。その最初のシーズンには、中村俊輔もいました。
  sources:
  - https://es.wikipedia.org/wiki/Real_Club_Deportivo_Espanyol
  - https://en.wikipedia.org/wiki/RCD_Espanyol
