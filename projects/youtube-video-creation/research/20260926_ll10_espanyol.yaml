  say:
  - text: 2009年8月、主将のダニエル・ハルケが亡くなりました。
    image: assets/images/ll_espanyol_episode/scene.jpg
  - text: 心臓の発作。**26歳**でした。
    image: assets/images/ll_espanyol_episode/scene.jpg
  - それから毎試合、背番号と同じ**21分**に、スタンドが1分間の拍手を送ります。
  - text: 翌年のワールドカップ決勝。決勝点を決めたのは、親友のイニエスタでした。
    card:
      type: table
      title: 21分の拍手
      columns: *id006
      rows:
      - - 2010年
        - 親友イニエスタが決勝で追悼
  - その直後、彼はユニフォームを脱ぎます。
  - 下のシャツには「ダニ・ハルケはいつも一緒に」と書いてありました。
  sources:
  - https://en.wikipedia.org/wiki/RCD_Espanyol
  - https://en.wikipedia.org/wiki/Daniel_Jarque
