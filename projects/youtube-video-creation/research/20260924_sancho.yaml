    say:
      - かつて、ヨーロッパでいちばん期待されていた若手のひとりでした。
      - "**8500万ユーロ**でマンチェスター・ユナイテッドへ移った、ジェイドン・サンチョ。"
      - 6月に契約が切れてから3か月、いまも所属クラブがありません。
