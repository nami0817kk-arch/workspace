- id: rival
  heading: 宿敵
  tier: 背景
  telop: 決まった呼び名が無い。残るのは1977年の最終節
  narrator: 解説
  card:
    type: table
    title: 宿敵をめぐる記録
    columns:
    - ''
    - ''
    rows:
    - - サポーターが挙げる相手
      - アストン・ヴィラ（2020年の調査で83%）
    - - ダービーの呼び名
      - ヴィラ戦には無い
    - - 1976-77年の最終節
      - 引き分けで両者残留。事実上プレーが止まる
    - - M69ダービー
      - レスター戦。今季その相手はプレミアにいない
    - - 今季
      - ヴィラはプレミアリーグにいる
  say:
  - この街のクラブの宿敵には、**決まった呼び名がありません。**
  - 2020年の調査では、**83%**のサポーターがアストン・ヴィラを5大ライバルに挙げています。
  - ただ、いつ何があってそうなったのかは書かれていないのです。
  - そのヴィラは、今季もプレミアリーグにいます。
  - 年号つきで残っている出来事は、別の相手とのものでした。
  - 1976年から77年のシーズン最終節。相手はサンダーランドです。
  - 2対2の引き分けなら両方が残り、サンダーランドが落ちる。それが分かった時点で、こちらとブリストル・シティは事実上プレーをやめました。
  - ウルヴァーハンプトンとは、1960年代の終わりから70年代のはじめにかけて激しく争っています。
  - 1967年にそろって昇格し、のちにFAカップの準々決勝で当たりました。
  - レスター・シティとの一戦は「**M69ダービー**」と呼ばれ、2023年から24年に11年ぶりに戻りました。ただしレスターは、今季のプレミアリーグにいません。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
