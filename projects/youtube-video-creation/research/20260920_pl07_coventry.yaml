- id: data
  heading: コヴェントリー 基礎DATA
  main: true
  tier: 背景
  telop: 1883年創立
  narrator: 解説
  say:
  - short_only: true
    text: 坂元達裕の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_coventry_data0.png
    text: 創立は**1883年**。自転車を作るシンガー社の工員たちが作ったクラブです。
    no_telop: true
  - image: assets/backgrounds/stadium_コヴェントリー_in.png
    text: 本拠地はシービーエス・アリーナ。**3万2609人**が入ります。
  - image: assets/stats/pl_coventry_map.png
    text: ホームタウンはコヴェントリー。ウェスト・ミッドランズの都市です。
    no_telop: true
  - image: assets/stats/pl_coventry_data3.png
    text: オーナーは地元の実業家ダグ・キング。2023年からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_coventry_cups.png
    text: 1部リーグの優勝も、リーグカップの優勝もありません。FAカップが1回です。
    no_telop: true
  - image: assets/stats/pl_coventry_data5.png
    text: 直近の優勝は、昨季の2部リーグです。
    no_telop: true
  - image: assets/stats/pl_coventry_data6.png
    text: 1シーズンの最多得点は、クラリー・バートンの**50得点**。1931年から32年の記録です。
    no_telop: true
  - image: assets/stats/pl_coventry_data8.png
    text: 愛称は「スカイブルーズ」。空色です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  bg: assets/backgrounds/stadium_コヴェントリー.png
  official: false
- id: exile
  heading: 本拠地を追われた
  tier: 背景
  telop: 往復113キロ。ノーサンプトンのスタジアムを間借りした
  narrator: 解説
  card:
    type: table
    title: 落ちていった10年
    columns:
    - ''
    - ''
    rows:
    - - 2001年
      - 34年続いた1部から降格
    - - 2013年
      - ノーサンプトンへ間借り（往復113キロ）
    - - 2014年
      - シービーエス・アリーナに帰る
    - - 2017年
      - 4部まで落ちる
    - - 2026年4月17日
      - 25年ぶりの1部復帰
  say:
  - まず**2001年**、34年続いた1部から落ちました。
  - 2013年には、スタジアムの持ち主と家賃でもめて、**家を追われます。**
  - 移った先はノーサンプトン・タウンのスタジアム。往復およそ**113キロ**の道のりを、1シーズン通いました。
  - 2014年に、いまのシービーエス・アリーナへ帰ります。
  - 落ちるところまで落ちて、2017年には4部にいます。
  - そこから戻ってきました。**2026年4月17日**、25年ぶりのプレミアリーグ昇格が決まります。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  bg: assets/backgrounds/stadium_コヴェントリー.png
