    image: assets/photos/pl/coventry_legend_5dd33917.jpg
  - 1997年から98年はプレミアの**得点王**。マイケル・オーウェンらと並んでの受賞でした。
  - リーグ戦で61得点を残し、1998年に**575万ポンド**でアストン・ヴィラへ移りました。
