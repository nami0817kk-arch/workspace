  say:
  - text: 主要なタイトルは、クラブの歴史で1つだけ。**1987年**のFAカップです。
    image: assets/images/pl_coventry_episode/scene.jpg
  - 決勝の相手はトッテナム。開始2分で先制され、いったん追いつき、また突き放されます。
  - 後半、キース・ハウチェンのダイビングヘッドで**2対2**。勝負は延長へ。
  - 延長、決勝点は相手のオウンゴール。**3対2**で勝ちました。
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - https://en.wikipedia.org/wiki/1987_FA_Cup_final
