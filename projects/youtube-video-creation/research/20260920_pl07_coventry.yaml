  say:
  - text: ゲイリー・マカリスターは1996年、リーズから**300万ポンド**で来た31歳の司令塔。
    image: assets/photos/pl/coventry_legend_f86f9736.jpg
  - 主将として残留争いを戦い抜き、1999年から2000年には年間最優秀選手に選ばれました。
  - 2000年に35歳でリヴァプールへ移り、2002年には監督兼選手として戻ってきました。
