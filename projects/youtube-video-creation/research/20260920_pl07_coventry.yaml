- id: data
  heading: コヴェントリー 基礎DATA
  main: true
  tier: 背景
  telop: 1883年創立
  narrator: 解説
  say:
  - short_only: true
    text: 坂元達裕の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_coventry_data0.png
    text: 創立は**1883年**。自転車を作るシンガー社の工員たちが作ったクラブです。
    no_telop: true
  - image: assets/backgrounds/stadium_コヴェントリー_in.png
    text: 本拠地はCBSアリーナ。**3万2609人**が入ります。
  - image: assets/stats/pl_coventry_map.png
    text: ホームタウンはコヴェントリー。ウェスト・ミッドランズの都市です。
    no_telop: true
  - image: assets/stats/pl_coventry_data3.png
    text: オーナーは地元の実業家ダグ・キング。2023年からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_coventry_data4.png
    text: 1部リーグの優勝はありませんが、1987年にFAカップを獲っています。
    no_telop: true
  - image: assets/stats/pl_coventry_data5.png
    text: そして昨季、2025年から26年に2部で優勝。プレミアに戻ってきました。
    no_telop: true
  - image: assets/stats/pl_coventry_data6.png
    text: 1931年から32年には、クラリー・バートンが1シーズンで**50得点**を挙げています。
    no_telop: true
  - image: assets/stats/pl_coventry_data8.png
    text: 愛称は「スカイブルーズ」。空色です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  bg: assets/backgrounds/stadium_コヴェントリー.png
  official: false
- id: exile
  heading: 本拠地を追われた
  tier: 背景
  telop: 70マイル離れた街のスタジアムを間借りした
  narrator: 解説
  card:
    type: table
    title: 落ちていった10年
    columns:
    - ''
    - ''
    rows:
    - - 2001年
      - 34年続いた1部から降格
    - - 2013年
      - ノーサンプトンへ間借り（往復70マイル）
    - - 2017年
      - 4部まで落ちる
    - - 2026年4月17日
      - 25年ぶりの1部復帰
  say:
  - このクラブは、一度**家を追われています。**
  - 経営の行き詰まりから、2013年、本拠地を離れることになりました。
  - 移った先はノーサンプトン・タウンのスタジアム。**往復70マイル**、およそ113キロの道のりです。そこで**1年以上**戦いました。
  - 落ちるところまで落ちて、2017年には4部にいます。
  - そこから戻ってきました。**2026年4月17日**、プレミアリーグへの昇格が決まります。
  - 1部に戻るのは、2000年から01年のシーズン以来、25年ぶりでした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  bg: assets/backgrounds/stadium_コヴェントリー.png
