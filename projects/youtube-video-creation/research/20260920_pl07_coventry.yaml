  say:
  - 点を取って勝つランパードのサッカーで、昨季は46試合97ゴールで2部を制しました。
  - オーナー主導の型で、実業家ダグ・キングが2023年に買い、2025年には球場も手に入れました。
  - ジミー・ヒル監督が1962年に書いた応援歌「スカイ・ブルー・ソング」、節はイートン校のボート歌。
