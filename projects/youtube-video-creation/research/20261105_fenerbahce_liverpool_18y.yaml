#       カイトの言葉（英語）: "It was a very special night…" "…to keep believing in ourselves, and that is something [which] I learned from another club [that] means a lot to me, and that was Liverpool, the club we played against tonight." "…that we made a miracle tonight." "we have a chance to bring another miracle in Istanbul"
#       ESPN の地の文: 2005年のイスタンブールの決勝（リヴァプール対ミラン）の逆転優勝になぞらえた。カイトがリヴァプールに移ったのは翌2006年。
