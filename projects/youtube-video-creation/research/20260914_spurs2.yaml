    say:
      - そのチームが、この夏には大きな買い物をしていました。
      - 使った額は3億8000万ポンド。日本円でおよそ780億円です。
      - 開幕から3試合続けて無得点だったのは、1974/75シーズン以来、52年ぶりでした。
      - シーズンの途中を含めても、4試合続けての無得点は2006年以来、およそ20年ぶりです。
      - そして開幕から4試合となると、クラブの歴史で初めてになります。
      - イギリスのメディア『talkSPORT』は、こう書いています。
