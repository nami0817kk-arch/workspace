sections:
- id: rev
  heading: ブレントフォードの収入は、何でできているのか
  tier: 報道
  telop: 収入は1億7310万ポンド。リーグからの分配が約81%
  narrator: 解説
  card: &rev_bars
    type: bars
    title: ブレントフォードの収入の内訳（2024-25、百万ポンド）
    unit: 百万ポンド
    items:
    - {label: リーグからの分配, value: 139.5, highlight: true}
    - {label: スポンサーなど商業, value: 19.4}
    - {label: 試合の日, value: 12.4}
    - {label: その他, value: 1.8}
  say:
  - text: ブレントフォードの最新の決算は、2026年3月に公表されています。
    image: assets/images/20261112_finance_brentford/01_w.jpg
    card: none
  - text: ロンドン西部の町、ブレントフォード。この年で、プレミアは5季連続です。
    image: assets/images/20261112_finance_brentford/02_w.jpg
    card: none
  - text: 2024年から25年のシーズンは10位。前の年は、16位でした。
    image: assets/images/20261112_finance_brentford/03_w.jpg
    card: none
  - text: 決算は、7月から翌年6月の1年で区切ります。収入は、1億7310万ポンド。
    emph: true
    card: *rev_bars
  - text: 最大の柱は、プレミアリーグからの分配金。1億3950万ポンド。
    card: *rev_bars
  - text: 収入の約81%を、リーグが払っています。
    image: assets/images/20261112_finance_brentford/01_w.jpg
    card: none
  - text: 試合の日の収入は1240万ポンド。スポンサーなど商業の収入は、1940万ポンド。
    card:
      <<: *rev_bars
      items:
      - {label: リーグからの分配, value: 139.5}
      - {label: スポンサーなど商業, value: 19.4, highlight: true}
      - {label: 試合の日, value: 12.4, highlight: true}
      - {label: その他, value: 1.8}
  - text: 収入は前の年より増えました。増えた分の大半は、リーグの分配金。
    image: assets/images/20261112_finance_brentford/04_w.jpg
    card: none
  - text: 10位に上がって、リーグの分配金が増えました。
    card: none
  - text: いっぽう、その他の収入は約990万ポンド減りました。
    card: none
  - text: 前の年は、ゴールキーパーのラヤをアーセナルへ貸した料金などが入っていました。
    image: assets/images/20261112_finance_brentford/03_w.jpg
    card: none
  sources:
  - https://find-and-update.company-information.service.gov.uk/company/03642327/filing-history/MzUxMDQ1NjE3MmFkaXF6a2N4/document?format=pdf&download=0
- id: cost
  heading: 収入が増えた年に、給料はどこまで増えたのか
  tier: 報道
  telop: 収入は約650万の増え。人件費は約1640万の増え
  narrator: 解説
  card: &cost_table
    type: table
    title: ブレントフォードの収入と費用（百万ポンド）
    columns: &ct_cols [項目, 2023-24, 2024-25]
    rows: &ct_rows
    - [収入の合計, '166.5', '173.1']
    - [人件費, '114.4', '130.8']
    - [選手の償却, '35.6', '47.9']
    - [収入に占める人件費, 69%, 76%]
    highlight_row: 0
  say:
  - text: ブレントフォードの出ていくお金を見ます。収入は約650万ポンドの増え。
    card: *cost_table
  - text: ところが、人件費は1億1437万から1億3078万ポンドへ。
    emph: true
    card:
      <<: *cost_table
      highlight_row: 1
  - text: 約1640万の増え。収入の増えの2倍半です。
    card:
      <<: *cost_table
      highlight_row: 1
  - text: 収入に占める人件費は、約69%から約76%になりました。
    image: assets/images/20261112_finance_brentford/04_w.jpg
    card: none
  - text: クラブは、給料の総額はリーグでも低い部類だと述べています。
    card: none
  - text: 働く人も増えました。平均の従業員は、327人から379人へ。
    image: assets/images/20261112_finance_brentford/02_w.jpg
    card: none
  - text: 管理や商業のスタッフは、142人から189人です。
    card: none
  - text: 低いと言っても、収入が小さいので、割合は上がります。
    image: assets/images/20261112_finance_brentford/04_w.jpg
    card: none
  - text: 償却とは、移籍金を契約の年数で割って、毎年の費用にする会計です。
    card: none
    image: assets/images/20261112_finance_brentford/02_w.jpg
  - text: その償却が、3563万から4787万ポンドへ。約1220万の増えです。
    emph: true
    card:
      <<: *cost_table
      highlight_row: 2
  - text: 運営の費用の全体は、約3090万ポンドの増えでした。
    card: none
    image: assets/images/20261112_finance_brentford/01_w.jpg
  sources:
  - https://find-and-update.company-information.service.gov.uk/company/03642327/filing-history/MzUxMDQ1NjE3MmFkaXF6a2N4/document?format=pdf&download=0
- id: sale
  main: true
  heading: 主力4人を売ったのは、決算の年のあとだった
  tier: 報道
  telop: 売った夏の利益は、この決算には入っていない
  narrator: 解説
  card: &sale_table
    type: table
    title: ブレントフォードの損益（百万ポンド）
    columns: &st_cols [項目, 2023-24, 2024-25]
    rows: &st_rows
    - [選手を売る前の営業損益, −29.2, −40.0]
    - [選手を売った利益, '+25.2', '+27.2']
    - [利息など, −3.9, −7.8]
    - [税引き前の損益, −7.9, −20.5]
    highlight_row: 3
  say:
  - text: ブレントフォードは、10位の年に赤字でした。前の年も、赤字でした。
    short_only: true
    image: assets/images/20261112_finance_brentford/01_w.jpg
    card: none
  - text: 選手を売った利益は、2724万ポンド。前の年とほぼ同じです。
    card: *sale_table
    emph: true
  - text: 主な理由は、2024年8月のイヴァン・トニーの売却。
    image: assets/images/20261112_finance_brentford/02_w.jpg
    card: none
  - text: それでも、売る前の営業損益は、2922万から3999万ポンドの赤字になりました。
    card:
      <<: *sale_table
      highlight_row: 0
  - text: 利息なども増えています。分割で払う移籍金の利息が、359万から597万ポンドに。
    image: assets/images/20261112_finance_brentford/04_w.jpg
    card: none
  - text: 差し引きで、赤字は787万から2053万ポンドへ。約2.6倍です。
    emph: true
    card:
      <<: *sale_table
      highlight_row: 3
  - text: 税の戻りを入れた最終の赤字は、1767万ポンド。
    card: none
    image: assets/images/20261112_finance_brentford/04_w.jpg
  - text: クラブの純資産は、7770万から6000万ポンドに。
    card: none
  - text: 減った分は、この年の赤字です。
    card: none
  - text: そして、この決算の1年が終わった、2025年の夏です。
    image: assets/images/20261112_finance_brentford/03_w.jpg
    card: none
  - text: 決算には、この夏に主力を売ったとあります。
    emph: true
    image: assets/images/20261112_finance_brentford/03_w.jpg
    card: none
  - text: 夏に売った主力は、ムベウモ、ウィサ、ノアゴー、フレッケン。
    card: none
  - text: ノアゴーは、7月8日にアーセナルへ。
    image: assets/images/20261112_finance_brentford/04_w.jpg
    card: none
  - text: ブライアン・ムベウモは、7月21日にマンチェスター・ユナイテッドへ。
    card: none
  - text: ヨアネ・ウィサは、9月1日にニューカッスルへ移りました。
    card: none
  - text: この3人を売った利益は、この決算に入っていません。次の年の決算に入ります。
    emph: true
    image: assets/images/20261112_finance_brentford/02_w.jpg
    card: none
  - text: 同じ夏に、ミランボ、ヘンダーソン、ウアタラなどを加えました。
    card: none
  - text: 7月には、新しく1億ポンドの借り入れの枠を結び、銀行の当座貸越を返しています。
    image: assets/images/20261112_finance_brentford/01_w.jpg
    card: none
