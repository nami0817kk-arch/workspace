# クラブの財政：ブレントフォード（11/12 木、シリーズ「クラブの財政」、key: finance_brentford、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブから。
#   25位ボーンマス（11/10）・23位ブライトン・24位エヴァートン（女子チーム絡みで外す）・26位ローマは既出・27位ウルヴスは今季2部。
#   → 未出の最上位は **28位ブレントフォード（2億600万ユーロ。money.it・Lance の転載で確認）**。29位フラメンゴはブラジル。
#   11/14 の担当（リーズ）とクラブが別。11/10 のボーンマスと軸が重ならないようにした（下）。
#
# 重なりの確認（2026-11-11）：scripts/*finance_* にブレントフォードは無い。直近30日のブレントフォードの本は 10/29 ユニフォーム（別のシリーズ）。
#   research/20261112_picks.txt に同日のクラブは無い。
# ★今季も1部：ESPN の 2026-27 English Premier League 順位表 API（2026-11-11 取得）で 8位・勝点14・10試合。台本では順位を言わない（小さく見せない）。
# ★日本との接点：決算・今季の所属に日本人選手は確かめられない。無理に入れない（10/6 の決定）。
#
# 軸は「**10位の年に赤字2053万ポンド。収入の76%を給料に使い、その決算の年が終わった夏に主力4人を売った。売ると何が変わるのか**」。
#   ★他の財政回と軸を重ねない：11/10 ボーンマス＝入場料3.7%・売却益が黒字に変えた、11/8 パレス＝勝つと費用が増える、11/6 ブライトン＝売る利益が減る。
#     今回は「給料の重さ（収入の76%）」と「売却が決算の年のあとに来る時間差」を主役にする。ボーンマスと同じく「リーグの分配が約81%」だが、そこは1行だけ。
#   ★選手の移籍金の額は言わない（決算に4人ぶんの額は無い）。誰がどこへ・いつ、だけ言う（決算の注24）。
#   ★決算のあとの2025-26 の数字は出ていない。台本は決算の1年（2024-25）と、決算書に書かれた決算のあとの出来事だけ。
#
# **出どころ（読んだもの）**
#   ○ Brentford FC Ltd（会社番号 03642327）Consolidated Financial Statements for the year ended 30 June 2025（Companies House、2026-03-16 提出、56頁、監査 BDO、画像PDF。頁を画像にして目で読んだ）
#       https://find-and-update.company-information.service.gov.uk/company/03642327/filing-history/MzUxMDQ1NjE3MmFkaXF6a2N4/document?format=pdf&download=0
#       Group Strategic Report（p.8〜）KPI（2024/25／2023/24）：Turnover 173.1／166.5、Player Trading 27.2／25.2、Loss before tax (20.5)／(7.9)、Wages:Turnover 76%／69%、Season tickets 11,205／11,393、League position 10th／16th
#            「finished in 10th position in the Premier League with one of the lowest wage costs in the division, ensuring a fifth consecutive season of Premier League football」
#            「summer 2025 saw us sell four significant first team players in Mark Flekken, Bryan Mbeumo, Christian Norgaard and Yoane Wissa」
#            「Central income increased £12.0m to £139.5m」「Other Turnover decreased £9.9m primarily because the prior year included the loan fee and wage recovery of David Raya on loan to Arsenal for the 23/24 season」
#            「Profit on player trading shows an increase of £2.0m ... primarily due to the sale of Ivan Toney in August 24. Mbeumo, Wissa and Norgaard were all sold after the year-end and therefore the profit impact of these sales will be shown in next year's financial statements.」
#            「increase in salary costs of £16.4m and an increase in player amortisation of £12.0m」（本文は12.0。注5の数字から計算すると12.2。台本は注5の数字を使う）
#            「The profit on sale of fixed assets of £8.8m is derived from a settlement agreement with a third party in respect of mutual property interests.」
#            「Central Income ... £139.5m (2024: £127.5m) ... representing 81% of the club's turnover」
#       p.21 損益計算書（£000、2025／2024）：Turnover 173,076／166,536、Administrative expenses (232,060)／(201,155)、Other operating income 10,191／5,400、Profit on sale of tangible fixed assets 8,796／–、
#            Operating loss before player trading (39,997)／(29,219)、Gain on disposal of players' registrations 27,236／25,198、Operating loss (12,761)／(4,021)、
#            Interest receivable 2,680／1,168、Interest payable (10,446)／(5,020)、Loss before taxation (20,527)／(7,873)、Tax credit 2,858／356、Loss for the year (17,669)／(7,517)
#       p.37 注2 Turnover：Central distributions 139,547／127,500、Commercial 19,357／16,029、Matchday 12,376／11,341、Other 1,796／11,666。注3 Other operating income：Settlement agreements 6,716（key staff の退団に伴う補償金）／–、Other income 2,638／5,166
#       p.38 注4：Wages and salaries 113,000／99,265、Social security 16,415／14,069、Pension 1,363／1,037、計 130,778／114,371。注5：Intangible assets amortisation 47,872／35,631、Depreciation 11,390／8,694
#       p.39 注8：Unwinding of discount on player creditors 5,974／3,593（分割払いの移籍金の利息）
#       p.53 注24 Post balance sheet events：Player trading（決算のあとの1年）獲得 Antoni Milambo 2025-07-01・Jordan Henderson（free agent）2025-07-11・Dango Ouattara 2025-08-16・Reiss Nelson（Arsenal からレンタル）2025-09-01、
#            退団 Christian Norgaard（Arsenal）2025-07-08・Bryan Mbeumo（Manchester United）2025-07-21・Yoane Wissa（Newcastle United）2025-09-01 ほか。
#            Funding：「In July 2025, the Club entered into a new £100m interest-bearing facility with Macquarie Bank, comprising a £75m Term Loan and £25m Revolving Credit facility. The Barclays overdraft facility was repaid」
#   ○ ESPN 順位表 API（2026-11-11）：8位 Brentford 14点 10試合（台本には入れない）
#   × 確かめられなかったもの：4人の移籍金の額（決算に無い。報道の数字は使わない）、フレッケンの移籍先（注24の退団一覧に無い）、2025-26 の決算（まだ出ていない）、デロイトの順位の一次（Deloitte のPDFは読めず二次の転載）。どれも台本に入れない。
#
# 自分で計算した数（検算済み）
#   損益の底：−39.997＋27.236＝−12.761 ✓／−12.761＋2.680−10.446＝−20.527 ✓。前の年：−29.219＋25.198＝−4.021／＋1.168−5.020＝−7.873 ✓
#   赤字の広がり：20.527÷7.873＝2.607→約2.6倍
#   人件費：130.778÷173.076＝75.6%→約76%／114.371÷166.536＝68.7%→約69%。増え 130.778−114.371＝16.407→約1640万
#   収入の増え：173.076−166.536＝6.540→約650万。人件費の増え÷収入の増え＝16.407÷6.540＝2.51→約2.5倍
#   リーグの分配：139.547÷173.076＝80.6%→約81%。増え 139.547−127.500＝12.047→約1200万
#   その他の収入の減り：11.666−1.796＝9.870→約990万。広告など商業の増え：19.357−16.029＝3.328→約330万。試合の日の増え 12.376−11.341＝1.035→約100万
#   選手の償却：47.872−35.631＝12.241→約1220万
#   運営の費用（管理費）の増え：232.060−201.155＝30.905→約3090万
#   売却の前の営業損益の広がり：39.997−29.219＝10.778→約1080万。うち 収入＋6.540・その他の収入＋4.791・土地などの売却益＋8.796・費用−30.905 → 合計 −10.778 ✓
#   waterfall（税引き前の損益の動き）：−7.873＋6.540−30.905＋13.587（その他の収入の増え4.791＋売却益8.796）＋2.038（選手を売った利益 27.236−25.198）−3.914（利息の差 −7.766−(−3.852)）＝−20.527 ✓
#   分割払い移籍金の利息：5.974−3.593＝2.381→約240万
#   人件費÷試合の日の収入＝130.778÷12.376＝10.57→約10.6倍／リーグの分配÷試合の日の収入＝139.547÷12.376＝11.28→約11.3倍
#
