#       ムバッペはラ・リーガ25点・CL15点で得点王、W杯は10点で得点王、W杯の歴代最多得点者に。会場はロンドンのパレイディアム劇場。
#   ・ESPN 50236983・50289067（結果と順位の一覧）: 受賞ケイン、2位ムバッペ、3位ヤマル。W杯通算22点（今大会10点）。
