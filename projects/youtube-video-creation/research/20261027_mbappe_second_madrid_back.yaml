#   ・Goal（AFP 配信、2026-10-26 20:43Z。仏語版と英語版）: 会場で L'Équipe のテレビに話した言葉を Foot Mercato が伝えた、とある。
#       « Je sais que je suis au centre de l'attention. Vous me connaissez, et cela ne me dérange pas, je sais que je ne peux pas plaire à tout le monde. »
#       « Je ne veux pas changer et devenir quelqu'un d'autre. C'est très difficile d'être quelqu'un d'autre. »
#       受賞のあいさつを用意したかに « Non, ça porte malheur, il faut juste profiter du moment et voir comment les choses vont se dérouler dans la soirée. »
#       （訳は文ごとに区切っただけで、言い換えていない。ショートの尺のため、使うのは「全員に好かれることはできない」「変わりたくないし、別の誰かになりたくもない」の2文だけ）
#   ・RMC Sport（2026-10-27）: 主催するフランス・フットボール誌の編集長ヴァンサン・ガルシアが L'Équipe のテレビで
#       「ケインとムバッペの点差は、2024年のロドリとヴィニシウスの差より小さい。あのときは41点で、それでも小さかった」。内訳は土曜に誌面で公開。
#   ・SO FOOT（2026-10-27）: 2024年はロドリ1170点、ヴィニシウス1129点（41点差）。
#   ・Foot Mercato（2026-10-27 00:28Z）: 授賞式のあと、ムバッペはインスタグラムに、式の前にパレイディアムのレッドカーペットで撮った自分の写真を、絵文字ひとつだけ添えて載せた。
