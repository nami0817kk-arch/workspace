  title: トルシエ、日本代表を初めてW杯の16強に。フラット3と4年間の数字
  question: 日本代表を初めてW杯のベスト16に導いたトルシエの4年間は、数字で並べるとどんな姿だったのか
  takeaway: JFA の公式記録から数えた日本代表50試合（PK戦は引き分け）は23勝16分け11敗、勝率46.0%。ザッケローニ54.5%・アギーレ60.0%・ハリルホジッチ55.3%・森保一68.5%と同じ数え方で並べると通算は5人で最も低いが、アジアカップ（6試合5勝1分け、83.3%）とW杯本大会（4試合2勝、50%）は5人で最高。公式大会21試合は61.9%、親善試合29試合は34.5%で、通算を下げたのは引き分けの多い親善試合と、就任から1999年までの8試合（1勝）だった
  opening_image: assets/images/20261007_coach_troussier/01_w.jpg
short_title: トルシエ、W杯初勝利の夜を語る「素晴らしい経験だった」
