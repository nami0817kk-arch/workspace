# 監督の経歴：フィリップ・トルシエ（10/7）。1998年秋〜2002年6月の日本代表監督。シリーズ「監督の経歴」。
# 日本代表の50試合は JFA の公式記録「日本代表 試合別出場記録」（AGame.pdf、Wayback 2016-03-03 の控え）の監督欄から数えた（raw の1節に全行）。
#   JFA の今のサイトに 1998〜2002 年の試合日程・結果のページは無い（404）。数え方は 10/6 の3本と同じ：国際Aマッチだけ、PK戦は引き分け
#   （JFA の表は 2000-06-04 フランス戦 2-2 PK2-4 を負けにしている）。英語版 Wikipedia の監督成績（43試合）は集計が違うので使わない。
#   比べの数字はザッケローニ・ハリルホジッチ・森保の取材メモの表から（アジア杯：ザック 4勝2分、森保 12試合9勝、アギーレ 3勝1分は英語版 Wikipedia）。
# 大会ごとの成績は JFA の殿堂の紹介文と、英語版 Wikipedia の各大会の記事（ワールドユース1999・シドニー五輪・アジアカップ2000・コンフェデ杯2001）。
# W杯日韓大会の4試合は JFA「ワールドカップヒストリー」（2018）。アフリカの経歴と就任の経緯は英語版・日本語版 Wikipedia。
# 本人の言葉：ロシア戦の勝ち点3とフラット3はゲキサカ（2012-01-22、松田直樹メモリアルゲーム）、殿堂入りは JFA（2020-09-10）、レリーフ授与は JFA（2022-06-08）。
#   日本代表監督の時期（1998〜2002）の本人の言葉は、当時の記事の控えを辿れず使っていない（raw の5節）。
# 冒頭は山場（W杯初勝利・初のベスト16と本人の言葉）から。基礎DATAは3節目で3行だけ読む。ネットの反応は入れていない（シリーズの回）。
# 写真: ゲキサカの記事の写真（代理店の表記・透かしなし）。01 2012年の松田直樹メモリアルゲーム（©Koki NAGAHAMA）、
#   03 2024年アジア杯の日本対ベトナム（©Koki NAGAHAMA/GEKISAKA）、04 2024年アジア杯の会見（同）。
#   日本代表監督の時期の写真は見つからなかった（Commons は2枚だけ、ゲキサカの 2020 の1枚は ©Getty Images で削除）。材料の控えは research/raw/20261007_coach_troussier.md。
