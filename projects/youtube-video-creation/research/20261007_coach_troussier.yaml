- id: flat3
  heading: 「フラット3、イコール直樹」
  tier: 報道
  telop: 3人の守備の選手を横一列に並べ、ラインを高く保つ守り方
  narrator: キャスター
  say:
  - text: 就任から最後まで貫いたのが、フラット3と呼ばれる守り方です。
    image: assets/images/20261007_coach_troussier/01_w.jpg
    card: none
  - text: 3人の守備の選手を横一列に並べてラインを高く保ち、相手をオフサイドに誘います。
    card: none
  - text: W杯でその3人に入っていたのが、松田直樹でした。
    card: none
  - text: 2011年に亡くなった松田さんを悼む試合で、監督はこう話しています。
    card: none
  - text: フラット3、イコール直樹だった。
    voice: トルシエ監督
    card: none
  - text: 直樹がいなければ、フラット3にする意味はない。
    voice: トルシエ監督
    cont: true
    card: none
  - text: この日のトルシエは、守備の選手をいつもより1人多い4人で並べました。
    card: none
  - text: 中田浩二、宮本、森岡、直樹。
    voice: トルシエ監督
    card: none
  - text: その4人しか、フラット3を上手くできなかった。
    voice: トルシエ監督
    cont: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?95091-93500-fl
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?95091-93500-fl
  - https://www.jfa.jp/national_team/news/00017494/
  - https://ja.wikipedia.org/wiki/%E3%83%95%E3%83%A9%E3%83%83%E3%83%88%E3%82%B9%E3%83%AA%E3%83%BC
- id: after
  heading: 殿堂入りの言葉、「私のせいですね」
  tier: 報道
  official: true
  telop: 2020年、日本サッカー殿堂に。W杯のあとはカタールやベトナムの代表を指揮
  narrator: 解説
  say:
  - text: W杯のあと日本を離れ、カタール代表やマルセイユ、ベトナム代表を指揮しました。
    image: assets/images/20261007_coach_troussier/04_w.jpg
    card: none
  - text: 2024年のアジアカップでは、ベトナムの監督として日本と戦っています。
    card: none
  - text: 2020年、日本サッカー殿堂に入ることが決まり、協会にこう寄せました。
    card: none
  - text: 日本サッカー協会での活動経験は、
    voice: トルシエ監督
    card: none
  - text: 私のキャリアの中でも忘れることのできない
    voice: トルシエ監督
    cont: true
    card: none
  - text: 大変貴重なものでした。
    voice: トルシエ監督
    cont: true
    card: none
  - text: 決して全てがスムーズに進んだ道のりではありませんでしたが、
    voice: トルシエ監督
    card: none
  - text: 私のせいですね。
    voice: トルシエ監督
    cont: true
    card: none
  quotes_from:
  - 日本サッカー協会 https://www.jfa.jp/about_jfa/news/00025303/
  sources:
  - https://www.jfa.jp/about_jfa/news/00025303/
  - https://en.wikipedia.org/wiki/Philippe_Troussier
  - https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%A3%E3%83%AA%E3%83%83%E3%83%97%E3%83%BB%E3%83%88%E3%83%AB%E3%82%B7%E3%82%A8
  - https://web.gekisaka.jp/news/japan/detail/?399997-399997-fl
