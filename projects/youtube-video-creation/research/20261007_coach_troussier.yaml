    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
  - text: もとにしたのは協会の試合記録で、PK戦の勝ち負けは引き分けに数えました。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
  - text: 通算は23勝16分け11敗で、勝率46.0%。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: 森保一の通算より、22ポイント余り低い数字です。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 4
  - text: ところが大会に絞ると、順番が入れ替わります。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: アジアカップは6試合で5勝、83.3%。森保一の75%も上回り、5人で最高です。
    emph: true
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: W杯の本大会は、4試合で2勝。勝率は5割です。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: ザッケローニの0勝、森保一の8試合3勝を上回ります。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id009
      rows: *id010
      highlight_row: 4
  - text: では、通算を押し下げたのは何か。
