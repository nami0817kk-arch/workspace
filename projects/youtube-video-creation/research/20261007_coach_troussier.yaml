- id: africa
  heading: アフリカで呼ばれた「白い呪術師」
  tier: 報道
  telop: コートジボワールで3連覇。南アフリカを率いて1998年のW杯へ
  narrator: 解説
  card:
    type: table
    title: 日本に来る前に率いた主なチーム
    columns: &id005
    - チーム
    - 時期
    - 成績
    rows: &id006
    - - アセック・ミモザ
      - 1989〜92
      - コートジボワール1部 3連覇
    - - コートジボワール代表
      - '1993'
      - W杯予選の途中で退任
    - - FUSラバト
      - 1995〜97
      - モロッコ国王杯 優勝（1995）
    - - ナイジェリア代表
      - '1997'
      - W杯出場を決める（予選途中から）
    - - ブルキナファソ代表
      - 1997〜98
      - アフリカ選手権 4位（開催国）
    - - 南アフリカ代表
      - '1998'
      - W杯フランス大会 2分1敗
  say:
  - text: トルシエが名を上げたのは、アフリカでした。
    image: assets/images/20261007_coach_troussier/03_t.jpg
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: コートジボワールのアセック・ミモザで、リーグ3連覇。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: アフリカでついた呼び名は、「白い呪術師」でした。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 1997年には、予選の途中からナイジェリア代表を任され、W杯出場を決めます。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 3
  - text: それでも本大会は別の監督に託され、次は開催国ブルキナファソへ。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 4
  - text: アフリカ選手権で、ブルキナファソを当時いちばんの4位まで押し上げました。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 4
  - text: 1998年、南アフリカ代表を率いてW杯フランス大会へ。結果は2分け1敗です。
    card:
      type: table
      title: 日本に来る前に率いた主なチーム
      columns: *id005
      rows: *id006
      highlight_row: 5
  - text: その秋、日本の協会が次の代表監督に選んだのが彼でした。
    card: none
  - text: 最初に打診したアーセナルのベンゲル監督に断られ、その推薦で決まった人選です。
    card: none
  sources:
  - https://www.jfa.jp/about_jfa/news/00025303/
  - https://en.wikipedia.org/wiki/Philippe_Troussier
  - https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%A3%E3%83%AA%E3%83%83%E3%83%97%E3%83%BB%E3%83%88%E3%83%AB%E3%82%B7%E3%82%A8
  - https://www.rsssf.org/tablesi/ivochamp.html
