  say:
  - text: 1999年、トルシエはA代表に加えて、20歳以下の代表も率います。
    image: assets/images/20261007_coach_troussier/01.jpg
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: ナイジェリアでのワールドユース。初戦を落としながら勝ち上がり、決勝まで進みました。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: 決勝はスペインに0対4。それでも、日本がフィファの大会で初めて手にした準優勝です。
    emph: true
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: 一方のA代表は、招待されたコパ・アメリカで2敗1分け。1次リーグで姿を消します。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 1
  - text: 翌2000年の春にはメキシコと韓国に敗れ、解任を求める声が上がりました。
    card: none
  - text: 去就がかかった6月、モロッコでの大会で、前回のW杯王者フランスと2対2で引き分け。
    card: none
  - text: 続くキリンカップも負けなしで乗り切り、指揮を続けることになります。
    card: none
  - text: 9月のシドニー五輪では、23歳以下の代表を率いて1次リーグを突破しました。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 2
