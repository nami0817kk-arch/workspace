- id: asia
  heading: 21得点でアジア王者、0対5からの決勝
  tier: 確定
  official: true
  telop: 2000年アジアカップ優勝。2001年コンフェデ杯は5試合1失点で準優勝
  narrator: 解説
  card:
    type: table
    title: トルシエが率いた大会（PK戦は引き分け）
    columns: *id007
    rows: *id008
  say:
  - text: 10月、レバノンでのアジアカップ。1次リーグでウズベキスタンを8対1で下します。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: イラク、中国、決勝でサウジアラビアを破り、日本は2度目のアジアの頂点へ。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: 6試合で21得点。この年、トルシエはアジアの年間最優秀監督に選ばれました。
    emph: true
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: ところが翌年3月、敵地のフランス戦で0対5の大敗を喫します。
    card: none
  - text: 守りを立て直して迎えた6月、W杯の前年に開かれるコンフェデ杯。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 4
  - text: ブラジルとも引き分け、5試合で許したゴールは1つだけでした。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 4
  - text: 決勝は、ふたたびフランス。2か月半前の0対5から、1点差の0対1まで迫りました。
    card:
      type: table
      title: トルシエが率いた大会（PK戦は引き分け）
      columns: *id007
      rows: *id008
      highlight_row: 4
