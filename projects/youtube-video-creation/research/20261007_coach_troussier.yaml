sections:
- id: yokohama
  main: true
  heading: W杯で初めてつかんだ勝ち点3
  tier: 報道
  telop: 1998年は3戦全敗。2002年、2勝1分けの首位で初のベスト16
  narrator: キャスター
  say:
  - text: 2002年、日本と韓国で開かれたW杯。トルシエ監督の日本が、歴史を動かしました。
    short_only: true
    image: assets/images/20261007_coach_troussier/01_w.jpg
  - text: 4年前の初出場は3戦全敗。その壁を、監督は松田直樹の名を挙げて振り返ります。
    image: assets/images/20261007_coach_troussier/01_w.jpg
    card: none
  - text: 直樹と一緒に、日本のサッカー史上初めて
    voice: トルシエ監督
    card: none
  - text: W杯で勝ち点3を取れた
    voice: トルシエ監督
    cont: true
    card: none
  - text: 素晴らしい経験だった。
    voice: トルシエ監督
    cont: true
    card: none
  - text: 最後はチュニジアも破り、2勝1分けの首位。日本は初めてベスト16へ進みます。
    emph: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?95091-93500-fl
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?95091-93500-fl
  - https://www.jfa.jp/national_team/news/00017492/
  - https://www.jfa.jp/national_team/news/00017530/
- id: worldcup
  heading: 埼玉、横浜、長居、そして雨の宮城
  tier: 確定
  official: true
  telop: 初の勝ち点、初の勝利、初の1次リーグ突破。トルコに0対1で終わる
  narrator: 解説
  card:
    type: table
    title: W杯日韓大会の4試合（2002）
    columns: &id001
    - 日付
    - 相手
    - 結果
    rows: &id002
    - - 6月4日
      - ベルギー
      - 2-2
    - - 6月9日
      - ロシア
      - 1-0 勝ち
    - - 6月14日
      - チュニジア
      - 2-0 勝ち
    - - 6月18日
      - トルコ（1回戦）
      - 0-1 負け
  say:
  - text: 初戦は埼玉でベルギー。先制されたあと、鈴木隆行と稲本潤一のゴールで逆転します。
    image: assets/images/20261007_coach_troussier/01.jpg
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 終盤に追いつかれて2対2。それでも、日本がW杯で取った初めての勝ち点でした。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 横浜のロシア戦は後半6分。柳沢敦が落としたボールを、稲本が右足で決めます。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: この1点を守り切り、W杯の5試合目で、ついに初めての白星です。
    emph: true
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 長居のチュニジア戦。トルシエはハーフタイムに、森島寛晃と市川大祐を送り出します。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: その森島が後半3分に先制。中田英寿も頭で続き、2対0で勝ち切りました。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: ベスト8をかけたトルコ戦は、雨の宮城。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 前半12分、コーナーキックから頭で決められ、0対1の負けで大会を去りました。
    card:
      type: table
      title: W杯日韓大会の4試合（2002）
      columns: *id001
      rows: *id002
      highlight_row: 3
  sources:
  - https://www.jfa.jp/national_team/news/00017494/
  - https://www.jfa.jp/national_team/news/00017519/
  - https://www.jfa.jp/national_team/news/00017530/
  - https://www.jfa.jp/national_team/news/00017535/
