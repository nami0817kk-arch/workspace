  say:
  - text: この日本代表の監督が、1955年パリ生まれのフィリップ・トルシエ。
    image: assets/images/20261007_coach_troussier/03_t.jpg
    card:
      type: table
      title: フィリップ・トルシエの基礎DATA
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: 選手時代はフランス2部の守備の選手で、28歳で監督の道に入りました。
    card:
      type: table
      title: フィリップ・トルシエの基礎DATA
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: 日本代表を率いたのは、1998年の秋からW杯までの4年足らずです。
    card:
      type: table
      title: フィリップ・トルシエの基礎DATA
      columns: *id003
      rows: *id004
      highlight_row: 4
  sources:
  - https://www.jfa.jp/about_jfa/news/00025303/
