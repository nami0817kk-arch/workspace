- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 三笘薫のクラブが、いま3位
  narrator: キャスター
  say:
  - text: 三笘薫がリーグ戦**113試合**に出て、**23得点**を挙げているクラブです。
    image: assets/stats/pl_brighton_data_r1.png
    no_telop: true
  - text: 王者アーセナルを破った夜、監督のヒュルツェラーはこう言いました。
    image: assets/stats/pl_brighton_data_r2.png
    no_telop: true
  - voice: ファビアン・ヒュルツェラー
    text: 「この瞬間を楽しむのは大事。ただ、なぜ勝てたかも知らないと」
    image: assets/stats/pl_brighton_data_r2.png
  - text: 開幕から5試合で**3勝**を挙げ、順位は**3位**です。
    image: assets/stats/pl_brighton_data_r3.png
    no_telop: true
  - text: その家を失ったのは1997年、借金を返すためでした。
    image: assets/stats/pl_brighton_data_r3.png
    no_telop: true
  - image: assets/stats/pl_brighton_data0.png
    text: 創立は**1901年**。1920年にフットボールリーグに加わりました。
    no_telop: true
  - image: assets/stats/pl_brighton_data1.png
    text: 愛称は「シーガルズ」。カモメです。
    no_telop: true
  - image: assets/stats/pl_brighton_map.png
    text: ホームタウンは、イングランド南の海沿いの町、ブライトン・アンド・ホーヴ。
    no_telop: true
  - image: assets/backgrounds/stadium_ブライトン.png
    text: 本拠地はファルマー・スタジアム。**3万2176人**。ようやく持てた、自分たちの家です。
  - image: assets/photos/pl/brighton_owner_dbf32f4e.jpg
    text: オーナーはトニー・ブルーム。2009年に会長になり、株の75%を持っています。
  - image: assets/stats/pl_brighton_cups.png
    text: 直近のタイトルは、2010年から11年の3部優勝です。
    no_telop: true
  - image: assets/stats/pl_brighton_last.png
    text: プレミアでの最高位は、2022年から23年の**6位**です。
    no_telop: true
  sources:
