- id: data
  heading: ブライトン 基礎DATA
  main: true
  tier: 背景
  telop: 1901年創立
  narrator: 解説
  say:
  - short_only: true
    text: 三笘薫の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_brighton_data0.png
    text: 創立は**1901年**。1920年にフットボールリーグに加わりました。
    no_telop: true
  - image: assets/backgrounds/stadium_ブライトン_in.png
    text: 本拠地はファルマー・スタジアム。**3万2176人**が入ります。
  - image: assets/stats/pl_brighton_data2.png
    text: ホームタウンは、イングランド南の海沿いの町ブライトン・アンド・ホーヴ。
    no_telop: true
  - image: assets/stats/pl_brighton_data3.png
    text: オーナーはトニー・ブルーム。2009年に会長になり、株の75%を持っています。
    no_telop: true
  - image: assets/stats/pl_brighton_data.png
    text: 1部リーグの優勝やカップのタイトルは、まだありません。
    no_telop: true
  - image: assets/stats/pl_brighton_data7.png
    text: プレミアでの最高位は、2022年から23年の**6位**。クラブの歴史で一番の順位です。
    no_telop: true
  - image: assets/stats/pl_brighton_data8.png
    text: 愛称は「シーガルズ」。カモメです。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Brighton_&_Hove_Albion_F.C.
  bg: assets/backgrounds/stadium_ブライトン.png
  official: false
