  say:
  - image: assets/images/pl_brighton_story/scene.jpg
    text: 1997年、クラブの経営陣が、借金を返すために本拠地のゴールドストーン・グラウンドを売りました。
  - その年は、最終節の引き分けで、ようやく4部に残りました。
  - text: 売ってからの2年間は、別のクラブ、ジリンガムの本拠地を借りました。
    card:
      type: table
      title: 家を失っていた期間
      columns: *id001
      rows:
      - - 1999-2011年
        - 陸上競技場を改造したウィズディーン
      - - 2011年
        - ファルマー・スタジアムへ
  - そのあとの12年は、陸上競技場を改造したウィズディーン・スタジアムです。
  - image: assets/images/pl_brighton/scene.jpg
    text: いまのファルマー・スタジアムに入ったのは2011年です。
  official: false
