- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 高い位置で奪う。育てて売る
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 高い位置で奪う
    - - 運営の型
      - 安く獲って高く売る
    - - クラブの気質
      - サビは観客だけで歌う
  say:
  - text: ヒュルツェラーのサッカーは高い位置で奪う守りが看板。昨季は敵陣でボールを奪った回数がリーグ最多。
    image: assets/photos/pl/brighton_manager_f0635d10.jpg
  - 安く獲って高く売る型。ミッドフィールダーのカイセドは2年半でチェルシーへ、1億ポンド以上でした。
  - 入場のとき流れる応援歌は、1907年に書かれたサセックスの歌で、最後のサビは観客だけで歌います。
  sources:
  - https://en.wikipedia.org/wiki/Brighton_&_Hove_Albion_F.C.
  - https://www.brightonandhovealbion.com/media-article/mft-albion-analytics-2025-26-season-review-june-2026
  - https://www.brightonandhovealbion.com/media-article/mft-albion-analytics--fabian-hurzeler-october-2024
  - https://en.wikipedia.org/wiki/Mois%C3%A9s_Caicedo
  - https://en.wikipedia.org/wiki/Sussex_by_the_Sea
  bg: assets/backgrounds/stadium_ブライトン_in.png
  official: false
