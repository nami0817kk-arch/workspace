  narrator: 解説
  say:
  - short_only: true
    text: 三笘薫の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_brighton_data.png
    text: 創立は**1901年**。1920年にフットボールリーグに加わりました。
  - image: assets/stats/pl_brighton_data.png
    text: 本拠地はファルマー・スタジアム。**3万2176人**が入ります。
  - image: assets/stats/pl_brighton_data.png
    text: ホームタウンは、イングランド南の海沿いの町ブライトン・アンド・ホーヴ。
  - image: assets/stats/pl_brighton_data.png
    text: オーナーはトニー・ブルーム。2009年に会長になり、株の75%を持っています。
  - image: assets/stats/pl_brighton_data.png
    text: 1部リーグの優勝やカップのタイトルは、まだありません。
  - image: assets/stats/pl_brighton_data.png
    text: プレミアでの最高位は、2022年から23年の**6位**。クラブの歴史で一番の順位です。
  - image: assets/stats/pl_brighton_data.png
    text: 愛称は「シーガルズ」。カモメです。
  sources:
  - https://en.wikipedia.org/wiki/Brighton_&_Hove_Albion_F.C.
  bg: assets/backgrounds/stadium_ブライトン.png
