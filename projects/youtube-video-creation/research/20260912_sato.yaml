# 佐藤龍之介のセビージャ戦（2026年9月12日）
#
# **セビージャ戦そのものに焦点を当てる**（2026-09-12 ユーザー指示）。
# 前の版は「地元紙が理由をチームに置いた」を芯にしていたが、**試合の中身を軸にする。**
#
# 試合の流れ:
#   前半 スコアレス。セビージャがセットプレーで再三迫り、GKディミトリエフスキが対応
#   50分 セビージャのCKからの場面はクリア
#   62分 佐藤が交代
#   78分 バレンシアの決定機がクロスバーに当たる
#   81分 コレイアのキック→コチョラシュビリの左足→フアン・イグレシアスのヘッド
#
# 引きは**「なぜ見せ場が作れなかったのか」**。採点の低さではなく、
# **守備に追われて前に出られなかった**という試合の形が芯。ここが山場（@main）。
#
# **採点は「どの媒体の数字か」を必ず言う。**媒体で割れている（3 と 10点中4点）。
# **こちらの評価にしない。**
#
# **イエローの場面は事実だけ。**27分にスアソの顔を足で蹴って警告。煽らない。
# **監督の解任報道には踏み込まない**（誰が報じたかまで取れていない）
format: news
