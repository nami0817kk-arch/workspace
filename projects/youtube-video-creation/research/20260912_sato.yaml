  - id: sato
    heading: 佐藤龍之介の62分
    main: true
    tier: 報道
    telop: 守備に追われた時間が長かった
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 採点の数字ではなく、**なぜ前に出られなかったか**という試合の形が芯
    card:
      type: quote
      title: スペイン紙 AS
      text: 抜き去る場面はあったが、いずれも相手ボックスとは程遠い位置でのこと
    say:
      - 佐藤龍之介は2試合ぶりの先発でした。
      - ただ、チームが守備に追われる時間が長く、前に出る場面が少ないまま進みます。
      - 27分には、競り合ったスアソの顔を足で蹴ってしまい、警告を受けました。
      - スペイン紙のASが、その時間帯をこう書いています。
      - {voice: スペイン紙 AS, text: フアン・イグレシアスを何度か抜き去る場面もあったが、いずれも相手ボックスとは程遠い位置でのこと}
      - {voice: スペイン紙 AS, text: すでにイエローカードを受けていたこともあり、早々に交代させられている}
      - 交代は62分。ゴールが決まる19分前でした。
      # **ショートは山場の節だけを切り出すので、現地の採点もここに入れる**
      # （2026-09-12 ユーザー「ショートに現地採点いれて」）
      - 現地の採点は割れました。ElDesmarque が3、日刊スポーツが伝えた地元紙は10点中4点です。
      - {voice: ElDesmarque Valencia, text: 攻撃に絡む場面はほとんどなし。守備面での貢献の方が目立っていた}
    official: false
    sources:
