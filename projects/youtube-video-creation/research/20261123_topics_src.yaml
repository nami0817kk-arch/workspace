title: 11月23日のショート題材
lead: 海外フィード約280件から10件をClaudeが選びました（日本人6件・海外4件）。取材で前提が崩れたら次点に差し替えます。
note: 月曜（23日）の朝7時に集めました。見出しからの選定。次点：鈴木彩艶のレアル関心、塩貝健人の負傷、鈴木唯人と後藤啓介、ムシアラとオリーズ。
