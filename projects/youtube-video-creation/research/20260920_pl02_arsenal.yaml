- id: data
  heading: アーセナル 基礎DATA
  main: true
  tier: 背景
  telop: 1886年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_arsenal_data0.png
    text: 創立は**1886年**。ディアル・スクエアという名前で始まりました。
    no_telop: true
  - image: assets/backgrounds/stadium_アーセナル_in.png
    text: 本拠地はロンドン北部のエミレーツ・スタジアム。**6万704人**が入ります。
  - image: assets/stats/pl_arsenal_map.png
    text: ホームタウンはロンドン。北ロンドン・イズリントン区です。
    no_telop: true
  - image: assets/photos/pl/arsenal_owner_87703a59.jpg
    text: オーナーはスタン・クロエンケ。2018年から単独でクラブを持っています。
  - image: assets/stats/pl_arsenal_cups.png
    text: 1部リーグの優勝は**14回**。FAカップも14回獲っています。
    no_telop: true
  - image: assets/stats/pl_arsenal_data5.png
    text: 直近のタイトルは昨季、2025年から26年のプレミアリーグ優勝です。
    no_telop: true
  - image: assets/stats/pl_arsenal_data6.png
    text: そして2003年から04年には、38試合を1度も負けずに優勝。**インビンシブルズ**と呼ばれ、プレミアリーグでは今も唯一の記録です。
    no_telop: true
  - image: assets/stats/pl_arsenal_data8.png
    text: 愛称は「ガナーズ」。砲手、という意味です。
    no_telop: true
  - image: assets/stats/pl_arsenal_last.png
    text: 昨季は**1位**。勝ち点は85でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Arsenal_F.C.
  bg: assets/backgrounds/stadium_アーセナル.png
  official: false
- id: history
  heading: 歩んできた道
  tier: 背景
  telop: 2003-04年、リーグ戦を1つも負けずに優勝した
  narrator: 解説
  card:
    type: table
    title: アーセナルの記録
    columns:
    - ''
    - ''
    rows:
    - - 2003-04年
      - 無敗優勝。連続無敗49試合はイングランド記録
    - - 2026年5月19日
      - 14回目のリーグ優勝（22年ぶり）
  say:
  - 語り継がれているのは、2003年から2004年のシーズンです。
  - リーグ戦38試合、負けなし。「**無敗**」と呼ばれるチームです。
  - この前後にまたがる連続無敗は**49試合**。イングランドの1部での最長記録です。
  - ただ、そこからリーグ優勝は遠ざかりました。
  - 次の優勝は**2026年5月19日**。クラブ14回目で、**22年ぶり**でした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Arsenal_F.C.
  bg: assets/backgrounds/stadium_アーセナル.png
