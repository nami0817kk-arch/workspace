- id: history
  heading: 歩んできた道
  tier: 背景
  telop: 2003-04年、リーグ戦を1つも負けずに優勝した
  narrator: 解説
  card:
    type: table
    title: アーセナルの記録
    columns:
    - ''
    - ''
    rows:
    - - 2003-04年
      - 無敗優勝。連続無敗49試合はイングランド記録
    - - 2026年5月19日
      - 14回目のリーグ優勝（22年ぶり）
  say:
  - text: この無敗は、そのシーズンだけで終わっていません。
    image: assets/images/pl_arsenal_story/scene.jpg
  - 2003年5月から2004年10月まで、リーグ戦**49試合**、負けませんでした。
  - この連続無敗は、いまもイングランド1部の最長記録です。
  - ただ、そこからリーグ優勝は遠ざかりました。
  - 次の優勝は**2026年5月19日**。**22年ぶり**でした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Arsenal_F.C.
