  - 昨季、**22年**待ったリーグ優勝をつかんだ王者です。
  - 率いるミケル・アルテタは、就任の日にこう言いました。
  - voice: ミケル・アルテタ
    text: 「仕事に責任を持ち、情熱とエネルギーを注ぐ人がほしい」
  - 今季は連覇に挑む立場。首位を勝ち点**3**差で追っています。
  - 無敗の記録を残したのは2004年。その先に22年の空白がありました。
