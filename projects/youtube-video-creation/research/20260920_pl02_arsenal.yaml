    image: assets/photos/pl/arsenal_legend_7851c0a6.jpg
  - クラブ史上最多の**228得点**。プレミアの得点王には、歴代最多の4回選ばれています。
  - 2007年にバルセロナへ。2012年には期限付きで戻り、復帰戦でリーズから得点しました。
