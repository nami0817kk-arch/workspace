  say:
  - text: トニー・アダムスは1983年、17歳でデビュー。引退までこのクラブだけのセンターバックです。
    image: assets/photos/pl/arsenal_legend_2f4344ee.jpg
  - 1988年、21歳で主将に。80年代、90年代、2000年代、3つの時代で優勝の腕章を巻きました。
  - リーグ戦で**504試合**。2011年、創立125年を記念して、エミレーツに銅像が立ちました。
