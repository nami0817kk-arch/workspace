    text: 本拠地はエミレーツ・スタジアム。**6万704人**が入ります。
  - image: assets/photos/pl/arsenal_owner_87703a59.jpg
    text: オーナーはアメリカのスタン・クロエンケ。2018年にほかの株主を買い取り、ひとりで持っています。
  - image: assets/stats/pl_arsenal_cups.png
    text: FAカップも、リーグと同じ**14回**獲っています。
    no_telop: true
  - image: assets/stats/pl_arsenal_cups.png
