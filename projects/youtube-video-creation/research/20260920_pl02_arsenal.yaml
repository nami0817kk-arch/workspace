    - - 運営の型
      - 7歳から育てる
    - - クラブの気質
      - 南から北へ渡ってきた
  say:
  - アルテタのサッカーは、ボールを持って試合を支配し、後ろから組み立てて崩す。セットプレーも強い。
  - 育成のハレ・エンドが土台。サカは7歳で入って以来、ずっとこのクラブの選手です。
  - 1913年、南のウーリッジから北ロンドンへ移ってきました。テムズ川を渡った引っ越しです。
