- id: rival
  heading: 宿敵
  tier: 背景
  telop: 始まりは、4マイル先への引っ越しだった
  narrator: 解説
  card:
    type: table
    title: ノース・ロンドン・ダービー
    columns:
    - ''
    - ''
    rows:
    - - 相手
      - トッテナム・ホットスパー
    - - 1913年
      - ハイベリーへ移転。相手の本拠地まで4マイル
    - - 1919年
      - 1部拡大の投票。アーセナル18票・トッテナム8票
    - - 今季
      - トッテナムもプレミアリーグにいる
  say:
  - 宿敵はトッテナム・ホットスパー。呼び名は**ノース・ロンドン・ダービー**です。
  - 始まりは1913年。アーセナルがプラムステッドのマナー・グラウンドから、ハイベリーへ移りました。
  - 移った先は、相手の本拠地ホワイト・ハート・レーンから**わずか4マイル**の場所でした。
  - 決定的になったのは1919年です。
  - 第一次大戦のあと、1部が2枠ひろがることになり、どのクラブを上げるかの投票が行われました。
  - アーセナルが**18票**。トッテナムは**8票**でした。
  - ほかはバーンズリーが5票、ウルヴァーハンプトンが4票、ノッティンガム・フォレストが3票、バーミンガムが2票、ハル・シティが1票。
  - こうしてアーセナルが1部に選ばれます。ここから本物の因縁になりました。
  - そのトッテナムは、今季もプレミアリーグにいます。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/North_London_derby
