title: 9月27日の題材（夕方）
lead: 午後の一覧のあと、16時までに出た見出しから15件
note: <b>○×を付けてください。</b>今日のショートの枠（1日10本）は、あと<b>1本</b>です。ここで○を付けたものは、主に明日（9/28）の枠に入ります。<br><br>日本代表のベネズエラ戦は<b>明日9/28</b>です。①は試合の前にメンバー紹介として出すこともできますし、試合の後に結果と合わせて作ることもできます。<br><br>ロマーノの投稿は、手元の Chrome に接続したところで読み取りが止まり、今回も読めませんでした。「W杯中に堂安と塩貝が大喧嘩した」というまとめ（記者の話の又聞きの又聞き）は、確かめる元の記事が無いので入れていません。<br><br>午前・午後の一覧に出した題材と、作ったマンCの回（9/26）、イングランド対スペインの回は入れていません。中身はまだ<b>見出しだけ</b>です。
