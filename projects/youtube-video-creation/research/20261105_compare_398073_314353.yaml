      lower: [1アシストにかかった時間, 1つ絡むのにかかった時間]
      bars: false
      note: クラブのトップチームの公式戦。割合と時間は自分で計算した値
    say:
      - text: 見立てです。2人が絡んだ点の数は、128と123で、ほぼ並んでいます。
        image: assets/images/20261105_compare_398073_314353/pair_a/01.jpg
        card: {<<: *viewcard, highlight_row: 得点＋アシスト（通算）}
      - text: ただ、ハキミは絡んだ点の41%を自分で決め、アーノルドは19%。
        mark: {kind: circle, row: 1}
        image: assets/images/20261105_compare_398073_314353/h4/01_w.jpg
        card: {<<: *viewcard, highlight_row: そのうち得点の割合}
      - text: アシストの速さはアーノルドが約63分速く、全体の速さはハキミが約30分速い。
        emph: true
        image: assets/images/20261105_compare_398073_314353/t3/01_w.jpg
        card: {<<: *viewcard, highlight_row: 1つ絡むのにかかった時間}
      - text: 同じ右サイドバックでも、ゴール前まで走って決める形と、後ろから配る形。
        image: assets/images/20261105_compare_398073_314353/pair_b/01.jpg
        card: none
      - text: 数字は、はっきり分かれました。
        image: assets/images/20261105_compare_398073_314353/pair_c/01.jpg
        card: none
      - text: 次の試合です。パリは日本時間11月8日の4時45分から、ホームでトロワ戦。
        image: assets/images/20261105_compare_398073_314353/h2/01_w.jpg
        card: none
      - text: レアルは5時から、アウェーでバレンシア戦です。
        image: assets/images/20261105_compare_398073_314353/t1/01.jpg
        card: none
      - text: 128と123。次にこの数を動かすのはどちらか、注目です。
        image: assets/images/20261105_compare_398073_314353/pair_c/01.jpg
        card: none
