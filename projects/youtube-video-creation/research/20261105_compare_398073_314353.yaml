  - id: finals
    heading: 大きな決勝の舞台で、2人はどうだったのか
    tier: 報道
    telop: 決勝と準決勝
    narrator: 解説
    card: &finalcard
      type: timeline
      title: 2人が関わった大きな試合
      rows:
        - ["2018年5月", "CL決勝 レアル3-1リバプール。アーノルドは90分出場"]
        - ["2019年6月", "CL決勝 リバプール2-0トッテナム。アーノルドは90分、優勝"]
        - ["2025年5月", "CL決勝 パリ5-0インテル。ハキミが12分に先制点"]
        - ["2025年7月", "クラブW杯準決勝 パリ4-0レアル。ハキミが1アシスト"]
      focus: 2
    say:
      - text: 2人とも、チャンピオンズリーグの決勝に先発しています。
        image: assets/images/20261105_compare_398073_314353/pair_c/01.jpg
        card: none
      - text: アーノルドは2018年から2年続けて決勝に先発し、2019年に優勝。
        image: assets/images/20261105_compare_398073_314353/t3/01_w.jpg
        card: {<<: *finalcard, highlight_row: 1}
      - text: 2018年の決勝の相手は、レアルでした。
        image: assets/images/20261105_compare_398073_314353/t3/01_w.jpg
        card: {<<: *finalcard, highlight_row: 0}
      - text: ハキミは当時レアルの選手でしたが、決勝のメンバーには入っていません。
        image: assets/images/20261105_compare_398073_314353/t2/01_w.jpg
        card: none
      - text: ハキミは2025年の決勝で、古巣インテルから12分に先制点。
        image: assets/images/20261105_compare_398073_314353/h2/01_w.jpg
        card: {<<: *finalcard, highlight_row: 2}
      - text: パリは5対0で勝ち、初めての優勝を果たしました。
        emph: true
        image: assets/images/20261105_compare_398073_314353/h2/01_w.jpg
        card: {<<: *finalcard, highlight_row: 2}
      - text: その夏のクラブワールドカップ準決勝は、パリとレアル。
        image: assets/images/20261105_compare_398073_314353/h3/01_w.jpg
        card: none
      - text: ハキミが1アシストし、パリが4対0の勝ち。
        image: assets/images/20261105_compare_398073_314353/h3/01_w.jpg
        card: {<<: *finalcard, highlight_row: 3}
      - text: アーノルドは、この試合には出ていません。
        image: assets/images/20261105_compare_398073_314353/t2/01_w.jpg
        card: none
    sources:
      - https://www.transfermarkt.com/achraf-hakimi/leistungsdaten/spieler/398073
      - https://www.transfermarkt.com/trent-alexander-arnold/leistungsdaten/spieler/314353
      - https://en.wikipedia.org/wiki/2025_UEFA_Champions_League_final

