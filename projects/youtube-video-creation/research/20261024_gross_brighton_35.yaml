# 取材メモ（2026年10月24日）パスカル・グロス、35歳。ブライトンで「常に一歩先」（ニュースのショート。見せ方 Y＝監督の一言から始める）
# 題材の元: research/20261024_topics_src.yaml 番号17（ユーザー○）。
# 取材: 2026-10-24。requests（ブラウザUA）で本文を全部読んだ。
#   ・ガーディアン エド・アーロンズ記者（10/23 12:11 BST 公開・17:39 更新）
#     「Pascal Gross: the obsessive runner keeping Brighton 'one step ahead' after fast start」（URL の slug は fabian-gross だが本文はパスカル・グロス）。
#     使った事実（記事のまま）:
#       - 9月のプレミアリーグ月間最優秀選手（写真説明と本文の両方）。35歳。
#       - 今季は1試合平均11.5km超を走り、走行距離はリーグ3位（the third-most ground of any player）。
#       - リーグ戦3試合続けてアシスト（日曜のパレス戦5-0では FK がカンヴォのオウンゴールに）。4試合続ければ、2002年12月のゾラ（チェルシー）以来の最年長になる機会。
#       - ブライトンは7試合で23得点＝7試合時点でプレミア史上4番目に多い。日曜はアウェーのリヴァプール戦（時刻は記事に無い→言わない）。
#       - 2017年にインゴルシュタットから加入、プレミアで7年 → ドルトムント → 今年1月に120万ポンドで復帰。全大会の全試合に先発。
#       - EURO2024 で準々決勝敗退のあと、東フリジア諸島のユイスト島で 8.4km のレースに出て 31分35秒で優勝（1分以上の差）。競技者がSNSに動画を出して知られた。
#       - 芝のアレルギーで長袖を着る。クラブでの呼び名は「カイザー」。W杯のあとで代表を引退。
#     監督の言葉（ヒュルツェラー、記事の引用。英語→こちらで訳す）:
#       'Sometimes he's just one step ahead than his opponent' / 'He might not be the quickest player, but he can be the quickest in the head'
#       'No one expected that it would be this good.' / 'The older the wine gets, the better it gets.'
#       'Where can I run a race?' Because he will never stand still（冗談として）
#     本人の言葉（記事の引用。いつの発言かは記事に書いていない→「去ったときのことを」とだけ言う）:
#       'It was really difficult' / 'There were a couple of other options [before returning], but Brighton was always the priority.'
#   ・プレミアリーグ公式（FPL の公式データ bootstrap-static、10/24 取得）: Groß 3得点・先発7・610分、ブライトンは3位、第7節まで終了。
#       → 3位・3得点は公式で一致。FPL のアシストは6（FPL独自の数え方）で、ガーディアンの「得点とアシストで7」と合わないので、**合計の数字は言わない**。
#       → 月間最優秀選手は公式サイトの記事を探したが、API が遅く本文まで届かなかった（ガーディアンの記載のみ。確度は報道）。
# 自分で数えた比べ（見立て）: 11.5km − 8.4km ＝ 3.1km。1試合で、夏に優勝したレースより3km以上長く走っている計算。
# 確度: 報道（ガーディアン1社）。順位・得点はプレミアリーグ公式データでも一致。
# 三笘薫: 同じクラブだが記事に出てこないので入れない。
# 反応: 0件。作らない。approve は --no-voices で。
# 写真: Commons 6枚（CC BY 2.0 James Boyes／CC BY-SA 4.0 Ardfern・Bryan Berlin）。ブライトンでの写真は2018・2022年、06 は2026年W杯のドイツ代表。今季の写真ではない（記事の写真は Getty・ロイターで不可）。
