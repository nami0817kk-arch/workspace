  - id: home
    heading: 同じ本拠地を使うのに、ホームの成績は同じなのか
    tier: 報道
    telop: どちらもスタディオ・オリンピコ。ホームとアウェーの勝ち点
    narrator: 解説
    card: &homecard
      type: duel
      left: {name: ローマ, club: 勝ち点, photo: assets/images/20261120_compare_roma_lazio/roma_sq.jpg, color: "#8e1f2f"}
      right: {name: ラツィオ, club: 勝ち点, photo: assets/images/20261120_compare_roma_lazio/lazio_sq.jpg, color: "#87d8f7"}
      rows:
        - [ホームの試合, "6", "5"]
        - [ホームの勝ち点, "16", "13"]
        - [ホーム（1試合）, "2.67", "2.60"]
        - [アウェーの試合, "5", "6"]
        - [アウェーの勝ち点, "11", "16"]
        - [アウェー（1試合）, "2.20", "2.67"]
      note: セリエA11試合。1試合あたりは自分で割った値
    say:
      - text: 本拠地は、どちらもスタディオ・オリンピコ。同じ競技場を、2クラブで使っています。
        image: assets/images/20261120_compare_roma_lazio/olimp1_w.jpg
        card: none
      - text: この競技場の収容人数は、7万634人。1953年に開場しました。
        image: assets/images/20261120_compare_roma_lazio/olimp3_w.jpg
        card: none
      - text: 同じ競技場でも、成績は同じなのか。まず、ホームの試合です。
        card: {<<: *homecard, highlight_row: ホームの試合}
      - text: ローマが6試合で勝ち点16。ラツィオは、5試合で13。
        card: {<<: *homecard, highlight_row: ホームの勝ち点}
      - text: 1試合に直すと、2.67と2.60。ほぼ同じです。
        card: {<<: *homecard, highlight_row: ホーム（1試合）}
      - text: アウェーは、ローマが5試合で勝ち点11。ラツィオは、6試合で16。
        card: {<<: *homecard, highlight_row: アウェーの勝ち点}
      - text: 1試合あたりは、2.20と2.67。
        card: {<<: *homecard, highlight_row: アウェー（1試合）}
      - text: 勝ち点の差は2。
        card: {<<: *homecard, highlight_row: [ホームの勝ち点, アウェーの勝ち点]}
      - text: アウェーでラツィオが5多く、ホームでローマが3多い。その差し引きです。
        emph: true
        image: assets/images/20261120_compare_roma_lazio/olimp2_w.jpg
        card: &homecalc
          type: calc
          title: ラツィオが上回った勝ち点
          terms:
            - ['5点', アウェーの差]
            - ['3点', ホームの差]
            - ['2点', 全体の差]
          ops: ['－', '＝']
    sources:
      - https://en.wikipedia.org/wiki/Stadio_Olimpico
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/standings

  - id: titles
    heading: タイトルの数は、どちらが多いのか
    tier: 報道
    telop: セリエA・コッパ・スーペルコッパ・欧州の合計は、どちらも16
    narrator: 解説
    card: &shelfcard
      type: shelf
      left: {name: ローマ, club: 個数, photo: assets/images/20261120_compare_roma_lazio/roma_sq.jpg, color: "#8e1f2f"}
      right: {name: ラツィオ, club: 個数, photo: assets/images/20261120_compare_roma_lazio/lazio_sq.jpg, color: "#87d8f7"}
      rows:
        - [セリエA, "3", "2"]
        - [コッパ・イタリア, "9", "7"]
        - [スーペルコッパ, "2", "5"]
        - [欧州の大会, "2", "2"]
        - [合計, "16", "16"]
      note: 合計は自分で足した値。欧州の大会は、ローマがフェアーズ・カップとカンファレンスリーグ、ラツィオがカップウィナーズ杯と欧州スーパーカップ
    say:
      - text: 最後に、タイトルの数です。まず、セリエAの優勝。
        image: assets/images/20261120_compare_roma_lazio/olimp3_w.jpg
        card: {<<: *shelfcard, highlight_row: セリエA}
      - text: ローマが3回。ラツィオが2回です。
        card: {<<: *shelfcard, highlight_row: セリエA}
      - text: 優勝は、ローマが1942年、1983年、2001年。
        card: {<<: *shelfcard, highlight_row: セリエA}
      - text: ラツィオは、1974年と2000年です。
        card: {<<: *shelfcard, highlight_row: セリエA}
      - text: コッパ・イタリアは、9回と7回。
        card: {<<: *shelfcard, highlight_row: コッパ・イタリア}
      - text: スーペルコッパは、リーグ王者とカップ王者が、シーズンの初めに戦う大会。
        card: {<<: *shelfcard, highlight_row: スーペルコッパ}
      - text: ローマが2回、ラツィオが5回。ここだけ、ラツィオが上です。
        card: {<<: *shelfcard, highlight_row: スーペルコッパ}
      - text: 欧州の大会は、どちらも2つ。
        image: assets/images/20261120_compare_roma_lazio/olimp1_w.jpg
        card: {<<: *shelfcard, highlight_row: 欧州の大会}
      - text: ローマは、1961年のフェアーズ・カップと、2022年のカンファレンスリーグ。
        card: {<<: *shelfcard, highlight_row: 欧州の大会}
      - text: フェアーズ・カップは、ヨーロッパリーグの前身にあたる大会です。
        card: {<<: *shelfcard, highlight_row: 欧州の大会}
      - text: ラツィオは、1999年のカップウィナーズ杯と、同じ年の欧州スーパーカップ。
        card: {<<: *shelfcard, highlight_row: 欧州の大会}
      - text: カップウィナーズ杯は、かつてあった欧州の大会です。
        card: {<<: *shelfcard, highlight_row: 欧州の大会}
      - text: 4つを足すと、ローマが3＋9＋2＋2で16。ラツィオが、2＋7＋5＋2で16。
        emph: true
        card: {<<: *shelfcard, highlight_row: 合計}
      - text: ちょうど、同じ数です。
        card: {<<: *shelfcard, highlight_row: 合計}
    sources:
      - https://en.wikipedia.org/wiki/SS_Lazio
      - https://en.wikipedia.org/wiki/AS_Roma

  - id: view
    viewpoint: true
    heading: 見立て・同じ負けなしでも、勝ち方は逆の形をしている
    tier: 背景
    telop: ローマは点で上回り、ラツィオは勝ち点で上回る。次は12月13日のダービー
    narrator: 解説
    card: &viewcard
      type: duel
      left: {name: ローマ, club: 11試合, photo: assets/images/20261120_compare_roma_lazio/roma_sq.jpg, color: "#8e1f2f"}
      right: {name: ラツィオ, club: 11試合, photo: assets/images/20261120_compare_roma_lazio/lazio_sq.jpg, color: "#87d8f7"}
      rows:
        - [勝ち点, "27", "29"]
        - [得失点差, "+21", "+16"]
        - [得点÷失点, "3.10", "2.78"]
        - [1点差の勝ち, "1", "5"]
        - [80分以降の得点, "8", "4"]
      bars: [得失点差, 得点÷失点, 1点差の勝ち, 80分以降の得点]
      note: セリエA11試合。得点÷失点は自分で割った値
    say:
      - text: ここまでの数字を、並べます。
        image: assets/images/20261120_compare_roma_lazio/olimp2_w.jpg
        card: *viewcard
      - text: 勝ち点は、ラツィオが2点上。
        card: {<<: *viewcard, highlight_row: 勝ち点}
      - text: 得失点差は、ローマが5点上です。
        card: {<<: *viewcard, highlight_row: 得失点差}
      - text: 取った点が、取られた点の何倍か。ローマは31割る10で、3.10。
        card: &ratio_r
          type: calc
          title: 得点÷失点（ローマ）
          terms:
            - ['31点', 得点]
            - ['10点', 失点]
            - ['3.10', 倍]
          ops: ['÷', ＝]
      - text: ラツィオは25割る9で、2.78。
        card: &ratio_l
          type: calc
          title: 得点÷失点（ラツィオ）
          terms:
            - ['25点', 得点]
            - ['9点', 失点]
            - ['2.78', 倍]
          ops: ['÷', ＝]
      - text: 点で上回るのは、ローマ。勝ち点で上回るのは、ラツィオです。
        emph: true
        image: assets/images/20261120_compare_roma_lazio/olimp3_w.jpg
        card: {<<: *viewcard, highlight_row: 得点÷失点}
        mark:
          - {kind: circle, row: 2, col: 左の値}
      - text: 差を作ったのは、1点差の勝ち。ラツィオは5つ、ローマは1つ。
        card: {<<: *viewcard, highlight_row: 1点差の勝ち}
      - text: 終わり際の得点は、ローマが倍。ここは、ローマが上です。
        card: {<<: *viewcard, highlight_row: 80分以降の得点}
      - text: ただし、これからの試合で、数字は動きます。
        card: *viewcard
      - text: 再開は、現地11月21日。
        image: assets/images/20261120_compare_roma_lazio/olimp1_w.jpg
        card: none
      - text: ラツィオはホームでレッチェ、ローマはアウェーでパルマ。
        card: none
      - text: 次の物差しは、現地12月13日。同じ街どうしの対戦、ダービーです。今季の1回目。
        card: none
      - text: 2クラブの負けなしは、ダービーの前に、どちらかが止まるのか。
        card: none
    sources:
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/teams/104/schedule?fixture=true
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/teams/112/schedule?fixture=true
