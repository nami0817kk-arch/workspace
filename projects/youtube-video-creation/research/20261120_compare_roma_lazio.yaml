# 取材メモ（11/20 金、シリーズ「比べる」＝クラブ、key: compare_roma_lazio）。ローマ×ラツィオ（セリエA、同じローマ市・同じ本拠地）。
# **臨時の入れ替え**：この日11:00枠のクラブ紹介（ブンデス）が尽きたため「比べる」に。A組の日なので選手の比べは避け、クラブの比べにした。
# **情報の時点は 2026-11-12**（ESPN 取得 2026-11-12 夜。各クラブ11試合を終えた時点）。FotMob・DataMB は使っていない。
# 材料：ESPN 公開API（順位表 apis/v2/.../ita.1/standings・各クラブの日程 teams/104,112/schedule・試合ごとの summary の keyEvents と boxscore）。
#   控え：output/_tmp_compare2/（standings.json・sched.json・summ.json）。タイトルと創設・収容人数は Wikipedia 英語版（SS Lazio・AS Roma・Stadio Olimpico の Honours・Infobox。2026-11-12 取得）。
# **選んだ理由**：セリエAで「負けなし」の2クラブが同じ街にいる。ラツィオ1位（勝ち点29）・ローマ3位（27）。5大リーグの負けなしは4クラブだけ（バイエルン・ドルトムント・ラツィオ・ローマ）。
#   2クラブとも CL 常連ではないが、ローマ・ダービーは世界でも知名度が高い大物。最初のダービーは現地12月13日（ESPN 日程。ラツィオが主催）、2回目は4月18日（ローマが主催）。
#   **外した候補**：レアル・マドリード×アトレティコ（同じ日11/20のレジェンド＝ロベルト・カルロスとクラブが重なる）／リバプール×チェルシー（直近30日に比べるでは未登場だが、11/19 の選手紹介（ロジャーズ=チェルシー）と重なる）
#   ／マンチェスター・ユナイテッド×トッテナム（18位と11位で「近い順位」にならない）。ミランは 11/22 のレジェンド（シェフチェンコ）、ユベントスは 11/20 の監督紹介（デシャン）と重ねないよう避けた。
#   重なり確認：scripts・posted.json・covered.yaml・picks を grep。ローマとラツィオの2クラブ比較は初めて。ローマは 10/28 菅原（カリアリ戦）・10/31 財政・11/11 選手紹介（マレン）、
#   ラツィオは 10/20 ガットゥーゾ（ラツィオの試合後）が個別に出ているが、2クラブを並べる回は無い。**マレンは 11/11 に選手紹介を出した**ので、台本では1か所（得点者の節）だけ名前を出す。
# **自分で数えた値**（ESPN の試合記録から）：
#   得点・失点・勝分け：ローマ 31-10（8勝3分0敗・27点）／ラツィオ 25-9（9勝2分0敗・29点）。1試合あたり 31÷11=2.82／25÷11=2.27、失点 10÷11=0.91／9÷11=0.82。
#   シュート（boxscore の totalShots 合計）：ローマ 213本（枠内72）・受けた 129（枠内47）／ラツィオ 153本（枠内52）・受けた 131（枠内47）。1試合 19.4／13.9、枠内 6.5／4.7。平均ボール支配率 57.1%／53.7%。
#   勝ち方：1点差の勝ち ローマ1（アタランタ2-1）／ラツィオ5（1-0×2・2-1×3）。3点差以上の勝ち ローマ4（4-0×2・5-2・3-0）／ラツィオ2（3-0・6-2）。無失点 ローマ6／ラツィオ4。引き分け ローマ3（2-2・0-0・3-3）／ラツィオ2（2-2・1-1）。
#   得点者（オウンゴールを除く）：ローマ12人（マレン8・モーラ4・ピサッリ3・ソウレ3・2点が4人・1点が4人）＋オウンゴール1／ラツィオ12人（4点が3人＝フラッテージ・イサクセン・ノスリン、2点が3人、1点が6人）＋オウンゴール1。
#     最多の割合 8÷31=26%／4÷25=16%。
#   80分以降の得点：ローマ8（うち90分以降3）／ラツィオ4（90分以降0）。80分以降の失点：ローマ2／ラツィオ1。
#   ホーム／アウェー：ローマ ホーム6試合 17-5 勝ち点16（2.67）・アウェー5試合 14-5 勝ち点11（2.20）／ラツィオ ホーム5試合 10-5 勝ち点13（2.60）・アウェー6試合 15-4 勝ち点16（2.67）。
#     勝ち点の差2＝（アウェーでラツィオが5多い）－（ホームでローマが3多い）。
#   得点÷失点：31÷10=3.10／25÷9=2.78。
# タイトル（Wikipedia 英語版 Honours）：セリエA ローマ3（1942・83・2001）／ラツィオ2（1974・2000）、コッパ・イタリア 9／7、スーペルコッパ 2／5、欧州：ローマ=フェアーズ・カップ1961＋カンファレンスリーグ2022、ラツィオ=カップウィナーズ杯1999＋欧州スーパーカップ1999。
#   合計（セリエA・コッパ・スーペルコッパ・欧州）：3+9+2+2=16／2+7+5+2=16。**セリエB・アングロ・イタリアン杯は数えない**。創設 ラツィオ1900年1月9日／ローマ1927年。
# 本拠地：スタディオ・オリンピコ（同じ競技場を2クラブで使う）。収容人数 70,634（Wikipedia が引く内務省資料）、開場 1953年5月17日。
# 監督：ローマ=ガスペリーニ、ラツィオ=ガットゥーゾ（Wikipedia 英語版の現在の監督）。
# **次の物差し**：ダービー現地12/13（ラツィオ主催）。その前に 11/21 ラツィオ対レッチェ（ホーム）・パルマ対ローマ（アウェー）。
# 反応・本人の言葉：入れていない（数字で比べる回）。日本との接点：無し（入れない）。
# 写真：assets/images/20261120_compare_roma_lazio/credits.json に出どころを控えた（ガスペリーニ＝Quirinale 2024 を 11/15 の取材から再利用）。
