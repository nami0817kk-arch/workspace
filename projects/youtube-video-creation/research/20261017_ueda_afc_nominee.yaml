sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 報道
    telop: AFCが年間表彰のノミネートを発表。上田綺世が国際選手の候補に
    say:
      - アジアサッカー連盟は16日、年間表彰のノミネートを発表しました。
      - 上田綺世は、アジア年間最優秀国際選手の候補です。
      - 昨季のエールディビジ、得点王でした。
      - 候補は3人。ほかは韓国代表の2人です。
    official: false
    sources:
      - https://web.gekisaka.jp/news/japan/detail/?461134-461134-fl

  - id: youth
    heading: ユース賞は日本人が独占
    tier: 報道
    telop: 男子の年間最優秀ユース選手は、日本人3人が候補
    say:
      - 上田と同じ表彰で、男子の年間最優秀ユース選手も日本人3人が候補を独占しました。
      - 北原槙、市原吏音、佐藤龍之介です。
      - 市原は23歳以下のアジア杯で優勝、佐藤は同じ大会の最優秀選手。
      - 北原は17歳以下のアジアカップで最優秀選手になりました。
    official: false
    sources:
      - https://web.gekisaka.jp/news/japan/detail/?461134-461134-fl

  - id: view
    viewpoint: true
    heading: 候補6人のうち、日本人は何人か
    tier: 報道
    telop: 男子の2部門、候補6人のうち日本人は4人
    say:
      - 男子の国際選手とユースの2部門で、候補は合わせて6人です。
      - そのうち日本人は、上田を含めて4人です。
      - 日本人の国際選手の候補は、昨年の久保建英に続いて2年連続。
      - 受賞者は11月19日、タイの授賞式で発表されます。
    official: false
    sources:
      - https://web.gekisaka.jp/news/japan/detail/?461134-461134-fl
