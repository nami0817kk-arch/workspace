# 日本人選手 の取材メモ（2026年10月17日）
# 煽りの版（G・切り抜き＋背景）。足したのは「題の『快挙』」だけ（題と冒頭の読み上げ。冒頭は題を読むので同じ語）。
#   事実・数字・名称は出典のまま。上田は大きく見せる（切り抜きを画面いっぱいに）。答え（受賞者）は11月19日まで出ていないので言い切らない。
#   「まさかの」など驚きの語は足していない（上田は昨季得点王の候補で、意外とは言えない）。
# 取材: 2026-10-17。requests（ブラウザUA）でゲキサカの記事（461134、10/16 16:07）を全文読んだ。控え research/raw/20261017_gekisaka_afc.html・.txt。
#   AFC公式（the-afc.com）は当たったが、ノミネートのページは取れなかった（404）。他社の記事も取れなかった → 出典は1本。確度は「報道」（AFC発表をゲキサカが伝える形）。
# 出典の中身（そのまま）:
#   ・AFCは16日、年間表彰式「AFCアウォーズ2026」のノミネート選手を発表した。
#   ・男子のAFC年間最優秀ユース選手: 北原槙（FC東京→藤枝、U17アジアカップMVP）、市原吏音（AZ、U23アジア杯優勝）、佐藤龍之介（FC東京→バレンシア、U23アジア杯MVP）。日本人選手が候補を独占。
#   ・男子のアジア年間最優秀国際選手: 上田綺世（フェイエノールト→リール、昨季エールディビジ得点王）が、韓国代表のファン・インボム（フェイエノールト→ポルト）、イ・ガンイン（パリSG→アトレティコ）とともにノミネート。
#   ・日本人選手のノミネートは昨年の久保建英（ソシエダ）に続く2年連続。
#   ・受賞者は11月19日にタイで行われる「AFCアウォーズ2026」で発表。
#   ・（使わない）記事は「上田が受賞すれば2018年の長谷部誠氏以来6年ぶり」と書くが、2018年から2026年は8年。記事の数え間違いの疑いがあるので入れない。
#   ・（使わない）黒田剛監督（町田）のコーチ賞ノミネート、女子の部門。1本に問いは1つ。
# 見立ての数え: 男子の国際選手（3人）とユース（3人）の候補は合わせて6人。日本人はユース3人＋上田1人＝4人。自分で数えた。
# 賞の名称は出典のとおり（男子のAFC年間最優秀ユース選手／アジア年間最優秀国際選手）。
# 反応: 当たった先は nofootynolife.net のトップ（10/17 時点の新着に上田のAFC・三笘の記事なし）。0件。個別の投稿URLは取れる題材ではない。
# 写真（前日10/16に使った上田の写真は不使用: lepetitlillois／Commonsの2枚。10/15の losc.fr DSC04577 も使わない）:
#   03_g_v ＝ ゲキサカ（Kaoru WATANABE/GEKISAKA、10/6 の記事460373）の上田（日本代表18番、笑顔で親指）を切り抜き。
#   04_g_v ＝ LOSC公式サイトの選手一覧の上田（リール18番、両手を合わせる）を切り抜き。クラブの色は assets/crests に無いので紺のグラデーション。
