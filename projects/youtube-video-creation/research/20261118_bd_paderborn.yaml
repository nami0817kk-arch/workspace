  - text: 勝った2試合は、どちらもホームです。
    card: none
    image: assets/backgrounds/stadium_パーダーボルン_in.png
  - 第4節はホッフェンハイムに3対1の勝ち。第7節はハンブルガーSVに1対0の勝ち。
  - アウェー4試合は、0勝3引き分け1敗。勝ち点3は、ホームの7の半分に届きません。
  - 引き分けを勝ちに変えられるかが、これからの見どころです。
  - text: 11月21日には、アウェーでレバークーゼンと戦います。
    image: assets/backgrounds/stadium_パーダーボルン.png
