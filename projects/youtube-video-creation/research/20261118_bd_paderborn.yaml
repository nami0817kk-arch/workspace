  say:
  - text: パーダーボルンは、ここまで9試合で**2勝4引き分け3敗**です。
  - 順位は13位で、勝ち点は10。
  - 勝ち点は、17位シャルケの6より4多い。
  - 16位ウニオン・ベルリンの7と比べても、3多くなっています。
  - text: 引き分けは**4**。ウニオン・ベルリンと並んで、18クラブで最多です。
    card:
      type: stats
      title: 今季のリーグ戦（9試合）
      items:
