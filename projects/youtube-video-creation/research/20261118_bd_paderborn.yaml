sections:
- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 2014年から3年連続で降格の順位。2026年に3度目の1部昇格。今季は9試合で3敗4分け
  narrator: キャスター
  say:
  - text: 2014年から3年続けて、1部でも2部でも3部でも、降格する順位でした。
    image: assets/stats/bd_paderborn_data_r1.png
    no_telop: true
  - text: それが2026年に、3度目の1部昇格を果たしました。
    image: assets/stats/bd_paderborn_data_r2.png
    no_telop: true
  - text: 今季は9試合を終えて、負けは3つ。引き分けは4つです。
    image: assets/stats/bd_paderborn_data_r3.png
    no_telop: true
  - image: assets/stats/bd_paderborn_data0.png
    text: 合併したのは**1985年**。クラブ名の「07」は、前身の創立年、1907年に由来します。
    no_telop: true
  - image: assets/stats/bd_paderborn_data1.png
    text: クラブの色は、青と黒。
    no_telop: true
  - image: assets/stats/bd_paderborn_data2.png
    text: ホームタウンは、ノルトライン＝ヴェストファーレン州のパーダーボルンです。
    no_telop: true
  - image: assets/backgrounds/stadium_パーダーボルン.png
    text: 本拠地はホーム・デラックス・アレーナ。収容は**1万5000人**です。
  - image: assets/stats/bd_paderborn_data4.png
    text: 会員は**1万1300人**います。
    no_telop: true
  - image: assets/stats/bd_paderborn_cups.png
    text: タイトルは、地域のカップ優勝が**9回**。
    no_telop: true
  - image: assets/stats/bd_paderborn_data6.png
    text: 1部には、2014年、2019年、2026年と、3回上がっています。
    no_telop: true
  - image: assets/stats/bd_paderborn_data7.png
    text: 初めての1部で、第4節のあとには、首位に立ちました。
    no_telop: true
  - image: assets/stats/bd_paderborn_data8.png
    text: 昨シーズンは、2部で**3位**。入れ替え戦に勝って、昇格を決めました。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/SC_Paderborn_07
  - https://en.wikipedia.org/wiki/2026–27_SC_Paderborn_07_season
  - https://de.wikipedia.org/wiki/SC_Paderborn_07
  - https://site.api.espn.com/apis/v2/sports/soccer/ger.1/standings
  bg: assets/backgrounds/stadium_パーダーボルン_in.png
  official: false
- id: rise
  heading: 1部から3部まで落ちたパーダーボルンは、どうやって1部に戻ってきたのか
  tier: 背景
  telop: 2014年に初の1部。1部と2部で最下位、3部も18位。2017年から2年連続で昇格
  narrator: 解説
  main: true
  say:
  - text: 2014年。パーダーボルンは、初めての1部に上がります。
    card:
      type: table
      title: パーダーボルンの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 2014-15
        - 1部で18位、降格
      - - 2015-16
        - 2部で最下位、降格
      - - 2016-17
        - 3部で18位
      - - 2017-18
        - 3部2位、2部へ
      - - 2018-19
        - 2部2位、1部へ
  - ただ、1部は1年で終わります。最終順位は、18位でした。
  - 翌2015年から16年は、2部でも18位。3部に落ちます。
  - text: 2016年から17年は、3部でも18位。3年続けて、降格の順位でした。
    card: none
    image: assets/backgrounds/stadium_パーダーボルン.png
  - ところが、ミュンヘン1860がライセンスを得られず、4部へ移ります。
  - おかげでパーダーボルンは、3部に残ることができました。
  - 立て直したのは、シュテフェン・バウムガルト。
  - 監督になった4月から、5試合で勝ち点11を取ります。
  - 翌季は2位で、2部へ。その次の年も2位で、1部へ戻りました。
  - 2019年から20年の1部は、勝ち点20で18位。1年で、2部に戻ります。
  sources:
  - https://de.wikipedia.org/wiki/SC_Paderborn_07
  - https://en.wikipedia.org/wiki/SC_Paderborn_07
  bg: assets/backgrounds/stadium_パーダーボルン_in.png
  official: false
