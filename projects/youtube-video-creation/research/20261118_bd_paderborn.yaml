- id: episode
  heading: パーダーボルンは2026年、なぜ3位から1部に上がれたのか
  tier: 背景
  telop: 2025年から26年の2部は3位。入れ替え戦でヴォルフスブルクに合計2対1
  narrator: 解説
  card:
    type: table
    title: 2025年から26年の2部
    columns: &id001
    - ''
    - ''
    rows:
    - - 最終節の前
      - 3チームが勝ち点59
  say:
  - text: 2025年から26年の2部。最終節を前に、3つのクラブが勝ち点59で並びました。
    image: assets/backgrounds/stadium_パーダーボルン_in.png
  - エルフェルスベルク、ハノーファー、そしてパーダーボルンです。
  - 自動昇格は2枠。優勝のシャルケは、すでに決まっていました。
  - text: 2位は、エルフェルスベルク。パーダーボルンは、3位になりました。
    card:
      type: table
      title: 2025年から26年の2部
      columns: *id001
      rows:
      - - 最終順位
        - 3位（2位はエルフェルスベルク）
  - 3位は、自動では上がれません。
  - 入れ替え戦の相手は、1部のヴォルフスブルクでした。
  - text: 1試合目は、アウェーで0対0の引き分け。
    card:
      type: table
      title: 2025年から26年の2部
      columns: *id001
      rows:
      - - 入れ替え戦
        - ヴォルフスブルクに合計2対1
  - 2試合目は、ホームです。延長にもつれ込み、2対1で勝ちました。
  - 合計は2対1の勝ち。パーダーボルンは、3度目の1部を決めました。
  sources:
  - https://de.wikipedia.org/wiki/SC_Paderborn_07
  - https://en.wikipedia.org/wiki/SC_Paderborn_07
  bg: assets/backgrounds/stadium_パーダーボルン_in.png
  official: false
