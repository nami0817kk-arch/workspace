- id: season
  heading: 引き分けの多いパーダーボルンは、それを勝ちに変えられるのか
  tier: 報道
  telop: 11月12日時点で9試合2勝4分3敗。勝ち点10で13位。引き分けは18クラブで最多タイ
  narrator: 解説
  card:
    type: table
    title: ブンデスリーガの結果
    columns:
