  head: キャリック、続投。12試合で2勝のマンU、土曜のチェルシー戦も指揮へ。ネヴィル「本当に驚いた」
  why: ESPN（27日）。キャリック監督は火曜朝8時前に練習場に入り、通常どおり練習を指揮。土曜のチェルシー戦も指揮を執る見込み（ESPNの取材源）。ボーンマスに0-3で敗れ16位、公式戦12試合で2勝、CLではコモに1-4。フロントは、ボーンマス戦でファンの不満が監督より選手に向いていたことに注目（同）。元主将ネヴィル（スカイ）「驚いた。でもうれしい。日曜に見たものでマイケルは終わりだと確信していた」「別れの一周のようだった」。<b>条件：W杯・代表には当たらない。本人の言葉は無い（続投は取材源の話、言葉はネヴィル）</b>。確度：報道（クラブの発表は無い）。写真：キャリックはコモンズに多数。<b>弱い：10/27 の候補に「首脳陣と3時間の協議」を出した（その続報）。クラブの正式発表が無い</b>。時刻：18時以降。見せ方：X。
