  head: ロス五輪の最終予選は日本で。2028年1月、出場枠はアジアから2つだけ
  why: ゲキサカ（27日）。AFCが、U23アジアカップを2028年1月4日〜22日に日本で開くと決めた（2013年の創設以来、初の日本開催）。ロサンゼルス五輪の最終予選を兼ね、男子の出場枠は12か国に減り、アジアは2か国だけ。「決勝進出」が五輪出場の条件になるとみられる。来年1〜2月のアジア杯（サウジ）が開けなくなった場合は1年延期の可能性があり、延期なら28年1月が有力で、日程の重なりをどう避けるかが課題。<b>条件：日本代表（U-23）に当たる。A代表のアジア杯の可否にも絡む。本人の言葉は無い</b>。確度：開催は確定、延期の話は見立て。写真：人物の題ではない（監督・スタジアムの写真が要る。3枚は未確認）。<b>弱い：U-23 の話。10/27 に「アジア杯の日程」を作った（延期の可能性の話が重なる）</b>。時刻：9〜17時。見せ方：X。
