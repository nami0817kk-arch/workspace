  head: 佐藤龍之介、アギーレ就任から出場0分。今夜の国王杯で先発の見込みと地元紙
  why: フットボールゾーン（28日、地元紙スーペルデポルテの報道）。バレンシアの日本代表MF佐藤龍之介（20歳）は、開幕後は先発もあったが、成績不振で監督が替わり、元日本代表監督のハビエル・アギーレが就任してから「まだ1分も出場していない」。28日の国王杯タベルネス戦（日本時間29日朝5時）でアギーレは主力を休ませる考えで、佐藤は「先発の大きな変更点の一つとなりそうだ」と同紙。<b>条件：日本代表に当たる（アギーレも元日本代表監督）。本人の言葉は無い</b>。確度：報道止まり（先発は試合前の見込み）。写真：佐藤のバレンシアでの写真は未確認、代表・岡山時代はコモンズにある見込み。<b>弱い：試合は公開のあと（朝5時）なので結果が言えない。covered に「ビルバオ戦も出番なし」がある</b>。時刻：9〜17時。見せ方：X。
