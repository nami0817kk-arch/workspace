  head: 人口2万6000人の4部クラブが、プレミア王者アーセナルを倒した。ドローンで9分止まった夜
  why: ゲキサカ（28日）・ESPN（27日）。リーグカップ4回戦、フリートウッド・タウン（4部）1-1 アーセナル、PK戦5-3でフリートウッドがクラブ史上初の8強。フリートウッドは英北西部の港町（人口約2万6000人）で、ヴァーディがレスター移籍の直前にいたクラブ。前半2分、未許可のドローンで約9分中断。21分にルパロビが先制、後半5分にギェケレシュが今季公式戦初ゴールで追いつく。85分、16歳のダウマンが報復行為で一発退場。ESPN「フットボールリーグのクラブになって15年で一番大きな試合」。<b>条件：W杯・代表には当たらない。本人の言葉は無い</b>。確度：確定。写真：アーセナル側（ギェケレシュ・ダウマン）はコモンズにある見込み、フリートウッドの選手は少ない見込み。<b>弱い：本人の言葉が無い。covered にダウマンの最年少記録の話がある</b>。時刻：18時以降。見せ方：X。
