  head: 板倉滉が負傷から戻った。ドイツ杯で77分から、10人のボルシアMGは2-0で勝ち抜け
  why: ESPN（試合記録）。27日のドイツ杯2回戦、ボルシアMG 2-0 カールスルーエ（2部）。7分にハックが先制、39分にザンダーが一発退場で10人になったが、49分にウルリッヒが追加点。町野修斗は先発、板倉滉は77分から出場（左の中殿筋の筋線維断裂からの戻り。復帰が近いという監督の話は Qoly などの見出しで見たが、本文は読めていない）。相手のカールスルーエでは福田師王が先発。<b>条件：日本代表に当たる（板倉・町野）。本人の言葉は無い</b>。確度：出場は確定（試合記録）、けがの名前は見出しだけ。写真：板倉・町野はコモンズ・クラブ公式にある見込み。<b>弱い：本人の言葉が無い。日本語の本文を読めていない。10/24 に町野の本、10/26 のシリーズ選手紹介に板倉（player_624690）</b>。時刻：9〜17時。見せ方：X。
