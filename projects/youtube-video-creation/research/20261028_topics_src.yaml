  head: 佐野海舟は「トップフォームにない」とビルト。そして火曜、マインツはドイツ杯で2部ボーフムに敗れた
  why: フットボールゾーン（27日、独ビルトの報道）。マインツの日本代表MF佐野海舟（25歳）は、過去2年で68試合中1回しか途中交代が無かったのに、今季すでに3度目。夏にクリスタル・パレス移籍が迫り（プライベートジェットまで用意）、クラブが6000万ユーロを求め3000万ユーロの申し出を断った経緯をビルトが説明し「前シーズンのトップフォームにはない」。ブンガートSD「海舟が評価されるハードルは、今や信じられないほど高くなっている」。さらに27日のドイツ杯2回戦、マインツはボーフムに0-2で敗退（佐野は先発、川崎颯太は84分から。ESPNの試合記録）。<b>条件：日本代表に当たる。本人の言葉は無い（SDの言葉）</b>。確度：評価は報道、敗退は確定。写真：マインツ公式・ブンデス公式にある見込み（未確認）。<b>弱い：10/28 のシリーズ本編「マインツ（bd_mainz）」と同じクラブ・同じ選手の話になる。マイナスの話</b>。時刻：9〜17時。見せ方：X。
  src: フットボールゾーン（ビルト）、ESPN（試合記録）
