  head: ケイン、バイエルンに戻ると職員が花道。「トッテナムがなければ、今の僕はいない」
  why: ESPN（27日）。火曜に練習場へ戻ったケインを、バイエルンの職員が両側に並んで「ハリー、ハリー」の声で迎えた。本人はSNSで「どこから話せばいいのか。一生忘れない夜になった」。受賞スピーチでは「トッテナムに感謝したい。トッテナムがなければ、今の僕は間違いなくいない」「11歳からいた」と古巣に触れ、指導者のラムジー、シャーウッド、メイソンの名を挙げた。イングランドの仲間へ「完璧な1年ではなかったけど、いい時間がたくさんあった」「これはみんなのものだ」。<b>条件：W杯に当たる（イングランド3位）。本人の言葉あり</b>。確度：確定。写真：ケインはコモンズに多数。<b>弱い：10/27 に「ケインのバロンドール」を作った。その続き</b>。時刻：18時以降。見せ方：Y。
