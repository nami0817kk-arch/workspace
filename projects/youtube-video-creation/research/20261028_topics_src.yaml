title: 10月28日のショート題材
lead: 火曜の欧州の試合（リーグカップ・ドイツ杯）とバロンドールの後日談を中心に約40件から19件（日本人9件・海外10件）。ショート10本ぶんを○で選んでください。
note: 今日は水曜（28日）、日本時間の朝に集めました。<b>火曜の大きな出来事は、リーグカップでフリートウッド（4部）がアーセナルにPK勝ち（10）と、マンUのキャリック続投の見込み（11）</b>。ドイツ杯2回戦では、フランクフルト3-1HSV（堂安律先発・小杉啓太50分から）、ボルシアMG 2-0 カールスルーエ（町野先発・板倉が77分から復帰、相手に福田師王）、マインツ0-2ボーフム（佐野海舟先発・川崎颯太84分から）。セリエAはローマ4-2カリアリ（菅原由勢先発）。リーグカップのブライトン・パレス・リヴァプールなどの試合は水曜（日本時間29日朝）で、まだ結果がありません。<br><br><b>日本人の題は9件（1〜9）、海外は10件（10〜19）、計19件です。</b>目安の25件に届きませんでした。<b>日本人で本人の言葉があるのは小杉啓太（5）だけで、それも本文は冒頭しか読めていません</b>。火曜に試合に出た日本人は試合後の言葉が見つからず、11月の日本代表・ブラジル戦の新しい動きもありませんでした（29日のブラジル代表のメンバー発表待ち）。<b>日本人の題はどれも弱め</b>です。強いて挙げるなら 4（板倉の復帰）・1（守田、監督の言葉）・3（佐野、ただし本編マインツと重なる）。弱い題で埋めないよう、日本人は少なめにして海外を厚くするのも手です。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは、1〜7・9（日本代表）、8（U-23）、12（ヤマル・W杯優勝）・13（エムバペ）・14（ケイン・W杯3位）・15（デンベレ）。本人（監督を含む）の言葉が取れたのは 1（監督）・5（本人、未確認部分あり）・12・13・14・15・16（監督）・18（監督）。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外。<br><br><b>写真：</b>今回はコモンズの検索をしていません。各行の「写真：」は見込みです。<b>佐藤龍之介（2）・小杉啓太（5）・菅原由勢（7）・田中聡（9）は今のクラブでの写真が未確認、8（ロス五輪）・10（フリートウッド）・19（デモ）は人物の写真3枚がそろいにくい</b>。<br><br><b>重なりの注意：</b>10/27 に作ったケイン・ヤマル・エムバペ2位の続き（12・13・14）と、バロンドール関連（15）が4件。1〜2件に絞るのを推奨します（12と13が新しい出来事）。<b>3（佐野・マインツ）は 10/28 のシリーズ本編 bd_mainz と同じクラブ</b>。5（小杉・フランクフルト）は 10/24 の bd_frankfurt と同じクラブ、10/28 の compare に堂安が出ます。16 のヴィラ戦は 10/26・27 に鈴木彩艶の側で2本。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使わない決まりのため読めませんでした（移籍の題は出していません）。サッカーキングは一覧は読めたが記事ページの多くが「見つかりません」になり、フランス・フットボール編集長の「ケインとエムバペは僅差」は本文を読めず落としました。Qoly（板倉の復帰）・DAZN（三笘の復帰時期）・Goal（ドイツ杯）・REAL SPORTS（小杉）の2ページ目以降は本文を読めていません（Google ニュースの見出しで見ただけ）。ESPN（一覧API・記事API・試合記録）・ゲキサカ・フットボールゾーンは本文を読みました。FotMob は使っていません。女子サッカー・Jリーグ・MLS・英2部・ベルギーは出していません。
