  head: 小杉啓太「改善が必要」。昨季は出場ゼロ、今季は開幕から先発のフランクフルトで抱く危機感
  why: REAL SPORTS（26日、中野吉之伴氏の取材）。今年1月にフランクフルトに入ったが、昨季はシーズン終了まで公式戦に1度も出られなかった。今季はヒュッター新監督のもと左サイドバックで開幕から6試合続けて先発。U-21日本代表としてアジア競技大会で銀。記事の章題は「信頼していた監督の解任で試練『ああいう時期も必要』」「『リツくんみたいに…』試合を動かせる選手への進化」。27日のドイツ杯ではHSVに3-1で勝ち、小杉は50分から、堂安律は先発（ESPN）。<b>条件：日本代表は U-21（A代表の招集は未確認）。本人の言葉あり（ただし本文は冒頭しか読めず、言葉は見出し・章題で見ただけ）</b>。確度：取材。写真：小杉のフランクフルトでの写真は未確認。<b>弱い：本文の続き（2ページ目以降）が読めていない。A代表の話ではない。10/24 のシリーズ「フランクフルト（bd_frankfurt）」と同じクラブ</b>。時刻：9〜17時。見せ方：Y（本文を読めたら）。
  src: REAL SPORTS（取材）、ESPN（試合記録）
