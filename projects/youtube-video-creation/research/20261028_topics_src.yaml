  head: 田中聡、シャルケで「数え切れないほどの穴を埋めた」。地元サイトの採点は2
  why: フットボールゾーン（27日、シャルケ専門サイトの採点）。24日のシャルケ 0-0 ケルンで日本代表MF田中聡（24歳）はフル出場。採点（1が最高）は「2」で「自陣ペナルティーエリアの手前で、数え切れないほどの穴を埋めた守備の働き」。終盤のシュートはポストの外側をたたいた。シャルケは16位（プレーオフ圏）。28日にドイツ杯でドレスデンと対戦。<b>条件：日本代表に当たる。本人の言葉は無い</b>。確度：確定（採点は専門サイト）。写真：田中聡はコモンズ（湘南・代表）にある見込み、シャルケでは未確認。<b>弱い：試合は4日前。他人の評価だけ</b>。時刻：9〜17時。見せ方：X。
