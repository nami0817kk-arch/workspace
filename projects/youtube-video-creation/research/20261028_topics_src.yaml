  head: 守田英正は「ロボットではなく人間」。ハルの監督が明かした、途中出場が続く理由
  why: フットボールゾーン（27日、英「ハル・ライブ」の報道から）。プレミアのハル・シティのMF守田英正は、ふくらはぎの問題で9月から離脱。10月に練習へ戻り、11日のエヴァートン戦から3試合続けて途中出場。ヤキロヴィッチ監督「最後にプレーしてから、かなり時間がたっていました。彼はロボットではなく、人間です。時間も、試合を戦うためのコンディションも必要ですし、リズムを取り戻す必要があります。ただ、これは私の課題ですから、解決しようと思っています」。先発は8月29日のコヴェントリー戦が最後で、今週末はイプスウィッチ戦。<b>条件：日本代表に当たる。言葉は監督（本人の言葉は無い）</b>。確度：確定（監督の会見）。写真：守田本人はコモンズ（スポルティング・代表時代）にある見込み、ハルでの写真は未確認。<b>弱い：出来事は小さい（起用の説明だけ）</b>。時刻：9〜17時。見せ方：Y（監督の言葉）。
  src: フットボールゾーン（ハル・ライブ）
