  head: エムバペが謝罪。「中国の独裁者」発言で中国の3社が契約を切った
  why: ESPN・ゲキサカ（27日）。エムバペがフランスの番組の前の取材で、好きな自分のネットミームを聞かれ「中国の独裁者の体に自分の顔を合成したもの」と答えた動画が広まり、飲料のドンポン、乳業の蒙牛、チーズのミルクグラウンドの3社が「国民感情を傷つける言動に反対する」として契約を終えた。本人はSNSで「その発言は配慮に欠けており、中国の多くの方々や、世界中の中国人コミュニティーの方々を傷つけてしまったことを、今は理解しています」「心から申し訳なく思っています」。ラ・リーガの会長も謝罪（見出しで見た）。<b>条件：W杯に当たる（エムバペはW杯歴代最多得点）。本人の言葉あり（謝罪声明）</b>。確度：確定。写真：エムバペはコモンズに多数。<b>弱い：政治に触れる話で、扱いに注意が要る。10/27 に「エムバペ2位」を作った</b>。時刻：18時以降。見せ方：Y。
