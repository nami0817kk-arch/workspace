  head: 町野は「1トップの方が絶対にいい」。上田綺世を欠く11月の代表へ、元日本代表の推し
  why: フットボールゾーン（27日、太田宏介氏の話）。ボルシアMGの町野修斗は23日のシュトゥットガルト戦で今季2点目、チームの今季初勝利を呼んだ。先発は1試合、出場は202分。太田氏「監督というのはこういう“持っている選手”を使いたくなる」。上田綺世（リール）が負傷離脱中で、11月の代表へ「僕はシャドーより1トップの方が絶対にいいと考えています」「アジアカップを考えれば引いて守る相手との戦いが必然的に多くなる」。<b>条件：日本代表に当たる（11月の代表）。本人の言葉は無い（OBの言葉）</b>。確度：見立て（OBの意見）。写真：町野はコモンズ・クラブ公式にある見込み。<b>弱い：他人の言葉だけ。ゴールは5日前で 10/24 に「町野、ボルシアMGの初勝利」を作った</b>。時刻：9〜17時。見せ方：X。
