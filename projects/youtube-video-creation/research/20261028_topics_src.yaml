  head: ヤマル「必ず来る。いいことには時間がかかる」。バロンドール3位の翌日に書いたこと
  why: ESPN（27日）。バロンドールで3位だったヤマル（19歳）が火曜夜にSNSで「必ず来る。いいことには時間がかかる。自分が築いている道を信じている」「焦りはない。いつか自分の番が来るという、わくわくした気持ちと落ち着いた確信だけ」「受賞者の皆さん、おめでとう。いまはいちばん大事なこと、バルセロナをまた勝たせることに集中する」。ゲキサカ（27日）ではラポルタ会長「彼はいずれバロンドールを受賞すると確信している」「これが彼のモチベーションになることを願う」。<b>条件：W杯に当たる（スペインのW杯優勝）。本人の言葉あり</b>。確度：確定（本人のSNS）。写真：ヤマルはコモンズに多数。<b>弱い：10/27 に「ヤマルとクバルシ」、10/24 に「バロンドール前夜の言葉」を出した。3本目のヤマルの言葉になる</b>。時刻：18時以降。見せ方：Y。
