    heading: ワールドカップの前と、比べてみる
    tier: 報道
    telop: 佐野海舟と鈴木彩艶が、1000万ユーロずつ上がった
    narrator: 解説
    card:
      type: table
      title: 6月から9月で上がった人（ユーロ）
      columns: ["", "6月", "9月", "上がった額"]
      rows:
        - ["佐野海舟", "4000万", "5000万", "+1000万"]
        - ["鈴木彩艶", "2000万", "3000万", "+1000万"]
        - ["上田綺世", "1700万", "2000万", "+300万"]
    say:
      - text: '日本代表31人の市場価値が、新しく出ました。9月18日時点の数字です。'
        short_only: true
      - ワールドカップの前、6月の数字と比べます。
      - "**大きく上がったのは2人だけ**でした。"
      - まず**佐野海舟**。4000万ユーロから**5000万ユーロ**へ、1000万上がりました。
      - 次に**鈴木彩艶**。2000万ユーロから**3000万ユーロ**へ。こちらも**1000万**です。
      - 上田綺世は1700万ユーロから2000万ユーロへ。上がったのは300万でした。
      - "**ほかの選手は、ほとんど動いていません。**"
    sources:
      - https://www.footballchannel.jp/2026/06/23/post926307/
      - https://www.footballchannel.jp/2026/09/22/post1015854/
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: 上がった2人について言われていること
    narrator: キャスター
    say:
      - voice: ネット民
        text: 日本の価値的には相対的にザイオンが一番価値ある選手
      - voice: ネット民
        text: 変えが効かなくなりそう
      - voice: ネット民
        text: 佐野海舟はオランダ戦からのパフォーマンスが凄かった
      - voice: ネット民
        text: 市場価値って実際の年俸ともリンクしないし
      - voice: ネット民
        text: 本人にとってもクラブにとってもほとんど意味のない指標だと思うな
      - voice: ネット民
        text: 自分がクラブのフロントなら、どんなにいい選手でも怪我持ちはやめとけって言う
      - voice: ネット民
        text: 年齢を見て安心した。次回ワールドカップが楽しみだ
      - voice: ネット民
        text: 身長も高い選手が増えましたね
      - voice: ネット民
        text: 日本のファンは彼を「佐野リカバリー」と呼ぶ
      - voice: ネット民
        text: 相手からボールを取り返すために生まれてきたようだ
      - voice: ネット民
        text: カンテのようにピッチ中を走り回る
      - voice: ネット民
        text: 日本人だからと過小評価して、獲る価値がないと決めつける人が多い
      - voice: ネット民
        text: 完全に間違っている
      - voice: ネット民
        text: Jリーグ時代から見ているが、全盛期のカンテを超えるポテンシャルがある
        short_voice: true
    sources:
      - https://www.youtube.com/watch?v=pHNyrUgBrqs
      - https://www.youtube.com/watch?v=GbIbl61-z0k
