        - {label: "久保建英", value: 2000}
        - {label: "上田綺世", value: 2000}
    say:
      - 1位は**佐野海舟**。**5000万ユーロ**です。
      - 2位が**鈴木彩艶**で3000万ユーロ。3位は鈴木唯人の2400万。
      - 4位に久保建英、5位に上田綺世が並びます。どちらも2000万です。
      - text: 6位から10位は、伊藤洋輝、堂安律、前田大然、田中碧、中村敬斗の順でした。
        card:
          type: table
          title: 6位から10位
