    tier: 報道
    telop: 代表31人の市場価値。9月18日時点の数字
    narrator: キャスター
    say:
      - text: 日本代表31人の市場価値が出ました。
        short_only: true
      - 9月18日時点の数字です。今月と来月の代表活動に呼ばれた31人が対象です。
      - 市場価値は、移籍金そのものではありません。**その選手にいくら出せるかの目安**です。
      - まず、上位5人からです。
    sources:
      - https://www.footballchannel.jp/2026/09/22/post1015854/
      - https://www.footballchannel.jp/2026/09/22/post1015845/
  - id: top5
    heading: 上位5人
    tier: 報道
    telop: 1位は佐野海舟の5000万ユーロ
    narrator: 解説
    card:
      type: bars
      title: 日本代表の市場価値（万ユーロ）
      unit: 万ユーロ
      items:
        - {label: "佐野海舟", value: 5000}
        - {label: "鈴木彩艶", value: 3000}
