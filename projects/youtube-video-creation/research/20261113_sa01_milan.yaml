  say:
  - ミランの今季の監督は、ポルトガル人のルベン・アモリム。**41歳**です。
  - 選手のときは、ポルトガル代表として、ワールドカップに2度出ています。
  - 監督としては、スポルティングで、リーグ優勝を2度。
  - 2024年にマンチェスター・ユナイテッドへ移ります。
  - 2025年には、ヨーロッパリーグの決勝に進みました。
  - 率いたのは、2026年1月までです。
  - ミランの監督になったのは、2026年6月です。
