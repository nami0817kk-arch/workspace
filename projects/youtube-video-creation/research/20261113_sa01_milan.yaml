- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: クラブの色は赤と黒。名前は英語のつづり。本拠地サン・シーロは地区の名前
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - クラブの色
      - 赤と黒
    - - クラブ名
      - 英語のつづり
    - - サン・シーロ
      - 地区の名前
  say:
  - クラブの色は、赤と黒です。
  - 創立者のキルピンが、前のクラブから持ってきたシャツの色でした。
  - 赤は選手の燃える情熱。黒は、相手の恐れを表すと、キルピンは語りました。
  - クラブ名は、英語のつづりの「ミラン」。イタリア語の「ミラノ」ではありません。
  - 本拠地のサン・シーロは、地区の名前です。
  - 正式な名前は、ジュゼッペ・メアッツァ・スタジアムです。
  sources:
  - https://en.wikipedia.org/wiki/AC_Milan
  bg: assets/backgrounds/stadium_ミラン_in.png
  official: false
- id: episode
  heading: 1991年から93年、ミランはなぜ、58試合も負けなかったのか
  tier: 背景
  telop: 1991年5月から93年3月、リーグ戦58試合負けなし。1991年から92年は無敗で優勝
  narrator: 解説
  card:
    type: table
    title: 58試合の無敗
    columns: &id001
    - ''
    - ''
    rows:
    - - 無敗の試合数
      - 58試合
    - - 始まり
      - 1991年5月、パルマと0対0
  say:
  - text: 1991年。サッキに代わって監督になったのは、元選手のカペッロです。
    image: assets/backgrounds/stadium_ミラン_in.png
  - この年から、ミランは3年続けて、リーグ優勝します。
  - 負けない日々の始まりは、1991年5月26日。パルマと0対0の引き分けでした。
  - 1991年から92年は、リーグ戦で1度も負けずに優勝します。
  - text: 無敗で優勝したのは、イタリアの1部で初めてです。
    card:
      type: table
      title: 58試合の無敗
      columns: *id001
      rows:
      - - 終わり
        - 1993年3月、パルマに0対1
      - - 1991-92年
        - 負けなしで優勝
  - 前にシーズン無敗だったのは、1978年から79年のペルージャだけ。ただ2位でした。
  - 負けなしは、**58試合**続きます。セリエAの記録です。
  - 止めたのは、1993年3月21日。ホームでのパルマ戦で、0対1で負けました。
  - 始まりも終わりも、パルマとの試合でした。
  sources:
  - https://en.wikipedia.org/wiki/AC_Milan
  bg: assets/backgrounds/stadium_ミラン_in.png
  official: false
