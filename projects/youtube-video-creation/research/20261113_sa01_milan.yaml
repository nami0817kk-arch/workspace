        - CSKAモスクワから加入
      - - 2014-15年
        - リーグ戦29試合6得点
      - - 2017年
        - パチューカへ
  - 2014年1月、ロシアのツェスカモスクワから加わりました。
  - 2017年までのリーグ戦は、**81試合9得点**。
  - 2014年から15年は、リーグ戦**29試合6得点**でした。
  - text: 2017年に、メキシコのパチューカへ移ります。
    card: none
    image: assets/backgrounds/stadium_ミラン_in.png
  sources:
  - https://en.wikipedia.org/wiki/Keisuke_Honda
