- id: rise
  heading: 2部に落ちたミランは、どうやって欧州王者に戻ったのか
  tier: 背景
  telop: 1980年に八百長事件の罰で初の2部。1986年にベルルスコーニが買収。1989年から欧州王者
  narrator: 解説
  main: true
  say:
  - text: 1980年。ミランは、八百長事件の罰で、初めて2部に落とされます。
    image: assets/backgrounds/stadium_ミラン_in.png
    card:
      type: table
      title: ミランの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 1980年
        - 八百長事件で初めて2部へ
      - - 1983年
        - 2度目の2部優勝で1部へ
      - - 1986年
        - ベルルスコーニが買収
      - - 1989年
        - 欧州王者に（翌年も）
      - - 2007年
        - 7度目の欧州王者
  - 1年で2部を優勝して戻りますが、翌年にまた落ちます。
  - 1983年に、2度目の2部優勝で、1部へ戻りました。
  - text: 1986年。実業家のシルヴィオ・ベルルスコーニが、倒産寸前のクラブを買います。
    card: none
    image: assets/backgrounds/stadium_ミラン.png
  - 巨額のお金を入れて、監督にアリゴ・サッキを呼びました。
  - 獲得したのは、オランダ代表のフリット、ファン・バステン、ライカールトです。
  - 1988年、9年ぶりのリーグ優勝。
  - 翌年は、ヨーロッパの頂点を決める決勝で、ステアウア・ブカレストに4対0で勝ちます。
  - 翌1990年も、ベンフィカに1対0で勝ちました。
  - 連覇は、2017年にレアル・マドリードが達成するまで、ミランが最後でした。
  - 1994年は、決勝でバルセロナに4対0で勝ちました。
  - 2003年は、PK戦でユベントスに勝ちます。
  - 2007年は、リヴァプールに2対1で、7度目の優勝です。
  sources:
  - https://en.wikipedia.org/wiki/AC_Milan
  bg: assets/backgrounds/stadium_ミラン_in.png
  official: false
