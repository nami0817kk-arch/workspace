  - id: said
    heading: 監督が語ったこと
    main: true
    tier: 報道
    telop: 「まだ最高の状態ではない」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 久保の回は数字だけだった。こちらは**理由が語られている**のが違い
    say:
      # **ショートだけの前置き**。本編では前の節で言い終えている
      - {short_only: true, text: リヴァプールの遠藤航は、チャンピオンズリーグのリーグフェーズの登録からも外れています。}
      - この状況について、アンドニ・イラオラ監督が口を開きました。
      - {voice: イラオラ, text: ワタは、プレシーズンでかなり多くの時間でチームに参加できていなかった。まだ最高の状態ではないが、非常に良いトレーニングを積んでいるところだ}
      - もうひとつ、理由を挙げています。
      - {voice: イラオラ, text: 問題なのは、彼のポジションには多くの選手がおり、競わなければならない。現在はトレイ、ライアン、アレクシス、ドムといった選手たちがプレータイムを得ている}
      - そのうえで、こう続けました。
      - {voice: イラオラ, text: しかし、ワタも間違いなく私が気に入っている選手だ。今後は彼にも必ず活躍の場が訪れるはずだ}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260913/2204594.html

