    say:
      - text: ヴォズィーニャは、ポルトガル2部から、ひと夏で世界の顔へ。
        image: assets/images/20260929_capeverde_gk_w/01.jpg
      - 得たのはコロコロと、GK版バロンドールの候補。失ったのは、レストランに行く自由。
      - 有名になれば元には戻れない。本人がしたのは、インスタの通知を切ることでした。
      - 次はチリで、コパ・リベルタドーレスを目指すと話しています。
