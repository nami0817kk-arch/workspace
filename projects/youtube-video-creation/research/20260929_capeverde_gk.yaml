  heading: 得たものと失ったもの
  tier: 背景
  telop: 得たのはコロコロと候補の座。失ったのは、レストランに行く自由
  narrator: 解説
  say:
  - text: ヴォズィーニャがしたのは、インスタの通知を切ること。有名になれば、元には戻れません。
    image: assets/images/20260929_capeverde_gk_w/01.jpg
  - 得たのはコロコロと、GK版バロンドール、ヤシン・トロフィーの候補の座。失ったのは、レストランに行く自由。
  - 次はチリで、南米のクラブ王者を決めるコパ・リベルタドーレスを目指すと話しています。
