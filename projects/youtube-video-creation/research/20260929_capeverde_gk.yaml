  - id: words
    main: true
    heading: 「平穏が失われた」
    tier: 報道
    telop: 「今の生活か以前の生活か、選べと言われたら」
    narrator: キャスター
    say:
      - text: W杯で時の人になったヴォズィーニャが、一変した日常を明かしました。
        short_only: true
      - text: 世界中に顔を知られた、いまの毎日。本人はこう話しています。
        image: assets/images/20260929_capeverde_gk_w/01.jpg
      - voice: ヴォズィーニャ
        text: 平穏が失われた。もはやプライバシーなんてない。
      - voice: ヴォズィーニャ
        text: 少なくとも、以前よりずっと少なくなった。
        cont: true
      - voice: ヴォズィーニャ
        text: 今ではレストランに行くと、
        cont: true
      - voice: ヴォズィーニャ
        text: 必ず誰かが写真を撮ろうとしたり、サインを求めてくる。
        cont: true
      - voice: ヴォズィーニャ
        text: さらに悪いことに、勝手に動画を撮られることだってあるんだ。
        cont: true
      - voice: ヴォズィーニャ
        text: 私の人生で最も変わった点であり、どうすることもできない
        cont: true
      - voice: ヴォズィーニャ
        text: 多くの人が有名になり、世間に顔が知れ渡ることを望んでいるが、
      - voice: ヴォズィーニャ
        text: 彼らは現実の明るい側面しか見ていない。
        cont: true
      - voice: ヴォズィーニャ
        text: 正直なところ、今の生活か以前の生活か
        cont: true
      - voice: ヴォズィーニャ
        text: どちらかを選べと言われたら、私は以前の生活を選ぶだろう
        cont: true
      - 国のことを聞かれると、言葉は変わりました。
      - voice: ヴォズィーニャ
        text: 私たちは歴史を築いた。
      - voice: ヴォズィーニャ
        text: この勢いを活かして国を発展させることができるのであれば、
        cont: true
      - voice: ヴォズィーニャ
        text: それが何よりの朗報だよ
        cont: true
      - voice: ヴォズィーニャ
        text: ある種の大使のような役割を担えることは嬉しいが、
      - voice: ヴォズィーニャ
        text: 私たちが成し遂げたことはチーム全員の努力の賜物であると
        cont: true
      - voice: ヴォズィーニャ
        text: はっきりさせておきたい
        cont: true
