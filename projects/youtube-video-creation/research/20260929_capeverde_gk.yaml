            - [6月27日 サウジアラビア, 0-0, 3]
            - [7月3日 アルゼンチン, 2-3 延長, 8]
      - 4試合すべてにフル出場。ラウンド32では、アルゼンチンを延長戦まで追い詰めました。
      - フォロワーは、大会前の5万6000人が、初戦が終わると100万人を超えました。
      - いまは3000万人近く。8月には、チリの名門コロコロに移りました。
      - ヤシン・トロフィーの候補、10人にも名を連ねています。
