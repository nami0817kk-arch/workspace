      - text: ヴォズィーニャ、40歳。夏までは、ポルトガル2部のシャベスにいました。
        image: assets/images/20260929_capeverde_gk_w/01.jpg
      - text: 初戦のスペイン戦。27本のシュートを浴びて7本を止め、無失点で引き分けました。
        card:
          type: table
          title: ヴォズィーニャの2026年W杯（4試合フル出場）
          columns: [相手, 結果, セーブ]
          rows:
