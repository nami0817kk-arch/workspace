    image: assets/images/20261025_kit_everton/g03_main.jpg
    card: none
    emph: true
  - text: ネクタイは、1938年のシーズンの初日に、お披露目されます。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card: none
  - text: そのシーズン、エヴァートンは、リーグを制します。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card: none
    emph: true
