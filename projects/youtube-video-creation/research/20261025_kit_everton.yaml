      highlight_row: 0
  - text: では、なぜ牢屋が、紋章になったのか。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
    emph: true
  - text: 1938年、クラブの秘書、セオ・ケリーが、クラブのネクタイを作ろうとします。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card:
      type: timeline
      title: 紋章の塔の歩み（クラブ公式・ウィキペディア）
