        - 3案から投票。1万343票、約8割
      - - 2014年7月
        - 新しい紋章を使い始める
      highlight_row: 1
  - text: ただ、ユニフォームの業者との段取りで、その年は、新しい紋章のまま。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card: none
  - text: 2013年10月3日、3つの案から、ファンの投票。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
