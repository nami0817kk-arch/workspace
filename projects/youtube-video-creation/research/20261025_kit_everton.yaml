# ユニフォームとエンブレムの歴史 エヴァートン（10/25 作成）。雛形は 10/24 アストン・ヴィラ回。
# 題の問い：エヴァートンの紋章の塔は、もとは何の建物で、なぜ紋章になったのか。
# 重なり確認（2026-10-25）：scripts/・research/covered.yaml の kit_*・research/posted.json を grep。エヴァートンのユニフォーム回は無し
#   （20261022_stadium_everton はスタジアム、20260920_pl09_everton はクラブ紹介、20261010_moyes_everton はニュース。いずれも別シリーズ）。
# 取材：requests（ブラウザ User-Agent）・WebFetch・WebSearch（URL探しと裏取り）。ブラウザ操作・JS実行・検索のAI要約を根拠にはしていない。
#   読んだ：ウィキペディア en "Everton F.C."（Colours and badge／Nickname／Shirt sponsors and manufacturers／Honours）、"Everton Lock-Up"、"NEC"。
#   クラブ公式の紋章の歴史（2012年の web.archive 控え）：ケリーの「4か月悩んだ」、月桂樹＝勝者、モットーの意味、1938/39 初日に披露・その季に優勝。
#   クラブ公式 2024-06-14（キャストアと契約、2024/25 から）。BBC 2013-05-27・2013-10-03、ガーディアン 2014-07-04、インディペンデント 2013-10。
#   readeverton.com（ファンのサイト。胸の会社の一覧・CMC が10社目）。
# ---- 食い違い・断ったこと ----
#   ・紋章がシャツに付いた年：ウィキペディアと BBC は1978年、クラブ公式（2012年控え）は1980年→台本に入れない。
#   ・NEC の期間：ウィキペディア 1985〜1995、readeverton 1985〜1996→「1985年から、およそ10年」とだけ言う。1986/87 はどちらでも含む。
#     1986/87 の優勝シャツに NEC が載っていた写真・一次の記録は見ていない（期間からの推論）→「優勝したころの胸」と言い、「優勝シャツ」とは言い切らない。
#   ・投票の割合：BBC「ほぼ80%」、ガーディアン「78%」→「およそ8割」。
#   ・2026/27 のホームの細部（襟・差し色）はサイト間で割れ、クラブ公式の原文に届かない→入れない。
#   ・いまの紋章に「1878」が入っているかは今回の出典で確かめていない→言わない（残したもの4つは2013年のクラブの説明）。
# ---- 自分で数えた数 ----
#   2026−1938=88年（塔が紋章に）。2026−1901=125年（ロイヤルブルー）。1938→2013=75年（モットー。BBC も「75年」）。
#   胸の会社：ハフニア・NEC・ダンカ・ワン・ツー・ワン・ケジャン・チャン・スポーツペサ・カズー・ステーク・CMC＝10社（ウィキペディアの一覧。readeverton も「10社目」）。
#   2026−1979=47年、47÷10=4.7年。88÷4.7≒18.7→「およそ19倍」。1787−1644=143年（ウィキペディアは「almost 150 years」→「およそ150年あと」）。
# ---- 日本との接点 ----
#   日本人選手の在籍は無し（research/pl_data/japan.json でも無し）。接点は胸の広告の NEC（東京に本社。ウィキペディア NEC）。第2節に置いた。女子チームの話は入れていない。
# ---- 写真（assets/images/20261025_kit_everton/、出典は credits.json）----
#   Commons の CC のみ（塔3枚・グディソン3枚）。代理店・放送映像なし。10/22 スタジアム回の写真とは別のファイル。エンブレム画像は使っていない。
