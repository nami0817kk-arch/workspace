      focus: 1938年
      highlight_row: 2
  - text: ケリー本人の言葉が、クラブに残っています。4か月、悩んだ、と。
    image: assets/images/20261025_kit_everton/g03_main.jpg
    card: none
  - text: そして、地区の真ん中に立つ、この塔を描くことにしました。
    image: assets/images/20261025_kit_everton/g03_main.jpg
    card: none
  - text: 両わきには、月桂樹の輪。昔から、勝者の印です。
    image: assets/images/20261025_kit_everton/g03_main.jpg
    card:
