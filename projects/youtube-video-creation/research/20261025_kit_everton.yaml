  - text: 選ばれた案は、1万343票。投票した人の、およそ8割です。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
