      highlight_row: 2
    emph: true
  - text: 当時の監督、ロベルト・マルティネスの言葉です。
    image: assets/images/20261025_kit_everton/g03_main.jpg
    card: none
  - text: ファンは、塔とモットーを見たがっていた。ニル・サティスが戻るのは大事だ、と。
    image: assets/images/20261025_kit_everton/g03_main.jpg
    card: none
  - text: 新しい紋章を使い始めたのは、2014年の7月です。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
