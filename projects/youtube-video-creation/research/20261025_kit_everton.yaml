  - text: 今回は、エヴァートンの、胸の紋章です。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
    emph: true
  - text: 真ん中にあるのは、石の塔。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
  - text: この塔は、リバプールのエヴァートン地区に、いまも立っています。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
