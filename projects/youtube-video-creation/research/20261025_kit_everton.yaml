        - 3案から投票。1万343票、約8割
      - - 2014年7月
        - 新しい紋章を使い始める
      highlight_row: 0
  - text: ねらいは、小さく印刷しても、見分けやすいこと。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
  - text: 残したのは、塔と、盾と、クラブの名前と、創立の年。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card: none
  - text: 消えたのは、月桂樹の輪と、ラテン語のモットーでした。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card: none
    emph: true
  - text: ファンの反対の署名は、2万2000人を超えます。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
      columns:
