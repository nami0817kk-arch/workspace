- id: motto
  heading: 75年続いたモットーは、なぜ1シーズンで紋章に戻ったのか
  bg: assets/images/20261025_kit_everton/e01_tower.jpg
  tier: 報道
  narrator: 解説
  telop: 2013年5月の紋章でモットーが消え、署名は2万2000人超。投票の紋章で2014年7月に戻った
  card:
    type: table
    title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
    columns:
    - いつ
    - できごと
    rows:
    - - 2013年5月
      - 新しい紋章。モットーと月桂樹が消える
    - - 同じ5月
      - 反対の署名。のちに2万2000人を超える
    - - 2013年10月3日
      - 3案から投票。1万343票、約8割
    - - 2014年7月
      - 新しい紋章を使い始める
    highlight_row: 0
  say:
  - text: 紋章の下にある、ラテン語のモットー。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
  - text: これが一度、エヴァートンの紋章から消えたことがあります。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
    emph: true
  - text: 2013年の5月。クラブは、新しい紋章を出しました。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
