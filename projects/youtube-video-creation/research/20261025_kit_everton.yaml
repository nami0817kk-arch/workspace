      - - 同じ5月
        - 反対の署名。のちに2万2000人を超える
      - - 2013年10月3日
        - 3案から投票。1万343票、約8割
      - - 2014年7月
        - 新しい紋章を使い始める
      highlight_row: 1
  - text: クラブは、謝りました。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
