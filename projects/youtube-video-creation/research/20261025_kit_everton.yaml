      - - 2014年7月
        - 投票の紋章。モットーが戻る
      focus: 1938年
      highlight_row: 0
  - text: ただ、塔ができたのは、その、およそ150年あとです。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card:
      type: timeline
