        - 3案から投票。1万343票、約8割
      - - 2014年7月
        - 新しい紋章を使い始める
      highlight_row: 0
  - text: クラブの歴史で、10番目の形です。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card:
      type: table
      title: 2013〜14年の紋章の騒ぎ（BBC・ガーディアン）
