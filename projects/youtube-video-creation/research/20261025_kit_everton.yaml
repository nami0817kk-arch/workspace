- id: view
  viewpoint: true
  heading: 見立て・塔は88年、胸の会社は10社。何が動いて、何が動かないのか
  bg: assets/images/20261025_kit_everton/e01_tower.jpg
  tier: 背景
  narrator: 解説
  telop: 塔は88年、青は125年。胸の会社は47年で10社、平均4.7年。モットーが消えたのは1シーズン
  card:
    type: table
    title: 動いたものと、動かないもの
    columns:
    - もの
    - 続いた長さ
    rows:
    - - 紋章の塔（1938年から）
      - 88年
    - - ロイヤルブルー（1901年から）
      - 125年
    - - モットーが消えた期間
      - 1シーズン
    - - 胸の会社（1979年から）
      - 47年で10社
    highlight_row: 0
  say:
  - text: エヴァートンの塔、青、胸の広告。長く続いたものと、すぐ替わったものを比べます。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card: none
    emph: true
  - text: 塔が紋章に入って、88年。ロイヤルブルーは、125年。
    image: assets/images/20261025_kit_everton/e01_tower.jpg
    card:
      type: table
      title: 動いたものと、動かないもの
      columns:
      - もの
      - 続いた長さ
      rows:
      - - 紋章の塔（1938年から）
        - 88年
      - - ロイヤルブルー（1901年から）
        - 125年
      - - モットーが消えた期間
        - 1シーズン
      - - 胸の会社（1979年から）
        - 47年で10社
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: 一方、胸の会社は、1979年から47年で、10社。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: table
      title: 動いたものと、動かないもの
      columns:
      - もの
      - 続いた長さ
      rows:
      - - 紋章の塔（1938年から）
        - 88年
      - - ロイヤルブルー（1901年から）
        - 125年
      - - モットーが消えた期間
        - 1シーズン
      - - 胸の会社（1979年から）
        - 47年で10社
      highlight_row: 3
  - text: 47を10で割ると、4.7。ひとつの会社は、平均で5年たらずです。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: calc
      title: 胸の会社1社の平均（自分で割った）
      terms:
      - - 47年
        - 1979年から
      - - 10社
        - 胸の会社
      - - 4.7年
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 塔は、その平均の、およそ19倍の長さ、続いています。
    image: assets/images/20261025_kit_everton/g01_goodison.jpg
    card:
      type: calc
      title: 塔は胸の会社の何倍か（自分で割った）
      terms:
      - - 88年
        - 塔
      - - 4.7年
        - 胸の会社の平均
      - - 約19倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: そして、モットーが紋章から消えていたのは、1シーズンだけ。
    image: assets/images/20261025_kit_everton/e02_towerblue.jpg
    card:
      type: table
      title: 動いたものと、動かないもの
      columns:
      - もの
      - 続いた長さ
      rows:
      - - 紋章の塔（1938年から）
        - 88年
      - - ロイヤルブルー（1901年から）
        - 125年
      - - モットーが消えた期間
        - 1シーズン
      - - 胸の会社（1979年から）
        - 47年で10社
      highlight_row: 2
  - text: ファンが戻したのは、胸の広告ではなく、塔とモットーの側でした。
    image: assets/images/20261025_kit_everton/e02_towerblue.jpg
    card: none
    emph: true
  - text: この先、紋章を変えるというクラブの発表は、確かめた範囲では、出ていません。
