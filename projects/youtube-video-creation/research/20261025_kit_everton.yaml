        - 新しい紋章。モットーが消える
      - - 2014年7月
        - 投票の紋章。モットーが戻る
      focus: 1938年
      highlight_row: 1
  - text: もとは、村の牢屋です。酔っぱらいや、軽い罪の人を、一晩入れておく場所でした。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card: none
    emph: true
  - text: 呼び名は、プリンス・ルパートの塔。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card: none
  - text: 1644年、ルパート王子の軍が、この丘に陣を張った話から来ています。
    image: assets/images/20261025_kit_everton/e03_tower3.jpg
    card:
      type: timeline
      title: 紋章の塔の歩み（クラブ公式・ウィキペディア）
