# スタジアム紹介シリーズ：ハル・シティの本拠地（エムケーエム・スタジアム、10/29 19:00 予定）。雛形は 10/28 コヴェントリーの回。
# 重なりの確認（2026-10-28）：scripts/*stadium_* は20本（サン・シーロ〜コヴェントリー）。ハル無し。covered.yaml・posted.json にも stadium_hull は無い。
#   クラブ紹介⑪ハル・シティ（posted.json の pl11 系、9月公開）は別シリーズで、軸は「4部から5年でプレミア」と名前を変えられかけた話。この回は本拠地の持ち主・旧本拠地・入場が軸。
#   守田英正の本（10/18 フラム戦の75分・10/28「ロボットではなく人間」）とは、本拠地での出場2試合の1行だけ重なる。監督の言葉・離脱の話は入れない。
# 今季のプレミア所属（一次情報）：ESPN の順位（2026-27 English Premier League）にハル・シティ 10位・8試合・勝ち点10。PL公式の試合API（2026/27 第1〜10節）にもハルの試合がある。
# 収容（PL公式ハンドブック2026/27 の Club Directory: Hull City、控え research/raw/20261021_nufc_plhandbook.txt 1031〜1047行）：24,983・ピッチ 104.8×67.2m。所在地 MKM Stadium, West Park, Hull HU3 6HU。
#   20クラブの並び（同じハンドブック）：17位クリスタル・パレス 25,194／18位ハル 24,983／19位ブレントフォード 17,250／20位ボーンマス 12,357／1位マンU 74,158。
#   自分で引いた・割った：25,194-24,983=211／24,983-17,250=7,733／24,983÷74,158=0.3369＝約34％／55,019÷24,983=2.202＝約2.2倍／34,000-24,983=9,017。
# 本拠地の歴史（ウィキペディア en "MKM Stadium"、控え scratchpad の hull/MKM_Stadium.txt）：
#   持ち主はハル市議会、運営は Stadium Management Company。費用は約4400万ポンド、うち4200万ポンド超を市が出した（市が持っていた Kingston Communications の株の一部を売った）。
#   1997年に構想。12か所以上を比べてウェスト・パークの「サークル」に。旧本拠地のひとつ「サークル」の競技場から約100メートル。イングランドで初めて公園の中に建ったスタジアム。
#   2001年初めにクラブが管財人の管理下に。2001年秋に着工、14か月で予定どおり・予算どおりに完成。2002年12月18日に開場（親善試合でサンダーランドに1対0、2万2467人）。最初の公式戦はハートルプールに2対0。
#   ラグビーリーグのハル FC が2か月後に入る（2003年2月9日が最初の試合）。席は黒・白・琥珀：黒と白はハル FC、黒と琥珀はハル・シティの色で、どちらにも寄らないように。北と南のスタンドに席で「Hull」の字。
#   名前：KC Stadium（2002〜2016）→ 2016年4月4日、スポンサーの改名で KCOM Stadium → 2021年6月、建材の MKM Building Supplies と5年の契約で MKM Stadium。
#   2011年、当時のオーナーのアッサム・アラムが本拠地の所有権を買いたいと言い、市が断った。
#   本拠地でのハル・シティの最多入場は 25,030（2010年5月9日、リヴァプールに0対0）。ホームとアウェーの客を分ける区画のため、表の収容に届くことはない。
#   広げる計画：東スタンドの2階4500席・北と南に約2000席ずつで、約3万4000席（市と運営会社が以前に検討）。昨季（2部）の平均入場 21,400。
# 旧本拠地（ウィキペディア en "Boothferry Park"）：1946年8月31日に開場（未完成のまま、リンカーン・シティと0対0、2万5586人）。最多入場は1949年2月26日、FAカップ準々決勝のマンチェスター・ユナイテッド戦で5万5019人（クラブのホームの試合で今も最多）。
#   1990年代、クラブの財政が苦しかった頃に、スタジアムの建物の中にスーパー（アイスランド・クイックセーブ）の店が入った。閉じたときの収容 15,160。2002年12月14日に閉場、2008〜2011年に取り壊し、跡地は住宅。
# 入場（PL公式の試合API、2026/27 の第1・3・6・8節）：8/22 マンU 24,470（2対0で勝ち）／9/5 ヴィラ 24,425／10/11 エヴァートン 24,458／10/25 ブレントフォード 24,259
#   → 合計97,612・平均24,403＝収容の97.7％（24,403÷24,983=0.9768）。いちばん多いマンU戦でも 24,983-24,470=513 届かない。昨季の平均との差 24,403-21,400=3,003。
#   次の本拠地戦は 10/31 のイプスウィッチ戦（同じAPI、第9節、現地15:00）。
#   比べ：コヴェントリーの今季ホーム4試合は平均31,248・95.8％（10/28 の回の控え）、フォレストは平均30,746・98.5％（10/27 の回の控え）。どちらも同じAPI。
# 日本との接点（サッカーの縁）：守田英正。2026年7月24日に加入、2年契約（クラブの延長の権利が1年）（ウィキペディア、出典はクラブ公式 wearehullcity.co.uk）。前はポルトガルのスポルティング。日本代表40試合（ウィキペディアの infobox）。
#   この本拠地でのリーグ戦は2試合、どちらも途中から（10/11 エヴァートン戦75分から・10/25 ブレントフォード戦72分から。ESPN の試合記録、10/28 の守田の取材メモの控え）。
# 言わなかったもの：ラグビーの成績・入場／コンサート／ホスピタリティの細部／ハル・フェアともめた話／安全な立ち見席（2700席）の細部／アラム時代の抗議の中身／UEFA の大会での呼び名。
#   KC が何の略かは、今回読めた出典では言い切れないので言わない。本拠地全体の最多入場（U-21 の代表戦 25,280）は使わない。
# 写真：assets/images/20261029_stadium_hull/（credits.json）。01・02 は Commons の本拠地の内観（既に 1920x1080 に切ってあった背景の写真）。03 は守田（Commons・CC0・2026-10-17 フラム対ハル）。
#   旧本拠地の写真は Commons が 429（取り込みの上限）で取れなかった。
