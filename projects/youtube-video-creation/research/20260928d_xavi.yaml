      - ミールディンクはAZでも、今季リーグ戦7試合すべてに先発し、3得点2アシストです。
      - マレンが抜けた時点で、シャビの手元のセンターフォワードは、ブロビー1人でした。
      - そのブロビーがドイツ戦で負傷し、セルビア戦の先発がミールディンクに回りました。
      - 本人は、ほかにも良いストライカーはいるので、毎日練習を続けるだけだと話しています。
      - text: オランダは勝ち点4で2位。10月1日に敵地で首位ギリシャ、4日にホームでセルビアと戦います。
