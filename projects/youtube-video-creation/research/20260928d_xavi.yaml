    say:
      - text: 新監督シャビが率いるオランダが、ネーションズリーグで敵地のセルビアに2対1。就任後初の勝利。
        short_only: true
      - 2点とも、初先発の23歳ミールディンク。30分のPKで先制し、69分に勝ち越しました。
      - PKのキッカーは本来ガクポ。そのガクポは、前半に足首を痛めて退いていました。
      - voice: シャビ
        text: 彼には満足している。点を取ったからだけではない
      - voice: シャビ
        text: よく走り、プレスとこぼれ球の争いで、大事な役割を果たした
      - ただ、ミールディンクは最初、このメンバーに入っていませんでした。
      - 外れたとき本人は、もっと良くならないといけないと話していました。
      - text: 9月20日、けがで抜けたマレンの代わりに追加招集。24日のドイツ戦でデビューしたばかりです。
        card:
          type: table
          title: ミールディンクの1週間
          columns: [日付, 出来事]
