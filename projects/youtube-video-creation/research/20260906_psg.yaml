- id: why
  heading: 監督は何と言ったか
  tier: 報道
  telop: ルイス・エンリケ「見えたものには満足している」
  say:
  - voice: キャスター
    text: ところが、ルイス・エンリケ監督は、まったく動じていません。
    card:
      type: quote
      source: Luis Enrique（会見）
      color: '#004170'
      text: I'm pleased with what I've seen. We're not at our best yet, but we deserved to win this match. The xG are in our favor.
      translation: 見えたものには満足している。まだ最善ではないが、この試合は勝つに値した。xG は我々に有利だ
  - voice: ルイス・エンリケ
    text: 見えたものには満足している。まだ最高の状態ではないが、この試合は勝つに値した。
    image: assets/images/luisenrique/01.jpg
  - voice: ルイス・エンリケ
    text: エックスジー、期待ゴール数は、我々のほうが上だ。
    telop: 「説明はできない。サッカーは時に不可解だ」
  - voice: ルイス・エンリケ
    text: どう説明するか。サッカーは、ときに不可解なものだ。選手たちの姿勢を強調しておきたい。
  official: false
  sources:
