      - → 開幕3試合未勝利は14年ぶり
  - voice: キャスター
    text: 試合の数時間前、クラブは監督とのけいやくを、にせんさんじゅうねんまで延ばすと発表していました。
  - voice: キャスター
    text: 主力数人の延長も、同じ日です。クラブは、いまの内容を信じている、ということになります。
    telop: クラブは、いまの内容を信じている
  - voice: キャスター
    text: つぎに見るべきは、次節です。ここで勝てなければ、内容の話は通らなくなります。
    telop: 次節で勝てなければ、内容の話は通らない
    card:
