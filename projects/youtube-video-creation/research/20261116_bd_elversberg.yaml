- id: episode
  heading: エルフェルスベルクは、1点差で届かなかった翌年に、なぜ1部へ上がれたのか
  tier: 背景
  telop: 2025年の入れ替え戦は、合計3対4で敗れた。2026年は、最終節に3対0で勝って2位
  narrator: 解説
  card:
    type: table
    title: 1部まで、あと1点だった年
    columns: &id001
    - ''
    - ''
    rows:
    - - 入れ替え戦（2025年）
      - 合計3対4で敗退
  say:
  - text: 2025年の5月。2部3位のエルフェルスベルクは、入れ替え戦に臨みます。
    image: assets/backgrounds/stadium_エルフェルスベルク_in.png
  - 相手は、1部のハイデンハイムでした。
  - 勝てば、クラブ初の1部でした。
  - 1試合目は、2対2で引き分け。続く2試合目は、ホームで1対2の負け。
  - text: ハイデンハイムの決勝点は、試合終了間際のロスタイムでした。
    card:
      type: table
      title: 1部まで、あと1点だった年
      columns: *id001
      rows:
      - - 監督
        - シュテフェンから交代
  - 合計は3対4の負け。たった1点差で、昇格を逃しました。
  - シュテフェン監督は、その5月にクラブを離れて、ブレーメンの監督になります。
  - 後任は、ヴィンセント・ヴァーグナー。
  - 主将を含む11人が出て、13人が加わる大きな入れ替えでした。
  - text: それでも、シーズンは好調です。第8節で、この季はじめて首位に立ちました。
    card:
      type: table
      title: 1部まで、あと1点だった年
      columns: *id001
      rows:
      - - 2026年
        - 2部2位、初の1部
  - 冬には、前半戦で12得点のユネス・エブヌタリブが、フランクフルトへ移ります。
  - そして最終節。ミュンスターに3対0で勝って、2位。初めての1部が決まりました。
  sources:
  - https://de.wikipedia.org/wiki/SV_Elversberg
  - https://en.wikipedia.org/wiki/SV_Elversberg
  bg: assets/backgrounds/stadium_エルフェルスベルク_in.png
  official: false
