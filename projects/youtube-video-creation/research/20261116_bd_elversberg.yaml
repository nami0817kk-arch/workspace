  say:
  - text: エルフェルスベルクの本拠地の名前は、大きな木に由来します。
    image: assets/backgrounds/stadium_エルフェルスベルク_in.png
  - そばにあった木の名前は、カイザーリンデ。
  - その木は、2015年の3月に、嵐で倒れてしまいました。
  - いまの名前は、製薬会社ウルサファームの命名権です。
  - 2014年に、10年契約を結びました。
  - クラブの色は、黒と白です。
