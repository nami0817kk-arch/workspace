- id: rise
  heading: 4部で優勝したエルフェルスベルクは、どうやって2部まで駆け上がったのか
  tier: 背景
  telop: 2022年に4部で優勝。2023年に3部で優勝。2024年から25年は、2部3位
  narrator: 解説
  main: true
  say:
  - text: 2022年。エルフェルスベルクは、4部のリーグで優勝して、3部に上がります。
    card:
      type: table
      title: エルフェルスベルクの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 2022年
        - 4部で優勝、3部へ
      - - 2023年
        - 3部で優勝、2部へ
      - - 2025年
        - 2部3位、入れ替え戦で敗れる
      - - 2026年
        - 2部2位、初の1部
  - 監督は、ホルスト・シュテフェン。2018年の11月から率いていました。
  - 翌年の3部でも、首位で終えます。2023年、2部への昇格が決まります。
  - text: 2部の1年目は、11位でした。
    card: none
    image: assets/backgrounds/stadium_エルフェルスベルク.png
  - 2年目の2024年12月。クラブの歴史で初めて、2部の首位に立ちます。
  - 前半戦を終えて、4位。後半戦はリーグで2番目に良い成績で、3位に入りました。
  - 3位でも、昇格できるとは限りません。
  - 1部の16位との入れ替え戦が待っていました。
  - ここまでが、4部優勝から3年です。
  sources:
  - https://de.wikipedia.org/wiki/SV_Elversberg
  - https://en.wikipedia.org/wiki/SV_Elversberg
  bg: assets/backgrounds/stadium_エルフェルスベルク_in.png
  official: false
