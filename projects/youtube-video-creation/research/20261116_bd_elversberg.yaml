- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 2022年に4部で優勝。2026年に初の1部。今季は9試合で7位。開幕戦はレバークーゼンに勝利
  narrator: キャスター
  say:
  - text: 2022年は4部のリーグ。そのクラブが、2026年は初めて1部です。
    image: assets/stats/bd_elversberg_data_r1.png
    no_telop: true
  - text: 昇格したばかりの今季は、9試合を終えて7位です。
    image: assets/stats/bd_elversberg_data_r2.png
    no_telop: true
  - text: 開幕戦では、レバークーゼンに3対2で勝ちました。
    image: assets/stats/bd_elversberg_data_r3.png
    no_telop: true
  - image: assets/stats/bd_elversberg_data0.png
    text: 創立は**1907年**。1914年に一度解散して、1918年に作り直されました。
    no_telop: true
  - image: assets/stats/bd_elversberg_data1.png
    text: 愛称は「黒と白」。クラブの色も、黒と白です。
    no_telop: true
  - image: assets/stats/bd_elversberg_data2.png
    text: ホームタウンは、ザールラント州のシュピーゼン＝エルフェルスベルクです。
    no_telop: true
  - image: assets/backgrounds/stadium_エルフェルスベルク.png
    text: 本拠地はウルサファーム・アレーナ。1部の基準に合わせて、増築を進めています。
  - image: assets/stats/bd_elversberg_data4.png
    text: 会員は**1万4千人**を超えます。
    no_telop: true
  - image: assets/stats/bd_elversberg_data6.png
    text: ドイツカップでは、2010年にハノーファー、2022年にレバークーゼンを破りました。
    no_telop: true
  - image: assets/stats/bd_elversberg_cups.png
    text: タイトルは、2023年の3部優勝。4部の優勝は、2017年と2022年の2回です。
    no_telop: true
  - image: assets/stats/bd_elversberg_data7.png
    text: 1部は、今季が初めてです。2026年の5月に、昇格が決まりました。
    no_telop: true
  - image: assets/stats/bd_elversberg_data8.png
    text: 昨シーズンは、2部で**2位**。勝ち点は59でした。
    no_telop: true
