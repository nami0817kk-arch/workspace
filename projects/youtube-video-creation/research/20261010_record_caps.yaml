# 取材メモ（10/10 土、シリーズ「記録の解説」、key: record_caps、型は news）。
# 材料の控えは research/raw/20261010_record_caps_material.md。**この控えの外へ出ていない。**
#
# 軸は「**代表の通算出場は、何年かけた数字なのかまで見ないと順番が決まらない**」。
#   山場の頭に置く強い一点は、材料 §9 が推した (c)。
#   **1年あたりに直すと先頭はロナウドではなく、1984年に代表を終えたソー・チンアン**（13.08 対 10.13）。
#   表の1位と比べの1位が入れ替わるので、②の表の板がそのまま効く。
#
# **材料 §0 の枠をそのまま守った**:
#   1. 数えたのは「フィファが公式と認めた試合」だけ。**「A マッチ」の条文は取れていない**ので
#      （材料 §5(1)・§8）、語りは「フィファが公式と認めた試合」という言い方だけにした。
#   2. **食い違いは必ず両方出す**。ソー・チンアン 195 と 219、アルムタワ 196 と 202 を
#      ④の表（card: table）に並べ、語りでも両方読む。片方だけにしていない。
#   3. **主役は日本人にしない**（10-05 の決まり）。日本は③の1行だけで、名前も出さない。
#      題にもサムネにも出さない。
#   4. **女子の記録は一切入れていない**（材料にも書かれていない）。
#   6. アルファベットは読み上げに出さない（FIFA →「フィファ」、UEFA は「ヨーロッパ」で言い換え）。
#
# 直前2本と重ねないようにしたもの（材料 §9）:
#   10/6 ケインの回… 「歴代◯位」「あと1つ」「◯年かけた数に、◯年半で迫った」「同じ◯試合の時点で比べると」
#     「1年に直すと、◯◯は◯試合ほど」「塗り替わる日」「王手」は**一度も使っていない**。
#     順位は「上位」「2番目」「表の5番目」と言い換えた。ケインは③の1行（シルトンと並んだ事実）だけ。
#     ケインの得点記録・監督・契約の話は出さない。120試合時点の比べも出さない。
#   10/9 1シーズン最多得点の回… 「点の数だけでは順番が決まらない」「◯試合あたりでは上回る」
#     「リーグ戦だけで数えた」「全公式戦では」「いまの試合数に置き直すと」「順番が入れ替わります」は使わない。
#     calc は**あちらが ÷ × ＝ の3段なので、こちらは ÷ ＝ の2段と「◯倍」**にした（§9 の指示どおり）。
#     レヴァンドフスキは出さない（あちらの主役）。メッシは①の表と語りで「208試合」としてだけ出し、
#     1シーズン50得点の話はしない。
#
# 数字の時点: **すべて2026年10月6日時点**（英語版 Wikipedia の一覧が止まっている日）。
#   ②の読み上げで「10月6日時点」と声に出している。
#
# 自分で計算した数（材料 §6 に式と元の数字がある）:
#   1年あたり（出場 ÷ 期間の長さ。1年＝365.2425日）、10.13 ÷ 6.37 ＝ 1.59倍、
#   13.57 ÷ 8.5 ＝ 1.60倍、大陸ごとの1国あたり（201÷26＝7.73 ほか）。
#   §4(A) の年代ごとの試合数は、材料を作った側が Wikipedia の原文から年ごとに数えたもの。
#
# **言い切っていないもの**:
#   交代5人は**制度が変わった事実までで止めた**（材料 §4(D) の注意。通算出場が伸びた原因だと言わない）。
#   1試合あたりの得点は**上位10人ぶん取れていない**ので出していない（材料 §6 比べ⑤の注記）。
#   モドリッチ・アルハイドスが200に届くかの見込みは言わない（材料 §7）。
# 反応は入れない（シリーズの回。ブラウザの道具を使っていないので集めていない）。
# **本人の言葉は1つも無い**（材料 §7。引用したい言葉が取材できていない）。だから voice_min: 0。
#
# 写真は2枚。入れ替えは1本1回（冒頭＝ロナウド → 山場の2行目から下地のスタジアム）。
#   ロナウドは `src.cli portrait` で取った 2026年7月のポルトガル戦の1枚で、
#   **10/8 の回とは別のファイル**（-075 cropped と -154）。`tools/facecrop.py` で 01_w / 01_v を切り、
#   ショートの差し替え用に 01_w_v も置いた（無いと `01_w` が縦に中央だけ切られて目元だけになる）。
#   **表の節はロナウドを敷かない**（本編の板は幅0.74・左寄せなので、真ん中の顔を丸ごと覆う。
#   preview4 で × が出た）。代わりに `tools/stadiumbg.py` で取ったリスボンのスタジアム
#   （assets/backgrounds/stadium_ポルトガル代表.png、CC BY 3.0 / Massimo Catarinella）を敷いている。
# **同じ板が20秒以上続かないように、節の中で板の種類を替えてある**（表 → 棒グラフ → 表、など）。
#   続くと `spread_long_cards` がサムネの写真（ロナウドの顔）を割り込ませ、その顔を板が覆う。
# サムネは構図 face（thumblayout の _list.png を見て number から変えた。number は大きな「234」が
#   顔をほとんど隠していた）。答えの名前は ●● で伏せ、文字に人名を入れてある。
#   もう1本（マンチェスター・ユナイテッドのユニフォーム）は scene なので、2本で構図が違う。
