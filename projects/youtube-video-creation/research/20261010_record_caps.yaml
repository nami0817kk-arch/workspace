  title: ロナウドの代表234試合、1年あたりに直すと先頭ではない。前に出てくる選手
  question: 代表の通算出場は、どこまでを数えた数字で、何が順番を決めているのか
  lead: 代表の試合に出た数で、世界のいちばん上にいる記録。
  hook: その数字が何年かけたものかまで見ると、並びが変わります。
  takeaway: 代表の通算出場は、2026年10月6日時点でロナウドの234試合が世界の先頭。ただし出場を期間の長さで割ると1年あたり10.13試合で、1984年に代表を終えたマレーシアのソー・チンアンの13.08に届かない。ロナウドの234は23年かけた数字で、ソー・チンアンは15年で積んでいる。時代の違いは数字で追える。イングランド代表の試合は1930年代の1年5.7から2020年代は13.6へ2.4倍になり、親善試合の割合は51%から18%へ下がった。2018年のネーションズリーグでヨーロッパの公式戦は142から168に増え、48か国になった2026年のワールドカップでは準決勝まで進むチームの試合が7から8になっている。シルトンの1年あたり6.37がロナウドの10.13になった1.59倍は、代表の試合そのものの伸び1.60倍とほぼ同じで、伸びたのは選手ではなく出番の数のほうだと読める。数え方そのものも団体で食い違っていて、ソー・チンアンは公式に認められた195に対し統計団体は219、アルムタワは2022年に196で先頭に立ったあと数え直しで202に改められている。100試合を超えた699人を大陸で割ると1国あたりはアジアが7.73人で、ヨーロッパの5.31人より多い
  opening_image: assets/images/20261010_record_caps/01_w.jpg
short_title: ロナウドの234試合は23年ぶん。1年あたりなら上にソー・チンアンがいる
