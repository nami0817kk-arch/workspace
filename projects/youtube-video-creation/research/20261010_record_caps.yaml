- id: era
  heading: 数字の後ろで動いていたもの
  tier: 報道
  telop: イングランド代表の試合は1年5.7から13.6へ。親善試合の割合は51%から18%
  narrator: 解説
  card: &era_line
    type: line
    title: イングランド代表の1年あたりの試合数
    x: &erax ['1930年代', '1950年代', '1970年代', '1990年代', '2010年代', '2020年代']
    series: &eras
    - [1年あたりの試合数, [5.7, 8.5, 10.0, 11.3, 11.8, 13.6]]
    unit: 試合
    note: 1930年代と2020年代で2.4倍。同じ「1試合」の重みが変わっている
  say:
  - text: ここからは、数字だけでは見えないところを見ます。
    card: *era_line
  - text: イングランド代表の試合は、1930年代が1年に5.7でした。
    card: *era_line
  - text: 2020年代は1年に13.6。90年で2.4倍まで増えています。
    card:
      type: line
      title: イングランド代表の1年あたりの試合数
      x: *erax
      series: *eras
      unit: 試合
      highlight: '2020年代'
    emph: true
  - text: 親善試合の割合も、51%から18%まで下がっています。
    card: *era_line
  - text: ヨーロッパでは2018年に、ネーションズリーグという大会が始まりました。
    card: &rules_board
      type: points
      title: 出番が増えた決まりごと
      items:
      - 2018年 ネーションズリーグ。公式戦が142から168へ
      - 2026年 ワールドカップが48か国。準決勝まで進む側は7試合から8試合へ
      - 2022年7月 交代は3人から5人へ
  - text: 2020年の形の変更で、この大会の試合は142から168に増えています。
    card: *rules_board
  - text: 2026年のワールドカップは48か国。準決勝まで進むチームの試合は7から8へ。
    card: *rules_board
  - text: 交代できる人数も、2022年7月から3人ではなく5人に変わりました。
    card: *rules_board
  - text: もうひとつ、数え方そのものが団体によって食い違っています。
    card: &gap_board
      type: table
      title: 数え方の食い違い
      columns: &gapc
      - 選手
      - 公式と認められた数
      - もうひとつの数
      - 差
      rows: &gapr
