        - '195'
        - '219'
        - 24試合
      - - アルムタワ
        - '202'
        - '196'
        - 6試合
  - text: ソー・チンアンは公式に認められた数が195。統計の団体は219まで数えます。
    card:
      <<: *gap_board
      highlight_row: 0
  - text: 219と195の差は24試合。五輪の試合などが公式と認められていないためです。
    card:
      <<: *gap_board
      highlight_row: 0
  - text: 195が公式に認められたのは2021年8月です。
    card:
      <<: *gap_board
      highlight_row: 0
  - text: 本人が代表で最後に出たのは、1984年10月18日でした。
    card:
      <<: *gap_board
      highlight_row: 0
  - text: アルムタワは2022年6月14日に196で先頭に立ち、その試合で代表を終えます。
    card: &almutawa
      type: stats
      title: アルムタワの通算は、あとから動いた
      items:
      - ['196', 試合, 2022年6月14日に先頭へ]
      - ['202', 試合, 数え直したあとの通算]
      - ['6', 試合, 代表を離れてから増えた数]
      focus: 2
  - text: ところが、そのあとの数え直しで通算は202に改められました。
    card: *almutawa
  - text: 代表を離れたあとに、記録が6つ増えたことになります。
    card: *almutawa
    emph: true
  - text: 一方でロナウドは、2023年6月20日に200試合へ届いています。
    card: *gap_board
  - text: こちらは、男子のプロ選手として初めてだとされました。
    card: *gap_board
  - text: アルムタワの202と、いまの初めてという記述が、食い違ったままです。
    card: *gap_board
