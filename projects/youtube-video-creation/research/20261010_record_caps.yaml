  tier: 背景
  telop: 1年あたりは6.37から10.13へ1.59倍。試合そのものの伸び1.60倍と重なる
  narrator: 解説
  card: &rate_calc
    type: calc
    title: 1年あたりの出場は何倍になったか
    terms:
    - ['10.13試合', ロナウドの1年あたり]
    - ['6.37試合', シルトンの1年あたり]
    - [1.59倍, 56年でついた差]
    ops: ['÷', ＝]
  say:
  - text: 最後に、こちらで数え直した比べを置きます。
    card: *rate_calc
  - text: シルトンは1年あたり6.37試合、ロナウドは10.13試合。
    card: *rate_calc
  - text: 割ると1.59倍。56年でついた差にあたります。
    card: *rate_calc
  - text: 代表の試合そのものも、1950年代の8.5から13.57へ。こちらも1.60倍。
    card: &games_calc
      type: calc
      title: 代表の試合そのものは何倍になったか
      terms:
      - ['13.57試合', 2020年代の1年あたり]
      - ['8.5試合', 1950年代の1年あたり]
      - [1.60倍, 70年でついた差]
      ops: ['÷', ＝]
  - text: 選手ひとりが出られる数の伸びと、試合そのものの伸びが、ほぼ同じ倍率で重なります。
    card: *games_calc
    emph: true
  - text: 増えたのは選手の丈夫さではなく、出番の数のほうだと読めます。
    card: *games_calc
  - text: その1年あたりでそろえ直すと、並びはこうなります。
    card: &peryear
      type: table
      title: 1年あたりに直した出場（自分で数えた）
      columns: &pyc
      - 選手
      - 出場
      - 期間の長さ
      - 1年あたり
      rows: &pyr
      - - ソー・チンアン
        - '195'
        - 14.91年
        - '13.08'
      - - カノ
        - '193'
        - 16.19年
        - '11.92'
      - - ラモス
        - '180'
        - 16.01年
        - '11.24'
      - - アルムタワ
        - '202'
        - 18.78年
        - '10.76'
      - - ロナウド
        - '234'
        - 23.10年
        - '10.13'
      - - モドリッチ
        - '206'
        - 20.60年
        - '10.00'
  - text: 先頭はソー・チンアンの13.08。15年で届いた数です。
    card:
      <<: *peryear
      highlight_row: 0
    emph: true
  - text: ロナウドは表の5番目。こちらは23年かけての数になります。
    card:
      <<: *peryear
      highlight_row: 4
  - text: 並んだ6人のうち3人が、アジアの代表です。
    card: *peryear
  - text: 100試合を超えたのは122か国で699人。1つの国あたりにしてみます。
    card: &conf_bars
      type: bars
      title: 100試合を超えた選手 1国あたり
      unit: 人
      items:
      - {label: アジア, value: 7.73, highlight: true}
      - {label: 南米, value: 7.20}
      - {label: 北中米カリブ, value: 6.92}
      - {label: ヨーロッパ, value: 5.31}
      - {label: アフリカ, value: 3.05}
  - text: アジアは1国あたり7.73人。ヨーロッパの5.31人より多いんです。
    card: *conf_bars
    emph: true
  - text: その差は、およそ1.5倍になります。
    card: *conf_bars
  - text: オセアニアからは、まだひとりも出ていません。
    card: *conf_bars
