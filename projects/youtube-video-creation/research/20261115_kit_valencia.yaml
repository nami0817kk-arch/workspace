# ユニフォームとエンブレムの歴史 バレンシア（11/12 作成、11/15 分）。ラ・リーガの5本目。雛形は 11/13 アスレティック回（20261113_kit_athletic.yaml）。
# 題の問い：胸のコウモリに、バットマンの会社は何を問題にしたのか。答え＝2013年5月、新しいコウモリの絵が似すぎていると DCコミックスが異議。クラブは申請を取り下げ（英語版）。
# 選んだ理由：指示書 20261109/20261112/20261115「ユニフォームはラ・リーガの続き」。済み：バルセロナ・レアル・アトレティコ・アスレティック。
#   スタジアム担当（同じ11/15）と同じクラブにしない → research/20261115_picks.txt に先に1行書いた。バレンシアは 11/11 にスタジアム（メスタージャ）で出済み＝当日のスタジアム担当は選ばない。
#   コウモリ＝バットマンの話は、題の主語になる強い一点。白黒の由来（創立の決まり）と、広告・メーカーの移り変わりを足して5節。
# 重なり確認（2026-11-12）：scripts/*kit_* にバレンシアは無し。直近30日：20261111_stadium_valencia（4日前・スタジアム。本拠地の話だけ）／20261108_real_valencia_guler_mbappe・20261108_sato_valencia_out_of_squad（ニュース）。
#   この回では、本拠地の名前・建物・観客席の話は言わない（4日前のスタジアム回）。写真も 20261111_stadium_valencia のものは使わない。
# 今季のリーグ：ca "València Club de Futbol"（2026-2027 の登録選手の項あり）。ラ・リーガ。情報の時点は 2026年11月12日。
# 取材：requests だけ（Wikipedia API）。ブラウザ操作・JS実行は使っていない。クラブ公式は読んでいない。
#   読んだ：es "Valencia Club de Fútbol"（Fundación・Símbolos・Indumentaria・1985/86 の項）、es "Historia del uniforme del Valencia Club de Fútbol"（冒頭＝創立の決まりと前身の色。表は Patrocinio）、en "Valencia CF"（Kit の表・Crest）、ca "València Club de Futbol"（Uniforme・Escut）。
# ---- 食い違い・断ったこと ----
#   ・白黒の決まり：es 衣装史「1919年の創立から白と黒。創立の定款（estatuto fundacional）に書かれている。出どころは、同じバレンシアの名を持つ地元の混成チームで、白シャツに紺パンツ」。→ 台本はそのまま。黒を選んだ理由は資料に無いので言わない。
#   ・原型：en「白シャツ、黒パンツ、黒ソックス。年月とともに白と黒を行き来」、es 本文「1994年に黒ソックスが戻り、1995年から原型（白シャツ・黒パンツ・黒ソックス）」。es の衣装史の図（Football kit）は1995年より前の白パンツの年を多く描くが、図の年は台本で使わない。
#   ・コウモリの由来：en は「この地域に多いだけ」「1238年10月9日、ハイメ1世がバレンシアに入ろうとしたとき、旗の先にコウモリが止まり吉兆と受け取った」の2説。es は「1238年の征服で吉兆」「アラゴン王ペドロ4世が14世紀に使った兜飾りの竜の変形」。→ 3つとも「説」として並べ、どれとも言い切らない。
#   ・バットマン：en「2013年5月、DCコミックスがバレンシアの新しいコウモリの絵が似すぎていると訴えたと報じられた。クラブは、改めたコウモリをカジュアル服用に使うつもりで欧州の商標の役所（OHIM）に申請した、と説明。申請は、DCコミックスの異議のあと取り下げ。裁判ではなく異議」「百周年のロゴの商標申請にも、DCコミックスが欧州の役所に苦情」。
#     es は「DCコミックスは何度も訴訟を起こしたが、いまのところ実っていない」とも書く。→ 食い違いのうち、en の「異議・申請の取り下げ」を使い、「裁判ではなく異議」は「とされます」と言う。バットマンの誕生は es が「バレンシア創立の20年あと」と書くので1939年とした（年は本文に無く、DCの公式は読んでいない）。
#   ・新ロゴ：es「2018年に、黒地にオレンジのコウモリ。百周年の2018-19季は、金と黒で CENTENARI と 1919-2019 の字入り」。
#   ・胸の広告：es「1985-86季、資金が乏しく、胸に初めての広告として貯蓄銀行 Caja de Ahorros de Valencia の名を入れた。その季の4月12日、カンプ・ノウで0対3、1931年以来の2部降格」。
#     es 衣装史の表は 1987〜1990 を Bancaja（貯蓄銀行の後身）としていて、年は1〜2年ずれる。→ 台本は es 本文の「1985-86季」と言い、表の年は使わない。
#     フォード 1995–98、テラ・ミティカ（テーマパーク）1998–2000、トヨタ 2003–08、TM（不動産）2023–（en と es の表で一致）。2008以降のほかの広告主は言わない（賭け関係の会社を含むため）。
#   ・シャツを作る会社：en と es の表で一致するのは 1990 プーマ、1993 ルアンビ、2000 ナイキ、2009 カッパ、2011 ジョマ、2014 アディダス、2019 プーマ。1990年より前（アディダス・レッシー・ラサン）は年が表で食い違うので使わない。
# ---- 自分で数えた数 ----
#   白と黒：1919→2026＝107年。コウモリの伝説：1238→2026＝788年。バットマン：1939−1919＝20年。
#   メーカー：1990→2026＝36年で7期（プーマ・ルアンビ・ナイキ・カッパ・ジョマ・アディダス・プーマ）。36÷7＝5.14 → 約5.1年。107÷5.1＝20.98 → 約21倍。
#   各期：プーマ 1990–93＝3年、ルアンビ 1993–2000＝7年、ナイキ 2000–09＝9年、カッパ 2009–11＝2年、ジョマ 2011–14＝3年、アディダス 2014–19＝5年、プーマ 2019–＝7年（今）。
# ---- 日本との接点 ----
#   見つけられなかった（読んだ資料に日本人選手・日本の会社との直接のつながりは、トヨタ（2003–08）の広告主以外に無い。トヨタは台本で広告主の1社として1行だけ）。
# 言わなかったもの：本拠地の名前（4日前のスタジアム回）／賭け関係の広告主／経営の話（ピーター・リム）／DCコミックスの訴訟の結果の評価／黒を選んだ理由の推測。
# 写真：assets/images/20261115_kit_valencia/（credits.json）。Commons（CC BY・CC BY-SA・Public domain）。代理店・放送映像・エンブレム画像は使っていない。人物は特定していない。
