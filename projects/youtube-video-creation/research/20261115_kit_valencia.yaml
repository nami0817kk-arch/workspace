sections:
- id: colors
  main: true
  heading: バレンシアの白と黒は、いつ決まった色なのか
  bg: assets/images/20261115_kit_valencia/p_fans_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1919年の創立で白と黒が決まり。前身の地元チームは白シャツに紺パンツ。黒いソックスは1994年、黒いパンツは1995年に戻った
  card: *colors
  say:
  - text: 今回はバレンシア。白と黒のシャツと、胸のコウモリの話です。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card: none
  - text: バレンシアの創立は、1919年3月18日です。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *colors
      highlight_row: 1
  - text: 設立の文書が書かれたのは、その17日前。いまはない酒場、バル・トリノでした。
    image: assets/images/20261115_kit_valencia/p_torino_w.jpg
    card: none
  - text: シャツの色は、創立の決まりに、白と黒と書かれていました。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card: none
    emph: true
  - text: 色のもとになったのは、同じバレンシアの名前を持つ、地元の混成チームとされます。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *colors
      highlight_row: 0
  - text: そのチームの装いは、白いシャツに、紺のパンツでした。
    image: assets/images/20261115_kit_valencia/p_old_w.jpg
    card: none
  - text: クラブの元の姿は、白いシャツ、黒いパンツ、黒いソックスです。
    image: assets/images/20261115_kit_valencia/p_old_w.jpg
    card: none
  - text: そのあと、パンツとソックスは、白と黒のあいだを行き来します。
    image: assets/images/20261115_kit_valencia/p_old_w.jpg
    card: none
  - text: 1994年、黒いソックスが戻りました。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card:
      <<: *colors
      highlight_row: 2
  - text: 1995年からは、黒いパンツも加わり、元の姿に戻ります。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card:
      <<: *colors
      highlight_row: 3
    emph: true
    callword: 元の姿に戻る
  - text: 相手の本拠地で着る2つ目のシャツは、近年、オレンジの色合いです。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: 3つ目のシャツには、紋章の黄色や赤、青の色が使われてきました。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: 創立から、107年。白と黒は、クラブの色であり続けています。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *colors
      highlight_row: 4
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Valencia_Club_de_F%C3%BAtbol
  - https://en.wikipedia.org/wiki/Valencia_CF
  - https://es.wikipedia.org/wiki/Valencia_Club_de_F%C3%BAtbol
- id: crest
  heading: 胸のコウモリは、なぜバレンシアの町の紋章から来たのか
  bg: assets/images/20261115_kit_valencia/p_bat_w.jpg
  tier: 背景
  narrator: 解説
  telop: コウモリは町の紋章の動物。由来は3説。1238年の旗、14世紀の兜飾りの竜、この辺りに多かったから。下半分はバレンシアの旗
  card: *parts
  say:
  - text: 胸の紋章の上にいるのは、黒いコウモリです。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *parts
      highlight_row: 0
  - text: バレンシア語で、ラット・ペナット。町の紋章にいる動物です。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card: none
  - text: 由来には、3つの説があります。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *legend
      highlight_row: 0
  - text: 1つめは、1238年。アラゴンの王、ハイメ1世が、町を取り戻した年です。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *legend
      highlight_row: 0
    emph: true
  - text: 入城の日は、10月9日。王の旗の先に、コウモリが止まりました。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *legend
      highlight_row: 0
  - text: 王は、それを吉兆と受け取った、とされます。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card: none
  - text: 2つめは、アラゴン王ペドロ4世の、兜の飾りの竜が、姿を変えた、という説。
    image: assets/images/20261115_kit_valencia/p_fans2_w.jpg
    card:
      <<: *legend
      highlight_row: 1
  - text: 3つめは、この辺りに、コウモリが多かっただけ、というものです。
    image: assets/images/20261115_kit_valencia/p_fans2_w.jpg
    card:
      <<: *legend
      highlight_row: 2
  - text: 盾の下半分は、バレンシアの旗。
    image: assets/images/20261115_kit_valencia/p_fans2_w.jpg
    card:
      <<: *parts
      highlight_row: 1
  - text: 黄色が5本、赤が4本。合わせて縦に9本。
    image: assets/images/20261115_kit_valencia/p_fans2_w.jpg
    card: none
    emph: true
  - text: 上の青い帯には、クラブの名前。真ん中には、茶色のボールが入ります。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *parts
      highlight_row: 2
  - text: 町の動物と、町の旗と、サッカーのボール。バレンシアの胸は、その3つでできています。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *parts
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Valencia_CF
  - https://es.wikipedia.org/wiki/Valencia_Club_de_F%C3%BAtbol
  - https://ca.wikipedia.org/wiki/Val%C3%A8ncia_Club_de_Futbol
- id: batman
  heading: バットマンの会社は、なぜコウモリに口を出したのか
  bg: assets/images/20261115_kit_valencia/p_fans_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2013年5月、DCコミックスが新しいコウモリの絵に異議。クラブは申請を取り下げた。バットマンは創立の20年あとの生まれ
  card: *batman
  say:
  - text: 胸のコウモリは、ある会社の目にも留まりました。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card: none
  - text: アメリカの出版社、DCコミックスです。バットマンの会社です。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card: none
  - text: 2013年5月、バレンシアの新しいコウモリの絵が、話題になります。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *batman
      highlight_row: 2
  - text: バットマンに、似すぎている。そう報じられました。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *batman
      highlight_row: 2
    emph: true
    callword: バットマンに似すぎ？
  - text: クラブの説明は、こうです。コウモリの絵を少し改め、普段着に使うつもりでした。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: 申請を出した先は、欧州の商標を扱う役所です。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: そこへ、DCコミックスが異議を出しました。クラブは、申請を取り下げます。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: 出されたのは、裁判ではなく、異議だった、とされます。
    image: assets/images/20261115_kit_valencia/p_kit_w.jpg
    card: none
  - text: バットマンの登場は、1939年。バレンシアの創立より、20年あとのことです。
    image: assets/images/20261115_kit_valencia/p_fans_w.jpg
    card:
      <<: *batman
      highlight_row: 1
    emph: true
  - text: 2018年、クラブは、黒地にオレンジのコウモリの、新しいマークを発表します。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *batman
      highlight_row: 3
  - text: 百周年の2018年から19年は、昔の紋章を、金と黒に替えて使いました。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card:
      <<: *batman
      highlight_row: 4
  - text: 上と下に、センテナリ、1919から2019の文字が入っています。
    image: assets/images/20261115_kit_valencia/p_bat_w.jpg
    card: none
  - text: この百周年のマークにも、DCコミックスは、同じ役所へ苦情を出した、と伝えられます。
