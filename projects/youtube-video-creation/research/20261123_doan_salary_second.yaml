# 取材メモ（2026年11月23日）堂安律の基本給はフランクフルトで主将コッホに次ぐ2位タイ（ニュースのショート。見せ方 X＝冒頭1秒の強い一言）
# 取材: 2026-11-23。WebFetch と requests（ブラウザUA）だけ。検索AI要約・ブラウザの道具は使っていない。
# 題材の元: まとめサイト footballnet 60146715（根拠にはしない）。スレの1の引用元は FOOTBALL TRIBE（日本語）2026-11-20 → それが「ドイツ『ビルト』が16日に特集」と書いていた。
# 元のドイツ紙: BILD 2026-11-17 09:28「Eintracht Frankfurt: Gehälter der Bundesliga-Stars enthüllt!」（Johannes Wolf / Marc Schmidt）
#   https://www.bild.de/sport/fussball/eintracht-frankfurt-gehaelter-der-bundesliga-stars-enthuellt-6afb0f2f8c74195fa20c321a
#   → 有料（BILDplus）。読めたのは導入だけ: ネットに出回る表では主将コッホ（30）が基本給約600万ユーロとされるが、BILD が「実際に稼げる額」を明かす、という前置き。本文の数字は読めていない。
#   （FOOTBALL TRIBE は「16日」と書くが、BILD のサイトの掲載は 17日 09:28。→ 台本では日付を言わない）
# ユーロの数字を確かめたもの: 90min.de（ドイツ語）2026-11-17「Gehaltsliste enthüllt: Das verdienen die Eintracht-Stars」（Jan Kupitz。BILD の報道として全文で紹介）
#   https://www.90min.de/gehaltsliste-enthullt-das-verdienen-die-eintracht-stars
#   ・基本給: コッホ 400万ユーロ（チーム最高）／ブルカルト 300万〜350万／堂安 300万〜350万 → 堂安はブルカルトと並ぶ2位タイ。
#   ・次の段: ブラシエ・アトゥボル・オニェディカ 約250万／シャイビ・ウズン・クナウフ・ゲッツェ 約200万（ゲッツェは昨夏の延長で下げた）。
#   ・成果で払う仕組み: 基本給は比較的低く、勝てばボーナスが大きい。コッホは最大300万ユーロのボーナス（基本給がほぼ倍）。ブルカルトや堂安も「理屈の上では同じくらいのボーナス」。
#     ただしチャンピオンズリーグ出場権などが要る。現実的なボーナスは150万〜200万ユーロ。
#   ※90min の写真は Getty なので使わない。
# 食い違い（気をつけた点）:
#   ・FOOTBALL TRIBE は「堂安は最大600万ユーロ（約10億8000万円）、コッホは最大700万ユーロ」と書く。90min は堂安の最大額を数字で書かず「コッホと同じくらいのボーナス（＝最大300万）」とだけ書く。
#     → 台本は 90min の言い方に合わせ、「基本給の上限350万＋ボーナス300万＝最大650万ユーロ」を**自分の計算（見立て）**として言う。600万とは言わない。
#   ・FOOTBALL TRIBE の円は 1ユーロ＝約180円。こちらは ECB の参照レート 2026-11-20 の 1ユーロ＝174.35円で計算し直した（下）。
#   ・FOOTBALL TRIBE の「フライブルク時代の年俸84万ユーロ」「アル・イテハドから900万ユーロの提示」はドイツの元記事を読めていないので使わない。
#   ・BILD 本文が有料で読めないため、数字は BILD を紹介した 90min（ドイツの媒体）どまり。確度は 報道。
# 円の換算（自分で計算。ECB 参照レート 2026-11-20、1ユーロ＝174.35円 https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml）:
#   300万ユーロ＝5億2305万円（約5億2000万円）／350万＝6億1023万円（約6億1000万円）／400万＝6億9740万円（約7億円）
#   ボーナス最大300万＝約5億2000万円／現実的 150万〜200万＝2億6153万〜3億4870万円（約2億6000万〜3億5000万円）
#   最大の計: 350万＋300万＝650万ユーロ＝11億3328万円（約11億3000万円）。下限で 300万＋300万＝600万＝約10億5000万円。
# 前の本との重なり: 堂安の本は 11/11 asiacup・11/14 last_captain・11/15 brazil_captain・11/18 captain_words（どれも代表の話）。年俸の話は初出。
# 【言わないこと】他人の年俸の細かい内訳（ゲッツェの旧契約など）／サウジの話／ネットの年俸表／得点が無い等のプレーの評価／「高すぎる」「安い」の感想。
# 写真: フランクフルトの写真で代理店でないものが見つからなかった（BILD は picture alliance、90min は Getty、FOOTBALL TRIBE はアフロ、Commons に今季のものは無い）。
#   ゲキサカのフォトニュース（11月の日本代表。撮影 Koki NAGAHAMA/GEKISAKA）から4枚: 01＝ブラジル戦の顔（463286_3）、02＝パラグアイ戦の顔（463418_18）、03＝ブラジル戦のキック（463286_7）、04＝ブラジル戦の2日後の練習の行き（463303_11）。
#   photopool は主写真しか見ず、鎌田大地（463286 の主写真）と BILD のコッホを拾ったので外し、本人の写真を目で選んで pressphoto で取り込み facecrop で切った。
#   _pool.png を見た: 4枚とも堂安律本人。元の写真の右下に撮影者の表記「©Koki NAGAHAMA/GEKISAKA」があり、02_v・03_v の右下に一部が残るので使わない。01_v・04_v・_w は表記が切れて入っていない。
#   代表のユニフォーム姿で、フランクフルトの写真ではない。11/18 の本（04 は 463135）とは別の写真。
# 本人の言葉: 無し（年俸の話に本人は答えていない）。X。
