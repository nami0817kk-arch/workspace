        text: ローマはずっとプレスをかけてきた。
      - voice: ルイス・エンリケ監督
        text: 間違いなく、今季いちばん難しい試合でした。
        cont: true
      - text: 試合はローマの先制で始まります。5分、エルモソがゴール前から決めました。
