        image: assets/images/20261126_psg_roma_draw/03_w.jpg
        card: {type: table, title: PSG 2-2 ローマ, columns: [分, できごと], rows: [[5分, エルモソ（ローマ）], [31分, ザバルニー（PSG）], [62分, デンベレのPK（PSG）], [78分, マレンのPK（ローマ）]], highlight_row: 1}
