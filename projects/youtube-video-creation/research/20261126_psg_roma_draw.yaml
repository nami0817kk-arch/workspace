# 取材メモ（2026年11月26日）CL第5節 PSG 2-2 ローマ。王者PSGが本拠で初めて勝ち点を落とし、公式戦の連勝が12で止まった（ニュースのショート。見せ方 Y＝ルイス・エンリケ監督の言葉から始める）
# 追記（親・書き出し後）: ショートの冒頭（本人の一言）で 01_w を縦に真ん中切りして監督の顔が右端で切れていた。01_v を顔中心に切り直し（facecrop --center 0.66）、一言の行に顔を真ん中にした横長の切り抜き 01_wf（01 から切っただけ）を指定した。語りは変えていない。
# 取材: 2026-11-26。WebFetch と requests（ブラウザUA）だけ。検索エンジンのAI要約・ブラウザの道具は使っていない。
# ESPN の試合データ（site.api.espn.com uefa.champions summary event=401915374、2026-11-25 20:00 UTC、パルク・デ・プランス、観客46,667人）: PSG 2-2 ローマ。
#   5分 エルモソ（左足、エリア中央から。スーレのアシスト）／31分 ザバルニー（CKのあと、ゴール右の至近から頭でゴール右上。マユルのクロス）／
#   60分 ハキミがエリア内で倒されPK（ヴェスレイに警告）→62分 デンベレ（右足、ゴール右下）／74分 ヴィティーニャのハンド→75分 VARでローマにPK→78分 マレン（右足、ゴール左下）。
#   デンベレは先発外、59分にフェラン・トーレスと交代で出場。マレンも先発外、67分にモリーナと交代で出場。ディバラは63分から。
#   シュート PSG 15本（枠内4）、ローマ 13本（枠内4）。ボール保持 PSG 66%。
#   順位（ESPN standings、11/26 取得）: 1位 レアル・マドリード 5勝 勝ち点15／2位 PSG 4勝1分 勝ち点13／25位 ローマ 1勝2分2敗 勝ち点5。
#   PSG の今大会: スロヴァン・ブラチスラヴァ 6-1、マンC 4-2（敵地）、バルセロナ 4-2、ビジャレアル 6-0（敵地）→ローマ 2-2。ローマ: フェネルバフチェ 1-1、レアル 3-4、スロヴァン 4-0、マンU 2-3、PSG 2-2。
#   次: 12月8日（欧州時間）PSG は敵地でアストン・ヴィラ、ローマは本拠でスポルティング（ESPN の日程）。
#   前の大会の決勝（ESPN 2026-05-30）: PSG 1-1 アーセナルで PSG が優勝（＝前回王者）。
# ESPN の試合記事（espn.com/soccer/report/_/gameId/401915374）: 見出し「PSG's 12-game winning streak halted by home draw against Roma」。
#   今大会で初めて勝ち点を落とした。公式戦12連勝が止まった。ルイス・エンリケはデンベレを先発から外し、ガスペリーニはディバラ・マレン・クリスタンテを控えに置いた。
#   PKはヴェスレイがハキミを引き倒したもの。デンベレのPKは交代で入って2度目のタッチ、今大会4点目。ザバルニーはCL初ゴール。
#   ローマのPKは、マレンのクロス→スーレのシュートがヴィティーニャの手に当たり、長いVARの確認のあと。
# PSG 公式 psg.fr（試合記事「Paris held 2-2 by Roma」・数字の記事「The key numbers」）: 両クラブの公式戦は初めて（親善試合は3回）。12連勝は公式戦でクラブ2番目の記録（最長は2015-16の16）。
#   ザバルニーは今季3点目でCL初ゴール。この引き分けで欧州の大会の無敗は15試合。
# AS ローマ公式 asroma.com（試合記事「Hermoso and Malen on target in 2-2 draw with PSG」）: 結果のみ。言葉なし。写真22枚（この試合）。
# ルイス・エンリケ監督の言葉: CulturePSG 61679「Luis Enrique : « Le match le plus difficile de cette saison »」（11/25 夜、全文）:
#   « … on connaît la Roma et ça a été très difficile, très compliqué, ils pressent tout le temps. Cela a été le match le plus difficile de cette saison sans aucun doute. »
#   « … C'était compliqué, mais on aurait pu perdre le match. On a fait un match nul, on est content. »
#   （Footeo の見出しも « On aurait pu perdre le match »。2つの媒体で一致）→ 台本の言葉は私がフランス語から訳した。
# ガスペリーニ監督の言葉: Sky Sport（sport.sky.it 2026/11/25 psg-roma-gasperini-intervista-video、全文）。Prime Video でも同じ趣旨:
#   "Abbiamo giocato contro i più forti e sono molto soddisfatto di questa gara perché non ci siamo snaturati e ci siamo proposti con qualità."
#   "loro hanno fatto entrare Dembelé, la gara si è accesa e poi non vedevamo l'ora finisse."
#   "Eravamo in vantaggio, non dovevamo prendere un gol così."（CKからの失点について）
#   → 台本の言葉は私がイタリア語から訳した。
# 食い違い:
#   ・PSG のPKの分: ファウルは60分（ESPN の実況）、決めたのは62分（ESPN・PSG公式）。→ 「62分、デンベレがPK」だけ言う。
#   ・ローマのPKの分: ハンドは74分、VARの判定は75分、決めたのは78分（ESPN）。→ 「78分にマレンがPK」。ハンドの分は言わない。
#   ・CulturePSG の言葉が会見か放送のインタビューかは記事に書いていない（PSG公式に会見の動画あり）。→ 「試合後、こう話しました」とだけ言う。
#   ・「連勝」: ESPN は公式戦12連勝（全大会）、PSG 公式も12。CL だけでは開幕4連勝。→ 両方を分けて言う。
# 自分で数えたもの: PSG の今大会の得点 6+4+4+6+2=22、失点 1+2+2+0+2=7。ローマはリードしたまま追いつかれたのが、レアル戦・マンU戦（ESPN 記事）に続き今大会3度目……ではなく、今回は追いついた側。→ 使わない。
#   デンベレは59分に入って62分に得点（3分後）。マレンは67分に入って11分後にPK。
# 前の本との重なり: 11/22 malen_roma_four（パルマ戦の4得点）・11/23 stadium_roma（本拠地）・11/25 kit_psg（紋章）・11/22 doue_knee_luisenrique。
#   → 今回は試合そのもの。マレンの4得点は言わない。ドゥエのけがも言わない。
# 【言わないこと】ルイス・エンリケのローマ監督時代（題から離れる）／ドゥエ・クヴァラツヘリアのけが／ハンドの判定の是非／観客数。
# 写真: asroma.com の試合記事の写真（この試合）と PSG 公式・CulturePSG の写真。代理店の写真（Sky の ©Getty）は使わない。
# 反応: 0件（作らない。approve は --no-voices）。
