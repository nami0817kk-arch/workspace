  say:
  - text: イングランド代表で125試合目。ケインがシルトンの最多出場に並びました。
    short_only: true
    image: assets/images/20261006_record_kane/02_2026ghana_w.jpg
  - text: 代表デビューの日も、夢がかなった瞬間だった。
    voice: ハリー・ケイン
    image: assets/images/20261006_record_kane/11_2026panama184_w.jpg
    card: none
  - text: でも今夜は、思い描いた夢さえ超えている。
    voice: ハリー・ケイン
    cont: true
    card: none
  - text: 125試合まで来られたのは、この上ない光栄だ。
    voice: ハリー・ケイン
    cont: true
    card: none
  - text: そう語ったこの試合で、ケインは3点すべてに絡みました。
