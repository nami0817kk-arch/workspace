      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: ワンタッチでつないで、最後はダイレクトのクロス。
    card: none
    voice: ハリー・ケイン
  - text: あれ以上の崩しは無い。
    card: none
    voice: ハリー・ケイン
    cont: true
  - text: ストライカーは、ああいう一瞬を待って生きているんだ。
    card: none
    voice: ハリー・ケイン
    cont: true
  - text: では、この1試合で、ケインの数字はどれだけ動いたのか。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
    image: assets/images/20261006_record_kane/12_2026ghana05_v.jpg
  - text: 出場は124から125へ。1990年から誰も届かなかった数です。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: そのうち先発は111試合。9割近くを、頭から任されてきました。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: 出た試合で勝ったのは83。3試合に2試合は勝ってきた計算です。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: 得点は89から91へ。2位ルーニーとの差は38点に開きました。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 今年の代表での得点は、これで13。出た試合と同じ数。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: 1年で13点は、イングランド代表で歴代2番目の多さです。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 2
    emph: true
  - text: 上にいるのは2021年の16点。こちらもケイン自身の数字です。
    card:
      type: table
      title: チェコ戦の前と後
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: トゥヘル監督は、試合のあとにこう話しました。
    card: none
    image: assets/images/20261006_record_kane/20_pair_tuchel.jpg
  - text: これが彼なんだ。当たり前だとは思っていない。
    card: none
    voice: トーマス・トゥヘル
  - text: 毎試合、並外れている。
    card: none
    voice: トーマス・トゥヘル
    cont: true
  - text: この舞台も、称賛も、彼にふさわしい。
    card: none
    voice: トーマス・トゥヘル
