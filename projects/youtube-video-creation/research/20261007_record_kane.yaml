      - - 57分
        - ケイン
        - コーナーキックを頭で
    emph: true
    image: assets/images/20261006_record_kane/02_2026ghana_p.jpg
  - text: 欧州の代表戦ネーションズリーグ、ウェンブリーでチェコを3対0で下しました。
    card:
      type: table
