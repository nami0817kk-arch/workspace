      columns: *id001
      rows: *id002
  - text: 先制は27分。ケインの低いクロスを、相手がクリアしきれずオウンゴール。
    card:
      type: table
      title: チェコ戦 ケインが絡んだ3点
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 40分には右からの折り返しを押し込み、これが代表90点目。
    card:
      type: table
      title: チェコ戦 ケインが絡んだ3点
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 57分はコーナーキックを頭で合わせて、91点目です。
    card:
      type: table
      title: チェコ戦 ケインが絡んだ3点
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: 3日前のクロアチア戦に続く2試合連続2得点。33歳では代表の最年長です。
