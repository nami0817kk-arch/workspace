    heading: 何が起きたか
    tier: 報道
    telop: 69分にギャラガー。それが429分ぶりの得点だった
    narrator: キャスター
    card:
      type: table
      title: この試合
      columns: ["", ""]
      rows:
        - ["大会", "リーグカップ3回戦（敵地）"]
        - ["結果", "1-3で敗戦"]
        - ["トッテナムの得点", "69分 コナー・ギャラガー（ヘディング）"]
        - ["その1点", "429分ぶり"]
    say:
      - リーグカップの3回戦、トッテナムは敵地で1対3で敗れました。
      - 得点は69分。コナー・ギャラガーのヘディングです。
      - "そしてこの1点が、チームにとって**429分ぶり**のゴールでした。"
      - 7時間を超えて、点が入っていなかったことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/16/post1011783/

  - id: drought
    heading: クラブ史上初のこと
    main: true
    tier: 報道
    telop: 開幕4戦連続無得点。3億8000万ポンドを使った夏のあとで
    narrator: 解説
    card:
      type: table
      title: 今季のトッテナム
      columns: ["", ""]
      rows:
        - ["順位", "17位（4試合）"]
        - ["成績", "0勝2分2敗・勝点2"]
        - ["得点", "0／失点5"]
        - ["夏の補強", "3億8000万ポンド（約780億円）"]
    say:
      - この無得点は、記録になっていました。
      - "**開幕から4試合続けて無得点。クラブの歴史ではじめて**です。"
      - 開幕3戦続けて無得点だったのは1974年から75年で、52年ぶりでした。
      - 第4節を終えた時点で、順位は17位。0勝2分2敗、得点はゼロです。
      - そして、この夏に使った補強費は**3億8000万ポンド**。日本円で約780億円です。
      - 第4節の時点で無得点だったのは、トッテナムと昇格組のコヴェントリーだけでした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/13/post1009878/
      - https://www.footballchannel.jp/2026/09/12/post999246/

  - id: press
