# トッテナムが429分ぶりに得点、それでも負けた（2026-09-17）
#
# **トッテナム側からだけ書く。**リヴァプール側（ソボスライの30mゴール）は
# 9/16 20:15 に出している。**あちらの話は1行も入れない。**
#
# **429分の内訳は書かない。**取材で確かめたが、どのソースにも内訳が無く、
# しかも媒体で数字が食い違う（フットボールチャンネル「400分超」／
# ファンサイト「452分」）。**出典どおり「429分ぶり」とだけ言う。**
#
# 引きは**「クラブ史上初の開幕4戦連続無得点」**。
# 3億8000万ポンド使って、4試合ゴールが無かった。ここが山場（@main）。
