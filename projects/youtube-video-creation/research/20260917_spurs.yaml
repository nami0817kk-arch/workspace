      - {voice: ガーディアン, text: 新しい顔ぶれだったが、トッテナムにとっては同じ物語だった}
      - {voice: インディペンデント, text: 最低のシーズンスタートはさらに悪化した}
      - 前の節の時点でも、こう書かれていました。
      - {voice: トークスポーツ, text: 悲惨なシーズンスタートが最低地点まで沈んだ}
    official: false
    sources:
