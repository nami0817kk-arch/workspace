  - id: origin
    heading: 順番が逆だった
    main: true
    tier: 背景
    telop: スタジアムが先。断られたので、クラブを作った
    narrator: 解説
    say:
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: このクラブは、できた順番がふつうと逆です。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 先にあったのは、スタジアムのほうでした。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 実業家のガス・ミアーズが、スタンフォード・ブリッジを手に入れます。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: そして近くのクラブ、フラムに「ここを借りないか」と持ちかけました。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: フラムは、断ります。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 借り手がいないなら、自分でクラブを作ればいい。そう考えて生まれたのがチェルシーです。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 名前は、隣の行政区から取りました。1905年のことです。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はシャビ・アロンソ。日本人選手はいません
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "シャビ・アロンソ（4年契約）"]
        - ["主将", "リース・ジェームズ"]
        - ["得点源", "パーマー（全4点）"]
        - ["日本人選手", "なし"]
    say:
      - 監督はシャビ・アロンソです。2026年5月に決まり、7月1日から指揮を執っています。契約は4年。
      - 主将はリース・ジェームズ。
      - 今夏の補強は、額が並みではありません。
      - アストン・ヴィラからモーガン・ロジャーズ、**1億1700万ポンド**。
      - クリスタル・パレスからマクサンス・ラクロワが5200万ポンド。
      - ドルトムントからジェイミー・ギテンズが4850万ポンド、アタランタからマルコ・パレストラが4300万ポンド。
      - スポルティングからジオヴァニー・ケンダ、アヤックスからヨレル・ハトも加わりました。
      - ここまでの得点は、コール・パーマーがすべての大会で4点と最も多くなっています。
      - そして、日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Chelsea_F.C._season
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: ヨーロッパの4つを、すべて獲った最初のクラブ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1971年", "初の欧州タイトル（カップウィナーズカップ）"]
        - ["2012年", "ロンドン勢で初のチャンピオンズリーグ制覇"]
        - ["2022年", "42.5億ポンドで売却。19年の体制が終わる"]
        - ["2025年", "4大会すべてを制した最初のクラブに"]
    say:
      - ヨーロッパでの最初のタイトルは1971年、カップウィナーズカップでした。
      - アテネでの再試合で、相手はレアル・マドリードです。
      - チャンピオンズリーグを獲ったのは2012年。ロベルト・ディ・マッテオのもとでした。
      - 決勝はバイエルン・ミュンヘン。PK戦を4対3で制しています。
      - "**ロンドンのクラブとして、初めて**この大会を勝ち取りました。"
      - 2021年にはトーマス・トゥヘルが、チャンピオンズリーグ、スーパーカップ、クラブワールドカップを同じ年に獲っています。
      - 2022年、19年続いたロマン・アブラモビッチの体制が終わりました。
      - トッド・ベーリーが率いるブルーコーが、**42億5000万ポンド**で買い取っています。
      - そして2025年、カンファレンスリーグを制しました。
      - これで、**UEFAの主要4大会をすべて獲った最初のクラブ**になりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝6回（直近 2016-17）、FAカップ8回（直近 2017-18）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "6回（直近 2016-17）"]
        - ["FAカップ", "8回（直近 2017-18）"]
        - ["リーグカップ", "5回（直近 2014-15）"]
        - ["ヨーロッパ", "CL2／EL2／CWC2／カンファレンス1"]
    say:
      - 数えると、大きなタイトルで**26個**あります。
      - 1部優勝6回、FAカップ8回、リーグカップ5回。
      - ヨーロッパはチャンピオンズリーグ2回、ヨーロッパリーグ2回、カップウィナーズカップ2回、カンファレンスリーグ1回。
      - クラブワールドカップも2021年と2025年に獲っています。
      - "**ヨーロッパで獲れるものを、全部獲ったクラブ**です。"
      - ただし、1部優勝の直近は**2016年から17年**。
      - "**10シーズン、リーグから遠ざかっています。**"
      - 世界一になった帰り道が、いちばん近いはずのリーグだけ遠い。そこが今季の見どころです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
