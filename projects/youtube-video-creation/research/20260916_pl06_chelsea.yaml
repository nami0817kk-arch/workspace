# プレミアリーグ20クラブ紹介 ⑥チェルシー（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「スタジアムが先にあって、クラブはあとから作られた」**。
# ここが山場（@main）。よそでは聞かない成り立ち。
#
# **退団の一覧はシーズン記事から読み取れなかった。**加入だけ出す。
# 分からないものは書かない
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では6番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「数えると26個」と「10シーズン、リーグから遠ざかっている」をやめ、
#   獲ったものだけにした。
#
# **見てもらえる形にした**（2026-09-18 ユーザー指示「もっと見てる人の興味や
# 関心を引き立てる内容にしてください」）。
#   ・題とサムネをクラブごとの引きに変えた（20本とも同じ題で並んでいたため）
#   ・**宿敵**の節を足した。ただし**チェルシーは呼び名のあるダービーが記事に無い**ので
#     決めつけず、年号の残るリーズとの1970年の決勝を使った。**レジェンド3人**も足した
#
# **歴史の節を短くした**（2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」）。
#   ・歴史にあたる2節が17行あった。「順番が逆だった」を7行→6行、
#     「歩んできた道」を10行→8行にして、合わせて14行に収めた
#   ・落としたのは 1971年決勝の会場と相手（アテネ／レアル・マドリード）と、
#     2021年のトゥヘルの3冠。山は4大会制覇と2012年のCL初制覇の2つ
