      - チェルシーという名前は、隣り合う行政区から取られたものです。
      - 愛称は「ザ・ブルーズ」。青です。
      - 創設は1905年。ロンドンのクラブです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: origin
    heading: 順番が逆だった
    main: true
    tier: 背景
    telop: スタジアムが先。断られたので、クラブを作った
    narrator: 解説
    say:
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 1904年、実業家のガス・ミアーズが、スタンフォード・ブリッジを手に入れます。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: そして近くのクラブ、フラムに「ここを借りないか」と持ちかけました。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: フラムは、断ります。}
      - {image: "assets/images/pl_chelsea/scene.jpg",
         text: 借り手がいないなら、自分でクラブを作ればいい。そう考えて生まれたのがチェルシーです。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 今季4点。チームでただ一人抜けている
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "シャビ・アロンソ"]
        - ["主将", "リース・ジェームズ（右SB・イングランド）"]
        - ["エース", "コール・パーマー（MF・イングランド）"]
        - ["今季", "4点でチーム単独トップ"]
        - ["クラブ通算", "137試合58得点"]
    say:
      - 今季4点で、チームでただ一人抜けている選手がいます。
      - エースはコール・パーマー。攻撃的な中盤です。
      - 2023年にマンチェスター・シティから来て、チェルシーで137試合58得点。
      - 監督はシャビ・アロンソです。
      - 主将はリース・ジェームズ。イングランド代表の右サイドバックです。
      - "**2018年からこのクラブにいる、下部組織の出身**です。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: ヨーロッパの4つを、すべて獲った最初のクラブ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1971年", "初の欧州タイトル（カップウィナーズカップ）"]
        - ["2012年", "ロンドン勢で初のチャンピオンズリーグ制覇"]
        - ["2022年", "42.5億ポンドで売却。19年の体制が終わる"]
        - ["2025年", "4大会すべてを制した最初のクラブに"]
    say:
      - "2025年、チェルシーは**UEFAの主要4大会をすべて獲った最初のクラブ**になりました。"
      - 最後のひとつが、その年のカンファレンスリーグです。
      - ヨーロッパでの最初のタイトルは1971年、カップウィナーズカップでした。
      - チャンピオンズリーグを獲ったのは2012年。ロベルト・ディ・マッテオのもとでした。
      - 決勝はバイエルン・ミュンヘン。PK戦を4対3で制しています。
      - "**ロンドンのクラブとして、初めて**この大会を勝ち取りました。"
      - 2022年、19年続いたロマン・アブラモビッチの体制が終わりました。
      - トッド・ベーリーが率いるブルーコーが、**42億5000万ポンド**で買い取っています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 呼び名の付いたダービーが、記事に見当たらない
    narrator: 解説
    card:
      type: table
      title: 宿敵をめぐる記録
      columns: ["", ""]
      rows:
        - ["名前が挙がる相手", "アーセナル／トッテナム"]
        - ["ダービーの呼び名", "この2つには無い"]
        - ["1970年4月29日", "FAカップ決勝の再試合。リーズに2-1"]
        - ["その試合", "2,800万人が見たとされる"]
        - ["今季", "リーズもプレミアリーグにいる"]
    say:
      - "このクラブには、**呼び名の付いたダービーがありません。**"
      - ライバルとして名前が挙がるのはアーセナルとトッテナムですが、どちらが一番かも書かれていません。
      - 由来も、語り継がれている一戦も、ライバルの節には出てこないのです。
      - 年号つきの出来事が残っているのは、別の相手でした。リーズ・ユナイテッドです。
      - 発端は1960年代から70年代の荒れた試合。とりわけ1970年のFAカップ決勝です。
      - 4月11日のウェンブリーは、延長の末に2対2。
      - 4月29日、オールド・トラフォードでの再試合を2対1で制しました。
      - "この一戦は**2800万人**が見たとされ、イングランドのサッカー史で最も荒れた試合と呼ばれています。"
      - 現代の審判が見返すと、退場6枚に警告20枚。別の審判は、退場が11枚出てもおかしくないとしました。
      - そのリーズは、今季もプレミアリーグにいます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Chelsea_F.C.
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 795試合。「チョッパー」と呼ばれた主将
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ロン・ハリス", "795試合。クラブ史上最多出場"]
        - ["フランク・ランパード", "公式戦211得点。クラブ史上最多得点"]
        - ["ジョン・テリー", "717試合。優勝5回すべてで主将"]
    say:
      - "「**チョッパー**」と呼ばれた主将がいます。ロン・ハリスです。"
      - 1961年から80年まで795試合。クラブ史上いちばん多い出場数です。
      - 10シーズンは42試合のうち平均41試合に出て、ほかの5シーズンも平均37試合を超えました。
      - FAカップとカップウィナーズカップを獲ったときの主将でもあります。
      - "得点の記録はフランク・ランパード。2001年から2014年に、公式戦**211得点**。"
      - リーグは429試合147得点です。中盤の選手としては、プレミアリーグ史上最多の177得点を挙げました。
      - この大会で150点以上を挙げた11人のうち、中盤の選手は本人だけです。
      - もう1人がジョン・テリー。1998年から2017年に公式戦717試合67得点。
      - プレミアリーグ優勝5回のすべてで腕章を巻いた、史上はじめての選手です。
      - 2011年から12年、ヨーロッパの頂点に立った夜も、腕章は本人の腕にありました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ron_Harris_(English_footballer)
      - https://en.wikipedia.org/wiki/Frank_Lampard
      - https://en.wikipedia.org/wiki/John_Terry
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: ヨーロッパの頂点に2回。国内は1部優勝6回
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "6回（直近 2016-17）"]
        - ["FAカップ", "8回（直近 2017-18）"]
        - ["リーグカップ", "5回（直近 2014-15）"]
        - ["ヨーロッパ", "CL2／EL2／CWC2／カンファレンス1"]
    say:
      - "ヨーロッパの頂点、チャンピオンズリーグに**2回**立っています。"
      - ヨーロッパリーグ2回、カップウィナーズカップ2回、カンファレンスリーグ1回。
      - クラブワールドカップも2021年と2025年に獲っています。
      - 国内は1部優勝6回、FAカップ8回、リーグカップ5回。
      - "1部優勝のいちばん新しいのは、**2016年から17年**です。"
      - 世界一のクラブが、10季ぶりのリーグ優勝に届くか。そこが今季の見どころです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
