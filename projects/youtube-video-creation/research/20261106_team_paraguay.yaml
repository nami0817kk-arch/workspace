  say:
  - text: 日本とパラグアイの国際Aマッチは、これまで12試合。
    image: assets/stats/tb_paraguay_data7.png
    no_telop: true
  - text: 日本から見て、5勝5引き分け2敗。負けは、1995年と1999年の2度だけです。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card: *id_jp
  - text: いちばん知られているのは、2010年のワールドカップ、南アフリカ大会の16強。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 0対0のまま延長でも決まらず、PK戦は3対5で日本の負け。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 日本は、3人目の駒野友一が外しました。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: パラグアイは5人全員が決めて、初めての8強へ進みました。
    image: assets/images/20261106_team_paraguay/b01_fans_w.jpg
    card: none
  - text: 直近は、2025年10月10日。大阪の吹田で、2対2の引き分けでした。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card:
      <<: *id_jp
      highlight_row: 5
  - text: 1対2で負けていた日本は、後半のアディショナルタイムに、
    card:
      <<: *id_jp
      highlight_row: 5
  - text: 上田綺世が決めて追いつきました。
    card:
      <<: *id_jp
      highlight_row: 5
