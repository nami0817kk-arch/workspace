  say:
  - text: 初めてのワールドカップは、1930年の第1回大会。
    image: assets/images/20261106_team_paraguay/b04_mauricio_w.jpg
    card: *id_hist
  - text: 南米の大会、コパ・アメリカは、1953年と1979年に制しています。
    card:
      <<: *id_hist
      highlight_row: 1
  - text: 1998年から2010年は、ワールドカップに4大会続けて出場。南米の常連でした。
    card:
      <<: *id_hist
      highlight_row: 2
  - text: ところが2014年から3大会、ワールドカップを逃しました。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card: none
  - text: 戻ってきたのが2026年。16年ぶりの大会でした。
    card:
      <<: *id_hist
      highlight_row: 4
  - text: 初戦は、アメリカに1対4の負け。
    card: none
    image: assets/images/20261106_team_paraguay/b04_mauricio_w.jpg
  - text: それでも次のトルコ戦は、開始64秒の1点を守りきって1対0の勝ち。
    card: none
    image: assets/images/20261106_team_paraguay/b04_mauricio_w.jpg
  - text: オーストラリアとは0対0の引き分け。
    card: none
  - text: グループ3位でしたが、成績のいい3位に入り、勝ち残りました。
    card: none
  - text: ドイツを退けた翌日を、パラグアイの大統領は祝日にしています。
    card:
      <<: *id_hist
      highlight_row: 4
