  say:
  - text: 見立てに入ります。ワールドカップの決勝トーナメントを、日本と並べます。
    image: assets/images/20261106_team_paraguay/b01_fans_w.jpg
    card: none
  - text: パラグアイは7試合で1得点8失点。それでも2度、次へ進みました。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 日本は5試合で4得点7失点。勝ち上がりは、まだ0です。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 1試合あたりにすると、日本の得点はパラグアイのおよそ6倍。点では、日本が上です。
    mark:
      kind: circle
      row: 1
      col: 得点
    card:
      <<: *id_vp
      highlight_row: 1
  - text: ところが、90分でも延長でも、勝った試合はどちらも1つもありません。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 分けたのはPK戦です。パラグアイは2勝0敗、日本は0勝2敗。
    emph: true
    mark:
      kind: circle
      row: 0
      col: PK戦
    card:
      <<: *id_vp
      highlight_row: 0
  - text: パラグアイが負けた5試合のうち、4試合は0対1。大きくは崩れません。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card: none
  - text: 120分を引き分けで終えれば、PK戦に持ち込めます。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card: none
  - text: 点を取って勝つ国ではなく、点を与えずに残る国。
    card: none
  - text: パラグアイは、そうやって次へ進んできました。
    card: none
  - text: 一方の日本は、2018年からのパラグアイ戦4試合で、合わせて12点。
    image: assets/images/20261106_team_paraguay/b04_mauricio_w.jpg
    card: none
  - text: 1試合あたり3点を取っています。
    image: assets/images/20261106_team_paraguay/b04_mauricio_w.jpg
    card: none
  - text: 11月17日、シンガポール。日本が今回も2点を取れるのか。
    card: none
  - text: そこが、この試合の分かれ目です。
