sections:
- id: hook
  heading: W杯の決勝トーナメントで7試合1得点。なぜ2度も勝ち上がれたのか
  main: true
  tier: 背景
  telop: W杯の決勝トーナメントは7試合1得点
  narrator: 解説
  say:
  - text: 南米のパラグアイ代表。フィファランクは33位の国です。
    short_only: true
    image: assets/stats/tb_paraguay_data_t.png
    no_telop: true
  - text: 2026年のワールドカップ、決勝トーナメント1回戦。
    image: assets/stats/tb_paraguay_data2.png
    no_telop: true
  - text: パラグアイはドイツと1対1の引き分けで、延長を終えました。
    image: assets/stats/tb_paraguay_data2.png
    no_telop: true
  - text: PK戦は4対3で、パラグアイの勝ち。ドイツにとって、ワールドカップのPK戦で初めての負けでした。
    image: assets/stats/tb_paraguay_data_r1.png
    no_telop: true
  - text: パラグアイの1点は、フリオ・エンシソの頭。これが、ワールドカップの決勝トーナメントで初めての得点です。
    image: assets/stats/tb_paraguay_data2.png
    no_telop: true
  - text: 1986年から数えて、決勝トーナメントは**7試合**。取った点は、この1点だけ。
    image: assets/stats/tb_paraguay_data_r1.png
    no_telop: true
    emph: true
  - text: それでも、勝ち上がったのは2度。もう1つの相手は、2010年の日本でした。
    image: assets/stats/tb_paraguay_data_r2.png
    no_telop: true
  - text: 11月17日に日本と戦うパラグアイは、なぜ点を取らずに勝ち上がれるのでしょうか。
    image: assets/stats/tb_paraguay_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/2026_FIFA_World_Cup_round_of_32
  - https://en.wikipedia.org/wiki/Paraguay_at_the_FIFA_World_Cup
