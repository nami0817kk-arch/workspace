    card: none
  - text: その日本戦で、パラグアイの2点目を決めた選手です。
    image: assets/images/20261106_team_paraguay/b03_dgomez_w.jpg
    card: none
  - text: ドイツ戦の1点を決めたエンシソは22歳。代表39試合で5得点。
    image: assets/images/20261106_team_paraguay/b02_match_w.jpg
    card:
      <<: *id_pl
      highlight_row: 3
  - text: いまはイングランドのイプスウィッチで、日本代表の前田大然と同じクラブです。
    emph: true
    card:
      <<: *id_pl
      highlight_row: 3
  - text: 守備のアルデレテは、イングランドのサンダーランド。代表42試合の29歳です。
    card:
      <<: *id_pl
      highlight_row: 4
