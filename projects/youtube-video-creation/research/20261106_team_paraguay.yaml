# 代表チーム紹介 パラグアイ代表（11/4 作成。固定シリーズ9「代表チーム紹介」。見本は 11/2 のメキシコ代表 scripts/20261102_team_mexico.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **選んだ理由**：日本は 11/17 にシンガポールでパラグアイと戦う（JFA 公式 2026-11-04 発表、https://www.jfa.jp/samuraiblue/news/00036974/ 。現地21:10）。パラグアイ代表は未出（scripts/・research/posted.json・research/covered.yaml を grep。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ・ウルグアイ・ベルギー・スウェーデン・メキシコ）。パラグアイが出てくる過去の台本は日本代表の試合（2025-10 の2対2）などの脇の言及だけ。
# **軸（2026-11-04）**：「パラグアイはW杯の決勝トーナメントで7試合1得点（1986〜2026年）。延長までに勝った試合は0なのに、PK戦で2度勝ち上がった（2010年は日本、2026年はドイツ）」。答えは見立ての節（日本の決勝トーナメント5試合と並べ、自分で数えて割る）。
# ---- 確かめたこと（2026-11-04。requests で Wikipedia の生の wikitext を読んだ。WebFetch の要約は使っていない）----
#  ・FIFAランク：33位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026、Paraguay 33・前回比1・1552.30）。日本は17位。点数は書かない。
#  ・W杯：Paraguay at the FIFA World Cup の Overall record。出場9大会（1930・1950・1958・1986・1998・2002・2006・2010・2026）。最高は2010年の8強。2014・2018・2022年は予選敗退（2026年は「their first since 2010」＝16年ぶり。Paraguay national football team の本文）。
#  ・決勝トーナメントの7試合（同じ記事の試合の表）：1986年16強 イングランド0-3／1998年16強 フランス0-1（ゴールデンゴール）／2002年16強 ドイツ0-1／2010年16強 日本0-0（延長、PK5-3）／2010年8強 スペイン0-1／2026年32強 ドイツ1-1（延長、PK4-3）／2026年16強 フランス0-1。→ 自分で数えた：7試合・1得点・8失点・延長までの勝ち0・PK戦2勝0敗。1試合あたり 1÷7=0.14得点、8÷7=1.14失点。負けた5試合のうち4試合は0対1。
#  ・「エンシソの1点がパラグアイのW杯決勝トーナメントで初めての得点」：2026 FIFA World Cup round of 32 の Germany vs Paraguay 本文「was Paraguay's first ever goal in the knockout stages of the FIFA World Cup」。42分、右のCKのこぼれからエンシソが頭で。54分ハフェルツが頭で同点。PK戦は4対3（ドイツの1人目ハフェルツが失敗、6人目のター（Tah）がバーの上、パラグアイはカナレが決めて終わり）。ドイツにとってW杯で初めてのPK戦の負け（同じ本文）。パラグアイのペニャ大統領が翌日を祝日にした（同じ本文）。ジレット・スタジアム（フォックスボロ）、6月29日。
#  ・2026年W杯の5試合（Paraguay national football team の2026年の試合一覧）：6/12 アメリカ1-4（イングルウッド。パラグアイの1点はマウリシオ73分）、6/19 トルコ1-0（サンタクララ。ガラルサ2分＝開始64秒。Group D の本文「After 64 seconds」）、6/25 オーストラリア0-0、6/29 32強 ドイツ1-1（PK4-3）、7/4 16強 フランス0-1（フィラデルフィア、エムバペ70分PK）。1勝2分2敗・3得点6失点。D組3位で、成績上位の3位として32強へ（Group D 本文「third-place team of Group D, Paraguay, advanced ... as one of the eight best third-place teams」）。
#  ・日本との対戦：Japan national football team records and statistics の Head-to-head「PAR 1995 2025 12 5 5 2 17 12」＝12試合、日本から見て5勝5分2敗・17得点12失点。各試合は Japan national football team results の表：1995-09-20 親善 1-2（東京・国立）／1998-05-17 キリン杯 1-1／1999-07-02 コパ・アメリカ 0-4（アスンシオン）／2001-07-01 キリン杯 2-0（札幌）／2003-06-11 キリン杯 0-0／2008-05-27 キリン杯 0-0／2010-06-29 W杯16強 0-0（延長、PK3-5）／2010-09-04 親善 1-0（横浜）／2018-06-12 親善 4-2（インスブルック）／2019-09-05 親善 2-0（鹿嶋）／2022-06-02 キリン杯 4-1（札幌）／2025-10-10 キリン杯 2-2（吹田。パラグアイ：アルミロン20分・ディエゴ・ゴメス64分、日本：小川航基26分・上田綺世90+4分）。→ 負けは1995年と1999年だけ。2001年以降は9試合負けなし。直近4試合（2018・2019・2022・2025）は日本が毎回2点以上。
#  ・2010年のPK戦（2010 FIFA World Cup knockout stage の Paraguay vs Japan）：プレトリア、日本は遠藤・長谷部が決め、3人目の駒野が失敗、本田が決めて3。パラグアイは5人全員が決めて5（最後はカルドソ）。※日本の結果の表は会場を Free State Stadium と書くが、2010年の記事は Loftus Versfeld。台本は「プレトリア」だけにした。
#  ・日本のW杯決勝トーナメント5試合（Japan at the FIFA World Cup）：2002年16強 トルコ0-1／2010年16強 パラグアイ0-0（PK3-5）／2018年16強 ベルギー2-3／2022年16強 クロアチア1-1（PK1-3）／2026年32強 ブラジル1-2。→ 5試合・4得点・7失点・勝ち上がり0・PK戦0勝2敗。4÷5=0.80、7÷5=1.40。
#  ・監督：グスタボ・アルファロ（Gustavo Alfaro の記事）。アルゼンチン出身、2024年8月13日就任。2022年W杯はエクアドル監督。パラグアイでは26試合12勝8分6敗・30得点22失点（Managerial statistics、updated match played 2 October 2026）。
#  ・主将：グスタボ・ゴメス（Current squad の captain。パルメイラス、DF、1993-05-06、96試合4得点。「Caps and goals updated as of 3 October 2026」）。2026-11-04 時点の年齢（生年月日から計算）：G.ゴメス33、アルミロン（アトランタ・ユナイテッド、MF、1994-02-10）32・82試合12得点、ディエゴ・ゴメス（ブライトン、MF、2003-03-27）23・30試合3得点、エンシソ（イプスウィッチ、FW、2004-01-23）22・39試合5得点、アルデレテ（サンダーランド、DF、1996-12-26）29・42試合3得点、サナブリア（インテルナシオナル、FW、1996-03-04）30・50試合7得点。所属は各選手の記事の current_club でも確かめた。前田大然がイプスウィッチ所属なのは JFA の11/4発表の名簿で確認。
#  ・愛称：La Albirroja（The White and Red。infobox）。コパ・アメリカ優勝は1953年・1979年（infobox の Regional cup best）。
#  ・W杯のあと（2026年の試合一覧）：9/27 ボリビア2-0（ワシントン。アルミロン17分・50分）、10/2 コロンビア1-0（ハリソン。H.ベニテス56分）。次は 11/13 シンガポール、11/17 日本（どちらもシンガポール国立競技場）。
# ---- 言わないもの ----
#  ・怪我／私生活／背番号／戦術の説明／監督の契約／大統領の政治の話（祝日にした事実だけ）／2026年W杯の判定の細部（VAR で取り消したターの得点など）。
