    image: assets/stats/tb_paraguay_data0.png
    no_telop: true
  - text: ワールドカップの最高成績は、2010年の8強。南アフリカ大会です。
    image: assets/stats/tb_paraguay_data1.png
    no_telop: true
  - text: 監督は、アルゼンチン出身のグスタボ・アルファロ。2024年8月に就きました。
    image: assets/stats/tb_paraguay_data4.png
    no_telop: true
  - text: 主将は、守備のグスタボ・ゴメスです。
    image: assets/stats/tb_paraguay_data5.png
    no_telop: true
  - text: 愛称は、アルビロハ。白と赤、という意味の呼び名です。
    image: assets/stats/tb_paraguay_data6.png
    no_telop: true
