    text: 今日は、大きな学びになりました。
    cont: true
    pause: 0.5
  - text: 2度目は、2026年6月29日。ワールドカップの、ラウンド32です。
    image: assets/images/20261022_manager_ancelotti/01_w.jpg
    card:
      <<: *jp_tl
      focus: 1
  - text: 日本が、前半29分に先制。ブラジルが、後半に逆転して、2対1で勝ちました。
    card: none
  - text: 決勝点は、後半のアディショナルタイムです。
    emph: true
    image: assets/images/20261022_manager_ancelotti/06_w.jpg
    card: none
  - text: 3度目は、2026年11月14日。シンガポールで、日本と戦います。
    card:
      <<: *jp_tl
      focus: 2
