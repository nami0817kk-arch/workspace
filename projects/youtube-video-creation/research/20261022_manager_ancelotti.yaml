- id: career
  heading: ひとつのクラブに2年から8年。どこが転機だったのか
  tier: 背景
  telop: 歩みと転機。ミラン8年、レアル2期、5か国のリーグ優勝
  narrator: 解説
  card: &career_tl
    type: timeline
    title: アンチェロッティの監督としての歩み
    rows:
    - [1995〜2001, レッジャーナ、パルマ、ユヴェントス]
    - [2001〜09, ミラン。欧州王者2度（2003・2007）]
    - [2009〜13, チェルシー、パリ・サンジェルマン。国のリーグで優勝]
    - [2013〜17, レアル（10度目の欧州王者）、バイエルン]
    - [2018〜21, ナポリ、エヴァートン]
    - [2021〜25, レアル2期目。欧州王者2度（2022・2024）]
    focus: 0
  say:
  - text: アンチェロッティの監督の道は、1995年、レッジャーナから。
    image: assets/images/20261022_manager_ancelotti/04_w.jpg
    card: *career_tl
  - text: パルマ、ユヴェントスを経て、2001年にミランへ。
    card:
      <<: *career_tl
      focus: 1
  - text: ミランでは、2003年と2007年に欧州王者。2004年は、セリエAも制しました。
    emph: true
    image: assets/images/20261022_manager_ancelotti/05_w.jpg
    card:
      <<: *career_tl
      focus: 1
  - text: チェルシーとパリ・サンジェルマンでも、国のリーグを制しました。
    image: assets/images/20261022_manager_ancelotti/03_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: 2013年、レアルへ。1年目に、10度目の欧州王者を獲ります。
    emph: true
    card:
      <<: *career_tl
      focus: 3
  - text: 2016年のバイエルンでは、ブンデスリーガを制しました。
    image: assets/images/20261022_manager_ancelotti/02_w.jpg
    card:
      <<: *career_tl
      focus: 3
  - text: 2021年、レアルに戻ります。2022年に、スペインのリーグを制して、5か国目。
    emph: true
    image: assets/images/20261022_manager_ancelotti/05_w.jpg
    card:
      <<: *career_tl
      focus: 5
  - text: 2024年には、5度目の欧州王者になりました。
    card:
      <<: *career_tl
      focus: 5
  - text: そして2025年5月、ブラジル代表の監督に就きます。
    image: assets/images/20261022_manager_ancelotti/01_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Carlo_Ancelotti
  - https://www.bbc.com/sport/football/61284264
  - https://www.uefa.com/uefachampionsleague/news/0275-15407684c988-5b733e851bf5-1000--champions-league-winning-coaches-carlo-ancelotti-becomes-fi/
  - https://www.cbf.com.br/selecao-brasileira/noticias/selecao-masculina/a/carlo-ancelotti-e-o-novo-tecnico-da-selecao-brasileira
- id: style
  heading: アンチェロッティのサッカーは、2007年の決勝で、何を見せたのか
  tier: 報道
  telop: 戦術の色。2007年5月23日、ミラン 2-1 リヴァプール
  narrator: 解説
  card: &style_stats
    type: stats
    title: 2007年5月23日 チャンピオンズリーグ決勝（アテネ）
    items:
    - ['2', 点, ミラン]
    - ['1', 点, リヴァプール]
    focus: 0
  say:
  - text: 戦術は、2007年5月23日、アテネの決勝で見ます。
    image: assets/images/20261022_manager_ancelotti/04_w.jpg
    card: *style_stats
  - text: 結果は、ミランの2対1の勝ち。2点は、どちらもインザーギです。
    emph: true
    card: *style_stats
  - text: アンチェロッティは、1トップに、経験のあるインザーギを選びました。
    image: assets/images/20261022_manager_ancelotti/05_w.jpg
    card: none
  - text: 前半45分。ピルロのフリーキックが、インザーギに当たって入ります。
    image: assets/images/20261022_manager_ancelotti/04_w.jpg
    card: none
  - text: 82分。カカのパスで抜け出して、2点目です。
    emph: true
    card: none
  - text: この年のミランは、1トップの後ろに、攻撃的な選手を2人置く形でした。
    image: assets/images/20261022_manager_ancelotti/03_w.jpg
    card: none
  - text: 特徴は、3つ。まず、選手に合わせて、形を変えること。
    card: &style_doc
      type: document
      label: 英語版Wikipediaの要約（訳）
      paragraphs:
      - ユヴェントスでは、ジダンを活かすために、3バックの形に変えた。
      - ミランでは、ピルロを守備的な位置に下げて、司令塔にした。
      - チェルシーでは、ミランで使った「クリスマスツリー」を、シーズンの途中に使った。
      highlight:
      - 形に変えた
      - 司令塔
      - シーズンの途中
  - text: ユヴェントスでは、ジダンを活かすために、3バックの形にしました。
    image: assets/images/20261022_manager_ancelotti/02_w.jpg
    card: *style_doc
  - text: 次に、選手の位置を変えること。ミランでは、ピルロを、守備的な位置に下げました。
    emph: true
    card: *style_doc
  - text: 3つ目は、別のクラブでも、同じ形を使うこと。チェルシーでも使いました。
    image: assets/images/20261022_manager_ancelotti/05_w.jpg
    card: *style_doc
  sources:
  - https://www.uefa.com/uefachampionsleague/news/01c1-0e6e500c2c66-db2412e7ba39-1000--inzaghi-inspires-milan-to-glory/
  - https://www.uefa.com/uefachampionsleague/news/01c1-0e6e4ffbdc21-663b89f11700-1000--ancelotti-savours-greatest-night/
  - https://en.wikipedia.org/wiki/Carlo_Ancelotti
