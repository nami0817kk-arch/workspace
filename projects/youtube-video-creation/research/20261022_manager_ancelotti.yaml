# 監督紹介：アンチェロッティ（10/22 木、シリーズ「監督紹介」、key: manager_ancelotti、型は news）。9節の型（2026-10-20 決定）。見本は 20261021_manager_guardiola。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-21 に自分で）**：research/posted.json・covered.yaml・scripts/ を grep。アンチェロッティを主題にした本は無し（監督紹介は 10/21 のグアルディオラだけ）。
#   ブラジル代表の紹介（20261021_team_brazil・20261006_team_brazil）に名前が出るが、題材は別（代表チーム対 監督の経歴）。ショートの題材（ラフィーニャの10番・ヴィニシウスのPK）に名前が出るが、監督紹介の本編は初。
#
# **いまの立場（一次で確かめた）**
#   ○ ブラジルサッカー連盟（cbf.com.br）2025-05-12 10:53「Carlo Ancelotti é o novo técnico da Seleção Brasileira」
#       https://www.cbf.com.br/selecao-brasileira/noticias/selecao-masculina/a/carlo-ancelotti-e-o-novo-tecnico-da-selecao-brasileira
#       連盟会長が就任を発表。「2026年のワールドカップまで率いる」（当時）。「その週に、エクアドル戦・パラグアイ戦（予選）の招集を始める」。
#   ○ 同 2025-05-26 16:45「Carlo Ancelotti é apresentado e anuncia primeira convocação pela Seleção」（就任会見・初の招集。本人：「É uma honra, é um orgulho comandar a Seleção Brasileira, que é a melhor do mundo.」）
#       https://www.cbf.com.br/selecao-brasileira/noticias/selecao-masculina/a/carlo-ancelotti-e-apresentado-e-anuncia-primeira-convocacao-pela-selecao
#   ○ 同 2026-05-14 13:21「CBF renova contrato de Carlo Ancelotti até 2030」https://www.cbf.com.br/selecao-brasileira/noticias/selecao-masculina/a/cbf-renova-contrato-de-carlo-ancelotti-ate-2030
#       「por mais quatro anos, até a Copa do Mundo de 2030」。本人：「Há um ano cheguei ao Brasil. Desde o primeiro minuto, entendi o que o futebol significa para este país.」「Mas a CBF e eu queremos mais. Mais vitórias, mais tempo, mais trabalho.」
#       「Vamos juntos até a Copa do Mundo de 2030.」。最初の1年の戦績（連盟）：10試合5勝2分3敗・18得点8失点。
#   ○ 同 2026-09-02 23:00「Seleção Brasileira enfrentará Japão e Singapura na Data FIFA de novembro」https://www.cbf.com.br/selecao-brasileira/noticias/selecao-masculina/a/selecao-brasileira-enfrentara-japao-e-singapura-na-data-fifa-de-novembro
#       11/14「日本対ブラジル」（ブラジリア時間 7:15、シンガポール国立競技場）、11/17「シンガポール対ブラジル」。「ワールドカップ後の再戦」。→ **台本は日付と場所だけ言う（時刻は言わない）。**
#   ○ 9月の招集（ge.globo.com 2026-09-09、別セッションの控え）：アンチェロッティの名前で招集。→ 現役のブラジル代表監督。
#   → 題・語りは「ブラジル代表監督」。就任は 2025-05（発表 5/12・会見 5/26）。
#
# **通算の数え方（台本とサムネをそろえる）**＝クラブ・代表のトップチーム。**英語版 Wikipedia「Carlo Ancelotti」Managerial statistics（2026-10-03 時点）の行を自分で足し直した。**
#   行（試合・勝・分・敗）：レッジャーナ 41・17・14・10／パルマ 87・42・27・18／ユヴェントス 114・63・33・18／ミラン 420・238・101・81／チェルシー 109・67・20・22／PSG 77・49・19・9／
#     レアル（1期）119・89・14・16／バイエルン 60・42・9・9／ナポリ 73・38・19・16／エヴァートン 67・31・14・22／レアル（2期）234・161・36・37／ブラジル 20・12・4・4。
#   **合計 1421試合 849勝 310分 262敗（勝率 59.7%）。Wikipedia の合計欄は 850勝・309分と書くが、行を足すと 849・310（各行は 勝＋分＋敗＝試合 で一致）。→ 台本・サムネは自分の足し算（849）を使う。食い違いは報告に書く。**
#   レアル（2期の合計）：353試合 250勝（70.8%）。**レアル公式（realmadrid.com 2025-05-24「Ancelotti, 250 Real Madrid victories」）の「353試合・250勝・15冠（CL3・クラブW杯3・欧州スーパー杯3・リーグ2・国王杯2・スペイン・スーパー杯2）」と一致。**
#   ミラン 238÷420＝56.7%。チェルシー 67÷109＝61.5%。バイエルン 42÷60＝70.0%。ブラジル 12÷20＝60.0%。ほか6チーム（レッジャーナ・パルマ・ユヴェントス・PSG・ナポリ・エヴァートン）459試合240勝＝52.3%。
#   優勝（Wikipedia Honours の「監督」欄を数えた）：レアル15（国内リーグ2・国王杯2・スペイン・スーパー杯2・CL3・欧州スーパー杯3・クラブW杯2・インターコンチネンタル杯1。**レアル公式の15と一致**）／
#     ミラン8（セリエA1・コッパ・イタリア1・スーパーコッパ1・CL2・欧州スーパー杯2・クラブW杯1）／チェルシー3（プレミア・FAカップ・コミュニティ・シールド）／バイエルン3（ブンデス1・スーパーカップ2＝2016・2017）／
#     PSG1（リーグ・アン）／ユヴェントス1（**インタートト杯 1999**。予選の大会だが Wikipedia は優勝に数える）＝**31冠**。インタートト杯を除くと30冠。→ 台本は「31冠」と言い、数え方（トップチームの優勝を Wikipedia の通り）を概要欄の見立てに書く。
#   在任：レッジャーナ 1995-96／パルマ 1996-98／ユヴェントス 1999-2001／ミラン 2001-09／チェルシー 2009-11／PSG 2011-13／レアル 2013-15・2021-25／バイエルン 2016-17／ナポリ 2018-19／エヴァートン 2019-21／ブラジル 2025-。
# **選手時代・基礎**：Wikipedia：1959-06-10 生まれ（エミリア・ロマーニャ州レッジョーロ）。選手：パルマ1976-79、ローマ1979-87、ミラン1987-92。イタリア代表26試合1得点（1981-91）。
#   UEFA（2026-05-30 記事）：選手として ミラン 1989・1990 に欧州王者、監督として 2003・2007（ミラン）・2014・2022・2024（レアル）＝**監督の5度は最多**（「five-time champion Carlo Ancelotti still holds the record as the most successful coach」）。
#   「選手と監督の両方で優勝したのは7人（アンチェロッティ・クライフ・グアルディオラ・ムニョス・レイカールト・トラパットーニ・ジダン）」（同記事）。
#   5か国のリーグ優勝：BBC Sport 2022-04-30「first manager to win the league in all five of Europe's major leagues」。セリエA 2004（ミラン）・プレミア 2010（チェルシー）・リーグ・アン 2013（PSG）・ブンデス 2017（バイエルン）・ラ・リーガ 2022（レアル）。
#
# **日本との接点（一次で確かめた）**
#   ○ JFA マッチレポート 2025-10-15 https://www.jfa.jp/samuraiblue/news/00035627/ ：2025-10-14 東京スタジアム 44,920人、日本3-2ブラジル（キリンチャレンジカップ）。前半26分パウロ・エンリケ・32分マルティネッリで0-2、後半52分南野・62分中村敬斗・71分上田で逆転。
#       **「14度目の対戦で初白星」**。**アンチェロッティのコメント（JFAの日本語。そのまま）：「負けは誰も受け入れることはできないですし、…日本は非常に素晴らしい、強いチームで、特に後半の前線でのプレッシャーで我々はビルドアップが難しかった。今日は大きな学びになりました。」**
#   ○ JFA マッチレポート https://www.jfa.jp/samuraiblue/news/00036487/ ：2026-06-29（現地）ヒューストン、W杯ラウンド32、日本1-2ブラジル。29分に佐野海舟が先制、56分カゼミーロ、後半アディショナルタイムにマルティネッリ。
#   ○ CBF（上）：2026-11-14 日本対ブラジル（シンガポール）。JFA の日程（別セッションの控え）と一致。
#   × **久保建英との縁は確かめられなかった**。検索で出たのは2024年のスペイン紙の記事（レアル・ソシエダ戦のあとの発言、本文の全文を読めていない）だけで、一次情報（クラブ・連盟）に当たらないので**台本に入れない**。
#   × 日本人選手との直接の縁（ミラン・チェルシー等で指導した日本人）は見つからなかった（Wikipedia のクラブ記事にも無し）。入れない。
#
# **歩みと転機（Wikipedia の監督歴・在任の日付、UEFA・BBC で裏取り）**
#   1992-95 イタリア代表のアシスタント → 1995 レッジャーナ（Wikipedia 在任 1995-07〜96-06）→ パルマ → 1999-02 ユヴェントス → 2001-11 ミラン（8シーズン近く）→ **2003 CL 優勝（ユヴェントスとの決勝）**・2004 セリエA・**2005 イスタンブール（3点リードから追いつかれ PK 負け。UEFA）**・**2007 アテネで同じ相手に2-1（UEFA）**→
#   2009 チェルシー（2010 プレミア・FAカップ）→ 2011-12 PSG（2013 リーグ・アン）→ 2013 レアル（**2014 ラ・デシマ＝10度目の欧州王者**。BBC）→ 2015 退任 → 2016 バイエルン（2017 ブンデス）→ 2018 ナポリ → 2019 エヴァートン →
#   2021-06 レアルへ戻る → 2022 ラ・リーガ（5か国目）→ 2024 CL 5度目（UEFA）→ 2025-05 ブラジル代表。
#   ※解任・退任の経緯（バイエルン 2017-09、ナポリ 2019-12）は台本に入れない（「退任」ですら言わず、在任の年だけ）。
# **戦術の色（実例の試合＝2007-05-23 アテネ、ミラン 2-1 リヴァプール）**
#   ○ UEFA「Ancelotti savours 'greatest night'」（2007-05-23）：結果・日付・会場、本人「It is the greatest victory we've had.」「Few people believed we could do it, but we've done something extraordinary.」
#   ○ UEFA「Inzaghi inspires Milan to glory」（2007-05-23）：インザーギ 45分（ピルロのFKが当たって入る）・82分頃（カカのパスで抜け出す）。「coach Carlo Ancelotti's decision to select the veteran ahead of Alberto Gilardino」。
#       **ミランの並び（4-3-2-1）は UEFA の記事に無い**。英語版 Wikipedia「Style of management」：2006-07にシェフチェンコが去ったあと 4-3-2-1（「クリスマスツリー」）、1トップ＋カカ・セードルフ、ピルロは守備的な位置。→ 背景（tier 背景）として言う。
#   ○ Wikipedia：パルマでは4-4-2に固執、ユヴェントスでジダンのために 3-4-1-2、チェルシーでは前線が不在の時期に 4-3-2-1。（二次。要約は「Wikipedia の要約（訳）」と断る）
# **本人の言葉（自訳。原文は出典）**：①UEFA 2024-06-01「It is very important to keep learning because life changes and football changes.」「If I proposed what I used to do 20 years ago as a coach, everyone would take me for a fool.」
#   https://www.uefa.com/uefachampionsleague/news/028d-1afca21173de-27c5ac6b118d-1000--real-madrid-coach-carlo-ancelotti-on-his-uefa-champions-l/ ／②CBF 2026-05-14 ／③CBF 2025-05-26 ／④UEFA 2007-05-23（上）。⑤JFA 2025-10-14（日本語のまま）。
#
# **入れなかったもの**：私生活、年俸、代理人、法的な問題、解任の経緯、久保建英・日本人選手との縁（確かめられず）、他の監督との優劣、女子チーム、Jリーグ、報道・SNSの反応。
# **日本語名・読みで怪しいもの**：アンチェロッティ、レッジョーロ、レッジャーナ、パルマ、ユヴェントス、ミラン、チェルシー、リヴァプール、パリ・サンジェルマン、レアル・マドリード、バイエルン、ナポリ、エヴァートン、インザーギ、ジラルディーノ、ピルロ、カカ、ジダン、ブンデスリーガ。
