- id: secret
  heading: 数字の外にある話。5度の優勝の手前にあった、1つの負け
  tier: 確定
  official: true
  telop: 2005年の決勝で負けた相手に、2007年の決勝で勝った
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [2005年, イスタンブールの決勝。3点を先行して、PKで敗れる]
    - [2007年, アテネの決勝。同じ相手に2-1で勝つ]
    - [1989・1990年, 選手として、ミランで欧州王者に2度]
    - [2024年, 監督として5度目。選手と監督の両方は史上7人]
    highlight_row: 0
    source: UEFA
  say:
  - text: 数字の外にある話です。5度の優勝の手前には、1つの負けがありました。
    image: assets/images/20261022_manager_ancelotti/05_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 2005年、イスタンブールの決勝。ミランは、3点を先行していました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: ところが、リヴァプールに追いつかれ、ペナルティーキックで敗れます。
    image: assets/images/20261022_manager_ancelotti/04_w.jpg
    card: none
  - text: 2年後の2007年、アテネの決勝で、同じ相手と当たります。
    emph: true
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 勝ったあとの、アンチェロッティの言葉です。
    image: assets/images/20261022_manager_ancelotti/03_w.jpg
    card: none
  - voice: アンチェロッティ
    text: 私たちが手にした、いちばんの勝利です。
  - voice: アンチェロッティ
    text: できると信じた人は、少なかった。
    cont: true
  - voice: アンチェロッティ
    text: でも私たちは、特別なことをやり遂げました。
    cont: true
    pause: 0.6
  - text: もう1つ。選手としても、ミランで欧州王者に2度なっています。
    image: assets/images/20261022_manager_ancelotti/02_w.jpg
    card:
      <<: *sec_table
      highlight_row: 2
  - text: 選手と監督の両方で欧州王者になったのは、史上7人。
    emph: true
    image: assets/images/20261022_manager_ancelotti/06_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  - text: アンチェロッティは、その1人です。
    card: none
  quotes_from:
  - https://www.uefa.com/uefachampionsleague/news/01c1-0e6e4ffbdc21-663b89f11700-1000--ancelotti-savours-greatest-night/
  sources:
