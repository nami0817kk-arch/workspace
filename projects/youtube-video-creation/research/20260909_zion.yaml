sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 日本人GKとして史上初のCL出場
    say:
      - チャンピオンズリーグ第1節、アストン・ヴィラは敵地でクラブ・ブルッヘと戦いました。
      - すずきざいおんは先発フル出場です。
      - 日本人ゴールキーパーとして、史上はつのチャンピオンズリーグ出場になりました。
      - 試合は3対2でヴィラの勝ち。ヴィラは今季の公式戦はつ勝利です。
      - すずきは2失点しましたが、3本のシュートをセーブしています。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202631.html
      - https://web.gekisaka.jp/news/ucl/detail/?458507-458507-fl
      - https://www.footballchannel.jp/2026/09/09/post1006971/

  - id: match
    heading: 試合はどう動いたか
    tier: 報道
    telop: 9分・68分に見せ場
    say:
      - 9分、ヤン・ヴィルジリが鋭いカットインからシュートを放ちます。
      - すずきはこれをパンチングで防ぎました。相手のはつのシュートです。
      - 11分にジョン・マッギンが先制、19分にヴィルジリのクロスからヴェトレセンに決められて同点。
      - 22分にブエンディア、43分にトーレスのロングパスからジャクソンが決めて、前半は3対1です。
      - ジャクソンはこれがヴィラでの公式戦はつゴールでした。
      - 後半、61分にペナルティーキックをトレソルディに沈められて1点差。
      - 68分、ヴェトレセンの強烈なミドルシュートを、すずきがセーブしました。
      - 3対2のまま、ヴィラが逃げ切っています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006971/
      - https://www.footballchannel.jp/2026/09/09/post1006896/

  - id: rating
    heading: 現地はどう採点したか
    tier: 報道
    telop: 8点。チーム最高タイの評価
    say:
      - 現地メディア、アストン・ヴィラ・レビューはすずきに8点を付けました。
      - パウ・トーレス、ジョアン・ゴメスと並ぶ、チーム最高タイの評価です。
      - 2失点しながら、なぜこの点数だったのか。同紙はこう書いています。
      - {voice: 現地メディア, text: 鈴木がアウェイゴールに壁を築いた}
      - {voice: 現地メディア, text: ブルッヘが攻め、鈴木が止め、アストン・ヴィラが耐えた}
      - {voice: 現地メディア, text: 後半は鈴木に頼らざるを得なかった}
      - {voice: 現地メディア, text: その期待に応えた}
      - {voice: 現地メディア, text: パスはいつも通り、レンジの広さと質の両面で素晴らしかった}
      - {voice: 現地メディア, text: ストライカーやウインガーへの良いロングボールもあった}
      - {voice: 現地メディア, text: ボール保持で存在感を示した}
      - {voice: 現地メディア, text: 我々が辛抱強くプレーする助けになった}
      - {voice: 現地メディア, text: 素晴らしい補強になったように見える}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006896/
      - https://football-tribe.com/japan/2026/09/08/359027/

  - id: said
    heading: 本人は何と言っているか
    tier: 報道
    telop: 「彼が求めていることはとても興味深い」
    say:
      - すずきは今夏、パルマからヴィラへ移りました。
      - プレミアリーグ第2節のアーセナル戦ではつの先発。そこから2試合連続で先発しています。
      - 本人は新しいチームについて、こう話しています。
      - {voice: 鈴木彩艶, text: エメリ監督の下でプレーするのは楽しい}
      - {voice: 鈴木彩艶, text: 彼が求めていることはとても興味深い}
      - {voice: 鈴木彩艶, text: それは僕のスタイルでもある}
      - {voice: 鈴木彩艶, text: アーセナル戦では足でチャンスを作ろうとした}
      - {voice: 鈴木彩艶, text: ゴールにはつながらなかったがそれを続けたい}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/07/post1005393/
      - https://www.footballchannel.jp/2026/09/06/post1004895/
