no_main: true      # ニュースはショートだけ（2026-10-14）。締めで本編を案内しない
people: [トレゾルディ, キヴ監督, インテル]

theme:
  id: tresoldi_brugge_inter
  league: italy
  prefix: ""
  title: "トレゾルディの3ゴール、サン・シーロでインテルに4-3。キヴ監督が口にした敗因"
  hook: ""
  question: インテルはなぜ、ホームで4点を取られたのか

thumbnail:
  line1: トレゾルディ3発
  line2: インテル、勝ち点0の2連敗
