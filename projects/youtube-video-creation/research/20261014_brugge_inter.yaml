answer: 監督は「慌てて距離とバランスを失った」と説明した。GKのミスなど個人の失点も重なった
watch: 次はホームでシャフタール。勝ち点0のインテルが立て直せるか

sections:
  - id: score
    heading: 試合はこうなった
    tier: 報道
    telop: インテル 3-4 ブルッヘ
    say:
      - チャンピオンズリーグ第2節、インテルはホームのサン・シーロでクラブ・ブルッヘに3対4で敗れました。
      - 点を取ったのは、30分にPKでトレゾルディ。44分にラウタロ・マルティネスが追いつきます。
      - 後半はトレゾルディが63分と74分に決めて、ハットトリック。
      - ラウタロが82分に追い上げましたが、87分にヴェルマント。インテルのボニーが90分すぎに決めましたが、3対4で終わりました。
    official: false
    sources:
      - https://www.inter.it/en/news/inter-club-brugge-champions-league-2026-27
      - https://www.theguardian.com/football/2026/oct/13/champions-league-lens-sporting-inter-barcelona-bayern-napoli
      - https://football-italia.net/ucl-inter-3-4-club-brugge-terrific-tresoldi/

  - id: voices
    main: true
    heading: 試合後の言葉
    tier: 報道
    telop: キヴ監督「責任は私にある」
    say:
      - {text: 'チャンピオンズリーグ、ホームのインテルは2連敗でした。', short_only: true}
      - 敗れたインテルのキヴ監督は、クラブを通じて試合を振り返りました。
      - voice: キヴ
        text: 後半は少し慌ててしまった。プレスでバランスと形を失い、1対2とリードされたことで勢いも落ち着きも削られた
      - voice: キヴ
        text: 相手は強度も個性も技術も、外のスピードもあった。敬意を払わなければならない
      - voice: キヴ
        text: 責任は私にある。試合によって、うまくバランスを見つけられていないのかもしれない
      - voice: キヴ
        text: ハーフタイムに、もっと落ち着きと冷静さを伝えるべきだったのかもしれない
      - voice: キヴ
        text: 何より、自分たちへの信頼を失ってはいけない。まだ6試合残っている
      - 点を取った側のトレゾルディは、イタリアのスカイ・スポーツでこう話しています。
      - voice: トレゾルディ
        text: ぼくにとってはダービーのようなものだった。ここサン・シーロでプレーするのは、ずっと夢だった
      - voice: トレゾルディ
        text: ミラニスタのぼくには、インテル相手なら、なおさら。夢が叶った子どもみたいな気持ちだ
    official: false
    sources:
      - https://www.inter.it/en/news/chivu-interview-post-inter-club-brugge-champions-league-2026-27
      - https://football-italia.net/chivu-inter-champions-league-record-worrying/
      - https://www.gazzetta.it/Calcio/Serie-A/Inter/14-10-2026/chivu-inter-bruges-conferenza.shtml
      - https://football-italia.net/tresoldi-a-dream-come-true-feels-like-a-derby/

  - id: turning
    heading: 試合が決まった場面
    tier: 報道
    telop: PK、GKのミス、こぼれ球
    say:
      - 最初の1点は、カルハノールがフォルブスを倒して取られたPKでした。
      - トレゾルディは、ゴール上を射抜いて決めています。
      - インテルも前半のうちに、ディマルコのヒールパスからラウタロが同点にしました。ここまでは互角です。
      - 流れが変わったのは後半。GKジョゼップ・マルティネスのミスのあと、トレゾルディが2点目。
      - 3点目はGKが止めたシュートのこぼれ球に、インテルの守備陣より先に反応しました。
      - 3対1のあと、インテルは同点のチャンスを2回つくりました。
      - しかしカウンターで、ヴェルマントに決められました。
    official: false
    sources:
      - https://www.theguardian.com/football/2026/oct/13/champions-league-lens-sporting-inter-barcelona-bayern-napoli
      - https://football-italia.net/ucl-inter-3-4-club-brugge-terrific-tresoldi/
      - https://www.marca.com/futbol/champions-league/cronica/2026/10/13/tresoldi-estelariza-autentica-noche-brujas-milan.html
      - https://www.inter.it/en/news/inter-club-brugge-champions-league-2026-27

  - id: numbers
    heading: 数字で見ると
    tier: 報道
    telop: 8試合で14失点
    say:
      - インテルは今季、セリエAとチャンピオンズリーグを合わせた8試合で14失点しています。
      - チャンピオンズリーグでは、直近8試合で7敗。今大会はまだ勝ち点0です。
      - キヴ監督は、この成績を「心配でないとは言えない」と認めています。
      - 一方のトレゾルディは22歳。イタリア生まれで、ドイツで育ち、ミランのファンだと自分で話しています。
      - 今季はこれで、ブルッヘで11試合9ゴールです。
    official: false
    sources:
      - https://www.gazzetta.it/Calcio/Serie-A/Inter/14-10-2026/chivu-inter-bruges-conferenza.shtml
      - https://football-italia.net/chivu-inter-champions-league-record-worrying/
      - https://www.gazzetta.it/Calcio/Champions-League/14-10-2026/tresoldi-sulla-nazionale-ho-parlato-con-mancini-e-klopp-vedremo.shtml
      - https://football-italia.net/tresoldi-a-dream-come-true-feels-like-a-derby/

  - id: next
    heading: 順位と次の一戦
    tier: 報道
    telop: 次はホームでシャフタール
    say:
      - インテルは初戦でレアル・マドリードに1対2で負けていて、2試合を終えて勝ち点は0です。
      - 次の試合は、来週ホームでシャフタール・ドネツク戦。
      - ブルッヘは初戦でアストン・ヴィラにホームで敗れていましたが、次はホームで、フランスのランスを迎えます。
      - トレゾルディは、代表をドイツにするかイタリアにするか、まだ決めていません。両方と話したと語りました。
    official: false
    sources:
      - https://www.theguardian.com/football/2026/oct/13/champions-league-lens-sporting-inter-barcelona-bayern-napoli
      - https://football-italia.net/tresoldi-an-incredible-night-italy-germany/
      - https://www.marca.com/futbol/champions-league/cronica/2026/10/13/tresoldi-estelariza-autentica-noche-brujas-milan.html

