      - [サール, ユヴェントス, '2.80', 条件つきの義務]
      - [ドラグシン, フィオレンティーナ, '1.50', 条件つきの義務]
  - text: 3人とも、条件を満たせば来夏に買い取られる約束。発表文にあります。
    card: *loans
  - text: いちばん高い買いと、いちばん高い売り。2人を並べます。
    image: assets/images/20261018_transfer_tottenham/a01_stadium_w.jpg
    card: &duel
      type: duel
      left: {name: トナーリ, club: 買った（ニューカッスルから）, photo: assets/images/20261018_transfer_tottenham/b01_tonali_sq.jpg, color: "#132257"}
      right: {name: ヴシュコヴィッチ, club: 売った（ブライトンへ）, photo: assets/images/20261018_transfer_tottenham/b05_vuskovic_sq.jpg, color: "#b8860b"}
