    card: {type: table, title: 払った額の大きい順（移籍金の付いた5人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 4}
  - text: 移籍金なしで、3人が加わりました。ロバートソン、セネシ、ドゥブラフカ。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた5人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 5}
  - text: そして、借りた2人。マルモウシュとムドリクは、額に入っていません。
    image: assets/images/20261018_transfer_tottenham/a02_stadium_w.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた5人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 6}
  - text: マルモウシュには、来夏に買い取る義務が付いています。
