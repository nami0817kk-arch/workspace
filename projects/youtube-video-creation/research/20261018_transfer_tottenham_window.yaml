  - text: いちばん高いのは、ヴシュコヴィッチ。ブライトンへ、5400万ユーロ。
    emph: true
    image: assets/images/20261018_transfer_tottenham/b05_vuskovic_w.jpg
    card: none
  - text: 報じられた額は、最初の払いが4600万ポンド。出来高は最大400万ポンド。
    image: assets/images/20261018_transfer_tottenham/a02_stadium_w.jpg
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 0}
  - text: 19歳のクロアチア代表。報道は、次に売れたときの20%が入る約束付き。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 0}
  - text: 2人目は、ロメロ。アトレティコ・マドリードへ、3300万ユーロ。
    emph: true
    image: assets/images/20261018_transfer_tottenham/b06_romero_wr.jpg
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 1}
  - text: ロメロの退団を伝えた発表文は、こうです。
    card: &doc_romero
      type: document
      label: トッテナム 公式発表（8月15日）ロメロ退団の文（訳）
      paragraphs:
      - アトレティコ・マドリードとの間で、クリスティアン・ロメロの移籍に合意した。
      - 2021年にアタランタから加わり、2024-25のヨーロッパリーグ優勝の主力で、2025-26は主将に指名された。
      highlight:
      - 合意
      - 主将
  - text: 昨季の主将を売りました。額は、この文にもありません。
    card: *doc_romero
  - text: 報道は、出来高込みで3420万ポンド。次に売れたときの15%が入る約束付き。
    card: *doc_romero
  - text: 3人目は、スペンス。インテルへ、3000万ユーロ。
    image: assets/images/20261018_transfer_tottenham/b07_spence_w.jpg
    card: none
  - text: 報道は、3000万ポンドの総額。通貨が違い、額も合いません。
    image: assets/images/20261018_transfer_tottenham/a01_stadium_w.jpg
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 2}
  - text: この3人で、売った額のおよそ74%です。
    emph: true
    card: &calc_sold3
      type: calc
      title: 売った額のうち、上の3人の割合
      terms:
      - ['1億1700万ユーロ', 上の3人]
      - ['1億5705万ユーロ', 売った8人の合計]
      - [約74%, 3人の割合]
      ops: ['÷', ＝]
  - text: 残る5人は、ランクシャー、ベリス、フィリップス、ソロモン、デヴァイン。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 3}
  - text: 貸し出し料が付いたのは3件。合わせて720万ユーロです。
    card: {type: table, title: 売った選手（受け取った額の大きい順）, columns: ['選手', '行き先', '百万ユーロ'], rows: [*o1, *o2, *o3, *o4, *o5], highlight_row: 4}
  - text: 貸したのは、ダンソ、サール、ドラグシンの3人。
    card: &loans
      type: table
      title: 貸し出し料の付いた3件
      columns: ['選手', '行き先', '百万ユーロ', '来夏の買い取り']
      rows:
