      label: トッテナム 公式発表（8月27日）マルモウシュ加入の文（訳）
      paragraphs:
      - エジプト代表のフォワード、オマル・マルモウシュの1年間の貸し出しでの獲得を発表する。
      - 契約には、来夏に完全移籍へ切り替える義務が含まれる。
      highlight:
      - 1年間
      - 来夏
      - 義務
  - text: 義務はクラブの発表にあります。額は、ありません。
    card: *doc_marmoush
  - text: 報道では、買い取りは最低5000万ポンド。出来高は、別に1000万ポンドまで。
    card: *doc_marmoush
  - text: ムドリクは貸し出しだけ。買い取りの約束は、クラブの発表に書かれていません。
    card: *doc_marmoush
  - text: ポンドの報道とユーロの集計は、足せません。この額は、今夏の合計の外に置きます。
    card: none
