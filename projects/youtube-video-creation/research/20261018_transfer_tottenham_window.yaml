      - [報じられた額, 最大約1億£, 約0.5億£]
      bars: [移籍直前の市場価値, 額（集計）]
  - text: 年齢は、26歳と19歳です。
    card: {<<: *duel, highlight_row: 年齢}
  - text: 移籍直前の市場価値、つまりサイトの推定は、買ったほうが約1.3倍。
    card: {<<: *duel, highlight_row: 移籍直前の市場価値}
