# 移籍の深掘り 第7回：トッテナムの2026年夏（「1クラブの移籍期間」の回）。10/18 作成。
# 材料の控え：research/raw/20261018_transfer_tottenham_window.md。**材料から出ない。**
#
# **角度：「払った額は世界3位。売って戻った額は、何割か」。**
#   Transfermarkt の世界の一覧（2026年夏・支出順・1ページ目＝支出の上位25クラブ）で、3位トッテナム 366.35（加入18）／収入 164.25（退団19）／差し引き −202.10。
#   **10/17 のチェルシーの回のメモにあった「戻った割合 約43%」は、貸し出し料を除いた売りだけ（157.05÷366.35＝42.9%）の暫定値。**
#   貸し出し料（7.20）を足した一覧の収入 164.25 で数え直すと **44.8%（45%）**。台本は 45% を使い、売りだけだと 43% と区別して言う（言うのは 45% だけ）。
#
# **数字の確度。**移籍金は Transfermarkt の集計で**確度は「報道」**。
#   - **クラブ公式（tottenhamhotspur.com）の発表文を読んだ：買い（トナーリ・M・フェルナンデス・サビオ・ファン・ヘッケ・アダラビオヨ・セネシ・ドゥブラフカ・ロバートソン）、
#     借り（マルモウシュ・ムドリク）、売り（ヴシュコヴィッチ・ロメロ・スペンス・ランクシャー・フィリップス）、貸し出し（ダンソ・サール・ドラグシン）。額は1つも書かれていない。**
#     ヴェリス・ソロモン・デヴァインの退団は公式の記事を読めていない（集計だけ）→ 台本では「ほか5人」に入れ、個別には触れない。
#   - 報道の額は**ポンド**：トナーリ「最大1億ポンド・最初の払い9250万」（ロイター配信）、M・フェルナンデス8500万（Sky）、サビオ7500万＋出来高1000万（Sky）、
#     ファン・ヘッケ5200万・固定で出来高なし（ESPN）、アダラビオヨ700万＋出来高（PA）、
#     売り：ヴシュコヴィッチ 固定4600万＋出来高400万（Sky）、ロメロ 約3420万＝4000万ユーロ・出来高込み・次の売却益の15%（Sky）、スペンス 3000万・総額・10%（Sky）。
#   - **集計のユーロは、報じられた「最初の払い」のポンドの約1.15〜1.17倍に当たる**（M・フェルナンデス99.00÷85＝1.165、サビオ87.70÷75＝1.169、ファン・ヘッケ60.00÷52＝1.154、ヴシュコヴィッチ54.00÷46＝1.174、トナーリ108.00÷92.5＝1.168）。
#     つまり集計の額は出来高を含まない最初の払いに近い。**合わない1件：アダラビオヨ（報道は700万ポンド＋出来高、集計は1165万ユーロ）、スペンス（報道3000万ポンドの総額、集計は3000万ユーロ）。**台本はそのまま「合わない」と言う。
#   - **固定かボーナス込みかは、クラブの発表に無い。**買い取りオプション・義務の額は、報道で割れている（サール：2750万ユーロ、ドラグシン：1750万か2500万ユーロ）ので額は言わない。
#   - 貸し出し料3件（2.90＋2.80＋1.50）は収入164.25に入っている。借りた2人（マルモウシュ・ムドリク）は額に入っていない。
#
# **自分で数えた数**（百万ユーロ。足し算で一覧と一致を確かめた）:
#   払った額 108.00＋99.00＋87.70＋60.00＋11.65＝366.35 ← 一覧と一致（移籍金の付いた加入5人。ロバートソン・セネシ・ドゥブラフカは移籍金なし）。
#   戻った額 売り8人 54.00＋33.00＋30.00＋11.70＋9.00＋8.20＋5.85＋5.30＝157.05、貸し出し料3件 2.90＋2.80＋1.50＝7.20 → 計 164.25 ← 一覧と一致。
#   差し引き 164.25−366.35＝−202.10 ← 一覧と一致。戻った割合 164.25÷366.35＝44.83%（45%）／売りだけ 157.05÷366.35＝42.87%（43%）／戻らなかった 202.10（55%）。
#   買い上位3人 108.00＋99.00＋87.70＝294.70 → ÷366.35＝80.4%（80%）。売り上位3人 54＋33＋30＝117 → ÷157.05＝74.5%（約74%。0.74498）／残り5人 40.05。
#   7月6日までに買った3人（ファン・ヘッケ6/18・M・フェルナンデス7/2・トナーリ7/6）60＋99＋108＝267.00 → ÷366.35＝72.9%（73%）／あとの2人（サビオ8/25・アダラビオヨ9/1）99.35。
#   8月15日（クラブの発表日）に売った3人（ロメロ・スペンス・フィリップス）33＋30＋8.20＝71.20 → ÷157.05＝45.3%（45%）。
#   市場価値（Transfermarkt の移籍の記録の details.marketValue＝移籍時。13人とも API で確認）：
#     買い5人 80＋50＋35＋45＋16＝226 → 366.35÷226＝1.621（約1.62倍）／サビオ 87.70÷35＝2.506（約2.5倍）／線より下は1人（アダラビオヨ 16→11.65）。
#     売り8人 60＋50＋40＋7＋4＋7＋8＋8＝184 → 157.05÷184＝0.854（約0.85倍）／線より下5人（ヴシュコヴィッチ・ロメロ・スペンス・ソロモン・デヴァイン）・上3人（ランクシャー・ベリス・フィリップス）。
#   買ったトナーリ108.00は売ったヴシュコヴィッチ54.00のちょうど2倍（108÷54＝2.0）。
#   為替：ECB 参照相場 2026-10-16＝1ユーロ177.82円（再確認）。202.10×177.82＝35,937百万円＝約359億円。
#   プレミア20クラブの差し引きのマイナス（大きい順）：リヴァプール −233.40／トッテナム −202.10／イプスウィッチ −201.29／シティ −189.18（トッテナムは2番目。3位との差 0.81）。
#   支出の上位4クラブの戻った割合：シティ 337.02÷526.20＝64.0%／チェルシー 447.80÷407.48＝109.9%（110%）／トッテナム 44.8%／ニューカッスル 279.10÷313.00＝89.2%（89%）。
#   次の窓：プレミアリーグ公式 — 夏は6/15〜9/1 23:00 BST、冬は2027/1/1〜2/1。
# 数字の重なり対策：チェルシー（10/17）は『447.80』『4030万』『82%』『63%』『1.31倍』『1.27倍』を使った。こちらは別の数字・別の問い。
#   10/16 のトッテナムの財政の回は 2025年6月期の決算（ポンド）。こちらは今夏の移籍だけ。決算の数字（赤字・借入・収入5億6530万ポンド）には触れない。
# 板：①waterfall・convert・table（赤字の大きい順） ②table・document・convert・calc・table（借り）③table・document・calc・table（貸し出し）・duel ④timeline・calc ⑤scatter 2枚・calc・table（赤ペン）。
# 写真（10/18 取得）：クラブ公式（tottenhamhotspur.com の記事の主写真）。トナーリ・M・フェルナンデス・サビオ・ファン・ヘッケ・ヴシュコヴィッチ・ロメロ・スペンス。出典は assets/images/20261018_transfer_tottenham/credits.json。
