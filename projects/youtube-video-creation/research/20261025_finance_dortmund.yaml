# クラブの財政：ボルシア・ドルトムント（10/25 日、シリーズ「クラブの財政」、key: finance_dortmund、型は news）。
#
# 軸は「**上場クラブなので3か月ごとに数字が出る。半年たった時点の黒字1870万ユーロが、通年では赤字2170万ユーロになった。その差（約4040万）は、どこで消えたのか**」。
#   答え：春（1〜6月）の放映権。チャンピオンズリーグを決勝トーナメントへのプレーオフで去り、テレビの収入が前の年より5870万ユーロ減った（減った収入6550万の約9割）。
#   夏の選手の売却益（5930万のうち5290万が7〜9月）で前半は黒字だったが、後半を支える収入が無かった。
#   ★他の財政回（バルサ・シティ・アルテタ・レアル・PSG・バイエルン・リヴァプール・マンU・トッテナム・シティ×アーセナル・チェルシー・インテル・ヴィラ・ユヴェントス・アトレティコ・ミラン・ニューカッスル）の軸は繰り返さない。
#     バイエルン回の軸（株の持ち主＝会員、50プラス1）は出さない。株主の話は「上場している」「3か月ごとに数字を出す」「時価総額」までにとどめる。
#     10/22 の bd_dortmund（クラブ紹介：満員の観客・香川・1997年CL・倒産寸前から連覇）の中身は使わない。観客数・倒産寸前の話は出さない。
#   ★日本との接点：財政の数字には無い（香川の話は bd_dortmund で扱った）。無理に入れない（10/6 の決定）。
#   ★選手個人の名前・移籍金の額・給料は出さない。女子・監督の話はしない。「経営が危ない」と断定しない。
#
# **決算期**：6月30日決算。2025-26＝2025年7月1日〜2026年6月30日（速報は2026-08-21）。2026-27 の第1四半期の発表は2026-11-12（クラブの資料の財務カレンダー）。
#
# **出どころ（読んだもの）**
#   ○ クラブの適時開示（EQS 経由のアドホック開示。発行体が内容に責任を持つ一次の文書。deraktionaer.de と boerse-online.de に全文が転載。requests で本文を取得）
#     ・通年の速報 2026-08-21「Borussia Dortmund meldet vorläufige Zahlen zum Geschäftsjahr 2025/2026」
#       https://www.deraktionaer.de/nachricht/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-zum-geschaeftsjahr-20252026-deutsch-546541.html
#       「Konzernumsatzerlöse EUR 460,5 Mio. (Vorjahr: EUR 526,0 Mio.)」「Rückgang um EUR 65,5 Mio. ... insbesondere auf die TV-Vermarktung ... das Achtelfinale der UEFA Champions League verpasste, nachdem im Vorjahr das Viertelfinale erreicht worden war」
#       「stichtagsbedingt geringere Einnahmen aus der Teilnahme an der FIFA Klub-Weltmeisterschaft 2025」「Die Werbeerlöse verzeichneten hingegen erneut einen Anstieg」
#       「Konzernjahresfehlbetrag EUR 21,7 Mio. (Vorjahr: Konzernjahresüberschuss von EUR 6,5 Mio.)」「EBT EUR -20,3 Mio. (Vorjahr: EUR 9,5 Mio.)」「EBITDA EUR 92,2 Mio. (115,9)」
#       内訳（百万ユーロ、今年／前の年）：Spielbetrieb 50.3/55.2、Werbung 157.9/153.6、TV-Vermarktung 168.5/227.2、Merchandising 38.7/40.0、Conference, Catering, Sonstige 45.1/50.0
#       「Ergebnis aus Transfergeschäften EUR 59,3 Mio. (Vorjahr: EUR 37,8 Mio.)」「Bruttokonzerngesamtleistung EUR 537,2 Mio. (589,6)」
#       「Personalaufwendungen von EUR 268,3 Mio. um EUR 8,4 Mio. auf EUR 259,9 Mio.」「Abschreibungen 105,3 → 111,4」「sonstige betriebliche Aufwendungen 162,3 → 145,4」
#       「Aufgrund des Jahresfehlbetrags kann der Hauptversammlung für das Geschäftsjahr 2025/2026 keine Dividendenausschüttung vorgeschlagen werden」
#       「erwartet für das Geschäftsjahr 2026/2027 ... ein Konzernjahresergebnis in einer Bandbreite von EUR 0 Mio. bis EUR 10 Mio.」（移籍と成績で変わりうる、と注記）
#     ・第1四半期 2025-11-07：Konzernergebnis EUR 22,9 Mio.、Umsatz 107,0、Ergebnis aus Transfergeschäften 52,9 Mio.
#       https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-fuer-das-erste-quartal-q1-20252026-deutsch-482216.html
#     ・半期 2026-02-09：Konzernergebnis EUR 18,7 Mio.（前の年の半期 7,7）、Umsatz 246,4、Transfer 54,9
#       https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-fuer-das-erste-halbjahr-h1-des-geschaeftsjahres-20252026-deutsch-501210.html
#     ・第3四半期 2026-05-04：9か月の Konzernergebnis nach Steuern EUR 5,9 Mio.（前の年 12,9）、「Ausscheiden aus den Play-Offs der UEFA Champions League」が主因、
#       9か月の TV 151,4（前の年 162,7）、Umsatz 371,4（393,3）、Transfer 55,1。第3四半期だけの Konzernergebnis EUR -12,8 Mio.
#       https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-veroeffentlicht-vorlaeufige-zahlen-fuer-das-dritte-quartal-q3-20252026-deutsch-521877.html
#   ○ クラブ公式の記事（bvb.de、2026-08-21「Bilanzpressekonferenz 2026: BVB kerngesund, kostenoptimiert und wachstumsstark」requests で本文）
#       「wie bereits im Februar 2026 prognostiziert, einen Jahresfehlbeitrag von 21,7 Mio. EUR」「das frühe Ausscheiden aus der UEFA Champions League gegen Atalanta Bergamo ... Umsatzrückgang von 65,6 Mio. EUR」
#       「Die Bilanz des einzigen börsennotierten Bundesligisten」、トレス取締役「Der Jahresfehlbeitrag von über 20 Millionen Euro ist für uns nicht zufriedenstellend. Gleichzeitig liegt unser Eigenkapital weiterhin bei rund 300 Mio. EUR,
#       die Eigenkapitalquote übersteigt 50 Prozent, neue Finanzschulden wurden nicht aufgenommen ...」。★選手の名前（移籍した選手）は記事にあるが台本に出さない。
#       ★減少額はアドホック開示が 65,5、記事が 65,6。年次報告の千ユーロ単位（526,019−460,467＝65,552）で「約6560万」に統一。
#   ○ 年次報告 2025/2026（report.bvb.de、results of operations）：revenue EUR 460,467 thousand（526,019）、net transfer income 59,289（37,842）、EBT −20,339（9,537）、net loss 21,718（profit 6,497）。
#   ○ 半期報告 H1 2025/2026（aktie.bvb.de の PDF）：Jahresergebnis 18.663 TEUR（7.749）、Umsatzerlöse 246.439。
#   ○ クラブの会社資料（Fact Sheet、EQS の IR 配信、As of 23.10.2026）https://ir-api.eqs.com/media/factsheet/db2eb0af-cd25-4bd0-a65d-d14b6b30ebeb/assets/factsheet_de.pdf
#       「Im Oktober 2000 vollzog Borussia Dortmund als erster Fußballclub in Deutschland den Gang an die Börse」「Prime Standard」
#       「Market Cap 335,60 Mio EUR」「No. of shares 110.396.220」、株主 Bernd Geske 8.65%・Evonik 8.2%・SIGNAL IDUNA 5.98%・BV. Borussia 09 e.V. Dortmund 5.9%・PUMA 5.32%
#       「(Geschäftsführungs-GmbH) ihr Alleingesellschafter ist der BV. Borussia 09 e.V. Dortmund」、財務カレンダー「Nov 12, 2026 Quartalsmitteilung Q1 2026/2027」「Nov 23, 2026 Hauptversammlung」
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com、2026-10-25 に WebFetch）：12位ドルトムント、11位インテル、13位アトレティコ（順位をページで確認）。
#       収入の額はページ内の図（e.infogram.com）の値で、10/19 インテル回・10/22 アトレティコ回の取材で読んだもの：ドルトムント €531.3m、インテル €537.5m、アトレティコ €454.5m。
#       デロイトの収入は「選手の移籍金を含まない」（ページ本文の注記。10/19・10/22 の取材メモに控え）。
#   × 確かめられなかったもの：デロイトのドルトムントの前の年からの増減（図の前年値 531.7 と Goal の「+3%」が食い違う → 増減は言わない）、
#     決算の本書（年次報告書）の数字（速報の数字だけ使う）、純債務、配当の前の年の額、チャンピオンズリーグのプレーオフの相手と日付（開示に無い。台本では言わない）、
#     クラブW杯の収入がどちらの年度にいくら入ったか（開示は「決算の区切りの関係で今年は少ない」とだけ）、株価の前の年との比べ。
#     デロイト 531.3 とクラブの 526.0（2024-25）の差の中身（集計の線が違う。台本で並べない）。
#
# 自分で計算した数（検算済み）
#   収入の内訳の合計：50.3+157.9+168.5+38.7+45.1＝460.5 ✓／55.2+153.6+227.2+40.0+50.0＝526.0 ✓
#   増減（板では試合日・グッズ・その他を1段 −11.1 にまとめた）：試合日 −4.9、広告 +4.3、放映権 −58.7、グッズ −1.3、その他 −4.9 → 合計 −65.5 ✓。58.7÷65.5＝89.6%→約9割。65.5÷526.0＝12.45%→約12%減
#   損益の累計：9月末 +22.9、12月末 +18.7、3月末 +5.9、6月末 −21.7。四半期ごと：7〜9月 +22.9、10〜12月 18.7−22.9＝−4.2、1〜3月 −12.8（開示）、4〜6月 −21.7−5.9＝−27.6。合計 22.9−4.2−12.8−27.6＝−21.7 ✓
#   半期の黒字から通年の赤字まで：18.7−(−21.7)＝40.4
#   後半（1〜6月）の放映権：通年168.5−半期104.6＝63.9／前の年 227.2−98.2＝129.0 → 差 −65.1。4〜6月だけ：168.5−151.4＝17.1／前の年 227.2−162.7＝64.5
#   選手の売買の益：7〜9月 52.9（通年59.3の 89.2%→約9割）。前の年より 59.3−37.8＝21.5 多い
#   選手の売買の益を除いた税引前：−20.3−59.3＝−79.6／前の年 9.5−37.8＝−28.3
#   人件費の割合：259.9÷460.5＝56.44%→56.4%／268.3÷526.0＝51.01%→51.0%。人件費の減り 8.4 対 収入の減り 65.5 → 65.5÷8.4＝7.8倍
#   デロイト：537.5−531.3＝6.2、531.3−454.5＝76.8
#   時価総額 335.6 ÷ 収入 460.5＝72.9%→約7割。335.6÷110.396220＝3.04ユーロ（1株。台本では使わない）
