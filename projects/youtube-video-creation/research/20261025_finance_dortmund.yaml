  takeaway: デロイトの集計で2024-25の収入は5億3130万ユーロで世界12位。クラブが8月21日に出した2025-26の決算の速報は、収入4億6050万ユーロ（前の年5億2600万から約12%減）、通年の損益は2170万ユーロの赤字（前の年は650万ユーロの黒字）で、配当は提案しない。12月末の半期では1870万ユーロの黒字だった。収入の減り約6560万ユーロのうち5870万ユーロ（約9割）がテレビの放映権で、チャンピオンズリーグを決勝トーナメントへのプレーオフで去ったことが主な理由。選手の売買の益5930万ユーロ（約9割が7〜9月）を除くと、税引前は約7960万ユーロの赤字になる（自分で引いた数）。人件費は840万ユーロ減ったが、収入に対する割合は51.0%から56.4%に上がった
  short_title: ドルトムント、半年の黒字が通年で赤字に
