  heading: 収入は約6560万ユーロ減った。いちばん減ったのは、どこか
  tier: 確定
  official: true
  telop: 放映権は2億2720万から1億6850万ユーロへ。減った収入の約9割
  narrator: 解説
  card: &rev_wf
    type: waterfall
    title: 収入の増減（百万ユーロ）
    start: [2024-25, 526.0]
    steps:
    - [放映権, -58.7]
    - [スポンサーと広告, 4.3]
    - [試合日・グッズ・その他, -11.1]
    total: [2025-26, 460.5]
    unit: 百万ユーロ
    highlight: 放映権
  say:
  - text: ドルトムントの収入は、5億2600万ユーロから、4億6050万ユーロへ。
    image: assets/images/20261025_finance_dortmund/02_w.jpg
    card: none
  - text: いちばん減ったのは、テレビの放映権。2億2720万から、1億6850万ユーロへ。
    emph: true
    card: *rev_wf
  - text: 減ったのは5870万ユーロ。収入が減った分の、約9割です。
    card: *rev_wf
  - text: スポンサーと広告は、逆に430万ユーロ増えました。
    card:
      <<: *rev_wf
      highlight: スポンサーと広告
  - text: 放映権が減った理由を、クラブはこう書いています。
    image: assets/images/20261025_finance_dortmund/06_w.jpg
    card: &adhoc_doc
      type: document
      label: ドルトムントの決算の速報（2026年8月21日、訳）
      paragraphs:
      - 収入の減少は、主にテレビの放映権による。今年度はチャンピオンズリーグのベスト16に進めなかった。前の年度は準々決勝まで進んでいた。
      - 2025年のクラブワールドカップの収入も、決算の区切りの関係で、今年度は少なかった。スポンサーと広告の収入は、再び増えた。
      highlight: [ベスト16, 準々決勝]
  - text: 2025-26は、ベスト16の手前のプレーオフで、アタランタに敗れています。
    card: *adhoc_doc
  - text: 放映権の差が大きく出たのは、年が明けてからの半年です。
    image: assets/images/20261025_finance_dortmund/04_w.jpg
    card: none
  - text: 1月から6月の放映権は、6390万ユーロ。
    emph: true
    card: none
  - text: 前の年の同じ半年は、1億2900万ユーロでした。
    card: none
  sources:
  - https://www.bvb.de/de/de/aktuelles/news/news.html/2026/8/21/Bilanzpressekonferenz-2026-BVB-kerngesund-kostenoptimiert-und-wachstumsstark.html
  - https://report.bvb.de/annual-report/2025-2026/group-management-report/position-of-the-group/results-of-operations.html
  - https://aktie.bvb.de/media/document/c3f8c843-ca60-46ed-9f0f-3885f62d6aee/assets/DE0005493092-Q2-2025-EQ-D-00.pdf
  - https://www.deraktionaer.de/nachricht/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-zum-geschaeftsjahr-20252026-deutsch-546541.html
  - https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-fuer-das-erste-halbjahr-h1-des-geschaeftsjahres-20252026-deutsch-501210.html
  - https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-veroeffentlicht-vorlaeufige-zahlen-fuer-das-dritte-quartal-q3-20252026-deutsch-521877.html
- id: transfer
  heading: 前半の黒字を支えたのは、何だったのか
  tier: 確定
  official: true
  telop: 選手の売買の益は5930万ユーロ。そのうち5290万ユーロが7〜9月
  narrator: 解説
  card: &tr_stats
    type: stats
    title: ドルトムントの選手の売買の益（百万ユーロ）
    items:
    - ['52.9', 百万ユーロ, 7〜9月]
    - ['59.3', 百万ユーロ, 通年]
    - ['37.8', 百万ユーロ, 前の年の通年]
    focus: 0
  say:
  - text: では、前半の黒字は、どこから来たのか。
    image: assets/images/20261025_finance_dortmund/05_w.jpg
    card: none
  - text: ドルトムントが選手を売って得た益です。通年で5930万ユーロ。
    emph: true
    card:
      <<: *tr_stats
      focus: 1
  - text: 前の年より、2150万ユーロ多い数字です。
    card:
      <<: *tr_stats
      focus: 1
  - text: そのうち5290万ユーロが、夏の移籍の時期、7月から9月に入りました。
    card:
      <<: *tr_stats
      focus: 0
  - text: 通年の約9割です。
    card:
      <<: *tr_stats
      focus: 0
  - text: 夏の売却で、前半は黒字になりました。
    image: assets/images/20261025_finance_dortmund/06_w.jpg
    card: none
  - text: 後半には、それに代わる大きな収入がありませんでした。
    card: none
  - text: 選手の売買の益を引くと、税金を引く前の損益は約7960万ユーロの赤字。
    emph: true
    card: none
  - text: こちらで引き算をした数です。
    image: assets/images/20261025_finance_dortmund/04_w.jpg
    card: none
  - text: 前の年に同じ引き算をすると、約2830万ユーロの赤字でした。
    card: none
  sources:
  - https://www.bvb.de/de/de/aktuelles/news/news.html/2026/8/21/Bilanzpressekonferenz-2026-BVB-kerngesund-kostenoptimiert-und-wachstumsstark.html
  - https://report.bvb.de/annual-report/2025-2026/group-management-report/position-of-the-group/results-of-operations.html
  - https://www.deraktionaer.de/nachricht/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-zum-geschaeftsjahr-20252026-deutsch-546541.html
  - https://www.boerse-online.de/dpa-afx/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-fuer-das-erste-quartal-q1-20252026-deutsch-482216.html
- id: view
  viewpoint: true
  heading: 見立て・赤字を決めたのは、費用の増えより、後半の放映権の穴
  tier: 背景
  telop: 収入は約6560万ユーロ減り、人件費は840万ユーロ減った
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（決算の速報、2024-25から2025-26）
    columns: [比べ, 答え]
    rows:
    - [収入の減り, 約6560万ユーロ（約12%）]
    - [人件費の減り, 840万ユーロ]
    - [人件費の収入に対する割合, 51.0%から56.4%]
    - [1〜6月の放映権, 1億2900万から6390万]
    highlight_row: 0
  say:
  - text: ここからは見立てです。ドルトムントの速報を、こちらで数え直しました。
    image: assets/images/20261025_finance_dortmund/01_w.jpg
    card: none
  - text: 収入は、前の年より、約12%減りました。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card:
      <<: *view_table
      highlight_row: 0
  - text: 人件費は、2億6830万から、2億5990万ユーロへ。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 減ったのは、840万ユーロです。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 収入が減った幅は、人件費が減った幅の、約7.8倍です。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1
    card:
      <<: *view_table
      highlight_row: 1
  - text: そのため、人件費の収入に対する割合は、51.0%から、56.4%に上がりました。
    image: assets/images/20261025_finance_dortmund/02_w.jpg
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 前半の黒字が消えたのは、後半の放映権が大きく減ったからです。
    emph: true
    card:
      <<: *view_table
      highlight_row: 3
  - text: 1月からの半年の放映権は、前の年の半分ほどでした。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 夏に選手を売った益は、前の年より大きかった。
    image: assets/images/20261025_finance_dortmund/06_w.jpg
    card: none
  - text: それでも、後半の穴は埋まりませんでした。
    card: none
  - text: 決算の会見で、財務を担うトーマス・トレス取締役は、こう話しました。
    image: assets/images/20261025_finance_dortmund/03_w.jpg
    card: &tress_doc
      type: document
      label: トレス取締役（決算の会見、2026年8月21日、クラブ公式の記事から訳）
      paragraphs:
      - 2000万ユーロを超える赤字は、私たちにとって満足できるものではない。
      - 同時に、自己資本はいまも約3億ユーロあり、自己資本比率は50%を超えている。新たな借り入れはしていない。
      highlight: [満足できるものではない, 新たな借り入れはしていない]
  - text: 赤字は認めたうえで、借り入れには頼っていない、という説明です。
    card: *tress_doc
  - text: クラブは、2026-27の損益を、0から1000万ユーロの黒字と見込んでいます。
    card: none
  - text: 移籍と成績で変わる、という前提つきです。
    card: none
  - text: 次の数字は、11月12日。7月から9月の数字が、また出ます。
    image: assets/images/20261025_finance_dortmund/04_w.jpg
    card: none
  sources:
  - https://www.bvb.de/de/de/aktuelles/news/news.html/2026/8/21/Bilanzpressekonferenz-2026-BVB-kerngesund-kostenoptimiert-und-wachstumsstark.html
  - https://report.bvb.de/annual-report/2025-2026/group-management-report/position-of-the-group/results-of-operations.html
  - https://www.deraktionaer.de/nachricht/eqs-adhoc-borussia-dortmund-meldet-vorlaeufige-zahlen-zum-geschaeftsjahr-20252026-deutsch-546541.html
  - https://ir-api.eqs.com/media/factsheet/db2eb0af-cd25-4bd0-a65d-d14b6b30ebeb/assets/factsheet_de.pdf
