  head: 塩貝健人、代表落選のときに「4連休だけど休んでる暇ない」と電話。代理人が明かす
  why: "Qoly（20日）がテレビ東京『FOOT BRAIN』を引用：代理人の龍後昌弥氏が、昨年11月に日本代表初招集を逃したとき塩貝が短期合宿を志願した話を明かした。塩貝はヴォルフスブルク（ブンデス）所属。**代理人の言葉で、本人の言葉ではない**。出来事は去年の話で、きょうの出来事ではない。確度：報道（番組での発言）。写真：コモンズに塩貝健人は**ありません（顔が取れません）**。代わりの案：JFA公式の代表写真、ヴォルフスブルク公式。取れなければ止める。弱い：新しい出来事ではない、写真が無い。"
