  head: ローマ、スロバキアに4-0でCL初勝利。マレンのPK含む4点、ガスペリーニ「毎回、誰かが怪我をする」
  why: "20日のCL第3節、ローマ4-0スロバキア。エルモソ、モリーナ、ピジッリ、マレン（PK）の得点（フットボール・イタリア）。前節のレアル戦（3-1から4-3の逆転負け）の悔しさのあとの初勝利。ディバラとコネは前節で負傷、ガスペリーニ監督は試合後もペッレグリーニの負傷を心配（ガゼッタ）。試合後、アウェイ席でウルトラス同士の衝突があり、警察官が負傷（ガゼッタ。**事件なので題材にはしない**）。確度：確定。写真：コモンズにガスペリーニ、スタディオ・オリンピコ。選手の本人写真は取り込み時に確認。試験：B。弱い：ほかの試合より話題が小さい。"
