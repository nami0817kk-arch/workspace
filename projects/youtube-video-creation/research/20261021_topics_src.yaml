  slot: 日本人
  head: 伊藤洋輝、CLアーセナル戦（22日4時）をバイエルンで前に。ボエに先を越され序列低下と独紙、予想スタメンはベンチ
  why: "ゴール（20日）が独『ビルト』を引用：17日のライプツィヒ戦でキム・ミンジェの負傷交代にボエが入り、**伊藤洋輝より先に投入された**。今季は**CLのみ出場でリーグ戦の出場なし**。フットボールチャンネル（21日）の予想スタメンも伊藤はベンチ。発言：エーベルSD「あれは素晴らしかった」（ボエについて）。**予想は予想**で、起用は試合前に決まる。確度：報道。写真：コモンズに伊藤洋輝6枚（シュツットガルト時代）。バイエルンの試合写真は取り込み時に確認。試験：煽り（「序列」の札。ただし事実は変えない）。弱い：今夜の試合の前の話で、結果は22日朝にならないと出ない。"
