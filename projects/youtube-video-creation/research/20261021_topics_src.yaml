  head: 中村敬斗、一発退場を謝罪。リヨン同僚「謝ってくれた彼のためにも絶対勝つと決意した」
  why: "Qoly（20日）とサッカーダイジェスト（21日）の見出し：19日に出場9分で退場した中村が謝罪し、同僚のDFが「謝ってくれた彼のためにも絶対勝つと決意した」と明かした。**本文は有料でサッカーダイジェストは読めず、Qolyも未読**。10/19に退場の題材で出済み。ニッカンは「退場がリヨンの一体感を高めた」。確度：**未確認**（本文を読めていない。取材時に原文を読んで確かめる）。写真：コモンズに中村敬斗はほぼ無し（1枚）。**顔が取れません**。LFP（ligue1.com）の©LFP Mediaの写真を取り込めるかが鍵（10/19に取れた経緯）。試験：Y。弱い：本文未読、写真が不安。"
