  head: 久保建英、302日ぶりゴールのあとに「新相棒」。右SBフォルトとラ・マシア育ち同士（試合後の本人の言葉つき）
  why: "Qoly（20日）が『ムンド・デポルティーボ』を引用：マラガ戦（5-2）で右SBフォルトと初めて並び、**2人ともバルサの下部組織出身**。**久保本人の試合後の言葉**「サイドバックが追い越してくれると2対2になる。フォルトが上がるのを見てカットインできると判断した」。10/19（初ゴール）と10/20（現地紙の評価）で2本出したばかりで、**3本目の久保**。新しいのはフォルトとの組み合わせの話。確度：報道（現地紙の見立て）＋本人の発言。写真：コモンズに久保5枚、ソシエダ公式。試験：Y（本人の一言）。弱い：直近2日で同じ人。"
