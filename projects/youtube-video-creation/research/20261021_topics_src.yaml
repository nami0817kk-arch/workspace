  slot: 海外
  head: PSGがバルサを4-2で破る。公式戦11連勝が止まる、ドゥエとヴィティーニャの中距離砲
  why: "20日のCL第3節、PSG4-2バルサ。バルサはリーガとCLを合わせて公式戦11連勝・48得点で来ていた（サッカーキング）。PSGは開幕3連勝、計14得点。ドゥエは右足、ヴィティーニャは半ボレーのミドル（フットボールチャンネル）。リュカ・エルナンデスがヤマルを抑えた（サッカーキングの写真説明）。確度：確定（結果）。写真：コモンズにヴィティーニャ18枚・ドゥエ20枚・ヤマル40枚。10/18のバルサ対ベティスの題材とは別の試合。試験：B。"
  src: サッカーキング／ゲキサカ／フットボールチャンネル
  url: https://www.soccer-king.jp/news/world/cl/20261021/2219045.html
  fmt: news
  new: true
- num: 12
  slot: 海外
  head: PSG、デンベレ・マルキーニョス・クヴァラツヘリアの3人が負傷。ルイス・エンリケ「最悪の知らせ」
  why: "フット・メルカート（21日）。デンベレは前半18分に左ハムストリングの損傷とみられ、マルキーニョス（筋肉痛）とクヴァラツヘリア（右膝をひねり担架に近い形で退場）が60分前に続いた。ルイス・エンリケ監督は「私は医者ではない。明日の検査を待つ。3人の重要な選手の負傷は最悪の知らせだ」。**重さは検査待ち**（確定していない）。バルサ側もオルモが25分に負傷交代。確度：確定（負傷交代）、重症度は未確認。写真：コモンズにマルキーニョス41枚・クヴァラツヘリア87枚・ルイス・エンリケ42枚、デンベレは1枚。試験：Y（監督の一言）。"
  src: フット・メルカート／サッカーキング
  url: https://www.footmercato.net/a1013879256200464513-ligue-des-champions-luis-enrique-ces-trois-blesses-cest-la-pire-nouvelle
  fmt: quote
  new: true
- num: 13
  slot: 海外
  head: フォーデンがハットトリック。シティ5-0AEK、ハーランドらを温存して
  why: "20日のCL第3節、シティ5-0AEKアテネ。フォーデンは34分・65分・76分の3得点（サッカーキング）。エリオット・アンダーソンが加入後初ゴール、ラヤン・シェルキもゴール。ハーランドらは温存。ESPNの見出しは「フォーデン：ハットトリックでも自分の最高の状態には**まだ長い道のり**」（**本文は403で未読、見出しのみ**）。確度：確定（結果）。写真：コモンズにフォーデン6枚。試験：B、Y（本文が読めれば本人の言葉）。シティの処分の話（23番）とは別。"
  src: サッカーキング／ゲキサカ／ESPN（見出しのみ）
  url: https://www.soccer-king.jp/news/world/cl/20261021/2219088.html
