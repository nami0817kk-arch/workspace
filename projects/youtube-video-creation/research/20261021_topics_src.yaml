  slot: 海外
  head: 18歳ングモア、リバプール史上CL最年少アシスト。2アシストで4-3逆転勝ち、本人「ベストプレーの一つ」
  why: "20日のCL第3節、リバプール4-3ビジャレアル（2点を先行されて逆転）。18歳52日のングモアは、**CLで複数アシストを記録した史上3番目の最年少**（OPTA。エメリ17歳231日、ウォルコット17歳250日に次ぐ）で、リバプールの選手として欧州大会のアシスト最年少記録（オーウェンの18歳324日を更新）。**本人の言葉**「これまでで最高のプレーの一つ」「迷わず仕掛ける」（サッカーキング、クラブ公式経由）。マック・アリスター2発、ヴィルツが69分の勝ち越し弾。確度：確定。写真：コモンズにングモア6枚。試験：Y（本人の一言）、B。"
  src: サッカーキング（クラブ公式の引用）／BBC
  url: https://www.soccer-king.jp/news/world/eng/20261021/2219132.html
  fmt: quote
  new: true
- num: 15
  slot: 海外
  head: アルバレス、アトレティコで174日ぶりのゴール。ただしシュトゥットガルトと1-1
  why: "20日のCL第3節、シュトゥットガルト1-1アトレティコ。アルバレスは47分、ルックマンの折り返しを左足で押し込み、**今季公式戦の初ゴール**（サッカーキング。ASの見出しは「174日後」）。シュトゥットガルトは36分にレヴェリングが先制。ア・ボーラの見出しでは相手側（シュトゥットガルト）に退場者が出た（詳細は本文未読）。確度：確定（得点）、「174日」はASの見出しのみ。ESPNの「必ず来ると思っていた」は見出しのみ。写真：コモンズにアルバレス22枚。試験：X（冒頭の「174日ぶり」の一言）、B。"
  src: サッカーキング／AS（見出し）／ESPN（見出し）
  url: https://www.soccer-king.jp/news/world/cl/20261021/2219124.html
