  head: 前田大然、イプスウィッチ監督が使い方を説明「大然はよりユニークにプレーする」。シャドーでの初ゴールのあと
  why: "Qoly（20日）が『イプスウィッチ・スター』を引用：オニール監督は「正真正銘のウィンガーが大好き。大然はよりユニークにプレーする、守備的な役割を担うこともある。その役割を完璧にこなしつつ、脅威にもなる」。マンC戦の初ゴールは3-4-2-1のシャドー。次はフォレスト、ハル、ボーンマス。**監督の言葉**。10/18（初ゴール）と10/19（現地紙の評価）で出済み、**3本目の前田**。確度：確定（発言）。写真：コモンズに前田大然2枚（クロップ済み）のみ。**少ない**ので、クラブ公式・試合の記事主写真が必要。3枚そろわなければ止める。試験：Y。弱い：同じ人、写真が少ない。"
