  head: 伊東純也、田中碧のブラジル戦のミスは「そんなに俺はミスって思ってなかった」。久保裕也氏のYouTubeで
  why: "フットボールトライブ（21日）。久保裕也氏のYouTube（20日公開）で、W杯の決勝トーナメント1回戦ブラジル戦の後半アディショナルタイムのボールロストについて、**伊東本人**が「そんなに俺はミスって思ってなかった」。スウェーデン戦では「碧は特にえぐかった。全部回収していた」とも。**本人の言葉あり**。注意：**伊東はベルギー1部ジェンク所属**（欧州7リーグの外）。話題は田中碧（リーズ）で、田中は10/17〜20の4日連続で出している。確度：確定（動画での発言を媒体が書き起こし。動画本体は未確認）。写真：コモンズに伊東純也29件（ジェンク・ランス時代）、田中碧9枚。試験：Y。弱い：リーグの外、田中が連日。"
  src: フットボールトライブ（久保裕也氏のYouTubeの引用）
