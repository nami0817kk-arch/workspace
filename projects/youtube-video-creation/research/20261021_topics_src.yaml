  head: 三笘薫、復帰は「あと数週間」。ヒュルツラー監督が11月の代表ウィーク前を示す（持ち越し）
  why: "フットボールトライブ（19日）。ブライトン公式（18日）でヒュルツラー監督：「ミトマは代表ウィークまでに復帰してくれることを願っている。あと数週間で復帰する見込みだ。もう少し辛抱が必要」。11/14のブラジル戦（シンガポール）に間に合うかが焦点。**10/20の一覧に出した持ち越し**で、ショートは作っていません。新しい事実はなく、**2日前の発言**。確度：確定（クラブ公式の発言）。写真：コモンズに三笘17枚、ブライトン公式。試験：Y（監督の一言）またはB。弱い：新しい出来事ではない。"
