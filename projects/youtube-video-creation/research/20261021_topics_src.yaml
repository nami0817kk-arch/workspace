  slot: 海外
  head: ナポリ、ボド・グリムトに4-3でCL初勝利。アレグリ「守備が悪い」、マンナSD「解任論は出ていない」
  why: "20日のCL第3節、ナポリ4-3ボド・グリムト（マクトミネイが得点に関与）。それまでリーグ戦でヴェネツィアに敗れ、CLでもビジャレアルに敗れていた。アレグリ監督は試合後「守備が悪い。だから攻撃でも苦労する」、「デ・ブライネは守備の前の新しい役割を楽しむ」（ガゼッタ、フットボール・イタリア）。試合前、マンナSDは「アレグリは議論の外。黙って仕事をする」。確度：確定（結果・発言）。写真：コモンズにアレグリ16枚・マクトミネイ7枚、デ・ブライネ（ナポリ）は無し。試験：Y（アレグリの一言）。"
  src: ガゼッタ・デロ・スポルト／フットボール・イタリア
