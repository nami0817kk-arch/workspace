  head: 鈴木彩艶、PL公式の第7節ベストイレブンに。BBCのディーニー氏はGKにフェルブルッヘンを選び、彩艶は選ばず
  why: "Qoly（20日）が『フットボール・インサイダー』を引用：17日のニューカッスル戦（1-0）の無失点で、アラン・シアラー氏が選ぶ公式ベストイレブンに選出。BBCのディーニー氏はブライトンのGKを選び、メディアが「彩艶は失望しているかも」と書いた（**媒体の推測**で、本人の言葉ではない）。**今週のヴィラはCLでヴィーキング、リーグでマンC**。10/18に無失点の題材で出済み。確度：確定（選出）＋推測（失望）。写真：コモンズに鈴木彩艶1枚（日本代表戦）。**少ない**ので、ヴィラ公式・記事主写真。試験：B。弱い：同じ人、写真が少ない。"
