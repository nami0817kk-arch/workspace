title: 10月21日のショート題材
lead: 候補365件から28件（日本人10件・海外18件）。ショート10本ぶんを○で選んでください。
note: "今日は水曜（21日）。昨夜（20日）のCL第3節の結果（日本時間21日早朝）が中心です：PSG4-2バルサ、リバプール4-3ビジャレアル、シティ5-0AEK、ナポリ4-3ボド・グリムト、ローマ4-0スロバキア、PSVのポルト戦1-0ほか。今夜はCLのバイエルン対アーセナル、コモ対マンUが日本時間22日にあるので、その前日の発言（ラヤ・ファブレガス）を入れました。
<br><br>日本人は10件ですが、<b>きのう・きょうに起きた新しい出来事は、佐野航大（CL初白星・フル出場）の1件だけ</b>です。CLに出た日本人は佐野だけで、ほかは10/18〜20の出来事に新しい発言（監督・本人・同僚）が出たものです。弱い印を付けた件は、その点を各行に書きました。<b>本人の言葉が取れたのは2件</b>（久保建英の試合後の言葉、伊東純也の対談での言葉）で、監督の言葉が取れたのが4件（佐野＝ボス監督、田中碧＝ファルケ監督、前田大然＝オニール監督、三笘薫＝ヒュルツラー監督）です。
<br><br>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりのため<b>読めませんでした</b>（nitterも空のページ）。移籍は媒体の報道（スカイ・スポーツの新聞各紙まとめ）だけを1件入れ、確度は「未確認」です。ESPN（本文）、AS（一部）、kickerは403で、見出しだけの件はその旨を書きました。
<br><br>除いた候補は下の「落とした候補」に理由を付けています。女子サッカー・Jリーグ・MLS・リーガMXは出していません（ベルギー1部のジェンク所属の伊東純也は、話題が田中碧とW杯なので弱い印を付けて入れました）。
<br><br>見せ方の試験は各行の最後に「試験：」で書きました（B＝写真切り替え、X＝冒頭の一言、Y＝本人の一言、煽り＝煽りの版）。写真の見立てはウィキメディア・コモンズの検索の目安です（本人かどうかは取り込むときに目で確かめます）。"
items:
- num: 1
  slot: 日本人
  head: 佐野航大、ポルトに1-0でPSVのCL今季初白星。3試合連続フル出場、ボス監督が「航大らのおかげ」
  why: "20日のCL第3節、ポルト0-1PSV（57分ティル）。**4-2-3-1のダブルボランチで90分**、決定的な場面には絡まなかったが守備と前線の連係で貢献（サッカーキング）。ボス監督は試合後「マウロ・ジュニオールと航大がプレッシングをかけ始めてから、再び試合をコントロールできた」（Qoly経由）。ポルトのファリオーリ監督は「就任して64試合で、最もプレスに苦労した」。**今日起きた新しい日本人の出来事はこれだけ**。10/18のADO戦（9戦連続フル出場）とは別の話。写真：コモンズに本人の写真は**ありません（顔が取れません）**。代わりの案：PSV公式・JFAの代表写真、ボス監督（コモンズに9枚）、試合の記事主写真。3枚そろわなければ止めて報告。試験：Y（ボス監督の一言）またはB。"
  src: サッカーキング（21日）／ゲキサカ／Qoly（ボス監督の言葉）
  url: https://www.soccer-king.jp/news/world/cl/20261021/2219089.html
  fmt: news
  new: true
