title: 10月11日の題材
lead: 候補470件と昨夜の試合、ロマーノの投稿から15件
note: <b>昨日は代表ウィークではなく、国内リーグの再開節でした。</b>プレミア第6節・ラ・リーガ第8節・セリエA第6節・ブンデス・リーグ・アン第6節が一斉に行われています（私が「代表ウィーク中」と言ったのは誤りでした）。<br><br><b>①〜⑩が本線、⑪〜⑮が予備</b>です。ショートは10本要ります。<br><b>本編も作れるのは①ヴィニシウスと②マクトミネイ</b>（印つき）。①は本人の謝罪・チュアメニ・ベリンガム・モウリーニョの4つの反応がそろっています。<br><br><b>日本人は4件</b>（③前田・④田中・⑤上田・⑭旗手）。検索で来る上位4語が日本人名なので外せません。<br><b>⑭旗手だけイングランド2部</b>です。1部に限るなら外してください。<br><br><b>大きいのに外したもの</b>：ロナウドの出場停止（10/8
  と 10/10 で2度扱い済み）、マンCの判決の続報（4度目になる）、マンUの最悪の開幕（10/10 に3本）、ノイアーのミスからの8秒ゴール（今日のシリーズでバイエルンを出すため）、鈴木彩艶の5試合連続先発（今日のシリーズでヴィラを出すため）。
items:
- num: 1
  slot: ラリーガ
  head: ヴィニシウス、ゴール取り消しの直後に一発退場
  why: 52分投入→得点→VARで相手の髪を引っ張った行為が確認され一発退場。**本人がInstagramで謝罪**、モウリーニョは試合後の会見を欠席。チュアメニとベリンガムも口を開いた。**10/25のクラシコが危うい**。発言が4つそろう、今日いちばん厚い題材
  src: ESPN・marca（主審の報告書とVARの音声まで）。本人の謝罪は Instagram
  url: https://www.espn.com/soccer/story/_/id/50150534/vinicius-junior-red-card-real-madrid-villarreal
  fmt: news
  main: true
