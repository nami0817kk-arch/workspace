  say:
  - text: 16歳でいたのは、父の故郷ノルウェーのブリーネ。市場価値は、わずか20万ユーロ。
    image: assets/images/20261001_haaland_salzburg/01.jpg
  - text: モルデで2年。18歳で500万ユーロ。
    image: assets/stats/player_20261001_737066_value.png
    no_telop: true
  - text: ザルツブルクの1年半で、ハーランドは一気に4500万ユーロ。転機はここです。
    image: assets/images/20261001_haaland_salzburg/01.jpg
  - 2019年9月17日、ヨーロッパのクラブ王者を決める大会、
  - チャンピオンズリーグのデビュー戦。
  - 相手はヘンク。その前半だけで、ハットトリックを決めてしまいました。
  - デビュー戦の前半ハットトリックは、いまも史上ただ1人です。
  - その冬に選んだのは、マンチェスター・ユナイテッドではなく、ドルトムントでした。
  - ドルトムントで1.5億ユーロ。そしてシティで、いまの額まで上り詰めます。
  sources:
  - https://www.transfermarkt.com/erling-haaland/profil/spieler/418560
  - https://www.uefa.com/uefachampionsleague/news/0268-11f9321e7599-fde3dd4a7bd0-1000--erling-haaland-in-the-champions-league-records-stats-who-h/
