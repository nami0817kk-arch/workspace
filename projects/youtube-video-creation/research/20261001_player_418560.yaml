- id: story
  heading: マル秘話
  tier: 報道
  telop: 心臓と肝臓を食べ、口にテープを貼って寝る
  narrator: 解説
  say:
  - text: 数字の外側に、この選手らしい話が2つあります。
    image: assets/images/20261001_haaland_city2024_w/01.jpg
  - 1つ目は食事。2022年、ドキュメンタリー番組で自分の食生活をこう話しました。
  - voice: ハーランド
    text: 人々は肉（を食べるの）は悪いと言うけれど、
  - voice: ハーランド
    text: それはどんな肉なのって聞きたいね。
    cont: true
  - voice: ハーランド
    text: マクドナルドの肉なのか、
    cont: true
  - voice: ハーランド
    text: 地元の牧草を食べて育った牛の肉なのか。
    cont: true
  - voice: ハーランド
    text: 自分は（牛の）心臓と肝臓を食べる
    cont: true
    pause: 0.6
  - 飲む水はろ過したものだけ。夜はブルーライトを切るメガネをかける。
  - そして鼻で呼吸するために、口にテープを貼って眠ります。
  - 2つ目はゴールのあとの座禅のポーズ。2020年、19歳のときに理由を聞かれて、こう答えています。
  - voice: ハーランド
    text: 僕は本当に瞑想が好きなんだ。
  - voice: ハーランド
    text: 瞑想は僕に穏やかさと静けさを運んでくれる。
    cont: true
  - voice: ハーランド
    text: これはとても大事なこと。
    cont: true
  - voice: ハーランド
    text: だから時々ゴールを決めたあと、あのポーズをするんだ
    cont: true
    pause: 0.6
  - その年のチャンピオンズリーグで当たったパリ・サンジェルマンの選手たちは、
  - text: 勝ったあとに、このポーズを真似して見せました。
    pause: 0.5
  sources:
  - https://news.livedoor.com/article/detail/23002168/
  - https://www.thestandard.com.hk/football/article/335314/Haalands-extreme-diet-beef-organs-filtered-water-and-mouth-taping-for-sleep
  - https://www.soccerdigestweb.com/news/detail/id=70590
  - https://web.gekisaka.jp/news/world/detail/?301398-301398-fl=
- id: view
  heading: 見立て
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月12日、リバプール戦
  say:
  - text: 話を数字に戻して、最後に見立てです。
    image: assets/images/20261001_haaland_norway2026_w/01.jpg
  - 比べる相手は、同じセンターフォワードで市場価値も並ぶエムバペ。今季9試合で9点、779分。
  - ほぼ同じ時間で、ハーランドが1点多い。10年で市場価値は1,000倍、今季も数字は落ちていません。
  - この差が開くのか縮むのか。いまは各国の代表戦のためリーグが中断中で、
  - クラブの次の試合は10月12日、アウェーのリバプール戦です。
  - 首位争いの相手に、77分に1点のペースが続くかを見ます。
  sources:
  - https://www.transfermarkt.com/erling-haaland/profil/spieler/418560
  - https://www.transfermarkt.com/kylian-mbappe/profil/spieler/342229
