  say:
  - text: シティのハーランド、26歳。タッチは同じフォワードで最少クラス、でも得点は止まりません。
    short_only: true
  - text: 今季はここまで9試合で10得点、出場時間は773分。77分に1点のペースです。
    image: assets/images/20261001_haaland_norway2026/01.jpg
  - プレミアリーグは5試合で5点。今季のプレミアで5点以上は、ハーランドただ1人。
  - 直近5試合は全部90分出て、5試合で7点。
  - 10点満点の評点は、いちばん低い試合でも7.5です。
  - 少ないタッチで点になるのは、ゴール前の一瞬の動き出しに絞っているから。
  sources:
