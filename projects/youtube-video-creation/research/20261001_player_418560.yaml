      value: 0
    source: FotMob
  say:
  - text: ハーランドの武器を、同じフォワードと並べた6つの軸で、丸裸にします。
    image: assets/stats/player_20261001_737066_radar.png
    no_telop: true
  - text: 得点とシュート数は、文句なしの最上位。ボールタッチとチャンス創出は、いちばん少ない側です。
    image: assets/images/20261001_haaland_train2024_w/01.jpg
  - ボールを持って崩すより、ゴール前で仕留めることに力を注いできた選手です。
  - 今季のリーグでは、アシストはまだ0。
  - ただ昨季までは毎シーズン7から10のアシスト。作れない選手ではありません。
  - text: では、触らずに点が取れるのはなぜか。カギは、ボールが来る前の動きにあります。
    image: assets/stats/player_20261001_737066_heat.png
    no_telop: true
  - text: ニアに走ると見せて一度中央へ、また戻る。自陣側へ下がって、オフサイドをかいくぐる。
    image: assets/images/20261001_haaland_back9_w/01.jpg
  - 味方が作り、本人は最後の一歩を誰より速く動く。だから触る回数が少なくても、点になるんです。
  - text: 今季のシュート20本を並べると、なんと19本がゴール前の四角い枠、ペナルティエリアの中。
    image: assets/stats/player_20261001_737066_shots.png
    no_telop: true
  - text: プレミアリーグ通算100点の内訳は、左足71・右足11・頭17。エリアの中だけで94点です。
    image: assets/images/20260928d_haaland_c/01.jpg
  - 195センチの体で、今季の最高速度は時速34.6キロ。速くて、大きくて、いつもゴール前にいる。
  sources:
  - https://www.fotmob.com/players/737066/erling-haaland
  - https://www.mancity.com/news/mens/erling-haaland-premier-league-100-club-statistics-63900357
  - https://football-tribe.com/japan/2025/01/25/323530/
