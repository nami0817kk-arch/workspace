    source: FotMob
  say:
  - text: ハーランドのプレースタイルを、同じフォワードと比べた数字で見ます。
    image: assets/stats/player_20261001_737066_radar.png
    no_telop: true
  - 6つの軸のうち、得点とシュート数は最上位。ボールタッチとチャンス創出は最下位です。
  - つまり、ボールを持って何かをする選手ではありません。ゴール前に現れて、蹴る選手です。
  - 弱点を挙げるなら、アシストが0。作るのではなく決める選手だと、数字が言っています。
  - text: では、触らずに点が取れる理由はどこにあるか。ボールが来る前の動きです。
    image: assets/stats/player_20261001_737066_heat.png
    no_telop: true
  - ニアに走ると見せて一度中央へ、また戻る。自陣側へ下がってオフサイドをかいくぐる。
  - 味方が作り、本人は最後の一歩だけを速く動く。だから触る回数が少なくても点になります。
  - text: 今季のシュート20本を並べると、19本がゴール前の四角い枠、ペナルティエリアの中。
    image: assets/stats/player_20261001_737066_shots.png
    no_telop: true
  - プレミアリーグ通算100点の内訳は、左足71・右足11・頭17。ペナルティエリアの中が94点です。
  - 195センチの体で、今季の最高速度は時速34.6キロ。速くて、大きくて、ゴール前にいる選手です。
  sources:
  - https://www.fotmob.com/players/737066/erling-haaland
  - https://www.mancity.com/news/mens/erling-haaland-premier-league-100-club-statistics-63900357
  - https://football-tribe.com/japan/2025/01/25/323530/
