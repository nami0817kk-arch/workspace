  say:
  - text: シティのハーランド、26歳。タッチは同じフォワードで最少クラス、それでも得点は止まりません。
    short_only: true
  - text: 今季はここまで9試合で10得点。出場773分で、77分に1点という驚きのペースです。
    image: assets/images/20261001_haaland_norway2026/01.jpg
  - プレミアリーグは5試合で5点。今季のプレミアで5点以上は、ハーランドただ1人。
  - 直近5試合は、すべてフル出場。その5試合で、7点を叩き込みました。
  - 10点満点の評点は、いちばん低い試合でも7.5。とにかく崩れません。
  - ゴール前の一瞬の動き出しを磨いてきたからこそ、少ない機会でも決め切れるんです。
  sources:
  - https://www.transfermarkt.com/erling-haaland/profil/spieler/418560
  - https://www.fotmob.com/players/737066/erling-haaland
