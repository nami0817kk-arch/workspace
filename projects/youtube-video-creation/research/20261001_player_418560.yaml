  say:
  - text: ハーランドの16歳は、父の故郷ノルウェーのブリーネ。市場価値は20万ユーロでした。
    image: assets/images/20261001_haaland_salzburg/01.jpg
  - text: モルデで2年。18歳のとき500万ユーロ。
    image: assets/stats/player_20261001_737066_value.png
    no_telop: true
  - ザルツブルクの1年半で4500万ユーロ。転機はここです。
  - 2019年9月17日、ヨーロッパのクラブ王者を決める大会、
  - チャンピオンズリーグのデビュー戦。
  - ヘンク相手に、前半のうちにハットトリックを決めました。
  - デビュー戦の前半ハットトリックは、いまも史上ただ1人です。
  - その冬、マンチェスター・ユナイテッドではなくドルトムントを選びました。
  - ドルトムントで1.5億ユーロ、そしてシティでいまの額に。
  sources:
