  - 生まれはイングランドのリーズ。父アルフ＝インゲが、当時そこでプレーしていたからです。
  - 身長は1メートル95、利き足は左。契約は2034年まで残っています。
  - 市場価値は2.2億ユーロ。前回の2億ユーロから、この夏さらに上がりました。
