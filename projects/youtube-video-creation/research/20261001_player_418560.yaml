- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 少ないタッチで、点を取り続ける
  narrator: キャスター
  say:
  - text: アーリング・ハーランド。ボールに触る回数は少ないのに、点を取り続けるフォワードです。
    image: assets/images/20261001_haaland_face_w/01.jpg
  - 同じフォワード100人と比べると、ボールに触る回数は最も少ない側。それなのに、得点は最も多い側。
  - 5歳で、立ち幅跳びの「世界記録」と言われる跳躍を残した少年。本人は、生い立ちをこう語ります。
  - voice: ハーランド
    text: 僕は小さい頃から陸上競技に携わってきた
    pause: 0.5
  - 母も祖母も陸上の選手。その体ひとつで、どうやってここまで来たのか。数字と話で迫ります。
  sources:
  - https://www.fotmob.com/players/737066/erling-haaland
  - https://www.football-zone.net/archives/286672
