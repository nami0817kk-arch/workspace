- id: hook
  heading: どんな選手か
  tier: 報道
  telop: ボールに触らないのに、点だけ取る
  narrator: キャスター
  say:
  - text: アーリング・ハーランド。ボールにいちばん触らない、いちばん点を取るフォワードです。
    image: assets/images/20261001_haaland_face_w/01.jpg
  - 同じフォワード100人の中で、ボールに触る回数はいちばん少ない側。得点はいちばん多い側です。
  - 5歳のとき、立ち幅跳びで「世界記録」と言われる跳躍を残した少年。本人は生い立ちをこう言っています。
  - voice: ハーランド
    text: 僕は小さい頃から陸上競技に携わってきた
    pause: 0.5
  - 母も祖母も陸上の選手。その体でどうやってここまで来たのか、数字と話で見ます。
  sources:
  - https://www.fotmob.com/players/737066/erling-haaland
  - https://www.football-zone.net/archives/286672
