    cont: true
    card: none
  - voice: ネット民
    text: やはりゴールに近いポジションでのプレイは魅力的。
    cont: true
    card: none
  - voice: ネット民
    text: これからもシャドーで得点やアシストを積み重ねる
    cont: true
    card: none
  - voice: ネット民
    text: 鎌田選手の姿を是非見たい。
    cont: true
    card: none
  - voice: ネット民
    text: 才能の塊の人。
    card: none
  - voice: ネット民
    text: アタッカーとして優秀だから前で使っても機能するけど、
    cont: true
    card: none
  - voice: ネット民
    text: 彼以上に視野とビジョンがあるレジスタはいないから
    cont: true
    card: none
  - voice: ネット民
    text: その能力を使わないのも勿体ない。
    cont: true
    card: none
  - voice: ネット民
    text: 監督は悩むでしょうね。
    cont: true
    card: none
  - voice: ネット民
    text: シャドーも全然いけるんちゃうの？
    short_voice: true
    card: none
