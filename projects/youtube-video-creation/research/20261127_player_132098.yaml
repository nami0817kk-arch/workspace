# **現役・今季はバイエルン（ブンデスリーガ）**：TM の試合記録で 2026-11-20（ケルン戦 20分）まで。11/20 に左足首のじん帯断裂、クラブは「今後数か月」の離脱と発表。
# **数字の軸**：TM（トップチームだけ。U21・ユース代表は除く）。クラブ通算：トッテナム 435試合280点、バイエルン 163試合156点、貸し出し4クラブ（レイトン・オリエント 18/5・ミルウォール 27/9・レスター 15/2・ノリッジ 5/0）65試合16点。代表 127試合93点（Wikipedia の 127・93 と一致）。合計 790試合545点。
#   トッテナムの季：14/15 51/31・15/16 50/28・16/17 38/35・17/18 48/41・18/19 40/24・19/20 34/24・20/21 49/33・21/22 50/27・22/23 49/32。バイエルンの季（得点/アシスト）：23/24 45/44/12・24/25 51/41/14（クラブW杯5試合を含む）・25/26 51/61/7・26/27 16/10/10（リーグ10/4/7・CL4/4/3・ドイツ杯1/2/0・スーパー杯1/0/0）。代表の今季 6試合8点。
#   市場価値（TM）：2012-11 50万→2018-05 1億5000万（最高、2019-12 まで）→2023-10 1億1000万→2026-05 6000万。150÷60＝2.5。
# **Wikipedia で確かめたこと**：8歳でアーセナルの育成に入り1季で放出（リアム・ブレイディの説明）、11歳でトッテナムへ。2011-08-25 のハーツ戦がトッテナムでの初出場で、自分で得たPKを止められた。2023-08-12 にバイエルン、移籍金1億ユーロ＋追加1000万（ブンデス史上最高）。2025-05-04 に初優勝（前日の試合は累積警告で出場停止）。25/26 はリーグ・ドイツ杯・スーパー杯、公式戦61点（21世紀のクラブ記録）。2026-09-18 にブンデス100点目、98試合（前の記録はディーター・ミュラーの129試合）。2026-10-26 バロンドール（イングランド人は2001年のオーウェン以来、バイエルンは1981年のルンメニゲ以来）。代表：2015年に21歳でデビュー、2018年W杯得点王、2026年W杯3位、2026-11-12 に126試合目で最多出場。11/5 に2029年までの新契約。
# **入れなかったもの**：家族・私生活、年俸、トッテナムの「同じ条件を出せる権利」（11/6 のショートで扱った）、本人の言葉（一次の原文は 10/27 のショートで使ったもの。今回は使わない）。
