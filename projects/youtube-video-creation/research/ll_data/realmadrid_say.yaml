# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1902年**。1920年、国王から「レアル」、つまり王立の称号を受けました。
- 愛称は「ロス・ブランコス」。スペイン語で、**白い人たち**という意味です。
- ホームタウンは首都マドリード。人口およそ**348万人**、スペインでいちばん大きな町。
- 本拠地はベルナベウ。**8万3186人**が入り、20クラブでいちばん大きい。
- 会長はフロレンティーノ・ペレス。2009年に返り咲きました。クラブは会員が持つ形です。
- 1部の優勝は最多の**36回**。国王杯は**20回**、スーペルコパは**13回**。
- 最多出場はラウル・ゴンサレス。1994年から2010年までに、**741試合**です。
- 直近のタイトルは2024年12月のインターコンチネンタルカップ。パチューカに**3対0**の勝ち。
- 昨季のリーグ戦は**2位**。優勝したバルセロナに、勝ち点**8**届きませんでした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

