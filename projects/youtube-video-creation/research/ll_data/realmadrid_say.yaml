# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ジダンは2001年、当時の世界最高額でユヴェントスから。リーグ戦は**155試合37得点**。
  - 2002年のチャンピオンズリーグ決勝、左足のボレーで、レバークーゼンを破る決勝点。
  - 監督としても、チャンピオンズリーグを3連覇。今はフランス代表を率いています。
- - クリスティアーノ・ロナウドは2009年に来ました。リーグ戦**292試合**で、**311得点**。
  - 2015年10月、ラウルを抜いて、公式戦のクラブ歴代最多得点者になりました。
  - 公式戦で**450得点**を残し、2018年にユヴェントスへ移りました。
- - セルヒオ・ラモスは2005年、セビージャから。守備の選手で、リーグ戦**469試合72得点**。
  - 2014年の決勝、アトレティコ戦の**93分**に頭で同点。延長で勝ち、10度目の優勝。
  - 主将も務め、2021年にパリ・サンジェルマンへ移りました。
legend_rows:
- ["ジネディーヌ・ジダン", "2001-2006", "決勝のボレー"]
- ["クリスティアーノ・ロナウド", "2009-2018", "歴代最多450得点"]
- ["セルヒオ・ラモス", "2005-2021", "93分の同点弾"]
