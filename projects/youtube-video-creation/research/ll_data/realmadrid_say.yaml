    say:
      - この強さを見て、白をまねたクラブもあります。
      - 5度目の優勝を決めた1960年の決勝は、フランクフルトに**7対3**。
      - スタンドにいたドン・レヴィーは、翌年リーズの監督になると、青と黄色をやめます。
      - 上下とも白に。いちばん多く勝っているクラブの色だから、という理由でした。
