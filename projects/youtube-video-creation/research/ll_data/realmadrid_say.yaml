        - ["1956年から60年", "5連覇"]
    say:
      - いまのチャンピオンズリーグは、各国の王者を集める大会として始まりました。
      - 作った一人が、**35年**近く会長を務めたサンティアゴ・ベルナベウです。
      - 1955年、フランスの記者の案を受け、パリのホテルで立ち上げを決めました。
      - レアルはその大会で、最初から**5連覇**します。
