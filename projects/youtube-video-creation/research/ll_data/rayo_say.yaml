# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1924年**。プルデンシア・プリエゴという女性の家で生まれました。
- 愛称は「マタヒガンテス」、巨人殺し。1部の1年目に、ホームで強豪を次々と倒しました。
- ホームタウンはマドリードのバジェカス。人口**24万**ほどの、労働者の町です。
- 本拠地はエスタディオ・デ・バジェカス。**1万4708人**が入り、片方のゴール裏は壁です。
- オーナーは**2011年**からラウル・マルティン・プレサ。会長も兼ねています。
- 1部、国王杯、スーペルコパの優勝は**0回**。ヨーロッパの大会でも、まだ優勝がありません。
- 最多出場は、17歳でデビューしたディフェンダーのコタ。**458試合**です。
- 直近のタイトルは、2017年から18年のシーズン。初めて2部で優勝しました。
- 昨季のリーグ戦は**8位**、勝ち点は**50**。クラブの最高順位に並びました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、3つに割る
story_sections:
  - id: history
