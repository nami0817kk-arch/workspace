    say:
      - 創立したころは、上下とも**白**のユニフォームでした。
      - "**1949年**、選手を貸してくれるアトレティコが、ある条件を出します。"
      - レアル・マドリードのような白一色をやめて、赤を入れること。
      - 手本にしたのはアルゼンチンのリーベル・プレート。胸に斜めの赤い帯が入りました。
    sources:
