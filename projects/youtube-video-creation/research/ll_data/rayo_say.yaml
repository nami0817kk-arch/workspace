    narrator: 解説
    card:
      type: table
      title: フェアプレーの枠で欧州へ
      columns: ["", ""]
      rows:
        - ["1999-2000", "9位。一時は首位"]
        - ["欧州の切符", "フェアプレーの枠"]
        - ["2000-01", "ウエファカップ8強"]
    say:
      - 1999年からのシーズン、**4節**のあいだ首位に立ち、最後は**9位**でした。
      - 順位では届かない欧州へ運んだのは、警告の少なさで選ばれるフェアプレーの枠です。
      - 初戦はアンドラのチームに、アウェーで**10対0**。フランスのボルドーも破ります。
      - 止めたのは、その年に準優勝したアラベスでした。
