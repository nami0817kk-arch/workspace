# 「へえ」の逸話。西語版（2014-15 の段）と英語版（Club culture）の両方で裏を取った
episode:
  id: episode
  heading: 85歳の女性の家賃
  tier: 背景
  telop: 家を追われた女性を、監督と選手が支えた
  narrator: 解説
  card:
    type: table
    title: 85歳の女性の家賃
    columns: ["", ""]
    rows:
      - ["2014年11月", "85歳の女性が家を追われる"]
      - ["監督と選手", "新しい家の家賃を払う"]
  say:
    - 2014年11月、バジェカスで**85歳**の女性が、50年以上住んだ家を追われました。
    - その日の練習で、パコ・ヘメス監督が選手に持ちかけたのは、彼女を助けることでした。
    - 監督と選手とクラブは、彼女の新しい家の家賃を払うと約束しました。
  sources:
    - https://es.wikipedia.org/wiki/Rayo_Vallecano_de_Madrid
    - https://en.wikipedia.org/wiki/Rayo_Vallecano

# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ミチェルはマドリード生まれ。ラージョの下部組織から上がった中盤の選手です。
  - 2000年から01年、リーグ戦で自己最多の**10点**。欧州の大会でも**6得点**を挙げました。
  - ラージョでのリーグ戦は、通算**363試合53得点**。今はオランダのアヤックスを率いています。
- - ディエゴ・コスタは**2012年**1月、アトレティコから期限付きでやって来ました。
  - 膝の大けがから戻ったばかり。それでも最初の**3試合**で**4得点**を挙げます。
  - 半年でリーグ戦**16試合10得点**。のちにスペイン代表のストライカーになりました。
- - ファルカオは**2021年**、35歳で加入。亡くなった父と同じ背番号**3**を選びました。
  - 10月、バルセロナ戦で決勝点を決めて**1対0**。相手はこの試合のあと、監督を解任しました。
  - 3シーズンで、リーグ戦**71試合9得点**。デビュー戦でも、いきなり点を取っています。
legend_rows:
- ["ミチェル", "1993-2012", "下部組織育ちの中盤"]
