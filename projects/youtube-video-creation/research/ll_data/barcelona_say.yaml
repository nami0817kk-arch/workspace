# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ。
# メッシは基礎DATAの最多出場で出るので、同じ人を2つの節に出さない
legends:
- - シャビ・エルナンデスはカタルーニャの生まれ。**11歳**で育成組織に入った中盤です。
  - リーグ戦で**505試合58得点**。2009年と2015年の3冠で、中盤の中心にいました。
  - 2021年には監督で戻り、2023年にリーグを制覇。今はオランダ代表の監督です。
- - イニエスタは**12歳**のとき、ラ・マンチャの小さな村からやって来ました。
  - 2009年、チェルシーとの準決勝。終了間際に同点弾、アウェーゴールの差で決勝へ。
  - リーグ戦で**442試合35得点**。2018年に、日本のヴィッセル神戸へ渡りました。
- - ロナウジーニョは**2003年**、パリ・サンジェルマンから**3000万ユーロ**で来ました。
  - 2005年11月、敵地ベルナベウで2得点。レアルのファンが、拍手を送りました。
  - その年は、バロンドールにも選ばれました。リーグ戦で**145試合70得点**。
