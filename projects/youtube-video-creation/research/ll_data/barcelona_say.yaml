# 今季。欧州の初戦（2026–27 FC Barcelona season の原文）
season:
- 欧州の大会の初戦は、ホームでフェイエノールトに**5対1**で勝ちました。
- 顔ぶれも変わりました。このクラブで欧州王者になった選手は、もう一人もいません。
