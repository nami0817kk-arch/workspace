# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1899年**。スイスから来たジョアン・ガンペルが、仲間を集めました。
- 愛称は「ブラウグラナ」。カタルーニャ語で、**青とえんじ**のことです。
- ホームタウンはバルセロナ。地中海に面した、カタルーニャ州の州都。
- 本拠地はカンプ・ノウ。改修中で、いまは**6万2652人**。完成すれば**10万5000人**です。
- 持ち主は**15万人**を超える会員。会長のラポルタは、**2026年3月**に再選されました。
- 1部優勝は**29回**、国王杯は最多の**32回**、スーペルコパも最多の**16回**。
- ほかの杯も合わせた国内タイトルは、どこよりも多い数です。チャンピオンズリーグは**5回**。
- 最多出場はリオネル・メッシの**778試合**。得点も、クラブ最多の**672**。
- 直近のタイトルは昨シーズンのリーグ。クラシコの勝利で決めたのは、初めてでした。
- 昨シーズンは**1位**で、勝ち点**94**。ホームのリーグ戦は、**19戦全勝**でした。
data_focus: [0, 1, 2, 3, 4, 5, 5, 6, 7, 8]

