# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - シャビ・アロンソは、ソシエダのセカンドチームから上がった中盤の選手です。
  - 2001年、最下位のチームを任されたトシャック監督が、**20歳**の彼を主将に指名しました。
  - 2002年から03年は**2位**。そのあとリヴァプールへ移り、今はチェルシーの監督です。
- - グリーズマンはフランス人。国境の向こうの学校に通いながら、ここで育ちました。
  - 2009年、18歳でトップに上がり、2部優勝と昇格に貢献しました。
  - 2013年の最終節で決勝点。チャンピオンズリーグへの切符を取りました。
- - スビメンディはサン・セバスティアン生まれ。11歳で、県のチェスの王者になった中盤です。
  - 2021年4月、延期された国王杯の決勝で、彼のいたソシエダがアスレティックを破ります。
  - 2025年にアーセナルへ。1年目でプレミアリーグを制しました。
legend_rows:
