# いま見る理由。監督の言葉は Marca 2026-09-19 の原文
# 「Queremos ser un equipo más agresivo. Tenemos ambición y no hay duda de que queremos ganar.」
reasons:
- "日本の**久保建英**は、ここで**5シーズン目**を迎えています。"
- "率いるのは、アメリカ出身のマタラッツォ監督。こう話しています。"
- {voice: ペッレグリーノ・マタラッツォ, text: "もっと攻撃的なチームになりたい。野心はあるし、勝ちたいのは疑いようがない"}
