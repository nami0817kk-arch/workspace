# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1909年**。その年、別の名前で国王杯を取った面々が、クラブを作りました。
- 愛称は「チュリ・ウルディン」。バスク語で**白と青**。町の旗の色です。
- ホームタウンはサン・セバスティアン。フランス国境まで**20キロ**の港町です。
- 本拠地はアノエタ。クラブの発表では、**4万人**が入ります。
- 会長は**2008年**からホキン・アペリバイ。クラブは株式会社の形です。
- 1部の優勝は**2回**。国王杯は**4回**、スーペルコパは**1回**。
- 最多出場は、センターバックのアルベルト・ゴリス。このクラブだけで**599試合**です。
- 直近のタイトルは、先ほどの国王杯。アトレティコとのピーケー戦を**4対3**で制しました。
- 昨季のリーグ戦は**10位**。勝ち点は**46**でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

