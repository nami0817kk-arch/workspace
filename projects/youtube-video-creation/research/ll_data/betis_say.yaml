# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1907年**。名前のベティスは、町を流れる川の、ローマ時代の呼び名です。
- 愛称は「エリオポリタノス」。本拠地のある地区の名で、意味は**太陽の町**。
- ホームタウンはセビージャ。アンダルシアの州都で、スペインで**5番目**に大きな町です。
- 本拠地はラ・カルトゥーハ。いつもの競技場を改修するあいだの仮住まいで、**7万人**が入ります。
- 会長は**2016年**からアンヘル・アロ。株主が選ぶ形の株式会社です。
- 1部の優勝は**1回**。国王杯は**3回**。スーペルコパとヨーロッパの大会は、まだ優勝がありません。
- 最多出場は、2度在籍したホアキン。**528試合**に出ました。
- 直近のタイトルは2022年の国王杯。いまの本拠地で、ピーケー戦を**5対4**で制しました。
- 昨季のリーグ戦は**5位**。勝ち点は**60**でした。
# 5位で出られた理由（Template:2025–26 La Liga table の note_res_CLLS。スペインが European Performance Spot を得た）
- この年はスペインの出場枠が1つ増え、チャンピオンズリーグに届きました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8, 8]

# クラブの話。1枚のカードを20秒以上出さないため、3つに割る
story_sections:
  - id: history
    heading: 1935年の頂点
    tier: 背景
    telop: 1935年、ただ一度の1部優勝
    narrator: 解説
    card:
      type: table
      title: 1935年の頂点
      columns: ["", ""]
      rows:
        - ["監督", "アイルランド人のオコンネル"]
        - ["決めた試合", "サンタンデールで5対0"]
        - ["2位との差", "勝ち点1"]
    say:
      - 1部の頂点に立ったのは**1935年**。率いたのはアイルランド人のオコンネル監督です。
      - 決めたのは北の町サンタンデール。**5対0**で勝ち、マドリードを勝ち点1差でかわしました。
      - その日のセビージャは春祭り。知らせは、祭りの小屋の黒板で伝えられました。
    sources:
      - https://en.wikipedia.org/wiki/Real_Betis
      - https://es.wikipedia.org/wiki/Real_Betis_Balomp%C3%A9
  - id: history2
    heading: 同じ町で3部へ
    tier: 背景
    telop: 優勝を決めた町で、12年後に3部へ
    narrator: 解説
    card:
      type: table
      title: 同じ町で3部へ
      columns: ["", ""]
      rows:
        - ["1936年から", "内戦。優勝した選手が散る"]
        - ["1947年", "サンタンデールで1対4。3部へ"]
        - ["1954年", "3部で優勝し、2部へ戻る"]
    say:
      - ところが翌年から内戦。優勝した顔ぶれは散り、残ったのは**2人**だけでした。
      - 1947年には、あの優勝を決めたサンタンデールで**1対4**。3部へ落ちます。
      - 3部には7年。1954年に3部で優勝し、1部・2部・3部のすべてで優勝したクラブに。
      - 負けても応援をやめない、あの合言葉がファンに根づいたのは、この苦しい時代です。
      # 冒頭の一言の回収。1927年10月13日創設のペーニャ「Puerta de la Carne」（西語版クラブ記事、Marca 2017-12-18）
      - ファンの会の歴史も長く、**1927年**にできた会は、今も続くものでスペイン最古です。
    sources:
      - https://es.wikipedia.org/wiki/Historia_del_Real_Betis_Balomp%C3%A9
      - https://en.wikipedia.org/wiki/Real_Betis
      - https://es.wikipedia.org/wiki/Real_Betis_Balomp%C3%A9
      - https://www.marca.com/futbol/2017/12/18/5a3805d4ca4741b77a8b45ea.html
  - id: history3
    heading: ファンが取り戻したクラブ
    tier: 背景
    telop: ファンが集めたお金と、筆頭株主との対立
    narrator: 解説
    card:
      type: table
      title: ファンが取り戻したクラブ
      columns: ["", ""]
      rows:
        - ["1992年", "株式会社に。ファンが4億ペセタ"]
        - ["2009年", "2部へ。6万人を超える抗議"]
        - ["2017年", "株をファンと株主へ売り出す"]
    say:
      - 1992年、法律で株式会社になるとき、ファンは3か月で**4億ペセタ**を集めました。
      - それでも足りず、残りを出した副会長のロペラが、筆頭株主になります。
      - 2009年に2部へ落ちると、**6万人**を超えるファンが町を歩き、ロペラに身を引くよう求めました。
      - 2017年、株は1株**120ユーロ**でファンと株主に売り出され、ロペラはクラブを離れました。
    sources:
      - https://en.wikipedia.org/wiki/Real_Betis
      - https://es.wikipedia.org/wiki/Historia_del_Real_Betis_Balomp%C3%A9
      - https://es.wikipedia.org/wiki/Real_Betis_Balomp%C3%A9

