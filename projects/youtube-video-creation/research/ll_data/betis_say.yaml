# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - デニウソンは1998年、サンパウロから加わったブラジル代表のドリブラーです。
  - 移籍金は**2150万ポンド**で、当時の世界最高額。それでも2年目、チームは2部へ落ちます。
  - 残ってリーグ戦で**185試合**。在籍中の2002年、日韓ワールドカップで優勝しました。
- - ルベン・カストロは2010年、2部にいたベティスに加わった点取り屋です。
  - 再び2部で戦った2014年からのシーズン、リーグ戦**31得点**。1年で1部へ戻しました。
  - リーグ戦で**260試合135得点**。公式戦の**148得点**は、クラブの歴代最多です。
- - ボルハ・イグレシアスは2019年、**2800万ユーロ**で来たセンターフォワード。
  - 2022年、国王杯の決勝で先制点。大会の得点王で、決勝の最優秀選手にも選ばれました。
  - リーグ戦で**142試合39得点**。在籍中に、スペイン代表にも初めて呼ばれました。
legend_rows:
