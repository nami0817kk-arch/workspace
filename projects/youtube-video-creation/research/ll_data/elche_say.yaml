# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1923年**。町のクラブの代表が、花火師の作業場に集まって作りました。
- 愛称は「フランヒベルデス」。白いシャツに通した、緑の帯から来ています。
- ホームタウンはエルチェ。ヤシの林は世界遺産で、胸の緑はその色だと伝わります。
- 本拠地はマルティネス・バレーロ。クラブの発表では、**3万1388人**が入ります。
- オーナーは**2019年**から、アルゼンチンのブラガルニク。元はレンタルビデオ店の店主です。
- 1部、国王杯、スーペルコパ、ヨーロッパ。優勝はどれも、まだありません。
- 最多出場はフォワードのニーノ。**461試合**に出て、**135点**もクラブ最多です。
- 直近のタイトルは**2013年**の2部優勝。開幕から最終節まで、首位のままでした。
- 昨季のリーグ戦は**15位**。勝ち点**43**で、1部に残りました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、4つに割る
story_sections:
  - id: history
    heading: 選手が切り盛りした
    tier: 背景
    telop: 1953年、選手たちがクラブを動かした
    narrator: 解説
    card:
      type: table
      title: 選手が切り盛りした
      columns: ["", ""]
      rows:
        - ["1953年", "お金の問題で消えかける"]
        - ["協同組合", "入場料から経費を引き、選手で分ける"]
        - ["開幕前", "選手がスタンドを掃除し、壁を塗る"]
    say:
      - 1953年、お金の問題で、クラブは消えかけていました。
      - そこで選手たちが、自分たちでクラブを動かす形をとります。
      - 入場料から経費を引き、残りを選手で分ける。協同組合の形です。
      - 開幕の前には、選手がスタンドを掃除し、本拠地の壁を白く塗りました。
    sources:
      - https://es.wikipedia.org/wiki/Historia_del_Elche_Club_de_F%C3%BAtbol
      - https://es.wikipedia.org/wiki/Elche_Club_de_F%C3%BAtbol
  - id: history2
    heading: 1部で5位、そして決勝へ
    tier: 背景
    telop: 1959年に初の1部。1969年は国王杯の決勝へ
    narrator: 解説
    card:
      type: table
      title: 1部で5位、そして決勝へ
      columns: ["", ""]
      rows:
        - ["1959年", "初めて1部へ"]
        - ["1963-64", "5位。今もクラブ最高"]
        - ["1969年", "国王杯の決勝でアスレティックに0対1"]
    say:
      - 2年続けて昇格し、**1959年**に初めて1部へ上がります。
      - 1963年からのシーズンは**5位**。これが今も、クラブの最高順位です。
      - 1969年には国王杯の決勝へ。アスレティック・ビルバオに**0対1**で敗れました。
    sources:
      - https://en.wikipedia.org/wiki/Elche_CF
      - https://es.wikipedia.org/wiki/Elche_Club_de_F%C3%BAtbol
  - id: history3
    heading: 13位で、2部へ
    tier: 背景
    telop: 2015年、1部に残ったのに2部へ
    narrator: 解説
    card:
      type: table
      title: 13位で、2部へ
      columns: ["", ""]
      rows:
        - ["2014-15", "1部で13位。残留を決める"]
        - ["税務当局に", "670万ユーロ"]
        - ["選手協会に", "550万ユーロ"]
    say:
      - 2015年、1部を**13位**で終え、残り4節で残留も決めていました。
      - ところが、税務当局に**670万ユーロ**、選手協会に**550万ユーロ**の借金。
      - 借金を縛るリーグの新しい規則で、2部へ落とされます。
      - 2年後には、さらに3部まで落ちました。
    sources:
      - https://en.wikipedia.org/wiki/Elche_CF
      - https://es.wikipedia.org/wiki/Elche_Club_de_F%C3%BAtbol
  - id: history4
