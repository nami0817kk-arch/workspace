# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ホルヘ・モリーナは同じ県のアルコイ生まれ。2009年、ポリ・エヒードから来ました。
  - 1シーズン目はリーグ戦で**38試合26得点**。2部の得点王になりました。
  - 翌年ベティスへ。40歳を過ぎても点を取り、国王杯の最年長得点を塗り替えました。
- - マヌ・エレーラは2012年、アルコルコンから来たゴールキーパーです。
  - 1シーズン目に、2部で最も失点の少ないキーパーの賞。チームは優勝しました。
  - "**31歳**で1部デビュー。リーグ戦で**76試合**に出て、2015年に去りました。"
- - ルーカス・ボジェは2020年、上がったばかりのエルチェに期限付きで来たフォワード。
  - 翌年に完全移籍。2022年3月、在籍中にアルゼンチン代表へ初めて呼ばれました。
  - リーグ戦で**96試合22得点**。2023年に、グラナダへ移りました。
legend_rows:
