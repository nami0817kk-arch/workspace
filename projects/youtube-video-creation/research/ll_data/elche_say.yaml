    say:
      - 3部は1年で抜け出し、2020年には1部への昇格をかけた決勝へ。
      - 相手はジローナ。途中から出たペレ・ミージャが、**96分**に決めました。
      - これで、**5年**ぶりの1部です。
    sources:
