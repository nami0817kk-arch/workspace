# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
# 冒頭の一言で創立年を言うので、創立の行では年を繰り返さない
data:
- 創立の日は、スコットランドの詩人をしのぶ夜。カフェに集まった若者たちが作りました。
- 愛称はネルビオネンセス。本拠地のある、ネルビオン地区から来た呼び名です。
- ホームタウンはセビリア。アンダルシア州の州都で、スペインで**5番目**に大きな町です。
- 本拠地はラモン・サンチェス・ピスフアン。**4万3000人**あまりが入ります。
- 会長はホセ・マリア・デル・ニド・カラスコ。クラブは株式会社で、株主が会長を選びます。
- 1部優勝**1回**、国王杯**5回**、スーペルコパ**1回**。ヨーロッパリーグ**7回**、欧州スーパーカップ**1回**。
- 最多出場は地元育ちのヘスス・ナバス。2024年までに、**705試合**に出ました。
- 直近のタイトルは2023年のヨーロッパリーグ。ローマとの決勝を、ピーケー戦で制しました。
- 昨シーズンは**13位**。降格したマジョルカとは、勝ち点**1**の差でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

