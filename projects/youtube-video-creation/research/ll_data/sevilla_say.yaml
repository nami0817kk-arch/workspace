# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
# ヘスス・ナバスは基礎DATAの最多出場で出るので、同じ人を2つの節に出さない
legends:
- - パロップはバレンシアで控えが長かったゴールキーパー。2005年、**31歳**で来ました。
  - 2007年、ウエファカップのシャフタール戦。ロスタイムに、自分で同点ゴールを決めます。
  - その年の決勝は、ピーケー戦で**3本**止めて優勝。リーグ戦では**217試合**に出ました。
- - カヌーテはフランス生まれのマリ代表。2005年に、トッテナムから来たストライカーです。
  - 2006年のウエファカップ決勝で1点。翌年の国王杯決勝では、1対0の決勝点を挙げました。
  - リーグ戦で**209試合89得点**。外国人選手では、クラブ最多の得点です。
- - ラキティッチはスイス生まれのクロアチア代表。2011年に、シャルケから来ました。
  - 2014年、主将としてヨーロッパリーグを制し、決勝の最優秀選手にも選ばれます。
  - 2020年に戻って、2023年に2度目の優勝。リーグ戦は2度の在籍で、通算**238試合**。
legend_rows:
- ["アンドレス・パロップ", "2005-2013", "点も取った守護神"]
- ["フレデリック・カヌーテ", "2005-2012", "外国人の最多得点"]
- ["イヴァン・ラキティッチ", "2011-2024", "主将で欧州制覇"]
