# 「Es un arranque soñado, pero la competición es muy dura.」
# 日本人選手はいない（First-team squad に日本人なし）
reasons:
- "今シーズンは7試合を終えて、勝ち点**13**の5位です。"
- "率いるのは、3月に来たルイス・ガルシア監督。こう話しています。"
- {voice: ルイス・ガルシア・プラサ, text: "夢のような出だしだ。ただ、リーグはとても厳しい"}
- "昨シーズンは残り5試合で、降格圏の18位。そこから3連勝で残しました。"
- "2005年には、100年の節目に作られた応援歌が、国内の売り上げで1位になりました。"
- "そしてその歌ができた翌年から、ヨーロッパリーグを**7度**制しています。"
