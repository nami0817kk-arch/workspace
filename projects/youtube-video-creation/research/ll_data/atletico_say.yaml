# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1903年**の4月。123年の歴史を持つクラブです。
- 愛称はコルチョネロス、マットレス職人。縞が、昔のマットレスの布と同じ色でした。
- ホームタウンは首都マドリード。今シーズンの1部には、この街から**3クラブ**。
- 本拠地はメトロポリターノ。**7万813人**が入り、20クラブで**2番目**の大きさ。
- オーナーはアメリカの投資会社、アポロ。今年3月に株の**55パーセント**を握りました。
- 1部の優勝は**11回**、国王杯は**10回**。ヨーロッパリーグとスーパーカップは**3回**ずつ。
- 最多出場は主将のコケ。公式戦の**748試合**は、クラブの記録です。
- 直近のタイトルは2021年のリーグ優勝。最終節、バリャドリードに**2対1**で決めました。
- 昨シーズンは**4位**で勝ち点**69**。国王杯は決勝で、ソシエダにピーケー戦で敗れました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、3つに割る
story_sections:
  - id: history
    heading: ビルバオの支店
    tier: 背景
    telop: 1903年、ビルバオのクラブの支店として生まれた
    narrator: 解説
    card:
      type: table
      title: ビルバオの支店
      columns: ["", ""]
      rows:
        - ["1903年4月", "マドリードで創立"]
        - ["作った人", "バスクの学生たち"]
        - ["最初の名前", "アスレティック・クラブ（マドリード支店）"]
    say:
      - 1903年、ビルバオのアスレティック・クラブが、マドリードで国王杯の決勝に勝ちます。
      - それを見た、マドリードで学ぶバスクの学生たちが、本家の**支店**を作りました。
      - ユニフォームも本家と同じ、青と白の半々でした。
      - マドリードの側が独り立ちしたのは、1920年代に入ってからです。
    sources:
      - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
      - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  - id: history2
    heading: 赤と白は買い物の失敗
    tier: 背景
    telop: 探しに行ったのは青と白。持ち帰ったのは赤と白
    narrator: 解説
    card:
      type: table
      title: 赤と白の縞
      columns: ["", ""]
      rows:
        - ["1909年の暮れ", "選手がイングランドへ買い出し"]
        - ["探したもの", "ブラックバーンの青と白"]
        - ["持ち帰ったもの", "サウサンプトンの赤と白"]
    say:
      - 赤と白の縞は、買い物の失敗から始まった、とも言われます。
      - 1909年の暮れ、選手の一人が、両方のクラブのシャツを買いにイングランドへ渡りました。
      - 探したのはブラックバーンの青と白。見つからず、サウサンプトンの赤と白を持ち帰ります。
      - シャツは同じ赤と白。パンツは、ビルバオが黒に替え、マドリードは青のままでした。
    sources:
      - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
      - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  - id: history3
    heading: アトレティコという名前
    tier: 背景
    telop: 空軍のクラブと組み、名前がアトレティコに
    narrator: 解説
    card:
      type: table
      title: アトレティコという名前
      columns: ["", ""]
      rows:
        - ["1939年", "空軍のクラブと組む"]
        - ["1940年代の初め", "外国語の名前が禁止に"]
        - ["1947年", "今の名前に"]
    say:
      - 内戦のあと、1939年に空軍のクラブと組み、名前にアビアシオン、航空が付きます。
      - さらに外国語の名前が禁じられ、英語のアスレティックは、スペイン語のアトレティコに。
      - この時代に、リーグで初めての優勝と連覇を果たしました。
      - 航空の名前が外れ、今の名前になったのは**1947年**です。
    sources:
      - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
      - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid

# このクラブの特徴（プレーの色・運営の型・クラブの気質）
features:
- "シメオネ監督のチームは、まず守って、速く攻める。"
- "2015年から16年のシーズンは38試合で失点**18**。ヨーロッパ5大リーグで最少でした。"
- "運営は、大きく使う型。クラブ最高額の補強は、ジョアン・フェリックスの**1億2600万ユーロ**。"
- "この夏も、移籍金に合計**1億3000万ユーロ**を使いました。"
- "スタンドも熱い。9月20日、レアル・マドリードとのダービーの観客は**7万514人**。"
- "今の本拠地の新記録です。"
- "合言葉は「パルティード・ア・パルティード」。1試合ずつ、という意味です。"
