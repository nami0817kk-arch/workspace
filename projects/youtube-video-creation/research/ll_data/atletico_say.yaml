# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ（在籍が分かれる人は足した）
legends:
- - フェルナンド・トーレスは、11歳からこのクラブで育ったフォワードです。
  - 19歳でクラブ最年少の主将に。2015年に戻り、2018年の最後の試合で2得点しました。
  - そのあと日本のサガン鳥栖へ。アトレティコではリーグ戦で**321試合109得点**を残しました。
- - ディエゴ・ゴディンは、ウルグアイのセンターバック。2010年にビジャレアルから来ました。
  - 2014年の最終節、カンプ・ノウで同点のヘディング。18年ぶりのリーグ優勝を決めます。
  - 2019年、主将の腕章をコケに渡して退団。リーグ戦で**277試合17得点**でした。
- - アントワーヌ・グリーズマンは、クラブの歴代最多得点者。2014年にソシエダから来ました。
  - 2018年のヨーロッパリーグ決勝で2得点。一度バルセロナへ出て、2021年に戻ります。
  - リーグ戦で**349試合143得点**。この夏、アメリカのオーランド・シティへ移りました。
legend_rows:
- ["フェルナンド・トーレス", "2001-07, 2015-18", "19歳で主将"]
- ["ディエゴ・ゴディン", "2010-2019", "優勝を決めた頭"]
- ["アントワーヌ・グリーズマン", "2014-19, 2021-26", "歴代最多得点"]
