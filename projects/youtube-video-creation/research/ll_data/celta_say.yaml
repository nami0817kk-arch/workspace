    telop: 借金8400万ユーロ。救ったのは21歳の2得点
    narrator: 解説
    card:
      type: table
      title: 3部の手前で
      columns: ["", ""]
      rows:
        - ["2007年", "もう一度2部へ"]
        - ["借金", "およそ8400万ユーロ"]
        - ["2009年6月", "21歳のアスパスが2得点"]
    say:
      - 2007年、もう一度2部へ。借金は、およそ**8400万ユーロ**に膨らみます。
      - 2009年、3部に落ちれば、クラブが消えかねない状況でした。
      - 残り2節のアラベス戦。途中から出た**21歳**のイアゴ・アスパスが、**2点**を決めます。
      - この勝利で残留。その若者が、いまの主将です。
    sources:
