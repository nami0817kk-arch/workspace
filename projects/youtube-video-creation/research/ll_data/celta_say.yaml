  - id: history2
    heading: 16強と降格
    tier: 背景
    telop: ベスト16に進んだシーズンに、2部へ
    narrator: 解説
    card:
      type: table
      title: 2003年から04年のシーズン
      columns: ["", ""]
      rows:
        - ["チャンピオンズリーグ", "初出場でベスト16"]
        - ["グループ", "ミランに次ぐ2位"]
        - ["リーグ戦", "19位で2部へ"]
    say:
      - 2003年、前のシーズンの**4位**で、初めてチャンピオンズリーグに出ます。
      - ミランと同じ組を2位で抜けて、ベスト16。アーセナルに敗れました。
      - ところがリーグ戦は**19位**。2部への降格が決まりました。
      - それでも、翌シーズンに1年で戻っています。
