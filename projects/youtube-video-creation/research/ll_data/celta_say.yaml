# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1923年**。ビーゴにあった2つのクラブが、1つになって生まれました。
- 愛称は「オス・セレステス」。ガリシアの旗と同じ、空色から来ています。
- ホームタウンは、大西洋に面したビーゴ。ガリシアで、いちばん人口の多い町です。
- 本拠地はバライードス。改修中のいまは、**2万3432人**が入ります。
- オーナーはモウリーニョ家の企業グループ。**2023年**から、娘のマリアンが会長です。
- リーグも国王杯も、優勝はありません。国王杯は、決勝で**3度**敗れました。
- 最多出場はイアゴ・アスパス。公式戦で**578試合**、いまも増え続けています。
- 直近のタイトルは**2000年**、ヨーロッパのインタートトカップです。
- 昨シーズンのリーグ戦は**6位**。勝ち点は**54**でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

