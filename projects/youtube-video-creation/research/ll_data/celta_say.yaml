# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - グデリはボスニア出身のストライカー。**1991年**、2部にいたセルタへ来ました。
  - 1年目に2部で**27得点**。チームを1部へ引き上げました。
  - リーグ戦で**231試合95得点**。去るときは、クラブで最も多く点を取った選手でした。
- - モストヴォイはロシアの司令塔。ファンは「バライードスの皇帝」と呼びました。
  - 2000年、インタートトカップの決勝で、故郷のクラブ、ゼニトを破りました。
  - リーグ戦で**235試合56得点**。降格した2004年まで、ここでプレーしました。
- - ノリートはアンダルシア出身のウイング。**2013年**、ルイス・エンリケ監督が率いるセルタへ。
  - 2015年、古巣バルセロナに**4対1**で勝利。自ら1点を決め、アスパスの2点も演出。
  - シティなどを経て**2020年**に復帰。リーグ戦は2度の在籍で**175試合50得点**。
legend_rows:
- ["ブラディミル・グデリ", "1991-1999", "2部から1部へ導いた"]
- ["アレクサンドル・モストヴォイ", "1996-2004", "バライードスの皇帝"]
- ["ノリート", "2013-2022", "2度在籍したウイング"]
legend_sources:
