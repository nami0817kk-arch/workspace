- "ピッチの外は、主力を売っても崩れない型。"
- "昨シーズンの前、中盤のバエナを**4200万ユーロ**でアトレティコへ売りました。"
- "それでも終わってみれば、そのアトレティコより上でした。"
- "スタンドは町ぐるみ。年間シートは**1万9000人**を超え、町の人口の3分の1より多い数です。"
