# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1923年**。入場料は男性が半ペセタで、女性は無料でした。
- 愛称は「黄色い潜水艦」。**1967年**の昇格を、ビートルズの曲で祝ったのが始まりです。
- ホームタウンはビジャレアル。人口**5万3623人**、タイル作りが盛んな町です。
- 本拠地はエスタディオ・デ・ラ・セラミカ。クラブの発表では、**2万3173人**が入ります。
- オーナーは**1997年**からフェルナンド・ロイグ。陶磁器の会社も持つ実業家です。
- 1部も国王杯も、優勝はまだ**0回**。ヨーロッパリーグ**1回**、インタートトカップ**2回**。
- 最多出場は、中盤のマヌ・トリゲロス。このクラブで**477試合**に出ました。
- 直近のタイトルは、**2021年**のヨーロッパリーグです。
- 昨季のリーグ戦は**3位**。勝ち点は**72**でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

