# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - リケルメはアルゼンチンの司令塔。バルセロナで外国人枠からあふれ、期限付きで来ました。
  - 2006年、チャンピオンズリーグ準決勝。試合中のピーケーを止められ、延長を逃しました。
  - リーグ戦で**106試合36得点**。いまは母国ボカ・ジュニアーズの会長です。
- - マルコス・セナはブラジル生まれの中盤。2002年に来て、11シーズンを過ごしました。
  - スペイン代表として、2008年のヨーロッパ選手権を制しています。
  - リーグ戦で**292試合25得点**。お別れの試合は、背番号と同じ**19分**から1分間の拍手。
- - カソルラは、地元オビエドの財政難で、18歳になる前にここへ来た中盤です。
  - 2008年、レアル・マドリードの誘いを断り、「ノーと言うことはできる」と話しました。
  - 大けがから**636日**ぶりの試合を、ここで迎えました。リーグ戦は**251試合40得点**。
legend_rows:
- ["フアン・ロマン・リケルメ", "2003-2007", "初の欧州4強の司令塔"]
- ["マルコス・セナ", "2002-2013", "欧州王者になった中盤"]
- ["サンティ・カソルラ", "2003-2020", "3度在籍した中盤"]
