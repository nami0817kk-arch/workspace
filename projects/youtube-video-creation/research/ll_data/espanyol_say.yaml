# 「へえ」の逸話。英語版クラブ記事（21分の拍手）と英語版ダニエル・ハルケの記事（イニエスタ）で裏を取った
episode:
  id: episode
  heading: 21分の拍手
  tier: 背景
  telop: 毎試合21分、スタンドから1分間の拍手
  narrator: 解説
  card:
    type: table
    title: 21分の拍手
    columns: ["", ""]
    rows:
      - ["2009年8月", "主将ハルケが急死、26歳"]
      - ["毎試合21分", "背番号にちなんで1分間の拍手"]
      - ["2010年", "親友イニエスタが決勝で追悼"]
  say:
    - {text: "2009年8月、主将のダニエル・ハルケが、心臓の発作で亡くなりました。**26歳**でした。", image: assets/images/ll_espanyol_episode/scene.jpg}
    - それから毎試合、背番号と同じ**21分**に、スタンドが1分間の拍手を送ります。
    - 翌年のワールドカップ決勝。親友イニエスタは自分の決勝点のあと、ユニフォームを脱ぎます。
    - 下のシャツには「ダニ・ハルケはいつも一緒に」と書いてありました。
  sources:
    - https://en.wikipedia.org/wiki/RCD_Espanyol
    - https://en.wikipedia.org/wiki/Daniel_Jarque

# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
# タムードは基礎DATAの最多出場で出るので、同じ人を2つの節に出さない
legends:
- - ポチェッティーノはアルゼンチンのセンターバック。**1994年**、1部に戻ったここへ来ました。
  - 2000年の国王杯を制し、クラブに**60年**ぶりの主要タイトルをもたらしました。
  - リーグ戦で**275試合**。2009年には監督の道をここで始め、今はアメリカ代表を率いています。
- - セルヒオ・ガルシアは地元生まれのフォワード。**2010年**、エースの後継ぎに来ました。
  - 2013年、敵地のラージョ戦で3得点。次のシーズンには、リーグ戦で**14得点**を挙げました。
  - 2度の在籍で、リーグ戦**207試合45得点**。主将も務め、今はクラブの若手チームの監督です。
- - 中国のフォワード、ウー・レイ。**2019年**のデビュー戦は、中国で**4000万人**以上が見ました。
  - その年の3月、中国の選手として初めて、スペインの1部でゴールを決めます。
  - 2020年1月には、バルセロナとの試合で同点弾。リーグ戦は**103試合10得点**でした。
legend_rows:
- ["マウリシオ・ポチェッティーノ", "1994-2006", "選手と監督で"]
- ["セルヒオ・ガルシア", "2010-2019", "2度在籍した主将"]
- ["ウー・レイ", "2019-2022", "中国人初の1部得点"]
legend_sources:
