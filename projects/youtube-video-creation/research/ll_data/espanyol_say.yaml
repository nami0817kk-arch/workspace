# いま見る理由。監督の言葉はクラブ公式 2026-09-18（エルチェに1対3で敗れたあとの会見）の原文
# 「tenemos que cambiar el chip urgentemente, la responsabilidad es mía.」
reasons:
- "監督は元市バスの運転手、マノロ・ゴンサレス。9月のエルチェ戦に敗れ、こう話しました。"
- {voice: マノロ・ゴンサレス, text: "すぐにでも頭を切り替えないといけない。責任は私にある"}
- "昨シーズンは**5連勝**で年を越し、欧州を狙える順位にいました。"
# 第18〜35節は勝ちなし（控えの「5. 今季の監督」、[EN-2526] の試合表を数えたもの）。最終は11位
- "ところが年明けから、リーグ戦で**18試合**勝てず。**11位**まで落ちました。"
- "今季も、ここまで7試合で**2勝**です。"
- "そしてこのクラブは、一つの大会を無敗で戦い抜きながら、欧州の頂点を逃しています。"
