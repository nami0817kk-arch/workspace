# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1900年**。スペインで今も続くクラブの中で、**5番目**に古いクラブです。
# 由来は西語版 Mascota（1920年代に会員の少なさを「cuatro gatos」とからかわれ、フィリックスのカタルーニャ語の呼び名 gat periquito から）
- 愛称は「ペリキートス」、インコのこと。ネコのフィリックスの、カタルーニャでの呼び名です。
- 会員が少なく「4匹のネコ」とからかわれたファンが、この名で呼ばれるようになりました。
- ホームタウンはコルネリャ。バルセロナの南西にある、人口**9万**ほどの町です。
- 本拠地は、コルネリャ・エル・プラットのスタジアム。クラブの発表では、**4万人**が入ります。
- オーナーは**2025年**から、アメリカのアラン・ペイスの投資会社。バーンリーも持っています。
- 1部の優勝は**0回**。国王杯は**4回**。スーペルコパとヨーロッパは、まだありません。
- 最多出場はフォワードのラウール・タムード。このクラブで**389試合**に出ました。
- 直近のタイトルは**2006年**の国王杯。決勝でサラゴサを**4対1**で破りました。
# 11位は「いま見る理由」で言ったので、ここは勝ち点だけ（順位は画面の表が見せる）
- 昨季のリーグ戦は、勝ち点**46**で終えました。
data_focus: [0, 1, 1, 2, 3, 4, 5, 6, 7, 8]

