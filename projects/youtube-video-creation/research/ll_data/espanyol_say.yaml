        - ["1997〜2009年", "五輪の競技場を借りる"]
        - ["2009年", "自前の新しい本拠地へ"]
    say:
      - 1997年、借金を返すため、長く使った本拠地サリアを売りました。
      - そこから**12シーズン**、バルセロナ五輪の競技場を借りて戦います。
      - 自前の家に戻ったのは2009年。その最初のシーズンには、中村俊輔もいました。
    sources:
