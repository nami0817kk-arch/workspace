      - https://en.wikipedia.org/wiki/RCD_Espanyol
  - id: history2
    heading: 3点のリードから
    tier: 背景
    telop: 1988年、1戦目を3対0で勝った決勝
    narrator: 解説
    card:
      type: table
      title: 1988年 ウエファカップ決勝
      columns: ["", ""]
      rows:
        - ["相手", "西ドイツのレバークーゼン"]
        - ["1戦目 ホーム", "3対0で勝利"]
        - ["2戦目 敵地", "0対3。ピーケー戦で敗れる"]
    say:
      - 1988年、ウエファカップの決勝。相手は西ドイツのレバークーゼンです。
      - ホームの1戦目は**3対0**。優勝に手がかかりました。
      - ところが敵地の2戦目で、そっくり追いつかれます。
      - 最後はピーケー戦。**2対3**の負けで、初めての頂点を逃しました。
    sources:
      - https://en.wikipedia.org/wiki/1988_UEFA_Cup_final
  - id: history3
    heading: 負けないまま
    tier: 背景
    telop: 2007年、大会で一度も負けずに準優勝
    narrator: 解説
    card:
      type: table
      title: 2007年 ウエファカップ決勝
      columns: ["", ""]
      rows:
        - ["相手", "セビージャ（グラスゴー）"]
        - ["試合", "10人で延長、2対2"]
        - ["大会を通して", "無敗。ピーケー戦で準優勝"]
    say:
      - 2007年、ふたたびウエファカップの決勝へ。ここまで負けなしで勝ち上がりました。
      - 相手は同じスペインのセビージャ。**68分**に、エスパニョールの1人が退場します。
      - 10人のまま延長の終盤に追いつき、**2対2**の引き分け。ピーケー戦で敗れました。
      - 無敗で優勝を逃したのは、この大会の歴史でこのクラブだけです。
    sources:
      - https://en.wikipedia.org/wiki/2007_UEFA_Cup_final
      - https://en.wikipedia.org/wiki/RCD_Espanyol
  - id: history4
    heading: 家を手放して
