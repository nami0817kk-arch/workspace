# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - フレン・ゲレーロは**8歳**で入団。**18歳**でトップに上がった、攻撃的な中盤です。
  - 大きなクラブに誘われても残り、1997年にクラブ最長となる10年の契約を結びました。
  - このクラブだけでプレーし、リーグ戦で**372試合101得点**。
- - アリツ・アドゥリスは、3度にわたってこのクラブに在籍したストライカーです。
  - 2015年のスーペルコパ、バルセロナからハットトリック。**4対0**で勝ち、優勝へ導きます。
  - 38歳でもゴールを決め、リーグ戦で**316試合118得点**を残しました。
- - イケル・ムニアインは**16歳**でデビュー。プロの公式戦では、クラブ最年少です。
  - 2024年、国王杯の決勝に延長から出てピーケーを決め、主将として杯を掲げました。
  - 売り物になりたくないと、違約金の無い契約を選び、リーグ戦で**434試合56得点**。
legend_rows:
- ["フレン・ゲレーロ", "1992-2006", "10年契約で残る"]
- ["アリツ・アドゥリス", "2002-2020", "3度在籍の点取り屋"]
- ["イケル・ムニアイン", "2009-2024", "16歳でデビュー"]
legend_sources:
- - https://en.wikipedia.org/wiki/Julen_Guerrero
- - https://en.wikipedia.org/wiki/Aritz_Aduriz
- - https://en.wikipedia.org/wiki/Iker_Muniain

