# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1898年**。バスクの学生7人が、ボールを蹴り始めた年です。
- 愛称は「レオネス」。ライオンの前に投げられた聖人、マメスにちなむ呼び名。
- ホームタウンはビルバオ。人口**34万**を超える、バスクでいちばん大きな町です。
- 本拠地はサン・マメス。**5万3289人**が入り、「大聖堂」と呼ばれます。
- 会長は**2022年**からジョン・ウリアルテ。クラブは会員のもので、会長も選挙で決まります。
- 1部の優勝は**8回**。国王杯は**24回**、スーペルコパは**3回**。
- 最多出場は、ゴールキーパーのホセ・アンヘル・イリバル。**614試合**に出ました。
- 直近のタイトルは**2024年**の国王杯。マジョルカとの決勝は、ピーケー戦までもつれました。
- 昨季のリーグ戦は**12位**、勝ち点**45**。その前の年の**4位**で、チャンピオンズリーグにも出ました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、4つに割る
story_sections:
  - id: history
    heading: 1911年の揉め事
    tier: 背景
    telop: 地元の選手だけ、は揉め事から始まった
    narrator: 解説
    card:
      type: table
      title: 地元の選手だけ
      columns: ["", ""]
      rows:
        - ["1911年", "出場資格でソシエダと対立"]
        - ["その後", "連盟が国籍の規則"]
        - ["それ以来", "地元の選手だけで戦う"]
        - ["1929年から", "一度も降格なし"]
    say:
      - このクラブが地元の選手だけで戦うようになったのは、**1911年**からです。
      - 国王杯で、このクラブが使ったイングランド人選手の資格に、ソシエダが抗議したのがきっかけ。
      - 連盟は、選手をスペイン国籍に限ると決めます。
      - 国籍の規則がゆるんだあとも、クラブは地元の選手に限るやり方を続けました。
      - この形のまま、**1929年**のリーグ創設から一度も2部に落ちていません。
      - ほかにはレアル・マドリードとバルセロナしかない記録です。
    sources:
      - https://en.wikipedia.org/wiki/Athletic_Bilbao_signing_policy
      - https://es.wikipedia.org/wiki/Athletic_Club
      - https://en.wikipedia.org/wiki/Athletic_Bilbao
  - id: history2
    heading: アトレティコは支部だった
    tier: 背景
    telop: アトレティコは、このクラブの支部として生まれた
    narrator: 解説
    card:
      type: table
      title: マドリードの支部
      columns: ["", ""]
      rows:
        - ["1903年", "支部としてアトレティコ誕生"]
        - ["1909年の暮れ", "サウサンプトンの赤白を50枚"]
        - ["その半分", "マドリードへ"]
    say:
      - アトレティコ・マドリードは**1903年**、このクラブの支部として生まれました。
      - 国王杯の優勝をマドリードで見届けた、バスクの学生3人が作ったチームです。
      - 1909年の暮れ、サウサンプトンの赤白のシャツを、イングランドで**50枚**買いました。
      - 半分はマドリードへ。2つのクラブは、いまも赤白の縦じまです。
    sources:
      - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
      - https://en.wikipedia.org/wiki/Athletic_Bilbao
  - id: history3
    heading: 欧州の決勝で
    tier: 背景
    telop: 1977年と2012年、欧州の決勝で敗れる
    narrator: 解説
    card:
      type: table
      title: 欧州の決勝
      columns: ["", ""]
      rows:
        - ["1977年", "ユヴェントスにアウェーゴール差"]
        - ["2012年", "アトレティコに0対3"]
    say:
      - 欧州で初めて決勝に進んだのは**1977年**。ユヴェントスに、アウェーゴールの差で敗れます。
      - 2012年は、ビエルサ監督のもとで決勝へ。相手はかつての支部、アトレティコでした。
      - 結果は**0対3**。同じシーズンの国王杯の決勝も落としています。
    sources:
      - https://en.wikipedia.org/wiki/Athletic_Bilbao
  - id: history4
    heading: 決勝は自分の家で
    tier: 背景
    telop: 決勝の舞台は、自分たちの本拠地だった
    narrator: 解説
    card:
      type: table
      title: 2025年、決勝は自分の家で
      columns: ["", ""]
      rows:
        - ["決勝の会場", "サン・マメス"]
        - ["準決勝", "マンチェスター・ユナイテッドに合計1対7"]
    say:
      - 2025年、ヨーロッパリーグの決勝の舞台は、このクラブの本拠地でした。
      - 準決勝まで勝ち進みましたが、マンチェスター・ユナイテッドに2試合で**1対7**。
      - 自分たちの家での決勝は、イングランドの2クラブが戦いました。
    sources:
