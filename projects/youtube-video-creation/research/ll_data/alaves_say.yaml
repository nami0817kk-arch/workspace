# 「Cuando hay felicidad hay que desbordarla y hay que disfrutarla. La vida es un baile y el baile hay que hacerlo.」
reasons:
- "今シーズンは**4節**で**2位**。クラブ史上最高の滑り出しで、**7節**を終えて**6位**です。"
- "率いるキケ・サンチェス・フローレス監督は、こう話します。"
- {voice: キケ・サンチェス・フローレス, text: "幸せなときは、あふれさせて味わうものだ"}
