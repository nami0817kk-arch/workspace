# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1921年**。大学生たちのクラブが名前を変えて、アラベスになりました。
- 愛称は「ババソロス」。バスク語で**豆の袋**。ビトリアの人たちの、昔からの呼び名です。
- ホームタウンはビトリア＝ガステイス。バスク自治州の州都で、人口は**26万人**。
- 本拠地は**1924年**開場のメンディソローサ。**1万9840人**は、20クラブで**3番目**に少ない。
- オーナーはホセアン・ケレヘタ。地元のバスケットボールの強豪、バスコニアの会長です。
- 1部も国王杯も、優勝はありません。2部では**4回**優勝しています。
- 最多出場は、アルゼンチン出身の中盤、マルティン・アストゥディージョ。**346試合**です。
- 直近のタイトルは、2015年から16年の2部優勝です。
- 昨シーズンのリーグ戦は**14位**。勝ち点は**43**でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

