# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - コスミン・コントラは、ルーマニア代表の右サイド。**1999年**に加わりました。
  - 決勝では、右からのクロスで2点を演出。その活躍で、欧州の年間ベストイレブンに入りました。
  - リーグ戦で**66試合5得点**。2001年に、ミランへ移りました。
- - テオ・エルナンデスは**18歳**のとき、アトレティコから期限付きで来た左サイドバック。
  - プロのデビューもこのクラブ。1年で、リーグ戦**32試合1得点**。
  - クラブ初の国王杯決勝では、バルセロナから直接フリーキックで同点弾。**1対3**で敗れました。
- - ホセルは**2019年**に来たセンターフォワード。デビュー戦で、いきなり決勝点を決めました。
  - 2020年11月には、ベルナベウで得点して勝利。ここで勝ったのは**2000年5月**以来でした。
  - リーグ戦で**110試合36得点**。のちにチャンピオンズリーグも制しました。
