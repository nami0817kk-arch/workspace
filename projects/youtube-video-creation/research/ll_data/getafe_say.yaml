# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
# 冒頭の一言で創立年を言うので、1行目で1983年を繰り返さない
data:
- 前のクラブが借金で解散した**1週間後**に、今のクラブが生まれました。
- 愛称は「アスロネス」。濃い青のことで、工場の作業着の色から、とも言われます。
- ホームタウンは、マドリードの中心から南へ**13キロ**のヘタフェです。
- 本拠地はコリセウム。いまは改修中で、完成すると**1万8500人**ほどが入ります。
- オーナーは**2002年**からアンヘル・トーレス。町長に頼まれて、クラブを買いました。
- 1部も国王杯も、まだ優勝がありません。ヨーロッパのタイトルも無し。
- 最多出場は、キーパーのペドロ・カバジェロで**335試合**。今の主将ジェネが迫ります。
- 直近のタイトルは、**1998年**から99年のシーズン、当時の3部リーグの優勝。
- 昨シーズンは**7位**。得点**32**は、リーグで2番目に少ない数でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

