# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ハビエル・カスケロは、**30歳**で加わった中盤。すぐに先発に定着しました。
  - ヨーロッパで8強に進んだシーズンは、公式戦**50試合**で**8得点**。
  - リーグ戦で**190試合21得点**。**36歳**になるまで、このクラブで戦いました。
- - ハイメ・マタは、**29歳**で初めて1部の試合に出たストライカーです。
  - 1年目にリーグ戦で**14得点**。2019年には、スペイン代表にも選ばれました。
  - リーグ戦で**176試合37得点**。遅咲きの点取り屋が、この町で花開きました。
- - ククレジャは2019年、バルセロナから期限付きで来た左サイドの選手。
  - ヨーロッパリーグでは16強まで戦い、翌年に完全移籍しました。
  - リーグ戦で**75試合4得点**。その後、スペイン代表で世界の頂点に立ちました。
legend_rows:
- ["ハビエル・カスケロ", "2006-2012", "欧州8強の中盤"]
- ["ハイメ・マタ", "2018-2024", "29歳で1部デビュー"]
- ["マルク・ククレジャ", "2019-2021", "のちの世界王者"]
legend_sources:
- - https://en.wikipedia.org/wiki/Javier_Casquero
- - https://en.wikipedia.org/wiki/Jaime_Mata
- - https://en.wikipedia.org/wiki/Marc_Cucurella

