      - ["ホームの2戦目", "延長で3対1から3対3"]
      - ["結果", "アウェーゴールの差で敗退"]
  say:
    - {text: "2008年、ヨーロッパの大会の準々決勝。相手はバイエルンでした。", image: assets/images/ll_getafe_episode/scene.jpg}
    - ホームの2戦目は、開始早々に1人が退場。それでも延長で**3対1**、勝ちが見えていました。
    - ところが**115分**と**120分**にトニの2点。アウェーゴールの差で敗れました。
    - 試合後、カーンは「40年で、こんな経験は無かった」と話しました。
  sources:
