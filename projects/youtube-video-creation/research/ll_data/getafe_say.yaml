    say:
      - 2007年の国王杯の準決勝。1戦目は、敵地でバルセロナに**2対5**の負け。
      - この試合でメッシは、マラドーナの伝説のゴールに似た一撃を決めています。
      - ところがホームの2戦目は**4対0**の勝ち。合計でひっくり返し、初めての決勝へ。
      - 決勝はセビージャに**0対1**で敗戦。翌年もバレンシアとの決勝に敗れました。
