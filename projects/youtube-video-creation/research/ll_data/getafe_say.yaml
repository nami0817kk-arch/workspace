# 「へえ」の逸話。英語版クラブ記事・2007–08 UEFA Cup knockout stage と、El Mundo 2008-04-11 のカーンの談話で裏を取った
episode:
  id: episode
  heading: 10人の120分
  tier: 背景
  telop: 10人で延長へ。最後の5分で追いつかれた
  narrator: 解説
  card:
    type: table
    title: 2008年 ヨーロッパの準々決勝
    columns: ["", ""]
    rows:
