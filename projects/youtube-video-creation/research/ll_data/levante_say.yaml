# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
# 一言で「いちばんの古株」と言うので、創立の行は合併の話にする
data:
- 創立は**1909年**。いまの形は**1939年**、同じ年に生まれた2つのクラブの合併です。
- 愛称は「グラノタ」。バレンシア語で**カエル**。川の中にあった、昔の球場から来た名前。
- ホームタウンはバレンシア。人口はスペインで**3番目**に多い、地中海の町です。
- 本拠地はシウダ・デ・バレンシア。**1969年**の開場で、**2万6354人**が入ります。
- 会長は**2023年**からパブロ・サンチェス。クラブは株式会社の形です。
- 1部と国王杯、スーペルコパの優勝はありません。2部では**3回**優勝しています。
- 最多出場は、2度在籍したホセ・ルイス・モラレス。**377試合**に出ました。
- 直近のタイトルは、2024年から25年の2部優勝。**97分**の決勝点で、昇格を決めました。
- 昨シーズンは**16位**。勝ち点**42**で3チームが並び、直接対決の成績で残りました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

