# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
# モラレスは基礎DATAの最多出場で出るので、同じ人を2つの節に出さない
legends:
- - アルナ・コネは、2011年にセビージャから借りたフォワード。リーグ戦で**34試合15得点**。
  - マドリードを**1対0**で破った試合でも、ただ1つのゴールを決めました。
  - 公式戦で**18点**に届くと、セビージャへ戻る契約。最後の3試合は休みました。
- - ケイロル・ナバスは、コスタリカのゴールキーパー。リーグ戦の出場は**47試合**。
  - 控えから定位置をつかんだ2013年から14年、リーグの最優秀ゴールキーパーに。
  - 2014年、**1000万ユーロ**でレアル・マドリードへ。チャンピオンズリーグを3連覇しました。
- - ビセンテ・イボーラは地元の生まれ。レバンテの下部組織で育った中盤です。
  - 給料の未払いで主力が去ったなか、2008年にデビュー。リーグ戦で計**227試合**。
  - 最後のシーズンに昇格を果たして引退。今はコーチとして、ベンチにいます。
