    telop: 2010年、カタールの王族がクラブを買う
    narrator: 解説
    card:
      type: table
      title: 王族が来た
      columns: ["", ""]
      rows:
        - ["2010年", "カタールの王族が買う"]
        - ["2011年", "カソルラを2100万ユーロで"]
        - ["2011-12", "4位。クラブ最高の順位"]
    say:
      - 2010年、カタールの王族がクラブを買いました。
      - 翌年、ビジャレアルからカソルラを**2100万ユーロ**で。クラブ史上最高の補強です。
      - ファン・ニステルローイやホアキンも加わり、2012年に**4位**。クラブ最高の順位でした。
