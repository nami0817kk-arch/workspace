# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - イスコはマラガ県の生まれ。**2011年**、バレンシアから地元のクラブへ来ました。
  - 2012年のゼニト戦で2得点。その年、欧州の若手に贈られるゴールデンボーイ賞に。
  - リーグ戦で**69試合14得点**。2013年、レアル・マドリードへ移りました。
- - カバジェロはアルゼンチンのゴールキーパー。**2011年**、けが人が出て急いで獲りました。
  - その年の10月、**480分**続けて無失点。クラブの記録を塗り替えました。
  - リーグ戦で**117試合**。2014年、マンチェスター・シティへ移りました。
- - ガメスは右サイドバック。地元の下部組織から、**2005年**に1部の舞台へ上がりました。
  - チームが2部に落ちても残り、**2008年**の1部復帰を主力として支えました。
  - 2011年からは主将。リーグ戦で**266試合**に出ました。
