  - id: history3
    heading: ドルトムントの夜
    tier: 背景
    telop: 準決勝まで、あと数分だった
    narrator: 解説
    card:
      type: table
      title: 2013年4月9日 ドルトムント
      columns: ["", ""]
      rows:
        - ["グループ", "負けなしの首位"]
        - ["準々決勝の第2戦", "90分まで2対1でリード"]
        - ["追加時間", "2点を奪われ、2対3"]
    say:
      - 2012年、初めてのチャンピオンズリーグ。グループを負けなしの首位で抜けました。
      - 準々決勝はドルトムント。敵地の第2戦、90分の時点で**2対1**とリードしていました。
      - ところが追加時間に、ロイスとサンタナが2点。最後の1点は、オフサイドの位置からでした。
      - 4強の座は、目の前で消えました。
    sources:
