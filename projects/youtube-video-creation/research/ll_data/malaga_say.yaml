# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1948年**。前身のクラブの、控えのチームとして生まれました。
- 愛称は「ボケロネス」。小さな魚、カタクチイワシのことです。
- ホームタウンはマラガ。アンダルシアで**2番目**に大きな、地中海の町です。
- 本拠地はラ・ロサレダ。1982年のワールドカップの会場で、収容は**3万778人**。
# 株は持ったまま、2020年2月に裁判所が経営から外し、管財人が運営（控えの基礎DATA「経営から外れる」）
- オーナーはカタールの王族、アブドゥラー・アル・サーニ。ただ今は、経営から外されています。
- 1部、国王杯、スーペルコパの優勝はありません。ヨーロッパの大会で**1回**。
- 最多出場は、中盤のミゲリ。前身のクラブの時代を含めて**405試合**です。
- 直近のタイトルは**2002年**のインタートトカップ。決勝でビジャレアルを破りました。
- 昨シーズンは2部で**4位**、勝ち点**73**。プレーオフを勝ち抜いての昇格です。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

