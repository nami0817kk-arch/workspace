# ラ・リーガ チーム紹介 ⑬マラガ（2026-09-27）。形は見本のレアル・ソシエダと同じ。
# 事実はすべて research/ll_data/malaga_research.md（出典付き）から。
# 「季」は合成音声が「き」と読むので使わない。アルファベットは読み上げに残さない（CDマラガ→前身のクラブ）
# 題の答え＝落ちた理由はお金（2012年12月にUEFAが借金で処分→2013年の欧州出場権を失う、
# 持ち主が投資をやめ主力を売却、2020年に裁判所が持ち主を経営から外す）。reasons の最後の行で答える
title: マラガ。ヨーロッパ8強から、3部まで落ちた理由
short_title: マラガってどんなクラブ？
# クラブを表す一言。西語版「primer club andaluz en conseguir un título oficial europeo」（2002年インタートトカップ）
opening: "アンダルシアで最初に、ヨーロッパの公式タイトル。"
# 回収先: story_sections の history3（2013年4月9日ドルトムント戦、90分まで2対1でリード）
hook: ヨーロッパの4強まで、残り数分だった夜があります。
thumbnail:
  line1: ヨーロッパ8強から3部へ
  line2: 8年ぶりに1部のマラガ
  crest_main: [マラガ]

# いま見る理由。監督の言葉は Marca 2026-09-20（ヘタフェ戦後）の原文
# 「Estoy convencido de que la victoria va a llegar. Cuando llegue la primera, llegarán las demás.」
reasons:
- "マラガは今シーズン、**8年**ぶりに1部へ戻ってきました。"
- "率いるフネス監督は、まだ1勝目を待っています。こう話しています。"
- {voice: フアン・フランシスコ・フネス, text: "勝利は必ず来る。最初の1勝が来れば、あとは続いてくる"}
# ショート単体で「8強」と「お金」の中身が分かるように、いつの何の大会か・誰のお金かを言う（2026-09-27 流れの点検）
- "**2013年**には、チャンピオンズリーグで**8強**まで進みました。"
- "そこから3部へ転げ落ちた理由は、お金。持ち主が、新たなお金を出さなくなったのです。"
reasons_focus: [1, 2, 2, 3, 3]
reasons_telop: 8年ぶりの1部と、初勝利を待つ監督
reasons_rows:
