    narrator: 解説
    card:
      type: table
      title: 3部からの帰り道
      columns: ["", ""]
      rows:
        - ["2013年", "処分で欧州の権利を失う"]
        - ["2020年", "裁判所が持ち主を外す"]
        - ["2023年", "25年ぶりに3部へ"]
        - ["2026年", "1部に戻る"]
    say:
      - 8強と同じシーズンにリーグ6位。それでも借金の処分で、翌シーズンの欧州には出られません。
      - 2013年の夏から主力が次々に去り、**2018年**には2部へ落ちます。
      - "**2020年**、裁判所は持ち主を経営から外し、運営を別の人に任せます。"
      - "3年後には、**25年**ぶりの3部でした。"
      - {text: "そこから2度の昇格を重ね、**2026年6月**に1部へ戻りました。", image: assets/images/ll_malaga_history4/scene.jpg}
