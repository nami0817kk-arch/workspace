# いま見る理由。監督の言葉はクラブ公式 2026-09-18（ラージョ戦の前日会見）の原文
# 「Hay que dar tres pasos hacia adelante, no uno. No estamos para dar uno.」
reasons:
- "クロアチア代表のブディミルは9月、1部通算**100得点**に届きました。"
- "**5連敗**で終えた昨シーズン。1部が初めてのラミス新監督は、こう求めます。"
- {voice: ルイス・ミゲル・ラミス, text: "前に出るのは一歩ではなく三歩だ。一歩で済む状況ではない"}
- "オサスナは**1977年**まで3部。そこから**9シーズン**後の**1985年**、ヨーロッパの舞台へ。"
