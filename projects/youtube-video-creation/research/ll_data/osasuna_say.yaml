# 題の答え＝3部（1976-77 Tercera）から9シーズン後の1985-86に初めてヨーロッパの大会（UEFA杯）へ。
# 英語版クラブ記事の Season to season 表と、西語版 Historia del C. A. Osasuna「Debut en Europa」で確認。
# reasons の最後の行で答える
title: オサスナ。3部にいたクラブが、9シーズン後に立っていた舞台
short_title: オサスナってどんなクラブ？
