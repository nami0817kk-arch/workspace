# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ジャバド・ネクナムはイラン代表の中盤。2006年のワールドカップのあと、ここへ来ました。
  - 2007年、4強まで進んだ大会のボルドー戦。延長**120分**に決勝点を決めました。
  - リーグ戦で**173試合29得点**。一度離れたあと、2014年に戻ってきています。
- - セサル・アスピリクエタは、ナバラ州生まれ。このクラブの下部組織で育ちました。
  - "**17歳**で1部にデビュー。リーグ戦で**99試合**に出ました。"
  - 2010年にマルセイユへ。のちにチェルシーの主将として、ヨーロッパの頂点に立ちました。
- - ミケル・メリーノはパンプローナ生まれ。父も、オサスナでプレーした選手です。
  - 2部にいた2016年、昇格のプレーオフで**3得点**。チームを1部へ戻しました。
  - 2024年のユーロではシュトゥットガルトで勝ち越し点。1991年に父が点を取った場所です。
legend_rows:
- ["ジャバド・ネクナム", "2006-2012、2014-2015", "延長120分の決勝点"]
- ["セサル・アスピリクエタ", "2007-2010", "チェルシーの主将に"]
- ["ミケル・メリーノ", "2014-2016", "父子で同じ競技場"]
