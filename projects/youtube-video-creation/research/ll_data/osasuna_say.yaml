# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→会長→タイトル歴→記録→直近→昨季）
data:
- 創立は**1920年**。「オサスナ」は、バスク語で「健康」という意味です。
- 愛称は「ロス・ロヒージョス」。スペイン語で「小さな赤たち」。
- ホームタウンはパンプローナ。7月の牛追い祭りで、世界に知られる町です。
- 本拠地はエル・サダール。**1967年**に開き、**2万3576人**が入ります。
- 会長は**2014年**からルイス・サバルサ。株式会社ではなく、会員が持つクラブです。
- 1部も国王杯もスーペルコパも、優勝はまだありません。
- 最多出場は、ナバラ生まれの中盤パチ・プニャル。このクラブで**513試合**です。
- 直近のタイトルは、2018年から19年のシーズンの2部優勝。勝ち点は**87**でした。
- 昨シーズンのリーグ戦は**17位**。勝ち点42で3チームが並び、直接対決の差で残りました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

