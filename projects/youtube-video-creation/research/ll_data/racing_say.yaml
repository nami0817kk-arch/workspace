# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ムニティスは、この町で生まれた小柄なアタッカー。3度このクラブでプレーしました。
  - "**2002年**、貸し出し元のレアル・マドリード相手に点を取り、喜んでみせました。"
  - リーグ戦で**304試合34得点**。2008年、クラブ初のヨーロッパ行きに貢献しました。
- - ジギッチはセルビアのフォワード。身長は**2メートル2センチ**あります。
  - 2006年に加入。小柄なムニティスとの2人組で、ファンの人気者になりました。
  - 一度出て、2009年に貸し出しで戻ると**19試合13得点**。リーグ戦で計**51試合24得点**。
- - セティエンは、この町が生んだ司令塔。**1992年**、34歳で2度目の在籍に入ります。
  - その年に**11得点**で1部復帰。リーグ戦は2度の在籍で計**328試合68得点**です。
  - "**2001年**、ファンの投票でクラブ史上最高の選手に。のちにバルセロナの監督も務めました。"
legend_rows:
- ["ペドロ・ムニティス", "1995-2012", "地元育ちの攻撃役"]
- ["ニコラ・ジギッチ", "2006-2009", "2メートルの点取り屋"]
- ["キケ・セティエン", "1992-1996", "ファン投票で史上最高"]
legend_sources:
