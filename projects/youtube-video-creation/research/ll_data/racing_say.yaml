# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1913年**。最初の試合は、地元のクラブに**1対2**で負けました。
- 愛称は「ベルディブランコス」。スペイン語で、緑と白のことです。
- ホームタウンはサンタンデール。カンタブリア州の州都で、大きな銀行が生まれた港町。
- 本拠地はエル・サルディネーロ。クラブの発表では、**2万2514人**が入ります。
- オーナーはセバスティアン・セリア。**2023年**に、会長と2人で株の**74パーセント**を得ました。
- 1部も国王杯も、まだ優勝がありません。1部の最高は、**1931年**の2位です。
- 最多出場は、地元生まれのキーパー、セバージョス。このクラブだけで**460試合**。
- 直近のタイトルは昨シーズンの2部優勝。最終節は、カディスに**4対1**で勝ちました。
- 昨シーズンは2部で**1位**。勝ち点**82**で、2位に**5**差をつけています。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

