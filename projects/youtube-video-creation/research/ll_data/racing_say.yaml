      - ["初めての負け", "ラージョ・バジェカーノ戦"]
  say:
    - 1972年に始まったシーズン。2部にいたチームの選手たちが、ある約束をします。
    - 負けるまで、口ひげは剃らない。相手はどこも、本気で止めに来たといいます。
    - 初めての負けは、マドリードでのラージョ戦。監督も含め、全員がひげを剃りました。
    - チームはそのまま、1部に上がっています。
