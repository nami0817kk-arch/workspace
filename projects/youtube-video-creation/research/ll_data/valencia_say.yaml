# ラ・リーガ チーム紹介 ⑲バレンシア（2026-09-27）。形は見本のレアル・ソシエダと同じ。
# 事実はすべて research/ll_data/valencia_research.md（出典付き）から。
# 「季」は合成音声が「き」と読むので使わない。アルファベットは読み上げに残さない（PK→ピーケー）
# 題の答え＝今シーズンがメスタージャ最後のシーズン（クラブ公式 2026-08-19「la última temporada del Camp de Mestalla」）。
# reasons の最後の行で答える
title: 佐藤龍之介のバレンシア。1923年から続いて、今シーズンで終わるもの
short_title: 佐藤龍之介のバレンシアってどんなクラブ？
# クラブを表す一言。英語版 Mestalla Stadium「commonly recognized as the steepest in Europe」（BBC 2018-11-09）
opening: "ヨーロッパで、いちばん急なスタンド。"
# 回収先: story_sections の nou（2009年2月に中断、2025年1月に再開）
hook: 次の本拠地は、長いあいだ工事が止まったままでした。
thumbnail:
  line1: 本拠地、最後のシーズン
  line2: 佐藤龍之介のいるバレンシア
  crest_main: [バレンシア]

# いま見る理由。佐藤の言葉はクラブ公式 VCF Media 2026-07-11 の原文
# 「He llegado en el momento justo, cuando va a empezar la última temporada. ...
#  Deseo que esta campaña enorgullezca a los aficionados y les cree recuerdos increíbles de su último año en Mestalla」
reasons:
- "日本の**佐藤龍之介**が、この夏に加わりました。トップチームで、クラブ初の日本人です。"
- "佐藤は、加入したときにこう話しています。"
- {voice: 佐藤龍之介, text: "最後のシーズンが始まる、ちょうどいい時に来た。ファンの誇りになる年にしたい"}
- "チームはいま**19位**。9月には、日本代表も率いたアギーレ監督を呼びました。"
- "そして今シーズンは、1923年から使ってきた本拠地メスタージャの、最後のシーズンです。"
