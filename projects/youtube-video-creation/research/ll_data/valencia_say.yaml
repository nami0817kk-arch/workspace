people_extra:
- 佐藤龍之介

# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1919年**。町のバルに集まった若者たちが、クラブを作りました。
- 愛称は「チェ」。バレンシアの人が呼びかけに使う、「ねえ」にあたる言葉です。
- ホームタウンはバレンシア。人口およそ**82万人**、スペインで3番目の都市です。
- 本拠地はメスタージャ。**4万9430人**が入ります。
- オーナーは、シンガポールの実業家ピーター・リム。**2014年**に買い取りました。
- 1部の優勝は**6回**。国王杯は**8回**、スーペルコパは**1回**。
- 最多出場はフェルナンド・ゴメス。1983年から1998年までに、**556試合**です。
- 直近のタイトルは、創立100年のシーズンの国王杯。決勝でバルセロナを**2対1**で破りました。
- 昨シーズンのリーグ戦は**9位**。勝ち点は**49**でした。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、3つに割る
story_sections:
  - id: history
    heading: 2年続けて決勝へ
    tier: 背景
    telop: ヨーロッパの頂点に、2年続けてあと一歩
    narrator: 解説
    card:
      type: table
      title: 2年続けて決勝へ
      columns: ["", ""]
      rows:
        - ["2000年 パリ", "レアル・マドリードに0対3"]
        - ["2001年 ミラノ", "バイエルンにピーケー戦で敗戦"]
    say:
      - 2000年、クラブは初めて、チャンピオンズリーグの決勝に進みます。
      - パリでの相手はレアル・マドリード。**0対3**で敗れました。
      - 翌年も決勝へ。バイエルンと**1対1**のあと、ピーケー戦で力尽きます。
    sources:
      - https://en.wikipedia.org/wiki/Valencia_CF
      - https://en.wikipedia.org/wiki/2001_UEFA_Champions_League_final
  - id: history2
    heading: 31年ぶりの優勝
    tier: 背景
    telop: 31年ぶりの優勝。2004年は2冠
    narrator: 解説
    card:
      type: table
      title: 31年ぶりの優勝
      columns: ["", ""]
      rows:
        - ["2001-02", "31年ぶりのリーグ優勝"]
        - ["2003-04", "リーグとヨーロッパの大会の2冠"]
        - ["2004年", "世界最優秀クラブに選ばれる"]
    say:
      - 2002年、ベニテス監督のもとで、**31年**ぶりにリーグを制します。
      - 2004年はリーグに加えて、いまのヨーロッパリーグにあたる大会も制覇。
      - この年、国際サッカー歴史統計連盟から、世界最優秀クラブに選ばれました。
    sources:
      - https://en.wikipedia.org/wiki/Valencia_CF
      - https://en.wikipedia.org/wiki/Santiago_Ca%C3%B1izares
  - id: nou
    heading: 止まった新スタジアム
    tier: 背景
    telop: 新スタジアムの工事は、16年近く止まった
    narrator: 解説
    card:
      type: table
      title: 止まった新スタジアム
      columns: ["", ""]
      rows:
        - ["2007年", "新スタジアムの工事が始まる"]
        - ["2009年", "財政難で中断"]
        - ["2025年1月", "工事を再開。収容7万44人"]
    say:
      - 新しいスタジアムの工事は、**2007年**に始まりました。
      - ところが**2009年**、財政難で中断。クラブの借金は、4億ユーロを超えていました。
      - 再開は**2025年1月**。止まっていた期間は、**16年**近くに及びます。
      - 完成すれば**7万44人**が入り、引っ越しは来シーズンの予定です。
    sources:
      - https://en.wikipedia.org/wiki/Nou_Mestalla
      - https://en.wikipedia.org/wiki/Valencia_CF

