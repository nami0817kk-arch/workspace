# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ガイスカ・メンディエタは、2部のカステジョンから来た中盤。リーグ戦で**230試合44得点**。
  - 欧州の大舞台で輝き、2年続けてヨーロッパ最優秀のミッドフィルダーに選ばれました。
  - 2001年にラツィオへ。**4800万ユーロ**は、クラブが受け取った最高の移籍金です。
- - ダビド・アルベルダは、地元バレンシア州生まれの守備的な中盤。リーグ戦で**351試合**です。
  - 長く主将を務め、**2度**のリーグ優勝と、ヨーロッパの大会の制覇を支えました。
  - 一度は新監督に外されても移籍せず、春に戻って、残留を決めた試合に出ました。
- - ダビド・ビジャは2005年、サラゴサから**1200万ユーロ**で来たストライカーです。
  - 2008年から09年のシーズンは、リーグ戦で**28得点**。リーグで3番目の多さでした。
  - リーグ戦で**166試合108得点**。2010年にバルセロナへ移り、その夏に世界王者に。
legend_rows:
- ["ガイスカ・メンディエタ", "1993-2001", "欧州最優秀の中盤"]
- ["ダビド・アルベルダ", "1995-2013", "2度の優勝の主将"]
- ["ダビド・ビジャ", "2005-2010", "リーグ108得点"]
legend_sources:
- - https://en.wikipedia.org/wiki/Gaizka_Mendieta
- - https://en.wikipedia.org/wiki/David_Albelda
- - https://en.wikipedia.org/wiki/David_Villa

