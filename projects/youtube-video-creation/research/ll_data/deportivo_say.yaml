# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ベベットはブラジル代表のフォワード。**1992年**に加わりました。
  - その年のホームのレアル・マドリード戦、0対2から2点を決め、**3対2**の逆転勝ち。
  - 1年目はリーグ戦**29得点**で得点王。在籍中の1994年には、ワールドカップも制しました。
- - ロイ・マカーイはオランダのフォワード。**1999年**、テネリフェから来ました。
  - デビュー戦でハットトリック。2002年から03年は、ヨーロッパの得点王になりました。
  - リーグ戦で**79得点**。2003年、当時のバイエルンの最高額で移りました。
- - ルーカス・ペレスはア・コルーニャ生まれのフォワード。**4度**、このクラブに来ました。
  - 2022年の暮れ、3部のこのクラブへ移るため、自分で**49万3000ユーロ**を払いました。
  - 2024年、フリーキックで2部復帰を決めた1点。リーグ戦は4度の在籍で**162試合56得点**です。
legend_rows:
- ["ベベット", "1992-1996", "1年目に得点王"]
- ["ロイ・マカーイ", "1999-2003", "ヨーロッパの得点王"]
- ["ルーカス・ペレス", "4度在籍", "自腹で3部へ"]
