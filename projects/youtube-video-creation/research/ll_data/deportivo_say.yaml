      title: 18年ぶりの1部
      columns: ["", ""]
      rows:
        - ["1973年", "1部から降格"]
        - ["1991年", "18年ぶりに1部へ"]
        - ["1992-93", "3位。初めてヨーロッパへ"]
    say:
      - 1973年に1部から落ちると、そこから**18年**、上がれませんでした。
      - 1988年、借金を抱えたクラブに新しい会長が就き、1991年に1部へ戻ります。
      - 戻って2シーズン目に**3位**。スーペル・デポルと呼ばれるチームの始まりです。
    sources:
      - https://en.wikipedia.org/wiki/Deportivo_de_A_Coru%C3%B1a
