      - 1994年、首位で迎えた最終節。ホームでバレンシアに勝てば、初めての優勝でした。
      - 得点のないまま**89分**、ピーケーを得ます。蹴ったのはセンターバックのジュキッチ。
      - キーパーに止められて引き分け。優勝はバルセロナにさらわれました。
