# 基礎DATA。話す順は20クラブ共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1906年**。体育館サラ・カルベットの仲間たちが作りました。
- 愛称は「エルクリーノス」。町に立つローマの灯台、ヘラクレスの塔から来ています。
- ホームタウンはア・コルーニャ。大西洋に面したガリシアの町で、**約25万人**が暮らします。
- 本拠地はリアソール。浜辺のすぐそばに建ち、クラブの発表では**3万2490人**が入ります。
- オーナーはガリシアの銀行、アバンカ。株の**99パーセント**以上を持っています。
- 1部の優勝は**1回**。国王杯**2回**、スーペルコパ**3回**、インタートトカップ**1回**。
- 最多出場は、中盤のフラン。このクラブひと筋で**700試合**に出ました。
- 直近のタイトルは、2023年から24年のシーズンに取った、3部の優勝です。
- 昨シーズンは2部で**2位**。勝ち点**77**で、1部への昇格を決めました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、4つに割る
story_sections:
