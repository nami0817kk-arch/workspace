- "ヒダルゴ監督のチームは、守って好機を待つ。昇格したシーズンも、この戦い方でした。"
- "ピッチの外は、借金を消しての出直し。"
- "1部を離れた頃の借金は**1億ユーロ**超。2024年の夏に**ゼロ**になったと、クラブは言います。"
