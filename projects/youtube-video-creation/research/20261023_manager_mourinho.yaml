    - [チェルシー（2期）, '321', 63.6%, '8']
    - [ポルト, '127', 71.7%, '6']
    - [インテル, '108', 62.0%, '5']
    - [マンチェスターU, '144', 58.3%, '3']
    - [ほか5チーム, '362', 52.8%, '1']
    - [合計, '1252', 61.9%, '26']
    highlight_row: 6
    source: 英語版Wikipedia（行を足し直した）
  say:
  - text: モウリーニョの通算を、率いたクラブ別に並べます。
    image: assets/images/20261023_manager_mourinho/06_w.jpg
    card: *club_table
  - text: 勝率の最高は、レアルの72.6%。ポルトが、71.7%で続きます。
    emph: true
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card:
      <<: *club_table
      highlight_row: 0
  - text: 合計は、1252試合。775勝で、勝率61.9%。優勝は26冠です。
    emph: true
    image: assets/images/20261023_manager_mourinho/04_w.jpg
    card:
      <<: *club_table
      highlight_row: 6
  - text: 優勝26冠の内訳です。チェルシーが8、ポルトが6、インテルが5。
    card: &title_bars
      type: bars
      title: モウリーニョの優勝の内訳（冠）
      unit: ''
      items:
      - label: チェルシー
        value: 8
        highlight: true
      - label: ポルト
        value: 6
      - label: インテル
        value: 5
      - label: レアル
        value: 3
      - label: マンU
        value: 3
      - label: ローマ
        value: 1
  - text: リーグ優勝は、計8度。ポルトガルで2度、イングランドで3度、
    image: assets/images/20261023_manager_mourinho/02_w.jpg
    card: &lg_bars
      type: bars
      title: モウリーニョのリーグ優勝（度）
      unit: ''
      items:
      - label: イングランド
        value: 3
        highlight: true
      - label: ポルトガル
        value: 2
      - label: イタリア
        value: 2
      - label: スペイン
        value: 1
  - text: イタリアで2度、スペインで1度です。
    card: *lg_bars
  sources:
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
  - https://www.bbc.com/sport/football/articles/cvg4ne1pv4jo
- id: words
  heading: 本人は、規則とこれからを、どう語っているのか
  tier: 確定
  official: true
  telop: 9月のインタビューと、10月21日の記者会見
  narrator: 解説
  card: &words_doc
    type: document
    label: モウリーニョの言葉（2026年9月・10月、訳）
    paragraphs:
    - 交渉できない決まりがあります。9時集合なら、全員が9時です。
    - 私は、いつも良くなりたい。ここに来て、100日以上になります。
    highlight:
    - 全員が9時
    - いつも良くなりたい
  say:
  - text: ここからは、本人の言葉です。まず、9月のインタビュー。規則の話です。
    image: assets/images/20261023_manager_mourinho/06_w.jpg
    card: *words_doc
  - voice: モウリーニョ
    text: 交渉できない決まりがあります。
  - voice: モウリーニョ
    text: 9時集合なら、全員が9時です。
    cont: true
    pause: 0.5
  - text: もう1つは、10月21日。ライプツィヒ戦のあとの、記者会見です。
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card: *words_doc
  - voice: モウリーニョ
    text: 私は、いつも良くなりたい。
  - voice: モウリーニョ
    text: ここに来て、100日以上になります。
    cont: true
  - voice: モウリーニョ
    text: チームは、まだ望む場所にいません。
    cont: true
  - voice: モウリーニョ
    text: でも、以前より良くなっていることもあります。
    cont: true
    pause: 0.5
  quotes_from:
  - https://www.espn.com/soccer/story/_/id/50026378/jose-mourinho-nonnegotiable-rules-real-madrid-follow-dont-betray-me
  - https://www.realmadrid.com/es-ES/noticias/futbol/primer-equipo/ruedas-de-prensa/rueda-prensa-mourinho-post-rm-leipzig-j3-champions-21-10-2026
  sources:
  - https://www.espn.com/soccer/story/_/id/50026378/jose-mourinho-nonnegotiable-rules-real-madrid-follow-dont-betray-me
  - https://www.realmadrid.com/es-ES/noticias/futbol/primer-equipo/ruedas-de-prensa/rueda-prensa-mourinho-post-rm-leipzig-j3-champions-21-10-2026
- id: secret
  heading: 数字の外にある話。最初の仕事は、通訳だった
  tier: 背景
  telop: 通訳から始まった道。助手としてリーグ優勝を4度
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [1992年, スポルティングで、ロブソン監督の通訳に]
    - [1994〜96年, ポルトへ。助手として、リーグ優勝2度]
    - [1996〜2000年, バルセロナへ。助手として、リーグ優勝2度]
    - [2000年, ベンフィカの監督に。初めての監督]
    highlight_row: 0
    source: 英語版Wikipedia
  say:
  - text: ここから、数字の外の話。最初の仕事は、通訳でした。
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 1992年、ボビー・ロブソンが、ポルトガルのスポルティングの監督になります。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 英語を話せる、地元の指導者が必要でした。その役が、モウリーニョです。
    image: assets/images/20261023_manager_mourinho/06_w.jpg
    card: none
  - text: 通訳をしながら、戦術の話を重ねました。
    card:
      <<: *sec_table
      highlight_row: 1
  - text: ロブソンと一緒に、ポルト、そしてバルセロナへ移ります。
    card:
      <<: *sec_table
      highlight_row: 1
  - text: ポルトでも、バルセロナでも、助手として、リーグ優勝を2度ずつ経験しました。
    emph: true
    image: assets/images/20261023_manager_mourinho/04_w.jpg
    card:
      <<: *sec_table
      highlight_row: 2
  - text: そして2000年、ベンフィカで、初めて監督になります。
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
  - https://news.bbc.co.uk/sport2/hi/football/europe/8694338.stm
- id: view
  viewpoint: true
  heading: 見立て・勝率76%のレアルと、29%のクラシコ。差は、どこにあるのか
  tier: 背景
  telop: レアル1期目、クラシコを除く161試合は76.4%。クラシコ17試合は29.4%
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた
    columns: &view_cols [比べ, 答え]
    rows: &view_rows
    - [レアル1期目、178試合の勝率, 71.9%]
    - [クラシコを除く161試合の勝率, 76.4%]
    - [クラシコ17試合（5勝6分け6敗）の勝率, 29.4%]
    - [クラシコ、最後の5試合, 負けなし]
    highlight_row: 0
  say:
  - text: 見立てです。モウリーニョの、レアル1期目を、数え直します。
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card: *view_table
  - text: 178試合で、勝率71.9%。
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card:
      <<: *view_table
      highlight_row: 0
  - text: クラシコの17試合を除くと、161試合で、76.4%です。
    emph: true
    mark: {kind: circle, row: 1, col: 1}
    card:
      <<: *view_table
      highlight_row: 1
  - text: そのクラシコ17試合は、5勝6分け6敗。勝率は、29.4%です。
    emph: true
    mark: {kind: circle, row: 2, col: 1}
    card:
      <<: *view_table
      highlight_row: 2
  - text: ほかの試合との差は、約47ポイント。相手がバルセロナだと、数字は大きく変わります。
    image: assets/images/20261023_manager_mourinho/02_w.jpg
    card: none
  - text: それでも、最後の5試合は、負けていません。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 10月25日、バルセロナの本拠地で、2期目で初めてのクラシコです。
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card: none
  - text: バルセロナは、9戦9勝で、勝ち点27。レアルは21で、3位です。
    card: &view_pts
      type: stats
      title: 第9節までの勝ち点（ラ・リーガ）
      items:
      - ['27', 点, バルセロナ（9戦9勝）]
      - ['21', 点, レアル・マドリード（3位）]
      focus: 0
  - text: 差は6。クラシコの結果で、この差は、3にも、9にもなります。
    emph: true
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
  - https://www.espn.com/soccer/story/_/id/50245408/jose-mourinho-el-clasico-unmissable-real-madrid-barcelona-guardiola-messi-ronaldo
