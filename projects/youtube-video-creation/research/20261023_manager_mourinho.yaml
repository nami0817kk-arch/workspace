- id: style
  heading: モウリーニョのサッカーは、2010年のカンプ・ノウで、何を見せたのか
  tier: 報道
  telop: 戦術の色。2010年4月28日、バルセロナ 1-0 インテル
  narrator: 解説
  card: &style_stats
    type: stats
    title: 2010年4月28日 チャンピオンズリーグ準決勝・第2戦
    items:
    - ['1', 対0, この試合は、バルセロナの勝ち]
    - ['3', 対2, 2試合の合計は、インテルの勝ち]
    focus: 1
  say:
  - text: モウリーニョの戦術は、2010年4月28日、バルセロナの本拠地で見ます。
    image: assets/images/20261023_manager_mourinho/03_w.jpg
    card: *style_stats
  - text: チャンピオンズリーグの準決勝、第2戦。第1戦のスコアは、インテルの3対1でした。
    card: *style_stats
  - text: この試合は、バルセロナの1対0の勝ち。
    emph: true
    image: assets/images/20261023_manager_mourinho/06_w.jpg
    card: *style_stats
  - text: それでも、2試合の合計3対2で、インテルが決勝へ進みます。
    emph: true
    card: *style_stats
  - text: 前半28分、モッタが退場。インテルは、60分以上を、10人で戦いました。
    image: assets/images/20261023_manager_mourinho/03_w.jpg
    card: none
  - text: ボール支配率は、バルセロナが76%、インテルが24%。
    card: &style_poss
      type: stats
      title: ボール支配率
      items:
      - ['76', '%', バルセロナの支配率]
      - ['24', '%', インテルの支配率]
      focus: 0
  - text: インテルは、自陣の深くまで引いて、守る場所を埋めました。
    card: none
  - text: チームの特徴を、3つ見ます。まず、中盤に、中央の選手を3人以上置くこと。
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card: &style_doc
      type: document
      label: 英語版Wikipediaの要約（訳）
      paragraphs:
      - 中盤に、中央の選手を3人以上置き、中盤で上回ることを重く見る。
      - 守りの意識が高く、奪ってから、特にサイドを使って素早く攻める。
      - 試合の流れを見て、すばやく形を変える。
      highlight:
      - 3人以上
      - 奪ってから
      - すばやく形を変える
  - text: 次に、守りを固め、奪ったら素早く攻めること。
    image: assets/images/20261023_manager_mourinho/04_w.jpg
    emph: true
    card: *style_doc
  - text: 最後は、試合の流れを見て、形を変えること。
    card: *style_doc
  - text: このカンプ・ノウでは、退場のあと、深く、狭く守りました。
    card: *style_doc
  sources:
  - https://news.bbc.co.uk/sport2/hi/football/europe/8645184.stm
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
- id: numbers
  heading: 通算1252試合の数字は、チームごとに、どう違うのか
  tier: 報道
  telop: 勝率の最高はレアル72.6%。優勝26冠のうち、チェルシーが8
  narrator: 解説
  card: &club_table
    type: table
    title: モウリーニョの通算（トップチーム）
    columns: [所属, 試合, 勝率, 冠]
    rows:
