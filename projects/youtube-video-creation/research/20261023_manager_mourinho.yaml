  - text: 2004年、ポルトは、チャンピオンズリーグで優勝。欧州王者になります。
    emph: true
    image: assets/images/20261023_manager_mourinho/06_w.jpg
    card:
      <<: *career_tl
      focus: 1
  - text: 同じ2004年に、チェルシーへ。2004-05は、50年ぶりのリーグ優勝でした。
    image: assets/images/20261023_manager_mourinho/02_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: 勝ち点95、失点15は、当時のプレミアリーグの記録です。
    card:
      <<: *career_tl
      focus: 2
  - text: 2008年、インテルへ。
    emph: true
    image: assets/images/20261023_manager_mourinho/03_w.jpg
    card:
      <<: *career_tl
      focus: 3
  - text: 2009-10に、リーグ、国内杯、チャンピオンズリーグの3冠。
    emph: true
    card:
      <<: *career_tl
      focus: 3
  - text: イタリアのクラブでは、初めての3冠でした。
    card:
      <<: *career_tl
      focus: 3
  - text: 2010年、レアルへ。2011-12にリーグ優勝。
    emph: true
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card:
      <<: *career_tl
      focus: 4
  - text: ポルトガル、イングランド、イタリアに続く、4か国目です。
    card:
      <<: *career_tl
      focus: 4
  - text: 2015年に、チェルシーでリーグ優勝。
    image: assets/images/20261023_manager_mourinho/05_w.jpg
    card:
      <<: *career_tl
      focus: 5
  - text: 2017年には、マンチェスター・ユナイテッドで、ヨーロッパリーグを制します。
    card:
      <<: *career_tl
      focus: 5
  - text: 2022年、ローマでカンファレンスリーグを制覇。クラブ初の欧州タイトルです。
    image: assets/images/20261023_manager_mourinho/04_w.jpg
    card:
      <<: *career_tl
      focus: 5
  - text: そして今年、レアルに戻ってきました。
    image: assets/images/20261023_manager_mourinho/01_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
