# 監督紹介：モウリーニョ（10/23 金、シリーズ「監督紹介」、key: manager_mourinho、型は news）。9節の型（2026-10-20 決定）。見本は 20261022_manager_ancelotti。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-23 に自分で）**：research/posted.json・covered.yaml・scripts/ を grep。モウリーニョを主題にした「人物紹介」は無し（監督紹介は 10/21 グアルディオラ・10/22 アンチェロッティ）。
#   モウリーニョの名前が出る既存の本は、ニュース（9/8 VAR・9/9 ベティス会見・9/24 ヴィニシウスとの距離・10/14 審判の名前のショート・10/19 肘の話のショート）で、題材は別。本編の人物紹介は初。
#
# **いまの立場（一次で確かめた。違わなかった）**
#   ○ レアル・マドリード公式（realmadrid.com）2026-06-11「Official Announcement: José Mourinho」
#       https://www.realmadrid.com/en-US/news/club/latest-news/comunicado-oficial-mourinho-11-06-2026
#       「理事会が、モウリーニョを2029年6月30日までの3シーズン、トップチームの監督に任命」「7月13日（プレシーズン初日）に合流」。
#   ○ BBC Sport 2026-06-11（Keifer MacDonald）：63歳。3年契約。2010〜13年の1期目（リーグ1・国王杯1・スペイン・スーパー杯1）から13年ぶり。ベンフィカから戻る。
#   ○ ESPN の試合記録（site.api.espn.com schedule/summary）：2026-27 のレアル 12試合（ラ・リーガ9＋CL3）10勝0分2敗・33得点14失点（英語版 Wikipedia の 12試合10勝2敗33-14 と一致）。
#       ラ・リーガ 7勝2敗（ベティス 0-1・アトレティコ 1-2）、CL 3勝（インテル 2-1・ローマ 4-3・ライプツィヒ 4-1、10/21 まで）。
#   → 題・語りは「レアル・マドリード監督」「2期目」。就任発表は 2026-06-11、合流は 07-13。
#
# **通算の数え方（台本とサムネをそろえる）**＝クラブのトップチームの全公式戦。**英語版 Wikipedia「José Mourinho」Managerial statistics（2026-10-21 時点）の行を自分で足し直した。**
#   行（試合・勝・分・敗）：ベンフィカ1期 11・6・3・2／レイリア 20・9・7・4／ポルト 127・91・21・15／チェルシー1期 185・124・40・21／インテル 108・67・26・15／レアル1期 178・128・28・22／
#     チェルシー2期 136・80・29・27／マンU 144・84・32・28／トッテナム 86・44・19・23／ローマ 138・68・31・39／フェネルバフチェ 62・37・14・11／ベンフィカ2期 45・27・10・8／レアル2期 12・10・0・2。
#   **合計 1252試合 775勝 260分 217敗（勝率 61.9%）。Wikipedia の合計欄は 1251・774・259・218 と書くが、行を足すと 1252・775・260・217（各行は 勝＋分＋敗＝試合 で一致）。→ 台本・サムネは自分の足し算を使う。食い違いは報告に書く。**
#   クラブ別：レアル（2期）190試合138勝＝72.6%（1期 178試合128勝＝71.9%、2期 12試合10勝）／チェルシー（2期）321試合204勝＝63.6%／ポルト 127試合91勝＝71.7%／インテル 108試合67勝＝62.0%／マンU 144試合84勝＝58.3%／
#     ほか（ベンフィカ2期・レイリア・トッテナム・ローマ・フェネルバフチェ）362試合191勝＝52.8%。サムネの表は「他7チーム」＝インテル・マンU・ほか＝614試合342勝＝55.7%。
#   優勝（Wikipedia Honours の「Manager」欄を数えた。インタートト杯に当たる大会は無い。スーパー杯・コミュニティ・シールドは数える＝アンチェロッティ（30冠）と同じ数え方）：
#     ポルト6（リーグ2・国内杯1・スーパー杯1・UEFAカップ1・CL1）／チェルシー8（プレミア3・FAカップ1・リーグカップ3・コミュニティ・シールド1）／インテル5（セリエA2・コッパ1・スーパーコッパ1・CL1）／
#     レアル3（リーグ1・国王杯1・スペイン・スーパー杯1）／マンU3（リーグカップ1・コミュニティ・シールド1・ヨーロッパリーグ1）／ローマ1（カンファレンスリーグ）＝**26冠**。
#     助手時代の優勝（ポルト・バルセロナ）は数えない。→ 台本は「26冠」と言い、数え方（助手時代を除くトップチームの優勝）を概要欄の見立てに書く。
#   リーグ優勝の国：ポルトガル（2003・2004）・イングランド（2005・2006・2015）・イタリア（2009・2010）・スペイン（2012）＝**4か国、計8度**。
#   欧州王者：ポルト 2004（モナコに3-0）・インテル 2010（バイエルンに2-0）。BBC（2010-05-22）「ヘッペルとヒッツフェルトに並び、2つのクラブで欧州王者になった3人目」。
# **選手時代・基礎**：Wikipedia：1963-01-26 生まれ（ポルトガルのセトゥーバル）。選手：ベレネンセス・リオ・アヴェ・セジンブラ・コメルシオ・エ・インドゥストリア（下部）。通算62試合9得点（インフォボックス）→ 台本は数字を言わない。
# **ロブソンの通訳（マル秘話）**：Wikipedia「Coaching career」：1992年、ボビー・ロブソンがスポルティングの監督になり、英語を話せる地元の指導者が通訳として必要で、モウリーニョが就く（7月7日に就任会見）。
#   1993-12 ロブソンが解任され、ポルトの監督に（ポルトへ同行）→ 1994・95・96年のスーパー杯、1993-94 国内杯、1994-95・1995-96 リーグ優勝（助手）→ 1996 バルセロナ（ロブソン）→ ファン・ハール（La Liga 1997-98・1998-99）。
#   BBC（2010-05-21 プレビュー）：ファン・ハール「彼にコーチになってほしいと頼んだ。彼はチームを知っていた」「3年、私のもとにいた」。ファン・ハールは Bチームの指導を任せた（Wikipedia）。→ 台本は事実だけ。
#
# **日本との接点（一次で確かめた）**
#   ○ ESPN の試合記録（site.api.espn.com summary?event=401882919、控え research/raw/20261023_rm_sociedad_summary.json）：2026-08-26 ラ・リーガ、サンティアゴ・ベルナベウ（72,226人）。レアル 4-1 ソシエダ。
#       40分エンバペ・44分スチッチ（ソシエダ）・60分エンバペ・68分ヴィニシウス・80分エンバペ。**久保建英はソシエダの先発、74分にゲデスと交代。**ESPN の見出し「Mbappé hat trick gives Mourinho winning Bernabéu return」。
#   × モウリーニョと日本代表・日本人選手の直接の縁（指導した日本人）は確かめられなかった。Wikipedia に Japan の語は無い。→ 台本は「今季の1試合」だけ。
#
# **戦術の色（実例の試合＝2010-04-28 CL準決勝第2戦、バルセロナ 1-0 インテル（合計 2-3））**
#   ○ BBC Sport（2010-04-28 試合記録＋レポート）https://news.bbc.co.uk/sport2/hi/football/europe/8645184.stm ：第1戦 3-1 のリードを守る。モッタが退場（試合記録 27:38＝前半28分）で、60分以上を10人で戦う。
#       「インテルは深く引いて守りの場所を埋め、バルセロナのパスは前で回るだけで裏に通らなかった」。支配率 バルセロナ76%・インテル24%、枠内シュート 7-0、コーナー 9-2。84分ピケの1点。
#       ※BBCは「ピケはオフサイドの可能性」「モッタの退場は厳しい」と書くが、台本は審判の判定に触れない。
#   ○ 英語版 Wikipedia「Tactics」：特徴＝守備の意識の高さ＋中盤（特にサイド）を使った素早い切り替え／中盤に3人以上の中央の選手を置く／試合中の素早い対応。
#       「第2戦でモッタが退場したあと、モウリーニョは深く、狭く守った。インテルは1-0で負けたが合計3-2で決勝へ。『人生でいちばん美しい敗戦』と本人が語った」（←この言葉は Wikipedia のみ。一次を確かめられなければ台本に入れない）。
# **本人の言葉（自訳。原文は出典）**：①ESPN 2026-10-22「Mourinho made Real Madrid-Barcelona Clásico rivalry unmissable」：2026年8月の最初の会見（再就任後）"I'm not one for regrets" / "I'm here today, there tomorrow. I don't think much about what I've left behind."
#   ②ESPN 2026-09-25（Bet It Drives Show）："There are rules that are not negotiable. If you report at 9 a.m., it's 9 a.m. for everybody." / "Don't betray me, and I'll always be there for you."（本人の補足：「サッカーの話として」）
#   ③レアル公式の記者会見（es-ES、2026-10-21 ライプツィヒ戦のあと）：「Yo quiero siempre mejorar. Estoy aquí desde hace más de cien días. Obviamente, no está donde quiero, pero hay cosas que hacemos mejor hoy de lo que hacíamos antes.」
#       https://www.realmadrid.com/es-ES/noticias/futbol/primer-equipo/ruedas-de-prensa/rueda-prensa-mourinho-post-rm-leipzig-j3-champions-21-10-2026
# **クラシコ（見立て）**：ESPN 2026-10-22（控え research/raw/20261023_mou_clasico_background.txt）：1期目の対バルセロナ17試合（ラ・リーガ・国王杯・スーパー杯・CL）は 5勝6分6敗。最後の5試合は負けなし。
#   ※こちらで試合ごとに数え直した（2010-11-29 L0-5／2011-04-16 D1-1／04-20 W1-0延長／04-27 L0-2／05-03 D1-1／2011-08 D2-2・L／2011-12 L1-3／2012-01 L1-2・D2-2／04-21 W2-1／2012-08 L・W／10 D2-2／2013-01 D1-1／02 W3-1／03-02 W2-1）＝5勝6分6敗で一致。
#   クラシコ除く161試合＝178−17。勝 128−5＝123 → 76.4%。クラシコ 5÷17＝29.4%。差 47.0ポイント。
#   次：10/25（日）レアル対バルセロナ（ESPN 日程：Spotify Camp Nou）。ESPN 順位（第9節終了）：バルセロナ 9勝0分0敗＝勝ち点27、アトレティコ22、レアル 7勝0分2敗＝21（3位）。差6。勝てば3・引き分けなら6・負ければ9（勝ち点だけの単純計算）。
#
