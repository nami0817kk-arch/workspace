sections:
  - id: what
    heading: 何が起きるか
    tier: 報道
    telop: CL初戦、パルク・デ・プランス
    narrator: キャスター
    say:
      - チャンピオンズリーグが開幕します。
      - 現地時間9日、3連覇を目指す王者パリ・サンジェルマンがリーグフェーズの初戦を迎えます。
      - 本拠地パルク・デ・プランスに乗り込むのは、スロバキアのスロヴァン・ブラチスラヴァ。
      - そのチームを率いているのが、43歳のヤヤ・トゥーレ監督です。
      - かつてバルセロナとマンチェスター・シティで活躍した、元コートジボワール代表の名MFです。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202896.html
      - https://www.footballchannel.jp/2026/09/09/post1006998/

  - id: path
    heading: ここまでの道のり
    tier: 報道
    telop: 予選で3クラブを撃破
    narrator: キャスター
    card:
      type: table
      title: ヤヤ・トゥーレ監督のこれまで
      columns: ["時期", "できごと"]
      rows:
        - ["2020年1月", "現役を退く"]
        - ["その後", "トッテナムのユース監督、サウジアラビア代表のアシスタント"]
        - ["今夏", "スロヴァン・ブラチスラヴァの監督に就任"]
        - ["予選", "イベリア1999、ミェルビー、ツェリェを撃破"]
    say:
      - トゥーレが現役を退いたのは2020年1月でした。
      - そこからトッテナムのユース監督、サウジアラビア代表のアシスタントコーチを経て、今夏に現職に就いています。
      - 予選ではジョージアのイベリア1999、スウェーデンのミェルビー、スロベニアのツェリェを撃破。
      - そうしてたどり着いた先が、王者の本拠地でした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202896.html
      - https://web.ultra-soccer.jp/news/all/35631/

  - id: said
    heading: ふたりの監督は何と言ったか
    tier: 報道
    telop: 「選手たちには恐れてほしくない」
    narrator: 解説
    say:
      - トゥーレはUEFAを通じて、こう話しています。
      - {voice: ヤヤ・トゥーレ, text: デンベレやドゥエらを要する欧州屈指の強豪チームとの対戦になる}
      - {voice: ヤヤ・トゥーレ, text: だが、選手たちには恐れてほしくない}
      - {voice: ヤヤ・トゥーレ, text: 1度、2度、あるいは3度と抜かれる場面があるかもしれない}
      - {voice: ヤヤ・トゥーレ, text: それでも粘り強く戦う必要がある}
      - {voice: ヤヤ・トゥーレ, text: 勇気と決意、そして情熱を持って臨む必要がある}
      - 迎えるPSGのルイス・エンリケ監督も、相手の監督について語りました。
      - {voice: ルイス・エンリケ, text: 彼がバルサにいた頃のことはよく覚えている}
      - {voice: ルイス・エンリケ, text: もちろん、彼はトップクラスの選手だった}
      - {voice: ルイス・エンリケ, text: 私が分析した限りでは、彼はポゼッションを重視する監督だ}
      - {voice: ルイス・エンリケ, text: バルサやマンCでの経験が}
      - {voice: ルイス・エンリケ, text: そのスタイルに反映されているのだろう}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202896.html
      - https://web.ultra-soccer.jp/news/all/35631/
