  why: "21日のライプツィヒ戦後。マルカ：モウリーニョは「悲しい？ 本人にしか言えない。監督としては、彼がしたことに満足している」「ヴィニシウスには常にもっと決定的な役割を期待するが、私は彼の試合が好きだった。守備の責任が他の攻撃陣より重く、よく閉じた」「交代は機嫌が悪いからではない。ベンチが豊かだから」「クラシコに自信というものは無い。普通の試合の一つ、でも他とは違うと言えば嘘になる」。アウェイで口笛を浴びるのは動機になるが、ホームでは傷つく、とも。**条件：本人の言葉（監督）に当たる。日本は無し**。クルトワも「ヴィニシウス？ 常に最高の水準で臨む選手を2人しか知らない」と答えた（マルカ見出しのみ）。確度：確定（会見）。スペイン発として『クラシコの主審が変更』と伝える記事もある（A Bola・見出しのみ・未確認）。写真：コモンズにモウリーニョ49件ほど。時刻：18時以降。試験：Y。"
