title: 10月22日のショート題材
lead: 候補416件から27件（日本人4件・海外23件）。ショート10本ぶんを○で選んでください。
note: "今日は木曜（22日）。昨夜（日本時間22日朝）のCL第3節が中心です：バイエルン2-2アーセナル、コモ4-1マンU、アストン・ヴィラ3-1ヴァイキング、レアル4-1ライプツィヒ、インテル1-0シャフタール、リール2-4ガラタサライ、ベティス1-0フェイエノールト。日曜（25日）にクラシコ、月曜（26日）にバロンドールの授賞式（ロンドン）があります。
<br><br><b>日本人の題は4件だけです。</b>きのう・きょうの新しい出来事は鈴木彩艶のCL（フル出場）だけで、ほかは日本代表・W杯に絡む話（上田綺世の欠場、伊東純也の発言、三笘薫の復帰待ち）です。日本人選手が出た試合が少なく、<b>強い題材が無いので無理に数えていません</b>（遠藤・坂元・久保・田中碧は直近の本と重なるため除きました）。<b>ヒットの条件に当たるのは17件</b>（本人の言葉が取れた14件、日本代表に絡む4件、重なり1件）です。各行の「条件：」に書きました。
<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外の題。各行の最後に「時刻：」で書きました。
<br><br>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりで<b>読めませんでした</b>（nitterは中身が空、xcancelは403、公式サイトも406）。移籍の題は本文を読めた件が無く、出していません。出典の本文はすべて読みましたが、<b>スカイ・スポーツのライブブログ（フォデン・ヴァン・ダイク・アルテタ）は本文が取れず見出しだけ</b>なので、その件は題にしていません。ESPNは記事APIで読みました。
<br><br>除いた候補は下の「落とした候補」に理由を付けています。女子サッカー・Jリーグ・MLS・リーガMXは出していません。"
items:
- num: 1
  slot: 日本人
  head: 鈴木彩艶、CLヴァイキング戦にフル出場。アストン・ヴィラは3-1で開幕3連勝、勝ち点9でPSGと並ぶ
  why: "21日（日本時間22日）のCL第3節、ヴィラ3-1ヴァイキング（バークリー23分・ブエンディアPK37分・オウンゴール62分。84分に失点）。鈴木は**先発フル出場**。24分に後方から正確なロングフィードでチャンスを作り、50分のモイのシュートをセーブ（フットボールチャンネル）。次節は11月3日のバルサ戦（敵地）。得失点差でPSGと並び、総得点で下回って暫定2位。**今日起きた新しい日本人の出来事はこれだけ**。きのうの本（PLのベストイレブン）とは別の試合。**条件：日本代表（GK）に当たる。本人の言葉は取れていません**（試合後コメントは見つからず）。別の記事で伊東純也が「MVPは彩艶。全試合ピンチのところで止めていた」とW杯を振り返っている（Qoly）が、それは題3の話。確度：確定（試合結果）。写真：コモンズに本人の写真が11件ほど（日本代表の試合）。ただし10/18・10/21 の本で使った写真と重ならないよう、ヴィラ公式・試合の記事主写真を別に探す。時刻：9〜17時。試験：XまたはB。"
  src: フットボールチャンネル（ヴァイキング戦）、Qoly（伊東の評価）
  url: https://www.footballchannel.jp/2026/10/22/post1038039/
  fmt: news
- num: 2
  slot: 日本人
  head: 上田綺世を欠いたリールはCLで2-4の敗戦、36チーム中35位。日本代表はブラジル戦（11/14）をどう戦うか
  why: "21日、リール2-4ガラタサライ（リールはディアウネ〈Diaoune〉が2得点）。リールは**36チーム中35位**（フットマルカト）。ベンジャマン・アンドレは試合後「今夜は、正直に言って、レベルが足りない」と話した。上田綺世は10/13のアーセナル戦で左足を痛め、アンチェロッティ監督は足底筋膜の断裂を明かし、復帰時期は示していない（フットボールチャンネル 10/20）。11月14日、シンガポールのブラジル戦に出られるか不透明で、**直近4試合の日本の7得点のうち4点が上田**。**新しい事実は『上田不在のリールがCLで敗れた』こと**（10/19の本『上田を欠いたリール、ブレスト戦』とは別の試合）。**条件：日本代表に当たる（ブラジル戦・エース不在）。本人の言葉は無い**（アンドレは上田本人ではない）。確度：確定（結果・順位）＋報道（復帰時期は未発表）。写真：コモンズに上田綺世は6件ほどと少ない。リール公式・JFA・記事主写真を探す。足りなければ『顔が取れません』で止める。弱い：上田の新情報は無い。時刻：9〜17時。試験：X。"
  src: フットマルカト（アンドレのコメント・順位）、フットボールチャンネル（上田の負傷）
  url: https://www.footmercato.net/a6891166051684152039-lille-ce-soir-on-na-pas-le-niveau-il-faut-etre-honnete-le-terrible-constat-de-benjamin-andre
  fmt: news
  weak: true
- num: 3
  slot: 日本人
  head: 伊東純也、W杯ブラジル戦の田中碧のミスを「ミスって思ってなかった」。MVPは鈴木彩艶と語る
  why: "久保裕也氏のYouTubeでの対談。伊東は「（鈴木）彩艶と田中碧かな。2人ともよかった」「碧は特にスウェーデン戦とかはエグかった。全部回収してたので」「（ブラジル戦で決勝点を奪われたミスについて）俺はミスって思ってなかった」「（MVPは）彩艶。めちゃくちゃ止めてたなと思います」（Qoly）。別の記事では「ベルギーリーグに今いるから、結果を出さないともう代表にも呼ばれないだろうし、年齢的なのもある」（Football Tribe）。**条件：W杯・日本代表・本人の言葉の3つとも当たる**（題の人物＝伊東本人）。**注意：伊東の所属はベルギーのヘンクで、7リーグの外**。話題は日本代表（田中碧も鈴木彩艶もPL）なので入れたが、リーグ外なら外してください。**10/21の一覧にも載せた件の再掲で、新しい事実は無い**（制作されていないので、もう一度出す）。田中碧の件は『日本代表OBが取り上げないでほしいと注文』という別記事が出ている（見出しのみ確認）ので、伊東の言葉を主にして碧を貶さない作りにする。確度：確定（本人の発言）。写真：コモンズに伊東は20件ほど（ヘンク・日本代表）。時刻：9〜17時。試験：Y（本人の一言）。"
  src: Qoly（久保裕也氏との対談）、Football Tribe（伊東純也の発言）
  url: https://football-tribe.com/japan/2026/10/21/360586/
  fmt: quote
  weak: true
- num: 4
  slot: 日本人
  head: 三笘薫のいないブライトンが開幕7試合で23得点。三笘は今季まだ出場なし、復帰は11月の代表ウィークまでに間に合うか
  why: "ブライトンは18日にパレスを5-0で破り、リーグ開幕7試合で23得点・5失点、4連勝。**PL公式によれば、開幕7試合でこれより多く取ったのは過去に3チームだけ**。11人がゴール。三笘は**今季まだ一度も出場していない**。ヒュルツェラー監督は16日の会見で「11月の代表ウィークまでに戻ることを願う」が回復にはもう少し辛抱が必要と話した（フットボールチャンネル）。左ウイングにはデ・カイペルが入る。今夜（日本時間23日未明）はEL・ヤブロネツ戦。**条件：日本代表（11月の代表ウィーク）に当たる。本人の言葉は無い**（監督の言葉のみ）。確度：確定（成績）＋報道（復帰時期）。写真：コモンズに三笘は30件ほど。弱い：出来事が小さい（出場していない）。**記事内のFotMobの数字は使わない**（90分あたりの比べは自分で割る）。時刻：9〜17時。試験：B。"
  src: フットボールチャンネル（三笘薫がいぬ間に…）
  url: https://www.footballchannel.jp/2026/10/21/post1037634/
  fmt: news
  weak: true
- num: 5
  slot: 海外
  head: クヴァラツヘリア、前十字じん帯断裂「なぜ僕なんだ？」。PSGが手術と発表
  why: "20日のCLバルサ戦（4-2）の59分、エスパルトとの接触で負傷。PSGが21日に**右ひざ前十字じん帯の断裂と手術を発表**。ESPN：本人はインスタグラムに「ほんの少ししか経っていないのに、頭の中をぐるぐる回る。なぜ僕なんだ？ 全てを出し切ってきた」「この試合へ、今までで最高の準備をした」「この数か月を、苦しみと涙の中で過ごす覚悟はできている。強くなって戻る」と書いた。復帰まで通常9か月以上。マルキーニョスも数週間の離脱。10/21の本『PSG、バルサの全勝を止めた4発』とは別の新事実（負傷の確定と本人の言葉）。**条件：本人の言葉に当たる。代表・W杯は無し**（ジョージア代表）。確度：確定（クラブ声明・本人の投稿）。写真：コモンズにクヴァラツヘリアは49件ほど。ただし負傷の場面や担架の写真は使わない。時刻：18時以降。試験：Y（本人の一言）。"
  src: ESPN（記事API、本文）、フットマルカト
  url: https://www.espn.com/soccer/story/_/id/50235833/khvicha-kvaratskhelia-ruptured-acl-paris-saint-germain-confirm
  fmt: quote
- num: 6
  slot: 海外
  head: バロンドールの授賞式は月曜、ロンドン。ヤマル・ケイン・ムバッペの三つ巴、各自が語った受賞への思い
  why: "ESPN：授賞式は月曜（26日）。有力候補は**ヤマル・ケイン・ムバッペ**で、「メッシ・ロナウドの時代の終わりが近づき、近年で最も混戦」。投票は9/28に締め切り済み。ムバッペはフランス・フットボール誌に「普通の選手には与えない。違う選手に与える。今年の僕は違うことをした。だから自分にも取れると信じている」と語った。ケインとヤマルも少なくとも2回ずつ長い取材に答えた。前回受賞者の側近は『見苦しくなってきた』と話す。フットマルカトによれば、**クヴァラツヘリアは負傷で授賞式を欠席する可能性**（PSGはコメントせず）。**条件：本人の言葉（ムバッペ）に当たる。代表・W杯は無し**。確度：確定（日程・本人発言）。受賞者は未発表なので『誰が取る』と予想を書かない。写真：3人ともコモンズに多数。時刻：18時以降。試験：Y（ムバッペの一言）。"
  src: ESPN（記事API、本文）、フットマルカト
  url: https://www.espn.com/soccer/story/_/id/50229304/ballon-dor-industry-harry-kane-lamine-yamal-kylian-mbappe
  fmt: quote
- num: 7
  slot: 海外
  head: クルトワ、ムバッペのバロンドールに「個人としては誰も彼を上回っていない。でも僕らは何も勝てなかった」
  why: "レアルのクルトワがDAZNに。「キリアンにふさわしいと思う。でも人は自分の理屈で投票する。トロフィーを取った選手か、何も勝たなくてもシーズンを通して誰よりも上だった選手か」「個人としては誰も彼を上回っていない。残念ながら、チームとしては何も勝てなかった」（CaughtOffside。DAZN取材の引用）。記事は、ロッカールームでチームメイトがムバッペをからかう歌があるとも伝えるが、**ムバッペ本人は笑っていない（人権に触れる冗談）ので、その部分は使わない**。**条件：本人の言葉（クルトワ）に当たる。日本は無し**。確度：報道（二次の引用・DAZNの原文は未確認）。題6（バロンドール）と同じ週の話で、続けて出すと重なるので、どちらかを推奨。写真：コモンズにクルトワ48件ほど。時刻：18時以降。試験：Y。"
  src: CaughtOffside（DAZNのインタビューの引用）
  url: https://www.caughtoffside.com/2026/10/21/courtois-names-song-that-madrid-dressing-room-sing-to-tease/
  fmt: quote
  weak: true
- num: 8
  slot: 海外
  head: ブルーノ・フェルナンデス「守備のやり方はスタッフの判断だった」。キャリック監督は「走らなければ勝てない」と反論
  why: "21日、コモ4-1マンU（公式戦7試合連続未勝利）。ブルーノは試合後のインタビューで、開始2分の失点を『相手へのプレッシャーが弱かった』とし、「マンツーマンでプレスをかけず、ある程度スペースを与えて持たせるのはスタッフの判断だった」「時にはもっと勇敢に、リスクを冒して高い位置から」と話した。キャリック監督は「後半に部分的にマンツーマンでやり、そこから失点した」「どんなシステムでも走らなければ勝てない」「本当に怒っている」（フットボールチャンネル。英紙の引用）。67分の交代で首を振った、という報道もある。前節のマルティネスの首脳陣批判から続く騒ぎ。**条件：本人の言葉（ブルーノ・監督）に当たる。日本は無し**。10/21の本とは別（マンUの新しい試合）。確度：確定（発言）。主将を貶さない作りにする（発言の紹介にとどめる）。写真：コモンズにブルーノ46件ほど、キャリックも。時刻：18時以降。試験：Y。"
  src: フットボールチャンネル（英紙ガーディアンの引用）、フットマルカト
  url: https://www.footballchannel.jp/2026/10/22/post1038099/
  fmt: quote
- num: 9
  slot: 海外
  head: ニコ・パス、マンU戦で2得点1アシスト。「一生忘れない、僕のキャリアで最も美しい試合の一つ」
  why: "21日、コモ4-1マンU。パスは**開始2分に先制**、ドゥビコスの2点目をアシストし、60分手前に3点目。ほかにラモンとザークツィー（後半ATの1点）。パスは試合後スカイ・イタリアに「僕のキャリアで最も美しい試合の一つ。一生忘れない」「夢見たもの以上。コモのみんなにとって歴史的な夜」（フットボール・イタリア）。ファブレガス監督は「特別な夜だが、足を地につける。土曜にまた試合がある」「勝利をキットスタッフの一人に捧げる」。コモはCL初参戦。**条件：本人の言葉に当たる。日本は無し**（代表はアルゼンチン）。確度：確定。写真：コモンズに『Nico Paz Como 2025』など23件。時刻：18時以降。試験：Y。"
  src: フットボール・イタリア（パス・ファブレガスの会見）
  url: https://football-italia.net/nico-paz-ill-never-forget-man-united/
  fmt: quote
- num: 10
  slot: 海外
  head: ライスの終盤同点弾で、アーセナルがバイエルンと2-2。CLの連勝は14で止まる
  why: "21日、バイエルン2-2アーセナル（ESPN記事API）。25分エゼ（VARでゴール）、35分デイビス、61分ケインPK（ティンバーの腕）、82分**ライス**（ギェケレシュのパスから）。**アーセナルのリーグフェーズ連勝は14で止まる**（バイエルンに次いで歴代2位の記録）。バイエルンのノイアーとラヤが好セーブ。BBCは『What a goal, what a moment』と伝える。**条件：本人の言葉は取れていません。日本は無し**。弱い：ライス本人のコメントが未取得。確度：確定（試合結果）。写真：コモンズに『Declan Rice』は多数。10/21の本（ラヤとアルテタ）と写真が重ならないようにする。時刻：18時以降。試験：X。"
  src: ESPN（記事API、試合レポート）、フットボールチャンネル、BBC
  url: https://www.espn.com/soccer/report/_/gameId/401915312
  fmt: news
  weak: true
- num: 11
  slot: 海外
  head: サカ、バイエルン戦の開始10分で負傷交代。アルテタは「懸念している」
  why: "21日のCLバイエルン戦、8分に接触なしで太もも付近を押さえて倒れ、10分にエゼと交代（フットボールチャンネル・ESPN）。ESPNは『早い負傷で試合がやや沈んだ』。スカイ・スポーツの見出しは『Gunners 'concerned' by Saka injury, says Arteta』だが、**本文はライブブログで取れず、アルテタの言葉の全文は未確認**。診断・離脱期間も未発表。**条件：本人の言葉は無い。日本は無し**。確度：確定（負傷交代）＋未確認（程度）。次戦にどう響くかは憶測になるので書かない。**程度が分からない状態で出すと弱い**。写真：コモンズにサカ48件ほど、負傷の場面は使わない。時刻：18時以降。試験：X。"
  src: ESPN（記事API）、フットボールチャンネル、スカイ・スポーツ（見出しのみ）
  url: https://www.footballchannel.jp/2026/10/22/post1038048/
  fmt: news
  weak: true
- num: 12
  slot: 海外
  head: ケイン、バロンドール候補の一人。アーセナル相手は通算23試合で16点目
  why: "ESPN：ケインは21日のバイエルン戦で61分にPKを決め、**アーセナル戦の通算は23試合で16点目**（トッテナムの歴代最多得点者という立場）。35分のデイビスの同点弾は、**センターサークルからのスルーパスでお膳立て**。授賞式は月曜で、ケインは有力3人の一人。**条件：本人の言葉は取れていません。日本は無し**。題10・題6と重なる話。確度：確定（記録はESPNの本文）。写真：コモンズに『Harry Kane』は多数。時刻：18時以降。試験：B。弱い：既にある試合の別の見せ方。"
  src: ESPN（記事API、試合レポート）
  url: https://www.espn.com/soccer/report/_/gameId/401915312
  fmt: news
  weak: true
- num: 13
  slot: 海外
  head: インテル、バストーニが2分で2枚目の警告で退場。それでもシャフタールに1-0、キヴ監督は「苦しむ覚悟が足りなかった」
  why: "21日、サン・シーロ。66分、バストーニが2分のあいだに2枚の警告で退場（フットボール・イタリア）。それでもカルロス・アウグストがミヒタリアンのパスに抜け出して決勝点。インテルは前2戦に敗れ、昨季分を含む直近のCL8戦で7敗だった。キヴ監督は試合後スカイ・イタリアで「この1年半のCLの結果が、前半に影を落とした」「苦しむ覚悟が、以前は足りなかった」。**条件：本人の言葉（監督）に当たる。日本は無し**。確度：確定。写真：コモンズに『Alessandro Bastoni』49件ほど。退場の場面は使わない。時刻：18時以降。試験：Y。"
  src: フットボール・イタリア（試合・会見の記事2本）
  url: https://football-italia.net/chivu-inter-ready-to-suffer-and-we-lacked-that/
  fmt: quote
- num: 14
  slot: 海外
  head: ディオマンデ、ライプツィヒ戦のボレーを自分で語る。「やってみようと思った。ワンタッチ、そしてドカン」
  why: "21日、レアル4-1ライプツィヒ（43分ベルナルド・シウバ、エムバペ、ディオマンデなど）。ESPNの見出しは『古巣ライプツィヒ相手に』。マルカ：ディオマンデは今季レアルで**3ゴール（ビジャレアル・セビージャ・ライプツィヒ、全部ベルナベウ）**。「簡単そうに言うのは簡単だけど、やるのは難しい。ボールがきた」「やってみようと思った。ワンタッチで、ドカン」。日曜（25日）の初のクラシコは先発の確信を持っている。モウリーニョ監督は『ヴィニシウスが脇に追いやられた』流れ。**条件：本人の言葉に当たる。日本は無し**。確度：確定。写真：コモンズに『Yan Diomande』12件（コートジボワール代表）。時刻：18時以降。試験：Y。"
