  why: "アスレティックのインタビュー（サッカーキング・スカイ・スポーツ）。2022年10月のトッテナム戦で途中出場を拒んだロナウドを、次のチェルシー戦で外した件。テン・ハフ（現トゥエンテのテクニカルディレクター）は「彼はチームを失望させ、私も失望させた。我々は彼を組み込んだ計画を立てていた」「監督としては合理的な決断をしなければならなかった」「実際には、彼はプレッシングができなかった。持っていてもいなくても走らなかった」「他の選手に『練習では足を温存しろ』と言っていた」。メイヌーは『特別な選手』と評価。**条件：本人の言葉に当たる。日本は無し**。ロナウドは30日の出場停止処分を受けたばかり（ガーディアン）で、時機が重なる。**ロナウドは今はサウジ（7リーグ外）。話題は昔のマンU時代なので入れたが、リーグ外なら外してください**。確度：確定（インタビュー）。本人を貶す作りにしない（発言の紹介にとどめる）。写真：コモンズにテン・ハフ24件ほど、ロナウドも多数。時刻：18時以降。試験：Y。"
