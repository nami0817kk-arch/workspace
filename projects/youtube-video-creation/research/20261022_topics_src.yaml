  why: "20日のCL、リバプール4-3ビジャレアルで2得点。試合後Amazon Primeで「去年は全員にとって本当に難しい年だった。自分もレベルに達していなかったのは明らか。真っ先に認める」「チームの中で何かがおかしかった。この監督がそれを変えてくれた」。守備はスロット時代のゾーンから**マンツーマン中心**に変わったと説明し、「考えることは減ったが、走る量は増えたかもしれない」。エングモアは「素晴らしかった。彼が違いを生んだ」（フットボールチャンネル、ESPN引用）。**条件：本人の言葉に当たる。日本は遠藤航の所属クラブというだけで弱い**。10/21の本（エングモアのCL最年少アシスト）と同じ試合だが、マック・アリスターの言葉は新しい。確度：確定。写真：コモンズに『Alexis Mac Allister』30件ほど。時刻：18時以降。試験：Y。"
