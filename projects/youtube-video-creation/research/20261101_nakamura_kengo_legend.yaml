      - '27'
      - '1'
    - - W杯 2010
      - '1'
      - '0'
    source: Wikipedia・川崎フロンターレ公式
    highlight_row: 0
  say:
  - text: 最後に、中村憲剛の数字を並べます。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 代表の最初の4年、2006年から2009年は、1年あたり、10試合ほど。
    card: {<<: *viewcard, highlight_row: 0}
  - text: 2010年から2013年は、1年あたり、7試合ほどになります。
    card: {<<: *viewcard, highlight_row: 1}
    mark:
      kind: circle
      row: 1
      col: 試合
  - text: 出場の数は、25歳で入った最初の4年にいちばん積み上がっています。
    card: {<<: *viewcard, highlight_row: 1}
    emph: true
  - text: 一方、ワールドカップは2010年の1試合。81分から立った、およそ39分間です。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *viewcard, highlight_row: 2}
  - text: その中の1本のクロスを、本人は後のインタビューでも語っています。
    card: none
  - text: 試合数と、心に残る時間の長さは、同じではない。
    card: none
    emph: true
  - text: 呼ばれて立った側から、選手を送り出す側へ。それが、いまの中村憲剛です。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: none
