# 中村憲剛（元日本代表MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-01。型は 10/29 の阿部勇樹と同じ8節。
# **情報の時点は 2026-10-30。**（公開は 11/1。年齢は書かない。10/31 に誕生日を迎えるため）
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は川崎フロンターレ公式（引退のお知らせ）・JFA・英語版/日本語版 Wikipedia・ゲキサカ・Sportiva だけ。
# **私生活（家族・息子）は入れない。女子サッカーは入れない**。Jリーグは経歴の事実だけで、サムネの主役にしない。
#
# **題材を選んだ理由**：直近30日に未出の大物（10/18〜10/29 のレジェンド国内は 中田・長谷部・俊輔・内田・川口・小野・稲本・遠藤・大久保・岡崎・松井・阿部・宮本）。
#   中村憲剛は 日本代表68試合・2010年W杯の81分の出番・引退会見・2026年7月のヘッドコーチ就任 と、話の柱が全部一次情報で確かめられる。
#   候補から外したもの：中澤佑二（110試合の大物で引退も確認済みだが、Commons の写真が小さい/ウォーターマーク付きで、全面写真のサムネが組めない）、川島永嗣（2026年も磐田と契約更新で現役）、本田・香川・長友（現役または引退未確認）。
# **重なりの確認（2026-10-31）**：scripts/・research/covered.yaml・research/posted.json を「中村憲剛」「憲剛」で grep → 阿部勇樹の台本が「中村憲剛と交代」と1か所書いているだけ。本が重なるのは W杯パラグアイ戦だけなので、
#   こちらは「憲剛の側から見た81分」に絞り、阿部の台本と同じ言い回しを使わない。
# **引退の確認**：川崎フロンターレ公式「中村憲剛選手 現役引退のお知らせ」（2020-11-01）と特設サイト「2003-2020 中村憲剛選手引退」。11/1 15時のオンライン会見。→ **現役ではない**。
# **いまの立場**：ゲキサカ 2026-01-04「デベロップメントコーチ就任」、ゲキサカ 2026-07-02「ヘッドコーチに就任」（長谷部茂利監督体制の3シーズン目）。**川崎フロンターレ公式ページには辿れなかった**（報道2社＋Wikipedia 日本語版が一致）。
# **日本との接点**：全体が日本代表・W杯の話。
#
# **数字の出どころ**
# - 生年月日 1980-10-31・東京都小平市・背番号14・MF・175cm/66kg（川崎公式）。
# - 日本代表 68試合6得点（2006〜2013）：川崎公式の「日本代表通算」＝68試合／6得点。年別は 英語版/日本語版 Wikipedia
#   2006=3(1) 2007=13(0) 2008=13(2) 2009=12(2) 2010=11(0) 2011=4(1) 2012=7(0) 2013=5(0)。区切りは自分で足した：
#   2006〜2009 = 41試合5得点、2010〜2013 = 27試合1得点、2011〜2013 = 16試合1得点。
# - デビュー 2006-10-04 ガーナ戦（途中出場。日本語版・複数媒体）→ 生年月日から **25歳**（誕生日は10/31）。初ゴール 2006-10-11 インド戦（アジアカップ予選・3-0）。得点の分数は資料で食い違う（81分／後半37分）ので言わない。
# - 2010年W杯：JFA「ワールドカップヒストリー第14回」＝2010-06-29 プレトリア・パラグアイ戦 0-0（PK 3-5）、**81分 阿部勇樹→中村憲剛（今大会初めて起用）**、65分 松井大輔→岡崎慎司、106分 大久保嘉人→玉田圭司。
#   出場は 81分〜120分＝**およそ39分間**（自分で引いた）。グループリーグ3戦は出番なし（Sportiva 2023-12-20）。29歳（誕生日から計算）。
# - 川崎公式：J1通算463試合74得点・J2通算75試合9得点（2020-11-01現在）、J1優勝2017・2018、J2優勝2004、Jリーグ最優秀選手賞2016。英語版：リーグ戦通算 546試合83得点（2003〜2020）。日本語版：2016年は歴代最年長の36歳での受賞。
#   2003年にテスト生として参加→正式入団（日本語版・ゲキサカ）。18年間川崎ひと筋（ゲキサカ 2026-01-04）。
# - 本人の言葉：Sportiva 2023-12-20（取材・文 佐藤俊）。「これならやれる」／「自分が決める」「チームを助けたいという気持ちが強かったんで、ワクワクしかなかった」／
#   延長後半の玉田のクロスに飛び込んだ場面「今でも、ボールが目の前を通り過ぎていくのを思い出します」／「ここで終わりかぁ」。
#   引退会見（川崎公式の特設サイトが引く）「私、川崎フロンターレ中村憲剛は、今季限りで引退することを発表します」。
#   2026-01 の就任コメント（ゲキサカが引くクラブ発表）「そのすべてをこれからのフロンターレのために発揮できたらと思っています」。
# - 引退：10/31 FC東京戦で40歳の誕生日を自ら祝うゴール（川崎公式の特設サイト）→ 翌11/1 15時に会見。引退後：FRO（2021〜）・JFAロールモデルコーチ・中央大テクニカルアドバイザー（ゲキサカ）。
#
# **入れなかったもの**：家族・息子、延長前半のミドルシュート（媒体1つだけ）、2007年アジアカップの出場数（確かめきれず）、2014年W杯の選外の理由、引退試合の詳細、
#   2020年のJ1優勝（川崎公式の表は 11/1 時点）、Jリーグの連続記録。
# **写真**：assets/images/20261101_nakamura_kengo_legend/ — 02 = ゲキサカ 2026-01-04 の記事の主写真（DAZN の解説の場面、撮影 Koki Nagahama/GEKISAKA、2560x1920。左下に撮影者名が焼き込まれているので 16:9 切り出しで外す）、
#   04 = J.LEAGUE（川崎14番、640x426、小さい）、06 = Commons「Nakamura Kengo.jpg」（2016年4月、CC BY-SA 4.0、Whispered11）、07 = Commons「Kengo Nakamura.jpg」（2010年9月、CC BY-SA 2.0、TAKA@P.P.R.S、431x828）、
#   08 = Commons「Japan national team anthem vs Paraguay.jpg」（2008年5月、CC BY-SA 2.0、Kennosuke Yamaguchi、日本代表の場面。人物は特定しない）、01 = Commons Flickr tpower1978（2009年・仰向けで頭を抱える。顔が半分隠れるため使わない）。
#   W杯の写真は使えるものが無い（行で「その試合の写真」と言わない）。代理店の写真は無し。
