- id: view
  heading: 中村憲剛の68試合は、いつ、どれだけ積み上がったのか
  tier: 背景
  telop: 代表68試合と、本番の81分
  viewpoint: true
  card: &viewcard
    type: table
    title: 中村憲剛の数字を並べる
    columns:
