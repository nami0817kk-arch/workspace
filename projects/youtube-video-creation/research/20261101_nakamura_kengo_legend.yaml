  - text: 名前を呼ばれて、ピッチに出たときの気持ちも、話しています。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - voice: 中村憲剛
    text: 自分が決める、チームを助けたいという気持ちが強かったんで、
    card: none
  - voice: 中村憲剛
    text: ワクワクしかなかった。
    card: none
    cont: true
  - text: 敗れた瞬間、そのチームは解散になる。二度と、このメンバーでは戦えません。
    card: none
    emph: true
  - voice: 中村憲剛
    text: ここで終わりかぁと思うと、悲しかった。
    card: none
  - text: 日本に戻って、試合の映像を何度も見返した中村憲剛。
    card: {<<: *secretcard, highlight_row: 2}
  - text: 浮かぶのは、延長後半の、あの1本でした。
    card: none
  - voice: 中村憲剛
    text: 今でも、ボールが目の前を通り過ぎていくのを思い出します。
    card: none
