- id: after
  heading: 引退した中村憲剛は、いま、どこで何をしているのか
  tier: 報道
  telop: 引退会見から、ヘッドコーチへ
  card: &aftercard
    type: table
    title: 引退と、そのあと
    columns:
    - いつ
    - 何があったか
    rows:
    - - 2020年11月1日
      - オンライン会見で引退を発表
    - - 2021年〜
      - クラブの役職、日本協会のコーチなど
    - - 2026年1月
      - 川崎のデベロップメントコーチに
    - - 2026年7月
      - 川崎のヘッドコーチに
    highlight_row: 0
  say:
  - text: 2020年10月31日、40歳の誕生日。FC東京戦で、ゴールを決めました。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: 翌11月1日の午後3時。オンライン会見に現れた中村憲剛は、こう切り出しました。
    card: none
  - voice: 中村憲剛
    text: 私、川崎フロンターレ中村憲剛は、
    card: none
  - voice: 中村憲剛
    text: 今季限りで引退することを発表します。
    card: none
    cont: true
  - text: 川崎ひと筋、18年。ユニフォームを替えない選手人生でした。
    card: none
    emph: true
  - text: 引退を発表した2020年、川崎は史上最速でJ1を制しました。
    card: none
  - text: 2024年12月14日には、等々力で引退試合が開かれました。
    image: assets/images/20261101_nakamura_kengo_legend/12_w.jpg
    card: none
  - text: 集まったのは、2万2014人です。
    image: assets/images/20261101_nakamura_kengo_legend/13_w.jpg
    card: none
    emph: true
  - text: その売り上げの一部から、1000万円を川崎市サッカー協会に寄付しました。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: none
  - text: 引退後は、クラブの役職や日本サッカー協会のコーチなど、いくつもの顔で活動します。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *aftercard, highlight_row: 1}
  - text: 2026年1月、トップチームのデベロップメントコーチに。
    card: {<<: *aftercard, highlight_row: 2}
  - text: 選手の技術やメンタルの育成を、受け持つ役目です。
    card: none
  - text: そして7月2日、長谷部茂利監督を支えるヘッドコーチに就任しました。
    card: {<<: *aftercard, highlight_row: 3}
    emph: true
  - voice: 中村憲剛
    text: そのすべてをこれからのフロンターレのために、
    card: none
  - voice: 中村憲剛
    text: 発揮できたらと思っています。
    card: none
    cont: true
  - text: ここまでは、2026年10月30日時点の情報です。
    card: none
