  say:
  - text: 中村憲剛の代表歴は、25歳で始まります。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *jpncard, highlight_row: 3}
  - text: デビューは2006年10月4日。オシム監督の下、ガーナ戦の途中出場でした。
    card: none
  - text: 1週間後のインド戦で、代表初ゴール。後半、強烈なミドルシュートでした。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: none
    emph: true
  - text: 最初の4年間、2006年から2009年で、41試合5得点。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 代表での6得点のうち、5つは、この時期に取っています。
    card: {<<: *jpncard, highlight_row: 0}
  - text: そして2010年。ワールドカップの年の出場は、11試合です。
    card: {<<: *jpncard, highlight_row: 1}
    emph: true
  - text: ただ、ワールドカップの本番でピッチに立つのは、1試合です。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: none
