  say:
  - text: 中村憲剛は、中央大学を出て、2003年に川崎フロンターレへ入ります。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *careercard, highlight_row: 0}
  - text: テスト生として練習に参加した末に入団。当時の川崎は、Jリーグの2部、J2です。
    card: none
  - text: 入団2年目の2004年に、J2で優勝。チームはJ1へ上がります。
    card: {<<: *careercard, highlight_row: 1}
    emph: true
  - text: そして2年後、日本代表に初めて選ばれました。
    card: {<<: *careercard, highlight_row: 2}
  - text: 2016年には、Jリーグの最優秀選手に。36歳での受賞は、歴代で最年長です。
    image: assets/images/20261101_nakamura_kengo_legend/02_w.jpg
    card: {<<: *careercard, highlight_row: 3}
  - text: 川崎は2017年、2018年と、J1を連続で制しました。
    card: {<<: *careercard, highlight_row: 4}
  - text: リーグ戦は2003年から2020年まで、546試合で83得点。
    card: none
  - text: 18年間、ずっと川崎のユニフォームでした。
    card: none
    emph: true
  quotes_from: []
  sources:
