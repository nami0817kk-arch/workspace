    - - 変えたもの
      - 黒いパンツ
  say:
  - 1925年に始まったシーズン、パンツを**黒**に変えました。
  - 手本は、イングランドの名門アマチュアクラブ、コリンシアンです。
  - text: ところが国王杯で、バルセロナに**1対5**と**0対3**で負けました。
    card:
      type: table
      title: 1925年から26年のシーズン
      columns: *id001
      rows:
      - - 国王杯
        - バルセロナに1対5と0対3
  - 会長は「縁起が悪い」と怒り、白に戻させました。
  sources:
  - https://es.wikipedia.org/wiki/Real_Madrid_Club_de_F%C3%BAtbol
  - https://en.wikipedia.org/wiki/Real_Madrid_CF
  bg: assets/backgrounds/stadium_レアルマドリード_in.png
  official: false
- id: kit2
  heading: 白をまねたリーズ
  tier: 背景
  telop: 今度は、イングランドのクラブが白をまねた
  narrator: 解説
  card:
    type: table
    title: 白をまねたリーズ
    columns: &id002
    - ''
    - ''
    rows:
