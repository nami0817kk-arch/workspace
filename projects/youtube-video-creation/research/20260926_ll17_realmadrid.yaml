    - - スタンドに
      - のちのリーズ監督ドン・レヴィー
  say:
  - 逆に、白をまねたクラブもあります。
  - 1960年、ヨーロッパの決勝で、フランクフルトに**7対3**。
  - text: スタンドにいたドン・レヴィーは、翌年リーズの監督になると、青と黄色をやめます。
    card:
      type: table
      title: 白をまねたリーズ
      columns: *id002
      rows:
      - - そのあと
        - リーズは上下とも白に
  - 上下とも白に。いちばん多く勝っているクラブの色だから、という理由でした。
  sources:
