- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 無冠の翌シーズン、モウリーニョが帰ってきた
  narrator: キャスター
  say:
  - text: 無冠に終わった昨季のあと、**13年**ぶりに戻ったのがモウリーニョ監督です。
    image: assets/stats/ll_realmadrid_data_r1.png
    no_telop: true
  - voice: ジョゼ・モウリーニョ
    text: ベンフィカで、ポルトガルで幸せだった。
    image: assets/stats/ll_realmadrid_data_r2.png
  - voice: ジョゼ・モウリーニョ
    text: それでもレアル・マドリードは、レアル・マドリードだ
    image: assets/stats/ll_realmadrid_data_r2.png
  - text: そしてヨーロッパの王者を決める大会。作った一人は、当時の会長でした。
    image: assets/stats/ll_realmadrid_data_r3.png
    no_telop: true
  - image: assets/stats/ll_realmadrid_data0.png
    text: 創立は**1902年**。1920年、国王から「レアル」、つまり王立の称号を受けました。
    no_telop: true
  - image: assets/stats/ll_realmadrid_data1.png
    text: 愛称は「ロス・ブランコス」。スペイン語で、**白い人たち**という意味です。
    no_telop: true
  - image: assets/stats/ll_realmadrid_data2.png
    text: ホームタウンは首都マドリード。人口およそ**348万人**、スペインでいちばん大きな町。
    no_telop: true
  - image: assets/backgrounds/stadium_レアルマドリード.png
    text: 本拠地はベルナベウ。**8万3186人**が入り、20クラブでいちばん大きい。
  - image: assets/stats/ll_realmadrid_data4.png
    text: 会長は、2009年から2度目のフロレンティーノ・ペレス。クラブは会員が持つ形です。
    no_telop: true
  - image: assets/stats/ll_realmadrid_cups.png
    text: 1部の優勝は最多の**36回**。国王杯は**20回**、スーペルコパは**13回**。
    no_telop: true
  - image: assets/stats/ll_realmadrid_data6.png
    text: 最多出場はラウル・ゴンサレス。1994年から2010年までに、**741試合**です。
    no_telop: true
  - image: assets/stats/ll_realmadrid_data7.png
    text: 直近のタイトルは2024年12月のインターコンチネンタルカップ。パチューカに**3対0**の勝ち。
    no_telop: true
  - image: assets/stats/ll_realmadrid_data8.png
    text: 昨季のリーグ戦は**2位**。優勝したバルセロナに、勝ち点**8**届きませんでした。
    no_telop: true
