      - 借金2億7000万ユーロを返す
  say:
  - 2000年、会長選挙に勝ったペレスの公約は、バルセロナのフィーゴを獲ることでした。
  - さらに練習場を売って、**2億7000万ユーロ**の借金を返します。
  - そこから毎年の夏、世界的なスターを1人ずつ。ベッカムもその1人です。
  sources:
  - https://en.wikipedia.org/wiki/Real_Madrid_CF
  - https://en.wikipedia.org/wiki/Florentino_P%C3%A9rez
  bg: assets/backgrounds/stadium_レアルマドリード_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 速く攻める。稼いで戦う。世界中にファン
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 守って速く攻める
    - - 運営の型
      - 売上10億ユーロ超
    - - クラブの気質
      - 92か国に公認ファン
  say:
  - text: モウリーニョのチームは、守ってから速く攻める。リーグ戦7試合で**18得点**です。
    image: assets/photos/ll/realmadrid/realmadrid_manager_56b64b8a.jpg
  - ピッチの外は、稼いだぶんで戦う型。
  - 2023年から24年のシーズン、サッカークラブで初めて、売上が**10億ユーロ**を超えました。
  - 応援は世界規模。公認のファンクラブ「ペーニャ」は、**92か国**に2452あります。
  sources:
  - https://en.wikipedia.org/wiki/Real_Madrid_CF
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Mourinho
  - https://en.wikipedia.org/wiki/Template:2026%E2%80%9327_La_Liga_table
  - https://es.wikipedia.org/wiki/Real_Madrid_Club_de_F%C3%BAtbol
  bg: assets/backgrounds/stadium_レアルマドリード_in.png
  official: false
