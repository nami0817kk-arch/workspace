- id: galacticos
  heading: 毎年、1人のスター
  tier: 背景
  telop: 練習場を売って、毎年スターを買った
  narrator: 解説
  card:
    type: table
    title: 毎年、1人のスター
    columns:
    - ''
    - ''
    rows:
    - - 2000年
      - ペレスが会長に
    - - 公約
      - バルセロナのフィーゴを獲る
