      - ヤマルは、まずこう切り出しました。
      - {voice: ヤマル, text: 世界最高の選手は、おそらく2人だと思う}
      - そして、その2人を名指しします。
      - {voice: ヤマル, text: 今年は僕が勝ち取ったものを考えれば、僕が受賞に値すると思う}
      - {voice: ヤマル, text: 僕にとって、世界最高の選手は自分とエムバペだ}
      - ただし、自己評価は手放しではありません。
      - {voice: ヤマル, text: 自分自身については満足していなかった}
      - {voice: ヤマル, text: 僕にはまだやるべきことが1000個ある}
      - 18歳の言葉です。
    official: false
