- id: cup1901
  heading: リーグに入らないまま、FAカップを獲った
  tier: 背景
  telop: 1901年。これ以降、同じ例はない
  narrator: 解説
  card:
    type: table
    title: 最初に立てた記録
    columns:
    - ''
    - ''
    rows:
    - - 1901年
      - リーグ外のクラブとしてFAカップ優勝
    - - 以降
      - 同じ例は1つもない
    - - 1961年
      - 20世紀で最初の2冠
    - - 1963年
      - カップウィナーズカップ。英国勢で初
    - - 1972年
      - UEFAカップ。2種類目も英国勢で初
  say:
  - 1901年、**リーグに属していないまま**FAカップを獲りました。
  - 1888年にフットボールリーグができて以降、**リーグ外のクラブが優勝したのは、これだけ**です。125年経っても、並ぶ例がありません。
  - 1961年には、リーグとカップの両方を獲りました。**20世紀で最初の2冠**です。
  - '**イギリスのクラブで、ヨーロッパのタイトルを最初に獲ったのもトッテナム**でした。1963年のカップウィナーズカップです。'
  - 1972年にはUEFAカップも獲りました。種類の違うヨーロッパのタイトルを2つ獲ったのも、イギリス勢では最初でした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
