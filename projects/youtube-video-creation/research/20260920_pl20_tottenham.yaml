  say:
  - short_only: true
    text: 高井幸大の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_tottenham_data0.png
    text: 創立は**1882年**。ホットスパーという名前で始まりました。
    no_telop: true
  - image: assets/backgrounds/stadium_トッテナム_in.png
    text: 本拠地のスタジアムには、**6万2850人**が入ります。
  - image: assets/stats/pl_tottenham_map.png
    text: ホームタウンはロンドン（トッテナム）。北ロンドンです。
    no_telop: true
  - image: assets/stats/pl_tottenham_data3.png
    text: オーナーはイーニックグループ。2001年からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_tottenham_cups.png
    text: 1部リーグの優勝は**2回**。FAカップは8回、リーグカップ4回、ヨーロッパのタイトルもあります。
    no_telop: true
  - image: assets/stats/pl_tottenham_data5.png
    text: 直近のタイトルは、2024年から25年のヨーロッパリーグです。
    no_telop: true
  - image: assets/stats/pl_tottenham_last.png
    text: プレミアでの最高位は、2016年から17年の**2位**です。
    no_telop: true
  - image: assets/stats/pl_tottenham_data8.png
    text: 愛称は「スパーズ」。「リリーホワイツ」とも呼ばれます。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
