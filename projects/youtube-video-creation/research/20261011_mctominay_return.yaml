  question: 心臓の処置を受けたマクトミネイは、どんな段取りでピッチまで戻ってきたのか
  takeaway: ナポリのスコット・マクトミネイが、10月10日のフロジノーネ戦で61分から出場した。心臓の処置を受けたのは9月8日、マンチェスターのスパイア病院で、クラブの発表文によれば「軽度の良性の不整脈」に対するアブレーション。処置から32日後の出場になる。クラブが書いた休養は「約2週間」で、残りの18日は個別の調整と検査にあてられた。10月7日の発表文で追加の診断検査を行い、競技活動への適性が確認されている。本人がこの間に残した言葉はインスタグラムの一つだけで、処置が決まった日に「またすぐ会おう、ナポリ。長くはかからない」と書いていた。出場してから13分後の74分、エリアの外から打ったシュートは相手のゴールキーパーがコーナーに逃げている
  opening_image: assets/images/20261011_mctominay_return/04.jpg
