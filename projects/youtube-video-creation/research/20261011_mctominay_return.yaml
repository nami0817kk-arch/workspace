# 取材メモ（10/11 題材 mctominay_return、型は news、その他枠）。材料の控えは research/raw/20261011_mctominay_return_material.md。
# **本編とショートの両方を作る**（ユーザー指示）。
# **病気の話なので煽らない。**「衝撃」「まさか」「奇跡」「異例の早さ」は書かない。
#   早いかどうかを比べる材料をこちらは持っていないので、**日付と週数と出場時間だけ**で組む。
# **病名は一次情報の言葉をそのまま使う。**題材の一覧には「良性の心房細動」と書いたが、
#   ナポリ公式の発表文は「lieve aritmia benigna ＝ **軽度の良性の不整脈**」で、
#   **心房細動（fibrillazione atriale）という語はどこにも無い**（材料 0）。
#   台本では「軽度の良性の不整脈」で通し、**「心房細動」とは言わない**。
#   処置は「アブレーション（PFA）」。英語版の発表文が「the operation was a complete success」なので、
#   そこだけ「手術は完全に成功した」と訳した。
# **ナポリ公式の発表文は3本とも原文に当たった**（9/1 のノータ・メディカ、9/8 の医療アップデート、
#   10/7 の練習レポート）。伊・英の両方を突き合わせてある。出場の61分はクラブの試合記録（確定）。
# 本人の言葉は**インスタグラムの1つだけ**（材料 3）。試合後のコメントはどこにも無かった。
#   当たったのは ナポリ公式・Sky Sport Italia・football-italia・Reuters・PA・theScore。
# **山場（②）に板を入れてある**（10/10 に5本踏んだ「発言の行に板が1枚も付かない」対策）。
#   行ごとに表を分けて highlight_row を 0→1→2→3 と動かし、**いちばん強い1行（本人のインスタの言葉）
#   だけ card: none で板を外して顔だけ**にする。`card:` を消すだけでは板が引き継がれるので、必ず none と書く。
# 数字の重なり対策：『32日』『14日』『18日』は④だけ。『41日』と見送った4試合は③だけ。
#   『61分』は①と④、『74分』は①だけ。
# 写真は**ナポリ公式が自分のサイトに載せた写真だけ**。代理店（Getty・AFLO・AFP・ロイター・IMAGO・AP・PA・EPA・共同）は1枚も取り込んでいない。
#   04＝10/7 の練習レポートの写真（2560x2048）の右半分を 16:9 に切り出したもの（1410x793）。04_v は 9:16（900x1600）。
#   03＝10/10 の試合記録のマラドーナの全景。01（Commons、2021年のマンチェスター・ユナイテッド時代）は所属が違うので使わない。
# サムネ：構図 face（点検を通すために1案だけ書いた。**決めるのはユーザー**。案は報告に3つ出す）。
# ネットの反応は集めていない（この題材は反応なしで出す）。
