sections:
  - id: what
    main: true
    heading: 授賞式を前に
    tier: 報道
    telop: バロンドール授賞式は26日、ロンドン
    say:
      - text: バロンドールの授賞式は、26日の月曜、ロンドンで開かれます。
        main_only: true
        image: assets/images/20261022_ballondor_three/02_w.jpg
      - text: 有力候補は、ヤマル、ケイン、ムバッペ。
        main_only: true
        image: assets/images/20261022_ballondor_three/03_w.jpg
      - text: 近年で最も混戦だと、イーエスピーエヌは伝えています。
        main_only: true
        image: assets/images/20261022_ballondor_three/05_w.jpg
      - text: 投票は9月28日に締め切られ、受賞者はまだ発表されていません。
        main_only: true
        image: assets/images/20261022_ballondor_three/02_w.jpg
      - text: ムバッペは、フランス・フットボール誌にこう話しました。
        main_only: true
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - text: 26日のバロンドール授賞式を前に、有力候補のムバッペが語りました。
        short_only: true
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - voice: ムバッペ
        text: バロンドールは、普通の選手には与えません。
        short_voice: true
        image: assets/images/20261022_ballondor_three/04_w.jpg
      - voice: ムバッペ
        text: 違う選手に与えるものです。
        cont: true
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - voice: ムバッペ
        text: 今年の僕は、違うことをしたと思います。
        cont: true
        image: assets/images/20261022_ballondor_three/04_w.jpg
      - voice: ムバッペ
        text: だから、自分にも取れると信じています。
        cont: true
        image: assets/images/20261022_ballondor_three/01_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50229304/ballon-dor-industry-harry-kane-lamine-yamal-kylian-mbappe
      - https://en.wikipedia.org/wiki/2026_Ballon_d%27Or

  - id: words
    heading: ケインとヤマルは何と答えたか
    tier: 報道
    telop: ケインとヤマルも、投票の前に語っていた
    say:
      - text: ケインとヤマルも、投票の前に、取材で受賞への思いを語っていました。
        image: assets/images/20261022_ballondor_three/06_w.jpg
      - voice: ケイン
        text: 昨季は、個人としても、
        image: assets/images/20261022_ballondor_three/02_w.jpg
      - voice: ケイン
        text: チームとしても、素晴らしいシーズンでした。
        cont: true
        image: assets/images/20261022_ballondor_three/05_w.jpg
      - voice: ケイン
        text: 73ゴールで終えたのは、歴代2位の数字です。
        cont: true
        image: assets/images/20261022_ballondor_three/02_w.jpg
      - voice: ケイン
        text: それが、すべてを物語っています。
        cont: true
        image: assets/images/20261022_ballondor_three/05_w.jpg
      - voice: ヤマル
        text: 僕は、世界最高の選手に与えるべきだと思います。
        image: assets/images/20261022_ballondor_three/03_w.jpg
      - voice: ヤマル
        text: 僕とムバッペが世界一だと、はっきり思っています。
        cont: true
        image: assets/images/20261022_ballondor_three/06_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50229304/ballon-dor-industry-harry-kane-lamine-yamal-kylian-mbappe

  - id: view
    viewpoint: true
    heading: 三人の強みは何が違うか
    tier: 背景
    telop: 優勝の数とW杯の得点で、三人の強みが分かれる
    say:
      - text: 見立てです。三人の強みを、並べて見ます。
        card: none
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - text: ムバッペは、W杯得点王の10得点です。大会の通算得点でも、歴代最多になりました。
        image: assets/images/20261022_ballondor_three/04_w.jpg
      - text: ただ、レアルでも代表でも、優勝には届いていません。
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - text: ヤマルは、リーガを制し、W杯でも優勝しました。
        image: assets/images/20261022_ballondor_three/03_w.jpg
      - text: 受賞すれば19歳で、最年少の受賞者になります。
        image: assets/images/20261022_ballondor_three/06_w.jpg
      - text: ケインは、バイエルンでリーグと国内カップの二冠です。
        image: assets/images/20261022_ballondor_three/02_w.jpg
      - text: 本人は昨季、73得点を挙げたと話しています。
        image: assets/images/20261022_ballondor_three/05_w.jpg
      - text: 挙げられた優勝は、ヤマルが2つ、ケインが2つ、ムバッペは0です。
        image: assets/images/20261022_ballondor_three/04_w.jpg
      - text: 一方、W杯の得点では、ムバッペが10得点です。
        image: assets/images/20261022_ballondor_three/01_w.jpg
      - text: 投票するのは、フィファランキング上位100か国の記者たち。
        image: assets/images/20261022_ballondor_three/03_w.jpg
      - text: 1か国から1人ずつ、それぞれが10人を選びます。
        image: assets/images/20261022_ballondor_three/06_w.jpg
      - text: 結果は、26日に発表されます。
        image: assets/images/20261022_ballondor_three/02_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50229304/ballon-dor-industry-harry-kane-lamine-yamal-kylian-mbappe
