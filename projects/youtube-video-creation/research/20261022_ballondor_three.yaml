# 取材メモ（2026年10月22日）バロンドール授賞式は26日（月）ロンドン。ヤマル・ケイン・ムバッペ（ニュースのショート。見せ方 Y＝ムバッペの実在の発言から始める）
# 予想は書かない（受賞者は未発表）。三人とも本人の言葉の原文（英語）を訳した。言い換えない。
# 取材: 2026-10-22。ESPN 記事API（now.core.api.espn.com/v1/sports/news/50229304）で本文を全部読んだ。控え research/raw/20261022_ballondor_espn_story.txt。
#   ・ESPN（Mark Ogden、10/21）「What it takes to win a Ballon d'Or: Trophies, goals and playing the PR game」
#       授賞式は「ロンドン・パラディアムで月曜」。有力候補は『Yamal, Kane and Mbappé』。投票は 9/28 に締め切り済み。
#       投票は『FIFA ランキング上位100の国の記者が1人ずつ、トップ10を選ぶ』。受賞なら19歳のヤマルが最年少。
#       ヤマルは『LaLiga を制し、W杯を掲げた』。ムバッペは『W杯得点王（10得点）で大会の通算得点の歴代最多になったが、レアルでも代表でもタイトルなし』。
#       ケインは『バイエルンでリーグと国内カップの二冠。イングランドはW杯で優勝できなかった』。
#   ・Wikipedia「2026 Ballon d'Or」— 授賞式は 2026-10-26、ロンドン。対象期間は 2025-08-03〜2026-07-19（日程だけ突き合わせた）。
# 発言（ESPN が引いた英語の原文を訳した）:
#   ムバッペ（フランス・フットボール誌）: "You don't give [Ballon d'Or] to ordinary players. You give it to players who are different. I think I did things that were different this year, so I believe I can win it."
#   ケイン（マルカ）: "...last season was incredible, on a personal level and as a team. It's true that to finish on 73 goals [last season], the second-highest tally in history, speaks for itself."
#       → 73得点・歴代2位は本人の言葉。出典の文は数字を確かめていない。台本では『本人は〜と話しました』の形にし、事実として言い切らない。
#   ヤマル（モビスター）: "I would give it to the best player in the world. ... For me, Mbappé and I are the best in the world. It is clear to me."
# 確度: 日程・場所・候補・投票方式は 報道（ESPN、日程は Wikipedia と一致）。発言は 報道（媒体が引いたもの。元の雑誌・新聞は読めていない）。見立ての節は 背景。
# 使わなかったもの: 前回受賞者の側近の『見苦しくなってきた』（匿名・人を小さく見せる言い方）。クヴァラツヘリアの欠場の見通し（フットマルカトの本文は読めていない）。
#   ヤマルのW杯の得点数（1得点0アシスト）・ケインのW杯での得点が途絶えた話は、選手を小さく見せる言い方になるので入れない。
# 9/23『ヤマル「バロンドールはゴールの数とは関係ない」』・9/30『ヤマル2発1アシスト。バロンドールを聞かれて…』とは別の話（授賞式の直前・三人それぞれの発言）。
#   9/23 の本で使ったムバッペの『受賞できなければ残念』とは別の発言（今回は『普通の選手には与えない』）。
# 反応: 取らない。ネットの反応は集めていない（作らない）。approve は --no-voices で。
# 写真: Commons（CC BY-SA 4.0、Bryan Berlin 撮影のW杯2026の写真）。ムバッペ・ケイン・ヤマル各2〜3枚。10/16〜10/22 の他の本と重ならない写真を選んだ。
