  - id: sesko
    heading: 変わったのは、前線に誰が立つか
    tier: 報道
    telop: 3月以来の先発
    narrator: 解説
    card:
      type: bars
      title: シェシュコの直近
      items:
        - {label: "直近21試合の得点", value: 12}
        - {label: "2試合連続で得点", value: 2}
      unit: 点
    say:
      - いちばん大きな収穫は、ベンヤミン・シェシュコが先発するとチームが機能する、という点でした。
      - 23歳の先発は3月のリヴァプール戦以来。すねの故障で限界を認めていました。
      - 身長196センチ。相手の最終ラインを押し下げ、簡単には奪われません。
      - この日は飛び出したGKからボールを動かし、無人のゴールへ流し込みました。
      - {voice: シェシュコ, text: もちろん、自分のゴールは嬉しい}
      - {voice: シェシュコ, text: 相手が飛び出してくるのが見えた}
      - {voice: シェシュコ, text: ボールを奪って、少し簡単にできる場面だった}
      - マイケル・キャリック監督も、この選手について聞かれています。
      - {voice: キャリック監督, text: 彼は間違いなく、違う種類の脅威をもたらす}
      - {voice: キャリック監督, text: そこが良いところなんだ}
      - {voice: キャリック監督, text: ベンが何をもたらすかは、我々が分かっている}
      - 直近21試合で12得点。2試合連続のゴールです。
    official: false
    sources:
      - https://www.bbc.co.uk/sport/football/articles/c770d63d850o
      - https://www.footballchannel.jp/2026/09/11/post1008759/

  - id: derby
    heading: 監督が抱えた、日曜までの宿題
    tier: 報道
    # 答えを出す節。ショートはここを選ぶ（1行目から監督の言葉が出る）
    main: true
    telop: 日曜はオールド・トラフォードでマンC戦
    narrator: 解説
    say:
      - キャリック監督は、この選手についてこう続けています。
      - {voice: キャリック監督, text: ベンがくれるものは、我々が分かっている}
      - {voice: キャリック監督, text: 体つき、当たりの強さ、最終ラインでの駆け引き}
      - {voice: キャリック監督, text: 裏へ抜け出す速さ。あれを持っている選手は多くない}
      - 復帰そのものについても、言葉を選んでいます。
      - {voice: キャリック監督, text: コンディションを戻す作業をしてきた}
      - {voice: キャリック監督, text: このレベルに戻ってきてくれたのは素晴らしい}
      - {voice: キャリック監督, text: 2試合で2得点、良い内容、良い出場時間}
      - {voice: キャリック監督, text: ここまでの歩みには本当に満足している}
      - {voice: キャリック監督, text: 本物の脅威だ}
      - その「ベン」が、ベンヤミン・シェシュコです。スロベニア代表の23歳、身長196センチ。
      - 3月以来の先発で、2試合連続のゴールを決めました。
    official: false
    sources:
      - https://www.bbc.co.uk/sport/football/articles/c770d63d850o
      - https://www.footballchannel.jp/2026/09/11/post1008759/

  - id: pick
    heading: 日曜のダービーで、誰を使うか
    tier: 報道
    telop: 「簡単な決断ではない」
    narrator: 解説
    say:
      - 日曜には同じ場所でマンチェスター・シティとのダービーがあります。
      - 先制点のクーニャか、出番の無かったラッシュフォードか。ラッシュフォードはバルサから戻って以降、得点もアシストもありません。
      - {voice: キャリック監督, text: 簡単な決断ではない。もちろん簡単ではない}
      - {voice: キャリック監督, text: だが、こちらのほうが望ましい}
      - {voice: キャリック監督, text: チームに得点があり、選手が良いプレーをしている状態だ}
      - {voice: キャリック監督, text: 全員が分かっている。先発のときも、締めくくる役のときもある}
      - {voice: キャリック監督, text: 全員が好調で、良い入りをしてくれたのは素晴らしい}
      - {voice: キャリック監督, text: シーズンを通して、試合ごとに違うものを求められる}
      - {voice: キャリック監督, text: そのために、こういう選択肢がグループに要る}
    official: false
    sources:
      - https://www.bbc.co.uk/sport/football/articles/c770d63d850o
      - https://www.footballchannel.jp/2026/09/11/post1008759/
