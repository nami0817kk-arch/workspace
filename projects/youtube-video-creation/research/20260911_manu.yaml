# マンUが3年ぶりのCLで4発（2026年9月11日）。ユーザー指示「その間にclの動画作ろう」
#
# **記事を2本開いて読んだ。**得点の流れはフットボールチャンネル、
# シェシュコの位置づけと発言は BBC の現地記者（オールド・トラフォード）。
#
# 引きは**「監督が『違う種類の脅威』と呼んだのは誰か」**。4-0という結果より、
# 3月以来の先発に戻った選手が何を変えたか、のほうが中身がある。
#
# **キャリックの発言は途中で切れている引用を補わない。**読めたところまでで止める
#
# **反応は入れない。**読める形のスレが無かった
