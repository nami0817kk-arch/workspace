# 小野伸二（元日本代表MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-23。型は 10/22 の川口能活と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は Jリーグ公式・日本語/英語版 Wikipedia の成績表・UEFA 大会の Wikipedia 記事・Goal と、自分で足した値だけ。
# **私生活（家族・結婚）は入れない。女子サッカーは入れない。病気・法的な問題は入れない**（引退理由は本人コメントの「足」のみ。足の怪我の詳細は入れない）。
#
# **引退の確認（一次情報）**：Jリーグ公式（jleague.jp/news/article/26131、2023-09-27 17:40）が、札幌クラブ発表として「今シーズンをもって現役引退」と掲載。Jリーグ1部206試合29得点・2部86試合9得点・日本代表56試合6得点（2023-09-27時点）。
#   最後の試合は 2023-12-03 J1最終節 浦和戦（先発、前半22分に交代。日本語・英語 Wikipedia と検索の要約で一致。クラブ公式の試合記録は未読）。→ **現役ではない**。
#   引退コメントの冒頭（本人の公式サイト由来）は Goal 記事に引用：「サッカーと出会い39年間もの間、僕の相棒として戦ってくれた“足”がそろそろ休ませてくれと言うので、今シーズンを最後に、プロサッカー選手としての歩みを止めることを決めました。」（全文は未読。台本はこの一文だけ引く）
# **いまの立場**：札幌アンバサダー「O.N.O」は 2024-01-14 就任（日本語 Wikipedia。Goal 検索結果の見出しでも確認）。2024-10-22 Jリーグ発表で ルヴァンカップ決勝アンバサダー。北海道新聞 2025-11-27 が「札幌アンバサダー」としてトークショー（11/26、北広島）を報道。
#   **2026年時点の肩書きは確認できていない**ので、台本は「そのあとは札幌のアンバサダーを務めています」（過去形に近い言い方）と表の「2025年11月時点」にとどめる。
# **日本との接点**：全体が日本代表・W杯の話（1998年W杯で18歳・日本人最年少出場、2002年日韓4試合、2006年1試合）。
#
# **数字の出どころ・食い違いと台本での扱い**
# - 通算：日本語・英語 Wikipedia の成績表が一致。浦和 79+53=132/28、フェイエノールト 112/19、ボーフム 29/0、清水 70/8、ウェスタン・シドニー 47/9、札幌 62+6=68/2、琉球 23/0、合計 481/66（自分で足して一致。Jリーグ公式の1部206・2部86 とは対象が違う）。
# - 日本代表 56試合6得点。年別：1998=3、2000=12、2001=9、2002=8、2003=5、2004=7、2005=2、2006=9、2008=1（合計56を自分で確認）。2000〜02＝29（半分強）、2003〜06＝23。
# - **W杯の試合数**：日本語 Wikipedia＝1998年1試合（ジャマイカ戦途中出場）・2002年4試合・2006年1試合（オーストラリア戦途中出場）。ただし同ページ内で2002年は「4試合」と試合一覧3試合で記述が食い違う。FBref（不使用）は4試合。台本は「4試合」を使うが、**一次資料（FIFA/JFA）では未確認**。
# - **最年少出場**：日本語 Wikipedia は「2002年W杯時18歳272日」と誤記（1998年の話）。1998-06-26（ジャマイカ戦、1979-09-27生まれ）から自分で数えると18歳272日。英語 Wikipedia は「日本人のW杯最年少出場」。台本は「18歳、最年少出場」まで。
# - **UEFAカップ**：決勝 2002-05-08 デ・カイプ、3-2（英語 Wikipedia。小野は背番号14で先発、85分に交代）。準々決勝 PSV 1-1・1-1（延長）で合計2-2、PK 5-4（英語 Wikipedia の表。**2戦目の日付は表で一括の「第2戦 3/21」**）。準決勝 インテル 1-0・2-2。小野のPK（リフティングでスポットへ）と監督・エースの発言は Goal 2017-03-10（オランダ FOX スポーツのドキュメンタリー由来）。記事には小野が何人目のキッカーかの記載なし。**台本は「リフティングで歩いて左隅に決めた」だけ言い、何人目かは言わない**。
# - 「日本人初の欧州タイトル」：英語 Wikipedia と AFC の評（検索の要約）。台本は「そう評されています」と断定を避ける。
# - スナイデル「いちばん上手い相手に小野を挙げた」：日本語 Wikipedia のみ（英語版の引用は toughest opponent と別の言い方）。**台本は直接引用せず、ぼかして言う**。「ボールと会話できる」も日本語 Wikipedia の評。
# - 1999年ワールドユース：キャプテン・準優勝・決勝は累積警告で出場停止・ベストイレブン（日本語 Wikipedia。大会の一次資料は未確認）。
# - 2021-06-09 天皇杯2回戦 ソニー仙台戦の直接FK・41歳255日の最年長ゴール（英語・日本語 Wikipedia。255日は自分で数えて一致）。
# - 本人の言葉：引退コメント（Goal 引用）のみ。北海道新聞の「楽しむ姿勢」は要約だったので引用にせず、地の文で言う。
#
# **入れなかったもの**：私生活、足の怪我の経過、2003年アヤックス戦で失神した出来事、10人兄弟など家族の話、麻雀、W杯の個別の失点場面。
# **日本語名・読みで怪しいもの**：小野伸二・沼津市・清水商業・フェイエノールト・ボーフム・ウェスタン・シドニー・琉球・ファン・マルバイク・ファン・ホーイドンク・スナイデル・デ・カイプ・北広島・O.N.O・ルヴァンカップ・ソニー仙台。
