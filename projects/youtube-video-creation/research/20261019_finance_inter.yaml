# クラブの財政：インテル（10/19 月、シリーズ「クラブの財政」、key: finance_inter、型は news）。
#
# 軸は「**収入の世界11位（インテル）と10位（チェルシー）の差は4660万ユーロ。その差は、1年でどう縮んだのか／何が残っているのか／給料を引くと誰が上か**」。
#   ・順位の差ではなく「上との差と下との差」（11位は12位ドルトムントに620万ユーロしか上でない）と、5年の差の推移（約1.6億→約0.5億）を軸にする。
#   ・収入の内訳は「インテルが1年で伸びた分（試合日・放映権・商業）」と「チェルシーとの残りの差（商業だけ）」。10/18 のチェルシーの回（トッテナムとの差・決算書の損益・人件費）の言い回しは使わない。
#   ・チェルシーの数字は**デロイトの数字だけ**（収入・内訳・給料）。チェルシーの決算書（ポンド）の損益・赤字・償却・売却益・規制の費用は言わない（10/18 の回で出した）。
#   ・インテルの数字は、デロイトとクラブ公式の発表（inter.it）。クラブ発表の収入（5億6700万ユーロ）とデロイトの収入（5億3750万ユーロ）は集計が別なので、同じ表に並べない。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差760万ユーロと給料の比率／チェルシー＝トッテナムとの差・赤字2.8倍・人件費比率73%）は繰り返さない。
#   ★アルファベットは読み上げに出さない。女子・部門名は並べない。選手名・移籍の話は言わない。
#
# **決算期**：インテル（エフ・チー・インテルナツィオナーレ・ミラノ）は**6月30日決算**。2024/25＝2025年6月期（取締役会の承認 2025-09-29、株主総会の承認 2025-10-15）。
#   2025/26＝2026年6月期（取締役会 2026-09-24、株主総会 2026-10-12。**5日前に承認されたばかり**）。デロイトの集計は2024/25（2026-01-22 公表）。
#   ・チェルシーの2026年6月期の決算書は**未提出**（Companies House の提出履歴の最新は2025年6月期。2026-10-18 に確認）。
#
# **出どころ（読んだもの）**:
#   ○ **デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com）**：ランキング 10位チェルシー・11位インテル・12位ドルトムント。クラブごとの図（ページに埋め込まれた
#       図の中身。e.infogram.com の各クラブの図を読んだ）から：
#       インテル 2025 収入 **€537.5m**（前の年 €391m、+37%、+€146.5m）／試合日・放映権・商業・給料（百万ユーロ）：2021 2・216・113・274.6／2022 44・177・87・252.9／2023 90・216・73・231／
#         2024 81・198・112・232／**2025 108・277・153・257**。DFML の順位 11位。ピッチ上：欧州チャンピオンズリーグ準優勝、セリエA 2位。
#       チェルシー 2025 収入 **€584.1m**（前の年 €545.5m、+7%、+€38.6m）／2021 9・309・176・379.7／2022 82・278・209・403.5／2023 88・206・242・465／2024 93・190・262・394／**2025 103・242・239・418**。
#         （欧州カンファレンスリーグ優勝。デロイトの注記：チェルシー女子の収入は男子と連結していない。）
#       ドルトムント 2025 収入 **€531.3m**（前の年 €531.7m）／ 11〜20位の平均 €404m、上位10の平均 €837m（本文）／ 収入は「選手・監督の移籍金、VAT などを含まない」（本文の Comparability）／
#       放映権の伸びの主な理由は拡大したクラブワールドカップ（マネー・リーグの10クラブが出場、放映権が17%増。本文）。
#   ○ **インテルのクラブ公式発表（inter.it）**：2024/25 取締役会（2025-09-29）／株主総会（2025-10-15）の発表（収入5億6700万・純利益3540万・15年ぶり・費用4億8200万・3.8%増・社債の返済と3億5000万ユーロの借り入れ・投資適格）。
#       2025/26 取締役会（2026-09-24）／株主総会（2026-10-12）の発表（収入5億1800万・純利益2270万・純資産マイナス1200万→プラス1040万・費用約2000万減・金融費用約1900万減）。いずれも日本語・英語・イタリア語版を読んだ。
#   ○ **クラブの決算の内訳（報道：QuiFinanza 2025-10-16・Calcio e Finanza 2025-11-14・2026年版）**：2024/25 の内訳（テレビ 264.0／試合日 98.8／商業 142.3／選手売買 21.5／その他 39.9、合計 566.5）、人件費 253.2、
#       金融費用 42.5、債務総額 6億6000万（前の年 7億3480万）。**クラブ公式の発表にある数字だけを「確定」、内訳と債務は「報道」（二次の記事）**。
#       ★QuiFinanza の「テレビ264」と Calcio e Finanza の「テレビ136」は定義が違う（読めていない）。**内訳のテレビの額は台本に出さない**。
#   ○ **ヨーロッパ中央銀行の参照相場（frankfurter 経由）2026-10-16：1ユーロ＝177.82円**。
#   × 決算書（イタリアの法定決算）そのものは読んでいない。クラブ発表と二次の報道まで。債務の中身（社債の残り・借り入れの利率）は報道の要約の段階で、台本に利率は出さない。
#   × オーナー（オークツリー）の取得の経緯・借入の期限は読んでいない。台本は「クラブ発表にある、オークツリー・キャピタルが運用する資金」だけ。
#
# 自分で計算した数（コードで検算した）:
#   デロイトの収入：チェルシー 584.1／インテル 537.5／ドルトムント 531.3。差（チェルシー−インテル）46.6 →「4660万」。46.6÷584.1＝7.98% →「約8%」。
#   インテル−ドルトムント＝6.2 →「620万」。46.6÷6.2＝7.52 →「約7.5倍」。インテル−11〜20位の平均404＝133.5（1.33倍）←台本では使わない。
#   5年の収入（試合日＋放映権＋商業、百万ユーロ）：インテル 331・308・379・391・537.5／チェルシー 494・569・536・545.5・584.1。差：163・261・157・154.5・46.6。
#     2020-21→2024-25 の差の縮み：154.5−46.6＝107.9 →「約1億800万」。インテルの5年の伸び：537.5÷331＝1.62倍 →「約1.6倍」。（チェルシー側の「○倍」は10/18 の回で言ったので言わない。）
#   インテルの1年の伸び：537.5−391＝146.5（+37.5%）。試合日 108−81＝+27／放映権 277−198＝+79／商業 153−112＝+41。合計 147（図の整数。0.5の丸め差）。放映権の割合 79÷146.5＝53.9% →「54%」。
#   残りの差（チェルシー−インテル）：試合日 103−108＝−5／放映権 242−277＝−35／商業 239−153＝+86 →合計 +46（図の整数。46.6）。商業 239÷153＝1.56倍 →「約1.6倍」。試合日と放映権でインテルが上の分 5＋35＝40。
#   給料（デロイトの図）：インテル 257（257÷537.5＝47.8% →「48%」）／チェルシー 418（418÷584.1＝71.6% →「72%」）。給料の差 418−257＝161 →「1億6100万」。
#     収入−給料：インテル 537.5−257＝280.5／チェルシー 584.1−418＝166.1。差 114.4 →「1億1440万」。**利益ではない**（償却・ほかの費用は引いていない）。
#     インテルの決算の人件費 253.2（報道）と、デロイトの給料 257 は近い（定義は別）。
#   クラブ発表の収入 567（内訳の合計 566.5）−選手売買 21.5＝545.0。デロイト 537.5 との差 7.5〜8（中身は読めていない）。
#   2025/26：518（−49、49÷567＝8.6% →「約9%」）。自己資本 −12 → +10.4。金融費用 42.5（報道）に対し、公式「約50%、約1900万」の減。
#   円換算：46.6×177.82＝8,286 百万円 →「約83億円」。
#
# **言い切っていないもの / 言わなかったもの**:
#   ・11位が「12位に近い」のは収入の額の話。順位の入れ替わりの予想は言わない。次のデロイトの集計（2025/26）の結果は言わない。
#   ・インテルの収入が増えた理由は、クラブの発表（国内と欧州の大会・クラブワールドカップ・商業の自然な伸び）まで。額の内訳（クラブワールドカップの分）は読めていない。
#   ・チェルシーの収入の中身の理由（優勝した大会の収入など）は言わない（10/18 の回）。
#   ・San Siro の売却・新スタジアムは、クラブ発表で「ミラノ市議会が買取りを認めた」と社長が述べた事実まで。台本では触れない（この回の問いから外れる）。
#
# 写真：assets/images/20261019_finance_inter/（01〜03＝サン・シーロ。04〜06＝スタンフォード・ブリッジ、10/18 の取り込み分を移した。credits.json 同梱）。
