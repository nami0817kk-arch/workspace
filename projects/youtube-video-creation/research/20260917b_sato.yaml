# **良い知らせと悪い知らせが同じ試合に入っている回。**
# チームは勝った。ただし佐藤は今季はじめて出番が無かった。
#
# 引きは**「勝った日に、それまで出ていた選手が消えた」**。ここが山場（@main）。
#
# **佐藤を責める書き方にしない。**新体制の初戦で、監督の選び方が変わっただけ。
# 現地の評価は新体制そのものに向いている
