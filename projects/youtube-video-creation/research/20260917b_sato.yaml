    say:
      - ラ・リーガ第6節、アラベス対バレンシアです。
      - アウェイのバレンシアが**1対0**で勝ちました。
      - 開幕から5試合勝てず、**1分4敗で最下位**に沈んでいたチームの、待望の初白星です。
      - 決めたのは77分、途中出場のルイス・リオハでした。
      - 相手のアラベスは、ホームで開幕3連勝中でした。
