  - id: sato
    heading: その日の佐藤龍之介
    main: true
    tier: 報道
    telop: 今季はじめて、出番が無かった
    narrator: 解説
    say:
      - {short_only: true, text: ラ・リーガ第6節、最下位に沈んでいたチームの話です。}
      - この試合、佐藤龍之介はベンチから始まりました。
      - そして、**5枚の交代枠をすべて使っても、呼ばれませんでした。**
      - ここまで佐藤は、**開幕5試合すべてに出場**しています。うち4試合は先発でした。
      - 新しい体制の初戦で、はじめてピッチに立たなかったことになります。
      - 監督が代わると、序列は最初の1試合で決まってしまうことがあります。
      - 代わりに、18歳のアーロン・マヨルがラ・リーガデビューを飾りました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/16/post1011762/

