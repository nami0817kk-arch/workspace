title: 9月25日の題材
lead: 候補537件と代表戦・ロマーノから22件
note: |
  <b>○×を付けてください。</b>クラブの試合が無い週なので、中身は<b>代表戦</b>が中心です。
  日本代表はウルグアイに3-1（松木・塩貝が代表初ゴール、上田がダメ押し）、
  クロップとシャビの初陣は1-1、ポルトガルはウェールズに1-0。<br><br>
  <b>昨日と同じ人物が3つ入っています</b>（⑪クロップ・⑬ロナウド・⑮ムバッペ）。どれも<b>昨日とは別の出来事</b>
  （昨日は会見・電話、今日は試合と、その後の話）なので候補に残しました。同じ写真は使いません。<br><br>
  鈴木唯人は昨日×だったので外しています。シェフチェンコ50歳の記念記事、モウリーニョの再建プラン（昨日と同じ人・同じ話）も外しました。
items:
  - num: 1
    slot: 日本人
    head: 松木玖生、A代表デビュー戦の11分にミドル弾。久保の序列に「安泰ではなくなるな」の声
    why: |
      第3次森保ジャパンの初陣、ウルグアイ戦。**23歳の松木玖生が前半11分に豪快なミドル**で代表初ゴール。
      主将に再任された堂安のアシスト。42分にウルグアイに追いつかれ、1-1で後半へ。
      **反応が濃い。**「久保の序列低下か」「安泰ではなくなるな」と、久保建英との比較で盛り上がっている。
      本人は「毎日練習してることが心の支えになった」。松木は昨年、A代表に呼ばれ続けて出番が無かった選手。
    src: ゲキサカ / テレ東スポーツ / footballnet（9/24〜25）
    url: https://footballnet.2chblog.jp/archives/60069274.html
    fmt: voices
  - num: 2
    slot: 日本人
    head: 塩貝健人、自己中プレーでチャンスを潰した直後に90+1分の決勝弾。「このスタイルは変えない」
    why: |
      1-1で迎えた後半アディショナルタイム、**上田のクロスから代表初ゴール**。
      直前に**自分で打ってチャンスを潰した場面**があり、まとめは「◆悲朗報◆ いいのかわるいのか」。
      本人は**エゴに反省しつつ「僕はこのスタイルを変えるつもりはない」**。上田は「決めれないかーあれ」と本音。
      上田「メディアで強気なことを言ったり、思考力がすごくある」。小野伸二氏のオフサイド誤認識も話題に。
    src: ゲキサカ / football-tribe / まとめ（9/24〜25）
    url: https://web.gekisaka.jp/news/japan/detail/?459649-459649-fl
    fmt: voices
  - num: 3
    slot: 日本人
    head: 上田綺世、90+1分のアシストと90+6分のダメ押し。「アグレッシブに良いサッカーができた」
    why: |
      決勝点をお膳立てし、自分でも締めた**エースの回**。塩貝について「思考力がすごくある」と語っている。
      ①②と題材が重なるので、**①②を作るならこれは要らない**（同じ試合を3本にしない）。
      作るなら「上田が見た若手2人」という切り口で、本人の言葉を主役にする。
    src: ゲキサカ（9/25）
    url: https://web.gekisaka.jp/news/japan/detail/?459637-459637-fl
    fmt: quote
    weak: true
  - num: 4
    slot: 日本人
    head: 佐野海舟と佐野航大、日本代表史上初の兄弟ボランチ同時先発
    why: |
      **日本代表で初めて、兄弟がボランチを組んだ。**航大は帰国2日後の先発というセオリー外れ。
      兄・海舟「嬉しさもあるが、もっとよくできる」、弟・航大「連係に手応え、まだまだ課題が残る」。
      記録としてはっきりしていて、2人の言葉がそろっている。試合の結果を主役にしない回が1本あると、①②と並べても重ならない。
    src: ゲキサカ（9/25）
    url: https://web.gekisaka.jp/news/japan/detail/?459655-459655-fl
    fmt: news
  - num: 5
    slot: 日本人
    head: 板倉滉、アジアカップ招集に複雑な心境。「サッカーよりプライオリティーが高いものができた」
    why: |
      **結婚と妊娠に触れながら**、招集への気持ちを語った。「サッカーよりプライオリティーが高いものができた」。
      発言は本人の言葉で、私生活を扱うが本人が公の場で話した内容。主将変更（堂安が再任）の話とも重なる。
      **私生活の扱いなので、○にするなら本人の発言だけで作り、周りの推測は入れない。**
    src: footballnet（9/24、元は日刊スポーツ）
    url: https://footballnet.2chblog.jp/archives/60066741.html
    fmt: quote
  - num: 6
    slot: 日本人
    head: 堂安律、サウジ移籍騒動を語る。「叩いている奴らの百倍ぐらい僕は考えてる」
    why: |
      夏にアル・イテハド移籍が迫っていた件。**「叩いてる奴らの百倍ぐらい考えてる。自分の人生なんで」**
      「『お前が日本を背負うな』『10番をつけるな』と言われた。**全部背負ってやろうかなと思ってます、逆に**」。
      そして初陣で主将に再任され、松木の初ゴールをアシスト。**言葉と結果がその日のうちにそろった**回。
      反応も取りやすい（まとめに【悲報】スレあり）。
    src: 日刊スポーツ / 東スポ / サッカーキング（9/22〜24）
    url: https://news.yahoo.co.jp/articles/a62c0349259656fa7434452d4d431a4c5d294a61
    fmt: quote
  - num: 7
    slot: 日本人
    head: 久保建英、ソシエダで出番減少。代表で「持ってる側の人間」と後輩を語る
    why: |
      レアル・ソシエダでレギュラー落ちしている久保が、代表で先発。
      18歳でA代表デビューした地（宮城）で松木・塩貝の活躍を「持ってる側の人間」「あれは出さなきゃダメよって（笑）」。
      **①の反応が「久保の序列低下」なので、①を作るならこちらは久保側の言葉として①に吸収できる。**
    src: footballnet / ゲキサカ（9/24〜25）
    url: https://footballnet.2chblog.jp/archives/60066718.html
    fmt: quote
    weak: true
  - num: 8
    slot: 日本人
    head: GK早川友基、ウルグアイ戦のパスミスに苦言「失点の価値安くなってないか？」。一方で好セーブ連発
    why: |
      1失点はパスミスから。**「失点の価値が安くなっていないか」**という批判と、
      「ウルグアイの攻勢を好セーブで防いだ」という評価が**割れている**。本人「状況判断の部分はやれていた」。
      **鈴木彩艶が主将格の正GKで、早川は出場機会が限られる**中での試合。
      賛否が割れているので voices 向き。ただし出典が薄い（football-tribe 1本＋本人談話1本）。
    src: football-tribe / ゲキサカ（9/25）
    url: https://football-tribe.com/japan/2026/09/25/359684/
    fmt: voices
    weak: true
  - num: 9
    slot: 日本人
    head: 森保ジャパン3期目の初陣は3-1。それでも「W杯から変わらぬ課題」と書かれたこと
    why: |
      勝ったが、**終盤まで1-1**で、後半アディショナルタイムの2点で決めた試合。
      「W杯から変わらぬ課題…露呈した弱点」という分析記事があり、森保監督は「ギラギラしたところを見せてくれた」。
      ウルグアイのフォルラン監督は「終盤の失点は残念」。
      **①②④⑧と同じ試合。**全体をまとめる回が要るなら。要らなければ①②で足りる。
    src: フットボールチャンネル / ゲキサカ（9/25）
    url: https://www.footballchannel.jp/2026/09/25/post1019040/
    fmt: news
    weak: true
  - num: 10
    slot: 日本人
    head: U-21日本代表、アジア大会をグループ全勝で首位通過。準々決勝の相手は北朝鮮
    why: |
      大岩ジャパン。キルギスに7-0、タイに3-0で**3連勝・首位通過**。横山夢樹（C大阪）のループ弾など。
      準々決勝は北朝鮮、勝てばウズベキスタンかサウジ。**大岩監督は「それ以上のものを求めていきたい」と冷静。**
      若手なので写真が取れるか要確認（顔が無ければ見送り）。
    src: ゲキサカ / フットボールチャンネル（9/24〜25）
    url: https://www.footballchannel.jp/2026/09/25/post1018770/
    fmt: news
  - num: 11
    slot: プレミア
    head: クロップのドイツ代表初陣は1-1。90+分にガクポに追いつかれ、ハヴァーツとムシアラを失った
    why: |
      アムステルダムで**ンメチャの先制→終了間際にガクポのボレー**。クロップ「最悪の形だったが、1ポイントで生きていける」。
      **ドイツ代表に持ち込んだ4つのルール**（食事の時間厳守、ウォームアップ中の携帯禁止、ホテルに理髪師を呼ばない、試合当日の携帯禁止）が現地で話題。
      **ハヴァーツとムシアラが負傷**で「この後の試合には出られないだろう」。アーセナルにも影響。
      ドイツ紙は「有望な滑り出し」「一人芝居」「ボクシングの試合」と割れている。**昨日は前日の話で×。今日は結果。**
    src: ESPN / Eurosport / kicker / ゲキサカ（9/24〜25）
    url: https://web.gekisaka.jp/news/world/detail/?459629-459629-fl
    fmt: news
  - num: 12
    slot: その他
    head: シャビの初陣。「我々のほうがドイツより良かった」と言い切り、ガクポは「ドイツは非スポーツ的」
    why: |
      オランダの新監督シャビ、ホーム初戦は1-1。**「満足している。ドイツより良かった」**。
      ガクポは**ドイツの先制点の前の場面を「非スポーツ的」と批判**。ファン・ダイクは「まだ伸びしろがある」。
      ⑪と同じ試合を**オランダ側から**見る回。⑪と両方作ると同じ試合が2本になる。
    src: ESPN / VI / サッカーキング（9/24〜25）
    url: https://www.espn.com/soccer/story/_/id/50023617/netherlands-better-klopp-germany-draw
    fmt: quote
    weak: true
  - num: 13
    slot: その他
    head: ロナウド、ゴール取り消しと決定機逸の夜。ジェズス監督「交代させることは計画していた」
    why: |
      ポルトガルはウェールズに1-0（ジョアン・フェリックス）。ロナウドは**59分のゴールがオフサイドで取り消し**、後半頭に決定機を外した。
      **ジェズス「ロナウドを下げることは事前に計画していた」**。ネヴェス「ゴールは出てくる」。
      現地では**「ポルトガルはロナウドより上」「ロナウドの騒がしさと新時代を分けなければ」**という声。
      本人は試合後に投稿。**昨日は会見の回を作った。今日は試合の回。**
    src: A Bola / ESPN（9/24〜25）
    url: https://www.abola.pt/video/jorge-jesus-ja-tinha-planeado-tirar-cristiano-ronaldo-do-jogo-2026092422411377570
    fmt: quote
  - num: 14
    slot: プレミア
    head: ハーランド、ノルウェーで2発。代表56試合で64ゴール
    why: |
      デンマークに3-2。**ワールドカップ8強のあとも止まらない。**代表通算は56試合64ゴール（ロマーノ）。
      「一度は勝ちを手放しかけて、それでもハーランドがいた」という試合。
      数字が主役なので news。ただし本人の言葉が薄い。
    src: Sky Sports / kicker / ロマーノ（9/24〜25）
    url: https://www.skysports.com/football/live-blog/11661/13025499/man-city-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts
    fmt: news
    weak: true
  - num: 15
    slot: その他
    head: ムバッペとデンベレの冷えた関係。バロンドール争いで、テュラムが仲裁に入った
    why: |
      クレールフォンテーヌで再会した2人が**「以前のようではない」**。ムバッペのバロンドールをめぐる発言をデンベレが快く思っていない。
      **選ばれていないテュラムが仲裁役**。ジダンは合宿の頭で「話し合いは無い」と釘を刺し、デンベレの位置を明かさない。
      現地には「ムバッペがバロンドールを取るのは茶番。票を買おうとしている」という強い声もある。
      **昨日はジダンの電話。今日は選手同士の話。**ジダンの写真は使い回さない。
    src: Le10Sport / Foot01 / Daily Mail（9/24〜25）
    url: https://le10sport.com/football/equipe-de-france/tensions-entre-kylian-mbappe-et-ousmane-dembele-snobe-par-zinedine-zidane-ce-joueur-de-lequipe-de-france-est-intervenu-791046
    fmt: news
  - num: 16
    slot: その他
    head: エリクセン、ヴォルフスブルクと契約解除。心臓の問題で2度目の離脱「家族のそばにいることが重要」
    why: |
      9月23日、双方合意で契約解消。**6月の親善試合で再び胸を押さえて倒れ込んでいた。**
      本人「今はデンマークにいる家族のそばにいることが私にとって重要だ」。クラブのヘッキング氏は本人側の申し入れを受けた形。
      2021年のユーロで心停止した選手の、**2度目**。重い話なので、本人とクラブの言葉だけで作る。
    src: サッカーキング / 超WORLDサッカー / Goal（9/23）
    url: https://www.soccer-king.jp/news/world/ger/20260923/2208320.html
    fmt: quote
  - num: 17
    slot: ラ・リーガ
    head: ハイセン「ダービーの敗戦は私の責任だ」。そして「逆の立場なら大騒ぎになっていた」
    why: |
      レアルの21歳センターバックが、アトレティコ戦の敗戦を**自分の責任だと言い切った**。
      同時に審判について「逆のことが起きていたら、間違いなく大騒ぎだった」。**責任と不満を同じ口で言っている**のが面白い。
      ロマーノが英訳を投稿、元はスペインの新聞のインタビュー。**昨日のモウリーニョの回の続きに見えるので、写真はハイセン。**
    src: ロマーノ（9/25、元は OK Diario）
    url: https://x.com/FabrizioRomano
    fmt: quote
  - num: 18
    slot: ラ・リーガ
    head: バルサのデコ「ラウタロが欲しかったが、インテルが売らなかった」「フリアンはもう過去」
    why: |
      バルセロナのスポーツディレクターが、**夏に獲れなかった2人**を名指しで振り返った。
      ラウタロ「インテルが拒否した」、フリアン・アルバレス「もう過去だ。彼が元気でやっていることを願う」。
      「成立しない取引はたくさんある」。**言った本人が責任者**なので、噂ではなく当事者の言葉。
    src: Football Italia / ロマーノ（9/24〜25）
    url: https://football-italia.net/deco-barcelona-wanted-lautaro-martinez-inter/
    fmt: quote
  - num: 19
    slot: ロマーノ
    head: ロマーノの1日：マンUが16歳コンデをリヴァプールから、レアルのコナテは靭帯負傷で離脱
    why: |
      **マンチェスター・ユナイテッドが16歳のウインガー、アイザック・コンデをリヴァプールから獲得**（発表間近、here we go 済み）。
      **レアル・マドリードはコナテの右脚側副靭帯の負傷を発表**、代表から離脱。
      **アラバがウディネーゼと1年契約**（昨日の無所属の回の続き）。1本にするには細切れ。
    src: ロマーノ（9/25）
    url: https://x.com/FabrizioRomano
    fmt: news
    weak: true
  - num: 20
    slot: その他
    head: ウルグアイには2億円超、ドイツには0.1億円。日本代表の親善試合の対戦料をめぐる話
    why: |
      「ウルグアイ代表等に2億円以上支払う、ドイツ代表は日本代表にわずか0.1億円…関係者『キリンが…』」。
      **数字の出どころが関係者談で、1媒体。**面白いが確度は「未確認」どまり。
      作るなら「対戦料はこう決まる」という仕組みの話にして、金額は伝聞と明示する。
    src: football-tribe（9/25）
    url: https://football-tribe.com/japan/2026/09/25/359702/
    fmt: news
    weak: true
  - num: 21
    slot: その他
    head: ラフィーニャがブラジルの新10番。ネイマール代表引退のあとを継ぐ
    why: |
      ロマーノが「OFFICIAL」で投稿。**ネイマールの代表引退を受けて、ラフィーニャが10番**。
      ロドリは「ラフィーニャがW杯のベスト30に入っていないのが理解できない」（バロンドールの30人にも入っていない）。
      アンチェロッティは「ラフィーニャとヴィニシウスの対照」を認めた。**ヴィニシウスは昨日の回に出た。**
    src: ロマーノ / Foot Mercato（9/24〜25）
    url: https://x.com/FabrizioRomano
    fmt: news
  - num: 22
    slot: その他
    head: 伊東純也が「史上最も過小評価されている選手」で世界2位に
    why: |
      海外のランキング記事。**1位が誰かと、何を基準に選んだか**を確かめてから。
      日本人の名前で検索に来る回にはなるが、中身がランキングだけだと薄い。
    src: football-tribe（9/25）
    url: https://football-tribe.com/japan/2026/09/25/359699/
    fmt: news
    weak: true
