- num: 9
  slot: 海外
  head: ケインがバロンドール。「まっすぐ頂点に来たわけじゃない」と語った、貸し出し時代
  why: ESPN・BBC（26日夜）。ロンドンのパレイディアム劇場で、ケイン（33歳）が男子のバロンドールを受賞。2位エムバペ、3位ヤマル。イングランド人では2001年のオーウェン以来25年ぶり、5人目。バイエルンの選手では1981年のルンメニゲ以来。昨季はクラブで51試合61点（バイエルンの1季最多）、代表と合わせ65試合73点。W杯は準決勝で敗れ3位（6点、サッカーキング）、CLも準決勝敗退で、大きなタイトル無しの受賞は過去20年で5回目（BBC）。本人「ロンドンだから、特別だ」「僕はまっすぐ頂点に行ったわけじゃない。何度も貸し出されて、戦ってここまで来た。それが誰かの励みになれば」。妻ケイトへ「あなたは僕より、これを望んでくれていた」（ESPN）。トゥヘル監督「君の活躍を表す最上級の言葉は、とっくに使い果たした」（BBC）。**条件：W杯に当たる（イングランド3位）。本人の言葉あり**。確度：確定。写真：コモンズに多数（3枚はそろう見込み）。**弱い：10/23 に「ケイン、CLで10試合連続」、10/25 にシリーズの比べる「ケインとレヴァンドフスキ」を出した**。時刻：18時以降。見せ方：Y。
  src: ESPN（受賞と本人の言葉）、BBC（記録・トゥヘル）
  url: https://www.espn.com/soccer/story/_/id/50236983/harry-kane-2026-ballon-dor-kylian-mbappe-lamine-yamal
  fmt: quote
  weak: false
- num: 10
  slot: 海外
  head: ヤマル「この賞はクバルシのものだった」。史上初の3連覇のあとで、2位の同僚に
  why: ESPN・サッカーキング（27日）。21歳以下の最優秀選手に贈るコパ・トロフィーを、バルサの19歳ヤマルが史上初の3年連続で受賞。2位は同僚のクバルシ。ヤマルは短いあいさつで「クバルシにもらってほしかった。この賞は彼のものだった。彼にふさわしい」（ESPN）。昨季はバルサで45試合24点18アシスト、W杯ではスペインの優勝に貢献（サッカーキング）。バロンドール本体は3位。**条件：W杯に当たる（スペイン優勝）。本人の言葉あり**。確度：確定。写真：ヤマル・クバルシともコモンズにあり（3枚はそろう見込み）。**弱い：10/24 に「ヤマル『何も乞わない』」（発表前の言葉）、10/22 にシリーズの比べる「ヤマルとサカ」を出した。題9と同じ授賞式**。時刻：18時以降。見せ方：Y。
  src: ESPN（ヤマルの言葉）、サッカーキング（コパ・トロフィー）
