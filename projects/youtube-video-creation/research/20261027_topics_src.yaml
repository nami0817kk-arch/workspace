  head: 福井太智の試合を、ポルトガルの日本大使が見に来ていた。地元紙「特別な観客」
  why: フットボールゾーン（25日、ア・ボラの引用）。10月11日のアロウカ対エストレラ・アマドーラ（1-0）を中川勉・駐ポルトガル日本大使が観戦し、クラブハウスも訪問。クラブは「文化の架け橋を作るうえでのサッカーの役割」と声明。福井は加入3季目で、次の24日のアルヴェルカ戦で今季初ゴール。アロウカは5位。**条件：日本代表・W杯には当たらない。本人の言葉は無い**。確度：確定。写真：**10/26 に福井は写真1枚で外れた（3枚そろわなかった）。同じ壁が残る**。**弱い：大使の観戦は2週間前の話。10/26 の一覧6（福井の今季初ゴール）は○が付いたが写真で止まった**。時刻：9〜17時。見せ方：X。
