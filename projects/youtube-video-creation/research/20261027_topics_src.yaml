  slot: 日本人
  head: 町田浩樹「ベルギーの時は連戦が楽だった」。ブンデスで初めて知った疲れの違い
  why: フットボールゾーン（25日、中野吉之伴氏の取材）。ELリヨン戦のあと、ホッフェンハイムの日本代表DF町田浩樹が「ベルギーリーグの時は、連戦が続くことも自分にとっては楽だった」「ブンデスリーガになるとリーグ戦のレベルが上がって、連戦になるとかなり疲労度だったり、インテンシティが高いなかで連戦をこなさなきゃいけない。すごく違いを感じます」。3年前のベルギー時代には「たくさん試合できるんで僕は嬉しいっすね」「リバプールと対戦したり、サラーとマッチアップしたり。あれ以上のウインガーはいないと思う」と話していた。昨年8月に左ひざ前十字靱帯を断裂し、今季第3節で約1年ぶりに復帰、まだ1か月少し。**条件：日本代表に当たる。本人の言葉あり**。確度：確定（取材）。写真：10/26 の町田の本で集めた写真と重ねないこと。新しい3枚はホッフェンハイム公式・ブンデス公式から取れる見込み（未確認）。**弱い：10/26 に町田（ホッフェンハイム3-0）のショートを作った。言葉はリヨン戦（週の半ば）のあとで、レヴァークーゼン戦の前**。時刻：9〜17時。見せ方：Y。
  src: フットボールゾーン（町田の取材）
  url: https://www.football-zone.net/archives/680707
  fmt: quote
