  head: ファン・ダイク「モーがしてきたことは、誰にもまねできない」。サラーの去ったリヴァプール
  why: ESPN（26日）。2-0ブライトン戦で、イサク・バルコラ・ヴィルツ（この2年の補強で計3億6400万ポンド）とガクポが初めてかみ合った、と記事。イサクはリーグ6試合で6点目。サラーは夏に契約を1年早く切って去り、トラブゾンスポルで10試合10点。主将ファン・ダイク「モーが何年もウイングとしてやってきたことは、誰にもまねできないと思う」「マネやボビー（フィルミーノ）も同じだ」「昔のほうがよかったと考えることはできるが、それはリヴァプールのようなクラブのあるべき考え方ではない。今は他の選手が前に出る時だ」。**条件：W杯に当たる（オランダ代表主将）。本人の言葉あり**。確度：確定。写真：コモンズに多数（2025年以降のものは少なめ）。**弱い：10/27 のシリーズにオランダ代表の回がある。10/26 にリヴァプール対ブライトン（ヒュルツェラー）を作った**。時刻：18時以降。見せ方：Y。
