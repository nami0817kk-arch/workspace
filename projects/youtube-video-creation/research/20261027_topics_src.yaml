  head: 日本と戦うブラジル代表、メンバー発表は29日。国内組は大きく減る見込み
  why: ゲキサカ（26日）。ブラジルサッカー連盟（CBF）が、11月のシンガポール遠征（14日に日本、17日にシンガポールと対戦）のメンバーを現地29日に発表すると明らかにした。CBFは「アンチェロッティ監督が、2028年のコパ・アメリカと30年のW杯に向けてチームを構築していく取り組みの続き」と説明。9月・10月はアリソン、エデルソン、アレックス・サンドロ、カゼミーロらベテランを呼んでいない。ブラジル国内リーグが終盤で、優勝・リベルタドーレス・残留を争うクラブから招集を避けるよう要請があり、9・10月に11人いた国内組は大幅に減る可能性（グローボ）。フラメンゴの4人（ペドロ、サムエウ・リーノ、パケタ、エメルソン）は最終メンバーに入らない見込みと現地。欧州組には制限なし。**条件：日本代表に当たる（11/14 ブラジル戦）。本人の言葉は無い（CBFの声明）**。確度：発表日は確定、国内組が減るのは報道止まり。写真：アンチェロッティ・ブラジル代表の写真はコモンズに多数（3枚はそろう見込み）。**弱い：中身は29日の発表待ち。10/22 にシリーズの監督紹介「アンチェロッティ」を出している**。時刻：9〜17時。見せ方：X。
  src: ゲキサカ（CBFの発表・グローボ）
