title: 10月27日のショート題材
lead: バロンドールの結果（ケインが受賞）と月曜の出来事を中心に約45件から22件（日本人8件・海外14件）。ショート10本ぶんを○で選んでください。
note: 今日は火曜（27日）、日本時間の朝に集めました。<b>バロンドールは月曜夜にロンドン（パレイディアム劇場。今年はパリではありません）で発表され、男子はハリー・ケイン（バイエルン）が受賞。2位エムバペ、3位ヤマル</b>。イングランド人の受賞は2001年のオーウェン以来25年ぶり。ほかの賞はコパ・トロフィー（21歳以下）がヤマルで史上初の3連覇、最優秀監督がスペイン代表のデ・ラ・フエンテ、ヤシン・トロフィー（GK）がウナイ・シモン、最優秀チームがPSG。<b>男子の候補30人に日本人はいません</b>（日本人の順位が出たのは女子の長谷川唯11位で、女子のため外しました）。月曜の試合はPSG2-0リヨン（PSGが首位に。リヨンの中村敬斗は出場停止）、セビージャ2-0オサスナ、サンタ・クララ1-2ベンフィカだけで、<b>月曜に出た日本人はいません</b>。マンUはキャリック監督の進退をめぐり、月曜に首脳陣と3時間の協議（結論はまだ）。<br><br><b>日本人の題は8件（1〜8）、海外は14件（9〜22）、計22件です。</b>日本人は月曜に試合が無く、新しい出来事は少なめです。<b>日本人で本人の言葉があるのは町田浩樹（4）だけ</b>（ただし試合後の取材の言葉で、10/26 に町田のショートを作っています）。日本代表に絡む新しい話は、ブラジル代表のメンバー発表日（1）とアジア杯の日程・開催可否（2）。弱い題で埋めないよう、日本人の題は 2・4・1・5 あたりまでを推奨します。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは、1・2・3・4・5（瀬古は日本代表歴あり）・7・9（ケインはW杯3位・6点）・10（ヤマルはW杯優勝）・12（エムバペはW杯歴代最多得点）・13（スペインのW杯優勝）・14（ナーゲルスマンは前ドイツ代表監督）・15・16・21。本人（監督・会長を含む）の言葉が取れたのは14件（2・3・4・5・9・10・14・15・16・18・19・20・21・11は広報）。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外。<br><br><b>写真：</b>今回は件ごとに「写真：」に見込みを書きました。ウィキメディア・コモンズの検索は途中で回数制限に当たり、数えられたのは一部だけです（ケイン・ヤマル・キャリック・アッレグリ・ヴィルツ・森保監督は多数、瀬古歩夢は数件、山本理仁とエスパルトは0件）。<b>山本理仁（6）とエスパルト（22）は本人の3枚がそろわない見込みが強く、瀬古歩夢（5）と福井太智（8）も危ない</b>です。<br><br><b>重なりの注意：</b>バロンドールが4件（9・10・11・12）と13。1〜2件に絞るのを推奨します（9と10が本人の言葉あり）。10/22 に「ムバッペが語ったバロンドールの条件」、10/24 に「ヤマル『何も乞わない』」（発表前の言葉）、10/25 にシリーズの比べる「ケインとレヴァンドフスキ」を出しています。10/27 のシリーズ本編（オランダ代表・フリック・フライブルクほか）と重なるものは各行の「弱い」に書きました。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使わない決まりのため<b>読めませんでした</b>。移籍の題は、出典が3本そろったマンUの後任候補（14）だけ出しています。バロンドール公式サイト（ballondor.com）とフランス・フットボールは見ていません（ESPN・BBC・サッカーキングで結果を確かめました）。ESPN（記事API）・BBC・ゲキサカ・フットボールゾーン・サッカーキングの本文は読みました。コモンズの写真の数は上のとおり一部だけです。女子サッカー・Jリーグ・MLS・英2部・ベルギーは出していません。FotMobは使っていません。
