  head: 「アニメに映っているのはGKのグローブだ」。ゴールラインテクノロジーが認めた、入っていないかもしれない1点
  why: ゲキサカ（26日、仏メディアの引用）。リーグ・アン第8節ル・マン1-1オセール。後半3分、オセールの選手に当たったボールをGKナルディがライン際でつかんだが、ゴールラインテクノロジーが作動し得点に。オンフィールドレビューでも判定は変わらず。オセールのウィル・スティル監督は「アニメーションで見えるのはGKポールのグローブだ」と主張し、会見でゴール裏の映像を見せた。「主審は非常に優秀で、テクノロジーが伝えたことに耳を傾けた。しかし2026年のリーグ・アンで、審判が求める良い情報を提供できないことに驚いている」。クラブも「公平性を保証するための道具が誤りの原因となることは容認できない」と声明。**条件：本人（監督）の言葉あり。W杯には当たらない**。確度：判定は確定、誤検知はオセールの主張。写真：スティル監督・ナルディは未確認（コモンズは検索語が一般語でまぎれて数えられず）。**弱い：中堅同士の試合で、人物の知名度が低い**。時刻：18時以降。見せ方：Y。
