  head: キャリック、首脳陣と3時間。後任候補にハウと前ドイツ代表監督ナーゲルスマン
  why: ESPN・BBC・サッカーキング（スカイの引用）（26日）。0-3ボーンマス戦の翌日、ベラダCEOとウィルコックスFDがキャリントンで協議を続け、キャリックも午後2時前に来て約3時間後に去った。結論は出ていない。公式戦8試合勝ちなし、12試合で2勝、8試合で勝ち点7は1986年以来最悪の出だし。後任候補はハウ（夏にニューカッスルを辞任）とナーゲルスマン（W杯までドイツ代表監督）と3社が報じた。キャリック本人は試合後「どんな決定が下されようとも、私は常にこのクラブにとって最善だと信じることを行う」「サポーターからあのような反応をもらえるとは思っていなかった」（ESPN、サッカーキング）。**条件：W杯に当たる（ナーゲルスマン）。本人の言葉あり（試合後）**。確度：協議は確定、後任候補は報道（3社）。解任はまだ。写真：キャリック・ハウ・ナーゲルスマンはコモンズに多数。**弱い：10/26 の一覧12（キャリック「次に何があるか分からない」）は○が付かなかった。今日にも決まる可能性があり、作るなら発表を確かめてから**。時刻：18時以降。見せ方：Y。
