  head: 山本理仁、ブンデス初出場でバイエルン相手にオウンゴールを誘った
  why: フットボールゾーン（26日）。この夏シント=トロイデンからフライブルクへ移った山本理仁が、25日のバイエルン戦で0-2の後半13分から途中出場しブンデスデビュー。82分、マケンゴの折り返しに詰め、マークのビスコフに当たってオウンゴール（1-2）。チームは追加時間に失点し1-3。前節レヴァークーゼン戦は初のベンチ入りで出番なし。後藤啓介はベンチで出番なし、鈴木唯人は先発。**条件：日本代表・W杯には当たらない。本人の言葉は無い**（記事はSNSの反応だけ）。確度：確定。写真：**コモンズに0件。フライブルク公式の写真が取れなければ3枚そろわない見込みが強い**。**弱い：10/26 に同じ試合で鈴木唯人のショートを作った。得点は本人ではなくオウンゴール**。時刻：9〜17時。見せ方：X。
