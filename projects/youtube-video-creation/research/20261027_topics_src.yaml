  head: 発表の4時間半前、公式サイトに「ケインが受賞」の記事。ヤマルとエムバペの分もあった
  why: BBC（26日）。英国時間の夕方、バロンドール公式サイトに「ハリー・ケインが2026年のバロンドールを受賞」という記事が出て、ネットで広まった。発表の4時間半以上前。ところがヤマルとエムバペについても同じような記事が出ていた（女子のプテジャスとパヨルも）。広報は「候補全員のぶんを用意していた紹介記事が、誤って公開された。結果や順位を示すものでは決してない」。記事は約25分後に消えた。結果はケインの受賞だった（ESPNは「授賞式も30分遅れで始まった」）。**条件：本人の言葉は無い（広報の言葉）。W杯には直接当たらない**。確度：確定。写真：ケインはコモンズに多数。**弱い：題9と同じ授賞式。結果を伏せないと成り立たない**。時刻：18時以降。見せ方：X。
