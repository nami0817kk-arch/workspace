  head: 鈴木彩艶、BBCの週間ベスト11に。選んだ元FW「大事な試合でこそ力を出す」
  why: サッカーキング（27日）。BBCのプレミア第8節のベスト11（選者は元ワトフォードのトロイ・ディーニー氏）に、マンC戦で6セーブの鈴木彩艶が入った。ディーニー氏「重要な試合でこそ力を発揮し、きっちり仕事をこなす選手だ」「ハーランドのゴールに関しては、彼にはどうすることもできなかった」「ボールを奪い返した際にはカウンターの起点になっている」。ヴィラからはキャッシュとジャクソンも選出、ボーンマスから最多4人。**条件：日本代表に当たる。言葉は他人（元選手）のもの**。確度：確定。写真：10/25・10/26 の鈴木彩艶の本と写真が重なりやすい。**弱い：10/25 に6セーブ・キャッシュの言葉、10/26 にハーグリーブスの言葉で3本作った。中身は同じ試合の評価の4本目**。時刻：9〜17時。見せ方：X。
