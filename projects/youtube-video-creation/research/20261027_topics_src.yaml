  head: アッレグリに2試合のベンチ禁止。本人「動くたびに退場。次はベンチで動かないでいないと」
  why: ESPN（26日）。24日のナポリ3-3ローマで、終盤のバレルディの同点弾に「ベウケマへのファウルがあった」と怒り一発退場。リーグは「審判への侮辱的な発言」「ロッカーで相手スタッフに攻撃的な態度」で2試合のベンチ禁止と罰金1万ユーロ。ナポリは不服を申し立てる。本人はDAZNイタリアで「第4審判には何も言っていない」「次はベンチに座って動かないようにしないと。動くたびに退場になる。昨季は罰金8万ユーロを払った」「ピッチに走り込むような人もいるのに何も言われない。私が動くと罰せられる」。水曜のモンツァ戦、日曜のユヴェントス戦はベンチに入れない。**条件：本人の言葉あり。W杯には当たらない**。確度：処分は確定。写真：コモンズに多数。**弱い：試合は24日。10/26 のシリーズにナポリの財政の回があった**。時刻：18時以降。見せ方：Y。
