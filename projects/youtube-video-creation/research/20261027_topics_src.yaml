  slot: 日本人
  head: 瀬古歩夢、抗議の警告でPSG戦に出られず。監督「二重の罰のようだ」
  why: サッカーキング（26日、レキップの引用）。25日のマルセイユ戦（3-4）で、ル・アーヴルは0-4から3-4まで追い上げた。後半追加時間、水多海斗のシュートが相手の手に当たったがVARの末にハンドなし。ゲームキャプテン（77分から）の瀬古が主審に意見し、抗議として警告。瀬古は第6節リール戦の退場で「1試合の執行猶予付き」の処分を受けており、今回の警告で30日の第9節PSG戦に出られなくなった。ディガール監督「90分を過ぎ、0-4から3-4に追い上げた展開のなかで、あのような事態が起きた。もう少し配慮があっても良かった。あの警告は避けられたはずだ。二重罰のように思える」。ル・アーヴルは未勝利で最下位。**条件：日本代表に当たる（瀬古は日本代表歴あり。W杯メンバーだったかは未確認）。言葉は監督のもの（瀬古本人の言葉は無い）**。確度：確定。写真：瀬古はコモンズに数件のみ。リーグ・アン公式・クラブ公式で3枚そろうか未確認（**写真不足で止まる恐れあり**）。**弱い：10/26 の一覧の7（水多のアシストで4-3まで）と同じ試合で、7は○が付かなかった。名前の表記が水田／水多で記事により違う**。時刻：9〜17時。見せ方：Y（監督の言葉）。
  src: サッカーキング（レキップの引用）
