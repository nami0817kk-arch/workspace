  head: 日本代表のW杯を追った映画が11月20日公開。宮本会長がレッドカーペットで語ったこと
  why: ゲキサカ（26日）。東京国際映画祭の初日に、JFAの宮本会長がドキュメンタリー映画『サッカー日本代表映画「最高の景色」への挑戦』（11月20日全国公開）をPR。2026年W杯の日本代表を追った作品で、中村敬斗・上田綺世・鎌田大地・伊東純也・長友佑都らのインタビューを交え、ベスト32で敗退したチームの舞台裏を描く。宮本会長は「大会期間中の代表チームの心の変化など、より細部の部分まで知っていただけたら、より一層サッカーへの熱い想いを持っていただける作品」。**条件：日本代表・W杯に当たる。言葉は会長のもの（映画の中の選手の言葉は記事に無い）**。確度：確定。写真：宮本会長はコモンズにあり。選手の写真は使い回しに注意。**弱い：宣伝の話で、新しい事実は公開日だけ**。時刻：9〜17時。見せ方：X。
  src: ゲキサカ
