  head: アジア杯の日程が確定、日本の初戦は1月11日インドネシア戦。それでも開催は「現時点で簡単ではない」
  why: ゲキサカ（26日）。AFCが来年1〜2月のアジア杯（サウジアラビア）の日程を発表。日本はF組で、1/11 インドネシア（ジッダ）、1/16 タイ（リヤド）、1/20 カタール（リヤド。大会2連覇中）。開幕は1/7、決勝は2/5。ただしリヤドの国際空港がフーシ派の攻撃を受け、開催の可否は11月中旬にバンコクで開く理事会で最終決定する方針（田嶋名誉会長の話）。フットボールゾーン（23日）では、宮本恒靖JFA会長が「やはり安全ではないので、開催は現時点では簡単じゃないと思っています」「最優先は安全面です」。森保監督はアジア杯を最後に退任が決まっている（同記事）。**条件：日本代表に当たる。言葉はJFA会長のもの（選手・監督の言葉は無い）**。確度：日程は確定（AFC発表）、開催可否は未定。写真：森保監督・宮本会長はコモンズにあり（森保監督は多数）。**弱い：宮本会長の言葉は23日のもの。日程の発表そのものは数字が並ぶだけ**。時刻：9〜17時。見せ方：Y（会長の言葉）。
  src: ゲキサカ（AFCの日程発表）、フットボールゾーン（宮本会長）
