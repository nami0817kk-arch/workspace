  why: サッカーキング（27日、クラブ公式の引用）。ブライトン戦で17分にヴィルツのシュートがグロスのオウンゴールを誘い、直近の公式戦4試合すべてで得点に関与。しかし足首を痛め65分に交代。イラオラ監督「足首を少し捻挫した。見た目ではそれほど大きなケガではないが、3日おきの試合が続くので慎重に見極める」。ヴィルツ本人「大丈夫だと思う。それほど悪くはない。詳しいことはわからないけど、確認する必要があるね」。次は28日のカラバオ杯チェルシー戦、11/1 アーセナル戦。**条件：ドイツ代表（W杯は直接の話ではない）。本人の言葉あり**。確度：確定。写真：コモンズにあり（3枚はそろう見込み）。**弱い：題15と同じ試合。ケガは軽い見込みで、出来事が小さい**。時刻：18時以降。見せ方：Y。
