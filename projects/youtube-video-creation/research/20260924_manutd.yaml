sections:
  - id: what
    heading: 過去最高の収入
    tier: 報道
    telop: 負債は10億ポンド超。収入は過去最高の6億7700万ポンド
    narrator: キャスター
    card:
      type: table
      title: 2024-25シーズンの決算
      columns: ['', '']
      rows:
        - [収入, 6億7700万ポンド（過去最高）]
        - [営業利益, 2260万ポンド]
        - [前の年, 1億1320万ポンドの赤字]
        - [負債, 10億ポンド超]
    say:
      - 水曜日、マンチェスター・ユナイテッドが決算を出しました。数字の頭だけ見れば、良い話です。
      - 収入は**6億7700万ポンド**。クラブの記録です。日本円でおよそ**1300億円**。
      - 営業利益は2260万ポンド。前の年は**1億1320万ポンドの赤字**でしたから、たしかに戻りました。
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: said
    heading: クラブの言い分
    tier: 報道
    telop: 「この2年でやってきたことの強さを示している」
    narrator: キャスター
    say:
      - 責任者のオマール・ベラダは、こう話しています。
      - voice: オマール・ベラダ
        text: 記録的な収入を挙げられてうれしい。この2年でやってきたことの強さと、その効きめを示している
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: debt
    heading: 良い話は、ここまで
    tier: 報道
    telop: 負債は10億ポンド超。日本円で1900億円
    narrator: キャスター
    card:
      type: table
      title: 返せていないもの
      columns: ['', '']
      rows:
        - [負債, 10億ポンド超（1900億円）]
        - [去年の12月, 13億ポンド超]
        - [1年ぶんの収入, 6億7700万ポンド]
    say:
      - 良い話はここまでです。**負債は10億ポンドを超えたまま**。日本円で**1900億円**。
      - 過去最高の収入を、まるごと1年ぶん積んでも届きません。
      - 去年の12月は13億ポンドを超えていたので、減ってはいます。桁は変わりません。
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: cut
    heading: どうやって黒字に戻したか
    tier: 報道
    telop: 人を減らし、待遇も下げた。人件費は1年で1100万ポンド減
    narrator: キャスター
    say:
      - では、どうやって黒字に戻したのか。**削りました**。
      - ジム・ラトクリフが加わってから、クラブは人を減らし、待遇も下げています。**人件費は1年で1100万ポンド減**。
      - そして決算を出したその日、クラブはもう1つ、売り物を出しました。
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: pitch
    main: true
    heading: 芝を売る
    tier: 報道
    telop: 芝の1片が125ポンド。前に売ったのは2012-13
    narrator: 解説
    say:
      - text: '1300億円の収入を発表したその日、クラブはオールド・トラッフォードの芝を売りに出しました。'
        short_only: true
      - "**芝**です。夏に張り替えて、剥がしたオールド・トラッフォードの芝。**1片125ポンド**、日本円でおよそ**2万5000円**。"
      - 透明なガラスに封じ込めて、スタジアムの写真と一緒に箱へ。そういう形で届きます。
      - クラブはこれを、「ユナイテッドのファンへの**完璧な贈り物**」と呼んでいます。
      - 1300億円を稼いだ会社が、2万5000円で草を売る。それが同じ日の出来事でした。
      - 前に芝を会員へ売ったのは、**2012年から13年のシーズン**。十数年ぶりに、同じ手を使いました。
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: why
    heading: ピッチの上は12位
    tier: 報道
    telop: リーグは12位。夏の補強は1億5000万ポンド
    narrator: キャスター
    say:
      - では、その芝を張り替えたピッチの上はどうなっているか。プレミアリーグは**5試合で1勝、12位**です。
      - リーグカップでは、そのオールド・トラッフォードで**2対0とリードしながらブライトンに敗れました**。
      - 夏の補強に使ったのは**1億5000万ポンド**。バレバ、アンドレイ・サントス、ティーレマンスの3人です。
      - 1人あたり5000万ポンド。**売っている芝に直すと、ひとり40万枚ぶん**です。
      - ラトクリフが買ったのは一部で、**株の多くを持っているのはいまもグレイザー家**です。スタジアムの周りには、その持ち主に抗議する人が集まっています。
    sources:
      - https://www.marca.com/futbol/premier-league/2026/09/23/united-presenta-cuentas-deuda-mil-millones-vende-trozos-cesped-145-euros.html
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 過去最高の収入を喜ぶ声は、ほとんど無かった
    narrator: キャスター
    say:
      - voice: ネット民
        text: また借入金増えててワロタ。イネオスさぁ
      - voice: ネット民
        text: なんか現地はスポンサーに抗議して圧力かけようとしてんのか、だいぶうっぷん溜まってんな
      - voice: ネット民
        text: ラトクリフの功績ってキャリントン改修、新スタ建築計画、後はせいぜいコストカットぐらいか
      - voice: ネット民
        text: 何でコイツ、グレイザーを残してまで買収したんだよ
      - voice: ネット民
        text: 最早降格した方が後々のためになるんじゃないかと思えてきた
      - voice: ネット民
        text: ブランド価値下がってグレイザーも手放すだろうし
      - voice: ネット民
        text: ユナイテッドは復活はしない。落ちていくのを見守るだけ
      - voice: ネット民
        text: 3万の芝生買うの？
      - voice: ネット民
        text: 明けない夜はない。100年後とかには返り咲くさ
        short_voice: true
    sources:
      - https://kizuna.5ch.io/test/read.cgi/football/1789920038/
