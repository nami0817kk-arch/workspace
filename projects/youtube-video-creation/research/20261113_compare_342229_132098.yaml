#   ケイン：22/23 トッテナム 49試合 4302分 32点6A／23/24 バイエルン 45試合 3934分 44点12A／24/25 51試合 3958分 41点14A／25/26 51試合 4050分 61点7A／26/27 15試合 1252分 10点10A
