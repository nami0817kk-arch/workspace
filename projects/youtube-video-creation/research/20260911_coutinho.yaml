sections:
  - id: deal
    heading: 何が決まったか
    tier: 確定
    telop: サントス行きで合意
    narrator: キャスター
    say:
      - フィリペ・コウチーニョのサントス加入が、合意に達しました。
      - 移籍情報の記者ファブリツィオ・ロマーノが伝えています。
      - 契約は今年の年末まで。所属先がない状態からの加入で、メディカルチェックは翌日に行われる予定です。
      - 34歳。残っているのは、メディカルと書類の署名だけです。
