      - https://as.com/futbol/internacional/neymar-ficha-a-coutinho-f202609-n/

  - id: why
    heading: なぜ、いまこの選手なのか
    tier: 報道
    main: true
    telop: ネイマールが右太もものケガ
    narrator: 解説
    card:
      type: table
      title: サントスがトップ下を探している理由
      columns: ["", ""]
      rows:
        - ["ネイマール", "右の大腿直筋を負傷（クラブが公式に発表）"]
        - ["順位", "ブラジル全国選手権で下位"]
    say:
      - この2人は、ブラジルの下部組織で一緒でした。
      - まだ15歳ほどの頃からの親友だと伝えられています。
      - そのサントスは、トップ下を探していました。
      - 1週間ほど前、クラブがネイマールの負傷を公式に発表しています。
      - 右の太ももの前側、大腿直筋のケガでした。
      - そこが空いたまま、チームはブラジル全国選手権で下位に沈んでいます。
      - 勝ち点を積むことが、いま必要な状況です。
      - 昨季のヴァスコ・ダ・ガマでの数字は、良いものではありませんでした。
      - それでもクラブは、かつて世代を代表した選手に賭けました。
    official: false
    sources:
      - https://as.com/futbol/internacional/neymar-ficha-a-coutinho-f202609-n/
      - https://x.com/FabrizioRomano/status/2098139769863602395

  - id: two
    heading: ここまでの道のり
    tier: 報道
    telop: ブラジルの下部組織で一緒だった2人
    narrator: 解説
    say:
      - 10年ほど前、コウチーニョは世界で最も求められる選手の1人でした。
      - リヴァプールで、ユルゲン・クロップのもとで一気に伸びています。
      - バルセロナは1億6000万ユーロを払いました。
      - ただ、カンプ・ノウでの日々が、その金額に見合うことはありませんでした。
      - ケガと移籍の選択が重なります。
      - アストン・ヴィラでウナイ・エメリのもとでも結果が出ず、欧州を離れました。
      - 戻った先がヴァスコ・ダ・ガマでした。
      - 昨季の終わりに契約が切れ、所属先のない状態になっています。
      - 複数のオファーがあったなかで、サントスが説得に成功しました。
      - ネイマールが戻るまで、その位置を埋めることになります。
    official: false
    sources:
      - https://as.com/futbol/internacional/neymar-ficha-a-coutinho-f202609-n/
      - https://x.com/FabrizioRomano/status/2098139769863602395
