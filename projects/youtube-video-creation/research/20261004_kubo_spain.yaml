# 取材メモ（10/4 題材 kubo_spain、型は quote）。材料の控えは research/raw/20261004_kubo_spain.md。
# 10/3 練習後の取材で、久保建英が W杯王者スペインと日本の差を語った言葉が主役。結婚の話は冒頭の1行だけ（10/3 に結婚の回を出している）。
# 10/2 の「代表先発（出場時間）」「今季の数字」とは重ねない（W杯での久保の出場・クラブの数字は言わない）。
# 見立て: 久保の言う「認める側／認められる側」を数字で。W杯の結果・FIFAランキング・W杯メンバーの所属（自国リーグ・他国の選手の受け入れ）・市場価値の合計。
#   依頼文の「日本はベスト16」は誤り。48か国制で日本はラウンド32（決勝トーナメントの1回戦）でブラジルに敗れた。
# 記者の補い「(他の国を)」「(右肩上がりに)」は読まない。勤勉さの発言は他人の声の量を抑えるため語りで言い換えた。
# 写真: ゲキサカ（©Kaoru WATANABE/GEKISAKA）。02 は 10/3 の練習（冒頭・サムネ）、01 はこの取材の顔のアップ（4:3 のまま）。
