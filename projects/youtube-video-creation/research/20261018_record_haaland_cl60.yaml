# 取材メモ（10/18 日、シリーズ「記録の解説」、key: record_haaland_cl60、型は news）。
# ハーランドのチャンピオンズリーグ60得点は何試合目か。歴代の最速と並べる。軸＝「何試合目で60点に届いたか（最速）」と1試合あたり。
#
# ★重ならないように（10/15 の PSG 対シティのショート scripts/20261015_psg_city_cl.md は「53分と75分に決めた」試合の話）：
#   今回は**記録（60試合目・歴代最速・他選手との試合数の比べ）**が主役。試合の中身は1節の頭で触れるだけ。10/15 の文は使っていない。
#   10/15 の候補メモ（research/20261016_topics_src.yaml）の見出し『CL史上最年少で60得点』は**本文未読の見出し**で、軸を「最年少」でなく「何試合目か」に替えた。
#   年齢は UEFA の表を読んだ事実として1行だけ（メッシと1日差）。
#
# ★物差し（冒頭で言う）：「チャンピオンズリーグに出た試合の数で、通算の得点を数える」。クラブは問わず通算（サルツブルク・ドルトムント・シティ）。
#   ノルウェー代表の得点は入れない。UEFA の数え方に従う（予選の扱いは UEFA の頁に説明が無く、言っていない）。
#
# ★数字の出どころ（2026-10-18 に原文を読んだ）
#   ・UEFA.com「Champions League goalscoring milestones: Erling Haaland quickest and youngest to 60, Kylian Mbappé youngest to 70」（WebFetch で本文を読んだ）：
#       「Haaland had scored 57 goals in 58 Champions League games by the end of the 2025/26 season」「reached 60 goals on Matchday 2 in 2026/27, beating Lionel Messi's marks as the fastest and youngest」。
#       **60点までの試合数（少ない順）**：ハーランド60（26歳85日）／メッシ80（26歳86日）／レヴァンドフスキ85（31歳97日）／ムバッペ89（26歳284日）／C・ロナウド98（29歳21日）／ベンゼマ111（31歳56日）／ラウール115（30歳237日）。
#       **区切りの試合数**：30点＝ハーランド25・ファン・ニステルローイ34・ケイン45・レヴァンドフスキ46・メッシ48・ムバッペ51／40点＝35・45・57・ムバッペ59・メッシ61・レヴァンドフスキ61／50点＝49・ファン・ニステルローイ62・メッシ66・ケイン66・レヴァンドフスキ77・ムバッペ79・ベンゼマ88・ロナウド91。
#       50点の若さ（年齢）：メッシ24歳284日、ハーランド25歳59日。
#   ・UEFA.com「Erling Haaland in the Champions League: Records, stats…」（2026-10-14 の日付。本文を読んだ）：**61 goals in 60 Champions League appearances**。
#       クラブ別：サルツブルク6試合8点／ドルトムント13試合15点／シティ41試合38点（8+15+38＝61、6+13+41＝60 を自分で足して一致）。
#       2026/27 の1戦目：ポルト 0-2 シティ、ハーランド2点（57+2＝59点・59試合目。自分で足した）。初のCLゴールは2019-09-17 のゲンク戦（サルツブルク、前半ハットトリック。ウィキペディアも同じ）。
#       区切り表（ハーランド7・14・25・35・49・60／メッシ23・40・48・61・66・80／ムバッペ15・40・51・59・79・89／レヴァンドフスキ16・36・46・61・77・85／ベンゼマ14・34・50・67・88・111／ロナウド37・56・74・82・91・98）。
#       **この表のメッシの20点＝40試合は、同じ頁の文では36試合と食い違う（レヴァンドフスキも同じ頁で36）ので20点の列は使わない。** 台本が使うのは30〜60点だけで、別の UEFA 頁と一致を確かめた。
#   ・UEFA.com「Who has scored the most Champions League goals in their first ten, 20, … games?」（2026-10-14 更新。本文を読んだ）：**最初の N 試合の得点**。
#       10試合＝ハーランド12／20＝25／30＝35／40＝41／50＝52／60＝61（2位以下：60試合はファン・ニステルローイ48・ケイン45・ムバッペ40・メッシ39・レヴァンドフスキ39）。
#       ここから、**ハーランドは10試合ごとの区切りの全部で、試合数を上回る得点**（+2,+5,+5,+1,+2,+1。自分で引いた）。
#   ・マンチェスター・シティ公式（mancity.com）の試合記録「City lose to PSG in action-packed Champions League clash」（2026-10-14、requests で本文を読んだ）：
#       **シティ 2-4 PSG、エティハド。得点は 13分ドゥエ・15分デンベレ・32分ヴィティーニャ・62分アクリウシュ（PSG）、53分・75分ハーランド（シティ）。**
#       「Haaland's header was his 37th goal for Champions League, surpassing Sergio Aguero」「a second took his overall tally in the competition to 61」。
#       **→ 53分が通算60点目（その時点でシティ37点目＝8+15+37＝60）、75分が61点目（自分で足した）**。UEFA の頁は「どちらの得点が60点目か」を書いていない。
#       アシスト：53分はイリマン・ンディアイのクロス、75分はアユブ・ブアディのクロス（クラブ公式の試合記録）。**観客は欧州の試合で同スタジアム最多の60,021人**（台本では言わない）。
#       **試合の節（マッチデー）の番号は、UEFA の頁が「2節」、クラブの報道では「3試合目」と読める記述があり、確かめられなかった。台本は節の番号を言わない。**
#   ・マンチェスター・シティ公式「Haaland becomes quickest to 50 Champions League goals」（2025-09-18、requests で読んだ）：50点＝49試合、2位ファン・ニステルローイ62。
#       画像（クラブ公式の図）の表：ハーランド49・ファン・ニステルローイ62・メッシ66・レヴァンドフスキ77・ムバッペ79・ベンゼマ88・ロナウド91・ラウール97・アンリ103・ミュラー130。**UEFA の表と一致**。
#   ・ウィキペディア（英語版 Erling Haaland、背景）：2000-07-21 生まれ、2019 サルツブルク、2020-01 ドルトムント、2022 シティ。
#   ・BBC は WebSearch が引けず原文未読（言っていない）。スカイスポーツの試合記録は「53分・75分」「2-4」「エティハド」を確認（60点の記録の記述は無い）。
#
# ★自分で数えたもの（検算済み）
#   60点目の時点の1試合あたり：ハーランド 60÷60＝1.00／メッシ 60÷80＝0.75／レヴァンドフスキ60÷85＝0.71／ムバッペ60÷89＝0.67／ロナウド60÷98＝0.61。
#   ハーランドとの試合数の差：メッシ+20／レヴァンドフスキ+25／ムバッペ+29／ロナウド+38／ベンゼマ+51／ラウール+55。
#   **1位と2位の差20試合は、2位メッシと3位レヴァンドフスキの差5試合の4倍**（80→85）。
#   メッシとの区切りの差：30点 48−25＝23／40点 61−35＝26（最大）／50点 66−49＝17（最小）／60点 80−60＝20。
#   クラブ別の1試合あたり：サルツブルク 8÷6＝1.33／ドルトムント 15÷13＝1.15／シティ 38÷41＝0.93。サルツブルクとドルトムント合わせて 23÷19＝1.21。
#   最初の60試合の1試合あたり：ハーランド61÷60＝1.02／ファン・ニステルローイ48÷60＝0.80／ケイン45÷60＝0.75／ムバッペ40÷60＝0.67／メッシ・レヴァンドフスキ39÷60＝0.65。
#   ハーランド61÷メッシ39＝1.56倍。2位との差61−48＝13点。
#   **70点の最速はメッシの90試合（UEFA の記録頁）。ハーランドが89試合目までに70点なら更新。今は60試合で61点なので、61〜89試合目の29試合で9点＝1試合あたり0.31（これまでの1.02の約3割）。予想はしない（条件の話だけ）。**
#   年齢（ハーランド 26歳85日）は 2000-07-21 から 2026-10-14 までを自分で数えて一致。メッシは26歳86日（UEFA）で、**ハーランドが1日若い**。
#   50点の年齢はメッシが先（24歳284日 対 25歳59日。約140日差）。60点でハーランドが逆転。**台本は『24歳』『25歳』とだけ言う（『59日』を合成音声が『ク』ニチ』と誤読するため。日数の読みは config 側で直せない）**。
#
# ★言い切っていないもの
#   ・UEFA の「出場した試合」の数え方（予選・途中出場の扱い）は頁に説明が無い。台本は「チャンピオンズリーグに出た試合」とだけ言う。
#   ・「どちらの得点が60点目か」は UEFA の頁に無く、クラブ公式の合計（61点）から逆算して53分と言っている。台本は「後半8分の1点目が60点目」と言い、根拠は61点（クラブ公式）。
#   ・相手の強さ・試合の中身は数字に出ない（見立てで断る）。シティの1試合あたり（0.93）がサルツブルク・ドルトムントより低いのは、**選手を小さく見せる材料にしない**（メッシの最初の60試合の0.65より上、と並べて言う）。
#   ・メッシ・ロナウドの通算の総得点は今回読んでいない（言わない）。
# 反応・本人の言葉は入れない（voice_min: 0）。ブラウザの道具・JavaScript は使っていない（WebFetch・WebSearch・requests のみ）。
#
# ★写真（目で見た。assets/images/20261018_haaland/ 、credits.json に控え）：
#   サルツブルク：Commons File:FC RB Salzburg versus SV Mattersburg (4. Juli 2019) 29.jpg（CC BY-SA 4.0、Werner100359。01_salzburg）。
#   ドルトムント：ボルシア・ドルトムント公式（bvb.de。2020-11-04 の記事のギャラリー。02・03。横1760px）。**02 の顔検出は隣のゲレイロを拾ったので `--face 1` で直した**。
#   シティ：Commons 2023-10 ライプツィヒ戦（Jacek Stanislawek、CC BY-SA 4.0。04。CLの試合）／2024-07 米国練習（Hameltion、05）／クラブ公式の「50点」図の右側の本人（文字の無い700x1080。06。縦のみ）。
#   ノルウェー代表：Commons 2025-06 イタリア戦（MichaelEmilio、CC BY 4.0。07）／2026-06 モロッコ戦・フランス戦（Bryan Berlin、CC BY-SA 4.0。08・09）。
#   **代理店・透かしは無し。**
