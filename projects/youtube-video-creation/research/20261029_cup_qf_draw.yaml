#   ・フットボールチャンネル（post1042137 抽選、post1042125 パレス）: 冨安健洋は負傷でメンバー外。パレスは公式戦5試合ぶりの勝利（直近4試合は3敗1分け）。
# 言わないこと: フットボールチャンネルの「ホーム＆アウェー方式」（Daily Mail と ESPN は1試合の記述で食い違う）。遠藤の今季の出場時間（今日読んだ本文に無い）。エヴァートン対ニューカッスルの結果（木曜の試合で、まだ出ていない）。
#   ボーンマスの「3試合続けての3-0」（相手がミラン・マンUの記述は今日の本文だけでは裏が取れない）。10/28 のフリートウッド対アーセナルの話の言い直し。
