  - id: xavi
    heading: 初陣のシャビ
    tier: 報道
    telop: 「正直に言って、ドイツより良かった」
    narrator: キャスター
    say:
      - シャビは試合後、はっきり言い切りました。
      - voice: オランダのシャビ監督
        text: 満足している、とても良いプレーだったから。正直に言って、ドイツより良かったと思う
      - voice: オランダのシャビ監督
        text: 前半は少し緊張していたかもしれないが、後半のやり方が正しい。これが道だ。これが基準でなければならない
      - voice: オランダのシャビ監督
        text: ルベン・ファン・ボメルが違いを作った。これが我々に必要なものだ
    sources:
      - https://www.infobae.com/espana/agencias/2026/09/24/xavi-satisfecho-en-su-debut-como-seleccionador-de-unos-paises-bajos-con-ambicion/
      - https://www.vi.nl/nieuws/xavi-is-heel-blij-met-tweede-helft-en-gaat-vervanger-voor-brobbey-oproepen
  - id: gakpo
    main: true
    heading: ガクポが怒った場面
    tier: 報道
    telop: 「僕らからすれば、あれは単純に非スポーツ的だ」
    narrator: キャスター
    say:
      - text: 'シャビのオランダ初陣で同点弾を決めたガクポが、ドイツの先制点についてこう言いました。'
        short_only: true
      - ドイツの先制点の直前、ブロビーが接触なしでハムストリングを痛めて座り込んでいました。ドイツは止めずに攻め、ヌメチャが押し込んだ。ガクポは、そこを責めました。
      - voice: ガクポ
        text: あいつらのゴールから始まった。僕らからすれば、あれは単純に非スポーツ的だ
      - voice: ガクポ
        text: ルールはない。でも、誰かが負傷して倒れていてプレーが続いているなら、止めるのが普通だと思う。彼らはそうしないと決めた
      - text: 'ファン・ダイクも。'
        image: assets/images/20260925_pair_vandijk_xavi/01.jpg
      - voice: ファン・ダイク
        text: 最初は戻したのに、結局続けた。ボールは出すべきだと思うが、そうならなかった。不運だった
      - text: 'ドイツ側は、逆のことを言っています。'
        image: assets/images/20260925_pair_kimmich_xavi/01.jpg
      - voice: ヨシュア・キミッヒ
        text: 毎年審判講習で、ああいう場面は続けろと教わっている。ボールを外に蹴り出すルールなんて、単純に存在しない
      - voice: ユルゲン・クロップ
        image: assets/images/20260925_pair_klopp_xavi/01.jpg
        text: ルールもそうなっている。続行される。選手はボールを外に出すなと指示されている。あの状況を見事に使った
    sources:
      - https://www.fcupdate.nl/voetbalnieuws/2026/09/gakpo-hekelt-onsportieve-actie-duitsland-dat-scoorde-terwijl-brobbey-geblesseerd-was
      - https://www.vi.nl/nieuws/van-dijk-gematigd-tevreden-na-debuut-xavi-bij-oranje-er-zit-nog-veel-meer-in
      - https://www.sportschau.de/fussball/nationalmannschaft/ball-ins-aus-spielen-die-falsche-erwartung-ans-fairplay,fairplay-118.html
      - https://www.t-online.de/sport/fussball/nationalmannschaft-deutschland/id_101451626/juergen-klopp-das-sagt-der-bundestrainer-zu-umstrittenem-dfb-tor.html
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「フライングダッチマン」と「止めなくて正解」
    narrator: キャスター
    say:
      - voice: ネット民
        text: ガクポのボレーがスーパーすぎる。まさにフライングダッチマン
        image: assets/images/20260925_xavi_vi/01.webp
      - voice: ネット民
        text: ファンボメル息子、短い出場時間ながらいいシュートと見事な同点アシスト
      - voice: ネット民
        text: クーマンの時よりはオランダっぽいチームにはなってるなw
      - voice: ネット民
        text: 名将シャビだな
      - voice: ネット民
        text: シャビ、ありがとう、これは断然良く見える
      - voice: ネット民
        text: この戦い方を見られて何という安堵。ハイプレスで強度が高い。W杯の全チームがそうだった、クーマンのオランダ以外は
      - voice: ネット民
        text: ファン・ボメルは15分で主役！　メーアディンクとフェールマンは堂々の8点！
      - voice: ネット民
        text: 父親とはまるで違う、良い意味で。PSVは本当に金を握っている
      - voice: ネット民
        text: 何と言おうと、ファン・ボメルのパスは世界級。ガクポの仕上げも見事
      - voice: ネット民
        text: 負傷者がいるからボールを出すのはフェアプレーじゃなくて温情。プレーを続ける判断をしているのは選手じゃなく審判
      - voice: ネット民
        text: 頭を打ったや何か急病じゃない限り、そんなすぐ止める必要はないと思う。特に今回のケースは止めなくて正解
      - voice: ネット民
        text: 問題あるのは主審でしょ。ドイツがボールを出せばフェアプレーと賞賛されて当然だが、それをしなかったからと言って批判されるのは理解出来ない
      - voice: ネット民
        text: クロップとチャビ初陣痛み分けでまぁ良かったんじゃないですかね
        short_voice: true
