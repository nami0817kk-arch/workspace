# 取材: 2026-10-22。requests（ブラウザUA）で原文を読んだ。控えは research/raw/20261022_nicopaz_fi.html。
#   ・Football Italia（英語）「Nico Paz: I'll never forget Man United」— 本文を全部読んだ。パスの発言（スカイ・スポーツ・イタリアの試合後インタビュー）はここから訳した。
#       得点の流れ（開始2分に先制／ドゥビカスの2点目をアシスト／単独で3点目／ラモン、ジルクジーの得点が続く）もここ。
#   ・ESPN 試合記録API（site.api.espn.com … uefa.champions scoreboard 20261021・summary event=401915395）— 得点者と時間、シュートを確かめた。
#       2分パス／49分ドゥビカス（アシスト：パスのスルーパス）／57分パス／76分ラモン（ヘディング）／90+1分ジルクジー（マンU）。最終 コモ4-1マンU。
#       パスの数字（ESPN の選手別）：シュート4本・4本とも枠内・2得点・1アシスト。
#   ・ESPN チーム日程API — コモの次の試合：10/24（土）ホームでサッスオーロ（キックオフ 13:00 UTC＝現地15時）、10/27 トリノ。
# 発言（英語の原文を訳した。言い換えない。パスは Sky Sport Italia の試合後インタビューで話した）:
#   「That was one of the most beautiful games of my career, I'll never forget it」→ 僕のキャリアで、最も美しい試合の一つでした。一生、忘れません。
#   「It's more than what I had dreamed of, we played an incredible game.」→ 夢に見ていた以上です。信じられない試合をしました。
#   「We have to continue like this, but this was an historic night for everyone from Como.」→ このまま続けなければいけません。でも、コモのみんなにとって、歴史的な夜でした。
#   「We have to carry on like this, not thinking about where we can go, but to take on every game as if it's our last.」→ どこまで行けるかは考えず、どの試合も最後の試合のつもりで戦うだけです。
#   「I just saw the space and shot. I'm happy to experience nights like these in front of my family.」（先制点について）→ スペースが見えたので打ちました。家族の前で、こんな夜を味わえてうれしいです。
# 確度: 発言は 報道（Football Italia の記事。インタビューの発言として伝えている）。得点と数字は ESPN の試合記録（公式の試合記録に近い）。見立ての節は 背景（自分で数えた比べ）。
# 日付: 試合は10/21（水）夜。記事は「Wednesday evening」。
# 自分で数えた比べ（見立て）: コモの4得点のうち、パスが絡んだのは3つ（2分、49分、57分）。3点目までの3点はすべてパスが絡んだ。シュート4本はすべて枠内（ESPN）。
# 入れなかったこと: ファブレガス監督の会見の言葉（今回の出典では本文を読めていない）。記事の見出しの「マンU戦術へのブルーノの不満」は別の話なので使わない。
#   「CL初参戦」「歴史的な夜」はパス本人の言葉としてだけ引く（こちらから言い切らない）。ジルクジーの得点は90+1分（ESPN）だが、本編では使わない。
# 反応: 取れなかった（この題材のために探していない／作らない）。approve は --no-voices で。
# 写真: Commons の Nico Paz（Como）の写真を photopool と commons で集める。Getty（代理店）の記事主写真は使わない。出典は credits.json。
