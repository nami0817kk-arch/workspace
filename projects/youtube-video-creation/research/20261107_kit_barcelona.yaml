# ユニフォームとエンブレムの歴史 バルセロナ（11/5 作成、11/7 分）。ラ・リーガの1本目。雛形は 11/5 フラム回。
# 題の問い：1899年の創設から107年、胸の真ん中に何も入れなかったバルセロナ。最初に入った名前は？（答え＝ユニセフ。しかもクラブがお金を出す側）
# 選んだ理由：プレミアの20クラブは 11/5 のフラムで出し切った（指示書 20261107）。ラ・リーガの大きいクラブから。
#   同じ日のスタジアム紹介はレアル・マドリード（research/20261107_picks.txt）→ 同じクラブを避けてバルセロナ。
#   外した候補：レアル・マドリード（同じ日のスタジアムと重なる。直近30日にクラブ紹介・財政2本もある）。アトレティコ（11/1 にスタジアム、11/5 に選手紹介バリオス）。
# 重なり確認（2026-11-05）：scripts/*kit_* にバルセロナ・ラ・リーガのクラブは無し。research/covered.yaml・posted.json にユニフォームのバルセロナは無し。
#   近いもの：20261105_stadium_barcelona（2日前・スタジアム。収容・改装・入場の話）、20261018_finance_real_barca（財政の比べ）、20261003_finance_barcelona（33日前）。
#   この回では、本拠地の名前・収容・改装・クラシコの入場（6万2055）は言わない。スポティファイは「胸」の話だけ。
# 今季のリーグ：ウィキペディア en "2026–27 FC Barcelona season"（ラ・リーガ。Kits の節＝供給 ナイキ、胸 スポティファイ、袖 マイディア、背中 バルサ財団）。
# 取材：requests と WebFetch・WebSearch だけ。ブラウザ操作・JS実行は使っていない。
#   読んだ：クラブ公式「El escudo」（fcbarcelona.es/es/club/identidad/escudo）、クラブ公式「Sixteen previous FC Barcelona games in Japan」（2023-06-05）、
#     クラブ公式 財団30周年の記事（ユニセフの合意 2006-09-07 国連本部・年150万ユーロの寄付・「初めての胸のスポンサー」）、
#     クラブ公式 楽天の発表（2016-11-16、2017-18〜2020-21＋1年の選択権）・延長の発表（2020-11-06、2021-22 季まで）、
#     クラブ公式 2026-27 のユニフォーム発表（2026-06-30）、クラブ公式 クラシコのシャツにタイラー・ザ・クリエイター（2026-10-15）、
#     ウィキペディア en "FC Barcelona"（Kits and crest）、es "Historia del uniforme del Fútbol Club Barcelona"、ca "Equipació del Futbol Club Barcelona"・"Símbols del Futbol Club Barcelona"・"Escut del Futbol Club Barcelona"。
# ---- 食い違い・断ったこと ----
#   ・1910年の紋章の作者：クラブ公式の紋章の頁とカタルーニャ語版は「サンティアゴ・フェメニア」、英語版とクラブ公式のコママラの人物記事は「カルレス・コママラ」→ 台本では名前を言わず「会員から案を募った」とだけ言う。
#   ・フランコ政権下で頭文字が C.F.B.・4本の線が2本：クラブ公式（年は書かない）。カタルーニャ語版は 1941〜1949。→ 台本は「1940年代」。
#   ・1949年に4本に戻る（創立50年）・1974年の終わりに元の頭文字：クラブ公式。2002年の作り直し（クラレット・セラヒマ、点を消し、尖りを減らす）：クラブ公式。台本では名前は言わない。
#   ・色の由来：決め手は無い（es・ca とも）。1924年11月29日の新聞（ラ・バングアルディア）に、創設の集まりにいたナルシス・マスフェレーが「バーゼルと同じ色」と書いた（es・ca が 2008年の同紙の記事を引く）。→「〜と書いています」と言う者を付ける。原文の新聞は読んでいない。
#   ・最初の10年のシャツ（半分ずつ・袖は逆・パンツは白）、縦じまは 1909-10 季、パンツは 1913年ごろ黒→7年後に青：ca "Símbols"。es は「最初の10年は白、のち黒、1920年代から青」で大筋は一致。
#   ・1990年の日本での2試合で胸に日本航空のロゴ（主催者の求め）：es・ca のウィキペディアだけ（出典は Sport 2019-07-20 の記事。読めなかった）。クラブ公式は「1990年に初めて日本へ、2試合、広島で1対1、東京で4対2」までで、ロゴは書いていない。
#     →「とされています」と言う。親善試合なので、107年の「胸に何も無かった」の数え方は「公式の試合」と断らずに「例外が2試合だけ」と言う。
#   ・クラブ公式の日本の記事は相手を「All Star J-League team」と書くが、Jリーグは1993年から → 台本は「日本の選抜チーム」。
#   ・カタール財団の額（年3000万ユーロ）：es・ca のウィキペディア（2010-12-10 の発表）→「伝えられた額」と言う。
#   ・楽天の額（年5500万ユーロ）は報道だけでクラブの頁に無いので言わない。スポティファイの額も言わない。
#   ・スペインのクラブが胸の広告を始めたのは1981年：ウィキペディア en。
# ---- 自分で数えた数 ----
#   胸が空いていた：1899（創設）→2006（ユニセフ）＝107年。
#   胸の名前（2006-07〜今季 2026-27 の21季）：ユニセフ 5季（2006-07〜2010-11）・カタール財団 2季（2011-12〜2012-13）・カタール航空 4季（2013-14〜2016-17）・楽天 5季（2017-18〜2021-22）・スポティファイ 5季（2022-23〜今季）＝5つで21季。21÷5＝4.2季。
#   お金の向き：ユニセフ＝クラブが年150万ユーロを出す／カタール財団＝クラブが年3000万ユーロを受け取る（伝えられた額）。3000÷150＝20倍。
#   紋章：1910年→2026年＝116年。
#   クラシコの胸の歌手・音楽家：クラブ公式（2026-10-15）＝タイラー・ザ・クリエイターの前に8組（オリビア・ロドリゴ、エド・シーラン、トラヴィス・スコット、コールドプレイ、カロルG、ローリング・ストーンズ、ロザリア、ドレイク）→ 今季で9組目。es は 2022-23 からの各クラシコと書く。
# ---- 日本との接点 ----
#   ①1990年、初めての日本で2試合（クラブ公式）。胸に日本航空のロゴとされる（es・ca）。②2017-18〜2021-22 の5季、胸は日本の楽天（クラブ公式）。③2019年夏、日本で楽天カップ（チェルシーに1対2、ヴィッセル神戸に2対0。クラブ公式）。
# 言わなかったもの：楽天・スポティファイ・ナイキの額／本拠地の名前と工事（2日前のスタジアム回）／紋章の作者の名前（食い違い）／2005-06 季のえんじのパンツ。
# 写真：assets/images/20261107_kit_barcelona/（credits.json）。Commons（CC BY・CC BY-SA）。代理店・放送映像・エンブレム画像は使っていない。
