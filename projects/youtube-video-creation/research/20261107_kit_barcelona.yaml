sections:
- id: chest
  main: true
  heading: 107年空いていたバルセロナの胸に、最初に入った名前は何だったのか
  bg: assets/images/20261107_kit_barcelona/p_copa_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1899年から2006年まで、胸には何も無かった。最初の名前はユニセフ。クラブがお金を出す側だった
  card: *chest
  say:
  - text: 今回はバルセロナ。青とえんじのシャツと、紋章と、胸に入った名前の話です。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
  - text: スペインのクラブが、シャツの胸に会社の名前を入れ始めたのは、1981年。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *chest
      highlight_row: 1
  - text: それでもバルセロナは、胸の真ん中を、空けたままにしました。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
    emph: true
  - text: 1899年に生まれてから、2006年まで、107年です。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *chest
      highlight_row: 0
    callword: 107年、空白
  - text: では、その空白を、最初に破ったのは、何だったのか。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: 2006年9月、クラブは、ニューヨークの国連本部で、ひとつの合意を結びます。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: 胸に入ったのは、ユニセフ。子どもを支える、国連の機関です。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card:
      <<: *chest
      highlight_row: 2
    emph: true
  - text: ただ、ふつうの胸の広告とは、お金の向きが逆でした。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: クラブが受け取るのではなく、毎年150万ユーロを、寄付する約束です。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: *unicef
    emph: true
  - text: 胸のユニセフは、2006年から、5シーズン続きました。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: そして2011年。初めて、お金を受け取る胸の広告が入ります。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card: none
  - text: カタール財団です。伝えられた額は、年間3000万ユーロでした。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card:
      <<: *chest
      highlight_row: 3
  - text: ユニセフの名前は、胸から背中の番号の下へ移りました。
    image: assets/images/20261107_kit_barcelona/p_back_w.jpg
    card: none
  - text: 2013年からは、同じカタールの、カタール航空が胸に入りました。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://www.fcbarcelona.com/en/news/4060200/fc-barcelona-foundation-celebrates-30th-anniversary-with-new-website
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_F%C3%BAtbol_Club_Barcelona
- id: japan
  heading: バルセロナの胸に、日本の名前が入ったのはいつか
  bg: assets/images/20261107_kit_barcelona/p_rakuten_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1990年に初めての日本で2試合。2017年から5季、胸は日本の楽天
  card: *japan
  say:
  - text: バルセロナの胸には、日本の名前も入っています。
    image: assets/images/20261107_kit_barcelona/p_rakuten_w.jpg
    card: none
  - text: 2017年から、胸に入ったのは、日本の楽天でした。
    image: assets/images/20261107_kit_barcelona/p_rakuten_w.jpg
    card:
      <<: *japan
      highlight_row: 1
    emph: true
    callword: 胸に日本の楽天
  - text: 4シーズンの契約に、1年の延長が付き、2022年まで胸にありました。
    image: assets/images/20261107_kit_barcelona/p_rakuten_w.jpg
    card:
      <<: *japan
      highlight_row: 3
  - text: 2019年の夏には、日本で、楽天カップという親善試合も開かれました。
    image: assets/images/20261107_kit_barcelona/p_rakuten_w.jpg
    card:
      <<: *japan
      highlight_row: 2
  - text: チェルシーに1対2で敗れ、ヴィッセル神戸を2対0で下しました。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: 日本との縁は、もっと古くからあります。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: 初めて日本に来たのは、1990年。日本の選抜チームと、2試合を戦いました。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card:
      <<: *japan
      highlight_row: 0
  - text: 広島で1対1の引き分け、東京で4対2の勝ちです。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: この2試合だけは、主催者の求めで、胸に日本航空のロゴを付けたとされています。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
    emph: true
  - text: 107年の空白の中の、たった2試合の例外です。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  sources:
  - https://www.fcbarcelona.com/en/news/814105/rakuten-sign-up-as-fc-barcelonas-new-main-global-partner
  - https://www.fcbarcelona.com/en/news/1888727/fc-barcelona-and-rakuten-extend-partnership-for-the-202122-season-exercising-the-option-contained-in-the-original-agreement
  - https://www.fcbarcelona.com/en/news/3317248/sixteen-previous-fc-barcelona-games-in-japan
  - https://ca.wikipedia.org/wiki/Equipaci%C3%B3_del_Futbol_Club_Barcelona
- id: colors
  heading: 青とえんじの色は、どこから来たのか
  bg: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
  tier: 背景
  narrator: 解説
  telop: 色を決めたのは1899年11月29日の創設の集まり。バーゼルと同じ色とする記録がある
  say:
  - text: バルセロナの色は、青と、えんじ。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: この色がどこから来たのか、決め手になる記録は、見つかっていません。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
    emph: true
  - text: 手がかりのひとつが、1924年の新聞記事です。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: 1899年11月29日、クラブをつくる集まり。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: *colors
  - text: その場に立ち会った人が、こう書いています。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: *colors
  - text: 色は、創設者ガンペルが少し前までいた、スイスのバーゼルと同じだ、と。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: *colors
    emph: true
    callword: バーゼルと同じ色
  - text: ほかにも、会計で使う赤と青の鉛筆から、という説もあります。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
  - text: ただ、どれも確かめられていません。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
  - text: 最初の10年、シャツは青とえんじが半分ずつ。袖は色が逆で、パンツは白でした。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: *stripes
  - text: いまの縦じまが入ったのは、1909年から10年のシーズンです。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *stripes
      highlight_row: 1
  - text: パンツは、黒を経て、1920年ごろに青へ。いまの形が、ここでそろいます。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *stripes
      highlight_row: 3
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_F%C3%BAtbol_Club_Barcelona
  - https://ca.wikipedia.org/wiki/S%C3%ADmbols_del_Futbol_Club_Barcelona
- id: crest
  heading: 胸の紋章は、なぜ形を変えられたのか
  bg: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
  tier: 背景
  narrator: 解説
  telop: 市の紋章から1910年の自分たちの紋章へ。1940年代に頭文字と線を変えられ、1949年と1974年に戻した
  card: *crest
  say:
  - text: 胸の紋章にも、歩みがあります。
    image: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
    card: none
  - text: 生まれたころの胸にあったのは、バルセロナ市の紋章でした。
    image: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 1910年、クラブは会員から案を募り、自分たちの紋章を決めます。
    image: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
    card:
      <<: *crest
      highlight_row: 1
    emph: true
  - text: 左上に、カタルーニャの守り聖人、サン・ジョルディの赤い十字。
    image: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
    card: none
  - text: 右上に、カタルーニャの旗の、4本の赤い線。
    image: assets/images/20261107_kit_barcelona/p_wembley_w.jpg
    card: none
  - text: 真ん中に、頭文字。下に、青とえんじと、ボールです。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: ところが1940年代、独裁者フランコの政権のもとで、紋章は変えられます。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card:
      <<: *crest
      highlight_row: 2
    emph: true
  - text: 頭文字はスペイン語の形に。4本の赤い線は、2本に減らされました。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card:
      <<: *crest
      highlight_row: 2
    callword: 4本が2本に
  - text: 4本の線が戻ったのは、1949年。クラブの創立50年の年です。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: 元の頭文字、エフ・シー・ビーに戻ったのは、1974年の終わりでした。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: そして2002年。頭文字の間の点を消し、形を整えたのが、いまの紋章です。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *crest
      highlight_row: 5
  - text: 手が入ったのは、ほとんどが見た目だけ。1910年の形は、いまも変わっていません。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
  sources:
  - https://www.fcbarcelona.es/es/club/identidad/escudo
  - https://ca.wikipedia.org/wiki/Escut_del_Futbol_Club_Barcelona
- id: now
  heading: 今季の胸には、何が起きているのか
  bg: assets/images/20261107_kit_barcelona/p_copa_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2022年からスポティファイ。クラシコの胸には歌手や音楽家のロゴ。10月25日で9組目
  say:
  - text: 2022年からの胸は、音楽の配信の会社、スポティファイです。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *chest
      highlight_row: 5
  - text: この胸は、レアル・マドリードとのクラシコの日だけ、替わることがあります。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
    emph: true
  - text: 入るのは、歌手や音楽家のロゴ。最初は、ドレイクとロザリアでした。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: *artists
  - text: 今季は、10月25日のクラシコでした。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *artists
      highlight_row: 4
  - text: 胸に入ったのは、アメリカのラッパー、タイラー・ザ・クリエイターのブランド。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
  - text: クラブによれば、これで9組目です。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
    emph: true
  - text: シャツを作るのは、1998年からナイキです。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: 左の袖には、今季から、中国の家電の会社、ミデアの名前。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  - text: 背中には、クラブの財団、バルサ財団の印も入りました。
    image: assets/images/20261107_kit_barcelona/p_inter_w.jpg
    card: none
  sources:
  - https://www.fcbarcelona.com/en/club/news/4592373/upcoming-clasico-jersey-to-feature-the-logo-of-tyler-the-creator
  - https://www.fcbarcelona.com/en/club/news/4528818/fc-barcelona-presents-new-202627-kit-with-unique-show-at-the-macba-museum
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_FC_Barcelona_season
- id: view
  viewpoint: true
  heading: 見立て・107年守った胸は、その後の21季で何回替わったのか
  bg: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
  tier: 背景
  narrator: 解説
  telop: 胸の空白は107年。2006年からの21季で胸の名前は5つ、平均4.2季。お金の向きは、出す150万から受け取る3000万へ、20倍
  card: *view
  say:
  - text: バルセロナの胸を、数で並べます。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card: none
  - text: 胸が空いていたのは、1899年から2006年までの、107年。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card:
      <<: *view
      highlight_row: 0
  - text: そこから今季までの21シーズンで、胸の名前は5つです。
    image: assets/images/20261107_kit_barcelona/p_unicef_w.jpg
    card:
      <<: *view
      highlight_row: 1
    mark:
      kind: circle
      row: 1
  - text: ユニセフ、カタール財団、カタール航空、楽天、スポティファイ。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card: none
  - text: 平均すると、4.2シーズンごとに1度、替わってきました。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card:
      <<: *view
      highlight_row: 2
  - text: お金の向きも変わりました。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card: none
  - text: 出す側から、受け取る側へ。受け取る額は、出していた額の20倍です。
    image: assets/images/20261107_kit_barcelona/p_statue_w.jpg
    card:
      type: calc
      title: 受け取る額と出した額（自分で割った）
      terms:
      - - 3000万
        - カタール財団から
      - - 150万
        - ユニセフへ
      - - 20倍
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 一方、1910年の紋章の形は、116年。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: 胸の名前は数年ごとに替わっても、紋章と色は、ほとんど変わらずに残ってきました。
    image: assets/images/20261107_kit_barcelona/p_copa_w.jpg
    card: none
    emph: true
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://www.fcbarcelona.es/es/club/identidad/escudo
