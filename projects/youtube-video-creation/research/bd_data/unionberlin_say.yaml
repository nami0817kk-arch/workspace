data:
- 創立は**1966年**。前身は、1906年にできたクラブです。
- 本拠地のアルテ・フェルステライには、**2万2012人**が入ります。
- 東ドイツカップは、1968年に**1回**優勝しています。
- ヨーロッパでは2023年、チャンピオンズリーグに初めて出場しました。
- 昨季は**11位**。勝ち点39で、1部に残りました。
data_focus: [0, 3, 5, 6, 8]

story_sections:
  - id: stadium
    heading: ファンが自分で建てた本拠地を、ウニオンはなぜ今季かぎりで離れるのか
    tier: 背景
    telop: 2008年に改修を決め、ファン2000人超が14万時間働いた。今季が現スタジアム最後の季
    narrator: 解説
    main: true
    say:
      - text: 本拠地のアルテ・フェルステライは、1920年に開場した、古い競技場です。
        image: assets/images/bd_unionberlin_builders/scene.jpg
      - 2008年、クラブは建て直しを決めます。
      - お金が足りなかったので、ファンが自分たちで作りました。
      - text: 2000人を超えるファンが、あわせて**14万時間**を働いています。
        card:
          type: stats
          title: 本拠地を建てたファン
          items:
            - ["2000", "人超", "建設に加わったファン"]
            - ["14万", "時間", "あわせて働いた時間"]
            - ["2万2012", "人", "いまの収容人数"]
          focus: 1
      - 正式な開場は、2013年7月12日。セルティックとの親善試合でした。
      - text: 収容は2万2012人。座席は3617で、残りは立ち見席です。
        card: none
        image: assets/images/bd_unionberlin_gegen/scene.jpg
      - 2017年、クラブは3万7000人への増築を発表します。
      - ところが、駅や電車など交通の準備が追いつかず、計画は遅れました。
      - 2025年11月、3万2500人へと見直します。
      - text: 工事のため、今季がいまのスタジアムで戦う最後のシーズンです。
        image: assets/backgrounds/stadium_ウニオンベルリン.png
      - 次の1シーズンは、ベルリンのオリンピアシュタディオンで戦います。
      - 2028年に、広くなったアルテ・フェルステライへ戻る予定です。
      - ゴール裏と下の段は、これからも立ち見席のままです。
    sources:
      - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
      - https://en.wikipedia.org/wiki/Stadion_An_der_Alten_F%C3%B6rsterei
  - id: rise
    heading: 3部リーグにいたウニオンは、どうやって欧州の舞台までたどり着いたのか
    tier: 背景
    telop: 2009年に3部で初代王者、2019年に初の1部。2023年にチャンピオンズリーグ初出場
    narrator: 解説
    say:
      - text: 2009年、新しくできた3部リーグで、ウニオンは初代の王者になります。
        image: assets/backgrounds/stadium_ウニオンベルリン_in.png
        card:
          type: table
          title: ウニオンの歩み
          columns: ["年", "出来事"]
          rows:
            - ["2009年", "3部リーグの初代王者"]
            - ["2019年", "初めてのブンデスリーガ"]
            - ["2021年", "7位。ヨーロッパへ"]
            - ["2022年", "5位。ヨーロッパリーグへ"]
            - ["2023年", "4位。チャンピオンズリーグへ"]
      - 2018年の6月、スイス人のウルス・フィッシャーが監督になります。
      - 翌2018年から19年のシーズン、2部で入れ替え戦に勝ち、初めて1部へ。相手はシュツットガルトでした。
      - text: そこから、7位、5位、4位と順位を上げていきます。
        card: none
        image: assets/images/bd_unionberlin_gegen/scene.jpg
      - 2023年5月、最終節でブレーメンに1対0で勝って、4位でチャンピオンズリーグへ。
      - クラブ史上初めてのチャンピオンズリーグは、6試合で2引き分け。
      - 翌季は、スタートで勝てず、16位まで落ちます。
      - それでも最終節にフライブルクに2対1で勝って、1部に残りました。
    sources:
      - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
  - id: japan
    heading: 遠藤渓太と原口元気。ウニオンと日本は、どうつながってきたのか
    tier: 背景
    telop: 2020年に遠藤渓太、2021年に原口元気が加入。原口はリーグ戦41試合2得点
    narrator: 解説
    say:
      - text: ウニオンでプレーした日本人に、遠藤渓太と原口元気がいます。
        image: assets/backgrounds/stadium_ウニオンベルリン_in.png
        card:
          type: table
          title: ウニオンと日本
          columns: ["年", "出来事"]
          rows:
            - ["2020年", "遠藤渓太が加入"]
            - ["2021年", "原口元気が加入"]
            - ["2023年", "原口が退団"]
      - 遠藤渓太は2020年、横浜F・マリノスから加わりました。
      - 1年目は、リーグ戦**16試合1得点**。
      - その季、ウニオンは7位で、ヨーロッパの大会への出場権を手にします。
      - text: 原口元気は2021年から、2年間ウニオンでプレー。
        card: none
        image: assets/images/bd_unionberlin_pair_japan/01.jpg
      - リーグ戦で**41試合2得点**。
      - 在籍した2季は、5位と4位。順位が、そのままヨーロッパの舞台につながりました。
    sources:
      - https://en.wikipedia.org/wiki/Keita_End%C5%8D
      - https://en.wikipedia.org/wiki/Genki_Haraguchi

features:
- text: "特徴の1つめは、愛称です。「アイゼルネン」は、ドイツ語で「鉄の人たち」。"
  image: assets/images/bd_unionberlin_gegen/scene.jpg
- "応援歌も、「アイゼルン・ウニオン」。鉄のウニオン、という意味です。"
- "2つめは、クリスマスの歌。2003年に、89人のファンが集まって始まりました。"
- "2013年には、**2万7500人**。ろうそくを掲げて、クリスマスの歌と応援歌を歌います。"
- "3つめは、マスコットの騎士、リッター・コイレ。2000年から、チームを応援しています。"
features_telop: 愛称は「鉄の人たち」。クリスマスの合唱は89人から2万7500人へ
features_rows:
- ["愛称", "アイゼルネン＝鉄の人たち"]
- ["クリスマス", "2003年89人→2013年2万7500人"]
- ["マスコット", "騎士リッター・コイレ"]
features_sources:
- https://en.wikipedia.org/wiki/1._FC_Union_Berlin

episode:
  id: episode
  heading: 2014年、ウニオンはなぜ、ピッチに800台を超えるソファーを並べたのか
  tier: 背景
  telop: 2014年のワールドカップ中、ファンがソファーを持ち込んで観戦。2015年にファン体験賞
  narrator: 解説
  card:
    type: table
    title: 2014年 ワールドカップのリビングルーム
    columns: ["", ""]
    rows:
      - ["2014年", "ピッチにソファー800台超"]
      - ["2015年", "ファン体験賞を受賞"]
  say:
    - text: 2014年のワールドカップ。ウニオンは、ファンに呼びかけます。
      image: assets/images/bd_unionberlin_xmas/scene.jpg
    - 自分のソファーを、スタジアムに持ってきませんか。
    - ピッチには、**800台**を超えるソファーが並びました。
    - 大きなスクリーンで、みんなで試合を見るためです。
    - この企画は、2015年にバルセロナで開かれたスタジアム産業の会議で、ファン体験賞を受けました。
  sources:
    - https://en.wikipedia.org/wiki/1._FC_Union_Berlin

legends:
- - ベニャミナは、東ドイツのドレスデン生まれのフォワード。2005年から、ウニオンでプレーしました。
  - 在籍は2011年まで。リーグ戦**190試合62得点**。
  - "通算では**213試合87得点**。いまも、クラブで最も多い得点です。"
- - マトゥシュカは、2005年から2014年まで、9年間ウニオンでプレーした中盤。
  - "リーグ戦**246試合52得点**。"
  - 2016年、ベニャミナと並んで引退の試合。1万4000人を超えるファンが集まりました。
- - クルーゼは、2020年に加わった攻撃的な選手。
  - "リーグ戦**38試合16得点**。"
  - 2021年5月、ライプツィヒ戦の後半アディショナルタイムに決勝点。2対1の勝利で、20年ぶりのヨーロッパが決まりました。
legend_rows:
- ["ベニャミナ", "2005-2011", "87得点（通算）"]
- ["マトゥシュカ", "2005-2014", "246試合52得点"]
- ["クルーゼ", "2020-2022", "38試合16得点"]
legend_sources:
- - https://en.wikipedia.org/wiki/Karim_Benyamina
- - https://en.wikipedia.org/wiki/Torsten_Mattuschka
- - https://en.wikipedia.org/wiki/Max_Kruse

manager:
- ウニオンの今季の監督は、スイス人のマウロ・ルストリネッリ。**50歳**です。
- 選手としてはフォワード。スイス代表で12試合に出て、2006年のワールドカップのメンバーにも入りました。
- 監督としては、スイスのトゥーンを率いて、2025年から26年のシーズンにスーパーリーグで優勝。
- 2026年5月に、ウニオンの監督になりました。
manager_telop: 監督はルストリネッリ。トゥーンでスイス優勝、2026年5月に就任
manager_rows:
- ["監督", "マウロ・ルストリネッリ"]
- ["就任", "2026年5月"]
- ["前の仕事", "スイス・トゥーンの監督"]
manager_sources:
- https://en.wikipedia.org/wiki/Mauro_Lustrinelli
- https://en.wikipedia.org/wiki/1._FC_Union_Berlin

season:
- text: ウニオンはブンデスリーガで9試合を終えて、**1勝4引き分け4敗**です。
- 順位は**16位**、勝ち点は**7**です。
- text: ホームの5試合は、1勝3分け1敗で勝ち点6。
  card:
    type: stats
    title: 今季のリーグ戦（9試合）
    items:
    - ["6", "", "ホームの勝ち点"]
    - ["1", "", "アウェーの勝ち点"]
    - ["21", "", "失点"]
    focus: 0
- text: 勝ち点7のうち、**6**はホームで取ったものです。
  mark: {kind: circle, item: 0}
- アウェーの4試合は、1分け3敗。得点は1、失点は14です。
- text: 最後のシーズンを迎えるアルテ・フェルステライで、どれだけ勝ち点を積めるかが鍵になります。
  card: none
  image: assets/backgrounds/stadium_ウニオンベルリン_in.png
- 勝ち点を試合数で割ると**0.78**。昨季の1.15を下回っています。
- 失点は1試合**2.33**で、昨季の1.71より増えました。
- 得点は1試合0.78で、昨季の1.29には届いていません。
- text: 11月21日には、ホームでライプツィヒと戦います。
  image: assets/backgrounds/stadium_ウニオンベルリン.png
