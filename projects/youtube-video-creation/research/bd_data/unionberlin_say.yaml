# ブンデスリーガ チーム紹介 ⑮ウニオン・ベルリン（見本は 11/10 のケルン）。2026-11-11 作成。情報は11月11日時点。
# 事実は research/bd_data/unionberlin_research.md から。今季の結果は ESPN の試合データで数えた。
title: ウニオン・ベルリン、ファンが自分で建てた本拠地を、なぜ今季かぎりで離れるのか？
short_title: ウニオン、ファンが建てた本拠地を今季で離れるわけ
opening: "東ベルリンの「鉄の人たち」、ウニオン。"
hook: 会員はおよそ7万2千人。本拠地の客席は、ファンが自分たちで作りました。
