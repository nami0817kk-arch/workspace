data:
- 創立は**1899年**。体操クラブとして生まれました。
- 愛称は「クライヒガウアー」。ドイツ語で「クライヒガウの人たち」です。
- 1部、ドイツカップ、ヨーロッパの大会で、優勝はまだありません。
- 1部の最高順位は、**3位**です。
- 昨季のリーグ戦は**5位**。勝ち点は61でした。
