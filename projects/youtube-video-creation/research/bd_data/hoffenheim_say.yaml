episode:
  id: episode
  heading: 2016年、17位のチームに28歳の監督。なぜ残留し、翌年は4位になれたのか
  tier: 背景
  telop: 2016年2月、17位のチームを28歳のナーゲルスマンが引き継ぐ
  narrator: 解説
  card:
    type: table
    title: ナーゲルスマンのホッフェンハイム
    columns: ["", ""]
    rows:
      - ["2016年2月", "リーグ17位で就任"]
      - ["2015年から16年", "勝ち点1差で残留"]
      - ["2016年から17年", "4位"]
      - ["2017年から18年", "3位"]
  say:
    - text: 2016年2月。ホッフェンハイムは、ブンデスリーガの17位でした。
      image: assets/images/bd_hoffenheim_pair_nagelsmann/01.jpg
    - 監督に就いたのは、ユリアン・ナーゲルスマン。**28歳**です。
    - ブンデスリーガの歴史で、いちばん若い監督でした。
    - text: 残りの14試合のうち、**7試合**に勝ちます。
    - 降格プレーオフ圏の、勝ち点1差上で残留しました。
    - text: 翌2016年から17年のシーズンは、**4位**。
      card: none
      image: assets/images/bd_hoffenheim_fans/scene.jpg
    - 2017年から18年のシーズンは**3位**。いまもクラブの最高順位です。
  sources:
    - https://en.wikipedia.org/wiki/Julian_Nagelsmann
    - https://en.wikipedia.org/wiki/TSG_1899_Hoffenheim

legends:
- - イビシェヴィッチは、ホッフェンハイムのフォワード。2007年に加入。
  - "2012年まで、リーグ戦**123試合48得点**。"
  - 1部に上がった最初のシーズンには、**18得点**を挙げました。
- - フィルミーノはブラジルの攻撃の選手。2011年から、ホッフェンハイムで4年半。
  - "2015年まで、リーグ戦**140試合38得点**。"
  - 2013年から14年には、リーグが選ぶ「飛躍した選手」に。
  - 2015年に、リヴァプールへ。
  - 2018年から19年には、チャンピオンズリーグで優勝しました。
- - クラマリッチはクロアチアのフォワード。2016年から、ホッフェンハイムの一員です。
  - "リーグ戦は**311試合136得点**。"
  - 2019年3月29日に、クラブの通算最多得点になりました。
