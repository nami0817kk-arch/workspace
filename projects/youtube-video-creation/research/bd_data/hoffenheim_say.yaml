story_sections:
  - id: japan
    heading: 町田浩樹は、ホッフェンハイムで何を取り戻したのか
    tier: 背景
    telop: 町田浩樹は2025年に加入。今季はリーグ戦5試合、ヨーロッパリーグで1得点
    narrator: 解説
    say:
      - text: 町田浩樹は、身長**190センチ**のセンターバックです。
        card:
          type: table
          title: 町田浩樹の歩み
          columns: ["年", "出来事"]
          rows:
            - ["2022-2025", "ベルギーのユニオンSG"]
            - ["2024", "カップ決勝で決勝点"]
            - ["2025年6月", "ホッフェンハイムへ"]
            - ["今季", "リーグ5試合、EL1得点"]
      - 2022年から、ベルギーのユニオンSGでプレーしました。
      - 2024年のベルギーカップ決勝では、唯一の得点を決めます。
      - クラブにとって、110年ぶりのカップ優勝でした。
      - text: 2025年6月25日、ホッフェンハイムへ。
        card: none
        image: assets/images/bd_hoffenheim_pair_machida/01.jpg
      - 8月23日の開幕戦でデビューしますが、前半のうちにケガで交代。
      - text: 復帰は2026年9月12日。シュツットガルト戦に、交代で入りました。
        image: assets/images/bd_hoffenheim_arena/scene.jpg
      - 10月15日、ヨーロッパリーグのベシクタシュ戦。
      - 87分、コーナーキックからのヘディングで、ホッフェンハイムでの初ゴール。
      - 25日のレバークーゼン戦は、先発でフル出場。チームは3対0の勝ちでした。
    sources:
      - https://en.wikipedia.org/wiki/K%C5%8Dki_Machida
      - https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/summary?event=401915563
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884760
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884797
  - id: golden
    heading: 人口3445人の地区のクラブは、なぜ5部から8年で1部へ上がれたのか
    tier: 背景
    telop: 2000年に5部で優勝。2008年に1部。昇格は4回
    narrator: 解説
    main: true
    say:
      - text: ホッフェンハイムは、町シンスハイムの一地区。町の人口は、およそ**3万7000人**。
        image: assets/images/bd_hoffenheim_oldground/scene.jpg
      - そのうち、ホッフェンハイムの地区の人口は**3445人**です。
      - 1990年代のはじめは、1部から数えて8番目のリーグの、地域クラブでした。
      - text: 転機は2000年ごろ。ディートマー・ホップが、育ったクラブを支え始めます。
        image: assets/images/bd_hoffenheim_pair_hopp/01.jpg
      - ホップは、エスエーピーという会社の共同創業者です。
      - text: 2000年、5部で優勝して、4部へ。
        card:
          type: table
          title: ホッフェンハイムの昇格
          columns: ["年", "結果"]
          rows:
            - ["2000", "5部で優勝、4部へ"]
            - ["2001", "4部で優勝、3部へ"]
            - ["2007", "3部で2位、2部へ"]
            - ["2008", "2部で2位、1部へ"]
      - 2001年も、4部で優勝。3部へ上がりました。
      - text: 2006年には、ラルフ・ラングニックを監督に迎え、選手も補強します。
        card: none
        image: assets/images/bd_hoffenheim_oldground/scene.jpg
      - 2007年、3部で2位。2部へ上がりました。
      - text: 2008年、2部でも2位に入り、1部へ。2部で過ごしたのは、1年間です。
        card: none
        image: assets/images/bd_hoffenheim_2008/scene.jpg
      - 2000年の5部から、8年で1部。昇格は4回でした。
      - 初めてのブンデスリーガ、2008年から09年のシーズンは7位でした。
    sources:
      - https://en.wikipedia.org/wiki/TSG_1899_Hoffenheim
      - https://de.wikipedia.org/wiki/Hoffenheim

features:
- "ホッフェンハイムの特徴の1つめは、本拠地の大きさの変化です。"
- "かつての本拠地は、ディートマー・ホップ・シュタディオン。"
- "1999年に完成し、収容は**5000人**でした。"
- "1部の最初のシーズンは、マンハイムのスタジアムで開幕します。収容は**2万6022人**。"
- "もう1つの特徴は、海外のクラブとの提携です。"
- "2020年に、アメリカのFCシンシナティと提携。"
- "ガーナのハーツ・オブ・オークとも、手を組みました。"
- "2025年3月には、インドのラージャスターン・ユナイテッドとも提携しました。"
