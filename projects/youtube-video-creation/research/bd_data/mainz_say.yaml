data:
- 創立は**1905年**。合併を重ねて、1919年にいまの名前の元ができました。
- 愛称は「ヌルフュンファー」。ドイツ語で「05の人たち」です。
- ホームタウンのマインツは、ドイツのカーニバルの3大都市の1つ。
- 本拠地はメーヴァ・アレーナ。収容は**3万3305人**。
- 1部、ドイツカップ、ヨーロッパの大会で、優勝はまだありません。
- ヨーロッパの最高成績は、昨季のカンファレンスリーグのベスト8です。
- 昨季のリーグ戦は**10位**。勝ち点は40でした。
data_focus: [0, 1, 2, 3, 5, 7, 8]

