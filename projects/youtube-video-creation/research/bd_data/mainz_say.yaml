  - id: coaches
    heading: クロップとトゥヘル。なぜマインツから名監督が出たのか
    tier: 背景
    telop: フランクが新しい守り方を持ち込み、クロップ、トゥヘルへ
    narrator: 解説
    main: true
    card:
      type: table
      title: マインツの監督（抜粋）
      columns: ["在任", "監督"]
      rows:
        - ["1995-2000", "ヴォルフガング・フランク"]
        - ["2001-2008", "ユルゲン・クロップ"]
        - ["2009-2014", "トーマス・トゥヘル"]
        - ["2025-", "ウルス・フィッシャー"]
    say:
      - 1990年代、2部で残留を争っていたマインツに、ヴォルフガング・フランク監督が新しい守り方を持ち込みます。
      - リベロを置かず、4人が横に並んで地域を守る形。ドイツのクラブでは、早い採用でした。
      - text: その下でプレーしていたのが、ユルゲン・クロップです。
        card: none
        image: assets/images/bd_mainz_klopp/scene.jpg
      - クロップは選手として1990年から2001年まで在籍し、リーグ戦**325試合**に出ました。
      - 2001年2月、引退してすぐに監督へ。2004年、クラブを初めて1部に上げました。
      - 1部では予算もスタジアムもリーグでいちばん小さいなか、1年目は11位でした。
      - 2008年にドルトムントへ移り、そこでリーグ優勝を果たします。
      - text: 2009年、1部の監督を任されたのが、ユースを率いていたトーマス・トゥヘルです。
        image: assets/images/bd_mainz_tuchel/scene.jpg
      - トゥヘルはその前の1年、19歳以下のチームでドイツ王者になっていました。
      - 2010年から11年のシーズンは、開幕から7連勝。1部の開幕記録に並びました。
      - この年の5位は、いまもクラブの1部での最高順位です。
      - トゥヘルも2015年、クロップと同じく、マインツからドルトムントの監督になりました。
    sources:
      - https://en.wikipedia.org/wiki/1._FSV_Mainz_05
      - https://en.wikipedia.org/wiki/J%C3%BCrgen_Klopp
      - https://en.wikipedia.org/wiki/Thomas_Tuchel
      - https://en.wikipedia.org/wiki/Wolfgang_Frank

