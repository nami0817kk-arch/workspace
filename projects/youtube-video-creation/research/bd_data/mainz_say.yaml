episode:
  id: episode
  heading: 2026年、カンファレンスリーグでベスト8。どう勝ち上がったのか
  tier: 背景
  telop: 2025-26のカンファレンスリーグ。クラブ初のベスト8
  narrator: 解説
  card:
    type: table
    title: 2025-26のカンファレンスリーグ
    columns: ["", ""]
    rows:
      - ["プレーオフ", "ローゼンボリに合計5対3"]
      - ["リーグフェーズ", "6試合で4勝1分1敗。7位"]
      - ["ベスト16", "シグマ・オロモウツに合計2対0"]
      - ["準々決勝", "ストラスブールに合計2対4"]
  say:
    - text: 2025年から26年、マインツはカンファレンスリーグに出ました。
      image: assets/images/bd_mainz_fans/scene.jpg
    - プレーオフで、ノルウェーのローゼンボリに合計5対3。
    - リーグフェーズは6試合で4勝。イタリアのフィオレンティーナにも、2対1で勝ちました。
    - text: ベスト16は、チェコのシグマ・オロモウツに合計2対0。
      card: none
      image: assets/backgrounds/stadium_マインツ.png
    - ヨーロッパの大会で、ベスト16を勝ち抜いたのは、クラブで初めてです。
    - 準々決勝はフランスのストラスブール。ホームで2対0と勝ちましたが、敵地で0対4。合計2対4で終わりました。
  sources:
    - https://en.wikipedia.org/wiki/1._FSV_Mainz_05

legends:
- - シュールレは2006年、マインツのユースに入りました。
  - "2009年からトップでリーグ戦**66試合20得点**。2011年にレバークーゼンへ移りました。"
  - 2014年のワールドカップで優勝。決勝では、ゲッツェの決勝点をアシストしました。
- - ブンゲルトは2008年、2部にいたマインツに加わった守備の選手です。
  - "2019年まで11年在籍し、リーグ戦**198試合**。"
  - 引退後もクラブに残り、2021年にはクラブで初めてのアンバサダーになりました。
- - ベルは2007年、マインツのユースに入りました。
  - "2010年にトップでデビューし、リーグ戦**302試合**に出ています。"
  - いまも登録選手の1人。ユースから上がった選手の代表です。
