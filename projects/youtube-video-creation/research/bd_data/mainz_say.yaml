    heading: 岡崎、武藤、そして佐野。日本人は何を残してきたのか
    tier: 背景
    telop: 岡崎慎司はリーグ戦27得点。武藤嘉紀は20得点。今季は佐野海舟と川﨑颯太
    narrator: 解説
    say:
      - text: 2013年、マインツに岡崎慎司が加わりました。
        card:
          type: table
          title: マインツの日本人選手（リーグ戦）
          columns: ["名前", "在籍", "リーグ戦"]
          rows:
            - ["岡崎慎司", "2013-2015", "65試合27得点"]
            - ["武藤嘉紀", "2015-2018", "66試合20得点"]
