            - ["川﨑颯太", "2025-", "2026年3月に完全移籍"]
      - 1年目はリーグ戦**15得点**。
      - 2014年9月には通算28点目を挙げ、当時のブンデスリーガで、日本人の最多得点になりました。
      - text: 2015年には、武藤嘉紀が加わります。
        card: none
        image: assets/images/bd_mainz_muto/scene_w.jpg
      - その年の10月、アウクスブルク戦でハットトリック。ブンデスリーガの日本人では、高原直泰に続く2人目でした。
      - text: いまの中盤を支えるのが、佐野海舟です。
        image: assets/images/bd_mainz_pair_sano/01.jpg
      - 今季はリーグ戦7試合すべてに先発し、アシストは2つ。
      - 2025年には川﨑颯太も加入。2026年3月、完全移籍での獲得が決まっています。
