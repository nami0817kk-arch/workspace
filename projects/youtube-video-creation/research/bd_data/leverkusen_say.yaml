  say:
    - 1988年、ヨーロッパリーグの前身の決勝は、エスパニョール戦。
    - 第1戦は、敵地で0対3の負け。ほとんど望みのない形でした。
    - ホームの第2戦は、後半に3点を返して3対0の勝ち。合計は同点です。
    - PK戦は、最初に蹴った選手が外す苦しい出だし。
    - それでも、フォルボルンが1本を止めて、3対2の勝ち。クラブ初のタイトルです。
