legends:
- - キルステンは、旧東ドイツ出身。統一の年の1990年に来ました。
  - "リーグ戦**181得点**。全大会では**240得点**で、クラブ最多です。"
  - 2004年には、クラブ最初の名誉主将になりました。
- - バラックは、旧東ドイツ出身。1999年に来ました。
  - 2002年のワールドカップは、準決勝で決勝点。警告で、決勝は出られませんでした。
  - その夏にバイエルンへ移り、2010年に戻ってきました。
- - ヴィルツは、ケルンの下部組織から、2020年に来ました。
  - 17歳で、当時のブンデスリーガ最年少得点を決めました。
  - 2025年6月に、約**1億ポンド**で、リヴァプールへ移りました。
