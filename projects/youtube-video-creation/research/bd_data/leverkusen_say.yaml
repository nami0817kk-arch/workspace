data:
- 創立は**1904年**。バイエル社の工場で、**170人**が署名した手紙から始まりました。
- 愛称は「ヴェルクエルフ」。工場の11人、という意味です。
- ホームタウンはレバークーゼン。人口は約**16万8000人**。ケルンの北隣です。
- 本拠地はバイアレーナ。**3万210人**が入ります。
- 18クラブでは14番目の大きさ。いちばん遠い席も、ピッチ中央まで**94メートル**。
- 経営会社は、バイエル社の子会社。会員が過半数を持つ決まりの、例外のひとつ。
- リーグ優勝は**1回**、ドイツカップは**2回**。ヨーロッパの大会でも**1回**です。
- 最多出場は、リューディガー・フォルボルン。リーグ戦**401試合**。
- 直近のタイトルは、**2024年**のスーパーカップ。PK戦の末に勝ちました。
- 昨季のリーグ戦は**6位**。勝ち点**59**で、首位バイエルンと30差。
data_focus: [0, 1, 2, 3, 3, 4, 5, 6, 7, 8]

story_sections:
  - id: history2
    heading: 2002年、2位が3つ。その夏は、日本で
    tier: 背景
    telop: 2002年に3つの大会で2位。W杯の決勝は横浜
    narrator: 解説
    card:
      type: table
      title: 2002年のレバークーゼン
      columns: ["", ""]
      rows:
        - ["ブンデスリーガ", "5点差の首位から、2位"]
        - ["ドイツカップ決勝", "シャルケに2対4"]
        - ["チャンピオンズリーグ決勝", "レアル・マドリードに1対2"]
        - ["W杯決勝（横浜）", "先発22人のうち4人が所属"]
    say:
      - 2002年、3つの大会で2位でした。
      - リーグは、5点差の首位から、2連敗で抜かれます。
      - ドイツカップ決勝は、シャルケに2対4。
      - 4日後のチャンピオンズリーグ決勝は、レアル・マドリードに1対2。
      - この年のあだ名が、英語で「ネバークーゼン」。あと一歩で届かない、という意味です。
      - text: その夏のワールドカップは、日本と韓国で。決勝の会場は、横浜でした。
        image: assets/images/bd_leverkusen_yokohama/scene.jpg
      - 決勝に先発した22人のうち、4人がレバークーゼンの選手でした。
      - ブラジルのルシオと、ドイツのラメロウ、シュナイダー、ノイヴィル。
      - text: 日本の細貝萌も、このクラブの選手でした。2012-13は、リーグ戦17試合。
        image: assets/photos/bd/leverkusen/leverkusen_japan_49494d14.jpg
    sources:
      - https://www.bayer04.de/en-us/page/history/seasons/2001-2002
      - https://en.wikipedia.org/wiki/Bayer_04_Leverkusen
      - https://en.wikipedia.org/wiki/2002_FIFA_World_Cup_final
      - https://en.wikipedia.org/wiki/Michael_Ballack
      - https://en.wikipedia.org/wiki/Hajime_Hosogai
  - id: history3
    heading: 2022年10月、17位だった
    tier: 背景
    telop: 2022年10月5日、17位。シャビ・アロンソが監督に就く
    narrator: 解説
    card:
      type: table
      title: 17位から、無敗の優勝へ
      columns: ["", ""]
      rows:
        - ["2022年10月5日", "17位で、アロンソが就任"]
        - ["2022-23", "6位で終える"]
        - ["2023年の夏", "ジャカ、ホフマンらが加入"]
    say:
      - 2022年10月5日。レバークーゼンは、17位でした。
      - その日、シャビ・アロンソが監督に就きます。
      - 元スペイン代表。一軍の監督は、これが初めてでした。
      - 初戦はホームでシャルケに4対0の勝ち。その年は6位で終えます。
      - 2023年の夏、ジャカ、ホフマン、ボニフェイス、グリマルドが加わります。
    sources:
      - https://www.bayer04.de/en-us/page/history/seasons/2022-2023
      - https://www.bayer04.de/en-us/page/history/seasons/2023-2024
      - https://en.wikipedia.org/wiki/Xabi_Alonso
  - id: history4
    heading: 34試合、一度も負けなかった
    tier: 背景
    telop: 2023-24は28勝6分け。勝ち点90で、創立120年で初優勝
    narrator: 解説
    card:
      type: table
      title: 2023-24のブンデスリーガ
      columns: ["", ""]
      rows:
        - ["成績", "28勝6分け0敗"]
        - ["勝ち点", "90（前の年より40増）"]
        - ["得点と失点", "89得点、24失点"]
        - ["優勝を決めた日", "4月14日、第29節"]
    say:
      - 2023-24は、開幕のライプツィヒ戦、3対2の勝ちで始まります。
      - そこから最後まで、一度も負けませんでした。
      - text: 4月14日、第29節。ブレーメンに5対0で、初優勝を決めます。
        image: assets/images/bd_leverkusen_title/scene.jpg
      - 創立から**120年**で、初めての優勝でした。
      - 最終節も勝って、ブンデスリーガ史上初の、無敗優勝です。
      - 28勝6分け。勝ち点は**90**で、前の年より**40**多い数字でした。
      - 公式戦の無敗は**51試合**。ベンフィカの48を超える、欧州の記録です。
      - 止まったのは、ヨーロッパリーグ決勝。3日後のドイツカップ決勝には勝ち、2冠でした。
    sources:
      - https://www.bayer04.de/en-us/page/history/seasons/2023-2024
      - https://www.bundesliga.com/en/bundesliga/news/bayer-leverkusen-are-2023-24-bundesliga-champions-26930

