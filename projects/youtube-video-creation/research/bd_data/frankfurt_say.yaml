data:
- 創立は**1899年**。前身のひとつ、ヴィクトリアが、3月8日にできました。
- 愛称は「アドラー」。鷲のことです。正式名は、アイントラハト・フランクフルト。
- ホームタウンはフランクフルト。人口は約**76万人**。ドイツで5番目の大都市です。
- 本拠地はドイツ銀行パーク。収容は**6万100人**で、18クラブでは4番目です。
- オーナーは、会員のクラブ本体。株式会社の株の約**68%**を持っています。
- ドイツ王者は1959年の**1回**。ブンデスリーガは1963年開幕で、優勝は**0回**です。
- ドイツカップは**5回**。ヨーロッパリーグは、前身のカップを含めて**2回**。
- 最多出場は、チャーリー・ケルベル。ブンデスリーガの歴代最多、**602試合**です。
- 直近のタイトルは、**2022年**のヨーロッパリーグ。決勝は、PK戦で勝ちました。
- 昨季のリーグ戦は**8位**。勝ち点**44**で、首位バイエルンと**45**差です。
data_focus: [0, 1, 2, 3, 4, 5, 5, 6, 7, 8]

