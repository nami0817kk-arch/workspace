season:
- フランクフルトの次は、ドイツ時間の24日。敵地でドルトムントと対戦します。
- 2021年から22年のヨーロッパリーグは、**1.6得点**、**1.0失点**。無敗でした。
- 同じ年のリーグ戦は、**1.3得点**、**1.4失点**。10勝12引き分け12敗でした。
- 勝ち抜く試合の強さと、34試合を戦う強さは、別のもののようです。

