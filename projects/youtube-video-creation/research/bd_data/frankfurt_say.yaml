legends:
- - ケルベルは、1972年から1991年まで、フランクフルト一筋でした。
  - "ディフェンダーでありながら、リーグ戦で**45得点**を決めています。"
  - ドイツカップを4回、1980年のヨーロッパのカップも、獲りました。
- - ヘルツェンバインは、1967年から1981年まで、フランクフルトにいました。
  - "リーグ戦**160得点**はクラブ記録。西ドイツ代表で、1974年のワールドカップ優勝。"
- - マイヤーは、2004年にフランクフルトに加わって、14年プレーしました。
  - "2014年から15年にかけて、**26試合で19得点**。リーグの得点王になりました。"
