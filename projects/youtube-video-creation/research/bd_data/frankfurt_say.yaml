    heading: 2006年から、日本人は7人。いちばん長くいたのは誰か
    tier: 背景
    telop: 2006年から日本人7人。長谷部誠は10年、リーグ戦235試合
    narrator: 解説
    say:
      - text: 2006年から、少なくとも7人の日本人選手が、フランクフルトでプレーしました。
        card:
          type: table
          title: フランクフルトの日本人選手（リーグ戦）
          columns: ["名前", "在籍", "試合と得点"]
          rows:
            - ["高原直泰", "2006-2008", "38試合12得点"]
            - ["稲本潤一", "2007-2009", "43試合0得点"]
            - ["乾貴士", "2012-2015", "75試合7得点"]
            - ["長谷部誠", "2014-2024", "235試合2得点"]
            - ["鎌田大地", "2017-2023", "127試合20得点"]
            - ["堂安律", "2025-", "36試合5得点"]
            - ["小杉啓太", "2026-", "6試合0得点"]
        image: assets/backgrounds/stadium_フランクフルト.png
      - 高原直泰は、2年で**12得点**。稲本潤一は2年、乾貴士は3年、在籍しました。
      - text: 長谷部誠は、2014年から2024年まで、10年在籍しました。
        card: none
        image: assets/images/bd_frankfurt_pair_hasebe_kamada/01.jpg
      - 7人の中でいちばん長く、リーグ戦は**235試合**です。
      - text: 鎌田大地は、2017年から6年。リーグ戦**127試合**で、20得点を決めました。
        image: assets/images/bd_frankfurt_pair_kamada_doan/01.jpg
      - 今は、堂安律と小杉啓太。堂安は昨季、リーグ戦**31試合**で5得点でした。
    sources:
