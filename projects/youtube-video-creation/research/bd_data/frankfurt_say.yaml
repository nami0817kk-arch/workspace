  say:
    - text: 1992年の春、フランクフルトは、2度目のドイツ王者に近づきます。
      image: assets/backgrounds/stadium_フランクフルト.png
    - 34節は、レバークーゼンに3対1で勝って、首位に立ちました。
    - 最終節の前は、シュツットガルト、ドルトムントと、3クラブが勝ち点**50**で並びます。
    - フランクフルトは、ロストックに1対2で敗れて、3位。
    - 優勝は、レバークーゼンに2対1で勝った、シュツットガルトでした。
