legends:
- - ペーターゼンは2015年、2部に落ちたばかりのフライブルクに加わりました。
  - "その2部のシーズンに**25得点**。1年で1部へ戻る力になりました。"
  - 2023年まで在籍し、通算105点。グリフォに抜かれるまで、クラブの記録でした。
- - シセは2009年の暮れ、フランスのメスから加わったフォワード。
  - "2010年から11年に**22得点**。当時のクラブの、1シーズンの記録です。"
  - アフリカ出身の選手の、ブンデスリーガ記録も塗り替えました。
- - 3人目は、2005年にフライブルクのユースに入った選手です。
  - "守備の中盤を担い、リーグ戦**325試合**。若手を育てる道の手本でした。"
  - 最後のプロの試合は、2026年のヨーロッパリーグ決勝でした。
