data:
- 創立は**1904年**。前身の2つのクラブが、この年に生まれました。
- 愛称は「ブライスガウのブラジル人」。1990年代、魅せるサッカーで付いた呼び名です。
- ホームタウンはフライブルク。人口10万人を超える都市では、ドイツでいちばん南にあります。
- 本拠地はオイローパパルク・シュタディオン。収容は**3万4700人**。
- タイトルは2部の優勝が**4回**。ドイツカップとヨーロッパリーグは、準優勝が1回ずつ。
- 通算得点のクラブ記録は、ヴィンチェンツォ・グリフォが持っています。
- 昨季のリーグ戦は**7位**。勝ち点**47**で、今季のカンファレンスリーグに進みました。
data_focus: [0, 1, 2, 3, 5, 6, 8]

story_sections:
  - id: japan
    heading: 日本人はこれまで5人。いまの3人は何を見せているのか
    tier: 背景
    telop: 2010年から日本人5人。今季は鈴木唯人、後藤啓介、山本理仁
    narrator: 解説
    say:
      - text: 2010年から、フライブルクには5人の日本人が在籍してきました。
        card:
          type: table
          title: フライブルクの日本人選手（リーグ戦）
          columns: ["名前", "在籍", "試合と得点"]
          rows:
            - ["矢野貴章", "2010-2012", "15試合0得点"]
            - ["堂安律", "2022-2025", "97試合22得点"]
            - ["鈴木唯人", "2025-", "今季6試合4得点"]
            - ["後藤啓介", "2026-", "今季6試合1得点"]
            - ["山本理仁", "2026-", "今季1試合"]
      - 堂安律は2022年から3年。リーグ戦**97試合**に出ました。
      - 2024年から25年のシーズンは、10得点でチームの得点王です。
      - text: 鈴木唯人は、2025年の夏に加わりました。
        card: none
        image: assets/images/bd_freiburg_suzuki2/scene.jpg
      - 今季の開幕戦、ブレーメン戦では、29分、48分、55分とハットトリック。
      - チームのリーグ戦の得点の4分の1を、鈴木唯人が挙げています。
      - 後藤啓介は、この6月にベルギーから移ってきたフォワード。
      - 10月のシャルケ戦、85分に頭で決勝点を決めました。
    sources:
      - https://en.wikipedia.org/wiki/Kisho_Yano
      - https://en.wikipedia.org/wiki/Ritsu_D%C5%8Dan
      - https://en.wikipedia.org/wiki/Yuito_Suzuki
      - https://en.wikipedia.org/wiki/Keisuke_Got%C5%8D
      - https://en.wikipedia.org/wiki/Rihito_Yamamoto
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884814
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884778
  - id: coaches
    heading: 35年で監督5人。なぜ代えずにいられたのか
    tier: 背景
    telop: 1991年から監督は5人。フィンケ16年、シュトライヒ12年
    narrator: 解説
    main: true
    card:
      type: table
      title: 1991年からのフライブルクの監督
      columns: ["在任", "監督"]
      rows:
        - ["1991-2007", "フォルカー・フィンケ"]
        - ["2007-2011", "ロビン・ドゥット"]
        - ["2011", "マルクス・ゾルク"]
        - ["2011-2024", "クリスティアン・シュトライヒ"]
        - ["2024-", "ユリアン・シュスター"]
    say:
      - 1978年秋から91年夏の13年で、フライブルクの監督はのべ**17人**。
      - 1991年からの35年は、5人です。
      - 流れを変えたのが、1991年に来たフォルカー・フィンケです。
      - 2年目に2部で優勝して1部へ。1部の2年目には、3位に入りました。
      - text: 2002年に2部へ落ちても、クラブはフィンケを代えません。
        card: none
        image: assets/images/bd_freiburg_finke/scene_w.jpg
      - 翌年、2部で優勝して1部に戻りました。
      - フィンケは16年指揮し、のちに日本の浦和レッズでも監督を務めています。
      - text: 2011年の暮れ、残留争いの中で就いたのが、ユースを育ててきたシュトライヒです。
        image: assets/images/bd_freiburg_coaches/scene_w.jpg
      - 2015年には、勝ち点1の差で2部へ。それでも監督は代えません。
      - 翌年は2部で優勝し、また1年で戻りました。
      - シュトライヒは12年あまり指揮。2022年には、ドイツカップの決勝へ導きました。
      - 後を継いだのは、そのアシスタントだったシュスターです。
      - その2年目、チームはヨーロッパリーグを勝ち上がり、決勝までたどり着きました。
    sources:
      - https://en.wikipedia.org/wiki/SC_Freiburg
      - https://en.wikipedia.org/wiki/Volker_Finke
      - https://en.wikipedia.org/wiki/Christian_Streich

