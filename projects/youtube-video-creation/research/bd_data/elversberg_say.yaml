episode:
  id: episode
  heading: エルフェルスベルクは、1点差で届かなかった翌年に、なぜ1部へ上がれたのか
  tier: 背景
  telop: 2025年の入れ替え戦は、合計3対4で敗れた。2026年は、最終節に3対0で勝って2位
  narrator: 解説
  card:
    type: table
    title: 1部まで、あと1点だった年
    columns: ["", ""]
    rows:
      - ["入れ替え戦（2025年）", "合計3対4で敗退"]
      - ["監督", "シュテフェンから交代"]
      - ["2026年", "2部2位、初の1部"]
  say:
    - text: 2025年の5月。2部3位のエルフェルスベルクは、1部のハイデンハイムと入れ替え戦を戦います。
      image: assets/backgrounds/stadium_エルフェルスベルク_in.png
    - 勝てば、クラブ初の1部でした。
    - 1試合目は2対2。2試合目は、ホームで1対2。
    - 決められたのは、試合終了間際のロスタイムでした。
    - 2試合の合計は、3対4。1点差で、1部には届きませんでした。
    - シュテフェン監督は、その5月にクラブを離れて、ブレーメンの監督になります。
    - 後任は、ヴィンセント・ヴァーグナー。主将を含む11人が出て、13人が加わる、大きな入れ替えでした。
    - それでも、シーズンは好調です。第8節で、この季はじめて首位に立ちました。
    - 冬には、前半戦で12得点のユネス・エブヌタリブが、フランクフルトへ移ります。
    - そして最終節。ミュンスターに3対0で勝って、2位。初めての1部が決まりました。
  sources:
    - https://de.wikipedia.org/wiki/SV_Elversberg
    - https://en.wikipedia.org/wiki/SV_Elversberg

legends:
- - シュテフェンは、2018年の11月から、2025年の5月まで、エルフェルスベルクを率いた監督です。
  - 4部で優勝し、3部でも優勝。2部では、3位まで導きました。
  - 6年半あまり、同じクラブで指揮を執り続けました。
- - アスラーニは、ホッフェンハイムから期限付きで加わったフォワード。2024年から25年のシーズンです。
  - 2部のリーグ戦で、**33試合18得点**。
  - 得点とアシストを合わせた数は、リーグで2番目でした。
- - ペトコフは、2024年に加わったフォワードです。
  - 2025年から26年は、2部のリーグ戦で**13得点**。クラブでいちばん多い得点でした。
  - 今季の開幕戦、8分。クラブにとって、1部で初めてのゴールを決めたのも、この選手です。
