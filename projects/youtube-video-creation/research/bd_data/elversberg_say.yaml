data:
- 創立は**1907年**。1914年に一度解散して、1918年に作り直されました。
- 愛称は「黒と白」。クラブの色も、黒と白です。
- ホームタウンは、ザールラント州のシュピーゼン＝エルフェルスベルク。州都ザールブリュッケンから、15キロほど北東です。
- 本拠地はウルサファーム・アレーナ。1部の基準に合わせて、増築を進めています。
- 会員は**1万4千人**を超えます。
- ドイツカップでは、1部のクラブを破ったことがあります。2010年にハノーファー、2022年にレバークーゼンです。
- タイトルは、2023年の3部優勝。4部の優勝は、2017年と2022年の2回です。
- 1部は、今季が初めてです。2026年の5月に、昇格を決めました。
- 昨シーズンは、2部で**2位**。勝ち点は59でした。
data_focus: [0, 1, 2, 3, 4, 6, 5, 7, 8]

story_sections:
  - id: rise
    heading: 4部で優勝したエルフェルスベルクは、どうやって2部まで駆け上がったのか
    tier: 背景
    telop: 2022年に4部で優勝。2023年に3部で優勝。2024年から25年は、2部3位
    narrator: 解説
    main: true
    say:
      - text: 2022年。エルフェルスベルクは、4部のリーグで優勝して、3部に上がります。
        card:
          type: table
          title: エルフェルスベルクの歩み
          columns: ["年", "出来事"]
          rows:
            - ["2022年", "4部で優勝、3部へ"]
            - ["2023年", "3部で優勝、2部へ"]
            - ["2025年", "2部3位、入れ替え戦で敗れる"]
            - ["2026年", "2部2位、初の1部"]
      - 監督は、ホルスト・シュテフェン。2018年の11月から、このクラブを率いていました。
      - 翌年の3部でも、首位で終えます。2023年、2部への昇格を決めました。
      - text: 2部の1年目は、11位でした。
        card: none
        image: assets/backgrounds/stadium_エルフェルスベルク.png
      - 2年目の2024年12月。クラブの歴史で初めて、2部の首位に立ちます。
      - 前半戦を終えて、4位。後半戦はリーグで2番目に良い成績で、3位に入りました。
      - 3位は、1部の16位との入れ替え戦に進みます。ここまでが、4部優勝から3年です。
    sources:
      - https://de.wikipedia.org/wiki/SV_Elversberg
      - https://en.wikipedia.org/wiki/SV_Elversberg

