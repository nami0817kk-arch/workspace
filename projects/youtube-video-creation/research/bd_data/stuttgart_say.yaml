data:
- 創立は**1893年**。前身のクラブのひとつが、9月9日に生まれました。
- 愛称は「ディ・ローテン」。ドイツ語で、赤のことです。
- ホームタウンはシュツットガルト。人口は約**61万人**。ドイツで6番目の大都市です。
- 本拠地はエムエイチピー・アレーナ。収容は**6万58人**で、18クラブでは5番目。
- 2023年の夏までの名前は、メルセデス・ベンツ・アレーナです。
- 株の**78.2%**は、会員のクラブが持ちます。メルセデス・ベンツとポルシェも、10.4%ずつ。
- ドイツ王者は**5回**、ドイツカップは**4回**。ブンデスリーガの優勝は、2007年が最後です。
- クラブの最多得点は、カール・アルゲーヴァーの**166点**です。
- 直近のタイトルは、**2025年**のドイツカップ。決勝でビーレフェルトに4対2。
- 昨季のリーグ戦は**4位**。勝ち点**62**で、チャンピオンズリーグに戻りました。
data_focus: [0, 1, 2, 3, 3, 4, 5, 6, 7, 8]

story_sections:
  - id: japan
    heading: 2011年から、日本人は8人。誰が何を残したのか
    tier: 背景
    telop: 2011年から日本人8人。遠藤航はリーグ戦120試合13得点
    narrator: 解説
    say:
      - text: 2011年から、少なくとも8人の日本人選手が、シュツットガルトに在籍しました。
        card:
          type: table
          title: シュツットガルトの日本人選手（リーグ戦。2部を含む）
          columns: ["名前", "在籍", "試合と得点"]
          rows:
            - ["岡崎慎司", "2011-2013", "63試合10得点"]
            - ["酒井高徳", "2012-2015", "71試合1得点"]
            - ["細貝萌", "2016-2017", "10試合0得点"]
            - ["浅野拓磨", "2016-2018", "41試合5得点"]
            - ["遠藤航", "2019-2023", "120試合13得点"]
            - ["伊藤洋輝", "2021-2024", "85試合2得点"]
            - ["原口元気", "2023-2024", "13試合0得点"]
            - ["チェイス・アンリ", "2024-2025", "12試合0得点"]
        image: assets/images/bd_stuttgart_team2013/scene.jpg
      - 最初は岡崎慎司。2011年に加わり、リーグ戦**63試合**で10得点を挙げました。
      - 酒井高徳は2012年から、レンタルの期間も含めてリーグ戦**71試合**。
      - text: 遠藤航は、2019年から4年在籍。主将も務めました。
        card: none
        image: assets/images/bd_stuttgart_pair_endo_ito/01.jpg
      - 2022年5月の最終節、ケルン戦。遠藤の決勝点で、入れ替え戦を避けて残りました。
      - 伊藤洋輝は2021年から3年。2位になった年も、守備の主力の1人でした。
      - 浅野拓磨、細貝萌、原口元気、チェイス・アンリもプレーしました。
      - 今季の登録選手に、日本人はいません。
