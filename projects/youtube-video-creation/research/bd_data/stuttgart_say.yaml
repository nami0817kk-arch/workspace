episode:
  id: episode
  heading: 1989年、マラドーナのナポリと決勝。どこまで迫ったのか
  tier: 背景
  telop: 1989年のユーエファカップ決勝。ナポリに合計4対5
  narrator: 解説
  card:
    type: table
    title: 1988-89のユーエファカップ
    columns: ["", ""]
    rows:
      - ["準決勝", "ドレスデンに合計2対1"]
      - ["決勝 1戦目（敵地）", "ナポリに1対2"]
      - ["決勝 2戦目（ホーム）", "ナポリと3対3"]
  say:
    - text: 1989年、シュツットガルトはユーエファカップを勝ち進みます。
      image: assets/images/bd_stuttgart_neckar/scene.jpg
    - いまのヨーロッパリーグの、前身の大会です。
    - 準決勝は東ドイツのドレスデン。合計2対1で、決勝へ進みました。
    - 決勝の相手は、マラドーナが主将を務めるナポリです。
    - 1戦目は敵地で1対2の負け。先制のあと、マラドーナのPKで追いつかれました。
    - 2戦目は、いまの本拠地で3対3の引き分け。
    - クリンスマンも決めましたが、合計4対5で敗れ、届きませんでした。
  sources:
    - https://en.wikipedia.org/wiki/1989_UEFA_Cup_final
    - https://en.wikipedia.org/wiki/1988%E2%80%9389_UEFA_Cup

legends:
- - ヒルデブラントは1999年から8年、シュツットガルトのゴールを守りました。
  - "2003年から04年に、**884分**続けて無失点。ブンデスリーガの記録です。"
- - バラコフは1995年から2003年まで在籍。ブルガリア代表で92試合の司令塔です。
  - シュツットガルトでは、エウベル、ボビッチと攻めを組みました。
  - 1997年には、ドイツカップを獲っています。
- - ゴメスはシュツットガルトに2度在籍。2003年からと、2018年からです。
  - "2007年の優勝の年は**14得点**。ドイツの年間最優秀選手にもなりました。"
