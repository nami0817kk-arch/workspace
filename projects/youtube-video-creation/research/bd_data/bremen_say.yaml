manager:
- 今季の監督は、ダニエル・ティウネ。**52歳**です。
- 選手時代はオスナブリュックの中盤で、リーグ戦161試合61得点。
- 2020年から21年には、ハンブルガーSVの監督も務めました。
- 2026年2月4日に就任し、昨季は15位で残留させました。
