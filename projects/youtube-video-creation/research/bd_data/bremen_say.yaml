data:
- 創立は**1899年**。綱引きの大会でボールを勝ち取った、16歳の学生たちが作りました。
- 本拠地のヴェーザーシュタディオンは、1909年から同じ場所にあります。
- ドイツ王者は**4回**。ドイツカップは6回です。
- ヨーロッパでは、1992年にカップウィナーズカップで優勝しています。
- 昨季は**15位**。勝ち点32で残りました。
data_focus: [0, 3, 5, 6, 8]

story_sections:
  - id: japan
    heading: 奥寺康彦から菅原由勢まで。ブレーメンと日本は、どうつながってきたのか
    tier: 背景
    telop: 1981年に奥寺康彦が加入。キリンカップで2度優勝。大迫勇也、菅原由勢もプレー
    narrator: 解説
    say:
      - text: 1981年、ブレーメンに日本人が加わります。奥寺康彦です。
        image: assets/backgrounds/stadium_ブレーメン_in.png
        card:
          type: table
          title: ブレーメンと日本
          columns: ["年", "出来事"]
          rows:
            - ["1981年", "奥寺康彦が加入"]
            - ["1982・86年", "日本のキリンカップで優勝"]
            - ["2018年", "大迫勇也が加入"]
            - ["2025年", "菅原由勢が加入"]
      - ウイングだった奥寺を、監督のレーハーゲルはサイドバックで使いました。
      - 1986年までの5季で、リーグ戦**159試合**。チームは2位に3回入っています。
      - text: 1982年と86年には、日本で開かれたキリンカップで優勝。
        card: none
        image: assets/backgrounds/stadium_ブレーメン.png
      - 86年は東京で日本代表に2対0。決勝ではパルメイラスに、延長の末4対2で勝ちました。
      - text: 2018年には、大迫勇也がケルンから加わります。
        card: none
        image: assets/images/bd_bremen_pair_japan/01.jpg
      - 3季で、リーグ戦**75試合11得点**。
      - 昨季は菅原由勢が、サウサンプトンから期限付きで加わり、リーグ戦31試合に出ました。
    sources:
      - https://en.wikipedia.org/wiki/Yasuhiko_Okudera
      - https://en.wikipedia.org/wiki/Kirin_Cup_Soccer
      - https://en.wikipedia.org/wiki/Yuya_Osako
      - https://en.wikipedia.org/wiki/Yukinari_Sugawara
  - id: golden
    heading: 2度落ちたブレーメンは、なぜ2度とも1年で1部に戻れたのか
    tier: 背景
    telop: 1980年と2021年に降格。どちらも翌年に昇格。1部は今季で62季目
    narrator: 解説
    main: true
    say:
      - text: 1963年に始まったブンデスリーガ。ブレーメンは、最初の16クラブの1つです。
        image: assets/backgrounds/stadium_ブレーメン.png
      - 初めて落ちたのは1980年。34試合で93失点し、17位でした。
      - text: 翌季の2部北は42試合。30勝を挙げ、**97得点**で1位。1年で戻ります。
        card:
          type: table
          title: 2度の降格と復帰
          columns: ["季", "結果"]
          rows:
            - ["1979〜80年", "17位で降格"]
            - ["1980〜81年", "2部北で1位、昇格"]
            - ["2020〜21年", "17位で降格"]
            - ["2021〜22年", "2部で2位、昇格"]
      - text: その1981年の4月、監督に就いたのがオットー・レーハーゲルです。
        card: none
        image: assets/images/bd_bremen_pair_rehhagel/01.jpg
      - 14年の在任で、ブンデスリーガ優勝が2回、ドイツカップも2回。
      - 1992年にはカップウィナーズカップで、ヨーロッパの頂点にも立ちました。
      - text: 2度目の降格は2021年。17位で、41年ぶりでした。
        image: assets/backgrounds/stadium_ブレーメン.png
      - 前の年も16位で入れ替え戦に回り、アウェーゴールの差で残っていました。
      - text: 2部での1季目、ニクラス・フュルクルクがリーグ戦**19得点**。
        image: assets/images/bd_bremen_pair_fullkrug/01.jpg
      - チームは2位に入り、また1年で戻ります。
      - 1部は、今季で62季目。同じ数を持つのは、バイエルンだけです。
    sources:
      - https://en.wikipedia.org/wiki/SV_Werder_Bremen
      - https://en.wikipedia.org/wiki/List_of_SV_Werder_Bremen_seasons
      - https://en.wikipedia.org/wiki/Otto_Rehhagel
      - https://en.wikipedia.org/wiki/Niclas_F%C3%BCllkrug

features:
- "ブレーメンの特徴の1つめは、名前です。"
- "ヴェルダーは、ドイツ語で「川の中洲」。最初に試合をした、川べりのグラウンドから来ています。"
- "2つめは、ゴールのあと。スタジアムに霧笛が鳴り、「500マイル」という歌が流れます。"
- "3つめは、エンブレム。1929年から、ひし形にWの形です。"
- "2002年からは、クリスマス前の最後の試合だけ、ひし形の代わりにモミの木が入ります。"
