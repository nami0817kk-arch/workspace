title: ブレーメンは2度落ちて、2度とも1年で戻った。なぜすぐに1部へ帰れたのか
short_title: ブレーメン、なぜ2度とも1年で1部へ
opening: "ヴェーザー川のほとり、緑と白のクラブ。"
hook: 1部を離れたのは、64季のうち2季だけです。
