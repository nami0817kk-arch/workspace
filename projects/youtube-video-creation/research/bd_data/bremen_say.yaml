season:
- text: ブレーメンは、ここまでの8試合で4勝3分1敗。勝ち点は15。
  card:
    type: stats
    title: 今季のリーグ戦（8試合）
    items:
    - ["15", "", "勝ち点"]
    - ["9", "", "フュルクルクの得点"]
    - ["1", "", "負け"]
