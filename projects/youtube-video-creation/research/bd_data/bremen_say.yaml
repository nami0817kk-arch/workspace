- 負けたのは、開幕のフライブルク戦だけ。そこから7試合、負けていません。
- text: チームの17得点のうち、**9点**がフュルクルクです。
  mark: {kind: circle, item: 1}
- text: 2部から1年で戻った季に19点を取った選手が、ウェストハムから期限付きで帰ってきました。
  card: none
  image: assets/images/bd_bremen_pair_fullkrug/01.jpg
- 勝ち点は1試合あたり**1.88**。昨季の0.94の、ほぼ倍です。
- 得点は1試合2.13で、昨季の1.09から増えました。失点は1.75で、昨季の1.76とほぼ同じです。
- text: 11月22日には、ホームにハンブルガーSVを迎えます。北の2クラブのダービーです。
