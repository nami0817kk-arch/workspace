episode:
  id: episode
  heading: 2004年、ブレーメンはどうやって初めての2冠を手にしたのか
  tier: 背景
  telop: 1999年にシャーフが監督に。2004年、リーグとドイツカップの2冠
  narrator: 解説
  card:
    type: table
    title: シャーフのブレーメン
    columns: ["", ""]
    rows:
      - ["1999年", "シャーフが監督に"]
      - ["2003〜04年", "リーグ22勝、79得点"]
      - ["2004年5月", "リーグ優勝"]
      - ["2004年5月", "ドイツカップ優勝"]
  say:
    - text: 1999年5月、トーマス・シャーフが監督に就きます。ブレーメンの元選手で、育成のコーチでした。
      image: assets/images/bd_bremen_schaaf/scene.jpg
    - 数週間後のドイツカップ決勝で、バイエルンにPK戦で勝ちました。
    - 2003年から04年のシーズン、リーグ戦34試合で22勝、**79得点**。
    - アイウトンが**28得点**。ブレーメンの選手が1季で挙げた、いちばん多い数です。
    - text: 5月8日、ミュンヘンでバイエルンに3対1。
      card: none
      image: assets/backgrounds/stadium_ブレーメン_in.png
    - 2位のバイエルンに勝ち点6の差をつけて、優勝しました。
    - ドイツカップの決勝もアーヘンに3対2。初めての、リーグとカップの2冠です。
  sources:
    - https://en.wikipedia.org/wiki/2003%E2%80%9304_SV_Werder_Bremen_season
    - https://en.wikipedia.org/wiki/SV_Werder_Bremen

legends:
- - ピサロは、ペルーのフォワード。1999年にブレーメンへ来て、5度にわたって在籍しました。
  - 2019年には40歳でゴールを決め、ブンデスリーガの最年長得点の記録を作ります。
  - "リーグ戦**250試合109得点**。クラブの歴代最多得点です。"
- - クローゼは、ドイツのフォワード。2004年に、カイザースラウテルンから加わりました。
  - 2005年から06年のシーズンに25得点で得点王。ドイツの年間最優秀選手にも選ばれます。
  - "2007年まで、リーグ戦**89試合53得点**。"
- - ディエゴは、ブラジルの攻撃的な中盤。2006年に加わりました。
  - 2009年は、ドイツカップの優勝と、UEFAカップの決勝進出を経験します。
  - "2009年まで、リーグ戦**84試合38得点**。"
legend_rows:
- ["ピサロ", "1999-2020に5度", "リーグ250試合109得点"]
- ["クローゼ", "2004-2007", "リーグ89試合53得点"]
- ["ディエゴ", "2006-2009", "リーグ84試合38得点"]
