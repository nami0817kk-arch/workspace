  - 2度の在籍で、クラブの最多得点を持っています。
- - ポウルセンは2013年、まだ3部だったライプツィヒに加わりました。
  - 3部から1部まで、3年で駆け上がった1人です。
  - "12年在籍し、全公式戦で**425試合**。クラブの最多出場です。"
- - グラーチは2015年、2部のときに加わったゴールキーパー。
  - 2021年から主将。2022年、クラブ初のタイトルとなるドイツカップを獲りました。
  - "全公式戦で**362試合**。2026年まで、ライプツィヒのゴール前に立ちました。"
