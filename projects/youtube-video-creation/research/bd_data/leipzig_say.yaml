    title: 2019-20のチャンピオンズリーグ
    columns: ["", ""]
    rows:
      - ["グループ", "リヨン、ベンフィカ、ゼニトを抑えて1位"]
      - ["ベスト16", "トッテナムに合計4対0"]
      - ["準々決勝", "アトレティコに2対1"]
      - ["準決勝", "パリ・サンジェルマンに0対3"]
  say:
    - text: 2019年から20年のチャンピオンズリーグ。
      image: assets/images/bd_leipzig_episode/scene.jpg
    - ライプツィヒは、グループを1位で抜けます。
    - 率いたのは、1987年生まれのナーゲルスマンです。
    - ベスト16はトッテナム。敵地で1対0、ホームで3対0の勝ち。点を与えませんでした。
    - 準々決勝からは、リスボンでの一発勝負。観客のいない試合です。
    - アトレティコ・マドリードに2対1。決勝点は88分、タイラー・アダムスでした。
    - 準決勝はパリ・サンジェルマンに0対3。初めての4強で、止まりました。
