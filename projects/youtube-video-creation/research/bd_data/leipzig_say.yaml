data:
- 創立は**2009年**。5部のクラブから、出場の権利を買って始まりました。
- 愛称は「ディ・ローテン・ブレン」。ドイツ語で、赤い雄牛です。
- ホームタウンはライプツィヒ。人口は約**63万人**で、ドイツで8番目の都市です。
- 本拠地はレッドブル・アレーナ。収容は**4万7800人**。
- 旧東ドイツの地域では、いちばん大きなサッカー場です。
- 運営会社の株は、レッドブルが**99%**。ただ、ドイツの決まりで、議決権の過半はクラブ側が持ちます。
- タイトルはドイツカップが**2回**。2022年と2023年に連覇しました。
- クラブの最多得点は、ティモ・ヴェルナーの**113点**です。
- 直近のタイトルは、2023年8月のスーパーカップ。リーグ王者のバイエルンに3対0で勝ちました。
- 昨季のリーグ戦は**3位**。勝ち点**65**で、今季のチャンピオンズリーグの切符を取りました。
data_focus: [0, 1, 2, 3, 3, 4, 5, 6, 7, 8]

story_sections:
  - id: rise
    heading: 5部から7年で1部へ。どうやって駆け上がったのか
    tier: 背景
    telop: 2009年に5部で始まり、2016年に1部へ。1部の1季目は2位
    narrator: 解説
    main: true
    card:
      type: table
      title: ライプツィヒが1部に上がるまで
      columns: ["", ""]
      rows:
        - ["2009-10 5部", "1位。74得点17失点"]
        - ["2010-13 4部", "3季目に1位、入れ替え戦も勝つ"]
        - ["2013-14 3部", "2位。1季で2部へ"]
        - ["2014-16 2部", "5位のあと、2位で1部へ"]
        - ["2016-17 1部", "2位。勝ち点67"]
    say:
      - 会社のレッドブルは、3年半をかけて、ドイツで投資先を探しました。
      - 選んだのはライプツィヒ。1994年から、1部のクラブが無い街でした。
      - 最初のシーズンは5部で1位。**74得点**で、失点は17です。
      - 4部では2度足踏みし、3季目に1位。昇格をかけたプレーオフも勝ち抜きます。
      - 3部は1季で2位。3部ができてから、1季で2部へ上がった初めてのクラブです。
      - 2部の2季目を前にした2015年の夏、新しい選手に使ったのは約1860万ユーロ。
      - 2部のほかのクラブを、全部合わせたより多い額でした。
      - text: そのシーズンに2位。創立から7年の2016年、1部に届きました。
        card: none
        image: assets/images/bd_leipzig_rise/scene.jpg
      - 1部の1季目は、開幕から13試合負けなし。昇格したクラブの記録です。
      - 最後は2位。勝ち点**67**で、いきなりチャンピオンズリーグへ進みました。
    sources:
      - https://en.wikipedia.org/wiki/RB_Leipzig
      - https://site.api.espn.com/apis/v2/sports/soccer/ger.1/standings?season=2016

