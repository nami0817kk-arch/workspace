season:
- text: ホームでは4試合で2勝2分け。まだ負けていません。
  card:
    type: stats
    title: 今季のリーグ戦（8試合）
    items:
    - ["8", "", "ホームの勝ち点"]
    - ["1", "", "アウェーの勝ち点"]
    - ["0", "", "ホームの負け"]
    focus: 0
- text: 勝ち点9のうち、**8**はホームで取ったものです。
  mark: {kind: circle, item: 0}
- アウェーの4試合は、1分け3敗です。
- text: 兄弟で点を決めているのが、エル・マラ兄弟。弟のサイードが2点、兄のマレクも1点です。
  card: none
  image: assets/backgrounds/stadium_ケルン_in.png
- サイードは20歳。ポドルスキが最後に着けた背番号10を、受け継いでいます。
- 1試合で割ると、勝ち点は**1.13**。昨季の0.94を上回っています。
- 失点は1試合**1.50**で、昨季の1.85より少なくなりました。
- 得点は1試合1.13で、昨季の1.44には届いていません。
- text: 11月20日には、アウェーでバイエルンと戦います。
  image: assets/backgrounds/stadium_ケルン.png
