episode:
  id: episode
  heading: 1965年、ケルンはなぜコイン投げでヨーロッパの大会を去ったのか
  tier: 背景
  telop: 1965年の準々決勝、リヴァプールと3試合引き分け。勝ち上がりはコイン投げで決まった
  narrator: 解説
  card:
    type: table
    title: 1965年 リヴァプールとの準々決勝
    columns: ["", ""]
    rows:
      - ["2月10日", "1戦目 0対0"]
      - ["3月17日", "2戦目 0対0"]
      - ["3月24日", "再試合 2対2"]
      - ["決め方", "コイン投げ"]
  say:
    - text: 1964年から65年のシーズン。ケルンはヨーロッパの王者を決める大会で、準々決勝に進みます。相手はリヴァプールです。
      image: assets/images/bd_koln_rotterdam/scene.jpg
    - ホームとアウェーの2試合は、どちらも0対0。
    - 3月24日、オランダのロッテルダムで再試合が開かれます。
    - ケルンは0対2から追いつき、延長でも2対2。当時はPK戦がありませんでした。
    - text: 勝ち上がりは、コイン投げで決めることになります。
      card: none
      image: assets/images/bd_koln_coin2/scene.jpg
    - 1回目は、投げたものが地面に縦に刺さって決まらず、投げ直し。
    - 2回目でリヴァプールの側が出て、ケルンは大会を去りました。
  sources:
    - https://en.wikipedia.org/wiki/1964%E2%80%9365_European_Cup
    - https://en.wikipedia.org/wiki/1._FC_K%C3%B6ln
    - https://de.wikipedia.org/wiki/1._FC_K%C3%B6ln

legends:
- - オヴェラートは、西ドイツの攻撃的な中盤。1962年から77年まで、ケルンひと筋でした。
  - 1974年には、西ドイツ代表としてワールドカップで優勝します。
  - "リーグ戦**409試合83得点**。公式戦549試合は、クラブの最多出場です。"
- - リトバルスキーは、ドリブルが持ち味の西ドイツのアタッカー。1978年にケルンでプロになりました。
  - 1990年のワールドカップで優勝。のちに日本のジェフ市原でもプレーし、横浜FCの監督も務めます。
  - "ケルンには2度在籍して、リーグ戦**406試合116得点**。"
- - ポドルスキは、ケルンの下部組織で育ったフォワード。2003年にトップチームに上がりました。
  - ドイツ代表では130試合49得点。のちにヴィッセル神戸でもプレーします。
  - "ケルンには2度在籍して、リーグ戦**169試合79得点**。"
legend_rows:
- ["オヴェラート", "1962-1977", "409試合83得点"]
- ["リトバルスキー", "1978-1993に2度", "406試合116得点"]
- ["ポドルスキ", "2003-2012に2度", "169試合79得点"]
legend_sources:
