data:
- 創立は**1948年**。街の2つのクラブが合併して生まれました。
- 本拠地のラインエネルギー・シュタディオンには、5万人が入ります。
- ドイツ王者は**3回**。ドイツカップは4回です。
- ヨーロッパでは1986年、UEFAカップの決勝まで進みました。
- 昨季は**14位**。2部から戻った1年目を、勝ち点32で残りました。
data_focus: [0, 3, 5, 6, 8]

story_sections:
  - id: japan
    heading: 奥寺康彦から大迫勇也まで。ケルンと日本は、どうつながってきたのか
    tier: 背景
    telop: 1977年に奥寺康彦が加入し、2冠を経験。2014年に大迫勇也と長澤和輝が加入
    narrator: 解説
    say:
      - text: 1977年、ケルンに日本人が加わります。奥寺康彦です。
        image: assets/backgrounds/stadium_ケルン_in.png
        card:
          type: table
          title: ケルンと日本
          columns: ["年", "出来事"]
          rows:
            - ["1977年", "奥寺康彦が加入"]
            - ["1979年", "ヨーロッパの大会で、アジア人初ゴール"]
            - ["2011年", "槙野智章が加入"]
            - ["2014年", "大迫勇也・長澤和輝が加入"]
      - 10月5日にデビュー。ヨーロッパの1部でプレーした、最初の日本人でした。
      - その季、ケルンはリーグとドイツカップの2冠に輝きます。
      - text: 奥寺を見いだしたのは、監督のヘネス・ヴァイスヴァイラーでした。
        card: none
        image: assets/images/bd_koln_weisweiler/scene.jpg
      - 1979年4月には、ヨーロッパの王者を決める大会の準決勝で、ノッティンガム・フォレストから得点。
      - この大会で点を取った、最初のアジアの選手です。
      - 3季で、リーグ戦**75試合15得点**。
      - text: 2014年には、大迫勇也が加わります。
        image: assets/images/bd_koln_pair_osako/01.jpg
      - 4季で、リーグ戦**108試合15得点**。
      - 同じ年に長澤和輝も加わり、リーグ戦21試合に出ました。
    sources:
      - https://en.wikipedia.org/wiki/Yasuhiko_Okudera
      - https://en.wikipedia.org/wiki/Yuya_Osako
      - https://en.wikipedia.org/wiki/Kazuki_Nagasawa
      - https://en.wikipedia.org/wiki/Tomoaki_Makino
  - id: golden
    heading: 初代王者のケルンは、なぜ1部と2部を7回も行き来したのか
    tier: 背景
    telop: 1998年に初めての降格。2024年までに降格7回、昇格7回。今季が1部54季目
    narrator: 解説
    main: true
    say:
      - text: 1963年に始まったブンデスリーガ。ケルンは最初の16クラブの1つで、その最初の季に優勝しました。
        image: assets/backgrounds/stadium_ケルン.png
      - そこから**35年**、一度も2部に落ちていません。1978年には、リーグとカップの2冠です。
      - text: 流れが変わったのは1998年。初めての降格でした。
        card:
          type: table
          title: 1部と2部の行き来
          columns: ["年", "出来事"]
          rows:
            - ["1998年", "初めての降格"]
            - ["2002〜06年", "降格と昇格を毎年のように"]
            - ["2012年", "降格。借金は3300万ユーロ"]
            - ["2018年", "最下位で降格"]
            - ["2024年", "降格。翌年に2部で優勝"]
      - 2001年から2006年までは、昇格と降格を毎年のようにくり返します。
      - 2001年から02年のシーズンには、**1034分**、点が入りませんでした。ブンデスリーガで最も長い記録です。
      - text: 2012年に落ちたときは、借金が3300万ユーロにふくらんでいました。
        card: none
        image: assets/backgrounds/stadium_ケルン_in.png
      - そこから立て直し、2017年には25年ぶりにヨーロッパの大会へ。売り上げは5600万ユーロから、1億2000万ユーロを超えるまでに。
      - ところが翌季は、最初の16試合で勝ち点3。最下位で落ちます。
      - text: 7回目の降格は2024年。それでも翌年、2部で優勝して1年で戻りました。
        image: assets/backgrounds/stadium_ケルン.png
      - 落ちたのは7回。そして7回とも、1部へ帰ってきています。
      - 今季は、1部で**54季目**です。
    sources:
      - https://en.wikipedia.org/wiki/1._FC_K%C3%B6ln
      - https://de.wikipedia.org/wiki/1._FC_K%C3%B6ln

features:
- text: "ケルンの特徴の1つめは、愛称です。「ガイスベッケ」、ドイツ語で雄ヤギたち。"
  image: assets/images/bd_koln_hennes/scene.jpg
- "1950年2月13日、創立からちょうど2年の日に、サーカスの団長が子ヤギを贈りました。"
- "名前は、選手兼監督だったヴァイスヴァイラーから取って「ヘネス」です。"
- "2つめは、そのヤギがいまもいること。エンブレムにも描かれ、いまは9代目です。"
- "3つめは、試合前の歌。「メア・シュトン・ツォ・ディア」を、スタジアム中で歌います。"
features_marks: [3, 4]
features_telop: 愛称は「雄ヤギたち」。生きたヤギのヘネスはいま9代目。試合前は全員で歌う
features_rows:
