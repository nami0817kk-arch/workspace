manager:
- ケルンの今季の監督は、ルネ・ヴァーグナー。**38歳**です。
- 選手としては、ドイツの下部リーグと、アメリカ・ハワイの大学でプレーしました。
- 2020年からはコーチとして、パーダーボルンやケルンなどで監督を支えます。
- 2026年3月に暫定で指揮を執り、ケルンを1部に残して、5月に正式な監督になりました。
manager_telop: 監督はヴァーグナー。2026年5月に正式に就任
manager_rows:
- ["監督", "ルネ・ヴァーグナー"]
- ["就任", "2026年5月22日（正式）"]
- ["前の仕事", "ケルンのコーチ"]
