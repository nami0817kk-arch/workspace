title: ケルンはブンデスリーガ最初の王者。それでも1部と2部を7往復したのは、なぜ？
short_title: ケルン、初代王者が1部と2部を7往復したわけ
opening: "大聖堂の街ケルン。紋章は雄ヤギ。"
hook: 会員はおよそ17万人。ドイツで6番目に大きなスポーツクラブです。
