manager:
- パーダーボルンの今季の監督は、ドイツ人のラルフ・ケッテマン。**40歳**です。
- 2011年から2019年は、6部のTSVイルスホーフェンで選手兼監督。5部への昇格を決めています。
- そのあとホッフェンハイムのU23でコーチを務め、2021年からは、カールスルーエの下部組織を率いました。
- 2025年に、パーダーボルンの監督になりました。2部から1部への昇格を、1年目で決めています。
