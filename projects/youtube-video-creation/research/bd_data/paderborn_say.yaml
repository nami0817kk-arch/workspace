episode:
  id: episode
  heading: パーダーボルンは2026年、なぜ3位から1部に上がれたのか
  tier: 背景
  telop: 2025年から26年の2部は3位。入れ替え戦でヴォルフスブルクに合計2対1
  narrator: 解説
  card:
    type: table
    title: 2025年から26年の2部
    columns: ["", ""]
    rows:
      - ["最終節の前", "3チームが勝ち点59"]
      - ["最終順位", "3位（2位はエルフェルスベルク）"]
      - ["入れ替え戦", "ヴォルフスブルクに合計2対1"]
  say:
    - text: 2025年から26年の2部。最終節を前に、3つのクラブが勝ち点59で並びました。
      image: assets/backgrounds/stadium_パーダーボルン_in.png
    - エルフェルスベルク、ハノーファー、そしてパーダーボルンです。
    - 自動昇格は2枠。優勝のシャルケは、すでに決まっていました。
    - 2位は、エルフェルスベルク。パーダーボルンは、3位になりました。
    - 3位は、1部の16位との入れ替え戦へ。相手は、ヴォルフスブルクでした。
    - 1試合目は、アウェーで0対0。
    - 2試合目は、ホームです。延長にもつれ込み、2対1で勝ちました。
    - 合計は2対1。パーダーボルンは、3度目の1部を決めました。
  sources:
    - https://de.wikipedia.org/wiki/SC_Paderborn_07
    - https://en.wikipedia.org/wiki/SC_Paderborn_07

legends:
- - バウムガルトは、2017年の4月に監督になった人です。2021年まで、4年あまり指揮を執りました。
  - 3部で18位だったチームを、2017年から18年に2位へ。
  - 翌年は2部でも2位に入り、1部へ連れ戻しました。
- - ヒューネマイアーは、ディフェンダー。2013年から15年と、2018年から23年の、2度プレーしました。
  - あわせて、リーグ戦**182試合8得点**。
  - 2015年に降格したときは、主将でした。間の3年は、イングランドのブライトンでプレーしています。
- - ヴランチッチは、2012年から15年のミッドフィールダー。リーグ戦**93試合12得点**です。
  - 初めて1部に上がる前後を、ピッチで支えた主力の1人でした。
  - その後は、イングランドのノリッジで、リーグ戦**123試合**に出ています。
