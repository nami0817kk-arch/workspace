data:
- 合併したのは**1985年**。クラブ名の「07」は、前身の創立年、1907年に由来します。
- クラブの色は、青と黒。
- ホームタウンは、ノルトライン＝ヴェストファーレン州のパーダーボルンです。
- 本拠地はホーム・デラックス・アレーナ。収容は**1万5000人**で、2008年に開場しました。
- 会員は**1万1300人**います。
- タイトルは、地域のカップ優勝が**9回**。
- 1部には、2014年、2019年、2026年と、3回上がっています。
- 初めての1部で、第4節のあとには、首位に立ちました。
- 昨シーズンは、2部で**3位**。入れ替え戦に勝って、昇格を決めました。
data_focus: [0, 1, 2, 3, 4, 5, 6, 7, 8]

story_sections:
  - id: rise
    heading: 1部から3部まで落ちたパーダーボルンは、どうやって1部に戻ってきたのか
    tier: 背景
    telop: 2014年に初の1部。1部と2部で最下位、3部も18位。2017年から2年連続で昇格
    narrator: 解説
    main: true
    say:
      - text: 2014年。パーダーボルンは、初めての1部に上がります。
        card:
          type: table
          title: パーダーボルンの歩み
          columns: ["年", "出来事"]
          rows:
            - ["2014-15", "1部で18位、降格"]
            - ["2015-16", "2部で最下位、降格"]
            - ["2016-17", "3部で18位"]
            - ["2017-18", "3部2位、2部へ"]
            - ["2018-19", "2部2位、1部へ"]
      - ただ、1部は1年で終わります。最終順位は、18位でした。
      - 翌2015年から16年は、2部でも最下位。3部に落ちます。
      - text: 2016年から17年は、3部でも18位。3年続けて、降格の順位でした。
        card: none
        image: assets/backgrounds/stadium_パーダーボルン.png
      - ところが、ミュンヘン1860がライセンスを得られず、4部へ移ります。
      - おかげでパーダーボルンは、3部に残ることができました。
      - 立て直したのは、シュテフェン・バウムガルト。監督になった4月から、5試合で勝ち点11を取ります。
      - 翌季は2位で、2部へ。その次の年も2位で、1部へ戻りました。
      - 2019年から20年の1部は、勝ち点20で最下位。1年で、2部に戻ります。
    sources:
      - https://de.wikipedia.org/wiki/SC_Paderborn_07
      - https://en.wikipedia.org/wiki/SC_Paderborn_07

