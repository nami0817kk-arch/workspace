# 基礎DATA。話す順は共通（創立→愛称→ホームタウン→本拠地→オーナー→タイトル歴→記録→直近→昨季）
data:
- 創立は**1900年**。体操クラブを出た11人が、その夜のうちに作りました。
- 愛称は「赤い人たち」。ほかに、「南の星」とも呼ばれます。
- ホームタウンはミュンヘン。人口は**158万人**で、ドイツで3番目に大きな街です。
- 本拠地はアリアンツ・アレーナ。**7万5000人**が入ります。
- 18クラブで、ドルトムントに次ぐ2番目の大きさです。
- オーナーは、クラブの会員組織。株の**75%**を持ちます。アディダス、アウディ、アリアンツは各8.33%。
- ブンデスリーガの優勝は**34回**。1932年を含めたドイツ王者は**35回**、カップは**21回**です。
- 最多出場は、トーマス・ミュラー。このクラブで**756試合**に出ました。
- 直近のタイトルは、今年**8月**のスーパーカップ。ドルトムントを2対1で下しました。
- 昨季のリーグ戦は**1位**。勝ち点は**89**。2位のドルトムントとは、16の差でした。
data_focus: [0, 1, 2, 3, 3, 4, 5, 6, 7, 8]

# クラブの話。1枚のカードを20秒以上出さないため、3つに割る
story_sections:
  - id: history
    heading: ブンデスリーガに、入れなかった年
    tier: 背景
    telop: 1963年、南部の5クラブに入れず。1965年に昇格
    narrator: 解説
    card:
      type: table
      title: 1963年、ブンデスリーガの発足
      columns: ["", ""]
      rows:
        - ["1963年", "全国リーグが発足"]
        - ["南部から選ばれた数", "5クラブ"]
        - ["バイエルン", "過去12年で6位。選ばれず"]
    say:
      - 1963年、ドイツに、全国リーグのブンデスリーガが生まれます。
      - ドイツ南部から選ばれたのは、5クラブ。物差しは、過去12年の成績でした。
      - バイエルンは、その順位が**6位**。選ばれなかったのです。
      - 同じ街の1860ミュンヘンは7位でしたが、直前の優勝を評価されて入りました。
      - 若い選手は、ベッケンバウアー、ゲルト・ミュラー、マイヤー。
      - このチームで、**1965年**に昇格します。
    sources:
      - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  - id: history2
    heading: 3年連続、ヨーロッパの頂点
    tier: 背景
    telop: 1974〜76年、ヨーロッパ杯3連覇
    narrator: 解説
    card:
      type: table
      title: ヨーロッパ杯、3連覇
      columns: ["", ""]
      rows:
        - ["1974年", "初優勝。再試合で4対0"]
        - ["1975年", "リーズを破る"]
        - ["1976年", "サンテティエンヌを破り3連覇"]
    say:
      - 1967年、バイエルンは、初めてヨーロッパの大会を制します。
      - 会場は、各国のカップ優勝クラブが集まる、カップウィナーズカップ。
      - 決勝は、レンジャーズに1対0でした。
      - 1974年は、ヨーロッパ杯の決勝。いまのチャンピオンズリーグの前身です。
      - アトレティコ・マドリードと引き分けます。
      - 再試合は**4対0**で勝って、初優勝です。
      - 1975年はリーズ、1976年はサンテティエンヌを破りました。
      - 3年連続の優勝は、史上3番目のクラブでした。
    sources:
      - https://en.wikipedia.org/wiki/FC_Bayern_Munich
  - id: history3
    heading: ドイツ初の3冠
    tier: 背景
    telop: 2013年、リーグ勝ち点91の記録とドイツ初の3冠
    narrator: 解説
    card:
      type: table
      title: 2012-13の3冠
      columns: ["", ""]
      rows:
        - ["リーグ", "勝ち点91。最多記録"]
        - ["欧州の決勝", "ドルトムントに2対1"]
        - ["1週間後", "カップも優勝。3冠"]
    say:
      - 2012年、バイエルンは、チャンピオンズリーグの決勝を本拠地で戦います。
      - ところが、ピーケー戦でチェルシーに敗れました。
      - その翌シーズン。リーグは、勝ち点**91**の最多記録で優勝します。
      - チャンピオンズリーグの決勝は、同じドイツのドルトムントに**2対1**。
      - 1週間後のカップ決勝にも勝って、ドイツのクラブとして初めて、3冠を達成しました。
    sources:
      - https://en.wikipedia.org/wiki/FC_Bayern_Munich

# このクラブの特徴（プレーの色・運営の型・クラブの気質）
features:
- "プレーの色は、攻めて、点を取り続けること。"
- "昨季のリーグ戦は**122得点**。それまでの最多は、1971-72の**101得点**でした。"
- "運営の型は、黒字。収入は**9億7830万ユーロ**で、**27年**続けて利益を出しています。"
- "気質は「ミア・サン・ミア」。バイエルン語で、「我々は我々だ」という意味です。"
- "会員は**43万人**を超え、世界で2番目に大きなスポーツクラブです。"
