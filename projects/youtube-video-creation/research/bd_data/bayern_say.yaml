# 「へえ」の逸話。英語版クラブ記事の History（1900年の創立）
episode:
  id: episode
  heading: 体操クラブを出た夜に
  tier: 背景
  telop: 1900年2月27日。その夜のうちに、新しいクラブができた
  narrator: 解説
  card:
    type: table
    title: 体操クラブを出た夜に
    columns: ["", ""]
    rows:
      - ["1900年2月27日", "体操クラブの総会"]
      - ["決まったこと", "サッカー部は連盟に入れない"]
      - ["その夜", "11人が出て、新クラブを作る"]
  say:
    - 1900年2月27日、ミュンヘンの体操クラブの総会が開かれました。
    - 決まったのは、サッカー部員は、ドイツサッカー連盟に入れない、ということ。
    - サッカー部の11人は、その場を出て、同じ晩に新しいクラブを作りました。
    - それが、バイエルンです。数か月のうちに、地元のクラブに大勝を重ねました。
  sources:
    - https://en.wikipedia.org/wiki/FC_Bayern_Munich

# このクラブを語る3人（1人3行）。数字は英語版 infobox のリーグ戦のみ
legends:
- - ラームは、ミュンヘン生まれ。11歳で、バイエルンの下部組織に入りました。
  - 2013年、主将として、チャンピオンズリーグの優勝カップを掲げました。
  - リーグ戦で**332試合12得点**。2017年、主将のまま現役を終えました。
- - ミュラーは、2000年に下部組織へ入った、地元バイエルン育ちのアタッカーです。
  - 2010年のワールドカップは、**5得点**で得点王。2020年の3冠では、**14得点**。
  - 出場はクラブ最多。**250得点223アシスト**を残し、2025年に退団しました。
- - 2014年、ライバルのドルトムントからバイエルンへ来たレヴァンドフスキ。
  - 2015年、途中出場から**8分59秒**で5得点。ブンデスリーガの最速記録です。
  - 2020-21は29試合で**41得点**。ゲルト・ミュラーの記録を超えました。
legend_rows:
- ["フィリップ・ラーム", "2002-2017", "2013年の優勝主将"]
- ["トーマス・ミュラー", "2008-2025", "クラブ最多756試合"]
- ["ロベルト・レヴァンドフスキ", "2014-2022", "1シーズン41得点"]
legend_sources:
- - https://en.wikipedia.org/wiki/Philipp_Lahm
- - https://en.wikipedia.org/wiki/Thomas_M%C3%BCller
- - https://en.wikipedia.org/wiki/Robert_Lewandowski

