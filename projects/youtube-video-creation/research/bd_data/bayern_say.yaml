# 今季。欧州の2試合（ESPN の scoreboard で確認：9/10 ボーデ・グリムトに5対0、10/13 ヴァイキングと3対3、次は10/21 アーセナル）
season:
- バイエルンは、チャンピオンズリーグ初戦のボーデ・グリムトに**5対0**の勝ち。
- 第2戦は、敵地でヴァイキングと**3対3**の引き分けでした。
- 次の第3戦は、10月21日。アーセナルが、アリアンツ・アレーナに来ます。
