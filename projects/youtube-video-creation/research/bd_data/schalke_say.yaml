data:
- 創立は**1904年**。最初の名前は、ヴェストファーレン・シャルケでした。
- 愛称は「クナッペン」。ドイツ語で「鉱夫たち」です。
- 本拠地は、フェルティンス・アレーナ。6万2000人が入ります。
- ドイツ王者は**7回**。ドイツカップは5回です。
- 昨季は2部で**1位**。勝ち点は70でした。
data_focus: [0, 1, 3, 5, 8]

story_sections:
  - id: japan
    heading: 内田篤人から田中聡まで。シャルケの日本人は、どうつながってきたのか
    tier: 背景
    telop: 内田篤人は2010年に加入。田中聡は今季、6試合に先発
    narrator: 解説
    say:
      - text: 最初の日本人は、2010年に加わった内田篤人です。
        card:
          type: table
          title: シャルケで戦った日本人
          columns: ["名前", "在籍", "リーグ戦"]
          rows:
            - ["内田篤人", "2010〜2017年", "104試合"]
            - ["板倉滉", "2021〜2022年", "31試合"]
            - ["吉田麻也", "2022〜2023年", "29試合"]
            - ["田中聡", "2026年〜", "6試合"]
      - 右サイドバックとして、7年でリーグ戦**104試合**に出ました。
      - 2021年には、板倉滉が加入。2部で**31試合**に出ました。
      - シャルケは2022年に、2部優勝で1部へ戻ります。
      - 2022年7月には、吉田麻也が加入。主将として、リーグ戦29試合に出ました。
      - text: ユニフォームの番号は、内田篤人と同じ**22番**。移籍の前には、内田に相談しています。
        card: none
        image: assets/images/bd_schalke_pair_jp/01.jpg
      - そして今季、田中聡が加わりました。2026年6月に、4年契約を結んでいます。
      - 開幕戦はベンチ。第2節のバイエルン戦から、先発に入りました。
    sources:
      - https://en.wikipedia.org/wiki/Atsuto_Uchida
      - https://en.wikipedia.org/wiki/K%C5%8D_Itakura
      - https://en.wikipedia.org/wiki/Maya_Yoshida
      - https://en.wikipedia.org/wiki/Satoshi_Tanaka
      - https://schalke04.de/en/teams/profis/person/satoshi-tanaka/
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884801
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884756
  - id: golden
    heading: ドイツ王者7回。なぜシャルケは、9年で6回も勝てたのか
    tier: 背景
    telop: 1934年から42年の9年で優勝6回。最後の優勝は1958年
    narrator: 解説
    main: true
    say:
      - 1904年、シャルケは高校生たちの手で生まれました。
      - 選手もファンも、多くは炭鉱で働く人たちでした。
      - text: 1928年には、自分たちの球場グリュックアウフ・カンプフバーンを建てます。
        image: assets/images/bd_schalke_golden/scene.jpg
      - 武器は「クライゼル」。短く速いパスで相手を振り回す、こまのような形です。
      - text: 1934年、ニュルンベルクを2対1で破り、初めてのドイツ王者に。
        card:
          type: table
          title: シャルケのドイツ王者
          columns: ["年", "結果"]
          rows:
            - ["1934", "初優勝"]
            - ["1935", "連覇"]
            - ["1937", "優勝"]
            - ["1939", "優勝"]
            - ["1940", "優勝"]
            - ["1942", "優勝"]
            - ["1958", "7回目"]
      - 翌1935年は、シュトゥットガルトに6対4で勝って連覇です。
      - text: 9年で6回。中心にいたのが、エルンスト・クツォラです。
        card: none
        image: assets/images/bd_schalke_pair_kuzorra/01.jpg
      - 最後の優勝は1958年。ハンブルガーSVを3対0で破りました。
      - 1963年に始まったブンデスリーガでは、まだ優勝がありません。
      - 2位は**7回**。最初が1972年で、いちばん新しいのが2018年です。
    sources:
      - https://en.wikipedia.org/wiki/FC_Schalke_04
      - https://en.wikipedia.org/wiki/Ernst_Kuzorra

