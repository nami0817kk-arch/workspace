title: シャルケはドイツ王者7回。なぜ1934年からの9年で6回も勝てたのか
short_title: シャルケ、なぜ9年で6回も王者になれたか
opening: "ドイツ王者7回。いまは日本人が1人。"
hook: 炭鉱の街の高校生が作ったクラブは、ドイツの頂点に、何度も立ちました。
