episode:
  id: episode
  heading: 2001年の最終節。なぜシャルケは「心のチャンピオン」と呼ばれたのか
  tier: 背景
  telop: 2001年5月19日。ロスタイムのバイエルンの同点ゴールで、優勝を逃した
  narrator: 解説
  card:
    type: table
    title: 2000年から01年のシーズン 最終節
    columns: ["", ""]
    rows:
      - ["日付", "2001年5月19日"]
      - ["シャルケ", "ウンターハッヒングに5対3"]
      - ["バイエルン", "ハンブルクで同点ゴール"]
      - ["優勝", "バイエルン"]
  say:
    - text: 2001年5月19日、ブンデスリーガの最終節です。
      image: assets/images/bd_schalke_pair_park/01.jpg
    - シャルケは、ホームでウンターハッヒングに5対3で勝ちました。
    - 同じ時間、首位のバイエルンは、ハンブルクで戦っています。
    - そのハンブルクが、90分に1点を取ります。
    - バイエルンが負ければ、シャルケの優勝。ファンは、ピッチへ駆け込みました。
    - text: ところが、ハンブルクの試合は終わっていませんでした。
      card: none
      image: assets/images/bd_schalke_pair_park/01.jpg
    - ハンブルクのGKが、味方からのバックパスを手で止めます。
    - ゴールの8メートルほど前から、バイエルンのフリーキック。
    - 決めたのは、パトリク・アンデションでした。
    - しかもそのGKは、シャルケから借りていた選手でした。
    - この年のシャルケは、ドイツで「心のチャンピオン」と呼ばれています。
  sources:
    - https://en.wikipedia.org/wiki/2000%E2%80%9301_Bundesliga

legends:
- - ノイアーは、シャルケの地元ゲルゼンキルヒェン出身のゴールキーパーです。
  - 2010年から主将。クラブ初のチャンピオンズリーグ準決勝へ導きました。
  - 2011年にドイツカップを獲り、バイエルンへ移りました。
- - フンテラールはオランダのフォワード。シャルケでは、2010年からプレーしました。
  - 2011年から12年のリーグ戦で**29得点**。
  - オランダ人で初めて、ブンデスリーガの得点王に輝きました。
  - ブンデスリーガの通算は**84得点**。クラブの歴代2位です。
- - アサモアは、1999年から2010年まで11年間、シャルケにいたフォワードです。
  - リーグ戦**279試合**は、クラブの歴代7位。
  - ドイツカップは、2001年と02年に優勝。
