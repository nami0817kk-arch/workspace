  heading: 神父が止めに来た夜
  tier: 背景
  telop: 1909年12月19日。居酒屋の一室で、18人がクラブを作った
  narrator: 解説
  card:
    type: table
    title: 神父が止めに来た夜
    columns: ["", ""]
    rows:
      - ["1909年12月19日", "居酒屋の一室に18人が集まる"]
      - ["止めに来た人", "教会の神父。入り口で阻まれる"]
      - ["「ボルシア」", "近くの醸造所のビールの名"]
      - ["黒と黄色の縞", "1913年から"]
  say:
    - 1909年12月19日、ドルトムントの居酒屋の一室に、18人の若者が集まりました。
    - 教会が見守る青少年チームに、不満を持っていた人たちです。
    - 神父が会合を止めに来ましたが、入り口で阻まれました。
    - 「ボルシア」は、プロイセンのラテン語名。
    - 名前は、近くの醸造所のビールから取りました。
  sources:
    - https://en.wikipedia.org/wiki/Borussia_Dortmund

legends:
- - ツォルクは、ドルトムント生まれ。17年間、このクラブ一筋でした。
  - "**159得点**を挙げ、リーグ戦の463試合は、クラブの最多です。"
- - ザマーは、旧東ドイツのドレスデン生まれ。1993年に、ドルトムントへ来ました。
  - 主将として、1995年と1996年にリーグ優勝。
  - 1996年には、バロンドールに選ばれます。
- - ロイスは、ドルトムント生まれ。ほかのクラブを経て、2012年に地元へ戻りました。
  - リーグ戦は**294試合120得点**。全大会では**170得点132アシスト**です。
  - 2017年と2021年のカップを獲りました。
