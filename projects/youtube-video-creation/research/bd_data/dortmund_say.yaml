data:
- 創立は**1909年**。教会のチームを離れた、18人の若者が作りました。
- 愛称は「黒と黄色」。ほかに「ボルセン」とも呼ばれます。
- ホームタウンはドルトムント。人口は約**61万人**で、ドイツで9番目に大きな街です。
- 本拠地はジグナル・イドゥナ・パルク。**8万1365人**が入ります。
- 18クラブで最大。バイエルンの本拠地より、6000人あまり多い大きさです。
- 2000年に株式を上場。ただ、経営を担う会社の株は、すべて会員組織が持ちます。
- ブンデスリーガの優勝は**5回**。ドイツ王者は**8回**、カップは**5回**です。
- 最多出場は、ミヒャエル・ツォルク。このクラブで**572試合**に出ました。
- 直近のタイトルは、**2021年**のカップ。決勝でライプツィヒに4対1でした。
- 昨季のリーグ戦は**2位**。勝ち点は**73**。首位バイエルンとは、16の差でした。
data_focus: [0, 1, 2, 3, 3, 4, 5, 6, 7, 8]

