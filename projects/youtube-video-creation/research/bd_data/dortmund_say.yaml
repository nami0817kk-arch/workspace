    heading: 香川真司が、二度戻ったクラブ
    tier: 背景
    telop: 香川真司。2010〜12年と2014〜19年に在籍
    narrator: 解説
    card:
      type: table
      title: 香川真司とドルトムント
      columns: ["", ""]
      rows:
        - ["1度目", "2010〜2012年。リーグ戦49試合21得点"]
        - ["2度目", "2014〜2019年。4年契約で復帰"]
        - ["公式戦の通算", "216試合60得点"]
    say:
      - text: 日本の香川真司は、ドルトムントで二度プレーしました。
        image: assets/photos/bd/dortmund/dortmund_japan_b03f6a89.jpg
      - 最初は2010年。セレッソ大阪から、わずか**35万ユーロ**で来ました。
      - 最初の公式戦は、ヨーロッパリーグの予選。いきなり2得点です。
      - 2010-11はリーグ優勝。後半戦は、けがで休みました。
      - text: 2012年のカップ決勝は、バイエルンに5対2。最初のゴールは、香川でした。
        image: assets/photos/bd/dortmund/dortmund_japan2_a60c624c.jpg
      - 2012年、マンチェスター・ユナイテッドへ移ります。
      - 2014年に、4年契約で戻ってきます。2度目は2019年まで。
      - 今年7月末、チームは日本ツアーに来ました。
      - 8月1日、東京の国立競技場で、FC東京に1対0の勝ちでした。
    sources:
      - https://www.bvb.de/de/de/aktuelles/news/news.html/News/Uebersicht/Shinji-Kagawa-kehrt-zu-Borussia-Dortmund-zurueck.html
