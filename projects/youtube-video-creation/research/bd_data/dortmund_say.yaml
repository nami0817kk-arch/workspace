manager:
- 今季の監督はニコ・コヴァチ。就任は**2025年1月**。
- 2018年は、フランクフルトの監督として、カップ決勝でバイエルンを破りました。
- 10月13日、契約を**2029年**まで延ばしました。
- 次の相手のフランクフルトは、その古巣です。
