    say:
      - ところが2005年、倒産寸前まで追い込まれます。
      - 株の値は、元の8割以上、下がっていました。
      - 若いチームは、2011年と2012年に、ブンデスリーガを連覇しました。
      - 2013年、チャンピオンズリーグの決勝は、ドイツ勢どうしで初めて。
      - 相手はバイエルンで、1対2で敗れました。
