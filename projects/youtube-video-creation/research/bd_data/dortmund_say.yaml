season:
- チャンピオンズリーグは、3試合で2勝1敗です。
- ビジャレアルに3対2の勝ち。ボーデ・グリムトには0対1の負け。
- 10月20日のサバーには、2対1の勝ちでした。
- 次は10月24日、ホームでフランクフルト。
- 10月31日は、敵地でバイエルンとの一戦です。
