manager:
- アウクスブルクの今季の監督は、ドイツ人のマヌエル・バウム。**47歳**です。
- 2016年の12月から2019年にも、アウクスブルクを率いました。
- そのあと、ドイツのU20代表とシャルケで指揮を執ります。
- 2025年に、2度目のアウクスブルクの監督になりました。
manager_telop: 監督はバウム。2016年から2019年に続き、2025年から2度目
manager_rows:
