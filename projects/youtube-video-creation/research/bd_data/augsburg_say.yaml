data:
- 創立は**1907年**。1969年に2つのクラブが合併して、いまの形になりました。
- 本拠地のWWKアレーナには、**3万660人**が入ります。
- 地域リーグの優勝は**7回**。最高成績は、2009年から2010年のドイツカップ準決勝です。
- ヨーロッパには2015年、ヨーロッパリーグで初めて出ました。
- 昨シーズンは**9位**。勝ち点43でした。
data_focus: [0, 3, 5, 6, 8]

story_sections:
  - id: rise
    heading: 4部まで落ちたアウクスブルクは、どうやって1部の常連になったのか
    tier: 背景
    telop: 2000年に4部へ。2011年に初の1部。2015年は過去最高の5位
    narrator: 解説
    main: true
    say:
      - text: 2000年。アウクスブルクは、3部のリーグで8位でした。
        image: assets/backgrounds/stadium_アウクスブルク_in.png
        card:
          type: table
          title: アウクスブルクの歩み
          columns: ["年", "出来事"]
          rows:
            - ["2000年", "ライセンスが出ず4部へ"]
            - ["2002年", "4部で優勝、3部へ復帰"]
            - ["2006年", "3部で優勝、2部へ"]
            - ["2011年", "初めての1部"]
            - ["2015年", "5位、過去最高"]
      - ところが、お金の問題でライセンスが出ません。
      - スポンサーが約束した保証金は届かず、借金は180万マルク。4部へ落とされます。
      - text: 立て直したのは、地元の実業家ヴァルター・ザインシュ。
        card: none
        image: assets/images/bd_augsburg_rosenau2/scene.jpg
      - 会長になって、お金の管理から作り直しました。
      - 2002年に4部で優勝。2006年には3部で優勝して、23年ぶりの2部へ。
      - text: 2009年、新しいスタジアムが完成します。
        image: assets/backgrounds/stadium_アウクスブルク.png
      - 2011年、2部で2位に入り、クラブ史上初めての1部へ。
      - 10月15日、1部での初勝利。マインツに1対0でした。
      - 2シーズン目は、前半戦で勝ち点9。最終節にフュルトに3対1で勝ち、残りました。
      - text: そして2015年、過去最高の5位。翌年は、初めてヨーロッパの舞台に立ちます。
        image: assets/backgrounds/stadium_アウクスブルク_in.png
      - 32強でリヴァプールと当たり、合計0対1でした。
    sources:
      - https://en.wikipedia.org/wiki/FC_Augsburg
  - id: japan
    heading: 宇佐美貴史はアウクスブルクで、どんな時間を過ごしたのか
    tier: 背景
    telop: 2016年にガンバ大阪から宇佐美貴史が加入。リーグ戦11試合、2017年から期限付き移籍
    narrator: 解説
    say:
      - text: アウクスブルクでプレーした日本人に、宇佐美貴史がいます。
        image: assets/images/bd_augsburg_usami_w/01.jpg
        card:
          type: table
          title: アウクスブルクと日本
          columns: ["年", "出来事"]
          rows:
            - ["2016年", "宇佐美貴史が加入"]
            - ["2017年", "デュッセルドルフへ期限付き"]
            - ["2019年", "ガンバ大阪へ"]
      - 2016年、ガンバ大阪から加わりました。
      - アウクスブルクでのリーグ戦は、**11試合**。
      - text: 2017年からは、デュッセルドルフへ期限付き移籍。
        card: none
        image: assets/backgrounds/stadium_アウクスブルク_in.png
      - そちらでは、リーグ戦**47試合9得点**でした。
    sources:
      - https://en.wikipedia.org/wiki/Takashi_Usami

features:
