  image: assets/images/bd_augsburg_rosenau/scene.jpg
- "フッガー家は、アウクスブルクで有名な一族です。"
- "本拠地のゴール裏には、立ち見席があります。名前は、ウルリヒ・ビーズィンガー・トリビューネ。"
- "クラブの色は、赤と緑と白。紋章も、街の紋章に似ています。"
