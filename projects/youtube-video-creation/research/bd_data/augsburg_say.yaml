episode:
  id: episode
  heading: 1974年、アウクスブルクはなぜ、優勝したのに1部へ上がれなかったのか
  tier: 背景
  telop: 1973年から74年、地域リーグで優勝。1部への昇格ラウンドは、1点差の2位で届かなかった
  narrator: 解説
  card:
    type: table
    title: 1973年から74年のシーズン
    columns: ["", ""]
    rows:
      - ["地域リーグ", "優勝"]
      - ["昇格ラウンド", "5チームで1枠"]
      - ["結果", "1点差の2位"]
  say:
    - text: 1973年。元ドイツ代表が、イタリアから11年ぶりに戻ってきます。
      image: assets/images/bd_augsburg_rosenau/scene.jpg
    - 移籍金は4万4000マルクでした。
    - 昇格したばかりのリーグで、そのまま優勝します。
    - 1試合の観客は平均で**2万2000人**を超えました。
    - ミュンヘンのオリンピアシュタディオンに、8万人が集まった試合もありました。
    - 新聞は、アウクスブルクを「ドイツのナポリ」と書きました。
    - 1部への昇格を決めるのは、5チームの総当たり戦。枠は1つです。
    - ホームで3回引き分け。1点差の2位で、1部には届きませんでした。
  sources:
    - https://en.wikipedia.org/wiki/FC_Augsburg

legends:
- - ハラーは、1957年からBCアウクスブルクでプレーしたフォワード。
  - のちにイタリアのボローニャとユベントスで活躍します。
  - 西ドイツ代表では**33試合13得点**。1966年のワールドカップで準優勝。
  - 古巣に戻ったのが、1973年。途中で1年離れましたが、1979年まで、アウクスブルクのピッチに立ちました。
- - バイアーは、2008年に期限付きで加わり、2010年に完全移籍した選手。
  - 2020年まで、10年間プレー。リーグ戦**324試合8得点**。
  - 2011年の初の1部昇格から、5位になった2015年までをピッチで過ごしました。
- - ク・ジャチョルは、韓国代表の選手。2012年に、期限付きで加わります。
  - その季は、リーグ戦**36試合8得点**。
  - 2015年に戻り、2019年まで。あわせて、リーグ戦**140試合22得点**です。
legend_rows:
- ["ハラー", "1957-1979", "西ドイツ代表33試合"]
- ["バイアー", "2008-2020", "324試合8得点"]
- ["ク・ジャチョル", "2012-2019に2度", "140試合22得点"]
