season:
- text: アウクスブルクはブンデスリーガで9試合を終えて、**2勝3引き分け4敗**です。
- 順位は14位で、勝ち点は9。
- text: ただ、得点は**20**あります。
  card:
    type: stats
    title: 今季のリーグ戦（9試合）
    items:
    - ["20", "", "得点"]
    - ["20", "", "失点"]
    - ["9", "", "勝ち点"]
    focus: 0
- text: 失点も**20**。点を取って、取られる試合が続いています。
  mark: {kind: circle, item: 1}
- 第5節は、ホームでバイエルンと2対2。勝ち点を分けました。
- text: 一方で、エルフェルスベルクに3対4、ライプツィヒに2対5と、点を取られた試合も。
  card: none
  image: assets/backgrounds/stadium_アウクスブルク_in.png
- 得点は1試合**2.22**。昨シーズンの1.32を、大きく上回ります。
- ただ失点も2.22で、昨シーズンの1.79より増えました。
- 勝ち点は1試合1.00。昨シーズンの1.26には届いていません。
- text: 11月22日には、ホームでマインツと戦います。
  image: assets/backgrounds/stadium_アウクスブルク.png
