# 今季の結果と得点者は ESPN の試合データで数えた。順位の言い方で選手・クラブを小さく見せない。
title: ハンブルガーSVは55年間、1部から落ちなかった。なぜ戻るまで7年かかったのか
short_title: ハンブルガーSV、なぜ1部に戻るまで7年
opening: "ヨーロッパ王者、そしてブンデスリーガに55年。スタジアムには、その時間を刻む時計。"
hook: その時計が役目を終えた2018年から、1部に戻るまで、7年かかりました。
