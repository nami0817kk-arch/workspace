data:
- 創立は**1887年**。前身のクラブ、ゲルマニアから数えます。
- 愛称は「ローテ・ホーゼン」。ドイツ語で「赤いパンツ」です。
- ドイツ王者は**6回**。ドイツカップは3回です。
- ヨーロッパの大会では、優勝が**2回**あります。
- 昨季は**13位**。勝ち点38で残りました。
data_focus: [0, 1, 5, 6, 8]

story_sections:
  - id: japan
    heading: 東京での世界一決定戦から酒井高徳まで。ハンブルガーSVと日本は、どうつながってきたのか
    tier: 背景
    telop: 1983年に東京で南米王者と対戦。高原直泰、酒井高徳がプレー
    narrator: 解説
    say:
      - text: 1983年12月11日。ハンブルガーSVは、東京の国立競技場にいました。
        image: assets/backgrounds/stadium_ハンブルガーSV_in.png
        card:
          type: table
          title: ハンブルガーSVと日本
          columns: ["年", "出来事"]
          rows:
            - ["1983年", "東京で南米王者と対戦"]
            - ["2003年", "高原直泰が加入"]
            - ["2016年", "酒井高徳が主将に"]
            - ["2018年", "初めての2部降格"]
      - ヨーロッパ王者として、南米王者のグレミオと、クラブの世界一を争います。
      - 85分に追いつきますが、延長の93分に勝ち越され、1対2で敗れました。
      - text: 2003年には、高原直泰が加わります。
        card: none
        image: assets/images/bd_hamburg_pair_japan/01.jpg
      - ブンデスリーガで**97試合13得点**。2003年には、リーグカップの優勝も味わいました。
      - 2015年には、酒井高徳がシュツットガルトから加入。翌2016年、主将を任されます。
      - 2018年、クラブが初めて2部に落ちたシーズンも、リーグ戦28試合に出ました。
      - 2019年8月に神戸へ移るまで、リーグ戦は**114試合**でした。
    sources:
      - https://en.wikipedia.org/wiki/1983_Intercontinental_Cup
      - https://en.wikipedia.org/wiki/Naohiro_Takahara
      - https://en.wikipedia.org/wiki/Gotoku_Sakai
  - id: golden
    heading: 55年落ちなかったクラブは、なぜ1部に戻るまで7年かかったのか
    tier: 背景
    telop: 2018年に初めて2部へ。4位が3回、入れ替え戦で2回敗れ、2025年に昇格
    narrator: 解説
    main: true
    say:
      - text: 1963年、ブンデスリーガが始まったとき、ハンブルガーSVは16クラブの1つでした。
        image: assets/images/bd_hamburg_title1979/scene.jpg
      - 2001年、スタジアムの北側のスタンドの上に、大きな時計が付きます。
      - 刻んでいたのは、1963年からブンデスリーガにいる時間。秒まで数えていました。
      - text: 2014年と15年は16位。入れ替え戦に回り、どちらも残ります。
        image: assets/backgrounds/stadium_ハンブルガーSV.png
      - 2018年5月12日の最終節。ボルシアMGに勝ちますが、17位で初めての降格。
      - 翌日から時計はクラブが生まれてからの時間を示し、翌年には外されました。
      - text: 2部の1季目と2季目は、どちらも3位に勝ち点1つ届きません。
        card:
          type: table
          title: 2部での7季
          columns: ["季", "順位"]
          rows:
            - ["1季目", "4位"]
            - ["2季目", "4位"]
            - ["3季目", "4位"]
            - ["4季目", "3位、入れ替え戦で敗退"]
            - ["5季目", "3位、入れ替え戦で敗退"]
            - ["6季目", "4位"]
            - ["7季目", "2位で昇格"]
      - 3季目も4位。4季目と5季目は3位に入り、入れ替え戦へ進みます。
      - text: でも2回とも、1部のクラブに敗れました。
        card: none
        image: assets/images/bd_hamburg_team2025/scene.jpg
      - 5季目は最終節の追加時間に、競っていたクラブが2点を取り、自動昇格を逃します。
      - それでも観客は減りません。その季は、ヨーロッパの2部でいちばん多い平均観客でした。
      - 7季目の2025年5月10日、ウルムに6対1。1試合を残して、昇格を決めました。
    sources:
      - https://en.wikipedia.org/wiki/Hamburger_SV
      - https://de.wikipedia.org/wiki/Hamburger_SV
      - https://en.wikipedia.org/wiki/List_of_Hamburger_SV_seasons

features:
- "ハンブルガーSVの特徴の1つめは、エンブレムの色です。"
- "青地に、黒と白のひし形。前身のゲルマニアの色です。"
- "青は、港町の船が掲げる信号旗から。「出航」を知らせる旗です。"
- "2つめは、ユニフォーム。白いシャツに、赤いパンツです。"
- "これはハンブルク市の色。愛称の「赤いパンツ」も、ここから来ています。"
- "3つめは、クラブの形。会員が支えるクラブで、会員は約**15万人**です。"
