season:
- text: ハンブルガーSVは、ここまでの8試合で3勝5敗。勝ち点は9。
  card:
    type: stats
    title: 今季のリーグ戦（8試合）
    items:
    - ["7", "", "得点"]
    - ["3", "", "1点差の勝ち"]
