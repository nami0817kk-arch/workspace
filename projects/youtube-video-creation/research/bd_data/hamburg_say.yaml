manager:
- 今季の監督は、メルリン・ポルツィン。ハンブルク生まれの**35歳**です。
- 2011年から、クラブの育成組織でコーチを始めました。
- アシスタントを経て、2024年11月に暫定で指揮を執り、12月22日に正式な監督に。
- 2025年に1部への昇格を決め、昨季は13位で残留させました。
manager_telop: 監督はポルツィン。2024年12月に正式に就任
