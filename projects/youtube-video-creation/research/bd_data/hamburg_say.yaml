- text: 勝った**3試合**は、どれも1点差でした。
  mark: {kind: circle, item: 1}
- text: ホッフェンハイム戦は後半の追加時間、シュツットガルト戦は88分。決めたのは、どちらもミロ・ムハイムです。
  card: none
