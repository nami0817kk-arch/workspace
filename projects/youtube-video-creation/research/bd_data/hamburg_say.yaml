episode:
  id: episode
  heading: 1983年、ハンブルガーSVはなぜヨーロッパの頂点に立てたのか
  tier: 背景
  telop: 1981年にハッペルが監督に。36試合負けなし、1983年に欧州王者
  narrator: 解説
  card:
    type: table
    title: ハッペルのハンブルガーSV
    columns: ["", ""]
    rows:
      - ["1981年", "ハッペルが監督に"]
      - ["1982年", "ブンデスリーガ優勝"]
      - ["1982〜83年", "36試合負けなし"]
      - ["1983年", "連覇と欧州王者"]
  say:
    - text: 1981年、オーストリア人のエルンスト・ハッペルが、監督に就きます。
      image: assets/images/bd_hamburg_pair_happel/01.jpg
    - 1年目の1982年に、ブンデスリーガ優勝。
    - 1982年1月から翌年1月まで、リーグ戦は**36試合**負けなし。
    - text: この記録は、2013年11月にバイエルンが破るまで、ブンデスリーガで最も長いものでした。
    - 1983年はブレーメンと争い、得失点差で連覇します。
    - text: 5月25日、アテネでのチャンピオンズカップ決勝。相手はユヴェントスです。
      card: none
      image: assets/backgrounds/stadium_ハンブルガーSV_in.png
    - 9分、フェリックス・マガトが決めた1点を守り、ヨーロッパの頂点に立ちました。
    - ハッペルは、クラブの歴史で最も多くのタイトルを獲った監督です。
  sources:
    - https://en.wikipedia.org/wiki/Hamburger_SV
    - https://en.wikipedia.org/wiki/1983_European_Cup_final

legends:
- - ファン・デル・ファールトは、オランダの攻撃的な中盤。2005年に、アヤックスから加わりました。
  - 2006年からは、主将も務めます。
  - "2度の在籍で、リーグ戦**152試合46得点**。"
- - ソン・フンミンは、韓国のフォワード。16歳で、ハンブルガーSVの育成組織に入りました。
  - 2010年10月30日のケルン戦で、ブンデスリーガ初ゴール。18歳で、クラブ最年少の記録でした。
  - "2013年までに、リーグ戦**73試合20得点**。"
- - バルバレスは、ボスニア・ヘルツェゴビナのフォワード。2000年に加わりました。
  - 最初の2000年から01年のシーズンに**22得点**。リーグの得点王に並びます。
  - "2006年まで、リーグ戦**174試合65得点**。"
