  layout: classic

reasons:
- "ヨーロッパの頂点に立ったドイツのクラブは3つ。ハンブルガーSVは、その1つです。"
- "2018年に初めて2部へ。昨季、7年ぶりの1部で13位に入り、残りました。"
- "11月4日の時点で、8試合を終えて3勝。勝った3試合は、どれも1点差です。"
