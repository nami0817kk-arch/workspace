reasons:
- "今季は板倉滉、橋岡大樹、町野修斗、宇野禅斗。日本人が**4人**在籍しています。"
- "町野修斗は今季、リーグ戦で**2得点**。直近のシュツットガルト戦では、勝ち越しのゴールを決めました。"
- "チームは7試合を終えて1勝。その1勝が、シュツットガルト戦でした。"
