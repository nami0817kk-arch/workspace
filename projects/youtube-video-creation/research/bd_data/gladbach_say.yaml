title: ボルシアMGは1部優勝5回。なぜ若い「子馬たち」は70年代を制したのか
short_title: ボルシアMG、なぜ子馬たちは70年代を制したのか
opening: "1970年代に、1部優勝5回。いまは日本人が4人。"
hook: 若い選手たちの攻めるサッカーに、ドイツ中のファンが目を向けました。
