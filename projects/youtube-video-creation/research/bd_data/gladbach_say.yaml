episode:
  id: episode
  heading: 1978年、ドルトムントに12対0。それでも、なぜ優勝できなかったのか
  tier: 背景
  telop: 1978年4月29日、最終日にドルトムントに12対0。優勝はケルン
  narrator: 解説
  card:
    type: table
    title: 1977年から78年のシーズン 最終日
    columns: ["", ""]
    rows:
      - ["日付", "1978年4月29日"]
      - ["ボルシアMG", "ドルトムントに12対0"]
      - ["ケルン", "ザンクトパウリに5対0"]
      - ["優勝", "ケルン（得失点差）"]
  say:
    - text: 1978年4月29日。シーズンの最終日です。
      image: assets/images/bd_gladbach_fans/scene.jpg
    - ボルシアMGは、ドルトムントに12対0で勝ちました。
    - いまもブンデスリーガの歴史で、いちばん大きな点差の勝利です。
    - text: ところが、首位のケルンもザンクトパウリに5対0で勝ちます。
      card: none
      image: assets/backgrounds/stadium_ボルシアMG.png
    - 勝ち点は並び、優勝はケルン。ボルシアMGは、得失点差で届きませんでした。
  sources:
    - https://en.wikipedia.org/wiki/Borussia_M%C3%B6nchengladbach

legends:
- - フォクツは1965年に加わった守備の選手です。
  - "1979年まで在籍し、リーグ戦**419試合**。いまもクラブの最多出場です。"
  - 引退後はドイツ代表の監督になり、1996年のヨーロッパ選手権で優勝しました。
- - ハインケスはフォワード。2度にわたって、ボルシアMGでプレーしました。
  - "1部では**195得点**。ボルシアMGの選手で、いちばん多い数です。"
  - 監督としても、2013年にバイエルンで3冠を果たしました。
- - ロイスは2009年に加わった攻撃の選手です。
  - "2012年まで、リーグ戦**97試合36得点**。"
  - 2012年にドルトムントへ。背番号11は、ボルシアMG時代と同じでした。
legend_rows:
- ["ベルティ・フォクツ", "1965-1979", "リーグ戦419試合"]
- ["ユップ・ハインケス", "1963-67、70-78", "1部195得点"]
- ["マルコ・ロイス", "2009-2012", "リーグ戦97試合36得点"]
