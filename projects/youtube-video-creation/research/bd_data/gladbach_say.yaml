data:
- 創立は**1900年**。最初の名前は、ボルシア1900でした。
- 愛称は「フォーレン」。ドイツ語で「子馬たち」です。
- 1部の優勝は**5回**。ドイツカップは3回です。
- ヨーロッパの大会でも、優勝が2回あります。
- 昨季のリーグ戦は**12位**。勝ち点は38でした。
data_focus: [0, 1, 5, 6, 8]

story_sections:
  - id: japan
    heading: 板倉、橋岡、町野、宇野。日本人4人は、いま何を担っているのか
    tier: 背景
    telop: 板倉滉は2022年に加入し、いったん出て戻った。町野修斗は今季2得点
    narrator: 解説
    say:
      - text: 2022年、板倉滉がボルシアMGに加わりました。
        card:
          type: table
          title: 日本人4人の今季（リーグ戦）
          columns: ["名前", "位置", "今季"]
          rows:
            - ["板倉滉", "DF", "4試合に先発"]
            - ["橋岡大樹", "DF", "5試合に出場"]
            - ["町野修斗", "FW", "5試合2得点"]
            - ["宇野禅斗", "MF", "3試合1アシスト"]
      - 最初の3年で、リーグ戦**75試合**に出ています。
      - 2025年にアヤックスへ。
      - 日本人で初めて、アヤックスのトップチームでプレーしました。
      - text: そして2026年8月、ボルシアMGに戻ってきました。
        card: none
        image: assets/images/bd_gladbach_pair_jp/01.jpg
      - 今季は開幕から4試合、すべて先発です。
      - text: 前線には、2025年に加わった町野修斗がいます。
        image: assets/images/bd_gladbach_pair_jp/01.jpg
      - 今季は途中出場が続くなか、マインツ戦でペナルティーキックを決めました。
      - シュツットガルト戦では、左足で勝ち越し点です。
      - 中盤では、宇野禅斗が直近2試合に先発。
      - スラヴィア・プラハから来た橋岡大樹も、5試合に出ています。
    sources:
      - https://en.wikipedia.org/wiki/K%C5%8D_Itakura
      - https://en.wikipedia.org/wiki/Sh%C5%ABto_Machino
      - https://en.wikipedia.org/wiki/Zento_Uno
      - https://en.wikipedia.org/wiki/Daiki_Hashioka
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884761
      - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/summary?event=401884786
  - id: golden
    heading: 1部優勝5回。なぜ70年代のボルシアMGは強かったのか
    tier: 背景
    telop: 若い選手で攻める。70年代の10年で、1部優勝5回
    narrator: 解説
    main: true
    say:
      - text: 1965年、ボルシアMGはブンデスリーガへ昇格。
        image: assets/backgrounds/stadium_ボルシアMG.png
      - 同じ年に昇格したのが、バイエルンです。
      - text: 率いたのは、ヘネス・ヴァイスヴァイラー監督。
        image: assets/images/bd_gladbach_pair_70s/01.jpg
      - 若い選手たちに、前へ攻めるサッカーをさせました。
      - 愛称の「子馬たち」は、この若いチームの呼び名です。
      - text: 1970年、1部で初めての優勝。翌年も勝って、2連覇です。
        card:
          type: table
          title: ボルシアMGの1部優勝
          columns: ["シーズン", "結果"]
          rows:
            - ["1969-70", "優勝"]
            - ["1970-71", "優勝（2連覇）"]
            - ["1974-75", "優勝"]
            - ["1975-76", "優勝"]
            - ["1976-77", "優勝（3連覇）"]
      - 1975年からは3連覇。70年代の10年で、優勝は**5回**になりました。
      - 同じ時代の、どのクラブよりも多い数です。
      - text: 1975年、主将のフォクツが、ヨーロッパの大会のトロフィーを掲げます。
        card: none
        image: assets/images/bd_gladbach_pair_70s/01.jpg
      - 1977年には、ヨーロッパチャンピオンズカップの決勝まで進みました。
      - 1979年には、1975年と同じ大会で2度目の優勝。
    sources:
      - https://en.wikipedia.org/wiki/Borussia_M%C3%B6nchengladbach

features:
- "ボルシアMGのプレーの色は、若い選手で攻めること。"
- "70年代の監督ヴァイスヴァイラーが、その形をつくりました。"
- "運営の型は、2004年の新しいスタジアム。"
- "収容は、それまでのボーケルベルクの**3万4500人**から、**5万4057人**に増えました。"
- "クラブの気質は、リヴァプールとの友情。"
- "ヨーロッパの大会で何度も戦ったことから、いまもファンが行き来しています。"
