- - https://en.wikipedia.org/wiki/Marco_Reus

manager:
- ボルシアMGの今季の監督は、アレクサンダー・ブレッシン。**53歳**のドイツ人です。
- 前のシーズンまでは、ザンクトパウリを率いていました。
- 2026年9月22日に、ボルシアMGの監督になりました。
