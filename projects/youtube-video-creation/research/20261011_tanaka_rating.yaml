# 取材メモ（10/11 題材 ② tanaka_rating、型は news、日本人枠）。**ショートだけ作る**（本編は作らない）。
# 効く一点：**田中碧に付いた7点は、リーズの先発11人で最も高い数字**（ジャスティン・ムハレモビッチ・
#   グズムンドソンと並んで最高タイ）。そこを①（main）に置いた。
# **いちばん大事な注意（ユーザー指示）**：**今日のシリーズでデクラン・ライス（アーセナル）を
#   10:00 に公開している。画面と語りはリーズと田中碧だけで組む。アーセナルの話に寄せない。**
#   そのため、
#   ・**アーセナルの得点者（62分・70分）の名前を、語りにも画面にも出していない**（「2点を返された」で通す）。
#   ・採点の表は**リーズの先発だけ**を並べた。
#   ・ガーディアンの実況が書いた「田中がライスからボールを奪った」場面（43分）は**使っていない**。
#   ・VAVEL の原文 "broke up Arsenal's attacks" は「**相手の攻撃を断ち切り**」と訳した。
#     固有名を外したのは上の指示のため。意味は変えていない（アーセナル＝この試合の相手）。
# **引用元の記事に当たった**（フットボールチャンネルの訳はそのまま使っていない。訳は自分で起こした）。
#   ・BBC Sport「Arsenal 2-1 Leeds: How the Leeds players rated」（10 October 2026）
#     https://www.bbc.co.uk/sport/football/articles/cmpqgl2lywzno
#     原文 "Ao Tanaka: Very good on the ball and worked hard alongside Ethan Ampadu in the middle of the pitch. 7"
#     同じ記事のリーズ先発の点: Trafford 6 / Bogle 6 / **Justin 7** / **Muharemovic 7** / Elvedi 6 /
#     **Gudmundsson 7** / **Tanaka 7** / Ampadu 6 / Stach 6 / Okafor 6 / Calvert-Lewin 6
#   ・VAVEL「Arsenal 2-1 Leeds: Post-Match Leeds Player Ratings」（Mark Davey-Spence、10 Oct 2026）
#     https://www.vavel.com/en/football/2026/10/10/premier-league/1274670-arsenal-2-1-leeds-post-match-leeds-player-ratings.html
#     原文 "Ao Tanaka - 7.0 / Was very tenacious in his defensive work, similarly to Ampadu, broke up Arsenal's
#     attacks and stopped their progression in midfield, gave away an unnecessary foul and also picked up an early yellow."
#     **注意：VAVEL では田中が最高点ではない**（Justin 7.5・Stach 7.5 が上）。だから台本では
#     「最も高い」と言っているのは**10点満点の採点のほう（BBC Sport）だけ**で、VAVEL は「同じ7.0」とだけ言う。
#   ・The Guardian の実況（76分の記述）
#     https://www.theguardian.com/football/live/2026/oct/10/arsenal-v-leeds-premier-league-live
#     原文 "76 min: Leeds double-substitution from a couple of minutes ago: Harry Wilson and Brenden Aaronson
#     on for Tanaka and Okafor, who have both been terrific."
#     フットボールチャンネルは「ともに素晴らしいプレーだった」と訳していたが、**これは試合記事ではなく実況の一行**。
#     台本では媒体名を出さず「交代を伝えた現地の実況」とした。
# **スコア・交代・警告はプレミアリーグ公式まで辿った**（/v2/matches/2645245 と commentary、lineups）。
#     55' James Justin (Leeds) assisted by Gabriel Gudmundsson with a cross
#     62' / 70' アーセナルが2点（**名前は使わない**）
#     71' Harry Wilson replaces Ao Tanaka
#     36' Ao Tanaka is shown the yellow card for a bad foul
#   会場 Emirates Stadium / 入場者 60,315 / 主審 Paul Tierney（リーズ公式の試合記録）。
# **数字の食い違い**：田中の警告は**プレミアリーグ公式が36分**、ガーディアンの実況は37分。**公式を採った**。
# **53分のシュートはガーディアンの実況が元**（"David Raya is forced to tip an Ao Tanaka shot over the bar"）。
#   きっかけに相手選手の名前が出てくるが、**上の指示のため語りでは触れていない**。
# **4試合連続先発**：VAVEL が "unchanged lineup for their fourth league game in a row"、ゲキサカの見出しも
#   「プレミア4試合連続先発」。リーズ公式も「Unchanged from the meeting with Crystal Palace」と書いている。
# **リーズの開幕5試合無敗は1部では2001年以来**（BBC Sport の試合記事）。失点3はリーグ最少タイ（同）。
# 写真はリーズ・ユナイテッド公式の試合写真1枚（3000x1687、Ao_Tanaka_vs_Arsenal__A__action_shot_Oct_26.jpg）。
#   **代理店の配信ではない**（クラブ自身の掲載。画像の中にも代理店の表記は無い。拡大して確認した）。
#   ゲキサカ・サッカーキング・フットボールチャンネルの写真は**すべて Getty 配信**なので使っていない。
#   facecrop で 01_w（16:9）と 01_v（9:16・949x1687）を切り、どちらも目で見た。
# サムネ：構図 number（**ユーザーと相談して決める**。ここに書いたのは点検を通すための1案）。
# ネットの反応は集めていない。反応の節は無い。
# 数字の重なり対策：『7点』『7.0』は①だけ、『36分』『53分』は②だけ、『5試合』『2001年』は③だけ。
