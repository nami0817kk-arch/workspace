  takeaway: 田中碧は4試合続けてリーズの先発に名を連ね、71分までプレーした。10点満点で付いた点は7。同じ採点でリーズの先発を見ると、ジャスティン、ムハレモビッチ、グズムンドソンと並ぶ最も高い数字で、中盤を組んだアンパドゥは6だった。添えられていたのは「ボールを持ったときのプレーが非常によく、中盤でイーサン・アンパドゥとともによく働いた」の一文。別の採点も同じ7.0で、こちらは「守備での粘りが非常に強く、相手の攻撃を断ち切り、中盤で前進を止めた」と書き、同時に不必要なファウルで36分に警告を受けた点も挙げている。試合は55分にジャスティンが先制しながら、62分と70分に2点を返されて1対2。リーズは開幕からの5試合無敗が止まり、今季のリーグ戦で初めて負けた。1部での開幕5試合無敗は2001年以来だった
