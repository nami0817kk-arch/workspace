sections:
  - id: what
    heading: 日本人ふたりが揃って出た
    tier: 報道
    telop: 冨安フル出場、鎌田が3点目
    narrator: キャスター
    say:
      - イングランドのカラバオカップ3回戦、クリスタル・パレスはミドルズブラと戦いました。
      - ホームのパレスが3対0で勝ち、4回戦に進んでいます。
      - この試合、日本代表がふたり出ています。
      - 冨安健洋は先発フル出場。加入してからはつのフル出場です。
      - かまだだいちは59分から途中出場し、72分に3点目を決めました。
      - かまだにとって、今季はつのゴールです。
    official: false
    sources:
