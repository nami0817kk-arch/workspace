  - id: goal
    heading: ふたりでつくった3点目
    tier: 報道
    telop: 冨安の縦パスから鎌田のループ
    narrator: 解説
    say:
      - 72分の場面です。攻撃の起点をつくったのは冨安の縦パスでした。
      - そこから運んで、最後はかまだが鮮やかなループシュート。
      - 日本人コンビで、試合を決める3点目が生まれました。
      - かまだは前節のフラム戦で今季はつのアシストを記録しています。
      - 公式戦2試合続けて、得点に関わったことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006956/
      - https://www.soccer-king.jp/news/world/eng/20260909/2202635.html

  - id: match
    heading: 試合はどう動いたか
    tier: 報道
    telop: 前半37分に先制
    narrator: 解説
    say:
      - プレミアリーグ第3節のフラム戦から中2日でのカップ戦でした。
      - サージュ監督はメンバーを入れ替え、冨安が先発。かまだはベンチスタートです。
      - 37分、ミンゲサのパスからストランド・ラーセンが先制。前半は1対0で折り返します。
      - 53分、今度はチルウェルのお膳立てから、ストランド・ラーセンがこの日2点目。
      - 2点差になった59分に、かまだがピッチへ送り出されました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1006956/
      - https://web.ultra-soccer.jp/news/all/35322/

