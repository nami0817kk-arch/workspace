  telop: 1892年創立
  narrator: 解説
  say:
  - short_only: true
    text: 遠藤航の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_liverpool_data.png
    text: 創立は**1892年**。本拠地はアンフィールド、**6万1276人**が入ります。
  - image: assets/stats/pl_liverpool_data.png
    text: オーナーはアメリカのFSG。2010年からクラブを持っています。
  - image: assets/stats/pl_liverpool_data.png
    text: 1部リーグの優勝は**20回**。FAカップ8回、リーグカップ10回、チャンピオンズリーグは6回獲っています。
  - image: assets/stats/pl_liverpool_data.png
    text: 直近のタイトルは、2024年から25年のプレミアリーグ優勝です。
  - image: assets/stats/pl_liverpool_data.png
    text: 2017年から18年には、モハメド・サラーが1シーズンで**44得点**を挙げました。
  sources:
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  bg: assets/backgrounds/stadium_リヴァプール.png
  official: false
- id: birth
  heading: 空になったスタジアム
  tier: 背景
  telop: 1892年、エヴァートンが出ていったあとに作られた
  narrator: 解説
  card:
    type: table
    title: クラブの成り立ち
    columns:
    - ''
    - ''
    rows:
    - - 創設
      - 1892年
    - - きっかけ
      - アンフィールドをめぐる対立
    - - 愛称
      - The Reds（レッズ）
    - - 本拠地
      - アンフィールド／61,276人
  say:
  - このクラブができたのは1892年。きっかけは**もめごと**でした。
  - アンフィールドという土地を持っていたのがジョン・ホールディングで、そこを使っていたのがエヴァートンです。
  - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
  - '**スタジアムだけが残りました。**'
  - そのアンフィールドで試合前に歌われるのが、「ユール・ネヴァー・ウォーク・アローン」です。
  - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
  - 愛称は「レッズ」。ビル・シャンクリーが監督だった時代に定着しました。
  - アンフィールドの収容は**6万1276人**。2021年から24年にかけても広げています。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  bg: assets/backgrounds/stadium_リヴァプール.png
