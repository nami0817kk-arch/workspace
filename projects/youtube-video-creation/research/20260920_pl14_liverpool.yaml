  say:
  - 宿敵は、同じ街の**エヴァートン**です。
  - 呼び名は**マージーサイド・ダービー**。
  - 公式戦で初めて当たったのは1894年10月13日でした。この日は**エヴァートンが3対0**。
  - 2026年4月の時点で、通算**248試合**。リヴァプールの102勝、78分け、エヴァートンの68勝です。
  - 最も点差がついたのは1935年から36年、アンフィールドでの**6対0**でした。
  - プレミアリーグが始まってから、**退場者がいちばん多いカード**でもあります。合計23枚です。
  - そして相手は、**今季もプレミアリーグにいます。**年に2度、この試合が組まれます。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Merseyside_derby
