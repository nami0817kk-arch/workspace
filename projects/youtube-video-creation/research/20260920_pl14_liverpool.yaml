  - image: assets/stats/pl_liverpool_gk_f.png
    text: ゴールキーパーは6人。アリソン・ベッカーはブラジル代表で**83試合**。ギオルギ・ママルダシュヴィリはジョージア代表で**38試合**。
    no_telop: true
  - image: assets/stats/pl_liverpool_df_f.png
