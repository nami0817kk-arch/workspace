- id: rival
  heading: 宿敵
  tier: 背景
  telop: 同じ街のエヴァートンとの、マージーサイド・ダービー
  narrator: 解説
  card:
    type: table
    title: マージーサイド・ダービー
    columns:
    - ''
    - ''
    rows:
    - - 初対戦
      - 1894年10月13日／0-3
    - - 通算
      - 248試合（2026年4月時点）
    - - 勝敗
      - リヴァプール102勝・78分・エヴァートン68勝
    - - 最大差
