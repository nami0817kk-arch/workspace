- id: data
  heading: リヴァプール 基礎DATA
  main: true
  tier: 背景
  telop: 1892年創立
  narrator: 解説
  say:
  - short_only: true
    text: 遠藤航の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_liverpool_data0.png
    text: 創立は**1892年**です。
    no_telop: true
  - image: assets/stats/pl_liverpool_data1.png
    text: 愛称は「レッズ」。1959年から74年まで率いたビル・シャンクリー監督の時代に定着します。
    no_telop: true
  - image: assets/stats/pl_liverpool_map.png
    text: ホームタウンはリヴァプール。イングランド・マージーサイドです。
    no_telop: true
  - image: assets/backgrounds/stadium_リヴァプール_in.png
    text: 本拠地はアンフィールド。**約6万1000人**が入ります。2024年に広げたばかりです。
  - image: assets/backgrounds/stadium_リヴァプール_in.png
    text: 試合前の「ユール・ネヴァー・ウォーク・アローン」も、1960年代の初めから歌われています。
  - image: assets/stats/pl_liverpool_data4.png
    text: 2010年から、大リーグのレッドソックスも持つフェンウェイ・スポーツ・グループがオーナーです。
    no_telop: true
  - image: assets/stats/pl_liverpool_cups.png
    text: 1部リーグの優勝は**20回**。マンチェスター・ユナイテッドと並んで最多です。
    no_telop: true
  - image: assets/stats/pl_liverpool_cups.png
    text: FAカップは8回、リーグカップは10回です。
    no_telop: true
  - image: assets/stats/pl_liverpool_cups.png
    text: チャンピオンズリーグ**6回**、ヨーロッパリーグ3回、スーパーカップ4回、クラブワールドカップ1回。
    no_telop: true
  - image: assets/stats/pl_liverpool_data7.png
    text: 直近のタイトルは、2024年から25年のプレミアリーグ優勝です。
    no_telop: true
  - image: assets/stats/pl_liverpool_last.png
    text: 昨季は**5位**。勝ち点は60でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  bg: assets/backgrounds/stadium_リヴァプール.png
  official: false
- id: birth
  heading: 空になったスタジアム
  tier: 背景
  telop: 1892年、エヴァートンが出ていったあとに作られた
  narrator: 解説
  card:
    type: table
    title: クラブの成り立ち
    columns:
    - ''
    - ''
    rows:
    - - 創設
      - 1892年
    - - きっかけ
      - アンフィールドをめぐる対立
    - - 愛称
      - The Reds（レッズ）
    - - 本拠地
      - アンフィールド／61,276人
  say:
  - 生まれたきっかけは、**もめごと**でした。
  - アンフィールドという土地を持っていたのがジョン・ホールディングで、そこを使っていたのがエヴァートンです。
  - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
  - '**スタジアムだけが残りました。**'
  - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  - https://en.wikipedia.org/wiki/Bill_Shankly
  bg: assets/backgrounds/stadium_リヴァプール.png
- id: episode
  heading: 触ってはいけない看板
  tier: 背景
  telop: 「THIS IS ANFIELD」触るのは優勝のあと
  narrator: 解説
  card:
    type: table
    title: 触ってはいけない看板
    columns:
    - ''
    - ''
    rows:
    - - THIS IS ANFIELD
      - シャンクリーが付けた看板
    - - クロップ監督
      - 獲るまで触るなと禁じる
    - - 2019年
      - チャンピオンズリーグ決勝に勝って解禁
  say:
  - アンフィールドの選手用トンネルに、「ジス・イズ・アンフィールド」の看板があります。
  - シャンクリー監督が付けたもので、相手を怖がらせ、味方が触れば運が付く、というものでした。
  - 2015年に来たクロップ監督は、「タイトルを獲るまで触るな」と禁じました。
  - '**2019年**のチャンピオンズリーグ決勝に勝って、ようやく触ることが許されました。'
  sources:
  - https://en.wikipedia.org/wiki/Anfield
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  bg: assets/backgrounds/stadium_リヴァプール.png
  official: false
