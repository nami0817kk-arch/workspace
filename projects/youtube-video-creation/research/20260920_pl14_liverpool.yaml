    no_telop: true
  - image: assets/stats/pl_liverpool_mf_f.png
    text: ミッドフィールダーは8人。日本の遠藤航がいます。ドミニク・ソボスライはハンガリー代表で**65試合**。
    no_telop: true
  - image: assets/stats/pl_liverpool_fw_f.png
    text: フォワードは9人。コーディ・ガクポはオランダ代表で**54試合**。アレクサンデル・イサクはスウェーデン代表で**62試合**。
    no_telop: true
