      - アンフィールド／61,276人
  say:
  - text: 生まれたきっかけは、**もめごと**でした。
    image: assets/images/pl_liverpool_story/01.jpg
  - アンフィールドという土地を持っていたのは、ジョン・ホールディングでした。
  - そこを使っていたのが、エヴァートンです。
  - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
  - '**スタジアムだけが残りました。**'
  - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
  - https://en.wikipedia.org/wiki/Bill_Shankly
