      - 遠藤航が中盤にいる
    - - 理由2
      - 新監督イラオラの1年目
    - - 理由3
      - サラー退団後、最初の1年
  say:
  - 日本代表の中盤、遠藤航が、リーグ戦**57試合**を戦ってきたクラブです。
  - このクラブを作り替えた名将、ビル・シャンクリーの言葉があります。
  - voice: ビル・シャンクリー
    text: 「私の考えは、リヴァプールを無敵の砦に築き上げることだった」
  - 監督が代わりました。ボーンマスを**6位**まで引き上げたイラオラが、1年目の指揮を執っています。
  - 2シーズン前に**20回目**の優勝、昨季は5位。サラーが去って初めてのシーズンです。
