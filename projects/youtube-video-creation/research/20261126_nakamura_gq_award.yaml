    say:
      - text: 中村敬斗が、雑誌ジーキュー・ジャパンの「メン・オブ・ザ・イヤー2026」に選ばれました。
      - text: その年に大きく活躍した人をたたえる賞で、今年の受賞は8組。
        image: assets/images/20261126_nakamura_gq_award/03_w.jpg
      - text: 俳優や作家、音楽グループが並ぶ中、サッカー界からは中村ただ1人。
        emph: true
      - text: 贈られたのは「ブレイクスルー・アスリート賞」。この1年で一気に飛躍した選手、という意味です。
        image: assets/images/20261126_nakamura_gq_award/01_w.jpg
      - text: 理由として挙げられたのは、6月のワールドカップ。
        image: assets/images/20261126_nakamura_gq_award/02_w.jpg
      - text: 中村は日本の4試合すべてに先発し、1ゴール1アシスト。
        card: {type: stats, title: 中村敬斗のW杯2026, items: [[4, 試合, すべて先発], [1, ゴール, オランダ戦], [1, アシスト, チュニジア戦]], focus: 1}
      - text: オランダ戦では57分、エリアの外から右足で同点ゴールを決めました。
        image: assets/images/20261126_nakamura_gq_award/03_w.jpg
      - text: このゴールは海外でも高く評価され、選ばれた理由の一つになりました。
        card: none
        image: assets/images/20261126_nakamura_gq_award/01_w.jpg
      - text: そしてW杯のあと、フランスのリヨンへ完全移籍しました。
        image: assets/images/20261126_nakamura_gq_award/02_w.jpg
