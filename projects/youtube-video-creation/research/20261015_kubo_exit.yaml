# 日本人選手 の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。requests（ブラウザUA）で原文を読んだ。
#   題材の元記事（football-tribe.com/japan 2026/10/15 360372）は「結婚前から異変」「退団の可能性」だが、中身は
#   (1) 久保のインスタからソシエダ関連の投稿が消えているという話（出どころは5ちゃんねるのスレ。football-tribe自身が「退団の兆候かは明らかでない」と書く）
#   (2) ムンド・デポルティーボ経由のブレトス談話 (3) 「今冬移籍も取りざたされている」（出典なし）の3つ。
#   → 「結婚前から異変」「退団」を題の柱にはできない（匿名の書き込みが出どころ）。そこで、football-tribe が孫引きしていた
#     ブレトス談話の一次側に当たり直し、「クラブ幹部が公の会見で何を言ったか」と「15日の欧州戦の見込み」で組んだ。
# 一次側（14日のブレトスの会見。ベルギー遠征を前にしたもの）:
#   Mundo Deportivo 2026-10-14 11:59Z（Unai Valverde）全文の談話を訳した。Marca 2026-10-14（Óscar Badallo）は要約引用、Noticias de Gipuzkoa 2026-10-14 は談話を一部引く。三者一致。
#   談話の原文は「Es un jugador fundamental…」。football-tribe の「必要不可欠」「必ず、どこかのタイミングで」はムンド・デポルティーボの原文と言い方が違う（要約）ので、原文から訳し直した。
#   ブレトスの肩書きは各紙「director de fútbol」（サッカー部門のディレクター）。東スポは「クラブ幹部」。台本では「サッカー部門のディレクター」。
# 出場の事実: Mundo Deportivo 2026-10-12「これで久保は2試合続けて出番なし」。11日(日)アノエタのデポルティボ戦、久保は出場せず（Marca 10/15 も「久保は出なかった」）。
#   MDは「マタラッツォ監督が今の久保の状態をあまり信頼していない」と書く（MDの見立て）。Marca は久保とオヤルサバルは「今季まだ無得点」と書く。
# 15日の試合: ヨーロッパリーグ第2節 ユニオン・サン・ジロワーズ対レアル・ソシエダ。キックオフ 現地18:45（MD の放送案内）＝日本時間16日 1:45。ソシエダは第1節ボーンマスに1-2（AS）。
#   Marca の予想先発では久保は先発に入る見込み（「入る見込み」までで確定ではない）。
# 契約年数（2029年6月まで）と移籍の話は football-tribe だけで、クラブ公式・リーグでは確かめられなかった → 台本に入れない。
# 資料間のずれ: football-tribe は「11日のラ・リーガ第8節でも出ていない」。MD・Marca は「11日(日)のデポルティボ戦」。→ 台本は「11日」まで。
# 反応（ネット民）: footballnet「久保建英は代表明けも出番なし…」スレ（10/12、5ちゃんねる）の3件（>>64・>>34・>>39）。ブレトスの会見より前の書き込み。
#   全文のまま。匿名なので未確認。賛否が分かれるものを選んだ（批判だけにしない）。
