title: 11月27日のショート題材
lead: 海外フィード約465件と日本語の海外組ニュースから10件をClaudeが選びました（日本人6件・海外4件）。取材で前提が崩れたら次点に差し替えます。
note: 金曜（27日）の朝7時に集めました。昨夜はヨーロッパリーグとカンファレンスリーグ。試合の分・スコアはESPNの試合データで確かめ済み。次点：毎熊晟矢のAZがスパルタに0-2から4-2の逆転（11）、ハーランドのシティ退団の検討報道（12、確度は未確認止まり）。外した：上田綺世の市場価値（11/26 に得点の回を作成済み）、菅原由勢の退団報道（11/25 作成済み）、旗手怜央のバーンリーのホーム未勝利記録（2部の話）、スターリングの有罪判決（法的な話）、森保ジャパンのワースト試合5選（まとめ記事）、町田・鹿島などACL（Jリーグ）、U-17W杯・U-21欧州選手権の抽選（年代別）、女子・MLS（対象外）。
