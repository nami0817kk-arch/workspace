- id: secret
  heading: カシージャスに、知られざる話はあるのか
  tier: 報道
  telop: ベンチの16歳と、聖人のあだ名
  card: &sc
    type: table
    title: 知られざる、3つの話
    columns: [いつ, 何があったか]
    rows: &scr
    - [7〜8歳ごろ, 父のくじの投函を忘れる]
    - [16歳, 初めてトップの遠征に呼ばれる]
    - [21歳, けがで空いた先発の座へ]
    source: Wikipedia
    highlight_row: 0
  say:
  - {text: カシージャスには、運命が動いた話が3つあります。, card: none, image: assets/images/20261031_casillas_legend/07_w.jpg}
  - text: 1つ目。7、8歳のころ、父のサッカーくじの投函を、うっかり忘れました。
    card: *sc
    image: assets/images/20261031_casillas_legend/07_w.jpg
  - {text: 父は、15試合の結果を全部当てていたといいます。, card: none}
  - {text: 逃した賞金は、およそ120万ユーロと言われます。, card: none}
  - text: 2つ目。1997年11月、16歳。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261031_casillas_legend/05_w.jpg
    emph: true
  - {text: チャンピオンズリーグの試合で、初めてトップチームに呼ばれます。, card: none}
  - {text: 出番はなく、ベンチで試合を終えました。, card: none, image: assets/images/20261031_casillas_legend/05_w.jpg}
  - text: 3つ目。2002年のW杯。カシージャスは、控えとして大会に入りました。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      source: Wikipedia
      highlight_row: 2
    image: assets/images/20261031_casillas_legend/02_w.jpg
  - {text: ところが、先発のゴールキーパー、カニサレスが、思いがけないけがで大会を去ります。, card: none}
  - {text: 先発に座った21歳は、16強のアイルランド戦へ。, card: none, image: assets/images/20261031_casillas_legend/03_w.jpg}
  - {text: 規定の時間にPKを1本、PK戦でも2本を止めて、勝ち上がります。, card: none}
  - {text: ここから、聖人と呼ばれはじめました。, card: none}
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/Iker_Casillas']
