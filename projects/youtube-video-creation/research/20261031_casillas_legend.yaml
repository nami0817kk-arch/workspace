# イケル・カシージャス（元スペイン代表GK）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-31。型は 10/29 のトッティと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→知られざる話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Iker Casillas の成績表・本文・Honours・Records、2010 FIFA World Cup final、2002 Intercontinental Cup）と UEFA の決勝レポート（"Iniesta earns Spain World Cup crown"、2010-07-11）と OneFootball（2020-08-04「Iker Casillas announces retirement from professional football」）と、自分で足した・割った値だけ。
# **引退後の私生活・法的な問題・病気は入れない**（2019年5月の心臓の件・離婚・家族・会長選の話は使わない。ポルトの章は優勝と記録だけ）。女子サッカーは入れない。
#
# **重なりの確認（10/31）**：scripts/・research/covered.yaml・research/posted.json を「カシージャス／Casillas」で grep。主役の回は無し（10/10 の代表最多出場の回にスペインの2位として名前が出るだけ）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ）とも重ならない。
# **引退の確認（一次情報に近いもの）**：OneFootball 2020-08-04 本文「Iker Casillas has officially confirmed his retirement from professional football ... The 39-year-old also won 167 caps for Spain」と本人のSNS投稿の引用（requests で本文取得）。Wikipedia「On 4 August 2020, Casillas officially announced his retirement」。→ **選手としては現役ではない（45歳）**。いまの立場：解説者（Wikipedia「currently works as a football commentator」）、2020-12 にレアル・マドリード財団のCEO補佐に就任（Wikipedia）。
# **2010年W杯決勝の確認**：UEFA 決勝レポートの原文「Arjen Robben had squandered the best chance of normal time ... one on one with Iker Casillas」「could not bypass Casillas's outstretched right leg」「With extra time approaching, Casillas was once again quick to smother at the feet of Robben」「Heitinga dismissed ... seven minutes later Iniesta」。Wikipedia（決勝の記事）で 62分の1対1、前半終了間際のロッベンの近いほうのシュート、イニエスタの得点は延長の残り4分前＝116分。→ 山場にする（W杯優勝は決勝の記事で確認）。
# **日本との接点**：2002年12月3日、トヨタカップ（インターコンチネンタルカップ）が横浜国際総合競技場で行われた最初の年。レアル・マドリード2対0オリンピア（ロナウド14分・グティ84分、観衆66,070）。カシージャスは背番号1で先発（Wikipedia の試合表）。21歳。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：レアル・マドリード 725試合（リーグ510・国内カップ40・欧州152・その他23、いずれも0得点）、ポルト 156試合、スペイン代表 167試合。クラブとスペイン代表の合計 1,048試合（自分で足した値。レアルの下部チームの試合は含まない）。
# - 2010年W杯：7試合で2失点、決勝トーナメント4試合は全部無失点、無失点5試合は大会タイ記録、ゴールデングローブ（Wikipedia）。
# - 2012年欧州選手権：6試合で1失点（イタリアとの初戦、ディ・ナターレ）、509分無失点は大会記録でゾフの494分を更新（Wikipedia）。509＝29分（初戦の失点の後）＋90＋90＋90＋120＋90（自分で足して合った）。
# - 見立て（自分で割った値）：2010年 2÷7＝1試合0.29点。2012年 1÷6＝0.17点。2つ合わせて 3÷13＝0.23点。
# - 最年少：1999-09 の18歳177日でCL出場（当時のGKの最年少）、2000-05 の19歳4日でCL決勝に出場して優勝（GKの最年少）。2002年決勝は先発セサルが終盤にけがをして途中から出場、2対1を守った。
# - 2008年：キャプテンに。ユーロ準々決勝（6/22）イタリア戦のPK戦でディ・ナターレとデ・ロッシのPKを止めて4対2、決勝（6/29）ドイツに1対0、GKのキャプテンとして初めて欧州選手権の優勝杯を掲げる。
# - 2014年：キャプテンとして5/24のCL決勝（リスボン、アトレティコに4対1）で3回目のCL優勝。2015-07-11 ポルトへ移籍（2年契約）。2018年にポルトでリーグ優勝。
# - IFFHS 世界最優秀GK 2008〜2012の5年連続。UEFA年間ベストチームに2007〜2012の6年連続。
# - 本人の言葉：W杯優勝の杯を掲げる前に頭に浮かんだ歴代キャプテン（Wikipedia が引く本人の談話）「From when I was small, I saw Matthäus lift it. I saw Dunga lift it, I saw Deschamps lift it, I saw Cafu lift it, Cannavaro... so to watch me lift it, I could watch it tomorrow, I could watch it within 10 years and it will always make me emotional because it's incomparable.」／引退の日の本人のSNS投稿（OneFootball が全文を引用）「Lo importante es el camino que recorres y la gente que te acompaña, no el destino al que te lleva ... ha sido el camino y el destino soñado」。
# - 知られざる話：7〜8歳のとき、父のサッカーくじの投函を忘れた（父は15試合全部当てていて、約120万ユーロ＝推定）／1997-11-27（16歳）CLローゼンボリ戦で初めてトップチームに招集、ベンチのまま／2002年W杯は控え。先発のカニサレスが思いがけないけがで外れ、21歳で先発に。16強のアイルランド戦で規定時間にPKを1本、PK戦で2本止めて、PK戦3対2。あだ名「The Saint」の元。
# **入れなかったもの**：2019年5月の心臓の件、ポルトのリハビリ期間、離婚・家族、会長選への意向、モウリーニョとの不和、2014年W杯の失点の批判、レアル退団の経緯の批判、チリ戦の失点。
# **読みで怪しいもの**：カシージャス、ロッベン、ヘイティンハ、イニエスタ、デシャン、カンナバーロ、マテウス、ドゥンガ、ゾフ、ディ・ナターレ、デ・ロッシ、カニサレス、セサル、グティ、オリンピア、ヨハネスブルグ、モストレス、ゴールデングローブ、サン・イケル。「最年少」は「さいねんしょう」、「最多」は使わず言い換える。
