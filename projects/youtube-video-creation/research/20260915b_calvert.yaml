    heading: なぜ記録に残らなかったのか
    main: true
    tier: 報道
    telop: 2人に当たって、軌道が2度変わった
    narrator: 解説
    say:
      - {short_only: true, text: リーズ対ニューカッスル、前半32分の先制点の話です。}
      - 前半32分。田中がペナルティアークの中から右足を振りました。
      - このシュートが、2人の相手選手に当たります。
      - まずショーン・ステュア。次にルイス・マイリー。
      - ボールは2度コースを変えながら、ゴールの右へ吸い込まれました。
      - シュート自体は枠を捉えていたように見えます。
      - ですが、ステュアに当たった時点で枠の外へ向かうコースになり、そこからマイリーに当たって、もう一度枠内へ戻った。
      - そう判断されたため、記録はオウンゴールになったとみられています。
      - 田中の今季初ゴールは、お預けになりました。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260915/2205107.html
      - https://news.yahoo.co.jp/articles/c96ceadaaa03c652f8fc34f77bae630c30d51328

  - id: leeds
    heading: リーズはいまどうなっているか
    tier: 報道
    telop: 昇格組が無敗で3位
    narrator: 解説
    say:
      - リーズは昇格してきたクラブです。
      - その昇格組が、ここまで負けていません。この勝利で3位に浮上しました。
      - 4点のうち2点に関わったのが、ドミニク・カルヴァート＝ルーウィンです。
      - ニューカッスルは、彼がこれまで8度も得点を挙げてきた相手でした。
      - 終盤に交代でベンチへ下がるとき、エランド・ロードはスタンディングオベーションで迎えています。
      - 29歳。代表での出場は11試合で、最後は2021年のユーロ準々決勝でした。
      - この日の出来には、イングランド代表復帰の声が付いてきています。
    official: false
    sources:
