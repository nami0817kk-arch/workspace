# スタジアム紹介シリーズ：フラムの本拠地（クレイヴン・コテージ、10/24）。雛形は 10/23 パレスの回。
# 軸：A＝収容2万8107席はプレミア20クラブで16位。ピッチは縦100×横65mで、縦も横も20クラブで最小。
#     B＝テムズ川沿いの古い球場が、なぜ生き残ったのか。2002〜04年はQPRの球場に間借り、2004年に2万2000席で戻り、川沿いのスタンドを2025年までかけて建て替えた。
# 収容・ピッチ：PL公式ハンドブック2026/27（Ground Capacity at start of the Season、控え research/raw/20261021_nufc_plhandbook.txt）。
#   フラム 28,107（ピッチ 縦100×横65m）。15位イプスウィッチ 30,294／17位パレス 25,194／1位マンU 74,158。
#   ピッチ：縦はフラム100・リヴァプール101・パレス101.5・チェルシー103の順で最短。横はフラム65・イプスウィッチ66・チェルシー67.5・ハル67.2…で最狭。多くのクラブは105×68。
#   自分で引いた・割った：30,294-28,107=2,187／28,107-25,194=2,913／28,107÷74,158=0.379＝約38％／広さ 100×65=6,500 ÷ 105×68=7,140 = 0.91／49,335÷28,107=1.76／28,107-22,000=6,107。
# 入場（PL公式の試合API、取得2026-10-24。控え research/raw/20261024_pl_matches_all.json）：
#   2023/24 ホーム19試合＝合計461,722・平均24,301（最多24,467＝9/16 ルートン戦・最少23,598＝12/23 バーンリー戦）。
#   2024/25 ホーム19試合＝合計509,689・平均26,826（最多27,770＝2025/4/6 リヴァプール戦・最少24,931＝11/4 ブレントフォード戦）。
#   2025/26 ホーム19試合＝合計517,338・平均27,228（最多27,736＝10/18 アーセナル戦・最少26,113＝9/20 ブレントフォード戦）。
#   2026/27 ここまでのホーム4試合＝合計109,569・平均27,392。
#   自分で数えた：24/25と25/26の38試合＝合計1,027,027・平均27,027＝収容28,107の96.2％／最多27,770は収容の98.8％／2023/24→2025/26の平均は +2,927人（+12.0％）。
#   注意：ハンドブックの28,107は今季の開幕時の収容。2023/24は工事中で収容が小さかったので、その季の割合は言わず平均人数だけ言う。
# 本人・記録（ウィキペディア en "Craven Cottage" 取得2026-10-24。控え research/raw/20261024_fu_wp_craven.txt）：
#   1896年からフラムの本拠地／1896-10-10 初の入場料試合（ミネルヴァ戦）／最初のスタンドは250席×4の木の箱＝愛称「ウサギ小屋」／1904年に州議会が安全を問題にし、1905年1月の裁判のあとアーチボルド・リーチが招かれ、1万5000ポンド（当時の記録）でパビリオンとステヴェニッジ・ロード・スタンドを建てる／
#   2005年、ジョニー・ヘインズの死去（10月、交通事故）を受けスタンドを改名／パビリオンとヘインズ・スタンドはグレードIIの登録建造物／1933年、8万人の新球場案（大恐慌で実現せず）／1938-10-08 最多49,335人（ミルウォール戦）／1948年五輪の試合の会場／
#   リヴァーサイドは1971/72に座席のスタンドが建つ（4,200席、ベンフィカとの親善で開く）／ヒルズボロ後のテイラー報告、1996年にジミー・ヒル会長が全席座席案（実現せず）／2001/02に立ち見席が残るのはプレミアでフラムだけ／最後のリーグ戦＝2002-04-27 レスター戦／
#   2002/03・2003/04 QPRのロフタス・ロードに間借り／ファンの会「Back to the Cottage」／2003年12月に800万ポンドの改装案、2004年1月着工／2004-07-10 ワトフォードとの親善で2万2000席の全席座席として再開／
#   2012-07-27 リヴァーサイド建て替えの許可（3万席へ）／2013年3月 施工会社選定／2019年5月 夏着工の確認／2019/20〜2021/22 収容は一時的に1万9000／2022-03-17 下段を2022/23に開く（2000人超）／完成は2021年の予定から2024年へずれた（「いくつかの問題」）／最多の座席時代の入場27,770＝2025-04-06 リヴァプール戦。
#   完成後の収容：ウィキペディアは約2万9600〜2万9700、PLハンドブックは2万8107で割れる→台本ではハンドブックの数字で言い、割れていると断る。
# 日本との接点（基礎の次の節に置いた）：ウィキペディア en "Junichi Inamoto"／ja "稲本潤一"（控え research/raw/20261024_fu_wp_inamoto.txt・20261024_fu_ja_inamoto.txt）：
#   フラム在籍 2002〜2004（期限付き）／2002インタートト決勝でボローニャに合計5対3、稲本は2試合で4得点（第1戦1・第2戦ハットトリック）／フラム初の欧州の大会／2004年のイングランド戦で骨折しフラムを離れる。
#   つまり稲本のいた2季（2002/03・2003/04）、リーグ戦の本拠地はクレイヴン・コテージではなかった。決勝の会場は一次情報で確かめていないので台本では言わない。
# 割れる点（台本で断った）：①完成後の収容（上）／②ウィキペディアの「開場」の語は使わず「1896年から本拠地」と言う／③「プロサッカーに残る最古のスタンド」はウィキペディアの書き方なので「と書く」と断る。
# 言わなかったもの：マイケル・ジャクソンの像（経緯が人の問題に近い）／エリック・ミラーの話（私生活・法的）／オーナー・財政／女子チームの話／完成の費用（資料に無い）。
# 重なりを避けた：クラブ紹介⑩フラム（2026-09-20）は本拠地を1行＋「コテージ」の由来1節だけ。屋敷の由来・火事は言わない。稲本は欧州初制覇の話ではなく「本拠地にいなかった2季」の側から。
# 読めなかった：クラブ公式の完成後の収容。決勝第2戦の会場。ブラウザ操作・JS実行は不使用（requests と WebSearch/WebFetch）。
# 写真：assets/images/20261024_stadium_fulham/（Commons、出典は credits.json）。人物は特定していない。
