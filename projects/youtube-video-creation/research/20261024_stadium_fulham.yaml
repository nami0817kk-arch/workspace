    card:
      <<: *id_old
      highlight_row: 0
  - text: 最初のスタンドは、250席の木の箱を、4つ並べたもの。
    image: assets/images/20261024_stadium_fulham/05_w.jpg
    card: none
  - text: 合計で1000席。いまの収容の、約28分の1。
    image: assets/images/20261024_stadium_fulham/05_w.jpg
    card: none
  - text: ついた愛称は、ウサギ小屋でした。
    emph: true
    image: assets/images/20261024_stadium_fulham/05_w.jpg
    card: none
  - text: 安全を問題にされ、裁判になります。
    image: assets/images/20261024_stadium_fulham/04_w.jpg
    card: none
  - text: そのあと設計を任されたのが、アーチボルド・リーチです。
    image: assets/images/20261024_stadium_fulham/04_w.jpg
    card: none
  - text: 1905年、費用は1万5000ポンド。当時の記録でした。
    emph: true
    image: assets/images/20261024_stadium_fulham/04_w.jpg
    card:
      <<: *id_old
      highlight_row: 1
  - text: そのとき建ったのが、道路側のスタンドと、更衣室のパビリオン。
    image: assets/images/20261024_stadium_fulham/02_w.jpg
    card: none
  - text: 2つとも、いまも使われ、グレードIIの登録建造物です。
    emph: true
    image: assets/images/20261024_stadium_fulham/02_w.jpg
    card: none
  - text: 1933年には、8万人入る新球場に、建て替える案もありました。
    image: assets/images/20261024_stadium_fulham/03_w.jpg
    card:
      <<: *id_old
      highlight_row: 2
  - text: 大恐慌で、流れました。
    image: assets/images/20261024_stadium_fulham/03_w.jpg
    card: none
  - text: 1938年10月8日、ミルウォール戦に、4万9335人が入ります。
    emph: true
    image: assets/images/20261024_stadium_fulham/03_w.jpg
    card:
      <<: *id_old
      highlight_row: 3
  - text: いまの収容の、約1.76倍です。
    image: assets/images/20261024_stadium_fulham/01_w.jpg
    card:
      type: calc
      title: 最多の入場は、いまの収容の何倍か（自分で割った）
      terms:
      - - 4万9335人
        - 1938年の最多入場
      - - 2万8107人
        - いまの収容
      - - 1.76倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 2005年、元イングランド代表主将のジョニー・ヘインズが、亡くなります。
    image: assets/images/20261024_stadium_fulham/01_w.jpg
    card:
      <<: *id_old
      highlight_row: 4
  - text: 道路側のスタンドは、その名前に改められました。
    image: assets/images/20261024_stadium_fulham/01_w.jpg
    card: none
  - text: ウィキペディアは、プロサッカーに残る、最古のスタンドだと書いています。
    emph: true
    image: assets/images/20261024_stadium_fulham/04_w.jpg
    card: none
