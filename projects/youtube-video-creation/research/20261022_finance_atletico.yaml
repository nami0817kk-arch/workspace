# クラブの財政：アトレティコ・マドリード（10/22 木、シリーズ「クラブの財政」、key: finance_atletico、型は news）。
#
# 軸は「**収入は11%増えたのに、増えた分の約85%が商業なのは、なぜか（放映権はほぼ横ばい）**」。
#   ・デロイト Football Money League 2026（2024/25）：13位、収入 4億5450万ユーロ（前の年 4億950万、+11%、+4500万）。前の年は12位。
#     内訳（百万ユーロ、デロイトの図の整数。図の下の棒の値）：商業 117→156（+39）／放映権 218→219（+1）／試合日 74→80（+6）。409→455（図の整数を足すと +46、見出しは +45。丸めのずれ）。
#   ・過去5年（2021〜2025）：収入 333/394/364/410/455。放映権 231/225/182/218/219。商業 98/108/122/117/156。試合日 4/61/60/74/80。給料÷収入 74/65/67/65/62（%）。DFML の順位 13/12/15/12/13。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差／インテル＝10位との差／ヴィラ＝放映権の割合が最高／ユヴェントス＝放映権の特需と商業の穴）は繰り返さない。
#     この回の軸は「**増えた収入の中身が商業に寄っていたこと（放映権は動かず、商業が1年で33%増）と、同じ年・その後に起きた持ち主の交代**」。
#   ★アルファベットは読み上げに出さない。女子チームの話・監督・選手の個人名・法的な争い・制裁は言わない。選手の移籍金・給料の額は出さない。
#
# **決算期**：6月30日決算。2024/25＝2025年6月期。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026 一次ページ（deloitte.com、2026-10-21 に取得）：13位アトレティコ。図（e.infogram.com/_/QL0UuDnoYaUBUQ0WSrJt）から
#       「2025 Revenue €454.5m (2024: €409.5m)」「Change on previous year +11% (+€45m)」。棒の値は上の通り。DFML position 13/12/15/12/13。「ON-PITCH 2024/25：La Liga 3rd／UEFA Champions League R16」。
#       ★図には女子チーム（収入€1.3m）の欄もあるが、**使わない**（女子は扱わない決まり）。ランキングの収入に女子の分が含まれるかは、デロイトの注記では「別法人なら含まれないことがある」とだけ。
#       ★隣の順位の収入（それぞれの図で確認）：12位ドルトムント €531.3m、14位アストン・ヴィラ €450.2m（2024: €310.2m、+45%）、15位ミラン €410.4m、16位ユヴェントス €401.7m。
#         同じスペイン：1位レアル・マドリード €1,161m、2位バルセロナ €974.8m（図で確認）。
#       定義（ページ本文）：放映権は国内リーグ・カップ・欧州連盟の大会・FIFAクラブW杯の賞金と分配金を含む。商業はスポンサー・グッズ・その他の商業・試合以外の催し。給料は選手・職員すべての賃金・手当・社会保険等。収入は選手の移籍金を含まない。
#       本文：「UEFA's distributable funds for these competitions grew to €3.3 billion in 2024/25, up c.22% from €2.7 billion in 2023/24」「the expansion of UEFA's three primary men's club competitions also contributed」。
#   ○ アトレティコ公式サイト（atleticodemadrid.com）総会の記事「La Junta General Ordinaria de Accionistas aprueba por unanimidad las cuentas anuales de la temporada 2024-25 y el presupuesto para la 2025-26」
#       https://www.atleticodemadrid.com/noticias/la-junta-general-ordinaria-de-accionistas-aprueba-por-unanimidad-las-cuentas-anuales-de-la-temporada-2024-25-y-el-presupuesto-para-la-2025-26
#       「…la cuenta de resultados del ejercicio cerrado a 30 de junio de 2025 arrojó una pérdida de 5.991.241,13 euros」「…el presupuesto del club para la presente temporada 2025-26, en el que se prevén unos ingresos de 554 millones de euros」。
#       ★**ページ本文は Cloudflare の確認で直接読めなかった（403）。上の2文は検索結果が引いたクラブ公式サイトの原文の引用で確認した（2回、別の検索で同じ文）。公開前に公式で確かめること。**
#   ○ アポロ（ir.apollo.com）共同プレスリリース 2025-11-10 https://ir.apollo.com/news-events/press-releases/detail/591/atltico-de-madrid-to-welcome-apollo-sports-capital-as
#       アポロ・スポーツ・キャピタルがクラブの過半数の株主になる合意（金額は非公表、完了は2026年1〜3月期の見込み）。ヒル（最高経営責任者）とセレソ（会長）は続投・株主のまま。
#       本拠地の隣の新街区（Ciudad del Deporte）の開発を含め、追加の資本を入れる意向。
#   ○ アポロ（ir.apollo.com）プレスリリース 2026-03-12 https://ir.apollo.com/news-events/press-releases/detail/612/apollo-sports-capital-completes-transaction-to-become
#       取引が完了。クアンタム・パシフィックはほぼ全株を保持して2番目の株主。取締役会の株主が「最大1億ユーロの追加の資本（increase of equity and strategic capital）」を承認。
#   ○ 報道（Gulf News、AFP、2024-10-10）https://gulfnews.com/business/aviation/riyadh-air-ink-stadium-naming-deal-with-atletico-madrid-1.1728559725713
#       リヤド・エアが9年契約で本拠地の名称を「リヤド・エア・メトロポリターノ」（2033年まで）に。2023年8月10日に始まった提携の一部で、公式スポンサー・航空会社パートナー・名称権のパートナー。ユニフォームの胸にもロゴ。
#       （英語版 Wikipedia の 2024-25 シーズンの記事では「2024-10-09 から名称変更」と書く。日付は台本では「2024年10月」とだけ言う。）
#   ○ 英語版 Wikipedia「2024–25 Atlético Madrid season」「2023–24 Atlético Madrid season」：チャンピオンズリーグ 2024-25 は16強、2023-24 は8強（ドルトムントに敗退）。リーグ 3位／4位。（デロイトの R16 と一致）
#   △ 報道（Calcio e Finanza 2025-11-19、マルカの報道を引く）https://www.calcioefinanza.it/2025/11/19/atletico-madrid-bilancio-2025-ricavi-costi/
#       「赤字約600万ユーロの主因は償却費（ammortamenti）の増加と他の運営費。償却費は 7640万ユーロ（+26%）」。**クラブ決算の商業収入（113.5）はデロイトの商業（156）と分類が違い、別の報道は 109.5 と書くので、台本には出さない。**
#   × 確かめられなかったもの：クラブの決算書の全文（総収入・内訳・負債）、「2024/25 は新型コロナ後初の赤字」（確かめられない）、取引の評価額・持分比率（報道で55%・57%・2.5bn と割れる）、増加の内訳の理由（デロイトは書かない）。台本に出さない。
#
# 自分で計算した数（検算済み）
#   商業 156÷117−1＝+33.3%。試合日 80÷74−1＝+8.1%。放映権 219÷218−1＝+0.5%。放映権 219÷231−1＝−5.2%。商業 156÷98−1＝+59%。
#   増加の合計（図の整数）39＋6＋1＝46。商業の割合 39÷46＝84.8%→約85%。
#   商業が前の年のままなら 454.5−39＝415.5（409.5÷より +1.5%）。ミラン410.4より上・ヴィラ450.2より下＝15位相当。
#   構成比 商業 117÷409＝28.6%→29%、156÷455＝34.3%→34%。放映権 218÷409＝53.3%→53%、219÷455＝48.1%→48%。試合日 74÷409＝18.1%、80÷455＝17.6%（どちらも18%）。
#   アトレティコ÷バルセロナ 454.5÷974.8＝46.6%（半分に届かない）。アトレティコ−ヴィラ 454.5−450.2＝4.3。
#
