  - text: 2033年までの、9年契約です。
    emph: true
    card:
      <<: *ra_tl
      focus: 2
  - text: 提携は、2023年8月から。ユニフォームの胸にも、ロゴが付いています。
    image: assets/images/20261022_finance_atletico/02_w.jpg
    card:
      <<: *ra_tl
      focus: 0
  - text: 名前の契約は、2024-25シーズンの途中からです。
    card: none
  - text: ただ、デロイトの図に、内訳はありません。時期が重なった、という事実だけを置きます。
    image: assets/images/20261022_finance_atletico/05_w.jpg
    card: none
  - text: 収入が増えた年に、決算は、どうなっていたのか。
    card: none
  sources:
  - https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
  - https://gulfnews.com/business/aviation/riyadh-air-ink-stadium-naming-deal-with-atletico-madrid-1.1728559725713
- id: books
  heading: 収入が増えた年の決算と、その後の持ち主は、どうなったのか
  tier: 報道
  telop: 2025年6月期は約600万ユーロの赤字。2026年3月、アポロが過半数の株主に
  narrator: 解説
  card: &wage_bars
    type: bars
    title: 収入に占める給料の割合（デロイトの図、%）
    unit: '%'
    items:
    - label: 2020-21
      value: 74
    - label: 2021-22
      value: 65
    - label: 2022-23
      value: 67
    - label: 2023-24
      value: 65
    - label: 2024-25
      value: 62
      highlight: true
  say:
  - text: アトレティコは、総会の記録に、2024-25の決算を残しています。
    image: assets/images/20261022_finance_atletico/01_w.jpg
    card: none
  - text: 6月30日に終わった決算期は、約600万ユーロの赤字でした。
    emph: true
    card: &loss_stats
      type: stats
      title: アトレティコの決算（クラブの総会の記録、2025年6月期）
      items:
      - ['-6.0', 百万ユーロ, 最終損益（5,991,241ユーロ）]
      - ['5.54', 億ユーロ, 2025-26の予算の収入（総会で承認）]
      focus: 0
  - text: 正確には、599万1000ユーロあまりです。
    card: *loss_stats
  - text: 赤字の主な理由は、償却費の増加だと伝えられています。
    image: assets/images/20261022_finance_atletico/02_w.jpg
    card: none
  - text: 償却費とは、選手の移籍金を、契約の年数で分けて、毎年の費用にするものです。
    card: none
  - text: その額は、7640万ユーロ。前の年より、26%多いと伝えられています。
    card: none
  - text: 給料の割合は、デロイトの図で、62%。この5年で、最も低い割合です。
    image: assets/images/20261022_finance_atletico/03_w.jpg
    card: *wage_bars
  - text: 収入が増え、給料の割合は下がりました。それでも、決算は、赤字でした。
    emph: true
    card: *wage_bars
  - text: クラブが総会で承認した、2025-26の予算は、収入5億5400万ユーロ。
    image: assets/images/20261022_finance_atletico/04_w.jpg
    card:
      <<: *loss_stats
      focus: 1
  - text: ただ、予算の内訳は確かめられていないので、デロイトの数字とは、並べません。
    card: none
  - text: 次に、持ち主です。2025年11月10日、新しい大株主の発表がありました。
    image: assets/images/20261022_finance_atletico/05_w.jpg
    card: &own_tl
      type: timeline
      title: アトレティコの持ち主（アポロとクラブの発表）
      rows:
      - [2025年11月10日, アポロ・スポーツ・キャピタルが過半数の株主になる合意]
      - [2026年3月12日, 取引が完了。最大1億ユーロの追加の資本も承認]
      focus: 0
  - text: アポロ・スポーツ・キャピタルが、クラブの過半数の株主になる、という合意です。
    emph: true
    card: *own_tl
  - text: 発表の時点で、取引の金額は、公表されていませんでした。
    card: none
  - text: 2026年3月12日に、取引は完了しました。
    image: assets/images/20261022_finance_atletico/02_w.jpg
    card:
      <<: *own_tl
      focus: 1
  - text: 株主の側は、最大1億ユーロの、追加の資本も承認しました。
    emph: true
    card:
      <<: *own_tl
      focus: 1
  - text: 使い道には、本拠地の隣の、新しい街区の開発が、挙げられています。
    image: assets/images/20261022_finance_atletico/03_w.jpg
    card: none
  - text: 最高経営責任者と会長は、これまでどおり、クラブを率います。
    card: none
  sources:
  - https://www.atleticodemadrid.com/noticias/la-junta-general-ordinaria-de-accionistas-aprueba-por-unanimidad-las-cuentas-anuales-de-la-temporada-2024-25-y-el-presupuesto-para-la-2025-26
  - https://www.calcioefinanza.it/2025/11/19/atletico-madrid-bilancio-2025-ricavi-costi/
  - https://ir.apollo.com/news-events/press-releases/detail/591/atltico-de-madrid-to-welcome-apollo-sports-capital-as
  - https://ir.apollo.com/news-events/press-releases/detail/612/apollo-sports-capital-completes-transaction-to-become
  - https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
- id: view
  viewpoint: true
  heading: 見立て・収入11%増は、商業への寄りが強まった結果
  tier: 背景
  telop: 商業が前の年のままなら、収入は約4億1550万ユーロ。15位相当
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（2024-25、デロイトの図）
    columns: &view_cols [比べ, 答え]
    rows: &view_rows
    - [増えた収入に占める、商業の割合, 約85%]
    - [商業が前の年のままなら、収入, 約4億1550万ユーロ（+1.5%）]
    - [収入に占める商業（前の年→今）, 29%→34%]
    - [収入に占める放映権（前の年→今）, 53%→48%]
    highlight_row: 0
  say:
  - text: 見立てです。アトレティコの内訳を、割り算で見直します。
    image: assets/images/20261022_finance_atletico/04_w.jpg
    card: *view_table
  - text: 増加のうち、商業が、約85%を占めました。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card:
      <<: *view_table
      highlight_row: 0
  - text: 商業が、前の年の水準なら、収入は約4億1550万ユーロです。
    image: assets/images/20261022_finance_atletico/01_w.jpg
    card:
      <<: *view_table
      highlight_row: 1
  - text: 伸びは、11%ではなく、約1.5%でした。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1
    card:
      <<: *view_table
      highlight_row: 1
  - text: その場合、順位は15位。ミランを、わずかに上回ります。
    image: assets/images/20261022_finance_atletico/02_w.jpg
    card: none
  - text: 収入の柱も、動きました。商業は、29%から34%へ。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 放映権は、53%から48%へ。
    mark:
      kind: circle
      row: 3
      col: 1
    image: assets/images/20261022_finance_atletico/03_w.jpg
    card:
      <<: *view_table
      highlight_row: 3
  - text: 5年前と比べると、商業は約59%増えて、放映権は約5%減りました。
    emph: true
    card: none
  - text: 題への答えは、2つ。放映権が動かなかったことと、商業だけが伸びたことです。
    image: assets/images/20261022_finance_atletico/02_w.jpg
    card: none
  - text: 14位のアストン・ヴィラは、1年で1億4000万ユーロ、収入を増やしました。
    image: assets/images/20261022_finance_atletico/05_w.jpg
    card: none
  - text: 次の集計で、商業はどこまで伸びるのか。放映権は動くのか。
    image: assets/images/20261022_finance_atletico/04_w.jpg
    card: none
  sources:
  - https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
