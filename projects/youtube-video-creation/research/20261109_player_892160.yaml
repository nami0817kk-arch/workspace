- id: view
  heading: ハンブルクとブライトンで、ヴシュコヴィッチが出た試合の守りは何が違うのか
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: ハンブルクの28試合と、ブライトンの9試合
  card: &view_card
    type: table
    title: ヴシュコヴィッチが出たリーグ戦
    columns:
    - 項目
    - ハンブルク（25/26）
    - ブライトン（今季）
    rows:
    - - 試合
      - '28'
      - '9'
    - - 勝ち・分け・負け
      - 9勝9分10敗
      - 6勝1分2敗
    - - 1試合あたりの失点
      - '1.50'
      - '0.78'
    - - 無失点の試合
      - '5'
      - '6'
    source: Transfermarkt
    highlight_row: 0
  say:
  - text: 締めくくりに、ヴシュコヴィッチが出たリーグ戦を、2つのクラブで比べます。
    image: assets/images/20261109_player_892160/h2/01_w.jpg
    card: none
  - text: ハンブルクで出た28試合は、9勝9分け10敗。
    image: assets/images/20261109_player_892160/b2/01_w.jpg
    card:
      <<: *view_card
      highlight_row: 1
  - text: ブライトンの9試合は、6勝1分け2敗です。
    image: assets/images/20261109_player_892160/b2/01_w.jpg
    card:
      <<: *view_card
      highlight_row: 1
  - text: 失点は1試合あたり、1.50から0.78へ。ほぼ半分です。
    card:
      <<: *view_card
      highlight_row: 2
    emph: true
    mark:
      kind: circle
      row: 2
  - text: 無失点の試合は、ハンブルクで5つ。ブライトンでは9試合で、もう6つ。
    card:
      <<: *view_card
      highlight_row: 3
  - text: ただ、昇格1年目のハンブルクと、いま3位のブライトンでは、周りの顔ぶれが違います。
    image: assets/images/20261109_player_892160/h1/01_w.jpg
    card: none
  - text: それでもハンブルクで、出なかった5試合の失点は、1試合あたり2.40でした。
    card: none
  - text: リーグ戦では、まだ1試合も休まず、この守りを続けています。
    image: assets/images/20261109_player_892160/b1/01_w.jpg
    card: none
  quotes_from: []
