# **選んだ理由・重なり確認（2026-11-06）**：player_pool.py list を市場価値の上位から見て、紹介を出していない人は 26 ヌメチャ・28 マレン・30 カマラ・31 ヴシュコヴィッチ（1〜25・27・29 は紹介済み。24 シュロッターベックは 11/7）。
#   TM の今の値はヴシュコヴィッチ 6500万（2026-10-07）・ヌメチャ 6500万・マレン 5500万・カマラ 5500万。ヌメチャは 11/7 のシュロッターベックと同じドルトムントなので外し、ヴシュコヴィッチを 11/9、マレンを 11/11 に。
#   scripts/・research/posted.json・covered.yaml を「ヴシュコヴィッチ／Vuskovic／892160」で grep：0件。ブライトンの財政（11/6）・クロアチア代表（11/8）とは人名の組み合わせが別。
#   現役・今季もプレミア1部：TM の試合記録でプレミア9試合（8/23〜10/31）、英語版Wikipedia（club_update 2026-10-25）も current club = Brighton & Hove Albion・背番号44。ブライトン公式 2026-07-14 に5年契約（＋1年の選択権）の発表。
# **数字の軸**：トップチームと代表の通算（全公式戦。ハイドゥクのU19は数えない）：ハイドゥク11試合1得点・ラドミアク14・3・ウェステルロー36・7・ハンブルク30・6・ブライトン15・1（クラブ106試合18得点）＋クロアチア代表10試合1得点 → 116試合19得点。
#   英語版Wikipedia の通算表（11/5 まで：クラブ 106・18、代表 10・1）と TM の試合記録が一致。
#   市場価値（TM）：2023-06 600万ユーロ（16歳、ハイドゥク）→ 2025-06 1200万（ウェステルロー）→ 2025-10 1800万 → 2025-12 4000万 → 2026-03 6000万（ハンブルク）→ 2026-10 6500万（最高・いま）。ハンブルクの1季で 1200万→6000万＝5倍。
#   季ごと（クラブの全公式戦、TM）：22/23 ハイドゥク 11試合・765分・1得点／23/24 ラドミアク 14・1151分・3／24/25 ウェステルロー 36・2965分・7／25/26 ハンブルク 30・2652分・6／26/27 ブライトン 15・1180分・1（1アシスト）。
#   今季のプレミア9試合（TM、すべて先発）：8/23 ヴィラ4-0、8/30 チェルシー3-4、9/5 リーズ1-1（得点）、9/13 コヴェントリー5-0（78分）、9/19 アーセナル3-0、10/10 サンダーランド2-0、10/18 パレス5-0、10/25 リバプール0-2、10/31 シティ1-0。6勝1分2敗・失点7・無失点6。
#   ハンブルクのブンデス（TM、25/26）：出た28試合 9勝9分10敗・失点42（1.50）・無失点5／出なかった5試合 0勝1分4敗・失点12。
#   プレミアの順位：英語版Wikipedia「2026–27 Premier League」（11/2 まで）で3位・9試合6勝1分2敗・24得点7失点・勝ち点19。首位アーセナルは8勝1敗で、その1敗が 9/19 のブライトン戦。
# **一次情報・出典**：ブライトン公式（2026-07-14 の契約の発表とヒュルツェラー監督の言葉、9/5 リーズ戦の記事）、ハンブルク公式（2026-05-21「Luka Vušković's unforgettable year」の本人の言葉と季の数字）、英語版Wikipedia（ハイドゥクのデビュー・トッテナム・W杯）。
#   リーズ戦の記事：リーズの先制は田中碧の折り返しをボーグルが押し込んだもの。ヴシュコヴィッチの同点はデ・カイペルのCKを頭で（ブライトン公式は72分、Sky は71分→分は言わない）。
#   本人の言葉：ハンブルク公式の英語版から訳した。監督の言葉：ブライトン公式の発表から訳した。
# **入れなかったもの**：移籍金（報道の額だけで公式が無い）、兄マリオの件（法的な問題）、W杯のクロアチアの勝ち負けの細部、ネーションズリーグの大敗、9/16 のカップ戦の扱い（アシストのみ表に）。
