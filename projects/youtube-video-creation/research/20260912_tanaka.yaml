#
# **「3年ぶり」と「4シーズンぶり」で表記が割れていた。**マイナビとサッカーキングの
# 本文は「トップリーグで4シーズンぶり」。**本文の表現を採る。**
#
# 引きは**「戻ってきた選手が、もう外せなくなっている」**。勝ったことより、
# **定位置を取りかけている**ところが芯。ここが山場（@main）。
