- id: history
  heading: 1911年の揉め事
  tier: 背景
  telop: 地元の選手だけ、は揉め事から始まった
  narrator: 解説
  card:
    type: table
    title: 地元の選手だけ
    columns: &id001
    - ''
    - ''
    rows:
    - - 1911年
      - 出場資格でソシエダと対立
    - - その後
      - 連盟が国籍の規則
  say:
  - このクラブが地元の選手だけで戦うようになったのは、**1911年**からです。
  - 国王杯で、イングランド人選手の出場をめぐり、ソシエダと揉めたのがきっかけ。
  - text: 連盟は、選手をスペイン国籍に限ると決めます。
    card:
      type: table
      title: 地元の選手だけ
      columns: *id001
      rows:
      - - それ以来
        - 地元の選手だけで戦う
  - 規則がゆるんだあとも、クラブはそのやり方を変えませんでした。
  sources:
  - https://en.wikipedia.org/wiki/Athletic_Bilbao_signing_policy
  - https://es.wikipedia.org/wiki/Athletic_Club
  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
- id: history2
  heading: アトレティコは支部だった
  tier: 背景
  telop: アトレティコは、このクラブの支部として生まれた
  narrator: 解説
  card:
    type: table
    title: マドリードの支部
    columns: &id002
    - ''
    - ''
    rows:
    - - 1903年
      - 支部としてアトレティコ誕生
    - - 1909年の暮れ
      - サウサンプトンの赤白を50枚
  say:
  - アトレティコ・マドリードは**1903年**、このクラブの支部として生まれました。
  - 国王杯の優勝をマドリードで見届けた、バスクの学生3人が作ったチームです。
  - text: 1909年の暮れ、サウサンプトンの赤白のシャツを、イングランドで**50枚**買いました。
    card:
      type: table
      title: マドリードの支部
      columns: *id002
      rows:
      - - その半分
        - マドリードへ
  - 半分はマドリードへ。2つのクラブは、いまも赤白の縦じまです。
  sources:
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
