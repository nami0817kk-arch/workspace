  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
- id: history4
  heading: 決勝は自分の家で
  tier: 背景
  telop: 決勝の舞台は、自分たちの本拠地だった
  narrator: 解説
  card:
    type: table
    title: 2025年、決勝は自分の家で
    columns:
    - ''
    - ''
    rows:
    - - 決勝の会場
      - サン・マメス
    - - 準決勝
      - マンチェスター・ユナイテッドに合計1対7
  say:
  - 2025年、ヨーロッパリーグの決勝の舞台は、このクラブの本拠地でした。
  - 準決勝まで勝ち進みましたが、マンチェスター・ユナイテッドに2試合で**1対7**。
  - 自分たちの家での決勝は、イングランドの2クラブが戦いました。
  sources:
  - https://en.wikipedia.org/wiki/2025_UEFA_Europa_League_final
  - https://www.deia.eus/athletic/2026/09/25/nico-williams-espinita-san-mames-titulo-europeo-11585395.html
  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 背後へ走る。手放さない。どこへでも行く
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 背後へ走る
    - - 運営の型
      - 育てた選手を手放さない
    - - クラブの気質
      - 7万人が決勝の地へ
  say:
  - text: テルジッチが求めるのは、守備の背後への走り。走れなければ、ボールを速く動かします。
    image: assets/photos/ll/athletic/athletic_manager_b9e7b490.jpg
  - ピッチの外は、育てた選手を手放さない型。
  - ニコ・ウィリアムズとは2025年、**2035年**まで契約を延ばしました。
  - ファンは、どこへでも付いていきます。
  - 2015年の国王杯の決勝の前には、約**7万人**がバルセロナへ向かいました。
  sources:
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
  - https://www.marca.com/futbol/athletic/2026/09/12/terzic-paso-atras.html
  - https://en.wikipedia.org/wiki/Nico_Williams
  - https://es.wikipedia.org/wiki/Athletic_Club
  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
- id: episode
  heading: 優勝は船で祝う
  tier: 背景
  telop: 優勝すると、選手は船で川を下る
  narrator: 解説
  card:
    type: table
    title: 優勝は船で祝う
    columns:
    - ''
    - ''
    rows:
    - - 1983年
      - 初めて船で優勝を祝う
    - - 次に出たのは
      - 2024年。大潮で木曜に延期
  say:
  - text: 優勝すると、選手たちは平らな船に乗って、ビルバオの川を下ります。
    image: assets/images/ll_athletic_episode/scene.jpg
  - 始まりは**1983年**。沿道に**100万人**が出たと言われ、選手がひとり川に落ちました。
  - 1984年のあと、次に船が出たのは**2024年**。大潮のため、祝う日は木曜にずれました。
  sources:
  - https://es.wikipedia.org/wiki/Gabarra_del_Athletic
  bg: assets/backgrounds/stadium_アスレティックビルバオ_in.png
  official: false
