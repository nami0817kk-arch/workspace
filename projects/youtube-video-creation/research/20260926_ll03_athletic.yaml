- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 世界王者3人と、欧州の決勝を知る新監督
  narrator: キャスター
  say:
  - text: 今年のワールドカップを制したスペイン。決勝に出た**3人**が、このクラブの選手です。
    image: assets/stats/ll_athletic_data_r1.png
    no_telop: true
  - text: そのひとり、ニコ・ウィリアムズはこう話しています。
    image: assets/stats/ll_athletic_data_r2.png
    no_telop: true
  - voice: ニコ・ウィリアムズ
    text: アスレティックで欧州のタイトルを取りたい。まだ誰も取っていないから、歴史に残れる
    image: assets/stats/ll_athletic_data_r2.png
  - text: 今季からは、ドルトムントを欧州の決勝へ導いたテルジッチ監督が率います。
    image: assets/stats/ll_athletic_data_r3.png
    no_telop: true
  - text: 決勝までは進んだことがあります。それでも、欧州の大会の優勝には**一度も**届いていません。
    image: assets/stats/ll_athletic_data_r3.png
    no_telop: true
  - image: assets/stats/ll_athletic_data0.png
    text: 創立は**1898年**。バスクの学生7人が、ボールを蹴り始めた年です。
    no_telop: true
  - image: assets/stats/ll_athletic_data1.png
    text: 愛称は「レオネス」。ライオンの前に投げられた聖人、マメスにちなむ呼び名。
    no_telop: true
  - image: assets/stats/ll_athletic_data2.png
    text: ホームタウンはビルバオ。人口**34万**を超える、バスクでいちばん大きな町です。
    no_telop: true
  - image: assets/backgrounds/stadium_アスレティックビルバオ.png
    text: 本拠地はサン・マメス。**5万3289人**が入り、「大聖堂」と呼ばれます。
  - image: assets/stats/ll_athletic_data4.png
    text: 会長は**2022年**からジョン・ウリアルテ。クラブは会員のもので、会長も選挙で決まります。
    no_telop: true
  - image: assets/stats/ll_athletic_cups.png
    text: 1部の優勝は**8回**。国王杯は**24回**、スーペルコパは**3回**。
    no_telop: true
  - image: assets/stats/ll_athletic_data6.png
    text: 最多出場は、ゴールキーパーのホセ・アンヘル・イリバル。**614試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_athletic_data7.png
    text: 直近のタイトルは**2024年**の国王杯。マジョルカとの決勝は、ピーケー戦までもつれました。
    no_telop: true
  - image: assets/stats/ll_athletic_data8.png
    text: 昨季のリーグ戦は**12位**、勝ち点**45**。チャンピオンズリーグにも出ています。
    no_telop: true
