# ユーザーが○を付けた題。10/2（city_verdict：認定の中身・スポンサー料・前例の超過額・40倍）と 10/3（city_appeal：控訴の日付・ピント）は言い直さない。
# この回の主題は「罰の重さをめぐる声」：ライバルの見方（1季の降格では足りない）→ キャラガー（何年も続くべき）→ 規則で何ができるか → 前例の減点を数えた表。
# 一次情報（1行ずつ突き合わせた。raw の「一次情報」）:
#   PL ハンドブック 2026/27：W.63（リーグとクラブが事情を出す）・W.64（罰金は上限なし・勝ち点は取った分もこれからの分も・除名は勧めるだけ・組み合わせ）・
#     B.6（除名は総会で、投票したクラブの4分の3以上）・W.76（罰にもシティ・リーグ双方が控訴できる）・W.86（控訴の判断は審理の最終日から30日。10/1＋84日＋30日＝1/23）・
#     歴代の最終順位表の注記（減点はミドルスブラ3・ポーツマス9・エヴァートン6＋2・フォレスト4の4クラブ5回）・2023/24 と 1996/97 の最終順位。
#   PL 公式：シティ 9/29（罰は同じ独立委員会が別の非公開の審理で）・10/2（控訴）、エヴァートン 3788486・3912574・3960088・4001861、フォレスト 3999776、チェルシー 4616198（2026-03-16、罰金計1075万ポンド、減点なし）。
#   エヴァートンの判断 PDF 87・89項（リーグの式：6点から、上限を500万ポンド超えるごとに1点。委員会は採らず）。
#   「リーグは12点を求めた」は記事だけで判断の公開版に数字が無いので言わない。
# 発言：キャラガー（Sky Sports 10/6 が引いた Sky Sports News の言葉／Independent・GB News 10/6 が引いた The Overlap の言葉）。原文と訳は raw。
#   匿名のクラブ関係者（Guardian 9/30・BBC 9/30）は声にせず語りでまとめた。
# 見立て：前例の減点を自分で数えた表（6行）。「財務の規則での減点は3件で計12点、シティの認定は114件＝件数で38倍」。何点引かれるかは言わない。
