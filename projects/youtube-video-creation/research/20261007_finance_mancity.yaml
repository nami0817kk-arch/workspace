sections:
- id: rivals
  heading: ライバルの見方は「1季では足りない」
  tier: 報道
  telop: 控訴が通らなければ、来季のプレミアにシティはいない。ライバルの多くはそう見ている
  narrator: キャスター
  card:
    type: table
    title: 9季の違反と、ライバルの見方
    columns: ['', '']
    rows: &rivals
    - [違反が認められた期間, 9季（2009年から）]
    - [その間のシティのタイトル, 8つ（うちリーグ優勝3）]
    - [ライバルが足りないとみる罰, 2部に1季]
    - [補償を求める権利を残した, 4クラブ（2024年9月）]
  say:
  - text: 控訴が通らなければ、来季のプレミアリーグにシティはいない。
    image: assets/images/20261007_finance_mancity/pair_carra/01.jpg
    emph: true
  - text: 財務規則の違反で、9月29日に有罪とされたシティ。
  - text: ライバルのクラブの多くが、そう見ていると伝えられています。
  - text: 規則違反が認められたのは、2009年からの9季です。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 0
  - text: その9季に、シティはリーグ優勝3回を含む、8つのタイトルを取りました。
    image: assets/images/20261007_finance_mancity/02_w.jpg
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 1
  - text: ライバルが気にするのは、2部に落ちても、1季で戻ってこられることです。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 2
  - text: 9季にわたって破った規則に、1季だけの罰では釣り合わない、という見方です。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 2
  - text: シティが落ちれば、降格するクラブが1つ減り、欧州の大会の枠も1つ空きます。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 2
  - text: そんな損得より、規則はどのクラブにも同じ、という考えが中心だといいます。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 2
  - text: 罰の重さを気にする訳は、もう1つあります。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 3
  - text: アーセナル、トッテナム、リヴァプール、マンチェスター・ユナイテッド。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 3
  - text: この4クラブは2024年9月、有罪なら補償を求める権利を残すと、
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 3
  - text: 弁護士を通じてシティに伝えていました。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 3
  - text: 実際に求めるかどうかは、罰が決まるのを見てから、とみられています。
    card:
      type: table
      title: 9季の違反と、ライバルの見方
      columns: ['', '']
      rows: *rivals
      highlight_row: 3
  sources:
