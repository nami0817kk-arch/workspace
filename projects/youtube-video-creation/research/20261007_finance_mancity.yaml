- id: carragher
  main: true
  heading: キャラガー「罰も何年も続くべき」
  tier: 報道
  telop: キャラガー「何年も何年も続いてきたことだから、罰も何年も続くべきだ」
  narrator: キャスター
  say:
  - text: 財務の違反で有罪のマンC。ライバルは「9季の違反に1季の降格は軽い」と見ます。
    short_only: true
    image: assets/images/20261007_finance_mancity/pair_carra/01.jpg
  - text: 解説者のキャラガーも、スカイスポーツでこう話しました。
    image: assets/images/20261007_finance_mancity/pair_carra/01.jpg
  - voice: キャラガー
    text: 罰は今季のうちに決めないといけない。
  - voice: キャラガー
    text: 来季のシティに効かせるためにね。
    cont: true
  - voice: キャラガー
    text: どんな罰であれ、1季かぎりで済むとは思わない。
    cont: true
  - voice: キャラガー
    text: 何年も何年も続いてきたことだから、
    cont: true
  - voice: キャラガー
    text: 罰も何年も続くべきだと思う。
    cont: true
    emph: true
  quotes_from:
  - スカイスポーツ https://www.skysports.com/football/news/13595428/man-city-charges-premier-league-clubs-do-not-expect-city-to-be-in-premier-league-next-season-if-appeal-fails
  sources:
  - https://www.skysports.com/football/news/13595428/man-city-charges-premier-league-clubs-do-not-expect-city-to-be-in-premier-league-next-season-if-appeal-fails
- id: rules
  heading: 3年から5年の罰は、規則でできるのか
  tier: 確定
  official: true   # PL ハンドブック 2026/27 の W.63・W.64・W.76・W.86・B.6 と PL 9/29 の声明まで辿った。キャラガーの2つめの言葉は報道（Independent・GB News）
  telop: 規則に「降格」という罰は無い。除名を決めるのはクラブの総会で、4分の3以上の賛成が要る
  narrator: キャスター
  card:
    type: table
    title: 罰を決める仕組み（リーグの規則）
    columns: ['', '']
    rows: &rules
    - [罰を決める人, 判定を出した独立委員会の3人]
    - [罰金, 上限なし]
    - [勝ち点, これから取る分も引ける]
    - [除名, 委員会は勧めるだけ]
    - [除名を決める場, 総会で4分の3以上の賛成]
    - [決まった罰への控訴, シティもリーグもできる]
  say:
  - text: キャラガーは別の番組で、年数まで挙げています。
  - voice: キャラガー
    text: 80点や100点を引くと言っても、それは1季だけの話だ。
  - voice: キャラガー
    text: 降格して、また戻ってくる。
    cont: true
  - voice: キャラガー
    text: これだけ長く続いたのだから、罰は何年かにわたるべきだ。
    cont: true
  - voice: キャラガー
    text: 3年から5年。そうすれば選手も出ていく。
    cont: true
  - text: では、何年も続く罰は、リーグの規則でできるのでしょうか。
    image: assets/images/20261007_finance_mancity/03_w.jpg
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
  - text: 罰を決めるのは、有罪と判定した、リーグから独立した委員会の3人です。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 0
  - text: リーグの理事会が求める罰を示し、シティは軽くすべき事情を訴えます。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 0
  - text: ほかのクラブは、この審理には加われません。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 0
  - text: 委員会に許されているのは、まず、上限のない罰金。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 1
  - text: 勝ち点は、すでに取った分も、これから取る分も引けます。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 2
  - text: ただ、規則の一覧に「降格」という罰はありません。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 2
  - text: 落とすには、勝ち点を引くか、リーグから外す除名か、です。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 3
  - text: その除名も、委員会ができるのは勧めることまで。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 3
  - text: 決めるのはクラブの総会。投票したクラブの4分の3以上の賛成が要ります。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 4
    emph: true
  - text: 罰の審理に加われないライバルが、ここでは1票を持つことになります。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 4
  - text: そして罰が決まれば、シティもリーグも、その罰に控訴できます。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 5
  - text: 罰を決める審理の日程は、まだ発表されていません。
    card:
      type: table
      title: 罰を決める仕組み（リーグの規則）
      columns: ['', '']
      rows: *rules
      highlight_row: 5
