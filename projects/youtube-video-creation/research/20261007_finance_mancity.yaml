    text: 責任のある人には、責任を取らせてほしい。
    cont: true
  - voice: ネット民
    text: とてつもない減点のあとに昇格して、元通り、では済まない。
    cont: true
  - voice: ネット民
    text: その結果は、何年もシティについて回るべきだ。
    cont: true
  # X @SgTMkL（10/4 20:50 JST）。全文
