  topic: マンチェスター・シティ
  title: マンチェスター・シティの判決、ほかのクラブはどう見ているか
  question: 有罪とされたシティの罰の重さを、ライバルのクラブや識者はどう見ているのか
  takeaway: ライバルのクラブが見ているのは「2部に1季なら翌季に戻れる」ことで、9季破った規則に1季の罰では釣り合わないという見方が伝えられている。キャラガーは3年から5年と年数まで挙げた。ただ規則の一覧に降格という罰は無く、委員会ができるのは上限のない罰金と勝ち点の剥奪、除名を勧めることまでで、除名を決めるには総会で投票したクラブの4分の3以上の賛成が要る。プレミアリーグで勝ち点を引かれたのは1992年から4クラブ5回だけで、財務の規則での減点は3件で計12点。減点で降格が決まったのは1997年のミドルスブラの3点だけで、財務の2クラブはどちらも残った。シティの認定は件数で前例の38倍だが、件数を点数に置き換える式は無い。罰の審理の日程が出ないまま、5戦全勝のシティは10月11日にアンフィールドへ向かう
  opening_image: assets/images/20261007_finance_mancity/pair_carra/01.jpg
