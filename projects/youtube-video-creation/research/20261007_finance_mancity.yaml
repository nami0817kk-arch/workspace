  - text: 上限を500万ポンド超えるごとに、1点ずつ足す形です。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 2
  - text: 委員会は、式は規則の広い権限と合わないとして、採りませんでした。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 2
  - text: フォレストは1件で4点。17位で、18位とは6点の差で残りました。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 3
  - text: チェルシーは今年3月、選手や代理人への届け出ていない支払いを、
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 4
  - text: 自ら申し出ていました。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 4
  - text: 罰金は1075万ポンド。それまでの最高、550万ポンドの倍近い額です。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 4
  - text: それでも、勝ち点は引かれていません。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 4
  - text: 帳簿に正しく載せても、収支の規則は破っていなかった、とリーグは確かめています。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 4
  - text: 財務の規則での減点は、3件で合わせて12点。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 5
  - text: シティの認定は114件。数え方は違いますが、件数では38倍です。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 5
    emph: true
  - text: ただ、件数を勝ち点に置き換える式は、どこにもありません。
    card:
      type: table
      title: プレミアリーグで勝ち点を引かれた前例（自分で数えた）
      columns: [クラブ（季）, 理由, 勝ち点, その季]
      rows: *past
      highlight_row: 5
  - text: 罰が決まらないまま、5戦全勝で首位のシティは、
    card: none
  - text: 10月11日、敵地アンフィールドでリヴァプールと戦います。
    card: none
