  say:
  - text: アノエタの前の本拠地は、アトーチャ。開いたのは1913年10月です。
    image: assets/images/20261113_stadium_realsociedad/07_w.jpg
    card:
      <<: *id_hist
      highlight_row: 0
  - text: 最初の試合は、アスレティック・ビルバオと3対3の引き分けでした。
    image: assets/images/20261113_stadium_realsociedad/07_w.jpg
    card: none
  - text: リーグ優勝を2回、1981年と82年に果たしたのも、アトーチャの時代です。
    emph: true
    image: assets/images/20261113_stadium_realsociedad/07_w.jpg
    card: none
  - text: 最後のリーグ戦は、1993年6月13日。テネリフェに3対1で勝ちました。
    image: assets/images/20261113_stadium_realsociedad/08_w.jpg
    card:
      <<: *id_hist
      highlight_row: 1
  - text: 次に移ったのが、市が建てたアノエタです。
    image: assets/images/20261113_stadium_realsociedad/08_w.jpg
    card: none
  - text: 開場は1993年7月29日。最初は陸上の大会でした。
    image: assets/images/20261113_stadium_realsociedad/08_w.jpg
    card:
      <<: *id_hist
      highlight_row: 2
  - text: 開場の日、アトーチャの芝の一片が、ピッチの真ん中に置かれました。
    image: assets/images/20261113_stadium_realsociedad/08_w.jpg
    card: none
  - text: サッカーの最初の試合は、8月13日。レアル・マドリードとの親善試合です。
    image: assets/images/20261113_stadium_realsociedad/03_w.jpg
    card:
      <<: *id_hist
      highlight_row: 3
  - text: 結果は、2対2の引き分けでした。
    image: assets/images/20261113_stadium_realsociedad/03_w.jpg
    card: none
  - text: 最初のゴールを決めたのは、ロレンです。
    image: assets/images/20261113_stadium_realsociedad/03_w.jpg
    card: none
  - text: 陸上競技場なので、ピッチのまわりはトラックが囲んでいました。
    emph: true
    image: assets/images/20261113_stadium_realsociedad/03_w.jpg
    card: none
  - text: そのぶん客席がピッチから遠く、ファンには不評でした。
    image: assets/images/20261113_stadium_realsociedad/03_w.jpg
    card: none
  - text: 2004年には、トラックを外して4万2000席にする案が出ました。
    image: assets/images/20261113_stadium_realsociedad/02_w.jpg
    card: none
  - text: でも、市が受け入れませんでした。
    image: assets/images/20261113_stadium_realsociedad/02_w.jpg
    card: none
