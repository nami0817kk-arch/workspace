# スタジアム紹介シリーズ：レアル・ソシエダの本拠地（アノエタ、11/13 予定）。雛形は 11/11 バレンシアの回。
# 題材の選び方（2026-11-11）：指示書 20261112 の「ラ・リーガの続き」。済み＝アトレティコ・バルサ・レアル・ビルバオ・バレンシア。次の候補はセビージャ・ベティス・ソシエダ・ビジャレアル。
#   ソシエダを選んだ理由：久保建英の所属クラブ（日本との縁）／「陸上競技場から変わった器」という強い一点／今季の夏に増設工事をした直後で数字が新しい。外した候補＝セビージャ（サンチェス・ピスフアン。次の回に回せる）。
#   重なりの確認：scripts/*stadium_* にアノエタ・ソシエダは無し。ll01_realsociedad（9/26）は「本拠地はアノエタ、4万人」の1行だけ触れる。直近30日の本はニュース（11/6 中村敬斗のリヨン対ソシエダの EL 戦など）のみ。
#   picks（research/20261112_picks.txt）：同じ 11/13 のユニフォームはアスレティック・ビルバオ。重ならない。
# 今季のラ・リーガ所属（一次情報）：ESPN esp.1 の teams 一覧に Real Sociedad（id 89）、2026-27 の日程にホーム6試合（会場 Reale Arena＝ESPN の表記）。
# アノエタ（ウィキペディア en・es）：
#   1991 着工／1993-07-29 開場（欧州ジュニア陸上選手権。es）／1993-08-13 初のサッカー＝ソシエダ対レアル・マドリード 2対2、最初のゴールはロレン（en・es）。持ち主は市（en・es）。
#   最初の建設費 30億ペセタ（約2100万ユーロ。en）。開場時の収容3万2000（en）。開場の日にアトーチャの芝の一片をピッチの真ん中に置いた（es）。
#   前の本拠地：オンダレータ 1909〜13、アトーチャ 1913〜93（en）。アトーチャ 1913-10-04 開場 3対3 アスレティック、最後のリーグ戦 1993-06-13 テネリフェに3対1（es）。1981・82 のリーグ優勝はアトーチャの時代（es の概要欄）。
#   トラック：陸上のトラックがあって客席とピッチの間が遠く、ファンに不評（en）。2004 トラックを外して4万2000席にする案（アスティアサラン）を市が却下（en）。
#   2017-05 工事開始（en）。設計 イサスクン・ラルサバル（en）。費用 4700万ユーロ＝クラブ3300万・バスク自治州政府1000万・ギプスコア県400万（en）。
#   2018-09-15 第4節バルセロナ戦で第1期の区画が完成（en）。2019-09-14 アトレティコ戦 2対0、入場3万3374（en）。5か月後のアスレティックとのダービー 2対1、3万6730＝記録（en。注の題は3万6370で一致しないので、台本は3万6730）。
#   名前：2019〜2025 は保険会社の名前（LaLiga 公式の記事・es の概要欄）。2025年7月にアノエタへ戻る（LaLiga の記事）。
#   2013-14、改築中のサン・マメスの代わりにアスレティックが開幕のホーム戦をここで（en）。入場の最多はラグビー、2023-06-10 のトップ14準決勝ボルドー・ベグル対ラ・ロシェルで 3万9314（en）。
#   女子の欧州CL決勝（2020）も en・es に載るが、決まりで扱わない。コンサートの名前の列挙も言わない。
# 拡張工事（El Gol Digital 2026-05-09、Onda Vasca 2024-12-30、StadiumDB 2026-07-16）：
#   約2000席増（上の段。四隅 約1000・メインスタンド上 580・東スタンド上 430）。費用 約1000万ユーロ（Onda Vasca 1060万、StadiumDB 約1000万）。2026-05 着工、夏に完成の予定（StadiumDB「8月末〜9月初め」）。席の総数は 4万2247（El Gol Digital・Onda Vasca）と 4万2427（StadiumDB）で割れる→台本は 4万2247 を使い「約」を付ける。完成したかは確かめられなかったので、台本は「足す」と書き、完成とは言わない。
#   今季の最初の2節はアウェー（クラブが LaLiga に要請。重機と芝の張り替え。El Gol Digital）。ESPN の日程でも 8/21 ベティス・8/26 レアル・マドリードが遠征、8/29 が最初のホーム。
#   FIFAの条件は4万席以上（StadiumDB）。2030年W杯の開催は未定（同）。
# 見立て：
#   2025-26 のアノエタの占有率 78.1%（収容 3万9313 に対して）、ラ・リーガ15番目。サン・マメス 89.4%（3位）。El Gol Digital 2026-05-28。コパ・デル・レイ 2026-04-18、ラ・カルトゥハでアトレティコに 2対2→PK 4対3（複数の報道が一致）。
#   今季アノエタの入場（ESPN の試合記録。11/8 ラージョ戦は記録0なので使わない）：8/29 エスパニョール3万1884・9/3 セルタ3万364・9/13 アトレティコ3万1834・10/11 デポルティーボ3万3644・10/25 レバンテ3万35。合計15万7761・平均3万1552。
#   3万1552 ÷ 3万9313 ＝ 80.3％。4万2247 ÷ 3万1552 ＝ 1.34倍（自分で計算）。最多 3万6730 との差は 4万2247−3万6730＝5517。4700÷2100＝2.2倍（自分で計算）。
# 日本との接点（サッカーの縁）：久保建英はソシエダの選手（ESPN の名簿に在籍）。11/8 ラージョ戦（1対0で勝ち）に先発（ESPN の先発表 event=401882810）。
# 言わなかったもの：女子の決勝・コンサート／4万席に届かなかった理由の推測／ピッチの縦横（en 105x68、es 105x70 で割れる）／2030年W杯でスポンサー名が変わる話。
# 写真：assets/images/20261113_stadium_realsociedad/（credits.json）。Commons（すべて CC BY-SA 4.0）。01〜02 夜の内観、03 2018年5月の内観（トラックが見える）、04〜08 外観。
