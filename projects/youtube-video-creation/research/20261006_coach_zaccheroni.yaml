sections:
- id: final
  main: true
  heading: 延長後半4分、李忠成のボレー
  tier: 報道
  telop: 「勇気を持ってやった」。アジアカップ決勝で切った交代のカード
  narrator: キャスター
  say:
  - text: 2011年、就任5か月のザッケローニ監督がアジアの決勝で下した決断です。
    short_only: true
    image: assets/images/20261006_coach_zaccheroni/11_w.jpg
  - text: アジアカップ決勝の延長戦。途中から送り出した李忠成が、ボレーで決勝点。
    image: assets/images/20261006_coach_zaccheroni/11_w.jpg
    card: none
  - text: そこでリスクを負ってでも、そのカードを切った。
    voice: ザッケローニ監督
    card: none
  - text: チームのコンセプトである勇気を持ってやった。
    voice: ザッケローニ監督
    cont: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?79967-79967-fl
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?79959-72010-fl
  - https://web.gekisaka.jp/news/japan/detail/?79967-79967-fl
