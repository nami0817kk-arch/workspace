  - text: コンフェデレーションズ、W杯では
    voice: ザッケローニ監督
    card: none
  - text: 間違ったアプローチを取ってしまった。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: もし何かを変える必要があったとしたら、
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 戦術面ではなく、精神面を変えるべきだった。
    voice: ザッケローニ監督
    cont: true
    card: none
  quotes_from:
  - スポーツナビ http://brazil2014.yahoo.co.jp/column/detail/201406250002-spnavi
  sources:
  - https://www.jfa.jp/samuraiblue/schedule_result/2014.html
  - http://brazil2014.yahoo.co.jp/column/detail/201406250002-spnavi
