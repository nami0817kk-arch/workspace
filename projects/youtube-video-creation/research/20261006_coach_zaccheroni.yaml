  say:
  - text: 初陣は2010年10月のアルゼンチン戦。それまで6戦全敗の相手に1対0で勝利。
    image: assets/images/20261006_coach_zaccheroni/12_w.jpg
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: 就任から16試合負けなし。初めての黒星は、17試合目の敵地の北朝鮮戦でした。
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 2
  - text: 2012年10月の敵地フランス戦は、後半43分の香川真司の一撃で初勝利。
    emph: true
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: 試合後、指揮官はこの遠征を組んだ理由を明かしています。
    card: none
  - text: これまでほとんどの戦いがアジアだったので、
    voice: ザッケローニ監督
    card: none
  - text: 今回のように世界の強豪と戦うことで
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 自分たちがどこにいるのかを確認したかった。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 2013年6月のオーストラリア戦は、終了間際に本田圭佑がPKを決めてドロー。
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 4
  - text: これでW杯出場が決まり、開催国を除けば世界でいちばん早い切符でした。
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 4
  - text: ところが同じ月、大陸王者が集うコンフェデ杯では、
    card:
      type: table
      title: 日本代表での主な試合（2010〜2013）
      columns: *id007
      rows: *id008
      highlight_row: 5
  - text: ブラジル、イタリア、メキシコに3連敗を喫します。
    card:
