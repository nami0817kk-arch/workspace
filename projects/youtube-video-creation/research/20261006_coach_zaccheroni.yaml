  title: ザッケローニがアジア杯決勝で切ったカード。ザックジャパンの勝率が落ちた年
  question: アジアカップを制したザッケローニの日本代表は、4年間のどこで勝てなくなり、W杯で何が足りなかったのか
  takeaway: JFA の記録から数えた55試合（PK戦は引き分け）は30勝12分け13敗、勝率54.5%。アジアカップまでの8試合は負けなしの62.5%、2011〜12年も61.9%と高いまま、落ちたのは2013年（19試合8勝8敗、42.1%）で、W杯までの11敗のうち8敗がこの1年に集まる。W杯前の4試合は全勝で立て直したが、本大会は0勝1分け2敗。同じ数え方の森保一（68.5%）とは14ポイント差
