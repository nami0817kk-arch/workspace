- id: italy
  heading: ミランで就任1年目のスクデット
  tier: 報道
  telop: 最後の7試合に7連勝。首位ラツィオを抜いてセリエA優勝
  narrator: 解説
  card:
    type: table
    title: イタリアで率いた主なクラブ
    columns: &id005
    - クラブ
    - 時期
    - 成績
    rows: &id006
    - - ウディネーゼ
      - 1995〜98
