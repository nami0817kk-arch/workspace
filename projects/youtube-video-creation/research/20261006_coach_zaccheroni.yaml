- id: farewell
  heading: 「責任はすべて私にある」
  tier: 報道
  telop: 敗退の翌日、総括の会見で退任を表明
  narrator: キャスター
  say:
  - text: 敗退の翌日、総括の会見で、ザッケローニ監督は自ら口を開きました。
    image: assets/images/20261006_coach_zaccheroni/14_w.jpg
    card: none
  - text: 今回のメンバーは私が選び、
    voice: ザッケローニ監督
    card: none
  - text: 戦い方も戦術も私が決めた。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 責任はすべて私にある。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 私は日本代表を離れなければならないと思っている。
    voice: ザッケローニ監督
    card: none
  - text: スタッフやサポーターへの感謝を並べたあと、こう続けます。
    card: none
  - text: この4年間、何不自由なく仕事に集中させていただいた。
    voice: ザッケローニ監督
    card: none
  - text: 濃密な時間を過ごすことができた。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 充実感と、感動にあふれる4年間だったと感じている。
    voice: ザッケローニ監督
    cont: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?141985-141985-fl
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?141985-141985-fl
- id: view
  viewpoint: true
  heading: 時期で分けたザックジャパンの勝率
  tier: 背景
  telop: アジアカップまで62.5%、2013年は42.1%。森保一の通算とは14ポイント差
  narrator: 解説
  card:
    type: table
    title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
    columns: &id011
    - 時期
    - 試合
    - 勝ち・分け・負け
    - 勝率
    rows: &id012
    - - アジアカップまで
      - '8'
      - 5・3・0
      - 62.5%
    - - その後〜W杯の前
      - '44'
      - 25・8・11
      - 56.8%
    - - W杯本大会
      - '3'
      - 0・1・2
      - 0%
    - - 通算
      - '55'
      - 30・12・13
      - 54.5%
    - - 森保一の通算（同じ数え方）
      - '111'
      - 76・17・18
      - 68.5%
  say:
  - text: 55試合を、アジアカップまで・その後・W杯本大会の3つに分けて数えてみます。
    image: assets/images/20261006_coach_zaccheroni/14_w.jpg
    card:
      type: table
      title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: PK戦を引き分けとすると、アジアカップまでの8試合は負けなしで、勝率62.5%。
    card:
      type: table
      title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: その後、W杯の直前までの44試合は25勝。勝率は56.8%に下がります。
    card:
      type: table
      title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 1
  - text: 年で分けると、2011年から12年は21試合で13勝。61.9%と高いままです。
    card:
      type: table
      title: 「その後」を年で分けると（同じ数え方）
      columns: &id013
      - 時期
      - 試合
      - 勝ち・分け・負け
      - 勝率
      rows: &id014
      - - 2011年6月〜12年
        - '21'
        - 13・5・3
        - 61.9%
      - - 2013年
        - '19'
        - 8・3・8
        - 42.1%
      - - 2014年（W杯の前）
        - '4'
        - 4・0・0
        - 100%
      highlight_row: 0
  - text: 落ちたのは2013年。19試合で8勝8敗、勝率は42.1%でした。
    emph: true
    card:
      type: table
      title: 「その後」を年で分けると（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 1
  - text: コンフェデ杯の3敗に、秋の東欧遠征での2敗。
    card:
      type: table
      title: 「その後」を年で分けると（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 1
  - text: W杯までの負け11のうち、8つがこの1年に集まっています。
    card:
      type: table
      title: 「その後」を年で分けると（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 1
  - text: 年が明けた2014年は、W杯前の4試合に全勝。立て直して本番へ向かいました。
    card:
      type: table
      title: 「その後」を年で分けると（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 2
  - text: それでも本大会の3試合は0勝。通算は30勝12分け13敗、勝率54.5%です。
    card:
      type: table
      title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 3
  - text: 同じ数え方で、森保一は111試合で76勝。勝率で14ポイント上回ります。
    card:
      type: table
      title: 時期ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 退任の会見では、4年前の約束にも触れていました。
    card: none
  - text: 4年前の就任会見で『4年後、日本サッカー界に何かを残したい、
    voice: ザッケローニ監督
    card: none
  - text: 少しでも遺産を置いていきたい』と言った。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: その意味で何かを残せたという自負はある。
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 2024年、ザッケローニは日本サッカー殿堂に名を連ねています。
    card: none
  quotes_from:
