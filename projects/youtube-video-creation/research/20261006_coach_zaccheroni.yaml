      - シーズン途中で退任
    - - ユヴェントス
      - '2010'
      - 7位（4か月の契約）
  say:
  - text: 名を上げたのは、1997〜98年。ウディネーゼをリーグ3位へ導きます。
    image: assets/images/20261006_coach_zaccheroni/12_v.jpg
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: その手腕を買われて移ったミランで、いきなり頂点に立ちます。
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 1
  - text: 1998〜99年のシーズン、ミランは最後の7試合に7連勝。
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 1
  - text: 首位のラツィオを抜き去り、就任1年目でセリエAを制しました。
    emph: true
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 1
  - text: その後はラツィオやインテルを、シーズンの途中から任されます。
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 3
  - text: 2010年のユヴェントスも、4か月だけの契約で7位でした。
    card:
      type: table
      title: イタリアで率いた主なクラブ
      columns: *id005
      rows: *id006
      highlight_row: 5
  - text: その年の8月、日本代表の新監督に決まります。就任会見で語った理由です。
    image: assets/images/20261006_coach_zaccheroni/10_w.jpg
    card: none
  - text: セリエAは一番激しいリーグで優勝も遂げたが、
    voice: ザッケローニ監督
    card: none
  - text: さらに大きな挑戦を経験するには
    voice: ザッケローニ監督
    cont: true
    card: none
  - text: 代表監督の仕事をしたかった。
    voice: ザッケローニ監督
    cont: true
    card: none
  quotes_from:
  - サンケイスポーツ http://www.sanspo.com/soccer/news/100831/scc1008311420004-n1.htm
  sources:
  - https://en.wikipedia.org/wiki/Alberto_Zaccheroni
  - https://ja.wikipedia.org/wiki/%E3%82%A2%E3%83%AB%E3%83%99%E3%83%AB%E3%83%88%E3%83%BB%E3%82%B6%E3%83%83%E3%82%B1%E3%83%AD%E3%83%BC%E3%83%8B
  - http://www.sanspo.com/soccer/news/100831/scc1008311420004-n1.htm
