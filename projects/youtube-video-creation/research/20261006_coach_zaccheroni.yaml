  heading: 就任5か月でアジアの頂点へ
  tier: 確定
  official: true
  telop: 2試合続けて延長の末に優勝。アジア制覇は史上最多の4度目
  narrator: 解説
  say:
  - text: 交代は延長前半8分。決勝点は延長後半4分、長友佑都の左からのクロスでした。
    card: none
  - text: 決勝の舞台は、ドーハのハリファ国際スタジアム。そこまでの道も平坦ではありません。
    image: assets/images/20261006_coach_zaccheroni/20.jpg
    card:
      type: table
      title: アジアカップ2011の6試合
      columns: *id001
      rows: *id002
      highlight_row: 5
  - text: 大会の初戦は、ヨルダンと1対1の引き分けでした。
    card:
      type: table
      title: アジアカップ2011の6試合
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 準々決勝でカタールに3対2で勝ち、準決勝の韓国戦はPK戦の末に突破します。
    card:
      type: table
      title: アジアカップ2011の6試合
      columns: *id001
      rows: *id002
      highlight_row: 4
  - text: 決勝も0対0のまま延長へ。2試合続けて120分の戦いでした。
    card:
      type: table
      title: アジアカップ2011の6試合
      columns: *id001
      rows: *id002
      highlight_row: 5
  - text: 2大会ぶりの優勝で、日本のアジア制覇は史上最多の4度目です。
    emph: true
    card:
      type: table
      title: アジアカップ2011の6試合
      columns: *id001
      rows: *id002
      highlight_row: 5
  - text: それでも一夜明けた指揮官は、浮かれていませんでした。
    image: assets/images/20261006_coach_zaccheroni/10_w.jpg
    card: none
  - text: アジア杯優勝は我々にとって
    voice: ザッケローニ監督
    card: none
  - text: スタート地点に過ぎない。
    voice: ザッケローニ監督
    cont: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?79967-79967-fl
  sources:
