# 監督の経歴：アルベルト・ザッケローニ（10/6）。2010年8月〜2014年6月の日本代表監督。シリーズ「監督の経歴」。
# 日本代表の55試合は JFA の各年の「試合日程・結果」（2010〜2014）から自分で数えた（raw の1節に全行）。PK戦は引き分け、
#   2011-03-29 のチャリティーマッチ（対Jリーグ選抜）は国際試合ではないので数えない。Wikipedia（日英）の 55試合30勝12分13敗と一致。
#   時期ごとの勝率・年ごとの勝率も同じ数え方で足した。森保一の 68.5% は 10/6 の回（research/20261006_coach_moriyasu.yaml）の数字。
# イタリアの経歴は日本語版・英語版 Wikipedia。就任会見の言葉はサンケイスポーツ（2010-08-31、Wayback の控え）。
# アジアカップ・フランス戦・初陣・初黒星・退任会見はゲキサカ。コロンビア戦後の言葉はスポーツナビ（2014-06-25、Wayback の控え）。
# 冒頭は山場（アジアカップ決勝の李忠成と交代の言葉）から。基礎DATAは3節目に置いて4項目だけ読む（10/6 の決まり）。
# 同じ日のハリルホジッチの回とは重ねない（触れない）。ネットの反応は入れていない（シリーズの回）。
# 写真: 日本代表の時期はゲキサカの当時の記事の写真（©Koki NAGAHAMA / ©Kaoru WATANABE、一部 /JMPA の表記。代理店の表記・透かしは無し）。
#   10・11 2011年1月アジア杯優勝の翌日（?79967・?79962）、12 2012年10月フランス戦前日会見（?106068）、13 2014年6月W杯コロンビア戦（?141840）、
#   14 2014年6月退任会見（?141985）。08 は Commons の1988〜90年ごろ（Public domain）の01の上に同じ色の余白を足したもの。イタリア時代の節だけ。
#   ゲキサカの ?106110・?142097 は ©Getty Images なので使っていない。サムネは thumb_13.jpg（13 に自作の時期ごとの勝率の表、サムネ専用）。20 は決勝の会場ハリファ国際スタジアム（Commons、2009年、CC BY 2.0）でアジア杯の表の行だけ。
