sections:
  - id: injury
    heading: ウルグアイ戦で左足首
    tier: 報道
    telop: 前半15分ごろに左足首を痛め、後半の途中で交代
    narrator: キャスター
    card:
      type: table
      title: 板倉滉の3日間
      columns: [日, 出来事]
      rows:
        - [9月24日 前半15分ごろ, 競り合いのあと左足首を痛める]
        - [9月24日 後半の途中, 鈴木淳之介と交代]
        - [9月26日, 広島での練習を欠席]
    say:
      - 9月24日のウルグアイ戦。板倉滉は3バックの真ん中で先発しました。
      - 前半15分ごろ、相手のフォワードと競り合ったあとに、左足首を痛めます。
      - プレーは続けましたが、後半の途中で鈴木淳之介と交代。ベンチで足首を冷やしていました。
      - そして26日。広島での練習に、板倉の姿はありませんでした。
      - 代表の広報担当者は、こう説明しています。
      - voice: 代表の広報担当
        text: ウルグアイ戦で左足首を痛めて、ホテルで治療と別メニューで調整しています
      - ベネズエラ戦に出るかどうかは、様子を見て決めるとされています。
    sources:
      - https://www.nikkansports.com/soccer/japan/news/202609260001211.html
      - https://www.football-zone.net/archives/675617
      - https://www.football-zone.net/archives/675626
