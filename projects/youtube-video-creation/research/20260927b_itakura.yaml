  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「センターバック追加招集しないんか」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 結構怖い感じだな足首 大丈夫か板倉
      - voice: ネット民
        text: 板倉滉まで、けがかよ……
      - voice: ネット民
        text: DF陣大丈夫か…
      - voice: ネット民
        text: 日本のCBはここ数年ずっと誰かが常に怪我し続けてる。
      - voice: ネット民
        text: 安藤板倉冨安不在なのやばすぎやん、、 CB追加招集するべきでしょうよ、、、
      - voice: ネット民
        text: センターバック追加招集しないんか
      - voice: ネット民
        text: 冨安さんの分の追加招集ないし、板倉さん欠けたら4人になるのきつすぎる。中野さん使うのかな？
      - voice: ネット民
        text: 板倉滉練習欠席…DF陣離脱痛い。短いスパンで瀬古歩夢と伊藤洋輝酷使しないといけないのも痛い。
      - voice: ネット民
        text: J若手の注目株で、稲村隼翔とか呼ばない？あと、経験枠で荒木隼人は？広島にいるでしょ！
        cont: true
      - voice: ネット民
        text: 冨安、安藤に続いて板倉も…。
      - voice: ネット民
        text: フル出場した瀬古、伊藤を休ませるとなると・・・鈴木淳、渡辺剛、中野のスタメンで3バックか。
        cont: true
      - voice: ネット民
        text: ４バックも試したかっただろうが、DFの離脱が続くと苦しいな。
        cont: true
      - voice: ネット民
        text: 松木とかクラブで緊急サイドバックを務めたこともあるらしいけど。
        cont: true
      - voice: ネット民
        text: クラブでの起用を考えたら親善試合ですし無理はさせれませんですね。
        short_voice: true
      - voice: ネット民
        text: 中野選手は地元で巡ってきたチャンスですし是非とも観たいです。
        cont: true
        short_voice: true
