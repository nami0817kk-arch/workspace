  - id: three
    heading: センターバックが3人
    tier: 報道
    telop: 冨安健洋、安藤智哉、そして板倉滉
    narrator: キャスター
    say:
      - 今回の日本代表は、センターバックが次々に欠けています。
      - text: まず冨安健洋。クラブでふくらはぎを痛め、合流する前に不参加が決まりました。
        card: {type: table, title: 欠けたセンターバック, columns: [所属, 名前, 位置, 年齢], rows: [[クリスタル・パレス, 冨安健洋, DF, 27歳]]}
      - text: 次に安藤智哉。腰痛で千葉に残り、広島には来ていません。
        card: {type: table, title: 欠けたセンターバック, columns: [所属, 名前, 位置, 年齢], rows: [[クリスタル・パレス, 冨安健洋, DF, 27歳], [ザンクトパウリ, 安藤智哉, DF, 27歳]]}
      - text: そして板倉滉。これで3人目です。
        card: {type: table, title: 欠けたセンターバック, columns: [所属, 名前, 位置, 年齢], rows: [[クリスタル・パレス, 冨安健洋, DF, 27歳], [ザンクトパウリ, 安藤智哉, DF, 27歳], [ボルシアMG, 板倉滉, DF, 29歳]]}
      - 27日の昼の時点で、代わりの選手の追加招集は発表されていません。
    sources:
      - https://www.jfa.jp/samuraiblue/news/00036782/
      - https://hochi.news/articles/20260926-OHT1T51274.html
      - https://news.yahoo.co.jp/articles/90625fc779eb3cec69ca5eac26b50b9465fe3eba
      - https://news.yahoo.co.jp/articles/3c174009037de4bd6e2c323e6b42fe2d322e97fd
      - https://news.yahoo.co.jp/articles/7751f494d8371c33f9136b37796409d49e959adc
  - id: fill
    main: true
    heading: 穴を埋めるのは
    tier: 報道
    telop: 渡辺剛、鈴木淳之介、そして初招集の中野就斗
    narrator: キャスター
    say:
      - text: センターバックの離脱が続く日本代表。板倉滉まで欠け、空いた3バックに誰が入るのか。
        short_only: true
      - text: ベネズエラ戦で先発が有力な鈴木淳之介は、こう話します。
        image: assets/images/20260927b_pair_suzuki_itakura/01.jpg
      - voice: 鈴木淳之介
        text: どうにか食らいつくというところは終わったと思っていて
      - voice: 鈴木淳之介
        text: ワールドカップにも出たし、一度ああいうのを経験したので、どんどん良さを出していければ
      - voice: 鈴木淳之介
        text: 後ろからの押し上げ、リスク管理はもう一回徹底するようにミーティングでも言われている
      - voice: 鈴木淳之介
        text: 求められていることをしっかりやれれば。もし次の試合に出ることがあれば、そういうところを発揮したい
      - フル出場した瀬古歩夢と伊藤洋輝を休ませるなら、3バックは大きく入れ替わります。
      - text: その候補が、ウルグアイ戦で出番の無かった渡辺剛です。
        card: {type: table, title: 3バックの候補, columns: [所属, 名前, 位置, 年齢], rows: [[コペンハーゲン, 鈴木淳之介, DF, 23歳], [フェイエノールト, 渡辺剛, DF, 29歳]]}
      - text: さらに、初めて呼ばれた中野就斗にも出番が回りそうです。
        card: {type: table, title: 3バックの候補, columns: [所属, 名前, 位置, 年齢], rows: [[コペンハーゲン, 鈴木淳之介, DF, 23歳], [フェイエノールト, 渡辺剛, DF, 29歳], [サンフレッチェ広島, 中野就斗, MF/FW, 26歳]]}
      - 中野の所属は広島。地元のスタジアムで、代表デビューとなるかもしれません。
    sources:
      - https://news.yahoo.co.jp/articles/7751f494d8371c33f9136b37796409d49e959adc
      - https://web.gekisaka.jp/news/japan/detail/?459808-459808-fl
