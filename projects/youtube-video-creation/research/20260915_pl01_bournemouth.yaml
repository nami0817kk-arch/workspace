# プレミアリーグ20クラブ紹介 ①AFCボーンマス（2026-09-15）
#
# **20クラブを1本にまとめる特例動画の、1クラブぶんの見本。**
# 型（尺・語り口・画面の出方）を見てもらうために、まず1クラブだけ作る。
# 20クラブ書いてから「型が違う」となると全部やり直しになる。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで → 20クラブで50分前後
#
# **見せ方を変えた**（2026-09-18 ユーザー指示「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。
#   ・節の頭を**そのクラブでいちばん面白いところ**にする。
#     「アルファベット順では◯番目」で始める形は20本中17本で同じだった
#   ・**獲ったものだけを言う。**「1部優勝ゼロ、FAカップゼロ…」と
#     並べていたが、獲っていないものを数え上げても誰も見ない
#
# 事実はすべて英語版 Wikipedia の本文から。**推測で埋めない。**
# 収容人数・創設年・勝ち点は、記事の表記のまま。
