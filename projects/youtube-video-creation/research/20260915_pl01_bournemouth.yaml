        - ["昨季の得点王", "クルピ13点。足の手術で離脱中"]
        - ["日本人選手", "なし"]
    say:
      - 監督はマルコ・ローゼです。
      - 主将はアダム・スミス。ディフェンダーで、イングランド人です。
      - 2010年にレンタルで来て、2014年に完全移籍。**16年このクラブにいます。**
      - 腕章を巻いたのは2024年9月からです。
      - エースは、いまマーカス・タヴァニー。今季リーグ3点でチーム最多です。
      - ただし本来の点取り屋は別にいます。エリ・ジュニオール・クルピ。
      - "**昨季13点**を挙げましたが、今年7月に足の手術を受けて離脱しています。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 破産寸前から、初の欧州へ
    narrator: 解説
    card:
      type: table
      title: ボーンマスの18年
      columns: ["", ""]
      rows:
        - ["2008年", "経営破綻。勝ち点17剥奪"]
        - ["2015年", "クラブ史上初の1部昇格"]
        - ["2026年", "クラブ史上初の欧州出場"]
    say:
      - このクラブの物語は、消えかけたところから始まります。
      - 2008年から2009年にかけて、ボーンマスは経営破綻に追い込まれました。
      - さらに、リーグの倒産規定に従わなかったとして、勝ち点17を差し引かれました。
      - ここで監督を引き受けたのが、エディ・ハウです。
      - 31歳。フットボールリーグで最も若い監督でした。しかも最初は暫定の立場です。
      - そこからボーンマスは落ちませんでした。
      - 6年後の2015年、チャンピオンシップを制して、クラブ史上はじめてイングランドの1部に上がります。
      - そして昨季、2025年から2026年のシーズン。
      - リーグ6位、勝ち点57。クラブ史上はじめて、ヨーロッパの舞台への出場権をつかみます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
