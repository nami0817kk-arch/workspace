  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1899年創設、愛称は「チェリーズ」
    narrator: キャスター
    card:
      type: table
      title: AFCボーンマス
      columns: ["", ""]
      rows:
        - ["創設", "1899年"]
        - ["愛称", "The Cherries（チェリーズ）"]
        - ["本拠地", "ディーン・コート"]
        - ["収容人数", "12,357人"]
    say:
      - "名前の頭に付いている**A**には、理由があります。"
      - イングランドのクラブを並べたとき、**いちばん前に来るため**です。
      - 1971年から72年のシーズンに、この名前になりました。
      - アスレティック・フットボールクラブの頭文字を残したまま、**順番を手に入れた**形です。
      - この動画がボーンマスから始まっているのも、55年前のその判断のためです。
      - 創設は1899年の秋。最初の名前は「ボスコム・フットボールクラブ」でした。
      - イングランド南部、海沿いの保養地のクラブです。
      - 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
      - 由来は2つ伝わっています。さくらんぼのような赤い縞のユニフォームから、という説。
      - もうひとつは、スタジアムの隣の地所に、さくらんぼの木が多かったから。
      - "**クラブ自身は、後者を「やや説得力に欠ける」としています。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
