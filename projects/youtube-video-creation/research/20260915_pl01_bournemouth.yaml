sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1899年創設、愛称は「チェリーズ」
    narrator: キャスター
    card:
      type: table
      title: AFCボーンマス
      columns: ["", ""]
      rows:
        - ["創設", "1899年"]
        - ["愛称", "The Cherries（チェリーズ）"]
        - ["本拠地", "ディーン・コート"]
        - ["収容人数", "12,357人"]
    say:
      - アルファベット順の1番目は、AFCボーンマスです。
      - イングランド南部、海沿いの保養地ボーンマスのクラブです。
      - 創設は1899年の秋。ただし、このときの名前は「ボスコム・フットボールクラブ」でした。
      - 1923年に「ボーンマス・アンド・ボスコム・アスレティック」へ。
      - そしていまの「AFCボーンマス」になったのは、1971年から72年のシーズンです。
      - このAFCには、理由があります。
      - 頭にAを付ければ、イングランドのクラブを並べたときに、いちばん前に来る。
      - アスレティック・フットボールクラブの頭文字を残したまま、順番を手に入れた形です。
      - この動画がボーンマスから始まっているのも、55年前のその判断のためです。
      - 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
      - 由来は2つ伝わっています。ひとつは、さくらんぼのような赤い縞のユニフォーム。
      - もうひとつは、ディーン・コートの隣にあったクーパー・ディーン家の地所に、さくらんぼの木が多かったから。
      - クラブ自身は、後者のほうは「こちらはやや説得力に欠ける」としています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth

