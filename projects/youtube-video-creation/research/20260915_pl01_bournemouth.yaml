  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はマルコ・ローゼ。日本人選手はいません
    narrator: キャスター
    card:
      type: table
      title: 今季のボーンマス
      columns: ["", ""]
      rows:
        - ["監督", "マルコ・ローゼ（3年契約）"]
        - ["主将", "アダム・スミス"]
        - ["得点源", "タヴァニー / クリスティ（各3点）"]
        - ["日本人選手", "なし"]
    say:
      - 今季の監督は、マルコ・ローゼです。
      - 前任はアンドニ・イラオラ。退任が発表され、その後任として3年契約で就任しました。
      - そのイラオラは、いまリヴァプールを率いています。
      - 主将はアダム・スミス。1991年生まれのイングランド人ディフェンダーです。
      - 今夏の補強は3人。いずれも安くありません。
      - エルチェからアルバロ・ロドリゲス、2570万ポンド。
      - ベンフィカからアントニオ・シウバ、同じく2570万ポンド。
      - セビージャからフアンル・サンチェス、1120万ポンド。
      - 出ていったほうも動きました。ハメド・トラオレがマルセイユへ、エネス・ウナルがヘタフェへ。
      - マルコス・セネシは、6月末で契約を終えてトッテナムに加わっています。
      - ここまでの得点は、マーカス・タヴァニーとライアン・クリスティがそれぞれ3。
      - そして、日本人選手はいません。
      - 今季のボーンマスの登録名簿に、日本のパスポートを持つ選手は入っていません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_AFC_Bournemouth_season

  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 破産寸前から、初の欧州へ
    narrator: 解説
    card:
      type: table
      title: ボーンマスの18年
      columns: ["", ""]
      rows:
        - ["2008年", "経営破綻。勝ち点17剥奪"]
        - ["2015年", "クラブ史上初の1部昇格"]
        - ["2026年", "クラブ史上初の欧州出場"]
    say:
      - このクラブの物語は、消えかけたところから始まります。
      - 2008年から2009年にかけて、ボーンマスは経営破綻に追い込まれました。
      - 負債はおよそ400万ポンド。クラブは消滅の瀬戸際に立たされます。
      - さらに、リーグの倒産規定に従わなかったとして、勝ち点17を差し引かれました。
      - 舞台は4部。減点を受けた時点で、最下位から10点も離されていました。
      - ここで監督を引き受けたのが、エディ・ハウです。
      - 31歳。フットボールリーグで最も若い監督でした。しかも最初は暫定の立場です。
      - そこからボーンマスは落ちませんでした。
      - 6年後の2015年、チャンピオンシップを制して、クラブ史上はじめてイングランドの1部に上がります。
      - 1899年の創設から、116年目のことでした。
      - そして昨季、2025年から2026年のシーズン。
      - リーグ6位、勝ち点57。クラブ史上はじめて、ヨーロッパの舞台への出場権をつかみます。
      - プレミアリーグでの勝ち点記録は、これで3シーズン続けて更新されました。
      - 古い話をひとつ。1971年11月のFAカップ、マーゲート戦です。
      - テッド・マクドゥーガルという選手が、この試合で9点を挙げました。
      - スコアは11対0。4部にいたクラブの、消えない記録です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
