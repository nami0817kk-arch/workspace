# 日本人選手 の取材メモ（2026年10月17日）
# 見せ方 B（高速切り替え）。縦写真を7枚切り替える。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・フットボールトライブ・ジャパン（10/16 11:26、題材の出典）… 全文読んだ。控え research/raw/20261017_tribe_mitoma.txt・.html
#   ・チームトーク（英語、"Mitoma's future plunged into doubt…" Exclusive）… 全文読んだ。控え research/raw/20261017_teamtalk_mitoma.txt。日付はページから取れなかった（記事は「来夏に契約が切れる」「負傷は昨5月」と書く）。
#   ・トランスファーフィード（元の報道）… サイトは開けたが、三笘の記事のURLが取れず原文は未読。→ 年俸・関心は「トランスファーフィードの報道を転載記事が伝えた」形でしか言えない。
# 確度: 未確認。関心・年俸は転載記事1本が伝える報道で、クラブ（ブライトン・リバプール・トッテナム・チェルシー）の確認や発表は記事に無い。確定とは言わない。
# 出典の中身（そのまま。転載記事＝フットボールトライブの文）:
#   ・「三笘とブライトンの契約期間は2027年6月までであるが、現時点で契約延長の公式発表はなし。」（チームトーク側の記事も 2027年6月30日まで）
#   ・英メディア『チームトーク』は10月はじめに「契約延長交渉にも進展の兆しがほとんどない」などと伝えた。
#   ・海外メディア『トランスファーフィード』は15日、「三笘薫の現在の年俸は480万ユーロ（約8億5000万円）」と契約内容の一部を明かした上で、「リバプール、トッテナム・ホットスパー、チェルシーなどが、三笘の獲得に興味を示している」と報道。
#   ・『チームトーク』もリバプール、トッテナムからの関心を報じていた。チェルシーは「新たに獲得レースに加わった可能性が考えられる」（フットボールトライブの推測の書き方）。
#   ・三笘は2026年5月のウルバーハンプトン戦で負傷。W杯の代表に招集されず、9・10月の代表戦も外れ、15日のカンファレンスリーグもベンチ外。
#   ・（使わない）記事内の「ブラジル戦への出場が微妙」は、9・10月の代表入りなしとの記述と食い違うので入れない。「三笙薫」の誤植あり。
#   ・（使わない）チームトーク側の週給約8万ポンドの数字。トランスファーフィードの数字と別物なので混ぜない。
# 本人の言葉: 無し（出典のどれにも三笘の発言なし）。入れない。ハーツラー監督の3月の発言（チームトーク）は題の出来事より前なので入れない。
# 見立ての数え: 関心が報じられたクラブは3つ（リバプール・トッテナム・チェルシー）。記事は、このうちリバプールとトッテナムを別のメディアも報じていたと伝える＝2つ。チェルシーと年俸480万ユーロは、記事が挙げる元は今回の1件だけ。自分で数えた。
# 反応: nofootynolife.net のトップを見た（10/17 時点で三笘の記事なし）。個別の投稿（X）は当たっていない（ブラウザの道具は使わない決まり）。0件。
# 写真: Commons（CC BY 2.0 の jamesboyes／CC0 の Timmy96）。二次加工は B の切り出しのみ。前日10/16に使った三笘の写真は無い。2枚の元写真から7枚。
#   元写真 01.jpg（2022年7月、ブライトン青白、走る）→ 07_v・08_v・09_v ／ 03.jpg（2026年1月、黄色の2025/26ユニ22番）→ 15_v・16_v・17_v・43_v
#   ※ 04.jpg（2022年、ドリブル）は相手選手の顔を拾って別人の切り出しになったので使わない。02.jpg は顔が見つからず切り出し無し。05.jpg は03と同じ立ち姿なので使わない。
