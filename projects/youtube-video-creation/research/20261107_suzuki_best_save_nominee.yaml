# 取材: 2026-11-07。requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: ゲキサカ 462610（2026-11-06 10:23）「鈴木彩艶が日本人初のプレミア月間ベストセーブにノミネート!! フルハム戦で大ピンチ死守」（全文）。
# ノミネートの一次情報（プレミアリーグ公式）を確かめた:
#   ・premierleague.com の記事 4756221「Choose your Coca-Cola Save of the Month」（公開 2026-11-05。api.premierleague.com/content/premierleague/TEXT/en/4756221 で本文を読んだ）:
#     10月のセーブの候補は6つ。Walter Benitez（Crystal Palace 3-1 Nott'm Forest）／Mike Penders（Chelsea 2-0 Man Utd）／Bart Verbruggen（Man City 0-1 Brighton）／
#     Christian Walton（Hull 2-2 Ipswich）／Dean Henderson（Spurs 2-0 Crystal Palace）／Zion Suzuki（Aston Villa 1-1 Fulham）。
#     投票は 11月9日（月）12:00 GMT まで。ファンの票と専門家の審査員の票を合わせて決め、受賞者は「来週」発表。
#   ・アストン・ヴィラ公式の記事（premierleague.com 経由、4756777「PL Save of the Month recognition for Suzuki」。クラブ製作）: フルハム戦32分の1本が候補。
#     ボブがフリーで近くからシュート（球を浮かせようとした）→ 鈴木がとっさにグローブを上げ、クロスバーの上へ弾いた。受賞者は「11月13日（金）の2pm」に発表。
#   → 台本は「候補6人のひとり」「ファンと審査員の投票で決まる」「受賞者は来週発表」。日本人初かどうかはプレミア公式の記事には書かれていない（ゲキサカの報道。台本は「ゲキサカによると日本人選手として初」と出どころ付きで言う）。
#     発表日は 13日（クラブ）と「来週」（プレミア公式）が合う。台本は「来週」だけ。
# 試合データで確かめたこと（ESPN summary 401879250、eng.1）:
#   ・アストン・ヴィラ 1-1 フルハム、ヴィラ・パーク、2026-10-31 20:00 UTC キックオフ。16分 マッギンのPKはバーに当たって外れ。39分 ジャクソン（ヴィラ先制）。64分 オウンゴール（鈴木彩艶）で1-1。
#   ・32分: ESPN の実況「ボブ（フルハム）の右足、ボックス中央からのシュートを、鈴木が右上の隅で止めた。アシストはロビンソン」。→ 32分、ボブのシュートを止めた、は確定。
#   ・ヴィラ公式の試合記事（4753458）: 「前半の30分過ぎ、鈴木はボブを止める素晴らしい片手のセーブ」。フルハム公式の試合記事（4753662）は「信じられない反応のセーブ」。
#   ・記事どうしの食い違い: ゲキサカは「右手で弾く」、ヴィラ公式は「グローブを上げてバーの上へ」。台本は「手を出して弾いた」までで、どちらの手かは言わない。
#     ゲキサカは「ボブ（FWMF）」と書くが、ヴィラ公式は winger。台本は「フルハムのボブ」。
# ★ 同じ試合の後半64分に、鈴木のオウンゴールがある（ESPN・ヴィラ公式・フルハム公式の3つ。フルハムのイウォビのコーナーキックの球を鈴木がこぼし、ラインを越えた）。
#   ゲキサカの記事には出てこない。ベストセーブの題材でも、同じ試合の事実なので台本に1行入れる（見立ての節）。「失点」とは言わず「オウンゴールになった」と事実のまま。
# 前の本との重なり: scripts/20261104_suzuki_barca_cl（CLバルサ戦）／20261025_suzuki_zion_six_saves（別の試合の6本）／20261027_suzuki_zion_bbc_xi（BBC週間ベスト11）。フルハム戦は初。
#   → 今回の初出: セーブ・オブ・ザ・マンスの候補入り、フルハム戦32分の場面、同じ試合の1-1、投票の締切。
# 本人の言葉: 鈴木本人の言葉は見つからなかった（ヴィラ公式・プレミア公式・ゲキサカ）。→ X。
#   エメリ監督の試合後の言葉（ヴィラ公式 4753657、英語。全文を読んだ。台本の訳は私が日本語にしたもの）:
#   "They were breaking our press and we needed our goalkeeper, Zion Suzuki, saving some actions." → 台本で使う（監督の言葉。鈴木の言葉ではない）。
#   ヴィラ公式の「ロイヤル・カリビアン 試合の伝説」記事（4753896）: ヴィラの試合の選手投票1位はロビンソン（フルハム）。鈴木は話題の主ではないので使わない。
# 反応: 0件（作らない。approve は --no-voices）。ヴィラの公式X（11/5「Super Suzuki is up for the Premier League's Save of the Month…」）はゲキサカに載っている。
