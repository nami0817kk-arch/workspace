# クラブの財政：マンチェスター・シティ × アーセナル（10/17 土、シリーズ「クラブの財政」、key: finance_city_arsenal、型は news）。
#
# 軸は「**収入の世界6位（シティ）と7位（アーセナル）の差が760万ユーロしかない。では利益・赤字・給料の比率も並ぶのか**」。
#   → 収入は並んでも、中身（試合日と商業）・給料の比率・売却益への頼り方が違うことを、両クラブの決算書（ポンド）で並べる。
#   他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／
#   バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／トッテナム＝優勝の年の赤字）は1行も出さない。
#   ★プレミアリーグの判決・訴訟（シティの罰）は言わない（この回は決算の数字だけ。決算書の戦略報告に「2023年2月の付託」の一文があるのみ）。
#   ★スクワッド・コスト・ルール／PSR は言わない。売った選手・買った選手の名前も言わない。
#   ★クラブの数字は決算書の範囲のまま（アーセナルは持ち株会社の連結、シティはクラブの会社の決算）。部門名は並べない（女子は扱わない決まり）。
#   ★アルファベットは読み上げに出さない。
#
# **決算期（brief は「両方6月期」だったが違った）**:
#   ・シティ（Manchester City Football Club Limited、Companies House 00040946）＝**2025年6月期**（2024-25）。クラブの年次報告の発表 2025-12-16（mancity.com）、
#     決算書の署名 2025-10-08、Companies House への提出（AA）2026-03-06。
#   ・アーセナル（Arsenal Holdings Limited、04250459）＝**2025年5月期**（2024-25。**5月末決算**）。クラブの発表 2026-02-25（arsenal.com）、提出（AA）2026-02-27。
#   → **ひと月ずれる**（同じ2024-25シーズンの決算）。台本で言う。**2026年6月期・5月期の決算はどちらも未提出**（Companies House の提出履歴の最新は上の2件。2026-10-17 確認）。
#   → 通貨はどちらも**ポンド**（決算書の原数値）。デロイトの数字だけが**ユーロ**（年平均 1ユーロ＝0.84ポンドで換算、デロイト一次ページ）。台本で言い分ける。
#
# **出どころ（一次情報まで辿れたもの）**:
#   ○ **Companies House のシティ 2025年6月期 決算書（39ページ、スキャン画像）**を、ページ画像で読んだ（OCR は場所探しだけに使い、数字は画像を目で読んだ）：
#       戦略報告 p5〜6（KPI 表：人件費÷収入 59%・58%、売却益 95.2m・139.0m、順位 3位・1位）／損益計算書 p15／注記4 収入 p28／注記5 営業費用 p29（人件費・償却）／注記7 従業員 p29。
#   ○ **Companies House のアーセナル 2025年5月期 連結決算書（45ページ、スキャン画像）**：戦略報告 p3〜4（収入・人件費・売却益の文と損益の内訳）／連結損益 p22／注記2・3 p32／注記4・5 p33（営業費用・金融費用）。
#   ○ **クラブ公式**：mancity.com「Manchester City releases 2024-25 Annual Report…」(2025-12-16、収入6億9410万・赤字990万)／arsenal.com「Financial results for 2024/25」(2026-02-25)。
#       ★アーセナル公式サイトの表の「非例外の償却」は (176.6) と出るが、決算書の戦略報告の表（画像）と注記4は **171.6（171,627）**。**決算書の値を使う**（サイト側の転記ミスと思われるが未確認）。
#   ○ **デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com、2026-01-22）**：ランキング6位シティ・7位アーセナル、本文「シティ（€829m）は2位から6位へ」、
#       クラブごとの図（ページに埋め込まれた図の中身）で **シティ €829.3m（前の年 €837.8m、−1%、−€8.5m）／アーセナル €821.7m（前の年 €716.5m、+15%、+€105.2m）**、
#       5年の図（試合日・放映権・商業の3つの合計。シティ 645・731・826・838・829、アーセナル 367・433・533・717・822、百万ユーロ）、給料（シティ 476・アーセナル 404、百万ユーロ）。為替の注記：€1＝£0.84。
#       ★検索の一覧の「829.3／821.7」は一次ページで確かめられた。**差 829.3−821.7＝7.6 百万ユーロ**。
#       ★デロイトは「シティの女子は男子と連結していない」と注記（アーセナルの注記なし）。デロイトの収入額と決算書の額は別の集計（下の検算）。
#   ○ **ヨーロッパ中央銀行の参照相場（frankfurter 経由）2026-10-16：1ポンド＝210.72円**（丸めて211円）。
#   × **BBC は読んでいない**（この回は一次の決算書とクラブ公式で足りた）。
#
# 自分で計算した数（コードで検算した。scratchpad の calc.py）:
#   収入（百万ポンド）：シティ 694.094（前の年 715.019）／アーセナル 690.998（616.580）。差 3.096 →「310万」。3.096÷690.998＝0.45% →「0.4%」。
#   収入の動き：シティ −20.925（−2.9%）／アーセナル +74.418（+12.1%）。
#   収入の中身：試合日 75.084 対 153.854（アーセナルがシティの2.05倍）／放映権 278.627（UEFA 70.651＋その他 207.976）対 272.784／商業 340.383 対 263.193／アーセナルのその他（不動産 0.713＋選手貸出 0.454）1.167。
#     差の分解：−78.770＋5.843＋77.190−1.167＝+3.096 ✓（丸め −78.8＋5.8＋77.2−1.2＝+3.0、waterfall の注に「0.1ずれ」）。
#   シティの商業は「外注した小売事業の純額」。注記4：外注でなければ +61.8 で 755.9（前の年 +66.3 で 781.3）。アーセナルの小売は自前（営業費用に売上原価 30.9m）。
#   営業損益（売却益を足す前、決算書の「Operating profit/(loss)」）：シティ −93.302（前の年 −60.497）／アーセナル −63.208（−48.394）。**どちらも同じ定義**（損益計算書の同じ行）。
#   選手の売却益：シティ 95.210（139.009、−43.799、5年で 490m 超と決算書）／アーセナル 81.237（51.073）。
#   最終損益の道筋：シティ −93.302＋95.210＋利息（受取 7.768−支払 19.592＝−11.824）＝−9.916 ✓（税 0）／
#     アーセナル −63.208＋81.237＋（持分法の損 −1.690＋金融費用 −17.687＋税 −0.029＝−19.406）＝−1.377 ✓。丸め：−93.3＋95.2−11.8＝−9.9 ✓／−63.2＋81.2−19.4＝−1.4 ✓。
#   前の年の最終損益：シティ +73.757／アーセナル −17.687。変化：シティ −83.673 →「8370万悪化」／アーセナル +16.310 →「1630万改善」。
#   売却益を除いた最終損益：シティ −9.916−95.210＝−105.126 →「1億510万」／アーセナル −1.377−81.237＝−82.614 →「8260万」。
#   人件費（決算書の employee costs / staff costs）：シティ 408.403（前 412.573）／アーセナル 346.804（327.822）。差 408.403−346.804＝61.599 →「6160万」。
#   人件費÷収入：シティ 408.403÷694.094＝58.84%（前 57.70%）／アーセナル 346.804÷690.998＝50.19%（前 53.17%）。差 8.65pt →「8.7」。
#     シティの決算書の KPI は 59%（58%）で一致。変化：シティ +1.14pt／アーセナル −2.98pt。
#     外注小売を足した収入 755.9 で割る：408.403÷755.894＝54.03% →「54.0%」。差 54.03−50.19＝3.84pt →「3.8」。
#   選手の償却など：シティ 169.546（amortisation and impairment）／アーセナル 償却 171.627＋減損 15.241＝186.868（減損は決算期のあとの売却額に合わせた評価減＝特別項目）。
#   デロイト図の給料÷収入：シティ 476÷829.3＝57.4%／アーセナル 404÷821.7＝49.2%（デロイトの給料の定義は決算書と違う。向きだけ使う）。
#   デロイトの収入と決算書の収入：694.094÷0.84＝826.3（デロイト 829.3、差 3.0）／690.998÷0.84＝822.6（デロイト 821.7、差 −0.9）。**デロイトに独自の調整がある**（中身は読めていない）。
#     **ポンドの決算では差は 3.096 百万ポンド（≒3.7 百万ユーロ）、デロイトでは 7.6 百万ユーロ**。どちらも「ほぼ同じ」。
#   5年の差（百万ユーロ、デロイト）：645−367＝278／731−433＝298／826−533＝293／837.8−716.5＝121.3／829.3−821.7＝7.6。アーセナルは 821.7÷367＝2.2倍、シティは 829.3÷645＝1.3倍。
#   円換算：61.599×210.72＝12,980 百万円 →「約130億円」。
#
# **言い切っていないもの / 言わなかったもの**:
#   ・シティの赤字の理由は「決算書の戦略報告の文（選手への支出の増加・選手の売却益の減少など）」まで。放映権の減りはクラブ公式の説明（早い欧州の大会の敗退・順位）。
#   ・アーセナルの減損の理由は決算書の文（決算期のあとの売却額に合わせた評価減）まで。選手名・売却先は言わない。
#   ・借入・手元の現金・資産・親会社からの資金は言わない（決算書の範囲が違うので同じ土俵で比べられない。この回は損益と給料の比率）。
#   ・プレミアリーグの付託・判決は言わない。2025-26 の収入の見通しは言わない。
#
# 写真：assets/images/20261017_finance_city_arsenal/ に Commons の5枚（credits.json 同梱）。01_w＝エティハドの空撮 CC BY-SA 3.0 de（Arne Müseler）／
#   02_w＝エティハドの場内 CC BY-SA 4.0（Ank kumar）／03_w＝エミレーツの空撮 CC BY-SA 3.0 de（Arne Müseler）／04_w＝エミレーツの正面（2009）パブリックドメイン／
#   05_w＝エミレーツ外壁のエンブレム（2010）CC BY-SA 2.0。目で確認：すべてスタジアム。人物の顔は小さな群衆のみ（05 の壁画は過去の選手の絵）。
