#       「攻守において違いを作らないといけない。…今回は(谷口)彰悟さんが抜けてディフェンスラインのリーダー的な選手がいなくなったので、自分も29歳なので率先して引っ張っていきたい」（括弧は記者の補足。「…」は途中を省いた所）
#       「同数で守れるようにならないと恐らくベスト16以上には行けない。W杯で上を目指すためには同数で、広いスペースも守り切れるCBが必要かなと思う」
#       「後ろが同数でも前を出してあげる、プレッシングをさせてあげるというのを自分が出ればやっていきたい」
#       「W杯まではW杯に選ばれるためにリハビリしていたし、外れてからはチームでまず試合に出ることと、しっかりそこで結果を出してここに戻ってくることだけを考えてやっていた」
