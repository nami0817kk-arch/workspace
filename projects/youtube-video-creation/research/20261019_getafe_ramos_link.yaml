# 取材メモ（2026年10月19日）ヘタフェ会長トーレス、セルヒオ・ラモスの獲得を問われ「はい」。代理人の兄と話した（ニュースのショート。見せ方 X＋煽りの版）
# 取材: 2026-10-19。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261019_ramos_{infobae,bein_es,fichajes,fm}.txt。
#   ・Infobae（EFE の配信、18日12時 米東部時間）…… トーレス会長の発言（スペイン語の原文）を括弧つきで載せている。**主な根拠**。
#   ・beIN SPORTS（スペイン語版）…… 同じ発言を同じ括弧で載せている（EFE の内容）。
#   ・Fichajes.net …… 同じ内容。ヘタフェの今季の戦い方（フリーの経験者を取る）にも触れる。
#   ・Foot Mercato（題材の一覧の元）…… 仏語訳。「Oui」「Son frère, qui est son agent, a parlé avec moi」。
#   ・AS（見出し『トーレスがラモスに扉を開く』）は本文が取れない（403）。**見出しも台本に使っていない**（断定しない）。マルカも同じ。
# 確かめたこと（EFE の原文より）:
#   ・トーレス会長（ヘタフェ）は日曜（18日）、国営ラジオ RNE の番組『Tablero Deportivo』で、ラモスの兄で代理人のレネ・ラモスと話したことを認めた。
#   ・記者が、ラモスが「a tiro（手の届く所に来た）」状況なら獲るかと聞き、会長は "Sí"。続けて "Ha estado hablando conmigo su agente, su hermano."
#   ・**同じ会見で、会長は「優先ではない」と言っている**（題材の一覧は「はい」だけを拾っていた。ここを落とすと誤解させる）:
#     "Tenemos seis centrales. No es una posición que ahora mismo necesite... El míster quería bandas. Pero todavía no es tarde. Quiero decir que está en la lista de futuribles."
#     "Podría venir porque ha ocurrido. Es un tema que llevamos tiempo detrás. Pero no era la prioridad, la prioridad era conseguir bandas y, si no es así, pues igual, si no ahora, en enero, si trajéramos un central... Pero ahora esa posición la tenemos bien cubierta."
#     ※ "Podría venir porque ha ocurrido." は意味が取りにくい（EFE の書き起こしのまま）。**台本では引かない**。
#   ・ラモスは40歳。モンテレイを離れてチームがない。最後の公式戦は 2025年12月6日（アペルトゥーラ準決勝、トルーカに2-3）。
#     ※ 離れた時期は、EFE が「2025年の終わり」、Foot Mercato が「1月」で食い違う。**台本は時期を言わない**（最後の公式戦の日付だけ言う）。
#   ・EFE: ヘタフェは「ダニ・カルバハルを獲得したばかり。契約は2027年6月30日まで」。Foot Mercato も獲得を書く。ラモスとカルバハルはレアルで同じ更衣室にいた（EFE）。
#   ・クラブの発表は無い。契約の話・条件は出ていない。
# 自分で数えた比べ（見立て）: 最後の公式戦 12/6 から 10/18 まで 316日（12月の残り25＋1月31＋2月28＋3月31＋4月30＋5月31＋6月30＋7月31＋8月31＋9月30＋10月18）。
#   会長の言うセンターバック6人に、ラモスが加われば7人目（算数）。
# 確度: トーレス会長の発言は EFE 配信（複数の媒体が同じ括弧で掲載）＝報道。クラブの発表は無い。**確定とは言わない。** 契約・移籍が決まったとは言わない。
# 本人の言葉: **ラモス本人の言葉は無い**（作らない）。トーレス会長の言葉は原文（スペイン語）から訳した。語は足していない。
# 煽りの版の規則: 煽る語は題と1行目だけ。ラモスを貶さない（「40歳」は年齢の事実として1回だけ言う）。事実は変えない。想定は「見立て」と明記。
# 反応: 0件。この件への書き込みは見つかっていない（Foot Mercato の記事のコメントが3件あるが本文は読めていない）。作らない。approve は --no-voices で。
