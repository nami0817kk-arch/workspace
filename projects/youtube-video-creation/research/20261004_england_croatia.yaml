# ケインの記録（年間10点以上を3度・通算89点）は得点の流れの中で1〜2行だけ。節は立てない。
# 事実の裏:
#   スコアと得点者・時間は Sky Sports と Total Croatia、アシストは FotMob（5181853）。ベリンガム1得点3アシストは FotMob。
#   それまでの最大の負けはスペイン戦0-6（2018年ネーションズリーグ、Total Croatia）。
#   無観客の処分は「ファンの騒ぎと人種差別的な振る舞い」（Rijeka Danas）。どの試合の件かは書かれていないので言わない。14歳以下の子どもは無料、約6,000人（Total Croatia）。
#   W杯 6/17 ダラス 4-2（England Football の試合ページ。ムサの同点は45+5分）。数字は FotMob（4667825 と 5181853）。
#   ダリッチ監督はW杯のあとに退任（いまはUAEの監督）。後任はビリッチ（TV Beč）。題材メモの「ダリッチの言葉」はビリッチの言葉に置き換えた。
#   モドリッチの言葉は Dalmacija News（Index.hr の転載と明記）の文。Index.hr は 403 で原文を開けなかった。最後の「20年で初めて本当に恥」は前と同じ中身なので切った。
#   次の試合：10/6 クロアチア対スペイン（スプリト）、イングランド対チェコ（ホーム）。スペインはグループで3連勝（FotMob の日ごとの一覧）。
