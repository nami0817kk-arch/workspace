    text: がっかりしているし、来てくれた子どもたちに申し訳ない。
  - voice: スラヴェン・ビリッチ
    text: 自分たちにとっても、選手たちにとってもつらい。
    cont: true
  - voice: スラヴェン・ビリッチ
    text: 彼らは最初から、サッカーのあらゆる面で
    cont: true
  - voice: スラヴェン・ビリッチ
    text: 私たちよりはるかに上だった。速く、激しかった。
