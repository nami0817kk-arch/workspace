    text: でも、こんな負け方で、評判を台無しにするなんて。
    cont: true
  - voice: ルカ・モドリッチ
    text: 許されないことだ。
    cont: true
  - text: この日のスタンドを埋めたのは、子どもたちでした。
    image: assets/images/20261004_england_croatia/05.jpg
  - text: ファンの騒ぎと差別的な振る舞いで処分を受け、一般の客を入れられませんでした。
  - text: 代わりに、国じゅうのサッカースクールなどから、子どもたちが招かれていました。
  - text: この夏にダリッチ前監督の後を継いだビリッチ監督も、まず子どもたちに触れました。
    image: assets/images/20261004_england_croatia/03_w.jpg
