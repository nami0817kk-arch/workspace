#   ・ゲキサカ（地の文）: 佐野航は兄・佐野海舟（マインツ）とダブルボランチで先発。これまで今年3月のスコットランド戦、9月のウルグアイ戦で先発したが、いずれもハーフタイムに交代。この日は後半16分までプレー。後半8分に自身のボール奪取から攻撃の起点を作り、フィニッシュまで担った。
#   ・ESPN の試合データ（site.api.espn.com fifa.friendly summary event=401916336、2026-11-17 13:10 UTC）: 日本 1-2 パラグアイ。Kodai Sano は先発（背番号22）、61' に Ao Tanaka と交代。→ 記事の「後半16分（＝61分）まで」と一致。
#   ・ESPN fifa.friendly summary event=401856618（2026-03-28、スコットランド対日本）: Kodai Sano 先発、45' に Kaoru Mitoma と交代（ハーフタイム）。→ 記事の「3月のスコットランド戦はハーフタイム交代」と一致。
#   ・9月のウルグアイ戦は、ESPN の fifa.friendly（9/1〜9/14 の日程）で試合を見つけられなかったため、ハーフタイム交代はゲキサカの記述のまま使う（台本は表の中で「ハーフタイム」とだけ書き、分数は言わない）。
# 依頼文との違い: 依頼文は「A代表で過去最長プレー」。実際は、これまでの先発（3月・9月）がハーフタイム交代で、今回は61分まで。台本は分数を ESPN で確かめた3月（45分）と今回（61分）だけで言う。
# 自分で数えたもの: 3月のスコットランド戦（45分で交代）より今回（61分）は16分長い。記事の「後半16分まで」と同じ（45＋16＝61）。
