    main: true
    heading: 自己採点は7.5点
    tier: 報道
    telop: ゴードンが付けた、バルサでの自分の点数
    say:
      - voice: ゴードン
        text: 点数を付けるなら、10点中7.5点だ。
        short_voice: true
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
      - text: バルセロナのアンソニー・ゴードンが、移籍後の自分に付けた点数です。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - text: 25歳のイングランド代表。バルサでは11試合で2ゴール、5アシスト。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - text: 合わせて7つの得点に絡み、1試合平均で0.6を超えます。
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
      - voice: ゴードン
        text: よかった。でも、まだずっとできる。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - voice: ゴードン
        text: パリ・サンジェルマン戦は、もっとできたと思う。
        cont: true
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - text: 今週火曜のチャンピオンズリーグ。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - text: バルサはパリ・サンジェルマンに2対4で敗れています。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - voice: ゴードン
        text: こういう試合で、いつも最高の水準にいないといけない。
        image: assets/images/20261025_gordon_barca_75/04_w.jpg
      - voice: ゴードン
        text: なりたい選手になるなら。まだ長い、長い道のりがある。
        cont: true
        image: assets/images/20261025_gordon_barca_75/04_w.jpg
      - text: 英語で話した言葉を、こちらで日本語にしています。
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50265160

  - id: stage
    heading: 見てもらえる舞台と、夢だった一戦
    tier: 報道
    telop: プレミア時代との違いと、夢だった一戦
    say:
      - text: 代表ウィーク中、ゴードンはプレミア時代について話していました。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - text: エヴァートンとニューカッスルでは、いつも敬意を払われているとは感じなかった、と。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - text: 今は前より評価されていると感じるか。その問いへの答えです。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - voice: ゴードン
        text: もちろん。みんながバルサを見ている。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - voice: ゴードン
        text: それだけで、自分のプレーを見てもらえる。
        cont: true
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - voice: ゴードン
        text: 世界でいちばん大きな舞台で、自分の力を見せたい。
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
      - text: そして日曜は、ゴードンにとって最初のクラシコ、レアル・マドリード戦です。
        image: assets/images/20261025_gordon_barca_75/04_w.jpg
      - voice: ゴードン
        text: ずっと夢見ていた。出られるかは、分からなかった。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
      - voice: ゴードン
        text: でも、大きな夢だった。
        cont: true
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50265160

  - id: view
    viewpoint: true
    heading: W杯の負けから得た落ち着き
    tier: 背景
    telop: 準決勝の負けから得たもの
    say:
      - text: 見立てです。ゴードンはこの夏、バルサに移ったあと、W杯に出ました。
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
      - text: イングランド代表は準決勝まで進み、そこで敗れています。
        image: assets/images/20261025_gordon_barca_75/03_w.jpg
      - voice: ゴードン
        text: 負けたことは、少し傷として残っている。
        image: assets/images/20261025_gordon_barca_75/04_w.jpg
      - voice: ゴードン
        text: でも、前よりずっと落ち着いた。
        cont: true
        image: assets/images/20261025_gordon_barca_75/04_w.jpg
      - text: 自分への採点を、ゴードンが大舞台でどこまで上げられるかが見どころです。
        image: assets/images/20261025_gordon_barca_75/02_w.jpg
      - text: クラシコは日本時間26日の朝5時、会場はスポティファイ・カンプ・ノウです。
        image: assets/images/20261025_gordon_barca_75/01_w.jpg
