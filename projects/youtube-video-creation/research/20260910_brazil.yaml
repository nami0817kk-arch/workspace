# ブラジル代表がW杯から17人入れ替え（2026年9月10日）。ユーザー指示「03でお願い」
#
# **名前のある2人が真正面からぶつかっている。**今日いちばん伸びたのは
# 「ヤマルのバルサに、敗れた監督が言ったこと」（680回）と
# 「鈴木彩艶がプレミアのGKで1位」（585回）で、どちらも誰かの言葉が主役だった。
#
# 引きは**「41歳のチアゴ・シウヴァが返した言葉」**。刷新そのものより、
# 公然と反対した側の言い分のほうが効く。
#
# **順番を直した**（2026-09-10 ユーザー指摘「アンチェロッティの発言に対して、
# チアゴが言っただと思う」）。記事の時系列はこうなっている:
#   ① W杯敗退の直後、アンチェロッティが世代交代を明言
#   ② メンバー発表の直前、チアゴ・シウヴァが公然と反対
#   ③ 9日にメンバー発表（17人入れ替え）
#   ④ 発表後、アンチェロッティが反論
# **発表を先に置くと、チアゴの発言が宙に浮く。**予告→反対→実行→反論の順にする。
#
# **ショートは2節目が選ばれる。**単体で見ても分かるよう、節の頭に
# 一言で状況を置く（2026-09-10 ユーザー指示）
#
# **反応は入れない。**読める形のスレが無かった
