sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: W杯から17人が入れ替わった
    narrator: キャスター
    card:
      type: bars
      title: W杯2026のメンバー26人のうち
      items:
        - {label: "今回も選ばれた", value: 9}
        - {label: "入れ替わった", value: 17}
      unit: 人
    say:
      - ブラジルサッカー連盟が9日、ワールドカップ後はじめての代表メンバー26人を発表しました。
      - 継続して選ばれたのは、マルキーニョス、ヴィニシウス・ジュニオール、ハフィーニャ、ブルーノ・ギマランイス、ガブリエウ・マガリャンイスら9人。
      - つまり17人が入れ替わりました。
      - ゴールキーパーは総入れ替えです。アリソン、エデルソン、ウェベルトンが3人とも外れました。
      - カゼミーロ、ファビーニョ、パケタ、マルティネッリ、マテウス・クーニャも今回のリストにいません。
      - 代表引退を表明したネイマールも、当然ながら入っていません。
      - 一方で、ワールドカップに入らなかったジョアン・ペドロとエステヴァンが復帰。21歳のブレーノ・ビドンや20歳のヴィトール・レイスといった若手も入りました。
      - ブラジルは北中米ワールドカップをベスト16で終えています。アンチェロッティ監督は敗退の直後にこう言っていました。
      - {voice: アンチェロッティ監督, text: これは終わりではなく、新しいサイクルの始まりだ}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007895/
      - https://web.ultra-soccer.jp/news/all/35771/

  - id: silva
    heading: 公然と反対した人がいる
    tier: 報道
    telop: 「排除することはできない」
    narrator: 解説
    say:
      - ここからが本題です。この方針に、名指しで異を唱えた人がいます。
      - 国際Aマッチ通算113試合の、41歳チアゴ・シウヴァです。メンバー発表の直前に、こう話しました。
      - {voice: チアゴ・シウヴァ, text: 31歳や32歳、33歳の選手を}
      - {voice: チアゴ・シウヴァ, text: 排除することはできない}
      - {voice: チアゴ・シウヴァ, text: 私だって41歳でワールドカップに出場する可能性があったんだ}
      - {voice: チアゴ・シウヴァ, text: 好調の選手を排除するなんてあり得ない}
      - そして、進め方そのものに踏み込みます。
      - {voice: チアゴ・シウヴァ, text: ブラジル代表では物事を段階的に進めるべきだ}
      - {voice: チアゴ・シウヴァ, text: 全員を入れ替えて新しい顔ぶれにすることなんてできない}
      - {voice: チアゴ・シウヴァ, text: 彼は欧州サッカーの出身だ}
      - {voice: チアゴ・シウヴァ, text: そこでは改革が比較的容易にできると思う}
      - {voice: チアゴ・シウヴァ, text: でも、ここではそうはいかない}
      - 最後は、決定権を認めたうえで、はっきり否定しました。
      - {voice: チアゴ・シウヴァ, text: 決定権を持っているのは彼だ}
      - {voice: チアゴ・シウヴァ, text: だが、あのような形での変更は好きではない}
      - {voice: チアゴ・シウヴァ, text: 賛成しない}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/southamerica/20260910/2203249.html
      - https://www.footballchannel.jp/2026/09/10/post1007895/

  - id: reply
    heading: 監督はどう返したか
    tier: 報道
    telop: 「34歳や35歳には長期的な未来がない」
    narrator: 解説
    say:
      - メンバー発表のあと、アンチェロッティ監督がこの発言について聞かれました。
      - {voice: アンチェロッティ監督, text: 今回の親善試合の目標を考えれば}
      - {voice: アンチェロッティ監督, text: バランスの取れたメンバー構成だと思う}
      - {voice: アンチェロッティ監督, text: もちろん、選手の年齢だけにこだわっているのではない}
      - {voice: アンチェロッティ監督, text: だが、今はポテンシャルがある若手を}
      - {voice: アンチェロッティ監督, text: 将来を担い得る選手を優先すべき時なんだ}
      - そして、年齢についてはっきり線を引きます。
      - {voice: アンチェロッティ監督, text: 一つ確かなことは、34歳や35歳の選手には長期的な未来がない}
      - {voice: アンチェロッティ監督, text: 彼らは現在を担う選手だ}
      - {voice: アンチェロッティ監督, text: その年齢でも主要大会でプレーできる状態なら}
      - {voice: アンチェロッティ監督, text: 代表に招集されるだろう}
      - {voice: アンチェロッティ監督, text: しかし、現時点での優先事項は若手の起用にある}
      - なお、このブラジルはワールドカップのラウンド32で日本と当たり、2対1で勝っています。
      - 次は9月25日と29日にオーストラリアと2試合、10月3日には史上初めてインドと対戦します。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/southamerica/20260910/2203249.html
      - https://www.footballchannel.jp/2026/09/10/post1007895/
