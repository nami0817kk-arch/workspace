sections:
  - id: plan
    heading: 監督は何を言っていたか
    tier: 報道
    telop: 「終止符を打つ」と言っていた
    narrator: キャスター
    say:
      - ブラジル代表は、北中米ワールドカップをベスト16で終えました。ラウンド16でノルウェーに1対2で敗れています。
      - その直後、カルロ・アンチェロッティ監督はこう言いました。
      - {voice: アンチェロッティ監督, text: これは終わりではなく、新しいサイクルの始まりだ}
      - さらに、世代交代をはっきり口にしています。
      - {voice: アンチェロッティ監督, text: 今回のワールドカップは}
      - {voice: アンチェロッティ監督, text: 非常に重要な選手たちの世代に終止符を打つものだと思う}
      - {voice: アンチェロッティ監督, text: ネイマールにはじまり、ダニーロやカゼミーロといった}
      - {voice: アンチェロッティ監督, text: 30歳を超えていた選手たちのことだ}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/southamerica/20260910/2203249.html
      - https://www.footballchannel.jp/2026/09/10/post1007895/

  - id: silva
    heading: それに反対した人がいる
    tier: 報道
    telop: 「排除することはできない」
    narrator: 解説
    say:
      - ここからが本題です。ブラジル代表の監督が「30歳を超えた世代に終止符を打つ」と言い、世代交代を進めようとしていました。
      - これに公然と異を唱えたのが、国際Aマッチ通算113試合の、41歳チアゴ・シウヴァです。
      - メンバー発表を目前に控えたタイミングで、こう話しました。
      - {voice: チアゴ・シウヴァ, text: 31歳や32歳、33歳の選手を}
      - {voice: チアゴ・シウヴァ, text: 排除することはできない}
      - {voice: チアゴ・シウヴァ, text: 私だって41歳でワールドカップに出場する可能性があったんだ}
      - そして、進め方そのものに踏み込みます。
      - {voice: チアゴ・シウヴァ, text: ブラジル代表では物事を段階的に進めるべきだ}
      - {voice: チアゴ・シウヴァ, text: 全員を入れ替えて新しい顔ぶれにすることなんてできない}
      - {voice: チアゴ・シウヴァ, text: 彼は欧州サッカーの出身だ}
      - {voice: チアゴ・シウヴァ, text: そこでは改革が比較的容易にできると思う}
      - {voice: チアゴ・シウヴァ, text: でも、ここではそうはいかない}
      - 最後は、決定権を認めたうえで、はっきり否定しました。
      - {voice: チアゴ・シウヴァ, text: 決定権を持っているのは彼だ}
      - {voice: チアゴ・シウヴァ, text: だが、あのような形での変更は好きではない}
      - {voice: チアゴ・シウヴァ, text: 賛成しない}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/southamerica/20260910/2203249.html
      - https://www.footballchannel.jp/2026/09/10/post1007895/

  - id: result
    heading: そして、発表されたメンバー
    tier: 報道
    telop: W杯から17人が入れ替わった
    narrator: キャスター
    card:
      type: bars
      title: W杯2026のメンバー26人のうち
      items:
        - {label: "今回も選ばれた", value: 9}
        - {label: "入れ替わった", value: 17}
      unit: 人
    say:
      - 9日、ブラジルサッカー連盟が26人を発表しました。
      - ワールドカップのメンバーから継続して選ばれたのは、マルキーニョス、ヴィニシウス・ジュニオール、ハフィーニャら9人だけ。
      - つまり17人が入れ替わりました。チアゴ・シウヴァが心配したとおりの規模です。
      - ゴールキーパーは総入れ替え。アリソン、エデルソン、ウェベルトンが3人とも外れました。
      - カゼミーロ、ファビーニョ、パケタ、マルティネッリ、マテウス・クーニャもいません。
      - 発表のあと、アンチェロッティ監督はチアゴ・シウヴァの発言について聞かれています。
      - {voice: アンチェロッティ監督, text: もちろん、選手の年齢だけにこだわっているのではない}
      - {voice: アンチェロッティ監督, text: だが、今はポテンシャルがある若手を優先すべき時なんだ}
      - そして、年齢についてはっきり線を引きました。
      - {voice: アンチェロッティ監督, text: 一つ確かなことは、34歳や35歳の選手には長期的な未来がない}
      - {voice: アンチェロッティ監督, text: 彼らは現在を担う選手だ}
      - なお、このブラジルはワールドカップのラウンド32で日本と当たり、2対1で勝っています。
      - 次は9月25日と29日にオーストラリアと2試合、10月3日には史上初めてインドと対戦します。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007895/
      - https://web.ultra-soccer.jp/news/all/35771/
