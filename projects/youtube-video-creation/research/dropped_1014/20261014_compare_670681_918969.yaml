# 取材メモ（10/14 水、シリーズ「比べる」、key: compare_670681_918969、型は news）。
# 材料の控えは research/raw/20261014_compare_670681_918969.md。**この控えの外へ出ていない。**
#
# **「比べる」の3つ（選手／クラブ／同じ年齢）のうち「同じ年齢」で組んだ。**
#   パリ・サンジェルマンのネヴェスとモナコのカマラ。どちらも右利きのセントラルMFで、いまは22歳。
#   軸は「22歳の節目に何があるか」。22歳の誕生日は9月27日と1月1日で、きょう（10月14日）までの日数は17日と286日。
#   22歳のぶんは並べられないので、**21歳までに確定した数字**で並べる——これが「同じ年齢で比べる」意味。
#   強い一点：21歳までのトップチーム公式戦の出場時間は 1万2316分と6102分で2.02倍。
#   ところが年齢ごとに分けると差は 2735 → 1735 → 579分と縮み、90分あたりの得点＋アシストは 0.26 と 0.27 でほぼ同じ。
#   その中身（得点とアシスト）は逆向き。ここを見立てにした。
#
# **重なりの確認（直近30日、research/posted.json の題と research/covered.yaml を人名・クラブ名で引いた）**:
#   **ジョアン・ネヴェス本人が 1件**：2026-10-08 `player_670681`「ジョアン・ネヴェスってどんな選手？174センチの中盤が前半7分で2本決めた蹴り方」
#   （選手紹介、6日前）。**同じ選手を6日あけずに2本目。ユーザーに報告して、外すかどうかは判断してもらう。**
#   PSG：2026-10-10 `finance_psg`（財政、4日前）。モナコ：2026-10-12 `compare_dortmund_monaco`（2日前）に加え、
#   9/13・9/27・10/4 は南野拓実の話（この台本に南野は出していない）。カマラ本人は 0件。
#   10/12 のドルトムント×モナコと、**型は重ならないようにした**：あちらは「点が入る時間と得点者」、こちらは「21歳までの出場時間と、年齢ごとの積み方」。
#   板も変えた（あちらは timeline・waterfall・stats、こちらは table・line・calc）。
#
# **数字はすべて自分で数えた。**Transfermarkt の1試合ずつの記録（tmapi の performance-game）を足したもの。
#   年齢は各試合の日の年齢。**トップチームの公式戦だけ**（ベンフィカ・PSG・モナコ・メスの試合。代表戦・親善試合・Bチーム・育成リーグは除く）。
#   基準は 2026年10月14日の朝（最後の試合は10月10日のリーグ・アン第6節）。
#   ネヴェス：18歳 1165分／19歳 4144分／20歳 4134分／21歳 2873分＝12316分（177試合18得点17アシスト）。22歳は1試合58分。
#   カマラ：19歳 1409分／20歳 2399分／21歳 2294分＝6102分（87試合3得点15アシスト）。22歳は27試合2325分。
#   自分で割った数: 12316÷6102＝2.018（2.02倍）／4144−1409＝2735／4134−2399＝1735／2873−2294＝579／
#     35×90÷12316＝0.256（0.26）／18×90÷6102＝0.265（0.27）／18×90÷12316＝0.13／3×90÷6102＝0.04／17×90÷12316＝0.12／15×90÷6102＝0.22／
#     昨季 11×90÷2701＝0.367／7×90÷2457＝0.256／7×90÷2701＝0.23／3×90÷2457＝0.11／4×90÷2701＝0.13／4×90÷2457＝0.15／
#     市場価値 14000÷3000＝4.67／14000÷5500＝2.55
#   プレーの数字は FotMob の昨季リーグ・アン（ネヴェス1287分、カマラ1851分、90分あたり）。位置は FotMob が出す
#     「同じリーグ・同じポジション群の中での百分位」。数としては読まず、「上位◯%ほど」「少ない側」と期間つきで言った。
# **食い違いの控え**:
#   ①ネヴェスの身長：PSG 公式は 174 cm、Transfermarkt は 1.71m。**PSG 公式に揃えた**（10/8 の選手紹介の題も174センチ）。
#   ②雛形の「今季」の表（9試合528分／10試合900分）は**代表戦を含んでいた**。クラブの公式戦だけで数え直した（6試合463分／8試合720分）。
#      カマラの 8試合720分は AS モナコ公式の選手ページとも一致。
#   ③ネヴェスの市場価値は 6月1日の更新のまま（1億4000万）。22歳になってからの更新はまだ無い。
# **言い切っていないもの**: どちらが上かは一度も言わない。出場時間の2.02倍は「積み上げた時間の違い」までで、年齢ごとの差が
#   縮んだ理由は「カマラが20歳で990分増え、ネヴェスが21歳で1261分減った」という数字だけ。ネヴェスの減りはケガで出られなかった試合
#   （TM の記録で10試合、カマラは11試合）と並べて示し、原因は断定していない。守備・パスの数字は「チームの戦い方でも動く」と添えた。
#   「だけ」「最下位」などで小さく見せていない。パーセンタイルは「少ない側」と言うに留めた。
# **本人の言葉**：ネヴェス＝**未確認**（PSG 公式の選手ページに引用が無く、記者会見も取れていない）。
#   カマラ＝AS モナコ公式の記者会見（9月11日）の見出しの一句だけ（本文は全文が取れていない）。台本には引いていない。
# 板：①stats（22歳になってからの日数）②table（基礎DATA）③table（年齢別）＋line（年ごとの差）＋calc④table（昨季・今季）
#   ⑤table×2（プレー）⑥table＋line（市場価値）⑦table＋calc×2（見立て）。**`card: none` は明示してある**。赤ペン（mark）は使っていない。
# 写真：**未取得**。サムネは2枚並べて VS の形（photos は空のまま）。本編の冒頭・節の写真（`opening_image`・行の `image:`）も未指定。
#   人の写真はユーザーが取る。取れたら `thumbnail.photos` に2枚、`theme.opening_image` に並べた1枚を入れる。
# 声：1件も無い（シリーズの回。ブラウザの道具を使わない約束なので反応は集めていない）。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは案A（VS、伏せるのは「何倍か」）。
#   題の「倍」は節の中で言う（2.02倍）。
