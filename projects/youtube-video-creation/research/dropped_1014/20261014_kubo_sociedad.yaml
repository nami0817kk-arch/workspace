sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ソシエダ3-2デポルティボ。久保建英はベンチのまま
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - 10月11日のラ・リーガ第8節。レアル・ソシエダは、デポルティボに3対2で勝ちました。
      - 今シーズン初めての連勝です。
      - 国際Aマッチウィークが明けて最初の試合でした。日本代表で4試合に出た久保建英は、この試合も先発を外れました。
      - 公式戦で5試合続けてのベンチスタートです。
      - そしてこの日も、出番はありませんでした。出られなかったのは、2試合続けてです。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?460817-460817-fl

  - id: numbers
    heading: 数字で見ると
    tier: 報道      # 雛形は確定。クラブ・リーグの公式発表まで辿れていないので報道
    telop: 3-0から3-2。一発退場は両チームに1人ずつ
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - ソシエダは前半29分、ジョン・マルティンのヘディングで先制しました。
      - 前半34分にはザハリャンが追加点を挙げます。
      - 後半の立ち上がりにゲデスのシュートが決まり、3対0になりました。
      - ところが後半16分、ソリアーノのミドルシュートで1点を返されます。
      - さらに、MFパブロ・マリンがペナルティエリアの中で相手を倒して一発退場。与えたPKを、エルナンデスに決められました。
      - 3対2、1点差です。
      - 終了間際の後半45分には、デポルティボのアマトゥッチも一発退場になり、10人対10人でタイムアップを迎えました。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?460817-460817-fl

  - id: next
    heading: これからどうなる
    tier: 報道
    telop: ベンチで出番を待つなか、守備的な選手が次々に入った
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - 1点差に詰め寄られたあと、ソシエダは守備的な選手を次々に送り込んで耐えました。
      - 久保建英は、ベンチでその出番を待っていました。
      - 先発から外れている理由は、分かっていません。
      - 次の試合での起用も、いまのところ分かっていません。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://web.gekisaka.jp/news/world/detail/?460817-460817-fl

  - id: voices
    heading: ネットの声
    tier: 未確認      # 5ちゃんねるのスレ（まとめ記事経由）。単独では根拠にしない
    telop: 「前目ポジは推進力の時代だから厳しい」
    say:
      - 代表明けもベンチだった久保について、ネットではこんな声が出ていました。
      - voice: ネット民
        text: 前目ポジは推進力の時代だから厳しい
      - voice: ネット民
        text: 同ポジ三番手以下の選手がベンチに入れるのは枠の無駄だからソシエダは久保をかなりリスペクトしてるとも言える
      - voice: ネット民
        text: さすがにラリーガベンチを代表に呼ぶなよ
      - voice: ネット民
        text: 悲しくて涙が出てくるわ
    official: false
    sources:
      - https://footballnet.2chblog.jp/archives/60098896.html
