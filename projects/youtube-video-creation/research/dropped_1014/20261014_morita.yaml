sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ハル・シティ2-2エバートン。守田英正が後半30分から復帰
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - 10月11日、プレミアリーグ第6節。ハル・シティはエバートンと2対2で引き分けました。
      - 守田英正は、負傷から戻って後半30分から出場しました。
      - チームが2対2に追いついた直後に、ピッチへ入っています。
      - 守田が最後に出たのは、8月29日の第2節、コベントリー戦。そこから約1か月半ぶりの出場です。
      - 負傷の中身は、分かっていません。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://hochi.news/articles/20261012-OHT1T51099.html

  - id: numbers
    heading: 数字で見ると
    tier: 報道      # 雛形は確定。クラブ・リーグの公式発表まで辿れていないので報道
    telop: 31歳。9〜10月の代表は選外。ボランチ選出は6人
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - 守田英正は31歳。プレミアリーグに初めて挑戦するシーズンです。
      - 9月から10月の日本代表は4連戦でしたが、守田はケガで選ばれていません。
      - そのシリーズでボランチに選ばれたのは6人。佐野海舟、鎌田大地、田中碧。そこに田中聡、佐野航大、熊坂光希が加わりました。
      - さらに、遠藤航が代表引退の意向を示しています。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://hochi.news/articles/20261012-OHT1T51099.html

  - id: next
    heading: これからどうなる
    tier: 報道
    telop: アジア杯は2027年1月開幕。11月にブラジル、パラグアイ戦
    say:             # 読み上げ文。人名・数字はひらがなに開く
      - 森保ジャパンは、2027年1月に開幕するアジア杯を集大成と見ています。
      - 11月には、ブラジルとパラグアイとの親善試合が予定されています。
      - 守田はアピールが必要な立場です。それでも、ケガからの復帰は大きな朗報でした。
      - 競争に食い込んで、逆転でのアジア杯メンバー入りを目指します。
      - 森保一監督が守田をどう考えているのかは、分かっていません。
    official: false  # クラブ・当事者の発表なら true
    sources:
      - https://hochi.news/articles/20261012-OHT1T51099.html

  - id: voices
    heading: ネットの声
    tier: 未確認      # 5ちゃんねるのスレ（まとめ記事経由）。単独では根拠にしない
    telop: 「プレミアでレギュラーなら監督変わったら絶対選ばれると思う」
    say:
      - 復帰した守田について、ネットではこんな声が出ていました。
      - voice: ネット民
        text: とにかく怪我すんな
      - voice: ネット民
        text: まぁ代表復帰があるとしたらアジアカップ終わった後だろうな
      - voice: ネット民
        text: プレミアでレギュラーなら監督変わったら絶対選ばれると思う
      - voice: ネット民
        text: 守田よりも序列が明確に上なのは鎌田佐野田中だけだから
      - voice: ネット民
        text: 他に若くてプレミアレギュラーの奴が出てこない限りな
    official: false
    sources:
      - https://footballnet.2chblog.jp/archives/60098912.html
