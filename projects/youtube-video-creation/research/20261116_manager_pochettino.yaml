    card: *words_doc
  - voice: ポチェッティーノ
    text: この2年間、連盟と一緒に働いて、はっきり見えてきました。
  - voice: ポチェッティーノ
    text: 男子代表は、もっと強くできる。その大きな可能性が。
    cont: true
  - voice: ポチェッティーノ
    text: ワールドカップのファンの情熱が、信念を、さらに強めました。
    image: assets/images/20261116_manager_pochettino/01_w.jpg
    card: none
  - voice: ポチェッティーノ
    text: 温かく迎えてくれた国のサッカーに、残り続ける影響を残したい。
  - voice: ポチェッティーノ
    text: その影響は、結果の外にまで広げたいのです。
    cont: true
    pause: 0.5
