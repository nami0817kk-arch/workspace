# 監督紹介：マウリシオ・ポチェッティーノ（11/16 月、シリーズ「監督紹介」、key: manager_pochettino、型は news）。9節の型。見本は 20261114_manager_kompany。
# 順：フック→基礎DATA→日本との接点（2025年9月 アメリカ対日本）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-12）**：既出16人（グアルディオラ〜アロンソ・コンパニ）以外の大物から。
#   ・ジダン（10/03・10/18 と重なる）、森保一（10/06）、アッレグリ・インザーギ・マレスカは外した（アッレグリ・インザーギは別の回で名前は出ているが、日本との接点が薄い）。
#   ・ポチェッティーノ：アメリカ代表監督。英語版 Wikipedia の冒頭で確認（is the head coach of the United States national soccer team）。
#     ussoccer.com の公式発表（2026-08-03）で「契約は2030年まで」を一次情報で確認。
#   **重なりの確認（2026-11-12 に自分で）**：scripts/20260911_poch.md はニュース（9年前のプレミア優勝に異議）。20261111_manutd_carrick_pochettino はマンUのニュース。
#     「監督紹介」の本は無い。同じ 11/16 の他の担当・11/18 のナーゲルスマンと人も重ならない（research/20261115_picks.txt）。
#
# **いまの立場**：アメリカ代表監督（2024-09-10 から。2026-08-03 に契約を2030年まで延長）。
#   ○ ussoccer.com「U.S. Soccer Federation and Mauricio Pochettino Agree to New Contract Through 2030」（2026-08-03、2026-11-12 に requests で本文を読んだ）。
#   ○ 英語版 Wikipedia「Mauricio Pochettino」冒頭（2026-11-12）：is the head coach of the United States national soccer team。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of match played 6 October 2026）の行ごとの値。
#   エスパニョール 161試合53勝38分70敗／サウサンプトン 60試合23勝18分19敗／トッテナム 293試合160勝60分73敗／PSG 84試合55勝15分14敗／チェルシー 51試合26勝11分14敗／アメリカ代表 35試合21勝2分12敗。
#   **クラブの監督としての通算は、自分で足した**：161+60+293+84+51＝649、53+23+160+55+26＝317、38+18+60+15+11＝142、70+19+73+14+14＝190（317+142+190＝649）。勝率 317÷649＝48.8%。
#   **Wikipedia の「Career Total」行（685試合337勝146分202敗）は、行の合計（クラブ649＋代表35＝684試合338勝144分202敗）と合わない**ので使わない。
#   勝率（自分で割って確認）：エスパニョール 32.9%、サウサンプトン 38.3%、トッテナム 54.6%、PSG 65.5%、チェルシー 51.0%、アメリカ代表 60.0%（表の値と一致）。
#   エスパニョール＋サウサンプトン 76÷221＝34.4%、トッテナム以降（トッテナム・PSG・チェルシー・アメリカ）262÷463＝56.6%。差 22.2 ポイント。
#   監督としてのタイトル：PSG のリーグ・アン 2021-22・クープ・ド・フランス 2020-21・トロフェ・デ・シャンピオン 2020（Honours）。リーグ優勝は PSG の1回だけ。
#
# **歩み**（英語版本文）：2009-01 エスパニョール／2013-01 サウサンプトン（2013-14 は8位＝プレミアで過去最高に並ぶ）／2014-05 トッテナム（2016-17 は2位・勝ち点86でクラブ最多。2019-05 CL決勝で
#   リヴァプールに0-2。2019-11-19 に14位で解任）／2021-01 PSG（2020-21 は国内杯、2021-22 リーグ優勝。2022-07 に退任）／2023-07 チェルシー（2023-24 は6位、EFLカップ決勝は延長で0-1。2024-05-21 に双方合意で退任）／2024-09-10 アメリカ代表。
#
# **戦術の色**＝2026年W杯 アメリカ 4-1 パラグアイ（英語版本文：3-4-3 の変形、積極的なプレス、切り替えの速さ。W杯のアメリカで最多得点の試合、1930年以来の最大タイの勝ち）。
#   ビエルサ（ニューウェルズ時代の師）を「フットボールの父」と呼ぶ（Style of coaching）。トッテナムは2015-16と2016-17の2季とも、守備1回あたりの相手のパス数がリーグ最少（プレミアリーグの分析）。
#
# **W杯2026**：パラグアイ 4-1／オーストラリア 2-0／トルコ 2-3（主力10人を休ませた）／R32 ボスニア・ヘルツェゴビナ 2-0／R16 ベルギー 1-4。5試合すべてで得点・合計11点（4+2+2+2+1）。W杯の勝利3は、アメリカの監督として最多（公式発表）。
#
# **日本との接点**：2025-09-09 親善試合 アメリカ 2-0 日本（オハイオ州コロンバス。ゼンデハス30分、バログン64分）。英語版「United States men's national soccer team results (2020–present)」の2025年の節で確認。
#   ポチェッティーノは当時のアメリカ代表監督（2024-09 から）。
#
# **本人の言葉**：ussoccer.com 2026-08-03（契約延長の発表）。原文：“Working together with U.S. Soccer over the past two years, it has become clear to us that there is tremendous potential to make the Men’s National Team program even stronger. The passion we experienced from the fans throughout the World Cup only strengthened our belief in what is possible here. We want to try to have a lasting impact on the sport in the country that has welcomed us so warmly and for that impact to extend beyond results on the field.”
# **マル秘話**（英語版 Early life・Southampton・Personal life、ガーディアン 2017-04-29）：農場で働く父のもとに生まれる。13歳でロサリオ・セントラルの練習に週2回、バスで160マイル。サウサンプトン時代、英語は分かったが会見はスペイン語の通訳（思いを十分に表すため）。
#   “I believe in energía universal… It is connected. Nothing happens for causality… Maybe, it is one of the reasons that Harry always scores in derbies.”（ガーディアン 2017-04-29、requests で本文確認）。
#
# **入れなかったもの**：家族・息子の話（私生活）、2019年CL決勝前の火渡りの練習とその評価（監督を小さく見せる書き方になる）、チェルシー退任の内紛の詳細、トランプのレッドカード取り消しの政治の話、女子・FotMob・ニュースの反応。
