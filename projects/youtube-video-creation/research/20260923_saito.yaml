sections:
  - id: what
    heading: 何があったか
    tier: 報道
    telop: 1年前はJ2。今季はベルギーで開幕から先発、7試合3得点
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    card:
      type: table
      title: 齋藤俊輔
      columns: ["", ""]
      rows:
        - ["年齢", "21歳"]
        - ["所属", "ウェステルロー（ベルギー1部）"]
