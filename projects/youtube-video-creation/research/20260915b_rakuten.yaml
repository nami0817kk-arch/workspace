# 楽天と鈴与が、ヨーロッパのクラブを買いにいっている（2026-09-14）
#
# **試合の話ではない回。**「日本の会社が欧州クラブを買う」という切り口は
# このチャンネルで一度もやっていない。表に出たのは、売る側のオーナーが喋ったから
format: news
