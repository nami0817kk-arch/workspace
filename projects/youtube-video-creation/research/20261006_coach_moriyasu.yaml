  say:
  - text: では、森保一の8年を大会ごとに束ねると、何が見えるでしょうか。
    image: assets/images/20261006_coach_moriyasu/03_v.jpg
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: W杯のアジア予選は33試合で27勝。勝率は81.8%です。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: 東アジアの国で争うE-1選手権は77.8%、アジアカップは75%と続きます。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 1
  - text: アジアの公式戦を合わせると54試合で43勝。ほぼ5試合に4つ勝ってきました。
    emph: true
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 2
  - text: 親善試合は46試合で、勝率65.2%。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 3
  - text: ところがW杯の本大会では8試合で3勝。勝率は37.5%まで下がります。
    emph: true
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 一方で、欧州の国とは11試合で8勝3分け。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: PK戦を引き分けに数えると、まだ一度も負けていません。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 時期で分けると、カタール大会までの1期目は66.1%。
    card:
      type: table
      title: 期ごとの勝率（同じ数え方）
      columns: &id013
      - 時期
      - 試合
      - 勝ち・分け・負け
      - 勝率
      rows: &id014
      - - 1期目（2018〜22）
        - '62'
        - 41・9・12
        - 66.1%
      - - 2期目（2023〜26）
        - '45'
        - 32・7・6
        - 71.1%
      - - 3期目（2026〜）
        - '4'
        - 3・1・0
        - 75.0%
      - - 通算
        - '111'
        - 76・17・18
        - 68.5%
      highlight_row: 0
  - text: 北中米大会までの2期目は、71.1%に上がりました。
    card:
      type: table
      title: 期ごとの勝率（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 1
  - text: いまの3期目は4試合で3勝1分け。通算は76勝17分け18敗。7割近い勝率です。
    card:
      type: table
      title: 期ごとの勝率（同じ数え方）
      columns: *id013
      rows: *id014
      highlight_row: 3
  - text: 大きな相手を倒す力と、W杯の本番での勝ち星。その差が8年の数字に表れています。
    card:
      type: table
      title: 大会ごとの勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 次は11月のシンガポール。ブラジルとは14日、パラグアイとは17日に対戦。
    image: assets/images/20261006_coach_moriyasu/03_w.jpg
    card: none
  - text: 来年1月のアジアカップは、11日のインドネシア戦から。
    card: none
  - text: 1次リーグ3戦目の20日は、2019年の決勝で敗れたカタールとの対戦です。
    card: none
  - text: 最後の大会で、アジアの頂点に届くか。8年の締めくくりが近づいています。
    card: none
  - text: その先について聞かれると、森保監督は笑ってこう答えました。
    image: assets/images/20261006_coach_moriyasu/02_w.jpg
    card: none
  - text: まだ決まっていないですけど、
    voice: 森保監督
    card: none
  - text: 監督業はおそらく続ける予定なので、
    voice: 森保監督
    cont: true
    card: none
  - text: チームの一人として、国立でまた試合を
    voice: 森保監督
    cont: true
    card: none
  - text: させていただくことはあるかもしれません。
    voice: 森保監督
    cont: true
    card: none
