    image: assets/images/20261006_coach_moriyasu/03_w.jpg
  - text: 10月5日、キックオフ前の森保一監督です。
    image: assets/images/20261006_coach_moriyasu/03_w.jpg
  - text: 満員の国立競技場のスタンドを見て、
    voice: 森保監督
  - text: こみ上げてくるものがありました。
    voice: 森保監督
    cont: true
  - text: スタジアムを暗くして、イルミネーションを演出するところで、
    voice: 森保監督
    cont: true
  - text: 涙がこみ上げてきて、もう少しで泣きそうになっていた。
    voice: 森保監督
    cont: true
  quotes_from:
  - サッカーキング https://www.soccer-king.jp/news/japan/national/20261005/2213691.html
  sources:
