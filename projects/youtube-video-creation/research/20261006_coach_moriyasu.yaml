# 監督の経歴：森保一（10/6）。2018年7月から日本代表監督。10/5 キリンカップ決勝（国立、2-1 ニュージーランド）が国内で最後の試合。
# 契約は AFCアジアカップ2027（2027/1/7〜2/5、サウジアラビア）の終了まで、後任は大岩剛（JFA 2026-07-23 news/00036548）。
# 通算の数字は JFA の各年の「試合日程・結果」から自分で数えた（raw の3節に全112行）。実際に戦った国際試合111（2024-03-26 北朝鮮の不戦勝と
#   2021-06-03 の U-24 日本代表戦は数えない）、PK戦は引き分け。JFA のプロフィール（7/23 時点 108試合74勝16分18敗）とは1試合1勝ずれる
#   （不戦勝か U-24 戦のどちらかを含めた数）。報道の「通算111試合目」（スポニチ 10/5）・「100試合目＝2025-11-18」（Wikipedia）とは一致。
# 大会ごと・期ごとの勝率と、欧州の国11試合（8勝3分0敗）も同じ数え方で自分で足した。Wikipedia の「欧州に8勝2分0敗（6/15 時点）」と一致。
# 選手時代・監督の歩みは JFA のプロフィールと日本語版Wikipedia（森保一・ドーハの悲劇）、英語版Wikipedia（1992 アジアカップ優勝・2019 決勝・2026 W杯）。
# 森保監督の言葉はすべてサッカーキング（10/5、2213691）から：前日会見・試合前の涙・サポーターへの感謝・退任後の話。
# Jリーグは扱わない決まりなので、広島の優勝は表の1行と語りの1行だけ。同じ 10/5 に堂安の回を出しているので、試合の細部は1行。
# 10/5 の試合後の「4バック」「アジア杯のシミュレーション」（ゲキサカ 460361）は題と別なので使わない。
# ネットの反応は入れていない（シリーズの回）。
# 写真: 01 ゲキサカ 460361（Koki NAGAHAMA/GEKISAKA、10/5）、02 サッカーキング 2213691（金田慎平、トロフィー）、03 サッカーキング 2213704（ベンチ、10/5）、
#   04 Commons 2022 首相表敬（CC BY 4.0 内閣広報室）、05 Commons 2024 タイ戦（CC BY 4.0 RuinDig/Yuki Uchida）、06 Commons 2025 コロンバス（CC BY 4.0 Keiteay）。代理店は使っていない。
#   材料の控えは research/raw/20261006_coach_moriyasu.md。
