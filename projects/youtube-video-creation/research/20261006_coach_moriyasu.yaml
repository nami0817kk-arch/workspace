- id: kirin
  heading: 15年ぶりの優勝と、サポーターへの感謝
  tier: 報道
  official: true
  telop: 堂安律の決勝点で2対1。キリンカップは2011年以来
  narrator: 解説
  say:
  - text: 試合は1対1から、後半26分に主将の堂安律が決めて2対1の勝ち。
    image: assets/images/20261006_coach_moriyasu/02_w.jpg
    card: none
  - text: 日本にとって、15年ぶりのキリンカップ優勝です。
    card: none
  - text: トロフィーを掲げた森保一監督の胸には、サポーターへの感謝もあったといいます。
    card: none
  - text: また未来で誰が監督になっても、日本代表を応援して、
    voice: 森保監督
    card: none
  - text: 世界一の夢を一緒に見ていこう、追っていこうと
    voice: 森保監督
    cont: true
    card: none
  - text: 思ってもらえるようなチャレンジがしたいなと思いました。
    voice: 森保監督
    cont: true
    card: none
  quotes_from:
  - サッカーキング https://www.soccer-king.jp/news/japan/national/20261005/2213691.html
  sources:
  - https://www.soccer-king.jp/news/japan/national/20261005/2213691.html
