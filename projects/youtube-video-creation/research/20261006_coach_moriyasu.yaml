  say:
  - text: 選手としての出発は1987年。地元長崎の高校から、マツダに入りました。
    image: assets/images/20261006_coach_moriyasu/05_v.jpg
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: 1992年、オフト監督の日本代表に初めて呼ばれます。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: 同じ長崎出身の2人を除いて、代表の誰も「モリヤス」と読めなかったほど無名でした。
    emph: true
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: それでも初戦のアルゼンチン戦で先発し、相手から「いいボランチだ」と認められます。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: その年の秋には、日本が初めて制したアジアカップの優勝メンバーに。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: そして1993年10月28日、カタールのドーハ。W杯初出場をかけたイラク戦です。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: ボランチの位置には、出場停止が明けた森保一が戻っていました。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 2対1で勝っていた終了間際、コーナーキックから追いつかれます。
    emph: true
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 2対2の引き分けで、W杯への夢は消えました。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 2003年まで仙台でプレーし、スパイクを脱ぎます。
    card:
      type: table
      title: 選手・森保一の歩み
      columns: *id003
      rows: *id004
