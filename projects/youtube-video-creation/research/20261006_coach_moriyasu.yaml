  title: 森保一、国内最後の試合で明かした胸の内。日本代表8年の勝率、大会ごとの差は
  question: 8年で111試合を率いた森保監督は、どの舞台で勝ち、どこで壁に当たってきたのか
  takeaway: 実際に戦った111試合（PK戦は引き分け）は76勝17分け18敗、勝率68.5%。大会ごとに束ねると、W杯のアジア予選は81.8%、アジアカップ75%と、アジアの公式戦ではほぼ5試合に4勝。それがW杯本大会では8試合3勝の37.5%に下がる一方、欧州の国には11試合負けなし。次は11月14日にシンガポールでブラジル、アジアカップは1月11日のインドネシア戦からで、20日には2019年の決勝で敗れたカタールと当たる
  opening_image: assets/images/20261006_coach_moriyasu/03_w.jpg
