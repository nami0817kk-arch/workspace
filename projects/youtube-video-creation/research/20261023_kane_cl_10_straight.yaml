# 取材メモ（2026年10月23日）ケイン、CLで10試合連続ゴール。最長のC・ロナウド（11試合）まであと1（ニュースのショート。見せ方 B＝縦写真を高速で切り替え）
# 取材: 2026-10-23。requests / curl（ブラウザUA）で原文を読んだ。控えは research/raw/20261023_kane_*。
#   ・ESPN 記事API（content.core.api.espn.com/v1/sports/news/50241594、試合の分析記事）… 全文読んだ。「He has now scored in 10 consecutive Champions League games. Only Cristiano Ronaldo (11) has had a longer streak.」。
#   ・ESPN 試合記録API（site.api.espn.com/.../uefa.champions/summary?event=401915312）… 得点・アシスト・分。35分 デイヴィス（アシスト ケイン）、61分 ケイン PK。
#   ・Bundesliga.com（DFL公式）試合レポート（2026-10-22）… 全文読んだ。「2-1 Kane 61' (pen)」「1-1 Davies 35' (assist: Kane)」、ティンバーの手でPK。次のCLは11月3日アトレティコ・マドリード戦。
#   ・サッカーキング（2026-10-22 14:42、題材の出典。UEFA.com のコメント記事を引く）… 全文読んだ。「CL史上2人目の10試合連続ゴール。最長はC・ロナウドの11試合」は Squawka の集計として書く。ケインの言葉は DAZN の試合後インタビュー。
#   ・Goal.com（2026-10-23 02:02 JST）… 全文読んだ。「ロナウドは2017〜2018年にレアル・マドリードで11試合連続（UEFAの統計）」。「ケインは9試合でファン・ニステルローイ、レバンドフスキに並んでいた」。次はアトレティコ戦（3日）。
#   ・beIN SPORTS（2026-10-21/22）… 英語の試合後コメント。「It was a good performance」「The draw was fair overall」が日本語の DAZN 引用と一致。
#   ・ESPN scoreboard API（dates=20261103）… Bayern Munich at Atlético Madrid 2026-11-03T20:00Z、Riyadh Air Metropolitano。
# UEFA.com は何度かアクセスしたが応答がなく（タイムアウト）、原文は読めていない。UEFA の記録は ESPN（記事）と Goal.com（「UEFAの統計」）、サッカーキング（UEFA.com の引用）で確かめた。
# 確度: 試合結果・得点・アシストは 確定（ESPN 試合記録と Bundesliga.com が一致）。「10試合連続・史上2人目・最長は11試合」は 報道（ESPN・Goal.com・サッカーキングで一致。UEFA 原文は未読）。本人の言葉は 報道（DAZN の試合後インタビュー）。見立ては 背景。
# 資料のずれ（台本では言わない）:
#   ・CLの連続ゴールの数え方：beIN は「得点またはアシストが10試合連続（CL史上6人目）」とも書く。こちらは「ゴールが10試合連続」だけを言う。
#   ・アーセナル戦の通算ゴール（16）、ライプツィヒ戦の話などは題材の外なので使わない。
#   ・本人の「最後の15分／20分」：日本語の DAZN 引用は「最後の15分間」、beIN の英語は「last 20 minutes」。別の取材か訳の違いかが分からないので、この言葉は使わない。
# 本人の言葉（DAZN。サッカーキングの日本語訳をそのまま使う。言い換えない）:
#   「良いパフォーマンスだったと思う。」／「全体として見れば、引き分けは妥当な結果だったかもしれない。」／「ファイナルサードでのプレーの精度をもう少し高められたはずだ。」
#   ストリーク（連続ゴール）そのものについてのケインの発言は、読んだ資料に無い。→ 作らない。
# 自分で数えたこと（ESPN の試合記録 summary API の keyEvents／rosters から。控えは research/raw/20261023_kane_m*.json）:
#   ケインのCL得点を新しい順に：アーセナル戦(10/21) 1・ヴァイキング(10/13) 2・ボデ・グリムト(9/10) 1・PSG第2戦(5/6) 1・PSG第1戦(4/28) 1・レアル第2戦(4/15) 1・レアル第1戦(4/7) 1・アタランタ第2戦(3/18) 2・
#   [アタランタ第1戦(3/10)はケインの出場 appearances=0 ＝ベンチで出番なし。出場した試合で数えると途切れない]・PSV(1/28, 途中出場84分) 1・ユニオン・サン＝ジロワーズ(1/21, 先発) 2 ＝ 10試合で13ゴール。
#   その前のスポルティング戦(12/9)は先発出場で0点なので、連続はユニオン戦から。→「10試合連続」と合う（ESPN・Goal.com・サッカーキングの数字と一致）。
