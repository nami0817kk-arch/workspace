#   ・ESPN「Brighton's Fabian Hürzeler digs at Liverpool - 'one team' tried to create」（10/25 18:37Z）— 題材の元。試合後の会見。
#       地の文: 2-0。グロスのオウンゴールとイサクの得点。ブライトンは支配率で上回り、xG もリヴァプールより高かった。リヴァプールはイラオラ監督のもとで公式戦4連勝、リーグ4位へ。
#       本人: "I think everyone in the stadium saw that there was one team who really tried to create and try to win this game and therefore I have to praise my players"
#             "today I think it was just the difference that they scored, we didn't score." / "They really defended the box well. We didn't have that efficiency."
#             "We couldn't keep the clean sheet because we made easy mistakes, we lost some important personal duels."
#             "that is very frustrating because we all have the feeling that there is a missed opportunity here today."
#   ・BBC ライブ頁（https://www.bbc.com/sport/football/live/cmdx325w7gy6t、10/25）
#       本人（BBC MOTD、何をすればよかったか）: "Scored goals." / "It's a missed opportunity." / "we are very disappointed."
#       地の文: 0-0 の時にアヤリの大きな好機（グロスの折り返し）が枠の上。そのあと2点を続けて失う。支配率64%、枠内シュートは1本だけ。今季のプレミアで初めての無得点。
#               アリソンのつなぎのミスからアヤリのシュートが右ポストの根元。次は水曜、リーグカップ（カラバオ杯）16強でマンチェスター・シティとアウェー。
#       試合の数字（BBC の Match Stats）: 支配率 リヴァプール35.6% ブライトン64.4% / xG 0.87 対 1.35 / シュート 13 対 17 / 枠内 4 対 1 / ポスト 0 対 1。
