        image: assets/images/20261026_hurzeler_one_team/05_w.jpg
      - text: まだ点が動く前には、アヤリに大きなチャンスがありました。
        image: assets/images/20261026_hurzeler_one_team/02_w.jpg
      - text: ただ、そのシュートはゴールの上へ外れています。
        image: assets/images/20261026_hurzeler_one_team/02_w.jpg
      - voice: ヒュルツェラー
        text: 彼らは決めて、僕らは決めなかった。
        image: assets/images/20261026_hurzeler_one_team/02_w.jpg
      - voice: ヒュルツェラー
        text: 今日の違いは、それだけだと思う。
        cont: true
        image: assets/images/20261026_hurzeler_one_team/02_w.jpg
      - text: 監督の言葉は英語の会見から、こちらで訳しています。
