#       リーグ戦の失点は9月16日以来だった（conceded in the league for the first time since 16 September）。
#   ・ESPN 試合API（event 401878765）: 17分 グロスのオウンゴール、21分 イサク（アシスト バルコラ）。支配率 64.4%、シュート 17（枠内1）。
# 言わないこと: リーグ連勝が「4で止まった」（題材一覧にあるが、今日読めた本文では確かめられなかった）。カディオールの負傷の詳細（本文は腰を押さえて6分に交代、だけ）。
