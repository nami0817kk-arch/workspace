# 取材: 2026-10-24。requests（ブラウザUA）と ESPN の記事API で本文を全部読んだ。検索エンジンのAI要約は使っていない。
#   ・The Guardian（2026-10-23T16:50Z）https://www.theguardian.com/football/2026/oct/23/vincent-kompany-hospital-collapsing-bayern-munich-training
#       控え research/raw/20261024_guardian_kompany.html。『Bayern said on their website』としてクラブの発表文を引用。
#       「required medical attention after collapsing during a training session for Bayern's reserve team. The head coach of the professional squad had been observing the second team's session.」
#       「currently undergoing a thorough examination in the hospital and will remain under medical care. For the time being, his coaching staff will manage all training and match-related operations.」
#       エーベルル「Vincent Kompany's health is our top priority…」「he will be given as much time as he needs」。日曜にフライブルクへ。水曜のCLアーセナル戦は2-2、ウイルス感染のままベンチに。
#   ・BBC（2026-10-23T16:39Z）https://www.bbc.com/sport/football/articles/ck3r5792en7go 控え research/raw/20261024_bbc_kompany.html
#       クラブの発表文（同じ中身）、エーベルル「His coaching team, in whom we have complete confidence, will take over his duties.」
#       「Reports in Germany say Kompany is in a stable condition in hospital.」（ドイツの報道＝報道止まり）。40歳。火曜の会見はアシスタントのダンクスが代わった。
#       独記者ハリル（BBC Radio 5 Live）の話（ヘリコプター等）は使わない（記者の伝聞。絵を煽る材料になる）。
#   ・ESPN 50258850（2026-10-23T19:59Z、ESPN News Services／AP）content.core.api.espn.com 経由。控え research/raw/20261024_espn_50258850.json
#       「viral infection that was affecting his legs over the past week」。ダンクス（火曜）"It has affected his legs at times and he's felt some pain" "It's just a virus."
#       「Following Wednesday's match, Kompany acknowledged he tried to push through the illness and failed to heed the signals from his body.」（ESPN の地の文の要約。本人の言葉そのものではない→本人の声にはしない）
#       エーベルルが17日のライプツィヒ戦（6-1）のころに股関節のけがにも触れた件・階段の件は、病状の細部なので使わない。
#       「top of the German Bundesliga and level on points with Borussia Dortmund, next visit Freiburg on Sunday」。マンCも回復を願う投稿。
#   ・ESPN の試合予定（site.api.espn.com ger.1 scoreboard 20261025）: フライブルク対バイエルン 2026-10-25T16:30Z ＝ 日本時間26日（月）午前1時30分、Europa-Park Stadion。
# 新しい発表（容体・日曜の指揮）: 24日朝の時点で、ESPN のブンデスリーガの記事一覧・Guardian のバイエルンのページ・BBC に続報は無い。
#   fcbayern.com は読み込みが時間切れで開けなかった（クラブ公式の原文は直接は読めていない）。→ 診断・容体・日曜の指揮者は台本で言わない（「診断は発表されていない」とだけ言う）。
# 日付: 倒れたのは23日（金）（Guardian・BBC「on Friday」）。ダンクスの会見は20日（火）。アーセナル戦は21日（水）。
# 確度: クラブの発表は Guardian・BBC・ESPN の3社が同じ文を引用。クラブ公式のページは開けていないので「報道」にとどめる。容体が安定は「ドイツの報道」（BBC）＝報道。
# 本人の言葉: 無い（作らない）→ Y にしない。X（short_hook_word は落ち着いた語）。言葉はクラブの声明・エーベルル・ダンクスの3つ（すべて実在の発言・発表）。
# 反応: 当たっていない（作らない。approve は --no-voices で）。
# 重なり: research/posted.json・covered.yaml・scripts/20261018〜24 を grep。コンパニの入院を扱った本は無い（20261021_bd_bayern・musiala_intro はシリーズで別の話）。
#   10/22 の rice_bayern_arsenal・saka_injury_bayern の写真は報道写真で、今回の Commons の3枚とは別。
