# **選んだ理由**：クラシコの両クラブの若いセンターバック（19歳と21歳、同じスペイン代表）。今季の出場時間は 1142分 と 1042分（どちらも1000分超、足切り450分を超える）。
#   守備の選手は得点・アシストで比べにくいので、TM の「出ている間のチームの得点・失点」（teamGoalsOnThePitchSum・opponentGoalsOnThePitch）を90分あたりに自分で割って軸にする。クラブの公式戦だけで数える（代表戦は混ぜない）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて。クバルシは 10/07 に若手の本・9/08 にバルサの本、ハイセンは単独の回が無い。比べるの回には両者とも未登場。
#   同じ日（11/19）の picks（選手紹介 ムシアラ・インテルのユニフォーム・ビジャレアルのスタジアム・中山雅史）とは人もクラブも重ならない。11/21 の比べる（クヴァラツヘリア×ドク）とも重ならない。
#   **外した候補**：サリバ×クバルシ（サリバは 26/27 のアーセナルで出場0分、足切りを満たさない）・ヤマル×ユルドゥズ（ヤマルが10/20・10/22 に登場済み／ユルドゥズは 26/27 の出場69分）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：バルセロナ（ラ・リーガ。TM の現所属 131）・レアル・マドリード（ラ・リーガ。TM の現所属 418、2025-06-01〜）。
# **使った数**（TM の performance-season の、クラブのトップチームの公式戦だけ。代表戦は混ぜない。試合・出場時間・得点・アシスト）
#   クバルシ：23/24 バルセロナ 24試合 1927分 0点1A／24/25 バルセロナ 56試合 4214分 1点4A／25/26 バルセロナ 48試合 3978分 1点0A／26/27 バルセロナ 13試合 1142分 0点2A（11月12日時点。先発 13）
#   ハイセン：24/25 ボーンマス 36試合 2812分 3点2A（クラブW杯のレアルでの5試合450分は除く）／25/26 レアル・マドリード 40試合 3038分 2点2A（先発36）／26/27 レアル・マドリード 12試合 1042分 0点0A（先発12）
#   出ている間のチームの得点・失点（TM。クラブの公式戦、90分あたりに自分で割った値）：
#     クバルシ 25/26 得点115・失点47／3978分 → 2.60・1.06・差+1.54。26/27 得点45・失点17／1142分 → 3.55・1.34・差+2.21
#     ハイセン 25/26 得点76・失点33／3038分 → 2.25・0.98・差+1.27。26/27 得点31・失点9／1042分 → 2.68・0.78・差+1.90
