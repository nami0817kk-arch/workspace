#       支配率 ミラン70.1%／29.9%。シュート 15本（枠内2本）／12本（枠内8本）。
#   ・ESPN 順位表（uefa.europa standings、11/6 取得）: ミラン 4試合1勝3敗 勝ち点3 28位。フェレンツヴァーロシュ 4戦4勝 勝ち点12 3位。
#   ・ESPN 2026-11-05 23:46Z（now.core.api.espn.com/v1/sports/news/50393432 で本文を読んだ）: 週末のダービーでインテルに勝った直後。先発を6人替えた。セリエAは10試合で1敗。ELは4試合で3敗。前半に控えGKトッリアーニのミスから先制された。
#   ・Gazzetta dello Sport 2026-11-05（イタリア語の原文を読んだ）:
#       "Se giochi con la maglia del Milan hai una responsabilità, non puoi andare in campo così."
#       "Forse ho fatto qualcosa di sbagliato negli ultimi giorni. ... Stasera non abbiamo scuse."
#       "Non siamo pronti mentalmente. Non c'entra nulla l'aspetto tecnico. Non c'entra il turnover."
#       "Mi assumo la responsabilità in primis io, perché la squadra è una mia responsabilità"
#       "certamente non mollerò in Europa League. Finché non sarà finita, lotteremo"
#       → 台本の言葉は、この原文を私が日本語にしたもの。「O miglioriamo o finisce qui」（良くならなければここで終わり）は何が終わるのかが文から読めないので使わない。
#   ・ELのリーグフェーズは36チームで8試合。1〜8位がベスト16、9〜24位がプレーオフ、25位以下は敗退（大会の決まり。背景）。
# 自分で数えたもの: シュート15本で枠内2本、相手は12本で枠内8本。ELは4試合で勝ち点3、セリエAは10試合で1敗。24位までの線と、残り4試合。
# 前の本との重なり: posted.json にアモリムのミランのショートは無い（2026-09 の本編で一度扱ったが、台本では過去回に触れない）。20261023_finance_acmilan は財政のシリーズで別の話。
