# 取材メモ（10/7 題材 kubo_january、型は news、日本人枠）。材料の控え: research/raw/20261007_kubo_january.md
# 問い: 久保は本当に1月に出ていくのか／なぜそう書かれたのか。
# 原文で確かめたこと:
#   日本に「1月にソシエダを去る」と伝わった一節は、Estadio Deportivo（10/5）の小見出し「Take Kubo, adiós a la Real Sociedad en enero」。
#   本文はアジアカップで抜ける話だけで、移籍の話は無い（見出しは「problema a la vista para Matarazzo」）。
#   Diario Vasco の「序列低下・早ければ1月に移籍・適切なオファーなら途中でも交渉」は、robots.txt が Claude を断っているので原文に当たっていない。台本では使わない。
#   契約 2029-06-30・違約金6000万ユーロはクラブ発表（2024-02-12）を伝えた記事と Transfermarkt。半分はレアル・マドリード（dorsal16 10/2）。
#   冬の代役探しは dorsal16（10/2、東スポ 10/4 が転載）。「代わりに加える」話で、売る話ではない。
# 同じ日に別の回（アジアカップの招集の仕組み）がある。招集の規定（12日前・FIFA の付属文書）は言わない。最大11試合は見立ての1行と前回比だけ。
# 10/2（今季の軌跡・代表の先発）・10/3（結婚）・10/6（トップ下）と言い回しを重ねない。結婚の話は入れない。
#   9/22 の「どうしようもない」は 10/2 で使ったので、同じ日の「こっちに来たら試合に出られる」を使う。監督の言葉も 10/2（9/6 の会見）とは別の 9/2 の会見。
# 出場の数字: Transfermarkt の試合記録。リーグ戦の最初の7試合で、昨季（8/16〜9/28）と今季（8/21〜9/20）を並べた。
# 反応: Yahoo!ニュース（東スポの代役補強の記事）のコメント欄から2件、スペイン語の個人の投稿（Bluesky）1件。全文。
# 写真: ゲキサカ 9/22 の代表合流の写真（Kaoru WATANABE/GEKISAKA）。冒頭は 01_w（ショートは 01_w_v）。数字の節から 01_side_w（久保を右に寄せた16:9。表が顔にかからない）に1回だけ替える。ショートは 01_side_w_v
