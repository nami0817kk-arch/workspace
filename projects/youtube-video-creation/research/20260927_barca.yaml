      - https://www.espn.com/soccer/story/_/id/49983111/raphinha-ballon-dor-sevilla-luis-garcia-joke-barcelona-hat-trick
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「強すぎるんだよ、まじで」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 強すぎるんだよ、まじで。バランスもいいし穴がない
      - voice: ネット民
        text: ２試合連続ハット。しかも強敵セビージャのアウェー
      - voice: ネット民
        text: この価値は凄いね。
        cont: true
      - voice: ネット民
        text: フリックになってからラフィーニャ覚醒したって言ってたけど、さらに覚醒してとんでもないバケモノになっちまった
      - voice: ネット民
        text: リーズにいた頃にまさかこんなに大化けするとは全く思わんかったわ。
      - voice: ネット民
        text: 本人の才能も凄いが指導者との相性がいかに大事かがよくわかった
        cont: true
      - voice: ネット民
        text: ラフィーニャ何なら本職のWGより、CFの方が生き生きしてる
      - voice: ネット民
        text: 一時メッシ超えの記録も11-12の50ゴールが異次元と再認識させられるのか記録に迫ってラフィーニャすげえってなるのか楽しみ
      - voice: ネット民
        text: 難所攻略。こりゃバルサもハフィーニャも止まらんな。
      - voice: ネット民
        text: バルサファンは向こう数年は楽しそうだね
        short_voice: true
