sections:
  - id: run
    heading: 8戦全勝、36得点
    tier: 報道
    telop: 公式戦8試合で8勝。36得点8失点
    narrator: キャスター
    card:
      type: table
      title: バルセロナ 今季の公式戦
      columns: ['', '']
      rows:
        - [ラ・リーガ, 7試合7勝・31得点7失点]
        - [チャンピオンズリーグ, 1試合1勝・5対1]
        - [合計, 8試合8勝・36得点8失点]
    say:
      - 今季のバルセロナは、公式戦8試合で8勝。点は**36**取って、取られたのは**8**です。
      - 5点以上を取った試合が、8試合のうち**5回**あります。
      - いちばん点を取っているのは、主将のラフィーニャ。公式戦で**14点**です。
      - ラ・リーガは7連勝で首位。2位のアトレティコに、勝ち点で**5**の差をつけています。
      - 8試合目は敵地のセビージャ戦。ラフィーニャが2試合続けてハットトリックを決め、3対1で勝ちました。
      - text: 敗れたセビージャのルイス・ガルシア監督は、こう話しています。
        image: assets/images/20260927_pair_luisgarcia_raphinha/01.jpg
      - voice: ルイス・ガルシア
        text: バルサは最高の水準でプレーしている。ただ、私の関心はセビージャだ
    sources:
      - https://www.espn.com/soccer/story/_/id/50004145/why-barcelona-start-season-laliga-champions-league-best-europe-top-5-leagues-almost-100-years
