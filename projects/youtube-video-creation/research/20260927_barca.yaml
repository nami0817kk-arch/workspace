  - id: century
    main: true
    heading: 上にいるのは98年前の1チーム
    tier: 報道
    telop: 最初の8試合の得失点差で、1928-29年のレアル・マドリード以来の数字
    narrator: キャスター
    card:
      type: table
      title: 最初の8試合の得失点差（5大リーグ）
      columns: [国, クラブ, 得失点差]
      rows:
        - [スペイン, レアル・マドリード 1928-29, ＋31]
        - [スペイン, バルセロナ 2026-27, ＋28]
        - [ドイツ, バイエルン 2016-17, ＋26]
    say:
      - text: 'バルセロナが公式戦で8連勝。36点取って、取られたのは8点です。'
        short_only: true
      - text: この滑り出しは、ヨーロッパの5大リーグで、ほぼ100年ぶりのものです。
        image: assets/images/20260927_barca/01.jpg
      - 比べたのは、シーズン最初の8試合の得失点差。バルサは**プラス28**。
      - ドイツの最高、2016年のバイエルンでも**プラス26**です。
      - これを上回るのは、98年前、1928年のレアル・マドリードだけ。**プラス31**でした。
      - マドリードのその8試合は、すべて国王杯。リーグ戦が始まる前の記録です。
    sources:
      - https://www.espn.com/soccer/story/_/id/50004145/why-barcelona-start-season-laliga-champions-league-best-europe-top-5-leagues-almost-100-years
