# 取材メモ（2026年10月22日）ライスの82分の同点弾で、アーセナルがバイエルンと2対2（ニュースのショート。見せ方 X＝冒頭に強い一言。ライス本人の言葉が取れていないので Y にしない）
# 取材: 2026-10-22。requests（ブラウザUA）で原文を読んだ。控えは research/raw/20261022_rice_arsenal_*（report/presser/odegaard）。
#   ・アーセナル公式 試合レポート（arsenal.com/news/report-bayern-munich-2-2-arsenal-af3gg0j1ufcj）— 全文読んだ。得点の流れ・ライスの得点・次の試合。クラブ公式なので 確定。
#   ・アーセナル公式 アルテタ監督の試合後会見の全文（every-word-from-artetas-post-bayern-presser）— 全文読んだ。発言はここから訳した（言い換えない）。
#   ・アーセナル公式 ウーデゴールの試合後コメント（odegaard-sees-positives-in-bayern-draw）— 全文読んだ。主将の発言。
#   ・ESPN 試合記録API（site.api.espn.com/.../uefa.champions/summary?event=401915312）— 得点・交代・分・シュート数・ボール保持率。試合の記事（PA配信の要約）で「リーグフェーズの14連勝が止まった」。
#   ・ESPN 記事API（content.core.api.espn.com/v1/sports/news/50241594）— 全文読んだ。ライスの得点を「ギェケレシュとのワンツーから低いシュート」と書く。※この題材では使わない数字（ケインの10試合連続など）は題材の外なので落とした。
#   ・フットボールチャンネル 2026-10-22 06:22（題材の出典）— 全文読んだ。日本語の試合経過。
# 得点（ESPN の試合記録＝アーセナル公式・フットボールチャンネルと一致）:
#   25分 エゼ（アーセナル）← ウーデゴール。VAR確認後にゴール／35分 デイビス（バイエルン）← ケインのスルーパス／61分 ケイン PK（ティンバーの手）／82分 ライス（アーセナル）← ギェケレシュ。
#   ギェケレシュは68分にハヴァーツと交代で入った（ESPN・フットボールチャンネルで一致）。ライスの得点は82分（ESPN・FC。アーセナル公式は『残り8分』）。
# 資料のずれ（台本では言わない）:
#   ・ライスのシュートの場所：ESPN記事＝左下／ESPN試合記録の文＝『ゴール中央』／アーセナル公式＝『ファーのコーナー』→ 場所は言わず『低いシュート』だけ。
#   ・サカの交代の分：ESPN・FC＝8分に倒れて10分に交代／アーセナル公式＝9分。→ サカの負傷は別の題材（番号11）なので台本で扱わない。エゼは『サカに代わって入った』とだけ言わない（この題材の答えに要らない）。
#   ・バイエルンのCLホーム成績：ESPN＝グループステージ40戦無敗／アーセナル公式のレポート＝31戦中1敗／ウーデゴールの記事＝32戦中1敗 → 食い違うので使わない。
#   ・アーセナルの無敗：公式＝リーグフェーズ15試合無敗（昨季を含む）。ESPNの記事＝14連勝が止まった。→ 『連勝は14で止まった。ただし無敗は15試合に伸びた』と分けて言う（どちらも出どころがある。引き分けなので14勝1分＝15と整合）。
# 本人の言葉:
#   ライス本人のコメントは取れなかった（アーセナル公式・ESPNに試合後の発言なし）。→ Y にしない。X（冒頭に強い一言）。
#   アルテタ監督（会見）：『We'll take the draw, but it doesn't mean we're really happy about it because we prepared a team to win the game』→ 『引き分けは受け入れます。ただ、大満足というわけではありません。勝つつもりでチームを準備していたからです』
#   ウーデゴール（主将）：『Yeah, probably a fair result to be honest, but I feel like we could have won the game as well.』→ 『正直なところ、妥当な結果だと思います。でも、勝てたとも思っています』
# 自分で数えた比べ（見立て）: 61分のPK→82分の同点まで21分。ギェケレシュが入った68分→82分まで14分。シュート：アーセナル14本（枠内5）・バイエルン13本（枠内5）、ボール保持はアーセナル53.9%（ESPN）。
#   アーセナルのCL連勝は14で止まったが、リーグフェーズの無敗は15試合に伸びた（公式）。
# 10/21 の本（ラヤとアルテタ＝試合前日の『退屈』の声）とは別の切り口：試合そのもの（ライスの同点弾と連勝）。アルテタの『退屈』への答えは扱わない。
# 反応: まとめサイトを探した結果は下記の欄。X は使っていない。
# 写真: アーセナル公式サイトの記事の主写真（© Arsenal FC）と、Commons。Getty の写真は使わない。10/21 の本で使った写真（ラヤ・アルテタ）とは別。出典は credits.json。
