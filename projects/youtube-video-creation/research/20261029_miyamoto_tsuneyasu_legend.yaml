  say:
  - text: 宮本恒靖の代表歴は、時期で分けると形がはっきりします。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/11_w.jpg
    card: {<<: *jpncard, highlight_row: 3}
  - text: デビューは2000年6月、ボリビア戦。最初の2年の出場は5試合でした。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 当時の守備の中央には、森岡隆三がいました。宮本恒靖は、その控えです。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 2002年と2003年で、21試合。ワールドカップを境に、出番が増えていきます。
    card: {<<: *jpncard, highlight_row: 1}
  - text: そして2004年からの3年で、45試合。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/21_w.jpg
    card: {<<: *jpncard, highlight_row: 2}
    emph: true
  - text: 代表の3得点も、すべてこの時期。最初の1点は2004年2月、マレーシア戦です。
    card: {<<: *jpncard, highlight_row: 2}
