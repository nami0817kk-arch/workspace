  say:
  - text: 2011年12月19日。34歳の宮本恒靖は、現役の引退を発表します。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - voice: 宮本恒靖
    text: ピッチに別れを告げる時が来ました。
    card: none
  - text: 引退のあとは、スイスで国際サッカー連盟の大学院コース、フィファマスターに学びます。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/21_w.jpg
    card: {<<: *aftercard, highlight_row: 1}
  - text: 2013年に修了。日本人の元プロ選手として、初めてでした。
    card: {<<: *aftercard, highlight_row: 1}
  - text: そして2024年3月。日本サッカー協会の、第15代の会長に就きます。
    card: {<<: *aftercard, highlight_row: 2}
    emph: true
  - text: 47歳は戦後で最も若く、ワールドカップに出た元Jリーガーの会長は初めてです。
    card: {<<: *aftercard, highlight_row: 2}
  - text: 就任の会見では、こう話しました。
    card: none
  - voice: 宮本恒靖
    text: 選手の時からずっとそうだが
    card: none
  - voice: 宮本恒靖
    text: サッカーをもっと大きな存在にしたい。
    card: none
    cont: true
