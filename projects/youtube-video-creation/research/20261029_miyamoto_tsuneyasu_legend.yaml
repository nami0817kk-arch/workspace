    short_only: true
  - text: 2002年、日韓大会。宮本恒靖は25歳で、守備の中央の控えでした。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/11_w.jpg
    card: none
  - text: 大会の直前には、練習試合で鼻の骨を折っています。
    card: none
