# 宮本恒靖（元日本代表DF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-29。型は 10/28 の松井大輔と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は 英語版/日本語版 Wikipedia の成績表と試合記録、サッカーキング・NHK・Number、自分で足した値だけ。
# **私生活（家族）は入れない。女子サッカーは入れない**。Jリーグは経歴の事実（ガンバ・神戸の所属、2005年の優勝）だけで、サムネの主役にしない。
#
# **重なりの確認（2026-10-29）**：scripts/・research/posted.json で「宮本恒靖」のレジェンド回は0件。
#   research/covered.yaml に 10/27 のニュース「宮本恒靖『開催は簡単じゃない』。初戦まで76日のアジア杯…」（JFA会長としての発言）が1件、
#   scripts/20261027_asiancup_schedule.md・20260929_debut.md・20261022_kawaguchi_yoshikatsu_legend.md に名前が出る。選手としての紹介は未公開。
# **引退の確認**：サッカーキング 2011-12-19 12:50「日韓W杯主将の元日本代表DF宮本恒靖が引退『別れを告げる時が来た』」（web.archive の控えを requests で読んだ）
#   「神戸に所属する元日本代表DF宮本恒靖が、現役生活からの引退を表明した」。英語版も「On 19 December 2011, Miyamoto confirmed his retirement」。→ **現役ではない**。
# **いまの立場**：NHK 2024-03-23「日本サッカー協会 新会長に宮本恒靖氏が就任 47歳 戦後最年少」（web.archive の控え）。英語版の冒頭も「current president of the Japan Football Association」。
#   2026年10月のいまも会長かは、10/27 のニュース（covered.yaml）で会長として発言しているので会長のまま。
# **日本との接点**：全体が日本代表・W杯の話。基礎DATAの次に代表の節を置いた。
#
# **数字の出どころ**
# - 生年月日 1977-02-07 大阪府富田林市（英語版 infobox）→ 2026-10-29 で49歳、2002-06-09 で25歳、2024-03-23 で47歳（NHK も47歳）、2011-12-19 で34歳。
# - 日本代表 71試合3得点（2000〜2006）。英語版の年別：2000=2・2001=3・2002=11・2003=10・2004=19(2点)・2005=15(1点)・2006=11。サッカーキング 2011 も「代表通算は71試合3得点」。
#   区切りは自分で足した：2000〜2003 = 26試合0得点、2004〜2006 = 45試合3得点。2004年の19試合は71試合の27%。
#   デビュー 2000-06-18 ボリビア戦（英語版）。代表初得点 2004-02-07 マレーシア戦（日本語版）。
# - 2002年W杯（英語版 2002 Group H の試合表）：6月4日ベルギー 2対2（71分に森岡隆三と交代で出場）、6月9日ロシア 1対0（稲本51分。先発）、6月14日チュニジア 2対0（先発・主将）。
#   決勝トーナメント1回戦 6月18日 宮城でトルコに0対1（英語版 knockout stage の組み合わせ表）。W杯初勝利はロシア戦。
#   鼻の骨折と顔のガード、「バットマン」：日本語版（日刊スポーツ 2002-06-16「英では『バットマン』宮本が人気!」を引用）。
# - 2006年W杯：オーストラリア戦・クロアチア戦にフル出場、ブラジル戦は警告の累積で出られず。クロアチア戦が代表最後の試合（英語版・日本語版）。
# - 2004年アジアカップ：準々決勝 7月31日 重慶 ヨルダンと1対1（延長）、PK戦4対3（英語版 2004 AFC Asian Cup）。決勝 8月7日 北京で中国に3対1。
#   全6試合フル出場・大会ベストイレブン（英語版）。PK戦で中村俊輔と三都主アレサンドロが続けて外して0対2→主審に申し入れてゴールを替えた（日本語版、Number 2010-05-24）。
#   本人の言葉「ダメもとでいってみたんです」（Number 2010-05-24 page 6。WebFetch の要約で読んだ語。前後の文は確かめていないので、この一言だけ）。
# - ザルツブルク：2006年12月に移籍（英語版）。オーストリアのリーグ戦 21試合0得点（2006-07 が9試合・2007-08 が12試合）。2006-07 にリーグ優勝（英語版 Honors）。2007-08 は左サイドバックでも先発（日本語版、本人のブログ）。
# - 引退：2011年12月19日（サッカーキング・英語版）。本人のコメント（サッカーキング 2011-12-19、本人の公式HPから）「ピッチに別れを告げる時が来ました。2011シーズンを持って現役を引退します。」
# - FIFAマスター：2013年7月19日に修了、日本人の元プロ選手で初（日本語版）。英語版も「a graduate of the 13th edition of FIFA Master」。
# - 会長：2024年3月23日、第15代、47歳は戦後最年少、元Jリーガーでワールドカップ出場経験がある人の就任は初めて（NHK）。言葉「選手の時からずっとそうだがサッカーをもっと大きな存在にしたい」（NHK）。
#
# **入れなかったもの**：家族、2008年の怪我の中身、ガンバ監督の成績、Jリーグの通算数字（サムネにも使わない）、2005年のアジア最終予選のイラン戦（Mehr の写真は 2005年のアザディの事故と結びついているので使わない）。
# **写真**：Commons は 400px 前後の2006年の写真しか無かった（内閣官房内閣広報室、CC BY 4.0。2006-05-16 の代表発表）。
#   JFA 公式の就任の記事（jfa.jp/news/00033797/）の写真 640x480 を足した（JFA の自前の写真。代理店の表記なし）。2002年W杯・2004年アジアカップの写真は使えるものが無い（行では「その試合の写真」と言わない）。
