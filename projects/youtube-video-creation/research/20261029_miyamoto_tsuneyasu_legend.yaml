- id: view
  heading: 控えから始まった宮本恒靖は、なぜ日本の守備の顔になれたのか
  tier: 背景
  telop: 2000〜2003年の26試合と、2004〜2006年の45試合
  viewpoint: true
  card: &viewcard
    type: table
    title: 宮本恒靖の代表を並べる
    columns:
    - 時期
    - 試合
    - 1年あたり
    rows:
    - - 2000〜2003（4年）
      - '26'
      - およそ6.5
    - - 2004〜2006（3年）
      - '45'
      - '15'
    source: Wikipedia
    highlight_row: 0
  say:
  - text: 最後に、宮本恒靖の代表の数字を並べます。
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/11_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 2000年から2003年の4年で、26試合。1年あたり、およそ6.5試合です。
    card: {<<: *viewcard, highlight_row: 0}
  - text: 2004年からの3年は、1年あたり15試合。2倍を超えました。
    card: {<<: *viewcard, highlight_row: 1}
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1年あたり
  - text: 2004年だけで19試合。代表の全出場の、4分の1を超えます。
    card: {<<: *viewcard, highlight_row: 1}
  - text: 控えから入り、鼻を折ったままワールドカップに立ち、
    image: assets/images/20261029_miyamoto_tsuneyasu_legend/21_w.jpg
    card: none
  - text: PK戦では主審に向かって、流れを変える一言を言えた。
    card: none
  - text: 試合を外から見て、動かせる人だった。
    card: none
  - text: その目はいま、会長として、日本のサッカー全体に向いています。
    card: none
  quotes_from: []
  sources:
  - https://en.wikipedia.org/wiki/Tsuneyasu_Miyamoto
