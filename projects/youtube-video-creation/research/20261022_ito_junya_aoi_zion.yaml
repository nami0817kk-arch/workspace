        text: 彩艶と田中碧かな。2人ともよかったと思います。
      - voice: 伊東純也
        text: 彩艶は全試合よかったですけど、
      - voice: 伊東純也
        text: 碧は特にスウェーデン戦とかはエグかったなと思います。
        cont: true
      - voice: 伊東純也
        text: 全部回収してたので。
        cont: true
      - 伊東がいちばんに挙げたのは、鈴木彩艶でした。
      - voice: 伊東純也
        text: 彩艶。めちゃくちゃ止めてたなと思います、
        short_voice: true
      - voice: 伊東純也
