      - 同点の後半アディショナルタイム。
      - 田中碧のボールロストから、逆転ゴールを許しました。
      - 語ったのは、ベルギー1部ゲンクの伊東純也です。
      - 日本代表OBの久保裕也氏のユーチューブ対談で、20日までに公開されました。
      - 聞き手の久保裕也氏は、久保建英とは別人です。
