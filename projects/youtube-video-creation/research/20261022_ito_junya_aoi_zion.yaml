# 取材メモ（2026年10月22日）伊東純也、W杯ブラジル戦の田中碧について「ミスって思ってなかった」。MVPは鈴木彩艶（ニュースのショート。見せ方 Y＝伊東本人の一言から始める）
# 取材: 2026-10-22。requests（ブラウザUA）で本文を全部読んだ。検索エンジンのAI要約は事実に使っていない（URLを見つけるのにだけ使った）。
#   ・Qoly 2026-10-21「日本が世界に誇る久保建英と鈴木彩艶、日本代表の先輩スターが『ガチ査定』…」https://qoly.jp/q1/17871391
#       伊東の発言を一続きで載せている（題の元）。控え research/raw/20261022_ito_qoly_91.txt。
#       「（鈴木）彩艶と田中碧かな。2人ともよかったと思います。／彩艶は全試合よかったですけど、碧は特にスウェーデン戦とかはエグかったなと思います。全部回収してたので。／（田中はブラジル戦で決勝点を奪われるミスがあったが）俺はミスって思ってなかったです。／（MVPは）彩艶。めちゃくちゃ止めてたなと思います、全試合ピンチのところで。あとは、ビルドアップもうまいし、安定してたなと思います。／やっぱりスーパーセーブがあると盛り上がりますし、ベンチもフィールド（上）も。本当に1点失うところを防いでもらったら、本当にすごく大きいので。」
#       **丸括弧は Qoly 編集部の補足**（（鈴木）・（田中は…ミスがあったが）・（MVPは）・（上））。→ 台本の声からは外した（外しても文が成り立つところだけ使う）。
#       **「MVPは」は編集部の補足**なので、台本は「伊東がMVPに挙げた」と地の文で言い、声は「彩艶。めちゃくちゃ止めてたな…」から始める。
#       記事の地の文：伊東は33歳、今大会で日本代表最年長ゴール。久保裕也氏の YouTube に出演。
#   ・Football Tribe 日本語版 2026-10-21 08:57「田中碧に『ミスって思ってなかった』伊東純也が告白！日本代表OBは『取り上げないでほしい』と一部報道に注文」https://football-tribe.com/japan/2026/10/21/360584/
#       **久保裕也氏の公式YouTubeの対談動画（20日までに公開）の発言を文字にした記事**。動画本体は確かめていない（YouTube検索に出なかった）。→ 確度は報道。
#       記事は「そんなに俺はミスって思ってなかったです」（Qoly は「そんな」が無い）。**どちらの文字起こしにも入っている「俺はミスって思ってなかったです。」だけを使う**。
#       記事は「碧は特にスウェーデン戦とかえぐかった」（Qoly は「エグかった」）、「（ボールを）全部回収していたので」（括弧は記事の補足）。→ 台本は **Qoly の文字**で通した（同じ記事の文字に統一）。
#       記事の地の文：「日本代表限定で『W杯でやばかった選手』を訊かれて」「1-1で迎えた後半アディショナルタイム、田中のボールロストからブラジル代表FWガブリエウ・マルティネッリにゴールネットを揺らされた」
#         「試合後、田中はピッチ上で泣き崩れた（が、伊東は『そんなに俺はミスって思ってなかったです』とチームメイトをかばっている）」。→ **泣き崩れた件は使わない**（題に関係が無く、本人を小さく見せかねない）。
#       **「取り上げないでほしい」と言ったのは聞き手の久保裕也氏**（日本代表OB。久保建英とは別人）。伊東の言葉ではない。→ 久保氏の「ミスを取り上げないで」は台本に入れない（「ミス」の語を増やさない・声の半分を超えないため）。台本は久保氏を「聞き手」とだけ言う。
#   ・Jリーグ公式（試合データ）https://www.jleague.jp/match/japan/2026/062903/lineup/ — ブラジル2-1日本、ワールドカップ決勝トーナメント ラウンド32（2026/6/30 02:00 KO＝現地6/29）、ヒューストン。
#       得点：佐野海舟29分（日本）・カゼミーロ56分・ガブリエウ マルティネッリ90+5分（ブラジル）。控え research/raw/20261022_ito_jleague_bra.txt。
#   ・東京中日スポーツ 2026-06-30「クーニャ、涙の田中碧を優しく抱き締め…」https://www.chunichi.co.jp/article/1274334 — 「日本１―２ブラジル」「痛恨の逆転被弾につながるボールロスト」。控え research/raw/20261022_ito_chunichi.txt。
#   ・ESPN の試合データ API（site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=…）で日本の4試合を確かめた。控え research/raw/20261022_ito_espn_wc.json・…_summary.json。
#       オランダ2-2日本（6/14、eventId 760425）／チュニジア0-4日本（6/20、760449）／日本1-1スウェーデン（6/25、760471）／ブラジル2-1日本（6/29、760487）。
#       **失点は 2＋0＋1＋2＝5（自分で足した）**。鈴木彩艶：4試合すべて先発。セーブ（ESPN の記録）オランダ戦4・チュニジア戦0・スウェーデン戦4・ブラジル戦4＝**12**（自分で足した）。
#       田中碧：チュニジア戦・スウェーデン戦は先発、ブラジル戦は78分に鎌田大地と交代で出場、オランダ戦は出場なし＝**3試合**。
#       ESPN の「相手の枠内シュート」は 6・0・5・7 で、セーブ＋失点（6・0・5・6）と1本ずれる試合がある（ブラジル戦）→ **台本は枠内シュートの数を言わない**。セーブ数は ESPN の記録として「記録では」と断る。
#       伊東純也：ブラジル戦は78分に町野修斗と交代（ESPN keyEvents）。→ 台本には入れない（言わないと決めた。伊東の言葉を小さく見せかねない）。
#   ・サッカーキング 2026-09-18 https://www.soccer-king.jp/news/japan/national/20260918/2206292.html — 日本代表は11月14日（土）、シンガポールの国際大会（MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE）でブラジルと対戦。W杯ラウンド32以来の再戦。
#       キックオフ時刻は記事で19時15分だが、他の報道と揺れる（検索結果で別の表記を見た）→ **台本は日付と場所だけ言う**。控え research/raw/20261022_ito_sk_bra1114.txt。
# 日付: 発言は対談動画（20日までに公開）を10/21 に報じたもの。ブラジル戦は 2026-06-29（現地）。
# 題材の一覧の言葉を原文で引き直した点：
#   ・一覧は「ブラジル戦で決勝点を奪われたミスについて『俺はミスって思ってなかった』」。Qoly の「ミス」は編集部の括弧書き。**台本は田中碧のプレーを自分では「ミス」と呼ばず、事実としては「ボールロスト」（記事の語）と言う。「ミス」は伊東の言葉の中にだけ出る**。
#   ・一覧は「伊東はベルギーのヘンク」。clubs.yaml の正式表記は「ゲンク」（aka にヘンク）。→ 台本は「ゲンク」。
#   ・一覧は「碧はエグかった」。Qoly の字は「エグかった」。
# 本人の言葉: 伊東純也本人の言葉あり（Qoly・Tribe の引用）。田中碧本人・鈴木彩艶本人の今回の言葉は無い → 作らない。
# 反応: 探していない（0件。作らない）。precheck の反応0件は残す。approve は --no-voices で。
# 前の本との重なり：scripts/20261018〜22 を grep（伊東・彩艶・碧）。10/18 彩艶のクリーンシート・10/18〜21 の田中碧（リーズ・マンU戦・採点・手袋）・10/21 彩艶のPLベスト11はどれも「伊東がW杯を振り返る」話ではない。
#   10/21 の取材メモ research/20261021_ito_tanaka_brazil_miss.yaml は台本にしていない（未制作）。**今回はMVPの彩艶を主軸にし、碧は伊東の評価を貶さない形で添える**。久保裕也氏の節は落とした。写真は別の組。
# 確度: 伊東の発言は 報道（Qoly・Tribe の文字起こし。動画は未確認）。試合結果は Jリーグ公式データ（確定）。セーブ数の足し算は ESPN 記録の自分の集計（背景）。11/14 の再戦は報道（サッカーキング）。
