#   ・ゲキサカ: 森保一監督から現体制最後のチームキャプテンを任された堂安（フランクフルト）。4-2-3-1の右サイドハーフで先発。前半15分の久保建英の先制点につながったカウンターを、堂安は「相手の特徴を見定めて突いた攻撃」と言い切った。森保監督との戦いは残り1試合（17日パラグアイ戦。試合後の記事の数え方）。
#   ・ESPN の試合データ（fifa.friendly summary event=401916337、2026-11-14）: 日本 3-2 ブラジル。15分 久保建英（アシスト 堂安律のスルーパス）。堂安は先発で72分に坂元達裕と交代。
#   ・堂安の言葉（原文。ゲキサカ。字は変えていない。括弧は記者の補足。台本は読点で行に分けた）:
#       「今日は、過去(この1年間)にブラジルとやった2試合よりも勝つ確率の高い試合内容だったと思う。10回やって少しでも勝つ確率を上げていくことが日本代表のテーマ。カタールW杯の頃の、10回やって1回か2回勝てるかというところから脱却して、5割以上勝てるような試合内容を追い求めている。そういう意味では自信を持てるゲーム展開だった」
#       「前に行く守備をしているので、すごくポジティブなんですよね。下がる守備じゃなくて、取りに行く守備。だから、ボールを奪った後もメンタル的に疲弊していないので、すぐにボールを受けに行ける」
#     台本は括弧の補足「(この1年間)」を外して読む（記者の補足のため）。
# 自分で数えたもの: カタールW杯の頃は「10回やって1〜2回」、いまの目標は「5割以上」＝5回以上。10回のうちの勝ちを3回分以上ふやしたい、という計算（1〜2回→5回以上）。
