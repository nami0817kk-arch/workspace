      <<: *view
      highlight_row: 1
  - text: 題への答えです。消えたのは、チャンピオンズリーグの賞金でした。
    emph: true
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 費用はほぼ同じまま、収入だけが減りました。
    emph: true
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: この年のリーグは、2位でした。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 今季は、チャンピオンズリーグのリーグフェーズに直接出ています。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 上田は2026年の夏、リールへ移りました。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 上田らを決算のあとに手放したことで、約1900万ユーロの利益が出ています。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: クラブは、スタジアムの会社と一つになった分も入れて、見通しを出しています。
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 今季の収入は、1億6000万ユーロを超える見込みです。
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 次の決算の注目は、賞金が戻って、本業の収支を黒字にできるのか。
    emph: true
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
