# クラブの財政：フェイエノールト（11/28 土、シリーズ「クラブの財政」、key: finance_feyenoord、型は news）。
#
# 題材の選び方：デロイトの上位は既出（残るエヴァートンは決算の一次資料が取れず女子チームの売却益が主役＝11/2 アヤックスの控えのとおり）。
#   11/2 アヤックスと同じく「決算の一次資料が読めるエールディヴィジ」から。フェイエノールトは 2025-26 の年次報告書（監査済み・全文PDF）が公開済み。
#   ★「収益の大きいクラブから」からは外れる（2025-26 の収入 1億1525万ユーロ）。
#   11/30 の PSV と対にする：同じ「欧州の賞金が減った年」に、フェイエノールトは赤字、PSV は黒字。
# 重なりの確認（11/21）：scripts/*finance_* に feyenoord 無し。posted.json・covered.yaml にフェイエノールトの財政の回は無い。
#   同じ日（11/28）の別シリーズ：クラブ紹介＝ユヴェントス、監督＝アモリム、世界レジェンド＝ベイル（research/20261127_picks.txt）。重ならない。
# ★今季も1部：年次報告書に「2026-2027 の UEFA チャンピオンズリーグのリーグフェーズに直接出場」。fcupdate.nl の 2026/27 エールディヴィジ順位表（11/21 取得）で12試合・2位。
# ★日本との接点：年次報告書の「Topscorer Eredivisie Ayase Ueda 25」（2025-26 の得点王）、2025-26 に獲った選手の一覧に Tsuyoshi Watanabe（渡辺剛）、
#   決算日後に移籍した選手の一覧に Ayase Ueda（リールへ。research/20261120_ueda_lille_stadium.yaml）。題と1行ずつで使う。
#
# **決算期**：Feyenoord Rotterdam N.V.、2025-07-01〜2026-06-30。年次報告書は 2026-10-09 ごろ公表（fr12.nl 2026-10-09 の記事が全文PDFへリンク）。
# **出どころ（読んだもの。2026-11-21 に requests で PDF を取って pypdf で全文を読んだ）**
#   ○ フェイエノールト 年次報告書 2025-2026（76頁）https://cdn.sanity.io/files/2hlolhb1/production/da0ec2816fdc43c4fdb339df889709ebb39a784e.pdf
#     KERNCIJFERS（千ユーロ、2025-26／2024-25）：Netto omzet 115.249／166.714、Bedrijfslasten 140.959／140.575、Operationeel resultaat −25.710／26.139、
#       Spelersresultaat 9.394／5.366、Bedrijfsresultaat −16.316／31.505、Financiële baten en lasten −688／−433、Resultaat voor belastingen −17.004／31.072、
#       Belastingen 4.388／−8.017、Resultaat na belastingen −12.616／23.055、Eigen vermogen per 30 juni 24.692／37.308、Werkkapitaal −42.582／−40.872、FTE 444／402
#     OMZET：Wedstrijdbaten 43.245／98.492、Partnerships, business seats, units en boarding 47.028／45.238、Mediabaten 11.791／11.716、Merchandising & B2C 4.618／4.544、Overige baten 8.567／6.724
#     EUROPEES VOETBAL：Prijzengeld 15.248／62.233、Recettes 7.092／14.464、Partnerships 156／1.083、Mediabaten 193／−、計 22.689／77.780
#     BEDRIJFSLASTEN：Kostprijs van de omzet 14.290／14.001、Lonen, salarissen en sociale lasten 83.082／84.237、Afschrijvingen 1.979／1.559、Overige bedrijfskosten 41.608／40.778
#     本文：「De lonen ... daalden met circa EUR 1,1 miljoen. Tegenover een daling als gevolg van lagere premies Europees voetbal aan spelers en staf, is er sprake een stijging door meer fte's en is er verder geïnvesteerd in de selectie en staf van het eerste elftal. Voorts is sprake van beëindigingsvergoedingen voor onder andere de technische staf.」
#     本文：「Het resultaat vergoedingssommen bedraagt EUR 62,6 miljoen」（パイシャン→マルセイユ、ハンツコ→アトレティコ、ミランボ→ブレントフォード、ハルトマン→バーンリー、ティンバー→マルセイユ）
#       「De afschrijvingen op vergoedingssommen, inclusief tekengelden en commissies ... EUR 53,2 miljoen ... extra afboeking van EUR 14,4 miljoen」。獲った選手に「Tsuyoshi Watanabe」。
#     監査役会の報告：「Feyenoord heeft over het boekjaar 2025-2026 een negatief resultaat behaald van EUR 12,6 miljoen. De lagere opbrengsten uit Europees voetbal hadden een wezenlijke impact op het resultaat. Het resultaat is daarmee teleurstellend.」
#     試合：2025-26 は CL 予選のホーム1試合と、ヨーロッパリーグのリーグフェーズのホーム4試合（前の年は CL のホーム6試合）。fr12：EL はリーグフェーズで敗退、前の年は CL ベスト16（achtste finales）。
#     見通し：「de omzet in seizoen 2026-2027 naar verwachting naar het niveau van het recordjaar 2024-2025, ruim EUR 160 miljoen. Het operationeel resultaat zal naar verwachting positief zijn.」（スタジアムの会社を2026-07-14に一つにした分を含む）
#     決算日後：「Ramiz Zerrouki, ... Ayase Ueda, ... getransfereerd. Met deze transfers is een positief resultaat vergoedingssommen gerealiseerd van circa EUR 19 miljoen.」
#   ○ fr12.nl 2026-10-09「Jaarcijfers Feyenoord: omzet daalt fors, nettoverlies van 12,6 miljoen euro」（数字は報告書と一致。EL リーグフェーズ敗退・前年 CL ベスト16）
# ★使わなかったもの：スモーレンブルフ財務担当の発言（読みが割れる・記事経由）、個別の移籍金、ファン・ペルシ監督の話、スタジアムの統合の中身（1行だけ）。
# 自分で計算した数（検算済み）
#   収入の減り 166.714−115.249=51.465（−30.9%）／試合の収入の減り 98.492−43.245=55.247／欧州の減り 77.780−22.689=55.091／賞金の減り 62.233−15.248=46.985
#   欧州の割合 77.780÷166.714=46.7%→約47%／22.689÷115.249=19.7%→約20%
#   人件費÷収入 84.237÷166.714=50.5%→約51%／83.082÷115.249=72.1%→約72%
#   費用の増え 140.959−140.575=0.384／人件費の減り 84.237−83.082=1.155
#   本業の悪化 26.139+25.710=51.849／自己資本 37.308−12.616=24.692 ✓
