  say:
  - text: フェイエノールトの直近の決算は、2026年6月までの1年間のものです。
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 10月に、クラブの年次報告書が出ました。
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 収入は、約1億6700万から、約1億1500万ユーロへ。約31%の減りです。
    emph: true
    card:
      <<: *rev
      highlight_row: 0
  - text: いちばん減ったのは、試合の収入。9849万から4325万ユーロへ。
    card:
      <<: *rev
      highlight_row: 1
  - text: 試合の収入には、欧州の大会の賞金も入ります。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: スポンサーと法人席は、4524万から4703万ユーロへ。少し増えました。
    card:
      <<: *rev
      highlight_row: 2
  - text: 放映権などの収入は、約1180万ユーロで、ほぼ同じです。
    card:
      <<: *rev
      highlight_row: 3
