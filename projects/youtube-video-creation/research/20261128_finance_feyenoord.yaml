  say:
  - text: 前の年、フェイエノールトはチャンピオンズリーグで、ベスト16まで進みました。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: この年は、チャンピオンズリーグの予選に1試合ホームで出たあと、ヨーロッパリーグへ。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: ヨーロッパリーグでは、最初の段階のリーグフェーズで敗退しました。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 欧州の大会の賞金は、6223万から1525万ユーロへ。
    emph: true
    card:
