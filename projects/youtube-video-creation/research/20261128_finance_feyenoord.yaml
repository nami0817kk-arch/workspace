  say:
  - text: フェイエノールトの直近の1年は、1260万ユーロの赤字。
    short_only: true
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: 前の年は、2306万ユーロの黒字でした。
    short_only: true
    image: assets/images/20261128_finance_feyenoord/01_w.jpg
    card: none
  - text: この年、上田綺世は25点を決め、リーグの得点王に輝きました。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 日本代表の渡辺剛も、この年に加わった選手の一人です。
    image: assets/images/20261128_finance_feyenoord/02_w.jpg
    card: none
  - text: 選手を売った移籍金の利益は、6260万ユーロ。ハンツコのアトレティコ行きなどです。
    image: assets/images/20261128_finance_feyenoord/03_w.jpg
    card: none
  - text: ただ、獲った選手の移籍金は、毎年少しずつ費用にします。
    image: assets/images/20261128_finance_feyenoord/03_w.jpg
    card: none
  - text: その分などが、5320万ユーロ。
    image: assets/images/20261128_finance_feyenoord/03_w.jpg
    card: none
  - text: 差し引きの、選手の売買の結果は、541万から939万ユーロの黒字へ。
    card:
      <<: *pl
      highlight_row: 1
  - text: それでも、税を引く前の損益は、1700万ユーロの赤字。
    card:
      <<: *pl
      highlight_row: 2
  - text: 税の戻りが約440万ユーロあり、最終の損益は1260万ユーロの赤字でした。
    emph: true
    callword: 赤字
    card:
      <<: *pl
      highlight_row: 3
  - text: 自己資本、つまり資産から借金などを引いた額は、3731万から2469万ユーロへ。
    card:
      <<: *pl
      highlight_row: 4
  - text: 1年で、約3分の1が減りました。
    image: assets/images/20261128_finance_feyenoord/03_w.jpg
    card: none
  - text: 報告書の中で、クラブの監査役会は、この結果をこう書いています。
