    narrator: 解説
    say:
      - 2点のリードは、10分もたたずに消えました。
      - まずカルロス・アウグストが左足で決めます。
      - 続いてニコロ・バレッラ。中盤でハッサン・カマラからボールを奪い返したところから始まりました。
      - バレッラはチュラムの落としに一度足を滑らせています。それでも立ち上がって、角度のないところから右足で突き刺しました。
    official: false
