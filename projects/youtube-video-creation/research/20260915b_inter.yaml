      - 前半のうちに2対2。後半はインテルの時間でした。
      - チュラムが逆転弾。ピオ・エスポジトが流れるような攻撃を仕上げ、ボニーが続きます。
      - ウディネーゼも終盤にゲイエが1点を返しましたが、5対3。
      - インテルはローマとともに、開幕から勝ち続けています。
