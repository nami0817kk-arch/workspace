      - この1点で、74本のジャイール・ローザ・ピントを抜きました。
      - 歴代では、**2位**です。
      - 1位はマルセリーニョ・カリオカの**78本**。**あと3本**で並びます。
      - クリスティアーノ・ロナウドは64本、マラドーナは61本です。
      - メッシは**39歳**になっています。
