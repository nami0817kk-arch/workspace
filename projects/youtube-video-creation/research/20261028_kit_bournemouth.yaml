# ユニフォームとエンブレムの歴史 ボーンマス（10/28 作成）。雛形は 10/27 サンダーランド回。
# 題の問い：ボーンマスの赤と黒の縞は、どこから来たのか（答え＝1971年、ジョン・ボンド監督がACミランを手本に入れた）。
# 重なり確認（2026-10-28）：scripts/*kit_*・research/covered.yaml・research/posted.json を grep。ボーンマスのユニフォーム回は無し。
#   20260920_pl01_bournemouth（クラブ紹介・38日前）は「赤と黒の縦じまは、イタリアのミランが手本です」の1行だけ。
#   20261009_stadium_bournemouth（スタジアム）はディーン・コートの名の由来。この回では競技場の話はしない。
#   20261023_bournemouth_milan_3_0（ニュースのショート）はミラン戦の中身。この回では結果の1行だけ（退場・PKの経過は言わない）。
# 今季のリーグ：ウィキペディア en "2026–27 AFC Bournemouth season"（league = Premier League、プレミア5季連続）。
#   ESPN scoreboard（uefa.europa 2026-10-22）：AFC Bournemouth 3-0 AC Milan、12,130人。ウィキペディアの季の記事とも一致。
# 取材：requests（ブラウザ User-Agent）だけ。ブラウザ操作・JS実行・検索のAI要約は使っていない。
#   読んだ：ウィキペディア en "AFC Bournemouth"（History の Boscombe／AFC Bournemouth 節、Colours 節とメーカー・スポンサーの表）、
#     "2026–27 AFC Bournemouth season"、"Dickie Dowsett"（infobox）、"AC Milan"（founded、キルピンの言葉）。
#   Historical Football Kits（HFK。ファンの資料サイトだが典拠を明記）：ボーンマスの Background。
#   読めなかった：クラブ公式 2013-07-15「Cherries launch evolved crest」（web.archive／Commons API が 429）。
# ---- 食い違い・断ったこと ----
#   ・AFCボーンマスへの改名：ウィキペディア「1971〜72年のシーズンの初めから」、HFK「1972年」→「1970年代の初め」とだけ言う。年は言わない。
#   ・改名の理由（アルファベット順で先頭）：ウィキペディアが個人のブログを引く→「と言われます」で1行。
#   ・ヘディングの紋章：ウィキペディア「改名の1年後」、HFK「1972年の後に冊子に出たロゴ、シャツに付いたのは1974〜75年の1季」→
#     紋章ができたのは1972年ごろ、シャツには1974年から75年の1季、とだけ言う。
#   ・街の紋章が最後にシャツに出た年：HFK の中で 1970〜71 と 1974〜75 が割れる→言わない。
#   ・チェリーズの由来：ウィキペディア・HFK とも2説（さくらんぼ色の縞／クーパー・ディーン家の桜の木）→2説のまま言う。どちらとも決めない。
#   ・赤と黒の縞の時期：ウィキペディア「1990年からはほとんど」（レドナップの自伝）、HFK・ウィキペディア「1971年に入れた」→
#     入れたのは1971年。2004〜06年の2季は赤が主のシャツ、2006〜07年に縞へ戻った（ウィキペディア）。
#   ・メーカーの表はウィキペディアに「典拠が要る」の印。HFK の一覧と照らして食い違いは無い（1981〜82年はクラブの自前）。
#   ・2013年の新しい紋章：HFK「2013〜14年の季から、名前が金に、赤と白の縞の模様が消えた」→その2点だけ言う。
# ---- 自分で数えた数 ----
#   ミランの赤と黒：2026−1899＝127年。ボーンマスの赤と黒：2026−1971＝55年。127÷55≒2.31→およそ2.3倍。
#   創立：ボスコムFC 1899年秋（ウィキペディア）、ミラン 1899年12月（ウィキペディア。クラブは16日、記事の infobox は18日）→「同じ1899年」とだけ言う。
#   メーカー（ウィキペディアの表、1981〜82年の自前は数えない）：アンブロ74-78・アディダス78-81・オスカ82-83・アンブロ83-86・ヘンソン86-87・
#     スコアライン87-90・エルグレン90-92・マッチウィナー92-95・ル・コック95-96・パトリック96-2000・スーパー・リーグ00-01・TFG 01-03・
#     ボーン・レッド03-08・カーブリーニ08-11・フィラ11-14・カーブリーニ14-15・JD 15-17・アンブロ17-26・ヒュンメル26-＝のべ19回（17社）。
#     アンブロ3回、カーブリーニ2回。1974年から 2026−1974＝52年。52÷19≒2.74→約2.7年。
#     いちばん長いのはアンブロの2017〜2026年＝9年。9÷2.74≒3.3倍。
#   ダウセット：ボーンマス＆ボスコム・アスレティックで1957〜62年、リーグ戦169試合79得点（infobox はリーグ戦だけの数）。
# ---- 日本との接点 ----
#   無し（research/pl_data/japan.json が空。メーカーにも日本の会社は無い）。入れない。
# ---- 写真（assets/images/20261028_kit_bournemouth/、出典は credits.json）----
#   k01・k02・k03 は Sky Sports の記事の写真（10/23 のニュースで取り込んだもの）。代理店の透かしは見当たらないが、Sky の写真の配信元は確かめていない。
#   k04（タヴァニエ）・k05（クライファート）は Commons の CC0。エンブレム画像・放送映像は使っていない。
