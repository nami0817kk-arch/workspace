  telop: 赤と黒の年数は、ミラン127年、ボーンマス55年。およそ2.3倍
  card: *view
  say:
  - text: 同じ1899年に生まれた、2つのクラブ。赤と黒を着てきた年数を、比べます。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
    emph: true
  - text: ミランは、1899年から127年。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *view
      highlight_row: 0
  - text: ボーンマスは、1971年から55年。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *view
      highlight_row: 1
    mark:
      kind: circle
      row: 1
  - text: 127年は、55年のおよそ2.3倍。手本のほうが、2倍あまり長く着ています。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card:
      type: calc
      title: 赤と黒の年数の比べ（自分で割った）
      terms:
      - - 127年
        - ミラン
      - - 55年
        - ボーンマス
      - - 約2.3倍
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: その55年のあいだ、シャツの会社は、平均で3年に届かずに替わりました。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card:
      type: calc
      title: メーカー1回あたりの平均（自分で割った）
      terms:
      - - 52年
        - 1974年から
      - - 19回
        - メーカー
      - - 約2.7年
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: それでも、2年で戻した縞は、手本を真似てから55年、胸に残っています。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card: none
  - text: 手本と初めて公式戦で会った夜は、3対0で、ボーンマスの勝ちでした。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
