sections:
- id: milan
  main: true
  heading: ボーンマスの赤と黒の縞は、どのクラブを手本にしたのか
  bg: assets/images/20261028_kit_bournemouth/k01_adli.jpg
  tier: 背景
  narrator: 解説
  telop: 赤と黒の縞は1971年から。手本はイタリアのACミラン
  card: *milan
  say:
  - text: 今回は、ボーンマスの、赤と黒の縞と、胸の紋章です。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card: none
    emph: true
  - text: 2026年10月22日、ヨーロッパリーグ。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
  - text: ボーンマスは本拠地で、イタリアのACミランを3対0で破りました。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card:
      <<: *milan
      highlight_row: 3
  - text: 赤と黒の縞のボーンマスと、赤と黒の縞のミラン。この夜、ミランは白でした。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
  - text: 実は、ボーンマスの赤と黒は、このミランが手本です。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
    emph: true
  - text: 入れたのは1971年。当時の監督、ジョン・ボンドです。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *milan
      highlight_row: 1
  - text: 同じころ、クラブの名前も、いまのエーエフシー・ボーンマスに変わります。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *milan
      highlight_row: 2
  - text: イングランドのクラブを並べた一覧で、先頭に来るように、と言われています。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
  - text: では、手本のミランは、なぜ赤と黒なのか。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
  - text: ミランを作ったイングランド人、ハーバート・キルピンの言葉が残っています。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card:
      type: document
      label: ハーバート・キルピン（1899年。ウィキペディアの英訳を訳した）
      paragraphs:
      - 我々は悪魔のチームになる。色は、炎のような赤と、相手に与える恐れのような黒だ。
      highlight:
      - 炎のような赤
      - 恐れのような黒
  - text: ミランの生まれは、1899年。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
  - text: そして、ボーンマスの前身、ボスコムFCが生まれたのも、同じ1899年でした。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *milan
      highlight_row: 0
    emph: true
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - https://www.historicalkits.co.uk/Bournemouth/Bournemouth.htm
  - https://en.wikipedia.org/wiki/AC_Milan
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_AFC_Bournemouth_season
- id: colours
  heading: 赤と黒の前は、何色だったのか
  bg: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
  tier: 背景
  narrator: 解説
  telop: 最初は赤と白の縦縞。愛称チェリーズの由来には2つの説
  card: *colours
  say:
  - text: 赤と黒の前、最初のシャツは、赤と白の縦縞でした。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card:
      <<: *colours
      highlight_row: 0
    emph: true
  - text: 愛称は、チェリーズ。さくらんぼです。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
  - text: 由来には2つの説があります。さくらんぼ色の縞のシャツから、という説。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
  - text: もう1つは、土地を貸した家の敷地に、桜の木が多かったから、という説です。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
  - text: 1923年、プロのリーグに入るとき、名前をボーンマス＆ボスコム・アスレティックに。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *colours
      highlight_row: 1
  - text: 当時のリーグで、いちばん長いクラブ名だった、とされます。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
  - text: 1930年代の半ばには、アーセナルのような、赤に白い袖のシャツ。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *colours
      highlight_row: 2
  - text: 胸には、ボーンマスとボスコム、2つの町の紋章から作った印を付けました。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
  - text: 1960年代の終わりには、紋章の代わりに、頭文字のビー・エフ・シー。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card:
      <<: *colours
      highlight_row: 3
  - text: そして1971年、赤と黒の縞が来ます。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *colours
      highlight_row: 4
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - https://www.historicalkits.co.uk/Bournemouth/Bournemouth.htm
- id: crest
  heading: 紋章で、頭でボールを打っているのは誰か
  bg: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
  tier: 背景
  narrator: 解説
  telop: 紋章の人は、1950〜60年代の点取り屋ディッキー・ダウセット。リーグ戦79得点
  card: *crest
  say:
  - text: 改名のあと、クラブは新しい紋章を作ります。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 後ろに縞、手前に、頭でボールを打つ選手の横顔。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card: none
  - text: クラブによれば、この横顔は、ディッキー・ダウセット。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card: none
    emph: true
  - text: 1957年から62年まで、ボーンマスで点を取り続けたフォワードです。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card: *dowsett
  - text: リーグ戦169試合で、79得点。2試合に1点に近い割合です。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card:
      <<: *dowsett
      focus: 2
    emph: true
  - text: けれど、シャツの胸に載ったのは、1974年から75年の1季だけ。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 1981年には、愛称に合わせた、チェリーズの紋章に替わります。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: ところが1983年、ヘディングの紋章が戻ってきました。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card:
      <<: *crest
      highlight_row: 3
    emph: true
  - text: そこから30年あまり、少しずつ手を入れながら、使い続けます。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
  - text: この紋章の中には、最初のシャツの、赤と白の縞が残っていました。
    image: assets/images/20261028_kit_bournemouth/k03_tifo.jpg
    card: none
  - text: 2013年、クラブの名前を金色にした紋章に。赤と白の縞の模様は、ここで消えました。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *crest
      highlight_row: 4
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - https://en.wikipedia.org/wiki/Dickie_Dowsett
  - https://www.historicalkits.co.uk/Bournemouth/Bournemouth.htm
- id: makers
  heading: 縞をやめた2年と、シャツを作る会社は何回替わったのか
  bg: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
  tier: 背景
  narrator: 解説
  telop: 2004年からの2季は赤が主のシャツ。ファンの声で縞に戻った。メーカーは1974年から、のべ19回
  card: *makers
  say:
  - text: ボーンマスの赤と黒の縞は、一度だけ、外されたことがあります。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
    emph: true
  - text: 2004年からの2季は、赤が主のシャツでした。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
  - text: ファンの求めで、2006年の季から、縞に戻ります。
    image: assets/images/20261028_kit_bournemouth/k05_kluivert.jpg
    card: none
  - text: 一方、ボーンマスのシャツを作る会社は、よく替わってきました。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card: *makers
  - text: 1974年のアンブロから数えて、のべ19回。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card:
      <<: *makers
      highlight_row: 0
    emph: true
  - text: アンブロは3回、カーブリーニは2回、使われました。
    image: assets/images/20261028_kit_bournemouth/k04_tavernier_w.jpg
    card:
      <<: *makers
      highlight_row: 1
  - text: いちばん長く続いたのは、アンブロの2017年からの9年。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card: none
  - text: そして今季、2026年からは、デンマークのヒュンメルです。
    image: assets/images/20261028_kit_bournemouth/k01_adli.jpg
    card:
      <<: *makers
      highlight_row: 3
  - text: ミランを破った夜の赤と黒も、このヒュンメルのシャツでした。
    image: assets/images/20261028_kit_bournemouth/k02_milan.jpg
    card: none
  sources:
