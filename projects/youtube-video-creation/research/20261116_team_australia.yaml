sections:
- id: hook
  heading: オーストラリアは、アジアに移って何が変わったのか
  tier: 背景
  telop: W杯は、アジアに移ってから6大会すべてに出場
  narrator: 解説
  main: true
  say:
  - text: オーストラリア代表。フィファランクは26位の国です。
    image: assets/stats/tb_australia_data_t.png
    short_only: true
    no_telop: true
  - text: 日本と、ワールドカップでもアジアカップでも戦ってきた国です。
    image: assets/stats/tb_australia_data_t.png
    no_telop: true
  - text: オーストラリアは、2006年に、オセアニアからアジアへ移りました。
    image: assets/stats/tb_australia_data_t.png
    no_telop: true
  - text: それまでの8大会、1974年から2002年で、W杯に出たのは1回だけ。
    image: assets/stats/tb_australia_data_r1.png
    no_telop: true
  - text: 2006年からは、6大会で、毎回本大会に出ています。
    image: assets/stats/tb_australia_data_r1.png
    no_telop: true
    emph: true
  - text: 2015年には、アジアカップで優勝しました。
    image: assets/images/20261116_team_australia/b01_w.jpg
    no_telop: true
  - text: アジアに移ったことで、この国の数字は、どう変わったのでしょうか。
    image: assets/stats/tb_australia_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Australia_at_the_FIFA_World_Cup
  - https://en.wikipedia.org/wiki/Australia_men's_national_soccer_team
- id: data
  heading: オーストラリア代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: オーストラリア代表の基礎DATA
  narrator: 解説
  say:
  - text: オーストラリアのフィファランクは、10月7日の発表で**26位**。日本は17位です。
    image: assets/stats/tb_australia_data0.png
    no_telop: true
  - text: ワールドカップは7回出場。いちばん上はベスト16で、2006年と2022年です。
    image: assets/stats/tb_australia_data1.png
    no_telop: true
  - text: 2026年は、決勝トーナメント1回戦でエジプトにPK戦で敗れました。
    image: assets/stats/tb_australia_data2.png
    no_telop: true
  - text: アジアカップは、2015年に優勝。2011年は準優勝です。
    image: assets/stats/tb_australia_data3.png
    no_telop: true
  - text: 連盟は、2006年からアジア。それまではオセアニアでした。
    image: assets/stats/tb_australia_data4.png
    no_telop: true
  - text: 監督は、オーストラリア出身のトニー・ポポビッチ。2024年9月の就任です。
    image: assets/stats/tb_australia_data5.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
  - https://en.wikipedia.org/wiki/Australia_men's_national_soccer_team
