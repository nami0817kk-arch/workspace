  say:
  - text: 締めくくりに、バリオスのここ3つの季を、同じ物差しで並べます。
    image: assets/images/20261105_player_775605/s2/b.jpg
    card:
      <<: *view_card
      highlight_row: 0
  - text: ゴールとアシストの合計を、90分あたりに直すと、2024年から25年は0.19。
    card:
      <<: *view_card
      highlight_row: 3
  - text: けがの多かった昨季は0.15。
    card:
      <<: *view_card
      highlight_row: 3
  - text: 今季はここまで0.22。3つの季で、いちばん高い数字です。
    card:
      <<: *view_card
      highlight_row: 3
    emph: true
    mark:
      kind: circle
      row: 3
  - text: 市場価値も、昨季の終わりの5500万ユーロから、10月にはこれまでで最高の値へ。
    card:
      <<: *view_card
      highlight_row: 4
  - text: ただし今季はまだ817分。昨季の3分の1ほどの時間で出た数字です。
    image: assets/images/20261105_player_775605/e1/01_w.jpg
    card: none
  - text: 数字は、11月4日時点のもの。
    card: none
  - text: 次は11月8日、ホームでのバルセロナ戦。
    card: none
  - text: 中盤の真ん中で、この数字がどこまで伸びるかに注目です。
    card: none
