# 取材メモ（10/6 シリーズ「記録の解説」、key: record_kane、型は news）。材料の控えは research/raw/20261006_record_kane.md。
# 何の記録か: イングランド代表の最多出場（シルトン125）。ケインは124で、10/6 のチェコ戦に出れば並び、抜くのは11/12 のクロアチア戦（The FA の一覧・日程）。
#   最多得点（89）は2023年3月に既に更新済み（The FA）。年間10点以上を3度（2019年12・2021年16・2026年11）は The FA の会見記事と Opta。
#   サッカーキングの「2026年は10」はクロアチア戦の2点目の前の数。FA・BBC・Wikipedia の一覧はどれも11なので11で通す。
# 比べ: 120試合の時点の得点は Wikipedia の得点一覧（85点目が119試合目、86点目が122試合目）から自分で数えた。1年あたりの試合は自分で割った値。
# 重ねない: 10/4 のイングランド対クロアチアの回（試合の中身・ビリッチ・モドリッチ）は1行だけ。ロナウドの回（10/2〜10/4）の話は出さない（ケインの「160、170、180」も名前を付けない）。
# バイエルンとの契約は確度が低いので1行（報道）。反応は入れない回（シリーズ。数字の表が主役）。
# 写真は Commons だけ（Bryan Berlin・YantsImages・Кирилл Венедиктов・Number 10・Dingleberries2001）。代理店の写真は使っていない。
#   時期ごとに切り替え: 2026 W杯（冒頭・基礎DATA）→ 2016 ドイツ戦（デビューのころ）→ 2018 ロシアW杯の練習→ 2023（得点の記録を抜いた年）→ 2026 W杯 → トゥヘルと並べた1枚。
