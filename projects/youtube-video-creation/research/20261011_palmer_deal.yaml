# 取材メモ（10/11 題材 palmer_deal、型は news、プレミア枠）。材料の控えは research/raw/20261011_palmer_deal_material.md。
# **ショートだけ作る**（ユーザー指示。台本は1本で、`short` が山場の節を切り出す）。
# **契約の年数と金額は、クラブが発表したものだけ**を言い切る。
#   クラブ公式が書いたのは「2034年まで」「あと8年」「2023年8月加入」「138試合91ゴール関与」
#   「今季7試合で4得点2アシスト」だけ。**金額は1円も書いていない**（材料 1）。
#   「もとは2033年まで」「1年の延長」「条件の改善」「移籍金4250万ポンド」は報道なので、
#   ④で**必ず「と報じられています」「と伝えられています」を付ける**（材料 2）。
# 本人の談話は**クラブ公式・Sky Sports・BBC の3つで一字一句同じ**。原文のまま引き、
#   訳は**声に出して通る形**にした（原文の語順はなぞらない。材料 3）。
# **BBC は requests で読めた**（200）。弾かれなかった。
# **マレスカ（元チェルシー監督）には触れない**（10/10 に1本出しているため）。いまの監督はシャビ・アロンソ。
# **山場（②）に板を入れてある**（10/10 に5本踏んだ「発言の行に板が1枚も付かない」対策）。
#   行ごとに表を分けて highlight_row を 0→1→2 と動かし、**いちばん強い1行
#   （「大きなタイトルを、続けて取れている」）だけ card: none で板を外して顔だけ**にする。
#   `card:` を消すだけでは板が引き継がれるので、必ず none と書く。
# 数字の重なり対策：『2034年』は①と④、『138試合』『91』は①だけ、『38か月』『96か月』『2.5倍』は④だけ。
# **次の試合は日程を引いて確かめた**：10月17日、アウェイのエヴァートン戦（ESPN の scoreboard）。
#   チェルシー公式の記事の末尾にある「Next up … Tottenham Hotspur」はチケットの案内で、次の試合ではない。
# 写真は**チェルシー公式が自分のサイトに載せた1枚だけ**（契約書にサインしている場面、2000x1263）。
#   16:9（01_w）と 9:16（01_v）は tools/facecrop.py で切った。
#   代理店（Getty・AFLO・AFP・ロイター・IMAGO・AP・PA・EPA・共同）の写真は1枚も取り込んでいない。
#   Sky Sports の 1600x900 は代理店の配信の疑いがあるので外した。
# サムネ：構図 face（点検を通すために1案だけ書いた。**決めるのはユーザー**。案は報告に3つ出す）。
# ネットの反応は集めていない（この題材は反応なしで出す）。
