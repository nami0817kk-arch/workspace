  takeaway: チェルシーが10月10日、コール・パーマーとの新しい契約を発表した。クラブの発表文にあるのは「2034年まで」「あと8年」という書き方で、金額には触れていない。もとの契約は2033年までで、1年の延長に条件の改善が付いたと報じられている。本人はクラブの発表の中で三つのことを挙げた。クラブが正しい方向に進んでいると感じること、オーナーとスポーティングディレクターと監督と話して自信をもらったこと、そして「このクラブでは大きなタイトルを、続けて取れている。そう感じるんだ」。加入は2023年8月で、クラブの数えでは138試合に出て91のゴール関与。加入からきょうまでが38か月、これから残るのが96か月で、過ごした時間の約2.5倍を先に約束したことになる。発表の当日はボーンマス戦に先発し、開始2分のヘンダーソンの先制点をアシストした
