# 取材メモ（10/10 題材 lyon_nakamura、型は news、日本人枠）。材料の控えは research/raw/20261010_lyon_nakamura_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場の節を切り出す）。
# **いちばん気をつけたところ：「ランス」の取り違え**（材料 0）。
#   この試合の相手は **Lens（RCランス、北部パ・ド・カレー県、Stade Bollaert-Delelis）**。
#   中村敬斗が 2023-08-10〜2026-09-01 にいたのは **Reims（スタッド・ドゥ・ランス）** で、**別のクラブ**。
#   日本語ではどちらも「ランス」なので、①で「同じ読みの別のクラブです」と**はっきり言い分ける**。
#   **「元所属のランス」とは一度も書いていない。**
# **中村本人の言葉も、リヨンの監督の言葉も取れていない**（材料 7）。だから**声は1つも無い**台本にした。
#   リヨンの監督名も一次情報で確定できなかったので、**監督名は出さない**（材料 7 の指示）。
# 数字の食い違い（材料 6）の扱い：
#   ・10/5 ニュージーランド戦の出場は FotMob と報道で食い違う（材料 6-1）ので、
#     **代表の「191分」は使っていない**。代表の話は「4連戦のうち3試合に出た」までに留めた。
#   ・評点は FotMob の値だけ（フランス紙の採点は取れていない）。だから画面でも「この試合に付いた点」とだけ言う。
# 数字の重なり対策：『30分』『6.3』は②だけ。『56分』『146分』『61.6%』は③だけ。
#   『2失点』『9.0』『16歳』『8分』は④だけ。スコアの2-1は①だけ。
# 写真は記事の横長を先に当たった。02＝サッカーキングの記事の og:image（この試合そのもの。リヨンの黒いユニフォーム、
#   相手は黄と赤のランス＝Lens）。facecrop で 02_w（16:9）と 02_v（9:16）。
#   01（Commons、CC BY-SA 4.0 / Werner100359、2022年のLASK時代）は**古いので使わない**。入れ替えは無し。
# サムネ：構図 number（リヨンでのリーグ戦の最長が30分）。
# ネットの反応は集めていない（材料の方針）。
