  title: 中村敬斗の30分。リヨンに来てからの出場時間を足すとどうなるか
  question: 中村敬斗の30分は、リヨンでのここまでと比べてどういう30分だったのか
  takeaway: 中村敬斗が10月9日に出た30分は、リヨンに移ってからのリーグ戦でいちばん長い出場だった。開幕戦が15分、2試合目が11分で、3試合を足しても56分にしかならない。リヨンで過ごした時間は公式戦で146分あり、その61.6%は9月16日のヨーロッパリーグ、初先発で初ゴールを決めた1試合が占めている。この日は60分に負傷したオペンダと代わって入り、67分に左から切り込んでシュートを放った。シュートは2本、相手ボックス内のタッチは7回で、点は6.3だった。試合はランス、つづりはLensのほうのクラブが2-1で勝ち、リヨンは開幕5試合無敗から今季初黒星。2点はどちらも33歳のトゥヴァンのパスから生まれ、この試合の最高点9.0が付いている。中村が3年いたランスはReimsで、同じ読みの別のクラブ
  opening_image: assets/images/20261010_lyon_nakamura/06.jpg
