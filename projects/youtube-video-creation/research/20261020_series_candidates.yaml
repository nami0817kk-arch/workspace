title: 10月20日（火）シリーズの題材候補
lead: 8枠＋レジェンド2本＝候補30件。各枠の1番目が名前の大きさ順のおすすめです（○は枠ごとに1つ）。週報は不要（ユーザー決定 10/18）なので通常の8枠です。『比べる』はクラブ同士の比較（ユーザー指示）。
note: <p><b>並べ方の物差し</b>：選手は Transfermarkt の市場価値（player_pool）、クラブは世界の収入順位・本拠地の大きさ・CL常連か。軸は『2者の比べ』『順位』『答えを伏せた数字』。1枠3件、各枠の1番目が名前の大きさ順のおすすめ。</p><p><b>足切り（比べる）</b>：今回の『比べる』はクラブ同士なので選手の出場時間の足切りは使わない。その代わり<b>今季の順位表を今朝（2026-10-19）読み直した</b>。プレミアは公式（premierleague.com の順位表の API）と ESPN の2か所で一致：シティ7試合7勝 19得点7失点 勝ち点21／アーセナル7試合6勝1敗 11得点5失点 勝ち点18。ラ・リーガとセリエAは <b>ESPN の順位表だけ</b>（公式での読み直しは公開前に要る。Wikipedia の今季のページは更新が途中で、ラ・リーガは 10/12 止まり）：バルセロナ9試合9勝 39得点9失点 勝ち点27／アトレティコ9試合7勝1分1敗 19得点8失点 勝ち点22／ラツィオ7試合6勝1分 14得点4失点 勝ち点19／ローマ7試合5勝2分 16得点3失点 勝ち点17。1試合あたりは私の割り算。<b>どの組も順位は台本の日までに動く。公開前に取り直す。</b></p><p><b>選手紹介の出場時間</b>（Transfermarkt の API、1人1回、間隔8秒、今朝）：ソボスライ（プレミア）6試合出場<b>473分</b> 1得点0アシスト／ムベウモ 7試合<b>630分</b> 4得点0アシスト／ユルドゥズ 1試合<b>69分</b>（欠場6試合）。ラウタロは353分（10/12 に比べるが出ている）で外した。</p><p><b>同じ日にそろえる時の注意</b>：</p><ul><li><b>クラブ紹介のビジャレアル・ラシン・ラージョは『第1〜7節』の結果の表が7節止まり</b>。今はビジャレアル・ラシンが9試合、ラージョが7試合を消化している（ESPN）。台本の今季の数字（順位・勝ち点・ラージョのカメージョ『7試合7得点』）は<b>公開日に合わせて取り直す</b>。</li><li>比べるでバルサ×アトレティコを選ぶ日は、財政のアトレティコを選ばない（アトレティコが2枠）。比べるでシティ×アーセナルを選ぶ日は、スタジアムのエティハドを選ばない（シティが2枠。10/17 の財政で同じ組が出ている）。</li><li>財政でミランを選ぶ日は、レジェンド（世界）のピルロを選ばない（ミランが2枠）。財政でアストン・ヴィラを選ぶ日は、移籍のヴィラ・ユニフォームのヴィラを選ばない。</li><li>移籍でレアルを選ぶ日は、記録のラ・リーガ優勝回数（レアル36回）を選ばない。移籍でヴィラを選ぶ日は、選手紹介・ユニフォームでヴィラを重ねない。</li><li>スタジアムのエヴァートンとユニフォームのトッテナム・ヴィラ・フォレストは別クラブなので同じ日に選んでよい。ニューカッスルは 10/19 のユニフォームの翌日になるので、スタジアムの候補から外した。</li><li>選手紹介のソボスライを選ぶ日は、リヴァプールが 10/18（スタジアム・ヴィルツ）に続く。ムベウモ（マンU）は 10/17 のスタジアム以来で重なりが少ない。</li><li><b>衝突の無い組の例</b>：ビジャレアル（クラブ）／ムベウモ／エヴァートンの本拠地／ローマ×ラツィオ／アトレティコの財政／プレミア優勝回数／ノッティンガム・フォレスト（ユニフォーム）／ヴィラの移籍／ベッカム／中村俊輔。</li></ul><p><b>直近30日の重なり</b>：research/posted.json の公開済み・予約済み（10/19 の分まで）を題・人名・クラブ名で引き、research/covered.yaml も引いた。<b>10/19 の10本（バレンシア・ロジャーズ・トッテナムの本拠地・バイエルン×ドルトムント・インテルの財政・CL通算得点・ニューカッスルの縞・アーセナルの今夏の移籍・イニエスタ・長谷部）は重ねていない</b>。10/19 に採られなかった候補（ムシアラ・ドゥエ・エティハド・エヴァートン以外の比べる・ヴィラの移籍・レアルの移籍・ベッカム・ピルロ・岡崎・中村）のうち、ムシアラ・ドゥエは3日続けて見送られたので外し、ほかは再提案した。<b>ヴィティーニャの選手紹介は 10/5 に出済み</b>（pool の『ヴィトール・フェレイラ』）なので入れていない。</p><p><b>女子・Jリーグ・欧州7リーグ以外は入れていない</b>。FotMob・FBref・Sofascore・FootyStats・WhoScored・Understat は使っていない（Transfermarkt の公開 API は選手4人の出場時間だけ、そのほかは Wikipedia・デロイトの公開ページ・プレミア公式・ESPN の順位表）。地の文は解説1人、数字は基本の数と自分で割った1試合あたり。</p>
