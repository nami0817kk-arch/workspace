  head: ベッカムは、どんな選手だった？ 右足のクロスが、4つの国で優勝をもたらした
  why: '**いま見る理由が読めた**（Wikipedia『David Beckham』）：2013年5月に引退（21年のキャリア）、現在はインテル・マイアミの共同オーナー兼プレジデント。主要タイトル19、**リーグ優勝をイングランド・フランス・スペイン・アメリカの4か国で取った唯一のイングランド人**。マンU（プレミア優勝6回・1999年CL）→レアル（4年、ラ・リーガ優勝）→ミラン（ローン）→PSG。イングランド代表115試合。『あの試合』の候補・マル秘話は**未取材**。**弱い面**：マンUが 10/17 以降の選手紹介（ムベウモ）と重なる日は、ムベウモを選ばない。私生活は入れない'
