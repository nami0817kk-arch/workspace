  topic: パリ・サンジェルマン
  title: パリ・サンジェルマン、稼いだ額に連盟が値段を付け直せる。規定に書かれていること
  question: 稼いだと書いた額は、そのまま収入として認められるのか
  lead: 胸の広告も、場内の看板も、持ち主と同じ国につながるクラブ。
  hook: 規定の原文を開くと、政府という言葉まで書かれています。
  takeaway: パリ・サンジェルマンの2024-25の営業収入は8億3700万ユーロで、クラブとして史上最高。5季前の5億5620万ユーロから1.50倍、1年あたりおよそ10.8%の伸びで、2025-26の数字は今月の下旬に出る見込み。内訳は商業3億6700万ユーロと入場料1億7500万ユーロで、残る2億9500万ユーロ、全体の35.2%は放映権などにあたるが、クラブは放映権の額を出していない。ヨーロッパの連盟の規定は、関連当事者の定義に政府を明記し、形式ではなく実態を見ると書いている。スポンサー契約からの収入は公正価値に直さなければならず、上げる方向の直しは認められない。公正価値を超えた分は収入ではなく出資に数えられる。2014年に制裁金6000万ユーロと観光局との契約の値付け直し、2019年にスポーツ仲裁裁判所が期限切れを理由に決定を取り消し、2022年に8クラブの和解でいちばん重い6500万ユーロ。2026年6月の点検では、違反した15クラブの一覧に名前が無い。入場料を収容47929席で割ると1席あたり3651ユーロで、レアル・マドリードの2801ユーロの1.30倍。ただし出どころの違う数字を自分で割ったもの。史上最高の収入の季も最終は4010万ユーロの赤字で、収入の4.8%にあたる
  opening_image: assets/backgrounds/stadium_パリサンジェルマン.png
