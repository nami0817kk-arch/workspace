      title: 自分で割ってみた（2024-25）
      columns: *view_cols
      rows: *view_rows
      highlight_row: 1
  - text: 1席の額を日本円にすると、こうなります。10月9日の相場で計算しました。
    card: &yen_card
      type: convert
      title: 1席あたりの入場料を円で見る
      from:
      - '3651'
      - ユーロ
      - 1席あたり（2024-25）
      to:
      - 約64万6000
      - 円
      - 2026年10月9日の相場
      via: 1ユーロ＝177円
  - text: 1ユーロ177円で、1席あたりおよそ64万6000円になります。
    emph: true
    card: *yen_card
  - text: 器が小さいぶん、1つの席から取る額が重くなっている、と見ています。
    card: none
  - text: もう一方の柱は細っています。収入のおよそ3分の1を占める、放映権です。
    image: assets/backgrounds/stadium_パリサンジェルマン_in.png
    card:
      type: table
      title: 自分で割ってみた（2024-25）
      columns: *view_cols
      rows: *view_rows
      highlight_row: 3
  - text: フランスのリーグの国内の放映権は、前の周期より2割ほど安く始まりました。
    card: none
  - text: 配信の契約も途中で解かれ、リーグは自前の配信に踏み切っています。
    card: none
  - text: 加えて、史上最高の収入を上げた季も、最終は4010万ユーロの赤字でした。
    card:
      type: table
      title: 自分で割ってみた（2024-25）
      columns: *view_cols
      rows: *view_rows
      highlight_row: 4
  - text: 収入に対して4.8%。チャンピオンズリーグを制した季の数字です。
    emph: true
    card:
      type: table
      title: 自分で割ってみた（2024-25）
      columns: *view_cols
      rows: *view_rows
      highlight_row: 4
  - text: 出ていくお金の話も残っています。去年12月、パリの労働審判所の判断です。
    card: none
  - text: かつてこのクラブにいたエムバペへ、6100万ユーロを払うよう命じられました。
    card: none
  - text: 2024年の4月から6月の、未払いの賃金とボーナスにあたると報じられています。
    card: none
  - text: クラブは従うとしたうえで、控訴する権利は留保すると述べています。まだ動きます。
    card: none
  - text: ここで、最初の話に戻ります。帳簿に並んだ数字は、そのまま通るのか。
    card: none
  - text: いちばん大きい商業の分が、いくらと値付けされたのかは公表されていません。
    card: none
  - text: 1件ずつの値付けの中身は、外に出てきません。
    card: none
  - text: 稼いだ額がそのまま通るとは限らない。そこが、このクラブのほかと違う点です。
    emph: true
    card: none
  - text: 10日後の10月20日、パルク・デ・プランスにバルセロナが来ます。
    card: none
  - text: 170試合つづけて売り切れ、シーズン券の更新率も98%のままです。
