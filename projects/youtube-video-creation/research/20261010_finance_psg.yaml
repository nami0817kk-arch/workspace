# クラブの財政：パリ・サンジェルマン（10/10 土、シリーズ「クラブの財政」）。材料の控えは research/raw/20261010_finance_psg_material.md。
# 軸は **ヨーロッパの連盟の「関連当事者取引」と「公正価値」**。
#   レアル回（10/9）の軸「スクワッド・コスト・ルール（70%）」は主役にしない（この回では1行も出さない）。
#   レアル回の「稼ぎは世界の頂点、ただしその分がどこへ出ていくか」「手元に残るのは収入の◯%」、
#   アルテタ回（10/8）の「およそ◯倍になりました」、バルサ回（10/3）の「初めて10億ユーロを超えた」は使わない。
# ★**2025-26 の数字は公開日の時点でまだ公表されていない**（前の季の発表は 2025-10-28）。
#   折れ線は **2020-21〜2024-25 の5季**（556.2 / 654 / 801.8 / 805.9 / 837、百万ユーロ。デロイト各版）。
#   台本で「次の数字は今月の下旬に出る見込み」と必ず言う。推計の9億1000万ユーロは使わない。
# ★**収入8億3700万ユーロはクラブ全体の数字**（複数の競技を抱えている）。**部門名を並べない**（女子は扱わない決まり）。
# 放映権の額は**クラブもデロイトも出していない**。2億9500万ユーロは 837 − 367 − 175 の**こちらの引き算**。
# ★**2026-06-30 の連盟のリリースに名前が無い**ところまでしか言わない。「合格と発表された」とは言わない。
# ★**ネイマール回（10/9）と重ねない**：2億2200万／勅令1006号／173試合118ゴール／金融検察／歴代上位は**使っていない**。
#   2017年の調査は「2人の大型補強を受けて」とだけ言い、**移籍金の額を出さない**。
# エムバペへの支払い命令（2025-12-16、6100万ユーロ）は**報道**。**控訴の余地があることを添える**。
# **数字の重なり対策**：6500万ユーロ（2022年の制裁金）は基礎DATAの節の強い一点だけで読み上げ、年表では額を読まない（板には出る）。
#   6000万ユーロは2014年の制裁金の1か所だけ。連盟の赤字の許容幅とエムバペの請求額は出さない。
# 2026年のチャンピオンズリーグ決勝（PSG 1-1 アーセナル）は、**同じ日のもう1本（スタジアム紹介②エミレーツ）とつながる**ので、
#   **2本とも決勝の試合には触れていない**。この回は「チャンピオンズリーグを制した季」までにとどめる。
# アルファベットは読み上げに出さない（UEFA →「ヨーロッパの連盟」／CAS →「スポーツ仲裁裁判所」／
#   QSI →「カタールの投資会社」／QTA →「カタールの観光局」／DNCG →「フランスのリーグの財務の監督機関」）。板の題にだけ書く。
# 円は換算の板でだけ出す（1ユーロ＝177円。ECB 2026-10-09 の 177.34 を丸めた値）。**レアル回も177円なので言い回しを変えた**
#   （あちらは「円に直すと、およそ2492億円」。こちらは相場の日付を言い、1席あたりの額で出す）。
# 写真は assets/backgrounds/ の2枚（stadium_パリサンジェルマン.png＝ピッチとスタンド、_in.png＝外側から見たスタンド）。
#   どちらも Commons・CC BY-SA で、credits.json は assets/backgrounds/ にある。**顔が入っていないので板が顔にかからない**。
#   このシリーズはクラブ紹介ではないので、`shorts._drop_boards` は縦版を探して無ければ写真のまま残す（10/8 の直しが効いている）。
# サムネは構図 scene（レアル回が number、アルテタ回が face、バルサ回が classic）。同じ日のもう1本は number。
