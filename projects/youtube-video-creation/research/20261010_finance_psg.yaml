- id: uefa
  heading: 連盟が、収入そのものに値段を付け直す
  tier: 報道
  telop: 関連当事者の定義に「政府」が入り、形式ではなく実態を見る、と書いてある
  narrator: 解説
  card: &time_card
    type: timeline
    title: 審査と和解の年表
    rows: &time_rows
    - - 2014年5月
      - 制裁金6000万ユーロ。カタールの観光局との契約は半値に
    - - 2017年9月
      - 2人の大型補強を受け、連盟が調査を始める
    - - 2019年3月
      - 仲裁裁判所が決定を取り消す。理由は期限切れ
    - - 2022年9月
      - 8クラブの和解。6500万ユーロでいちばん重い
    - - 2026年6月
      - 違反した15クラブの一覧に名前が無い
    focus: 2026年6月
  say:
  - text: ほかのクラブの財政は、稼いだお金をどう使うかの話になります。
    card: none
  - text: パリ・サンジェルマンだけは、稼いだと書いた額が本当にその値段かを問われます。
    emph: true
    card: none
  - text: 持ち主がカタールの投資会社で、胸と看板にも同じ国につながる名が並ぶからです。
    card: none
  - text: ヨーロッパの連盟の規定には、関連当事者という言葉があります。
    card: &rule_card
      type: table
      title: 規定の原文
      columns: &rule_cols
      - 条文
      - 中身
      rows: &rule_rows
      - - 関連当事者
        - 人・法人、そして政府。実態で見る
      - - 付属書 J.2.1
        - 収入は公正価値に直す。例はスポンサー
      - - 同
        - 上げる直しは認めない
      - - 付属書 J.8
        - 鑑定人は連盟の名簿から。2通なら平均
      - - 第89条
        - 超えた分は収入でなく出資
      highlight_row: 0
  - text: 同じ持ち主につながる相手のこと。その定義に、政府という語が入っています。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 0
  - text: しかも、形式ではなく実態を見る、と書いてあります。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 0
  - text: そのうえで出てくるのが、公正価値という言葉です。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 1
  - text: 市場でついたであろう値段のこと。収入は、そこへ直さなければなりません。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 1
  - text: 直す対象として最初に挙がっている例が、スポンサー契約からの収入です。
    emph: true
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 1
  - text: そして直せるのは下げる方向だけ。上げる直しは認めない、と書いてあります。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 2
  - text: 値付けをするのは、連盟が認めた名簿の中の鑑定人です。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 3
  - text: 鑑定の報告書が2通そろえば、その平均を使う、とまで書いてあります。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 3
  - text: 公正価値を超えた分は、収入ではなく出資に数えられます。
    card:
      type: table
      title: 規定の原文
      columns: *rule_cols
      rows: *rule_rows
      highlight_row: 4
  - text: 稼いだお金ではなく、持ち主が入れたお金として扱う、ということです。
    card: none
  - text: この値付けの審査は、12年前から何度もこのクラブに当たってきました。
    card: *time_card
  - text: 2014年には制裁金6000万ユーロ。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 0
  - text: カタールの観光局との契約が、2億から1億ユーロへ半分にされています。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 0
  - text: 2017年9月、2人の大型補強を受けて、連盟が帳簿を開けに来ました。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 1
  - text: その調査は2019年3月、スポーツ仲裁裁判所で消えます。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 2
  - text: 勝った理由は中身ではなく、連盟が自分で決めた期限を過ぎていたことでした。
    emph: true
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 2
  - text: 2022年9月、8クラブが和解。合計1億7200万ユーロの38%がここでした。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 3
  - text: 守るべき期限として切られたのが、ちょうど前の季の末です。
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 3
  - text: 今年6月の点検で、違反したクラブが15並びました。そこに名前は出てきません。
    emph: true
    card:
      type: timeline
      title: 審査と和解の年表
      rows: *time_rows
      focus: 2026年6月
      highlight_row: 4
  - text: 連盟が出したのは違反の一覧で、通ったクラブの名簿ではありません。
    card: none
