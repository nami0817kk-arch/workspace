sections:
  - id: said
    main: true
    heading: 何を言ったのか
    tier: 報道
    telop: 「ブラッドリーもフロも、100%信頼している」
    say:
      - {text: 'リヴァプールのイラオラ監督が、会見で二人について聞かれました。二人は得点もアシストも少なく、批判されています。', short_only: true}
      - voice: アンドニ・イラオラ
        text: ブラッドリーもフロリアンも、今季は良い試合も悪い試合もあった。ほかのみんなと同じだ。二人の力は分かっているし、必ず良いプレーを見せてくれると分かっている
      - voice: アンドニ・イラオラ
        text: 先日、コウマスが会心のシュートを決めていれば、バルコラのアシストが一つ付いていた。
      - voice: アンドニ・イラオラ
        text: 内容はまったく同じなのに、みんなが「アシストも付いて素晴らしかった」と言うだろう。
      - voice: アンドニ・イラオラ
        text: ときどき、数字だけを見すぎてしまう
      - voice: アンドニ・イラオラ
        text: ブラッドリーとフロは、僕が100パーセント信頼している選手だ
      - voice: アンドニ・イラオラ
        text: どちらが決めようと構わない。もっとチーム全体の話なんだ
    official: false
    sources:
      - https://www.theguardian.com/football/2026/oct/13/andoni-iraola-trust-florian-wirtz-bradley-barcola-others-to-step-up-liverpool
      - https://www.skysports.com/football/news/11661/13598938/andoni-iraola-liverpool-boss-has-100-per-cent-trust-in-florian-wirtz-and-bradley-barcola

  - id: context
    heading: どういう状況で出た言葉か
    tier: 報道
    telop: マンチェスター・シティ戦の敗戦のあと、LASK戦の前日会見
    say:
      - 日曜のマンチェスター・シティ戦はホームで負けました。イラオラ体制では初めての黒星です。
      - ヴィルツは今季ここまでアシスト1。バルコラはパリ・サンジェルマンから加わって6試合、得点もアシストもありません。
      - 点取り役のイサク、ガクポ、ソボスライが負傷で欠けるなか、水曜のLASK戦を前にした会見でした。
      - voice: アンドニ・イラオラ
        text: 最高の出来ではなかったかもしれない。でも今季は良い試合もしている。みんな、答えを探し始める
      - voice: アンドニ・イラオラ
        text: ドイツ代表では良いプレーをして、1点決めた。良い日も悪い日もある。僕は、二人がチームを良くして結果につなげているかという、もっと全体の見方をしたい
    official: false
    sources:
      - https://www.skysports.com/football/news/11661/13598938/andoni-iraola-liverpool-boss-has-100-per-cent-trust-in-florian-wirtz-and-bradley-barcola
      - https://www.theguardian.com/football/2026/oct/13/andoni-iraola-trust-florian-wirtz-bradley-barcola-others-to-step-up-liverpool

  - id: react
    heading: 元選手の批判
    tier: 報道
    telop: キャラガー「ヴィルツは外れるべきだ」
    say:
      - この会見の前、シティ戦のあとには、元リヴァプールのキャラガーが、こう話していました。
      - voice: ジェイミー・キャラガー
        text: 申し訳ないが、ヴィルツの獲得はうまくいっていない。今までのところ、うまくいっていない
      - voice: ジェイミー・キャラガー
        text: バルコラを批判するのは酷だ。来て6週間で、プレシーズンもなかった。でもヴィルツを批判するのは酷じゃない。もっとやらなければいけない
      - voice: ジェイミー・キャラガー
        text: 彼はチームから外れるべきだ。前回もそう言ったし、もう一度言う
    official: false
    sources:
      - https://www.skysports.com/football/news/11661/13598938/andoni-iraola-liverpool-boss-has-100-per-cent-trust-in-florian-wirtz-and-bradley-barcola

