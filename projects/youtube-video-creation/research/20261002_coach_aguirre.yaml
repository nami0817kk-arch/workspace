      highlight_row: 1
    image: assets/images/20261002_aguirre/01_w.jpg
  - text: 前の監督は、開幕から5試合勝てずに解任されました。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: 続く2試合は、暫定のオスカル・サンチェス監督のもとで1勝1敗。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: アギーレが引き継いだ時点で1勝1分け5敗、20チーム中19位です。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 2
  - text: 7試合で取った点は4つ、失った点は13。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 3
  - text: 代表の試合で中断しているため、まだ1試合も指揮していません。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 4
  - text: 初陣は10月11日、敵地でのラシン・サンタンデール戦です。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 4
  - text: このチームに、19歳の佐藤龍之介がいます。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 5
  - text: この夏に加わった、左サイドの攻撃の選手です。
    card:
      type: table
      title: バレンシアでのアギーレ
      columns: *id008
      rows: *id009
      highlight_row: 5
  - text: ここまでの7試合のうち5試合に出て、4試合は先発でした。
