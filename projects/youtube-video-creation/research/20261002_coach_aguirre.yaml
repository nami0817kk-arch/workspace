# 監督の経歴：ハビエル・アギーレ（10/2 金）。今季途中の9月23日からバレンシア監督。2014〜15年に日本代表監督。
# 生年・監督歴・各チームの試合数は英語版Wikipedia（Managerial statistics の表、Soccerway 由来）と Transfermarkt の監督ページ（trainer/1548）で突き合わせた。
#   14チーム＝のべ16回（メキシコ代表は3回）。Transfermarkt の就任日も一致（日本代表 2014-07-24〜）。
# 日本代表の10試合は英語版Wikipediaの Japan national football team results (2010–2019)。6勝2分け2敗・19得点10失点は Wikipedia（Soccerway）の集計と一致。
#   Transfermarkt は 10試合・勝点平均1.90（PK負けを負けに数える形）。台本は「PK戦の敗退は引き分けに数える」と断って6勝2分け2敗。
#   JFA の公式ページ（jfa.jp / samuraiblue.jp）は 2014〜15年分が 404 で読めなかった。契約解除の発表（2015-02-03）は JFA の発表まで辿れず、
#   報道（スポニチ 2015-02-03、WSJ 2015-02-03。どちらも各 Wikipedia の出典）と英・日・西の Wikipedia の記述で書いている。札は「報道」。
# 疑いの経緯：2014年10月3日に反汚職検察がサラゴサと41人を訴え（アギーレを含む。es.wikipedia）、2015年1月にバレンシアの裁判所が受理と報道（読売、ja.wikipedia の出典）。
#   対象は 2010-11 最終節のレバンテ対サラゴサ（1-2、サラゴサ残留）。2019年12月の判決（Las Provincias 2019-12-09）は選手36人を無罪、サラゴサの元会長ら2人を文書偽造で有罪。
#   判決を伝える記事にアギーレの名は出てこない。本人の結末は確かめられなかった（台本もそう言う）。
# バレンシア：ESPN 2026-09-23（今季終了まで＋1季の選択肢）。コルベランは開幕5試合未勝利で9/13に解任、6・7試合目（アラベス1-0勝、ソシエダ2-3負）は
#   暫定のオスカル・サンチェス（英語版 Wikipedia 2026–27 Valencia CF season、クラブ公式発表 9/13 が出典）。順位は research/standings/2026-09-28.json（19位、1勝1分5敗、4-13）。
#   次の試合は ESPN の日程（10/11 ラシン・サンタンデール敵地、10/17 アスレティック、10/24 ビジャレアル、11/1 エルチェ、11/8 レアル・マドリード）。
#   佐藤龍之介は Transfermarkt（2026-07-07 加入、左ウイング）と config/japan_abroad.yaml（9/28 取得、7試合中5出場・先発4・297分・0得点）。
# 途中就任の6回：メキシコ代表2001（予選5位から）・2009（予選途中）、サラゴサ2010（残留は es.wikipedia。その最終節が疑いの対象と台本で断る）、
#   エスパニョール2012（20位で就任→13位）、レガネス2019（18位で降格）、マジョルカ2022（残り9試合で降格圏と勝ち点1差→16位で残留）。
# 本人の言葉とネットの反応は置いていない。写真は Commons の2013年のエスパニョール時代の1枚だけ（CC BY-SA 4.0 / Juancamartos）。
#   サッカーキング 9/23 の写真は Getty（取り込んで消した）、infobae は写真なし。
