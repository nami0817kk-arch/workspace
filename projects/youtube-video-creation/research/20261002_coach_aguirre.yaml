# 監督の経歴：ハビエル・アギーレ（10/2 金）。今季途中の9月23日からバレンシア監督。2014〜15年に日本代表監督。
# 生年・監督歴・各チームの試合数は英語版Wikipedia（Managerial statistics の表、Soccerway 由来）と Transfermarkt の監督ページ（trainer/1548）で突き合わせた。
#   14チーム＝のべ16回（メキシコ代表は3回）。Transfermarkt の就任日も一致（日本代表 2014-07-24〜）。
# 日本代表の10試合は英語版Wikipediaの Japan national football team results (2010–2019)。6勝2分け2敗・19得点10失点は Wikipedia（Soccerway）の集計と一致。
#   Transfermarkt は 10試合・勝点平均1.90（PK負けを負けに数える形）。台本は「PK戦の敗退は引き分けに数える」と断って6勝2分け2敗。
#   JFA の公式の試合ページ（jfa.jp / samuraiblue.jp）は 2014〜15年分が 404 で読めなかった。
# 退任：2014年12月にスペインの検察が告発、バレンシアの裁判所が受理、JFA が 2015-02-03 に契約解除を発表（英・西・日の Wikipedia と、その出典の WSJ・スポニチ・読売）。
#   2019年12月の判決（選手36人は無罪、サラゴサの元会長ら2人は文書偽造で有罪。Las Provincias 2019-12-09）にアギーレの名は出てこない。本人の結末は確かめられないので書かない。
# バレンシア：ESPN 2026-09-23（今季終了まで＋1季の選択肢、コルベランは開幕5試合未勝利で解任、7試合で勝ち点4）。順位は research/standings/2026-09-28.json（19位、1勝1分5敗、得失点 4-13）。
#   次の試合は ESPN の日程（10/11 ラシン・サンタンデール敵地、10/17 アスレティック、10/24 ビジャレアル、11/1 エルチェ、11/8 レアル・マドリード）。
#   佐藤龍之介は Transfermarkt（2026-07-07 加入、左ウイング）と config/japan_abroad.yaml（9/28 取得、7試合中5出場・先発4・297分・0得点）。
# 途中就任の6回：メキシコ代表2001（予選5位から）・2009（予選途中）、サラゴサ2010（残留は es.wikipedia）、エスパニョール2012（20位で就任→2012-13 は13位）、
#   レガネス2019（2019-20 は18位で降格）、マジョルカ2022（残り9試合で降格圏と勝ち点1差→2021-22 は16位で残留）。
# 本人の言葉とネットの反応は置いていない（シリーズは声なしで通す）。写真は Commons の2013年のエスパニョール時代の1枚だけ（CC BY-SA 4.0 / Juancamartos）。
#   記事の写真も当たった：サッカーキング 9/23 は Getty（取り込んで消した）、infobae は写真なし。9/24 の回の Excelsior の写真は使っていない。
