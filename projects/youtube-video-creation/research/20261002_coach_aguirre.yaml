  say:
  - text: アギーレの30年を見直すと、途中から引き受けた仕事が目立ちます。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
    image: assets/images/20261002_aguirre/01_w.jpg
  - text: シーズンや予選の途中で就いたのは、バレンシアの前に6回ありました。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
  - text: 2001年のメキシコ代表は、予選で5位。出場圏の外から本大会へ届けました。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 0
  - text: 2009年も予選の途中で引き受け、W杯に届けています。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 1
  - text: サラゴサは残留。ただ、その最終節が八百長の疑いを持たれた試合でした。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 2
  - text: エスパニョールは最下位で引き受け、13位まで上げました。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 3
  - text: 届かなかったのはレガネスの1回で、最終節で2部に落ちています。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 4
  - text: マジョルカは残り9試合、2部に落ちる順位まで勝ち点1の位置でした。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 5
  - text: そこから、最終節で残留を決めています。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 5
  - text: 順位と出場で数えれば、6回のうち5回は目標まで届いたことになります。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
  - text: 今回のバレンシアは、まだ31試合が残っています。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 6
  - text: ただ最初の5試合には、ビジャレアルとレアル・マドリードが入っています。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 6
  - text: 19歳の佐藤にとっては、新しい監督の下でも先発に残れるかを示す時期です。
    card:
      type: table
      title: 途中から引き受けた6回と、今回
      columns: *id010
      rows: *id011
      highlight_row: 6
  - text: 敵地での初陣で、佐藤が先発に並ぶか。最初の答えはそこで出ます。
