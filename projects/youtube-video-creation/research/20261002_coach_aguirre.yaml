    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 続くベネズエラ戦は2-2。初勝利は3試合目、ジャマイカに1-0でした。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 2
  - text: 10月にはシンガポールでブラジルと戦い、0-4。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 3
  - text: 11月はホンジュラスに6-0、オーストラリアに2-1と連勝しました。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 5
  - text: そして2015年1月、オーストラリアで開かれたアジアカップ。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 6
  - text: パレスチナ、イラク、ヨルダンに勝ち、グループは3連勝です。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 8
  - text: 3試合で7点を取り、1点も許しませんでした。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 8
  - text: ところが準々決勝、アラブ首長国連邦との試合は1-1。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 9
  - text: PK戦は4-5。ベスト8で敗退しました。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
      highlight_row: 9
  - text: 翌月の2月3日、日本サッカー協会はアギーレとの契約を解除します。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
  - text: 理由は、サラゴサ時代の試合をめぐる八百長の疑い。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
  - text: スペインで告発が受理された段階での解除でした。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
  - text: 2019年、スペインの裁判所はこの試合で訴えられた選手36人を無罪としました。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
  - text: アギーレ本人のその後の結末は、確かめられていません。
    card:
      type: table
      title: アギーレ監督の日本代表 10試合
      columns: *id005
      rows: *id006
  - text: 日本での成績は、6勝2分け2敗。PK戦の敗退は引き分けに数えています。
