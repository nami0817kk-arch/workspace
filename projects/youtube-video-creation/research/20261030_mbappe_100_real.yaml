# 取材メモ（2026年10月30日）ムバッペのレアル100点は116試合目。C・ロナウドは105〜106試合（ショートだけ・見せ方 Y＝試合後の本人の言葉から始める）
# 取材: 2026-10-30 朝。本文は読んだ（検索の要約は使っていない）。
#   ・ESPN 記事API 50311567（2026-10-29 10:36Z）「Mbappé's 100 Real Madrid goals: Quicker than Ronaldo to hit century」控え research/raw/20261030_mbappe100_espn.json
#       本文: 116試合で100点、クラブ歴代23位の得点者（百点に届いたのは24人目・届いた速さは5番目）。
#       ウーゴ・サンチェスは142試合、（ブラジルの）ロナウドは163試合。「Only four ... fewer games」＝プスカシュ100・C・ロナウド106・パヒーニョ111・ディ・ステファノ114。
#       試合後の本人の言葉（Real Madrid TV）: "I'm very happy. Everyone knows I like to score goals and help the team that way, but I think today that's just a minor detail,
#       because the most important thing is the team's victory and our success as a group."（訳は自前。文を区切っただけ）
#       今季は13試合14点。
#   ・Marca（2026-10-29 06:02 CET、データ分析欄）「Radiografía de los 100 goles de Mbappé」本文を requests で全部読んだ。控え research/raw/20261030_mbappe100_marca.txt
#       116試合。少ない試合数で届いたのは4人: プスカシュ101・C・ロナウド105・パヒーニョ114・ディ・ステファノ114。1試合あたり0.86はその中で4番目
#       （C・ロナウド1.03〔438試合〕、プスカシュ0.92、パヒーニョ0.87）。内訳のPKは21点（26本から）、エリア外17点、ヘディング2点。今季は14点13試合。
#   ・レアル公式サイト（2026-10-25）https://www.realmadrid.com/es-ES/noticias/futbol/primer-equipo/actualidad/mbappe-alcanza-los-100-goles-con-el-real-madrid-25-10-2026
#       requests で読んだ: 「partido 116」で100点。内訳 リーグ67・CL25・コパ4・クラブW杯2・欧州スーパーカップ1・スペインスーパーカップ1。今季14点。
# 資料のずれ（台本では断る・言い切らない）:
#   ・C・ロナウドの試合数は ESPN 106／Marca 105（ほかにも 90min が105）→「105試合か106試合。数え方で1試合ずれる」と言う。
#   ・パヒーニョは ESPN 111／Marca 114、プスカシュは 100／101 → 台本では試合数を言わない。「116試合より少ない試合数で届いた4人」とだけ言う。
#   ・ムバッペの116試合はレアル公式が確定。
#   ・ESPN の見出し「Quicker than Ronaldo」は、本文ではブラジルのロナウド（163試合）との比べ。クリスティアーノ・ロナウドとは、ムバッペのほうが約10試合遅い。
#       → 題を「ロナウドより早く」にしない（依頼文の「ロナウドより早く」は、クリスティアーノについては事実と逆）。
#   ・【親への注意】10/26 の本（mbappe_100_clasico）は「届いた速さはクラブで4番目」と言っていた。ESPN 本文・Marca とも、ムバッペ自身が5番目
#       （より少ない試合で届いた人が4人）。「4番目」は、1試合あたりの点（Marca の0.86が4番目）と取り違えやすい。10/26 の言い方が誤りの恐れ。公開済みは触らない。
# 言わないこと: バロンドール（10/27 の本と重なる）、中国の件（10/28）、PKを「だけ」で小さく見せる言い方、ロナウドの最多点数（ESPN 451／ほか450で割れる）、次の試合の結果の予想。
# 前の本との重なり: 10/26 mbappe_100_clasico は試合の流れ（41分・87分）・24人目・383点。今回は「何試合で届いたか」と本人の言葉だけ。24人目・383点・試合の流れは言い直さない。
#   本人の言葉（試合後の「小さなこと」）は10/26〜28 の台本に無いことを grep で確認。
# 確度: 116試合・内訳はレアル公式（確定）。ほかの試合数・順位は報道（ESPN・Marca）。見立ては背景。
# 反応: 作らない（0件）。approve は --no-voices。
