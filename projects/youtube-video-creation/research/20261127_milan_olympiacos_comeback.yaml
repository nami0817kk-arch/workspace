# 食い違い:
#   ・モレイラの4点目: ESPN はアシストをプリシッチ、Football Italia は「ハッチンソンがCKからの速攻を始めた」。→ ハッチンソンの関わりは ESPN の「1得点2アシスト」だけ言う。
