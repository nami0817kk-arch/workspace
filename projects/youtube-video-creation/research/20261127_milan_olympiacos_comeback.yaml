#   次: 11月30日（欧州時間）ミランは敵地でカリアリ戦（セリエA。ESPN の日程）。
# ESPN 記事（report gameId 401915521「Milan rally to win at Olympiacos to kick-start UEL campaign」、story 50605706）:
#   ミランはこの試合の前、ヨーロッパリーグ4試合で3敗。オリンピアコスはこの試合の前まで欧州で無敗（3勝）。ハッチンソンはノッティンガム・フォレストからの期限付き移籍。
#   アモリム（ESPN 50605706）: "It changed our future," "It's completely different to win this game or lose this game. We did well in the second half but we [made] a lot of mistakes again."
# Football Italia「Amorim: 'Hutchinson changed the game more than me' as Ramos injury concern emerges for Milan」（2026-11-26 20:43 UTC、MilanNews.it 経由で Sky Sport Italia と会見の言葉）:
#   "It definitely changes our future. We did well in the second half, but we made a lot of mistakes again and we have to improve,"
#   "We have a lot to do to become a very strong team, but the spirit is there. This is the start of something."
#   "To believe it, you have to see it," "Today we saw that we came back from two goals down and won 4-2. Our confidence will grow."
#   ハッチンソンについて "I always expect this from him. He has the potential to do much more. He has talent, like other players in the squad, but it's the head that counts,"
#   "I didn't change the game. Ramos came off because he was in pain, so it was a normal substitution. Hutchinson changed the game more than I did. What changed it was the first goal,"
#   → 台本の言葉は、この英語を私が日本語にしたもの（元はイタリア語の Sky と会見。英訳を元にしたことを控える）。
# Football Italia（試合前の記事「Amorim: 'Milan can defend better, were too soft in Europa League'」11/26 17:18 UTC）:
#   試合前のアモリム "we can defend better" "We were a little soft against Ferencvaros"。地の文: ミランは欧州の大会でギリシャのクラブの本拠地で一度も勝ったことがない（4分2敗。2018年12月にオリンピアコスに1-3）。
