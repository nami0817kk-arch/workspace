#   トラブゾンスポル戦: 後藤 先発 → 61分 鈴木と交代
# 記事どうしの食い違い: 交代の分 サッカーキング「60分」／ゲキサカ「後半16分」・ESPN・クラブ「61分」→ 61分。
# 本人の言葉: 無し（クラブ公式の試合の記録・「Die Stimmen zum Spiel」（マケンゴ・マタノヴィッチ・シュスター監督の音声）・ゲキサカ・サッカーキングを当たった。後藤・鈴木の言葉は無い）。→ X。
