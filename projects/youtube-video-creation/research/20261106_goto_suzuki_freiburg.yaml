# 【大会名の訂正】指示では「EL」だったが、この試合は**カンファレンスリーグ（ECL）**のリーグフェーズ第3節（サッカーキング・ゲキサカ・クラブ公式・ESPN の uefa.europa.conf で一致）。台本はカンファレンスリーグと言う。
# 出典で確かめたこと:
#   ・ESPN（uefa.europa.conf summary event=401915825、11/5 17:45 UTC）: トラブゾンスポル 0-1 フライブルク。14分 キュブラー（CKから）。
#       後藤啓介 先発（右のFW、CF-R）→ 61分に鈴木唯人と交代（"Yuito Suzuki replaces Keisuke Goto"）。後藤 シュート0、鈴木 シュート1（枠外）。
#   ・SCフライブルク公式 試合の記録（auswaertssieg-am-schwarzen-meer）:
#       先発の並び Irié, Goto (61., Suzuki), Grifo (61., Scherhant) - Matanovic。前の試合（アウクスブルク戦 2-1）から攻撃の4人を全部入れ替え、
#       グリフォ・後藤・イリエ・マタノヴィッチが、シェアハント・鈴木・ベステ・ヘーラーに代わって先発。
#       14分 グリフォの右CK→マタノヴィッチの頭をGKオナナが弾き→キュブラーが押し込む。61分 サラーの至近距離のシュートをGKバックハウスが止めた。90+2分もバックハウスがサラーのシュートを止めた。
#       トラブゾンスポルの先発にサラー、ファビーニョ。GKはマンUから期限付きのオナナ。
#       ECL は3試合で勝ち点6。次は日曜、ホームでウニオン・ベルリン戦（ブンデスリーガ）。
#       シュスター監督の言葉（ドイツ語。台本の訳は私が日本語にしたもの）:
#         „Es war eine sehr gute erste Halbzeit von uns, in der wir wenig zugelassen haben"
#         „Dass diese Mannschaft in diesem Stadion zu Möglichkeiten kommen kann, ist klar, aber es waren wenige … So war es uns möglich, heute diesen sehr wichtigen Sieg mit nach Hause zu nehmen."
#   ・公式戦3連勝（ESPN で各試合を確かめた）: 10/28 DFBポカール ヴォルフスブルク戦 3-2（401917036）／10/31 ブンデス アウクスブルク戦 2-1（401884751）／11/5 ECL 1-0。その前の 10/25 はバイエルンに1-3で負け。
# 自分で数えたもの（ESPN の交代の記録）: 3連勝の3試合とも、2人は同じ枠を入れ替わりで務めている。
#   ヴォルフスブルク戦: 鈴木 先発 → 68分 後藤と交代（後藤はこの試合2得点。10/29 の 20261029_shiogai_goto_pokal で出し済みなので「2得点」は表の1行だけ）
