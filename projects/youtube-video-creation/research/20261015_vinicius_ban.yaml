  - id: games
    heading: 最小の2試合が2つ重なると、どの試合を欠場するのか
    viewpoint: true
    tier: 報道
    telop: 18日セビージャ戦、25日クラシコ、11月のラシン戦とバレンシア戦
    say:
      - 欠場するのは、18日のセビージャ戦と、25日のカンプ・ノウでのクラシコです。
      - どちらの違反も、1つだけで2試合です。
      - つまり、どちらか1つだけでも、クラシコは欠場になります。
      - もう1つの2試合が、11月のラシン・サンタンデール戦とバレンシア戦に回ります。
      - 処分が効くのは国内リーグだけで、ヴィニシウスはチャンピオンズリーグには出られます。
      - ライプツィヒ戦にも出場できます。
      - リーグ戦に戻れるのは、11月の代表ウィークのあとです。
    official: false
