# ラ・リーガ の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。ESPN の記事 id 50182804（now.core.api.espn.com の本文そのもの）・BBC・Marca（requests・ブラウザUAで本文）・
#   Marca が全文を載せた連盟の懲戒委員会の決定文・ESPN の記事 id 50185130（モウリーニョの会見）を読んだ。
# 日付・場所: 試合は現地10月10日（土）、サンティアゴ・ベルナベウ。ラ・リーガ、レアル・マドリード1-0ビジャレアル。
#   ヴィニシウスは途中出場（52分、ESPN・BBC・サッカーキングで一致）。相手はネイサン・サリバ（ビジャレアル。ESPN・BBC・Marca が一致）。
#   決定の発表は現地10月14日（水）。ESPN は「水曜に懲戒委員会が確認」、Marca は 14/10/2026。
# 主審: イシドロ・ディアス・デ・メラ。報告書（acta）の言い方は Marca・Minuto60 が引く。
#   「ボールが2人のあいだで争われていない状態で髪を引っ張った」＝決定文が引く acta の語（sin estar el balón en disputa entre ellos）。
#   退場後の抗議は acta が「大声で、攻撃的な態度で近づいて、チームメートに抑えられた」と書く。具体的な言葉は acta は「聞き取れなかった」と書く。
#   報告書の時刻（Minuto60 は「73分」）は、ヴィニシウスが52分に入ったことと照らしてもほかの資料と食い違う書き方なので、台本では分を言わない。
# 出場停止の根拠（決定文＝懲戒委員会。Marca が全文を転載）: 2試合は懲戒規定の130条2項（ボールを争える状態にない場面での暴力的な行為。規定が定める最小）、
#   もう2試合は127条（主審への抗議。規定が定める最小）。罰金（52条）も付く。決定文は両方とも「最小」と書く。
#   クラブは「髪に触れたのは偶発的」「プレーが続いていた」「抗議は独立した違反ではない」と主張したが、委員会は退けた
#   （「髪を引っ張ったのは明白」と判断）。決定文の原文（スペイン語）に当たって日本語にした。
# 欠場: セビージャ戦（18日、ベルナベウ）・クラシコ（25日、カンプ・ノウ）・ラシン・サンタンデール戦（11/1）・バレンシア戦（11/7）。BBC・Marca・サッカーキングで一致。
#   ESPN の記事は「ラシン」を中心に書き、セビージャを「日曜（18日）」と書く。国内リーグだけの処分で、CL（ライプツィヒ戦・AEK戦）には出られる（ESPN）。
# 発言の出どころ: ヴィニシウス＝Marca（ローマ戦後、スペイン語。ESPN の英訳と一致）。モウリーニョ＝ESPN の英訳（Movistar の取材）。Marca のスペイン語とも一致。
#   エンドリッキ＝Marca（ローマ戦後。引用の中に「…」があるのは本人の間）。
# 使わなかったもの: AS の読者投票（AS 側が403で読めなかった）。RMTV の批判（クラブ公式の番組で、反応ではなくクラブの声）。
#   ヴィニシウスの「ブーイング」「100ゴール」の発言（別の話題）。ヴィニシウスが退場前に先発でなかった話・今季の成績（出場停止の中身ではない）。
# 反応（ネット民）: 取れなかった。まとめサイト（footballnet・サカサカ10・worldfn・samuraigoal・sakarabo）を `reactions --find` と各トップで探したが、
#   今回の処分の記事・スレは見つからず、同じ日の試合実況スレ（worldfn）にも出場停止の書き込みは無かった。作らない。
#   他人の声はヴィニシウス本人・モウリーニョ・エンドリッキの3人（実名の発言）。
# 前の回（10/14 research/20261014_mourinho_ref.yaml の context）で言ったこと: ビジャレアル戦で髪を引っ張った反則でゴール取り消し・退場。
#   → 今回は繰り返さず、出場停止の中身（4試合の内訳・決定文・欠場する試合）が新しい事実。
