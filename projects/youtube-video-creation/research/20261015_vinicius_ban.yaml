    heading: 何が起きたか
    tier: 報道
    telop: ヴィニシウスに4試合の出場停止。クラシコも欠場
    say:
      - {text: 'ヴィニシウスが、ローマ戦のあとに、処分の発表について語りました。', short_only: true}
      - voice: ヴィニシウス
        text: 処分は、悪いタイミングで出たと思う。
      - voice: ヴィニシウス
        text: 一日中あったのに、ぼくはスタジアムに着いてから知った
        cont: true
      - 14日、スペインサッカー連盟の懲戒委員会が、4試合の出場停止を決めました。
      - 10日のビジャレアル戦で、ヴィニシウスはゴールを決めました。
      - ところが、ビデオ判定で、その前の場面でサリバの髪を引っ張ったと判断されました。
      - ゴールは取り消され、レッドカードが出ていました。
      - 内訳は、2試合と2試合です。
      - ひとつは、ボールを争っていない場面での暴力的な行為で、2試合。
      - もうひとつは、退場になったあとの抗議で、2試合。
      - 決定文は、どちらも規定が定める最小の試合数だとしています。
      - 主審の報告書には、退場のあとも大声で抗議した、と書かれています。
      - チームメートに抑えられたことも、記されていました。
      - クラブは、髪に触れたのは偶発的で、プレーも続いていたと主張しました。
      - 委員会は、映像から髪を引っ張ったことは明白だとして、退けています。
      - ヴィニシウス本人は、こうも話しています。
      - voice: ヴィニシウス
        text: 他の選手に暴力を振るったことは、一度もない
    official: false
