  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
- id: history
  heading: 2年続けて決勝へ
  tier: 背景
  telop: ヨーロッパの頂点に、2年続けてあと一歩
  narrator: 解説
  card:
    type: table
    title: 2年続けて決勝へ
    columns:
    - ''
    - ''
    rows:
    - - 2000年 パリ
      - レアル・マドリードに0対3
    - - 2001年 ミラノ
      - バイエルンにピーケー戦で敗戦
  say:
  - 2000年、クラブは初めて、チャンピオンズリーグの決勝に進みます。
  - パリでの相手はレアル・マドリード。**0対3**で敗れました。
  - 翌年も決勝へ。バイエルンと**1対1**のあと、ピーケー戦で力尽きます。
  sources:
  - https://en.wikipedia.org/wiki/Valencia_CF
  - https://en.wikipedia.org/wiki/2001_UEFA_Champions_League_final
  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
- id: history2
  heading: 31年ぶりの優勝
  tier: 背景
  telop: 31年ぶりの優勝。2004年は2冠
  narrator: 解説
  card:
    type: table
    title: 31年ぶりの優勝
    columns:
    - ''
    - ''
    rows:
    - - 2001-02
      - 31年ぶりのリーグ優勝
    - - 2003-04
      - リーグとヨーロッパの大会の2冠
    - - 2004年
      - 世界最優秀クラブに選ばれる
  say:
  - 2002年、ベニテス監督のもとで、**31年**ぶりにリーグを制します。
  - 2004年はリーグに加えて、いまのヨーロッパリーグにあたる大会も制覇。
  - この年、国際サッカー歴史統計連盟から、世界最優秀クラブに選ばれました。
  sources:
  - https://en.wikipedia.org/wiki/Valencia_CF
  - https://en.wikipedia.org/wiki/Santiago_Ca%C3%B1izares
  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
- id: nou
  heading: 止まった新スタジアム
  tier: 背景
  telop: 新スタジアムの工事は、16年近く止まった
  narrator: 解説
  card:
    type: table
    title: 止まった新スタジアム
    columns: &id001
    - ''
    - ''
    rows:
    - - 2007年
      - 新スタジアムの工事が始まる
    - - 2009年
      - 財政難で中断
  say:
  - 新しいスタジアムの工事は、**2007年**に始まりました。
  - ところが**2009年**、財政難で中断。クラブの借金は、4億ユーロを超えていました。
  - text: 再開は**2025年1月**。止まっていた期間は、**16年**近くに及びます。
    card:
      type: table
      title: 止まった新スタジアム
      columns: *id001
      rows:
      - - 2025年1月
        - 工事を再開。収容7万44人
  - 完成すれば**7万44人**が入り、引っ越しは来シーズンの予定です。
  sources:
  - https://en.wikipedia.org/wiki/Nou_Mestalla
  - https://en.wikipedia.org/wiki/Valencia_CF
  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 粘り強く戦う。育てて売る。会員の多いクラブ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 粘り強く戦う
    - - 運営の型
      - 育てて売る
    - - クラブの気質
      - 会員は5万人近く
  say:
  - text: アギーレ監督は、形にこだわらず、粘り強く戦う監督として知られています。
    image: assets/photos/ll/valencia/valencia_manager_200422af.jpg
  - ピッチの外は、育てて売る型。
  - 下部組織育ちのフェラン・トーレスは2020年、マンチェスター・シティへ**2300万ユーロ**。
  - スタンドの熱も強い。年間シートを持つ会員は、多い時で**5万人**近くいました。
  sources:
  - https://en.wikipedia.org/wiki/Valencia_CF
  - https://en.wikipedia.org/wiki/Javier_Aguirre
  - https://es.wikipedia.org/wiki/Valencia_Club_de_F%C3%BAtbol
  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
- id: episode
  heading: コイン投げの初代会長
  tier: 背景
  telop: 初代会長はコイン投げ。ただし結果は決めてあった
  narrator: 解説
  card:
    type: table
