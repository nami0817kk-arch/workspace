- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 初の日本人・佐藤龍之介と、本拠地の最後の1年
  narrator: キャスター
  say:
  - text: 日本の**佐藤龍之介**が、この夏に加わりました。トップチームで、クラブ初の日本人です。
    image: assets/stats/ll_valencia_data_r1.png
    no_telop: true
  - text: 佐藤は、加入したときにこう話しています。
    image: assets/stats/ll_valencia_data_r1.png
    no_telop: true
  - voice: 佐藤龍之介
    text: 最後のシーズンが始まる、ちょうどいい時に来た。ファンの誇りになる年にしたい
    image: assets/stats/ll_valencia_data_r1.png
  - text: チームはいま**19位**。9月には、日本代表も率いたアギーレ監督を呼びました。
    image: assets/stats/ll_valencia_data_r2.png
    no_telop: true
  - text: そして今シーズンは、1923年から使ってきた本拠地メスタージャの、最後のシーズンです。
    image: assets/stats/ll_valencia_data_r3.png
    no_telop: true
  - image: assets/stats/ll_valencia_data0.png
    text: 創立は**1919年**。町のバルに集まった若者たちが、クラブを作りました。
    no_telop: true
  - image: assets/stats/ll_valencia_data1.png
    text: 愛称は「チェ」。バレンシアの人が呼びかけに使う、「ねえ」にあたる言葉です。
    no_telop: true
  - image: assets/stats/ll_valencia_data2.png
    text: ホームタウンはバレンシア。人口およそ**82万人**、スペインで3番目の都市です。
    no_telop: true
  - image: assets/backgrounds/stadium_バレンシア.png
    text: 本拠地はメスタージャ。**4万9430人**が入ります。
  - image: assets/stats/ll_valencia_data4.png
    text: オーナーは、シンガポールの実業家ピーター・リム。**2014年**に買い取りました。
    no_telop: true
  - image: assets/stats/ll_valencia_cups.png
    text: 1部の優勝は**6回**。国王杯は**8回**、スーペルコパは**1回**。
    no_telop: true
  - image: assets/stats/ll_valencia_data6.png
    text: 最多出場はフェルナンド・ゴメス。1983年から1998年までに、**556試合**です。
    no_telop: true
  - image: assets/stats/ll_valencia_data7.png
    text: 直近のタイトルは、創立100年のシーズンの国王杯。決勝でバルセロナを**2対1**で破りました。
    no_telop: true
  - image: assets/stats/ll_valencia_data8.png
    text: 昨シーズンのリーグ戦は**9位**。勝ち点は**49**でした。
    no_telop: true
  sources:
