  say:
  - text: 初代の会長は、コイン投げで決まりました。
    image: assets/images/ll_valencia_episode/scene.jpg
  - 争ったのは、クラブを作った中心の2人。ただし勝つ側は、仲間内で前もって決めてありました。
  - 負けた側は、自分の結婚を**1年**延ばして、最初のグラウンドを用意しました。
  sources:
  - https://es.wikipedia.org/wiki/Valencia_Club_de_F%C3%BAtbol
  - https://en.wikipedia.org/wiki/Valencia_CF
  bg: assets/backgrounds/stadium_バレンシア_in.png
  official: false
