# 取材メモ（2026年11月27日）長谷部誠が UEFA A級ライセンスを取得。インスタグラムで「これからの指導者人生に活かしていきたい」（ニュースのショート。見せ方 Y。本人の言葉あり）
# 取材: 2026-11-27。WebFetch と requests（ブラウザUA）だけ。検索エンジンのAI要約・ブラウザの道具は使っていない。
# ゲキサカ 464030（11/26 17:03、全文）: 日本代表コーチの長谷部誠氏(42)が26日、自身のインスタグラムで UEFA のA級指導者ライセンス取得を報告。
#   24年夏の引退後はフランクフルトのU-21チームのコーチ。同年9月から日本代表コーチを兼務、今夏の北中米W杯で森保監督を支えた。
#   今年1月に日本代表の活動に注力するためフランクフルトから一時離脱が発表され、並行してドイツサッカー連盟（DFB）のA級ライセンスの講習に参加していた。
#   投稿（ゲキサカの引用）:「多くの学びと成長があり、これをこれからの指導者人生に活かしていきたいと思っております。インテンシブで充実した約11ヶ月の旅路は簡単なものではありませんでしたが、多くの方々の支えがありこうして無事に取得出来たことに心から感謝します」
# 同じ投稿の日本語の文面は、スポーティングニュース（Yahoo 683176f0）・日テレNEWS（Yahoo 9f7c9400）・Football ZONE 687291 でも一字一句同じ（Football ZONE は後半の一文だけ）。
#   Football ZONE: 英語とドイツ語でも投稿し、指導者・受講生・DFB への謝意、サポートを受けたフランクフルトへの特別な感謝も伝えた（英独の原文は読めていないので台本では使わない）。
#   日テレNEWS は「インテンシブ(短期集中)」と括弧で補っている。
#   → 本人の投稿そのもの（Instagram）は未ログインでは本文が出ず、直接は読めなかった。文面は4社の一致で取る。
# スポーティングニュース（Yahoo 683176f0、全文）: UEFA の指導者ライセンスは下から C・B・A・Pro の4段階。A級は最上位の Pro に次ぐ資格。
#   DFB の規定では A級で、男子4部（レギオナルリーガ）以下の監督・プロクラブのコーチなどが可能。ドイツの1〜3部の監督は原則 Pro が必要。
#   → UEFA・DFB の原文は読めなかった（uefa.com は応答なし）。台本は「報道」の札で、4段階と「Pro の一つ手前」だけ使う。リーグごとの細かい規定は言わない。
# JFA 公式のスタッフページ（jfa.jp/national_team/staff/HASEBE_Makoto.html、11/27 に読んだ）: 「SAMURAI BLUE（日本代表）コーチ」。
#   指導歴: 2024年 フランクフルトU-21 コーチ／2024年〜 SAMURAI BLUE コーチ。資格: 2022年 UEFA DFB B+ コーチライセンス、2026年 JFA Aジェネラルライセンス。
#   → いまの肩書は JFA のページのとおり「日本代表コーチ」。大岩新監督の体制でのスタッフ発表は見つけていないので、新体制での役割は言わない。
# ゲキサカ 445128（2026-01-20）: フランクフルトが、U21のアシスタントコーチの長谷部氏が今年夏までチームを一時的に離れると発表。本年度、JFA Pro ライセンスの講習会の受講が決まっていて、DFB の A ライセンスコースにも参加予定。
# ゲキサカ 444948（2026-01-15）: JFA が2026年度の Pro ライセンスコーチ養成講習会の受講者24人を発表、長谷部誠・前田遼一（日本代表コーチ）が名を連ねた。「修了すれば日本代表、Jクラブの監督を務めることが可能」。
# 食い違い:
#   ・講習の長さ: 1月のクラブ経由のコメントは「これからの6か月間で…DFBのAライセンスに参加」、11/26 の投稿は「約11ヶ月の旅路」。→ 本人の最新の言葉（約11ヶ月）だけを使い、6か月は言わない。
#   ・日テレNEWS の「2024年30歳の年齢で現役引退」は誤り（1984年生まれ＝40歳）。使わない。
#   ・フランクフルトでのいまの役割: 1月の発表は「夏まで一時離脱」。その後の発表は見つけていない → いまのフランクフルトでの役職は言わない。
# 自分で数えたもの: 引退（2024年5月）から A級取得（2026年11月）まで約2年半。資格の並び: 2022年 B+（JFA の記載）→ 2026年 JFA Aジェネラル → 2026年11月 UEFA A級。
# 前の本との重なり: 9/19 hasebe（守備担当のコーチへ）／10/19 hasebe_legend（選手時代のレジェンド回）。→ 今回の初出はライセンスの取得と本人の投稿。選手時代の数字・守備担当の話はしない。
# 【言わないこと】「日本代表監督に」というファンの声・海外識者の推し（他人の声で、題から離れる）／大岩体制での役割／フランクフルトのいまの役職／DFB の細かな規定／英独の投稿の中身。
# 本人の言葉: あり（インスタグラムの投稿。4社の引用が一致）。→ Y。
# 写真: 3枚。01・02＝ゲキサカの取材記事 451787・451792（2026-05-20、©Tatsuya TAKEUCHI）の主写真、03＝ゲキサカ 445128 の主写真（©Koki NAGAHAMA/GEKISAKA、代表の練習で指示を出す長谷部）。過去の回で未使用。
#   外した: ゲキサカ 464030 の主写真（©Getty Images）、日テレNEWS の写真（アフロ）、Football ZONE の主写真（増田美咲・自社。900x600 で小さく、縦に切ると顔が欠けた）、本人のインスタグラムの写真（SNS の写真は使わない）。
#   04＝ゲキサカ 445760（2026-02-02、©Koki NAGAHAMA/GEKISAKA、キャプション「長谷部誠コーチ」。代表の練習で選手に話す長谷部）。→ ショートでは真ん中の選手が主役に見え、長谷部が画面の端で切れた（preview4 で確認）ので、台本では使わない（取り込みだけ残っている）。
#   01・02 は元が 1280x960 で、行の写真にするとショートで2.67倍に伸びる（preshow ×）→ 行の写真は 03_w・04_w（元 2560px）だけにし、01・02 はショートの入れ替え（_v、2.0倍）だけに使う。
# 写真の入れ替え: 長谷部の写真で大きいのは 03 だけ（01・02 は 1280px）。行の image: は本人の言葉の頭に 03_w を1か所だけ置き、ショートでは shorts._rotate_photos が 03 の行を 3.5秒ごとに 01_v・02_v と入れ替える前提（preview4 は入れ替えを描かないので、書き出し後に qc.png で確かめてほしい）。
# 反応: 0件（作らない。approve は --no-voices）。THE ANSWER・Football ZONE が拾った SNS の声は元の投稿まで辿っていないので使わない。
