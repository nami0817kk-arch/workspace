  title: ボーンマスの本拠地、プレミア20クラブでいちばん小さい。この家が来週迎えるもの
  question: プレミアでいちばん小さいこの競技場は、どんな場所で、これからどうなるのか
  lead: 赤と黒のクラブが、海辺の町で使い続けている競技場。
  hook: 6日後、ここに初めてヨーロッパがやって来ます。
  takeaway: ヴァイタリティ・スタジアムは収容1万2357人で、プレミアリーグ20クラブの中でいちばん小さい。最大のオールド・トラフォード7万4158人のおよそ6分の1にあたる。1910年に砂利を掘った跡地で開場し、2001年に立ち見の辺を閉鎖すると当局に告げられて丸ごと建て直され、このときピッチの向きを90度変えたと伝えられる。2005年に建物を売って借り直し、2025年4月に買い戻した。2026年7月に始まった工事で2万席超、上限2万3000席まで広げる計画だが、いまの20クラブの収容人数に当てはめると2万席でも19番目、2万3000席でも18位のハルシティ2万4983人に届かず、下から2番目のままになる。ここ10年の平均入場は1万人台で頭打ちで、今季のリーグ戦ホーム3試合の平均は1万1211人、収容の9割ほど。6日後の10月15日、この競技場でクラブの歴史で初めての欧州の大会のホーム戦、シュトゥルム・グラーツ戦が行われる
  opening_image: assets/images/20261009_stadium_bournemouth/01_w.png
