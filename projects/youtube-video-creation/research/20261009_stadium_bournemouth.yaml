      title: ディーン・コートで起きた3つの夜
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: ボーンマスは3部の21位。降格の側にいたクラブでした。
    card: none
  - text: 結果は2対0でボーンマスの勝ち。グレアムとトンプソンが決めます。
