  - text: この小さな器では、プレミアに上がるよりずっと前から、大きな夜がありました。
    image: assets/images/20261009_stadium_bournemouth/01_w.png
    card: *id_match
  - text: 1つ目は1984年1月7日、下のリーグも一緒に戦うFAカップの3回戦。
    card:
      type: table
      title: ディーン・コートで起きた3つの夜
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: 相手は前の年にこの大会を制した、マンチェスター・ユナイテッドです。
