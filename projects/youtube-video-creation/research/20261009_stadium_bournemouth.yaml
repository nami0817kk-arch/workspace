# スタジアム紹介シリーズ①：ヴァイタリティ・スタジアム（ディーン・コート／ボーンマス、10/9）。材料の控えは research/raw/20261009_stadium_bournemouth_material.md。
# **このシリーズの型の1本目。節の並びは オープニング → 基礎DATA(main・強い一点を頭に) → この競技場だけの話(年表) → ここで起きた試合(表) → 見立て(viewpoint・自分で数えた比べ)。**
# 収容人数は資料がばらついている（プレミア公式X 2026-06-16 の 12,357／報道 11,286／実入場の最大 11,316）。
#   台本は **12,357人** を使い、「ちょうど○人」とは言わない。実際の入りは見立ての節で別に出す。
#   12,357 の原出典はプレミアリーグ公式Xの投稿（2026-06-16 https://x.com/premierleague/status/2066889039584600109 ）。
#   **sources には入れていない**（登録済みのアカウントではなく、確度を上げる根拠にしないため）。節の確度は Wikipedia と地元紙で報道どまり。
# 20クラブの比べは research/pl_data/rank.json（各クラブの基礎DATAの板の字から数えたもの、2026-09 時点）。
#   オールド・トラフォード 74,158 ÷ 12,357 = 6.00 → 「およそ6倍」。拡張後の順位はこちらで並べ直した
#   （2万席でも19番目、2万3000席でも18位ハルシティ 24,983 に届かない＝下から2番目のまま）。
# **90度の向き替えは一次情報まで辿れていない**（Wikipedia の出典がリンク切れの専門サイト）。台本は「伝えられています」の線を越えない。
# 1984-01-07 の得点者と入場者数（14,782）は非公式の記録サイトまでしか辿れていない。日付・スコア・会場は Wikipedia のシーズン記事。**確度は報道どまり**。
# 2015-04-27 ボルトン戦は、得点時間が資料で食い違い入場者数も不明なので**使っていない**。
# 女子の国際試合（2013年）はチャンネルの決まりで入れない。
# 媒体名は画面にも読み上げにも出さない。出典は節の sources に置く（画面には出ない）。
# 写真は手元の2枚（01_w＝満員のスタンド、02_w＝外観）。どちらも Commons・CC BY-SA 2.0 で、credits.json を同じ場所に置いてある。サムネは layout: scene（場面の全景）。
# **assets/backgrounds/ から assets/images/20261009_stadium_bournemouth/ へ写してから使っている。**
#   `shorts._drop_boards` は `assets/backgrounds/` で始まる絵を板と見なし、縦版（assets/stats/<名前>_v.png）があれば差し替える。
#   stadium_ボーンマス.png と同じ名前で**クラブ紹介①の基礎DATAの縦板**（創立1899年・愛称・オーナー…）が assets/stats にあり、ショートがその板に化けた（preview4 で見つけた）。
#   作り直すとき: stadium_ボーンマス_in.png → 01_w.png、stadium_ボーンマス.png → 02_w.png を複製し、credits.json は backgrounds の控えから写す。
# 9/20 のクラブ紹介①ボーンマスと重ならないようにした：あちらの一言「プレミアリーグで、いちばん小さなスタジアム。」と
#   「マンチェスター・ユナイテッドの6分の1」は使わず、こちらは「20クラブの中でこれより小さい本拠地はない」
#   「オールド・トラフォードのおよそ6倍」と言い換えている。勝ち点マイナス17・買収額・登録選手・名選手の話は一切扱わない。
