- id: rebuilt
  heading: 90度、向きを変えた競技場
  tier: 報道
  telop: 2001年、立ち見の側の席を閉鎖すると告げられて、丸ごと建て直した
  narrator: 解説
  card: &id_time
    type: timeline
    title: ディーン・コートの歩み
    rows: &rows_time
    - - 1910年
      - 砂利を掘った跡地に開場。選手はホテルで着替えた
    - - 1923年
      - リーグ初戦は7000人で0-0。のち博覧会の部材で3700席
    - - 1984年
      - 建てかけのスタンドで資金が尽き、壊して住宅地に
    - - 2001年
      - 丸ごと建て直し。最初の8試合は別の町で戦った
    - - 2005年
      - 残る一方に、ようやく席が入る
    - - 2022年
      - 嵐でスタンドが壊れ、試合が中止に
    focus: 2001年
  say:
  - text: この競技場には、ほかの家には無い来歴があります。
    image: assets/images/20261009_stadium_bournemouth/02_w.png
    card: *id_time
  - text: 譲り受けた土地は、砂利を掘ったあとの穴でした。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 0
  - text: 1910年の開幕に間に合わず、最初の数か月は隣の公園で試合をしています。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 0
  - text: 更衣室も無く、選手は近くのホテルで着替えてから来ていました。
    card: none
  - text: イングランドのリーグ戦での初戦は1923年。7000人が見て、0対0の引き分け。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 1
  - text: 席が増えたのはそのあと。ウェンブリーの博覧会の部材で、3700席を足しました。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 1
  - text: 1984年には、建てかけのスタンドで資金が尽きます。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 2
  - text: 骨組みは壊され、その場所には家が建ちました。
    card: none
  - text: そして2001年。立ち見のままだった側の席を閉鎖せよ、と当局が告げます。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 3
  - text: クラブが選んだのは、丸ごと建て直すことでした。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 3
  - text: このとき、ピッチの向きを90度変えた、と伝わっています。
    card: none
  - text: 4分の1周ぶんです。この建て直しで、まわりの家からも離れました。
    card: none
    emph: true
  - text: このとき指揮を執っていた監督の言葉です。
    card: none
  - voice: ショーン・オドリスコル
    text: 地面を掘り下げたもの、屋根で覆ったもの、
  - voice: ショーン・オドリスコル
    text: 町の別の場所に建てるものまで見てきました
    cont: true
  - text: 工事は、シーズンの開幕までに終わりませんでした。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 3
  - text: 2001年から2002年のシーズン、最初の8試合は別の町を借りて戦っています。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 3
  - text: その8試合のうち、5つに勝ちました。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 3
  - text: 建て直した直後は、四方のうち三方だけに席がありました。収容は9600人。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 4
  - text: 残る一方に席が入るのは、4年後の2005年です。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 4
  - text: 2022年の2月には、嵐でスタンドが壊れ、試合が中止になりました。
    card:
      type: timeline
      title: ディーン・コートの歩み
      rows: *rows_time
      focus: 2001年
      highlight_row: 5
