      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 0
  - text: いまより9000席以上の上乗せ。およそ1.6倍になります。
    emph: true
    card: &id_calc
      type: calc
      title: 2万席は、いまの何倍か
      terms:
      - - 2万席
        - 工事のあと
      - - 1万2357席
        - いま
      - - 約1.6倍
        - 増える割合
      ops:
      - ÷
      - ＝
  - text: では、その2万席はプレミアでどのくらいの大きさなのでしょうか。
    card: *id_calc
  - text: いまの20クラブの収容人数に当てはめて、自分で並べ直してみました。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 1
  - text: 2万席でも19番目。下から2番目のままです。
    emph: true
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 1
    mark: {kind: circle, row: 1, col: 2}
  - text: 上限の2万3000席まで広げても、18位のハルシティ2万4983人には届きません。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 1
  - text: つまりこの工事は、追い抜くためではなく、残るためのものです。
    image: assets/images/20261009_stadium_bournemouth/01_w.png
    card: none
  - text: 議会の委員会で、クラブの担当者はこう述べました。
    card: none
  - voice: ジム・フレヴォラ
    text: 1万1000人の器のままで、
  - voice: ジム・フレヴォラ
    text: プレミアリーグに長くとどまるのは、ほとんど不可能です
    cont: true
    emph: true
  - text: ここ10年、1試合の平均は1万人台で止まったままです。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 2
  - text: 今季のリーグ戦のホーム3試合は、平均1万1211人。収容の9割ほどです。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 2
  - text: 建て直してからの最多は2017年の1万1388人で、今季はまだ超えていません。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 2
  - text: 工事が始まったのは今年の7月。終わるのは2027年の見込みです。
    card:
      type: table
      title: いまと、工事のあと（自分で並べた）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 4
  - text: そして6日後の10月15日。
    card: none
  - text: ボーンマスにとって初めての、欧州の大会のホーム戦がここで行われます。
  - text: 相手はオーストリアのシュトゥルム・グラーツです。
  - text: 新しく席を入れた南東の角は、その日、相手側の席に使われる見込みです。
