  - text: 就任して3か月だった監督の名は、ハリー・レッドナップ。
    card: none
  - text: 2つ目は2004年2月24日。同じ3部のレクサムに6対0で勝った試合です。
    card:
      type: table
      title: ディーン・コートで起きた3つの夜
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 84分から出たジェームズ・ヘイターが、2分20秒で3点を決めました。
    card:
      type: table
