# ロドリ（バルセロナ／スペイン代表）の紹介。選手紹介の型（2026-11-29 公開分、シリーズ「有名選手の紹介」。key: player_357565）。情報の時点は 2026-11-21（クラブの試合は 11/3 のCLアストン・ヴィラ戦まで。11/8 からは右ハムストリングの軽いけがで欠場）。
# **FotMob は使わない。**数字は Transfermarkt API（控え research/raw/20261121_rodri_tm.json・_seasons.json・_games.json）と英語版 Wikipedia（research/raw/20261121_rodri_wiki.txt、requests で取得）。
# **選んだ理由（2026-11-21）**：player_pool.py list の上位は紹介済み。pool の外で未出の大物。2024年バロンドール、2026年W杯の優勝と大会最優秀選手（ゴールデンボール）、2026年8月にシティからバルセロナへ。紹介の回（player_）は0件（比べるの「ロドリとアンダーソン」だけ）。ほかの候補：サリバ・ギュレル（各1億）、バルベルデ・イサク（各9000万）。
#   重なり：scripts/ と covered.yaml を「ロドリ」で grep → 比べる（ロドリ×アンダーソン）と代表・ニュースの言及だけ。同じ日（11/29）の別シリーズ：スタジアム＝パリ・サンジェルマン、ユニフォーム＝アヤックス（20261127_picks.txt）と重ならない。11/27 のケイン（自分の担当）とも重ならない。
# **現役・今季はバルセロナ（ラ・リーガ）**：TM の試合記録で 2026-11-03（アストン・ヴィラ戦 45分）まで。ESPN（2026-11-04）：クラブが「右ハムストリングの軽いけが」と発表、離脱の期間は未発表、復帰の候補は 11/22 のビジャレアル戦。11/12・11/15 の代表戦には出ていない。
# **数字の軸**：TM（トップチームだけ。ビジャレアルB 45試合2点・ユース代表は除く）。クラブ通算 443試合34点：ビジャレアル 84/2、アトレティコ 47/3、マンチェスター・シティ 298/28（32アシスト）、バルセロナ 14/1。代表 74試合5点。合計 517試合39点。
#   シティの季（試合/得点/アシスト）：19/20 52/4/2・20/21 53/2/5・21/22 46/7/2・22/23 56/4/7・23/24 50/9/15・24/25 8/0/1・25/26 33/2/0。バルセロナ 26/27：リーグ 10/1/1・CL 4/0/0。代表 26/27 4試合1点。W杯2026 8試合0点0アシスト（TM・Wikipedia）。
#   市場価値（TM）：2016-08 50万→2018-05 2500万→2019-06 8000万→2024-07 1億3000万（最高、2024-12 まで）→2026-06 5000万→2026-10 6000万（バルセロナ）。130÷50＝2.6。
# **Wikipedia で確かめたこと**：2007年に11歳でアトレティコの育成へ、2013年に「体の強さが足りない」として放出→ビジャレアル。在籍中に大学で4年間、経営を学んだ。2015-12-17 にトップデビュー。2018年にアトレティコへ（約2000万ユーロ＋500万）。2019-07-03 にシティが契約解除金6260万ポンドを払う（シティのクラブ記録）。プレミア4連覇（20/21〜23/24）、2023-06-10 CL決勝インテル戦で決勝点、クラブW杯の決勝でも得点。2024-09-22 アーセナル戦で前十字じん帯と半月板、10月にバロンドール（守備的MFは1990年のマテウス以来）、2025-05-20 に復帰。2026-08-18 バルセロナと4年契約、移籍金は報道で7650万ユーロ（固定6000万＋追加1650万）。8/27 アスレティック戦でリーグ初出場、10/17 ベティス戦で初ゴール（頭）。代表：ユーロ2024 優勝・大会最優秀選手、ネーションズリーグ2023 優勝、2026年W杯は主将で8試合すべて先発、決勝はアルゼンチンに1-0、ゴールデンボール。パス成功 799本中747本（93%、1966年以降の大会記録）、決勝で101本。
# **入れなかったもの**：信仰・私生活、2023年の退場、2024年のジブラルタルの件（処分）、モウリーニョの話。本人の言葉（一次の原文を確かめていない）。
# **確かめられなかった**：移籍金（報道の額。クラブ発表の額は見ていない）。放出の年齢（2013年としか書かれていない）。93% は 747÷799＝93.5% を丸めた数（Wikipedia の表記どおり）。
# **写真**：Commons。スペイン代表の4枚は Bryan Berlin（CC BY-SA 4.0、2026年W杯決勝・フランス戦）、優勝パレードは CARLOS TEIXIDOR CADENAS（CC BY 4.0、2026-07-20 マドリード）、シティの1枚は Steffen Prößdorf（CC BY-SA 4.0、2023-10-04 ライプツィヒ戦）、東京の1枚は pantkiewicz（CC BY-SA 2.0、2023-07-23 横浜F・マリノス戦。引きの写真をロドリのまわりで切った）。バルセロナ姿の写真は取れなかった。

