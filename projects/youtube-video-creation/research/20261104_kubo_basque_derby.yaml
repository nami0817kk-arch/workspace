#   ・次の試合: EL 11月5日（現地、ESPN 17:45Z）ホームでリヨン戦。リヨンの登録に中村敬斗（ESPN のロスター）。
# 本人の言葉: 見つからなかった（サッカーキング・クラブ公式・検索）。→ X。監督の言葉も使っていない。
# 【選手を小さく見せない】現地紙の厳しい言葉は「引用」として話者の札（現地紙）で読ませ、語りでは同調しない（「存在感が無かった」等を地の文で言わない）。
