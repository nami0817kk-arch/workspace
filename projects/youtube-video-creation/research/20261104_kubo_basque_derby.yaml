#     75分 久保がスチッチと交代で出場（同時にトゥリエンテスも）。久保はシュート1本（枠内0）・被ファウル1（ESPN の記録。台本には入れない）。
#   ・ソシエダのリーグ戦: 9/20 バレンシア、10/11 デポルティーボ、10/18 マラガ、10/25 レバンテに4連勝 → この試合で止まった（ESPN の日程）。
