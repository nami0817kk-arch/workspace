#     ムンド・デポルティーボ「攻撃にフレッシュかつ驚きをもたらそうと15分強プレーしたが、実際には程遠い内容だった。良いクロスが1本あっただけ」
#     エル・デスマルケ「チームが同点ゴールを求めて手詰まり状態になった際、自らボールを要求して責任を果たし、危険なクロスを上げた」
