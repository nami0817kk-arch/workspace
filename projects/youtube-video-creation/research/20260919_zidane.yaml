      - {voice: ジダン, text: カリムとはマドリードで素晴らしい数年間を過ごした。だが、N'Goloのケースと少し似ている。}
      - {voice: ジダン, text: 彼が成し遂げてきたことには敬意を抱いているが、今はより若い選手たちを見たいと思っている}
