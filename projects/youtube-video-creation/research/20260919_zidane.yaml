      - まず、ミッドフィールダーの1人について、ジダン監督はこう説明しました。
      - {voice: ジダン, text: オーレリアンは2カ月近く戦列を離れていた選手だ。彼の回復のためには、マドリードに残るのが最善だったと思う}
