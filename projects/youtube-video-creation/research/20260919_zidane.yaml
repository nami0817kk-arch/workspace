# ジダンが、フランス代表監督として初めてメンバーを選んだ（2026-09-19）
#
# news の型。事実（発表）→ 外れた11人 → 初招集5人 → ジダンの言葉 → 反応。
#
# **候補は research/20260919_candidates.yaml の post1014366。**
# footballchannel.jp の記事をまず読み、goal.com（日本語）・ゲキサカ・日刊スポーツ
# （Yahoo!ニュース）・football-zone.net で裏を取った。同じ23人・同じ11人・
# 同じ5人が並んでいたので、人数と名前はここでは確定的に扱ってよい（tier: 報道。
# FFF公式の発表文そのものには辿り着けていないため「確定」までは上げない）。
#
# **外れた11人の所属クラブは、8人ぶんが2026年5月12日時点のもの**
# （goal.com「フランス代表 最新メンバー｜FIFAワールドカップ2026」・ゲキサカの
# W杯メンバー表）。9月時点で裏が取れたのはサリバ（アーセナル）・チュアメニ
# （レアル・マドリード）・テュラム（インテル）の3人だけ（football-zone.net、
# 9月19日付）。**残り8人（サンバ・ディニュ・ギュスト・L.エルナンデス・
# T.エルナンデス・カンテ・アクリウシュ・マテタ）は、9月の移籍が無かったかまで
# 確認できていない。**台本化の前に、可能なら現在の所属を取り直す。
# 実際、選ばれた側のコナテは5月時点リヴァプール→9月はレアル・マドリードに
# 移っており、シーズン中の移籍は起きうる
#
# **カンテが外れた理由は、情報源によって食い違う。**goal.com（日本語、
# ジダンの会見を直接訳した記事）は「純粋に競技面の理由」「今はより若い選手たちを
# 見たい」というジダン本人の言葉を載せている。一方、英語のまとめ記事
# （worldsoccertalk.com）は「引退したため」と書いている。**ジダン本人の言葉を
# 直接訳した記事を優先し、「引退」は台本に入れない。**
#
# **反応は Yahoo!ニュースのコメント欄2本から。**
#   footballchannel記事の欄: 8件中7件使用（1件は会見内容の書き起こしで反応ではないため除外）
#   goal.com記事の欄: 34件中1ページ目8件を使用（2〜4ページ目は未確認）
# **海外の匿名反応は取れなかった。**発表から数時間しか経っておらず、まとめサイト・
# 「海外の反応」系ブログにこの発表そのものを扱った投稿がまだ無い。X・redditは
# ログイン/JS必須でブラウザから読めなかった（反応を集める工程ではJavaScriptを
# 実行しない決まりのため）。海外ファンの声は空のまま出す。
#
# **外れた11人の表から「所属」を落とした**（2026-09-19）。9月時点の裏が
# 3人ぶんしか取れず、元記事にも載っていなかったため。名前と位置だけにした
#
# **サムネ写真は未取得。**build前に portrait でジダンの写真を取ること。
format: news
