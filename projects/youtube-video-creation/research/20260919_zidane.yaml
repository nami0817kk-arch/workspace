  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    bg: assets/backgrounds/zidane_20260919.png
    telop: 発表を見た人たちの反応
    narrator: キャスター
    say:
      - {short_only: true, text: フランス代表からワールドカップ組の11人が外れ、5人が初めて呼ばれました。}
      - {voice: ネット民, text: ワールドカップ後の状態を見極めて選べるバランス感覚、これがジダン。それがずっと全くないのがポイチ。}
      - {voice: ネット民, text: 今回も状態、怪我明け、チーム状況、全て無視。やはり限界だったんだなと納得させてくれてよかった。}
      - {voice: ネット民, text: ジダン監督がどんなサッカーをするのか今から楽しみです。, short_voice: true}
      - {voice: ネット民, text: 人材豊富で羨ましい, short_voice: true}
      - {voice: ネット民, text: フィールドプレーヤの中にレンヌ、輝いて見える}
      - {voice: ネット民, text: ジダンってだけでなんかワクワクするな〜！, short_voice: true}
      - {voice: ネット民, text: ジタン監督が普通に代表監督の遣り方ですよ}
      - {voice: ネット民, text: カマちゃん、復帰。嬉しい。ミスを減らし、良いところをもっともっとアピールして。}
      - {voice: ネット民, text: ジダンは選手としてもクラブ監督しても主要なタイトルを獲得しているので、}
      - {voice: ネット民, text: サッカー人生で残っているのは代表監督としてワールドカップ優勝くらいだろうが、フランス代表なら十分にチャンスはある。}
      - {voice: ネット民, text: これだけ常に脚光を浴び続けている人は珍しい。}
      - {voice: ネット民, text: この常勝メンバーでもボールを持たせないと怖くないという事実を改めて見せつけたスペイン代表}
      - {voice: ネット民, text: さぁジダン監督、どうポゼッションを撃破する？？}
      - {voice: ネット民, text: サッカーのこうやって対抗して戦術が進化していくの本当に大好きですわ！！}
      - {voice: ネット民, text: ジダンはレアルで選手、監督と経験が豊富なのでフランス代表監督での活躍も楽しみ。}
      - {voice: ネット民, text: 叶わないのだろうけど、交代ジダン（野球で言うと代打オレ）が見てみたいくらい好きな選手。}
      - {voice: ネット民, text: 本人は中盤でプレイしたくてたまらないディウフ！}
      - {voice: ネット民, text: しかし、キヴの魔改造により、右サイドでインテリスタのアイドル化し始めたディウフ！}
      - {voice: ネット民, text: ジダンは、左サイドで試したがっている我らがディウフに幸あれ！}
      - {voice: ネット民, text: ジダンがレアル・マドリードの監督をした時に現役時代のフランス代表のようにスペクタクルなチームを目指すのかと思ったが違った。}
      - {voice: ネット民, text: ハメス・ロドリゲスを外して、カミネロとか守備を重視していた。}
      - {voice: ネット民, text: 今度のフランス代表も見ていて楽しいサッカーを標榜するのか？ちょっと疑問。}
      - {voice: ネット民, text: 他のポジションがこれだけ豪華だとGKが見劣りしますね。メニャンも十分スゴいGKですが。}
      - {voice: ネット民, text: フランスは代々ビッグクラブで活躍するGKが少ないのは面白いところです。}
      - {voice: ネット民, text: CLで正GKとして優勝したのは90年代のマルセイユで優勝したバルテズまで遡る。}
