    image: assets/images/ll_deportivo_episode/scene.jpg
  - その日は、マドリードの**100歳**の誕生日。勝って祝うはずの夜でした。
  - 勝ったのはデポルティーボ、**2対1**。この試合は「センテナリアソ」と呼ばれています。
