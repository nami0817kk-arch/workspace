- id: history
  heading: 18年ぶりの1部
  tier: 背景
  telop: 18年ぶりに1部へ。2シーズン目に3位
  narrator: 解説
  card:
    type: table
    title: 18年ぶりの1部
    columns:
    - ''
    - ''
    rows:
    - - 1973年
      - 1部から降格
    - - 1991年
      - 18年ぶりに1部へ
    - - 1992-93
      - 3位。初めてヨーロッパへ
  say:
  - 1973年に1部から落ちると、そこから**18年**、上がれませんでした。
  - 1988年、借金を抱えたクラブに新しい会長が就き、1991年に1部へ戻ります。
  - 戻って2シーズン目に**3位**。スーペル・デポルと呼ばれるチームの始まりです。
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_de_A_Coru%C3%B1a
  - https://es.wikipedia.org/wiki/Real_Club_Deportivo_de_La_Coru%C3%B1a
  bg: assets/backgrounds/stadium_デポルティーボラコルーニャ_in.png
  official: false
