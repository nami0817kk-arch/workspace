- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 守って待つ。借金ゼロ。3部でも離れないファン
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 守って好機を待つ
    - - 運営の型
      - 借金ゼロからの出直し
    - - クラブの気質
      - 3部でも年間シート2万5千
  say:
  - text: ヒダルゴ監督のチームは、守って好機を待つ。昇格したシーズンも、この戦い方でした。
    image: assets/photos/ll/deportivo/deportivo_manager_7a979908.jpg
  - ピッチの外は、借金を消しての出直し。
  - 1部を離れた頃の借金は**1億ユーロ**超。2024年の夏に**ゼロ**になったと、クラブは言います。
  - 3部でも、ファンは離れませんでした。2022年から23年の年間シートは**2万5001人**です。
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_de_A_Coruña
  - https://www.mundodeportivo.com/en/soccer/20260818/1004217118/1-1-depor-and-elche-share-the-points-after-stunning-goals-from-aubameyang-and-aguado.html
  - https://www.lavozdegalicia.es/noticia/torremarathon/2024/06/12/benassi-primera-vez-deportivo-va-tener-euro-deuda/00031718216294562963830.htm
  - https://en.wikipedia.org/wiki/Deportivo_de_A_Coru%C3%B1a
  bg: assets/backgrounds/stadium_デポルティーボラコルーニャ_in.png
  official: false
