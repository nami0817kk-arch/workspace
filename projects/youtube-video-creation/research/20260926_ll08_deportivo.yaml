- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 37歳のエースと、残留を見すえる監督
  narrator: キャスター
  say:
  - text: '**37歳**のオーバメヤンが、開幕から**5節**連続ゴール。いまは右ひざの手術で離脱中。'
    image: assets/stats/ll_deportivo_data_r1.png
    no_telop: true
  - text: 率いるヒダルゴ監督は、目標をこう話します。
    image: assets/stats/ll_deportivo_data_r2.png
    no_telop: true
  - voice: アントニオ・ヒダルゴ
    text: 僕らは昇格組。残留の勝ち点42か43へ、毎日限界まで戦い、苦しまないといけない
    image: assets/stats/ll_deportivo_data_r2.png
  - text: そしてこのクラブは、**2000年**のリーグ優勝チーム。3部まで落ちて、はい上がってきました。
    image: assets/stats/ll_deportivo_data_r3.png
    no_telop: true
  - image: assets/stats/ll_deportivo_data0.png
    text: 創立は**1906年**。体育館サラ・カルベットの仲間たちが作りました。
    no_telop: true
  - image: assets/stats/ll_deportivo_data1.png
    text: 愛称は「エルクリーノス」。町に立つローマの灯台、ヘラクレスの塔から来ています。
    no_telop: true
  - image: assets/stats/ll_deportivo_data2.png
    text: ホームタウンはア・コルーニャ。大西洋に面したガリシアの町で、**約25万人**が暮らします。
    no_telop: true
  - image: assets/backgrounds/stadium_デポルティーボラコルーニャ.png
    text: 本拠地はリアソール。浜辺のすぐそばに建ち、クラブの発表では**3万2490人**が入ります。
  - image: assets/stats/ll_deportivo_data4.png
    text: オーナーはガリシアの銀行、アバンカ。株の**99パーセント**以上を持っています。
    no_telop: true
  - image: assets/stats/ll_deportivo_cups.png
    text: 1部の優勝は**1回**。国王杯**2回**、スーペルコパ**3回**、インタートトカップ**1回**。
    no_telop: true
  - image: assets/stats/ll_deportivo_data6.png
    text: 最多出場は、中盤のフラン。このクラブひと筋で**700試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_deportivo_data7.png
    text: 直近のタイトルは、2023年から24年のシーズンに取った、3部の優勝です。
    no_telop: true
  - image: assets/stats/ll_deportivo_data8.png
    text: 昨シーズンは2部で**2位**。勝ち点**77**で、1部への昇格を決めました。
    no_telop: true
