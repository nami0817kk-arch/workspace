sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 報道
    telop: 前田大然が21分にプレミア初ゴール。シティに2対3
    say:
      - voice: オニール監督
        text: 彼はスピードと身体の強さを生かし、良いフィニッシュを見せた。
        short_voice: true
      - これは、17日のシティ戦で、前田大然が決めたプレミア初ゴールへの、監督の評価です。
      - 試合は、イプスウィッチが2対3で負けました。
      - 前田は右のシャドーで先発しました。
      - シティに1点リードされていた21分に、スルーパスで抜け出します。
      - 最後は、GKドンナルンマとの一対一を、左足で決めました。
      - リーグ初得点は、出場7試合目でのことでした。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?461279-461279-fl
    quotes_from: ["ゲキサカ https://web.gekisaka.jp/news/world/detail/?461279-461279-fl"]

  - id: praise
    heading: 前田の初ゴールは、どう評価されたか
    tier: 報道
    telop: 前田の初ゴールへの評価は「速さ」「強さ」「冷静さ」
    say:
      - 前田のゴールには、現地の記事も注目しました。
      - 評価は、速さ、強さ、冷静さの3つです。
      - まず、イングランド代表のグエヒを、速さと体の強さで上回った、という評価です。
      - 次に、冷静なフィニッシュで、ドンナルンマを破った、とも書かれました。
      - イプスウィッチを追う地元のサイトは、グエヒの接触に耐えた点を挙げます。
      - ドンナルンマとニアポストのあいだを抜いた一撃です。
      - これを、自信に満ちたフィニッシュと評価しました。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?461279-461279-fl

  - id: plan
    heading: 監督が組んだ、シティ対策
    tier: 報道
    telop: ボール保持時は普段より高い位置に配置
    say:
      - 監督は、この得点を、狙いどおりの形だったと明かしています。
      - この日は、ボールを持つときの前田を、普段より高い位置に置きました。
      - シティは、最終ラインを高く保ちます。
      - その背後を、前田とエメルソンのスピードで突く狙いでした。
      - 得点の場面では、シティの左サイドバックが、パスの出し手の対応に引き出されました。
      - 前田は、その背後に空いたスペースを使ったのです。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?461279-461279-fl

  - id: view
    viewpoint: true
    heading: 監督の狙いと3つの評価、7戦全勝のシティ
    tier: 背景
    telop: シティの失点は7試合で7点。この試合は2点
    say:
      - 見立てです。監督の狙いは、高い最終ラインの背後でした。
      - 3つの評価は、その狙いと重なります。
      - 相手のシティは、ここまで7戦全勝の首位です。
      - ただ、失点は7試合で7点、1試合平均で1点でした。
      - この試合は、その倍の2点を取られました。そのうちの1点が、前田の初ゴールです。
      - 次のイプスウィッチの試合は、23日のホームでのフォレスト戦です。
