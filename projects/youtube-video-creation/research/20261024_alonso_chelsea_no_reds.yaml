    tier: 報道
    telop: 昨季11枚の退場が、今季はゼロ。アロンソが語った理由
    say:
      - text: チェルシーは昨季、レッドカードを11枚もらいました。
        image: assets/images/20261024_alonso_chelsea_no_reds/01_w.jpg
      - text: 今季は、まだ1枚も出ていません。アロンソ監督はこう話しました。
        image: assets/images/20261024_alonso_chelsea_no_reds/01_w.jpg
      - voice: アロンソ
        text: 私にとっては、感情のコントロールが大きい。試合のコントロールもだ。
        short_voice: true
        image: assets/images/20261024_alonso_chelsea_no_reds/02_w.jpg
      - voice: アロンソ
        text: やるべきことに集中していれば、ミスは減るし、過剰に反応しない。
        cont: true
        image: assets/images/20261024_alonso_chelsea_no_reds/02_w.jpg
      - voice: アロンソ
        text: 冷静さを保てば、ばかげたイエローも、ばかげたPKもない。
        cont: true
        image: assets/images/20261024_alonso_chelsea_no_reds/03_w.jpg
      - text: 英語の会見の言葉を、こちらで訳しました。
        image: assets/images/20261024_alonso_chelsea_no_reds/03_w.jpg
    official: false
