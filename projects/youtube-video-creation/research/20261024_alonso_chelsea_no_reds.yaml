# 取材メモ（2026年10月24日）アロンソ「感情のコントロールだ」。昨季11枚だったチェルシーの退場が、今季はゼロ（ニュースのショート。見せ方 Y＝アロンソ本人の言葉から始める）
# 取材: 2026-10-24。requests（ブラウザUA）で本文を全部読んだ。
#   ・ガーディアン「Premier League news: Spurs' nine injuries 'normal', says De Zerbi; 'emotional control' keeps Blues red-free」（10/23、Jacob Steinberg 記者の項）— 題材の元。
#       地の文: 昨季チェルシーはレッドカード11枚（picked up 11 red cards last season）。今季はまだ0（have not had a red card this season）。先週末エヴァートンで2-0で勝った試合でも賢さを見せた。
#       アロンソは昨夏に監督になってから、この問題に取り組んだ（地の文）。
#       本人: 'For me it comes a lot with emotional control, with the control of the game' / 'If you are focused on what you have to do, you are prepared for what's going on. Normally you don't make that many mistakes and don't overreact to certain situations.'
#             'This is a fundamental part of the game, to have that emotional control. ... we keep calm, I don't lose my head and I don't get stupid yellow cards, make stupid penalties.'
#             経験のある選手の補強について 'I think it helps. Absolutely. It helps for that composure that you need in certain moments.'
#             'To find a total dominance in a game ... it's difficult to find it in the Premier League unless you have become a top, top, top team. That's why you can't rest on your laurels when you are 2-0 up.'
#             'It is people on the pitch ... I have from the touchline some kind of input but the real one is from the players.'
#       スパーズは2018年からスタンフォード・ブリッジで勝っていない（ガーディアン地の文）。
#   ・チェルシー公式「Xabi Alonso confirms Chelsea team news for Tottenham」（10/23）: 直近はボーンマスに5-1、エヴァートンに2-0でリーグ2連勝。
#   ・チェルシー公式「Alonso targeting a complete performance…」（10/23）: スパーズ戦は今季のプレミア8試合目（'game eight'）。ホームのスパーズ戦は直近41試合で1敗だけ（公式の書き方）。
#   → 台本の訳はこちらの自訳（英語の記者会見）。「ばかげた」は stupid の訳。
# 言わないこと: キックオフ時刻（ガーディアンは evening、公式は afternoon で食い違う）。11枚の内訳（リーグ戦か公式戦全体か）は記事に無いので「昨季」とだけ言う。
# 自分で数えた比べ（見立て）: 昨季11枚→今季0枚。今季はプレミアで7試合を終えた段階（公式の game eight から）。
# 確度: 報道（ガーディアンの会見記事。チェルシー公式で試合結果を確認）。
# 反応: 0件。作らない。approve は --no-voices で。
# 写真: 01・02 はチェルシー公式の記事主写真（10/23、練習場）。03 は Commons CC BY-SA 2.0（Giovanni Batista Rodriguez、2021年レアル・ソシエダB監督時代。写真に撮影者名の小さな表記あり）。ガーディアンの写真はロイター・PA なので使わない。
