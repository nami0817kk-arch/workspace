  say:
  - text: ブレントフォードの本拠地の敷地は、三方を鉄道の線路にはさまれた土地でした。
    image: assets/images/20261012_stadium_brentford/03_w.jpg
    card: none
  - text: そのため、スタンドの四隅のうち2つが、角を切り落とした形になっています。
  - text: 南スタンドだけが高く、ほかの3つは低い。高さの違う4つを、つなぐ必要がありました。
  - text: 南スタンドの両端を斜めに切って、屋根の先を1つの面につなぎました。
  - text: その先に、キュー・ブリッジの古い給水塔が見える形になっています。
  - text: もう1つの難題は、お金でした。
  - text: 全体の費用のうち、構造そのものが45％を占めました。ふつうの建物より高い割合です。
    card: *id_build
  - text: 設計を見直して、鉄筋コンクリートは、はじめの案の半分にしました。
    card:
      <<: *id_build
      focus: 1
  - text: 主な鉄骨も、3分の1減らしています。
    card:
      <<: *id_build
      focus: 1
  - text: この節約が、事業をお金の面で成り立たせたとされています。
    emph: true
    card:
      <<: *id_build
      focus: 1
  - text: 二酸化炭素では、8400トンの削減になりました。
    card:
      <<: *id_build
      focus: 2
  - text: 客席の中身も、見直しました。
    card: none
  - text: 企業向けの席は、はじめの計画の1874席から、3000席に増えています。
