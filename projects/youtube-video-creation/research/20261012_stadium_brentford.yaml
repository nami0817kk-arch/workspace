# スタジアム紹介シリーズ④：ブレントフォード（ジーテック・コミュニティ・スタジアム、10/12）。
# **節の並びは①ボーンマス②エミレーツ③ヴィラ・パーク（10/11）と同じ型**：
#   オープニング → 基礎DATA(main・強い一点を頭に) → この土地と計画(年表) → 建て方(板) → ここで起きた試合(表) →
#   手を入れてきた器(年表) → 見立て(viewpoint・自分で数えた比べ)。**文は全部この回のために書いた。**
#
# 強い一点：**クラブは来年（2027年）の夏から、この器で年に最大6回、最大2万4000人のコンサートを開く案を出している**
#   （サッカーの日の収容は1万7250人。差は6750人＝1.39倍。ピッチを保護材で覆い、立ち見が最大1万3900人。
#   建物の工事はしない。ハウンズロー区の許可が要る）。確度は**報道**
#   （チャンネルが使った出どころ：Chiswick Calendar 2026-05-27／06-26、Time Out 2026-06-29、City AM 2026-05-27、
#   クラブの説明資料を伝えた Roundtable 2026-07-21。クラブの発表文そのもの〔brentfordfc.com〕には当たれていない。
#   許可の申請書そのものも未確認。6月に出たのは環境影響の「審査範囲の報告書」まで。台本は「案」「計画」の線を越えない）。
#   名前のある人の言葉は Sally Stephens（クラブの広報担当）の「慎重に計画し、運営する必要がある」だけで、
#   台本には引いていない → 声は0件。
#
# **重なりで外したもの（クラブ紹介④ブレントフォード 2026-09-20 公開が読んだ話）**
#   **創立1889年・愛称ビーズ・オーナー・プレーオフ9敗・1967年の吸収話・ホーム全勝21試合・主将コリンズ・トニー・エンベウモ・
#   アンドリュース監督は一度も出していない。**クラブ紹介が読んだ「グリフィン・パークは四つ角すべてにパブ」も使わない。
#   「収容1万7250人は20クラブで2番目に小さい」の言い方も使わない（建物の数字として1万7250人だけを出す）。
#   グリフィン・パークは**収容の数字が食い違う**（12,573〜12,763）ので、旧スタジアムの収容は言わない。
#
# **同じ日の他の回とクラブ・人名を重ねない**
#   リヴァプール・最年少の記録・イプスウィッチ・アトレティコ・アルバレスは出していない。
#   出した固有名：アーセナル（プレミア初戦の相手）／オックスフォード／ハダースフィールド／ブラックバーン／ダービー・カウンティ
#   ／セルジ・カノス／クリスティアン・ノアゴー（どちらもプレミア初戦の得点者）。
#
# **言わないと決めたもの**
#   **女子の欧州選手権（2022）・女子代表戦は扱わない**（2026-09-16 指示。この器の歴史には入っているが落とした）。
#   ラグビー（ロンドン・アイリッシュ）の本拠地としての歩みは、のちに管理下に入ったので言わない。
#   工事費7100万ポンドは**stadiumdb の記事（2014年）と各サイトの転載だけ**で、クラブ・施工者の発表に辿れなかったので言わない。
#   1席あたりの値段は割らない（②エミレーツの見立て）。20クラブの収容の順位表も使わない。
#   2012年の発表は「1万5000人（のち2万人まで）」、英語版Wikipediaは「2万人（のち2万5000人まで）」と**食い違う**ので、
#   2012年の収容は言わない。確かな数字は2002年の構想（2万3000〜2万5000人、Bees United 2002-11-06）と、
#   2018年の起工時の1万7250人だけ。
#   起工式の日付は 3月19日（Wikipedia）／3月20日（地元紙の記事の日付）と割れるので「2018年3月」までにした。
#   「設計から開場まで3年足らず（Arup）／3年あまり（SSDA）」も食い違うので「3年ほど」にした。
#   旧スタジアムの最後の試合・取り壊し・跡地の75戸の住宅は、建物そのものの話ではないので入れていない。
#   オープニングの親善試合のゴールは「カノスが2点」（Bees United の試合記録・Wikipedia）。別の要約に
#   「2対1で先行」とあったが、試合記録は2点とも彼とするので、点の順は言わない。
#
# 数字は自分で割った・引いた（検算した）:
#   2002-11-06 → 2020-09-01 ＝ 17年9か月（6532日）／24,000 ÷ 17,250 = 1.3913 →「1.39倍」／24,000 − 17,250 = 6,750／
#   16,479 ÷ 17,250 = 0.9553 →「95.5%」／2020-09-01 → 2021-08-13 ＝ 346日／
#   2020-21 のホームのリーグ戦23試合のうち21試合は観客0（ESPN）、2000人が入ったのは12/5（ブラックバーン）と12/9（ダービー）の2試合
#   → 合計4000人／16,479 ÷ 4,000 = 4.1198 →「4.1倍」／
#   17,250 ÷ 25,000 = 0.69 →「69%」／3,000 − 1,874 = 1,126／敷地 31,000㎡ ÷ ピッチ 7,140㎡（105×68）= 4.34。
#
# 写真は Commons の原版から取り直した4枚（assets/images/20261012_stadium_brentford/、credits.json も同じ場所）。
#   **見本どおり assets/backgrounds/stadium_ブレントフォード_in.png と同名の外観を使うと、両方とも元が小さかった**
#   （in＝geograph 640x296 を1920幅に拡大済み／外観＝geograph 768x1024 の縦写真を横に切って拡大済み）。
#   precheck の引き伸ばしは**拡大済みの PNG を見るので 1.0倍と出て素通りする**が、実物は3倍近い。取り直した：
#   01_w＝満員に近い夜のスタンド（Jim Linwood・CC BY 2.0・2024-12-21 対ノッティンガム・フォレスト・4000x3000）／
#   02_w＝線路の脇から見た外観（AndyScott・CC BY-SA 4.0・2020-05・4000x2660。サムネ・自動の入れ替えもこの1枚）／
#   03_w＝キュー・ブリッジ駅と建設中の器（AndyScott・CC BY-SA 4.0・2019-05・2500x2348）／
#   04_w＝ジーテックの看板が付いた入口（AndyScott・CC BY-SA 4.0・2023-10・3000x2004）。
#   01 は観客が入った写真なので、観客のいなかった1年の話には使わず、`spread_long_cards` が挟む「サムネの写真」を
#   02 にして、長い節の途中で観客入りの写真に化けないようにした。
#   **assets/backgrounds/ のまま使うと、ショートが assets/stats/stadium_ブレントフォード_v.png
#   （クラブ紹介④の基礎DATAの縦板）に化ける**（スタジアム紹介①で踏んだ）ので、写真は images/ に置く。
#
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11「サムネは相談して決めよう」）。
#   ここに書いた thumbnail は案A（scene）。B（number）・C（scene・外観）は報告に書いた。
