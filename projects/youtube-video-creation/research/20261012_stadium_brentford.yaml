  - https://en.wikipedia.org/wiki/Gtech_Community_Stadium
- id: view
  viewpoint: true
  heading: 見立て・17年待った器は、来夏どこまで広がるのか
  tier: 報道
  telop: 2002年の構想の幅に、来夏の案が収まる
  narrator: 解説
  card: &id_first
    type: calc
    title: 1年目の23試合と、プレミア初戦1試合（自分で割った）
    terms:
    - - 1万6479人
      - プレミア初戦1試合の入場
    - - 4000人
      - 1年目、ホーム23試合の入場の合計
    - - 4.1倍
      - 割った答え
    ops:
    - ÷
    - ＝
  say:
  - text: では、この器の数字を、自分で並べ直してみます。
    image: assets/images/20261012_stadium_brentford/01_w.jpg
    card: *id_first
  - text: プレミア初戦の1試合の客を、開いた1年目の客の合計で割ってみます。
    card: *id_first
  - text: 答えは4.1倍。1年かけて入った客の、4倍あまりが、たった1試合に入りました。
    emph: true
    card: *id_first
  - text: 次に、収容そのものの動きを並べます。
    card: &id_cap
      type: table
      title: 収容の動き（自分で並べた）
      columns: &cols_cap
      - 時点
      - 収容
      rows: &rows_cap
      - - 2002年の構想
        - 2万3000〜2万5000人
      - - 2020年の開場
        - 1万7250人
      - - 来夏のコンサート案
        - 最大2万4000人
  - text: いちばん上が、2002年の構想です。いまの収容より、ずっと大きな器でした。
    card:
      type: table
      title: 収容の動き（自分で並べた）
      columns: *cols_cap
      rows: *rows_cap
      highlight_row: 0
  - text: 出来上がったのは、その上の端の69％です。
    emph: true
    card:
      type: table
      title: 収容の動き（自分で並べた）
      columns: *cols_cap
      rows: *rows_cap
      highlight_row: 1
  - text: ところが、来夏のコンサート案は、その構想の幅に入っています。
    emph: true
    card:
      type: table
      title: 収容の動き（自分で並べた）
      columns: *cols_cap
      rows: *rows_cap
      highlight_row: 2
    mark:
      kind: circle
      row: 2
      col: 1
      text: 構想の幅の中
  - text: 開くのは、6月と7月の週末。夜は遅くとも11時まで。建物の工事は、しない案です。
  - text: ハウンズロー区の判断は、まだ出ていません。
  - text: クラブは、環境への影響を調べる報告の書類を出したところです。
  - text: 許可が出れば、最初の公演は2027年の夏。
    emph: true
  - text: 17年9か月かけて開いた器が、使われ方で、もう一度大きくなるのかどうか。
