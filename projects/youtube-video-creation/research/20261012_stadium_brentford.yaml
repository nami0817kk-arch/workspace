        - 観客のいなかった試合
      - - '2'
        - 試合
        - 2000人が入った試合
      - - '4000'
        - 人
        - 23試合の入場の合計
      focus: 2
  - text: 満員に近い客が入ったのは、2021年8月13日。プレミアの初戦、アーセナル戦です。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: 入場は1万6479人。収容の95.5％にあたります。
    emph: true
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: セルジ・カノスと、クリスティアン・ノアゴーが決めて、2対0の勝ちでした。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: 開場から346日たっていました。
    card: none
