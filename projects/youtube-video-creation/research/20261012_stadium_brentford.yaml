  - text: 2002年11月、サポーターの団体が、新しい本拠地の構想を発表します。
    card:
      <<: *id_time
      highlight_row: 0
  - text: 場所はライオネル・ロード。収容は2万3000人から2万5000人でした。
    card:
      <<: *id_time
      highlight_row: 0
  - text: 近くを走るモノレールの終点にする話まで、付いていました。
    card:
      <<: *id_time
      highlight_row: 0
  - text: そのモノレールの話は、のちに消えています。
    card:
      <<: *id_time
      highlight_row: 0
  - text: 2012年6月、クラブがその土地を買いました。
    card:
      <<: *id_time
      highlight_row: 1
  - text: それまでは、廃棄物の中継などに使われていた土地です。
    card:
      <<: *id_time
      highlight_row: 1
  - text: 当時の目標は、2016-17シーズンの開幕に間に合わせること。
    card:
      <<: *id_time
      highlight_row: 1
  - text: 2014年12月には、建設会社との開発の契約まで進みます。
    card:
      <<: *id_time
      highlight_row: 2
  - text: ところが、最後の用地が手に入ったのは2016年9月。
    card:
      <<: *id_time
      highlight_row: 3
  - text: 目標にした開幕は、もう過ぎていました。
    card:
      <<: *id_time
      highlight_row: 3
  - text: 持ち主が異議を唱え、区が強制的に買い取る手続きに、時間がかかったためです。
