  - text: 新型コロナの規制で、満員になるはずだったスタンドは空でした。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: 9月19日、リーグ戦の初戦。ハダースフィールドに3対0の勝ちでした。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: これも、観客はいません。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 客が入ったのは12月5日。ブラックバーンと2対2の引き分けでした。
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 入れたのは2000人だけ。規制で、上限がその数だったからです。
    emph: true
    card:
      type: table
      title: ブレントフォードの本拠地で起きた4つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 12月9日のダービー・カウンティ戦にも、同じ2000人が入りました。
    card: none
  - text: この年のホームのリーグ戦は、2部の23試合。客が入ったのは、その2試合だけです。
    card: &id_empty
      type: stats
      title: 開場1年目、ホームのリーグ戦23試合
      items:
      - - '21'
