- id: reform
  heading: 手を入れてきた器
  tier: 背景
  telop: 2022年に立って見られる席と、名前の権利。次は使い方
  narrator: 解説
  card: &id_reform
    type: timeline
    title: 開場のあとの、器の変わり方
    rows: &rows_reform
    - - 2020年9月
      - 開場
    - - 2021年8月
      - プレミア初戦。入場1万6479人
    - - 2022年7月
      - 名前の権利を10年で預ける
    - - 2022-23
      - 西スタンドに手すり。立って見られる席に
    focus: 2022-23
  say:
  - text: 開いたあとも、ブレントフォードの本拠地には少しずつ手が入っています。
    image: assets/images/20261012_stadium_brentford/04_w.jpg
    card:
      <<: *id_reform
      highlight_row: 0
  - text: 2022年7月、器の名前を10年間、ジーテックに預ける契約が結ばれました。
    card:
      <<: *id_reform
      highlight_row: 2
  - text: クラブの歴史でいちばん大きなスポンサー契約だった、とクラブは発表しています。
    card:
      <<: *id_reform
      highlight_row: 2
  - text: 2022-23シーズンからは、西スタンドの座席の前に、手すりが付きました。
    card:
      <<: *id_reform
      highlight_row: 3
  - text: 座席はそのままです。手すりを付けて、立って見られる区画にしたものです。
    card:
      <<: *id_reform
      highlight_row: 3
  - text: 建物を建て直さずに、使い方で変える。次の手も、同じ形です。
    emph: true
    card: none
  sources:
  - https://insidersport.com/2022/07/29/home-of-brentford-fc-becomes-gtech-community-stadium/
