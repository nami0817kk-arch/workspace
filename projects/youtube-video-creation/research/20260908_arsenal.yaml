# アーセナル対チェルシー の取材メモ（2026年9月8日）
slot: premier
date: "2026年9月8日"

theme:
  id: arsenal_chelsea
  league: england
  prefix: ""
  title: "アーセナル、2分で失点してから何をしたのか"
  hook: "2分で失点したアーセナルが、そこからどう勝ったか"
  question: "3試合ぶりに失点したアーセナルは、なぜ勝てたのか"

thumbnail:
  line1: "2分の失点から逆転"
  line2: "ウーデゴーアが決勝点"
  tags: ["アーセナル", "チェルシー"]
  photo: "assets/photos/20260908_arsenal/01.jpg"

answer: "先に取られてから25分と50分に取り返しました。守りが崩れたのではなく、取り返す形を持っていたということです"
watch: "サリバがまだ1分も出ていません。戻ってきたときの守備"

sections:
  - id: what
    heading: 何が起きたのか
    tier: 報道
    telop: "アーセナル 2-1 チェルシー"
    say:
      - "プレミアリーグ第3節、アーセナル対チェルシー"
      - "アーセナルが2対1で勝ちました"
      - "これで開幕から3連勝です"
    official: false
    sources:
      - "https://www.soccer-king.jp/news/world/eng/20260907/2201563.html"
      - "https://web.gekisaka.jp/news/world/detail/?458395-458395-fl="

  - id: score
    heading: 得点の流れ
    tier: 報道
    telop: "2分・25分・50分"
    say:
      - "先に取ったのはチェルシーでした。2分、モーガン・ロジャーズです"
      - "25分にカイ・ハヴァーツが追いつきます"
      - "そして50分、マルティン・ウーデゴーアが決めました"
      - "アーセナルは公式戦3試合つづけて無失点でしたが、この日が今季初失点です"
    official: false
