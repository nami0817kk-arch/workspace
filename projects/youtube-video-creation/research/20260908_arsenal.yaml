  - id: react
    heading: 判定はどう受け止められたか
    tier: 報道
    telop: "元審判「暴力行為ではない」"
    say:
      - "元プレミアリーグ審判のマーク・ハルシー氏が見解を出しています"
      - {voice: ハルシー, text: "疑いの余地なく暴力行為ではない"}
      - {voice: ハルシー, text: "VARが介入しなかったのは正しい"}
      - "一方で現地からは、軽率な行動だという指摘も出ました"
    official: false
