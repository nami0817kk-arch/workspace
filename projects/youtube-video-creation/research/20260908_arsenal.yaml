      - "https://www.soccer-king.jp/news/world/eng/20260907/2201563.html"

  - id: turn
    heading: 物議になった場面
    tier: 報道
    telop: "顔面へのキックにお咎めなし"
    say:
      - "ゴール前の混戦で、ガブリエウの足がチェルシーのGKの顔に当たりました"
      - "ボールに触ろうとした両者が、同時に飛び込んだ形です"
      - {voice: ザ・サン, text: "顔を押さえて倒れ込んだ"}
      - "VARは介入せず、カードも出ませんでした"
    official: false
    sources:
      - "https://www.football-zone.net/archives/672186"
