  - id: said
    heading: 解説者はどう見たか
    tier: 報道
    telop: "「全体がバラバラのように見える」"
    say:
      - "試合後、ギャリー・ネビルとジェイミー・キャラガーが見解を示しています"
      - {voice: ギャリー・ネビル, text: "3バックは脚が腰につながっていない感じだ"}
      - {voice: ギャリー・ネビル, text: "まるで全体がバラバラのように見える"}
      - {voice: ジェイミー・キャラガー, text: "心配なのはサリバが今季まだ1分も出ていないこと"}
      - {voice: ジェイミー・キャラガー, text: "しかも誰も彼ら相手に得点できそうに見えない"}
    official: false
