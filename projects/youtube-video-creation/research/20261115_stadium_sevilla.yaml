# スタジアム紹介シリーズ：セビージャの本拠地（ラモン・サンチェス・ピスファン、11/15 予定）。雛形は 11/13 レアル・ソシエダの回（20261113_stadium_realsociedad）。
# 題材の選び方（2026-11-12）：指示書 20261115 の「ラ・リーガの続き」。済み＝アトレティコ・バルサ・レアル・ビルバオ・バレンシア・ソシエダ。残り＝セビージャ・ベティス・ビジャレアル。
#   セビージャを選んだ理由：ビッグクラブ（EL最多優勝）／「7万7000人から4万3751席へ縮んだ器を、壊して建て直す」という強い一点／W杯準決勝・欧州決勝3つを開いた歴史／今季のホーム入場の数字で見立てが作れる。
#   picks（research/20261115_picks.txt）：同じ11/15のユニフォームはバレンシア。重ならない。11/17 のスタジアムはベティス（自分の2本目）。ビジャレアルは残す。
#   重なりの確認：scripts/*stadium_* にセビージャは無し（posted.json・covered.yaml も grep 済み）。
# 一次情報の突き合わせ：
#   ESPN esp.1 teams/243 の2026-27日程。ホーム入場の記録あり5試合＝ラージョ 36777（8/15）・バレンシア 39939（9/11）・バルセロナ 41145（9/19）・オサスナ 38523（10/26）・アラベス 38803（11/6）。アトレティコ戦（8/29）は入場0＝記録なしで除外。合計195187÷5＝39037.4。
#   ピスファン：es・en ウィキペディア（開場1958-09-07、礎石1956-12-02、収容43751、スペイン代表25試合20勝5分負け無し、1937年に土地購入開始、1975年初めに外壁完成・最大7万7000超、1982年約7万500、1998年UEFA全席座席で62000→45500、2015年42714、2018年+1300）。
#   W杯準決勝 1982-07-08 3-3 PK 5-4／欧州王者決定戦 1986-05-07 0-0 PK 2-0／EL決勝 2022-05-18 1-1 PK 5-4・入場38842（いずれも英語版ウィキペディアで確認）。
#   建て直し：stadiumdb 2026-04（市が仮承認・約5万5000席・全面屋根・地下駐車場）、2026-02（会長の話・ピッチを下げる・北ゴール裏1段・資金は将来収入を担保にした借入・ツアー年10万人に近い・ラ・カルトゥーハは技術的・一時的）、2023-12（当初の着工予定 2026年6月1日）。費用は es ウィキペディア（3億〜3.5億ユーロ）。壊すのは2027年と報じる El Gol Digital（検索結果の要約から。本文は未読）。
