    say:
      - レアル・ソシエダがヨーロッパリーグの初戦を迎えました。相手はボーンマスです。
      - 久保建英の名前は、この日もスタメンにありませんでした。
      - "**公式戦で、これが3試合目になります。**"
      - エルチェ戦は出番そのものがなく、アトレティコ・マドリード戦は72分から。
      - そして今回は、後半38分からの出場でした。
      - 大会が変わっても、序列は動きませんでした。
