      - https://www.uefa.com/uefaeuropaleague/match/2050067--real-sociedad-vs-bournemouth/

  - id: voices
    heading: 現地サポが荒れた
    tier: 未確認
    bg: assets/backgrounds/kubo_20260918.png
    telop: 「クボには悪魔祓いが必要だ」
    narrator: キャスター
    say:
      - {voice: 現地サポ, text: マタラッツォが敷いた3-5-2はまったく納得できない。この試合はクボとゲデスを絶叫して求めている}
      - {voice: 現地サポ, text: ゲデス、ソレール、スチッチ、さらにはクボまでベンチに置くとは、よほどの間抜けでなければできない}
      - {voice: 現地サポ, text: もうマタラッツォを解任してくれ。クボとゲデスをベンチに置くなんて呆れてものが言えない}
      - {voice: 現地サポ, text: クボには悪魔祓いが必要だ}
      - {voice: 現地サポ, text: クボはいないし、これから出てくる見込みもない}
      - {voice: 現地サポ, text: クボが1年以上エンジンのかからないままだ}
      - {voice: 現地サポ, text: このシステムではクボの方がバレネより多くを与えられると思う。日本人がどれだけひどい状態でもだ。ボールを扱う感覚がはるかに上だから}
      - {voice: 現地サポ, text: タケ・クボには復調の芽}
      - {voice: 現地サポ, text: クボのどこが芽だ？ お前はどの試合を見てたんだ？}
      - {voice: ネット民, text: 「現在の状態が続くうちは先発としては使わないよ」ってメッセージのように思えますね}
      - {voice: ネット民, text: 今季ノーゴールノーアシストで3試合連続スタメン落ち。完全にソシエダの控え選手になってしまった}
      - {voice: ネット民, text: 先週よりも短い時間だったけど、先週より全然よかった。徐々に上向いていると思うから、週末先発期待したい, short_voice: true}
      - {voice: ネット民, text: 調子が上がるまではこのままでいいかもね, short_voice: true}
      - {voice: ネット民, text: 久保個人としては、代表でリハビリして調子を取り戻して欲しい, short_voice: true}
