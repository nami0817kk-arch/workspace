# 久保建英が3試合続けて先発を外れた（2026-09-18）
#
# **ユーザー指示「ソシエダは、久保のスタメン落ちについて話す」**（2026-09-18）。
# いったん監督の言葉を主題にしたが、戻した。
#
# **過去2本と重ならせない。**同じ人の先発落ちを、すでに2回やっている:
#   ・9/14 `20260914b_kubo.md`「久保建英が2戦続けてベンチ。出番が来たのは何分からか」
#     → 2試合目・出場時間・地元紙が採点をつけなかったこと
#   ・9/17 `20260917_kubo.md`「久保建英について、スペイン紙が『2度目』と書いた」
#     → ベンチスタートが2度目になったこと
# **この回で新しいのは3つ:**
#   ①3試合目になったこと（しかも大会が変わって、EL初戦でも外れた）
#   ②**前日に監督が「もうすぐ本来の調子を取り戻す」と話していた**のに先発ではなかった
#   ③**現地の評価が真っ二つに割れている**（「悪魔祓いが必要」と「使わない監督が間抜け」）
# **採点の話はしない**（9/14 でやった）。出場時間の話も深追いしない。
#
# 引きは**前日の監督の言葉**（@main）。
#
# **ネットの声は久保の話だけにする**（ユーザー指示「関係ないコメントはなくす」）。
# スチッチ・オスカルソン・フォートなど他の選手の出来を論じた投稿は落とす。
#
# **数字の採点は無い。**MARCA はアクセスが拒否され、AS・地元紙にも到達できなかった
#
# **久保本人の試合後コメントは無い。**日本語・スペイン語・英語のどこにも無かった
#
# **サムネはエンブレム2つ。**Commons の久保の写真は2019年のレアル・マドリード時代
# しか無く、18歳の姿だった。記事の報道写真も試したが、写っていたのは
# **ボーンマスの選手**で久保はいなかった（消した）
# **下地は久保の写真**（2026-09-18 ユーザー指示「久保の話の背景は、スタジアムではないよ」）。
# 既定の `stock/match_stadium.mp4` は**ヴォルフスブルクのスタジアムの実写**で、
# ソシエダの試合に合わない。アノエタの外観も試したが、建物では中身を語らない。
# **本人の写真2枚を使い分ける**:
#   下地 = プレー中（サッカーダイジェスト）／サムネと画面の写真 = ビブス姿＝控え（フットボールチャンネル）
format: news
