  - id: words
    heading: 前日に監督が話していたこと
    main: true
    tier: 報道
    bg: assets/backgrounds/kubo_20260918.png
    telop: 「もうすぐ本来の調子を取り戻す」
    narrator: 解説
    say:
      - {short_only: true, text: レアル・ソシエダがホームでボーンマスに1対2で敗れた試合です。}
      - 前日の会見で、監督のマタラッツォは久保についてこう話していました。
      - {voice: マタラッツォ監督, text: タケは調子を取り戻そうと懸命にハードワークしている}
      - {voice: マタラッツォ監督, text: すべてのトレーニングに全力で取り組んでいるし、非常に前向きな姿勢を見せている}
      - {voice: マタラッツォ監督, text: もうすぐ本来の調子を取り戻す。そうしたポジティブな兆候があるんだ}
      - "**それでも、翌日の先発に名前はありませんでした。**"
      - 久保自身は、試合の前にこう語っていました。
      - {voice: 久保建英, text: いま僕らの目標はヨーロッパリーグ優勝}
      - 試合後、監督は久保について何も話していません。
    official: false
    sources:
      - https://news.mynavi.jp/article/20260917-4984156/
      - https://www.eldesmarque.com/futbol/europa-league/20260917/pellegrino-matarazzo-real-sociedad-bournemouth-dos-caras-oskarsson-mensaje-descanso_18_020201924.html

  - id: match
    heading: 試合はどうなったか
    tier: 報道
    bg: assets/backgrounds/kubo_20260918.png
    telop: 前半20分で2失点。1対2で敗れた
    narrator: キャスター
    say:
      - 試合は、ホームのソシエダが前半20分で2点を追う展開になりました。
      - 12分にクライファート、20分にラヤン。どちらもボーンマスです。
      - 後半12分にセルヒオ・ゴメスが1点を返しましたが、そこまででした。
      - "**このクラブは創設から127年、欧州の大会に出たことが一度もありませんでした。**"
      - その初めての試合で、ボーンマスは勝っています。
      - ソシエダにとっては、これで公式戦2連敗です。
    official: false
    sources:
