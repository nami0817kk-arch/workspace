sections:
  - id: now
    heading: いま何が起きているか
    tier: 報道
    telop: 先発3試合で4ゴール
    narrator: キャスター
    card:
      type: table
      title: サラーのスュペル・リグ（トラブゾンスポル）
      columns: ["節", "サラー"]
      rows:
        - ["第1節", "途中出場"]
        - ["第2節", "初先発で2ゴール（2-1で今季初勝利）"]
        - ["第3節", "1ゴール"]
        - ["第4節", "PKで1ゴール＋アシスト（5-0）"]
    say:
      - モハメド・サラーが、トルコで数字を並べています。
      - 昨季かぎりでリヴァプールを退団した34歳です。
      - 開幕節は顔見せ程度の途中出場でした。
      - 第2節のバシャクシェヒル戦で初先発。移籍後初ゴールを含む2得点を決めます。
      - 続く第3節も1ゴール。7日の第4節はPKで1点、さらにアシストして5対0の圧勝でした。
      - オプタによると、2000-01シーズン以降、トラブゾンスポルの外国籍選手で先発3試合4ゴールはサラーが初めてです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35556/
      - https://web.ultra-soccer.jp/news/all/33785/

  - id: arrival
    heading: 迎えられ方が違った
    tier: 報道
    telop: 空港に2万5000人
    narrator: キャスター
    say:
      - 移籍の進み方も、ふつうではありませんでした。
      - 8月4日、トラブゾンスポルはサラーとの交渉開始をクラブの公式Xで宣言します。
      - 交渉中であることをクラブが自分から言う。異例のことでした。
      - 翌5日、サラーを乗せた飛行機がトラブゾンに到着。
      - 空港のまわりは、およそ2万5000人のサポーターで埋まりました。
      - 発煙筒に花火。チャントが鳴り響いたと報じられています。
      - {voice: 現地のサポーター, text: おお神よ、神の御名のもとに、モハメド・サラー}
      - 街も動きました。市長はこう言っています。
      - {voice: トラブゾンの市長, text: サラーの自宅がある通りをモハメド・サラー通りと命名}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/08/06/post972348/
      - https://www.theworldmagazine.jp/20260902/01world/504248

  - id: why
    heading: なぜトルコだったのか
    tier: 報道
    telop: ユーロで稼ぎ、リラで払う
    narrator: 解説
    say:
      - サウジアラビアからの関心もあった、と報じられています。
      - それでもトルコを選んだ。決め手として挙げられたのは2つです。
      - 高額なサラリーと、ヨーロッパのカップ戦。
      - サラーは年間1700万ユーロを手取りで受け取る契約と報じられました。
      - では、なぜトルコにその金が出せるのか。
      - サウジは国家の資本が後ろにあります。トルコは違い、インフレと通貨安に苦しむ国です。
      - フットボールチャンネルのコラムは、仕組みをこう書いています。
      - {voice: コラム, text: ユーロで稼ぎ、コストの一部をリラで払う}
      - {voice: コラム, text: 本来なら手が届かない選手}
      - {voice: コラム, text: イタリア以上にサッカーへの熱がある}
    official: false
    sources:
      - https://www.theworldmagazine.jp/20260808/01world/500441
      - https://www.footballchannel.jp/2026/08/27/post998331/

  - id: gone
    heading: 決め手のひとつが消えた
    tier: 報道
    telop: 加入直後にEL予選で敗退
    narrator: 解説
    say:
      - ところが、その2つのうち片方が早々に無くなります。
      - トラブゾンスポルは、サラーが加入した直後のヨーロッパリーグ予選で敗退しました。
      - ヨーロッパのカップ戦を求めて来た選手が、その舞台を失ったことになります。
      - 現地の報道は、これを「モハメド・サラーの悪夢」と書きました。
      - 残ったのはリーグ戦です。トラブゾンスポルはここまで2勝1分1敗。出足は良くありません。
    official: false
    sources:
      - https://www.theworldmagazine.jp/20260829/01world/503549
      - https://www.theworldmagazine.jp/20260902/01world/504248

  - id: mates
    heading: 集まっているのはサラーだけではない
    tier: 報道
    telop: リヴァプールで組んだ顔ぶれ
    narrator: キャスター
    say:
      - 同じクラブに、見覚えのある名前が並びました。
      - ファビーニョです。8月24日にフリーで加入。契約は2028年6月末まで、背番号は6。
      - リヴァプールでは219試合。プレミア制覇とCL優勝を経験しています。
      - サラーとは約3年ぶりに同じユニフォームを着ることになりました。
      - ダルウィン・ヌニェスも、アル・ヒラルからトラブゾンスポルへ移ると報じられています。
      - リヴァプールで3年、143試合40ゴール26アシストの選手です。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/33902/
      - https://web.ultra-soccer.jp/news/all/32513/
