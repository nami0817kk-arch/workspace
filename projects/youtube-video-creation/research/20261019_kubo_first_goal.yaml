#   ・サッカーダイジェストWeb 10/19 2本 — 冒頭の描写だけ読んだ（ゴールの形は SK・日刊と一致。「相手MFパブロ・マルティネスに当たった」）。台本には使っていない。
#   ・サカラボ（2ch スレのまとめ）2026-10-19 — 反応の元。記事本文（2chの書き込み）とコメント欄を読んだ（research/raw/20261019_sakarabo_*.html）。
# 本人の言葉: **ある**（題材一覧の「無し」は SK・ゲキサカの記事に無かっただけ）。日刊スポーツ 10/19 08:31「【一問一答】久保建英、昨年12月以来のゴール『ホッとしています』ケガは『もう大丈夫』」
#   （マラガ＝高橋智行通信員。試合後に日本語でインタビュー。全文読んだ。research/raw/20261019_kubo_nk23.txt）。Xの元の投稿ではなく新聞の一問一答なので「報道」。
#   台本に引いた言葉（原文のまま・言い換えない）:
#     「よかったかなと思います。ホッとしています」（12月以来のゴールを決めた気持ち）
#     「今日は絶対自分で行こうって決めてたんで。ここで他の選手に出してももったいないですし。自分で行こうって決めてたからこそ、ああやってゴールが生まれたのかなと思います」（ゴールシーン）
#   使っていない言葉: 左ひざ「今はもう大丈夫です」／「焦りとかはなかった」／今季の目標／監督の指示。
#   → short_style は指示どおり X のまま（Y に切り替えれば short_hook_quote に「今日は絶対自分で行こうって決めてたんで」が使える。呼び出し側に報告）。
#   監督（マタラッツォ）の試合後の言葉は読んだ記事に無い。作らない。
# 資料のずれ（台本では言わないか、ぼかした）:
#   ・ゴールの入った場所：SK＝ゴール左隅／ゲキサカ速報＝ゴール左上隅／ゲキサカ詳報＝ゴール右上隅。→ 台本は隅を言わない（「ペナルティエリアの外から左足」「相手に当たってゴールに入った」まで。相手に当たったのは SK・ゲキサカとも一致）。
#   ・ポジション：ゲキサカ詳報＝右ウイング、サカラボの引用＝右サイドハーフ。→ 台本は「右サイド」。
#   ・アシストの場面：SK＝久保が縦に仕掛けてマイナス方向へラストパス／ゲキサカ＝ドリブルで切れ込むと見せかけて斜め後ろへのパス。→ 台本は「久保のパスから」。
#   ・先発外れの数え方：SK＝リーグ戦で直近4試合連続でスタメンを外れ、うち3試合は出番なし／ゲキサカ＝公式戦6試合連続のベンチスタート、リーグ戦3試合は出番なし。→ 台本は「公式戦7試合ぶりの先発」（両方一致）と「リーグ戦3試合は出番なし」（両方一致）だけ。
#   ・ゲキサカの「W杯初戦オランダ戦で負った左膝の負傷」は SK に無い（片方の資料）。台本では言わない。
# 数字: スコア マラガ2-5ソシエダ。得点 3分 久保／26分 オスカールソン／54分 ニーニョ(マ)／59分 オヤルサバル／66分 P・マルティネス(マ)／67分 オヤルサバル／73分 ゲデス（SK・ゲキサカの得点者欄が一致）。
#   久保のアシストは 59分のオヤルサバルの得点（ゲキサカ「後半14分」＝59分、SK「久保が…ラストパス」）。交代は 71分（SK）＝ゲキサカ「後半26分」。
#   ソシエダは 3連勝（SK・ゲキサカ）。マラガは最下位（SK）。次節 25日 ホームでレバンテ（SK）。
#   「ソシエダでのゴールは昨年12月20日のレバンテ戦以来 約10か月ぶり」はゲキサカだけ（片方の資料）。台本では「ゲキサカ」と言わず、数字（昨年12月・レバンテ戦）を言う。
# 確度: 試合結果・得点・久保の1G1Aは 報道（SK・ゲキサカ・Opta 提供の記録が一致。クラブ公式の本文は読んでいないので確定には上げない）。見立ては 背景。
# 数えた比べ（見立て）: ソシエダの5得点のうち久保が絡んだのは2点（3分のゴールと 59分のアシスト）＝5点中2点。
#   前回のソシエダでのゴール（昨年12月20日）の相手はレバンテ（ゲキサカ）、次節（25日）の相手もレバンテ（SK）。→ 同じ相手が次に来る。
# 反応: サカラボの記事（10/19）から3件。匿名。全文（改行は元のまま）。久保のゴールそのものへの声。
