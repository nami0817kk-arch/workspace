# ロドリがバレンシア主将に謝罪の電話（2026年9月10日）。ユーザー指示「ロドリ」
#
# **発言と、その後始末。**コメント欄が動く型で、映像がXで100万回以上再生されている。
# こちらの「モウリーニョ『説明できない』」の回が1,100回、
# 「ムバッペが言い切った言葉」が1,267回で、**言葉が主役の回は数字が出ている**。
#
# 引きは**「謝罪を受け入れたガヤが、そのうえで何と伝えたか」**。
# 発言そのものではなく、返した側に置く。
#
# **反応は入れない。**読める形のスレが無かった
format: news
# **本人の公開謝罪が出た**（2026-09-10、ロマーノ経由）。日本語メディアは
# まだ電話の話までで、この声明は出ていない。引用が増えたので下限を戻した
voice_min: 12
slot: laliga
date: "2026年9月10日"

# ハッシュタグに使う人の名前
people:
  - ロドリ
  - ガヤ
  - クバルシ
  - 佐藤龍之介

short_title: "ロドリの謝罪に、主将が返した言葉"

theme:
  id: rodri_apology_gaya
  league: spain
  kind: other
  topic: バルセロナ
  title: ロドリがバレンシアに公の場で謝罪。主将のガヤが返していた言葉とは
  hook: ベンチでの会話が、カメラに拾われていました。
  question: 謝罪を受け入れた側は、何を付け加えたのか

thumbnail:
  line1: 公の場で謝罪、主将にも電話
  line2: 返ってきたのは「●●●●●」
  photo: "assets/photos/20260910_rodri/01.jpg"
