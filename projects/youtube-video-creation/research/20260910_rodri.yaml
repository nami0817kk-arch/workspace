sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ベンチでの会話がカメラに拾われた
    narrator: キャスター
    say:
      - バルセロナのロドリが、バレンシアの主将ホセ・ルイス・ガヤに電話をかけて謝罪しました。スペイン紙『マルカ』が8日に伝えています。
      - きっかけは、現地時間6日のラ・リーガ第4節です。メスタージャでのバレンシア対バルセロナ、5対0でバルセロナが勝った試合でした。
      - 途中交代でベンチにいたロドリは、パウ・クバルシと話していました。
      - その様子を『モビスター・プラス』の番組『エル・ディア・デスプエス』のカメラが捉えます。
      - 映っていたのは、バレンシアについてのこんな言葉でした。
      - {voice: ロドリ, text: 弱い。こいつらは本当に弱い}
      - {voice: ロドリ, text: 本当にひどい、最悪だ}
      - スペイン紙『アス』は、読唇術で読み取った会話としてこの一言も伝えています。
      - {voice: ロドリ, text: 彼らは緩い}
      - 放送後、大きな反響を呼びました。モビスター・プラスがXに投稿した映像は、削除されるまでに100万回以上再生されたと伝えられています。
      - なお、このバレンシアには日本の佐藤龍之介がいます。この試合も61分から途中出場していました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007811/
      - https://www.footballchannel.jp/2026/09/08/post1006338/

  - id: call
    heading: 何を説明したのか
    tier: 報道
    telop: 「見下す意図は決してなかった」
    narrator: 解説
    say:
      - ロドリはガヤに電話をかけ、あの会話がどういう場面で出たものだったかを説明しました。
      - チームメイトとの、私的で和やかな会話の中で出た言葉だった、という説明です。
      - バレンシアの選手たちに失礼な態度を取る意図も、公の場で実力を否定する意図もなかったと伝えました。
      - さらに、誤解を避けるために、謝罪のメッセージをバレンシアのチームメイトにも伝えてほしいとガヤに頼んだといいます。
      - 『マルカ』によると、ロドリ本人は、試合中の内部的な会話が外に伝わるとは考えていませんでした。
      - 公の場で解釈されたことに、影響を受けていたようだと書かれています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007811/
      - https://web.ultra-soccer.jp/news/all/35450/

  - id: gaya
    heading: 受けた側は何と返したか
    tier: 報道
    telop: 受け入れたうえで「間違いだった」
    narrator: 解説
    say:
      - ここからが本題です。ガヤは、この謝罪を受け入れました。
      - ただ、それで終わりではありませんでした。
      - {voice: ガヤ, text: 間違いだった}
      - 受け入れたうえで、そのことははっきり伝えた、と『マルカ』は書いています。
      - 5対0で勝った側のベンチで出た言葉が、外に出て、電話になりました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007811/
      - https://www.footballchannel.jp/2026/09/07/post1005795/

  - id: statement
    heading: そして本人が、公の場で謝った
    tier: 報道
    telop: 「人は間違いを犯したら、謝らなければならない」
    narrator: 解説
    say:
      - そして10日、ロドリ本人が公の場で声明を出しました。移籍情報の記者ファブリツィオ・ロマーノが伝えています。
      - {voice: ロドリ, text: バレンシアのファンと選手に謝罪したい}
      - {voice: ロドリ, text: バレンシアの主将、ガヤにも電話した}
      - {voice: ロドリ, text: 人は間違いを犯したとき、謝らなければならない}
      - 最後に、相手クラブについてこう付け加えています。
      - {voice: ロドリ, text: バレンシアが本来いるべき場所に戻ることを願っている}
      - バレンシアはいま最下位で、監督の辞任を求める声も出ているクラブです。
      - 試合の中の私語がどこまで私語でいられるのか、という話でもありました。
    official: false
    sources:
      - https://x.com/FabrizioRomano/status/2097772204502990918
      - https://www.footballchannel.jp/2026/09/07/post1005288/
