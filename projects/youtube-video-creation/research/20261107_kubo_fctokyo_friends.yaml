# 題材の元: フットボール・トライブ日本語版 2026-11-06 11:36「久保建英の異端児ぶり明かす！FC東京時代の同僚驚愕「いきなり踊り出す」「最初から大物」」（全文）。
#   https://football-tribe.com/japan/2026/11/06/361062/
# 元の媒体を辿った:
#   ・橋本英郎（元ガンバ大阪・セレッソ大阪・ヴィッセル神戸）の公式 YouTube チャンネル「橋本英郎 | Hideo Hashimoto」の対談動画
#     「【タケと同部屋で‥】若き久保建英との合宿㊙︎話?!／FC東京の豪華メンバー／長谷川監督との再会／ジュビロ磐田移籍の真相／イニエスタと同じ怪我をして…【橋本英郎×大森晃太郎 #3】」
#     （id pApQjc9c148、約15分40秒。YouTube の検索と動画ページで実在と題名・概要欄を確かめた）。シリーズ3本目。1本目（cf16Z0Ye-qc）・2本目（m3auTXvVeVc）は大森のガンバ・神戸時代の話で久保は出ない。
#     動画の音声は聞いていない（字幕は取れなかった）。→ 発言は日本語で、トライブの引用が動画の発言そのままかは確かめられていない。確度は報道。
# 出典で確かめたこと（トライブの記事。大森晃太郎の発言。「同僚」＝当時のチームメイトのMF大森晃太郎）:
#   「タケと同じ部屋になったときの話なんですけど、ケンタさん（長谷川健太監督）は6時半くらいに散歩へ行くんです。タケは6時くらいに起きて、部屋の電気を全部つけるんですよ。しかも、海外のクラブミュージックみたいな音楽を流して、いきなり踊り出すんです」
#   「『ヤバいやつだな』と思いましたね。『お前、先輩やぞ』とは言えなかったんですけど。『うわ、こいつ、すごいな』と思っていましたね」
#   「僕はキャンプ前にはあまり走ったりしないので、キャンプ中の2部練習がめちゃくちゃきついんですよ。…朝もギリギリまで寝ていたい。散歩に行って、朝ご飯を食べて、練習までの1時間は寝るんです。とにかく寝たいんですよ」
#   「それなのに、タケは帰ってくるとまた踊り出すんです。『寝てるんですか？』と聞いてくるので、『いや、お前、ちょっと待って。俺、もう少し寝かせて』と言っていました」
#   「『イヤホンにして』とも言ったんですけど、それでもずっと音楽が流れているんですよ。…少し眠りについたくらいで、また起こしてくるんですよ。『僕、先に行くんで。準備があるから』とか言って。最初から大物でしたね」
#   シャワー: 「10分でも20分でも先輩より先にシャワーを浴びたらあかんと思っていた」→「僕らは（先輩がシャワーを浴び終わるのを）待つんですけど、タケはそんなことを気にしません。何も言わずに、すっと入っていくんです」
#   バスタオル: 「タケは自分のタオルではなく、僕のバスタオルを使おうとするんですよ。『いや、お前、自分のを取りに行けよ』と、そこは突っ込みました。そしたら『あ、そうなんですね。じゃあ僕のバスタオル使います』と言われたんです」
#   トライブの地の文: 幼少期からスペインで過ごした久保は、日本独特の風習を気にしていないようだ。（→ 記者の見立て。台本では地の文として言わない）
#   ・合宿の年は記事に書かれていない（長谷川健太監督の時期）。台本は年を言わない。
# 久保の今（確かめた）:
#   ・ゲキサカ 462496（2026-11-04、JFA 発表）: 11月のシンガポール遠征の日本代表28人に久保建英（ソシエダ）が入っている。14日ブラジル戦、17日パラグアイ戦。
# 前の本との重なり: scripts/20261104_kubo_basque_derby（ダービーの現地紙評価）／20261106_nakamura_kubo_lyon_sociedad（EL 出番なし）／20261003_kubo_marriage ほか。FC東京時代の同僚の話は初。
#   → 今回の初出: 合宿の同部屋の話（音楽・踊り・先輩の前のシャワー・バスタオル）。
