# 本人の言葉: 久保本人の言葉は無い。同僚（大森晃太郎）の言葉は全部ある。→ Y（誰の言葉かを毎回名乗る。話者の札は「大森晃太郎」）。
# 【言わないこと】トライブの「日本独特の風習を気にしていないようだ」（記者の見立て）。同僚の言葉に「だから久保は規格外」などの結論を足さない。久保の不満・評価の言葉。年。
# 【範囲について】久保はラ・リーガ（欧州7リーグ）の選手で、話の舞台は FC東京の合宿（Jリーグ時代の思い出）。Jリーグの題材そのものではなく、久保の人となりの話として扱う。
