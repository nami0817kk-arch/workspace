# 取材メモ（2026年11月26日）グアルディオラ、イタリア代表の誘いを断ったと初めて本人が認めた。「断るのは恥ずかしかった」「2年早ければ受けていた」。次は代表チームだと話した（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-26。WebFetch と requests（ブラウザUA）だけ。検索エンジンのAI要約・ブラウザの道具は使っていない。
# 題材の元（見出し）: Voetbal International「Guardiola wees Italië af: 'Twee jaar geleden had ik het waarschijnlijk wél gedaan'」（11/25 17:09）、De Telegraaf「Ik vond het gênant」、Diario AS「Guardiola: "Me daba vergüenza decirle que no a Italia"」、El Periódico「"Me da vergüenza decirle 'no' a un país como Italia"」（いずれも Google ニュースの見出しで見た。本文は読んでいない）。
# 一次に近いもの: 本人の言葉は会見ではなく、元ブラジル代表ロマーリオの番組（Romario TV）のインタビュー（11/24 火曜、ブラジルで配信）。番組の映像そのものは見ていない（ブラウザの道具を使わない決まり）。
#   → 発言は ESPN（ESPN News Services、ESPN Brasil 協力。2026-11-25 02:11 UTC）の英語の引用を元にした。全文を読んだ:
#   "This is the first time I speak about this, but yes, I did talk to them,"
#   "I felt embarrassed to say 'no' to Italy, a country like Italy, it would have been one of the greatest honors of my career to coach the Italian national team. But I realized I needed to stop. If they had called two years earlier, I probably would have accepted. But when Paolo Maldini and Leonardo, whom I love dearly, reached out, it was at a point where I simply had to stop."
#   "I needed some time for myself. After 18 years as a coach, with matches every three days, week in and week out, there comes a moment when you just have to say 'phew.'"
#   （地の文）まだ率いたことが無く率いてみたいチームは "a national team," "and that is the next step."
#   "The truth is, I don't know, I really don't know. But for now, I'm doing fine," "If I ever return, it will be because my gut tells me to, and because someone wants me …"
#   https://www.espn.com/soccer/story/_/id/50587357/guardiola-embarrassed-italy-national-team-next （本文は content.core.api.espn.com/v1/sports/news/50587357 で取得）
#   → 台本の言葉は、この英語を私が日本語にしたもの。スペイン語・ポルトガル語の見出し（AS「Me daba vergüenza decirle que no a Italia」、El Periódico、SAPO「Até me deu vergonha」、VI「Twee jaar geleden …」）と趣旨が一致することを見た。「…」で切れたところは補っていない。
# ESPN（同じ記事の地の文）: シティでの10年（2016〜2026）でプレミアリーグ6回・FAカップ3回・チャンピオンズリーグ1回。イタリアは3大会続けてW杯に出られず、結局マンチーニ（2018〜23年にも代表監督）を呼び戻した。
#   アメリカ代表はポチェッティーノがマンチェスター・ユナイテッドへ移って後任を探しており、ESPN の情報源は「探す候補にグアルディオラが入る見込み」と伝えた（第一候補と呼ぶのは早いとも）。
# ESPN 2026-07-24「Pep Guardiola turns down Italy, he'll take year off - source」: 7月の時点で断ったことは情報源ベースで報じられていた。→ 今回の新しさは「本人が初めて自分の口で認めた」こと。
# 食い違い:
#   ・「恥ずかしかった」の時制: ESPN 英語は "I felt embarrassed"（過去）、El Periódico は "Me da vergüenza"（現在）、AS は "Me daba"（過去）。→ 台本は「恥ずかしかった」。
#   ・監督歴: 本人は「18年」と言った（バルセロナBの2007年から数えると19季目）。本人の言葉なので直さず、語りでは年数を言わない。
# 【言わないこと】ブラジル代表・アンチェロッティについての話（同じ番組で話したが題から離れる）／アメリカ代表の後任の話を確定のように言わない（報道止まり）／イタリアの監督選びの細かい経緯。
# 前の本との重なり: 直近3日に無し。11/26 sa_inter・監督紹介の回で名前が出るだけ。7月の「断った」報道を扱った回は無い（scripts を grep）。
# 本人の言葉: あり → Y。
