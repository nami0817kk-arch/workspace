# 取材メモ（2026年10月21日）佐野航大、ポルト戦フル出場でPSVのCL今季初白星。ボス監督の言葉（ニュースのショート。見せ方 Y＝監督の一言から始める）
# 取材: 2026-10-21。requests（ブラウザUA）で原文を読んだ。
#   ・サッカーキング 2026-10-21「佐野航大、フル出場でPSVの今季CL初白星に貢献！ ポルトは痛恨の開幕3連敗」— 本文を全部読んだ。得点者・次節の日程・「3試合連続フル出場」「守備面での奮闘が際立つ」「決定的なシーンに絡む回数こそ少なかった」はこの記事。
#   ・Qoly 2026-10-21「佐野航大、CLポルト戦で勝利に貢献！『航大らのおかげ』とPSV監督が名指したワケ」— 本文を全部読んだ（1ページ完結）。ボス監督・ポルトのファリオーリ監督の言葉（日本語訳。原文の英語・オランダ語は未確認）・4-2-3-1のダブルボランチはこの記事。
#     題材一覧の「ゲキサカ」は今回読んでいない（上の2本で足りる）。
#   ・PSV 公式サイト（psv.nl）の試合ページ・選手ページは読んだが、試合後の記事（ボス監督の言葉の原文）はまだ出ておらず、言葉は Qoly の日本語訳のまま。
# 題材一覧との違い（原文で直した点）:
#   ・一覧の「ボス監督『航大らのおかげ』」は Qoly の見出しの語。本文のボス監督の言葉には「航大らのおかげ」は無い。台本は本文の言葉をそのまま使い、見出しの語は使わない。
#   ・一覧の「4-2-3-1のダブルボランチで90分」→ 4-2-3-1 は Qoly、フル出場は SK。
#   ・一覧の「ポルトのファリオーリ監督『就任して64試合で、最もプレスに苦労した』」→ 原文は「私が就任してからの64試合で、最も自分たちが意図した形でプレッシングをかけるのに苦労した試合だった」。
#     ＝苦労したのは**ポルト自身のプレッシング**（PSVのプレスではない）。台本は原文どおり。
#   ・Qoly 本文の「VP」が付けた6点の評価は、媒体名が本文に無い（『VP』のみ）ので入れない。
# 本人の言葉: **無い**（佐野本人の今回の言葉はどちらの記事にも無い）→ 作らない。Y は監督（ボス）の言葉。
# 10/18 の佐野（ADO戦・9戦連続フル出場・退場者・敗戦）と重ねない: ADO戦・退場・勝点・フェイエノールトの話は言わない。10/10・10/14 の佐野の話とも重ねない（今回はポルト戦だけ）。
# 数字: スコア ポルト0-1PSV。得点 57分 ティル（バイラクタレヴィッチの折り返し→マイナンスがダイレクトで繋ぎ、ティルが押し込む。SK）。
#   佐野はCLで3試合連続のスタメン・フル出場（SK）。ポルトは開幕3連敗（SK）。次節 11月4日 PSVはクラブ・ブルッヘとホーム（SK）。
# 自分で数えたもの（見立て）: 両監督が試合後に挙げた言葉は、どちらも「プレッシング」（ボス＝PSVのプレスで試合を取り戻した／ファリオーリ＝ポルトが意図した形でプレスをかけられなかった）＝2人とも。
# 確度: 試合結果・得点は 報道（SK）。監督の言葉は 報道（Qoly の日本語訳）。見立ては 背景。クラブ公式の本文は読んでいないので確定には上げない。
# 写真: 本人（佐野）の写真は Commons の1枚（Hans Reefman。10/18 のショートでも使用。3日前）、PSV 公式の選手紹介は 602x426 しか取れず小さすぎて使わない（顔の拡大で×になる）、JFA の選手ページの写真5枚（A代表ではなく
#   U17 W杯・U23 時代の写真、368〜825px）も縦に伸ばすと×になるので使わない。SK・Qoly の主写真は Getty なので取り込まない。
#   使うのは: 03＝Commons の佐野（再掲）／01＝PSV 公式サイトのボス監督（10/18 の記者会見の写真。ADO 戦前日）／02＝PSV 公式の選手紹介（マウロ・ジュニオール。ボス監督の言葉に出る相手）。
#   本人と確認できる写真は佐野1枚（再掲）だけ。ボス・マウロは目で確認済み。
