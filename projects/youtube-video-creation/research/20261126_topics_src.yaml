title: 11月26日のショート題材
lead: 海外フィード約460件と日本語の海外組ニュースから10件をClaudeが選びました（日本人6件・海外4件）。取材で前提が崩れたら次点に差し替えます。
note: 木曜（26日）の朝7時に集めました。見出しからの選定。次点：荒木遼太郎が誘ったGK退場とテロップの取り違え、リバプールがブルージュに3-0（イサク2発・ヴィルツ）、PSG 2-2 ローマ。外した：森保一氏の欧州での次の仕事（11/18・11/24 と同じ話）、坂元達裕の代表招集の祝福（11月に5本作成済み）、三笘薫の復帰時期（11/24 作成済み）、塩貝健人の負傷（11/24 作成済み）、佐野航大のレアル戦（11/25 作成済み）、鈴木彩艶のロングキック（11/25 と同じ試合）、スターリングの有罪判決（法的な話）、U-17W杯・U-15（年代別）、MLSの新方式・女子W杯（対象外）。
