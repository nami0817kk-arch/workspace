# 冨安健洋 の取材メモ（2026年10月17日）
# 1本＝1テーマ。ショートだけ（no_main）。見せ方は G（切り抜き＋クラブ色の背景）。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・サッカーキング（2026-10-17。https://www.soccer-king.jp/news/world/eng/20261017/2217481.html）: サージュ監督の16日の会見の言葉。記事は「プレミアリーグの公式サイトが同指揮官のコメントを伝えている」と書く。公式サイトの原文は未読（URLが見つからず）。→ 確度は「報道」、出典は記事。
#   ・クリスタル・パレス公式（cpfc.co.uk「Sage reveals expectations & focus for Palace v Brighton rivalry」）: 同じ会見の公式記事。日曜（18日）のアミ・スタジアム遠征、ヘンダーソンらについて「会見のあとの練習を見て決める。明日の練習も見たいかもしれない」「期待はしている、分からない」と話した。**冨安の名前は出てこない**ので、冨安の言葉としては使わない（練習で見る、の一般論だけ背景に使う）。
#   控えは research/raw/20261017_tomiyasu_sk.txt・20261017_cpfc_sage-reveals-expectations-focus-.txt。
# 日付: 現地10月18日（日）、ブライトン戦、プレミアリーグ第7節（記事）。会見は16日（記事）。
# 資料間のずれ: 無し。ただし記事の「同選手の復帰時期については、会見後にトレーニングがあるので〜評価する」の「同選手」は直前のGKヘンダーソンを指す（冨安ではない）。冨安・マテタ・チルウェルに向けた言葉は「可能性はある。1、2試合前にも〜」の方。台本ではこの区別を守る。
# 自分で数えたこと: ①リヨン戦を欠いた4人（冨安・ヘンダーソン・マテタ・チルウェル。記事）のうち、18日に向けて「可能性はある」と言われたのは3人（冨安・マテタ・チルウェル）、ヘンダーソンは「現時点ではわからない」。②出られれば、直近2試合（11日・15日。記事）を欠いたあとの復帰戦。
# 10/15 の冨安の回（リヨン戦の欠場）との違い: あちらは「リヨンに同行しない」。こちらは「18日の見通し」で、同じ文・同じ写真は使わない（写真は 10/15 のアヤックス時代の Commons を使わず、クラブ公式の写真に替えた）。
# 本人の言葉: 無し（記事に冨安本人のコメントは無い。SNSは当たっていない＝ブラウザ禁止）。
# 反応: 0件。当たった先: NO FOOTY NO LIFE のトップ（10/17 時点で鎌田・森保の記事のみ、冨安の記事なし）。検索（WebSearch）も新しい投稿に当たらず。Xは触っていない。作らない。
# 写真: 配信写真（Getty）は取り込まない。assets/images/20261017_tomiyasu_brighton_return/ はクラブ公式サイトの選手紹介ページの2枚（出典は credits.json。許諾は得ていない＝引き受ける危険）。05_g_v.jpg は 04_flat.jpg（01.png の透過を白にしたもの）を G で切り抜いた版。06_v.jpg は 02.jpg の縦切り。3枚には届かず2枚（顔が検出できる別の写真が無い）。
