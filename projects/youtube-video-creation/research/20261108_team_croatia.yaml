# 代表チーム紹介 クロアチア代表（11/5 作成。固定シリーズ9「代表チーム紹介」。見本は 11/6 のパラグアイ代表 scripts/20261106_team_paraguay.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **選んだ理由**：日本がW杯で3度戦った、ただ1つの国（1998・2006・2022。Japan at the FIFA World Cup の試合表で、ほかの国は2度まで＝ベルギー・コロンビア・ブラジル・オランダ・チュニジア）。2018年準優勝・2022年3位のW杯の強豪。代表チーム紹介は未出（scripts/・research/posted.json・research/covered.yaml を grep。既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ・ウルグアイ・ベルギー・スウェーデン・メキシコ・パラグアイ）。クロアチアが主役の本は 10/4 のニュース（イングランドに0対7、20261004_england_croatia）で、11/8 から35日前＝直近30日の外。軸も違う（あちらは0対7の1試合、こちらは日本とのW杯3試合と延長の強さ）。
# **外した候補**：コロンビア（W杯で日本と2度。強豪の格でクロアチアが上）、イタリア・韓国・オーストラリア（日本とW杯での対戦が無いか少ない）。
# **軸（2026-11-05）**：「日本がW杯で3度戦って0勝2分1敗、300分で1点。クロアチアはW杯で延長に入った5試合をすべて勝ち上がった」。答えは見立ての節（自分で数えて割る）。
# ---- 確かめたこと（2026-11-05。requests で Wikipedia の生の wikitext を読んだ。WebFetch の要約は使っていない）----
#  ・FIFAランク：14位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026、Croatia 14・前回比-1）。日本は17位。点数は書かない。
#  ・W杯：Croatia at the FIFA World Cup の Overall record。出場7大会（1998・2002・2006・2014・2018・2022・2026、2010は予選敗退）。1998年3位・2018年準優勝・2022年3位。2026年は32強（20位）。通算34試合15勝8分11敗49得点40失点。
#  ・延長の試合（同じ記事の試合表）：2018年16強 デンマーク1-1（延長、PK3-2）／8強 ロシア2-2（延長、PK4-3）／準決勝 イングランド2-1（延長）／2022年16強 日本1-1（延長、PK3-1）／8強 ブラジル1-1（延長、PK4-2）。→ 自分で数えた：延長に入った5試合はすべて勝ち上がり、負けは0。PK戦は4戦4勝（Croatia national football team の本文「most penalty shoot-out played (4) and won (4)」）。ほかの大会（1998・2002・2006・2014・2026）に延長の試合は無い。
#  ・日本の延長の試合（Japan at the FIFA World Cup）：2010年16強 パラグアイ0-0（PK3-5）、2022年16強 クロアチア1-1（PK1-3）の2試合、どちらも敗退。2026年32強ブラジル1-2は90分（2026 FIFA World Cup round of 32、マルティネッリ90+5分）。
#  ・日本のW杯通算（Japan at the FIFA World Cup の Total）：8大会29試合 8勝8分13敗 33得点38失点。33÷29＝1.14。クロアチア戦は3試合1得点＝0.33（約3分の1）。クロアチアの通算は49÷34＝1.44。
#  ・日本とクロアチアの全対戦（Japan national football team records and statistics「CRO 1997 2022 4 1 2 1 5 5」）：1997-06-08 キリンカップ 4-3（東京・国立。Japan national football team results (1990–1999)）／1998-06-20 W杯1次リーグ 0-1（ナント。シュケル77分。1998 FIFA World Cup Group H）／2006-06-18 W杯1次リーグ 0-0（ニュルンベルク。前半の半ば、スルナのPKを川口能活が止めた。2006 FIFA World Cup Group F の本文）／2022-12-05 W杯16強 1-1（延長、PK1-3。アル・ワクラ。前田大然43分、ペリシッチ55分（ロヴレンのクロスに頭）。日本は南野・三笘・吉田がリヴァコヴィッチに止められ、浅野だけ決めた。クロアチアはリヴァヤがポストに当て、最後はパシャリッチ。2022 FIFA World Cup knockout stage）。W杯3試合の合計時間は 90＋90＋120＝300分。
#  ・1998年の日本戦のクロアチアの先発に CB 6番 スラヴェン・ビリッチ（1998 FIFA World Cup Group H のメンバー表）＝いまの監督。
#  ・監督：スラヴェン・ビリッチ（Slaven Bilić の記事）。2006年W杯のあと〜2012年に1度目、2026年7月13日に2度目の就任（ダリッチの退任のあと）。ダリッチは9年率いて、W杯のあと契約満了で退任（Zlatko Dalić の記事）。
#  ・2026年W杯（Croatia at the FIFA World Cup の試合表）：L組 イングランド2-4（アーリントン）、パナマ1-0（トロント）、ガーナ2-1（フィラデルフィア）、32強 ポルトガル1-2（トロント、7月2日。ペリシッチ53分、ロナウド68分PK、ゴンサロ・ラモス90+4分。2026 FIFA World Cup round of 32 の本文「the first time since 2014 they failed to progress to the round of 16」）。
#  ・主将：ルカ・モドリッチ（ACミラン、MF、1985-09-09）。代表206試合30得点（Luka Modrić の記事、national_team_update 6 October 2026）。代表の歴代最多出場（infobox Most caps）。2026年6月27日のガーナ戦で、W杯でアシストした最年長（40歳291日。Luka Modrić の本文）。
#  ・看板選手（Croatia national football team の Current squad＝2026年11月の招集。所属は各選手の記事の current_club でも確かめた）。2026-11-05 時点の年齢（生年月日から計算）：モドリッチ41、グヴァルディオル（マンチェスター・シティ、DF、2002-01-23）24・56試合、コヴァチッチ（マンチェスター・シティ、MF、1994-05-06）32・121試合、ペリシッチ（PSV、FW、1989-02-02）37・162試合40得点、クラマリッチ（ホッフェンハイム、FW、1991-06-19）35・119試合36得点、リヴァコヴィッチ（バルセロナ、GK、1995-01-09）31・83試合。ペリシッチのW杯通算7得点は国の最多（Croatia at the FIFA World Cup の Goalscorers）。
#  ・シュケルは1998年に6得点で得点王（Croatia national football team の本文「Golden Shoe」、Goalscorers の表で1998年6）。
#  ・人口：3,871,833人（2021年の国勢調査。Croatia の infobox）。
#  ・W杯のあと（Croatia national football team results (2020–present)）：ネーションズリーグ 9/26 チェコ2-1（プラハ）、9/29 スペイン1-4（セビリア）、10/3 イングランド0-7（リエカ。infobox の Largest loss）、10/6 スペイン1-2（スプリト）。→ 1勝3敗、4得点14失点。次は 11/12 イングランド（ウェンブリー）、11/15 チェコ（オシエク）。
#  ・愛称：Vatreni（infobox「Vatreni (Blazers)」）。
# ---- 言わないもの ----
#  ・怪我／私生活／背番号／戦術の説明／監督の契約／0対7の試合の細部（10/4 のニュースで扱った）／2026年の判定の細部（グヴァルディオルの取り消された得点）。
