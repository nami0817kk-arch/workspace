  - text: 日本がワールドカップで3度戦った国は、クロアチアだけです。
    image: assets/stats/tb_croatia_data_t.png
    no_telop: true
  - text: 日本がほかの国と当たったのは、多くても2度です。
    image: assets/stats/tb_croatia_data_t.png
    no_telop: true
  - text: 1998年のフランス大会は、0対1の負け。
    image: assets/stats/tb_croatia_data_r1.png
    no_telop: true
  - text: 2006年のドイツ大会は、0対0の引き分け。
    image: assets/stats/tb_croatia_data_r1.png
    no_telop: true
  - text: 2022年のカタール大会は16強。1対1から、PK戦で敗れました。
    image: assets/images/20261108_team_croatia/b05_fans2022_w.jpg
    no_telop: true
  - text: 3試合で合わせて**300分**。日本が取った点は、前田大然の1点です。
