    card: *id_doc
  - text: 完成は、2029年の初めと、伝えられます。
    emph: true
    image: assets/images/20261023_stadium_palace/03_w.jpg
    card: none
  - text: 当初の目標、2021/22シーズンから、約7年あとです。
    image: assets/images/20261023_stadium_palace/03_w.jpg
    card: none
  - text: クラブの公式ページには、完成日も、費用も、載っていません。
