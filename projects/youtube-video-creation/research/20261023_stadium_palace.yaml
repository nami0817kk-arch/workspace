  - text: 1985年、チャールトンが、この競技場を間借りします。
    image: assets/images/20261023_stadium_palace/03_w.jpg
    card:
      <<: *id_own
      highlight_row: 0
  - text: リーグのクラブが、本拠地を共用するのは、イングランドで初めてでした。
    image: assets/images/20261023_stadium_palace/03_w.jpg
    card: none
  - text: 翌1986年、当時の会長が、競技場を、クラブから買います。
    emph: true
    image: assets/images/20261023_stadium_palace/02_w.jpg
    card:
      <<: *id_own
      highlight_row: 1
  - text: ウィキペディアは、収入を作るため、と書きます。
    image: assets/images/20261023_stadium_palace/02_w.jpg
    card: none
  - text: 1991年からは、ウィンブルドンが、2003年まで間借りします。
    image: assets/images/20261023_stadium_palace/04_w.jpg
    card:
      <<: *id_own
      highlight_row: 2
  - text: 1993年1月26日。ここで開いた、ウィンブルドン戦の入場は、3039人。
    emph: true
    image: assets/images/20261023_stadium_palace/04_w.jpg
    card: none
  - text: プレミア史上、いちばん少ない入場です。
    image: assets/images/20261023_stadium_palace/04_w.jpg
    card: none
  - text: 2008年、クラブは、競技場を25年間、借りる契約を結びます。
    image: assets/images/20261023_stadium_palace/05_w.jpg
    card:
      <<: *id_own
      highlight_row: 3
  - text: 2010年6月、新しい持ち主の集まりが、クラブと競技場を、一緒に買いました。
    emph: true
    image: assets/images/20261023_stadium_palace/05_w.jpg
    card:
      <<: *id_own
      highlight_row: 4
  - text: クラブと競技場が同じ会社になるのは、1998年以来のことです。
    image: assets/images/20261023_stadium_palace/01_w.jpg
