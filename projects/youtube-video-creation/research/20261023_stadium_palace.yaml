    image: assets/images/20261023_stadium_palace/02_w.jpg
    card:
      <<: *id_stand
      highlight_row: 5
  - text: 8月28日、今季のホーム初戦の日の、クラブの発表です。
    image: assets/images/20261023_stadium_palace/02_w.jpg
