  - text: 着工は2019年の夏、新スタンドは2021/22シーズンに間に合う予定でした。
    image: assets/images/20261023_stadium_palace/05_w.jpg
    card:
      <<: *id_stand
      highlight_row: 1
  - text: ところが、遅れます。コロナ禍と、アカデミーの整備が先になりました。
    image: assets/images/20261023_stadium_palace/05_w.jpg
    card: none
  - text: さらに、隣のウッダーソン・クローズの住宅が、壁になりました。
