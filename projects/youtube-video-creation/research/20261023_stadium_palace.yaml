# スタジアム紹介シリーズ：クリスタル・パレスの本拠地（セルハースト・パーク、10/23）。雛形は 10/22 エヴァートンの回。
# 軸：A＝収容2万5194席はプレミア20クラブで17位（下から4番目）／B＝その本拠地が、毎試合ほぼ満員（入場は収容の99.4％）なのに、広げるのが遅れた。メイン・スタンドを5200席から1万3500席の3層に建て替える工事が2026年夏に始まった。
# 収容・ピッチ：PL公式ハンドブック2026/27（Ground Capacity at start of the Season、控え research/raw/20261021_nufc_plhandbook.txt の同じ表）。
#   パレス 25,194（ピッチ 縦101.5×横68m）。20クラブ：マンU 74,158／スパーズ 62,850／リヴァプール 61,276／シティ 61,038／アーセナル 60,704／エヴァートン 52,769／ニューカッスル 52,729／サンダーランド 48,095／チェルシー 40,044／リーズ 37,633／ヴィラ 36,887／コヴェントリー 32,609／ブライトン 32,176／フォレスト 31,212／イプスウィッチ 30,294／フラム 28,107／パレス 25,194（17位）／ハル 24,983／ブレントフォード 17,250／ボーンマス 12,357。
#   （ハンドブックのニューカッスルの行は2行あり、2行目 31,212 はフォレストの表。見出しの取り違えをクラブの並びで直した）
#   自分で引いた：74,158-25,194=48,964／25,194÷74,158=0.34＝約3分の1／フラム 28,107-25,194=2,913／パレス 25,194-ハル 24,983=211。ピッチの縦はフラム100・リヴァプール101・パレス101.5・チェルシー103の順で、パレスは短いほうから3番目。
# 入場（PL公式の試合API、取得2026-10-23。控え research/raw/20261023_palace_matches_pl_api.json）：
#   2024/25 パレスのホーム19試合＝合計476,273・平均25,067.0（最多25,185＝4/19 ボーンマス戦・最少24,564＝4/5 ブライトン戦）。
#   2025/26 ホーム19試合のうち入場数が載る18試合（2/11 バーンリー戦は入場数が空）＝合計450,305・平均25,016.9（最多25,192＝5/24 アーセナル戦・最少24,326＝11/9 ブライトン戦）。
#   2026/27 ここまでのホーム3試合＝25,149（8/28 シティ）／25,122（9/12 イプスウィッチ）／25,120（10/11 フォレスト）、合計75,391・平均25,130.3。
#   自分で数えた：2季の37試合＝合計926,578・平均25,042.6＝収容25,194の99.4％／最少24,326÷25,194=96.6％／最多は収容に2席届かない／2026/27の平均÷収容=99.7％。
#   注意：ハンドブックの25,194は今季の開幕時の収容。前の季の収容は確かめていないので、台本では「いまの収容に対して」と断る。
# 本人・記録（ウィキペディア en "Selhurst Park" 取得2026-10-23。控え research/raw/20261023_pa_wp_selhurst.txt）：
#   開場1924-08-30（ロンドン市長が開く）・設計アーチボルド・リーチ・費用約3万ポンド・開場時はメイン・スタンド1つだけ（ストで未完成）・初戦は ザ・ウェンズデイに0-1・観客2万5000人。
#   1969 アーサー・ウェイト・スタンド（1部昇格）／1979 最多入場5万1482人（バーンリーに2-0、2部優勝）／1981 ホワイトホース・レーンの裏の裏手の土地をスーパーのセインズベリーに200万ポンドで売り、テラスは実質半分に／
#   1985 チャールトンが間借り（リーグのクラブで初の本拠地共用）／1986 会長ノエイズがクラブから競技場を買う／1990 テイラー報告を受けてアーサー・ウェイトの下段を全席座席に／1991〜2003 ウィンブルドンが間借り／1994 ホームズデールのテラスを壊し翌年2層8500席のスタンド（いまの表記 8,329）／
#   1993-01-26 プレミア史上最少の入場3,039人（ウィンブルドン対エヴァートン、会場はセルハースト）／2008 クラブに25年の賃貸（年1.2百万ポンド）／2010-06 コンソーシアムがクラブと競技場を買い、1998年以来初めて同じ会社に。
#   2018-04-19 メイン・スタンド建て替え案を市議会が承認（2019年夏着工・2021/22完成予定だった）→コロナ・アカデミー整備（2021完成）・ウッダーソン・クローズの住宅の問題で遅れ、2026年に着工・完成は2029年初めの予定（ウィキペディア）。
# クラブ公式（cpfc.co.uk/crystal-palace-main-stand-redevelopment/ と cpfc.co.uk/news/announcement/exciting-new-stadium-training-ground-improvements-this-summer/、WebFetch、取得2026-10-23）：
#   新スタンドは3層・1万3500席（現在の1924年のスタンドは5200席）・総収容は2万6000席から3万4000席超へ／2022年10月に修正案を市議会が承認／2024年夏に市との最終の法的合意に署名／2026年1月にウッダーソン・クローズの6軒を全部買い取り居住者の移転が済む／
#   2026-08-28（今季のホーム初戦、対シティ）の発表：メイン・スタンドと周りの取り壊しが始まった。正面玄関・役員室・貴賓ラウンジ・レストランなどを撤去して移し、6軒の住宅を壊し、ファンゾーンを工事車両と電源工事のため撤去／工事の完成日はこのページに書かれていない。費用も書かれていない。
# 割れる点（台本で断った）：①ウィキペディアは現スタンドを5460席、クラブは5200席と書く→「クラブの数字」で言い、差は言わない／②総収容の「2万6000」（クラブ）と「25,194」（ハンドブック）→増える席は 1万3500-5200=8300 で言う／③完成は「2029年の初め」（ウィキペディア。クラブの公式ページに完成日は無い）→「2029年の初めと伝えられる」と断る／④承認の年：ウィキペディアは2018年4月と2024年8月、クラブは2022年10月の修正案承認と2024年夏の法的合意→「2018年に最初の承認、2022年に修正案」と言い、2024年は「最終の法的合意」とクラブの言葉で言う。
# 言わなかったもの：費用（資料に無い）／ジョーダン氏の2006年の買収をめぐる記述（ウィキペディアが「誤り」と書く事実関係。確かめられず、法的な話に近いので入れない）／ボクシングの試合・ドラマの撮影／AFC ウィンブルドンの経緯。
# 日本との接点（基礎の次の節に置いた）：ウィキペディア en "Daichi Kamada"：2024-07-01 パレスに加入、クラブ初の日本人選手。2024-08-18 開幕戦（ブレントフォード戦、1対2）でデビュー、クラブで1000人目のデビュー。2025-05-17 FAカップ決勝でシティに1対0（優勝はクラブ初の主要タイトル）。
#   "Takehiro Tomiyasu"：2026-08-07 アヤックスの契約満了でパレスに加入。今季の名簿（research/pl_data/palace_raw.json）に日本人は鎌田・冨安の2人。冨安のクラブ出場は2。
# 重なりを避けた：クラブ紹介⑧パレスの回（2026-09-20）は本拠地を「2万5194人が入る」の1行で言うだけ。名選手・ザハ・万博の話は言わない。10/16チェルシー・10/22エヴァートンの回と、稼働率の見せ方は同じ型だが数字は別。女子チームの話はしない。
# 読めなかった：クラブ公式の完成日（無い）。ブラウザ操作・JS実行は不使用（requests と WebFetch。WebSearch は題名とURLを探すためだけ）。
# 写真：assets/images/20261023_stadium_palace/（Commons、出典は credits.json）。人物は特定していない。
