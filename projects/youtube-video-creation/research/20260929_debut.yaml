  - id: three
    heading: フィールドの3人
    tier: 報道
    telop: 中野は右で連係、齋藤は2本のカットイン、谷村は10人の左サイドへ
    narrator: 解説
    card:
      type: table
      title: フィールドでデビューした3人
      columns: [名前, 出場, 何をしたか]
      rows:
        - [中野就斗, 先発〜後半27分, 前半は右で連係、後半1分に振り切られる]
        - [齋藤俊輔, 先発〜前半終了, 4分と32分にカットインからシュート]
        - [谷村海那, 後半36分〜, 投入直後に10人となり左サイドハーフへ]
    say:
      - text: 右のウイングバックに入った中野就斗は、前半は佐藤龍之介と右で連係を作りました。
        image: assets/images/20260929_nakano/01.jpg
      - ただ後半1分、バルボに振り切られ、その折り返しから先制点を許します。
      - text: 左のシャドーの齋藤俊輔は、開始4分にカットインからシュート。
        image: assets/images/20260929_saito/01.jpg
      - 32分にも同じ形で打ちましたが、GKの正面。前半だけで伊東純也と交代しました。
      - text: 谷村海那は後半36分、田中聡に代わって前線へ。
        image: assets/images/20260929_tanimura/01.jpg
      - 直後に渡辺剛が負傷して10人になると、左サイドハーフに回って守りました。
    sources:
      - https://web.gekisaka.jp/news/japan/detail/?459901-459901-fl
