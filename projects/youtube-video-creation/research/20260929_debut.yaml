    say:
      - text: 小久保玲央ブライアンは、前半をゴールに鍵をかけたまま終えました。
        image: assets/images/20260929_kokubo/01.jpg
      - 終了間際のコーナーキック。マクンのシュートを横っ飛びで止めます。
      - 続くコーナーでも至近距離のシュートを体で防ぎ、無失点で折り返しました。
      - ハーフタイムに鈴木彩艶と交代しました。
    sources:
