  say:
  - text: 熊坂光希は1年3か月ぶりに戻った日本代表で、デビュー戦を8分で終えました。
    short_only: true
    image: assets/images/20260929_kumasaka/01.jpg
  - 熊坂が初めて呼ばれたのは2025年6月。デビューを前にした練習で右膝の前十字靭帯を断裂。
  - 今年5月に試合へ戻り、今季はリーグ戦8試合に出ています。
  - そして28日の先発。開始2分の接触のあと左膝を気にし、6分に座り込みました。
  - 8分、担架で運ばれて田中聡と交代しました。
