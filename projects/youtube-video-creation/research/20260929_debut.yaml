    heading: 1年3か月待った先発
    tier: 報道
    telop: 熊坂光希は前半6分に座り込み、8分に担架で交代
    narrator: キャスター
    card:
      type: table
      title: 熊坂光希の1年3か月
      columns: ['', '']
      rows:
        - [2025年6月, 初めて代表に呼ばれる]
        - [その練習中, 右膝の前十字靭帯を断裂]
        - [2026年5月, 試合に復帰]
        - [9月22日, 1年3か月ぶりに代表へ]
        - [9月28日 前半8分, 左膝を気にして交代]
    say:
      - text: 熊坂光希は1年3か月ぶりに戻った日本代表で、デビュー戦を8分で終えました。
        short_only: true
        image: assets/images/20260929_kumasaka/01.jpg
      - 初めて呼ばれた2025年6月、デビューを前にした練習で右膝の前十字靭帯を断裂。
      - 今年5月に試合へ戻り、今季はリーグ戦8試合に出ています。
      - そして28日の先発。開始2分の接触のあと左膝を気にし、6分に座り込みました。
      - 8分、担架で運ばれて田中聡と交代しました。
    sources:
