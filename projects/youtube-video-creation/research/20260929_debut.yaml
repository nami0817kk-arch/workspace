- id: view
  viewpoint: true
  heading: なぜ一度に5人か
  tier: 背景
  telop: 3期目はアジアカップまでの半年契約。次は10月1日のエクアドル戦
  narrator: 解説
  card:
    type: table
    title: 5人を試した理由と、次
    columns:
    - ''
    - ''
    rows:
    - - 森保監督の3期目
      - アジアカップまでの半年契約
    - - この試合
      - 前半0-0、主力5人が入った後半に2-1
    - - 次の試合
      - 10月1日 エクアドル戦（横浜）
  say:
  - 一度に5人を試したのは、底上げを急いでいるからです。
  - 前半は両チームとも無得点。点が動いたのは、上田や久保ら主力5人が入った後半でした。
  - 宮本恒靖会長は、前半をこう見ました。
  - voice: 宮本会長
    text: 求められる強度やクオリティーは、
  - voice: 宮本会長
    text: 後半のメンバーとの差は見られた
  - voice: 宮本会長
    text: Ａ代表を目指していく上でもっとやらなければいけないと、
  - voice: 宮本会長
    text: 彼らも感じていると思う
  - 森保監督の3期目は、来年1月からのアジアカップまでの半年契約。
  - 次は10月1日、横浜でエクアドル戦。5人のうち誰に2度目の出番が来るかで、序列が見えます。
  sources:
  - https://news.yahoo.co.jp/articles/bbb40c670658e13dc70d16376acacfb5138def90
  - https://www.soccer-king.jp/news/japan/national/20260928/2210392.html
  - https://web.gekisaka.jp/news/japan/detail/?459892-459892-fl
