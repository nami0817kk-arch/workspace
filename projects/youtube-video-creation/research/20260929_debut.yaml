      - text: 9月28日の広島。ベネズエラに2対1で勝った試合で、日本代表に新しい顔が5人並びました。
        image: assets/images/20260929_kokubo/01.jpg
      - 先発は4日前のウルグアイ戦から10人を入れ替え、4人がA代表デビュー。
      - text: ゴールに小久保玲央ブライアン、右に中野就斗、中盤に熊坂光希、左に齋藤俊輔。
        card:
          type: table
          title: A代表デビューの5人（9月28日）
          columns: [所属, 名前, 位置, 年齢]
          rows:
            - [シント・トロイデン, 小久保玲央ブライアン, GK, 25歳]
            - [サンフレッチェ広島, 中野就斗, MF/FW, 26歳]
            - [柏レイソル, 熊坂光希, MF/FW, 25歳]
            - [ウェステルロー, 齋藤俊輔, MF/FW, 21歳]
      - text: 終盤には谷村海那も入り、デビューは一度に5人になりました。
        card:
          type: table
          title: A代表デビューの5人（9月28日）
          columns: [所属, 名前, 位置, 年齢]
          rows:
            - [シント・トロイデン, 小久保玲央ブライアン, GK, 25歳]
            - [サンフレッチェ広島, 中野就斗, MF/FW, 26歳]
            - [柏レイソル, 熊坂光希, MF/FW, 25歳]
            - [ウェステルロー, 齋藤俊輔, MF/FW, 21歳]
            - [横浜F・マリノス, 谷村海那, MF/FW, 28歳]
      - 前半だけ主将を務めた鎌田大地は、試合後にこう話しています。
      - voice: 鎌田大地
        text: すごく勢いを持ってやってくれていましたし、
      - voice: 鎌田大地
        text: 良いプレーもたくさんありました
      - voice: 鎌田大地
        text: これから彼らが日本を背負っていく選手たちだと思うので、
      - voice: 鎌田大地
        text: これからもどんどん成長していって欲しいです
