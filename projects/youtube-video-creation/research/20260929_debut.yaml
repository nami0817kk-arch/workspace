  say:
  - text: 3バックの右、ウイングバックに入った中野就斗は、前半は佐藤龍之介と右で連係を作りました。
    image: assets/images/20260929_nakano/01.jpg
  - ただ後半1分、バルボに振り切られ、その折り返しから先制点を許します。
  - text: 2列目の左、シャドーの齋藤俊輔は、開始4分にカットインからシュート。
    image: assets/images/20260929_saito/01.jpg
    card:
      type: table
      title: フィールドでデビューした3人
      columns: *id001
      rows:
      - *id002
      - &id003
        - 齋藤俊輔
        - 先発〜前半終了
        - 4分と32分にカットインからシュート
  - 32分にも同じ形で打ちましたが、GKの正面。前半だけで伊東純也と交代しました。
  - text: 谷村海那は後半36分、田中聡に代わって前線へ。
    image: assets/images/20260929_tanimura/01.jpg
    card:
      type: table
      title: フィールドでデビューした3人
      columns: *id001
      rows:
      - *id002
      - *id003
      - - 谷村海那
        - 後半36分〜
        - 投入直後に10人となり左サイドハーフへ
  - 直後に渡辺剛がけがで抜け、交代枠が無く10人になると、左サイドハーフに回って守りました。
