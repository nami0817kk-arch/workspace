# 取材メモ（2026年11月24日）ナポリのデ・ブライネが、古巣マンチェスター・シティの「有罪」の判断に初めて口を開いた。CLでシティと対戦する前日の会見（ニュースのショート。見せ方 Y＝デ・ブライネ本人の言葉から始める）
# 取材: 2026-11-24。WebFetch と requests（ブラウザUA）だけ。検索AI要約・ブラウザの道具は使っていない。FotMob は使っていない。
# 題材の元: Sky Sports の Man City ライブブログ（11/23 21:10 UTC の項。見出し「Man City latest: De Bruyne speaks for first time on club's guilty verdict」、項の見出し「De Bruyne says Man City achievements will not be tainted if appeal fails」。requests で HTML の LiveBlogPosting から全文）
#   ・本文（PA の配信と同じ文。ESPN 50576304 も同文で byline PA）: シティは9月、プレミアリーグの財務規則の重大な違反で有罪とされた（"found guilty of serious breaches of the Premier League's financial regulations in September"）。
#     上訴で負けた場合の処分の1つに、タイトルの一部のはく奪がある。デ・ブライネは35歳、シティで10年、プレミア6回とCLを制し、2025年にナポリへ。
#   ・デ・ブライネ（会見）: "I'm proud of what I've done as a football player, and honestly, this is my club, I love the owners." ／ "I've even spoken to (chairman) Khaldoon (Al Mubarak) about how to buy a club." ／
#     "I have nothing but affection for this club, and that will never change, (the way) the people treated me and my family for 10 years." ／
#     "Of course, in life there are rules, but everybody plays on the limit. I played in between the white lines, and I competed with other players ... That's the thing that I value most." ／
#     "I've given my all and that's not going to change in my mind. I don't think a lot of people will change in their mind how they view me as a player, or how we played." ／ "But everybody has their own opinion, I guess."
#     → 台本の言葉は、この英語を私が日本語にしたもの。'disgraced' の一文は意味が取りにくいので使わない。
# Football Italia（Peter Young、11/23 19:59 UTC「De Bruyne hits back at Napoli exit rumours and comments on Man City guilty verdict」、requests で全文）:
#   ・シティは「100を超える違反」で有罪（"found guilty of over 100 charges relating to the Premier League's financial rules"）。試合は火曜 20:00 GMT、エティハド。昨季9月のリーグフェーズでは0対2で負けている。
#   ・同じ会見の言葉の書き起こしは Sky と少し違う（"everybody plays on the limit I would say" ／ "Other people will change in their mind how they view me"）。→ 食い違いのある最後の部分は使わず、両方で一致する部分だけ使う。
#   ・本人「もうすぐ36歳」（"I'm almost 36"）。Sky・ESPN は「35歳」。→ 年齢は言わない。
# ESPN（PA、50490251、11/15）: シティは「100を超える違反」で有罪とされ、上訴した。独立委員会の判断（9月）。調べの対象は2009〜2018年。処分は勝ち点の大幅な減点や降格もありうる（"could face heavy sanctions, including huge points deductions or demotion"）。
#   → 判決の中身はこの報道の範囲だけ。£8億3,000万の資金の話は細部なので言わない。
# Sky（11/23 12:23 UTC の項）マレスカ監督（シティ）: "He is a top player, one of the most important players at this club. We are very happy to see him back," ／ "All the trophies the club achieved, Kevin was here."
# Football Italia（11/23 20:31 UTC「Allegri: 'Losing to Man City won't be decisive for Napoli'」）アッレグリ監督: "mathematically, even if we win tomorrow, six points won't be enough to qualify." ナポリはCLで4試合勝ち点3。
# ESPN 順位表（uefa.champions、11/24 取得）: シティ 4試合3勝1敗 勝ち点9（7位）／ナポリ 4試合1勝3敗 勝ち点3（27位）。
