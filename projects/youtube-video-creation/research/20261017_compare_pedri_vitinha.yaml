# 取材メモ（10/17 土、シリーズ「比べる」、key: compare_pedri_vitinha）。ペドリ（バルセロナ）×ヴィティーニャ（PSG）。
# **FotMob・DataMB は使っていない**。数字は Transfermarkt だけ（2026-10-17 に取得。控え: research/raw/20261017_pedri_vitinha_tm.json）。
#   Transfermarkt 番号: ペドリ 683840・ヴィティーニャ 487469。API を番号ごとに3本（プロフィール・今季の成績・市場価値の推移）、
#   タイトルは実績ページ（erfolge）を1ページずつ。連続取得はしていない（8秒あけた）。
# **範囲**：スタッツは**リーグ戦のみ**（今季2026/27。ペドリ＝ラ・リーガ ES1・ヴィティーニャ＝リーグ・アン FR1）。代表・CL・カップは混ぜない。
#   足切り450分：ペドリ530分（8試合・先発6）・ヴィティーニャ460分（6試合・先発5）。**どちらも届いている**（ヴィティーニャは10分の余裕）。
#   900分に届かない → 「いまの時点」と言う。大会が違う（ラ・リーガとリーグ・アン）一言を入れる。
# 使った数（全部 Transfermarkt の基本の数）：出場時間・試合・先発・得点・アシスト、**ピッチにいた間のチームの得点・失点**（teamGoalsOnThePitch／opponentGoalsOnThePitch）。
#   ペドリ：530分・得点1・アシスト1・出ていた間のチーム得点25・失点4／ヴィティーニャ：460分・得点1・アシスト1・チーム得点8・失点7。
#   自分で割った値：90分あたり 得点 1×90÷530＝0.17／1×90÷460＝0.20（アシストも同じ）、得点＋アシスト 2×90÷530＝0.34／2×90÷460＝0.39、
#   チーム得点 25×90÷530＝4.25／8×90÷460＝1.57、チーム失点 4×90÷530＝0.68／7×90÷460＝1.37（約2.0倍）、
#   得点＋アシストがチーム得点に占める割合 2÷25＝8%／2÷8＝25%（約3.1倍）。
# **言い切らないこと**：「出ていた間のチーム失点」は**個人の守備の数字ではない**（チーム全体の結果）。失点は4点と7点の小さい数。
#   Transfermarkt の位置表記はペドリ＝セントラルMF、ヴィティーニャ＝守備的MF（どちらも MF）。「攻撃型と守備型」とは言わない。
#   ページ側の画面で「出ていた間のチーム得点・失点」を目で突き合わせていない（leistungsdatendetails の静的HTMLに表が出なかった）。API の値をそのまま使った。
# 年齢別の市場価値（Transfermarkt の推移・年齢ごとの最高値、百万€）：ペドリ 19歳100・20歳100・21歳90・22歳140・23歳150／ヴィティーニャ 19歳1.5・20歳5・21歳12・22歳45・23歳45・（24歳55・25歳110・26歳140）。
#   同じ23歳で 150÷45＝3.3倍。ヴィティーニャのいまの140は、ペドリの23歳（150）より小さい。
# タイトル（Transfermarkt 実績ページ、2026-10-17）：ペドリ＝リーグ3・国内カップ2・国内スーパーカップ3・EURO優勝1・W杯優勝1・ゴールデンボーイ1／
#   ヴィティーニャ＝CL2・リーグ（フランス4＋ポルトガル2＝6）・国内カップ（フランス2＋ポルトガル2＝4）・国内スーパーカップ（フランス4）・UEFAスーパーカップ2・インターコンチネンタル1・UEFAネーションズリーグ1。
# 写真：ペドリ＝FCバルセロナ公式のプロフィール写真（透過PNG、2026-07-21）＋Commons（スペイン代表。バルサのユニの写真は Commons に無い）。
#   ヴィティーニャ＝PSG公式のプロフィール写真（透過PNG）＋Commons（PSG 2024・ポルトガル代表 2026）。2人とも目で見て本人確認済み。
#   サムネ用 01_w2.jpg は公式の透過写真をクラブ色のグラデーションの上に置いた1920x1080（自作の合成）。
# 反応・本人の言葉：入れていない（数字で比べる回）。
