      x: [19歳, 20歳, 21歳, 22歳, 23歳]
      series:
        - [ペドリ, [100, 100, 90, 140, 150]]
        - [ヴィティーニャ, [1.5, 5, 12, 45, 45]]
      focus: ペドリ
      peak: true
    say:
      - text: 市場価値を、同じ年齢で並べます。
        image: assets/images/20261017_pedri_vitinha/01.jpg
      - 23歳の時点で、ペドリは、ヴィティーニャの3倍あまりでした。
      - ヴィティーニャの23歳は、4500万ユーロ。
      - その後に伸びて、26歳のいまの値になりました。
      - それでも、ペドリの23歳の値には届いていません。
    sources:
      - https://www.transfermarkt.com/pedri/marktwertverlauf/spieler/683840
      - https://www.transfermarkt.com/vitinha/marktwertverlauf/spieler/487469

  - id: titles
    heading: タイトルは、どちらが多いのか
    tier: 報道
    telop: タイトルの数
    narrator: 解説
    card:
      type: shelf
      left: {name: ペドリ, club: 個数, photo: assets/images/20261017_pedri/01_sq.jpg, color: "#a50044"}
      right: {name: ヴィティーニャ, club: 個数, photo: assets/images/20261017_vitinha/04_sq.jpg, color: "#004170"}
      rows:
        - [国内リーグ優勝, "3", "6"]
        - [CL優勝, "0", "2"]
        - [UEFAスーパーカップ, "0", "2"]
        - [インターコンチネンタル杯, "0", "1"]
        - [国内カップ優勝, "2", "4"]
        - [国内スーパーカップ, "3", "4"]
        - [W杯・EURO優勝（代表）, "2", "0"]
        - [ネーションズリーグ優勝, "0", "1"]
      note: Transfermarkt の実績ページ（2026年10月17日時点）。ヴィティーニャの国内はフランスとポルトガルの合計
    say:
      - text: 次は、タイトルの数です。ヴィティーニャはおよそ3歳年上です。
        image: assets/images/20261017_pedri/01_r.jpg
      - リーグ優勝は、ヴィティーニャが6回、ペドリが3回です。
      - チャンピオンズリーグは、ヴィティーニャが2回。ペドリは0回。
      - 代表では、ペドリがワールドカップと欧州選手権で、1回ずつ優勝。
      - ヴィティーニャの代表の優勝は、ネーションズリーグの1回。
      - クラブのタイトルは、ヴィティーニャが多い形です。
    sources:
      - https://www.transfermarkt.com/pedri/erfolge/spieler/683840
      - https://www.transfermarkt.com/vitinha/erfolge/spieler/487469

  - id: awards
    heading: 個人賞は、どちらがどんな形で選ばれたのか
    tier: 報道
    telop: 2人の個人賞
    narrator: 解説
    card: &awardcard
      type: timeline
      title: 個人賞
      rows:
        - ["2021年7月", ペドリ。EURO2020の若手最優秀]
        - ["2021年11月22日", ペドリ。ゴールデンボーイ]
        - ["2021年11月29日", ペドリ。コパ・トロフィー]
        - ["2023-24季", ヴィティーニャ。リーグ・アンのベストイレブン]
        - ["2024-25季", 同じ選出。2回目]
        - ["2025年9月", ヴィティーニャ。バロンドール3位]
    say:
      - text: 個人賞を並べます。ペドリの最初は、2021年7月。
        image: assets/images/20261017_pedri/01_r.jpg
        card: {<<: *awardcard, highlight_row: "2021年7月"}
      - text: ユーロ2020の若手最優秀。選んだのは、欧州サッカー連盟の技術観察チームです。
        card: {<<: *awardcard, highlight_row: "2021年7月"}
      - text: 18歳で、この大会に629分出ていました。
        card: {<<: *awardcard, highlight_row: "2021年7月"}
      - text: 11月は、ゴールデンボーイ。21歳未満の最優秀に贈られる賞です。
        card: {<<: *awardcard, highlight_row: "2021年11月22日"}
      - text: 得点は318点で、2位ベリンガムの119点。この賞の過去最大の差とされています。
        card: {<<: *awardcard, highlight_row: "2021年11月22日"}
      - text: コパ・トロフィーは、存命のバロンドール受賞者たちの投票で決まる賞です。
        card: {<<: *awardcard, highlight_row: "2021年11月29日"}
      - text: ヴィティーニャは、リーグ・アンのベストイレブンに2回。
        image: assets/images/20261017_vitinha/04_r.jpg
        card: {<<: *awardcard, highlight_row: "2024-25季"}
      - text: 2025年9月には、バロンドールで3位。1位はデンベレ、2位はヤマルでした。
        card: {<<: *awardcard, highlight_row: "2025年9月"}
      - text: ペドリの3つは、年齢に枠のある若手の賞です。
        image: assets/images/20261017_pedri/02_w.jpg
        card: *awardcard
      - text: ヴィティーニャの賞に、年齢の枠はありません。
        card: *awardcard
      - text: 受賞した年齢は、ペドリが18歳、ヴィティーニャが25歳。
        card: *awardcard
    sources:
      - https://www.uefa.com/uefaeuro/history/news/026b-12bbae1185ee-16613a63959a-1000--pedri-named-euro-2020-young-player-of-the-tournament/
      - https://www.fcbarcelona.com/en/news/2357241/pedri-wins-golden-boy-award
      - https://www.fcbarcelona.com/en/football/first-team/news/2377547/pedri-wins-another-award-by-taking-kopa-trophy
      - https://ligue1.com/en/articles/l1_article_2529-unfp-psg-stars-lead-the-way-in-team-of-the-year-honors
      - https://www.uefa.com/uefachampionsleague/news/029d-1ec96c30aa3f-f6868c869cbd-1000--ousmane-dembele-wins-2025-men-s-ballon-d-or/

  - id: meet
    heading: 2人が同じ試合に立つのは、いつなのか
    tier: 報道
    telop: 代表の決勝と、10月20日のCL
    narrator: 解説
    card: &meetcard
      type: timeline
      title: 2人の接点
      rows:
        - ["2025年6月8日", ネーションズリーグ決勝。2対2からPKでポルトガルが勝利]
        - ["10月20日", CLリーグフェーズ。PSG対バルセロナ]
    say:
      - text: 2人は、2025年6月のネーションズリーグ決勝で向かい合いました。
        image: assets/images/20261017_pedri_vitinha/01.jpg
        card: {<<: *meetcard, highlight_row: "2025年6月8日"}
      - text: 2対2のあと、PKでポルトガルが5対3で勝ちました。
        card: {<<: *meetcard, highlight_row: "2025年6月8日"}
      - text: 2人とも先発で、ペドリは前半終了間際の得点につながるパスを出しました。
        card: {<<: *meetcard, highlight_row: "2025年6月8日"}
      - text: クラブでは、10月20日。チャンピオンズリーグのリーグフェーズです。
        card: {<<: *meetcard, highlight_row: "10月20日"}
      - text: パリ・サンジェルマンとバルセロナが当たります。
        card: {<<: *meetcard, highlight_row: "10月20日"}
      - text: 2人が出るかどうかは、まだ分かりません。
        card: *meetcard
    sources:
      - https://www.uefa.com/uefanationsleague/news/029a-1df446a2d81d-0bc47d9324a5-1000--portugal-vs-spain-highlights-and-report-selecao-create-natio/
      - https://www.uefa.com/uefachampionsleague/news/02a8-2174c9e9019d-f909a77bd77a-1000--2026-27-champions-league-all-the-league-phase-fixtures-a/

  - id: view
    viewpoint: true
    heading: 見立て・得点とアシストが同じ2人の違いは、チームの点に絡む濃さにある
    tier: 背景
    telop: 同じ1と1でも、濃さが違う
    narrator: 解説
    card: &viewcard
      type: duel
      left: {name: ペドリ, club: 530分, photo: assets/images/20261017_pedri/01_sq.jpg, color: "#a50044"}
      right: {name: ヴィティーニャ, club: 460分, photo: assets/images/20261017_vitinha/04_sq.jpg, color: "#004170"}
      rows:
        - [得点＋アシスト, "2", "2"]
        - [チーム得点, "25", "8"]
        - [チーム得点に絡んだ割合, 8%, 25%]
        - [チーム失点/90分, "0.68", "1.37"]
      bars: [チーム得点に絡んだ割合, チーム失点/90分]
      lower: [チーム失点/90分]
      note: リーグ戦。割合は 得点＋アシスト÷出ていた間のチーム得点（自分で割った値）
    say:
      - text: 2人とも、得点とアシストを足して2。ここまでは同じ。
        card: *viewcard
      - text: 違うのは、その時間にチームが取った点。25点と8点。
        card: {<<: *viewcard, highlight_row: チーム得点}
      - text: 2を、チームの得点で割ります。
        card: {<<: *viewcard, highlight_row: チーム得点に絡んだ割合}
      - text: ペドリは8%、ヴィティーニャは25%。およそ3倍。
        card: {<<: *viewcard, highlight_row: チーム得点に絡んだ割合}
        mark:
          - {kind: circle, row: 2, col: 右の値}
      - text: 数字の上では、点への絡み方は、ヴィティーニャが濃い。
        card: {<<: *viewcard, highlight_row: チーム得点に絡んだ割合}
      - text: ただ、パリの8点という小さい数の上の割合。
        card: {<<: *viewcard, highlight_row: チーム得点に絡んだ割合}
      - text: 反対に、出ていた間の失点は、ペドリのほうが少なくなっています。
        card: {<<: *viewcard, highlight_row: チーム失点/90分}
      - text: 90分あたり0.68と1.37。ペドリのほうが、半分ほど。
        card: {<<: *viewcard, highlight_row: チーム失点/90分}
      - text: ペドリの時間のバルセロナは、点も多く、失点も少ない。
        card: {<<: *viewcard, highlight_row: チーム失点/90分}
      - text: ヴィティーニャは、少ない点の中で、より多くに絡んでいます。
        card: {<<: *viewcard, highlight_row: チーム得点に絡んだ割合}
      - text: ただし、リーグも相手も日程も違います。
        card: *viewcard
      - text: 8試合と6試合だけの数字。
        card: *viewcard
      - text: 試合が増えたあと、割合と失点がどこへ落ち着くかを、見たいところです。
        card: *viewcard
    sources:
      - https://www.transfermarkt.com/pedri/leistungsdaten/spieler/683840
      - https://www.transfermarkt.com/vitinha/leistungsdaten/spieler/487469
