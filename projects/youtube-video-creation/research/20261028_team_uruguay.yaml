  say:
  - text: ウルグアイ代表は、ワールドカップで**2度優勝**した国です。
    image: assets/stats/tb_uruguay_data1.png
    no_telop: true
    emph: true
  - text: それなのに、2022年と2026年の大会は、どちらも1次リーグで敗退しました。
    image: assets/stats/tb_uruguay_data2.png
    no_telop: true
  - text: 2026年の3試合は、1つも勝てずに2引き分け1敗。2018年大会の4勝から、大きく落ちました。
    image: assets/stats/tb_uruguay_data_r1.png
    no_telop: true
  - text: そして9月には、日本に1対3で敗れています。
    image: assets/stats/tb_uruguay_data_r2.png
    no_telop: true
  - text: 2度の世界王者は、なぜ勝てなくなったのでしょうか。
    image: assets/stats/tb_uruguay_data_t.png
    no_telop: true
