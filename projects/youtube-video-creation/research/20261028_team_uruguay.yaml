# 代表チーム紹介 ウルグアイ代表（10/28 作成。固定シリーズ9「代表チーム紹介」。見本は 10/27 のオランダ代表 scripts/20261027_team_netherlands.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **軸（2026-10-28）**：「W杯で2度優勝したウルグアイが、2022・2026年と2大会続けて1次リーグで敗退。なぜ止まったのか」。答えは見立ての節（2010〜2018年の16試合と、2022〜2026年の6試合の1試合あたりの得点・失点を自分で割って比べる）。
# **日本との接点**：2026年9月24日のキリンチャレンジカップで日本が3対1で勝った（松木玖生・塩貝健人・上田綺世）。通算11試合、日本から見て3勝4分4敗。基礎DATAの次の節に置いた。
# **重なりの確認（2026-10-28）**：scripts/・research/covered.yaml・research/posted.json を grep。ウルグアイ代表の「紹介」回（team_uruguay）は無い。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ。ウルグアイ代表が主役の news は covered.yaml に 9/15「日本と戦うウルグアイの46人から漏れた、39歳のレジェンド」1件（招集名簿の話。この回では扱わない）。日本戦の結果は日本人ニュースで扱っている可能性があるので、日本との関係の節は結果と得点者・時刻の並びにとどめた。
# ---- 確かめたこと（2026-10-28。WebFetch の要約は使わず、requests で生の値を読んだ）----
#  ・FIFAランク：20位（2026-10-07 発表）。Wikipedia の Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）で Uruguay 20・前回比0。日本は17位、韓国32位、インド138位、アルゼンチン2位（同じ表）。点数は書かない。
#  ・W杯：出場15回（1930年が初）。優勝2回（1930・1950）。Uruguay national football team の infobox と Uruguay at the FIFA World Cup の表。2010年4位（7試合3勝2分2敗11得点8失点）／2014年ベスト16（4試合2勝0分2敗4得点6失点）／2018年ベスト8（5試合4勝0分1敗7得点3失点）／2022年1次リーグ（3試合1勝1分1敗2得点2失点。韓国0-0・ポルトガル0-2・ガーナ2-0）／2026年1次リーグ（3試合0勝2分1敗3得点4失点。サウジアラビア1-1・カーボベルデ2-2・スペイン0-1）。
#  ・自分で割った（検算した）：2010〜2018年 16試合 9勝 22得点17失点 → 22÷16=1.375・17÷16=1.0625・勝率 9÷16=56%／2022〜2026年 6試合 1勝 5得点6失点 → 5÷6=0.833・6÷6=1.0・勝率 1÷6=17%。
#  ・2026年W杯の試合（Uruguay national football team の試合一覧と ESPN の fifa.world scoreboard を突き合わせた）：6/15 サウジアラビア1-1（アル・アムリ41分／マキシミリアーノ・アラウホ80分）、6/21 カーボベルデ2-2（ピナ21分・バレラ61分／M.アラウホ44分・カノッビオ45+6分）、6/26 スペイン0-1（バエナ42分）。サウジアラビア戦はボール保持67%（本文「holding 67% possession, their highest ever in a World Cup match on record」）。本文「eliminated in the group stage for the second World Cup in a row」。
#  ・コパ・アメリカ：優勝15回（infobox。最後は2011年）。
#  ・監督：ディエゴ・フォルラン。2026-08-06 にA代表とU-20代表の監督に就任（AUF「Diego Forlán vuelve a la Selección Uruguaya」2026-08-06、Diego Forlán の記事）。前任はビエルサ（2023〜2026）。フォルランは選手として代表112試合36得点、2010年W杯の最優秀選手（Golden Ball）。**セレッソ大阪の在籍（2014年）はJリーグの話なので入れない。**
#  ・主将：ホセ・マリア・ヒメネス（名簿の印 captain。11月の招集名簿で代表101試合8得点、所属デポルティーボ・ラ・コルーニャ）。副主将：フェデリコ・バルベルデ（vice-captain、76試合9得点、レアル・マドリード）。
#  ・愛称：La Celeste（infobox。The Sky Blue）。水色のユニフォームは1910年8月15日に初めて着た（本文 Kits and crest）。
#  ・名簿・年齢：Wikipedia の Current squad（11月の親善試合の予備登録42人。2026-10-23 発表）と各選手の記事の infobox（currentclub）。2026-10-28 時点の年齢（生年月日から計算）：ヒメネス 1995-01-20=31（デポルティーボ、DF）、ロナルド・アラウホ 1999-03-07=27（リヴァプール、DF）、バルベルデ 1998-07-22=28（レアル・マドリード、MF）、ベンタンクール 1997-06-25=29（トッテナム、MF）、マキシミリアーノ・アラウホ 2000-02-15=26（スポルティング、MF、34試合8得点）、ダルウィン・ヌニェス 1999-06-24=27（アル・ディリーヤ、FW、44試合16得点）。
#  ・W杯のあと（試合一覧と ESPN の fifa.friendly scoreboard で日付・スコア・得点者を確認）：9/24 日本1-3（利府。松木玖生11分／M.アラウホ42分／塩貝健人90+2分・上田綺世90+6分。ESPN は日本の後半2点の得点者を出していない。**日本の記録の頁は失点を「Ronald Araújo」と書くが、ウルグアイの頁と ESPN は Maxi Araújo**）／9/28 韓国4-1（ソウル。ヌニェス13・62分、デ・アラスカエタ27分、キム・ミンジェのオウンゴール43分／ソン・フンミン80分）／10/6 インド6-1（コルカタ。ヌニェス11分PK、M.アラウホ28・59分、サラサール53分、サナブリア71分、アギーレ86分／タパ22分）＝2勝1敗・11得点5失点。自分で割った：11÷3=3.67・5÷3=1.67。次は 11/13 アルゼンチン（ブエノスアイレス）。
#  ・日本との対戦：国際Aマッチ11試合、日本から見て3勝4分4敗・23得点27失点（Japan national football team records and statistics の Head-to-head：URU 1985–2026 11・3・4・4・23・27）。試合は Japan national football team results の各表：2018-10-16 親善試合 4-3（埼玉）／2019-06-20 コパ・アメリカ 2-2（ポルトアレグレ）／2023-03-24 親善試合 1-1（東京。西村拓真75分／バルベルデ38分）／2026-09-24 親善試合 3-1（利府）。
# ---- 言わないもの ----
#  ・怪我／私生活／スアレスの代表の去就（9/15 の news の中身）／背番号／戦術の説明／監督の契約の金額／セレッソ大阪（Jリーグ）。
