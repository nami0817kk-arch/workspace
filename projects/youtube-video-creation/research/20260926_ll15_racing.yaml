    - ''
    rows:
    - - 1981年12月27日
      - レアル・マドリードとのアウェー戦
    - - 入れた名前
      - ドイツの電機メーカー、テカ
    - - 1990年代の初め
      - テカはマドリードのスポンサーに
  say:
  - スペインで初めて、ユニフォームに会社の名前を入れたのも、このクラブです。
  - '**1981年**の暮れ、レアル・マドリードとのアウェー戦。名前はドイツのテカでした。'
  - そのテカは、1990年代の初めに、マドリードのスポンサーになります。
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://es.wikipedia.org/wiki/Real_Racing_Club_de_Santander
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
- id: history3
  heading: 給料が止まった3部で
  tier: 背景
  telop: 2014年、給料が半年止まったまま国王杯へ
  narrator: 解説
  card:
    type: table
    title: 給料が止まった3部で
    columns: &id001
    - ''
    - ''
    rows:
    - - 2012年・2013年
