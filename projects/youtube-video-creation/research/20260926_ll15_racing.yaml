- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: カナレスの帰還と、守りを課題にする監督
  narrator: キャスター
  say:
  - text: 地元サンタンデール育ちのカナレスが、**16年**ぶりに帰ってきました。
    image: assets/stats/ll_racing_data_r1.png
    no_telop: true
  - text: 率いるのはホセ・アルベルト監督。大敗のあと、こう話しました。
    image: assets/stats/ll_racing_data_r2.png
    no_telop: true
  - voice: ホセ・アルベルト
    text: 自分たちは、ひと目で分かる色とスタイルを持ったチームだ
    image: assets/stats/ll_racing_data_r2.png
  - voice: ホセ・アルベルト
    text: だが、もっと競り合って、もっと良く守らないといけない
    image: assets/stats/ll_racing_data_r2.png
  - text: そしてこのクラブの選手たちは**2014年**、給料が止まった抗議で、
    image: assets/stats/ll_racing_data_r3.png
    no_telop: true
  - text: 国王杯の試合を拒み、センターサークルから動かなかったことがあります。
    image: assets/stats/ll_racing_data_r3.png
    no_telop: true
  - image: assets/stats/ll_racing_data0.png
    text: 創立は**1913年**。最初の試合は、地元のクラブに**1対2**で負けました。
    no_telop: true
  - image: assets/stats/ll_racing_data1.png
    text: 愛称は「ベルディブランコス」。スペイン語で、緑と白のことです。
    no_telop: true
  - image: assets/stats/ll_racing_data2.png
    text: ホームタウンはサンタンデール。カンタブリア州の州都で、大きな銀行が生まれた港町。
    no_telop: true
  - image: assets/backgrounds/stadium_ラシンサンタンデール.png
    text: 本拠地はエル・サルディネーロ。クラブの発表では、**2万2514人**が入ります。
  - image: assets/stats/ll_racing_data4.png
    text: オーナーはセバスティアン・セリア。**2023年**に、会長と2人で株の**74パーセント**を得ました。
    no_telop: true
  - image: assets/stats/ll_racing_cups.png
    text: 1部も国王杯も、まだ優勝がありません。1部の最高は、**1931年**の2位です。
    no_telop: true
  - image: assets/stats/ll_racing_data6.png
    text: 最多出場は、地元生まれのキーパー、セバージョス。このクラブだけで**460試合**。
    no_telop: true
  - image: assets/stats/ll_racing_data7.png
    text: 直近のタイトルは昨シーズンの2部優勝。最終節は、カディスに**4対1**で勝ちました。
    no_telop: true
  - image: assets/stats/ll_racing_data8.png
    text: 昨シーズンは2部で**1位**。勝ち点**82**で、2位に**5**差をつけています。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://en.wikipedia.org/wiki/Template:2026%E2%80%9327_La_Liga_table
