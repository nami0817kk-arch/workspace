    - - 2014年1月
      - 3部から国王杯の準々決勝
  say:
  - 2012年から2年続けて降格し、3部まで落ちます。
  - 2014年1月、3部のまま国王杯の準々決勝へ。相手はレアル・ソシエダでした。
  - text: このとき選手の給料は、**半年**止まっていました。
    card:
      type: table
      title: 給料が止まった3部で
      columns: *id001
      rows:
      - - 選手の給料
        - 半年止まったまま
  - ホームの2戦目。選手たちはキックオフのあと、センターサークルに集まったまま動きません。
  - 試合は**1分**で止められ、クラブは次の国王杯に出られなくなりました。
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://es.wikipedia.org/wiki/Historia_del_Real_Racing_Club_de_Santander
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
- id: history4
  heading: 14年ぶりの1部
  tier: 背景
  telop: 2026年5月、14年ぶりの1部が決まる
  narrator: 解説
  card:
    type: table
    title: 14年ぶりの1部
    columns:
    - ''
    - ''
    rows:
    - - 2022年
      - 3部を制して2部へ
    - - 2026年5月16日
      - バジャドリードに4対1
    - - 1部
      - 14年ぶりに復帰
  say:
  - text: 2部と3部を行き来したあと、**2022年**に3部を制して2部へ戻ります。
    image: assets/images/ll_racing_history4/scene.jpg
  - そして**2026年5月16日**、ホームでバジャドリードに**4対1**で勝ちます。
  - 1部への復帰が決まり、次の日、選手を乗せたバスを大勢の人が囲みました。
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://es.wikipedia.org/wiki/Real_Racing_Club_de_Santander
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_La_Liga
  - https://commons.wikimedia.org/wiki/File:Real_Racing_Club_de_Santander_-_Liga_celebration_01.jpg
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 攻める。見いだして売る。地元の歌で応援
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 攻めて取る
    - - 運営の型
      - 見いだして売る
    - - クラブの気質
      - 地元の民謡で応援
  say:
  - text: ホセ・アルベルト監督のチームは、攻めて取る。昨シーズンの2部で**90得点**、リーグ最多です。
    image: assets/photos/ll/racing/racing_manager_ca76efd7.jpg
  - ピッチの外は、見いだして売る型。
  - ガライは**2008年**、レアル・マドリードへ**1000万ユーロ**で移りました。
  - スタンドで歌うのは、地元の民謡「カチョの泉」。
  - '**25**あるサポーターの会のうち、**22**がカンタブリアにあります。'
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://en.wikipedia.org/wiki/2025%E2%80%9326_Segunda_Divisi%C3%B3n
  - https://es.wikipedia.org/wiki/Real_Racing_Club_de_Santander
  - https://en.wikipedia.org/wiki/Ezequiel_Garay
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
- id: episode
  heading: 負けるまで剃らない
  tier: 背景
  telop: 口ひげは、負けるまで剃らない
  narrator: 解説
  card:
    type: table
    title: 負けるまで剃らない
    columns: &id002
    - ''
    - ''
    rows:
    - - 1972年から73年
      - 2部で昇格争い
    - - 選手たちの約束
      - 負けるまで口ひげを剃らない
  say:
  - 1972年に始まったシーズン。2部にいたチームの選手たちが、ある約束をします。
  - 負けるまで、口ひげは剃らない。相手はどこも、本気で止めに来たといいます。
  - text: 初めての負けは、マドリードでのラージョ戦。監督も含め、全員がひげを剃りました。
    card:
      type: table
      title: 負けるまで剃らない
      columns: *id002
      rows:
      - - 初めての負け
        - ラージョ・バジェカーノ戦
  - チームはそのまま、1部に上がっています。
  sources:
  - https://es.wikipedia.org/wiki/Real_Racing_Club_de_Santander
  - https://es.wikipedia.org/wiki/Historia_del_Real_Racing_Club_de_Santander
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
