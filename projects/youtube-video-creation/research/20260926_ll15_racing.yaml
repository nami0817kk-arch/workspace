  official: false
- id: history
  heading: 1部を作った10クラブ
  tier: 背景
  telop: 最初の1部、10クラブの1つ
  narrator: 解説
  card:
    type: table
    title: 1部を作った10クラブ
    columns:
    - ''
    - ''
    rows:
    - - 1929年
      - 最初の1部は10クラブ
    - - 最後の1枠
      - バレンシア・ベティス・セビージャを破る
    - - 1部
      - 通算45シーズン
  say:
  - '**1929年**に始まったスペインの1部。最初の**10クラブ**に、このクラブがいました。'
  - 最後の1枠をかけた勝ち抜きで、バレンシア、ベティス、セビージャを破っています。
  - 1部で戦ったのは通算**45シーズン**。カンタブリアから1部に出たクラブは、ここだけです。
  sources:
  - https://en.wikipedia.org/wiki/Racing_de_Santander
  - https://es.wikipedia.org/wiki/Real_Racing_Club_de_Santander
  bg: assets/backgrounds/stadium_ラシンサンタンデール_in.png
  official: false
- id: history2
  heading: ユニフォームに会社の名前
  tier: 背景
  telop: スペインで初めて、ユニフォームに会社の名前
  narrator: 解説
  card:
    type: table
    title: ユニフォームに会社の名前
    columns:
