# 取材メモ（10/12 月、シリーズ「比べる」、key: compare_dortmund_monaco、型は news）。
# 材料の控えは research/raw/20261012_compare_dortmund_monaco.md。**この控えの外へ出ていない。**
#
# **「比べる」の3つ（選手／クラブ／同じ年齢）のうち「クラブ」で組んだ。**
#   ブンデスリーガの首位ドルトムントと、リーグ・アンの首位モナコ。どちらもリーグ戦は無敗（4勝1分／4勝2分）。
#   軸は「同じ週末に、どちらもホームで2対0から2対2。その2クラブは、点が入る時間と点を取る人がどう違うか」。
#   強い一点は、**ドルトムント（10/9）とモナコ（10/10）が24時間のうちに、ホームで2対0から2対2になった**こと。
#
# **候補は3組検討した**（控え 0）。①ドルトムント×モナコ（採用）②ラツィオ×ミラン（10/11 に両クラブとも第6節があり、
#   公開までに数字が動く。見送り）③ヌメチャ×カマラ（どちらも市場価値5500万ユーロの中盤。軸が弱い）。
#
# **重なりの確認（直近30日）**: corpus.txt・posted.json・covered.yaml を人名・クラブ名で引いた。
#   選手の人名 0件／ブレーメン・トゥールーズ・ボデ/グリムト・CSKAソフィア 0件。
#   **クラブ名だけ4件残る**：ドルトムント1件（9/18「ヴァツケが会長に…」＝会長の発言の話で、試合も選手も出てこない）、
#   モナコ3件（9/13・9/27・10/4＝すべて南野拓実の復帰の話）。**ユーザーに報告して、外すかどうかは判断してもらう。**
#   南野はこの台本に出していない。使わない指定のクラブ・人名は1つも使っていない。
#   モナコの9/4 のパリ・サンジェルマン戦（2対1）は、相手クラブとして1行だけ出る（PSG の選手は出さない）。
#
# **数字はすべて自分で数えた。**得点の分と得点者は Transfermarkt の tmapi（/game/<id> の actions）、FotMob、ESPN の3つ、
#   順位は tmapi の順位表と ESPN で確かめ、**一次情報は2つ**：ブンデスリーガ公式の試合記録（10/9）と AS モナコ公式の試合記録（10/10）。
#   リーグ戦だけ。基準は **2026年10月11日の朝**（ドルトムント5試合・モナコ6試合）。
#   自分で割った数: 13÷5＝2.60／14÷6＝2.33／11÷5＝2.20／10÷6＝1.67／4÷5＝0.80／5÷6＝0.83／
#     最初の得点の分 (9+61+5+70+80)÷5＝45.0、(14+13+58+71+32+29)÷6＝36.17（36.2）／
#     76分以降 5÷11＝45%、1÷10＝10%／ブルナー 4÷10＝40.0%、ドルトムントの最多 2÷11＝18.2%／13+2＝15、14+2＝16
#   15分ごとの得点（45+1 は31〜45、90+2 は76〜90の帯）: ドルトムント 2・0・1・0・3・5／モナコ 2・1・2・2・2・1
#   **食い違いの控え**（raw 1 の末尾）:
#     ①ドルトムント対ハンブルク 45+1分は、ESPN が「相手のオウンゴール」、Transfermarkt と FotMob が「コンスタンテリアス」。
#       **Transfermarkt と FotMob に揃えた**ので、ドルトムントの得点者は選手7人＋オウンゴール1（ESPN だと6人＋2）。
#     ②オポンの得点は tmapi・FotMob・ESPN が59分、AS モナコ公式は60分。**台本は分を言わず「後半の15分以内」と言う**。
#     ③「首位」は時点つき。ドルトムントは10/11 夜のフライブルク戦で入れ替わりうる（フライブルクは4試合・勝ち点10・得失点差+9）。
#       台本は「第5節を終えて」「10月11日の朝」と言い、**公開前に順位を取り直す**。モナコは10/11 に試合が無い。
# **言い切っていないもの**: どちらが上かは一度も言わない。時間帯と得点者の違いは「寄っている」「分かれている」までにして、
#   失点の側（後半の頭にモナコ4失点）も数字だけで並べた。「2対0を守れなかった」とは言わず、勝ち点が3から1になった、までにした。
#   「もし2対0で終わっていれば15と16」は式として出すだけで、その先（優勝・順位）は言っていない。
#   「だけ」「最下位」などで小さく見せていない。
# 板：①versus（スタジアムの写真。3行だけで下ろす）②timeline×2（試合の分）③table（6行）④line（15分ごとの得点）と calc×2
#   ⑤waterfall×2（勝ち点の積み上がり）と table（失点の帯）⑥stats（得点者）と calc×2 ⑦calc×2（15と16）。
#   **`card: none` は明示してある**。赤ペンは使っていない。
# 写真：Commons の場面写真だけ（顔は出さない）。ドルトムント＝「GER Dortmund Stadion 002 2011 - Südtribüne.jpg」CC BY-SA 3.0 / Der-wuppertaler、
#   モナコ＝「StadeLouisII-MonacoNice.jpg」CC0 / Ing-renault06。2枚を横に並べた1枚（cmp_pair）と、それぞれの横長（cmp_mon_w）。
#   ブンデスリーガ公式の試合記録の写真は IMAGO、AS モナコ公式の写真は幅842pxで、どちらも取り込んでいない。
#   モナコの顔写真は Commons に無い。ギラシ・シュロッターベックの Commons 写真（2024年・2022年）は取り込んだが、軸に関係しないので使っていない。
#   **本編の冒頭に顔が無い**（スタジアムの写真）ので、preview4 の「冒頭に顔なし」の × は、あれば報告する。
# 声：1件も無い（シリーズの回。ブラウザの道具を使わない約束なので反応は集めていない）。
# **ショート**：シリーズの回にショートは作らない決まり（2026-10-10）なので、ショートの × は直していない。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは点検用の1つ（構図 number）。直近は versus（10/9・10/11）なので
#   同じ構図を続けない。案3つは報告に書いた。
