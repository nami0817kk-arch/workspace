  lead: ブンデスリーガの首位と、リーグ・アンの首位。
  takeaway: ドルトムント（ブンデスリーガ、第5節を終えて首位）は10月9日、モナコ（リーグ・アン、首位）は10日に、どちらもホームで2対0のリードから2対2になった。リーグ戦は10月11日の朝まででドルトムントが5試合4勝1分け・勝ち点13（1試合あたり2.60）、モナコが6試合4勝2分け・勝ち点14（2.33）で、どちらも負けていない。得点は11と10、失点は4と5でよく似ているが、点が入る時間が違う。ドルトムントは11点のうち5点が76分以降（45%）、モナコは10点のうち1点（10%）。試合ごとの最初の得点の分は平均45.0分と36.2分で、モナコのほうが約9分早い。得点者はドルトムントが選手7人で最多2点（18.2%）、モナコは6人でブルナーが4点（40.0%）。2対0で終わっていれば勝ち点は15と16で、2位との差はいまの2点と1点から4点と3点だった。次の物差しは欧州の敵地で、ドルトムントは日本時間15日の午前4時にボデ・グリムト（チャンピオンズリーグ）、モナコは16日の午前1時45分にCSKAソフィア（カンファレンスリーグ）と当たる
