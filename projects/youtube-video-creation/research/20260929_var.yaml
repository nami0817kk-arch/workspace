      - text: 広島の日本対ベネズエラ、日本が2対1で勝利。
        image: assets/images/20260929_kubo_var/01.jpg
      - 46分に先制され、49分に上田綺世が追いついて同点。
      - 日本は3回の交代を終えたあと、渡辺剛が右足を痛めます。
      - 後半41分にピッチの外へ。交代の枠は無く、残りは10人でした。
      - voice: 久保建英
        text: 事故みたいな感じで1人少なくなって守り一辺倒だった
