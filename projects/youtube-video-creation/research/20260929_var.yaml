      - voice: ビスカロンド監督
        text: 非常に驚いた
      - voice: ビスカロンド監督
        text: 審判のジャッジに関しては
      - voice: ビスカロンド監督
        text: 私たちに対するリスペクトが欠けていると感じた
        cont: true
      - voice: ビスカロンド監督
        text: 不服に思う部分もあったが、
      - voice: ビスカロンド監督
