  - id: reversal
    main: true
    heading: 相手のPKが、日本のPKに
    tier: 報道
    telop: 久保が踏まれて笛なし→相手PK→VAR→日本のPK
    narrator: キャスター
    card:
      type: table
      title: 後半アディショナルタイムの判定
      columns: ['', '']
      rows:
        - [45+1分, 久保がエリア内で倒れる。笛は鳴らず]
        - [直後, カウンター。鈴木淳之介がラミレスを倒す]
        - [主審, ベネズエラのPKを宣告]
        - [VAR, 介入。主審がピッチ脇の画面で見直す]
        - [判定, 久保への反則が先。日本のPKに]
        - [45+6分, 上田がゴール左に決めて2-1]
    say:
      - text: 日本は10人。同点のまま迎えた終了間際に、判定が二転三転しました。
        short_only: true
      - text: 後半アディショナルタイム1分。久保建英が右からエリアの中へ入り、折り返します。
        image: assets/images/20260929_kubo_var/01.jpg
      - 相手のクリアをエリア内で拾ったところで、右足を踏まれて倒れました。
      - 笛は鳴らず、プレーは続きます。
      - ベネズエラはそのままカウンター。ラミレスがエリアの左へ切り込みます。
      - 対応した鈴木淳之介がラミレスを倒し、主審はベネズエラのPKを宣告。
      - ここでブイエーアールが介入します。映像で判定を見直す審判のことです。
      - 主審はピッチ脇の画面で確かめる、オン・フィールド・レビューへ。
      - 見直したのは、久保が踏まれた場面。反則が先にあったとして、判定は日本のPKに。
      - 6分、上田綺世がゴール左に決めて、日本が逆転で勝ちました。
      - voice: 久保建英
        text: なんとかチャンスがあればと思っていたので、
      - voice: 久保建英
        text: 結果勝てて良かった
        cont: true
