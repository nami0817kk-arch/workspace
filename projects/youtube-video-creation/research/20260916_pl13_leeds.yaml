sections:
  - id: birth
    heading: 前のクラブは、解散させられた
    main: true
    tier: 背景
    telop: 1919年、リーズ・シティの代わりに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1919年10月17日"]
        - ["理由", "リーズ・シティが強制的に解散"]
        - ["愛称", "The Whites（ホワイツ）"]
        - ["本拠地", "エランド・ロード／37,633人"]
    say:
      - "アルファベット順では13番目。**前のクラブが消された街の、代わりのクラブ**です。"
      - このクラブができたのは**1919年10月17日**。ほかより遅い生まれです。
      - 理由があります。**この街には、すでに別のクラブがありました。**
      - リーズ・シティです。そのクラブが、リーグから**強制的に解散させられました。**
      - 第一次世界大戦中に、選手へ不正な支払いをしていたという疑いでした。
      - 街からクラブが消えた。その代わりに作られたのが、いまのクラブです。
      - 消えたほうには、続きがあります。
      - "1919年10月17日、リーズのホテルで**選手16人が競売にかけられました。**"
      - 9つのクラブが、合わせて9250ポンドで買っていきました。
      - そして同じ日付で、いまのクラブができています。
      - 愛称は「ホワイツ」。真っ白なユニフォームからです。
      - この色にしたのはドン・レヴィー監督で、**レアル・マドリードに倣った**ものでした。
      - それまでの愛称は「**ピーコックス**」、孔雀です。エランド・ロードの昔の名前から来ていました。
      - 本拠地はエランド・ロード。いまの収容は3万7633人です。
      - ただし1967年には、同じ場所に**5万7892人**が入ったことがあります。いまより2万人多い時代でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
      - https://en.wikipedia.org/wiki/Leeds_City_F.C.
  - id: revie
    heading: 強かった時代
    tier: 背景
    telop: ドン・レヴィーの13年。無敗34試合
    narrator: キャスター
    card:
      type: table
      title: レヴィー時代のタイトル
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "2回"]
        - ["FAカップ／リーグカップ", "各1回"]
        - ["インターシティーズ・フェアーズカップ", "2回"]
        - ["1968-69年", "無敗34試合の記録"]
    say:
      - このクラブがいちばん強かったのは、ドン・レヴィーが率いた時代です。
      - 1961年から1974年まで、13年。
      - リーグ優勝2回、FAカップ、リーグカップ、そしてフェアーズカップを2回。
      - 1968年から69年にかけては、**34試合続けて負けませんでした。**
      - リーグ優勝はもう1度あります。1991年から92年。
      - "**プレミアリーグが始まる前の、最後の1部優勝**でした。クラブとして3度目です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
  - id: fall
    heading: 3部まで落ちた
    tier: 背景
    telop: 2007年に経営破綻。クラブ史上はじめての3部
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["2003-04年", "1部から降格"]
        - ["2007年", "経営破綻。3部へ"]
        - ["2020年7月17日", "16年ぶりに1部復帰"]
        - ["2024-25年", "2部優勝（カーディフに7-0）"]
    say:
      - 2003年から04年、リーズは1部から落ちます。
      - お金の問題が続き、2007年には経営が行き詰まりました。
      - 行き着いた先は**3部**。クラブの歴史ではじめてのことでした。
      - 戻ってくるまでに**16年**かかっています。
      - 昨季、2024年から25年には2部を優勝しています。
      - エランド・ロードでのカーディフ・シティ戦は**7対0**。語り継がれる勝ち方でした。
      - このクラブの落ち方には、名前が付いています。
      - "英語で「**Doing a Leeds**」。**使いすぎて自分でつぶれること**を指す言い方です。"
      - いちばんのライバルはマンチェスター・ユナイテッドです。
      - ヨークシャーとランカシャーの対立で、**15世紀の薔薇戦争まで**さかのぼるとされています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
      - https://en.wikipedia.org/wiki/Doing_a_Leeds
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.%E2%80%93Manchester_United_F.C._rivalry
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。田中碧
    narrator: キャスター
    card:
      type: table
      title: 田中碧とリーズ
      columns: ["", ""]
      rows:
        - ["加入", "2024年8月30日（4年契約・背番号22）"]
        - ["2024-25", "2部で45試合5得点。優勝"]
        - ["2025-26", "1部で33試合4得点"]
    say:
      - 監督はダニエル・ファルケです。
      - "そして、このクラブには**田中碧**がいます。"
      - 2024年8月、デュッセルドルフから4年契約で加わりました。
      - 加入した最初のシーズンに、45試合で5得点。
      - "そのシーズン、リーズは**2部で優勝して1部に戻ります。**"
      - つまり、さきほどの「16年ぶりの復帰」のあと、もう一度落ちて上がった側に日本人がいた形です。
      - もうひとり、名前だけ挙げておきます。**井手口陽介**です。
      - 2018年1月にガンバ大阪から加入しましたが、**イギリスの労働ビザの基準を満たせませんでした。**
      - 同じ日にスペインへレンタルに出され、**リーズでは公式戦に一度も出ていません。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
      - https://en.wikipedia.org/wiki/Ao_Tanaka
      - https://ja.wikipedia.org/wiki/井手口陽介
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝3回（直近 1991-92）、FAカップ1回（1971-72）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "3回（直近 1991-92）"]
        - ["FAカップ", "1回（1971-72）"]
        - ["リーグカップ", "1回（1967-68）"]
        - ["フェアーズカップ", "2回（1967-68／1970-71）"]
    say:
      - 数えると、大きなタイトルで**7個**です。
      - 1部優勝3回、FAカップ1回、リーグカップ1回。それにフェアーズカップが2回。
      - "ただし1部優勝の直近は**1991年から92年**。**34年、何も獲っていません。**"
      - そこに田中碧がいて、今季がプレミアリーグ1年目になります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
