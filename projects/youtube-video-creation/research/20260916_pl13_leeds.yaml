sections:
  - id: birth
    heading: 前のクラブは、解散させられた
    main: true
    tier: 背景
    telop: 1919年、リーズ・シティの代わりに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1919年10月17日"]
        - ["理由", "リーズ・シティが強制的に解散"]
        - ["愛称", "The Whites（ホワイツ）"]
        - ["本拠地", "エランド・ロード／37,633人"]
    say:
      - アルファベット順では、13番目に来ます。
      - このクラブができたのは**1919年10月17日**。ほかより遅い生まれです。
      - 理由があります。**この街には、すでに別のクラブがありました。**
      - リーズ・シティです。そのクラブが、リーグから**強制的に解散させられました。**
      - 第一次世界大戦中に、選手へ不正な支払いをしていたという疑いでした。
      - 街からクラブが消えた。その代わりに作られたのが、いまのクラブです。
      - 愛称は「ホワイツ」。真っ白なユニフォームからで、この色にしたのは1961年です。
      - 本拠地はエランド・ロード。収容は3万7633人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.

  - id: revie
    heading: 強かった時代
    tier: 背景
    telop: ドン・レヴィーの13年。無敗34試合
    narrator: キャスター
    card:
      type: table
      title: レヴィー時代のタイトル
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "2回"]
        - ["FAカップ／リーグカップ", "各1回"]
        - ["インターシティーズ・フェアーズカップ", "2回"]
        - ["1968-69年", "無敗34試合の記録"]
    say:
      - このクラブがいちばん強かったのは、ドン・レヴィーが率いた時代です。
      - 1961年から1974年まで、13年。
      - リーグ優勝2回、FAカップ、リーグカップ、そしてフェアーズカップを2回。
      - 1968年から69年にかけては、**34試合続けて負けませんでした。**
      - その記録は、翌シーズンにまたがっています。
      - リーグ優勝はもう1度あります。1991年から92年。
      - "**プレミアリーグが始まる前の、最後の1部優勝**でした。クラブとして3度目です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.

  - id: fall
    heading: 3部まで落ちた
    tier: 背景
    telop: 2007年に経営破綻。クラブ史上はじめての3部
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["2003-04年", "1部から降格"]
        - ["2007年", "経営破綻。3部へ"]
        - ["2020年7月17日", "16年ぶりに1部復帰"]
        - ["2024-25年", "2部優勝（カーディフに7-0）"]
    say:
      - 2003年から04年、リーズは1部から落ちます。
      - お金の問題が続き、2007年には経営が行き詰まりました。
      - 行き着いた先は**3部**。クラブの歴史ではじめてのことでした。
      - 戻ってくるまでに**16年**かかっています。
      - 1部復帰は2020年7月17日でした。
      - 昨季、2024年から25年には2部を優勝しています。
      - エランド・ロードでのカーディフ・シティ戦は**7対0**。語り継がれる勝ち方でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.

  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はダニエル・ファルケ
    narrator: キャスター
    say:
      - 監督はダニエル・ファルケです。
      - 日本人選手については、**2026年9月2日時点の一覧に名前がありません。**
      - そのあとに動いている可能性はあるので、いないとは言い切りません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
