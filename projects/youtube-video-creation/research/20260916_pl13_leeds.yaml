# プレミアリーグ20クラブ紹介 ⑬リーズ・ユナイテッド（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「前のクラブが解散させられて、その代わりに作られた」**。
# ここが山場（@main）。
#
# **日本人選手は「一覧に載っていない」と書く。**Wikipedia の一覧は
# 2026年9月2日時点。**いない、と断定しない**（移籍の可能性がある）
#
# **2026-09-18 ユーザー指示で書き直した。**「アルファベット順では13番目」を消して
# 後半だけ残し、各節の1行目をその節でいちばん引きの強い事実に入れ替えた。
# 優勝の節は「獲ったやつだけ」にし、「数えると7個」「34年、何も獲っていません」を落とした。
#
# **2026-09-18 ユーザー指示（もっと興味を引く形に）で、さらに直した。**
#   ・タイトルとサムネを「丸数字＋クラブ名＋引き」に変え、**田中碧を頭に出した**
#   ・**今季の顔ぶれ（田中碧）**の節を、宿敵より前へ移した
#   ・**宿敵（rival）**と**このクラブを語る3人（legends）**の節を足した。
#     マンチェスター・ユナイテッドの2行は `fall` の末尾にあったので、そちらから外して rival へ寄せた
#
# **2026-09-19 ユーザー指示（クラブの歴史はもう少しシンプルに）で、歴史の節を整理した。**
# 「強かった時代」（レヴィー時代のタイトル・34試合無敗・1991-92の1部優勝）と
# 「3部まで落ちた」（Doing a Leeds・2007年の経営破綻・2020年の1部復帰・2024-25の2部優勝）を丸ごと落とし、
# 「前のクラブは、解散させられた」からも重複4行（ピーコックス・1967年の57,892人など）を落とした。
# **田中碧の行は残している。**
