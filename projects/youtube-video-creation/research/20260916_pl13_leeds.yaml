    say:
      - このクラブには、**田中碧**がいます。
      - 監督はダニエル・ファルケ。
      - 主将はイーサン・アンパドゥ。ウェールズ代表の中盤です。
      - エースはドミニク・カルヴァート＝ルーウィン。イングランド人のフォワードです。
      - 昨季はリーグで14点。今季もチームの最多得点で、**2年続けての看板**です。
    official: false
