      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1919年10月17日"]
        - ["理由", "リーズ・シティが強制的に解散"]
        - ["同じ日", "リーズ・シティの選手16人が競売に"]
    # 2026-09-22 流れの点検2回目: 頭の「前のクラブが消された街の、代わりのクラブです」は
    # 答えを先に言ってから「理由があります」と振り直す形だったので落とした（節の末尾と
    # サムネで足りる）。「消えたほうには、続きがあります」も中身の無い振りなので落とした
    say:
      # 2026-09-22: 節の1行目に実写を1枚（選手16人の競売が行われたメトロポール・ホテル。Commons CC BY-SA 2.0）
      - {text: "ほかより遅い生まれには、理由があります。", image: assets/images/pl_leeds_story/01.jpg}
      - "**この街には、すでに別のクラブがありました。**リーズ・シティです。"
      - そのクラブが、リーグから**強制的に解散させられました。**
      - 第一次世界大戦中に、選手へ不正な支払いをしていたという疑いでした。
      - "1919年**10月17日**、リーズのホテルで選手16人が競売にかけられました。"
      - 9つのクラブが、合わせて9250ポンドで買っていきました。
      - 同じ日、集まったサポーターが新しいクラブを作ると決めます。それがリーズ・ユナイテッドです。
    official: false
