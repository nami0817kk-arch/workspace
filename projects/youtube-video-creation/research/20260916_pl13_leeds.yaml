sections:
  - id: birth
    heading: 前のクラブは、解散させられた
    main: true
    tier: 背景
    telop: 1919年、リーズ・シティの代わりに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1919年10月17日"]
        - ["理由", "リーズ・シティが強制的に解散"]
        - ["愛称", "The Whites（ホワイツ）"]
        - ["本拠地", "エランド・ロード／37,633人"]
    say:
      - "**前のクラブが消された街の、代わりのクラブ**です。"
      - このクラブができたのは**1919年10月17日**。ほかより遅い生まれです。
      - 理由があります。**この街には、すでに別のクラブがありました。**
      - リーズ・シティです。そのクラブが、リーグから**強制的に解散させられました。**
      - 第一次世界大戦中に、選手へ不正な支払いをしていたという疑いでした。
      - 街からクラブが消えた。その代わりに作られたのが、いまのクラブです。
      - 消えたほうには、続きがあります。
      - "1919年10月17日、リーズのホテルで**選手16人が競売にかけられました。**"
      - 9つのクラブが、合わせて9250ポンドで買っていきました。
      - そして同じ日付で、いまのクラブができています。
      - 愛称は「ホワイツ」。真っ白なユニフォームからです。
      - この色にしたのはドン・レヴィー監督で、**レアル・マドリードに倣った**ものでした。
      - それまでの愛称は「**ピーコックス**」、孔雀です。エランド・ロードの昔の名前から来ていました。
      - 本拠地はエランド・ロード。いまの収容は3万7633人です。
      - ただし1967年には、同じ場所に**5万7892人**が入ったことがあります。いまより2万人多い時代でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
      - https://en.wikipedia.org/wiki/Leeds_City_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: このクラブには田中碧がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ダニエル・ファルケ"]
        - ["主将", "イーサン・アンパドゥ（MF・ウェールズ）"]
        - ["エース", "カルヴァート＝ルーウィン（FW・イングランド）"]
        - ["昨季", "リーグ14点・全15点で得点王"]
        - ["日本人選手", "田中碧（背番号22）"]
    say:
      - このクラブには、**田中碧**がいます。
      - 監督はダニエル・ファルケ。
      - 主将はイーサン・アンパドゥ。ウェールズ代表の中盤です。
      - エースはドミニク・カルヴァート＝ルーウィン。イングランド人のフォワードです。
      - 昨季はリーグで14点。今季もチームの最多得点で、**2年続けての看板**です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 薔薇戦争までさかのぼるマンチェスター・ユナイテッド戦
    narrator: 解説
    card:
      type: table
      title: ローゼズ・ライバルリー
      columns: ["", ""]
      rows:
        - ["相手", "マンチェスター・ユナイテッド"]
        - ["呼び名", "ローゼズ・ライバルリー（薔薇戦争ダービー）"]
        - ["1977年", "FAカップ準決勝「バトル・オブ・ザ・ローゼズ」"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - 宿敵は**マンチェスター・ユナイテッド**です。
      - 呼び名は**ローゼズ・ライバルリー**。日本語なら薔薇戦争ダービーになります。
      - 対立の根は、ヨークシャーとランカシャーの争い。**15世紀の薔薇戦争**までさかのぼるとされています。
      - リーズの白はヨークの白薔薇、相手の赤はランカスターの赤薔薇にあたります。
      - 語り草は**1977年のFAカップ準決勝**。「バトル・オブ・ザ・ローゼズ」と呼ばれた一戦です。
      - 試合の前後、スタジアムの外でサポーター同士の激しい衝突が起きました。
      - その相手は、**今季もプレミアリーグにいます。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.%E2%80%93Manchester_United_F.C._rivalry
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 762試合のチャールトン、銅像になったブレムナー
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ジャック・チャールトン", "公式戦762試合（クラブ最多出場）"]
        - ["ビリー・ブレムナー", "リーグ587試合91得点"]
        - ["ピーター・ロリマー", "公式戦238得点（クラブ最多得点）"]
    say:
      - いちばん多く出たのは**ジャック・チャールトン**。1950年から1973年までの23年です。
      - リーグ629試合70得点、公式戦では762試合。ひとつのクラブだけで積んだ数字です。
      - 次に**ビリー・ブレムナー**。1959年から1976年で、リーグ587試合91得点。
      - 1965年10月から主将を務め、2006年にはクラブ史上最高の選手に選ばれました。
      - いまエランド・ロードには、この人の**銅像**が立っています。
      - 3人目は**ピーター・ロリマー**。2期に分かれて在籍し、公式戦238得点。
      - クラブの最多得点者です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Jack_Charlton
      - https://en.wikipedia.org/wiki/Billy_Bremner
      - https://en.wikipedia.org/wiki/Peter_Lorimer
  - id: revie
    heading: 強かった時代
    tier: 背景
    telop: 1968年から69年、34試合続けて負けなかった
    narrator: キャスター
    card:
      type: table
      title: レヴィー時代のタイトル
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "2回"]
        - ["FAカップ／リーグカップ", "各1回"]
        - ["インターシティーズ・フェアーズカップ", "2回"]
        - ["1968-69年", "無敗34試合の記録"]
    say:
      - 1968年から69年にかけて、**34試合続けて負けませんでした。**
      - いちばん強かったのは、ドン・レヴィーが率いた時代です。1961年から1974年まで、13年。
      - リーグ優勝2回、FAカップ、リーグカップ、そしてフェアーズカップを2回。
      - リーグ優勝はもう1度あります。1991年から92年。
      - "**プレミアリーグが始まる前の、最後の1部優勝**でした。クラブとして3度目です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
  - id: fall
    heading: 3部まで落ちた
    tier: 背景
    telop: 落ち方に名前が付いた。「Doing a Leeds」
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["2003-04年", "1部から降格"]
        - ["2007年", "経営破綻。3部へ"]
        - ["2020年7月17日", "16年ぶりに1部復帰"]
        - ["2024-25年", "2部優勝（カーディフに7-0）"]
    say:
      - "このクラブの落ち方には、英語で名前が付いています。「**Doing a Leeds**」。"
      - "**使いすぎて自分でつぶれること**を指す言い方です。"
      - 2003年から04年、リーズは1部から落ちます。
      - お金の問題が続き、2007年には経営が行き詰まりました。
      - 行き着いた先は**3部**。クラブの歴史ではじめてのことでした。
      - 戻ってくるまでに**16年**かかっています。
      - 昨季、2024年から25年には2部を優勝しています。
      - エランド・ロードでのカーディフ・シティ戦は**7対0**。語り継がれる勝ち方でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.
      - https://en.wikipedia.org/wiki/Doing_a_Leeds
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 田中碧にとって、今季がプレミアリーグ1年目
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "3回（直近 1991-92）"]
        - ["FAカップ", "1回（1971-72）"]
        - ["リーグカップ", "1回（1967-68）"]
        - ["フェアーズカップ", "2回（1967-68／1970-71）"]
    say:
      - 田中碧にとって、今季が**プレミアリーグ1年目**になります。
      - 獲ってきたのは1部優勝3回に、FAカップ1回、リーグカップ1回。それにフェアーズカップが2回です。
      - 1部優勝の直近は**1991年から92年**でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
