  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 薔薇戦争までさかのぼるマンチェスター・ユナイテッド戦
    narrator: 解説
    card:
      type: table
      title: ローゼズ・ライバルリー
      columns: ["", ""]
      rows:
        - ["相手", "マンチェスター・ユナイテッド"]
        - ["呼び名", "ローゼズ・ライバルリー（薔薇戦争ダービー）"]
        - ["1977年", "FAカップ準決勝「バトル・オブ・ザ・ローゼズ」"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - 宿敵は**マンチェスター・ユナイテッド**です。
      - 呼び名は**ローゼズ・ライバルリー**。日本語なら薔薇戦争ダービーになります。
      - 対立の根は、ヨークシャーとランカシャーの争い。**15世紀の薔薇戦争**までさかのぼるとされています。
      - リーズの白はヨークの白薔薇、相手の赤はランカスターの赤薔薇にあたります。
      - 語り草は**1977年のFAカップ準決勝**。「バトル・オブ・ザ・ローゼズ」と呼ばれた一戦です。
      - 試合の前後、スタジアムの外でサポーター同士の激しい衝突が起きました。
      - その相手は、**今季もプレミアリーグにいます。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Leeds_United_F.C.%E2%80%93Manchester_United_F.C._rivalry
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 762試合のチャールトン、銅像になったブレムナー
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ジャック・チャールトン", "公式戦762試合（クラブ最多出場）"]
        - ["ビリー・ブレムナー", "リーグ587試合91得点"]
        - ["ピーター・ロリマー", "公式戦238得点（クラブ最多得点）"]
    say:
      - いちばん多く出たのは**ジャック・チャールトン**。1950年から1973年までの23年です。
      - リーグ629試合70得点、公式戦では762試合。ひとつのクラブだけで積んだ数字です。
      - 次に**ビリー・ブレムナー**。1959年から1976年で、リーグ587試合91得点。
      - 1965年10月から主将を務め、2006年にはクラブ史上最高の選手に選ばれました。
      - いまエランド・ロードには、この人の**銅像**が立っています。
      - 3人目は**ピーター・ロリマー**。2期に分かれて在籍し、公式戦238得点。
      - クラブの最多得点者です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Jack_Charlton
      - https://en.wikipedia.org/wiki/Billy_Bremner
      - https://en.wikipedia.org/wiki/Peter_Lorimer
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 田中碧にとって、今季がプレミアリーグ1年目
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "3回（直近 1991-92）"]
        - ["FAカップ", "1回（1971-72）"]
        - ["リーグカップ", "1回（1967-68）"]
        - ["フェアーズカップ", "2回（1967-68／1970-71）"]
    say:
      - 田中碧にとって、今季が**プレミアリーグ1年目**になります。
      - 獲ってきたのは1部優勝3回に、FAカップ1回、リーグカップ1回。それにフェアーズカップが2回です。
      - 1部優勝の直近は**1991年から92年**でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
