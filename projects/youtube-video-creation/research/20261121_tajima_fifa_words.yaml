# 取材: 2026-11-21。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: ゲキサカ 2026-11-20（取材・文 竹内達也）「「FIFAの信頼回復をしたい」日本人初の会長選に臨む田嶋幸三氏が記者会見。難航した立候補手続き…」（全文） https://web.gekisaka.jp/news/japan/detail/?463483-463483-fl
# 出典で確かめたこと（ゲキサカ。字は変えない。台本は読点で行に分けた）:
#   ・20日、千葉市内で会見。立候補を正式に届け出たと明かした。選挙は来年3月18日、モロッコ・ラバトの FIFA 総会。立候補は田嶋氏・現職インファンティーノ氏・フランス協会（FFF）会長ディアロ氏の3人。
#   ・「FIFA会長に挑戦することは日本からはもちろん初めてで…FIFAを本当に良くしたい。」「FIFAが今のイメージをしっかりと払拭し、クリーンでフェアな団体としてもう一度立ち直る、そういうことを行いたい。そのためにはガバナンスの強化をしたい。意思決定をもっと違った形で、透明性のある中で行うことで、FIFAの信頼回復をしていきたい」（一続きの発言）
#   ・11/5 に JFA 理事会で推薦を受け立候補を表明。日本を含む5つ以上の協会・連盟のサポートレターが要った（11/6 の本で「5つ以上」は説明済み。今回は一言だけ）。「最後の最後まで大変だった」「揃わなかったら僕は今日、何を皆さんに伝えればいいんだろうというような、そういう気持ちも持ちながらギリギリまでやっていた」。推薦元は「複数の大陸連盟の（MAの）方から」とだけ述べ国名は明かさず。
#   ・「僕は大陸連盟からの推薦を得ていない。3候補の中では不利な立場にいると自覚している」。「今の時点で自分がウィズドロー（撤退）することは考えていない」。
#   ・現職の評価：「インファンティーノさんの手腕でインカムが相当増えたのも事実」「私自身も今年5月まではインファンティーノさんの会長続投に問題はないと思っていた」（→ 政治的に断定せず、本人の言葉どおり両面を出す。バログンの処分の話は記者の背景説明と本人の言及だが、題から離れるので使わない）。
#   ・締め：海外メディアが「もし田嶋幸三が会長になったら今までで一番目立たない会長になるのではないか」と表現した。「目立つべきは会長ではなく選手だと思っている」。
#   ・ゲキサカの地の文：ディアロ氏は UEFA の支援を受けている（記者の記述。本人の言葉ではない）。
# 他社の裏取り（2026-11-21 取得。本文を読んだ）: サンスポ 2026-11-20（立候補に5協会以上の推薦＝複数の大陸連盟の加盟協会から確保、17日に書類提出、FIFA が19日に受理を発表、2月18日までに正式承認、3/18 ラバト・211協会の投票、インファンティノ会長は4選を目指す）／スポニチ 11/20（UEFA が仏連盟会長を擁立、「今の時点で辞退は考えていません」＝ウィズドローの訳。撮影は同紙）／デイリー 11/21（「非常に不利な立場」と自覚、目立たなきゃいけないのは会長ではなく選手）／日経 11/20 見出し「複数大陸の協会から推薦」。→ 日付・3人・3/18・発言は複数社で一致。報道（複数社）。FIFA の公式発表は直接は読んでいない。
# 自分で数えたもの: 会見の20日から選挙の3月18日まで118日（11月10日＋12月31＋1月31＋2月28＋3月18）。表明（11/5）から書類提出（11/17）まで12日、FIFA の受理発表（11/19）まで14日。
