#   → 今回の初出: 正式な届け出・3人の選挙・推薦集めの難航の言葉・「不利」の自覚・「信頼回復」の言葉・「目立つべきは選手」。211協会・欧州55票の勘定と「5つ以上」の説明は繰り返さない（「推薦が揃った」だけ）。
