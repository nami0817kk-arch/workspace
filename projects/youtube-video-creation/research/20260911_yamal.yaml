sections:
  - id: what
    heading: 何が起きたか
    tier: 確定
    telop: バルサ史上最年少のキャプテン
    narrator: キャスター
    say:
      - ラミン・ヤマルが、バルセロナの歴史でいちばん若いキャプテンになりました。
      - 抜いたのは、ボヤン・クルキッチの記録です。
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2097851939761340571

  - id: flick
    heading: 監督は、この選手をどう見ているか
    tier: 確定
    telop: 「毎試合それが見える。特別なんだ」
    narrator: 解説
    say:
      - ここからが本題です。8日に発表されたバロンドールの候補30人に、ヤマルの名前があります。
      - 同じ日、フリック監督が本人について聞かれました。
      - {voice: フリック監督, text: ラミンは私の選手だ。バルセロナの選手だ}
      - {voice: フリック監督, text: 今年のバロンドールに値すると思う}
      - {voice: フリック監督, text: 並外れた選手だ}
      - {voice: フリック監督, text: 毎試合それが見える。彼は特別なんだ}
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2097944411514782062
      - https://x.com/FabrizioRomano/status/2097335777990410685

  - id: others
    heading: 別の名前を挙げた人もいる
    tier: 確定
    telop: 「クワラツヘリアも獲れる選手だ」
    narrator: 解説
    say:
      - ほかの監督や選手も、同じ日に口を開いています。
      - PSGのルイス・エンリケ監督が挙げたのは、自分の選手たちでした。
      - {voice: ルイス・エンリケ監督, text: クワラツヘリアは獲れる選手だ}
      - {voice: ルイス・エンリケ監督, text: ヴィティーニャも、ファビアンも、ウスマンも同じだ}
      - {voice: ルイス・エンリケ監督, text: ウスマン・バロンドールの歌が聞こえると}
      - {voice: ルイス・エンリケ監督, text: またもう1つ獲れるかもしれないと感じる}
      - ロドリは、答えをはっきり避けました。
      - {voice: ロドリ, text: バロンドールの議論には入りたくない}
      - {voice: ロドリ, text: 候補に挙がった選手たちは祝福すべきだ}
      - {voice: ロドリ, text: ただ、スペイン人であってほしいとは思う}
    official: true
    sources:
      - https://x.com/FabrizioRomano/status/2097948689465774567
      - https://x.com/FabrizioRomano/status/2097928305701687606

  - id: pitch
    heading: 腕章を巻いた試合で何をしたか
    tier: 報道
    telop: フェイエノールト戦で2得点
    narrator: 解説
    card:
      type: table
      title: CLリーグフェーズ第1節 バルセロナ 5-1 フェイエノールト
      columns: ["得点者", "本数"]
      rows:
        - ["ラミン・ヤマル", "2"]
        - ["ロペス／ラフィーニャ／ペドリ", "各1"]
    say:
      - 9日のCL初戦は5対1。2点を決めたのがヤマルです。
    official: false
    sources:
      - https://www.soccer-king.jp/news/photo/20260910/2203368.html
      - https://x.com/FabrizioRomano/status/2097851939761340571
