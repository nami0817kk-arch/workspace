# ヤマルがバルサ史上最年少キャプテン（2026年9月10日）。ユーザー指示「2.3.4もお願い」
#
# ロマーノの投稿が130万表示で、この日いちばん見られている。
# **同じ日のデコの回とはクラブが同じ**なので、topic を「ラミン・ヤマル」にして
# 枠がぶつからないようにした。中身も、デコの回は移籍の交渉、こちらは記録と評価で
# 重ならない。**デコのバロンドール発言はデコの回に置き、こちらには入れない**
#
# **敗れた監督のコメントは入れない。**同じ発言を 9/10 のバルサ回で読み上げている。
# 出典の数は増えるが、聞く人にとっては同じ話の繰り返しになる
#
# **年数は書かない。**「19年ぶり」と書きかけたが、ボヤンがいつ腕章を巻いたかは
# 出典に無い。**出典に無い数字は置かない**
#
# **反応は入れない。**読める形のスレが無かった
format: news
voice_min: 40
slot: other
date: "2026年9月10日"

# ハッシュタグに使う人の名前
people:
  - ラミン・ヤマル
  - ボヤン・クルキッチ
  - フリック
  - ハフィーニャ

short_title: "ヤマルが抜いたのは、誰の記録か"

theme:
  id: yamal_youngest_captain
  league: spain
  kind: other
  topic: ラミン・ヤマル
  title: ラミン・ヤマルがバルサの記録をまた1つ更新した。誰を抜いたのか
  hook: 腕章を巻いた最年少の選手になりました。
  question: ヤマルが抜いたのは、誰の記録か

thumbnail:
  line1: バルサ史上最年少キャプテン
  line2: 抜かれたのは ●●●●
  photo: "assets/photos/20260911_yamal/01.jpg"
  tags: [バルセロナ]
