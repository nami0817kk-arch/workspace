# 田中碧 の取材メモ（2026年10月21日・ショートだけ）
# 取材: 2026-10-21。requests（ブラウザUA）で原文を全部読んだ。控え: research/raw/20261021_leeds_farke_presser.txt ・ research/raw/20261021_qoly.txt
#   ・【一次】リーズ公式サイト 2026-10-17「Daniel Farke addresses 'favourites' tag and balancing act ahead of Manchester United clash」（英語。ファルケ監督の試合前会見の発言を全文載せている）
#     https://www.leedsunited.com/en/news/daniel-farke-addresses-favourites-tag-and-balancing-act-ahead-of-manchester-united-clash
#   ・Qoly 2026-10-17「愛のスパルタ指導！？田中碧から手袋を没収したとリーズ監督が明かす」（日本語。『Sky Sports』などを引く訳）。https://qoly.jp/q1/17870553
# 【題材の一覧の言葉を原文で引き直した点】
#   ・一覧は「Qoly（20日）」と書いていたが、Qoly の記事の日付は **10月17日**。会見も試合前（マンU戦は18日）。→ 台本は「マンU戦を前にした会見」とだけ言い、日付は言わない。
#   ・一覧の「ファルケ監督は『田中碧のように自分に対して厳しすぎる選手もいる。ここ数試合の彼は並外れている…』」は **Qoly の訳**。クラブの英語原文は
#     「Ao Tanaka was one example - always over critical with himself and sometimes he needs an arm round the shoulder … he was excellent in the last games and is in a top shape」。
#     この部分は **10/18 の田中碧のショート（会見の「自分に厳しすぎる」）が使っている**ので、今回は入れない。今回は手袋の発言だけ。
#   ・Qoly の訳には英語原文に無い文がある：「リーズでは、激しいデュエルやタックルが求められる」「彼が手袋をしてプレーすることはないと保証するよ！」。英語原文は
#     「Don't think we can do it so soft, we lead proper duels here. We are Leeds United and we are not overdoing things. I took the gloves, anyhow.」
#     → 台本は **クラブの英語原文から、こちらで訳した**（Qoly の訳は使わない）。「保証する」は言わない。
#   ・Qoly 末尾の「リーズの最近の平均気温は10度ほどのはず」は書き手の推測。使わない。
#   ・英語原文の「[Zion] Suzuki」の [Zion] は記事（クラブ公式）の書き手が補った語。監督の声に入っているかは分からない。→ 台本は監督の言葉を「鈴木」とだけ訳し、
#     「鈴木は、記事の補足によれば日本代表のゴールキーパー、鈴木彩艶のこと」と**別の行**で言う（監督の声に彩艶の名は入れない）。
#   ・原文 "Listen, you're not Suzuki or a goalkeeper or whatever." は、田中本人に言ったのか、会見で再現したのかは原文から分からない。→ 「会見でこう話した」とだけ言い、田中に言ったとは言わない。
#   ・原文 "we are not overdoing things" は意味が取りにくい（やり過ぎはしない／軟弱にやり過ぎない）。訳が割れるので **使わない**。
# 本人の言葉: 田中碧本人の言葉は、どの記事にも無い。手袋をしていた理由（寒がり・癖など）は会見では語られていない → 言えなかったこと。作らない。
# 反応: 探していない（0件。作らない）。
# 前の本との重なり: 10/17（2029年まで契約延長）・10/18（試合前の見立て。「自分に厳しすぎる」を使用）・10/19（マンU戦1-1）・10/20（地元紙の採点5点）。手袋の話はどれも使っていない
#   （10/18 の取材メモに「手袋の小話は題に関係が無いので使わない」とある）。同日の伊東純也の本とは、鈴木彩艶の名が出る点だけ共通（別の話）。
# 写真: 10/17〜10/20 に使ったリーズ公式の写真（アーセナル戦・エバートン戦・ブライトン戦・ニュージーランド戦・ベネズエラ戦など）は使い回さない。
#   今回は同じ試合前会見の記事と、18日のマンU戦のクラブ公式記事から取る。
