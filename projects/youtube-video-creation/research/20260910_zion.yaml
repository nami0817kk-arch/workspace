sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 日本人GK史上初のCL出場
    narrator: キャスター
    say:
      - アストン・ヴィラの鈴木彩艶が、チャンピオンズリーグのピッチに立ちました。
      - 現地時間8日、リーグフェーズ第1節のクラブ・ブルッヘ戦。敵地での試合に先発し、90分間ゴールを守っています。
      - チャンピオンズリーグでプレーした日本人ゴールキーパーは、これが史上初めてです。
      - 試合は3対2でアストン・ヴィラが勝利。プレミアリーグで開幕から3試合勝てていなかったチームの、今季初白星でした。
      - 鈴木は2失点しましたが、5セーブを記録。公式戦3試合連続の先発でもありました。
      - 英語版『マルカ』は、この90分をこう見出しに掲げています。
      - {voice: 英語版マルカ, text: 歴史を刻んだ90分}
      - {voice: 英語版マルカ, text: これ以上ないほど意義深いものとなった}
      - {voice: 英語版マルカ, text: 日本人として先駆者となっただけではない}
      - {voice: 英語版マルカ, text: 勝ち点3とともにスタートさせる勝利にも貢献した}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007661/
      - https://web.ultra-soccer.jp/news/all/35694/

  - id: numbers
    heading: 本題は、守った回数ではない
    tier: 報道
    telop: ロングボール15本、相手GKは5本
    narrator: 解説
    card:
      type: bars
      title: この試合のロングボール供給数
      items:
        - {label: "鈴木彩艶（アストン・ヴィラ）", value: 15}
        - {label: "ゾマー（クラブ・ブルッヘ）", value: 5}
      unit: 本
    say:
      - ここからが本題です。現地メディアが揃って書いたのは、セーブの数ではありませんでした。
      - この試合で鈴木が蹴ったロングボールは15本。
      - 相手のゴールキーパー、ヤン・ゾマーは5本でした。3倍の差です。
      - 蹴って逃げるのではなく、攻撃の起点として意図を持って散らしていた、と評価されています。
      - 序盤にワン＝ビサカへ通した1本のパスが、この試合の最初の決定機になりました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007634/
      - https://www.footballchannel.jp/2026/09/09/post1007661/

  - id: rank
    heading: プレミアリーグ全体で見ると、どこにいるのか
    tier: 報道
    telop: 90分あたりの成功率でリーグ1位
    narrator: 解説
    card:
      type: table
      title: プレミアリーグのGK（データ会社ソファスコア）
      columns: ["項目", "1位", "2位"]
      rows:
        - ["90分あたりのロングボール成功率", "鈴木彩艶 56.52%", "アリソン（リヴァプール）"]
        - ["90分あたりの飛び出しの成功数", "鈴木彩艶", "ダビド・ラヤ（アーセナル）"]
    say:
      - この傾向は、この1試合だけの話ではありません。
      - データ会社ソファスコアによると、90分あたりのロングボール成功率は56.52%。
      - これはプレミアリーグの全ゴールキーパーの中で1位です。
      - そして2位にいるのが、リヴァプールのアリソンでした。
      - もう1つ、90分あたりの飛び出しの成功数でもリーグ1位に立っています。
      - こちらの2位は、アーセナルのダビド・ラヤです。
      - つまり鈴木は、プレミアリーグを代表する2人の上に立っている、ということになります。
      - 24歳になったばかりで、プレミアリーグはまだ2節、CLは1試合を終えたところです。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007634/
      - https://web.ultra-soccer.jp/news/all/35694/

  - id: voices
    heading: 現地はどう見たか
    tier: 報道
    telop: 「今回も配球が並外れていた」
    narrator: 解説
    say:
      - 現地メディア『アストン・ヴィラ・レビュー』は、チーム最高タイとなる8点をつけました。
      - {voice: アストン・ヴィラ・レビュー, text: ヴィルヒリのシュートを賢く止めた}
      - {voice: アストン・ヴィラ・レビュー, text: 前半終盤にも別のシュートをパンチングで処理した}
      - {voice: アストン・ヴィラ・レビュー, text: 配球は距離感・精度ともに素晴らしかった}
      - 地元の『バーミンガム・ライブ』は6点。
      - {voice: バーミンガム・ライブ, text: 多くのクロスをキャッチした}
      - {voice: バーミンガム・ライブ, text: 今回も配球が並外れていた}
      - 試合のあと、ウナイ・エメリ監督はこう話しています。
      - {voice: エメリ監督, text: 今日はまた一歩前進した}
      - {voice: エメリ監督, text: 懸命に努力し続けること、それしか道はない}
      - {voice: エメリ監督, text: 苦しい時間帯にも粘り強く戦い抜くことができた}
      - {voice: エメリ監督, text: 90分間を通じてしっかりと競い合えた}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260909/2202754.html
      - https://web.ultra-soccer.jp/news/all/35694/
