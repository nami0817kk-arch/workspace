# 鈴木彩艶がプレミアのGKで1位（2026年9月10日）。
#
# **検索の実測で、来ている言葉の上位はほぼ日本人選手名**（中村敬斗44 / 久保建英21 /
# 鎌田大地17 / 上田綺世13 / 鈴木彩艶5）。参考4チャンネルでも鈴木彩艶が最大の題材で、
# サッカー知恵袋は 79万 / 48万 / 29万 / 26万回を出している。
#
# 引きは**「2位が誰か」**。1位が日本人GKという事実より、
# 2位にアリソンとラヤが並ぶことのほうが効く。
#
# **反応は入れない。**読める形のスレが無かった
format: news
# 現地紙の採点と監督の言葉が主役の回。数字の説明が要るので、
# 他人の声の割合は下げる。**足りないぶんを作文で埋めない**
voice_min: 20
