      source: Goal・ESPN・Wikipedia
      highlight_row: 0
  - text: その理由を、本人が語っています。
    card: none
  - voice: ロナウド
    text: 体は、60%の状態だった。だから、頭を剃った。
    card: none
  - voice: ロナウド
    text: みんな、ひざの話ばかりしていたけど、
    cont: true
    card: none
  - voice: ロナウド
    text: この髪型で練習に行ったら、誰もひざの話をしなくなった。
    cont: true
    pause: 0.5
    card: none
  - text: 2つ目は、2003年4月23日。
    image: assets/images/20261021_ronaldo_r9_legend/r14_poverty_w.jpg
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
