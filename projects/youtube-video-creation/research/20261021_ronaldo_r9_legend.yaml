      source: Goal・ESPN・Wikipedia
      highlight_row: 0
  - text: 頭を剃って、前髪だけを残した、あの髪型。大会中、世界中の子どもが真似しました。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows:
      - - 2002年
        - 前髪だけを残した髪型。理由は、ひざの話をそらすこと
