# ロナウド（ブラジルの元FW。「フェノーメノ」＝R9。クリスティアーノ・ロナウドとは別人）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-21。見本は 10/20 のベッカム。
# 型は引退した選手向けの8節：①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（通算の表）⑤あの試合（2002-06-30 ワールドカップ決勝）⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Transfermarkt は不使用**。数字は基本の数（Wikipedia の通算表）と ESPN の試合記録、自分で割った・数えた値だけ。
# **引退後の私生活・法的な問題は入れない**（結婚・家族・体質や病名・訴訟・CBF会長選の経緯・事業の細部は不使用。1998年決勝前日の件は病気なので入れない。引退の理由に挙げた病名も言わない）。
# **取り違え防止**：台本の2行目で「ポルトガルのクリスティアーノ・ロナウドとは、別の選手です」と断る。題・サムネは「ロナウド」だけで、サムネの表と帯はブラジル代表・ロナウドの数字。
#
# **出どころ（本文を実際に読んだもの。requests と WebSearch の URL 探しのみ。ブラウザの道具は不使用）と確度**
# - ESPN（site.api.espn.com。試合記録の得点者・分）：2002-06-30 決勝 ブラジル2-0ドイツ（ロナウド67分・79分。79分はクレベルソンのアシスト）／2002年のロナウドの得点は トルコ（蔚山）50分・中国（西帰浦）55分・コスタリカ（水原）10分と13分・ベルギー（神戸）87分・トルコ準決勝（埼玉）49分・ドイツ決勝（横浜）67分と79分＝8点。イングランド戦（静岡）は無得点。
#   → 日本の会場の得点は 神戸1＋埼玉1＋横浜2＝4点、韓国の会場も4点（自分で数えた）。／2006-06-22 日本戦 ブラジル4-1（ロナウド前半の追加時間と81分）／2006-06-27 ガーナ戦 3-0（ロナウド5分＝通算15点目）／2003-04-23 マンチェスターU 4-3 レアル（ロナウド12・50・59分、67分交代。ベッカムは63分に途中出場して71・84分に得点。第1戦はレアル3-1）。→ 報道（統計の出どころ）。
# - FIFA.com（2002決勝の特集）：JSで描かれるため本文は取れず、WebSearch の抜粋（67分の得点の経緯：ハマンから奪う→リバウドのシュート→カーンがはじく→ロナウドが押し込む、決勝の2得点、大会得点王8点）を読んだだけ。→ 報道（抜粋のみ）。
# - Wikipedia（Ronaldo (Brazilian footballer)／2002 FIFA World Cup final／Miroslav Klose）：生年月日（1976-09-18）・通算表・受賞・2002年の経緯・髪型・2006年W杯・クラブ経営・クローゼの16点（2014年に更新）。→ 背景。
# - Fox News（AP配信 2011-02-14）：引退の記者会見（涙・34歳・「頭では続けたかったが、体に負けたと認めなければならない」「たくさんの負けがあったが、数えきれない勝利があった」）。→ 報道。
# - Goal.com（2002年の髪型の特集。本人のドキュメンタリー・The Sun 2017 の本人の言葉を引用）：「体は60%の状態だった。だから頭を剃った…誰もひざの話をしなくなった」。→ 報道。
# - Cruzeiro公式の記者会見（trivela.com.br 2024-04-29）：クルゼイロの売却。／Inside World Football（2025-05-27）：バリャドリードの売却をクラブが確認（51%・約3000万ユーロで2018年に取得）。→ 報道。
#
# **食い違い・不確かな点と台本での扱い**
# - 出身地：Wikipedia は Itaguaí（リオデジャネイロ州）生まれ、育ちはリオ市郊外のベント・リベイロ。→ 台本は「ブラジル・リオデジャネイロ州」「リオデジャネイロの郊外で育った」。
# - クルゼイロの数字：旧来は54試合54得点とされるが、いまの Wikipedia の表は47試合44得点。→ 表のとおり47試合44得点を使う（全大会）。
# - 2002年決勝の「最初のタッチでゴールの隅へ」：Wikipedia は「ボトムコーナー」。左右は資料で食い違うので言わない。
# - ワールドカップ通算の W杯優勝：Wikipedia・Fox は1994年（出場なし）を含めて2回優勝と書くが、台本は「2002年に優勝」とだけ言う。
# - 現在の肩書：2025年5月にバリャドリード売却を発表。2026年の立場は確かめられていない（台本は「2025年5月まで」で止める）。
#
# **自分で数えた比べ（⑧）**：1993〜97年（クルゼイロ47/44・PSV57/54・バルセロナ49/47）＝153試合145得点＝0.95点／1997〜2011年（インテル99/59・レアル177/104・ミラン20/9・コリンチャンス69/35）＝365試合207得点＝0.57点。
#   ブラジル代表 62÷98＝0.63点。ワールドカップ 15÷19＝0.79点（Wikipedia の19試合15得点と一致。1998年4・2002年8・2006年3）。インテル1999〜2002の3季＝24試合10得点。
#   クラブ通算 518試合352得点（表の合計と7クラブの足し算が一致）。サムネの「通算414点」＝クラブ352＋代表62。
# **日本語名・読みで怪しいもの**：クルゼイロ／PSV／コンポステーラ／インテル／ミラン／コリンチャンス／バリャドリード／リバウド／カーン／クレベルソン／ミュラー／クローゼ／フェノーメノ／オールド・トラッフォード／ハマン（台本では出さない）。
# 本人の言葉は2か所（自訳。原文は上の出典）。
