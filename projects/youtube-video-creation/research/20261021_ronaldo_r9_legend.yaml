      highlight_row: 1
  - text: チャンピオンズリーグ準々決勝、ユナイテッドの本拠地です。
    card: none
  - text: ロナウドは、12分、50分、59分と、3得点。ハットトリックです。
    emph: true
    card: none
  - text: 67分、交代でベンチへ。スタジアムは、相手ファンも含めて、総立ちで見送りました。
    card: none
  - text: 試合は3対4で負け。でも、第1戦が3対1でした。
    card: none
  - text: 合計6対5で、レアルが準決勝へ進みました。
    card: none
