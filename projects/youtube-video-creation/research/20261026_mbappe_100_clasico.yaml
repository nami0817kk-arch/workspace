# 取材メモ（2026年10月26日）ムバッペがレアル通算100点目。87分の決勝点でクラシコ2対1（ショートだけ・見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-26 朝。ESPN「Kylian Mbappé scores 100th goal for Real Madrid in dramatic Clásico win」（2026-10-25 22:14Z）の本文を
#   ESPN の記事API（now.core.api.espn.com/v1/sports/news/50246032）で全部読んだ。控え research/raw/20261026_mbappe100_espn.txt・_api.json。
#   本文: 87分、カマヴィンガの落としを無人のゴールへ流し込んだのが100点目。1点目は前半、ジェラール・マルティンのクリアが
#   ムバッペに当たり（hit straight at）、ジョアン・ガルシアを破った。後半ラフィーニャが同点。レアルは首位バルサと3差、バルサは今季リーグ初黒星。
#   バロンドールの授賞式は翌日。レアルで100点に届いたのは24人目、4番目の速さ（ディ・ステファノ、ラウール、C・ロナウドらと並ぶ。
#   最多はロナウドの438試合450点）。2024年6月に移籍金なしで加入、それまでパリSGで308試合256点、モナコで60試合27点。27歳。
#   この夏、フランス代表の歴代最多得点者、W杯の歴代最多得点者に。
# 試合の記録: ESPN の試合記録（site.api.espn.com の esp.1 summary?event=401882832、控え research/raw/20261026_clasico_espn_summary.json）。
#   41分ムバッペ、61分ラフィーニャ（ペドリのアシスト・CKから）、87分ムバッペ（カマヴィンガのアシスト）。会場スポティファイ・カンプ・ノウ、観客62,055人。
#   ESPN の試合レポート（同 API の article）: 決勝点の起点はベリンガム。バルサはリーグ9戦全勝で来ていた。レアルは勝っても3位のまま。
# 資料のずれ（台本では言わない）:
#   ・ESPN 本文は「レアルでまだタイトルが無い」と書くが、レアル公式サイトに 2024 年の UEFA スーパーカップ・インターコンチネンタル杯の特集がある → タイトルの話はしない。
#   ・「4番目の速さ」で並ぶ3人が、より速い3人なのかは本文から読み切れない → 「100点の顔ぶれにディ・ステファノ、ラウール、ロナウド」とだけ言う。
#   ・レアルでの試合数は記事に無い → 言わない。
# 本人の言葉: 試合後のムバッペ・モウリーニョ監督の言葉の記事を探したが、10/26 朝（JST）の時点で見つからない
#   （Google ニュースの英・西・仏・日の検索で、試合後の発言を引いた記事が無かった。試合前の会見の言葉はあるが使わない）→ 型は X。
# バロンドール: 結果は出ていない。予想も断定もしない。「翌日に発表」だけ言う。
# 前の本との重なり: 10/22 ballondor_three（バロンドールの条件）、10/23 mbappe_never_satisfied（「満足しない」）、10/24 yamal_mbappe_clasico_numbers
#   （クラシコ前の12試合の数字・メッシ26点）、10/24 ballondor_eve_words、10/24 team_france。100点目・試合の結果は未扱い。言い回し・写真は重ねていない。
# 確度: 得点の分・アシストは確定（ESPN の試合記録）。100点・24人目・4番目の速さ・クラブ別の得点は報道（ESPN）。見立ては背景。
# 反応: 作らない（0件）。approve は --no-voices。
# 写真: Commons の CC BY-SA 4.0（Bryan Berlin）。2026年W杯のフランス代表の試合。今日の試合の写真は代理店（AFP/Getty）しか無いので使わない。
#   10/16〜10/24 に使った File は避けた（credits.json を横断で確認）。01＝スウェーデン戦（主将の腕章）、02＝セネガル戦、03＝スウェーデン戦の得点後、
#   04＝ノルウェー戦の試合前（上着姿）、05＝スウェーデン戦の得点後。レアルの姿の写真は Commons に小さいもの（500px前後）しか無く外した。
