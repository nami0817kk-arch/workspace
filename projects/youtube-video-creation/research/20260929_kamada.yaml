    tier: 報道
    telop: 「これから彼らが日本を背負っていく選手たちだと思うので」
    narrator: キャスター
    say:
      - text: ベネズエラに2対1で勝った9月28日。前半だけ出て腕章を巻いた鎌田大地が、若手についてこう。
        short_only: true
      - text: 一緒に前半を戦った、経験の少ない選手たちについては。
        image: assets/images/20260929_kamada/01.jpg
      - voice: 鎌田大地
        text: すごく勢いを持ってやってくれていましたし、
      - voice: 鎌田大地
        text: 良いプレーもたくさんありました。
        cont: true
      - voice: 鎌田大地
        text: これから彼らが日本を背負っていく選手たちだと思うので、
        cont: true
      - voice: 鎌田大地
        text: これからもどんどん成長していって欲しいです
        cont: true
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260928/2210565.html
      - https://hochi.news/articles/20260928-OHT1T51366.html
