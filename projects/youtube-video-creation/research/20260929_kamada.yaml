    narrator: 解説
    say:
      - text: 今回の代表活動の主将は堂安律。この試合だけ鎌田が腕章を巻き、前半の若手と一緒に戦いました。
        image: assets/images/20260929_kamada/01.jpg
      - 若手の前半を「良いプレーもたくさんあった」と言えるのは、共に戦った人だけ。
      - 次は10月1日のエクアドル戦と、5日のこの活動4試合目。前半の11人から誰が残るかを見ます。
    sources:
