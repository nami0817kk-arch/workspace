    say:
      - text: 9月28日の広島。ベネズエラ戦を2対1で勝った日本代表。
        image: assets/images/20260929_kamada/01.jpg
      - 先発は、4日前のウルグアイ戦から10人を入れ替え。
      - 日本代表のトップチーム、A代表のデビューが4人。
      - その先発11人で腕章を巻いたのが、クリスタル・パレスの鎌田大地。主将の印です。
      - 出たのは前半の45分だけ。無失点で折り返し、後半は主力に託しました。
      - 試合後、鎌田はその前半をこう振り返っています。
      - voice: 鎌田大地
        text: 難しい時間帯もあると思ってたんですけど、
      - voice: 鎌田大地
        text: 前半最後失点しそうなシーンでも耐えることができて、
        cont: true
      - voice: 鎌田大地
        text: ゼロで終われたので良かったです
        cont: true
    sources:
