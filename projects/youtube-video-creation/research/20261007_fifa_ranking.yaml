# 試合ごとの増減は FIFA の API（TeamAPointsBefore/TeamAPoints）。計算式は FIFA の説明 PDF。11月の見込みは自分の計算（相手の点は 10/7 の公式。2連勝は11/14→11/17の順に計算）。
# 日本の試合の結果は JFA の日程と結果。10/5 の回（堂安・上田・NZ紹介）と重ねないため、決勝の得点者・内容は言わない。NZ は順位と点だけ。
# 女子のランキングは扱わない。他人の声は国際サッカー連盟の説明1件と、ネットの反応2件（Yahoo!ニュースのフットボールチャンネルの記事のコメント欄、個人の投稿を全文）。
