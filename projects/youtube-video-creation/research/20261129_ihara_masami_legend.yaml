# 井原正巳（元日本代表 DF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-29。型は 11/25 の名波浩と同じ6節（「あの1年」＝1997年のワールドカップ最終予選、「見立て」＝代表の試合が集まった年）。
# **情報の時点は 2026-11-21。**年齢は出さない。引退後の仕事（監督・コーチ・解説）は言わない。私生活・女子サッカーは入れない。
# 題材を選んだ理由：引退した日本人の大物。「アジアの壁」、日本代表122試合（遠藤保仁に抜かれるまで歴代1位）、1998年W杯の主将。既出の国内レジェンド（scripts/*_legend.md 25人）・posted.json・covered.yaml・picks に無い。同じ日（11/29）の別シリーズ（ロドリ・クルトワ×アリソン・PSG のスタジアム・アヤックスのユニフォーム）に出ない。11/27 の釜本邦茂とも重ならない。
# 引退の確認：日本語版 Wikipedia「井原正巳」（2002年のJ1最終節・横浜F・マリノス戦に先発フル出場したのを最後に引退。引退試合は2004-01-04 国立。出典は Jリーグデータサイトと浦和レッズ公式）。2025-12 に水原三星のコーチを退任しているが、指導者の話は台本に入れない。
# 数字の出どころ：日本語版 Wikipedia「井原正巳」（raw の wikitext を読んだ）。
# - クラブ：日産 JSL 44試合2点（1990-91 22-2、91-92 22-0）、横浜 J 223試合3点（93 32-0、94 41-1、95 47-1、96 29-1、97 22-0、98 27-0、99 25-0）、磐田 2000 20-1、浦和 2001 26-1・2002 28-0。J1 計 297試合5点（足して一致）。
# - 日本代表：122試合5点、全試合先発。年別 88 5、89 11、90 6、91 2、92 11、93 15-2、94 9-1、95 16-1、96 13、97 21-1、98 10、99 3（足して122-5）。1997年以外＝101試合（11年）。
# - 1997年の21試合は出場一覧の89〜109番。最終予選8試合（9/7 ウズベキスタン 6-3、9/19 UAE 0-0、9/28 韓国 1-2、10/4 カザフスタン 1-1、10/11 ウズベキスタン 1-1、11/1 韓国 2-0、11/8 カザフスタン 5-1、11/16 イラン 3-2 延長）すべてに出場。監督は10/11 から岡田武史（一覧の監督欄）。カザフスタン戦（11/8）の点が代表で最後の点（samuraiblue の記録を出典に）。
# - 初出場 1988-01-27 UAE戦。1990/91 日本リーグ新人賞。1993-97 Jリーグベストイレブン5回。1995年から代表主将（加茂周監督が指名）。1995年のチャンピオンシップ第2戦で決勝点。1998年W杯は大会直前に負傷しながら主将として3試合すべてに先発フル出場。
# - 最後のゴール：2001-05-19 ガンバ大阪戦。
# 本人の言葉は取れていない（Wikipedia の範囲で引用に足る言葉が無い）。台本は本人の言葉なしで組んだ。
