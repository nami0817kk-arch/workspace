  say:
  - text: 1998年、フランスのワールドカップ。
    image: assets/backgrounds/cut_日本.png
    card: none
  - text: 井原正巳は大会の直前にけがをしましたが、キャプテンとして、3試合とも先発しました。
    image: assets/images/20261129_ihara_masami_legend/01_r.jpg
    card: none
  - text: アルゼンチンとクロアチアに0対1、ジャマイカに1対2。日本は3試合とも負けました。
    card: none
  - text: 1999年7月のコパ・アメリカ。ボリビア戦が、代表での最後の試合になりました。
    card: none
  - text: クラブでは、2000年にマリノスを離れて磐田へ。20試合で1点です。
    image: assets/images/20261129_ihara_masami_legend/02_r.jpg
    card: {<<: *aftercard, highlight_row: 2}
  - text: 2001年、浦和へ。5月19日のガンバ大阪戦の点が、現役で最後のゴールでした。
    card: {<<: *aftercard, highlight_row: 3}
  - text: 2002年、J1の最終節で、古巣の横浜F・マリノスと戦います。
    card: {<<: *aftercard, highlight_row: 4}
  - text: この試合に先発で最後まで出て、現役を退きました。
    card: {<<: *aftercard, highlight_row: 4}
    emph: true
  - text: 2004年1月4日、国立競技場で引退試合。井原正巳はゴールを決めました。
