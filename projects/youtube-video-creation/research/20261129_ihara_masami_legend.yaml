  say:
  - text: 1997年、井原正巳は日本代表で21試合に出ます。キャリアで、いちばん多い年です。
    image: assets/images/20261129_ihara_masami_legend/01_r.jpg
    card: none
    emph: true
  - text: 9月から始まった最終予選。初戦は、ウズベキスタンに6対3で勝ちます。
    card: {<<: *qcard, highlight_row: 0}
  - text: しかし、アラブ首長国連邦とは0対0の引き分け。韓国には1対2で負けます。
    card: {<<: *qcard, highlight_row: 2}
  - text: 10月4日、カザフスタンとも1対1の引き分け。
    card: {<<: *qcard, highlight_row: 3}
  - text: この試合のあと、監督が加茂周から岡田武史に替わります。
    image: assets/backgrounds/cut_日本.png
    card: none
    emph: true
  - text: 10月11日、ウズベキスタン戦も引き分け。4試合、勝ちがありません。
    image: assets/images/20261129_ihara_masami_legend/01_r.jpg
    card: {<<: *qcard, highlight_row: 4}
  - text: 11月1日、ソウルで韓国に2対0で勝ちます。
    card: {<<: *qcard, highlight_row: 5}
  - text: 11月8日、ホームのカザフスタン戦。井原正巳が点を取り、5対1で勝ちます。
    card: {<<: *qcard, highlight_row: 6}
    emph: true
  - text: これが、井原正巳の代表での最後の点になりました。
    card: none
  - text: そして11月16日、ジョホールバル。アジアの第3代表を決める、イランとの試合です。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *qcard, highlight_row: 7}
  - text: 延長の末に3対2で勝ち、日本は初めて、ワールドカップの出場を決めました。
    image: assets/images/20261129_ihara_masami_legend/01_r.jpg
    card: {<<: *qcard, highlight_row: 7}
    emph: true
  - text: 井原正巳は、最終予選の8試合すべてに出ています。
    card: none
  quotes_from: []
  sources: *src
