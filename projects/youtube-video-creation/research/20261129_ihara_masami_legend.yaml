  say:
  - text: 井原正巳は1967年、滋賀県の生まれ。守りの真ん中、センターバックです。
    card: {<<: *datacard, highlight_row: 1}
  - text: クラブは、日産から続く横浜マリノスが中心。のちに磐田と浦和でもプレーしました。
    card: {<<: *datacard, highlight_row: 2}
  - text: J1では、1993年から5年続けて、ベストイレブンに入りました。
    card: {<<: *datacard, highlight_row: 3}
  - text: 日本代表には、筑波大学の2年生だった1988年から選ばれます。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *datacard, highlight_row: 4}
  - text: 1992年のアジアカップで、日本は初めてアジアの頂点に立ちました。
    image: assets/images/20261129_ihara_masami_legend/01_r.jpg
    card: {<<: *datacard, highlight_row: 5}
  quotes_from: []
  sources: *src
- id: road
  heading: フォワードだった井原正巳は、どうやって日本の守りの柱になったのか
  tier: 報道
  telop: 1988年、大学生で代表に
  card: &roadcard
    type: timeline
    title: 井原正巳の歩み
    rows:
    - - 1988年
      - 大学生で日本代表に初めて出る
    - - 1990年
      - 日産に入る。日本リーグの新人王
    - - 1993年
      - Jリーグが始まる。予選はドーハで敗退
    - - 1995年
      - 代表のキャプテンに。マリノスはJ1優勝
    highlight_row: 0
  say:
  - text: 井原正巳は、もともとフォワードでした。大学に入る前に、ディフェンダーへ移ります。
    image: assets/images/20261129_ihara_masami_legend/02_r.jpg
    card: none
  - text: 1988年1月27日、アラブ首長国連邦との試合で、日本代表に初めて出ます。
    card: {<<: *roadcard, highlight_row: 0}
  - text: 1990年、日産自動車に入ります。日本リーグでは、新人王に選ばれました。
    card: {<<: *roadcard, highlight_row: 1}
  - text: 1993年、Jリーグが始まります。
    card: {<<: *roadcard, highlight_row: 2}
  - text: この年の10月、カタールのドーハでワールドカップ予選のイラク戦。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *roadcard, highlight_row: 2}
    emph: true
  - text: 終わり間際に追いつかれ、ワールドカップを逃します。
    card: none
  - text: 1995年、日本代表のキャプテンを任されます。
    image: assets/images/20261129_ihara_masami_legend/02_r.jpg
    card: {<<: *roadcard, highlight_row: 3}
  - text: この年、マリノスはJ1で優勝します。
    card: none
  - text: 優勝を決める試合で、井原正巳はヘディングで決勝点を取りました。
    card: none
  quotes_from: []
  sources: *src
