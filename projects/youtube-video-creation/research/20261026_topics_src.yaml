  slot: 日本人
  head: 上田綺世は「国際Aマッチウィーク明けまでに戻れる」。リール監督が語った全治と、11月のブラジル戦
  why: 24日、モナコ戦の前の会見（ゲキサカ）。リールのダビデ・アンチェロッティ監督が、13日のアーセナル戦で左足底筋膜を断裂した上田について「少し特殊で複雑な怪我だ。医師の診察を受けて順調に回復している」。全治は3〜4週間の見込みで、来週初めに2週目を終える。「早ければいいが、最大で国際Aマッチウィーク明けには戻れるだろう」。日本代表は11月14日にブラジル、17日にパラグアイと対戦（シンガポール遠征）。間に合うかは不透明、1月のアジア杯には影響なさそう、と記事。上田はリールで公式戦6試合3得点。25日のモナコ戦は1-1（上田は欠場）。**条件：日本代表に当たる。言葉は監督のもの（上田本人の言葉はありません）**。確度：確定（会見）。写真：未確認（上田はリールの写真を前の本で使っているので使い回しに注意）。**弱い：10月中旬に「上田綺世のケガ、リール監督が語った。復帰時期を言えない理由」を作っている。今回は全治と時期が出た続報。森保監督の上田の話（10/25 の一覧3）は○が付かなかった**。時刻：9〜17時。見せ方：Y（監督の言葉）。
  src: ゲキサカ（アンチェロッティ監督の会見）
  url: https://web.gekisaka.jp/news/world/detail/?461747-461747-fl
