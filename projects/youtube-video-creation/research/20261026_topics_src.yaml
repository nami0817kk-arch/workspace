  slot: 日本人
  head: 鈴木唯人が先発、伊藤洋輝は86分から。コンパニのいないバイエルンにフライブルクは1-3
  why: 25日のブンデス第7節（ゲキサカの試合記録・ESPN）。フライブルクは鈴木唯人が先発、山本理仁が58分から、GKは長田澪。バイエルンは伊藤洋輝が86分から。ウパメカノ・ニャブリで0-2、82分にビショフのオウンゴールで1点差、90+5分にオリーズ。バイエルンはコンパニ監督が練習中に倒れて入院してから初の試合で、助監督のダンクスが指揮し首位に戻った。エベールは不在が「数日ではなく数週間」と（ESPN）。**条件：日本代表に当たる（鈴木唯人・伊藤）。本人の言葉はありません**。確度：確定。写真：未確認。**弱い：日本人が絡んだ場面が記録に無い。コンパニの入院は10/24 に作った**。時刻：9〜17時。見せ方：X。
  src: ゲキサカ（試合記録）、ESPN
  url: https://web.gekisaka.jp/news/world/detail/?461838-461838-fl
  fmt: news
  weak: true
