  slot: 日本人
  head: 水田海人のアシストで4-3まで。0-4からル・アーヴルが追い上げ、瀬古歩夢は先発
  why: 25日のリーグ・アン第8節マルセイユ4-3ル・アーヴル（ESPNの試合データ）。ル・アーヴルは55分までに0-4。77分のPK、86分のヘディングで2点差にし、89分にマヤが水田海人のクロスに頭で合わせて4-3。瀬古歩夢は先発（90+10分に警告）、中村草太は途中出場。**条件：代表・W杯は絡まない（瀬古は元代表）。本人の言葉はありません**。確度：結果は確定。日本語の試合記事はまだ出ていない。写真：未確認（水田は少ない恐れ）。**弱い：負け試合。出典は試合データのみ**。時刻：9〜17時。見せ方：X。
