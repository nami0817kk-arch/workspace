  head: 「実験室で作られた選手のようだ」。元イングランド代表ハーグリーブスが鈴木彩艶をそう呼んだ
  why: フットボールゾーン（26日）。マンC戦（2-1）の好守について、BBCで解説したオーウェン・ハーグリーブス氏「鈴木彩艶は実験室で作られた選手のようだ。素晴らしいサイズ、素晴らしい足元の技術を持った偉大なGKだ。優れたシュートストッパーであると同時に長い距離、短い距離どちらの配給も素晴らしい」。地元のVillaNEWSも「完璧な補強だ」。バーミンガム・ライブの採点は8（680767）。**条件：日本代表に当たる。言葉は解説者のもので、鈴木本人の言葉はありません**。確度：確定（発言は孫引き。BBCの元の映像は見ていません）。写真：未確認。**弱い：10/25 に鈴木の本を2本（6セーブ・キャッシュ）作った。同じ試合の3本目**。時刻：9〜17時。見せ方：X。
  src: フットボールゾーン（BBCの解説の紹介）
