  slot: 日本人
  head: 福井太智が今季初ゴール、地元紙はMOMと「満点のパフォーマンス」。ポルトガルで5位のアロウカ
  why: 24日のポルトガル1部第9節アルヴェルカ戦（フットボールゾーンがA BOLAを紹介）。前半6分に相手DFが退場。前半24分、福井はPA右寄りでパスを受け、逆サイドのポスト際へ突き刺した。前半8分には直接FKも。A BOLAはチーム最高タイの6点を付けMOMに選び「中盤の日本人選手による満点のパフォーマンス」「相手の退場で空いたスペースを利用して前線に近づき、守備の任務にとどまらなかった」。アロウカはリーグ2連勝。別記事（680844）では、10月11日の試合を中川勉・駐ポルトガル大使が観戦したとも。**条件：代表・W杯は絡まない。本人の言葉はありません**。確度：確定（試合）。写真：未確認（少ない恐れ）。**弱い：福井の知名度。出典は日本語1本（元はA BOLA）**。時刻：9〜17時。見せ方：X。
  src: フットボールゾーン（A BOLAの紹介）
  url: https://www.football-zone.net/archives/680812
  fmt: news
