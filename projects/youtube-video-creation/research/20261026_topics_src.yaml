  head: 町田浩樹が先発、ホッフェンハイムがレヴァークーゼンに3-0。前十字靭帯から戻った代表DFの完封
  why: 25日のブンデス第7節（ESPNの試合データ）。町田は先発し、ホッフェンハイムは0-0の79分にクラマリッチのPKで先制、89分にプラス、90+5分にメルシュテットで3-0。プラスは得点のあと「喜びすぎ」で2枚目の警告を受け退場（試合データの記載）。町田は昨年8月に左膝の前十字靭帯を断裂し、今季第3節で約1年ぶりに復帰。試合前の取材（フットボールゾーン、10/25 の一覧4）で「ブンデスリーガになるとリーグ戦のレベルが上がって、かなり疲労度が違う」「前から潰しに行くチームなので、機能しないとひっくり返されて長い距離を走らないといけない」と語っていた。**条件：日本代表に当たる。本人の言葉はあるが試合前のもの（この試合のあとの言葉は見つかっていません）**。確度：結果は確定。町田が何分まで出たか・採点は未確認（日本語の試合記事がまだ出ていない）。写真：未確認。**弱い：町田が絡んだ場面が試合データに無い。出典はESPNの試合データと前日のコラム**。時刻：9〜17時。見せ方：Y（試合前の言葉を使う場合）／X。
  src: ESPN（試合データ）、フットボールゾーン（試合前の取材）
