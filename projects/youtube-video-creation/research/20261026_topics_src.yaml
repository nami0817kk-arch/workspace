  slot: 日本人
  head: 坂元達裕の「伝家の宝刀」。プレミアで見せた切り返し、コベントリーは19位に
  why: 24日のPL第8節フルハム戦（フットボールゾーン）。坂元は右ワイドで2試合連続先発。前半34分、左足でクロスを上げる素振りから切り返して縦へ抜け、右足のクロスはクリアされた。後半41分に交代、0-1で負けてコベントリーは19位。ファンの声「ホンマうまい」「プレミアでも伝家の宝刀の切り返しが通用してる」「アジアカップ呼ばれるかな？」（記事が紹介した投稿。元の投稿は未確認）。**条件：代表は「呼ばれるかな」の声だけ。本人の言葉はありません**。確度：確定。写真：10/20 に坂元は1枚しか見つからず止めた。**弱い：出来事が小さい。反応の記事。写真が足りない恐れ**。時刻：9〜17時。見せ方：X。
  src: フットボールゾーン
  url: https://www.football-zone.net/archives/680801
  fmt: news
  weak: true
- num: 10
  slot: 海外
  head: エムバペがレアル通算100点目。87分の決勝点でクラシコ2-1、バロンドール発表の前日に
  why: 25日のラ・リーガ第10節、カンプ・ノウ（ESPN）。前半、ジェラール・マルティンのクリアがエムバペに当たり、そのままジョアン・ガルシアを破って先制。後半にハフィーニャが同点。87分、カマヴィンガの落としを空いたゴールに流し込み、これがレアルでの100点目。レアルで100点に届いたのは24人目、ディ・ステファノ、ラウール、C・ロナウド（438試合450点）らと並ぶ4番目の速さ。バルサは今季リーグ初黒星、レアルは勝ち点3差に。バロンドールの発表は翌日。エムバペはこの夏、フランス代表の歴代最多得点とW杯の歴代最多得点者になっている。レアルではまだタイトルが無い。**条件：W杯に当たる（W杯の歴代最多得点者）。本人の言葉はまだ取れていません（試合直後で、試合後の言葉の記事が出ていない）**。確度：確定。写真：多い。**弱い：エムバペは10/23・10/24 に作った（10/24 はクラシコ前のヤマルとの数字）。バロンドールの結果が出る前に出すなら答えを書かない**。時刻：18時以降。見せ方：X（試合後の言葉が出ればY）。
  src: ESPN
  url: https://www.espn.com/soccer/story/_/id/50246032
  fmt: news
  weak: false
- num: 11
  slot: 海外
  head: クルトワが試合直前にインフルエンザで欠場。代わりのルニンでレアルはカンプ・ノウを制した
  why: ESPN（25日）。レアルはクラシコの直前に「クルトワはインフルエンザのため直前で欠場」と短い声明。ゴールはルニン（27歳）、3人目のGKにボロシンを呼んだ。クルトワは代表ウィーク明けの好調の中心で、水曜のCLライプツィヒ戦（4-1）でも活躍。ヴィニシウスも国内4試合の出場停止中で不在。それでもレアルは2-1で勝った（題10）。**条件：代表・W杯は絡まない。言葉はクラブの声明だけ**。確度：確定。写真：多い。**弱い：題10と同じ試合。ルニンが何をしたかは記事に無い**。時刻：18時以降。見せ方：X。
  src: ESPN
  url: https://www.espn.com/soccer/story/_/id/50275230
  fmt: news
  weak: true
- num: 12
  slot: 海外
  head: キャリック「次に何があるか、本当に分からない」。マンUはボーンマスに0-3、主将ブルーノを外した日
  why: 25日のPL第8節（ESPN・BBC）。キャリックは水曜のコモ戦1-4のあと戦術を批判した主将ブルーノ・フェルナンデスを先発から外し、最後まで出さなかった。ラヤン、タヴァーニエ、エヴァニウソンに決められ0-3。PLは8試合で1勝、16位で首位と14差、8月30日から勝ちなし（BBC）。会見で「状況は完全に分かっている。何かを予想してはいない。いつも通り続けるし、ここが大好きだ」（ESPN）、Skyに「厳しい状況だ。隠れはしない。次に何があるか、本当に分からない」。試合後、ファンは拍手で送り出し、本人は「正直、あれは予想していなかった」。BBCの見出しは「別れの挨拶ではなかった」。**条件：本人（監督）の言葉に当たる。代表・W杯は絡まない**。確度：確定（解任は未定）。写真：多い。**弱い：10/22 にキャリックとブルーノ（コモ戦）を作った。10/26 のシリーズにブルーノ×ウーデゴールがある。解任が決まると話が変わる**。時刻：18時以降。見せ方：Y。
  src: ESPN、BBC
  url: https://www.espn.com/soccer/story/_/id/50278114
  fmt: quote
  weak: false
- num: 13
  slot: 海外
  head: マグワイア「個人として十分じゃない」。腕章を巻いた日、0-3のあとに選手たちを指した言葉
  why: BBCの取材（ESPN）。ブルーノ不在で主将を務めたマグワイア：「僕らは完全にマイケル（キャリック）の後ろにいる。彼は昨季チームに来てシーズンを立て直し、3位でCLに導いた」「個人として、十分なプレーができていない」「結果も内容も十分じゃない。一人ひとりが自分を見つめ、チームにもっと持ち込むものを見つけないと。全員だ」「まだいいシーズンにできる。でも何かがすぐ変わらないといけない」。**条件：本人の言葉に当たる。マグワイアはイングランド代表（W杯の話は無し）**。確度：確定。写真：多い。**弱い：題12と同じ試合。片方に絞るのを推奨**。時刻：18時以降。見せ方：Y。
  src: ESPN（BBCの取材）
  url: https://www.espn.com/soccer/story/_/id/50278421
