  slot: 日本人
  head: 田中碧の左足ミドルは止められた。リーズは最下位サンダーランドと0-0、4試合勝ちなし
  why: 25日のPL第8節（ゲキサカ）。田中は先発し後半44分まで。後半31分、パスをつないだ最後にPAのライン上で受け、反転しながら左足でゴール左隅を狙ったが、GKルーフスに止められた。中盤の底から広く守備をカバーし、敵陣まで顔を出した、と記事。リーズは4試合未勝利。サンダーランドは最下位のまま。**条件：日本代表に当たる。本人の言葉はありません**。確度：確定。写真：未確認。**弱い：出来事は「惜しいシュート1本」。田中碧は10/20〜22 に3本作っている。10/26 のシリーズにリーズのスタジアムの回がある（題は別）**。時刻：9〜17時。見せ方：X。
  src: ゲキサカ
