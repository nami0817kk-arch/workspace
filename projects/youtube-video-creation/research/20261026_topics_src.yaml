  head: 鎌田大地はフル出場。パレスはニューカッスルに0-2、ホームでブーイング。監督「クラブの中に雑音はない」
  why: 25日のPL第8節（ゲキサカ・BBC）。鎌田はボランチで先発しフル出場、冨安は負傷でメンバー外。後半2分にオスラ、13分にバーンズに決められ0-2。パレスはリーグ単独最多の17失点、2試合連続無得点、4試合勝ちなしで17位（BBCは「下から4つ」）。前節はブライトンに0-5。ホームの観客がブーイング。サージュ監督（就任4か月、3年契約）は会見で「クラブの中に雑音はない」「勝てていないのだからブーイングは普通だ」「中では解決策だけに集中している」（BBC）。**条件：日本代表に当たる（鎌田・冨安）。言葉は監督のもので、鎌田本人の言葉はありません**。確度：確定。写真：未確認。**弱い：パレスのブライトン戦0-5は作った（鎌田81分まで）。10/26 のシリーズにパレスのユニフォームの回がある。題20（サージュ）と同じ話なので片方に**。時刻：9〜17時。見せ方：X（鎌田が主語）。
  src: ゲキサカ（試合）、BBC（サージュ監督）
  url: https://web.gekisaka.jp/news/world/detail/?461833-461833-fl
