title: 10月26日のショート題材
lead: 日曜の欧州の結果と言葉を中心に約45件から21件（日本人9件・海外12件）。ショート10本ぶんを○で選んでください。
note: 今日は月曜（26日）、日本時間7時すぎの時点で集めました。日曜（25日）の主な結果は、<b>クラシコはバルサ1-2レアル（エムバペが87分に決勝点、レアル通算100点目。バルサは今季リーグ初黒星）</b>、マンU0-3ボーンマス（キャリックがブルーノを外した日）、リヴァプール2-0ブライトン、パレス0-2ニューカッスル（鎌田フル出場）、サンダーランド0-0リーズ（田中碧先発）、ハル1-1ブレントフォード（守田途中出場）、フライブルク1-3バイエルン（鈴木唯人先発・伊藤途中出場）、ホッフェンハイム3-0レヴァークーゼン（町田先発）、ソシエダ2-1レバンテ（久保は出番なし）、レッチェ0-2ユヴェントス（マッケニー）、アタランタ4-4フロジノーネ、モナコ1-1リール（上田は欠場中・南野はベンチ）、マルセイユ4-3ル・アーヴル（水田アシスト・瀬古先発）、PSV1-1フェイエノールト（佐野航大・渡辺剛先発）。今夜はPSG対リヨンと、バロンドールの発表。<br><br><b>日本人の題は9件（1〜9）、海外は12件（10〜21）、計21件です。</b>日本人で新しい出来事と言葉がそろったのは上田綺世（リール監督が全治と復帰時期を語った。11月のブラジル戦に絡む）だけで、ほかは「出た・惜しかった」が中心です。日本人の題で本人の言葉が取れたものはありません（町田は試合前の取材の言葉、上田・鎌田は監督の言葉）。弱い題で埋めないよう、日本人の題は1・4・2あたりまでを推奨します。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは、上田（ブラジル戦）・町田・田中碧・鎌田・鈴木彩艶・鈴木唯人と伊藤（日本代表）、エムバペ（W杯の歴代最多得点者）、マッケニー（W杯後の米国代表落選）です。本人（監督を含む）の言葉が取れたのは8件（1・2・4・12・13・14・16・20。1・4は監督、2は試合前の言葉）。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外。エムバペ（10）はバロンドールの発表の前に出すなら結果に触れない。<br><br><b>重なりの注意：</b>マンU対ボーンマスが2件（12・13）、リヴァプール対ブライトンが2件（14・15）、パレスが2件（4・20）、クラシコが2件（10・11）、ホッフェンハイムが2件（2・18）。同じ試合は1件に絞るのを推奨します。10/26 のシリーズ本編（アルテタ・ブルーノ×ウーデゴール・パレスのユニフォーム・リーズのスタジアム）と人物が重なるものは各行の「弱い」に書きました。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりのため<b>読めませんでした</b>。移籍の題は出していません。クラシコは試合直後で、試合後の監督・選手の言葉の記事がESPN・ゲキサカともまだ出ていませんでした（ESPNの速報と記録だけ）。ホッフェンハイム戦・ル・アーヴル戦は日本語の試合記事がまだ無く、ESPNの試合データだけ見ました。ESPN（記事API）・BBC・ゲキサカ・フットボールゾーンの本文は読みました。ガーディアンは見ていません。写真の件数（コモンズ）は時間の都合で調べておらず、各行「未確認」です。女子サッカー・Jリーグ・MLS・英2部・ベルギーは出していません。FotMobは使っていません。
