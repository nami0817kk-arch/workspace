# ハビエル・ザネッティ（元アルゼンチン代表DF、インテル一筋）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-14。型は 11/12 ラウールと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Javier Zanetti の成績表・本文・Honours・International goals、2010 UEFA Champions League final）、RSSSF「Kirin Cup 2003」、日本語版Wikipedia「キリンカップサッカー2003」（JFA の試合レポートを出典に持つ）と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**。引退後の役職（副会長など）は台本で言わない。
# **重なりの確認（2026-11-11）**：scripts/・research/covered.yaml・research/posted.json を「ザネッティ／Zanetti」で grep。主役の回は無し。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス・ルーニー・ブッフォン・ラウール）と重ならない。11/14 のクラブ紹介・代表・監督・財政の担当とも題材は別（research/20261112_picks.txt）。
# **引退の確認**：Wikipedia「On 29 April 2014, Inter chairman Erick Thohir announced that Zanetti would retire at the end of the 2013–14 season」「He retired after the last game of the season ... 18 May」。→ 選手としては現役ではない（53歳）。
# **日本との接点**：①1998年W杯の初戦、アルゼンチン 1-0 日本（Wikipedia「making his competitive debut in team's opening group match against Japan which finished in a 1–0 victory」。日付・会場は言わない）。②2003-06-08 キリンカップ、長居スタジアム（大阪）、日本1-4アルゼンチン。前半0-2。得点：サビオラ30分・ザネッティ45分・ロメオ78分・マキシ・ロドリゲス82分、日本は秋田55分（RSSSF と日本語版Wikipedia が一致。ザネッティは背番号8・キャプテンで先発（RSSSF の先発表）。**英語版Wikipedia の国際得点表は「70分・2-1」と書いていて食い違う**ので、RSSSF・JFA 由来の45分を使う）。観客42,508人。③2010-10 埼玉での日本戦に招集されたが直前のけがで辞退（Wikipedia）。日本が1-0で勝った試合だが結果は言わない（確かめていない）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：タジェレス 33試合1点、バンフィエルド 66試合4点、インテル 858試合21点（リーグ615・国内カップ71・欧州159・その他13）。Career total 957試合26点（33+66+858＝957、1+4+21＝26）。アルゼンチン代表 145試合5点。クラブと代表の合計 1102試合31点（自分で足した値：957+145、26+5。Wikipedia 冒頭の「1,115 official games」は五輪代表13試合を含む数字なので使わない）。サムネの表：インテル 858/21、ほかのクラブ 99/5（33+66、1+4）、アルゼンチン代表 145/5、合計 1102/31。
# - インテルのクラブ記録858試合、タイトル16個（うちキャプテンとして15）、2001年から主将、19シーズンの在籍、19人の監督（Wikipedia）。UEFAカップ1998が最初のタイトル。
# - 2010-05-22 CL決勝（マドリード、バイエルン戦 2-0、ミリート35分・70分）。ザネッティは主将で先発。インテルの欧州王者は1965年以来45年ぶり。先発にイタリア人は1人もいない。ザネッティのインテルでの700試合目。イタリアのクラブとして初の三冠、その主将（Wikipedia）。
# - 2011-05-11 コッパ・イタリア準決勝2試合目（ローマ戦）でプロ1000試合目。2014-04-21 パルマ戦で公式戦1100試合目、歴代4位（当時）。2014-05-10 サン・シーロ最後の試合（ラツィオ戦 4-1）、後半から出場、全員の名前の腕章。2014-05-18 最後の試合（キエーヴォ戦 1-2）に先発（Wikipedia）。
# - 退場はインテルで2回：1999-02-17 コッパ・イタリア（パルマ戦）、2011-12-03 セリエA（ウディネーゼ戦）（Wikipedia）。あだ名 El Tractor＝体力と上下の動き。
# - 2010-10-20 トッテナム戦（4-3）の開始1分にゴール、37歳71日。CLの2点目のゴール、1点目は1998年12月（シュトルム・グラーツ戦 2-0）（Wikipedia）。
# **山場**：2010年CL決勝。ザネッティ本人のゴール・発言は無いので、キャプテンとして先発した三冠の試合を、結果と記録で語る。
# **本人の言葉**：取れていない（公式の引退声明の全文は未確認）。声の行は置かない。
# **見立て（自分で足した・割った値）**：インテルの季ごと（公式戦）95-96 39、96-97 50、97-98 41、98-99 50、99-00 43、00-01 34、01-02 44、02-03 53、03-04 51、04-05 49、05-06 39、06-07 50、07-08 51、08-09 51、09-10 55、10-11 52、11-12 45、12-13 48、13-14 13（合計858と一致）。デビューからの11季（95-96〜05-06）：493試合、1季44.8、50試合以上は4季（96-97・98-99・02-03・03-04）。2006-07〜2010-11の5季（33歳〜37歳）：50+51+51+55+52＝259試合、1季51.8、50試合以上は5季。差 51.8-44.8＝7.0。残りの3季（11-12〜13-14）は45+48+13＝106（493+259+106＝858）。
# **入れなかったもの**：私生活・家族・慈善活動、引退後の副会長、背番号4の永久欠番、2006年W杯に呼ばれなかった経緯、ほかの選手との比較、「最多」「最年少」、日本戦の結果（2010年）。
# **読みで怪しいもの**：ハビエル・ザネッティ、ブエノスアイレス、バンフィエルド、ミリート、バイエルン、サン・シーロ、エル・トラクトル、長居、キリンカップ、サビオラ、トッテナム、コッパ・イタリア。「2006-07」のような書き方はしない。
