# 題材の元: ゲキサカ 2026-11-18（取材・文 竹内達也）「不屈の南野拓実、W杯の苦い記憶は「箱にしまって置いている」悪夢払拭の2030年へ」（全文） https://web.gekisaka.jp/news/japan/detail/?463397-463397-fl
# 出典で確かめたこと:
#   ・南野拓実の言葉（ゲキサカ。字は変えない。台本は読点で行に分けた。記者の補足の（　）は声に出さず落とした）:
#       「僕の中ではもう箱にしまって、サッカー人生とは別のところに置いている」（北中米W杯の半年前の左膝前十字靭帯断裂→W杯メンバーから落選、メンターとしてチームを支えた期間のこと。地の文は「この期間を〜と称する」）
#       「あれはあれで難しい思いの中、いろんな葛藤があって、でも大人にはなれたかな、みたいな感じですね」
#       「そっちも箱にしまって置いています。あれは人生の最悪の日でしたからね」（カタールW杯ラウンド16クロアチア戦のPK戦で1人目として蹴って止められた日）
#       「正直、思い出したくもないというか、克服するために次のW杯を狙っていたけど、それもケガで行けなかったんで。なので、またそれを払拭できる場に次、立てるように頑張りたいなと思っています」
#       「次の代表に選ばれるかどうかは別として目指すべき場所だと思うし、僕自身もヨーロッパのトップレベルで復帰したばかりなので、もう一度やれるんだというところをチームに帰って証明しないといけない」
#   ・ゲキサカ（地の文）: 2015年10月、20歳でA代表に初招集（ハリルホジッチ監督）。森保ジャパン8年間で最多26ゴール。見据えるのは4年後、2030年のW杯。大岩ジャパン初陣の活動は5か月後。
#   ・ESPN の試合データ（site.api.espn.com fifa.world summary event=633839）: 2022-12-05 日本1-1クロアチア（PK戦 日本1-3）。PK戦の日本の1人目は Takumi Minamino（didScore False）。→ 記事の「1人目として蹴ったPKを止められ」と一致。
#   ・ESPN fifa.friendly summary event=401916336（2026-11-17）: 南野は71分に菅原由勢と交代で入る。→ 台本では使わない。
# 依頼文との違い: 依頼文は「W杯の苦い記憶は箱にしまっている」とだけ。実際は2つの箱（①大ケガでW杯を逃した期間＝「僕の中ではもう箱にしまって、サッカー人生とは別のところに置いている」、②クロアチア戦のPK＝「そっちも箱にしまって置いています」）。台本は2つとも出す。
# 自分で数えたもの: 2030年のW杯は、初招集（2015年10月）から15年後。クロアチア戦（2022年12月）から数えて7年以上先。「箱」は記事の発言の中で2つ。
# 前の本との重なり: 20261117_minamino_thanks_moriyasu（森保監督との8年への感謝）／20261112_minamino_return_words・20261105_minamino_machida_return（ケガからの代表復帰）／20261116_minamino_tackle_machida。
#   → 今回の初出: 試合後に語った「箱」の言葉・クロアチア戦のPKの言及・2030年の目標。ケガは「箱にしまった中身」の説明で1行だけ（復帰の話は繰り返さない）。森保監督への感謝（A代表イコール森保ジャパン）は入れない。
# 【言わないこと】森保監督への感謝の言葉／ケガの詳しい経緯・復帰の話／記者の感想（「今も悔いが残っていることをうかがわせた」「無念は計り知れない」）／クロアチア戦のPKの責任論。
# 本人の言葉: あり（南野拓実。ゲキサカ）。Y。
