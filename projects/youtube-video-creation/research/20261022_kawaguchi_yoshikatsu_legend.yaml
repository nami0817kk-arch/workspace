# 川口能活（元日本代表GK）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-22。型は 10/21 の内田篤人と同じ8節。
# ①フック ②基礎DATA ③歩んだ道と転機（＋W杯4大会の表）④プレースタイル（＋通算の表）⑤「あの試合」＝2004-07-31 アジアカップ準々決勝 日本対ヨルダン（PK戦）⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は Jリーグ公式・日本語/英語版 Wikipedia の成績表・各クラブ公式と、自分で足した値だけ。
# **引退後の私生活（家族・結婚・食事・体重管理）は入れない**。女子サッカーの話は入れない。
#
# **一次情報で確かめたこと（引退・時期・いまの立場）**
# - 引退：SC相模原公式サイト（scsagamihara.com/news/post/20181104001、2018-11-04）が「今季限りで現役引退」「12月2日 J3最終節（鹿児島ユナイテッド戦）後に引退セレモニー」「11月14日に記者会見」と発表。Jリーグ公式（jleague.jp/news/article/13223、2018-11-04）も同日付で、日本代表通算116試合・W杯4度・新人王1995・J1 421/J2 43/J3 42（2018-11-04時点）と掲載。
#   最後の試合は 2018-12-02 のJ3最終節 鹿児島戦（キャプテンマークで先発、無失点で勝利。ゲキサカ 2018-12-02、Wikipedia。ゲキサカ本文は未読で、題と og:image の確認まで）。→ **現役ではない**。
# - 引退会見（2018-11-14、サッカーキング「会見要旨」。requests で本文を読み、発言は原文のまま）：「日本サッカーに、自分が選手としてではなくて、違った形で貢献したいという思いが強くなって、それで引退する覚悟を決めました。」「自分はやっぱりサッカーでここまで、人生を歩んできたので、やはり現場で、指導者として、自分の経験したことを伝えたい。」
# - いまの立場：ジュビロ磐田公式サイト 2026-06-27 付「2026/27明治安田J2リーグ 新体制(スタッフ)」（WebFetch で確認）のトップチーム欄に「GKコーチ 川口 能活」。2023年からのGKコーチ就任は 2022-12-26 の発表（サッカーキング／磐田公式 nw_seq=8690。公式本文は JS で読めず、サッカーキングの記事と検索の要約で確認）。
#   ナショナルトレセンGKコーチ（サンスポ 2019-02-08）、U-19日本代表GKコーチ（ゲキサカ 2022-01-20）は Wikipedia の注記と検索の見出しで確認（本文は未読）。
#   **台本は「2023年から磐田のGKコーチ」「2026年6月27日の新体制一覧にも名前がある」と言い、「現在も契約中」とは言い切らない**（契約期間は未確認）。
# - **日本との接点（ヒットの条件）**：全体が日本代表の話。W杯2002（出番なし）・2010（出番なし。第3GK・まとめ役）は career 節の表で前に出した。
#
# **数字の出どころ・食い違いと台本での扱い**
# - 通算：日本語版 Wikipedia の成績表。J1 421（横浜M 193＋磐田 228）、J2 43、J3 43、イングランド2部（FLC）12、デンマーク1部 8、リーグ戦の合計 527（自分で足した。infobox の通算出場 527 と一致）。**Jリーグ公式（2018-11-04時点）は J3 42。最終戦の1試合を足すと 43**（表のとおり43を使う）。
# - 日本代表 116試合0得点（1997〜2008。Jリーグ公式・Wikipedia・検索の要約で一致）。年別の試合数（1997=21、2002=2、2006=19、2010=0）は Wikipedia の表（サッカー日本代表データベース出典）。年の合計＝116 を自分で足して確認。
# - **2004年アジアカップ準々決勝（重慶）**：日程・会場・スコア（1-1、PK4-3）・得点（ヨルダン シェルバイエ11分／鈴木隆行14分）・PKの順（日本：中村×、アレックス×、福西○、中田浩二○、鈴木○、中澤×、宮本○／ヨルダン：3人○のあと4人続けて×）は英語版 Wikipedia。決勝 中国1-3日本（2004-08-07 北京）、準決勝 バーレーン 3-4 日本（延長）。
#   **食い違い**：オールアバウト（2004-08-01、日本語）は「4連続PKセーブ」。AFP系 The Daily Star（2004-08-02）は「川口は2本をセーブ、1本はポストに当たった。ヨルダンは3本外した」。**台本は「ヨルダンは3人が決めたあと4人続けて外した。川口が止めたのは2本、ポストに当たったものが1本」と、2つのうち少ないほうに合わせた**。
#   サイド変更：Daily Star に審判委員（Mohammed Nazri Abdullah）の説明「2人目のキックのあと、ペナルティスポットが掘り返されていた」。誰が抗議を主導したかは日本語（宮本）と英語（ジーコ）で報道が違うので、**台本は「主審がPKの位置の芝が荒れているとして反対側で続けることを決めた」とだけ言い、誰が求めたかは言わない**。ヨルダン側の不満（集中が切れた）は Daily Star。
# - 本人の言葉：①オールアバウト 2004-08-01（requests で本文を読んだ日本語の原文）「たまたまです。みんな非常に頑張っていたし、この流れを大事にしたい」「戦いは苦しかったけど、GKの出番だと思って、遊び心を持ってのぞんだ」②サッカーキング 2018-11-14（原文）③中村俊輔：THE ANSWER 2018-01-14（日本語版 Wikipedia が同じ言葉を引用。原文は WebFetch の要約のみ）④楢崎正剛：サッカーキング 2019-03-02（requests で本文を読んだ原文）。
# - マル秘話：①2019-03-02 楢崎の引退セレモニーに川口がサプライズ登場（サッカーキング）。川口の引退セレモニー（2018-12-02）への楢崎のサプライズ登場は Wikipedia（スポニチ・アーカイブ）。**「花束」は記事本文で確かめられなかったので言わない**。②1995-07-19 清水戦のヘディングがポストに（Wikipedia）。2023-12-17 中村俊輔引退試合（ニッパツ、J-DREAMS）で CK からヘディング弾（ゲキサカ 2023-12-17。「28年越し」はゲキサカの表現）。
# - W杯2010：「第3のGK・まとめ役」は検索の要約（Number・北海道新聞の記事の冒頭）と Wikipedia。**記事の有料部分は未読**。台本は「出番はなし。第3のゴールキーパーとして支えた」と言うだけで、主将の話は見立ての節で「オシム監督・岡田武史監督の下で主将」（Wikipedia）。
# - 「小柄」「炎の守護神」「ロングキックの蹴り分け」は Wikipedia のプレースタイル節（出典：サッカーキング・Number・デイリー 2005）。台本は短く言うだけ。
# - 「日本人GK初の欧州移籍」「日本人初のFAカップ出場」は Wikipedia のみで、**一次資料で確かめられなかったので台本に入れない**。移籍金（180万ポンド）も入れない。
#
# **入れなかったもの**：私生活（結婚・子ども）、食事・体重、2011-08-03 スルガ銀行杯のPK戦（直後に松田直樹さんが亡くなった話を含むので扱わない）、2010年ナビスコ杯決勝など細部。
# **日本語名・読みで怪しいもの**：川口能活・富士市・清水商業・横浜マリノス・ポーツマス・ノアシェラン・ジュビロ磐田・SC相模原・重慶・ヨルダン・三都主アレサンドロ・福西崇史・中田浩二・宮本恒靖・鈴木隆行・楢崎正剛・中村俊輔・岡田武史・オシム・J-DREAMS・ナショナルトレセン。
