- id: secret
  heading: ライバルのサプライズと、28年越しのヘディングには、何があったのか
  tier: 報道
  telop: 楢崎正剛と、ヘディング
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows:
    - [2018〜19年, ライバルが、サプライズで登場し合った]
    - [1995・2023年, 28年を隔てた、2本のヘディング]
    source: サッカーキング・ゲキサカ・Wikipedia
  say:
  - text: 数字の外にある話を、2つ。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/02_w.jpg
    card:
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows:
      - [2018〜19年, ライバルが、サプライズで登場し合った]
      - [1995・2023年, 28年を隔てた、2本のヘディング]
      source: サッカーキング・ゲキサカ・Wikipedia
      highlight_row: 0
  - text: 1つ目は、ライバルとの話。日本代表のゴールキーパーの座を争った、楢崎正剛です。
    emph: true
    card:
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows:
      - [2018〜19年, ライバルが、サプライズで登場し合った]
      - [1995・2023年, 28年を隔てた、2本のヘディング]
      source: サッカーキング・ゲキサカ・Wikipedia
      highlight_row: 0
  - {text: 2018年12月2日、川口の引退セレモニーに、楢崎正剛が、サプライズで登場します。, card: none}
  - {text: 3か月後の2019年3月2日。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg, card: none}
  - {text: 今度は、楢崎正剛の引退セレモニーに、川口がサプライズで現れました。, card: none}
  - {voice: 楢崎氏, text: 彼がいないと、僕もこんなに長くはできなかったと思います。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg}
  - {voice: 楢崎氏, text: 代表でも一緒に切磋琢磨してやれたことは、, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg, cont: true}
  - {voice: 楢崎氏, text: 全部身になっているので、感謝しかない。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg, cont: true, pause: 0.6}
  - text: 2つ目は、ヘディング。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/04_w.jpg
    emph: true
    card:
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows:
      - [2018〜19年, ライバルが、サプライズで登場し合った]
      - [1995・2023年, 28年を隔てた、2本のヘディング]
      source: サッカーキング・ゲキサカ・Wikipedia
      highlight_row: 1
  - {text: 1995年7月19日、清水エスパルス戦。, card: none}
  - {text: 1点を追う後半ロスタイム、川口は、コーナーキックで、ゴール前に上がります。, card: none}
  - text: それから28年後。2023年12月17日、中村俊輔の引退試合。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/04_w.jpg
    card:
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows:
      - [2018〜19年, ライバルが、サプライズで登場し合った]
      - [1995・2023年, 28年を隔てた、2本のヘディング]
      source: サッカーキング・ゲキサカ・Wikipedia
      highlight_row: 1
  - {text: 引退試合のチーム、ジェイドリームスで出た川口が、, card: none}
  - {text: コーナーキックから、ヘディングで、ゴールを決めます。, emph: true, card: none}
