  say:
  - {text: 日本代表のゴールキーパー、川口能活。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/02_b.jpg, short_only: true, card: none}
  - {text: 最も語られる一戦は、2004年7月31日、アジアカップの準々決勝。, short_only: true, card: none}
  - text: 相手は、初出場のヨルダン。
