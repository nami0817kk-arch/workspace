      - [8月7日, 決勝で中国に3対1。優勝]
      focus: 0
      highlight_row: 2
  - text: ここで、主審が、PKの位置の芝が荒れていると判断します。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg
    card:
