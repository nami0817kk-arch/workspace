  - {text: 試合のあと、PK戦のことを聞かれた川口は、こう答えています。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_b.jpg, card: none}
  - {voice: 川口能活, text: たまたまです。みんな非常に頑張っていたし、, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_b.jpg}
  - {voice: 川口能活, text: この流れを大事にしたい。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_b.jpg, cont: true}
  - text: 準決勝は、バーレーンに4対3。決勝は、中国に3対1で、優勝です。
