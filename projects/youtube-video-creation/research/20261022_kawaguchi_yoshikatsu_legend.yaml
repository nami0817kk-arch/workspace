- id: style
  heading: 川口能活のゴールは、何が堅かったのか
  tier: 報道
  telop: 飛び出しと、反応と、PK
  card:
    type: table
    title: 川口能活のゴール
    columns: [項目, 中身]
    rows:
    - [飛び出し, ゴール前への素早い飛び出し]
    - [反応, 小柄でも俊敏な反応]
    - [キック, 相手に合わせて蹴り分けるロング]
    - [PK, 蹴る側が「読まれる」と感じる]
    source: Wikipedia・THE ANSWER
  say:
  - text: まず、数字。リーグ戦の通算は、527試合。内訳は、表のとおり。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg
    emph: true
    card:
      type: table
      title: 川口能活 通算（リーグ戦）
      columns: [リーグ, 試合]
      rows:
      - [J1, '421']
      - [J2, '43']
      - [J3, '43']
      - [イングランド2部, '12']
      - [デンマーク1部, '8']
      - [リーグ戦の合計, '527']
      - [日本代表, '116']
      source: Jリーグ・Wikipedia
      highlight_row: 5
  - text: 体は、小柄でした。それでも、「炎の守護神」と呼ばれます。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/07_w.jpg
    card:
      type: table
      title: 川口能活のゴール
      columns: [項目, 中身]
      rows:
      - [飛び出し, ゴール前への素早い飛び出し]
      - [反応, 小柄でも俊敏な反応]
      - [キック, 相手に合わせて蹴り分けるロング]
      - [PK, 蹴る側が「読まれる」と感じる]
      source: Wikipedia・THE ANSWER
      highlight_row: 1
  - text: 武器は、ゴール前への飛び出しと、俊敏な反応。
    card:
      type: table
      title: 川口能活のゴール
      columns: [項目, 中身]
      rows:
      - [飛び出し, ゴール前への素早い飛び出し]
      - [反応, 小柄でも俊敏な反応]
      - [キック, 相手に合わせて蹴り分けるロング]
      - [PK, 蹴る側が「読まれる」と感じる]
      source: Wikipedia・THE ANSWER
      highlight_row: 0
  - text: 相手が足の速い選手なら、速いボール。
    card:
      type: table
      title: 川口能活のゴール
      columns: [項目, 中身]
      rows:
      - [飛び出し, ゴール前への素早い飛び出し]
      - [反応, 小柄でも俊敏な反応]
      - [キック, 相手に合わせて蹴り分けるロング]
      - [PK, 蹴る側が「読まれる」と感じる]
      source: Wikipedia・THE ANSWER
      highlight_row: 2
  - text: そして、いちばん語られるのが、PK。
    image: assets/images/20261022_kawaguchi_yoshikatsu_legend/02_w.jpg
    card:
      type: table
      title: 川口能活のゴール
      columns: [項目, 中身]
      rows:
      - [飛び出し, ゴール前への素早い飛び出し]
      - [反応, 小柄でも俊敏な反応]
      - [キック, 相手に合わせて蹴り分けるロング]
      - [PK, 蹴る側が「読まれる」と感じる]
      source: Wikipedia・THE ANSWER
      highlight_row: 3
  - {text: 2011年のJリーグで、川口と、2度、PKで対戦した中村俊輔。, card: none}
  - {text: その中村が、次のように語っています。, card: none}
  - {voice: 中村俊輔さん, text: 能活さんとのPK戦は、どこに蹴っても届きそうな気がするし、, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/02_w.jpg}
  - {voice: 中村俊輔さん, text: 読まれている気がする。, image: assets/images/20261022_kawaguchi_yoshikatsu_legend/02_w.jpg, cont: true, pause: 0.6}
  quotes_from: ['https://the-ans.jp/column/15753/3/']
  sources: ['https://ja.wikipedia.org/wiki/%E5%B7%9D%E5%8F%A3%E8%83%BD%E6%B4%BB', 'https://the-ans.jp/column/15753/3/', 'https://www.jleague.jp/news/article/13223/']
- id: match
  heading: 2004年7月31日、重慶のPK戦で、何が起きたのか
