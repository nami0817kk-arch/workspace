  - {text: 川口が止めたのは、2本。ポストに当たったものも、1本ありました。, card: none}
  - text: 日本は、福西崇史、中田浩二、鈴木隆行、宮本恒靖が決めて、4対3で、勝ちました。
    card:
      type: timeline
