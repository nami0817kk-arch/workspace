# 前田大然、日本代表招集。同僚リーフ・デイヴィスの「本当におかしい」（2026-09-19）
#
# **quote の型。**中身のほとんどが、同僚デイヴィスの1本のインタビュー。
# 事実（誰が・どこで・何と言ったか）を先に置き、あとは言葉を読む。
#
# **英『イプスウィッチ・スター』9/18掲載のインタビューが原本**（football-tribe が
# 日本語で伝えた記事を出典にする）。デイヴィスの発言はこの1本の取材から。
#
# **代表招集は JFA 公式の招集メンバー発表で確認できた**ので、その部分だけ tier を
# 確定にできる（9/24 対ウルグアイ、キリンチャレンジカップ、宮城）。
#
# **反応は2系統。**①8月のプレミアデビュー戦（対サンダーランド）に対する
# イプスウィッチサポーターの声（nofootynolife.net が翻訳）。②9月12日、
# 献身的なプレーが評価された記事への Yahoo!ニュースのコメント欄。
# **どちらも「今回のデイヴィスの発言そのもの」への反応ではない**ので、
# 語りで「今回の発言への反応ではなく」と断ってから使う。
format: quote
voice_min: 45
slot: japan_2
date: "2026年9月19日"

people:
  - リーフ・デイヴィス
  - 前田大然

short_title: "同僚が語った前田大然のプレス"

theme:
  id: maeda_press_teammate_0919
  league: england
  league_name: プレミアリーグ
  kind: other
  topic: イプスウィッチ
  title: 前田大然、日本代表に招集。同僚が漏らした一言とは
  hook: 言ったのは、隣で同じ左サイドを守っている選手です。
  question: 何と言ったのか

thumbnail:
  photo: assets/photos/20260919_maeda_press/01.jpg
  line1: 前田大然「人間離れ」
  line2: 同僚が語った理由は●●
  tags:
