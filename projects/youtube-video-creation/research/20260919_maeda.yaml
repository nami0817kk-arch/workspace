sections:
  - id: what
    heading: 誰が、どこで言ったか
    tier: 報道
    bg: assets/backgrounds/maeda_20260919.png
    telop: イプスウィッチDFリーフ・デイヴィスが、地元メディアに
    narrator: キャスター
    card:
      type: points
      title: 前田大然（28）の今シーズン
      items:
        - イプスウィッチ・タウンFW
        - 開幕戦から3試合連続で先発（サンダーランド／マンチェスター・ユナイテッド／リバプール）
        - 前節クリスタル・パレス戦は途中出場
        - 9月24日、日本代表に招集（対ウルグアイ）
    say:
      - 日本代表に招集されたFW前田大然。招集の理由は、新天地イプスウィッチでの前線からのプレスにあります。
      - 前田と同じ左サイドを組むDFリーフ・デイヴィスが、英メディア『イプスウィッチ・スター』18日掲載のインタビューでこう語りました。
      - {voice: リーフ・デイヴィス, text: 彼は人間離れしている}
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/19/359457/

  - id: main
    heading: 何と言ったか
    main: true
    tier: 報道
    bg: assets/backgrounds/maeda_20260919.png
    telop: 「本当におかしいよ」
    narrator: キャスター
    say:
      - デイヴィスは、前田のプレスについて、こう続けています。
      - {voice: リーフ・デイヴィス, text: 彼のプレスはすさまじい}
      - {voice: リーフ・デイヴィス, text: ここにも、あそこにも、どこにでもいるような動きは本当におかしいよ}
      - {voice: リーフ・デイヴィス, text: 彼が自分の前にいてくれて本当に良かったって思うくらいだよ}
      - {voice: リーフ・デイヴィス, text: それだけじゃない。ボールを持ったときのクオリティも高いんだ}
      - 2人の連係についても、こう語っています。
      - {voice: リーフ・デイヴィス, text: 僕が前に出れば、彼がカバーしてくれる。彼が前に出れば、僕がいつでもカバーする。お互いにそういう関係だよ}
      - {voice: リーフ・デイヴィス, text: 彼がいることで僕はかなり楽になる}
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/19/359457/

  - id: around
    heading: 代表でも同じ役割が求められている
    tier: 確定
    bg: assets/backgrounds/maeda_20260919.png
    telop: 9月24日、対ウルグアイに招集
    narrator: 解説
    say:
      - この前線からのプレスとスプリントは、日本代表でも評価されているものです。
      - 日本サッカー協会は、9月24日に宮城で行われるウルグアイ代表戦のキリンチャレンジカップに、前田大然を招集メンバーとして発表しました。
      - セルティック時代から評価されてきた運動量が、新天地イプスウィッチでも、同じ形でチームを助けています。
    official: true
    sources:
      - https://www.jfa.jp/samuraiblue/20260924/member.html

  - id: voices
    heading: プレミアデビューのころ、現地はどう見ていたか
    tier: 未確認
    bg: assets/backgrounds/maeda_20260919.png
    telop: 「走るのを決してやめなかったね」
    narrator: キャスター
    say:
      - {short_only: true, text: 隣で守る選手が、前田大然についてそう語った話です。}
      - 今回のデイヴィスの発言そのものへの反応は、まだ出ていません。ただ、この夏の移籍が決まる前から、現地の評判は同じでした。
      - {voice: 現地サポ, text: 左サイドでプレーできて、プレスもできる。うちの他のウイングが苦手な部分を補える}
      - {voice: 現地サポ, text: トニー・カーン、契約してくれ。彼ほどハードワークする選手はいない。その運動量だけで周りの選手まで良くする}
      - {voice: 現地サポ, text: プレスマシーンだし、今いる選手とはまったく違うタイプ。全然悪くない}
      - 日本語のコメント欄にも、同じ献身ぶりを評価する声が並んでいます。
      - {voice: ネット民, text: チームスポーツをした事がある方なら分かると思いますが、あいつが同じチームにいると助かるをプレミアリーグで体現しています}
      - {voice: ネット民, text: 無駄に走るではなく、走って相手に考えさせる。ミスを犯させる。チャンスを得る。現代においてFWも守備の一員}
      - {voice: ネット民, text: 献身的なのを評価してもらえてるのは安心した。あとはたまに得点してもらえれば、尚の事安心する}
      - {voice: ネット民, text: プレミアで格上と戦うときに世界最高のFWだろうと思う}
      - {voice: ネット民, text: ユナイテッドはビルドアップがちんたらしてるから大然みたいなタイプに弱いんだよね。実際前半は互角だった}
      - {voice: ネット民, text: まさにダイゼンは一人二役。ビッククラブに行って欲しい, short_voice: true}
      - {voice: ネット民, text: 前田としては、日本代表の時とやる事は一緒だから、そこまで難しいオーダーではなかったんだろうな}
    official: false
    sources:
      - https://nofootynolife.net/blog-entry-9175.html
      - https://news.yahoo.co.jp/articles/9e7f00402a28b4e00577ab9d2e29a937361cd16d/comments
