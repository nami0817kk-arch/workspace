# 「10試合」の数え方（確かめた）:
#   ・記事の「今2026/27シーズンのリバプールはここまで10試合」は**全大会の公式戦**。ESPN で数えると
#     プレミア7（ニューカッスル・フォレスト・イプスウィッチ・フラム・ボーンマス・シティ・ブレントフォード）＋CL2（アトレティコ・LASK）＋リーグカップ1（トッテナム）＝10。**リーグ戦だけなら7試合**。
#   ・遠藤の出場は10試合とも0分（ESPN の appearances=0 / 出場選手表）。ベンチ入りは7試合（ニューカッスル・フォレスト・イプスウィッチ・リーグカップ・フラム・シティ・ブレントフォード）、
#     ボーンマス・アトレティコ・LASK の3試合は ESPN の出場選手表に名前が無い（メンバー外。理由は分からないので言わない）。**自分で数えた数字**。
