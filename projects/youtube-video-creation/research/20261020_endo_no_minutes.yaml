#   ・18日ブレントフォード 1-2 リヴァプール（逆転勝ち）は ESPN と一致。
# 重ならないように: 10/20 のソボスライ紹介（本編）が扱う負傷の中身・数字は**言わない**。「中盤の選手が負傷交代」の1句だけ。
# 次の予定（ESPN）: 21日（日本時間）午前4時 CL ビジャレアル戦（ホーム）、25日 プレミア ブライトン戦（ホーム）、28日 リーグカップ チェルシー戦（ホーム）。
# 本人の言葉: **無い**（作らない）。クラブの発表・監督の言葉も、この記事には無い（英メディア1本の見方）。
#   なお liverpoolfc.com に 2026-05-26 の遠藤のインタビュー記事（W杯の抱負）があるが、今回の話ではないので使わない。
# 反応: 探していない（0件。作らない）。
# 写真: 01 liverpoolfc.com（クラブ公式・5月の記事のトンネル写真）／02 Commons CC0（2025-04-06 フラム戦前の移動。撮影 Timmy96）／03 Commons 公有（2018-06 日本代表）。
#   代理店は使っていない。今季の試合写真は取れなかった（出場が無い）。
# 確度: 報道（英メディア1本の見方。クラブの発表ではない）。数字（10試合・ベンチ入り・直近の出場）は ESPN の試合記録で確かめた。
