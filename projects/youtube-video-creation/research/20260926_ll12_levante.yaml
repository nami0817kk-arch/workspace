    no_telop: true
  - image: assets/stats/ll_levante_data1.png
    text: 愛称は「グラノタ」。バレンシア語で**カエル**。川の中にあった、昔の球場から来た名前。
    no_telop: true
  - image: assets/backgrounds/stadium_レバンテ.png
    text: 本拠地はシウダ・デ・バレンシア。**1969年**の開場で、**2万6354人**が入ります。
  - image: assets/stats/ll_levante_cups.png
    text: 1部も国王杯もスーペルコパも、優勝は0回。2部だけは**3回**、頂点に立っています。
    no_telop: true
  - image: assets/stats/ll_levante_data8.png
    text: 昨シーズンは**16位**。残留を争う3チームが、勝ち点**42**で並びました。レバンテは直接対決の成績で上でした。
    no_telop: true
