  - '**2025年12月**に就任しました。前はフランスのナントです。'
  - ベンフィカの19歳以下のチームを率いて、欧州一になった経験があります。
  - 就任のとき、レバンテは順位表のいちばん下。シーズンの最終節に、残留を決めました。
  - 9月の会見で、カストロ監督は本拠地のことを、こう話しています。
