# ラ・リーガ20クラブ紹介 ⑫レバンテ（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/levante*.json と旧台本 -
# 2026-10-12 に出すために直した（⑪ヘタフェ 2026-10-11 と同じ直し方）:
#   ・「今季のここまで」を見立ての節にした（自分で数えた1試合あたりの表・ホームとアウェーの表・得失点差の増減・計算の板）。
#     昨季38試合と今季6試合を1試合あたりに直すと、得点は1.24→1.33でほぼ同じ・失点は1.61→2.00（1.25倍）。
#     ホーム2試合は得点7失点6・アウェー4試合は得点1失点6（ホームでプラス1・アウェーでマイナス5＝計マイナス4）。
#     数字は research/ll_data/last_season.json（昨季 16位・勝ち点42・得点47・失点61）と、
#     **ESPN scoreboard（site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard?dates=YYYYMMDD）を 8/14〜10/12 まで
#     1日ずつ引いた結果**から自分で割った（research/ll_data/standings.json の「第7節終了時点」は10/10〜11の第8節を含まない古い表なので使っていない）
#   ・**日程を確かめて分かったこと**: レバンテの今季の試合は6つだけ（8/16 エスパニョール0-3・8/24 オサスナ0-0・
#     8/29 ベティス5-2・9/6 マラガ0-0・9/13 バルセロナ2-4・9/20 ビジャレアル1-3）。**第6節のアスレティック戦は9/16に
#     大雨で延期され、10/21（ホーム）に動いた**ので、ほかのクラブより1〜2試合少ない。第8節のセビージャ戦（ホーム）は
#     **10/12 19:00 UTC＝日本時間 10/13 04:00**で、動画が出る 10/12 の朝にはまだ終わっていない。第9節は 10/16 デポルティーボ（アウェー）。
#     旧版の表は「第7節 ビジャレアル」まで6試合で、数字そのものは今も合っていた（試合が動いていない）が、順位の根拠が古かった
#   ・**順位の言い方**: 10/11 22:50 JST の ESPN で数えると、レバンテは勝ち点5（6試合・得失点差-4）。10日までは17位だったが、
#     11日 12:00Z のエルチェ対セルタが 0-0 で、エルチェが6点（7→8試合）になって上に出た＝**18位**。
#     残る 10/11 の3試合（ソシエダ対デポルティーボ・ベティス対オサスナ・**ラシン対バレンシア 19:00Z＝日本時間 10/12 04:00**）のうち、
#     **バレンシア（勝ち点4・7試合）がラシンに勝つと勝ち点7でレバンテの上に出て、レバンテは19位**になる。
#     動画が出る 10/12 朝には終わっているので、**出す前に ESPN で18位のままか見る**（変わるなら台本の「順位は18位です」と、
#     この yaml の takeaway には順位を入れていないので1行だけ直す）。台本の「順位は18位です」の次の行（降格圏の説明）は19位でも正しい。どちらでも**降格圏（18〜20位）の中**なのは変わらない
#   ・基礎DATAの読み上げを9行→5行に減らした（創立・愛称・本拠地・優勝ゼロ・昨季の順位。残りの4項目は板の右の一覧に出たまま読まない。2026-10-06 ⑩）
#   ・監督の言葉（Marca 2026-09-12 バルセロナ戦の前日会見）を基礎DATAから「今季の監督」の節へ移した
#     （2026-10-06「シリーズの本人の言葉は、話の流れで置くべき節に置く」）。37字の1件は2つに割った
#   ・板を3つ入れ替えた（2026-10-07〜08 ⑪⑬⑭）: 認められるまで＝timeline（年表）／102年目の首位＝stats（数字3つ）／
#     王者の無敗を止めた＝stats。見立ての節に waterfall（増減）と calc（計算）を使った。板を下ろす行は card: none を明示した（2026-10-10）
#   ・主役（レバンテ）の名前が一度も出ない節が8つあったので、各節に入れた
#   ・出典は画面に出さない決まり（2026-10-08）に合わせ、板に出典の行は入れていない
#
# **同じ日に出す他の回と、クラブ・人名を重ねない**: リヴァプール・最年少の記録・イプスウィッチ・アトレティコ・アルバレスは出していない。
#   ただし**バルセロナ**（2018年5月の5対4と 9/13 の 2対4）と**ヨハン・クライフ**（1981年のレバンテ在籍）は旧版から残っている。
#   同じ日の「最年少の記録」がバルセロナの選手・クラブの話なら重なるので、そちらの題材を確かめてほしい
