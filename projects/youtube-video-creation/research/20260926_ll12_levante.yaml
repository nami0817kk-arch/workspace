- id: season
  viewpoint: true
  heading: 失点が増えた6試合。ホームとアウェーで別のチーム
  tier: 報道
  telop: 6試合で勝ち点5。失点は昨季の1.25倍、アウェーは4試合で1点
  narrator: 解説
  card: &res
    type: table
    title: ラ・リーガの結果
    columns:
    - 節
    - 相手
    - 結果
    rows:
    - - 第1節
      - エスパニョール（アウェー）
      - 0対3
    - - 第2節
      - オサスナ（アウェー）
      - 0対0
    - - 第3節
      - レアル・ベティス（ホーム）
      - 5対2
    - - 第4節
      - マラガ（アウェー）
      - 0対0
    - - 第5節
      - バルセロナ（ホーム）
      - 2対4
    - - 第7節
      - ビジャレアル（アウェー）
      - 1対3
  say:
  - text: レバンテは今季、6試合を終えて**1勝2引き分け3敗**です。
    card: *res
  - text: 勝ち点は**5**、順位は**18位**です。
    card: *res
  - text: 下の3つは、2部に落ちる降格圏。レバンテは、その中にいます。
    card: *res
  - text: ほかより試合が少ないのは、延期があったから。
    card: *res
  - text: 第6節のアスレティック戦は、大雨のため、試合の直前に取りやめになりました。
    card: *res
  - text: 試合数をそろえて、1試合ぶんに割ってみます。
    card: &perg
      type: table
      title: 1試合あたりに直すと
      columns: &pergc
      - ''
      - 昨季38試合
      - 今季6試合
      rows: &pergr
      - - 得点
        - '1.24'
        - '1.33'
      - - 失点
        - '1.61'
        - '2.00'
      - - 勝ち点
        - '1.11'
        - '0.83'
      highlight_row: 1
  - text: 失点は昨季の**1.61**から、今季は**2.00**へ。**1.25倍**です。
    emph: true
    card: *perg
    mark:
      kind: box
      row: 1
      col: 2
  - text: 得点は**1.24**から**1.33**で、ほぼ同じ。点は取れています。
    card:
      type: table
      title: 1試合あたりに直すと
      columns: *pergc
      rows: *pergr
      highlight_row: 0
  - text: 勝ち点は**1.11**から**0.83**へ下がりました。
    card:
      type: table
      title: 1試合あたりに直すと
      columns: *pergc
      rows: *pergr
      highlight_row: 2
  - text: 中身を、ホームとアウェーに分けてみます。
    card: &ha
      type: table
      title: ホームとアウェーに分けると（1試合あたり）
      columns: &hac
      - ''
      - ホーム2試合
      - アウェー4試合
      rows: &har
      - - 得点
        - '3.50'
        - '0.25'
      - - 失点
        - '3.00'
        - '1.50'
      - - 勝ち点
        - '1.50'
        - '0.50'
      highlight_row: 0
  - text: ホームは、1試合あたり**3.50**点を取っています。
    card: *ha
  - text: アウェーは、4試合で**1**点。1試合あたり**0.25**点です。
    emph: true
    card:
      type: table
      title: ホームとアウェーに分けると（1試合あたり）
      columns: *hac
      rows: *har
      highlight_row: 0
    mark:
      kind: circle
      row: 0
      col: 2
  - text: 得失点差にすると、ホームでプラス**1**、アウェーでマイナス**5**。
    card: &gd
      type: waterfall
      title: 今季の得失点差（自分で引いた）
      start:
      - ホーム2試合
      - 1
      steps:
      - - アウェー4試合
        - -5
      total:
      - 6試合のあと
      - -4
      unit: 点
  - text: 「本拠地の空気は違う」という監督の言葉と、数字は合っています。
    card: *gd
  - text: ただし、ホームはまだ2試合です。
    card: none
  - text: 昨季と同じ勝ち点**42**まで、足りないのは**37**。
    card: &goal
      type: calc
      title: 昨季と同じ勝ち点42まで（自分で割った）
      terms:
      - - '37'
        - 足りない勝ち点
      - - 32試合
        - 残り
      - - '1.16'
        - 1試合あたり
      ops:
      - ÷
      - ＝
  - text: 残りは**32試合**。1試合あたり**1.16**の勝ち点が要る計算です。
    card: *goal
  - text: いまの**0.83**を、**4割**ちかく上回る歩み。
    emph: true
    card: *goal
  - text: 次は10月12日、ホームでセビージャ。16日はアウェーでデポルティーボです。
    card: &nxt
      type: table
      title: このあとの3試合
      columns:
      - 日付
      - 試合
      rows:
      - - 10月12日
        - セビージャ（ホーム）
      - - 10月16日
        - デポルティーボ（アウェー）
      - - 10月21日
        - アスレティック（ホーム。延期分）
  - text: 21日には、延期になっていたアスレティック戦がホームで開かれます。
    card: *nxt
  - text: アウェーの得点が動くのか。ホームの強さが続くのか。
    emph: true
    card: none
