  official: false
- id: history
  heading: 内戦のさなかの杯
  tier: 背景
  telop: 1937年、内戦のさなかの杯で優勝
  narrator: 解説
  card:
    type: table
    title: 内戦のさなかの杯
    columns:
    - ''
    - ''
    rows:
    - - 1937年
      - 共和国側の地域で開かれた杯
    - - 出場
      - 遠征に出たバルセロナの代わり
    - - 決勝
      - バレンシアに1対0
  say:
  - 1937年、スペインは内戦のさなか。共和国側の地域で、1つの杯が争われました。
  - バルセロナがメキシコとアメリカへの遠征を選び、リーグ**5位**のレバンテが代わりに出ます。
  - 決勝の相手は、同じ街のバレンシア。**1対0**で勝って、優勝しました。
  sources:
  - https://en.wikipedia.org/wiki/1937_Copa_de_la_Espa%C3%B1a_Libre
  - https://en.wikipedia.org/wiki/Levante_UD
  bg: assets/backgrounds/stadium_レバンテ_in.png
  official: false
- id: history2
  heading: 認められるまで
  tier: 背景
  telop: 2023年、連盟が1937年の王者と認める
  narrator: 解説
  card:
    type: table
    title: 認められるまで
    columns: &id001
    - ''
    - ''
    rows:
    - - 戦争のあと
      - 公式の優勝とされず
    - - 2007年
      - 議会が、認めるよう連盟に求める
  say:
  - ところが戦争のあと、この優勝は長いあいだ、公式のものとされませんでした。
  - '**2007年**、国の議会がそろって、認めるよう連盟に求めます。'
  - text: 連盟が1937年の王者と認めたのは、**2023年3月**のことでした。
    card:
      type: table
      title: 認められるまで
      columns: *id001
      rows:
      - - 2023年3月
        - 連盟が1937年の王者と認める
  - ただし、国王杯の優勝の回数には数えられていません。
  sources:
  - https://www.marca.com/futbol/copa-rey/2023/03/25/641ef935ca47410a6f8b4572.html
  - https://en.wikipedia.org/wiki/1937_Copa_de_la_Espa%C3%B1a_Libre
  - https://es.wikipedia.org/wiki/Levante_Uni%C3%B3n_Deportiva
  - https://rfef.es/en/noticias/track-record-the-team-in-white-win-their-20th-copa-trophy
  bg: assets/backgrounds/stadium_レバンテ_in.png
  official: false
- id: history3
  heading: 102年目の首位
  tier: 背景
  telop: 2011年、創立102年で初めて首位に
  narrator: 解説
  card:
    type: table
    title: 102年目の首位
    columns:
    - ''
    - ''
    rows:
    - - 2011年の秋
      - 7連勝で、初めて首位に
    - - 2011-12
      - 6位で、初めて欧州へ
    - - 2013年3月
      - ベスト16、延長で敗退
  say:
  - 2011年の秋、クラブで初めての**7連勝**。創立から**102年**で、初めて1部の首位に立ちます。
  - そのシーズンは**6位**。初めて、欧州の大会への切符を取りました。
  - 翌シーズンはベスト16まで進み、雪のモスクワで、延長の末に敗れます。
  sources:
  - https://es.wikipedia.org/wiki/Levante_Uni%C3%B3n_Deportiva
  - https://en.wikipedia.org/wiki/Levante_UD
  bg: assets/backgrounds/stadium_レバンテ_in.png
  official: false
- id: history4
  heading: 王者の無敗を止めた
  tier: 背景
  telop: 2018年、王者バルセロナに5対4
  narrator: 解説
  card:
    type: table
    title: 王者の無敗を止めた
    columns:
    - ''
    - ''
    rows:
    - - 2018年5月13日
      - 優勝を決めたバルセロナに5対4
    - - 後半11分
      - 5対1とリード
    - - 止めたもの
      - リーグ戦43試合無敗
  say:
  - 2018年5月、優勝を決めていたバルセロナを、本拠地に迎えます。
  - ボアテングが3点。後半の途中で**5対1**とリードし、**5対4**の勝ちで逃げ切りました。
  - 王者のリーグ戦**43試合**無敗は、ここで止まりました。
  sources:
  - https://en.wikipedia.org/wiki/2017%E2%80%9318_Levante_UD_season
  - https://en.wikipedia.org/wiki/2017%E2%80%9318_FC_Barcelona_season
  - https://es.wikipedia.org/wiki/Levante_Uni%C3%B3n_Deportiva
  bg: assets/backgrounds/stadium_レバンテ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 失わない。高く売る。上がっては落ちる
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - ボールを失わない
    - - 運営の型
      - 安く見つけて高く売る
    - - クラブの気質
      - 上がり下がりのエレベーター
  say:
  - カストロ監督は、ボールを失わないことを求めます。前へ急ぐだけでは勝てない、と話します。
  - ピッチの外は、安く見つけて高く売る型。
  - レルマは**60万ユーロ**で獲り、**3000万ユーロ**で売れました。
  - 昇格と降格をくり返す「エレベーター」。1部は**18**シーズン目、2部は**41**シーズンです。
  sources:
  - https://en.wikipedia.org/wiki/Levante_UD
  - https://www.marca.com/futbol/levante/2026/09/20/luis-castro-son-buenos-calidad.html
  - https://en.wikipedia.org/wiki/Jefferson_Lerma
  - https://es.wikipedia.org/wiki/Levante_Uni%C3%B3n_Deportiva
  bg: assets/backgrounds/stadium_レバンテ_in.png
  official: false
