- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 最下位からの残留と、86年待った優勝
  narrator: キャスター
  say:
  - text: 昨シーズンは、2部から上がって1年目。最下位から巻き返して、1部に残りました。
    image: assets/stats/ll_levante_data_r1.png
    no_telop: true
  - text: 立て直したのは、ルイス・カストロ監督。ホームの力を、こう話しています。
    image: assets/stats/ll_levante_data_r2.png
    no_telop: true
  - voice: ルイス・カストロ
    text: 本拠地の空気は違う。1人多く戦えていて、それがホームで大きな力になっている
    image: assets/stats/ll_levante_data_r2.png
  - text: そしてこのクラブが内戦のさなかに取った優勝は、**86年**たって、公式に認められました。
    image: assets/stats/ll_levante_data_r3.png
    no_telop: true
  - image: assets/stats/ll_levante_data0.png
    text: 創立は**1909年**。いまの形は**1939年**、同じ年に生まれた2つのクラブの合併です。
    no_telop: true
  - image: assets/stats/ll_levante_data1.png
    text: 愛称は「グラノタ」。バレンシア語で**カエル**。川の中にあった、昔の球場から来た名前。
    no_telop: true
  - image: assets/stats/ll_levante_data2.png
    text: ホームタウンはバレンシア。人口はスペインで**3番目**に多い、地中海の町です。
    no_telop: true
  - image: assets/backgrounds/stadium_レバンテ.png
    text: 本拠地はシウダ・デ・バレンシア。**1969年**の開場で、**2万6354人**が入ります。
  - image: assets/stats/ll_levante_data4.png
    text: 会長は**2023年**からパブロ・サンチェス。クラブは株式会社の形です。
    no_telop: true
  - image: assets/stats/ll_levante_cups.png
    text: 1部と国王杯、スーペルコパの優勝はありません。2部では**3回**優勝しています。
    no_telop: true
  - image: assets/stats/ll_levante_data6.png
    text: 最多出場は、2度在籍したホセ・ルイス・モラレス。**377試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_levante_data7.png
    text: 直近のタイトルは、2024年から25年の2部優勝。**97分**の決勝点で、昇格を決めました。
    no_telop: true
  - image: assets/stats/ll_levante_data8.png
    text: 昨シーズンは**16位**。勝ち点**42**で3チームが並び、直接対決の成績で残りました。
    no_telop: true
  sources:
