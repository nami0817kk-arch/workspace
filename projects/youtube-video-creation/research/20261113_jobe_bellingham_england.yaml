#       **フランス語に訳された形でしか読めていない。FA の英語の原文（englandfootball.com）は見つけられなかった**（トップのニュース一覧は WebFetch で本文が取れなかった）。台本は、このフランス語からの自訳。
#       ・"Avec Jude qui est également présent, c'est un sentiment extraordinaire pour toute la famille. C'est vraiment spécial. Être appelé en équipe d'Angleterre est déjà un rêve en soi, mais avoir la possibilité de représenter son pays avec son frère, c'est très difficile à décrire avec des mots"
#       ・"Je n'ai pas les mots. Je pense que seules les émotions pourraient décrire ce moment. Et j'espère que, si cela arrive, vous verrez beaucoup d'émotion, notamment dans ma famille"
#       ・"Jeudi dernier, je rentrais de l'entraînement en voiture quand j'ai vu apparaître un message : « Salut Jobe, c'est Thomas Tuchel. » J'étais tellement heureux et excité ! Quand nous avons parlé un peu plus tard, c'était assez irréel"
#       ・"Je ne savais pas vraiment comment réagir, mais je n'arrivais pas à m'arrêter de sourire. Je suis très fier"（最初はU-21代表に呼ばれると思っていた、は記事の地の文）
#       「先週木曜」は、インタビューの日が分からず相対表現なので台本では日を言わない。「22組目の兄弟」の数字も記事のみ（確認できず）なので使わない。
#   ・ESPN（story 50457211, 2026-11-12。WebFetch で読んだ。requests は空の本文）: ジョーブ・ベリンガム（21歳、ドルトムント）は代表に初招集。兄ジュードも代表メンバー。「ロッカールームをジュードと共有する」。
#       ※ Foot Mercato は一度「ボルシアMG所属」と書くが、ESPN と本文の経歴（2025年夏にドルトムント）に合わせて「ドルトムント」。
#   ・ESPN の試合データ（uefa.nations, event 401861150, 2026-11-12 19:45Z, ウェンブリー）: イングランド 2-1 クロアチア（24分 ロジャース〔アシスト ジュード〕／59分 スチッチ／64分 ケインPK）。
#       名簿: ジュード・ベリンガム 先発。ジョーブは名簿にあるが先発でも途中出場でもない（**出番なし**。交代の記録は77分のヌゴモハ・ガーナー・ホワイトの3人のみ）。
#   ・ESPN の日程と順位: 11/15 19:45Z（日本時間16日 4:45）イングランド at スペイン（401861175, リヤド・エア・メトロポリターノ）。グループA3（11/13 取得）: スペイン 5試合 勝ち点15／イングランド 5試合 12／クロアチア 3／チェコ 0。
#   ・前回の取材メモ（20261107_jobe_bellingham_england）: FA 公式で初招集（11/6）。トゥヘル監督の言葉。今回は繰り返さない。
# 食い違い: ①所属（ボルシアMG→ドルトムント、上）。②本人の言葉は FA の英語原文でなく、フランス語訳。③「先週木曜」の日付は特定できない。
# 前の本との重なり: 20261107_jobe_bellingham_england（初招集の事実・トゥヘル監督の言葉）。今回の初出: 本人自身の言葉（兄と同じ代表の気持ち・招集の連絡）と、クロアチア戦で兄が先発・ジョーブは出番なしだった事実。招集の事実は一言にとどめる。
# 本人の言葉: あり（FA 向けの発言のフランス語訳）。Y。
