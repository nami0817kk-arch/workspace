    say:
      - text: ジョーブ・ベリンガムが、兄のジュードと同じイングランド代表に初めて呼ばれて、気持ちを語りました。
        short_only: true
      - voice: ジョーブ・ベリンガム
        text: ジュードも代表にいるので、家族みんなにとって、すばらしい気持ちです。
        emph: true
        image: assets/images/20261113_jobe_bellingham_england/02_w.jpg
      - voice: ジョーブ・ベリンガム
        text: 本当に特別です。
        cont: true
      - voice: ジョーブ・ベリンガム
        text: 代表に呼ばれるだけで夢なのに、兄と一緒に国を背負えるかもしれない。
        cont: true
      - voice: ジョーブ・ベリンガム
        text: 言葉で表すのは、とても難しいです。
        cont: true
      - text: ジョーブは21歳。ドルトムントのミッドフィールダーで、トゥヘル監督が代表に初めて招集しました。
      - voice: ジョーブ・ベリンガム
        text: 練習から車で帰る途中に、メッセージが届きました。「やあ、ジョーブ。トーマス・トゥヘルだ」と。
        image: assets/images/20261113_jobe_bellingham_england/03_w.jpg
      - voice: ジョーブ・ベリンガム
        text: とても嬉しくて、興奮しました。
        cont: true
      - text: 最初は、U-21代表への招集だと思っていたといいます。
      - voice: ジョーブ・ベリンガム
        text: 笑いが止まりませんでした。とても誇らしいです。
        cont: true
      - voice: ジョーブ・ベリンガム
        text: 言葉が出ません。この瞬間を表せるのは、感情だけだと思います。
      - voice: ジョーブ・ベリンガム
        text: もし実現したら、僕の家族を中心に、たくさんの感動を見ることになるはずです。
        cont: true
