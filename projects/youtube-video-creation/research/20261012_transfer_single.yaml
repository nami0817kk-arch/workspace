- id: belgium
  heading: もう1つの数字。ベルギーの報道
  tier: 報道
  telop: ベルギーの2紙は3回払いの合計を報じた。レアルは否定したと伝えられている
  narrator: 解説
  card: &belgium
    type: waterfall
    title: ベルギーの新聞が報じた3回払い
    start: ['2019年', 40]
    steps:
    - ['2020年', 56]
    - ['2021年', 64]
    total: [合計, 160]
    unit: 百万ユーロ
  say:
  - text: 額を巡る報道は、アザールの移籍にもう1つあります。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - text: 2020年9月。ベルギーの2つの新聞が、別の数字を報じました。
    card: *belgium
  - text: 3回に分けた支払いで、合計1億6000万ユーロ。
    emph: true
    card:
      <<: *belgium
      highlight: 合計
  - text: 2019年の分は、全体の4分の1です。
    card:
      <<: *belgium
      highlight: '2019年'
  - text: 2020年の分が35%、2021年の分が40%。
    card:
      <<: *belgium
      highlight: '2021年'
  - text: 根拠は、育った小さなクラブが受け取る、育成の補償金の計算でした。
    image: assets/backgrounds/stadium_レアルマドリード_in.png
    card: *belgium
  - text: 補償金は総額の0.5%で、80万ユーロ。20万、28万、32万の3回払いです。
    card: *belgium
  - text: 0.5%を掛けると3回分に合います。ただ、元の額の裏づけは見つかっていません。
    card: *belgium
  - text: レアルは、この額を否定したと報じられています。
    card: *belgium
  - text: この合計は、固定にボーナス上限を足した額より、さらに2000万ユーロ多い。
    card:
      <<: *belgium
      highlight: 合計
  - text: どれが実際の額なのか、文書の上では確かめようがありません。
    card: none
