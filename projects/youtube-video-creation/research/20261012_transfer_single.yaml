- id: stint
  heading: 移籍のあとの4シーズン
  tier: 報道
  telop: 契約は5年。出場時間はチェルシー最後の1年の3878分から、レアルの1年目は1545分へ
  narrator: キャスター
  card: &mins
    type: line
    title: クラブでの出場時間（公式戦）
    unit: 分
    x: ['2018-19', '2019-20', '2020-21', '2021-22', '2022-23']
    series:
    - [出場時間, [3878, 1545, 896, 904, 392]]
    focus: 出場時間
    note: 2018-19はチェルシー、2019-20からレアル
  say:
  - text: 2019年6月13日。アザールは、ベルナベウで入団を披露されました。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - voice: エデン・アザール
    text: 小さい頃からの夢は、レアルでプレーすることでした。
    card: none
  - voice: エデン・アザール
    text: このユニフォームでプレーするのが、待ちきれない。
    cont: true
    card: none
  - voice: エデン・アザール
    text: そして、たくさんのタイトルを取りたい。
    cont: true
    card: none
  - text: 契約は5年。ここから、レアルでの4シーズンが始まります。
    image: assets/backgrounds/stadium_レアルマドリード_in.png
    card: *mins
  - text: チェルシーでの最後の1年は、3878分。
    card:
      <<: *mins
      highlight: '2018-19'
  - text: レアルの1年目は、1545分です。
    card:
      <<: *mins
      highlight: '2019-20'
  - text: 2年目は896分、3年目は904分。
    card:
      <<: *mins
      highlight: '2021-22'
  - text: 最後の4年目は、392分でした。
    card:
      <<: *mins
      highlight: '2022-23'
  - text: レアルでの4シーズンは、合わせて76試合、3737分です。
    card: &stint_stats
      type: stats
      title: レアルでの4シーズン
      items:
      - ['76', 試合, 公式戦の出場]
      - ['3737', 分, 出場時間の合計]
      - ['8', タイトル, クラブ公式の数]
      focus: 2
  - text: 4シーズンの合計は、チェルシーでの最後の1年とほぼ同じ長さです。
    card:
      <<: *stint_stats
      focus: 1
  - text: そして、レアルは4シーズンで、8つのタイトルを数えています。
    emph: true
    card:
      <<: *stint_stats
      focus: 2
  - text: リーガ2回、チャンピオンズリーグ1回、クラブワールドカップ1回を含みます。
    card:
      <<: *stint_stats
      focus: 2
  - text: 2023年6月3日。レアルは、合意による契約の終了を発表しました。
    card: &tl
      type: timeline
      title: 移籍のあとの年表
      rows:
      - ['2019年6月13日', ベルナベウで入団を披露]
      - ['2023年6月3日', 合意で契約を終えると発表]
      - ['2023年10月10日', 引退を発表]
      focus: '2023年6月3日'
  - text: 契約は2024年6月までありましたが、1年早く終わりました。
    card:
      <<: *tl
      highlight_row: 1
  - text: 同じ年の10月10日、本人が引退を発表します。
    card:
      <<: *tl
      highlight_row: 2
  - voice: エデン・アザール
    text: 夢をかなえて、世界のいろんなピッチで、楽しんできた。
    card:
      <<: *tl
      highlight_row: 2
