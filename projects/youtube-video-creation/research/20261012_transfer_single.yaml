  - text: ボーナスは、条件を満たしたときに足される額です。
    card:
      <<: *bonus
      highlight: ボーナスの上限（報道）
  - text: 上限は、固定の4割ほどと伝えられました。
    card:
      <<: *bonus
      highlight: ボーナスの上限（報道）
  - text: ただ、どの条件でいくら払うのかは、明かされていません。
    card:
      <<: *bonus
      highlight: 上限
  - text: 条件の1つが報じられたのは、移籍の5年後でした。
    card: none
  - text: 2024年5月。レアルが、チャンピオンズリーグの決勝に進みます。
    card: none
  - text: するとチェルシーに、500万ポンドが支払われる、と伝えられました。
    card: none
  - text: このとき、アザールはすでにレアルを離れ、引退していました。
    card: none
