- id: view
  viewpoint: true
  heading: 同じ額を、為替と決算の割合で数える
  tier: 報道
  telop: 同じ固定の額が、為替だけで約1.45倍の円になる。決算の獲得費の約31%にあたる
  narrator: 解説
  card: &share
    type: calc
    title: 報じられた固定の額は、獲得費の何割か
    terms:
    - ['約1億ユーロ', 報じられた固定の額]
    - ['3億2300万ユーロ', レアルの獲得費（決算）]
    - [約31%, 獲得費に占める割合]
    ops: ['÷', ＝]
  say:
  - text: アザールの移籍金のように、公表されない額を、数えて比べてみます。
    image: assets/backgrounds/stadium_レアルマドリード_in.png
    card: *share
  - text: 報じられた固定の額を、レアルの決算の獲得費で割ります。
    card: *share
  - text: 約31%。1人の移籍が、その年度の獲得費の3割ほどに当たる計算です。
    emph: true
    card: *share
  - text: ただ、固定の額は報道、決算は合計なので、会計上の割合とは限りません。
    card: *share
  - text: 次は、円に直してみます。
    card: *share
  - text: 発表の日、2019年6月7日の欧州中央銀行の為替は、1ユーロ122円27銭。
    card: &yen_then
      type: convert
      title: 報じられた固定の額を円に（発表の日の為替）
      from: ['1億', ユーロ, 報じられた固定の額]
      to: ['約122億', 円, 2019年6月7日の為替]
      via: 1ユーロ＝122.27円
  - text: この日の為替なら、およそ122億円です。
    card: *yen_then
  - text: いちばん新しい、2026年10月9日は、1ユーロ177円34銭。
    card: &yen_now
      type: convert
      title: 報じられた固定の額を円に（いまの為替）
      from: ['1億', ユーロ, 報じられた固定の額]
      to: ['約177億', 円, 2026年10月9日の為替]
      via: 1ユーロ＝177.34円
  - text: 同じ額が、およそ177億円になります。
    card: *yen_now
  - text: 割ると、為替だけで約1.45倍。55億円の違いです。
    emph: true
    card: &fx
      type: calc
      title: 円で見た額は、為替で何倍か
      terms:
      - ['177.34円', 2026年10月9日]
      - ['122.27円', 2019年6月7日]
      - [約1.45倍, 同じ額の円での大きさ]
      ops: ['÷', ＝]
  - text: 額は動いていません。円とユーロの関係が動いたのです。
    card: *fx
  - text: 結局、クラブが公表したのは、移籍の日付と契約の期間でした。
    card: none
  - text: 額は、報じられた数字を並べて、読むことになります。
    card: none
  - text: 固定か、ボーナス込みか。どの日の為替か。
    card: none
  - text: 言い分けないと、同じ移籍が、別の大きさに見えてしまいます。
    card: none
  sources:
  - https://data-api.ecb.europa.eu/service/data/EXR/D.JPY.EUR.SP00.A
  - https://publish.realmadrid.com/content/dam/portals/realmadrid-com/es-es/core-content/assemblies/pages/generic-pages/el-club/transparencia/01-documentos-transparencia/informes-econocimicos/2019-2020_INFORME%20ECON%C3%93MICO.pdf
