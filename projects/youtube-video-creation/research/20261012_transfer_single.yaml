# 移籍の深掘り 第3回：エデン・アザール チェルシー → レアル・マドリード（2019年）。10/12 公開。「1つの移籍」の回（第1回＝ネイマール、第2回＝マンCの夏は「1クラブ」）。
# 材料の控えは research/raw/20261012_transfer_single.md。**材料から出ない。**
#
# **選んだ移籍：アザール（歴代15位）。理由は、クラブ公式・クラブの決算・報道のどれで額が追えるかを確かめたら、
#   「額がどの文書にも書かれていない」ことそのものが芯になったため。**
#   レアルとチェルシーの発表文（2019-06-07、全文を読んだ）に額は無い／チェルシーの2020年6月期の決算は
#   売却益の合計（1億4263万ポンド）で、理由にアザールを名指しするが1人ぶんの額は無い／レアルの2019-20年度の決算は
#   獲得費の合計（3億2300万ユーロ）で、アザールの名前そのものが無い。額は報道でしか追えない。
#   → **「どこまでが公表で、どこからが報道か」を言い分ける回**。ネイマールの回（払い方の仕組み）・マンCの回（窓全体の金の動き）と角度が重ならない。
#   代案（ルカク・カイセド）は使っていない（材料が足りたので）。
#
# **ネイマール・マンCの回と型を重ねない**
#   節の並び：①強い一点（stats）②発表文と決算（verdict）③固定とボーナス（waterfall）④もう1つの報道額（waterfall）⑤移籍のあとの4シーズン（line・stats・timeline）⑥見立て（convert・calc）
#   ネイマール：金額の中身→払い方の仕組み→その後→見立て／マンC：窓全体→払った→戻った→相場→見立て。**払い方の仕組みも窓全体の金の動きも、この回には無い。**
#   強い一点の型も違う：ネイマールは「歴代1位を9年抜かれていない」、マンCは「世界一の支出」。**こちらは「額を書いた発表文が無い」**。
#   使った板：stats・verdict・waterfall×2・line・timeline・calc×2・convert×2。**scatter・versus は使っていない**（人の比べでも相場の比べでもないため）。
#
# **直近30日の重なりの確認**（corpus.txt＝9/11以降の取材メモの題・人名・covered.yaml の見出し／research/posted.json の build 788件／research/covered.yaml を引いた）
#   アザール／Hazard：**0件**（posted・covered・corpus とも）。9/16・9/17・9/19 の題材候補ファイルに英語紙の見出し（スウォンジーのボールボーイ、
#   モウリーニョとの話、テリーの話）が出てくるだけで、**1本も作っていない**。
#   ルカク：1件（9/26 italy_belgium「マンチーニのイタリア、ベルギーに0-2。試合後にルカクがした仕草」）。**この回では使っていない**。
#   カイセド：0件。ベルギー代表：1件（同じ9/26。アザールの代表の話はしない）。
#   **クラブ名は重なる**（人ではなく、題材が別）：チェルシー＝9/13 chelsea_hull・9/16〜9/24 pl06_chelsea（クラブ紹介⑥）・9/18 alonso・9/19 chelsea・
#   10/11 palmer_deal／レアル・マドリード＝9/12 nicopaz・9/16 rodri・9/23 realmadrid・9/24 carvajal・9/26 ll17_realmadrid（クラブ紹介）・10/9 finance_realmadrid。
#   **アザール本人も2019年の移籍も、どの回にも出ていない。**使ったのは、**クラブ名だけ重なる別の題材**として扱う。
#   10/9 finance_realmadrid（レアルの財政）は**収入の回**で、決算の「選手獲得費」「移籍収入」の数字は使っていない。
#   **この回で使うレアルの決算の数字（2019-20年度の獲得費 3億2300万ユーロ）は、10/9 の回では読んでいない**（取材メモを確認）。
#   **この日の他の枠**（リヴァプール＝財政・ブレントフォード＝スタジアム・レバンテ・イプスウィッチ・アトレティコ）とは重ならない。
#   **使わないと決めた人**（エムバペ・デンベレ・ネイマール・PSG／エンソ・アンダーソン・ブアディ・サヴィオ／ライス／ベリンガム／ロナウド）は**一度も出していない**。
#   歴代15位の前後（14位がエンソ）は**名前を出さず、金額の差だけ**にした（材料 §5）。…ただし台本ではこの比べも使っていない。
#
# **数字の確度（固定とボーナスの扱い）**
#   **クラブが公表した額は無い。**台本は「クラブが発表した」と一度も言わない。言うのは次の3つだけ。
#     ・「両クラブの発表文に、額は書かれていません」（全文を読んだ。**言える**）
#     ・「決算に出るのは合計まで」（チェルシー：売却益の合計＝1億4263万ポンドで前年の約2.36倍、理由にアザールを名指し／レアル：獲得費の合計＝3億2300万ユーロ、アザールの名前なし）
#     ・「報じられた額」＝固定およそ1億ユーロ、ボーナスを足した上限1億4000万ユーロ前後（固定の1.4倍・4割）、Transfermarkt の集計1億2080万ユーロ（歴代15位）、ベルギーの新聞の3回払い合計1億6000万ユーロ（レアルは否定したと報じられた）
#   **ボーナスの条件の一覧は公表も報道も見つからなかった**（2024年5月にチャンピオンズリーグ決勝進出で500万ポンドと報じられた1件だけ。「本人に関係しない条件も含まれていた」と伝えられた）。
#   **Transfermarkt の額は成功報酬の達成分を含む集計**なので「報じられた額」と言う。
#
# **自分で数えた数**（材料 §2・§3・§4・§6 に式と元の数字がある）
#   売却益の前年比 142.630÷60.449＝2.3595（約2.36倍）／ボーナス上限 140−100＝40（固定の4割）・140÷100＝1.4倍／
#   ベルギーの3回払い 40+56+64＝160（上限より 160−140＝20 多い）・補償金 0.5%×40=0.20、×56=0.28、×64=0.32、合計0.80（万ユーロでなく百万ユーロ。20万・28万・32万・80万ユーロ）／
#   報じられた固定÷レアルの獲得費 100÷323＝0.3096（約31%）／
#   出場時間 3878（チェルシー最後の1年）・1545・896・904・392（レアル4年）、レアル合計 76試合・3737分、3878−3737＝141／
#   為替（欧州中央銀行の参照相場）：100,000,000×122.27＝12,227,000,000円（約122億円）、×177.34＝17,734,000,000円（約177億円）、177.34÷122.27＝1.4504（約1.45倍）、差は約55億円。
# **為替は ECB 参照相場。取得日 2026-10-11。**2019-06-07（発表の日）＝1ユーロ122.27円、2026-10-09（取れた最新日）＝177.34円。
#   **どちらの日の為替かを必ず言う**（⑥の換算の板2枚と calc）。**読み上げでは ECB と言わず「欧州中央銀行」**（英字を声に出さない）。
# 数字の重なり対策（別の節で同じ数字を読まない）：「1億ユーロ」「1億4000万ユーロ」「1億2080万ユーロ」は①だけ。③は「固定の4割」「固定の1.4倍」で受け、
#   ボーナスの金額は読まない。④の「4000万・5600万・6400万」「1億6000万」は④だけ。⑥は割合・倍率・為替だけで、①〜④の金額は言い直さない。**題には金額を入れない**。
#
# 板：①stats ②verdict（4行）③waterfall ④waterfall ⑤line（5点）・stats・timeline（4行）⑥convert×2・calc×2。
#   **板を下ろす行には `card: none` を明示した。**focus／highlight は 0 から数え、迷うところは字で指した。赤ペン（mark）は使っていない。
#   **顔のある写真は板と共存できない**（本編の板は左74%）ので、冒頭の2行（①）と本人の言葉（⑤の入団の言葉）だけ写真、そのほかは板の下地（本拠地の中）。
# 写真：Commons の3枚（すべて CC BY / BY-SA。代理店の写真は無し）。
#   **06（Chelsea Debs / CC BY-SA 2.0、2018-09-15、5065x3377）を冒頭とサムネに使う**。チェルシーの2018-19の青いユニフォーム、顔がはっきり写る。
#   **本当はレアルの白い練習着の写真（02、CC BY 3.0 / Real Madrid、918x644）を冒頭にしたかったが、本編で2.09倍の引き伸ばしになり precheck が × を出した**
#   （サムネの写真は冒頭にも敷かれるため。サムネだけなら1.39倍で通る）。**大きなレアル時代の顔写真は Commons に無い**（Salzburg との親善試合 2019-08-07 は顔が小さい）。
#   **02 はサムネ案A、03（CC BY 4.0 / Amir Hosseini、2019-05-29 ヨーロッパリーグ決勝の得点後、1050x700）は案Bで使うための置き場**で、台本の `image:` には出していない。
#   `portrait` は depicts が無いと止めるので、ファイル名・Category:Eden Hazard・目視で本人を確認して手で取り込んだ（credits.json の subject_check に書いた）。
#   06 の16:9は人物を残して2400x1350を切って1920x1080にした（facecrop は2人写りの縦長で別人を選んだので使わず、手で切った）。縦版（`06_v` と、ショートの冒頭が拾う `06_w_v`）は1900x3377から切った。
#   **板の下地は本拠地の実写**（assets/backgrounds/stadium_レアルマドリード_in.png と同 .png。顔が無いので板が顔にかからない）。
#   **20秒を超える板の連続には本拠地の中と外を交互に挟んだ**（挟まないと `spread_long_cards` がサムネの顔写真を板の下に差し込み、60秒の板が顔にかかって preview4 が × を出した）。
#   **シリーズの回にショートは作らない**ので縦版は置いてあるだけ。冒頭の顔は preview4 のショートでも ✓（`06_w_v` を置いたら顔が入った）。
# 声：エデン・アザール本人の言葉2か所（入団の披露＝2019-06-13・引退の発表＝2023-10-10。どちらも本人が公に話した・書いた言葉）。
#   **ネットの反応は入れない**（voice_min: 0）。他人の声は本人の言葉の4行だけ（尺の1割に満たない）。
# サムネ：**ユーザーと相談して決める。**ここに書いたのは点検用の案A（構図 face、06の写真、顔を左 `side: left`）。案B（versus）・案C（scene）は報告に書いた。
#   案A の見本は output/thumb_samples/hz_face06_face.png（`_list.png` もある）。
#   直近が 10/9 ネイマール＝number、10/11 マンC＝number なので、**今回も number にすると3回続く。face にして外した。**
#   **集中線は付けない**（rays は書かない。既定でオフ）。
