  - text: シュートは4試合で8本。1試合2本のペースです。
    card: {type: table, title: PK抜きの得点とxG（リーグ戦）, columns: [選手, 得点, xG, 1試合のシュート], rows: [*xg0, *xg1, *xg2, *xg3, *xg4], source: FotMob, highlight_row: 0}
  - text: ハーランドとマレンは1試合4本、ラウタロは5本を超えています。
    card: {type: table, title: PK抜きの得点とxG（リーグ戦）, columns: [選手, 得点, xG, 1試合のシュート], rows: [*xg0, *xg1, *xg2, *xg3, *xg4], source: FotMob, highlight_row: 3}
  - text: 鈴木唯人と並んでいたラウタロは逆で、xGより点が少ない側にいます。
    card: {type: table, title: PK抜きの得点とxG（リーグ戦）, columns: [選手, 得点, xG, 1試合のシュート], rows: [*xg0, *xg1, *xg2, *xg3, *xg4], source: FotMob, highlight_row: 4}
  - text: 鈴木唯人は、8本のうち4本を決めて、この位置にいます。
    card: {type: table, title: PK抜きの得点とxG（リーグ戦）, columns: [選手, 得点, xG, 1試合のシュート], rows: [*xg0, *xg1, *xg2, *xg3, *xg4], source: FotMob, highlight_row: 0}
