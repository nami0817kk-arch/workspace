  - id: why
    heading: 延期を受けて、森保一監督の任期はどう考えられたか
    tier: 報道
    telop: 任期の延長も検討されたが、年内で退任の案が軸と報道
    say:
      - text: アジアサッカー連盟が挙げた延期の理由は、2つ。
      - text: 地域の情勢による物流の難しさと、移動の混乱です。
        card: none
      - text: 延期のうわさが出た段階で、協会の内部では、ある案も検討されたといいます。
      - text: 森保一監督の任期を、延ばす案です。
      - text: それでも今は、延長ではなく、年内での退任が軸になっているとされています。
        emph: true
      - text: 後任に内定している大岩剛監督の体制を、早めて始める方向です。
