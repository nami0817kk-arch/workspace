    heading: 森保一監督の8年は、どの試合で締めくくられそうか
    tier: 背景
    telop: シンガポールの2試合か、12月30日か
    say:
      - text: 見立てです。森保一監督は8年で、カタールと北中米、2度のW杯を率いました。
      - text: 12月30日の試合が開かれなければ、シンガポールでの2試合が締めくくりになります。
