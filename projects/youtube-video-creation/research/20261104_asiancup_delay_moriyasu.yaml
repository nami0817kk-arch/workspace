        emph: true
      - voice: 宮本恒靖
        text: AFCのアジアカップ開催期間の変更について、
        image: assets/images/20261104_pair_miyamoto_moriyasu/01.jpg
        cont: true
      - voice: 宮本恒靖
        text: 判断を尊重します。
        image: assets/images/20261104_pair_miyamoto_moriyasu/01.jpg
        cont: true
      - text: 2027年1月に始まるはずだった大会は、2027年12月の開幕に変わります。
        card: {type: table, title: アジア杯 サウジアラビア大会, columns: [区分, 期間], rows: [[元の日程, 2027年1月7日〜2月5日], [新しい日程, 2027年12月23日〜2028年1月21日]], highlight_row: 1}
      - text: 新しい日程は、これから国際サッカー連盟の承認を受けます。
        card: {type: table, title: アジア杯 サウジアラビア大会, columns: [区分, 期間], rows: [[元の日程, 2027年1月7日〜2月5日], [新しい日程, 2027年12月23日〜2028年1月21日]], highlight_row: 1}
      - text: 森保一監督が、最後に率いるはずだった大会です。
        card: none
      - text: その森保監督は、年内の活動で退任する見通しと報じられています。
        emph: true
      - text: 残る予定は、シンガポールで戦う今月14日のブラジル戦と、17日のパラグアイ戦。
        card: {type: table, title: 森保ジャパン 予定されている試合, columns: [日付, 相手], rows: [[11月14日, ブラジル], [11月17日, パラグアイ], [12月30日, 親善試合（開催は不透明）]], highlight_row: 0}
