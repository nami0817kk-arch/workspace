# 代表チーム紹介 ドイツ代表（10/21 作成。固定シリーズ9「代表チーム紹介」）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **重なりの確認（2026-10-21）**：research/posted.json にドイツ代表の紹介は無い。research/covered.yaml のドイツ代表は 9/15〜9/28 のクロップ就任直後のニュース5本（名簿・初陣・ギリシャ戦）で、紹介ものではなく、題材が違う。
#   ただし「ブラジル代表」の紹介（10/6 公開、10/21 作り直し）とは「2002年決勝」「2014年7対1」の話が重なるので、ブラジル側の台本の細部は繰り返さず、ここでは日本戦の中身を変えた（2022年と2023年の2試合を主役にした）。
# ---- 公式で確かめたこと（2026-10-21 取材。WebFetch・requests。検索のAI要約は根拠にしていない）----
#  ・FIFAランク：FIFA 公式（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain、2026-10-07）＝ドイツ13位（1つ下がる、クロアチアが14位）。点数は書かない。次の発表は11月18日。
#  ・日本の今年の日程と結果：JFA（https://www.jfa.jp/samuraiblue/schedule_result/2026.html）。ドイツとの試合は2026年の日程に無い。
#  ・2023年9月9日 ドイツ1-4日本（ヴォルフスブルク）：JFA 試合ページ（https://www.jfa.jp/samuraiblue/20230909/match_page.html）＝伊東純也11分・上田綺世22分・浅野拓磨90分・田中碧90+2分、ドイツはサネ19分。
#  ・2022年11月23日 W杯グループE初戦 ドイツ1-2日本：Wikipedia(en) の試合一覧＝ギュンドアン33分PK、堂安律75分・浅野拓磨83分（ドーハ）。FIFA の試合ページは取っていない。
# ---- ウィキペディア(en/ja)の値（公式で確かめられていない。台本は「ウィキペディア」と断らず事実の言い方で、ただし下の数は検算した）----
#  ・ドイツのW杯優勝：1954（ハンガリーに3-2、ベルンの奇跡）／1974（オランダに2-1）／1990（アルゼンチンに1-0）／2014（アルゼンチンに延長1-0、ゲッツェ113分）。ja版の記述と一致。1954・74・90年は西ドイツ。
#  ・2002年：決勝でブラジルに0-2（ロナウド2点）。カーンが大会最優秀選手。決勝の会場が横浜であることは 10/21 のブラジル回の取材メモ（JFA）による。
#  ・2002〜2014年の成績：2002 準優勝／2006 3位／2010 3位／2014 優勝（Wikipedia のメダル表）。4大会とも準決勝に進んだ。
#  ・2014年準決勝 ブラジル7-1：Wikipedia(en)。
#  ・2018年：初戦メキシコに敗れ、スウェーデンに2-1、最終戦韓国に0-2でグループ敗退。2022年：日本に1-2・スペインに1-1・コスタリカに4-2で、得失点差でグループ敗退（2大会連続）。
#  ・2026年W杯（Wikipedia(en) 試合一覧）：6/14 キュラソー7-1、6/20 コートジボワール2-1、6/25 エクアドル1-2、6/29 ラウンド32 パラグアイ1-1（延長）PK3-4。グループは2勝1敗。**W杯のPK戦で負けたのは初めて**（Wikipedia の記述。公式では未確認。公開前に FIFA で確かめるのが望ましい）。
#  ・クロップ：2026年7月24日に監督就任が発表（Wikipedia en/ja）、8月15日に就任（en）、契約は2030年まで。前任はナーゲルスマンで、W杯敗退の直後に退任。DFB の公式発表は取っていない。
#  ・ネーションズリーグ2026-27（Wikipedia(en) 試合一覧）：9/24 オランダ1-1ドイツ（アムステルダム）、9/27 ドイツ0-1ギリシャ（アウクスブルク）、10/1 ドイツ2-0セルビア（ミュンヘン）、10/4 ギリシャ0-0ドイツ（テッサロニキ）＝1勝2分1敗・3得点2失点。次は11/13 セルビア戦（ベオグラード）、11/16 オランダ戦（ベルリン）。
#  ・44人を2つの名簿に分けて4試合（ESPN の見出し 2026-09、covered.yaml の klopp_germany_44）。
#  ・日本との試合：Wikipedia(en) の日本代表の結果一覧（1970年以降。1990年代・2010年代にドイツ戦は無い）では、2004-12-16 横浜 日本0-3ドイツ（親善）、2006-05-30 レヴァークーゼン 2-2（親善）、2022-11-23 日本2-1、2023-09-09 日本4-1。**JFA の通算対戦成績は取れていない**ので「2004年以降の4試合」と言い、通算とは言わない。
#  ・フリック前監督の解任は2023年9月10日（Wikipedia en。日本に1-4で負けたあと）。
#  ・愛称 Die Mannschaft：海外の報道でよく使う呼び名。DFB は2022年7月に公式のブランドとしては取りやめた（Wikipedia en 脚注）。
#  ・年齢：生年月日（ウィキペディア）から2026-10-21 時点で計算（キミッヒ 1995-02-08=31、ヴィルツ 2003-05-03=23、ムシアラ 2003-02-26=23、ハヴァーツ 1999-06-11=27、リュディガー 1993-03-03=33、ヴォルテマーデ 2002-02-14=24）。所属は Wikipedia の代表名簿（2026-10-04 時点）。
# ---- 自分で数えた数（検算した）----
#  ・日本対ドイツ 2006年までの2戦：0勝1分1敗・2得点5失点＝1試合 得点1.0・失点2.5。2022年からの2戦：2勝・6得点2失点＝得点3.0・失点1.0。
#  ・2018・2022・2026の3大会で準々決勝に進んだ回数＝0。2002〜2014の4大会は4大会とも準決勝へ。
#  ・クロップ体制の4試合：1勝2分1敗・3得点2失点。
# ---- 言わないもの ----
#  ・日本戦の通算（JFA 未確認）／「初勝利」の言い切り／戦術の説明／ネーションズリーグの順位／選手の怪我・私生活／背番号。
# ---- 写真（assets/images/20261021_team_germany/、出典は credits.json。Commons。代理店・放送映像は使っていない）----
#  g02 キミッヒ・g03 ヴィルツ・g04 ムシアラ・g05 ハヴァーツ・g06 リュディガー（2026年6月25日 エクアドル戦。Bryan Berlin、CC BY-SA 4.0。背番号 6・17・10・7・2 と腕章で本人を確認）／
#  g01 クロップ（2019年・リヴァプール帽。CC BY 4.0 Mehdi Bolourian。古い写真）／g07 ゴールを喜ぶ選手たち（YantsImages CC BY-SA 4.0。誰かは特定していない）。
