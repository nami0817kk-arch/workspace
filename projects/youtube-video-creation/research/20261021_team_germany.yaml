  say:
  - text: ここからは、ドイツ代表の選手です。6人を表にしました。
    image: assets/images/20261021_team_germany/g10_team4.jpg
    card: *id_pl
  - text: 年齢は、生年月日から計算した、今日の時点の数字です。
    card: *id_pl
  - text: 主将のキミッヒは31歳。バイエルン・ミュンヘンの中盤です。
    image: assets/images/20261021_team_germany/g02_kimmich_w.jpg
    card:
      <<: *id_pl
      highlight_row: 0
  - text: ヴィルツは23歳。リヴァプールで、中盤を任されています。
    image: assets/images/20261021_team_germany/g03_wirtz_w.jpg
    card:
      <<: *id_pl
      highlight_row: 1
  - text: ムシアラも23歳。キミッヒと同じ、バイエルンの選手。
    image: assets/images/20261021_team_germany/g04_musiala_w.jpg
    card:
      <<: *id_pl
      highlight_row: 2
  - text: 前線には、アーセナルのハヴァーツ。27歳のフォワードです。
    image: assets/images/20261021_team_germany/g05_havertz_w.jpg
    card:
      <<: *id_pl
      highlight_row: 3
  - text: 守備は、レアル・マドリードのリュディガー。33歳のディフェンダー。
    image: assets/images/20261021_team_germany/g06_rudiger_w.jpg
    card:
      <<: *id_pl
      highlight_row: 4
  - text: そして、ユヴェントスのフォワード、ヴォルテマーデ。24歳です。
    card:
      <<: *id_pl
      highlight_row: 5
  sources:
  - https://en.wikipedia.org/wiki/Germany_national_football_team
  - https://ja.wikipedia.org/wiki/サッカードイツ代表
- id: japan
  heading: 日本は、ドイツとどう戦ってきたのか
  tier: 確定
  official: true
  telop: 2004年の0対3から、2022年と2023年の日本の2連勝へ
  narrator: 解説
  card: &id_jp
    type: table
    title: 日本とドイツの対戦（日本の得点が先）
    columns:
    - 年
    - 大会
    - スコア
    rows:
    - - 2004年12月
      - 親善試合
      - 0-3
    - - 2006年5月
      - 親善試合
      - 2-2
    - - 2022年11月
      - ワールドカップ
      - 2-1
    - - 2023年9月
      - 親善試合
      - 4-1
  say:
  - text: 日本とドイツの国際Aマッチは、2004年から4試合です。
    image: assets/images/20261021_team_germany/g10_team4.jpg
    card: *id_jp
  - text: 古い順に見ます。
    card: *id_jp
  - text: 2004年12月、横浜。日本は、0対3で負けました。
    card:
      <<: *id_jp
      highlight_row: 0
  - text: 2006年5月は、ワールドカップの直前に、ドイツで戦って、2対2の引き分けです。
    card:
      <<: *id_jp
      highlight_row: 1
  - text: ここまでの2試合は、1分け1敗。取った点は2、取られた点は5でした。
    card:
      <<: *id_jp
      highlight_row: 1
  - text: 2022年11月、カタール。ワールドカップのグループE、初戦です。
    image: assets/images/20261021_team_germany/g06_rudiger_w.jpg
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 日本は、前半33分に、ギュンドアンのPKで先制されます。
    card: none
  - text: 後半の75分に堂安律、83分に浅野拓磨が決めて、2対1の逆転勝ちでした。
    emph: true
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 2023年9月、ドイツのヴォルフスブルク。親善試合で、日本が4対1で勝ちました。
    image: assets/images/20261021_team_germany/g02_kimmich_w.jpg
    card:
      <<: *id_jp
      highlight_row: 3
  - text: 決めたのは、伊東純也、上田綺世、浅野拓磨、田中碧。
    card: none
  - text: ドイツの得点は、サネの1点だけです。
    card: none
  - text: この試合の直後、9月10日に、当時のフリック監督は、解任されています。
    card: none
  - text: 2022年からの2試合で、日本は6得点、失点は2です。
    card:
      <<: *id_jp
