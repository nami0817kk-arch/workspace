sections:
- id: hook
  heading: 優勝4回のドイツは、2014年のあと、どこまで進めたのか
  main: true
  tier: 確定
  official: true
  telop: 優勝4回。そのあとの3大会は、準々決勝に進めていない
  narrator: 解説
  say:
  - text: ドイツ代表は、ワールドカップで**4回**優勝しています。最後の優勝は、2014年。それから12年です。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
    emph: true
  - text: ところが、そのあとの**3大会**で、準々決勝まで届いた年は、一度もありません。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
  - text: 2018年と2022年は、グループステージで敗退。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
  - text: 今年は、決勝トーナメント1回戦のラウンド32で、パラグアイにPK戦で負けました。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
  - text: 2022年は、初戦で日本に負けた大会。スコアは、1対2。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
  - text: その翌年の親善試合も、ドイツの本拠地で、日本の勝ちです。
    image: assets/stats/tb_germany_data_r1.png
    no_telop: true
  - text: いま率いているのは、クロップ監督。リヴァプールで知られた人。
    image: assets/stats/tb_germany_data_r2.png
    no_telop: true
  sources:
  - https://inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain
  - https://www.jfa.jp/samuraiblue/20230909/match_page.html
  - https://en.wikipedia.org/wiki/Germany_national_football_team
- id: data
  heading: ドイツ代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: ドイツ代表の基礎DATA
  narrator: 解説
  say:
  - text: ドイツ代表のフィファランクは**13位**。フィファが10月7日に出した順位で、前回より1つ下がりました。
    image: assets/stats/tb_germany_data0.png
    no_telop: true
  - text: ワールドカップの優勝は**4回**。1954年、74年、90年、2014年。このうち3回は、西ドイツでした。
    image: assets/stats/tb_germany_data1.png
    no_telop: true
  - text: 監督は、ユルゲン・クロップ。リヴァプールを率いた人で、2026年8月に就任しました。
    image: assets/stats/tb_germany_data4.png
    no_telop: true
  - text: 主将は、バイエルン・ミュンヘンのキミッヒです。
    image: assets/stats/tb_germany_data5.png
    no_telop: true
  - text: 愛称は、ディ・マンシャフト。ドイツ語で、チームという意味です。
    image: assets/stats/tb_germany_data6.png
    no_telop: true
  sources:
  - https://inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain
  - https://en.wikipedia.org/wiki/Germany_national_football_team
  - https://ja.wikipedia.org/wiki/サッカードイツ代表
- id: history
  heading: ドイツは、いつ頂点に立ち、いつ遠ざかったのか
  tier: 背景
  telop: 1954年の初優勝から、2014年の4度目へ。そして3大会
  narrator: 解説
  card: &id_histA
    type: timeline
    title: 優勝と決勝の歩み
    rows:
    - - 1954年
      - 初優勝。決勝でハンガリーに3対2
    - - 1974年
      - 自国開催で2度目。オランダに2対1
    - - 1990年
      - 3度目。アルゼンチンに1対0
    - - 2002年
      - 日韓大会の決勝。ブラジルに0対2
    - - 2014年
      - ブラジル大会で4度目。決勝は延長1対0
    focus: 1954年
  say:
  - text: ドイツの最初の優勝は、1954年。決勝の相手は、ハンガリー。スコアは3対2です。
    image: assets/images/20261021_team_germany/g10_team4.jpg
    card:
      <<: *id_histA
      highlight_row: 0
  - text: 『ベルンの奇跡』と呼ばれる試合です。当時は、西ドイツでした。
    card:
      <<: *id_histA
      highlight_row: 0
  - text: 1974年は、自国開催で2度目の優勝。1990年は、1対0で3度目。
    card:
      <<: *id_histA
      highlight_row: 2
  - text: 2002年は、日本と韓国の共催大会。決勝は横浜で、ブラジルに0対2で負けました。
    image: assets/images/20261021_team_germany/g09_team3.jpg
    card:
      <<: *id_histA
      highlight_row: 3
  - text: 2014年は、ブラジル大会。準決勝で、開催国のブラジルに**7対1**で勝ちます。
    emph: true
    card:
      <<: *id_histA
      highlight_row: 4
  - text: 決勝は、アルゼンチンに延長戦で1対0。ゲッツェのゴールで、4度目の優勝です。
    card:
      <<: *id_histA
      highlight_row: 4
  - text: ところが、そのあと、ドイツは3大会続けて、準々決勝に届かなくなります。
    card: &id_histB
      type: timeline
      title: 優勝のあとの3大会
      rows:
      - - 2018年
        - ロシア大会。グループで敗退
      - - 2022年
        - カタール大会。初戦で日本に1対2。グループで敗退
      - - 2026年
        - ラウンド32。パラグアイにPK戦3対4
      focus: 2018年
  - text: 2018年は、初戦でメキシコに負けました。
    image: assets/images/20261021_team_germany/g02_kimmich_w.jpg
    card:
      <<: *id_histB
      highlight_row: 0
  - text: 最後の韓国戦も0対2で、グループステージ敗退です。
    card:
      <<: *id_histB
      highlight_row: 0
  - text: 2022年は、得失点差で、決勝トーナメントに進めませんでした。
    card:
      <<: *id_histB
      highlight_row: 1
  - text: 2026年は、グループを2勝1敗で通過しました。キュラソーには7対1。
    image: assets/images/20261021_team_germany/g08_curacao.jpg
    card:
      <<: *id_histB
      highlight_row: 2
  - text: ラウンド32のパラグアイ戦は、1対1のまま、PK戦へ。3対4で負けました。
    card:
      <<: *id_histB
      highlight_row: 2
  - text: 2018年、2022年に続き、準々決勝に届かない大会になりました。
    emph: true
    card:
      <<: *id_histB
      highlight_row: 2
  sources:
  - https://en.wikipedia.org/wiki/Germany_national_football_team
  - https://ja.wikipedia.org/wiki/サッカードイツ代表
  - https://en.wikipedia.org/wiki/Germany_national_football_team_results_(2020%E2%80%93present)
