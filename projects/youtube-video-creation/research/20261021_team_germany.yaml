- id: viewpoint
  viewpoint: true
  heading: 日本に2連敗した4度の王者は、立ち直れるのか
  tier: 背景
  telop: 準決勝の常連は4大会。そのあとの3大会は、準々決勝へ0回
  narrator: 解説
  card: &id_vp
    type: table
    title: ワールドカップ ドイツの準々決勝進出
    columns:
    - 期間
    - 大会数
    - 準々決勝へ進んだ
    rows:
    - - 2002〜2014年
      - 4大会
      - 4大会
    - - 2018〜2026年
      - 3大会
      - 0大会
  say:
  - text: ここからは見立てです。根拠は、数字の比べを2つ。最初は、ワールドカップから。
    image: assets/images/20261021_team_germany/g10_team4.jpg
    card: *id_vp
  - text: 2002年から2014年の4大会は、4大会とも準決勝まで進んでいます。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 2002年は準優勝、2006年と2010年は3位、2014年は優勝です。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 2018年からの3大会は、ベスト8に1回も入っていません。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 2
    card:
      <<: *id_vp
      highlight_row: 1
  - text: もう1つは、日本戦の数字です。
    image: assets/images/20261021_team_germany/g06_rudiger_w.jpg
    card: &id_vp2
      type: table
      title: 日本対ドイツ 2022年を境に（1試合あたり）
      columns:
      - 区切り
      - 戦績
      - 日本の得点
      - 日本の失点
      rows:
      - - 2006年までの2戦
        - 0勝1分1敗
        - '1.0'
        - '2.5'
      - - 2022年からの2戦
        - 2勝
        - '3.0'
        - '1.0'
  - text: 2006年までの2戦は、1分け1敗。1試合の失点は、2.5でした。
    card:
      <<: *id_vp2
      highlight_row: 0
  - text: 2022年からの2戦は、日本の2勝。1試合の失点は、1.0に減りました。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 3
    card:
      <<: *id_vp2
      highlight_row: 1
  - text: ただ、日本が勝ったドイツは、グループ敗退を続けた時期のドイツです。
    image: assets/images/20261021_team_germany/g02_kimmich_w.jpg
    card: none
  - text: クロップ体制の最初の4試合は、1勝2分け1敗。1試合の失点は、0.5です。
    card: none
  - text: ワールドカップのグループステージは、3試合で4失点。
    card: none
  - text: 1試合に1.3でしたから、減りました。
    card: none
  - text: 立ち直ったかどうかは、まだ分かりません。
    card: none
  - text: 見えてくるのは、11月13日のセルビア戦と、16日のオランダ戦です。
    image: assets/images/20261021_team_germany/g09_team3.jpg
    card: none
