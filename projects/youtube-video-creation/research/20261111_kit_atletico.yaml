sections:
- id: stripes
  main: true
  heading: アトレティコの赤と白は、なぜ青と白から替わったのか
  bg: assets/images/20261111_kit_atletico/p_team15_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1903年の創立から8年は、親のクラブと同じ青と白。1911年から赤と白のしま。由来は、買えなかった青白の代わりとする話と、マットレスの布の話
  card: *stripes
  say:
  - text: 今回はアトレティコ・マドリード。赤白のしまと、熊の紋章と、胸の名前の話です。
    image: assets/images/20261111_kit_atletico/p_fans_w.jpg
    card: none
  - text: クラブが生まれたのは、1903年4月。レアル・マドリードの、1年あとです。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card:
      <<: *stripes
      highlight_row: 0
  - text: つくったのは、マドリードで学んでいた、バスク出身の学生3人でした。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card: none
  - text: 最初は、北部の町ビルバオのアスレティック・クラブの、マドリード支部でした。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card: none
  - text: だからシャツも、親のクラブと同じ、青と白の半分ずつでした。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card: none
    emph: true
    callword: 最初は青と白
  - text: その青と白は、イングランドのブラックバーンのシャツを、買ってきたものとされます。
    image: assets/images/20261111_kit_atletico/p_1963_w.jpg
    card: none
  - text: 1909年の終わり、クラブの役員が、新しいシャツを買いにイングランドへ渡ります。
    image: assets/images/20261111_kit_atletico/p_1963_w.jpg
    card:
      <<: *stripes
      highlight_row: 1
  - text: ところが、ブラックバーンの青と白は、見つかりませんでした。
    image: assets/images/20261111_kit_atletico/p_1963_w.jpg
    card: none
  - text: 代わりに持ち帰ったのが、帰りの船が出る港町、サウサンプトンの赤と白です。
    image: assets/images/20261111_kit_atletico/p_1963_w.jpg
    card: none
    emph: true
  - text: 1911年、アトレティコは、この赤と白のしまに替えました。
    image: assets/images/20261111_kit_atletico/p_1963_w.jpg
    card:
      <<: *stripes
      highlight_row: 2
  - text: パンツは、青のままです。
    image: assets/images/20261111_kit_atletico/p_fans_w.jpg
    card: none
  - text: もう一つの説が、マットレスの布。
    image: assets/images/20261111_kit_atletico/p_fans_w.jpg
    card: none
  - text: 赤と白のしまは、当時のマットレスと同じ布で、安く作れた、というものです。
    image: assets/images/20261111_kit_atletico/p_fans_w.jpg
    card: none
  - text: いまも呼ばれる愛称、コルチョネロス、マットレス職人は、ここから来たとされます。
    image: assets/images/20261111_kit_atletico/p_fans_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Club_Atl%C3%A9tico_de_Madrid
- id: crest
  heading: 熊と木の紋章は、なぜ会員の投票で戻されたのか
  bg: assets/images/20261111_kit_atletico/p_team14_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1917年にマドリードの熊と木と7つの星。1939年に翼、1947年にクラシックの形。2017年の作り直しは、2023年の投票で88.68%が戻すを選んだ
  card: *crest
  say:
  - text: 胸の紋章も、最初は親のクラブの印でした。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 1917年、マドリードの町の紋章から、熊と木と、7つの星を取り入れます。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *crest
      highlight_row: 1
    emph: true
  - text: 星は北斗七星。熊は、実はめすの熊で、おおぐま座にかけています。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card: none
  - text: 1939年、空軍の人たちがつくったクラブと一つになり、紋章には翼が付きました。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: 翼が消えたのは1947年。名前も、いまのアトレティコ・マドリードになりました。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *crest
      highlight_row: 3
  - text: このときの形が、ファンがクラシックと呼ぶ紋章です。70年、胸にありました。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card: none
  - text: 2017年、クラブは紋章を作り直します。熊と木は青くなり、向きも逆になりました。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: これに、多くのファンが反発します。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card: none
  - text: 2023年6月、クラブは会員の投票で決めることにしました。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card: none
  - text: 投票したのは、7万7690人。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card:
      <<: *vote
      focus: 0
  - text: 前の紋章に戻すを選んだのは、88.68%でした。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card:
      <<: *vote
      focus: 2
    emph: true
    callword: 88.68%が戻す
  - text: 2024年7月、クラシックの紋章が、胸に戻りました。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card:
      <<: *crest
      highlight_row: 5
  sources:
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://www.football-espana.net/2023/06/30/atletico-madrid-members-score-victory-for-fan-power-as-old-badge-set-to-return
- id: japan
  heading: アトレティコの胸に、日本の名前が入ったのはいつか
  bg: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1980年代の終わりに胸にミタ。1996年から97年はバンダイ、最後の2試合はたまごっち。背中には京セラ
  card: *japan
  say:
  - text: アトレティコの胸には、日本の会社の名前も入っています。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card: none
  - text: 1980年代の終わり、胸にあったのは、日本の複写機の会社、ミタでした。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card:
      <<: *japan
      highlight_row: 0
  - text: 1996年から97年のシーズンは、日本のおもちゃの会社、バンダイ。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card:
      <<: *japan
      highlight_row: 1
  - text: そして、リーグ戦の最後の2試合だけ、胸の名前が、たまごっちに替わりました。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card:
      <<: *japan
      highlight_row: 2
    emph: true
    callword: 胸にたまごっち
  - text: 日本で発売されたのは、1996年11月。その半年ほどあとのことです。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card: none
  - text: もう一つが、京セラ。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *japan
      highlight_row: 3
  - text: 2000年代から2010年代にかけて、背中の番号の下にありました。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card: none
  - text: 京セラは、2000年に、あのミタの会社を買っています。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card: none
    emph: true
  - text: 胸のミタと、背中の京セラは、つながっていたことになります。
    image: assets/images/20261111_kit_atletico/p_kyocera_w.jpg
    card: none
