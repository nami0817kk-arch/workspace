- id: chest
  heading: 今季までの胸には、どんな名前が入ってきたのか
  bg: assets/images/20261111_kit_atletico/p_azer_w.jpg
  tier: 背景
  narrator: 解説
  telop: 町の名前、16本の映画の題、国の名前。2023年からはサウジアラビアの航空会社、リヤド・エア
  card: *chest
  say:
  - text: アトレティコの胸には、ほかにも変わった名前が並びます。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card: none
  - text: 1990年代には、スペイン南部の町、マルベーリャの名前が、3度、胸に入りました。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card:
      <<: *chest
      highlight_row: 0
  - text: 2003年からの2シーズンは、映画の会社が胸を買い、映画の題を入れました。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card:
      <<: *chest
      highlight_row: 1
  - text: 胸に入った映画の題は、16本。ほかのクラブには例のない数とされています。
    image: assets/images/20261111_kit_atletico/p_azer_w.jpg
    card: none
    emph: true
  - text: 2012年からは、国の名前。カスピ海に面した、アゼルバイジャンです。
