# ユニフォームとエンブレムの歴史 アトレティコ・マドリード（11/6 作成、11/11 分）。ラ・リーガの3本目。雛形は 11/7 バルセロナ回。
# 題の問い：アトレティコの赤と白は、もとは青と白だった。なぜ替わったのか（答え＝イングランドでブラックバーンの青白が買えず、サウサンプトンの赤白を持ち帰った、とする話。マットレスの布の話もある）
# 選んだ理由：指示書 20261109「ユニフォームはラ・リーガの続き。レアル・マドリード → アトレティコ」。11/9 にレアル・マドリード、11/11 にアトレティコ。
#   同じ日（11/11）のスタジアム紹介はラ・リーガの続き（アトレティコは 11/1 に済み）→ 同じクラブにならない（research/20261109_picks.txt に先に書いた）。
# 重なり確認（2026-11-06）：scripts/*kit_* にアトレティコは無し。直近30日：20261101_stadium_atletico（10日前・スタジアム。本拠地の名前・リヤド・エア・メトロポリターノ）、20261022_finance_atletico（20日前・財政）。
#   41日前（30日の外）の 20260926_ll04_atletico（クラブ紹介）が、ブラックバーン→サウサンプトンの話とマットレスの愛称を言っている。30日の外なので使うが、言い方は変え、紋章と胸の名前を主にする。
#   この回では、本拠地の名前・お金（リヤド・エアの額）は言わない。
# 今季のリーグ：ウィキペディア en "2026–27 Atlético Madrid season"（ラ・リーガ25季連続）。
# 取材：requests と WebFetch・WebSearch だけ。ブラウザ操作・JS実行は使っていない。クラブ公式（atleticodemadrid.com）は Cloudflare の確認で読めなかった（403）。
#   読んだ：ウィキペディア en "Atlético Madrid"（Foundation・Athletic Aviación・Colours and badge・Kit suppliers and shirt sponsors）、
#     es "Club Atlético de Madrid"（Historia y evolución del escudo）、es "Historia del uniforme del Club Atlético de Madrid"（Uniforme・Proveedores y patrocinadores と注）、
#     en "Kyocera"（2000年1月に三田工業を買い、京セラミタに）、en "Tamagotchi"（1996-11-23 に日本で発売）。
#   紋章の投票：football-espana（2023-06-30。68,894人・88.68%・2024-07-01 から）、検索の要旨（クラブの発表：77,690人が参加、138,881人の56%）。
# ---- 食い違い・断ったこと ----
#   ・赤白の由来は2つの説：①ブラックバーンの青白を買いに行ったエロルドゥイが見つけられず、帰りの港町サウサンプトンの赤白を買った（en・es。es は「1909年のクリスマス休み」、en は「1909年の終わり」）。
#     en は 2023年の調べでサンダーランドとする説も挙げる。②赤白のしまはマットレスの布と同じで安く作れた（en。愛称コルチョネロスの元）。→ どちらも「とされる」「説」と言い、決めない。
#   ・赤白を着た年：en・es とも 1911年。パンツ：en は「青のまま」、es は「1921年に青に決める」→ 台本は「パンツは青」とだけ。
#   ・ミタの年：en は 1989-90、es は 1988-1990 → 台本は「1980年代の終わり」。
#   ・京セラの背中の年：es は 2006-2014、en は 2005-06 から → 台本は「2000年代から2010年代にかけて」。
#   ・たまごっち：es の注「バンダイは胸と袖とパンツに。たまごっちはリーグ戦の最後の2試合で胸に」→ そのまま。
#   ・コロンビア映画（2003年から2年）：en「16本の映画の題」→ 数はそのまま「16本」と言う。
#   ・マルベーリャの名前が胸に3度：en・es の表（1990-93、1994-96、1997-99）。当時の会長の話（法の問題）は入れない。
#   ・紋章：es ＝1903-13 はアスレティックの帯の形（青白・AC）、1913-17 は赤白、1917 にマドリード市の紋章の熊と木（マドロニョ）と7つの星、1939-47 はアビアシオンの翼、1947 に翼と冠が消えて「クラシック」、2017-24 は作り直し（熊と木が青・向きが逆・上が丸い）、2023-06-30 の投票で 88.68%、2024-07-01 に戻る。
#     en は「1917年に紋章、1947年からシャツに」。→ 台本は es の流れ、年は 1917・1939・1947・2017・2024 だけ言う。
#   ・リヤド・エアの胸：es の表（2023-24 から 2026-27）。今季のシャツに入っていることは検索の要旨（クラブの発表の見出し）でも合う。額は言わない。
#   ・ナイキ：en「2001年から」。
# ---- 自分で数えた数 ----
#   青白：1903→1911＝8年。赤白：1911→2026＝115年。クラシックの紋章：1947→2017＝70年。作り直しの紋章：2017→2024＝7年。70÷7＝10倍。
#   投票：68,894÷77,690＝88.68%（発表どおり）。胸に入った日本の会社：ミタ（胸）・バンダイ（胸、たまごっち）・京セラ（背中）＝3つ。
# ---- 日本との接点 ----
#   ①1980年代の終わり、胸に日本の複写機の会社ミタ（三田工業）。②1996年から97年、胸にバンダイ、最後の2試合はたまごっち。③背中に京セラ（2000年に三田工業を買っている）。
# 言わなかったもの：本拠地の名前（10日前のスタジアム回）／リヤド・エア・プラス500の額／会長の話／アゼルバイジャンの協賛への批判（政治）。
# 写真：assets/images/20261111_kit_atletico/（credits.json）。Commons（CC BY・CC BY-SA・CC0）。代理店・放送映像・エンブレム画像は使っていない。
#   1963年の写真は Nationaal Archief（オランダ国立公文書館）の Anefo 収蔵で CC0。
