    card:
      <<: *chest
      highlight_row: 2
  - text: 2015年からはネットの会社、プラス500。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card:
      <<: *chest
      highlight_row: 3
  - text: 胸の名前では、いちばん長い7シーズンです。
    image: assets/images/20261111_kit_atletico/p_team14_w.jpg
    card: none
  - text: そして2023年からが、サウジアラビアの航空会社、リヤド・エア。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card:
      <<: *chest
      highlight_row: 4
  - text: 今季で4シーズン目です。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
    card: none
  - text: シャツを作るのは、2001年からナイキ。
    image: assets/images/20261111_kit_atletico/p_team15_w.jpg
