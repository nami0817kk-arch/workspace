# 取材メモ（10/2 題材 kubo_japan、型は news）。材料の控えは research/raw/20261002_kubo_japan.md。
# 同じ日に別の回で「試合全体（PK戦）」と「堂安が鈴木彩艶を評した話」を出す。この回は久保の代表での立ち位置に絞る。
# 前日公開の「久保建英、今季の公式戦は230分」（クラブの数字）と重ねない。クラブの話は1行だけ（ソシエダで先発を外れていた）。
# 事実の裏:
#   エクアドル戦: JFA 公式記録PDF（m02.pdf）で久保 #20 先発・67分OUT、堂安 先発・67分OUT、伊東 67分IN。0-0、PK5-4。
#     位置「右シャドー」はサッカーダイジェスト。堂安が右ウイングバックはゲキサカ。採点6.5はサッカーダイジェスト（10点満点）。
#     題材メモの「13分にエストゥピニャンに倒されてFK」は確かめられなかった（テキスト速報は14分のFKとだけ）。使わない。
#   W杯: JFA の日程と結果（日本時間）で 6/15 オランダ△2-2・6/21 チュニジア〇4-0・6/26 スウェーデン△1-1・6/30 ブラジル●1-2。
#     オランダ戦は先発し、後半30分（75分）に交代（スポーツナビ・J.LEAGUE.jp のテキスト）。後半12分の中村の同点弾は久保のパスから。
#     左ひざの負傷（ゲキサカ 6/18）。チュニジア（見出し）・スウェーデン（時事の本文）・ブラジル（森保監督の会見）を欠場。
#   9月からの3試合の出場時間: JFA の試合記録PDF＋スポーツナビの交代時刻。90分基準（追加時間は数えない）。
#     久保 27/45/67＝139分、堂安 63/19/67＝149分、伊東 27/45/23＝95分。3試合で久保の得点・アシストは無い。
#     9/24 は 63分に堂安と交代で入った。9/28 の終了間際に倒されてPK（上田が決めて2-1）は JFA の試合報告。PK戦についての本人の言葉は別の回の話なので入れていない。
#   発言はゲキサカ（竹内達也、10/1 22:44）の原文。「中村(敬斗)選手」は「中村選手」と読む（括弧は記者の補足）。
# 反応: Yahoo!ニュース（サッカーダイジェストの久保の記事）のコメント欄から、個人の投稿を頭から終わりまで3件。
#   スペイン語のソシエダのファンの声は取れなかった（Bluesky・Reddit は 403、Marca のコメント欄は JavaScript）。
# 写真: 冒頭はゲキサカの写真（©Kaoru WATANABE/GEKISAKA）の 16:9。数字の節からサッカーダイジェストの写真（金子拓弥）に1回だけ替える。
