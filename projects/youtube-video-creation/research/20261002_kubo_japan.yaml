  question: ワールドカップで負傷した久保建英は、いま日本代表でどこに立っているのか
  takeaway: ワールドカップで久保が出られたのは初戦オランダ戦の75分だけ。9月からの3試合は27分、45分、67分と出番が伸び、合計139分は堂安の149分に次いで伊東の95分を上回った。エクアドル戦では右で堂安と並んで先発し、右の攻撃の位置は1つの席を争うより2人を並べる形が試されている。その並びを続ける材料として、3試合でまだ無い得点とアシストが次に要る
