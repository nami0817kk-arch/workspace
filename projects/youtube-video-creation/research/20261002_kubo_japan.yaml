sections:
- id: start
  heading: 言われて気づいた先発
  tier: 報道
  telop: 久保建英「試合前に中村選手から『もしかしたらオランダ戦以来？』って聞かれて」
  narrator: キャスター
  say:
  - text: エクアドル戦で、久保建英が右のシャドーとして先発しました。
  - text: シャドーは、最前線のすぐ後ろで攻めに絡む位置です。
  - text: 代表での先発は、ワールドカップのオランダ戦以来。本人は、聞かれて初めてそれを知ったそうです。
  - voice: 久保建英
    text: 全然分からなかったけど、
  - voice: 久保建英
    text: 試合前に中村選手から
    cont: true
  - voice: 久保建英
    text: 『もしかしたらオランダ戦以来？』って聞かれて
    cont: true
  - voice: 久保建英
    text: 『そうじゃん』と思って。
    cont: true
  - voice: 久保建英
    text: 入場する時にホームのファン・サポーターの前で
    cont: true
  - voice: 久保建英
    text: 試合に出られたのは嬉しかったですね
    cont: true
  - text: 所属のソシエダでは、先発を外れる試合が続く中での先発でした。
  - text: 試合は0対0のままPK戦へ。久保は後半の途中で退き、日本が勝ったPK戦は、ベンチで見守りました。
  - text: 専門誌の採点は10点満点で6.5。本人は、こう振り返っています。
  - voice: 久保建英
    text: チームとしても色々とトライしていたし、
  - voice: 久保建英
    text: 個人としても仕掛けたりとか
    cont: true
  - voice: 久保建英
    text: 色々とトライしていこうと思っていたので、
    cont: true
  - voice: 久保建英
    text: ゴールを決められれば良かったけど
    cont: true
  - voice: 久保建英
    text: 満足はいく出来だったかなと思う
    cont: true
