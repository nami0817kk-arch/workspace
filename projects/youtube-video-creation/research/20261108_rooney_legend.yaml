# ウェイン・ルーニー（元イングランド代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-08。型は 11/6 トーレスと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Wayne Rooney の成績表・本文、2008 FIFA Club World Cup final）、BBC の試合記事・記録の記事、ダービー公式、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（家族・飲酒運転・移籍要求の騒ぎ・退場・PKの件は使わない）。監督としての成績は数字を出さない（小さく見せる言い方をしない）。
#
# **重なりの確認（2026-11-05）**：scripts/・research/covered.yaml・research/posted.json を「ルーニー／Rooney」で grep。主役の回は無し（ダウマンの記録の回・ケインの記録の回・代表出場数の回・マルティネスの回・ユナイテッドのクラブ紹介・カカの回に名前だけ。直近30日の主役の回は無い）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス）と重ならない。research/20261107_picks.txt（11/8：代表クロアチア・ブレーメン・コンテ）とも重ならない。
# **引退の確認（一次情報）**：ダービー・カウンティ公式「Derby County Confirm Wayne Rooney As New Manager」（2021-01-15、https://www.dcfc.co.uk/news/2021/01/wayne-rooney-derby-county-manager-15-january-2021 を requests で取得）に「Rooney has elected to call time on his illustrious playing career to fully focus on his job」。→ **選手としては現役ではない（41歳）**。監督は 2024-12-31 にプリマスを退任（英語版 Wikipedia。infobox の current_club は空）。いまの肩書きは台本で言わない。
# **日本との接点**：①2008年12月、日本開催のクラブW杯。12-18 準決勝 ガンバ大阪に5-3、ルーニー2点（ガンバは山崎・遠藤保仁のPK・橋本で3点）。12-21 決勝 横浜国際総合競技場 LDUキト0-1、49分にビディッチ退場、73分にロナウドのパスから決勝点。ゴールデンボール（大会の最優秀選手）（英語版 Wikipedia「2008 FIFA Club World Cup final」・本人の記事、BBC 2008-12-21 の試合記事）。②香川真司が2012年夏にユナイテッドへ（日本人で初めて）、2012-13 にリーグ優勝、香川は日本人で初めてのプレミア優勝（英語版 Wikipedia「Shinji Kagawa」）。2人は同じシーズンのチームメイト（ルーニーの記事に 2012-08-25 フラム戦で香川と交代して出場）。
# **数字の出どころと自分で足した値**
# - 成績表（英語版 Wikipedia、公式戦）：エヴァートン 1期目 77試合17点＋2期目 40試合11点＝117試合28点（自分で足した値）、ユナイテッド 559試合253点、DCユナイテッド 52試合25点、ダービー 35試合7点（DC＋ダービー＝87試合32点）。Career total 763試合313点（合計と一致）。
# - イングランド代表 120試合53点（Wikipedia）。クラブと代表の合計 883試合366点（自分で足した値：763+120、313+53）。**年代別代表は含めない**。
# - ユナイテッドの季ごと（公式戦）：2004-05 43/17、05-06 48/19、06-07 55/23、07-08 43/18、08-09 49/20 → 238試合97点（0.41）。09-10 44/34、10-11 40/16、11-12 43/34、12-13 37/16、13-14 40/19 → 204試合119点（0.58）。14-15 37/14、15-16 41/15、16-17 39/8 → 117試合37点（0.32）。合計 559/253 と一致。0.583÷0.408＝1.43→約1.4倍。
# - 2009年夏にロナウドとテベスが去った（Wikipedia の Style of play「2009–10 season … the first season since Ronaldo and Carlos Tevez departed United」）。2014-15 はファン・ハール監督のもとで中盤での起用が多かった（同）。
# - プレミアリーグの得点：67+15... ではなく、リーグ戦の列 エヴァートン15＋ユナイテッド183＋エヴァートン10＝208点。100アシストは 2016-11-06（史上3人目）、200点は 2017-08-21（シアラーに次いで2人目）（Wikipedia）。→「200点と100アシストの両方に、初めて届いた」と言う（「ただ1人」は今季のサラーなどを確かめていないので言わない）。
# - 16歳のアーセナル戦（2002-10-19）：17歳の誕生日の5日前、終了間際の決勝点、アーセナルの30試合負けなしを止めた、当時のプレミア最年少得点（のちにミルナー・ヴォーン・ダウマンが更新）（Wikipedia）。
# - 2004年8月末にユナイテッドへ。当時、20歳未満の選手として最も高い移籍金（金額は報道で割れるので言わない）。デビュー戦 2004-09-28 CL フェネルバフチェ戦 6-2 でハットトリック（Wikipedia、BBC 2017-01-07）。
# - 記録：2015-09-08 スイス戦（ウェンブリー）でPK、代表50点目でチャールトンの49点を抜く。2023年にケインが更新（Wikipedia の冒頭「record goalscorer from 2015 to 2023」）。2017-01-07 FAカップのレディング戦で249点目、チャールトンに並ぶ。チャールトンより215試合早い、記録は1973年から（BBC 2017-01-07 の記事）。2017-01-21 ストーク戦、終了間際のFKで250点目（Wikipedia）。
# - 2021-01-15 ダービー監督に正式就任と同時に選手をやめた。35歳（1985-10-24 生まれ）。監督はダービー・DCユナイテッド・バーミンガム・プリマスの4クラブ、2024-12-31 まで（Wikipedia）。
# **山場**：2011-02-12 マンチェスター・ダービー（オールド・トラッフォード）。前半ナニの得点で先制、後半シルバに当たったジェコのシュートで同点、78分（残り12分）にナニのクロスからオーバーヘッドキックで決勝点、2-1（BBC 2011-02-12 の試合記事、Wikipedia）。本人は試合後「キャリアでいちばんのゴール」、ファーガソンは「オールド・トラッフォードで見た最高のゴール」と話した（Wikipedia の地の文。語りで紹介するだけで、声の引用にはしない）。プレミアリーグ20年の賞（Premier League 20 Seasons Awards）のベストゴール（Wikipedia の冒頭）。
# **本人の言葉**：2017-01-07 チャールトンに並んだあと「This club is a huge part of my life and I'm honoured to be up there alongside Sir Bobby」（BBC 2017-01-07、https://www.bbc.com/sport/football/38097719 を requests で取得）。
# **マル秘話**：1995-96 にエヴァートンのU-10・U-11で29試合114点（114÷29＝3.93→およそ4点）。11歳でマージーサイド・ダービーのエヴァートンのマスコット。自陣から3度の得点（ユナイテッド・エヴァートン・DCユナイテッド。2019-06-27 オーランド戦が3度目）（Wikipedia）。
# **入れなかったもの**：家族・結婚・飲酒運転・移籍要求（2010・2013）・退場・PKの件・監督の勝率、移籍金の金額、「ただ1人」の200点100アシスト、クラブW杯の観客数（Wikipedia 68,682 と BBC 62,619 で割れる）、準決勝の得点の分、2010年の日本代表との親善試合（試合の記録をまだ一次情報で確かめていない）。
# **読みで怪しいもの**：ルーニー（ルウニイ）、エヴァートン（エバアトン）、ボビー・チャールトン、ガンバ大阪、LDUキト、遠藤保仁（やすひと）、香川真司、フェネルバフチェ、ダービー、DCユナイテッド、オールド・トラッフォード、ファン・ハール、プリマス、バーミンガム、ナニ、シルバ、ジェコ。「最多」は使わず「いちばん多い」。「2009-10」は書かない。
