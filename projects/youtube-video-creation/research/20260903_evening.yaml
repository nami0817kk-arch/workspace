    telop: 合意済みの移籍が期限直前に消滅
    say:
      - チェルシーが、モナコのラミン・カマラの獲得で合意していた移籍が、期限の直前に破談になりました。
      - スカイスポーツは、モナコが売却から手を引いた、と伝えています。
