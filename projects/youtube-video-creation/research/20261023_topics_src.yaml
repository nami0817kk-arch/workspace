  slot: 日本人
  head: 鈴木唯人のフライブルクがECLで初黒星。モナコに0-3、ハーフタイムで交代。日曜は首位争いのバイエルン戦
  why: 22日のECLリーグフェーズ第2節、モナコ3-0フライブルク（ゲキサカ）。鈴木は日本人で唯一の先発、ハーフタイムに交代。前半アディショナルタイム2分にブルナーが胸トラップのシャペウで先制、後半38分とAT2分にファティ（アンス・ファティ）が2得点。山本理仁と後藤啓介はベンチ入りで出番なし、モナコの南野拓実もベンチ入りで出番なし。フライブルクは今大会初黒星で1勝1敗。次のリーグ戦は日曜（25日）、**ケインのバイエルンを迎える**（ESPN：フライブルクは3位）。バイエルンはルイス・ディアスが離脱（題25）。**条件：日本代表には絡みません。本人の言葉は取れていません**。確度：確定（試合結果）。写真：コモンズに鈴木唯人は6件ほどと少ない。**弱い：交代の理由も本人の言葉も無い。鈴木唯人は10/12・10/20 にも扱い済み**。時刻：9〜17時。試験：X。
  src: ゲキサカ（モナコ対フライブルク）、ESPN（日曜のバイエルン戦）
  url: https://web.gekisaka.jp/news/world/detail/?461624-461624-fl
