title: 10月23日のショート題材
lead: 候補499件から27件（日本人5件・海外22件）。ショート10本ぶんを○で選んでください。
note: 今日は金曜（23日）。昨夜（日本時間22日夜〜23日朝）はEL・ECLの第3節（ECLは第2節）でした：ボーンマス3-0ミラン、ホッフェンハイム3-0リヨン、ユヴェントス2-2レンヌ、ベシクタシュ2-2パレス、ソシエダ6-0リレストロム、セルティック1-2セルタ、ダイナモ・ザグレブ2-4NEC、ヘタフェ2-5ルガーノ、シュトゥルム・グラーツ1-0マルセイユ、モナコ3-0フライブルク、アヤックス2-0アタランタ。土曜（24日20時30分）にヴィラ対マンC、<b>日曜（25日）にクラシコ（バルサ対レアル）</b>、マンU対ボーンマス、PSG対リヨン、フライブルク対バイエルン、<b>月曜（26日）にバロンドールの授賞式（ロンドン）</b>があります。<br><br><b>日本人の題は5件だけです。</b>日本人選手が出たのは久保（EL初先発）、鎌田（フル出場）、中村敬斗・町田（ホッフェンハイム対リヨン）、鈴木唯人（ECL）、事前の話題として鈴木彩艶対ハーランドです。<b>どれも新しい出来事は小さく、強い題材は無いので5件とも『弱い』にして、無理に数を揃えていません</b>。中山雄太・鈴木淳之介（ECL）はセルビア・デンマークのクラブで7リーグの外のため除きました。日本代表（11/14 ブラジル戦）に絡む新しい話は、今朝は取れていません（上田綺世・三笘薫の新情報なし）。<br><br><b>ヒットの条件：</b>全27件のうち、本人の言葉（監督を含む）が取れたのは19件、日本代表・W杯に絡むのは4件（鈴木彩艶、ケイン、ライス、フォーデンの代表落選）。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外の題。各行の最後に「時刻：」で書きました。<br><br><b>バロンドールとクラシコの話：</b>題6〜10はバロンドール（月曜）とクラシコ（日曜）に近い話です。ケインが3件（題6・7・8）に重なるので、選ぶなら1〜2件までを推奨します。ヴィニシウスの4試合出場停止そのものは10/15 の本で扱い済みなので、題10はモウリーニョのディオマンデ評を主にしました。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりのため<b>読めませんでした</b>。移籍の題は出典1本の噂ばかりで、出していません。スカイ・スポーツのライブブログ（ブライトン・サンダーランド・ブレントフォード・ボーンマス・マンC）は本文が取れず見出しのみです。ASの『ファティ』は403で読めず、ゲキサカの記事で代えました。ESPNの『ブルーノ・ギマランイス』『ラフィーニャ』『マンUの休み』は記事APIで本文を読みました。フットマルカトはページの組み立てを読み替えて本文を読みました。コモンズの件数は検索のヒット数で、同名の人物が混ざる選手は『探し直し』と書きました。<br><br>除いた候補は下の「落とした候補」に理由を付けています。女子サッカー・Jリーグ・MLS・リーガMXは出していません。FotMobは使っていません。
