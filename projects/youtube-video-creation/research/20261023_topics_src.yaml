  slot: 海外
  head: ケイン「妻は先に知りたがっている」。バロンドール発表を待つ家族の重圧、「楽しむしかない」
  why: ガーディアン：授賞式は月曜夜、ロンドン・パラディウム。ケインは最有力で、2番手がヤマル、3番手がムバッペ（賭け率）。ケインは昨季バイエルンで61点・代表で12点、今季はバイエルン10点・代表6点。本人は「妻は知りたがっていると思う。家族みんなにとってとてもストレスだ」「発表しない理由はわかる。皆が来るし、結果を知らなければ見る人も増える」「僕としては先に知りたい。一晩中待たなくて済むから。でも主催者の決めることで、僕には変えられない。楽しむしかない」「考えないようにしている。でも難しい。噂が飛び交うから、離れるようにしている」。ESPNは、ケインがイングランドを2度目のW杯4強に導いたことも挙げる。**条件：本人の言葉に当たる。代表・W杯（イングランド4強）に当たる**。受賞者は未発表なので予想は書かない。確度：確定（発言）。10/22 の『ムバッペが語ったバロンドールの条件』とは別の人物の発言。写真：コモンズに多数。時刻：18時以降。試験：Y（本人の一言）。
  src: ガーディアン（記事本文）、ESPN（バロンドールの有力候補）
  url: https://www.theguardian.com/football/2026/oct/22/harry-kane-ballon-dor-wait-very-stressful-family
  fmt: quote
- num: 7
  slot: 海外
  head: ライス「ケインが文句なしの勝者だ」。バロンドールに同じイングランド代表の名を挙げる
  why: アーセナルのライスが英TNTスポーツに。「彼が文句なしの勝者だよ。数字がすべてを物語っている。彼にとって、この1年は驚異的なものだった」「一緒にプレーすれば、彼がいかに優れているかがわかる。逆に相手として対峙すれば、どれほど厄介な存在か痛感させられる」（サッカーキングの引用）。21日のバイエルン戦ではライスが82分に同点弾（10/22 の本）。**条件：本人の言葉（ライス）に当たる。代表（イングランド）の同僚の話**。確度：報道（二次の引用。TNTスポーツの原文は未確認）。**弱い：題6（ケイン）と同じ週・同じ話で、続けて出すと重なる。どちらか一方を推奨**。写真：コモンズにライスは128件ほど（同名混入あり）。時刻：18時以降。試験：Y。
  src: サッカーキング（TNTスポーツの引用）
  url: https://www.soccer-king.jp/news/world/cl/20261022/2219807.html
  fmt: quote
  weak: true
- num: 8
  slot: 海外
  head: ケイン、CLで10試合連続ゴール。最長のC・ロナウド（11試合）まであと1
  why: 21日のバイエルン2-2アーセナルで、ケインは61分にPKを決め、35分にはスルーパスでA・デイヴィスの同点弾を演出。POTM。UEFA.comとSquawkaによれば、CLで**10試合連続ゴールはC・ロナウドに次いで史上2人目**（最長は11試合）。試合後DAZNで「良いパフォーマンスだったと思う。最後の15分は押し込まれて失点した」「引き分けは妥当だったかもしれない。ファイナルサードの精度をもう少し高められた」「アルフォンソ・デイヴィスの速さを活かして背後に走らせる形はずっと脅威だった」（サッカーキング）。**条件：本人の言葉に当たる。日本は無し**。確度：確定（記録・発言）。**注意：題6・7と同じ週のケイン。3本とも選ぶと重なるので、記録は別の枠として1本だけ**。写真：コモンズに多数。時刻：18時以降。試験：X または Y。
  src: サッカーキング（UEFA.com・DAZNの引用）
  url: https://www.soccer-king.jp/news/world/ger/20261022/2219590.html
  fmt: news
- num: 9
  slot: 海外
  head: ムバッペ「僕らのような選手は満足することは決してない」。不調のヴィニシウスには「最高の選手だ」
  why: 21日、CL第3節レアル4-1ライプツィヒ。ムバッペは1ゴール1アシストでMOM。公式戦3試合連発で今季12点（サッカーキング）。クラブ公式サイト経由：「僕はもっとできると思う。僕は常により多くを求められる数少ない選手の1人だ。僕のような選手にとって満足することは決してない」「エル・クラシコは完全に別物だ」。Movistar Plusで、出場機会が減り、途中で代わったディオマンデが1ゴール1アシストだったヴィニシウスについて：「ヴィニシウスなら大丈夫だよ。彼が落ち込むのは理解できる。チームやファンのために貢献したい思いが強いからね」「冷静になって、自分を認めてあげてほしい。彼は素晴らしい才能を秘めた最高の選手なんだから」。次は25日、バルサの本拠地でのクラシコ。**条件：本人の言葉に当たる。日本・W杯は無し**。確度：確定（クラブ公式・Movistar Plusの引用）。10/22 の『ムバッペが語ったバロンドールの条件』（フランス・フットボール誌）とは別の発言。写真：コモンズにムバッペは多数。時刻：18時以降。試験：Y。
  src: ゲキサカ（クラブ公式サイトの引用）、サッカーキング（Movistar Plusの引用）
  url: https://web.gekisaka.jp/news/ucl/detail/?461580-461580-fl
  fmt: quote
- num: 10
  slot: 海外
  head: モウリーニョ「彼は成長する」。ヴィニシウス不在のクラシコで、左のディオマンデに任せるのか
  why: BBC：レアルは日曜のクラシコから**ラ・リーガ3試合でヴィニシウスを使えない**（4試合出場停止。処分の件は10/15 の本）。前の週末のセビージャ戦（4-1）はムバッペ中央、右エンドリック、左ディオマンデ、中盤ベリンガムで「今季最も完成度の高い攻撃」。ライプツィヒ戦はヴィニシウスとギュレルを並べ、69分にヴィニシウスと代わったディオマンデが豪快なボレーで4点目。ディオマンデは1.5億ユーロの移籍で、今季3得点4アシスト、直近6試合で5試合先発。モウリーニョ：「彼は誠実に懸命に働く。謙虚で、学ぶ意欲がある。私とチームメイトの話をよく聞く。成長するよ」「改善点は多いが素晴らしい試合だった。成長している」。「誰も外せない選手ではない」とも明言。**条件：本人の言葉（モウリーニョ）に当たる。日本・W杯は無し**。確度：確定（発言）＋BBCの見立て（先発は未発表なので予想は書かない）。**注意：コモンズのディオマンデは12件と少ない。写真が3枚そろわなければ止めて報告**。時刻：18時以降。試験：Y。
  src: BBC（レアルの攻撃の選択肢、本文）
  url: https://www.bbc.co.uk/sport/football/articles/cq70pj7p0ep6o
  fmt: quote
- num: 11
  slot: 海外
  head: クルトワ「ここで現役生活を終えることが目標だ」。レアルとの契約延長の話し合いを認める
  why: 21日のライプツィヒ戦後のミックスゾーンで、契約について聞かれたクルトワは「契約更新について話し合いを進めている」「ここで現役生活を終えることが目標だ」と話した（スペインのRNE Deportesの報道をサッカーキングが引用）。現行契約は2027年6月30日まで。マルカは2028年6月30日までの延長に迫ると報じていた。レアルは30歳を超える選手には単年の延長を提示するのが通例。34歳、2018年夏にチェルシーから加入し、クラブ通算345試合、CL2回・ラ・リーガ3回の優勝。**条件：本人の言葉に当たる。日本は無し**（ベルギー代表）。確度：報道（二次の引用。RNEの原文は未確認）。契約の金額・年数は本人が言っていないので書かない。写真：コモンズにクルトワは165件ほど。時刻：18時以降。試験：Y。
  src: サッカーキング（RNE Deportesの引用）
  url: https://www.soccer-king.jp/news/world/esp/20261022/2219906.html
  fmt: quote
- num: 12
