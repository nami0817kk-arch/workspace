  head: ルーニー「あいつらは赤ちゃんだ」。ブルーノは主将続投、処分なし。日曜のボーンマス戦へ
  why: BBC：ブルーノ・フェルナンデスは主将を続け、コモ戦（1-4）後の戦術批判で処分は受けない。8日前にはマルティネスが強化部長ウィルコックスと夏の補強を批判していた。ルーニー（United Standのポッドキャスト）：「ショックだ」「ここ長い間で一番心配している」「マルティネスが出てきたとき、更衣室を引き裂く悪夢だと言った。それが始まりだった。ブルーノの件で、これからもっと見ることになる」「あの選手たちは身勝手だ。チームメイトも監督もスタッフもファンも気にせず、自分のことしか考えない。思い通りにならないと、赤ちゃんのようにおもちゃを放り投げて、責任を他人のせいにする」。キャリックには「戦って出てこい」。キャリックは金曜13時30分（英国）に会見し、日曜のボーンマス戦を指揮する。ESPN：マンUは公式戦7試合未勝利、PL13位。**条件：本人の言葉（ルーニー）に当たる。日本は無し**。確度：確定（BBCがポッドキャストから引用）。**弱い：ブルーノの件は10/22 の本と重なる。選手を貶す言葉が強いので、題に使わず発言の紹介にとどめる。ブルーノの自宅の窃盗の報道は私生活なので扱わない**。写真：コモンズにルーニーは多数。時刻：18時以降。試験：Y。
