  head: NEC、欧州の大会で2008年以来の勝利。ダイナモ・ザグレブに4-2、シュロイダー「選手が数週間、自信をくれている」
  why: 22日のEL、ダイナモ・ザグレブ2-4NEC（ESPN）。ハーフタイムは2-2（リンセンの同点弾）、後半にチェリーが2得点（ヴィ・ネーデルランド）。NECは**2008-09シーズン以来の欧州の大会で、今季初勝利**。シュロイダー監督：「チームへの信頼は大きい。数週間、彼らが私にそれを与えてくれている」「ふさわしい勝利で、盗んだものではない」「紙の上では相手の方が上だ」「この勝利だけを見ていない。もう次を考えている。日曜のフローニンゲン戦が先だ」。**条件：本人の言葉（監督）に当たる。日本は無し**。確度：確定。**弱い：オランダのクラブで世界的な大きさは無い**。写真：コモンズにチェリーは8件と少ない。時刻：18時以降。試験：Y。
  src: ヴィ・ネーデルランド（シュロイダーの会見）、ESPN（結果）
