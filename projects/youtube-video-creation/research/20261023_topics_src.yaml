  slot: 日本人
  head: 久保建英、ELは初先発。ソシエダは敵地で6-0、守備のスライディングとプレスバックが目立った
  why: 22日のELリーグフェーズ第3節、リレストロム0-6ソシエダ（ゲキサカ）。久保は前節ラ・リーガのマラガ戦に続き2試合連続の先発で右サイドハーフ。ここまでのEL2試合はサブで1分1敗だった。前半16分、相手のカウンターに懸命に追走してスライディングで奪い切り、42分にも鋭いプレスバックで奪取。後半7分にはドリブルの中央突破で相手の足が腹部に当たって倒れ、相手にイエロー。後半13分（58分）にパブロ・マリンと交代。得点はS・ゴメス2、L・スチッチ2、オスカールソン、ザハリャン。ソシエダは今季EL初勝利。**条件：日本代表には絡みません。本人の言葉は取れていません**。確度：確定（試合結果・プレー）。写真：コモンズに久保は10件ほどと少ない。**弱い：久保は10/19〜10/21 に連日。本人のゴール・アシストは無く、『守備の貢献』が中心**。久保の妻の観戦記事は私生活なので使いません。時刻：9〜17時。試験：B。
  src: ゲキサカ（リレストロム対ソシエダ）
  url: https://web.gekisaka.jp/news/uel/detail/?461620-461620-fl
  fmt: news
  weak: true
- num: 4
  slot: 日本人
  head: 中村敬斗に1試合の出場停止と1試合の執行猶予。リヨンはELでホッフェンハイムに0-3、町田浩樹は77分から
  why: フランスのプロリーグ機構（LFP）は21日、18日のニース戦で一発退場した中村に**1試合の出場停止と1試合の執行猶予**を科した（ゲキサカ）。後半25分、浮き球に右足を伸ばした際に足裏が相手の腹部に入って退場。仏紙ル・プログレは、故意ではなかったこと、中村がすぐに相手の状態を確認して謝罪したことも考慮されたと伝える。次のリーグ戦（25日のPSG戦）は欠場。22日のELには適用されない。そのELでホッフェンハイムに0-3、中村は先発、町田は77分に途中出場（ゲキサカの出場メンバー）。PSG-OL戦は街の抗議行動のため延期の可能性が報じられている（フットマルカト。LFPは自ら延期を求めない立場）。**条件：日本代表には絡みません。本人の言葉は新しく取れていません**（謝罪は10/21 の本で扱い済み）。確度：確定（処分）。写真：コモンズに中村は19件、町田は10件ほど。**弱い：中村は10/19・10/21 に連日。処分の発表自体は小さい出来事**。時刻：9〜17時。試験：X。
  src: ゲキサカ（LFPの処分・出場メンバー）、フットマルカト（PSG-OLの延期案）
  url: https://web.gekisaka.jp/news/world/detail/?461612-461612-fl
