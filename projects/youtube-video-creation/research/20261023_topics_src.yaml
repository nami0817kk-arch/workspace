  slot: 日本人
  head: 鈴木彩艶、24日（日本時間20時30分）にハーランドと対決へ。マンCのマレスカ監督は「100%出場可能」
  why: マンCのマレスカ監督は24日のPL第8節アストン・ヴィラ戦に向け、ハーランドが出場可能だと明言した。「アーリングは100%出場可能だ。他の3人については今日の練習を待つ必要がある」「ボールを持っていないときの強度が非常に高い。彼らは良い状態にあり、勝利を重ねている。厳しい試合になることは間違いない」。ハーランドは今季公式戦12得点。前節イプスウィッチ戦で足を痛めた様子を見せ、直近のCL・AEKアテネ戦はベンチ入りで出場は無かった。シティは開幕7連勝中、ヴィラは公式戦6試合無敗。会場はヴィラ・パーク、日本時間24日20時30分キックオフ（ゲキサカ）。**条件：日本代表（GK）に当たる。鈴木本人の言葉は取れていません**（監督の言葉のみ）。確度：確定（監督の発言・日程）。写真：コモンズに鈴木彩艶は24件ほど、ハーランドは多数。**弱い：新しい出来事は『試合前の見通し』だけ。鈴木彩艶は10/18・10/21・10/22 と連日**。試合後（24日）に続報が出るので、今日出すなら『対決の見どころ』に絞る。時刻：9〜17時。試験：X。
  src: ゲキサカ（マンC指揮官の会見）
  url: https://web.gekisaka.jp/news/world/detail/?461601-461601-fl
  fmt: news
