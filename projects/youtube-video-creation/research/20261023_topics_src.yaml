  slot: 日本人
  head: 鎌田大地、EL・ベシクタシュ戦にフル出場。左で仕掛けたプレスがマテタの逆転弾の起点に、パレスは2-2
  why: 22日のELリーグフェーズ第3節、ベシクタシュ2-2クリスタル・パレス（ゲキサカ・ガーディアン）。鎌田はウォートンと2ボランチを組んでフル出場。後半10分、左サイドで鎌田がプレスを仕掛けて相手のパスミスを誘い、拾ったマテタが左足で決めて2-1。その後ベシクタシュが追いつき、後半33分にアクダグが一発退場したがパレスは勝ち越せなかった。後半36分に鎌田が倒されたように見えたがPKは無し。冨安健洋は負傷中でメンバー外。パレスは日曜のブライトン戦に0-5で敗れた後で、**開幕節以来の勝利はならず**。次のELは11月5日、町田浩樹のホッフェンハイム戦。**条件：日本代表には絡みません。本人の言葉は取れていません**。確度：確定（試合結果）。写真：コモンズに鎌田は38件ほど。**弱い：鎌田は10/16・10/19 の本で扱い済みで、今日の出来事は『プレスが得点の起点』だけ**。時刻：9〜17時。試験：B。
  src: ゲキサカ（鎌田フル出場）、ガーディアン（EL結果）
  url: https://web.gekisaka.jp/news/uel/detail/?461621-461621-fl
  fmt: news
  weak: true
