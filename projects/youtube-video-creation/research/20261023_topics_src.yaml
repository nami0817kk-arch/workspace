  head: ジェネシオ（マルセイユ）「前半の姿勢にがっかりした」。EL・シュトゥルム・グラーツに0-1
  why: 22日のEL第3節、シュトゥルム・グラーツ1-0マルセイユ。ジェネシオ監督（記者会見、フットマルカトの引用）：「前半にがっかりしている。ミスは起こりうる。例えばカミ（カミソコ）が失点につながるボールを失ったのは、責めない。サッカーの一部で、学びだ。でも前半の姿勢にがっかりだ。あらゆる競り合いで支配され、激しい所でぶつけられて、応えられなかった」。日曜のル・アーヴル戦は17時15分の予定だったが、PSG-OLが延期になった場合に20時45分へ移す案がLFPから示された。ジェネシオ「20時45分でも準備は大きく変わらない。気がかりはサポーター」。**条件：本人の言葉に当たる。日本は無し**。確度：確定（会見）。**弱い：マルセイユの一敗と日程の話で、世界的な大きさは無い。選手の名を出して貶す題にしない**。写真：コモンズにジェネシオは17件ほど。時刻：18時以降。試験：Y。
