  title: 堂安律「間違いなく世界一のキーパーになる」。蹴る側が鈴木彩艶に感じるもの
  opening_image: assets/images/20261002_doan_zion_suzuki_w/01.jpg
  takeaway: 2010年からの日本代表のPK戦は5回。W杯の2回は日本のキーパーが1本も止められずに敗れ、勝ったのは川島永嗣が2本止めた2011年の韓国戦が最後だった。鈴木彩艶は自分からボールを手渡して間を作り、3人目で先に動いて1本を止めた。堂安の言う「ボールを置いた瞬間の圧」は、キックの前から始まっている
short_title: 堂安律「世界一のキーパーになる」。PK戦で鈴木彩艶がしていたこと
