  - text: 手渡しで相手のリズムを崩し、先に動くと決めて飛ぶ。
    image: assets/images/20261002_doan_zion_suzuki_w/01.jpg
  - text: 堂安の言う「置いた瞬間の圧」は、キックの前から相手にかかっています。
  - text: 次にPK戦で向き合うキッカーは、ボールを置く前から、この24歳を相手にすることになります。
