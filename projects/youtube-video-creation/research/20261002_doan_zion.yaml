# 取材メモ（10/2 題材 doan_zion、型は quote）。材料の控え: research/raw/20261002_doan_zion.md
# 主役は堂安律が鈴木彩艶を評した言葉と、鈴木本人の言葉。同じ日に「試合全体（PK戦の5人・先発・森保監督）」と
# 「久保の代表先発」の回があるので、キッカー5人・森保監督・久保の話は入れない。
# 前日の「月間MVP」の回（移籍金・9月の5試合・トッテナム戦の配球）とは重ねない。
# 事実の裏:
#   試合: 10/1 キリン杯準決勝 日本 0-0（PK5-4）エクアドル。鈴木がエクアドルの3人目（カスティージョ）を止め、日本は5人全員成功。
#   堂安: サッカーダイジェスト 197909 の文字起こしのまま。キャプテンで先発、後半22分に交代、PK戦はベンチから（ゲキサカ 460123）。
#   鈴木: 「相手のリズムを狂わせようかなと」「先に動くことを意識してたので、相手の特徴を見ながら」（FOOTBALL ZONE 676935）、
#     「できればもう一本…」（ゲキサカ 460129）、「ミスキック」「ゴールを守ること」（サッカーダイジェスト 197930）。（笑）は外した。
#   採点: 鈴木7・佐野海舟7で最高タイ（サッカーダイジェスト 197856）。
#   PK戦の歴史: 2010 パラグアイ（全員に決められた）／2011 韓国（川島が2本止めた、日経）／2015 UAE／2022 クロアチア（唯一の失敗はポスト）。
#     2015 の3人目が止めたものか枠外かは分からないので、止めた本数は W杯の2回と 2011 だけ言う。
#   ヴィラ公式Xと英語のファンの声は原文が取れなかった（raw の 5.）。
# 流れの点検（Claude が自分で読んだ。控え output/flow/20261002_doan_zion.md）で直したこと:
#   PK戦の表を時系列で読む形に（「その前に勝ったのは」が何の前か曖昧だった）／「止めたのは1本」を2つの節で言っていた → 見立ての側を言い換え
#   「相手の3人目」→「3人目のキック」と冒頭で試合の流れを2行に分けた／short_only の前置きは次の行と同じ中身になるので外した
#   ミスキックの発言は「もちろんチャンスになったシーンもありますし、」から引く（「全然、」から始まると唐突）
# 写真: ゲキサカ（©Kaoru WATANABE/GEKISAKA）のエクアドル戦の2枚。冒頭は鈴木の 16:9、堂安が語る行は 堂安（左）＋鈴木（右）。
