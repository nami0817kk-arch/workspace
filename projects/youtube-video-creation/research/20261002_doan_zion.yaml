sections:
- id: pressure
  main: true
  heading: ボールを置いた瞬間の圧
  tier: 報道
  telop: 堂安「間違いなく僕は世界一のキーパーになると思う」
  narrator: キャスター
  say:
  - text: 10月1日の日本対エクアドルは、90分で点が入らずPK戦へ。
    image: assets/images/20261002_doan_zion_suzuki_w/01.jpg
  - text: 鈴木彩艶が3人目のキックを止め、日本はPK戦を5対4で勝って、キリンカップの決勝へ進みました。
  - text: キャプテンの堂安律は、PK戦をベンチから見ていました。試合のあと、鈴木の存在感をこう話しています。
    image: assets/images/20261002_pair_doan_zion/01.jpg
  - voice: 堂安律
    text: 圧がすごいですね。
  - voice: 堂安律
    text: ただデカいというのと、
    cont: true
  - voice: 堂安律
    text: やっぱり、蹴り手としては立った瞬間、
    cont: true
  - voice: 堂安律
    text: ボールを置いた瞬間に圧というのは重要になってくる。
    cont: true
  - voice: 堂安律
    text: あとはもう彼の能力
    cont: true
  - text: そして最後に、こう言い切りました。
  - voice: 堂安律
    text: 間違いなく僕は世界一のキーパーになると思う。
  - voice: 堂安律
    text: 非常に頼もしいキーパーが出てきてくれたなと思います
    cont: true
  quotes_from:
  - サッカーダイジェスト https://www.soccerdigestweb.com/news/detail/id=197909
  sources:
  - https://www.soccerdigestweb.com/news/detail/id=197909
  - https://web.gekisaka.jp/news/japan/detail/?460123-460123-fl=
  - https://web.gekisaka.jp/news/japan/detail/?460121-460121-fl=
- id: stop
  heading: 先に動いた3人目
  tier: 報道
  telop: 鈴木「先に動くことを意識してたので、相手の特徴を見ながら」
  narrator: キャスター
  say:
  - text: 鈴木本人はPK戦で、キッカーに自分からボールを手渡していました。
    image: assets/images/20261002_doan_zion_suzuki_w/01.jpg
  - voice: 鈴木彩艶
    text: 相手のリズムを狂わせようかなと
  - text: キッカーの目線やキックの癖を見て、先に飛ぶか、ボールを見てから反応するかを決める。
  - text: 止めた3人目は、先に飛ぶほうでした。
  - voice: 鈴木彩艶
    text: 先に動くことを意識してたので、相手の特徴を見ながら
  - text: 止めたのは1本だけ。その場面の駆け引きを、本人が明かしています。
  - voice: 鈴木彩艶
    text: できればもう一本止めて落ち着かせていたかったですけど、
  - voice: 鈴木彩艶
    text: まず最低限一本止められたらなと思っています
    cont: true
  quotes_from:
  - FOOTBALL ZONE https://www.football-zone.net/archives/676935
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?460129-460129-fl=
  sources:
  - https://www.football-zone.net/archives/676935
  - https://web.gekisaka.jp/news/japan/detail/?460129-460129-fl=
- id: kick
  heading: ミスキックでも沸いたスタンド
  tier: 報道
  telop: 鈴木「ゴールを守ることが常に僕の中では1番の優先順位」
  narrator: キャスター
  say:
  - text: 試合のあいだ、スタンドがいちばん沸いたのは、鈴木の長いキックでした。
  - text: 堂安も、ピッチのサイドから「すげえなって言いながら」見ていたそうです。
  - text: ただ、本人の受け止めは少し違います。
  - voice: 鈴木彩艶
    text: もちろんチャンスになったシーンもありますし、
  - voice: 鈴木彩艶
    text: 全然、ミスキックになってしまってもスタンドが沸いていた。
    cont: true
  - voice: 鈴木彩艶
    text: 自分としてはミスキックだなと思いながらも
    cont: true
  - voice: 鈴木彩艶
    text: 今日のゲームなんかもキックに目がいきがちですけど、
  - voice: 鈴木彩艶
    text: やっぱりゴールを守ることが常に僕の中では1番の優先順位
    cont: true
  - text: この試合の採点で、鈴木は佐野海舟と並ぶチーム最高の7でした。
  quotes_from:
