- id: data
  heading: イプスウィッチ 基礎DATA
  main: true
  tier: 背景
  telop: 1878年創立
  narrator: 解説
  say:
  - short_only: true
    text: 前田大然の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_ipswich_data0.png
    text: 創立は**1878年**です。
    no_telop: true
  - image: assets/backgrounds/stadium_イプスウィッチ_in.png
    text: 本拠地はポートマン・ロード。**約3万人**が入ります。
  - image: assets/stats/pl_ipswich_map.png
    text: ホームタウンはイプスウィッチ。イングランド東部サフォーク州です。
    no_telop: true
  - image: assets/stats/pl_ipswich_data3.png
    text: オーナーは、アメリカの投資グループ「ゲームチェンジャー・トゥエンティ」。2021年からです。
    no_telop: true
  - image: assets/stats/pl_ipswich_cups.png
    text: 1部リーグの優勝が**1回**。FAカップ1回、そしてヨーロッパのウエファカップも1回獲っています。
    no_telop: true
  - image: assets/stats/pl_ipswich_data7.png
    text: プレミアでの最高位は、昇格1年目、2000年から01年の**5位**です。
    no_telop: true
  - image: assets/stats/pl_ipswich_data7.png
    text: 2025年に2部へ落ち、昨季は2部で**2位**に入って1年で戻ってきました。
    no_telop: true
  - image: assets/stats/pl_ipswich_data8.png
    text: 愛称は「トラクター・ボーイズ」。農業の盛んな土地で、自分たちを茶化した呼び名です。
    no_telop: true
  - image: assets/stats/pl_ipswich_data8.png
    text: 青いシャツから、「ブルーズ」とも呼ばれます。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  bg: assets/backgrounds/stadium_イプスウィッチ.png
  official: false
- id: champion
  heading: 上がった年に、優勝した
  tier: 背景
  telop: 1961-62年。率いたのはアルフ・ラムゼイ
  narrator: 解説
  card:
    type: table
    title: 残してきた記録
    columns:
    - ''
    - ''
    rows:
    - - 1961-62年
      - 1部初挑戦で優勝
    - - 1981年
      - UEFAカップ優勝（AZに5-4）
  say:
  - '**1部に上がった、その最初のシーズンに優勝しました。**1961年から62年のことです。'
  - 率いたのはアルフ・ラムゼイ。のちにイングランドを1966年のワールドカップ優勝に導きます。
  - 1981年には、ウエファカップも制しました。
  - 決勝はオランダのエーゼット・アルクマール。2試合合計5対4で勝ちました。
  - この時期に指揮していたのがボビー・ロブソン。1969年から82年まで、**709試合**を指揮しました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  bg: assets/backgrounds/stadium_イプスウィッチ.png
