- id: data
  heading: イプスウィッチ 基礎DATA
  main: true
  tier: 背景
  telop: 1878年創立
  narrator: 解説
  say:
  - short_only: true
    text: 前田大然の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_ipswich_data0.png
    text: 創立は**1878年**。フットボールリーグに加わったのは1938年です。
    no_telop: true
  - image: assets/backgrounds/stadium_イプスウィッチ_in.png
    text: 本拠地はポートマン・ロード。**3万56人**が入ります。場所はイングランド東部のサフォーク州です。
  - image: assets/stats/pl_ipswich_map.png
    text: ホームタウンはイプスウィッチ。イングランド東部サフォーク州です。
    no_telop: true
  - image: assets/stats/pl_ipswich_data3.png
    text: オーナーは、アメリカの投資グループが集まったゲームチェンジャー20。2021年からです。
    no_telop: true
  - image: assets/stats/pl_ipswich_data4.png
    text: 1部リーグの優勝が**1回**。FAカップ1回、そしてヨーロッパのUEFAカップも1回獲っています。
    no_telop: true
  - image: assets/stats/pl_ipswich_data7.png
    text: プレミアでの最高位は、2000年から01年の**5位**です。
    no_telop: true
  - image: assets/stats/pl_ipswich_data8.png
    text: 愛称は「トラクター・ボーイズ」。農業の盛んな土地で、自分たちを茶化した呼び名です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  bg: assets/backgrounds/stadium_イプスウィッチ.png
  official: false
- id: champion
  heading: 上がった年に、優勝した
  tier: 背景
  telop: 1961-62年。率いたのはアルフ・ラムゼイ
  narrator: 解説
  card:
    type: table
    title: 残してきた記録
    columns:
    - ''
    - ''
    rows:
    - - 1961-62年
      - 1部初挑戦で優勝
    - - 1981年
      - UEFAカップ優勝（AZに5-4）
  say:
  - '**1部に上がった、その最初のシーズンに優勝しました。**1961年から62年のことです。'
  - 率いていたのはアルフ・ラムゼイ。のちにイングランド代表を率いる監督です。
  - 1981年にはUEFAカップを制しました。決勝は2試合の合計で、AZに5対4です。
  - この時期に指揮していたのがボビー・ロブソン。1969年から82年まで、**709試合**を指揮しました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
