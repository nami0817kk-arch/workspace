sections:
- id: matsuki
  main: true
  heading: 初ゴールのあと、2試合出番なし
  tier: 報道
  telop: 松木玖生「自分が劣っているとは一切思わないし、違いを作れると思っている」
  narrator: キャスター
  say:
  - text: 代表デビュー戦で点を取った若手が、決勝を前に強気の言葉を残しました。
    short_only: true
    image: assets/images/20261004_kirin_final_eve/01_w.jpg
  - voice: 松木玖生
    text: 5大リーグでやっている選手もいる中、
  - voice: 松木玖生
    text: 自分が劣っているとは一切思わないし、
    cont: true
  - voice: 松木玖生
    text: 違いを作れると思っている
    cont: true
  - text: 初めて日本代表に呼ばれた松木玖生。
  - text: 初戦のウルグアイ戦で先発し、前半11分に代表初ゴールを決めました。
  - text: ところが、続くベネズエラ戦は試合のメンバーから外れ、エクアドル戦はベンチから見届けました。
  - text: 決勝の舞台は国立競技場。高校選手権で優勝し、プロになってからも結果を残してきた場所です。
  - voice: 松木玖生
    text: 結構相性がいいと思うので、出たら決められると思う
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?460258-460258-fl=
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?460258-460258-fl=
  - https://soccer.yahoo.co.jp/japan/category/men/game/2026092401/text
- id: goto
  heading: 上田綺世から学ぶポストプレー
  tier: 報道
  telop: 後藤啓介「綺世くんは技術で勝負している」
  narrator: キャスター
  say:
  - text: 長身のフォワード、後藤啓介は、ベネズエラ戦で先発しました。
    image: assets/images/20261004_kirin_final_eve/02_w.jpg
  - text: 前半で交代し、エクアドル戦は出番を待ったまま終えています。
  - text: 代表では6試合に出て、初ゴールはまだこれからです。
  - text: 前線で体を張ってボールを収めるポストプレー。その手本にしているのが、エースの上田綺世です。
  - voice: 後藤啓介
    text: ポストプレーの部分は学ぶことしかない
  - voice: 後藤啓介
    text: 綺世くんは技術で勝負している。
  - voice: 後藤啓介
    text: ぶつけるタイミング、角度とか
    cont: true
  - voice: 後藤啓介
    text: そういうところを学んでいきたい
    cont: true
  - text: その上田も、代表で初めて点を取ったのは14試合目でした。
  - text: 後藤が理想に掲げるのは、バイエルンのハリー・ケイン。点を取ることには、とことんこだわっています。
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?460259-460259-fl=
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?460259-460259-fl=
  - https://soccer.yahoo.co.jp/japan/category/men/game/2026092801/text
- id: sano
  heading: 初戦のあと、ベンチで待った2試合
  tier: 報道
  telop: 佐野航大「チャンスが来たら掴むというのはずっと変わらずに思っていること」
  narrator: キャスター
  say:
  - text: 佐野航大は、初戦のウルグアイ戦に先発し、前半で退きました。そのあとは、ベンチで出番を待っています。
    image: assets/images/20261004_kirin_final_eve/03_w.jpg
  - text: 中盤の真ん中は、鎌田大地と田中碧が3試合すべてに出て、兄の佐野海舟が2試合で先発しています。
  - voice: 佐野航大
    text: チャンスが来たら掴むというのは
  - voice: 佐野航大
    text: ずっと変わらずに思っていること。
    cont: true
  - voice: 佐野航大
    text: それに向けて良い準備をするだけ
    cont: true
  - text: 佐野は、南米の相手と違い、決勝では日本がボールを持つ時間が長くなると見ています。
  - voice: 佐野航大
    text: 自分の立ち位置やボールのもらい方を
  - voice: 佐野航大
    text: しっかりやっていきたい
    cont: true
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?460260-460260-fl=
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?460260-460260-fl=
  - https://soccer.yahoo.co.jp/japan/category/men/game/2026092401/text
