# 取材メモ（10/4 題材 kirin_final_eve、型は quote）。材料の控え: research/raw/20261004_kirin_final_eve.md
# 主役は「まだ出番の少ない若手（松木玖生・後藤啓介・佐野航大）と、決勝で誰が出るか」。決勝は 10/5（月）19:30 国立、相手ニュージーランド。
# 前日の予告の回なので、試合の結果は書かない。
# 10/2 の「日本のPK戦（キッカー5人・PK戦の歴史）」「堂安と鈴木彩艶」「久保の代表先発（出場時間）」と重ねない。
#   PK戦の歴史・エクアドル戦のPK戦のスコア・久保の出場時間は入れない（エクアドル戦のPK戦は JFA の本文 5-3 と記事 5-4 が食い違うので、この回では言わない）。
# 森保監督の前日会見（10/4）は、10/4 09:30 の時点でゲキサカ・JFA にまだ記事が無かった（raw の 0.）。
# 事実の裏:
#   出場時間: JFA の試合記録 PDF（9/24・9/28・10/1）＋スポーツナビの交代時刻。90分基準、追加時間は数えない（raw の 8.）。
#     松木 63（11分に初ゴール）／メンバー外／出場なし。後藤 メンバー外／45／出場なし。佐野航大 45／出場なし／出場なし。瀬古 90／71／90＝251（3試合とも先発は瀬古だけ）。
#   ニュージーランド: 世界ランキング86位・日本17位（JFA 9/28、7/20 更新）。A代表は日本の3勝2敗（2003・2014・2017 と日本が3連勝）。
#     東京五輪の準々決勝 0-0、PK戦4-2で日本。キリン杯準決勝はパナマと1-1、PK戦5-3（NZ は5人全員成功。JFA PDF m01）。
#   発言はすべてゲキサカ（10/3 の練習後の取材）の原文。
# 写真: ゲキサカの日本代表の練習の写真（©Kaoru WATANABE/GEKISAKA）。代理店ではない。01 松木・02 後藤・03 佐野航大・04 瀬古・05 板倉。
