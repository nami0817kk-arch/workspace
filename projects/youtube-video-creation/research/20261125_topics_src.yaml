title: 11月25日のショート題材
lead: 海外フィード約390件と日本語の海外組ニュースから10件をClaudeが選びました（日本人6件・海外4件）。取材で前提が崩れたら次点に差し替えます。
note: 水曜（25日）の朝7時に集めました。見出しからの選定。次点：新川志音（19歳）の欧州初弾→次節の一発退場、荒木遼太郎が誘ったGK退場とテロップの小久保、アーセナル1-1ドルトムント（ギョケレスの一撃）、ヨロの退場取り消し（マンUはブルーノと同じクラブのため外す）。外した：田中碧の契約延長（11/24 に作成済み）、塩貝健人の負傷（11/24 作成済み）、クリスタル・パレスの勝ち点剥奪（女子のため）、上田綺世のバイエルン戦（今夜の試合のあと）、ヤマル抜きのバルサ（11/24 と同じ話）、セネガルのアフリカ杯王者（欧州7リーグの外）、U-17W杯（年代別）、吉田麻也のギャラクシー退団（MLS）。
