# ユニフォームとエンブレムの歴史 バイエルン（11/12 作成、11/21 分）。ブンデス。雛形は 20261117_kit_realsociedad。
# 題の問い：バイエルンの色は、もとは何色か。赤が入ったのはいつ、なぜか。答え＝1900年の創立時は青と白。1906年、ミュンヘン・スポーツクラブに加わり、赤いパンツを求められて白シャツ＋赤パンツに（呼び名「ディ・ロテン」）。赤一色が基本になったのは1974年から。青と白は1954年に州の色として紋章に戻った。
# 選んだ理由：ブンデスの最大の題材。プレミア全クラブ・ラ・リーガ主要5つ済み。同じ日の担当（スタジアム=ナポリ、選手=ヴィルツ(リバプール)、国内レジェンド=名波）と重ならない。同じ週のインテル（11/19）とは「色が消えた/あとから来た」で別の問い。
# 重なり確認（2026-11-12）：scripts/*kit_* にバイエルン無し。11/19 の選手紹介がムシアラ（バイエルン）だが別日。
# 取材：requests（Wikipedia API）のみ。読んだ：en "Bayern Munich"（Kits・Crest・Kit suppliers）、de "FC Bayern München"（Geschichte・Sponsoren・Ausrüster）。クラブ公式は読んでいない。
# ---- 食い違い・断ったこと ----
#   ・MSC への加入年：de「1906年」、en（Kits）「1905年にMSCに加わり赤パンツ」、en（Stadiums）「1906年」。→ 台本は1906年。
#   ・赤い呼び名：de「ディ・ロテン」。en は「若手が『赤パンツ』と侮辱で呼ばれた」。→ 台本は de の呼び名だけ。
#   ・アディダスの開始：de「1965年から途切れず」、en の表「1974年〜（1964-71 パルメ、1971-74 エリマ）」。→ 台本は「半世紀以上」とだけ言う。契約は2015年に2030年まで（en の表）。
#   ・胸の会社：de の一覧＋en の表（1978-84 マギルス、1984-89 コモドール、1989-2002 オペル、2002- テレコム）。袖：en の表（ハマド空港 2017-18、カタール航空 2018-23、アウディ 2023-24、アリアンツ 2024-）／de「カタール航空は2018年から、2023年6月30日で終了」。1974-78 のアディダスは胸に名前が出ていた、と de は書くが、台本は「1978年、トラックの会社マギルス」と言う（初の広告主とは言っていない）。
#   ・1919-24 の紋章「Bayern FA」の理由（TSVヤーンの一部）：en は「出典要求」、de は1921-23の会報が「TVヤーンの一部」と書く。→ 台本は「別のスポーツクラブのサッカー部だった」。
#   ・1938-45 のナチス体育組織の紋章：en の注。1資料。
#   ・2017・2024の紋章の違いは読んでいない（年だけ言う）。
# ---- 自分で数えた数 ----
#   創立 1900→2026＝126年。青白を掲げた1900→1906＝6年＝6/126≒約5%。赤一色 1974→2026＝52年＝52/126≒約41%。胸の会社 1978→2026＝48年で4社＝12年。テレコム 2002→2026＝24年。
# ---- 日本との接点 ----
#   見つけられなかった。無理に入れない。
# 言わなかったもの：優勝回数・スタジアム・戦績・ムシアラ等の選手の話。
