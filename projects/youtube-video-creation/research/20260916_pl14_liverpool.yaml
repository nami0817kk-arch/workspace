# プレミアリーグ20クラブ紹介 ⑭リヴァプール（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**遠藤航。
#
# 引きは**「エヴァートンが出ていったスタジアムに、別のクラブが作られた」**。
# ここが山場（@main）。⑨エヴァートンの回と対になる話
#
# **ヒルズボロの件は、人数と事実だけを短く。**扇情的に書かない
#
# 2026-09-18 ユーザー指示で足したもの。①タイトルとサムネを、20本で同じ文面から
# クラブごとの引きに変えた。②宿敵の節（マージーサイド・ダービー）と
# 「このクラブを語る選手」の節を足した。③遠藤航を今季の顔ぶれの1行目と
# theme.hook へ前出しした（それまでは節の最後と最終節に埋もれていた）
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 3節24行 → 2節14行にした。**落としたのは「歌と、忘れられない日」の節まるごと**
# （ユール・ネヴァー・ウォーク・アローンと1989年のヒルズボロ）。山場の
# 「空になったスタジアム」と「獲ってきたもの」を残し、それぞれ1行ずつ詰めた
format: news
voice_min: 0
slot: premier_1
date: "2026年9月16日"

people:
  - リヴァプール

short_title: "リヴァプールとはどんなクラブか"

theme:
  id: pl_clubs_14_liverpool
  league: england
  league_name: プレミアリーグ
  kind: other
  topic: リヴァプール
  title: リヴァプール。エヴァートンが去ったスタジアムに、なぜこのクラブが生まれたのか
  question: どんなクラブなのか
  hook: 日本代表の遠藤航が、いまこのクラブにいます。

thumbnail:
  line1: エヴァートンが去った跡地に
  line2: リヴァプール
  crest_main:
    - リヴァプール
  tags: []
  points: []

sections:
  - id: birth
    heading: 空になったスタジアム
    main: true
    tier: 背景
    telop: 1892年、エヴァートンが出ていったあとに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1892年"]
        - ["きっかけ", "アンフィールドをめぐる対立"]
        - ["愛称", "The Reds（レッズ）"]
        - ["本拠地", "アンフィールド／61,276人"]
    say:
      # 2026-09-22: 節の1行目に実写を1枚（創設者ジョン・ホールディングの肖像。Commons パブリックドメイン）
      - {text: "生まれたきっかけは、**もめごと**でした。", image: assets/images/pl_liverpool_story/01.jpg}
      - アンフィールドという土地を持っていたのは、ジョン・ホールディングでした。
      - そこを使っていたのが、エヴァートンです。
      - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
      - "**スタジアムだけが残りました。**"
      # 2026-09-22 流れの点検2回目: 愛称と「ユール・ネヴァー・ウォーク・アローン」の2行は
      # 1892年の生まれの話から1959年へ飛んでいたので、基礎DATA（research/pl_data/liverpool_say.yaml）へ移した
      - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.
      - https://en.wikipedia.org/wiki/Bill_Shankly
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本代表の遠藤航がいるクラブ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["日本人選手", "遠藤航（MF・日本）"]
        - ["監督", "アンドニ・イラオラ"]
        - ["主将", "ファン・ダイク（DF・オランダ）"]
        - ["副主将", "アリソン／ゴメス／ソボスライ"]
        - ["エース", "アレクサンデル・イサク（FW・スウェーデン）"]
    say:
      - "いまこのクラブでプレーしているのが、**遠藤航**です。"
      - 加入してから、リーグカップとプレミアリーグを獲っています。
      - 監督はアンドニ・イラオラです。
      - 主将はフィルジル・ファン・ダイク。オランダ代表のセンターバックです。
      - 副主将は**3人**。アリソン、ジョー・ゴメス、そしてソボスライ。
      - エースはアレクサンデル・イサク。スウェーデン代表の背番号9で、今季リーグ最多の3点です。
      - 昨季の得点王はウーゴ・エキティケで、17点。この選手も今季います。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 同じ街のエヴァートンとの、マージーサイド・ダービー
    narrator: 解説
    card:
      type: table
      title: マージーサイド・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1894年10月13日／0-3"]
        - ["通算", "248試合（2026年4月時点）"]
        - ["勝敗", "リヴァプール102勝・78分・エヴァートン68勝"]
        - ["最大差", "1935-36 アンフィールドで6-0"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "宿敵は、同じ街の**エヴァートン**です。"
      - "呼び名は**マージーサイド・ダービー**。"
      - "公式戦で初めて当たったのは1894年10月13日でした。この日は**エヴァートンが3対0**。"
      - 2026年4月の時点で、通算**248試合**。リヴァプールの102勝、78分け、エヴァートンの68勝です。
      - 最も点差がついたのは1935年から36年、アンフィールドでの**6対0**でした。
      - "プレミアリーグが始まってから、**退場者がいちばん多いカード**でもあります。合計23枚です。"
      - "そして相手は、**今季もプレミアリーグにいます。**年に2度、この試合が組まれます。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Merseyside_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: ラッシュ、ジェラード、ダルグリッシュ
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["イアン・ラッシュ", "公式戦346得点（クラブ最多）"]
        - ["スティーヴン・ジェラード", "公式戦710試合186得点"]
        - ["ケニー・ダルグリッシュ", "公式戦515試合172得点"]
    say:
      - 名前を挙げるなら、この3人です。
      - イアン・ラッシュ。1980年から87年、いったん離れて88年から96年まで。
      - "公式戦で**346得点**。このクラブでいちばん多く点を取った選手です。1992年10月にロジャー・ハントを抜きました。"
      - スティーヴン・ジェラード。1998年から2015年までの17年間。
      - 公式戦710試合で186得点。出場数はクラブ歴代3位です。
      - "2005年のチャンピオンズリーグ決勝で主将を務め、0対3から反撃の1点目を決めたのがこの選手でした。"
      - ケニー・ダルグリッシュ。1977年から90年。公式戦515試合で172得点です。
      - 1978年のヨーロッパカップ決勝で決勝点。13年でリーグ6回、ヨーロッパカップ3回を獲りました。
      - 1985年からは、選手をやりながら監督も務めています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ian_Rush
      - https://en.wikipedia.org/wiki/Steven_Gerrard
      - https://en.wikipedia.org/wiki/Kenny_Dalglish
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: リーグ20回。次に獲れば、イングランド単独の最多
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "20回（直近 2024-25）"]
        - ["FAカップ", "8回（直近 2021-22）"]
        - ["リーグカップ", "10回（イングランド最多）"]
        - ["欧州カップ／CL", "6回（イングランド最多）"]
    say:
      - "リーグ優勝**20回**。イングランドでいちばん多いクラブと、**並んでいます**。"
      - "相手はマンチェスター・ユナイテッド。つまり**次に獲れば、単独の最多**になります。"
      - "ヨーロッパの頂点には**6回**立ちました。これはイングランド最多です。"
      - 2005年と2019年の決勝は、とくに語り継がれています。
      - "リーグカップも**10回でイングランド最多**。FAカップは8回です。"
      - "ただ、リーグには長い空白がありました。2020年の優勝は、**30年ぶり**のことです。ユルゲン・クロップが率いていました。"
      - そして2025年、20回目の優勝。アルネ・スロットのもとでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
