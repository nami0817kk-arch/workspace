sections:
  - id: birth
    heading: 空になったスタジアム
    main: true
    tier: 背景
    telop: 1892年、エヴァートンが出ていったあとに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1892年"]
        - ["きっかけ", "アンフィールドをめぐる対立"]
        - ["愛称", "The Reds（レッズ）"]
        - ["本拠地", "アンフィールド／61,276人"]
    say:
      - このクラブができたのは1892年。きっかけは**もめごと**でした。
      - アンフィールドという土地を持っていたのが、ジョン・ホールディングという人物です。
      - そこを使っていたのはエヴァートン。⑨で扱ったクラブです。
      - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
      - "**スタジアムだけが残りました。**"
      - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
      - 愛称は「レッズ」。ビル・シャンクリーが監督だった時代に定着しました。
      - アンフィールドの収容は**6万1276人**。2021年から24年にかけても広げています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はファン・ダイク
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "アンドニ・イラオラ"]
        - ["主将", "ファン・ダイク（DF・オランダ）"]
        - ["副主将", "アリソン／ゴメス／ソボスライ"]
        - ["エース", "アレクサンデル・イサク（FW・スウェーデン）"]
        - ["日本人選手", "遠藤航（背番号3）"]
    say:
      - 監督はアンドニ・イラオラです。
      - 主将はフィルジル・ファン・ダイク。オランダ代表のセンターバックです。
      - 副主将は**3人**。アリソン、ジョー・ゴメス、そしてソボスライ。
      - エースはアレクサンデル・イサク。スウェーデン代表の背番号9で、今季リーグ最多の3点です。
      - 昨季の得点王はウーゴ・エキティケで、17点。この選手も今季います。
      - そして、このクラブには**遠藤航**がいます。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: anfield
    heading: 歌と、忘れられない日
    tier: 背景
    telop: 「ユール・ネヴァー・ウォーク・アローン」
    narrator: 解説
    say:
      - このクラブには、歌があります。
      - 「ユール・ネヴァー・ウォーク・アローン」。**ひとりで歩くことはない**、という意味です。
      - アンフィールドで歌われるようになったのは1960年代の初めから。
      - いまはスタジアムの門にも、その言葉が掲げられています。
      - そして、忘れられない日があります。
      - 1989年、FAカップ準決勝での**ヒルズボロの事故**です。
      - 過密と警備の失敗により、**97人**のサポーターが亡くなりました。
      - この事故のあと、イングランドのスタジアムの安全基準は大きく作り替えられています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: リーグ20回。次に獲れば、イングランド単独の最多
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "20回（直近 2024-25）"]
        - ["FAカップ", "8回（直近 2021-22）"]
        - ["リーグカップ", "10回（イングランド最多）"]
        - ["欧州カップ／CL", "6回（イングランド最多）"]
    say:
      - "リーグ優勝**20回**。イングランドでいちばん多いクラブと、**並んでいます**。"
      - "相手は⑯マンチェスター・ユナイテッド。つまり**次に獲れば、単独の最多**になります。"
      - "ヨーロッパの頂点には**6回**立ちました。これはイングランド最多です。"
      - 2005年と2019年の決勝は、とくに語り継がれています。
      - "リーグカップも**10回でイングランド最多**。FAカップは8回です。"
      - ただ、リーグでは長い空白がありました。
      - "2020年の優勝は、**30年ぶり**のことです。ユルゲン・クロップが率いていました。"
      - そして2025年、20回目の優勝。アルネ・スロットのもとでした。
      - そのチームに遠藤航がいて、すでにリーグカップとプレミアリーグを獲っています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
