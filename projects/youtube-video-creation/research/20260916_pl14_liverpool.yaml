sections:
  - id: birth
    heading: 空になったスタジアム
    main: true
    tier: 背景
    telop: 1892年、エヴァートンが出ていったあとに作られた
    narrator: 解説
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1892年"]
        - ["きっかけ", "アンフィールドをめぐる対立"]
        - ["愛称", "The Reds（レッズ）"]
        - ["本拠地", "アンフィールド／61,276人"]
    say:
      - アルファベット順では、14番目に来ます。
      - このクラブができたのは1892年。きっかけは**もめごと**でした。
      - アンフィールドという土地を持っていたのが、ジョン・ホールディングという人物です。
      - そこを使っていたのはエヴァートン。⑨で扱ったクラブです。
      - 両者が対立し、エヴァートンはグディソン・パークへ移っていきました。
      - "**スタジアムだけが残りました。**"
      - ホールディングは、そこで戦う新しいクラブを作ります。それがリヴァプールです。
      - 愛称は「レッズ」。ビル・シャンクリーが監督だった時代に定着しました。
      - アンフィールドの収容は**6万1276人**。2021年から24年にかけても広げています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.

  - id: titles
    heading: 積み上げたもの
    tier: 背景
    telop: リーグ20回、ヨーロッパ6回
    narrator: キャスター
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "20回（最多タイ）"]
        - ["ヨーロッパカップ", "6回"]
        - ["2020年", "30年ぶりの1部優勝"]
        - ["2025年", "20回目の優勝"]
    say:
      - リーグ優勝は**20回**。イングランドで最も多いクラブと並んでいます。
      - ヨーロッパの頂点には**6回**立ちました。2005年と2019年の決勝は、とくに語り継がれています。
      - ただ、リーグでは長い空白がありました。
      - 2020年の優勝は、**30年ぶり**のことです。ユルゲン・クロップが率いていました。
      - そして2025年、20回目の優勝。アルネ・スロットのもとでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.

  - id: japan
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。遠藤航
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "アンドニ・イラオラ（2026年5月就任）"]
        - ["日本人選手", "遠藤航"]
    say:
      - このクラブには、日本人選手がいます。**遠藤航**です。中盤の選手として登録されています。
      - 監督はアンドニ・イラオラ。2026年5月に就任しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.

  - id: anfield
    heading: 歌と、忘れられない日
    tier: 背景
    telop: 「ユール・ネヴァー・ウォーク・アローン」
    narrator: 解説
    say:
      - このクラブには、歌があります。
      - 「ユール・ネヴァー・ウォーク・アローン」。**ひとりで歩くことはない**、という意味です。
      - アンフィールドで歌われるようになったのは1960年代の初めから。
      - いまはスタジアムの門にも、その言葉が掲げられています。
      - そして、忘れられない日があります。
      - 1989年、FAカップ準決勝での**ヒルズボロの事故**です。
      - 過密と警備の失敗により、**97人**のサポーターが亡くなりました。
      - この事故のあと、イングランドのスタジアムの安全基準は大きく作り替えられています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.
