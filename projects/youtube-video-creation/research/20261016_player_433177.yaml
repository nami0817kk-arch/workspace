# ブカヨ・サカ（アーセナル）の紹介。8節の型（2026-09-28）を 10/14 アンダーソン（research/20261014_player_567576.yaml）の形にそろえた。
# 雛形は tools/player_intro.py 433177。材料は research/raw/20261016_player_433177_material.md（出典URL・原文・自訳つき）。
# 数字は FotMob（961995）・Transfermarkt API（433177）・英語版Wikipedia・アーセナル公式・BBC・Guardian・ESPN の試合記録。
#
# **人選**：`player_pool list --count 40`（市場価値の順）で出していない最初の選手は⑫ムシアラ（580195）だったが、
#   今季の出場が4試合213分でFotMobの詳細スタッツ（450分の目安に届かない）が薄く、プレースタイル・今季の節が作れないので外した。
#   次の⑬サカ（433177、市場価値1.1億ユーロ）を選んだ。今季12試合881分（プレミア6試合509分）で節が作れる。
#
# **雛形から直したこと・数字の食い違い**
# - 雛形の過去5季の表は「代表を含む全公式戦」で、TMの代表の数に親善試合が入りアシストも Opta と食い違う
#   （TMのプレミアのアシスト通算58に対しアーセナル公式は200試合時点で45・50本目は5月）。**アシストの列は出さず、クラブの試合・得点・出場時間だけ**にした。
#   25/26の雛形の 58試合15得点 は、クラブ49試合11得点＋代表9試合4得点の合算。クラブだけに直した。
#   24/25 の37試合12得点はアーセナル公式（「3か月以上欠場した季」）と一致。
# - 通算：アーセナル321試合85得点・イングランド代表59試合19得点（FotMob と TM が一致、BBCの2月時点の48試合14得点とも矛盾しない）。合計380試合104得点。
# - 契約：TM・FotMob・BBC（「わかっている限り5年、2030年まで」）は2030年、英語版Wikipediaは「報じられた」2031年。2030年を使った。
# - 市場価値：TM 1.1億ユーロ、FotMob 1億1270万ユーロ。TM を使い、最高は1.5億（TMの推移、2024-12〜2025-05）。
# - 身長：TM・FotMob とも1.78m（クラブ公式の数字は未確認）。
# - レーダー・棒グラフは FotMob の traits（シュート数95・チャンス創出84・得点82・空中戦64・ボールタッチ60・守備の関与56）にそろえた。
#   雛形の武器（Penalty goals 97・xG 96）は今季6試合の数字なので画面のレーダーと食い違う。**レーダーの数字だけを言う**。
#   今季プレミア6試合の絶対値（シュート17・枠内10・xG 3.62・xA 1.04・敵陣ボックス内タッチ37）は「数」として読む。
# - 「得点を146分に1点」は 881÷6=146.8 なので **約147分に1点**。見立ての90分あたりは 4点÷637分×90 を自分で計算した。
# - W杯3位決定戦（2026-07-18）：BBC の試合速報と英語版Wikipedia で一致（イングランド6対4フランス、サカ37分・45+1分・87分PK）。
#   「W杯の決勝トーナメントで3得点はハースト（1966年決勝）以来2人目」はBBC・Wikipedia。ベリンガムがPKのボールを渡した話はBBCの解説者（ウォーノック）の言葉。
#   ESPN の記事は取得できず（bot対策）、BBC と Wikipedia の2系統で確認。
# - 10/13 のリール戦：ESPN の試合記録（65分に途中出場、67分にエゼのゴールをアシスト、71分に自分のゴール、3対0）。FotMob の1G1Aと一致。
# - 10/10 リーズ戦は2対1（0対1から逆転）、10/3 クロアチア戦はイングランド7対0で、サカは45分と68分（ESPN）。FotMob の2G・評点9.0と一致。
# - 次戦：ESPN の日程は 2026-10-18 15:30（UTC）＝日本時間10/19 0:30、ノッティンガム・フォレスト対アーセナル（FotMob の「10月19日」と一致）。
#   プレミアの順位は ESPN で アーセナル2位・勝ち点15（首位シティ18）。
#
# **材料から入れなかったもの**
# - 私生活（婚約・信仰・ナンドスのソース事業）、ロナウド・メッシに並べるバロンドールの話、ナイジェリア代表を選べた話（Wikipedia のみ）。
# - 「ニックネーム Little Chilli（オーバメヤン命名）」：Wikipedia のみで ESPN の原文は取得できなかった。
# - アーセナルの「プレミアで50アシスト目・コーナーから」（Wikipediaのみ。TMの数字と食い違うので扱わない）。
# - ユーロ決勝後の人種差別の中傷の詳細（事実は1文だけ）。
# - ライプツィヒ等、他の選手の話。
#
# **日本語名・読みで怪しいもの（確認してほしい）**
# - ヴォルスクラ・ポルタヴァ（Vorskla Poltava）、ドンナルンマ、ハースト（Geoff Hurst）、トゥヘル、テディ。
# - 「ハーレ・エンド」（Hale End）は使っていない（育成の記述は「アーセナルのアカデミー」）。
#
# **写真**（assets/images/20261016_saka/）：eng_ghana＝Commons（CC BY-SA 4.0 / Bryan Berlin、2026-06-23 W杯 イングランド対ガーナ、横長に切った01_w）、
#   ars_300・ars_portrait・ars_sign＝アーセナル公式サイトの記事の写真（許諾は得ていない、出典は credits.json）。
#   ars_300（ガッツポーズ）は記事の説明に「Bukayo Saka celebrates」とあり本人。ars_portrait は契約記事の本人のポートレート。ars_sign は左から監督・サカ・クラブ幹部の署名の写真（顔は検出が別人を拾ったので _v は使わない）。
#   ars_portrait は850pxと小さく、全画面だと約2.2倍の引き伸ばし。顔の検出が失敗した（右寄せの写真）。
