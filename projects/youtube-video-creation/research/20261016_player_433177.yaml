- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: 8歳の少年の手紙と、初めてのキャプテン
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['2021年7月', 8歳の少年が、手紙を送った]
    - ['2023年10月28日', 初めて、キャプテンマークを巻いた]
    source: 各報道
  say:
  - text: アーセナルのブカヨ・サカ。数字の外に、2つの話があります。
    image: assets/images/20261016_saka/ars_portrait/01.jpg
    short_only: true
    card: none
  - text: 1つ目は、少年からの手紙。2021年のユーロ決勝のあとのことです。
    image: assets/images/20261016_saka/ars_300/01_w.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 0
  - text: PKを外した19歳に、ワイト島の8歳の少年、テディが手紙を書きました。
    card: *story_card
  - text: お小遣いも、封筒に入れて送ったといいます。
    card: *story_card
  - text: もし目の前にサカがいたら、という手紙です。
    card: *story_card
  - voice: テディ
    text: もう悲しくなければいいな。
  - voice: テディ
    text: ここにいたら、お小遣いでアイスを買ってあげる。
    cont: true
  - voice: テディ
    text: 公園でサッカーをして、君を勝たせてあげる。
    cont: true
    pause: 0.6
  - text: 家族は、返事が来るとは思っていませんでした。ところが、サカは返事を書きます。
    card: *story_card
  - text: 手紙とビデオ。やり取りは、そこから続きました。
    card: *story_card
  - text: 2023年の取材で、サカの答えは、こうでした。
    card: *story_card
  - voice: サカ
    text: いまも、連絡を取っているよ。
  - voice: サカ
    text: たくさん動画を送ってくれて、いつも見て嬉しくなる。
    cont: true
  - voice: サカ
    text: 試合にも、2回来てくれた。
    cont: true
    pause: 0.6
  - text: 2つ目は、初めてのキャプテンの日。
    image: assets/images/20261016_saka/ars_sign/01.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 2023年10月28日、シェフィールド・ユナイテッド戦です。
    card:
      <<: *story_card
      highlight_row: 1
  - text: 8歳から育ったクラブで、先頭に立って入場。
    card:
      <<: *story_card
      highlight_row: 1
  - text: 5対0の勝ち。試合後の言葉です。
    card:
      <<: *story_card
      highlight_row: 1
  - voice: サカ
    text: 自分がどこから来たか、知っているでしょう。アカデミーです。
  - voice: サカ
    text: 先頭でみんなを連れて出られて、信じられなかった。
    cont: true
  - voice: サカ
    text: 学びながらだったから、
  - voice: サカ
    text: どこに立てばいいか、分からない時もあった。
    cont: true
    pause: 0.6
  - text: 19歳で手紙に応えた選手が、22歳で先頭に立つ。その先を、数字で見ます。
    pause: 0.5
    card: none
  quotes_from:
  - https://www.theguardian.com/football/2023/aug/25/bukayo-saka-nothing-worth-having-is-easy-its-about-how-much-you-want-it-arsenal
  - https://www.arsenal.com/news/saka-leading-boys-out-was-unbelievable
  sources:
