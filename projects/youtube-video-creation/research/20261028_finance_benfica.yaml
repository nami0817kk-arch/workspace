- id: view
  viewpoint: true
  heading: 見立て・本業の黒字は、大会の賞金にどれだけ支えられたのか
  tier: 背景
  telop: 増えた収入の約76%が放映権。人件費は収入の約55%
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（デロイト、2024-25）
    columns: [比べ, 答え]
    rows:
    - [増えた収入のうち放映権, 約76%]
    - [人件費 ÷ 収入（前の年は約64%）, 約55%]
    - [18位シュツットガルトとの差, 1290万ユーロ]
    highlight_row: 0
  say:
  - text: ここからは見立てです。デロイトの数字を、自分で割ってみます。
    image: assets/images/20261028_finance_benfica/02_w.jpg
    card: none
  - text: 増えた5900万ユーロの約76%が、放映権の分。4分の3を少し超えます。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 人件費は、収入の約55%。前の年の約64%から下がりました。
    mark:
      kind: circle
      row: 1
      col: 1
    card:
      <<: *view_table
      highlight_row: 1
  - text: 18位のシュツットガルトとは、1290万ユーロの差です。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。
    image: assets/images/20261028_finance_benfica/04_w.jpg
    card: none
  - text: 本業の黒字を支えたのは、2つの大会でした。
    emph: true
    card: none
  - text: チャンピオンズリーグの賞金と、クラブワールドカップの収入です。
    card: none
  - text: ただ、クラブワールドカップは、毎年ある大会ではありません。
    card: none
  - text: 2025年から26年も、ベンフィカはチャンピオンズリーグに出ました。
    image: assets/images/20261028_finance_benfica/06_w.jpg
    card: none
  - text: 今季は、ヨーロッパリーグを戦っています。
    card: none
  - text: 大会の賞金が変わる年に、本業の黒字を保てるか。次の決算で見えてきます。
    card: none
