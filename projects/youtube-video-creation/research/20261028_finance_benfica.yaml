# クラブの財政：ベンフィカ（10/28 水、シリーズ「クラブの財政」、key: finance_benfica、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブ。1〜18位は既出（18位シュツットガルトは 10/27）。19位がベンフィカ。
#   重なりの確認（10/28）：scripts/*finance_* に benfica は無い。research/posted.json の benfica は 20260917_benfica（ミラン戦の勝利のニュース。30日より前・財政ではない）だけ。
#   covered.yaml の benfica は 2026-09 のミラン戦（benfica_first_win_milan）と 10/11 の記録の解説（リーグ29連勝）。どちらも財政の数字は使っていない。
#   10/23 の監督紹介（モウリーニョ）にベンフィカが出るが、こちらは監督の話をしない。
#   ★今季も1部：英語版 Wikipedia「2026–27 S.L. Benfica season」「its 93rd consecutive season in the top flight of Portuguese football. Domestically, Benfica plays in the Primeira Liga ... In Europe, Benfica plays in the UEFA Europa League.」（ポルトガル1部は欧州7リーグに入る）
#
# 軸は「**選手の売り買いを除いた本業の損益が、7シーズンぶりに黒字。支えた収入は何か**」＋「**5大リーグの外で、デロイトの上位20に入ったのはベンフィカだけ**」。
#   答え：本業の収入（選手の売り買いを除く）は2億3060万ユーロで過去最高（+30.6%）。チャンピオンズリーグの賞金7280万（クラブ史上2番目）と、クラブワールドカップの収入2190万。
#     デロイトの内訳でも、1年で増えた5940万ユーロのうち約76%（4500万）が放映権（大会の賞金・分配金はここに入る）。
#   ★他の財政回の軸（10/27 シュツットガルト＝伸び率上位20で1位・増えた分の53%が放映権、ほか 20 本）を繰り返さない。シュツットガルトと同じ「増えた分の内訳」は1節にとどめ、
#     主役は「本業の黒字が7シーズンぶり」「5大リーグの外で唯一」「選手の売却が無ければ届かなかった最終の黒字」に置く。
#   ★日本との接点：財政の数字には無い。無理に入れない（10/6 の決定）。
#   ★選手個人の名前・移籍金の額は出さない。監督の話はしない。女子の話はしない（費用の内訳に女子チームの初年度の費用が入るが、触れない）。会員総会での決算の承認の話（票決）はしない。
#   ★アルファベット（SAD・UEFA・FIFA）は読み上げに出さない。「サッカー部門の会社」と言う。
#
# **決算期**：ベンフィカのサッカー部門の会社（Sport Lisboa e Benfica – Futebol, SAD）は7月〜6月で決算。デロイトの 2024/25 と同じ期間。
#   ただしデロイトの収入（2億8340万）と会社の「本業の収入」（2億3060万）は数え方が違う（デロイトは独自に調整した集計）。台本では2つを並べて足し引きしない。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com UK、2026-10-28 に requests で本文を取得）
#       https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
#       「FIFA Club World Cup clubs have strong representation in this year’s Money League, with ten of this year’s clubs having participated. This includes SL Benfica, resulting in the Portuguese club featuring for the first time since 2005/06,
#        being the first non ‘big five’ league entrant since 2020/21 (Zenit St. Petersburg).」
#       「Broadcast revenue includes prize money and distributions from participation in domestic leagues, cups, UEFA / other continental club competitions and the FIFA Club World Cup.」
#       上位20の一覧（18. VFB Stuttgart／19. SL Benfica／20. West Ham United）。ほかの19クラブはどれも5大リーグ → 5大リーグの外はベンフィカだけ。
#     ページ内の図（e.infogram.com、requests で取得。2026-10-28）
#       ベンフィカ https://e.infogram.com/_/xL2moocoV7lCH6HDlbkj ：「2025 Revenue €283.4m (2024: €224m)」「Change on previous year +27% (+€59.4m)」「DFML position 19」「Liga Primeira 2nd」「UEFA Champions League R16」
#         「REVENUE 2021-2025 (€m)」（Matchday／Broadcast／Commercial／Wages）：2021 20/66/34/124、2022 42/114/45/143、2023 52/126/55/174、2024 55/103/66/144、2025 63/148/72/157
#       シュツットガルト（18位）€296.3m（10/27 の取材メモ、同じ図）
#   ○ ベンフィカのサッカー部門の会社の発表（2025-09-09、2024/25 の決算。クラブ公式の PDF、requests で取得・pypdf で本文を読んだ）
#       https://media.slbenfica.pt/-/media/BenficaDP/Images/Instituicao/SAD/informacao-privilegiada/2025/ComunicadoResultadosBenficaSAD2425.pdf
#       「O resultado líquido positivo de 34,4 milhões de euros, representando um crescimento de 65,8 milhões de euros face ao período homólogo」
#       「O resultado operacional sem direitos de atletas ascende a um valor positivo de 3,9 milhões de euros, o que equivale a uma melhoria de 32,2 milhões de euros face ao período homólogo – primeiro resultado positivo após sete épocas (desde 2017/18)」
#       「Os rendimentos operacionais sem direitos de atletas atingem os 230,6 milhões de euros, representando um crescimento de 30,6% face ao exercício anterior – valor mais elevado de sempre da Benfica SAD.
#        ... sendo de destacar a performance na Liga dos Campeões, a participação no Mundial de Clubes e o crescimento em 17,6% das receitas associadas ao Matchday」
#       「Os prémios obtidos com a participação na Liga dos Campeões ascenderam a 72,8 milhões de euros, o 2.º melhor resultado de sempre, apenas ultrapassado pelos 74,3 milhões de euros alcançados em 2022/23」
#       「As receitas líquidas geradas pelo Mundial de Clubes corresponderam a 21,9 milhões de euros」
#       表（千ユーロ）：純損益 34 444（前年 −31 360）、本業の損益（選手の売り買いを除く）3 871（−28 251）、本業の収入 230 618（176 564）、本業の費用 −226 747（−204 815）、選手の売り買いの損益 46 739（13 457）
#       「Os gastos operacionais sem direitos de atletas equivalem a um montante de 226,7 milhões de euros, correspondendo a um aumento de 21,9 milhões de euros」
#       「A dívida líquida ascende a um valor de 196,9 milhões de euros ... face aos 201,8 milhões de euros」
#       「Nos primeiros meses do exercício de 2025/26, a Benfica SAD garantiu o acesso à fase de liga da Liga dos Campeões.」
#   ○ 英語版 Wikipedia「2026–27 S.L. Benfica season」（上の引用。ポルトガル1部・ヨーロッパリーグ）
#   × 確かめられなかったもの：デロイトの集計と会社の決算の差の中身、2005-06 の順位と額、2025-26 シーズンの決算（未発表）、クラブワールドカップの成績ごとの賞金の内訳。
#     「4500万の放映権の増えのうち、クラブワールドカップがいくらか」はデロイトが分けていないので言わない。
#
# 自分で計算した数（検算済み）
#   デロイト：283.4−224.0＝59.4 ✓、59.4÷224.0＝26.5%→27% ✓
#   内訳の合計（丸めた値）：2024: 55+103+66＝224 ✓ ／ 2025: 63+148+72＝283 ✓
#   増減：放映権 148−103＝+45、試合日 63−55＝+8、商業 72−66＝+6、計 +59 ✓。放映権の割合 45÷59＝76.3%→約76%（4分の3を少し超える）
#   放映権の倍率 148÷103＝1.44→約1.4倍。収入に占める放映権 148÷283＝52.3%→約52%
#   人件費の比率 157÷283.4＝55.4%→約55%（前の年 144÷224＝64.3%→約64%）
#   5年：120、201、233、224、283。283÷120＝2.36→約2.4倍。2023-24 は 233→224 で減った（放映権 126→103）
#   シュツットガルトとの差：296.3−283.4＝12.9（1290万ユーロ）
#   会社：本業の収入 230.6−176.6＝54.1（+30.6%：54.054÷176.564＝30.6% ✓）、本業の費用 226.7−204.8＝21.9、本業の損益 230.6−226.7＝3.9 ✓、前の年 176.6−204.8＝−28.3（千ユーロで −28 251）✓
#   純損益 34.4 のうち選手の売り買いの損益 46.7。もし売り買いの損益が0なら：34.4−46.7＝−12.3（税・金融費用を同じとみなした、ざっくりの引き算。台本では「選手の売り買いの利益が、最終の黒字より大きい」とだけ言う）
#   チャンピオンズリーグ賞金 72.8 ÷ 本業の収入 230.6＝31.6%→約3割
#
# 写真：assets/images/20261028_finance_benfica/（Commons、出典は credits.json）。01・02・06 は内部、03 はポルト戦の前の観客席、04 は外観、05 は上空から。
