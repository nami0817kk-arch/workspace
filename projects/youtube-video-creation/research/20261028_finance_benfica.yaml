  say:
  - text: では、選手の売り買いも入れた、ベンフィカの最後の損益はどうか。
    image: assets/images/20261028_finance_benfica/03_w.jpg
    card: none
  - text: 2023年から24年は、3136万ユーロの赤字。
    card: *net_table
  - text: 2024年から25年は、3444万ユーロの黒字に変わりました。
    emph: true
    card: *net_table
  - text: ただ、選手の売り買いで出た利益は、4674万ユーロ。
    card:
      <<: *net_table
      highlight_row: 1
  - text: 最後の黒字よりも、選手の売り買いの利益のほうが大きいのです。
    card:
      <<: *net_table
      highlight_row: 1
  - text: 借り入れから手元のお金を引いた負債は、1億9690万ユーロ。
    image: assets/images/20261028_finance_benfica/01_w.jpg
    card:
      <<: *net_table
      highlight_row: 2
  - text: 前の年の2億180万ユーロより、少し減りました。
    card:
      <<: *net_table
      highlight_row: 2
