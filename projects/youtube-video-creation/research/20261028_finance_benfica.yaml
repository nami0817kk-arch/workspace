  telop: 最終の黒字は3440万ユーロ。選手の売り買いの利益は4670万ユーロ
  narrator: 解説
  card: &net_table
    type: table
    title: サッカー部門の会社の決算（百万ユーロ）
    columns: [項目, 2023-24, 2024-25]
    rows:
    - [最終の損益, '−31.4', '+34.4']
    - [選手の売り買いの損益, '+13.5', '+46.7']
