# クラブの財政：ユヴェントス（10/21 水、シリーズ「クラブの財政」、key: finance_juventus、型は news）。
#
# 軸は「**放映権が7割超増えたのに、収入は13%増にとどまったのは、なぜか**」。
#   ・デロイト（2024/25）：収入 4億170万ユーロ（前の年 3億5570万、+13%、+4600万）、順位は16位（前の年も16位）。
#     内訳（百万ユーロ、デロイトの図の整数）：放映権 100→177（+77）／商業 201→160（−41）／試合日 55→65（+10）。356＋77−41＋10＝402。
#   ・クラブの公式発表（26 Sep 2025、2025年6月期）：放映権・メディア収入 +77.7＝欧州の大会 +67.5＋クラブ・ワールドカップ +27.0−国内のメディア権 −16.8（主にセリエA）。
#     デロイトの増加幅（177.4−99.7＝77.7）と一致。商業の穴＝スポンサー −27.0（主な理由は胸のスポンサーが一時いなかったこと。ステランティス・ヨーロッパとビジット・デトロイトとの契約は終盤）＋商品・ライセンス −17.7。
#   ・クラブの公式発表（29 Sep 2026、2026年6月期）：赤字 66.0（前 58.1）。放映権・メディア −31.9（クラブW杯 −27.0、国内 −4.3）、スポンサー・広告 +20.3。
#     2026/27 はチャンピオンズリーグに出られず赤字見込み。増資の枠 最大2億5000万ユーロを提案、エクソールは直ちに6000万ユーロ払い込み。株主総会 2026-11-03。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差・赤字・人件費比率／インテル＝10位との差・給料を引いた残り／ヴィラ＝放映権の割合が最高）は繰り返さない。
#     この回の軸は「**収入の増減の内訳（放映権の特需と商業の穴）と、柱の入れ替わり**」。
#   ★アルファベットは読み上げに出さない。女子チームの話・監督の解任・法的な争い・制裁は言わない。選手名は出さない。
#
# **決算期**：6月30日決算（上場企業。決算は取締役会の承認＋株主総会）。2024/25＝2025年6月期。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com）：16位ユヴェントス、図（e.infogram.com）から
#       収入 2021-2025（百万）：434/401/434/356/402。放映権 237/175/157/100/177。商業 189/184/219/201/160。試合日 8/32/58/55/65。
#       給料 337.8/336.5/282/264/245。給料÷収入 78/84/65/74/61（%）。DFML の順位 9/11/11/16/16。ピッチ上：セリエA 4位／チャンピオンズリーグ ノックアウトのプレーオフ。
#       ★「2025 Revenue €401.7m (2024: €355.7m)」「Change on previous year +13% (+€46m)」。
#       ★隣の順位：15位ミラン €410.4m、17位ニューカッスル €398.4m、14位ヴィラ €450.2m（それぞれの図で確認）。
#       定義（ページ本文）：放映権は国内リーグ・カップ・欧州連盟の大会・FIFAクラブW杯の賞金と分配金を含む。商業はスポンサー・グッズ・その他の商業・試合以外の催し。
#       本文：セリエAの新しい国内契約は1シーズンの平均の権利額が約3%下がった。クラブW杯に出た10クラブは放映権が17%押し上がった。
#   ○ ユヴェントス公式（juventus.com の投資家向け発表）
#       ・2025-09-26「30 June 2025」：https://www.juventus.com/images/image/private/fl_attachment/dev/kqa9o6wnrkfguvdlmma3.pdf
#         最終損益 −58.1（前 −199.2）／資本 13.2（前 40.2）／純金融債務 280.2（前 242.8）／エクソールが 2025-03-31 と 06-30 に15ずつ、計30を増資の前払い／増資の枠 最大1億1000万。
#         放映権・メディア +77.7（欧州復帰 +67.5、クラブW杯 +27.0、メディア権の売却 −16.8＝主にセリエA）。スポンサー −27.0、商品・ライセンス −17.7（ファナティクスとの取引の会計上の影響）。
#         欧州連盟の大会の収入 75.3（前 0.1）、FIFA 27.0。2024/25：セリエA 4位、チャンピオンズリーグはリーグフェーズを通過し、プレーオフで敗退（2025-02-19）。
#         「前の期は欧州連盟の大会に不参加」（2024年6月期の発表の見出し）。ホームの入場料収入は「過去最高の流れ」。
#       ・2026-09-29「30 June 2026」：https://www.juventus.com/images/image/private/fl_attachment/dev/k0a34i2hcacmgbyxjw5o.pdf
#         最終損益 −66.0／資本 11.5／純金融債務 331.1／放映権・メディア −31.9（クラブW杯の不在 −27.0、セリエAの視聴権 −4.3＝順位が下がったため）／スポンサー・広告 +20.3（ステランティス・ヨーロッパとビジット・デトロイトの契約が通年で効いた）。
#         2025-11 に増資（総額 9781万3426.98ユーロ）完了。2025/26：セリエA 6位、チャンピオンズリーグはリーグフェーズ通過後、プレーオフで敗退（2026-02-25）、2026/27 はヨーロッパリーグ。
#         2026/27 は「チャンピオンズリーグに出られないため」赤字見込み。増資の委任 最大2億5000万（株主総会 2026-11-03）、エクソール（65.4%）は直ちに6000万を払い込み。
#   × デロイトの「放映権＝決算書の放映権・メディア」の定義の一致は、増加幅の一致（77.7）で確かめた。全額の一致は確かめていない（クラブの「営業収益」には選手の登録権の収入などの扱いが違う）。**台本では全額を並べない**。
#   × 商業の減少（デロイト −41）と決算書（スポンサー −27.0＋商品・ライセンス −17.7＝−44.7）は分類が違い、ぴったりは合わない。**台本はそのことを断る**。
#   × 報道は使っていない。
#
# 自分で計算した数（検算済み）
#   放映権 177÷100＝+77%。商業 160÷201−1＝−20.4%。試合日 65÷55−1＝+18%。収入 402÷356−1＝+12.9%（デロイトは+13%）。
#   放映権の増加に対する商業の減少 41÷77＝53%。商業が前の年のままなら 356＋77＋10＝443（+24.4%）→ ミラン410.4より上・ヴィラ450.2より下＝15位相当。
#   収入に占める割合 放映権 100÷356＝28%→177÷402＝44%／商業 201÷356＝56%→160÷402＝40%／試合日 55÷356＝15%→65÷402＝16%。
#   放映権の増加の内訳 67.5＋27.0−16.8＝77.7。 スポンサー−27.0＋商品−17.7＝−44.7。
#
# 写真：assets/images/20261021_finance_juventus/（アリアンツ・スタジアム＝Commons。CC BY-SA 4.0・CC BY 2.0・CC BY-SA 3.0 it・CC BY-SA 3.0）。
