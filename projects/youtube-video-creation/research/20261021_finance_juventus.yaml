    - ['-58.1', 百万ユーロ, 2025年6月期]
    - ['-66.0', 百万ユーロ, 2026年6月期]
    focus: 1
  say:
  - text: ユヴェントスの最終損益を見ます。2025年6月期は、5810万ユーロの赤字。
    image: assets/images/20261021_finance_juventus/02_w.jpg
    card:
      <<: *pl_stats
      focus: 1
  - text: 前の期は、1億9920万ユーロの赤字。
    card:
      <<: *pl_stats
      focus: 0
  - text: 赤字が縮んだ理由として、クラブが挙げるのは2つ。
    card: none
  - text: チャンピオンズリーグへの復帰と、選手の登録権、つまり移籍に関わる収入の増加。
    image: assets/images/20261021_finance_juventus/03_w.jpg
    card: none
  - text: 続いて、資金です。借金から現金を引いた、純金融債務。
    card: none
  - text: 2億8020万ユーロ。1年で、3740万ユーロ膨らみました。
    emph: true
    card: none
  - text: 大株主のエクソールは、増資の前払いを、2025年の3月と6月に実施。
    card: none
  - text: 1500万ユーロずつ、あわせて3000万ユーロ。
    image: assets/images/20261021_finance_juventus/04_w.jpg
    card: none
  - text: 2025年11月、増資が完了。総額は、9781万ユーロです。
    emph: true
    image: assets/images/20261021_finance_juventus/01_w.jpg
    card: none
  - text: 2026年6月期は、6600万ユーロの赤字。9月29日の取締役会で承認されました。
    card:
      <<: *pl_stats
      focus: 2
  - text: 2025-26は、セリエAが6位。2026-27は、ヨーロッパリーグです。
    image: assets/images/20261021_finance_juventus/02_w.jpg
    card: none
  - text: 発表資料は、2026-27の見通しを、赤字としています。
    card: &fc_doc
      type: document
      label: ユヴェントス 2026年6月期 決算の発表資料（訳）
      paragraphs:
      - 2026-27年度は、チャンピオンズリーグに出られないことが主な理由で、赤字が見込まれます。
      - 続く2年度は、結果が段階的に改善する見通しです。
      highlight:
      - チャンピオンズリーグに出られない
      - 赤字が見込まれます
  - text: 主な理由は、チャンピオンズリーグに出られないことです。
    emph: true
    card: *fc_doc
  - text: そこで、増資の枠を、最大2億5000万ユーロとする案が、株主総会に出されます。
    card: none
  - text: 増資とは、新しい株を出して、資金を集めることです。
    image: assets/images/20261021_finance_juventus/03_w.jpg
    card: none
  - text: エクソールは、すぐに6000万ユーロを払い込むと、表明しました。
    card: none
  - text: 株主総会は、11月3日です。
    card: none
