  - 弟のサイードが2点、兄のマレクも1点。
  - サイードは20歳。ポドルスキが最後に着けた背番号10を、受け継いでいます。
  - 勝ち点を試合数で割ると**1.13**。昨シーズンの0.94を上回っています。
  - 失点は1試合**1.50**で、昨シーズンの1.85より少なくなりました。
  - 得点は1試合1.13で、昨シーズンの1.44には届いていません。
