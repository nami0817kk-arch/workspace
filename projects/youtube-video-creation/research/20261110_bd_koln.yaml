- id: golden
  heading: 初代王者のケルンは、なぜ1部と2部を7回も行き来したのか
  tier: 背景
  telop: 1998年に初めての降格。2024年までに降格7回、昇格7回。今季が1部54季目
  narrator: 解説
  main: true
  say:
  - text: 1963年に始まったブンデスリーガ。
    image: assets/backgrounds/stadium_ケルン.png
  - ケルンは最初の16クラブに入り、1年目の王者に。
  - そこから**35年**、一度も2部に落ちていません。
  - text: 流れが変わったのは1998年。初めての降格でした。
    card:
      type: table
      title: 1部と2部の行き来
      columns:
      - 年
      - 出来事
      rows:
      - - 1998年
        - 初めての降格
      - - 2002〜06年
        - 降格と昇格を毎年のように
      - - 2012年
        - 降格。借金は3300万ユーロ
      - - 2018年
        - 18位で降格
      - - 2024年
        - 降格。翌年に2部で優勝
  - 2001年から2002年のシーズンには、**1034分**、点が入りません。
  - およそ11試合半ぶん。ブンデスリーガで最も長い記録です。
  - text: 2012年に落ちたときは、借金が3300万ユーロにふくらんでいました。
    card: none
    image: assets/backgrounds/stadium_ケルン_in.png
  - そこから立て直し、2017年には25年ぶりにヨーロッパの大会へ。
  - ところが翌季は、最初の16試合で勝ち点3。18位で2部へ落ちます。
  - text: 7回目の降格は2024年。それでも翌年、2部で優勝して1年で戻りました。
    image: assets/backgrounds/stadium_ケルン.png
  - 落ちたのは7回。そして7回とも、1部へ帰ってきています。
  - お金が尽きた降格もあれば、勢いが止まった降格もありました。
  - 今季は、1部で**54季目**です。
  sources:
  - https://en.wikipedia.org/wiki/1._FC_K%C3%B6ln
  - https://de.wikipedia.org/wiki/1._FC_K%C3%B6ln
  bg: assets/backgrounds/stadium_ケルン_in.png
  official: false
