- id: episode
  heading: 1965年、ケルンはなぜコイン投げでヨーロッパの大会を去ったのか
  tier: 背景
  telop: 1965年の準々決勝、リヴァプールと3試合引き分け。勝ち上がりはコイン投げで決まった
  narrator: 解説
  card:
    type: table
    title: 1965年 リヴァプールとの準々決勝
    columns: &id004
    - ''
    - ''
    rows:
    - - 2月10日
      - 1戦目 0対0
    - - 3月17日
      - 2戦目 0対0
  say:
  - text: 1964年から65年のシーズン。ケルンは、各国の王者が集まる大会で準々決勝へ。
    image: assets/images/bd_koln_rotterdam/scene.jpg
  - 相手は、イングランドのリヴァプールです。
  - ホームとアウェーの2試合は、どちらも0対0の引き分け。
  - 3月24日、オランダのロッテルダムで再試合が開かれます。
  - ケルンは0対2から追いつき、延長でも2対2の引き分け。
  - 当時は、PK戦がありませんでした。
  - text: 勝ち上がりは、コイン投げで決めることになります。
    card:
      type: table
      title: 1965年 リヴァプールとの準々決勝
      columns: *id004
      rows:
      - - 3月24日
        - 再試合 2対2
      - - 決め方
        - コイン投げ
    image: assets/images/bd_koln_coin2/scene.jpg
  - 1回目は、投げたものが地面に縦に刺さって決まらず、投げ直し。
  - 2回目でリヴァプールの側が出て、ケルンは大会を去りました。
  sources:
  - https://en.wikipedia.org/wiki/1964%E2%80%9365_European_Cup
  - https://en.wikipedia.org/wiki/1._FC_K%C3%B6ln
  - https://de.wikipedia.org/wiki/1._FC_K%C3%B6ln
