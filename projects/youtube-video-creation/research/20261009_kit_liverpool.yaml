  question: リヴァプールのユニフォームとエンブレムは、どうやっていまの形になったのか
  hook: ただ、その赤は三度に分けて揃いました。
  lead: 赤いシャツ、赤いパンツ、赤いソックス。ヨーロッパでいちばん知られた赤。
  takeaway: リヴァプールの赤は一度にできたものではない。創立の1892年は青と白で、赤に変わったのは1896年。パンツまで赤くしたのが1964年11月25日のアンデルレヒト戦で、ソックスまで揃ったのは3週間後の12月16日だった。赤いソックスを言い出したのは監督ではなく選手のイアン・セント・ジョンで、シャンクリーは選手が巨人に見えたと振り返っている。赤に白いパンツの時代は68年、全身が赤になってからはまだ61年10か月で、追い抜くのは2032年11月25日。シャツのエンブレムは1950年から9代で、8.4年に1回の割で変わってきた。胸の広告は1979年の日立が最初で、イングランドのプロクラブで初めての胸スポンサーは日本の会社だった。1年5万ポンドだったその額は、2027年から始まるトルコ航空の契約ならおよそ7時間18分で届く。胸に入った名前は48シーズンで5社、1社あたり9.6シーズンで、マンチェスター・ユナイテッドの6.4シーズンの約1.5倍長い
