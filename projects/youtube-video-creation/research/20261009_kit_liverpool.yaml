# ユニフォームとエンブレムの歴史 第1回：リヴァプール（10/9 公開）。材料の控えは research/raw/20261009_kit_liverpool_material.md。
# **このシリーズ（毎日の枠7）の1本目。節の並びが114本ぶんの雛形になる。**
#   ①オープニング（一言→題→引き）②エンブレムの年表（main・頭に強い一点・timeline の板・読み上げは5行）
#   ③色の歴史（本人の言葉を原文から訳して引く）④胸スポンサーと用具メーカー（金額の伸びは折れ線）⑤見立て（自分で数えた比べ3つ）
# 材料から出ない。材料に無いことは書かない。食い違いの扱いは材料の注記どおり:
#   赤へ変わった年は **1896年**（クラブ公式の「4年間」＋Wikipedia＋Historical Football Kits が一致）。1894年説も世にあるが採らない。
#   オール・レッドは **1964年11月25日（赤パンツ）→ 12月16日（赤ソックスで完成）** と分けて言う。クラブ公式の別記事の「1965年」は採らない。
#   **adidas の契約年数は言わない**（公式は multi-year、報道は5年、Wikipedia は10年）。「2025年から3度目」で止める。
#   1896年に赤へ決めた人物名は分からなかったので、人物を出さない（「街の色」まで）。
# ヒルズボロ：**炎がエンブレムに入った経緯として事実だけを2行**。表に組まない・数を並べない（97人は1度だけ）。
# 数字の重なり対策（別の節で同じ数字を読まない）：『6000万』は語りで一度も読まない（calc の板に出すだけ）。
#   胸の額は④が「5年で3億ポンド超」、⑤は倍率と時間だけ読む。『68年』は⑤だけ（③は「ずっとあと」で受ける）。
# 板：②timeline（9代のうち6行）④line（胸スポンサー料の伸び。単位は万ポンドで、語りの数字と板の数字をそろえた。
#     百万ポンド＋0.05 にすると、点の札『0.05』が縦軸の目盛り『20』に重なって読めなくなる＝実際に描いて見つけた）
#   ⑤calc 2枚（1200倍／7時間18分）＋ table 2枚（色の長さ／胸の社数）。書き込みは1つ（④の1979年に赤丸）。
# 写真は手元の2枚だけ。下地の入れ替えは1回（②③＝観客席の1枚 → ④⑤＝スタンドの広告板が写る1枚）。
#   stadium_リヴァプール.png には Standard Chartered と new balance の看板が写っているので、スポンサーの節に当てた。
# サムネ：構図 scene（これまで全部 classic なので、同じ構図を3回続けない決まりの初回）。横長 1920x1080、クラブ名入り、答えは ●● で伏せた。
