  quotes_from:
  - リヴァプール公式 https://www.liverpoolfc.com/news/60-years-liverpool-wear-all-red-strip-first-time
- id: money
  heading: 胸の広告は、日本の会社から始まった
  tier: 報道
  telop: イングランドのプロクラブで初めての胸スポンサーは日立。1979年、1年5万ポンド
  narrator: 解説
  card: &money_board
    type: line
    title: 胸スポンサー料の1年あたり
    x: ['1979', '2010', '2018', '2022', '2027']
    series:
    - [1年あたりの額, [5, 2000, 4000, 5000, 6000]]
    unit: 万ポンド
    note: 1979年の日立は5万ポンド。目盛りの上ではほとんど0に見える
  say:
  - text: リヴァプールの胸に広告が入ったのは、1979年7月です。
    image: assets/backgrounds/stadium_リヴァプール.png
    card: *money_board
  - text: 相手は、日本の日立。イングランドのプロクラブでは最初の例でした。
    card: *money_board
    emph: true
  - text: 契約は1年で、5万ポンド。
    card:
      <<: *money_board
      highlight: '1979'
    mark: {kind: circle, item: 0, text: 日本の会社}
  - text: 会長のジョン・スミスは、発表の場でこう話しています。
    card: none
  # 原文（Daily Express 1979-07-25。材料 6-③）:
  #   "We are fighting for our existence."
  #   "From a turnover of £2-4 million last year, Liverpool's profit at the end of the day was a meagre £71,000."
  #   "The days are gone when a club like ours could control their destiny on the money coming through the turnstiles."
  - voice: ジョン・スミス
    text: 我々は、生き残りをかけて戦っている。
    card: none
  - voice: ジョン・スミス
    text: 去年の売り上げは200万から400万ポンド。
    cont: true
  - voice: ジョン・スミス
    text: 手元に残った利益は、たった7万1000ポンドだった。
    cont: true
  - voice: ジョン・スミス
    text: 入場料だけで行く先を決められる時代は、終わった。
    cont: true
    emph: true
  - text: その広告は、しばらくテレビに映せませんでした。
    card: none
  - text: テレビ局が広告を映さない方針で、認められたあとも小さくするよう求められます。
  - text: ここからの伸びを、折れ線にしました。
    card: *money_board
  - text: あいだにクラウン・ペインツ、キャンディ、カールスバーグが入ります。
    card: *money_board
  - text: 2010年からは、イギリスの銀行スタンダードチャータード。1年2000万ポンド。
    card:
      <<: *money_board
      highlight: '2010'
  - text: 2022年の更新で、1年5000万ポンド超へ。12年で2倍以上です。
    card:
      <<: *money_board
      highlight: '2022'
  - text: そして2027年から、胸はトルコ航空に替わります。
    card:
      <<: *money_board
      highlight: '2027'
  - text: 5年で3億ポンド超。48年前の日立とは、桁が3つ違います。
    card:
      <<: *money_board
      highlight: '2027'
  - text: シャツを作る側も動いています。2012年のワリアーは1年2500万ポンド。
    card: none
  - text: 当時のプレミアで最高額。ユナイテッドのナイキを150万上回りました。
  - text: いま作っているのはアディダス。2025年から、3度目の付き合いです。
  sources:
