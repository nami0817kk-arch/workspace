- id: colour
  heading: 青と白から、全身の赤へ
  tier: 確定
  official: true
  telop: 創立のときは青と白。赤になったのは1896年で、全身が赤く揃うのは1964年
  narrator: キャスター
  card: &colour_board
    type: table
    title: 赤が揃うまで
    columns:
    - いつ
    - 格好
    rows:
    - ['1892年', 青と白。パンツとソックスは紺]
    - ['1896年', 赤いシャツに、白いパンツ]
    - ['1964年11月25日', シャツとパンツが赤。ソックスは白]
    - ['1964年12月16日', ソックスも赤。全身が赤に]
  say:
  - text: 1892年に生まれたとき、リヴァプールは青と白でした。
    image: assets/backgrounds/stadium_リヴァプール_in.png
    card: *colour_board
  - text: 上が青と白、下は紺。この色を4年間使います。
    card:
      <<: *colour_board
      highlight_row: 0
  - text: 赤に変わったのは1896年。街の色でした。
    card:
      <<: *colour_board
      highlight_row: 1
  - text: ただしパンツは白のまま。全身が赤くなるのは、ずっとあとです。
    card:
      <<: *colour_board
      highlight_row: 1
  - text: 動かしたのは、ビル・シャンクリー監督でした。
    card: none
  - text: 更衣室に赤いパンツを持ちこみ、主将のロン・イェーツに履かせます。
  - text: そして、こう言いました。
  # 原文（材料 6-①、イアン・セント・ジョンの自伝）:
  #   "Christ, Ronnie, you look awesome, terrifying. You look 7 ft tall."
  - voice: ビル・シャンクリー
    text: ロニー、おそろしいくらいだ。
    card: none
  - voice: ビル・シャンクリー
    text: 7フィートの大男に見えるぞ。
    cont: true
  - text: そこへ、聞いていたイアン・セント・ジョンが口を挟みます。
    card: none
  # 原文:
  #   "Why not go the whole hog, boss? Why not wear red socks? Let's go out all in red."
  - voice: イアン・セント・ジョン
    text: 監督、どうせなら全部やりませんか。
    card: none
  - voice: イアン・セント・ジョン
    text: ソックスも赤にして、全身、赤で出ましょう。
    cont: true
  - text: 赤いソックスを言い出したのは、監督ではなく選手でした。
    card: none
    emph: true
  - text: 1964年11月25日、アンフィールド。ヨーロッパの大会の1回戦です。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: 相手はベルギーのアンデルレヒト。ここでシャツとパンツが赤に。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: ソックスはまだ白です。この試合は3対0で勝ちました。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: 次の週末には、白いパンツに戻されました。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: シーズン途中にユニフォームを変えることが、リーグで認められていなかったためです。
    card:
      <<: *colour_board
      highlight_row: 2
  - text: 上下とも赤で揃うのは3週間後。ブリュッセルでの第2戦、12月16日でした。
    card:
      <<: *colour_board
      highlight_row: 3
  - text: シャンクリーは、こう振り返っています。
    card: none
  # 原文:
  #   "It was fantastic. The introduction of the all-red strip had a huge psychological effect.
  #    The players looked like giants. And we played like giants."
  - voice: ビル・シャンクリー
    text: 全身を赤にした効き目は、とても大きかった。
    card: none
  - voice: ビル・シャンクリー
    text: 選手たちが、巨人のように見えたんだ。
    cont: true
  - voice: ビル・シャンクリー
    text: そして、巨人のようにプレーした。
    cont: true
    emph: true
  sources:
