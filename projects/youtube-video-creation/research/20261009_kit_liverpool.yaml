  - https://www.theguardian.com/football/2005/jul/06/theknowledge.sport
  - https://the1888letter.com/the-first-shirt-sponsors-in-the-football-league/
  - https://www.liverpoolfc.com/news/liverpool-fc-announces-turkish-airlines-main-club-partner-2027-28-season
  - https://www.bbc.co.uk/sport/football/articles/cde0zxy6599o
  - https://www.sportcal.com/sponsorship/standard-chartered-and-liverpool-renew-to-clock-up-17-years/
  - https://www.campaignlive.co.uk/article/liverpool-nets-record-80m-shirt-sponsorship-deal/937941
  - https://sponsorship.sportbusiness.com/2012/03/warrior-sports-draws-strength-from-liverpool-deal/
  - https://www.liverpoolfc.com/news/lfc-and-adidas-reunite-new-multi-year-partnership
  quotes_from:
  - デイリー・エクスプレス https://playupliverpool.com/1979/07/25/liverpool-sign-deal-with-hitachi/
