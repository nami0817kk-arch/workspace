# フェリックス・ヌメチャ（ドルトムント／ドイツ代表）の紹介。選手紹介の型（2026-11-15 公開分、シリーズ「有名選手の紹介」。key: player_406640）。情報の時点は 2026-11-12（クラブの試合は 11/7 のブンデス第9節まで）。
# **FotMob は使わない。**数字は Transfermarkt API の試合記録（控え research/raw/20261115_nmecha_*.json）、英語版 Wikipedia、BVB・各社の記事、自分で割った90分あたり。
# **選んだ理由（2026-11-12）**：player_pool.py list で紹介済みを除いた市場価値の上位は 26 ヌメチャ（6500万）・30 カマラ・33 ファン・ヘッケ・34 G.ラモス。11/13 の佐野（マインツ）と違うクラブで、今季ブンデス9試合4点・9月の月間ベストゴール・W杯のクラサオ戦の先制点と、題の材料が最も強い。
#   重なり：scripts/ を「ヌメチャ」で grep → ニュース・比べる・クラブ紹介に名前が出るだけで紹介は0件。同じ日（11/15）の別シリーズでは使わない。
# **現役・今季もブンデス1部**：TM の試合記録で 2026-11-07 のブンデス第9節（ドルトムント 2-1 エルバースベルク、2得点）まで出場。
# **数字の軸**：TM の試合記録。ブンデス 25/26 は29試合2点2190分、26/27 は9試合4点659分（0.08→0.55 は 点÷分×90 を自分で計算）。通算（トップチームのみ）：シティ3/0、ヴォルフスブルク50/3、ドルトムント128/17、ドイツ代表14/3＝195試合23点。市場価値（TM）：2021-12 70万→2023-06 1500万→2026-10 6500万（÷70万＝92.9 で「およそ93倍」）。
# **本人の言葉**：9/12 の DAZN 取材の英訳（bulinews）からの日本語訳。コバチ監督の言葉は getfootballnewsgermany（2026-11-07）の英訳から（2025年3月の発言と11/7 の試合後の発言）。
# **入れなかったもの**：過去のSNS投稿をめぐる議論（私生活・法的な問題は入れない決まり。Wikipedia が書いている）、信仰の発言。
# **確かめられなかった**：ヴォルフスブルク移籍が「兄の5日後」の一次情報、移籍金3000万は報道、BVB 公式インタビュー全文、W杯2・3戦目の相手名。
# **写真**：Commons の Felix Nmecha 2021（CC BY-SA 4.0）は粗いので使わない。BVB・beIN SPORTS・getfootballnewsgermany の記事写真（代理店のURLではない）。
