# 取材メモ（2026年10月22日）クヴァラツヘリア、前十字じん帯断裂（ニュースのショート。見せ方 Y＝本人のインスタの言葉から始める）
# 怪我の話なので、敬意を持った言い方にする。負傷の場面・担架の写真は使わない。病気・私生活は入れない。本人の言葉とクラブ発表の事実だけで組む。
# 取材: 2026-10-22。requests で原文を読んだ（検索エンジンの要約は使っていない）。
#   ・PSG 公式「Medical update following the Barcelona match」(10/21) — 全文を読んだ（3行）。「torn anterior cruciate ligament in his right knee」「surgery in the coming days」。期間は書かれていない。確定。
#   ・ESPN（記事API content.core.api.espn.com/v1/sports/news/50235833、Mark Ogden、10/21 16:31Z）— 本文を読んだ。本人のインスタグラムの投稿を引用。
#       「通常は少なくとも9か月の離脱」「今季中の復帰の見込みは薄い」は ESPN の記述（報道）。
#       本人の言葉の原文は ESPN の引用のみ（インスタ本体は読めない・第二の出典は見つからなかった）。→ 確度は 報道。
#       ESPN の引用の2文目に文の崩れ（編集の混入）がある。『prepared for this game the best I have ever prepared』の部分は崩れた文の中なので使わない。
#       使う発言は崩れていない2か所だけ：
#         (1)「Not much time has passed, yet one thought keeps circling in my head: why me? I never held anything back,」
#         (2)「I'm ready to go through these months in labor, pain, tears. I know I have to come back stronger for my people who always have my back, I won't let you down.」
#             → (2) の『labor』は原文のまま『苦しみ』に近い意味で訳した（『pain, tears』と並ぶ）。『my people』は『支えてくれる人たち』と訳した。
#   ・ESPN 試合記録（site.api.espn.com summary?event=401915399）— PSG 4-2 バルサ。クヴァラツヘリアは58分に治療、59分にアクリウシュと交代（『because of an injury』）。
# 数字:
#   ・昨季（25/26）の公式戦 48試合19得点、90分あたり0.59、5季で最高 — 10/17 の取材メモ（Transfermarkt・Wikipedia から自分で割った値）を引いた。今回は再計算していない。
#   ・9か月 — ESPN の『at least nine months』。10月下旬＋9か月＝2027年7月下旬（自分で数えた）。今季は2027年5月までなので『今季中は難しい』の ESPN の見立てと合う。
# 入れなかったもの：負傷の場面（接触の相手・担架）。ドゥンベレとマルキーニョスの離脱（題に答えない）。ほかの選手のSNS（ロナウドの追悼は ESPN の見出しだけで中身を読んでいない）。
# 前の本との重なり：10/17『クヴァラツヘリアってどんな選手？』（シリーズ）、10/21『PSG、バルサの全勝を止めた4発』とは別の新事実（負傷の確定と本人の言葉）。数字・写真は使い回さない。
# 反応: まとめサイトで今回の負傷への書き込みを探していない／取れなかった扱い。作らない。approve は --no-voices で。
