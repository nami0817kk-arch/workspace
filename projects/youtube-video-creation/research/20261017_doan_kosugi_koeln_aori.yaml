# 【煽りの版：何を足したか】（2026-10-17 ユーザー指定。同じ画面どうしで煽りの有無を比べる）
#   足したのは題と冒頭1行の煽り語だけ：「まさかの逆襲」（題の頭は「堂安律と小杉啓太」＝名前。札は文に溶かした）。
#   冒頭1行（オープニング）は題をそのまま読むので、煽り語は題の中の「まさかの逆襲」だけ。【】の札は付けない。
#   事実・数字・発言は1字も変えていない：0-6（前節ライプツィヒ）／1-0／3戦ぶり／77分エブヌタリブ／フル出場は全部、下の出典どおり。
#   答えは伏せた：題は「何が逆襲だったのか（二人は決定機を作ったが得点もアシストも付かなかった）」を言わない。
#   選手を小さく見せない：「だけ」「それだけ」は使っていない。得点・アシストが付かなかったことは事実として1行で言い、
#   すぐ「チャンスの起点は二人」と続ける。「逆襲」の主語は題のとおりフランクフルトのチームで、二人が点を取ったとは言っていない。
#   煽りの強さ：「0-6の惨敗のあと、次の試合で3戦ぶりに勝った」を、そのまま強く言う範囲（SK は「バウンスバック」と書いている）。想定・確率は作っていない。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・サッカーキング 2026-10-17 07:29「堂安律＆小杉啓太がフル出場で再三チャンスを演出！…前節惨敗のフランクフルトが3戦ぶりの白星」（本文を全部読んだ。research/raw/20261017_sk1.txt）
#   ・ゲキサカ 2026-10-17 09:24「堂安律&小杉啓太フル出場のフランクフルト、ケルンを下して3試合ぶり勝利」＋試合記録（Opta。research/raw/20261017_gk_doan.html・gk_rec.html）
#   ・日刊スポーツ 2026-10-17「Eフランクフルトが3試合ぶり白星 堂安律＆小杉啓太はフル出場で好クロスから決定機演出」（本文を全部読んだ。research/raw/20261017_nikkan_doan.txt）
#   ・サッカー批評Web（Yahoo!ニュース）2026-10-17 10:15「『A代表で早く見たい』フランクフルトの新星20歳SBが…」（小杉の後半4分の場面の詳細と、SNSの声の引用。research/raw/20261017_yahoo_kosugi.html）
#   ・ドイツ語の一次側（Eintracht 公式・kicker）は JavaScript 描画／403 で読めなかった（requests のみ）。試合記録の公式の数字はゲキサカの Opta 転載で確かめた。
# 日付・場所: 現地10月16日（金）ブンデスリーガ第6節、フランクフルトのホーム（ゲキサカ「コメルツバンク・アレーナ」／日刊「ドイチェ・バンク・パルク」と表記が割れている。台本では会場名を言わない）。
# 得点・数字（3紙で一致）: フランクフルト1-0ケルン（前半0-0）。77分（後半32分）エブヌタリブ。堂安（右MF）・小杉（左SB）は先発フル出場。ゲキサカ：14位→暫定8位／9月12日第3節マインツ戦（3-1）以来の勝利／次節は24日、ドルトムントのホーム。
#   前節ライプツィヒに0-6（SK）。→「3試合ぶり」は SK・ゲキサカ・日刊で一致（第4・5節は勝てず）。
# 資料間のずれ:
#   ・決勝点の形：SK「途中出場クナウフのダブルタッチのラストパスをボックス右で受けたエブヌタリブが右足」／日刊「クナウフのテクニカルなラストパスにエブヌタリブが抜け出し、右から持ち込んで決勝弾」／
#     ゲキサカ「右サイドのスローインの流れから、エブヌタリブがMFネル・ヌキリ（原文表記）とのコンビネーションで崩し、右足」→ 3紙で形が違う。台本は「77分、エブヌタリブが決めた」だけ言い、形は言わない。
#   ・堂安の決定機の数：SK「3分・55分（後半10分）のクロス」＋9分の起点／日刊「前半3分・同9分・後半4分（小杉）・同10分・同13分」→ 13分（堂安→シャイビ）は日刊だけ。台本は5つ全部を言わず、
#     「前半3分」「後半4分」「後半10分と13分」「前半9分を加えると5回」と、どの紙で見つかったかで区別せず数える（下の自分で数えた）。
#   ・会場名の表記違い（上）。
# 自分で数えたもの（見立て）: 二人が起点のチャンス。前半3分（堂安の右足クロス→エブヌタリブのボレー。SK・日刊）／前半9分（堂安を起点に小杉も絡む左サイド→シャイビのシュート。SK・日刊）／
#   後半4分（小杉の左足クロス→エブヌタリブのヘディング。SK・日刊・サッカー批評Web）／後半10分（堂安のクロス→ブラシエのヘディング。SK・日刊）／後半13分（堂安のクロス→シャイビ。日刊のみ）＝5回。
#   → 台本は「報じられた中で、二人が起点のチャンスは5回」と言う。「全部」「ほかは無い」とは言わない（記事に出ていないチャンスは数えられない）。
# 本人の言葉: 堂安・小杉本人の試合後のコメントは、SK・ゲキサカ・日刊・サッカー批評Webのどれにも無かった。本人の言葉は入れない。
#   当たった先: 上の4本の本文。本人のSNS（X・Instagram）は、ブラウザの道具を使わない決まりのため当たっていない（未確認）。
# 反応: サッカー批評Webの記事が、DAZN Japan 公式Xの投稿（小杉の後半4分の場面）に付いたSNSのコメントとして引用している5件のうち、3件。匿名。Xの元の投稿ページは読んでいない（記事経由）。
#   記事が全文を引いているのか、途中を切っているのかは確かめられない（元投稿は未確認）。切らずに、記事に出ている形のまま。堂安についての書き込みは見つからなかった（NO FOOTY NO LIFE・日刊・ゲキサカ・Yahoo の10/17 朝時点）。
#   当たった先: サッカー批評Web（Yahoo経由）、NO FOOTY NO LIFE の一覧（堂安・小杉の回は10/17 昼時点で無し）、ゲキサカ・SK・日刊の本文。
