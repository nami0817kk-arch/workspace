  slot: 日本人
  head: PSG対リヨンが日曜から月曜（日本時間火曜4時30分）へ。警察の要請で、バロンドールの授賞式と重なる。中村敬斗は出場停止
  why: ESPN・BBC：パリの警察が日曜のPSG対リヨンの開催を禁じ、LFPは月曜20時30分（現地）へ移した。理由は全国で続く抗議行動とパリでのNFL試合。PSGは10人がバロンドールにノミネート中で、新しい時刻はロンドンの授賞式（月曜夜）と重なる。両チームは勝ち点14で首位並び。中村敬斗は18日のニース戦の退場で1試合の出場停止（10/23 の本で扱い済み）のため、この試合は欠場の見込み（処分は次のリーグ戦）。**条件：日本代表には絡みません。本人の言葉なし**。確度：確定（ESPN・BBC）。**弱い：中村は10/19・21・23 と連日。今回の新しい出来事は日程の移動だけ**。写真：未確認。時刻：9〜17時。試験：X。
  src: ESPN（試合の移動）、BBC
  url: https://www.bbc.com/sport/football/articles/cw8rz3eyn26po
  fmt: news
  weak: true
