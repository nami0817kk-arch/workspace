  head: 町野修斗が逆転弾。最下位ボルシアMGが開幕6連敗を止め、シュツットガルトに3-2で今季初白星
  why: 23日のブンデス第7節（ゲキサカ・ESPN）。町野は橋岡大樹・宇野禅斗とそろって先発。1-1の後半6分、17歳のモヒヤが左から突破してのマイナスの折り返しに反応し、左足でゴール左上へ。3試合ぶり今季2点目で、これが勝ち越し点。ボルシアMGは7試合目で初勝利、順位は最下位のままだが残留圏の15位との差は暫定で2。ESPNによると、負けていれば「ブンデス史上初の開幕7連敗」だった。**条件：日本代表に当たる（W杯でデビュー）。町野本人の言葉は取れていません**。確度：確定（結果）。写真：コモンズでの件数は未確認（探し直し）。時刻：9〜17時。試験：X。
  src: ゲキサカ（町野の2点目）、ESPN（連敗阻止）
