  head: コンテ「根拠のない報道だ」。マンU監督就任の噂に、インスタで自ら否定。ヒュルツェラーも「噂を考える時間はない」
  why: BBC：伊紙ラ・レプブリカが、コンテがマンUの首脳と話し、移籍政策の全権を求めたと報道。コンテはインスタで「多くのクラブと結び付けられるが、進んだ交渉は今はない。報じられた金銭の要求や全権の要求は根拠がない」。BBCは「コンテは就任に前向きと理解している」とも書く。ブライトンのヒュルツェラー：「自分の仕事に集中している。3日おきに試合があり、噂を考える時間はない。キャリックには敬意がある」。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（本人の否定）。**弱い：他人（候補）の話でマンUが続く。報道側の中身は出典1本（ラ・レプブリカ）なので使わない**。写真：コンテはコモンズに多数。時刻：18時以降。試験：Y。
  src: BBC、ESPN
  url: https://www.bbc.com/sport/football/articles/cmvg6j8jezn7o
  fmt: quote
  weak: true
- num: 8
  slot: 海外
  head: デ・ゼルビ「医療スタッフに責任はない。普通の状況だ」。ケガ人9人の中、スタンフォード・ブリッジで勝てるのか
  why: ガーディアン：24日（日本時間25日1時30分）にチェルシー戦。ポロは復帰、ロバートソン・マルムーシュ・ソランケは「良い」、ウドジェは欠場、ベルグヴァルらも長期離脱で最大9人。デ・ゼルビは、ポロは「スペインでW杯を勝った。プレシーズンなしで間に合わなかったのかも」、ベルグヴァルは「開始1分で膝をひねった。責任はどこにある？ない」と具体例で説明。ESPN：スパーズはスタンフォード・ブリッジで33回のPL訪問で1勝、2018年から勝っていない。**条件：本人の言葉に当たる。W杯（ポロのスペイン優勝）に一言触れる**。確度：確定（会見）。写真：コモンズにデ・ゼルビは2,707件ほど。時刻：18時以降。試験：Y。
  src: ガーディアン（会見）、ESPN
  url: https://www.theguardian.com/football/2026/oct/23/premier-league-news-spurs-nine-injuries-normal-says-de-zerbi-emotional-control-keeps-blues-red-free
  fmt: quote
- num: 9
  slot: 海外
  head: アロンソ「感情のコントロールだ」。昨季11枚だったチェルシーの退場が、今季はゼロ
  why: ガーディアン：チェルシーは昨季レッドカード11枚、今季はまだ0。アロンソ：「感情のコントロールと試合のコントロールだ。やるべきことに集中していれば、過剰に反応しない」「ばかげたイエローも、ばかげたPKもない」。経験のある選手の補強が効いたとも。「PLで完全に試合を支配するのは、本当にトップのチームでないと難しい。2-0でも気は抜けない」。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。写真：コモンズにアロンソは123件ほど（探し直し）。時刻：18時以降。試験：Y。
  src: ガーディアン（会見）
  url: https://www.theguardian.com/football/2026/oct/23/premier-league-news-spurs-nine-injuries-normal-says-de-zerbi-emotional-control-keeps-blues-red-free
