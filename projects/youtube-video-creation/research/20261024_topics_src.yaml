title: 10月24日のショート題材
lead: 候補約80件から22件（日本人4件・海外18件）。ショート10本ぶんを○で選んでください。
note: 今日は土曜（24日）、日本時間10時半時点で集めました。昨夜（23日夜〜24日朝）の試合は金曜開催のイプスウィッチ1-1フォレスト、シュツットガルト2-3ボルシアMG、ブレスト1-2ニース、トリノ3-2モンザ、アラベス1-1マラガだけで、動きが少ない日です。きょうの試合：ヴィラ対マンC（20時30分）、アーセナル対エヴァートン（23時）、<b>チェルシー対スパーズ（25日1時30分）</b>、<b>日曜（25日）にクラシコ</b>、<b>月曜（26日）にバロンドール授賞式</b>（PSG対リヨンは月曜に移動）。<br><br><b>日本人の題は4件だけです。</b>新しい出来事があったのは町野（逆転弾）と、中村敬斗の試合日程の移動だけで、前田・鈴木彩艶は『弱い』にしました。久保・鎌田・鈴木唯人・三笘・上田・冨安の新しい出来事は見つかっていません（三笘はブライトンの故障者表に「ハムストリング・10/31」とあるのみで、出典1行なので出していません）。日本代表（11/14 ブラジル戦）に絡む新しい話も取れていません。<br><br><b>ヒットの条件：</b>本人の言葉（監督を含む）が取れたのは14件。日本代表・W杯に絡むのは町野・前田・鈴木彩艶と、ロドリ（スペインのW杯優勝主将）、デ・ゼルビ（ポロのW杯）、サカ、バロンドール、ヤマル/ムバッペ、グロス（EURO）です。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外。<br><br><b>重なりの注意：</b>マンUの題が3件（6・7・19）、チェルシー対スパーズが4件（8・9・10・21）、サカ/アーセナル2件（11・12）、クラシコ2件（13・16）あります。同じ話題は1〜2件に絞るのを推奨します。サカ負傷（10/22）、ブルーノ対キャリック（10/22）、ムバッペの発言（10/22）、ングモハのアシスト（10/21）とは一部重なるので、各行の「弱い」に書きました。<br><br><b>読めなかった先：</b>ロマーノなど移籍記者のXは、ブラウザの道具を使えない決まりのため<b>読めませんでした</b>。移籍の題は出していません。サッカーキング・フットボールチャンネルは接続が遅く一覧が取れませんでした。フットボールゾーンの『EL初ゴールの日本人』は本文が開けず出していません。ゲキサカの一覧は記事が少なく、金曜夜〜今朝の分だけでした。ESPN・ガーディアン・BBCの本文は読みました。コモンズの件数は一部しか数えられず、残りは「未確認」と書きました。女子サッカー・Jリーグ・MLS・リーガMXは出していません。FotMobは使っていません。
