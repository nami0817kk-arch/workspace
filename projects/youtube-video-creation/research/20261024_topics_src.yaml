  slot: 海外
  head: バイエルンのコンパニ監督、練習中に倒れ病院へ。クラブ「徹底的な検査を受けている」、日曜はフライブルク戦
  why: ガーディアン・ESPN：23日、コンパニ（40歳）が2軍の練習を見ている間に倒れ、病院へ。ここ数日ウイルス感染で脚に痛みがあり、水曜のCLアーセナル戦（2-2）も指揮した。クラブ「徹底的な検査を受け、医師の管理下に残る。当面はコーチ陣が練習と試合の運営を担う」。エーベルル：「ヴィンセントの健康が最優先。必要なだけ時間をかけてほしい」。試合後にコンパニは、病気を押して指揮し体の信号を聞かなかったと認めた（ESPN）。診断は未発表。**条件：本人の言葉は取れていません（クラブ声明とエーベルル）。代表・W杯には絡みません**。確度：確定（クラブ声明）。病状は憶測しない。写真：コモンズに57件ほど。時刻：18時以降。試験：X。
  src: ガーディアン（クラブ声明）、ESPN
  url: https://www.theguardian.com/football/2026/oct/23/vincent-kompany-hospital-collapsing-bayern-munich-training
  fmt: news
- num: 6
  slot: 海外
  head: キャリック、5分27秒の独白。「傘を持つ。ほかの全員が濡れずにいられるように」。ブルーノの主将剥奪は否定せず
  why: ガーディアン・ESPN：金曜の会見の冒頭、質問なしで5分27秒話した。「謙虚さ」「粘り強さ」「勝つ権利を得る」。「私はここにいる資格がない。資格意識はこのクラブにあってはならない」。ギグス、ルーニー、ファーガソンを挙げ、「私が傘を持つ。私が濡れて、ほかの全員が濡れずにいられるように」。立て直せるかは「100%」。ブルーノを外すか主将から外すかは「クラブにとって最善のことを常にやる」と答えず。「分裂はしていない」。マンUは11試合で2勝。日曜はボーンマス戦。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（会見）。10/22 の『ブルーノ対キャリック』の続き。写真：コモンズに1,079件ほど。時刻：18時以降。試験：Y。
  src: ガーディアン（会見）、ESPN
  url: https://www.theguardian.com/football/2026/oct/23/michael-carrick-monologue-manchester-united-umbrella-bruno-fernandes
