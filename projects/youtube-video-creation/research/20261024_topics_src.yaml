  head: 前田大然は後半28分から出場。守備では5バックの一角、攻撃では最前線まで走るも、イプスウィッチはフォレストと1-1
  why: 23日夜のPL第8節（ゲキサカ・ガーディアン・ESPN）。前田は3試合ぶりのベンチスタートで、3人目の交代として後半28分に右サイドハーフで投入。守備時は最終ラインまで戻り、38分には中盤のプレスからカウンターのスイッチを入れたが、ゴールにはつながらなかった。試合は前半13分フォレストが先制、41分エンシソが同点。後半にディオプがマカティーを倒したがVARで警告止まり（フォレストのグラスナー監督は「誤審だが審判のせいにはしない」）。**条件：日本代表に当たる。本人の言葉・監督の言葉は取れていません**。確度：確定。写真：未確認。**弱い：出番は短く新しい出来事は小さい。前田は10/11・18・19・21 と連日**。時刻：9〜17時。試験：X。
  src: ゲキサカ（前田の出場）、ガーディアン・ESPN（試合展開）
