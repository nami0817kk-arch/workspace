- num: 10
  slot: 海外
  head: アロンソ「クルトワもペンダースに自分を見ている」。負傷のE・マルティネスに代わり、21歳が初のPL先発
  why: ESPN・ガーディアン：エミ・マルティネス（ヴィラから700万ポンド）は顎の骨折で数週間離脱。ペンダース（21歳・ベルギー）はチェルシー史上最年少のPLキーパーで、スパーズ戦でPL初先発。アロンソ：「背丈も、左利きも、空中戦の強さも似ている。W杯のときクルトワに聞いたら、彼自身も似ていると言った」「いまと将来のキーパーだ」。2人ともゲンク出身。**条件：本人（監督）の言葉に当たる。W杯はクルトワとの会話に一言**。確度：確定。写真：コモンズにペンダースは162件ほど。時刻：18時以降。試験：Y。
  src: ESPN（アロンソの会見）、ガーディアン
  url: https://www.espn.com/soccer/story/_/id/50258511
  fmt: quote
- num: 11
  slot: 海外
  head: アルテタ「負荷をどう管理するか」。サカは大腿の筋肉、最長6〜8週間の恐れ。2023年9月から11回目のケガ
  why: BBC・ガーディアン：サカはバイエルン戦（2-2）で負傷し、MRI。アーセナルは最低6週間、長ければもっと、と見ている。アルテタ：「かなりの水が溜まっていて程度が分かりにくい」「歩けず動きが制限される。良い兆候ではない」「戻ったとき、どう負荷を管理するか理解する必要がある」。2023年9月から11回のケガ、ネーションズリーグのクロアチア・スペイン戦も欠場の恐れ（BBC）。**条件：本人（監督）の言葉に当たる。イングランド代表・W杯（3位決定戦でハットトリック）に当たる**。確度：確定（会見）、期間は報道。**弱い：10/22 の『サカ負傷』と重なる。新しいのはMRI後の見立てと『ケガ11回』**。写真：コモンズにサカは51件ほど。時刻：18時以降。試験：Y。
  src: BBC、ガーディアン
  url: https://www.bbc.com/sport/football/articles/cmwyql6v5q82o
  fmt: quote
  weak: true
- num: 12
  slot: 海外
  head: 16歳ダウマン、サカ不在のエヴァートン戦で出番か。アルテタ「いい物語になる」
  why: ガーディアン：24日（日本時間23時）アーセナル対エヴァートン。ダウマンは3月にエヴァートン戦でPL最年少得点（16歳73日）。今季のPLは9分だけで、カラバオ杯で2得点。アルテタ：「練習で、プレーする機会があるたびに試合に影響を与える選手だと示している。出番は必ずある」「勝てばいい物語になる」。**条件：本人（監督）の言葉に当たる。代表・W杯は絡みません**。確度：確定。**弱い：試合の前の話で、結果が出る前に出す内容に限る。題11と同じ会見**。写真：コモンズにダウマンは26件ほど。時刻：18時以降。試験：Y。
  src: ガーディアン、ESPN
  url: https://www.theguardian.com/football/2026/oct/23/arsenal-arteta-concerned-saka-durability-six-week-absence
