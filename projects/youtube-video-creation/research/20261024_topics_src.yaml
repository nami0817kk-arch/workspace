- num: 13
  slot: 海外
  head: ロドリ「彼らは僕らをだませない」。初のクラシコ。W杯を主将として制したスペインの司令塔が語る
  why: ESPN：マンCから夏にバルサへ。レアルは今季リーグ2敗、バルサは全勝。ロドリ：「彼らの強みは、相手に自分たちはそれほどでもないと思わせることだ。僕らはだまされない」「感情が高まる試合だからこそ、感情を脇に置いて冷静に」「子どもの頃からテレビで何度も見た。初めて体験するのが楽しみだ」。夏にはレアルに入る可能性もあった。日曜（日本時間26日未明）にカンプ・ノウ。**条件：本人の言葉に当たる。W杯（スペイン優勝の主将）に当たる**。確度：確定（ESPNの取材）。写真：コモンズにロドリは5,269件ほど（同名の混入あり、探し直し）。時刻：18時以降。試験：Y。
  src: ESPN
  url: https://www.espn.com/soccer/story/_/id/50258856
  fmt: quote
- num: 14
  slot: 海外
  head: チュアメニ「あれは殴り合いじゃない」。バルベルデとの更衣室の件を、クラシコ前に自分のYouTubeで説明
  why: ESPN：5月の更衣室の件でバルベルデは頭を負傷して入院、2人は合計100万ユーロの罰金。チュアメニは木曜、自分の番組『The Bridge』で「殴り合いは無かった。更衣室ではよくあること。レアルだと小さなことが大きくなる」「ごく小さなことだ。いまは何の問題も無い」。モウリーニョは8月に「ゼロから見る。問題は見ていない」。2人はクラシコでも出場の見込み。**条件：本人の言葉に当たる。代表・W杯は絡みません**。確度：確定（本人の番組、ESPN）。写真：コモンズにチュアメニは50件ほど。時刻：18時以降。試験：Y。
  src: ESPN
  url: https://www.espn.com/soccer/story/_/id/50257348
  fmt: quote
- num: 15
