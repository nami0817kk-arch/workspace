# 日本人選手 の取材メモ（2026年10月16日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 取材: 2026-10-16。requests（ブラウザUA）で原文を読んだ（控えは research/raw/20261016_kubo_sk.html・20261016_kubo_gekisaka.html）。
#   サッカーキング（10/16 配信、短い試合記事）：46分トゥリエンテス／88分ケイタ、68分に久保がスチッチと交代、先月18日のEL・ボーンマス戦以来の公式戦3試合ぶり、
#     ソシエダは開幕2戦未勝利、ユニオンは無敗維持。写真は Getty（使わない）。
#   ゲキサカ（10/16 04:06、Opta 提供の記録つき）：久保は後半23分（＝68分）から4-2-3-1のトップ下。24-25シーズン序盤以来約2年ぶり。公式戦6試合連続のベンチスタート。
#     後半38分（＝83分と換算）に右のパブロ・マリンのスルーパスで抜け出し右足クロス、相手にカバーされた。後半43分（＝88分）FKの流れで同点。
#     ハーフナー・ニッキはCBで先発（兄は元日本代表FWハーフナー・マイク氏、U-20日本代表歴）。交代の記録に名前は無い。ソシエダは今大会1分1敗、ユニオンは1勝1分。
#   二つの記事で 46分・68分・88分・1-1 は一致。後半の分表記（SKは通しの分、ゲキサカは後半の分）は台本では通しの分にそろえた。
# 反応は取れなかった：当たった先は 5ちゃんねるまとめ（footballnet 2chblog）と NO FOOTY NO LIFE の久保・鈴木カテゴリー。
#   どちらも今朝時点でこの試合の記事・スレッドが無かった（久保は結婚発表・W杯の距離・出番なしの旧スレのみ）。→ 0件。approve は --no-voices で。
# 本人・監督の試合後コメント：読んだ2記事に無く、他の出典も当たれなかった → 台本に入れない（「誰かの言葉」を16秒までに置く決まりは満たせない）。
# 直接の対決：久保とニッキが直接競り合った場面は、どちらの記事にも書かれていない → 「記事に書かれていない」と台本で言う。
# 10/15 に出した久保（ブレトスの言葉）は繰り返さない。
# 不確かな点：SKは「先月18日のボーンマス戦以来、公式戦3試合ぶり」。ゲキサカは「6試合連続ベンチスタート」。両方とも報道のまま使い、突き合わせは台本で言わない。
