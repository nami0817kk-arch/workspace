# ラウール・ゴンサレス（元スペイン代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-12。型は 11/10 ブッフォンと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Raúl González の成績表・本文、1998 Intercontinental Cup、2002 Intercontinental Cup、2000 UEFA Champions League final）と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**。引退後の役職（監督など）は台本で言わない。
# **重なりの確認（2026-11-11）**：scripts/・research/covered.yaml・research/posted.json を「ラウール／Raúl」で grep。主役の回は無し。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス・ルーニー・ブッフォン）と重ならない。research/20261112_picks.txt 参照。
# **引退の確認**：Wikipedia「On 16 October 2015 ... Raúl would retire at the end of the season」、Guardian 2015-11-16「New York Cosmos bid farewell to Raul with NASL title victory」（Soccer Bowl 2015、2015-11-15）。→ 選手としては現役ではない（2026年11月時点で49歳）。
# **日本との接点**：①1998-12-01 トヨタカップ（東京・国立競技場）レアル・マドリード 2-1 ヴァスコ・ダ・ガマ。ナーザのオウンゴール25分で先制、ジュニーニョ56分で同点、ラウール83分で決勝点。最優秀選手はラウール（Wikipedia「1998 Intercontinental Cup」）。②2002-12-03 トヨタカップ（横浜・国際総合競技場）レアル・マドリード 2-0 オリンピア。ロナウド14分・グティ84分。ラウールは先発（左で背番号7、Wikipedia「2002 Intercontinental Cup」）。優勝の記録は本人の記事の Honours（1998・2002）と一致。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：レアル・マドリード 741試合323点（季ごとの合計と一致）、Real Madrid C 9試合16点・Real Madrid B 1試合0点、シャルケ 98試合40点、アル・サッド 61試合16点、ニューヨーク・コスモス 32試合9点。Career total 942試合404点（741+98+61+32+10=942、323+40+16+9+16=404 と一致）。スペイン代表 102試合44点。クラブと代表の合計 1044試合448点（自分で足した値：942+102、404+44）。**年代別代表は含めない**。
# - クラブの得点記録：2009-02-15 スポルティング・ヒホン戦でディ・ステファノの307点を抜く（Wikipedia）。チャンピオンズリーグ71点（レアル66・シャルケ5。Wikipedia）。2011-02-15 バレンシア戦でヨーロッパの大会の得点でゲルト・ミュラーを抜く（Wikipedia）。
# - スペイン代表：2002-09-07 ギリシャ戦で29点目、ヒエロの記録に並ぶ。2003-02-12 ドイツ戦（パルマ・デ・マヨルカ）で2点、記録を抜く（Wikipedia）。2002年からキャプテン、2006年に代表を退く。
# - レアル・マドリードのチャンピオンズリーグ優勝：1998・2000・2002。ラウールは1999-2000・2000-01 の得点王（Wikipedia）。
# **山場**：2000-05-24 チャンピオンズリーグ決勝、パリ（スタッド・ド・フランス）、バレンシア戦。39分モリエンテスの頭で先制、67分マクマナマンのボレー、75分ラウールがカウンターからカニサレスをかわして3点目、3-0（Wikipedia「2000 UEFA Champions League final」）。スペインのクラブどうしの初めての決勝。
# **マル秘話**：①Real Madrid C で9試合16点、うち1試合で5点（対 CD Corralejo）。トップチームへはバルダーノ監督が引き上げた。②1999年10月、カンプ・ノウで得点して指を唇に当てた（Wikipedia）。③2002-03 は虫垂炎で入院、それでもリーグ16点（Wikipedia）。
# **見立て（自分で足した・割った値）**：レアル・マドリードの季ごと（公式戦、試合/点）94-95 30/10、95-96 52/26、96-97 47/22、97-98 49/15、98-99 49/29、99-00 57/29、00-01 50/32、01-02 55/29、02-03 47/25、03-04 53/20、04-05 43/13、05-06 32/7、06-07 43/12、07-08 48/23、08-09 47/24、09-10 39/7（合計 741/323 と一致）。1998-99〜2001-02 の4季：試合 49+57+50+55=211、点 29+29+32+29=119、1季29.8点（4で割る）。ほかの12季：試合 741-211=530、点 323-119=204、1季17.0点。119÷323＝36.8%→37%。29.8÷17.0＝1.75→およそ1.8倍。10点以上の季は16季中14季（7点の季が05-06 と09-10）。
# **入れなかったもの**：移籍の経緯・私生活・家族・監督としての経歴と現在の役職、ロナウドとの得点争い、ほかの選手との比較、左右どちらの足か（記述が怪しい）、「最多」「最年少」。
# **読みで怪しいもの**：ラウール・ゴンサレス、ディ・ステファノ、ヴァスコ・ダ・ガマ、オリンピア、ロナウド、グティ、モリエンテス、マクマナマン、カニサレス、ヒエロ、ゲルト・ミュラー、シャルケ、アル・サッド、コスモス、カンプ・ノウ、コルラレホ、スポルティング・ヒホン。「2006-07」のような書き方はしない。
