#   ・サッカーキング 2026-10-27「デ・ラ・フエンテ監督、最優秀監督賞を初受賞」（https://www.soccer-king.jp/news/world/20261027/2221647.html）
#       26日ロンドンで授賞式。ヨハン・クライフ・トロフィー（最優秀監督）をデ・ラ・フエンテが初受賞。就任後 UNL2022-23・EURO2024、今夏の北中米W杯で4大会ぶり2度目の優勝。
#       同賞は2024年新設。初年度アンチェロッティ（当時レアル）、昨年ルイス・エンリケ（PSG）。※記事は「2023年より率いる」と書くが Wikipedia は2022年12月就任。就任年は言わない。
#   ・サッカーキング 2026-10-27「ヤシン・トロフィーはW杯優勝守護神に決定」（https://www.soccer-king.jp/news/world/20261027/2221633.html）
#       ウナイ・シモン初受賞。W杯は全8試合でゴールを守り、大会を通して1失点。ゴールデングローブ賞。ラヤ・ジョアン・ガルシアも候補で、W杯のスペインのGK3人全員が候補。
#   ・サッカーキング 2026-10-26「“気高き約束”がついに実現へ！？」（https://www.soccer-king.jp/news/world/esp/20261026/2221143.html。スペイン紙アスの引用）
#       W杯で「大会最少失点（8試合1失点）」と「最長無失点時間（649分）」の2つの大会記録。2024年5月にビッグクラブのオファーを断り、ビルバオと2029年夏まで延長。
#       本人の言葉（2024年の延長時）「僕はアスレティック・ビルバオで、世界最高のGKを目指す」。→ 受賞の言葉ではない。2024年の言葉と断って1行だけ使う。
#   ・サッカーキング 2026-10-27 コパ・トロフィー（https://www.soccer-king.jp/news/world/20261027/2221635.html）ヤマルが史上初の3年連続。→ 別のショートで扱うので1行まで。
#   ・ESPN「Ballon d'Or 2026 results」（content.core.api.espn.com/v1/sports/news/50289067）男子のGKの順位: 1位シモン、2位ラヤ（アーセナル）、7位ジョアン・ガルシア（バルサ）。
#       監督賞 Luis de La Fuente (Spain)。男子バロンドールはケイン、3位ヤマル・4位ロドリ・10位ファビアン・ルイス。
