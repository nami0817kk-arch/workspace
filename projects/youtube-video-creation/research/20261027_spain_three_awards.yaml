            - ["2", ダビド・ラヤ, アーセナル]
            - ["7", ジョアン・ガルシア, バルセロナ]
          highlight_row: 0
      - text: スペイン代表のゴールキーパー3人が、そろって10位以内に入りました。
        image: assets/images/20261027_spain_three_awards/03_w.jpg
        card: none
      - text: 一方、バロンドールそのものはケイン。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
      - text: スペイン勢の最高は、ヤマルの3位とロドリの4位でした。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
