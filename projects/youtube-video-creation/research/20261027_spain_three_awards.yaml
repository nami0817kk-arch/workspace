# 取材メモ（2026年10月27日）W杯王者スペインが授賞式で3つ（監督デ・ラ・フエンテ・GKウナイ・シモン・21歳以下ヤマル）。ニュースのショートだけ（no_main）。見せ方 X（受賞者の言葉は読んだ範囲に無い）。
