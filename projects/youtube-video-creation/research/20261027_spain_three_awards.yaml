sections:
  - id: what
    main: true
    heading: スペインが取った3つの賞
    tier: 報道
    telop: 授賞式で、スペイン代表から3人
    say:
      - text: 26日のバロンドール授賞式。ワールドカップ王者スペインから、3人が賞を受けました。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
      - text: 最優秀監督の賞は、デ・ラ・フエンテ監督。初受賞です。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
      - text: この夏、スペインを4大会ぶり2度目の世界一に導きました。
        image: assets/images/20261027_spain_three_awards/02_w.jpg
      - text: ゴールキーパーに贈られるヤシン・トロフィーは、ウナイ・シモン。こちらも初受賞です。
        image: assets/images/20261027_spain_three_awards/03_w.jpg
      - text: そして21歳以下のコパ・トロフィーは、ヤマルが3年続けて受けました。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/20261027/2221647.html
      - https://www.soccer-king.jp/news/world/20261027/2221633.html
      - https://www.soccer-king.jp/news/world/20261027/2221635.html
      - https://content.core.api.espn.com/v1/sports/news/50289067

  - id: simon
    heading: ウナイ・シモンは、ワールドカップで何をしたのか
    tier: 報道
    telop: 全8試合で、失点は1
    say:
      - text: シモンは2024年、大きなクラブの誘いを断って、ビルバオに残りました。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
      - text: そのときの言葉です。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
      - voice: ウナイ・シモン
        text: 僕はアスレティック・ビルバオで、
        image: assets/images/20261027_spain_three_awards/03_w.jpg
      - voice: ウナイ・シモン
        text: 世界最高のゴールキーパーを目指す。
        cont: true
        image: assets/images/20261027_spain_three_awards/03_w.jpg
      - text: ワールドカップでは全8試合のゴールを守り、失点はわずか1。
        image: assets/images/20261027_spain_three_awards/03_w.jpg
      - text: 649分、点を取られなかった時間も、大会の記録になりました。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
      - text: 大会のゴールデングローブ賞も受けています。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/20261027/2221633.html
      - https://www.soccer-king.jp/news/world/esp/20261026/2221143.html

  - id: coach
    heading: 監督の賞は、前任者からの受け渡し
    tier: 報道
    telop: 去年の受賞は、前のスペイン代表監督
    say:
      - text: 監督の賞は、2024年にできたばかりです。
        image: assets/images/20261027_spain_three_awards/02_w.jpg
      - text: 最初はアンチェロッティ、去年はパリ・サンジェルマンのルイス・エンリケでした。
        image: assets/images/20261027_spain_three_awards/02_w.jpg
      - text: ルイス・エンリケは、デ・ラ・フエンテの前にスペイン代表を率いていた監督です。
        image: assets/images/20261027_spain_three_awards/02_w.jpg
      - text: デ・ラ・フエンテはそのあとを継ぎました。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
      - text: ネーションズリーグ、ユーロ2024、ワールドカップと、3つを制しています。
        image: assets/images/20261027_spain_three_awards/01_w.jpg
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/20261027/2221647.html

  - id: view
    viewpoint: true
    heading: スペインの守護神は、どれだけ抜けていたか
    tier: 背景
    telop: ゴールキーパーの投票、スペインの3人が10位以内
    say:
      - text: 見立てです。ゴールキーパーの投票の順位を、並べてみました。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
      - text: 1位がシモン、2位がアーセナルのラヤ、7位がバルセロナのジョアン・ガルシア。
        image: assets/images/20261027_spain_three_awards/05_w.jpg
        card:
          type: table
          title: ヤシン・トロフィーの順位（抜粋）
          columns: [順位, 選手, 所属]
          rows:
