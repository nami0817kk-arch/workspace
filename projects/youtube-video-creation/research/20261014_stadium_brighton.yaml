  takeaway: ブライトンの本拠地は、2009年の市の資料で計画が2万2374席だった。今季2026-27の開幕時の収容は3万2176人で、9802席ふえ、計画の1.44倍になっている。2012年に8000席を足す計画が認められ、東スタンドに段を足して収容は3万人を超えた。開幕時の収容は2022年が3万1780人、2025年が3万1876人、今季はさらに300ふえた。9月19日の入場は3万1944人で、収容の99.3%にあたり、空きは232。開場の年の平均入場2万28人から昨季の3万1379人へは1.57倍で、席の増え方1.44倍を上回る。収容はプレミア20クラブの13番目で、20クラブの平均の78%。土地が候補になった1998年から開場の2011年まで13年かかり、審問は2度、審査官は2003年に不許可を勧めていた。このスタジアムの最初のリーグ戦の相手ドンカスターは、前の本拠地の最終戦の相手と同じだった。次の本拠地戦は10月18日のクリスタル・パレス戦で、2011年9月にこの本拠地のリーグ戦で最初に負けた相手になる
