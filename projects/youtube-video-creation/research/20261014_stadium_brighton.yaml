      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 開場のシーズンのリーグ戦の最大、2万968人より、8000人以上多い数です。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 2017年8月12日は、プレミアリーグの最初の試合です。
