- id: view
  viewpoint: true
  heading: 見立て・足して育てた器は、どこまで満員に近いのか
  tier: 報道
  telop: 収容は20クラブで13番目。入場は収容の99.3％
  narrator: 解説
  card: &id_rank
    type: table
    title: 今季の収容、20クラブの順位（自分で並べた）
    columns: &cols_rank
