      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: 入場は2万219人。計画の席数の、9割ほどでした。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: このドンカスターは、前の本拠地ゴールドストーンの、最後の試合の相手と同じでした。
    emph: true
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: 1997年4月26日、1対0で勝っています。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: リーグ戦で初めて負けたのは、9月27日。クリスタル・パレスに、1対3でした。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 入場2万968人は、その季のリーグ戦では、本拠地でいちばん多い数でした。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 2015年9月19日は、ラグビーのワールドカップです。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 日本が、南アフリカを34対32で破りました。
    emph: true
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
