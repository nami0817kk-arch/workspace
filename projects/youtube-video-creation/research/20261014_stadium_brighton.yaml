      - 3万294人
  say:
  - text: 最後に、この本拠地の数字を、自分で比べてみます。
    image: assets/images/20261014_stadium_brighton/02_w.jpg
    card: *id_rank
  - text: まず、プレミア20クラブの今季の収容を、大きい順に数えました。
    card: *id_rank
  - text: ブライトンは13番目。上に12クラブ、下に7クラブです。
    emph: true
    card:
      type: table
      title: 今季の収容、20クラブの順位（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: 20クラブの平均は、4万1118人。ブライトンは、その78％です。
    card:
      type: table
      title: 今季の収容、20クラブの順位（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: 大きいほうではありません。それでも、9月19日の入場は、収容の99.3％でした。
    card: &id_fill
      type: calc
      title: 9月19日の入場と今季の収容（自分で割った）
      terms:
      - - 3万1944人
        - 9月19日の入場
      - - 3万2176人
        - 今季の開幕時の収容
      - - 99.3％
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 空いていたのは、232席だけです。
    emph: true
    card: *id_fill
  - text: 次に、客の増え方を見ます。
    card: &id_growth
      type: calc
      title: 平均入場の増え方（自分で割った）
      terms:
      - - 3万1379人
        - 昨季の本拠地の平均入場
      - - 2万28人
        - 開場の年の平均入場
      - - 1.57倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 昨季の平均入場を、開場の年の平均で割ります。
    card: *id_growth
  - text: 答えは1.57倍。席の増え方は1.44倍でした。
    emph: true
    card: *id_growth
  - text: 開場の年の平均は、計画の席の89.5％。席の増え以上に、客が増えました。
    card: *id_growth
  - text: 次の本拠地戦は、10月18日。相手はクリスタル・パレスです。
    emph: true
    card: none
  - text: 2011年9月、この本拠地のリーグ戦で、最初に負けた相手です。
    card: none
