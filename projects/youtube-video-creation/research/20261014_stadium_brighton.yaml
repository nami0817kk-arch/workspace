    - クラブ
    - 収容
    rows: &rows_rank
    - - 11位
      - アストン・ヴィラ
      - 3万6887人
    - - 12位
      - コヴェントリー
      - 3万2609人
    - - 13位
      - ブライトン
      - 3万2176人
    - - 14位
