      <<: *id_time
      highlight_row: 1
  - text: 2002年6月、市の計画委員会が、許可を決めました。
    card:
      <<: *id_time
      highlight_row: 2
  - text: ところが、そこから先が長い。
    card:
      <<: *id_time
      highlight_row: 3
