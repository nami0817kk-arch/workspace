  say:
  - text: ブライトンの本拠地は、なだらかな丘のふちに建っています。
    image: assets/images/20261014_stadium_brighton/04_w.jpg
    card: none
  - text: 計画では、曲線の屋根を、淡い青の透明な板でふく設計でした。
    card: none
  - text: 丘の形に合わせて、建物を地面に沈める作りです。
    card: none
  - text: 掘り出した白亜、つまりチョークは、最大で13万8000立方メートル。
    card:
      <<: *id_build
      focus: 1
  - text: 道の南の野原に敷いて、外へ運び出さずにすませました。
    card:
      <<: *id_build
      focus: 1
  - text: トラックの走行2万2000回ぶんを、減らせる計算です。
    emph: true
    card:
      <<: *id_build
      focus: 2
  - text: 建設費は、およそ9300万ポンドでした。
    card:
      <<: *id_build
      focus: 0
  - text: その大半は、2009年に会長が代わったとき、無利子の貸付で出す約束になりました。
    card:
      <<: *id_build
      focus: 0
  - text: 設計はロンドンの建築事務所。施工はバッキンガム・グループです。
    card: none
  - text: 契約は2008年11月。引き渡しは2011年5月31日でした。
    card: none
  - text: 工期は、2年5か月あまりです。
    card: none
  - text: 最初から、あとで広げられる設計でした。
    emph: true
    card: none
  - text: サッカーだけでなく、ラグビーやホッケー、コンサートにも使えます。
    card: none
  - text: ファルマー駅には、線路をまたぐ歩道橋も、新しく作られました。
    card: none
  - text: 本拠地の名前は、地元で最大の民間の雇用主、アメリカン・エキスプレスが持っています。
    card: none
