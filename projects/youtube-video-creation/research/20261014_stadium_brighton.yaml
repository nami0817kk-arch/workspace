  say:
  - text: この本拠地の計画は、1998年に始まります。
    image: assets/images/20261014_stadium_brighton/03_w.jpg
    card:
      <<: *id_time
      highlight_row: 0
  - text: 大学のとなりのファルマーの土地が、新しい本拠地の候補になりました。
    card:
      <<: *id_time
      highlight_row: 0
  - text: 近くには、自然の景観を守る区域が広がっていました。
    card:
      <<: *id_time
      highlight_row: 0
  - text: これが、あとで審査を長引かせます。
    card:
      <<: *id_time
      highlight_row: 0
