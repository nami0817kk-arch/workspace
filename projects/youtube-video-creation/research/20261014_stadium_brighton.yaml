# スタジアム紹介シリーズ⑤：ブライトンの本拠地（アメックス・スタジアム、10/14）。
# 【10/14 夜の修正】第三者の点検で直した：①最初の敗戦はリーグ杯3回戦 2011-09-21 リヴァプール 1-2（ESPN eng.league_cup 入場21,897）が先。
#   パレス戦（2011-09-27）は**リーグ戦で**初めての敗戦 → 全箇所を「リーグ戦で」に ②開場の年のリーグ戦の最大入場は20,968（パレス戦。カップ戦は21,897）
#   ③ラグビーW杯 29,290−20,968＝8,322 → 「リーグ戦の最大より8000人以上」④「全会一致」は削除（Wikipedia のみ。Argus は未読）
#   ⑤7/16 の地元カップ決勝は Wikipedia（Argus 引き）のみ → 「とされています」⑥2006年の審査やり直しは出典で割れる（サセックス大＝2006-11に大臣が再検討、
#   Wikipedia＝2006-04に許可取り下げ）→ 年だけ ⑦2002-06 は原文が planners voted → 「市の計画委員会」⑧「器」を減らした（題・見立ての題に2か所だけ残す）
#   ⑨**タグの三笘薫は src/tags.py が config/players.yaml から自動で足す。取材メモに外す口が無いので、draft のあとで scripts の tags を手で外した**
#   （再 draft すると戻る。先頭3つ＝サッカー／ブライトン／アメックス・スタジアム）
# **節の並びは①ボーンマス②エミレーツ③ヴィラ・パーク④ブレントフォードと同じ型**：
#   オープニング → 基礎DATA(main・強い一点を頭に) → この土地と計画(年表) → 建て方(板) → ここで起きた試合(表) →
#   手を入れてきた器(年表＋増減の内訳) → 見立て(viewpoint・自分で数えた比べ)。**文は全部この回のために書いた。**
#
# 強い一点：**計画の2万2374席が、今季の開幕時には3万2176人（リーグの公式の数字）。9802席ふえて1.44倍**
#   （32,176 ÷ 22,374 = 1.4381。9月19日の入場は3万1944人＝収容の99.3%、差は232）。
#   確度は**報道**（公式の数字を読んだが、クラブ・当事者の「発表」としては確認できていないので tier は報道。計画の席数＝ブライトン市の資料〔2009年8月〕／今季の収容＝プレミアリーグ公式ハンドブック2026/27／
#   入場＝プレミアリーグ公式の試合データ）。名前のある人の言葉は使っていない → 声は0件。
#
# **重なりで外したもの（クラブ紹介⑤ブライトン 2026-09-20 公開が読んだ話）**
#   クラブ紹介は「14年間スタジアムを持てなかった」を題にし、**ゴールドストーンを借金で売った・最終節の引き分けで4部に残った・
#   ジリンガムで2年・ウィズディーンで12年・オーナーのトニー・ブルーム（2009年に会長・株75%）・三笘薫・アーセナル戦3対0・
#   創立1901年・愛称シーガルズ・ヒュルツェラー**を読んでいる。この回は**どれも出していない**。「14年」を見出しの言葉にもしていない。
#   建設費の出どころ（2009年に新会長が無利子の貸付で大半を出す約束）は**名前を出さずに**1行だけ。
#   **3万2176人**はクラブ紹介も言っているが、この回の主役（計画との差）なので外せない。言い方は変えてある。
#   アーセナル戦は**入場の数字だけ**（スコアはクラブ紹介が読んだので言わない）。
#
# **言わないと決めたもの**
#   **女子の欧州選手権（2022）・女子ラグビーW杯（2025）・ブライトン女子の試合は扱わない**（2026-09-16 指示）。男子ラグビーW杯2015は入れた（日本が絡む）。
#   **Wikipedia の「収容 32,500」は使わない。**プレミア公式ハンドブック2026/27は **32,176**（開幕時）で、食い違う（32,500は何の時点か未確認）。
#   **Wikipedia の「最多入場は2026-09-20」は誤り**。プレミア公式の試合データでは **2026-09-19（土）15:00**、ESPN も 14:00Z で 19日。
#   **PL公式の試合データに 2024-09-14 のイプスウィッチ戦で入場 41,573 という値**がある（収容を1万人上回る）。誤りと見て使わない
#   （Wikipedia のシーズン表は 2024-25 の最多を 31,840 とする）。「過去最多」は Wikipedia が 31,944 を最多とするのに頼り、**「とされています」で止める**。
#   計画の席数は 22,374（市の資料）。BBC・施工会社は「22,500」と丸めている。台本は 22,374 だけ。
#   **「3階分、地面に沈めた」は言わない**（Wikipedia のみ。市の資料は「掘り下げと盛り土で地面に沈める」とだけ）。
#   「ハヤブサでカモメとハトを追い払う」（Wikipedia・出典なし）は言わない。
#   2012年の拡張は **「8000席を足す申請→2012-04-25 に市の委員会が全会一致で認める」「2012-13 末に 30,750」** が Wikipedia のみ
#   （原典の The Argus は WebFetch・requests とも読めなかった）。台本は「認められた」「3万人を超えた（ESPN の入場 30,003 で確認）」まで。
#   Wikipedia の「歴代最多入場」の並び（30,468 が 2017 年の記録、など）は PL 公式の数字と食い違うので**記録の並びは言わない**。
#   「ブライトン駅まで電車で9分・ロンドンからの直通なし」「ルイスまで7分」は Wikipedia のみ（National Rail・Southern の時刻表は読めず**未確認**）→ 台本には入れていない。
#   最寄りのファルマー駅が器の隣、は市の資料（2009）が「close to … Falmer railway station」と書く。
#   アメリカン・エキスプレスが名前の権利を持つ（2010-06-22 発表）は Wikipedia（The Argus 引き）。契約の年数・金額は**未確認**で言わない。
#   建設契約 6500万ポンド（施工会社の発表）と総額 9300万ポンド（BBC）は中身の範囲が違う可能性があり、**並べて割らない**（板には総額だけ）。
#   サセックス杯決勝（2011-07-16、育成組 2-0 イーストボーン・バラ）は Wikipedia（The Argus 引き）のみ。入場は未確認なので表に入れない。
#   2011-07-30 の親善試合（トッテナム）のスコアは BBC が書かず、Wikipedia は 3-2 とする（どちらが勝ったか文面が曖昧）→ スコアは言わない。
#
# 自分で数えた・割った（検算した）:
#   32,176 ÷ 22,374 = 1.4381 →「1.44倍」／32,176 − 22,374 = 9,802／31,944 ÷ 32,176 = 0.99279 →「99.3%」／32,176 − 31,944 = 232／
#   31,780 − 22,374 = 9,406／31,876 − 31,780 = 96／32,176 − 31,876 = 300／
#   プレミア20クラブの今季開幕時の収容（PL ハンドブック2026/27）を大きい順に並べて、ブライトンは **13番目**（上に12・下に7）。
#   20クラブの合計 822,365 ÷ 20 = 41,118.25 →「4万1118人」／32,176 ÷ 41,118.25 = 0.7825 →「78%」／
#   2011-12 のホームのリーグ戦23試合の平均入場 20,028（ESPN の試合データから合計、Wikipedia の表 20,028 と一致）／
#   2025-26 のホームのリーグ戦19試合の平均 31,379（同。Wikipedia の表は 31,354）→ 31,379 ÷ 20,028 = 1.5668 →「1.57倍」／
#   20,028 ÷ 22,374 = 0.8951（開場の年の平均入場は計画席の89.5%）／
#   2008-12-17 着工 → 2011-05-31 引き渡し ＝ 2年5か月あまり／2001-10 申請 → 2007-07 許可 ＝ 5年9か月／1998 → 2011 ＝ 13年ほど／
#   1997-04-26 → 2011-08-06 は**言わない**（クラブ紹介の「14年」と重なるため）。
#
# 【ドラフトの経緯】draft は thumbnail.photo が空だと止まる。ヒントを読むために一時的に assets/backgrounds/stadium.png を入れて通し、
#   scripts/20261014_stadium_brighton.md を作ってから photo を空に戻した。**台本のサムネ行は仮の写真のまま**なので、写真を取ったら入れ替える。
# 基礎DATAの読み上げは5行以内に絞った（収容・建設費・ピッチ・場所は表だけ。建設費は build で読む）。
# 写真：assets/images/20261014_stadium_brighton/ に Commons の7枚（credits.json 同梱。01_w＝2023年の外観 CC0／02_w＝上空 CC BY-SA 4.0＝サムネ／03_w＝スタンマー公園から CC0／04_w＝2010年の工事 CC0／05_w＝2011-07-30 開場試合 CC BY／06_w＝2011-08-06 ドンカスター戦 CC BY／07_w＝拡張後の東スタンド CC BY-SA 3.0）。
#
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11）。ここに書いた thumbnail は案A（scene。写真は未取得）。
