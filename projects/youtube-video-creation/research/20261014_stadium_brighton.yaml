  - text: マンチェスター・シティに、0対2で敗れました。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: 入場は3万415人。開場の年の最初のリーグ戦より、1万人以上多い数です。
    card:
      type: table
      title: ブライトンの本拠地で起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: 2023年9月21日は、ヨーロッパリーグの最初の試合。
    card:
