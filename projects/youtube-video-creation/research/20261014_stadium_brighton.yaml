- id: reform
  heading: 足して育ててきたスタジアム
  tier: 報道
  telop: 開場から3万人超えまで2年。今季はさらに300ふえた
  narrator: 解説
  card: &id_reform
    type: timeline
    title: 収容のふえ方
    rows: &rows_reform
    - - 2011年7月
      - 開場。計画は2万2374席
    - - 2012年4月
      - 8000席を足す計画を、市の委員会が認める
    - - 2013年5月
      - 入場3万3人。収容は3万人を超えた
    - - 2022年
      - 開幕時の収容は3万1780人
    - - 2025年
      - 3万1876人
    - - 2026年
      - 3万2176人
    focus: 2026年
  say:
  - text: 開いたあとも、この本拠地は大きくなり続けています。
    image: assets/images/20261014_stadium_brighton/07_w.jpg
    card:
      <<: *id_reform
      highlight_row: 0
  - text: 2012年1月、クラブは、さらに8000席を足す申請を出しました。
    card:
      <<: *id_reform
      highlight_row: 1
  - text: 4月に、市の委員会が認めます。
    card:
      <<: *id_reform
      highlight_row: 1
  - text: 東スタンドの上に、座席の段を足す工事でした。
    card:
      <<: *id_reform
      highlight_row: 1
  - text: 2013年5月4日、入場は3万3人。収容が3万人を超えたことが、数字で分かります。
    card:
      <<: *id_reform
      highlight_row: 2
  - text: 開場から、2年たっていません。
    emph: true
    card:
      <<: *id_reform
      highlight_row: 2
  - text: そのあとの開幕時の収容を、リーグの資料で並べます。
    card:
      <<: *id_reform
      highlight_row: 3
  - text: 2022年が3万1780人。2025年が3万1876人。
    card:
      <<: *id_reform
      highlight_row: 4
  - text: 今季は、前の年より300ふえました。
    emph: true
    card:
      <<: *id_reform
      highlight_row: 5
  - text: 計画からの増え方を、足し算で見てみます。
    card: &id_wf
      type: waterfall
      title: 計画から、どうふえたか（自分で引いた）
      start:
      - 計画の席数
      - 22374
      steps:
      - - 2022年の開幕までに
        - 9406
      - - 2025年の開幕までに
        - 96
      - - 今季の開幕までに
        - 300
      total:
      - 今季の開幕時
      - 32176
      unit: 席
  - text: 増え方が最も大きいのは、2022年の開幕まで。9406席です。
    card: *id_wf
  - text: そのあとは、96席と300席。少しずつの増え方です。
    card: *id_wf
