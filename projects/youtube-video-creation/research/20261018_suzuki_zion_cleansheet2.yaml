# 鈴木彩艶、ニューカッスル戦の完封と英紙の評価 の取材メモ（2026年10月18日・ショートだけ・煽りの版）
# 取材: 2026-10-18。requests（ブラウザUA）で本文を読んだ。
#   ・フットボールチャンネル 10/18「アストン・ヴィラGK鈴木彩艶、スーパーセーブで完封勝利に導く活躍 英紙絶賛…」（本文を全部読んだ。ガーディアンと3つの採点媒体の紹介記事）。
#   ・サッカーキング 10/18「鈴木彩艶が今季プレミアリーグで2度目のクリーンシート！…」（本文を全部読んだ。試合の流れ・スコア・次の日程）。
#   ・ゲキサカ 10/18 は動画の見出しと写真説明だけ（本文なし）。見出しは「初のプレミアリーグ完封勝利」。**サッカーキングの「今季2度目のクリーンシート」と食い違う** → 台本では「今季何度目」を言わない。
# 日付: 試合は現地10/17（ニューカッスル0-1アストン・ヴィラ、プレミア第7節、セント・ジェームズ・パーク）。
# 試合の事実（記事どおり）: 36分 マンザンビがヘッドで先制（ゴメスのクロス）／49分 ニューカッスルのボトマンが左足でシュート、鈴木が指先で弾き出す／1-0のまま終了。
#   ヴィラはプレミアでは2試合ぶりの今季2勝目。ニューカッスルは今季初の連敗、初の無得点（サッカーキング）。
#   ヴィラは14日のCLフェネルバフチェ戦も6-0で、公式戦2試合連続の完封（フットボールチャンネル）。
# 評価（フットボールチャンネルが紹介）: 英紙 → 後半の好守を「実に見事なダイビングセーブ」と評した（引用は日本語訳。英語の原文は読んでいない → 確度は報道、媒体名は言わない）。
#   採点（10点満点）: 媒体A 鈴木7点（最高は8点が3人、鈴木は4位タイ）／媒体B 鈴木7点（最高は7.5点が3人、鈴木は4位タイ）／媒体C 鈴木8点（チーム内2位タイ）。
# 自分で数えた比べ: 3つの採点は 7・7・8。チーム内の順位は 4位タイ・4位タイ・2位タイ。
# 本人の言葉: 今回の記事には無い → 入れない（10/15・10/16 に本人の言葉は出している）。反応: 0件（今回は探していない。作らない）。
# 重複を避ける: 10/15（CLの好セーブ）・10/16（本人の言葉）と違い、今回は「ニューカッスル戦の評価」だけ。CLの6-0は完封の事実として1行だけ。
# 煽りの版: 煽る語は題と1行目だけ（「絶賛」は記事の語）。中身は事実のまま。答え（どんなセーブか・点数）は伏せる。
# 写真: 代理店（Getty）は取り込まない。assets/images/20261018_suzuki_zion_cleansheet2/ に出典つきで。
