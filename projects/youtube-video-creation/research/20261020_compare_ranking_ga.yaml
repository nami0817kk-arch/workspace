# **2026-10-20 ユーザー指示で作り直した（「単純なG+Aランキングにする。欧州5大リーグで、誰が〜という内容」）**。前の版（90分あたり・PK抜き・散らばり図）は捨てた。
# 物差し: 欧州5大リーグの今季リーグ戦、得点＋アシスト（PK得点を含む）。**出場時間の足切りは無し**（ケイン=合計9・445分も入る）。
# 数字: ESPN公開API（各リーグの得点上位50・アシスト上位50を読み、選手ごとに合計を自分で足した。上位選手は選手の今季成績で試合・分・PK得点を取り直した）。
#   取得 2026-10-20 朝（ラージョ対ヘタフェのあと）。道具は research/raw/20261020_compare_ranking_ga_top.py（結果は _top.json）。**FotMob・DataMB は使っていない**。
#   **プレミアリーグは公式（FPL公式API bootstrap-static・element-summary）と突き合わせた**: ブライトンのグロスは ESPN が3得点4アシストだが、公式は **3得点6アシスト**
#   （ESPN の試合の記録は2試合ぶんのアシストが抜けていた）。公式を採った＝合計9。ジョアン・ペドロ5+3・ハーランド8+0・コストゥラス3+4は両方一致。
#   **ほかの4リーグには公式の突き合わせ先が無い**（ESPNの集計のまま）。合計7の選手（ラビオ・ライモンド・ベーナほか）に ESPN の抜けがあれば順位が動きうる。
# 順位（同点は同順位）: 1位ラフィーニャ15／2位ヤマル14／3位エムバペ11／4位（9）ケイン・トヴァン・シナヨコ・グロス／8位（8）シック・カメージョ・ジョアン・ペドロ・ハーランド。11人。
# 試合・分: ラフィーニャ8・575／ヤマル9・741／エムバペ9・805／ケイン6・445／トヴァン7・607／シナヨコ7・611／グロス7・611（公式610）／シック6・434／
#   **カメージョ8・560**（ヘタフェ戦にフル出場。ESPN の集計495分は試合ごとの記録と合わず、記録を採用。research/raw/..._records.py）／ジョアン・ペドロ6・521／ハーランド7・620。
# PK得点: ラフィーニャ3・ヤマル1・エムバペ2・ケイン1・トヴァン3・シナヨコ3・グロス1・ほかは0（11人の得点71のうちPK14＝19.7%）。
# リーグ別（11人）: スペイン4（ラフィーニャ・ヤマル・エムバペ・カメージョ）／イングランド3（グロス・ジョアン・ペドロ・ハーランド）／ドイツ2（ケイン・シック）／フランス2（トヴァン・シナヨコ）／イタリア0（最多は7: ラビオ・ライモンド）。
# 次の物差し: バルセロナ対レアル・マドリード 10/25 20:00 UTC（ESPN日程。1〜3位の3人が同じ試合）。
# 前回までと重ねない: エムバペ10/16（ゴール期待値）・ヤマル10/4・10/17・10/18（通算0.43/0.48・開幕9連勝39得点）・ハーランド10/18（CL60得点・シティ7勝19得点）の数字は使わない。
