sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: デビュー戦で時速35.93キロ
    narrator: キャスター
    say:
      - リヴァプールのブラッドリー・バルコラが、新天地の最初の試合で数字を残しました。
      - 9月4日のプレミアリーグ第3節、イプスウィッチ戦。途中出場でのデビューでした。
      - この試合で記録した最高速度が、時速35.93キロ。
      - プレミアリーグによると、これが今シーズンここまでの最速です。
      - 試合はイサクの2得点でリヴァプールが2対0。イラオラ体制での公式戦初勝利でした。
      - 起用について、イラオラ監督は前日にこう話していました。地元紙『リヴァプール・エコー』が伝えています。
      - {voice: イラオラ監督, text: ブラッドリーの加入には非常に満足している}
      - {voice: イラオラ監督, text: あのポジションに優秀な選手を連れてくること}
      - {voice: イラオラ監督, text: それが我々の優先事項だったからだ}
      - {voice: イラオラ監督, text: 彼は正しいメンタリティを持ってきた}
      - {voice: イラオラ監督, text: 彼がリヴァプールを強く望んでくれたことが嬉しいよ}
      - {voice: イラオラ監督, text: チームを助けたいという強い意欲を持って加入してくれた}
      - コンディションについても聞かれています。
      - {voice: イラオラ監督, text: コンディションは良好だと思う}
      - それでも先発は見送りました。理由も言っています。
      - {voice: イラオラ監督, text: プレシーズンで出場機会がなかった事実を考慮しなければならない}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260909/2203081.html
      - https://web.ultra-soccer.jp/news/all/35070/

  - id: rank
    heading: 誰を抜いたのか
    tier: 報道
    telop: 今季の上位5人
    narrator: キャスター
    card:
      type: bars
      title: 今季ここまでの最高速度（第3節終了時・km/h）
      items:
        - {label: "バルコラ（リヴァプール）", value: 35.93}
        - {label: "ムベウモ（マンU）", value: 35.36}
        - {label: "ファン・エヴァイク（コヴェントリー）", value: 35.26}
        - {label: "ペドロ・ネト（チェルシー）", value: 35.26}
        - {label: "ハイアン（ボーンマス）", value: 35.14}
      unit: km/h
    say:
      - 2位はマンチェスター・ユナイテッドのブライアン・ムベウモで35.36キロ。
      - 3位と4位が並んでいて、コヴェントリーのファン・エヴァイクと、チェルシーのペドロ・ネトがともに35.26キロです。
      - 5位はボーンマスのハイアンで35.14キロ。
      - 7位には、アストン・ヴィラのイアン・マートセンも入っています。
      - バルコラは今夏PSGから加わりました。移籍金は最大で1億4500万ユーロ、日本円でおよそ259億円に達する可能性があると報じられています。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35743/
      - https://www.soccer-king.jp/news/world/eng/20260903/2200407.html

  - id: alltime
    heading: 歴代ではどうか
    tier: 報道
    telop: 歴代1位は37.38キロ
    narrator: 解説
    card:
      type: bars
      title: 計測開始（2020-21）以降の最高速度（km/h）
      items:
        - {label: "ファン・デ・フェン（トッテナム）", value: 37.38}
        - {label: "カイル・ウォーカー（当時マンC）", value: 37.31}
        - {label: "チャチュア（ウルヴァーハンプトン）", value: 37.30}
        - {label: "バルコラ（今回）", value: 35.93}
      unit: km/h
    say:
      - ここからが本題です。
      - 計測が始まった2020-21シーズン以降の最速は、トッテナムのミッキー・ファン・デ・フェンで時速37.38キロ。
      - 2位は当時マンチェスター・シティにいたカイル・ウォーカーで37.31キロ。
      - 3位はウルヴァーハンプトンのジャクソン・チャチュアで37.30キロです。
      - しかも歴代の上位10には、ファン・デ・フェンだけで3つ入っています。
      - 10位はリヴァプールのドミニク・ソボスライで36.76キロ。
      - つまりバルコラの35.93キロは、今季では1位でも、歴代では**トップ10に入っていません**。
      - 上位はほとんどがディフェンダーです。速さで名前が挙がるのは、必ずしも前の選手ではありません。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260909/2203081.html
      - https://web.ultra-soccer.jp/news/all/35743/
