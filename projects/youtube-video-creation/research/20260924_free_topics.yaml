title: 無所属の31人を、人ごとに分ける
lead: まとめ1本 → 1人1本へ。8人ぶんの材料を当たりました
note: |
  <b>○×を付けてください。</b>いまある「無所属31人」のまとめ回は <b>2分09秒</b>で、
  8人を名前と金額で並べているだけです。人ごとに分けると、1人ずつに筋が立ちます。<br><br>
  <b>まとめ回をどうするか</b>：○が付いたぶんを個別に作り、まとめ回は<b>落とす</b>のが私の推しです。
  同じ名前を同じ日に二度出すことになるので。残す場合は、個別に作らない人だけの回に組み直します。<br><br>
  <b>投稿枠</b>：今日と明日はプレミア20クラブ紹介でショートの枠（1日10本）が埋まっています。
  本編のほうは空いています。何本作るかだけ決めてもらえれば、時刻はこちらで割り振ります。<br><br>
  <b>調べて分かった訂正</b>：サンチョの「10部で練習」は<b>本当</b>でしたが、
  記事は9月ではなく<b>8月3〜4日</b>のものでした。原報道は ESPN です。
items:
  - num: 1
    slot: 日本人
    head: 伊藤涼太郎。ブラックバーンのメディカルで落ち、「戻らない」と言った古巣のメディカルを受ける話になっている
    why: |
      6月に契約満了で退団。ドイツの関心は具体化せず、**9月9日、ブラックバーンが足首の結果を見て契約を見送り**。
      そして**9月20日、「近くシント＝トロイデンでメディカルを受ける」**と現地紙。
      本人は8月に「復帰は選択肢にない」と伝えていました。
      カタールの具体的なオファーは金を理由に断り、欧州に残ると決めています。セルタも関心（アスパスの負傷の代役）。
      **反応が濃く、しかも割れています。**「Jに帰ってこい」「クソダサムーブ」「シントトは日本人選手の駆け込み寺」など、実在の書き込みが25件以上。
      **本人の発言は一つも見つかりませんでした。**
    src: HBVL / Voetbalkrant / VoetbalPrimeur / 東スポ / スポニチ（9/20〜9/22）
    url: https://www.voetbalprimeur.be/nieuws/2137922/transfervrije-ito-kan-terugkeren-bij-stvv.html
    fmt: voices
  - num: 2
    slot: プレミア
    head: 8500万ユーロでマンUに来た男が、イングランド10部のグラウンドで練習していた
    why: |
      クラブは**Flixton FC**（10部、収容2,000人）。ユナイテッドの練習場カリントンから約5km。
      そこから話が落ちていきます。**9月9日にドルトムントが復帰を却下**（「ゲッツェやサヒンのようなロマン移籍の時代を終わらせる」）。
      **9月11日に「正式オファーは1件も届いていない」。**9月21日には元アストン・ヴィラの人が「愛はどこにいったのか」。
      Flixton のオーナーの声明が引けます。「彼はテストを受けていたわけでも、移籍の話に関わっていたわけでもありません」。
      **本人の退団後の発言はゼロ**なので、quote では作れません。
    src: ESPN / Goal / beIN（8/3〜4）、BILD（9/9）、Football Insider（9/11）
    url: https://www.espn.com/soccer/story/_/id/49519565/jadon-sancho-trains-10th-tier-flixton-fc-not-involved-transfer-discussions
    fmt: news
  - num: 3
    slot: その他
    head: ベンゼマは無給でもリヨンに帰るつもりだった。止めたのは2030年までのサウジとの契約
    why: |
      8月31日にアル・ヒラルと合意解除（契約は1年残っていた）。その24時間前に、クラブはワトキンスを5100万ポンドで獲っています。
      **9月5日、レキップ発。**17年ぶりのリヨン復帰が実際に検討され、**本人は1シーズン無給でプレーする用意があった**。
      だが**サウジとの「2030年6月まで」のアンバサダー契約が、サウジ・プロリーグ以外でのプレーを禁じている**。
      サウジの司会者は「引退に傾いている」とも言っています。
      **9月10日以降は完全に静かで、引退発表も新クラブもありません。**
    src: ESPN（8/31）、レキップ（9/5、リヨン系媒体経由）、Goal
    url: https://www.lyonfoot.com/article/14088/ol-karim-benzema-etait-pret-a-revenir-gratuitement-cet-ete-pourquoi-le-retour-a-ete-bloque
    fmt: news
  - num: 4
    slot: その他
    head: セネガル代表監督が名指しで「早く自分の問題を解決しろ」。W杯全試合先発の男が無職のまま
    why: |
      クレパン・ディアッタ。6月末にモナコとの契約満了（通算143試合）。
      **9月9日**、コンヤスポルの年俸150万ユーロを拒否。本人は最低250万ユーロを要求していました。
      **9月19日**、ヴィエラ監督が初招集から外した理由を会見で説明。「彼にはクラブがなく、試合に出ていない」
      「私が非常に好きな選手だ。W杯では非常に良かった。**できるだけ早く自分の問題を解決しなければならない**」。
      ローマ・マルセイユ・クリスタルパレスが関心。記者は「代理人の要求が高すぎた」と指摘しています。
    src: Goal（9/3）、AfricaFoot（9/9）、Africa Soccer（9/19）
    url: https://africasoccer.com/patrick-vieira-tells-krepin-diatta-to-find-a-club-quickly-after-senegal-omission/
    fmt: quote
  - num: 5
    slot: ラ・リーガ
    head: カルバハルの別れの言葉。「僕の退団をもって、素晴らしいひとつの時代に幕を下ろします」
    why: |
      レアル23年（アカデミー10年＋トップ13年）、公式戦450試合、26冠の主将。5月に契約満了で退団しました。
      **この回は「まだ決まっていない」話ではなく、5月23日のベルナベウでの別れのスピーチを主役にする形です。**
      「僕が重い膝の怪我をした24時間後に、会長が契約を延長してくれた」「良いときも悪いときも、ここにいてくれてありがとう」
      「僕を思い出すときは、誇りとともに、『あいつはこのユニフォームにすべてを捧げた』という感覚とともに」。
      いまの状況（9月7日に代理人がリヴァプール・シティ・フラムへ売り込み、以降続報なし）は、最後に短く置きます。
    src: El Debate（5/24）、TEAMtalk / El Desmarque（9/7〜8）
    url: https://www.eldebate.com/deportes/20260524/palabras-despedida-carvajal-mi-salida-ponemos-fin_420961.html
    fmt: quote
  - num: 6
    slot: その他
    head: 引退を考えていると報じられた男が、引退もせず契約もせず3か月。ゲレイロにローマとオリンピアコス
    why: |
      3月にバイエルンが契約非更新を発表。**5月21日、ドイツ紙が「カップ決勝のあとに引退を検討している」と報道**（度重なる負傷が理由）。
      結局引退せず、6月末でフリー。9月4日にローマが左サイドの候補として検討、9月21日にオリンピアコスも。
      **弱いところ。**9月の動きは、ローマ以外ほぼ記者1人の投稿が根拠です。結論は「まだ決まっていない」になります。
      **本人の発言はゼロ**で、引退検討の報道についてもコメントしていません。
    src: Bavarian Football Works（5/21）、RomaPress（9/7）、ギリシャ紙（9/21）
    url: https://www.bavarianfootballworks.com/bayern-munich-injuries/205491/report-bayern-munich-s-raphael-guerreiro-considering-retirement-after-dfb-pokal-final
    fmt: news
    weak: true
  - num: 7
    slot: その他
    head: マフレズはアル・シャバブと合意済み。なのに動けないのは、カラスコが出ていかないから
    why: |
      7月4日にアル・アハリが契約解除（1年残っていた）。8月30日にアル・シャバブと個人条件で合意。
      **止まっている理由が2つ。**財務監視下で追加保証が要ること。そして**外国人枠で、カラスコがアル・イテハドへ移らないと登録できない**こと。
      9月5日に会長が「これから48時間で何が起きるか分かるだろう」。**3週間たっても、何もありません。**
      手放したアル・アハリの側では責任論が燃えていて、「あれは前監督の判断だった」と言い出しています。
      **ひっかかるところ。**中身がほぼサウジの内輪話です。扱うリーグは欧州7つと決めてあるので、
      「元マンチェスター・シティの5度のプレミア王者」という入口を作らないと成立しません。
    src: Goal（8/30, 9/1, 9/5, 9/11, 9/20）
    url: https://www.goal.com/en/news/the-reason-behind-the-delay-in-riyad-mahrez-joining-saudi-arabia-s-al-shabab/blt504c844d4296c5c0
    fmt: news
    weak: true
  - num: 8
    slot: その他
    head: ジンチェンコ「マンU移籍の用意がある」報道に、ウクライナのファンが冷笑
    why: |
      2月14日にアヤックスで前十字靭帯を断裂。**アヤックスでの出場は通算25分**。
      この負傷でW杯予選の最終盤を欠場し、ウクライナは本大会を逃しました。
      9月16日に「マンUが代理人と接触」という報道。それに対する自国ファンの書き込みが取れています。
      「マンUの方にジンチェンコを受け入れる用意がない」「ただの妄想」「で、マンUはそれを知ってるの？」。
      **私は見送りを推します。**移籍の話はウクライナの記者1人の投稿が根拠で、自国のファンからも叩かれています。
      固い事実は4つ（25分・断裂・契約非更新・まだフリー）だけで、**本人の発言もゼロ**です。
    src: Sport.ua（9/7, 9/16）、Sport-Express UA（9/4）
    url: https://sport.ua/uk/news/907268-zinchenko-obrav-klub-u-yakomu-prodovzhit-karieru-dzherelo
    fmt: voices
    weak: true
drops:
  - [まとめ回に残っていた他の23人, "ポグバ・イカルディ・スターリング・デレ・アリ・アチェルビなども無所属です。今日の8人が片付いてから見ます"]
  - [アラバとネト, "2人とも行き先が決まったので、「無所属」の題材にはなりません（ウディネーゼとユヴェントス）"]
