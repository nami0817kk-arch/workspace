  heading: 日本は、イタリアとどう戦ってきたのか
  tier: 背景
  telop: 通算3試合、日本から見て0勝1分2敗
  narrator: 解説
  card: &id_jp
    type: table
    title: 日本とイタリアの試合（全3試合）
    columns:
