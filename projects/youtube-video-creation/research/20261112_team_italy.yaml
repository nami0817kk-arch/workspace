  - text: イタリアは1934年と1938年、ワールドカップで2大会続けて優勝。
    image: assets/images/20261112_team_italy/b03_oslo_arrival_w.jpg
    card: *id_hist
  - text: 1968年には、ヨーロッパ選手権で初めての優勝です。
    card:
      <<: *id_hist
      highlight_row: 1
  - text: 3度目のワールドカップ優勝は1982年。4度目は2006年でした。
    image: assets/images/20261112_team_italy/b01_xi2025_w.jpg
    card:
      <<: *id_hist
      highlight_row: 3
  - text: 2006年のあと、ワールドカップに出たのは2010年と2014年の2大会だけです。
    card: none
  - text: その6試合は、1勝2分け3敗。2大会とも、1次リーグで敗退しました。
    card: none
  - text: それでも、ヨーロッパでは強さを見せます。
    image: assets/images/20261112_team_italy/b02_euro2020_w.jpg
    card: none
  - text: 2021年に、ユーロ2020で優勝。監督は、いまと同じマンチーニでした。
    card:
      <<: *id_hist
      highlight_row: 4
  - text: ただ、その翌年の2022年のワールドカップには、出られませんでした。
    image: assets/images/20261112_team_italy/b04_euro_trophy_w.jpg
    card: none
