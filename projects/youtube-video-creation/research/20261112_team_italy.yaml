      - 3-4
  say:
  - text: 3試合を、年代順にたどります。
    image: assets/stats/tb_italy_data8.png
    card: *id_jp
  - text: 最初は1936年、ベルリン五輪の準々決勝です。0対8の負けでした。
    card:
      <<: *id_jp
      highlight_row: 0
  - text: 2001年は、埼玉スタジアムでのキリンチャレンジ杯。1対1の引き分けです。
    image: assets/images/20261112_team_italy/b03_oslo_arrival_w.jpg
    card:
      <<: *id_jp
      highlight_row: 1
  - text: 2013年、各大陸の王者が集まるコンフェデレーションズカップ。
    image: assets/images/20261112_team_italy/b01_xi2025_w.jpg
    card: none
  - text: 前半、本田圭佑のPKと香川真司のゴールで、日本が2点をリードしました。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 前半41分にデ・ロッシが1点を返し、後半5分に内田篤人のオウンゴール。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 2分後には、バロテッリがPKを決めて、イタリアが逆転します。
    card:
      <<: *id_jp
      highlight_row: 2
  - text: 日本は岡崎慎司のゴールで追いつきましたが、86分にジョヴィンコに決められました。
    image: assets/images/20261112_team_italy/b02_euro2020_w.jpg
    card: none
  - text: この試合の日本の監督は、イタリア人のザッケローニでした。
    emph: true
    card: none
