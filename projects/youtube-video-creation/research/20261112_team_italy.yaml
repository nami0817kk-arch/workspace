sections:
- id: hook
  heading: 優勝4度のイタリアに、日本はまだ勝てていない
  main: true
  tier: 背景
  telop: 日本は、イタリアと3度戦って未勝利
  narrator: 解説
  say:
  - text: ヨーロッパのイタリア代表。フィファランクは15位の国です。
    short_only: true
    image: assets/stats/tb_italy_data_t.png
    no_telop: true
  - text: ワールドカップで4度優勝した国に、日本は3度戦って、一度も勝てていません。
    image: assets/stats/tb_italy_data_t.png
    no_telop: true
  - text: 戦績は、日本から見て0勝1分け2敗。ワールドカップで戦ったことはありません。
    image: assets/stats/tb_italy_data_r1.png
    no_telop: true
  - text: いちばん惜しかったのは、2013年のコンフェデレーションズカップ。**3対4**の負けでした。
    image: assets/stats/tb_italy_data_r1.png
    no_telop: true
    emph: true
  - text: ところがそのイタリアは、2026年のワールドカップに、出られませんでした。3大会続けてです。
    image: assets/images/20261112_team_italy/b01_xi2025_w.jpg
    no_telop: true
  - text: 優勝4度の国は、なぜ本大会を逃し続けているのでしょうか。
    image: assets/stats/tb_italy_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Italy_at_the_FIFA_World_Cup
  - https://en.wikipedia.org/wiki/Japan_national_football_team_records_and_statistics
- id: data
  heading: イタリア代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: イタリア代表の基礎DATA
  narrator: 解説
  say:
  - text: イタリアのフィファランクは、10月7日の発表で**15位**。日本は17位です。
    image: assets/stats/tb_italy_data0.png
    no_telop: true
  - text: ワールドカップの優勝は4回。1934年、1938年、1982年、2006年です。
    image: assets/stats/tb_italy_data1.png
    no_telop: true
  - text: ヨーロッパ選手権は、1968年と2020年大会で優勝しました。
    image: assets/stats/tb_italy_data2.png
    no_telop: true
  - text: 監督は、ロベルト・マンチーニ。7月に、代表監督への復帰が発表されました。
    image: assets/stats/tb_italy_data4.png
    no_telop: true
  - text: 主将は、ゴールキーパーのドンナルンマです。
    image: assets/stats/tb_italy_data5.png
    no_telop: true
  - text: 代表の最多出場は、ブッフォンの176試合です。
    image: assets/stats/tb_italy_data7.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
  - https://en.wikipedia.org/wiki/Italy_national_football_team
  - https://en.wikipedia.org/wiki/Italy_at_the_FIFA_World_Cup
