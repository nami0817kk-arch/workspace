# 代表チーム紹介 イタリア代表（11/11 作成。固定シリーズ9「代表チーム紹介」。見本は 11/10 のコロンビア代表 scripts/20261110_team_colombia.md）。7節：フック→基礎DATA（板）→日本との関係→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **選んだ理由**：W杯優勝4回の国が3大会続けて本大会を逃している（2018・2022・2026）という軸と、日本との対戦3試合（1936年五輪0-8・2001年1-1・2013年コンフェデ杯3-4）が揃っていて、2013年は日本が2点リードしていた。代表チーム紹介は未出（scripts/・research/posted.json・research/covered.yaml を grep。イタリア代表が主役の本は無い。10/10〜10/11 の記録系の台本に名前が出るだけ）。11/10 のブッフォンの回とは別日で、時間が空いたので重ならない。
# **外した候補**：韓国（11/14 の別本として作る）、アメリカ・セネガル・モロッコ・スイス・デンマーク（日本との接点がイタリアほど強い軸にならない）、インドネシア・タイ（2027年アジアカップ組で日本の次の公式戦の相手だが大物ではない。次の機会）。
# **軸**：「優勝4回の国が、3大会続けてW杯を逃した。日本は3度戦って未勝利だが、2013年は2点リードしていた」。答えは見立ての節（自分で数えて割る）。
# ---- 確かめたこと（2026-11-11。requests で Wikipedia の生の wikitext を読んだ。WebFetch の要約は使っていない）----
#  ・FIFAランク：15位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026）。日本は17位。点数は書かない。
#  ・W杯：優勝4回（1934・1938・1982・2006）、18大会出場（Italy at the FIFA World Cup の冒頭）。2018・2022・2026は予選敗退（同じ記事の表で3大会が Did not qualify）。ユーロ：優勝1968・2020（infobox）。最多出場ブッフォン176、最多得点リーヴァ35。愛称 Gli Azzurri。主将ドンナルンマ（infobox・現招集メンバー表）。
#  ・日本との全対戦（Japan national football team records and statistics の表「ITA 1936 2013 3 0 1 2 4 13」。Japan national football team results (2010–2019)・(2000–2009)・records の五輪表）：1936年ベルリン五輪準々決勝 0-8／2001-11-07 キリンチャレンジ杯（埼玉スタジアム2002）1-1／2013-06-19 コンフェデ杯 3-4（レシフェ）。2020年以降の日本の試合に ITA は無い（results (2020–present) を grep して0件）。W杯での対戦は無い（Japan at the FIFA World Cup の表で ITA は主催国の行にしか出ない）。
#  ・2013-06-19（2013 FIFA Confederations Cup Group A の試合の枠）：日本の得点は本田21分（PK）・香川33分・岡崎69分。イタリアはデ・ロッシ41分・内田のオウンゴール50分・バロテッリ52分（PK）・ジョヴィンコ86分。観衆40,489。日本の監督はザッケローニ（イタリア人。Japan national football team records の監督表で2010〜2014、55試合）。MOMは香川。
#  ・2026年W杯予選（UEFA）：Group I はイタリア・ノルウェー・イスラエル・エストニア・モルドバ。ノルウェーに2025-06-06 0-3（オスロ）・2025-11-16 1-4。予選全体（プレーオフ込み）10試合7勝1分2敗24得点13失点（Italy at the FIFA World Cup の2026の行）。→自分で数えた：ノルウェー2試合は1得点7失点、のこり8試合は23得点6失点。
#  ・プレーオフ（2026 FIFA World Cup qualification – UEFA second round）：準決勝 2026-03-26 イタリア2-0北アイルランド（ベルガモ、トナーリ56分・ケアン80分）。決勝 2026-03-31 ボスニア・ヘルツェゴビナ1-1イタリア（ゼニツァ、ケアン15分・タバコヴィッチ79分）、延長でも動かずPK戦1-4で敗退（エスポジト・クリスタンテが失敗、トナーリは成功）。
#  ・監督：ガットゥーゾ（2025年6月就任）→2026年4月10日にU21のバルディーニ監督が6月の親善試合の暫定指揮（Italy national football team の本文）→2026年7月28日、新会長マラゴーが「ロベルト・マンチーニの代表監督復帰」とクラウディオ・ラニエーリの技術部長就任を発表（figc.it が出典）。マンチーニは2018年5月14日に就任、2023年8月に辞任（約5年）。ユーロ2020優勝時の監督。ガットゥーゾが辞めた理由は確かめていないので言わない。
#  ・W杯のあと（Italy national football team の試合の枠）：6/3 ルクセンブルク0-1イタリア／6/7 ギリシャ0-1イタリア（どちらもU21中心）。ネーションズリーグ2026-27 Aリーグ：9/25 イタリア0-2ベルギー（ローマ）、9/28 トルコ1-4イタリア（バストーニ9分・フラッテージ22分・カヨーデ27分・Pエスポジト50分）、10/2 フランス1-1イタリア（オリーズ55分・バストーニ68分）、10/5 イタリア3-1トルコ。→2勝1分1敗8得点5失点。次は 11/12 フランス（サン・シーロ）、11/15 ベルギー（ブリュッセル）。
#  ・W杯優勝後（2006のあと）：2010年 グループ3試合0勝2分1敗4-5、2014年 3試合1勝0分2敗2-3（Italy at the FIFA World Cup の表）。→2大会6試合1勝2分3敗。
#  ・看板選手（年齢は2026-11-11時点、生年月日から計算。所属は招集メンバー表の club、2026-10-05時点の出場数）：ドンナルンマ（マンチェスター・シティ、GK、1999-02-25）27・87試合／バストーニ（インテル、DF、1999-04-13）27・46試合5得点／バレッラ（インテル、MF、1997-02-07）29・73試合10得点／トナーリ（トッテナム、MF、2000-05-08）26・36試合4得点／ピオ・エスポジト（インテル、FW、2005-06-28）21・13試合7得点／カラフィオーリ（アーセナル、DF、2002-05-19）24・17試合1得点。
# ---- 言わないもの ----
#  ・ガットゥーゾの退任の理由／ミラン・ユヴェントスの内部事情／八百長・賭博の話／過去の事故（スペルガ）／戦術の説明／私生活・怪我／審判の判定への不満。
# ---- 写真（assets/images/20261112_team_italy/、出典は credits.json）----
#  ・2025年6月 オスロの先発11人（MichaelEmilio、CC BY 4.0）。2021年7月 ユーロ優勝杯とマッタレッラ大統領（Presidenza della Repubblica。ライセンスタグ未確認＝要確認）。2012年ユーロ決勝の先発（Football.ua のタグ、656px と小さい）。マンチーニ（Fars News のタグ、466px と小さい）。代理店・放送映像は使っていない。日本戦の写真は Commons に見つからず無い。
#  ・基礎DATAの板の中身は research/raw/20261112_team_italy_board.json（tools/clubdata.py で assets/stats/tb_italy_data*.png を描いた）。
