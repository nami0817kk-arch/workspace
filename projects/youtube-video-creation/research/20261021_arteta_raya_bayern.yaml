# 取材メモ（2026年10月21日）アーセナルのラヤ「退屈」の声に「いいえ」、アルテタ「ごく少数」。バイエルン戦（日本時間22日4時）の前日（ニュースのショート。見せ方 Y＝ラヤ本人の一言から始める）
# 取材: 2026-10-21。requests（ブラウザUA）で本文を全部読んだ。検索エンジンのAI要約は使っていない。
#   ・ガーディアン（2026-10-20）「Arsenal's David Raya hits back at 'boring' label as Arteta defends side's style of play」— 題材の出典。本文を最後まで読んだ。
#       ラヤ「No it doesn't.（質問は『批判は自分とチームメイトを苛立たせるか』）／People have their own opinions. We have our own opinion. At the end of the day, we have lost one game in 11 this season and if you call that boring or irritating … I don't know what to say. We enjoy playing football. We enjoy going out there every single day to win football matches and that's the most important thing.」
#       記事の地の文「David Raya says he does not care if rival supporters call Arsenal "boring"」→ **「退屈」と呼ぶのは相手サポーター**（記事）。ラヤの発言そのものに「相手サポーター」は出てこない。
#       アルテタ「I don't have that impression [about there being a debate] because I heard it was incredible. Because we scored so many goals, we have more possession, more shots, different players participating ... so the story is completely different to last year. I think we are talking about a very small minority and the other ones they know they have enjoyed a lot the way we have played and dominated games this year. We have proven that, so that's my opinion.」
#       **「no goals from set pieces」の一節は使わない**（クラブ公式の記録でも同じ綴りで、前後と意味が通らない。誤記の疑いがあるので訳さない）。
#       地の文：全大会で11試合10勝（日曜のフォレスト戦1-0）。「Arteta admitted his players had to be better in attacking terms」。バイエルンはオリーズが出場停止、コンパニ監督はウイルスで欠場の可能性（**題に答えないので台本では使わない**）。
#       「Arteta knows that Bayern will bring the game to Arsenal; perhaps it will be a relief not to face low-block opponents and it might allow his team to be more expansive.」＝**ガーディアン記者の見立て**（台本では「ガーディアンは、と書く」と断る）。
#       去年のエミレーツ（アルテタ「we experienced that at the Emirates」、記事の括弧書き「when Arsenal won 3-1」）。
#   ・Arsenal.com「Every word of Mikel Arteta's pre-Bayern presser」（2026-10-20 22:11Z。アリアンツ・アレーナで火曜の夜）— 同じ話題の公式の全文。ガーディアンの引用と一致することを確かめた。
#       「On the debate about our style of play」の全文（上と同じ）／「On whether extra scrutiny comes with being champions」「If you analyse the top teams in England … they all have a list. We all have a list because none of us are perfect. Thank God that we are not perfect…」
#       「On whether opinions can become reputations」「we are open to opinions … those opinions have to be respected, especially if they are done in a respectful way. We are here to prove that we belong to this level…」
#       「On how difficult it is to face a low block」「a low block demands a different kind of game to the high block … Still, I think on Sunday, we could have done things better, but that's in our hands and we need to recognise that openly as well」
# 時刻: ESPN の uefa.champions scoreboard（dates=20261021）で Arsenal at Bayern Munich＝2026-10-21T19:00Z、状態 Scheduled（未開始）＝日本時間22日午前4時。**結果は言わない**（前日の発言だけ）。
# 数字: 「11試合で10勝」はガーディアンの地の文、「11試合で負けたのは1つ」はラヤ本人の言葉。**勝ち点・順位・フォレスト戦の支配率は使わない**（10/19 のフォレスト戦のショートで扱い済み）。
# 重ならないように: 10/19 のマドゥエケ（フォレスト戦の「差」）、10/21 の「ライス×ネヴェス」（去年のCL決勝）、バイエルン紹介（本拠地・35回優勝）とは軸も言い回しも別。**去年のCL決勝（PSGにPK）には触れない**。ラヤの「支配率28%」の話は使わない。
# 本人の言葉: ラヤ本人・アルテタ本人の発言が実在する（Y）。**英語を訳した。語は足していない**。ラヤの発言は英語の原文、台本の日本語は自訳。
# 反応: 当たっていない（作らない）。approve は --no-voices で。
# 確度: 発言は 報道（ガーディアン）で、アルテタの分はクラブ公式の全文とも一致。バイエルンが攻めてくるという見立ては記者の見立て（背景）。
