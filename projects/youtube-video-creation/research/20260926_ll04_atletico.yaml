- id: history
  heading: ビルバオの支店
  tier: 背景
  telop: 1903年、ビルバオのクラブの支店として生まれた
  narrator: 解説
  card:
    type: table
    title: ビルバオの支店
    columns: &id001
    - ''
    - ''
    rows:
    - - 1903年4月
      - マドリードで創立
    - - 作った人
      - バスクの学生たち
  say:
  - 1903年、ビルバオのアスレティック・クラブが、マドリードで国王杯の決勝に勝ちます。
  - それを見た、マドリードで学ぶバスクの学生たちが、本家の**支店**を作りました。
  - text: ユニフォームも本家と同じ、青と白の半々でした。
    card:
      type: table
      title: ビルバオの支店
      columns: *id001
      rows:
      - - 最初の名前
        - アスレティック・クラブ（マドリード支店）
  - マドリードの側が独り立ちしたのは、1920年代に入ってからです。
  sources:
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  bg: assets/backgrounds/stadium_アトレティコマドリード_in.png
  official: false
- id: history2
  heading: 赤と白は買い物の失敗
  tier: 背景
  telop: 探しに行ったのは青と白。持ち帰ったのは赤と白
  narrator: 解説
  card:
    type: table
    title: 赤と白の縞
    columns: &id002
    - ''
    - ''
    rows:
    - - 1909年の暮れ
      - 選手がイングランドへ買い出し
    - - 探したもの
      - ブラックバーンの青と白
  say:
  - 赤と白には、もう一つの説があります。
  - 1909年の暮れ、選手の一人が、両方のクラブのシャツを買いにイングランドへ渡りました。
  - text: 探したのはブラックバーンの青と白。見つからず、サウサンプトンの赤と白を持ち帰ります。
    card:
      type: table
      title: 赤と白の縞
      columns: *id002
      rows:
      - - 持ち帰ったもの
        - サウサンプトンの赤と白
  - ビルバオはパンツを黒に替え、マドリードは青のまま。ここで2つの色が分かれました。
  sources:
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  bg: assets/backgrounds/stadium_アトレティコマドリード_in.png
  official: false
- id: history3
  heading: アトレティコという名前
  tier: 背景
  telop: 空軍のクラブと組み、名前がアトレティコに
  narrator: 解説
  card:
    type: table
    title: アトレティコという名前
    columns: &id003
    - ''
    - ''
    rows:
    - - 1939年
      - 空軍のクラブと組む
    - - 1940年代の初め
      - 外国語の名前が禁止に
  say:
  - 内戦のあと、1939年に空軍のクラブと組み、名前にアビアシオン、航空が付きます。
  - さらに外国語の名前が禁じられ、英語のアスレティックは、スペイン語のアトレティコに。
  - text: この時代に、リーグで初めての優勝と連覇を果たしました。
    card:
      type: table
      title: アトレティコという名前
      columns: *id003
      rows:
      - - 1947年
        - 今の名前に
  - 航空の名前が外れ、今の名前になったのは**1947年**です。
  sources:
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  bg: assets/backgrounds/stadium_アトレティコマドリード_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 守って速く攻める。大きく使う。合言葉は1試合ずつ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 守って、速く攻める
    - - 運営の型
      - 大きく使う
    - - クラブの気質
      - 熱いスタンドと「1試合ずつ」
  say:
  - text: シメオネ監督のチームは、まず守って、速く攻める。
    image: assets/photos/ll/atletico/atletico_manager_b58576f1.jpg
  - 2015年から16年のシーズンは38試合で失点**18**。ヨーロッパ5大リーグで最少でした。
  - 運営は、大きく使う型。クラブ最高額の補強は、ジョアン・フェリックスの**1億2600万ユーロ**。
  - この夏も、移籍金に合わせて**1億3000万ユーロ**を使いました。
  - スタンドも熱い。20日のダービーの観客**7万514人**は、今の本拠地の新記録。
  - 合言葉は「パルティード・ア・パルティード」。1試合ずつ、という意味です。
  sources:
  - https://en.wikipedia.org/wiki/Atlético_Madrid
  - https://en.wikipedia.org/wiki/Diego_Simeone
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_Atl%C3%A9tico_Madrid_season
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_de_Madrid
  - https://www.mundodeportivo.com/futbol/atletico-madrid/20260922/1004230171/record-metropolitano.html
  bg: assets/backgrounds/stadium_アトレティコマドリード_in.png
  official: false
- id: episode
  heading: 手放した15歳
  tier: 背景
  telop: 1992年、下部組織を閉じ、15歳のラウールを手放す
  narrator: 解説
  card:
    type: table
    title: 手放した15歳
    columns:
    - ''
    - ''
    rows:
    - - 1992年
      - 会長が下部組織を閉じる
    - - 15歳のラウール
      - レアル・マドリードへ
  say:
  - 1992年、会長のヘスス・ヒルは、お金を理由に下部組織を閉じます。
  - そこにいた15歳のラウールは、レアル・マドリードへ移りました。
  - ヒルはテレビで、この少年を未来の看板だと自慢していたのです。
  sources:
  - https://en.wikipedia.org/wiki/Atl%C3%A9tico_Madrid
  - https://en.wikipedia.org/wiki/Ra%C3%BAl_Gonz%C3%A1lez
  - https://es.wikipedia.org/wiki/Ra%C3%BAl_Gonz%C3%A1lez_Blanco
  bg: assets/backgrounds/stadium_アトレティコマドリード_in.png
  official: false
