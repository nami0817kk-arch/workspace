- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: ダービーに勝ち、首位を追う。始まりは支店
  narrator: キャスター
  say:
  - text: ダービーでレアル・マドリードに勝ち、首位を追っています。
    image: assets/stats/ll_atletico_data_r1.png
    no_telop: true
  - text: シメオネ監督は、34歳の主将をこう褒めました。
    image: assets/stats/ll_atletico_data_r2.png
    no_telop: true
  - voice: ディエゴ・シメオネ
    text: コケの試合を見たでしょう。34歳で後半から入って、全部を変えてみせた
    image: assets/stats/ll_atletico_data_r2.png
  - voice: ディエゴ・シメオネ
    text: 私たちはそういうチームで、もっと良くなろうとしている
    cont: true
    image: assets/stats/ll_atletico_data_r2.png
  - text: そしてこのクラブの始まりは、ビルバオのクラブのマドリード支店でした。
    image: assets/stats/ll_atletico_data_r3.png
    no_telop: true
  - image: assets/stats/ll_atletico_data0.png
    text: 創立は**1903年**の4月。123年の歴史を持つクラブです。
    no_telop: true
  - image: assets/stats/ll_atletico_data1.png
    text: 愛称はコルチョネロス、マットレス職人。縞が、昔のマットレスの布と同じ色でした。
    no_telop: true
  - image: assets/stats/ll_atletico_data2.png
    text: ホームタウンは首都マドリード。今シーズンの1部には、この街から**3クラブ**。
    no_telop: true
  - image: assets/backgrounds/stadium_アトレティコマドリード.png
    text: 本拠地はメトロポリターノ。**7万813人**が入り、20クラブで**2番目**の大きさ。
  - image: assets/stats/ll_atletico_data4.png
    text: オーナーはアメリカの投資会社、アポロ。今年3月に株の**55パーセント**を握りました。
    no_telop: true
  - image: assets/stats/ll_atletico_cups.png
    text: 1部の優勝は**11回**、国王杯は**10回**。ヨーロッパリーグとスーパーカップは**3回**ずつ。
    no_telop: true
  - image: assets/stats/ll_atletico_data6.png
    text: 最多出場は主将のコケ。公式戦の**748試合**は、クラブの記録です。
    no_telop: true
  - image: assets/stats/ll_atletico_data7.png
    text: 直近のタイトルは2021年のリーグ優勝。最終節、バリャドリードに**2対1**で決めました。
    no_telop: true
  - image: assets/stats/ll_atletico_data8.png
    text: 昨シーズンは**4位**で勝ち点**69**。国王杯は決勝で、ソシエダにピーケー戦で敗れました。
    no_telop: true
