    image: assets/photos/ll/atletico/atletico_legend_383107cc.jpg
  - 2014年の最終節、カンプ・ノウで同点のヘディング。18年ぶりのリーグ優勝を決めます。
  - 2019年、主将の腕章をコケに渡して退団。リーグ戦で**277試合17得点**でした。
