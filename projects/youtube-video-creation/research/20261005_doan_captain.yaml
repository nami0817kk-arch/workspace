  opening_image: assets/images/20261005_doan_captain/01_w.jpg
  takeaway: 代表でのシュートを1試合ずつ数えると、最後にゴールを決めた去年秋の4試合は6本、ワールドカップの4試合は1本、キャプテンを任された9月からの3試合は0本だった。勝つことを最低条件にしてきた主将が、自分のシュートを課題に挙げた。決勝の国立で1本目を打てるかが、約11か月ぶりのゴールへの入り口になる
