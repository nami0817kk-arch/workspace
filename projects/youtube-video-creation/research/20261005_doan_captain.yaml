  say:
  - text: 10月4日、決勝の会場の国立競技場で、練習を終えたあとの言葉です。
  - text: 9月からの3試合、堂安は役割を変えながらピッチに立ってきました。
    image: assets/images/20261005_doan_captain/02_w.jpg
  - text: 初戦のウルグアイ戦は、フォワードのすぐ後ろ、右のシャドーで先発。
  - text: ベネズエラ戦は途中から入り、エクアドル戦は右のウイングバック。
  - text: サイドを上下して、守備にも走る役割です。
  - voice: 堂安律
    text: 特に1試合目はシャドーで使ってもらった中で
  - voice: 堂安律
    text: シュートシーンが少なかったので、そこが課題かなと
    cont: true
  - text: 準決勝のエクアドル戦は、相手の力も一段上だったと受け止めています。
  - voice: 堂安律
    text: 前回の試合はやはり相手のレベルが一つ上がった。
  - voice: 堂安律
    text: 1、2試合目はもっと自分の強みを
    cont: true
  - voice: 堂安律
    text: 出さなくてはいけないと思いました
    cont: true
