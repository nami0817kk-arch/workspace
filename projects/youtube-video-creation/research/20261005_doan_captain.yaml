- id: captain
  heading: 勝つことが最低条件。キャプテンを任されて
  tier: 報道
  telop: 堂安律「試合に勝つことが最低条件」
  narrator: キャスター
  say:
  - text: 堂安が初めてチームのキャプテンを任されたのは、今年3月のイギリス遠征でした。
    image: assets/images/20261005_doan_captain/03_w.jpg
  - text: ワールドカップでは板倉滉がキャプテンを務めました。
  - text: 敗れたブラジル戦では、堂安がキャプテンマークを巻いていました。
  - text: 9月からの4連戦で、森保一監督は再び堂安を指名しています。
  - text: 堂安がキャプテンを務めた活動は、3月の遠征から5戦全勝です。
  - voice: 堂安律
    text: 試合に勝つことが最低条件。
  - voice: 堂安律
    text: 4連勝を掲げて代表に来て、近くまで来ているので、
    cont: true
  - voice: 堂安律
    text: 集中力を切らさずに4連勝できるように頑張りたい
    cont: true
  quotes_from:
