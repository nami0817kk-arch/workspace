# 取材メモ（10/5 題材 doan_captain、型は quote）。材料の控え: research/raw/20261005_doan_captain.md
# 主役は、主将の堂安律がキリンカップ決勝（10/5 19:30 国立、対ニュージーランド）の前日 10/4 に語った「自分の課題」と「勝つこと」。
# 公開は 10/5 の試合前。試合の結果は書かない。
# 10/2 の「堂安と鈴木彩艶」「日本のPK戦」、10/4 の「決勝の前日（松木・後藤・佐野航大）」と重ねない。
#   PK戦の歴史・NZとの対戦成績・世界ランキング・東京五輪の話は入れない。
# 事実の裏:
#   発言はすべて 10/4 の練習後の取材。ゲキサカ 460315・サッカーキング 2212999・サッカーマガジン 17868155 の原文（raw の 1.）。
#   主将の経緯: 2026年3月のイギリス遠征で初めてチームキャプテン（遠藤航の不在）。W杯は板倉滉が主将、ブラジル戦は堂安がキャプテンマーク。
#     9月からの4連戦で森保監督が再び指名（9/24）。チームキャプテンの活動は 10/1 時点で5戦全勝（ゲキサカ 460136）。
#   シュート数: JFA の試合記録 PDF（国内）＋ FotMob（国外・W杯）を1試合ずつ数えた（raw の 3.）。
#     2025年10〜11月 4試合 6本1得点／2026年3〜5月 3試合 2本／W杯 4試合 1本／9月から 3試合 0本。
#   最後のゴール: 2025-11-14 ガーナ戦（豊田）の後半15分、久保建英のパスから左足（JFA PDF）。
# 写真: ゲキサカ（©Kaoru WATANABE/GEKISAKA、04 は ©Koki NAGAHAMA/GEKISAKA）。代理店ではない。
#   01 10/4 国立の練習・02 9/24 ウルグアイ戦（腕章）・03 W杯（腕章）・04 2025/11/14 ガーナ戦のゴールのあと。
