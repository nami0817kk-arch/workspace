# 取材: 2026-10-15。WebFetch で原文を読んだ（ゲキサカ photonews・サッカーキング・フットボールチャンネル（10/11）・Yahoo!（Burnley Express の採点の引用）・
#   バーンリー公式の試合レポート・Sky Sports の試合レポート・ESPN）。
# ★ この試合は現地10月10日（土）。題材の元のゲキサカ photonews は10/14掲載。**5日前の出来事**で、その後バーンリーは13日にチャールトンと2-2、次は16日。
#   → 「今季初勝利」の速報性は薄い。台本では「その後」を1行入れて、次の試合につなげた（ユーザーに確認する）。
# 日付・場所: 現地10月10日、ヴィカレージ・ロード（ワトフォード）、EFLチャンピオンシップ第9節。ワトフォード0-4バーンリー（クラブ公式・Sky・ゲキサカ・サッカーキング・FCで一致）。
# 得点: 13分ブルン・ラーセン（旗手アシスト）／19分アムドゥニ／25分旗手（移籍後初）／87分エドワーズ（途中出場）。クラブ公式・Sky・FC一致（サッカーキング・ゲキサカは時間の一部のみ）。
# 資料間のずれ: 旗手の得点の場面。クラブ公式「ピレスが戻したボールをカールをかけて決めた」・Sky「15ヤードから、空いたスペースで」・サッカーキング/FC「ボックス内左で右足のコントロールショット」→ 台本は「ピレスのパスを受けて右足で」。
#   13分のアシストの場面。FC「こぼれ球を回収してラストパス」・クラブ公式「ボールを奪って渡した」・Sky「高い位置のプレスのあとラーセンへ」→「こぼれ球を拾って」。
#   旗手の今季の出場数。サッカーキング「公式戦5試合1ゴール2アシスト・直近2試合先発」→ 使う。celticshorts「最初の4試合で144分」は1社なので使わない。
# 本人の言葉: どの記事にも無し（ゲキサカ・SK・FC・Burnley 公式・Sky・Express の引用）→ 取れなかった。台本に本人の言葉は入れない。
# 他人の声: ① Burnley Express の採点評（日本語はサッカーダイジェスト系の記事がYahoo!に載せた訳。「チーム最高タイの8点」）② ニッキー・ヘイエン監督（Sky Sports の英語原文を訳した）。
# 写真: 配信の写真は Getty。Commons の旗手は（CC BY-SA 4.0 Hameltion の縦写真1枚を使う。CC0 の Reo Hatate 2.jpg は後ろ姿で顔が無い。横長の写真は無し） 2024年のセルティックの練習着の1枚のみ（バーンリーの写真なし）。
# 反応のうち「また旗手がアシストか」は、46秒までに誰かの声を出す決まりのため、何が起きたかの節（13分のアシストの直後）に置いた。
# 反応: ①NO FOOTY NO LIFE（海外の反応まとめ・10/11）のバーンリーサポのコメントの日本語訳2件 ②サッカー批評Web（10/11）が引いたSNSの投稿1件（投稿者名は記事に無い）。匿名・未確認。
