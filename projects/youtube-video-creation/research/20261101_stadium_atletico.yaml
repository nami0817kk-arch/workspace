  say:
  - text: では、今季のホームは、どこまで埋まっているのか。数字は、10月30日の時点です。
    emph: true
    image: assets/images/20261101_stadium_atletico/01_w.jpg
    card: none
  - text: ホームの5試合の平均は、6万5564人。収容の92.6％。
    image: assets/images/20261101_stadium_atletico/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 5
    mark:
      kind: circle
      row: 5
  - text: いちばん多かったのは、9月20日の、レアル・マドリードとの試合。7万514人です。
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card:
      <<: *id_view
      highlight_row: 3
  - text: この本拠地の、入場の新記録。前の記録は、昨季のレアル戦の、7万112人でした。
    emph: true
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card: none
  - text: 満員まで、あと299席。
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card:
      type: calc
      title: 満員まであと何席か（自分で引いた）
