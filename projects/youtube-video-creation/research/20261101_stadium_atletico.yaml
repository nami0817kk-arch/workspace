# スタジアム紹介シリーズ：アトレティコ・マドリードの本拠地（リヤド・エア・メトロポリターノ、11/1 予定）。雛形は 10/29 ハルの回。
# 題材の選び方（2026-10-31）：プレミアは2026-27の20クラブのうち、イプスウィッチ以外の19クラブ＝出し済み（scripts/*stadium_*。ウェストハムは2部で別の回）。
#   残りのイプスウィッチは小物なので「大物の名前を先に」でラ・リーガを先に。ラ・リーガの大きさ順に見たが、
#   レアル・マドリード＝クラブが改装後の収容を公表していない（ラ・リーガは8万3186→8万4000、W杯招致の書類は7万8297、会長は「8万人前後」と食い違う。公式の一次が取れない）
#   バルセロナ＝カンプ・ノウは工事中で収容が毎月動く（6万2000台〜と報じられるがクラブの公式の数字が取れない）
#   → 数字が公式（クラブの発表）で言えて、物語が強いアトレティコを選ぶ。落としたのは上の2つと、イプスウィッチ（プレミアの最後の1つ。ハルの回の次の相手）。
# 重なりの確認（2026-10-31）：scripts/*stadium_* は22本。アトレティコ無し。covered.yaml・posted.json にも stadium_atletico は無い。
#   クラブ紹介 ll04（9/26）は「メトロポリターノ・7万813人・2番目」の1行だけ（同じ収容の数字）。財政 finance_atletico（10/22）は「2024年10月に名前がリヤド・エアに。2033年までの9年契約」の3行。
#   この回は名前の節で Riyadh Air を1行だけ（金額・契約年数は言わない）。軸は「陸上競技場として生まれた」「引っ越しが9年近くかかった」「今季の入場」。
# 今季のラ・リーガ所属（一次情報）：ESPN の ラ・リーガ（esp.1）2026-27 の試合記録にアトレティコ（2026-08-19〜10-31）。9/28 の順位表でも 2位。
# 収容（クラブの発表）：2026年10月から 70,813（それまで 70,692＝2024年11月の増設後。2017年の開場時 68,456）。
#   クラブの公式サイトは Cloudflare の確認で開けなかった（requests・WebFetch とも 403）。クラブの発表を引いた記事で確かめた：
#     AtletiMedia（2026-09-23）「la capacidad máxima del estadio ... 70.813 localidades」／Goal（2026-09-22）「club confirmed in a statement on its official website ... full 70,813-seat capacity, just 299 fans short」／
#     El Desmarque（2026-10-01）「70,813 ... announcement by Atlético through its official channels。70,692 から約121席増」。
#   2024年10月の命名権のクラブ発表（Zawya に転載）は 70,460。2024年11月の増設で 70,692（ウィキペディア es がクラブの公式サイトを出典に）。
# 入場（ESPN の試合記録・ラ・リーガ 2026-27、控え scratchpad の mad/laliga.json）：ホーム5試合
#   8/19 マラガ 65,785（2対0）／8/23 ビジャレアル 61,978（2対2）／9/16 オサスナ 60,869（4対0）／9/20 レアル・マドリード 70,514（2対1）／10/24 デポルティーボ 68,674（1対0）。
#   合計327,820・平均65,564＝収容の92.6％（65,564÷70,813=0.9259）。レアル戦 70,514÷70,813=0.9958＝99.6％、満員まで 70,813-70,514=299。
#   レアル戦を除く4試合：合計257,306・平均64,326.5＝90.8％（64,326.5÷70,813=0.9084）。
#   入場の新記録 70,514：クラブが公式サイトで発表（Goal 2026-09-22 が引用）。前の記録 70,112（昨季のレアルとのリーグ戦、AtletiMedia 2026-09-23）。
# 前の本拠地ビセンテ・カルデロン（ウィキペディア en）：1966年10月2日に開場。閉場時の収容 54,907。計算：70,813-54,907=15,906／70,813÷54,907=1.2897＝約1.29倍。
# 陸上競技場だった頃（ウィキペディア en・es）：1990年着工、1993年11月完成、費用 4200万ユーロ（es は「約70億ペセタ」＝ABC）。1994年9月（6日、es）に開場。収容 約2万、1段。愛称 ラ・ペイネタ（髪留めの櫛に似ている）。
#   1997年の世界陸上の招致のために建てた。1995年に開催地がアテネに決まった。2004年に「2012年五輪の招致の計画のため」閉場。
#   五輪の招致：2012年大会＝2005年に落選／2016年大会＝2009年に落選／2020年大会＝2013年9月に落選（en：Madrid's bid ... failed、es：2012・2016・2020の招致は実らず）。
# 引っ越し（ウィキペディア en）：2008年12月、クラブの会長とマドリード市長が移る合意に署名。当初は2013年に移る予定が「五輪の招致と経済危機で何度も後ろへずれた」。
#   2011年11月に最初の取り壊し工事、2012年春に下の客席と陸上のトラックを外す。2013年9月11日にクラブが計画を発表（2020年五輪の落選と同じ9月）。
#   クラブが市から買い取ったのは2017年（en は3月・価格 3040万ユーロ、es は5月5日に登記。月と価格は食い違うので「2017年」だけ言う）。
#   2017年9月16日に開場、マラガに1対0、最初のゴールはグリーズマン（en・es 一致）。
# 名前（ウィキペディア en・es）：ワンダ・メトロポリターノ＝2016年12月に発表・2017〜2022年／シビタス・メトロポリターノ＝2022年7月19日から（不動産会社 Cívitas Pacensis）／リヤド・エア・メトロポリターノ＝2024年10月9日から、2033年まで（クラブの発表、Zawya）。
# 決勝（ウィキペディア en・UEFA 理事会が2025年9月11日にティラナで決定）：2019年6月1日の決勝はリヴァプール 2-0 トッテナム、入場 63,272（en・es 一致）。2027年の決勝は 6月5日の予定（SI・ウィキペディア。スペインの観光サイトは日付未確定とする）。
# 言わなかったもの：購入価格と建て直しの費用（en と es で食い違う）／コンサート（バッド・バニー8公演など）／女子の入場の世界記録（女子は扱わない）／スペイン代表の試合／ラ・リーガ内での大きさの順位（レアル・マドリード・バルセロナの収容が公式で取れない）。
#   命名権の金額（クラブは公表していない）／昨季の平均入場（AtletiMedia の「6万855」は総数か平均か読み取れない）。
# 日本との接点（サッカーの縁）：無し。アトレティコに日本人選手は在籍していない（ESPN・クラブの2026-27 名簿、検索で確認）。久保建英のレアル・ソシエダは9/13に敵地でアトレティコに0対3（本拠地ではない）。無理に入れない。
# 写真：assets/images/20261101_stadium_atletico/（credits.json）。
