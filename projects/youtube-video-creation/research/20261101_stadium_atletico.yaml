  - text: 来年、この本拠地で、チャンピオンズリーグの決勝が開かれます。
    image: assets/images/20261101_stadium_atletico/01_w.jpg
    card: none
  - text: 予定は、2027年6月5日です。
    image: assets/images/20261101_stadium_atletico/01_w.jpg
    card: none
  - text: 決勝の舞台になるのは、2019年に続いて、2度目です。
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card: none
  - text: 2019年の決勝は、リヴァプールがトッテナムに2対0。
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card: none
  - text: 入場は6万3272人。いまの収容より、7541人少ない数字でした。
    image: assets/images/20261101_stadium_atletico/02_w.jpg
    card: none
  - text: 五輪の舞台にならなかった競技場は、2度目の決勝を、何人で迎えるのか。
    emph: true
    image: assets/images/20261101_stadium_atletico/01_w.jpg
