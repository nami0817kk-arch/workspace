# 試合結果 の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。出典は原文を読んだもの。
#  - 試合: CL リーグフェーズ第2節 マンチェスター・シティ 2-4 PSG（エティハド、現地10/14 夜 = 日本時間10/15 朝）
#  - 得点者・時間・PKセーブ・シュート数・枠内: ESPN の試合記録（summary API）。13分ドゥエ、15分デンベレ、32分ヴィティーニャ、
#    53分ハーランド、62分アクリウシュ、75分ハーランド、90分 F・トーレスのPKをドンナルンマが止めた。
#    シュートは シティ27本・PSG15本、枠内は シティ9・PSG10（ESPN の box score）。
#  - 記者の評価: ESPN「Man City can't compete with PSG, the Champions League's gold standard」（Rob Dawson・Mark Ogden）。
#    台本で読むのは本文の1文 "PSG are the standard in Europe at the moment, and City fell way below."（原文のまま日本語に）。
#    見出しの "gold standard" は「金字塔」ではなく「基準」の意味なので「欧州の基準」と訳した。
#  - ルイス・エンリケの言葉: ESPN「Halftime lead worried Luis Enrique in game PSG 'could have lost' to City」の引用（英語は ESPN が訳したもの）。
#    切って補わず、引用の文を日本語にした。スペイン語の原語は読めていない。
#  - マレスカの言葉: ESPN「Maresca insists Man City 'close' to PSG after 2nd-half rally falls short」の引用。
#    「ルイスは最後にかなり運がよかったと言った」はマレスカが明かした伝聞（ルイス・エンリケ本人の言葉としては出ていない）。
#  - 読めなかったもの: france24（403）、kicker・as.com は当たっていない。ESPN 本文は now.core.api.espn.com の記事APIで全文を読んだ（WebFetch は要約しか返さなかった）。
#  - ネットの反応: 実在の投稿は取れなかった（X・Reddit・Bluesky は普通のUAの requests では読めない。footmercato の「ネットが沸いた」記事は
#    投稿が埋め込みで本文に出ない）。作らない → 反応の節は置かない。
#  - アンダーソン（シティ）の出場・評価には触れない（今日の選手紹介と別の話にした）。
