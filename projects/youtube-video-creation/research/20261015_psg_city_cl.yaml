takeaway: "パリ・サンジェルマンはマンチェスター・シティに4対2で勝った。シュートはシティが27本、パリ・サンジェルマンが15本で、枠内は9本と10本、後半だけならシティが2点、パリ・サンジェルマンが1点。ルイス・エンリケ監督が「少し運が悪ければ負けていた」と話したのは、この数字と重なる。次は現地20日、ホームでバルセロナ（ともに勝ち点6）"

answer: 3対0の前半のあと、後半はシティが2対1で上回った。監督自身が「運が悪ければ負けていた」と話した
