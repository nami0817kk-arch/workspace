  say:
  - text: 2018年7月22日。神戸の一員として、初めてピッチに立ちます。
    image: assets/images/20261019_iniesta_legend/i18_kobe_w.jpg
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 0
  - text: 2020年1月1日。日本一を決める天皇杯の決勝で、鹿島に2対0。
    emph: true
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 1
  - text: これが、神戸にとって初のタイトルです。翌月にはスーパーカップも。
    card: &id009
      type: stats
      title: 神戸で獲った2つ
      items:
      - - '2019'
        - 年度
        - 天皇杯。クラブ史上初のタイトル
      - - '2020'
        - 年
        - スーパーカップ
      focus: 0
  - text: 2023年7月1日。札幌戦に先発して、57分までプレーしました。
    image: assets/images/20261019_iniesta_legend/i18_kobe_w.jpg
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 2
  - text: 神戸は、その5か月後の11月25日、クラブ史上初の、日本の1部リーグ優勝。
    emph: true
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 3
  - text: イニエスタはアラブ首長国連邦へ。2024年10月8日、引退を発表します。
    image: assets/images/20261019_iniesta_legend/i24_retire_w.jpg
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 4
  - text: 会見の言葉です。
    card: none
  - voice: イニエスタ
    text: これは、感動と誇りの涙だ。悲しみじゃない。
  - voice: イニエスタ
    text: サッカー選手になりたかった少年が、それを叶えた涙だ。
    cont: true
    pause: 0.5
  - text: 今年6月1日。アラブ首長国連邦の2部のクラブで、コーチに就くと伝わります。
    emph: true
    card:
      type: timeline
      title: 神戸から、いままで
      rows: *id006
      focus: 5
      highlight_row: 5
  - text: 目指すのは、指導者の資格、プロライセンスの取得です。
    card:
