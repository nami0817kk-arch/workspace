    - - 2018年4月
      - バルセロナを去ると発表した
    source: ESPN・クラブ公式・Goal
    highlight_row: 0
  say:
  - text: 秘話は2つ。まず、2010年7月11日。南アフリカでの、決勝の舞台です。
    image: assets/images/20261019_iniesta_legend/i12_lev_w.jpg
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 両チーム無得点のまま、延長に入ります。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 延長116分。ファブレガスのパスを、イニエスタがボレーで決めます。
    emph: true
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: これが決勝点。スペインにとって、初めての優勝でした。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: ゴールのあと、ユニフォームを脱ぎます。下のシャツには、文字が。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 「ダニ・ハルケは、いつも僕らと一緒に」。
    emph: true
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: ハルケは、バルセロナのもう1つのクラブ、エスパニョールの主将でした。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 2009年8月、26歳で亡くなっています。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 脱いだことで、警告も受けました。そのシャツは、のちにエスパニョールへ。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 0
  - text: 2つ目は、バルセロナを去る日です。
    image: assets/images/20261019_iniesta_legend/i18_press.jpg
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 1
  - text: 2018年4月27日。記者会見で、今季限りでの退団を発表しました。
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 1
  - text: 本人の言葉です。
    card: none
  - voice: イニエスタ
    text: 12歳の僕を迎えてくれたクラブには、
  - voice: イニエスタ
    text: 僕の最善を尽くす価値がある。
    cont: true
  - voice: イニエスタ
    text: イニエスタが去っても、バルサは勝ち続ける。
    cont: true
  - voice: イニエスタ
    text: サッカーは続くし、人生も続く。
    cont: true
    pause: 0.5
  - text: 5月20日、最後のカンプ・ノウ。レアル・ソシエダに1対0の勝ちでした。
    image: assets/images/20261019_iniesta_legend/i18_pitch.jpg
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
      source: ESPN・クラブ公式・Goal
      highlight_row: 1
  - text: 5日後、行き先が決まります。ヨーロッパから遠い、日本の神戸でした。
    emph: true
    card:
      type: table
      title: マル秘話
      columns:
      - いつ
      - 何があったか
      rows: *id007
