# アンドレス・イニエスタ（元バルセロナ／スペイン代表・元ヴィッセル神戸・いまはUAEのクラブのコーチ）の紹介。シリーズ「レジェンドの紹介（世界）」。見本は 10/18 のシャビ（research/20261018_xavi_legend.yaml）。
# 型は引退した選手向けの8節：①フック ②基礎DATA ③歩んできた道と転機（通算の表は④に置いた） ④プレースタイル（＋通算の表） ⑤あの試合（2009-05-06 CL準決勝・スタンフォード・ブリッジ） ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **軸は神戸（日本との接点）**。題材は「バルセロナの中盤が、神戸で過ごした5年」。**FotMob は使わない**（レーダー・シュートマップ・パーセンタイルなし）。数字は基本の数と、自分で割った・数えた値。Transfermarkt・DataMB・FBref 等は見ていない。
# 公開予定は 10/19。**台本は draft まで**（approve・build・screen・upload はしない）。
#
# **昨日のシャビの回と重ねないために**：シャビは「ユーロ2012決勝・767試合・25個・133試合・ウェンブリー・バイエルン・ペップが動くな・2.8倍」。こちらは「CL準決勝2009（スタンフォード・ブリッジ）・674試合・32個・131試合・神戸5年・ハルケへの追悼・0.08対0.19」。
#   2010年W杯決勝はシャビの回で「スペインがオランダを1対0」と1行出たが、こちらは**決勝のスコアを言わず**、延長116分のゴールとシャツの話（マル秘話①）だけに使った。
#   シャビの回と同じ文は使わない（「ワールドカップが1回。ヨーロッパ選手権が2回。」を「3大会続けて優勝」に、「黄金期を支えた司令塔」を「全盛期の中盤にいた人」に替えた）。
#
# **数字・出来事の出どころ（本文を実際に読んだもの。取材は requests と WebFetch／WebSearch の URL 探しのみ。ブラウザの道具は不使用）と確度**
# - FC バルセロナ公式（fcbarcelona.com。requests で本文を読んだ）：
#   ・Andrés Iniesta プロフィール／「the modest genius」（2024-10-08）＝674試合・タイトル32（リーガ9・国王杯6・CL4・スペイン・スーパーカップ7・欧州スーパーカップ3・クラブW杯3）、1996-09-16 に12歳でラ・マシア、2002-10-29 にファン・ハール監督の下でクラブ・ブルッヘ戦でデビュー、
#     レギュラー定着は2006-07季、シャビ・のちのブスケツと組む「サッカー史上最も重要な中盤の3人組の1つ」、2018年にヴィッセル神戸へ・5年・そのあとエミレーツで1年。スタンフォード・ブリッジのゴールは「おそらく最も有名」。
#   ・2024-10-08 引退の会見（本人の言葉：ラ・マシア・涙・「みんなで本当に楽しんだ。練習も魔法のようだった」・デビューの震え）。
#   ・2018-04-27 退団会見（本人の言葉）／2018-05-22 最後のカンプ・ノウ（レアル・ソシエダ 1-0・背番号8のユニフォームで花道・674試合57得点）／2018-05-25 神戸移籍（日本メディアは3年契約・背番号8・674試合はクラブ歴代2位でシャビに次ぐ）／2015-10-28 デビューの記事（12歳で家族を離れてラ・マシア・18歳）。
#   ・2020-05-06「11 years since Iniesta's Stamford Bridge masterpiece」＝2009-05-06・93分・第1戦は0-0・エッシェン9分・アビダル退場・アウェーゴールが要る・アルベスのクロスがこぼれてメッシへ→エリアの外のイニエスタが決める。→ **確定（クラブ公式の記録・発言）**。
# - ESPN（site.api.espn.com の試合記録・実況・統計。requests）：
#   ・CL準決勝2009 第2戦 チェルシー1-1バルセロナ（event 266494。エッシェン9分／イニエスタ90+3分＝実況93分／アビダルの退場は実況66分／イニエスタは95分にグジョンセンと交代／バルセロナ：ボール保持70.9%・総シュート14・**枠内シュート1**（実況89分「ここまで枠内シュートが1本も無い」）／チェルシー：保持29.1%・枠内4／合計1-1でアウェーゴール）、第1戦 0-0（event 266497）、決勝 バルセロナ2-0マンチェスター・U（2009-05-27 ローマ）。
#   ・W杯2010決勝（event 264123）の実況＝116分「ファブレガスが出して、イニエスタがボレーを決めた」／117分「イニエスタはシャツを脱いで警告」。
#   ・J1：2018-07-22 神戸0-3湘南（イニエスタは59分から出場）／2018-08-11 神戸2-1磐田（イニエスタ前半15分）／2023-07-01 神戸1-1札幌（先発・57分に交代・27,630人）／2023年最終順位 神戸1位（勝点71）。→ 報道（統計の出どころ）。
# - BBC Sport 2023-11-25（requests で本文）：ヴィッセル神戸が史上初のJ1優勝、イニエスタの退団の5か月後、名古屋に2-1で1試合を残して優勝。→ 報道。**「吉田監督が外してから調子が上がった」という記述は使わない**（選手を小さく見せる書き方になるため）。
# - AP（Canadian Press 配信・2026-06-01。castanetkamloops.net の転載を requests で全文）：イニエスタがUAE2部のガルフ・ユナイテッドで初のコーチの仕事・プロライセンスの取得手続き中・本人のコメント（「サッカーは僕にすべてをくれた…」「コーチとして成長し、本物の経験を積み、プロライセンスを取りたい」）。
#   Yahoo の2本（2026-05-22 ロマーノの報＝リーグは1部と書く／2026-06-01 AP）は**クラブの区分が食い違う**（1部・2部）。→ AP の「2部」に従い、台本は「UAE2部」と言う。**肩書は「コーチ」**（記事によって「監督」とも読める。確かめていない）。確度は 報道。
# - Goal.com 2011-07-11（requests で本文）：シャツ「Dani Jarque always with us」・ハルケは2009年8月、遠征先のホテルで26歳で亡くなった・イニエスタがシャツをエスパニョールに贈り、スタジアムに展示・エスパニョールの声明（青と白のファンの心をつかんだ）。→ 報道。
# - 英語版 Wikipedia（Andrés Iniesta 本文・Career statistics・Honours・Style of play／Vissel Kobe。raw）：バルセロナ674/57（クラブ公式と一致）、神戸134/26（J1 114/21）、エミレーツ23/5、スペイン代表131試合13得点、生年月日、欧州最優秀選手2012、
#   2019年度の天皇杯決勝（2020-01-01）で神戸が鹿島に2-0・クラブ史上初のタイトル、スーパーカップ（2020-02-08）、デル・ボスケ・グアルディオラの評価の言葉。→ 背景。
#
# **食い違いと台本での扱い**
# - 「5年」：神戸は2018-07〜2023-07（クラブ公式も「5年」）。→ 5年。
# - ヴィッセル神戸の通算（134試合26得点）はクラブ公式に無い（Wikipedia の表）。→ 確度は 背景。台本の「神戸で134試合26得点」は数えた値と明示する（見立ての節で「自分で数えた比べ」）。
# - バルセロナのリーガ優勝：クラブ公式のプロフィールは「9回」と書くが、年の一覧には8つしか載っていない。→ 「9回」（本文・Wikipedia の優勝歴が9つ）を採り、年は言わない。
# - 実況の分数：チェルシー戦の得点記録は90+3分、実況は93分。→ 台本は「93分」（クラブ公式も93分）。
# - 注意：ESPN の統計の「枠内シュート1」は ESPN の集計。クラブ公式は枠内の数を書かない。→ 台本は「ESPNの記録」と表に添える。
# - 読めなかったもの：J.League 公式の英語版の記事（古い記事は削除・転送）、UEFA・Japan Times（接続切れ・有料）、beIN・Les Nouvelles du Foot（404）。神戸の天皇杯決勝の試合記録は ESPN に無い（Wikipedia のみ）。
#   ガルフ・ユナイテッドの試合結果（今季のここまで）は確かめられず、言わない。
#
# **自分で数えた比べ（⑧）**
# - 1試合あたりの得点：バルセロナ 57÷674＝0.085（0.08）／神戸 26÷134＝0.194（0.19）。比＝2.3倍。
# - 1季あたりのタイトル：バルセロナ 32÷16季（2002-03〜2017-18。クラブ公式はトップチーム16年）＝2.0／神戸 2÷5季＝0.4。比＝5倍。神戸の2つは天皇杯（2019年度）・スーパーカップ（2020）。
# - 通算：クラブ 674＋134＋23＝831試合、57＋26＋5＝88得点（Wikipedia のキャリア合計 885試合93得点からバルセロナBの54試合5得点を除いた値と一致）。
# - ボール保持70.9%・枠内1・10人（66分から）は ESPN の記録。
#
# **入れなかったもの**：引退後の私生活・法的な問題・事業・ワイン（brief の決まり）。2009〜10年の心の不調（本人が話しているが、題に答える節ではなく、選手を小さく見せかねないので落とした）。
#   エミレーツ時代の細部（1行だけ）。バロンドール2010の順位（読んでいない）。ユーロ2012決勝（シャビの回の「あの試合」と重なる）。2006年CL決勝の途中出場（クラブ公式プロフィールにあるが詳細を読んでいない）。
#
# **日本語名・読みで怪しいもの**：イニエスタ／フエンテアルビージャ／アルバセテ／ラ・マシア／クラブ・ブルッヘ／ブスケツ／デル・ボスケ／グアルディオラ／エッシェン／アビダル／ファブレガス／ハルケ／エスパニョール／ガルフ・ユナイテッド／エミレーツ／ヴィッセル神戸／ジュビロ磐田／カンプ・ノウ／レアル・ソシエダ。
#
# 本人の言葉は6か所（自訳。原文は上の出典）：①フック（AP 2026-06 ガルフ・ユナイテッド）②歩み（クラブ公式 2024-10「ラ・マシアは僕を変えた」（デビュー時の言葉は尺のため落とした））③プレースタイル（クラブ公式 2024-10「楽しんでいた」）
# ④引退会見（クラブ公式 2024-10「涙」）・マル秘話②（クラブ公式 2018-04「12歳の僕を迎えてくれたクラブ」）⑤見立て（AP 2026-06「プロライセンス」）。
# 尺：preview4 の見積り約5分37秒（check の想定尺は7分00秒）。長かった初稿（6分45秒）から18行を落とした（ジュビロ戦の初ゴール・デビュー時の言葉・5/27の決勝・歴代2位・グアルディオラの評・エスパニョールの声明ほか）。
# precheck の残り×：写真i09_goal_w（1600px。ショートで2.13倍＝ショートは作らないので実害なし）と流れの点検の控え。サムネの classic 3回続きは brief の既定（classic）に従った。
