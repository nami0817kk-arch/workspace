        text: ルカは、特別な選手です。
        cont: true
      - text: トッテナムのデ・ゼルビ監督が、18歳のルカ・ウィリアムズ＝バーネットについて話した言葉です。
      - text: 21日のイプスウィッチ戦。ウィリアムズ＝バーネットは、プレミアリーグで初めて先発しました。
      - text: そして15分、左足で先制点。2対0の勝利の1点目でした。
        image: assets/images/20261123_williams_barnett_yamal/03_w.jpg
      - text: 監督が名前を出したヤマルは、バルセロナで10代のうちから世界のトップに立った選手です。
      - text: 試合の前、監督はそのヤマルを例に、本人に2つだけ頼んでいたといいます。
      - voice: デ・ゼルビ監督
        text: 公園で友だちとやるときのように、自由にプレーすること。
      - voice: デ・ゼルビ監督
        text: そして、ボールが無いときも走ること。
        cont: true
      - voice: デ・ゼルビ監督
        text: ラフィーニャや、ヤマルのように。
        cont: true
      - text: 監督は、試合前のバスの中の様子も明かしました。
        image: assets/images/20261123_williams_barnett_yamal/02_w.jpg
      - voice: デ・ゼルビ監督
        text: 彼はユーチューブで、
      - voice: デ・ゼルビ監督
        text: ロナウジーニョやアザール、ネイマールを見ていました。
        cont: true
      - voice: デ・ゼルビ監督
        text: サッカーは魔法ですね。
        cont: true
