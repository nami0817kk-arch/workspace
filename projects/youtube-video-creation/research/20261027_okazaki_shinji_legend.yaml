  say:
  - text: 岡崎慎司の生まれは、1986年4月16日。兵庫県の出身で、いま40歳です。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: 欧州では、ドイツ・イングランド・スペイン・ベルギーの4か国でプレー。
    card: {<<: *datacard, highlight_row: 2}
  - text: 大きなタイトルは、レスターでのプレミアリーグ優勝と、日本代表でのアジアカップ優勝。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
    emph: true
  - text: 引退は、2024年に終わったシーズン限り。シント＝トロイデンで終えました。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *datacard, highlight_row: 7}
