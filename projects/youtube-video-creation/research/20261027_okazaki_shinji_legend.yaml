- id: secret
  heading: 「一生ダイビングヘッド」と、自分で作ったクラブには、何があったのか
  tier: 報道
  telop: 恩師の言葉と、ドイツ11部からのクラブ
  card: &secretcard
    type: table
    title: 数字の外にある、2つの話
    columns:
    - いつ
    - 何があったか
    rows:
    - - プロ入りのとき
      - 恩師から「一生ダイビングヘッド」
    - - 2014年8月
      - ドイツ11部にバサラ・マインツを作る
    source: 毎日新聞・Wikipedia
    highlight_row: 0
  say:
  - text: 岡崎慎司の、数字の外にある話を2つ。
    image: assets/images/20261027_okazaki_shinji_legend/08_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 1つ目は、プロに入るときに、少年時代の恩師から贈られた言葉。
    card: {<<: *secretcard, highlight_row: 0}
  - text: 山村俊一さんの「一生ダイビングヘッド」です。
    card: {<<: *secretcard, highlight_row: 0}
  - text: 込められた思いは、「お前は止まったら終わり。一生跳び続けろ」。
    card: none
    emph: true
  - text: ウズベキスタン戦の決勝点も、こぼれ球に頭から飛び込んだゴールでした。
    image: assets/images/20261027_okazaki_shinji_legend/09.jpg
    card: none
  - text: 2つ目は、2014年8月。マインツでプレーしていた岡崎慎司は、
    image: assets/images/20261027_okazaki_shinji_legend/04_w.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - text: ドイツ11部に、自分たちのクラブを作ります。
    card: {<<: *secretcard, highlight_row: 1}
  - text: 名前は、FCバサラ・マインツ。
    card: {<<: *secretcard, highlight_row: 1}
  - text: そこから5年続けて昇格し、ドイツ6部まで上がりました。
    card: none
    emph: true
  quotes_from: []
  sources:
  - https://web.archive.org/web/20110917072828/http://mainichi.jp/enta/sports/soccer/10fwc/archive/news/2010/06/20100624k0000e050031000c.html
  - https://ja.wikipedia.org/wiki/%E5%B2%A1%E5%B4%8E%E6%85%8E%E5%8F%B8
  - https://www.footballista.jp/special/135134
- id: after
  heading: 引退した岡崎慎司は、いま、どこで何をしているのか
  tier: 報道
  telop: 引退のあと、自分で作ったクラブの監督に
  card: &aftercard
    type: timeline
    title: 最後の1年と、引退のあと
    rows:
    - - 2024年2月26日
      - 今季限りでの引退を発表。37歳
    - - 2024年6月17日
      - 引退会見。バサラ・マインツの監督に
    - - 2026年5月
      - ドイツ6部で監督を続ける
    focus: 2
    highlight_row: 0
  say:
  - text: 2024年2月26日。シント＝トロイデンが、岡崎慎司の引退を発表します。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: このシーズン限りで、37歳でした。
    card: {<<: *aftercard, highlight_row: 0}
  - text: 本人のコメントは、こうでした。
    image: assets/images/20261027_okazaki_shinji_legend/01_w.jpg
    card: none
  - voice: 岡崎慎司
    text: 気付いたら体がボロボロで、
    card: none
  - voice: 岡崎慎司
    text: そして自然と自分に限界を感じました。
    card: none
    cont: true
  - voice: 岡崎慎司
    text: このクラブに来た事、
    card: none
    cont: true
  - voice: 岡崎慎司
    text: このクラブで引退を決意した事は運命だと感じています。
    card: none
    cont: true
  - text: 6月17日の引退会見。岡崎慎司は、自分の20年について、こう話しています。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *aftercard, highlight_row: 1}
  - voice: 岡崎慎司
    image: assets/images/20261027_okazaki_shinji_legend/01_w.jpg
    text: 自分の選手生活は後悔だらけ。
    card: none
  - voice: 岡崎慎司
    text: ワールドカップ3大会に出て、50ゴールを取ったと
    card: none
    cont: true
  - voice: 岡崎慎司
    text: 言われること自体も悔しいですね。
    card: none
  - text: 理由は、自分で口にしてきた目標です。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: none
  - text: ワールドカップ優勝、プレミアで2桁得点、4大リーグでのプレー。
    card: none
  - text: そのほとんどに届かなかった、と会見で話しています。
    card: none
    emph: true
    cont: true
  - text: 同じ会見で、新しい仕事も明かします。自分が作ったバサラ・マインツの監督です。
    image: assets/images/20261027_okazaki_shinji_legend/04_w.jpg
    card: {<<: *aftercard, highlight_row: 1}
  - text: 2026年5月の取材でも、紹介は「ドイツ6部の監督」。
    card: {<<: *aftercard, highlight_row: 2}
  - text: 11部から作ったクラブで、いまは選手を育てる側に立っています。
    card: none
    emph: true
