  say:
  - text: 元日本代表のフォワード、岡崎慎司。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
    short_only: true
  - text: 2015年の夏、岡崎慎司が加わったレスターは、前の季を14位で終えたクラブでした。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *leicard, highlight_row: 0}
  - text: 開幕前、賭けの会社が付けた優勝のオッズは、5000倍です。
    card: {<<: *leicard, highlight_row: 0}
    emph: true
  - text: そのチームが、春には首位に立っていました。
    image: assets/images/20261027_okazaki_shinji_legend/07_w.jpg
    card: none
  - text: 3月、レスターは1対0の勝ちを3つ重ねます。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *leicard, highlight_row: 2}
  - text: その真ん中が、3月14日のニューカッスル戦でした。
    card: {<<: *leicard, highlight_row: 3}
  - text: 前半25分。岡崎慎司が体を倒しながら、足を振り上げました。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
    emph: true
  - text: レスターの本拠地で、岡崎慎司が決めた初めてのゴールでした。
    card: none
  - text: 5月、レスターは創設から132年で初めて、イングランドの1部で優勝します。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *leicard, highlight_row: 5}
    callword: 132年で初
  - text: 勝ち点は81。2位のアーセナルとは、10の差でした。
    card: {<<: *leicard, highlight_row: 5}
  - text: 岡崎慎司は、この季のリーグ戦38試合のうち36試合に出場。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
  - text: 優勝したチームの、前線の一角でした。
    card: none
    emph: true
