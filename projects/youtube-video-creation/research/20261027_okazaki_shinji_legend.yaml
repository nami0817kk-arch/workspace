# 岡崎慎司（元日本代表FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-27。型は 10/26 の大久保嘉人と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は STVV 日本公式・BBC・毎日新聞・サッカーキング・現代ビジネス・日本語/英語版 Wikipedia の成績表と試合記録、自分で足した値だけ。
# **私生活（家族・結婚）・怪我の中身・病気・法的な問題は入れない。女子サッカーは入れない**。Jリーグは経歴の事実（清水の所属・期間・リーグ戦の数）だけで、Jリーグそのものを題材にしない。
#
# **重なりの確認（2026-10-26）**：scripts/・research/covered.yaml・research/posted.json を「岡崎」で grep。
#   岡崎慎司が主役の回は無い（ザッケローニ監督・シュトゥットガルト紹介・遠藤保仁の回に名前が出るだけ）。scripts/20261027_* にも無い。
#   直近の日本人レジェンド（中田英寿・長谷部誠・中村俊輔・内田篤人・川口能活・小野伸二・稲本潤一・遠藤保仁・大久保嘉人）とも別人。
# **引退の確認（一次情報）**：STVV 日本公式「【お知らせ】FW岡崎慎司選手 現役引退のお知らせ」（stvv.jp/news/team/20240226_2、2024-02-26）
#   「FW岡崎慎司選手が2023-24シーズンをもって現役を引退することになりました」。→ **現役ではない**。BBC 2024-02-26 も同じ。
# **いまの立場**：2024-06-17 の引退会見で、ドイツ6部 FCバサラ・マインツの監督に就くと発表（サッカーキング 2024-06-17/18）。
#   現代ビジネス 2026-05-13（元川悦子）の見出し「ドイツ6部で監督を務める元日本代表・岡崎慎司」、写真の説明「ドイツ6部FCバサラ・マインツの監督を務める岡崎」。
#   **2026-05 より後の立場は確かめられなかった**ので、台本は「2026年5月の取材では」と時点を添える。
# **日本との接点**：全体が日本代表・W杯の話（代表119試合50得点、W杯は2010・2014・2018）。基礎DATAの次に代表の節を置いた。
#
# **数字の出どころと台本での扱い**
# - **日本代表 119試合50得点**：英語版 Wikipedia の年別（RSSSF 引用）2008=4/0・2009=16/15・2010=15/3・2011=14/8・2012=9/3・2013=14/7・2014=13/4・2015=13/7・2016=8/2・2017=5/1・2018=5/0・2019=3/0。合計を自分で足して 119試合・50得点。
#   デイリースポーツ 2024-02-26「代表通算１１９試合に出場し、歴代３位となる通算５０得点」。日本語版 Wikipedia「代表で50点を決めたのは釜本邦茂、三浦知良に続いて3人目」（50点目は 2017-03-28 タイ戦。英語版の得点一覧と一致）。
#   区切り（自分で足した）：2008〜09 = 20試合15得点、2010〜15 = 78試合32得点、2016〜19 = 21試合3得点。119÷50＝2.38 →「およそ2.4試合に1点」。
#   2009年の15得点：英語版「IFFHS … World's Top Goal Scorer of 2009 … for his 15 goals with the national team」（AS 2010-01-09 引用）。台本では「その年、代表の得点で世界一」とは言わず「国際サッカー歴史統計連盟が、2009年に代表でいちばん点を取った選手に選んだ」と言う。
# - **2009-06-06 ウズベキスタン戦**：1対0、決勝点（英語版の得点一覧 No.7）。毎日新聞 2010-06-24「Ｗ杯出場を決めた昨年６月のウズベキスタン戦では、決勝のシュート。…こぼれ球をヘディングで押し込む泥臭いゴール」。写真 08 は Commons の同じ試合のゴールの場面（説明文 "Shinji Okazaki's goal … Uzbekistan 0-1 Japan"）。
# - **W杯**：2010年は4試合すべて途中出場、デンマーク戦（2010-06-24、3対1）の87分に3点目（英語版 2010 Group E：本田のパスを無人のゴールへ）。
#   毎日新聞 2010-06-24（デンマーク戦の前）の本人の言葉「おれも決めたい。チャンスは必ずある」。2014年はコロンビア戦（1対4）の前半45+1分に頭で同点（英語版 2014 Group C）。2018年は出場（3大会連続はデイリー・STVV の経歴）。W杯の得点は2。
# - **クラブ（リーグ戦）**：英語版 Wikipedia の成績表。清水 121試合42得点、シュトゥットガルト 63/10、マインツ 65/27（2013-14 は33試合15得点、2014-15 は32試合12得点）、レスター 114/14（2015-16 は36試合5得点）、
#   ウエスカ 62/13（37+25。表の合計欄の63は足し算と合わないので 62 を使う。infobox も 62）、カルタヘナ 32/2、シント＝トロイデン 37/1。欧州のリーグ戦は 128+114+62+32+37＝373試合67得点（自分で足した）。全部で 494試合109得点（infobox と一致）。
#   サッカーキング 2024-06-18「5カ国7クラブでプレー」「マインツ在籍時にはブンデスリーガ2年連続2ケタ得点」。
#   マインツの 65試合27得点 → 65÷27＝2.41 ≒ 代表の 2.38。見立てで「どちらも、およそ2.4試合に1点」と言う。
# - **レスター 2015-16**：英語版 2015–16 Premier League「bookmakers had given Leicester City odds of 5000/1」「champions for the first time in their 132-year history」「previous season … finish 14th」。
#   勝ち点：レスター 23勝12分3敗＝81、アーセナル 20勝11分7敗＝71（同ページの表から自分で計算）。差は10。
#   2016-03-14 ニューカッスル戦：1対0、岡崎の25分の得点（英語版 2015–16 Leicester City season の試合表）。BBC 2016-03-14「spectacular overhead kick」「extended their lead at the top … to five points」「with just eight games left」「fifth league goal of the season」。
#   日本語版 Wikipedia「本拠地キング・パワー・スタジアムでの初ゴールをオーバーヘッドキックで決め」。3月は 5日ワトフォード 1対0・14日ニューカッスル 1対0・19日パレス 1対0（英語版のシーズン記事）。
# - **ウエスカ 2019-20**：2部で37試合12得点、2部優勝と1部昇格（英語版の成績表と Honours、SD Huesca 公式 2020-07-25 の契約延長の記事）。
# - **シュトゥットガルト**：2012-02-19 ハノーファー戦のオーバーヘッドがドイツの「月間最優秀ゴール」。日本人では1978年4月の奥寺康彦以来2人目（英語版、VfB 公式 2012-03-11 引用）。
# - **本人の言葉**：①STVV 日本公式の引退コメント（一次情報）から2文を原文のまま。②サッカーキング 2024-06-18（引退会見、元川悦子）の会見の言葉を原文のまま。③毎日新聞 2010-06-24 の「おれも決めたい。チャンスは必ずある」。
# - **一生ダイビングヘッド**：毎日新聞 2010-06-24「プロ入りする際、少年時代の恩師、山村俊一さん（３４）から贈られた言葉」「お前は止まったら終わり。一生跳び続けろ」「１日２００回のヘディング」。
# - **バサラ・マインツ**：日本語版 Wikipedia「2014年8月14日、ドイツ11部リーグに…設立」「5年連続で昇格…2020年時点でドイツ6部」。footballista 2022-03-16「創設者は岡崎慎司」「現在ドイツ6部」。現代ビジネス 2026-05「ドイツ6部」。
# - 年齢：1986-04-16 生まれ → 2026-10-27 で40歳、2024-02-26 で37歳（デイリーも37）、2016-03-14 で29歳、2010-06-24 で24歳（毎日も24）。
#
# **入れなかったもの**：膝の怪我の中身、マラガとの契約解除の理由（賃金の話）、家族、北京五輪の成績、カルタヘナ・シント＝トロイデンでの細かい数字、最後の試合の日（Sporza の報道しか当たれず）、
#   「欧州主要リーグのリーグ戦日本人最多（15点）」（いまも最多かを確かめられなかった）、移籍金の額。
# **写真**：レスター時代は Commons の 2017-08-26 マンチェスター・ユナイテッド戦（Ardfern、CC BY-SA 4.0）。2016年のニューカッスル戦そのものの写真は無い（行では「その試合の写真」と言わない）。
#   代表は Commons のウズベキスタン戦のゴール（TwoWings、CC BY 3.0）と 2018 スイス戦（PD）。引退会見は STVV 撮影（サッカーキング掲載）。監督の写真は現代ビジネス掲載。
