  say:
  - text: 2016年3月14日。プレミアリーグ、首位レスター・シティのホーム。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
  - text: 相手はニューカッスル。前半25分、日本人のフォワードが、オーバーヘッドで決めます。
    card: none
  - text: この1点を守って、1対0の勝ち。レスターは2位との差を5に広げました。
    card: none
    emph: true
  - text: そのフォワードの名前は、岡崎慎司。
    image: assets/images/20261027_okazaki_shinji_legend/08_w.jpg
    card: {<<: *hookcard, focus: 0}
  - text: 日本代表では、119試合で50得点。歴代3位の数字です。
    card: {<<: *hookcard, focus: 1}
  - text: ワールドカップは、3大会続けて出場しました。
    card: {<<: *hookcard, focus: 2}
  - text: 「一生ダイビングヘッド」を胸に跳び続けた20年を、たどります。
    image: assets/images/20261027_okazaki_shinji_legend/07_w.jpg
    card: none
