  say:
  - text: 日本代表での、岡崎慎司の記録を、時期に分けて見ます。
    image: assets/images/20261027_okazaki_shinji_legend/08_w.jpg
    card: {<<: *numcard, highlight_row: 3}
  - text: 最初の2年、2008年と2009年は、20試合で15得点。
    card: {<<: *numcard, highlight_row: 0}
  - text: その後の6年の、78試合32得点より速いペースでした。
    card: {<<: *numcard, highlight_row: 1}
    emph: true
  - text: 2009年6月のウズベキスタン戦。こぼれ球を頭で押し込み、これが決勝点になります。
    card: none
  - text: 日本は1対0で勝ち、ワールドカップ出場を決めます。
    card: none
  - text: 2010年、南アフリカ大会。最初の2試合は途中出場で、まだゴールはありません。
    image: assets/images/20261027_okazaki_shinji_legend/09.jpg
    card: none
  - text: 岡崎慎司は、デンマーク戦の前に、こう話していました。
    card: none
  - voice: 岡崎慎司
    text: おれも決めたい。チャンスは必ずある。
    card: none
  - text: その試合、87分。本田圭佑のパスを、空いたゴールへ流し込みます。
    image: assets/images/20261027_okazaki_shinji_legend/08_w.jpg
    card: none
    emph: true
  - text: 3対1の勝ち。日本は、グループリーグを突破しました。
    card: none
  - text: 2014年のブラジル大会では、コロンビア戦の前半終了間際に、頭で同点のゴール。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *numcard, highlight_row: 1}
  - text: 2017年3月のタイ戦で、代表50点目。釜本邦茂、三浦知良に続く、3人目でした。
    card: {<<: *numcard, highlight_row: 3}
