- id: view
  heading: 2.4試合に1点のフォワードは、レスターで何を変えたのか
  tier: 背景
  telop: 代表もマインツも、およそ2.4試合に1点
  viewpoint: true
  card: &viewcard
    type: table
    title: 岡崎慎司の点の取り方
    columns:
    - 場面
    - 試合・得点
    - 何試合に1点
    rows:
    - - 日本代表
      - 119試合50得点
      - およそ2.4
    - - マインツ
      - 65試合27得点
      - およそ2.4
    - - レスター 2015-16
      - 36試合5得点
      - およそ7.2
    source: Wikipedia
    highlight_row: 0
  say:
  - text: 岡崎慎司の点の取り方を、3つの場面で比べます。
    image: assets/images/20261027_okazaki_shinji_legend/08_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 日本代表は、およそ2.4試合に1点。
    card: {<<: *viewcard, highlight_row: 0}
  - text: マインツのリーグ戦も、65試合で27得点。こちらも、ほぼ同じペースです。
    card: {<<: *viewcard, highlight_row: 1}
    emph: true
    mark:
      kind: circle
      row: 1
      col: 何試合に1点
  - text: ところが優勝したレスターの1年目は、5得点。7試合で1点ほどのペースです。
    image: assets/images/20261027_okazaki_shinji_legend/10_w.jpg
    card: {<<: *viewcard, highlight_row: 2}
  - text: 点のペースは3分の1。
    image: assets/images/20261027_okazaki_shinji_legend/06_w.jpg
    card: none
  - text: それでもニューカッスル戦の1点は、首位を守る勝ち点3になりました。
    card: none
  - text: そして5000倍のチームは、頂点に立ちました。
    card: none
    emph: true
  - text: 本人は、その歩みを「後悔だらけ」と言います。
    image: assets/images/20261027_okazaki_shinji_legend/01_w.jpg
    card: none
  - text: それでも、止まらずに跳び続けた。それが、岡崎慎司というフォワードでした。
    card: none
