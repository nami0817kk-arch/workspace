  - https://www.soccer-king.jp/news/japan/japan_other/20240618/1902537.html
  sources:
  - https://stvv.jp/news/team/20240226_2
  - https://www.soccer-king.jp/news/japan/japan_other/20240618/1902537.html
  - https://www.soccer-king.jp/news/world/ger/20240617/1902169.html
