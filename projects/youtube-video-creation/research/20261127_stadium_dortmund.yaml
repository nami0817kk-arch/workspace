# スタジアム紹介シリーズ：ドルトムントの本拠地（ジグナル・イドゥナ・パルク／ヴェストファーレンシュタディオン、11/27 予定）。雛形は 11/25 バイエルンの回。
# 題材の選び方（2026-11-21）：ブンデスの大物で残っていた器。11/25 の担当が外した理由（買い戻しの金額が割れる）は、買い戻しを題にしないことで避けた。
#   同日 11/27 の他シリーズ（選手紹介＝ケイン、比べる＝ヤマルとニコ・ウィリアムズ、国内レジェンド、サッカーの謎）とクラブが重ならない（research/20261127_picks.txt）。
# 選んだ理由：「ヨーロッパで一番大きい立ち見 2万4454人」という強い一点／1992年に4万2800人まで縮んだのに立ち見を残した、という問いが立つ／今季の平均8万1365人で見立てが作れる。
# 重なりの確認：scripts/*stadium_*・posted.json・covered.yaml・research/*picks.txt に無し（grep 済み）。
# 一次情報の突き合わせ：en・de ウィキペディア（Westfalenstadion）、en ウィキペディア（Safe standing：UEFA は1998年夏から全席座席、ドルトムントはレールシート）、diefalsche9.de の観客表（2025-26・2026-27 とも平均8万1365。2026-27 は 11/16 時点）。
#   開場 1974-04-02（シャルケとの慈善試合 0-3、de）／当初5万4000（en・de 一致）／1992 北スタンドの立ち見を座席に→4万2800（en・de 一致。理由は en が「UEFA の規定で」）／
#   1995 優勝のあと東西に2階席（en はドイツ初の民間資金の増築）／1997 CL 優勝のあと南北を広げ、南は立ち見だけ 2万4454（de）／欧州の大会では座席だけになり約1万5000減る（de）／
#   2006 W杯で四隅を埋め、柱を外の黄色い柱に（en・de）／名前は 2005-12-01 からジグナル・イドゥナ・パルク、2031年まで（en・de）／
#   ドイツ代表は 1974-2006 にこの器で12試合負けなし、2006 準決勝のイタリア戦 0-2（延長）が唯一の負け（de）／最多は 2015-16 の平均8万1178（de）。
#   食い違い（台本に入れない）：1974年の工費（3170万か3270万マルク）、ドルトムントに決まった年（1971か1972）、1995年増築後の席（5万4000か5万5000）、1997年増築後の席（6万8800か6万8600）、
#   欧州の大会の席（6万5829か6万6099→「約6万6000」）、2022-23 から CL でも立ち見を許した（en だけ。de は国際試合は座席だけ→入れない）、不発弾（en だけ→入れない）、2002〜2006 の器の売却と買い戻し（金額が割れる→入れない）。
#   確かめられなかった：UEFA・クラブ公式の席数の一次の表（bvb.de は読んでいない）。
#   写真：Commons。南スタンドは CC BY 2.0、夜の場内は CC0、ほかは CC BY-SA。南スタンドの写真は遠景で、顔が分かる人は写らない。
# 読みが割れる名前：ジグナル・イドゥナ・パルク（シグナル）／ヴェストファーレンシュタディオン／ローテ・エルデ／ズュートトリビューネ（台本では「南スタンド」）。
