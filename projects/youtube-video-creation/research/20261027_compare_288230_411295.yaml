  - id: view
    heading: 見立て・35点と34点の1点差は、何を隠していたのか
    tier: 背景
    viewpoint: true
    narrator: 解説
    telop: 数字の違いが示すもの
    card: &viewcard
      type: duel
      left: {name: デンベレ, club: パリSG, photo: assets/images/20261027_compare_288230_411295/d_nor84/01_sq.jpg, color: "#2b6cd4"}
      right: {name: ラフィーニャ, club: バルセロナ, photo: assets/images/20261027_compare_288230_411295/r_mar133/01_sq.jpg, color: "#a50044"}
      rows:
        - [24/25 の得点, "35", "34"]
        - [1点にかかった時間, 約100分, 約137分]
        - [得点＋アシスト, "51", "60"]
        - [CLの得点＋アシスト, "14", "22"]
      bars: [24/25 の得点, 得点＋アシスト, CLの得点＋アシスト]
      lower: [1点にかかった時間]
      note: 24/25 のクラブの全公式戦（CLは UEFA チャンピオンズリーグだけ）。1点にかかった時間は自分で計算した値
    say:
      - text: 見立てです。24/25の得点は35と34。表では1点差でも、中身は違いました。
        mark: {kind: circle, row: 0}
        image: assets/images/20261027_compare_288230_411295/pair_a/01.jpg
        card: {<<: *viewcard, highlight_row: 24/25 の得点}
      - text: 点を取る速さでは、デンベレが上です。
        image: assets/images/20261027_compare_288230_411295/d_nor84/01_w.jpg
        card: {<<: *viewcard, highlight_row: 1点にかかった時間}
      - text: 点に絡んだ数は、得点とアシストの合計で60と51。こちらはラフィーニャが上です。
        emph: true
        image: assets/images/20261027_compare_288230_411295/r_mar133/01_w.jpg
        card: {<<: *viewcard, highlight_row: 得点＋アシスト}
      - text: チャンピオンズリーグに絞っても、22と14で、ラフィーニャが上回っていました。
        image: assets/images/20261027_compare_288230_411295/r_mar151/01_w.jpg
        card: {<<: *viewcard, highlight_row: CLの得点＋アシスト}
      - text: 裏づけになるのは、1点あたりで開いた37分と、点に絡んだ数の差の9。この2点です。
        image: assets/images/20261027_compare_288230_411295/pair_b/01.jpg
        card: none
      - text: 次の試合。パリ・サンジェルマンは日本時間31日の未明、敵地でル・アーヴル戦。
        image: assets/images/20261027_compare_288230_411295/d_mar195/01_w.jpg
        card: none
      - text: バルセロナは、日本時間11月1日の早朝に、ホームでアラベス戦です。
        image: assets/images/20261027_compare_288230_411295/r_mar208/01_w.jpg
        card: none
      - text: 今季は得点のラフィーニャ、アシストのデンベレ。この形が続くのか、注目です。
        image: assets/images/20261027_compare_288230_411295/pair_a/01.jpg
        card: none
