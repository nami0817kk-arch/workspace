# 取材メモ（10/27 火、シリーズ「比べる」、key: compare_288230_411295）。ウスマン・デンベレ（パリ・サンジェルマン・29歳）×ラフィーニャ（バルセロナ・29歳）。
# **FotMob・DataMB は使っていない**。数字は Transfermarkt（2026-10-26 取得。控え: research/raw/20261027_dembele_tm.json・20261027_raphinha_tm.json）。
#   Transfermarkt 番号：デンベレ 288230・ラフィーニャ 411295。API（tmapi-alpha）の performance-season・performance-game・market-value-history を3秒あけて取得。
#   クロスチェック：英語版 Wikipedia の Career statistics（2026-10-26 取得。控え: research/raw/20261027_dembele_wiki.wikitext・20261027_raphinha_wiki.wikitext）。
#     試合・得点は季ごとに TM と Wikipedia が一致（デンベレ 22/23 35試合8点・23/24 42試合6点・24/25 53試合35点・25/26 40試合20点・26/27 10試合4点、
#     ラフィーニャ 50試合10点・37試合10点・57試合34点・33試合21点・11試合15点）。アシスト・出場時間は Transfermarkt だけ。代表の試合は混ぜない（クラブの試合だけ）。
# **選んだ理由**：直近の比べ（10/2エムバペ×ハーランド・10/3クラシコ・10/9ベリンガム×ムシアラ・10/11マレン×ラウタロ・10/12ドルトムント×モナコ・10/14バレバ×カマラ・10/16エムバペ×ヴィニシウス・
#   10/17ペドリ×ヴィティーニャ・10/19バイエルン×ドルトムント・10/20ランキング（ラフィーニャ・ヤマル・エムバペ）・10/21ライス×ネヴェス・10/22ヤマル×サカ・10/23ヴィルツ×ロジャーズ・10/24オリーセ×パーマー・
#   10/25ケイン×レヴァンドフスキ・10/26ブルーノ×ウーデゴール）に、デンベレは一度も出ていない。2人を比べた回は無い（scripts/*compare*・research/*compare*・posted.json の build 名・covered.yaml を grep）。
#   ラフィーニャは 10/20 のランキングと 10/23 のショート（今季14点・9番への変身）で今季の得点を扱った。**この回の軸は 24/25（バロンドールの対象の季）**で、今季の数字は最後の節で短く触れるだけ。
#   大物の名前（2025年バロンドール1位と5位）×比べる軸（24/25 のクラブの得点は35と34で1点差、出場時間は1173分の差）。
#   ほかに当たって外した候補：サラー（今季トラブゾンスポル＝扱うリーグの外、10/26 のメモ）・クヴァラツヘリア（10/22 に手術の報）・ファン・ダイク×サリバ（守備の選手は基本の数で比べにくい）。
# **この回の軸**：24/25 のクラブの全公式戦。得点 35 と 34、出場時間 3488分と4661分。1点にかかった時間は 3488÷35＝99.7（約100分）と 4661÷34＝137.1（約137分）。
#   90分あたりの得点 35×90÷3488＝0.903（0.90）と 34×90÷4661＝0.657（0.66）。アシスト 16 と 26。得点＋アシスト 51 と 60（90分あたり 1.32 と 1.16）。
#   CL（24/25）：デンベレ 15試合1166分8点6アシスト、ラフィーニャ 14試合1224分13点9アシスト（ラフィーニャはギラシーと並ぶ得点王・アシストも1位、Raphinha の Wikipedia）。
#   バルセロナは準決勝でインテルに敗退（第2戦 3対4、Raphinha の Wikipedia）。PSG は決勝でインテルに 5対0、デンベレは2アシスト（Dembélé の Wikipedia）。
#   バロンドール 2025（対象は 2024-08-01〜2025-07-13）：1位デンベレ 1380点、5位ラフィーニャ 620点（2025 Ballon d'Or の Wikipedia。控え: research/raw/20261027_ballondor2025_wiki.wikitext）。
#   季ごとのクラブの得点（90分あたり）：デンベレ 22/23 8点2169分 0.33・23/24 6点2856分 0.19・24/25 0.90・25/26 20点2200分 0.82、
#     ラフィーニャ 10点2925分 0.31・10点1950分 0.46・0.66・21点2194分 0.86。
#   使っていない素材：年俸・負傷の中身・私生活・代表の数字・パーセンタイル・戦術の細部・移籍金（単位がユーロとポンドで割れるので出さない）・2026年バロンドールの候補（ラフィーニャは候補一覧に無い。選手を小さく見せる方向に働くので言わない）。
#   日本との接点（確かめた縁）：ラフィーニャは 2022年6月6日の日本代表対ブラジル代表（日本で開催、ブラジルが 1対0）に先発し、63分まで出場（ESPN の試合記録 634664。控え: research/raw/20261027_espn_jpn_bra_20220606.json）。
#     2025年10月14日の日本対ブラジル（日本が 3対2）にはラフィーニャの名前が無い（同じく ESPN 757632）。デンベレ側の日本との縁は見つからない（入れない）。
# **スタッツの条件（足切り）**：クラブのトップチームの全公式戦（リーグ・CL・国内カップ・スーパーカップ・クラブW杯）。代表・育成年代は混ぜない。
#   24/25 は2人とも 900分を大きく超える。26/27 はデンベレ 473分・ラフィーニャ 792分で **900分に届かない → 「いまの時点」と言う**（どちらも450分は超える）。
# **使った数**（TM の大会別）
#   デンベレ 24/25＝リーグ・アン 29試合1736分21点8A＋CL 15試合1166分8点6A＋クープ・ドゥ・フランス 4試合298分3点1A＋クラブW杯 4試合198分2点1A＋トロフェ・デ・シャンピオン 1試合90分1点＝53試合・3488分・35点・16A
#   ラフィーニャ 24/25＝ラ・リーガ 36試合2845分18点12A＋CL 14試合1224分13点9A＋国王杯 5試合423分1点4A＋スーペルコパ 2試合169分2点1A＝57試合・4661分・34点・26A
#   1試合あたりの出場：3488÷53＝65.8分、4661÷57＝81.8分。
#   デンベレ 26/27＝リーグ・アン 5試合238分1点2A＋CL 3試合160分3点3A＋UEFAスーパーカップ 1試合45分1A＋トロフェ 1試合30分＝10試合・473分・4点・6A（最後の試合は 10/20）
#   ラフィーニャ 26/27＝ラ・リーガ 9試合661分13点3A＋CL 2試合131分2点＝11試合・792分・15点・3A（最後の試合は 10/25）
#   **PSG は日本時間 10/27 4:30 にリヨン戦**（ESPN）。公開の時刻にはデンベレの数字が1試合ぶん古くなるので、今季の数字は「10月25日まで」と言う。
# 同じクラブにいた季（Wikipedia）：ラフィーニャは 2022年7月15日にリーズからバルセロナへ。デンベレは 2023年8月12日にバルセロナから PSG へ。22/23 は同じバルセロナで、2人ともラ・リーガ（2022–23）とスーペルコパ（2023）の優勝に名前がある。
# プロフィール（TM）：デンベレ 1997-05-15 生・フランス代表・両足・PSG の背番号10・市場価値 1億€（2026-06-01）。ラフィーニャ 1996-12-14 生・ブラジル代表・左足・バルセロナの背番号11・主将・市場価値 7000万€（2026-06-05）。
#   ラフィーニャは 2026年9月5日に主将に決まり、ブラジル人で初めて（Raphinha の Wikipedia、2026–27 の節）。
# 日程（ESPN、2026-10-26 時点）：ル・アーヴル対PSG 2026-10-30 18:00 UTC＝日本時間31日 3:00。バルセロナ対アラベス 2026-10-31 20:00 UTC＝日本時間11月1日 5:00。
