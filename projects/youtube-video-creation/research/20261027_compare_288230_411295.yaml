      - text: ただ、バルセロナは準決勝でインテルに敗れました。
        image: assets/images/20261027_compare_288230_411295/r_mar133/01_w.jpg
        card: {<<: *clcard, highlight_row: 最後の試合}
      - text: そのインテルに、パリ・サンジェルマンは決勝で5対0。デンベレは2アシストでした。
