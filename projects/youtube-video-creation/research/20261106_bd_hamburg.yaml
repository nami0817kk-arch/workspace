- id: japan
  heading: 東京での世界一決定戦から酒井高徳まで。ハンブルガーSVと日本は、どうつながってきたのか
  tier: 背景
  telop: 1983年に東京で南米王者と対戦。高原直泰、酒井高徳がプレー
  narrator: 解説
  say:
  - text: 1983年12月11日。ハンブルガーSVは、東京の国立競技場にいました。
    image: assets/backgrounds/stadium_ハンブルガーSV_in.png
    card:
      type: table
      title: ハンブルガーSVと日本
      columns:
      - 年
