- id: golden
  heading: 55年落ちなかったクラブは、なぜ1部に戻るまで7年かかったのか
  tier: 背景
  telop: 2018年に初めて2部へ。4位が3回、入れ替え戦で2回敗れ、2025年に昇格
  narrator: 解説
  main: true
  say:
  - text: 1963年に始まったブンデスリーガ。ハンブルガーSVは、最初の16クラブの1つ。
    image: assets/backgrounds/stadium_ハンブルガーSV.png
  - 2001年、スタジアムの北側のスタンドの上に、大きな時計が付きます。
  - 刻んでいたのは、1963年からブンデスリーガにいる時間。秒まで数えていました。
  - 2014年と15年は16位。入れ替え戦に回り、どちらも残ります。
  - 2018年5月12日の最終戦。ボルシアMGに勝ちますが、17位で初めての降格。
  - 翌日から時計はクラブが生まれてからの時間を示し、翌年には外されました。
  - text: 2部の1季目と2季目は、入れ替え戦に進める3位に、勝ち点1つ届きません。
    card:
      type: table
      title: 2部での7季
      columns:
      - 季
      - 順位
      rows:
      - - 1季目
        - 4位
      - - 2季目
        - 4位
      - - 3季目
        - 4位
      - - 4季目
        - 3位、入れ替え戦で敗退
      - - 5季目
        - 3位、入れ替え戦で敗退
      - - 6季目
        - 4位
      - - 7季目
        - 2位で昇格
  - 3季目も4位。4季目は3位に入りますが、入れ替え戦で1部のクラブに敗れます。
  - text: 5季目は最終戦の追加時間に、競っていたクラブが2点を取り、2位以内を逃します。
    card: none
    image: assets/images/bd_hamburg_team2025/scene.jpg
  - 3位からの入れ替え戦でも、また1部のクラブに敗れました。
  - それでも観客は減りません。その年は、ヨーロッパの2部でいちばん多い平均観客でした。
  - 7季目の2025年5月10日、ウルムに6対1で勝ちます。
  - 1試合を残して、7年ぶりの昇格を決めました。
  sources:
  - https://en.wikipedia.org/wiki/Hamburger_SV
  - https://de.wikipedia.org/wiki/Hamburger_SV
  - https://en.wikipedia.org/wiki/List_of_Hamburger_SV_seasons
  bg: assets/backgrounds/stadium_ハンブルガーSV_in.png
  official: false
