      - - 2016年
        - 酒井高徳が主将に
      - - 2018年
        - 初めての2部降格
  - ヨーロッパ王者として、南米王者のグレミオと、クラブの世界一を争います。
  - 85分に追いつくも、延長の93分に勝ち越され、1対2。世界一には届きません。
  - text: 2003年には、高原直泰が加わります。
    card: none
    image: assets/images/bd_hamburg_pair_japan/01.jpg
  - ブンデスリーガで**97試合13得点**。
  - 2015年には、酒井高徳がシュツットガルトから加入。
  - 翌2016年には、主将を任されます。
  - 2018年、クラブが初めて2部に落ちたシーズンも、リーグ戦28試合に出ました。
  - 2019年8月に神戸へ移るまで、リーグ戦は**114試合**でした。
  sources:
