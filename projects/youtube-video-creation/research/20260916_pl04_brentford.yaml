sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: もともとはサッカーのクラブではなく、ボートクラブだった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1889年10月16日"]
        - ["決めた場所", "オックスフォード＆ケンブリッジという酒場"]
        - ["愛称", "The Bees（ビーズ）"]
        - ["由来", "応援の掛け声の聞き間違い"]
    say:
      - もともとは、サッカーのクラブではありませんでした。**ボートクラブ**です。
      - 1889年10月16日、その仲間がオックスフォード＆ケンブリッジという酒場に集まります。
      - そこで**投票**が行われました。新しいクラブは、アソシエーション・フットボールをやる。
      - こうして、街の名を冠した「フットボールクラブ」という名前が決まりました。
      - 愛称は「ビーズ」。蜂です。
      - これは**聞き間違いから生まれています。**
      - 1894年から95年のシーズン、ジョセフ・ゲティンズという選手を応援していた学生たちがいました。
      - 掛け声は「バック・アップ、ビーズ」。Bをそのまま読んだ、学校の応援です。
      - それを聞いた人たちが「**バック・アップ、蜂**」だと思った。そのまま愛称になりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
  - id: ground
    heading: 本拠地
    main: true
    tier: 背景
    telop: 116年いたグリフィン・パークを、2020年に離れた
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["Gtechコミュニティ・スタジアム", "2020年から"]
        - ["収容人数", "17,250人"]
        - ["その前", "グリフィン・パーク（116年間）"]
    say:
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: この街のクラブは116年間、グリフィン・パークにいました。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: そこを離れたのは2020年でした。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: いまの本拠地はGテック・コミュニティ・スタジアム。ロンドン西部にあります。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 収容人数は1万7250人。プレミアリーグでは小さいほうです。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: タイトルの無いクラブに、得点王争いを持ち込んだ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "キース・アンドリュース"]
        - ["主将", "ネイサン・コリンズ（CB・アイルランド）"]
        - ["エース", "イゴール・チアゴ（FW・ブラジル）"]
        - ["昨季", "リーグ22点・全25点"]
        - ["日本人選手", "なし"]
    say:
      - "**主要タイトルがひとつも無いクラブに、得点王争いを持ち込んだ**選手がいます。"
      - エースはイゴール・チアゴ。ブラジル人のセンターフォワードです。
      - 昨季はリーグで**22点**、すべての大会で25点を挙げました。
      - 監督はキース・アンドリュースです。
      - 主将はネイサン・コリンズ。アイルランド代表のセンターバックです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: プレーオフに9回負けてから、10回目で上がった
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["2021年", "プレーオフ決勝でスウォンジーに2-0"]
        - ["1967年", "QPRに吸収される話が白紙に。消滅を免れる"]
    # 2026-09-22: 引き（9回跳ね返された）を受けるのはプレーオフの側なので、そちらを先に。
    # 決勝で敗れた4回（1997・2002・2013・2020年）で期間が分かる。「初めて」と「74年ぶり」が
    # 耳で矛盾するので、プレミアとしては初・1部としては74年ぶりと分ける。
    # 「身売り」は売られるだけならクラブは残るので、QPRに吸収されて消える、と言う。
    # 2026-09-22（3回目）: 「決勝で敗れたのも4回」は9回の外に聞こえるので「そのうち」。
    # 9回の期間は原文に無い（最初の敗退の年が記事に書かれていない）ので、期間は4回の側のまま
    # 節の頭に実写を1枚（2026-09-22）。旧本拠地グリフィン・パークの試合の場面
    # （2013年4月のドンカスター戦。この年もプレーオフ決勝で敗れた）。出典は assets/images/pl_brentford_story/credits.json
    say:
      - {text: "プレーオフに出ては敗れる。それが**9回**続きました。イングランドで、ほかにない数です。", image: assets/images/pl_brentford_story/scene.jpg}
      - そのうち4回は、決勝まで行って敗れました。1997年から2020年のあいだのことです。
      - 10回目が2021年でした。決勝でスウォンジー・シティを2対0で下します。
      - "プレミアリーグになってからは初めて。1部としては**74年ぶり**でした。"
      - 消えかけた年も、あります。
      - 1967年、クイーンズ・パーク・レンジャーズに吸収されて、クラブごと消える話がまとまりかけました。
      - 止めたのはサポーターです。抗議と寄付で、話は白紙に戻りました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ウェスト・ロンドン・ダービー。相手はフラム
    narrator: 解説
    card:
      type: table
      title: ウェスト・ロンドン・ダービー
      columns: ["", ""]
      rows:
        - ["いちばん激しい相手", "フラム／クイーンズ・パーク・レンジャーズ"]
        - ["呼び名", "ウェスト・ロンドン・ダービー"]
        - ["2020年8月4日", "プレーオフ決勝。延長でフラムが2-1"]
        - ["今季", "フラムもプレミアリーグにいる"]
    say:
      - ウェスト・ロンドン・ダービーと呼ばれる一戦があります。
      - 指しているのは4つのクラブです。チェルシー、フラム、クイーンズ・パーク・レンジャーズ、そしてこのクラブ。
      - "そのなかでいちばん激しいのが**フラム戦**、そしてクイーンズ・パーク・レンジャーズ戦だと書かれています。"
      - 熱を帯びたのは1980年代からです。フラムが下のリーグへ落ちていった時期でした。
      - 試合はいつも満員で、ピッチでもスタンドでも緊張が高まった、と残っています。
      - 近いところで決定的だったのは2020年8月4日。チャンピオンシップのプレーオフ決勝です。
      - 延長の末、フラムが2対1で勝ち、昇格していきました。
      - ジョー・ブライアンが105分と117分に2点。こちらはヘンリク・ダルスゴーが120分すぎに1点を返すのがやっとでした。
      - そのフラムは、今季もプレミアリーグにいます。
      - なお距離の近いチェルシーとは、むしろ「わりと良好な関係」だとも書かれています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/West_London_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 現役のあいだ、一度も警告を受けなかった
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ケン・クート", "559試合。クラブ史上最多出場"]
        - ["ジム・タワーズ", "282試合163得点。クラブ史上最多得点"]
        - ["アイバン・トニー", "141試合72得点／単季31点"]
    say:
      - "守備の選手でありながら、現役のあいだ**一度も警告を受けなかった**人がいます。"
      - ケン・クート。1949年から64年まで559試合に出て、クラブ史上最多の出場です。
      - 得点の記録はジム・タワーズ。1954年から61年に282試合163得点。
      - 1958年から59年は、1シーズンで50試合37得点でした。
      - "ジョージ・フランシスと組んだ2トップは「**テリブル・ツインズ**」と呼ばれています。"
      - その年、チームの83得点のうち61点を、この2人だけで挙げました。
      - 2013年の投票では、クラブ史上最高の選手にも選ばれています。
      - 近いところではアイバン・トニーです。2020年から24年に、公式戦141試合72得点。
      - 2021年5月8日のブリストル・シティ戦で31点目を決め、チャンピオンシップの単季最多得点を塗り替えました。
      - その年のプレーオフ決勝でも点を取り、クラブを1つ上の舞台へ引き上げています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ken_Coote
      - https://en.wikipedia.org/wiki/Jim_Towers
      - https://en.wikipedia.org/wiki/Ivan_Toney
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 持っているのは2部優勝1回。プレミアは6季連続
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["2部優勝", "1回（1934-35）"]
        - ["3部優勝", "2回"]
        - ["4部優勝", "3回"]
        - ["1部での最高順位", "5位（1935-36）"]
        - ["プレミアリーグ", "6季連続"]
    say:
      - 持っているのは、1934年から35年の**2部優勝**です。
      - ほかに3部で2回、4部で3回、優勝しています。
      - 今季で創設から**137年目**、プレミアリーグは**6季連続**です。
      - "**下から順に積み上げて、いまはトップリーグに居続けているクラブ**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
