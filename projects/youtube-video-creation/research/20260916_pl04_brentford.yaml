sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 酒場の投票で、サッカーをやると決まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1889年10月16日"]
        - ["決めた場所", "オックスフォード＆ケンブリッジという酒場"]
        - ["愛称", "The Bees（ビーズ）"]
        - ["由来", "応援の掛け声の聞き間違い"]
    say:
      - アルファベット順では、4番目に来ます。
      - もともとは、サッカーのクラブではありませんでした。**ボートクラブ**です。
      - 1889年10月16日、その仲間がオックスフォード＆ケンブリッジという酒場に集まります。
      - そこで**投票**が行われました。新しいクラブは、アソシエーション・フットボールをやる。
      - こうして、街の名を冠した「フットボールクラブ」という名前が決まりました。
      - 愛称は「ビーズ」。蜂です。
      - これは**聞き間違いから生まれています。**
      - 1894年から95年のシーズン、ジョセフ・ゲティンズという選手を応援していた学生たちがいました。
      - 掛け声は「バック・アップ、ビーズ」。Bをそのまま読んだ、学校の応援です。
      - それを聞いた人たちが「**バック・アップ、蜂**」だと思った。そのまま愛称になりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.

  - id: ground
    heading: 本拠地
    main: true
    tier: 背景
    telop: 収容17,250人。116年いた場所を2020年に離れた
    narrator: 解説
    say:
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 本拠地はGテック・コミュニティ・スタジアム。ロンドン西部にあります。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 収容人数は1万7250人。プレミアリーグでは小さいほうです。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 移ってきたのは2020年でした。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: それまでの116年間、この街のクラブはグリフィン・パークにいました。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.

  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はキース・アンドリュース。日本人選手はいません
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "キース・アンドリュース"]
        - ["主将", "ネイサン・コリンズ"]
        - ["日本人選手", "なし"]
    say:
      - 監督はキース・アンドリュースです。
      - 就任は2025年6月。前任のトーマス・フランクがトッテナムへ移ったあとを引き継ぎました。
      - 主将はネイサン・コリンズ。センターバックです。
      - 今夏は5人が加わりました。
      - ランスからママドゥ・サンガレ、**4100万ポンド**。
      - ウェストハムからエル・ハジ・マリック・ディウフが3500万ポンド。
      - バーンリーからジェイドン・アンソニーが1500万ポンド、ザルツブルクからヤニク・シュスターが1200万ポンド。
      - カラム・ウィルソンは、所属クラブのない状態から加わっています。
      - 出ていったほうでは、ジョーダン・ヘンダーソンがチェルシーへ移りました。
      - そして、日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Brentford_F.C._season

  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: プレーオフに9回負けてから、10回目で上がった
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1935-36年", "1部で5位。クラブ最高"]
        - ["1967年", "身売り話が白紙に。消滅を免れる"]
        - ["2021年", "プレーオフ決勝でスウォンジーに2-0"]
    say:
      - このクラブは、一度消えかけています。
      - 1967年、QPRへの身売りの話がまとまりかけました。
      - 止めたのはサポーターです。抗議と寄付で、話は白紙に戻りました。
      - そしてもうひとつ、長く続いた記録があります。
      - "**プレーオフで9回続けて敗れた。**これはリーグの記録です。"
      - 10回目が2021年でした。決勝でスウォンジー・シティを2対0で下します。
      - "**74年ぶり**の1部昇格でした。"
      - 1部での最高順位は、1935年から36年の5位です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
