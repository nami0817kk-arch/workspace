    main: true
    tier: 背景
    telop: 収容17,250人。116年いた場所を2020年に離れた
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["Gtechコミュニティ・スタジアム", "2020年から"]
        - ["収容人数", "17,250人"]
        - ["その前", "グリフィン・パーク（116年間）"]
    say:
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 本拠地はGテック・コミュニティ・スタジアム。ロンドン西部にあります。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 収容人数は1万7250人。プレミアリーグでは小さいほうです。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: 移ってきたのは2020年でした。}
      - {image: "assets/images/pl_brentford/scene.jpg",
         text: それまでの116年間、この街のクラブはグリフィン・パークにいました。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はネイサン・コリンズ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "キース・アンドリュース"]
        - ["主将", "ネイサン・コリンズ（CB・アイルランド）"]
        - ["エース", "イゴール・チアゴ（FW・ブラジル）"]
        - ["昨季", "リーグ22点・全25点"]
        - ["日本人選手", "なし"]
    say:
      - 監督はキース・アンドリュースです。
      - 主将はネイサン・コリンズ。アイルランド代表のセンターバックです。
      - エースはイゴール・チアゴ。ブラジル人のセンターフォワードです。
      - 昨季はリーグで**22点**、すべての大会で25点を挙げました。
      - "**主要タイトルがひとつも無いクラブに、得点王争いを持ち込んだ**選手です。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: プレーオフに9回負けてから、10回目で上がった
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1935-36年", "1部で5位。クラブ最高"]
        - ["1967年", "身売り話が白紙に。消滅を免れる"]
        - ["2021年", "プレーオフ決勝でスウォンジーに2-0"]
    say:
      - このクラブは、一度消えかけています。
      - 1967年、QPRへの身売りの話がまとまりかけました。
      - 止めたのはサポーターです。抗議と寄付で、話は白紙に戻りました。
      - そしてもうひとつ、長く続いた記録があります。
      - "**プレーオフで9回続けて敗れた。**これはリーグの記録です。"
      - 10回目が2021年でした。決勝でスウォンジー・シティを2対0で下します。
      - "**74年ぶり**の1部昇格でした。"
      - 1部での最高順位は、1935年から36年の5位です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Brentford_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝0回、FAカップ0回
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "0回"]
        - ["FAカップ", "0回"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "出場そのものが無い"]
        - ["2部優勝", "1回（1934-35）"]
    say:
      - 最後に、獲ってきたものを数えます。
      - 1部優勝、ゼロ。FAカップ、ゼロ。リーグカップ、ゼロ。
      - "ヨーロッパは優勝がないどころか、**出たことがありません。**"
      - 持っているのは1934年から35年の2部優勝と、3部を2回、4部を3回。
      - 今季で創設から**137年目**、プレミアリーグは**6季連続**です。
      - "**137年、大きなタイトルをひとつも獲らずにここまで来ました。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
