# プレミアリーグ20クラブ紹介 ④ブレントフォード（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「ボートクラブが、酒場の投票でサッカーを選んだ」**と
# **「愛称は聞き間違いから生まれた」**。どちらも記事に書かれている話。
#
# **得点源は書かない。**今季の得点者が記事から読み取れなかった。
# 分からないものは空けておく（推測で埋めない）
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では4番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「1部優勝ゼロ、FAカップゼロ」の数え上げをやめ、獲った下部リーグの
#   優勝と6季連続プレミアだけにした。カードの「0回」の行も消した。
