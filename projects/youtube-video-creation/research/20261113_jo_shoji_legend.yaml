- id: johor
  heading: ジョホールバルの75分は、どんな場面から生まれたのか
  tier: 報道
  telop: 1997年11月16日、イラン2対3日本
  main: true
  card: &johorcard
    type: table
    title: 1997年11月16日 イラン対日本
    columns:
    - 時間
    - できごと
    rows:
    - - 39分
      - 中山が先制、日本1対0
    - - 46分
