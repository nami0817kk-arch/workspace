# 城彰二（元日本代表 FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-13。型は 11/11 の高原直泰・11/9 の槙野智章と同じ8節の変形。
# **情報の時点は 2026-11-11。**年齢は出さない。いまの仕事は言わない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は日本語版 Wikipedia「城彰二」の成績表・英語版 Wikipedia「Shoji Jo」・
#   英語版「1998 FIFA World Cup qualification (AFC)」（ジョホールバルの得点者と分）・Sportiva 2017-11-18 の本人インタビュー（全5頁のうち1・2頁）だけ。
# **病気・私生活・法的な問題は入れない。**1998年W杯の成績（3戦全敗）は、選手を小さく見せる書き方になるので数えない（3試合に出たことだけ言う）。
#
# **題材を選んだ理由**：引退した日本人FWで、**使える大きい写真が3枚そろう**数少ない人（前回 11/11 の高原は写真が足りず差し替えた）。
#   Commons に 3840x2560 の CC BY-SA 2.0 が3枚（2010年 norio nakayama、2017年 セルバンテス文化センター東京 2枚）。ほかの候補は写真が無い（下）。
#   日本代表・W杯に絡む話（1997年ジョホールバル、1998年W杯）＝ヒットの条件に当たる。本人の言葉（Sportiva 2017）も取れた。
#   スペイン1部（レアル・バリャドリード）でプレーした経歴で、ラ・リーガ関連の題材が続く時期にも合う。
# **重なりの確認（2026-11-11）**：scripts/ を「城彰二」「城」で grep → 本人の題・サムネの本は無い。research/posted.json・covered.yaml にも無い。
#   research/20261112_picks.txt は未作成（先に書いた担当なし）。11/9〜11/11 の国内レジェンド（槙野・高原）と重ならない。
# **引退の確認**：英語版 Wikipedia「Shoji Jo」に「2006シーズン後に引退、最後のクラブは横浜FC（2003〜2006）」。日本語版の成績表も 2006 年の横浜FCで終わる。
#   日本語版に引退の発表日は無い（確かめられなかった）。→ 台本は「2006年のシーズンを最後に」とだけ言う。現役ではない。
# **候補から外したもの**：田中マルクス闘莉王（2019-12-01 引退で一次情報は確認できたが、Commons の大きい写真が無い。1200x800 が1枚・657x643 が1枚・ほかは小さい）、
#   柳沢敦・名波浩・楢崎正剛（Commons に写真が無い）、小笠原満男（152x297 が1枚）、中山雅史（146x195）、福西崇史・佐藤寿人・牧（小さい）、本田圭佑・香川真司・長友・川島（現役）。
#
# **数字の出どころ**
# - 生年月日 1975-06-17・北海道室蘭市生まれ、鹿児島県で育つ（日本語版）。FW。
# - クラブ別リーグ戦（日本語版の表）：ジェフ市原 1994-96 99試合35得点、横浜マリノス／横浜F・マリノス 1997-2001 106試合59得点、
#   レアル・バリャドリード 1999-00 15試合2得点（スペイン1部、期限付き）、ヴィッセル神戸 2002 25試合1得点（期限付き）、横浜FC 2003-06（J2）151試合44得点。
#   合計 396試合141得点（自分で足した。99+106+15+25+151=396、35+59+2+1+44=141。J1 230試合95得点・J2 151試合44得点・スペイン15試合2得点とも一致）。
#   年別：1994 33-12、1997 21-12、1998 31-25、1999 25-18、2003 33-12、2004 35-8、2005 40-12、2006 43-12。
# - 日本代表 35試合7得点（1995〜2001年、日本語版）。年別：1995 1-0、1996 3-0、1997 13-4、1998 10-1、1999 5-0、2000 2-2、2001 1-0。
#   1995〜96年 4試合0点／1997年 13試合4点／1998年 10試合1点／1999〜2001年 8試合2点（自分で束ねた。合計 35試合7点）。1997年の4点は7点の約57%（4÷7）。
# - 1998年W杯：3試合に出場（日本語版・英語版）。
# - ジョホールバル（英語版 1998 FIFA World Cup qualification (AFC)）：1997-11-16、イラン2-3日本（延長・ゴールデンゴール）。
#   得点：中山雅史39分、アジジ46分（イラン）、ダエイ58分（イラン）、城彰二75分、岡野雅行118分。
# - 交代：後半18分に呂比須ワグナーと一緒に入った（Sportiva 2017-11-18 の記事の導入文）。**75分の同点ゴール（2対2）**。
# - 1試合あたり（自分で割った）：J1 95÷230＝約0.41、日本代表 7÷35＝0.20、スペイン1部 2÷15＝約0.13、1998年 25÷31＝約0.81。
# - 本人の言葉（Sportiva 2017-11-18、佐藤俊、「ジョホールバルの歓喜」から20年・城彰二編。原文のまま。[ ]は記事の補足）：
#   ①「ロペ［呂比須］が［交代の］ファーストチョイスなのはいつもどおり。ただ、彼が呼ばれたときにベンチがざわついた。」（続く「『城も一緒だ』っていきなり言われて……。」は VOICEVOX が「城」を「シロ」と読むので台本に入れず、地の文「同じ交代で、城彰二にも声がかかりました」にした）
#   ②「［イランには］ダエイとアジジという強力なFWがいましたからね。」
#   ③「最初、［日本がボールを奪ったとき］前にスペースが空いていると思って、そこを突こうと思ったんだけど、［そのスペースは］オフサイドだった。」「それで、一度戻って、スピードダウンして止まった。」
#      「そのとき、ボールを持っていたヒデ［中田英寿］がちょうど顔を上げたので、『あっ［クロスが］来るな』と思って動き直したんですけど」
#   （記事の見出し「あのイラン戦、同点弾の城彰二は『脳震とう』で中盤をウロウロしていた」は本文が有料で、本人の発言を確かめられなかったので使わない。）
# - 次の日本代表の試合：11月14日ブラジル戦・11月17日パラグアイ戦（11/4 の指示書。JFA 公式の発表）。W杯初出場は1998年＝28年前。
#
# **入れなかったもの**：アトランタ五輪、1994年の新人記録（Wikipedia が「記録」と言い切っていない）、前歯の話（要出典）、解説・テレビ・Jリーグ百年構想の仕事、
#   十勝スカイアース、私生活・CM、1998年W杯の戦績、ジョホールバルのゴールの形（クロスか・ヘッドか＝確かめられなかった）、「日本人初」系（日本語版に記述が無い）。
# **写真**：assets/images/20261113_jo_shoji_legend/（Commons だけ。3840x2560、**現役時代のものではなく引退後のスーツ姿**。台本では現役の話の行にも使うので、概要欄の撮影者表示のほかは触れない）
#   01 = 「Shoji Jo Visa ゴォーーール・デイ.jpg」（norio nakayama、CC BY-SA 2.0、2010-06-01）。01_w=16:9、01_v=縦。panel_01 = 01_w に通算の表を描いたサムネ専用（.thumbonly）
#   02 = 「Shoji Jo in Institute Cervantes Tokyo.jpg」（Instituto Cervantes de Tokio、CC BY-SA 2.0、2017-11-09）。02_w・02_v は手で位置を決めて切った（顔の自動検出が外れた）
#   03 = 「Shoji Jo in Institute Cervantes Tokyo 2.jpg」（同上）。03_w・03_v も同じ
#   ほかに当たったもの：「Shoji Jo 2006.jpg」（Ryosuke Yagi、CC BY 2.0、1024x768）は 429 で取れず、取れても本編2.4倍になるので使わない。紋章の差し込みは 日本・スペイン。
