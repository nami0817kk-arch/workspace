    highlight_row: 0
  say:
  - text: 日本は先に決めたのに、後半の立ち上がりに2点を取られ、逆転されていました。
    image: assets/images/20261113_jo_shoji_legend/03_w.jpg
    card: none
  - text: 城彰二は、イランのフォワードをこう振り返ります。
    card: none
  - voice: 城彰二
    text: イランには、ダエイとアジジという、
    card: none
  - voice: 城彰二
    text: 強力なフォワードがいましたからね。
    card: none
    cont: true
  - text: 後半18分、城彰二は呂比須ワグナーと一緒に、ピッチへ入ります。
    image: assets/images/20261113_jo_shoji_legend/02_w.jpg
    card: none
  - voice: 城彰二
    text: ロペが交代のファーストチョイスなのは、いつもどおり。
    card: none
  - voice: 城彰二
    text: ただ、彼が呼ばれたときに、ベンチがざわついた。
    card: none
    cont: true
  - text: 同じ交代で、城彰二にも声がかかりました。
    card: none
  - text: 逆転されてから17分後の75分、城彰二が追いつきます。
    image: assets/images/20261113_jo_shoji_legend/01_w.jpg
    card: {<<: *johorcard, highlight_row: 3}
    emph: true
  - text: ゴールの前の動きを、本人はこう話しています。
    card: none
  - voice: 城彰二
    text: 最初、前にスペースが空いていると思って、
    card: none
  - voice: 城彰二
    text: そこを突こうと思ったんだけど、オフサイドだった。
    card: none
  - voice: 城彰二
    text: それで、一度戻って、スピードダウンして止まった。
    card: none
    cont: true
  - voice: 城彰二
    text: そのとき、ボールを持っていたヒデが、
    card: none
    cont: true
  - voice: 城彰二
    text: ちょうど顔を上げたので、
    card: none
    cont: true
  - voice: 城彰二
    text: あっ、クロスが来るなと思って、動き直したんですけど。
    card: none
    cont: true
    emph: true
  - text: 43分後の118分、岡野雅行のゴールデンゴールで、日本が3対2の勝ち。
    card: {<<: *johorcard, highlight_row: 4}
  - text: これで日本は、本大会への切符を手にしました。
    image: assets/backgrounds/cut_日本.png
    card: none
