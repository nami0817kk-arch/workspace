  say:
  - text: 城彰二のプロ生活は、1994年のジェフ市原から始まります。
    image: assets/images/20261113_jo_shoji_legend/03_w.jpg
    card: {<<: *roadcard, highlight_row: 0}
  - text: 1年目からリーグ戦33試合に出て、12点です。
    card: {<<: *roadcard, highlight_row: 0}
  - text: 日本代表に初めて出たのは、翌1995年。
    card: {<<: *roadcard, highlight_row: 1}
  - text: ただ、1995年と96年の2年間は4試合で、代表のゴールはまだありません。
    card: none
  - text: 1997年、横浜マリノスへ。リーグ戦は21試合で12点。
    image: assets/images/20261113_jo_shoji_legend/01_w.jpg
    card: {<<: *roadcard, highlight_row: 2}
  - text: 代表でも、この年に4点を取ります。
    card: {<<: *roadcard, highlight_row: 2}
  - text: その締めくくりが、ジョホールバルでした。
    card: none
  quotes_from: []
  sources:
