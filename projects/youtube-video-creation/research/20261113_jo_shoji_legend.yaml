  say:
  - text: 城彰二は1975年6月17日、北海道室蘭市の生まれ。育ったのは鹿児島です。
    image: assets/images/20261113_jo_shoji_legend/01_w.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: ポジションはフォワード。
    card: {<<: *datacard, highlight_row: 1}
  - text: ジェフ市原、横浜マリノス、スペインのバリャドリード、神戸、横浜FC。
    card: {<<: *datacard, highlight_row: 2}
  - text: クラブの通算は、リーグ戦396試合で141点です。
    card: {<<: *datacard, highlight_row: 2}
  - text: 日本代表には1995年から選ばれ、フランス大会の本大会にも立っています。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *datacard, highlight_row: 3}
  quotes_from: []
  sources:
  - https://ja.wikipedia.org/wiki/%E5%9F%8E%E5%BD%B0%E4%BA%8C
  - https://en.wikipedia.org/wiki/Shoji_Jo
