  - text: 1997年11月16日、マレーシアのジョホールバル。
    image: assets/images/20261113_jo_shoji_legend/02_w.jpg
    card: none
  - text: ワールドカップ初出場がかかった、イランとのプレーオフです。
    card: none
  - text: 日本が1点を追う展開の、後半18分。1人のフォワードがピッチに入ります。
    card: none
  - text: 75分、そのフォワードが同点ゴールを決めます。
    card: none
    emph: true
  - text: 延長の末に3対2で勝った日本は、初めてのワールドカップへ進みました。
    card: none
  - text: そのフォワードが、城彰二です。
    image: assets/backgrounds/cut_日本.png
    card: {<<: *hookcard, focus: 0}
    callword: 城彰二
  - text: 日本代表では35試合で7点。そのうちの4点は、この1997年に取りました。
    image: assets/images/20261113_jo_shoji_legend/01_w.jpg
    card: {<<: *hookcard, focus: 2}
