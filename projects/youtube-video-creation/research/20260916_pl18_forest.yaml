sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 今季のプレミアで、いちばん古いクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1865年"]
        - ["愛称", "ガリバルディス／レッズ／トリッキー・トゥリーズ"]
        - ["本拠地", "シティ・グラウンド"]
        - ["収容人数", "31,212人"]
    say:
      - 今季のプレミアリーグで、いちばん古いクラブです。創設は**1865年**。
      - 愛称はいくつもあります。「ガリバルディス」「レッズ」、そして「トリッキー・トゥリーズ」。
      - 本拠地はシティ・グラウンド。収容は3万1212人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: clough
    heading: 上がって、優勝して、ヨーロッパを獲った
    main: true
    tier: 背景
    telop: 2部から上がった翌シーズンに、1部で優勝した
    narrator: 解説
    card:
      type: table
      title: 3年で起きたこと
      columns: ["", ""]
      rows:
        - ["1977年", "2部から昇格（勝ち点52）"]
        - ["翌シーズン", "1部優勝"]
        - ["1979年・1980年", "ヨーロッパカップ連覇"]
        - ["1977年11月から", "リーグ42試合無敗"]
    say:
      - "2部から昇格した翌シーズンに、**1部で優勝したクラブ**です。"
      - さらにその次から、ヨーロッパカップを**2年続けて**制しました。1979年と1980年です。
      - 2回以上ヨーロッパを獲ったイングランドのクラブは、6つしかありません。
      - 昇格したのは1977年。勝ち点は**52**でした。
      - これは、昇格したチームとしては**歴代5番目に少ない**数字です。ぎりぎりでした。
      - この時代を作ったのが、ブライアン・クラフとピーター・テイラーです。
      - 1977年11月からは、リーグ戦で**42試合**負けませんでした。
      - 1シーズンぶんに相当する長さで、それまでの記録はバーンリーの35試合でした。
      - ほかに例のない3年間です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: fall
    heading: そして落ちた
    tier: 背景
    telop: 1993年、プレミアリーグ最初のシーズンに降格
    narrator: キャスター
    card:
      type: table
      title: 落ちた年
      columns: ["", ""]
      rows:
        - ["1993年", "プレミア最初のシーズンに降格"]
        - ["クラフ時代", "18年でここまで"]
        - ["1部復帰まで", "23年"]
    say:
      - 1993年、**プレミアリーグの最初のシーズン**に降格します。
      - 頂点にいたクラブが、そのままではいられませんでした。
      - ブライアン・クラフが指揮した18年が、そこで終わりました。
      - そこから1部に戻るまでに、長い時間がかかります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: back
    heading: 23年ぶりに戻ってきた
    tier: 背景
    telop: 欧州を連覇したクラブが、23年も1部にいなかった
    narrator: 解説
    card:
      type: table
      title: 戻るまで
      columns: ["", ""]
      rows:
        - ["下のリーグ", "23年"]
        - ["復帰", "2022年（プレーオフ）"]
        - ["その間の欧州王者", "連覇の記録は残ったまま"]
    say:
      - ヨーロッパを連覇したクラブが、**23年**のあいだ1部にいませんでした。
      - その年月は、すべて下のリーグで過ごしています。
      - 戻ってきたのは2022年です。プレーオフを勝ち上がっての昇格でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ダービー・カウンティとの、イースト・ミッドランズ・ダービー
    narrator: 解説
    card:
      type: table
      title: イースト・ミッドランズ・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1892年10月1日／3-2"]
        - ["火が付いたのは", "1970年代後半（クラフの移籍）"]
        - ["2007年から", "ブライアン・クラフ・トロフィー"]
        - ["初のトロフィー戦", "2007年7月31日／0-2"]
        - ["今季", "相手はプレミアリーグにいない"]
    say:
      - "相手は**ダービー・カウンティ**。**イースト・ミッドランズ・ダービー**と呼ばれます。"
      - 公式戦で初めて当たったのは1892年10月1日。レースコース・グラウンドで、フォレストが**3対2**で勝ちました。
      - "火が付いたのは1970年代の後半です。**ダービーで成功したブライアン・クラフが、フォレストの監督になった**ことがきっかけでした。"
      - 2007年からは、この試合に**ブライアン・クラフ・トロフィー**が懸かっています。
      - 最初のトロフィー戦は2007年7月31日、プライド・パーク。**ダービーが2対0**で勝っています。
      - "ただし、**今季のプレミアリーグに、ダービー・カウンティはいません。**リーグでこの一戦は組まれません。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Derby_County_F.C.%E2%80%93Nottingham_Forest_F.C._rivalry
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: マッキンレー、ロバートソン、ピアース
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["ボブ・マッキンレー", "リーグ614試合（クラブ最多出場）"]
        - ["ジョン・ロバートソン", "リーグ386試合61得点"]
        - ["スチュアート・ピアース", "401試合63得点"]
    say:
      - 名前を挙げるなら、この3人です。
      - "ボブ・マッキンレー。1951年から1969年。リーグ**614試合**で、クラブ最多出場です。"
      - "1959年のFAカップ優勝メンバーで、1959年から1965年にかけては**265試合**続けて出ています。"
      - ジョン・ロバートソン。1970年から1983年。リーグ386試合で61得点。
      - "1979年のヨーロッパカップ決勝では、トレヴァー・フランシスの決勝点を**アシスト**しました。"
      - "そして翌年の決勝では、**自分で決勝点**を決めています。"
      - スチュアート・ピアース。1985年から1997年、401試合63得点。
      - "「**サイコ**」と呼ばれた長年の主将です。イングランド代表78試合のうち76試合はこのクラブでの出場で、クラブ最多になります。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Bob_McKinlay
      - https://en.wikipedia.org/wiki/John_Robertson_(footballer,_born_1953)
      - https://en.wikipedia.org/wiki/Stuart_Pearce
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 2005年に下部組織へ入った、生え抜きの主将
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "オリヴァー・グラスナー"]
        - ["主将", "ライアン・イェーツ（MF・イングランド）"]
        - ["下部組織入り", "2005年"]
        - ["エース", "ギブス＝ホワイト（副主将・背番号10）"]
        - ["昨季", "18点"]
    say:
      - "主将のライアン・イェーツは、**2005年にこのクラブの下部組織へ入りました。**"
      - そこから上がってきた生え抜きで、イングランド人の中盤です。
      - エースはモーガン・ギブス＝ホワイト。副主将です。
      - 昨季は18点を挙げています。**生え抜きの主将と、点を取る10番**という組み合わせです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 自国のリーグより、ヨーロッパで多く優勝している
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["ヨーロッパカップ", "2回（1978-79／1979-80）"]
        - ["1部優勝", "1回（1977-78）"]
        - ["リーグカップ", "4回（直近 1989-90）"]
        - ["FAカップ", "2回（直近 1958-59）"]
    say:
      - "**自国のリーグより、ヨーロッパで多く優勝しているクラブ**です。"
      - "これはヨーロッパで**このクラブだけ**です。"
      - ヨーロッパカップが2回、1部優勝が1回という内訳です。
      - 言い換えると、リーグをもう1回獲った瞬間に、この記録は消えます。
      - 本拠地のシティ・グラウンドは、2031年に4万5千人、2033年に5万2500人への拡張が計画されています。
      - いまの姿を見られるのは、あと数年です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
