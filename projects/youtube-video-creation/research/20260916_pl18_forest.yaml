sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1865年創設。プレミアで最も古いクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1865年"]
        - ["愛称", "ガリバルディス／レッズ／トリッキー・トゥリーズ"]
        - ["本拠地", "シティ・グラウンド"]
        - ["収容人数", "31,212人"]
    say:
      - アルファベット順では、18番目に来ます。
      - 創設は**1865年**。今季のプレミアリーグで、いちばん古いクラブです。
      - 愛称はいくつもあります。「ガリバルディス」「レッズ」、そして「トリッキー・トゥリーズ」。
      - 本拠地はシティ・グラウンド。収容は3万1212人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: clough
    heading: 上がって、優勝して、ヨーロッパを獲った
    main: true
    tier: 背景
    telop: 1977年昇格 → 翌年に1部優勝 → 1979・80年に欧州連覇
    narrator: 解説
    card:
      type: table
      title: 3年で起きたこと
      columns: ["", ""]
      rows:
        - ["1977年", "2部から昇格（勝ち点52）"]
        - ["翌シーズン", "1部優勝"]
        - ["1979年・1980年", "ヨーロッパカップ連覇"]
        - ["1977年11月から", "リーグ42試合無敗"]
    say:
      - このクラブには、ほかに例のない3年間があります。
      - 1977年、2部から昇格しました。勝ち点は**52**。
      - これは、昇格したチームとしては**歴代5番目に少ない**数字です。ぎりぎりでした。
      - ところが翌シーズン、**1部で優勝します。**
      - さらにその次から、ヨーロッパカップを**2年続けて**制しました。1979年と1980年です。
      - 2回以上ヨーロッパを獲ったイングランドのクラブは、6つしかありません。
      - この時代を作ったのが、ブライアン・クラフとピーター・テイラーです。
      - 1977年11月からは、リーグ戦で**42試合**負けませんでした。
      - 1シーズンぶんに相当する長さで、それまでの記録はバーンリーの35試合でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: fall
    heading: そして落ちた
    tier: 背景
    telop: 1993年、プレミアリーグ最初のシーズンに降格
    narrator: キャスター
    card:
      type: table
      title: 落ちた年
      columns: ["", ""]
      rows:
        - ["1993年", "プレミア最初のシーズンに降格"]
        - ["クラフ時代", "18年でここまで"]
        - ["1部復帰まで", "23年"]
    say:
      - 頂点にいたクラブが、そのままではいられませんでした。
      - 1993年、**プレミアリーグの最初のシーズン**に降格します。
      - ブライアン・クラフが指揮した18年が、そこで終わりました。
      - そこから1部に戻るまでに、長い時間がかかります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: back
    heading: 23年ぶりに戻ってきた
    tier: 背景
    telop: 2022年、プレーオフを勝ち上がって
    narrator: 解説
    card:
      type: table
      title: 戻るまで
      columns: ["", ""]
      rows:
        - ["下のリーグ", "23年"]
        - ["復帰", "2022年（プレーオフ）"]
        - ["その間の欧州王者", "連覇の記録は残ったまま"]
    say:
      - 下のリーグで過ごした年月は、**23年**にのぼりました。
      - 戻ってきたのは2022年です。プレーオフを勝ち上がっての昇格でした。
      - ヨーロッパを連覇したクラブが、23年も1部にいなかったことになります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はライアン・イェーツ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "オリヴァー・グラスナー"]
        - ["主将", "ライアン・イェーツ（MF・イングランド）"]
        - ["下部組織入り", "2005年"]
        - ["エース", "ギブス＝ホワイト（副主将・背番号10）"]
        - ["昨季", "18点"]
    say:
      - 主将はライアン・イェーツ。イングランド人の中盤です。
      - "**2005年にこのクラブの下部組織へ入りました。**そこから上がってきた生え抜きです。"
      - エースはモーガン・ギブス＝ホワイト。副主将です。
      - 昨季は18点を挙げています。**生え抜きの主将と、点を取る10番**という組み合わせです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝1回（1977-78）、FAカップ2回（直近 1958-59）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "1回（1977-78）"]
        - ["FAカップ", "2回（直近 1958-59）"]
        - ["リーグカップ", "4回（直近 1989-90）"]
        - ["ヨーロッパカップ", "2回（1978-79／1979-80）"]
    say:
      - 数えると、大きなタイトルで**10個**です。
      - 1部優勝は1回。ヨーロッパカップは2回。
      - "**ヨーロッパで獲った数が、自国リーグで獲った数より多い。**"
      - "これはヨーロッパで**このクラブだけ**です。"
      - 言い換えると、リーグをもう1回獲った瞬間に、この記録は消えます。
      - 本拠地の話も、ひとつ添えておきます。
      - シティ・グラウンドはいま3万1212人ですが、2031年に4万5千人、2033年に5万2500人への拡張が計画されています。
      - いまの姿を見られるのは、あと数年です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
