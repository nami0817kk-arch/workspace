sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 今季のプレミアで、いちばん古いクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1865年"]
        - ["愛称", "ガリバルディス／レッズ／トリッキー・トゥリーズ"]
        - ["本拠地", "シティ・グラウンド"]
        - ["収容人数", "31,212人"]
    say:
      - 今季のプレミアリーグで、いちばん古いクラブです。創設は**1865年**。
      - 愛称はいくつもあります。「ガリバルディス」「レッズ」、そして「トリッキー・トゥリーズ」。
      - 本拠地はシティ・グラウンド。収容は3万1212人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: clough
    heading: 上がって、ヨーロッパを獲って、そして落ちた
    main: true
    tier: 背景
    telop: 2部から上がった翌シーズンに、1部で優勝した
    narrator: 解説
    card:
      type: table
      title: 上がって、落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["1977年", "2部から昇格（勝ち点52）"]
        - ["翌シーズン", "1部優勝。11月から42試合無敗"]
        - ["1979年・1980年", "ヨーロッパカップ連覇"]
        - ["1993年", "プレミア最初のシーズンに降格"]
        - ["1994年", "すぐに復帰。翌シーズン3位"]
        - ["1999年", "再び降格"]
        - ["2022年", "23年ぶりに1部へ（プレーオフ）"]
    say:
      # 2026-09-22 流れの点検。年が一方向に進む順に並べ直した。1994年復帰と1999年降格の
      # 1行が抜けていて、1993＋23＝2016 で 2022 に合わなかった。クラフとテイラーは
      # 監督と右腕（Wikipedia: assistant manager）。ヨーロッパカップはいまのチャンピオンズリーグ
      # 2026-09-22 2回目。どこからどこへ上がったのか（2部→1部）を1行目で言う
      - 2部から1部に上がったのは1977年。勝ち点**52**は、昇格チームとして**歴代5番目に少ない**数字でした。
      - "ぎりぎりで上がったそのクラブが、翌シーズン、**1部で優勝**します。"
      - この時代を作ったのが、監督のブライアン・クラフと、右腕のピーター・テイラーです。
      - さきほどの負けなしの記録も、1部に上がったその年の11月に始まっています。
      - さらに次のシーズンからは、ヨーロッパカップ、いまのチャンピオンズリーグです。
      - 1979年と1980年、**2年続けて**制しました。
      - "そして1993年、**プレミアリーグの最初のシーズン**に降格します。クラフが指揮した18年も、そこで終わりました。"
      # 2026-09-22 2回目。1行に3つの出来事と指し示し2つ（「その次」「さきほどの最高位」）が
      # あったので、年を付けて2文に分けた
      - 1994年にすぐ戻り、その次のシーズンには**3位**に入りました。
      - ですが1999年に、また落ちます。
      - "ヨーロッパを連覇したクラブが、そこから**23年**、1部にいませんでした。"
      - 戻ってきたのは2022年。プレーオフを勝ち上がっての昇格でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ダービー・カウンティとの、イースト・ミッドランズ・ダービー
    narrator: 解説
    card:
      type: table
      title: イースト・ミッドランズ・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1892年10月1日／3-2"]
        - ["火が付いたのは", "1970年代後半（クラフの移籍）"]
        - ["2007年から", "ブライアン・クラフ・トロフィー"]
        - ["初のトロフィー戦", "2007年7月31日／0-2"]
        - ["今季", "相手はプレミアリーグにいない"]
    say:
      - "相手は**ダービー・カウンティ**。**イースト・ミッドランズ・ダービー**と呼ばれます。"
      - 公式戦で初めて当たったのは1892年10月1日。レースコース・グラウンドで、フォレストが**3対2**で勝ちました。
      - "火が付いたのは1970年代の後半です。**ダービーで成功したブライアン・クラフが、フォレストの監督になった**ことがきっかけでした。"
      - 2007年からは、この試合に**ブライアン・クラフ・トロフィー**が懸かっています。
      - 最初のトロフィー戦は2007年7月31日、プライド・パーク。**ダービーが2対0**で勝っています。
      - "ただし、**今季のプレミアリーグに、ダービー・カウンティはいません。**リーグでこの一戦は組まれません。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Derby_County_F.C.%E2%80%93Nottingham_Forest_F.C._rivalry
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: マッキンレー、ロバートソン、ピアース
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["ボブ・マッキンレー", "リーグ614試合（クラブ最多出場）"]
        - ["ジョン・ロバートソン", "リーグ386試合61得点"]
        - ["スチュアート・ピアース", "401試合63得点"]
    say:
      - 名前を挙げるなら、この3人です。
      - "ボブ・マッキンレー。1951年から1969年。リーグ**614試合**で、クラブ最多出場です。"
      - "1959年のFAカップ優勝メンバーで、1959年から1965年にかけては**265試合**続けて出ています。"
      - ジョン・ロバートソン。1970年から1983年。リーグ386試合で61得点。
      - "1979年のヨーロッパカップ決勝では、トレヴァー・フランシスの決勝点を**アシスト**しました。"
      - "そして翌年の決勝では、**自分で決勝点**を決めています。"
      - スチュアート・ピアース。1985年から1997年、401試合63得点。
      - "「**サイコ**」と呼ばれた長年の主将です。イングランド代表78試合のうち76試合はこのクラブでの出場で、クラブ最多になります。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Bob_McKinlay
      - https://en.wikipedia.org/wiki/John_Robertson_(footballer,_born_1953)
      - https://en.wikipedia.org/wiki/Stuart_Pearce
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 2005年に下部組織へ入った、生え抜きの主将
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
