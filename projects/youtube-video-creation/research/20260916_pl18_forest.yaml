# プレミアリーグ20クラブ紹介 ⑱ノッティンガム・フォレスト（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「2部から上がった翌年に優勝し、その次はヨーロッパを連覇した」**。
# ここが山場（@main）。サッカー史でほかに例のない上がり方
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では18番目」の1行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替え（説明は後ろへ）。
# ③優勝の節は「数えると10個」をやめ、「欧州で獲った数が自国リーグより多い」から入る
#
# 2026-09-18 追記。①タイトルとサムネを、20本で同じ文面からクラブごとの引きに変えた。
# ②宿敵の節（イースト・ミッドランズ・ダービー。相手は今季のプレミアにいない）と
# 「このクラブを語る選手」の節を足した。③theme.hook を1行入れた
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 4節22行 → 2節11行にした。**「そして落ちた」と「23年ぶりに戻ってきた」は節として
# 落とし、2行に縮めて山場の節へまとめた。**落としたできごとは「2回以上ヨーロッパを
# 獲ったイングランドのクラブは6つ」「無敗記録の前の記録はバーンリーの35試合」
# 「シティ・グラウンドの拡張計画（2031年・2033年）」の3つ
format: news
