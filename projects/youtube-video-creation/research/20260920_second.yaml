  - id: down
    heading: クラブごと落ちた2人
    tier: 報道
    telop: ボーウェンとヒメネスは、残ることを選んだ
    narrator: 解説
    say:
      - ボーウェンとヒメネスは、自分で2部を選んでいます。
      - ボーウェンは昨季、主将として全試合に出て9得点11アシスト。そのウェストハムが降格しました。
      - 他のクラブからも誘いがありましたが、残ることを決めています。
      - {voice: ボーウェン, text: このクラブをプレミアリーグに復帰させることだ}
      - {voice: ボーウェン, text: これは必ず実現する。もし実現しなかったら、1年後に再検討すればいい}
      - ヒメネスは契約が切れて自由の身になったあと、かつていたウルヴァーハンプトンに戻りました。
      - {voice: ヒメネス, text: 古巣を1部に戻したい。子供が生まれ育った場所だから}
      - {voice: ヒメネス, text: 僕たちの物語は最良の形では終わらなかった。ウルブスと僕の双方にとって、それを正す時だと思った}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/20/post1014729/

  - id: fall
    heading: 行き場がなくなった3人
    tier: 報道
    telop: モラタ、ファン・デ・ベーク、そしてバロテッリ
    narrator: キャスター
    say:
      - モラタはミラン、ガラタサライ、コモと渡り歩いて結果が出ず、自分を評価してくれるレガネスを選びました。
      - ファン・デ・ベークは、アヤックスでの活躍がそのままキャリアの頂点になりました。
      - マンチェスター・ユナイテッドでは1年目から期待に届かず、2度の期限付き移籍を経てイングランドを去っています。
      - "ジローナでも昨季は大きなけがでほぼ全休。今季も控えのままです。"
      - バロテッリがいるアル・イテファクは、2020年にできたばかりのクラブです。
      - 会長が同じイタリア人で、チームにはイタリア国籍の選手が他に3人います。
      - {voice: クラブ会長, text: すべては『Transfermarkt』で始まった。どのクラブとも契約していないフリーの選手を検索していて、バロテッリの名前を見つけた}
      - {voice: クラブ会長, text: すぐに彼の代理人との接触を開始した}
      - 今季の出場は、まだありません。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/20/post1014729/
