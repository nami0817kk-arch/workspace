  takeaway: マンチェスター・シティの本拠地、エティハド・スタジアムの収容は、今季の開幕時で6万1038人。プレミア20クラブで4番目に大きく、1位マンチェスター・ユナイテッド（7万4158人）とは1万3120席の差。もとは2002年のコモンウェルスゲームズのために、国のスポーツ機関とマンチェスター市の資金で建てた競技場で、2003年にシティが移った。転用工事4200万ポンドのうち、クラブの負担は2000万ポンド（48％）。席は2014〜15年の南側スタンドと、2026年5月24日に全面が開いた北側スタンドで増え、大会のときの3万8000席の1.6倍になった。昨季のホーム最終戦の前の17試合の平均入場は5万2282人、今季のここまで4試合の平均は6万635人で、収容の99.3％。総工費は1億1000万〜1億2000万ポンドと資料で割れる
