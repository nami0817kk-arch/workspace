      - - '42'
        - 百万ポンド
        - 合計（自分で足した）
      focus: 1
  - text: 合わせて、4200万ポンドの転用工事でした。
    image: assets/images/20261020_stadium_etihad/09_w.jpg
    card:
      type: stats
      title: 転用工事の費用（百万ポンド）
      items:
