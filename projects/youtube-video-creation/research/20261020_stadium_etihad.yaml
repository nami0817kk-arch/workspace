  say:
  - text: シティは、1923年から、旧本拠地メイン・ロードを使っていました。
    image: assets/images/20261020_stadium_etihad/09_w.jpg
    card: none
  - text: そこを離れ、市が建てた競技場を借りる。それが、移転の形でした。
    image: assets/images/20261020_stadium_etihad/09_w.jpg
    card: none
  - text: 大会が終わると、競技場は、サッカー用に作り替えられます。
    image: assets/images/20261020_stadium_etihad/05_w.jpg
    card: none
  - text: 陸上のトラックは外され、グラウンドは、掘り下げられました。
    image: assets/images/20261020_stadium_etihad/05_w.jpg
    card: none
  - text: 臨時の客席は撤去。北側に、固定のスタンドが建ちました。
    image: assets/images/20261020_stadium_etihad/08_w.jpg
    card: none
  - text: 工事は、ほぼ1年。大会のときより、約1万席多い、4万8000席に。
    image: assets/images/20261020_stadium_etihad/08_w.jpg
    card: none
  - text: 市の分は、2200万ポンド。トラック撤去や、芝と客席の工事です。
    image: assets/images/20261020_stadium_etihad/09_w.jpg
    card:
      type: stats
      title: 転用工事の費用（百万ポンド）
      items:
