# スタジアム紹介シリーズ：マンチェスター・シティの本拠地（エティハド、10/20）。雛形は 10/19 トッテナム回。
# 軸：A＝収容6万1038席はプレミア4位／B＝誰が建てたか（市とスポーツ・イングランドの資金で2002年コモンウェルスゲームズ用に建設→2003年にシティが入居→増築）。
# 収容：PL公式ハンドブック2026/27（6〜25ページ「Ground Capacity at start of the Season」）から20クラブを再抽出して検算（取得2026-10-19）。
#   74,158 / 62,850 / 61,276 / 61,038(シティ) / 60,704 / 52,769 / 52,729 / 48,095 / 40,044 / 37,633 / 36,887 / 32,609 / 32,176 / 31,212 / 30,294 / 28,107 / 25,194 / 24,983 / 17,250 / 12,357。合計822,365。シティは4位。
#   74,158-61,038=13,120／61,038-60,704=334／13,120-12,357=763／2019-20ハンドブック28ページ：シティ55,017。
# 入場（PL公式試合API）：昨季ホーム19試合中、入場の出ている18試合。最終戦(5/24 ヴィラ戦)以外17試合 合計888,802÷17=52,282.5、最多52,534。最終戦60,332（5/13パレス戦は入場がnull）。
#   今季ホーム4試合 60,645/60,765/60,312/60,817 平均60,634.75。差8,352。60,635÷61,038=99.3%。61,038-60,817=221。控え research/raw/20261020_etihad_city_matches_pl_api.json
# 自分で数えた：転用工事 市22＋クラブ20=42百万ポンド、20÷42=48%／61,038÷38,000=1.6倍／90-77=13。
# 割れる点（台本で「割れる」と言った）：総工費 1.10億(BBC2002・Wikipedia CWG)/1.12億(Wikipedia・Guardian2011)/1.20億(BBC2003)。スポーツ・イングランド負担 77百万(Wikipedia)/90百万(Guardian2011)。
#   いまの収容 クラブ「6万1000超」/61,038(公式)/61,474(Wikipedia)/約6万2000(Wikipedia)。北側の新席 クラブ7,000超/Wikipedia7,900。
#   言わなかった割れ：旧本拠地の収容 35,150(Wikipedia)対32,000(Guardian)、賃料の式、命名契約の額、アラップ設計の担当者名。
# 確度：クラブ公式 mancity.com の北側スタンド命名記事（全面開場・7,000席超・401室ホテル）で読めたもの以外は Wikipedia・BBC・Guardian＝報道／背景。持ち主は市のまま＝Wikipedia現在の記述（「とされます」）。
# 重なりを避けた：オールド・トラッフォード回のメイン・ロード1948年8万3260、アンフィールド回の平均4万1118席・1.5倍・238席・572席・ブライトン、トッテナム回の北ロンドン53%・次の相手の倍率。
# 読めなかった：mancity.comの建設史ページ、Arup公式ページ、manchester.gov.uk（市の資料はGuardianが引く市の発言・賃貸条件で代替）、archive.org(429)。ブラウザ操作・JS実行は不使用。
