        - クラブの負担（バー・貴賓室など）
      - - '42'
        - 百万ポンド
        - 合計（自分で足した）
      focus: 2
  - text: クラブの負担は、転用費用の48％にあたります。
    emph: true
    image: assets/images/20261020_stadium_etihad/05_w.jpg
