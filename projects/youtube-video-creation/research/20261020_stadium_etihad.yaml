      - - '42'
        - 百万ポンド
        - 合計（自分で足した）
      focus: 0
  - text: クラブの分は、2000万ポンド。バーやレストラン、貴賓席の整備です。
    image: assets/images/20261020_stadium_etihad/09_w.jpg
    card:
      type: stats
      title: 転用工事の費用（百万ポンド）
      items:
      - - '22'
        - 百万ポンド
