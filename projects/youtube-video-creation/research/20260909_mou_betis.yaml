sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 敵地で0対1、今季初黒星
    narrator: キャスター
    say:
      - 9月4日、ラ・リーガ第4節。レアル・マドリードは敵地でベティスと戦いました。
      - 開幕から3連勝。モウリーニョ監督のチームは、ここまで無敗でした。
      - しかし試合終盤に先制を許し、1点を追う展開になります。
      - 後半アディショナルタイム、レアルにPKが与えられました。
      - キッカーはキリアン・エムバペ。しかし相手GKアルバロ・バジェスに止められます。
      - 0対1。今季初めての黒星でした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007364/
      - https://web.ultra-soccer.jp/news/all/35253/

  - id: said
    heading: 会見で何を言ったか
    tier: 報道
    telop: 「見事に大当たりを引き当てた」
    narrator: 解説
    say:
      - 試合のあと、モウリーニョ監督の舌がよく回りました。スペイン紙『アス』が伝えています。
      - {voice: モウリーニョ, text: ベティスにおめでとうと言いたい}
      - {voice: モウリーニョ, text: 彼らは引き分け狙いで戦った}
      - {voice: モウリーニョ, text: そして見事に「大当たり」を引き当てたのだからね}
      - {voice: モウリーニョ, text: 引き分けに終わっていても悔しさは残っただろう}
      - {voice: モウリーニョ, text: ましてや負けとなれば、どんな気分かは想像がつくはずだ}
      - そして、相手の選手たちにも矛先を向けます。
      - {voice: モウリーニョ, text: 私のベンチの目の前で「死んだ」かのように}
      - {voice: モウリーニョ, text: 振る舞っていたあの選手だが}
      - {voice: モウリーニョ, text: 救急車が来るのかと思ったが、結局救急車は来なかったね}
      - 大げさに倒れてファウルを主張したことへの、小言でした。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35253/
      - https://www.soccer-king.jp/news/world/esp/20260905/2200990.html

  - id: defend
    heading: 味方には矛先を向けなかった
    tier: 報道
    telop: PKを外したエムバペを庇う
    narrator: 解説
    say:
      - この日は判定も物議を醸していました。カルロス・エスピのゴールが取り消され、そのあとPKが与えられています。
      - それについては、こう言って踏み込みませんでした。
      - {voice: モウリーニョ, text: 詳しく見れていない}
      - 一方で、PKを外したエムバペについては違いました。
      - {voice: モウリーニョ, text: 私の考えでは、誰かがPKを蹴る時}
      - {voice: モウリーニョ, text: それはチーム全員で挑んでいることと同じなんだ}
      - {voice: モウリーニョ, text: 我々は常に運命を共にしているのだから}
      - 相手には皮肉を並べ、自分の選手は庇う。この夜の会見は、その形でした。
      - レアルはこのあと、8日のチャンピオンズリーグ初戦でインテルに勝っています。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35253/
      - https://web.ultra-soccer.jp/news/all/35631/
