# モウリーニョの試合後コメント（2026年9月9日）。ベティスの回の差し替え
# （2026-09-09 ユーザー「ベティスもダメ」）。
#
# **主役を入れ替えた。**前は「ベティスがエムバペ兄弟を連破」でクラブが主役だったが、
# チャンネル自身の数字（直近7日）は、伸びた5本すべてがレアル・バルサ・アーセナルで、
# 中堅クラブの回は伸びていない。Gemini も同じ見立てで、
# 効く型として「超有名監督・スターの極端な発言」を挙げた。
# **同じ試合でも、主役をモウリーニョとレアルに寄せる。**
#
# 今日15:46に出したモウリーニョの回は「対キヴのCL初戦」で、こちらは
# 4日前のラ・リーガ。別の試合・別の話
format: news
# 引用が主役の回
voice_min: 30
slot: world
date: "2026年9月9日"

short_title: "モウリーニョが負けた夜に言った救急車の話"

theme:
  id: mourinho_betis_presser
  league: spain
  kind: other
  topic: モウリーニョ
  title: モウリーニョ、今季初黒星の会見で「救急車は来なかったね」
  hook: 開幕から3連勝。その次の試合で、初めて負けました。
  question: 何にそこまで腹を立てていたのか

thumbnail:
  line1: レアル、今季初黒星
  line2: 会見で ●●● の話をした
  photo: "assets/photos/20260909_mourinho/01.jpg"
  tags: [モウリーニョ, レアル・マドリード]
  points:
    - 後半ATのPKを止められた
