#   ・ESPN 記事 50371706「PSG send UCL records tumbling with 6-goal thrashing of Villarreal」（content.core.api.espn.com 経由で本文を全部読んだ）
#       - 4点目（ファビアン・ルイス）で「CLの試合で4点に届いた最速」。それまではレアル・マドリーが2011年にディナモ・ザグレブ相手に20分で4点。
#       - 4点目で「CLの1シーズンの4試合目までの最多得点」18点にも並んだ（スロヴァン・ブラチスラヴァに6点、マンC・バルサに4点ずつ）。
#         「CL史上はじめて、4試合続けて4点以上を取ったチーム」。
#       - 78分のダビド・ボリー（17歳のDF）は、その4分前に途中出場したCLデビュー戦。
#       - ルイス・エンリケ監督（英語の訳は AP/ESPN）: "What stands out to me is the way we started of the match. After a quick 0-4 down, no team can recover from that. It's hard for an opponent to wake up and make a comeback."
#         "I don't particularly like these blowout scores because we always respect our opponent ..." / "the real competition starts in February or March" → 使うのは最初の3文だけ。
#       - 最初の3点はビジャレアルが後ろからつなぐ所・自陣で奪われたミスから。デンベレ・マルキーニョス・ヌーノ・メンデス（腿）とクヴァラ（前十字）が欠場。公式戦10連勝。
#   ・PSG 公式「Luis Enrique: “A sensational match”」（psg.fr、PSG TV の試合後の談話。監督・ファビアン・ルイス・ボリー・リュカの順）
#       監督: "It was a sensational match. ... But we started the game brilliantly. We pressed very well, won the ball back and scored three goals. I’m very pleased with the match I saw."
#       ボリー: "I got the ball from João Neves, moved in front of goal, took a shot and saw it go in. It was incredible!"
#   ・ESPN の試合データ（site.api.espn.com .../uefa.champions/summary?event=401915309）: ビジャレアル 0-6 PSG（エスタディオ・デ・ラ・セラミカ、20,036人）。
#       9分 ジョアン・ネヴェス（CKの流れ）、12分 ドゥエ（アシスト アクリウシェ）、13分 マユル、17分 ファビアン・ルイス（アシスト アクリウシェ）、50分 ファビアン・ルイス（アシスト ヴィティーニャ）、78分 ボリー（アシスト ジョアン・ネヴェス）。
#       74分 ボリーがハキミと交代で入った。ボール保持 PSG 70.6%、シュート PSG 22本（枠内12）・ビジャレアル 14本（枠内2）。
#   ・サッカーキング 2026-11-04（2224214）: 得点者と分は ESPN と一致。名前の表記（ジョアン・ネヴェス／デジレ・ドゥエ／セニー・マユル／ファビアン・ルイス／ダビド・ボリー）はここに合わせた。次節は25日、PSGはホームでローマ。
#   ・マルカの「子どものサッカーか」（交代の制限への不満）は本文を読めていない＆記録と別の話なので使わない。
# 食い違い: 得点の分・得点者は ESPN データとサッカーキングで一致。ESPN 記事は「最初の3点はビジャレアルのミスから」と書くが、ESPN データとサッカーキングでは1点目はCKの流れ。→ 台本は「2点目と3点目は相手陣地で奪ってから」とだけ言う（サッカーキング：12分はビルドアップに制限をかけてミスを誘発、13分はハキミの敵陣インターセプト）。監督の「3点」は監督の言葉のまま。
# 自分で数えたもの: 1点目（9分）から4点目（17分）までは8分。記録は20分→17分で3分短い。CL4試合の得点 6+4+4+4=18。枠内シュート 12本 対 2本。
