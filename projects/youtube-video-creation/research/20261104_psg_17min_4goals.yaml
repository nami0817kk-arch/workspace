# 写真: PSG 公式の試合のスライドショー（diaporama、クラブのカメラマン）から5枚。01 ファビアン・ルイス（POTM の盾）、02 ファビアン・ルイス（背番号8）、03 ファビアン・ルイスを囲む選手（背中の名前で確認）、04 ネヴェス（87）ともう1人（縦切りはもう1人の方なので使わない）、05 ドゥエ（14）。代理店ではない。ESPN の主写真は誰か特定できず外した。
