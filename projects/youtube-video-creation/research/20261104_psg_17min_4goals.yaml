# 取材メモ（2026年11月4日）PSG、ビジャレアルに6-0。開始17分で4点、CLで4点に届いた最速の記録（ニュースのショート。見せ方 Y＝ルイス・エンリケ監督の言葉から始める）
# 取材: 2026-11-04。WebFetch は使わず、python requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない（記事を探すのに Google ニュースの RSS の見出し一覧だけ使った）。
