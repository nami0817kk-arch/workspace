title: 9月24日の題材
lead: 候補534件＋ロマーノのXから36件（25番から下が3巡目）
note: |
  <b>代表ウィークです。</b>9月23日に欧州7リーグの試合はありませんでした（試合結果の枠は空けます）。
  そのぶん、代表の話と移籍まわりが厚い日です。<br>
  <b>投稿の枠について。</b>今日と明日はプレミア20クラブ紹介でショートが10本ずつ埋まっています
  （1日に配られるのは10本まで）。ここで選んだ回は、<b>本編は今日〜明日の空き時間、ショートは9月26日</b>に
  回すのがよいと考えています。<br>
  <b>2巡目を足しました（13〜24）。</b>1巡目で○が2つ（⑥アギーレ・⑧クロップ）だったので、
  同じ筋（監督・新体制・クラブの経営）と、1巡目に無かった話を中心に探し直しています。<br>
  <b>3巡目（25〜36）。</b>ロマーノのXを読み直し（13時間で C・ロナウドの会見が20投稿）、
  スペイン・イタリア・ポルトガルの媒体からも拾いました。
