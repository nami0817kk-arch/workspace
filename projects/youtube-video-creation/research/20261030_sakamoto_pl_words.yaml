# 取材メモ（2026年10月30日）坂元達裕。「プレミアリーグではまだ何も成し遂げていません」。土曜はサンダーランド戦（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-10-30。requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。
# 題材の元: Football TRIBE 2026-10-29「坂元達裕、『プレミアリーグではまだ何も成し遂げていません』『自分の力を…』」(candidates[67]) 本文を全部読んだ。
#   Tribe は英国の Ealing Times の記事（「坂元達裕、世界最高のリーグでコベントリーに貢献することを目指す」）を日本語で伝えたもの。
#   Ealing Times の原文は探したが見つからなかった（サイト内検索・検索で出ず）。→ 言葉は「Tribe が伝えた日本語」。台本と画面の札で「現地メディアが伝えた談話の日本語訳」と断る。いつ話したかは Tribe に日付が無い（フラム戦の前後かは不明）→ 言わない。
# 出典で確かめたこと:
#   ・Tribe 本文: 第8節までで4試合に出場。開幕からの5試合では4試合で出場機会なし。ニューカッスル・トッテナム・フラムの直近3試合でプレー、トッテナム戦とフラム戦は先発。
#     本人の言葉（Tribe の訳）「チャンピオンシップでは多くのことを成し遂げましたが、プレミアリーグではまだ何も成し遂げていません。サポーターに自分の力を示さなければなりません」。
#     （地の文の要約）出場時間を得る必要があると語り、自分の能力には自信があると強調／出場機会を待ちながら練習に懸命に取り組む考え／プレミアでのプレーが目標だった／ランパード監督は子どもの頃から知るレジェンドで、その指揮下でプレーできて嬉しい。
#       → 直接の言葉は上の1つだけ。ほかは「語ったと伝えられている」の地の文（引用符をつけない）。
#     コベントリーは19位（20位中）、残留圏と勝ち点1差。サンダーランド戦は Tribe は「11月1日」。
#   ・BBC 順位表（2026-10-28 11:30 更新）: 19位 コベントリー 8試合2勝0分6敗 勝ち点6 得失点-9（得点6・失点15）／20位 サンダーランド 8試合1勝2分5敗 勝ち点5／18位 フォレスト 勝ち点6／17位 パレス 勝ち点7。
#       → 残留圏（17位）の勝ち点7まで1点。Tribe の「勝ち点1差」と一致。
#   ・BBC コベントリーの日程: 土曜10月31日 15:00（現地）プレミアリーグ コベントリー対サンダーランド。10月25日に夏時間が終わっているので現地15:00は日本時間で11月1日の午前0時。→ Tribe の「11月1日」と矛盾しない。台本は「現地は土曜、日本時間では日曜の午前0時」。
#   ・ESPN の試合データ（site.api.espn.com summary 401879255、24日フラム戦）: コベントリー0-1フラム。坂元は先発（右サイド）、86分にハマーと交代。フラムの得点は80分ボッブ。
#     食い違い: サッカーキング見出しは「85分までプレー」、FOOTBALL ZONE は「後半41分（＝86分）」、ESPN は86分交代。→ 台本は「85分を過ぎるまで」とぼかし、分数の足し算（164分）はやめた。
#   ・トッテナム戦（19日、コベ1-3）: 坂元は初先発、78分にハマーと交代（scripts/20261020_sakamoto_first_start、同じ ESPN データを確認済み）。
# 自分で数えたもの: 先発2試合とも80分前後（78分、85〜86分）まで出場。コベントリーはその2試合とも敗戦（1-3、0-1）。
#   ニューカッスル戦（12日、4-1勝ち）は途中出場（後半16分から＝61分、scripts/20261019）。
#   → 見立て: サンダーランドが勝ち点5の最下位で、コベントリーが勝てば勝ち点9（今の17位パレスの7を超える。パレスも試合をするので順位は動く）。引き分けなら勝ち点7（同点）。
# 前の本との重なり: scripts/20261019_sakamoto_lampard_words（ランパード監督の言葉・出番2試合）／scripts/20261020_sakamoto_first_start（トッテナム戦の初先発・前半のクロスとシュート）／scripts/20261028_stadium_coventry。
#   → 監督の言葉・前半のプレー内容は繰り返さない。今回の初出: 本人の言葉・フラム戦の先発・順位とサンダーランド戦。トッテナム戦は「初先発」と一言だけ。
# 本人の言葉: 上の1つ（訳）。本人の他の直接の言葉は無い。
# 反応: 0件（作らない。approve は --no-voices）。
