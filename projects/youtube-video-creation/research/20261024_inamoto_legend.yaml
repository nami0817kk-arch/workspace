# 稲本潤一（元日本代表MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-24。型は 10/23 の小野伸二と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は 日本語/英語版 Wikipedia の成績表・2002年W杯とインタートトカップの Wikipedia 試合記録・サッカーキング・南葛SC/川崎フロンターレ公式と、自分で足した値だけ。
# **私生活（家族・結婚）は入れない。女子サッカーは入れない。病気・法的な問題は入れない**。大けがは「大けがで全治8か月」の1行だけ（部位の詳細は入れない）。
#
# **引退の確認（一次情報）**：南葛SC公式（nankatsu-sc.com/56979、2024-12-04）が「2024シーズン限りで現役を引退」と掲載。サッカーキング（2024-12-04）は会見の本人の発言を掲載（台本はその2文を原文のまま引く）。→ **現役ではない**。
#   サッカーキング 1961372：「日韓ワールドカップに出場した日本代表選手の中で唯一現役生活を続けていた」「23名全員がピッチに別れ」。台本はこれを「最後まで現役を続けた」と言う。
# **いまの立場**：川崎フロンターレ公式（2026-01-10）が「稲本潤一U-18コーチ『Frontale Relations Organizer（FRO）』就任」を発表（契約 2026-02-01〜2027-01-31）。2025年は同クラブのU-18コーチ。台本は「いまは川崎で働いています」と表の「2026年1月発表」にとどめる。
# **日本との接点**：全体が日本代表・W杯の話（2002年日韓4試合2得点、2006年2試合、2010年2試合）。
# **日本との接点（ヒットの条件）**：W杯・日本代表そのもの。
#
# **数字の出どころ・食い違いと台本での扱い**
# - **リーグ戦の通算 447試合26得点**：日本語 Wikipedia の個人成績表。ガンバ118/16・アーセナル0/0・フラム41/4・WBA 28/0（PL 25＋2部3）・カーディフ14/0・ガラタサライ25/0・フランクフルト43/0・レンヌ5/0・川崎99/3・札幌47/1・相模原19/1・南葛8/1 を自分で足して 447/26 に一致。
#   **英語版 Wikipedia は 441/25**（南葛が2試合0得点、日本語版は8試合1得点）。日本語版は年別の表があり、南葛 2023年の1得点とも合うので日本語版を採る。**南葛の公式記録は未確認**。
#   英国4クラブ 83/4（フラム41＋WBA28＋カーディフ14＋アーセナル0）、トルコ・独・仏 73/0、海外計 156（447の約35%＝自分で割った 34.9%）、国内 291/22。プレミアリーグ通算は日本語版の合計行で 66試合4得点（フラム41＋WBA 25）。
# - **日本代表 82試合5得点・3アシスト**：サッカーキング（2024-12-04）と日本語・英語 Wikipedia が一致。年別（日本語版）2000=14・2001=11・2002=10・2003=10・2004=6・2005=10・2006=4・2007=3・2008=2・2009=4・2010=8 の合計 82 を自分で確認。
#   **W杯 8試合**＝日本語版の試合一覧から 2002年4（ベルギー・ロシア・チュニジア・トルコ）・2006年2（クロアチア・ブラジル）・2010年2（カメルーン・デンマーク）。2得点は2002年のみ（ゴール一覧5点のうち）。W杯以外 74試合3得点（2001ユーゴ・2003ウルグアイ・2009ガーナ）。
# - **2002年W杯**（英語 Wikipedia の試合記録）：6/4 日本2-2ベルギー（ヴィルモッツ57分→鈴木隆行59分→稲本67分→ファン・デル・ヘイデン75分）。6/9 日本1-0ロシア（稲本51分、85分に交代）。6/14 日本2-0チュニジア。6/18 日本0-1トルコ（ベスト16）。
#   日本語 Wikipedia：「日本のW杯初勝ち点」「W杯初勝利」。1998年は3戦全敗（英語 Wikipedia「Japan at the FIFA World Cup」）。**FIFA 公式の記録は未読**。
# - **2002年のバロンドール候補**：英語 Wikipedia「2002 Ballon d'Or」のノミネート一覧に Inamoto（Arsenal, Fulham）。日本語版の「日本人2人目」は確かめられなかったので言わない。
# - **インタートトカップ決勝**（英語 Wikipedia「2002 UEFA Intertoto Cup」）：1戦目 8/13 ボローニャ2-2フラム（稲本63分、レグウィンスキ87分）、2戦目 8/27 フラム3-1ボローニャ（稲本12・47・50分）。合計5-3。**フラムの5得点のうち稲本4つ**は自分で数えた。BBC の記事は接続できず未読。「クラブ初の欧州タイトル」は BBC 見出し「Fulham clinch Euro glory」と既存のフラム紹介台本に合わせる。
# - **Jリーグ最年少デビュー**：日本語 Wikipedia「当時最年少の17歳6か月で初出場、17歳7か月で初得点」（1997-04-12 平塚戦、04-19 清水戦＝1週間後）。出典は Wikipedia のみで **Jリーグ公式は未確認**。
# - **476日**：日本語 Wikipedia（スポーツ報知引用）。2016-06-04 負傷→2017-09-23 復帰＝自分で数えて476日。「全治8か月」はサッカーキング 2016-06-06 見出し（本文は未読）。
# - **J3最年長得点**：日本語 Wikipedia（ゲキサカ 2019-06-15 引用）。2019-06-15 は 39歳8か月28日（1979-09-18 生まれから自分で数えて一致）。相手 ガンバ大阪U-23。
# - **本人の言葉**：サッカーキング（2024-12-04、1961364）の会見記事から2文を原文のまま。続く2文（「試合に出て…決断しました」）は台本に入れない。
# - 高橋陽一さんは「キャプテン翼の原作者で南葛SCのオーナー兼代表取締役社長」（同記事）。
#
# **入れなかったもの**：私生活（結婚・家族）、CM・応援歌、フラム放出の経緯（骨折と契約の詳細）、ガラタサライのCLの数字（表の列が読み切れなかった）、アーセナルのFA杯優勝（出場の記録が確かめられない）、W杯の個別の失点場面。
# **日本語名・読みで怪しいもの**：稲本潤一・堺・湧水・南葛・相模原・ウェスト・ブロム・カーディフ・ガラタサライ・フランクフルト・レンヌ・ボローニャ・インタートト・鈴木隆行・高橋陽一・リレーションズ・オーガナイザー。
