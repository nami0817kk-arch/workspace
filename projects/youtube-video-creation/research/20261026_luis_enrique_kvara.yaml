    say:
      - text: クヴァラことクヴァラツヘリアが、前十字じん帯で今季絶望。
        image: assets/images/20261026_luis_enrique_kvara/02_w.jpg
      - text: パリ・サンジェルマンのエンリケ監督が、会見で話しました。
        image: assets/images/20261026_luis_enrique_kvara/02_w.jpg
      - voice: ルイス・エンリケ
        text: 残念だが、試合のあと、すでに重いケガだと疑っていた。
        image: assets/images/20261026_luis_enrique_kvara/01_w.jpg
      - voice: ルイス・エンリケ
        text: 10年、15年とトップでやりたいなら、ケガはする。
        cont: true
        image: assets/images/20261026_luis_enrique_kvara/01_w.jpg
      - voice: ルイス・エンリケ
        text: それが、プロのサッカー選手の人生だ。
        cont: true
        image: assets/images/20261026_luis_enrique_kvara/03_w.jpg
      - voice: ルイス・エンリケ
        text: クヴァラは、戦う男だ。
        image: assets/images/20261026_luis_enrique_kvara/03_w.jpg
      - voice: ルイス・エンリケ
        text: 彼はもっと強くなって戻ってくる。そこに疑いはない。
        short_voice: true
        image: assets/images/20261026_luis_enrique_kvara/03_hook.jpg
      - text: 24日、リヨン戦を前にした会見での言葉です。
        image: assets/images/20261026_luis_enrique_kvara/02_w.jpg
