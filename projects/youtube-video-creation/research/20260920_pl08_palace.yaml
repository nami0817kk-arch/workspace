    no_telop: true
  - image: assets/stats/pl_palace_mf_f.png
    text: ミッドフィールダーは6人。日本の鎌田大地がいます。ジェフェルソン・レルマはコロンビア代表で**70試合**。
    no_telop: true
  - image: assets/stats/pl_palace_fw_f.png
    text: フォワードは9人。イスマイラ・サールはセネガル代表で**88試合**。ジャン＝フィリップ・マテタはリーグ戦で**163試合**。
