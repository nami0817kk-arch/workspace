- id: data
  heading: クリスタル・パレス 基礎DATA
  main: true
  tier: 背景
  telop: 1905年創立
  narrator: 解説
  say:
  - short_only: true
    text: 冨安健洋と鎌田大地の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_palace_data0.png
    text: プロのクラブとしての創立は**1905年**。起源は1861年のアマチュアクラブです。
    no_telop: true
  - image: assets/stats/pl_palace_data1.png
    text: 愛称は「イーグルス」。鷲です。
    no_telop: true
  - image: assets/stats/pl_palace_map.png
    text: ホームタウンは南ロンドンの、クロイドン区セルハーストです。
    no_telop: true
  - image: assets/backgrounds/stadium_クリスタルパレス_in.png
    text: 本拠地はセルハースト・パーク。**2万5194人**が入ります。
  - image: assets/photos/pl/palace_owner_51aa6fad.jpg
    text: オーナーは、アメリカンフットボールのニューヨーク・ジェッツの会長、ウッディ・ジョンソン。2025年にクラブを買いました。
  - image: assets/stats/pl_palace_cups.png
    text: 1部リーグの優勝はありませんが、FAカップを1回、そしてカンファレンスリーグを1回獲っています。
    no_telop: true
  - image: assets/stats/pl_palace_data7.png
    text: その優勝が昨季です。決勝でスペインのラージョ・バジェカーノを1対0で破りました。
    no_telop: true
  - image: assets/stats/pl_palace_last.png
    text: 1部での最高位は、1990年から91年の**3位**。プレミアリーグができる前です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  bg: assets/backgrounds/stadium_クリスタルパレス.png
  official: false
- id: trophy
  heading: 120年待ったタイトル
  tier: 背景
  telop: 2025年のFAカップ。相手はマンチェスター・シティ
  narrator: 解説
  card:
    type: table
    title: FAカップ決勝の記録
    columns:
    - ''
    - ''
    rows:
    - - 1990年
      - 3-3のあと再試合で敗れる
    - - 2016年
      - 1-2で敗れる
    - - 2025年
      - 1-0。クラブ史上初のタイトル
  say:
  - はじめて大きなタイトルを獲ったのは、**2025年**のFAカップでした。
  - FAカップの決勝には、それまで2度立って、2度負けていました。
  - どちらもマンチェスター・ユナイテッドに負けました。1990年は引き分けのあとの再試合で0対1、2016年は1対2です。
  - 3度目の決勝、相手はマンチェスター・シティです。
  - エベレチ・エゼの1点を守り切り、1対0で勝ちました。
  - このタイトルで初めてヨーロッパに出て、翌シーズン、その大会も獲りました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  bg: assets/backgrounds/stadium_クリスタルパレス.png
- id: episode
  heading: 万博の会社が作ったクラブ
  tier: 背景
  telop: 「水晶宮」の会社が作った
  narrator: 解説
  card:
    type: table
    title: 万博の会社が作ったクラブ
    columns:
    - ''
    - ''
    rows:
    - - 名前の由来
      - 万博の建物「水晶宮」
    - - 1905年
      - 建物の会社がクラブを作る
    - - 最初のユニフォーム
      - ヴィラと同じえんじ色と青
  say:
  - クリスタル・パレスは、もともと「水晶宮」と呼ばれた万博の建物の名前です。
  - '**1905年**、その建物を持つ会社が、来場者を増やすために自分たちでプロのクラブを作りました。'
  - 会社が立ち上げを任せたのは、アストン・ヴィラの職員でした。だから最初のユニフォームは、ヴィラと同じえんじ色と青です。
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  bg: assets/backgrounds/stadium_クリスタルパレス.png
  official: false
