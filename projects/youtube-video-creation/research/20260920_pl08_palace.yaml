  narrator: 解説
  say:
  - image: assets/stats/pl_palace_data0.png
    text: プロのクラブとしての創立は**1905年**。起源は1861年のアマチュアクラブです。
    no_telop: true
  - image: assets/stats/pl_palace_data1.png
    text: 愛称は「イーグルス」。鷲です。
    no_telop: true
