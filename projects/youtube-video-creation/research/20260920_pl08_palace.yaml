  say:
  - short_only: true
    text: 冨安健洋の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_palace_data0.png
    text: 創立は**1905年**。本拠地は南ロンドンのセルハースト・パーク、2万5194人が入ります。
    no_telop: true
  - image: assets/stats/pl_palace_data3.png
    text: オーナーは、アメリカンフットボール、ニューヨーク・ジェッツの会長ウッディ・ジョンソン。2025年にクラブを買いました。
    no_telop: true
  - image: assets/stats/pl_palace_data.png
    text: 1部リーグの優勝はありませんが、FAカップを1回、そしてヨーロッパのタイトルを1回獲っています。
    no_telop: true
  - image: assets/stats/pl_palace_data.png
    text: そのヨーロッパのタイトルが、昨季のカンファレンスリーグ優勝です。
    no_telop: true
  - image: assets/stats/pl_palace_data7.png
    text: 当時の1部での最高位は、1990年から91年の**3位**です。
    no_telop: true
  - image: assets/stats/pl_palace_data8.png
    text: 愛称は「イーグルス」。鷲です。
    no_telop: true
  sources:
