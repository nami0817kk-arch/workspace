  say:
  - image: assets/images/pl_palace_story/scene.jpg
    text: はじめて大きなタイトルを獲ったのは、**2025年**のFAカップでした。
  - FAカップの決勝には、それまで2度立って、2度負けていました。
  - どちらもマンチェスター・ユナイテッドに負けました。
  - 1990年は引き分けのあとの再試合で0対1、2016年は1対2でした。
  - 3度目の決勝、相手はマンチェスター・シティです。
  - エベレチ・エゼの1点を守り切り、1対0で勝ちました。
  - このタイトルで初めてヨーロッパに出て、翌シーズン、その大会も獲りました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
