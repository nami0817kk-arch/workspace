  official: false
- id: drought
  heading: 56年待った
  tier: 背景
  telop: 2025年のリーグカップ。決勝でリヴァプールに2-1
  narrator: 解説
  card:
    type: table
    title: タイトルの記録
    columns:
    - ''
    - ''
    rows:
    - - リーグ優勝
      - 4回（うち3回は1904-1910年、最後は1927年）
    - - 1955年
      - FAカップ。国内のタイトルはここまで
    - - 1969年
      - フェアーズカップ優勝（合計6-2）
    - - 2021年10月7日
      - 持ち主が交代（それまでは14年）
    - - 2025年
      - リーグカップ優勝。56年ぶりのタイトル
  say:
  - text: リーグ優勝は、3回が**1904年から1910年**、最後が1927年です。
    image: assets/images/pl_newcastle_story/scene.jpg
  - FAカップは1955年が最後。国内のタイトルは、そこで止まりました。
  - ヨーロッパでは1969年のフェアーズカップ。のちのヨーロッパリーグにつながる大会です。
  - 決勝はハンガリーのウイペシュトに、2試合合計6対2で勝ちました。
  - ところが、そこから先が長かった。
  - 変わり目は2021年10月7日です。
  - いまのオーナーが、クラブを買い取った日です。オーナーが代わるのは14年ぶりでした。
  - そして2025年、リーグカップの決勝でリヴァプールを2対1で下します。
  - 1969年から数えて、**56年ぶり**のタイトルでした。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
  - https://en.wikipedia.org/wiki/Inter-Cities_Fairs_Cup
  bg: assets/backgrounds/stadium_ニューカッスル.png
