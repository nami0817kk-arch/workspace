- id: drought
  heading: 56年待った
  tier: 背景
  telop: 2025年のリーグカップ。決勝でリヴァプールに2-1
  narrator: 解説
  card:
    type: table
    title: タイトルの記録
    columns:
    - ''
    - ''
    rows:
    - - リーグ優勝
      - 4回（うち3回は1904-1910年）
    - - 1969年
      - フェアーズカップ優勝（合計6-2）
    - - 2021年10月7日
      - 持ち主が交代（それまでは14年）
    - - 2025年
      - リーグカップ優勝。1955年以来の国内タイトル
  say:
  - 2025年、ようやくリーグカップを獲ります。決勝でリヴァプールに2対1。
  - 国内の大きなタイトルとしては**1955年以来**、そして**56年ぶり**の歓喜でした。
  - このクラブは、長いあいだタイトルから遠ざかっていました。
  - リーグ優勝は4回ありますが、そのうち3回は**1904年から1910年**のことです。
  - ヨーロッパのタイトルは1969年のフェアーズカップ。ハンガリーのウイペシュトに2試合合計6対2でした。
  - そこから2025年までが、長い。
  - 変わり目は2021年10月7日です。サウジアラビアの公的投資基金を中心とする陣営が、マイク・アシュリーの14年に代わってクラブを取得しました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
  bg: assets/backgrounds/stadium_ニューカッスル.png
