- id: data
  heading: ニューカッスル 基礎DATA
  main: true
  tier: 背景
  telop: 1881年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_newcastle_data.png
    text: 創立は**1881年**。1892年に今の名前になりました。
  - image: assets/stats/pl_newcastle_data.png
    text: 本拠地はセント・ジェームズ・パーク。**5万2729人**が入ります。
  - image: assets/stats/pl_newcastle_data.png
    text: オーナーはサウジアラビアの公共投資基金。2021年からクラブを持っています。
  - image: assets/stats/pl_newcastle_data.png
    text: 1部リーグの優勝は**4回**。FAカップ6回、リーグカップ1回、ヨーロッパのタイトルが1回あります。
  - image: assets/stats/pl_newcastle_data.png
    text: 直近のタイトルは、2024年から25年のリーグカップです。
  - image: assets/stats/pl_newcastle_data.png
    text: プレミアでの最高位は2位。1995年から96年と、その翌年の2回です。
  sources:
  - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
  bg: assets/backgrounds/stadium_ニューカッスル.png
  official: false
