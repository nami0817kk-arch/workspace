  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_newcastle_data0.png
    text: 創立は**1881年**。1892年に今の名前になりました。
    no_telop: true
  - image: assets/backgrounds/stadium_ニューカッスル_in.png
    text: 本拠地はセント・ジェームズ・パーク。**5万2729人**が入ります。
  - image: assets/stats/pl_newcastle_map.png
    text: ホームタウンはニューカッスル・アポン・タイン。イングランド北東部です。
    no_telop: true
  - image: assets/photos/pl/newcastle_owner_d7f21670.jpg
    text: オーナーはサウジアラビアの公共投資基金。2021年からクラブを持っています。
  - image: assets/stats/pl_newcastle_cups.png
    text: 1部リーグの優勝は**4回**。FAカップ6回、リーグカップ1回、ヨーロッパのタイトルが1回あります。
    no_telop: true
  - image: assets/stats/pl_newcastle_data5.png
    text: 直近のタイトルは、2024年から25年のリーグカップです。
    no_telop: true
  - image: assets/stats/pl_newcastle_last.png
    text: プレミアでの最高位は2位。1995年から96年と、その翌年の2回です。
    no_telop: true
  - image: assets/stats/pl_newcastle_data8.png
    text: 愛称は「マグパイズ」。カササギです。白と黒の縞から来ています。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
