# 伊藤涼太郎のブラックバーン移籍が破談（2026年9月11日）。ユーザーからURLで指示
#
# **記事を2本開いて読んだ。**サッカーキング（11日12:40）が見送りの決断、
# フットボールチャンネル（11日7:04）が地元紙『Lancashire Telegraph』の
# 「まだ消滅していない」まで。**同じ日に話が2度動いている。**
#
# 引きは**「メディカルチェックで何が起きていたのか」**。破談そのものより、
# **合否ではなくリスクの提示だ**という仕組みのほうが中身がある。
#
# **足首の状態はこちらで診断しない。**「過去の足首の問題」と書かれた以上の
# ことは書かない。程度は不明だと記事も明記している。
#
# **引用が1件も無い。**モウブレイ監督が会見で疑問を示したとあるが、
# 発言そのものは載っていない。`voice_min` を 0 にしてある
#
# **反応は入れない。**読める形のスレが無かった
format: news
voice_min: 0
slot: japan
date: "2026年9月11日"

# ハッシュタグに使う人の名前
people:
  - 伊藤涼太郎
  - トニー・モウブレイ
  - 森下龍矢
  - 大橋祐紀

short_title: "伊藤涼太郎の移籍が消えた3日間"

theme:
  id: ito_blackburn
  league: england
  kind: transfer
  topic: ブラックバーン
  title: 伊藤涼太郎のブラックバーン移籍が破談。メディカルチェックで何が起きていたのか
  hook: 8日には、クラブの施設を訪れていました。
  question: メディカルチェックは、何を決めるものなのか

thumbnail:
  line1: 加入目前から一転
  line2: 止めたのは ●●●●●
  photo: "assets/photos/20260911_ito/01.jpg"
  tags: []
  points:
    - 8日に施設を訪問
    - 11日に見送りの決断

sections:
  - id: what
    heading: 3日間で何が起きたか
    tier: 報道
    telop: 加入目前から、見送りの決断へ
    narrator: キャスター
    card:
      type: table
      title: 3日間の動き
      columns: ["日", "何があったか"]
      rows:
        - ["8日", "ブラックバーンの施設を訪問。加入目前"]
        - ["10日午前", "関係者が可能性を「非常に低い」と説明"]
        - ["10日", "地元紙「まだ完全に消滅したわけではない」"]
        - ["11日", "クラブが見送りを決断"]
    say:
      - 伊藤涼太郎のブラックバーン移籍が、成立しないことになりました。
      - 8日にはクラブのトレーニング施設を訪れ、9日にも契約と伝えられていました。
      - ところがメディカルチェックで、過去の足首の問題が指摘されます。
      - 10日の午前、関係者は加入の可能性を「非常に低い」と説明。
      - トニー・モウブレイ監督も、会見で強い疑問を示していました。
      - それでも同じ10日、地元の報道は、交渉はまだ完全に消滅していないと伝えました。
      - そして11日、クラブが獲得を見送る決断をしました。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260910/2203490.html
      - https://www.footballchannel.jp/2026/09/11/post1008807/

  - id: medical
    heading: メディカルチェックは、何を決めるものなのか
    tier: 報道
    main: true
    telop: 「合格」「不合格」ではない
    narrator: 解説
    say:
      - ここで、地元紙が仕組みそのものを説明しています。
      - メディカルチェックは、単純な「合格」か「不合格」かではありません。
      - 医療スタッフが、その選手のリスクをクラブ側に提示するものです。
      - クラブはその情報をもとに、3つのうちどれを取るかを決めます。
      - 予定どおり契約するか。条件を再交渉するか。撤退するか。
      - ブラックバーンは10日の時点で、専門家の見解を待っていました。
      - 最終的に判断したのは、メディカル部門と、モウブレイ監督と、クラブの幹部です。
      - 足首の問題がどの程度のものかは、明らかにされていません。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/11/post1008807/
      - https://www.soccer-king.jp/news/world/eng/20260910/2203490.html

  - id: who
    heading: どんな選手だったのか
    tier: 報道
    telop: ベルギーで110試合19得点
    narrator: 解説
    card:
      type: bars
      title: 昨季のリーグ戦
      items:
        - {label: "出場", value: 35}
        - {label: "得点", value: 10}
        - {label: "アシスト", value: 5}
      unit: 試合・点
    say:
      - 28歳。浦和、水戸、大分を経て、アルビレックス新潟でブレイクしました。
      - 2023年にシント＝トロイデンへ移り、ベルギーで3シーズン。公式戦通算110試合で19得点です。
      - 昨季はリーグ戦35試合で10得点5アシスト。契約満了で退団し、いまはフリーの状態でした。
      - ブラックバーンには、森下龍矢と大橋祐紀の2人がいます。日本人が3人になるはずでした。
      - 大きなリスクは無いと見られていた移籍でした。
      - 新しい所属先を、また探すことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/11/post1008807/
      - https://www.soccer-king.jp/news/world/eng/20260910/2203490.html

  - id: voices
    heading: 見ている側は何と言っているか
    tier: 未確認
    telop: 8件の書き込みから
    narrator: 解説
    # **母数が8件しかない。**決まりでは読み上げる反応は10〜20件だが、
    # ユーザー判断で「少ないけどそれも乗っける」（2026-09-11）。
    # **数えた件数と母数をそのまま言う。**「多い」とは言わない。
    # 20字を超えるものは、途中で切らずに落とす（切ると意味が変わる）
    card:
      type: reactions
      title: ネットの反応（8件から）
      items:
        - {text: どこか手を出しそう, label: '>>916'}
        - {text: よっぽど重傷なんやな, label: '>>922'}
        - {text: 磐田いけ, label: '>>930'}
        - {text: 伊藤の怪我って5月の足首やって, label: '>>950'}
        - {text: うむ、そうらしい なんとも間が悪い, label: '>>954'}
    say:
      - ネット上に出ていた書き込みは、8件でした。数としては多くありません。
      - そのうち、短くそのまま読めるものを2件だけ引きます。
      - {voice: ネット民, text: 磐田いけ}
      - {voice: ネット民, text: うむ、そうらしい なんとも間が悪い}
    official: false
    sources:
      - https://sakarabo.blog.jp/archives/1084494140.html
