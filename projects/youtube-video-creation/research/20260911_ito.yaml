# 伊藤涼太郎のブラックバーン移籍が破談（2026年9月11日）。ユーザーからURLで指示
#
# **記事を2本開いて読んだ。**サッカーキング（11日12:40）が見送りの決断、
# フットボールチャンネル（11日7:04）が地元紙『Lancashire Telegraph』の
# 「まだ消滅していない」まで。**同じ日に話が2度動いている。**
#
# 引きは**「メディカルチェックで何が起きていたのか」**。破談そのものより、
# **合否ではなくリスクの提示だ**という仕組みのほうが中身がある。
#
# **足首の状態はこちらで診断しない。**「過去の足首の問題」と書かれた以上の
# ことは書かない。程度は不明だと記事も明記している。
#
# **引用が1件も無い。**モウブレイ監督が会見で疑問を示したとあるが、
# 発言そのものは載っていない。`voice_min` を 0 にしてある
#
# **反応は入れない。**読める形のスレが無かった
