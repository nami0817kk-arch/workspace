# **FotMob・DataMB は使っていない**。数字は Transfermarkt（2026-10-24 取得。控え: research/raw/20261024_olise_tm.json・20261024_palmer_tm.json）。
#   Transfermarkt 番号：オリーセ 566723・パーマー 568177。API（tmapi-alpha）を番号ごとに（プロフィール・市場価値の推移・季ごとの大会別成績）3秒あけて取得。
#   クロスチェック：英語版 Wikipedia の Career statistics（2026-10-24 取得。控え: research/raw/20261024_olise_wiki.txt・20261024_palmer_wiki.txt）。
#   **クラブの試合数・得点は Transfermarkt と Wikipedia が一致**：オリーセ（バイエルン）24/25 55試合20得点・25/26 52試合22得点・26/27 10試合9得点／
#   パーマー（チェルシー）24/25 52試合18得点・25/26 34試合11得点・26/27 9試合4得点（23/24 はチェルシー45試合25得点＋シティ序盤3試合2得点＝48試合27得点で一致）。
#   オリーセの 23/24 はクリスタル・パレス 19試合10得点で一致。アシストと出場時間は Transfermarkt だけ。代表の試合は混ぜない（クラブの試合だけ）。
# **選んだ理由**：直近の比べ（10/2エムバペ×ハーランド・10/9ベリンガム×ムシアラ・10/14バレバ×カマラ・10/16エムバペ×ヴィニシウス・10/17ペドリ×ヴィティーニャ・10/19バイエルン×ドルトムント・10/21ライス×ネヴェス・10/22ヤマル×サカ・10/23ヴィルツ×ロジャーズ・ランキング）に
#   オリーセ・パーマーの組み合わせは無い（posted.json・scripts/*compare*・covered.yaml を grep で確認。パーマーは比べに一度も出ていない）。オリーセは選手紹介（10/3）、パーマーは契約延長のニュース（10/11）が別にあるだけ。
#   オリーセは players_202610 の3位（市場価値 TM 最新 1.8億）、パーマーは1.1億。どちらも24歳（2001-12-12生・2002-05-06生＝5か月違い）の**左利き**で、ともに右側から攻める攻撃の選手。
#   **この回の軸**（10/23 の「市場価値が入れ替わった日」と重ねない）：昨季の「点に絡んだ数」53と14を、**出場時間の差と90分あたりの差に分ける**。①昨季の全公式戦 ②各リーグ戦 ③出場時間をそろえた計算（増減の内訳）④季ごとの推移 ⑤年齢ごとの市場価値。
#   使っていない素材：移籍金・負傷・私生活・代表の数字・パーセンタイル・戦術（陣形）。日本との接点：確かめられた縁が無いので入れない。
# **スタッツの条件（足切り）**：クラブのトップチームの全公式戦（代表・育成年代は混ぜない）。
#   昨季25/26：オリーセ 52試合4015分／パーマー 34試合2443分（2人とも900分超）。リーグ戦：オリーセ（ブンデスリーガ）32試合2320分／パーマー（プレミア）26試合1965分。
#   今季26/27：オリーセ 10試合823分／パーマー 9試合756分（**450分は超えるが900分に届かない → 「いまの時点」と言う**）。
#   リーグ・大会が違う（バイエルン＝ブンデス・CL・DFBポカール・スーパーカップ／チェルシー＝プレミア・CL・FAカップ・リーグ杯）一言を入れる。
# **使った数と自分で割った値**（クラブの試合だけ。TM の大会別を足した。90分あたり＝(得点＋アシスト)×90÷出場分）
#   25/26 オリーセ＝L1 32試合2320分15得点21アシスト＋CL 13試合1082分5得点7アシスト＋DFBポカール 6試合523分2得点3アシスト＋スーパーカップ 1試合90分＝52試合・4015分・22得点・31アシスト（計53→53×90÷4015＝1.19）。約76分に1回＝4015÷53。
#   25/26 パーマー＝PL 26試合1965分10得点1アシスト＋CL 4試合277分1得点2アシスト＋FAカップ 3試合171分＋リーグ杯 1試合30分＝34試合・2443分・11得点・3アシスト（計14→14×90÷2443＝0.52）。約175分に1回＝2443÷14（174.5）。
#   リーグ戦 25/26：オリーセ 36×90÷2320＝1.40／パーマー 11×90÷1965＝0.50。
#   **出場時間をそろえた計算**：パーマーが 4015分出て率 0.516 のままなら 14×4015÷2443＝23.0（約23）。14→23 が出場時間の差（+9）、23→53 が90分あたりの差（+30）。差の合計 39。**仮の計算であって実際の数ではない**と台本で断る。
#   季ごと（得点＋アシスト90分あたり）：オリーセ 23/24 16×90÷1277＝1.13（パレス）・24/25 43×90÷3842＝1.01・25/26 1.19・26/27 14×90÷823＝1.53（10試合）／
#     パーマー 23/24 42×90÷3734＝1.01（チェルシー＋シティ序盤）・24/25 32×90÷4247＝0.68・25/26 0.52・26/27 7×90÷756＝0.83（9試合）。
# **市場価値**（Transfermarkt の推移。百万€。年齢ごとの最高値）：オリーセ 21歳50（2023-10-09）・22歳65（2024-10-09）・23歳130（2025-10-14）・24歳180（2026-10-02）／
#   パーマー 21歳55（2024-03-14）・22歳130（2024-12-16）・23歳120（2025-05-30）・24歳110（2026-10-07）。オリーセが初めてパーマーを上回ったのは 2025-10-14 の更新（130>120。2025-06-05 は100<120）。
# 日程（ESPN、2026-10-23 時点）：チェルシー対トッテナム（プレミア）2026-10-24 16:30 UTC＝日本時間25日 1:30。フライブルク対バイエルン（ブンデス）2026-10-25 16:30 UTC＝日本時間26日 1:30。
