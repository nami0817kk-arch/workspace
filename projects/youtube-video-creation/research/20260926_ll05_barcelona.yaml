  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
- id: history
  heading: スポーツ誌の広告から
  tier: 背景
  telop: 始まりは、スポーツ誌に出した広告
  narrator: 解説
  card:
    type: table
    title: 1899年の呼びかけ
    columns: &id001
    - ''
    - ''
    rows:
    - - 10月22日
      - ガンペルが広告を出す
    - - 11月29日
      - 集まった面々で創立
  say:
  - 始まりは、スポーツ誌に載った1本の広告でした。
  - '**1899年10月**、ガンペルは、この競技が好きな人は連絡を、と呼びかけます。'
  - text: '**11月29日**、集まった面々でクラブが生まれました。'
    card:
      type: table
      title: 1899年の呼びかけ
      columns: *id001
      rows:
      - - 最初の会長
        - スイス人のワルター・ヴィルト
  - 最初の会長は、その場でいちばん年上だったスイス人です。
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://es.wikipedia.org/wiki/F%C3%BAtbol_Club_Barcelona
  - https://en.wikipedia.org/wiki/Joan_Gamper
  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
- id: history2
  heading: クライフが来て
  tier: 背景
  telop: 1992年、初めてヨーロッパの頂点へ
  narrator: 解説
  card:
    type: table
    title: クライフとヨーロッパ
    columns: &id002
    - ''
    - ''
    rows:
    - - 1973年
      - 選手クライフ、世界最高額で加入
    - - 1988年
      - 監督として戻る
  say:
  - '**1973年**、オランダのヨハン・クライフが、当時の世界最高額で加わります。'
  - '**1988年**には監督として戻り、ドリームチームと呼ばれるチームを作りました。'
  - text: '**1992年**、延長の末、クーマンのフリーキックでサンプドリアに**1対0**の勝ち。'
    card:
      type: table
      title: クライフとヨーロッパ
      columns: *id002
      rows:
      - - 1992年
        - 初めて欧州王者に
  - 創立から90年以上、届かなかったヨーロッパの頂点でした。
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://en.wikipedia.org/wiki/1992_European_Cup_final
  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
- id: history3
  heading: 空けておいた胸
  tier: 背景
  telop: 胸にスポンサー名を入れなかった107年
  narrator: 解説
  card:
    type: table
    title: ユニフォームの胸
    columns: &id003
    - ''
    - ''
    rows:
    - - 2006年まで
      - 胸にスポンサー名なし
    - - 2006年
      - ユニセフ。クラブが寄付する側
  say:
  - スペインのクラブが胸にスポンサー名を入れ始めたのは、**1981年**。
  - それでもこのクラブは、胸を空けたままにしました。
  - text: '**2006年**、ついに入った名前は、国連の子どもの機関、ユニセフ。'
    card:
      type: table
      title: ユニフォームの胸
      columns: *id003
      rows:
      - - 2011年
        - 初めて、お金を受け取る広告
  - クラブは毎年**150万ユーロ**以上を寄付し、お金を受け取る広告は**2011年**からです。
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://es.wikipedia.org/wiki/F%C3%BAtbol_Club_Barcelona
  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 前から奪う。育てて使う。クラブ以上の存在
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 前から奪って点を取る
    - - 運営の型
      - ラ・マシアで育てる
    - - クラブの気質
      - 「クラブ以上の存在」
  say:
  - text: フリック監督のチームは、前から奪って点を取る。就任から**125試合**で**354得点**です。
    image: assets/photos/ll/barcelona/barcelona_manager_6a0f8bd9.jpg
  - 運営の型は、育てて使う。育成組織のラ・マシアには、**300人**を超える若手がいます。
  - 2010年のバロンドールは、最終候補の**3人**とも、ラ・マシアの出身でした。
  - 気質を表す合言葉は「クラブ以上の存在」。カタルーニャの誇りを背負ってきました。
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://www.fcbarcelona.com/en/football/first-team/news/4579409/flicks-barca-is-a-goal-machine
  - https://www.fcbarcelona.com/en/football/first-team/news/4578296/hansi-flick-were-focused-on-our-own-job
  - https://en.wikipedia.org/wiki/La_Masia
  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
- id: episode
  heading: ファンの呼び名は「お尻」
  tier: 背景
  telop: ファンの呼び名「クレ」は、お尻から
  narrator: 解説
  card:
    type: table
    title: 「クレ」の始まり
    columns:
    - ''
    - ''
    rows:
    - - 1909〜1922年
      - 最初の本拠地、インドゥストリア通り
    - - 満員の日
      - 塀の上に座って観戦
    - - 通りから見えたのは
      - ずらりと並んだお尻
  say:
  - text: ファンは「クレ」と呼ばれます。もとは、カタルーニャ語のお尻です。
    image: assets/images/ll_barcelona_episode/scene.jpg
  - 最初の競技場は満員になると、塀の上に座って見る人が並びました。
  - 通りから見えたのは、ずらりと並んだお尻。それが、そのまま呼び名になりました。
  sources:
  - https://en.wikipedia.org/wiki/Camp_de_la_Ind%C3%BAstria
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - https://es.wikipedia.org/wiki/F%C3%BAtbol_Club_Barcelona
  bg: assets/backgrounds/stadium_バルセロナ_in.png
  official: false
