- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 史上最高の出だしと、107年後の胸
  narrator: キャスター
  say:
  - text: 今季は公式戦**8戦8勝**。クラブの歴史で、いちばんの滑り出しです。
    image: assets/stats/ll_barcelona_data_r1.png
    no_telop: true
  - text: 率いるのは、ドイツのフリック監督。こう話しています。
    image: assets/stats/ll_barcelona_data_r2.png
    no_telop: true
  - voice: ハンジ・フリック
    text: 1年前とはレベルが違う。それでも、どの試合も0対0から始まる
    image: assets/stats/ll_barcelona_data_r2.png
  - text: そしてこのクラブが、107年後に胸へ入れたのはユニセフ。お金は、クラブが払う側でした。
    image: assets/stats/ll_barcelona_data_r3.png
    no_telop: true
  - image: assets/stats/ll_barcelona_data0.png
    text: 創立は**1899年**。スイスから来たジョアン・ガンペルが、仲間を集めました。
    no_telop: true
  - image: assets/stats/ll_barcelona_data1.png
    text: 愛称は「ブラウグラナ」。カタルーニャ語で、**青とえんじ**のことです。
    no_telop: true
  - image: assets/stats/ll_barcelona_data2.png
    text: ホームタウンはバルセロナ。地中海に面した、カタルーニャ州の州都。
    no_telop: true
  - image: assets/backgrounds/stadium_バルセロナ.png
    text: 本拠地はカンプ・ノウ。改修中で、いまは**6万2652人**。完成すれば**10万5000人**です。
  - image: assets/stats/ll_barcelona_data4.png
    text: 持ち主は**15万人**を超える会員。会長のラポルタは、**2026年3月**に再選されました。
    no_telop: true
  - image: assets/stats/ll_barcelona_cups.png
    text: 1部優勝は**29回**、国王杯は最多の**32回**。チャンピオンズリーグは**5回**。
    no_telop: true
  - image: assets/stats/ll_barcelona_data6.png
    text: 最多出場はリオネル・メッシの**778試合**。得点も、クラブ最多の**672**。
    no_telop: true
  - image: assets/stats/ll_barcelona_data7.png
    text: 直近のタイトルは昨シーズンのリーグ。クラシコの勝利で決めたのは、初めてでした。
    no_telop: true
  - image: assets/stats/ll_barcelona_data8.png
    text: 昨シーズンは**1位**で、勝ち点**94**。ホームのリーグ戦は、**19戦全勝**でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/FC_Barcelona
  - "https://en.wikipedia.org/wiki/2026–27_FC_Barcelona_season\r"
  - https://www.fcbarcelona.com/en/football/first-team/news/4578296/hansi-flick-were-focused-on-our-own-job
