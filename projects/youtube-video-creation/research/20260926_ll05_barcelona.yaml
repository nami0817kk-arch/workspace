  say:
  - text: シャビ・エルナンデスはカタルーニャの生まれ。**11歳**で育成組織に入った中盤です。
    image: assets/photos/ll/barcelona/barcelona_legend_a504da84.jpg
  - リーグ戦で**505試合58得点**。2009年と2015年の3冠で、中盤の中心にいました。
  - 2021年には監督で戻り、2023年にリーグを制覇。今はオランダ代表の監督です。
