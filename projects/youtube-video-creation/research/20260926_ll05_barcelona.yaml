    image: assets/photos/ll/barcelona/barcelona_legend_d3a59960.jpg
  - 2009年、チェルシーとの準決勝。試合終了間際の同点弾で、決勝へ進みました。
  - リーグ戦で**442試合35得点**。2018年に、日本のヴィッセル神戸へ渡りました。
  sources:
