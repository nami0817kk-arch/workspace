  say:
  - text: フランクフルトのプレーの色は、大胆な攻撃。クラブの役員は、新監督をそう評しました。
    image: assets/photos/bd/frankfurt/frankfurt_manager_b4762bfc.jpg
  - text: 運営の型は、会員が支える形です。
    card:
      type: table
      title: このクラブの特徴
      columns: *id002
      rows:
      - *id003
      - &id004
        - 運営の型
        - 会員が支える形
  - 会員は、2000年ごろの約**5000人**から、**15万5000人**以上に増えました。
  - text: 気質は、「気まぐれな歌姫」と呼ばれてきたこと。
    card:
      type: table
      title: このクラブの特徴
      columns: *id002
      rows:
      - *id003
      - *id004
      - - クラブの気質
        - 気まぐれな歌姫
  - 大きな相手に勝った後、思わぬ相手に負ける試合が、昔から多かったためです。
  sources:
  - https://en.wikipedia.org/wiki/Eintracht_Frankfurt
