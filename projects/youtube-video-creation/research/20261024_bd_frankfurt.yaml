  say:
  - text: 1959年、フランクフルトは決勝でオッフェンバッハに5対3。延長で初優勝。
    image: assets/backgrounds/stadium_フランクフルト.png
  - 翌年は、王者としてヨーロッパ杯へ。いまのチャンピオンズリーグにあたる大会です。
  - 準決勝は、レンジャーズ。ホームで6対1、敵地で6対3。合計12対4でした。
  - text: 決勝の相手は、4連覇中のレアル・マドリード。会場は、同じグラスゴーです。
    card:
      type: table
      title: 1959年から1960年
      columns: *id001
      rows:
      - - ヨーロッパ杯 決勝
        - レアル・マドリードに3対7
  - 先に点を取りながら、3対7で敗れました。観客は**12万7621人**でした。
  - 決勝の合計**10得点**は、いまもヨーロッパ杯決勝の最多です。
  sources:
  - https://museum.eintracht.de/chronik/1945-1963/
  - https://en.wikipedia.org/wiki/1960_European_Cup_final
  - https://en.wikipedia.org/wiki/Eintracht_Frankfurt
  bg: assets/backgrounds/stadium_フランクフルト_in.png
  official: false
- id: history3
  heading: ヨーロッパリーグの優勝2回は、どんな試合だったのか
  tier: 背景
  telop: 1980年はアウェーゴール差。2022年は13試合で7勝6分け0敗
  narrator: 解説
  say:
  - text: フランクフルトはヨーロッパリーグ優勝2回。1回目は、1980年のユーエファカップ。
    card: none
    image: assets/images/bd_frankfurt_uefa1980/scene.jpg
  - 決勝の相手はメンヒェングラートバッハ。合計3対3で、敵地での得点が多く優勝。
  - text: 2回目は、2022年。13試合で、7勝6引き分け。1度も負けていません。
    card:
      type: table
      title: ヨーロッパリーグの優勝2回
      columns:
      - ''
      - ''
      rows:
      - - 1980年 決勝
        - メンヒェングラートバッハに合計3対3
      - - 2022年 準々決勝
        - バルセロナに敵地で3対2
      - - 2022年 決勝
        - レンジャーズにPK戦で5対4
    image: assets/images/bd_frankfurt_camp/scene.jpg
  - 準々決勝は、冒頭のバルセロナ戦。敵地で3対2。ホームの1対1とあわせて突破。
  - text: 決勝は、セビリアでレンジャーズ。1対1のあと、PK戦を5対4で制しました。
    image: assets/images/bd_frankfurt_seville/scene.jpg
  - 鎌田大地が決め、ケビン・トラップが、ラムジーのPKを止めました。
  sources:
  - https://museum.eintracht.de/chronik/1963-1981/
  - https://museum.eintracht.de/chronik/2016-2024/
  - https://en.wikipedia.org/wiki/2021%E2%80%9322_Eintracht_Frankfurt_season
  - https://en.wikipedia.org/wiki/2021%E2%80%9322_UEFA_Europa_League
  bg: assets/backgrounds/stadium_フランクフルト_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 大胆な攻撃。会員が支える形。「気まぐれな歌姫」
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns: &id002
    - ''
    - ''
    rows:
