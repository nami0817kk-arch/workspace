  - https://klub.eintracht.de/news/strukturelle-einigkeit-25-jahre-eintracht-frankfurt-fussball-ag-169547/
  - https://museum.eintracht.de/chronik/1945-1963/
  bg: assets/backgrounds/stadium_フランクフルト_in.png
  official: false
