sections:
- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 堂安律と小杉啓太。ヒュッター監督が復帰。6節で11位、首位と勝ち点6差
  narrator: キャスター
  say:
  - text: 日本の堂安律と小杉啓太が、いま所属しています。
    image: assets/stats/bd_frankfurt_data_r1.png
    no_telop: true
  - text: 監督は、アディ・ヒュッター。2021年まで率いた古巣に、戻ってきました。
    image: assets/stats/bd_frankfurt_data_r2.png
    no_telop: true
  - text: 今季は6節を終えて、11位。首位バイエルンとは、勝ち点6差です。
    image: assets/stats/bd_frankfurt_data_r3.png
    no_telop: true
  - image: assets/stats/bd_frankfurt_data0.png
    text: 創立は**1899年**。前身のひとつ、ヴィクトリアが、3月8日にできました。
    no_telop: true
  - image: assets/stats/bd_frankfurt_data1.png
    text: 愛称は「アドラー」。鷲のことです。正式名は、アイントラハト・フランクフルト。
    no_telop: true
  - image: assets/stats/bd_frankfurt_map.png
    text: ホームタウンはフランクフルト。人口は約**76万人**。ドイツで5番目の大都市です。
    no_telop: true
  - image: assets/backgrounds/stadium_フランクフルト.png
    text: 本拠地はドイツ銀行パーク。収容は**6万100人**で、18クラブでは4番目です。
  - image: assets/stats/bd_frankfurt_data4.png
    text: オーナーは、会員のクラブ本体。株式会社の株の約**68%**を持っています。
    no_telop: true
  - image: assets/stats/bd_frankfurt_cups.png
    text: ドイツ王者は1959年の**1回**。ブンデスリーガは1963年開幕で、優勝は**0回**です。
    no_telop: true
  - image: assets/stats/bd_frankfurt_cups.png
    text: ドイツカップは**5回**。ヨーロッパリーグは、前身のカップを含めて**2回**。
    no_telop: true
  - image: assets/stats/bd_frankfurt_data6.png
    text: 最多出場は、チャーリー・ケルベル。ブンデスリーガの歴代最多、**602試合**です。
    no_telop: true
  - image: assets/stats/bd_frankfurt_data7.png
    text: 直近のタイトルは、**2022年**のヨーロッパリーグ。決勝は、PK戦で勝ちました。
    no_telop: true
  - image: assets/stats/bd_frankfurt_data8.png
    text: 昨季のリーグ戦は**8位**。勝ち点**44**で、首位バイエルンと**45**差です。
    no_telop: true
