    telop: リヨンがアンデルレヒトに2-1。中村が22分に2点目
    narrator: キャスター
    card:
      type: table
      title: 試合の流れ
      columns: ["", ""]
      rows:
        - ["8分", "ナルテイ（リヨン先制）"]
        - ["22分", "中村敬斗（2点目）"]
        - ["61分", "ツベトコビッチ（アンデルレヒト）"]
        - ["結果", "アンデルレヒト 1-2 リヨン（敵地）"]
    say:
      - リヨンがヨーロッパリーグの初戦で、ベルギーのアンデルレヒトに勝ちました。
      - 敵地です。スコアは1対2でした。
      - 先制は8分、ナルテイです。
      - そして22分に、2点目が入りました。
      - "決めたのは**中村敬斗**でした。"
      - アンデルレヒトは61分に1点を返しましたが、届きませんでした。
    official: false
