  - id: first
    heading: 加入してから2試合目だった
    main: true
    tier: 報道
    telop: 初先発、移籍後初ゴール、ELデビュー。すべてこの試合
    narrator: 解説
    card:
      type: table
      title: リヨンでの2試合
      columns: ["", ""]
      rows:
        - ["9月2日", "スタッド・ランスから加入が発表"]
        - ["9月13日", "パリFC戦。終盤15分の出場でデビュー"]
        - ["9月16日", "アンデルレヒト戦。初先発で初ゴール"]
        - ["契約", "2030年6月まで。背番号11"]
    say:
      - この日には、いくつも「初めて」が重なっていました。
      - 中村がリヨンに加入したのは、今年の9月2日でした。
      - フランス2部のスタッド・ランスからです。契約は2030年6月までです。
      - "最初の出場は9月13日、リーグ戦のパリFC戦。**終盤の15分**だけでした。"
      - "そして、この試合が**2試合目**です。"
      - "そこで**いきなり先発**し、そして**移籍後初ゴール**。"
      - "さらに、**ヨーロッパリーグでのデビュー戦**でもありました。"
      - そしてこの日、**リヨンの公式が中村をマン・オブ・ザ・マッチに選んでいます。**
      - 試合後、本人はこう話しました。
      - {voice: 中村敬斗, text: 自分が欲しいタイミングでパスが来るし、サッカーが楽しい}
      - 左サイドでボールを受け、中へ切れ込む。得意の形です。
      - そこから右足でシュート。これが相手のディフェンダーに当たり、ゴールへ吸い込まれました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012863/
      - https://web.gekisaka.jp/news/world/detail/?458114-458114-fl

  - id: career
    heading: ここまでの道のり
    tier: 背景
    telop: ガンバから、6つのクラブを経てリヨンへ
    narrator: キャスター
    card:
      type: table
      title: 中村敬斗の歩み
      columns: ["", ""]
      rows:
        - ["ガンバ大阪", "2018年にプロへ"]
        - ["トゥエンテ／シント＝トロイデン", "オランダ・ベルギーへ期限付き"]
        - ["LASKリンツ", "2021年8月に完全移籍"]
        - ["スタッド・ランス", "2023年から。公式戦97試合30得点"]
    say:
      - ここに来るまでの道のりは、短くありません。
      - 2018年にガンバ大阪でプロになりました。
      - そこからオランダのトゥエンテ、ベルギーのシント＝トロイデン、オーストリアのクラブへ。
      - いずれも期限付きです。
      - 2021年8月にLASKリンツへ完全移籍し、2023年にフランスのスタッド・ランスへ移りました。
      - "ランスでは公式戦**97試合で30得点**。"
      - そこからの、リヨンです。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458114-458114-fl
