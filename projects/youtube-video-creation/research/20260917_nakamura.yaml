# 中村敬斗、リヨンで初先発・初ゴール（2026-09-17）
#
# **この日の1本目に置く。**チャンネルの検索1位の選手（直近28日で44回。
# 2位の久保建英が21回）。そこへ「移籍後初ゴール」「初先発」「ELデビュー」と
# 初物が3つ重なっている。ここが山場（@main）。
#
# **経歴の訂正。**「ロイヤル・アントワープ」は誤り。正しくは**シント＝トロイデン**
# （ベルギー・期限付き）。取材で分かった。
#
# **フル出場は言い切らない。**footballchannel は見出しで「先発フル出場」だが、
# ゲキサカのメンバー表に交代の記載が無いだけ。**「先発した」までにとどめる。**
#
# **得点の形は媒体で違う。**footballchannel は「相手に当たってコースが変わった」、
# ゲキサカは「カットインから右足一閃」。**両方は言わない。**footballchannel を採る。
