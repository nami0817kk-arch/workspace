# 中田英寿（元日本代表）の紹介。シリーズ「レジェンドの紹介」（引退した過去の選手の掘り下げ）の試験2本目（2026-10-17 ユーザー決定）。
# 型は選手紹介の8節を引退した選手向けに変えたもの：①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（＋通算の表）
# ⑤「あの試合」を1つ深掘り（2001-05-06 ユヴェントス対ローマ）⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref 等は不使用**。パーセンタイル・レーダー・シュートマップは出さない。数字は基本の数と、自分で割った値だけ。
#
# **数字の出どころ（読んだもの）**
# - 日本語版 Wikipedia「中田英寿」（個人成績・日本代表成績・経歴・タイトル）、英語版 Wikipedia（infobox・クラブ別成績・代表成績）、
#   英語版 Wikipedia「2000–01 AS Roma season」（試合記録：ユヴェントス 2–2 ローマ、6 May 2001、デッレ・アルピ、Del Piero 4'・Zidane 6'／Nakata 79'・Montella 90+1'、観衆63,548）、
#   英語版「2000–01 Serie A」（最終：ローマ22勝9分3敗＝75、ユヴェントス21勝10分3敗＝73）、イタリア語版 Wikipedia「Serie A 2000-2001」（外国人枠の変更・La Repubblica 引用）。
# - JFA（日本サッカー協会）公式の「ワールドカップヒストリー」1998・2002・2006（試合結果・中田の記述。確定）。
# - 中田英寿 公式サイト「Hide's Mail」2006-07-03（Wayback Machine 2006-07-05 の保存。本人の引退の言葉の原文。出どころ：nakata.net）。
# - 文化庁の発表（令和2年8月4日。国立工芸館 名誉館長 就任。確定）。
# - Number Web 戸塚啓「あのユベントス戦の本当の価値」2020-05-06（試合の流れ・分・外国人枠）。
# - La Repubblica 2001-05-05「Extracomunitari, subito tutti in campo」（当時の報道。連邦裁判所が外国人枠を違法と判断）。
# - サッカーキング 2018-09-13 再録（CALCIO2002 2009年掲載。1998-09-13 デビュー戦）、フットボールチャンネル 2026-10-14（デビュー戦の詳報・ペルージャの今。報道）。
# - 朝日新聞 2018-06-08 稲垣康介「ヒデ、衝撃のセリエデビュー20年 元監督が明かす秘話」（カスタニェール・ルキーニの言葉）。
# - GOAL Italia 2024-01-22「Nakata, l'antidivo…」（カペッロの食事・ファルカンの質問）。サンスポ 2017-02-24（引退の真相。本人の言葉）。
# - Transfermarkt：検索1ページ＋「クラブ別の成績」1ページだけ。成績の表は空（1998年以前のデータ無し）で使えず、生年月日・身長・位置の一致を確認しただけ。
# - 取材はブラウザの道具・JavaScript実行を使っていない（requests のブラウザ User-Agent と pypdf のみ）。検索エンジンのAI要約は使っていない。
#
# **数字の食い違い・判断（台本での扱い）**
# - クラブの通算は **リーグ戦の数字**を使う（ja・en の infobox が一致：平塚85/16・ペルージャ48/12・ローマ30/5・パルマ67/5・ボローニャ17/2・フィオレンティーナ20/0・ボルトン21/1＝288/41）。
#   全大会の合計は ja（377試合52得点。インタートトカップ等は別枠）と en（約380試合53得点）で数試合ずれる。語りでは全大会の合計を言わない。
# - ペルージャ1年目の試合数：ja 33（リーグ）／en 本文 32。得点は10で一致。語りは「10得点」だけ言い、試合数は言わない。
# - ペルージャの移籍金：ja「470万ドル」／en「4 million USD」／朝日「約4億5千万円」。ローマ：ja「30ビリオンリラ（1600万ドル）＋アレニチェフ」／en「42 billion lire」／
#   朝日「約17億円」／FC「350万→2170万ユーロ（推定）」。**どれも公式な額ではなく食い違うので、語りでは金額を言わない。**
# - ローマ戦の交代の分：Number「60分」／GOAL「59分」。語りは「60分ごろ」。ゴールは79分（Number・en Wikipedia 一致）、同点弾は90+1分（Wikipedia）／Number「ロスタイムに入った直後」。
# - 外国人枠の変更：Number「登録制限が撤廃」／La Repubblica「連邦裁判所が第40条第7項を『根本的に違法』と判断。3人までの制限が消えた」。
# - 中田のゴールと同点弾：Wikipedia の記録では 90+1' は **モンテッラ**のゴール。中田の「1得点1アシスト」は Number の言い方で、公式記録のアシストではない。語りは「中田のシュートをモンテッラが押し込む」まで。
# - 日本代表：ja・en とも 77試合11得点（Aマッチ）。Transfermarkt は 79試合13得点（Cマッチ等を含むとみられる）。**77/11 を使う。**
# - 「日本人初のセリエA優勝メンバー」：日本語版 Wikipedia。三浦知良が先にセリエAでプレーしているので「日本人初のセリエA選手」とは言わない。
# - 引退の発表時刻：日本時間21時は早稲田大の論文（次原悦子談）の引用で、本人サイトの原文には時刻が無い。語りでは時刻を言わない。
# - 1995年の優勝：ja「アジアカップウィナーズカップ 1995-96」／en「1995 Asian Cup Winners' Cup」。決勝は 1995-12-27・81分（後半36分）で一致。
# - バロンドールの候補入り（1998・99・2001）は英語版のみ。語りでは使わない。
#
# **入れなかったもの**：移籍金・年俸・長者番付・私生活・日本酒以外の事業の細部・CM・ファッション・「サッカーは見ない」発言（2023）・JFA殿堂（掲額者一覧に名前が無く、言えない）・
#   Transfermarkt の数字・ボルトンでのマン・オブ・ザ・マッチ・世界選抜の試合・2005年のホワイトバンド。
# **日本語名・読みで怪しいもの**：中田英寿・韮崎・甲府・鼠径部・ベルマーレ平塚・ペルージャ・パルマ・ボローニャ・フィオレンティーナ・ボルトン・ユヴェントス・デル・ピエロ・ジダン・トッティ・
#   ファン・デル・サール・モンテッラ・カンデラ・カペッロ・カスタニェール・ルキーニ・ガウッチ・ファルカン・ジョホールバル・コッパ・イタリア・スクデット・グロインペイン・セリエC。
# 本人の言葉は：①公式サイト2006-07-03（原文のまま）②サンスポ2017-02-24（日本テレビの番組。原文のまま）③GOAL のファルカンへの答え（イタリア語の報道を自訳。原文は Mi dispiace, non so chi sia）。
