  say:
  - text: 中田英寿の武器の1つめは、判断力。ペルージャの元監督は、こう語ります。
    image: assets/images/20261018_nakata_legend/02_r.jpg
    card: none
  - voice: イラリオ・カスタニェール
    text: パスを受ける前に、すでに次の展開を考える判断力を持っていた。
  - text: 2つめは、体の強さ。クラブのマッサージ師は、こう言います。
    card: none
  - voice: レンツォ・ルキーニ
    text: フィジカルが強い選手だった。
  - voice: レンツォ・ルキーニ
    text: 自分の肉体をよくケアする選手だった。
    cont: true
    pause: 0.5
  - text: 任された位置は、クラブごとに違いました。ペルージャでは、攻撃の司令塔。
