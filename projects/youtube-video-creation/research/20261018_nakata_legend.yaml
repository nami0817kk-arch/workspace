  say:
  - text: 18歳の1995年、ベルマーレ平塚へ。8歳で始めた先に、プロがありました。
    image: assets/images/20261018_nakata_legend/01_w.jpg
    card: &career_card
      type: table
      title: 歩んできた道
      columns: [年, 所属, 出来事]
      rows: *career_rows
      source: Wikipedia・JFA・各報道
      highlight_row: 0
  - text: 1998年、初のワールドカップは3戦全敗。そのあと選んだのが、ペルージャです。
    card:
      <<: *career_card
      highlight_row: 1
  - text: 「通用しない」と書く報道もありました。9月13日、開幕戦の相手は王者ユヴェントス。
    card: none
  - text: 前半で0対3と、負けています。後半、中田が動きます。
    card:
      <<: *career_card
      highlight_row: 1
  - text: 52分に右足で1点。その7分後に、ボレーでもう1点。
    emph: true
    card:
      <<: *career_card
      highlight_row: 1
  - text: 試合は3対4で敗れても、主役は中田でした。1年目は10得点です。
    card: none
  - text: 2000年1月、ローマへ。そして2001年、セリエAの頂点に立ちます。
    card:
      <<: *career_card
      highlight_row: 2
  - text: パルマでは、2002年のコッパ・イタリアで優勝。ただ、体が悲鳴を上げます。
    card:
      <<: *career_card
      highlight_row: 3
  - text: 足の付け根の痛み、グロインペイン。ボルトンでも、苦しみは続きました。
    card:
      <<: *career_card
      highlight_row: 4
