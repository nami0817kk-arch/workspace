- id: secret
  heading: 数字の外にある、2つの話
  tier: 報道
  telop: 練習の生中継と、ファルカン
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &secret_rows
    - ['1998年', ペルージャの初練習を、生中継]
    - ['2000年1月', ローマで、ファルカンを聞かれる]
    source: 朝日新聞・GOAL
  say:
  - text: 1つ目は、ペルージャの初めての練習。マッサージ師が覚えています。
    image: assets/images/20261018_nakata_legend/01_r.jpg
    card: &secret_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *secret_rows
      source: 朝日新聞・GOAL
      highlight_row: 0
  - voice: レンツォ・ルキーニ
    text: 朝、練習場に着いたら、ピッチの真ん中に、トラックがあった。
  - voice: レンツォ・ルキーニ
    text: 中田の練習を生中継すると。前代未聞の出来事だった。
    cont: true
    pause: 0.5
  - text: 当時の監督は、のちに、こう振り返りました。
    card: none
  - voice: イラリオ・カスタニェール
    text: 結果的に、中田がイタリアで一番楽しかったのは
  - voice: イラリオ・カスタニェール
    text: ペルージャの時代だったのではないか。
    cont: true
    pause: 0.6
  - text: 2つ目は、ローマ。カペッロ監督は、食事の席で、細長いパンのかけらを並べます。
    card:
      <<: *secret_card
      highlight_row: 1
  - text: 「君は、ここでプレーするんだ」と、1つを指して言ったそうです。
    card: none
  - text: 入団の日、記者が聞きます。「ファルカンのような役割ですか」。
    card: none
  - text: ファルカンは、ローマの王様と呼ばれた名ボランチ。中田は、こう答えます。
    card: none
  - voice: 中田英寿
    text: すみません。誰だか、知りません。
    pause: 0.6
