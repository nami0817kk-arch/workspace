- id: after
  heading: 29歳の引退のあと、中田英寿は何をしているのか
  tier: 報道
  telop: 2006年7月3日、引退
  card:
    type: timeline
    title: 引退のあと
    rows:
    - ['2006年6月22日', ワールドカップ。ブラジルに1対4]
    - ['2006年7月3日', 公式サイトで引退を表明]
    - ['2007年12月', FIFA親善大使に就任]
    - ['2015年11月', 日本酒など日本文化を伝える会社を設立]
    - ['2020年10月', 国立工芸館の名誉館長に]
    focus: 1
    highlight_row: 0
  say:
  - text: 2006年6月22日。ワールドカップのブラジル戦は、1対4で敗れます。
    image: assets/images/20261018_nakata_legend/02_r.jpg
    card: &after_tl
      type: timeline
      title: 引退のあと
      rows:
      - ['2006年6月22日', ワールドカップ。ブラジルに1対4]
      - ['2006年7月3日', 公式サイトで引退を表明]
      - ['2007年12月', FIFA親善大使に就任]
      - ['2015年11月', 日本酒など日本文化を伝える会社を設立]
      - ['2020年10月', 国立工芸館の名誉館長に]
      focus: 1
      highlight_row: 0
  - text: 試合後、中田はセンターサークルで仰向けに。7月3日、決断を明かします。
    card:
      <<: *after_tl
      highlight_row: 1
  - voice: 中田英寿
    text: 半年ほど前からこのドイツワールドカップを最後に
    image: assets/images/20261018_nakata_legend/05_w.jpg
    card: none
  - voice: 中田英寿
    text: 約10年間過ごしたプロサッカー界から
    cont: true
  - voice: 中田英寿
    text: 引退しようと決めていた。
    cont: true
    pause: 0.5
  - text: では、その理由は。本人は、公式サイトにこう書いています。
    card: none
  - voice: 中田英寿
    text: 責任を負って戦うことの尊さに、大きな感動を覚えながらも
  - voice: 中田英寿
    text: 子供のころに持っていた
    cont: true
  - voice: 中田英寿
    text: ボールに対する瑞々しい感情は失われていった。
    cont: true
    pause: 0.6
  - voice: 中田英寿
    text: けれど、プロとして最後のゲームになった
  - voice: 中田英寿
    text: 6月22日のブラジル戦の後
    cont: true
  - voice: 中田英寿
    text: サッカーを愛して止まない自分が確かにいることが分かった。
    cont: true
    pause: 0.6
  - text: 引退後は、日本の文化を伝える活動へ。2020年、国立工芸館の名誉館長に。
    image: assets/images/20261018_nakata_legend/02_r.jpg
    card:
      <<: *after_tl
      highlight_row: 4
  - text: いま、中田英寿を見る理由があります。2026年10月、古巣ペルージャが動きました。
    card: none
  - text: 中田を迎えた会長ガウッチの長男が、新会長に就く見込みと報じられました。
    card: none
  - text: ペルージャはいま3部。それでも28年たった街は、「ナカタ」を語り継ぎます。
    card: none
