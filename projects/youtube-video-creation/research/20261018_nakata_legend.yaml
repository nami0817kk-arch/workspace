  say:
  - text: 日本人で初めて、セリエAの優勝メンバーになった男。
    image: assets/images/20261018_nakata_legend/02_w.jpg
    card: none
    callword: 日本人初のスクデット
  - text: その名は、中田英寿。ワールドカップは3大会連続。日本の10試合に、すべて出ました。
    card: &hook_stats
      type: stats
      title: 中田英寿 元日本代表（49歳）
      items:
      - ['3', 大会, ワールドカップに連続出場。10試合すべてに出場]
      - ['1', 回, セリエAの優勝。日本人で初めて]
      - ['29', 歳, 2006年7月、引退を発表]
      focus: 0
  - text: そして2006年。29歳で、突然、引退を表明します。会見は、ありませんでした。
    emph: true
    card:
      <<: *hook_stats
      focus: 2
  - text: 本人が公式サイトに残した言葉は、こうです。
    image: assets/images/20261018_nakata_legend/05_w.jpg
    card: none
  - voice: 中田英寿
    text: プロになって以来、『サッカー、好きですか？』と問われても
  - voice: 中田英寿
    text: 『好きだよ』とは素直に言えない自分がいた。
    cont: true
    pause: 0.6
  - text: 世界が見ていた日本人は、なぜ「好き」と言えなかったのか。
    card: none
