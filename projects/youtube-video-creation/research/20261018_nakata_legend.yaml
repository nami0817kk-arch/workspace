  - text: 中田はベンチ。当時は、EU圏外の外国人が3人まで。ローマには5人いました。
    card: none
  - text: ところが、この試合の直前。その制限が、裁判所の判断で消えます。
    card: none
  - text: 60分ごろ。カペッロ監督は、主将のトッティを下げます。
    emph: true
    card:
      <<: *match_tl
      highlight_row: 2
  - text: 入ったのは、中田英寿。大きな賭けでした。
    card:
      <<: *match_tl
      highlight_row: 2
  - text: 79分。中盤でボールを奪い、そのまま運んで、右足を振り抜く。
    card:
      <<: *match_tl
      highlight_row: 3
  - text: 名手ファン・デル・サールの手は届かず、ボールはゴール左上へ。
    card:
      <<: *match_tl
      highlight_row: 3
  - text: 日本語で、叫びます。「よっしゃあああ！」
    image: assets/images/20261018_nakata_legend/06.jpg
    callword: よっしゃあああ！
    card: none
  - text: ロスタイム。仲間のカンデラのパスを左で受け、低く鋭いシュート。
    card:
      <<: *match_tl
      highlight_row: 4
  - text: 弾いたボールを、モンテッラが押し込みます。2対2の引き分け。
    emph: true
    card:
      <<: *match_tl
      highlight_row: 4
  - text: ローマは、残り5試合を3勝2分け。18年ぶりの優勝、スクデットです。
    card: none
  - text: 最終の勝ち点は、ローマ75、ユヴェントス73。
    card: &match_calc
      type: table
      title: この引き分けがなければ（計算）
      columns: [チーム, 実際の最終勝ち点, 負けていたら]
      rows:
      - [ローマ, '75', '74']
      - [ユヴェントス, '73', '75']
      source: 試合記録から計算
      highlight_row: 0
  - text: もし、この試合に負けていたら。ほかが同じなら、74対75で逆転です。
    card:
      <<: *match_calc
      highlight_row: 1
    mark: {kind: circle, row: 1, col: 2}
  - text: あの1点は、日本でもイタリアでも語り継がれています。
    card: none
  quotes_from: []
  sources:
