- id: view
  heading: ペルージャの1年半と、その後の6年半を数えると
  tier: 背景
  viewpoint: true
  telop: 4試合に1点から、12試合に1点へ
  card:
    type: table
    title: ペルージャとローマ以降、リーグ戦の比べ
    columns: [項目, ペルージャ, ローマ以降]
    rows: &cmp_rows
    - ['在籍', '約1年半', '約6年半']
    - ['試合', '48', '155']
    - ['得点', '12', '13']
    - ['1点までの試合', '4.0', '約12']
    source: Wikipedia
  say:
  - text: 最後に、中田英寿のヨーロッパでの8年を、2つに分けて数えます。
    image: assets/images/20261018_nakata_legend/01_w.jpg
    card: none
  - text: ペルージャの1年半は、リーグ戦48試合で12得点。4試合に1点のペースです。
    emph: true
    card: &cmp_card
      type: table
      title: ペルージャとローマ以降、リーグ戦の比べ
      columns: [項目, ペルージャ, ローマ以降]
      rows: *cmp_rows
      source: Wikipedia
      highlight_row: 3
    mark: {kind: circle, row: 3, col: 1}
  - text: ローマからボルトンまでの6年半は、155試合で13得点。
    card:
      <<: *cmp_card
      highlight_row: 2
  - text: およそ12試合に1点。3倍のペースの違いです。
    card:
      <<: *cmp_card
      highlight_row: 3
  - text: 違うのは、点の数より、任された役割でした。点を取る人から、チームのために走る人へ。
    card: none
  - text: 素直になれなかった選手は、最後の笛のあとで、サッカーへの愛に気づきました。
    image: assets/images/20261018_nakata_legend/05_w.jpg
    card: none
