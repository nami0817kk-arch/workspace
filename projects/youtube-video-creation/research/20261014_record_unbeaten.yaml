  takeaway: アーセナルはプレミアリーグで49試合負けなかった。2003年5月7日から2004年10月16日までで、36勝13分け、敗戦0。2002-03季の最後の2試合、2003-04季の38試合（26勝12分け）、2004-05季の最初の9試合を足した数。止まったのは2004年10月24日、オールド・トラッフォードでマンチェスター・ユナイテッドに0対2で敗れた50試合目。73分にファン・ニステルローイがペナルティーキックで決め、90分+3にルーニーが2点目を取った。5つのリーグの最長の記録を並べると、セリエAのミランが58（1991年5月26日から1993年3月14日、39勝19分け）、ブンデスリーガのバイエルンが53（2012年11月3日から2014年3月29日、46勝7分け）、プレミアのアーセナルが49、ラ・リーガのバルセロナが43、リーグ・アンのパリ・サンジェルマンが36。アーセナルは3番目。無敗の中の引き分けの割合は、アーセナル26.5%（13÷49）、ミラン32.8%（19÷58）、バイエルン13.2%（7÷53）で、ミランはバイエルンの約2.5倍。3点制の勝ち点に直した1試合あたりは、バイエルン2.74、アーセナル2.47、ミラン2.34で、いちばん長いミランが勝ち点ではいちばん低い。2026年10月14日の時点でいま続いている無敗の最長はバイエルンの20試合（15勝5分け、2026年1月24日の敗戦のあと）。今季はまだ5試合を消化し、残りは29試合なので、全部負けなければ49に並ぶ。インテルは16試合で、残り32試合を足しても48で、49に届かない。
