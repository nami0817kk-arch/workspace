# 記録の解説：リーグ戦の連続無敗（10/14 水、シリーズ「記録の解説」、key: record_unbeaten、型は news）。
#   記録の種類の並び：得点（10/9）・出場（10/10）・連勝（10/11）・最年少（10/12）→ **連続無敗**。
#
# 軸は「**アーセナルの49試合無敗は、5大リーグの記録で3番目。いちばん長いミランは、勝ち点に直すといちばん低い**」。
#   主役は**アーセナルの49試合**（プレミアリーグ公式の記録頁：7 May 2003 - 24 October 2004）。
#   比べる相手は**ミランの58（セリエA）・バイエルンの53（ブンデスリーガ）**。バルセロナの43（ラ・リーガ）・
#   パリ・サンジェルマンの36（リーグ・アン）は表に1行ずつ入れるだけ。
#
# 10/11（連勝）の台本とは重ねないようにしたもの：
#   10/11 は ベンフィカ・マンC・インテルの**連勝**。今回の**インテルは「いま続いている無敗」として別の数字**（16試合）で出る。
#   10/12（最年少）は アーセナルのダウマン。**今回のアーセナルは2003-05の話で、ダウマンの名前は出さない**。
#   10/3〜10/4 のスペイン代表41試合無敗（代表）・10/9 のレヴァンドフスキ・メッシ・10/10 のロナウド等は出さない。
#   ★**同じ日（10/14）の他の取材メモにバイエルン（ケインの発言）・バルセロナ（連勝）・インテル（ブルッヘ戦）が入っている**。
#     今回は**クラブ紹介でも移籍でもなく記録の数字**だけで、選手名はアーセナルの2人（ファン・ニステルローイ・ルーニー）以外は出していない。
#     台本の重なりは preshow で見る。
#   covered.yaml に「22年待った王者アーセナル。無敗のチームが残したものとは」（2003-04 の無敗）があった。
#     今回は**優勝の話ではなく、リーグ戦の無敗の長さ**だけ。
#
# ★**自分で数えた所**（試合の一覧から1試合ずつ数えた。数が合うことを確かめた）:
#   アーセナル：ESPN のプレミアリーグ試合記録（日付ごとの scoreboard）で、直前の敗戦（2003-05-04 リーズ戦 2-3）の次の試合から
#     **2003-05-07 から 2004-10-16 までの49試合**を1つずつ照合した（Wikipedia の試合表の日付・相手・スコアと全部一致）。
#     **36勝13分け0敗・112得点35失点・無失点20試合**。2002-03季の最後の2試合（2勝）＋2003-04季の38試合（26勝12分け、73得点26失点）＋
#     2004-05季の最初の9試合（8勝1分け）＝2+38+9＝**49**。勝ち：2+26+8＝36、分け：0+12+1＝13。
#     止めた試合：**2004-10-24 オールド・トラッフォード マンチェスター・ユナイテッド 2-0 アーセナル**（ESPN の試合記録：73分ペナルティーキックで
#     ファン・ニステルローイ、90分+3 ルーニー）。**敗戦は50試合目**（49試合目は 10/16 のアストン・ヴィラ戦 3-1）。
#   ミラン：英語版 Wikipedia のシーズンの記事3つ（1990-91・1991-92・1992-93）の試合表から数えた。
#     1990-91 最終節（1991-05-26、ミラン 0-0 パルマ）の**1試合（引き分け）**＋1991-92の**34試合（22勝12分け）**＋
#     1992-93の**第23節まで23試合（17勝6分け）**＝**58試合・39勝19分け**。止まったのは1993-03-21（第24節）のパルマ戦 0-1。
#     最後に負けなかった試合は 1993-03-14（ラツィオ 2-2 ミラン）。
#     ※1992-93の第4節（サンプドリア対ミラン）は雨で延期（9/27）。試合表には 1-2（ミランの勝ち）とあり、勝ちに数えた。日付は取っていない。
#     「39勝19分け」はイタリア語の記事（調べた検索の要約ではなく milannews.it の記事の数字）とも一致。
#   バイエルン：2012-13 の試合表（第10節〜第34節）と 2013-14 の「Results by round」から数えた。
#     2012-13：第9節（2012-10-28、ホームでレヴァークーゼンに1-2）が直前の敗戦。第10節（11/3 ハンブルク 3-0）から第34節まで25試合＝**21勝4分け**。
#     2013-14：第1〜28節＝**25勝3分け**（第28節は3月29日、ホッフェンハイムと3-3）。合わせて**53試合・46勝7分け**。
#     止まったのは2014-04-05（第29節）のアウクスブルク戦 0-1。
#   割合と換算：引き分けの割合 13÷49＝26.5%、19÷58＝32.8%、7÷53＝13.2%。ミランはバイエルンの 32.8÷13.2＝約2.5倍。
#     3点制に直した1試合あたりの勝ち点：アーセナル (36×3+13)÷49＝121÷49＝2.47、
#     ミラン (39×3+19)÷58＝136÷58＝2.34、バイエルン (46×3+7)÷53＝145÷53＝2.74。
#     **ミランの時代のセリエAは勝ち点2**（1992-93 の表に 50点（2点制）と 68点（3点制に直した値）の両方が出ている）。
#     アーセナル・バイエルンの当時はプレミア・ブンデスとも3点制。
#     長さの順（58・53・49）と、1試合の勝ち点の順（2.34・2.74・2.47 → 大きい順に バイエルン・アーセナル・ミラン）は一致しない（完全な逆ではない。長さ順 ミラン58＞バイエルン53＞アーセナル49、勝ち点順 バイエルン2.74＞アーセナル2.47＞ミラン2.34）。
#
# ★**今季の継続中の無敗（2026年10月14日の時点）**:
#   ESPN の2026-27 順位表（各リーグ）で、**リーグ戦で負けていないクラブ**を全部拾い、各クラブの2025-26 の試合表（ESPN の team schedule）から
#   直近の敗戦までさかのぼって数えた。**試合数は、2025-26（38または34）＋2026-27 の消化分と合う**ことを確かめた。
#   バイエルン **20試合**（15勝5分け。直近の敗戦は2026-01-24、アウクスブルクに 1-2。ブンデスリーガ公式の記事で確認）。
#     2026-27は5試合消化（3勝2分け）。**1季は34試合なので残りは29試合**。20＋29＝49でアーセナルに並ぶ（条件の話。予想はしない）。
#   インテル **16試合**（10勝6分け。直近の敗戦は2026-03-08、ミランに 0-1）。6試合消化・残り32試合＝16＋32＝**48**でアーセナルの49に届かない（今季のうちには）。
#   ローマ 13・ブレントフォード 8・バルセロナ 8・ミラン 6・ほか 6〜7。**ここに出していないクラブは今季すでに負けているか、さらに短い**。
#   ※バイエルンの20は「ESPN の試合表から数えた」値。ブンデスリーガ公式の頁では**直近の敗戦（2026-01-24）しか確認していない**。
#
# **一次情報まで辿れた所と、辿れなかった所**:
#   ○ **プレミアリーグ公式の記録頁**（premierleague.com/stats/records）＝「Longest PL unbeaten run: 49 - Arsenal (7 May 2003 - 24 October 2004)」。
#       ※終わりの日付 24 October 2004 は**負けた試合の日**。最後に負けなかった試合は 10/16。
#   ○ **ESPN の試合記録（scoreboard／summary）**＝アーセナル49試合の日付・スコア・相手、止めた試合のゴールの時間（73分ペナルティーキック・90分+3）と得点者。
#   ○ **ブンデスリーガ公式の記事**（bundesliga.com、2026-01-24）＝バイエルンの53試合無敗は「2014年にアウクスブルクに1-0で止められた」、
#       2026-01-24 にアウクスブルクに 1-2 で負けて27試合の無敗が止まった。
#   △ **ミランの58**は、セリエA公式（legaseriea.it）の記録頁を見つけられなかった。英語版 Wikipedia の記録の頁
#       （Football records and statistics in Italy：58、26 May 1991〜21 March 1993）と、シーズンの記事の試合表から自分で数えた値で書いた。
#       イタリア語の記事（milannews.it）が 21 March 1993 のパルマ戦で止まったと書いている。
#   △ **バイエルンの53**：開始日 2012-11-03 と終わりの日はギネス世界記録の頁と Wikipedia のシーズンの記事。
#       **ギネスの頁は終わりを29 March 2014 と 5 April 2014 の両方で書いていて揺れている**。台本は「最後に負けなかった試合は3月29日、負けたのは4月5日」。
#   △ **バルセロナの43・パリ・サンジェルマンの36**は、英語版 Wikipedia の記録の頁（ラ・リーガ／リーグ・アン）の数字のみ。
#       リーグ・アンのは出典に Ligue 1 の公式統計ガイドがあるが、**公式の頁そのものは開いていない**。
#       バルセロナの始まりは**4月8日（敗戦）の後**＝4月15日からと読める（ギネスは「15 April 2017」）が、日付は書かず「2017年4月」「2018年5月」と月だけにした。
#       パリ・サンジェルマンは「2015年3月」と月だけ。**終わりの日は確かめていない**。
#   × **アーセナル公式（arsenal.com）の記録の頁は辿れなかった**（/history/club-records/sequences は 404）。
#   × **ミランの58の日付・内訳**をクラブ公式・リーグ公式では確かめられていない。
#   × 2026-27 の無敗クラブの数は、**ESPN の順位表の値**。各リーグ公式の順位表との突き合わせはしていない。
#
# **言い切っていないもの**:
#   ・「5大リーグで3番目」＝調べたのは**各リーグの公式・Wikipedia の記録の頁が示す最長の記録**（セリエA58・ブンデス53・プレミア49・ラ・リーガ43・リーグ・アン36）。
#     リーグ内の2番目以下の無敗は並べていない。台本は「5つのリーグの記録の中で3番目」と**記録どうしの比べ**だけを言う。
#   ・「ヨーロッパの記録」は言わない（ステアウア・ブカレスト104などがある。Wikipedia のヨーロッパの記録の頁）。
#   ・ミランの記録が「いまも破られていない」ことは、英語版 Wikipedia の頁の記述（2026年時点）。台本は「ミランの58が最長」と記録どうしの比べだけ。
#   ・バイエルンの今季の見込みは言わない。**「残り29試合を全部負けなければ49に並ぶ」という条件の話**だけ。
#   ・3点制の換算は「ミランの記録は勝ちを3、分けを1として数え直した」と断る。当時の勝ち点とは違う。
#
# 他人の声は使わない（記録の数字だけ）。voice_min: 0。反応は集めていない。
# ブラウザの道具は使っていない（WebFetch と requests だけ）。
# アルファベットは読み上げに出さない（プレミアリーグ・ブンデスリーガ等はカタカナ。ペナルティーキックは書き下す）。
#
# ★写真は 10/14 に取得済み（assets/images/20261014_unbeaten/）。以下は取得前のメモ：
#   assets/backgrounds/ にスタジアムの写真が無かったため、このセッションでは取っていない。
#   アーセナルの本拠地（エミレーツ）かミランの本拠地の写真を、別途取る必要がある（1本のあいだ変えない決まり）。
# サムネは構図 number（同じ日の他の本の構図とは別に決める）。**ユーザーと相談して決める**ので、ここに書いたのは案A。
