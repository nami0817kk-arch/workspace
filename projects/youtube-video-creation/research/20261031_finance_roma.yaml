- id: view
  viewpoint: true
  heading: 見立て・ローマの赤字は、まだ続くのか
  tier: 背景
  telop: 選手にかける割合は73%。連盟の上限は70%。2026年6月に罰金600万ユーロ
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（ローマの決算）
    columns: [比べ, 答え]
    rows:
    - [人件費 ÷ 収入（前の年は67.4%）, 56.5%]
    - [（人件費＋選手の償却）÷ 収入（前の年は80.1%）, 73.4%]
    - [4年の赤字の合計, 4億5730万ユーロ]
    highlight_row: 1
  say:
  - text: ここからは見立てです。ローマの決算の数字で、割り算をしてみます。
    image: assets/images/20261031_finance_roma/06_w.jpg
    card: none
  - text: 人件費は、収入の56.5%。前の年は67.4%でした。
    card:
      <<: *view_table
      highlight_row: 0
  - text: 人件費に選手の償却を足すと、収入の73.4%。前の年は80.1%です。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1
    card: *view_table
  - text: ヨーロッパサッカー連盟は、選手にかけるお金の割合に、上限を置いています。
    image: assets/images/20261031_finance_roma/03_w.jpg
    card: none
  - text: 2024年末は80%、2025年末からは70%です。
    card: none
  - text: ここで割った数字は目安で、連盟の数え方とは、少し違います。
    card: none
  - text: 決算書は、2025年末の70%を、守れないかもしれないと書いていました。
    card: none
  - text: そして2026年6月、連盟はローマに、600万ユーロの罰金を科しました。
    emph: true
    card: none
  - text: 内訳は、サッカーの収支の目標を少し超えた分が200万。
    image: assets/images/20261031_finance_roma/04_w.jpg
    card: none
  - text: 選手にかけるお金が70%を超えた分が、400万ユーロです。
    card: none
  - text: 題への答えです。
    card: none
  - text: 運営の黒字より、償却と金利などの合計が大きい。だから、赤字は続きます。
    emph: true
    card: none
  - text: クラブは2025年10月に、先の見通しを示しました。
    card: none
  - text: 2025年から26年も、赤字は続くが、縮むという見込みです。
    image: assets/images/20261031_finance_roma/05_w.jpg
    card: none
  - text: もう一つの山は、2027年10月30日。社債の、返済期限です。
    card: none
