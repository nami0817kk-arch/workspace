    card: none
  - text: 2024年から25年だけで、8230万ユーロを貸しました。
    card: *owner_table
  - text: さらに、貸していた1億4500万ユーロを、出資の積立に切り替えています。
    card: *owner_table
  - text: 2025年6月末で、貸付と積立を合わせて、8億8520万ユーロです。
    emph: true
    card:
