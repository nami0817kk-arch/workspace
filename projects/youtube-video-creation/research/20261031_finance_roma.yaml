# クラブの財政：ASローマ（10/31 土、シリーズ「クラブの財政」、key: finance_roma、型は news）。
#
# 題材：research/20261031_series_topics.yaml の num 13（推し）。クラブ公式の決算（2024-25、2025年6月期）を一次資料として全部読み直した。
#   重なりの確認（10/31）：scripts/*finance_* に roma は無い。research/posted.json・covered.yaml の roma は
#     20260906_romano・20260907_romano（移籍情報の記者ロマーノのこと。クラブではない）、20261015_real_roma_cl（CLのレアル対ローマの試合）、
#     20261028_sugawara_cagliari_roma（菅原のカリャリ対ローマ）。ローマの財政・決算の数字は無し（直近30日で重なる本は無い）。
#   ★今季も1部：ESPN standings（2026-10-31 に取得）ita.1、9試合消化で ローマ 3位・勝点21（1位インテル25、2位ラツィオ25、4位コモ20）。→ 台本には入れない（題に答える節ではないため）。報告に書く。
#   ★日本との接点：決算の数字には無い。無理に入れない（10/6 の決定）。
#
# 軸は「**赤字は3年で約4分の1に縮んだのに、なぜまだ赤字なのか**」。
#   答え：選手の売り買いまで含めた運営の収支は +2420万ユーロの黒字。ところが、選手の償却と評価損5220万・引当金700万・金利1390万・税500万＝計7810万が、その黒字を上回る。
#   縮めた主役は収入ではなく人件費の削減（収入は2960万減、人件費は4940万減）。赤字は株主（フリードキン氏のグループ）の貸付・出資で支えられている。
#   ★他の財政回（10/29 フランクフルト＝出場の決定とお金の入る年のずれ、10/28 ベンフィカ、10/27 シュツットガルト）と軸を重ねない。主役は「運営は黒字でも、償却と金利で赤字」と「株主が払い続ける」。
#   ★アルファベット（AS・UEFA・EL・EBITDA）は読み上げに出さない。「ヨーロッパサッカー連盟」「ヨーロッパリーグ」と言う。
#   ★フランクフルトなど自分のチャンネルの過去回には触れない。
#
# **決算期**：A.S. ローマ（サッカー部門の連結）は7月〜6月。2024-25＝2024年7月〜2025年6月。
#
# **出どころ（読んだもの）**
#   ○ クラブ公式「BILANCIO 2024-25」（連結財務諸表と報告書、2025年10月、media.asroma.com の PDF を requests で取得、1.26MB、全文を pdftotext で読んだ。research/raw/20261031_roma_bilancio2025.pdf・roma.txt）
#       https://media.asroma.com/prod/files/file/gm-af5a5d7a-4129-48ec-ba0f-e27c9e2c327c-bilancio-di-esercizio-e-consolidato-al-30-giugno-2025.pdf
#       「L'esercizio 2024-25 si è chiuso con una perdita di gruppo pari a 53,9 milioni di euro, rispetto alla perdita di 81,4 milioni」
#       損益表（Conto economico riclassificato、千ユーロ）：運営収入 270.241（前 299.882）／運営費用 −245.993（−315.559）／選手売買を含む運営の収支 24.248（−15.677）／
#         償却と評価損 −52.200（−43.893）／引当金 −7.008（−4.956）／金融費用（純） −13.938（−11.061）／税引前 −48.899（−75.586）／税 −4.986（−5.778）／最終 −53.884（−81.364）
#       収入の内訳：試合日 44.466（55.465）／商業 71.671（25.621＋46.050。本文は グッズ・ロイヤルティ 25.6、スポンサー・広告 46.1）／放映権 90.374（104.147）／選手の売買 48.674（29.889＋5.663＋13.122）／その他 15.056（22.613）。合計 270.241 ✓
#       収入が2960万減った理由（本文）：ヨーロッパリーグ −11（前の年は準決勝、今年は16強）／セリエAの放映権 −8.4（2024-29年の契約の評価額が前より低い）／親善試合・ツアー −2.3／保険の補償 −9.3
#       費用が6960万減った理由（本文）：人件費 −49.4（152.734 対 202.126）、サービス −4.2、グッズの仕入れ −3.7 ほか
#       選手の償却：45.6（前 38.1）。「rilevanti investimenti fatti nell'estate 2024 e nella finestra di mercato invernale 2025」
#       引当金 7.0：「oneri per retribuzioni contrattualmente dovute a personale tesserato e non tesserato non più impiegato」
#       金融費用 13.9：社債（Mediaco）11.3（利息10.6）。社債は 175 百万、固定金利 6.04%、返済期限 2027年10月30日
#       過去の最終損益（本文）：2021-22 −219.3／2022-23 −102.7／2023-24 −81.4／2024-25 −53.9（「al 30 giugno 2023, pari a 102,7 milioni... al 30 giugno 2022, pari a 219,3 milioni」）
#       株主：2024-25 に貸付 82.3、145 を出資の積立に切り替え。2025年6月末の貸付 234.8＋出資の積立 650.4＝885.2。報告書の日付までにさらに貸付 50 → 935.2
#       純資産 −316.6（前 −407.7）。過去の赤字の繰越 −1,014.480
#       継続の前提：株主が「irrevocabilmente」少なくとも12か月の資金を出すと約束。2025-26 の改定予算（2025年10月10日の取締役会）は「seppur ancora in perdita, in ulteriore miglioramento」
#       ヨーロッパサッカー連盟の「選手費用の割合」：上限は2023年末90%・2024年末80%・2025年末から70%。「ha rispettato il target fissato al 31 dicembre 2024, mentre potrebbe non rispettare il target fissato al 31 dicembre 2025」
#       ヨーロッパサッカー連盟との和解合意（2022年8月31日署名）
#   ○ ヨーロッパサッカー連盟「Update on clubs under a settlement agreement in 2025/26」（2026年6月17日、WebFetch で原文を確認）
#       https://www.uefa.com/news-media/news/02a6-20e42002ae77-fad3f5bff0c0-1000--update-on-clubs-under-a-settlement-agreement-in-2025-26/
#       「AS Roma (ITA) slightly exceeded the intermediate target set for the financial year ending in 2025 and was fined € 2 million.」
#       「Having also reported a squad cost ratio above 70% for the calendar year 2025, the club was imposed an additional fine of € 4 million.」
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com UK、requests で本文を取得、2026-10-31）
#       https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
#       「Ranking 21-30 ... 26 AFC Bournemouth 218.5 / 27 AS Roma 216.3 / 28 Fenerbahçe 216.0」（ローマは27位、2億1630万ユーロ。デロイトは移籍の収入を含めない）
#   × 確かめられなかったもの：2025-26（2026年6月期）の決算（10/31 時点で承認の発表を見つけられなかった。WebSearch 2回）、ローマの収入のイタリアのクラブの中での順位（デロイトの上位20のページ本文が取れなかった）、
#     デロイトの216.3と、クラブ自身の270.2（選手売買を含む）の差の中身（数え方が違うとしか言えない）。どれも台本に入れない。
#   × 「人件費＋選手の償却÷収入」は自分で割った目安で、ヨーロッパサッカー連盟の定義（代理人報酬を足し、売却益を収入側に足す）とは違う。台本で「自分で割った」「目安」と断る。
#
# 自分で計算した数（検算済み）
#   運営の収支：270.241−245.993＝24.248 ✓ ／ 24.248−52.200−7.008−13.938−4.986＝−53.884 ✓
#   償却・引当・金利・税の合計：52.2+7.0+13.9+5.0＝78.1（7810万）。24.2−78.1＝−53.9 ✓
#   赤字の縮み：53.884÷219.3＝24.6%（約4分の1） ／ 219.3+102.7+81.4+53.9＝457.3
#   収入の減り：299.882−270.241＝29.641 ✓ ／ 費用の減り：315.559−245.993＝69.566 ✓ ／ 人件費：202.126−152.734＝49.392 ✓ → 24.4%減
#   人件費÷収入：152.734÷270.241＝56.5%（前 202.126÷299.882＝67.4%）
#   （人件費＋選手の償却）÷収入：(152.734+45.6)÷270.241＝73.4%（前 (202.126+38.1)÷299.882＝80.1%）
#   株主の資金：234.8+650.4＝885.2 ✓（報告書の数字と一致）
