# 監督紹介：シメオネ（10/25 日、シリーズ「監督紹介」、key: manager_simeone、型は news）。9節の型（2026-10-20 決定）。見本は 20261024_manager_klopp。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-25 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。シメオネを主題にした「人物紹介」は無し。
#   シメオネの名前が出る既存の本：9/22 quote「シメオネ、ダービー勝利のすぐあとに『バルセロナ』」（本人の発言1件のニュース。題材は別）、
#   10/3 公開のクラブ紹介「アトレティコ・マドリード。最初は、どこのクラブの支店だったのか」（監督として1行・発言2行）、
#   10/22 財政「アトレティコ、収入は13位…」（シメオネの名前は無し）、10/21 アルバレスのゴール（試合後の発言1行）。
#   → この回は「監督シメオネの経歴・勝率・戦術の色」で、クラブ紹介・財政とは主題が違う。ただし直近30日にアトレティコの本が2本あるので報告に書く。
#   クラブ紹介で使った「コケ」の発言・9/22 の「バルセロナ」の発言は使わない。
#
# **いまの立場（確かめた）**
#   ○ 英語版 Wikipedia「2026–27 Atlético Madrid season」（控え research/raw/20261025_atm_2026_27_wiki.txt）：Head coach = Diego Simeone。
#   ○ Europa Press（infobae 経由、2026-10-09）「Diego Pablo Simeone: "Las tres semanas de parón rompen la continuidad en lo deportivo"」：
#       「El entrenador del Atlético de Madrid, Diego Pablo Simeone」アラベス戦の前日会見（控え research/raw/20261025_infobae_simeone_1009.txt）。
#   ○ 英語版 Wikipedia「Diego Simeone」（控え research/raw/20261025_simeone_wiki.txt）：current_club = Atlético Madrid (manager)。
#   × クラブ公式（atleticodemadrid.com）は requests・WebFetch とも 403 で読めなかった。
#   × 契約の期限：Wikipedia は「2023-11-09 に 2027-06-30 まで延長」。2026年3月に「延長に合意」と書く報道があるが一次で確かめられない → 契約の期限は台本に入れない。
#
# **通算の数え方（台本とサムネをそろえる）**＝トップチームの全公式戦。英語版 Wikipedia「Managerial statistics」（updated: match played 20 October 2026）を自分で足し直した。
#   行（試合・勝・分・敗）：ラシン(2006) 14・5・3・6／エストゥディアンテス 61・34・15・12／リーベル・プレート 45・20・13・12／サン・ロレンソ 47・21・9・17／
#   カターニア 18・7・3・8／ラシン(2011) 20・8・10・2／アトレティコ 812・478・174・160。
#   **合計 1017試合 573勝 227分 217敗（勝率 56.3%）。Wikipedia の合計欄と一致。**
#   アトレティコ 478/812＝58.9%。アトレティコより前の5チーム（ラシンは1つに数える）205試合 95勝＝46.3%。差 12.6ポイント。
#   エストゥディアンテス 34/61＝55.7%、リーベル 20/45＝44.4%、ほか3チーム（ラシン・サン・ロレンソ・カターニア）99試合41勝。
#   優勝（Wikipedia Honours「Manager」欄）：エストゥディアンテス1（2006 アペルトゥーラ）／リーベル1（2008 クラウスーラ）／
#     アトレティコ8（ラ・リーガ 2013-14・2020-21／国王杯 2012-13／スーペルコパ 2014／ヨーロッパリーグ 2011-12・2017-18／UEFAスーパーカップ 2012・2018）＝**10冠**。
#     種類別：リーグ4（スペイン2・アルゼンチン2）／欧州4（EL2・UEFA SC2）／国内カップ1／国内スーパー杯1＝10。準優勝（CL 2014・2016、国王杯 2025-26）は数えない。
# **選手時代・基礎**：1970-04-28 ブエノスアイレス生まれ（56歳）。愛称「チョロ」。MF。クラブはベレス・サルスフィエルド、ピサ、セビージャ、アトレティコ（1994-97・2003-05）、インテル、ラツィオ、ラシンの7つ。
#   アルゼンチン代表：infobox 108試合、出場表 106試合（食い違う）→ 台本は「100試合以上」（Wikipedia 本文「capped over 100 times」）。
#   1995-96 にアトレティコでリーグと国王杯の2冠。
#
# **日本との接点（一次で確かめた範囲）**
#   ○ 英語版 Wikipedia「1998 FIFA World Cup Group H」（FIFA の試合記録を出典に持つ）：1998-06-14 トゥールーズ、アルゼンチン 1-0 日本（バティストゥータ28分）。
#       シメオネは主将（c）で先発。日本は川口能活・中田英寿・中山雅史らが先発、監督は岡田武史。
#   ○ 同「2002 FIFA World Cup Group F」：6/2 アルゼンチン 1-0 ナイジェリア（鹿島スタジアム、茨城）、6/7 アルゼンチン 0-1 イングランド（札幌ドーム）。どちらもシメオネが先発。
#       3試合目（6/12 宮城、スウェーデン戦）の出場表にシメオネの名前は無い → 「2試合に先発」と言う。
#   × アトレティコで日本人選手を率いた例は無い（確かめた範囲で）。
#
# **戦術の色（実例の試合＝2014-05-17 ラ・リーガ最終節、バルセロナ 1-1 アトレティコ）**
#   ○ ESPN の試合記録（site.api.espn.com esp.1 summary?event=372838、控え research/raw/20261025_barca_atm_2014_espn.json）：
#       16分 ディエゴ・コスタ、23分 アルダ・トゥランがけがで交代。33分 アレクシス・サンチェス（メッシのアシスト）。49分 ゴディンの頭（ガビのコーナー）。
#       支配率 バルセロナ64%・アトレティコ36%、シュート 11対12、枠内 4対3、コーナー 4対8（アトレティコが多い）。
#   ○ 英語版 Wikipedia「Barcelona 1–1 Atlético Madrid (May 2014)」（控え research/raw/20261025_barca_atm_2014_wiki.txt）：試合前の勝ち点差3、引き分けでアトレティコの優勝。
#       最終の表：アトレティコ 28勝6分4敗（勝ち点90）。2003-04 以来、バルサとレアル以外の優勝。1996年以来の優勝。
#       ※ゴディンの分は Wikipedia の人物記事が48分、試合記事・ESPN が49分 → 49分。
#   ○ 英語版 Wikipedia「Diego Simeone」Style of management：狭い4-4-2（4人の2列）、奪ったら全員で速く攻める、セットプレーで取り相手に取らせない。
#   ○ 同：2013-14 の勝ち点90は、1995-96 の87を上回る。
#   ○ 同 Style of management：「preferred formation is the 4–4–2, which he first practised when he was manager of Estudiantes in 2006」。
# **本人の言葉（自訳。原文は出典）**：
#   ①2014-05-17 Goal「Simeone: I'm sure Aragones was defending with us」（archive.org 版、控え research/raw/ に本文なし→下に原文）：
#     "Today is one of the best days in the history of Atleti." / "At half-time I told them to be relaxed. In the first half we did well. I knew if we scored, it would cost them. That's what happened."
#   ②2026-10-09 Europa Press（infobae）："Somos agradecidos de haber tenidos a los dos mejores jugadores de la historia. Messi es insuperable…"（メッシとマラドーナについて）
# **マル秘話（英語版 Wikipedia）**：就任後の最初の試合はマラガと0-0／2021-03-10 アスレティック戦の勝利で309勝目、ルイス・アラゴネスを抜いてクラブの監督で最多勝／
#   2023-11-28 フェイエノールト戦でCL100試合目、1つのクラブではファーガソン・ヴェンゲルに次ぐ3人目／2026-05-02 バレンシア戦で監督通算1000試合目（出典はクラブ公式＝403で原文は未確認）／
#   選手と監督の両方でアトレティコにリーグ優勝をもたらしたのは、ルイス・アラゴネスに次ぐ2人目。
#   欧州のトップリーグで、いま最も長く同じクラブを率いる監督（Wikipedia 冒頭。2部を含めるとフランク・シュミットに次ぐ2位）。
# **今季（英語版 Wikipedia「2026–27 Atlético Madrid season」、ラ・リーガ公式の順位表を出典に持つ。update 17 October 2026）**：9試合 7勝1分1敗、19得点8失点、2位。
#
# **入れなかったもの**：家族（息子たちが選手であることを含む）・私生活・信仰、退場・出場停止・審判への抗議（2014 CL決勝・2018 アーセナル戦）、1998年のベッカムとの場面、
#   年俸・契約金、契約の期限、2025-26 の国王杯決勝・CL の敗退の評価、他の監督との優劣、女子チーム、Jリーグ、SNS の反応、9/22 とクラブ紹介で使った発言。
# **日本語名・読みで怪しいもの（audio_query で確かめた）**：シメオネ・アトレティコ・エストゥディアンテス・リーベル・プレート・サン・ロレンソ・カターニア・ラシン・ゴディン・ガビ・
#   ディエゴ・コスタ・アルダ・トゥラン・カンプ・ノウ・ブエノスアイレス・チョロ・ルイス・アラゴネス・トゥールーズ・鹿島・札幌ドーム・バティストゥータ・中田英寿・マラドーナ・マラガ はどれも通った。
