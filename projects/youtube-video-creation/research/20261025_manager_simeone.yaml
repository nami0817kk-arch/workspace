  - text: シメオネの成績を、チームごとに見ていきます。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card: *club_table
  - text: いちばん多いのは、アトレティコ。478勝を積みました。
    image: assets/images/20261025_manager_simeone/01_w.jpg
    emph: true
    card:
      <<: *club_table
      highlight_row: 0
  - text: アルゼンチンでは、エストゥディアンテスとリーベル・プレートで優勝しています。
    card:
      <<: *club_table
      highlight_row: 1
  - text: 合計は、1017試合。573勝で、勝率56.3%。優勝は10冠です。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    emph: true
    card:
      <<: *club_table
      highlight_row: 4
