- id: words
  heading: 本人は、優勝の日と、いまの会見で、何を語ったのか
  tier: 報道
  telop: 2014年5月の最終節のあとと、2026年10月9日の会見
  narrator: 解説
  card: &words_doc
    type: document
    label: シメオネの言葉（2014年5月・2026年10月、訳）
    paragraphs:
    - ハーフタイムに、落ち着けと言いました。
    - 1点取れば、向こうは苦しくなると分かっていた。
    - 歴史上最高の2人の選手を持てたことに、感謝しています。
    highlight:
    - 落ち着け
    - 苦しくなる
    - 感謝
  say:
  - text: ここで、シメオネ本人の言葉。2014年の最終節、ハーフタイムの話です。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card: *words_doc
  - voice: シメオネ
    text: ハーフタイムに、落ち着けと言いました。
  - voice: シメオネ
    text: 前半は、よくやれていた。
    cont: true
  - voice: シメオネ
    text: 1点取れば、向こうは苦しくなると分かっていた。
    cont: true
  - voice: シメオネ
    text: その通りになりました。
    cont: true
    pause: 0.5
  - text: もう1つは、2026年10月9日の会見。
    image: assets/images/20261025_manager_simeone/06_w.jpg
  - text: メッシとマラドーナ、どちらが上かを聞かれました。
    image: assets/images/20261025_manager_simeone/06_w.jpg
    card: *words_doc
  - voice: シメオネ
    text: 歴史上最高の2人の選手を持てたことに、感謝しています。
  - voice: シメオネ
    text: メッシは、誰にも越えられない選手です。
    cont: true
    pause: 0.5
