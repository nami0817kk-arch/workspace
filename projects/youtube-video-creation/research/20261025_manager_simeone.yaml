  - text: 首位アトレティコと2位バルセロナは、勝ち点3の差。
    card:
      <<: *style_stats
      focus: 0
  - text: 引き分けでも、アトレティコの優勝でした。
    card:
      <<: *style_stats
      focus: 0
  - text: ところが前半、ディエゴ・コスタとアルダ・トゥランが、けがで交代します。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card: none
  - text: 33分、バルセロナが先制。
    card: none
  - text: 49分、ガビのコーナーキックから、ゴディンが頭で同点に。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    emph: true
    card: none
  - text: 1対1の引き分け。1996年以来、18年ぶりのリーグ優勝が決まりました。
    image: assets/images/20261025_manager_simeone/02_w.jpg
    emph: true
    card:
      <<: *style_stats
      focus: 1
  - text: ボール支配率は、アトレティコが36%、バルセロナが64%。
    image: assets/images/20261025_manager_simeone/01_w.jpg
    card: &style_poss
      type: stats
      title: 2014年5月17日 バルセロナ 1-1 アトレティコ
      items:
      - ['36', '%', アトレティコの支配率]
      - ['12', 対11, シュートの数]
      - ['8', 対4, コーナーキックの数]
      focus: 0
  - text: それでもシュートは12本対11本、コーナーキックは8本対4本でした。
    emph: true
    card:
      <<: *style_poss
      focus: 2
  - text: シメオネのチームの特徴、1つ目は守り。4人ずつ2列で、真ん中を狭くします。
    image: assets/images/20261025_manager_simeone/06_w.jpg
    card: &style_doc
      type: document
      label: 英語版Wikipediaの要約（訳）
      paragraphs:
      - 守りは、4人ずつ2列に並ぶ、狭い4-4-2。
      - ボールを奪ったら、全員で速く攻める。
      - セットプレーで点を取り、相手には取らせない。
      highlight:
      - 狭い4-4-2
      - 全員で速く攻める
      - セットプレー
  - text: この4-4-2は、2006年のエストゥディアンテスで使い始めた形です。
    card: *style_doc
  - text: 2つ目は、奪ってからの速さ。
    card: *style_doc
  - text: 3つ目は、コーナーキックやフリーキックなどのセットプレーです。
    card: *style_doc
  - text: この日の同点も、コーナーキックから生まれました。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card: none
