- id: secret
  heading: 数字の外にある話。選手としても、アトレティコで優勝していた
  tier: 背景
  telop: 選手で2冠、監督で最多勝。チャンピオンズリーグ100試合は3人目
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [1996年, 選手として、アトレティコでリーグと国王杯の2冠]
    - [2011年12月, 監督として最初の試合は、マラガと0対0]
    - [2021年3月, 309勝目。クラブの監督で最多の勝利数に]
    - [2023年11月, 1つのクラブでチャンピオンズリーグ100試合。3人目]
    highlight_row: 0
    source: 英語版Wikipedia
  say:
  - text: ここから、数字の外の話。シメオネは、選手としてもアトレティコで優勝しています。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 1996年、リーグと国王杯の2冠です。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: アトレティコで、選手と監督の両方でリーグ優勝。ルイス・アラゴネスに次ぐ2人目です。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 監督として最初の試合は、敵地のマラガ戦。引き分けでした。
    image: assets/images/20261025_manager_simeone/01_w.jpg
    card: none
  - text: 2021年3月10日には、309勝目。
    image: assets/images/20261025_manager_simeone/01_w.jpg
    card:
      <<: *sec_table
      highlight_row: 2
  - text: そのアラゴネスを抜いて、クラブの監督で最多の勝利数になりました。
    emph: true
    card:
      <<: *sec_table
      highlight_row: 2
  - text: 2023年11月28日には、チャンピオンズリーグで100試合目。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  - text: 1つのクラブでの100試合は、ファーガソン、ヴェンゲルに次ぐ3人目です。
    card:
      <<: *sec_table
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Diego_Simeone
- id: view
  viewpoint: true
  heading: 見立て・アトレティコに来て、勝率はどれだけ上がったのか
  tier: 背景
  telop: アトレティコの前は46.3%、アトレティコでは58.9%。今季は9試合で7勝
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた
    columns: [比べ, 答え]
    rows:
    - [アトレティコより前（5チーム・205試合）の勝率, 46.3%]
    - [アトレティコ（812試合）の勝率, 58.9%]
    - [2014年に優勝した季の勝ち点, 90（1996年の優勝の季は87）]
    - [今季のリーグ（10月17日時点）, 9試合7勝1分け1敗・2位]
    highlight_row: 0
  say:
  - text: 見立てです。シメオネの勝率を、アトレティコの前と後で分けて数えました。
    image: assets/images/20261025_manager_simeone/06_w.jpg
    card: *view_table
  - text: アトレティコの前、5つのチームでは205試合で95勝。勝率は46.3%です。
    card:
      <<: *view_table
      highlight_row: 0
  - text: アトレティコでは、勝率58.9%。前より、12.6ポイント高い数字です。
    image: assets/images/20261025_manager_simeone/01_w.jpg
    emph: true
    mark: {kind: circle, row: 1, col: 1}
    card:
      <<: *view_table
      highlight_row: 1
  - text: 2014年の優勝の季は勝ち点90。自身が選手だった1996年の87を上回りました。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 今季のリーグは、9試合で7勝1分け1敗。10月17日の時点で2位です。
    image: assets/images/20261025_manager_simeone/04_w.jpg
    emph: true
    card: none
  - text: 就任から14年余り。選手でも監督でも優勝を知るクラブで、指揮が続きます。
    image: assets/images/20261025_manager_simeone/06_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Diego_Simeone
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_Atl%C3%A9tico_Madrid_season
