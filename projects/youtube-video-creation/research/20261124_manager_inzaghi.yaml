# 監督紹介：シモーネ・インザーギ（11/24 火、シリーズ「監督紹介」、key: manager_inzaghi、型は news）。8節（日本との接点は無し）。見本は 20261122_manager_scaloni。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-13）**：既出20人（グアルディオラ〜スカローニ）以外の大物から。インテルでCL決勝2回・リーグ優勝1回、いまはサウジのアル・ヒラル監督。
#   「無敗なのに優勝を逃した」（2025-26）と「インテルでも2024-25 は1点差の2位」が、いま見る理由。
#   **重なりの確認（2026-11-13 に自分で）**：scripts/・posted.json・covered.yaml・20261123_picks.txt に、インザーギを主題にした本は無い（grep済み）。
#   次点（外した）：アッレグリ（11/26 に使う）、ガスペリーニ・アモリム（今季の状況を確かめきれず）。
#
# **いまの立場**：アル・ヒラル（サウジ）監督、2025年6月4〜5日就任、2年契約・2027年まで（アル・ヒラル公式発表。2026-11-13 に WebSearch で確認）。
#   ○ 英語版 Wikipedia「Simone Inzaghi」（2026-11-13 に action=raw で読んだ）：「currently the head coach of Saudi Pro League club Al-Hilal」、成績表は 2026-11-03 まで更新。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（2026-11-03 時点）。クラブ別の行：
#   ラツィオ 251試合134勝45分72敗／インテル 217試合141勝41分35敗／アル・ヒラル 69試合52勝14分3敗。
#   **Wikipedia の「通算」の行は 533試合324勝…と出ていて、クラブ別の行の足し算（537試合327勝100分110敗）と合わない**。
#   台本・サムネは**クラブ別の行を自分で足した値**（537試合・327勝・110敗、勝率 327÷537＝60.9%）を使う。
#   勝率：ラツィオ 53.4%・インテル 65.0%・アル・ヒラル 75.4%（各行の勝÷試合。表の勝率と一致）。
#   タイトル10個＝ラツィオ3（コッパ2018-19・スーペルコッパ2017・2019）＋インテル6（セリエA 2023-24・コッパ2021-22・2022-23・スーペルコッパ2021・2022・2023）＋アル・ヒラル1（国王杯2025-26）。
#
# **歩み**（英語版）：2016-04-03 ラツィオ暫定、7月に正式。2017-08-13 スーペルコッパ（ユーヴェに3-2）。2019-05-15 コッパ決勝アタランタに2-0。2019-12-22 スーペルコッパ（ユーヴェに3-1）。
#   2021-06-03 インテル。2022-01-12 スーペルコッパ（ユーヴェに2-1延長）、2022-05-11 コッパ決勝（ユーヴェに4-2延長）。2023-06-10 CL決勝 0-1 マンC。
#   2024-04-22 ミラノ・ダービー 2-1 でセリエA優勝決定。2025-05-06 CL準決勝 バルセロナに合計7-6。2025-05-31 CL決勝 0-5 PSG。2024-25 のセリエAはナポリに1点差の2位（英語版）。2025-06-03 インテル退団（合意）。
# **戦術の色**＝2025 クラブW杯 ラウンド16（2025-07-01、FIFA の試合記録に基づく英語版）：アル・ヒラル 4-3 マンチェスター・シティ（延長）。準々決勝はフルミネンセに1-2。
#   基本は 3-5-2＋ウイングバック（英語版）。
# **日本との接点**：無し（入れない）。
#
# **2025-26 サウジ**：最終節 2026-05-21、アル・ヒラルはファイハに1-0。アル・ナスルがダマクに4-1で優勝。勝ち点 アル・ナスル86／アル・ヒラル84／アル・アハリ81（Sky TG24・英語版の順位表）。
#   **アル・ヒラルは34試合25勝9分0敗（84＝25×3＋9 と合う）、アル・ナスルは28勝2分4敗（86 と合う）。** 勝敗数は英語版「2025–26 Saudi Pro League」の対戦表から計算された値（WebFetch の要約）。
#   「9つの引き分けのうち2つが勝ちなら 84＋2×2＝88 で86を上回る」は自分で計算。
#   国王杯2025-26：決勝 2-1 アル・ホルード（2026-05-08〜09、アル・ヒラルでの最初のタイトル）。
#
# **本人の言葉**：2026-05-21 の最終節のあと（Tuttomercatoweb 2026-05-21、イタリア語の発言。こちらで訳した）：
#   "Per noi c'e delusione perche volevamo vincere il campionato" ／ "Solitamente con 84 punti l'avremmo potuto vincere" ／
#   "Per me sono stati straordinari, tra mille difficolta, infortuni, cambi nella rosa" ／ "Siamo l'unica squadra imbattuta al mondo e portiamo a casa solo un titolo, la King Cup"。
# **マル秘話**（英語版）：1976-04-05 ピアチェンツァ生まれ。兄フィリッポ（元FW）。1999-2000 CL でマルセイユ戦に4得点。2000-05-14 ラツィオが優勝を決めた日（レッジーナに3-0）、兄のユーヴェはペルージャに0-1で敗れた。
#   2010年 34歳で引退、ラツィオのユースの指導者に。イタリア代表3試合。
#
# **入れなかったもの**：私生活（結婚・家族）、年俸・「世界最高額の監督」（CBS の見出し。一次で確かめず、埋め草にもなる）、ニックネーム、FotMob、女子、ニュースの反応、他の監督との優劣、ファンの解任要求。
