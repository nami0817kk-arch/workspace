  league: england
  kind: match
  topic: ボーンマス
  title: ボーンマスが4試合続けてリードを手放した。この日、何が起きたか
  hook: 2対1で勝っていました。追いつかれたのは56分です。
  question: 同点になった場面で、何が起きたのか

thumbnail:
  line1: ボーンマスが4試合続けて落とした
  line2: 56分に ●●●●
