sections:
  - id: flow
    heading: 4つのゴールが入った試合
    tier: 報道
    telop: 34分から56分のあいだに、4点
    narrator: キャスター
    card:
      type: table
      title: ボーンマス 2 - 2 ブレントフォード
      columns: ["", ""]
      rows:
        - ["34分", "シャーデ（ブレントフォード）"]
        - ["38分", "クライファート（ボーンマス）"]
        - ["52分", "タベルニエ（ボーンマス）"]
        - ["56分", "シャーデ（ブレントフォード）"]
    say:
      - ボーンマスとブレントフォード。4つのゴールが入った試合です。
      - 34分にブレントフォードのシャーデが先制。38分にクライファートが追いつきます。
      - 52分、タベルニエが決めてボーンマスが逆転しました。2対1です。
    official: false
    sources:
      - https://www.espn.com/soccer/report/_/gameId/401879285

  - id: turn
    heading: 56分に起きたこと
    main: true
    tier: 報道
    telop: ボールが相手に渡った
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 引き分けたことより、**追いつかれた形**が芯
    card:
      type: table
      title: 同点にされるまで
      columns: ["", ""]
      rows:
        - ["52分", "ボーンマスが2対1と逆転"]
        - ["56分", "ボールがシャーデへ渡り、無人のゴールへ"]
        - ["この試合", "シャーデが2得点"]
    say:
      # **ショートは山場の節だけを切り出すので、状況もここに入れる**
      - 2対1でボーンマスがリードしていた56分です。
      - ボーンマスのゴールキーパー、ペトロヴィッチから出たボールが、そのままシャーデに渡りました。
      - シャーデは無人のゴールへ浮かせて流し込みます。2対2。
      - これがこの試合2点目。アディショナルタイムにはボーンマスのガノン＝ドークがゴールの枠を叩きましたが、入りませんでした。
      # **ショートでも試合の内容に触れる／反応は一部**（2026-09-13 ユーザー指示）
      - 2対2。ボーンマスは、勝っている状態から勝ち点を落とすのがこれで4試合続けてです。
    official: false
    sources:
      - https://www.espn.com/soccer/report/_/gameId/401879285

  - id: run
    heading: これで4試合続けて
    tier: 報道
    telop: 勝っている状態から落としている
    narrator: キャスター
    card:
      type: bars
      title: 開幕4試合の勝ち点
      unit: 点
      items:
        - label: ボーンマス
          value: 3
          highlight: true
        - label: ブレントフォード
          value: 6
    say:
      - ボーンマスは、勝っている状態から勝ち点を落とすのがこれで4試合続けてです。
      - 開幕4試合で勝ち点3。ブレントフォードは負けなしのまま、勝ち点6になりました。
      - シャーデはこの試合の2得点で、最高評価の8.7を付けられています。FotMobの採点です。
    official: false
    sources:
      - https://www.espn.com/soccer/report/_/gameId/401879285

  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    telop: 「プレミアが修羅の国である証明」
    narrator: キャスター
    # **反応の節の1行目にはカードが付かない**（行ごとの引用カードは2行目から）。
    # 前の節の最後と合わせて16秒、同じ絵のままだった（2026-09-13）
    card:
      type: quote
      title: 見ていた人
      text: 初めてプレミアリーグをフルで見たけど、すごく良い試合
    # **Xの実際の投稿から引いた。**一度こちらで文を作ってしまい、削除して取り直した
    # （2026-09-13）。**反応は作らない**の決まりは、急いでいても外さない
    say:
      - {voice: ネット民, text: ブレントフォード、ボーンマス、サンダーランドあたりが中位にこの強さや圧力でいるの、プレミアが修羅の国である証明だよな}
      - {voice: ネット民, text: 残り20分、どの試合見るかなーって直感でボーンマス対ブレントフォードにしたんだけど、めちゃくちゃ面白かった}
      - {voice: ネット民, text: 初めてプレミアリーグをフルで見たけど、すごく良い試合。ボーンマスは良いチーム、欧州大会出てほしいな}
      - {voice: ネット民, text: 初めてプレミアリーグをフルで見たけど、すごく良い試合}
      - {voice: ネット民, text: プレミアリーグ昇格以来の対ボーンマス無敗も継続か。カラバオ含め9戦6勝3分}
      - {voice: ネット民, text: まあ今日は正直負けを覚悟したけどね}
      - {voice: ネット民, text: ボーンマスの崩しが上手かったな。ただペナルティエリア内で自由にポストプレーさせちゃダメだね}
    official: false
