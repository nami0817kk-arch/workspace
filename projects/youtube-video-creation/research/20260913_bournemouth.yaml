# ボーンマス 2-2 ブレントフォード（2026年9月12日・プレミアリーグ第4節）
#
# 引きは**「リードを手放したのは、これで4試合続けて」**。
# 芯は**56分のGKのミス**。ここが山場（@main）。
#
# **顔の写真が取れない回。**ボーンマスとブレントフォードのエンブレムは手持ちに無く、
# シャーデの写真は Commons にある1枚が私服の自撮りで使えなかった。
# **数字の図（statboard）をサムネの顔の代わりに使う**（決まりで認められている）。
#
# **ミスを責める書き方にしない。**「相手に渡ってしまった」と事実だけ置く
format: news
voice_min: 26
slot: premier_2
