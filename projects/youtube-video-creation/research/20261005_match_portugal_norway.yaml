  - text: 11日で4試合目の先発。後半の途中、自分から交代の合図を出し、67分に退きました。
    card:
      type: table
      title: ポルトガルはどちらも2-1で勝利
      columns: ['', '9/27 オスロ', '10/4 ポルト']
      rows: *cmp
      highlight_row: 5
  - text: これでポルトガルは勝ち点12。上位2チームが進む準々決勝を決めました。
    image: assets/images/20261005_match_portugal_norway/01_w.jpg
    card: &table_card
      type: table
      title: グループA4の順位（4試合終了）
      columns: [順位, チーム, 勝, 敗, 勝点]
      rows:
      - ['1', 'ポルトガル', '4', '0', '12']
      - ['2', 'デンマーク', '2', '2', '6']
      - ['3', 'ウェールズ', '1', '3', '3']
      - ['4', 'ノルウェー', '1', '3', '3']
      source: UEFA
      highlight_row: 0
  - text: 大会全体で一番乗りです。残る2試合で勝ち点1を取れば、グループ1位も決まります。
    card:
      <<: *table_card
      highlight_row: 1
  - text: 次は11月14日、ブラガでデンマーク戦。17日は敵地でウェールズと戦います。
    card: none
  - text: 相手の決定機をゼロに抑えたこの守りが、11月も続くかに注目です。
