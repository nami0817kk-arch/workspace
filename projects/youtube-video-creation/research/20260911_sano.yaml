      - {voice: ルート・フリット, text: その中でPSVは、中盤や前線にボールを届けるのに苦労していた}
      - 元オランダ代表のボウデワイン・ゼンデンも続きます。
      - {voice: ゼンデン, text: ファン・ボメルはそのスピードで脅威を与えた}
      - {voice: ゼンデン, text: しかし、前線には何かが欠けていた}
      - {voice: ゼンデン, text: そんな中で、佐野は非常に力強いプレーを見せた}
