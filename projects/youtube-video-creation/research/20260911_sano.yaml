# 佐野航大がCLデビュー（2026年9月10日）。ユーザー指示「cl順位表以外作って」
#
# **記事を開いて読んだ。**フットボールチャンネルが、オランダの
# 『Voetbal International』が伝えたフリットとゼンデンの評価を紹介している。
#
# **佐野航大の写真がCommonsに無い。**同姓同名の野球選手（佐野皓大）しか
# 出てこない。決まりどおり、**記事に出てくる別の人の顔**を使う（フリット）。
# 顔がフリットになるので、タイトルと帯で佐野の名前を必ず出す
#
# 引きは**「レジェンドが何と言ったか」**。デビューそのものより、評価のほうが中身がある
#
# **反応は入れない。**読める形のスレが無かった
