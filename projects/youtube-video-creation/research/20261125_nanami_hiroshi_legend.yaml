# 名波浩（元日本代表 MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-25。型は 11/21 の福西崇史と同じ6節（「あの1年」＝2000年のアジアカップ、「見立て」＝代表の点が集まった年）。
# **情報の時点は 2026-11-13。**年齢は出さない。いまの仕事（監督・解説）は言わない。私生活・法的な問題・女子サッカーは入れない。
# 題材を選んだ理由：引退した日本人の大物。ジュビロ磐田の黄金期の中盤・セリエA（ヴェネツィア）・1998年W杯・2000年アジアカップMVP。既出の国内レジェンドに無い（posted.json・covered.yaml・scripts/・picks で確認）。同じ日の別シリーズに名波は出ない。
# 数字の出どころ：日本語版 Wikipedia「名波浩」（年別の表。WebFetch の抽出で読んだもので原ページと一字ずつは突き合わせていない）。
# - J1年別 試合-得点（磐田）：95 51-3、96 30-3、97 21-5、98 33-7、99 15-4、00 5-1、01 17-1、02 24-1、03 27-3、04 29-3、05 26-1、06 10-0、08 13-0＝301試合32点／C大阪2006 13-2／合計J1 314試合34点。足すと表の通算と一致。J2（東京V 2007）17試合0点。
# - 日本代表 67試合9得点。年別（1995 2-2、96 13-1、97 21-3、98 11-0、99 6-0、00 12-3、01 2-0）を足すと 67-9 と一致。2000年以外＝55試合6点（自分で引いた）。1995〜96年は合わせて15試合3点。
# - ヴェネツィア（1999-2000）：リーグ戦24試合1点（日本語版・スポルティーバ）。クラブはセリエBへ降格し、名波は磐田に戻る（Goal）。
# - 2000年アジアカップ：優勝・大会MVP（日本語版・スポルティーバで一致）。日本語版「AFCアジアカップ2000」の試合表で確認：サウジ戦（10/14、4-1）で名波53分、準々決勝イラク戦（10/24、4-1）で名波8分・29分＝計3点で、年別表の2000年3点と一致。決勝（10/29）はサウジに1-0、望月重良の点。大会MVPは名波。
# - ベストイレブン：J1の1996・97・98・2002（日本語版の個人賞。Jクロニクルの選出は数えない）。
# - 引退：2008年11月12日に表明。引退試合は2010年1月10日エコパで2得点（日本語版）。2001年に右膝の半月板を痛め代表から長く離れた（日本語版）。
# 本人の言葉は取れていない。台本は本人の言葉なしで組んだ。
