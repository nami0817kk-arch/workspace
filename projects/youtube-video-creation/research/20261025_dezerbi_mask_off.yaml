# 取材メモ（2026年10月25日）デ・ゼルビ「仮面を外して、正直に話した」。チェルシーに2対0のトッテナム（ニュースのショート。見せ方 Y＝デ・ゼルビ本人の言葉から始める）
# 取材: 2026-10-25。requests で本文を全部読んだ（ESPN は記事API content.core.api.espn.com、BBC とトッテナム公式は本文、公式は pulselive の記事API）。
#   ・ESPN「Roberto De Zerbi: Tottenham are 'a complete team' after win at Chelsea」（10/24 20:06Z）— 題材の元。
#       地の文: 2-0。77分のペンダース（チェルシーGK）のオウンゴール、その10分後にテル。スパーズはスタンフォード・ブリッジで、プレミアリーグ34回の訪問で2勝目（only their second win at Stamford Bridge in 34 Premier League visits）。
#               昨季は降格をぎりぎりで逃れ、約4億ポンドで10人を補強したのに、今季の序盤は最下位にいた（sat bottom of the table）。
#       本人: "Now it is a complete team." / "When we stay for dinner and stay together in the dressing room I see a different group, a different relationship and different atmosphere among the players."
#             "Before Manchester, we spoke a lot, a big, big meeting, removing the mask and speaking honestly, clearly in front of ourselves. From that moment I think it changed something in ourselves."
#             マンU戦（今月、1-1）の前のミーティング（地の文: De Zerbi revealed the squad held a meeting prior to the club's 1-1 draw at Manchester United earlier this month）。
#   ・BBC「The candid meeting that 'changed' Spurs - are they finally on way back?」（10/24 21:14Z）
#       地の文: この勝利で12位。1月2日以来いちばん高い順位（their highest league position since 2 January）。
#               リーグ戦の連勝は、直近42試合で2回目（just the second time they have won two league games in a row in 42 attempts）。
#               支配率68%以上は2025年4月以来（68% possession）。今季のリーグ初勝利は、月曜のコヴェントリー戦で7試合目だった（seven attempts）。
#       本人: "Seven points after Manchester. Before Manchester we spoke a lot, we had a big meeting. We removed the masks and spoke honestly and clearly in front of ourselves. From that moment, I think something started to change within us."
#             "We have changed the spirit of the group and improved the performances of the players, especially some of the more fragile players, maybe the younger players. We have suffered enough."
#   ・トッテナム公式「Brilliant win at the Bridge」（10/24）: 支配率はほぼ70%（almost 70 per cent possession）。77分（残り13分）にペンダースが自陣へ押し込む、87分にテルが自陣から運んで決めた。
#       「Stamford Bridge で34年で2勝目（our second win at Stamford Bridge in 34 years）」。
#   ・トッテナム公式「Chelsea 0-2 Spurs | Roberto De Zerbi's verdict」（10/24）: "complete performance" / "now we are improving in the mentality"。
# 数え方の食い違い: 「34」は ESPN が「プレミアリーグ34回の訪問」、公式が「34年で」、BBC は「36年でリーグ2勝目」。どれも「2勝目」は同じ。台本は ESPN の「プレミアリーグで34回目の訪問で2勝目」で言う（プレミアは1992年から＝公式の34年と同じ期間）。
#   補強額は ESPN 約4億ポンド・BBC 3億ポンド超で食い違うので言わない。
# 自分で数えた比べ（見立て）: マンU戦は今季リーグ6試合目（コヴェントリー戦が7試合目の初勝利＝BBC、マンU戦の後が3試合で勝ち点7＝本人）。
#   ミーティング前: 開幕から5試合で勝ちなし。ミーティング後: マンU 1-1・コヴェントリー 3-1（BBC 本文）・チェルシー 2-0 の3試合で2勝1分、勝ち点7。
# 言わないこと: マディソンの負傷（別の題材 22）。パーマーの退場（10/24 のアロンソのショートと重なる）。補強額。キックオフ時刻。
# 訳はこちらの自訳（英語の会見。ESPN と BBC で言い回しが少し違う。ミーティングの言葉は ESPN の形で引く）。
# 確度: 報道（ESPN・BBC。スコア・得点の分はトッテナム公式で確認）。
# 反応: 0件。作らない。approve は --no-voices で。
# 写真: 01〜05 はトッテナム公式（pulselive の写真API、表記なし＝クラブの撮影）。01＝試合中のデ・ゼルビ（左端にアロンソが写る。縦切りの 01_v は本人だけ）、02＝10/23 の試合前会見、03＝10月の練習、04・05＝チェルシー戦の得点後の選手。
#   代理店のクレジット・透かしは無い（目で見た）。公式の「POST MATCH」の文字入り画像は使わない。10/19・10/20 のデ・ゼルビ／トッテナムの写真（Commons のシャフタール時代）とは別。
