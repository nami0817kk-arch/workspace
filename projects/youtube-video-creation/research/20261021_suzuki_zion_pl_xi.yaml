# 取材メモ（2026年10月21日）鈴木彩艶、プレミアリーグ公式の第7節ベストイレブンに選出（ニュースのショート。見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-21。requests（ブラウザUA）で本文を全部読んだ。
#   ・**一次**＝プレミアリーグ公式 2026-10-20「Alan Shearer's Team of the Week for Matchweek 7」（research/raw/20261021_pl_totw7.html）。
#     本文は短い：ブライトンの Diego Gomez と Luka Vuskovic、Fabian Hurzeler 監督（マネージャー）、「Aston Villa trio Zion Suzuki, Tyrone Mings and Johan Manzambi have been included after their 1-0 away win over Shearer's beloved Newcastle United」。11人の並び（画像）は読めていない。
#   ・Football Insider 2026-10-20（research/raw/20261021_fi_suzuki.html）：24歳、全大会で3度のクリーンシート、足元でのボールプレーが得意、落ち着きが味方の守備陣を助けている（同紙の評価）。
#     同記事は「BBC 週間ベストイレブンの別の選者ディーニーは別のGKを選んだ」ことを論じる論評（見出しは選者を批判する形）。**この台本では入れない**（選手を小さく見せる言い方になりやすく、選手本人の話でもない）。
#   ・Qoly 2026-10-21（research/raw/20261021_qoly_zion.txt。一覧の出典）：17日のニューカッスル戦（1-0）、相手の枠内シュートは1本で指先セーブ、今週はヴィラは CL でヴィーキング、リーグでマンC。Qoly は FI を引いた孫引き。
# 【題の扱い（ユーザー指示：鈴木彩艶に敬意を持つ）】一覧の見出しは「ベストイレブンに。BBCのディーニー氏は別のGK、彩艶は選ばず」だが、**「選ばれなかった」側は題にも本文にも入れない**。
#   公式のベストイレブンに選ばれた事実を主役にし、選んだのがシアラー氏（ニューカッスルを愛する人、とプレミア公式が書く）であることを引きにした。「失望しているかもしれない」は媒体の推測なので入れない。
# 【言葉の引き直し】一覧「BBCのディーニー氏はGKにフェルブルッヘンを選び」「失望」は上の理由で使わない。「PL公式ベストイレブン」の選者は一覧に書かれていないが、公式記事の題に Alan Shearer とある。
#   Shearer の肩書：公式記事は「Premier League record goalscorer（プレミアリーグ歴代最多得点者）」。
# 自分で数えたもの（見立て）：選ばれたヴィラの3人は GK 鈴木・DF ミングス（Tyrone Mings）・マンザンビ。完封の試合から、守った側が2人（GKとDF）、点を決めたのが1人（36分にマンザンビ。10/18 の台本の取材メモで読み済み）。
# 本人の言葉：今回の記事には無い → 作らない。X（冒頭の一言）にした。反応：作らない（0件）。
# 前の本と重ねない：10/18「49分のボトマンのシュートへのセーブと英紙の評価」、10/18 夜の「採点の割れ方」は言わない。セーブは「枠内シュート1本を止めた」と1行だけ。
# 確度：選出は 確定（プレミアリーグ公式の記事）。無失点・足元の評価は 報道。選ぶ人の話・見立ては 背景。
# 写真：新しい写真は取れなかった。ヴィラ公式（avfc.co.uk は画面を JS で組み立てるため記事の写真を取れず）・プレミア公式の記事の画像（デザインカードで本人の写真ではない）・Football Insider の主写真（Imago＝代理店）・Qoly（Getty）は不可。
#   Commons は日本代表戦の2024年の写真が1枚（顔の検出が空振りで切れず、使わない）。
#   **使ったのは 10/18 までに取り込んだ報道写真4枚の再利用**（01＝日本代表・ゲキサカ ／ 02＝ヴィラ緑のGKユニ・日刊スポーツ ／ 03・04＝ヴィラのCL・Yahoo 経由）。本人は目で確認済み。前日までと同じ写真なので、報告で警告する。
