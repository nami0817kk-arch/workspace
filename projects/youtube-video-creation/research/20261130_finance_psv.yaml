# クラブの財政：PSV（11/30 月、シリーズ「クラブの財政」、key: finance_psv、型は news）。
#
# 題材の選び方：デロイトの上位は既出（11/2 アヤックスの控えのとおり）。11/28 のフェイエノールトと対にして、
#   同じ「チャンピオンズリーグの賞金が減った年」に、フェイエノールトは赤字、PSV は黒字で自己資本が過去最高。★「収益の大きいクラブから」からは外れる。
# 重なりの確認（11/21）：scripts/*finance_* に psv 無し。PSV の名前の入る本は佐野航大のニュース（20261010・1014・1018・1021・1121）だけで、財政の回は無い。
#   同じ日（11/30）の別シリーズ：クラブ紹介＝ローマ、監督＝ポステコグルー、世界レジェンド＝アザール（research/20261127_picks.txt）。重ならない。
# ★今季も1部：fcupdate.nl の 2026/27 エールディヴィジ順位表（11/21 取得）で12試合・首位（勝ち点26）。
# ★日本との接点：佐野航大は 2026年8月の加入（psv.nl の発表、決算日のあと）なので、この決算には入らない。台本に入れない（10/6 の決定どおり無理に入れない）。
#
# **決算期**：PSV N.V.、2025-07-01〜2026-06-30。2026-10-06（火）にクラブが公式の場で発表。
# ★確かめられなかったこと：クラブの年次報告書・発表文の本文は読めなかった（psv.nl は記事以外が動的で、発表のページも PDF も見つからず）。
#   数字は報道3社（Omroep Brabant・FCUpdate・Roundtable）が一致して伝えるもの。台本は「報道」の確度。公開前に psv.nl の年次報告書で突き合わせることを勧める。
# **出どころ**
#   ○ Omroep Brabant 2026-10-06「PSV ziet eigen vermogen naar recordhoogte stijgen na succesvol jaar」https://www.omroepbrabant.nl/nieuws/6029900/psv-ziet-eigen-vermogen-naar-recordhoogte-stijgen-na-succesvol-jaar
#     「nettowinst van 6,6 miljoen euro」「eigen vermogen ... 55 miljoen euro, een recordhoogte」「Vorig jaar ... recordomzet van 171 miljoen euro. Dit seizoen daalde die naar 158 miljoen euro」
#     「PSV kwam afgelopen seizoen één punt tekort om de League Phase van de Champions League te overleven ... Toen reikten de Eindhovenaren tot de laatste zestien」「19 miljoen euro minder aan premies van de UEFA」
#     「positief transferresultaat van 9 miljoen euro」「Saibari naar Bayern München en Joey Veerman naar Borussia Dortmund niet meegenomen ... samen goed voor ruim 70 miljoen euro」
#     「84 miljoen euro uitgekeerd aan salarissen en sociale lasten」「contractspelers dalen van negentig naar tachtig」「sponsoring ... 46 miljoen」「merchandiseverkoop ... 12 miljoen」「880.000 toeschouwers ... 25 miljoen euro ... 26 thuiswedstrijden」
#     「verwacht de club ook volgend seizoen zwarte cijfers te schrijven」
#   ○ Omroep Brabant 2026-10-06「PSV rekent op prijskaartje van 400 miljoen euro voor uitbreiding stadion」https://www.omroepbrabant.nl/nieuws/6030001/psv-rekent-op-prijskaartje-van-400-miljoen-euro-voor-uitbreiding-stadion
#     「aparte investering van 400 miljoen euro」 Marcel Brands「Niks doen is geen optie.」「slechts twaalf seizoenkaarten werden opgezegd」「kostenpost van 3,5 miljoen euro aan advieskosten」
#   ○ FCUpdate 2026-10-06 https://www.fcupdate.nl/voetbalnieuws/2026/10/psv-boekt-zeven-miljoen-winst-record-eigen-vermogen
#     表：Omzet ruim 158 / Sponsoring & Hospitality ruim 46 / Bedrijfskosten 157 / Operationeel resultaat 1 / Transferresultaat ruim 9 / Nettowinst bijna 7 / Eigen vermogen 55。Saibari 50・Veerman 22。
#   ○ Roundtable 2026-10-07（英語）https://roundtable.io/sports/soccer/eredivisie/psv-eindhoven/news/psv-announce-nearly-7m-profit-as-equity-reaches-historic-55m-high-after-record-breaking-2025-26-season
#     「third consecutive Eredivisie title」「positive operating result of €1 million」「Operating expenses increased to €157 million」「52,000-seat」
#   ○ 前の年（2024-25）：Voetbalprimeur 2025-10「Klinkende jaarcijfers van PSV」https://www.voetbalprimeur.nl/nieuws/1699252/klinkende-jaarcijfers-van-psv-recordomzet-en-nettowinst.html
#     omzet 170 miljoen（見出し。Omroep Brabant は 171）、kosten ruim 150、positief operationeel resultaat 20,5、nettowinst 7,5（本文に「winst van 7,4」も）、eigen vermogen 48、transferresultaat −9,5、ruim 65 miljoen premies
# ★食い違い：前の年の収入 170（Voetbalprimeur）と 171（Omroep Brabant）→台本は「約1億7000万」。前の年の最終 7.5 と 7.4 →「約740万」。今年の最終「bijna 7」と 6.6 →台本は 660万（Omroep Brabant の細かい数）。
#   設備投資 27.5（Omroep Brabant）と 24（Roundtable）は食い違うので使わない。給料の前年比（78 は「salarissen」だけの可能性）も使わない。
# ★使わなかったもの：2025年夏に売った選手の名前（記事に名前が無い）、ボス監督の話、女子チームの優勝（女子は扱わない）。
# 自分で計算した数（検算済み）
#   収入の減り 171−158=13（−7.6%）→約1300万・約8%／本業の悪化 20.5−1=19.5／売買の改善 9−(−9.5)=18.5／最終の差 6.6−7.4=−0.8
#   費用÷収入 157÷158=99.4%／給料÷収入 84÷158=53.2%→約53%／自己資本の増え 55−48=7
#   フェイエノールトとの比べ（11/28 の年次報告書の数字）：収入の減り 51.5 対 13／賞金の減り 47.0 対 19／最終 −12.6 対 +6.6／自己資本 24.7 対 55
