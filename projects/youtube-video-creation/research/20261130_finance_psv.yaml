  say:
  - text: PSVは、2026年6月までの1年間で、660万ユーロの黒字を出しました。
    short_only: true
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: チャンピオンズリーグを早く去り、収入が減った年です。
    short_only: true
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 本業の収支の悪化は、約1950万ユーロでした。
    card:
      <<: *pl
      highlight_row: 0
  - text: 埋めたのは、選手の売買でした。前の年は、950万ユーロのマイナス。
    card:
      <<: *pl
      highlight_row: 1
  - text: 2025年の夏に選手を入れ替え、この年は900万ユーロのプラスになりました。
    emph: true
    card:
      <<: *pl
      highlight_row: 1
  - text: 最終の損益は、660万ユーロの黒字。前の年の約740万に近い額です。
    emph: true
    callword: 黒字
    card:
      <<: *pl
      highlight_row: 2
  - text: 資産から借金などを引いた自己資本は、4800万から5500万ユーロへ。
    card:
      <<: *pl
      highlight_row: 3
  - text: クラブとして、過去最高の額です。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: リーグでは、3年続けての優勝でした。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
