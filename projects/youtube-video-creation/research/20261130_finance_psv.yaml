- id: stadium
  heading: PSVは、自己資本をスタジアムに使うのか
  tier: 報道
  telop: スタジアムを広げる案は、約4億ユーロ
  narrator: 解説
  say:
  - text: いま、PSVが考えているのが、本拠地フィリップス・スタディオンを広げる案です。
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 席を5万2000まで増やす案で、かかる額は約4億ユーロと見込まれています。
    emph: true
    card: &stad
      type: stats
      title: フィリップス・スタディオンの拡張
      items:
      - - 約4億
        - ユーロ
        - 見込みの費用
      - - 5万2000
        - 席
        - 広げたあと
      - - 約7
        - 倍
        - 自己資本と比べて
      focus: 0
  - text: いまの自己資本の、約7倍です。
    card:
      <<: *stad
      focus: 2
  - text: ただ、その自己資本は、拡張に充てるお金ではないとされています。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 昨季、解約されたシーズンチケットは、わずか12枚だったといいます。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: クラブの責任者の一人、マルセル・ブランツは、こう話しました。
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 「何もしないという選択肢はない」。
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
