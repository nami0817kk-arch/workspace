  say:
  - text: PSVの決算は、2025年7月から2026年6月までの1年間です。
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 10月6日に、クラブが発表しました。以下の数字は、報道によります。
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 収入は、約1億7100万から1億5800万ユーロへ。約8%の減りです。
    emph: true
    card:
      <<: *rev
      highlight_row: 0
  - text: 前の年は、チャンピオンズリーグで、16チームが残る段階まで勝ち上がりました。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: この年は、最初の段階のリーグフェーズで、突破に勝ち点1だけ届きませんでした。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 欧州サッカー連盟からの賞金は、前の年より約1900万ユーロ少なくなりました。
    emph: true
    card:
      <<: *rev
      highlight_row: 1
  - text: 一方で、スポンサーと法人席は、4600万ユーロを超えて、過去最高。
    card:
      <<: *rev
      highlight_row: 2
  - text: 入場券は2500万ユーロ。ホーム26試合に、88万人が来ました。
    card:
      <<: *rev
      highlight_row: 3
  - text: グッズも、1200万ユーロで過去最高です。
    card:
      <<: *rev
      highlight_row: 4
  sources:
  - https://www.omroepbrabant.nl/nieuws/6029900/psv-ziet-eigen-vermogen-naar-recordhoogte-stijgen-na-succesvol-jaar
  - https://www.fcupdate.nl/voetbalnieuws/2026/10/psv-boekt-zeven-miljoen-winst-record-eigen-vermogen
