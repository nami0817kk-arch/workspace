  - text: 見立てに入ります。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 同じリーグのフェイエノールトと、同じ時期の決算を比べます。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 収入の減りは、PSVが約1300万ユーロ。
    emph: true
    card:
      <<: *view
      highlight_row: 0
  - text: フェイエノールトは、約5150万ユーロ減りました。
    card:
      <<: *view
      highlight_row: 0
  - text: 欧州の賞金の減りも、PSVの約1900万に対し、フェイエノールトは約4700万。
    card:
      <<: *view
      highlight_row: 1
  - text: 最終は、PSVが黒字、フェイエノールトは1260万ユーロの赤字。
    mark:
      kind: circle
      row: 2
      col: 1
    card:
      <<: *view
      highlight_row: 2
  - text: 題への答えです。PSVは、本業の悪化を、選手の売買の改善でほぼ埋めました。
    emph: true
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 売買の改善は、本業の悪化の約95%を埋めた計算です。
    emph: true
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
  - text: 決算のあと、サイバリがバイエルンへ、フェールマンがドルトムントへ移りました。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 移籍金は合わせて7000万ユーロ以上。この年の売買の結果の、約8倍です。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: クラブは、今季も黒字を見込んでいます。
    image: assets/images/20261130_finance_psv/02_w.jpg
    card: none
  - text: 次の決算の注目は、売買の利益に頼らず、本業の収支をどこまで戻せるのか。
    emph: true
    image: assets/images/20261130_finance_psv/01_w.jpg
    card: none
