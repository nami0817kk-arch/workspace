# 取材メモ（11/17 火、シリーズ「比べる」、key: compare_357565_567576）。ロドリ（バルセロナ・30歳）×エリオット・アンダーソン（マンチェスター・シティ・23歳）。
# **情報の時点は 2026-11-12**。FotMob・DataMB は使っていない。数字は Transfermarkt の API（2026-11-12 取得。控え: research/raw/20261115_rodri_tm.json・20261115_anderson_tm.json）。
#   Transfermarkt 番号：ロドリ 357565・アンダーソン 567576。player・market-value-history・performance-season（2019〜2026季）を2.5秒あけて取得。
# **選んだ理由**：同じ2026年の夏に、守備的MFのロドリがシティからバルセロナへ（8月18日）、アンダーソンがフォレストからシティへ（7月23日）動いた。
#   守備的MFは得点・アシストで比べにくいので、TM の「出ている間のチームの得点・失点」（teamGoalsOnThePitchSum・opponentGoalsOnThePitch）を90分あたりに自分で割って軸にする。
#   昨季の出場時間 2185分 と 4168分、今季 945分 と 1139分（どちらも900分超）。クラブの公式戦だけで数える（代表戦は混ぜない）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて。ロドリは9月に個別の本（バレンシアへの謝罪・マンCの違反認定）、アンダーソンは10/14 に選手紹介（20261014_anderson）があるが、比べる回には未登場。
#   同じ日（11/17）の picks の人名・クラブ（ベティス・レアル・ソシエダ・ほか）とは重ならない。11/15 の比べる（デ・ブライネ×モドリッチ）とも人もクラブも重ならない。
#   **外した候補**：ヤマル×ユルドゥズ（ヤマルが10/20・10/22 に登場済み）・ライス×カイセド（ライスが10/21 に登場済み）・ヴィティーニャ系（10/17 に登場済み）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：バルセロナ（ラ・リーガ。TM の現所属 131、2026-08-18〜）・マンチェスター・シティ（プレミア。TM の現所属 281、2026-07-23〜）。
# **使った数**（TM の performance-season の、クラブのトップチームの公式戦だけ。代表戦は混ぜない。試合・出場時間・得点・アシスト）
#   ロドリ：23/24 シティ 50試合 4327分 9点15A／24/25 シティ 8試合 336分 0点1A／25/26 シティ 33試合 2185分 2点0A／26/27 バルセロナ 14試合 945分 1点1A（11月12日時点。先発 リーグ8＋CL3＝11）
#   アンダーソン：23/24 ニューカッスル 26試合 1100分 0点2A／24/25 フォレスト 42試合 3123分 2点6A／25/26 フォレスト 50試合 4168分 4点5A／26/27 シティ 15試合 1139分 1点2A（先発 リーグ9＋CL3＋コミュニティ・シールド1＝13）
#   出ている間のチームの得点・失点（TM。クラブの公式戦、90分あたりに自分で割った値）：
#     ロドリ 25/26 得点45・失点23／2185分 → 1.85・0.95・差+0.91。26/27 得点41・失点14／945分 → 3.90・1.33・差+2.57
#     アンダーソン 25/26 得点59・失点63／4168分 → 1.27・1.36・差-0.09。26/27 得点26・失点22／1139分 → 2.05・1.74・差+0.32
#   増えた失点の幅：ロドリ 1.33-0.95＝0.38／アンダーソン 1.74-1.36＝0.38。**チームの数字で、本人だけの数字ではない**（台本でも言う）。
# 市場価値（TM）：ロドリ 2023-06 9000万€→2024-05 1億2000万→2024-07 1億3000万（最高）→2025-05 1億1000万→2025-12 7500万→2026-10 6000万／アンダーソン 2023-06 800万→2024-05 1500万→2024-12 2400万→2025-05 3200万→2025-12 6000万→2026-10 1億2000万（最高）
# 経歴（Wikipedia 英語版）：ロドリ 2026年8月18日にバルセロナと4年契約、報道の移籍金は基本6000万€＋追加1650万€（計7650万€）。2024年のバロンドールを受賞。2024年9月22日のアーセナル戦で前十字靭帯と半月板を痛めた。
#   アンダーソン 2026年7月2日にシティとフォレストが合意を発表、7月23日に正式契約。報道の移籍金は1億1600万ポンド。
