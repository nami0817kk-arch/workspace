  say:
  - text: 日本代表のゴールキーパー鈴木彩艶。ベネズエラ戦に後半から出て27秒で失点しました。
    short_only: true
  - text: 鈴木が原因に挙げたのは、自分の技術と、味方との噛み合わせでした。
    image: assets/images/20260929b_suzuki/01.jpg
  - voice: 鈴木彩艶
    text: 味方にサイドを切らせて自分がニア側のボールを取るとか、
  - voice: 鈴木彩艶
    text: そういう連携ができていたら防げる部分があった
    cont: true
  - 味方が外側のコースを消し、自分は近い側に来るボールを取る。その分担の話です。
  - 次に、持ち味のはずのビルドアップ、後ろからつなぐ組み立てです。
  - voice: 鈴木彩艶
    text: 味方とあまりイメージが合わなかった。
  - voice: 鈴木彩艶
    text: もう少し自分のアイデアを共有しないといけない
    cont: true
  - voice: 鈴木彩艶
    text: 自分が持つ時間がありながらも、探しどころを探す感じがあって、
  - voice: 鈴木彩艶
    text: 出しどころを何個か持つことができなかった
    cont: true
  - text: この日、日本は4日前のウルグアイ戦から先発を10人入れ替えていました。
