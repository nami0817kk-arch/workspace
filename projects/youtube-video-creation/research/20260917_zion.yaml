# 鈴木彩艶がハーフタイムから緊急出場（2026-09-17）
#
# **「負傷」と断定しない。**取材で確かめたところ、負傷と書いた記事は無い。
# The Athletic 経由で「前半終了時に足を引きずる様子を見せていた」という描写どまり。
# **「足を引きずる様子を見せ、ハーフタイムで退いた」までにとどめる。**
#
# **移籍金には触れない。**2560万ポンド／3000万ポンド／3000万ユーロと
# 3つの表記に割れている（2026-09-16 に確認）。
#
# 引きは**「相手に坂元達裕がいた」**。日本人対決になっていた。ここが山場（@main）。
