      - {voice: ネット民, text: アストンビラの鈴木彩艶がリーグ杯コベントリー戦で後半から出場。無失点で締めて勝利, telop: 後半から出場。無失点で締めて勝利}
      - {short_voice: true, voice: ネット民, text: 坂元達裕が先発、GK鈴木彩艶も緊急出場。アストン・ヴィラがアブラハムの2得点で勝利, telop: 坂元達裕が先発、GK鈴木彩艶も緊急出場}
      - {short_voice: true, voice: ネット民, text: 後半から入ったザイオン。落ち着いた対応で勝利に貢献, telop: 後半から入ったザイオン。落ち着いた対応で勝利に貢献}
      - {short_voice: true, voice: 現地サポ, text: しかしコヴェントリーはきついなぁ。どうにか流れを変えてほしい、タツが, telop: しかしコヴェントリーはきついなぁ。流れを変えてほしい、タツが}
      - {voice: 現地サポ, text: 平日夜とはいえ、空席が目立つホームのコヴェントリーはあまり良いところがなかった, telop: 平日夜とはいえ、空席が目立つホームのコヴェントリー}
