sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 前半終了で交代。後半45分を無失点
    narrator: キャスター
    card:
      type: table
      title: 試合の流れ
      columns: ["", ""]
      rows:
        - ["6分", "アブラハム（ヴィラ先制）"]
        - ["27分", "トルプ（直接FKで同点）"]
        - ["40分", "バークリー（ヴィラ勝ち越し）"]
        - ["59分", "アブラハム（この日2点目）"]
    say:
      - リーグカップの3回戦、コヴェントリー対アストン・ヴィラです。
      - 結果はヴィラが3対1で勝ちました。
      - 6分にタミー・アブラハムが先制し、27分に直接フリーキックで追いつかれます。
      - 40分にロス・バークリーが勝ち越し、59分にアブラハムがこの日2点目を決めました。
      - そして、この試合の**後半頭から**鈴木彩艶が出ています。
      - 45分を守り切り、無失点でした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012920/
      - https://web.gekisaka.jp/news/world/detail/?458995-458995-fl

  - id: why
    heading: なぜ後半から出たのか
    tier: 報道
    telop: 先発GKが前半終了時に足を引きずっていた
    narrator: 解説
    say:
      - なぜ後半からだったのか。
      - 先発していたのはマルコ・ビゾットというゴールキーパーです。
      - "そのビゾットが、**前半の終わりに足を引きずる様子を見せていた**と伝えられています。"
      - そしてハーフタイムで退きました。
      - "ただし、**負傷と発表されたわけではありません。**"
      - クラブからの発表はなく、程度も離脱の期間も分かっていません。
      - 分かっているのは「足を引きずる様子があり、前半で退いた」ということだけです。
      - 入れ替わりで、鈴木がピッチに立ちました。
      - 守るだけではありませんでした。
      - 精度の高いキックで前線へボールを送り、後ろから攻撃を支えた、と伝えられています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012920/

  - id: sakamoto
    heading: 相手にも日本人がいた
    main: true
    tier: 報道
    telop: コヴェントリーの先発に坂元達裕
    narrator: 解説
    card:
      type: table
      title: この試合の日本人
      columns: ["", ""]
      rows:
        - ["鈴木彩艶", "アストン・ヴィラ／後半45分"]
        - ["坂元達裕", "コヴェントリー／先発"]
        - ["坂元", "コヴェントリーで得点した初の日本人"]
        - ["コヴェントリー", "25年ぶりの1部"]
    say:
      - {short_only: true, text: 先発のゴールキーパーが、前半の終わりに足を引きずって退きました。}
      - {short_only: true, text: 入れ替わりで入った鈴木彩艶が、45分を無失点で守り切っています。}
      - この試合には、もうひとつ日本の名前がありました。
      - "コヴェントリーの先発に、**坂元達裕**がいます。"
      - つまり、この一戦は**日本人対決**でした。
      - 坂元は2023年にベルギーのオーステンデからコヴェントリーへ来ました。
      - "そして**このクラブで得点した、初めての日本人**です。"
      - コヴェントリーは昨季チャンピオンシップを制し、**25年ぶり**に1部へ戻ってきたクラブです。
      - 昇格したばかりの側と、チャンピオンズリーグを戦っている側。
      - その両方に、日本の選手がいたことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012920/
      - https://en.wikipedia.org/wiki/Tatsuhiro_Sakamoto

