    say:
      - 30人を、クラブごとに読み上げます。
      - パリ・サンジェルマンから9人。デンベレ、ハキミ、クヴァラツヘリア。
      - マルキーニョス、ヌーノ・メンデス、ジョアン・ネヴェス。
      - パチョ、ファビアン・ルイス、ヴィティーニャ。
      - バイエルン・ミュンヘンから4人。ケイン、オリーズ、ルイス・ディアス、ウパメカノ。
      - アーセナルから3人。ガブリエウ、デクラン・ライス、サリバ。
      - レアル・マドリードから3人。ベリンガム、エンバペ、ヴィニシウス・ジュニオール。
      - バルセロナから3人。ラミン・ヤマル、パウ・クバルシ、フェラン・トーレス。
      - マンチェスター・シティから2人。ハーランドとロドリ。
      - 残りの6人です。インテル・マイアミのメッシ。
      - インテルのラウタロ・マルティネス。マンチェスター・ユナイテッドのブルーノ・フェルナンデス。
      - チェルシーのククレジャ。アル・ナスルのマネ。アル・カディシアのキニョネス。
      - なお、シーズン途中でクラブを移った選手は、移籍前のクラブでも数えられています。
