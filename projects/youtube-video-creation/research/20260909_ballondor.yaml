      - {voice: ネット民, text: ヤマルはバロンドール投票2位でしたね}
      - {voice: ネット民, text: 久保の名前ないよぅ…}
      - {voice: ネット民, text: 今までで候補に入った日本人って誰おる}
      - {voice: ネット民, text: 今年のバロンドールはライスがいいな}
      - {voice: ネット民, text: クチダケフサ}
      - {voice: ネット民, text: 今季1ゴール1アシストなう}
    official: false
