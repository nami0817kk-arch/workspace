sections:
  - id: what
    heading: 誰が候補に入ったか
    tier: 報道
    telop: 候補30人のうちPSGが9人
    narrator: キャスター
    say:
      - フランス誌フランス・フットボールが8日、2026年のバロンドール候補30人を発表しました。
      - チャンピオンズリーグを連覇したパリ・サンジェルマンから、9人が選ばれています。
      - デンベレ、ハキミ、クヴァラツヘリア、マルキーニョス、ヌーノ・メンデス。
      - ジョアン・ネヴェス、ファビアン・ルイス、パチョ、ヴィティーニャ。
      - 去年の受賞者であるデンベレも候補に入り、2年連続の可能性があります。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458501-458501-fl
      - https://www.footballchannel.jp/2026/09/09/post1006851/

  - id: numbers
    heading: 数字で見るとどうなるか
    tier: 報道
    telop: メッシは通算17回目の候補入り
    narrator: 解説
    say:
      - 国別ではスペインが6人でいちばん多く、フランスが5人です。
      - ポルトガルが3人、ブラジルが3人と続きます。
      - 2024年の受賞者ロドリと、リオネル・メッシも名を連ねました。
      - メッシの候補入りは、これで17回目です。
      - 表彰式には、パリ・サンジェルマンから10人が出席することになるといいます。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458501-458501-fl
      - https://www.footballchannel.jp/2026/09/08/post1006806/

  - id: yashin
    heading: 日本から誰が入ったか
    tier: 報道
    telop: ヤシン賞に山下杏也加
    narrator: キャスター
    say:
      - 同じ日に、部門ごとの候補も発表されています。
      - 女子のバロンドール候補30人に、なでしこジャパンから3人が入りました。
      - 長谷川唯、松窪真心、谷川萌々子。日本人としては史上最多です。
      - 長谷川は2年ぶり3度目の30傑入りになります。
      - さらに、年間最優秀ゴールキーパーに贈られるヤシン賞。
      - 女子の候補に山下杏也加が入り、日本からは合わせて4人になりました。
      - 男子のヤシン賞にはクルトワやラヤ、シモンが名を連ねています。
    official: false
    sources:
      - https://web.gekisaka.jp/news/women/detail/?458499-458499-fl
      - https://web.gekisaka.jp/news/world/detail/?458495-458495-fl
      - https://www.soccer-king.jp/news/world/20260908/2202614.html

  - id: said
    heading: 候補の選手は誰を挙げたか
    tier: 報道
    telop: 「自分には投票しない」
    narrator: 解説
    say:
      - 候補のひとりは、自分が選ぶ3人をこう挙げました。
      - {voice: 候補選手, text: 僕のトップ3は、全部混ざっているよ}
      - {voice: 候補選手, text: クヴァラ、とても良いシーズンを過ごしたハリー・ケイン}
      - {voice: 候補選手, text: それからキリアン・エムバペだと思う}
      - {voice: 候補選手, text: 僕？ ああ、いや}
      - {voice: 候補選手, text: 僕はこういうものに自分を入れることは絶対にない}
      - {voice: 候補選手, text: 自分には投票しないよ}
      - {voice: 候補選手, text: このトロフィーが迷っているとは思わない}
      - {voice: 候補選手, text: パリ・サンジェルマンの選手の手に残ると思う}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35622/
      - https://www.footballchannel.jp/2026/09/08/post1006575/
