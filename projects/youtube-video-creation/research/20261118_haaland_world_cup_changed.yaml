#       "Creo que me ha cambiado a mí y que ha cambiado a Noruega. Ahora hay mucha más gente que sabe quién soy. Cuando llegué a Estados Unidos, no mucha gente sabía quién era. Pero cuando me fui, la mayoría me conocía"
#       "Diría que hemos logrado bastante en los últimos años. Ganamos todos los partidos de la fase de clasificación para el Mundial, llegamos al Mundial y a los cuartos de final. No creo que muchos lo esperaran, al menos yo no. Ahora trataremos de clasificarnos también para la Eurocopa"
#       "Tengo asuntos privados de los que no quiero que nadie escriba ni hable. Ya sea mi familia, mi casa o algo así, es algo que no me gusta"
#       "Puedo mostrar quién soy de una manera diferente a como lo hago en una entrevista posterior al partido"
#       "Por eso, publicar una foto completamente aleatoria puede ser muy bueno. Creo que me he hecho mayor y tal vez he ganado más confianza en mí mismo. Me siento más seguro al compartir cosa[s]"（末尾は原文のまま。切れていた所は補っていない）
#       "Respeto al cien por cien a quienes no quieren compartir nada sobre su vida, o lo que sea, como hacía yo antes. Y también respeto a quienes publican mucho, o bastante"
#       → 台本の言葉は、このスペイン語を私が日本語にしたもの。TV2 の原文ではなくマルカの訳からの重訳であることを、台本は「スペインの報道によると」と断る。
