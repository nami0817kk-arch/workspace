    image: assets/photos/ll/alaves/alaves_legend_fde608ec.jpg
  - プロのデビューもこのクラブ。1年で、リーグ戦**32試合1得点**。
  - クラブ初の国王杯決勝では、バルセロナから直接フリーキックで同点弾。**1対3**で敗れました。
