    image: assets/photos/ll/alaves/alaves_legend_beff6e54.jpg
  - 決勝では、右からのクロスで2点を演出。その活躍で、欧州の年間ベストイレブンに入りました。
  - リーグ戦で**66試合5得点**。2001年に、ミランへ移りました。
  sources:
