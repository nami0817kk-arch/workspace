- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 史上最高の滑り出し。率いるのはキケ監督
  narrator: キャスター
  say:
  - text: 今シーズンは**4節**で**2位**。クラブ史上最高の滑り出しで、**7節**を終えて**6位**です。
    image: assets/stats/ll_alaves_data_r1.png
    no_telop: true
  - text: 率いるキケ・サンチェス・フローレス監督は、こう話します。
    image: assets/stats/ll_alaves_data_r2.png
    no_telop: true
  - voice: キケ・サンチェス・フローレス
    text: 幸せなときは、あふれさせて味わうものだ
    image: assets/stats/ll_alaves_data_r2.png
  - voice: キケ・サンチェス・フローレス
    text: 人生はダンス。踊らなければ
    image: assets/stats/ll_alaves_data_r2.png
  - text: 昨シーズンの途中、3月に監督が替わってから**16節**で、勝ち点**26**。
    image: assets/stats/ll_alaves_data_r2.png
    no_telop: true
  - text: 上回ったのは、バルセロナとレアル・マドリードだけです。
    image: assets/stats/ll_alaves_data_r2.png
    no_telop: true
  - text: そしてこのクラブは、初めての欧州の大会で決勝へ。延長の末、オウンゴールで敗れています。
    image: assets/stats/ll_alaves_data_r3.png
    no_telop: true
  - image: assets/stats/ll_alaves_data0.png
    text: 創立は**1921年**。大学生たちのクラブが名前を変えて、アラベスになりました。
    no_telop: true
  - image: assets/stats/ll_alaves_data1.png
    text: 愛称は「ババソロス」。バスク語で**豆の袋**。ビトリアの人たちの、昔からの呼び名です。
    no_telop: true
  - image: assets/stats/ll_alaves_data2.png
    text: ホームタウンはビトリア＝ガステイス。バスク自治州の州都で、人口は**26万人**。
    no_telop: true
  - image: assets/backgrounds/stadium_アラベス.png
    text: 本拠地は**1924年**開場のメンディソローサ。**1万9840人**は、20クラブで**3番目**に少ない。
  - image: assets/stats/ll_alaves_data4.png
    text: オーナーはホセアン・ケレヘタ。地元のバスケットボールの強豪、バスコニアの会長です。
    no_telop: true
  - image: assets/stats/ll_alaves_cups.png
    text: 1部も国王杯も、優勝はありません。2部では**4回**優勝しています。
    no_telop: true
  - image: assets/stats/ll_alaves_data6.png
    text: 最多出場は、アルゼンチン出身の中盤、マルティン・アストゥディージョ。**346試合**です。
    no_telop: true
  - image: assets/stats/ll_alaves_data7.png
    text: 直近のタイトルは、2015年から16年の2部優勝です。
    no_telop: true
  - image: assets/stats/ll_alaves_data8.png
    text: 昨シーズンのリーグ戦は**14位**。勝ち点は**43**でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_Alavés
  - https://en.wikipedia.org/wiki/Template:2026%E2%80%9327_La_Liga_table
  - https://www.marca.com/futbol/alaves/2026/09/06/quique-dinamica-merece-equipo-aficion.html
  - https://www.marca.com/futbol/alaves/2026/09/08/mejor-alaves-historia.html
  - https://en.wikipedia.org/wiki/2001_UEFA_Cup_final
  bg: assets/backgrounds/stadium_アラベス_in.png
  official: false
- id: history
  heading: 3部から6年で
  tier: 背景
  telop: 3部にいたクラブが、6年でヨーロッパへ
  narrator: 解説
  card:
    type: table
    title: 3部から6年で
    columns: &id001
    - ''
    - ''
    rows:
    - - 1930年
      - 2部から最初の1部昇格
    - - 1995年
      - 3部から2部へ
  say:
  - 1929年から30年の2部で優勝。2部から1部へ上がった、最初のクラブです。
  - その後は長く低迷し、1990年代の半ばまで3部で戦っていました。
  - text: '**1995年**に2部へ上がると、**1998年**には2部で優勝。**42年**ぶりに1部へ戻ります。'
    card:
      type: table
      title: 3部から6年で
      columns: *id001
      rows:
      - - 1998年
        - 2部優勝。42年ぶりの1部
      - - 2000年
        - 1部で6位。欧州の大会へ
  - 戻って2シーズン目は**6位**。クラブ最高の順位で、ヨーロッパへの切符を得ました。
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_Alav%C3%A9s
  - https://es.wikipedia.org/wiki/Deportivo_Alav%C3%A9s
  bg: assets/backgrounds/stadium_アラベス_in.png
  official: false
- id: history2
  heading: 9点が入った決勝
  tier: 背景
  telop: 決勝はリヴァプール。延長の末に
  narrator: 解説
  card:
    type: table
    title: 2001年 ヨーロッパの決勝
    columns: &id002
    - ''
    - ''
    rows:
    - - 勝ち上がり
      - インテルに敵地で2対0
    - - 準決勝
      - 2試合合計9対2
  say:
  - 勝ち上がる途中、インテルにミラノで**2対0**。準決勝は、2試合合計**9対2**でした。
  - 決勝の相手はリヴァプール。**1対3**から追いつき、終了2分前に**4対4**。
  - text: 延長は、先に決めたほうが勝ち。アラベスは退場者を2人出し、**9人**で守っていました。
    card:
      type: table
      title: 2001年 ヨーロッパの決勝
      columns: *id002
      rows:
      - - 決勝
        - リヴァプールに4対5
      - - 延長116分
        - オウンゴールで決着
  - 延長の残り**4分**。相手のフリーキックが、アラベスの選手の頭に当たってゴールへ。
  - '**4対5**。クラブ初の欧州の大会は、準優勝で終わりました。'
  sources:
  - https://en.wikipedia.org/wiki/2001_UEFA_Cup_final
  - https://es.wikipedia.org/wiki/Deportivo_Alav%C3%A9s
  bg: assets/backgrounds/stadium_アラベス_in.png
  official: false
- id: history3
  heading: 8年後の3部
  tier: 背景
  telop: 借金を抱え、2009年に3部へ
  narrator: 解説
  card:
    type: table
    title: 決勝のあとで
    columns:
    - ''
    - ''
    rows:
    - - 2004年
      - 新しいオーナーが株の51%
    - - 2007年
      - オーナーが去り、借金が残る
    - - 2009年
      - 3部へ降格
  say:
  - '**2004年**、ウクライナ出身の実業家が、株の**51%**を買います。'
  - 監督や選手、ファンとぶつかり、**2007年**に去ったあとには、大きな借金が残りました。
  - '**2009年**、ついに3部へ。そこで**4シーズン**戦い、**2013年**に2部へ戻りました。'
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_Alav%C3%A9s
  - https://es.wikipedia.org/wiki/Deportivo_Alav%C3%A9s
  bg: assets/backgrounds/stadium_アラベス_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 走りすぎずに守る。系列で回す。物を言うスタンド
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 走りすぎずに守る
    - - 運営の型
      - 系列のクラブで回す
    - - クラブの気質
      - 5分遅れて入る抗議
  say:
  - text: キケ監督のチームは、走る距離がリーグで**4番目**に短い。
    image: assets/photos/ll/alaves/alaves_manager_9f0d84e4.jpg
  - それでも失点**6**は、リーグで最も少ない数に並びます。
  - ピッチの外は、系列のクラブで選手を回す型。
  - '**2018年**、クロアチアのイストラの株を**85%**取得。守備の要のコスキも、そこから来ました。'
  - スタンドは物を言う。**2019年**、月曜夜の試合に抗議し、ファンは**5分**遅れて席に着きました。
  sources:
  - https://en.wikipedia.org/wiki/Deportivo_Alavés
  - https://www.marca.com/futbol/alaves/2026/09/23/quique-reduce-kilometraje-alaves.html
  - https://www.marca.com/futbol/alaves/2026/09/21/revolucion-defensiva-quique.html
  - https://en.wikipedia.org/wiki/NK_Istra_1961
  - https://en.wikipedia.org/wiki/Ville_Koski
  - https://alaves.elcorreo.com/cinco-minutos-tarde-20190128204106-nt.html
  bg: assets/backgrounds/stadium_アラベス_in.png
  official: false
