  - text: 守り切って積んだイタリアと、取られても取り返して積んだスペイン。
    card:
      type: table
      title: スペインの40試合とイタリアの37試合
      columns: *id009
      rows: *id010
      highlight_row: 4
  - text: ただ、W杯の守りは別でした。大一番では、きっちり締めています。
    card:
      type: table
      title: スペインの40試合とイタリアの37試合
      columns: *id009
      rows: *id010
      highlight_row: 3
  - text: 次のチェコ戦は、日本時間10月4日の午前3時45分キックオフ。
    card:
      type: table
      title: スペインの40試合とイタリアの37試合
      columns: *id009
      rows: *id010
  - text: 会場はスペイン北部のオビエド。勝つか引き分ければ、無敗は41試合です。
    card:
      type: table
      title: スペインの40試合とイタリアの37試合
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: いまは9連勝中。勝てば10連勝で、デ・ラ・フエンテ監督のもとで最長です。
    card:
      type: table
      title: スペインの40試合とイタリアの37試合
      columns: *id009
      rows: *id010
  - text: チェコはこの大会、2試合を終えてまだ勝ち点がありません。
