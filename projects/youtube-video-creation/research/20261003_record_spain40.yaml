# チェコ戦（日本時間 10/4 3:45）の前に出す回。チェコ戦の結果は書かない。
# 記録の一覧・勝ち分けは FIFA の記事（2026-09-29）が正。RFEF の公式の記述には辿り着けなかった（一覧が JS 描画）。
# 40試合・イタリア37試合のスコアは英語版Wikipedia の試合枠で数え、40試合は Flashscore の一覧と1試合ずつ一致を確かめた。
#   得点102は自分で数えた値（Flashscore の本文の「109」は同じ記事のスコアを足すと合わない）。失点31・勝ち分けは FIFA と一致。
# PK戦の扱いは FIFA の記事に文では無い。スペインの40（31勝9分）にポルトガルとの決勝（PK負け）、イタリアの37（28勝9分）にユーロ2020の
#   準決勝・決勝（PK勝ち）が入っていることから「勝っても負けても引き分け」と言っている。
# 9連勝が監督の最長に並ぶのは Goal（Opta）。自分の一覧でも 2024年6〜7月とサウジアラビア戦〜クロアチア戦がどちらも9。
