  - text: 9月29日、スペインのセビージャ。スペイン代表がクロアチアを4-1で下しました。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
    image: assets/images/20261003_record_spain40/01_trophy_w.jpg
  - text: 19歳のラミン・ヤマルが2点。負けなしの記録を、また1つ伸ばしました。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 試合の前には、主将のロドリがW杯のトロフィーを観客に披露しました。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
  - text: トロフィーをここに持ってこられて、すごくうれしかった。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
    voice: ラミン・ヤマル
  - text: 試合に勝って、それを地元に持ち帰れたのは最高だ。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
    voice: ラミン・ヤマル
    cont: true
  - text: 負けなしは、これで40。ここまで続けた代表チームは、歴史上ありません。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 5
    emph: true
  - text: 最後に負けたのは2024年3月、コロンビアとの親善試合でした。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 4日後のブラジル戦、3-3の引き分けから記録は始まります。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: そこから31勝9分け。積み上げた得点は102、失点は31です。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: その間に、ユーロ2024とW杯2026、2つの大きな大会を制しました。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 率いるのは、2022年W杯のあとに就いたデ・ラ・フエンテ監督です。
    card:
      type: table
      title: 40試合無敗の基礎DATA
      columns: *id001
      rows: *id002
