- id: secret
  heading: 優勝を決めた日と、引退試合の日に、何があったのか
  tier: 報道
  telop: 優勝を決めた日と、三ツ沢の日
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &nsecret_rows
    - ['2007年4月', 優勝を決めて、観客席へ飛び込む]
    - ['2023年12月', 三ツ沢で、初めて観た試合の話]
    source: Scotsman・AFP・ゲキサカ
  say:
  - text: ここからは、数字の外にある話を、2つ。
    image: assets/images/20261020_nakamura_shunsuke_legend/01_v.jpg
    card: &nsecret_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *nsecret_rows
      source: Scotsman・AFP・ゲキサカ
      highlight_row: 0
  - text: 1つ目は、2007年4月22日、キルマーノック戦。
    card:
      <<: *nsecret_card
      highlight_row: 0
  - text: 同点のまま迎えたロスタイム。ゴールの少し手前で、ファールを受けます。
    card: none
  - text: 左足が決めて、2対1。セルティックは、残り4試合で優勝を決めました。
    card: none
  - text: 中村俊輔は、シャツを脱いで、サポーターの中へ飛び込みます。
    card: none
  - text: ここは、本人の言葉です。英語の報道からの訳。
    card: none
  - voice: 中村俊輔
    text: あんなことをしたのは初めてだけど、
  - voice: 中村俊輔
    text: ずっと、観客の中に走り込んでみたかったんだ。
    cont: true
    pause: 0.6
  - text: その夜、選手が選ぶ年間最優秀選手に。アジア人で初めての、欧州リーグの受賞でした。
    card: none
  - text: 2つ目は、2023年12月、三ツ沢の引退セレモニー。
    image: assets/images/20261020_nakamura_shunsuke_legend/02_w.jpg
    card:
      <<: *nsecret_card
      highlight_row: 1
  - text: プロ初ゴールも、直接フリーキックで、同じ三ツ沢でした。
    card: none
  - voice: 中村俊輔
    text: 思えば最初にサッカー観戦というものをしたのがここ三ツ沢で、
    card:
      type: document
      label: 引退セレモニーでのスピーチ（2023年12月17日）
      paragraphs:
      - 思えば最初にサッカー観戦というものをしたのがここ三ツ沢で、ちょうどあの辺の席で、コンクリートの椅子だった時です。父親に連れられて見たのが日産自動車と読売クラブの試合でした。
      - 両チームの10番、木村和司さんとラモス瑠偉さんに魅了され、自分もああなりたいと思ったのが全ての始まりだったんじゃないかなと思います。
      highlight: [三ツ沢, 木村和司, ラモス瑠偉, 全ての始まり]
  - voice: 中村俊輔
    text: ちょうどあの辺の席で、コンクリートの椅子だった時です。
    cont: true
  - voice: 中村俊輔
    text: 父親に連れられて見たのが日産自動車と読売クラブの試合でした。
    cont: true
  - voice: 中村俊輔
    text: 両チームの10番、木村和司さんとラモス瑠偉さんに魅了され、
    cont: true
  - voice: 中村俊輔
    text: 自分もああなりたいと思ったのが
    cont: true
  - voice: 中村俊輔
    text: 全ての始まりだったんじゃないかなと思います。
    cont: true
    pause: 0.6
  quotes_from:
  - https://web.gekisaka.jp/news/jleague/detail/%3F398056-398056-fl
  - https://archive.thedailystar.net/2007/04/24/d70424043353.htm
  sources:
