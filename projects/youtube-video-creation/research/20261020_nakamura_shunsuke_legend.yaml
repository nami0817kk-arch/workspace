- id: after
  heading: 引退した左足は、いま誰に、何を教えているのか
  tier: 報道
  telop: 引退のあと、指導者へ
  card:
    type: timeline
    title: 引退のあと
    rows:
    - ['2022年10月', 現役を引退（44歳）]
    - ['2023年12月', 引退試合で6ゴール]
    - ['2023〜25年', 横浜FCのコーチ]
    - ['2026年4月', 日本代表のコーチに就任]
    - ['2026年9月', セットプレーの攻撃を担当]
    focus: 4
    highlight_row: 0
  say:
  - text: 2022年10月18日、現役の引退を発表。26年のプロ生活でした。
    image: assets/images/20261020_nakamura_shunsuke_legend/02_w.jpg
    card: &nafter_tl
      type: timeline
      title: 引退のあと
      rows:
      - ['2022年10月', 現役を引退（44歳）]
      - ['2023年12月', 引退試合で6ゴール]
      - ['2023〜25年', 横浜FCのコーチ]
      - ['2026年4月', 日本代表のコーチに就任]
      - ['2026年9月', セットプレーの攻撃を担当]
      focus: 4
      highlight_row: 0
  - voice: 中村俊輔
    text: 幼稚園のときにサッカーボールを蹴り始めてから、
    image: assets/images/20261020_nakamura_shunsuke_legend/02_w.jpg
  - voice: 中村俊輔
    text: 40年もの月日が経ちました。
    cont: true
    pause: 0.5
  - text: 2023年12月17日、三ツ沢の引退試合。6ゴールのうち、3本が直接フリーキック。
    card: none
  - text: 引退後は、横浜FCのコーチに。2025年には、指導者のプロライセンスも取ります。
    card:
      <<: *nafter_tl
      highlight_row: 2
  - text: 2026年4月16日、ワールドカップを戦う日本代表の、コーチに就任。
    image: assets/images/20261020_nakamura_shunsuke_legend/04_w.jpg
    card:
      <<: *nafter_tl
      highlight_row: 3
  - text: 就任のコメントには、慎重に考えた、とありました。
    card: none
  - voice: 中村俊輔
    text: 森保監督から熱く力強いお言葉をいただき、
  - voice: 中村俊輔
    text: お引き受けする決意をいたしました。
    cont: true
    pause: 0.5
  - text: 9月の代表発表で、中村コーチは、セットプレーの攻撃を任されることになります。
    card:
      <<: *nafter_tl
      highlight_row: 4
  - text: セットプレーとは、コーナーキックなど、試合を止めて始めるプレー。
    card: none
  - text: 24本の左足は、いま、日本代表の攻めを考える側にいます。
    card:
      <<: *nafter_tl
      highlight_row: 4
