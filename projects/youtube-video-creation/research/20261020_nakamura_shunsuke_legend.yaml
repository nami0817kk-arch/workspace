# 中村俊輔（元日本代表）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-20。型は 10/18 の中田英寿・10/19 の長谷部誠と同じ8節。
# ①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（＋通算の表）⑤「あの試合」＝2006-11-21 チャンピオンズリーグ セルティック対マンチェスター・ユナイテッド ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Sofascore 等は不使用**。パーセンタイル・レーダー・シュートマップは出さない。数字は公式の記録（JFA・Jリーグ公式）と、自分で割った値だけ。
# **引退後の私生活・法的な問題は入れない**（家族・結婚・CM・事業・著書・香水は不使用）。女子・Jリーグ以外の話は無し（ただし本人の経歴としてJ1の数字は使う）。
#
# **brief の指定を読み直して、食い違ったもの（台本では下の読み直した形を使う）**
# - 「3連覇＝2006-07〜2008-09」は誤り。**セルティックのリーグ優勝は 2005-06・2006-07・2007-08 の3回（連続）**。2008-09 は優勝していない（ジャパン側の記録でも同じ）。
#   出典：英語版・日本語版 Wikipedia の Honours、サッカーキング 2022-10-18（引退の記事：「2005－06シーズンからのスコティッシュ・プレミアシップ3連覇に大きく貢献」）、
#   These Football Times 2018-11-09（2005-06 はハーツに1対0で、残り6試合で優勝）、AFP 2007-04-24（Daily Star。2年連続の優勝）、worldsoccertalk 2008-05-24 ほか（2007-08 は最終節で優勝、3年連続）。
#   中村俊輔は 2005年7月（29日）に加入、2009年6月に退団＝**3回とも優勝した季にいた**（4季目の 2008-09 は優勝なし）。
# - 「ミラノ戦（2006年CL）のFK」は誤り。**FKを決めたのはマンチェスター・ユナイテッド戦の2試合**（2006-09-13 オールド・トラッフォード＝2対3の負けの中の1点／2006-11-21 セルティック・パーク＝81分の1点で1対0）。
#   ミランとは 2006-07 の決勝トーナメント1回戦で当たり、**ホーム0対0・ミラノで延長0対1（カカの得点）**。中村俊輔は両試合に出たがゴールなし。
#   Goal.com 日本版 2018-09-13（本人インタビュー）も「CL本戦17試合出場2得点」と言う（＝ユナイテッド戦の2点）。
# - 「プレミア出場はない」は正しい（クラブ：横浜M・レッジーナ・セルティック・エスパニョール・磐田・横浜FC）。2010年1月にストラカン監督のミドルスブラ（イングランド2部）から誘いが来たが本人が断った（日本語版 Wikipedia。英語版も同じ）。
# - 「横浜FCでの現在」は誤り。**2023〜2025年に横浜FCのコーチ、2026年4月16日から日本代表コーチ**（JFA 公式）。引退は 2022年（10月18日発表）。
#
# **数字の出どころ（読んだもの）**
# - JFA 公式「SAMURAI BLUE コーチに中村俊輔氏が就任」2026-04-16（jfa.jp/news/00036247/。選手歴・リーグ戦成績・指導歴・資格・本人のコメント。確定）：
#   J1 408試合73得点／J2 16試合1得点／セリエA 81試合11得点／スコットランド 128試合29得点／ラ・リーガ 13試合0得点／日本代表 98試合24得点（W杯 2006・2010）／指導歴 2023〜2025 横浜FC コーチ／2025年 JFA Pro ライセンス。
#   **リーグ戦の合計は自分で足した：試合 408+16+81+128+13＝646、得点 73+1+11+29+0＝114**（英語版 Wikipedia は115、日本語版は114。JFA の数字を足して 114 と一致）。
# - Jリーグ公式（jleague.jp/news/article/12071/、2018-05-16。データスタジアム協力）：J1の直接FK得点ランキング 1位 中村俊輔24点（2位 遠藤保仁に7点差＝2位は17点）、1シーズンの最多は 2013年の4点。確定。
#   **24÷73＝約33％（3分の1）、408÷24＝17（約17試合に1本）は自分で割った**。24点は 2017-09-23 の磐田対大宮戦で達成（サッカーダイジェスト・Number の報道。Number 2020-01 も24）。以後のJ1で増えたかは見ていない＝語りは「2018年5月の時点で2位は17本」と言い切らず時点を付ける。
# - サッカーキング 2022-10-18「中村俊輔が現役引退」：経歴の概要（22歳でJリーグMVP＝史上最年少、2006-07 CL でユナイテッドから直接FK2本、スコットランドPFA年間最優秀選手＝アジア人初の欧州リーグMVP、2005-06からの3連覇）、本人のコメント全文（横浜FC公式サイト経由）。
# - ゲキサカ 2023-12-17「中村俊輔氏、自慢の左足FK3発に計6ゴール!! 「全ての始まり」三ツ沢で引退試合&セレモニー」：引退試合の記録（横浜FC 3-6 J-DREAMS、FK3本・6得点）と、引退セレモニーでの本人のスピーチ（原文のまま）。
# - Goal.com 日本版 2018-09-13「【中村俊輔が語るCL】マンチェスター・U戦、伝説のFKを回顧『駆け引きはなかった。ゾーンに入っていたから』」（本人インタビュー。日本語の原文。CL本戦17試合2得点も）。
# - 試合記録：The Celtic Wiki（BBC の試合レポートの転載。2006-11-21 セルティック1-0マンU：81分、ファン・デル・サール、ボルツがサハのPKを止める、ストラカンの言葉。2006-09-13 マンU3-2セルティック：ヴェネゴール21分・中村43分／サハ30分PK・40分・ソルシャール47分）、
#   Mail & Guardian（AFP 2006-11-22。決勝トーナメント初進出）、These Football Times 2018-11-09（試合の流れ。**決勝トーナメント進出は現行のCLになって初**）、英語版 Wikipedia（2006–07 の節。ミラン戦0-0・0-1延長）。
#   ※ The Celtic Wiki は非公式のファンサイト（domain_tiers では enthusiast＝未確認）だが、**BBC・Scotsman の記事本文をそのまま転載している**ので、本文は読んだうえで報道として扱う（出典欄は元の媒体名を併記）。
# - 優勝を決めた試合（2007-04-22 キルマーノック 1-2 セルティック）：The Celtic Wiki 転載の Scotsman（ストラカンの言葉「天才」「テクニックならナカが最高」と、本人のコメント英語原文）、AFP 2007-04-24（Daily Star。本人の言葉 英語原文）、FilGoal 2007-04-23（92分のFK、優勝は4週間前、2位に13点差）、These Football Times。
# - 日本語版・英語版 Wikipedia「中村俊輔」「Shunsuke Nakamura」：生年月日・身長・位置・経歴・タイトル・個人賞・W杯（2010年は途中出場1試合）。英語版 Wikipedia「2010 FIFA World Cup Group E」：日本対オランダで64分に交代出場。
# - サッカーキング 2026-09-17「『変える必要はない』森保一監督がコーチ陣留任の背景語る…長谷部誠・中村俊輔コーチらの役割変更で…」：中村コーチが前田コーチに代わってセットプレーの攻撃を担当（森保監督の発言。**同じ記事を 10/19 の長谷部の回が使っているので、こちらは引用せず「セットプレーの攻撃を任された」の1点だけ使う**）。
# - 検索エンジンのAI要約は使っていない（URLを探すのに使っただけ。本文は requests で読んだ）。ブラウザ操作の道具・JavaScript実行は使っていない。Transfermarkt は見ていない。
#
# **数字の食い違い・判断（台本での扱い）**
# - 通算の得点：JFA 合計 114／英語版 Wikipedia 115。**JFA の足し算の 114 を使う**。語りでは「646試合114得点」。
# - 直接FKの24本：**J1の記録**（J2・セルティック・イタリアは含まない）。「J1で」と必ず付ける。73得点のうち24＝約3分の1。
# - CL 初得点：英語版は「Champions League の最初の日本人得点者」、奥寺康彦（1978-79 欧州チャンピオンズカップ）が先にいる。**語りは「現在のチャンピオンズリーグになってから日本人初」**（日本語版 Wikipedia の言い方）。
# - 81分：BBC転載・These Football Times・Wikipedia は81分、別の報道は80分。**81分を使う**。距離：BBC転載は「30ヤード」、These Football Times も「fully 30 yards」。語りは「30ヤード、およそ27メートル」（自分で換算）。
# - 優勝を決めた日のFK：FilGoal は「92分」、Scotsman は「ロスタイム」。語りは「ロスタイム」。
# - 本人の言葉：日本語の原文があるもの（Goal.com 日本版・サッカーキング〈引退コメント〉・ゲキサカ〈引退セレモニー〉・JFA 公式のコメント）だけ原文のまま。
#   **英語の報道（AFP・Scotsman）の本人の言葉は日本語に訳した**（原文は取材メモに残す。訳であると台本の語りで言う）。ストラカンの言葉も英語原文からの訳。
# - 2010年のW杯：出場は途中出場の1試合（日本語版 Wikipedia。英語版 Group E の記録でオランダ戦64分に交代出場が確認できる）。語りは「出場は、途中出場の1試合」。
# - 日本語版 Wikipedia の「テクニカルアドバイザー（ジュビロ磐田・2026）」は JFA にも他の記事にも無いので**使わない**。
# - ミドルスブラの件：日本語版 Wikipedia が「本人が断った」、英語版は「受けるか疑問だった」。**「誘われたが、断った」を使う**（日本語版）。
# - 「10本中10得点」（セルティックの練習でのFK競争）は football-zone の記事を開けず、他の出典も無いので使わない。
#
# **入れなかったもの**：移籍金・年俸・家族・結婚・CM・事業・著書・「メシア10」・ビデオゲームの表紙・テレビのパフォーマンス・ラグビーボールのキック・Transfermarkt・
#   Wikipedia の「ボール速度100km/h」「毎秒7.5回転」（出典が大学教授の談話の孫引きで、原文を読んでいない）・Honda との FK 衝突（日刊スポーツ原文を読んでいない）・2006年W杯の「物議を醸した先制点」の細部。
# **日本語名・読みで怪しいもの**：中村俊輔・横浜マリノス・レッジーナ・セルティック・エスパニョール・ミドルスブラ・ストラカン・ボルツ・ファン・デル・サール・オールド・トラッフォード・キルマーノック・
#   桐光学園・三ツ沢・木村和司・ラモス瑠偉・遠藤保仁・森保一・前田・ミラン・カカ・サハ・ヴェネゴール・ソルシャール・ハーツ・ダンディー・ユナイテッド・ロアッソ熊本・J-DREAMS。
# 本人の言葉は：①Goal.com 日本版 2018-09-13（日本語・原文）②横浜FC 公式サイト経由の引退コメント 2022-10-18（日本語・サッカーキングの引用）③ゲキサカ 2023-12-17 の引退セレモニーのスピーチ（日本語）
#   ④JFA 公式の就任コメント 2026-04-16（日本語）⑤AFP 2007-04-24（英語・訳）。ほかの人の言葉：ストラカン（Scotsman 2007-04-22 の英語・訳）。
