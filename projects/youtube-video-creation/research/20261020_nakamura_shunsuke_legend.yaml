- id: match
  heading: 2006年11月21日、30ヤード先のゴールに、何が待っていたのか
  tier: 報道
  main: true
  telop: 81分の左足、決勝トーナメントへ
  card:
    type: stats
    title: チャンピオンズリーグ（2006年11月21日）
    items:
    - ['81', 分, 中村俊輔のフリーキック]
    - ['1', 対0, セルティックがマンチェスター・ユナイテッドに勝つ]
    - ['2', 得点, この年、ユナイテッドから決めた数（CL）]
    focus: 0
  say:
  - text: 中村俊輔の最も大きな試合は、2006年11月21日。
    image: assets/images/20261020_nakamura_shunsuke_legend/03_w.jpg
    short_only: true
    card: none
  - text: チャンピオンズリーグ、対マンチェスター・ユナイテッド。
    short_only: true
    card: none
  - text: セルティック・パークでのグループ戦。勝てば、決勝トーナメント進出が決まります。
    image: assets/images/20261020_nakamura_shunsuke_legend/01_w.jpg
    card: none
  - text: 後半81分。ゴールまで30ヤード、およそ27メートル。
    emph: true
    image: assets/images/20261020_nakamura_shunsuke_legend/03_w.jpg
    card: &nmatch_tl
      type: timeline
      title: 2006-07 チャンピオンズリーグ ユナイテッド戦
      rows:
      - ['9月13日', 'オールド・トラッフォードで2対3。FKで1点']
      - ['11月21日', 'セルティック・パークで1対0。81分のFK']
      - ['決勝T1回戦', 'ミランに0対0、延長0対1']
      focus: 1
      highlight_row: 1
  - text: ペナルティエリアの外で、フリーキックを得ます。
    card: none
  - voice: 中村俊輔
    text: あの時間にファールをもらって
  - voice: 中村俊輔
    text: 「やっと自分の時間が来た」と思ったかな。
    cont: true
  - voice: 中村俊輔
    text: もう狙うことしか考えてなかった。
    cont: true
  - voice: 中村俊輔
    text: 今考えたら「あんな遠いところからよく入ったな」って。
    pause: 0.5
  - text: 左足で巻いたボールは、GKファン・デル・サールの先、ゴールの上の隅へ。先制です。
    emph: true
    card:
      <<: *nmatch_tl
      highlight_row: 1
  - text: 直後、ユナイテッドのPK。GKボルツが、止めました。
    card: none
  - voice: 中村俊輔
    text: もちろんうれしかった。だけど正直あんまり覚えていなくて。
    pause: 0.5
  - text: 1対0の勝ち。大会が今の形になって、クラブ初の決勝トーナメント。
    card:
      type: stats
      title: チャンピオンズリーグ（2006年11月21日）
      items:
      - ['81', 分, 中村俊輔のフリーキック]
      - ['1', 対0, セルティックがマンチェスター・ユナイテッドに勝つ]
      - ['2', 得点, この年、ユナイテッドから決めた数（CL）]
      focus: 1
  - text: 決勝トーナメントの1回戦は、ミラン。ホームは0対0、ミラノでは延長で0対1でした。
    card:
      <<: *nmatch_tl
      highlight_row: 2
  - text: 9月にも、同じユナイテッドから、フリーキックで得点。
    card:
      <<: *nmatch_tl
      highlight_row: 0
  - text: それは、今の形のチャンピオンズリーグでは、日本人初の得点でした。
    card: none
  quotes_from:
  - https://www.goal.com/jp/%E3%83%8B%E3%83%A5%E3%83%BC%E3%82%B9/%E4%B8%AD%E6%9D%91%E4%BF%8A%E8%BC%94%E3%81%8C%E8%AA%9E%E3%82%8Bcl%E3%83%9E%E3%83%B3%E3%83%81%E3%82%A7%E3%82%B9%E3%82%BF%E3%83%BCu%E6%88%A6%E4%BC%9D%E8%AA%AC%E3%81%AEfk%E3%82%92%E5%9B%9E%E9%A1%A7%E9%A7%86%E3%81%91%E5%BC%95%E3%81%8D%E3%81%AF%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%E3%82%BE%E3%83%BC%E3%83%B3%E3%81%AB%E5%85%A5%E3%81%A3%E3%81%A6%E3%81%84%E3%81%9F%E3%81%8B%E3%82%89%E7%8B%AC%E5%8D%A0%E3%82%A4%E3%83%B3%E3%82%BF%E3%83%93%E3%83%A5%E3%83%BC%E4%B8%AD%E7%B7%A8/okhv04l43hoz1s0zmun77vojv
  sources:
  - https://www.thecelticwiki.com/2006-11-21%3A-Celtic-1-0-Manchester-Utd%2C-Champions-League---%22This-is-priceless%22-%28Gordon-Strachan%29
  - https://www.thecelticwiki.com/2006-09-13-manchester-united-3-2-celtic-champions-league/
  - https://mg.co.za/article/2006-11-22-nakamura-gives-celtic-british-bragging-rights/
  - https://thesefootballtimes.co/2018/11/09/how-the-devilishly-talented-shunsuke-nakamura-became-a-celtic-legend/
