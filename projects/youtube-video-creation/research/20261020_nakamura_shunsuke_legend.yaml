- id: style
  heading: 中村俊輔の強みは、左足のフリーキックだけだったのか
  tier: 報道
  telop: 警戒されても、決めてきた
  card:
    type: table
    title: どこで、何を決めたか
    columns:
    - 項目
    - 数字
    rows: &nstyle
    - - J1の得点
      - 73
    - - うち直接フリーキック
      - 24（歴代1位）
    - - 1シーズンの最多
      - 4（2013年）
    source: Jリーグ公式・JFA
  say:
  - text: 武器は、左足。精度の高いボールを配る、攻撃の中心でした。
    image: assets/images/20261020_nakamura_shunsuke_legend/03_w.jpg
    card: none
  - text: フリーキックは、警戒されるほど、練習のやり方を変えたと言います。
    image: assets/images/20261020_nakamura_shunsuke_legend/01_w.jpg
    card: none
  - voice: 中村俊輔
    text: 他のチームに警戒されるようになりましたね。
  - voice: 中村俊輔
    text: 壁を増やしたり、蹴る瞬間に仕掛けをしてきたり、
    cont: true
  - voice: 中村俊輔
    text: ゴールの中に人を入れてみたり……。
    cont: true
    pause: 0.5
  - voice: 中村俊輔
    text: そのために練習では、ゴール前に柵を置いて、
  - voice: 中村俊輔
    text: 本当に隅の隅しか入らないようにするとかね。
    cont: true
    pause: 0.5
  - text: J1では、2018年5月の時点で、2位が17本。7本の差です。
    emph: true
    card: &style_card
      type: table
      title: どこで、何を決めたか
      columns: [項目, 数字]
      rows: *nstyle
      source: Jリーグ公式・JFA
      highlight_row: 1
  - text: リーグ戦の通算は、646試合で114得点。内訳は、表のとおり。
    emph: true
    card: &ntotal_card
      type: table
      title: 中村俊輔 通算（リーグ戦）
