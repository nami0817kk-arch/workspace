sections:
- id: hook
  heading: 日本は、なぜセネガルに勝てていないのか
  tier: 背景
  telop: 日本は4戦して0勝。W杯では4試合で10得点
  narrator: 解説
  main: true
  say:
  - text: セネガル代表。フィファランクは18位の国です。
    image: assets/stats/tb_senegal_data_t.png
    short_only: true
    no_telop: true
  - text: 日本とセネガルは、これまで4回戦いました。
    image: assets/stats/tb_senegal_data_t.png
    no_telop: true
  - text: 引き分けが2つ、負けが2つ。勝ちは、まだありません。
    image: assets/stats/tb_senegal_data_r2.png
    no_telop: true
    emph: true
  - text: 2018年のワールドカップでも、勝ち切れずに終わっています。
    image: assets/images/20261128_team_senegal/b01_w.jpg
    no_telop: true
  - text: そのセネガルは、2026年のW杯で、4試合で10点。前回2022年の、倍の得点です。
    image: assets/stats/tb_senegal_data_r1.png
    no_telop: true
  - text: ところが、ベスト32のベルギー戦は、2対0から逆転されて敗れました。
    image: assets/images/20261128_team_senegal/b02_w.jpg
    no_telop: true
  - text: 日本が勝てない相手は、いま、どんなチームなのでしょうか。
    image: assets/stats/tb_senegal_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Senegal_national_football_team
  - https://ja.wikipedia.org/wiki/サッカーセネガル代表
  - https://en.wikipedia.org/wiki/2026_FIFA_World_Cup_round_of_32
- id: data
  heading: セネガル代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: セネガル代表の基礎DATA
  narrator: 解説
  say:
  - text: セネガルのフィファランクは、11月18日の発表で**18位**。日本は17位で、すぐ上です。
    image: assets/stats/tb_senegal_data0.png
    no_telop: true
  - text: W杯は4回目。最高成績は、初めて出た2002年のベスト8です。
    image: assets/stats/tb_senegal_data1.png
    no_telop: true
  - text: 直近は2026年。ベルギーに延長で2対3の負け。ベスト32でした。
    image: assets/stats/tb_senegal_data2.png
    no_telop: true
  - text: アフリカ選手権の優勝は、2021年大会の1回です。
    image: assets/stats/tb_senegal_data3.png
    no_telop: true
  - text: 監督はヴィエイラ。2026年8月に就任しました。
    image: assets/stats/tb_senegal_data5.png
    no_telop: true
  - text: 主将はクリバリ。代表の最多得点は、マネの56点です。
    image: assets/stats/tb_senegal_data6.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Senegal_national_football_team
  - https://ja.wikipedia.org/wiki/サッカーセネガル代表
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
