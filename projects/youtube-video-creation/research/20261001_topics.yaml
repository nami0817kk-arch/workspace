title: 10月1日の題材（ニュース4枠）
lead: 日本人ニュース3枠・ほかのニュース1枠のための候補15件。日本代表は今夜ではなく10月1日19:10にエクアドル戦
note: '<b>○×を付けてください。</b>明日のニュースは日本人3本・ほか1本（本編＋ショート）。日本代表のエクアドル戦は<b>10/1 19:10キックオフ</b>なので、日本代表の話は「試合前」として19時より前に出します（結果は10/2）。中身は記事の本文まで確かめてあります。ロマーノの投稿は X の本人のページから読みました。'
items:
- num: 1
  slot: 日本人
  head: 鈴木彩艶、加入1か月でアストン・ビラの9月の月間MVP。代表でもW杯後初の先発へ
  why: 'クラブが29日に発表。ファン投票で得票率70%。日本人GKで初めて欧州CLに出場し、トッテナム戦（3-2でリーグ初勝利）では英BBCのベスト11。森保監督「彩艶を先発で起用しようと思っている」。本人「まずはGKとしてゼロで抑えるところを意識」。先発は前日会見での予定
    '
  src: ゲキサカ・日刊スポーツ・Qoly（9/30）
  url: https://web.gekisaka.jp/news/world/detail/?460028-460028-fl
  fmt: news
- num: 2
  slot: 日本人
  head: 上田綺世、途中出場の2試合で3得点。2点は伊東純也から「阿吽の呼吸」
  why: 'ウルグアイ戦1点、ベネズエラ戦2点。エクアドル戦はシリーズ初先発が濃厚で、相手にはパチョ（パリSG）。本人「慎重になりすぎず大胆にボックス内で仕掛ける」。森保監督「フランスリーグもそう簡単に点を取れるリーグではないが、確実に結果を出している」。数え方は媒体で違う（Qoly はウルグアイ戦を1得点1アシスト）
    '
  src: ゲキサカ（9/30）
  url: https://web.gekisaka.jp/news/japan/detail/?460064-460064-fl
  fmt: quote
- num: 3
  slot: 日本人
  head: 久保が倒されて日本のPKに。ベネズエラが激怒、ソシエダの同僚アランブルは「恥だ」
  why: '後半ATにベネズエラのPKが、VARでその前の久保への反則に変わった。アランブル（久保のソシエダの同僚）はインスタで「ホスト国が勝つように用意された親善試合だ」。ビスカロンド監督「これは世界中どこでもPKだ」。ベネズエラのインフルエンサーは「明らかなPK」と判定を支持。海外の声を入れられる。アランブルの投稿そのものは未確認（Qoly の引用）
    '
  src: Qoly・日刊スポーツ（9/28〜30）
  url: https://qoly.jp/q1/17867301
  fmt: news
- num: 4
  slot: 日本人
  head: リールの39歳ジルーが引退を示唆。ライバルの上田綺世を気づかう理由は、日本人が決めた初ゴール
  why: 'ジルーは「たぶん」今季限りで引退と話した（Foot Mercato 9/30）。レキップでは、グルノーブル時代の同僚・梅崎司が自分のプロ初ゴールをアシストしたと話し、上田について「ライバルでも新しい国に馴染むことは大切」「譲るつもりはない」。レキップの原文は未確認（Qoly の引用）
    '
  src: Foot Mercato・Qoly（9/30）
  url: https://qoly.jp/q1/17867243
  fmt: quote
- num: 5
  slot: 日本人
  head: 瀬古歩夢、ただ一人の2戦連続先発。「もう若くない」「麻也くんや滉くんのような絶対的な存在に」
  why: '3バックの右で59分、中央で103分。森保監督「右肩上がりに世界トップ基準に向けて力をつけてくれている」。本人「ディフェンダーとして5大リーグに行けたことが今のプレーに表れている」
    '
  src: ゲキサカ（9/30）
  url: https://web.gekisaka.jp/news/japan/detail/?460068-460068-fl
  fmt: quote
- num: 6
  slot: 日本人
  head: 森保会見で分かった新しい分担。攻撃は名波、守備は長谷部、セットプレーは中村俊輔
  why: '10人になった場面で「長谷部コーチがどうしますかと尋ねてきた。私の中ではすでにプランはあった」。鎌田は長谷部コーチのハイプレスを「10回ボールが来て8回取れても、2回入れ替わられるとピンチ」。鎌田は既に扱ったので脇役にとどめる
    '
  src: ゲキサカ（9/30）
  url: https://web.gekisaka.jp/news/japan/detail/?460050-460050-fl
  fmt: news
- num: 7
  slot: 日本人
  head: 守備陣に負傷が続き、渡辺剛が離脱。国内組2人を追加招集
  why: '渡辺剛はベネズエラ戦の途中で病院へ。冨安は不参加、安藤智哉・熊坂光希も離脱。望月ヘンリー海輝と荒木隼人を追加招集。荒木「本当にこういう形になるとは思っていなかった」。けがの程度は未発表。板倉の回と重なるので板倉を主役にしない。渡辺剛本人の写真は記事に無い
    '
  src: JFA公式・ゲキサカ（9/29〜30）
  url: https://www.jfa.jp/samuraiblue/news/00036837/
  fmt: news
  weak: true
- num: 8
  slot: 日本人
  head: エクアドルのガジャルド監督「森保をとてもリスペクトしている」。11年前のクラブW杯で広島に勝った縁
  why: 'リーベル時代の2015年クラブW杯準決勝で、森保監督の広島に1-0。エクアドルは9/24に韓国に0-3。<b>明日のエクアドル代表の紹介（シリーズ）と中身が重なる</b>ので、○ならそちらの頭に入れる形がよい
    '
  src: ゲキサカ・サッカーキング（9/30）
  url: https://web.gekisaka.jp/news/japan/detail/?460058-460058-fl
  fmt: quote
  weak: true
- num: 9
  slot: 日本人
  head: 佐野海舟、ウルグアイ戦の失点につながったミスを反省。「デュエルは武器」
  why: 'GK早川とのパスがずれたところから失点。本人「自分はビルドアップの面が課題」「もっとボールを受けながら有効なプレーを」
    '
  src: ゲキサカ（9/30 22:46）
  url: https://web.gekisaka.jp/news/japan/detail/?460074-460074-fl
  fmt: quote
  weak: true
- num: 10
  slot: 日本人
  head: 日本が3-1で勝ったウルグアイに、韓国は1-4。韓国メディア「史上最悪の大惨事」
  why: '韓国は9/24にエクアドルに3-0で勝っている。主役は韓国なので、日本の話としては比べる切り口でしか使えない。日本人の写真は記事に無い
    '
  src: 日刊スポーツ（9/29）
  url: https://www.nikkansports.com/soccer/world/news/202609290000750.html
  fmt: news
  weak: true
- num: 11
  slot: プレミア
  head: グアルディオラ（今夏退任）、有罪のマンCへ手紙「今まで以上にここにいる」「一緒に乗り越える」
  why: 'ロマーノが1時間前に投稿、Guardian も報道。オーナー・会長・ソリアーノCEO・マレスカ監督・選手の名前を挙げて支持。調べの対象9季のうち最初の2季はグアルディオラの時代。元会長バーンスタインは「言葉にならないほどひどい」と今の役員に退任を求めた。<b>昨日は正式発表の題材に×が付いているので、切り口が違えば、の候補</b>
    '
  src: ロマーノ（X）・Guardian（9/30）
  url: https://www.theguardian.com/football/2026/sep/30/guardiola-backs-manchester-city-owners-over-guilty-verdicts
  fmt: quote
- num: 12
  slot: プレミア
  head: ポチェッティーノ「欺瞞の時代を生きた」。マンCの有罪に「どんな罰でも時間は戻せない」
  why: '元トッテナム・チェルシー監督。「スポーツの公平さが存在しなかった。壊されたものをどう直すのか」「多くのクラブは規則を守り、一部は守らなかった」。11と同じマンCの話なので、どちらか1つ
    '
  src: Sky Sports・Guardian（9/29〜30）
  url: https://www.skysports.com/football/news/11661/13593126/man-city-charges-we-lived-through-a-period-of-deception-if-club-found-guilty-says-ex-spurs-and-chelsea-boss-mauricio-pochettino
  fmt: quote
- num: 13
  slot: その他
  head: オリーズが自陣から独走して88分の決勝点。ジダン監督は並走して絶叫「自分も一緒に行きたかった」
  why: 'フランスがベルギーに1-0。エムバペは左ひざを痛めてレアルに戻っていた。ジダンは9人を入れ替え、ジャケ・ディウフ・ダクーニャが初出場。<b>オリーズは有名選手の紹介③（10/3）、エムバペは④（10/4）なので、そちらに入れる材料にもなる</b>
    '
  src: ESPN・MARCA（9/29）
  url: https://www.espn.com/soccer/story/_/id/50055928/zidane-goes-wild-olise-wonder-goal-france-late-victory
  fmt: quote
- num: 14
  slot: その他
  head: エスポジト兄弟、イタリアで111年ぶりの兄弟そろっての先発。弟ピオは得点、3兄弟がそろって代表に
  why: 'イタリアがトルコに4-1。兄セバスティアーノは初出場、21歳のピオは代表10試合5得点。兄弟の先発は1915年のチェヴェニーニ兄弟以来。長兄サルヴァトーレも代表経験があり、3兄弟が代表に出たのは初めて。ピオ「兄と一緒に経験できて本当に素晴らしかった」
    '
  src: ESPN・Gazzetta（9/29〜30）
  url: https://www.espn.com/soccer/story/_/id/50054155/esposito-brothers-make-history-italy-turkiye-rout
  fmt: news
- num: 15
  slot: ラ・リーガ
  head: レアルのアセンシオ、すねの疲労骨折で手術。昨季から痛みを抱えたまま出続けていた
  why: 'クラブの発表（9/30）で、右脚のすねの疲労骨折の手術を10/1に行う。MARCA は2〜4か月、ロマーノは「復帰は2027年」と書いていて期間が食い違う。昨季の後半から痛めたまま、けが人の多いチームで休まなかった
    '
  src: レアル・マドリード公式（MARCA経由）・ロマーノ（9/30）
  url: https://www.marca.com/futbol/real-madrid/2026/09/30/asencio-sera-operado-estara-dos-cuatro-meses-baja.html
  fmt: news
  weak: true
