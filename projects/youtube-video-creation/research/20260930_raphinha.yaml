# 取材メモ（9/30 題材 raphinha）。オーストラリア 2-4 ブラジル（9/29・ブリスベン、Suncorp Stadium）。
# 事実の裏:
#   主将と前線の真ん中（偽9番）: MARCA 9/29（Ancelotti copia a Flick）、SpaceMoney・NC News・EFE（Infobae）。マルキーニョスはベンチスタート。
#   「初めて主将」は裏づけが無いので言わない（流れの点検の指摘）。
#   アンチェロッティの主将の言葉: ロマーノの投稿（9/29「OFFICIAL」）の英語 "Raphinha is taking his game to the next level,
#     and he can also help us with his leadership"。原文も日時（試合前の見込み）も確かめられず、題（交代の理由）にも答えないので**台本から落とした**。
#   試合の流れ: Lance! の試合記録（Vanderson 2' / Circati 28' / Metcalfe 33' / Raphinha 45' PK / Bruno Guimarães 後半24' / Vini Jr 後半34' PK）。
#     PKはダニーロが倒されVARで確認（EFE・SpaceMoney）。
#   2本目のPK: 後半34分ヴィニシウス。アンチェロッティ（試合後の会見、Lance!）"O batedor de pênalti era o Raphinha, que bateu o primeiro.
#     O segundo era Bruno, mas o Bruno já tinha marcado o gol. Então, acho que o Vini merecia marcar um gol."
#   交代: ブラジル連盟（CBF）の発表として各紙が「右太ももに筋肉の違和感」。後半からエンドリッキ（Lance!・MARCA・EFE）。
#   検査: 9/29 時点で結果は出ていない（Lance!「CBFからは重さも検査の要否も確認されていない」、MARCA「数時間のうちに検査」、
#     SpaceMoney「評価はバルセロナで」）。**けがの程度は書かない。連盟の発表は「違和感」。「状態は分かっていない」と言う。**
#   「代表に残るか、早めに戻るか」: MARCA 9/29（raphinha-sustituido）の原文 "En función de los resultados de las pruebas,
#     el culé seguirá con su selección o adelantará su vuelta."
#   ブラジルの次: 10/3（土）インドとの親善試合、コルカタ（SpaceMoney・NC News）。
#   約1年半ぶり（558日）: SpaceMoney（前の代表の得点は 2025-03-20 コロンビア戦）。Crónica Global も「代表で1年ぶりの得点」。
#   右太ももの履歴: Lance!（Transfermarkt の負傷歴を引いて 2025年9月 右大腿二頭筋 58日／2026年3月 フランス戦 右大腿二頭筋 34日／
#     2026年6月19日 W杯ハイチ戦 右太もも裏、大会に戻れず）。1月の打撲・2月の13日は数えていない（「3度」は太もも裏の3回）。
#   1戦目（9/25）フル出場: Crónica Global・beIN。
#   今季の数字: 試合ごとの得点とアシストは ESPN の試合記録で数え直した。Lance! の「10試合15得点4アシスト、全試合で関与」と一致。
#     MARCA のバルサ内 14得点3アシスト（リーガ12・CL2、アシストはリーガ3）とも一致。
#     8/23 エルチェ 2G1A（PK1）／8/27 アスレティック 1G／8/31 ラージョ 2G／9/6 バレンシア 1G／9/9 フェイエノールト（CL）2G／
#     9/13 レバンテ 0G2A／9/16 ラシン 3G（PK2）／9/19 セビージャ 3G／9/25 豪州 1A（CK）／9/29 豪州 1G（PK）
#   バルサは開幕から8戦全勝（ESPN: 5-0, 2-0, 5-2, 5-0, 5-1, 4-2, 7-2, 3-1）。36点の内訳: ラフィーニャ14・ヤマル8・フェルミン4・
#     アデイェミ3・ジェズス2・ペドリ1・エスパルト1・カンセロ1・オウンゴール2。
#   前線の真ん中: ESPN の先発表でラフィーニャは8試合すべて先発の F（formationPlace 9）。ジェズスの先発は0、途中出場2試合
#     （フェイエノールト・ラシン）で2点。superlider 9/25「ラフィーニャを休ませる選択肢としてジェズス」、Barca Universal「ヘタフェ戦で初先発の可能性」。
#   バルサの10月（ESPN の日程、現地の日付）: 10/10 ヘタフェ（H）／10/13 ガラタサライ（A・CL）／10/17 ベティス（A）／
#     10/20 PSG（A・CL）／10/25 レアル・マドリード（H）。
# 本人の言葉: 試合後の取材・本人のSNSとも、requests と WebFetch で当たった範囲では見つからなかった（前半で退いたため）。
#   得点のあとの眼鏡の仕草は、視力を失いつつある少年ジオンとの約束（Lance!）。題から外れるので台本には入れない。
# 9/22・9/25 の回（2試合連続ハット／10番の初戦）と同じ文・同じ写真は使っていない。写真は今回の試合の CBF 撮影（Lance! 掲載）。
