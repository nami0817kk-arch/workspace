  telop: 「上手くサボってもええんやでとは思う」
  narrator: キャスター
  say:
  - voice: ネット民
    text: ラフィーニャの筋肉のけがが確定しないことを祈る。
  - voice: ネット民
    text: そうなればバルサには大きな問題だ。
    cont: true
  - voice: ネット民
    text: たぶん今いちばん調子のいいフォワード、いや、いちばん調子のいい選手だ
    cont: true
  - voice: ネット民
    text: うーん、ラフィーニャはキャプテンやってたから
  - voice: ネット民
    text: 抜きどころなかったのは仕方ない気がする
    cont: true
  - voice: ネット民
    text: とはいえキャプテンというのを考慮しても
    cont: true
  - voice: ネット民
    text: 1戦目でフル出場させる必要ってあったのかは疑問に思うけど
    cont: true
  - voice: ネット民
    text: ハフィーニャの何事にも全力少年なとこ大好きだけど
    short_voice: true
  - voice: ネット民
    text: 上手くサボってもええんやでとは思う
    cont: true
    short_voice: true
  - voice: ネット民
    text: W杯後のクラブ練習に全力すぎる姿見てから嫌な予感はしてた
    cont: true
    short_voice: true
  - voice: ネット民
    text: まあバルサはそれでも強いだろう
    cont: true
    short_voice: true
