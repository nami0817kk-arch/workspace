- id: match
  main: true
  heading: 558日ぶりの1点と、45分
  tier: 報道
  telop: 45分にPKで同点。後半はピッチに戻らず、代わりにエンドリッキ
  narrator: キャスター
  card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]]}
  say:
  - text: バルセロナで今季14点のラフィーニャ。ブラジル代表の主将を務めた試合で、得点したのに前半で退きました。
    short_only: true
  - text: 2分に先制したブラジルは、28分と33分の失点で逆転されます。
    image: assets/images/20260930_raphinha/01_w.jpg
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 2}
  - text: 45分、ダニーロが倒されてPK。ラフィーニャが左足で決めて同点にします。
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 3}
  - text: 試合後、アンチェロッティ監督はキッカーの順番をこう明かしました。
    image: assets/images/20260930_pair_ancelotti_raphinha/01.jpg
  - voice: アンチェロッティ
    text: PKを蹴るのはラフィーニャだった。1本目は彼が蹴った
  - text: 代表でのゴールは、2025年3月以来、およそ1年半ぶりでした。
    image: assets/images/20260930_raphinha/01_w.jpg
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 3}
  - text: ところが後半、ピッチに戻りません。ブラジル連盟の発表では、右の太ももに違和感。
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 3}
  - text: 代わりにエンドリッキが入り、ブラジルは4対2で勝ちました。
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 3}
  - text: 後半34分の2本目のPKは、ヴィニシウスが決めています。
    card: {"type": "table", "title": "前半（オーストラリア 2-2 ブラジル）", "columns": ["", ""], "rows": [["2分", "ヴァンデルソンが先制"], ["28分", "同点にされる"], ["33分", "逆転される"], ["45分", "ラフィーニャがPKで同点"]], "highlight_row": 3}
