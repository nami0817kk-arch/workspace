- id: thigh
  heading: また、右の太もも
  tier: 報道
  telop: 検査の結果はまだ。右の太ももは、この1年で3度痛めた場所
  narrator: キャスター
  card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]]}
  say:
  - text: ラフィーニャの状態は、まだ分かっていません。検査はこれからです。
    image: assets/images/20260930_raphinha/02_w.jpg
  - text: 右の太ももは、この1年で3度痛めています。
    card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]], "highlight_row": 0}
  - text: 今年3月は代表のフランス戦で痛めて34日。
    card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]], "highlight_row": 1}
  - text: 6月のW杯はハイチ戦で痛め、大会に戻れませんでした。
    card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]], "highlight_row": 2}
  - text: 4日前の1戦目は90分出ていました。
    card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]], "highlight_row": 3}
  - text: 検査の結果しだいで、10月3日のインドとの親善試合まで代表に残るか、早めにバルセロナへ戻るかが決まります。
    card: {"type": "table", "title": "ラフィーニャの右太もも（この1年）", "columns": ["", ""], "rows": [["2025年9月", "太もも裏を痛め 58日離脱"], ["2026年3月", "フランス戦で痛め 34日離脱"], ["2026年6月", "W杯ハイチ戦で痛め 大会に戻れず"], ["9月29日", "違和感で前半のみ 検査待ち"]], "highlight_row": 3}
