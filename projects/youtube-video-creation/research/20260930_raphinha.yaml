  tier: 報道
  telop: マルキーニョスがベンチで、腕章はラフィーニャ。立つ位置は前線の真ん中
  narrator: キャスター
  say:
  - text: 9月29日、ブリスベン。ブラジル代表は、4日前に引き分けたオーストラリアともう一度戦いました。
    image: assets/images/20260930_raphinha/02_w.jpg
  - 主将のマルキーニョスはベンチから。腕章を巻き、前線の真ん中に立ったのはラフィーニャでした。
