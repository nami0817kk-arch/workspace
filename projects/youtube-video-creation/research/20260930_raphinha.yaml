  takeaway: バルサは開幕8戦全勝の36点のうち、ラフィーニャが14点を決め、前線の真ん中で8試合すべて先発している。控えのジェズスは途中出場の2試合で2点だが、先発はまだ0。10月は15日で5試合で、この1年で3度痛めた右太ももの検査の結果が、そのまま真ん中を誰が務めるかを決める
