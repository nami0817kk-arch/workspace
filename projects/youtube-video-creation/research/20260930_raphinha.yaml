- id: view
  heading: 抜けたら、真ん中に誰が
  tier: 背景
  viewpoint: true
  telop: 真ん中の控えはジェズス。先発0、途中出場2試合で2点。10月は15日で5試合
  narrator: 解説
  card: {"type": "table", "title": "ラフィーニャの今季（10試合）", "columns": ["大会", "試合", "得点", "アシスト"], "rows": [["ラ・リーガ", "7", "12", "3"], ["チャンピオンズリーグ", "1", "2", "0"], ["ブラジル代表", "2", "1", "1"], ["合計", "10", "15", "4"]]}
  say:
  - text: ラフィーニャは代表の2試合も含め、10試合すべてで得点かアシストを記録。
    image: assets/images/20260930_raphinha/01_w.jpg
    card: {"type": "table", "title": "ラフィーニャの今季（10試合）", "columns": ["大会", "試合", "得点", "アシスト"], "rows": [["ラ・リーガ", "7", "12", "3"], ["チャンピオンズリーグ", "1", "2", "0"], ["ブラジル代表", "2", "1", "1"], ["合計", "10", "15", "4"]], "highlight_row": 3}
  - text: バルセロナは開幕から8試合全勝で36点。そのうち14点がラフィーニャです。
    card: {"type": "table", "title": "バルセロナの得点（8試合・36点）", "columns": ["選手", "得点"], "rows": [["ラフィーニャ", "14"], ["ヤマル", "8"], ["フェルミン・ロペス", "4"], ["アデイェミ", "3"], ["ガブリエル・ジェズス", "2"]], "highlight_row": 0}
  - text: 次に多いのはヤマルの8点。点を取れる選手は、ほかにもいます。
    card: {"type": "table", "title": "バルセロナの得点（8試合・36点）", "columns": ["選手", "得点"], "rows": [["ラフィーニャ", "14"], ["ヤマル", "8"], ["フェルミン・ロペス", "4"], ["アデイェミ", "3"], ["ガブリエル・ジェズス", "2"]], "highlight_row": 1}
  - text: ただ、前線の真ん中は、この夏からラフィーニャが8試合すべて先発しています。
    card: {"type": "table", "title": "前線の真ん中（バルセロナ 8試合）", "columns": ["", "先発", "途中出場", "得点"], "rows": [["ラフィーニャ", "8", "0", "14"], ["ガブリエル・ジェズス", "0", "2", "2"]], "highlight_row": 0}
  - text: 真ん中のフォワードの控えは、ガブリエル・ジェズス。
    card: {"type": "table", "title": "前線の真ん中（バルセロナ 8試合）", "columns": ["", "先発", "途中出場", "得点"], "rows": [["ラフィーニャ", "8", "0", "14"], ["ガブリエル・ジェズス", "0", "2", "2"]], "highlight_row": 1}
  - text: 途中から出た2試合で2点ですが、先発した試合はまだありません。
    card: {"type": "table", "title": "前線の真ん中（バルセロナ 8試合）", "columns": ["", "先発", "途中出場", "得点"], "rows": [["ラフィーニャ", "8", "0", "14"], ["ガブリエル・ジェズス", "0", "2", "2"]], "highlight_row": 1}
  - text: そこへ、代表の期間が明ける10月10日から、15日で5試合が続きます。
    card: {"type": "table", "title": "バルセロナの10月", "columns": ["", ""], "rows": [["10日", "ヘタフェ（ホーム）"], ["13日", "ガラタサライ（CL・敵地）"], ["17日", "ベティス（敵地）"], ["20日", "パリ・サンジェルマン（CL・敵地）"], ["25日", "レアル・マドリード（ホーム）"]], "highlight_row": 0}
  - text: チャンピオンズリーグでは、敵地でガラタサライとパリ・サンジェルマン。
    card: {"type": "table", "title": "バルセロナの10月", "columns": ["", ""], "rows": [["10日", "ヘタフェ（ホーム）"], ["13日", "ガラタサライ（CL・敵地）"], ["17日", "ベティス（敵地）"], ["20日", "パリ・サンジェルマン（CL・敵地）"], ["25日", "レアル・マドリード（ホーム）"]], "highlight_row": 3}
  - text: 最後はレアル・マドリードとの一戦です。
    card: {"type": "table", "title": "バルセロナの10月", "columns": ["", ""], "rows": [["10日", "ヘタフェ（ホーム）"], ["13日", "ガラタサライ（CL・敵地）"], ["17日", "ベティス（敵地）"], ["20日", "パリ・サンジェルマン（CL・敵地）"], ["25日", "レアル・マドリード（ホーム）"]], "highlight_row": 4}
  - text: 先発のない控えで5試合を回すのか。右太ももの検査が、10月の真ん中を決めます。
    card: {"type": "table", "title": "バルセロナの10月", "columns": ["", ""], "rows": [["10日", "ヘタフェ（ホーム）"], ["13日", "ガラタサライ（CL・敵地）"], ["17日", "ベティス（敵地）"], ["20日", "パリ・サンジェルマン（CL・敵地）"], ["25日", "レアル・マドリード（ホーム）"]]}
