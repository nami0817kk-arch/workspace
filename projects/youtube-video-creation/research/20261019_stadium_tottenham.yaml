  takeaway: トッテナム・ホットスパー・スタジアムの収容は、今季の開幕時で6万2850人。プレミア20クラブで2番目に大きく、1位マンチェスター・ユナイテッド（7万4158人）とは1万1308席、3位リヴァプール（6万1276人）とは1574席の差。ロンドンの6クラブでは最大で、2位アーセナルとの差は2146席。北ロンドンの2クラブだけで、ロンドン6クラブの収容の53％を占める。旧本拠地は1899年、苗木畑だった土地に開き、1938年に7万5038人の最多入場を記録。立ち見がなくなり、1998年には3万6238人になった。2017年5月に旧本拠地を離れ、2年ほどウェンブリーで戦い、2019年4月3日に新本拠地の最初のプレミアの試合（パレスに2対0）。芝のピッチは3つに割れて南スタンドの下へ動き、下にアメリカンフットボール用の人工芝が隠れる。公式の最多入場は2022年5月12日の6万2027人で、収容まで823人。昨季のホーム19試合の平均入場は6万1006人で、収容の97.1％。次の本拠地戦は現地10月19日のコヴェントリー戦で、その本拠地の収容は3万2609人
