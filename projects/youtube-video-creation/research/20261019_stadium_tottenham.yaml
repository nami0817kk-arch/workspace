  say:
  - text: 旧本拠地の開場は、1899年。もとは、苗木を育てる畑でした。
    image: assets/images/20261019_stadium_tottenham/05_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 0
  - text: 土地は醸造会社の持ち物で、クラブは借りて使いました。
    image: assets/images/20261019_stadium_tottenham/05_w.jpg
    card: none
  - text: 1934年には、収容がほぼ8万人に達します。
    image: assets/images/20261019_stadium_tottenham/05_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 0
  - text: 最多の入場は、1938年のFAカップ。7万5038人です。
    emph: true
    image: assets/images/20261019_stadium_tottenham/05_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 1
  - text: その人数は、いまの収容より、1万2188席も多い。
    image: assets/images/20261019_stadium_tottenham/05_w.jpg
    card: none
  - text: 立ち見がなくなるにつれて、収容は減っていきました。
    image: assets/images/20261019_stadium_tottenham/06_w.jpg
    card: none
  - text: 1998年には、全席イス席で3万6238人です。
    image: assets/images/20261019_stadium_tottenham/06_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 2
  - text: ほかの大クラブが広げていく中で、差が開きました。
    image: assets/images/20261019_stadium_tottenham/06_w.jpg
    card: none
  - text: 2008年10月、すぐ北に新しい競技場を建てる計画が出ます。
    emph: true
    image: assets/images/20261019_stadium_tottenham/04_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 3
  - text: 最初の案は、5万6000席ほど。いまより6850席少ない計画でした。
    image: assets/images/20261019_stadium_tottenham/04_w.jpg
    card: none
  - text: 五輪スタジアムへ移る案もありましたが、立ち消えになりました。
    image: assets/images/20261019_stadium_tottenham/04_w.jpg
    card: none
  - text: 2012年1月、クラブは同じ北ロンドンに残ると表明します。
    image: assets/images/20261019_stadium_tottenham/04_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 4
  - text: 土地の取得に時間がかかり、工事は2015年に本格化します。
    image: assets/images/20261019_stadium_tottenham/03_w.jpg
    card: none
  - text: 2015年7月、計画が作り直され、収容は約6万1000席に。
    emph: true
    image: assets/images/20261019_stadium_tottenham/03_w.jpg
    card:
      type: timeline
      title: 旧本拠地から、新しい競技場の計画まで
      rows: *id003
      focus: 1938年
      highlight_row: 5
  - text: アメリカンフットボールの試合を毎年開く合意も、同時に発表。
    image: assets/images/20261019_stadium_tottenham/03_w.jpg
    card: none
