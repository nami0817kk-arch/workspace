  say:
  - text: ブライトンのカモメは、縞に比べて、どれくらい新しいのか。
    emph: true
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card: none
  - text: 青と白の縞は、1904年から、122年です。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card:
      <<: *id_view
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: カモメは、1977年から、49年です。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card:
      <<: *id_view
      highlight_row: 1
  - text: 49を122で割ると、0.40。縞のおよそ5分の2。
    emph: true
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
