# ユニフォームとエンブレムの歴史 ブライトン（10/23 作成）。雛形は 10/22 フォレスト回。
# 題の問い：ブライトンの胸のカモメは、いつ、何がきっかけで生まれたのか（イルカだった時期、盾に入り、向きが逆になった理由）。
# 軸：①1970年代半ばに「ドルフィンズ」と呼ばれた→ライバルのパレスの「イーグルス」に「シーガルズ」と返した掛け声から愛称が決まり、1977年に丸いカモメの紋章。
#    ②その前は二つの町（ブライトンとホーヴ）の紋章・頭文字の盾・紋章なしの時期（資料で割れる）。③1998年の新会長が盾の中のカモメに替え、2011年（新スタジアムの開場）に丸い紋章が戻り、向きが逆。
#    ④青白の縞は1904年、途中で白一色・青一色（資料により無地／細い縦縞）。⑤2026/27は1983年のFAカップ決勝のシャツに着想、襟の内側に「We are Brighton 1901 - 2026」。
# 取材：2026-10-23。requests（ブラウザ User-Agent）・WebFetch・WebSearch（題名とURL探しと、クラブ公式ページの裏取り）。ブラウザ操作・JS実行・検索エンジンのAI要約を根拠にはしていない。
#   読んだ：ウィキペディア en "Brighton & Hove Albion F.C."（Colours and kits／Kit manufacturers and sponsors）、"History of Brighton & Hove Albion F.C."（Crest history）、"Kaoru Mitoma"、"1983 FA Cup final"、"Brighton & Hove Albion F.C.–Crystal Palace F.C. rivalry"。
#   Historical Football Kits（historicalkits.co.uk、キット史の個人サイト。Brighton & Hove Albion のページ全文）。WeAreBrighton.com「The history of the creation of the Brighton emblem」（2024-04-02、ファンの個人サイト）。
#   クラブ公式：brightonandhovealbion.com「A nod to 1983 for 2026/27!」（WebFetchで本文を読んだ）／クラブ公式ショップの2026/27ホームシャツ商品ページと1983 FA Cup Finalists Retro Home Shirt の商品ページ（WebFetch）。
#   読めなかった：Design Week「KSS on target with new Brighton & Hove Albion identity」（2011年2月、403）。2011年の紋章をKSSが設計した、という点は検索結果の要約でしか見ておらず、台本には入れない。
# ---- 一次情報・資料で確かめたこと（年は本文のまま）----
#   ・ウィキペディア(History/Crest history)：最初の紋章（1946–1975）は二つの町の紋章。1974/75シーズンに「The Dolphins」と呼ばれ、翌シーズンの頭までに新しい紋章が導入。ただしその愛称も紋章も短命。
#     パレス戦の前、アウェーの数人が「Eagles, Eagles」と叫び、ブライトンのファンが「Seagulls, Seagulls」と返した（「Bo'sun」というパブでの出来事と伝わる）。1977年に紋章がカモメに替わった。丸いカモメは1998年まで。
#     新会長ディック・ナイトが「古い体制の名残を一掃し」新しい始まりを示すため1998年に紋章を一新。2001/02は紋章がなく（百周年で）二つの町の紋章に戻った。2011/12に1970〜90年代と似た丸い紋章へ。
#     ブライトンの盾＝martlet（紋章の鳥）と珊瑚、どちらも海を表す。ホーヴの盾＝martletと座礁した船（16世紀初めのフランスの襲撃を記念）。
#   ・ウィキペディア(rivalry)：「シーガルズ」の愛称は、1976-02-24のゴールドストーンでの試合（2対0、サミー・モーガンの2点、観衆33,300）での掛け声に帰される。1977年に公式に「ドルフィンズ」から「シーガルズ」へ。パブには触れていない。
#   ・Historical Football Kits：二つの町の紋章がシャツに付いたのは1948年。頭文字の盾（カリグラフィー）は1956-57と1958-59。1972年8月〜1977年5月は紋章なし。1974年は全身白で「ドルフィンズ」と呼ばれた。
#     「イルカを入れた紋章は設計されたが、シャツには付かなかった」。パブ（Bo'sun）の掛け声の話。カモメの新しい紋章は1998年まで公式。1980年にアディダスが供給元になり、縞をやめて無地の青（「理由は不明」）、紋章に「The Seagulls」の文字が足された。
#     1983年FAカップ決勝は2対2、再試合0対4。1998年、紋章が改まる。2000-01の百周年で二つの町の紋章が復活。縞が定着したのは1904年（「いまより薄い青」）。1901-02は「漁師の青」、その前のBrighton Unitedは緑と白、Rangersは黒と白（Chris Worrall の調べ）。1947年にロイヤルブルーに白い袖（戦後の衣料の配給のためかもしれない）。
#   ・ウィキペディア(club)：製造元＝Bukta 1971–74/1977–80、Admiral 1974–75/1994–97、Umbro 1975–77、Adidas 1980–87、…、Erreà 1999–2014、Nike 2014〜。胸のスポンサー＝Skint Records 1999〜2008、アメリカン・エキスプレス 2013〜（スポンサー表では2013〜）。
#   ・WeAreBrighton：現行の紋章はアメックスの開場（2011年）に合わせた。丸い紋章をカモメの向きを逆にして復活。「後ろでなく前を見る意味」はこのサイトの見方。1998年の紋章＝盾の中のカモメ。
#   ・ウィキペディア(1983 FA Cup final)：1983-05-21、ウェンブリー、2対2（延長）。再試合 1983-05-26、ウェンブリー、マンチェスター・ユナイテッドが4対0。
#   ・クラブ公式「A nod to 1983 for 2026/27!」：「our home and away kits draw inspiration from the 1983 FA Cup final」。ホーム＝all royal blue with a printed crisp white pinstripe and contrasting white neckline。アウェー＝clean white base with printed royal blue pinstripes。発売＝7月8日の水曜に店頭。ナイキが技術パートナー。
#   ・クラブ公式ショップ：ホームシャツの襟の内側に「We are Brighton 1901 - 2026」（125 years of BHAFC）。1983年のレトロシャツ＝青、White & Red pinstripe pattern、白い襟と袖口。
#   ・ウィキペディア(Mitoma)：2021-08-10にブライトンと4年契約を結び、1年目はユニオン・サン＝ジロワーズへレンタル。2026年9月3日更新のブライトンの選手名簿に三笘薫の名前がある（背番号は名簿では7。他の資料は22で割れる＝台本に番号は入れない）。
# ---- 食い違い（台本で断る）----
#   ・**愛称の掛け声の場所**：ウィキペディア(History)・ユニフォーム史＝パブ（Bo'sun）／ウィキペディア(rivalry)＝1976年2月のゴールドストーンの試合。→「パブという話と試合という話があり、資料で割れる」と言う。
#   ・**イルカの紋章がシャツに付いたか**：ウィキペディア(History)＝翌シーズンの頭に新紋章が導入／ユニフォーム史＝設計されたがシャツに付かず、1972年8月〜77年5月は紋章なし／WeAreBrighton＝頭文字の紋章が1968〜74年。
#   ・**1983年のシャツ**：ユニフォーム史・ウィキペディア＝「無地の青」の時期／クラブ公式ショップの1983レトロシャツ＝白と赤のピンストライプ入りの青。→「無地」と「細い縦縞」に割れる、と言う。
#   ・**頭文字の紋章の年**：ユニフォーム史＝1956-57・1958-59／WeAreBrighton＝1958〜60年に盾入り、1968〜74年は盾なし。
# ---- 自分で数えた数 ----
#   2026-2011=15年（現行の紋章）。2026-1977=49年（カモメの愛称と紋章）。2026-1904=122年（青白の縞が決まってから）。49÷122=0.40（およそ5分の2）。
#   1977〜1998=21年（初代の丸）、1998〜2011=13年（盾）、2011〜2026=15年（現行）。21+13+15=49。49÷3=16.3（3つの紋章の平均）。2021-2011=10（三笘の契約のとき紋章は10年目）。
#   ジリンガム＝70マイル（ウィキペディア）＝約113キロ（自分で換算）。
# ---- 日本との接点 ----
#   三笘薫（2021年8月契約）。胸の紋章が何代目か、という形で第2節に置いた。ほかの接点は調べた範囲で無し。無理に広げない。
# ---- 写真（assets/images/20261023_kit_brighton/、出典は credits.json）----
#   Commons の CC0 / CC BY / CC BY-SA / パブリックドメインのみ。パレス・ピア・セグロカモメ・ウィズディーン・ホーヴ市庁舎・海岸通り・アメックス（10/14のスタジアム回の取り込み分から再利用）。代理店・放送映像は使っていない。人物は写っていない。
#   ゴールドストーン・グラウンドの写真は Commons に640px幅しか無く、引き伸ばしの上限（1.6倍）を超えるので使っていない。
#   エンブレムは assets/crests/ブライトン.png・節の頭の差し込み assets/backgrounds/cut_ブライトン.png（権利は晴れていない＝引き受ける危険）。
