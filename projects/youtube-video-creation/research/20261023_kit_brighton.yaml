- id: turn
  heading: カモメは、なぜ盾に入り、また向きを変えたのか
  bg: assets/images/20261023_kit_brighton/b03_withdean.jpg
  tier: 背景
  telop: 1998年は新会長が古い体制を消すため盾に。2011年は新スタジアムに合わせ、向きが逆の丸に
  narrator: 解説
  card: &id_turn
    type: timeline
    title: カモメの紋章の変遷（ウィキペディア・ファンのサイト）
    rows:
    - - 1977年
      - 丸いカモメ
    - - 1997年
      - ゴールドストーンを手放す
    - - 1998年
      - 盾の中のカモメ
    - - 2001/02
      - 百周年。二つの町の紋章へ
    - - 2011年
      - 向きが逆の丸い紋章
    focus: 1998年
    highlight_row: 0
  say:
  - text: 丸いカモメは、20年以上、続きました。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card:
      <<: *id_turn
      highlight_row: 0
  - text: 1980年には、紋章に、シーガルズの文字が足されます。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card: none
  - text: 1997年、クラブは、本拠地のゴールドストーン・グラウンドを、手放しました。
    emph: true
    image: assets/images/20261023_kit_brighton/b03_withdean.jpg
    card:
      <<: *id_turn
      highlight_row: 1
  - text: 2年間のホームは、およそ113キロ離れた、ジリンガム。
    image: assets/images/20261023_kit_brighton/b03_withdean.jpg
    card: none
  - text: 1998年、ブライトンの新しい会長、ディック・ナイトが、紋章を替えます。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card:
      <<: *id_turn
      highlight_row: 2
  - text: 古い体制の名残を消して、新しい始まりを示すためだった、とされています。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card: none
  - text: 形は、盾の中のカモメです。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card: none
  - text: 2001年の百周年だけは、二つの町の紋章に戻りました。
    image: assets/images/20261023_kit_brighton/b04_hove_hall.jpg
    card:
      <<: *id_turn
      highlight_row: 3
  - text: そして2011年。新しいスタジアムの開場に合わせて、丸い紋章が戻ります。
    emph: true
    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card:
      <<: *id_turn
      highlight_row: 4
  - text: ただし、カモメの向きは、逆になりました。
    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card: none
  - text: 後ろでなく前を見る意味だ、という、ファンの見方があります。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card: none
  - text: 三つ目のカモメは、そこから、続いています。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/History_of_Brighton_%26_Hove_Albion_F.C.
  - https://historicalkits.co.uk/Brighton_and_Hove_Albion/Brighton_and_Hove_Albion.htm
  - https://wearebrighton.com/albionfeatures/?p=6571
- id: stripes
  heading: 青と白の縞は、いつ決まり、なぜ途切れたのか
  bg: assets/images/20261023_kit_brighton/b05_seafront.jpg
  tier: 背景
  telop: 縞が決まったのは1904年。途中で白一色、青一色の時期がある。1983年のシャツは資料で割れる
  narrator: 解説
  card: &id_stripes
    type: timeline
    title: ブライトンのシャツの色（ユニフォーム史のサイト・クラブ公式ショップ）
    rows:
    - - 1904年
      - 青と白の縞が決まる
    - - 1947年
      - ロイヤルブルーに白い袖
    - - 1974年
      - 全身白
    - - 1980年
      - 縞をやめて青のシャツ
    - - 2026/27
      - 青地に白の細い縦縞
    focus: 1904年
    highlight_row: 0
  say:
  - text: 次は、シャツの色です。ブライトンといえば、青と白の縞。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card: none
  - text: 縞に決まったのは、1904年です。
    emph: true
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card:
      <<: *id_stripes
      highlight_row: 0
  - text: いまより薄い青だった、と同じ個人サイトにあります。
    image: assets/images/20261023_kit_brighton/b06_pavilion.jpg
    card: none
  - text: その前の、前身のクラブの時代は、緑と白、黒と白でした。
    image: assets/images/20261023_kit_brighton/b06_pavilion.jpg
    card: none
  - text: でも、縞は、途切れています。
    image: assets/images/20261023_kit_brighton/b06_pavilion.jpg
    card: none
  - text: 1947年は、ロイヤルブルーに、白い袖。
    image: assets/images/20261023_kit_brighton/b04_hove_hall.jpg
    card:
      <<: *id_stripes
      highlight_row: 1
  - text: 戦後の、衣料の配給のせいかもしれない、という推測です。
    image: assets/images/20261023_kit_brighton/b04_hove_hall.jpg
    card: none
  - text: 1974年は、全身が白。クラブが「ドルフィンズ」と呼ばれた年です。
    image: assets/images/20261023_kit_brighton/b03_withdean.jpg
    card:
      <<: *id_stripes
      highlight_row: 2
  - text: 1980年、縞をやめ、青を基調にしたシャツへ。
    image: assets/images/20261023_kit_brighton/b03_withdean.jpg
    card:
      <<: *id_stripes
      highlight_row: 3
  - text: 個人サイトの説明は、無地の青。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card: none
  - text: クラブの店の1983年のシャツは、白と赤の細い縦縞の入った青です。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card: none
  - text: この年の青は、言い分が二つあります。
    emph: true
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card: none
  sources:
  - https://historicalkits.co.uk/Brighton_and_Hove_Albion/Brighton_and_Hove_Albion.htm
  - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
  - https://shop.brightonandhovealbion.com/fashion/fashion-collections/retro/3354_1983-fa-cup-finalists-home-shirt.html
- id: kit
  heading: 2026/27のシャツは、何を懐かしんでいるのか
  bg: assets/images/20261023_kit_brighton/a01_amex.jpg
  tier: 報道
  telop: 1983年のFAカップ決勝に着想。青地に白の細い縦縞。襟の内側に「We are Brighton 1901 - 2026」
  narrator: 解説
  card: &id_kit
    type: timeline
    title: シャツの歩み（ウィキペディア・クラブ公式）
    rows:
    - - 1983年
      - FAカップ決勝。2対2、再試合0対4
    - - 1999〜2014
      - 製造元はエッレア
    - - 1999〜2008
      - 胸の広告はスキント・レコーズ
    - - 2014年〜
      - 製造元はナイキ
    - - 2026/27
      - 1983年に着想。襟の内側に125年
    focus: 1983年
    highlight_row: 0
  say:
  - text: 最後に、ブライトンの今季のシャツ。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card: none
  - text: クラブは、1983年のFAカップ決勝に着想した、と書きます。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card:
      <<: *id_kit
      highlight_row: 4
  - text: 1983年の決勝は、ウェンブリーで、2対2。
    emph: true
    image: assets/images/20261023_kit_brighton/b01_pier.jpg
    card:
      <<: *id_kit
      highlight_row: 0
  - text: 5日後の再試合は、マンチェスター・ユナイテッドが、4対0で勝ちました。
    image: assets/images/20261023_kit_brighton/b01_pier.jpg
    card: none
  - text: 今季のホームは、青一色に、白い、細い縦縞。
    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card: none
  - text: アウェーは、その反対。白地に、青の縦縞。
    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card: none
  - text: 襟の内側には、「ウィー・アー・ブライトン」の刻印。創立125年の印。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card: none
  - text: 製造元は、1999年から2014年がエッレア。2014年から、ナイキです。
    image: assets/images/20261023_kit_brighton/b05_seafront.jpg
    card:
      <<: *id_kit
      highlight_row: 3
  - text: 胸の広告は、1999年から2008年まで、スキント・レコーズでした。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card:
      <<: *id_kit
      highlight_row: 2
  - text: DJファットボーイ・スリムこと、ノーマン・クックの、音楽レーベルです。
    image: assets/images/20261023_kit_brighton/b02_gull.jpg
    card: none
  - text: いまは、アメリカン・エキスプレス。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card: none
  sources:
  - https://www.brightonandhovealbion.com/media-article/a-nod-to-1983-for-2026-27
