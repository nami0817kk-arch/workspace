    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card:
      <<: *id_gen
      highlight_row: 2
  - text: 49を3で割ると、16。ひとつの紋章は、平均で16年です。
    image: assets/images/20261023_kit_brighton/a02_open2011.jpg
    card: &id_avg
