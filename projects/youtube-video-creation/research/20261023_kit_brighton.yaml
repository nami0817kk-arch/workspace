      - - 3つ
        - 紋章の数
      - - 16年
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: いまの紋章は、15年目。平均に、ほぼ並びました。
    emph: true
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
    card:
      <<: *id_view
      highlight_row: 2
  - text: 次の紋章の予定は、公式の発表を確かめられませんでした。
    image: assets/images/20261023_kit_brighton/a01_amex.jpg
