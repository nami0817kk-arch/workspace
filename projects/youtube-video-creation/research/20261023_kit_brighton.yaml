- id: view
  viewpoint: true
  heading: 見立て・カモメは、縞と比べて、どれだけ長いのか
  bg: assets/images/20261023_kit_brighton/a01_amex.jpg
  tier: 報道
  telop: 縞は122年、カモメは49年。縞のおよそ5分の2。紋章は49年で3つ、平均16年
  narrator: 解説
  card: &id_view
    type: table
