- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 昨シーズンは欧州8強。率いるのは地元の監督
  narrator: キャスター
  say:
  - text: 昨シーズンは、ヨーロッパリーグで**ベスト8**。準々決勝の相手は、鈴木唯人のフライブルク。
    image: assets/stats/ll_celta_data_r1.png
    no_telop: true
  - text: 率いるヒラルデス監督は、こう話しています。
    image: assets/stats/ll_celta_data_r2.png
    no_telop: true
  - voice: クラウディオ・ヒラルデス
    text: ここにいられるのは、ぜいたくなことだ
    image: assets/stats/ll_celta_data_r2.png
  - voice: クラウディオ・ヒラルデス
    text: 2年半前は、まだ1部で指揮をとったこともなかった
    image: assets/stats/ll_celta_data_r2.png
  - text: そしてこのクラブは、チャンピオンズリーグで勝ち上がった同じシーズンに、2部へ落ちています。
    image: assets/stats/ll_celta_data_r3.png
    no_telop: true
  - image: assets/stats/ll_celta_data0.png
    text: 創立は**1923年**。ビーゴにあった2つのクラブが、1つになって生まれました。
    no_telop: true
  - image: assets/stats/ll_celta_data1.png
    text: 愛称は「オス・セレステス」。ガリシアの旗と同じ、空色から来ています。
    no_telop: true
  - image: assets/stats/ll_celta_data2.png
    text: ホームタウンは、大西洋に面したビーゴ。ガリシアで、いちばん人口の多い町です。
    no_telop: true
  - image: assets/backgrounds/stadium_セルタ.png
    text: 本拠地はバライードス。改修中のいまは、**2万3432人**が入ります。
  - image: assets/stats/ll_celta_data4.png
    text: オーナーはモウリーニョ家。**2023年**から、娘のマリアンが初の女性会長です。
    no_telop: true
  - image: assets/stats/ll_celta_cups.png
    text: リーグも国王杯も、優勝はありません。国王杯は、決勝で**3度**敗れました。
    no_telop: true
  - image: assets/stats/ll_celta_data6.png
    text: 最多出場はイアゴ・アスパス。公式戦で**578試合**、いまも増え続けています。
    no_telop: true
  - image: assets/stats/ll_celta_data7.png
    text: 直近のタイトルは**2000年**、ヨーロッパのインタートトカップです。
    no_telop: true
  - image: assets/stats/ll_celta_data8.png
    text: 昨シーズンのリーグ戦は**6位**。勝ち点は**54**でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/RC_Celta_de_Vigo
  - https://en.wikipedia.org/wiki/2026–27_RC_Celta_de_Vigo_season
