- id: history
  heading: ヨーロッパを驚かせた
  tier: 背景
  telop: リヴァプールもユヴェントスも倒した
  narrator: 解説
  card:
    type: table
    title: ユーロセルタと呼ばれて
    columns:
    - ''
    - ''
    rows:
    - - 1998-99
      - リヴァプールに合計4対1
    - - 1999-2000
      - ベンフィカに7対0
    - - 同じ大会
      - ユヴェントスに4対0
  say:
  - text: 1990年代の終わり、セルタはヨーロッパの大会で勝ち進みます。
    image: assets/images/ll_celta_history/scene.jpg
  - リヴァプールを合計**4対1**で破り、翌シーズンはベンフィカに**7対0**。
  - ユヴェントスにも**4対0**で勝ち、「ユーロセルタ」と呼ばれました。
  sources:
  - https://en.wikipedia.org/wiki/RC_Celta_de_Vigo
  - https://es.wikipedia.org/wiki/Real_Club_Celta_de_Vigo
  bg: assets/backgrounds/stadium_セルタ_in.png
  official: false
- id: history2
  heading: 16強と降格
  tier: 背景
  telop: ベスト16に進んだシーズンに、2部へ
  narrator: 解説
  card:
    type: table
    title: 2003年から04年のシーズン
    columns: &id001
    - ''
    - ''
    rows:
    - - チャンピオンズリーグ
      - 初出場でベスト16
    - - グループ
      - ミランに次ぐ2位
  say:
  - 2003年、前のシーズンの**4位**で、初めてチャンピオンズリーグに出ます。
  - ミランと同じ組を2位で抜けて、ベスト16。アーセナルに敗れました。
  - text: ところがリーグ戦は**19位**。2部への降格が決まりました。
    card:
      type: table
      title: 2003年から04年のシーズン
      columns: *id001
      rows:
      - - リーグ戦
        - 19位で2部へ
  - それでも、翌シーズンに1年で戻っています。
  sources:
  - https://es.wikipedia.org/wiki/Real_Club_Celta_de_Vigo
  - https://en.wikipedia.org/wiki/RC_Celta_de_Vigo
  - https://en.wikipedia.org/wiki/2003%E2%80%9304_UEFA_Champions_League_group_stage
  bg: assets/backgrounds/stadium_セルタ_in.png
  official: false
- id: history3
  heading: 3部の手前で
  tier: 背景
  telop: 借金8400万ユーロ。救ったのは21歳の2得点
  narrator: 解説
  card:
    type: table
    title: 3部の手前で
    columns: &id002
    - ''
    - ''
    rows:
    - - 2007年
      - もう一度2部へ
    - - 借金
      - およそ8400万ユーロ
  say:
  - 2007年、もう一度2部へ。借金は、およそ**8400万ユーロ**に膨らみます。
  - 2009年、3部に落ちれば、クラブが消えかねない状況でした。
  - text: 残り2節のアラベス戦。途中から出た**21歳**のイアゴ・アスパスが、**2点**を決めます。
    card:
      type: table
      title: 3部の手前で
      columns: *id002
      rows:
      - - 2009年6月
        - 21歳のアスパスが2得点
  - この勝利で残留。その若者が、いまの主将です。
  sources:
  - https://es.wikipedia.org/wiki/Real_Club_Celta_de_Vigo
  - https://en.wikipedia.org/wiki/Iago_Aspas
  bg: assets/backgrounds/stadium_セルタ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 外で強い。育てて売る。町ぐるみのクラブ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - アウェーに強い
    - - 運営の型
      - 育てて売る
    - - クラブの気質
      - 町の15%が会員証
  say:
  - ヒラルデス監督のチームは、アウェーに強い。
  - 昨シーズン、敵地で取った勝ち点**31**は、クラブの記録です。
  - ピッチの外は、育てて売る型。
  - 生え抜きのガブリ・ベイガは**2023年**、**4000万ユーロ**でサウジアラビアのクラブへ。
  - スタンドは町ぐるみ。会員証は**4万5812人**、町の人口の15パーセントを超えます。
  sources:
  - https://en.wikipedia.org/wiki/RC_Celta_de_Vigo
  - https://en.wikipedia.org/wiki/Gabri_Veiga
  - https://rccelta.es/club/actualidad/abanca-balaidos-amplia-su-aforo-en-el-inicio-de-una-nueva-temporada/
  bg: assets/backgrounds/stadium_セルタ_in.png
  official: false
