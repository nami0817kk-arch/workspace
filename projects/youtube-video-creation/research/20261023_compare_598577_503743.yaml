      - text: 見立てです。昨季は全公式戦で、ヴィルツが0.44、ロジャーズが0.51。
        mark: {kind: circle, row: 0}
        image: assets/images/20261023_compare_wirtz_rogers/r_eng07/01_r.jpg
        card: {<<: *viewcard, highlight_row: 昨季の90分あたり}
      - text: プレミアのリーグ戦だけで見ても、順は同じでした。
        image: assets/images/20261023_compare_wirtz_rogers/w_ger05/01_r.jpg
        card: {<<: *viewcard, highlight_row: 昨季プレミアだけ}
      - text: 今季は、0.46と0.99。ロジャーズは、ヴィルツの2倍あまりです。
        emph: true
        image: assets/images/20261023_compare_wirtz_rogers/r_eng08/01_w.jpg
        card: {<<: *viewcard, highlight_row: 今季の90分あたり}
      - text: 市場価値も、同じ向きに動きました。ヴィルツは下がり、ロジャーズは上がっています。
        image: assets/images/20261023_compare_wirtz_rogers/w_liv07/01_r.jpg
        card: {<<: *viewcard, highlight_row: 市場価値}
      - text: ただ、ヴィルツの昨季は、リバプールでの1年目。リーグも国も変わった季でした。
        image: assets/images/20261023_compare_wirtz_rogers/w_ger04/01_w.jpg
        card: none
      - text: 今季の数字も、まだ短い時間のものです。
        card: none
      - text: 入れ替わりと重なっているのは、昨季の数字と今季の出だし、この2点です。
        image: assets/images/20261023_compare_wirtz_rogers/r_eng06/01_w.jpg
        card: none
      - text: 次は、チェルシー対トッテナム。日本時間25日の午前1時半。
        card: none
      - text: リバプールは、日本時間25日の午後11時、ブライトン戦。
        image: assets/images/20261023_compare_wirtz_rogers/w_ger05/01_w.jpg
        card: none
      - text: 0.46と0.99という今季の数字の動きを、追っていきます。
