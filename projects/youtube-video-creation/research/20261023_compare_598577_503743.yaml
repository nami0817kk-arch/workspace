#   日本との接点：確かめられた縁が無いので入れない（無理に押し込まない）。
# **スタッツの条件（足切り）**：クラブのトップチームの全公式戦（代表・育成年代は混ぜない）。
#   昨季25/26：ヴィルツ 49試合3504分／ロジャーズ 55試合4564分（2人とも900分超）。プレミアのリーグ戦だけ：33試合2390分／37試合3285分。
