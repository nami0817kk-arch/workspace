#   季ごと（得点＋アシスト90分あたり）：ヴィルツ 23/24 38×90÷3475＝0.98・24/25 31×90÷3391＝0.82・25/26 0.44・26/27 4×90÷785＝0.46（10試合・1得点3アシスト）／
