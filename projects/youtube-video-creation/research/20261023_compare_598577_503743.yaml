#   Transfermarkt の最新は 0.85億・1.2億）。同じ位置（攻撃的MF）で、**昨季末にともに23歳**（2003-05-03生・2002-07-26生）、ともにプレミアで昨季を過ごした。
#   市場価値が**2026-07-22 に逆転**した（ヴィルツ1億・ロジャーズ1.1億）という数字の動きが軸になる。
# **重なりの確認（軸を重ねない）**：ヴィルツの選手紹介（10/18 scripts/20261018_wirtz_intro.md）・ロジャーズの選手紹介（10/19 scripts/20261019_rogers_intro.md）が使った軸＝経歴・移籍・人物・個別の試合。
#   **この回の軸**：①市場価値が入れ替わった日。②同じ年齢（昨季末23歳）の全公式戦とプレミアのリーグ戦、同じ物差し（得点＋アシストの90分あたり）。③シーズンごとの推移。④年齢ごとの市場価値の最高値。
