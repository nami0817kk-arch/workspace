sections:
  - id: join
    heading: 何のために借りたのか
    tier: 報道
    telop: バルサから1年のレンタル
    narrator: キャスター
    say:
      - リヴァプールがロナルド・アラウホの獲得を発表したのは、8月10日でした。
      - バルセロナからの期限付き移籍で、期間は今シーズンの1年間。背番号は33です。
      - イギリスメディア『スカイスポーツ』によると、5500万ユーロ、日本円でおよそ101億円の買い取りオプションが付いています。
      - レンタル料は発生せず、今季の給与はリヴァプールが全額を負担します。移籍を進めるため、アラウホは減給を受け入れたと伝えられました。
      - 獲った理由は、はっきりしていました。センターバックの層です。
      - コナテがレアル・マドリードへ移り、レオーニは長期離脱からの復帰途上、新加入のジャケもケガで離脱していました。
      - アラウホはバルセロナで公式戦213試合14ゴール。ラ・リーガ3度の優勝に貢献した、実績のあるセンターバックです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/32208/
      - https://www.footballchannel.jp/2026/09/05/post1004520/

  - id: ipswich
    heading: ところが、使われたのは別の位置だった
    tier: 報道
    telop: プレミア初先発は右サイドバック
    narrator: 解説
    card:
      type: bars
      title: イプスウィッチ戦のアラウホ
      items:
        - {label: "デュエル勝利", value: 9}
        - {label: "空中戦の勝利", value: 6}
        - {label: "クリア", value: 7}
        - {label: "アタッキングサードへのパス", value: 6}
      unit: 回
    say:
      - ここからが本題です。9月4日のイプスウィッチ戦、アラウホのプレミアリーグ初先発は右サイドバックでした。
      - もっとも、これは完全な奇策ではありません。加入のときから「センターバックだが右サイドバックもできる」と紹介されていました。
      - イラオラ監督も8月のインタビューでこう話しています。
      - {voice: イラオラ監督, text: 彼はCBだが、右SBでも我々の力になれる}
      - イプスウィッチ戦の前にも、ブラッドリーとゴメスの離脱で右サイドバックの人数が足りないことを認めたうえで、こう言っていました。
      - {voice: イラオラ監督, text: 右SBでプレーできるソボスライやアラウホを評価している}
      - {voice: イラオラ監督, text: 複数のポジションをこなせる選手は非常に価値がある}
      - 結果は数字に出ました。デュエルは10回中9回に勝ち、空中戦は6戦全勝。
      - 地上戦も4回中3回を制し、クリア7回はチーム最多タイでした。
      - 守るだけでもありません。縦パス5本、アタッキングサードへのパス6本を記録しています。
      - リヴァプールはこの試合で、公式戦10試合ぶりの無失点を達成しました。
      - 現地メディア『ディス・イズ・アンフィールド』はこう書いています。
      - {voice: ディス・イズ・アンフィールド, text: 素晴らしいパフォーマンスだった}
      - {voice: ディス・イズ・アンフィールド, text: この内容なら右SBの座を維持すべきだ}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/05/post1004520/
      - https://web.ultra-soccer.jp/news/all/35242/

  - id: now
    heading: そして2試合目でも
    tier: 報道
    telop: 「このポジションは彼のものになったようだ」
    narrator: 解説
    say:
      - 9日のチャンピオンズリーグ、アトレティコ・マドリード戦でも、アラウホは右サイドバックで先発しました。2試合連続です。
      - 40分、ペナルティエリアの中でソボスライからパスを受けると、バックヒールで返してアシストを記録します。
      - リヴァプールはこの試合を2対1で勝ちました。
      - 『ディス・イズ・アンフィールド』は10点満点で8をつけ、こう書いています。
      - {voice: ディス・イズ・アンフィールド, text: センターバックのように守れるだけではない}
      - {voice: ディス・イズ・アンフィールド, text: 右サイドバックとして前にも出られることを示した}
      - {voice: ディス・イズ・アンフィールド, text: このポジションは彼のものになったようだ}
      - センターバックが足りないから借りた選手が、右サイドバックで外せなくなりつつある、という2試合でした。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1007931/
      - https://www.footballchannel.jp/2026/09/10/post1007868/
