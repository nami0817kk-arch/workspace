# アラウホが右SBで外せなくなっている（2026年9月10日）。ユーザー指示「アラウホ」
#
# **CBの層が薄いから借りたのに、いま外せないのは右サイドバック。**
# これが引き。同じ日のリヴァプール対アトレティコの回（11:46公開）にも
# アラウホの節があるが、そちらはCL1試合の話。こちらは
# **加入の経緯とイプスウィッチ戦の数字**が主で、CLの部分は最後の1節だけにする。
#
# **反応は入れない。**読める形のスレが無かった
