# 取材メモ（10/4 題材 minamino_return、型は news）。材料の控えは research/raw/20261004_minamino_return.md。
# 問いは1つ：左膝の大けがから286日、南野拓実はどこまで戻ってきたのか（公式戦のピッチにはいつ戻るのか）。
# 親善試合であることをはっきり言う（公式戦の出場は、けが以来まだ無い。9/4 PSG戦は登録外、9/18 ランス戦はベンチのみ）。
# 本人の言葉: ピサ戦のあとの本人の言葉は見つからなかった（本人のインスタ・X、モナコ公式の記事・X・YouTube、日本・フランスの記事を当たった）。
#   けがの間の言葉を日付つきで使う（3月のインスタ、5月のインスタ、ワールドカップ期間中のサンスポの引用）。
#   ワールドカップ期間中の発言は、元の日付を確かめられなかった（サンスポ 10/3 が「語っていた」と引用）。台本では「ワールドカップの期間中」まで。
# 監督の言葉は Nice-Matin（La Diagonale の転載）を Qoly の訳で。「ゴールに近くいる」は「ゴールの近くにいる」に直した（脱字の補い）。
# 見立て: 前十字靱帯の大けがから試合に戻るまでの日数。BJSM 2016（欧州78クラブ・15年）の中央値7.4か月（手術から公式戦）、
#   同じモナコのサリス（1/3 負傷→9/18 公式戦、258日）、南野（12/21→10/3 親善試合、286日）。次の公式戦 10/10 トゥールーズ戦から16日で5試合。
# 守田英正の話は題に答えないので入れない。
# 反応: Yahoo!ニュース（サッカーキングの記事）のコメント欄2件と X の個人の投稿1件。全文。海外の声は取れなかった（YouTube の配信はコメント閉鎖、X の返信はログインが要る）。
# 写真: モナコ公式のギャラリー（2026-10-03、ピサ戦）。01＝前を向く南野（サムネ・冒頭・ショート）、02＝ゴール前でシュートする南野（背中）。代理店の写真は使わない。
