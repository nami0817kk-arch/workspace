  - id: numbers
    heading: どれくらい取れているのか
    tier: 報道
    telop: 4試合で17得点2失点
    narrator: キャスター
    card:
      type: bars
      title: ラ・リーガ 第4節終了時点
      items:
        - {label: "バルセロナ 勝ち点", value: 12}
        - {label: "レアル・マドリード 勝ち点", value: 9}
      unit: 点
    say:
      - 開幕4試合で17得点、2失点。リーグ最多の得点です。
      - 勝ち点12で単独首位に立ちました。
      - 一方のレアル・マドリードは同じ節でベティスに0対1で敗れ、今季初黒星。
      - 勝ち点9の2位で、3ポイントの差がつきました。
      - もう1つ、数字があります。今夏ニューカッスルから約149億円で加入したアンソニー・ゴードンです。
      - 開幕4試合で4アシスト。データ会社オプタによると、21世紀のラ・リーガでこれは史上3人目です。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35462/
      - https://www.footballchannel.jp/2026/09/07/post1005795/

  - id: flick
    heading: それでも監督は満たされていない
    tier: 報道
    telop: 「ストライカーは必要だ」
    narrator: 解説
    say:
      - 試合のあと、ハンジ・フリック監督はこう話しました。
      - {voice: フリック, text: 素晴らしい試合だった}
      - {voice: フリック, text: 試合の最初から最後まで、我々が試合をコントロールできた}
      - {voice: フリック, text: だが、決して驚きはない}
      - {voice: フリック, text: なぜなら、我々が日頃から練習してきた成果だからだ}
      - {voice: フリック, text: ほぼ完璧な試合だった}
      - ところが、そのあとにこう続けます。
      - {voice: フリック, text: 我々のアプローチは変わらない。ストライカーは必要だ}
      - バルセロナは今夏、アトレティコのフリアン・アルバレスを獲れませんでした。
      - 代わりにアーセナルからガブリエウ・ジェズスを迎え、この試合の81分にデビューしています。
      - 9番が不在のまま大量得点を重ねていても、監督の見方は変わっていません。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35441/
      - https://www.footballchannel.jp/2026/09/07/post1005795/

  - id: more
    heading: 5対0の夜にも、直すところを言った
    tier: 報道
    telop: 「常に改善の余地がある」
    narrator: 解説
    say:
      - フリックは、勝った直後にこうも言っています。
      - {voice: フリック, text: 5対0で勝利した後にこんなことを言う必要はないかもしれない}
      - {voice: フリック, text: だが、我々には常に改善の余地があることを忘れてはならない}
      - {voice: フリック, text: より多くのパスを繋ぎ}
      - {voice: フリック, text: さらに試合をコントロールできるように努力する必要もある}
      - スペインのラジオ番組では、レアルとの違いがこう語られました。
      - {voice: スペインの記者, text: バルサは眠っていない。ゴールを奪いに行き、そして決める}
      - {voice: スペインの記者, text: 2点目を奪いに行き、また決める。この違いは重要だ}
    official: false
    sources:
