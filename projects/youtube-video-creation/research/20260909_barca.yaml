    say:
      - 9月6日、ラ・リーガ第4節。バルセロナは敵地メスタージャでバレンシアと戦いました。
      - 6分、ラミン・ヤマルのゴールで先制します。2試合続けての得点でした。
      - そこからフェルミン・ロペス、ハフィーニャ、ペドリと続きます。
      - 84分にはヤマルがこの日2点目。2試合続けての2得点です。
      - 5対0。気温34度の敵地で、開幕4連勝を決めました。
