  - text: 昔のシャツは無地で、紋章は便箋や、試合のプログラムのものでした。
    card: none
  - text: 大砲がシャツに初めて付いたのは、1967年です。
    emph: true
    card:
      <<: *id_chest
      highlight_row: 0
  - text: この大砲のシャツで、1970/71に、初の二冠を取りました。
    card:
      <<: *id_chest
      highlight_row: 0
  - text: リーグ優勝と、FAカップの両方です。
    card:
      <<: *id_chest
      highlight_row: 0
  - text: 1989/90が、ホームで大砲だけを付けた最後の年です。
    card:
      <<: *id_chest
      highlight_row: 1
  - text: そのあと、ホームの胸は、紋章の時代が続きます。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    card:
      <<: *id_chest
      highlight_row: 1
  - text: 2011/12は、先ほどの125周年の記念紋章でした。
    card:
      <<: *id_chest
      highlight_row: 2
  - text: 2021/22のアウェーは、紋章を外して、大砲だけにしました。
    image: assets/images/20261017_kit_arsenal/a05_2425_away_p_w.jpg
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 1970/71の二冠から、50年の記念でした。
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 2024/25は、ホームのシャツも、大砲だけになります。
    emph: true
    image: assets/images/20261017_kit_arsenal/a05_2425_away_p_w.jpg
    card:
      <<: *id_chest
      highlight_row: 4
  - text: アディダスは、紋章に替わる大砲は、ホームで35年ぶりと発表しました。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: そして2025/26、ホームの胸に、紋章が戻ります。
    image: assets/images/20261017_kit_arsenal/a06_2627_chest_w.jpg
    card:
      <<: *id_chest
      highlight_row: 5
  - text: 2026/27の新しいホームも、胸は紋章です。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    card: none
