- id: colour
  heading: 赤に白い袖は、誰がいつ始めたのか
  tier: 確定
  official: true
  telop: 1886年の濃い赤から、チャップマン監督が赤に白い襟と袖へ。1981年にJVCが初の胸のスポンサー
  narrator: 解説
  card: &id_colour
    type: table
    title: アーセナルのシャツの歩み（クラブ公式）
    columns: &cols_colour
    - いつ
    - できごと
    rows: &rows_colour
    - - 1886
      - 元選手が持ち込んだ濃い赤
    - - 1925〜
      - 赤に白い襟と袖
    - - 1970/71
      - 大砲のシャツで二冠
    - - 1981
      - 初の胸のスポンサー JVC
    - - 2005/06
      - 旧ハイバリー最後の年、えんじ色
    highlight_row: 0
  say:
  - text: 最後に、アーセナルのシャツの色です。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    card: *id_colour
  - text: 1886年、創立期の選手が、前のクラブの赤いキットを持ち込みました。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 前のクラブは、ノッティンガム・フォレストです。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 濃い赤のシャツに、白いショーツ。靴下は青と白の横縞でした。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 赤に白い襟と袖のシャツを考えたのは、1925年に来たチャップマン監督です。
    image: assets/images/20261017_kit_arsenal/a06_2627_chest_w.jpg
    emph: true
    card:
      <<: *id_colour
      highlight_row: 1
  - text: いまのホームの形の、もとになりました。
    card:
      <<: *id_colour
      highlight_row: 1
  - text: 1981年には、ジェイブイシーが、クラブ初の胸のスポンサーになります。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    card:
      <<: *id_colour
      highlight_row: 3
  - text: 2005/06は、旧ハイバリー最後の年で、えんじ色のシャツを着ました。
    card:
      <<: *id_colour
      highlight_row: 4
  - text: 1913/14の、ハイバリー最初の年の色にならったものです。
    card:
      <<: *id_colour
      highlight_row: 4
  sources:
  - https://www.arsenal.com/feature/origins-of-the-arsenal-kit-a4Id94V60OO9
- id: view
  viewpoint: true
  heading: 見立て・紋章の絵は53年止まり、胸は23季のうち5季で別の形
  tier: 背景
  telop: 絵の替わり方は平均17.7年に1回。最長の53年はその約3倍。胸が紋章以外の季は23季のうち5季
  narrator: 解説
  card: &id_ratio
    type: calc
    title: 最長の53年は、平均の何倍か
    terms:
    - - 53年
      - 1949/50〜2001/02
    - - 17.7年に1回
      - 1905〜2011の106年÷6回
    - - 約3倍
      - 割った答え
    ops:
    - ÷
    - ＝
  say:
  - text: ここからは、アーセナルの紋章の替わり方を、数え直して比べます。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    card: none
  - text: ひとつ目は、絵の替わる間隔です。
    card: none
  - text: 1905年から2011/12までの106年に、6回替わりました。
    card: &id_avg
      type: calc
      title: 紋章の絵は、何年に1回替わったか
      terms:
      - - 106年
        - 1905〜2011
      - - 6回
        - 紋章の絵が替わった回数
      - - 17.7年に1回
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 106年を6で割ると、17.7年に1回です。
    card: *id_avg
  - text: ただし、均等ではありません。1921/22からの5シーズンで、3つ出ています。
    card: none
  - text: 一方、1949/50から2001/02までの53年は、新しい絵が1つもありません。
    card: none
  - text: 53年を17.7年で割ると、約3倍です。
    emph: true
    card: *id_ratio
    mark:
      kind: circle
      item: 2
  - text: 最も長く変わらなかった間隔は、平均の約3倍でした。
    card: *id_ratio
  - text: ふたつ目は、胸です。2002/03から2024/25までの23シーズンを見ます。
    image: assets/images/20261017_kit_arsenal/a06_2627_chest_w.jpg
    card: none
  - text: 紋章以外は、2011/12と、2021/22から2024/25の4季です。
    card: none
  - text: 5つのシーズンを、23シーズンで割ります。
    card: &id_chest5
      type: calc
      title: 胸が紋章以外だったシーズンの割合
      terms:
      - - 5シーズン
        - 2011/12と2021/22〜2024/25
      - - 23シーズン
        - 2002/03〜2024/25
      - - 約22%
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 約22%。およそ4.6シーズンに1回です。
    emph: true
    card: *id_chest5
    mark:
      kind: circle
      item: 2
  - text: 紋章の絵は長く止まり、胸の図柄は、ここ数年に動きました。
    card: none
  - text: アーセナルの公式は、先ほどの協議の決まりを載せています。
    card: none
  - text: この決まりが、シャツに付ける大砲に当たるかは、書かれていません。
    card: none
  - text: 次に分かるのは、来季のシャツの胸に何が付くかです。
    card: none
