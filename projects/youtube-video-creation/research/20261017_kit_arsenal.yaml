  say:
  - text: アーセナルの、胸の紋章の話です。
    short_only: true
  - text: 胸の大砲の絵が、何回替わったのかを数えます。
    image: assets/images/20261017_kit_arsenal/a01_2627_eze_w.jpg
    emph: true
    card: none
  - text: 数え方を先に決めます。クラブが新しい絵を出した年だけを、数えます。
    card: none
  - text: 色や書体を整えただけの年は、数えません。
    card: none
  - text: 材料は、クラブの公式サイトの記載です。
    card: none
  - text: 公式の記載は、まず53年の話から始まります。
    card:
      <<: *id_doc
      highlight: []
  - text: 1949/50に現れた紋章は、53年間、大きくは変わりませんでした。
    emph: true
    card: *id_doc
  - text: 2001/02の手直しは、色と書体を整えただけです。
    card:
      <<: *id_doc
      highlight:
      - 整えられました
  - text: 2002年、クラブは新しい紋章に決めたと書いています。
    card: &id_doc2
      type: document
      label: アーセナル公式サイト「The Arsenal Crest」の記載（訳）
      paragraphs:
      - 2002年、未来を受け入れて前へ進むために、新しいエンブレムを作ることにしました。
      - エンブレムやホームのシャツの色を大きく変えるには、サポーターとの意味のある協議が必要です。
      highlight:
      - 新しいエンブレム
      - 意味のある協議が必要
  - text: サポーターとの協議が必要、という決まりも、公式は載せています。
    card:
      <<: *id_doc2
      highlight:
      - 意味のある協議が必要
  - text: そして2024年、シャツの胸から、紋章が消えました。
    image: assets/images/20261017_kit_arsenal/a05_2425_away_p_w.jpg
    callword: 紋章が消えた
    card: none
  - text: 代わりに付いたのは、大砲だけです。
    emph: true
    card: none
  - text: ホームで大砲が付くのは、1989/90以来と、クラブは書きました。
    card: none
  - text: では、紋章の絵は、これまで何回替わったのか。順に数えます。
