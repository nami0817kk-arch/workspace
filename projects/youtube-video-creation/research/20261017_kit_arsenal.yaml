    paragraphs:
    - 1949/50シーズンに現れたエンブレムは、その後53年間、大きくは変わりませんでした。
    - 2001/02シーズンの初めに、商業上の理由で整えられました。金色は1色になり、標語の書体は飾りの少ないものになりました。
