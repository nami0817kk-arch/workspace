# ユニフォームとエンブレムの歴史 アーセナル（10/17 作成。プレミア⑪→⑳→①→⑩ の ① にあたる）。
# 軸：胸の紋章（大砲）が何回形を変えたか。何を1回と数えるかを冒頭で言い、自分で数えて答えを出す。
# 一次情報（arsenal.com）の本文を requests のブラウザ User-Agent で読み、Wikipedia(en) の Arsenal F.C. 記事の Crest 節と突き合わせた。
# 2026-10-17 取材。ブラウザ操作なし。web.archive.org は 429（レート制限）で取れなかったページがある（下記）。
#
# ---- 何を1回と数えるか（冒頭で言う）----
#   **「クラブが新しい紋章の絵を出した年を1回」。色や書体を整えただけの年は数えない。**
#   数える材料は、クラブ公式「The Arsenal Crest」(arsenal.com/news/news-archive/the-arsenal-crest) が番号を振った
#   アーセナル自身の紋章の絵。ウーリッジ区の紋章（公式の(2)）・王立兵器廠の門の紋章（公式の(6)）は参考図で、数えない。
#   公式のページに載るアーセナルの紋章：(1)1905 (3)1921/22 (4)1922/23 (5)1925/26 (7)1949/50 (9)2001/02の手直し (10)2002 (11)2011/12の記念版。
#
# ---- 読んだ根拠の年の一覧（クラブ公式の原文）----
#   1905-10-20  最初の紋章。「Book of Football」の記事に付いた。大砲3門（ライオンの頭付き）。ウーリッジ区の紋章がもと（公式の言い方：universally acknowledged）。
#   1913-1921   ハイバリー移転後、紋章は無かった（公式：「there was no sign of a crest」）。
#   1921/22     便箋に、西向きの大砲1門（公式の(3)）。
#   1922/23     第1節のプログラム（対バーンリー）に、東向きの大砲（公式の(4)）。「just three seasons」使われた。
#   1925/26     西向きの大砲に戻る。1921/22 とよく似た細い大砲。「The Gunners」の文字が横に付く（公式の(5)）。
#   1949/50     「Victoria Concordia Crescit」の紋章（公式の(7)）。西向きの大砲・ゴシック体の Arsenal・イズリントン区の紋章・アーミン。
#               公式：「For the next 53 years this crest remained largely unchanged」。
#   2001/02     「cleaned up for commercial reasons」金色を1色に・標語の書体を飾りの少ないものに（公式の(9)）。**数えない**（色と書体だけ）。
#   2002        新しい紋章（公式の(10)）。「to embrace the future and move forward」。
#   2011/12     125周年の記念紋章（公式の(11)）。シャツに付いた。15枚の月桂樹・15枚の樫の葉・「Forward」・1886と2011。**1シーズンだけ**。
#   →数えると 1905・1921/22・1922/23・1925/26・1949/50・2002・2011/12 の**7種類**。最初の1905を除いた**替わった回数は6回**。
#   公式の同じページ末尾：「Heritage Assets … Any material changes to our club crest or home kit colours would require meaningful consultation with our supporters.」
#
# ---- シャツの胸（クラブ公式・アディダス）----
#   公式「Origins of the Arsenal kit」：大砲の図柄が初めてシャツに付いたのは1967年。このシャツで1970/71に初の二冠。
#     胸の作り手ロゴは1970年代後半（アンブロ）、1981年にJVCが初の胸のスポンサー。2005/06は旧ハイバリー最後の年でえんじ色（1913/14の色）。
#     チャップマン（1925年就任）が「赤いシャツに白い襟と袖」を考えた（年は書いていない）。1886年にノッティンガム・フォレストの元選手が赤いキットを持ち込んだ。
#   公式「The return of the cannon」(2021-05) ：2021/22 アウェー（1970/71の二冠から50年）は紋章の代わりに大砲だけ。
#   公式「Take a closer look at our 2024/25 home kit」：ホームのシャツが大砲を付けるのは「1989/90 以来」。
#   アディダス公式 (news.adidas.com, 2024-05-16)：「The Arsenal cannon replaces the club crest on a home shirt, for the first time in 35 years.」
#   公式「The details behind our 2025/26 adidas home kit」＋公式の写真：2025/26 のホームの胸は紋章（ゴシックの A の柄）。2026/27 のホームの胸も紋章（公式の記事の写真を開いて確認）。
#
# ---- 食い違い（台本では言わない・片方に寄せる。ここに残す）----
#   ・**最初の紋章の年**：Wikipedia は「1888年・大砲3門・北向き」。**クラブ公式は1905年**。→ 台本は公式の1905年。1888は言わない。
#   ・**ホームの胸から大砲だけが消えた年**：Wikipedia は「1991年以来」（紋章が付いた年から）、クラブ・アディダスは「1989/90 以来」。→ 台本は公式の「1989/90」。
#   ・**1930年代の「A-ボール-C」アールデコの印**：クラブ公式は「Arsenal の象徴」と書くが紋章のページの番号付きの図には入っていない。→ 数えない（言わない）。
#   ・**白い袖がいつから**：Wikipedia のキット箱は「1933」、公式の Origins は「チャップマン（1925年就任）が考えた」で年なし。→ 年は言わない。
#   ・**昔のシャツに胸の印があったか**：公式 Crest「shirts remained plain, unless commemorating a significant match」／公式 Origins「Club badge was positioned on the left-hand side」。
#     公式の2つの記述が噛み合わない。→ 台本は Crest の言い方（無地）まで、胸の印の年は言わない。
#   ・**2002年の紋章の形（大砲の向き・色）**：公式ページは形を書かない。Wikipedia は「大砲は東向き・青が入る」。→ 台本では言わない。
#   ・**2025/26 の胸**：アーセナルの記事は紋章かどうかを書かない。onlinegooner（ファンサイト）は「紋章が戻る」。公式の写真（2026/27 のモデル写真）は盾に Arsenal とある。
#     → 台本は「ホームの胸に紋章が戻っています」まで（2025/26 の年は onlinegooner と公式のキット記事の写真名で確認）。確度は背景。
#
# ---- 言わないと決めたもの ----
#   ・**契約の額**（アディダス・エミレーツ）：読んでいない。
#   ・**2022/23・2023/24 のアウェーが大砲のみ・2023/24 のサード・2024/25 の3着すべて**：Wikipedia(Arsenal F.C. の Crest 節)だけが根拠。
#     台本の「胸が紋章以外になったシーズン5つ」はこの Wikipedia に頼る**背景**（見立ての節。tier 背景）。2025/26・2026/27 のアウェー・サードは読んでいないので、数える期間は 2002/03〜2024/25 に区切った。
#   ・女子チーム・ユース（公式は男女の写真が混ざる。台本は男子だけ）。
#   ・Heritage Assets の規定が「シャツの図柄」に当たるかは、公式の文が書いていない → 台本も「書かれていない」と言う。
#
# ---- 自分で数えた数（検算した）----
#   ・紋章の種類：1905, 1921/22, 1922/23, 1925/26, 1949/50, 2002, 2011/12 → 7種類／替わったのは 7−1 ＝ 6回。
#   ・1905〜2011：2011−1905 ＝ 106年／106 ÷ 6 ＝ 17.67 → 17.7年に1回。
#   ・1949/50〜2001/02 の53年：2002−1949 ＝ 53年。53 ÷ 17.67 ＝ 3.00 → 「約3倍」。
#   ・1921/22〜1925/26 の5シーズン（1921/22, 22/23, 23/24, 24/25, 25/26）に新しい絵が 1921/22・1922/23・1925/26 の3つ。
#   ・胸が紋章以外のシーズン（2002/03〜2024/25＝2024−2002＋1 ＝ 23シーズンのうち）：2011/12・2021/22・2022/23・2023/24・2024/25 の5つ／5 ÷ 23 ＝ 0.217 → 約22%（4.6シーズンに1回）。
#   ・35年：2024−1989 ＝ 35。
#
# ---- 一次情報に届かなかったところ ----
#   ・web.archive.org の保存（2008年の The Crest・2004年の新紋章の報道発表・2009年の The Arsenal shirt badge・2011年の125周年）は 429 で取れなかった。
#     現行の arsenal.com「The Arsenal Crest」が同じ内容を番号付きで載せるので、それを根拠にした（2002年の発表文そのものは未読）。
#   ・BBC・NYT/The Athletic の記事は読んでいない（Wikipedia の脚注に出てくるだけ）。
#
# ---- 写真（assets/images/20261017_kit_arsenal/、出典は credits.json） ----
#   すべて arsenal.com の記事の写真（クラブ公式。権利は晴れていない＝引き受ける危険）。取り込んだあと全部開いて見た。
#   a01_2627_eze = 2026/27 ホームのモデル写真（arsenal.com の記事の og:image、ファイル名 eberechieze）。人物名は**ファイル名からの推定なので台本で言わない**。
#       原寸 5000x6666。_w.jpg（16:9 に切った 2560x1440）・_v.jpg（縦）。胸の紋章（盾に Arsenal）がはっきり見える。サムネ用。
#   a05_2425_away_p = 2024/25 アウェーのモデル写真（arsenal.com の記事、原寸 2160x3840 の縦）。胸は大砲だけ。人物名は言わない。_w.jpg が16:9の切り出し（2160x1215）。
#   a06_2627_chest_w = a01 の原寸（5000x6666）から胸の紋章を中心に 16:9 に切った 1920x1080。
#   （1000〜1123px の写真 3枚＝2024/25 ホームの Ødegaard 写真・2025/26 ホームの2人・2021/22 アウェー は、横に1.7〜1.9倍引き伸ばすため外した。原寸が1123pxまでしか無かった）
#   クラブの現行エンブレム assets/crests/アーセナル.png（折れ線の2002年の印）・assets/backgrounds/cut_アーセナル.png（節の頭の紋章の差し込み）。権利は晴れていない。
#   **過去の紋章の画像は使っていない**（権利が晴れない）。板は文字だけの年表。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**。ここの thumbnail は点検用の1案。
