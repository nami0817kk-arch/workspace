#       「キャプテンマークを巻かせてもらったり、責任を与えてもらったり、いろいろありましたけど、森保さんとは一緒に成長できたのかなと。山あり谷ありのところをスタッフも一緒に経験して、成長していける監督だったのかなと感じます。僕自身、苦しいことも多かったですけど、それ以上に良かったこともあった。感謝しかないですね」
#       「代表戦でこういう最後の試合を迎えるって、なんかすごく不思議な感じではありますけど、アジアカップがなくなったので。だから、しっかり勝って、みんなで森保さんを最後いい送り出し方ができればいいかなと思います」
