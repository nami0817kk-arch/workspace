# 福西崇史（元日本代表 MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-21。型は 11/17 の福田正博と同じ8節の変形（「あの試合」の代わりに「あの1年」＝2004年のアジアカップ、「見立て」＝代表の点が集まった年）。
# **情報の時点は 2026-11-12。**年齢は出さない。いまの仕事は言わない（解説・JFA・Jリーグ理事・南葛SCは入れない）。私生活・法的な問題・女子サッカーは入れない。
# **題材を選んだ理由**：引退した日本人の大物。ジュビロ磐田の黄金期の主力・2002/2006年W杯・2004年アジアカップ優勝。既出の国内レジェンドに無い（posted.json・covered.yaml・scripts/・picks で確認）。
# **引退の確認（要注意）**：日本語版「2009年1月に現役引退を表明。最後の試合は2008年の東京V」。ただし日本語版に「2018年に南葛SC（東京都1部）で現役復帰」の記述がある（台本では入れていない）。プロとしては引退済みだが、完全な引退かは確かめていない。
# **数字の出どころ（日本語版・英語版 Wikipedia「福西崇史」「Takashi Fukunishi」の表を WebFetch の抽出で読んだもの。原ページと一字ずつは突き合わせていない）**
# - J1年別 試合-得点：磐田 1995 10-1、96 27-2、97 21-4、98 22-2、99 27-10、00 27-5、01 29-4、02 28-5、03 26-5、04 26-6、05 23-2、06 26-7／FC東京 2007 28-6／東京V 2008 29-3。**得点を足すと62（表の通算62と一致）。試合を足すと369で、表の通算欄は349。不一致の理由は確かめていない**ので、台本とサムネでは試合数の通算を言わず、得点62だけを使う。
# - 日本代表 64試合7得点。年別：1999 3-0、2000 0-0、2001 2-0、2002 10-0、2003 6-0、2004 18-5、2005 14-1、2006 11-1（足して 64-7）。2004年以外＝46試合2点（自分で引いた）。
# - タイトル（英語版）：J1 1997・1999・2002、ACL（アジアクラブ選手権）1999、ナビスコ杯1998、アジアカップ2004。ベストイレブン 1999・2001・2002・2003（日本語版・英語版）。
# - 2004年アジアカップ（日本語版「AFCアジアカップ2004」）：1次リーグD組（オマーン・タイ・イラン）、7/24 タイ戦 4-1 で福西が68分（日本の3点目。中村21・中澤56・福西68・中澤87）。準々決勝ヨルダン 1-1（PK 4-3）、準決勝バーレーン 4-3（延長）、決勝は中国に勝って優勝（スコアは確認できず言わない）。英語版は「決勝でも得点」と書くが日本語版の抽出では確認できないため使わない。
# - 1999年コパ・アメリカでペルー戦に代表デビュー（英語版）。2002年W杯はロシア戦に途中出場（日本語版は短時間、英語版は5分）。2005年コンフェデ杯ブラジル戦（2-2）に出場。2006年W杯は2試合に先発（日本語版）。
# - 2006年末、磐田と契約の話がまとまらず退団（日本語版）。2007年FC東京、2008年東京Vへ。2009年1月に現役引退を表明。
# **本人の言葉は取れていない**。台本は本人の言葉なしで組んだ。
# **写真**：Commons「Takashi Fukunishi 2012.JPG」（CC BY-SA 2.0, Norio NAKAYAMA, 2012, 986x1825の縦長）。現役時代ではない（引退後のイベントの撮影か）。01_w は顔に寄せた切り出し（986x555）、01_v は縦。同じ顔のアップが全場面で続くので画面の変化は少ない。
