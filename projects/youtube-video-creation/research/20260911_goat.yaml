sections:
  - id: now
    heading: いま、2人はどこにいるか
    tier: 報道
    telop: 41歳と38歳
    narrator: キャスター
    say:
      - クリスティアーノ・ロナウドは41歳。サウジアラビアのアル・ナスルでプレーしています。
      - 9日の試合で、キャリア通算979ゴール目を決めました。
      - リオネル・メッシは38歳。アメリカのインテル・マイアミにいます。
      - 通算得点は920点を超えたところです。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1008051/
      - https://www.footballchannel.jp/2026/09/09/post1007448/

  - id: totals
    heading: 通算の数字を並べると
    tier: 背景
    main: true
    telop: 得点はロナウド、アシストはメッシ
    narrator: 解説
    card:
      type: table
      title: 通算の数字
      columns: ["", "メッシ", "C・ロナウド"]
      rows:
        - ["得点", "920超", "979"]
        - ["出場", "1150超", "1300超"]
        - ["バロンドール", "8回", "5回"]
        - ["タイトル", "46", "35"]
    say:
      - 得点で前にいるのはロナウドです。通算979点は、公式戦の記録として史上最多とされています。
      - 出場も1300試合を超え、フィールドプレーヤーでは最も多い数字です。
      - メッシは920点を超えたところで、史上2番目。ただしアシストは420を超え、こちらは史上最多です。
      - 個人賞では逆になります。バロンドールはメッシが8回、ロナウドが5回。
      - チームのタイトルはメッシが46、ロナウドが35で、どちらもサッカーの歴史で最も多い部類です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/10/post1008051/
      - https://www.footballchannel.jp/2026/09/09/post1007448/

  - id: ucl
    heading: チャンピオンズリーグでは
    tier: 報道
    telop: 到達の速さはメッシ、総量はロナウド
    narrator: 解説
    card:
      type: bars
      title: CLで50点に到達するまでの試合数
      items:
        - {label: "メッシ", value: 66}
        - {label: "C・ロナウド", value: 91}
      unit: 試合
    say:
      - チャンピオンズリーグでは、分かれ方がはっきりします。
      - 50得点に到達したのは、メッシが66試合目、ロナウドが91試合目。25試合の差があります。
      - 100得点までの最速もメッシで、80試合。ロナウドは98試合でした。
      - ところが、CLの通算得点で最も多いのはロナウドです。140得点。アシストも42で最多です。
      - 速さではメッシが前に出て、積み上げた総量ではロナウドが前に出る。そういう分かれ方をしています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007448/
      - https://web.ultra-soccer.jp/news/all/35674/
