# メッシとC・ロナウドを数字で並べる（2026年9月11日）。
# ユーザー指示「特例でメッシとロナウドを比較する動画作って」
#
# **これはニュースではない。**その日の出来事が無い題材を作るのは例外で、
# ユーザーの指示による。**数字だけで成立する型**（順位表や走行距離と同じ）。
#
# 数字の出どころは2つに分けてある。
#   ・CLの到達試合数 … 9/9 の報道（フットボールチャンネル、ウルトラサッカー）
#   ・通算の得点・出場・タイトル … 英語版Wikipedia（背景）
# **「979」はフットボールチャンネルが9/10に伝えた数字。**メッシ側は
# 「920点超」までしか確かめられていないので、**そのままの粗さで書く。**
# 細かい数字を作らない
#
# 引きは**「どこで差がつくのか」**。どちらが上かを言い切らない
#
# **反応は入れない。**読める形のスレが無かった
