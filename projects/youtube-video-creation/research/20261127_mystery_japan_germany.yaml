# 取材メモ（11/27 金、新しい型「サッカーの謎」の試し、key: mystery_japan_germany）。情報の時点は 2026-11-21。
# 題材：なぜ日本人選手はドイツ（ブンデスリーガ）に多いのか。指示書 20261127_series_brief.md の候補1。
#   既出確認：scripts・posted.json・covered.yaml・picks を grep。同じ問いの回は無し（奥寺・長谷部・高原・槙野はレジェンドで個人として既出。この回は人ではなく問い）。
#   同じ日（11/27）の他シリーズ：ケイン（バイエルン）・ヤマル×ニコ・ドルトムントのスタジアム・レジェンド（国内）。→ 香川（ドルトムント）と伊藤洋輝（バイエルン）は語らない。
# 使った数字と出どころ
#   28人：サッカーキング 2026-08-20「8月20日現在、1部および2部に所属するクラブ（トップチーム）には、総勢28名もの日本人選手（日本国籍資格を持つ選手を含む）…過去最多の規模」。※同じ記事の前半に「20名を超える」とも書く（矛盾は記事のまま）。
#   15人：bundesliga.com 2026-06-20「冬の移籍期間のあと、1部の日本人15人。日本より多いのはオーストリア・フランス・デンマークだけ。スイス・アメリカ・オランダ・ベルギーより多い」。
#   スペイン1部2人：ja.wikipedia「ヨーロッパのサッカーリーグに所属する日本人選手一覧」2026-10-02 編集（久保建英・佐藤龍之介）と config/japan_abroad.yaml（10/14、ES1 2人）が一致。
#   2部に10人超：サッカーキング同記事が2部のクラブで名前を挙げた日本人が12人（藤田・安藤・原・三好・関根・髙橋・安部・松田・秋山・古川・田中聡・福田）。
#   EU外の上限なし：en.wikipedia「Foreign football players in Germany」：2006-07から非EUの制限を撤廃、DFBとDFLの2005-12-21の決定。
#   スペイン：en.wikipedia「La Liga」：2020年、非EUは1クラブ5人まで、試合の登録は3人まで（台本は「試合に登録できるのは3人まで」とだけ言う）。
#   イングランド：FA 2020-12-01 発表、2021年からGBEの点数制（代表の出場・前所属リーグの強さ）。
#   50人超：ja.wikipedia「ドイツ・ブンデスリーガに所属する日本人サッカー選手一覧」（2026-10-21 更新）で1部の現所属17人＋過去38人＝55人を自分で数えた。台本は「50人を超える」。
#   長谷部：en.wikipedia：1部380試合、ドイツ人以外で3番目、2020-06-06にアジア最多、2008年1月ヴォルフスブルク、2009年優勝（日本人2人目）、2022-05-18 EL優勝。奥寺が1人目の優勝（1977-78 ケルン）。
#   遠藤航：en.wikipedia：2019-08-13 シュトゥットガルトへ期限付き、2020年4月完全移籍、最後の季に主将、1部でデュエル最多の季、2023年リヴァプールへ1600万ポンド。2019-20 のシュトゥットガルトが2部だったのは記憶（未確認）。
#   板倉（シャルケ2021-22 2部優勝）・田中碧（デュッセルドルフ2021〜、2024リーズ）は記憶と ja.wikipedia 一覧の在籍年で、優勝・2部であることの一次は未確認。
#   シュレーダーの言葉：bundesliga.com 2026-06-20 の英語の引用を訳した（"Zento is a defensively minded, tactically disciplined midfielder who is strong in the tackle, covers plenty of ground"）。フライブルク（ザイアー）とシャルケ（ムルダー）は aggressive の一語だけ。
#   自分で計算：28÷2＝14倍／15÷2＝7.5（時点が違うので台本は「昨季後半の15人と、いまの2人」と時点を言う）。
