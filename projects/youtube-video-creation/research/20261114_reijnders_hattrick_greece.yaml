#       勝利でオランダは3勝2引き分け・勝ち点11で首位維持。現地16日にグループ最終節でドイツと対戦。記事に発言は無い。
#   ・ESPN の順位（uefa.nations standings、2026-11-14 取得）グループA2: オランダ 5試合 勝ち点11（得失点+9）／ギリシャ 5試合 8／ドイツ 5試合 8／セルビア 5試合 0。
