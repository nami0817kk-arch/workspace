#   ・オランダのここまで（ESPN）: 9/24 ドイツ 1-1、9/27 セルビア 2-1（敵地）、10/1 ギリシャ 2-2（敵地）、10/4 セルビア 2-1、11/13 ギリシャ 7-0。→ 3勝2引き分け。
# 食い違い:
#   ①33分の3点目の起点：ESPN は「アシスト デュンフリース」、フットボールチャンネルは「フェールマンの浮き球をティンバーが頭で折り返し、ラインデルスが押し込んだ」。→ 台本は3点目の起点を言わず、得点者と分だけ言う。
#   ②6分の先制：フットボールチャンネルは「ギリシャのDFのパスミスから奪ってのGKとの1対1」。ESPN は「ペナルティエリア中央から右足」のみ。→ 台本はサマーヴィルの先制と分だけ。
#   ③24分のギリシャの取り消しゴール（VARでハンド）はフットボールチャンネルのみ。ESPN の記録では確かめられない → 台本に使わない。
#   ④「40分で5ゴール」：ESPN の分（6・12・18・33・40）から自分で数えると、40分までの5点で一致。依頼の見出しと合う。
#   ⑤ラインデルスの「国際Aマッチ初のハットトリック」かは出典に無い → 言わない。ラインデルスの所属クラブ（マンチェスター・シティ）も今回の出典に無いので言わない。
