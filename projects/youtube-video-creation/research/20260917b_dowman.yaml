      - {voice: アルテタ監督, text: そこが彼のいちばんの長所だ}
      - ただ、手放しではありませんでした。
      - リーグ戦の強度のなかで、**16歳がこれを続けることの難しさ**にも触れています。
      - この選手は今季すでに、**プレミアリーグ史上最年少の得点者**にもなっています。
      - アーセナル史上最年少の先発も、15歳302日で記録しました。
