    narrator: 解説
    say:
      - {short_only: true, text: カラバオ杯で、アーセナルの16歳が2点を決めました。}
      - この2得点で、ひとつの記録に並びました。
      - "**プレミアリーグのクラブで、16歳が1試合に複数得点を決めた**という記録です。"
      - それまで唯一の名前が、ウェイン・ルーニーでした。
      - 2002年10月、エヴァートンでのリーグカップ、レクサム戦です。
      - ルーニーもそのとき16歳で、同じ試合で2点を取っています。
      - 24年のあいだ、この欄にはルーニーの名前しかありませんでした。
      - ダウマンは、そこに並んだふたりめです。
    official: false
    sources:
