#   最低限の前提（18日のマラガ戦で1ゴール1アシスト）だけ冒頭に1行。
# 本人の言葉: この題材には無い（作らない）。引いたのは 新聞の評価（鉤括弧は SK が訳した原文のまま）と、監督の言葉。
