#     エル・デスマルケ 評価点「9」（オヤルサバルとともにトップタイ）／「タッチライン側にとどまることなく、常にゴールを意識した巧みかつトリッキーなプレー」
#     ムンド・デポルティーボ「ラ・レアルの右サイドがこれほど輝いたのは、本当に久しぶりのことだった」／「タケ・クボ、昇る太陽のようにレアル・ソシエダに道を照らす」
#     マタラッツォ監督（マルカ）「彼の試合に対する姿勢、集中力と覚悟の重さにとても満足している」
# 資料のずれ: ゴールの入った場所＝SK の2本で「ゴール右上」（ムンド・デポルティーボの引用）。10/19 の資料では左隅とする記事もあった → 台本はゴールの場所を言わない。
#   「302日ぶり」は SK（2218199）の数字。10/19 のゲキサカは「約10か月ぶり」（同じこと）。
# 数えた比べ（見立て）: 3紙（アス・エル・デスマルケ・ムンド・デポルティーボ）のうち、ゴールだけでなくそれ以外の働き（右サイドでの動き・相手の左サイドバック・フォルトの起点）にも触れたのは2紙（エル・デスマルケ・ムンド）。
