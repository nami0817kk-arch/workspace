- id: episode
  heading: 1996年の欧州王者のあと、ユヴェントスの決勝はどうなったのか
  tier: 背景
  telop: 1996年5月、ローマでアヤックスにPK戦で勝ち、2度目の欧州王者。その後の決勝は5回とも負け
  narrator: 解説
  say:
  - text: 1994年。マルチェロ・リッピが監督に就きます。
    image: assets/backgrounds/stadium_ユヴェントス_in.png
  - 1996年5月22日。ヨーロッパの頂点を決める決勝は、ローマで行われました。
  - 相手は、前の年の王者アヤックス。
  - 12分、ラバネッリが角度のない所から決めて先制します。
  - 41分に追いつかれ、延長戦が終わって1対1の引き分け。
  - text: PK戦は4対2の勝ち。2度目の欧州王者になりました。
    card:
      type: table
      title: ヨーロッパの頂点を決める決勝
      columns:
      - 年
      - 相手と結果
      rows:
      - &id001
        - 1996年
        - アヤックスにPK戦で勝ち
  - text: 翌1997年と98年も決勝へ。3年続けての決勝です。
    card:
      type: table
      title: ヨーロッパの頂点を決める決勝
      columns:
      - 年
      - 相手と結果
      rows:
      - *id001
      - &id002
        - 1997年
        - ドルトムントに1対3
      - &id003
        - 1998年
        - レアル・マドリードに0対1
  - ただ、ドルトムントに1対3、レアル・マドリードに0対1で負けます。
  - text: そのあとの2003年、2015年、2017年の決勝も、勝てませんでした。
    card:
      type: table
      title: ヨーロッパの頂点を決める決勝
      columns:
      - 年
      - 相手と結果
      rows:
      - *id001
      - *id002
