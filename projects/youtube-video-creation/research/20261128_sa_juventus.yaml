- id: rise
  heading: 2部に落ちたユヴェントスは、どうやって9連覇までたどり着いたのか
  tier: 背景
  telop: 2006年にカルチョポリの処分で初の2部。1年で戻り、2011年に新スタジアム。2012年から9年続けて優勝
  narrator: 解説
  main: true
  say:
  - text: 2006年。ユヴェントスは、クラブの歴史で初めて、2部に落とされます。
    image: assets/backgrounds/stadium_ユヴェントス_in.png
    card:
      type: table
      title: ユヴェントスの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 2006年
        - カルチョポリの処分で初めて2部へ
      - - 2007年
        - 2部で優勝して1部へ
      - - 2011年
        - 新しいスタジアムが開く
      - - 2012年
        - 負けなしで優勝。連覇の始まり
      - - 2020年
        - 9年続けての優勝
  - 審判をめぐる不正の事件、カルチョポリの処分でした。
  - 2004年から05年の優勝は、取り消されました。
  - 2部では、勝ち点マイナス9から始めることになります。
  - 最初はマイナス30の処分が、9まで減らされていました。
  - text: 主力の多くが去るなか、デル・ピエロ、ブッフォン、ネドベドは残りました。
    card: none
    image: assets/backgrounds/stadium_ユヴェントス.png
  - 2部は1年で優勝。デル・ピエロは21得点で、2部の得点王でした。
  - 2011年、新しいスタジアムの最初のシーズンに、コンテが監督になります。
  - アントニオ・コンテは、かつてユヴェントスでプレーした人です。
  - その1年目、2011年から12年は、リーグ戦で1度も負けずに優勝します。
  - 20クラブで争う形になってから、イタリアで初めての無敗優勝でした。
  - 2013年から14年の勝ち点**102**は、セリエAの最多記録です。
  - 2014年からはアッレグリが引き継ぎ、優勝を重ねます。
  - 2020年までに、**9年**続けての優勝。イタリアの1部の記録です。
  sources:
  - https://en.wikipedia.org/wiki/Juventus_FC
  - https://en.wikipedia.org/wiki/History_of_Juventus_FC
  - https://en.wikipedia.org/wiki/2006_Italian_football_scandal
  official: false
