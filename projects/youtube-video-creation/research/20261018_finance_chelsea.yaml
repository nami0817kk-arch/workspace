# クラブの財政：チェルシー（10/18 日、シリーズ「クラブの財政」、key: finance_chelsea、型は news）。
#
# 軸は「**収入の世界10位（チェルシー）と9位（トッテナム）の差は8850万ユーロ。では赤字・給料の比率はどれだけ離れているのか**」。
#   → 収入の差は13%でも、決算書（ポンド）では、最終の赤字は約2.8倍、人件費の比率は27.9ポイント離れていることを、トッテナム（10/16 の財政の回）と同じ年度・同じ通貨で並べる。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／
#     リヴァプール＝放映権／マンU＝償却・金融費用／トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差760万ユーロと給料の比率）は1行も出さない。
#     ★10/17 の「チェルシーの今夏の移籍」の回（支出・収支・約72億円・戻った額）と言い回しを重ねない。移籍金の合計・選手名・売り買いの話は言わない。決算の「選手を売った利益」は会計の数字としてだけ出す。
#     ★規制の判決・処分・訴訟の話は言わない。決算書の「法務と規制に関する支払い」の1行だけ（注記5の原文。固有名詞なし）。
#     ★クラブの数字は決算書の範囲のまま。部門名は並べない（女子は扱わない決まり）。前の年に売った会社の1年分が入っていることだけ言う。アルファベットは読み上げに出さない。
#
# **決算期**：チェルシー・FC・ホールディングス（Companies House 02536231）と、クラブの会社（チェルシー・フットボール・クラブ・リミテッド 01965149）はどちらも**2025年6月期**（2024-25）。
#   ・決算書の署名 2025-10-14、Companies House への提出（AA）2026-04-12（どちらも同日）。**2026年6月期は未提出**（提出履歴の最新の決算書。2026-10-18 確認）。
#   ・トッテナム（10/16 の回）は2025年6月期・提出 2026-04-09。**同じ年度・同じ通貨（ポンド）**。デロイトの数字だけがユーロ（€1＝£0.84。デロイト一次ページの注記）。
#   ・**範囲**：この回は**ホールディングスの連結**（収入 490,857）を使う。クラブの会社だけは収入 442,466・営業損益（売却益の前）−307,445・最終損益 −256,700。
#     トッテナムも連結（10/16 の回）なので、連結どうしで比べる。台本で一言断る。
#
# **出どころ（読んだもの）**:
#   ○ **Companies House のホールディングス 2025年6月期 決算書（46ページ、スキャン画像）**をページ画像で読んだ：戦略報告 p1（収入・費用・選手売却益・貸借の文）／連結損益 p14（原数値）／
#       注記2 p29（前の年の子会社の売却・法務の引当）・注記3 p29（収入の内訳）・注記5〜6 p30（減損・償却・売却益）・注記8 p30〜31（従業員数・人件費の内訳）。
#   ○ **Companies House のクラブの会社 2025年6月期 決算書（38ページ）**：損益 p14（範囲の断りのため）。
#   ○ **デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com）**：ランキング 9位トッテナム・10位チェルシー。クラブごとの図（ページに埋め込まれた図の中身）で
#       **チェルシー €584.1m（前の年 €545.5m、+7%、+€38.6m）／トッテナム €672.6m（前の年 €615m、+9%、+€57.6m）**。5年の図（試合日・放映権・商業）と給料（チェルシー 418・トッテナム 298、百万ユーロ）。
#       為替の注記：€1＝£0.84。**差 672.6−584.1＝88.5 百万ユーロ**（10/17 の財政の回のメモの数字と同じ）。
#   ○ **ヨーロッパ中央銀行の参照相場（frankfurter 経由）2026-10-16：1ポンド＝210.72円**（10/17 の回と同じ相場）。
#   × **クラブ公式の決算発表・BBC は読めなかった**（クラブ公式サイトの決算発表のURLは特定できず、BBC の記事も見つからなかった）。この回は決算書そのものとデロイトの一次ページだけ。
#   × 2026年6月期の数字・2025-26 の収入の見通しは読めない（未提出）。言わない。
#
# 自分で計算した数（コードで検算した）:
#   収入（百万ポンド）：チェルシー 490.857（前の年 468.486、+22.371、+4.8%）／トッテナム 565.266（528.191、+37.075、+7.0%）。差 74.409 →「7440万」。74.409÷565.266＝13.2% →「13%」。
#     ユーロに直す（÷0.84）：74.409÷0.84＝88.6 →「約8860万ユーロ」（デロイトは 88.5。ほぼ同じ）。
#   収入の中身：チェルシー 試合日 86.762・放映権 203.230（**欧州カンファレンスリーグとクラブワールドカップの収入を含む**。戦略報告）・商業 200.865。
#     トッテナム 試合日 126.473・放映権 126.993＋欧州の賞金 34.716＝161.709・商業 276.699＋その他の収入 0.385＝277.084。
#     差（トッテナム−チェルシー）：試合日 +39.711／放映権など −41.521／商業など +76.219 → 合計 +74.409 ✓。
#   チェルシーの前の年との差：放映権 +40.129（163.101→203.230）／商業 −24.400（225.265→200.865）／試合日 +6.642（80.120→86.762）。
#   営業損益（売却益を足す前。決算書の「Operating loss」）：チェルシー −308.157（前の年 −212.959）／トッテナム −102.963（10/16 のメモ。決算書の「Operating profit/(loss)」の行）。
#   チェルシーの営業損益の道筋：収入 490.857−売上原価 428.673−管理費（選手の償却・減損・取引 224.344）−ほかの管理費 146.497＋その他の収入 0.500＝−308.157 ✓。
#     丸め 490.9−428.7−224.3−146.5＋0.5＝−308.1（決算 −308.2。0.1の端数）。営業費用 428.673＋370.841＝799.514（戦略報告「£799.5m」、前の年より +117.4）。
#   最終損益の道筋：−308.157＋選手の売却益 57.906＋利息（受取 11.149−支払 20.357＝−9.208）＋固定資産の売却損 −2.985＋税 −0.203＝−262.647 ✓（税引き後の損 −262.444）。
#     丸め：−308.2＋57.9−9.2−3.2＝−262.7（決算 −262.6。0.1の端数）。
#   最終損益：チェルシー −262.647（前の年 +129.606）／トッテナム −94.666（−26.226）。赤字の比 262.647÷94.666＝2.77 →「約2.8倍」。差 167.981 →「1億6800万」。
#   売却益を除いた最終損益：チェルシー −262.647−57.906＝−320.553 →「3億2060万」／トッテナム −94.666−52.565＝−147.231 →「1億4720万」。差 173.322 →「1億7330万」。
#     売却益：チェルシー 57.906（前の年 152.463）／トッテナム 52.565（82.305）。
#   前の年のチェルシーの黒字 129.606 は、子会社の売却益 198.749 を含む（戦略報告・注記2：2024-06-28 に売却、対価 200.0）。前の年の数字には、その会社の1年分の損益が入っている。
#   人件費（注記8 の賃金＋社会保険料＋年金）：チェルシー 359.265（前の年 338.021）／トッテナム 255.811（221.929）。差 103.454 →「1億350万」。
#     人件費÷収入：チェルシー 359.265÷490.857＝73.19%（前 338.021÷468.486＝72.15%）／トッテナム 255.811÷565.266＝45.25%（前 42.02%）。差 27.94pt →「27.9」。
#     変化：チェルシー +1.04pt →「1.0」／トッテナム +3.24pt →「3.2」。人件費 359.265÷255.811＝1.404 →「約40%多い」／収入 490.857÷565.266＝0.868 →「約13%少ない」。
#     デロイト図の給料÷収入：チェルシー 418÷584.1＝71.6%／トッテナム 298÷672.6＝44.3%（定義が違う。向きだけ使う）。
#   選手の償却：チェルシー 213.893（無形資産の償却。減損 12.097 は別）／トッテナム 141.851（償却そのもの）。213.893÷141.851＝1.51 →「約1.5倍」。
#   5年の収入（デロイトの図の試合日＋放映権＋商業。図は整数。百万ユーロ）：チェルシー 494・569・536・545.5・584.1／トッテナム 406・523・631・615・672.6。
#     差（トッテナム−チェルシー）：−88・−46・+95・+69.5・+88.5。**2020-21 はチェルシーが約8800万ユーロ上、2022-23 からトッテナムが上**。
#     5年の伸び：チェルシー 584.1÷494＝1.18倍／トッテナム 672.6÷406＝1.66倍。2020-21 の試合日はほぼ無し（チェルシー 9・トッテナム 2。観客が入れなかった年）。
#   円換算：262.647×210.72＝55,345 百万円 →「約553億円」。
#
# **言い切っていないもの / 言わなかったもの**:
#   ・赤字の理由は、決算書の戦略報告の文（選手の償却と減損の増加・給料を含む売上原価の増加・規制に関する費用）まで。人件費が高い理由は言わない。
#   ・前の年のデロイトの図の「その他の収入」の扱い・チェルシーの連結の範囲の違い（部門）は言わない。
#   ・借入・現金・資産・親会社の資金・オーナーは言わない（範囲が違い、同じ土俵で比べられない。この回は損益と給料の比率）。
#
