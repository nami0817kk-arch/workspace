  say:
  - 4部からプレミアリーグまで、**5シーズン**で駆け上がったクラブです。
  - イングランドのサッカーで**3番目に速い**上がり方とされています。
  - その締めくくりが2008年でした。
  - チャンピオンシップのプレーオフ決勝、相手はブリストル・シティ。
  - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
  - 1対0。**クラブの歴史ではじめて、1部に上がります。**
  official: false
