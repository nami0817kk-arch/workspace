- id: data
  heading: ハル・シティ 基礎DATA
  main: true
  tier: 背景
  telop: 1904年創立
  narrator: 解説
  say:
  - short_only: true
    text: 守田英正の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_hull_data0.png
    text: 創立は**1904年**です。
    no_telop: true
  - image: assets/stats/pl_hull_data1.png
    text: 愛称は「タイガース」。黒と琥珀色の縞模様を、昔から着てきたクラブです。
    no_telop: true
  - image: assets/stats/pl_hull_map.png
    text: ホームタウンはキングストン・アポン・ハル。イングランド東部です。
    no_telop: true
  - image: assets/backgrounds/stadium_ハルシティ_in.png
    text: 本拠地はエムケーエム・スタジアム。**約2万5000人**が入ります。
  - image: assets/photos/pl/hull_owner_8739e202.jpg
    text: オーナーはトルコの実業家アジュン・ウルジャル。2022年からクラブを持っています。
  - image: assets/stats/pl_hull_data6.png
    text: 1939年には、カーライル・ユナイテッドに**11対1**で勝っています。クラブ最大の勝利です。
    no_telop: true
  - image: assets/stats/pl_hull_cups.png
    text: 昨季は2部のプレーオフ決勝でミドルズブラを破り、プレミアに上がってきました。
    no_telop: true
  - image: assets/stats/pl_hull_data8.png
    text: プレミアでの最高位は、2013年から14年の**16位**です。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  bg: assets/backgrounds/stadium_ハルシティ.png
  official: false
- id: episode
  heading: 名前を変えられかけた
  tier: 背景
  telop: 「ハル・タイガース」への改名、退けられる
  narrator: 解説
  card:
    type: table
    title: 名前を変えられかけた
    columns:
    - ''
    - ''
    rows:
    - - 2013年
      - オーナーが「ハル・タイガース」への改名を表明
    - - サポーター
      - 「City Till We Die」
    - - 2014年4月9日
      - FAが63.5%の票で退ける
  say:
  - '**2013年**、当時のオーナー、アッセム・アラムが「ハル・タイガース」への改名を言い出しました。'
  - 「シティ」はありふれていて、名前は短いほうが売れる、という理由です。
  - サポーターは「死ぬまでシティ」と声を上げました。
  - 2014年4月、イングランドサッカー協会の評議会が**63.5%**の票で改名を退けました。
  - そのアラムからクラブを買い取ったのが、いまのオーナー、ウルジャルです。
  sources:
  - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - https://en.wikipedia.org/wiki/Acun_Ilıcalı
  bg: assets/backgrounds/stadium_ハルシティ.png
  official: false
- id: rise
  heading: 4部からプレミアまで5年
  tier: 背景
  telop: 4部からプレミアまで5シーズン
  narrator: 解説
  card:
    type: table
    title: 駆け上がった5シーズン
    columns:
    - ''
    - ''
    rows:
    - - 出発点
      - 4部
    - - 2008年
      - プレーオフ決勝でブリストル・シティに1-0
    - - 速さ
      - イングランドで3番目
  say:
  - はじめて1部に上がったのは**2008年**。4部から**5シーズン**で駆け上がりました。
  - その年のプレーオフ決勝の相手は、ブリストル・シティでした。
  - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
  - この1点を守りきり、ハルが1対0で勝ちました。
  - この上がり方は、イングランドのサッカーで**3番目に速い**とされています。
  sources:
  - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  bg: assets/backgrounds/stadium_ハルシティ.png
  official: false
