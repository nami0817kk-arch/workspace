  - text: ウニオンはブンデスリーガで9試合を終えて、**1勝4引き分け4敗**です。
  - 順位は**16位**、勝ち点は**7**です。
  - text: ホームの5試合は、1勝3分け1敗で勝ち点6。
    card:
      type: stats
      title: 今季のリーグ戦（9試合）
