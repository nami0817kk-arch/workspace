  - text: 鍵は、最後の本拠地での勝ち点。
    card: none
    image: assets/backgrounds/stadium_ウニオンベルリン_in.png
  - 勝ち点を試合数で割ると**0.78**。昨シーズンの1.15を下回っています。
  - 失点は1試合**2.33**で、昨シーズンの1.71より増えました。
  - 得点は1試合0.78で、昨シーズンの1.29には届いていません。
