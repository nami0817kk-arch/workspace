sections:
- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: ファン手づくりの本拠地は今季が最後。2023年にチャンピオンズリーグ初出場
  narrator: キャスター
  say:
  - short_only: true
    text: ウニオン・ベルリンは、東ベルリンで生まれたクラブです。
  - text: 本拠地は、ファンが自分たちの手で建て直したスタジアムです。
    image: assets/stats/bd_unionberlin_data_r1.png
    no_telop: true
  - text: その本拠地で戦うのは、今季が最後になります。
    image: assets/stats/bd_unionberlin_data_r2.png
    no_telop: true
  - text: 2023年には、チャンピオンズリーグに初めて出ました。
    image: assets/stats/bd_unionberlin_data_r3.png
    no_telop: true
  - image: assets/stats/bd_unionberlin_data0.png
    text: 創立は**1966年**。前身は、1906年にできたクラブです。
    no_telop: true
  - image: assets/backgrounds/stadium_ウニオンベルリン.png
    text: 本拠地のアルテ・フェルステライには、**2万2012人**が入ります。
  - image: assets/stats/bd_unionberlin_cups.png
    text: 東ドイツカップは、1968年に**1回**優勝しています。
    no_telop: true
  - image: assets/stats/bd_unionberlin_data6.png
    text: ヨーロッパの舞台は、2023年のチャンピオンズリーグが初めてです。
    no_telop: true
  - image: assets/stats/bd_unionberlin_data8.png
    text: 昨シーズンは**11位**。勝ち点39で、1部に残りました。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
  - https://en.wikipedia.org/wiki/2026–27_1._FC_Union_Berlin_season
  - https://site.api.espn.com/apis/v2/sports/soccer/ger.1/standings
  bg: assets/backgrounds/stadium_ウニオンベルリン_in.png
  official: false
- id: stadium
  heading: ファンが自分で建てた本拠地を、ウニオンはなぜ今季かぎりで離れるのか
  tier: 背景
  telop: 2008年に改修を決め、ファン2000人超が14万時間働いた。今季が現スタジアム最後の季
  narrator: 解説
  main: true
  say:
  - text: 本拠地のアルテ・フェルステライは、1920年に開場した、古い競技場です。
    image: assets/images/bd_unionberlin_builders/scene.jpg
  - 2008年、クラブは建て直しを決めます。
  - お金が足りず、工事にはファンが加わりました。
  - text: 2000人以上のファンが、あわせて**14万時間**働きました。
    card:
      type: stats
      title: 本拠地を建てたファン
      items:
      - - '2000'
        - 人超
        - 建設に加わったファン
      - - 14万
        - 時間
        - あわせて働いた時間
      - - 2万2012
        - 人
        - いまの収容人数
      focus: 1
  - 1日8時間なら、1人で約48年ぶんの仕事です。
  - text: ベルリンで2番目に大きなスタジアム。座席は3617で、残りは立ち見席です。
    card: none
    image: assets/images/bd_unionberlin_gegen/scene.jpg
  - 2017年、クラブは3万7000人への増築を発表します。
  - ところが、駅や電車など交通の準備が追いつかず、計画は遅れました。
  - 2025年11月、3万2500人へと見直します。
  - text: 工事のため、今季がいまのスタジアムで戦う最後のシーズンです。
    image: assets/backgrounds/stadium_ウニオンベルリン.png
  - 次の1シーズンは、ベルリンのオリンピアシュタディオンで戦います。
  - 2028年に、広くなったアルテ・フェルステライへ戻る予定です。
  sources:
  - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
  - https://en.wikipedia.org/wiki/Stadion_An_der_Alten_F%C3%B6rsterei
  bg: assets/backgrounds/stadium_ウニオンベルリン_in.png
  official: false
- id: rise
  heading: 3部リーグにいたウニオンは、どうやって欧州の舞台までたどり着いたのか
  tier: 背景
  telop: 2009年に3部で初代王者、2019年に初の1部。2023年にチャンピオンズリーグ初出場
  narrator: 解説
  say:
  - text: 2009年、新しくできた3部リーグで、ウニオンは初代の王者になります。
    image: assets/backgrounds/stadium_ウニオンベルリン_in.png
    card:
      type: table
      title: ウニオンの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 2009年
        - 3部リーグの初代王者
      - - 2019年
        - 初めてのブンデスリーガ
      - - 2021年
        - 7位。ヨーロッパへ
      - - 2022年
        - 5位。ヨーロッパリーグへ
      - - 2023年
        - 4位。チャンピオンズリーグへ
  - 翌2018年から2019年のシーズン、2部で入れ替え戦に勝ち、初めて1部へ。
  - 相手はシュツットガルトでした。
  - text: そこから、7位、5位、4位と順位を上げていきます。
    card: none
    image: assets/images/bd_unionberlin_gegen/scene.jpg
  - 2023年5月、最終節でブレーメンに1対0で勝って、4位でチャンピオンズリーグへ。
  - クラブ史上初めてのチャンピオンズリーグは、6試合で2引き分け。
  - それでも最終節にフライブルクに2対1で勝って、降格を免れました。
  sources:
  - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
  bg: assets/backgrounds/stadium_ウニオンベルリン_in.png
  official: false
- id: japan
  heading: 遠藤渓太と原口元気。ウニオンと日本は、どうつながってきたのか
  tier: 背景
  telop: 2020年に遠藤渓太、2021年に原口元気が加入。原口はリーグ戦41試合2得点
  narrator: 解説
  say:
  - text: ウニオンには、遠藤渓太と原口元気という日本人が在籍しました。
    image: assets/backgrounds/stadium_ウニオンベルリン_in.png
    card:
      type: table
      title: ウニオンと日本
      columns:
      - 年
      - 出来事
      rows:
      - - 2020年
        - 遠藤渓太が加入
      - - 2021年
        - 原口元気が加入
      - - 2023年
        - 原口が退団
  - 遠藤渓太は2020年、横浜F・マリノスから加わりました。
  - 1年目は、リーグ戦**16試合1得点**。
  - text: 原口元気は2021年から、2年間ウニオンでプレー。
    card: none
    image: assets/images/bd_unionberlin_pair_japan/01.jpg
  - リーグ戦で**41試合2得点**。
  - 在籍した2季は、5位と4位。順位が、そのままヨーロッパの舞台につながりました。
  sources:
  - https://en.wikipedia.org/wiki/Keita_End%C5%8D
  - https://en.wikipedia.org/wiki/Genki_Haraguchi
  bg: assets/backgrounds/stadium_ウニオンベルリン_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 愛称は「鉄の人たち」。クリスマスの合唱は89人から2万7500人へ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
