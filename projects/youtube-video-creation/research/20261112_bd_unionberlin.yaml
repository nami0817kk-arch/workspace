- id: season
  heading: 最後のシーズンを迎えるウニオンは、本拠地でどれだけ勝ち点を積めているのか
  tier: 報道
  telop: 11月11日時点で9試合1勝4分4敗。7得点21失点。16位
  narrator: 解説
