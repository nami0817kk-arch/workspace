      - アイゼルネン＝鉄の人たち
    - - クリスマス
      - 2003年89人→2013年2万7500人
  say:
  - text: 特徴の1つめは、愛称です。「アイゼルネン」は、ドイツ語で「鉄の人たち」。
    image: assets/images/bd_unionberlin_gegen/scene.jpg
  - 応援歌も、「アイゼルン・ウニオン」。鉄のウニオン、という意味です。
  - 2つめは、クリスマスの歌。2003年に、89人のファンが集まって始まりました。
  - 2013年には、**2万7500人**が集まりました。
  - ろうそくを掲げて、クリスマスの歌と応援歌を歌います。
  sources:
  - https://en.wikipedia.org/wiki/1._FC_Union_Berlin
  bg: assets/backgrounds/stadium_ウニオンベルリン_in.png
  official: false
