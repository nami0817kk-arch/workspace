# ユニフォームとエンブレムの歴史 インテル（11/12 作成、11/19 分）。ラ・リーガのあとの大物＝セリエA。雛形は 20261117_kit_realsociedad。
# 題の問い：インテルが黒と青のシャツを脱いだのはいつ、なぜか。答え＝1928年、ファシスト党政権がインテルナツィオナーレの名前と考え方を嫌い、ミラネーゼと合併させ「アンブロジアーナ」に。1928-29季だけ白に赤い十字（ミラノの旗）のシャツ。1929年に黒と青が戻る。1945年に元の名前へ。
# 選んだ理由：プレミアは全クラブ済み・ラ・リーガは主要5つ済み。次の大物でまだ無いのがセリエA。同じ日の担当（スタジアム=ビジャレアル、選手=ムシアラ(バイエルン)、国内レジェンド=中山）と重ならない。
# 重なり確認（2026-11-12）：scripts/*kit_* にインテル無し。research/*picks* にも無し。
# 取材：requests（Wikipedia API）のみ。読んだ：en "Inter Milan"（History・Colours and badge・Kit suppliers）、it "FC Internazionale Milano"（Storia・Stemma・Colori）。クラブ公式は読んでいない。
# ---- 食い違い・断ったこと ----
#   ・夜23:30の創立：en は「伝承では」。台本は「黒と青は夜空の色、といわれます」とだけ言う。ムッジャーニの規約の文は it の1資料のみ＝「とされます」。
#   ・紋章の「英国のクラブを手本」は it のみ→「とされます」。2021年3月30日の発表日は it のみ（en は年だけ）。金が外れ青が濃くなったも it のみ。
#   ・1979-1990 の盾に蛇：it。en の紋章史には無い（年の一覧のみ）。1990年にムッジャーニの文字が戻る、も it。
#   ・メーカー・胸の広告：en の表。列は 製造会社／胸／背／袖。プーマ1979-82、メクスポルト1982-86、ル・コック1986-88、ウールシュポルト1988-91、アンブロ1991-98、ナイキ1998-（現在）。胸：なし1979-81、イノヒット1981-82、ミズーラ1982-91、フィットガー1991-92、フィオルッチ1992-95、ピレリ1995-2021。表の1979年より前は読んでいない（「1979年から47年」と限った）。
#   ・名前の替わり：en/it。1908 Internazionale → 1928 S.S. Ambrosiana → 1929 A.S. Ambrosiana → 1931 A.S. Ambrosiana-Inter → 1945 Internazionale＝4回。
#   ・1930年の優勝：en「1930、第1回セリエAでアルパード・ヴァイスと」、it「1929-30、アンブロジアーナが最初の単一リーグを制した」。名前の時代（1929-31）に当たる。
# ---- 自分で数えた数 ----
#   黒と青：1908→2026＝118年。名前の替わり4回→118÷4＝29.5≒約30年。黒と青を脱いだ1シーズン＝1/118≒0.8%。メーカー：1979→2026＝47年で6社＝約7.8≒8年。ピレリ 1995→2021＝26年。ナイキ 1998→2026＝28年。
# ---- 日本との接点 ----
#   見つけられなかった。無理に入れない。
# 言わなかったもの：優勝回数・スタジアム・戦績／2021年以降の胸の広告主（en の表は列が読み取りにくい）。
