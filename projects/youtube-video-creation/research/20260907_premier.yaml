- id: turn
  heading: 分かれ目はどこか
  tier: 確定
  telop: 88分に勝ち越され、90+6分に追いついた
  say:
  - voice: キャスター
    text: はちじゅうさんぷん、ジョージの強烈な一撃で追いつきます。ところが、そのすぐあと。
  - voice: キャスター
    text: はちじゅうはちぷん、途中出場のシェシュコがヘディング。マンチェスター・ユナイテッドが勝ち越しました。
    telop: 88分、シェシュコのヘディングで勝ち越し
  - voice: キャスター
    text: そこから、きゅうじゅっぷんプラスろくふん。ベンチから出ていたメイトランド＝ナイルズが、遠い位置から振り抜きます。
    telop: 90+6分、遠目から振り抜いて同点
    card:
      type: points
      title: この一本が決まるまで
      items:
      - 移籍市場の締切日に加入したばかり
      - この試合が、エバートンでのデビュー戦
      - 途中出場で、90+6分に遠目から一撃
      - → 2-2。勝点1をもぎ取った
  - voice: キャスター
    text: この試合が、彼のエバートンでのデビュー戦でした。
  official: true
  sources:
  - https://www.espn.com/soccer/report/_/gameId/401879291
  - https://www.fotmob.com/matches/x/5795438
- id: numbers
  heading: 背景に何があったか
  tier: 報道
  telop: 締切日は不発。監督は「失望と付き合うしかない」
  say:
  - voice: キャスター
    text: エバートンにとって、難しい一週間の終わりでした。移籍市場の締切日に動けず、陣容は薄いまま。
  - voice: キャスター
    text: デイビッド・モイーズ監督は、こう話していました。
    card:
      type: quote
      source: David Moyes（ESPN）
      color: '#003399'
      text: to live with disappointments
      translation: 失望とともに生きていくしかない
  - voice: モイーズ監督
    text: 失望とは、付き合っていくしかない。選手たちには、力を合わせてほしい。
    telop: モイーズ「失望とは付き合っていくしかない」
  - voice: キャスター
    text: その締切日に加入した選手が、初戦の最後の最後で追いつきました。つぎに見るべきは、薄い陣容のまま戦う次節です。
  official: false
