  - text: ウェストハムは、前の年の黒字から、1億417万ポンドの赤字になりました。
    short_only: true
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 前の年は、5722万ポンドの黒字でした。
    card: *loss_table
  - text: 差は、1億6139万ポンドです。
    emph: true
    card: *loss_table
  - text: いちばん大きいのは、選手を売った利益。つまり、売却益です。
    card:
      <<: *loss_table
      highlight_row: 2
  - text: 9631万から、1995万ポンドへ。約7640万の減り。
    emph: true
    card:
      <<: *loss_table
      highlight_row: 2
  - text: 差の、約47%が、この1つです。
    image: assets/images/20261116_finance_westham/02_w.jpg
    card: none
  - text: 利息など、お金の出入りも、悪くなりました。
    card:
      <<: *loss_table
      highlight_row: 3
  - text: 差し引きの支払いは、833万から、1933万ポンドに。
    card:
      <<: *loss_table
      highlight_row: 3
  - text: 移籍金を分けて払う分の利息は、796万から1517万ポンド。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 約1.9倍です。
    emph: true
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 税の戻りは、約58万ポンド。最終の赤字は、1億359万ポンドです。
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
  - text: 株主の持ち分は、マイナス430万ポンドになりました。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 前の年から、約1億360万ポンドの減りです。
    emph: true
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
