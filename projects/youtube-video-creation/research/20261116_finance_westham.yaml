    highlight_row: 4
  say:
  - text: ウェストハムの最新の決算は、2025年5月までの1年分です。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 2026年2月に、提出されました。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: この年、リーグ戦は14位。前の年は9位でした。
    image: assets/images/20261116_finance_westham/02_w.jpg
    card: none
  - text: 1月には、ヘッドコーチがロペテギからグレアム・ポッターに替わりました。
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
  - text: 収入は、2億2755万ポンド。前の年から、約4219万の減りです。
    emph: true
    card: *rev_table
  - text: 減りのうち、約8割が放映権です。
    card:
      <<: *rev_table
      highlight_row: 0
  - text: 1億6700万から、1億3240万ポンドへ。約3460万の減り。
    emph: true
    card:
      <<: *rev_table
      highlight_row: 0
  - text: 決算が挙げる理由は、2つ。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 順位が下がったことと、前の年にあったヨーロッパの試合が無かったことです。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 入場料も、約530万減って3930万ポンド。
    card:
      <<: *rev_table
      highlight_row: 1
  - text: ヨーロッパリーグのホームの試合が、無かったためです。
    card:
      <<: *rev_table
      highlight_row: 1
  - text: 商業収入は4220万ポンド。約30万の増えで、ほぼ横ばいでした。
    card:
      <<: *rev_table
      highlight_row: 2
  - text: グッズは約250万減って、1370万ポンドです。
    card:
      <<: *rev_table
      highlight_row: 3
