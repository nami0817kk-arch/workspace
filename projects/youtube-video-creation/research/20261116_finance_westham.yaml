  say:
  - text: 見立てに入ります。まず、赤字までの差を、順に見ます。
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
  - text: いちばん大きいのは、売却益の減り。次が、収入の減りです。
    emph: true
    card: *view_wf
  - text: 収入と売却益の減りは、合わせて約1億1855万ポンド。
    card:
      type: waterfall
      title: ウェストハムの税引き前の損益の動き（百万ポンド）
      unit: 百万ポンド
      start: *vw_start
      steps: *vw_steps
      total: *vw_total
      highlight: 選手を売った利益
  - text: 赤字までの差の、約73%です。
    card:
      type: waterfall
      title: ウェストハムの税引き前の損益の動き（百万ポンド）
      unit: 百万ポンド
      start: *vw_start
      steps: *vw_steps
      total: *vw_total
      highlight: 選手を売った利益
  - text: 決算には、この先の資金の見通しも書かれています。
    image: assets/images/20261116_finance_westham/02_w.jpg
    card: none
  - text: 2025年7月、クラブは、長期の借り入れを結びました。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 額は1億2400万ポンド。返済は、2030年6月です。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 銀行から必要なときに借りられる枠も、4000万ポンドあります。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: それでも、基本の見通しでは、2026年の夏に、資金が足りなくなると書かれています。
    emph: true
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 足りない分は、選手の売却と、株主の資金で補う計画です。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 株主の一部は、必要な支援をする、という書簡に署名しています。
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
  - text: さらに、厳しいが起こりうる場合の想定に、降格が入っています。
    emph: true
    image: assets/images/20261116_finance_westham/02_w.jpg
    card: none
  - text: この決算が承認されたのは、2025年12月17日です。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
  - text: 2026年5月24日。14年続いた1部から、ウェストハムは降りました。
    emph: true
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 最終節はリーズに3対0で勝ちましたが、届きませんでした。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 題への答えです。赤字の主因は、売却益の減りと、放映権の減りでした。
    emph: true
    card:
      type: table
      title: 自分で割ってみた（ウェストハムの決算）
      columns: [比べ, 答え]
      rows:
      - [放映権の減り ÷ 収入の減り, 約82%]
      - [売却益の減り ÷ 赤字までの差, 約47%]
      - [収入の減り＋売却益の減り ÷ 差, 約73%]
      - [人件費 ÷ 収入, 約77%]
      highlight_row: 2
    mark:
      kind: circle
      row: 2
      col: 1
  - text: 次の決算の注目は、2部の収入で、この年の人件費の重さをどう支えるのか。
    emph: true
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
