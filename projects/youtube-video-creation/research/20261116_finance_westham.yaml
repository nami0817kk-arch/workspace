- id: cost
  heading: ウェストハムの給料と選手の値段は、なぜ増えたのか
  tier: 報道
  telop: 人件費は約1490万の増え。収入の約77%
  narrator: 解説
  card: &cost_table
    type: table
    title: ウェストハムの収入と費用（百万ポンド）
    columns: &ct_cols [項目, 2023-24, 2024-25]
    rows: &ct_rows
    - [収入の合計, '269.7', '227.6']
    - [人件費, '161.0', '175.9']
    - [選手の償却, '83.5', '99.4']
    - [選手の売買を除く営業損益, '52.7', −5.4]
    - [収入に占める人件費, 60%, 77%]
    highlight_row: 1
  say:
  - text: 出ていくお金を見ます。人件費は、1億6097万から、1億7589万ポンド。
    emph: true
    card: *cost_table
  - text: 約1490万の増えです。ウェストハムは、収入が減ったのに、人件費は増えました。
    card: *cost_table
  - text: 収入のうち人件費が占める割合は、約60%から約77%に。
    card:
      <<: *cost_table
      highlight_row: 4
  - text: 従業員の平均は1009人。前の年は881人。
    image: assets/images/20261116_finance_westham/02_w.jpg
    card: none
  - text: 2024年の夏には、6人の新戦力を迎えました。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: かかった金額は、合わせて1億3264万ポンドです。
    image: assets/images/20261116_finance_westham/04_w.jpg
    card: none
  - text: 買った選手の値段は、契約の年数に分けて、毎年の費用にします。これが償却です。
    image: assets/images/20261116_finance_westham/03_w.jpg
    card: none
  - text: 償却は、8343万から9941万ポンド。約1590万の増え。
    card:
      <<: *cost_table
      highlight_row: 2
  - text: 選手の売買を除いた営業損益は、5273万ポンドの黒字から、539万ポンドの赤字に。
    emph: true
    card:
      <<: *cost_table
      highlight_row: 3
  - text: 売却の利益を除くと、本業は黒字を保てませんでした。
    image: assets/images/20261116_finance_westham/01_w.jpg
    card: none
