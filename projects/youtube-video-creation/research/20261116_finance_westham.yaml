  heading: 収入は、なぜ4219万ポンド減ったのか
  tier: 報道
  telop: 収入は2億2755万ポンド。放映権が約3460万の減り
  narrator: 解説
  card: &rev_table
    type: table
    title: ウェストハムの収入（百万ポンド）
    columns: &rv_cols [項目, 2023-24, 2024-25]
    rows: &rv_rows
    - [放映権, '167.0', '132.4']
    - [入場料, '44.6', '39.3']
