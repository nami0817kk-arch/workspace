# クラブの財政：ウェストハム（11/16 月、シリーズ「クラブの財政」、key: finance_westham、型は news）。
#
# 題材の選び方：11/12 ブレントフォード・11/14 リーズの次。デロイト Football Money League の順で、財政の回をまだ出していない収益の大きいクラブを探した。
#   既出（scripts/*finance_*）：バルサ・シティ・アーセナル・レアル・PSG・バイエルン・リヴァプール・マンU・トッテナム・チェルシー・インテル・ヴィラ・ユヴェントス・アトレティコ・ミラン・ニューカッスル・ドルトムント・ナポリ・シュトゥットガルト・ベンフィカ・フランクフルト・ローマ・アヤックス・ブライトン・パレス・ボーンマス・ブレントフォード・リーズ。
#   未出の大きいクラブのうち、一次の決算が Companies House で読め、収入が最大（2億2755万ポンド）なのがウェストハム。エヴァートンは女子チーム絡みで外した前例（11/12）。
#   同日 11/18 の担当（セルティック）とクラブが別。
#
# ★今季の立場（重要）：ウェストハムは 2025-26 に降格した。ESPN の 2026-27 English Premier League 順位表 API（2026-11-12 取得）に載っていない。
#   プレミアリーグ公式 premierleague.com「West Ham relegated despite win over Leeds on final day」（2026-05-24、勝点39、14年続いた1部から）で確認。
#   → 台本は「決算の1年（2024-25、2025年5月まで）」と、決算書に書かれた見通し（降格を入れた想定）、その後に降格した事実（2026-05-24）だけ。いまの2部の順位・成績は言わない（確かめていない）。
# ★日本との接点：決算・今季の所属に日本人選手は確かめられない。無理に入れない（10/6 の決定）。
#
# 軸は「**14位だった年に、赤字1億417万ポンド（前の年は黒字5722万）。差の約半分は『選手を売った利益』が7640万減ったこと。決算はすでに、夏の資金不足と、降格の想定を書いていた**」。
#   ★他の財政回と軸を重ねない：11/12 ブレントフォード＝給料の重さ、11/10 ボーンマス＝売却益が黒字に変えた、11/8 パレス＝勝つと費用が増える、11/6 ブライトン＝売る利益が減る。
#     今回は「収入の減り（14位・欧州なし）」と「売却益が消えた年の赤字」と「決算に書かれた降格の想定」。ブライトンと同じ「売る利益が減る」だが、ここでは赤字の差の中身を1つずつ数える。
#   ★オーナー・株主の個人名は言わない（決算の記載は「shareholders」「investing owners」の範囲）。報道の買収の話は入れない（確かめていない）。
#   ★決算のあとの2025-26 の数字は出ていない。台本は決算の1年と、決算書の見通しと、降格の事実だけ。
#
# **出どころ（読んだもの）**
#   ○ WH Holding Limited（会社番号 05993863、ウェストハム・ユナイテッドの親会社）Annual Report and Financial Statements for the year ended 31 May 2025（Companies House、2026-02-27 提出、60頁、監査 PwC、画像PDF。頁を画像にして目で読んだ。承認は 2025-12-17）
#       https://find-and-update.company-information.service.gov.uk/company/05993863/filing-history/MzUwNzUwNjY1NmFkaXF6a2N4/document?format=pdf&download=0
#       Strategic Report p.4：「Turnover at £227.6m was down £42.1m on the previous year, largely due to the lower position in the Premier league (14th v 9th) and no European income, as we participated in the UEFA Europa League in the previous season.」（損益計算書は 227,552／269,740。差は 42.188 なので台本は約4219万）
#            「the Club ... provide funds to significantly enhance the squad during the 2024-25 summer transfer window with six new additions to the squad at a total cost of £132.6m (see note 11), alongside three outgoings」
#            「the season was ultimately disappointing as adverse results led to the appointment of Graham Potter as new Head Coach, replacing Julen Lopetegui in January」「The 14th place at season end was below expectations」
#            「The consolidated balance sheet ... total shareholders' funds have decreased from 31 May 2024 by £103.6m, creating a total shareholders deficit of £4.3m」
#       p.5：「Broadcasting revenue of £132.4m (2024: £167.0m) ... positional fee awarded for finishing 14th ... facility fees for having been selected for eighteen 'live' Premier League matches」「Match income at £39.3m is £5.3m lower」「Commercial income, at £42.2m, is higher than last year by £0.3m」「Retail income at £13.7m is down £2.5m」
#            「The primary reason for the change from a profit before taxation of £57.2m in 2023-2024 to the net loss before tax for the year of £104.2m is lower profit on sales of players of £20.0m compared to the previous financial year of £96.3m.」
#            「The Club renewed its £40.0m overdraft facility with Barclays ... through 15th July 2026. In addition ... On 28th July 2025, the Club entered a new long-term facility with Rights and Media Funding Limited (RMF)」
#       p.8 Going Concern：「base forecast ... assuming the club remains in the Premier League following the 2025-26 season」「new long-term financing facility with RMF for £124.0m which does not expire within the going concern period and is repayable in June 2030」
#            「the Group is forecasting a liquidity shortfall in Summer 2026」「The Board has also considered a severe but plausible scenario. This scenario includes relegation at the end of the 2025-26 season ... Relegation is the main business risk that warrants scenario analysis.」
#            「Player sales ... Shareholder funding: ... certain of the investing owners have committed jointly, by signing a letter of support, to provide ... sufficient level of financial support」
#       p.13 KPI：League position 14th／9th。Average league gate 62,432／62,463。（Wage:turnover ratio 67.2%／59.7% は定義が年で違う〔2025は賃金と給与のみ＝152,926÷227,552、2024は人件費合計＝160,969÷269,740〕ので台本に使わない）
#       p.28 損益計算書（£000、2025／2024）：Group turnover 227,552／269,740、Other operating income 3,896／6,929、Operating costs (336,244)／(307,433)〔うち選手の償却 99,408／83,489〕、
#            Group operating loss (104,796)／(30,764)、Profit on disposal of players 19,954／96,313、Interest receivable 2,667／5,013、Interest payable (21,993)／(13,341)、
#            Loss before taxation (104,168)／profit 57,221、Tax 581（credit）／–、Loss after taxation (103,587)／57,221。選手の売買を除く営業（Operations excluding player trading）(5,388)／52,725
#       p.43 注5：Employment costs 175,893／160,969、Amortisation of intangible fixed assets 99,408／83,489。注6：Wages and salaries 152,926／140,747、Social security 22,638／19,917、Pension 329／305、計 175,893／160,969。平均従業員 1,009／881（うちパート 529／498）
#       p.45 注7：Profit on sale of players 19,954／96,313。注9 Interest payable：secured loans 323／1,459、bank overdraft 2,403／1,513、Other finance costs 4,093／2,407、Implied interest on transfer fees payable with extended payment terms 15,174／7,962
#       p.46 注11 Intangible Assets：Player registrations 取得 Additions 132,644、Disposals（取得原価）(62,190)、Charge for the year 99,408、Net book value 223,152／213,949
#   ○ プレミアリーグ公式 premierleague.com（2026-05-24）：降格の確認。ESPN 順位表 API（2026-11-12）：2026-27 の1部の表にウェストハムは無い
#   × 確かめられなかったもの：6人の補強の名前と額（決算に無い）、売った3人の名前と額（決算に無い）、降格後の2部での順位、2025-26 の決算（まだ出ていない）、降格後にオーナー・株主の資金がどう動いたか。どれも台本に入れない。
#
# 自分で計算した数（検算済み）
#   収入の減り：269.740−227.552＝42.188→約4219万（15.6%）。放映権の減り 167.0−132.4＝34.6→約3460万。÷収入の減り 34.6÷42.188＝82.0%→約8割
#   前の年の内訳（本文の増減から）：入場料 39.3＋5.3＝44.6／商業 42.2−0.3＝41.9／グッズ 13.7＋2.5＝16.2。167.0＋44.6＋41.9＋16.2＝269.7 ✓
#   人件費：175.893−160.969＝14.924→約1490万（9.3%）。÷収入：175.893÷227.552＝77.3%→約77%／160.969÷269.740＝59.7%→約60%
#   償却：99.408−83.489＝15.919→約1590万。補強の取得：132.644→約1億3264万
#   選手の売買を除く営業損益：52.725→−5.388（差 58.113）
#   差：57.221−(−104.168)＝161.389→約1億6139万。選手を売った利益の減り 96.313−19.954＝76.359→約7640万。÷差 76.359÷161.389＝47.3%→約47%
#   収入の減り＋売却益の減り＝42.188＋76.359＝118.547→÷差 73.5%→約73%
#   利息など（受取−支払）：2025 2.667−21.993＝−19.326／2024 5.013−13.341＝−8.328。差 10.998→約1100万
#   分割払いの移籍金の利息：15.174÷7.962＝1.906→約1.9倍
#   税引き前：52.725−83.489+96.313−8.328＝57.221 ✓／−5.388−99.408+19.954−19.326＝−104.168 ✓
#   waterfall：57.221−42.188−76.359−15.919−15.925（その他の収入の減り3.033＋運営の費用の増え12.892）−10.998＝−104.168 ✓
#   最終の赤字：103.587→約1億359万。税の戻り 0.581→約58万
#
