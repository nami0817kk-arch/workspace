  - id: clasico
    heading: 「また勝たせる」の前に、何があったのか
    tier: 確定
    telop: 前日のクラシコはバルサ 1-2 レアル・マドリード
    say:
      - text: 授賞式の前の日曜は、カンプ・ノウでのクラシコでした。
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - text: バルサはホームでレアル・マドリードに敗れ、スコアは1対2。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - text: ヤマルは前半に同点の好機を迎えましたが、うまく当てられませんでした。
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - text: 決勝点は、残り3分ほどでエムバペが決めました。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - text: クラブの会長も、授賞式のあとに話しています。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - voice: ラポルタ会長
        text: 彼はいずれ、バロンドールを受賞すると確信している。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - voice: ラポルタ会長
        text: これが、彼のモチベーションになることを願う。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - text: スペイン代表のデ・ラ・フエンテ監督は、こう言いました。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - voice: デ・ラ・フエンテ監督
        text: 彼はバロンドールを、何度も取るだろう。
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - voice: デ・ラ・フエンテ監督
        text: でも大事なのは、チームのタイトルをもっと取ることだ。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - voice: デ・ラ・フエンテ監督
        text: 彼がそちらを大切にしているのを、私は知っている。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
    official: true
    sources:
      - https://www.fcbarcelona.com/en/football/first-team/news/4598638/fc-barcelona-1-2-real-madrid-heartbreaking-defeat
      - https://web.gekisaka.jp/news/world/detail/?461922-461922-fl
      - https://www.espn.com/soccer/story/_/id/50301141/yamal-excited-ballon-dor-miss

  - id: view
    viewpoint: true
    heading: 負けと3位の2日間で、何が残ったのか
    tier: 背景
    telop: 日曜に負け、月曜に3位。それでも首位は変わらない
    say:
      - text: ここからは見立てです。
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - text: 日曜にクラシコで負け、月曜には投票で3位。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - text: ヤマルにとっては、思うようにいかない2日間でした。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - text: それでも、バルサはいまも首位です。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - text: 2位のアトレティコとは勝ち点2差、3位のレアルとは3差。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - text: 本人も、会長も、代表の監督も、言葉は同じ向きでした。
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - text: 個人の賞は、いずれ来る。いまは、チームを勝たせる。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - text: その最初の試合は、土曜にホームで迎えるアラベス戦です。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
