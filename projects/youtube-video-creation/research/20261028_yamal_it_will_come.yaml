sections:
  - id: what
    main: true
    heading: 3位の翌日、ヤマルが書いたこと
    tier: 報道
    telop: ヤマル「必ず来る。いいことには時間がかかる」
    say:
      - text: バロンドールの発表の翌日、火曜の夜。ヤマルが自分のソーシャルメディアに書きました。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - voice: ヤマル
        text: 必ず来る。いいことには、時間がかかる。
        short_voice: true
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - voice: ヤマル
        text: 自分が築いている道を、信じている。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - voice: ヤマル
        text: 焦りはない。あるのは、わくわくする気持ちと、
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - voice: ヤマル
        text: いつか自分の番が来る、という落ち着いた確信だけ。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
      - text: 19歳のヤマルは、投票で3位でした。
        image: assets/images/20261028_yamal_it_will_come/02_w.jpg
      - voice: ヤマル
        text: 受賞したみなさん、おめでとう。
        image: assets/images/20261028_yamal_it_will_come/01_w.jpg
      - voice: ヤマル
        text: いまは、バルセロナをまた勝たせることに集中する。
        cont: true
        image: assets/images/20261028_yamal_it_will_come/03_w.jpg
