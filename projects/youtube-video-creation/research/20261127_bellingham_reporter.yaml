      - text: 24日のピーエスブイ戦のあと、取材の場で、レアル・マドリードのベリンガムが言ったひと言です。
      - voice: ベリンガム
        text: ごめん、彼女の質問がもう1つあるんだ。
        emph: true
      - text: 質問していたのは、エリザベス・コンウェイさん。
        image: assets/images/20261127_bellingham_reporter/02_w.jpg
      - text: イギリスの公共放送、ビービーシーで、レアル・マドリードを担当する記者です。
      - text: 2つ目の質問の途中で、男性の記者が声をかぶせてきました。
      - text: ベリンガムはそれを止めて、コンウェイさんの質問に答えました。
        image: assets/images/20261127_bellingham_reporter/01_w.jpg
    official: false
