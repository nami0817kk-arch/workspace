  - id: reporter
    heading: 割り込まれた記者は、何を語ったのか
    tier: 報道
    telop: 記者「私を記者として尊重してくれた」
    say:
      - text: 場所はミックスゾーン。試合のあと、選手が通る通路の柵の前で、記者が待ち構える場所です。
        image: assets/images/20261127_bellingham_reporter/02_w.jpg
      - text: コンウェイさんは、ベリンガムについて、ビービーシーのラジオでこう話しています。
        image: assets/images/20261127_bellingham_reporter/01_w.jpg
      - voice: エリザベス・コンウェイ
        text: まさに大混乱です。ひじも、マイクも、カメラもある。
      - voice: エリザベス・コンウェイ
        text: 背の高い男性たちが、上から手を伸ばしてくる。
        image: assets/images/20261127_bellingham_reporter/02_w.jpg
        cont: true
      - voice: エリザベス・コンウェイ
        text: 女性の記者も、イギリスの記者も、ほんのわずかしかいません。
        image: assets/images/20261127_bellingham_reporter/01_w.jpg
      - voice: エリザベス・コンウェイ
        text: 彼はまた、礼儀正しかった。
        image: assets/images/20261127_bellingham_reporter/02_w.jpg
      - voice: エリザベス・コンウェイ
        text: 私を記者として、本当に尊重してくれました。
        image: assets/images/20261127_bellingham_reporter/01_w.jpg
        cont: true
