# プレミアリーグ20クラブ紹介 ⑲サンダーランド（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「6回優勝したクラブが3部まで落ち、その姿がドラマになった」**。
# ここが山場（@main）。そこから昨季7位でヨーロッパへ
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では19番目」の1行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替え（説明は後ろへ）。
# ③優勝の節は「数えると8個」と獲っていないものの列挙（リーグカップ0回・欧州0回）をやめ、
#   獲った2つと、その直近（1936年・1973年）だけを置いた。card の「0回」の行も削除
