sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 学校の先生たちが作ったクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年"]
        - ["最初の名前", "Sunderland and District Teachers A.F.C."]
        - ["愛称", "The Black Cats（2000年から正式に）"]
        - ["本拠地", "スタジアム・オブ・ライト／48,095人"]
    say:
      - このクラブを作ったのは**学校の先生たち**でした。創設は1879年です。
      - 最初の名前も、そのまま「サンダーランド地区教員クラブ」です。
      - 愛称は「ブラック・キャッツ」。**黒猫**です。正式に決まったのは2000年でした。
      - ほかに「マッケムズ」「ウェアサイダーズ」とも呼ばれます。
      - 本拠地はスタジアム・オブ・ライト。収容は**4万8095人**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: fall
    heading: 6回優勝したクラブが、3部へ
    main: true
    tier: 背景
    telop: 6回優勝したクラブが、2018年には3部にいた
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "6回（1892・1893・1895・1902・1913・1936）"]
        - ["1973年", "2部のクラブとしてFAカップ優勝。翌季は欧州へ"]
        - ["2018年", "3部へ。2年続けての降格"]
        - ["2022年", "2部へ昇格"]
        - ["2025年5月24日", "プレーオフ決勝でシェフィールド・Uに2-1"]
        - ["3部から1部まで", "7年"]
        - ["2025-26年", "7位。53年ぶりのヨーロッパ（ヨーロッパリーグ）"]
    say:
      # 2026-09-22 流れの点検。栄光 → 転落 → 復帰 の一方向にした。「6回」は冒頭と基礎DATAで
      # 読んでいる。年号6つはカードに任せる。1973年のFAカップが翌季の欧州行きだったこと、
      # 2022年の2部昇格、今季の大会名（ヨーロッパリーグ）を足した。
      # 配信元の社名は出さない（媒体名を出さない決まり）
      - 1部の優勝は、3回が1890年代で、最後は1936年です。
      - "1973年には、**2部**のクラブとしてFAカップを獲りました。翌シーズンはヨーロッパにも出ています。"
      - そのクラブが、2018年には**3部**にいました。2年続けて落ちた結果です。
      - この時期を追った配信番組が、『**サンダーランド・ティル・アイ・ダイ**』です。
      - "2022年に2部へ戻り、2025年5月24日、プレーオフ決勝でシェフィールド・ユナイテッドを2対1で下します。"
      - "**3部から1部まで、7年**でした。"
      - そして昨季は、25年ぶりに、プレミアでの最高位に並びます。
      - "1973年以来、**53年ぶり**のヨーロッパ。今季はヨーロッパリーグに出ます。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ニューカッスルとの、タイン・ウィア・ダービー
    narrator: 解説
    card:
      type: table
      title: タイン・ウィア・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1888年11月10日／FAカップ予選・2-0"]
        - ["1908年12月5日", "9-1。ダービー史上の最大差"]
        - ["2013〜2015年", "6連勝"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "相手は**ニューカッスル・ユナイテッド**。**タイン・ウィア・ダービー**です。"
      - 競技会で最初に当たったのは1888年11月10日、FAカップの予選でした。相手がまだ「イースト・エンド」だった頃で、**2対0**で勝っています。
      - "1908年12月5日には**9対1**。このダービーで最も点差のついた試合です。"
      - 2013年から2015年にかけては、**6連勝**しました。
      - "ニューカッスルは、**今季もプレミアリーグにいます。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tyne%E2%80%93Wear_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: モンゴメリー、ハーリー、ガーニー
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["ジミー・モンゴメリー", "627試合（クラブ最多出場）"]
        - ["チャーリー・ハーリー", "402試合23得点"]
        - ["ボビー・ガーニー", "公式戦228得点（クラブ最多）"]
    say:
      - 名前を挙げるなら、この3人です。
      - "ジミー・モンゴメリー。1960年から1977年まで、**627試合**。クラブ最多出場です。"
      - "さきほどの決勝で見せた**ダブルセーブ**が、いまも語られています。"
      - チャーリー・ハーリー。1957年から1969年、402試合23得点。
      - "1979年、クラブの100周年に行われた投票で、サポーターが「**100年で最高の選手**」に選びました。"
      - "ボビー・ガーニー。1925年から1950年。**228得点**はクラブ最多です。"
      - 1937年のFAカップ決勝、プレストン・ノースエンドに3対1で勝った試合でも点を取っています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Jimmy_Montgomery
      - https://en.wikipedia.org/wiki/Charlie_Hurley
      - https://en.wikipedia.org/wiki/Bobby_Gurney
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 得点が1人に集まらないチーム
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "レジス・ル・ブリス"]
        - ["主将", "グラニト・ジャカ（MF・スイス）"]
        - ["エース", "ブライアン・ブロッベイ（FW・オランダ）"]
        - ["昨季", "7点。突出した点取り屋はいない"]
        - ["今季", "4人が1点ずつ"]
    say:
      - このクラブは、**得点が1人に集まりません。**
      - 昨季のチーム最多も7点で、今季は4人が1点ずつ。
      - 前線はブライアン・ブロッベイ。オランダ人のセンターフォワードです。
      - 主将はグラニト・ジャカ。スイス代表を長く引っ張ってきた中盤です。
      - "**誰が取るか分からない**、というのがこのクラブの見どころです。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝6回。直近は1935年から36年
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "6回（直近 1935-36）"]
        - ["FAカップ", "2回（直近 1972-73）"]
    say:
      - "1部優勝は**6回**。**直近は1935年から36年**です。"
      - "FAカップは**2回**。新しいほうが、さきほどの1972年から73年でした。"
      - 3部から戻ってきたクラブが、その続きを取りにいきます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
