sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 学校の先生たちが作ったクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年"]
        - ["最初の名前", "Sunderland and District Teachers A.F.C."]
        - ["愛称", "The Black Cats（2000年から正式に）"]
        - ["本拠地", "スタジアム・オブ・ライト／48,095人"]
    say:
      - アルファベット順では、19番目に来ます。
      - 創設は1879年。作ったのは**学校の先生たち**でした。
      - 最初の名前も、そのまま「サンダーランド地区教員クラブ」です。
      - 愛称は「ブラック・キャッツ」。**黒猫**です。正式に決まったのは2000年でした。
      - ほかに「マッケムズ」「ウェアサイダーズ」とも呼ばれます。
      - 本拠地はスタジアム・オブ・ライト。収容は**4万8095人**です。
      - 監督はレジス・ル・ブリス。今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.

  - id: fall
    heading: 6回優勝したクラブが、3部へ
    main: true
    tier: 背景
    telop: 2018年。その姿はドラマになった
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "6回（1892・1893・1895・1902・1913・1936）"]
        - ["2018年", "3部へ。2年続けての降格"]
        - ["2025年5月24日", "プレーオフ決勝でシェフィールド・Uに2-1"]
        - ["2025-26年", "7位。53年ぶりのヨーロッパ"]
    say:
      - このクラブは、1部で**6回**優勝しています。
      - 1892年、93年、95年、1902年、1913年、そして1936年。
      - 19世紀の終わりには、イングランドで最も強いクラブのひとつでした。
      - そのクラブが、2018年には**3部**にいました。2年続けて落ちた結果です。
      - この時期のクラブを追った記録は、ネットフリックスの『**サンダーランド・ティル・アイ・ダイ**』になっています。
      - 戻ってきたのは2025年5月24日。プレーオフ決勝でシェフィールド・ユナイテッドに2対1でした。
      - そして昨季、2025年から26年はリーグ**7位**。
      - "**53年ぶり**に、ヨーロッパの舞台に出る権利を取っています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.

  - id: cup
    heading: 1973年の決勝
    tier: 背景
    telop: 2部のクラブが、FAカップを獲った
    narrator: キャスター
    say:
      - このクラブのFAカップには、語り継がれる1回があります。
      - 1973年。そのときサンダーランドは**2部**のクラブでした。
      - 決勝を勝ったのですが、立役者はゴールキーパーのジミー・モンゴメリーです。
      - 決勝点を決めたのはイアン・ポーターフィールド。
      - "**格下が勝った決勝**として、いまも残っています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.

  - id: now
    heading: 戻ってきた場所
    tier: 背景
    telop: 3部から1部まで、7年
    narrator: 解説
    say:
      - 3部にいたのが2018年、1部に戻ったのが2025年です。
      - "**7年**かかりました。"
      - そして戻った次のシーズンに、ヨーロッパの権利まで取っています。
      - 落ちるときも早く、上がるときも早いクラブでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
