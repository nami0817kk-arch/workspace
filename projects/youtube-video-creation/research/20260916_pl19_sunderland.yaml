sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 学校の先生たちが作ったクラブ
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年"]
        - ["最初の名前", "Sunderland and District Teachers A.F.C."]
        - ["愛称", "The Black Cats（2000年から正式に）"]
        - ["本拠地", "スタジアム・オブ・ライト／48,095人"]
    say:
      - このクラブを作ったのは**学校の先生たち**でした。創設は1879年です。
      - 最初の名前も、そのまま「サンダーランド地区教員クラブ」です。
      - 愛称は「ブラック・キャッツ」。**黒猫**です。正式に決まったのは2000年でした。
      - ほかに「マッケムズ」「ウェアサイダーズ」とも呼ばれます。
      - 本拠地はスタジアム・オブ・ライト。収容は**4万8095人**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: fall
    heading: 6回優勝したクラブが、3部へ
    main: true
    tier: 背景
    telop: 6回優勝したクラブが、2018年には3部にいた
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "6回（1892・1893・1895・1902・1913・1936）"]
        - ["2018年", "3部へ。2年続けての降格"]
        - ["2025年5月24日", "プレーオフ決勝でシェフィールド・Uに2-1"]
        - ["2025-26年", "7位。53年ぶりのヨーロッパ"]
    say:
      - 1部で**6回**優勝したクラブが、2018年には**3部**にいました。
      - 2年続けて落ちた結果です。
      - この時期のクラブを追った記録は、ネットフリックスの『**サンダーランド・ティル・アイ・ダイ**』になっています。
      - 6回の優勝は、1892年、93年、95年、1902年、1913年、そして1936年。
      - 19世紀の終わりには、イングランドで最も強いクラブのひとつでした。
      - 戻ってきたのは2025年5月24日。プレーオフ決勝でシェフィールド・ユナイテッドに2対1でした。
      - そして昨季、2025年から26年はリーグ**7位**。
      - "**53年ぶり**に、ヨーロッパの舞台に出る権利を取っています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: cup
    heading: 1973年の決勝
    tier: 背景
    telop: 2部のクラブが、FAカップを獲った
    narrator: キャスター
    say:
      - 1973年、**2部**のクラブだったサンダーランドが、FAカップの決勝を勝ちました。
      - 立役者はゴールキーパーのジミー・モンゴメリーです。
      - 決勝点を決めたのはイアン・ポーターフィールド。
      - "**格下が勝った決勝**として、いまも残っています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: now
    heading: 戻ってきた場所
    tier: 背景
    telop: 3部から1部まで、7年
    narrator: 解説
    say:
      - 3部から1部まで、**7年**でした。
      - 3部にいたのが2018年、戻ったのが2025年です。
      - そして戻った次のシーズンに、ヨーロッパの権利まで取っています。
      - 落ちるときも早く、上がるときも早いクラブでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 得点が1人に集まらないチーム
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "レジス・ル・ブリス"]
        - ["主将", "グラニト・ジャカ（MF・スイス）"]
        - ["エース", "ブライアン・ブロッベイ（FW・オランダ）"]
        - ["昨季", "7点。突出した点取り屋はいない"]
        - ["今季", "4人が1点ずつ"]
    say:
      - このクラブは、**得点が1人に集まりません。**
      - 昨季のチーム最多も7点で、今季は4人が1点ずつ。
      - 前線はブライアン・ブロッベイ。オランダ人のセンターフォワードです。
      - 主将はグラニト・ジャカ。スイス代表を長く引っ張ってきた中盤です。
      - "**誰が取るか分からない**、というのがこのクラブの見どころです。"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝6回。直近は1935年から36年
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "6回（直近 1935-36）"]
        - ["FAカップ", "2回（直近 1972-73）"]
    say:
      - "1部優勝は**6回**。**直近は1935年から36年**です。"
      - "FAカップは**2回**。新しいほうが、さきほどの1972年から73年でした。"
      - 3部から戻ってきたクラブが、その続きを取りにいきます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
