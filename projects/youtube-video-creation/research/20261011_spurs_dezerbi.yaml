  question: 10人になって引き分けた夜、デ・ゼルビはベンタンクールをどう扱ったのか
  takeaway: 10月10日のオールド・トラフォード、トッテナムは1対1で引き分けた。66分に途中出場したベンタンクールが、78分にルーク・ショーへの頭突きで一発退場になる。10人になったトッテナムは後半アディショナルタイム2分、キャプテンのソランケがトナーリのクロスをヘディングで決めて追いついた。試合後、デ・ゼルビは「ロドリゴのレッドカードの場面は好ましく思った。レッドカードを出せという意味ではない。負けを受け入れない、失点を受け入れない、ということだ」「悪い形だ、正しい形ではない。それでも私はロッカールームでベンタンクールにキスをした。気持ちのこもったこの種の反応が、我々には要るから」「サッカーとは気持ちだ」と語った。さらに「今日、我々は今季はじめて、自分たちがチームであることを示した」とも言っている。トッテナムは6試合で1勝もできておらず、勝ち点3はすべて引き分けから。6試合で3得点しかなく、ソランケのこの1点はそのうちの1つだった。順位は18位で、次は10月19日にホームで19位のコヴェントリーと当たる。ベンタンクールの出場停止の長さはまだ出ていない
