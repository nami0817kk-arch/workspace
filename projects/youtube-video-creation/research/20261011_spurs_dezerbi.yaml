# 取材メモ（10/11 題材 spurs_dezerbi、型は news、プレミア枠）。材料の控えは research/raw/20261011_spurs_dezerbi_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場 words の節を切り出す）。
# **主語はトッテナム側だけ。**10/10 にマンチェスター・ユナイテッド側を3本出している（キャリック／マンUの1週間／
#   ユニフォームの歴史）ので、**マンUの順位・勝ち点・調子・監督・補強には一切触れていない**。
#   相手側は「先制された」「ルーク・ショーに頭突きをした」の2点だけに留めた（材料 5）。
# **「ありがとうと言った」は入れていない**（材料 2）。これは kicker の見出しの形だが、
#   **kicker は読めなかった**（requests は403「Please enable JS」、WebFetch も403）。
#   ESPN が引いた形には「ありがとう」が無く、「ロッカールームでキスをした」までは一致している。
#   **2つの媒体の文言を混ぜない**という決まりのとおり、読めたほう（ESPN）1つに決めた。
# **出場停止の長さは書かない**（材料 4）。どの媒体にも出ていない。「3試合」などの数字を置かない。
# 試合の分は ESPN の試合データ feed から取った（66分出場・73分に失点・78分に退場・90+2分にソランケ）。
# 数字の重なり対策：『66分』『78分』『12分』は①だけ。『90分＋2』は①だけ。
#   『6試合』『1勝』『3得点』『勝ち点3』『18位』『19位』は③だけ。
# **読み上げにアルファベットを残さない**。
# **山場に板を入れた**（10/10 に5本で踏んだ「ショートが50秒ずっと同じ写真」への手当て）。
#   ②は表を行ごとに分けて highlight_row を 0→1→2 と動かし、
#   **いちばん強い1行（「ロッカールームでキスをした」）だけ card: none にして顔だけ**にした。
#   板を下ろす行には必ず `card: none` を書いた（消すだけでは前の板が引き継がれる）。
#   顔が上にある写真（デ・ゼルビとベンタンクールを横に並べた 1920x1080。縦版 01_v もある）を使う。
# 写真は代理店のものを入れていない（材料 6）。**ESPN の og:image は取り込んでいない**（ほぼ Getty のため）。
#   デ・ゼルビは2019年、ベンタンクールは2017年で所属が違うが、Commons の 2026年の写真21枚は
#   **全部スタジアム全景で顔が無い**ことを目で確かめたうえで、「他に無ければそのまま使ってよい」に乗せた。
#   **入れ替えは1回**（②の山場の頭で、横に並べた1枚 → **縦に積んだ1枚**（01_v）へ。以後そのまま）。
#   デ・ゼルビ単体に差し替える案は取り下げた。元が 1366x768 しか無く、**ショートの縦版が 2.5倍**になるため。
# ネットの反応は集めていない（この日の方針）。
