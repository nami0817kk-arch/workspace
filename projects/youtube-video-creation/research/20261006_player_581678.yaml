  say:
  - text: ジュード・ベリンガム。4番と8番と10番を、ひとりで兼ねる男です。
    image: assets/images/20261006_player_581678/real2026/01_w.jpg
    card: none
  - text: 最初のクラブ、バーミンガムで背負ったのは22番。
    image: assets/images/20261006_player_581678/birmingham/01.jpg
  - text: 守る4番、走る8番、点を取る10番。足すと22、という意味でした。
    emph: true
    card: &n22
      type: table
      title: 背番号22の足し算
      columns: [番号, 役目]
      rows:
      - ['4', '守る']
      - ['8', '走る']
      - ['10', '点を取る']
      - ['22', '3つを足した数']
      source: バーミンガムのアカデミー責任者（talkSPORT）
      highlight_row: 3
  - text: 在籍はわずか1季。それでもクラブは、その22番を永久欠番にします。
    card:
      <<: *n22
      highlight_row: 3
  - text: レアルで背番号5を受け取った日、本人はこう語っています。
    image: assets/images/20261006_player_581678/real2026/01_w.jpg
    card: none
  - voice: ジュード・ベリンガム
    text: 22番は自分にとって大きな意味がある。
  - voice: ジュード・ベリンガム
    text: 背番号5をつけていても、心の中ではまだ22番だ
    cont: true
    pause: 0.5
  - その万能さが、いまイングランド代表の10番で花開いています。
  - どこから来て、どこまで来たのか。表と言葉でたどります。
