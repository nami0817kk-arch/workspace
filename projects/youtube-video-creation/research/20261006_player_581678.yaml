- id: story
  heading: 父の偽物のユニホームと、母のひと言
  tier: 報道
  telop: 700点の父、ジダンのシャツ、付いてきた母
  narrator: 解説
  card:
    type: table
    title: ベリンガムを育てた家族
    columns: [誰・何, 話]
    rows:
    - [父マーク, 下部リーグで700点以上の点取り屋]
    - [父のシャツ, ビーチで買ったジダンの偽物]
    - [母デニス, ドイツにもマドリードにも同居]
    source: 英FA公式・Goal・theWORLD
  say:
  - text: ピッチの外のベリンガムを形づくったのは、家族です。
    image: assets/images/20261006_player_581678/ghana61/01.jpg
  - text: 父マークは、ノンリーグと呼ばれる下部リーグで700点以上を決めた点取り屋。
    image: assets/images/20261006_player_581678/ghana127/01_w.jpg
  - 少年ジュードは、その試合を毎週のように見に通っていました。
  - voice: ジュード・ベリンガム
    text: サッカーのヒーローの話をすると、
  - voice: ジュード・ベリンガム
    text: 僕にとって最初のヒーローは父だった
    cont: true
    pause: 0.5
  - text: ジダンを知ったのも、父が浜辺で買った偽物のシャツから。
    image: assets/images/20261006_player_581678/laureus/01_w.jpg
    card: none
  - 父はそれを、どこへでも着ていったそうです。
  - text: いまレアルで背負う5番は、そのジダンの番号。
    emph: true
    image: assets/images/20261006_player_581678/espanyol/01_w.jpg
  - text: 母デニスは、ドイツにもマドリードにも付いてきて、一緒に暮らしてきました。
    image: assets/images/20261006_player_581678/ghana168/01_w.jpg
  - voice: ジュード・ベリンガム
    text: 母さんのおかげで、地に足をつけていられる
    pause: 0.6
  sources:
  - https://www.thefa.com/news/2021/mar/25/jude-bellingham-first-impressions-20210325
  - https://www.footballista.jp/special/170222
  - https://www.goal.com/en-my/news/jude-bellingham-names-footballing-idols-three-birmingham-stars-on-his-surprise-shortlist/blt3ac31092c3d542d6
  - https://www.soccerdigestweb.com/news/detail/id=133594
  - https://www.theworldmagazine.jp/20240515/01world/spain/406095
- id: view
  heading: ワールドカップの前と後、代表での点のペース
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 6日にチェコ戦、10日にビジャレアル戦、26日にバロンドール
  card:
    type: table
    title: イングランド代表でのベリンガム
    columns: [期間, 試合, 得点, 1試合あたり]
    rows:
    - [W杯の前まで, '48', '6', '0.13']
    - [W杯から今まで, '11', '8', '0.73']
    source: Transfermarkt・FotMob
  say:
  - text: 最後に、代表のベリンガムに何が起きたのかを、数字から見立てます。
    image: assets/images/20261006_player_581678/panama132/01_w.jpg
    card: none
  - text: 比べるのは、ワールドカップの前と後の代表です。
    image: assets/images/20261006_player_581678/panama160/01.jpg
    card: &pace_card
      type: table
      title: イングランド代表でのベリンガム
      columns: [期間, 試合, 得点, 1試合あたり]
      rows:
      - [W杯の前まで, '48', '6', '0.13']
      - [W杯から今まで, '11', '8', '0.73']
      source: Transfermarkt・FotMob
  - text: 大会の前まで、代表では48試合で6点でした。
    card:
      <<: *pace_card
      highlight_row: 0
  - text: それがこの夏からの11試合で8点。点のペースは、ほぼ6倍です。
    emph: true
    card:
      <<: *pace_card
      highlight_row: 1
  - text: 英紙ガーディアンは、流動的になった代表が彼の力を引き出したと書きました。
    image: assets/images/20261006_player_581678/panama117/01_w.jpg
    card: none
  - 決まった位置に縛らず、中央の10番として左右へ動かす形です。
  - text: 一方のレアルでは、今季ここまで3点。同じ自由を、クラブでも得られるか。
    image: assets/images/20261006_player_581678/real2026/01_w.jpg
  - その前に代表は現地6日、ウェンブリーでチェコと戦います。
  - レアルの次の試合は10日。本拠地にビジャレアルを迎えます。
  - 26日はロンドンで、30人の候補に入るバロンドールの発表です。
  - 代表で目覚めた10番が、白いユニホームでも同じ輝きを放てるかに注目です。
  sources:
  - https://www.theguardian.com/football/2026/oct/05/jude-awakening-how-a-more-fluid-england-are-unlocking-bellinghams-full-potential
  - https://www.transfermarkt.com/jude-bellingham/leistungsdatenverein/spieler/581678
  - https://www.fotmob.com/players/1077894
  - https://www.espn.com/soccer/story/_/id/49866841/ballon-dor-2026-nominees-harry-kane-kylian-mbappe-lead-30-man-shortlist
