# **FotMob は使わない。**数字は Transfermarkt API の試合記録（控え research/raw/20261112_doue_*.json）、英語版 Wikipedia、CL決勝の報道（channelstv・parisfans・UEFA）。
# **選んだ理由（2026-11-12）**：player_pool.py list の上位は10月に紹介済み（scripts/*_intro.md）で、pool の外で市場価値の上位（TM 1億2000万）・21歳のドゥエを選んだ。ほかの候補は、デンベレ（10/26 から負傷で欠場中）、パーマー（11/19 に使う）、サリバ（11/19 の比べるで使う）、エンソ・フェルナンデス・フェルミン。
#   重なり：scripts/ を「ドゥエ」で grep → 10/15 のCLの回などに名前が出るだけで紹介は0件。research/2026111*_picks.txt にも無い。同じ日（11/21）の別シリーズでは使わない。
# **現役・今季もリーグ・アン**：TM の試合記録で 2026-11-07（トロワ戦 1-0）まで90分出場。
# **数字の軸**：TM の試合記録。クラブ通算：レンヌ 76試合8点7アシスト、PSG 116試合34点31アシスト（Wikipedia の 116/34 と一致）＝192試合42点。シーズン別（PSG・全公式戦）：24/25 61/16/16、25/26 41/13/11、26/27 14/5/4。今季の大会別：リーグ・アン 9/1/1（526分）、CL 3/3/2、そのほか（スーパーカップ・トロフェ・デ・シャンピオン）2/1/1。代表 19試合4点（TM と Wikipedia が一致）。W杯2026 は TM で8試合1点2アシスト。市場価値（TM）：2022-03 40万→2024-06 3000万→2025-06 9000万→2025-12 9000万→2026-06 1億2000万（÷40万＝300）。
# **入れなかったもの**：信仰の発言（CL優勝後の本人の言葉）、本人の言葉の引用（一次の原文は確かめられず）、バイエルンの誘いの詳細。
# **確かめられなかった**：移籍金5000万ユーロ（ボーナス別）は Wikipedia の記述。PK戦で決めた順番は報道で食い違う（「決めた」ことは複数の記事で一致）。2026年の優勝までの試合の細部は台本に出さない。25/26 秋のけがの中身は確かめられていない（台本は「けがで欠場」だけ）。W杯のフランスの4位は Wikipedia の記述。
# **写真**：press 写真（parisfans のCL決勝の記事写真ほか。Getty 系の可能性があるので、透かしがないか目で見ること）。
