# 取材メモ（10/28 水、シリーズ「比べる」、key: compare_418560_349066）。アーリング・ハーランド（マンチェスター・シティ・26歳）×アレクサンデル・イサク（リヴァプール・27歳）。
# **FotMob・DataMB は使っていない**。数字は Transfermarkt（2026-10-28 取得。控え: research/raw/20261028_haaland_tm.json・20261028_isak_tm.json）。
#   Transfermarkt 番号：ハーランド 418560・イサク 349066。API（tmapi-alpha）の player・performance-season（2020〜2026）・performance-game・market-value-history を2.5秒あけて取得。
#   クロスチェック：2024–25 プレミアリーグの得点ランキング（英語版 Wikipedia。控え: research/raw/20261028_pl2425_wiki.wikitext）＝1位サラー29・**2位イサク23（ニューカッスル）・3位ハーランド22**。TM のリーグ戦の得点と一致。
#   イサクの移籍（英語版 Wikipedia Alexander Isak。控え: research/raw/20261028_isak_wiki.wikitext）＝2025年にニューカッスルからリヴァプールへ、1億2500万ポンド、クラブとイギリスの移籍金の記録（Sky Sports 2025-09-01 の記事を出典に引いている）。TM の加入日 2025-09-01。
# **選んだ理由**：直近の比べ（10/2エムバペ×ハーランド・10/3クラシコ・10/9ベリンガム×ムシアラ・10/11マレン×ラウタロ・10/12ドルトムント×モナコ・10/14バレバ×カマラ・10/16エムバペ×ヴィニシウス・
#   10/17ペドリ×ヴィティーニャ・10/19バイエルン×ドルトムント・10/20ランキング・10/21ライス×ネヴェス・10/22ヤマル×サカ・10/23ヴィルツ×ロジャーズ・10/24オリーセ×パーマー・
#   10/25ケイン×レヴァンドフスキ・10/26ブルーノ×ウーデゴール・10/27デンベレ×ラフィーニャ）に、イサクは一度も出ていない。ハーランドは 10/2 にエムバペと比べたが、ハーランド×イサクの組み合わせは無い
#   （scripts/*compare*・research/*compare*・posted.json の build 名・covered.yaml を grep。ハーランドの直近は 10/18 の CL 記録の本と、マレスカ監督の発言のショート。イサクは covered.yaml にギョケレスの見出しの中で名前が出るだけ）。
#   バロンドールの話は軸にしない（10/27 のショートで4本出した）。この回の軸は **2024年から25年のプレミアの得点（23と22、イサクが1点上）**と、今季のプレミアの得点のペース。
#   ほかに当たって外した候補：フリアン・アルバレス（今季の出場 263分＋CL で450分に届くか怪しい）・ギョケレス（今季のプレミア 148分）・ラウタロ（ハーランドとの組み合わせは成り立つが、イサクのほうが日本との縁がある）。
# **2人とも今季も扱うリーグ（プレミア）の1部**。今季のクラブの全公式戦の出場：ハーランド 943分（リーグ 710・CL 180・コミュニティ・シールド 53）、イサク 687分（リーグ 571・CL 112・リーグカップ 4）。**どちらも450分を超える。イサクは900分に届かない → 「いまの時点」と言う**。
# **使った数**（TM の大会別、プレミアリーグだけ。代表・ほかの大会は混ぜない）
#   22/23 ハーランド 35試合2777分36点8A・イサク 22試合1526分10点2A（ニューカッスル）
#   23/24 ハーランド 31試合2558分27点6A・イサク 30試合2266分21点2A
#   24/25 ハーランド 31試合2743分22点3A・イサク 34試合2774分23点6A
#   25/26 ハーランド 35試合2959分27点8A・イサク 14試合702分3点1A（リヴァプール）
#   26/27 ハーランド 8試合710分9点0A・イサク 7試合571分6点0A（ハーランドは10/24、イサクは10/25 の試合まで）
#   90分あたり（自分で割った値）：ハーランド 1.17・0.95・0.72・0.82・1.14、イサク 0.59・0.83・0.75・0.38・0.95。
#   24/25 の1点にかかった時間：イサク 2774÷23＝120.6（約121分）、ハーランド 2743÷22＝124.7（約125分）。差は約4分。
#   26/27 の1点にかかった時間：ハーランド 710÷9＝78.9（約79分）、イサク 571÷6＝95.2（約95分）。
#   イサクの 25/26 は出場 702分で、理由（負傷など）は台本に入れない（決まり：病気・私生活は入れない。数字を小さく見せる言い方もしない）。
# 日本との接点（確かめた縁）：2026年W杯の1次リーグ、2026年6月25日（現地）の日本対スウェーデン（AT&Tスタジアム、1対1）にイサクが先発し、交代なしで最後までプレー。
#   日本の得点は56分に前田大然、堂安律のアシスト。スウェーデンの得点は62分エランガ（ESPN の試合記録 760471。控え: research/raw/20261028_espn_jpn_swe_20260625.json）。ハーランド側の日本との縁は見つからない（入れない）。
#   **ESPN の日付は UTC で 2026-06-25T23:00Z**＝現地（テキサス）6月25日の夜・日本時間6月26日の朝。台本は「2026年のワールドカップ」とだけ言い、日付は言わない。
# プロフィール（TM）：ハーランド 2000-07-21 生・ノルウェー代表・左足・195cm・シティの背番号9・2022年7月加入・市場価値 2億2000万€（2026-07-22）。
#   イサク 1999-09-21 生・スウェーデン代表・右足・190cm・リヴァプールの背番号9・2025年9月加入・市場価値 9000万€（2026-10-07）。
# 日程（ESPN、2026-10-28 取得。控え: research/raw/20261028_city_espn_schedule.json・20261028_liverpool_espn_schedule.json）：
#   リーグカップ シティ対ブライトン 2026-10-28 19:30 UTC・リヴァプール対チェルシー 20:00 UTC（どちらも公開の後＝日本時間29日の早朝。数字は公開時点で古くならない）。
#   次のプレミア：シティ対ブライトン 2026-10-31 15:00 UTC＝日本時間11月1日 0:00、リヴァプール対アーセナル 2026-11-01 16:30 UTC＝日本時間11月2日 1:30。
# 写真：すべて Wikimedia Commons（出典は各フォルダの credits.json）。ハーランド＝2026年W杯のフランス戦・モロッコ戦（20261018_haaland から写した）・2024年のシティのアメリカ遠征・2025年6月のノルウェー代表の背中の写真（hh3、20261020_compare_ranking_ga から）。
#   イサク＝2026年W杯のフランス対スウェーデン（6月30日、Bryan Berlin、w043・w107・w248・w096）と 2026年のスウェーデン対ギリシャ（i1）。2016年の写真（i2〜i4）は使っていない。目で本人（スウェーデンの9番）と確かめた。
#   表の出る行は、顔が板の下に入らないよう、顔の小さい写真（hh3＝背中・w107＝ドリブルの引き）を敷く。
# PK と出場中のチームの得点（TM の performance-season、GB1）：24/25 ハーランド PK 4本中3点・出場中のチームの得点58、イサク PK 4本中4点・62。26/27 は2人とも PK 0、出場中のチームの得点 ハーランド20・イサク11。
#   通算（プレミア）：ハーランド 22/23〜25/26 の4季 36+27+22+27＝112点・2777+2558+2743+2959＝11037分（98.5分に1点）。イサク ニューカッスルの3季 10+21+23＝54点・1526+2266+2774＝6566分（121.6分に1点）。
#   割合 22÷58＝37.9%・23÷62＝37.1%、9÷20＝45%・6÷11＝54.5%（台本は約55%）。
