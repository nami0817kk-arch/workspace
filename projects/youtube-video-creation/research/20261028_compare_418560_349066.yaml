    say:
      - text: 23点と22点。ここからPKで決めた点を引いてみます。
        image: assets/images/20261028_compare_418560_349066/h_mor/01_w.jpg
        card: none
      - text: PKの得点は、ハーランドが3、イサクが4でした。
        image: assets/images/20261028_compare_418560_349066/hh3/01.jpg
        card: {<<: *pkcard, highlight_row: PKの得点}
      - text: 引くと、どちらも19点。PKを除けば、まったく同じ数です。
        emph: true
        image: assets/images/20261028_compare_418560_349066/w107/01.jpg
        card: {<<: *pkcard, highlight_row: PKを除いた得点}
      - text: 次に、本人がピッチにいたあいだに、チームが何点取ったかを見ます。
        image: assets/images/20261028_compare_418560_349066/hh3/01.jpg
        card: {<<: *pkcard, highlight_row: 出場中のチームの得点}
      - text: シティは58点、ニューカッスルは62点。
        image: assets/images/20261028_compare_418560_349066/w107/01.jpg
        card: {<<: *pkcard, highlight_row: 出場中のチームの得点}
      - text: そのうち本人が決めた割合は、38%と37%。ここも並んでいます。
        image: assets/images/20261028_compare_418560_349066/pair_b/01.jpg
        card: none
      - text: 今季はどうか。2人とも、PKの得点はまだ0です。
        image: assets/images/20261028_compare_418560_349066/w248/01_w.jpg
        card: none
      - text: 本人がいるあいだのチームの得点は、シティ20、リヴァプール11。
        image: assets/images/20261028_compare_418560_349066/h_fra/01_w.jpg
        card: none
      - text: そのうち本人の点は、ハーランドが45%、イサクは約55%。
        image: assets/images/20261028_compare_418560_349066/h_fra/01_w.jpg
        card: none
      - text: チームの点に占める重みは、今季はイサクのほうが大きいんです。
        emph: true
        image: assets/images/20261028_compare_418560_349066/w043/01_w.jpg
        card: none
