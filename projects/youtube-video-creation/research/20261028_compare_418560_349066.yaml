      - text: 今季は約79分と約95分。
        image: assets/images/20261028_compare_418560_349066/hh3/01.jpg
        card: {<<: *viewcard, highlight_row: 26/27 の1点にかかった時間}
      - text: いまの速さでは、ハーランドが16分ほど早く1点に届いています。
