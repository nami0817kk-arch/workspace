  - text: 9月28日、広島でのベネズエラとの親善試合。日本の2対1の勝ちで、伊東純也は後半から入りました。
    image: assets/images/20260929b_ito/01.jpg
  - 今回の代表メンバーでいちばん年上の33歳。
  - 前半の主将、鎌田大地から腕章を引き継ぎ、フォワードのすぐ後ろ、シャドーと呼ぶ左の位置へ。
  - text: 後半1分に失点。その3分後、相馬勇紀のバックパスを受けた伊東が右足でクロス。上田綺世が合わせて同点です。
    card:
