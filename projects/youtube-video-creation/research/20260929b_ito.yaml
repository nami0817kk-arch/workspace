  say:
  - text: 伊東純也の「今が一番」を、代表での積み上げに重ねてみます。
    image: assets/images/20260929b_ito/02.jpg
  - デビューは2017年12月、24歳。ベネズエラ戦が75試合目で、通算16得点です。
  - 29歳までは42試合で9得点。
  - 30歳を過ぎてからは33試合で7得点。
  - どちらも、5試合に1点ほどの割合です。
  - 2025年は6試合で得点なし。それでも今年は、W杯の4試合すべてに出ています。
  - そして9月は、ウルグアイ戦とベネズエラ戦で、どちらも途中から入ってアシスト。
  - 33歳になっても、衰えを示す数字は代表の記録に出ていません。
  - 本人が欲しがった得点が次のエクアドル戦で付くかで、「今が一番」の中身が決まります。
  sources:
