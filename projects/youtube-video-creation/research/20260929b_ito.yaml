  heading: ネットの反応
  tier: 未確認
  telop: 「もう33歳なのか。」
  narrator: キャスター
  say:
  - voice: ネット民
    text: ここに来て円熟味が増している。
  - voice: ネット民
    text: 単純な足の速さは落ちていくだろうけど
    cont: true
  - voice: ネット民
    text: 巧さはむしろ、伸びてきている。
    cont: true
  - voice: ネット民
    text: 常に得点に絡む職人、
  - voice: ネット民
    text: 無口で出しゃばらないところも伊東さんのいいところ。
    cont: true
  - voice: ネット民
    text: でも年長で主将だから「言うべき事は言う」、
    cont: true
  - voice: ネット民
    text: そこは頑張ったと思う。
    cont: true
  - voice: ネット民
    text: こういう人もチームには必要なのかも。
    cont: true
  - voice: ネット民
    text: マジで後任が見当たらなくて困る。
    short_voice: true
  - voice: ネット民
    text: もう33歳なのか。
    cont: true
