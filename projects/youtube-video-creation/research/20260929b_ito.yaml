- id: words
  main: true
  heading: 主審に言い続けた
  tier: 報道
  telop: 「タケに『絶対ファウルだから言って』と言われて」
  narrator: キャスター
  say:
  - text: 後半から入り、主将の腕章と同点のアシスト。33歳の伊東純也が、終了間際のPKの裏側をこう。
    short_only: true
  - text: 後半アディショナルタイム。久保が倒されても主審は流し、その直後に相手のPKになります。
    image: assets/images/20260929b_ito/02.jpg
  - 鈴木淳之介のファウルでした。ところがビデオ判定で久保の場面が先だと分かり、日本のPKに。
  - 伊東はそのあいだ、主審のそばで言い続けていました。久保のことは、タケと呼びます。
  - voice: 伊東純也
    text: 淳之介のやつもファウルだったと思うけど、
  - voice: 伊東純也
    text: その前にタケのところでファウルがあって、
    cont: true
  - voice: 伊東純也
    text: タケに『絶対ファウルだから言って』と言われて。
    cont: true
  - voice: 伊東純也
    text: 言っていたけど、『チェックしているから』と言っていたので、
    cont: true
  - voice: 伊東純也
    text: チェックを待って、こっちのファウルが先になって良かった
    cont: true
  - 主将の役目を聞かれると。
  - voice: 伊東純也
    text: キャプテンという柄じゃないけど、
  - voice: 伊東純也
    text: 言えるところは言おうかなと思っていた
    cont: true
  - 全盛期は何歳なのか、と聞かれた答えは。
  - voice: 伊東純也
    text: 今が一番調子いいです
  - voice: 伊東純也
    text: 出たら結果を出せているので、結果がすべてかなと思う
    cont: true
  - voice: 伊東純也
    text: 満足ではない。自分でも点を取れたらもっといいけど、
    cont: true
  - voice: 伊東純也
    text: ゴールに絡めているのはいいこと
    cont: true
