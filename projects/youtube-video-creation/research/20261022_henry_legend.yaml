# ティエリ・アンリ（元フランス代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-22。型は 10/20 のベッカム・10/21 のロナウドと同じ8節。
# ①フック ②基礎DATA ③歩んだ道と転機 ④プレースタイル（＋通算の表）⑤「あの試合」＝2006-05-07 プレミアリーグ最終節 アーセナル対ウィガン（ハイバリー最後の試合）⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Transfermarkt は不使用**。数字は Wikipedia（英語版・特集記事）の成績表と、ESPN の試合記録・順位表（site.api.espn.com）、Arsenal.com、UEFA.com と、自分で足した・割った値だけ。
# **引退後の私生活（家族・結婚・離れて暮らす理由）、2009年のハンドの件、サッカー以外の訴訟は入れない**。モントリオールの辞任は「2021年2月に辞任」とだけ言う（理由は言わない）。女子サッカー・Jリーグの話は入れない。
# **日本との接点**：調べたが、台本に入れられる確かなものが無かった（2001年コンフェデ杯決勝 日本0-1フランスにアンリは出ていない＝英語版 Wikipedia の先発表で確認。稲本潤一の2001-02のアーセナル（レンタル）はリーグ戦0試合で、同じチームだったという以上の話にならない）。**10/6 の決定どおり、無ければ入れない**。
#
# **一次情報で確かめたこと（引退・時期・いまの立場）**
# - 引退：2014-12-16（アル・ジャジーラ 2014-12-16「France great Henry announces retirement」。声明「It has been an incredible journey…」の一部と、スカイ・スポーツの解説者になる発表。FIFA.com の記事（Wikipedia が引用）は archive でも本文が取れず未読）。ニューヨーク・レッドブルズ退団の発表は 2014-12-01（NYT、Wikipedia 経由）。
# - いまの立場：**現役ではない。監督でもない（2024年パリ五輪のあと、監督職の確かな報道は見つからない）**。CBS Sports：2026年5月のCL決勝（ブダペスト）の中継の紹介（CBS の発表。検索の要約で確認、本文は未読）に「analysts Thierry Henry, Jamie Carragher, Micah Richards」。2021-09-27 から CBS の CL スタジオ解説者（Wikipedia）。**2026/27シーズンの契約は未確認なので、台本は「いまは、CBSスポーツでチャンピオンズリーグの番組に出る解説者」と、2026年5月の実績の言い方に合わせた**。
# - **UEFA会長賞**：UEFA.com「Thierry Henry receives UEFA President's Award」（WebFetch。日付 2026-08-27、「Award recognises exemplary achievements on and off the pitch」、通算411得点、「Pace, grace, skill and ice-cold finishing…」）。EWN（2026-08-27）：式典は CL リーグフェーズ組み合わせ抽選の場、モナコのグリマルディ・フォーラム、会長 チェフェリン。受賞の言葉（EWN、英語）「I did thank the president for the trophy, but if you don't play with great players and a great team, you can't get this type of award.」→ 台本は**日本語訳**（訳した発言は声に出して通るか確認）。
#
# **数字の出どころ・食い違いと台本での扱い**
# - **全大会の通算（英語版 Wikipedia の成績表。worldfootball.net 出典）**：モナコB 19試合6得点（CFA）／モナコ 141試合28得点／ユベントス 20試合3得点／アーセナル 370試合226得点＋2012年のレンタル 7試合2得点＝377試合228得点／バルセロナ 121試合49得点／NYレッドブルズ 135試合52得点／フランス代表 123試合51得点。
#   **台本とサムネの「通算」は、モナコBを除いたトップチーム＝917試合411得点**（自分で足した。UEFA の「411得点」と一致するのを確認）。Wikipedia の表のままだとモナコBを含み 936試合417得点。
#   アーセナル 377試合228得点は Arsenal.com（「228 goals in 377 appearances」。検索の要約）と一致。古い Arsenal の記事に 226得点・370試合（2012年のレンタル前）が残る。
# - プレミアリーグ：2001-02（24点）・2003-04（30点）・2004-05（25点）・2005-06（27点）の4回の得点王（Arsenal.com「four Golden Boots」。年は Wikipedia の表と突き合わせた）。リーグ優勝2回（2001-02・2003-04）、FAカップ3回（Arsenal.com）。2003-04 は ESPN の順位表で 26勝12分0敗・勝ち点90。
# - **ハイバリー最後の試合（ESPN の試合記録 event 186147）**：2006-05-07、Highbury（観衆 38,359）、アーセナル4-2ウィガン。8分ピレス（A）、10分シャルナー（W）、33分トンプソン（W）、35分アンリ、56分アンリ、76分アンリ（PK）。ESPN の順位表（2005シーズン）：4位 アーセナル 勝ち点67、5位 トッテナム 65。同日、ウェストハム2-1トッテナム（ESPN の日程）。
#   「ハイバリー最後の試合」は Commons のファイル名（The last ever game at Highbury）と報道の通説。**翌2006-07からエミレーツに移ったことは一次資料を読んでいない**（Arsenal 公式の関連記事は 404 で読めなかった）が、台本では「最後の試合」とだけ言い、エミレーツの話は短くする。
#   「4位までがCLの出場権」は2005-06当時のイングランドの枠（私の知識で、一次資料は未確認）。
# - **2005-10-18 スパルタ・プラハ戦（ESPN event 188778）**：アーセナル2-0。アンリは15分にレジェスと交代で出場、21分と74分に得点。Arsenal.com（検索の要約）：「first goal equalled Ian Wright's total of 185」「2回目が186点目（303試合目）」。**「185点」はクラブの当時の記録（アイアン・ライト）**。
# - **2012-01-09 FAカップ3回戦 アーセナル1-0リーズ（ESPN event 334486）**：アンリは68分にシャマクと交代で出場、78分に決勝点。2か月のレンタルは 2012-01-06（BBC、Wikipedia 経由）。銅像はエミレーツ・スタジアムの外で 2011-12-09 に除幕（AFP 2011-12-09 の記事、Vanguard 転載。検索の要約）。
# - 移籍金：1999-08 アーセナル 推定1100万ポンド（BBC、Wikipedia 経由）。「推定」と言う。ウイング→センターフォワードの転向：英語版 Wikipedia のプレースタイル節（Wenger switched Henry to his childhood position）。
# - 指導者の経歴：英語版 Wikipedia（Managerial career）。アーセナル下部組織 2015-02、ベルギー代表 2016-08、モナコ 2018-10-11〜2019-01-24（20試合4勝5分11敗＝**台本は結果を言わず「2019年1月まで」とだけ**）、モントリオール 2019-11-14〜2021-02-25、ベルギー代表（復帰）2021-05、フランスU-21 2023-08-21 → 2024年パリ五輪（銀メダル。Wikipedia の勲章欄に 2024 Paris Team Silver）。
# - 本人以外の言葉：アラン・スミス（元アーセナルFW）2004年の評（英語版 Wikipedia のプレースタイル節の引用。原文 "I have to say I haven't seen a player like him. He's an athlete with great technical ability and a tremendous desire to be the best."）→ **台本は日本語訳**。原文の出典（2004年の記事）は未読。
# - 入れなかったもの：移籍金以外の金銭、2009年のハンド、サッカー以外の広告（ナイキ等）、エミレーツの銅像の詳しい姿、ハイバリーの芝にキスした話（未確認）、プレミアの得点王4回の各年の得点（表のみ）。
# **日本語名・読みで怪しいもの**：ティエリ・アンリ・レ・ユリス・モナコ・ユベントス・アーセナル・バルセロナ・ニューヨーク・レッドブルズ・ハイバリー・ウィガン・ピレス・シャルナー・トンプソン・ベンゲル・アラン・スミス・スパルタ・プラハ・レジェス・アイアン・ライト・リーズ・モントリオール・インパクト・CBSスポーツ・UEFA・グリマルディ・フォーラム・ウェストハム・トッテナム。
