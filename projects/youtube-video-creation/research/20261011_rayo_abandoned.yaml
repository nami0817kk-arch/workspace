  title: ラージョ対ビルバオが13分で止まり、そのまま中止。クラブが声明に使った一語
  question: ラージョ対ビルバオはなぜ中止になり、クラブは声明に何と書いたのか
  takeaway: ラ・リーガ第8節、ラージョ・バジェカーノ対アスレティック・ビルバオが、スタンドからの物の投げ込みで中止になった。主審サンチェス・マルティネスの試合報告書によれば、13分に紙飛行機と直径2センチほどのプラスチックの球が投げ込まれて最初の手順が取られ、試合は10分間止まった。24分に二度目があって両チームがロッカーに下がり、再開の16秒後に三度目が起きている。報告書は3回とも物が人に当たってはいないと書いており、最後は国家警察の警備責任者が主審に、続けるための安全を確保できないと伝えて中止が決まった。中止の時点で0対0、規定の残りは20分44秒で、最初の中断のぶんの追加時間が最低10分。足すと30分44秒で、90分のおよそ3分の1がまだ残っていたことになる。試合のあと、ラージョは公式サイトの声明で偶発的な出来事ではなく前もって計画された行為だと書き、「計画された襲撃」という強い言葉を使った。印刷された紙と直径2センチの球を用意し、同時に動く仕組みが要ったことを根拠に挙げ、選手も審判も大多数のファンも被害を受けた側だと結んでいる。声明は、こうした中止が15年で3度目で、2012年9月のレアル・マドリード戦と2019年のアルバセテ戦に続くものだとも書いた
  opening_image: assets/images/20261011_rayo_abandoned/02_w.jpg
