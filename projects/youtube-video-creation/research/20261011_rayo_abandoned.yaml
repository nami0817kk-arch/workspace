# **ショートだけ作る**（本編は作らない。台本は1本で、`short` が山場の節を切り出す）。
#
# ■ 原文は取れた（ここがこの回のいちばん大事なところ）
#   WebFetch は弾かれるが、**requests に普通のブラウザの User-Agent を付けると 200 で返る**。
#   BBC も marca も本文を最後まで読んだうえで書いている。さらに、
#   **クラブの声明はラージョの公式サイトに同じ文が丸ごと載っていた**ので、
#   marca 経由ではなく**クラブの一次情報**として扱っている。
#     ・https://www.rayovallecano.es/noticias/comunicado-oficial-athletic-club （声明の全文・公式）
#     ・https://www.bbc.co.uk/sport/football/articles/cw99zy27x0rro （BBC）
#     ・https://www.marca.com/futbol/rayo/2026/10/10/rayo-vallecano-habla-atentado-planificado-suspension-partido-athletic.html
#     ・https://www.marca.com/futbol/rayo/2026/10/10/acta-suspension-rayo-athletic.html （**主審の試合報告書＝acta の引用**）
#   原文で確かめた言い回し:
#     "No se trata de hechos fortuitos u ocasionales, sino de actuaciones previamente ideadas y planificadas…"
#     "Este atentado contra Rayo Vallecano de Madrid ha sido minuciosamente planificado, ya que, para su ejecución,
#      ha sido necesario coordinar una logística de medios materiales, como los papeles impresos y las esferas de 2 cm…"
#     "…son todos víctimas de un atentado contra sus derechos y libertades, cometido por un grupo organizado de intolerantes"
#   主審（Sánchez Martínez）の報告書の原文:
#     "En el minuto 13 … se activó el Protocolo 1 por lanzamiento de objetos … pelotas de plástico de aproximadamente
#      2 cm de diámetro … sin que ninguno de estos objetos llegaran a impactar sobre persona alguna … el partido
#      permaneció detenido durante diez minutos"
#     "En el minuto 24 se activó el Protocolo 2 … se ordenó la retirada de ambos equipos a vestuarios durante un
#      periodo de diez minutos"
#     "Una vez reanudado el encuentro, transcurridos 16 segundos, se produjo un nuevo lanzamiento…"
#     "…restaban por disputarse 20 minutos y 44 segundos de tiempo reglamentario, además de un mínimo de 10 minutos
#      de tiempo añadido"
#
# ■ 扱い方（ユーザー指示：煽らない。誰かを責める言い方にしない）
#   ・**投げ込んだ人たちの団体名は出していない。**クラブの声明は特定の団体の名前を3つ挙げているが、
#     それは**クラブが名指しした主張**であって、まだ誰の処分も決まっていない。
#     台本では「組織された集団」というクラブの言い方だけを使う。
#   ・**「ビー玉」とは言っていない。**報告書とクラブの声明はどちらも
#     「直径2センチほどのプラスチックの球」と書いている。そのまま言う。
#   ・報告書が3回とも「人に当たってはいない」と書いているので、**その一行を必ず入れる。**
#   ・会長の名前は出さない。抗議の相手は「クラブの運営」としか言わない。
#   ・**放送映像は使っていない。**写真はスタンドとピッチの実写2枚だけ。
#
# ■ 数字
#   ・中止の時点で 0対0。規定の残りが20分44秒、最初の中断ぶんの追加時間が最低10分。
#     **足して30分44秒**。90分に対しておよそ3分の1。これは報告書の2つの数字を自分で足しただけ。
#   ・止まっていた時間は、報告書に出てくるだけで10分＋10分＝20分。
#   ・クラブの声明は「15年で3度目」と書き、2012年9月のレアル・マドリード戦と2019年のアルバセテ戦を挙げている。
#   ・ラ・リーガの順位は**出していない**（BBC は13位、ESPN の順位表は12位で食い違ううえ、問いに答えない）。
#
# ■ 写真
#   記事の写真は BBC が Getty、marca が EFE で、**どちらも代理店なので取り込まない。**
#   代わりに Commons のバジェカスの実写2枚を使う。人物が主役の写真ではない。
#     01.jpg = File:Estadio del Rayo Vallecano.jpg（CC0 / 4theliberty、1448x2172。縦。スタンドとピッチ）
#     02.jpg = File:Estadiovallecas1.JPG（CC BY-SA 3.0 / N Kirk、1920x1440。横。ゴール裏のスタンド）
#   `facecrop.py` で 01_w / 01_v / 02_w / 02_v を作り、**4枚とも開いて目で見た**。
#   ショートに敷く 01_v は 1222x2172 で、高さの下限1200pxを超えている。
#   **その日の試合の写真ではない**ので、台本でも「この試合の写真」とは言っていない。
# **ネットの反応は集めていない**（ユーザー指示で、この3本は反応なしでよい）。
# 数字の重なり対策：『第8節』は①だけ。『13分』『24分』『16秒』『0対0』は②だけ。
#   『20分44秒』『30分44秒』『15年』『2012年』『2019年』は③だけ。
# サムネ：**点検を通すために1案だけ書いてある。決めるのはユーザー**（報告に3案を出す）。
