  say:
  - text: サウサンプトンの指揮官が、相手の練習をのぞいて処分されました。
    short_only: true
  - voice: 規制委員会
    text: 相手をのぞき見ることは、非常に重い違反である。
    card: *verdict
  - text: 出たのは3つ。6週間の活動禁止と、罰金と、戒めの譴責です。
    card: *verdict
  - text: 委員会が置いた出発点の16週間より、10週間も短い数字です。
    card: *verdict
  - text: ただし活動禁止は全部、2028年6月30日まで執行猶予になりました。
