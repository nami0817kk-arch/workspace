  title: サウサンプトン監督、練習のぞき見の処分。16週間はどこまで減ったか
  question: サウサンプトンのエッカート監督は何をして、どんな罰が出たのか
  takeaway: 委員会が釣り合うと見た出発点は4か月、16週間の活動禁止。そこから情状酌量で7週間、罪を認めた割引で3週間が引かれて6週間になり、最後に全部が2028年6月30日まで執行猶予になった。実際に休む週はゼロで、いま効くのは2万8000ポンドの罰金と譴責だけ。2019年のリーズは同じのぞき見でクラブに20万ポンドの罰金が出たが個人への処分は無く、2024年のカナダは1年の禁止だった
  opening_image: assets/images/20261008_spy_ban/01_w.jpg
