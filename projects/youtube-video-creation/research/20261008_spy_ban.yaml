# 取材メモ（10/8 題材 spy_ban、型は news、ほかのニュース枠）。材料の控えは research/raw/20261008_spy_ban.md。
# **判決・処分の回**なので、イングランドサッカー協会の独立規制委員会の判断の文書（全48ページ）と1行ずつ突き合わせた。
#   文書: THE FOOTBALL ASSOCIATION and TONDA ECKERT / WRITTEN REASONS（2026年10月5日付、審理は9月24日）
#   https://www.thefa.com/-/media/files/thefaportal/governance-docs/discipline-cases/2026-27/the-fa-v-tonda-eckert.ashx
#   公式発表: https://www.thefa.com/news/2026/oct/07/tonda-eckert-update-071026
#   記事と食い違ったところ（猶予の期間・求刑・円換算・EFL の認定の相手・出発点の罰金）は raw の「精査」の表に残した。
#   台本の数字は、すべて判断の文書の段落から取っている（記事の要約は使っていない）。
# 本人の言葉は、判断の文書に引かれたエッカートの陳述書と反対尋問の発言（＝この処分の中身そのもの）だけを使う。
#   6月の謝罪（「禁止されているとは知らなかった」）は、この処分より前の言葉なので置かない。
# 為替は 1ポンド＝208.93円（欧州中央銀行の参考レート、2026年10月7日。api.frankfurter.app）。
# ネットの声は Yahoo!ニュースのコメント欄から1件（全文）。2件目はマンチェスター・シティの話なので外した。
#   英語の声は取れなかった（X・Reddit はブラウザが要る。英語媒体のコメント欄は JavaScript）。
# 写真は Commons の File:Tonda Eckert 22112025 (16).jpg（CC0 / Timmy96、2025年11月22日のチャールトン戦）。
#   右にエッカート、左に得点板。本編の板は左寄せなので顔にかからない。01_w＝冒頭と本文、01_v＝ショート。
# 松木玖生が在籍しているクラブだが、題は処分の中身なので台本には入れない。
