  say:
  - text: この6週間は重いのか軽いのか。過去の処分と並べてみます。
    card: *past
  - text: 2019年のリーズは、クラブに20万ポンドの罰金で終わっています。
    card:
      <<: *past
      highlight_row: 0
  - text: いま決まった監督個人の罰金の、7倍を超える額です。
    card:
      <<: *past
      highlight_row: 0
  - text: 当時の監督ら個人への処分は無かったようだ、と委員会は書いています。
    card:
      <<: *past
      highlight_row: 0
  - text: この件が、試合前72時間の観察を禁じる規則のきっかけでした。
    card:
      <<: *past
      highlight_row: 0
  - text: 2024年のパリ五輪では、カナダの監督ら3人に1年の禁止。
    card:
      <<: *past
      highlight_row: 1
  - text: 52週です。今回の出発点16週間は、その3割ほどにあたります。
    card:
      <<: *past
      highlight_row: 1
  - text: 個人の監督は6週間で、しかも全部が猶予です。
    card:
