    card: *calc1
  - text: そこから汲むべき事情、情状酌量で7週間が引かれ、9週間です。
    card: *calc1
  - voice: 規制委員会
    text: 反省の深さは、誰に期待できるものとしても、
    card: *calc1
  - voice: 規制委員会
    text: これ以上ないほど深く、真剣なものだった。
    cont: true
    card: *calc1
  - text: 重くする事情は1つも無い、というのが委員会の見方です。
