# クラブの財政：ACミラン（10/23 金、シリーズ「クラブの財政」、key: finance_acmilan、型は news）。
#
# 軸は「**欧州の大会が無かった年に、収入は6%減り、3年続いた黒字が約2400万ユーロの赤字になった。デロイトの数字とクラブの数字は、なぜ8410万ユーロ違うのか**」。
#   ・デロイト Football Money League 2026（2024/25）：15位、収入 4億1040万ユーロ（前の年 3億9760万、+3%、+1280万）。順位は前の年13位から2つ下がった。
#   ・クラブ公式（5 Nov 2025、2025年6月期）：収入 4億9450万（3年連続の過去最高、前の年から+10%）、純利益 300万（3年連続の黒字）、純資産 1億9900万、純金融債務 9260万（+4300万）。
#   ・クラブ公式（28 Sep 2026、2026年6月期）：収入 4億6460万（2024/25比 −6%、2023/24比 +1.7%）、最終損益 約2400万の赤字（3年連続の黒字のあとの最初）、
#     スポンサー収入 初めて1億超、セリエAの平均観客 7万2000人超（2年連続で最多）、純金融債務 1億4530万（前の年 約9200万）、純資産 1億7640万。「欧州の大会に出なかった」。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差／インテル＝10位との差／ヴィラ＝放映権の割合が最高／ユヴェントス＝放映権の特需と商業の穴／
#     アトレティコ＝増えた収入の約85%が商業）は繰り返さない。
#     この回の軸は「**欧州の大会が無かった年の収入の減りと損益の動きの大きさ（クラブの発表）と、デロイトとクラブの収入の集計の違い**」。
#   ★アルファベットは読み上げに出さない。女子チームの話・監督・選手の個人名・法的な争い・制裁は言わない。選手の移籍金・給料の額は出さない。オーナーの名前・取引の話は言わない。
#
# **決算期**：6月30日決算。2024/25＝2025年6月期。2025/26＝2026年6月期（取締役会が決算案を承認＝2026-09-28、株主総会に提出する前の段階）。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026 一次ページ（deloitte.com、2026-10-23 に取得）：15位 AC Milan。図（e.infogram.com/_/jPrqMzlWeB6VvXO2r9HP、図の文字を座標順に読んだ）から
#       「2025 Revenue €410.4m (2024: €397.6m)」「Change on previous year +3% (+€12.8m)」。収入 2021-2025（百万ユーロ、図の整数）：216/257/385/398/410。
#       試合日 −/38/79/87/87（2021は図に無し）。放映権 147/141/182/161/161。商業 69/79/124/150/163。給料 168.7/169.9/174/189/189。給料÷収入 78/66/45/47/46（%）。
#       DFML の順位 19/16/13/13/15。ピッチ上（2024/25）：セリエA 8位／欧州チャンピオンズリーグ ノックアウトのプレーオフ。
#       ★女子チームの欄は n/d（使わない）。
#       ★隣の順位の収入（それぞれの図で確認、アトレティコの回までに確認済みの値）：14位アストン・ヴィラ €450.2m、16位ユヴェントス €401.7m。
#       定義（ページ本文 Comparability）：「Revenue excludes player/coach transfer fees, VAT and other sales related taxes.」＝選手・監督の移籍金、付加価値税などを含まない。
#       本文：「Serie A’s new domestic deals … total average rights value per season fall by c.3%」（セリエAの新しい国内契約は、1シーズンの平均の権利額が約3%下がった）。
#   ○ クラブ公式（acmilan.com）2026-09-28「AC MILAN, SOLIDITÀ E INVESTIMENTI PER ACCELERARE LA CRESCITA」
#       https://www.acmilan.com/it/news/articles/club/2026-09-28/ac-milan-solidita-e-investimenti-per-accelerare-la-crescita（requests で全文を読んだ）
#       「€464,6 milioni di ricavi … +1,7% rispetto al 2023/24 e -6% rispetto al 2024/25」「assorbire una parte significativa dell’impatto dell’assenza dalle competizioni europee」
#       「risultato netto negativo per circa €24 milioni, dopo tre stagioni consecutive in utile」「sponsorship che superano per la prima volta nella storia del Club la soglia dei €100 milioni」
#       「più alta media spettatori del campionato, pari a oltre 72mila presenze」（2年連続）「Posizione Finanziaria Netta … €145,3 milioni, rispetto a circa €92 milioni … patrimonio netto pari a €176,4 milioni」
#       「maggiore utilizzo di linee di credito a supporto degli investimenti, della crescita e dei progetti strategici」「5 novembre 2025 … Grande Funzione Urbana San Siro, comprensiva dello stadio Meazza e delle aree circostanti」
#       ★ブランド価値（ブランド・ファイナンス）の記述は第三者の算定をクラブが引いたもの。台本に出さない。
#   ○ クラブ公式（acmilan.com）2025-11-05「STORICO TERZO UTILE CONSECUTIVO E NUOVO RECORD DI RICAVI …」
#       https://www.acmilan.com/it/news/articoli/club/2025-11-05/storico-terzo-utile-consecutivo-e-nuovo-record-di-ricavi-il-club-cresce-sostenendo-il-progetto-sportivo
#       「terzo utile di bilancio consecutivo … risultato consolidato positivo di 3 milioni di euro」「terzo anno consecutivo un nuovo record assoluto di ricavi … 494,5 milioni di euro, con un incremento del 10%」
#       「ricavi commerciali … 152,3 milioni totali, in crescita del 6%」（スポンサー収入＋商業・ロイヤルティ）「proventi audiovisivi e media … incremento di 1,9 milioni」「ricavi da gestione dei diritti dei calciatori, in aumento del 30,6%」
#       「patrimonio netto consolidato positivo … 199 milioni」「indebitamento finanziario netto … 92,6 milioni di euro, in aumento di 43 milioni」。
#   ○ 報道（ANSA 2025-11-05）https://www.ansa.it/sito/notizie/topnews/2025/11/05/s.-siro-passa-a-inter-e-milan-per-197-milioni-firmato-il-rogito_4f97f758-3b64-4e6d-b611-a1d0b0023f89.html
#       サン・シーロと周辺の用地をインテルとミランが1億9700万ユーロで買い、証書に署名（2025-11-05）。2クラブの按分は記事に無い。
#   ○ 英語版 Wikipedia「2024–25 AC Milan season」：セリエA 8位、チャンピオンズリーグはプレーオフまで（ノックアウトフェーズ）。「2025–26 AC Milan season」：欧州の大会は無し（国内リーグ・コッパ・スーパーコッパ）。
#   × 確かめられなかったもの：2025/26 の決算書本体（収入の内訳・費用・選手の売却益・人件費）、株主総会の日付、赤字の費用側の理由、2025/26 のリーグ順位（記事間で割れるので台本に出さない）、
#     2023/24 の収入の絶対額（クラブの+10%と+1.7%を足し引きすると合わない＝比べる基準が違う可能性。台本に2023/24の額と+10%は出さない）、
#     デロイトとクラブの収入の差8410万ユーロの全部の中身（クラブは「選手の権利の管理から入る収入」を収入に入れている。デロイトは移籍金を除く。全部がそれかは未確認）。
#     第三者（Calcio e Finanza）の「テレビと試合日が7000〜8000万減った」という推計は有料記事で読めていない。台本に出さない。
#
# 自分で計算した数（検算済み）
#   デロイト 410.4−397.6＝12.8。410.4−401.7＝8.7（ユヴェントスとの差）。450.2−410.4＝39.8（ヴィラとの差）。
#   商業 163÷69＝2.36倍→約2.4倍。放映権 161÷147＝1.095→約10%増。商業 150→163（+13）、放映権 161→161、試合日 87→87。
#   クラブ 494.5−410.4＝84.1。84.1÷494.5＝17.0%。464.6−494.5＝−29.9。−29.9÷494.5＝−6.05%→6%。損益の動き 3−(−24)＝27（クラブの値は「約24」）。
#   純金融債務 145.3−92.6＝52.7（クラブは「約92」と書く）。純資産 199−176.4＝22.6。
#
