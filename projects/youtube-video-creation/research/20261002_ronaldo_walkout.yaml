  - text: 30日の会見で、ジェズス監督はこう話しています。
    image: assets/images/20261002_pair_jesus_ronaldo/01.jpg
  - voice: ジェズス監督
    text: 私と彼のあいだに何か問題があるように見えているが、
  - voice: ジェズス監督
    text: 問題なんて何も無い
    cont: true
  - text: 監督は前もって、ノルウェー戦とデンマーク戦には出さないと、本人に伝えていたと言います。
  - text: そのうえで、アップのさせ方については誤りを認めました。
  - voice: ジェズス監督
    text: そこは私の誤りだ。アップに行かせるのは、
  - voice: ジェズス監督
    text: 15分か20分、遅くするべきだった
    cont: true
  - text: そして、こうも言いました。
  - voice: ジェズス監督
    text: クラブでは会長が決める。チームでは私が決める
  - text: 会見で監督は、デンマーク戦の先発はゴンサロ・ラモスだとも話しました。
    image: assets/images/20261002_ronaldo_w/01.jpg
  - text: そのあと、ロナウドは練習場に姿を見せないまま、チームを後にしました。
