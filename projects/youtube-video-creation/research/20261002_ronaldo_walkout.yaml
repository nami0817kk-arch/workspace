  narrator: キャスター
  say:
  - text: 次の試合も先発しないと監督が会見で話した直後、ポルトガル代表のキャプテンが動きました。
    short_only: true
  - text: 9月30日、41歳のクリスティアーノ・ロナウドが、コペンハーゲンでの代表合宿を出ました。
    image: assets/images/20261002_ronaldo_w/01.jpg
  - text: 本人がインスタグラムに出した言葉です。
  - voice: ロナウド
    text: 代表監督の会見のあと、連盟の会長と話をして、
  - voice: ロナウド
    text: 代表の合宿を離れることに決めた。
    cont: true
  - voice: ロナウド
    text: 時が来たら、ずっと身を捧げてきた代表を去った理由について、
    cont: true
  - voice: ロナウド
    text: すべてのポルトガルの人に真実を話す。
    cont: true
  - voice: ロナウド
    text: 今は、ポルトガルと、仲間たち全員の幸運を祈るときだ。
    cont: true
  - voice: ロナウド
    text: 一人の例外もなく
    cont: true
  - text: 連盟は同じ夜、残る24人で準備を続けると発表しました。
  quotes_from:
