# 取材メモ（10/2 公開、題材はユーザーが○）。key = ronaldo_walkout。型は news。材料の控え: research/raw/20261002_ronaldo_walkout.md（頭に「## 精査」、文ごとの根拠と原文）
# センシティブな題材なので、言い切るのは本人（X/Instagram の投稿）・連盟（声明）・監督（会見の書き起こし）で確かめた範囲だけ。
#   処分・引退・不仲の中身は「報道」と分かる言い方にする。処分の条文は FPF の原本を開けず（403・タイムアウト）、ポルトガル紙3社が同じ文言で引いたもの。
# 事実の裏:
#   本人の投稿: X @Cristiano 2026-09-30 19:04 UTC（api.fxtwitter で本文を取得）。Instagram は A Bola・Maisfutebol の埋め込みと引用で同じ文面。
#   監督の会見（9/30 午後、コペンハーゲン）: CNN Portugal の書き起こし（20の発言）と Renascença。誤りを認めたのは「アップに行かせた時間」だけ
#     （"Aqui é que eu fiz mal. Eu devia tê-lo mandado aquecer 15 ou 20 minutos mais tarde"）。依頼文の「扱いの誤り」より狭いので、その範囲で言う。
#   連盟の声明（9/30）: A Bola・O Jogo が全文を引用。処分には触れていない。10/2 朝（日本時間）まで、処分の発表は見つからない。
#   試合: ESPN の試合記録（ウェールズ 1-0 9/24、ノルウェー 1-2 9/27、デンマーク 2-4 10/1）。ヴィティーニャの代表初ゴールは本人（Record、Sport TV）と O Jogo。
#   146得点・234試合: Sky・Maisfutebol・英語版Wikipedia。ESPN の要約に出た「243」は WebFetch の読み違いとみて使わない。
#   W杯2026: 英語版Wikipedia（Ronaldo の代表の表「W杯で5試合3得点」、Group K の試合票）・Sky（ベスト16でスペインに0-1）。ESPN 7/6 の「4試合」は記事の時点の数とみて使わない。
#   会長がノルウェー戦のあとに話す: Renascença「segundo apurou a Renascença」（報道）。監督「Depois do Dragão, vamos ver」（Maisfutebol、RTP のフラッシュ）。
# 外したもの: 首相の介入（Record→Daily Mail。題に答えない）、姉エルマの投稿、Edu Aguirre「裏切られた」（本人に近い記者の話で推測が混じる）、
#   O Jogo「もう代表に戻らない」（報道。本人は何も言っていない。引退は言わない）、7番がレオンへ（背番号は埋め草）、ホイルンドの喜び方。
# 反応: 日本1件（X、Yahoo!リアルタイム検索、ポルトガル在住の人）。@pqd9v は尺（4分36秒）のため外した。ポルトガル語の個人の投稿は、Bluesky の検索が403、ポルトガル紙の「ネットの反応」記事の埋め込みは
#   画像に頼るミームか、監督への当てこすり（事実でない含み）だったので入れていない。経緯は raw に。
# 流れの点検（Claude が自分で読んだ。控え output/flow/20261002_ronaldo_walkout.md）で直したこと:
#   ショートの前置きに「次の試合も先発しないと監督が会見で話した直後」を入れた／「誤りを1つ認めました」→「アップのさせ方については誤りを認めました」（『そこ』が何か分かるように）
#   「4試合」→「今回の代表活動の4試合」／ヴィティーニャの前置きを「ここ数日について」にし、訳を「距離を置こうとした」に（「そこ」が宙に浮く）
# 写真: 記事の写真は Maisfutebol（NurPhoto via Getty）・A Bola（IMAGO）で代理店のため使わない。Sky・ESPN も代理店の配信。
#   Commons「Cristiano Ronaldo Croatia v Portugal 2 July 2026-087.jpg」（Bryan Berlin、CC BY-SA 4.0、W杯のクロアチア戦、ポルトガル代表のユニフォーム）。
#   冒頭とサムネは頭が入る位置で 16:9 に切った _w。監督の行はジェズス（Commons 2020、CC BY 2.0）と並べた1枚。
