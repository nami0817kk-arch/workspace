  title: 'ロナウド、ポルトガル代表の合宿を去る。「時が来たら真実を話す」'
  question: ロナウドはなぜ合宿を離れ、この先の代表はどうなるのか
  opening_image: assets/images/20261002_ronaldo_w/01.jpg
  takeaway: ロナウドは代表234試合146得点で男子の最多記録を持ち、今夏のW杯でも5試合3得点。だがジェズス監督の3試合で出たのはウェールズ戦の67分だけで無得点、ポルトガルは3連勝の7点のうち6点を、ロナウドがピッチにいない2試合で取った。離れた理由を本人はまだ話しておらず、処分も決まっていない。146点の続きがあるかは、本人の言う「真実」と、会長と監督が話すとしている10月4日のノルウェー戦のあとにかかっている
