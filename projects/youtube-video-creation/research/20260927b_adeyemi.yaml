sections:
  - id: start
    heading: バルサでの出だし
    tier: 報道
    telop: 移籍金2200万ユーロ。公式戦8試合で3得点
    narrator: キャスター
    say:
      - 7月、アデイェミはドルトムントからバルセロナへ。移籍金は**2200万ユーロ**でした。
      - text: ここまで公式戦**8試合**すべてに出て、**3得点**。先発は3試合で、残りは途中から出ています。
        card: {type: table, title: 今季の3得点, columns: [日付, 相手, 結果], rows: [[8月23日, エルチェ, 5対0で勝ち], [9月9日, フェイエノールト, 5対1で勝ち], [9月13日, レバンテ, 4対2で勝ち]]}
      - ドイツ代表に合流する前、アデイェミはバルセロナでの日々を語りました。
      - いい試合ができるのは、どんなときか。
      - voice: カリム・アデイェミ
        text: 一番いい試合ができるのは、ピッチで何も考えずに、体が自然に動いているとき
      - voice: カリム・アデイェミ
        text: 何かを生み出そうとして、それがうまくいくように願っている
      - voice: カリム・アデイェミ
        text: こんなにいい仲間とプレーできて、うれしいよ
    sources:
      - https://www.bvb.de/de/de/aktuelles/news/news.html/2026/7/23/Karim-Adeyemi-wechselt-zum-FC-Barcelona.html
      - https://www.sport.es/es/noticias/barca/adeyemi-mar-dudas-chollo-verano-134512908
