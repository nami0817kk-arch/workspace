  line2: それでも本人は「まだ●●●●」
sections:
  - id: start
    heading: バルサでの出だし
    tier: 報道
    telop: 移籍金2200万ユーロ。公式戦8試合で3得点
    narrator: キャスター
    say:
      - text: 7月、アデイェミはドルトムントからバルセロナへ。移籍金は**2200万ユーロ**でした。
        image: assets/images/20260927b_adeyemi/01.jpg
      - ここまで公式戦**8試合**すべてに出て、**3得点**。先発は3試合で、残りは途中から出ています。
      - ドイツ代表に合流する前、アデイェミはバルセロナでの日々を語りました。
      - いい試合ができるのは、どんなときか。
      - voice: カリム・アデイェミ
        text: 一番いい試合ができるのは、ピッチで何も考えずに、体が自然に動いているとき
      - voice: カリム・アデイェミ
        text: いろいろ仕掛けてみて、うまくいけばいいなと思っている
      - voice: カリム・アデイェミ
        text: こんなにいい仲間とプレーできて、うれしいよ
    sources:
      - https://www.bvb.de/de/de/aktuelles/news/news.html/2026/7/23/Karim-Adeyemi-wechselt-zum-FC-Barcelona.html
      - https://www.sport.es/es/noticias/barca/adeyemi-mar-dudas-chollo-verano-134512908
      - https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/83/schedule?season=2026
      - https://www.sport.es/es/noticias/barca/adeyemi-mejores-partidos-son-pienso-134706051
  - id: fit
    main: true
    heading: まだ完全には
    tier: 報道
    telop: 「すごく気分はいい。でも、まだ完全には…」
    narrator: キャスター
    say:
      - text: 'ドルトムントからバルセロナへ移ったアデイェミ。8試合3点の本人が、暮らしを明かしました。'
        short_only: true
      - バルセロナでの暮らしについては、こう話しています。
      - voice: カリム・アデイェミ
        text: なんとも言えないな。気分は、すごく、すごくいいんだけど
      - voice: カリム・アデイェミ
        text: 何もかも落ち着いたかというと、まだそこまでは行っていない
      - voice: カリム・アデイェミ
        text: まだ完全には、ここの人間になれていないんだ
      - voice: カリム・アデイェミ
        text: これから言葉を覚えないといけない。それは僕にとって大事なこと
      - voice: カリム・アデイェミ
        text: 1、2か月で100パーセントなじむのは、やっぱり難しいよ
      - voice: カリム・アデイェミ
        text: でも本当に居心地がいい。ここでの時間が、これから楽しみだ
      - 着いてすぐ向かった場所も、明かしています。
      - voice: カリム・アデイェミ
        text: バルセロナに来て最初にしたのは、ビーチに行って、海で泳ぐこと
      - voice: カリム・アデイェミ
        text: あれが一番うれしかったな
      - voice: カリム・アデイェミ
        text: 今でもときどき行くよ。いい天気を楽しむのが一番
      - voice: カリム・アデイェミ
        text: でも、家にいるのも好きなんだ
    sources:
      - https://www.fichajes.com/a7437835356741660348-karim-adeyemi-recuerda-su-pasado-en-el-bayern
      - https://www.sport.es/es/noticias/barca/adeyemi-mejores-partidos-son-pienso-134706051
      - https://www.vermouth-deportivo.com.ar/karim-adeyemi-estuve-en-bayern-munich-por-tres-anos-y-me-echaron/
      - https://www.footmercato.net/a1371375273103104103-karim-adeyemi-se-livre-sur-ses-premiers-mois-au-barca
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「今夏最大のバーゲン」と「なぜ手放した」
    narrator: キャスター
    say:
      - voice: ネット民
        text: まじでもう既にアデイェミの虜になりつつある コイツはやべえ
      - voice: ネット民
        text: より決定力がついてムラっ気さえ無くなれば本当に覚醒する 今夏最大のバーゲンだ
        cont: true
      - voice: ネット民
        text: アデイェミ覚醒してるなぁ ちょっと寂しい
      - voice: ネット民
        text: ドルトムントほんまにありがとう、もうアデイェミは最高のWGです。 活躍できて笑かしてくれてまじで大好き
      - voice: ネット民
        text: アデイェミ、めちゃくちゃデンベレっぽい。
      - voice: ネット民
        text: でも、デンベレよりずっと多くをもたらしてくれると思う
        cont: true
      - voice: ネット民
        text: アデイェミ、プレスの掛け方がフリックバルサすぎて好き
      - voice: ネット民
        text: アデイェミがマジでなんも変わってなくてこれを活かしてるバルサ凄いなと
      - voice: ネット民
        text: （リーグの環境があってるとかもあるんだろうが）
        cont: true
      - voice: ネット民
        text: アデイェミとペドリも既に仲良しっぽいんだよな。アデイェミはスペイン語喋れるの？
        short_voice: true
