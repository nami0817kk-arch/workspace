# 取材メモ（2026年11月11日）アラン（マンC）、ブラジル代表初招集「すごく緊張している」。ハーランドから英語を勧められた話（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-11。requests（ブラウザUA）で本文を読み、site.api.espn.com で選手・試合を確かめた。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。FotMob は使っていない。
# 題材の元: サッカーキング 2226278（2026-11-10、取材・文＝三島大輔。『MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE』日本代表戦に向けた会見。全文を requests で読んだ。WebFetch は要約のみ）。
# 出典で確かめたこと:
#   ・サッカーキング: ブラジル代表FWアランが日本戦に向けた会見に登壇。マンチェスター・シティ所属。今回が念願のブラジル代表初招集。22歳。パルメイラスの育成組織出身でトップチームに昇格。**今年8月末にシティへ移籍**。精度の高い左足のキックが武器で、右サイドのアタッカーやウイングバックとしてプレー。
#       本人の言葉（日本語に訳されたもの。ポルトガル語の原文は読めていない）:
#         「ここに来ることができてとても嬉しいですし、すごく緊張しています」
#         シティでの日々は「本当に素晴らしいものです」
#         「ヴィトール・レイス、マテウス・ヌネス、ルベン・ディアスはポルトガル語が話せるので、とても助けてくれます。ハーランドも時々話しかけてくれるのですが、僕があまり（言葉を）理解していないから『英語のレッスンを受けた方がいい』と言ってきます（笑）。できるだけ早く習得しようと努力しています」
#       同じ日の会見でエンドリッキ（パルメイラス時代の同僚。年齢は2つ上だが代表歴では先輩）:「彼がブラジル代表で素晴らしい活躍をすることに期待していますし、一緒にプレーすることを楽しみにしています。僕にアシストしてくれることにも期待しているよ」。“パルメイラスホットライン”の開通に期待。
#       → 台本は日本語訳を声に出して通る形に整えたもの。意味は変えていない。「（笑）」は使わない。
#   ・ESPN（選手ID 382966「Allan Elias」、マンC・ブラジル・FW・22歳・生年月日 2004年4月19日・背番号37。マンC公式 mancity.com/players/allan の「Allan」背番号37 と一致）。
#       ※ESPN の綴りは Allan。日本の報道は「アラン」→台本も「アラン」。**同名のパルメイラスの Allan（2025年の Commons 写真の人、別人・1997年生まれ）と混ぜない**（写真はマンC公式のみ使用）。
#       ESPN gamelog＋各試合の summary rosters（自分で確かめた）: **今季のプレミアでの出場は途中出場の2試合**。10/11 マンC 3-0 リヴァプール（敵地）— 80分に交代出場（ハーランドと交代）／10/31 マンC 0-1 ブライトン（ホーム）— 79分に交代出場。ほかの試合（9/5 コヴェントリー・9/13 マンU・9/20 サンダーランド・10/17 イプスウィッチ・11/7 フォレスト）は出場なし（gamelog の一覧は6試合、うち交代出場は2試合のみ）。
#       ESPN 順位表: マンC 10試合 7勝0分3敗 勝ち点21 3位。
#   ・日程: ESPN scoreboard fifa.friendly 2026-11-14: Brazil at Japan、2026-11-14 10:15 UTC（日本時間 19:15）、Singapore National Stadium。サッカーキング（試合情報記事の見出し）も11/14・日本対ブラジル。11/17 日本対パラグアイ（サッカーキング）。
# 食い違い: ①本人の言葉は日本語訳のみ。②ESPN の綴り Allan と日本の報道「アラン」（別人と混ぜないために上に書いた）。
# 前の本との重なり: scripts にアランの回は無い（grep 済み）。11/8 の「パラグアイ・日本」は別題。エンドリッキの言葉は一覧の7番（別の下請けの担当）と同じ会見だが、ここで使うのは「アシストを期待」の一言だけ。
# 日本との接点: 14日の日本対ブラジル（シンガポール）。
