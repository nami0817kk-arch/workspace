# 取材メモ（2026年11月18日）田中碧、約2分半ノンストップで森保監督への思いを語る「心の底から世界一を取りたいと思わせてくれた」（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-18。WebFetch と requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。FotMob は使っていない。
# 題材の元: サッカーキング 2026-11-18（取材・文 三島大輔）「田中碧が約2分半ノンストップで森保一監督への想いを熱弁「日本サッカーがどれだけ成長したか」「心の底から世界一を取りたいと思わせてくれた」」（全文） https://www.soccer-king.jp/news/japan/national/20261118/2229283.html
# 出典で確かめたこと:
#   ・田中碧の言葉（サッカーキング。字は変えない。台本は読点で行に分けた）:
#       「ただ、自分が代表に入る前から日本代表を見てきて、今こうして振り返ったときに、森保さんが就任してから日本サッカーがどれだけ成長したか。個人的には過小評価されていると思います」
#       「親善試合かもしれませんけど、強豪国に勝つことができたのは大きな進歩です。もちろん、それがワールドカップではないと言われればそれまでですけど、実際にスペインやドイツにも勝っています」
#       「新たな基準、そして新たなゴールをこの8年間で作り上げてくれたという意味では、森保さんの器の大きさを感じます」
#       「これから10年、20年後に日本がワールドカップで優勝するために、一人ひとりができることをやれればいいなと思いますし、それが森保さんへの最大の恩返しになると思います」
#       「本当に心の底から世界一を取りたいと思わせてくれた監督です。次の大会なのか、10年後なのか、20年後なのかは分かりませんが、日本が世界一になることを本当に実現したいと思わせてくれました」
#     （ほかに、世界一になるための8年間だったのではないか、という発言もある：「10年後なのか、20年後なのか、あるいは次の大会なのかは分かりませんが、そのときに世界一になるための8年間だったのではないか」）
#   ・サッカーキング（地の文）: 田中は61分からピッチへ。2019年12月のEAFF E-1選手権でA代表デビュー、2021年から日本代表に定着。2021年10月のオーストラリア戦で代表初ゴール、カタールW杯のスペイン戦で逆転ゴール。約2分半にわたって指揮官への思いを語った。
#   ・ESPN の試合データ（site.api.espn.com fifa.friendly summary event=401916336、2026-11-17 13:10 UTC）: Japan 1-2 Paraguay。61' Ao Tanaka が Kodai Sano と交代で入る。→ 記事の「61分から」と一致。
#   ・来年3月から大岩剛監督の新体制（サッカーキング・ゲキサカの別記事）。
# 依頼文との違い: 依頼文は「日本0-2パラグアイ」だったが、実際は1-2（0-2 は前半終了時）。台本は1-2とだけ言う。
# 自分で数えたもの: 記事に載っている田中の発言の中で、「10年後」「20年後」の時間の物差しが出るのは3か所（世界一になるための8年間／優勝するために／世界一を取りたい）。A代表デビューの2019年12月からラストマッチまで6年11か月。
# 前の本との重なり: 20261113_tanaka_brazil_rematch（ブラジル戦の前）／20261107_tanaka_mitoma_words。→ 今回の初出: ラストマッチ後の約2分半の語り。同じ日の堂安・久保の本と同じ事実（試合の経過・福田のゴール）は入れない。
# 【言わないこと】試合の経過・福田のゴール／自分を責める言葉（「自分がもっと世界的に見てもいい選手になれば」の部分。本人を小さく見せるため使わない）／ブラジル戦の話。
# 本人の言葉: あり（田中碧。サッカーキング）。Y。
# 反応: 0件（作らない。approve は --no-voices）。
