    image: assets/images/20261031_manager_tuchel/01_w.jpg
    card: none
  - text: 相手に合わせて形を変える。ついた呼び名は、戦術のカメレオンです。
    image: assets/images/20261031_manager_tuchel/02_w.jpg
    emph: true
    callword: カメレオン
    card: none
