# 監督紹介：トゥヘル（10/31 土、シリーズ「監督紹介」、key: manager_tuchel、型は news）。9節の型（2026-10-20 決定）。見本は 20261029_manager_ferguson。
# 順：フック→基礎DATA→日本との接点（基礎DATAの次）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-31 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。
#   トゥヘルを主役にした回は無い（posted.json に「トゥヘル」0件）。scripts は脇役の名前（イングランド代表の紹介・ケインの記録・トレント・クロアチア戦・マインツのクラブ紹介など）。
#   covered.yaml は試合・記録のニュースで別題。既出の監督紹介：グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ベンゲル・ファーガソン。
#
# **いまの立場（一次情報で確かめた）**：イングランド代表監督。
#   ○ イングランドサッカー協会（FA）公式 2026-02-12「Thomas Tuchel extends England stay to EURO 2028」＝2028年の欧州選手権まで契約を延長（研究控え research/raw/20261031_fa_ext.txt）。
#   ○ 同日のFA公式インタビュー（research/raw/20261031_fa_int.txt）。本人の言葉はここから。
#   ○ FA公式 2026-10-05「Tuchel: Kane hitting 'highest level'」の見出し下に「The England head coach」。FA の記事一覧に 2026-10-30「Squad announcement details for England's November games」＝10/31 の時点で現職。
#
# **通算（台本とサムネをそろえる）**＝英語版 Wikipedia「Managerial record by team and tenure」（updated: match played 6 October 2026。10/6 以降にイングランド代表の試合は無い＝FA の一覧で確認）。
#   **トップチームのみ**（アウグスブルクII＝34試合20勝8分6敗は下部の2軍なので除く。2026-10-20 の決まり）。
#   マインツ 184試合 72勝46分66敗／ドルトムント 107試合 67勝23分17敗／PSG 127試合 95勝13分19敗／チェルシー 100試合 60勝24分16敗／バイエルン 61試合 37勝8分16敗／イングランド代表 26試合 20勝2分4敗。
#   合計 605試合 351勝 116分 138敗（表の Career total 639−34 と、各行の足し算で一致）。勝率（自分で割った）：合計58.0%、マインツ39.1%、ドルトムント62.6%、PSG74.8%、チェルシー60.0%、バイエルン60.7%、代表76.9%。
#   ※本文の「マインツ182試合 39.56%」「ドルトムント108試合」「PSG 75.6%」は表と食い違う。**台本は表の値で自分で割ったものだけ**を使い、本文の勝率は使わない。
#   タイトル（Honours から自分で数えた、トップチームの監督として）：ドルトムント DFBポカール2016-17＝1／PSG リーグ・アン2回（2018-19・2019-20）・クープ・ドゥ・フランス2019-20・クープ・ドゥ・ラ・リーグ2019-20・トロフェ・デ・シャンピオン2018・2019＝6／チェルシー CL2020-21・UEFAスーパーカップ2021・クラブW杯2021＝3／バイエルン ブンデスリーガ2022-23＝1 → 合計11。リーグ優勝は3回（リーグ・アン2＋ブンデス1）。代表は2026年W杯3位（タイトルには数えない）。
#   在任の長さ（表の From/To から自分で割った。代表は 2025-01-01〜2026-10-31）：マインツ 4.8年（1742日）／ドルトムント 1.9年／PSG 2.6年／チェルシー 1.6年／バイエルン 1.2年／代表 1.8年。1年あたりのタイトル：PSG 6÷2.61＝2.3、チェルシー 3÷1.61＝1.9。
#
# **基礎**：1973-08-29 西ドイツ・バイエルン州クルンバッハ生まれ（53歳）。DF、通算77試合3得点（Stuttgarter Kickers 8-1／SSV Ulm 69-2）。1998年、25歳でひざの軟骨のけがで引退→2000年までバー勤め。
#   2000 VfBシュトゥットガルトの育成コーチ（ラルフ・ラングニック採用）、U19で2004-05にリーグ優勝。2007-08 アウグスブルクII。2009 マインツ（1年目9位・2年目5位・13位・13位・7位）。
#   2015-04-19 ドルトムント就任発表、2017-05-30 退任。2018-05 PSG、2020-12-24 退任。2021-01-26 チェルシー就任（ドイツ人初）、2022-09-07 退任。2023-03-24 バイエルン、2024-05-18 退任。2025-01-01 イングランド代表。
#   CL：PSGで2020年に決勝（クラブ初）、チェルシーで2021年に優勝（5/29、ポルト、マンCに1-0）、バイエルンで2024年に準決勝。「ドイツ人の監督で3つの違うクラブでCL準決勝へ」は Wikipedia 本文（first German coach to reach that stage with three different clubs）。
#   2026年W杯：8試合（6勝…イングランド側の記録は team_england を参照）、3位決定戦でフランスに6-4、準決勝はアルゼンチンに1-2。1966年以来の最高成績。
#
# **日本との接点（サッカーの縁だけ）**：
#   ・岡崎慎司：2013-07-01 マインツ加入（岡崎の英語版）、2013-14 ブンデス15得点（トゥヘルの英語版「scoring 15 goals in the Bundesliga, a record for a Japanese player」。Sky Sports の試合記事も「日本人のシーズン最多」と書く）。マインツはその季7位でEL出場権。トゥヘルの最後のシーズン。
#   ・香川真司：2014-08-31 ドルトムント復帰、契約は2018-06-30まで（香川の英語版）＝トゥヘル在任（2015-17）と重なる。トゥヘルの英語版は 4-2-3-1 で相手の列の間に入る選手として香川・ムヒタリアン・オーバメヤンを挙げる。**出場試合数は確かめていない＝言わない。**
#   ・2026-03-31 ウェンブリー（KIRIN WORLD CHALLENGE 2026）日本1-0イングランド、三笘薫23分。**research/20261025_team_england.yaml で JFA（4/1 日本時間）と ESPN で確認済み**。トゥヘルの代表の負けは26試合で4（表）。
#
# **戦術の色**＝2021-05-29 CL決勝（ポルト）チェルシー1-0マンチェスター・シティ、ハヴァーツ42分、マウントのパス（英語版「2021 UEFA Champions League final」の Summary と Football box）。
#   チェルシー先発：メンディ／アスピリクエタ・ティアゴ・シウバ（39分に負傷交代でクリステンセン）・リュディガー／ジェームズ・チルウェル（ウイングバック）／ジョルジーニョ・カンテ／ハヴァーツ・マウント／ヴェルナー。シティは後半の立ち上がりを支配。
#   就任からのチェルシー：14試合負けなし、**1,260分で2失点**（Tuchel の英語版）。3-4-2-1。「Tactical chameleon」の呼び名（同）。
#
# **本人の言葉**＝FA公式インタビュー（2026-02-12、research/raw/20261031_fa_int.txt。英語の原文を訳した）：
#   ①"It was me in the beginning that wanted a short-term contract only for 18 months because I was not sure what's coming in international football... But very soon, I fell in love with the job and the role"
#   ②2021年（チェルシー監督のころ）、ウェンブリーでの欧州選手権の熱気を感じて、マネージャーに電話した："wow, this is my dream – I want to win as many titles as possible with Chelsea and then let's try to become English national coach" → 返事は"this will not happen, that's not very likely to happen!" → "I'm very sure that he was wrong and we could prove him wrong."
#
# **マル秘話**（英語版 Tuchel の本文）：2008 アウグスブルクIIでナーゲルスマンを指導（けがの多い選手だった彼にスカウトを命じ、のちに監督へ）。2023 バイエルンで後任（"replacing his former player Julian Nagelsmann"）。
#   2009 マインツの育成年代と山を自転車で登り、クラブのバッジを埋めて「U19が決勝に進んだら掘り出す」と約束→掘り出した。守備の練習でテニスボールを持たせる。ハンドボールのクラブと約1か月練習。アーチェリーやキックボクシングの練習も取り入れた。
#
# **入れなかったもの**：離婚・家族・私生活・健康・各クラブとの対立と解任の経緯・審判への批判と罰金・選手との口論・「厳しすぎる」という批判・イングランド起用の賛否・ケインのバロンドール・ニュースの反応・女子・お金。
