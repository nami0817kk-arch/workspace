- id: words
  heading: 本人は、代表監督になる夢をどう語ったのか
  tier: 報道
  telop: トゥヘルの言葉。2026年2月12日
  narrator: 解説
  card: &words_doc
    type: document
    label: トゥヘルの言葉（訳）2026年2月12日 FA公式インタビュー
    paragraphs:
    - 最初に18か月の短い契約を望んだのは、私のほうだった。
    - でも、すぐにこの仕事に恋をした。
    - チェルシーで多くのタイトルを取って、そのあと代表の監督を目指そう。
    highlight:
    - 恋をした
    - 代表の監督を目指そう
  say:
  - text: 本人の言葉です。イングランド代表との契約を延ばした日の、公式インタビュー。
    image: assets/images/20261031_manager_tuchel/06_w.jpg
    card: *words_doc
  - voice: トゥヘル
    text: 最初に18か月の短い契約を望んだのは、私のほうだった。
  - voice: トゥヘル
    text: 代表で何が待っているのか、分からなかったからだ。
    cont: true
  - voice: トゥヘル
    text: でも、すぐにこの仕事に恋をした。
    cont: true
    pause: 0.5
  - text: 代表の監督は、チェルシー時代からの夢でした。
    image: assets/images/20261031_manager_tuchel/01_w.jpg
    card: *words_doc
  - text: 2021年、ウェンブリーの欧州選手権の熱気を感じて、
    card: *words_doc
  - text: マネージャーに電話したといいます。
    card: *words_doc
  - voice: トゥヘル
    text: これが私の夢だ。
  - voice: トゥヘル
    text: チェルシーでできるだけ多くのタイトルを取って、
    cont: true
  - voice: トゥヘル
    text: そのあとイングランド代表の監督を目指そう、と。
    cont: true
    pause: 0.5
  - text: 返ってきたのは、「それは起こりそうにない」という言葉。
    image: assets/images/20261031_manager_tuchel/01_w.jpg
    card: *words_doc
  - voice: トゥヘル
    text: 彼が間違っていたと、私たちは証明できると確信している。
    pause: 0.5
  quotes_from:
