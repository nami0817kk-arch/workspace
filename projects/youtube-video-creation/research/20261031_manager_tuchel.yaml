  - text: トゥヘルらしさが出たのが、2021年5月、チャンピオンズリーグの決勝です。
    image: assets/images/20261031_manager_tuchel/06_w.jpg
    card: *style_doc
  - text: 相手はマンチェスター・シティ。トゥヘルは、最終ラインに3人を置きました。
    card: *style_doc
  - text: 両サイドのジェームズとチルウェルが、攻めにも守りにも走ります。
    card: *style_doc
  - text: 前半42分、マウントのパスから、ハヴァーツが決めました。
    image: assets/images/20261031_manager_tuchel/06_w.jpg
    card: *style_doc
  - text: 後半はシティに押し込まれても、1対0で勝ち切ります。
    emph: true
    card: none
