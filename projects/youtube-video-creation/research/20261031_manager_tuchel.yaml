- id: style
  heading: 最終ラインに3人のチェルシーは、決勝でどう勝ったのか
  tier: 報道
  telop: 戦術の色。2021年、マンチェスター・シティとの決勝
  narrator: 解説
  card: &style_doc
    type: document
    label: 2021年5月29日 チャンピオンズリーグ決勝（ポルト）
    paragraphs:
    - チェルシーは最終ラインに3人。両サイドにジェームズとチルウェル。
    - 前半42分、マウントのパスからハヴァーツが決める。
    - 後半はシティが押し込む。それでも1対0で守り切った。
