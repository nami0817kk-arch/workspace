  sources:
  - https://www.englandfootball.com/articles/2026/Feb/12/thomas-tuchel-england-mens-head-coach-contract-extension-interview-20261202
- id: secret
  heading: 数字の外にある話。山にバッジを埋めた日
  tier: 背景
  telop: ナーゲルスマン、山のバッジ、テニスボール
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [2008年, 教え子にのちの監督ナーゲルスマン]
    - [2009年, クラブのバッジを山に埋める]
    - [マインツ時代, 守備の練習でテニスボール]
    - [マインツ時代, ハンドボールのクラブと練習]
    highlight_row: 0
    source: 英語版Wikipedia
  say:
  - text: 次は、数字の外の話を。
    image: assets/images/20261031_manager_tuchel/05_w.jpg
    card: none
  - text: 2008年、アウグスブルクのセカンドチームに、のちの監督ナーゲルスマンがいました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: けがの多かった彼に、相手の分析を任せたのがトゥヘルです。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: そのナーゲルスマンの後任として、2023年にバイエルンの監督になりました。
    emph: true
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 2009年、マインツの育成年代の選手と、山へ自転車で登った日。
    image: assets/images/20261031_manager_tuchel/05_w.jpg
    card:
      <<: *sec_table
      highlight_row: 1
  - text: クラブのバッジを山に埋めて、決勝に進んだら掘り出す、と約束します。
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 結果は決勝進出。トゥヘルは、バッジを掘り出しました。
    emph: true
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 守備の練習では、選手にテニスボールを持たせました。余計な反則を減らすためです。
    image: assets/images/20261031_manager_tuchel/02_w.jpg
    card:
      <<: *sec_table
      highlight_row: 2
  - text: マインツの選手が、ハンドボールのクラブと1か月近く練習したこともあります。
    card:
      <<: *sec_table
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Thomas_Tuchel
- id: view
  viewpoint: true
  heading: 見立て・短い時間で結果を出す監督は、代表で何を残せるのか
  tier: 背景
  telop: 在任はマインツの4.8年だけが長い。代表は2028年まで
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（在任の長さとタイトル）
    columns: [所属, 在任（年）, タイトル]
    rows:
    - [マインツ, '4.8', '0']
    - [ドルトムント, '1.9', '1']
    - [パリ, '2.6', '6']
    - [チェルシー, '1.6', '3']
    - [バイエルン, '1.2', '1']
    - [イングランド代表, '1.8', '0']
    highlight_row: 0
  say:
  - text: 見立てです。トゥヘルの仕事を、在任の長さとタイトルで並べました。
    image: assets/images/20261031_manager_tuchel/01_w.jpg
    card: *view_table
  - text: 5年近く続いたのは、マインツだけです。
    card:
      <<: *view_table
      highlight_row: 0
  - text: ほかは、1年あまりから3年足らず。
    card:
      <<: *view_table
      highlight_row: 3
  - text: その短い時間で、パリでは6つ、チェルシーでは3つのタイトルを取りました。
    emph: true
    mark: {kind: circle, row: 2, col: 2}
    card:
      <<: *view_table
      highlight_row: 2
  - text: 1年あたりに直すと、パリが2.3個、チェルシーが1.9個です。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 代表との契約どおりなら、およそ3年半。
    image: assets/images/20261031_manager_tuchel/06_w.jpg
    card: none
  - text: マインツ以来の、長い仕事になります。
    card: none
  - text: 11月は、12日にクロアチア、15日にスペインとの試合が待っています。
    image: assets/images/20261031_manager_tuchel/01_w.jpg
    card: none
  - text: 短い時間で形を作る監督が、3年半をどう使うのか。そこが見どころだと見ています。
    card: none
