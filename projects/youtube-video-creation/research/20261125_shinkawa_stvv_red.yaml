    say:
      - text: シント＝トロイデンの19歳、新川志音。
      - text: 21日のシャルルロワ戦で、一発退場になりました。
      - text: 前半20分過ぎ、新川のスパイクの裏が、相手のアキレス腱のあたりに入りました。
        image: assets/images/20261125_shinkawa_stvv_red/03_w.jpg
      - text: 主審はビデオ判定の助言で映像を見直し、レッドカードを出しました。
      - text: 普通の速さで見れば警告ほどに見えた、という声もあり、判定には賛否が分かれました。
      - text: ベルギーの元審判、セルジュ・グミエニは、この場面をこう見ています。
        image: assets/images/20261125_shinkawa_stvv_red/02_w.jpg
      - voice: グミエニ
        text: 新川のファウルは、わざとではありません。
        image: assets/images/20261125_shinkawa_stvv_red/03_w.jpg
      - voice: グミエニ
        text: 不運でした。それでも、レッドカードは正しい判定です。
        image: assets/images/20261125_shinkawa_stvv_red/02_w.jpg
        emph: true
      - voice: グミエニ
        text: 球際に全力で行くなら、
        cont: true
      - voice: グミエニ
        text: 選手はボールを蹴りにいかなければいけません。
        cont: true
      - text: もともと新川は、カードの少ない選手です。
        image: assets/images/20261125_shinkawa_stvv_red/02_w.jpg
      - text: この退場が、ベルギーでの13試合で初めてのカードでした。
        image: assets/images/20261125_shinkawa_stvv_red/02_w.jpg
        card: {type: table, title: 新川志音 受けたカード, columns: [所属, 試合, カード], rows: [[サガン鳥栖, 35試合, 警告1], [シント＝トロイデン, 13試合, 退場1]], highlight_row: 1}
      - text: サガン鳥栖でも、35試合で警告は1枚だけです。
