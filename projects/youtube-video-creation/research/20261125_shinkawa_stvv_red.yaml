# 自分で数えたもの: STVVが10人だった時間＝25分の退場から57分のハリフィ退場まで32分。そのあとは10人対10人。
# 本人の言葉: 新川本人の試合後の言葉は見つからなかった（STVV公式のニュース一覧・Voetbalkrant・Voetbalbelgie・HBVL/Nieuwsblad の見出しを当たった。HBVL・Nieuwsblad は 403 で本文は読めず。本人のX・Instagramはブラウザの道具を使わない決まりで見ていない）。
