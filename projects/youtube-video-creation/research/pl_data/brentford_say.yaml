story: history
# **流れの点検（output/flow/20260920_pl04_brentford.md）を受けて直した**（2026-09-22）。
# 本拠地の名前を最後まで言っていなかった／1万7250人はオープニングで読んでいる／
# 基礎DATAで「昇格プレーオフに勝って」と答えを先に読んでから物語を始めていた
data:
- 創立は**1889年**。ボートを漕ぐクラブの仲間たちが作りました。
- 愛称は「ビーズ」。蜂です。
- 場所は西ロンドン、テムズ川沿いの町です。
- 本拠地はブレントフォード・コミュニティ・スタジアム。2020年に移ってきました。
- オーナーはマシュー・ベンハム。2012年からクラブを持っています。
- 大きなタイトルはまだありません。プレミアに上がったのも、2021年が初めてです。
- プレミアでの最高位は、2022年から23年の**9位**です。
# トニーは「2部の1シーズン最多得点の記録」が一息で取れないので数字（31点）で言う。
# 「クラブを初めてプレミアへ」は3回目の言い直しだったので落とした
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目＝誰か（来歴）、2行目＝決定的な場面、3行目＝残したもの。各行45字まで。
# トニーの昇格プレーオフ決勝（スウォンジーに2対0）は「歩んできた道」で読むので、ここでは出さない
legends:
- - ケヴィン・オコナーはブラックバーン生まれ。1995年に育成組織へ入り、16シーズンで**501試合**。
  - 2004年から主将として200試合以上。4部優勝も2部への昇格も、腕章を巻いて迎えました。
  - 2015年、契約中のまま殿堂入り。引退後もコーチとしてクラブに残りました。
- - イヴァン・トニーは2020年、ピーターバラから加入。移籍金はおよそ**500万ポンド**でした。
  - 1年目の2020年から21年に2部で**31得点**。1シーズンの得点として、いまも2部の記録です。
  - 2024年8月、**4000万ポンド**でサウジアラビアのアル・アハリへ移りました。
- - ブライアン・エンベウモは2019年、トロワから当時のクラブ最高額**580万ポンド**で加入。
  - リーグ戦で222試合65得点。2024年から25年には、プレミアで**20得点**を挙げました。
  - 2025年7月、マンチェスター・ユナイテッドへ。移籍金は**6500万ポンド**と報じられました。
legend_sources:
- - https://en.wikipedia.org/wiki/Kevin_O%27Connor_(footballer,_born_1982)
- - https://en.wikipedia.org/wiki/Ivan_Toney
- - https://en.wikipedia.org/wiki/Bryan_Mbeumo
legend_rows:
- - ケヴィン・オコナー
  - 1999-2015
  - 16年在籍・501試合
- - イヴァン・トニー
  - 2020-2024
  - 2部で1シーズン31得点の記録
- - ブライアン・エンベウモ
  - 2019-2025
  - プレミアで20得点

