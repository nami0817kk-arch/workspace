# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。オープニングの直後に読み、ショートもここから切る。
# 3対0の2試合は今季の節のカード（season_card）にある。欧州出場はクラブ史上まだ無い。
# 「この順位を保てば」は今季の節で読むので、ここは「このまま行けば」
reasons:
- "開幕**5試合**を負けなしで走り、いまは**4位**にいます。"
- "トッテナムとチェルシーを、どちらも3対0で退けました。"
- "このまま行けば、クラブ史上初めて欧州の舞台に立てます。"
reasons_telop: 開幕5戦負けなしで4位
reasons_rows:
- ["理由1", "開幕5試合負けなしで4位"]
- ["理由2", "トッテナムとチェルシーに3対0"]
- ["理由3", "保てばクラブ史上初の欧州"]
