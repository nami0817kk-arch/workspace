story: history
data:
- 創立は**1889年**。ボートを漕ぐクラブの仲間たちが作りました。
- 本拠地のスタジアムには、1万7250人が入ります。
- 場所は西ロンドン、テムズ川沿いの町です。
- オーナーはマシュー・ベンハム。2012年からクラブを持っています。
- 大きなタイトルはまだありません。いちばん大きな一歩は2021年、昇格プレーオフに勝って初めてプレミアに上がったことです。
- プレミアでの最高位は、2022年から23年の**9位**です。
- 愛称は「ビーズ」。蜂です。
legends:
- ケヴィン・オコナーは16シーズン在籍し、**501試合**に出た主将です。
- イヴァン・トニーは、2部の1シーズン最多得点の記録を作り、クラブを初めてプレミアへ上げました。
- ブライアン・エンベウモは6年在籍し、2024年から25年にはプレミアで**20得点**を挙げています。
legend_rows:
