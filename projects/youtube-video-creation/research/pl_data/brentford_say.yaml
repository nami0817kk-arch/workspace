story: history
# **流れの点検（output/flow/20260920_pl04_brentford.md）を受けて直した**（2026-09-22）。
# 本拠地の名前を最後まで言っていなかった／1万7250人はオープニングで読んでいる／
# 基礎DATAで「昇格プレーオフに勝って」と答えを先に読んでから物語を始めていた
data:
- 創立は**1889年**。ボートを漕ぐクラブの仲間たちが作りました。
- 本拠地はブレントフォード・コミュニティ・スタジアム。2020年に移ってきました。
- 場所は西ロンドン、テムズ川沿いの町です。
- オーナーはマシュー・ベンハム。2012年からクラブを持っています。
- 大きなタイトルはまだありません。プレミアに上がったのも、2021年が初めてです。
- プレミアでの最高位は、2022年から23年の**9位**です。
- 愛称は「ビーズ」。蜂です。
# トニーは「2部の1シーズン最多得点の記録」が一息で取れないので数字（31点）で言う。
# 「クラブを初めてプレミアへ」は3回目の言い直しだったので落とした
legends:
- ケヴィン・オコナーは16シーズン在籍し、**501試合**に出た主将です。
- イヴァン・トニーは、2部で1シーズン**31得点**。いまも2部の記録です。
- ブライアン・エンベウモは6年在籍し、2024年から25年にはプレミアで**20得点**を挙げています。
legend_rows:
- - ケヴィン・オコナー
  - 1999-2015
  - 16年在籍・501試合
- - イヴァン・トニー
  - 2020-2024
  - 2部で1シーズン31得点の記録
- - ブライアン・エンベウモ
  - 2019-2025
  - プレミアで20得点

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 5, 6]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "収容**1万7250人**。20クラブで2番目に小さいスタジアム。"

# 「跳ね返された」が何にかは基礎DATAまで来ないと分からなかった（2026-09-22）。
# 昇格プレーオフと言い切って、ショートの頭で閉じる
hook: 昇格プレーオフで9回続けて負けたクラブが、いまプレミアにいます。

# **サムネが本編で言っていないことを約束していた**（2026-09-21）。
# 旧台本から引き継いだ文字が、落とした節を指していた
thumbnail:
  line1: "9回続けて負けた、その10回目"
  line2: "ブレントフォード"

# 「代表で」が5人続いた後の「リーグ戦で88試合」は代表の数に聞こえた（2026-09-22）
squad_about:
  ケヴィン・シャーデ: ケヴィン・シャーデはブレントフォードのリーグ戦で**88試合**。
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ。
# 2021年の昇格の直後に100年戻るので、節の頭に橋を1行置く。
# 「昇格できなかった」はどこからどこへかが無く、直前の1部昇格と混ざるので「3部から」
episode:
  id: episode
  heading: ホーム全勝でも昇格なし
  tier: 背景
  telop: ホーム21戦全勝。それでも2位
  narrator: 解説
  card:
    type: table
    title: ホーム全勝でも昇格なし
    columns:
    - ''
    - ''
    rows:
    - - 1929-30年 ホーム
      - 21試合21勝
    - - イングランド記録
      - いまも破られていない
    - - 順位
      - 3部で2位。上がれるのは1位だけ
  say:
  - 昇格に届かなかった年は、ほかにもあります。
  - 1929年から30年のシーズン、ホームのリーグ戦**21試合に全部勝ちました**。
  - ホーム全勝は、いまもイングランドの記録です。
  - それでも3部から上がれませんでした。順位は2位。上がれるのは1位だけだったからです。
  sources:
