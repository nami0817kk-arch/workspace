# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 冒頭の直後に置き、ショートもここから切る。事実は今季のシーズン記事（Howe が7月31日に退任、
# Jaissle は8月に就任）と本人の記事（1988年4月5日生まれ＝38歳）、last_season.json（昨季12位）、
# standings.json（第5節で2勝2分1敗）。**2025年のリーグカップはここで言わない**
