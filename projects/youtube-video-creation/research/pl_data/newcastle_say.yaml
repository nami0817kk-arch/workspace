# "It's a club I love and I don't want them to go down. I'll do everything I can to stop that."）。
# ショートの16秒以内に出すので2行目
reasons:
- ハウが去り、**38歳**のヤイスレの1年目。降格危機の2009年に監督を引き受けたシアラーの言葉です。
- {voice: アラン・シアラー, text: "「愛するクラブだ。落ちてほしくない。できることは全部やる」"}
- 昨季は**12位**。今季は開幕から5試合で負けが1つだけと、滑り出しは上々です。
- "待っていたのは新しいオーナー。2021年に代わって、4年後にリーグカップを獲りました。"
