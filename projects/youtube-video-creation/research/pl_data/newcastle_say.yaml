story: drought
data:
- 創立は**1881年**。1892年に今の名前になりました。
- 愛称は「マグパイズ」。カササギです。白と黒の縞から来ています。
- ホームタウンは、ニューカッスル・アポン・タインです。
# 2026-09-22 流れの点検。買収の年と日付はクラブの話の節で言う（二度読みをやめる）
- 本拠地はセント・ジェームズ・パーク。**5万2729人**が入ります。
# 2026-09-22 2回目。FAカップ6回は冒頭の一言で読むので、ここでは受けるだけ。
# 「直近のタイトル」の行は落とした。サムネと引きで伏せた「56年待って獲ったもの」の答えを、
# クラブの話の節の1分前に読んでしまうため（板の項目だが承知のうえ。data_focus も合わせた）
- オーナーは、サウジアラビアの公共投資基金。
- 1部リーグの優勝は**4回**。FAカップはさきほどの6回。
- リーグカップとフェアーズカップが1回ずつ。インタートトカップも1回です。
- プレミアでの最高位は2位。1995年から96年と、その翌年の2回です。
# 2026-09-22 流れの点検。「49年間」は誰の記録か（ミルバーン）、
# 「エンターテイナーズ」は基礎DATAの2位の時代だと繋ぐ
# 2026-09-22 2回目。ミルバーンが誰か（1950年代のエース）を添えた
# 2026-09-22 3回目。指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。試合数は infobox＝リーグ戦のみ
legends:
- - アラン・シアラーは地元生まれのフォワード。世界最高額の**1500万ポンド**で帰ってきました。
  - 2006年の201点目で、1950年代のエース、ミルバーンの記録を**49年ぶり**に抜きました。
  - クラブ史上最多の**206得点**。タイトルは獲れませんでしたが、スタジアムの前に銅像があります。
- - シェイ・ギヴンは、アイルランド代表で**134試合**のキーパー。ブラックバーンから来ました。
  - '**150万ポンド**で加入し、リーグ戦で354試合。年間ベストイレブンにも2度選ばれました。'
  - 2009年にマンチェスター・シティへ。クラブの最多出場記録まで、あと**34試合**でした。
- - ロブ・リーは、チャールトンから来た中盤。「ロンドンに近い」とキーガン監督に口説かれました。
  - 2位になった年の11月、リーグの月間最優秀選手に選ばれています。
  - 主将も務め、リーグ戦で**303試合**44得点。2019年にはクラブの殿堂入りを果たしました。
legend_sources:
