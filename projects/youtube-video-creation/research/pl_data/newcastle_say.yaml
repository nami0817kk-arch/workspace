story: drought
data:
- 創立は**1881年**。1892年に今の名前になりました。
- 本拠地はセント・ジェームズ・パーク。**5万2729人**が入ります。
- オーナーはサウジアラビアの公共投資基金。2021年からクラブを持っています。
- 1部リーグの優勝は**4回**。FAカップ6回、リーグカップ1回、ヨーロッパのタイトルが1回あります。
- 直近のタイトルは、2024年から25年のリーグカップです。
- プレミアでの最高位は2位。1995年から96年と、その翌年の2回です。
- 愛称は「マグパイズ」。カササギです。白と黒の縞から来ています。
legends:
- アラン・シアラーは、クラブ史上最多の**206得点**。49年間破られなかった記録を塗り替えました。
- シェイ・ギヴンは、12年間ゴールを守り続けたキーパーです。
- ロブ・リーは、「エンターテイナーズ」と呼ばれたチームの中心として10年在籍しました。
legend_rows:
