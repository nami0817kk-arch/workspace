story: trophy
why:
- 冨安健洋は、日本代表**46試合**のディフェンダー。
- 鎌田大地は日本代表**53試合**。このクラブでリーグ戦**66試合**を戦っています。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- プロのクラブとしての創立は**1905年**。起源は1861年のアマチュアクラブです。
- 愛称は「イーグルス」。鷲です。
- ホームタウンは南ロンドンの、クロイドン区セルハーストです。
- 本拠地はセルハースト・パーク。**2万5194人**が入ります。
- オーナーは、アメリカンフットボールのニューヨーク・ジェッツの会長、ウッディ・ジョンソン。2025年にクラブを買いました。
- 1部リーグの優勝はありませんが、FAカップを1回、そしてカンファレンスリーグを1回獲っています。
- その優勝が昨季です。決勝でスペインのラージョ・バジェカーノを1対0で破りました。
- 1部での最高位は、1990年から91年の**3位**。プレミアリーグができる前です。
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=誰か、2行目=決定的な試合や記録、3行目=残したもの。裏は各選手の Wikipedia
legends:
- - ウィルフリード・ザハは8歳から下部組織にいた、クロイドン育ちの生え抜きです。
  - 2013年、マンチェスター・ユナイテッドへ**1000万ポンド**で移り、2015年に戻りました。
  - プレミアで挙げた**68得点**はクラブ最多。2023年、18年いたクラブを離れました。
- - フリアン・スペローニは、2004年にダンディーから来たアルゼンチン人のキーパーです。
  - 2013年の昇格プレーオフ決勝は、ワトフォードに1対0。無失点でプレミア昇格を決めました。
  - 年間最優秀選手に4回。キーパーとしてクラブ最多の、リーグ戦**371試合**に出ました。
- - アンドリュー・ジョンソンは2002年、バーミンガムとの選手交換で加わったフォワードです。
  - 2003年から04年は2部で**32得点**。ウェストハムを1対0で破り、プレミアへ昇格しました。
  - 翌シーズンはプレミアで**21得点**。2006年、860万ポンドでエヴァートンへ移りました。
legend_sources:
