story: trophy
why:
- 日本代表の冨安健洋と鎌田大地、2人の日本人が所属しているクラブです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1905年**。本拠地は南ロンドンのセルハースト・パーク、2万5194人が入ります。
- オーナーは、アメリカンフットボール、ニューヨーク・ジェッツの会長ウッディ・ジョンソン。2025年にクラブを買いました。
- 1部リーグの優勝はありませんが、FAカップを1回、そしてヨーロッパのタイトルを1回獲っています。
- そのヨーロッパのタイトルが、昨季のカンファレンスリーグ優勝です。
- 当時の1部での最高位は、1990年から91年の**3位**です。
- 愛称は「イーグルス」。鷲です。
legends:
- ウィルフリード・ザハは、クラブのプレミアリーグ最多得点者。10年以上、チームの切り札でした。
- フリアン・スペローニは15年在籍し、クラブの年間最優秀選手に**4回**選ばれたキーパーです。
- アンドリュー・ジョンソンは、2004年から05年にプレミアで**21得点**。イングランド人で最多でした。
legend_rows:
- - ウィルフリード・ザハ
  - 2010-2023
  - クラブのプレミア最多得点
- - フリアン・スペローニ
