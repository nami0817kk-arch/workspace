# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 「タイトルを獲った」は120年の節と重なったので「優勝」にした。
# 日本人の入口（why）はここに吸収。裏は Takehiro Tomiyasu（46試合・2026年8月7日にアヤックスからフリー）、
# Daichi Kamada（53試合・FAカップ／コミュニティ・シールド／カンファレンスリーグ）、
# 2026–27 Crystal Palace F.C. season（今季はヨーロッパリーグ）
# **本人の言葉を1つ**（2026-09-22）。スペローニが2017年、クラブ400試合目のあとに言った言葉。
# 原文（Julián Speroni の記事）: "I am only 38 and for a goalkeeper that is not too bad and
# I must say that at this time I feel better than ever"
reasons:
- 冨安健洋は日本代表**46試合**、鎌田大地は**53試合**。2人が同じクラブにいます。
- 名キーパー、スペローニが38歳のときの言葉です。
- {voice: フリアン・スペローニ, text: 38歳はキーパーなら悪くない。いまが一番いい状態だ}
- 鎌田大地は優勝を**3回**経験、冨安健洋は今夏に加入。**2年**続けて優勝し、今季はヨーロッパリーグです。
