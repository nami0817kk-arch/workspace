# このクラブの特徴（2026-09-23 指示「三つの要素入れたい！」）。プレーの色・運営の型・クラブの気質。
# 出典は英語版Wikipedia とクラブ公式。要確認は research/pl_data/features_notes.md
features:
- 新監督はピエール・サージュ、降格圏のリヨンを6位に、ランスを2位に引き上げてきた立て直し役。
- 安く獲って高く売る型、オリセは800万ポンドで獲り、3年後に約5000万ポンドでバイエルンへ。
- 1964年から試合前に流れる「グラッド・オール・オーバー」、勝てば試合後にもう一度流れます。
