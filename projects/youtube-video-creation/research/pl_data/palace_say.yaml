story: trophy
why:
- 冨安健洋は、日本代表**46試合**のディフェンダー。
- 鎌田大地は日本代表**53試合**。このクラブでリーグ戦**66試合**を戦っています。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- プロのクラブとしての創立は**1905年**。起源は1861年のアマチュアクラブです。
- 本拠地はセルハースト・パーク。**2万5194人**が入ります。
- ホームタウンは南ロンドンの、クロイドン区セルハーストです。
- オーナーは、アメリカンフットボールのニューヨーク・ジェッツの会長、ウッディ・ジョンソン。2025年にクラブを買いました。
- 1部リーグの優勝はありませんが、FAカップを1回、そしてカンファレンスリーグを1回獲っています。
- その優勝が昨季です。決勝でスペインのラージョ・バジェカーノを1対0で破りました。
- 1部での最高位は、1990年から91年の**3位**。プレミアリーグができる前です。
- 愛称は「イーグルス」。鷲です。
legends:
- ウィルフリード・ザハは、クラブのプレミアリーグ最多得点者。10年以上、チームの切り札でした。
- フリアン・スペローニは15年在籍し、クラブの年間最優秀選手に**4回**選ばれたキーパーです。
- アンドリュー・ジョンソンは、2004年から05年にプレミアで**21得点**。そのシーズンのイングランド人では最多でした。
legend_rows:
- - ウィルフリード・ザハ
  - 2010-2023
  - クラブのプレミア最多得点
- - フリアン・スペローニ
  - 2004-2019
  - 年間最優秀選手4回のGK
- - アンドリュー・ジョンソン
  - 2002-2006
  - プレミアで21得点

