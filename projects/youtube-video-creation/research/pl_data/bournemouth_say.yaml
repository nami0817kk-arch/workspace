story: history
data:
- 創立は**1899年**。前身はボスコム・セント・ジョンズ・インスティチュートです。
- 愛称は「ザ・チェリーズ」。さくらんぼです。
- 本拠地はディーン・コート。**1万2357人**。マンチェスター・ユナイテッドの**6分の1**です。
- 町はイングランド南部、ドーセット州の海沿いです。
- オーナーはアメリカのビル・フォーリー。2022年に買収。**1億ポンド超**と報じられました。
- 共同オーナーには、ハリウッド俳優の**マイケル・B・ジョーダン**もいます。
- 1部の優勝も、FAカップも、リーグカップもゼロ。20クラブで3つとも無いのは**5クラブ**です。
- それが昨季、**6位**。クラブ史上最高の順位でした。
legends:
- カラム・ウィルソンはリーグ**20得点**。クラブ初のプレミア昇格を決めました。
- ライアン・フレイザーは2018年から19年に**14アシスト**。リーグ戦で183試合です。
- ブレット・ピットマンはリーグ戦で**267試合96得点**。勝ち点17を引かれた季も、2部を制した季もいました。
legend_rows:
- - カラム・ウィルソン
  - 2014-2020
  - 初のプレミア昇格の得点源
- - ライアン・フレイザー
  - 2013-2020
  - 1季14アシスト。リーグ183試合
- - ブレット・ピットマン
  - 2005-2015
  - リーグ267試合96得点。どん底も優勝も
# **宿敵の節は3つに割る**（2026-09-20）。9行を1枚のカードで通すと49秒、
# 同じ絵のまま出っぱなしになった（上限20秒）。中身は 2026-09-16 の台本のまま、
# 手がかり2つでカードを割った。**サウサンプトンの話にリーズの行を出さない**
rival_sections:
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 名前の付いた宿敵が、記録に残っていない
    narrator: 解説
    card:
      type: table
      title: 宿敵をめぐる記録
      columns: ["", ""]
      rows:
        - ["ダービーの呼び名", "記事に無い"]
        - ["その由来", "記事に無い"]
        - ["手がかり", "2つ"]
    say:
      - "このクラブには、**名前の付いた宿敵がいません。**"
      - ダービーの呼び名も、その由来も、記事には書かれていないのです。
      - 手がかりは2つあります。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival2
    heading: 手がかり①　サウサンプトン
    tier: 背景
    telop: サポーターが挙げたのはサウサンプトン
    narrator: 解説
    card:
      type: table
      title: 手がかり①　2019年8月の調査
      columns: ["", ""]
      rows:
        - ["サポーターが挙げた相手", "サウサンプトン"]
        - ["理由", "残っていない"]
        - ["そのクラブ", "今季のプレミアリーグにいない"]
    say:
      - ひとつは2019年8月の調査。ボーンマスのサポーターが最大のライバルに挙げたのは、サウサンプトンでした。
      - ただし理由までは残っていません。しかもサウサンプトンは、今季のプレミアリーグにいません。
      - もうひとつがリーズ・ユナイテッドです。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival3
    heading: 手がかり②　リーズ
    tier: 背景
    telop: 1990年5月5日、この街で起きたこと
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
    say:
      - 1990年5月5日、メーデーの連休中に、リーズのサポーターがこの街で大規模な暴動と破壊を起こしました。
      - "記事はこれを「最も激しい因縁」と書いています。ただしこの一文には、**出典を求める印が付いたまま**です。"
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival4
    heading: 手がかり②　リーズ（つづき）
    tier: 背景
    telop: そのリーズは、今季もプレミアリーグにいる
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
        - ["リーズ", "今季もプレミアリーグにいる"]
    say:
      - そのリーズは、今季もプレミアリーグにいます。
