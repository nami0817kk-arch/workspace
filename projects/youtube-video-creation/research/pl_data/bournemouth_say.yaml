story: history
data:
- 創立は**1899年**。前身はボスコム・セント・ジョンズというクラブです。
- 本拠地はディーン・コート。収容は1万2357人と、プレミアでもかなり小さなスタジアムです。
- ホームタウンは、イングランド南部ドーセット州の海沿いの町ボーンマス。
- オーナーはアメリカのビル・フォーリー。2022年からクラブを持っています。
- 1部リーグの優勝もカップのタイトルも、まだありません。直近のタイトルは2014年から15年の2部優勝です。
- そのかわり、昨季はプレミアリーグで**6位**。クラブ史上最高の順位で、初めてヨーロッパへの切符をつかみました。
- 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
legends:
- スティーヴ・フレッチャーは、クラブ史上最多の**726試合**に出場した選手です。
- カラム・ウィルソンは、2014年から15年にリーグ20得点。クラブ初のプレミア昇格を決めました。
- エディ・ハウは選手として長くプレーし、のちに監督として、4部にいたクラブを**プレミアまで**連れていきました。
