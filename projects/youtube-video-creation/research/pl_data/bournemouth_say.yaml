story: history
# **流れの点検（output/flow/20260920_pl01_bournemouth.md）を受けて直した**（2026-09-22）。
# 「5クラブです」→「それが昨季6位」は主語が5クラブに聞こえる／前身の15文字の
# カタカナは何も残らない／ユニフォームの話は逸話の節から愛称の隣へ
# 3回目（2026-09-22）: 読み上げにアルファベットを残さない（AC→イタリアの、B→ビー）／
# ウィルソンの「リーグ20得点」は2部／4部残留から2015年の2部優勝へ飛んでいたので段を置く／
# 欧州の初戦は「クラブ史上初の欧州の試合」という事実に戻す（白星の言い直しをやめる）
data:
- 創立は**1899年**。ボスコムという地区のクラブが前身です。
- 愛称は「ザ・チェリーズ」。さくらんぼです。赤と黒の縦じまは、イタリアのミランが手本です。
- 町はイングランド南部、ドーセット州の海沿いにあります。
- 本拠地はディーン・コート。**1万2357人**。マンチェスター・ユナイテッドの**6分の1**です。
- オーナーはアメリカのビル・フォーリー。2022年に買収。**1億ポンド超**と報じられました。
- 共同オーナーには、ハリウッド俳優の**マイケル・ビー・ジョーダン**もいます。
- 1部の優勝も、FAカップも、リーグカップもゼロ。20クラブで3つとも無いのは**5クラブ**です。
- そのボーンマスが昨季、**6位**。クラブ史上最高の順位でした。
# 順番は ピットマン → ウィルソン → フレイザー（2026-09-22）。ピットマンの行は
# 直前の「歩んできた道」を受けるので、先に置くと時系列が一本になる。
# 「季」は合成音声が「き」と読むので使わない
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目＝誰か（来歴）、2行目＝決定的な場面、3行目＝残したもの。各行45字まで。
# ウィルソンとフレイザーは同じ日（2020年9月7日）にニューカッスルへ移っている。
# 「ニューカッスルへ」で2行を終えると8字の言い直しで止まるので、片方は「同じ日に」で受ける
legends:
- - ブレット・ピットマンはジャージー島の出身。ボーンマス相手に4点を奪って、入団が決まりました。
  - 2009年から10年は**26得点**。5月1日、ポート・ヴェイルに4対0で勝ち、3部へ上げました。
  - 2部を制した2014年から15年にも13得点。リーグ戦で通算**267試合96得点**です。
- - カラム・ウィルソンはコヴェントリーから来た1年目、2部で**20得点**。初昇格の得点源です。
  - 2015年8月、プレミア初戦のウェストハム戦でハットトリック。アウェーで4対3の勝ち。
  - ボーンマスの選手として初めてイングランド代表で得点。2020年、ニューカッスルに移りました。
- - ライアン・フレイザーは2013年、スコットランドのアバディーンから来た左ウイングです。
  - 2016年12月、リヴァプールに4対3で勝ち。途中から出て1点を決め、1点を演出しました。
  - 2018年から19年は7得点**14アシスト**。2020年、ウィルソンと同じ日にニューカッスルへ。
legend_sources:
- - https://en.wikipedia.org/wiki/Brett_Pitman
- - https://en.wikipedia.org/wiki/Callum_Wilson
- - https://en.wikipedia.org/wiki/Ryan_Fraser
legend_rows:
- - ブレット・ピットマン
  - 2005-2015
  - リーグ267試合96得点。どん底も優勝も
- - カラム・ウィルソン
  - 2014-2020
  - 2014-15に2部で20得点。初昇格を決めた得点源
- - ライアン・フレイザー
  - 2013-2020
  - 1シーズン14アシスト。リーグ183試合
# **宿敵の節は3つに割る**（2026-09-20）。9行を1枚のカードで通すと49秒、
# 同じ絵のまま出っぱなしになった（上限20秒）。中身は 2026-09-16 の台本のまま、
# 手がかり2つでカードを割った。**サウサンプトンの話にリーズの行を出さない**
rival_sections:
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 名前の付いた宿敵が、記録に残っていない
    narrator: 解説
    card:
      type: table
      title: 宿敵をめぐる記録
      columns: ["", ""]
      rows:
        - ["ダービーの呼び名", "記事に無い"]
        - ["その由来", "記事に無い"]
        - ["手がかり", "2つ"]
    say:
      - "このクラブには、**名前の付いた宿敵がいません。**"
      - ダービーの呼び名も、その由来も、記事には書かれていないのです。
      - 手がかりは2つあります。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival2
    heading: 手がかり①　サウサンプトン
    tier: 背景
    telop: サポーターが挙げたのはサウサンプトン
    narrator: 解説
    card:
      type: table
      title: 手がかり①　2019年8月の調査
      columns: ["", ""]
      rows:
        - ["サポーターが挙げた相手", "サウサンプトン"]
        - ["理由", "残っていない"]
        - ["そのクラブ", "今季のプレミアリーグにいない"]
    say:
      - ひとつは2019年8月の調査。ボーンマスのサポーターが最大のライバルに挙げたのは、サウサンプトンでした。
      - ただし理由までは残っていません。しかもサウサンプトンは、今季のプレミアリーグにいません。
      - もうひとつがリーズ・ユナイテッドです。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival3
    heading: 手がかり②　リーズ
    tier: 背景
    telop: 1990年5月5日、この街で起きたこと
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
    say:
      - 1990年5月5日、メーデーの連休中に、リーズのサポーターがこの街で大規模な暴動と破壊を起こしました。
      - "記事はこれを「最も激しい因縁」と書いています。ただしこの一文には、**出典を求める印が付いたまま**です。"
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival4
    heading: 手がかり②　リーズ（つづき）
    tier: 背景
    telop: そのリーズは、今季もプレミアリーグにいる
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
        - ["リーズ", "今季もプレミアリーグにいる"]
    say:
      - そのリーズは、今季もプレミアリーグにいます。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth

# **歩んできた道も3つに割る**（2026-09-20）。6行を1枚のカードで通すと39秒だった。
# 中身は 2026-09-15 の台本のまま。カードは読み上げている年のことだけを出す。
# 2026-09-22: 「話は、消えかけたところから」はオープニングの言い直しなので落とした。
# 「リーグは」はプレミアと聞こえるので「フットボールリーグ」。ハウの就任年（2009年）を
# 置かないと「6年後の2015年」の起点が無く、2015年の昇格を率いたのが誰かも言っていなかった
story_sections:
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 2008年、このクラブは消えかけた
    narrator: 解説
    card:
      type: table
      title: 2008年に起きたこと
      columns: ["", ""]
      rows:
        - ["借金", "約400万ポンド"]
        - ["リーグの構え", "参加を認めないと通告"]
        - ["認めた条件", "勝ち点マイナス17（4部）"]
    # 節の頭に実写を1枚（2026-09-22）。この物語の主役エディ・ハウ（2015年の昇格パレード）。
    # 出典は assets/images/pl_bournemouth_story/credits.json
    say:
      - {text: "2008年、借金は**400万ポンド**。クラブは倒産寸前でした。", image: assets/images/pl_bournemouth_story/scene.jpg}
      - フットボールリーグは、参加そのものを認めないと言いました。
      - 認めた条件が**勝ち点マイナス17**。当時は4部です。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: history2
    heading: 31歳の監督
    tier: 背景
    telop: 引き受けたのは、31歳のエディ・ハウ
    narrator: 解説
    card:
      type: table
      title: 31歳の監督
      columns: ["", ""]
      rows:
        - ["エディ・ハウ", "2009年、31歳で就任"]
        - ["当時", "フットボールリーグで最も若い監督"]
    say:
      - 2009年、監督を引き受けたのが**31歳のエディ・ハウ**。
      - 当時、フットボールリーグで最も若い監督でした。
      - それでも、4部に残りました。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
      - https://en.wikipedia.org/wiki/Eddie_Howe
  - id: history3
    heading: そこから18年
    tier: 背景
    telop: 2015年に初昇格、そして初の欧州へ
    narrator: 解説
    card:
      type: table
      title: そこから18年
      columns: ["", ""]
      rows:
        - ["2015年", "ハウの下でクラブ史上初の1部昇格"]
        - ["昨季", "リーグ6位・勝ち点57"]
        - ["同じ年", "クラブ史上初の欧州出場"]
    say:
      - そこから3部、2部と上がっていきます。
      - 6年後の2015年、ハウの下で2部を制して**初めて1部**へ。
      - そして昨季、**初めてヨーロッパの切符**をつかみました。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
      - https://en.wikipedia.org/wiki/Eddie_Howe

# サムネの文字。旧台本の「FAカップで1人9得点」は、作り直した台本に出てこない
thumbnail:
  line1: 勝ち点17を引かれた
  line2: そこから18年で、初の欧州へ

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 4, 5, 8]

# **今季の欧州を足した**（2026-09-21）。冒頭で「いまヨーロッパで戦っています」と
# 言っておきながら、最後はプレミアの順位で終わっていた。**引きを回収していない**
# 2026-09-22: 「2対1」だけでは勝ったのか負けたのか分からない。原文
# （2026–27 Real Sociedad season: Real Sociedad 1–2 Bournemouth、9月17日）で勝ちを確認
season:
- ヨーロッパリーグの初戦は、久保建英のいるレアル・ソシエダでした。
- アウェーで**2対1**の勝ち。クラブの歴史で初めての、欧州の試合でした。

# **「タイトルは1つもない」は誤りだった**（2026-09-21 に原文で確認）。1983-84 に
# EFLトロフィー（Associate Members' Cup）、1986-87 に3部優勝を獲っている。
# 正しいのは「1部・FAカップ・リーグカップの優勝が無い」。板も直した
# **お金の話を入れる**（2026-09-21 ユーザー選択）。買収額と、クラブ最高額の移籍金。
# 共同オーナーのマイケル・B・ジョーダンは、その行だけ顔写真に切り替える
screens:
  5: assets/photos/pl/bournemouth_owner_07f09a4e.jpg
squad_about:
  エヴァニウソン: エヴァニウソンは**クラブ最高額の4020万ポンド**で加入しました。

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "プレミアリーグで、いちばん小さなスタジアム。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ。
# ユニフォームの行は「ひとりで9点」と関係が無いので、基礎DATAの愛称の隣へ移した
episode:
  id: episode
  heading: ひとりで9点
  tier: 背景
  telop: FAカップで11対0。うち9点はひとりで
  narrator: 解説
  card:
    type: table
    title: ひとりで9点
    columns:
    - ''
    - ''
    rows:
    - - 1971年11月 FAカップ
      - マーゲイトに11対0
    - - テッド・マクドゥーガル
      - ひとりで9点
  # 節の頭に実写を1枚（2026-09-22）。その試合が行われた旧ディーン・コート（1982年の写真）。
  # マクドゥーガル本人の自由に使える写真は Commons に無い
  say:
  - {text: "1971年11月、FAカップでマーゲイトに**11対0**で勝ちました。", image: assets/images/pl_bournemouth_episode/scene.jpg}
  - そのうち**9点**を、フォワードのテッド・マクドゥーガルがひとりで決めています。
  sources:
  - https://en.wikipedia.org/wiki/AFC_Bournemouth
# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
manager:
- 今季の監督は、ドイツ人のマルコ・ローゼ。**2026年6月**に来た1年目です。
- 前はライプツィヒ。リヴァプールへ去ったイラオラの後任です。
manager_telop: 監督はマルコ・ローゼ。1年目
manager_rows:
- - 監督
  - マルコ・ローゼ（ドイツ）
- - 就任
  - 2026年6月・1年目
- - 前職
  - ライプツィヒ
manager_sources:
- https://en.wikipedia.org/wiki/Marco_Rose
# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。オープニングの直後に読み、ショートもここから切る。
# 引き「いまヨーロッパで戦っています」と同じ言い方をしない（8字の言い直しで止まる）。
# 欧州の初戦（久保建英のレアル・ソシエダに2対1）は今季の節で読むので、ここは予告だけ
# **本人の言葉を1つ**（2026-09-22）。ショートは16秒までに誰かの言葉が要る。
# 新監督ローゼの原文（英語版 Wikipedia "Managerial style"）:
# "We want to be very active against the ball, sprint a lot."
reasons:
- "創立から**127年**、欧州の大会に出るのは今季が初めてです。"
- "今夏に来た監督のマルコ・ローゼは、こう言っています。"
- {voice: マルコ・ローゼ, text: "「ボールに対して、とても積極的に。たくさん走りたい」"}
- "欧州の初戦は、久保建英が所属するクラブに勝ちました。"
reasons_telop: 創立127年で初めての欧州
reasons_rows:
- ["理由1", "創立127年で初の欧州の舞台"]
- ["理由2", "新監督ローゼ「たくさん走りたい」"]
- ["理由3", "初戦で久保建英のクラブに勝利"]
reasons_sources:
- https://en.wikipedia.org/wiki/Marco_Rose
people_extra:
- マルコ・ローゼ
# 題（2026-09-22 指示「タイトルをもっと視聴者が見たいと思うものに」）
title: マイナス17の勝ち点から欧州へ。ボーンマスに何があったのか
short_title: ボーンマスに何があったのか
# このクラブの特徴（2026-09-23 指示「三つの要素入れたい！」）。プレーの色・運営の型・クラブの気質。
# 出典は英語版Wikipedia とクラブ公式。要確認は research/pl_data/features_notes.md
features:
- ボールを奪いに走り、奪ったら最短距離でゴールへ向かう、走るサッカーです。
- 若手を安く獲って高く売る型で、ハイセンは1年でレアル・マドリードへ5000万ポンド。
- 愛称チェリーズの由来は、さくらんぼ色のシャツとも、球場の隣にあった桜桃の木とも言われます。
features_telop: 奪って走る。買って売る
features_rows:
- - プレーの色
  - 奪ったら最短でゴールへ
- - 運営の型
  - 若手を安く獲り高く売る
- - クラブの気質
  - さくらんぼ色のシャツが由来
features_sources:
- https://en.wikipedia.org/wiki/Marco_Rose
- https://en.wikipedia.org/wiki/Dean_Huijsen
- https://en.wikipedia.org/wiki/AFC_Bournemouth
