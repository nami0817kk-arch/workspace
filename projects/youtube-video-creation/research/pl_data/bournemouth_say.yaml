story: history
data:
- 創立は**1899年**。前身はボスコム・セント・ジョンズというクラブです。
- 本拠地はディーン・コート。収容は1万2357人と、プレミアでもかなり小さなスタジアムです。
- ホームタウンは、イングランド南部ドーセット州の海沿いの町ボーンマス。
- オーナーはアメリカのビル・フォーリー。2022年からクラブを持っています。
- 1部リーグの優勝もカップのタイトルも、まだありません。直近のタイトルは2014年から15年の2部優勝です。
- そのかわり、昨季はプレミアリーグで**6位**。クラブ史上最高の順位で、初めてヨーロッパへの切符をつかみました。
- 愛称は「ザ・チェリーズ」。さくらんぼ、という意味です。
legends:
- スティーヴ・フレッチャーは、クラブ史上最多の**726試合**に出場した選手です。
- カラム・ウィルソンは、2014年から15年にリーグ20得点。クラブ初のプレミア昇格を決めました。
- エディ・ハウは選手として長くプレーし、のちに監督として、4部にいたクラブを**プレミアまで**連れていきました。
legend_rows:
- - スティーヴ・フレッチャー
  - 1992-2013
  - クラブ最多の726試合出場
- - カラム・ウィルソン
  - 2014-2020
  - 初のプレミア昇格の得点源
- - エディ・ハウ
  - 選手・監督
  - 4部からプレミアへ導いた
# **宿敵の節は3つに割る**（2026-09-20）。9行を1枚のカードで通すと49秒、
# 同じ絵のまま出っぱなしになった（上限20秒）。中身は 2026-09-16 の台本のまま、
# 手がかり2つでカードを割った。**サウサンプトンの話にリーズの行を出さない**
rival_sections:
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 名前の付いた宿敵が、記録に残っていない
    narrator: 解説
    card:
      type: table
      title: 宿敵をめぐる記録
      columns: ["", ""]
      rows:
        - ["ダービーの呼び名", "記事に無い"]
        - ["その由来", "記事に無い"]
        - ["手がかり", "2つ"]
    say:
      - "このクラブには、**名前の付いた宿敵がいません。**"
      - ダービーの呼び名も、その由来も、記事には書かれていないのです。
      - 手がかりは2つあります。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival2
    heading: 手がかり①　サウサンプトン
    tier: 背景
    telop: サポーターが挙げたのはサウサンプトン
    narrator: 解説
    card:
      type: table
      title: 手がかり①　2019年8月の調査
      columns: ["", ""]
      rows:
        - ["サポーターが挙げた相手", "サウサンプトン"]
        - ["理由", "残っていない"]
        - ["そのクラブ", "今季のプレミアリーグにいない"]
    say:
      - ひとつは2019年8月の調査。ボーンマスのサポーターが最大のライバルに挙げたのは、サウサンプトンでした。
      - ただし理由までは残っていません。しかもサウサンプトンは、今季のプレミアリーグにいません。
      - もうひとつがリーズ・ユナイテッドです。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival3
    heading: 手がかり②　リーズ
    tier: 背景
    telop: 1990年5月5日、この街で起きたこと
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
    say:
      - 1990年5月5日、メーデーの連休中に、リーズのサポーターがこの街で大規模な暴動と破壊を起こしました。
      - "記事はこれを「最も激しい因縁」と書いています。ただしこの一文には、**出典を求める印が付いたまま**です。"
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: rival4
    heading: 手がかり②　リーズ（つづき）
    tier: 背景
    telop: そのリーズは、今季もプレミアリーグにいる
    narrator: 解説
    card:
      type: table
      title: 手がかり②　1990年5月5日
      columns: ["", ""]
      rows:
        - ["メーデーの連休中", "リーズのサポーターが街で暴動"]
        - ["記事の書き方", "最も激しい因縁"]
        - ["ただし", "出典を求める印が付いたまま"]
        - ["リーズ", "今季もプレミアリーグにいる"]
    say:
      - そのリーズは、今季もプレミアリーグにいます。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth

# **歩んできた道も3つに割る**（2026-09-20）。6行を1枚のカードで通すと39秒だった。
# 中身は 2026-09-15 の台本のまま。カードは読み上げている年のことだけを出す
story_sections:
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 2008年、このクラブは消えかけた
    narrator: 解説
    card:
      type: table
      title: 2008年に起きたこと
      columns: ["", ""]
      rows:
        - ["経営破綻", "2008年から2009年にかけて"]
        - ["罰則", "勝ち点17の剥奪"]
    say:
      - このクラブの物語は、消えかけたところから始まります。
      - 2008年から2009年にかけて経営破綻に追い込まれ、リーグの倒産規定に従わなかったとして勝ち点17を差し引かれました。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
  - id: history2
    heading: 31歳の監督
    tier: 背景
    telop: 引き受けたのは、31歳のエディ・ハウ
    narrator: 解説
    card:
      type: table
      title: 31歳の監督
      columns: ["", ""]
      rows:
        - ["エディ・ハウ", "31歳で就任"]
        - ["当時", "フットボールリーグで最も若い監督"]
    say:
      - ここで監督を引き受けたのが、31歳のエディ・ハウです。フットボールリーグで最も若い監督でした。
      - それでもボーンマスは落ちませんでした。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth
      - https://en.wikipedia.org/wiki/Eddie_Howe
  - id: history3
    heading: そこから18年
    tier: 背景
    telop: 2015年に初昇格、そして初の欧州へ
    narrator: 解説
    card:
      type: table
      title: そこから18年
      columns: ["", ""]
      rows:
        - ["2015年", "クラブ史上初の1部昇格"]
        - ["昨季", "リーグ6位・勝ち点57"]
        - ["同じ年", "クラブ史上初の欧州出場"]
    say:
      - 6年後の2015年、チャンピオンシップを制して、クラブ史上はじめてイングランドの1部に上がります。
      - そして昨季はリーグ6位、勝ち点57。クラブ史上はじめて、ヨーロッパの舞台への出場権をつかみました。
    sources:
      - https://en.wikipedia.org/wiki/AFC_Bournemouth

