story: munich
# 2026-09-22 流れの点検。サムネの「操車場」を本文で言う。改名の年は逸話の節に任せる。
# 収容人数は冒頭の一言で読むので、ここでは1910年の話にする。ホームタウンは1行で足りる
data:
- 創立は**1878年**。鉄道の操車場で働く人たちの、ニュートン・ヒースというチームでした。
- 愛称は「レッド・デビルズ」。赤い悪魔です。
- ホームタウンは、マンチェスターです。
- 本拠地はオールド・トラッフォード。1910年から使っています。
- オーナーはアメリカのグレイザー家。2024年からは、イネオスという会社のラトクリフ氏も出資しています。
- 1部リーグの優勝は**20回**。FAカップは13回、チャンピオンズリーグは3回獲っています。
- ヨーロッパリーグ1回、カップウィナーズカップ1回、スーパーカップ1回、クラブワールドカップは2回です。
- 2021年2月には、サウサンプトンに**9対0**。プレミアで最も大きな点差の勝利に並ぶ記録です。
- 直近のタイトルは、2023年から24年のFAカップ。
# 2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。チャールトンの1968年は1958年の節で言うので触れない
legends:
- - ライアン・ギグスは、**14歳**の誕生日に入団した左ウイング。リーグ優勝を13度経験しました。
  - 1999年のFAカップ準決勝アーセナル戦。延長で自陣から守備陣を抜き去った一撃は有名です。
  - クラブ史上最多の**963試合**に出場。引退した2014年には、暫定の監督も務めました。
- - ウェイン・ルーニーは、18歳でエヴァートンから来たフォワード。移籍金は**2560万ポンド**。
  - 2011年のマンチェスター・ダービー。オーバーヘッドの決勝点で、シティに**2対1**の勝ちです。
  - チャールトンを抜いたクラブ史上最多の**253得点**。2017年、古巣エヴァートンへ戻りました。
- - ポール・スコールズはサルフォード生まれの生え抜き。1994年の初出場で、いきなり**2得点**。
  - 2008年のチャンピオンズリーグ準決勝。バルセロナに**1対0**、その1点を決めました。
  - リーグ優勝は**11回**で、イングランド人の最多。生涯このクラブだけでプレーしました。
legend_sources:
- - https://en.wikipedia.org/wiki/Ryan_Giggs
- - https://en.wikipedia.org/wiki/Wayne_Rooney
- - https://en.wikipedia.org/wiki/Paul_Scholes
