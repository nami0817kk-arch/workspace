# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 解散寸前で生まれた名前
  tier: 背景
  telop: 借金2670ポンド、解散命令から
  narrator: 解説
  card:
    type: table
    title: 解散寸前で生まれた名前
    columns:
    - ''
    - ''
    rows:
    - - 1902年1月
      - 借金2670ポンド。解散の命令
    - - 主将スタッフォード
      - 実業家4人が500ポンドずつ出資
    - - 1902年4月24日
      - マンチェスター・ユナイテッド誕生
  say:
  # 2026-09-22 流れの点検。1968年から66年さかのぼる合図（まだニュートン・ヒースだった）と、
  # 当時の金額の目安（Wikipedia の「2025年の28万ポンド相当」）を足した
  - '**1902年**1月、まだニュートン・ヒースだったクラブは、2670ポンドの借金で解散の命令を受けました。'
  - いまのお金でおよそ28万ポンド、日本円で数千万円の借金です。
  # 2026-09-22 2回目。4人×500＝2000 が借金2670に足りなく聞こえた。借金の返済ではなく
  # 出資（Wikipedia: each invested £500 in return for a direct interest in running the club）
  - 主将のハリー・スタッフォードが、地元の実業家を4人見つけます。
  - 4人が500ポンドずつ出資し、クラブの経営を引き受けました。
  - その年の4月24日、マンチェスター・ユナイテッドという名前が生まれました。
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
