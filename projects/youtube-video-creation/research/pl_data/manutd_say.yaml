story: munich
data:
- 創立は**1878年**。ニュートン・ヒースという名前で始まり、1902年に今の名前になりました。
- 本拠地はオールド・トラッフォード。**7万4158人**が入る、プレミアで一番大きなスタジアムです。
- オーナーはアメリカのグレイザー家。2024年からは、イネオスのラトクリフ氏も出資しています。
- 1部リーグの優勝は**20回**。FAカップは13回、チャンピオンズリーグは3回獲っています。
- 直近のタイトルは、2023年から24年のFAカップです。
- 2021年2月には、サウサンプトンに**9対0**。プレミアで最も大きな点差の勝利に並ぶ記録です。
- 愛称は「レッド・デビルズ」。赤い悪魔です。
legends:
- ライアン・ギグスは、クラブ史上最多の**963試合**に出場。13度のリーグ優勝を経験しました。
- ウェイン・ルーニーは、ボビー・チャールトンを抜いたクラブ史上最多の**253得点**。
- ポール・スコールズは、1999年の3冠を含む黄金期を20年支えた中盤の要です。
legend_rows:
- - ライアン・ギグス
  - 1990-2014
  - クラブ最多の963試合
- - ウェイン・ルーニー
  - 2004-2017
  - クラブ最多の253得点
- - ポール・スコールズ
  - 1993-2013
  - 3冠を支えた中盤

