# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 冒頭の直後に置き、ショートもここから切る。事実は今季のシーズン記事（2026–27 season: 
# first appearance in the Champions League since 2023–24、Carrick permanent head coach）と
# last_season.json（昨季3位）、standings.json（第5節で12位）。あとの節と同じ文・数字は読まない
# 本人の言葉を1つ（2026-09-22 指示）。原文は Matt_Busby の記事
# （Real Madrid の誘いを断って "Manchester is my heaven"）。ショートの16秒以内に出すので2行目
reasons:
- '**3シーズンぶり**のチャンピオンズリーグ。この舞台を初めて制した監督、マット・バズビーの言葉があります。'
- {voice: マット・バズビー, text: "「マンチェスターは、私の天国だ」"}
- 監督は、かつて主将も務めたマイケル・キャリック。今季から正式な監督です。
- 昨季は**3位**。ところが今季は開幕から足踏みが続き、順位表の真ん中にいます。
