# アストン・ヴィラの読み上げ（2026-09-21）。
# **見本として手で書いた 20260919_pl03_villa.yaml の文をそのまま移した。**
# ほかの19クラブと同じ仕組みで組み直すため（板の明るいタイル・地図・顔写真・
# 主将と代表歴が、ヴィラだけ入っていなかった）。
# 2026-09-22: 流れの点検（output/flow/20260920_pl03_villa.md）を受けて直した。
# 入口は引きの言い直しだったので、鈴木のこと（リーグ戦の出場数は <key>_raw.json）を言う。
# 「今季はチャンピオンズリーグにも出る」の約束は今季の節の末尾（season）で回収する
story: history
why:
  - "鈴木彩艶は今夏、イタリアのパルマから加わりました。移籍金は**2560万ポンド**。"
  - "リーグ戦はここまで**4試合**でゴールを守っています。今季はチャンピオンズリーグにも出るクラブです。"
# 「1874年」はオープニングで読んでいるので、創立の行は中身だけ。
# 「世界で初めてのリーグ」の引きをショートの中で閉じるため、リーグ創設の話を1文で受ける。
# 2026-09-22（3回目）: 「14年後」は本編だと起点の1874年まで戻れないので、年（1888年）で言う。
# 数字はここで1回だけ読み、歩んできた道の1行目からは年を落とした。
# 国内タイトル → 欧州タイトル → 128ゴールの順（「ヨーロッパの大会でも」の「も」が隣の行を受ける）。
# 欧州の2つのタイトルは「歩んできた道」で詳しく読むので、ここは板の字だけ
data:
  - "礼拝堂に集まった青年4人が始めたクラブ。1888年には、世界初のリーグを作る側に回ります。"
  - 愛称は「ヴィランズ」。「ライオンズ」とも呼ばれます。
  - 本拠地はヴィラ・パーク。4万3205人が入ります。
  - "1部リーグの優勝は**7回**。FAカップ7回、リーグカップ5回。"
  - "1930年から31年には、1シーズンで**128ゴール**。いまもイングランド1部の最多記録です。"
  - ヨーロッパは、チャンピオンズリーグとヨーロッパリーグを1回ずつ。
  - スーパーカップとインタートトカップも、1回ずつ獲っています。
  - プレミアリーグでの最高位は、初年度1992年から93年の2位です。
data_focus: [0, 1, 3, 5, 6, 7, 7, 8]
# 順番は アグボンラホー → ワトキンス → グリーリッシュ（2026-09-22）。
# 「アグボンラホーの記録を抜いた」を1人目の直後に置けば「誰の記録？」が消える
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目＝誰か（来歴）、2行目＝決定的な場面、3行目＝残したもの。各行45字まで。
# ワトキンスは 2026-08-30 にアル・ヒラルへ移った（Wikipedia の infobox は 2020–2026）
legends:
  - - ガブリエル・アグボンラホーは地元生まれ。2006年のデビュー戦で、いきなり得点しました。
    - 2008年、マンチェスター・シティ戦で7分間に3点。史上3番目に速いハットトリックです。
    - プレミアで**74得点**。長くクラブの最多記録でした。リーグ戦は341試合、在籍は17年です。
  - - オリー・ワトキンスはブレントフォードから当時のクラブ最高額、**2800万ポンド**で加入。
    - 初得点は2020年10月、王者リヴァプールに7対2で勝った試合。ハットトリックでした。
    - 2025年5月、アグボンラホーの記録を抜いてプレミア最多に。2026年8月、アル・ヒラルへ。
  - - ジャック・グリーリッシュは**6歳**で育成組織に入り、2014年、18歳でデビューしました。
    - 2019年、23歳で主将に。プレーオフ決勝でダービーを2対1で下し、3年ぶりにプレミアへ。
    - "2021年、**1億ポンド**でマンチェスター・シティへ。イングランド人では史上最高額でした。"
legend_sources:
  - - https://en.wikipedia.org/wiki/Gabriel_Agbonlahor
  - - https://en.wikipedia.org/wiki/Ollie_Watkins
  - - https://en.wikipedia.org/wiki/Jack_Grealish
    - https://en.wikipedia.org/wiki/2019_EFL_Championship_play-off_final
legend_rows:
  - - ガブリエル・アグボンラホー
    - 2005-2018
    - プレミア74得点。長くクラブ最多
  - - オリー・ワトキンス
    - 2020-2026
    - アグボンラホーを抜きプレミア最多に
  - - ジャック・グリーリッシュ
    - 2013-2021
    - 6歳から育成組織。1億ポンドでシティへ
