# アストン・ヴィラの読み上げ（2026-09-21）。
# **見本として手で書いた 20260919_pl03_villa.yaml の文をそのまま移した。**
# ほかの19クラブと同じ仕組みで組み直すため（板の明るいタイル・地図・顔写真・
# 主将と代表歴が、ヴィラだけ入っていなかった）。
story: history
why:
  - 日本代表のゴールキーパー、鈴木彩艶が今夏、イタリアのパルマからヴィラに加わりました。
  - "移籍金は**2,560万ポンド**。今季はチャンピオンズリーグにも出るクラブです。"
  - では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
  - "創立は**1874年**。礼拝堂に集まっていた青年4人が立ち上げました。"
  - 本拠地はヴィラ・パーク。4万3205人が入ります。
  - "1部リーグの優勝は**7回**。FAカップ7回、リーグカップ5回。"
  - "ヨーロッパでは1982年にチャンピオンズカップ、そして昨季は**ヨーロッパリーグ**を獲りました。"
  - "1930年から31年には、1シーズンで**128ゴール**。いまもイングランド1部の最多記録です。"
  - プレミアリーグでの最高位は、初年度1992年から93年の2位です。
  - 愛称は「ヴィランズ」。「ライオンズ」とも呼ばれます。
data_focus: [0, 1, 4, 5, 6, 7, 8]
legends:
  - 地元出身のガブリエル・アグボンラホーは、プレミアリーグで74得点。長くクラブの最多記録でした。
  - "ジャック・グリーリッシュは**6歳**でヴィラに入り、主将まで務めました。2021年、**1億ポンド**でマンチェスター・シティへ。"
  - アグボンラホーの記録を抜いたのが、オリー・ワトキンス。2025年5月のことでした。
legend_rows:
  - - ガブリエル・アグボンラホー
    - 2005-2018
    - プレミア74得点。長くクラブ最多
  - - ジャック・グリーリッシュ
    - 2013-2021
    - 6歳で入団。1億ポンドでシティへ
  - - オリー・ワトキンス
    - 2020-2026
    - アグボンラホーを抜きプレミア最多に
hook: 世界で初めてのリーグを作ったクラブに、日本代表の守護神が加わりました。
