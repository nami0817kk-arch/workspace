story: fall
data:
- 創立は**1880年**。教会のチーム、セント・マークスから、1894年に今の名前になりました。
- 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
# 2026-09-22 流れの点検2回目: 同じオーナーが「シティ・フットボール・グループ」と
# 「アブダビの投資グループ」の2つの名前で出ていた。クラブ記事の「2008年8月に Abu Dhabi
# United Group が買収」に合わせて1つに。2008年は物語の節で言うので、ここでは読まない
- 本拠地はエティハド・スタジアム。**約6万1000人**が入ります。
- オーナーは、アブダビの投資グループです。
- 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回。
- チャンピオンズリーグ1回、カップウィナーズカップ1回、スーパーカップ1回、クラブワールドカップ1回。
- 1シーズン勝ち点100を挙げたのは、2017年から18年です。
- 昨季は**2位**、勝ち点78。FAカップとリーグカップの**2冠**でした。
legends:
- セルヒオ・アグエロは、クラブ史上最多の**260得点**。あの最終節のゴールの主です。
- ヴァンサン・コンパニは8年間の主将。2012年4月のダービーで決勝点を決め、首位に立ちました。
- ダビド・シルバは、10年で4度のリーグ優勝を支えた司令塔。スタジアムの外に銅像が建っています。
legend_rows:
- - セルヒオ・アグエロ
  - 2011-2021
  - クラブ最多の260得点
- - ヴァンサン・コンパニ
  - 2008-2019
  - 8年間の主将
- - ダビド・シルバ
  - 2010-2020
  - 4度優勝の司令塔

