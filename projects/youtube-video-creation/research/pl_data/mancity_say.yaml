# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。冒頭の直後に置き、ショートはここから
# **本人の言葉を1つ**（2026-09-22）。原文は英語版Wikipedia（Enzo Maresca）:
# "City is an incredibly well-run football club."（2026年の監督就任時、クラブが出した声明の中の言葉）。
# 話者は people_extra に足す
reasons:
- 開幕から**5連勝**。いま、プレミアの首位にいるクラブです。
- 監督はエンツォ・マレスカ。かつての助手が、**1年目**の指揮です。
- {voice: エンツォ・マレスカ, text: "「シティは、信じられないほどよく運営されているクラブだ」"}
- 昨季はリーグ2位で、カップは**2つ**。リーグの優勝からは、2シーズン遠ざかっています。
reasons_sources:
