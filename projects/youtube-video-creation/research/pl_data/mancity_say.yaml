story: fall
data:
- 創立は**1880年**。セント・マークスという名前で始まり、1894年に今の名前になりました。
- 本拠地はエティハド・スタジアム。**6万1038人**が入ります。
- オーナーはシティ・フットボール・グループ。2008年からクラブを持っています。
- 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回、チャンピオンズリーグも獲っています。
- 昨季はFAカップとリーグカップの**2冠**でした。
- 2017年から18年には、勝ち点**100**。プレミアリーグの記録です。
- 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
legends:
- セルヒオ・アグエロは、クラブ史上最多の**260得点**。2011年から12年の最終節に、44年ぶりの優勝を決めるゴールを決めました。
- ヴァンサン・コンパニは、在籍11年のうち8年を主将として過ごしました。
- ダビド・シルバは、10年で4度のリーグ優勝を支えた司令塔。スタジアムの外に銅像が建っています。
