story: fall
data:
- 創立は**1880年**。教会のチーム、セント・マークスから、1894年に今の名前になりました。
- 愛称は「シチズンズ」。ほかに「ブルーズ」「スカイブルーズ」とも呼ばれます。
# 2026-09-22 流れの点検2回目: 同じオーナーが「シティ・フットボール・グループ」と
# 「アブダビの投資グループ」の2つの名前で出ていた。クラブ記事の「2008年8月に Abu Dhabi
# United Group が買収」に合わせて1つに。2008年は物語の節で言うので、ここでは読まない
- 本拠地はエティハド・スタジアム。**約6万1000人**が入ります。
- オーナーは、アブダビの投資グループです。
- 1部リーグの優勝は**10回**。FAカップ8回、リーグカップ9回。
- チャンピオンズリーグ1回、カップウィナーズカップ1回、スーパーカップ1回、クラブワールドカップ1回。
- 1シーズン勝ち点100を挙げたのは、2017年から18年です。
- 昨季は**2位**、勝ち点78。FAカップとリーグカップの**2冠**でした。
# **1人3行**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=どんな選手か、2行目=決定的な場面、3行目=残したもの。出典は各選手の Wikipedia
legends:
- - セルヒオ・アグエロは2011年、アトレティコから**3500万ポンド**で来ました。
  - '**260得点**はクラブ史上最多。ハットトリック**12回**はプレミアで最多です。'
  - 2021年にバルセロナへ移りましたが、心臓の不整脈が見つかり、12月に引退しました。
- - ヴァンサン・コンパニはベルギーのセンターバック。2008年8月、ハンブルクから来ました。
  - 2019年5月、レスターに1対0の勝ち。11年目で初めて、エリアの外から決めた1点でした。
  - 2019年に去り、アンダーレヒトで選手兼監督に。2024年からはバイエルンを率いています。
- - ダビド・シルバは2010年、スペインがワールドカップを獲った年に、バレンシアから来ました。
  - リーグ優勝4回に、FAカップ2回、リーグカップ5回。タイトルは**11**です。
  - '**436試合**に出て、最後の1年は主将。2020年、レアル・ソシエダへ去りました。'
legend_sources:
- - https://en.wikipedia.org/wiki/Sergio_Ag%C3%BCero
- - https://en.wikipedia.org/wiki/Vincent_Kompany
- - https://en.wikipedia.org/wiki/David_Silva
legend_rows:
- - セルヒオ・アグエロ
  - 2011-2021
  - クラブ最多の260得点
- - ヴァンサン・コンパニ
  - 2008-2019
  - 8年間の主将
- - ダビド・シルバ
  - 2010-2020
  - 4度優勝の司令塔

# **引きを書き換えた**（2026-09-20）。宿敵の節を落としたので、
