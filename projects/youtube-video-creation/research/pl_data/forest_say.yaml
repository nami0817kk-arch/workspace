story: clough
# 2026-09-22 流れの点検。1865年は冒頭の一言で読む。ホームタウンを本拠地の次に置く
# （他の回と並びを揃える）。42試合の年月はクラブの話の節に任せる。
# 「ヨーロッパのタイトル」はいまのチャンピオンズリーグだと言う。ガリバルディスは赤の由来
data:
- 愛称は「トリッキー・トゥリーズ」。ユニフォームの赤から、「ガリバルディス」「レッズ」とも。
- ホームタウンはウェスト・ブリッジフォード。ノッティンガムの隣町です。
- いちばん古いクラブの本拠地は、シティ・グラウンド。**3万1212人**が入ります。
- オーナーはギリシャの実業家エヴァンゲロス・マリナキス。2017年からクラブを持っています。
- 1部リーグの優勝は**1回**。FAカップ2回、リーグカップ4回。そしてチャンピオンズリーグを**2回**、スーパーカップを1回獲っています。
- リーグで**42試合負けなし**という記録も持っています。1シーズンぶんの長さです。
- プレミアでの最高位は、1994年から95年の**3位**です。
legends:
- スチュアート・ピアースは、「サイコ」の愛称で呼ばれた主将。12年の在籍の大半で腕章を巻きました。
- デス・ウォーカーは、1990年ワールドカップでベスト4に入ったイングランド代表のセンターバックです。
- スタン・コリモアは、1994年の昇格と、翌シーズンの最高位を引っ張ったフォワードです。
legend_rows:
- - スチュアート・ピアース
  - 1985-1997
  - 12年間の主将
- - デス・ウォーカー
  - 1984-2005
  - 1990年W杯4強のCB
- - スタン・コリモア
  - 1993-1995
  - 昇格即3位のFW

