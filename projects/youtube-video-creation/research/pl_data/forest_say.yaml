story: clough
data:
- 創立は**1865年**。本拠地はシティ・グラウンド、**3万1212人**が入ります。
- オーナーはギリシャの実業家エヴァンゲロス・マリナキス。2017年からクラブを持っています。
- 1部リーグの優勝は**1回**。FAカップ2回、リーグカップ4回、そしてヨーロッパのタイトルを**2回**獲っています。
- 1977年11月から翌年11月まで、リーグで**42試合負けなし**。1部で優勝したシーズンです。
- プレミアでの最高位は、1994年から95年の**3位**です。
- 愛称は「トリッキー・トゥリーズ」。ほかに「ガリバルディス」「レッズ」とも呼ばれます。
legends:
- スチュアート・ピアースは、12年在籍の大半で主将を務めた「サイコ」です。
- デス・ウォーカーは、1990年ワールドカップでベスト4に入ったイングランド代表のセンターバックです。
- スタン・コリモアは、昇格と、昇格してすぐの3位を引っ張ったフォワードです。
legend_rows:
- - スチュアート・ピアース
  - 1985-1997
  - 12年間の主将
- - デス・ウォーカー
  - 1984-2005
  - 1990年W杯4強のCB
- - スタン・コリモア
  - 1993-1995
  - 昇格即3位のFW

