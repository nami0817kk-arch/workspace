story: clough
# 2026-09-22 流れの点検。1865年は冒頭の一言で読む。ホームタウンを本拠地の次に置く
# （他の回と並びを揃える）。42試合の年月はクラブの話の節に任せる。
# 「ヨーロッパのタイトル」はいまのチャンピオンズリーグだと言う。ガリバルディスは赤の由来
data:
- 愛称は「トリッキー・トゥリーズ」。ユニフォームの赤から、「ガリバルディス」「レッズ」とも。
- ホームタウンはウェスト・ブリッジフォード。ノッティンガムの隣町です。
- いちばん古いクラブの本拠地は、シティ・グラウンド。**3万1212人**が入ります。
- オーナーはギリシャの実業家エヴァンゲロス・マリナキス。2017年からクラブを持っています。
- 1部リーグの優勝は**1回**。FAカップ2回、リーグカップ4回。
- そしてチャンピオンズリーグを**2回**、スーパーカップを1回獲っています。
- リーグで**42試合負けなし**という記録も持っています。1シーズンぶんの長さです。
- プレミアでの最高位は、1994年から95年の**3位**です。
# 2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。1991年のFAカップ決勝（2対1）はピアースで言い、
# ウォーカーは同じ決勝（オウンゴール）ではなく1992年の唯一の得点で言う（同じ数字を二度読まない）
legends:
- - スチュアート・ピアースは、コヴェントリーから来た左サイドバック。愛称は「サイコ」です。
  - 1991年のFAカップ決勝、トッテナム戦。フリーキックで決めましたが、**2対1**で敗れました。
  - リーグカップを2年続けて掲げ、リーグ戦で**401試合**。1996年には選手兼監督も務めました。
- - デス・ウォーカーは生え抜きのセンターバックで、1990年ワールドカップの**4強**メンバーです。
  - プロ生活の得点は**1点**だけ。1992年の元日、ルートン戦。1対1の引き分けに持ち込んだ一撃です。
  - 1992年、**150万ポンド**でサンプドリアへ。10年後に戻ってきて、38歳まで守りました。
- - スタン・コリモアは、1993年にサウスエンドから**225万ポンド**で来たストライカーです。
  - 最初のシーズンは28試合で**19得点**。2部から1部へ、クラブを押し上げました。
  - 翌シーズンも22得点。1995年、英国最高額の**850万ポンド**でリヴァプールへ移りました。
legend_sources:
- - https://en.wikipedia.org/wiki/Stuart_Pearce
- - https://en.wikipedia.org/wiki/Des_Walker
- - https://en.wikipedia.org/wiki/Stan_Collymore
legend_rows:
- - スチュアート・ピアース
  - 1985-1997
  - 12年間の主将
- - デス・ウォーカー
  - 1984-2005
  - 1990年W杯4強のCB
- - スタン・コリモア
  - 1993-1995
  - 昇格即3位のFW

