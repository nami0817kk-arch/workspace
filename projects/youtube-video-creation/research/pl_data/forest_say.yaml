# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 冒頭の直後に置き、ショートもここから切る。事実は今季のシーズン記事（Glasner 就任、
# fifth consecutive season in the Premier League）、last_season.json（昨季16位）、
# standings.json（第5節で1勝2分2敗）。「FAカップをもたらした」は監督の節と同じ言い回しになるので避けた
# 本人の言葉を1つ（2026-09-22 指示）。原文は Brian_Clough の記事（1976-77 のアングロ・スコティッシュ杯、
# 頂点へ上がる前の最初の杯について "Those who said it was a nothing trophy were absolutely crackers.
# We'd won something, and it made all the difference."）。ショートの16秒以内に出すので2行目
reasons:
# 1行48字・引用30字の上限（draft のヒント）に合わせて詰めた
- パレスをFAカップに導いたグラスナーの**1年目**。半世紀前の名将クラフは、最初の杯をこう語りました。
- {voice: ブライアン・クラフ, text: "「つまらない杯だなんてどうかしてる。獲ったから全部変わった」"}
- 昨季は**16位**。2022年に戻ってきてから、今季でプレミア5シーズン目になります。
- 開幕から**5試合で1勝**。新しい監督の立て直しが、いま始まったところです。
