story: history
# **流れの点検（output/flow/20260920_pl02_arsenal.md）を受けて直した**（2026-09-22）。
# 愛称は創立の直後（名前の話は名前の話でまとめる）／ディアル・スクエアが何かを言う／
# 「単独で」は誰とだったかが無い／「14回」を5回読んでいたので減らす／
# 「直近のタイトル＝昨季優勝」と「昨季は1位」は同じ事実なので1行に畳む／
# 無敗優勝は基礎DATAで1回だけ読み、歩んできた道は49試合の記録から始める
# 3回目（2026-09-22）: 「同じ数だけ」の受け先が板の中に無かったので14回を1度だけ戻す／
# ホームタウンの行は plbuild の自動生成だと「ロンドン」を2回読むので手で書く（タイル2）／
# 「04年」は合成音声が「ぜろよねん」と読む恐れ／「唯一の記録」はプレミアリーグの中での話
# （1888-89 のプレストンも無敗優勝）なので範囲を戻し、長くなるぶん2行に割る（タイル6を2回）
data:
- 創立は**1886年**。兵器工場の作業場、ディアル・スクエアの名で始まりました。
- 愛称は「ガナーズ」。砲手、という意味です。
- ホームタウンは北ロンドン、イズリントン区です。
- 本拠地はエミレーツ・スタジアム。**6万704人**が入ります。
- オーナーはアメリカのスタン・クロエンケ。2018年にほかの株主を買い取り、ひとりで持っています。
- FAカップも、リーグと同じ**14回**獲っています。
- ヨーロッパは、カップウィナーズカップとフェアーズカップを1回ずつです。
- 2003年から2004年は、38試合を1度も負けずに優勝しました。
- "**インビンシブルズ**と呼ばれ、プレミアリーグでは今も唯一の記録です。"
- 直近のタイトルは昨季、2025年から26年のプレミアリーグ優勝。勝ち点は85でした。
# ベルカンプの「無敗優勝を含む」はアンリの行の直後で5回目の「無敗優勝」だったので落とした
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目＝誰か（来歴）、2行目＝決定的な場面、3行目＝残したもの。各行45字まで。
# 「無敗優勝」は基礎DATAで読んでいるので、ここでは出さない
legends:
- - ティエリ・アンリは1999年、ユヴェントスから加入。ヴェンゲルがストライカーに変えました。
  - クラブ史上最多の**228得点**。プレミアの得点王には、歴代最多の4回選ばれています。
  - 2007年にバルセロナへ。2012年には期限付きで戻り、復帰戦でリーズから得点しました。
- - デニス・ベルカンプは1995年、インテルから当時のクラブ最高額**750万ポンド**で加入。
  - 2002年のニューカッスル戦のゴールは、のちにプレミア25年で最高の1点に選ばれました。
  - 3度のリーグ優勝を支えた司令塔。2006年の引退試合が、エミレーツの最初の試合でした。
- - トニー・アダムスは1983年、17歳でデビュー。引退までこのクラブだけのセンターバックです。
  - 1988年、21歳で主将に。3つの年代でリーグ優勝の腕章を巻いた、ただひとりの選手です。
  - リーグ戦で**504試合**。2011年、創立125年を記念して、エミレーツに銅像が立ちました。
legend_sources:
- - https://en.wikipedia.org/wiki/Thierry_Henry
- - https://en.wikipedia.org/wiki/Dennis_Bergkamp
- - https://en.wikipedia.org/wiki/Tony_Adams
legend_rows:
- - ティエリ・アンリ
  - 1999-2007
  - クラブ最多の228得点
- - デニス・ベルカンプ
  - 1995-2006
  - 3度のリーグ優勝の司令塔
- - トニー・アダムス
  - 1983-2002
  - 1988-2002年の主将

