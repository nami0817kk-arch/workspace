story: history
# **流れの点検（output/flow/20260920_pl02_arsenal.md）を受けて直した**（2026-09-22）。
# 愛称は創立の直後（名前の話は名前の話でまとめる）／ディアル・スクエアが何かを言う／
# 「単独で」は誰とだったかが無い／「14回」を5回読んでいたので減らす／
# 「直近のタイトル＝昨季優勝」と「昨季は1位」は同じ事実なので1行に畳む／
# 無敗優勝は基礎DATAで1回だけ読み、歩んできた道は49試合の記録から始める
data:
- 創立は**1886年**。兵器工場の作業場、ディアル・スクエアの名で始まりました。
- 愛称は「ガナーズ」。砲手、という意味です。
- 本拠地はエミレーツ・スタジアム。**6万704人**が入ります。
- オーナーはアメリカのスタン・クロエンケ。2018年にほかの株主を買い取り、ひとりで持っています。
- FAカップも、リーグと同じ数だけ獲っています。
- 直近のタイトルは昨季、2025年から26年のプレミアリーグ優勝。勝ち点は85でした。
- 2003年から04年は、38試合を1度も負けずに優勝。**インビンシブルズ**と呼ばれ、今も唯一の記録です。
legends:
- ティエリ・アンリは、クラブ史上最多の**228得点**。無敗優勝の中心にいました。
- デニス・ベルカンプは、無敗優勝を含む3度のリーグ優勝を支えた司令塔です。
- トニー・アダムスは、**1988年から2002年**まで主将を務めたセンターバックです。
legend_rows:
- - ティエリ・アンリ
  - 1999-2007
  - クラブ最多の228得点
- - デニス・ベルカンプ
  - 1995-2006
  - 無敗優勝の司令塔
- - トニー・アダムス
  - 1983-2002
  - 1988-2002年の主将

# **引きを書き換えた**（2026-09-20）。宿敵の節を落としたので、
# 宿敵を約束する引きのままだと、その話を一度もしないことになる
hook: 1つも負けずに優勝したシーズンがあります。

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる。
# ホームタウンの行（タイル2）は plbuild が3行目に足す。
# 「直近のタイトル」の行は昨季の順位表（タイル7）で出す（勝ち点85を同じ行で読むため）
data_focus: [0, 8, 1, 3, 4, 7, 6]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "ロンドンでいちばん多い、**14回**のリーグ優勝。"

# **サムネが本編で言っていないことを約束していた**（2026-09-21）。
# 旧台本から引き継いだ文字が、落とした節を指していた
thumbnail:
  line1: "38試合、1つも負けずに"
  line2: "アーセナル"

# ラヤとケパが「スペイン代表で13試合」と同じ数字で並び、言い間違いに聞こえた（2026-09-22）。
# ラヤはクラブでの出場数（<key>_raw.json の club_caps）で言う。
# サリバの「代表で38試合」は無敗優勝の「38試合」と同じ数字になるので、こちらもクラブの数で
squad_about:
  ダビド・ラヤ: ダビド・ラヤはアーセナルのリーグ戦で**80試合**。
  ウィリアム・サリバ: ウィリアム・サリバはアーセナルのリーグ戦で**131試合**。

# **22年ぶりの王者が2位で終わると締めが据わらない**（2026-09-22）。唯一の黒星と
# 首位との差を足す（結果はカードの表、順位表は research/pl_data/standings.json）
season:
- 唯一の黒星は第5節。ブライトンにアウェーで0対3で敗れました。
- 首位のマンチェスター・シティとは、勝ち点3の差です。
