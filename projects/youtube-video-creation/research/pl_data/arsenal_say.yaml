story: history
data:
- 創立は**1886年**。ディアル・スクエアという名前で始まりました。
- 本拠地はロンドン北部のエミレーツ・スタジアム。**6万704人**が入ります。
- オーナーはスタン・クロエンケ。2018年から単独でクラブを持っています。
- 1部リーグの優勝は**14回**。FAカップも14回獲っています。
- 直近のタイトルは昨季、2025年から26年のプレミアリーグ優勝です。
- そして2003年から04年には、38試合を1度も負けずに優勝。**インビンシブルズ**と呼ばれ、プレミアリーグでは今も唯一の記録です。
- 愛称は「ガナーズ」。砲手、という意味です。
legends:
- ティエリ・アンリは、クラブ史上最多の**228得点**。無敗優勝の中心にいました。
- デニス・ベルカンプは、無敗優勝を含む3度のリーグ優勝を支えた司令塔です。
- トニー・アダムスは、**14年間**主将を務めたセンターバックです。
legend_rows:
- - ティエリ・アンリ
  - 1999-2007
  - クラブ最多の228得点
- - デニス・ベルカンプ
  - 1995-2006
  - 無敗優勝の司令塔
- - トニー・アダムス
  - 1983-2002
  - 14年間の主将

