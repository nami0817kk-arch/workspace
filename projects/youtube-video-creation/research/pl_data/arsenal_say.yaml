# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。オープニングの直後に読み、ショートもここから切る。
# 「22年ぶり」「勝ち点3の差」「チャンピオンズリーグの初戦」は今季の節で読むので、
# ここは別の言い方の予告にする（8字の言い直しで止まる）
reasons:
- "昨季、**22年**待ったリーグ優勝をつかんだ王者です。"
- "今季は連覇に挑む立場。首位を勝ち点**3**差で追っています。"
- "欧州の頂点を争う大会も、初戦はアウェーで勝ちました。"
reasons_telop: 22年ぶりの王者、連覇に挑む
reasons_rows:
- ["理由1", "昨季22年ぶりのリーグ優勝"]
- ["理由2", "首位と勝ち点3差で連覇争い"]
- ["理由3", "欧州最高峰の大会も初戦勝利"]
