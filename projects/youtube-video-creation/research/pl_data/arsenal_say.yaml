# 宿敵を約束する引きのままだと、その話を一度もしないことになる
hook: 1つも負けずに優勝したシーズンがあります。

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる。
# ホームタウンの行（タイル2）は手で書いた3行目（2026-09-22）。
# 「直近のタイトル」の行は昨季の順位表（タイル7）で出す（勝ち点85を同じ行で読むため）
data_focus: [0, 1, 2, 3, 4, 5, 5, 6, 6, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "ロンドンでいちばん多い、**14回**のリーグ優勝。"

# **サムネが本編で言っていないことを約束していた**（2026-09-21）。
# 旧台本から引き継いだ文字が、落とした節を指していた
thumbnail:
  line1: "38試合、1つも負けずに"
  line2: "アーセナル"

# ラヤとケパが「スペイン代表で13試合」と同じ数字で並び、言い間違いに聞こえた（2026-09-22）。
# ラヤはクラブでの出場数（<key>_raw.json の club_caps）で言う。
# サリバの「代表で38試合」は無敗優勝の「38試合」と同じ数字になるので、こちらもクラブの数で
squad_about:
  ダビド・ラヤ: ダビド・ラヤはアーセナルのリーグ戦で**80試合**。
  ウィリアム・サリバ: ウィリアム・サリバはアーセナルのリーグ戦で**131試合**。

# **22年ぶりの王者が2位で終わると締めが据わらない**（2026-09-22）。唯一の黒星と
# 首位との差を足す（結果はカードの表、順位表は research/pl_data/standings.json）
# 「この順位を保てば来季のCL」を王者に読むと「今季は出ていないのか」となるので、
# 今季の初戦を最後に置く（2026-09-22。2026–27 Arsenal F.C. season: 9月9日、Napoli 0–1 Arsenal）
season:
- 唯一の黒星は第5節。ブライトンにアウェーで0対3で敗れました。
- 首位のマンチェスター・シティとは、勝ち点3の差です。
- 今季のチャンピオンズリーグは、初戦でナポリにアウェーで**1対0**の勝ちです。
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: クラブ名の地下鉄駅
  tier: 背景
  telop: 地下鉄の駅の名前が「アーセナル」
  narrator: 解説
  card:
    type: table
    title: クラブ名の地下鉄駅
    columns:
    - ''
    - ''
    rows:
    - - 駅の名前
      - アーセナル（もとはジレスピー・ロード）
    - - 変わった日
      - 1932年10月31日
    - - 働きかけた人
      - 監督ハーバート・チャップマン
  say:
  - ロンドンの地下鉄に、「アーセナル」という駅があります。
  - もとはジレスピー・ロード駅。監督のハーバート・チャップマンが働きかけて、**1932年**に名前が変わりました。
  - クラブの名前をそのまま付けた駅は、ロンドンの地下鉄でここだけです。
  sources:
  - https://en.wikipedia.org/wiki/History_of_Arsenal_F.C._(1886%E2%80%931966)
  - https://en.wikipedia.org/wiki/Arsenal_tube_station
# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
