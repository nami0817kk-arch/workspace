  say:
  - ロンドンの地下鉄に、「アーセナル」という駅があります。
  - もとはジレスピー・ロード駅。監督のハーバート・チャップマンが働きかけて、**1932年**に名前が変わりました。
  - クラブの名前をそのまま付けた地下鉄の駅は、ここだけです。
