story: cup1901
# 2026-09-22 流れの点検。「高井がいる」の3度目をやめ、高井の中身を1行置く。
# 22歳は tottenham_raw.json の生年月日（2004-09-04）から。期限付き移籍は
# 旧台本の今季の顔ぶれの節と高井の記事（Kōta_Takai）で裏を取った
why:
- 22歳のセンターバックで、いまはベルギーのシント＝トロイデンに、期限付きで出ています。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
# スタジアムの名前を言う。ホームタウンは括弧を読まない形で。イーニックは投資会社。
# 「ヨーロッパのタイトル」は冒頭の一言（4回）とクラブの話の節で数える
data:
- 創立は**1882年**。ホットスパーという名前で始まりました。
- 本拠地はトッテナム・ホットスパー・スタジアム。**6万2850人**が入ります。
- ホームタウンは、ロンドン北部のトッテナムです。
- オーナーは投資会社のイーニック。2001年からクラブを持っています。
- 1部リーグの優勝は**2回**。FAカップは8回、リーグカップは4回です。
- 直近のタイトルは、2024年から25年のヨーロッパリーグです。
- プレミアでの最高位は、2016年から17年の**2位**です。
- 愛称は「スパーズ」。「リリーホワイツ」とも呼ばれます。
legends:
# 2026-09-22 流れの点検。グリーヴスが誰か（60年代のエース）。ソンの行は基礎DATAの
# 「2024年から25年のヨーロッパリーグ」と同じ年を読まない形にした
- ハリー・ケインは、60年代のエース、ジミー・グリーヴスを抜いたクラブ史上最多の**280得点**。
- ソン・フンミンは、10年在籍の最後の年に、主将としてヨーロッパリーグの優勝杯を掲げました。
- レドリー・キングは、生涯トッテナム一筋の主将。2008年にリーグカップを掲げています。
legend_rows:
- - ハリー・ケイン
  - 2009-2023
  - クラブ最多の280得点
- - ソン・フンミン
  - 2015-2025
  - EL優勝の主将
- - レドリー・キング
  - 1999-2012
  - 一筋の主将

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 5, 7, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "北ロンドンから、**FAカップ8回**と**ヨーロッパ4回**。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 雄鶏と拍車
  tier: 背景
  telop: 雄鶏の由来は「拍車」
  narrator: 解説
  card:
    type: table
    title: 雄鶏と拍車
    columns:
    - ''
    - ''
    rows:
    - - ハリー・ホットスパー
      - 馬に拍車を蹴り込んだ人
    - - 拍車
      - 闘鶏の鶏にも付ける
    - - 1909-10年
      - 元選手が35ポンドで雄鶏の像を作る
  say:
  # 2026-09-22 流れの点検。ハリー・ホットスパーが人だと先に分かるように（中世の貴族）。
  # 拍車 → 闘鶏 → だから雄鶏、の最後の一段を言葉にした
  - クラブ名の由来は、中世の貴族ハリー・ホットスパー。エンブレムの雄鶏も、そこから来ています。
  - 戦いで馬に拍車を蹴り込むことから、ホットスパーと呼ばれた人物です。
  - その拍車は、闘鶏の鶏にも付けるもの。だから雄鶏、というわけです。
  - 1909年から10年のシーズンの終わり、元選手が**35ポンド**で作ったブロンズの雄鶏が、スタンドの屋根に置かれました。
  sources:
  - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
