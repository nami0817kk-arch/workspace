story: cup1901
# 2026-09-22 流れの点検。「高井がいる」の3度目をやめ、高井の中身を1行置く。
# 22歳は tottenham_raw.json の生年月日（2004-09-04）から。期限付き移籍は
# 旧台本の今季の顔ぶれの節と高井の記事（Kōta_Takai）で裏を取った
# 2026-09-22 2回目。タイトル「高井幸大がいる」→「出ています」→登録選手「います」で、「いる」の
# 意味が決まらなかった。トッテナムの選手（所属）で、いまは期限付きでベルギー、と1行で揃える。
# 「では、どんなクラブなのか」の振りは、タイトルの言い直しなので落とした
why:
- 22歳のセンターバック。トッテナムの選手で、いまは期限付きでベルギーのシント＝トロイデンにいます。
# スタジアムの名前を言う。ホームタウンは括弧を読まない形で。イーニックは投資会社。
# 「ヨーロッパのタイトル」は冒頭の一言（4回）とクラブの話の節で数える
data:
- 創立は**1882年**。ホットスパーという名前で始まりました。
- 愛称は「スパーズ」。「リリーホワイツ」とも呼ばれます。
- ホームタウンは、ロンドン北部のトッテナムです。
- 本拠地はトッテナム・ホットスパー・スタジアム。**6万2850人**が入ります。
- オーナーは投資会社のイーニック。2001年からクラブを持っています。
- 1部リーグの優勝は**2回**。FAカップは8回、リーグカップは4回です。
# 2026-09-22 2回目。2024-25 のヨーロッパリーグを基礎DATA・クラブの話・ソンの行で三度読んで
# いた。クラブの話の節が年を付けて言うので、この行は落とした（data_focus も合わせた）
- ヨーロッパリーグ3回、カップウィナーズカップ1回。合わせて4つ。
- プレミアでの最高位は、2016年から17年の**2位**です。
# 2026-09-22 流れの点検。グリーヴスが誰か（60年代のエース）。ソンの行は基礎DATAの
# 「2024年から25年のヨーロッパリーグ」と同じ年を読まない形にした
# 2026-09-22 2回目。指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。試合数は infobox＝リーグ戦のみ
legends:
- - ハリー・ケインは**11歳**で入った生え抜き。4度の期限付き移籍を経て、定位置をつかみました。
  - 2023年2月、シティ戦のゴールで、60年代のエース、グリーヴスのクラブ記録を抜きました。
  - クラブ史上最多の**280得点**を残し、無冠のままバイエルンへ。プレミアの得点王は3回でした。
- - ソン・フンミンは、レバークーゼンから来た韓国代表。**2200万ポンド**はアジア人の最高額。
  - 2021年から22年、サラーと並ぶ**23得点**で得点王。アジアの選手では初めてでした。
  - 10年目、主将としてヨーロッパリーグの決勝でユナイテッドに**1対0**。初めてのタイトルでした。
- - レドリー・キングは生え抜きのセンターバック。クラブ一筋で、リーグ戦**268試合**を戦いました。
  - 2000年12月、ブラッドフォード戦で開始**10秒**のゴール。当時のプレミア最速記録でした。
  - 膝の軟骨が無く、練習できないまま試合へ。2008年、主将としてリーグカップを掲げました。
legend_sources:
- - https://en.wikipedia.org/wiki/Harry_Kane
- - https://en.wikipedia.org/wiki/Son_Heung-min
- - https://en.wikipedia.org/wiki/Ledley_King
legend_rows:
- - ハリー・ケイン
  - 2009-2023
  - クラブ最多の280得点
- - ソン・フンミン
  - 2015-2025
  - EL優勝の主将
- - レドリー・キング
  - 1999-2012
  - 一筋の主将

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 5, 5, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "北ロンドンから、**FAカップ8回**と**ヨーロッパリーグ3回**。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 雄鶏と拍車
  tier: 背景
  telop: 雄鶏の由来は「拍車」
  narrator: 解説
  card:
    type: table
    title: 雄鶏と拍車
    columns:
    - ''
    - ''
    rows:
    - - ハリー・ホットスパー
      - 馬に拍車を蹴り込んだ人
    - - 拍車
      - 闘鶏の鶏にも付ける
    - - 1909-10年
      - 元選手が35ポンドで雄鶏の像を作る
  say:
  # 2026-09-22 流れの点検。ハリー・ホットスパーが人だと先に分かるように（中世の貴族）。
  # 拍車 → 闘鶏 → だから雄鶏、の最後の一段を言葉にした
  # 2026-09-22 この節に実写を1枚（Commons、スタジアムの雄鶏の像）
  - text: クラブ名の由来は、中世の貴族ハリー・ホットスパー。エンブレムの雄鶏も、そこから来ています。
    image: assets/images/pl_tottenham_episode/scene.jpg
  - 戦いで馬に拍車を蹴り込むことから、ホットスパーと呼ばれた人物です。
  - その拍車は、闘鶏の鶏にも付けるもの。だから雄鶏、というわけです。
  - 1909年から10年のシーズンの終わり。元選手が**35ポンド**で、ブロンズの雄鶏を作りました。
  - その雄鶏が、スタンドの屋根に置かれました。
  sources:
  - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
manager:
- 監督はイタリア人のロベルト・デ・ゼルビ。**2026年3月**から、2年目です。
- 前はマルセイユ。就任した昨季は17位で、最終節で残留を決めました。
manager_telop: 監督はロベルト・デ・ゼルビ。2年目
manager_rows:
- - 監督
  - ロベルト・デ・ゼルビ（イタリア）
- - 就任
  - 2026年3月・2年目
- - 前職
  - マルセイユ
manager_sources:
- https://en.wikipedia.org/wiki/Roberto_De_Zerbi

# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 冒頭の直後に置き、ショートもここから切る。1行目は高井（上の why と同じ事実。why は
# reasons があると読まれない）。事実は今季のシーズン記事（Takai loaned to Sint-Truidense until
# end of season、20th with 2 points）、監督の節（2026年3月就任）、クラブの話の節（2025年のヨーロッパリーグ）
# 本人の言葉を1つ（2026-09-22 指示）。原文は Danny_Blanchflower の記事（"The game is about glory,
# it is about doing things in style and with a flourish"）。ショートの16秒以内に出すので、
# 言葉の前置きを1行目にして高井は3行目へ（why と同じ事実。why は reasons があると読まれない）
reasons:
- 1961年のリーグとカップの2冠を主将として率いた、ブランチフラワーの言葉があります。
# 引用30字・1行48字の上限（draft のヒント）に合わせて詰めた
- {voice: ダニー・ブランチフラワー, text: "「サッカーは栄光のためにある。粋に、華やかにやるんだ」"}
- 高井幸大は**22歳**のセンターバック。いまは期限付きで、ベルギーのシント＝トロイデンにいます。
- '**2025年**のヨーロッパリーグ王者が、いま最下位。デ・ゼルビ監督の**2年目**は、開幕5試合で勝ちなし。'
- "1901年、まだリーグに入っていないのにFAカップを制した、唯一のクラブです。"
reasons_sources:
- https://en.wikipedia.org/wiki/Danny_Blanchflower
people_extra:
- ダニー・ブランチフラワー
reasons_telop: 高井幸大がいるクラブが、いま最下位
reasons_rows:
- - 理由1
  - 高井幸大が所属。いまベルギー
- - 理由2
  - ヨーロッパリーグ王者が最下位
- - 理由3
  - デ・ゼルビ2年目、開幕勝ちなし
# 題（2026-09-22 指示「タイトルをもっと視聴者が見たいと思うものに」）
title: 高井幸大のトッテナム。リーグの外からFAカップをつかんだクラブの結末
short_title: 高井幸大のトッテナム、リーグ外でFAカップを獲った結末
# このクラブの特徴（2026-09-23 指示「三つの要素入れたい！」）。プレーの色・運営の型・クラブの気質。
# 出典は英語版Wikipedia とクラブ公式。要確認は research/pl_data/features_notes.md
features:
- "デ・ゼルビ監督のサッカーは、キーパーからつないで崩し、失えばすぐ前から奪い返す。"
- "10億ポンドのスタジアムを持ち、稼ぎは世界9位。2025年秋、オーナーから1億ポンドの追加出資。"
- "応援歌「グローリー・グローリー」は讃美歌から。1961年からの欧州の戦いで歌われ始めました。"
