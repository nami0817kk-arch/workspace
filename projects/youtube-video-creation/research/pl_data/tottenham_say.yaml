story: cup1901
# 2026-09-22 流れの点検。「高井がいる」の3度目をやめ、高井の中身を1行置く。
# 22歳は tottenham_raw.json の生年月日（2004-09-04）から。期限付き移籍は
# 旧台本の今季の顔ぶれの節と高井の記事（Kōta_Takai）で裏を取った
# 2026-09-22 2回目。タイトル「高井幸大がいる」→「出ています」→登録選手「います」で、「いる」の
# 意味が決まらなかった。トッテナムの選手（所属）で、いまは期限付きでベルギー、と1行で揃える。
# 「では、どんなクラブなのか」の振りは、タイトルの言い直しなので落とした
why:
- 22歳のセンターバック。トッテナムの選手で、いまは期限付きでベルギーのシント＝トロイデンにいます。
# スタジアムの名前を言う。ホームタウンは括弧を読まない形で。イーニックは投資会社。
# 「ヨーロッパのタイトル」は冒頭の一言（4回）とクラブの話の節で数える
data:
- 創立は**1882年**。ホットスパーという名前で始まりました。
- 愛称は「スパーズ」。「リリーホワイツ」とも呼ばれます。
- ホームタウンは、ロンドン北部のトッテナムです。
- 本拠地はトッテナム・ホットスパー・スタジアム。**6万2850人**が入ります。
- オーナーは投資会社のイーニック。2001年からクラブを持っています。
- 1部リーグの優勝は**2回**。FAカップは8回、リーグカップは4回です。
# 2026-09-22 2回目。2024-25 のヨーロッパリーグを基礎DATA・クラブの話・ソンの行で三度読んで
# いた。クラブの話の節が年を付けて言うので、この行は落とした（data_focus も合わせた）
- ヨーロッパリーグ3回、カップウィナーズカップ1回。合わせて4つです。
- プレミアでの最高位は、2016年から17年の**2位**です。
# 2026-09-22 流れの点検。グリーヴスが誰か（60年代のエース）。ソンの行は基礎DATAの
# 「2024年から25年のヨーロッパリーグ」と同じ年を読まない形にした
# 2026-09-22 2回目。指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。試合数は infobox＝リーグ戦のみ
legends:
- - ハリー・ケインは**11歳**で入った生え抜き。4度の期限付き移籍を経て、定位置をつかみました。
  - 2023年2月、シティ戦のゴールで、60年代のエース、グリーヴスのクラブ記録を抜きました。
  - クラブ史上最多の**280得点**を残し、無冠のままバイエルンへ。プレミアの得点王は3回でした。
- - ソン・フンミンは、レバークーゼンから来た韓国代表。**2200万ポンド**はアジア人の最高額。
  - 2021年から22年、サラーと並ぶ**23得点**で得点王。アジアの選手では初めてでした。
  - 10年目、主将としてヨーロッパリーグの決勝でユナイテッドに**1対0**。初めてのタイトルでした。
- - レドリー・キングは生え抜きのセンターバック。クラブ一筋で、リーグ戦**268試合**を戦いました。
  - 2000年12月、ブラッドフォード戦で開始**10秒**のゴール。当時のプレミア最速記録でした。
  - 膝の軟骨が無く、練習できないまま試合へ。2008年、主将としてリーグカップを掲げました。
legend_sources:
- - https://en.wikipedia.org/wiki/Harry_Kane
- - https://en.wikipedia.org/wiki/Son_Heung-min
- - https://en.wikipedia.org/wiki/Ledley_King
legend_rows:
- - ハリー・ケイン
  - 2009-2023
  - クラブ最多の280得点
- - ソン・フンミン
  - 2015-2025
  - EL優勝の主将
- - レドリー・キング
  - 1999-2012
  - 一筋の主将

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 5, 5, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "北ロンドンから、**FAカップ8回**と**ヨーロッパリーグ3回**。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 雄鶏と拍車
  tier: 背景
  telop: 雄鶏の由来は「拍車」
  narrator: 解説
  card:
    type: table
    title: 雄鶏と拍車
    columns:
    - ''
    - ''
    rows:
    - - ハリー・ホットスパー
      - 馬に拍車を蹴り込んだ人
    - - 拍車
      - 闘鶏の鶏にも付ける
    - - 1909-10年
      - 元選手が35ポンドで雄鶏の像を作る
  say:
  # 2026-09-22 流れの点検。ハリー・ホットスパーが人だと先に分かるように（中世の貴族）。
  # 拍車 → 闘鶏 → だから雄鶏、の最後の一段を言葉にした
  - クラブ名の由来は、中世の貴族ハリー・ホットスパー。エンブレムの雄鶏も、そこから来ています。
  - 戦いで馬に拍車を蹴り込むことから、ホットスパーと呼ばれた人物です。
  - その拍車は、闘鶏の鶏にも付けるもの。だから雄鶏、というわけです。
  - 1909年から10年のシーズンの終わり、元選手が**35ポンド**で作ったブロンズの雄鶏が、スタンドの屋根に置かれました。
  sources:
  - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
