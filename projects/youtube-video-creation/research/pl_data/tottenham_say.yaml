story: cup1901
why:
- 日本代表の高井幸大が所属しているのが、トッテナム・ホットスパーです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1882年**。ホットスパーという名前で始まりました。
- 本拠地のスタジアムには、**6万2850人**が入ります。
- オーナーはイーニックグループ。2001年からクラブを持っています。
- 1部リーグの優勝は**2回**。FAカップは8回、リーグカップ4回、ヨーロッパのタイトルもあります。
- 直近のタイトルは、2024年から25年のヨーロッパリーグです。
- プレミアでの最高位は、2016年から17年の**2位**です。
- 愛称は「スパーズ」。「リリーホワイツ」とも呼ばれます。
legends:
- ハリー・ケインは、ジミー・グリーヴスを抜いたクラブ史上最多の**280得点**。
- ソン・フンミンは2023年から主将を務め、2025年にヨーロッパリーグを掲げました。
- レドリー・キングは、生涯トッテナム一筋の主将。2008年にリーグカップを掲げています。
legend_rows:
- - ハリー・ケイン
  - 2009-2023
  - クラブ最多の280得点
- - ソン・フンミン
  - 2015-2025
  - EL優勝の主将
- - レドリー・キング
  - 1999-2012
  - 一筋の主将

