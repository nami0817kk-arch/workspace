  # 2026-09-22: 節の1行目に実写を1枚（ハル市街の広場を埋めたサポーター。Commons CC BY-SA 2.0）
  - {text: "**2013年**、当時のオーナー、アッセム・アラムが「ハル・タイガース」への改名を言い出しました。", image: assets/images/pl_hull_episode/01.jpg}
  - 「シティ」はありふれていて、名前は短いほうが売れる、という理由です。
  - サポーターは「死ぬまでシティ」と声を上げました。
  - 2014年4月、イングランドサッカー協会の評議会が**63.5%**の票で改名を退けました。
  - そのアラムからクラブを買い取ったのが、いまのオーナー、ウルジャルです。
