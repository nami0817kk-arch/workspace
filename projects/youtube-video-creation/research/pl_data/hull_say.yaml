data_focus: [0, 1, 2, 3, 4, 6, 7, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "1部も、FAカップも、リーグカップも無い、東部の港町。"
# **引き**（2026-09-22 流れの点検2回目）。旧台本の「日本代表の中盤が、この港町にいます」は
# 題名と次の節と合わせて「守田がハルにいる」を3行続けて言っていた。逸話の予告に替える
hook: この港町のクラブには、忘れられない2013年があります。
# **節の順を「名前を変えられかけた」→「4部からプレミアまで5年」にする**（2026-09-22
# 流れの点検2回目、1回目と同じ指摘）。基礎DATAの末尾「愛称はタイガース」の続きが改名の話で、
# 2008年のボレーの続きが1人目「あのボレーを決めた男」。plbuild は逸話（episode）を
# 物語のあとに置くので、両方を story_sections に書いて順を決める。
# 「4部からプレミアまで5年」の文は 20260916_pl11_hull.yaml の rise と同じもの
