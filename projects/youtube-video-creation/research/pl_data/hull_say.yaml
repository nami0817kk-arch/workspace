reasons:
- 日本代表**40試合**の中盤、守田英正が、この夏ここを選びました。
- 初めて1部へ上げた、ウィンダスの言葉です。
- {voice: ディーン・ウィンダス, text: "「あなたをプレミアリーグへ上げる決勝ゴールは、私が決める」"}
- 開幕から5試合で**8位**。1部での最高順位、16位より上にいます。
- 指揮を執るのは、ボスニア人として初めてプレミアで勝った監督。**2年目**です。
