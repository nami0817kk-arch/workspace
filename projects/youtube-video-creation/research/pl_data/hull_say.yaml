story: rise
why:
- 日本代表で**40試合**に出た中盤、守田英正がいるのがハル・シティです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1904年**です。
- 愛称は「タイガース」。黒と琥珀色の縞模様を、昔から着てきたクラブです。
- ホームタウンはキングストン・アポン・ハル。イングランド東部です。
- 本拠地はエムケーエム・スタジアム。**約2万5000人**が入ります。
- オーナーはトルコの実業家アジュン・ウルジャル。2022年からクラブを持っています。
- 1939年には、カーライル・ユナイテッドに**11対1**で勝っています。クラブ最大の勝利です。
- 昨季は2部のプレーオフ決勝でミドルズブラを破り、プレミアに上がってきました。
- プレミアでの最高位は、2013年から14年の**16位**です。
legends:
- ディーン・ウィンダスは、地元ハル出身のフォワード。あのボレーを決めた男です。
- イアン・アシュビーは、4部から1部まで、すべての階級で主将を務めた選手です。
- ニック・バームビーは、イングランド代表も経験して地元ハルに戻り、2度の昇格を支えました。
legend_rows:
- - ディーン・ウィンダス
  - 1991-2009
  - 初の1部昇格を決めた
- - イアン・アシュビー
  - 2002-2011
  - 4部から1部まで主将
- - ニック・バームビー
  - 2004-2012
  - 地元に戻り2度の昇格

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 2, 3, 4, 6, 7, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "1部も、FAカップも、リーグカップも無い、東部の港町。"
# **引き**（2026-09-22 流れの点検2回目）。旧台本の「日本代表の中盤が、この港町にいます」は
# 題名と次の節と合わせて「守田がハルにいる」を3行続けて言っていた。逸話の予告に替える
hook: 名前を変えられかけたことも、あります。
# **節の順を「名前を変えられかけた」→「4部からプレミアまで5年」にする**（2026-09-22
# 流れの点検2回目、1回目と同じ指摘）。基礎DATAの末尾「愛称はタイガース」の続きが改名の話で、
# 2008年のボレーの続きが1人目「あのボレーを決めた男」。plbuild は逸話（episode）を
# 物語のあとに置くので、両方を story_sections に書いて順を決める。
# 「4部からプレミアまで5年」の文は 20260916_pl11_hull.yaml の rise と同じもの
story_sections:
- id: episode
  heading: 名前を変えられかけた
  tier: 背景
  telop: 「ハル・タイガース」への改名、退けられる
  narrator: 解説
  card:
    type: table
    title: 名前を変えられかけた
    columns:
    - ''
    - ''
    rows:
    - - 2013年
      - オーナーが「ハル・タイガース」への改名を表明
    - - サポーター
      - 「City Till We Die」
    - - 2014年4月9日
      - FAが63.5%の票で退ける
  say:
  - '**2013年**、当時のオーナー、アッセム・アラムが「ハル・タイガース」への改名を言い出しました。'
  - 「シティ」はありふれていて、名前は短いほうが売れる、という理由です。
  - サポーターは「死ぬまでシティ」と声を上げました。
  - 2014年4月、イングランドサッカー協会の評議会が**63.5%**の票で改名を退けました。
  - そのアラムからクラブを買い取ったのが、いまのオーナー、ウルジャルです。
  sources:
  - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
  - https://en.wikipedia.org/wiki/Acun_Ilıcalı
- id: rise
  heading: 4部からプレミアまで5年
  tier: 背景
  telop: 4部からプレミアまで5シーズン
  narrator: 解説
  card:
    type: table
    title: 駆け上がった5シーズン
    columns:
    - ''
    - ''
    rows:
    - - 出発点
      - 4部
    - - 2008年
      - プレーオフ決勝でブリストル・シティに1-0
    - - 速さ
      - イングランドで3番目
  say:
  - はじめて1部に上がったのは**2008年**。4部から**5シーズン**で駆け上がりました。
  - その年のプレーオフ決勝の相手は、ブリストル・シティでした。
  - 決めたのはディーン・ウィンダス。前半の**ボレー1本**でした。
  - この1点を守りきり、ハルが1対0で勝ちました。
  - この上がり方は、イングランドのサッカーで**3番目に速い**とされています。
  sources:
  - https://en.wikipedia.org/wiki/Hull_City_A.F.C.
