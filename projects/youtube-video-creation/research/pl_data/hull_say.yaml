story: rise
why:
- 日本代表で**40試合**に出た中盤、守田英正がいるのがハル・シティです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1904年**です。
- 愛称は「タイガース」。黒と琥珀色の縞模様を、昔から着てきました。
- ホームタウンはキングストン・アポン・ハル。イングランド東部です。
- 本拠地はエムケーエム・スタジアム。**約2万5000人**が入ります。
- オーナーはトルコの実業家アジュン・ウルジャル。2022年からクラブを持っています。
- 1939年には、カーライル・ユナイテッドに**11対1**で勝っています。クラブ最大の勝利です。
- 昨季は2部のプレーオフ決勝でミドルズブラを破り、プレミアに上がってきました。
- プレミアでの最高位は、2013年から14年の**16位**です。
# **1人3行**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=どんな選手か、2行目=決定的な場面、3行目=残したもの。出典は各選手の Wikipedia
legends:
- - ディーン・ウィンダスは地元ハル出身のフォワード。1991年、リーグ外のクラブから来ました。
  - 1995年に**70万ポンド**でアバディーンへ売られ、2007年に戻ってきました。
  - あのボレーを決めたとき、**39歳**でした。
- - イアン・アシュビーは、2002年にケンブリッジから加わった中盤。4部にいたころのことです。
  - 2004年、ヨービル戦で決めたゴールが、クラブを4部から3部へ上げました。
  - 4階級すべてで主将を務めた、ただひとりの男。リーグ戦**243試合**に出ました。
- - ニック・バームビーは、ハル生まれのイングランド代表。代表で**23試合**に出ています。
  - 2000年、エヴァートンからリヴァプールへ**600万ポンド**で移った男でもあります。
  - 2004年、移籍金なしで地元ハルに戻り、2012年には監督も務めました。
legend_sources:
- - https://en.wikipedia.org/wiki/Dean_Windass
- - https://en.wikipedia.org/wiki/Ian_Ashbee
- - https://en.wikipedia.org/wiki/Nick_Barmby
legend_rows:
- - ディーン・ウィンダス
  - 1991-2009
  - 初の1部昇格を決めた
- - イアン・アシュビー
  - 2002-2011
  - 4部から1部まで主将
- - ニック・バームビー
  - 2004-2012
  - 地元に戻り2度の昇格

