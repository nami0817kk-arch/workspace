story: rise
why:
- 日本代表で**40試合**に出た中盤、守田英正がいるのがハル・シティです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1904年**です。
- 本拠地はエムケーエム・スタジアム。**約2万5000人**が入ります。
- ホームタウンはキングストン・アポン・ハル。イングランド東部です。
- オーナーはトルコの実業家アジュン・ウルジャル。2022年からクラブを持っています。
- 昨季は2部のプレーオフ決勝でミドルズブラを破り、プレミアに上がってきました。
- プレミアでの最高位は、2013年から14年の**16位**です。
- 1939年には、カーライル・ユナイテッドに**11対1**で勝っています。クラブ最大の勝利です。
- 愛称は「タイガース」。黒と琥珀色の縞模様を、昔から着てきたクラブです。
legends:
- ディーン・ウィンダスは、地元ハル出身のフォワード。あのボレーを決めた男です。
- イアン・アシュビーは、4部から1部まで同じクラブを主将として上げた選手です。
- ニック・バームビーは、イングランド代表経験者が地元に戻り、2度の昇格を支えました。
legend_rows:
- - ディーン・ウィンダス
  - 1991-2009
  - 初の1部昇格を決めた
- - イアン・アシュビー
  - 2002-2011
  - 4部から1部まで主将
- - ニック・バームビー
  - 2004-2012
  - 地元に戻り2度の昇格

