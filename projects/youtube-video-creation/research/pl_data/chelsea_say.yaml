    - - 替えた人
      - 1952年、監督テッド・ドレイク。翌年ライオンに
  say:
  - あだ名はもともと「ペンショナーズ」、年金暮らしの人たち。近くの王立チェルシー病院の退役軍人です。
  - 最初の紋章も、選手でもライオンでもなく、その赤い制服の退役軍人でした。
  - '**1952年**に監督になったテッド・ドレイクが「古くさい」と言って、翌年、いまのライオンの紋章に替えさせました。'
