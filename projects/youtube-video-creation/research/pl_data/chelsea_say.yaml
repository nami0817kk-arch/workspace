story: origin
data:
- 創立は**1905年**。ロンドン西部のクラブです。
- 本拠地はスタンフォード・ブリッジ。**4万44人**が入ります。
- ホームタウンはロンドンの、チェルシー地区です。
- オーナーはブルーコという投資グループ。投資会社のクリアレイクが握っています。
- 1部リーグの優勝は**6回**。FAカップは8回あります。
- チャンピオンズリーグからカンファレンスリーグまで、ヨーロッパの主要な大会を**すべて獲った**、史上唯一のクラブです。
- 直近のタイトルは2025年のクラブワールドカップ。決勝でパリ・サンジェルマンを破りました。
- 愛称は「ザ・ブルーズ」。青です。
legends:
- フランク・ランパードは、中盤の選手でありながらクラブ史上最多の**211得点**を挙げました。
- ジョン・テリーは19年在籍した主将。2005年からのプレミア優勝**5回**、すべてで主将でした。
- ディディエ・ドログバは、2012年のチャンピオンズリーグ決勝、バイエルン相手に88分の同点弾。PK戦も決めて、クラブ初のチャンピオンズリーグ優勝でした。
legend_rows:
- - フランク・ランパード
  - 2001-2014
  - クラブ最多の211得点
- - ジョン・テリー
  - 1998-2017
  - 黄金期を率いた主将
- - ディディエ・ドログバ
  - 2004-2015
  - 2012年CL決勝の同点弾

