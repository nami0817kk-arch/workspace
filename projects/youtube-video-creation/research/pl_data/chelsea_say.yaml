story: origin
data:
- 創立は**1905年**。ロンドンのクラブです。
- 本拠地には**4万44人**が入ります。
- オーナーはブルーコという投資グループです。
- 1部リーグの優勝は**6回**。FAカップは8回、ヨーロッパのタイトルは9回あります。
- UEFAの主要な大会を**すべて獲った**、史上唯一のクラブです。
- 直近のタイトルは2025年のクラブワールドカップ。決勝でパリ・サンジェルマンを破りました。
- 愛称は「ザ・ブルーズ」。青です。
legends:
- フランク・ランパードは、中盤の選手でありながらクラブ史上最多の**211得点**を挙げました。
- ジョン・テリーは19年在籍した主将。クラブの黄金期をすべて率いました。
- ディディエ・ドログバは、2012年のチャンピオンズリーグ決勝で88分に同点弾、PK戦でも決めて、クラブを**初の欧州王者**にしました。
legend_rows:
- - フランク・ランパード
  - 2001-2014
  - クラブ最多の211得点
- - ジョン・テリー
  - 1998-2017
  - 黄金期を率いた主将
