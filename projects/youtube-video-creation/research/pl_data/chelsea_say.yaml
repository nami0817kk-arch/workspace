# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 裏は 2026–27 Chelsea F.C. season（アロンソ4年契約・今季は欧州の大会なし）とクラブ記事（2025年CWC）
# **本人の言葉を1つ**（2026-09-22）。ドログバが2014年にクラブへ戻ったときの言葉。
# 原文（Didier Drogba の記事）: "Everyone knows the special relationship I have with this club
# and it has always felt like home to me."
reasons:
- レアル・マドリードを率いたシャビ・アロンソが、**4年**契約でこの夏に来ました。
- 名選手ディディエ・ドログバが、クラブに戻った日の言葉です。
- {voice: ディディエ・ドログバ, text: このクラブとの特別な関係は皆が知っている。ずっと我が家だった}
- 去年の夏に世界一を決める大会で優勝し、今季はヨーロッパの大会なし。プレミアだけに力を注げる**1年**です。
- "1905年、空いたスタジアムを埋めるために作られたクラブです。"
reasons_sources:
- https://en.wikipedia.org/wiki/Didier_Drogba
