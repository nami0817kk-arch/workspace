story: origin
data:
- 創立は**1905年**。ロンドン西部のクラブです。
- 愛称は「ザ・ブルーズ」。青です。
- ホームタウンはロンドンの、チェルシー地区。
- 本拠地はスタンフォード・ブリッジ。**4万と44人**が入ります。
- オーナーは投資グループのブルーコ。その中心が、投資会社のクリアレイクです。
- 1部リーグの優勝は**6回**。FAカップは8回あります。
- チャンピオンズリーグ2回、ヨーロッパリーグ2回、カップウィナーズカップ2回、カンファレンスリーグ1回。
- ヨーロッパの主要な大会を**すべて獲った**、史上唯一のクラブです。
- 直近のタイトルは2025年のクラブワールドカップ。決勝でパリ・サンジェルマンを破りました。
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=誰か、2行目=決定的な試合や記録、3行目=残したもの。裏は各選手の Wikipedia
legends:
- - フランク・ランパードは2001年、ウェストハムから**1100万ポンド**で来た中盤の選手です。
  - 2013年、アストン・ヴィラに2対1で勝った試合で、クラブ最多の**211得点**に届きました。
  - 2019年には監督として戻り、2023年にも一度、指揮を執りました。
- - ジョン・テリーは14歳で加わった生え抜きのセンターバックです。
  - 2004年に主将となり、プレミア優勝**5回**。最初の2005年は、50年ぶりの1部優勝でした。
  - 最後の試合は2017年、サンダーランドに5対1の勝利。背番号と同じ**26分**に退きました。
- - ディディエ・ドログバは2004年、マルセイユから**2400万ポンド**で加わったフォワード。
  - 2012年チャンピオンズリーグ決勝、バイエルン相手に**88分**の同点弾。PK戦の最後のキックも決めました。
  - 2014年に戻ってもう一度優勝。外国人選手としてクラブ最多の**157得点**を残しました。
legend_sources:
- - https://en.wikipedia.org/wiki/Frank_Lampard
- - https://en.wikipedia.org/wiki/John_Terry
- - https://en.wikipedia.org/wiki/Didier_Drogba
legend_rows:
