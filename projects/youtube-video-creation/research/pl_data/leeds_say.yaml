opening: "創立**1919年**。20クラブのなかで、いちばん新しい。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 古い1部の最後の王者
  tier: 背景
  telop: 旧1部、最後のチャンピオン
  narrator: 解説
  card:
    type: table
    title: 古い1部の最後の王者
    columns:
    - ''
    - ''
    rows:
    - - 1991-92年
      - 1部リーグ優勝
    - - 1992-93年
      - 17位。アウェーで未勝利
    - - 1992年11月
      - カントナを120万ポンドでマンチェスター・ユナイテッドへ
  # 2026-09-22 流れの点検2回目: 「そのシーズン」が優勝の季に聞こえて矛盾するので「翌シーズン」に。
  # 優勝→翌季17位→その途中でカントナ「も」売却、と一方向に並べた
  say:
  - リーズは、プレミアリーグができる直前、**1991年から92年**の1部リーグの優勝チームです。
  - ところが、その翌シーズンはアウェーで1勝もできず、**17位**に沈みました。
  - エリック・カントナも、11月に**120万ポンド**でマンチェスター・ユナイテッドへ売られました。
  sources:
  - https://en.wikipedia.org/wiki/History_of_Leeds_United_F.C.
