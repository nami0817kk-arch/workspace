story: birth
why:
- 日本代表の田中碧は、リーズでリーグ戦**74試合**、8得点を挙げている中盤です。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 本拠地はエランド・ロード。**約3万8000人**が入ります。
- オーナーはアメフト球団、サンフランシスコ・フォーティナイナーズの会社。2023年からです。
- 1部リーグの優勝は**3回**。FAカップとリーグカップが1回ずつ。
- ヨーロッパの大会、フェアーズカップも2回制しています。
- 愛称は「ホワイツ」。真っ白なユニフォームからです。
- この白は、1960年代のドン・レヴィー監督が**レアル・マドリード**に倣ったものです。
- 1968年から69年は**34試合負けなし**。いまもクラブ記録です。
- このシーズンが、レヴィー監督のもとでの初優勝でした。
- 直近のタイトルは2024年から25年の2部優勝です。
- 2部から上がった昨季は、プレミアで**14位**。勝ち点は47でした。
legends:
- ゲイリー・ケリーは15年在籍した右サイドバック。**531試合**に出ました。
- ルーカス・ラデベは、2001年のチャンピオンズリーグ4強のときの主将。南アフリカ代表です。
- マーク・ビドゥカは、加入1年目のリヴァプール戦で1人で**4得点**。4対3で勝ちました。
legend_rows:
- - ゲイリー・ケリー
  - 1992-2007
  - 15年在籍・531試合
- - ルーカス・ラデベ
