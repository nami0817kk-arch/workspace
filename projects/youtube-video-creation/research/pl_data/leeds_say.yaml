  say:
  - リーズは、プレミアリーグができる直前、**1991年から92年**の1部リーグの優勝チームです。
  - 翌年からリーグの名前がプレミアリーグに変わったので、古い1部の最後のチャンピオンとして名前が残っています。
  - その優勝チームにいたエリック・カントナは、1992年11月に**120万ポンド**でマンチェスター・ユナイテッドへ売られました。
