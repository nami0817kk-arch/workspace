story: birth
why:
- 日本代表の田中碧が所属しているのが、リーズ・ユナイテッドです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1919年**。本拠地には**3万7633人**が入ります。
- オーナーは、アメリカンフットボールのフォーティナイナーズにつながる投資グループ。2023年に完全に買い取りました。
- 1部リーグの優勝は**3回**。FAカップとリーグカップが1回ずつ、ヨーロッパのフェアーズカップを2回獲っています。
- 直近のタイトルは2024年から25年の2部優勝です。
- 1968年から69年にかけては、**34試合続けて負けなし**。いまも破られていないクラブ記録です。
legends:
- ゲイリー・ケリーは15年在籍した右サイドバック。**531試合**に出ました。
- ルーカス・ラデベは、チャンピオンズリーグ準決勝まで進んだころの守備を、主将として率いた南アフリカ代表です。
- マーク・ビドゥカは、リヴァプール戦で1人で4得点を挙げたこともある、ヨーロッパ挑戦期の看板フォワードです。
