story: birth
why:
- 日本代表の田中碧は、リーズでリーグ戦**74試合**、8得点を挙げている中盤です。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 愛称は「ホワイツ」。真っ白なユニフォームからです。
- この白は、1960年代のドン・レヴィー監督が**レアル・マドリード**に倣ったものです。
- 本拠地はエランド・ロード。**約3万8000人**が入ります。
- オーナーはアメフト球団、サンフランシスコ・フォーティナイナーズの会社。2023年からです。
- 1部リーグの優勝は**3回**。FAカップとリーグカップが1回ずつ。
- ヨーロッパの大会、フェアーズカップも2回制しています。
- 1968年から69年は**34試合負けなし**。いまもクラブ記録です。
- このシーズンが、レヴィー監督のもとでの初優勝でした。
- 直近のタイトルは2024年から25年の2部優勝です。
- 2部から上がった昨季は、プレミアで**14位**。勝ち点は47でした。
# **1人3行**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=どんな選手か、2行目=決定的な場面、3行目=残したもの。出典は各選手の Wikipedia
legends:
- - ゲイリー・ケリーはアイルランド出身の右サイドバック。生涯リーズひと筋でした。
  - もとはフォワード。監督に右サイドバックへ変えられ、**531試合**に出ました。
  - 2002年の記念試合で集めた**150万ポンド**で、故郷にがんの治療施設を建てました。
- - ルーカス・ラデベは南アフリカのセンターバック。1994年、**25万ポンド**の移籍でした。
  - 1998年から主将。2001年には、チャンピオンズリーグの4強までチームを率いています。
  - 南アフリカ代表でも主将。2005年の記念試合には**3万7886人**が入りました。
- - マーク・ビドゥカは2000年、セルティックから**600万ポンド**で来たフォワードです。
  - 1年目に**22得点**。4点はリヴァプールに4対3で勝った試合で、1人で決めました。
  - 2004年に降格すると、ミドルズブラへ**450万ポンド**で売られました。
legend_sources:
- - https://en.wikipedia.org/wiki/Gary_Kelly_(footballer,_born_1974)
- - https://en.wikipedia.org/wiki/Lucas_Radebe
- - https://en.wikipedia.org/wiki/Mark_Viduka
legend_rows:
- - ゲイリー・ケリー
  - 1992-2007
  - 15年在籍・531試合
- - ルーカス・ラデベ
  - 1994-2005
  - 2001年CL4強の主将
- - マーク・ビドゥカ
  - 2000-2004
  - リヴァプール戦で4得点

