# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。冒頭の直後に置き、ショートはここから。旧 why はこの節に吸収
reasons:
- 日本代表の中盤、田中碧が、ここでリーグ戦**74試合**、8得点を挙げています。
- 今季はまだ負けていません。開幕から**5試合**、負けなしの5位です。
- 昇格1年目の昨季は**14位**で残留。2年目の今季は、監督4年目のファルケが率います。
reasons_telop: 田中碧がいる。開幕5試合負けなしの5位
