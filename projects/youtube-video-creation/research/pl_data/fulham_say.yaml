story: titles
data:
- 創立は**1879年**。セント・アンドリューズ教会のクラブとして始まりました。
- 本拠地はテムズ川沿いのクレイヴン・コテージ。**2万8107人**が入ります。
- オーナーはアメリカの実業家シャヒド・カーン。2013年からクラブを持っています。
- 1部リーグの優勝はありませんが、ヨーロッパのタイトルを1回獲っています。
- プレミアでの最高位は、2008年から09年の**7位**です。
- 最多出場はジョニー・ヘインズ。1952年から70年に**658試合**に出ました。
- 愛称は「コテジャーズ」。小屋に住む人、という意味です。
legends:
- アレクサンダル・ミトロヴィッチは、2021年から22年に2部で**43得点**。46試合のリーグでの最多記録です。
- トム・ケアニーは10年以上在籍する主将。2018年のプレーオフ決勝で決勝点を決め、クラブをプレミアに戻しました。
- クリント・デンプシーは、クラブのプレミアリーグ最多となる**50得点**を挙げています。
