story: titles
data:
- 教会のクラブとして始まり、ロンドンでは1861年起源のクリスタル・パレスに次いで古いプロクラブです。
- 愛称は「コテジャーズ」。小屋に住む人、という意味。
- 本拠地はテムズ川沿いのクレイヴン・コテージ。**2万8107人**が入ります。
- オーナーはアメリカの実業家シャヒド・カーン。2013年からクラブを持っています。
- 1部リーグの優勝はありませんが、ヨーロッパのインタートトカップを1回獲っています。
- クラブ最多出場は、イングランド代表の主将も務めたジョニー・ヘインズ。**658試合**です。
- プレミアでの最高位は、2008年から09年の**7位**です。
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=誰か、2行目=決定的な試合や記録、3行目=残したもの。裏は各選手の Wikipedia。
# ケアニーの「主将」「340試合」は登録選手の節で読むのでここでは言わない
legends:
- - アレクサンダル・ミトロヴィッチは、ニューカッスルから**2200万ポンド**で来たセルビア人。
  - 2021年から22年、2部で**43得点**。46試合制になってからの1シーズン最多記録です。
  - 111得点を残し、2023年にクラブ史上最高の**5000万ポンド**でアル・ヒラルへ移りました。
- - トム・ケアニーは2015年、ブラックバーンから**300万ポンド**で加わった中盤の選手。
  - 2018年のプレーオフ決勝は、アストン・ヴィラに**1対0**。その1点を決めたのがケアニーです。
  - 2016年から17年は2部の最優秀選手。クラブと共に**3回**の昇格を経験しました。
# デンプシーの「万ポンドで来た」がミトロヴィッチの行と重なるので「移籍した」にした
- - クリント・デンプシーは2007年、アメリカのリーグから**200万ポンド**で移籍した攻撃の選手。
  - 2010年、ユヴェントスに**4対1**で勝ったヨーロッパの試合で、ループシュートを決めました。
  - クラブのプレミア最多となる**50得点**を残し、2012年にトッテナムへ移りました。
legend_sources:
- - https://en.wikipedia.org/wiki/Aleksandar_Mitrovi%C4%87
- - https://en.wikipedia.org/wiki/Tom_Cairney
- - https://en.wikipedia.org/wiki/Clint_Dempsey
