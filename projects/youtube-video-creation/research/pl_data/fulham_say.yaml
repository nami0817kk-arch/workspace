# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 裏は 2026–27 Fulham F.C. season（シルバが5年で退任→アルベロア・5試合0勝2分3敗で19位・
# ヒメネスとウィルソンが退団）。得点上位2人の点数は 09-16 のノートから
# **本人の言葉を1つ**（2026-09-22）。1966年W杯優勝の右サイドバック、ジョージ・コーエンが
# 同僚ジョニー・ヘインズを語った言葉。原文（Johnny Haynes の記事）:
# "Haynes could give you goose bumps on a wet night in a match that didn't matter."
reasons:
- '**5年**続いた監督が代わり、レアル・マドリードからアルバロ・アルベロアが来ました。'
- ワールドカップ優勝のジョージ・コーエンが、同僚ジョニー・ヘインズをこう語ります。
- {voice: ジョージ・コーエン, text: ヘインズは雨の夜のどうでもいい試合でも鳥肌を立たせてくれた}
- 開幕**5試合**で勝ちがなく下から2番目。**11点**のハリー・ウィルソンら昨季の得点上位2人も去りました。
reasons_sources:
- https://en.wikipedia.org/wiki/Johnny_Haynes
