# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。オープニングの直後に読み、ショートもここから切る。
# 日本人の入口（why）はこの節に吸収される。1つ目は三笘薫（数字は why の事実をそのまま）。
# 「3対0で下しました」は今季の節で読むので、ここは「3点を奪って勝ちました」
# **本人の言葉を1つ**（2026-09-22）。ショートは16秒までに誰かの言葉が要る。
# ヒュルツェラーの原文（クラブ公式、2026-09-19 アーセナル戦後）: "I think it's very important
# to enjoy this moment, but also understand why we have this moment, why we are successful."
# 「3点を奪って勝ちました」は2行目の「破った夜」に畳んだ（3対0は今季の節で読む）
reasons:
- "三笘薫がリーグ戦**113試合**に出て、**23得点**を挙げているクラブです。"
- "王者アーセナルを破った夜、監督のヒュルツェラーはこう言いました。"
- {voice: ファビアン・ヒュルツェラー, text: "「この瞬間を楽しむのは大事。ただ、なぜ勝てたかも知らないと」"}
- "開幕から5試合で**3勝**を挙げ、順位は**3位**です。"
- "その家を失ったのは1997年、借金を返すためでした。"
reasons_telop: 三笘薫のクラブが、いま3位
reasons_rows:
- ["理由1", "三笘薫がリーグ113試合23得点"]
- ["理由2", "ヒュルツェラー「なぜ勝てているのか」"]
- ["理由3", "開幕5試合で3勝、順位は3位"]
reasons_sources:
- https://www.brightonandhovealbion.com/media-article/mft-interviews-fabian-hurzeler-bha-arsenal-pl-september-2026
people_extra:
- ファビアン・ヒュルツェラー
# 題（2026-09-22 指示「タイトルをもっと視聴者が見たいと思うものに」）
title: 三笘薫のブライトンが、14年間スタジアムを持てなかったのは
short_title: 三笘薫のブライトン、家が無かった14年
# このクラブの特徴（2026-09-23 指示「三つの要素入れたい！」）。プレーの色・運営の型・クラブの気質。
# 出典は英語版Wikipedia とクラブ公式。要確認は research/pl_data/features_notes.md
features:
- "ヒュルツェラーのサッカーは高い位置で奪う守りが看板。昨季は敵陣でボールを奪った回数がリーグ最多。"
- "安く獲って高く売る型。ミッドフィールダーのカイセドは2年半でチェルシーへ、1億ポンド以上でした。"
- "入場のとき流れる応援歌は、1907年に書かれたサセックスの歌で、最後のサビは観客だけで歌います。"
features_telop: "高い位置で奪う。育てて売る"
