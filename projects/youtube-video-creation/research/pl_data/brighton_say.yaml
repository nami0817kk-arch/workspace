story: home
# **流れの点検（output/flow/20260920_pl05_brighton.md）を受けて直した**（2026-09-22）。
# 入口は題を読み直しただけだったので、三笘のこと（リーグ戦の数字は <key>_raw.json）を言う
why:
- 三笘薫は、ブライトンのリーグ戦で**113試合**に出て、**23得点**を挙げています。
# 「タイトルはまだ無い」はオープニングで読んでいるので、直近のタイトル（3部優勝）に替えた。
# 本拠地の行は「14年のあいだ家が無かった」引きをショートの中で受ける
data:
- 創立は**1901年**。1920年にフットボールリーグに加わりました。
- 愛称は「シーガルズ」。カモメです。
- ホームタウンは、イングランド南の海沿いの町、ブライトン・アンド・ホーヴ。
- 本拠地はファルマー・スタジアム。**3万2176人**。ようやく持てた、自分たちの家です。
- オーナーはトニー・ブルーム。2009年に会長になり、株の75%を持っています。
- 直近のタイトルは、2010年から11年の3部優勝です。
- プレミアでの最高位は、2022年から23年の**6位**です。
# 順番は ザモラ → マレー → ダンク（クラブが上がっていく順。2026-09-22）。
# ダンクは登録選手の節でも主将として「リーグ戦473試合」を読むので、ここでは数字を出さない。
# 2026-09-22（3回目）: 「主将」も登録選手の節で読むので、ここは3部からの一筋だけにする
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目＝誰か（来歴）、2行目＝決定的な場面、3行目＝残したもの。各行45字まで。
# マレーの2016-17の23得点は、三笘の「23得点」と同じ数字になるので読まない（数字の言い直しで止まる）。
# ダンクの2023年10月マルセイユ戦は「自身初」の欧州の試合（クラブ初の欧州戦は9月のAEK戦）
legends:
- - ボビー・ザモラは2000年、ブリストル・ローヴァーズから期限付きで来て、6試合で6得点。
  - 10万ポンドで買い取ると、2年続けて**28得点**。4部と3部で続けて優勝し、2部へ上げました。
  - 2003年に150万ポンドでトッテナムへ。12年後に戻り、また得点を決めました。
- - グレン・マレーは2008年、ロッチデールから**30万ポンド**で来たストライカー。
  - 2011年に離れ、2016年に戻ってプレミア初昇格の得点源に。初のプレミアで12得点です。
  - クラブ通算**111得点**は歴代2位。1位は1920年代のトミー・クックで、123点です。
- - ルイス・ダンクはブライトン生まれ。2003年に育成組織へ入り、3部だった2010年にデビュー。
  - 2023年10月、自身初のヨーロッパの試合。マルセイユで0対2から追いついて、2対2のドロー。
  - 2025年12月、通算**500試合**に到達。イングランド代表でも6試合に出場しました。
legend_sources:
- - https://en.wikipedia.org/wiki/Bobby_Zamora
- - https://en.wikipedia.org/wiki/Glenn_Murray
- - https://en.wikipedia.org/wiki/Lewis_Dunk
legend_rows:
- - ボビー・ザモラ
  - 2000-2003
  - 136試合83得点。2年続けて優勝
- - グレン・マレー
  - 2008-2021
  - プレミア初昇格の得点源
- - ルイス・ダンク
  - 2010-
  - 2010年のデビュー以来、3部の時代から一筋

# **引きを書き換えた**（2026-09-20）。宿敵の節を落としたので、
# 宿敵を約束する引きのままだと、その話を一度もしないことになる
hook: "1997年から2011年まで、よそのスタジアムを借りて戦っていました。"

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる。
# タイトルの行は「直近のタイトル」（タイル5）。「タイトル歴」を読まないので、
# トロフィーの板はこの行に出る
data_focus: [0, 1, 2, 3, 4, 7, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "1部も、FAカップも、リーグカップも。優勝はまだゼロ。"

# 「日本の三笘薫がいます。三笘薫は日本代表で」と名前が2回続いていた（2026-09-22）
squad_about:
  三笘薫: 日本代表で**31試合**に出ています。

# 3位の根拠になっている第5節（王者アーセナルに3対0）を声が拾っていなかった（2026-09-22）
season:
- 第5節は、昨季王者のアーセナルをホームで3対0で下しました。
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ。
# ゴードン・スミスがどちらの選手か言っていなかった／「0対4」に勝敗が無かった
episode:
  id: episode
  heading: 決めるはずだった一撃
  tier: 背景
  telop: 1983年FAカップ決勝、最後のワンプレー
  narrator: 解説
  card:
    type: table
    title: 決めるはずだった一撃
    columns:
    - ''
    - ''
    rows:
    - - 1983年 FAカップ決勝
      - マンチェスター・ユナイテッドと2対2
    - - 延長の最後
      - ブライトンのゴードン・スミスが外す
    - - 再試合
      - 0対4で敗戦。同じシーズンにリーグ最下位
  say:
  - {text: "1983年、初めてFAカップの決勝に立ちました。相手はマンチェスター・ユナイテッド。", image: assets/backgrounds/stadium_ブライトン_in.png}
  - 2対2の引き分けのまま、延長の最後のワンプレーを迎えます。
  - そこで、ブライトンのゴードン・スミスの決定機が外れました。
  - 再試合は0対4で敗れました。同じシーズン、リーグでは最下位で降格しています。
  sources:
  - https://en.wikipedia.org/wiki/Brighton_%26_Hove_Albion_F.C.
# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
manager:
- 監督はドイツ人のファビアン・ヒュルツェラー。**2024年6月**から、3年目です。
- 就任のとき**31歳**。プレミアリーグの正式な監督では、史上最年少でした。
manager_telop: 監督はファビアン・ヒュルツェラー。3年目
manager_rows:
