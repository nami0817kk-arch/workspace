story: home
why:
- 日本代表の三笘薫が所属しているのが、ブライトンです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1901年**。1920年にフットボールリーグに加わりました。
- 本拠地はファルマー・スタジアム。**3万2176人**が入ります。
- ホームタウンは、イングランド南の海沿いの町ブライトン・アンド・ホーヴ。
- オーナーはトニー・ブルーム。2009年に会長になり、株の75%を持っています。
- 1部リーグの優勝やカップのタイトルは、まだありません。
- プレミアでの最高位は、2022年から23年の**6位**。クラブの歴史で一番の順位です。
- 愛称は「シーガルズ」。カモメです。
legends:
- ルイス・ダンクは、ブライトン一筋で**500試合**を超えた主将です。
- グレン・マレーは、2016年から17年のプレミア初昇格を決めた得点源です。
- ボビー・ザモラは、136試合で**83得点**。2年続けて優勝し、クラブを2段上げました。
