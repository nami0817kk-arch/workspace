# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 日本人の入口（why）はここに吸収。裏は Tatsuhiro Sakamoto の記事（107試合18得点）と
# 2026–27 Coventry City F.C. season（2001年以来の1部・5試合1勝4敗で18位）
# **本人の言葉を1つ**（2026-09-22）。1987年FAカップ決勝のあとの監督ジョン・シレット。
# 原文（1987 FA Cup final の記事）: "The longer the game went on, the more certain I was
# that we were going to win it"
reasons:
- 坂元達裕が、リーグ戦**107試合**で**18得点**。今季はプレミアで初めてのシーズンです。
- 唯一の優勝を決めた日、監督ジョン・シレットはこう言いました。
- {voice: ジョン・シレット, text: 試合が長引くほど、勝てるという確信が強くなっていった}
- 昨季は2部で優勝し、**25年ぶり**の1部。開幕5試合で勝ちは**1つ**、早くも残留争いの中にいます。
reasons_sources:
- https://en.wikipedia.org/wiki/1987_FA_Cup_final
