story: exile
why:
- 日本の坂元達裕が所属しているのが、今季プレミアに上がってきたコヴェントリー・シティです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1883年**。自転車を作るシンガー社の工員たちが作ったクラブです。
- 本拠地はシービーエス・アリーナ。**3万2609人**が入ります。
- オーナーは地元の実業家ダグ・キング。2023年からクラブを持っています。
- 1部リーグの優勝はありませんが、1987年にFAカップを獲っています。
- そして昨季、2025年から26年に2部で優勝。プレミアに戻ってきました。
- 1931年から32年には、クラリー・バートンが1シーズンで**50得点**を挙げています。
- 愛称は「スカイブルーズ」。空色です。
legends:
- スティーヴ・オグリゾヴィッチは、16年間ゴールを守り、1987年のFAカップ優勝も経験したキーパーです。
- ディオン・ダブリンは1997年から98年、プレミアリーグで**得点王**になりました。クラブ唯一の記録です。
- ゲイリー・マカリスターは、残留争いを主将として戦い抜いた司令塔です。
legend_rows:
- - スティーヴ・オグリゾヴィッチ
  - 1984-2000
  - 1987年FA杯優勝のGK
- - ディオン・ダブリン
  - 1994-1998
  - クラブ唯一のプレミア得点王
- - ゲイリー・マカリスター
  - 1996-2000
  - 残留争いを戦った主将

