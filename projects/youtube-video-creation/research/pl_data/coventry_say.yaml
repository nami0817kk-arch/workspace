story: exile
why:
- 坂元達裕は、このクラブでリーグ戦**107試合**に出て、**18得点**を挙げています。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1883年**。自転車を作るシンガー社の工員たちが作りました。
- 愛称は「スカイブルーズ」。空色です。
- 本拠地はシービーエス・アリーナ。**3万2609人**が入ります。
- オーナーは地元の実業家ダグ・キング。2023年からクラブを持っています。
- 1部リーグの優勝も、リーグカップの優勝もありません。FAカップが1回です。
- 1シーズンの最多得点は、クラリー・バートンの**50得点**。1931年から32年の記録です。
- 直近の優勝は、昨季の2部リーグ。
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=誰か、2行目=決定的な試合や記録、3行目=残したもの。裏は各選手の Wikipedia。
# ダブリンの「18得点」は坂元の行と同じ数字になるので読まない
legends:
- - スティーヴ・オグリゾヴィッチは1984年、シュルーズベリーから加わったキーパーです。
  - 1986年、シェフィールド・ウェンズデイ戦。2対2の引き分けで、キーパーながら得点しました。
  - クラブ記録の**601試合**に出て、引退後も2019年までキーパーのコーチを務めました。
- - ディオン・ダブリンは1994年、マンチェスター・ユナイテッドから来たフォワードです。
  - 1997年から98年はプレミアの**得点王**。マイケル・オーウェンらと並んでの受賞でした。
  - リーグ戦で61得点を残し、1998年に**575万ポンド**でアストン・ヴィラへ移りました。
- - ゲイリー・マカリスターは1996年、リーズから**300万ポンド**で来た31歳の司令塔。
  - 主将として残留争いを戦い抜き、1999年から2000年には年間最優秀選手に選ばれました。
  - 2000年に35歳でリヴァプールへ移り、2002年には監督兼選手として戻ってきました。
legend_sources:
- - https://en.wikipedia.org/wiki/Steve_Ogrizovic
- - https://en.wikipedia.org/wiki/Dion_Dublin
- - https://en.wikipedia.org/wiki/Gary_McAllister
legend_rows:
- - スティーヴ・オグリゾヴィッチ
  - 1984-2000
  - 1987年FA杯優勝のGK
- - ディオン・ダブリン
  - 1994-1998
  - クラブ唯一のプレミア得点王
- - ゲイリー・マカリスター
  - 1996-2000
  - 残留争いを戦った主将

