story: exile
why:
- 坂元達裕は、このクラブでリーグ戦**107試合**に出て、**18得点**を挙げています。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1883年**。自転車を作るシンガー社の工員たちが作ったクラブです。
- 愛称は「スカイブルーズ」。空色です。
- 本拠地はシービーエス・アリーナ。**3万2609人**が入ります。
- オーナーは地元の実業家ダグ・キング。2023年からクラブを持っています。
- 1部リーグの優勝も、リーグカップの優勝もありません。FAカップが1回です。
- 1シーズンの最多得点は、クラリー・バートンの**50得点**。1931年から32年の記録です。
- 直近の優勝は、昨季の2部リーグです。
legends:
- スティーヴ・オグリゾヴィッチは、16年間ゴールを守ったキーパー。クラブ記録の**601試合**に出て、あのFAカップ決勝も守りました。
- ディオン・ダブリンは1997年から98年、プレミアリーグの**得点王**。このクラブから得点王が出たのは、この一度だけです。
- ゲイリー・マカリスターは、1996年からの4年間、残留争いを主将として戦い抜いた司令塔です。
legend_rows:
- - スティーヴ・オグリゾヴィッチ
  - 1984-2000
  - 1987年FA杯優勝のGK
- - ディオン・ダブリン
  - 1994-1998
  - クラブ唯一のプレミア得点王
- - ゲイリー・マカリスター
  - 1996-2000
  - 残留争いを戦った主将

