# Sunderland 1–0 AZ、Stadium of Light）で勝ちを確認。AZ はアルファベットなので街の名で読む
season:
- ヨーロッパリーグの初戦は、ホームで、オランダのアルクマールでした。
- '**1対0**の勝ち。ヨーロッパの初戦を白星で飾りました。'
