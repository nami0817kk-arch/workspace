opening: "**1部リーグ優勝6回**。その歴史を持つ、北東部の古豪です。"
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: イングランド銀行クラブ
  tier: 背景
  telop: 「イングランド銀行クラブ」の代償
  narrator: 解説
  card:
    type: table
    title: イングランド銀行クラブ
    columns:
    - ''
    - ''
    rows:
    - - 戦後
      - 大金で選手を集める。あだ名「イングランド銀行クラブ」
    - - 1957年
      - 上限を超える給料。罰金5000ポンド
    - - 翌年
      - 68年で初めて1部から降格
  say:
  - 戦後まもなく、大金で選手を集め、「イングランド銀行クラブ」と呼ばれました。
  # 2026-09-22 流れの点検。当時は給料に上限があった、と先に言う。「翌年、68年」が
  # 1968年に聞こえるので言い換えた
  - 当時は選手の給料に上限がありました。ところが**1957年**、それを超える支払いが発覚します。
  - 5000ポンドの罰金。会長と役員3人が資格停止になりました。
  # 2026-09-22 2回目。68年はリーグ創設（1888年）からではなく、このクラブがリーグに入った
  # 1890年から数えた年数（1958年）。読み上げの側だけ直す
  - その翌年、リーグに入って68年で初めて、1部から落ちました。
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.

# 2026-09-22 2回目。ヨーロッパリーグの初戦は動画を出す前に済んでいる。ボーンマスと同じ型で
