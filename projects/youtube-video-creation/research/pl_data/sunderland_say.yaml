story: fall
data:
- 創立は**1879年**。地元の先生たちが作ったチームが始まりです。
- 愛称は「ブラック・キャッツ」。黒猫です。
- ホームタウンは、サンダーランドの街。
# 2026-09-22 流れの点検。オーナーはいつからか（2021年）、勝ち点105は何部か（2部）を足した。
# 昨季の7位は、クラブの話の節で「最高位に並んだ」と受ける
- 本拠地はスタジアム・オブ・ライト。**4万8095人**が入ります。
# 2026-09-22 2回目。6回は冒頭の一言で読むので、ここでは受けるだけ
- オーナーはキリル・ルイ＝ドレフュス。2021年から、株の64%を持っています。
- 1部リーグの優勝は、さきほどの**6回**。FAカップも2回獲っています。
- 1998年から99年には、2部で勝ち点**105**。当時のリーグの最多記録でした。
- プレミアでの最高位は**7位**。2000年から01年と、昨季の2回です。
# 2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」。1人3行（来歴・山場・残したもの）。
# 事実は各選手の英語版Wikipedia（legend_sources）。ボールの1992年の決勝は「2部のクラブとして」と
# 言わない（クラブの話の節の1973年と同じ言い回しになる）
legends:
- - ケヴィン・フィリップスは、ワトフォードから**32万5千ポンド**で来たストライカーです。
  - 2000年、プレミアで**30得点**の得点王。ヨーロッパの得点王もイングランド人で初めてでした。
  - リーグ戦で**208試合113得点**。2003年、325万ポンドでサウサンプトンへ移りました。
- - ナイアル・クインは、身長**193センチ**のフォワード。マンチェスター・シティから来ました。
  - フィリップスとの2トップで、2人合わせて**194得点**。「大と小」と呼ばれたコンビでした。
  - 引退試合の収益**100万ポンド**を子どもの病院に寄付。2006年にはクラブの会長になりました。
- - ケヴィン・ボールは、ポーツマスから来たディフェンダー。のちに中盤へ移り、主将になりました。
  - 1992年、2部にいながらFAカップ決勝へ。リヴァプールに**0対2**で敗れました。
  - 主将として1996年と99年、クラブを1部へ。引退後も暫定監督を**2度**務めています。
legend_sources:
- - https://en.wikipedia.org/wiki/Kevin_Phillips_(English_footballer)
- - https://en.wikipedia.org/wiki/Niall_Quinn
- - https://en.wikipedia.org/wiki/Kevin_Ball
legend_rows:
- - ケヴィン・フィリップス
  - 1997-2003
  - プレミア得点王・欧州得点王
- - ナイアル・クイン
  - 1996-2002
  - 2トップの柱、のちに会長
- - ケヴィン・ボール
  - 1990-1999
  - 2度の昇格を率いた主将

