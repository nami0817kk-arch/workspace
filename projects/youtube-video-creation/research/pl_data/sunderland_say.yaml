  - 戦後まもなく、大金で選手を集め、「イングランド銀行クラブ」と呼ばれました。
  - ところが**1957年**、選手に上限を超える給料を払っていたことが分かり、5000ポンドの罰金。会長と役員3人が資格停止になります。
  - 翌年、68年のリーグの歴史で初めて、1部から落ちました。
