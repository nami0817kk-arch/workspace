story: fall
data:
- 創立は**1879年**。地元の先生たちが作ったチームが始まりです。
- 本拠地はスタジアム・オブ・ライト。**4万8095人**が入ります。
- ホームタウンは、サンダーランドの街です。
# 2026-09-22 流れの点検。オーナーはいつからか（2021年）、勝ち点105は何部か（2部）を足した。
# 昨季の7位は、クラブの話の節で「最高位に並んだ」と受ける
- オーナーはキリル・ルイ＝ドレフュス。2021年から、株の64%を持っています。
- 1部リーグの優勝は**6回**。FAカップも2回獲っています。
- 1998年から99年には、2部で勝ち点**105**。当時のリーグの最多記録でした。
- プレミアでの最高位は**7位**。2000年から01年と、昨季の2回です。
- 愛称は「ブラック・キャッツ」。黒猫です。
legends:
- ケヴィン・フィリップスは、1999年から2000年にプレミアの**得点王**。ヨーロッパのゴールデンシューも獲りました。
- ナイアル・クインは、フィリップスとの2トップでクラブの一番いい時代を作り、のちに会長も務めました。
- ケヴィン・ボールは主将として、1996年と99年の2度、クラブを1部に上げました。
legend_rows:
- - ケヴィン・フィリップス
  - 1997-2003
  - プレミア得点王・欧州得点王
- - ナイアル・クイン
  - 1996-2002
  - 2トップの柱、のちに会長
- - ケヴィン・ボール
  - 1990-1999
  - 2度の昇格を率いた主将

