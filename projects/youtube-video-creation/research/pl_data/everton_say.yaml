story: move
data:
- 創立は**1878年**。リヴァプールのスタンリー・パークで生まれたクラブです。
- 昨季、2025年から26年に新しいスタジアムへ移りました。**5万2769人**が入ります。
- オーナーはアメリカの実業家ダン・フリードキン。2024年12月からクラブを持っています。
- 1部リーグの優勝は**9回**。FAカップは5回、ヨーロッパのタイトルも1回あります。
- 直近のタイトルは、1994年から95年のFAカップです。
- 1927年から28年には、ディキシー・ディーンが1シーズンで**60得点**。いまもイングランドの記録です。
fans:
- 有名なファンには、元ビートルズのポール・マッカートニーがいます。
- 元ボクシング世界王者のトニー・ベリューは、映画『クリード』に出たとき、練習着とショーツにエヴァートンのバッジを着けて演じました。
legends:
- ネヴィル・サウスオールは、クラブ記録のリーグ**578試合**に出たキーパー。1995年のFAカップ優勝も守りました。
- シェイマス・コールマンは17年在籍した主将。グディソン・パーク最後の世代の象徴です。
- ティム・ケイヒルは、中盤から点を取り続けた選手。2006年のワールドカップで、日本から2点を奪った選手でもあります。
legend_rows:
