opening: "リヴァプールの街から、**1部リーグを9回**。"

# **引きを書き換えた**（2026-09-22）。街のリヴァプールと言い分けるため「赤い」を付け、
# 「同じ家」は移転の節（アンフィールド時代）で回収する
hook: "赤いリヴァプールは、このクラブが出ていった家で始まりました。"

