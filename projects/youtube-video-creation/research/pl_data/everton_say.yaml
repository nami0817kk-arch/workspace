# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
manager:
- 監督はスコットランド人のデイヴィッド・モイーズ。**2025年1月**から、3年目です。
- 2002年から2013年まで率いた時に続く、2度目のエヴァートン監督。前はウェストハムでした。
