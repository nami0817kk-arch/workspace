story: move
data:
- 創立は**1878年**。街の公園、スタンリー・パークで生まれたクラブです。
- 本拠地はヒル・ディキンソン・スタジアム。**5万2769人**が入ります。
- ホームタウンは、港の街リヴァプール。
- オーナーはアメリカの実業家ダン・フリードキン。2024年12月からクラブを持っています。
- 1部リーグの優勝は**9回**。次いでFAカップが5回、ヨーロッパが1回です。
- 直近のタイトルは、1994年から95年のFAカップです。
- 愛称は「トフィーズ」。エヴァートン村にあったキャンディ屋から来ています。
legends:
- ネヴィル・サウスオールは、クラブ記録のリーグ**578試合**に出たキーパー。17年間、ゴールを守りました。
- シェイマス・コールマンは、同じく17年在籍した主将。去年のグディソン・パーク最後の試合も、主将として先発しました。
- ティム・ケイヒルは、中盤から点を取り続けた選手。2006年のワールドカップで、日本から2点を奪った選手でもあります。
legend_rows:
- - ネヴィル・サウスオール
  - 1981-1998
  - クラブ最多578試合のGK
- - シェイマス・コールマン
