story: move
data:
- 創立は**1878年**。街の公園、スタンリー・パークで生まれたクラブです。
- 愛称は「トフィーズ」。エヴァートン村にあったキャンディ屋から来ています。
- ホームタウンは、港の街リヴァプール。
- 本拠地はヒル・ディキンソン・スタジアム。**5万2769人**が入ります。
- オーナーはアメリカの実業家ダン・フリードキン。2024年12月からクラブを持っています。
- 1部リーグの優勝は**9回**。次いでFAカップが5回、カップウィナーズカップが1回です。
- 直近のタイトルは、1994年から95年のFAカップです。
# **1人3行にした**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=誰か、2行目=決定的な試合や記録、3行目=残したもの。裏は各選手の Wikipedia
legends:
- - ネヴィル・サウスオールは1981年、ベリーから**15万ポンド**で来たウェールズ人キーパーです。
  - 1985年、1部優勝とヨーロッパのカップの**2冠**。記者が選ぶ年間最優秀選手にもなりました。
  - リーグ戦**578試合**はいまもクラブ記録。ウェールズ代表でも92試合、長く国の最多でした。
- - シェイマス・コールマンは2009年、アイルランドから**6万ポンド**で来た右サイドバックです。
  - 2013年から14年、リーグ戦で**6得点**。守備の選手ながら、ベストイレブンに入りました。
  - '**2019年**からは主将。去年のグディソン・パーク最後の試合にも先発し、今年の夏に去りました。'
- - ティム・ケイヒルは、2006年のワールドカップで日本から**2点**を奪ったオーストラリア人です。
  - リヴァプールとのダービーで**5得点**。1931年のディクシー・ディーン以来、最多でした。
  - ヘディングだけでリーグ戦**9得点**の年もあり、2012年にニューヨークへ移りました。
legend_sources:
- - https://en.wikipedia.org/wiki/Neville_Southall
- - https://en.wikipedia.org/wiki/S%C3%A9amus_Coleman
- - https://en.wikipedia.org/wiki/Tim_Cahill
legend_rows:
- - ネヴィル・サウスオール
  - 1981-1998
  - クラブ最多578試合のGK
- - シェイマス・コールマン
