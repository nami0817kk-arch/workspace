# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の興味を上げたい」）。
# 裏は 2026–27 Everton F.C. season（5試合2勝3分で7位・グリーリッシュは9月1日にシティから期限付き）
# **本人の言葉を1つ**（2026-09-22）。モイーズが2002年、最初の就任のときに言った言葉。
# 原文（David Moyes の記事）: "I am joining the people's football club. The majority of
# people you meet on the street are Everton fans."
reasons:
- 開幕**5試合**を負けなしで、上から7番目にいます。
- 監督デイヴィッド・モイーズが、最初に来た2002年の言葉です。
- {voice: デイヴィッド・モイーズ, text: 人々のクラブに加わる。街で会う人の大半がエヴァートンファンだ}
- ジャック・グリーリッシュが**9月**、シティから期限付きで加入。港の新本拠地は、まだ**2シーズン目**です。
- "家を替えた理由は、古い家では席を増やせなかったから。"
reasons_sources:
- https://en.wikipedia.org/wiki/David_Moyes
