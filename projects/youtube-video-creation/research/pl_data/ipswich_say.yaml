story: champion
why:
- 日本代表で**30試合**に出たフォワード、前田大然がいるのがイプスウィッチ・タウンです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1878年**です。
- 愛称は「トラクター・ボーイズ」。農業の盛んな土地で、自らを茶化した名です。青いシャツから「ブルーズ」とも。
- 本拠地はポートマン・ロード。**約3万人**が入ります。
- オーナーは、アメリカの投資グループ「ゲームチェンジャー・トゥエンティ」。2021年からです。
- 1部リーグの優勝が**1回**。FAカップ1回、そしてヨーロッパのウエファカップも1回獲っています。
- プレミアでの最高位は、昇格1年目、2000年から01年の**5位**です。
- 2025年に2部へ落ち、昨季は2部で**2位**に入って1年で戻ってきました。
# **順は準決勝→決勝→昇格1年目**（2026-09-22 流れの点検2回目）。ホランドを先にすると
# 決勝を聞いた直後に「その準決勝」で時間が1段戻る
# **1人3行**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=どんな選手か、2行目=決定的な場面、3行目=残したもの。出典は各選手の Wikipedia
legends:
- - ジム・マギルトンは北アイルランド代表の中盤。1999年、約**75万ポンド**で来ました。
  - 2000年のプレーオフ準決勝でボルトンに**ハットトリック**。5対3で勝ちました。
  - ハットトリックはキャリアでこの1度だけ。2006年から3年、監督も務めました。
- - マット・ホランドは1997年、ボーンマスから**80万ポンド**で来た中盤です。
  - 2000年5月、プレーオフ決勝でバーンズリーに4対2。主将としてプレミアへ上げました。
  - 6年間でリーグ戦を休んだのは、代表で呼ばれた1試合だけ。**223試合連続**で出ました。
- - マーカス・スチュワートは**250万ポンド**のフォワード。当時のクラブ最高額です。
  - 決勝でも1点を決め、昇格1年目はプレミアで**19得点**。得点ランキングの2位でした。
  - 2002年の降格でサンダーランドへ。2022年に運動ニューロン疾患と診断されました。
legend_sources:
- - https://en.wikipedia.org/wiki/Jim_Magilton
- - https://en.wikipedia.org/wiki/Matt_Holland
- - https://en.wikipedia.org/wiki/Marcus_Stewart
legend_rows:
- - ジム・マギルトン
  - 1999-2006
  - プレーオフでハットトリック
- - マット・ホランド
  - 1997-2003
  - 223試合連続出場の主将
- - マーカス・スチュワート
  - 2000-2002
  - 昇格1年目に19得点

