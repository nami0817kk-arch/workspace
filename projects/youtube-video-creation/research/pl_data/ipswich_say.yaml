reasons:
- 日本代表**30試合**の前田大然が、この夏ここへ来ました。
- 1部で優勝させた監督、ラムゼイの言葉です。
- {voice: アルフ・ラムゼイ, text: "「イプスウィッチへ行ったとき、私には何の計画も無かった」"}
- 降格から**1年**でプレミアに戻ってきた、昇格組のひとつです。
- 監督も新顔です。ストラスブールから来たギャリー・オニールの**1年目**です。
- "答えは監督です。1962年、ラムゼイが率いて、昇格1年目で1部を制しました。"
