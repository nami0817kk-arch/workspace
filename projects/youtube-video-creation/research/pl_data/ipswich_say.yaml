story: champion
why:
- 日本代表の前田大然が所属しているのが、イプスウィッチ・タウンです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1878年**。フットボールリーグに加わったのは1938年です。
- 本拠地はポートマン・ロード。**3万56人**が入ります。場所はイングランド東部のサフォーク州です。
- オーナーは、アメリカの投資グループが集まったゲームチェンジャー20。2021年からです。
- 1部リーグの優勝が**1回**。FAカップ1回、そしてヨーロッパのUEFAカップも1回獲っています。
- プレミアでの最高位は、2000年から01年の**5位**です。
- 愛称は「トラクター・ボーイズ」。農業の盛んな土地で、自分たちを茶化した呼び名です。
legends:
- マット・ホランドは、**223試合連続**で出場し続けた主将。2000年のプレーオフ決勝でクラブをプレミアに上げました。
- ジム・マギルトンは、プレーオフ準決勝でハットトリックを決め、昇格を決定づけました。
- マーカス・スチュワートは、昇格1年目の2000年から01年にプレミアで**19得点**。クラブを5位に押し上げました。
