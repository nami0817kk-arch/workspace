story: champion
why:
- 日本代表で**30試合**に出たフォワード、前田大然がいるのがイプスウィッチ・タウンです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1878年**です。
- 本拠地はポートマン・ロード。**約3万人**が入ります。
- オーナーは、アメリカの投資グループ「ゲームチェンジャー・トゥエンティ」。2021年からです。
- 1部リーグの優勝が**1回**。FAカップ1回、そしてヨーロッパのウエファカップも1回獲っています。
- プレミアでの最高位は、昇格1年目、2000年から01年の**5位**です。
- 昨季は2部で**2位**に入り、1年でプレミアに戻ってきました。
- 愛称は「トラクター・ボーイズ」。農業の盛んな土地で、自分たちを茶化した呼び名です。
- 青いシャツから、「ブルーズ」とも呼ばれます。
legends:
- マット・ホランドは、**223試合連続**で出場し続けた主将。2000年のプレーオフ決勝でクラブをプレミアに上げました。
- ジム・マギルトンは、その準決勝でボルトン相手に**ハットトリック**。5対3で勝ちました。
- マーカス・スチュワートは、その昇格1年目にプレミアで**19得点**を挙げたフォワードです。
