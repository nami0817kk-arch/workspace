story: birth
why:
- 遠藤航がいるのが、リヴァプールです。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1892年**。本拠地はアンフィールド、**6万1276人**が入ります。
- オーナーはアメリカのFSG。2010年からクラブを持っています。
- 1部リーグの優勝は**20回**。FAカップ8回、リーグカップ10回、チャンピオンズリーグは6回獲っています。
- 直近のタイトルは、2024年から25年のプレミアリーグ優勝です。
- 2017年から18年には、モハメド・サラーが1シーズンで**44得点**を挙げました。
legends:
- スティーヴン・ジェラードは、2005年に**イスタンブールの奇跡**でチャンピオンズリーグを掲げた主将です。
- ジェイミー・キャラガーは、クラブ史上2番目に多い**737試合**に出た生え抜きのディフェンダーです。
- モハメド・サラーは、2017年から18年に38試合制のプレミアで最多の32得点。クラブを代表するエースでした。
