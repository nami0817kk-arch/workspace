story: birth
why:
- 遠藤航は、リヴァプールでリーグ戦**57試合**に出ている日本代表の中盤です。
- では、どんなクラブなのか。まずは基本のデータから見ていきます。
data:
- 創立は**1892年**です。
- 愛称は「レッズ」。1959年から74年まで率いたビル・シャンクリー監督の時代に定着します。
# 2026-09-22 流れの点検2回目: 冒頭で約束した「1部リーグ20回」を本文で一度も言っていなかった
# （ショートには冒頭が入らない）。愛称と「ユール・ネヴァー・ウォーク・アローン」は
# 「空になったスタジアム」の節から移した（ほかの4本と同じく基礎DATAの中に置く）
- 本拠地はアンフィールド。**約6万1000人**が入ります。2024年に広げたばかりです。
- 試合前の「ユール・ネヴァー・ウォーク・アローン」も、1960年代の初めから歌われています。
- 2010年から、大リーグのレッドソックスも持つフェンウェイ・スポーツ・グループがオーナーです。
- 1部リーグの優勝は**20回**。マンチェスター・ユナイテッドと並んで最多です。
- FAカップは8回、リーグカップは10回です。
- チャンピオンズリーグ**6回**、ヨーロッパリーグ3回、スーパーカップ4回、クラブワールドカップ1回。
- 直近のタイトルは、2024年から25年のプレミアリーグ優勝です。
- 昨季は**5位**。勝ち点は60でした。
# 2026-09-22 流れの点検2回目: 「イスタンブールの奇跡」だけでは何の試合か分からない。
# サラーの32得点は2022-23にハーランドが36点で抜いているので「当時の」記録
# **1人3行**（2026-09-22 指示「このクラブの3人の内容をもう少し濃くしたい」）。
# 1行目=どんな選手か、2行目=決定的な場面、3行目=残したもの。出典は各選手の Wikipedia
legends:
- - 中盤のスティーヴン・ジェラードは、9歳でアカデミーに入り、1998年にデビューしました。
  - 2005年のチャンピオンズリーグ決勝の主将。ミランに0対3から追いついて勝ちました。
  - リーグ戦で**504試合**。のちに監督となり、レンジャーズを無敗で優勝させています。
- - ジェイミー・キャラガーは生え抜きのディフェンダー。少年時代はエヴァートンのファンでした。
  - 2001年、FAカップ、リーグカップ、ウエファカップの3冠。副主将を10年、務めました。
  - 出場**737試合**はクラブ史上2番目。2013年に引退し、いまは解説者をしています。
- - モハメド・サラーは2017年、ローマから**3690万ポンド**で来た右ウイングです。
  - 2024年から25年は29得点18アシスト。合わせて**47**は、20チーム制で最多でした。
  - リーグ戦**315試合**で191得点。クラブ史上3番目の得点者となり、この夏、去りました。
legend_sources:
- - https://en.wikipedia.org/wiki/Steven_Gerrard
- - https://en.wikipedia.org/wiki/Jamie_Carragher
- - https://en.wikipedia.org/wiki/Mohamed_Salah
legend_rows:
- - スティーヴン・ジェラード
  - 1998-2015
  - イスタンブールの奇跡の主将
- - ジェイミー・キャラガー
  - 1996-2013
  - 737試合の生え抜き
- - モハメド・サラー
  - 2017-2026
  - プレミア1シーズン32得点

# **基礎DATAの何行目がどのタイルの話か**（2026-09-20）。書いておかないと
# 文からタイルを当てにいくので、当たらない行が板のまま止まる
data_focus: [0, 1, 3, 3, 4, 5, 5, 5, 7, 8]

# **クラブを表す一言**（2026-09-21 指示「最初にクラブを表す一言を述べてから始める」）。
# タイトルより前に読む。つかみ（hook）と同じことを言わない
opening: "**1部リーグ20回**。マンチェスター・ユナイテッドと並ぶ最多。"
# **引き**（2026-09-22 流れの点検2回目）。旧台本の「日本代表の遠藤航が、いまこのクラブに
# います」は題名と次の節と合わせて3回同じことを言っていた。生まれの話の予告に替える
hook: エヴァートンが出ていったスタジアムで、生まれたクラブです。
# 「へえ」の逸話（2026-09-22）。Wikipedia のクラブ記事で裏を取った1つだけ
episode:
  id: episode
  heading: 触ってはいけない看板
  tier: 背景
  telop: 「THIS IS ANFIELD」触るのは優勝のあと
  narrator: 解説
  card:
    type: table
    title: 触ってはいけない看板
    columns:
    - ''
    - ''
    rows:
    - - THIS IS ANFIELD
      - シャンクリーが付けた看板
    - - クロップ監督
      - 獲るまで触るなと禁じる
    - - 2019年
      - チャンピオンズリーグ決勝に勝って解禁
  say:
  - アンフィールドの選手用トンネルに、「ジス・イズ・アンフィールド」の看板があります。
  - シャンクリー監督が付けたもので、相手を怖がらせ、味方が触れば運が付く、というものでした。
  # 2026-09-22 流れの点検2回目: 1959〜74年の話からいつの誰か言わずにクロップへ飛んでいた。
  # 来た年を足し、長い1文を2つに割った。2015年就任の出典はクラブ記事
  - 2015年に来たクロップ監督は、「タイトルを獲るまで触るな」と禁じました。
  - '**2019年**のチャンピオンズリーグ決勝に勝って、ようやく触ることが許されました。'
  sources:
  - https://en.wikipedia.org/wiki/Anfield
  - https://en.wikipedia.org/wiki/Liverpool_F.C.
# 今季の節に足す行（2026-09-22 流れの点検「遠藤について本文が1句だけ」）。
# 出典は今季のシーズン記事（節の sources に入る）
season:
- 遠藤航は今年7月、契約を**2031年**まで延ばしました。
# 今季の監督（2026-09-22 指示）。Wikipedia のクラブ記事と本人の記事で裏を取った
manager:
- 今季の監督は、スペイン人のアンドニ・イラオラ。**2026年6月**に来た1年目です。
- 前はボーンマス。クラブ史上最高の6位と、初めてのヨーロッパに連れていきました。
manager_telop: 監督はアンドニ・イラオラ。1年目
manager_rows:
- - 監督
  - アンドニ・イラオラ（スペイン）
- - 就任
  - 2026年6月・1年目
- - 前職
  - ボーンマス
manager_sources:
- https://en.wikipedia.org/wiki/Andoni_Iraola
# **いま見る理由**（2026-09-22 指示「今そのクラブを見る理由を最初につけて視聴者の
# 興味を上げたい」）。冒頭の直後に置き、ショートはここから。旧 why はこの節に吸収
reasons:
- 日本代表の中盤、遠藤航が、リーグ戦**57試合**を戦ってきたクラブです。
- 監督が代わりました。ボーンマスを**6位**まで引き上げたイラオラの、1年目です。
- 2シーズン前に**20回目**の優勝、昨季は5位。サラーが去って初めてのシーズンです。
reasons_telop: 遠藤航がいる。新監督イラオラの1年目
