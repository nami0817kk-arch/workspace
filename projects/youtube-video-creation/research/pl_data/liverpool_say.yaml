  say:
  - アンフィールドの選手用トンネルに、「ジス・イズ・アンフィールド」の看板があります。
  - ビル・シャンクリーが付けたもので、相手を怖がらせ、触ったリヴァプールの選手には運を呼ぶためのものでした。
  - クロップ監督は「タイトルを獲るまで触るな」と禁じ、**2019年**のチャンピオンズリーグ決勝に勝って、ようやく触ることが許されました。
  sources:
  - https://en.wikipedia.org/wiki/Anfield
