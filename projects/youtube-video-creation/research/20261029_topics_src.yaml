title: 10月29日のショート題材
lead: 約457件（30時間以内）から22件（日本人8件・海外14件）。ショート10本ぶんを○で選んでください。
note: 今日は木曜（29日）、日本時間の朝に集めました。ショート10本ぶんを○で選んでください。<br><br><b>日本人の題は8件（1〜8）、海外は14件（9〜22）、計22件</b>で、目安の25件には届きませんでした。<b>強いのは1（塩貝・後藤の同じ試合）だけ</b>で、日本人のほかの題は弱めです。弱い題で埋めないよう、○は強いものに絞るのも手です。<br><br><b>ヒットの条件：</b>日本代表・W杯に絡むのは 1〜8 と 22。本人（監督を含む）の言葉が取れそうなのは 5・7・8・10〜12・16・19。各行の「条件：」に書きました。<br><br><b>公開の目安：</b>日本人の題は9〜17時、18時以降は日本人以外にします。<br><br><b>読めていないこと：</b>見出しだけを見た題が多く、本文は取材の段で読みます（読んでから落とす題も出ます）。<b>10/28 の題と重なるもの</b>：5（齋藤）・15（フリートウッド戦）・17（ムバッペ）・21（バロンドール）。<br><br><b>外した題：</b>コンパニの入院（病気）・スペインの列車事故（悲劇）・Jリーグ・女子・MLS・ACLE・高校サッカー。FotMob は使っていません。
