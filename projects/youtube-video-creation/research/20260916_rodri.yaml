    heading: 何が分かれ目だったか
    main: true
    tier: 報道
    telop: 「デコとハンシの指導力が違いを生んだ」
    narrator: 解説
    say:
      - {short_only: true, text: 今夏、バルセロナへ加入した中盤の選手の話です。}
      - 簡単な決断ではなかった、と本人は言います。
      - {voice: ロドリ, text: 決断は容易ではなかった。レアル・マドリードにノーと言うことは決して簡単ではない}
      - では、何が決め手になったのか。
      - {voice: ロドリ, text: デコとハンシのリーダーシップが違いを生んだ}
      - 判断はスポーツ的な観点からだった、という説明です。
      - フリック監督の要求と、進歩への野心。そしてチームの雰囲気を挙げています。
