    telop: モウリーニョ本人から電話があった
    narrator: キャスター
    say:
      - ロドリがスペイン紙『ムンド・デポルティーボ』のインタビューで、移籍の裏側を語りました。
      - 誘っていたのは、モウリーニョ監督でした。直接、本人に接触しています。
      - {voice: ロドリ, text: 彼は明確に私を望んでいることを表現し、チームに何をもたらせるか説明した}
      - ロドリはこのあと、モウリーニョに電話をかけて感謝を伝えています。
