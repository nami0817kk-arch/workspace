- id: view
  heading: 遠藤保仁の武器は、ボールの速さだったのか
  tier: 背景
  telop: 時速86キロ、本田のおよそ8割
  viewpoint: true
  card: &viewcard
    type: table
    title: 2本のフリーキック（2010年デンマーク戦）
    columns:
    - 項目
    - 本田圭佑
    - 遠藤保仁
    rows:
    - - 時間
      - 17分
      - 30分
    - - ボールの速さ
      - 時速110キロ近く
      - 時速86キロ
    - - 回転
      - ほとんど無回転
      - 毎秒8回転
    - - 助走
      - かなり後ろから
      - 4歩
    source: 読売新聞
    highlight_row: 0
  say:
  - text: デンマーク戦の、2本のフリーキックを比べます。
    image: assets/images/20261025_endo_yasuhito_legend/01.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 本田のボールは、時速110キロ近く。ほとんど回転しない、ぶれる球でした。
    card: {<<: *viewcard, highlight_row: 1}
  - text: 遠藤のボールは、時速86キロ。本田の、およそ8割の速さです。
    card: {<<: *viewcard, highlight_row: 1}
    emph: true
    mark:
      kind: circle
      row: 1
      col: 遠藤保仁
  - text: そのかわり、毎秒8回転。鋭く曲がって、右隅に入りました。
    card: {<<: *viewcard, highlight_row: 2}
  - text: 助走は、わずか4歩でした。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *viewcard, highlight_row: 3}
  - text: ワールドカップで、1試合に2本のフリーキックが決まったのは、44年ぶりでした。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  - text: 出場数でも比べます。ドイツ大会より前の4年は、年に9試合。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  - text: 2007年からの8年は、年に13試合。およそ1.4倍です。
    card: none
  - text: 速さではなく、狙った所に置く力。それが、13年の代表生活を支えました。
    image: assets/images/20261025_endo_yasuhito_legend/06_w.jpg
    card: none
  quotes_from: []
