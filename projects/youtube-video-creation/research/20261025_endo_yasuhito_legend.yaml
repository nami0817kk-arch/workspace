    card: none
  - text: PK戦。日本の1人目は遠藤。きっちり決めます。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *wccard, highlight_row: 3}
  - text: それでも3対5で敗れ、大会を終えました。
    card: {<<: *wccard, highlight_row: 3}
