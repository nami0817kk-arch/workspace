  say:
  - text: 遠藤保仁は1998年、鹿児島実業高校から、横浜フリューゲルスへ。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *careercard, highlight_row: 0}
  - text: 1999年、20歳以下の世界大会、ワールドユースで準優勝します。
    card: {<<: *careercard, highlight_row: 1}
  - text: 2001年にガンバ大阪へ。2020年まで在籍します。
    card: {<<: *careercard, highlight_row: 2}
  - text: 2002年11月、アルゼンチン戦で、日本代表に初めて出ます。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  - text: ところが2006年、ドイツのワールドカップ。
    card: none
  - text: メンバーに入りながら、出番は1度もありませんでした。
    card: none
    emph: true
  - text: 大会のあと、オシム監督のもとで、中田英寿の7番を受け継ぎます。
    image: assets/images/20261025_endo_yasuhito_legend/03.jpg
    card: {<<: *careercard, highlight_row: 3}
  - text: 岡田武史監督の時代は、長谷部誠と中盤の真ん中を組みました。
    card: {<<: *careercard, highlight_row: 3}
  - text: 2020年、ジュビロ磐田へ移ります。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *careercard, highlight_row: 4}
  - text: 2023年まで、ここでプレーを続けました。
    card: {<<: *careercard, highlight_row: 4}
    emph: true
