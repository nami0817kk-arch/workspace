# 遠藤保仁（元日本代表MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-25。型は 10/24 の稲本潤一と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は 日本語/英語版 Wikipedia の成績表・W杯の Wikipedia 試合記録・ガンバ大阪公式・読売新聞（アーカイブ）と、自分で足した値だけ。
# **私生活（家族・結婚）は入れない。女子サッカーは入れない。病気・法的な問題は入れない**。Jリーグは経歴の事実（所属・期間）だけで、Jリーグそのものを題材にしない。
#
# **重なりの確認（2026-10-25）**：scripts/・research/covered.yaml・research/posted.json を「遠藤」「保仁」「Yasuhito」「endo」で grep。
#   出てくるのは 2026-09-04 の **遠藤航**（別人）だけ。遠藤保仁の回は無い。直近の中田英寿・長谷部誠・中村俊輔・内田篤人・川口能活・小野伸二・稲本潤一とも別人。
# **引退の確認（一次情報）**：ガンバ大阪公式（gamba-osaka.net/news/index/no/16046/、2024-01-09）
#   「ジュビロ磐田所属の遠藤 保仁選手が2023シーズンをもって現役を引退し、2024シーズンよりガンバ大阪のトップチームコーチに就任」。→ **現役ではない**。
#   ジュビロ磐田公式の引退の知らせ（nw_seq=9360）は本文がスクリプトで描かれていて requests では読めなかった。
# **いまの立場**：ガンバ大阪公式の選手・スタッフ一覧（gamba-osaka.net/team/players/、2026-10-25 に確認）で「監督 明神 智和」「ヘッドコーチ 遠藤 保仁」。
#   日本語 Wikipedia は「2026/27シーズンよりヘッドコーチに昇格（2026年7月〜）」。昇格の日付はクラブ公式で未確認なので、台本は「いまは、ヘッドコーチ」とだけ言う。
# **日本との接点**：全体が日本代表・W杯の話（代表152試合、W杯は2006・2010・2014のメンバー）。欧州でのプレーは無い。
#
# **数字の出どころ・食い違いと台本での扱い**
# - **日本代表 152試合15得点**：日本語・英語 Wikipedia（jfootball-db 引用）。英語版「Japan national football team」の最多出場表も 152 で1位（2位 長友佑都 146、現役）。
#   年別（日本語版）2002=1・2003=11・2004=16・2005=8・2006=8・2007=13・2008=16・2009=12・2010=15・2011=13・2012=11・2013=16・2014=8・2015=4 の合計 152、得点の合計 15 を自分で確認。
#   区切り：2002〜05 = 36試合3得点、2006 = 8試合0得点、2007〜10 = 56試合6得点、2011〜15 = 52試合6得点（自分で足した）。
#   **JFA の選手名鑑は数字がスクリプトで描かれていて読めなかった**（未確認）。
# - **代表の節目**：初出場 2002-11-20 アルゼンチン戦（ジーコ監督）。100試合 2010-10-12 韓国戦、日本で4人目（サッカーキング 2010-10-13、Wikipedia 引用）。
#   123試合目 2012-10-16 ブラジル戦で井原正巳の122を抜く（スポニチ 2012-10-16、Wikipedia 引用）。150試合 2015-01-16 イラク戦。最後の152試合目 2015-01-23 UAE戦（1対1、PK4-5）＝150試合目から7日後。
# - **W杯**：2006年は登録されたが出場なし（英語 Wikipedia「2006 FIFA World Cup Group F」の3試合の出場者に名前が無いことを確認）。「フィールドプレーヤーで唯一」は朝日新聞（Wikipedia 引用）のみで自分で数え切れなかったので言わない。
#   2010年は4試合すべてに先発（英語 Wikipedia の Group E と knockout stage の先発表）：6/14 カメルーン1-0、6/19 オランダ0-1、6/24 デンマーク3-1、6/29 パラグアイ0-0（PK3-5、日本の1人目の遠藤は成功）。
#   2014年は2試合とも途中出場（コートジボワール 54分から、ギリシャ 46分から）。→ W杯は6試合1得点（自分で足した）。
# - **デンマーク戦**（英語 Wikipedia の試合記録、現地 2010-06-24 20:30、ルステンブルク）：本田17分（FK）・遠藤30分（FK）・トマソン81分・岡崎87分。遠藤は90+1分に交代。
#   「デンマークは勝つしかなかった」「日本は国外の大会で初めて決勝トーナメントへ」は英語 Wikipedia の本文。遠藤のW杯初得点は日本語 Wikipedia。
# - **2本のFKの比べ**（読売新聞 2010-06-26「本田は無回転、遠藤は高速回転…日本のFK分析」、web.archive.org で本文を読んだ）：
#   本田は時速110キロ近く・ほとんど回転しない。遠藤は時速86キロ・毎秒8回転・4歩の助走、右方向へ飛び出し左へ曲がって右隅。本田はボールのかなり後ろから。「W杯史上44年ぶりの1試合2本のFK成功」。
#   86÷110＝0.78 → 「およそ8割の速さ」は自分で割った（110は「近く」なので「およそ」を付ける）。
# - **見立ての比べ**：ドイツ大会より前の2002〜05年は36試合÷4年＝年9試合、2007〜14年は 13+16+12+15+13+11+16+8＝104試合÷8年＝年13試合。13÷9＝1.44 →「およそ1.4倍」（自分で割った）。
# - **ガンバ大阪のリーグ戦 605試合98得点**：英語 Wikipedia の表。日本語版の年別（2001〜2020）を自分で足しても 605/98 で一致。
#   **リーグ戦の通算は 775（英語版）と 776（日本語版、2023年の磐田が20か21か）で食い違う**ので、通算は台本に出さない。
# - **クラブW杯 2008 準決勝**：2008-12-18 ガンバ大阪 3-5 マンチェスター・ユナイテッド、遠藤 85分PK（英語 Wikipedia「2008 FIFA Club World Cup」）。「コロコロPK」の呼び名はデイリースポーツ 2010-06-11（Wikipedia 引用）。
# - **本田圭佑の言葉**：朝日新聞 2011-01-31「MVPは本田圭　サッカーアジア杯優勝」（本文を requests で読んで一字一句確認）「個人的にはヤットさん（遠藤）だと思う。ああいう人がいなかったら勝負は紙一重だった」。
# - **本人の言葉**：ガンバ大阪公式（2024-01-09）のコメントから2文を原文のまま（一次情報）。
# - アジア年間最優秀選手 2009・アジアカップ優勝 2004/2011：日本語・英語 Wikipedia。年齢：1980-01-28 生まれ → 2026-10-25 で46歳、2024-01-09 で43歳（ガンバ公式のプロフィールも43歳）。
#
# **入れなかったもの**：私生活（家族・兄）、CM・アニメの声の出演、J1の出場記録や Jリーグ30年のMVP（Jリーグを題材にしない）、オシム監督の評価の言葉、2006年に出番が無かった理由。
# **日本語名・読みで怪しいもの**（audio_query で確認）：遠藤保仁＝エンドオヤスヒト（○）、ルステンブルク＝ル/ス/テンブルク（区切れるが音は正しい）、明神智和＝ミョオジントモカズ（○）、ヤットさん（○）、紆余曲折（○）。
