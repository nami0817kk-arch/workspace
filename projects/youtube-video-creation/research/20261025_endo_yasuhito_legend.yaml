- id: after
  heading: 引退した遠藤保仁は、いま、どこで何をしているのか
  tier: 報道
  telop: 引退のあと、ガンバ大阪へ
  card: &aftercard
    type: timeline
    title: 引退のあと
    rows:
    - - 2024年1月9日
      - 2023年限りでの引退を発表。43歳
    - - 2024年〜
      - ガンバ大阪のトップチームコーチ
    - - 2026年10月
      - ガンバ大阪のヘッドコーチ
    focus: 2
    highlight_row: 0
  say:
  - text: 2024年1月9日。遠藤保仁の引退が発表されます。43歳でした。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: 同じ日に、ガンバ大阪が、トップチームのコーチ就任を発表します。
    card: {<<: *aftercard, highlight_row: 1}
  - text: クラブを通じて、こうコメントしています。
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
  - voice: 遠藤保仁
    text: 私のキャリアの中でも多くの月日を過ごしたクラブで、
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
  - voice: 遠藤保仁
    text: また戦うことが出来ることを大変嬉しく思います。
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
    cont: true
  - voice: 遠藤保仁
    text: 指導者としては勉強の身なので、紆余曲折あると思いますが、
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
    cont: true
  - voice: 遠藤保仁
    text: 選手達と共に成長し、チームの勝利に貢献していきたいです。
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
    cont: true
  - text: そしていま、クラブの名簿での肩書きは、ヘッドコーチ。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *aftercard, highlight_row: 2}
  - text: 明神智和監督のもとで、チームを支えています。
    card: {<<: *aftercard, highlight_row: 2}
    emph: true
  quotes_from:
  - https://www.gamba-osaka.net/news/index/no/16046/
  sources:
  - https://www.gamba-osaka.net/news/index/no/16046/
  - https://www.gamba-osaka.net/team/players/
  - https://ja.wikipedia.org/wiki/%E9%81%A0%E8%97%A4%E4%BF%9D%E4%BB%81
- id: secret
  heading: コロコロPKと、本田圭佑の一言には、何があったのか
  tier: 報道
  telop: コロコロPKと「ヤットさん」
  card: &secretcard
    type: table
    title: 数字の外にある、2つの話
    columns:
    - いつ
    - 何があったか
    rows:
    - - 2008年
      - クラブW杯で、マンUから「コロコロPK」
    - - 2011年
      - アジアカップ優勝。本田が名前を挙げる
    source: Wikipedia・デイリースポーツ・朝日新聞
    highlight_row: 0
  say:
  - text: 遠藤保仁の、数字の外にある話を、2つ。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 1つ目は、コロコロPK。ゆっくり転がして決めるPKで、知られていました。
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
  - text: 2008年12月、アジア王者として出た、クラブワールドカップの準決勝。
    image: assets/images/20261025_endo_yasuhito_legend/14r_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 相手は、マンチェスター・ユナイテッドでした。
    card: {<<: *secretcard, highlight_row: 0}
  - text: 85分、遠藤はこの転がすPKでゴールを奪います。試合は3対5の負けでした。
    image: assets/images/20261025_endo_yasuhito_legend/14.jpg
    card: none
  - text: 2つ目は、2011年のアジアカップ。日本は優勝します。
    image: assets/images/20261025_endo_yasuhito_legend/03.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - text: 大会の最優秀選手は、本田圭佑でした。
    card: {<<: *secretcard, highlight_row: 1}
  - text: その本田が、こう話しています。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  - voice: 本田圭佑
    text: 個人的にはヤットさんだと思う。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  - voice: 本田圭佑
    text: ああいう人がいなかったら勝負は紙一重だった。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
    cont: true
  - text: ヤットさんとは、遠藤保仁の呼び名です。
    image: assets/images/20261025_endo_yasuhito_legend/05_w.jpg
    card: none
  quotes_from:
  - https://www.asahi.com/sports/fb/japan/TKY201101310067.html
