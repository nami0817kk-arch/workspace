        - 準決勝
        - ブラジル
        - 2-4 負け
      - - 2014年
        - 準々決勝
        - コスタリカ
        - 4-3 勝ち
      - - 2014年
        - 準決勝
        - アルゼンチン
        - 2-4 負け
      - - 2022年
        - 準々決勝
        - アルゼンチン
        - 3-4 負け
      - - 2026年
        - ラウンド32
        - モロッコ
        - 2-3 負け
  - text: 負けない守りはある。けれど、点が要る試合で点が取れない。
    card:
      <<: *id_vp2
      highlight_row: 4
  - text: その結果、PK戦で止まる。数字は、そう読めます。
    card:
      <<: *id_vp2
      highlight_row: 4
  - text: シャビ監督の4試合も、2勝2引き分けで負けなしです。
    image: assets/images/20261027_team_netherlands/n09_xavi_w.jpg
    card: none
  - text: 次は11月13日にホームでギリシャ、16日に敵地でドイツ。
    card: none
  - text: どちらも、この秋に先に点を奪われた相手です。
    card: none
