# 代表チーム紹介 オランダ代表（10/27 作成。固定シリーズ9「代表チーム紹介」。見本は 10/26 のポルトガル代表 scripts/20261026_team_portugal.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **軸（2026-10-27）**：「オランダは出場した直近3大会のW杯で16試合負けなし（最後の負けは2010年の決勝）。それでも3大会ともPK戦で止まった。頂点に届かないのはなぜか」。答えは見立ての節（16試合の得点を「PK戦になった4試合」と「それ以外の12試合」に分けた1試合あたりの得点、W杯のPK戦の通算成績、シャビ監督の4試合）。
# **日本との接点**：2026年W杯の初戦で日本と2対2（中村敬斗・鎌田大地）。この大会でオランダから2点を取ったのは日本だけ。基礎DATAの次の節に置いた。
# **重なりの確認（2026-10-27）**：scripts/・research/covered.yaml・research/posted.json を grep。オランダ代表の「紹介」回（team_netherlands）は無い。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル。オランダ代表が主役の news は covered.yaml に 9/24「オランダ代表の主将が続投を決めた、10秒の会話」・9/25「シャビのオランダ初陣、同点弾のガクポが…」・9/28「シャビのオランダが初勝利。2発の23歳が…」（scripts/20260925_xavi.md・20260928d_xavi.md）、10/18 にシャビのレジェンド回（scripts/20261018_xavi_legend.md）。**秋の4試合の結果は 9/25・9/28 の news と材料が重なる**ので、いまのチームの節は結果の並びにとどめ、見立ての主はW杯16試合の数え直しにした。直近30日にオランダ代表を主役にした紹介ものは無い。
# ---- 確かめたこと（2026-10-27。WebFetch の要約は使わず、requests で生の値を読んだ）----
#  ・FIFAランク：9位（2026-10-07 発表）。Wikipedia の Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）で Netherlands 9・前回比0。FIFA の記事（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain）の表は「Moves into top 10: None / Moves out of top 10: None」（オランダの順位そのものは記事本文に無い）。点数は書かない。日本は17位（同じ表）。
#  ・W杯：出場12回（1934年が初）。最高は準優勝3回（1974・1978・2010）。Netherlands national football team の infobox と Netherlands at the FIFA World Cup の表。決勝：1974年 西ドイツに1-2、1978年 アルゼンチンに延長1-3、2010年 スペインに延長0-1。2014年は3位（準決勝アルゼンチンにPK戦2-4、3位決定戦ブラジルに3-0）。2018年は予選敗退（Did not qualify）。2022年は8強（準々決勝アルゼンチンに2-2、PK戦3-4）。
#  ・「2010年の決勝のあと、W杯で正式に負けた試合が無い。2014・2022・2026はどれもPK戦で終わった」は Netherlands at the FIFA World Cup の冒頭の本文（have not officially lost a match since the 2010 final…）。試合の表で数え直した：2014年 7試合5勝2分（15得点4失点）／2022年 5試合3勝2分（10得点4失点）／2026年 4試合2勝2分（11得点5失点）＝16試合10勝6分0敗・36得点13失点。PK戦は記録の上では引き分け。
#  ・PK戦になった4試合（2014 コスタリカ0-0・2014 アルゼンチン0-0・2022 アルゼンチン2-2・2026 モロッコ1-1）＝3得点3失点。それ以外の12試合＝33得点10失点。自分で割った（検算した）：16試合 36÷16=2.25／4試合 3÷4=0.75／12試合 33÷12=2.75（2.75÷0.75=3.67）。4試合は延長を含む120分。
#  ・W杯のPK戦は5回で1勝4敗（同じ表の pso）：1998年準決勝ブラジル2-4負け／2014年準々決勝コスタリカ4-3勝ち／2014年準決勝アルゼンチン2-4負け／2022年準々決勝アルゼンチン3-4負け／2026年ラウンド32モロッコ2-3負け。
#  ・2026年W杯（Netherlands national football team の試合一覧と ESPN の fifa.world scoreboard を突き合わせた）：グループF 6/14 日本2-2（ファン・ダイク51分・サマーヴィル64分／中村敬斗57分・鎌田大地88分。**鎌田の分は ESPN が89分**なので語りでは「終盤」）／6/20 スウェーデン5-1（ブロビー5・17分、ガクポ47・54分、サマーヴィル89分）／6/25 チュニジア3-1（敵地扱い。スヒリのオウンゴール3分・ブロビー7分・ファン・ヘッケ62分）→ グループ1位・勝ち点7（2026 FIFA World Cup Group F の本文）。日本はグループ2位でラウンド32 ブラジルに1-2。ラウンド32 6/29 モロッコ1-1（ガクポ72分／ディオプ90+1分）PK戦2-3（クープマイネルスは1人目で成功）。この大会でオランダから2点を取ったのは日本だけ（失点は日本2・スウェーデン1・チュニジア1・モロッコ1）。
#  ・EURO：優勝1回（1988年、決勝ソ連に2-0。UEFA Euro 1988 final の infobox）。
#  ・監督：シャビ。KNVB の発表（onsoranje.nl「Xavi Hernández nieuwe bondscoach Nederlands elftal (m)」2026-08-12）＝契約は2030年W杯まで、クーマンの後任。BBC（2026-08-12「Xavi becomes first non-Dutch Netherlands coach since 1978」）＝1978年のエルンスト・ハッペル以来の外国人監督、クーマンはモロッコ戦の敗退のあと辞任。
#  ・主将：フィルジル・ファン・ダイク（infobox の Captain、名簿の印 captain）。代表100試合14得点（名簿、10/4 のセルビア戦のあと）。Virgil van Dijk の記事「On 4 October 2026, Van Dijk earned his 100th international cap … the 11th Dutchman to earn over 100 caps」。
#  ・愛称：Oranje（infobox）。本文「after the House of Orange-Nassau and their distinctive orange jerseys」。
#  ・名簿・年齢：Wikipedia の Current squad（9〜10月のネーションズリーグの名簿。caps と goals は 10/4 のあと）と各選手の記事の infobox（currentclub）。2026-10-27 時点の年齢（生年月日から計算）：ファン・ダイク 1991-07-08=35（リヴァプール、DF、100試合14得点）、ダンフリース 1996-04-18=30（レアル・マドリード、DF、80試合）、フラーフェンベルフ 2002-05-16=24（リヴァプール、MF）、クープマイネルス 1998-02-28=28（ユヴェントス、MF）、ガクポ 1999-05-07=27（リヴァプール、FW、56試合25得点。W杯2026は3得点）、メールディンク 2003-07-24=23（AZ、FW、4試合2得点）。
#  ・W杯のあと（試合一覧と ESPN の uefa.nations scoreboard で日付・スコア・得点者を確認）：ネーションズリーグ 9/24 ドイツ1-1（ネメハ32分／ガクポ90+2分）／9/27 セルビア2-1（敵地。メールディンク30・69分／ヨヴィッチ46分）／10/1 ギリシャ2-2（敵地。イオアニディス23分・マスラス45+2分／ファン・ダイク59分・ラインデルス89分）／10/4 セルビア2-1（クープマイネルス31分・ジルクゼー71分〔ESPN は72分〕／ツヴェトコヴィッチ35分）＝2勝2分・7得点5失点。先に失点したのはドイツ戦とギリシャ戦で、どちらも追いついた。シャビ監督の記録 4試合2勝2分0敗（Xavi の記事の監督成績の表）。次は 11/13 ギリシャ（ホーム）、11/16 ドイツ（敵地）。自分で割った：7÷4=1.75・5÷4=1.25。
#  ・日本との対戦：国際Aマッチ4試合、日本から見て0勝2分2敗・4得点8失点（Japan national football team records and statistics の Head-to-head：NED 2009–2026 4・0・2・2・4・8。Netherlands … records and statistics の JPN 4・2・2・0・8・4、as of 14 June 2026）。試合は Japan national football team results の各表：2009-09-05 親善試合 0-3（エンスヘーデ）／2010-06-19 W杯 0-1（ダーバン）／2013-11-16 親善試合 2-2（ゲンク）／2026-06-14 W杯 2-2（アーリントン）。2010年の1点はスナイデル（2010 FIFA World Cup Group E の本文、52分ごろ）。
# ---- 言わないもの ----
#  ・怪我（ガクポ・ファン・ヘッケらの離脱の印）／私生活／ファン・ハールの病気（本文にあるが入れない）／背番号／戦術の説明／監督の契約の金額／9/24 の news の中身（主将の続投の会話）。
