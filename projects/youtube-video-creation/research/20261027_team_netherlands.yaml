  say:
  - text: モロッコ戦のあと、クーマン監督が退き、8月にシャビ監督が後を継ぎました。
    image: assets/images/20261027_team_netherlands/n09_xavi_w.jpg
    card: none
  - text: オランダが外国人の監督を迎えるのは、1978年以来です。
    card: none
  - text: 契約は、2030年のワールドカップまで。
    card: none
  - text: 秋の公式戦、ネーションズリーグは、ここまで4試合で2勝2引き分け。
    card: *id_nw
  - text: ネーションズリーグは、ヨーロッパの代表が組ごとに争う公式の大会です。
    card: *id_nw
  - text: 初戦のドイツ戦は、90分を過ぎてガクポが追いつき、1対1の引き分け。
    image: assets/images/20261027_team_netherlands/n07_gakpo_w.jpg
    card:
      <<: *id_nw
      highlight_row: 0
  - text: 9月27日は敵地でセルビアに2対1。シャビ監督の初勝利です。
    card:
      <<: *id_nw
      highlight_row: 1
  - text: 10月1日のギリシャ戦は、2点を先に失ってから追いつき、2対2の引き分け。
    emph: true
    image: assets/images/20261027_team_netherlands/n09_xavi_w.jpg
    card: none
  - text: 10月4日は、もう一度セルビアを2対1で破りました。
    card:
      <<: *id_nw
      highlight_row: 3
  - text: 4試合で7得点5失点。先に失点した2試合は、どちらも追いつきました。
    image: assets/images/20261027_team_netherlands/n04_kickoff_w.jpg
    card: none
