- id: viewpoint
  viewpoint: true
  heading: 16試合負けなしで、PK戦に止まる。数字では、どこに差があるのか
  tier: 背景
  telop: PK戦の4試合は1試合0.75点。ほかの12試合は2.75点
  narrator: 解説
  card: &id_vp
    type: table
    title: W杯3大会・16試合の得点（2014・2022・2026年）
    columns:
    - 試合
    - 数
