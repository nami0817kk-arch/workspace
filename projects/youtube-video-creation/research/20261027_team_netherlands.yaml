    image: assets/stats/tb_netherlands_data2.png
    no_telop: true
  - text: PK戦での敗退は、記録の上では引き分け。3大会で負けた試合は、ひとつもありません。
    image: assets/stats/tb_netherlands_data_t.png
    no_telop: true
  - text: 2026年の大会で、その最初の試合を2対2で引き分けたのが、日本でした。
    image: assets/stats/tb_netherlands_data_r1.png
    no_telop: true
  - text: 負けないのに、なぜ頂点に届かないのでしょうか。
    image: assets/stats/tb_netherlands_data_t.png
    no_telop: true
