      - '33'
      - '2.75'
  say:
  - text: 見立てに入ります。オランダが出場した直近3大会の、全試合の得点を分けて数えました。
    image: assets/images/20261027_team_netherlands/n02_fans_w.jpg
    card: none
  - text: あわせて36点。1試合に2点を超える数字です。
    card: *id_vp
  - text: PK戦までもつれた4試合に絞ると、取った点は3点。
    emph: true
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 延長までの120分を戦って、1試合に1点にも届きません。
    mark:
      kind: circle
      row: 0
      col: 3
    card:
      <<: *id_vp
      highlight_row: 0
  - text: それ以外の12試合は33点。1試合に3点近く取っていて、3倍以上の差があります。
    mark:
      kind: circle
      row: 1
      col: 3
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 一方で、その4試合の失点も3点。守りは持ちこたえています。
    image: assets/images/20261027_team_netherlands/n03_postgame_w.jpg
    card: none
  - text: そしてPK戦は、ワールドカップで通算1勝4敗です。
    card: &id_vp2
      type: table
      title: オランダのW杯のPK戦
      columns:
      - 年
      - 段階
      - 相手
      - PK戦
      rows:
