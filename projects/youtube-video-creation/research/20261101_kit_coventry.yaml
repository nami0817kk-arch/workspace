sections:
- id: sky
  main: true
  heading: コヴェントリーの空色は、いつから空色だったのか
  bg: assets/images/20261101_kit_coventry/c01_derby_w.jpg
  tier: 背景
  narrator: 解説
  telop: 最初の空色は1898年から。1922年に消え、1962年にジミー・ヒルが戻した
  card: *sky
  say:
  - text: 今回は、コヴェントリーの、空色のシャツと、胸の紋章です。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
    emph: true
  - text: コヴェントリーの愛称は、スカイブルーズ。空色のクラブです。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
  - text: ところが、この空色は、ずっと着てきた色ではありません。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: none
    emph: true
  - text: 空色のシャツを最初に着たのは、1898年。いまのクラブの名前になった年です。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card:
      <<: *sky
      highlight_row: 0
  - text: その空色は、1922年までで、いったん消えます。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card:
      <<: *sky
      highlight_row: 1
  - text: そのあと、およそ40年は、青と白の組み合わせの時代が続きました。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
  - text: 1959年には、白いシャツに替えます。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *sky
      highlight_row: 2
  - text: 胸の紋章は、小さな雄鶏、バンタム。当時の愛称が、バンタムズだったからです。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: none
  - text: 変わったのは、1961年11月。元選手のジミー・ヒルが、監督になります。
    image: assets/images/20261101_kit_coventry/c05_hill_w.jpg
    card: none
  - text: 翌1962年、シャツもパンツも、全身を空色に。愛称も、スカイブルーズに替えました。
    image: assets/images/20261101_kit_coventry/c05_hill_w.jpg
    card: *hill
    emph: true
    callword: 空色に戻す
  - text: その5年後の1967年に、初めて、いまのプレミアにあたる1部へ上がります。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card:
      <<: *sky
      highlight_row: 4
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - https://en.wikipedia.org/wiki/Jimmy_Hill
  - https://www.historicalkits.co.uk/Coventry_City/Coventry_City.htm
- id: brown
  heading: 「最悪」と呼ばれた茶色いシャツを、なぜ復刻したのか
  bg: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1978年のチョコレート色は何度もひどいと言われ、2009年に1125枚で復刻
  card: *brown
  say:
  - text: 空色のコヴェントリーには、有名な、茶色いシャツもあります。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
  - text: 1978年に出た、相手の本拠地で着る、アウェー用の、チョコレート色です。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card:
      <<: *brown
      highlight_row: 0
  - text: アドミラル社の、有名なデザインを、茶色にしたシャツでした。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
  - text: イングランドのサッカー史で、いちばんひどいシャツだと、何度も言われてきました。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
    emph: true
  - text: ところが、ファンには、愛されてもいます。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: *guilty
  - text: 2009年、創立125周年。このシャツが、31年ぶりに戻ります。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *brown
      highlight_row: 2
  - text: 限定は、1125枚。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: none
    emph: true
  - text: しかも、そのシャツで、シーズン最後のホーム戦に出ました。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
  - text: ひどいと言われた色を、クラブは、自分から、着直したのです。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
    emph: true
  sources:
  - https://www.coventrytelegraph.net/sport/football/transfer-news/coventrys-infamous-chocolate-brown-kit-4066416
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
- id: talbot
  heading: 胸の車のロゴは、なぜ中継を断られたのか
  bg: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1980年代の初め、胸にタルボット。改名案も出たが通らず、中継は断られた
  card: *talbot
  say:
  - text: 1980年代のはじめ、胸に、車のメーカーの名前が入ります。タルボットです。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card:
      <<: *talbot
      highlight_row: 0
  - text: コヴェントリーの工場で、車を作っていた会社でした。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
  - text: 当時の会長は、ジミー・ヒル。
    image: assets/images/20261101_kit_coventry/c05_hill_w.jpg
    card: none
  - text: ヒルは、クラブの名前まで、コヴェントリー・タルボットに変えようとします。
    image: assets/images/20261101_kit_coventry/c05_hill_w.jpg
    card:
      <<: *talbot
      highlight_row: 1
    emph: true
  - text: けれど、この案は、通りませんでした。
    image: assets/images/20261101_kit_coventry/c05_hill_w.jpg
    card: none
  - text: シャツのほうも、問題になります。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *talbot
      highlight_row: 2
  - text: イギリスの放送局、ビービーシーの中継では、胸の広告は認められていませんでした。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: none
  - text: ロゴの目立つシャツの試合を、ビービーシーは、中継しないと言います。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card: none
  - text: そこでクラブは、カメラの入る試合のために、ロゴの無い別のシャツを用意しました。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
    emph: true
  - text: タルボットとの関係は、1983年の夏までに終わります。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card:
      <<: *talbot
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - https://en.wikipedia.org/wiki/Talbot
  - https://www.historicalkits.co.uk/Coventry_City/Coventry_City.htm
- id: twotone
  heading: 白と黒のシャツは、何の記念だったのか
  bg: assets/images/20261101_kit_coventry/c02_seats_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2019年の3着目は白と黒。街で生まれた音楽レーベル「2トーン」の40周年
  card: *twotone
  say:
  - text: 2019年、コヴェントリーは、白と黒の、3着目のシャツを着ました。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *twotone
      highlight_row: 1
  - text: 記念したのは、街で生まれた音楽レーベル、2トーン。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *twotone
      highlight_row: 0
  - text: ザ・スペシャルズなどの音楽で知られ、ちょうど40周年でした。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
  - text: クラブは、シャツで、街の歴史も着るのです。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
    emph: true
  sources:
  - https://www.bbc.co.uk/sport/football/50027298
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
- id: crest
  heading: 胸の紋章は、なぜ何度も替わったのか
  bg: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
  tier: 背景
  narrator: 解説
  telop: 小さな雄鶏、象と城、引っ込めた新案、ファンが決めた記念紋章、昇る不死鳥
  card: *crest
  say:
  - text: コヴェントリーの胸の紋章も、何度も替わっています。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card: none
  - text: 1959年の胸には、雄鶏の紋章がありました。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: この紋章を着たのは、このときだけでした。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card: none
    emph: true
  - text: 1969年には、町の紋章にいる、象と城が、胸に入ります。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 2005年、新しい本拠地に移る年に、新しい紋章を発表します。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: ところが、ファンの猛反対で、クラブは引き下がりました。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
    emph: true
  - text: 3年後、創立125年の記念の紋章は、ファンに聞いて決めます。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card:
      <<: *crest
      highlight_row: 3
  - text: そして2021年、街に戻る季の最初のシャツには、昇る不死鳥が入りました。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      <<: *crest
      highlight_row: 4
    emph: true
  sources:
  - https://www.historicalkits.co.uk/Coventry_City/Coventry_City.htm
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
- id: view
  viewpoint: true
  heading: 見立て・空色を離れた期間は、最初の何倍だったか
  bg: assets/images/20261101_kit_coventry/c01_derby_w.jpg
  tier: 背景
  narrator: 解説
  telop: 最初の空色は24年、離れたのは約40年。戻って5年で1部へ
  card: *view
  say:
  - text: コヴェントリーの空色を、数で並べます。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card: none
  - text: 最初の空色は、1898年から1922年までの、24年。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card:
      <<: *view
      highlight_row: 0
  - text: そのあと、空色を離れていた期間は、およそ40年。
    image: assets/images/20261101_kit_coventry/c01_derby_w.jpg
    card:
      <<: *view
      highlight_row: 1
    mark:
      kind: circle
      row: 1
  - text: 離れていた期間は、最初に着ていた期間の、約1.7倍です。
    image: assets/images/20261101_kit_coventry/c02_seats_w.jpg
    card:
      type: calc
      title: 離れた期間は、最初の何倍か（自分で割った）
      terms:
      - - 40年
        - 空色を離れた
      - - 24年
        - 最初の空色
      - - 約1.7倍
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 空色が戻った1962年から、初めての1部まで、5年でした。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card:
      <<: *view
      highlight_row: 2
  - text: そこから2001年まで、34年間、1部にいました。
    image: assets/images/20261101_kit_coventry/c04_sillett_w.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: 「最悪」と言われた茶色いシャツは、31年後に、復刻されています。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
  - text: 一度離れた空色に、クラブは戻ってきました。いまの胸にも、その空色があります。
    image: assets/images/20261101_kit_coventry/c03_ricoh2008_w.jpg
    card: none
    emph: true
  sources:
  - https://en.wikipedia.org/wiki/Coventry_City_F.C.
  - https://www.historicalkits.co.uk/Coventry_City/Coventry_City.htm
