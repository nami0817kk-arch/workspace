# ユニフォームとエンブレムの歴史 コヴェントリー（10/31 作成、11/1 分）。雛形は 10/29 ブレントフォード回。
# 題の問い：コヴェントリーの空色のシャツは、いつから空色だったのか（答え＝最初の空色は1898〜1922年。そのあと約40年離れ、1962年にジミー・ヒルが全身の空色で呼び戻した）。
# 選んだ理由：プレミア⑪→⑳→①→⑩の並びの続きは ⑦ コヴェントリー（残りは ⑦ と ⑩ フラム。Hull・Ipswich・Chelsea・Leeds・Arsenal 等は出し済み）。
#   フラムは「1896年から白シャツ・黒パンツで変わらない」ため歴史の節が薄く、ウィキペディアの kit の節はほぼスポンサー表だけ。コヴェントリーは色・紋章・広告の3つに話がある。
# 重なり確認（2026-10-31）：scripts/*kit_*・research/covered.yaml・research/posted.json を grep。コヴェントリーのユニフォーム回は無し。
#   20260920_pl07_coventry（クラブ紹介・41日前）、20261028_stadium_coventry（スタジアム・4日前）は別シリーズ。
#   スタジアム回は「ジミー・ヒルが1981年に客席を全部椅子にした」を言っている→この回では言わない。坂元達裕の話もそちらで済み→この回では言わない（シャツの話に自然に入る所が無い）。
# 今季のリーグ：ウィキペディア en "2026–27 Coventry City F.C. season"（league = Premier League、2026-10 時点 19位）と "Coventry City F.C."（The club competes in the Premier League）。
# 取材：requests だけ。ブラウザ操作・JS実行・検索のAI要約は使っていない。
#   読んだ：ウィキペディア en "Coventry City F.C."（Kit の節＝Colours／Kit makers and sponsorship、History の節）、"Jimmy Hill"、"Talbot"（Coventry City の記述）、
#     Historical Football Kits（HFK。ファンの資料サイトだが年表を明記）：Coventry City の Background、
#     Coventry Live（旧コヴェントリー・テレグラフ 2013-06-06）のチョコレート色の記事、BBC Sport 2019-10-13 の2トーンのシャツの記事。
#   読めなかった：クラブ公式（ccfc.co.uk の history ページは 404）。紋章の節は HFK 1本だけ→紋章の年・順は HFK の記述のまま、断定を弱めて言う。
# ---- 食い違い・断ったこと ----
#   ・タルボットの年：ウィキペディア「Coventry City」の表は 1980–81 から、「Talbot」の記事は「1981年から1983年」→「1980年代のはじめ」とだけ言う。
#   ・名前を変える案を止めたのは誰か：「Coventry City」は FA、「Talbot」は Football League →「通りませんでした」とだけ言う。
#   ・「リーグで最初の胸の広告」はウィキペディアの文だが、他の記録と食い違うおそれがあるので言わない。
#   ・BBC が中継を断った話は HFK だけ（「胸の広告は BBC の中継で禁止」「カメラのある試合だけ別のシャツ」）。台本は事実の形で書き、取材メモに単独出典と残す。
#   ・空色の年：ウィキペディア「1898年に初めて着て、1922年まで」「そのあと青と白の組み合わせが1960年代まで」。HFK の表と矛盾なし。1922→1962 は「およそ40年」と言う。
#   ・1962：ウィキペディア「Colours」は「1962年にヒルが戻した」。HFK は「1961年11月〜1962年に新しい全身の空色」。「ヒルが監督になったのは1961年11月、空色は翌1962年」と言う。
#   ・チョコレート色の復刻：ウィキペディアは「2008–09年の最終ホーム戦（ワトフォード戦）」、Coventry Live は「2009年に創立125周年の復刻版を1125枚限定」→「2009年」。
#     その試合の結果（2点差を逆転された）は入れない。
#   ・「最悪のシャツ」：Coventry Live「イギリスのサッカー史で最悪のおしゃれ、と何度も投票された」→「何度もひどいと名指しされてきた」。順位は言わない。
# ---- 自分で数えた数 ----
#   最初の空色：1922−1898＝24年。　離れていた期間：1962−1922＝40年（およそ）。　40÷24＝1.67→「約1.7倍」。
#   空色が戻って初の1部：1967−1962＝5年。　1部にいた年数：ウィキペディア「34年連続」（1967〜2001）。
#   チョコレート色→復刻：2009−1978＝31年。　創立125周年：1883＋125＝2008（復刻は2009）。
#   紋章：2005年の発表→2008年の記念紋章＝3年後。
# ---- 日本との接点 ----
#   坂元達裕が在籍（research/pl_data/japan.json）。だが10/28 のスタジアム回で話した。ユニフォームの話と結ぶ自然な所が無いので入れない。
# ---- 写真（assets/images/20261101_kit_coventry/、出典は credits.json）----
#   10/28 のスタジアム回の Commons の写真を写したもの＋ジミー・ヒルの像など。エンブレム画像・放送映像・代理店の写真は使っていない。
