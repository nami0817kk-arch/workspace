- id: rule
  main: true
  heading: クラブには代表へ出す義務がある
  tier: 確定
  official: true
  telop: 国際サッカー連盟の規則「クラブは、招集された選手を代表チームに出さなければならない」
  narrator: キャスター
  say:
  - text: 日本が勝ち進めば、ソシエダと重なる試合は最大で11。前回の大会は7でした。
    short_only: true
  - voice: 国際サッカー連盟
    text: クラブは、代表チームに招集された選手を、
  - voice: 国際サッカー連盟
    text: 出さなければならない。
    cont: true
  - voice: 国際サッカー連盟
    text: これに反する、選手とクラブの取り決めは禁止する。
    cont: true
  - text: 日本の協会が久保建英を呼べば、ソシエダは送り出すしかありません。
    emph: true
  quotes_from:
  - 国際サッカー連盟（選手の地位と移籍に関する規則 付属文書1 第1条1項） https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  sources:
  - https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  - https://digitalhub.fifa.com/asset/5c0e740b-0810-4349-a7ba-256b16bda300/FIFA-Legal-Handbook-2026.pdf

- id: window
  heading: 国際試合の期間の外でも出す理由
  tier: 確定
  official: true
  telop: 出す義務は「国際試合の期間」と「W杯・大陸の選手権の本大会」。アジアカップは後者
  narrator: 解説
  card:
    type: table
    title: 出す義務がある代表の活動（第1条）
    columns: &c2
    - 活動
    - 長さ
    rows: &r2
    - - 国際試合の期間
      - 9日（9〜10月は16日）
    - - ワールドカップ本大会
      - 大会の期間
    - - 大陸の選手権の本大会
      - 大会の期間
  say:
  - text: 普段の代表戦は、リーグを止めて行う、国際試合の期間に組まれます。
    image: assets/images/20261007_explain_callup/02_w.jpg
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2, highlight_row: 0}
  - text: 月曜から翌週の火曜までの9日間です。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2, highlight_row: 0}
  - text: この秋からは、9月と10月の期間が16日間に広がりました。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2, highlight_row: 0}
  - text: この秋、久保建英が日本代表で戦ったのも、この16日間でした。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2, highlight_row: 0}
  - text: アジアカップの30日間は、この期間の外にあります。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2}
  - text: 出す義務は、ワールドカップと大陸の選手権にも及ぶと、規則が名指ししています。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2}
  - text: アジアカップは、アジアの代表の選手権。まさにこれに当たります。
    card: {type: table, title: 出す義務がある代表の活動（第1条）, columns: *c2, rows: *r2, highlight_row: 2}
  - text: 国際サッカー連盟が公開する日程表にも、1月7日から2月5日で載っています。
    card: none
  sources:
  - https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  - https://digitalhub.fifa.com/m/3123d37097318f7f/original/Men-s-International-Match-Calendar-2023-2030_EN.pdf

- id: when
  heading: 招集は12月28日から、戻るのは最後の試合の翌朝
  tier: 確定
  official: true
  telop: 出すのは開幕の前の週の月曜＝12月28日の朝。代表を離れるのはチームの最後の試合の翌朝
  narrator: キャスター
  card:
    type: table
    title: アジアカップ2027の招集の流れ（付属文書1）
    columns: &c3
    - 手順
    - 日付
    rows: &r3
    - - 選手への書面の知らせ
      - 12月13日まで
    - - クラブの返事
      - 知らせから6日以内
    - - クラブを離れる
      - 12月28日（月）の朝
    - - 開幕
      - 1月7日（木）
    - - 代表を離れる
      - 最後の試合の翌朝
    - - クラブに戻る
      - そこから48時間以内
  say:
  - text: では、いつからクラブを離れるのか。規則は曜日で決めています。
    card: none
  - text: 大会が始まる週の、1つ前の週の月曜の朝です。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 2}
  - text: 開幕は1月7日の木曜。その前の週の月曜は、12月28日です。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 2}
  - text: 開幕の10日前。インドネシア戦から数えれば、2週間前に合流します。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 3}
  - text: 招集されれば、久保建英がソシエダを離れるのもこの日です。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 3}
  - text: 呼ぶ側の協会は、その15日前までに選手へ書面で知らせる決まり。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 0}
  - text: 逆算すると12月13日。クラブは、そこから6日以内に返事をします。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 1}
  - text: 代表を離れるのは、チームの最後の試合の翌朝。決勝まで行けば2月6日です。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 4}
  - text: クラブへ戻るのは、その48時間以内。大陸をまたぐので、普段の24時間の倍です。
    card: {type: table, title: アジアカップ2027の招集の流れ（付属文書1）, columns: *c3, rows: *r3, highlight_row: 5}
  - text: ただし日付は、クラブと協会が話し合えば変えられます。
    card: none
  - text: 前回2024年の大会では、クラブを離れる日が元日の月曜でした。
    card: none
  - text: それでも遠藤航は、その夜のリバプールの試合に出てから合流しています。
    card: none
  sources:
  - https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  - https://digitalhub.fifa.com/m/3123d37097318f7f/original/Men-s-International-Match-Calendar-2023-2030_EN.pdf
  - https://inside.fifa.com/legal/documents

- id: refuse
  heading: 断っても、その選手は5日長くクラブで出られない
  tier: 確定
  official: true
  telop: 規則「招集された選手は、出されるべきだった期間と、さらに5日間、クラブの試合に出られない」
  narrator: 解説
  card:
    type: table
    title: 断ったら・けがをしたら（付属文書1）
    columns: &c4
    - 場面
    - 規則
    rows: &r4
    - - クラブが出さない
      - その期間＋5日はクラブで出られない
    - - 規則に反した
      - 懲戒委員会が処分（第6条）
    - - 出したクラブへのお金
      - 補償を受ける権利はない
    - - 代表で大けが
      - 国際サッカー連盟が補償
  say:
  - text: もしクラブが、選手を出さなかったらどうなるのか。規則はこう書いています。
    card: none
  - voice: 国際サッカー連盟
    text: 招集された選手は、出された期間、
    card: none
  - voice: 国際サッカー連盟
    text: または出されるべきだった期間と、
    cont: true
    card: none
  - voice: 国際サッカー連盟
    text: さらに5日間、クラブの試合に出ることができない。
    cont: true
    card: none
  - text: 協会が認めない限り、です。ソシエダが断っても、久保建英は使えません。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 0}
  - text: 日本が決勝まで進めば、12月28日から2月11日まで。46日間です。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 0}
    emph: true
  - text: 大会の30日より16日も長く、手元に置けない計算です。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 0}
  - text: 規則に反すれば、国際サッカー連盟の懲戒委員会が処分を決めます。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 1}
  - text: 選手を出したクラブへのお金も無し。補償を受ける権利はない、と明記されています。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 2}
  - text: 代表戦の大けがで長く離れたときだけ、国際サッカー連盟がクラブに補償します。
    card: {type: table, title: 断ったら・けがをしたら（付属文書1）, columns: *c4, rows: *r4, highlight_row: 3}
  quotes_from:
  - 国際サッカー連盟（選手の地位と移籍に関する規則 付属文書1 第5条） https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  sources:
  - https://digitalhub.fifa.com/m/696d877ea35ca761/original/Regulations-on-the-Status-and-Transfer-of-Players-January-2026-edition.pdf
  - https://digitalhub.fifa.com/asset/5c0e740b-0810-4349-a7ba-256b16bda300/FIFA-Legal-Handbook-2026.pdf

