  say:
  - text: 最後に、ほかの日本人選手も同じ物差しで数えます。
    card: none
  - text: 大会の最後まで日本が残ったとして、12月28日から2月5日の試合です。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7}
  - text: 数えたのはリーグ戦と、チャンピオンズリーグなど欧州の大会。国内の杯は除外。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7}
  - text: 多いのはイングランドの2人。遠藤航と鎌田大地は8試合です。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 0}
  - text: 年末年始も休まないプレミアリーグは、リーグ戦だけで6試合が重なります。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 1}
  - text: カップ戦を数えなくても、2024年に遠藤が欠けた7試合より1つ多い数です。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 0}
    emph: true
  - text: ドイツは12月20日から1月8日まで冬の休み。伊藤洋輝はリーグ戦が5試合です。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 3}
  - text: フランスはリーグ戦4試合。上田綺世はチャンピオンズリーグの2試合を足して6試合。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 5}
  - text: 久保は、国王杯とスーパーカップを足すと最大11。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 2}
  - text: 2019年の柴崎岳の9試合を、2つ上回ります。
    card: {type: table, title: 大会に重なるクラブの試合（12月28日〜2月5日）, columns: *c7, rows: *r7, highlight_row: 2}
  - text: 招集の知らせの期限は12月13日。誰が何試合離れるか、そこで見えてきます。
