- id: kubo
  heading: ソシエダで数える「11試合」の中身
  tier: 報道
  telop: 日本が決勝まで進み、ソシエダが勝ち上がれば、2月5日までに10試合。翌日のスーパーカップ決勝で11
  narrator: キャスター
  card:
    type: table
    title: ソシエダの試合のうち大会に重なる数（12月28日から）
    columns: &c6
    - 日本の最後の試合
    - 重なる試合
    - うちリーグ戦
    rows: &r6
    - - 1次リーグ（1月20日）
      - '5'
      - '3'
    - - 16強（1月24日）
      - '7'
      - '4'
    - - 8強（1月28日）
      - '8'
      - '4'
    - - 4強（2月1日）
      - '9'
      - '5'
    - - 決勝（2月5日）
      - 10（翌日11）
      - '5'
  say:
  - text: 題の数字は、久保建英のソシエダで、いちばん多く数えた場合です。
    card: none
  - text: ソシエダの1月は、リーグ戦、ヨーロッパリーグ、国王杯、スーパーカップ。
    card: none
  - text: リーグ戦は1月3日から週末ごとに5試合。2024年に欠けたのは4試合でした。
    card: none
  - text: ヨーロッパリーグは21日と28日。最後の2試合が大会に重なります。
    card: none
  - text: 国王杯は、12月16日の試合に勝てば、1月6日と13日にも試合が入ります。
    card: none
  - text: さらにスペインのスーパーカップ。国王杯の前回王者として出場します。
    card: none
  - text: 2月3日の準決勝の相手は、レアル・マドリードです。
    card: none
  - text: 日本が2月5日の決勝まで残れば、重なるのは10試合。前回の7試合より3つ多い。
    card: {type: table, title: ソシエダの試合のうち大会に重なる数（12月28日から）, columns: *c6, rows: *r6, highlight_row: 4}
  - text: 翌日の夜はイスタンブールでスーパーカップの決勝。勝ち上がれば、11に届きます。
    card: {type: table, title: ソシエダの試合のうち大会に重なる数（12月28日から）, columns: *c6, rows: *r6, highlight_row: 4}
  - text: 1次リーグで敗退なら5試合。そのうちリーグ戦は3試合です。
    card: {type: table, title: ソシエダの試合のうち大会に重なる数（12月28日から）, columns: *c6, rows: *r6, highlight_row: 0}
  sources:
