  topic: 日本代表
  title: アジアカップで久保建英は最大11試合いなくなる？代表の招集とクラブのルール
  question: 来年1月のアジアカップで、欧州のクラブは日本人選手をいつから何試合手放すことになり、それを断れるのか
  takeaway: 国際サッカー連盟の規則では、アジアカップは国際試合の期間の外でも出す義務があり、解放は開幕の前の週の月曜＝12月28日から。断っても選手はその期間と5日間クラブで出られないので、日本が決勝まで行けば2月11日までの46日間は使えない。12月28日から2月5日のリーグ戦と欧州カップを数えると、遠藤航と鎌田大地は8試合で、2024年に遠藤が欠けた7試合を上回る。久保はソシエダが国王杯とスーパーカップを勝ち進めば最大11試合で、2019年の柴崎岳の9試合より2つ多い
  opening_image: assets/images/20261007_explain_callup/01_w.jpg
