  - id: red
    main: true
    heading: 18分後の2枚目
    tier: 報道
    telop: 66分に2枚目の警告で退場。9人に
    narrator: キャスター
    card:
      type: table
      title: セウタ対ソシエダB
      columns: [時間, 出来事]
      rows:
        - [33分, 味方のフォワードが一発退場]
        - [44分, 喜多に1枚目の警告]
        - [48分, 喜多が先制点]
        - [66分, 喜多に2枚目の警告、退場]
        - [67分, 同点]
        - [81分と90+9分, 逆転され1対3]
    say:
      - text: レアル・ソシエダのBチームの喜多壱也が、48分にプロ初ゴールを決めた試合。
        short_only: true
      - text: ところが66分。喜多に2枚目のイエローカード。退場です。
        image: assets/images/20260927c_kita_match/01.jpg
      - 2枚目は、センターサークルでボールに伸ばした足が、相手を蹴ったと判定されました。
      - 前半にもう1人退場していたソシエダBは、これで9人。
      - 直後の67分に同点。81分に逆転され、最後は1対3で敗れました。
      - 相手のセウタは、この試合まで最下位。これが今季初めての勝利でした。
      - 試合の終わりには、両チームがもみ合う場面もありました。
      - ソシエダBのアンソテギ監督は、判定よりも自分たちの振る舞いを責めています。
      - voice: ジョン・アンソテギ
        text: 審判が退場だと思ったのなら、それは退場だ。私から言うことはない
      - voice: ジョン・アンソテギ
        text: 監督になってまだ日が浅いが、今日は最悪の日だ
      - voice: ジョン・アンソテギ
        text: サッカーの中身の話ではない。それ以外のすべてだ
      - voice: ジョン・アンソテギ
        text: 挑発に乗って、言い返して、押し合う。そんな姿を見せてはいけない
    sources:
