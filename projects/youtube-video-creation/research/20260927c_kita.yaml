  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「初ゴール決めてる！！って思ったら」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 喜多ゴール決めてる！！ そして退場してる
        short_voice: true
      - voice: ネット民
        text: 喜多くん初ゴール決めてる！！って思ったらなんか退場してて、しかもマリエスクレナもやし情報量多いな
      - voice: ネット民
        text: 1枚目のレッドもひどいし、喜多の1枚目のイエローも同じだ……
      - voice: ネット民
        text: 喜多ちゃん初ゴール決めて退場とか持ってるのか、持ってないのか？
        short_voice: true
      - voice: ネット民
        text: スペインのVARはまったく意味が分からない。今日のセウタ戦、ソシエダBはとんでもない判定泥棒にあった
      - voice: ネット民
        text: 9人では耐え切れなかったか…。せめて喜多壱也選手が残っていれば違ったのかな…。
      - voice: ネット民
        text: DFとしては得点でのプラスよりも退場したマイナスで評価される。痛い。
      - voice: ネット民
        text: 若者たちはクラブのために全力を尽くした。今日はばかにされた。クラブは彼らを守るべきだ
      - voice: ネット民
        text: サンセは喜多くん退場する前に前半に1人退場してたのね。
      - voice: ネット民
        text: Sofascoreでは退場してるのに評価むっちゃいい。退場するまでは良かったのかな。
        cont: true
      - voice: ネット民
        text: プロ初ゴールおめでとう。出来たら勝ちたかったけどね。
      - voice: ネット民
        text: 2人目の退場者となって負けたのは大いに反省して、次試合出る時はチームの勝利に貢献して欲しいと思います。
        cont: true
      - voice: ネット民
        text: 応援してます。頑張って！
        cont: true
        short_voice: true
