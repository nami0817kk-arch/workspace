    say:
      - text: レアル・ソシエダのBチームでプレーする、21歳のセンターバック、喜多壱也。
        image: assets/images/20260927c_kita/01.png
      - 開幕から7試合、すべてに先発しています。
      - 9月26日、スペイン2部のセウタ戦。33分に味方のフォワードが一発退場し、10人になります。
      - 44分には、喜多に1枚目の警告が出ています。
      - そして48分、後半が始まってすぐ。コーナーキックの流れから、こぼれ球を左足で決めて先制。
      - 京都サンガ時代を含めて、これがプロ初ゴールでした。
      - voice: ネット民
        text: 喜多くん初ゴール決めました！！！！
      - voice: ネット民
        text: 待ち望んだ初ゴール
    sources:
      - https://www.realsociedad.eus/es/noticias/detalle/condicionados-3
