sections:
  - id: what
    heading: いまの状況
    tier: 報道
    telop: 契約は、あと2年
    narrator: キャスター
    say:
      - リヴァプールのマック・アリスター。契約は、あと2年残っています。
      - その先について聞かれて、こう答えました。
    sources:
      - https://x.com/FabrizioRomano/status/2102064636811952337
  - id: said
    main: true
    heading: 言ったこと
    tier: 報道
    telop: 「2年だけになっても、それはそれで構わない」
    narrator: キャスター
    say:
      - text: 'リヴァプールとの契約が残り2年のマック・アリスターが、自分の将来について話しました。'
        short_only: true
      - voice: マックアリスター
        text: 最終的な決断は、まだ何も決まっていない。現実として、契約はまだ2年残っている。
      - voice: マックアリスター
        text: 全力を尽くすつもりだ。2年あれば、いろんなことが起こりうる。可能性はたくさんある。
      - voice: マックアリスター
        text: 自分としては、今いる場所を本当に楽しんでいる。
      - voice: マックアリスター
        text: できれば、もっと長く残りたい。**でも、それが2年だけになっても、それはそれで構わない。**
      - voice: マックアリスター
        text: 家族とこの時間を楽しみたい。ここが世界最高のクラブの一つだということに、疑いはないから。
    sources:
      - https://x.com/FabrizioRomano/status/2102064636811952337
      - https://x.com/FabrizioRomano/status/2102189041005273565
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: これを聞いた人が書いていたこと
    narrator: キャスター
    say:
      - voice: ネット民
        text: マック・アリスターが「2年あればいろんなことが起こる」とだけ言って、リヴァプールのファンが全員考えすぎてる。2年より先も残ると思う？
      - voice: ネット民
        text: 「できれば残りたい」と「2年だけでも構わない」を同じ話の中で言うのか。リヴァプールのファンなら少し心配になる。
      - voice: ネット民
        text: 移籍を否定しているようには聞こえない
      - voice: ネット民
        text: 焦らず、騒がず、ただ全力を尽くすことに集中している。もっと長く残れるなら、なおいい。YNWA
      - voice: ネット民
        text: マクアリスターと契約延長しない理由がマジで一つもないのにフロントから声がかからないの、本当に何故？？？
      - voice: ネット民
        text: リヴァプールの中盤で一番良いのずっとマクアリスターだと思うんだけどなんでこいつが放出候補とされてんの？
      - voice: ネット民
        text: 現状ソボスライとヴィルツを併用すると意識が攻撃に傾くからそのバランスを取れるマクアリスターは必須だし、来季移籍しちゃうなら気が利く選手が必要
      - voice: ネット民
        text: マクアリスターも延長してほしいけど、ファンダイクも延長してもらいたい。このまま来シーズンいけば、アリソン&ファンダイク卒業はDFラインの統率がなくなりそう
      - voice: ネット民
        text: このクラスをフリーで出すとか意味わからん。まぁ年俸ふっかけてるって情報も流れてたが
      - voice: ネット民
        text: この活躍を見てもまだ新契約しないのか？馬鹿げてる。彼以上を探すのは難しいよ。また移籍金を高く支払いフィットせずに放出を繰り返すつもり？
      - voice: ネット民
        text: ほんとマクアリスターは早く契約延長して欲しいなと。続報待つばかりです。
        short_voice: true
    sources:
      - https://x.com/FabrizioRomano/status/2102064636811952337
