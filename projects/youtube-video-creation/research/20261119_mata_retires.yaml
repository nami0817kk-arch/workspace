# 取材メモ（2026年11月19日）フアン・マタ、38歳で現役引退。「プロとしてプレーすることはやめても、サッカー選手であることをやめることはない」（ニュースのショート。見せ方 Y＝本人の言葉から始める。18時以降の枠＝日本人以外の題）
# 取材: 2026-11-19。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具・FotMob は使っていない。
# リーグの扱い: マタ自身の経歴がプレミアリーグ（チェルシー2011〜14・マンU 2014〜22）とラ・リーガ（バレンシア）にある。欧州7リーグの舞台での歩みを中心に話す。神戸・オーストラリアは1行ずつ。
# 出典:
#   ・BBC Sport 2026-11-18 10:12 GMT「Former Spain midfielder Mata retires aged 38」（全文） https://www.bbc.com/sport/football/articles/c8p3vwe1rrzqo
#       41試合スペイン代表。2010 W杯優勝メンバー、2年後のEURO（決勝4-0イタリア戦で得点）。レアル・マドリードの下部組織出身、2007年にバレンシア、2011年8月にチェルシー（CL・ヨーロッパリーグ・FAカップ）。2014年1月にマンUへ（ヨーロッパリーグ・FAカップ・リーグカップ）、2022年に契約満了で退団。ガラタサライ、神戸、ウェスタン・シドニー、メルボルン・ビクトリー。
#       チェルシーの年間最優秀選手は、在籍した2シーズンとも。チェルシーでリーグ82試合18得点。マンUで285試合51得点。チェルシー「What a player」、マンU「Congratulations on a fantastic career, Juan!」。
#       本人の言葉（英語）: "Football will never leave my life. There are so many ways to continue loving the game, so many ways to keep using it as a vehicle for development. I may stop playing professionally, but I will never stop being a footballer."
#   ・サッカーキング 2026-11-18「元スペイン代表MFフアン・マタが38歳で現役引退…W杯やCLを制覇、かつて神戸にも在籍」 https://www.soccer-king.jp/news/world/esp/20261118/2229445.html
#       18日に公式X（@juanmata8）で英語とスペイン語で「愛するということは、時に手放すということでもある。フットボールよ、ありがとう」と綴り、笑顔で2足のスパイクを壁に吊るす動画を投稿。1988年生まれの38歳。2007年12月バレンシアでプロデビュー、4年で174試合33得点53アシスト。2011年夏チェルシー（CL）、2014年1月マンU（クラブキャリア最多285試合）。
#       2023年9月にヴィッセル神戸へ完全移籍。公式戦の出場は1試合のみだが、J1初制覇のチームの一員。その後オーストラリアへ。スペイン代表は2009年3月デビュー、41試合10得点9アシスト。W杯2010初優勝・EURO2012優勝メンバー。
#   ・フットボールチャンネル 2026-11-19 https://www.footballchannel.jp/2026/11/19/post1058294/
#       「時には愛するものを手放すことも…。ありがとう、フットボール」。約20年のキャリア。2006年レアル・マドリード・カスティージャ→バレンシア→チェルシー→マンU→ガラタサライ→ヴィッセル神戸→ウェスタン・シドニー…。昨季はオーストラリアリーグの最優秀選手。
#       クラブでCL1・ヨーロッパリーグ2・FAカップ2・コパ・デル・レイ1・EFLカップ1・コミュニティ・シールド1、トルコと日本でリーグ優勝。代表でも2010W杯・EURO2012・U-21欧州・U-19欧州・ロンドン五輪出場。「Common Goal」を創設。
#       本人の言葉（日本語訳）: 「これだけ長い年月を過ごせたのは、プレーを楽しんできたからだ。毎朝、練習や試合に向かう気持ちで起きていた。オールド・トラッフォードやスタンフォード・ブリッジ、メスタージャのような素晴らしい舞台でも、あるいは冬になると泥だらけになった、ユベントゥ・エスタディオでの始まりの頃でも。人生のあらゆることにおいて、この情熱は欠かせないものだった」
#         「成長し、旅をし、さまざまな国で暮らす中で、スポーツ全般、そしてサッカーが人々の人生を変えるうえで、どれほど重要なのかを理解した」
#         「サッカーが私の人生からなくなることはない。サッカーを愛し続ける方法はたくさんあるし、発展のための手段としてサッカーを活用し続ける方法もある。プロとしてプレーすることはやめても、サッカー選手であることをやめることはない」
#   ・Marca 2026-11-18（スペイン語、記事の articleBody を読んだ） https://www.marca.com/futbol/2026/11/18/juan-mata-cuelga-botas-veces-amar-dejar-gracias-futbol.html
#       本人の投稿（原文）: "A veces, amar es dejar ir... Gracias fútbol" ／ "Puedo dejar de jugar profesionalmente, pero nunca voy a dejar de ser futbolista"（BBC の英語と同じ内容）。
#       "Han sido tantos años gracias al disfrute por el juego. A levantarme cada mañana con ganas de entrenar, de jugar, bien sea en escenarios magníficos como Old Trafford, Stamford Bridge o Mestalla…" → 日本語訳（フットボールチャンネル）と意味が一致。
#       2006年にレアル・マドリード・カスティージャで頂点へ。5か国（スペイン・イングランド・トルコ・日本・オーストラリア）。クラブのタイトルは CL1・EL2・FA2・コパ・デル・レイ1・EFL1・コミュニティ・シールド1、トルコと日本のリーグ。
# 出典の食い違い: ・投稿の訳は2社で違う（サッカーキング「愛するということは、時に手放すということでもある」／フットボールチャンネル「時には愛するものを手放すことも…」）。原文 "A veces, amar es dejar ir" と合う。→ 台本はサッカーキングの訳を、出典の字のまま使う。
#   ・通算の試合数・得点は Marca（700超・158点）と Wikipedia の表（510試合104点）で食い違う。→ 台本では使わない。マンUの285試合は BBC・サッカーキングで一致。
# 自分で数えたもの: クラブのタイトル 8（CL1+EL2+FA2+コパ・デル・レイ1+EFLカップ1+コミュニティ・シールド1）＋リーグ優勝2（トルコ・日本）＝10。BBC がチェルシーに挙げる3（CL・EL・FA）、マンUに挙げる3（EL・FA・EFLカップ）＝6。残りの2（コパ・デル・レイ、コミュニティ・シールド）は合計との差。台本は「そのほか国内のカップとスーパーカップが2つ」とだけ言い、どのクラブかは言わない。
#   プレーした国は5か国（Marca）。
# 前の本との重なり: マタ・Juan Mata は posted.json・covered.yaml・直近の scripts に無い（grep 済み）。
# 【言わないこと】通算の試合数・得点／引退後の私生活／「W杯で活躍」の言い方（2010年の出場は出典に無い。「優勝メンバー」とだけ言う。実際は台本で触れていない）／神戸での活躍（出場は1試合のみ。「一員」とだけ）／チェルシー・マンUの退団の事情。
# 本人の言葉: あり（フアン・マタ。引退の声明。BBC・サッカーキング・フットボールチャンネル・Marca）。Y。
# 反応: 0件（作らない。approve は --no-voices）。チェルシーの投稿 "What a player"（BBC が伝えた投稿そのもの）の訳は「なんて選手だ」。声に出すとアルファベットが残るため日本語にした。
