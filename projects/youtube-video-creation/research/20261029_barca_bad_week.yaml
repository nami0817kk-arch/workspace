#   ペドリのボール喪失は 10/26、フリックの経歴は 10/27。重ならないよう、**今日の新しい数字「最終ラインの組み合わせ」だけ**を軸にした。
#   マルカ「La defensa, una pesadilla para Flick」（www.marca.com/futbol/barcelona/2026/10/28/defensa-pesadilla-flick.html。requests で本文を全部読んだ。2026-10-28 17:34 更新）:
#     公式戦13試合（リーグ10・CL3）で、フリックは10通りの最終ライン（combinaciones defensivas）を並べた。同じ並びを2回以上使ったのは2つだけ。
#     最多＝エリック・ガルシア、ジェラール・マルティン、クバルシ、エスパルト（3試合：アスレティック、バレンシア、レバンテ）。
#     2番目＝エスパルト、クバルシ、ジェラール・マルティン、カンセロ（2試合：PSG、レアル・マドリー）。残り8通りは1度きり。
#     土曜のアラベス戦で新しい並びが入り、11通り目（14試合）になる見込み。クンデはまだチームの練習に戻っておらず、エスパルト・クリステンセン・エリック・ガルシアは治療中。
#     先発の候補はバルデ（今季まだ先発なし）か下部組織、カンセロは右へ。中盤はロドリとペドリが大一番でそろって出られている、両ウイングはヤマルとゴードン、ラフィーニャが9番（2試合ほど欠場）。
#   フット・メルカート「Comment le FC Barcelone compte rebondir après sa terrible semaine」（requests で本文を読んだ。28日22:11）:
#     11連勝の開幕から、PSG 2-4（敵地、CL）とクラシコ 1-2 の2連敗。クラシコに勝っていれば9差だった首位の差は3差。
#   ESPN の順位表（site.api.espn.com/apis/v2/sports/soccer/esp.1/standings）: バルサ 10試合・勝ち点27・1位、アトレティコ25、レアル24 → 首位の差はレアルと3、アトレティコと2。
#   ESPN の日程（scoreboard dates=20261031）: アラベス at バルセロナ 2026-10-31 20:00Z（スペイン21:00）＝土曜。※ 10/27 の台本は「日曜」と書いている（誤り）。公開済みなので触らない。
# 言わないこと: ペドリ・ロドリのボール喪失の数（10/26）、エスパルトの負傷の中身・7週間（10/27）、「右サイドバックで出た2試合は負け」（10/27 の見立て）、
#   ガビ・ラフィーニャの話（別の題材）、アラベス戦の結果（試合前の内容）、先発の予想を言い切ること（マルカは「可能性」）。
# 本人の言葉: 無い → 型は X。
# 確度: 組み合わせの数・並び・試合名は報道（マルカ）。PSG戦・クラシコの結果と勝ち点・日程は ESPN（報道）。「9差が3差」はフット・メルカートの算術を ESPN の勝ち点（27/24）で確かめた。
# 反応: 作らない（0件）。
# 写真: すべて FCバルセロナ公式（© FC Barcelona。代理店のクレジットではない）。10/25 クラシコのギャラリー（fcbarcelona.com/en/football/first-team/photos/4598658）。
#   背番号は ESPN の名簿と突き合わせて目で確認：01＝5番クバルシ、02＝2番カンセロ、03＝3番バルデ、04＝フリック監督、05＝カンセロ（2）とクバルシ（5）、06＝16ロドリ・2カンセロ・18ジェラール・マルティン。
#   10/27 のエスパルトの回とは別のコマ（エスパルトの写真は使わない）。
