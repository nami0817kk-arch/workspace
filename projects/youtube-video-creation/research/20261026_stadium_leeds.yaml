      - 会社の形が、少し変わっただけに見えるかもしれない。
      - それでもサポーターは、この意味を分かってくれるはずだ。リーズ・ユナイテッドとエランド・ロードは、いつまでも分かちがたく結ばれているべきだ、という持ち主の意思だ。
      highlight:
      - 分かちがたく結ばれている
  - text: クラブと本拠地は、いつまでも分かちがたく結ばれているべきだ、と。
