# スタジアム紹介シリーズ：リーズ・ユナイテッドの本拠地（エランド・ロード、10/26）。雛形は 10/25 サンダーランドの回。
# 重なりの確認（2026-10-26）：scripts/・research/covered.yaml・research/posted.json に stadium_leeds は無い（scripts/*stadium* は17本、リーズ無し）。
#   クラブ紹介⑬リーズ（2026-09-20／09-21 公開）とユニフォーム kit_leeds（10/16）は別シリーズ。本拠地の持ち主の移り変わり・拡張・入場の推移は言っていない。
# 今の立場（一次情報）：PL公式ハンドブック2026/27 の Club Directory: Leeds United（控え research/raw/20261021_nufc_plhandbook.txt 1155〜1239行）。
#   収容 37,633（Ground Capacity at start of the Season）・ピッチ 105×68m。2025/26 は14位（同 32836行）。
#   PL公式の試合API（sdp-prem-prod.premier-league-prod.pulselive.com）2026/27 第2・4・5・7節がエランド・ロードのリーグ戦。第8節 10/25 サンダーランド対リーズは未開始（PreMatch）。
# 田中碧の在籍（一次情報）：PL公式の試合API の出場表（matches/2645230・2645240・2645260 の lineups）。背番号22。
#   8/30 ブレントフォード戦は途中（45分から、2645210 の events）／9/14 ニューカッスル戦・9/20 パレス戦・10/18 マンU戦は先発。→ ホームのリーグ戦4試合すべてに出場（先発3・途中1）。
#   9/14：32分の先制点は公式記録でニューカッスルのマイリーのオウンゴール（2645230 events の goalType Own）。田中のミドルが当たって入った（サッカーキング 2026-09-15）。4対1、入場36,693。
#   9/20：パレスの先発に冨安健洋・鎌田大地（2645240 lineups）。日本人3人が先発。0対0、入場36,462。
# 軸：A＝収容3万7633人はプレミア20クラブで10位（ハンドブック）。
#     B＝本拠地は2度クラブの手を離れた。1982年に市へ売り、1998年に買い戻し。2004年に財政難で売り、2017年に当時の親会社の会社が買い、2024年3月27日に20年ぶりにクラブの持ち物に。
#     C＝拡張の許可（2026-01-08）で最大5万3000席へ。昨季の平均は収容の97.5％、シーズンチケットの順番待ちは2万6000人。増える約1万5000席では足りない。
# 収容のランキング（ハンドブック）：9位チェルシー 40,044／10位リーズ 37,633／11位ヴィラ 36,887／1位マンU 74,158。6位エヴァートン 52,769・7位ニューカッスル 52,729。
#   自分で引いた・割った：40,044-37,633=2,411／37,633-36,887=746／37,633÷74,158=0.507＝約51％／53,000-37,633=15,367／26,000-15,367=10,633／57,892-53,000=4,892／57,892÷37,633=1.54。
#   5万3000席を今季の20クラブに当てはめると、エヴァートン52,769より上で6番目（自分で並べた。BBC は「イングランドのサッカー場で7番目」と書く＝別の物差しなので言わない）。
# 本拠地の歴史（ウィキペディア en "Elland Road"、控え scratchpad の wp_elland.txt）：
#   エランドの町へ向かう道（A643）沿い。ビール会社の土地で、向かいのパブにちなみ「オールド・ピーコック・グラウンド」→ 愛称ピーコックス。
#   1897年にラグビーのホルベックが使い始める。1904年にリーズ・シティが借りる。1919年にシティが不正な支払いでリーグから追放。1920年に、できたばかりのリーズ・ユナイテッドが250ポンドで買う。
#   最多入場 57,892（1967-03-15、FAカップ5回戦の再試合、サンダーランド戦）。
#   1982年夏に市へ250万ポンドで売り、125年の借地。1998年に親会社リーズ・スポーティングが1000万ポンドで買い戻す。
#   1993年完成の東スタンドは1万7000席・550万ポンド（BBC 2026-01-08 も「1993年の550万ポンドの東スタンド以来の大きな改修」と書く）。
#   2017年6月、ラドリザーニの会社 Greenfield Investment が2000万ポンドで買う（金額はヨークシャー・イヴニング・ポストの記事が出典。台本では言わない）。
# 持ち主（リーズ公式 2024-07-10 "Elland Road ownership transferred back to Leeds United"、BBC 2024-07-10）：
#   2004年に財政難の中で売った／2017年に当時の親会社 Greenfield Investment が買う／2020年12月に Elland Road Limited へ／2023年7月に49ersエンタープライズが両社を握る／
#   2024年3月27日、Elland Road Limited がリーズ・ユナイテッド・フットボールクラブの持ち物に。2004年以来はじめて。キニアCEOの言葉（訳した）。地域の共有財産（ACV）にも登録。
# 拡張（リーズ公式 2026-01-08 "Leeds United secure planning permission…"、BBC 2026-01-08）：
#   市の計画委員会が許可。西と北のスタンドを広げ、南を手直しして最大5万3000席。UEFA カテゴリー4。シーズンチケットの順番待ち2万6000人。協議の回答の98％が賛成。委員会は11対1。
#   大きな工事は（2025/26 の）シーズンが終わってから。工事中も本拠地は使い続ける。完成の年はクラブの記事に無い（ウィキペディアの「2030年」は出典が開けず、言わない）。
# 入場：2025/26 はハンドブックの入場表（32904行）：19試合・平均36,695・97.5％・最多36,909（マンU戦、2026-01-04）。
#   2026/27 ホーム4試合（PL公式API）：8/30 35,974／9/14 36,693／9/20 36,462／10/18 36,983 → 合計146,112・平均36,528。10/18 は昨季のどのホーム戦より74人多い。
#   収容の大きい・小さいの話の基準はハンドブックの 37,633 にそろえる（BBC は拡張前を 37,645 と書く。言わない）。
# 言わなかったもの：ジプシーの呪いの言い伝え（人を傷つけかねない）／コンサート・ラグビー／2001年の移転の計画／オーナーの名前と買収額／女子チーム／ユーロ96。
# 写真：assets/images/20261026_stadium_leeds/（Commons、出典は credits.json）。人物は特定していない。
