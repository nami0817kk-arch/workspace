    highlight_row: 0
  say:
  - text: 最後に、ドイツでの数字を並べます。
    image: assets/images/20261111_takahara_naohiro_legend/01_c.jpg
    card: none
  - text: ハンブルクの4シーズンは、1試合あたり約0.13点。
    image: assets/images/20261111_takahara_naohiro_legend/01_w.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: フランクフルトの1年目は、約0.37点です。
    card: {<<: *viewcard, highlight_row: 1}
  - text: 同じリーグで、点の取り方は約2.7倍になりました。
    card: {<<: *viewcard, highlight_row: 1}
    mark:
      kind: circle
      row: 1
      col: 1試合あたり
    emph: true
  - text: チームのリーグ戦の46点のうち、およそ4分の1が高原直泰のゴールでした。
    card: none
  - text: 試合に出続けられるから、練習の強さを自分で決められた。
    image: assets/images/20261111_takahara_naohiro_legend/01_w.jpg
    card: none
  - text: そして試合の日に、いちばん良い状態をつくれた。
    card: none
  - text: その答えが、アーヘンでの3点でした。
    card: none
  - text: 日本人の2人目が出るまで9年、3人目の鈴木唯人までは20年かかっています。
    card: none
