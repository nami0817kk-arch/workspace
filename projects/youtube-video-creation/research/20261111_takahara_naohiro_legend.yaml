# 高原直泰（元日本代表 FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-11。型は 11/7 の中澤佑二・11/9 の槙野智章と同じ8節の変形。
# **情報の時点は 2026-11-06。**年齢は当時のものだけ（生年月日 1979-06-04 から計算）。いまの仕事（沖縄SVの代表・監督、コーヒー）は言わない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は DFB の記録（datencenter.dfb.de）・ゲキサカ／サッカーキングの引退の記事（2023-08-31）・
#   Number（2007-04-05、木崎伸也）・サッカーキング（2026-09-08）・英語版/日本語版 Wikipedia の成績表と大会の記事だけ。
# **病気（2002年W杯の前の病気）は入れない**（病気・私生活は入れない決まり）。2002年W杯は「出られなかった」とだけも言わない（理由を言わずに置くと聞く人が引っかかる）。私生活・CM も入れない。
#
# **題材を選んだ理由**：直近30日に未出の、欧州で戦った日本人FWの大物。ブンデスリーガ135試合25得点（DFB）。2006年12月に**ブンデスリーガで日本人初のハットトリック**。
#   今季（2026-27）の開幕節で鈴木唯人（フライブルク）がハットトリックを決め、「2006年の高原直泰（フランクフルト）、2015年の武藤嘉紀（マインツ）以来、3人目」と報じられた（サッカーキング 2026-09-08）＝いま見る理由。
#   日本代表57試合23得点、2006年W杯、2007年アジアカップ得点王。ヒットの条件（日本代表・W杯・本人の言葉）に当たる。
#   11/7 の担当は「11/6 のハンブルガーSV・10/24 のフランクフルトのクラブ紹介に名前と節が出ている」ので外したが、どちらもクラブが主役の回で、高原は1行ずつ（「2003年には、高原直泰が加わります」「2年で12得点」）。
#   11/11 なら HSV の回から5日あく。この回は**HSVとフランクフルトの差（なぜ点が増えたか）**に絞り、クラブの歴史は話さない。
#   候補から外したもの：名波浩（現役時代の写真が無い）、柳沢敦・楢崎正剛（写真が無い）、中山雅史（「引退」と言っていない）、細貝萌（写真が小さい）、本田圭佑・香川真司（現役）。
# **重なりの確認（2026-11-06）**：scripts/ を「高原」で grep → bd_hamburg（11/6）・bd_frankfurt（10/24）・bd_mainz（10/28）・okazaki_shinji_legend（10/27）に1行ずつ名前が出るだけ。題・サムネに高原の名前のある本は無い。
#   research/posted.json に takahara を含む本は無い。research/20261109_picks.txt の他の担当（11/11 はマレン・ディアスとガクポ・メスタージャ・アトレティコのユニフォーム）とも重ならない。
# **引退の確認**：沖縄SV が 2023-08-31 に「今季限りで選手を引退」と発表（ゲキサカ・サッカーキング 2023-08-31。クラブ公式の記事 okinawasv.com/news/detail/id/1325 は 503 で読めなかった）。英語版・日本語版 Wikipedia も同じ。→ **現役ではない**。
#
# **数字の出どころ**
# - 生年月日 1979-06-04・静岡県三島市（日本語版・英語版）。FW。
# - 1998年 ジュビロ磐田に入る（両版）。2001年8月 ボカ・ジュニアーズへ（期限付き）、アルゼンチン1部でプレーした初の日本人（英語版）。2002年 J1 で26得点、得点王と最優秀選手（英語版の表 27試合26得点・日本語版）。
# - ブンデスリーガ（DFB の記録）：HSV 2002/03 16-3、03/04 29-2、04/05 31-7、05/06 21-1 ＝97試合13得点。フランクフルト 06/07 30-11、07/08 8-1 ＝38試合12得点。合計135試合25得点。
# - ブンデスリーガ初出場 2003年1月 ハノーファー96戦、奥寺康彦・尾崎加寿夫に続く3人目の日本人（英語版、Japan Times 2003-01-27 を典拠）。初得点 2003-02-09 バイエルン戦（日本語版の略歴）。
# - ハットトリック：2006-12-03 第15節 アレマニア・アーヘン 2対3 フランクフルト（14分・44分・62分、3点とも高原。英語版 2006-07 Eintracht Frankfurt season の試合記録）。日本人初（英語版・日本語版・サッカーキング 2026-09-08）。
# - 2006-07 フランクフルト：リーグ11得点・公式戦17得点でチーム最多（英語版のシーズンの記事）。チームはリーグ14位で残留（同）。チームのリーグ得点は46（同）＝高原が約4分の1（自分で割った 11÷46＝0.24）。
# - 日本代表 57試合23得点（サッカーキング 2023-08-31、英語版）。2000年2月デビュー（両版）。2000年アジアカップ優勝で5得点（英語版 2000 AFC Asian Cup の得点者）。2006年W杯 3試合出場（英語版）。
#   2007年アジアカップ 4得点で得点王、日本人初（英語版・日本語版）。2008年5月が最後の招集（日本語版）。
# - 引退：2023年シーズン限り。発表は 2023-08-31、44歳（ゲキサカ・サッカーキング）。
# - 1試合あたりの得点（自分で割った）：HSV 13÷97＝約0.13、フランクフルト1年目 11÷30＝約0.37。約2.7倍。
# - 本人の言葉（原文のまま、短く切る）：
#   ①Number 2007-04-05「試合に出られる確証があるので、１週間の練習のなかで今日はガンガンやるとか、試合が近づいてきたら緩めるとか、コントロールできるようになった。」「だから、試合のときにトップに持っていける。」
#   ②同「ハンブルクのときは毎日１００％でやんなきゃいけなくて、逆に試合のときにコンディションが悪くなってましたから。その差は大きいですよ」
#   ③同「まあ、ベストゴールよりも、今シーズン何点取れるかが大事ですから。」
#   ④ゲキサカ 2023-08-31（クラブを通じたコメント）「ここまで多くの方々に支えられて選手を続けることができ、幸せな選手生活でした。」
#
# **入れなかったもの**：2002年W杯の前の病気、沖縄SVの経営・コーヒー、浦和で監督と合わなかった話、清水・東京V・相模原の細かい経歴、K リーグ、移籍金と年俸、
#   ボカがクラブの経済の事情で契約を切った話（日本語版だけ）、「スシボンバー」の愛称（出典の文脈を確かめられない）、2006年W杯の無得点の評価、ドイツ戦の2得点（日本語版だけ）。
# **写真**：assets/images/20261111_takahara_naohiro_legend/（Commons だけ。報道写真は Getty・AFLO ばかりだった：ゲキサカの主写真は ©Getty Images、Sportiva の主写真は photo by AFLO）
#   01 = 「Ito and Takahara, Omiya vs Shimizu 2012.jpg」（norio nakayama、CC BY-SA 2.0、5184x3456→1920、2012-06-30 清水エスパルス。右の笑っている人が高原、中央は伊藤翔）
#   01_w = 01 の元の写真から高原のまわりを16:9で切った1枚（CC BY-SA なので切ってよい）
#   02 = 「Takahara hannover.jpg」（2006年 HSV、800x600）は小さく、本編2.4倍・ショート3倍超に伸びるので**使わない**（2026-11-06 指示）。代わりに紋章の差し込み（日本・フランクフルト）と 01_c を使う
#   01_c = 01 の元の写真（5184x3456）から本人の上半身を1280x720で切った1枚
#   04 = 「Takahara Naohiro, Omiya vs Shimizu 2012 (cropped).jpg」（norio nakayama、CC BY-SA 2.0、941x1658、01 と同じ日）
#   ほかに当たったもの：イラン戦2005（MEHR の透かしが入るので使わない）、琉球新報（引退後の農業の会見で使わない）。
