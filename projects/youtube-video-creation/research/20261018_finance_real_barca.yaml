# クラブの財政：レアル・マドリード × バルセロナ（10/18 日、シリーズ「クラブの財政」、key: finance_real_barca、型は news）。
#
# 軸は「**収入の世界1位と2位。差はどれだけか。その差は何でできていて、1年でどう変わったか**」。
#   10/3 のバルサ回（使える上限・年間シート）・10/9 のレアル回（無冠でも史上最高の収入・改修と借入・「1.15季ぶん」）・10/17 のシティ×アーセナル回（差760万ユーロ）と
#   重ねない：スクワッド・コスト・ルール／ラ・リーガの使える上限／スタジアム改修の借入／「補強に苦しんだ」は1行も出さない。女子は扱わない。
#   アルファベットは読み上げに出さない（座席の長期の権利＝PSL、償却前の営業利益＝EBITDA）。
#
# **出どころ（原文を読んだもの）**
#   ○ **デロイト Football Money League 2026（2024/25、2026-01-22）一次ページ（deloitte.com）**
#       プレスリリース（real-madrid-tops-…）：1位レアル「close to €1.2bn」、2位バルサ「€975m」。バルサの項の文「For the first time since 2019/20, FC Barcelona (second)
#       returned to the Money League top three … €975m … 27% growth … (when they placed sixth) … primarily driven by the introduction of PSLs」。
#       レアルの項「6% decrease in matchday revenue, commercial revenue grew by 23%」。為替 €1＝£0.84 等はポンド側の注記（この回はユーロのまま）。
#       本体ページ（deloitte-football-money-league.html）の「1. Real Madrid」「2. FC Barcelona」の図（Infogram の埋め込み。ページに入っている図の中身を読んだ）：
#         レアル 2025年収入 €1,161m（2024: €1,045.5m、+11%、+€115.5m）／試合日 233・放送 335・商業 594（百万ユーロ。足すと1,162。丸め）／
#           2024年は 248・316・482（棒の札。足して1,046）／給料÷収入 2025=44%・2024=48%／給料 514／順位 2025=1・2024=1／CL 準々決勝。
#         バルサ 2025年収入 €974.8m（2024: €765.2m、+27%、+€209.6m）／試合日 210・放送 243・商業 522（足して975）／2024年は 103・236・426（足して765）／
#           給料÷収入 2025=54%・2024=65%／給料 529／順位 2025=2・2024=6／CL 準決勝。本文「Personal Seat Licence arrangements, generating one-off c.€70m」。
#       ★図の元データ表の「2024年の商業」はレアルだけ 330 と出る（棒の札・合計・「商業+23%」はどれも 482 と合う）。棒の札の 482 を使った（594÷482＝+23.2% でデロイトの本文と一致）。
#       ★デロイトの給料の定義はクラブの決算と違う。同じ定義で2クラブを並べる用に使う。
#   ○ **レアル：realmadrid.com 2026-07-28 の決算発表（スペイン語、原文）**：営業収入 1.221,3 百万ユーロ（選手の売却の結果を除く）、前の季 1.184,7。
#       EBITDA 287,4（+18%）、税引後の利益 26,3（+8%）、「ratio de gastos de personal sobre ingresos en el 46%, muy por debajo del umbral de excelencia del 50%」。
#       数字は 10/9 回の材料（research/raw/20261009_finance_realmadrid_material.md）で突き合わせ済み。
#   ○ **バルサ：fcbarcelona.com「Assembly approves record-breaking accounts…」（総会 2026-09-19、原文）**：「Ordinary revenue reached 1.06 billion euros, 66 million more than
#       in the previous financial year」、通常の利益 0.2 百万、最終 −18 百万（特別項目と税のあと）、EBITDA +140 百万、スポーツの費用は営業収入の53%（原文「sporting costs … 53% of operating revenue」）、
#       2026/27 の予算：収入 11億9500万。**この原文は収入の細目・人件費の額を出していない**（出しているのは上の数字だけ）。
#       ★同じ記事の予算の段落は「sporting wage bill falling from 54% to 53%」と書く（2026/27 の話）。2025/26 の53%と合わせると読み方が分かれるので、台本は「53%と発表」までにとどめる。
#       ★前の季の収入は「66百万多い」から逆算した約9億9400万（クラブの丸め）。デロイトの 9億7480万 とは別の集計。
#   ○ **ECB の参照相場（frankfurter 経由）2026-10-16：1ユーロ＝177.82円**（丸めて178円）。
#
# **決算期と通貨**：デロイトは 2024/25（クラブの決算期 6月末のもの）、両クラブの最新決算は 2025-26（どちらも6月30日締め）。通貨はどちらもユーロ。**季はデロイトより1つ新しい**ので、台本で言い分ける。
#   クラブの収入の呼び方：レアル＝選手の売却の結果を除く営業収入、バルサ＝「通常の収入」。数え方まで同じかは公表文からは確かめられない（台本で断る）。
#
# **自分で計算した数（コードで検算した）**
#   デロイト：差 1,161.0−974.8＝186.2（レアルの収入の16.0%、バルサの収入の19.1%、レアル÷バルサ＝1.19倍）。前の年 1,045.5−765.2＝280.3。縮み 280.3−186.2＝94.1。
#     増減：レアル +11.0%（+115.5）、バルサ +27.4%（+209.6）。円：186.2×177.82＝33,110 百万円 →「約331億円」。
#   内訳の差（レアル−バルサ、百万ユーロ、デロイトの図の整数）：2024/25＝試合日 +23・放送 +92・商業 +72（計187）／2023/24＝+145・+80・+56（計281）。
#     変化＝試合日 −122・放送 +12・商業 +16（計 −94）。281−122+12+16＝187 ✓。**縮みはすべて試合日**。放送が差の 92÷187＝49%、商業 38%、試合日 12%。
#     構成比：レアル 商業51%・放送29%・試合日20%／バルサ 商業54%・放送25%・試合日22%。
#     増減率：レアルの試合日 233÷248−1＝−6.0%（デロイト本文の6%減と一致）、商業 594÷482−1＝+23.2%（同23%と一致）。バルサの試合日 103→210＝2.04倍（+107）。
#     放送：レアル 316→335（+6%）、バルサ 236→243（+3%）。
#   「一回限り約70」を除いたバルサ（自分の足し引き。70がバルサの収入に入っているという前提）：差 186.2+70＝256.2 → 前の年の 280.3 からの縮みは約24。
#   給料÷収入（デロイト）：レアル 514÷1,161＝44.3%、バルサ 529÷974.8＝54.3%。差 10.0ポイント。前の年は 48%と65%（17ポイント差）→ 7ポイントに近づいた…は使わない（定義の揺れ）。
#   クラブの決算（2025-26）：収入 1,221.3−1,060＝161.3（レアル÷バルサ＝1.15倍）。前の季 1,184.7−994＝約190.7 → 縮み約29。EBITDA 287.4÷140＝2.05倍。
#     最終：レアル +26.3、バルサ −18。人件費÷収入：レアル46%（クラブの言う人件費）、バルサ53%（クラブの言うスポーツの費用）＝定義が違う。
#   バルサ 2026/27 の収入予算 1,195 と レアル 2025-26 の実績 1,221.3 の差 26.3（予算と実績で季が違う参考値。レアルの2026-27の予算は11月の総会で出る。10/9 回の整理）。
#
# **言い切っていないもの**：放送の差の理由（デロイトは書いていない。バルサのほうが欧州の大会で先へ進んだのに放送はレアルが92多い、という事実の並置まで）。
#   レアルの試合日が6%減った理由（デロイトは書いていない。言わない）。バルサの最終赤字の中身（総会の原文は「特別項目と税のあと」まで）。
#
# 写真：assets/images/20261018_finance_real_barca/（credits.json 同梱、Commons。人物の顔は無し）。01_w＝ベルナベウ内部（屋根つき、CC0 Badefa、2025）／02_w＝ベルナベウのピッチ（CC BY 4.0 MottaW、2024）／
#   03_w＝工事中のカンプ・ノウ外観（CC BY-SA 4.0 Pere López Brosa、2025）／04_w＝カンプ・ノウ外観（CC BY 4.0 Rukola2、2023）。_sq は中央を切った正方形。目で確認：すべてスタジアム。
