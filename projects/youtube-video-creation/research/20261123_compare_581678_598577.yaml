#   90分あたり（自分で割った値）：ベリンガム 0.89, 0.56, 0.43, 0.62／ヴィルツ 0.98, 0.82, 0.44, 0.59
# 市場価値（TM）：ベリンガム 最高 1億8000万€（2023-12・20歳）、2026-07-22 に 1億6000万€／ヴィルツ 最高 1億4000万€（2024-12・21歳）、2026-10-07 に 8500万€。
