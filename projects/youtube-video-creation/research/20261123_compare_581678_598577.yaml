#   番号：ベリンガム 581678・ヴィルツ 598577。profile・market-value-history・performance-season（2023〜2026季）を2.5秒あけて取得。
# **選んだ理由**：2人とも2003年生まれの23歳（ヴィルツ5月3日・ベリンガム6月29日）、TM の位置は2人とも攻撃的MF、市場価値は 1億6000万€ と 8500万€。今季の出場時間は 1312分と1076分（足切り450分は超え、1000分前後なので標本は小さいと台本で断る）。
