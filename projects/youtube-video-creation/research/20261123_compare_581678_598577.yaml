#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。2人の組は初めて（ベリンガムは 10/9 にムシアラ、ヴィルツは 10/23 にロジャーズと別の組）。軸（4季の90分あたり）はこれまでの比べるに無い。
#   同じ日（11/23）の picks（ユヴェントスのユニフォーム）とは人もクラブも重ならない。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：レアル・マドリード（ラ・リーガ。TM の現所属 clubId 418）・リバプール（プレミアリーグ。clubId 31、2025-07-01 から）。
# **使った数**（クラブのトップチームの公式戦だけ）
#   ベリンガム：23/24 42試合 3644分 23点13A／24/25 58試合 4793分 15点15A／25/26 40試合 2718分 8点5A／26/27 16試合 1312分 5点4A
