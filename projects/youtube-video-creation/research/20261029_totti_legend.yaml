# フランチェスコ・トッティ（元イタリア代表FW・MF）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-29。型は 10/28 のピルロと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Francesco Totti の成績表・本文、UEFA Euro 2000 knockout stage）と BBC（2017-05-28「Roma 3-2 Genoa」）と、自分で足した・割った値だけ。
# **私生活・法的な問題・怪我は入れない**（家族・賭けの会社の広告・2019年の退団会見の批判・2006年の骨折は使わない）。女子サッカーは入れない。
#
# **重なりの確認（10/28 夜）**：scripts/・research/covered.yaml・research/posted.json を「トッティ／Totti／totti」で grep。トッティが主役の回は無し（10/18 中田英寿の回に「トッティに代わって中田が入る」が出るだけ）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ）とも重ならない。
# **2005年イスタンブール・2012年CL決勝・2006年W杯決勝は山場にしない**（W杯優勝は基礎DATAで一言だけ）。山場は EURO2000 準決勝オランダ戦（アムステルダム、PK戦のスプーン）。
# **引退の確認（一次情報に近いもの）**：BBC 2017-05-28 本文「the final appearance of his 25-year Roma career ... scored 307 goals in 786 games for his only club, came on in the 54th minute in the win over Genoa」（requests で本文取得）。Wikipedia「On 17 July 2017, Totti confirmed his retirement from professional football」。→ **選手としては現役ではない（50歳）**。いまの立場：2017〜2019 ローマの役員（2019-06-17 に離任、Wikipedia）、2026年ミラノ・コルティナ冬季五輪のアンバサダー（Wikipedia）。
# **日本との接点**：1993年の U-17 世界選手権（日本開催）でイタリアの得点を決めた（Wikipedia「scored Italy's goal in the tournament」）。2000-01 に中田英寿とローマで同僚、2001-05-06 ユヴェントス対ローマで60分ごろトッティに代わって中田、79分に中田が決め、終盤にモンテッラで2対2（10/18 中田の回で確かめた事実）。ローマは 2001-06-17 パルマに3対1で優勝、トッティも1点（Wikipedia）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：ローマ 786試合307点（リーグ619/250・国内カップ59/18・欧州103/38・その他5/1。表の Career total）。BBC の「307 goals in 786 games」と一致。
# - イタリア代表 58試合9点（Wikipedia の年別表の Total）。クラブと代表の合計 844試合316点（自分で足した値）。
# - セリエA 250点は歴代2位、1つのクラブで挙げたセリエAの得点ではいちばん多い（Wikipedia）。セリエAに出た25シーズンはマルディーニと並ぶ（2016-09-11、Wikipedia）。
# - 1993-03-28 ブレシア戦で16歳デビュー、1998-10-31 に22歳で主将＝セリエAでいちばん若い主将（Wikipedia）。
# - 2006-07：セリエA 35試合26点、公式戦50試合32点、得点王、欧州ゴールデンシュー（Wikipedia の成績表と本文、BBC 2007-06-18 が出典）。
# - 2014-09-30 マンチェスター・シティ戦、38歳でCLの当時の最年長得点（のちに2023年ペペが更新。Wikipedia）。
# - EURO2000 準決勝 2000-06-29 アムステルダム：34分にザンブロッタ退場、0対0のまま延長、トッティは83分から出場、PK戦3対1、3人目のトッティが決める。オランダは4人中3人が失敗（Wikipedia の試合表）。直前に仲間のディ・ビアージョへ「Mo je faccio er cucchiaio」（ローマの方言で「今から、スプーンで決めてやる」）と言った（Wikipedia）。
# - 見立て（自分で割った値）：2006-07 は 26÷35＝1試合0.74点。セリエA通算は 250÷619＝0.40点。約1.8倍。30歳（1976-09-27 生まれ）の季。
# - 本人の言葉：引退試合のあとの手紙（BBC が引用）「I'm afraid. I can't see what the future looks like.」→「怖いんだ。この先がどう見えるのか、わからない」。
# - マル秘話：母がミランの好条件の誘いを断った／入る直前までラツィオのユースに売る話がまとまっていた／1997年にサンプドリアへの貸し出しを会長センシが止めた（Wikipedia）。
# **入れなかったもの**：2006年の骨折とその治療、2019年の退団会見での批判、家族、賭けの会社の広告、2006年W杯決勝の中身、EURO2000 決勝の結果。
# **読みで怪しいもの**：トッティ、ディ・ビアージョ、ザンブロッタ、スパレッティ、カペッロ、センシ、サンプドリア、アムステルダム、ゴールデンシュー。「最多」「最年長」は使わず言い換える。
