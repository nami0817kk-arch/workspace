      - 現地時間9日、サウジ・プロフェッショナルリーグの第6節、アブハー・クラブとの一戦です。
      - 先制点は22分。アンジェロ・ガブリエルが右コーナーキックを蹴ると、ロナウドが頭で合わせました。
      - 41歳の打点の高いヘディングでした。
      - アル・ナスルは58分に追加点を挙げ、75分に1点を返されたものの2対1で勝っています。
