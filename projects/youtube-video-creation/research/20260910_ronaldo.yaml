    tier: 報道
    telop: テベスの引退試合が12月19日
    narrator: 解説
    say:
      - ここからが本題です。数字とは別に、12月19日に予定されている一戦があります。
      - アルゼンチンの英雄カルロス・テベスの引退試合です。スペインメディア『アス』が6日に伝えました。
      - 会場は、古巣ボカ・ジュニアーズの本拠地ラ・ボンボネーラが選ばれているといいます。
      - 『ESPNアルゼンチン』によると、この試合の特別な招待選手として、2人の名前が挙がっています。
      - リオネル・メッシと、クリスティアーノ・ロナウドです。
      - テベスはアルゼンチン代表でメッシと、マンチェスター・ユナイテッドでロナウドと、それぞれ共演していました。
      - さらに『TyC スポーツ』によると、この引退試合には60人を超える名選手が集まる可能性があるとされています。
      - ただし、招待された選手が実際に参加するかどうかは、まだ決まっていません。それぞれが受けるかどうかに委ねられています。
    official: false
    sources:
