sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 株の100%を持つ見込み
    narrator: キャスター
    say:
      - リオネル・メッシが、スペイン2部のCDエルデンセを買収することになりました。
      - 筆頭株主になることで基本合意に達した、と報じられています。
      - 伝えているのはスポーツメディア『ESPN』と、バルセロナのスポーツ紙『エル・ムンド・デポルティボ』です。
      - メッシを筆頭とするアルゼンチン人の投資家グループが、クラブの株100パーセントを持つことになります。
      - このグループには、ほかにもサッカー界のレジェンドたちが参加しているといいます。
      - 資産査定と、スペイン国家スポーツ評議会の承認が済み次第、数日中に正式発表される見込みです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35649/
      - https://www.soccer-king.jp/news/world/esp/20260909/2202681.html

  - id: club
    heading: どんなクラブなのか
    tier: 報道
    telop: 1921年創設、1部の経験なし
    narrator: キャスター
    card:
      type: table
      title: CDエルデンセ
      columns: ["項目", "中身"]
      rows:
        - ["創設", "1921年"]
        - ["本拠地", "バレンシア州エルダ"]
        - ["1部の在籍", "一度もなし"]
        - ["主戦場", "3部と4部。今季2部に昇格したばかり"]
      note: 現オーナーはコロンビアの投資グループ『Grupo TH』
    say:
      - エルデンセは1921年に生まれた、歴史のあるクラブです。
      - 本拠地はバレンシア州のエルダ。バルセロナに近いアリカンテの街です。
      - ただし、1部に在籍した経験は一度もありません。
      - 主戦場は3部と4部で、今季2部に昇格したばかりです。
      - いまのオーナーは、コロンビアとスイスでもクラブを持つ投資グループです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35649/
      - https://news.yahoo.co.jp/articles/1290fee9b403b8f1e8b9b396bc89fe70ae6ac7e1

  - id: two
    heading: これで2つ目になる
    tier: 報道
    telop: 同じリーグには置けない
    narrator: 解説
    say:
      - メッシは今年4月、スペイン5部相当のコルネジャを買収しています。カタルーニャ州のクラブです。
      - エルデンセが加われば、スペインで持つクラブは2つになります。
      - いまは3つのディビジョンの差があるので、当面は問題が起きにくいと見られています。
      - 問題はこの先です。
      - メッシが両方の筆頭株主になった場合、スペインサッカー連盟が同じディビジョンで戦わせることを許す可能性は低い、とされています。
      - つまり、コルネジャをどこまで上げられるかに、上限がつくことになります。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35649/
      - https://www.soccer-king.jp/news/world/esp/20260909/2202681.html

