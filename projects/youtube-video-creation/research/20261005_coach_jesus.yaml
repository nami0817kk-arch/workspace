      highlight_row: 0
  - text: リスボンの名門2つでは、68.5%に上がります。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 1
  - text: 初めての海外、サウジとブラジルでは74.7%。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: ベンフィカ再任からトルコまでの3年は65.4%、タイトルは1つでした。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 3
  - text: そしてサウジの3年は81.1%。クラブでいちばん勝ったのは、ここ3年です。
    emph: true
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 4
  - text: 代表はまだ4試合で、4つとも勝利。4日の試合は、先制されてからの逆転でした。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 5
  - text: 勝ち越し点のゴンサロ・ラモスは直前、監督に「エリアに入れ」と言われたそう。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 5
  - text: 4連勝の歩みを、監督自身はこう振り返ります。
    image: assets/images/20261005_coach_jesus/01_w.jpg
    card: none
  - text: ここまでの歩みは、
    voice: ジェズス監督
    card: none
  - text: もしかすると、自分でも想像していなかったものだ。
    voice: ジェズス監督
    cont: true
    card: none
  - text: このチームのことは、強く信じていたけれど。
    voice: ジェズス監督
    cont: true
    card: none
  - text: 次の試合は11月14日、日本時間では15日の朝4時45分です。
    image: assets/images/20261005_coach_jesus/01_v.jpg
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 5
  - text: 相手はデンマーク。場所は、かつて率いたブラガの本拠地です。
    card:
      type: table
      title: 時期ごとの勝率（Transfermarkt の数を束ねて計算）
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: サウジで81%まで上げた勝ち方を、代表でも続けられるか。そこが次の答えです。
    card:
