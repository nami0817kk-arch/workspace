# 監督の経歴：ジョルジェ・ジェズス（10/5）。2026年7月10日にポルトガル代表監督に就任（前任マルティネス、契約は2030年まで）。ここまで4戦4勝。
# 監督の数字は Transfermarkt（trainer/2145 の詳細表示、ノルウェー戦まで入った版）。時期で束ねた勝率は自分で足して計算した（raw の3節）。
#   フラメンゴは英語版Wikipedia（57試合43勝）と数え方が違うので、表の題に「Transfermarkt の数を束ねて計算」と断る。1990年代のクラブは数が欠けるので使わない。
#   タイトル24は連盟（FPF）公式 news/57201 の就任発表の内訳を自分で足した（リオ州選手権は連盟の一覧に無い）。Transfermarkt・Wikipedia の Honours と内訳が一致。
# 歩みの事実は英語版Wikipedia（経歴の本文）、BBC（リベルタドーレス決勝）、ギネス（34連勝）、サウジ・プロリーグ公式（無敗・最後の15分の得点）、Al Jazeera（アル・ナスルの優勝・ガンバ大阪に敗れた決勝）。
# ノルウェー戦（10/4、日本時間10/5 3:45）は UEFA 公式の試合データ（2047924、2-1）と順位（グループA4 首位12点）で確かめた。得点の分は ESPN。次の試合は UEFA の 2047892（11/14 19:45 UTC、ブラガ）。
#   同じ日の「数字で見る注目試合」（match_portugal_norway、雛形）と重ならないよう、試合の細部は3行に留めた。
# 10/2〜10/4 にロナウドの合宿離脱を3本出しているので、離脱は1行だけ。10/3 の監督の言葉（試合のあとに時間がたっぷりある）は使わない。
#   ロナウドの話の監督の言葉は 10/4 試合後の新しいもの（RTP、O Jogo の書き起こし）。見立ての言葉はロナウド以外（同じ談話の「ここまでの歩み」）。
# 監督の言葉はすべて原文（ポルトガル語）から訳した: 年齢（FPF 57201）、引き分け（Sport TV、A Bola）、3点目・前の列（FPF 58015）、行き違い・歩み（RTP、O Jogo）。
