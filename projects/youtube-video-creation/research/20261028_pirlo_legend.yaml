# アンドレア・ピルロ（元イタリア代表MF）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-28。型は 10/27 のドログバと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Andrea Pirlo の成績表・本文、2006 FIFA World Cup knockout stage、2013 FIFA Confederations Cup Group A）と BBC（2017-11-07「Andrea Pirlo: The football genius who defied the number crunchers」）と、自分で足した値だけ。
# **私生活・法的な問題は入れない**（家族の会社・ワイン・賭けの会社との契約の話は使わない）。女子サッカーは入れない。
#
# **重なりの確認（10/28）**：scripts/・research/covered.yaml・research/posted.json を「ピルロ／Pirlo」で grep。ピルロが主役の回は無し（10/22 アンチェロッティ監督の回に名前と2007年CL決勝のFKが出た、10/27 の選手紹介に比べの相手として名前が1回、10/24 マルディーニの出典URLに1本）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ）とも重ならない。
# **2005年イスタンブール・2012年CL決勝は山場にしない**。2007年CL決勝もアンチェロッティの回で使ったので触れない。山場は 2006年W杯準決勝ドイツ戦（ドルトムント）。
# **引退の確認（一次情報に近いもの）**：Wikipedia「2017: Retirement」＝2017-10-08 に季末での引退を表明、2017-11-05 MLSプレーオフのコロンバス・クルー戦（2対0）に90分から出たのが最後、翌日に本人の Twitter で正式に。BBC 2017-11-07 本文「the 38-year-old ambled off the bench as a 90th-minute replacement against Columbus Crew to play the 872nd and final game of his career」で確認（requests で本文取得）。→ **選手としては現役ではない（47歳）**。
# **いまの立場**：監督。2020年にユベントスの監督、2022-23 ファティ・カラギュムリュク、2023-24 サンプドリア（2部）、2025-26 UAE のドバイ・ユナイテッド、2026-05-15 にクラブ初の1部昇格（Wikipedia。**確度は報道**）。
# **日本との接点**：2013-06-19 ブラジルのレシフェ、コンフェデ杯A組 イタリア4対3日本。本田21分PK・香川33分で日本が2対0→ピルロのCKからデ・ロッシ41分→内田のオウンゴール50分・バロテッリ52分PK→岡崎69分で3対3→ジョヴィンコ86分。ピルロは先発でフル出場（メンバー表に交代の印なし）。試合の最優秀選手は香川（FIFA）。イタリアはこの勝ちで初めて準決勝へ（Wikipedia）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：ブレシア49/6＋ブレシア（貸出）10/0＋インテル40/0＋レッジーナ30/6＋ミラン401/41＋ユベントス164/19＋NYCFC62/1＝クラブ756/73（表の Career total と一致）。ほかのクラブ＝49+10+40+30+62＝191試合、6+0+0+6+1＝13点（自分で足した値）。
# - イタリア代表 116試合13点（Wikipedia。年別を足して13点を確認）。クラブと代表の合計 872試合86点（自分で足した値）＝BBC の「872th and final game」と一致。
# - ユベントス：164試合19点、うち15点がフリーキック。4季でセリエA 4回（Wikipedia）。2011年に移籍金なしで加入（Wikipedia「signed him on a free transfer」）。1979-05-19 生まれなので加入時32歳。
# - ミラン：2001〜2011の10季でセリエA優勝2回（2003-04・2010-11）、CL2回（Wikipedia の冒頭）。
# - セリエAのフリーキックの得点は、ミハイロヴィッチと並んでいちばん多い（Wikipedia）。
# - 2006年W杯：全試合に出て668分、パス580本中475本成功、試合の最優秀選手3回（大会で一番多い）、ブロンズボール（Wikipedia）。準決勝 2006-07-04 ドルトムント（ヴェストファーレンシュタディオン）ドイツ0対2イタリア、グロッソ119分・デル・ピエーロ120+1分、グロッソの点をピルロがアシスト。決勝 7/9 ベルリン、ピルロのCKからマテラッツィの同点、PK戦の1人目を決めた。
# - 見立て（自分で割った値）：ミラン 10季で優勝2回＝5季に1回、ユベントス 4季で4回＝毎季。ユベントスの19点のうち15点がフリーキック＝約8割。
# - 本人の言葉：自伝『考えるから、プレーする（Penso quindi gioco）』の一節（Wikipedia に引用）「2006年7月9日、日曜日の午後、ベルリンで寝て、プレイステーションをしていた。夜、外に出て、ワールドカップに勝った」。プレイステーションは「車輪の次に、いちばんの発明」（BBC 2017-11-07 が自伝から引用）。
# - マル秘話：ブレシアでバッジョの練習を見てフリーキックを磨いた／ジュニーニョの無回転を手本にした蹴り方はイタリアで「マレデッタ（呪われた球）」と呼ばれた／2009年にチェルシーが獲りに来たが、ミランが断った（Wikipedia）。
# **入れなかったもの**：家族の会社・ワイン・資産、賭けの会社との契約、監督の解任の経緯、2005年・2007年のCL決勝、BBC が引いた自伝の下品な言い回し。
# **読みで怪しいもの**：ドルトムント、ヴェストファーレン（言わない）、デル・ピエーロ、ジョヴィンコ、ミハイロヴィッチ、レシフェ、プレイステーション、「最多」は使わず「いちばん多い」。
