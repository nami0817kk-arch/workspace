sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 街のライバル2つが、ひとつになった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["イースト・エンド", "1881年（Stanley F.C.として）"]
        - ["ウェスト・エンド", "1882年"]
        - ["合併", "1892年12月9日"]
        - ["愛称", "The Magpies（マグパイズ）"]
    say:
      - このクラブは、**合併**でできています。
      - 街には2つのクラブがありました。イースト・エンドと、ウェスト・エンドです。
      - イースト・エンドは1881年に「スタンリー」として生まれ、翌年に改名しています。
      - ウェスト・エンドは1882年。**同じ街のライバル同士**でした。
      - 1892年12月9日、この2つがひとつになり、いまの名前になりました。
      - 愛称は「マグパイズ」。**カササギ**です。白と黒の縞のユニフォームから来ています。
      - サポーターは「トゥーン・アーミー」とも、「ジョーディーズ」とも呼ばれます。
      - 本拠地はセント・ジェームズ・パーク。収容は5万2729人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
  - id: drought
    heading: 56年待った
    main: true
    tier: 背景
    telop: 2025年のリーグカップ。決勝でリヴァプールに2-1
    narrator: 解説
    card:
      type: table
      title: タイトルの記録
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "4回（うち3回は1904-1910年、最後は1927年）"]
        - ["1955年", "FAカップ。国内のタイトルはここまで"]
        - ["1969年", "フェアーズカップ優勝（合計6-2）"]
        - ["2021年10月7日", "持ち主が交代（それまでは14年）"]
        - ["2025年", "リーグカップ優勝。56年ぶりのタイトル"]
    say:
      # 2026-09-22 流れの点検。時系列を 待った → 変わった → 獲った の一方向にした。
      # 「1955年以来」と「56年ぶり」は物差しが違って耳では矛盾に聞こえるので、
      # 1955年はFAカップ、56年は1969年から、と分けて言う。「4回」は基礎DATAで読んでいる。
      # 公的投資基金 → 公共投資基金（基礎DATAと表記を揃える）
      # 2026-09-22 この節に実写を1枚（Commons、2025年リーグカップ優勝パレード）
      - text: リーグ優勝は、3回が**1904年から1910年**、最後が1927年です。
        image: assets/images/pl_newcastle_story/scene.jpg
      - FAカップは1955年が最後。国内のタイトルは、そこで止まりました。
      - ヨーロッパでは1969年のフェアーズカップ。のちのヨーロッパリーグにつながる大会です。
      - 決勝はハンガリーのウイペシュトに、2試合合計6対2で勝ちました。
      - ところが、そこから先が長かった。
      - 変わり目は2021年10月。いまのオーナーが買い取り、14年ぶりにオーナーが代わりました。
      # 2026-09-22 2回目。基金の名前は基礎DATAで読んでいるので「いまのオーナー」で受ける。
      # アシュリーの名前はここにしか出ず、前後の話に使われないので「14年ぶりの交代」に溶かした
      - いまのオーナーが、クラブを買い取った日です。オーナーが代わるのは14年ぶりでした。
      - そして2025年、リーグカップの決勝でリヴァプールを2対1で下します。
      - 1969年から数えて、**56年ぶり**のタイトルでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Newcastle_United_F.C.
      - https://en.wikipedia.org/wiki/Inter-Cities_Fairs_Cup
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: サンダーランドとの、タイン・ウィア・ダービー
    narrator: 解説
    card:
      type: table
      title: タイン・ウィア・ダービー
      columns: ["", ""]
      rows:
        - ["初対戦", "1888年11月10日／FAカップ予選・0-2"]
        - ["1908年12月5日", "1-9。ダービー史上の最大差"]
        - ["2013〜2015年", "サンダーランドが6連勝"]
        - ["対立の根", "イングランド内戦（王党派と議会派）"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "相手は**サンダーランド**。呼び名は**タイン・ウィア・ダービー**です。"
      - ふたつの街の対立は、イングランド内戦までさかのぼります。サンダーランドが議会派、ニューカッスルは王党派でした。
      - "競技会で最初に当たったのは1888年11月10日、FAカップの予選です。**イースト・エンド**の時代で、2対0で敗れました。"
      - "そして1908年12月5日、**1対9**。これがこのダービーで最も点差のついた試合です。"
      - 2013年から2015年にかけては、相手に**6連勝**を許しています。
      - "サンダーランドは、**今季もプレミアリーグにいます。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tyne%E2%80%93Wear_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: シアラー、ミルバーン、モンカー
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["アラン・シアラー", "公式戦206得点（クラブ最多）"]
        - ["ジャッキー・ミルバーン", "リーグ353試合177得点／公式戦200得点"]
        - ["ボビー・モンカー", "296試合3得点"]
    say:
      - 名前を挙げるなら、この3人です。
      - アラン・シアラー。1996年から2006年。プレミアリーグ303試合で148得点、すべての大会では**206得点**です。
      - 2006年2月4日、ミルバーンが49年持っていた200得点を抜き、クラブ史上最多になりました。
      - そのジャッキー・ミルバーンは1943年から1957年。リーグ353試合で177得点です。
      - "1950年代にFAカップを**3度**運んでいます。1951年、1952年、1955年でした。"
      - 1987年には、西スタンドが「ミルバーン・スタンド」と名付けられました。選手の名を冠したスタンドは、ここだけです。
      - ボビー・モンカー。1962年から1974年、296試合。
      - "フェアーズカップを獲った1969年の決勝では主将を務め、2試合で**3得点**しています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Alan_Shearer
      - https://en.wikipedia.org/wiki/Jackie_Milburn
      - https://en.wikipedia.org/wiki/Bobby_Moncur
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 56年ぶりの1点を決めたのが、主将のダン・バーン
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "マティアス・ヤイスレ"]
        - ["主将", "ダン・バーン（CB・イングランド／2m01）"]
        - ["出身", "地元ノーサンバランド州"]
        - ["エース", "ハーヴィー・バーンズ（FW・イングランド）"]
        - ["今季", "3点でチーム最多"]
    say:
      - "**さきほどの56年ぶりのタイトルを決めた1点は、主将のもの**でした。"
      - ダン・バーン。身長2メートル1センチのセンターバックです。
      - 生まれは**地元ノーサンバランド州**。この街の人間が腕章を巻いています。
      - エースはハーヴィー・バーンズ。イングランド人のフォワードで、今季3点です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝の直近は1926-27。今季でちょうど100年目
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "4回（直近 1926-27）"]
        - ["FAカップ", "6回（直近 1954-55）"]
        - ["リーグカップ", "1回（2024-25）"]
        - ["ヨーロッパ", "フェアーズカップ1回／インタートト1回"]
    say:
      - "1部優勝は**4回**。**ただし直近は1926年から27年**です。"
      - "そして今季は、**最後にリーグを獲った年からちょうど100年目**にあたります。"
      - FAカップは6回。こちらも1955年が最後でした。
      - その空白を終わらせたのが、2025年のリーグカップです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
