  question: どんなクラブなのか
  # 2026-09-22 流れの点検。直前の一言が「FAカップを6回」なので、「獲るまでに56年」が
  # FAカップの話に聞こえていた。何が無かったのかを言う
  hook: 大きなタイトルが、56年間ゼロだったクラブです。

