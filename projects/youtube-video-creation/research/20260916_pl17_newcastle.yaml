# プレミアリーグ20クラブ紹介 ⑰ニューカッスル・ユナイテッド（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「街のライバル同士が合併してできた」**。
#
# 山場（@main）は**「56年待ったタイトル」**。2025年のリーグカップ
#
# **買収の是非には触れない。**日付と主体だけ置く（⑮マンCと同じ扱い）
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では17番目」の1行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替え（説明は後ろへ）。
# ③優勝の節は「数えると13個」をやめ、1部優勝から100年という空白から入る形にした
#
# 2026-09-18 追記。①タイトルとサムネを、20本で同じ文面からクラブごとの引きに変えた。
# ②宿敵の節（タイン・ウィア・ダービー）と「このクラブを語る選手」の節を足した。
# ③theme.hook を1行入れた
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 4節18行 → 2節11行にした。**落としたのは「落ちない」の節まるごと**
# （1893年の加盟以来2部より下へ行っていない話）と、1900年代の戦い方が
# 「芸術的」と評された1行、今季に日本人選手がいない1行。
# **「2021年に変わったこと」は節として落とし、1行に縮めて山場の節へまとめた**
format: news
