# フェルナンド・トーレス（元スペイン代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-06。型は 11/2 デル・ピエロと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役を終えたあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Fernando Torres の成績表・本文、UEFA Euro 2008 final、2012 FIFA Club World Cup）と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（結婚・家族・入れ墨・自伝は使わない）。女子サッカー・Jリーグの記録をサムネの主役にしない（鳥栖は「現役の最後のクラブ」として扱う）。
#
# **重なりの確認（2026-11-04）**：scripts/・research/covered.yaml・research/posted.json を「フェルナンド・トーレス／Fernando Torres」で grep。主役の回は無し（9/26 ラ・リーガ④アトレティコのクラブ紹介に「11歳からこのクラブで育ったFW」として1行。直近30日ではない）。covered.yaml の「トーレス」はフェラン・トーレス（別人）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ）と重ならない。research/20261105_picks.txt（ユニフォーム＝フラム、スタジアム＝バルセロナ）とも重ならない。
# **引退の確認（一次情報）**：サガン鳥栖公式「フェルナンド・トーレス選手 現役引退のお知らせ」（2019-06-21、https://www.sagan-tosu.net/news/p/3967/ を requests で取得）に「2019年8月23日(金)開催の【明治安田生命Ｊ１リーグ第24節】サガン鳥栖vsヴィッセル神戸…をもちまして現役を引退」。→ **選手としては現役ではない（42歳）**。いまの立場：アトレティコ・マドリードB（アトレティコ・マドリレーニョ）の監督（英語版 Wikipedia の本人の記事と Atlético Madrileño の記事。2021-07 にU19、2024-06-11 にB）。**クラブ公式（atleticodemadrid.com）は 403 で読めず、確度は報道止まり**。台本は「11月4日時点」と断る。
# **日本との接点**：①7歳でFWを始めたとき『キャプテン翼』の登場人物を手本にした（英語版 Wikipedia 本文）。②2012-12-13 横浜国際総合競技場、クラブW杯準決勝 モンテレイ1-3チェルシー、46分に得点（2012 FIFA Club World Cup の試合表）。決勝は 12-16 同競技場でコリンチャンスに0-1。③2018-07-10 サガン鳥栖に加入（鳥栖公式）。2018-08-22 天皇杯4回戦 神戸戦で来日初得点、08-26 J1 G大阪戦 3-0 で1点2アシスト（英語版 Wikipedia）。2018年は公式戦19試合4点、J1第33節 横浜FM戦 2-1 で決勝点（ゲキサカ 2019-06-23）。④引退会見 2019-06-23（都内）。最後の試合は 2019-08-23 J1第24節 神戸戦、イニエスタ・ビジャと対戦、1-6（英語版 Wikipedia、鳥栖公式）。
# **数字の出どころと自分で足した値**
# - 成績表（英語版 Wikipedia、公式戦）：アトレティコ 1期目 244試合91点＋2期目（ローン含む）160試合38点＝404試合129点（自分で足した値）、リヴァプール 142試合81点、チェルシー 172試合45点、ミラン 10試合1点、鳥栖 40試合7点（ミラン＋鳥栖＝50試合8点）。Career total 768試合263点（合計と一致）。
# - スペイン代表 110試合38点（Wikipedia）。クラブと代表の合計 878試合301点（自分で足した値：768+110、263+38）。**年代別代表は含めない**と台本で断る。
# - 見立て（自分で割った値）：リヴァプール 81÷142＝0.570→0.57、クラブ通算 263÷768＝0.342→0.34、チェルシー 45÷172＝0.262→0.26。0.57÷0.34＝1.68→約1.7倍。リヴァプール1年目 2007-08 公式戦46試合33点、リーグ33試合24点（イングランド1年目の外国人で歴代いちばん多い。ファン・ニステルローイの23点を上回る）。
# - 1部の初めの2季：2002-03 リーグ29試合13点、2003-04 35試合19点（得点ランキング3位タイ）、19歳で主将（Wikipedia）。デビュー 2001-05-27 レガネス戦（2部）。
# - 移籍：2007 リヴァプールへ、クラブ史上最高額の移籍金（金額は報道で割れるので言わない）。2011-01-31 チェルシーへ、報道で5000万ポンド＝当時のイギリスの最高額（Wikipedia）。
# - タイトル：EURO2008・2010W杯・EURO2012。EURO2008・2012 とも決勝で得点。EURO2012 得点王（3点1アシスト）。チェルシーで CL（2012）・EL（2013、決勝で先制点）・FAカップ（2012）、アトレティコで EL（2018）。2012-13 は7つの大会で得点した初の選手（Wikipedia）。
# - 2010-04-18 膝の手術（Wikipedia）。「後年はけがで速さを失った」（Wikipedia の Style of play）は**言い方に気をつけて**「けがと向き合いながら」とだけ言う。
# **山場**：EURO2008決勝（2008-06-29 ウィーン、エルンスト・ハッペル、観客51,428人、ドイツ0-1スペイン、21分にヘディングがポスト、33分にシャビのスルーパスからラームを振り切りレーマンの上を越して左隅へ。最優秀選手。スペインは1964年以来44年ぶりの欧州王者。英語版 "UEFA Euro 2008 final"）。本人の言葉は同記事の引用（英語）を訳した。
# **本人の言葉**：①EURO2008決勝後「It's just a dream come true. This is my first title and I hope it's the first of many.」（英語版 Wikipedia。原文のスペイン語は未確認）。②引退会見「古くからの友人であるイニエスタ選手との直接対決を日本でできること」（ゲキサカ 2019-06-23、鳥栖が神戸戦を最後の試合にした理由）。
# **入れなかったもの**：結婚・家族・入れ墨・自伝・歌のビデオ、2008年ユーロでの監督との握手の件、退場、移籍金の金額（リヴァプール分）、「スペイン代表歴代3位の得点」（いまの順位を確かめていない）、若林くんの話（出典の supportista 2009 が読めない）。
# **読みで怪しいもの**：トーレス、フエンラブラダ、アトレティコ、リヴァプール、レガネス、シャビ、ラーム、レーマン、ウィーン、エル・ニーニョ、イニエスタ、ビジャ、モンテレイ、コリンチャンス、鳥栖（とす）、駅前不動産スタジアム、天皇杯。「最多」は使わず「いちばん多い」。「2007-08」は書かない。
