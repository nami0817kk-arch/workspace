title: 10月19日（月）シリーズの題材候補
lead: 8枠＋レジェンド2本＝候補30件。各枠の1番目が名前の大きさ順のおすすめです（○は枠ごとに1つ）。月曜の週報は不要（ユーザー決定 10/18）なので、通常の8枠で組みます。
note: '**並べ方の物差し**：選手は Transfermarkt の市場価値（player_pool）、クラブは世界の収入順位・本拠地の大きさ・CL常連か。軸は『2者の比べ』『順位』『答えを伏せた数字』。1枠3件、各枠の1番目が名前の大きさ順のおすすめ。


  **足切り（比べる）**：今季リーグ戦の出場時間を Transfermarkt の API（tools/japan_abroad.py と同じ tmapi-alpha の performance-game、1人1回、間隔8秒）で**今夜読み直した**（2026-10-18 21時台）。450分以上：ヤマル9試合**741分**8得点6アシスト（90分あたり得点0.97・アシスト0.73）／サカ6試合**509分**3得点0アシスト（0.53・0.00）／ハーランド7試合**620分**8得点0アシスト（1.16・0.00）／イサク6試合**494分**5得点0アシスト（0.91・0.00）／ヴィニシウス8試合**585分**1得点3アシスト（0.15・0.46）／ラフィーニャ8試合**575分**12得点3アシスト（1.88・0.47）。6人とも通過。90分あたりは私の割り算。10/18 朝の値から動いたのはヤマル（671→741分）とラフィーニャ（555→575分）。ほかの10/18 朝の足切りの結果（ヴィルツ560・パーマー621・ライス504・ベリンガム619・エムバペ720・ペドリ530・ロジャーズ613・アンダーソン518は通過、オリーズ393・ケイン386・アルバレス173・クヴァラツヘリア314・ムシアラ148・デンベレ211・ドゥエ319・カイセド176は未達）は**今夜は読み直していない**。


  **同じ日にそろえる時の注意**：


  - スタジアムのクラブとユニフォームのクラブを同じにしない。おすすめの組み：スタジアム1番（トッテナム）＋ユニフォーム2番（ニューカッスル）、またはスタジアム2番（シティ）＋ユニフォーム1番（トッテナム）。**シティは 10/18 にユニフォーム、トッテナムは 10/16 財政・10/18 移籍で続いているので、どちらも続き物になる**（だから両方 weak）。ニューカッスルのスタジアムを選ぶ日はユニフォーム2番を選ばない。


  - 移籍でレアルを選ぶ日は、記録の1番（レアルのCL15回）を選ばない（レアルが2枠になる）。移籍でアーセナルを選ぶ日は 10/17 の財政・ユニフォームの続きになる。


  - 選手紹介でロジャーズを選ぶ日は、移籍・財政のチェルシー系を重ねない（10/15 ユニフォーム・10/16 スタジアム・10/17 移籍・10/18 財政で5日続いている）。


  - 比べるでヤマル×サカを選ぶ日は、記録・選手紹介にヤマル・サカを入れない（ヤマルは 10/18 にバルサ対ベティスのニュースもある）。


  - レジェンド（世界）のイニエスタは 10/18 のシャビ（バルサ中盤）の翌日。『同じ日に出さない』の決まりは守れているが連続なので、気になるなら2番のベッカムに替える。


  **直近30日の重なり**：research/posted.json の公開済み・予約済み（10/18 の11本まで）を題で引いた。10/18 に採られなかった候補（比べる3件・選手紹介のムシアラ・スタジアムのエティハド・トッテナム・ユニフォームのトッテナム・ニューカッスル・レジェンドのイニエスタ・ベッカム・長谷部・中村）は再提案した。10/18 の本編11本には比べるが無い（比べるは直近で 10/17 のペドリ×ヴィティーニャが最後）。


  **女子・Jリーグ・欧州7リーグ以外は入れていない**。FotMob・FBref・Sofascore・FootyStats・WhoScored・Understat は使っていない（Transfermarkt の公開 API と、Wikipedia・デロイトの公開ページだけ）。地の文は解説1人、数字は基本の数と自分で割った90分あたり。'
