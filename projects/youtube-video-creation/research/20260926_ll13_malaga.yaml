  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 回して崩す。下部組織。満員のスタンド
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - ボールを回して崩す
    - - 運営の型
      - 28人中13人が下部組織
    - - クラブの気質
      - 昇格の決勝に3万83人
  say:
  - フネス監督のチームは、ボールを回して崩す。敵地のセルタ戦でも、支配率は7割近く。
  - 運営の型は、下部組織。登録**28人**のうち**13人**が、ここで育ちました。
  - スタンドは熱い。昇格を決めたプレーオフの決勝では、ホームに**3万83人**。
  sources:
  - https://en.wikipedia.org/wiki/Málaga_CF
  - https://www.marca.com/futbol/malaga/2026/09/14/charla-viral-funes-pausa-hidratacion-suicidarnos-eh.html
  - https://www.marca.com/futbol/malaga/2026/09/13/funes-esperar-solucione-cosas.html
  - https://es.wikipedia.org/wiki/M%C3%A1laga_Club_de_F%C3%BAtbol
  - https://en.wikipedia.org/wiki/2026_Segunda_Divisi%C3%B3n_play-offs
  bg: assets/backgrounds/stadium_マラガ_in.png
  official: false
