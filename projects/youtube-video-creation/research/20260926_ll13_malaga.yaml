  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 8年ぶりの1部と、初勝利を待つ監督
  narrator: キャスター
  say:
  - text: マラガは今シーズン、**8年**ぶりに1部へ戻ってきました。
    image: assets/stats/ll_malaga_data_r1.png
    no_telop: true
  - text: 率いるフネス監督は、まだ1勝目を待っています。こう話しています。
    image: assets/stats/ll_malaga_data_r2.png
    no_telop: true
  - voice: フアン・フランシスコ・フネス
    text: 勝利は必ず来る。最初の1勝が来れば、あとは続いてくる
    image: assets/stats/ll_malaga_data_r2.png
  - text: '**2013年**には、チャンピオンズリーグで**8強**まで進みました。'
    image: assets/stats/ll_malaga_data_r3.png
    no_telop: true
  - text: そこから3部へ転げ落ちた理由は、お金。持ち主が、新たなお金を出さなくなったのです。
    image: assets/stats/ll_malaga_data_r3.png
    no_telop: true
  - image: assets/stats/ll_malaga_data0.png
    text: 創立は**1948年**。前身のクラブの、控えのチームとして生まれました。
    no_telop: true
  - image: assets/stats/ll_malaga_data1.png
    text: 愛称は「ボケロネス」。小さな魚、カタクチイワシのことです。
    no_telop: true
  - image: assets/stats/ll_malaga_data2.png
    text: ホームタウンはマラガ。アンダルシアで**2番目**に大きな、地中海の町です。
    no_telop: true
  - image: assets/backgrounds/stadium_マラガ.png
    text: 本拠地はラ・ロサレダ。1982年のワールドカップの会場で、収容は**3万778人**。
  - image: assets/stats/ll_malaga_data4.png
    text: オーナーはカタールの王族、アブドゥラー・アル・サーニ。ただ今は、経営から外されています。
    no_telop: true
  - image: assets/stats/ll_malaga_cups.png
    text: 1部、国王杯、スーペルコパの優勝はありません。ヨーロッパの大会で**1回**。
    no_telop: true
  - image: assets/stats/ll_malaga_data6.png
    text: 最多出場は、中盤のミゲリ。前身のクラブの時代を含めて**405試合**です。
    no_telop: true
  - image: assets/stats/ll_malaga_data7.png
    text: 直近のタイトルは**2002年**のインタートトカップ。決勝でビジャレアルを破りました。
    no_telop: true
  - image: assets/stats/ll_malaga_data8.png
    text: 昨シーズンは2部で**4位**、勝ち点**73**。プレーオフを勝ち抜いての昇格です。
    no_telop: true
