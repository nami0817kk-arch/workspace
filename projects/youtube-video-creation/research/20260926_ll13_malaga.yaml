# ラ・リーガ20クラブ紹介 ⑬マラガ（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/malaga*.json と旧台本 -
# 2026-10-14 に出すために直した（⑫レバンテ 2026-10-12 の直し方に合わせた）。直す前の版は research/dropped_1014/ に残してある:
# 2026-10-14 夜の直し（第三者の点検）: 会見の言葉は7試合終了時点（9/20）と明記／17位の勝ち点42は同点3クラブで直接対決の差で18位が降格と補足／3部へ落ちた2023年に管財人の運営を足す（2020年から裁判所選任の管財人José María Muñoz。Diario Sur 2020-02-20・英語版）／主将は昇格した2シーズン（クラブ公式の選手ページ：23/24・25/26）に弱めた／インタートトカップの説明を1句足した
#   ・plbuild を回し直し（CLUB_LEAGUE=laliga）、そのうえで手で直した。plbuild の出力との違いは「本拠地の行を板でなく写真に戻した」「bg を全節に戻した」（背景の写真は gitignore で、この作業場所には無い）
#   ・「今季のここまで」を見立ての節にした（viewpoint）。数字は ESPN scoreboard（research/ll_data/results.json、10/14 取得）と
#     ESPN standings（site.api.espn.com/apis/v2/sports/soccer/esp.1/standings）で突き合わせ済み:
#     **第8節まで、マラガは8試合 0勝4分4敗・4得点13失点・勝ち点4・最下位20位**（19位バレンシア5、17位レバンテ6[7試合]・18位エルチェ6）。
#     research/ll_data/standings.json は第7節の古い表なので使っていない（plbuild は勝ち点3・7試合と書いてしまう）
#   ・自分で割った数字: 昨季2部 42試合 得点75失点52勝ち点73 → 1.79 / 1.24 / 1.74。今季 0.50 / 1.63 / 0.50。1部の平均は今季ここまでの78試合・241得点で 1.54（1チーム1試合あたり）。
#     ホーム4試合は3得点5失点・勝ち点3、アウェー4試合は1得点8失点・勝ち点1（得失点差 -2 と -7、計 -9）。
#     昨季1部の残留ラインは17位オサスナの勝ち点42（last_season.json）。42-4=38、残り30試合、38÷30=1.27、1.27÷0.50=約2.5倍
#   ・**昨季は2部**なので、昨季との比べは「1部と2部の比べ」。台本では「昨季2部の」と言い、1部の平均も添えた
#   ・次の3試合は La Opinión de Málaga 2026-10-12（クラブ公式ではなく地元紙）: 10/18 ホーム レアル・ソシエダ 18:30、10/23 アウェー アラベス、10/31 アウェー ベティス
#   ・基礎DATAの読み上げを9行→5行に（創立・愛称・本拠地・優勝[欧州1回と2002年の回収]・昨季の順位）。ホームタウン・オーナー・最多出場は板に出るだけ。オーナーの状況は history4 で言う
#   ・歴史の板を2つ入れ替えた（ドルトムントの夜＝stats、3部からの帰り道＝timeline）。主役（マラガ）の名前が出ない節に名前を入れた
#   ・出さなかったこと: オーナーの息子の刑事事件（10/9 に勾留。個人への訴追で、題に答えない）／監督の10/10 の会見（9/20 の言葉を残した）
#   ・**未確認**: ドルトムント戦・イスコ・カバジェロ・ガメスの数字は 9/27 の材料（英語版・西語版 Wikipedia）のまま。UEFA公式・クラブ公式の記録までは辿っていない。
#     カソルラの移籍金は英語版2100万ユーロ／西語版本文は2000万で食い違い（英語版を採用）。登録28人と下部組織13人は9/6 の西語版の表（夏の移籍市場の後の更新は未確認）
#   ・**足りない素材**: assets/backgrounds/stadium_マラガ.png／stadium_マラガ_in.png（gitignore。手元にあるはず）、assets/images/ll_malaga_history4_w/01.jpg（9/27 の台本から参照）
