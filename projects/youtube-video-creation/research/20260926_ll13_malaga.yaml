  say:
  - 8強と同じシーズンにリーグ6位。それでも借金の処分で、翌シーズンの欧州には出られません。
  - 2013年の夏から主力が次々に去り、**2018年**には2部へ落ちます。
  - text: '**2020年**、裁判所は持ち主を経営から外し、運営を別の人に任せます。'
    card:
      type: table
      title: 3部からの帰り道
      columns: *id002
      rows:
      - - 2023年
        - 25年ぶりに3部へ
      - - 2026年
        - 1部に戻る
  - 3年後には、**25年**ぶりの3部でした。
  - text: そこから2度の昇格を重ね、**2026年6月**に1部へ戻りました。
    image: assets/images/ll_malaga_history4/scene.jpg
  sources:
  - https://en.wikipedia.org/wiki/M%C3%A1laga_CF
  - https://es.wikipedia.org/wiki/M%C3%A1laga_Club_de_F%C3%BAtbol
