- id: history
  heading: 控えのチームが残った
  tier: 背景
  telop: 前身のクラブが消え、控えのチームが残った
  narrator: 解説
  card:
    type: table
    title: 控えのチームが残った
    columns:
    - ''
    - ''
    rows:
    - - 1959年
      - 控えのチームが独立
    - - 1992年
      - 前身のクラブが消滅
    - - 1999年
      - 4部から1部へ
  say:
  - 1959年、前身のクラブと同じ3部に並び、控えのチームは独立を選びます。
  - 1992年、前身のクラブは借金で消滅。独立していた控えのチームが残りました。
  - 1994年に今の名前へ。4部から駆け上がり、**1999年**には1部に届きます。
  sources:
  - https://en.wikipedia.org/wiki/M%C3%A1laga_CF
  - https://es.wikipedia.org/wiki/M%C3%A1laga_Club_de_F%C3%BAtbol
  bg: assets/backgrounds/stadium_マラガ_in.png
  official: false
