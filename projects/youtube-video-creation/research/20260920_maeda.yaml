      - 後半、エヴァートンのバリーがコーナーキックから頭で決めたかに見えましたが、映像の確認でオフサイドとなり、得点は取り消されました。
      - "そして後半22分、イプスウィッチのファタウが**シミュレーションで2枚目の警告**を受けて退場。"
