      - {voice: ネット民, text: 前田はかなり良かった。なのでそろそろ結果出して欲しいのと、前田のスピードを活かすパスが欲しいね, short_voice: true}
      - {voice: ネット民, text: 前田は地味だけど守備に貢献するし、前線からのプレスも効くから先発の方が良い}
      - {voice: ネット民, text: 足元がそこまで上手くないから他の選手との連携がイマイチなのが先発落ちの原因かな}
      - {voice: ネット民, text: 前田のプレイ時間が試合毎に短くなっている}
      - {voice: ネット民, text: 開幕から得点やアシストがなく、チーム内での序列が段々と下がってきたのが明白}
      - {voice: ネット民, text: まだスタメンを模索中なのか、今のが基本ベースで前田大然はジョーカーとしての位置付けに落ちつくのか}
      - {voice: ネット民, text: 前線からの守備が長所であるけど短所でもありますよね。得点やアシストという結果が見えない}
      - {voice: ネット民, text: お馴染みの爆速プレスでボールを引っ掛け、チャンスになりかける。アウェイながらも会場湧く}
      - {voice: ネット民, text: 前田入ってからの方が、得点の可能性は感じたんで、もっと早く出して下さい, short_voice: true}
      - {voice: ネット民, text: ワントップで1人目として、プレスをかけにいくスタイルが重要に感じました}
