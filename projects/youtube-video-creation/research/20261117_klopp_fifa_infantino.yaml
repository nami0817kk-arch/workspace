# 取材: 2026-11-17。requests（ブラウザUA）と WebFetch で本文を読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: サッカーキング 2026-11-16「クロップ監督がFIFAを痛烈批判…会長の交代を要求『もっとうまくやることは十分に可能なはず』」（requests で全文を読んだ）。
# 出典で確かめたこと:
#   ・BBC Sport「Klopp says Infantino worse than Blatter」（requests で全文を読んだ。英語）。本人の言葉（原文）:
#       "I've been following football for many years. There are people who are much more knowledgeable about this than I am. But I think most people now agree a change would make a lot of sense,"
#       "I didn't think things could get worse after Sepp Blatter, but someone has managed to do just that."
#       "Regarding Gianni Infantino, surely the next person to come along can do a better job."
#       "There are people who truly care about the future of football - people who aren't driven by financial interests. If someone like that were to step up - if someone like that were to become president - I think that would be a significant improvement."
#       "There are surely people who care deeply about the future of football and have no financial interests in it."
#     BBC の地の文: ブラッターは2015年に汚職疑惑の中で辞任し、インファンティーノが2016年2月に後任。インファンティーノは3月の再選に立つ予定だが、
#       FIFA Forward Enterprise（W杯などの権利の一部を民間投資家に売る案）を取り下げて以降、圧力を受けている（案を取り下げたのは BBC の言い方）。
#       UEFA はフランス協会会長のフィリップ・ディアロを対抗馬に指名（UEFA 理事会の全会一致。FFF の正式な承認は火曜の見込み）。
#       立候補の締め切りは水曜。ヴェンゲルは出ないと決めたと BBC に情報筋（ここは使わない）。元トッテナムDFのラモン・ヴェガが10月に最初に名乗り。
#       日本サッカー協会の田嶋幸三名誉会長も立候補の意思を表明。
#   ・ESPN「Klopp calls FIFA president Infantino worse than Blatter」（WebFetch。全文は取れず要約）: 会長選について聞かれて答えた。2026-11-16付。
#       選挙は 2027-03-18 モロッコ・ラバト、締め切りは 11/18、立候補には5協会の支持が要る（ESPN。数字の細部は使わない）。インファンティーノ側の反応は記事に無い。
#   ・サッカーキング（日本語。全文）: 「16日のUEFAネーションズリーグ グループA2最終節 オランダ戦を前にした記者会見」で、FIFA会長選の行方を聞かれての発言。
#       英国『スカイスポーツ』が15日に報じた内容として紹介している。→ 記者会見の日付は出どころで食い違う（15日報道／16日の試合前）ので、台本は「オランダ戦を前にした記者会見」とだけ言い、日付は言わない。
#       訳（記事）: 「指導部を刷新することは非常に理にかなっている、というのが今の私の確固たる意見だ」／「ゼップ・ブラッター氏の時代が終わったとき、これ以上悪くなることはないだろうと思っていたのに、実際にはそれをさらに悪化させた人物が現れた」
#       台本の言葉は BBC の英語を私が日本語にしたもの（サッカーキングの訳とは文言が違う。BBC の発言のほうが長い。意味は合っている）。「…」で切れた所は補っていない。
# 自分で数えたもの: インファンティーノに挑む名前として BBC に出てくるのは3人（ヴェガ・田嶋・ディアロ）。ディアロは UEFA の指名で FFF の承認待ち、他の2人は名乗りを上げた段階。
# インファンティーノ側の反応: BBC・ESPN・サッカーキングのどれにも無い（0件。台本には書かない）。
# 政治的断定は避ける: トランプ大統領との関係などサッカーキングの背景の書き込みは使わない。台本は「本人の発言」と「BBC が伝える経緯」だけ。
