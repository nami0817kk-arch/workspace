        text: インファンティーノについて言えば、
        cont: true
      - voice: クロップ
        text: 次に来る人なら、もっとうまくやれるはずです。
        cont: true
      - text: オランダ戦を前にした記者会見で、会長選のことを聞かれて答えました。
        image: assets/images/20261117_klopp_fifa_infantino/02_w.jpg
      - voice: クロップ
        text: 私より詳しい人はたくさんいます。
      - voice: クロップ
        text: でも今は、多くの人が、
        cont: true
      - voice: クロップ
        text: 変わることに大いに意味があると考えていると思います。
        cont: true
      - text: ブラッターは2015年、汚職疑惑の中でフィファ会長を辞めました。
        image: assets/images/20261117_klopp_fifa_infantino/03_w.jpg
      - text: 2016年に後を継いだのが、インファンティーノです。
      - text: 来年3月の会長選にも、立つ予定です。
      - text: インファンティーノは、W杯などの権利の一部を民間の投資家に売る案を出していました。
      - text: その案を取り下げて以降、インファンティーノは圧力を受けているとビービーシーは伝えています。
