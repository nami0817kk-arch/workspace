    heading: 2対0から追いつかれて
    tier: 報道
    telop: ノルウェーがデンマークに3対2
    narrator: キャスター
    card:
      type: table
      title: ノルウェー 3-2 デンマーク（9月24日・オスロ）
      columns: ['', '']
      rows:
        - [14分, ボブ]
        - [18分, ハーランド]
        - [25分, ダムスゴー]
        - [60分, ホイルンド]
        - [74分, ハーランド]
    say:
      - ノルウェーがデンマークに3対2。公式戦でデンマークに勝ったのは、これが史上初めてです。
      - 14分と18分で2対0とリード。そこから25分の直接フリーキックと60分のヘディングで、2対2に追いつかれました。
    sources:
      - https://www.espn.com/soccer/story/_/id/50022925/haaland-world-cup-form-continues-norway-win-denmark
