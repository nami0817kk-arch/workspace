  - id: goal
    main: true
    heading: 74分の型
    tier: 報道
    telop: ショートコーナーから、ダイレクトでニアの上
    narrator: キャスター
    say:
      - text: 'ノルウェーがデンマークに3対2で勝った夜。決勝点のあとの一幕です。'
        short_only: true
      - 74分。左コーナーをヌサとウーデゴールが短くつなぎ、ウーデゴールのパスをハーランドが左足ダイレクトでニアの上へ。
      - 決めた直後、ハーランドが走って行ってキスをしたのは、**セットプレーコーチのポール・フィエルデ**でした。
      - フィエルデ本人は。
      - voice: ポール・フィエルデ
        text: ハーフタイムにエルリングが、高く打つか低く打つか聞いてきた。低くと言ったのに、高く決めた
      - text: 'ソルバッケン監督も、フィエルデの手柄だと言いました。'
        image: assets/images/20260925_sp_solbakken/01.jpg
      - voice: ストーレ・ソルバッケン
        text: フィエルデは0対1で負けていた。仕事を守るためにあれが必要だった。だから良かった
      - voice: ストーレ・ソルバッケン
        text: 練習してきた形だ。ああいうのを読んで見つけるのがセットプレーコーチの仕事。とてもきれいに決まった
    sources:
      - https://www.tv2.no/sport/historisk-triumf-han-har-gjort-leksa-si/19257150/
      - https://www.nrk.no/sport/erling-braut-haaland-reddet-norge-i-dramatisk-kamp-mot-danmark-1.18035954
  - id: record
    heading: 積み上がった数字
    tier: 報道
    telop: 代表56試合で64ゴール。北欧の歴代最多
    narrator: キャスター
    card:
      type: table
      title: ハーランドの代表成績
      columns: ['', '']
      rows:
        - [試合, 56]
        - [ゴール, 64]
        - [北欧の歴代, 1位（イブラヒモビッチ62を抜いた）]
        - [直近16公式戦, 15試合で得点]
    say:
      - text: '代表通算は**56試合で64ゴール**。ワールドカップのあとも、直近16の公式戦で15試合に得点しています。'
        image: assets/images/20260925_haaland_vg/01.jpg
      - この日の1点目が、代表の63点目。イブラヒモビッチの62点を抜いて、北欧の歴代最多になりました。
      - ウーデゴールはひとこと。
      - voice: マルティン・ウーデゴール
        text: いい味だ。隣人に勝つのは気持ちいい
      - text: '負けたデンマークのリーマー監督は、こう言いました。'
        image: assets/images/20260925_sp_riemer2/01.jpg
      - voice: リーマー監督
        text: 2対2で流れはこっちで、勝てると感じていた。でも、ハーランドを誰も見ていなかったミスを罰せられた
    sources:
      - https://www.goal.com/en/lists/manchester-city-striker-erling-haaland-surpasses-ronaldo-zlatan-ibrahimovic-63rd-international-goal/blt3582385d0a915f1e
      - https://x.com/FabrizioRomano/status/2103217649069281429
      - https://bold.dk/fodbold/stillinger/uefa-nations-league-a/nyheder/riemer-efter-nedtur-alt-for-mange-fejl
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「通常運転すぎて納得しかない」と、デンマーク側の怒り
    narrator: キャスター
    say:
      - voice: ネット民
        text: これで代表通算56試合64得点。サッカー大国とはいえないノルウェーでこの記録は凄まじいな
        image: assets/images/20260925_haaland_vg/01.jpg
      - voice: ネット民
        text: 最強ホットラインは健在。ウーデゴールが意表をつくアシスト、エース・ハーランドの勝ち越しゴール
      - voice: ネット民
        text: あの完璧なプレー見せられたら通常運転すぎて納得しかないわ
      - voice: ネット民
        text: ハーランド全然離脱してないし2ゴール決めてて草
      - voice: ネット民
        text: 3時半まで起きてたのに寝てしまった。ハーランド普通に出場してるし、見たかった
      - voice: ネット民
        text: 代表でまた2発。ここに来たら誰も何も書いてない。それが全てを物語ってる。2点じゃ普通で、ハットトリックでやっと話題になる
      - voice: ネット民
        text: ハーランドが差を作った。偶然の2点で、ひとつはミスから
      - voice: ネット民
        text: 恥ずかしい。勝つ気すらないチームに見える。信じられない数の個人ミス
      - voice: ネット民
        text: ノルウェーはなんて魅力のないチームなんだ。ウーデゴール、うえっ
      - voice: ネット民
        text: リーマー出て行け。ベラルーシ戦は絶対に許されない
      - voice: ネット民
        text: 次はハーランドがポルトガルを叩きに来る。当然の報いだ
      - voice: ネット民
        text: ハーランド対ロナウド、見れるの熱すぎる
        short_voice: true
