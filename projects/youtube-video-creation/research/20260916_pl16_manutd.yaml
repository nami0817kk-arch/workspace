sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 鉄道の操車場のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年"]
        - ["最初の名前", "Newton Heath LYR Football Club"]
        - ["愛称", "The Red Devils（赤い悪魔）"]
        - ["本拠地", "オールド・トラフォード／74,158人"]
    say:
      - アルファベット順では、16番目に来ます。
      - 創設は1878年。始まりは**鉄道**でした。
      - ランカシャー・アンド・ヨークシャー鉄道の、ニュートン・ヒースにあった操車場です。
      - そこで働く人たちが作ったチームで、名前もそのまま「ニュートン・ヒース」でした。
      - 愛称は「レッド・デビルズ」。**赤い悪魔**です。
      - もとになったのは、同じ街のラグビークラブ、サルフォードでした。
      - 悪魔がエンブレムに入ったのは1970年。正式な紋章として認められたのは1975年です。
      - 本拠地はオールド・トラフォード。移ってきたのは1910年で、土地の購入におよそ6万ポンドかかりました。
      - 収容は**7万4158人**。プレミアリーグで最も大きいスタジアムです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - id: munich
    heading: 1958年2月6日
    main: true
    tier: 背景
    telop: ミュンヘンでの事故と、その10年後
    narrator: 解説
    card:
      type: table
      title: 事故から、頂点まで
      columns: ["", ""]
      rows:
        - ["1958年2月6日", "ミュンヘンでの航空機事故。23人が亡くなる"]
        - ["うち選手", "8人"]
        - ["1968年", "イングランド勢で初の欧州制覇"]
    say:
      - このクラブを語るとき、外せない日があります。
      - 1958年2月6日。給油のために立ち寄ったミュンヘンで、飛行機が墜落しました。
      - 亡くなったのは**23人**。そのうち**8人**が選手でした。
      - チームは、作り直すところから始めることになります。
      - そして**10年後**の1968年。
      - 決勝でベンフィカを4対1で下し、**イングランドのクラブとして初めて**ヨーロッパの頂点に立ちました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - id: ferguson
    heading: ファーガソンの27年
    tier: 背景
    telop: 1986年から2013年まで、38のタイトル
    narrator: キャスター
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["リーグ優勝", "20回（最多タイ）"]
        - ["1998-99年", "リーグ・FAカップ・CLの3冠"]
        - ["ファーガソン時代", "38のタイトル（1986-2013）"]
    say:
      - リーグ優勝は**20回**。⑭のリヴァプールと並ぶ、最も多い数字です。
      - 1998年から99年には、リーグ、FAカップ、チャンピオンズリーグを同じ年に獲りました。
      - この時代を作ったのがアレックス・ファーガソンです。
      - 1986年から2013年までの**27年**で、**38のタイトル**を積み上げました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - id: now
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はマイケル・キャリック
    narrator: キャスター
    say:
      - 監督はマイケル・キャリックです。
      - 正式な監督として、**少なくとも2028年まで**の契約を結んでいます。
      - 今季の登録に、日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝20回（直近 2012-13）、FAカップ13回（直近 2023-24）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "20回（直近 2012-13）"]
        - ["FAカップ", "13回（直近 2023-24）"]
        - ["リーグカップ", "6回（直近 2022-23）"]
        - ["欧州カップ／CL", "3回（1968／1999／2008）"]
    say:
      - 数えると、大きなタイトルで**47個**になります。
      - 1部優勝20回。これは⑭リヴァプールと並ぶ最多です。
      - FAカップ13回、リーグカップ6回、ヨーロッパの頂点が3回。
      - コミュニティ・シールドの21回は、イングランド記録です。
      - "ただし、**1部優勝の直近は2012年から13年**。13年前です。"
      - 直近の大きなタイトルは、2024年のFAカップ。
      - "**20回獲ったクラブが、13年リーグを獲っていない。**そこが今季の見どころです。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
