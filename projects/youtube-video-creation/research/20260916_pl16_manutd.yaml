# プレミアリーグ20クラブ紹介 ⑯マンチェスター・ユナイテッド（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「鉄道の操車場で働く人たちのチームだった」**。
#
# **ミュンヘンの事故は、事実だけを短く置く。**日付と人数、そこから10年で
# ヨーロッパを獲ったこと。**扇情的に書かない**（⑭のヒルズボロと同じ扱い）
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では16番目」の1行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替え（説明は後ろへ）。
# ③優勝の節は「数えると47個」をやめ、直近に獲ったFAカップから入る形にした
#
# 2026-09-18 追記。①タイトルとサムネを、20本で同じ文面からクラブごとの引きに変えた。
# ②宿敵の節（ノース・ウェスト・ダービー）と「このクラブを語る選手」の節を足した。
# ③theme.hook を1行入れた
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 3節15行 → 2節13行にした。**「ファーガソンの27年」は節として落とし、2行に縮めて
# 「獲ってきたもの」へまとめた。**落としたできごとはコミュニティ・シールド21回の1行。
# **1958年2月6日の節は扱いを変えていない**（事実だけを短く置く）
