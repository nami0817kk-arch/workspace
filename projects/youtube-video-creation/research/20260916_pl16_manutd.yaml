sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 鉄道の操車場のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年"]
        - ["最初の名前", "Newton Heath LYR Football Club"]
        - ["愛称", "The Red Devils（赤い悪魔）"]
        - ["本拠地", "オールド・トラフォード／74,158人"]
    say:
      - このクラブの始まりは**鉄道**でした。創設は1878年です。
      - ランカシャー・アンド・ヨークシャー鉄道の、ニュートン・ヒースにあった操車場です。
      - そこで働く人たちが作ったチームで、名前もそのまま「ニュートン・ヒース」でした。
      - 愛称は「レッド・デビルズ」。**赤い悪魔**です。
      - もとになったのは、同じ街のラグビークラブ、サルフォードでした。
      - 悪魔がエンブレムに入ったのは1970年。正式な紋章として認められたのは1975年です。
      - 本拠地はオールド・トラフォード。移ってきたのは1910年で、土地の購入におよそ6万ポンドかかりました。
      - 収容は**7万4158人**。プレミアリーグで最も大きいスタジアムです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - id: munich
    heading: 1958年2月6日
    main: true
    tier: 背景
    telop: ミュンヘンでの事故と、その10年後
    narrator: 解説
    card:
      type: table
      title: 事故から、頂点まで
      columns: ["", ""]
      rows:
        - ["1958年2月6日", "ミュンヘンでの航空機事故。23人が亡くなる"]
        - ["うち選手", "8人"]
        - ["1968年", "ヨーロッパカップ優勝。イングランド勢で初"]
    say:
      # 2026-09-22 流れの点検。「誰の飛行機か」「何の大会の決勝か」「作り直したのは誰か」が
      # 無く、日付を1行目と3行目で二度読んでいた。日付は最後に置く。
      # バズビー監督とチャールトンの生還・決勝2得点は Bobby_Charlton の記事で裏を取った
      # 2026-09-22 2回目。章カードと表が節の頭から日付を出しているので、耳も1行目で
      # 日付を言う（昨季3位の直後に1958年の話へ切り替わる合図にもなる）。3行目の後出しは落とした
      - 1958年2月6日。ヨーロッパの試合の帰り、給油に立ち寄ったミュンヘンでした。
      - チームを乗せた飛行機が墜落し、亡くなったのは**23人**。そのうち**8人**が選手でした。
      - 生き残ったバズビー監督とボビー・チャールトンが、チームを作り直していきます。
      - そして**10年後**の1968年。ヨーロッパカップ、いまのチャンピオンズリーグの決勝です。
      - ベンフィカを4対1で下し、**イングランドのクラブとして初めて**ヨーロッパの頂点に立ちました。
      - チャールトンはこの決勝で2点を決め、主将として優勝杯を掲げました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Manchester_United_F.C.
      - https://en.wikipedia.org/wiki/Bobby_Charlton
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: リヴァプールとの、ノース・ウェスト・ダービー
    narrator: 解説
    card:
      type: table
      title: ノース・ウェスト・ダービー
      columns: ["", ""]
      rows:
        - ["発端", "マンチェスター・シップ・カナル"]
        - ["運河の完成", "1894年"]
        - ["初対戦", "1894年4月28日／2-0で敗れる"]
        - ["場所", "ブラックバーンのユーウッド・パーク"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "相手は**リヴァプール**。呼び名は**ノース・ウェスト・ダービー**です。"
      - もとをたどると、サッカーではなく**運河**にぶつかります。
      - マンチェスターの商人たちが金を出した運河、シップ・カナルです。
      - これにリヴァプールの政治家が反対し、ふたつの街のあいだに遺恨が残りました。
      - "運河ができたのは1894年。その**3か月後**に、両者は初めて顔を合わせています。"
      - 1894年4月28日、ブラックバーンのユーウッド・パーク。**2対0**で敗れました。
      - "相手は**今季もプレミアリーグにいます。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Liverpool_F.C.%E2%80%93Manchester_United_F.C._rivalry
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: チャールトン、ギグス、ルーニー
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["ボビー・チャールトン", "公式戦758試合249得点"]
        - ["ライアン・ギグス", "公式戦963試合（クラブ最多）"]
        - ["ウェイン・ルーニー", "公式戦543試合253得点（クラブ最多）"]
    say:
      - 名前を挙げるなら、この3人です。
      - ボビー・チャールトン。1956年から1973年。公式戦758試合で249得点。
      - "さきほどの事故から生還した選手で、10年後の決勝では**2得点**。主将として優勝杯を掲げました。"
      - ライアン・ギグス。1990年から2014年までの24年間。
      - "公式戦**963試合**はクラブ最多です。プレミアリーグ優勝13回は、選手として最も多い数字になります。"
      - ウェイン・ルーニー。2004年から2017年。公式戦543試合で253得点。
      - 2017年1月にチャールトンの249得点を抜き、クラブ史上いちばん多く点を取った選手になりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Bobby_Charlton
      - https://en.wikipedia.org/wiki/Ryan_Giggs
      - https://en.wikipedia.org/wiki/Wayne_Rooney
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: チームでいちばん点を取っているのは主将
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "マイケル・キャリック"]
        - ["主将", "ブルーノ・フェルナンデス（MF・ポルトガル）"]
        - ["エース", "主将と同じ人"]
        - ["今季", "リーグ3点・全4点でチーム最多"]
        - ["昨季の得点王", "シェシュコとムベウモが11点で並ぶ"]
    say:
      - 今季、**チームでいちばん点を取っているのは主将**です。
      - ブルーノ・フェルナンデス。ポルトガル代表の中盤です。
      - リーグで3点、すべての大会で4点。**中盤の主将が得点王**という形になっています。
      - 昨季はシェシュコとムベウモが11点ずつで並んでいました。
      - "**前線に決め手が1人いない**、というのが今のユナイテッドです。"
      - 監督はマイケル・キャリックです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 直近の大きなタイトルは2024年のFAカップ
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "13回（直近 2023-24）"]
        - ["1部優勝", "20回（直近 2012-13）"]
        - ["リーグカップ", "6回（直近 2022-23）"]
        - ["欧州カップ／CL", "3回（1968／1999／2008）"]
        - ["1998-99年", "リーグ・FAカップ・CLの3冠"]
        - ["ファーガソン時代", "38のタイトル（1986-2013）"]
    say:
      - 直近の大きなタイトルは、2024年のFAカップです。
      - FAカップは通算**13回**。リーグカップが6回、ヨーロッパの頂点が3回。
      - リーグ優勝は**20回**。リヴァプールと並ぶ、最も多い数字です。
      - 1998年から99年には、リーグ、FAカップ、チャンピオンズリーグを同じ年に獲りました。
      - "この時代を作ったのがアレックス・ファーガソンで、1986年から2013年までの**27年**で**38のタイトル**を積み上げています。"
      - "ただし、**1部優勝の直近は2012年から13年**。13年前です。"
      - "**20回獲ったクラブが、13年リーグを獲っていない。**そこが今季の見どころです。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
