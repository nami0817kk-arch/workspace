# ユニフォームとエンブレムの歴史 トッテナム・ホットスパー（10/20 作成。10/17 アーセナル・10/18 シティ・10/19 ニューカッスルの次の回）。
# 題の問い：雄鶏は、いつからユニフォームの胸にいるのか。
# 軸：①胸に付いた年は、公式とウィキペディアが一致する（1921年のFAカップ決勝）。②その年の胸の形（盾の中か）は資料で割れる。
#    ③最初の雄鶏像（屋根の飾り）は 年・素材が割れる（公式＝1909年・銅／ウィキペディア＝青銅、本体の記事は1909-10シーズン末）。
#    ④なぜ雄鶏か：公式は書かない（クラブ名の由来のハリー・ホットスパーまで）／ウィキペディアは「拍車→闘鶏」／ハリーの記事は「スコットランド人が速さを称えた名」。
#    ⑤胸の形の変遷を、公式の記載だけで数える（10通り＝9回の変更）。⑥胸の広告は公式で確かめた分だけ（AIA は2026/27まで）。
# 取材：2026-10-19。requests のブラウザ User-Agent で本文を読んだ（WebFetch・ブラウザ操作・検索エンジンのAI要約は使っていない。
#   記事のURLを探すために WebSearch の結果の「題名とURL」だけ使い、本文は自分で読んだ）。
#   読んだ公式（tottenhamhotspur.com）：
#     /news/1045541/shield-and-badge（2003-10-22）／/news/1028435/club-unveils-new-badge（2006-01-19）／
#     /news/994837/gallery-our-lilywhite-shirts-through-the-years（2020-05-18。写真は Getty 提供だが本文の文字だけ使い、写真は取り込んでいない）／
#     /news/992604/…-centenary-of-iconic-cockerel-with-new-nike-home-kit-for-202122（2021-05-24）／
#     /news/982376/golden-cockerel-update（2018-11-02）／/news/1000736/yellow-of-yesteryear…（2025-09-02。百周年の図柄の文字）／
#     /the-club/history/year-by-year（年表：1890・1896/98 の色替え）／/the-club/history/hall-of-fame/bobby-buckle（創設）／
#     /news/1000421/club-and-aia-extend-partnership-through-to-2032（2025-11-04）／/news/1036438/…-aia-as-cup-shirt-partner（2013-08-15）／
#     /news/1074148/gallery-new-nike-202627-home-kit-up-close（2026-06-19）。
#   読んだウィキペディア(en)：Tottenham Hotspur F.C.（節「Crest」「Kit」）／History of Tottenham Hotspur F.C.／Henry Percy (Hotspur)。
#
# ---- 一次情報で確かめたこと（年は本文のまま）----
#   ・胸に付いた年（公式 2021-05-24）：「The cockerel was worn on the Club's shirts for the first time in the 1921 FA Cup Final victory over Wolverhampton Wanderers,
#     with Jimmy Dimmock scoring the only goal in a 1-0 victory.」／年表に「1921 Second FA Cup triumph, Spurs beating Wolverhampton Wanderers 1-0 at Stamford Bridge」。
#     写真集に 1924/25「the cockerel adorning our white shirts」。ウィキペディア：「Since the 1921 FA Cup Final, the Tottenham Hotspur crest has featured a cockerel」。
#   ・最初の雄鶏像（公式「Shield and Badge」2003）：「The cockerel and ball first appeared in 1909 when a former player, one William James Scott, cast a copper centrepiece to perch on the new West Stand.」
#     2006 の記事も「first sat on the roof of White Hart Lane in 1909 … copper centrepiece」。ウィキペディア(本体)：「bronze cast … £35 … 9-foot-6-inch (2.90 m) … placed on top of the West Stand at the end of the 1909–10 season」。
#     ウィキペディア(歴史)：「A bronze cockerel was placed on top of the West Stand in 1909」、1910 の公式プログラムの写真つき。
#   ・名前の由来（公式 2003）：ノーサンバランド家の「Black House」が高い通りの向かいにあった。「It is probable that the Northumberland family hold the key to our being called Hotspur.」
#     Sir Henry Percy＝「Harry Hotspur」、1403 に Shrewsbury で討たれた。少年たちが「no doubt looked upon this character as their hero」。**雄鶏の理由は公式のこの記事に書かれていない**。
#     1880 にクリケット部（Hotspur Cricket Club）、2年後の1882にフットボール、1884 に Tottenham Hotspur Football Club。
#   ・ウィキペディア(本体)：「Harry Hotspur … was said to have been given the nickname Hotspur as he dug in his spurs to make his horse go faster … spurs are also associated with fighting cocks.
#     The club used spurs as a symbol in 1900, which then evolved into a fighting cock.」／ハリーの記事：「The nickname "Hotspur" was given to him by the Scots as a tribute to his speed in advance and readiness to attack.」
#   ・胸の形の変更（公式の写真集・記事）：1921 雄鶏／1965「The shield has been removed while a ball has been added below the feet of the cockerel」／
#     1982/83 百周年の特別な図柄（「CENTENARY YEAR」・1882・1982・TOTTENHAM HOTSPUR の巻物。2025-09-02 の記事）／1983「heraldic lions … latin motto 'audere est facere'」／
#     1994/95「a shield was also re-added to our badge」／1995/96「our badge revert to the Cockerel emblem seen first in the 1960s」／
#     1998/99「Bruce Castle and the red Northumberland heraldic lions … initials monogram and Latin motto returned」／1999/00「the shield removed」／
#     2006/07（2006-01-19 公式：the first new design since 1983 … replaces the Club crest, first introduced in 1956 … The Ball is taken from the original Cockerel and Ball … 1909）／
#     2017/18「the historic shield returning to our crest」。公式 2003 は「badge … introduced in 1983 and updated in 1992」。
#   ・屋根の雄鶏の向き（公式 2018-11-02）：1909 から西スタンドは南向き／東スタンドは 1958 から北向き（「49 years later」）／1980年代に風雨で取り替えた東スタンドの雄鶏は南向き（ファンの声）→北向きに戻した／
#     「always positioned with its left wing facing the pitch」→ 新しい雄鶏も左の翼をピッチ側（南スタンドの上）。
#   ・胸の広告（公式の写真集）：1983/84 ホルステン（first ever shirt sponsor）／1995/96 ヒューレット・パッカード／1999/00 ホルステンが戻る／2002 トムソン（綴りは Thompson。ウィキペディアは Thomson）／
#     2006/07 マンション／2010/11 オートノミー／2011/12 オーラズマ／2013/14 HP が戻る／2014/15 AIA（前の年はカップ戦用）。
#     公式 2013-08-15：AIA は 2013/14 の「Cup Shirt Partner」（ヨーロッパリーグ・FAカップ・リーグ杯）、HP は「Premier League shirt Partner」。
#     公式 2025-11-04：「AIA remains the Club's Global Principal Partner and front-of-shirt sponsor until the end of the 2026/2027 season. From July 2027, AIA will transition to Global Training Partner」（2032-06 まで）。
#     2026/27 ホームの公式写真に胸の AIA と雄鶏が写る（取り込んだ写真で確認）。
#
# ---- 食い違い（台本で断る／言わないもの）----
#   ・**1921年の胸の形**：ウィキペディア＝「cockerel within a shield」。公式＝盾は「believed to date from 1956」（1965 に外れた、と写真集）。1921 の胸が盾付きだったかは、読んだ資料で決められない。
#   ・**最初の雄鶏像**：公式＝1909年・銅／ウィキペディア(歴史)＝1909年・青銅／ウィキペディア(本体)＝1909-10シーズン末・青銅・35ポンド・約2.9m。
#   ・**なぜ雄鶏か**：公式は書かない／ウィキペディアは拍車→闘鶏（「said to」「believed」の言い方）／ハリーの記事は「速さを称えたあだ名」。
#   ・**1965 のボール**：公式の写真集＝1965年／ウィキペディア＝「late 1960s」。
#   ・**完全な紋章がシャツにあった期間**：公式 2003＝「two years of the full crest」（1999 に戻る）／ウィキペディア＝「three seasons 1996–99」／写真集＝95/96 は雄鶏だけ・98/99 に城と獅子。
#   ・**2017 のあと**：写真集は盾が戻った 2017/18 以後の変更を書かない／ウィキペディア＝「The shield was however removed the following season」。→ 数えるのは公式の記載だけ（10通り）。
#   ・**1990 の色替え**：年表は 1890 赤＋紺、1896 チョコレートと金、1898 白と青。ウィキペディアは「1895 に チョコレートと金」。→ 台本では扱わない（本筋でない）。
#
# ---- 自分で数えた数（検算した）----
#   ・屋根の雄鶏 1909 → シャツ 1921 ＝ 12年。シャツ 1921 → 2026 ＝ 105年。105÷12 ＝ 8.75。
#   ・胸の形（公式の記載）：1921・1965・1982/83・1983・1994/95・1995/96・1998/99・1999/00・2006/07・2017/18 ＝ 10通り（変更は9回）。
#   ・最初の形 1921→1965 ＝ 44年。1965→2026 ＝ 61年に 9通り。61÷9 ＝ 6.78 ≒ 6.8年。44÷6.78 ＝ 6.5（「6倍を超える」）。
#   ・AIA：2014/15〜2026/27 ＝ 13シーズン（台本では数えない）。
#
# ---- 言わないと決めたもの ----
#   ・スタジアムの数字（収容・席数・工事）・旧本拠地の収容など（10/19 の「トッテナムの本拠地」の回と重ねない）／契約金額（公式に額なし）／
#   ・シャツの色の変遷（1890・1896・1898 の色替え）／メーカー（アンブロ等）の細部／アウェー・サードの色／女子チーム／所有・ENIC の話／
#   ・写真に写る選手の名前（2021/22 の公式写真は服だけで人は写らない）／Wikipedia のメーカー表の細部（Hummel 等は台本で使わない）。
#
# ---- 一次情報に届かなかったところ ----
#   ・雄鶏を選んだ理由を書いた、クラブ自身の資料（読んだ公式の記事に無い）。ウィキペディアの拍車の説は二次。
#   ・1921 の胸の形を示す当時の写真。公式の写真集（Getty 提供）は文字だけ読み、写真は使っていない。
#   ・1909 の雄鶏が銅か青銅か、年が 1909 か 1910 かを決める資料。
#
# ---- 写真（assets/images/20261020_kit_tottenham/、出典は credits.json）。取り込んだあと開いて見た（透かしなし・代理店の表記なし）----
#   t01 = 2021/22 ホームシャツ（雄鶏百周年）の公式写真、t02 = 公式記事の金の雄鶏の完成予想図（白地）、t03・t04 = 2026/27 ホームシャツの公式写真（胸に雄鶏と AIA）。
#   t05 = Commons「Spurs cockerel on the roof…2020」（CC BY-SA 4.0 Hzh）、t06 = Commons「East side of Tottenham Hotspur Stadium with cockerel emblem」（CC BY 4.0 Jonathan Deamer）。
#   エンブレムは assets/crests/トッテナム.png・節の頭の差し込み assets/backgrounds/cut_トッテナム.png（権利は晴れていない＝引き受ける危険）。
#   Getty などの代理店の写真は使っていない。人物は写らない（服・像・建物）。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**。ここの thumbnail は点検用の案A。
