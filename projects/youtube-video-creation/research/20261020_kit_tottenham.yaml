      highlight_row: 1
  - text: 拍車は、乗馬の靴に付ける金具。闘鶏の足にも付きます。
    image: assets/images/20261020_kit_tottenham/t05_cockerel_roof.jpg
    card: none
  - text: ハリーは、拍車を馬に当てて突っ込んだ、と言われます。
    image: assets/images/20261020_kit_tottenham/t02_golden_cockerel.jpg
    card: none
  - text: 1900年に、拍車が象徴になり、のちに闘鶏へ変わった、とも書きます。
    image: assets/images/20261020_kit_tottenham/t03_2627_home.jpg
    card: none
  - text: ただ、ハリー本人の記事は、別のことを書きます。
    card:
      <<: *id_why
      highlight_row: 2
  - text: あだ名は、スコットランド人が付けた、速さと攻める構えを称えた名、と。
    card: none
    image: assets/images/20261020_kit_tottenham/t06_stadium_east.jpg
  - text: 拍車の話は、そこには出てきません。
    emph: true
    card: none
  - text: どの説が正しいかは、ここでは決めません。
    image: assets/images/20261020_kit_tottenham/t01_centenary_kit.jpg
    card: none
