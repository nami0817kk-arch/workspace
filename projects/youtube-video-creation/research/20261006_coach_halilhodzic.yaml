  - text: 2015年3月、ハリルホジッチは日本代表の監督に就きます。
    image: assets/images/20261006_coach_halilhodzic/03_w.jpg
    card: none
  - text: 就任会見では、アルジェリアの16強を引き合いに、こう言い切りました。
    card: none
  - text: 日本代表もそれと同じことができると、
    voice: ハリルホジッチ
    card: none
  - text: 私は確信している。私はそのために来た。
    voice: ハリルホジッチ
    cont: true
    card: none
  - text: アジアの2次予選は、ホームのシンガポール戦を0対0で引き分ける出だし。
