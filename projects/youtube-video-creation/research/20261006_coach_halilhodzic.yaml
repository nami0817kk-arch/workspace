- id: view
  viewpoint: true
  heading: 歴代4監督の勝率で見る、ハリルホジッチの38試合
  tier: 背景
  telop: 通算55.3%はザッケローニと並ぶ。W杯予選は72.2%、出場決定後は30%
  narrator: キャスター
  card:
    type: table
    title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
    columns: &id017
