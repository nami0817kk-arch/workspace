- id: press
  main: true
  heading: 「こんな形で去るとは」、解任後の会見
  tier: 報道
  telop: 「人間として深く失望した」
  narrator: キャスター
  say:
  - text: 日本をW杯へ導き、本番の2か月前に職を解かれたハリルホジッチ。
    short_only: true
    image: assets/images/20261006_coach_halilhodzic/02_w.jpg
  - text: 解任から20日後、東京での会見です。
  - text: 素晴らしい日本という国を、
    voice: ハリルホジッチ
    card: none
  - text: このような形で去るとは、考えたことはなかった。
    voice: ハリルホジッチ
    cont: true
    card: none
  - text: 4月7日以来、私の人生で
    voice: ハリルホジッチ
    cont: true
    card: none
  - text: 一番つらいと言ってもいい時期を過ごしたし、
    voice: ハリルホジッチ
    cont: true
    card: none
  - text: 人間として深く失望した。
    voice: ハリルホジッチ
    cont: true
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?243282-243282-fl
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?243282-243282-fl
- id: after
  heading: モロッコでも本番の前に、そして古巣ナントへ
  tier: 報道
  official: true
  telop: W杯へ導いた代表は4つ。本大会で率いたのは1つ
  narrator: 解説
  card:
    type: table
    title: W杯へ導いた4つの代表
    columns: &id015
    - 代表
    - 大会
    - 本大会
    rows: &id016
    - - コートジボワール
      - 2010年
      - 開幕の4か月前に解任
    - - アルジェリア
      - 2014年
      - 指揮して16強
    - - 日本
      - 2018年
      - 開幕の2か月前に解任
    - - モロッコ
      - 2022年
      - 開幕の3か月前に退任
  say:
  - text: 同じ会見で、日本代表を応援するかと聞かれると、すぐにこう答えています。
    card: none
  - text: 私は日本の永遠のサポーターだ。
    voice: ハリルホジッチ
    card: none
  - text: 2019年からはモロッコ代表を率います。
    image: assets/images/20261006_coach_halilhodzic/02_w.jpg
    card:
      type: table
      title: W杯へ導いた4つの代表
      columns: *id015
      rows: *id016
      highlight_row: 3
  - text: 2022年3月、W杯カタール大会への切符をつかみました。
    card:
      type: table
      title: W杯へ導いた4つの代表
      columns: *id015
      rows: *id016
      highlight_row: 3
  - text: ところが8月、モロッコの連盟は「見解の相違」で円満に別れると発表。
    card:
      type: table
      title: W杯へ導いた4つの代表
      columns: *id015
      rows: *id016
      highlight_row: 3
  - text: ハリルホジッチがW杯へ導いた代表は、これで4つ。
    card:
      type: table
      title: W杯へ導いた4つの代表
      columns: *id015
      rows: *id016
  - text: そのうち本大会で指揮を執ったのは、アルジェリアの1度だけです。
    emph: true
    card:
      type: table
      title: W杯へ導いた4つの代表
      columns: *id015
      rows: *id016
      highlight_row: 1
  - text: 2026年春には17位の古巣ナントへ。降格は防げず、シーズン限りで退きました。
    card: none
  quotes_from:
  - ゲキサカ https://web.gekisaka.jp/news/japan/detail/?243265-243265-fl
