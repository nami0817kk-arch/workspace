      - 54.5%
      - 57.1%
    - - アギーレ（2014〜15）
      - '10'
      - 6・2・2
      - 60.0%
      - ―
    - - ハリルホジッチ（2015〜18）
      - '38'
      - 21・9・8
      - 55.3%
      - 72.2%
    - - 森保一（2018〜26）
      - '111'
      - 76・17・18
      - 68.5%
      - 81.8%
  say:
  - text: ハリルホジッチの38試合を、前後の監督と同じ物差しで並べます。
    image: assets/images/20261006_coach_halilhodzic/02_w.jpg
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
  - text: 数えたのは協会の記録。PK戦は引き分けにしています。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
  - text: 通算は21勝9分け8敗。勝率は55.3%です。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
      highlight_row: 2
  - text: 前任アギーレの60%には届かず、ザッケローニとの差は1ポイントもありません。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
      highlight_row: 1
  - text: ところがW杯予選に絞ると72.2%。ザッケローニの57.1%を大きく上回ります。
    emph: true
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
      highlight_row: 2
  - text: 一方で、予選以外の20試合は8勝。勝率は40%にとどまりました。
    card:
      type: table
      title: ハリルホジッチの38試合を分ける（同じ数え方）
      columns: &id019
      - 区切り
      - 試合
      - 勝・分・負
      - 勝率
      rows: &id020
      - - W杯予選
        - '18'
        - 13・3・2
        - 72.2%
      - - 予選以外
        - '20'
        - 8・6・6
        - 40.0%
      - - 出場決定まで
        - '28'
        - 18・7・3
        - 64.3%
      - - 出場決定のあと
        - '10'
        - 3・2・5
        - 30.0%
      highlight_row: 1
  - text: 出場を決めた夜までの28試合で見ると、64.3%。
    card:
      type: table
      title: ハリルホジッチの38試合を分ける（同じ数え方）
      columns: *id019
      rows: *id020
      highlight_row: 2
  - text: 決めたあとの10試合は3勝で、勝率は30%まで下がっています。
    emph: true
    card:
      type: table
      title: ハリルホジッチの38試合を分ける（同じ数え方）
      columns: *id019
      rows: *id020
      highlight_row: 3
  - text: その落差の中で、協会は本大会の前の交代を選びました。
    card:
      type: table
      title: ハリルホジッチの38試合を分ける（同じ数え方）
      columns: *id019
      rows: *id020
      highlight_row: 3
  - text: 森保一は予選で8割を超え、通算でも4人の中で最も高い勝率です。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
      highlight_row: 3
  - text: その森保ジャパンは、この秋の4試合を負けなしで終えています。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
      highlight_row: 3
  - text: W杯への道を切り開いた3年間は、予選の数字にはっきり残っています。
    card:
      type: table
      title: 日本代表監督の勝率（JFAの記録から計算・PK戦は引き分け）
      columns: *id017
      rows: *id018
