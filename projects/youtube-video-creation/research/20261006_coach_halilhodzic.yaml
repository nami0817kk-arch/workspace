      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 1978年には21歳以下の欧州選手権で優勝し、大会の最優秀選手にも選ばれました。
    card:
      type: table
      title: 選手・ハリルホジッチの歩み
      columns: *id005
      rows: *id006
      highlight_row: 1
  - text: 1981年の国内カップ決勝で2点を決め、クラブ初の主要タイトルをもたらします。
    card:
      type: table
      title: 選手・ハリルホジッチの歩み
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: その秋にフランスのナントへ。翌年はユーゴスラビア代表でW杯に出ます。
    card:
      type: table
      title: 選手・ハリルホジッチの歩み
      columns: *id005
      rows: *id006
      highlight_row: 2
  - text: ナントでは1983年にリーグ優勝。27点はリーグ最多で、得点王に輝きます。
    card:
      type: table
      title: 選手・ハリルホジッチの歩み
      columns: *id005
      rows: *id006
      highlight_row: 3
  - text: 1985年は2年前より1点多い28点を挙げ、2度目の得点王に。
    card:
