  say:
  - text: W杯行きを決めたハリルホジッチの日本は、11月にブラジルとベルギーに連敗。
    image: assets/images/20261006_coach_halilhodzic/03_w.jpg
    card:
      type: table
      title: 出場を決めたあとの10試合
      columns: *id013
      rows: *id014
      highlight_row: 2
  - text: 12月の東アジアの大会、E-1選手権では韓国に1対4で敗れました。
    card:
      type: table
      title: 出場を決めたあとの10試合
      columns: *id013
      rows: *id014
      highlight_row: 3
  - text: 3月はW杯に出ないマリと1対1で引き分け、ウクライナには1対2で敗戦。
    card:
      type: table
      title: 出場を決めたあとの10試合
      columns: *id013
      rows: *id014
      highlight_row: 4
  - text: 協会の声明は、別れの理由をこう説明しています。
    card: none
  - text: 3月27日のウクライナ戦の後、
    voice: 田嶋会長
    card: none
  - text: 選手との信頼関係やコミュニケーションが
    voice: 田嶋会長
    cont: true
    card: none
  - text: 十分に取れるような状況でなくなった
    voice: 田嶋会長
    cont: true
    card: none
  - text: たとえ1％でも2％でも、
    voice: 田嶋会長
    card: none
  - text: ワールドカップで飛躍できる可能性に懸け、
    voice: 田嶋会長
    cont: true
    card: none
  - text: 今回の監督交代を決めました。
    voice: 田嶋会長
    cont: true
    card: none
