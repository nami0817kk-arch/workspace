      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: そこから7連勝。8試合で失点0のまま、首位で抜けます。
    card:
      type: table
      title: W杯ロシア大会のアジア予選（2015〜17）
      columns: *id009
      rows: *id010
      highlight_row: 1
  - text: 2016年9月からの最終予選は、初戦でアラブ首長国連邦に1対2の敗戦。
    card:
      type: table
      title: W杯ロシア大会のアジア予選（2015〜17）
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: 翌年3月は敵地でアラブ首長国連邦に2対0で勝ち、初戦の借りを返します。
    card:
      type: table
      title: W杯ロシア大会のアジア予選（2015〜17）
      columns: *id009
      rows: *id010
      highlight_row: 4
  - text: そして2017年8月31日。勝てば出場が決まる、オーストラリアとの一戦です。
    card:
