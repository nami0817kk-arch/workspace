# 監督の経歴：ヴァイッド・ハリルホジッチ（10/6）。2015年3月〜2018年4月に日本代表監督。W杯ロシア大会の出場を決め、開幕の2か月あまり前に契約解除。
# 冒頭は「W杯2か月前の解任」から入る（10/6 の決まり：いちばん強い一点から。基礎DATAは2節目で短く）。
# 通算の数字は JFA の各年の「試合日程・結果」（2010〜2018）から自分で数えた。森保の回と同じ数え方（実際に戦った国際Aマッチ、PK戦は引き分け）。
#   JFA の 2014 年の表はベネズエラ戦（9/9）が「○3-0」になっているが、JFA の試合ページの記事は「引き分け」（実際は2-2）→ 2-2 で数えた。
#   ザッケローニ 55試合30・12・13（54.5%、W杯予選14試合57.1%）、アギーレ 10試合6・2・2（60.0%）、ハリルホジッチ 38試合21・9・8（55.3%、予選18試合72.2%）、
#   森保 111試合76・17・18（68.5%、予選81.8%。森保の回の控え）。ハリルホジッチは出場決定まで28試合64.3%、そのあと10試合30.0%（この回だけの数字）。
# ザッケローニの回が同じ日にあるので、ザッケローニは見立ての表の名前と数字だけ。経歴は語らない。
# 本人の言葉：就任会見（JFA 2015-03-14）・出場を決めた夜（JFA 2017-08-31）・解任後の会見（ゲキサカ 2018-04-27）。解任の理由は JFA の声明（2018-04-09）の言葉だけ。
# 生年月日（JFA は5月15日、英語版 Wikipedia は10月15日）とユーゴスラビア代表の試合数（JFA 32、Wikipedia 15）は資料で食い違うので出さない。
# ネットの反応は入れていない（シリーズの回）。材料の控えは research/raw/20261006_coach_halilhodzic.md。
# 写真は Commons だけ（代理店なし）：02 モロッコ代表 2022（CC BY-SA 4.0 AB75P。サムネ・冒頭・山場）、05 リール監督時代（CC BY-SA 4.0 Nicolosc1。表のある選手・監督の節）、
#   03 日本代表監督の時期 2016、通訳ダバディ氏と WOWOW の解説席（CC BY-SA 4.0 Goldive）。ぼかしで埋めた 16:9 は使わない（01・04 は本編に出さない）。
