# 取材メモ（11/22 日、シリーズ「比べる」＝ランキング形式、key: compare_ranking_nopk）。
# **臨時の入れ替え**：この日11:00枠のクラブ紹介（ブンデス）が尽きたため「比べる」に。A組の日なのでクラブ・選手の1対1ではなく、ランキングにした。
# **情報の時点は 2026-11-12**（ESPN 取得 2026-11-12 夜、各リーグ9〜12試合）。FotMob・DataMB は使っていない。
# 物差し：欧州5大リーグの今季リーグ戦、**得点からPKで決めた得点を引いた数**。出場時間の足切りは無し。
# 数字：ESPN 公開API（各リーグの得点上位50を読み、得点5以上の45人について選手の今季成績で試合・分・得点・PK得点を取り直した。引き算は自分で）。
#   道具：output/_tmp_compare2/top.py（結果は top.json・top_sorted.json）。
#   **プレミアリーグは公式（FPL公式API bootstrap-static）と突き合わせた**：ハーランド9・アイザック7・ジャクソン6・バリー6の得点が一致。FPL にPKの内数の項目は無く、PKは ESPN のまま。
#   **ほかの4リーグには公式の突き合わせ先が無い**（ESPN の集計のまま）。PK得点の取りこぼしがあれば順位が動きうる。
# 順位（同点は同順位）：1位ラフィーニャ12／2位エムバペ10／3位（9）ヤマル・ザビリ・ハーランド／6位（8）マレン・シック・ライモンド／9位（7）ヴァレラ・クルスティッチ・アイザック・カメージョ・フェルミン・ロペス。
#   PKを含む得点：ラフィーニャ15（PK3）・エムバペ13（PK3）・ヤマル10（PK1）・ザビリ9・ハーランド9・ヴァレラ9（PK2）・フュルクルク9（PK3）・シナヨコ9（PK3）・マレン8・シック8・ライモンド8・ブディミル8（PK4）・ルポール7（PK4）。
#   試合・分：ラフィーニャ11・813／エムバペ12・1074／ヤマル12・995／ザビリ12・803／ハーランド10・890／マレン10・652／シック9・704／ライモンド10・761。
# 自分で数えた値：上位8人の得点80のうちPK7（8.75%）。PKを除く得点が7以上の13人の得点117のうちPK9。13人のリーグ別：スペイン6・イタリア4・イングランド2・ドイツ1・フランス0（フランスの最多は6＝シナヨコ・グイリ・アーチャー）。
#   90分あたり（PKを除く）：ラフィーニャ12×90÷813=1.33／マレン8×90÷652=1.10／シック8×90÷704=1.02／ザビリ9×90÷803=1.01／ライモンド8×90÷761=0.95／ハーランド9×90÷890=0.91／エムバペ10×90÷1074=0.84／ヤマル9×90÷995=0.81。
#   PKを含めた順位→除いた順位：ザビリ4→3／ハーランド4→3／ヴァレラ4→9／フュルクルク4→14／シナヨコ4→14／マレン9→6／シック9→6／ライモンド9→6。ブディミル 8（PK4）→4、ルポール 7（PK4）→3。
# **選んだ理由**：11/20 のローマ×ラツィオと軸（クラブ・順位）が違い、10/20 の「得点＋アシスト」ランキング（ラフィーニャ15・ヤマル14・エムバペ11）とも物差しが違う（PKを除く・アシストを数えない）。
#   10/20 の数字（G+A）は使わない。10/20 から33日あいている。大物（ラフィーニャ・エムバペ・ヤマル・ハーランド）を軸に、PKを引くと順位が動く、という「伏せる軸」を置いた。
#   重なり確認：scripts・posted.json・covered.yaml・picks を grep。「PKを除く得点」のランキングは初めて。同じ日（11/22）の他シリーズとは、人（スカローニ・シェフチェンコ・ヴィルツ）も重ならない。
#   エムバペ（レアル・マドリード）と 11/20 のロベルト・カルロス（世界レジェンド）はクラブが重なるが、日が違う。ラツィオ・ローマは 11/20 の比べるで使う。マレンは 11/11 に選手紹介を出した。
#   **11/22 の財政シリーズはラツィオ（20261122_finance_lazio）**。この回にラツィオの選手は1人も入れていない。
# 写真：assets/images/20261122_compare_ranking_nopk/credits.json に出どころを控えた。ラフィーニャ・エムバペ・ヤマル・ハーランドは過去の回（10/18・10/23・11/4・11/5）の写真を再利用。
# 反応・本人の言葉：入れていない（数字で比べる回）。日本との接点：無し。
