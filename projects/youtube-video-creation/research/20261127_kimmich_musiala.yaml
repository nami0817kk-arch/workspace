    say:
      - text: バイエルンのキミッヒが、チームメイトのムシアラをめぐるクラブの幹部のやり方を、こう批判しました。
      - voice: キミッヒ
        text: クラブは選手より大きい。でも、人より大きくはない。
        emph: true
        image: assets/images/20261127_kimmich_musiala/c_kimmich/01_wf.jpg
      - voice: キミッヒ
        text: これは絶対にだめなことで、バイエルンらしくもない。
        cont: true
      - text: 25日、チャンピオンズリーグのリール戦のあと、記者に話した言葉です。
      - text: ムシアラは神経の病気を抱えていて、11月20日に、およそ2か月ぶりに試合に戻ったばかり。
        image: assets/images/20261127_kimmich_musiala/c_musiala/01_w.jpg
      - text: その間に、クラブの幹部が、ムシアラの状態や契約を公の場で話していました。
      - text: 監査役のルンメニゲは、元の強さに戻れるかを疑い、給与を「もう説明がつかない額」と話しています。
      - voice: キミッヒ
        text: 分からないのは、それを公の場で話すやり方です。
        image: assets/images/20261127_kimmich_musiala/c_kimmich2/01_w.jpg
      - voice: キミッヒ
        text: 選手の背中に負わせることは、絶対にあってはいけない。
        cont: true
      - voice: キミッヒ
        text: 選手の出来なら、いつ批判してもいい。
        image: assets/images/20261127_kimmich_musiala/pair/01.jpg
      - voice: キミッヒ
        text: でも、これは別の問題です。
        cont: true
      - voice: キミッヒ
        text: テーブルを囲んで、内部で話すべきことでした。
        cont: true
