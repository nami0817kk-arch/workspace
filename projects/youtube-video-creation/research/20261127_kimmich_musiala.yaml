# 取材メモ（2026年11月27日）キミッヒが、ムシアラをめぐるバイエルン幹部の公の発言を「バイエルンらしくない」と批判。翌日、最高経営責任者ドレーゼンは「内部で話す」（ニュースのショート。見せ方 Y＝キミッヒ本人の言葉から始める）
# 取材: 2026-11-27。WebFetch と requests（ブラウザUA）だけ。検索エンジンのAI要約・ブラウザの道具は使っていない。
# いつ・どこで: 11/25（水）チャンピオンズリーグ リール 2-1 バイエルン（ESPN uefa.champions event=401915377、2026-11-25 20:00 UTC）のあと、取材エリアで記者に話した（ESPN「told reporters after Bayern's 2-1 Champions League loss at Lille」、n-tv「in der Nacht von Mittwoch auf Donnerstag」）。
#   ESPN の試合データ: 15分 ウパメカノ（バイエルン）／62分 上田綺世（リール）／65分 パヴロヴィッチのオウンゴール。ムシアラは76分にビショフと交代で出場。キミッヒは先発。
#   → 上田の得点は 11/26 ueda_bayern_equalizer で扱った。今回は言わない。
# キミッヒの言葉（ドイツ語の原文。sportschau「Debatte um Musiala: Kimmich greift Bayern-Bosse an」11/26、n-tv「Joshua Kimmich sagt endlich den wichtigsten Satz in der Musiala-Debatte」11/26）:
#   "Es darf niemals passieren, dass es auf dem Rücken von einem Spieler ausgetragen wird. Natürlich ist der Verein immer das Höchste, um das es geht und größer als der Spieler, aber trotzdem nicht größer als der Mensch. Und das ist ein absolutes No-Go und auch nicht Bayern-like."（n-tv の書き起こし。sportschau もほぼ同文）
#   "Was ich nicht verstehe, ist die Art und Weise, wie man das in der Öffentlichkeit kommuniziert."（sportschau）
#   "Ich finde, wenn es um die Leistung von den Spielern geht, dann kann man immer kritisieren, dann ist das auch völlig legitim. (...) Aber da ging es um eine andere Problematik und das ist etwas, was man intern am Tisch klären sollte und nicht öffentlich versuchen sollte zu klären. Und vor allem bei einem Verein wie Bayern München, der eigentlich für so was steht, dass man eine Familie ist, dass man da zusammenhält."（n-tv。「(...)」の中は補わない）
#   "Wir sollten nicht auf Wunder hoffen, er wird Zeit brauchen. Das Wichtigste ist, dass er jeden Tag zur Säbener kommt und den Fußball genießt. Ich hoffe, er spürt, dass alle zu 100 Prozent hinter ihm stehen."（sportschau・n-tv 同文）
#   英語（ESPN/AP 50602935）: "The club is obviously the top priority and bigger than a player, but it's not bigger than a person. That's an absolute no-go and it is not Bayern-like either." → ドイツ語と一致。
#   → 台本の言葉は、ドイツ語の原文を私が日本語にしたもの。
# ムシアラの状況（一次に近いもの）:
#   ・バイエルンとムシアラの代理人の共同声明（11/25 水、sportschau・ESPN が引用）: ムシアラは「2025年4月22日に、初めてアブサンスのような症状で検査を受けた」。ESPN: 契約延長の2か月あと。契約は2030年6月30日まで（sportschau）。
#   ・ESPN（AP）: 発作を起こす神経の病気（neurological condition）。8月に本人が診断を公にした。けがで2か月ほど試合を離れ、11/20 のケルン戦で復帰（sportschau「Comeback nach rund zwei Monaten Pause」）。
#   ・幹部の発言: 名誉会長ヘーネス、最高経営責任者ドレーゼン、監査役会のルンメニゲが、ムシアラの状態と契約の見直しを公の場で話した（sportschau）。ルンメニゲは「元の強さに戻れるか」を疑い、給与について「この額はもう説明がつかない」（Sky、ケルン戦のあと）。
#   → 病気については「神経の病気」とだけ言う（一次の言葉の範囲）。症状の名前・発作の場面は言わない。幹部の発言の中身は 11/22 musiala_fifpro と重なるので1行だけ。
# クラブの対応（kicker の見出し「Dreesen ruft bei Musiala neues Motto aus: "Kümmern, kümmern und nicht reden"」は kicker が 403 で本文を読めなかった。同じ言葉を sportschau・n-tv が全文で引用）:
#   ドレーゼン（11/26 木 午後、ウンターハヒングで）"Wir möchten uns ums Kümmern kümmern, und nicht ums Reden. … Deswegen werde ich auch nicht weiter darüber reden. Sie werden verstehen: Wenn wir das schon so gesagt haben, dann wollen wir das auch intern klären."
#     キミッヒと話すのかと聞かれ "Das habe ich nicht gesagt. … Kümmern, kümmern - und nicht reden!"
#   n-tv: ドレーゼンは「ミア・ザン・ミア」が問われていることについて「少し大げさ…誰もジャマルの面倒を見ないとは言っていない」。
#   → 台本の言葉は、ドイツ語を私が日本語にしたもの。
# 食い違い:
#   ・試合の日: 11/25（水）。ESPN の公開は11/26。→ 「25日のリール戦のあと」。
#   ・検査の日: sportschau「22. April 2025」、ESPN「April 2025」。→ 「2025年4月」。
#   ・キミッヒの肩書き: n-tv は「Ersatzkapitän（キャプテンの代わり）」とも「Kapitän」とも書く。→ 肩書きは言わない。
# 前の本との重なり: 11/22 musiala_fifpro（世界の選手会の声明）。→ 今回はチームメイトの言葉とクラブの返事。FIFPRO の話はしない。11/26 ueda_bayern_equalizer（同じ試合）→ 試合の中身は言わない。
# 【言わないこと】発作の場面・症状の細部／契約の金額（報道どまり）／幹部の個人攻撃に読める言い方／キミッヒの家族の話（n-tv の地の文）。
# 写真: Commons の CC BY-SA 4.0（portrait で被写体を確かめて取得）。c_kimmich＝キミッヒ 2026-06-25 W杯 エクアドル対ドイツ（Bryan Berlin）、c_musiala＝ムシアラ 同じ試合（Bryan Berlin）、c_kimmich2＝キミッヒ 2018年（Granada。古い写真だが縦の入れ替え用）。
#   pair＝キミッヒとムシアラを pairphoto で横に並べた1枚（サムネ用）。記事の写真は sportschau が IMAGO・picture alliance・dpa、ESPN が Getty なので使わない。FC バイエルン公式は読み込みが時間切れ。ドレーゼンの写真は Commons で見つからなかった。
