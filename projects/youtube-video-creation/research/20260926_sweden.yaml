  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「覚醒の合図」と「史上最高の2トップ？」
    narrator: キャスター
    say:
      - voice: ネット民
        text: うおーギョケレシュ決めた 復調しろマジで
      - voice: ネット民
        text: イサクに続いてギョケレシュまで やっぱスウェーデン強いし、華がある！
      - voice: ネット民
        text: ギョケレシュは、やっぱり自分中心にしてくれるシンプルなチーム向きやなぁ。彼が悪いわけじゃなく、今季のアーセナルには合ってない。ただハヴァーツが代表で怪我したし、次はスタメンのチャンスかもしれません。
      - voice: ネット民
        text: 絶対そうすべきだ。前に見せていたサカとの連係を、また積み上げていくところが見たい
      - voice: ネット民
        text: ハヴァーツが怪我した今、ギョケの力がリーグ戦再開後絶対必要になる。また仮面ポーズを見せてくれ！！
      - voice: ネット民
        text: メディアが持ち上げまくっているラフィーニャは、今日のオーストラリア戦でひどかった。一方、「アーセナルの失敗作」ギョケレスは、今日のルーマニア戦で素晴らしかった
      - voice: ネット民
        text: 2トップで戦った。イサクはよく下がり、ギョケレスは前線に残る。昔ながらの4-4-2だ
      - voice: ネット民
        text: ギョケレスとイサクをスウェーデン史上最高の2トップと呼ぶ人は、ケネット・アンデションとマルティン・ダーリンを覚えていないんだろう。でも、そうなってくれたらいいと思う
      - voice: ネット民
        text: イサク復活してきてるっぽいしギョケレシュもアーセナルで復調するといいね。
      - voice: ネット民
        text: ギョケレシュは人としてはめちゃナイスガイで好きなんですけど、あまりにも下手なのが悲しいところです
      - voice: ネット民
        text: こういうチームがW杯で同組になったのは日本にとって不運だったな
      - voice: ネット民
        text: ギョケレシュ覚醒の合図
        short_voice: true
