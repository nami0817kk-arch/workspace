  - id: arsenal
    main: true
    heading: アーセナルでは29分
    tier: 報道
    telop: プレミアは途中出場2回、計29分。代表で今季初ゴール
    narrator: キャスター
    say:
      - text: 'アーセナルのギョケレスが、ネーションズリーグのスウェーデン代表の試合で、イサクと揃って得点しました。'
        short_only: true
      - ギョケレスにとっては、クラブと代表を通じて今季初めてのゴールです。
      - アーセナルでは、プレミアリーグの途中出場2回、合わせて29分間にとどまっています。
      - ルーマニア戦の前日、アーセナルのハヴァーツがドイツ代表の試合で負傷しました。
      - ハヴァーツはクラブに戻って検査を受けます。残る純粋なセンターフォワードは、ギョケレスだけです。
      - リーグ戦が再開すれば、プレミアで今季初めての先発になる可能性が出てきました。
      - ルーマニア戦のあと、ギョケレスはこう話しました。
      - voice: ヴィクトル・ギョケレス
        text: ホームで代表とプレーするのは居心地がいい。今日はプレーしていて楽しかった
      - voice: ヴィクトル・ギョケレス
        text: 手応えはよかった。けっこう試合に関われていたし、ボールもたくさん受けられた
      - 次のポーランド戦について聞かれると、こう答えています。
      - voice: ヴィクトル・ギョケレス
        text: 対戦するのが楽しみだ。僕はいつだって試合に出たい
    sources:
