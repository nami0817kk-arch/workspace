    say:
      - ネーションズリーグの初戦。スウェーデンはホームでルーマニアに2対1で勝ちました。
      - ポッター監督はイサクとギョケレスを2トップに並べ、その2人が1点ずつ決めています。
      - 前半20分、イサクがアヤリのスルーパスに抜け出し、ダイレクトで決めました。
      - voice: アレクサンデル・イサク
        text: 完璧なお膳立てだった。素晴らしいパスだ
      - 前半43分にはギョケレスです。ベリヴァルのミドルシュートをキーパーが弾き、こぼれ球を押し込みました。
      - voice: グレアム・ポッター
        text: イサクとヴィクトルが2人とも点を取ってくれたのは素晴らしい
