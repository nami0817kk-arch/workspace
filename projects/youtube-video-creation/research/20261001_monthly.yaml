# 2026年9月の月間まとめ（2026-10-01 公開の回）。雛形は tools/monthly.py（9/28）から作り直した。
# 数字の出どころ（2026-09-30 に取り直し・突き合わせ）:
#   首位: research/standings/2026-09-28.json（FotMob）を ESPN の順位表 API と5リーグとも突き合わせて一致。
#         9/22〜 は代表の期間でリーグ戦が無いので、9/28 の控えが9月末の順位。
#   得点: research/scorers/2026-09-28.json（FotMob）。鈴木唯人の内訳は ESPN の試合記録（8/30 ブレーメン戦で3点、9/19 フランクフルト戦で1点）。
#   日本人: Transfermarkt の試合ごとの記録（tools/japan_abroad.py の名簿48人、クラブの公式戦だけ・代表は除く・欧州の日付で 9/1〜9/30）。
#         雛形は日本時間で窓を切っていて 8/31 の試合（鈴木彩艶のヴィラ戦）が9月に入っていたので数え直した。
#         点に絡んだ人は ESPN の試合記録（得点者・アシストの記載）で1試合ずつ確かめた：
#           鎌田 1G3A（9/5 フラム戦 77分チルウェルへ／9/8 リーグ杯ミドルズブラ戦 72分に得点／9/12 イプスウィッチ戦 14分ハライリ・75分ストランド・ラーセンへ）
#           上田 3G（9/3 トゥールーズ戦 73分・途中出場／9/8 CL ベティス戦 12分／9/20 ニース戦 79分）
#           三好 2G（9/5 ディナモ・ドレスデン戦 3分・25分）／佐野海舟 2A（9/6 ハンブルク戦 19分／9/19 ボルシアMG戦 78分）
#           松木 1G1A（9/8 スウォンジー戦 78分のアシスト／9/12 ブリストル・シティ戦 82分の得点）
#         田中碧は Transfermarkt が2アシスト、ESPN が1アシスト（9/5 ブライトン戦）で食い違うので表に載せない。
#         山本天翔（409分・2A）はドルトムントの2軍（ドイツ4部）の試合なので表から外した。
#   出場時間: 森下 450分・岩田 442分（ESPN でも5試合すべて先発）、鈴木彩艶 405分（リーグ3・CL1・リーグ杯1、杯は後半から）。
#   パレス: ESPN の順位表で15位・勝点4（5試合）。9月のプレミアは3試合で5得点5失点（フラム 3-2・イプスウィッチ 2-3・リーズ 0-0）。
#   パレスの8月: ESPN（8/22 エヴァートン 2-0 パレス、8/28 パレス 1-4 シティ）。勝点4は9月の3試合ですべて（フラム戦の勝ちで3）。
#   次の試合: ESPN の日程（パレス 10/11 ホームでフォレスト）。フォレストの監督はグラスナー（英語版Wikipedia の infobox: Frankfurt 2021–23・Palace 2024–26・Forest 2026–）。パレスの監督はピエール・サージュ（同）。
#   プレミアのアシスト: FotMob（goal_assist.json）で3が最多、鎌田を含む6人。
#   反応: Yahoo!ニュースのコメント欄（25eb3763…＝アシストランキングの記事、5ded5fc5…＝イプスウィッチ戦の記事）。どちらも投稿の全文。
#   出来事: ダービーは ESPN の試合記録（23分フォーデン退場・60分ハーランド）、審判団の声明は research/20260914b_derby.yaml の出典。
#          ル・クラシックは ESPN（9/20 マルセイユ 1-2 PSG、マルセイユ17位・勝点3）。マンCは The Guardian 9/25（大半の告発で違反、クラブは潔白を主張し不服申し立ての見込み。罰は未定）。
#          件数（115件中114件）は媒体で母数が違う（115／134）ので読まない。
# 本人の言葉は置いていない（数字の回。鎌田の9月の試合後コメントは探していない）。他人の声はネットの反応3件だけ。代表戦は2行（events の 22日〜 の行）。
# 9月に扱った話題から選んだもの: 上田のリール初出場（09-05 ueda_lille_debut。日本人の節へ移した）／マンチェスター・ダービー（09-14 manchester_var）／
#   ル・クラシック（09-21 psg_om_classique）／マンCの違反認定（09-26 city_115）。
