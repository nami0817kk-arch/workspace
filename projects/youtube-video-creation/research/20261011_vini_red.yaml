  question: 髪を引っ張った一発退場は、なぜ2週間後のクラシコまで届くのか
  takeaway: 10月10日のベルナベウ、レアル・マドリードは1対0でビジャレアルに勝ったが、52分から出たヴィニシウスが退場になった。71分に決めたと思ったゴールはビデオ判定で取り消され、主審のディアス・デ・メラは一発退場を出した。主審の報告書は退場の理由を「相手の髪を引っ張った。ボールはインプレーで、二人のあいだでボールが争われていない状態で」と書いている。スペインの懲罰規程の第121条は、この種の退場を1試合から2試合とし、ボールを争う可能性がなかった場面は2試合と定める。連盟が公開したビデオ判定の音声では「暴力的行為の可能性」という言葉が主審に伝えられていた。試合後、本人はインスタグラムで「喜びは残る。チームとファンに申し訳ない」と書き、チュアメニは「審判と、あのレッドカードに何が起きているのか分からない」と話し、モウリーニョは終了から40分たっても会見室に現れなかった。クラシコまでに挟まるリーグ戦は18日のセビージャ戦ひとつだけなので、2試合なら25日のカンプ・ノウにも届く。バルセロナは8試合を終えて8勝、勝ち点24で、3位のマドリードとは6点差
short_title: ヴィニシウスが謝った夜、モウリーニョは会見室に現れなかった
