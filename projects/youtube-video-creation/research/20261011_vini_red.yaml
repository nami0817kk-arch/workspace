# 取材メモ（10/11 題材 vini_red、型は news、ラリーガ枠）。材料の控えは research/raw/20261011_vini_red_material.md。
# **本編とショートの両方を作る**（ショートは山場 reaction の節を切り出す）。
# **この回の核**：髪を引っ張った数秒が、なぜ2週間後のクラシコまで届くのか。
#   答えは**主審の報告書の一行**（「ボールが争われていない状態で」）と**懲罰規程 第121条**にある。
#   そこを③で正面から出し、④で日付と順位に落とす。
# **分の食い違い（材料 1）**：退場は ESPN の試合データが72分、**主審の報告書は73分**、AS は場面を70分、
#   RFEF のビデオ判定の音声の投稿は71分。**台本は報告書の73分を使う**（公式の文書だから）。
#   髪を引っ張った場面70分 → ゴール71分 → 判定72〜73分、の並びで矛盾しない。
# **ベリンガムの「いつでも君のそばにいる」は使わない**（材料 5-4）。ESPN・ガーディアン・marca・AS・
#   worldsoccertalk・OneFootball のどこにも無く、WebSearch も3通りで空振りした。出てきたのは
#   **読唇術のタブロイド記事だけ**なので、本人の発言として置けない。
#   代わりに**確認できたベリンガムの事実**（取り消されたゴールは彼の折り返しから）を①に置いた。
# **チュアメニは ESPN の形に1つ決めた**（材料 5-2）。ガーディアン（AFP）は文言が違い、
#   「でもいちばん大事なのは勝利だ」はガーディアンにしかない。**2つを混ぜていない。**
# **モウリーニョの言葉は会見での発言ではない**（材料 5-3）。marca が「把握した」として載せている形なので、
#   確度は**報道**。②でも「伝わっている」という言い方にして、会見で言った形にしていない。
# **本人のストーリーは使わない**（材料 5-1）。ファンのアカウントの合成を貼り直したもので、本人の言葉ではない。
# **処分はまだ出ていない**（材料 4）。「2試合に決まった」とは書かず、規程が何を定めているかだけを言う。
# **使わなかったもの**：フォイスの談話（56分に退いていて、相手側の評価）、審判解説者の評（規程のほうが直接答える）、
#   スタンドの合唱とネグレイラ（組織の話で題に答えない）、ムバッペへの口笛（別の話）。
# 数字の重なり対策：『52分』『62分』『71分』『73分』は①だけ。『1試合』『2試合』は③だけ。
#   『24』『18』『6点』『8勝』は④だけ。『40分』は②だけ。
# **読み上げにアルファベットを残さない**：VAR は「ビデオ判定」、Instagram は「インスタグラム」と書いた。
#   画面の話者バッジだけ「VAR担当の審判」のままにしてある（声の重なりを逃がすための名前）。
# **山場に板を入れた**（10/10 に5本で踏んだ「ショートが50秒ずっと同じ写真」への手当て）。
#   ②は表を行ごとに分けて highlight_row を 0→1→2→3 と動かし、**いちばん強い1行（本人の謝罪）だけ card: none**。
#   板を下ろす行には必ず `card: none` を書いた（消すだけでは前の板が引き継がれる）。
#   顔が上にある写真（01＝背番号7で叫ぶ横長、1980x780）なので、縦の画面でも板と共存できる。
# 写真は代理店のものを入れていない（材料 9）。Getty 表記のあった1枚は落とし、放送の切り出しも除いた。
#   敷くのは 02（エンブレムに口づけ、1980x1320）。**入れ替えは1回**（②のモウリーニョの行で 03_v へ。以後そのまま）。
#   **01（背番号7で叫ぶ横長）は台本では使っていない。**元が 1980x780 しか無く、
#   **ショートの縦版が 2.46倍の引き伸ばし**になって precheck の × が消えないため。サムネの案としては残してある。
#   02 は目で見ると顔がはっきり写っているが、**OpenCV が検出できない**（口元を手とユニフォームが隠すため）。
#   preview4 の「冒頭に顔が1つも見つかりません」は**この取りこぼし**で、絵は開いて確かめた。
# **1人が主役の回なのでサムネは1枚**。題はヴィニシウスの退場1点なので並べない
#   （2026-09-30「メッシのサムネはメッシだけ」と同じ筋）。
# ネットの反応は集めていない（この日の方針）。
