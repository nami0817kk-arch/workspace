sections:
- id: rev
  heading: セルティックの収入は、チャンピオンズリーグの年にどれだけ増えたのか
  tier: 報道
  telop: 収入は1億4360万ポンド。約1900万の増え
  narrator: 解説
  card: &rev_table
    type: table
    title: セルティックの収入（百万ポンド）
    columns: &rv_cols [項目, 2023-24, 2024-25]
    rows: &rv_rows
    - [試合・スタジアム, '50.0', '61.2']
    - [グッズ, '30.1', '30.1']
    - [放映・UEFA・商業など, '44.5', '52.3']
    - [収入の合計, '124.6', '143.6']
    highlight_row: 3
  say:
  - text: セルティックの最新の決算は、2025年6月までの1年分です。
    image: assets/images/20261118_finance_celtic/01_w.jpg
    card: none
  - text: 公表は、2025年9月でした。
    image: assets/images/20261118_finance_celtic/01_w.jpg
    card: none
  - text: この年、ホームの試合は29。前の年は24でした。
    image: assets/images/20261118_finance_celtic/02_w.jpg
    card: none
  - text: チャンピオンズリーグは、新しい方式で8試合。
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: 勝ち点12で、36チーム中21位でした。
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: プレーオフでは、バイエルンに、2試合合計3対2で敗れました。
    image: assets/images/20261118_finance_celtic/03_w.jpg
    card: none
  - text: 収入は、1億4360万ポンド。前の年から、約1900万の増え。
    emph: true
    card: *rev_table
  - text: 試合・スタジアムの収入は、5000万から6120万ポンドへ。
    card:
      <<: *rev_table
      highlight_row: 0
  - text: 約1120万の増え。ホームの試合が5つ増えたことが、理由に挙がっています。
    card:
      <<: *rev_table
      highlight_row: 0
  - text: 放映や、ヨーロッパの大会の分配などの収入も、約780万増えました。
    card:
      <<: *rev_table
      highlight_row: 2
  - text: グッズは、3010万ポンドで、前の年と同じでした。
    card:
      <<: *rev_table
      highlight_row: 1
  sources:
  - https://cdn.celticfc.com/assets/Celtic_plc_Annual_Report_2025.pdf
- id: cost
  heading: セルティックは、給料と選手の買い入れに、どこまで使ったのか
  tier: 報道
  telop: 人件費は約920万の増え。選手の買い入れは約2.3倍
  narrator: 解説
  card: &cost_table
    type: table
    title: セルティックの収入と費用（百万ポンド）
    columns: &ct_cols [項目, 2023-24, 2024-25]
    rows: &ct_rows
    - [収入の合計, '124.6', '143.6']
    - [人件費, '65.6', '74.8']
    - [選手の買い入れ, '16.6', '38.6']
    - [選手の償却, '11.5', '13.8']
    - [収入に占める人件費, 53%, 52%]
    highlight_row: 1
  say:
  - text: 次に、セルティックの支出です。人件費は、6560万から7476万ポンド。
    emph: true
    card: *cost_table
  - text: 約920万の増えで、決算は、クラブの歴史でいちばん高い水準と書いています。
    card: *cost_table
  - text: それでも、収入に対する人件費の比率は、約53%から約52%。
    card:
      <<: *cost_table
      highlight_row: 4
  - text: 収入も増えたので、ほぼ同じです。
    card:
      <<: *cost_table
      highlight_row: 4
  - text: 平均の従業員数は1008人。前の年は1051人でした。
    image: assets/images/20261118_finance_celtic/06_w.jpg
    card: none
  - text: 選手の買い入れは、3856万ポンド。前の年の、約2.3倍です。
    emph: true
    card:
      <<: *cost_table
      highlight_row: 2
  - text: 代理人の手数料を含めると、4260万ポンド。
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: クラブの歴史で、1シーズンの最高額です。
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: クラブの移籍金の記録も、この年に2度、更新しました。
    image: assets/images/20261118_finance_celtic/02_w.jpg
    card: none
  - text: 選手を買った代金は、契約の年数で割って、毎年の費用に入れます。これが償却です。
    image: assets/images/20261118_finance_celtic/03_w.jpg
    card: none
  - text: 償却は、1148万から1385万ポンド。約240万の増え。
    card:
      <<: *cost_table
      highlight_row: 3
  sources:
  - https://cdn.celticfc.com/assets/Celtic_plc_Annual_Report_2025.pdf
- id: profit
  main: true
  heading: 利益4569万ポンドは、どこから来て、現金はどこへ行ったのか
  tier: 報道
  telop: 利益の増えの約9割は、選手を売った利益
  narrator: 解説
  card: &profit_table
    type: table
    title: セルティックの損益（百万ポンド）
    columns: &pf_cols [項目, 2023-24, 2024-25]
    rows: &pf_rows
    - [収入, '124.6', '143.6']
    - [運営の費用, −105.4, −117.1]
    - [選手の償却, −11.5, −13.8]
    - [選手を売った利益, '+6.6', '+31.5']
    - [利息・減損など, '+3.5', '+1.5']
    - [税引き前の利益, '17.8', '45.7']
    highlight_row: 5
  say:
  - text: セルティックは、2024-25に大きな利益を出しました。
    short_only: true
    image: assets/images/20261118_finance_celtic/01_w.jpg
    card: none
  - text: その増えの中身は、選手の売却でした。
    short_only: true
    image: assets/images/20261118_finance_celtic/01_w.jpg
    card: none
  - text: 前の年の税引き前の利益は、1783万ポンドでした。
    card: *profit_table
  - text: 増えたのは、約2786万ポンドです。
    emph: true
    card: *profit_table
  - text: このうち、約2485万が、売却益の増え。約9割です。
    card:
      <<: *profit_table
      highlight_row: 3
  - text: 664万から、3149万ポンドへ。約4.7倍。
    emph: true
    card:
      <<: *profit_table
      highlight_row: 3
  - text: 売却益の理由として、決算に名前が出るのは4人。
    image: assets/images/20261118_finance_celtic/05_w.jpg
    card: none
  - text: オライリー、古橋亨梧、ジョンストン、岩田智輝です。
    image: assets/images/20261118_finance_celtic/05_w.jpg
    card: none
  - text: この年に手放した選手には、小林友希の名前も並んでいます。
    image: assets/images/20261118_finance_celtic/05_w.jpg
    card: none
  - text: ところが、現金はどうだったのか。年末の残高は、7731万ポンドです。
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: 前の年は、7723万ポンド。ほぼ、増えていません。
    emph: true
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: 主な支出は、選手の買い入れと、納税と、設備投資です。
    card: &cash_bars
      type: bars
      title: セルティックの主な支出（2024-25、百万ポンド）
      unit: 百万ポンド
      items:
      - {label: 選手の買い入れ, value: 38.6, highlight: true}
      - {label: 納税, value: 12.4}
      - {label: 設備投資, value: 10.7}
  - text: 納税は、前の年の約1.8倍でした。
    card: *cash_bars
  - text: 売った選手のお金は、まだ入っていない分もあります。
    image: assets/images/20261118_finance_celtic/03_w.jpg
    card: none
  - text: 他クラブからの未収は、4700万から6320万ポンドへ。約1620万の増えです。
    emph: true
    image: assets/images/20261118_finance_celtic/04_w.jpg
    card: none
  - text: 未収の中身に、オライリーや古橋、岩田らの移籍の残りが入っています。
    image: assets/images/20261118_finance_celtic/05_w.jpg
    card: none
