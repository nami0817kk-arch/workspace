# クラブの財政：セルティック（11/18 水、シリーズ「クラブの財政」、key: finance_celtic、型は news）。
#
# 題材の選び方：11/16 ウェストハム（収入2億2755万ポンド）の次。収益の大きいクラブから未出を探した。
#   既出：バルサ・シティ・アーセナル・レアル・PSG・バイエルン・リヴァプール・マンU・トッテナム・チェルシー・インテル・ヴィラ・ユヴェントス・アトレティコ・ミラン・ニューカッスル・ドルトムント・ナポリ・シュトゥットガルト・ベンフィカ・フランクフルト・ローマ・アヤックス・ブライトン・パレス・ボーンマス・ブレントフォード・リーズ（11/14）・ウェストハム（11/16）。
#   セルティックは収入1億4360万ポンド（決算）で、上場会社（Celtic plc）の年次報告が文字PDFで一次として読め、日本人選手の名前が決算書の本文に出る（日本との接点・ヒットの条件）。
#   外した候補：ノッティンガム・フォレスト（軸・日本との接点が弱い）、エヴァートン（女子チーム絡みで外した前例）、ウルヴス（今季2部）、レンジャーズ（日本人の接点が確かめられない）。
#
# ★日本との接点：決算書（Financial Review）に、2024-25に手放した選手として 古橋亨梧・岩田智輝・小林友希、売却益の対象として 古橋亨梧・岩田智輝、2025年夏の獲得として 山田新・稲村隼翔 の名前が出る。台本は決算に書かれた事実だけ言う（移籍先・額は決算に無いので言わない）。
# ★今季の立場：決算のあとの2025-26 の数字は出ていない。台本は決算の1年（2024-25、2025年6月まで）と、決算書に書かれた決算のあとの出来事（2025年夏の獲得・放出、2025-26 の欧州）だけ。いまの順位・成績は言わない（確かめていない）。
#
# 軸は「**CLで稼ぎ、売って、買った年。利益は4569万ポンドなのに、現金は前の年と同じ。稼いだお金はどこへ行ったのか**」。
#   ★他の財政回と軸を重ねない：11/16 ウェストハム＝売却益が消えた年の赤字、11/12 ブレントフォード＝給料の重さ、11/10 ボーンマス＝売却益が黒字に変えた（ここは「売却益が利益の増えの約9割」だが、今回の主役は『利益と現金のずれ』）。
#   ★オーナー・株主の個人名は言わない（取締役の報酬の表の名前も言わない）。
#
# **出どころ（読んだもの）**
#   ○ Celtic plc Annual Report year ended 30 June 2025（クラブ公式 cdn.celticfc.com、2025-09-19 公表、43頁の文字PDF。pypdf で本文を抽出して読んだ）
#       https://cdn.celticfc.com/assets/Celtic_plc_Annual_Report_2025.pdf
#       Chairman's Statement p.2〜3：「Revenue increased to £143.6m (2024: £124.6m) ... driven by a significant uplift in matchday income and UEFA rights distributions following a successful Champions League campaign」「Profit after tax ... £33.9m (2024: £13.4m) ... substantial gains from player trading of £31.5m (2024: £6.6m)」
#            「year-end cash remained broadly flat at £77.3m (2024: £77.2m)」「First team labour costs were the highest levels in the history of the Club」「including committed agent fees, £42.6m was invested in player acquisitions during the year, more than doubling the prior year spend, marking the highest single-season investment in the Club's history including twice breaking the Club transfer record」
#            「playing eight group stage matches, earning 12 points and finishing 21st out of 36. This led to a high-profile play-off tie against Bayern Munich, where we exited the competition by a single goal following an aggregate 3-2 defeat」
#            「winning the Scottish Premiership for the fourth consecutive season ... lifted the Premier Sports Cup ... Scottish Cup Final ... lost on penalties to Aberdeen」「29 home matches played at Celtic Park (2024: 24 games)」
#            「signing 11 players ... Shin Yamada, Ross Doohan, Benjamin Nygren, Kieran Tierney, Callum Osmand, Hayato Inamura, Michel-Ange Balikwisha, Sebastian Tounekti and Kelechi Iheanacho along with the temporary transfers of Jahmai Simpson-Pusey and Marcelo Saracchi」
#            「The registrations of Gustaf Lagerbielke, Nicolas Kühn, Adam Idah, Mitchel Frame, Marco Tilio and Hyeok-kyu Kwon were permanently transferred to other clubs」
#       Summary p.3：Group revenue +15.2% to £143.6m。Operating expenses £117.1m (+11.1%)。Gain on sale £31.5m (2024: £6.6m)。Acquisition of player registrations £38.6m (2024: £16.6m)。Profit before tax £45.7m (2024: £17.8m)。Year-end cash £77.3m (2024: £77.2m)
#       Financial Review p.7〜8：「The profit before tax of £45.7m is an increase of £27.9m from FY24. £24.9m of this increase was due to significant gains from player trading」
#            Revenue：Football and stadium operations 61.2／50.0（+11.2、home matches 29 vs 24、two additional UCL and three additional domestic cup）、Merchandise 30.1／30.1、Multimedia and other commercial 52.3／44.5（+7.8、UEFA central distributions）、計 143.6／124.6
#            Labour (74.8)／(65.6)（+9.2、14.0%）、Other operating expenses (42.3)／(39.8)、Operating expenses (117.1)／(105.4)
#            「During the financial year the Group permanently disposed of the registrations of Matt O'Riley, Kyogo Furuhashi, Mikey Johnston, Alexandro Bernabei, Tomoki Iwata, Hyeon-gyu Oh, Bosun Lawal and Yuki Kobayashi.」
#            「The gain on sale of £31.5m (2024: £6.6m) ... reflects the gains achieved on the outgoing transfers of Matt O'Riley, Kyogo Furuhashi, Mikey Johnston, Tomoki Iwata as well as a number of contingent fees」
#            「Total receivables at 30 June 2025 are £63.2m compared with £47.0m in 2024 ... including amounts due in relation to the outgoing transfers of Matt O'Riley, Kyogo Furuhashi, Alexandro Bernabei, Mikey Johnston and Tomoki Iwata」
#            「UEFA competition participation in season 2025/26 will come in the form of the Europa League after disappointingly missing out on Champions League qualification」
#            Net player trading：Amortisation (13.8)／(11.5)、Gain on sale 31.5／6.6、Net 17.7／(4.9)。Intangible assets NBV £27.9m → £45.5m
#       p.26 損益計算書（£000、2025／2024）：Revenue 143,597／124,580、Operating expenses (117,062)／(105,394)、Profit from trading before intangible asset transactions and exceptional items 26,535／19,186、Exceptional (2,005)／203、
#            Amortisation (13,845)／(11,483)、Profit on disposal of intangible assets 31,488／6,637、Operating profit 42,173／14,543、Finance income 5,082／4,726、Finance expense (1,568)／(1,444)、Profit before tax 45,687／17,825、Tax (11,753)／(4,441)、Profit 33,934／13,384
#       p.26 貸借対照表：Cash 77,310／77,228、Trade receivables（非流動）23,026／5,310、（流動）43,170／42,624
#       p.33 注9 Staff：Wages and salaries 65,850／57,814、Social security 7,798／6,703、Pension 1,115／1,078、計 74,763／65,595。Average employees 1,008／1,051（Players and football administration staff 208／198、Administration and retail staff 800／853）
#       p.34 注13：「total tax payments in the year were £12.4m (2024: £7.0m)」。p.35 注16：PPE additions 10,745（Barrowfield 7.9）。注17：Intangible Additions 38,557／16,618、Disposals (cost) (14,147)、(accumulated amortisation) (8,816)
#       p.20 Five Year Record：Revenue 143,597／124,580／119,851、Profit on disposal 31,488／6,637／14,441、League position 1／1／1、League points 92／93／99
#   ○ 2025-26 の欧州：決算の本文（Europa League）。ほかの報道は使わない
#   × 確かめられなかったもの：売った選手の移籍先・額（決算に無い）、2025-26 の決算（まだ出ていない）、現金の動き（キャッシュフロー計算書の頁は画像で読んでいない。台本は「現金は増えなかった」と、決算に書かれた支出〔買い入れ・納税・設備投資〕の額を並べるだけで、現金の増減の内訳とは言わない）、
#     デロイトの順位の一次（読めず）。どれも台本に入れない。
#
# 自分で計算した数（検算済み）
#   収入の増え：143.597−124.580＝19.017→約1900万。試合・スタジアム 61.2−50.0＝11.2→約1120万、放映・UEFA・商業 52.3−44.5＝7.8→約780万。グッズは同じ（30.1）
#   人件費：74.763−65.595＝9.168→約920万。÷収入：74.763÷143.597＝52.1%→約52%／65.595÷124.580＝52.7%→約53%
#   選手の買い入れ（取得額）：38.557÷16.618＝2.32→約2.3倍。償却：13.845−11.483＝2.362→約240万
#   利益の増え：45.687−17.825＝27.862→約2786万。売却益の増え 31.488−6.637＝24.851→約2485万。÷利益の増え 24.851÷27.862＝89.2%→約9割。売却益の倍率 31.488÷6.637＝4.74→約4.7倍
#   売却益を除いた利益：45.687−31.488＝14.199／17.825−6.637＝11.188→約1420万／約1119万、増え 3.011→約300万
#   選手の売買を除いた利益（決算の「trading before asset transactions」）：19.186→26.535
#   未収：63.2−47.0＝16.2→約1620万
#   現金：77.310／77.228（差 0.082→約8万）。納税：12.4÷7.0＝1.77→約1.8倍
#   表：2025 143.597−117.062−13.845＋31.488＋(−2.005＋5.082−1.568＝1.509)＝45.687 ✓／2024 124.580−105.394−11.483＋6.637＋(0.203＋4.726−1.444＝3.485)＝17.825 ✓
#   waterfall（税引き前の動き）：17.825＋19.017−11.668−4.570（償却の増え2.362＋減損の増え2.208）＋24.851＋0.232（利息など）＝45.687 ✓
#
# 写真：assets/images/20261118_finance_celtic/（出典は credits.json）。01〜04・06 セルティック・パーク（Commons。Vincenzo.togni CC BY-SA 4.0／edward mcmaihin・Thomas Nugent CC BY-SA 2.0）、05 古橋亨梧（Commons、Keiteay CC0。背番号8の後ろ姿）、07 前田大然（10/18 の回の再利用・台本では使わない）。
