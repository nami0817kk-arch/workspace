# W杯のあと、日本代表の顔ぶれはどこまで変わるのか（2026-09-13 の発言）
#
# **出どころは中日スポーツとスポニチ。**浦和―岡山戦（埼玉スタジアム）の
# 視察後に、囲みで話したもの。
#
# 引きは**「W杯が終わったのに、顔ぶれは変わらない」**。
# 世代交代を待っていた人ほど、この一言が刺さる。ここが山場（@main）。
#
# **「世代交代しない」と言い切らない。**本人は「これからを期待できる選手も
# 招集して」とも言っている。**両方そのまま並べて、聞く人に委ねる。**
#
# **板倉の話は深追いしない。**9/16 に出した回と同じ話になる。
# ここでは「呼ぼうと思っている」の一言だけに留める
