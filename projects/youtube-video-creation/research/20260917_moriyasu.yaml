    narrator: キャスター
    say:
      - 9月13日、埼玉スタジアムでの出来事です。
      - 浦和と岡山の試合を視察した帰りに、取材に応じました。
      - 聞かれたのは、今月末から始まる4試合に誰を呼ぶか、でした。
    official: false
