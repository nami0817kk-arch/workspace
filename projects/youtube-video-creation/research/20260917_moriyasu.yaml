  - id: said
    heading: 監督が答えたこと
    main: true
    tier: 報道
    telop: 「基本的にはW杯に選んだメンバーかなと思っている」
    narrator: 解説
    say:
      - {short_only: true, text: 森保一監督が、今月末からの4試合について話しました。}
      - 最初の一言が、これでした。
      - {voice: 森保監督, text: 基本的にはW杯に選んだメンバーかなと思っている}
      - 北中米での大会が終わって、初めての活動です。
      - それでも顔ぶれは動かさない、と受け取れる言い方でした。
      - ただ、そのあとにこう続けています。
      - {voice: 森保監督, text: ベースはあるものの、これからを期待できる選手も招集して}
      - {voice: 森保監督, text: いまのベストと未来に向けてというところも加味して}
      - {voice: 森保監督, text: チームづくりをしていきたい}
      - アジア杯に出られないと報じられている板倉滉についても、一言ありました。
      - {voice: 森保監督, text: 呼ぼうと思っている}
    official: false
    sources:
      - https://www.chunichi.co.jp/article/1310861

