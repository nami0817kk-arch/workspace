# 取材メモ（2026年10月29日）ロナウドの2008年が「史上最高のバロンドール」に（B.O.A.T. 投票）（ショートだけ・見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-29。題材の元は 20261029_topics_src.yaml の 21。「投票の主催者・方法・結果を本文で確かめる」ことが条件。
#   A Bola「Cristiano Ronaldo de 2008 eleito o melhor Bola de Ouro de sempre」（abola.pt/noticias/…2026102817561875016。requests で本文を全部読んだ）:
#     主催＝フランス・フットボール誌（France Football）。授賞式の2日後に発表。公式の賞でも「超バロンドール」でもない、と同誌自身が説明している。
#     方法＝今回は記者ではなく、同誌の読者・ユーザーが投票。バロンドールを2回以上受賞した選手のなかから、特定の1つの受賞年を選ぶ。1票1ユーロ。投票者は2027年の授賞式のチケット2枚の抽選の資格。
#     数字＝2回以上投票した人が5009人。うち 10〜26回が44人、5〜9回が300人、2〜4回が4665人（5009＝44+300+4665 を足して確かめた）。記事に「投票者の総数」は無い。
#     結果＝1位 クリスティアーノ・ロナウド2008、2位 メッシ2012（上位20位は画像の一覧を読んだ。1位から: R2008, M2012, R2017, M2023, R2016, R2014, M2015, R2013, M2011, M2009, M2019, M2021, ロナウド・ナザーリオ2002, M2010, ロナウド・ナザーリオ1997, キーガン1979, クライフ1974, プラティニ1984, ベッケンバウアー1976, ファン・バステン1988。Rはクリスティアーノ・ロナウド、Mはメッシ）。
#   フット・メルカート「Cristiano Ronaldo 2008 élu plus grand Ballon d'Or de l'histoire」（28日19:23。requests で本文を読んだ）: バロンドール70周年の記念。2007/08のマンチェスター・ユナイテッド時代が選ばれた。
#     1位R2008・2位M2012・3位R2017・4位M2023。「2人が上位12位を分け合う」。プラティニ1984は18位。順位は「主観的」と書いている。31の受賞年の全順位あり（A Bola の上位20と順が一致）。
#   自分で数えたこと: 上位12位のうちメッシ7（2012・2023・2015・2011・2009・2019・2021）、ロナウド5（2008・2017・2016・2014・2013）。2回以上投票した5009人のうち4665人＝約93%が2〜4回。
#   マルカ（marca.com/…/cristiano-ronaldo-2008-gana-b-t-mejor-balon-oro-historia.html）は requests で開けたが本文は取れず（ヘッダだけ）、AS は403。WebFetch も不可。→ 本文を読んだのは A Bola と フット・メルカートの2本。
# 言わないこと: 2008年のシーズンの得点数・タイトルの数（本文で確かめられていない）、投票の総数・得票率（記事に無い。途中経過の%は使わない）、メッシの2012年の中身、
#   10/27〜28 に作ったバロンドール授賞式の題（ケイン・ヤマル・ムバッペ・デンベレ）の中身、ロナウドの発言（無い）、B.O.A.T. が「本当の史上最高」という言い方。
# 本人の言葉: 無い → 型は X。
# 確度: 結果・方法・人数は報道（A Bola）。順位の上位4つはフット・メルカートと一致（報道2社）。数え直した数字は自分で数えたもの（背景）。
# 反応: 作らない（0件）。
# 写真: Commons が混んでいて新規に取れず、手元にある CC の3枚（本人の背番号7・顔を目で確認）。2008年当時の写真は無い。
#   01＝2026年7月 ポルトガル代表（CC BY-SA 4.0 / Bryan Berlin。10/26 の代表の回と同じ試合）、
#   05＝2026年7月 ポルトガル代表の別コマ（CC BY-SA 4.0 / Bryan Berlin、10/26 の代表の回の p01 と同じ。2022年のユナイテッドの写真は小さすぎて外した）、
