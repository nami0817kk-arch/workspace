title: 9月28日の題材（2回目）
lead: 1回目に○が2本だったので、日本人選手の話をもう一巡探した6件
note: <b>○×を付けてください。</b>1回目の○（①森保監督の会見、④伊藤洋輝）は取材を始めています。<br><br>日本代表の試合の話が続いた1週間なので、<b>クラブでの話</b>を中心に探しました。今夜の欧州の代表戦の結果は、朝に足します。中身はまだ<b>見出しだけ</b>です。
items:
- num: 1
  slot: 日本人
  head: 鈴木彩艶、アストン・ヴィラで評価が急上昇。「マルティネスの2倍以上」「プレミア最高のGKに目を向けるべき」、3年連続でゴールデングローブのラヤより上とも
  why: 'トッテナム戦でマン・オブ・ザ・マッチ。イングランドの識者や地元の記事が、前任の世界王者GKと比べてほめている、という見出し。**海外の声**の型。
    '
  src: ココカラネクスト・THE WORLD・FOOTBALL ZONE（9/26〜27）
  url: https://news.yahoo.co.jp/articles/d08f5e7ec7f03d72d638f84d889bf908316ef97d
  fmt: voices
- num: 2
  slot: 日本人
  head: 久保建英、ソシエダで4試合続けてベンチ。スペイン紙の副編集長「期待された成長を見せていない。決定力が足りず、魅せるタイプ」
  why: 'アスの副編集長ハビエル・シジェスが紙面で書いた、という記事。久保はいま代表合宿中。9/26の「ブーイング」の回とは別の話。
    '
  src: GOAL（9/26）
  url: https://news.yahoo.co.jp/articles/c3407a81a8a75cbacc5b0f3869df97299eed59d9
  fmt: voices
- num: 3
  slot: 日本人
  head: 上田綺世のフランス移籍の舞台裏。オランダ人記者「28歳、売るべきだった」「フェイエノールトのサポーターは帰りを待っている」
  why: 'オランダの記者が、上田の移籍と、三笘のブライトン説の裏側を話した、という記事。**記者の言葉**がある。
    '
  src: Number Web（9/27）
  url: https://news.yahoo.co.jp/articles/68c4cd0df6f9810696159c1d2dcb6eec364d80b0
  fmt: quote
- num: 4
  slot: 日本人
  head: ウルグアイのフォルラン監督が「凄くお気に入りだ」とほめた、意外な日本代表選手
  why: '上田でも松木でも塩貝でもない選手、という見出し。ウルグアイ戦のあとの会見。**監督の言葉**がある。記事は9/25。
    '
  src: Number Web（9/25）
  url: https://news.yahoo.co.jp/articles/306c08c14548433614e656cc964c7823fb66235b
  fmt: quote
- num: 5
  slot: 日本人
  head: 久保建英、ウルグアイ戦で揉めかけた塩貝を引き離した理由「イエローをもらうのはもったいないので」
  why: '塩貝の勝ち越し弾がVARで取り消されたあとの小競り合い、という記事。**久保の言葉**がある。1回目の①（森保監督の会見）と塩貝がかぶるので、選ぶならどちらか。
    '
  src: FOOTBALL ZONE（9/27）
  url: https://www.football-zone.net/archives/675922
  fmt: quote
- num: 6
  slot: 日本人
  head: 最年長の伊東純也が、デビューする選手に助言。8年前の自分は「5分か10分でゴールを決めて定着できた」
  why: '明日のベネズエラ戦で初出場が見込まれる選手たちへ、という前日の記事。**本人の言葉**がある。
    '
  src: ゲキサカ・日刊スポーツ（9/27）
  url: https://news.yahoo.co.jp/articles/6b55deb2c789b19dd2d87392b19b6f4bb04ccfbc
  fmt: quote
