  say:
  - text: 日本のPK戦を、蹴った側から数えてみます。2010年からは、これが5回目です。
    image: assets/images/20261002_japan_ecuador/03.jpg
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
  - text: 2010年、南アフリカでのワールドカップ。パラグアイ戦は4人中1人が外して敗退。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
      highlight_row: 0
  - text: 2011年のアジアカップ、韓国戦も1人外しましたが、3対0で勝ちました。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
      highlight_row: 1
  - text: 2015年のアジアカップは、アラブ首長国連邦に4対5で敗戦。2人が外しました。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
      highlight_row: 2
  - text: 2022年、カタールでのワールドカップ。クロアチア戦は、決めたのが4人中1人だけ。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
      highlight_row: 3
  - text: この4回で、日本のキッカーは18人。決めたのは11人で、7人が外しています。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
  - text: エクアドル戦は5人とも成功。この5回で、日本が全員決めたのは初めてです。
    card:
      type: table
      title: 日本代表のPK戦（2010年から）
      columns: [年, 相手, 結果, 日本の成功]
      rows: *h
      highlight_row: 4
  - text: しかも5人のうち4人は、試合の途中から入った選手でした。
    card:
      type: table
      title: エクアドル戦の日本のキッカー
