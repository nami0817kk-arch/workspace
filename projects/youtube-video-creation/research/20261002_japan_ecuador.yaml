# 取材メモ（10/2 題材 japan_ecuador、型は news）。材料の控え: research/raw/20261002_japan_ecuador.md
# 試合全体の回: 日本 0-0（PK5-4）エクアドル（10/1 キリン杯準決勝・日産スタジアム・65,012人）。
# 同じ日の別の回と分ける: 堂安が鈴木彩艶を「世界一のGKになる」と評した話（doan_zion）と久保の代表先発（season_kubo）。
#   **堂安の評・久保の言葉は使わない。**鈴木の「先に動く」「手渡し」、川島の2本、採点も doan_zion 側なので入れない。前日の月間MVPも入れない。
#   PK戦の歴史は doan_zion が「キーパーが止めた数」で見ているので、こちらは「キッカーが決めた数」と「途中から入った選手」で見る。
# 事実の裏:
#   スコア・PKの順と成否・シュート・支配率・CK・観客数・交代の分は JFA の試合記録（m02.pdf）で当てた。決勝の日時は JFA の日程。
#   交代の分はゲキサカ本文（後半23分）と JFA（67分）で1分ずれる。JFA に合わせる。
#   キック順の決め方は森保監督の会見（スポニチ）とゲキサカ 460143。7人目の塩貝もゲキサカ 460143（本人の話）。
#   エクアドルがW杯でドイツに勝った（2-1）のは英語版 Wikipedia の E 組と France 24。
#   PK戦5回の成否は英語版 Wikipedia の大会の試合の箱。「2010年からの5回」と言い、「史上初」とは言わない（親善試合まで一覧で確かめていない）。
#   2022 クロアチア戦の3本は止められたのか外れたのか資料で分けられないので「決めたのは1人」と言う。
# 写真: 記事の写真（代理店なし、全部開いて見た）。冒頭とサムネはサッカーキングの鈴木（金田慎平）を 16:9 に切った 01。
#   PK戦の行は鈴木がゴールへ向かう 02、勝った行から輪になる日本の選手 03（ゲキサカ）。森保監督が語る行は森保、会見の行は森保（左）＋中村俊輔（右）。
# 流れの点検（Claude が自分で読んだ。控え output/flow/20261002_japan_ecuador.md）で直したこと:
#   エクアドルのW杯の行を数字の前へ／PK戦の1人目でエクアドルの1人目が決めたことを言う／塩貝の行と W杯の準備の発言のあいだにつなぎ／
#   「セットプレー」をコーナーキックやフリーキックで説明／過去のPK戦は年と大会名で言う／言い直し（上田の後半から・途中出場4人のまとめ）を落とす／
#   ショートが題に答えるよう、山場の節の終わりに short_only で「提案したのは中村俊輔コーチ」
# 反応: Yahoo!ニュースのコメント欄から個人の投稿を3件、全文。海外の反応は0件（X が読めない。記事の断片は全文でないので使わない）。
