      - ['4', '相馬勇紀', '79分から']
      - ['5', '前田大然', '79分から']
  - text: 1人目の上田は後半の頭から、2人目の鎌田は67分から。
    card:
      type: table
      title: エクアドル戦の日本のキッカー
      columns: [順, 名前, ピッチに入った時間]
      rows: *k
      highlight_row: 1
  - text: 4人目の相馬と5人目の前田は、79分に入ったばかりでした。
    card:
      type: table
      title: エクアドル戦の日本のキッカー
      columns: [順, 名前, ピッチに入った時間]
      rows: *k
      highlight_row: 4
  - text: 90分を通して出ていたのは、3人目の伊藤洋輝だけです。
    card:
      type: table
      title: エクアドル戦の日本のキッカー
      columns: [順, 名前, ピッチに入った時間]
      rows: *k
      highlight_row: 2
  - text: コーチの案で組んだその順番が、今回は5本そろって決まりました。
  - text: ワールドカップで出番の無かったPKの準備が、15年ぶりの勝ちにつながっています。
