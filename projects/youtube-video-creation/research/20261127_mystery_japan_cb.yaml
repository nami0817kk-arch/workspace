# 取材メモ（11/27 金 15:30、シリーズ「サッカーの謎」の2本目、key: mystery_japan_cb）。情報の時点は 2026-11-22。
# 題材：日本人のセンターバックは、なぜ欧州で通用するようになったのか（題材は決定済みで渡された）。
#   取材: 2026-11-22。Wikipedia の API（wikitext）と requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。FotMob は使っていない。ブラウザの道具は使っていない。
#   1本目（mystery_japan_germany）と重ならないように：遠藤航・長谷部・28人・EU外の枠・2部の入口・2022年W杯のドイツ戦は使わない。板倉はシャルケの2部の話をせず、伊藤は移籍金と位置だけ。
# 使った数字と出どころ（確度）
#   W杯の日本代表のDF（報道・en.wikipedia「20xx FIFA World Cup squads」の所属。2026年は JFA の 2026-05-15 発表が出典として付いている）:
#     2010: DF7人（駒野・闘莉王・長友・内田・岩政・今野・中澤）全員Jリーグのクラブ。
#     2014: 欧州のクラブのDF＝内田(シャルケ)・酒井高徳(シュトゥットガルト)・長友(インテル)・酒井宏樹(ハノーファー)・吉田(サウサンプトン)。森重・今野・伊野波はJ。
#     2018: 欧州＝長友(ガラタサライ)・酒井宏樹(マルセイユ)・酒井高徳(ハンブルガーSV)・吉田(サウサンプトン)。植田・昌子・槙野・遠藤航はJ。
#     2022: 欧州のCB＝吉田(シャルケ)・板倉(ボルシアMG)・冨安(アーセナル)・伊藤(シュトゥットガルト)。谷口・山根・長友・酒井はJ。
#     2026: DF9人のうち長友(FC東京)以外の8人が欧州（JFA 公式 https://www.jfa.jp/eng/samuraiblue/news/00036338/ を 2026-11-22 に読んで、9人の所属が en.wikipedia と一致＝確定）。CB＝谷口(シント＝トロイデン)・板倉(アヤックス)・渡辺(フェイエノールト)・瀬古(ル・アーヴル)・伊藤(バイエルン)・冨安(アヤックス)・鈴木淳之介(コペンハーゲン)の7人、菅原(ブレーメン)は右SB。
#     ※センターバックとサイドバックの分け方は、自分で分けた（各選手の en.wikipedia の位置の欄。内田・長友・酒井2人・菅原はSB）。だから「0人→1→1→4→7人」は自分で数えた数（背景）。
#   最初の欧州のクラブ（en.wikipedia の経歴の欄）: 冨安 シント＝トロイデン(2018年1月、19歳)／渡辺 コルトレイク(2022)／谷口 アル・ラーヤン(カタール)のあとシント＝トロイデン(2024)／板倉 マンCと契約→フローニンゲンへ貸し出し(2019)／瀬古 グラスホッパー(2022)／鈴木 コペンハーゲン(2025)／伊藤 シュトゥットガルト(2021)。→ 7人中6人が5大リーグの外（自分で数えた）。
#   吉田麻也（en.wikipedia）: 2009年12月にVVVフェンロ移籍の発表（2010年にオランダへ）、2012-08-30 サウサンプトン（移籍金は "thought to be in the region of £3 million"）、2017-04-29 ハル戦でプレミア100試合（"the first Japanese player to reach the milestone"）、サウサンプトン 2012–2020。
#   冨安（en.wikipedia）: ボローニャ 2019（€9m の報道）、2021-08-31 アーセナル（"variously reported as £15.5 million, £16 million and £17 million"）。位置の欄 CB・SB。いまはクリスタル・パレス（2026–）。
#   ディ・ヴァイオの言葉: Calciomercato 2020-05-27（Francesco Guerrieri）。肩書は capo scouting del Bologna。原文 "La prima relazione è stata fatta ad ottobre, un mese dopo io e Mattia eravamo già in Belgio. L'abbiamo seguito per tutto il campionato, visionandolo 4/5 volte dal vivo. Ci ha impressionato da subito perché è molto bravo con i piedi e si sa adattare in tutti i ruoli della difesa." を訳した（「io e Mattia」の名は省いた）。
#   町田浩樹（en.wikipedia）: ユニオン・サンジロワーズへ2022年1月に貸し出し→完全移籍、2024-05-09 ベルギー杯決勝でアントワープに1-0の唯一の得点（"first title in competition after 110 years"）、2025-06-25 ホッフェンハイム。
#   町田の言葉: ゲキサカ 2026-11-11（竹内達也）の原文のまま（20261112_machida_brazil_words の取材メモで読んだもの）。
#   高井幸大（en.wikipedia）: 2025-07-08 トッテナム、2026-01-02 ボルシアMGへ貸し出し、2026-09-01 シント＝トロイデンへ貸し出し。
#   伊藤洋輝（en.wikipedia）: 2024-06-13 バイエルン、"triggered his release clause of an estimated €30 million"。位置の欄 CB・LB・MF。
#   板倉（en.wikipedia）: 位置の欄 CB・守備的MF。鈴木淳之介: CB・守備的MF。谷口・渡辺・瀬古: CB だけ。→ 7人中4人（自分で数えた）。
#   自分で計算: 1600万÷300万＝5.33（ポンドどうし。伊藤はユーロなので比べない）。
# 確かめきれなかったこと: 冨安の移籍金は報道で幅がある（1550万〜1700万ポンド）→ 語りで幅を言う。伊藤の額は「推定」。吉田のVVVのデビューは2010年10月（移籍の発表は2009年12月）→「2010年に移りました」とだけ言う。
# 言わないこと: 身長（2010年のCBも185cm前後で、差として言えない）／2026年W杯の主将（出典で食い違う）／高井の移籍金（一次で確かめていない）。
# 写真: 吉田＝Commons「Yoshida.jpg」CC BY-SA 2.0（@cfcunofficial、2017、サウサンプトン）／冨安＝Commons Hans Reefman CC BY-SA 4.0（アヤックス 2026）／板倉＝Commons Mtjonenfa CC BY-SA 4.0（アヤックス）／町田＝Commons Sidney.Cortez CC BY-SA 4.0（ユニオン 2024）／伊藤＝Commons Jeollo von VfB-exklusiv.de CC BY 3.0（シュトゥットガルト）。2枚並べは tools/pairphoto.py。
