      - その暫定監督は、先発した板倉滉について試合前にこう話していました。
      - {voice: 暫定監督, text: 彼は良い選手であり、自身のクオリティーを毎回トレーニングで証明している}
      - {voice: 暫定監督, text: 本人は理解していることだが、彼のポテンシャルを踏まえると、今、ピッチ上で見せているものは、以前の彼が示していたプレーのレベルには達していない}
      - {voice: 暫定監督, text: 我々にとって、彼は非常に重要な選手であることに変わりはない}
