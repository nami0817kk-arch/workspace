  say:
  - text: お別れの夜には、2022年のW杯の優勝メンバーが、家族と招かれています。
    image: assets/images/20260930b_messi_farewell/01_w.jpg
  - ところが9月29日、ローマがディバラとモリーナの2人を行かせないと発表しました。
  - 2人とも試合に出る予定はなく、招かれていたのはお別れの場でした。
  - 理由は、大陸をまたぐ長い移動と、すぐ後に控えるクラブの試合です。
  - ローマは10月11日にリーグ戦でコモと、その後はチャンピオンズリーグでレアル・マドリードと戦います。声明はこう結ばれています。
  - voice: ASローマ
    text: ASローマは、メッシと彼の並外れた経歴に、
  - voice: ASローマ
    text: 最大の敬意を持っている。
    cont: true
  - voice: ASローマ
    text: メッシとアルゼンチンサッカー協会にとって、
    cont: true
  - voice: ASローマ
    text: 特別な夜になることを願っている
    cont: true
