  say:
  - text: アルゼンチン代表を引退するメッシ。最後の試合は10月6日です。
    short_only: true
  - text: お別れ試合の前にも、アルゼンチンは2試合を戦います。その間の10番を9月29日の会見で聞かれた、スカローニ監督の答えです。
    image: assets/images/20260930b_pair_scaloni/01.jpg
  - voice: スカローニ監督
    text: この期間の試合で、10番を誰かに渡す義務はない。
  - voice: スカローニ監督
    text: だからレオの試合までは、誰にも渡さない。
    cont: true
  - voice: スカローニ監督
    text: 誰に渡すかは、そのあとで考える
    cont: true
  - text: お別れ試合のあと、W杯予選での10番については、こう続けました。
    image: assets/images/20260930b_pair_scaloni/01.jpg
