  - voice: スカローニ監督
    text: 予選では、背番号は固定されない。
  - voice: スカローニ監督
    text: でも、あの番号を背負う素晴らしさを考えれば、
    cont: true
  - voice: スカローニ監督
    text: 1人に持ってもらうつもりだ。
    cont: true
  - voice: スカローニ監督
    text: 今のところ、まだ決めていない
    cont: true
  - text: 9月30日はボリビア戦、10月3日はブルキナファソ戦。どちらも10番は空き番のままです。
