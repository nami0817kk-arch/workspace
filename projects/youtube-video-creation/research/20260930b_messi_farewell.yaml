# 取材メモ（9/30 題材③ messi_farewell、型は quote）。
# 事実の裏:
#   お別れ試合: 10月6日（火）20時（現地）、ブエノスアイレスのモヌメンタル、相手はベナン。
#     発表はアルゼンチンサッカー協会（AFA）のタピア会長の動画（SNS、9/15。La Nación 9/15）。
#     原文 "invitar al mejor jugador del mundo, al emblema de nuestra selección, a nuestro capitán, Lionel Andrés Messi,
#     para que pueda tener la despedida que realmente se merece el día 6 de octubre, acá, en la Argentina"。
#     2022年W杯の優勝メンバーと家族を招く（La Nación・Expreso）。3試合の日程と時刻は AFA が 9/28 に発表（Expreso）:
#     9/30 ボリビア（コルドバ、ケンペス）21時／10/3 ブルキナファソ（モヌメンタル）21時／10/6 ベナン（モヌメンタル）20時。
#   代表引退の発表: 8月31日（英語版Wikipedia・La Nación）。メッシは最初の2試合には出ない（ESPN）。
#   10番: **アルゼンチン協会の公式発表ではなく、スカローニ監督の会見での発言**（9/29、ボリビア戦の前日。Infobae・ESPN）。
#     原文（Infobae）"En estos partidos no tenemos obligación de dar la 10 así que hasta que sea el partido de Leo
#     no se la daremos a nadie y después veremos a quién se la daremos."
#     "Por Eliminatorias no queda fija, pero la idea es que se la quede uno con todo lo lindo que es llevarla. Por ahora no hemos definido"
#     ロマーノは "OFFICIAL: Argentina confirm" と書いたが、台本では「公式発表」と言わない。
#     次の10番が誰かは推測で言わない（報道にはニコ・パス、マスタントゥオーノの名があるが入れない）。
#   監督の契約は12月31日まで（ESPN。スカローニ「12月31日まではここにいる」）。延長は報道の段階なので言わない。
#   ローマの声明（9/29、クラブ公式サイト。football-italia が全文を引用）:
#     "will not attend the event being held in Argentina for the match between Argentina and Benin on 6 October"
#     理由 "for sporting and logistical reasons, taking into account the length of the intercontinental journey and
#     the proximity of the Club's upcoming competitive fixtures." 10/11 コモ戦、その後CLのレアル・マドリード戦。
#     結び "AS Roma has the utmost respect for Lionel Messi and his extraordinary career and wishes him and the
#     Argentine Football Association a very special evening."
#     football-italia「2人とも試合そのものには関わらない（ディバラは招集外）」。
#     **モリーナの「7試合の出場停止」は football-italia の1社だけで、確かめられなかったので使わない。**
#   代表の数字（英語版Wikipedia、Lionel Messi／Argentina national football team records and statistics。2026-09-28 更新）:
#     207試合125得点（どちらも歴代1位）。出場2位マスチェラーノ147試合。得点2位バティストゥータ（54 か 56、ページで違う
#     ので数は言わず「2位の2倍超」とだけ言う。どちらでも2倍を超える）。W杯21得点（ESPN。2026年大会で8得点4アシスト）。
#     主要タイトル: 2022年W杯・コパ・アメリカ2021/2024・フィナリッシマ2022（ほかに2008年五輪金・2005年U-20W杯）。
#     2026年W杯は決勝でスペインに延長0-1。お別れ試合は208試合目。
# 反応: 日本の個人の投稿3件（下の節に出どころ）。
#   海外の個人の反応は、Bluesky の検索（スペイン語・英語、9/29 以降）・Yahoo!リアルタイム検索（X）・football-italia の
#   コメント欄を当たったが、題に沿う個人の投稿が取れなかった（出てくるのは報道・転載アカウントだけ。返信は罵り言葉と一言）。
#   ロマーノ・AlbicelesteTalk・SoccerKingJP・romunuki（ニュースの転載）は入れていない。
# 写真: 記事の写真は ESPN が Getty（NurPhoto via Getty）、Infobae が AP だったので取り込まない。
#   Commons（Bryan Berlin、CC BY-SA 4.0）の2枚: メッシ＝2026年W杯エジプト戦 7/7 の -226（背中の10番と横顔）、
#   スカローニ＝同W杯決勝スペイン戦 7/19 の -239。どちらも前の日までに使っていない。監督が語る行は2人を並べた1枚（pair_scaloni）。
