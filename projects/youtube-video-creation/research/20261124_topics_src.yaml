title: 11月24日のショート題材
lead: 海外フィード約430件から10件をClaudeが選びました（日本人6件・海外4件）。取材で前提が崩れたら次点に差し替えます。
note: 火曜（24日）の朝7時に集めました。見出しからの選定。次点：上田綺世のサポーター採点、宮代大聖の4点目（2部のため外す見込み）、ヴィルツのマンU戦の一撃、エンドリッキの負傷。外した：堂安律のユニフォームの扱い（SNSの声だけで本人の言葉なし・小さく見せる話）、坂元達裕のパレス戦（11/22 に作成済み）、ケイン「万全で戻る」（11/22 と同じ話）。
