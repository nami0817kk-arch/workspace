- id: history
  heading: 4年前の収入は、いくらだったのか
  tier: 報道
  telop: 2020-21は9000万ユーロ。4年で約3.3倍
  narrator: 解説
  card: &hist_line
    type: line
    title: シュツットガルトの収入（デロイト、百万ユーロ）
    x: [2020-21, 2021-22, 2022-23, 2023-24, 2024-25]
    series:
    - [収入, [90, 132, 147, 165, 297]]
    - [放映権, [49, 48, 53, 51, 121]]
    unit: 百万ユーロ
    focus: 収入
    highlight: 2024-25
  say:
  - text: もう少し、さかのぼります。
    image: assets/images/20261027_finance_stuttgart/03_w.jpg
    card: none
  - text: 2020年から21年のシーズン、シュツットガルトの収入は9000万ユーロ。
    card:
      <<: *hist_line
      highlight: 2020-21
  - text: 試合日の収入は、300万ユーロ。観客を、ほとんど入れられなかった時期です。
    card:
      <<: *hist_line
      highlight: 2020-21
  - text: そこから、1億3200万、1億4700万、1億6500万と、少しずつ伸びました。
    card:
      <<: *hist_line
      highlight: 2023-24
  - text: 2024-25シーズンには、2億9700万ユーロへ。4年で約3.3倍です。
    emph: true
    card: *hist_line
  - text: 放映権の線は、4年のあいだ5000万ユーロ前後で、ほとんど動いていませんでした。
    image: assets/images/20261027_finance_stuttgart/04_w.jpg
    card: none
  sources:
  - https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
  - https://e.infogram.com/_/fgWl5rYPPa4Tc2ZPewVF
- id: pnl
  heading: クラブの決算では、利益は残ったのか
  tier: 報道
  telop: クラブの決算は2024年に黒字1540万、2025年に黒字2250万ユーロ
  narrator: 解説
  card: &pnl_table
    type: table
    title: クラブの決算（暦年、選手の売却を含む、百万ユーロ）
    columns: [年, 売上, 損益]
    rows:
    - [2023年, '217.9', '+0.7']
    - [2024年, '299.8', '+15.4']
    - [2025年, '383.6', '+22.5']
    highlight_row: 1
  say:
  - text: では、シュツットガルトの手元に、利益は残ったのか。
    image: assets/images/20261027_finance_stuttgart/06_w.jpg
    card: none
  - text: クラブの会社は、1月から12月で決算を出します。数には、移籍で得たお金も入ります。
    card: none
  - text: 2023年は、売上2億1790万ユーロで、黒字は70万ユーロ。
    card:
      <<: *pnl_table
      highlight_row: 0
  - text: 2024年は、売上2億9980万、黒字1540万ユーロ。
    emph: true
    card: *pnl_table
  - text: 売上も黒字も、その時点でのクラブの過去最高でした。
    image: assets/images/20261027_finance_stuttgart/03_w.jpg
    card: none
  - text: 2025年は、売上3億8360万、黒字2250万ユーロです。
    card:
      <<: *pnl_table
      highlight_row: 2
  - text: それでも、社長のアレクサンダー・ヴェーレは、2025年の春に、こう話しています。
    image: assets/images/20261027_finance_stuttgart/01_w.jpg
    card: &wehrle_doc
      type: document
      label: ヴェーレ社長（2025年4月の会員総会、クラブ公式の記事から訳）
      paragraphs:
      - 私たちの金庫が、ふくらんでいるわけではないことも、はっきりしている。
      - スタジアムの借り入れを、返している途中だ。これはいまも、重い責任だ。
      highlight: [ふくらんでいるわけではない, 借り入れを、返している途中]
  - text: 記録が続いても、スタジアムの借り入れを返す途中だ、という説明です。
    card: *wehrle_doc
  sources:
  - https://www.vfb.de/en/vfb/latest/news/club/2024/finanzbericht-ag-mgv-2024-/
  - https://www.vfb.de/en/vfb/latest/news/club/2025/vfb-mit-rekordertrag-und-rekordgewinn/
  - https://www.schwaebische.de/regional/baden-wuerttemberg/vfb-vermeldet-bestmarken-wohlgemuth-zukunft-bald-geklaert-4744786
- id: view
  viewpoint: true
  heading: 見立て・79%の伸びは、半分が放映権、残りは試合日と商業
  tier: 背景
  telop: 増えた分の約53%が放映権。それでもドルトムントの約56%
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（2023-24から2024-25）
    columns: [比べ, 答え]
    rows:
    - [増えた収入のうち放映権, 約53%]
    - [いちばん小さい伸び（商業）, 1.4倍]
    - [12位ドルトムントとの比べ, 約56%]
    highlight_row: 0
  say:
  - text: ここからは見立てです。デロイトの内訳を、自分で割ってみます。
    image: assets/images/20261027_finance_stuttgart/02_w.jpg
    card: none
  - text: 1年で増えた収入のうち、放映権の分が、約53%です。
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 残りの半分は、試合日と商業。3つの柱が、どれも1.4倍以上に伸びました。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1
    card:
      <<: *view_table
      highlight_row: 1
  - text: ただ、12位のドルトムントの収入は、5億3130万ユーロ。
    card:
      <<: *view_table
      highlight_row: 2
  - text: シュツットガルトの収入は、その約56%。差は、2億3500万ユーロあります。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。
    image: assets/images/20261027_finance_stuttgart/04_w.jpg
    card: none
  - text: 79%の伸びの、半分は放映権でした。
    emph: true
    card: none
  - text: もう半分は、試合の日の売上と、スポンサーやグッズの伸びです。
    card: none
  - text: 2025年から26年は、カップ戦の優勝で、ヨーロッパリーグに出たシーズン。
    image: assets/images/20261027_finance_stuttgart/03_w.jpg
    card: none
  - text: その数字が載る、デロイトの次の一覧は、例年1月に出ます。
    card: none
  - text: そして今季、シュツットガルトは、チャンピオンズリーグに戻っています。
    card: none
  sources:
