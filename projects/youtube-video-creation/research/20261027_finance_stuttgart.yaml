#   ○ 英語版 Wikipedia「2024–25 VfB Stuttgart season」：Bundesliga 9th、DFB-Pokal Winners（2025-05-24 決勝でビーレフェルトに4対2）、UEFA Champions League League phase（8試合 3勝1分4敗）、
#       「earning qualification to the 2025–26 UEFA Europa League」、Average home league attendance 59,265
#   ○ 英語版 Wikipedia「2026–27 VfB Stuttgart season」：Bundesliga（15th、10/26 時点）、DFB-Pokal、UEFA Champions League League phase
#   × 確かめられなかったもの：人件費（デロイトは n/d）、2024-25 シーズンでのクラブの損益（クラブは暦年）、2025年の売上の内訳、借入の残り、
