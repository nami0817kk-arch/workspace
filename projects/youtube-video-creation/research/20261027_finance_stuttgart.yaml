#       「Ranked 18th ... it marks VfB’s return to the list for the first time since 2009/10」「revenue of €296.3 million, a 79 percent increase on the previous campaign」
#       「driven primarily by ... participation in the 2024/25 UEFA Champions League, winning the DFB Cup, and securing a runners-up finish in the 2023/24 Bundesliga season」
#       ヴェーレ社長（CEO）「Our return to the Football Money League is a strong signal for us and the result of a collective effort. It shows just how much VfB have gained in profile, appeal and stability in recent years, both domestically and internationally.」
#       「VfB are one of three Bundesliga clubs in the latest top 20」
#   ○ クラブ公式（vfb.de、2025-04-05「VfB post record revenue and profit」）
