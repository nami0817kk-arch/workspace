#       ヴェーレ社長「It’s also clear that we’re still a long way from achieving bulging accounts. We’re in the process of repaying our stadium loans – a responsibility that remains a challenging one.」
#   ○ クラブ公式（vfb.de、2024-07「finanzbericht-ag-mgv-2024」）
#       https://www.vfb.de/en/vfb/latest/news/club/2024/finanzbericht-ag-mgv-2024-/
#       「record revenues, of €217.9 million in 2023」「record expenditure of €217.2 million」「we were redeveloping the MHP Arena throughout the 2023 financial year. Half of the revenues have come from media and transfer dealings」
#       （2023年の黒字70万ユーロ＝217.9−217.2。同じ記事に「slight surplus of €700,000」とあると検索結果の要約が引いたが、本文の取得範囲では見ていない → 引き算の 70万だけ使う）
#   ○ 2025年の決算（2026-07-26 の会員総会。dpa の記事。確度は報道）
#       https://www.schwaebische.de/regional/baden-wuerttemberg/vfb-vermeldet-bestmarken-wohlgemuth-zukunft-bald-geklaert-4744786（Veröffentlicht 26.07.2026）
#       「Die VfB Stuttgart 1893 AG erzielte im Geschäftsjahr 2025 einen Gesamtertrag von 383,6 Millionen Euro und einen Gewinn nach Steuern von 22,5 Millionen Euro. Das Eigenkapital stieg bis zum 31. Dezember 2025 auf 83,4 Millionen Euro」
#       「verkaufte mit 156.500 Trikots so viele wie nie zuvor」「höchsten Zuschauerschnitt seiner Geschichte」
