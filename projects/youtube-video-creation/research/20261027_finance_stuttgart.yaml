# クラブの財政：VfBシュツットガルト（10/27 火、シリーズ「クラブの財政」、key: finance_stuttgart、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブ。
#   1〜17位（レアル・バルサ・バイエルン・PSG・リヴァプール・シティ・アーセナル・マンU・トッテナム・チェルシー・インテル・ドルトムント・アトレティコ・ヴィラ・ミラン・ユヴェントス・ニューカッスル）は既出。
#   18位がシュツットガルト（scripts/・research/posted.json・research/covered.yaml に finance_stuttgart は無い）。19位ベンフィカ、20位ウェストハム（今季2部）。
#   ★10/25 にクラブ紹介（bd_stuttgart：16位の翌年に2位・日本人8人・1989年のUEFA杯決勝・語る3人・監督・登録選手）を出している。
#     中身は使わない（勝ち点33→73、日本人選手、1989年、選手名は出さない）。こちらはお金の数字だけで組む。2位の季は「チャンピオンズリーグに出た理由」として1行だけ。
#   ★今季も1部：英語版 Wikipedia「2026–27 VfB Stuttgart season」「the club's seventh consecutive campaign in the Bundesliga」「participating in the DFB-Pokal and the UEFA Champions League」（10/26 時点でリーグ15位）。
#
# 軸は「**デロイトの上位20で、1年の伸び率がいちばん大きい（+79%）。1億3080万ユーロの増えは、どこから来たのか**」。
#   答え：増えた分の約53%が放映権（5100万→1億2100万、約2.4倍。チャンピオンズリーグに出た季）。試合日も約1.9倍（CLのホーム戦と、改修したスタジアムのもてなしの席）、商業も約1.4倍で、3つとも伸びた。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差／インテル＝10位との差／ヴィラ＝放映権の割合が最高／ユヴェントス＝放映権の特需と商業の穴／
#     アトレティコ＝増えた収入の約85%が商業／ミラン＝欧州なしの年の赤字／ニューカッスル＝買収後はじめての黒字／ドルトムント＝半期の黒字が通年で赤字／ナポリ＝優勝の年にランキングから消えた）は繰り返さない。
#     こちらは「伸び率が上位20でいちばん」と「3つの柱が全部伸びた中身」を軸にする。
#   ★日本との接点：財政の数字には無い（日本人選手は bd_stuttgart で扱った）。無理に入れない（10/6 の決定）。
#   ★選手個人の名前・移籍金の額・給料は出さない（2025年の大きな売却の選手名も言わない）。監督の話はしない。女子の話はしない。「経営が危ない」「安泰」と断定しない。
#   ★アルファベット（UEFA・AG・MHP）は読み上げに出さない。スタジアムは「本拠地のスタジアム」と言う。
#
# **決算期**：クラブの会社（VfB Stuttgart 1893 AG）は1月〜12月の暦年で決算（クラブ公式「in the 2024 calendar year」）。デロイトはシーズン（2024-25）で並べ直した数。2つは線の引き方が違うので、台本では並べて足し引きしない。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com UK、2026-10-26 に requests で本文を取得）
#       https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
#       「18. VFB Stuttgart」「Also reappearing in the Money League for the first time in over a decade (2009/10) is VfB Stuttgart, which reported an almost 90% increase in matchday revenue to €70m (2023/24: €37m).
#        This was driven largely by competing in the UCL and from additional hospitality revenue following the renovation of the MHP Arena.」
#       「Revenue excludes player/coach transfer fees」（作り方の注記。10/26 ナポリ回の取材で同じページから控え）
#     ページ内の図（e.infogram.com、requests で取得。2026-10-26）
#       シュツットガルト https://e.infogram.com/_/fgWl5rYPPa4Tc2ZPewVF ：「2025 Revenue €296.3m (2024: €165.5m)」「Change on previous year +79% (+€130.8m)」「DFML position 18」「Bundesliga 9th」「UEFA Champions League Group stage」
#         「REVENUE 2021-2025 (€m)」の表（Matchday／Broadcast／Commercial）：2021 3/49/38、2022 25/48/59、2023 28/53/66、2024 37/51/77、2025 70/121/106。Wages は n/d。
#       上位20の伸び率（各クラブの図、同じ日に取得）：ヴィラ +45%（€450.2m、2024: €310.2m）、インテル +37%（€537.5m、2024: €391m）、バルサ +27%、ベンフィカ +27%、リヴァプール +17%、アーセナル +15%、
#         ユヴェントス +13%、バイエルン +12%、レアル +11%、アトレティコ +11%、トッテナム +9%、チェルシー +7%、ニューカッスル +7%、PSG +4%、ドルトムント +3%（€531.3m）、ミラン +3%、マンU +3%、シティ −1%、ウェストハム −14%。
#         → **+79% は上位20でいちばん大きい伸び率**（2番目ヴィラ +45%）。★伸びた額ではインテル +1億4650万がシュツットガルト +1億3080万より大きい → 「額でいちばん」とは言わない。
#   ○ クラブ公式（vfb.de、2026-01-24「VfB Stuttgart back in the Football Money League」、requests で本文）
