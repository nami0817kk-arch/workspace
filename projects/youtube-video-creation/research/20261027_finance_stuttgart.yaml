  - text: グッズの売上は、1000万から、1700万ユーロに伸びています。
    emph: true
    card:
      <<: *cm_stats
      focus: 1
  - text: 2025年には、ユニフォームが15万6500枚売れました。クラブの記録です。
    card:
      <<: *cm_stats
      focus: 2
