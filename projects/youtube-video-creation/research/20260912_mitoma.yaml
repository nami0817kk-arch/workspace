# **確度は 未確認。**元は TEAMTALK の「情報筋によると」で、
# クラブも本人も何も言っていない。**「退団が決まった」とは書かない。**
# フットボールトライブ（EPL Index の引用）とサッカーダイジェスト（TEAMTALK の引用）と
# GOAL を読んだ。3本とも出どころは英メディアの情報筋。
#
# 引きは**「なぜ1月なのか」**。退団するかどうかより、
# **契約が残り半年になると何が変わるのか**という仕組みのほうが中身がある。
# ここが山場（@main）。
#
# **ヒュルツェラー監督の言葉は3月のもの。**いまの発言ではないと必ず言う。
# いま何か言ったかのように置かない。
#
# **負傷の程度はこちらで診断しない。**2025年5月のハムストリングで手術、
# W杯を欠場、今季まだ実戦復帰していない ── 報道に書かれている以上のことは書かない。
#
# 反応は入れない。読める形のスレが見つからなかった
