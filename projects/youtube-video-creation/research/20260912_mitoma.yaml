  - id: january
    heading: 契約が残り半年になると、何が変わるのか
    main: true
    tier: 背景
    telop: 1月が分かれ目になる理由
    narrator: 解説
    # **ここが山場。**移籍するかどうかではなく、なぜ1月なのかを説明する。
    # 決まりそのものは FIFA の規程で、報道とは別の確かさがある
    card:
      type: bullets
      title: ブライトンが選ばされる3つ
      items:
        - "いま延長にサインしてもらう"
        - "1月に、下がった移籍金で売る"
        - "来年の夏に、ただで失う"
    say:
      - ここで、日付の意味を説明します。
      - 契約の残りが半年を切ると、選手は国外のクラブと自由に話を進められるようになります。
      - 2027年6月満了なら、その半年前は2027年1月です。
      - つまり、ブライトンが移籍金を受け取れる最後の機会が、来年の1月になります。
      - 逆に言えば、そこを過ぎると、クラブは1ポンドも受け取れません。
      - {voice: EPL Index, text: 契約満了まで残り6カ月となる1月に移籍金を下げて売却するか、あるいは来2027年夏に無償で退団させるという、さらに大きな痛手を伴う選択肢を検討せざるを得なくなるかもしれない}
      - ブライトンは、有望な選手を高い値段で売ってきたクラブです。
      - その売り方ができなくなる、ということです。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/11/359137/
      - https://www.soccerdigestweb.com/news/detail/id=196908

  - id: body
    heading: 体の状態はどうなっているか
    tier: 報道
    telop: 2025年5月から実戦に戻っていない
    narrator: キャスター
    say:
      - もうひとつ、交渉が止まっている事情があります。
      - 三笘は2025年5月にハムストリングを痛め、手術を受けました。
      - ワールドカップを欠場し、今シーズンもまだ実戦に戻っていません。
      - クラブ側は、コンディションが戻ってから交渉が進むことを期待していると伝えられています。
      - 監督のヒュルツェラーは、今年3月の時点でこう話していました。
      - {voice: ヒュルツェラー監督, text: 彼はブライトンのために全力を尽くしたいと思っている}
      - ただし、これは半年前の言葉です。そのあとに交渉が止まりました。
    official: false
    sources:
      - https://news.yahoo.co.jp/articles/d2976df05d7b1a8dba94fccece12f6d264da6ecf
      - https://www.soccerdigestweb.com/news/detail/id=196908
