# クラブの財政：ポルト（11/26 木、シリーズ「クラブの財政」、key: finance_porto、型は news）。
# 題材：2025-26（2026年6月期）の報告書が 2026-10-08 に公表。11/24 のスポルティング（黒字・社債）と対にして、「売却益があっても赤字・資本マイナス」。ポルトガル1部。既出無し（scripts に sano_psv_porto はあるが財政ではない）。
# ★確かめられなかったこと（重要）：クラブの報告書・CMVM の提出文書の本文は読めなかった（fcporto.pt の投資家ページは動的で PDF のURLが取れず、CMVM も取れず）。
#   数字は A Bola（2026-10-08）・RTP/Lusa・Flashscore が一致して伝える連結の数字。最終 −21.1（前 +39.2）／親会社帰属 −26.3／売買を除く収入 150.3（前 149.5）・費用 180.0（前 147.1）／選手の売買の結果 55.9／子会社の売却益 23.96（ポルト・セグーロ 9.2）／
#   資本 −29.67（前 −10.46）・総資産 523・負債 552.7／入場18.1(+33%)・グッズ14.5(+31%)・法人席11.5・広告+8%・UEFA賞金+39%／純金融債務 −29（前年6月比）／前半の人件費 51.256（前年同期 38.2、+34%、A Bola 2026-02-18、契約解除の補償 5.5）。
#   ★未解決の食い違い：A Bola は「選手の売買などを除く営業の結果は +2.6」と書き、RTP は「売買を除く収入−費用＝−29.7」「連結の営業結果 +2.63」と書く。台本は RTP の −29.7（収入150.3−費用180.0 で検算が合う）だけを使い、+2.63 は使わない。
#   ★費用の内訳（通年の人件費・償却・金融費用）が取れていないので、「売買の利益と売却益を足してなぜ最終が赤字か」の中身は台本で言わない（見立ては収入と費用の増えの比べだけ）。
#   台本は「報道」の確度。公開前に CMVM／クラブの Relatório e Contas 2025/26 で突き合わせることを勧める。
# ★使わなかったもの：選手団の市場価値（出どころ不明）、チャンピオンズリーグ不在の影響（記事の文が不明瞭）、クラブワールドカップの額（逆算になる）、2026年夏の買い入れ（記事で年が食い違う）。
# ★言わないこと：会長・個人名、女子チーム、賭け。日本との接点：無し。
# 自分で計算した数（検算済み）
#   費用÷収入 180.0÷150.3=1.198／費用の増え 180.0−147.1=32.9／収入の増え 150.3−149.5=0.8／費用の増率 32.9÷147.1=22.4%
#   資本の悪化 −29.67−(−10.46)=−19.21／負債÷総資産 552.7÷523=1.057／資産−負債 523−552.7=−29.7 ✓（資本と一致）
# 写真：Wikimedia Commons（Estádio do Dragão の壁面のドラゴン、スタジアムの遠景。出典は credits.json）。01・02 は壁面の切り出しで人は写らない。
