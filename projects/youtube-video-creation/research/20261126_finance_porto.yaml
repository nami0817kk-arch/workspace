  takeaway: ポルトの2025-26の決算（2026年6月まで、報道による）は、連結の最終が2110万ユーロの赤字（前の年は3920万の黒字）。選手の売買の利益は5590万、子会社の売却益は約2400万あったが、売買を除く収入1億5030万に対し費用は1億8000万ユーロで、収入を費用が約1.2倍上回った。資本はマイナス2967万ユーロ（前の年はマイナス1046万）。情報は11月13日時点。
  short_title: ポルト、売却益があっても赤字。資本はマイナスに
