# 取材メモ（2026年11月11日）坂元達裕、約5年半ぶりの日本代表。初練習のあとに本人が語った「誰にも負けない」武器（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-11。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: サッカーキング 2026-11-10（取材・文 三島大輔）「坂元達裕が約5年半ぶり日本代表復帰「定着できるように」　“プレミア仕込み”のドリブルとハードワークで勝負「誰にも負けない自信がある」」（全文）
#   https://www.soccer-king.jp/news/japan/national/20261110/2226413.html
# 出典で確かめたこと:
#   ・日本代表への招集は2021年6月以来、約5年半ぶり。10日の初練習を終えた坂元の言葉（サッカーキング）。
#   ・経歴（サッカーキング）: 2019年にモンテディオ山形に加入、プロ初年度からリーグ戦全試合に出場。2020年にセレッソ大阪へ。2021年に海を渡り、ベルギーのオーステンデ、現在もプレーするイングランドのコヴェントリー。
#       昨季のチャンピオンシップ（イングランド2部）で7得点3アシスト、コヴェントリーの25年ぶりのプレミアリーグ昇格の原動力。30歳の今季プレミアデビュー、第9節サンダーランド戦で初ゴール（この初ゴールは 20261104_sakamoto_pl_first_goal で扱った。今回は触れない）。
#   ・布陣（サッカーキング）: 最後に出場した2021年6月のアジア2次予選時の基本布陣は4-2-3-1、坂元は2列目の右サイド。現在は3-4-2-1が基本で、同じ左利きアタッカーの堂安律と久保建英が右サイドで共存する形が定着している。
#   ・坂元の言葉（サッカーキング。記事は鉤括弧で引いている。台本は句点・読点で行に分けた。字は変えていない）:
#       「海外で5年間やって、この場所に帰ってこれたことはすごく嬉しいですし、ここでしっかりと活躍を見せて定着できるようにしたい」
#       「大卒でJ2からスタートして、この年齢でプレミアリーグにチャレンジできることは、僕自身すごく感慨深いものがあります。でも、これで満足はしていなくて、ここからプレミアや代表で何かを示すことで、もっと先が見えてくると思う。僕自身まだまだ満足はしてないですし、ここからもっともっとやっていきたいと思います」
#       「彼らは長年代表でやっていて、素晴らしいコンビネーションで常に結果を残し続けてきている。武器のドリブルやハードワークの部分は、誰にも負けないという自信がありますし、そこはプレミアでもしっかりと示せていると思います。自分をしっかりと出していくことが、試合に出ることにつながっていく」
#       「1対1でのサイドの打開は自信を持っています。ハードワークは必須だと思いますけど、そこをしっかりやりつつ、攻撃でも違いを見せられるようにやっていきたい」
#       「苦しいことの方が多かったですけど、折れずにやり続けた結果、今があると思う。このまま続けてやっていきたい」
#       （「彼ら」は記事のとおり堂安・久保を指す。記事の鉤括弧の中に主語は無いが、直前の地の文が堂安と久保の共存の話）
#   ・年齢: 生年月日 1996-10-22（ja.wikipedia。20261105_sakamoto_japan_return の取材メモと同じ）。2021年6月は24歳、今は30歳。前回の招集（2021年6月）から今（2026年11月）まで5年5か月（自分で数えた。「約5年半」は記事の言い方）。
#   ・ESPN（eng.1 summary event=401879242）: 11/6 エヴァートン 3-1 コベントリー。坂元は先発し交代で下がった（出場時間は未確認。今回は使わない）。
# 前の本との重なり: 20261105_sakamoto_japan_return（森保監督が語った招集の理由。代表復帰そのもの）／20261104_sakamoto_pl_first_goal（初ゴール・本人の言葉）。
#   → 今回の初出: 招集後の本人の言葉（誰にも負けない・堂安と久保の右サイドへの意識・苦しいことの方が多かった）、布陣と右サイドの顔ぶれの変化。森保監督の言葉・初ゴールの中身は繰り返さない。
#   題の「5年半ぶり」は 11/5 の題（5年ぶり）と近いが、中身は別（本人の言葉）。
# 【言わないこと】森保監督の言葉／初ゴールの詳細／エヴァートン戦の結果（先発の中身を確かめていない）／ブラジル戦の起用の予想。
# 写真: 坂元本人の使える写真は02だけ（サッカーキング10日の記事の主写真。代表の練習着）。コヴェントリー・テレグラフの写真と 20261104_sakamoto_pl_first_goal の 01 は Getty Images の配信写真だったので、今回は使わない（11/4 の本の 01 も Getty。知らせる）。
#   ゲキサカの坂元の写真は Getty 入りのことが多く、今回の記事の写真は坂元を特定できなかった。サッカーキングの集合写真は「SOCCERKING」の透かしが入る。
#   Commons File:Tatshurio Sakamoto.png（CC0）は、ファンと撮った自撮りで子どもの顔が写るので使わない（取り込んだが外した）。
#   04・05＝堂安律（Commons。20261108_doan_frankfurt_last_play の再掲）。堂安・久保の右サイドの話の行でだけ使う。
# 写真の加工: サッカーキングの主写真（02）は左上に「SOCCERKING」のロゴが入るので、横版（02_w）はロゴを外して切り直した（縦版は元からロゴの外）。
# 本人の言葉: あり（坂元達裕。サッカーキング）。Y。
