- id: view
  viewpoint: true
  heading: 見立て・ロナウドの11点差は、どこで生まれたのか
  tier: 背景
  telop: 最初の100試合はメッシが13点先。101試合目からはロナウドが24点先
  narrator: 解説
  card: &view_table
    type: table
    title: ロナウドとメッシの得点差の中身（自分で引いた）
    columns: [区間, メッシ, ロナウド, 先に行く側]
    rows:
    - [最初の100試合, '77', '64', 'メッシ+13']
    - [101試合目から, '52', '76', 'ロナウド+24']
    - [通算, '129', '140', 'ロナウド+11']
    note: 得点はUEFAと、そこから引いた数字
  say:
  - text: 最後に、ロナウドとメッシの差を、分けて見ます。
    image: assets/images/20261019_cl_messi2/01_w.jpg
    card: none
  - text: 通算では、ロナウドが11点多い。その中身です。
    image: assets/backgrounds/pitch.png
    card:
      <<: *view_table
      highlight_row: 2
  - text: はじめのうちは、メッシが13点先でした。
    card:
      <<: *view_table
      highlight_row: 0
  - text: そのあとは、ロナウドが24点先です。
    mark: {kind: circle, row: 1, col: 先に行く側}
    card:
      <<: *view_table
      highlight_row: 1
  - text: 24引く13で、通算の11点です。
    emph: true
    card: &view_calc
      type: calc
      title: 通算の差の中身（自分で引いた）
      terms:
      - ['24点', 101試合目から]
      - ['13点', 最初の100試合]
      - ['11点', 通算の差]
      ops: ['−', '＝']
  - text: ロナウドの1位は、そのあとの積み上げで決まりました。
    callword: そのあとの24点
    image: assets/images/20261019_cl_ronaldo/01_w.jpg
    card: none
  - text: 出場は、ロナウドのほうが20試合多い。
    card: none
  - text: メッシの1試合あたりで20試合を数えると、約16点です。
    card: none
  - text: 仮の割り算です。ただ、11点差は、その16点より小さい。
    image: assets/images/20261019_cl_x9/01_w.jpg
    card: none
  - text: レヴァンドフスキは、ロナウドと31点差、メッシと20点差です。
