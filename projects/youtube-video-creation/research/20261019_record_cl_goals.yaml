    card: none
  - text: 3人とも、いまのところ、試合数は増えていません。
    card: none
  - text: ただし、出場時間や相手の強さは、割り算の外にあります。
    image: assets/images/20261019_cl_x4/01_w.jpg
    card: none
  - text: 全体で割ると、先頭はメッシ。そのあとだけで割ると、先頭はロナウドです。
    image: assets/images/20261019_cl_messi2/01_w.jpg
