# 取材メモ（10/19 月、シリーズ「記録の解説」、key: record_cl_goals、型は news）。
# チャンピオンズリーグの通算得点（ロナウド140・メッシ129・レヴァンドフスキ109）を、試合数で割る。
#
# ★重ならないように（同じ選手・同じ数字の言い直しを避ける）：
#   ・10/17「ロナウド×メッシ」は**クラブでの得点（リーグ・CL・カップ）**を1試合あたりで比べた回。今回は**CL本戦の通算だけ**で、クラブ別の内訳（レアル105・バルサ120 など）は使わない。
#   ・10/18「ハーランドのCL60得点」は**60点までの試合数（最速）**の回。今回は**60点の行・30/40/50点の行・最初の60試合の得点は使わない**。ハーランドは名前も数字も出さない。
#     使うのは **70・80・90・100点までの試合数**と**最初の100試合の得点**（どちらも昨日の回に無い列）。
#   ・過去回への言及は台本に書かない。
#
# ★数字の出どころ（2026-10-19 に読み直した。requests のブラウザ UA か WebFetch。ブラウザ操作の道具・JavaScript は使っていない）
#   ・UEFA.com「All-time top scorers」（fr.uefa.com、ページ日付 2026-10-14、WebFetch）：**本戦の通算得点（予選を除く）**
#       ロナウド140／メッシ129／レヴァンドフスキ109／ベンゼマ90／ムバッペ72／ラウール71／ハーランド61／ケイン57／ミュラー57／ファン・ニステルローイ56。
#       注記：予選を含む別の一覧ではロナウド141（2005年の予選の1点）、レヴァンドフスキ109。→ 台本は「予選を外した140点」と言う。
#   ・UEFA.com「Champions League goalscoring milestones: …」（本文を WebFetch。引用の形で一覧を読み直した）：**N点に届くまでの試合数（少ない順）**
#       70点＝メッシ90・レヴァンドフスキ93・ムバッペ98・ロナウド106・ベンゼマ126・ラウール139／80点＝レヴァンドフスキ100・メッシ102・ロナウド116・ベンゼマ138／
#       90点＝メッシ109・レヴァンドフスキ110・ロナウド123・ベンゼマ149／100点＝メッシ123・レヴァンドフスキ125・ロナウド137。
#       100点の年齢：メッシ30歳263日・ロナウド32歳72日・レヴァンドフスキ36歳97日（台本は「30歳・32歳・36歳」だけ言う。日数は読みが崩れるので言わない）。
#   ・UEFA.com「Who has scored the most Champions League goals in their first ten, 20, … and 100 games?」（2026-10-14、WebFetch）：**最初の100試合の得点**
#       レヴァンドフスキ81／メッシ77／ムバッペ72／ロナウド64／ベンゼマ53／ラウール51。
#   ・試合数（通算の出場）は英語版ウィキペディア『List of UEFA Champions League top scorers』（2026-10-14 時点、requests で表を読んだ）：
#       ロナウド183（マンU59＋レアル101＋ユベントス23＝183）／メッシ163（149＋14）／レヴァンドフスキ144（28＋78＋38）／ベンゼマ152（19＋133）／ムバッペ100／ラウール142。
#       **ウィキペディアは config の reference 群＝報道止まり**。得点は UEFA と全員一致（140・129・109・90・72・71）。レヴァンドフスキの144試合は検索の別記事（dongqiudi・orla）でも一致。
#       ムバッペの100試合は UEFA の「最初の100試合」一覧（72点）と合う。
#   ・UEFA.com「Cristiano Ronaldo in the Champions League: Records, stats…」（Last updated 2026-07-28、WebFetch）：「140 Champions League goals in 183 appearances」、100点まで137試合、
#       本戦の初ゴールは「2007年4月のローマ戦（7-1）」（2005年に予選でデブレツェン戦の1点。台本の「初ゴール」は本戦）。→ ロナウドの183試合は UEFA で確定。
#   ・FCバイエルン公式（fcbayern.com 2021-11「Lewy hat-trick on his 100th appearance」、検索の見出し・要約のみ。本文は requests が接続エラーで未読）：100試合目で81点＝UEFAの81と一致（台本はUEFAを出典に）。
#   ・ロナウドの「100点に137試合」は UEFA の一覧どおり。**他の記事に「144試合」と書くものがあり、食い違う**（確かめられなかった）。台本は UEFA の数字のみ使い、「UEFAの記録で」と断る。
#   ・レヴァンドフスキの現在：英語版ウィキペディア『Robert Lewandowski』が「2026年6月にシカゴ・ファイアーへ」「バルセロナを2025-26の終わりに離れた」と書く（WebFetch）。
#       ウィキペディアの一覧の期間は ロナウド2003–2022・メッシ2005–2023・レヴァンドフスキ2011–2026。→ 台本は「3人とも今季のCLには出ていない」とは断定せず、
#       「出場の記録は2022年・2023年・2026年のシーズンまで」と書く代わりに、**「いまの割り算の分母は増えていない」**程度に留める（言う行は1つだけ・背景）。
#   ・Mbappé は2026-27のこの時点で**ちょうど100試合72点**（UEFAの「最初の100試合」と一致）。まだ現役なので「101試合目以降」の列には入れない。
#
# ★自分で数えたもの（検算済み。python で再計算して一致）
#   通算の1試合あたり：ロナウド140÷183＝0.765→0.77／メッシ129÷163＝0.791→0.79／レヴァンドフスキ109÷144＝0.757→0.76／ムバッペ72÷100＝0.72／ベンゼマ90÷152＝0.59／ラウール71÷142＝0.50。
#       **1位と2位が入れ替わる**（通算はロナウド、1試合あたりはメッシ）。上位3人の差は0.79−0.76＝0.03。
#   10点ごとにかかった試合数：70→80点＝メッシ12・レヴァンドフスキ7・ロナウド10／80→90点＝メッシ7・レヴァンドフスキ10・ロナウド7／90→100点＝メッシ14・レヴァンドフスキ15・ロナウド14。
#       **80点から100点までの20点は、メッシもロナウドも21試合**（102→123、116→137）。レヴァンドフスキは25試合（100→125）。
#       ロナウドはメッシより 70点で16試合・80点で14・90点で14・100点で14試合多い（106−90、116−102、123−109、137−123）。
#   最初の100試合の1試合あたり：レヴァンドフスキ0.81／メッシ0.77／ムバッペ0.72／ロナウド0.64／ベンゼマ0.53／ラウール0.51。
#   101試合目以降（通算−最初の100）：ロナウド183−100＝83試合・140−64＝76点＝0.92／メッシ63試合・52点＝0.83／ベンゼマ52試合・37点＝0.71／
#       レヴァンドフスキ44試合・28点＝0.64／ラウール42試合・20点＝0.48。
#   **ロナウドの11点差の中身**：最初の100試合はメッシが13点先（77−64）、101試合目以降はロナウドが24点先（76−52）。24−13＝11＝140−129。
#   ロナウドの出場はメッシより20試合多い（183−163）。メッシの1試合あたり（0.79）で20試合を数えると約16点（20×129÷163＝15.8）。**仮の割り算で、実際の得点ではない**と断る。
#   レヴァンドフスキとの差：ロナウド140−109＝31／メッシ129−109＝20。
#
# ★言い切っていないもの
#   ・ロナウドの101試合目以降の高い値（0.92）の理由は言わない（年齢・チーム・PK などは数字に出ない）。数字の事実だけ。
#   ・相手の強さ・出番の長さ（途中出場）は割り算に入らない（見立てで断る）。出場時間（90分あたり）は読んでいないので作らない。
#   ・Mbappé・ベンゼマ・ラウールの「101試合目以降」は、ムバッペ除外・ベンゼマとラウールは通算−最初の100の自分の引き算（UEFA の最初の100試合の値と通算から）。
# 反応・本人の言葉は入れない（voice_min: 0）。
#
# ★写真（assets/images/20261019_cl_* 、credits.json に控え。必ず開いて見る。代理店・透かしは使わない）：
#   メッシ：Commons File:Lionel Messi at Bernabeu.jpg（CC0、2012、バルサ）／FCバルセロナ公式（2018 CL100得点の記念、横1200）。
#   ロナウド：Commons（CC BY 2.0、マンU 2006 の縦）ほか。レヴァンドフスキ：FCバルセロナ公式（2024-11、背番号9の背中、横3000）ほか。
