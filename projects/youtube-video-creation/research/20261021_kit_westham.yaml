# ユニフォームとエンブレムの歴史 ウェストハム・ユナイテッド（10/21 作成）。雛形は 10/20 トッテナム回。
# 題の問い：ウェストハムの紋章（交差したハンマー）は、いつから胸にあり、また変わるのか。
# 軸：①胸にハンマーが付いたのはクラブ公式の記事で1923年のFAカップ決勝。その前は1896年のユニオンジャックが1シーズンだけ（公式）。ウィキペディアは「1895〜1900年の紋章」と書き、割れる。
#    ②城がいつから紋章にいるか：公式＝1950年代のブレザー・シャツは1965年5月のカップ・ウィナーズ・カップ決勝が最初・大きな城は1975/76から／ウィキペディア歴史＝1904年／本体＝塔が1950年代から断続的。
#    ③色：公式＝1895/96は濃紺／ウィキペディア＝1903年に赤紫（クラレット）と青をホームに。2026/27はニューバランス初のホーム、袖は「ボンズ・ブルー」（B&D Post）。
#    ④胸の形の変遷（公式の記載）と、1980年の形が36年続いたこと（公式）。⑤2026年6月29日に紋章の見直しを発表。第1回アンケート（8/20〜9/13）は有効15,314件、85%が変更に賛成（クラブ公式 2026-09）。新紋章は2028年夏に導入予定。
# 取材：2026-10-21。requests のブラウザ User-Agent で本文を読んだ（WebFetch・ブラウザ操作・検索エンジンのAI要約は使っていない。URLを探すため WebSearch の題名とURLだけ使い、本文は自分で読んだ）。
#   読んだ公式（whufc.com）：/news/articles/2017/june/29-june/west-ham-united-crest-through-years（2017-06-29。本体は500エラーでアクセスできず、Internet Archive の控え web.archive.org/web/2020/… を読んだ）／
#     /en/our-crest（Forging Our Future、2026-09）／/en/news/forging-our-future-or-supporters-opt-for-change-in-club-crest（第1回アンケートの結果、記事内の数字を本文から抽出）。
#   読んだウィキペディア(en)：West Ham United F.C.（節 Crest・Colours。現在は EFL Championship、2025–26 は18位で降格）／History of West Ham United F.C.（1904年の城入りの紋章、1923年の決勝）。
#   報道：Barking and Dagenham Post「West Ham United unveil new 2026/27 home shirt by New Balance」（クラブの発表の引用）、SportsLogos.Net（2026-06-30、紋章の相談の発表。クラブの文面を引用）。
#   読めなかった：whufc.com の2026/27ホームシャツの公式記事（見つからず）、1923年の決勝のシャツの写真（公式の記事の写真は使っていない）。
#
# ---- 一次情報で確かめたこと（年は本文のまま）----
#   ・公式 2017-06-29：「In 1896, the Club introduced its first crest … the Union Jack. Above and below the crest, the wording 'TIW FC' was sewed on. However, this crest … was used for just one season before being removed.」
#     「For the next 27 years … wore a shirt without a crest.」「The next time one appeared on West Ham's shirts was for the historic 1923 FA Cup final with Bolton Wanderers – the first final to be played at the new Empire Stadium in Wembley.」
#     「the estimated 200,000-strong crowd saw captain George Kay lead his team out in claret and blue shirts adorned with an 'elegant' shaped crest containing, for the first time, the now world-famous 'crossed hammers' symbol denoting two riveting hammers.」
#     「The crest then disappeared for another 27 years before reappearing in a similar form in 1950 … It remained on the Club's shirts for five seasons before taking a three-year break between 1955-58.」
#     「During the same decade, the players often wore blazers … For the first time, these designs included an image of the 'Boleyn Castle', the building named Green Street House which sat next to the Club's Boleyn Ground」
#     「In 1958 … the crossed hammers returned inside a 'classic' shaped crest which would remain on the shirts for most of the next nine seasons.」「One notable exception came in May 1965 … European Cup Winners' Cup final, complete with a 'renaissance' shaped crest containing the crossed hammers and, for the first time, the Boleyn Castle」
#     「Crests then disappeared … aside from a two-month period in 1967 – until the 1975/76 season … a large Boleyn Castle behind the classic crossed hammers.」「In 1980, a ribbon was added … 'West Ham United' and this design – save for a return to the plain crossed hammers between 1983-85 – remained on the shirts for the next 36 years」
#     「In 1995 … a special commemorative crest」「The crest used between 1998-2016」「The most-recent change … summer 2016, with a new shape based on the bow of HMS Warrior … the addition of the word 'London'」。1895/96 は「a plain all-Harrovian blue」の無地のシャツ。
#   ・公式 /en/our-crest・結果の記事：アンケートは 2026-08-20〜09-13。「A total of 15,911 responses were submitted. Of these, 96% were verified as eligible, giving a final total of 15,314 verified responses.」「85% – of respondents have voted in favour of changing the current Club crest.」
#     次：集会（フォーカスグループ）→デザイン会社→「proposed crests being shared in Spring 2027」→投票→「planned introduction of the new crest in summer 2028」。
#   ・SportsLogos 2026-06-30：クラブは2026年6月29日（1895年のテムズ鉄工所創設の記念日）に発表。現在の紋章は2016年に採用。2026-27は2部（EFL Championship）。
#   ・ウィキペディア（本体）：「The Thames Ironworks Team (1895–1900) used the Union Flag as its badge.」／塔は「from the 1950s onwards … intermittently」、アン・ブーリンの塔を表すとされるが「there is no documentary evidence」／ボリンの屋敷（Green Street House）は1955年に取り壊し／
#     2016年の形は「HMS Warrior の船体の断面」と同じ形／色：「The Irons permanently adopted claret and blue … as home colours in 1903」、1895-96は濃紺、1897〜99年は空色のシャツと白のパンツなど。
#   ・ウィキペディア（歴史）：「1904 also saw the introduction of the newly renamed club emblem. It incorporated the crossed hammers … and introduced the 'castle'」／1923年の決勝は0対2でボルトンに負け、「White Horse Final」。
#   ・B&D Post：2026/27ホームは「its first with a new manufacturer」＝ニューバランス初のホーム。「incorporates the club's 'Bonds Blue' sleeves」。
#
# ---- 食い違い（台本で断る／言わないもの）----
#   ・**最初の紋章（ユニオンジャック）の期間**：公式＝1896年の1シーズン／ウィキペディア＝1895〜1900年。
#   ・**城が最初に紋章に入った年**：公式＝1950年代のブレザー、シャツは1965年／ウィキペディア(歴史)＝1904年／本体＝1950年代から断続。→ シャツでは1965年（公式）と1904年（ウィキペディア）の差は 1965−1904＝61年。
#   ・**2016年の形**：公式＝HMS Warrior の船首／ウィキペディア＝船体の断面。台本では「船の形」と言い、船首か断面かは割れると断る。
#   ・**色**：公式の1895/96＝濃紺の無地／ウィキペディア＝赤紫と青の採用は1903年。
#   ・言わなかった割れ：城の理由の他説（旧鉄工所の建物・オールド・キャッスル・スウィフツ・ボリン城FC）は1行だけ「ほかにも説がある」と言う／1998年の作り直しのデザイナーの名前（検索の要約にだけ出た）／2014年のアンケートの数字（読めた公式の記事に無い）。
#
# ---- 自分で数えた数（検算した）----
#   ・紋章の無かった期間（公式の2つの「27年」）：1896→1923＝27、1923→1950＝27、足して54年。1975/76→2026＝51年（途切れず付いている）。54−51＝3。
#   ・1980→2016＝36年（公式）。1998→2016＝18年。2016→2028＝12年（予定）。12÷18＝0.67（3分の2）、12÷36＝0.33（3分の1）。
#   ・赤紫と青の採用 1903→2026＝123年。15,314×0.85＝13,017（約1万3000人。百分率は四捨五入なので概数）。15,314÷15,911＝96.2%（公式は96%）。
#
# ---- 言わないと決めたもの ----
#   ・スタジアムの数字・本拠地の収容（スタジアムの回と重ねない）／契約金額／アウェー・サードの色／女子チーム／所有者の話／スポンサー名（公式で確かめた資料が無い。Boyle Sports の続投は二次情報のみ）／
#   ・ファン投票の中身の予想（ハンマーを残すか・城を戻すか）。クラブは新しい形をまだ発表していない。
#
# ---- 写真（assets/images/20261021_kit_westham/、出典は credits.json）。取り込んだあと開いて見た ----
#   Commons の CC BY / CC BY-SA / 著作権切れの写真だけ。ボリン・グラウンド・ロンドン・スタジアム・ウォリアー号・1923年のケイ主将。Getty などの代理店の写真は使っていない。
#   エンブレムは assets/crests/ウェストハム.png・節の頭の差し込み assets/backgrounds/cut_ウェストハム.png（権利は晴れていない＝引き受ける危険）。
#
