- id: now
  heading: 紋章の見直しは、いま、どこまで進んでいるのか
  tier: 報道
  telop: 2026年6月29日に発表。第1回アンケートは有効15,314件で、85％が変更に賛成。新紋章は2028年夏の予定
  narrator: 解説
  card: &id_now
    type: document
    label: ウェストハム公式サイト「Forging Our Future」（2026年9月）の訳
    paragraphs:
    - 第1回アンケートの回答は、計15,911件。うち96％が資格を満たし、有効回答は15,314件だった。
    - 回答者の85％が、現在の紋章を変えることに賛成した。
    - 提案する紋章は、2027年春に示す。新しい紋章は、2028年夏に導入する予定。
    highlight:
    - 15,314件
    - 85％
    - 2028年夏
  say:
  - text: そして、いま。ウェストハムは、紋章を見直しています。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: 発表は、2026年6月29日。鉄工所のチームができた記念日です。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: 昨季18位で降格し、今季は、2部のチャンピオンシップにいます。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: クラブは、紋章が、歴史と個性を映すものか、確かめるため、と説明します。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: アンケートは、8月20日から、9月13日まで。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card:
      <<: *id_now
      highlight: []
  - text: 有効な回答は、1万5314件。クラブ公式の数字です。
    emph: true
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: *id_now
  - text: そのうち、85％が、いまの紋章を変えることに、賛成しました。
    emph: true
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: *id_now
  - text: 人数にすると、およそ1万3000人です。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: &id_ppl
      type: calc
      title: 賛成のおよその人数（自分で掛けた）
      terms:
      - - 15,314件
        - 有効回答
      - - 85％
        - 賛成の割合
      - - 約1万3000人
        - 掛けた答え（概数）
      ops:
      - ×
      - ＝
  - text: 次は、集会。デザイン会社が、案を作ります。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: 案は、2027年春に示され、投票が行われます。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: *id_now
  - text: 新しい紋章の導入は、2028年の夏の予定です。
    emph: true
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: *id_now
  - text: 新しい形は、まだ、発表されていません。
    emph: true
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
