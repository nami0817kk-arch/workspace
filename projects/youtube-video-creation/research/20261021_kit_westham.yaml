      - - 2016年
        - 今の紋章の導入
      - - 12年
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 1998年から2016年の紋章は、18年でした。
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_life
  - text: 12年は、その3分の2です。
    emph: true
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_life
  - text: 1980年の形は、細かい手直しを含め、36年。12年は、その3分の1です。
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_life
  - text: ただし、新しい紋章は、投票でこれから決まる途中。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: 2028年に替わると決まったわけでは、ありません。
    emph: true
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
