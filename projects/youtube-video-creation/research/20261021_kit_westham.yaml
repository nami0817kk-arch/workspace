- id: view
  viewpoint: true
  heading: 見立て・胸に紋章の無い54年と、付いている51年。次の紋章は何年持つのか
  tier: 背景
  telop: 紋章が無かったのは27年が2回で54年。1975/76から今までの51年より3年長い。2016年の紋章は12年で替わる予定
  narrator: 解説
  card: &id_gapyear
    type: calc
    title: 胸に紋章の無かった年と、付いている年（自分で数えた）
    terms:
    - - 54年
      - 無かった年（27年が2回）
    - - 51年
      - 付いている年（1975/76から今まで）
    - - 3年
      - 引いた答え
    ops:
    - −
    - ＝
  say:
  - text: 最後に、ウェストハムの年を、数え直します。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
  - text: 公式は、紋章の無い期間を、27年と書きました。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
  - text: 1923年の決勝をはさみ、同じ27年が、2回あります。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
  - text: 足すと、54年です。
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_gapyear
  - text: 1975/76から今までは、51年。
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_gapyear
  - text: 無かった年のほうが、3年、長いのです。
    emph: true
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: *id_gapyear
    mark:
      kind: circle
      item: 2
  - text: では、次の紋章は、何年持つのか。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  - text: 2016年の紋章が、2028年に替われば、12年です。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: &id_life
      type: calc
