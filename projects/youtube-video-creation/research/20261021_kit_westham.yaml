  - text: ウェストハムの、胸の紋章の話です。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    emph: true
    card: none
  - text: 年や由来は、資料によって、書き方が違います。違いは、そのまま伝えます。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
  - text: まず、クラブ公式の記事から。
    card:
      <<: *id_doc
      highlight: []
  - text: 最初の紋章は、1896年のユニオンジャックでした。
    emph: true
    card: *id_doc
  - text: 1シーズンで外され、そのあとは27年。1シーズンの27倍の空白です。
    card: *id_doc
  - text: ウィキペディアは、ユニオンジャックを、1895年から1900年の紋章と書きます。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: 期間は、公式と食い違います。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: 次に付いたのは、1923年のFAカップ決勝です。
    emph: true
    card: *id_doc
  - text: ウェンブリー競技場で、初めて開かれた決勝でした。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: 主将のジョージ・ケイは、ハンマーの紋章のシャツで、先頭に立ちました。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: ハンマーは、造船で鋲を打つ道具。クラブは、鉄工所のチームから生まれました。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: 公式は、観客を約20万人と見積もります。収容を、大きく超えました。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
  - text: 試合は、ボルトンに0対2の負け。「白馬の決勝」と呼ばれます。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card: none
