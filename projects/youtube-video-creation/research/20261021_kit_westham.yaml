      - 欧州決勝で、城つきの形（例外）
    - - 1975/76
      - 大きな城がハンマーの後ろに
    focus: 1923年
  say:
  - text: ここからは、ウェストハムの胸の形の移り変わり。公式の記載で数えます。
    image: assets/backgrounds/cut_ウェストハム.png
    card: none
  - text: 1923年の最初の形は、決勝の1試合のあと、27年消えます。
    emph: true
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card:
      <<: *id_shA
      highlight_row: 0
  - text: 1950年に、似た形で戻ります。5シーズン付き、そのあと3年外れました。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card:
      <<: *id_shA
      highlight_row: 1
  - text: 1958年は、1部に戻った祝い。「クラシック」と呼ぶ形が、ほぼ9シーズン付きます。
    image: assets/images/20261021_kit_westham/w01_boleyn_east.jpg
    card:
      <<: *id_shA
      highlight_row: 2
  - text: 1965年5月、欧州の決勝で、城つきの形。公式は、これを例外と書きます。
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card:
      <<: *id_shA
      highlight_row: 3
  - text: 1975/76から、大きな城が、ハンマーの後ろに付きました。
    emph: true
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card:
      <<: *id_shA
      highlight_row: 4
  - text: ここから先は、後半です。
    card: &id_shB
      type: timeline
      title: 胸の紋章の変遷（クラブ公式の記載。後半）
      rows:
      - - 1980年
        - リボンに「ウェストハム・ユナイテッド」
      - - 1983〜85年
        - ハンマーだけに戻る
      - - 1995年
        - 百周年の特別な紋章
      - - 1998年
        - 紋章が作り直される
      - - 2016年
        - 船の形の盾。「ロンドン」の文字
      focus: 1980年
  - text: 1980年、紋章の下に、チーム名のリボンが付きます。
    emph: true
    card:
      <<: *id_shB
      highlight_row: 0
  - text: 1983年から85年は、ハンマーだけに戻りました。
    card:
      <<: *id_shB
      highlight_row: 1
  - text: 1995年は、鉄工所の創設100年。特別な紋章が付きました。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card:
      <<: *id_shB
      highlight_row: 2
  - text: 1998年、紋章は作り直されます。公式は、2016年までの紋章と書きます。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card:
      <<: *id_shB
      highlight_row: 3
  - text: 公式は、1980年の形が、その後36年、胸にあったと書きます。
    emph: true
    image: assets/images/20261021_kit_westham/w03_boleyn_last.jpg
    card: none
  - text: 2016年は、新本拠地に移った夏。胸の形が、船の形の盾に替わります。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card:
      <<: *id_shB
      highlight_row: 4
  - text: 元は、鉄工所が造った軍艦、ウォリアー号。船首の形と、公式は書きます。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: ウィキペディアは、船体の断面と同じ形、と書きます。
    image: assets/images/20261021_kit_westham/w05_warrior.jpg
    card: none
  - text: このとき、城が外れ、「ロンドン」の文字が入りました。
    image: assets/images/20261021_kit_westham/w02_london_stadium.jpg
    card: none
  sources:
