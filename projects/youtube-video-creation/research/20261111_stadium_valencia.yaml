  - text: 開いたのは1923年5月。入れるのは1万7000人でした。
    image: assets/images/20261111_stadium_valencia/05_w.jpg
    card:
      <<: *id_hist
      highlight_row: 0
  - text: 名前は、すぐそばを流れていた用水路、メスタージャ用水から付きました。
    emph: true
    image: assets/images/20261111_stadium_valencia/05_w.jpg
    card: none
  - text: 最初は土のグラウンド。芝を植えたのは、4年後の1927年です。
    image: assets/images/20261111_stadium_valencia/05_w.jpg
    card:
      <<: *id_hist
      highlight_row: 1
  - text: 1936年からの内戦で傷み、残ったのはメインスタンドの骨組みだけでした。
    image: assets/images/20261111_stadium_valencia/05_w.jpg
    card: none
  - text: 1950年代には、スタンドを足して、器を大きく広げます。
    image: assets/images/20261111_stadium_valencia/03_w.jpg
    card: none
  - text: お金を集めるのに、レアル・マドリードの会長ベルナベウも力を貸しました。
    image: assets/images/20261111_stadium_valencia/03_w.jpg
    card: none
  - text: 1957年10月には、街を流れるトゥリア川があふれ、器ごと水につかります。
    image: assets/images/20261111_stadium_valencia/03_w.jpg
