# スタジアム紹介シリーズ：バレンシアの本拠地（メスタージャ、11/11 予定）。雛形は 11/7 ベルナベウの回。
# 題材の選び方（2026-11-06）：指示書 20261109 の「ラ・リーガの続き・大きいクラブから」。11/9 のサン・マメスの次に大きいクラブ（セビージャより先に、今季が最後のシーズンという時期の強さでバレンシア）。
#   重なりの確認：scripts/*stadium_* にメスタージャ・バレンシアは無し。covered.yaml・posted.json にも stadium_valencia は無い。
#   直近30日（10/12〜11/11）のバレンシアの本：無し（佐藤龍之介のニュース 20261007_sato_valencia は 10/7 で30日の外。クラブ紹介 ll19 は 9/26）。
#   ll19（9/26）は「1923年から続いて今季で終わる」「新しい器の工事が16年止まった」を1節で触れている。この回は器そのもの（名前・歩み・新旧の違い・席の数）を掘る。言い回しは ll19 と変えた。
#   picks（research/20261109_picks.txt）：同じ 11/11 のユニフォームはアトレティコ。重ならない。
# 今季のラ・リーガ所属（一次情報）：ESPN の esp.1 2026-27 の日程（teams/94/schedule?season=2026）にホーム6試合、会場は Mestalla Stadium。
# メスタージャ（ウィキペディア es・en）：1923-05-20 開場、レバンテとの親善試合1対0、収容1万7000。名前は用水路（acequia de Mestalla）から。1927年に初めて芝、約2万5000に。
#   内戦（1936〜39）でメインスタンドの骨組みしか残らず（es）。1950年代の大改修で4万5500（es。en は6万と書くので数字は言わず「大改修」まで…台本では es の 4万5500 を使わず「大きく広げた」）。
#   資金集めはレアル・マドリードの会長サンティアゴ・ベルナベウの助けで（es「conseguido gracias a la ayuda de Santiago Bernabéu」）。
#   1957-10-14 トゥリア川の大洪水で浸水（es・en）。1959年に照明。1969-08-23〜1994-11-06 は「ルイス・カサノバ」の名（本人の手紙で元の名に）。
#   1982年W杯：スペインの1次リーグ3試合（es）。1992年五輪：スペインの準決勝までの試合（en・es）。スペインは金メダル。
#   収容4万9430（es・en）。ラ・リーガでいちばん古い本拠地（en「Since January 2020」）。
#   客席の傾き：「急なところで45度、新しい器は約36度」（Levante-EMV 2026-10-01、クラブの説明会）。ウィキペディアは「34〜35度」で割れるので、台本は Levante の数字を「報道」で。
# 新しい器（ウィキペディア es・en、Las Provincias 2026-07-18、Levante-EMV 2026-10-01・11-06）：
#   2007-08-01 着工／2009年2月 お金が足りず中断（古い器の土地を売って建てる計画が不動産の値下がりで崩れた。es）／2011年12月 銀行と合意→2012年9月 崩れる（es）。
#   2014年 ピーター・リムのメリトンが株を買い、創立100年（2019）までの完成を約束→できず（es）。
#   2025-01-10 再開（es・en）。止まっていたのは2009年2月〜2025年1月＝15年11か月（自分で数えた）。
#   収容7万44、全部の席に屋根（es）。屋根を支える骨組み4800トン、張り出し70メートル、いちばん上の輪3万1000人＝1部の10のスタジアムより多い、芝は道路から9.2メートル下（Levante 10-01）。
#   期限 2027-07-11（市から与えられた30か月。Las Provincias 07-18）。開く試合は8月の親善大会トロフェオ・ナランハの案（同、報道）。
# 見立て：
#   今季の年間席の持ち主（abonados）4万76人、新しい器で約5万人が目標、席選びの組に入ったのは11月6日までに4万9232人・1万3684組（Levante-EMV 2026-11-06、クラブの数字）。
#   7万44−5万＝2万44（自分で計算。残りは来賓・企業の席と、入場券に回す＝Levante）。
#   今季メスタージャの入場（ESPN の試合記録。記録が0の2試合＝9/6 バルセロナ・10/24 ビジャレアルは使わない）：8/22 セルタ4万3684・8/25 ベティス4万5472・9/20 レアル・ソシエダ4万5122・10/17 アスレティック4万3223。合計17万7501・平均4万4375。
#   4万4375 ÷ 4万9430 ＝ 89.8％。7万44 ÷ 4万4375 ＝ 1.58倍（自分で計算）。
# 日本との接点（サッカーの縁）：8/22 セルタ戦で佐藤龍之介が先発（ESPN の先発表 event=401882907）。8/25 ベティス戦も先発。
# 言わなかったもの：2008年の工事の事故／内戦中の使われ方（収容所）の詳しい中身／1998〜2001年の増築の裁判／2030年W杯の会場の話（割れている）／費用の総額（出どころで割れる）。
# 写真：assets/images/20261111_stadium_valencia/（credits.json）。Commons（CC0・CC BY・CC BY-SA・PD）。
