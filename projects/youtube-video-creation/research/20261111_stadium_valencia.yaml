      <<: *id_hist
      highlight_row: 2
  - text: 1969年からは、長く会長を務めたルイス・カサノバの名前で呼ばれました。
    image: assets/images/20261111_stadium_valencia/04_w.jpg
    card:
      <<: *id_hist
      highlight_row: 3
  - text: 1994年、そのカサノバ本人が手紙で頼み、元のメスタージャに戻ります。
    image: assets/images/20261111_stadium_valencia/04_w.jpg
    card:
      <<: *id_hist
      highlight_row: 4
  - text: 1982年のワールドカップでは、スペイン代表の1次リーグ3試合の舞台に。
    image: assets/images/20261111_stadium_valencia/01_w.jpg
    card: none
