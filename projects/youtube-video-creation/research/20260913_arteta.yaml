# アルテタが、プレシーズンにわざと困難を作っていたと明かした（2026年9月13日）
#
# **出どころはゲキサカ。**アルテタの発言を伝えたもの。
#
# 引きは**「食事を遅らせ、更衣室を暑くし、マッサージ台を減らした」**。
# **全部わざとだった**ところが芯。ここが山場（@main）。
#
# **「選手を痛めつけた」という書き方にしない。**本人は適応の準備として話している。
#
# **昨夜アーセナルはサンダーランドに2対0で勝っている**（開幕4連勝）。
# 言葉と結果を並べる形で終える
format: quote
# **引ける発言は3つ。**本人ひとりの言葉なので、その分だけ下げる
voice_min: 26
slot: premier_1
date: "2026年9月13日"

people:
  - ミケル・アルテタ

short_title: "アルテタがプレシーズンにやっていたこと"

theme:
  id: arteta_preseason
  league: england
  kind: other
  topic: アーセナル
  title: アルテタがプレシーズンに、わざと起こしていたことの中身
  hook: トラブルへの備えです。シーズン前に、自分たちで作っていました。
  question: 何をわざと起こしていたのか

thumbnail:
  line1: アルテタがわざと起こしていた
  line2: 中身は ●●●●
  photo: "assets/photos/20260913_arteta/01.jpg"
  tags: []
  points:
    - 更衣室を暑くした
    - マッサージ台を減らした

sections:
  - id: what
    heading: 何の話か
    tier: 報道
    telop: シーズン前の準備について
    narrator: キャスター
    say:
      - アーセナルを率いるミケル・アルテタが、シーズン前の準備について話しました。
      - 出てきたのは、トラブルへの備え方でした。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458675-458675-fl

  - id: words
    heading: わざと起こしていたこと
    main: true
    tier: 報道
    telop: 「更衣室を暑くしたり、マッサージベッドを減らしたり」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 準備の話ではなく、**自分たちで不便を作っていた**ところが芯
    card:
      type: points
      title: プレシーズンにわざとやったこと
      items:
        - 食事を遅らせる
        - 移動を遅らせる
        - 違う道で向かう
        - 更衣室を暑くする
        - マッサージ台を減らす
    say:
      # **ショートは山場の節だけを切り出すので、状況もここに入れる**
      # **発言の順番を入れ替えた**（2026-09-13 ユーザーの行ごとの指摘）。
      # 具体の中身を先に出し、「困難が好きなんだ」を最後に置く。
      # 「中身は、こうです。」の1行は落とす（振りだけで中身が無い）
      - アーセナルを率いるミケル・アルテタが、シーズン前にチームへわざと起こしていたことを挙げました。
      - {voice: ミケル・アルテタ, text: 食事を遅らせたり、移動を遅らせたり、異なる道で向かったりだよ。多くのことをやってきた}
      - {voice: ミケル・アルテタ, text: 更衣室を暑くしたり、マッサージベッドを減らしたりした。異なる状況に適応する必要があるからね}
      # **なぜやったのかを聞いてから、答えの一言を置く**（2026-09-13）。
      # 並べ替えただけだと、最後の一言が前の話の繰り返しに聞こえていた
      - なぜ、わざわざそんなことをするのか。
      - {voice: ミケル・アルテタ, text: 僕はそうした困難が好きなんだ。プレシーズン中にそうしたものを作ろうとしたんだよ。だから困難が発生したときの対応法は分かっている}
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?458675-458675-fl

  - id: result
    heading: そして、昨夜
    tier: 報道
    telop: サンダーランドに2対0
    narrator: キャスター
    say:
      - この話が出た翌日、アーセナルはサンダーランドと戦いました。
      - 0対0のまま55分。ここでサンダーランドにペナルティキックを与えます。決まれば先制される場面でした。
      - 止めたのはゴールキーパーのダビド・ラヤ。その3分後、後半から入っていたブルーノ・ギマランイスが決めます。
      - 終盤にはサカがペナルティキックを得て、自分で決めました。敵地で2対0。失点はありません。開幕から4連勝です。
      - 不便を作って備えた、と話した監督のチームが、崩れそうな場面から勝ち切った試合でした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/eng/20260913/2204293.html
