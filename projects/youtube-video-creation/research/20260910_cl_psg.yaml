# CL第1節 PSG 6-1 スロヴァン・ブラチスラヴァ（2026年9月10日）。
# ユーザー指示「6時にリヴァプール、PSG、アーセナル」
#
# 引きは**試合前と試合後の落差**。リーグ・アンで3戦未勝利、監督自身が
# 「最悪のスタート」と言った翌日に6得点している。
# スコアだけの回にしないための軸がここにある。
#
# 日本人の枠ではないが、スロヴァンには福岡から期限付き移籍中の松岡大起がいる。
# **ベンチ入りしたが出場は無かった**ので、そこは事実として1行だけ置く。
#
# **反応は入れない。**この試合のスレを探したが、読める形のものが無かった
format: news
# 監督の言葉が主役の回
voice_min: 24
slot: match
date: "2026年9月10日"

# ハッシュタグに使う人の名前（2026-09-10）。**本文から機械で拾わない**
people:
  - デンベレ
  - フェラン・トーレス
  - ファビアン・ルイス
  - ルイス・エンリケ
  - 松岡大起
  - ヤヤ・トゥーレ
  - カマラ

short_title: "デンベレ2発フェランはハット、PSGが6発"

theme:
  id: cl_psg_slovan
  league: france
  kind: match
  topic: パリ・サンジェルマン
  title: PSGがCL初戦で6得点。その監督が前日に語っていたのは「最悪のスタート」
  hook: リーグ・アンでは、まだ1勝もしていません。
  question: 6点取ったチームの、何が最悪だったのか

thumbnail:
  line1: CL初戦でいきなり6得点
  line2: 前日の監督「●●●●●●●」
  photo: "assets/photos/20260910_cl_psg/01.jpg"
