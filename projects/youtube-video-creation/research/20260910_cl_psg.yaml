sections:
  - id: before
    heading: 試合の前に何を言っていたか
    tier: 報道
    telop: 「結果だけを見れば最悪のスタート」
    narrator: キャスター
    say:
      - チャンピオンズリーグ3連覇を狙うパリ・サンジェルマンですが、今シーズンの出だしはよくありませんでした。
      - スーパーカップはアストン・ヴィラに勝ったものの、トロフェ・デ・シャンピオンではランスに敗れます。
      - リーグ・アンは開幕から2分1敗で、3試合を終えてまだ勝ち星がありません。
      - 試合前日、ルイス・エンリケ監督はフランス紙『レキップ』にこう話していました。
      - {voice: エンリケ監督, text: 結果だけを見れば最悪のスタートだ}
      - {voice: エンリケ監督, text: だが監督としては}
      - {voice: エンリケ監督, text: ピッチ上で起きていることを評価しようと努めている}
      - {voice: エンリケ監督, text: 改善すべき点はある}
      - {voice: エンリケ監督, text: もっと勝ち点を得ていてもおかしくない内容だった}
      - CLについても、慎重な言い方をしています。
      - {voice: エンリケ監督, text: まずは良いスタートを切りたい}
      - {voice: エンリケ監督, text: 簡単な試合など存在しない}
      - {voice: エンリケ監督, text: トップ8に入り、プレーオフを回避したい}
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202898.html
      - https://web.ultra-soccer.jp/news/all/35714/

  - id: match
    heading: 何が起きたか
    tier: 報道
    telop: PSG 6対1 スロヴァン
    narrator: キャスター
    card:
      type: table
      title: CLリーグフェーズ第1節 PSG 6-1 スロヴァン・ブラチスラヴァ
      columns: ["時間", "得点者"]
      rows:
        - ["17分", "デンベレ（PSG）"]
        - ["23分", "デンベレ（PSG）"]
        - ["31分", "フェラン・トーレス（PSG）"]
        - ["47分", "フェラン・トーレス（PSG）"]
        - ["57分", "フェラン・トーレス（PSG）"]
        - ["59分", "カマラ（スロヴァン）"]
        - ["88分", "ファビアン・ルイス（PSG）"]
    say:
      - 迎えた本拠地パルク・デ・プランスでの初戦、内容は前日の言葉とかけ離れたものになりました。
      - 17分、ウスマン・デンベレが先制。その5分後にも決めて、前半のうちに2点差にします。
      - 31分にはフェラン・トーレスが3点目。
      - 後半に入っても止まらず、47分と57分にもフェランが決めてハットトリックを達成しました。
      - 59分にカマラが1点を返しましたが、88分にはファビアン・ルイスが加点。
      - 6対1。3連覇に向けて、幸先のよいスタートになりました。
      - なお、スロヴァンに福岡から期限付き移籍している松岡大起はベンチ入りしましたが、出場機会はありませんでした。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260910/2203121.html
      - https://www.footballchannel.jp/2026/09/10/post1007568/

  - id: gap
    heading: この落差をどう見るか
    tier: 報道
    telop: 過去2季はプレーオフに回っている
    narrator: 解説
    say:
      - エンリケ監督が「トップ8」と言ったのには理由があります。
      - 過去2シーズンとも、リーグフェーズを8位以内で終えられず、プレーオフに回っているからです。
      - 連覇した上でなお、その手前で足を取られている、という自己認識が言葉に出ています。
      - {voice: エンリケ監督, text: 過去は過去に過ぎない}
      - {voice: エンリケ監督, text: 常にモチベーションを新たにしなければならない}
      - {voice: エンリケ監督, text: 対戦相手は我々との対戦に向けて士気を高めてくる}
      - {voice: エンリケ監督, text: コンフォート・ゾーンから抜け出さなければならない}
      - {voice: エンリケ監督, text: 日々自分たちを再構築していく必要がある}
      - 次の第2節、PSGはマンチェスター・シティと当たります。相手のレベルはここから跳ね上がります。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260909/2202898.html
      - https://www.soccer-king.jp/news/world/cl/20260910/2203121.html
