# 取材: 2026-11-11。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: サッカーキング 2026-11-10「「基準が二段階ぐらい上がった」前回の活動で成長実感の松木玖生、南米連戦へ「自分がどのようにできるのか」」（全文）
#   https://www.soccer-king.jp/news/japan/national/20261110/2226401.html
# 出典で確かめたこと:
#   ・10日、日本代表が「MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE」のブラジル戦へシンガポールで始動。練習後に松木がメディア対応（サッカーキング）。
#   ・サッカーキング: 前回の活動で初めてA代表に招集され、デビュー戦のウルグアイ戦で先制点。
#   ・松木の言葉（サッカーキング。記事は鉤括弧で引いている。台本は読点で行に分けた。字は変えていない）:
#       「自分の基準が二段階ぐらい上がった」
#       「サウサンプトンに戻っても、点を決めたとしても、まだまだだなと思いますし、そこの基準が上がってさらに自信もついた」
#       「もっと結果のところと、攻撃で違いを見せるところはやっていかないといけない」
#       「強豪相手と対決できるのも楽しみですし、そこで自分がどのようにできるのかも楽しみ」
#         （最後の2つは地の文のあとの鉤括弧。記事は短いので、使える発言はこの4つだけ）
#   ・ウルグアイ戦（ESPN fifa.friendly summary event=401905330、2026-09-24 10:05 UTC、宮城スタジアム）: 日本 3-1 ウルグアイ。11分 松木玖生（左足、エリアの外からゴール左下。中村敬斗のアシスト）／42分 マキシ・アラウホ（ウルグアイ）。松木は先発。
#   ・サウサンプトンの試合（ESPN eng.2 teams/376/schedule と各試合の summary。松木の出場と得点を数えた）:
#       9/24 以降のクラブの試合は7つ。10/11 ポーツマス（途中出場）、10/14 ノリッジ（先発・得点）、10/17 ボルトン（途中出場）、10/24 ウェストハム（先発・得点）、10/31 QPR（先発・得点）、11/3 ウェストブロム（先発・0得点。1-1）、11/7 プレストン（先発・0得点。0-1）。
#       → 7試合で3得点。直近2試合は無得点。今季のリーグ戦は15試合4得点（9/12、10/14、10/24、10/31）。
#       （この3得点は 20261104_matsuki_volley_saints／20261029_matsuki_chance の数字と重なる。今回は「代表デビューのあとの7試合」という数え方で使い、得点の中身は繰り返さない）
#   ・日程: 11/14 ブラジル戦、11/17 パラグアイ戦（シンガポール。サッカーキング）。
# 前の本との重なり: 20261104_matsuki_volley_saints（反転ボレー・今季4点目）／20261029_matsuki_chance／20261015_matsuki_southampton。
#   → 今回の初出: 代表デビュー後の本人の言葉（基準が二段階ぐらい上がった）。ウルグアイ戦のゴールは経緯として1行だけ。
# 【言わないこと】サウサンプトンの順位・チャンピオンシップの数字の細部／直近2試合の無得点の理由／ブラジル戦の起用の予想／堂安の「教わる」（過去回）。
# 写真: 01＝サウサンプトン公式（加入発表。2024年の写真）、02＝サッカーキング 10日の記事の主写真（代表の練習。ビブス10番）、03＝サウサンプトン公式（試合の写真）、05＝サウサンプトン公式（代表の青のユニフォームの横顔。縦だけ・要確認の印は顔検出外れ）。
#   04（ゲキサカの練習の集合写真）は誰か特定できないので外した。
# 写真の加工: サッカーキングの主写真（02）は左上に「SOCCERKING」のロゴが入るので、横版（02_w）はロゴを外して切り直した（縦版は元からロゴの外）。
# 本人の言葉: あり（松木玖生。サッカーキング）。Y。
