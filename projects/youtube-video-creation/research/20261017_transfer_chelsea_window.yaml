# 移籍の深掘り 第6回：チェルシーの2026年夏（「1クラブの移籍期間」の回）。10/17 作成。
# 材料の控えは research/raw/20261017_transfer_chelsea_window.md。**材料から出ない。**
#
# **角度：「支出は世界2位。売った分を引くと、差し引きはプラス」。**
#   Transfermarkt の世界の一覧（2026年夏・支出順。**1ページ目＝支出の上位25クラブだけ**）で、2位チェルシー 407.48。
#   同じページの「戻った額」は 447.80、差し引きは＋40.32。**プレミア20クラブの一覧でも支出2位・収入1位**（機械で確かめた）。
#   世界の収入順位は、一覧が上位25クラブしか見ていないので**言わない**。
#
# **数字の確度。**移籍金は Transfermarkt の集計で**確度は「報道」**。
#   - **クラブ公式（chelseafc.com）の発表文を全部読んだ（加入10・退団主要10）。額は1つも書かれていない。**
#   - 報道（LBC・PA の配信、The National）の額は**ポンド**：ロジャーズ約1億1700万（「understood to be around」）、エンソ1億2500万（PA）。
#     Transfermarkt のユーロは 138.00 と 145.00。**換算は集計の側のもの**（138÷117＝1.18、145÷125＝1.16。日付の違いで同じ率にならない）。
#   - **固定かボーナス込みかは公表されていない**。買い取り条件は調べていない（言わない）。貸し出しは額に入っていない。
#
# **自分で数えた数**（百万ユーロ。足し算で一覧と一致を確かめた）:
#   払った額 138.00+60.70+57.00+50.78+40.00+25.00+19.00+8.75+5.85+2.40＝407.48 ← 一覧と一致（移籍金の付いた加入10人。ヘンダーソンは移籍金なし）。
#   戻った額 売り10人 145.00+56.30+55.50+55.00+52.50+30.00+21.00+15.00+11.65+2.50＝444.45、貸し出し料2件 3.00+0.35＝3.35 → 計 447.80 ← 一覧と一致。
#     **下書きの「約4億4445万」は貸し出し料を除いた売りだけの合計で正しかった**（貸し出し料を足すと一覧の4億4780万になる）。
#   差し引き 447.80−407.48＝40.32 ← 一覧の＋40.32と一致（売りだけだと＋36.97）。
#   売り上位5人 145+56.3+55.5+55+52.5＝364.3 → 364.3÷444.45＝81.97%（82%）／残り5人 80.15。
#   プレミアのクラブから 145+56.3+55.5+52.5+21+11.65＝341.95 → ÷444.45＝76.9%（77%）／海外 55+30+15+2.5＝102.5。
#   買い上位3人 138+60.7+57＝255.7 → ÷407.48＝62.75%（63%）／ケンダ＋エメガ（2025年に決まっていた）50.78+25＝75.78 → 18.6%（19%）。
#   ロジャーズとエンソの差 145−138＝7.0。
#   日付はクラブの発表日。7/21 までに売った3人 55+21+56.3＝132.3 → ÷444.45＝29.8%（30%）／それ以後 444.45−132.3＝312.15（70%）。
#   9/1 に出た3人 145+15+11.65＝171.65 → 38.6%（39%）。7月中に決まった買い4人（パレストラ7/1・ケンダ7/8・ロジャーズ7/21・ラクロワ7/30）
#     57+50.78+138+60.7＝306.48 → 75.2%（75%）。
#   市場価値（Transfermarkt のクラブ詳細表の「Market value」＝移籍時。ロジャーズは API の details.marketValue 90.0 と一致）:
#     買い10人 90+50+35+42+40+25+10+12+3+3.5＝310.5 → 407.48÷310.5＝1.312（約1.31倍）／
#     売り10人 100+40+40+50+28+40+20+12+16+4＝350 → 444.45÷350＝1.270（約1.27倍）／デラップ 52.5÷28＝1.875（約1.9倍）／
#     線より下の売り3人：チャロバー（40→30）・アダラビオヨ（16→11.65）・フォファナ（4→2.5）。
#   為替：ECB 参照相場 2026-10-16＝1ユーロ177.82円。40.32×177.82＝7,170百万円（約72億円）。
#   プレミアの差し引きがプラスのクラブ：ヴィラ＋65.05・パレス＋44.00・チェルシー＋40.32・フォレスト＋26.50・エヴァートン＋26.20・ブライトン＋12.05＝6クラブ（チェルシーは3番目）。
#   支出の上位4クラブ（世界の一覧）：シティ−189.18／チェルシー＋40.32／トッテナム−202.10／ニューカッスル−33.90 → プラスはチェルシーだけ。
# 数字の重なり対策：『4億750万』『4億4780万』『4030万』『72億円』『3番目』『6クラブ』は①だけ／②は『1億4500万』『82%』『77%』『3億4195万』『8015万』『335万』／
#   ③は『1億3800万』『63%』『7578万』『19%』『700万』『1億1700万ポンド』／④は『30%』『70%』『39%』『75%』『1億3230万』『3億1215万』『1億7165万』『3億648万』／
#   ⑤は『1.31倍』『1.27倍』『1.9倍』『上位4クラブ』。**題には金額を入れない**。
# 板：①waterfall と convert ②table・document・calc ③table・document・convert・duel ④timeline・calc ⑤calc 2枚・scatter・table（赤ペン）。
# 写真（10/17 取得）：クラブ公式（chelseafc.com の記事の主写真）。ロジャーズ・エンソ・パレストラ・ケンダ・ラクロワ・ジャクソン。スタンフォード・ブリッジは Commons（10/16 のスタジアムの回と同じ2枚）。
#   出典は assets/images/20261017_chelsea_window/credits.json。
# 声：1件も無い。クラブ公式発表の文は文書カードで出した。voice_min: 0。
# サムネ：ユーザーが選ぶ。ここは案A。案B・Cは報告に書いた。
