- id: when
  heading: 買いは7月に決まり、売りは窓の最後の日まで続いた
  tier: 報道
  telop: 7月中に払った額の75%が決まり、売りの70%はロジャーズ加入のあと
  narrator: 解説
  card: &when
    type: timeline
    title: チェルシーが発表した主な動き
    rows:
    - ['6月15日', 窓が開く。ククレジャがレアルへ]
    - ['7月21日', ロジャーズの加入を発表]
    - ['8月9日', チャロバーがコモへ]
    - ['8月27〜28日', デラップとジャクソンが退団]
    - ['8月30日', ゴールキーパーのE・マルティネスが加入]
    - ['9月1日', エンソら3人が退団。窓が閉まる]
    focus: 7月21日
  say:
  - text: 買いと売りは、どちらが先に決まったのか。発表の日付で見ます。
    image: assets/images/20261017_chelsea_window/a01_stadium_w.jpg
    card: none
  - text: 夏の窓は、6月15日に開き、9月1日に閉まります。窓とは、受付の期間のことです。
    card: *when
  - text: 6月15日、窓が開く日に、ククレジャがレアルへ移りました。
    card:
      <<: *when
      highlight_row: 0
  - text: 7月21日には、ロジャーズの加入が発表されました。
    emph: true
    image: assets/images/20261017_chelsea_window/b01_rogers_w.jpg
    card:
      <<: *when
      highlight_row: 1
  - text: 7月のうちに、パレストラ、ケンダ、ロジャーズ、ラクロワが加わりました。
    card:
      <<: *when
      highlight_row: 1
  - text: この4人で3億648万ユーロ。買った額の75%です。
    emph: true
    card: &calc_buy
      type: calc
      title: 7月中に決まった買いは、全体の何割か
      terms:
      - ['3億648万ユーロ', 7月中の4人]
      - ['4億748万ユーロ', 買った10人の合計]
      - [約75%, 7月中に決まった割合]
      ops: ['÷', ＝]
  - text: では、売りはどうだったのか。7月21日までに出たのは3人です。
    card:
      <<: *when
      highlight_row: 0
  - text: ククレジャ、ジョージ、サントスで、1億3230万ユーロ。
    card: &calc_sell
      type: calc
      title: ロジャーズの加入までに売った額は、何割か
      terms:
      - ['1億3230万ユーロ', 7月21日までの3人]
      - ['4億4445万ユーロ', 売った額]
      - [約30%, 7月21日までの割合]
      ops: ['÷', ＝]
  - text: 売った額の30%です。残る70%は、そのあとの話です。
    emph: true
    card: *calc_sell
  - text: 8月に、チャロバー、デラップ、ジャクソンが出ていきます。
    card:
      <<: *when
      highlight_row: [2, 3]
  - text: そして窓が閉まる9月1日。エンソら3人が、チェルシーを離れました。
    emph: true
    image: assets/images/20261017_chelsea_window/b02_enzo_w.jpg
    card:
      <<: *when
      highlight_row: 5
  - text: エンソ、ギウ、アダラビオヨの3人です。
    card:
      <<: *when
      highlight_row: 5
  - text: この1日だけで、1億7165万ユーロ。売った額の39%です。
    emph: true
    card:
      <<: *when
      highlight_row: 5
  - text: この夏の形は、買いが先、売りは最後の日まで。
    card: *when
  sources:
  - https://www.chelseafc.com/en/news/article/summer-transfers-2026-all-the-chelsea-ins-outs-and-new-contracts-so-far
  - https://www.chelseafc.com/en/news/article/marc-cucurella-departs-chelsea
  - https://www.chelseafc.com/en/news/article/morgan-rogers-signs-for-chelsea
  - https://www.chelseafc.com/en/news/article/enzo-fernandez-leaves--chelsea-on-permanent-transfer
  - https://www.chelseafc.com/en/news/article/marc-guiu-departs-on-permanent-transfer-rb-leipzig-
  - https://www.chelseafc.com/en/news/article/tosin-adarabioyo-departs-chelsea-on-permanent-transfer
  - https://www.chelseafc.com/en/news/article/transfer-deadline-day-2026-everything-you-need-to-know
  - https://www.premierleague.com/en/news/4664145/when-does-summer-2026-premier-league-transfer-window-open-and-close
- id: view
  viewpoint: true
  heading: 買値も売値も市場価値の約1.3倍。支出の上位4クラブでプラスなのはチェルシーだけ
  tier: 報道
  telop: 買った10人は市場価値の約1.31倍、売った10人は約1.27倍
  narrator: 解説
  card: &scat
    type: scatter
    title: 売った10人の、移籍直前の市場価値と、受け取った移籍金
    x: {label: 移籍直前の市場価値, unit: 百万ユーロ}
    y: {label: 受け取った移籍金, unit: 百万ユーロ}
    points:
    - [エンソ, 100, 145]
    - [サントス, 40, 56.3]
    - [ジャクソン, 40, 55.5]
    - [ククレジャ, 50, 55]
    - [デラップ, 28, 52.5]
    - [チャロバー, 40, 30]
    - [ジョージ, 20, 21]
    - [ギウ, 12, 15]
    - [アダラビオヨ, 16, 11.65]
    - [フォファナ, 4, 2.5]
    diagonal: 市場価値と同じ額
    focus: デラップ
  say:
  - text: 買値と売値は、相場より高かったのか。物差しは、移籍直前の推定の市場価値です。
    image: assets/images/20261017_chelsea_window/a01_stadium_w.jpg
    card: none
  - text: 市場価値は、サイトが付けた推定です。実際の値段ではありません。
    card: *scat
  - text: 買った10人の市場価値は、合計で3億1050万ユーロ。
    card: *scat
  - text: 払った額は、その約1.31倍です。
    emph: true
    card: &calc_in
      type: calc
      title: 買った10人は市場価値の何倍か
      terms:
      - ['4億748万ユーロ', 払った額]
      - ['3億1050万ユーロ', 直前の市場価値の合計]
      - [約1.31倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: 売った10人の側は、市場価値の合計が3億5000万ユーロ。
    card: *scat
  - text: 受け取った額は、その約1.27倍です。
    emph: true
    card: &calc_out
      type: calc
      title: 売った10人は市場価値の何倍か
      terms:
      - ['4億4445万ユーロ', 受け取った額]
      - ['3億5000万ユーロ', 直前の市場価値の合計]
      - [約1.27倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: 売った10人を図にします。斜めの線は、市場価値と同じ額です。
    card: *scat
  - text: デラップは、市場価値の約1.9倍で売れました。
    card:
      <<: *scat
      highlight: デラップ
  - text: 線より下は3人。チャロバー、アダラビオヨ、フォファナです。
    card:
      <<: *scat
      highlight: チャロバー
  - text: 市場価値より安く出たのは、10人のうち3人でした。
    card:
      <<: *scat
      highlight: アダラビオヨ
  - text: もう1つ、今夏の支出が多い4クラブを並べます。
    image: assets/images/20261017_chelsea_window/a02_stadium_aerial_w.jpg
    card: &top4
      type: table
      title: 世界の支出の上位4クラブ（百万ユーロ）
      columns: ['クラブ', '払った額', '戻った額', '差し引き']
      rows:
      - [シティ, '526.20', '337.02', '−189.18']
      - [チェルシー, '407.48', '447.80', '＋40.32']
      - [トッテナム, '366.35', '164.25', '−202.10']
      - [ニューカッスル, '313.00', '279.10', '−33.90']
  - text: 上位4クラブで、差し引きがプラスなのは、チェルシーだけです。
    emph: true
    card: *top4
    mark: {kind: circle, row: 1, col: 差し引き}
  - text: ほかの3クラブは、戻った額が払った額に届いていません。
    card:
      <<: *top4
      highlight_row: [0, 2, 3]
  - text: 世界2位の支出は、売った額が上回って、プラスで終わりました。
    emph: true
    card: *top4
  - text: ただし、どの額も集計です。内訳までは、見えていません。
    card: none
  - text: 次の窓は、冬。2027年1月1日に開きます。
    card: none
