  question: 今夏のチェルシーの移籍期間で、払った額と戻った額はどれだけ違い、差し引きはどうなったのか
  lead: この夏、世界で2番目に多く払ったクラブ。
  takeaway: チェルシーが今夏に払った額は4億750万ユーロで世界2位だが、選手を売って戻った額が4億4780万ユーロあり、差し引きは4030万ユーロ（およそ72億円）のプラス。プレミアでプラスのクラブは6つで、チェルシーは3番目。売ったのは10人で、エンソ・フェルナンデスら上の5人で82%、77%はプレミアのクラブから入った。買ったのは10人で、上の3人で63%。7月中に払った額の75%が決まり、売りの70%はロジャーズの加入（7月21日）のあと、窓が閉まる9月1日だけで39%だった。買った10人は移籍直前の推定の市場価値の約1.31倍、売った10人は約1.27倍。支出の上位4クラブでプラスなのはチェルシーだけ。クラブの発表に額は無く、額は報じられた移籍金の集計で、ロジャーズの報道はポンド（約1億1700万）。固定かボーナス込みかは公表されていない。冬の窓は2027年1月1日に開く
