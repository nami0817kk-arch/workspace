      paragraphs:
      - チェルシーは、アストン・ヴィラからイングランド代表のモーガン・ロジャーズの獲得を発表する。
      - 23歳のフォワードは、スタンフォード・ブリッジと2033年までの契約を結んだ。
      highlight:
      - 獲得を発表
      - 2033年
  - text: 書かれているのは、23歳であることと、契約が2033年までであること。
    card: *doc_rogers
  - text: ポンドでは、額はおよそ1億1700万と伝えられています。
    card: &gbp
      type: convert
      title: 報じられた額と、集計の額
      from: ['約1億1700万', ポンド, 報じられた額]
      to: ['1億3800万', ユーロ, 集計の額]
      via: 集計の額÷報じられた額＝約1.18
  - text: 集計のユーロは、その換算です。報道は、およそ、という言い方でした。
    card: *gbp
  - text: 固定か、ボーナス込みかは、公表されていません。
    card: none
    image: assets/images/20261017_chelsea_window/b01_rogers_w.jpg
  - text: 次はラクロワ。パレスから6070万ユーロ。
    image: assets/images/20261017_chelsea_window/b05_lacroix_w.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 1}
  - text: 3人目はパレストラ。アタランタから5700万ユーロ。
    image: assets/images/20261017_chelsea_window/b03_palestra_w.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 2}
  - text: 上位3人で、買った額の63%です。
    emph: true
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: [0, 1, 2]}
  - text: 4人目はケンダ。スポルティングから5078万ユーロ。
    image: assets/images/20261017_chelsea_window/b04_quenda_w.jpg
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 3}
  - text: ケンダの獲得は、2025年3月に、すでに決まったと発表されていました。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 3}
  - text: エメガも、2025年9月に合意が発表され、加入は2026年とされていました。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 5}
  - text: この2人を合わせて、7578万ユーロ。払った額の19%です。
    emph: true
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: [3, 5]}
  - text: 集計は、この2人も今夏の分に入れています。
    card: *inlist
  - text: 残る4人は、チャバリア、E・マルティネス、ウェルベック、サトパエフ。
    card: {type: table, title: 払った額の大きい順（移籍金の付いた10人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7], highlight_row: 6}
  - text: ヘンダーソンは移籍金なしで、額には入っていません。
    card: *inlist
  - text: いちばん高く買った1人と、いちばん高く売った1人を並べます。
    image: assets/images/20261017_chelsea_window/a01_stadium_w.jpg
    card: &duel
      type: duel
      left: {name: ロジャーズ, club: 買った（ヴィラから）, photo: assets/images/20261017_chelsea_window/b01_rogers_sq.jpg, color: "#034694"}
      right: {name: エンソ, club: 売った（シティへ）, photo: assets/images/20261017_chelsea_window/b02_enzo_sq.jpg, color: "#b8860b"}
      rows:
      - [チェルシーの発表日, 7月21日, 9月1日]
      - [年齢, 23歳, 25歳]
      - [移籍直前の市場価値, 0.9億€, 1億€]
      - [額（集計）, 1.38億€, 1.45億€]
      - [報じられた額, 約1.17億£, 1.25億£]
      bars: [移籍直前の市場価値, 額（集計）]
  - text: ロジャーズは23歳。エンソは25歳です。
    card: {<<: *duel, highlight_row: 年齢}
  - text: 移籍直前の市場価値は、9000万ユーロと、1億ユーロ。
    card: {<<: *duel, highlight_row: 移籍直前の市場価値}
  - text: 額は、買ったほうが1億3800万ユーロ。
    card: {<<: *duel, highlight_row: 額（集計）}
  - text: 売ったほうは、それを700万ユーロ上回ります。
    card: {<<: *duel, highlight_row: 額（集計）}
  - text: ロジャーズ1人の分を、エンソ1人が上回りました。
    emph: true
    card: {<<: *duel, highlight_row: 額（集計）}
