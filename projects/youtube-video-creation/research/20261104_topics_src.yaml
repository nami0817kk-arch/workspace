  why: ガゼッタ（4日朝）。2028年夏から10シーズン、1季5,000万ユーロで計5億超。プーマとは2018年からで、10年前は1季1,400万、2022年の更新で約3,000万。アディダスとはアンチェロッティ時代のCL優勝（2003・2007）のころの組み合わせ。ユヴェントスもアディダス（10季で4億800万）。<b>条件：日本代表に絡まない。本人の言葉は無い</b>。確度：報道（ガゼッタ。クラブの発表はまだ）。<b>重なり：10/30 にミランとインテルの新スタジアムの命名権の題（別の話）</b>。写真：ミランの選手・サン・シーロは Commons。時刻：18時以降可。見せ方：X。
