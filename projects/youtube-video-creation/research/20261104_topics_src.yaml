  why: サッカーキング（3日、スカイ経由）・スカイ（4日朝）。アトレティコ戦の前日会見で「今は非常に近い段階にある」「重要な部分は概ね合意に至っていて、僕たちも満足している」「数週間ではなく、数日以内には決まるはずだ」。現行契約は2027年6月まで。翌日のアトレティコ戦はバイエルンが2-0で勝った。<b>条件：日本代表に絡まない（伊藤洋輝は控えで出番なし）。本人の言葉あり → Y</b>。確度：本人の言葉は報道。<b>重なり：ケインの契約延長は10/14・10/16 にある。今回は本人が「数日」と言った新しい段階だが、近い題が多い</b>。時刻：18時以降可。見せ方：Y。
