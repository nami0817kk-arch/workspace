  head: テネリフェのFWデ・ミゲル（30歳）が、試合中のGKとの衝突のあと死去。CLのスペイン勢は試合前のアンセムを流さず黙祷
  why: ESPN（3日夜）・ゲキサカ・サッカーキング。2日のスペイン2部アンドラ戦の追加時間、飛び出したGKオウォノと胸で衝突して心停止、翌日にクラブが訃報を伝えた。試合は2-2で打ち切り。警察が捜査を始めたが、検察のトップは「プレー中の衝突なので刑事手続きになる見込みは低い」。ムバッペ・メッシ・ピケらが哀悼の言葉、バルサ・アトレティコ・ビジャレアルは CL のアンセムを流さなかった。<b>条件：日本代表に絡まない。他人（哀悼）の言葉だけ</b>。確度：確定（クラブの発表）。<b>注意：人の死を扱う。煽り・数字の強調はしない。GKオウォノへの中傷が起きているので、GKを責める形にしない。出すかどうかはユーザーが決める</b>。時刻：18時以降可。見せ方：X。
