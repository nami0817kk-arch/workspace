sections:
  - id: what
    heading: ウルグアイ戦の観衆
    tier: 報道
    telop: 観衆は4万4070人。久保は64分から出場
    narrator: キャスター
    say:
      - 9月24日のウルグアイ戦。宮城のスタジアムに、**4万4070人**が入りました。
      - 日本は3対1で勝利。久保建英は64分からの出場でした。
      - 試合のあと、久保はスタンドの雰囲気について聞かれています。
    sources:
      - https://www.soccerdigestweb.com/news/detail/id=197570
      - https://www.soccer-king.jp/news/japan/national/20260924/2209051.html
      - https://www.mundodeportivo.com/futbol/real-sociedad/20260924/1004230801/kubo-suplente-agita-ataque-japon-recta-final-dinamiza-triunfo-uruguay.html
  - id: request
    main: true
    heading: 久保の注文
    tier: 報道
    telop: 「むしろブーイングをして、こっちの後押しを」
    narrator: キャスター
    say:
      - text: 'ウルグアイ戦のあと、久保建英がスタンドについて話した言葉です。'
        short_only: true
      - 笑いを交えながら、こう話しています。
      - voice: 久保建英
        text: 雰囲気は良かったと思いますけど、強いて言うならば、相手のチャンスで盛り上がってほしくない
      - voice: 久保建英
        text: キーパーの早川選手がセーブしたのに盛り上がっていたのなら、いいんですけど
      - voice: 久保建英
        text: その前のサイドチェンジとかで盛り上がらずに、むしろブーイングをして、こっちの後押しをしてほしい
      - ベンチで、ほかの選手たちとそう話していたそうです。
      - 前半をベンチで見ていた久保は、こうも話しています。
      - voice: 久保建英
        text: 後半にピッチに入っちゃったら、選手は意外とわからないんで。外から見てたら、ちょっと思いました
    sources:
      - https://www.soccerdigestweb.com/news/detail/id=197570
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「代表戦は普段見ない層が多い」と「久保の言う通り」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 代表戦て普段サッカー見に行かない層がかなり多いから無理だな。Jリーグの試合でも相手の好プレーにはおおおとなるし。ブーイングの下品な行為よりそっちの方が好きだけどね
      - voice: ネット民
        text: 久保選手の言う通り、欧州のリーグのように不甲斐ない試合をしたり、シュートを外したりすれば即、ブーイングなど良くある。それくらい緊張感がある試合を経験しているから強くなれる。確かに選手を後押しするチャントやコールは、必要だけど、それだけじゃ強くなれない
      - voice: ネット民
        text: それは日本では無理よ(笑)サッカー観戦知らない人が8割やから！ヨーロッパと比べちゃだめよ(笑)だから日本は優勝なんて無理なんよ！やる側のレベルに見る側のレベルが全くついて行けてないのが現状。今日のスタジアムがそう。トラックはある、コンサート会場のようにずっと歌ってる、戦う雰囲気はないよね
      - voice: ネット民
        text: 現地観戦してきた地元のベガサポですが、勝ち点を奪い合う予選ではなく親善試合でもあり、確かに普段とは真逆のスタイルで楽しんでしまいました。久保さんスミマセン…それにしても、選手交代時には「ウォー」ではなく「キャー」※選手による。サッカーの内容はあまり関係ないファンも多かったね。まあそれも含めての代表人気かな
      - voice: ネット民
        text: 岩手から観に行きました。仙台開催は８年ぶりです。８年ぶりにサッカーの試合を見に行きました。東北中から普段はサッカーの試合を見に行くことができない人たちが見に来ていた印象です。ブーイングなんてやったことないし、普通に感情のままに見ていただけ。地方では難しい注文かなと
      - voice: ネット民
        text: 日本の勝利を見たいってより代表選手のプレーを見たいってのが基本だからなあ。相手のプレーもすごけりゃ喜ぶ。特に地方開催だとその傾向が強くなる。オールスター戦がおらが街に来たってのに近い。これはこれでアリだが。さすがにワールドカップのブラジル戦とかで相手のすげえプレーには悲鳴飛ぶと思うから
      - voice: ネット民
        text: 観客に注文つけるのはおかしい。金を払ってみに来てるから好きな様に楽しみたい。欧州がどうとか関係ない。ここは日本。相手だろうが良いプレーには自然とおー！となる。それがふつう。ブーイングのリクエストなんて程度が低すぎる
      - voice: ネット民
        text: 相手へのリスペクトに欠ける行為を求めるのはどうでしょうね…勝敗も大事、ただ日本の美徳を損なう様な要求はしてほしくないな
      - voice: ネット民
        text: 代表の応援確かに面白く無いよな。代表戦はお祭りみたいな所があるから仕方ないけど､､､歌もいつも一緒やし世界一目指すなら世界一の応援団が必要やと思う！
      - voice: ネット民
        text: 相手にブーイング遠慮するのはむしろ誇らしいと思うよ
      - voice: ネット民
        text: ミーハーな代表観客にムチャ言うなよ。浦和サポでもあるまいし
      - voice: ネット民
        text: 優しい世界。純粋にサッカー見てていいじゃん。大型連休あけの木曜夜の宮城に4万人も集めるって凄いな
        short_voice: true
    sources:
      - https://news.yahoo.co.jp/articles/6f75691c53000c282bf2a86f375ee0cdb1133a75/comments
