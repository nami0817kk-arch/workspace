#       "I can definitely say that I feel good. I'm in a good place. The team is in a good place most importantly."
#       地の文: 今季の得点は10に。6試合続けて敵地で得点したのは、クラブの歴史で8人目。
#   ・「Alexander Isak joins Liverpool greats with away scoring streak」（11/25 20:46 UTC）: 敵地6試合連続得点はクラブ史上8人目。
#       それまでの5試合はクリスタル・パレス、フェネルバフチェ、ブレントフォード、ボーンマス、イプスウィッチ。並んだのはサラーやバーンズら。
