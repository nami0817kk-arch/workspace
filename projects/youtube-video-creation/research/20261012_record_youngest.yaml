# 記録の解説：最年少（10/12 月、シリーズ「記録の解説」、key: record_youngest、型は news）。
#   記録の種類の並び：得点（10/9）・出場（10/10）・連勝（10/11）→ **最年少**。
#   どの記録かは材料を見て決めた：**チャンピオンズリーグの最年少出場**（UEFA が 2026-05-31 に出した公式の一覧が根拠）。
#
# 軸は「**記録が動く間隔が、26年から5年に縮んだ**」。
#   主役は**15歳308日で出場したアーセナルのダウマン**（2025-11-04）。前の保持者はドルトムントのムココ（16歳18日、2020-12-08）。
#   **ヤマルは主役にしない**（10/4「19歳のヤマルとメッシ」・10/1 選手紹介）。上位7人の表に1行だけ入る（UEFA の一覧にいる）。語りでは名前を出さない。
#
# 同じ日の他の回と重ねないようにしたもの：
#   スタジアム＝ブレントフォード／クラブ紹介＝レバンテ／ユニフォーム＝イプスウィッチ／移籍・比べる・選手紹介＝アトレティコ（アルバレス）／財政＝リヴァプール。
#   ★**ンワネリのプレミア最年少出場（15歳181日）の試合の相手は、ブレントフォードだった**。台本では**相手を言わず「2022年のンワネリ」だけ**にした。
#   ★ハーヴィー・エリオット（リヴァプール）の名前も出さない（同じ理由）。
#   10/9（1シーズン最多得点）・10/10（代表の通算出場）・10/11（連勝）の選手・クラブ（レヴァンドフスキ・メッシ・ロナウド・ソー・チンアン・ベンフィカ・マンC・インテル）は出さない。
#
# **一次情報まで辿れた所**:
#   ○ **UEFA の公式記事**（uefa.com、2026-05-31）「Youngest Champions League players and winners」＝最年少出場の上位7人（年齢・日付・試合）と最年少優勝。
#   ○ **UEFA の公式記事**（同日）「Youngest Champions League goalscorers」＝最年少得点の上位10人（ファティ 17歳40日・2019-12-10）。
#   ○ **UEFA の公式記事（2020-12）**「Moukoko becomes youngest Champions League player」＝ムココの記録（16歳18日、前の保持者ババヤロ16歳86日）と
#       「ババヤロの記録から10年に3日足りない日に生まれた」。
#   ○ **アーセナル公式**（arsenal.com「Dowman becomes youngest Champions League player」、2025-11）＝72分の出場・1992年に今の名前になってから最初の15歳・
#       当時の上位10人の表・「2027年2月まで」。
#   ○ **ESPN の試合記録（scoreboard／summary）**：Slavia Praha 0-3 Arsenal（2025-11-04、32分サカPK・46分と68分メリーノ・**72分 ダウマンがトロサールと交代**）、
#       Zenit 1-2 Dortmund（2020-12-08、**58分 ムココがパスラックと交代、その時 0-1**、68分ピシュチェク・78分ヴィツェル）、
#       ヘルタ 2-5 ドルトムント（2020-11-21、**85分 ムココがハーランドと交代**）、ほか上位7人の交代の分（パヴィッチ72・ヤマル68・シェルキ75・サルモン83）。
#   ○ **プレミアリーグ公式**（premierleague.com、2022-09-18）＝ンワネリのプレミア最年少出場 15歳181日。
#   ○ **ブンデスリーガ公式**（bundesliga.com）＝ムココが「史上最年少の選手（16歳1日）」。
#   × **ババヤロの試合（1994-11-23、アンデルレヒト対ステアウア 1-1）の試合記録・出場の分は取れなかった**（ESPN に無い）。台本では日付と年齢だけ（UEFA の表）。
#   × **UEFA の規定の原文で「なぜ15歳が登録できたか」は辿れなかった**。2026/27 の大会規則（第31条31.12）は「リストB＝2005年1月1日以降生まれで、15歳の誕生日から2年…」と
#       読めるが、15歳308日のダウマンがどの規定で登録されたかは**確認できていない**（2025/26 の規則の頁は 404）。だから台本では**理由を書いていない**。
#   × ESPN の予定表は 2026-09-10 の第1節までで、ダウマンはナポリ戦（9/9）に出ていない。**9/10 以降のチャンピオンズリーグで得点があったかは確かめられない**。
#       「ファティの記録は5月31日の時点で…」と**UEFA の一覧の日付つき**で言う。
#   ※**材料どうしの食い違い**：UEFA の2020年の記事は「11月21日（16歳の誕生日）にブンデスリーガ最年少デビュー」と書くが、ムココの誕生日は11月20日（UEFA の「10年に3日足りない」と
#       ババヤロの試合日から逆算して合う）。ブンデスリーガ公式の頁は「16歳1日」と書きつつデビューを11月22日と書く。**試合記録（ESPN）は11月21日**。台本は「誕生日の翌日、11月21日」にした。
#       ESPN の分は試合後の記録、アーセナル公式は72分で一致。ウィキペディアは別の分（82分）を書く記事もあったが採らない。
#
# 自分で計算した数（機械は検算しない。誕生日は ダウマン 2009-12-31・ムココ 2004-11-20・ババヤロ 1978-08-29。年齢は UEFA の表と一致を確認）:
#   ダウマンの出場日 5787日・ムココ 5862日 → **75日**若い（16歳18日 − 15歳308日）。ババヤロ 5930日 → ムココは**68日**若い。
#   ババヤロの記録が残った期間 1994-11-23 → 2020-12-08 ＝ **9512日**（26年15日）。ムココの記録 2020-12-08 → 2025-11-04 ＝ **1792日**（4年と10か月27日、約4年11か月）。9512 ÷ 1792 ＝ 5.31 →「約5.3倍」。
#   上位7人の差：サルモン 5947日 − ダウマン 5787日 ＝ **160日**。
#   上位7人のうち 2019-11-27 以降は6人（シェルキ・ムココ・ヤマル・ダウマン・サルモン・パヴィッチ）。それ以前は1994年のババヤロだけ。
#   分がわかる6人の交代：72・58・72・68・75・83 → 平均 71.3分。
#   ダウマンの16歳の誕生日は出場の57日後（2025-12-31 − 2025-11-04）。
#   ファティ（17歳40日、2019-12-10）の記録が 2026-05-31 まで残った日数 **2364日**。2364 ÷ 1792 ＝ 1.32（ムココの記録の1.3倍）。
#   ダウマンが17歳40日になる日 ＝ 2027-02-09（2026-12-31 ＋ 40日）。アーセナル公式の「2027年2月まで」と一致。
#   プレミアの最年少出場 15歳181日（ンワネリ）とダウマンの15歳308日の差 ＝ 308 − 181 ＝ **127日**。
#   ムココの2つの記録のあいだ：2020-11-21 → 2020-12-08 ＝ **17日**。
#
# **言い切っていないもの**:
#   ・「出場の分がわかる6人」＝ババヤロ（1994）は ESPN に無いので数えていない。UEFA の記事で「交代」とあるのはダウマン・パヴィッチだけ。残りは ESPN の交代の記録で確かめた。
#   ・ババヤロの記録は「26年残った」と言う（UEFA の表の日付から数えた。UEFA が「ババヤロの前の記録」を挙げていないので、ババヤロの前は言わない）。
#   ・ダウマンの得点の見込みは言わない。「それまでに点を取れば、記録を抜く」という**条件の話**だけ。
#
# **同じ日の「比べる」（ドルトムント×モナコ、research/20261012_compare_dortmund_monaco.yaml）とクラブ名を重ねないため、台本・板・下地で「ドルトムント」を一度も言っていない**
#   （ムココは「ムココ」とだけ言う。上位7人の表は**クラブの列を外して「相手」の列**にした＝UEFA の一覧の試合の相手）。ハーランドは人名として出る（ヘルタ戦で交代した相手。比べるの回には出ていない）。
#   ※依頼文には「比べる」の2クラブの名前が無く、ドルトムント×モナコだと分かったのは書き終わりの点検で research/ を見たとき。**ムココの所属が言えないぶん、説明がやや遠回しになった**。
# 写真は assets/backgrounds/ の1枚だけ（スラヴィア・プラハの本拠地の中。**1本のあいだ変えない**）。
#   stadium_スラヴィア・プラハ_in.png は 10/11 にこのセッションで取った（Commons・CC BY 4.0 / Vojtasekd、File:Stadion Eden tribuny (5).jpg）。
#   顔の写真は使っていない（ダウマン・ムココの写真は Commons に自由に使えるものを探していない）。
# アルファベットは読み上げに出さない（チャンピオンズリーグ・UEFA は「ヨーロッパ連盟」と言い換えるか言わない）。
# サムネは構図 number（同じ日のもう1本＝財政リヴァプールも number なので、**2本で構図が同じになる**。案B（versus）・案C（scene）も報告に出す）。
#   **ユーザーと相談して決める**ので、ここに書いたのは案A。
