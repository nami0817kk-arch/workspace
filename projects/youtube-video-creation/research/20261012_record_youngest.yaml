- id: view
  viewpoint: true
  heading: 見立て・記録が動く間隔を数える
  tier: 背景
  telop: ババヤロの記録は9512日、ムココの記録は1792日。間隔は約5.3倍縮んだ
  narrator: 解説
  card: &gap_calc
    type: calc
    title: 記録が残った日数（自分で数えた）
    terms:
    - - 9512日
      - ババヤロの記録
    - - 1792日
      - ムココの記録
    - - 約5.3倍
      - 長さの比べ
    ops:
    - ÷
    - ＝
  say:
  - text: ここからは、日数を数えて比べます。
    card: *gap_calc
  - text: ババヤロの記録は、1994年から2020年まで。9512日、残りました。
    card: *gap_calc
  - text: ムココの記録は、2020年から2025年まで。1792日です。
    card: *gap_calc
  - text: 割ってみると、およそ5.3倍。
    card: *gap_calc
  - text: 更新の間隔が、5分の1に縮んだことになります。
    emph: true
    card: *gap_calc
  - text: 得点の記録は、動いていません。ファティの17歳40日は、2019年12月からです。
    card: &view_table
      type: table
      title: 自分で数えてみた
      columns: &view_cols
      - 比べ
      - 答え
      rows: &view_rows
      - - ババヤロの記録 ÷ ムココの記録
        - 約5.3倍
      - - ファティの記録（5月31日まで）
        - 2364日
      - - プレミアの最年少出場との差
        - 127日
      - - プレミアの最年少得点の記録
        - 7643日
      highlight_row: 1
  - text: 5月31日の時点で、2364日。ムココの記録の1792日を、もう超えています。
    emph: true
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 1
    mark:
      kind: circle
      row: 1
      col: 1
  - text: プレミアリーグの最年少出場は、2022年のンワネリで15歳181日。
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 2
  - text: チャンピオンズリーグの記録とは、127日の差があります。
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 2
  - text: プレミアの最年少得点は、2005年から2026年まで。
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 3
  - text: 7643日、動きませんでした。
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 3
  - text: ムココの記録の、およそ4.3倍です。
    card:
      type: table
      title: 自分で数えてみた
      columns: *view_cols
      rows: *view_rows
      highlight_row: 3
  - text: 次に動くとしたら、チャンピオンズリーグの得点の記録かもしれません。
    card: none
  - text: ダウマンの誕生日は12月31日。17歳40日になるのは、2027年2月9日です。
    card: none
  - text: それまでにチャンピオンズリーグで点を取れば、ファティの記録を抜きます。
    emph: true
    card: none
