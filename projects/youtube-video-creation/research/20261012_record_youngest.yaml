- id: plrec
  heading: ダウマンは、プレミアの記録も動かした
  tier: 確定
  official: true
  telop: 2026年3月14日、16歳73日でプレミア最年少得点。2005年の記録を197日更新
  narrator: 解説
  card: &pl_table
    type: table
    title: プレミアリーグの最年少得点
    columns: &pl_cols
    - 選手
    - クラブ
    - 年齢
    - 試合の日
    rows: &pl_rows
    - - ダウマン
      - アーセナル
      - 16歳73日
      - 2026.3.14
    - - ヴォーン
      - エヴァートン
      - 16歳270日
      - 2005.4.10
  say:
  - text: ダウマンは、プレミアリーグの記録も動かしています。
    card: *pl_table
  - text: 2026年3月14日、エヴァートン戦。74分に交代で入ります。
    card:
      <<: *pl_table
      highlight_row: 0
  - text: 1点リードの、アディショナルタイム7分。相手のGKまで攻め上がった場面でした。
    card:
      <<: *pl_table
      highlight_row: 0
  - text: ボールを拾って、ピッチの半分近くを運び、無人のゴールに流し込みます。
    card:
      <<: *pl_table
      highlight_row: 0
  - text: 16歳73日。プレミアリーグの最年少得点です。
    emph: true
    card:
      <<: *pl_table
      highlight_row: 0
    mark:
      kind: circle
      row: 0
      col: 2
  - text: それまでの記録は、エヴァートンのヴォーン。16歳270日でした。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: 197日、更新したことになります。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: ヴォーンが決めたのは、2005年4月10日。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: エヴァートンが4対0で勝った試合でした。
    card:
      <<: *pl_table
      highlight_row: 1
  - text: その試合の先制点は、のちにアーセナルの監督になるアルテタです。
    card: none
  - text: 記録が生まれた日と、破られた日の両方に、同じ人がいました。
    card: none
  sources:
