  question: 最年少出場の記録は、どこまで若くなったのか
  lead: 15歳で、ヨーロッパの最高峰に立った選手。
  hook: その記録は、26年間、動かなかったものでした。
  takeaway: チャンピオンズリーグの最年少出場は、アーセナルのダウマンの15歳308日（2025年11月4日、スラヴィア・プラハ戦の72分）。それまではムココの16歳18日（2020年12月8日、ゼニト戦）で、75日更新した。ムココの前の記録はアンデルレヒトのババヤロの16歳86日（1994年11月23日）で、68日更新。ババヤロの記録は26年（9512日）、ムココの記録は4年と11か月（1792日）で破られ、更新の間隔は約5.3倍縮まった。UEFAの5月末の一覧では上位7人のうち6人が2019年11月以降の出場で、1位から7位までの差は160日。ほかの最年少の記録は、得点がバルセロナのファティの17歳40日（2019年12月10日）、優勝がアヤックスのカヌの18歳296日。ファティの記録は5月31日の時点で2364日残っていて、ムココの記録の約1.3倍。ダウマンが17歳40日になるのは2027年2月9日で、それまでにチャンピオンズリーグで得点すれば最年少得点の記録を更新する。プレミアリーグの最年少出場は2022年のンワネリの15歳181日で、チャンピオンズリーグの記録とは127日の差。ダウマンは2026年3月14日、プレミアリーグでも最年少得点（16歳73日）を決め、2005年4月10日にエヴァートンのヴォーンが作った16歳270日の記録を197日更新した。その記録は7643日残っていて、ムココの記録の約4.3倍
  opening_image: assets/backgrounds/stadium_スラヴィア・プラハ_in.png
