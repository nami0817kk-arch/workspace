title: 10月17日の題材
lead: 今日は土曜、金曜夜の試合（ブンデス・セリエA・リーグ・アン）の翌日で、欧州カップ戦の夜ではありません。日本人は10件、続いて欧州の大きい話を20件。ショートは10本、本編はシリーズ8本が予約済みです。
note: '**今日はカップ戦の無い日**で、日本人の出来事は「試合」より「負傷・復帰・契約」が中心です。堂安・小杉のフランクフルト戦（16日夜）が唯一の新しい試合です。

  **ロマーノなど移籍記者のXは、今回は読めませんでした**（ブラウザ・Xの読み取りの禁止のため）。移籍の話は、ベリンガム（アス）・シセ契約とトレゾルディ（ガゼッタ）・デビッド（レラボ）・オルモ（スポルト）・ファルケ（アスレティック）と、**媒体の報道**として入れています。

  **日本人本人の言葉が取れるのは宇野禅斗（クラブ公式サイトのインタビュー）の1件**です。上田・三笘・冨安は監督の言葉、堂安・小杉・田中の本人コメントは見つかりませんでした。

  10/14〜10/16 に出した題材と重なる続報（上田・冨安・佐野・トレゾルディ・マルティネス・オリーズ・ラウタロ・ローマ ほか）には **弱い印**を付けています。今日試合がある題材（マレスカ・アルベロア・フリック・アッレグリ・冨安）は試合後に作る決まりです。

  '
