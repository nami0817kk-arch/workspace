# スタジアム紹介シリーズ②：エミレーツ・スタジアム（アーセナル、10/10）。材料の控えは research/raw/20261010_stadium_emirates_material.md。
# **節の並びは1本目（ヴァイタリティ／ボーンマス 10/9）と同じ型**：オープニング → 基礎DATA(main・強い一点を頭に) →
#   この競技場だけの話(年表) → ここで起きた試合(表) → 見立て(viewpoint・自分で数えた比べ)。**文は全部言い換えてある**（重なり対策は材料の §9）。
# 強い一点：**公開日の5日前（2026-10-03 報道）に、アーセナルが約5億ポンドの拡張計画をやめた。**
#   7万〜8万席を検討していたが、ホスピタリティ・物販・観戦日の設備へ振り向けることにした。
#   **確度は報道。クラブの公式発表は見つかっていない**（arsenal.com に当たる発表が無い。原報は The Times）。
#   台本は「伝えられています」「報じられました」の線を越えない。
# **最多入場の記述が Wikipedia 内で食い違っている**（Infobox＝2024-10-27 リヴァプール戦／Records 節＝2019-11-02 ウルヴス戦。どちらも 60,383）。
#   → 台本では**最多入場そのものを言わない**。収容に対する入りの割合（99%台）だけを使う。
# 20クラブの比べは research/pl_data/rank.json（各クラブの基礎DATAの板の字から数えたもの、2026-09 時点）。
#   74,158 ÷ 60,704 = 1.2216 →「1.22倍」「82%」／中央値 38,838.5 → 1.5630 →「1.56倍」／12,357 → 4.9125 →「4.91倍」。
#   **いちばん小さい器（ボーンマス）は名前を出さず「いちばん小さい器」と言う**（自分のチャンネルの過去回に触れない決まり）。
# 2006-08-19 ヴィラ戦：**最初の得点は相手のメルベリ53分**。ジウベルトの得点時間は BBC が「six minutes before the end」としか書いていないので
#   **分を断定しない**（「終了まで6分というところで」）。**入場者数は記事に無いので言わない**。
# 2026-05-05 アトレティコ戦は「20年ぶり、クラブ史2度目の決勝進出」までにとどめ、**決勝そのもの（PSG戦）には触れない**。
#   → 同じ日に公開するもう1本（クラブの財政・パリ・サンジェルマン）と**同じ試合でつながるため**、2本とも決勝の試合には触れていない。
# 日本との接点：**冨安健洋が2023-10-28 に96分で初得点**（アーセナルの選手としてプレミアで得点した最初のアジアの選手）。
#   **題にもサムネにも出さない**。試合の節の最後に3行だけ。**その試合の入場者数は確認できなかったので言わない**。
# ヴェンゲルの言葉は Wikipedia 本文に残る引用で、**確度は報道**。
# 10/8 のアルテタ回が「10月10日、ホームでのリーズ戦」で締めているので、**当日のリーズ戦には触れず、3日後のリール戦で締める**。
# 媒体名は画面にも読み上げにも出さない。出典は節の sources に置く。
# 写真は assets/backgrounds/ から assets/images/20261010_stadium_emirates/ へ写した2枚
#   （01_w＝ピッチと4層のスタンド／02_w＝上空からの外観。どちらも Commons・CC BY-SA、credits.json も同じ場所に置いた）。
#   **assets/backgrounds/ のまま使うと、ショートが assets/stats/stadium_アーセナル_v.png（クラブ紹介②の基礎DATAの縦板）に化ける**（1本目で踏んだ）。
