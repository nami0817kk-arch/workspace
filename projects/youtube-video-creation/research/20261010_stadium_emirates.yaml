      - - 建設費 ÷ 増えた2万2285席
        - 1席 約1万7500ポンド
      - - 5億ポンド ÷ 9296席
        - 1席 約5万3800ポンド
      - - 1席の値段の比
        - 3.07倍
      - - 5億ポンド ÷ 建設費
        - 1.28倍
      - - 7万席にしたときの順位
        - 2番目（やめて5番目のまま）
  - text: ハイバリーの3万8419席から6万704席へ。増えたのは2万2285席でした。
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 0
  - text: 建設費3億9000万ポンドを席数で割ると、1席あたり約1万7500ポンドです。
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 0
  - text: 1万7500ポンドが5万3800ポンドへ。1席の値段は3.07倍です。
    emph: true
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 2
    mark:
      kind: circle
      row: 2
      col: 1
      text: 3倍を超える
  - text: 5億ポンドは、器そのものを建てたときの額の1.28倍にもあたります。
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 3
  - text: 建てるより、広げるほうが高い。これがやめた側の答えだと見ています。
    card: none
  - text: 工事のあいだ、ウェンブリーなどへ一時的に移る必要も理由に挙がっています。
    card: none
  - text: かわりに進むのは、立ち見の区画と、ケータリングや物販の作り替えです。
    card: none
  - text: 7万席にしていれば、20クラブで2番目の器になるはずでした。
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 4
  - text: やめたので、5番目のまま。ここまでは、すべて報じられた内容です。
    card:
      type: table
      title: 1席あたりの値段を並べた（自分で割った）
      columns: *cols_view
      rows: *rows_view
      highlight_row: 4
  - text: クラブ自身の発表は、いまのところ出ていません。
    card: none
  - text: はっきりしているのは、入りのほうです。2024-25は平均6万251人。
    image: assets/images/20261010_stadium_emirates/01_w.png
    card: none
  - text: 2025-26は6万217人、今季のホーム2試合は6万169人でした。
    card: none
  - text: どれも収容の99%台です。増やさなくても、席は毎回うまっていきます。
    card: none
  - text: ヴェンゲルが挙げた平均5万4000人の線を、いまは毎試合6000人上回っています。
    card: none
  - text: 次にここが埋まるのは3日後、10月13日。
    card: none
  - text: チャンピオンズリーグのリーグフェーズ、リールとの試合です。
