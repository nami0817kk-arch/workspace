  topic: アーセナル
  title: アーセナルの本拠地、3季つづけて99%が埋まる。それでも席を増やさないのか
  question: 毎試合ほぼ満席のこの競技場で、なぜ席を増やさないことになったのか
  lead: 前の家から、わずか450メートルの場所に建った器。
  hook: 5日前、この器をめぐる大きな計画が1つ消えました。
  takeaway: エミレーツ・スタジアムは収容6万704人で、プレミアリーグ20クラブの中では5番目。最大のオールド・トラフォード7万4158人の82%にあたり、2位から5位までの差は数百人しかない。2026年10月3日、アーセナルが7万席を超える規模への拡張をやめ、ホスピタリティ・物販・観戦日の設備へ投資先を移したと報じられた。費用は5億ポンド規模とされ、工事のあいだ本拠地を一時的に移す必要があることも理由に挙げられている。2004年の建設では建設費3億9000万ポンドをハイバリーから増えた2万2285席で割ると1席あたり約1万7500ポンドだったが、7万席にするために増える9296席で5億ポンドを割ると1席あたり約5万3800ポンド、3.07倍になる。公的な補助はゼロで、2004年に銀行団から2億6000万ポンドを借り、2006年に欧州のクラブとして初めて公募の資産担保債へ切り替えて年間の返済を約2000万ポンドに下げた経緯がある。リーグ戦ホームの平均は2024-25が6万251人、2025-26が6万217人、今季の2試合が6万169人で、3季つづけて収容の99%台。3日後の10月13日、ここでチャンピオンズリーグのリーグフェーズのリール戦が行われる
  opening_image: assets/images/20261010_stadium_emirates/01_w.png
