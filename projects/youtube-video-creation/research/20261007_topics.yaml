  head: 久保建英は「1月にソシエダを去る」とスペイン紙。序列が下がり、アジアカップで最大11試合いなくなる
  why: スペイン『Estadio Deportivo』（10/5）と地元紙『Diario Vasco』の報道。契約は2029年6月まで、適切なオファーなら途中でも交渉に応じると。25（仕組みの解説）と同じ話の芯なので、出すならどちらかを主にする
  src: Estadio Deportivo・Diario Vasco（10/5）
  url: https://football-tribe.com/japan/2026/10/06/360097/
