title: 10月7日の題材
lead: シリーズ6本はこちらで決めました。ニュースは16件から○×をお願いします
note: '<b>ニュースに○×を付けてください。</b>明日の本編10本は、シリーズ6本＋ニュース4本（日本人3・ほか1）の予定です。シリーズ（21〜26）はこちらで決めました。外したいものには×を、入れ替えたいときは予備（27・28）に○を付けてください。<br>メッシの代表最後の試合（対ベナン）は日本時間7日の朝8時キックオフで、結果は10時ごろに出ます。クロアチア対スペインは7日の3時45分開始です。どちらも試合後に作ります。<br>ロマーノの X は、手元の Chrome に繋がらず読めませんでした。移籍の話は Sky・独紙・スペイン紙から拾っています。'
items:
- num: 21
  slot: シリーズ
  fmt: 記録
  head: ハリー・ケイン、イングランド代表の最多得点記録に並んだか（チェコ戦のあと）
  why: 昨日から回した回。チェコ戦（7日 3:45）に出たか・決めたかを入れて作り直す。バイエルンと2029年までの延長の報道（独スカイ）もここに1行で入れる
  src: BBC・Sky Sports・t-online（10/6）
- num: 22
  slot: シリーズ
  fmt: 数字で見る
  head: FIFAランキング更新、W杯のあと最初の代表ウィークで上がった国・下がった国
  why: 昨日から回した回。7日21時の公式の発表を待って、日本・韓国・スペイン・クロアチアなどの順位を並べる
  src: FIFA（10/7 発表）
- num: 23
  slot: シリーズ
  fmt: クラブ紹介
  head: ラ・リーガ紹介⑧デポルティーボ
  why: 9/26 に作った台本を、今季の数字・見立ての節・冒頭の強い一点に合わせて直して出す（セルタの続き）
  src: 作り置き（20260926_ll08_deportivo）
- num: 24
  slot: シリーズ
  fmt: 選手紹介
  head: 選手紹介⑦ヴィニシウス・ジュニオール（レアル・マドリード）
  why: 11月14日に日本と戦うブラジルのエース。昨日のブラジル代表紹介の回の続きとして見られる。ベリンガムと同じ形で作る
  src: 選手紹介の型（tools/player_intro.py）
- num: 25
  slot: シリーズ
  fmt: 仕組みの解説
  head: アジアカップで久保建英は最大11試合いなくなる？代表の招集とクラブのルール
  why: 水曜の「仕組みの解説」。アジアカップ（2027年1月）は欧州のシーズン中で、大会の12日前から招集できる。クラブは断れるのか、何試合欠けるのかを、FIFA の規定の原文まで辿って説明する
  src: FIFA の選手の地位と移籍に関する規則（付属文書1）・Estadio Deportivo（10/5）
- num: 26
  slot: シリーズ
  fmt: 監督の経歴
  head: トルシエ、日本代表を初めてW杯の決勝トーナメントへ。フラット3と4年間の数字
  why: 森保・ハリル・ザッケローニに続く、日本代表の監督の経歴。2002年日韓W杯ベスト16。勝率と大会ごとの成績を数字で並べる
  src: JFA・Wikipedia（原文まで辿る）
- num: 27
  slot: シリーズ（予備）
  fmt: 若手の数字
  head: ゴールデンボーイ2026の最終候補25人。プレミアから最多、バルセロナは3人
  why: 21歳以下の欧州最優秀の候補。今季の出場時間と得点・アシストを同じ物差しで並べる
  src: トゥットスポルト（10/5〜6）
- num: 28
  slot: シリーズ（予備）
  fmt: クラブの財政
  head: マンチェスター・シティの判決、ほかのクラブはどう見ているか
  why: 10/1 に判決の中身は出した。今回は罰の重さ（勝ち点・降格）をめぐる他クラブとキャラガーの声。出すなら判決の文書と突き合わせる
  src: Sky Sports・The Athletic（10/6）
