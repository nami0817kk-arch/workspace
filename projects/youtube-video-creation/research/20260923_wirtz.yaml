    say:
      - 去年の夏、当時のクラブ史上最高額、**約200億円**でレバークーゼンから来たヴィルツ。
      - 相手ゴールに近い位置でボールに触る回数は、1試合50回から**35回**に減りました。
      - 代表戦の期間に入って、ファンのあいだで評価が割れています。
    sources:
      - https://www.footballchannel.jp/2026/09/22/post1016526/
      - https://www.espn.com/soccer/story/_/id/50000502/liverpool-give-florian-wirtz-already-a-superstar-progress
  - id: voices
    main: true
    heading: ネットの声
    tier: 未確認
    telop: ファンが書いていたこと
    narrator: キャスター
    say:
      - text: '約200億円で来たヴィルツに、リヴァプールのファンの評価が割れています。'
        short_only: true
      - voice: ネット民
        text: 悪いのはヴィルツじゃない。2004年のロナウジーニョを獲ったと思ってるリヴァプールのファンが悪い
      - voice: ネット民
        text: 他のビッグクラブが1億ポンド以上払った創造的な選手が、リーグ戦38試合でゴールとアシスト合わせて9つだったら、リヴァプールのファンは失敗だと言ってるはずだ
      - voice: ネット民
        text: ヴィルツにすごい才能があるのはみんな知ってる。あとはリヴァプールで、周りの選手とつながる方法を見つけるだけだ
      - voice: ネット民
        text: リバプール来てからのヴィルツってワンタッチのパスがズレるシーンが多い気がするんだよね。あれってパスが狙いから外れているわけじゃなくて、ボールはイメージ通りだけど味方がいない(来てない)ってパターンもけっこうあるんじゃないかな。あれが繋がるようになるとヴィルツ個人のスタッツもチーム全体の成績も上がるだろうから、中心に据えるなら周りにもう少しイメージ共有できる選手を増やさないとダメなんじゃないかな
      - voice: ネット民
        text: ヴィルツだけが悪いわけじゃない。そもそも攻守のバランスも悪いし、スロットの時から今まで本人も周りもポジションがころころ変わる中でプレミアの強度にも順応しなきゃいけない。なかなか大変だと思う。今季はトップ下固定でシーズン始まったばかりだし、これからシーズン中に上がっていけばいいと思ってる
      - voice: ネット民
        text: ヴィルツに関してはマジでただただ守備タスク与えすぎなだけだと思うんだけど。ソボと役割逆でしょ
      - voice: ネット民
        text: ヴィルツが今シーズンずっと不調みたい扱いすんのは流石に違うと思うけどな。フォレスト戦とかめっちゃ良かったと思うけど。
      - voice: ネット民
        text: ヴィルツを叩いて、リヴァプールのプレーがどう良くなるんだ
      - voice: ネット民
        text: くだらないことを言ってないで、選手が成長して成熟するのを待とうよ
      - voice: ネット民
        text: ヴィルツに見切りをつけるのは早いんじゃないかな。今はプレッシングが個人で行く場面が多い。組織的になり、負担が減れば攻撃で違いを作れると思う。今シーズンは様子見でいいと思う。
      - voice: ネット民
        text: ヴィルツはめちゃくちゃ良い選手ですよ。そもそもレバークーゼンとは役割も違うから。やっとイサクが覚醒してきたし、バルコラやガクポと連携が取れてくれば大丈夫でしょう。冬にはエキティケも戻って来るし楽しみでしかない。頑張れリバプール。
      - voice: ネット民
        text: ヴィルツが25,6になるまでは全然我慢出来るけどイラオラは無理。逃さんと思うけどCL圏入れんだら解任ね
      - voice: ネット民
        text: ヴィルツ放出なんてナシすぎて話になんない
      - voice: ネット民
        text: ヴィルツを売るなんてありえない
        short_voice: true
    sources:
