sections:
  - id: what
    heading: いまのヴィルツ
    tier: 報道
    telop: 当時のクラブ史上最高額、約200億円で加入して1年
    narrator: キャスター
    card:
      type: table
      title: レバークーゼン時代とリヴァプールでの比較
      columns: ["", "レバークーゼン", "リヴァプール"]
      rows:
        - ["アタッキングサードでのタッチ（1試合）", "50回", "35回"]
