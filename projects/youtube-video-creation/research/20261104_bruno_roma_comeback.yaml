# 取材: 2026-11-04。python requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない（記事を探すのに Google ニュースの RSS の見出し一覧だけ使った）。
# 読んだ出典:
#   ・BBC「We don't need to save anyone's job, says Man Utd captain Fernandes」（bbc.co.uk/sport/football/articles/cqkg5dgvygr1o）本文を全部読んだ。
#       - 0-2から3-2。9試合勝ちなし（＝10試合ぶりの勝利）。コモ戦（1-4）のあとに監督の戦術を公に批判し、ベンチに回されてから初めてメディアに話した。
#       - ボーンマス戦（0-3）は出番なし、チェルシー戦（負け）で先発に戻った。58分のPKで反撃が始まった。32歳。
#       - 本人（Amazon Prime への発言、BBC の書き起こし）: "We don't need to save anyone's job." "The club needed that win, the players needed that win." ...
#         "Everyone thought that was a punishment for the words that I had. If it was, it was right. The manager is the one who makes the decisions."
#       - マンUはプレミアで17位、9試合で1勝。CLは4試合で2勝目。
#   ・マンU公式「Bruno sets record straight after tough period」（manutd.com）— 同じ発言のクラブの書き起こし。**台本はこちらの言い回しに合わせた（一次情報）**:
#       "We don’t need to save anyone’s job. The club needed that win. The players needed that win. ..."
#       "Between me and the manager, there were reports that we had cleared the air afterwards, when none of that happened. The manager made the decision to put me on the bench because I wasn’t performing that well."
#       "Everyone felt that was a punishment for the words I’d said, and if it was, it was right. The manager is the one who makes the decisions. I have to accept them and move forward with that. ..."
#       → 食い違い: BBC の書き起こしは「a lot of lies ... that we have cleared the air」で、和解の話し合いがあったようにも読める。クラブ公式は「話し合って和解したという報道があったが、そんなことは無かった」。
#         → 和解の有無には触れない（読み違えやすい）。使うのは「職」「この勝利が必要」「ベンチはプレーが良くなかったから」「罰だと思われた。そうなら正しかった」「決めるのは監督」。
#       - 公式の試合記事: 58分のPKは、最初のキックをバスケス（GK）が止めたが、ペナルティエリアへの侵入でやり直し。
#   ・ESPN の試合データ（site.api.espn.com .../uefa.champions/summary?event=401915308）: マンU 3-2 ローマ（オールド・トラッフォード、73,747人）。
#       11分 スーレ（ローマ）、17分 マレン（PK、ローマ）、58分 ブルーノ（PK）、83分 クーニャ、86分 クーニャ（アシスト シェイ・レイシー）。
#       87分 クーニャに警告（得点後の喜び方＝ESPN 記事「シャツを脱いで観客席へ」）、90+1分 2枚目の警告で退場。88分 ブルーノはマウントと交代。
#   ・ESPN の試合記事（同じ event の report）: 83分の同点はブルーノの浮き球のクロスをバレルディがバウンドを読み違え、クーニャが決めた。PKのやり直しはクリスタンテの侵入。
#   ・サッカーキング 2026-11-04（2224270）: 得点者と分は一致。83分は「B・フェルナンデスのクロスがクリアミスもあってクーニャの足元へ」。90+1分にクーニャ退場。公式戦10試合ぶりの白星。次節は25日、アウェイでスポルティング。名前の表記（マティアス・スーレ／ドニエル・マレン／マテウス・クーニャ／シェイ・レイシー）はここに合わせた。
# 確かめたこと: クーニャの2点（83分・86分）と退場（90+1分、2枚目の警告）は ESPN データとサッカーキングで一致＝事実。
# 自分で数えたもの: マンUの3点のうち、ブルーノが絡んだのは2点（58分のPK・83分の同点につながったクロス）。反撃の3点は58分から86分までの28分。クーニャは2点目から5分で退場。
# 本人の言葉: あり（上）。訳は自然な日本語に（語は足していない）。
# 板: 山場に「コモ戦からローマ戦までのブルーノ」の表（BBC：コモ戦1-4の後に批判、ボーンマス戦0-3は出番なし、チェルシー戦で先発に戻り負け）。
