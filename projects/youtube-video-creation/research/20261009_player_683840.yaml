# 2026-10-08 流れの点検（output/flow/20261009_player_683840.md）を反映。
#   必ず直したもの2つ：①直近5試合の評点は7.9/7.9/7.4/6.4/8.1 なので7点台は「4試合」ではなく**3試合**。
#   ②今季の内訳が合計と合わなかった（12試合1得点3アシストに対し、読み上げはリーグ7試合＋代表4試合＝11試合2アシスト）。
#   材料 553行の内訳（クラブ8試合1得点2アシスト＋代表4試合1アシスト）で読み直した。
#   ほかに直したもの：島の引用の前にカナリア諸島を置いた／センターバックと背番号8をつないだ／
#   「そして2021年」が時間を戻すので言葉を足した／「その初ゴール」を「2部での初ゴール」に／
#   パーセンタイル（98・97・12・下から3分の1）が比べた位置の値だと分かる言い方に／
#   44試合の期間が材料でも不明なので「4試合に3試合」に／「欧州の初戦」をチャンピオンズリーグに。
# ペドリ（バルセロナ）の紹介。8節の型（2026-09-28）を、ネヴェス（research/20261008_player_670681.yaml）・
# ヴィニシウス（research/20261007_player_371998.yaml）の形にそろえた（2026-10-09）。雛形は tools/player_intro.py 683840。
# 材料は research/raw/20261009_pedri_material.md。**ここから出ない**。
# 「ボールを失わない選手」とは言わない：101タッチに1回で、ヴィティーニャ（183.7）・ネヴェス（306）より多く失っている（材料 2-3）。
#   使えるのは「パス成功率92.4%」と「90分で90.7回触って、失うのは0.90回」まで。
# クロースの「1試合11〜12回」は Opta 系の「置いていった相手の数」。**ドリブル数と言い換えない**（材料 5-3）。今回は使っていない。
# ラス・パルマス初ゴールの年齢は、生年月日から計算すると16歳9か月25日で、公式の「23日」と2日合わない。**「16歳9か月」までにした**（材料 7-3）。
# 「レアル・マドリードが先に動いていた」は本人が自分で書いている（材料 3-1）。**「雪」は地元の友達の冗談**なので本人の話として語らない。
# 市場価値は出どころで違う（1.5億／1億890万）。読み上げでは1.5億とだけ言い、表の行に添え書き（mark: note）で断る（材料 7-1）。
# 生まれた町は公式の「テゲステ」。英語版Wikipedia の「バハマール」は使わない（材料 7-2）。
# 最高速度・走行距離は FotMob に無い。身長174cmと「1試合11.5km」だけにして、走行距離には「昨季までの数字」と添える（材料 7-8）。
# 雛形の冒頭コメントの「弱点 守備アクション18」は最下位ではない。レーダーの6軸は最上位ボールタッチ98・最下位空中戦12なので、
#   棒グラフの4本もレーダーと同じ軸（98/97/46/12）に直した。板と読み上げが食い違わないようにするため（材料 7-7）。
# 2020/21 の「73試合」（五輪の決勝まで）と、過去5シーズンの表の 24/25 の「73試合」は**別の73**。
#   読み上げで73を言うのは 24/25 の行だけにして、2020/21 のほうは calc の板の中だけに置いた（混ざると聞く人が取り違える）。
# 英語の直し：UD Las Palmas → ラス・パルマス、Czechia → チェコ。
# 写真は Commons の W杯2026 の3枚だけ使えた（準決勝の横長・決勝の横長・決勝の縦）。
#   コパ・デル・レイ決勝2025 の2枚・代表2025（Pedri.jpg）・世界一の集合写真は **Commons の被写体（P180）にペドリが入っていない**ので portrait が落とす。
#   バルサ2021（736x736）は放送映像のコマに見えるので使わない（放送映像は静止画でも入れない決まり）。
#   → **バルサのユニフォーム姿の写真は1枚も無い。**時期の切り替えは、この3枚と板4枚（レーダー・ヒート・シュート・市場価値）で付けている。
# 昨日のネヴェス（20261008）・一昨日のヴィニシウス（20261007）と、節の導入の文を1つも重ねないように書き換えた。
