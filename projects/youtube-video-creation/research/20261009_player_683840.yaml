- id: story
  heading: 得点のあとの、見えないサングラス
  tier: 報道
  main: true
  telop: 双眼鏡ではなく、祖父のサングラス
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - [得点の仕草, 双眼鏡ではなく祖父のサングラス]
    - [2026年7月19日, 世界一の夜、父をゴールに立たせた]
    source: 本人の寄稿（2026年9月8日）
  say:
  - text: バルセロナのペドリが、点のあとに見せる仕草です。
    short_only: true
    image: assets/images/20261009_player_683840/wc2026final_v/01.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 本人の寄稿（2026年9月8日）
      highlight_row: 0
  - text: 両手で輪を作り、双眼鏡をのぞく形。
    card: *story_card
  - text: でも本人は、双眼鏡ではないと書いています。
    card: *story_card
  - voice: ペドリ
    text: あれは双眼鏡じゃない。
  - voice: ペドリ
    text: 本当は、祖父のサングラスをかけているんだ
    cont: true
    pause: 0.6
  - text: 祖父はテネリフェで、バルサの応援団の店をやっていました。
    card: &shop_card
      type: table
      title: 祖父の店と、壁の写真
      columns: [どこ, 何が]
      rows: &shop_rows
      - [店, テネリフェのバルサ応援団]
      - [正面の壁, 古い写真がたくさん]
      - [写真の祖父, スーツにバルサのネクタイ]
      - [その目もと, 色の入った昔風のサングラス]
      source: 本人の寄稿（2026年9月8日）
      highlight_row: 0
  - text: その店の正面の壁には、古い写真がたくさん貼ってあります。
    card:
      <<: *shop_card
      highlight_row: 1
  - text: スーツに、バルサのネクタイ。笑っている祖父がそこにいます。
    card:
      <<: *shop_card
      highlight_row: 2
  - text: かけているのは、色の入った昔風のサングラスでした。
    emph: true
    card:
      <<: *shop_card
      highlight_row: 3
  - text: もう1つは、世界一になった2026年7月19日の夜の話です。
    image: assets/images/20261009_player_683840/wc2026semi/01_v.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 父は、家の商売を続けるために自分の夢をあきらめた人でした。
    card:
      <<: *story_card
      highlight_row: 1
  - text: 決勝のあと、ペドリはその父をピッチへ連れ出します。
    card:
      <<: *story_card
      highlight_row: 1
  - text: ゴールに立たせて、ペナルティキックを蹴りました。
    emph: true
    card:
      <<: *story_card
      highlight_row: 1
  - voice: ペドリ
    text: いま父は、こう言える。
  - voice: ペドリ
    text: 「私の息子はワールドカップを獲った」
    cont: true
    pause: 0.5
  - text: あれは言葉にする方法さえ分からない、とも書き添えています。
    card:
      <<: *story_card
      highlight_row: 1
