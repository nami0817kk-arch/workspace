      highlight_row: 0
  - text: 23歳になった季の終わりまでの、ラ・リーガの出場数です。
    card: *pace_card
  - text: ペドリは165試合。シャビは125、イニエスタは124でした。
    emph: true
    card:
      <<: *pace_card
      highlight_row: 1
  - text: 40試合ほど多い。1.3倍の速さで、すでに積んでいます。
    card:
