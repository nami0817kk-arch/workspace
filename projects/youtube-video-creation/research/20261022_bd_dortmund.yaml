      - 2010〜2012年。リーグ戦49試合21得点
  say:
  - text: 日本の香川真司は、ドルトムントで二度プレーしました。
    image: assets/photos/bd/dortmund/dortmund_japan_b03f6a89.jpg
  - 最初は2010年。セレッソ大阪から、わずか**35万ユーロ**で来ました。
  - 最初の公式戦は、ヨーロッパリーグの予選。いきなり2得点です。
  - text: 2010-11はリーグ優勝。後半戦は、けがで休みました。
    card:
      type: table
      title: 香川真司とドルトムント
      columns: *id001
      rows:
      - - 2度目
        - 2014〜2019年。4年契約で復帰
  - text: 2012年のカップ決勝は、バイエルンに5対2。最初のゴールは、香川でした。
    image: assets/photos/bd/dortmund/dortmund_japan2_a60c624c.jpg
  - text: 2012年、マンチェスター・ユナイテッドへ移ります。
    image: assets/photos/bd/dortmund/dortmund_japan_b03f6a89.jpg
  - text: 2014年に、4年契約で戻ってきます。2度目は2019年まで。
    card:
      type: table
      title: 香川真司とドルトムント
      columns: *id001
      rows:
      - - 公式戦の通算
        - 216試合60得点
  - text: 今年7月末、チームは日本ツアーに来ました。
    image: assets/backgrounds/stadium_ドルトムント_in.png
  - text: 8月1日、東京の国立競技場で、FC東京に1対0の勝ちでした。
    image: assets/backgrounds/stadium_ドルトムント_in.png
  sources:
  - https://www.bvb.de/de/de/aktuelles/news/news.html/News/Uebersicht/Shinji-Kagawa-kehrt-zu-Borussia-Dortmund-zurueck.html
  - https://en.wikipedia.org/wiki/Shinji_Kagawa
  - https://www.bvb.de/de/en/news/news-overview/news.html/2026/8/1/Silvas-goal-secures-1-0-victory-over-FC-Tokyo.html
  - https://en.wikipedia.org/wiki/2026%E2%80%9327_Borussia_Dortmund_season
  bg: assets/backgrounds/stadium_ドルトムント_in.png
