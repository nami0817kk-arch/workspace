- id: kagawa
  heading: 香川真司が、二度戻ったクラブ
  tier: 背景
  telop: 香川真司。2010〜12年と2014〜19年に在籍
  narrator: 解説
  card:
    type: table
    title: 香川真司とドルトムント
    columns: &id001
    - ''
    - ''
    rows:
