- id: history2
  heading: 交代で出た、16秒のゴール
  tier: 背景
  telop: 1997年、チャンピオンズリーグ優勝。ユヴェントスに3対1
  narrator: 解説
  card:
    type: table
    title: 1997年、チャンピオンズリーグ決勝
    columns: &id002
