  say:
  - 1997年、ミュンヘンでチャンピオンズリーグの決勝。
  - 相手は、前の年の王者、ユヴェントスです。
  - 前半、リーデレが2点を決めて、リードします。
  - text: そこで投入されたのが、ドルトムント生まれの20歳、リッケンです。
    image: assets/photos/bd/dortmund/dortmund_legend2_1448c57f.jpg
    card:
      type: table
      title: 1997年、チャンピオンズリーグ決勝
      columns: *id002
      rows:
      - - 途中出場
        - リッケンが16秒で得点
  - 出てわずか16秒。最初のボールタッチで、遠くから流し込みました。
  - 3対1の勝ち。ドルトムントは、ヨーロッパの頂点に立ちます。
  sources:
  - https://en.wikipedia.org/wiki/Borussia_Dortmund
  - https://en.wikipedia.org/wiki/Lars_Ricken
  bg: assets/backgrounds/stadium_ドルトムント_in.png
  official: false
