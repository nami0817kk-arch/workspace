  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 香川真司が二度所属。6試合無敗で2位。10/31はバイエルン戦
  narrator: キャスター
  say:
  - text: 日本の香川真司が、二度プレーしたクラブです。
    image: assets/stats/bd_dortmund_data_r1.png
    no_telop: true
  - text: 今季は第6節まで無敗。勝ち点14で、首位のバイエルンに並んでいます。
    image: assets/stats/bd_dortmund_data_r2.png
    no_telop: true
  - text: 10月31日には、敵地で、そのバイエルンと戦います。
    image: assets/stats/bd_dortmund_data_r3.png
    no_telop: true
  - image: assets/stats/bd_dortmund_data0.png
    text: 創立は**1909年**。教会のチームを離れた、18人の若者が作りました。
    no_telop: true
  - image: assets/stats/bd_dortmund_data1.png
    text: 愛称は「黒と黄色」。ほかに「ボルセン」とも呼ばれます。
    no_telop: true
  - image: assets/stats/bd_dortmund_map.png
    text: ホームタウンはドルトムント。人口は約**61万人**で、ドイツで9番目に大きな街です。
    no_telop: true
  - image: assets/backgrounds/stadium_ドルトムント.png
    text: 本拠地はジグナル・イドゥナ・パルク。**8万1365人**が入ります。
  - image: assets/backgrounds/stadium_ドルトムント.png
    text: 18クラブで最大。バイエルンの本拠地より、6000人あまり多い大きさです。
  - image: assets/stats/bd_dortmund_data4.png
    text: 2000年に株式を上場。ただ、経営を担う会社の株は、すべて会員組織が持ちます。
    no_telop: true
  - image: assets/stats/bd_dortmund_cups.png
    text: ブンデスリーガの優勝は**5回**。ドイツ王者は**8回**、カップは**5回**です。
    no_telop: true
  - image: assets/stats/bd_dortmund_data6.png
    text: 最多出場は、ミヒャエル・ツォルク。このクラブで**572試合**に出ました。
    no_telop: true
  - image: assets/stats/bd_dortmund_data7.png
    text: 直近のタイトルは、**2021年**のカップ。決勝でライプツィヒに4対1でした。
    no_telop: true
  - image: assets/stats/bd_dortmund_data8.png
    text: 昨季のリーグ戦は**2位**。勝ち点は**73**。首位バイエルンとは、16の差でした。
    no_telop: true
