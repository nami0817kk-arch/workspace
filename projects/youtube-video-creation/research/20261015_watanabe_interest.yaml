short_title: 渡辺剛、推定移籍金が過去最高に並ぶ。同じ時期に動いた、もう一つの数字とは
# 日本人選手 の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。requests（ブラウザUA）で原文を読んだ。フットボールトライブ（題材の記事）→ 元の報道（FootballTransfers オランダ語版 2026-10-14 11:50 CEST の記事）→
#   FootballTransfers の選手ページ、Transfermarkt の選手ページと市場価値の履歴（ceapi）、ESPN の試合記録（API）、Voetbalprimeur の採点記事。
# 【題材の言葉の訂正】題材の見出しは「過去最高額に」「関心も報じられる」。元の報道に当たると、
#   「過去最高額」は FootballTransfers が計算する推定移籍金（ETV＝Estimated Transfer Value）で、クラブが示した金額ではない。
#   ETV は成績・年齢・契約期間・ポジション・リーグの水準・過去の移籍データから出すモデルの値で、月に一度更新される。
#   → 台本では「推定移籍金」と言い、「関心」「オファー」とは分ける。
# 数字（原文で確認）:
#   FootballTransfers ETV: 2026年6月 1050万ユーロ（過去最高）／7月 950万（7月の記事）／9月 690万／10月 1050万（レンジ 950万〜1160万、10/1 更新）。
#     Tribe は「690万ユーロ（約12億円）→1,050万ユーロ（約18億円）」。円換算は Tribe の数字をそのまま「伝えられています」で使う。
#   Transfermarkt: 2026-05-28 1000万 → 2026-09-25 800万ユーロ（履歴 API と Voetbalprimeur の「Feyenoord ziet marktwaarden stijgen」の両方で確認。Voetbalprimeur は「2百万ユーロ下がって800万」）。
#   移籍金: 2025年7月23日、ヘント→フェイエノールト。約800万ユーロ（Soccerway・FootballTransfers）。ロマーノは「総額900万」（出来高込みと見られる）→ 台本は「約800万ユーロと伝えられています」。
#   契約: 2029年6月30日まで（FootballTransfers・Transfermarkt）。
# 【関心の裏取り】
#   題材の記事は「ブンデスリーガ複数クラブからの関心」「上田綺世と同じく5大リーグへ」と書くが、FootballTransfers（オランダ語・英語）のこの選手の記事を
#   7月〜10月ぶん全部（選手ページの transfernieuws 約30本）読んでも、ブンデスリーガの関心を伝える記事は見つからなかった。「上田と同じく」の文言も無い。
#   → ブンデスリーガの関心は台本に入れない（未確認）。Tribe の「本人はブンデスリーガ移籍を望んでいる」（Voetbal 2026年7月）も原文に当たれず → 入れない。
#   当たれた関心: 2026-07（FootballTransfers 7月の2本、Mounir Boualin／SoccerNews 経由）サウジアラビアの Al-Taawoun と Al-Shabab が注目。「まだオファーは出ていない」。
#   その後、10月までにオファーの報道は見つからなかった。
# 今季（ESPN 試合記録）: リーグ戦は8節中6試合（8/9 スパルタ戦と 10/10 AZ戦は出ていない）、CL は 9/9 バルセロナ戦と 10/14 コモ戦。
#   コモ戦は現地10月14日 18:45（日本時間15日1:45）キックオフ、フェイエノールト 3-2 コモ。渡辺は後半 79分（セントジャストと交代）、2-1 のとき。
#   Voetbalprimeur の採点記事は「けが明けの復帰、出場時間が短く採点なし」。リーグはフェイエノールトが 8試合 勝ち点20 で首位（ESPN、10/10 AZ戦のあと）。
#   アシスト数は FootballTransfers「1」・ESPN「0」で割れた → 台本で言わない。得点は 0 で一致だが、言わない（センターバックの数字として小さく見せない）。
# 日付・場所: コモ戦は現地10月14日、デ・カイプ。
# 反応（ネット民）: 見つからなかった。5ちゃんねる系まとめ（サカラボの検索 ＝ 渡辺剛・フェイエノールト）にこの話題のスレは無い。X は requests で読めない。
#   はてなブックマークにも無し。→ 反応の節は置かない（作らない）。「反応なしで出すか」はユーザーに聞く。
# 写真: Commons に渡辺剛の写真が無い（検索・カテゴリとも0件）。報道写真は Tribe＝アフロ、Voetbalprimeur・FR12・VI＝Pro Shots、FootballTransfers＝IMAGO で、全部代理店。
#   → 取り込んでいない。thumbnail.photo は空き（用意できたら assets/images/20261015_watanabe/ に置く）。
slot: japan
date: "2026年10月15日"
format: news
