      - 10月の推定は、実際に払われた額より250万ユーロ高く、約1.3倍です。
      - 同じ渡辺の値段でも、物差しが違えば3割開きます。
      - しかも、その推定は4か月で上下しています。
      - いちばん高い月と低い月の差は、360万ユーロです。
      - 過去最高額は、計算サイトの数字が上がったという意味です。
