  takeaway: 渡辺剛の過去最高額は、計算サイトの推定値が6月の1050万ユーロに並んだという意味で、買い手が示した値段ではない。同じ時期に別の評価サイトは1000万から800万ユーロに下げていて、実際の移籍金は約800万ユーロ。物差しが違えば3割開く

