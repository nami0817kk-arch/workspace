  - id: said
    main: true
    heading: 言ったこと
    tier: 報道
    telop: 「新しい契約にサインするのは、迷うまでもなかった」
    narrator: キャスター
    say:
      - text: 'マンチェスター・ユナイテッドの関心が伝えられたルイス・ホールが、残った理由を話しました。'
        short_only: true
      - voice: ルイス・ホール
        text: 新しい契約にサインするのは、**迷うまでもなかった。**
      - voice: ルイス・ホール
        text: ほかのチームと噂されるときは、自分が正しいことをしているってことなんだと思う。
      - voice: ルイス・ホール
        text: それは前向きに受け取った。でも同時に、ここでプレーするのがどれだけ好きか分かっていた。
      - voice: ルイス・ホール
        text: 監督が来てから、クラブの野心も、自分たちが何を成し遂げたいのかも分かっていた。
    sources:
      - https://x.com/FabrizioRomano/status/2102350989420277975
      - https://metro.co.uk/2026/09/22/lewis-hall-sends-transfer-message-man-utd-signing-newcastle-contract-29643573/
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: これを聞いた人が書いていたこと
    narrator: キャスター
    say:
      - voice: ネット民
        text: サインした直後は、どの選手も「迷うまでもなかった」と言う。面白いのは、マンUの最終ラインの多くがまだ定位置も決まっていないうちに、彼がニューカッスルでキャプテン候補になっていることだ
      - voice: ネット民
        text: ルイス・ホールの件は、まさに俺がユナイテッドの補強を疑い続けている理由だ。去年の夏、左サイドバックに明らかな問題があった。プレミアで実績のある本職の左サイドバックが必要で、ホールはまさにその選手だった
      - voice: ネット民
        text: ニューカッスルが新しい契約を与えたのは、将来高く売るためだ。でもマンチェスター・ユナイテッドは値段を恐れない。欲しくなったら買う
      - voice: ネット民
        text: ルイス・ホールは他のクラブの目をまっすぐ見て、何も感じず、振り返ってニューカッスルを選んだ。あれは契約じゃない、野心への接近禁止命令だ。なのに彼史上いちばんかっこいい
      - voice: ネット民
        text: チェルシーは彼を売って、よく分からないDFを6000万で買った。本当にチェルシーが嫌いだ。アカデミーの選手を売るのがうちの弱点だった
      - voice: ネット民
        text: 今の市場にルイスホール以外めぼしいLBいないよな。
      - voice: ネット民
        text: ルイスホール上手すぎだろ…まじで1億出してでも取れ
      - voice: ネット民
        text: 契約延長したルイスホールの得点。素晴らしい序盤、素晴らしい、素晴らしいぞー。
      - voice: ネット民
        text: ルイスホールのユニ買います
      - voice: ネット民
        text: ルイスホール、神の子。
        short_voice: true
