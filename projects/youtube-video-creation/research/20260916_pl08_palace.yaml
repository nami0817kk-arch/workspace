sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 名前の由来は、ガラスでできた展示館
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["起源", "1861年のアマチュアチーム"]
        - ["プロとして", "1905年9月10日"]
        - ["愛称", "The Eagles（イーグルス）"]
        - ["その前", "The Glaziers（ガラス職人）"]
    say:
      - "アルファベット順では8番目。**120年目で、ようやく最初の優勝**にたどり着いたクラブです。"
      - 名前は、ロンドン南部にあった**ガラスの展示館**から来ています。
      - その建物を持っていた会社が、1905年9月10日にプロのクラブを作りました。
      - ただし、もとをたどると1861年のアマチュアチームに行き着きます。
      - 愛称は「イーグルス」。鷲です。
      - これは1973年、マルコム・アリソン監督のときに決まりました。
      - 参考にしたのは、ポルトガルのベンフィカです。
      - それまでは「**グレイジャーズ**」、つまりガラス職人と呼ばれていました。展示館の名残です。
      - 支持しているのは、南ロンドンとケント、サリーの人たちです。
      - 世界中に客のいるチェルシーとは、そこが違います。**地元のクラブ**です。
      - "宿敵は、**64キロ離れたブライトン**。イングランドのダービーとしては、かなり遠い相手です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - id: trophy
    heading: 120年待ったタイトル
    main: true
    tier: 背景
    telop: 2025年のFAカップ。相手はマンチェスター・シティ
    narrator: 解説
    card:
      type: table
      title: FAカップ決勝の記録
      columns: ["", ""]
      rows:
        - ["1990年", "3-3のあと再試合で敗れる"]
        - ["2016年", "1-2で敗れる"]
        - ["2025年", "1-0。クラブ史上初のタイトル"]
    say:
      - このクラブは、長いあいだ何も獲れませんでした。
      - FAカップの決勝には、3回立っています。
      - 2016年は1対2。どちらも相手はマンチェスター・ユナイテッドでした。
      - そして2025年、3度目の決勝。相手はマンチェスター・シティです。
      - エベレチ・エゼの1点を守り切り、1対0で勝ちました。
      - "**クラブの歴史ではじめての、大きなタイトル**でした。"
      - 1905年にプロのクラブができてから、120年が経っていました。
      - さらに昨季、2025年から26年のカンファレンスリーグも制しています。
      - ラージョ・バジェカーノを1対0で下しての、初のヨーロッパのタイトルです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はディーン・ヘンダーソン
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ピエール・サージュ"]
        - ["主将", "ディーン・ヘンダーソン（GK・イングランド）"]
        - ["エース", "ストラン・ラーセン（FW・ノルウェー）"]
        - ["鎌田大地", "リーグ4試合すべて先発"]
        - ["冨安健洋", "2026年8月加入"]
    say:
      - 監督はピエール・サージュです。
      - 主将はディーン・ヘンダーソン。**ゴールキーパーです。**
      - 腕章を巻くのがキーパー、というのは珍しい形です。
      - エースはヨルゲン・ストラン・ラーセン。ノルウェー代表のフォワードで、今季3点。
      - そして、このクラブには**日本人選手が2人います。**
      - ひとりは**鎌田大地**。2024年の夏に、フリーでラツィオから来ました。
      - このクラブに日本人が入ったのは、**鎌田が最初**でした。
      - 今季はリーグ戦の4試合、**すべてに先発**しています。
      - もうひとりは**冨安健洋**。今年の8月、アヤックスとの契約が切れたあとに加わりました。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 1909年、リーグに属さないチームが王者を倒した
    narrator: 解説
    card:
      type: table
      title: 水晶宮とクラブ
      columns: ["", ""]
      rows:
        - ["1895年", "FAカップ決勝の会場に"]
        - ["1909年", "リーグ外でカップ王者を撃破"]
        - ["1915年", "戦争で水晶宮から退去"]
        - ["2025年", "その決勝を勝つまで120年"]
    say:
      - 古い話をひとつ。1909年のFAカップ1回戦です。
      - 相手はウルヴァーハンプトン・ワンダラーズ。**そのときのカップ王者**でした。
      - このクラブは当時、まだリーグに属していませんでした。
      - その試合に勝ちました。
      - "**リーグ外のクラブが、カップ王者を倒した最初の例**です。"
      - タイトルを獲るまでには、そこからさらに116年かかりました。
      - もうひとつ、この話には続きがあります。
      - 1895年から、**FAカップの決勝は水晶宮の敷地にあった競技場で行われていました。**
      - つまり、**決勝の会場で生まれたクラブが、その決勝を勝つまでに120年かかった**ことになります。
      - 本拠地のセルハースト・パークには、もうひとつ珍しい記録があります。
      - 1985年にチャールトンが間借りしました。**イングランドで初めて、2つのクラブが本拠地を分け合った例**です。
      - 1991年からはウィンブルドンが入り、2003年まで使っていました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
      - https://en.wikipedia.org/wiki/History_of_Crystal_Palace_F.C.
      - https://en.wikipedia.org/wiki/Selhurst_Park
      - https://en.wikipedia.org/wiki/Daichi_Kamada
      - https://en.wikipedia.org/wiki/Takehiro_Tomiyasu
