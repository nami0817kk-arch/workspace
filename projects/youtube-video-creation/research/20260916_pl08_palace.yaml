sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 名前の由来は、ガラスでできた展示館
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["起源", "1861年のアマチュアチーム"]
        - ["プロとして", "1905年9月10日"]
        - ["愛称", "The Eagles（イーグルス）"]
        - ["その前", "The Glaziers（ガラス職人）"]
    say:
      - "**120年目で、ようやく最初の優勝**にたどり着いたクラブです。"
      - 名前は、ロンドン南部にあった**ガラスの展示館**から来ています。
      - その建物を持っていた会社が、1905年9月10日にプロのクラブを作りました。
      - ただし、もとをたどると1861年のアマチュアチームに行き着きます。
      - 愛称は「イーグルス」。鷲です。
      - これは1973年、マルコム・アリソン監督のときに決まりました。
      - 参考にしたのは、ポルトガルのベンフィカです。
      - それまでは「**グレイジャーズ**」、つまりガラス職人と呼ばれていました。展示館の名残です。
      - 支持しているのは、南ロンドンとケント、サリーの人たちです。
      - 世界中に客のいるチェルシーとは、そこが違います。**地元のクラブ**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - id: trophy
    heading: 120年待ったタイトル
    main: true
    tier: 背景
    telop: 2025年のFAカップ。相手はマンチェスター・シティ
    narrator: 解説
    card:
      type: table
      title: FAカップ決勝の記録
      columns: ["", ""]
      rows:
        - ["1990年", "3-3のあと再試合で敗れる"]
        - ["2016年", "1-2で敗れる"]
        - ["2025年", "1-0。クラブ史上初のタイトル"]
    say:
      - {image: "assets/images/pl_palace_story/scene.jpg",
         text: "はじめて大きなタイトルを獲ったのは、**2025年**のFAカップでした。"}
      - FAカップの決勝には、それまで2度立って、2度負けていました。
      - どちらもマンチェスター・ユナイテッドに負けました。
      - 1990年は引き分けのあとの再試合で0対1、2016年は1対2でした。
      - 3度目の決勝、相手はマンチェスター・シティです。
      - エベレチ・エゼの1点を守り切り、1対0で勝ちました。
      - このタイトルで初めてヨーロッパに出て、翌シーズン、その大会も獲りました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人が2人。鎌田大地と冨安健洋
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ピエール・サージュ"]
        - ["主将", "ディーン・ヘンダーソン（GK・イングランド）"]
        - ["エース", "ストラン・ラーセン（FW・ノルウェー）"]
        - ["鎌田大地", "リーグ4試合すべて先発"]
        - ["冨安健洋", "2026年8月加入"]
    say:
      - このクラブには、**日本人選手が2人います。**
      - ひとりは**鎌田大地**。2024年の夏に、フリーでラツィオから来ました。
      - このクラブに日本人が入ったのは、**鎌田が最初**でした。
      - 今季はリーグ戦の4試合、**すべてに先発**しています。
      - もうひとりは**冨安健洋**。今年の8月、アヤックスとの契約が切れたあとに加わりました。
      - 監督はピエール・サージュ。
      - 主将はディーン・ヘンダーソン。**ゴールキーパーです。**
      - 腕章を巻くのがキーパー、というのは珍しい形です。
      - エースはヨルゲン・ストラン・ラーセン。ノルウェー代表のフォワードで、今季3点。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 64キロ離れたブライトンとのM23ダービー
    narrator: 解説
    card:
      type: table
      title: M23ダービー
      columns: ["", ""]
      rows:
        - ["相手", "ブライトン・アンド・ホーヴ・アルビオン"]
        - ["呼び名", "M23ダービー（A23ダービー）"]
        - ["火種", "1976年、FAカップで3試合もつれた"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - 宿敵は、64キロ離れた**ブライトン**です。
      - イングランドのダービーとしては、かなり遠い相手になります。
      - 呼び名は**M23ダービー**。2つの土地を結ぶ道路の名前から来ています。
      - ただし、この呼び名をサポーターは嫌っています。
      - 最初に当たったのは1920年ですが、本物になったのは1970年代の半ばでした。
      - きっかけは2人の人間です。
      - トッテナムで同僚だった、パレスのテリー・ヴェナブルズと、ブライトンのアラン・マラリー。
      - 1976年のFAカップは3試合までもつれ、12月6日の再々試合をパレスが1対0で取りました。
      - 試合のあと、マラリーはパレスのロッカールームに入り、床に**5ポンド**を投げつけます。
      - 「お前のチームはこの金の値打ちもない」。ヴェナブルズに、そう言い放ちました。
      - 翌1977年、パレスは勝ち点1差でブライトンを抑えて3部優勝。ここで決定的になります。
      - そのブライトンは、**今季もプレミアリーグにいます。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/M23_derby
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 660試合のキャノン、165得点のシンプソン、そしてザハ
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ジム・キャノン", "660試合（クラブ最多出場）"]
        - ["ピーター・シンプソン", "165得点（クラブ最多得点）"]
        - ["ウィルフリード・ザハ", "458試合90得点"]
    say:
      - いちばん多く出たのは**ジム・キャノン**。1973年から1988年までの15年で、660試合です。
      - いちばん多く決めたのは**ピーター・シンプソン**。1929年から1935年で165得点。
      - 6年でこの数字を残しました。
      - そして**ウィルフリード・ザハ**。2010年から13年と、2014年から23年の2期です。
      - 通算458試合90得点。**プレミアリーグでのクラブ最多得点者**でもあります。
      - 2018年8月のワトフォード戦でこの大会24点目を決め、クリス・アームストロングを抜きました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/List_of_Crystal_Palace_F.C._records_and_statistics
      - https://en.wikipedia.org/wiki/Wilfried_Zaha
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: この2年で3つ。FAカップ、ヨーロッパ、コミュニティ・シールド
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["FAカップ", "1回（2024-25）"]
        - ["ヨーロッパ", "カンファレンスリーグ1回（2025-26）"]
        - ["コミュニティ・シールド", "1回（2025年）"]
    say:
      - "**この2年で、3つ獲りました。**"
      - FAカップ、カンファレンスリーグ、そして2025年のコミュニティ・シールド。
      - 3つとも、鎌田が在籍しているあいだのものです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
