# プレミアリーグ20クラブ紹介 ⑧クリスタル・パレス（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **写真が取れなかった。**セルハースト・パークの写真は Wikimedia の
# 検索で見つからず（2026-09-16）。**エンブレムで作る。**
#
# 引きは**「120年待って、去年はじめてタイトルを獲った」**。ここが山場（@main）。
#
# **2026-09-18 ユーザー指示で書き直した。**「アルファベット順では8番目」を消して
# 後半だけ残し、各節の1行目をその節でいちばん引きの強い事実に入れ替えた。
# 優勝の節は「獲ったやつだけ」にし、1部優勝0回・リーグカップ0回の行を落とした。
#
# **2026-09-18 ユーザー指示（もっと興味を引く形に）で、さらに足した。**
#   ・タイトルとサムネを「丸数字＋クラブ名＋そのクラブの引き」に変えた（20本とも同じ名札だった）
#   ・**宿敵（rival）**と**このクラブを語る3人（legends）**の節を足した（出典は英語版Wikipedia）
#   ・日本人2人（鎌田大地・冨安健洋）の節を、宿敵より前へ出した
#
# **2026-09-19 ユーザー指示（クラブの歴史はもう少しシンプルに）で、歴史の節を整理した。**
# 「歩んできた道」（1909年のカップ王者撃破・水晶宮の決勝会場・セルハースト・パークの間借り）を
# 丸ごと落とし、タイトルの節からも優勝の節と重なるカンファレンスリーグの2行を落とした。
