    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝0回、FAカップ1回（2024-25）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "0回"]
        - ["FAカップ", "1回（2024-25）"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "カンファレンスリーグ1回（2025-26）"]
        - ["コミュニティ・シールド", "1回（2025年）"]
    say:
      - 数えると、こうなります。1部優勝ゼロ、リーグカップゼロ。
      - FAカップが1回、ヨーロッパが1回。それに2025年のコミュニティ・シールド。
      - "**120年間ゼロだったクラブが、この2年で3つ獲りました。**"
      - 3つとも、鎌田が在籍しているあいだのものです。
    official: false
    sources:
