  - text: 板倉滉と堂安律のあいだで、主将がどう移ってきたかを並べます。
    image: assets/images/20260930_itakura/02_w.jpg
  - text: それまでの主将は遠藤航でした。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
  - text: 今年3月のイギリス遠征は、その遠藤がけがで選ばれず、堂安が主将を任されました。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 0
  - text: 6月のW杯では、遠藤が大会の直前に離脱。初戦の3日前に、板倉が指名されました。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 1
  - text: そしてW杯のあと、9月からの主将は再び堂安です。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 2
  - text: 次の大きな大会は、アジアの代表が争うアジアカップ。来年の1月から2月です。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 3
  - text: ヨーロッパのリーグは、その間も休まず続きます。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 3
  - text: 所属のボルシアMGは、ドイツ1部で開幕4連敗の最下位です。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 3
  - text: そのクラブとの契約で、板倉は出られない可能性があります。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
      highlight_row: 3
  - text: 遠藤が欠けた2度とも、腕章は堂安か板倉に回ってきました。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
  - text: 自分が出られないかもしれない大会の主将を、板倉は自分で推したことになります。
    card:
      type: table
      title: 日本代表の主将
      columns: [時期, 主将, いきさつ]
      rows: *caprows
