# 取材メモ（9/30 の題材 1）。起点はゲキサカの囲み取材2本（9/29 広島の練習後）。
#   459942: 練習復帰「自分が合流できたので大丈夫」 / 459943: 主将・堂安律への信頼「律で間違いないと思います」
#   同じ取材の言葉を スポーツ報知・サンケイスポーツ・サッカーダイジェスト（いずれも Yahoo!ニュース配信）でも確かめた。
#   言い回しは媒体ごとに少し違う（報知「悪くないです。昨日も別メニューで…」）。台本はゲキサカの書き起こしに揃えた。
# 同じ日に別の回で「堂安律が語る松木玖生」を作る。堂安の主将ぶりそのもの・若手評はそちらに回し、
#   ここは板倉の復帰と、腕章を渡した・推した板倉の側に絞る。
#   「責任感が強い選手で…自然にみんな彼についていこうという雰囲気」（堂安評）は、あちらの回と重なるので使わない。
# 最終ラインのけが人は1行だけ（冨安＝9/22 不参加、安藤＝9/28 離脱、渡辺剛＝9/29 離脱で望月ヘンリー海輝を追加、鈴木淳之介＝9/28 に病院で検査。離脱の発表は無し）。
# 見立ての数字:
#   代表の初めての腕章 = 2023年3月28日 コロンビア戦（JFA の試合ページ）。それまでの出場は 2019年3・2020年1・2021年1・2022年11＋2023年3月24日 ＝ 17試合なので18試合目（ja.wikipedia の出場一覧と年別の表）。
#   W杯の主将 = 遠藤航の離脱で、初戦オランダ戦の3日前に森保監督から告げられた（ゲキサカ 2026-07-18 のトークショー記事）。
#   堂安の主将 = 2026年3月のイギリス遠征で、主将の遠藤航がけがで選外のため指名（サッカーキング 2026-03-28）。9・10月の活動も主将（チームキャプテン）。
#   **試合で腕章を巻いた人とは別。**9/28 ベネズエラ戦の腕章は前半が鎌田、後半が伊東（9/29 の鎌田・伊東の回）。表は「主将（チームキャプテン）」で作り、「4戦全勝」はゲキサカの数え方なので出さない。
#   9・10月の活動は4試合（9/24 ウルグアイ・9/28 ベネズエラ・10/1 エクアドル・10/5 パナマかニュージーランド。JFA 00036771）。板倉の「この4試合」はこれを語りで数えてから置く。
#   ボルシアMG は 9/28 時点でブンデスリーガ 4戦4敗・勝ち点0・18位（research/standings/2026-09-28.json）。
#   アジアカップ（2027年1〜2月）は、クラブとの契約で板倉が参加を見送る可能性（ゲキサカ 459943、日刊スポーツ 9/25）。森保監督の 9/25 の会見の言葉は題より前なので引かない。
# 反応は Yahoo!ニュースのコメント欄（報知・ダイジェストの記事）から、題の中身（復帰・主将を推したこと）への声だけ3件。堂安そのものへの評価の投稿は外した。
