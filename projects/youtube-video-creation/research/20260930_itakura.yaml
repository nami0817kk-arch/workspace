- id: captain
  main: true
  heading: 「律で間違いない」
  tier: 報道
  telop: 板倉「森保さんとその話をした時も『律で間違いないと思います』と伝えた」
  narrator: キャスター
  say:
  - text: 左足首から練習に戻った板倉滉。アジアカップに出られない可能性があり、主将が交代したとみられています。
    short_only: true
  - text: 練習後の取材で、話は主将のことにも及びました。
    image: assets/images/20260930_itakura/02_w.jpg
  - W杯で主将だった板倉に代わり、この9月からは堂安律が主将を務めています。
  - 板倉は堂安を律と呼び、森保監督のことは森保さんと呼びます。
  - voice: 板倉滉
    text: 僕がキャプテンをさせてもらった時も常に律が横にいた。
  - voice: 板倉滉
    text: 一緒にチームを見て、
    cont: true
  - voice: 板倉滉
    text: チームに何が必要かをいつも話しているのは律なので、
    cont: true
  - voice: 板倉滉
    text: 森保さんとその話をした時も
    cont: true
  - voice: 板倉滉
    text: 『律で間違いないと思います』と伝えた
    cont: true
  quotes_from:
