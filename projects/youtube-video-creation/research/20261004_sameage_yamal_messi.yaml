  takeaway: 19歳83日で切ると、バルサの一軍の試合はヤマル159・メッシ39、出場時間は1万1890分と2044分で約5.8倍。それでも90分あたりの得点は0.43と0.48でほぼ並ぶ。差を生んだのは点を取る速さではなく、ロナウジーニョとエトーの後ろにいた18歳と、前線でいちばん長く任された18歳という立場の違い。次の物差しは10月11日、メッシが19歳で伝説のゴールを決めた相手ヘタフェとの試合
