  - text: ヤマルとメッシ、同じ19歳83日までにバルセロナで積んだ数字です。
    short_only: true
  - voice: ラミン・ヤマル
    text: 僕と同じくらいの年齢で、バルサのようなクラブで
    image: assets/images/20261004_sameage_yamal_messi/yamal_run/01_w.jpg
  - voice: ラミン・ヤマル
    text: これほど多くの試合に出場した選手はほとんどいないよね
    cont: true
    pause: 0.5
  - text: 17歳の春の言葉です。メッシの同じ年齢と比べると、どうか。
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 0, source: Transfermarkt・FotMob}
  - text: 一軍の公式戦は、ヤマル159試合、メッシ39試合。4倍を超えます。
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 0, source: Transfermarkt・FotMob}
  - text: 先発に限ると、131回と23回。
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 1, source: Transfermarkt・FotMob}
  - text: 出場時間は1万1890分と2044分。差は、およそ5.8倍です。
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 2, source: Transfermarkt・FotMob}
  - text: 得点は57と11。アシストは51と6。
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 3, source: Transfermarkt・FotMob}
  - text: ところが、1試合ぶんの90分あたりの得点にすると、ヤマル0.43、メッシ0.48。
    emph: true
    card: {type: table, title: バルサ一軍の公式戦（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*c0, *c1, *c2, *c3, *c4, *c5], highlight_row: 5, source: Transfermarkt・FotMob}
