      source: Transfermarkt
  - text: ヤマルは45試合で24点。この3人の中で、出場時間がいちばん長い。
    card: {type: table, title: 2025-26 バルサ（ヤマル18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*y0, *y1, *y2], highlight_row: 0, source: Transfermarkt}
  - text: レヴァンドフスキは2486分、ラフィーニャは2194分です。
    card: {type: table, title: 2025-26 バルサ（ヤマル18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*y0, *y1, *y2], highlight_row: 1, source: Transfermarkt}
