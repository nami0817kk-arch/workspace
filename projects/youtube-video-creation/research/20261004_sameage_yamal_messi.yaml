    card: {type: table, title: フル代表（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*n0, *n1, *n2, *n3, *n4], highlight_row: 1, source: Transfermarkt}
  - text: ワールドカップでは、ヤマルは8試合すべてに出ました。
    card: {type: table, title: フル代表（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*n0, *n1, *n2, *n3, *n4], highlight_row: 3, source: Transfermarkt}
  - text: メッシは3試合に出て、チームは準々決勝で敗れました。
    card: {type: table, title: フル代表（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*n0, *n1, *n2, *n3, *n4], highlight_row: 3, source: Transfermarkt}
  - text: ただ、ワールドカップでの初ゴールは、どちらも18歳のとき。
    card: {type: table, title: フル代表（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*n0, *n1, *n2, *n3, *n4], highlight_row: 4, source: Transfermarkt}
  - text: ヤマルは18歳343日、メッシは18歳357日。差はたった2週間です。
    emph: true
    card: {type: table, title: フル代表（19歳83日まで）, columns: [項目, ヤマル, メッシ], rows: [*n0, *n1, *n2, *n3, *n4], highlight_row: 4, source: Transfermarkt}
