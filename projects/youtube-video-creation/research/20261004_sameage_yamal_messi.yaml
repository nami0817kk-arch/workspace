- id: view
  heading: 任された時間の差と、次のヘタフェ戦
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月11日、バルセロナ対ヘタフェ
  say:
  - text: 並べて見えたのは、点を取る速さより、任された時間の差でした。
    image: assets/images/20261004_sameage_yamal_messi/pair/01.jpg
  - 点を取るペースは互角。開いたのは、6倍近いピッチの上の時間です。
  - text: メッシは19歳83日のあと、20歳の誕生日までに、バルサで31試合15点を足しました。
    image: assets/images/20261004_sameage_yamal_messi/messi_getafe/01.jpg
  - その中に、2007年4月のヘタフェ戦のゴールがあります。
  - text: 60メートルを独りで運び、5人をかわして決めた1点。
    emph: true
  - 2019年のファン投票で、クラブ史上最高のゴールに選ばれました。
  - text: そしてヤマルの次の試合は10月11日。相手は、そのヘタフェです。
    image: assets/images/20261004_sameage_yamal_messi/yamal_run/01_w.jpg
  - 20歳の誕生日まで、あと282日。
  - メッシが15点を足した同じ1年で、ヤマルがどこまで積むのか。続きはピッチの上です。
