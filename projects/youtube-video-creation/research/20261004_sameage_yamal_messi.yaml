    card: {type: table, title: 2005-06 バルサ（メッシ18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*m0, *m1, *m2], highlight_row: 0, source: Transfermarkt}
  - text: エトーは47試合で34点。2人とも、出た試合はすべて先発です。
    card: {type: table, title: 2005-06 バルサ（メッシ18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*m0, *m1, *m2], highlight_row: 1, source: Transfermarkt}
  - text: メッシは25試合で8点。出場時間は、エトーのおよそ3分の1でした。
    card: {type: table, title: 2005-06 バルサ（メッシ18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*m0, *m1, *m2], highlight_row: 2, source: Transfermarkt}
  - text: 国籍の手続きで開幕に間に合わず、3月には太もも裏の肉離れ。
    card: {type: table, title: 2005-06 バルサ（メッシ18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*m0, *m1, *m2], highlight_row: 2, source: Transfermarkt}
  - text: チャンピオンズリーグの決勝は、ピッチの外から見届けました。
    card: {type: table, title: 2005-06 バルサ（メッシ18歳の季）, columns: [選手, 試合, 出場時間, 得点], rows: [*m0, *m1, *m2], highlight_row: 2, source: Transfermarkt}
