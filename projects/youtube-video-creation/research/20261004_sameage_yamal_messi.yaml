# 同じ年齢での比較：ラミン・ヤマルとリオネル・メッシを、同じ19歳83日で切って並べる。材料と数え方は research/raw/20261004_sameage_yamal_messi.md。
# 比べる日はヤマルの今日（2026-10-04＝19歳83日）と、メッシの19歳83日（2006-09-15）。数字は Transfermarkt の試合ごとの記録を自分で足した。
# ヤマルのバルサ通算（159試合57点51アシスト）は 10/2 のヤマル紹介と同じ。代表は 10/3 チェコ戦のぶん（1試合1点）が紹介より増えている。
# 10/2 のヤマル紹介で言ったこと（赤ん坊の写真・304・ネイマール・プレースタイル・バロンドール）は繰り返さない。本人の言葉も紹介と別のもの。
# どちらが上かは言い切らない（比較の型の決まり）。数字の違い（出場時間と立場）を見立てにする。反応は入れていない。
