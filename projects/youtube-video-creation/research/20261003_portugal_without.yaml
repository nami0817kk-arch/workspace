- id: airport
  heading: 勝った翌日の空港
  tier: 報道
  telop: ポルトの空港でファンが言い争い、警察が割って入る。代表の公式アカウントは200万人近くフォロワー減
  narrator: キャスター
  say:
  - text: ところが、勝った翌日の2日。代表が戻った北部の街ポルトの空港で、騒ぎが起きます。
    image: assets/images/20261003_portugal_without/03.jpg
  - text: バスへ向かう一行のなかで、1人のファンがジェズス監督に罵声を浴びせました。
  - text: エゴはエッフェル塔ほどの大きさだ。そんな叫びが、動画に残っています。
  - text: 同じ場所で、別のファンはロナウドへの不満を口にします。
  - text: 言い争いになった2人のあいだに、警察が割って入りました。
  - text: 代表の公式アカウントは、騒動が始まってから、合わせて200万人近くフォロワーを減らしました。
    card:
      type: table
      title: 騒動のあとのフォロワー（報道）
      columns: [アカウント, 増減]
      rows: &follow
      - ['代表の公式アカウント（合計）', '200万人近く減']
      - ['ジェズス監督', '10万人近く減']
      - ['ロナウド', '増えた']
      highlight_row: 0
  - text: デンマーク戦の当日だけで、およそ100万人です。
    card:
      type: table
      title: 騒動のあとのフォロワー（報道）
      columns: [アカウント, 増減]
      rows: *follow
      highlight_row: 0
  - text: ジェズス監督本人も、10万人近く減らしました。
    card:
      type: table
      title: 騒動のあとのフォロワー（報道）
      columns: [アカウント, 増減]
      rows: *follow
      highlight_row: 1
  - text: 反対に、ロナウドのフォロワーは増えています。
    card:
      type: table
      title: 騒動のあとのフォロワー（報道）
      columns: [アカウント, 増減]
      rows: *follow
      highlight_row: 2
