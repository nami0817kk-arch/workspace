# 10/2 に「ロナウドの代表離脱」の回（ronaldo_walkout）を出している。離脱の経緯・懲戒規定・代表通算の数字・会見の発言は繰り返さない。経緯は1行だけ。
# この回は「ロナウドのいないポルトガルはどうだったか」と「その後の騒ぎ」に絞る。前回の「7点のうち6点は…」は言い直さず、誰が点を取ったか（得点者の分散）で見る。
# 事実の裏:
#   試合: 連盟（FPF）公式の試合記事 news/58075 と ESPN の試合 summary（得点・アシスト・シュート数・順位）。主将ブルーノは DN、7番レオンは DN・RTP。
#   レオンの言葉: FPF 公式 news/58078 の原文から訳した。監督の言葉: FPF 公式 news/58077（試合後）。
#   空港の騒ぎ・フォロワー・連盟の動き: A Bola 10/2 の3本（報道）。連盟は何も認めていないので「報じられています」。
#   ノルウェー戦: 10/4（日）19:45 ポルト時間＝日本時間 10/5 3:45、ドラゴン（FPF の試合記事）。
# 反応: X 2件（日本語1・英語1）と Yahoo!ニュースのコメント1件。いない方が強いという声だけにせず、ロナウドの側に立つ声を1件入れた。
# 写真: FPF 公式サイトの試合記事の写真（Diogo Pinto / FPF）。代理店ではない。冒頭は 01_w.jpg（facecrop）。
