  question: ロナウドがいなくなったポルトガルは、ピッチの中と外でどうなっているのか
  takeaway: ジェズス監督の3試合でポルトガルは7点を取り、決めたのはフェリックス、ラモス、カンセロ、ヴィティーニャの4人。ロナウドが先発したウェールズ戦はシュート23本のうち7本がロナウドで1点だったが、デンマーク戦は枠内シュート10本で4人が1点ずつ取り、アシストも5人に散った。一方ピッチの外では、勝った翌日に空港でファンが言い争い、代表の公式アカウントは200万人近くフォロワーを減らした。点の取り方が本物かは、10月4日にハーランドのいるノルウェーとドラゴンで戦う試合が答えになる
