  - text: ここ数日のことを聞かれた監督は、次の試合を戦うスタジアム、ドラゴンの名を挙げました。
    image: assets/images/20261003_portugal_without/03.jpg
  - voice: ジェズス監督
    text: この試合、そして次はドラゴンでの試合。
  - voice: ジェズス監督
    text: ドラゴンの試合が終わったら、そこで考える。
    cont: true
