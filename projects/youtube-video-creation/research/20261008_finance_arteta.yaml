# クラブの財政：アルテタ、アーセナルで2030年まで（10/8、シリーズ「クラブの財政」）。材料の控えは research/raw/20261008_finance_arteta.md。
# ユーザーが○を付けた題（10/8 の候補 27）。10/7 の finance_mancity（判決・罰・前例の減点）とは言い回しを重ねない。
#   シティが出るのは「グアルディオラが昨季で退いた」「いま首位」の2点だけ。判決と罰の話には触れない。
# 一次情報（1行ずつ突き合わせた。raw の「一次情報」）:
#   クラブの発表（アーセナル公式・プレミアリーグ公式・ESPN）が出しているのは**期限（2030年6月）と4年**だけ。**額は出していない**ので確度は報道。
#   総額8000万ポンド超・年2000万ポンド超は The Guardian 10/7、年俸最大2500万ポンドは The Times（フットボールチャンネル 10/8 が引用元として名乗る）。
#   前の契約は Guardian・BBC が「1000万＋ボーナス500万」、The Times が「1200万＋最大300万」。**合計の上限1500万ポンドだけが一致する**ので、そこだけ使う（内訳は言わない）。
#   在任・成績は Soccerbase（Wikipedia 経由、9月19日時点）361試合220勝67分74敗。リーグ順位と勝ち点は List of Arsenal F.C. seasons。
#   ほかの監督の就任日は各人の Wikipedia（エメリ 2022-11-01・デ・ゼルビ 2026-03-31・マレスカ 2026-06-29・イラオラ 2026-06-04・アロンソ 2026-07-01）。
#   年俸の一覧は football365 10/7（「報じられた額」と断っている）。**媒体名は画面にも読み上げにも出さない。**
# 為替は ECB 参照相場 2026-10-07 の 1ポンド＝208.93円 → 台本は **1ポンド＝209円**。2500万＝約52億／1500万＝約31億／8000万＝約167億／1820万＝約38億。
# 新しい板：stats（冒頭の強い一点）・convert（年俸を円に）・scatter（在任年数×年俸）・calc（上限の倍率）。書き込みは2つ（convert の数字に丸、順位の表の1位に丸）。
# 見立て：自分で並べた6季の順位と勝ち点の表。「勝ち点は1.4倍、年俸の上限は1.7倍」。次の予定は10月10日のリーズ戦。
# サムネの構図は face（number は赤い●が顔の真ん中に乗り、場面写真に替えると主役が誰か分からなくなった。見比べは output/thumb_samples/）。
#   写真は pair_arteta/01.jpg（1920x1080）。01_w.jpg は 942x530 しかなく、本編に敷くと2.04倍に伸びる（precheck ×）。
# 写真：Commons。01 アルテタ（CC BY 3.0、Prime Video AU & NZ、監督時代）＋ facecrop の 01_w / 01_v、
#   本文の人の絵は pair_arteta/01.jpg（左＝優勝の場面、右＝アルテタ。01_w 単体だとテロップの帯が口元にかかった＝preview4 で確認）。
#   02 2026年5月24日のトロフィー（CC BY-SA 4.0、Chensiyuan）、03 同じ日のクローンキー親子（同）、04 エミレーツの外観（CC BY 2.0、Ronnie Macdonald、2012）。
#   **板（表・換算・散らばり図）の下地は 04_w**（顔が無いので板が顔にかからない。01_w に重ねると顔の76%が隠れた＝preview4 で確認）。代理店の写真は使っていない。
# 反応：Yahoo!リアルタイム検索（X）の実在の投稿3件を全文で。**海外の反応は入れられなかった**
#   （Bluesky の公開APIが403、Yahoo!リアルタイムは英語の個人の投稿を拾えず、ブラウザの道具は使えない）。出どころは raw。
# 声：ガーリックは「ガーリック」だとアルテタ（style 99）とぶつかるので「リチャード・ガーリック」（style 11）で書いている。
