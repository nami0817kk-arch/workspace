  takeaway: アーセナルが発表したのは2030年6月までの4年という期限だけで、額は出していない。伝えられている総額は4年で8000万ポンド超、年俸はボーナスを入れて最大2500万ポンド。1ポンド209円で直すと年およそ52億円で、前の契約の上限1500万ポンド（およそ31億円）の約1.7倍になる。クラブでいちばん高い給料とされるサカの週給35万ポンドを52週で足した1820万ポンドより上の額。報じられている年俸と在任の長さを並べると、6年9か月のアルテタだけが右上に離れ、2番目に長いヴィラのエメリは3.9年。就任2季目の勝ち点61から昨季の85へ、勝ち点は約1.4倍、年俸の上限は約1.7倍で、伸びが大きいのは給料のほうだった。アーセナルは10月10日、ホームでリーズと戦う
