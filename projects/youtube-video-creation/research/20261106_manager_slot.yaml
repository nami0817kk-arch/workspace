- id: secret
  heading: 数字の外にある話。足ではなく、パスで勝負した選手
  tier: 背景
  telop: 選手のころから、コーチのように振る舞っていた
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
