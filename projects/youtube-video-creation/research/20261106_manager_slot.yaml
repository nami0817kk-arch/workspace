    card: none
  - text: 選手のころ、チームメイトからは、足は速くないと言われていました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: それでも当時の監督は、パスと視野で、持てる力を出し切った選手だと見ています。
    card:
