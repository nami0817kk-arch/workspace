  - text: 2024年6月、クロップの後を継いで、リヴァプールの監督に。
    image: assets/images/20261106_manager_slot/02_w.jpg
    card:
      <<: *career_tl
      focus: 3
  - text: 2025年4月27日、トッテナムに5対1。ここで優勝が決まります。
    emph: true
    callword: 5対1
    card: none
  - text: リヴァプールが観客の前でリーグ優勝を祝うのは、1990年以来でした。
    image: assets/images/20261106_manager_slot/04_w.jpg
    card: none
  - text: 2季目はプレミアで5位。2026年5月30日、クラブは退任を発表しました。
    card:
      <<: *career_tl
      focus: 4
