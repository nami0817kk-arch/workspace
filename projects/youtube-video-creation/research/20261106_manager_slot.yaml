# 監督紹介：アルネ・スロット（11/6 金、シリーズ「監督紹介」、key: manager_slot、型は news）。9節の型（2026-10-20 決定）。見本は 20261102_manager_luisenrique・20261031_manager_tuchel。
# 順：フック→基礎DATA→日本との接点（基礎DATAの次）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-04）**：既出11人（グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ベンゲル・ファーガソン・トゥヘル・ルイス・エンリケ）以外の大物。
#   ・シャビ・アロンソ（いまはチェルシー監督＝英語版 Wikipedia の infobox で確認）は大物で時事にも合うが、同じ 11/6 の世界レジェンドがフェルナンド・トーレス（スペイン）で国が重なるので外した。covered.yaml にもアロンソのニュースが3件（10/24 退場ゼロほか）。
#   ・コンテ（ナポリを離れて無所属＝英語版の本文「most recently … Napoli」）は日本との接点が薄い。エメリはスペインで国が重なる。ナーゲルスマンは 10/21 の代表ドイツ・10/31 トゥヘル・11/2 ホッフェンハイムに名前が出る。
#   ・スロット：プレミアを就任1季目で優勝（オランダ人で初）＋日本人3人を指導（AZ 菅原由勢・フェイエノールト 上田綺世・リヴァプール 遠藤航）。ヒットの条件（日本代表の選手との縁）に当たる。
#   **重なりの確認（2026-11-04 に自分で）**：research/posted.json に「スロット」0件、research/covered.yaml に0件。scripts は 2026-10-02 の rank_endo（遠藤のランキング。35日前）より後に「スロット」「Slot」は無い。
#   同じ 11/6 の他の担当（research/20261105_picks.txt）：世界レジェンド＝フェルナンド・トーレス（スペイン）。人名・国（オランダ）は重ならない。トーレスもリヴァプールの元選手だが、決まりは人名と国。
#
# **いまの立場（一次情報で確かめた）**：無所属（前リヴァプール監督）。
#   ○ リヴァプール公式 2026-05-30「Liverpool FC statement」（https://www.liverpoolfc.com/news/liverpool-fc-statement-13）：「Arne Slot is to depart his role as head coach with immediate effect」。2024-25 に20回目のリーグ優勝、LMA の年間最優秀監督、リーグカップ決勝、CL16強。2025-26 は CL の出場権と CL 準々決勝。
#   ○ リヴァプール公式 2026-06-04 頃「Liverpool FC appoint Andoni Iraola as new head coach」＝後任はイラオラ。
#   ○ 英語版 Wikipedia「Arne Slot」（最終更新 2026-10-24。本文「most recently the head coach of … Liverpool」）、オランダ語版（同じく 2026-05-30 に解任、その後のクラブ無し）。
#     → **11月4日時点で次のクラブの発表は見つからない**（Wikipedia 2言語。クラブの公式発表を全部は当たれていない）。台本は「11月4日時点で、次のクラブは発表されていません」とだけ言う。
#
# **通算（台本とサムネをそろえる）**＝英語版 Wikipedia「Managerial record by team and tenure」（updated 30 May 2026）：
#   カンブール 34試合21勝6分7敗（2016-10-15〜2017-06-30、シプケ・フルショフとの共同の暫定監督。2部）／AZ 58試合32勝16分10敗／フェイエノールト 150試合98勝29分23敗／リヴァプール 113試合66勝19分28敗。Career total 355試合217勝70分68敗。
#   自分で足して一致（34+58+150+113＝355、21+32+98+66＝217）。勝率（自分で割った）：通算 61.1%、カンブール 61.8%、AZ 55.2%、フェイエノールト 65.3%、リヴァプール 58.4%。
#   **リヴァプールは季ごとの表で突き合わせた**（英語版「2024–25 Liverpool F.C. season」「2025–26 …」の Overall record）：
#     2024-25：プレミア 25勝9分4敗・FA杯 1勝1敗・リーグ杯 4勝2敗・CL 8勝2敗 → 56試合38勝9分9敗（67.9%）。プレミアの勝ち点 25×3+9＝84（自分で計算）。
#     2025-26：プレミア 17勝9分12敗（5位）・FA杯 3勝1敗・リーグ杯 1勝1敗・コミュニティ・シールド 1分（PK負け）・CL 7勝5敗 → 57試合28勝10分19敗（49.1%）。勝ち点 17×3+9＝60。
#     合計 113試合66勝19分28敗 ＝ 通算の表と一致。※オランダ語版は 18分29敗（コミュニティ・シールドのPK負けを負けに数えた差）。台本は英語版の数え方。
#   ※AZ・フェイエノールト・カンブールの数字は英語版 Wikipedia だけ（出典 Soccerway に「Failed verification」の札）。オランダ語版の通算 355試合217勝 とは合う。概要欄の確度は 報道。
#   タイトル（Honours・Manager）：フェイエノールト＝エールディビジ 2022-23・KNVBカップ 2023-24／リヴァプール＝プレミアリーグ 2024-25 → 3つ。個人＝リヌス・ミケルス賞 2回・LMA 年間最優秀監督 2024-25・プレミアの年間最優秀監督 2024-25。
#
# **基礎**：1978-09-17 オランダ・オーファーアイセル州ベルゲンタイム生まれ（48歳）。選手：MF（攻撃的MF）。FCズヴォレ（1995-2002）→NACブレダ（2002-07）→スパルタ・ロッテルダム（2007-10）→ズヴォレ（2009-13、最初は期限付き）。リーグ戦の通算 462試合100得点（infobox の total）。2013年に引退。
#   監督：2013 ズヴォレの育成コーチ→カンブールのコーチ→2016-10-15 カンブールの共同の暫定監督→2017 AZ のコーチ→2019-07-01 AZ 監督（2020-12-05 解任、フェイエノールトとの合意が理由）→2021-07-01 フェイエノールト→2024-06-01 リヴァプール→2026-05-30 退任。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**：
#   ・菅原由勢（2000-06-28生、右SB）：英語版「Yukinari Sugawara」＝2019-06-21 に名古屋から AZ へ期限付き。2019-07-25 ヘッケン戦でデビュー。2019-08-04 フォルトゥナ・シッタート戦で先発し84分に4-0の4点目。その季リーグ16試合2得点。AZ の監督はこの季（2019-20）からスロット（スロットの英語版の表 2019-07-01〜）。
#   ・上田綺世（1998-08-28生、FW）：英語版「Ayase Ueda」＝2023-08-03 フェイエノールトと5年契約。1季目はリーグ26試合5得点（先発5）。2024-04-21 KNVBカップ決勝（NECに1-0）に途中出場して優勝。監督はスロット（〜2024-05-31）。
#   ・遠藤航（1993-02-09生、守備的MF）：英語版「Wataru Endo」＝2024-25 プレミア20試合（季の表は 1+19＝先発1・途中19）、優勝。「香川真司・岡崎慎司・南野拓実に続く4人目の日本人のプレミア優勝」。
#   ※年齢は 2026-11-04 時点で生年月日から計算（菅原26・上田28・遠藤33）。遠藤の代表引退・けがは入れない（病気・けがの話は入れない決まり）。
#
# **戦術の色**＝2024-09-01 プレミア第3節 マンチェスター・ユナイテッド 0-3 リヴァプール（オールド・トラッフォード）。得点：ディアス35分・42分、サラー56分（英語版 2024-25 季の Football box）。
#   英語版「Ryan Gravenberch」：2024-25 の初めにスロットが、4-2-3-1 の中でより後ろの守備的な中盤へ移した。この 3-0 で「dominance」と評価。2025-04-27 トッテナム戦（5-1）でマック・アリスターの得点をアシスト。季の終わりにプレミアの最優秀若手選手。
#   英語版スロット：2024-11-27 CL でレアル・マドリードに2-0、15年勝てなかった相手（前年の欧州王者）に勝った。
#
# **歩みの細部**：英語版スロット：カンブールで14位→3位（昇格プレーオフで MVV に敗れる）、KNVBカップでアヤックスを破りクラブ初の準決勝。AZ のリーグ戦1試合あたり勝ち点 2.11 はクラブの監督で最高。
#   フェイエノールト：1季目 2022 カンファレンスリーグ決勝（ティラナ、ローマに0-1）。2023-05-14 ゴー・アヘッド・イーグルスに3-0でリーグ優勝（2017年以来＝6年ぶり、16回目）。2024-04-21 KNVBカップ優勝。
#   リヴァプール：2025-04-27 トッテナムに5-1で優勝決定。リヴァプール公式「with four matches to spare」「first title victory with supporters present since 1990」「10th man to oversee championship glory for Liverpool」。英語版「the seventh manager in Premier League history to win a league title in their first season」「the first Dutch manager to win the Premier League」。
#   リヴァプール公式：「a spell of 20 wins, three draws and no defeats in all competitions」（秋から年明け）。
#
# **本人の言葉**（リヴァプール公式。英語の原文を訳した）：
#   ①2025年の優勝のあと（https://www.liverpoolfc.com/news/arne-slot-place-lfc-history-after-league-title-no20 に引用）："Everybody could see what it means for the fans to win it, and that is what makes it special and, in the end, for us as well." "Because you play football for yourself, for your family, but definitely also for the fans…"
#   ②2026-06 の別れの手紙（https://www.liverpoolfc.com/news/arne-slot-writes-farewell-letter-liverpool-supporters 、元はリヴァプール・エコーに載ったと公式が書く）："That all of those emotions would culminate in a Premier League title after just 12 months was beyond special." "Liverpool's 20th league title belongs to all of us" "When I first stood beneath that sign in the Anfield tunnel, I knew what this club demanded. I leave knowing we never stopped striving for it."
#
# **マル秘話**（英語版スロットの本文）：チームメイトのエドウィン・デ・グラーフ「not so fast」、監督だったヤン・エフェルセ「パスと視野で選手としての力を出し切った」。チームメイトのブラム・ファン・ポーレン「現役の最後の数年、もうコーチのように振る舞っていた」。
#   フェイエノールトのスタッフにロビン・ファン・ペルシー（フィールドコーチ）。2023年にトッテナムの監督の話が出たが残り、契約を延長。オランダ語版：2024-04-07 アヤックスに6-0、アヤックスのエールディビジ史上最大の負け。
#
# **入れなかったもの**：ディオゴ・ジョッタの事故と死去（亡くなった人の話）、優勝パレードの事故、家族・私生活、2季目の不振の理由の分析（確かめきれない）、解任の内幕の報道、AZ を離れた経緯の細部、移籍金・年俸、次の就任先のうわさ、ニュースの反応・女子・FotMob。
