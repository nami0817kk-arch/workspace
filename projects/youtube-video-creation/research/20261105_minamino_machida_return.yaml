#   ・ゲキサカ 2026-11-04 14:00（メンバー発表。南野・町田が復帰） https://web.gekisaka.jp/news/japan/detail/?462496-462496-fl
# 出典で確かめたこと:
#   ・南野: 昨年12月21日 フランス国内杯オセール戦で左膝前十字靱帯断裂（ゲキサカ）。10月15日 ECL・CSKAソフィア戦で先発し298日ぶりに公式戦復帰（ゲキサカ。サッカーキングの別記事の見出しも298日）。
#       代表は昨年11月以来（ゲキサカ「1年ぶり」）。復帰後の公式戦は3試合（サッカーキング）。
#   ・町田: 昨年8月23日 ブンデス第1節の新天地デビュー戦で左膝前十字靭帯断裂（ゲキサカ。サッカーキング「昨年8月」と一致）。9月12日 第3節シュツットガルト戦 後半24分から出場し385日ぶりに復帰。
#       直近は6試合中5試合でフル出場（ゲキサカ）。代表は昨年6月以来（ゲキサカ・サッカーキングとも「1年半ぶり」）。EL初ゴール（ゲキサカ 461125 の見出し「約1年半ぶりの得点」）は題に絡まないので使わない。
#   ・年齢: 生年月日から 2026-11-05 時点で計算。南野拓実 1995-01-16＝31／町田浩樹 1997-08-25＝29。所属は JFA 発表（モナコ／ホッフェンハイム）。区分は JFA の GK/DF/MF/FW に合わせる（南野 MF/FW・町田 DF）。
#   ・日程: 11/14 ブラジル、11/17 パラグアイ（シンガポール）。
# 記事どうしの食い違い:
#   ・森保監督の言葉の書き起こしが2社で違う（サッカーキング「棒に降る」「見さしてもらって」「嬉しく思っております」／ゲキサカ「棒に振る」「見させてもらって」「嬉しく思っている」）→ 句読点・言い回しが整っているゲキサカの表記をそのまま使い、中身は変えない。
#   ・南野の「60分」の言葉: サッカーキング「計算もできます」／ゲキサカ「計算ができる」→ ゲキサカの表記。
#   ・南野の復帰戦の出場時間: ゲキサカ「58分間」、サッカーキング別記事・本記事「最長59分」→ 分は台本で言わない（森保監督の「60分程度」の言葉だけ）。
#   ・題の「約1年ぶり」: ゲキサカは南野＝1年ぶり、町田＝1年半ぶり。台本は2人を分けて言う。
# 【言わないこと】福田師王（11/4 の 20261104_japan_squad_brazil_paraguay が主役）／アジアカップ延期・森保監督の去就／ブラジル戦の通算成績・キックオフ時刻／上田綺世ほか選外の選手／
#   南野がW杯にメンターとして帯同した話（本題から離れる）。11/4 の同じ本の「膝の大けがでW杯を逃した2人」の1行とは重ねず、けがの日付・復帰までの日数・監督が見ている点を今日の中身にする。
