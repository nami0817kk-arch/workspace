- id: view
  viewpoint: true
  heading: 見立て・青白の117年と、名前の6回
  bg: assets/images/20261117_kit_realsociedad/p_fans_w.jpg
  tier: 背景
  narrator: 解説
  telop: 青と白のしまは117年。名前は6回、王冠は約9年なかった。胸の空白は6年。名前は約20年に1度替わった計算
  card: *view
  say:
  - text: レアル・ソシエダの青と白、名前と王冠を、数で並べます。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 青と白のしまは、創立から、117年。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *view
      highlight_row: 0
  - text: 名前は、117年のあいだに、細かな替わりまで数えて、6回。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *view
      highlight_row: 1
  - text: 王冠が紋章になかったのは、約9年。117年の、約8%です。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *view
      highlight_row: 2
    mark:
      kind: circle
      row: 2
  - text: 胸の空白は、1981年から87年の6年。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: 117年を6回で割ると、約20年に1度、名前が替わった計算です。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      type: calc
      title: 名前が替わる間隔（自分で割った）
      terms:
      - - 117年
        - 創立から
      - - 6回
        - 名前の替わり
      - - 約20年
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: それでも、旗でボールを巻いた紋章と、青と白は、残りました。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card: none
  - text: 替わったのは名前で、守ってきたのは、色と紋章でした。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card: none
    emph: true
