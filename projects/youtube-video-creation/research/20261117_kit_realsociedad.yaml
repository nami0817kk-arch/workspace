  telop: 2連覇のころの1981年から87年は胸に広告なし。1987年の地元企業から。作る会社は45年で6期。アストーレが17年でいちばん長い
  card: *chest
  say:
  - text: レアル・ソシエダは、1980年代の初めに、2連覇を果たしました。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 1981年から1987年の6季、胸は、まっさらでした。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *chest
      highlight_row: 0
    emph: true
    callword: 胸は6年、空白
  - text: そのあいだにシャツを作っていたのは、アディダスです。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 初めて広告が入ったのは、1987年9月の契約です。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *chest
      highlight_row: 1
    emph: true
  - text: 相手は、ギプスコア県の会社、ニーセン。契約は、2季続きました。
    image: assets/images/20261117_kit_realsociedad/p_kit_w.jpg
    card: none
  - text: メーカーも、1987年からは、ラサンです。
    image: assets/images/20261117_kit_realsociedad/p_arc_w.jpg
    card: none
  - text: 1994年からは、スペインのブランド、アストーレが作ります。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *chest
      highlight_row: 2
  - text: アストーレは、2011年まで17年。この45年で、最長の付き合いです。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card: none
    emph: true
  - text: 2011年はナイキ。2014年からはアディダス。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *chest
      highlight_row: 4
  - text: 2018年からは、イタリアのマクロンです。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *chest
      highlight_row: 5
  - text: 1981年からの45年で、6期。平均は、7年半です。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card: none
  sources:
