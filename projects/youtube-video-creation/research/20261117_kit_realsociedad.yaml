# ユニフォームとエンブレムの歴史 レアル・ソシエダ（11/12 作成、11/17 分）。ラ・リーガの6本目。雛形は 11/13 アスレティック回（20261113_kit_athletic.yaml）。
# 題の問い：紋章から王冠が一度消えたのは、いつ、なぜか。答え＝1931年4月の共和制で王を思わせるものが禁じられ、王冠が外れ、名前も「レアル」を外して「ドノスティアFC」に。紋章の文字も SS から DFC に。1939-40季に戻る。
# 選んだ理由：指示書「ユニフォームはラ・リーガの続き」。済み：バルセロナ・レアル・アトレティコ・アスレティック、同じ日のバレンシア（11/15）。
#   スタジアム担当と同じクラブにしない → research/20261115_picks.txt に1行（11/15 バレンシア・11/17 レアル・ソシエダ）。ソシエダは 11/13 にスタジアム（アノエタ）で出済み＝スタジアム担当は選ばない。
#   アスレティック（11/13）の「赤白の買い物」と同じバスクでも、こちらは「王冠が消えた」＝別の問い。名前と王様と共和制の話で、前回と重ならない。
# 重なり確認（2026-11-12）：scripts/*kit_* にレアル・ソシエダは無し。直近30日：20261113_stadium_realsociedad（4日前・スタジアム。アノエタの話だけ）／20261106_nakamura_lyon_sociedad（ニュース）。
#   この回では、本拠地の名前・建物・陸上トラックの話は言わない（4日前のスタジアム回）。写真も 20261113_stadium_realsociedad のものは使わない。
#   1982年前後の連覇は1行（「2連覇した」）だけ。久保建英の話は、このシリーズには入れない（日本との接点は無理に入れない）。
# 今季のリーグ：es "Real Sociedad de Fútbol"（2026-27 の登録選手の項あり）。ラ・リーガ。情報の時点は 2026年11月12日。
# 取材：requests だけ（Wikipedia API）。ブラウザ操作・JS実行は使っていない。クラブ公式は読んでいない。
#   読んだ：es "Real Sociedad de Fútbol"（Historia・Indumentaria・Denominaciones・Proveedores y patrocinadores）、en "Real Sociedad"（Early history・Name and colours）、ca "Reial Societat de Futbol"（Els colors・L'escut・Proveïdors i patrocinadors）。
# ---- 食い違い・断ったこと ----
#   ・青白の由来：en「色は、サン・セバスティアンの旗（白地に青い四角）から」、ca「サン・セバスティアン・レクリエーション・クラブの色は緑と黄。1908年に今の色に替えた」、es「創立からずっと同じ青と白のしま。パンツ・ソックスは年で替わる。1967年に白パンツと青白しまソックスに」。
#     → 台本は en の旗の由来、ca の「緑と黄から1908年に青白へ」、es の「創立から同じしま」をそのまま言う。「1908年に青白に替えたのは、新しいクラブを作った選手たち」は ca の「1908年」と en の「1908年に新クラブ」から。
#   ・クラブの始まり：en「1904年にレクリエーション・クラブ。1907年の対立で選手が抜け、1908年に新クラブ。1909年のコパは自転車クラブの名前で出て優勝。そのあと、同じ選手たちが 1909年9月7日にソシエダを作った」。es も一致（9月7日、自転車クラブ）。
#   ・レアルの称号：es「1910年2月11日、アルフォンソ13世が与えた」、en「1910年に国王が後援」。→ 台本は es の日付。国王が夏の都をサン・セバスティアンに置いた、は en。
#   ・共和制と名前：es「1931年4月、共和制になり、王を思わせるものが法律で禁止。王冠を外し、『レアル』も外す。6月30日の総会でドノスティアFC（バスク語の街の名）に。1939-40季の途中に、元の名前に戻す」。en は「1931年に Donostia Club de Futbol、1939年に Real Sociedad」と書く（1939 と 1939-40 で年が少しずれる）。→ 台本は es に合わせて「1939-40年のシーズン」と言う。
#   ・紋章：ca「古い革のボールを、旗で巻いた形。旗は白と紺（ギプスコア県の色と重なる）。旗の中の丸い盾に SS の文字。共和制のあいだは、王冠が外れ、街の紋章を置き、SS が DFC に。旗・色・ボールは変わらなかった。2017年に青の色味を、初期と1980年代の青に戻すと発表」。es の図説「1909-10 の最初の紋章は、旗がボールを抱く形」。
#     ca の「王冠を街の紋章に替えた」の細部は資料1つなので言わない。「SS から DFC に」は ca のみ（es の文字の話は無い）。→ ca の記述として台本に入れる。
#   ・広告・メーカー：es・ca の表は両方「1981〜87は広告なし」。1987年以降の最初の広告主名は es と ca で食い違う（es：ニーセン1987-88、バンコア1990-94／ca：バンコア1987-94）。
#     Commons の写真の説明（Kutxa Fototeka）は「1987年9月1日、オイアルツンのニーセン社がレアル・ソシエダとスポンサー契約に署名」「ニーセンが支援した2季」と書く＝es の表に合う。→ 台本は「1987年9月、ニーセン、2季」。以降の広告主の名前は言わない。
#     メーカー：アディダス 1981–87、ラサン 1987–94、アストーレ 1994–2011、ナイキ 2011–14、アディダス 2014–18、マクロン 2018–（ca の表。es の表はメーカー欄が空）。アストーレは es・ca とも 2011 まで。
#   ・2017年の青：ca が DiarioVasco（2017-10-06）を引く。→ 台本は「発表した」まで。
#   ・es 本文に「2026年のコパ・デル・レイをアトレティコにPK戦で勝って獲った」とあるが、一次情報を確かめていないので使わない。
# ---- 自分で数えた数 ----
#   青と白：1909→2026＝117年（クラブの創立から）。名前：es の表の7つの名前（1909 Sociedad de Foot-ball → 1910 Real Sociedad → 1931 Sociedad（数か月）→ 1931 Donostia → 1940 Real Sociedad de Foot-ball → 1941 Real Sociedad de Fútbol → 1992 S.A.D. を足す）＝6回の変更。117÷6＝19.5 → 約20年に1度。
#   王冠のない期間：1931年4月→1939-40季の途中＝約9年（es「ほぼ10年」）。胸の広告なし：1981→1987＝6年。
#   メーカー：1981→2026＝45年で6期（アディダス・ラサン・アストーレ・ナイキ・アディダス・マクロン）。45÷6＝7.5年。アストーレ 1994→2011＝17年。
# ---- 日本との接点 ----
#   見つけられなかった（このシリーズでは久保建英の在籍は触れない。シャツ・紋章と日本のつながりは、読んだ資料に無い）。無理に入れない。
# 言わなかったもの：本拠地の話（4日前のスタジアム回）／1987年以降の広告主の名前／2026年のコパの結果／ニュースの話（久保建英）／ギプスコア県の紋章の細部。
# 写真：assets/images/20261117_kit_realsociedad/（credits.json）。Commons（CC BY・CC BY-SA・Public domain）。代理店・放送映像・エンブレム画像は使っていない。人物は特定していない。
