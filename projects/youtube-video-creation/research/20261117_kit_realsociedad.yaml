sections:
- id: stripes
  main: true
  heading: レアル・ソシエダの青と白のしまは、どこから来たのか
  bg: assets/images/20261117_kit_realsociedad/p_fans_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1904年の最初のクラブの色は緑と黄。1908年に新しいクラブが青と白を選ぶ。もとは、サン・セバスティアンの旗の色
  card: *stripes
  say:
  - text: 今回はレアル・ソシエダ。青と白のしまと、紋章から消えた王冠の話です。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 街は、スペイン北部、バスク地方の、サン・セバスティアン。ギプスコア県の中心です。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: サッカーを持ち込んだのは、イギリスから戻った、学生や労働者でした。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 1904年、街で最初のクラブができます。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *stripes
      highlight_row: 0
  - text: サン・セバスティアン・レクリエーション・クラブです。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: このクラブの色は、緑と黄色でした。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card: none
  - text: 1907年、クラブで対立が起き、選手が抜けます。翌年、新しいクラブをつくります。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *stripes
      highlight_row: 1
  - text: その新しいクラブが選んだ色が、青と白です。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card: none
    emph: true
  - text: 青と白は、サン・セバスティアンの旗の色です。白地に、青い四角。
    image: assets/images/20261117_kit_realsociedad/p_flag_w.jpg
    card: none
  - text: 1909年、新しいクラブは、スペインのカップ戦、コパ・デル・レイに出ます。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card:
      <<: *stripes
      highlight_row: 2
  - text: ただ、登録が間に合いません。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card: none
  - text: 自転車クラブの名前を借りて出場し、優勝します。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card: none
    emph: true
    callword: 別の名前で優勝
  - text: 数か月後の9月7日、同じ選手たちが、ソシエダとして正式に認められます。
    image: assets/images/20261117_kit_realsociedad/p_fans2_w.jpg
    card: none
  - text: シャツのしまは、創立からずっと同じ、とされます。
    image: assets/images/20261117_kit_realsociedad/p_kit_w.jpg
    card: none
  - text: パンツは白、ソックスは青と白のしま。今の組み合わせは、1967年からです。
    image: assets/images/20261117_kit_realsociedad/p_old_w.jpg
    card:
      <<: *stripes
      highlight_row: 3
  - text: 2つ目のシャツには、緑と黄色が使われたことがあります。最初のクラブへの敬意です。
    image: assets/images/20261117_kit_realsociedad/p_kit_w.jpg
    card: none
