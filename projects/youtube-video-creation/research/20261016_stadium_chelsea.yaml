# スタジアム紹介シリーズ⑥：チェルシーの本拠地（スタンフォード・ブリッジ、10/16）。雛形は 10/14 ブライトン回（research/20261014_stadium_brighton.yaml）。
# 節の並び：オープニング → 基礎DATA(main・強い一点を頭に) → 生まれ（年表）→ 建て直し28年（年表）→ ここで起きた日（表）→ 計画が止まった所（年表＋文書カード＋増減）→ 見立て（自分で数えた比べ）
#
# 強い一点：**最多の入場は 82,905人（1935-10-12 アーセナル戦。クラブ公式の記録）。いまの収容は 40,044人（プレミア公式ハンドブック2026/27）。
#   82,905 ÷ 40,044 = 2.0704 →「2.07倍」。40,044 ÷ 82,905 = 0.4830 →「半分以下」。**
#   確度は**報道**（クラブ公式ページ・プレミア公式の資料まで辿ったが、最多入場のクラブ公式ページは原文を読めず＝Wikipedia 経由。tier は報道に留めた）。
#
# **重なりで外したもの（クラブ紹介⑥チェルシー 2026-09-20 公開 / 9-16 の旧台本が読んだ話）**
#   クラブ紹介は「スタジアムが先にあった」を題にし、**1904年にガス・ミアーズが手に入れた・フラムに借りないかと持ちかけて断られた・
#   だからクラブを作った・本拠地の土地とクラブ名の権利はサポーターの会社が持つ（開発業者への売却を防ぐ）・収容4万44人**を読んでいる。
#   この回は **フラムの断り・「スタジアムが先」の筋・「売却を防ぐ」の一言**を言わない。ミアーズ兄弟は「権利を手に入れた」の1行だけ（公式の歴史の事実）。
#   CPO は**新しい中身だけ**（会社ができた日＝Companies House、住宅やスーパーが建つ恐れ、2011年の投票、クラブ名の条件）。収容 4万44人 は同じ数字だが、この回の主役（記録との差）なので外せない。
#
# **言わないと決めたもの**
#   **女子（チェルシー女子の本拠地入り 2026-27、1924年女子オリンピアード、2013年女子CL決勝）は扱わない**（2026-09-16 指示）。
#   **クラブ公式の stadium-history ページ**（chelseafc.com/en/stadium-history）は本文を読めた（research/raw/20261016_stadium_chelsea_official_history.md）。年表の大半はこれ。
#   **公式の「General information」ページは収容を 40,022 と書く**（取得 2026-10-16）。プレミア公式ハンドブック2026/27は 40,044（開幕時）。
#     食い違い（22人）の理由は未確認。台本は 40,044（ハンドブック・Wikipedia）だけ。**40,022 は言わない。**
#   **PL公式の試合データに 2024-12-01 ヴィラ戦で入場 40,853**（当時の収容 40,173 を超える。2018-19 の収容 40,853 と同じ数字で、入力の誤りの疑い）。使わない。
#   **2018-05-31 の「計画保留」声明は、クラブ公式ページ（chelseafc.com/en/news/2018/5/31/stadium-plans-on-hold）が今は 404 で読めず**、Wikipedia の引用（英文）で確かめた。
#     文書カードはその引用の訳（「…」を含む抜粋）。**クラブの原文を直接は読めていない**。
#   **2018年より後の計画（2022-07 新オーナーが建築家を任命、2023-07 隣のサー・オズワルド・ストール・マンションズの買収合意）は報道のみ**。
#     最新の公式発表まで辿れなかったので**台本に書かない**（指示：報道の推測は書かない）。
#   「1905年の初年は6万人の観客」はクラブ公式ページの文（"a 60,000 crowd in the first year"）。数えた数字ではなく、「とクラブは書いています」。
#   1945年のディナモ・モスクワ戦の入場「10万人超」は Wikipedia の**推定**（公式の最多 82,905 とは別）。日は 11月とだけ（Wikipedia は日付を書かない・未確認）。
#   2010-11 の収容 42,449 は Wikipedia のシーズン表のみ（原典の PL ハンドブック2010-11 は未取得）→「とされています」。
#   Wikipedia の「12番目に大きい」「（収容）12.5エーカー」等は使わない。
#   1982年のケン・ベイツが「1ポンドで買った」は Wikipedia のみ。公式ページは「early 1980s」なので**年を言わず「1980年代の初め」**。
#
# 自分で数えた・割った（検算した）:
#   82,905 ÷ 40,044 = 2.0704／40,044 ÷ 82,905 = 0.4830／
#   プレミア20クラブの今季開幕時の収容（PL ハンドブック2026/27、20クラブ全部を抽出）を大きい順に並べて、チェルシーは **9番目**（上に8・下に11）。合計 822,365 ÷ 20 = 41,118.25、平均との差 41,118.25 − 40,044 = 1,074（≒1074人）／
#   ロンドンの6クラブ（アーセナル62,850→トッテナム…）：トッテナム 62,850・アーセナル 60,704・チェルシー 40,044・フラム 28,107・パレス 25,194・ブレントフォード 17,250 → **3番目**／
#   2025-26 ホーム19試合の入場（PL公式の試合データ）：合計 752,432 ÷ 19 = 39,601.68 →「3万9602人」（Wikipedia の表も 39,602）／
#   39,601.68 ÷ 40,044 = 0.98895 →「98.9％」／最多 39,820（2025-11-30 アーセナル）・最少 39,253（2026-02-10 リーズ）→ 差 567 = 567 ÷ 40,044 = 1.416％ →「1.4％」／
#   62,850 ÷ 40,044 = 1.5695 →「1.57倍」／
#   42,449 − 40,343 = 2,106／40,343 − 40,044 = 299／42,449 − 40,044 = 2,405（−5.67%）／
#   1973 着工 → 2001/02 完成 ＝ およそ28年（公式：「begun way back in 1973」）。
#
# 写真：assets/images/20261016_stadium_chelsea/（credits.json 同梱）。下地は assets/backgrounds/stadium_チェルシー_in.png（Commons: Neil Theasby, CC BY-SA 2.0）。
