    image: assets/images/20261016_stadium_chelsea/06_w.jpg
    card: *id_match
  - text: 1920年から22年に、FAカップの決勝が3回。入場は、どれも今の収容より上。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 0
  - text: 21年は、トッテナムがウルヴァーハンプトンを1対0で下しました。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 入場は、3回のうち最多でした。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 1
  - text: 22年は、ウェンブリーができる前の、最後の決勝でした。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 2
  - text: 1935年10月12日、アーセナル戦。公式に数えた、最多の入場が出た日です。
    emph: true
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 3
  - text: 1945年11月には、ソ連のディナモ・モスクワが、親善試合で来ました。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 4
  - text: 3対3の引き分け。入場は、10万人を超えたと推定されています。
    emph: true
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 4
  - text: 犬のレースのトラックや、スタンドの上にまで、人があふれたとされています。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 4
  - text: 昔は、席より人があふれた。いまは、席の数とほぼ同じです。
    card: none
  - text: 昨季のリーグ戦の最多は、11月30日のアーセナル戦。3万9820人でした。
    card:
      type: table
      title: スタンフォード・ブリッジで起きた6つの日
      columns: *cols_match
      rows: *rows_match
      highlight_row: 5
