- id: origin
  heading: スタンフォード・ブリッジは、もとは何のための場所だったのか
  tier: 背景
  telop: 1877年は陸上の会場。計画した収容は10万人
  narrator: 解説
  card: &id_origin
    type: timeline
    title: 開場から、立ち見の丘がなくなるまで
    rows: &rows_origin
    - - 1877年4月
      - 陸上競技の会場として開く
    - - 1904年
      - ミアーズ兄弟が権利を手に入れる
    - - 1905年
      - クラブが生まれる
    - - 1930年代
      - 南の立ち見に屋根がつく
    - - 1945年
      - 北東に、高く持ち上げた席ができる
    - - 1965年
      - 西側に6000席あまりのスタンド
    focus: 1904年
  say:
  - text: スタンフォード・ブリッジが開いたのは、1877年4月28日です。
    image: assets/images/20261016_stadium_chelsea/03_w.jpg
    card: none
  - text: 使っていたのは、ロンドン・アスレチック・クラブ。陸上のレースに使われました。
    card: none
  - text: 1904年、のちにクラブを作るミアーズ兄弟が、この会場の権利を手に入れます。
    card:
      <<: *id_origin
      highlight_row: 1
  - text: サッカーを開くために、となりの土地も買い足していました。
    card:
      <<: *id_origin
      highlight_row: 1
  - text: 設計は、アーチボルド・リーチ。各地の競技場を手がけた建築家です。
    card:
      <<: *id_origin
      highlight_row: 1
  - text: 計画した収容は、10万人でした。
    emph: true
    callword: 10万人
    card: none
  - text: 当時のイングランドで、昔のクリスタル・パレスの競技場に次ぐ、2番目の大きさです。
    card: none
  - text: 屋根のある席は、東側の5000人ぶんだけ。ほかの3辺は、開けた大きな丘でした。
    card: none
  - text: 地下鉄の工事で出た土を盛って、立ち見の席にしたものです。
    card: none
  - text: ピッチのまわりを、トラックが囲んでいました。観客は、ピッチから遠かった。
    card: none
  - text: クラブが生まれたのは、1905年。
    card:
      <<: *id_origin
      highlight_row: 2
  - text: 初めの年には、6万人の観客が入ったと、クラブは書いています。
    card:
      <<: *id_origin
      highlight_row: 2
  - text: 1930年代には、南の立ち見の席に屋根がつきます。
    card:
      <<: *id_origin
      highlight_row: 3
  - text: 犬のレースを開く団体が、賭けをする人のために付けた屋根でした。
    card:
      <<: *id_origin
      highlight_row: 3
  - text: いまの南のスタンドの「シェッド」という呼び名は、この屋根の形から来ています。
    card:
      <<: *id_origin
      highlight_row: 3
  - text: 1965年には、西側に6000席あまりのスタンドが建ちました。
    card:
      <<: *id_origin
      highlight_row: 5
  sources:
  - https://www.chelseafc.com/en/stadium-history
  - https://en.wikipedia.org/wiki/Stamford_Bridge_(stadium)
- id: rebuild
  heading: なぜ、観客席を全部そろえるのに28年もかかったのか
  tier: 背景
  telop: 1973年に東スタンドから着工。4辺がそろうのは2001年
  narrator: 解説
  card: &id_rebuild
    type: timeline
    title: 建て直しの歩み
    rows: &rows_rebuild
    - - 1974年
      - 東スタンドだけ完成
    - - 1980年代初め
      - クラブが売られ、土地は別会社へ
    - - 1992年
      - 開発業者が破産、土地が戻る
    - - 1994年
      - 北スタンドが開く
    - - 1997年
      - 南のシェッドが開く
    - - 2001年
      - 西スタンドが完成
    focus: 2001年
  say:
  - text: 1970年代の初め、クラブは、建て直しを決めます。
    image: assets/backgrounds/cut_チェルシー.png
    card: none
  - text: 全体を、6万人の全席イス席にする計画でした。
    image: assets/images/20261016_stadium_chelsea/04_w.jpg
    card: none
  - text: 最初は東側から。ところが、工事の遅れと費用の増加が重なります。
    card: none
  - text: 設計を任された建築家には、スタジアムの経験がありませんでした。
    card: none
  - text: 東スタンドは、1974年に開きます。でも、建て直しはそこで止まりました。
    card:
      <<: *id_rebuild
      highlight_row: 0
  - text: 全体を建て直す計画は、東側だけで終わりました。
    card:
      <<: *id_rebuild
      highlight_row: 0
  - text: この費用が、クラブを破産寸前まで追い込みました。
    card:
      <<: *id_rebuild
      highlight_row: 0
  - text: 1980年代の初め、クラブは、実業家のケン・ベイツに買われます。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: ところが、ベイツが買ったのは、クラブだけでした。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: 土地は、別の会社の持ち物でした。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: その会社の株は、元の役員から、不動産の開発業者へ渡っていました。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: 土地に、住宅やスーパーが建つかもしれない。
    emph: true
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: ほかのロンドンのクラブと、本拠地を共有するかもしれない。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: 法廷の争いは、およそ10年。「橋を守れ」という募金の運動まで生まれました。
    card:
      <<: *id_rebuild
      highlight_row: 1
  - text: 1992年、不動産の暴落で、開発業者のほうが破産します。
    emph: true
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: 土地は、クラブの手に戻ります。
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: 翌1993年3月には、チェルシー・ピッチ・オーナーズという会社が作られます。
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: ファンが株を持つ会社で、のちに土地とクラブの名前の権利を持ちます。
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: つまり今の土地の持ち主は、クラブではなく、この会社です。
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: 移転してクラブの名前を使うには、株主の4分の3の同意が要るとされます。
    card:
      <<: *id_rebuild
      highlight_row: 2
  - text: 北スタンドが開いたのは、1994年11月。
    image: assets/images/20261016_stadium_chelsea/05_w.jpg
    card:
      <<: *id_rebuild
      highlight_row: 3
  - text: 2年後、出資で建設を助けた副会長、マシュー・ハーディングの名前がつきました。
    card:
      <<: *id_rebuild
      highlight_row: 3
  - text: 南のシェッドは、1997年に、イス席のスタンドになります。
    card:
      <<: *id_rebuild
      highlight_row: 4
  - text: 最後は西スタンド。下の段は、予定どおり建ちました。
    card:
      <<: *id_rebuild
      highlight_row: 5
  - text: ところが、市との許可の問題で、残りの工事は2年止まります。
    card:
      <<: *id_rebuild
      highlight_row: 5
  - text: 4つの辺がそろったのは、2001年から02年のシーズンの開幕です。
    emph: true
    card:
      <<: *id_rebuild
      highlight_row: 5
  - text: 東スタンドの着工から数えて、およそ28年です。
    emph: true
    card:
      <<: *id_rebuild
      highlight_row: 5
  - text: 4つの辺は、どれもピッチのすぐそばに並びました。
    card:
      <<: *id_rebuild
      highlight_row: 5
  - text: 収容は4万人ほど。最初に描いた6万人より、約2万人少ないままです。
    card:
      <<: *id_rebuild
      highlight_row: 5
