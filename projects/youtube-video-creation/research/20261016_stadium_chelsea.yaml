- id: plan
  heading: 6万席の新スタジアム計画は、どこで止まったのか
  tier: 報道
  telop: 2015年に6万席の計画を発表。2018年5月に保留
  narrator: 解説
  card: &id_plan
    type: timeline
    title: 新スタジアム計画の歩み
    rows: &rows_plan
    - - 2011年10月
      - 土地を持つ会社の株主が、権利の売却を断る
    - - 2012年5月
      - バタシー発電所の跡地を買う申し出
    - - 2015年12月
      - 同じ場所で6万席の建て替えを発表
    - - 2017年
      - 区の議会と市長が許可
    - - 2018年5月
      - クラブが計画を保留
    focus: 2018年5月
  say:
  - text: スタンフォード・ブリッジを大きくする話は、何度も出ています。
    image: assets/images/20261016_stadium_chelsea/07_w.jpg
    card: none
  - text: 2011年10月、クラブは、その会社から土地の権利を買い戻したいと提案しました。
    card:
      <<: *id_plan
      highlight_row: 0
  - text: ファンが株主の、土地を持つ会社は、売らないと決めます。
    card:
      <<: *id_plan
      highlight_row: 0
  - text: 2012年5月には、ロンドンのバタシー地区、古い発電所の跡地を買う申し出をします。
    card:
      <<: *id_plan
      highlight_row: 1
  - text: 6万席を作る考えでしたが、受け入れられませんでした。
    card:
      <<: *id_plan
      highlight_row: 1
  - text: 2015年12月、いまの場所に、6万席のスタジアムを建てると発表します。
    card:
      <<: *id_plan
      highlight_row: 2
  - text: 設計は、ミュンヘンのアリアンツ・アレーナを手がけた、スイスの事務所でした。
    card:
      <<: *id_plan
      highlight_row: 2
  - text: 2017年には、区の議会とロンドン市長が、建築を許可しました。
    card:
      <<: *id_plan
      highlight_row: 3
  - text: ところが、2018年5月31日、クラブは、計画を止めます。
    emph: true
    card:
      type: document
      label: チェルシー 声明（2018年5月31日。英文の引用を訳した）
      paragraphs:
      - チェルシー・フットボールクラブは本日、新スタジアムの計画を保留したと発表する。
      - これ以上、建設前の設計や計画の作業は行わない。
      - クラブは、この判断を見直す時期を決めていない。
      - 判断の理由は、現在の投資環境が不利なことである。
      highlight:
      - 保留
      - 見直す時期を決めていない
  - text: 建設前の設計や計画の作業は、これ以上しない。見直す時期も、決めていない。
    card:
      type: document
      label: チェルシー 声明（2018年5月31日。英文の引用を訳した）
      paragraphs:
      - チェルシー・フットボールクラブは本日、新スタジアムの計画を保留したと発表する。
      - これ以上、建設前の設計や計画の作業は行わない。
      - クラブは、この判断を見直す時期を決めていない。
      - 判断の理由は、現在の投資環境が不利なことである。
      highlight:
      - 保留
      - 見直す時期を決めていない
  - text: 理由は、いまの投資の環境が不利なことでした。
    card:
      type: document
      label: チェルシー 声明（2018年5月31日。英文の引用を訳した）
      paragraphs:
      - チェルシー・フットボールクラブは本日、新スタジアムの計画を保留したと発表する。
      - これ以上、建設前の設計や計画の作業は行わない。
      - クラブは、この判断を見直す時期を決めていない。
      - 判断の理由は、現在の投資環境が不利なことである。
      highlight:
      - 保留
      - 見直す時期を決めていない
  - text: では、収容の数字は、その後どう動いたのか。2010年度から追います。
    card: &id_wf
      type: waterfall
      title: 収容は、どう減ったか（自分で引いた）
      start:
      - 2010年度の収容
      - 42449
      steps:
      - - 2022年の開幕までに
        - -2106
      - - 今季の開幕までに
        - -299
      total:
      - 今季の開幕時
      - 40044
      unit: 人
  - text: 2010年度は、4万2449人とされています。
    card: *id_wf
  - text: 2022年の開幕時は、4万343人です。
    card: *id_wf
  - text: 差は、2106人。そこから今季までに、さらに299人減りました。
    emph: true
    card: *id_wf
  - text: 減った理由は、確かめられていません。
    emph: true
    card: *id_wf
  - text: 合わせて2405人、5.7％の減り方です。
    card: *id_wf
  - text: 広げる計画は止まったまま、収容は記録の半分以下です。
    card: *id_wf
