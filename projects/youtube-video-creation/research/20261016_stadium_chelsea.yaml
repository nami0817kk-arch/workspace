  say:
  - text: ここからは、4万人の器がどれだけ埋まっているかを、数字で比べます。
    image: assets/images/20261016_stadium_chelsea/02_w.jpg
    card: *id_rank
  - text: 今季の収容を、20クラブぶん上から並べます。
    card: *id_rank
  - text: チェルシーは9番目。上に8クラブ、下に11クラブです。
    emph: true
    mark:
      kind: circle
      row: 2
    card:
      type: table
      title: 今季の収容、20クラブの順位（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: 20クラブの平均より、1074人だけ小さい数です。
    card:
      type: table
      title: 今季の収容、20クラブの順位（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: ロンドンの6クラブでは3番目。上にいるのは、トッテナムとアーセナル。
    card:
      type: table
      title: 今季の収容、20クラブの順位（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: 次に、入場を見ます。昨季のホーム19試合の平均は、3万9602人でした。
    card: &id_fill
      type: calc
      title: 昨季の平均入場と収容（自分で割った）
      terms:
      - - 3万9602人
        - 昨季のホーム19試合の平均入場
      - - 4万44人
        - 昨季の開幕時の収容
      - - 98.9％
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 平均入場を、収容で割ります。答えは、98.9％です。
    emph: true
    card: *id_fill
  - text: 19試合のうち、いちばん多い日と少ない日の差は、567人。収容の1.4％です。
    card: *id_fill
  - text: 最多はアーセナル戦、最少はリーズ戦。どちらも、ほぼ満員。結論は、ほぼ毎試合が満員。
    card: *id_fill
  - text: 次の本拠地戦は、10月24日。相手はトッテナムです。
    emph: true
    card: none
  - text: このトッテナムは、1921年にここで開かれたFAカップ決勝で、優勝したクラブ。
    card: none
  - text: トッテナムの本拠地の収容は、チェルシーの1.57倍です。
    card: none
  - text: ほぼ満員の本拠地が、より大きな本拠地を迎えます。
    emph: true
    card: none
