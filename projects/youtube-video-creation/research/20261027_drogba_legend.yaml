# ディディエ・ドログバ（元コートジボワール代表FW）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-27。型は 10/26 のジェラードと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Didier Drogba の成績表・本文、2012 UEFA Champions League final、2014 FIFA World Cup Group C、各カップ決勝の記事、Japan national football team results (2010–2019)）・BBC（2018-11-21 引退の記事と本人の言葉）と、自分で足した値だけ。
# **私生活・法的な問題は入れない**（Personal and family life の節は使わない）。2005年の内戦の停戦の呼びかけは、因果の言い方が資料で割れるので入れない。女子サッカーは入れない。
#
# **重なりの確認（10/26）**：scripts/・research/covered.yaml・research/posted.json を「drogba／ドログバ」で grep。ドログバが主役の回は無し（9/20 のチェルシー紹介の名選手の1人として出ただけ。36日前で30日の外）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード）とも重ならない。
# **イスタンブール（2005年CL決勝）は山場にしない**。山場は 2012年5月19日ミュンヘンの CL決勝（10/24・10/26 と別の試合）。
# **引退の確認（一次情報に近いもの）**：BBC 2018-11-21「Didier Drogba: Chelsea and Ivory Coast legend retires from playing」を requests で本文確認（本人「After 20 years, I have decided to put an end to my playing career」、BBC World Service の Sportshour）。最後の試合は 2018-11-08 の USL カップ決勝（ルイヴィル・シティに0対1、Wikipedia／Sky Sports）。→ **現役ではない（48歳）**。
# **いまの立場**：引退後もフェニックス・ライジングの共同オーナー（Wikipedia）。2018年に Peace and Sport の副会長（Wikipedia）。バロンドールの授賞式の司会を 2019・2021・2022・2023・2024 の5回（各年の Ballon d'Or の記事の host 欄。2020は中止、2025 は別の司会）。2026-05-11 パリの UNFP 表彰式で、財団の活動に「市民の選手（Citizen Player）」賞（Seneweb 2026-05-12。**確度は報道**）。
# **日本との接点（台本の「日本」節）**：
#   - 2010-06-04 スイスのシオン（スタッド・トゥールビヨン）親善試合 日本0対2コートジボワール（Japan national football team results）。この試合で闘莉王との接触で右腕の尺骨を骨折、翌日に手術。2010-06-15 W杯初戦ポルトガル戦（0対0）に保護具を着けて65分から出場（Wikipedia International career）。6/20 ブラジル戦で78分に頭で得点（W杯でブラジルから点を取ったアフリカの国の初の選手）。
#   - 2014-06-14（現地22時、日本時間6/15 10時）ブラジルのレシフェ、W杯1次リーグC組 コートジボワール2対1日本。本田圭佑16分、ドログバ62分に途中出場、ボニー64分、ジェルビーニョ66分（2014 FIFA World Cup Group C のメンバー表）。入って2分後・4分後の2点＝自分で引いた値。
# **数字の出どころと自分で足した値**
# - チェルシー 381試合164点（BBC 2018-11-21 本文＋Wikipedia の成績表。**季ごとの行を自分で足して 341/157＋40/7＝381/164 と一致を確認**）。
# - マルセイユ 55試合32点（2003-04 の1季、Wikipedia の成績表）。ほかのクラブ（ル・マン72/15・ギャンガン50/24・上海11/8・ガラタサライ53/20・モントリオール41/23・フェニックス26/17）＝253/107（自分で足した値）。クラブ合計 689/303（表の Career total と一致）。
# - コートジボワール代表 105試合65点（BBC・Wikipedia。年別の表を自分で足して一致）。国の歴代でいちばん多い得点。W杯は 2006・2010・2014 の3大会。
# - サムネの表：チェルシー 381/164、マルセイユ 55/32、ほかのクラブ 253/107、コートジボワール代表 105/65、合計 794/368（自分で足した値）。**Wikipedia の成績表には citation needed の印あり**（チェルシーと代表は BBC と一致）。
# - タイトル（BBC）：プレミアリーグ4・FAカップ4・リーグカップ3・CL1。得点王2回（2006-07 に20点、2009-10 に29点）。アフリカ年間最優秀選手2回（2006・2009）。2012-03-10 にアフリカ出身で初めてプレミアで100点（Wikipedia）。
# - 決勝（チェルシー、コミュニティ・シールドを除く）：2005リーグ杯1点・2007リーグ杯2点・2007FA杯1点・2008リーグ杯1点・2008CL 0点・2009FA杯1点・2010FA杯1点・2012FA杯1点・2012CL1点＝**9試合9点**（各決勝の記事の得点者を自分で数えた。Wikipedia の「nine goals in nine cup final appearances for Chelsea」と一致）。FAカップ決勝4回すべてで得点した初めての選手（Wikipedia、BBC を出典）。
# - 2012年CL決勝：2012-05-19 ミュンヘン、アリアンツ・アレーナ（バイエルンの本拠地）。ミュラー83分、ドログバ88分（チェルシーのこの試合最初のコーナーキック、マタのキックを頭で）。延長でドログバがリベリーを倒してPK→ロッベンをチェフが止める。PK戦4対3（マタ失敗、オリッチ・シュバインシュタイガー失敗、5人目ドログバ成功）。UEFA の数字：シュート43対9、コーナーキック20対1。試合の最優秀選手（UEFA）。チェルシー初の欧州王者。2008年決勝では延長117分に退場し、PK戦の5人目を蹴れなかった（2012年の記事の本文）。
# - 見立て（自分で足した・割った値。成績表の季ごとの行から）：チェルシー全体 381試合164点＝約2.3試合に1点／いちばん点を取った 2009-10 は44試合37点＝約1.2試合に1点／決勝 9試合9点＝1試合に1点。決勝のペースは全体の約2.3倍。
# - 本人の言葉（BBC 2018-11-21、Football Focus の聞き取り）：「If it was a movie, I don't know if you could have written the scenario better.」／右サイドバックの話（11歳でダンケルクのチームに入り右サイドバック、叔父「why are you playing as a right-back? As a family we only have strikers」、次の町でストライカーと名乗って1季40点）／「Before joining Le Mans in 1998 I was writing letters to first division teams for a trial and I would never get a positive answer」。1部のデビューは23歳（BBC「did not play top-flight football until the age of 23」）。
# - マルセイユのユニフォームは、街のノートルダム・ド・ラ・ギャルド大聖堂に額に入れて飾られている（2004年UEFAカップ決勝の前に本人が贈った。Wikipedia）。
# **入れなかったもの**：私生活・家族、2005年の停戦の呼びかけ、2008年の退場の中身・2009年の主審への抗議と処分、移籍金の調査（Stevens 報告）、マラリア、上海との契約の争い、連盟会長選、W杯2026の発言（1つの記事だけ）、資産の話。
# **読みで怪しいもの**：上海申花（「シャンハイサルハナ」→「上海シェンファ」と書く）、右腕（「ウワン」→「右の腕」と書く）、最多（「いちばん多い」と書く）、ノイアー・チェフ（割れる。チェフは「キーパーのチェフ」で見る）。
