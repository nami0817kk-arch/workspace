    viewpoint: true
    heading: サンチョの5年を数える
    tier: 報道
    telop: 貸し出し3回。直近2季で80試合
    say:
      - 2021年、7300万ポンドで加入したサンチョ。
      - それから5年で、貸し出されたのは3回です。
      - ドルトムント、チェルシー、そして昨季のアストン・ヴィラ。
      - 直近の2季は、チェルシーで41試合、ヴィラで39試合。合わせて80試合です。
      - ヴィラでは、ヨーロッパリーグを制しました。欧州の決勝は、これで3季連続です。
      - 貸し出し先でも出場を重ね、決勝に立ち続けた5年。
      - 複数のクラブから話がある背景には、この実績があると見られます。
    official: false
