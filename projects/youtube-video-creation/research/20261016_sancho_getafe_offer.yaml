sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 報道
    telop: ヘタフェがサンチョに正式オファー
    say:
      - 無所属のジェイドン・サンチョに、ヘタフェが正式なオファーを出しました。
      - ヘタフェはスペインのクラブで、ラ・リーガ14位です。
      - 26歳のサンチョは、今夏ユナイテッドとの契約が切れ、次の所を探しています。
      - 合意は簡単ではないと伝えられています。
      - サンチョは、イングランドの外への移籍を望んでいると伝えられています。
      - ヘタフェのトーレス会長は、ラジオでこの件を認め、こう語りました。
      - voice: トーレス会長
        text: それは全くの事実だ。4か月、この件を追っている
      - voice: トーレス会長
        text: フリーの選手になった。最後のオファーを渡した
        cont: true
      - voice: トーレス会長
        text: カタールなど、いくつかの所からオファーがある
        cont: true
      - voice: トーレス会長
        text: 辛抱が必要だ。しつこく迫らず、彼に決めさせる
        cont: true
    official: false
