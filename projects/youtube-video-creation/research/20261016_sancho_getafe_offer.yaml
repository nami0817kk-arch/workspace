    telop: 13日にカルバハルを獲得
    say:
      - サンチョへのオファーの前にも、ヘタフェは大きな補強を発表していました。
      - 13日、レアル・マドリードを退団したカルバハルの獲得です。
      - 34歳のスペイン代表DFで、契約は2027年6月までです。
    official: false
