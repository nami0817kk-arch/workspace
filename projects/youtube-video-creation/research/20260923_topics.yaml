    slot: 日本人
    head: 鎌田大地、初の代表タイトルへ「アジア杯までは最低限やりたいと思っていた」
    why: 前回大会は不在（屈辱の敗退）。別セッションの板倉の回はアジア杯を**辞退する側**、こちらは**燃える側**で対になる
    src: ゲキサカ（1.4時間前）
    url: https://web.gekisaka.jp/news/japan/detail/?459499-459499-fl
