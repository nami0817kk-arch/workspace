    why: ロマーノ「合意済み、正式手続きへ。スタッフ全員も新契約」。**22年ぶりの優勝の直後**で、昇給と移籍の統括も含む。プレミア紹介のアーセナル回とも噛み合う
    src: ロマーノ（54分前・6時間前）・スカイスポーツ（4.7時間前）
