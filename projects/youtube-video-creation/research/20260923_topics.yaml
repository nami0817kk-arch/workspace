    slot: 日本人
    head: 鈴木彩艶は別メニュー。日本代表のGKは早川友基と小久保玲央ブライアンが全体練習
    why: ウルグアイ戦の前日にGKが別メニュー。**状態の説明がまだ無い**ので、明日の試合前に出すなら「出るのか」の1本になる。弱い
