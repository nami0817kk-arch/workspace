title: 9月23日の題材
lead: 候補471件（フィード）＋ロマーノの投稿24件から15件
note: |
  昨日（9/22）は対象リーグの試合なし。<b>別セッションが作っている8本</b>（堂安のサウジ辞退・フェランとペドリ・ルイス・ホール・板倉のアジア杯・マック・アリスター・久保の背番号・バルベルデ欠場・ヴィルツ）は外してあります。
  プレミア20クラブ紹介は保留。○△✖はこのページで付けてください（番号だけ振っています）。
items:
  - num: 1
    slot: 日本人
    head: 谷村海那、JFLのいわきから日本代表へ「言葉だけではなく行動にできた」
    why: 初招集4人のなかでいちばん物語がある。JFL出身のストライカーが代表に呼ばれた。**本人の言葉が2つ**（「言葉だけではなく行動にできた」「アジアカップにも呼ばれるようなプレーがしたい」）。顔写真は Commons に無い見込みで、報道写真を使う
    src: サッカーキング（0.2時間前）・ゲキサカ（0.3時間前）
    url: https://www.soccer-king.jp/news/japan/national/20260923/2207971.html
    fmt: quote
  - num: 2
    slot: 日本人
    head: 松木玖生、初招集で「そこが今の自分の主戦場」右サイドで生きる
    why: 青森山田で高校3冠、いま右サイド。**「いいイメージでできる」**と本人。別セッションの背番号の回では19番として名前だけなので重ならない
    src: サッカーキング（0.7時間前）・ゲキサカ（0.3時間前）
    url: https://www.soccer-king.jp/news/japan/national/20260923/2207963.html
    fmt: quote
  - num: 3
    slot: 日本人
    head: 齋藤俊輔、初招集に「一番はびっくりした」ベルギーで続けてきた21歳
    why: 今季ブレイクのドリブラー。**「今ここにいる結果になっている」**。1と2と同じ「初招集」の並びなので、3本とも採ると同じ型が続く
    src: フットボールチャンネル（9/22）・ゲキサカ（0.3時間前）
    url: https://www.footballchannel.jp/2026/09/22/post1016655/
    fmt: quote
    weak: true
