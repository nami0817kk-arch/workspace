# クラブの財政：SSCナポリ（10/26 月、シリーズ「クラブの財政」、key: finance_napoli、型は news）。
#
# 軸は「**イタリアで優勝した2024-25に、デロイトの収入ランキングの30位までから名前が消えた（前の年は22位）。王者の稼ぎに何が起きたのか**」。
#   答え：欧州の大会に1つも出なかった（前の季のリーグ10位）ので、放映権が1億4220万→7810万（−6410万、約45%）。前の年の放映権のうち7020万は欧州の大会から。
#   同じ年に、選手の償却（7090万→1億1150万）と人件費（1億1640万→1億4210万）が増え、足すと+6630万。収入の穴とほぼ同じ大きさの費用の増え。
#   選手の売買の益1億250万（収入の約35%）で、赤字は2140万で止まった。益を除いた収入と費用の差は約1億2720万の赤字（自分で引いた数）。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差／インテル＝10位との差／ヴィラ＝放映権の割合が最高／ユヴェントス＝放映権の特需と商業の穴／
#     アトレティコ＝増えた収入の約85%が商業／ミラン＝欧州なしの年の赤字／ニューカッスル＝買収後はじめての黒字／ドルトムント＝半期の黒字が通年で赤字）は繰り返さない。
#     ミラン回と「欧州なしの赤字」が近いので、こちらは**ランキングから消えたこと**と**収入の穴と費用の増えが同じ大きさ**（償却の分け方を含む）を軸にする。
#   ★日本との接点：財政の数字には無い。無理に入れない（10/6 の決定）。
#   ★選手個人の名前・移籍金の額・給料・獲得の総額は出さない（1月の大きな売却の選手名も言わない）。監督の話・報酬もしない。女子の話はしない。「経営が危ない」と断定しない。
#   ★アルファベット（UEFA）は読み上げに出さない（「欧州の大会」と言う）。
#
# **決算期**：6月30日決算。2024-25＝2024年7月1日〜2025年6月30日。**2025-26（2026年6月30日）の決算は 10/26 時点でまだ報じられていない**（前の年の決算は 2025-11-20 に報じられた）。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026（2024/25、deloitte.com UK、2026-10-26 に requests で本文を取得）
#       上位20と「Ranking 21-30」の表：「21 Galatasaray 273.6 … 27 AS Roma 216.3 … 29 Wolverhampton Wanderers 206.3 30 Brentford 206.0」。**ナポリは上位30のどこにも無い**（本文にも Napoli の語が無い）。
#       「Revenue excludes player/coach transfer fees, VAT and other sales related taxes.」（作り方の注記）
#   ○ デロイト Football Money League 2025（2023/24）：ナポリ 22位 €253.6m（21位ブライトン 256.8、23位ローマ 249.0、前の年19位）。
#       deloitte.com の 2025 年版ページは今は 404。**英語版 Wikipedia の「Deloitte Football Money League」2023–24 の表（Deloitte を出典にした写し）と、検索結果が引いた Deloitte UK の表の文で確認**（同じ値）。
#   ○ ナポリの決算 2024-25（クラブは上場しておらず、決算を自分のサイトで出していない。**イタリアの経済紙 Calcio e Finanza がクラブの決算の書類を読んだ記事**。確度は報道）
#       2025-11-20 https://www.calcioefinanza.it/2025/11/20/napoli-bilancio-2025-rosso-perdita/ 「perdita di 21,4 milioni」「riserva volontaria, che ammonta a 216,6 milioni」
#         「formazione partenopea ha chiuso al decimo posto in Serie A, rimanendo esclusa da tutte le competizioni europee」「oltre 43 milioni di euro già maturati in questa stagione」（2025-26 の欧州の大会の分。11月時点）
#       2025-12-02 https://www.calcioefinanza.it/2025/12/02/napoli-bilancio-2025-fatturato-costi-debiti/
#         収入（百万ユーロ、2024-25／2023-24）：試合日 24.1/27.4、スポンサー・商業 68.1/70.2、放映権 78.1/142.2（2023-24 はリーグ 66.5・欧州の大会 70.2）、
#           選手の権利の管理 110.3/72.9（うち売買の益 102.5/70.7）、その他 10.2/15.5、合計 290.8/328.2
#         費用：サービス 36.0/30.2、人件費 142.1/116.4、償却と評価減 118.2/75.4（うち選手 111.5/70.9）、その他 19.3/22.4、合計 315.6/244.4
#         収入と費用の差 −24.7（前の年 +83.7）、税引前 −20.6（+91.2）、最終 −21.4（+63.0）。純資産 190.2（211.6）。手元の資金 174.4（210.5）。
#         「scelta del club partenopeo di utilizzare gli ammortamenti a quota decrescente, che quindi porta ad avere i costi maggiori nei primi anni di contratto」（償却は最初の年ほど多い分け方）
#         「voce impattata non solo dalle grandi spese del mercato estivo 2024」
#       ★同じ記事の中で 2023-24 の売買の益が 70.8 と 70.7 の2通り → **前の年の売買の益は台本で言わない**（選手の権利の管理の合計 72.9 だけ増減の板に使う）。
#       ★裏づけ：同じ社の 2026-04-16 の分析記事（銀行家の分析）が「ricavi ricorrenti per circa 180 milioni」（2025年）→ 自分で足した 180.5 と合う。napolinetwork.com の記事は同じ数字を写したもの。
#   ○ 英語版 Wikipedia「2024–25 SSC Napoli season」：「Napoli secured a fourth Serie A title and a second in three seasons」「did not play in any European competition for the first time since the 2009–10 season」
#   ○ 英語版 Wikipedia「2026–27 SSC Napoli season」：セリエA・コッパ・イタリア・チャンピオンズリーグに出場中（**今季も1部＝扱うリーグ**。10/25 の試合後で9位）。
#   × 確かめられなかったもの：2025-26 の決算（未発表）、デロイトの 2024-25 のナポリの収入の額（一覧に無い）、借入の中身（台本で言わない）、2023-24 の売買の益（記事の中で2通り）。
#
# 自分で計算した数（検算済み）
#   収入の合計：24.1+68.1+78.1+110.3+10.2＝290.8 ✓／27.4+70.2+142.2+72.9+15.5＝328.2 ✓
#   選手の売買（権利の管理）を除いた収入：290.8−110.3＝180.5／328.2−72.9＝255.3 → 減り 74.8（29.3%→約3割）。デロイトの 2023-24 の 253.6 と近い（線の引き方が少し違う）
#   30位ブレントフォード 206.0 − 180.5＝25.5 → 約2550万届かない
#   増減の板（収入。試合日−3.3・商業−2.1・その他−5.3は1段−10.7にまとめた）：328.2 −64.1（放映権） +37.4（選手の売買 110.3−72.9） −3.3（試合日） −2.1（スポンサー・商業） −5.3（その他）＝290.8 ✓
#   放映権：142.2−78.1＝64.1、64.1÷142.2＝45.1%→約45%
#   増減の板（費用。ほかの償却+2.2・サービス+5.8・その他−3.1は1段+4.9にまとめた）：244.4 +25.7（人件費） +40.6（選手の償却） +2.2（ほかの償却 6.7−4.5） +5.8（サービス） −3.1（その他）＝315.6 ✓。費用の増え 71.2
#   人件費＋選手の償却の増え：25.7+40.6＝66.3（放映権の減り 64.1 とほぼ同じ）
#   売買の益の割合：102.5÷290.8＝35.2%→約35%
#   売買の益を除いた収入と費用の差：−24.7−102.5＝−127.2
#   人件費÷売買を除いた収入：142.1÷180.5＝78.7%／116.4÷255.3＝45.6%
#
# 写真：assets/images/20261026_finance_napoli/（Commons、出典は credits.json）。05（駐車場が主の外観）は落とした。
