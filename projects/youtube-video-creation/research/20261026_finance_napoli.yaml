- id: view
  viewpoint: true
  heading: 見立て・優勝の年の赤字は、放映権の穴と、同じ大きさの費用の増え
  tier: 背景
  telop: 放映権の減り6410万ユーロ。人件費と選手の償却の増え6630万ユーロ
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（2023-24から2024-25）
    columns: [比べ, 答え]
    rows:
    - [放映権の減り, 6410万ユーロ]
    - [人件費と選手の償却の増え, 6630万ユーロ]
    - [選手の売買を除いた収入, 2億5530万から1億8050万]
    - [人件費の、その収入に対する割合, 45.6%から78.7%]
    highlight_row: 0
  say:
  - text: ここからは見立てです。ナポリの決算の数字を、こちらで並べ直しました。
    image: assets/images/20261026_finance_napoli/06_w.jpg
    card: none
  - text: 放映権の減りは、6410万ユーロ。
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 人件費と選手の償却の増えを足すと、6630万ユーロです。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 1
    card:
      <<: *view_table
      highlight_row: 1
  - text: 収入の穴と、ほぼ同じ大きさの費用の増えが、同じ年に重なりました。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 選手の売買を除いた収入は、2億5530万から、1億8050万ユーロへ。
    image: assets/images/20261026_finance_napoli/02_w.jpg
    card:
      <<: *view_table
      highlight_row: 2
  - text: 約3割の減りです。
    card:
      <<: *view_table
      highlight_row: 2
  - text: デロイトの30位のクラブには、約2550万ユーロ届きません。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 人件費をこの収入で割ると、45.6%から、78.7%に上がります。
    emph: true
    card:
      <<: *view_table
      highlight_row: 3
  - text: 題への答えです。
    image: assets/images/20261026_finance_napoli/01_w.jpg
    card: none
  - text: 優勝の年に、ランキングから名前が消えたのは、欧州の大会の分が無かったからです。
    emph: true
    card: none
  - text: 同じ年に費用も増え、選手を売った益でも、赤字は埋まりきりませんでした。
    card: none
  - text: 2025-26は、ナポリがチャンピオンズリーグに復帰した季です。
    image: assets/images/20261026_finance_napoli/02_w.jpg
    card: none
  - text: 去年の11月の時点で、欧州の大会の収入は、4300万ユーロを超えていました。
    card: none
  - text: その2025-26の決算は、まだ出ていません。
    image: assets/images/20261026_finance_napoli/03_w.jpg
    card: none
  - text: 前の年の決算の数字が出たのは、11月でした。
    card: none
  sources:
  - https://www.calcioefinanza.it/2025/12/02/napoli-bilancio-2025-fatturato-costi-debiti/
  - https://www.calcioefinanza.it/2025/11/20/napoli-bilancio-2025-rosso-perdita/
  - https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
