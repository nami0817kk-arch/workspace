# 朝の一報 の取材メモ（2026年8月30日）
# 1本＝1テーマ。見出しに書いてあることだけを使う
slot: morning
date: "2026年8月30日"

theme:
  id: alvarez
  prefix: 速報
  title: アトレティコが公式声明「バルサとは交渉しない」
  hook: 移籍期限まであと2日。ヨーロッパで最大の焦点になっている移籍に、期限が切られました。
  question: 金額で折り合えるのに、なぜアトレティコは売らないのか

thumbnail:
  line1: アトレティコが公式声明
  line2: 「バルセロナとは交渉しない」
  tags: [移籍期限まで2日, アーセナル]

answer: 問題は金額ではなく「誰に売るか」。ライバルに主力を渡すこと自体を拒んでいる
watch: 本人がアーセナル行きを受け入れるかどうか。期限は日本時間9月2日の朝7時

sections:
  - id: what
    heading: クラブが公式に表明した
    tier: 確定
    official: true
    telop: アトレティコ「バルセロナとの交渉は行わない」
    say:
      - アトレティコ・マドリードが、フリアン・アルバレス選手の去就について、クラブとして公式に声明を出しました。
      - 声明では、バルセロナが交渉の要件を満たしていないと判断したため、アルバレス選手の移籍についてバルセロナとの交渉は今後も行わない、としています。この方針は取締役会で全会一致で支持されました。
    sources:
      - https://en.atleticodemadrid.com/noticias/unanimous-support-from-the-board-of-directors-for-the-club-s-strategy
      - https://www.footballchannel.jp/2026/08/27/post999381/
    card:
      type: quote
      color: "#e2495a"
      text: "Unanimous support from the Board of Directors for the club's strategy"
      translation: 取締役会は、クラブの方針を全会一致で支持した

  - id: why
    heading: なぜ売らないのか
    tier: 報道
    telop: 金額ではなく「誰に売るか」が問題
    say:
      - ここが今回の核心です。本人が望んでいるのはバルセロナ。ところがアトレティコは、バルセロナとは交渉のテーブルにすら着かないという姿勢を崩していません。
      - アトレティコの最高経営責任者は「私がCEOである限り、バルセロナへの移籍は絶対にない」と語ったと報じられています。
      - 一方で、アーセナル相手なら話は動くと報じられています。金額はいちおくごせんまんユーロ規模。同じ選手、同じ規模の金額でも、相手がバルセロナかどうかで扱いが変わる。つまり、これは金の問題ではないということです。
    sources:
      - https://www.espn.com/soccer/story/_/id/49741017/atletico-madrid-julian-alvarez-transfer-barcelona
      - https://www.skysports.com/football/news/11670/13577751/julian-alvarez-transfer-news-atletico-madrid-wont-sell-striker-to-barcelona-with-arsenal-the-only-option
      - https://www.soccer-king.jp/news/world/esp/20260828/2197638.html
    card:
      type: points
      title: 争点の整理
      color: "#e2495a"
      items:
        - 金額では合意できる可能性がある
        - バルセロナへの売却だけは拒否
        - アーセナルなら交渉に応じる姿勢

  - id: numbers
    heading: 残された時間
    tier: 確定
    telop: "英国の移籍期限: 9/1 23:00 BST（日本時間 9/2 7:00）"
    official: true
    say:
      - 時間の話をします。イングランドの移籍期限は、現地じかんくがつついたちの、よるじゅういちじ。日本時間では、くがつふつかの朝しちじです。
      - 書類を出し終えていれば、そのあと2時間の猶予があります。それでも、残された時間はごくわずかです。
    sources:
      - https://www.premierleague.com/en/news/4664145/when-does-summer-2026-premier-league-transfer-window-open-and-close
      - https://www.premierleague.com/en/news/4698998/copy-transfer-deadline-day-everything-you-need-to-know
      - https://www.espn.com/soccer/story/_/id/48944912/premier-league-efl-summer-transfer-window-2026-dates-does-open-deadline-day

  - id: next
    heading: これからどうなる
    tier: 未確認
    telop: 決めるのはクラブではなく本人
    say:
      - ここからは未確認の情報です。本拠地では、サポーターが自軍のストライカーにブーイングを浴びせる場面まで報じられました。
      - クラブは本人に、きょう日曜を期限として決断を求めたと報じられています。受け入れれば移籍は動き、受け入れなければこのまま残る。決めるのはクラブではなく本人だ、というのが各紙の見方です。
    sources:
      - https://www.skysports.com/football/news/11095/13576511/julian-alvarez-does-atletico-madrid-fans-booing-their-own-striker-increase-his-chances-of-an-arsenal-or-barcelona-move
      - https://www.footballchannel.jp/2026/08/29/post1000500/
