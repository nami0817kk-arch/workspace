      - https://www.soccer-king.jp/news/world/cl/20260909/2202801.html

  - id: voices
    heading: 試合の前に何を言っていたか
    tier: 報道
    telop: 「準備は万端だし、戦う態勢は整っている」
    narrator: 解説
    say:
      - 敵地ナポリについて、アルテタ監督は前日にこう話していました。UEFAがコメントを伝えています。
      - {voice: アルテタ監督, text: 昨シーズンの経験があるからこそ}
      - {voice: アルテタ監督, text: この大会が我々にとってどれほど重要なものかは分かっている}
      - {voice: アルテタ監督, text: 初戦から非常に厳しいアウェイの地での戦いとなる}
      - {voice: アルテタ監督, text: あの独特な雰囲気や、ホームでの彼らの強さを知っている}
      - {voice: アルテタ監督, text: 待ち受ける挑戦の厳しさは理解している}
      - {voice: アルテタ監督, text: だが準備は万端だし、戦う態勢は整っている}
      - ディフェンダーのカラフィオーリも、同じ日にこう言っています。
      - {voice: カラフィオーリ, text: 過去2シーズンは準決勝まで進み、昨季は決勝まで辿り着いた}
      - {voice: カラフィオーリ, text: この流れを継続していくことが僕たちにとって重要なんだ}
      - {voice: カラフィオーリ, text: 今のチームには大きな自信があるよ}
    official: false
    sources:
