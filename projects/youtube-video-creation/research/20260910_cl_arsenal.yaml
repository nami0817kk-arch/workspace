sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ナポリ 0対1 アーセナル
    narrator: キャスター
    say:
      - チャンピオンズリーグのリーグフェーズ第1節、アーセナルが敵地でナポリを1対0で下しました。
      - アルテタ監督は、ガブリエウ・マガリャンイス、ライス、ウーデゴール、サカらを先発に並べます。
      - 今季初先発となるギェケレシュも入りました。
      - ナポリはデ・ブライネとホイルンドがスタメンです。
      - 前半は両チームとも決め手を欠き、スコアレスで折り返しました。
      - 均衡が破れたのは75分。右サイドで細かくつなぎ、ツォリスの落としをボックス手前のウーデゴールが受けます。
      - 振り抜いたシュートは左のポストを叩いてゴールへ吸い込まれました。
      - これが決勝点。昨シーズンの決勝進出チームが、難しい敵地で白星スタートを切りました。
    official: false
    sources:
      - https://www.soccer-king.jp/news/world/cl/20260910/2203118.html
      - https://www.footballchannel.jp/2026/09/10/post1007922/

  - id: numbers
    heading: 主将の数字がおかしい
    tier: 報道
    telop: 開幕から公式戦5試合で4得点
    narrator: 解説
    card:
      type: bars
      title: ウーデゴール 今季ここまで
      items:
        - {label: "公式戦の出場", value: 5}
