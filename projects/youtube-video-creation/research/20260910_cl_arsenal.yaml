      unit: 試合・点
    say:
      - ここからが本題です。このゴールは、ウーデゴールの今季4点目でした。
      - 開幕から公式戦5試合での4得点です。
      - ウーデゴールは主将で、本職はトップ下。点を取るのが仕事の選手ではありません。
      - 昨シーズンのアーセナルは、リーグフェーズを8戦全勝で駆け抜けました。
      - 決勝ではパリ・サンジェルマンにPK戦で敗れ、クラブ史上初のビッグイヤーには届いていません。
      - 今季はアルテタ体制でベスト8、ベスト4、決勝進出と、順番に階段を上がってきた続きになります。
    official: false
    sources:
