# 取材メモ（2026年10月30日）フランス協会がベンゲルをFIFA会長選の対抗馬に推す（ショートだけ・見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-30。題材の元は 20261030_topics_src.yaml の 20、記事は candidates[180]（vi.nl「Frankrijk steunt Wenger als uitdager van Infantino」、29日16:39。requests で本文を全部読んだ）。
#   vi.nl の本文で確かめたこと:
#     ・フランス協会（FFF）のフィリップ・ディアロ会長が木曜（29日）、「同国人のベンゲルが、インファンティーノに挑む理想の候補だと協会は考える」と明かした。
#     ・選挙は2027年3月。ヨーロッパの加盟協会はインファンティーノに厳しい。「本気の対抗馬はまだ居ない」。
#     ・ディアロ会長の言葉（オランダ語に訳された形で読んだ。原文はウエスト・フランス紙とされる。直接の原文は開けず）:
#         「時間は刻々と過ぎている」「UEFAは複数の候補に声をかけ、人物像を作ったと思う。11月18日までに候補が出ると見込む」（11月18日は立候補の締め切り）
#         「彼の資質は疑いようがない。国際的な知名度もあり、多くの条件に合う」「ただ、こうしたことは個人の判断が大きい。（要求の大きい役目に）身を投じたいのか。最後は本人が決めること」
#     ・ベンゲル本人の発言・立候補の表明は、本文に無い。ディアロ会長の「本人が決めること」が本文のいちばん近い箇所。→ 台本は「推した」までにとどめ、「本人は表明していない」と言う。
#     ・勝ち目: 最近アジア連盟が考えを変え、インファンティーノは過半数に向かっているように見える。いま挑んでいるのは同国人（スイス人）のラモン・ベガ（元トッテナムのDF）だけで、本気の脅威には見えない（本文）。
#   確かめた裏づけ（本人の不表明）:
#     ・Gulf News（BBC Sport の10/15の報を引く。requests で本文を読んだ）: ベンゲルは立候補の意思を示していない。2019年からFIFAの「グローバル・フットボール・ディベロップメント」責任者。ベガが名乗りを上げている唯一の人。
#     ・Voetbalkrant（10/17、L'Équipe を引くとある。本文を読んだ）: 選挙は2027年3月18日（ラバト）、候補の届け出は11月18日まで。ディアロ会長はベンゲルの国際的な存在感を認め、対抗馬探しに協力したい、とも。
#     ・Arseblog（8月4日）: ベンゲル自身の声明は「FIFAの商業の子会社の計画に関わっておらず、中止は絶対に必要だった」。→ 今回は使わない（話が広がる）。
#   FFFの一次: フランス協会は9月10日にインファンティーノの再選支持を取り下げた（Irish Times。ディアロ会長が「フットボールのイメージと団結を深く傷つけた」と）。→ 台本には入れない（時間が足りず、今回の題から離れる）。
#   L'Équipe の本文・ウエスト・フランスの原文・FFFの発表は、検索と直接の取得で見つからず（WebSearch で一次の記事は出ず、Ouest-France は未取得）。→ ディアロ会長の言葉は vi.nl（オランダ語）経由の「報道」。
# 言わないこと: ベンゲルが立候補する／しない（本人は未表明）、勝ち目の予想、UEFA が誰に声をかけたか（vi.nl に名前なし）、「FIFAのトップを批判した」などの本人の言葉（無い）、
#   名古屋の話（10/28 の監督紹介で扱った）、任期の三期上限をめぐる争い（時間が足りない）、W杯の持ち分を売る計画の細部（今回の題から離れる）。
# 本人の言葉: 無い（ベンゲル本人の言葉は取れていない）。ディアロ会長の言葉は取れたが、会長は題の「本人・監督」ではない → 型は X。
# 確度: 協会が推したこと・ディアロ会長の言葉は報道（vi.nl 1社。Voetbalkrant の10/17の報と一致）。本人の不表明は報道（Gulf News/BBC、Voetbalkrant）。選挙日・締め切りは報道2社の一致。
#   「19日」は自分で数えた（10月30日→11月18日）。
# 反応: 作らない（0件）。
# 写真: Commons から本人と確認できる写真を取った（10/28 の監督紹介の7枚とは別のファイル）。
