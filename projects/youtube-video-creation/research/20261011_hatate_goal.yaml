# 取材メモ（10/11 題材 hatate_goal、型は news、japan_2 の枠）。
# **ショートだけ作る**（本編は作らない。台本は1本で、`short` が山場の節を切り出す）。
# **リーグ名に注意。**これは**イングランド2部＝チャンピオンシップ**で、プレミアリーグではない。
#   `theme.league` は空にして（`england` と書くとプレミアのタグが付く）、
#   **`theme.league_name` に「イングランド2部」**と書いてある。9/15 に松木の回で踏んだところ。
#   読み上げでも「イングランド2部」「チャンピオンシップ」としか言っていない。
# **確かめた数字**:
#   ・得点の時間と関与は、サッカーキング・フットボールチャンネルと
#     ESPN の試合データ（Opta）の3つが一致している。
#     13分 ブルン・ラーセン（旗手のラストパス）／19分 アムドゥニ／25分 旗手／87分 エドワーズ（ピレスのクロス）。
#   ・**旗手の2点への関与は13分と25分で、あいだは12分**。記事の「わずか12分間で2得点に関与」と合う。
#   ・バーンリーは第9節を終えて 1勝4分4敗、13得点17失点、勝ち点7、22位（ESPN の順位表）。
#     記事の「勝ち点7、最下位から22位」と一致する。
#   ・**今季の得点13のうち4点がこの1試合**＝30.8%。試合数では1／9＝11.1%。
#     これは ESPN の順位表の得点合計から自分で割った。記事には無い比べ。
# **本人・監督の言葉は取れなかった。**当たったのはサッカーキング／フットボールチャンネル／
#   バーンリー公式のニュース一覧（burnleyfootballclub.com/news/、中身がJSで出てこない）／ESPN。
#   試合後のコメントは見つからなかったので `voice_min: 0` で語りだけにしてある。
# **ネットの反応は集めていない**（ユーザー指示で、この3本は反応なしでよい）。
# 写真：サッカーキングもフットボールチャンネルも **写真は Getty**（本文に明記）なので使わない。
#   代わりに **Commons の CC BY-SA 4.0**（Hameltion、2024年）を2枚取った。
#   01.jpg＝File:Celtic-20240722-037 (cropped).jpg（1193x1814、顔の寄り）、
#   02.jpg＝File:Celtic-20240722-037.jpg（1920x1280、上半身が入る横長）。
#   セルティック時代の姿で、バーンリーのユニフォームではない（「他に無ければそのまま使ってよい」）。
#   `facecrop.py` で 02_w（1920x1080）・02_v（720x1280）・01_v（1020x1814）を作り、**開いて目で見た**。
#   ショートに敷くのは高さ1814pxの 01_v と 1280px の 02_v で、どちらも下限1200pxを超えている。
#   File:Reo Hatate 2.jpg（背中からで顔が無い）と File:日本足球運動員旗手怜央.jpg（2017年）は見て外した。
#   File:Celtic-20240722-020.jpg は旗手が左奥の小さな人影だったので外した。
# 数字の重なり対策：『第9節』『1ゴール1アシスト』は①だけ。『13分』『19分』『25分』『87分』『12分』『4対0』は②だけ。
#   『8試合』『4分4敗』『勝ち点7』『13点』『31パーセント』『11パーセント』『5試合』は③だけ。
# サムネ：**点検を通すために1案だけ書いてある。決めるのはユーザー**（報告に3案を出す）。
