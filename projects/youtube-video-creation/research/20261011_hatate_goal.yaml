  title: 旗手怜央が移籍後初ゴール。バーンリーの9試合目を変えたのは何分間か
  question: 旗手怜央の12分間は、勝ちの無かったバーンリーに何をもたらしたのか
  takeaway: イングランド2部チャンピオンシップ第9節、バーンリーが敵地でワトフォードに4対0で勝ち、旗手怜央が1ゴール1アシストを記録した。13分にこぼれ球を拾ってラストパスを出し、ブルン・ラーセンが先制。19分にアムドゥニが2点目を入れ、25分にはピレスの折り返しをペナルティエリアの左で受け、ワントラップから右足でファーサイドのサイドネットへ流し込んだ。これが今夏セルティックから加入して以来の初ゴールで、2つの得点への関与は13分と25分、あいだはわずか12分だった。バーンリーはここまで8試合で4分4敗と勝ちが無く最下位にいたが、9試合目で今季初勝利。勝ち点は7になり、順位は22位に上がった。今季の得点を数えると9試合で13点で、そのうち4点がこの1試合に入っている。割合にすると31パーセントで、試合数の11パーセントに今季の得点の3割が集まったことになる。旗手の新天地での成績は公式戦5試合で1ゴール2アシストの、合わせて3つの得点関与になった
  opening_image: assets/images/20261011_hatate_goal/03_w.jpg
