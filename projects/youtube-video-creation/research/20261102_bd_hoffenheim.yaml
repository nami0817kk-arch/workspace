  - 2022年から、ベルギーのユニオンSGでプレーしました。
  - 2024年のベルギーカップ決勝では、唯一の得点を決めます。
  - クラブにとって、110年ぶりのカップ優勝でした。
  - text: 2025年6月25日、ホッフェンハイムへ。
    card: none
    image: assets/images/bd_hoffenheim_pair_machida/01.jpg
  - 8月23日の開幕戦でデビューしますが、前半のうちにケガで交代。
  - text: 復帰は2026年9月12日。シュツットガルト戦に、交代で入りました。
    image: assets/images/bd_hoffenheim_arena/scene.jpg
  - 10月15日、ヨーロッパリーグのベシクタシュ戦。
  - 87分、コーナーキックからのヘディングで、ホッフェンハイムでの初ゴール。
  - 25日のレバークーゼン戦は、先発でフル出場。チームは3対0の勝ちでした。
