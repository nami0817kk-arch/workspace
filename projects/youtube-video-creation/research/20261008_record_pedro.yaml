  say:
  - text: バルセロナは2009年と2015年に3冠を獲りました。
    card: *treble_table
    image: assets/images/20261008_record_pedro/02_barca2014.jpg
  - text: 2度の3冠は、クラブとして史上初めてのことです。
    card: *treble_table
  - text: その両方のチームにいたのは、わずか7人。
    card: *treble_table
  - text: ペドロ、メッシ、シャビ、イニエスタ、ピケ、ブスケツ。
    card: *treble_table
  - text: そしてダニ・アウベス。表には6人を並べます。
    card: *treble_table
  - text: メッシが778試合672得点、シャビが767試合85得点。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 0
  - text: ブスケツは722試合18得点、イニエスタは674試合57得点。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 2
  - text: ピケが616試合52得点。いちばん下の行がペドロです。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 5
  - text: 出場は、この6人のなかでいちばん少ない数字です。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 5
  - text: それでも得点は、メッシに次ぐ2番目。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 5
    emph: true
  - text: 3位のシャビの85点より、14点多いんです。
    card:
      type: table
      title: 2度の3冠を知る面々 バルサ通算
      columns: *tt_cols
      rows: *tt_rows
      highlight_row: 1
  - text: バルサでの得点を出場で割ると、1試合0.31点になります。
    card: &rate_calc
      type: calc
      title: バルサでの1試合あたりの得点
      terms:
      - - 99点
        - バルサでの得点
      - - 321試合
        - バルサでの出場
      - - 0.31点
        - 1試合あたり
      ops:
      - ÷
      - ＝
  - text: メッシの0.86点に次ぐ数字で、ほかの4人は0.12点に届きません。
    card: *rate_calc
    mark:
      kind: circle
      item: 2
  - text: そのペドロのために、バルセロナが場を用意しました。
    card: &farewell_table
      type: table
      title: お別れの催し
      columns:
      - いつ
      - どこ
      - 何
      rows:
      - - 10月9日 金曜
        - バルセロナ
