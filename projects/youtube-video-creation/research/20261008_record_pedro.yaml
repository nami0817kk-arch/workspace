  - text: ついに、その時が来たと感じている。
    voice: ペドロ
    card: none
  - text: 一歩を踏み出して、人生の新しい章を始める時だ。
    voice: ペドロ
    cont: true
    card: none
  - text: 夢を生きられたことを、誇りに思う。
    voice: ペドロ
    cont: true
    card: none
  - text: そして、それを叶えるためにそばにいてくれた人に。
    voice: ペドロ
    cont: true
    card: none
  - text: フットボール、こんなに幸せにしてくれてありがとう。
    voice: ペドロ
    cont: true
    card: none
