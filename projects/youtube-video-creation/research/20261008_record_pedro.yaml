# 取材メモ（10/8 シリーズ「記録」、key: record_pedro、型は news）。材料の控えは research/raw/20261008_record_pedro.md。
# 何の回か: 2026年10月7日、ペドロ（ペドロ・エリエセル・ロドリゲス・レデスマ、1987年7月28日生まれ）が39歳で現役引退を発表した。
#   バルサ321試合99得点・獲った大会の優勝25個・通算902試合215得点。柱に据えるのは「2009年に6大会すべてで得点した史上初」。
# 数字の出どころ: バルセロナ公式（99得点・6大会すべてで得点した史上初・2011年CL決勝の先制点・10月9日のお別れの催し）、
#   英語版ウィキペディアの季ごとの表（クラブ別・代表の出場と得点、honours の全件）、シャビの767試合85得点はバルサ公式。
#   **足し直しは全部自分でやった**（バルサ 204+38+61+18=321／58+20+15+6=99、通算 776+126=902／187+28=215、代表 65／17）。
#   1試合あたりの得点・18年268日・25個・約9か月に1つ も自分で割った値。検算は research/raw に残した。
# 報道との食い違い: サッカーキングは引退の言葉を前半だけ訳していた（原文の「そばにいてくれたすべての人に」「ありがとう」が落ちていた）ので、
#   スペイン語の原文から訳し直した。チェルシー以降の試合数・得点は日本語記事に無いので季ごとの表から自分で足した。
#   オランダの媒体の見出し「25 prijzen」は、自分で数えた25個と一致した（バルサ20・チェルシー3・代表2）。
# 言葉: ペドロ本人の引退の声明（スペイン語の原文を確認して訳した）。ほかの人の言葉は取っていない。
# 反応: この回は入れない（サッカーキングの記事の配信先にコメント欄が見つからなかった）。シリーズの回は反応が無くてよい。
# 重ならないようにしたもの: 10/7 のケインの回（記録・代表の最多出場）とは、題材も数字も別。
#   「歴代◯位」「1試合あたり」の言い回しが近いので、ケインの回で使った「1年あたりの試合」「◯年◯日早い」の形は使っていない。
# 写真: すべて Commons（代理店なし）。バルサ2014・チェルシー2015・2009年クラブW杯（シャビと一緒）・スペイン2013。
#   チェルシー2015（1920x1080）は表情がよく頭も入っているので、冒頭とサムネに使う。バルサ2014は縦なので表のある節だけ。
#   ショート用は 03_chelsea2015_w_v.jpg（同じ中身の縦）。
# サムネ: layout を number にした（見どころが1つの数字＝獲った銀器の数。答えは ●● で伏せる）。直前2本は classic。
