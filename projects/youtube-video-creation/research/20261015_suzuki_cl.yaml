# 日本人選手 の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。WebFetch で原文を読んだ（フットボールチャンネル2本・ゲキサカ（Yahoo!経由）・日刊スポーツ（Yahoo!経由）・
#   サッカーダイジェストWeb・ESPN の試合記録・FOOTBALL ZONE・ESPN の日程）。クラブ公式（avfc.co.uk）は JS 描画で本文が取れず、読めなかった。
# 日付・場所: 現地10月14日、ヴィラ・パーク、CLリーグフェーズ第2節。アストン・ヴィラ6-0フェネルバフチェ（ESPN・ゲキサカ・フットボールチャンネルで一致）。
# 得点: 12分マンザンビ／31分・39分ジャクソン／後半 バークリー（PK）・バークリー／終盤エイブラハム。
#   ESPN 90分・ゲキサカ後半45分で一致。ESPN のシュートマップだけ 8分・30分とずれる → 台本では前半12分・31分・39分のまま、後半は分を言わない。
# 資料間のずれ: 鈴木の3本目のセーブ。ゲキサカ「後半40分」・サッカーダイジェスト「85分」・ESPN「85分」・フットボールチャンネル（評価記事）「前半終盤」→ 台本では言わない。
#   15分のヘディング阻止の描写も割れる（ゲキサカ「膝で防ぐ」・日刊「ポスト際で体を寄せてブロック」・FC「セーブ」）→「防ぎました」とだけ。
#   17分の1対1は FC・ゲキサカ・日刊が一致。止め方は割れる（ゲキサカ「股下を閉じた」・日刊「スライディング」・FC「シュートブロック」）→「止めました」とだけ。
#   セーブ数もずれる（ESPN 枠内4本・ヤフー系の採点記事 6本）→ 使わない。
# 39分のジャクソンのゴール: FC「鈴木のロングキックで前線へ→つないでこぼれ球を奪い→バークリーのパス→ジャクソン」、サッカーダイジェスト「鈴木のキックが起点」。
#   ゲキサカは鈴木に触れず（マッギンのボール奪取、バークリーのパス）→ 起点という言い方だけを使う。
# 採点: Aston Villa Review が鈴木に8点でチーム内2番目、Aston Villa News が7点（ジャクソン10点が最高）。日本語はフットボールチャンネルの訳（英語原文は未確認）→ 媒体名は言わず「現地メディア」と言う。
# 「CL初の完封」: ゲキサカ（リード文。NO FOOTY NO LIFE が転載）・サッカーダイジェスト見出し。ESPN 等の英語の一次記録では確かめていない。
# アジアカップの最大7試合: FOOTBALL ZONE 10/15（元CEOキース・ワイネス氏が英メディアの番組で発言したと報じる）。7試合の算出方法は記事が説明していない → 「可能性」と言い切らない。
# 次の試合: ESPN の日程（10/17 プレミア ニューカッスル戦）。ホーム/アウェイは ESPN の表記から確かめられず → 言わない。
# 本人・監督のコメント: ゲキサカ・FC・日刊・サッカーダイジェスト・ヤフー系のどれにも無し → 台本には入れない。
# 写真: 配信の写真は全部 Getty / AP。取り込まない。Commons の鈴木は 2024年の代表の写真のみ（ヴィラのユニフォームの写真なし）。
# 反応のうち「なんというセーブだ」は、46秒までに誰かの声を出す決まりのため、何が起きたかの節（17分の直後）に置いた。
# 反応: NO FOOTY NO LIFE（海外の反応まとめ・10/15）に載った、英語圏のコメントの日本語訳から3件。匿名・未確認。投稿者の @ は元の記事に無い。元の英語の原文は未確認。
