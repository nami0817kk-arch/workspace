  - id: red
    heading: そして退場者が出た
    tier: 報道
    telop: 主将ウェアが、2枚目の警告で退場
    narrator: キャスター
    say:
      - "マルセイユの**主将ウェアが退場**になったのは、そのあとです。"
      - ヌーノ・メンデスを後ろから抑えて、2枚目の警告を受けました。
      - 10人になったマルセイユは、そのまま終わりを迎えます。
    official: false
    sources:
      - https://www.kicker.de/wilde-elf-minuten-psg-schlaegt-om-in-ueberzahl-1254714/video

  - id: order
    heading: 順番が、思われているのと逆
    main: true
    tier: 報道
    telop: 退場のとき、PSGはもう2対1でリードしていた
    narrator: 解説
    card:
      type: table
      title: 起きた順番
      columns: ["", ""]
      rows:
        - ["66分", "PSGが先制"]
        - ["72分", "PSGが2点目"]
        - ["74分", "PSGが3点目"]
        - ["77分", "マルセイユが退場者"]
    say:
      - {short_only: true, text: マルセイユが降格圏に沈みました。}
      - この試合、順番を取り違えやすいところがあります。
      - "マルセイユが退場者を出したのは**77分**。そのときPSGは、もう**2対1でリードしていました。**"
      - つまり「1人少なくなって崩れた」のではなく、崩れたあとに1人減っています。
      - 3点が入ったのは、わずか11分のあいだでした。
    official: false
    sources:
      - https://www.kicker.de/wilde-elf-minuten-psg-schlaegt-om-in-ueberzahl-1254714/video
      - https://news.footeo.com/

  - id: om
    heading: マルセイユは17位
    tier: 報道
    telop: 勝ち点3。降格圏に沈んでいる
    narrator: キャスター
    say:
      - "マルセイユは、これで**17位**。勝ち点は3です。"
      - "順位表では、**降格圏**に入る位置です。"
      - 監督のジェネジオは、試合後にこう話しました。
      - {voice: ジェネジオ監督, text: マルセイユがこの状況にあるのは、正常ではない}
      - {voice: ジェネジオ監督, text: 負けることはある。それはサッカーの一部だ。だが、立派な負けに満足するのは、受け入れられない}
      - {voice: ジェネジオ監督, text: 辞めるという考えはない}
    official: false
    sources:
      - https://www.footmercato.net/a3814219626525543005-psg-luis-enrique-se-prononce-sur-la-17eme-place-de-lom
      - https://www.footmercato.net/a6398914280381077709-ligue-1-apres-la-defaite-face-au-psg-lom-est-relegable

  - id: enrique
    heading: 勝った側は、どう見ていたか
    tier: 報道
    telop: 「とても良いOMを見た」
    narrator: 解説
    say:
      - PSGのルイス・エンリケは、相手をこう評しました。
      - {voice: ルイス・エンリケ, text: とても良いOMを見た。よく守っていたし、とても良い監督がいる}
      - {voice: ルイス・エンリケ, text: 試合前はみんな簡単だと言っていたが、何も簡単ではなかった}
      - {voice: ルイス・エンリケ, text: 前半は相手がとても良くプレーしたので、こちらのチャンスは少なかった}
    official: false
    sources:
