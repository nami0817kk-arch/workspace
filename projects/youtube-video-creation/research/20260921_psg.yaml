        - ["74分", "マルキーニョス（PSG）"]
        - ["77分", "ウェア退場（マルセイユ）"]
    say:
      - 大一番のル・クラシックは、PSGが2対1で勝ちました。
      - 前半は0対0。動いたのは後半の半ばからです。
      - ドゥエのクロスにフェラン・トーレスがニアで合わせ、そこから10分足らずで3点が入りました。
    official: false
    sources:
      - https://www.kicker.de/wilde-elf-minuten-psg-schlaegt-om-in-ueberzahl-1254714/video
