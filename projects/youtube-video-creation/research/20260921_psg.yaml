  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    telop: 「でも俺たちは17位だ」
    narrator: キャスター
    say:
      - {short_only: true, text: 見ていた人たちは、こう書いています。}
      - {voice: ネット民, text: 戦術的には悪い試合ではなかった。選手たちは2つのハーフを戦った。でも俺たちは17位だ, short_voice: true}
      - {voice: ネット民, text: 立派な負けなんて言いたくない}
      - {voice: ネット民, text: 次の試合でまた話そう。今度こそ本当に立て直さないといけない}
      - {voice: ネット民, text: 勝てなければ、今季は最悪のことを覚悟することになる}
      - {voice: ネット民, text: 審判はまたしてもひどい。しかもまたルテクシエだ}
      - {voice: ネット民, text: 「得失点差の維持」作戦、今夜も達成}
    official: false
    sources:
