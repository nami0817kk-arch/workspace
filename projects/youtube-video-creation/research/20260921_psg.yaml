    tier: 報道
    telop: マルセイユ1対2PSG。ヴェロドロームでの大一番
    narrator: キャスター
    card:
      type: table
      title: ル・クラシック
      columns: [時間, 得点者]
      rows:
        - ["66分", "フェラン・トーレス（PSG）"]
