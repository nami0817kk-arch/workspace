# ル・クラシック。マルセイユが降格圏に沈んだ（2026-09-21）
#
# 材料は research/raw/20260921_psg.md。
#
# **私がはじめに渡した前提「前半11分に退場」は誤りだった。**ドイツの見出し
# 「Wilde elf Minuten（荒れた11分間＝66分から77分の時間帯）」を「11分に」と読み違えていた。
# **実際の退場は77分のティモシー・ウェア**で、そのときPSGは既に2対1でリードしていた。
# **「数的不利になって崩れた」という筋ではない。**
#
# 日本語の記事は DAZN News の1本だけで、**コメント欄は0件**。
# **反応は57件すべてフランス語。**日本の声は無いまま出す。
#
# 前半32分ごろ「主審が一度レッドカードを出して引っ込めた」という話は、
# **報道が1媒体しかない。**現地の実況書き込みに時刻付きで残っているが、
# **確度は未確認**として扱い、断定しない。
format: news
voice_min: 40
