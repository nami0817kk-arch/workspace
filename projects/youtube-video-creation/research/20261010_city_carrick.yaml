# 取材メモ（10/10 題材 city_carrick、型は news、プレミア枠）。材料の控えは research/raw/20261010_city_carrick_material.md。
# **判決・処分の回**なので、事実の土台は 10/1〜10/3 に一次情報まで辿った控え
#   research/raw/20261002_city_verdict.md（委員会の判断の黒塗り版 PDF 40ページ・10の告発の項ごと）と
#   research/raw/20261003_city_appeal.md（控訴と規則 Section W の原文）から取っている。
#   この回で土台を作り直していない。記事の要約は根拠にしていない。
# **件数は言わない**。判断の本文は「100を超える個々の違反」だけで、「115件中114件」は公開された文書に無い。
# **「すべての告発で有罪」とは言わない**。財務の告発はすべて認定、調査への非協力は4つのうち3つ（4(B) は不成立）。
# **判決を断定しない**。言うのは「上訴中」「処分は確定していない」まで。
#   手続きの期限（10/1 申し立て → 84日 → 12/24、+30日 → 2027-01-23）は**規則の原文**から計算した数字なので使う。
#   報道の1社が書いている 2027年2月8日 は、根拠の条文が全文検索で見つからなかったので使わない。
# キャリックの発言は**媒体の原文**から。移籍情報の記者の投稿にある3行（早さについての1行・過去は過去という1行・
#   トッテナム戦の重圧についての1行）は、当たった4媒体のどこにも無いので使わない。
#   「取り返せない」系の3つの引用は同じ1つの問いへの答えなので、**つなげず1つだけ**使う。
#   本人は処分の見通しを避けているので、「剥奪を求めた」と読める形にしない。
# **会見の場所は書かれていない**ので「試合前の記者会見で」とだけ言う。媒体名は画面にも読み上げにも出さない。
# 同じ日の別の2本（city_maresca・city_around）とは、事実の土台をこの本にだけ置いて重ねない。
# 写真は記事の横長を先に当たった。01＝Commons の選手時代（CC BY 2.0 / Gordon Flood）、
#   04＝記事の og:image（監督としてのタッチライン、横1200）。04_w が冒頭とサムネ、01 がショートの縦。
# ネットの反応は集めていない（この題材で実在する投稿を当たっていないため、作らない）。
