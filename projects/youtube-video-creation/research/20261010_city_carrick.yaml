  say:
  - text: キャリックがユナイテッドの選手だったのは、2006年から2018年までです。
    image: assets/images/20261010_city_carrick/01.jpg
    card: none
  - text: 問われた9つの季は、その在籍の中にすっぽり入ります。9つのうち9つ。
    emph: true
    card: none
  - text: この9季で、2つのクラブは合わせて5回優勝しています。
    card: *rival
  - text: シティが3回、ユナイテッドが2回です。
    card: *rival
  - text: 2011-12は、勝ち点が89と89。差はゼロでした。
    card: &pts
