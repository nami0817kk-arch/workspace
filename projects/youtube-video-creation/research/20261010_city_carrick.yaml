      - - 89
        - ユナイテッドの勝ち点
      - - 0
        - 勝ち点の差
      ops:
      - －
      - ＝
  - text: 分けたのは得失点差の8だけ。プラス64とプラス56でした。
    card: *pts
  - text: 優勝が得失点差で決まったのは、プレミアリーグでこの1度だけです。
    card:
      <<: *rival
      highlight_row: 0
  - text: 2017-18は勝ち点100と81。こちらは19も離れていました。
    card:
      <<: *rival
      highlight_row: 2
