# ユニフォームとエンブレムの歴史 チェルシー（10/14 公開予定）。
# 一次情報（クラブ公式・紋章院の授与を扱った論文・BBC・ガーディアン）まで辿り、固有名詞・数字・年は原文で引き直した。
#
# ---- 節の並び：リヴァプール・マンU（紋章→色→金→見立て）／ハル（色→紋章→柄→見立て）／イプスウィッチ（胸の広告→紋章→赤→見立て）と重ねない ----
#   こちら：①オープニング ②**作り手との契約（main）→ ③紋章 → ④色 → ⑤胸の広告 → ⑥見立て**
#   強い一点の型も替えた：リヴァプール＝描き直しの回数／マンU＝文字が消えた／ハル＝色が消えた2度／イプスウィッチ＝売上の数字 に対し、
#   **こちらは「作り手との契約を、お金を払って途中で終わらせたのが2度」＝払った額（2005年 2450万ポンド・2016年 約4000万ポンド）**。
#
# ---- 強い一点（原文）----
#   ガーディアン 2005-01-20：「Chelsea has paid £24.5m to Umbro to end the football kit manufacturer's deal ... after lining up a bigger contract with a rival」
#     2001年に結んだ10年・5000万ポンドの継続を「ending it in 2006 rather than 2011」＝5年早く。
#   BBC 2016-05：アディダスは契約を「on 30 June 2017 instead of 2023」に終える（6年早く）。クラブが補償金を払う。
#   ガーディアン 2016-10-13：「Chelsea had to pay around £40m to part company with the German firm」。ナイキは「£60m a season for the next 15 years」「£900m」。
#   確度は**報道**（金額は新聞・BBC の報道。クラブは額を公表していない）。年（2005・2006・2016・2017）はクラブ公式とも一致。
#
# ---- クラブ紹介⑥（2026-09-20 公開）と重ねない ----
#   あちらが読み上げたのは：アロンソ・ドログバの言葉・創立1905・スタジアムが先にあった（ミアーズ）・愛称ブルーズ（青）・本拠地4万44人・
#   オーナー（ブルーコ・クリアレイク）・優勝の数・昨季10位・「ペンショナーズ」の由来（王立チェルシー病院の退役軍人）・
#   **1952年にドレイクが「古くさい」と言った**・ランパード・テリー・ドログバ・登録29人。
#   **この回で使ったのは「1905」（色の起点）と「老兵の絵」（紋章の最初の1行）だけ。**
#   ドレイクの「古くさい」・愛称の由来の説明・オーナーの名前・選手・成績は**一度も出していない**。
#
# ---- 食い違い（台本では言わない。ここに残す）----
#   ・**濃い青（ロイヤルブルー）に替わった年**：HFK は「1906年10月13日の試合の資料に『青と白』とある」が最も古い言及で、クラブ史家の説は複数と書く／
#     Wikipedia は「1912年ごろ」。クラブ公式は「最初の数季はイートン・ブルー」としか書かない。→ **台本は「のちに」までで年を言わない。**
#   ・**アディダスに払った補償額**：ガーディアン「約4000万ポンド」／Wikipedia「4000万ポンド」／HFK「5400万ポンド」／BBC「数千万ユーロ」。
#     → **台本は「報道で約4000万ポンド」**（ガーディアンの値）。HFK の5400万は採らない。
#   ・**ライオンの紋章が使われた期間**：Wikipedia は「1953〜1986年ずっと」／HFK は「1963年に外れ、1967年に復活」。クラブ公式は「ドレイク（1952〜61）の時代に
#     シャツに初めて付いた」。→ **台本は「1960年ごろ初めてシャツに」「1986年に別の姿に替わった」の2点だけ**。1963〜67年の中断は言わない（HFK 単独）。
#   ・**アンブロの開始年**：ガーディアン「1995年から」／HFK・クラブ公式「1987-88から」／Wikipedia「1995〜2006」。→ 開始年は言わず「2006年まで」だけ。
#   ・**シャツに紋章が付いた年**：HFK「1960年」／Wikipedia「1960年代の初め」→ 「1960年ごろ」。
#   ・**1986-87 の開幕は胸の広告が無かった**（HFK：チェルシー・コレクションは初めスポンサー無し）。→ 「史上初めて広告なしで開幕」とは**言わない**。「4季つづけて」だけ（BBC）。
#
# ---- 言わないと決めたもの ----
#   ・**アブラモヴィッチの制裁・スリーが契約を一時止めた件**は触れない（シャツの話から離れる）。スリーは「3年契約から」「2023年に切れた」だけ。
#   ・**女子チーム・育成年代の話は入れない**（決まり）。サークルの発表文は女子の欄があるが、台本は男子のシャツだけ。
#   ・**ライオンが商標にできなかったという詳しい経緯**は「商標の問題」とクラブ公式の言葉どおりに1行だけ。
#   ・**サムスン（2005〜15）・ヨコハマ（2015〜20）・コモドール・クアーズ等の期間**は Wikipedia 単独（サムスンは2005年のタイムズの見出しが出典）。→ 年表に入れず、
#     見立ての③の「22季で4社」だけに使った（確度は背景、**一次に当たっていない**と下に書く）。
#   ・アルファベットは読み上げに出さない（IFS →「アイエフエス」、ダマック、サークル。ユーエスディーシー・Nike 等の英字は板にも書かない）。
#   ・**サークルの契約の長さと額は公表されていない**（クラブ公式の発表文に無い）。推測で埋めていない。インフィニット・アスリートの額は「4000万ポンド超」（BBC）。
#
# ---- 一次情報に届かなかったところ ----
#   ・chelseafc.com の新しいページ（/en/club 等）は JS 描画で本文に届かない → web.archive.org の旧クラブ公式（club-history/1950・1960・1980・2000・1900）で代用した。
#   ・アンブロの2005年の額 2450万は**ガーディアン単独**（アンブロの株式取引所への発表も引かれているが、原文は手元に無い）。BBC・クラブ公式には額が無い。
#   ・ナイキが「相場より安い」は BBC（2026年8月）の評価。数字の裏づけは出ていない。
#   ・サークルの発表日（8月28日）は Wikipedia の脚注。クラブ公式の本文には日付が出ない（「今度の日曜・ブライトン戦」）。
#   ・2024-25 の開幕に広告が無かったこと：Wikipedia・BBC の「4季つづけて」から。個別のクラブ発表には当たっていない。
#
# ---- 自分で数えた数（検算した）----
#   ・ナイキ 60百万 − アディダス 30百万 ＝ 年30百万（ガーディアン 2016）／2017〜2023 の6年 → 30×6 ＝ 180百万＝1億8000万ポンド
#     180 ÷ 40 ＝ 4.5倍（違約金は約4000万）
#   ・アンブロ：5000万 ÷ 10年 ＝ 年500万／ナイキ 年6000万 ÷ 500万 ＝ 12倍
#   ・エミレーツ：報道が割れる（SportBusiness 4年2400万＝年600万／Marketing Week 4年2000万＝年500万／Sky 3年2400万＝年800万。**10/14 夜に第三者の点検で指摘。こちらで3社の原文は再確認していない**）→ 台本は「年500万から800万」と幅で言う。スリー 年4000万（スタンダード 2022-03）÷ 500〜800万 ＝ 5〜8倍／作り手12倍はどの場合も上回る
#   ・2001-02 から 2022-23 は 22季／22 ÷ 4社（エミレーツ・サムスン・ヨコハマ・スリー）＝ 5.5季に1社
#     直近 2023-24〜2026-27 の4季 ÷ 4社（インフィニット・アスリート・ダマック・アイエフエス・サークル）＝ 1季に1社／5.5 ÷ 1 ＝ 5.5倍
#   ・2005 − 1986 ＝ 19年／2026 − 1905 ＝ 121年／19 ÷ 121 ＝ 0.157 → 15.7%／2026 − 2005 ＝ 21年（19年を上回る）
#   ・ガーディアン 2005：アンブロ 5000万 ÷ 10 ＝ 500万／残り5年（2006〜2011）。
#
# 写真（10/14 取得）：assets/images/20261014_kit_chelsea/ の8枚。Wikimedia Commons（CC0 / CC BY / CC BY-SA）。出典は同じフォルダの credits.json。
#   サムネ・冒頭＝2018年FAカップ優勝の集合（ナイキ）／アンブロ期＝2006年のチェフ／アディダス期＝2008-09 の拍手／1960〜86年のライオンと青いショーツ＝1974年の試合（白黒）／紋章＝スタンフォード・ブリッジの紋章の看板。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11）。ここに書いた thumbnail は点検用の1案（number。直近は classic・number・scene なので 3回続きにならない）。
