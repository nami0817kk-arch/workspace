- id: crest
  heading: ライオンの姿が変わって、戻った
  tier: 背景
  telop: ライオンの紋章は1960年ごろにシャツへ付き、1986年に別の姿へ替わり、2005年の創立100年に戻った
  narrator: 解説
  card: &id_crest
    type: timeline
    title: 胸の紋章
    rows: &rows_crest
    - - 1905年ごろ
      - 老兵の絵。シャツには一度も付かず
    - - 1960年ごろ
      - ライオンが初めてシャツに付く
    - - 1975年
      - 紋章院が、リーグを通じてライオンの図柄を授ける
    - - 1986年
      - 商標の問題で、別の姿のライオンに替わる
    - - 2005年
      - 創立100年。昔のライオンが戻る
    focus: 2005年
  say:
  - text: ここからは、胸の紋章の話です。
    image: assets/images/20261014_kit_chelsea/c08_2026_w.jpg
    card: *id_crest
  - text: 創立のころの紋章は、近くの病院で暮らす老兵の絵でした。
    card:
      <<: *id_crest
      highlight_row: 0
  - text: ただ、その絵がシャツに付いたことは、一度もありません。
    card:
      <<: *id_crest
      highlight_row: 0
  - text: 紋章がシャツに初めて付いたのは、1960年ごろ。ドレイク監督の時代です。
    image: assets/images/20261014_kit_chelsea/c02_1974_w.jpg
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 描かれたのは、後ろを振り返って立つライオン。司教の杖を持っています。
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 由来は2つ。会長だった伯爵の紋章のライオンと、区の紋章にあった杖です。
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 1975年10月、紋章を扱う紋章院が、この図柄をフットボールリーグに授けました。
    image: assets/images/20261014_kit_chelsea/c08_2026_w.jpg
    card:
      <<: *id_crest
      highlight_row: 2
  - text: チェルシーが使うことを想定した図柄でした。
    card:
      <<: *id_crest
      highlight_row: 2
  - text: そのライオンが、1986年に別の姿に替わります。
    emph: true
    card:
      <<: *id_crest
      highlight_row: 3
  - text: クラブ公式の歴史は、理由を商標の問題と書いています。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card:
      <<: *id_crest
      highlight_row: 3
  - text: 代わりに付いたのは、クラブの頭文字の上に立つ、実物に近い姿のライオンでした。
    card:
      <<: *id_crest
      highlight_row: 3
  - text: それが2005年まで続きます。
    card:
      <<: *id_crest
      highlight_row: 3
  - text: 2005年、創立100年。昔のライオンが戻ってきました。
    image: assets/images/20261014_kit_chelsea/c08_2026_w.jpg
    emph: true
    card:
      <<: *id_crest
      highlight_row: 4
