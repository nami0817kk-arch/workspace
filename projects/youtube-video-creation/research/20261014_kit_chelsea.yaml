  title: チェルシーが契約を途中で切った2度。払った違約金はいくらだったのか
  question: チェルシーのユニフォームと胸は、契約と色と紋章でどう変わってきたのか
  opening_image: assets/images/20261014_kit_chelsea/c07_2018_w.jpg
  lead: 青いシャツの胸に、ライオンが立つクラブ。
  hook: 契約、紋章、色、広告。胸まわりに起きたことを順に見ます。
  takeaway: チェルシーはユニフォームの作り手との契約を、お金を払って途中で終わらせたことが2度ある。2005年はアンブロとの契約を5年早く終え、報道で2450万ポンド。2016年はアディダスを6年早く終え、報道で約4000万ポンドを払ってナイキと15年の契約を結んだ（1年約6000万ポンド、総額9億ポンド）。自分で数えると、アディダスの1年約3000万との差は6年で1億8000万ポンドになり、違約金のおよそ4.5倍になる。1年あたりの額は、2001年のアンブロ約500万ポンドからナイキの約6000万ポンドまで12倍、胸の広告は2001年のエミレーツ航空（報道で年500万から800万ポンドと割れる）からスリーの4000万ポンドまで5倍から8倍で、作り手の伸びのほうが大きい。胸の広告は1983年のガルフ・エアが最初で、2001年からの22季に付いた会社は4社だったが、2023年の契約切れ以降は開幕を広告なしで迎えることが4季つづき、その4季に4社が入れ替わった。紋章のライオンは1960年ごろにシャツへ付き、1986年に商標の問題で別の姿に替わり、2005年の創立100年に戻った。別の絵だった19年は創立121年の15.7%で、戻ってから21年はそれを上回る。青は創立のころは会長だったカドガン伯爵の競走馬の勝負服の淡いイートン・ブルーで、1964年ごろにショーツが青、ソックスが白になった
short_title: チェルシーが払って切った、ユニフォームの契約
