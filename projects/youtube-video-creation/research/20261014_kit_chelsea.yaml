  say:
  - text: チェルシーのシャツと紋章の話です。
    short_only: true
  - text: チェルシーは、ユニフォームの作り手との契約を、2度、途中で終わらせています。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    emph: true
    card: *id_two
  - text: どちらも、お金を払っての終わりでした。
    card: *id_two
  - text: 払った額は、2005年が2450万ポンド。
    image: assets/images/20261014_kit_chelsea/c12_2006_w.jpg
    card: *id_two
  - text: 2016年は約4000万ポンドと報じられています。
    image: assets/images/20261014_kit_chelsea/c17_2009_w.jpg
    card: *id_two
  - text: どちらも、もっと大きな契約が見つかったからでした。
    card: *id_two
  - text: その前、1986年には、作り手に頼らない季がありました。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card: &id_maker
      type: table
      title: 作り手と、契約の終わり方
      columns: &cols_maker
      - いつ
      - 作り手
      - 終わり方
      rows: &rows_maker
      - - 1986-87
        - 自社「コレクション」
        - 1季だけ
      - - 2006年まで
        - アンブロ
        - 5年早く終える
      - - 2006〜2017
        - アディダス
        - 6年早く終える
      - - 2017〜2032
        - ナイキ
        - 15年で9億ポンド
      highlight_row: 0
  - text: ルコック・スポルティフとの関係が壊れ、クラブは自分たちでシャツを作りました。
    card: *id_maker
  - text: 名前は「チェルシー・コレクション」。売れた分を、自分たちで受け取る考えでした。
    card: *id_maker
  - text: 続いたのは、最初の季だけ。次のシーズンには、アンブロと結び直しています。
    card: *id_maker
  - text: 2005年1月、そのアンブロとの契約を、5年早く終えると発表します。
    image: assets/images/20261014_kit_chelsea/c12_2006_w.jpg
    emph: true
    card:
      <<: *id_maker
      highlight_row: 1
  - text: 2001年に結び直した10年の契約を、半分の5年で切りました。
    card:
      <<: *id_maker
      highlight_row: 1
  - text: 払ったのは、報道で2450万ポンドです。
    card:
      <<: *id_maker
      highlight_row: 1
  - text: 行き先はアディダス。2006年から、新しいシャツになりました。
    image: assets/images/20261014_kit_chelsea/c17_2009_w.jpg
    card:
      <<: *id_maker
      highlight_row: 2
  - text: 2013年には、2023年までの10年契約を結び直しました。
    card:
      <<: *id_maker
      highlight_row: 2
  - text: クラブは「パートナーと結んだ、これまででいちばん大きな契約」と発表しています。
    card:
      <<: *id_maker
      highlight_row: 2
  - text: ところが2016年5月、契約が2023年を待たず、6年早く終わると発表されます。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card:
      <<: *id_maker
      highlight_row: 2
  - text: クラブが払う違約金は、報道で約4000万ポンド。
    card:
      <<: *id_maker
      highlight_row: 2
  - text: 同じ年の10月、ナイキと15年の契約を結びました。
    image: assets/images/20261014_kit_chelsea/c07_2018_w.jpg
    card:
      <<: *id_maker
      highlight_row: 3
  - text: クラブはこれを「史上最大の商業契約」と呼びました。
    card:
      <<: *id_maker
      highlight_row: 3
  - text: 1年およそ6000万ポンド、総額9億ポンドという報道です。
    emph: true
    card:
      <<: *id_maker
      highlight_row: 3
  - text: 今のナイキの額は、相場より低いと見る向きもあります。
    card:
      <<: *id_maker
      highlight_row: 3
