- id: colour
  heading: 淡い青から始まった
  tier: 背景
  telop: 最初の青は、会長の伯爵の競走馬の勝負服の色。ずっと淡い青だった
  narrator: 解説
  card: &id_colour
    type: table
    title: チェルシーの青
    columns: &cols_colour
    - いつ
    - 着ていたもの
    rows: &rows_colour
    - - 1905年
      - 淡いイートン・ブルーのシャツ
    - - 最初の数季のあと
      - 濃い青のシャツへ
    - - 1964年ごろ
      - ショーツが青、ソックスが白
    - - 1986-87
      - アウェーは緑がかったジェイド色
  say:
  - text: チェルシーの青は、最初は今と違う青でした。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    emph: true
    card: *id_colour
  - text: 創立のころの数季は、イートン・ブルーと呼ばれる、ずっと淡い青でした。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 競走馬の勝負服の色。馬の持ち主は、会長だったカドガン伯爵です。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 紋章のライオンも、この伯爵の家のものでした。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: シャツはのちに、いまの濃い青に替わりました。
    card:
      <<: *id_colour
      highlight_row: 1
  - text: 次に形が変わったのは、1964年ごろ。
    image: assets/images/20261014_kit_chelsea/c02_1974_w.jpg
    card:
      <<: *id_colour
      highlight_row: 2
  - text: ドハティ監督が、ショーツを青、ソックスを白にしました。
    image: assets/images/20261014_kit_chelsea/c02_1974_w.jpg
    card:
      <<: *id_colour
      highlight_row: 2
  - text: 青いシャツ、青いショーツ、白いソックス。いまのホームの形です。
    card:
      <<: *id_colour
      highlight_row: 2
  - text: 1986-87シーズンのアウェーは、ジェイドという緑がかった色でした。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card:
      <<: *id_colour
      highlight_row: 3
  - text: クラブ公式の紹介では、創立のころの青への目配せとされています。
    card:
      <<: *id_colour
      highlight_row: 3
  sources:
  - https://web.archive.org/web/20151218090652id_/http://www.chelseafc.com/the-club/club-history/1900.html
  - https://web.archive.org/web/2015id_/http://www.chelseafc.com/the-club/club-history/1960.html
  - https://www.chelseafc.com/en/news/article/blue-is-the-colour-the-chelsea-collection
  - https://www.historicalkits.co.uk/Chelsea/Chelsea.htm
- id: chest
  heading: 胸の広告が空いた4季
  tier: 報道
  telop: 2023年の契約切れ以降、開幕を胸に広告なしで迎えるのが4季つづいた
  narrator: キャスター
  card: &id_chest
    type: timeline
    title: 胸に付いてきた広告
    rows: &rows_chest
    - - 1983年
      - ガルフ・エア。胸の広告の始まり
    - - 2001年
      - エミレーツ航空。額は報道で割れる
    - - 2020年
      - スリー。3年契約から
    - - 2023年
      - 開幕は広告なし。9月末に1季だけの契約
    - - 2025〜26年
      - 季の終わりの数か月だけ。2社
    - - 2026年8月
      - サークルが胸に
    focus: 2023年
  say:
  - text: 胸の広告の話です。チェルシーは1983年、ガルフ・エアという航空会社が最初でした。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card:
      <<: *id_chest
      highlight_row: 0
  - text: 2001年からはエミレーツ航空。額は報道で割れています。
    card:
      <<: *id_chest
      highlight_row: 1
  - text: 4年で2000万から2400万ポンド、3年で2400万ポンドと伝えられています。
    card:
      <<: *id_chest
      highlight_row: 1
  - text: 2020年からは、通信会社のスリー。
    image: assets/images/20261014_kit_chelsea/c07_2018_w.jpg
    card:
      <<: *id_chest
      highlight_row: 2
  - text: スリーは、3年の契約から始まりました。
    card:
      <<: *id_chest
      highlight_row: 2
  - text: その契約が切れた2023年、開幕の胸には広告がありませんでした。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    emph: true
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 9月末に決まったのは、インフィニット・アスリート。
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 1季だけの契約で、額はスリーの1年とほぼ同じ水準でした。
    card:
      <<: *id_chest
      highlight_row: 3
  - text: 翌2024-25シーズンも、広告なしの開幕です。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 2025年4月30日、ドバイの不動産会社ダマックの広告が付きます。
    image: assets/images/20261014_kit_chelsea/c08_2026_w.jpg
    card:
      <<: *id_chest
      highlight_row: 4
  - text: カンファレンスリーグの準決勝から、季の終わりまでです。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 2025-26シーズンの開幕も、広告なし。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 2026年2月、アイエフエスが、季の残りの胸に付きました。
    image: assets/images/20261014_kit_chelsea/c07_2018_w.jpg
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 産業向けのAIソフトを作っている会社でした。
    card:
      <<: *id_chest
      highlight_row: 4
  - text: そして今季も、開幕は広告なし。これで4季つづけてです。
    emph: true
    card:
      <<: *id_chest
      highlight_row: 4
  - text: 2026年8月28日、サークルを発表しました。デジタルのドルを出している会社です。
    card:
      <<: *id_chest
      highlight_row: 5
  - text: ホームでの今季最初のプレミアリーグの試合から、胸に付いています。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card:
      <<: *id_chest
      highlight_row: 5
  - text: 契約の長さと額は、発表されていません。
    card:
      <<: *id_chest
      highlight_row: 5
  - text: クラブが求める額は、報道で年5000万から5500万ポンドとされています。
    card:
      <<: *id_chest
      highlight_row: 5
  sources:
  - https://www.bbc.com/sport/articles/cn0r9xk94l9o
  - https://www.bbc.com/sport/football/66970280
  - https://www.bbc.com/sport/football/articles/cpq784wjy88o
  - https://www.chelseafc.com/en/news/article/chelsea-football-club-selects-ifs-as-principal-partner
  - https://www.chelseafc.com/en/news/article/chelsea-football-club-announces-circle-internet-group-as-principal-partner
  - https://www.chelseafc.com/en/news/2020/01/24/chelsea-announces-three-as-new-official-shirt-partner
  - https://web.archive.org/web/2015id_/http://www.chelseafc.com/the-club/club-history/1980.html
- id: view
  viewpoint: true
  heading: 見立て・違約金の4.5倍が戻る契約。広告の入れ替わりは5.5倍速く
  tier: 背景
  telop: 違約金は契約の差額の4.5分の1。胸の広告の入れ替わりは、5.5季に1社から1季に1社へ
  narrator: 解説
  card: &id_diff
    type: calc
    title: 差額は、違約金の何倍か
    terms:
    - - 1億8000万ポンド
      - ナイキとアディダスの差、6年ぶん
    - - 約4000万ポンド
      - 払った違約金
    - - 4.5倍
      - 割った答え
    ops:
    - ÷
    - ＝
  say:
  - text: ここから、チェルシーの契約と広告とライオンを、自分で数えて測り直します。
    image: assets/images/20261014_kit_chelsea/c10_sb2026_w.jpg
    card: *id_diff
  - text: ひとつ目。2016年に払った違約金は、割に合ったのかを数えます。
    card: *id_diff
  - text: アディダスの1年は、およそ3000万ポンド。ナイキは、その2倍。
    card: *id_diff
  - text: 差は1年3000万。
    card: *id_diff
  - text: アディダスが残っていた6年でかけると、1億8000万ポンドになる。
    card: *id_diff
  - text: 違約金で割ると、4.5倍。報道の額で数えました。
    emph: true
    card: *id_diff
    mark:
      kind: circle
      item: 2
  - text: ふたつ目は、1年あたりの額の伸びです。
    card: &id_grow
      type: table
      title: 1年あたりの額（報道）
      columns: &cols_grow
      - ''
      - 2001年の契約
      - 後の契約
      - 倍
      rows: &rows_grow
      - - 作り手
        - アンブロ 約500万
        - ナイキ 約6000万
        - 12倍
      - - 胸の広告
        - エミレーツ 500〜800万
        - スリー 4000万
        - 5〜8倍
  - text: 作り手は、2001年のアンブロが約500万ポンド。ナイキの額は、その12倍。
    card:
      <<: *id_grow
      highlight_row: 0
  - text: 胸の広告は、2001年のエミレーツ航空から。年に直すと500万から800万。
    card:
      <<: *id_grow
      highlight_row: 1
  - text: スリーの額は、その5倍から8倍にあたる。
    card:
      <<: *id_grow
      highlight_row: 1
  - text: 作り手は12倍。胸の広告の5倍から8倍より、大きく伸びています。
    emph: true
    card: *id_grow
  - text: みっつ目は、胸に付く会社の入れ替わりです。
    card: &id_swap
      type: calc
      title: 胸の広告が替わる間隔（季）
      terms:
      - - 22季
        - 2001-02から2022-23。会社は4社
      - - 4社
        - エミレーツ・サムスン・ヨコハマ・スリー
      - - 5.5季に1社
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 2001年から2022-23までの22季で、胸に付いた会社は4社。
    card: *id_swap
  - text: 5.5季に1社の入れ替わりでした。
    card: *id_swap
  - text: 直近の4季も、付いた会社は4社。1季に1社になった。
    card: *id_swap
  - text: 入れ替わりは、5.5倍の速さになりました。
    emph: true
    card: *id_swap
  - text: よっつ目は、ライオンです。
    card: &id_lion
      type: calc
      title: ライオンが別の絵だった年は、歴史のどれだけか
      terms:
      - - 19年
        - 1986年から2005年
      - - 121年
        - 1905年から2026年
      - - 15.7%
        - 歴史に占める割合
      ops:
      - ÷
      - ＝
  - text: 別の絵だった期間は、1986年から2005年までの19年。
    card: *id_lion
  - text: 創立121年の15.7%でした。
    card: *id_lion
  - text: 戻ってから、今年で21年。離れていた19年を、もう上回っています。
    emph: true
    card: *id_lion
  - text: 作り手も、胸の広告も、何度も替わりました。
    card: none
  - text: ライオンは、いちど別の姿に替わって、戻ってきています。
    card: none
  sources:
  - https://www.theguardian.com/football/2016/oct/13/chelsea-new-kit-deal-nike-60m
  - https://www.bbc.com/news/business-36266181
