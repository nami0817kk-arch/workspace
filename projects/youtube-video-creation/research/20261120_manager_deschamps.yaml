# 監督紹介：ディディエ・デシャン（11/20 金、シリーズ「監督紹介」、key: manager_deschamps、型は news）。8節（日本との接点は無し）。見本は 20261118_manager_nagelsmann。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-12）**：既出18人（グアルディオラ…ポチェッティーノ・ナーゲルスマン）以外の大物から。ジダンは 10/03・10/18 と重なるので外し、その前任のデシャンを選んだ。
#   ・退任した監督も扱ってよい（2026-10-20 ユーザー）。題・語りは「前フランス代表監督」。
#   **重なりの確認（2026-11-12 に自分で）**：posted.json・covered.yaml・scripts/・2026111*_picks.txt にデシャンを主題にした本は無い（ジダンの回に名前が出る程度）。
#     同じ 11/20 の他担当（20261119_picks.txt）：レジェンド（世界）＝ロベルト・カルロス、代表＝チュニジア。同じ人・国は無し。
#     ※フランス代表の回が将来出るときは、この回と重ねないこと。
#
# **いまの立場**：2026-07-18 の3位決定戦（フランス 4-6 イングランド）が最後の試合。FFF は 2026-07-28 にジダンの就任を発表（4年契約、2030年W杯まで）。
#   ○ 英語版 Wikipedia「Didier Deschamps」（2026-11-12 に API で本文を読んだ）：「Deschamps' final game as France head coach ended in a 6–4 defeat to England」「fourth place at the 2026 FIFA World Cup」。2025-01 に「2026年W杯のあとは延長しない」と発表。
#   ○ ESPN・Yahoo Sports・beIN など複数（WebSearch の結果、2026-11-12）：ジダンが 2026-07-28 に就任。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of 18 July 2026）。トップチームのみ。
#   モナコ 220試合110勝59分51敗／ユヴェントス 43試合30勝11分2敗／マルセイユ 163試合82勝40分41敗／フランス代表 185試合120勝35分30敗。
#   Career total 611試合342勝145分124敗。**自分で足して一致**（220+43+163+185＝611、110+30+82+120＝342、59+11+40+35＝145、51+2+41+30＝124）。勝率 342÷611＝56.0%。
#   勝率（自分で割って確認）：モナコ 50.0%、ユヴェントス 69.8%、マルセイユ 50.3%、フランス代表 64.9%。クラブ3つ合計 426試合222勝＝52.1%。フランスとの差 12.8 ポイント。
#   ※ユヴェントスはセリエB（2006-07）。
#
# **歩み**（英語版本文）：2001 引退（32歳）。モナコ監督 2001-05（2003 リーグカップ、2004 CL 決勝＝0-3 ポルト。35歳でCL決勝に進んだ最年少の監督）。2006-07 ユヴェントス（セリエB優勝・昇格）。2009-12 マルセイユ（2009-10 リーグ・アン優勝、リーグカップ3連覇）。
#   2012-07-08 フランス代表（ブランの後任）。2014 W杯 準々決勝（ドイツに0-1）／EURO2016 決勝（ポルトガルに延長0-1）／2018 W杯 優勝／EURO2020 ラウンド16（スイスにPK負け）／2022 W杯 決勝（アルゼンチンにPK負け）／EURO2024 準決勝／2026 W杯 4位。ネーションズリーグ 2020-21 優勝・2024-25 3位。
#   7大会のうち準決勝以上は5大会（自分で数えた：2016・2018・2022・2024・2026）。決勝3回、優勝1回。
#   2026 W杯：準々決勝モロッコに2-0（W杯20勝目、監督として初の20勝）、準決勝スペインに0-2、3位決定戦イングランドに4-6。
#
# **戦術の色**＝2018 W杯（英語版 Style of management・France 節）。4-2-3-1、マテュイディを左に開かせ、ジルーを偽9番に。グループは僅差（豪1-0・ペルー1-0・デンマーク0-0）、決勝トーナメントはアルゼンチン4-3・ウルグアイ2-0・ベルギー1-0・クロアチア4-2。
#   実例＝準決勝ベルギー戦（1-0）。ベルギーの選手から実利的・守備的という批判が出た（英語版）。
#
# **日本との接点**：無し（入れない）。
#
# **本人の言葉**：2026-07-17 の前日会見（Al Jazeera 2026-07-18 記事が引用、2026-11-12 に WebFetch で読んだ）。原文：“I had the privilege of experiencing moments that were magical, and others that were difficult… But life goes on. I'm a positive person, and I know things will be good, too.”
#   ※原語はフランス語の会見で、英語訳からの重訳。台本の訳は英文に沿う。
# **マル秘話**（英語版）：選手時代の呼び名「水を運ぶ人」（カントナが皮肉で付けた呼び名。本人の持ち味＝奪って味方につなぐ）。1993年、マルセイユでCLを掲げた最年少の主将。ラグビーのビアリッツのクラブにもいた。2018年、W杯を選手（1998）と監督で制した3人目（ザガロ、ベッケンバウアーに続く）。
#
# **入れなかったもの**：家族・私生活（母の死去・兄の事故）、フランス代表の内部不和の噂、ジダン就任への批評、FotMob・女子・ニュースの反応。
