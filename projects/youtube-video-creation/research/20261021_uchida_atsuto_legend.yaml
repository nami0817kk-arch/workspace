- id: match
  heading: 2011年4月、ミラノとゲルゼンキルヒェンで、何が起きたのか
  tier: 報道
  main: true
  telop: 準々決勝、インテルに合計7対3
  card:
    type: stats
    title: チャンピオンズリーグ準々決勝（2011年4月）
    items:
    - ['5', 対2, 第1戦。ミラノで、インテルに勝つ]
    - ['7', 対3, 2試合の合計]
    - ['4', 強, シャルケはクラブ初の準決勝]
    focus: 1
  say:
  - text: シャルケの右サイドバック、内田篤人。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    short_only: true
    card: none
  - text: 最も大きな舞台は、2011年4月、チャンピオンズリーグの準々決勝。
    short_only: true
    card: none
  - text: この年のシャルケは、リーグ戦では14位でした。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    card: none
  - text: それでも、チャンピオンズリーグでは勝ち進みます。
    card: none
  - text: 準々決勝の相手は、前の年の優勝チーム、インテル・ミラノ。
    card: &umatch_tl
      type: timeline
      title: 2010-11 CL 準々決勝・準決勝
      rows:
      - ['4月5日', 'ミラノで、インテルに5対2']
      - ['4月13日', '本拠地で、インテルに2対1']
      - ['合計', '7対3で、クラブ初の準決勝へ']
      - ['4月26日', '準決勝 第1戦。ユナイテッドに0対2']
      - ['5月4日', '第2戦。マンチェスターで1対4']
      focus: 0
      highlight_row: 0
  - text: 長友佑都のいるクラブで、チャンピオンズリーグ初の、日本人対決でもありました。
    card: none
  - text: 第1戦、4月5日、ミラノ。開始1分に先制されます。
    emph: true
    card:
      <<: *umatch_tl
      highlight_row: 0
  - text: それでも、エドゥの2点などで、5対2の大勝。
    emph: true
    card:
      <<: *umatch_tl
      highlight_row: 0
  - text: 欧州の報道が選ぶ、この試合のベストイレブンに、内田篤人の名前がありました。
    card: none
  - text: 第2戦は、本拠地で2対1の勝ち。合計は、7対3です。
    card:
      <<: *umatch_tl
      highlight_row: 1
  - text: これで、ベスト4。シャルケにとって、初めての景色でした。
    emph: true
    card:
      <<: *umatch_tl
      highlight_row: 2
  - text: この年のチャンピオンズリーグ12試合のうち、内田は11試合に出ました。
    card: none
  - text: 準決勝は、マンチェスター・ユナイテッドに、0対2、1対4。
    card:
      <<: *umatch_tl
      highlight_row: 4
  - text: 5月、ポカール決勝は5対0。内田は途中出場で、移籍後初のタイトル。
    card: none
  quotes_from: []
