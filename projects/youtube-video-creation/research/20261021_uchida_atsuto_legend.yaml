    cont: true
  - voice: 内田篤人
    text: あっ、僕はこれからここでプレーするんだな、と。
    cont: true
  - voice: 内田篤人
    text: 特に質問をすることはなかったですね。
    cont: true
  - voice: 内田篤人
    text: 点が取れないからサイドバックになった、
    cont: true
  - voice: 内田篤人
    text: という印象を最初は受けていました。
    cont: true
    pause: 0.6
