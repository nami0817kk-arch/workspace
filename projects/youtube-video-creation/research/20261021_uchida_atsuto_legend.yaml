- id: after
  heading: ピッチを離れた右サイドバックは、いま何をしているのか
  tier: 報道
  telop: 引退のあと、指導者へ
  card:
    type: timeline
    title: 引退のあと
    rows:
    - ['2020年8月', 現役を引退（32歳）]
    - ['2020年9月', JFAのロールモデルコーチ]
    - ['2021年5月', シャルケのアンバサダー]
    - ['2026年5月', 日本サッカー協会がコーチ就任を発表]
    focus: 3
    highlight_row: 0
  say:
  - text: 2020年8月20日、鹿島が、内田篤人の現役引退を発表します。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    card: &uafter_tl
      type: timeline
      title: 引退のあと
      rows:
      - ['2020年8月', 現役を引退（32歳）]
      - ['2020年9月', JFAのロールモデルコーチ]
      - ['2021年5月', シャルケのアンバサダー]
      - ['2026年5月', 日本サッカー協会がコーチ就任を発表]
      focus: 3
      highlight_row: 0
  - text: 理由は、コンディション。2月に、右足を負傷していました。
    card: none
  - text: 引退セレモニーで語ったのは、鹿島の先輩たちの姿。
    card: none
  - voice: 内田篤人
    text: その姿を……いまの後輩に見せることができないと、
  - voice: 内田篤人
    text: 日々練習していく中で身体が戻らないことを実感し、
    cont: true
  - voice: 内田篤人
    text: このような気持ちを抱えながら、
    cont: true
  - voice: 内田篤人
    text: 鹿島アントラーズでプレーすることは違うんじゃないかと、
    cont: true
  - voice: 内田篤人
    text: サッカー選手として終わったんだなと考えるようになりました。
    cont: true
    pause: 0.6
  - text: 8月23日、ガンバ大阪戦。前半16分から出場して、約75分。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    card:
      <<: *uafter_tl
      highlight_row: 0
  - text: 終了間際の同点ゴールは、内田のサイドチェンジから始まりました。
    emph: true
    card: none
  - text: 9月、日本サッカー協会のロールモデルコーチに。後進の育成が、役割でした。
    card:
      <<: *uafter_tl
      highlight_row: 1
  - text: 2021年5月には、シャルケのクラブアンバサダーに就任しました。
    card:
      <<: *uafter_tl
      highlight_row: 2
  - text: 2026年5月、日本サッカー協会のコーチへの就任が発表されました。
    image: assets/images/20261021_uchida_atsuto_legend/pair_0405.jpg
    card:
      <<: *uafter_tl
      highlight_row: 3
