- id: secret
  heading: 始発の電車と、テーピングの右ももに、何があったのか
  tier: 報道
  telop: 毎朝5時40分と、2014年の右もも
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &usecret_rows
    - ['高校時代', 毎朝5時40分の始発で、清水へ']
    - ['2014年6月', 右ももの腱の大けがから、W杯へ']
    source: REAL SPORTS・スポニチ
  say:
  - text: ここからは、数字には出ない話を、2つ。
    image: assets/images/20261021_uchida_atsuto_legend/pair_0405.jpg
    card: &usecret_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *usecret_rows
      source: REAL SPORTS・スポニチ
      highlight_row: 0
  - text: 1つ目は、高校時代。始発は、午前5時40分。電車で約1時間、自転車で約1キロ。
    emph: true
    card:
      <<: *usecret_card
      highlight_row: 0
  - text: 下宿の話もありましたが、当時の監督、梅田和男さんによると、
    card: none
  - voice: 梅田和男さん
    text: 自宅に帰ることで篤人がホッとしている部分もあるので、
  - voice: 梅田和男さん
    text: 限界までやらせたいと言われました。
    cont: true
    pause: 0.6
  - text: 2つ目は、2014年のワールドカップ。
    image: assets/images/20261021_uchida_atsuto_legend/pair_0405.jpg
    card:
      <<: *usecret_card
      highlight_row: 1
  - text: この年の2月、右太ももの腱が切れる大けがを負いました。
    card: none
  - text: 手術を勧められましたが、手術をしない、保存療法を選びます。
    card: none
  - text: 半年足らずで復帰。患部は、テーピングでぐるぐる巻きでした。
    emph: true
    card: none
  - voice: 内田篤人
    text: 支えてくれるスタッフがいる。痛いなんて言えない。
    pause: 0.6
  - text: グループリーグ敗退。それでも、3試合すべてに先発しました。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    card: none
