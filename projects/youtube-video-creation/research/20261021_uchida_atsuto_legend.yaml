      rows: *ucmp_rows
      source: Wikipedia・スポニチ
      highlight_row: 0
  - text: 鹿島の最初の4季は、Jリーグの1部で115試合。1季あたり、約29試合。
    card:
      <<: *ucmp_card
      highlight_row: 0
  - text: ドイツに渡ってからの5季は、ブンデスリーガ1部に104試合。
    emph: true
    card:
      <<: *ucmp_card
      highlight_row: 1
    mark: {kind: circle, row: 1, col: 1}
  - text: 1季あたり、約21試合です。鹿島の時より、約8試合少ない。
    card:
      <<: *ucmp_card
      highlight_row: 1
  - text: それでも、この5季の中に、クラブ初のCL4強と、ポカール優勝があります。
    image: assets/images/20261021_uchida_atsuto_legend/01_w.jpg
    card: none
  - text: その後の3季、シャルケでのリーグ戦は0試合。右膝の手術は、2015年6月。
    card:
      <<: *ucmp_card
      highlight_row: 2
  - text: 走って、つないで、守る。
    image: assets/images/20261021_uchida_atsuto_legend/pair_0405.jpg
    card: none
  - text: 限られた試合数で、ヨーロッパの準決勝まで届いた、右サイドでした。
