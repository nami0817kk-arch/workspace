# 内田篤人（元日本代表）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-21。型は 10/18 の中田英寿・10/19 の長谷部誠・10/20 の中村俊輔と同じ8節。
# ①フック ②基礎DATA ③歩んだ道と転機 ④プレースタイル（＋通算の表）⑤「あの試合」＝2011-04 チャンピオンズリーグ準々決勝 シャルケ対インテル（2試合）⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は JFA・スポニチ・日刊スポーツ・日本語版 Wikipedia の成績表と、自分で割った値だけ。
# **引退後の私生活（家族・結婚・テレビ出演・CM）は入れない**。女子サッカーの話は入れない（現在のコーチ就任を1行の事実として言うだけ。下の「判断」参照）。
#
# **一次情報で確かめたこと（引退・時期・いまの立場）**
# - 引退：鹿島アントラーズが 2020-08-20 に発表（本人がコンディション面を理由にクラブへ申し入れ）。スポニチ 2020-08-21「内田 32歳で引退」。ラストマッチは 2020-08-23 のガンバ大阪戦（日刊スポーツ 2020-08-23：前半16分から途中出場、約75分、キャプテンマーク）。
#   鹿島公式サイトは 429（アクセス制限）で本文を読めなかったので、**クラブ発表そのものは未読**。スポニチ・日刊・Football ZONE・REAL SPORTS（2020-08-26）が一致している。
# - ロールモデルコーチ：JFA 公式 2020-09-13「ロールモデルコーチとして内田篤人氏と契約」（jfa.jp/national_team/news/00025323/。選手歴・代表歴・技術委員長コメント）。
# - いまの立場：JFA 公式 なでしこジャパン 2026 年のメンバー・スタッフのページ（jfa.jp/nadeshikojapan_2026/member/）に「コーチ 内田 篤人」。スポニチ 2026-05-18 が就任発表の記事（狩野倫久監督の就任会見の席で発表）。
#   2021-05-21 にシャルケのクラブアンバサダー（ドイツ語版 Wikipedia。クラブ発表の引用。クラブ公式は未読）。
# - **現役ではない**ことを確認（2020-08-23 に引退、いまは指導者）。
#
# **判断（台本での扱い）**
# - 「女子サッカーは扱わない」との衝突：いまの肩書きが「サッカー日本女子代表のコーチ」。**女子サッカーの中身は一切入れず、就任したという事実を1行だけ**言う（after 節）。
#   これも避けたいなら、after 節の該当1行と基礎DATAの「現在」行を「日本サッカー協会のコーチ」に替える（要判断）。
# - 数字の食い違い：J1は 148試合3得点（日本語版 Wikipedia の成績表。2020-08-23 の日刊スポーツが「J1通算148試合目」）。スポニチ 2020-08-20 の時点は147試合（23日の出場で148）。ドイツ1部は 104試合1得点（スポニチ・Wikipedia 一致）、ドイツ2部は 2試合0得点。
#   **リーグ戦の合計は自分で足した：254試合4得点**（148+104+2、3+1+0）。日本代表は 74試合2得点（JFA 公式）。
# - 英語版 Wikipedia は準々決勝の合計を「7-4」と書くが誤り。**UEFA の試合記録（英語版 Wikipedia の knockout phase 表。UEFA の試合ページを出典にしている）は 2-5・2-1 で合計7-3**。台本は 7対3。
# - 第1戦 2011-04-05 サン・シーロ（インテル2-5シャルケ：スタンコビッチ1分・ミリート34分／マティプ17分・エドゥ40分と75分・ラウル53分・ラノッキアのオウンゴール57分）、第2戦 2011-04-13 ゲルゼンキルヒェン（シャルケ2-1：ラウル45分・ヘーヴェデス81分／モッタ49分）。準決勝は 0-2・1-4 でマンチェスター・ユナイテッド。
# - 復帰日：日本語版 Wikipedia は「2016-12-08 ヨーロッパリーグ・ザルツブルク戦、1年9か月ぶり」、英語版は「7日」。**台本は日付を言わず「2016年12月」**。
# - **「日本人として初めてのCL準決勝」とは言わない**（Wikipedia の記述で、一次資料で確かめていない）。REAL SPORTS（2020-08-26）が「日本人選手として最高のベスト4」と書くので、**言うのは「クラブ初の準決勝」（ドイツ語版 Wikipedia「zum ersten Mal in der Vereinsgeschichte das Halbfinale der Champions League」）と「CL初の日本人対決」（日本語版 長友佑都）まで**。
# - **「ユーロスポーツの第1戦ベストイレブン」は日本語版 Wikipedia のみ**（原文未読）。台本は「欧州の報道が選ぶ、第1戦のベストイレブン」とだけ言う（確度：報道・要裏取り）。
# - 「CL 12試合のうち11試合」：11試合は日本語版 Wikipedia の成績表（2010-11 UEFA CL 11試合0得点）。12試合は**自分で数えた**（グループ6＋決勝トーナメント1回戦2＋準々決勝2＋準決勝2）。UEFA の出場記録そのものは未確認（Wikipedia 由来）。
# - 病名・部位は一次情報の言葉のまま：「右太ももの腱が切れる大けが」（2014年2月。スポニチ 2020）、「重度の炎症を起こしていた右膝の膝蓋腱」「2015年6月に手術」（REAL SPORTS・スポニチ）、「2020年2月のプレシーズンマッチで右足を負傷」（スポニチ）。小さく見せる言い方・煽る言い方はしない。
#
# **数字の出どころ（読んだもの）**
# - REAL SPORTS 2020-08-26（藤江直人）：引退会見（8/24）とセレモニー（8/23）の本人の言葉（日本語・原文）、梅田和男監督の言葉、2009年の本人の言葉（SLAM DUNK）、右サイドバックへの転向（高3になる春）。
# - スポニチ 2020-08-21：引退発表の記事（17歳11か月のクラブ史上最年少得点、2014年W杯の本人の言葉、2015年6月の右膝手術）。
# - JFA 2020-09-13：選手歴・代表歴（74試合2得点、W杯2010・2014、コンフェデ2013、アジアカップ2011）、「シャルケのUEFAチャンピオンズリーグベスト4進出に貢献」の技術委員長コメント。
# - Football ZONE 2020-09-17：8月に引退した内田が U-19 のロールモデルコーチとして合宿に参加。
# - 日本語版・英語版・ドイツ語版 Wikipedia「内田篤人」「Atsuto Uchida」：クラブ別の成績表、シャルケでの経過、タイトル、ベストイレブン、2013-03-09 のルール・ダービー（2アシスト・2対1）。
# - 英語版 Wikipedia「2010–11 UEFA Champions League knockout phase」：準々決勝・準決勝の日付・会場・スコア・得点者。ドイツ語版 Wikipedia「FC Schalke 04」：クラブ初のCL準決勝、2010-11 のリーグ戦は14位。
# - 日本語版 Wikipedia「長友佑都」：準々決勝でCL初の日本人対決。
# - 検索エンジンのAI要約は使っていない。ブラウザ操作の道具は使っていない（requests と WebFetch のみ）。Transfermarkt・FotMob は見ていない。
#
# **入れなかったもの**：移籍金（日本語版は「推定1億5000万円」、英語版は「130万ユーロ」と食い違うため）・年俸・家族・結婚・テレビ出演・CM・ポケモン映画・モンスターハンター・2011-03-12 のメッセージシャツ（Wikipedia のみ、文面も版ごとに違う）。
# **日本語名・読みで怪しいもの**：内田篤人・函南町・清水東・鹿島アントラーズ・シャルケ・ウニオン・ベルリン・ブンデスリーガ・ポカール・インテル・ミラノ・ゲルゼンキルヒェン・スタンコビッチ・ミリート・マティプ・エドゥ・ラウル・
#   ラノッキア・ヘーヴェデス・モッタ・ルーニー・ドルトムント・ルール・ダービー・ファルファン・ヘルト・梅田和男・膝蓋腱・ザルツブルク・犬飼智也・三竿健斗・狩野倫久・清水東高・宮城リョータ。
# 本人の言葉は：①REAL SPORTS（引退会見・セレモニー・2009年・日本語原文）②スポニチ 2020-08-21（2014年W杯・日本語原文）。ほかの人の言葉：梅田和男（REAL SPORTS）。
