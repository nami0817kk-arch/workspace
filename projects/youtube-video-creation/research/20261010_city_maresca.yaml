# 取材メモ（10/10 題材 city_maresca、型は news、プレミア枠。**ショートだけ出す**）。
#   材料の控えは research/raw/20261010_city_maresca_material.md。
# **マレスカはマンチェスター・シティの監督**（2026-06-29 就任、グアルディオラの後任、3年契約）。
#   チェルシーは 2024-07-01〜2026-01-01 の前職で、いまのチェルシーの監督はシャビ・アロンソ。
#   ここを取り違えると「ライバルの監督の感想」になってしまう。この本は**当事者クラブの監督の弁明**。
# 事実の土台（判定の中身・一次情報・控訴の期限）は **city_carrick の本に置いた**。この本では繰り返さない。
#   ここで言う土台は「9月29日に財務の告発が認められた」「10月1日に控訴した」の2つだけ。
# **件数は言わない**（判断の本文は「100を超える」だけ）。当たった媒体は全部114件と書いているが、一次情報には無い。
# **処分の見通しへ流さない**。3部の発言は本人の言葉として引くだけで、降格の話にしない。
# 発言は Sky・ESPN・football365 の原文から。移籍情報の記者の投稿にある4行
#   （大文字の強調つきの上訴の1行・「我々は皆を信頼している」・「私はいたい場所にいる」・「とても誇りだ」）は
#   3社の原文と字面が違うか見つからないので使わない。
#   3部の発言は football365 の短い形（Pulse Sports の長い形は加工の疑いがあるので採らない）。
#   ESPN の「三冠の季」の引用は本文が途中で切れているので、推測で補わず使わない。
# **「オーナーが確信している」はマレスカの見立て**（I think they are convinced）。クラブの発表ではない。台本で主語を取り違えない。
# **会見の場所は書かれていない**ので「試合前の記者会見で」とだけ言う。媒体名は画面にも読み上げにも出さない。
# 写真：01＝Commons（CC BY-SA 4.0 / Oscar0123、2024年。前職のチェルシー時代だが、縦で顔が大きいのはこれだけ。
#   ショートの縦に使う）、03＝記事の og:image（シティのタッチライン、横1296。冒頭とサムネ）、
#   trophy/01＝Commons（CC BY-SA 4.0 / Timfilbert、2024年。レスターで2部のトロフィーを掲げた1枚）。
# ネットの反応は集めていない（この題材で実在する投稿を当たっていないため、作らない）。
