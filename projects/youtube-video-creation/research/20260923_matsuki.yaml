  topic: 松木玖生
  title: '松木玖生、日本代表に初招集。「なんでウイングやってるんだ」に本人が返した言葉'
  hook: サウサンプトンでも代表でも、いま立っているのは右のサイドです。
  question: 右サイドという場所を、本人はどう捉えているのか
short_title: 松木玖生「そこが今の自分の主戦場」
thumbnail:
  photo: assets/images/20260923_matsuki_sk/02.jpg
  line1: なんでウイングやってるんだ
  line2: 本人が呼んだ場所は
sections:
  - id: what
    heading: 何があったか
    tier: 報道
    telop: 青森山田の高校3冠から、サウサンプトンを経て日本代表へ
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - 青森山田で高校3冠、FC東京では1年目から主力だった松木玖生が、初めて日本代表に呼ばれました。
      - 本職は中盤。FC東京では真ん中で、攻守に効く選手でした。
      - 2024年の夏にサウサンプトンへ移り、1年目はトルコのギョズテペへ期限付きで出ています。
      - 去年サウサンプトンに戻り、主力になったのは今年に入ってから。
      - 代表の練習初日、松木が立ったのは**右のウイングバック**でした。
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260923/2207963.html
      - https://web.gekisaka.jp/news/japan/detail/?459489-459489-fl
  - id: said
    main: true
    heading: 言ったこと
    tier: 報道
    telop: 「そこが今の自分の主戦場」
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - text: '本職は中盤の松木玖生。代表の練習初日に立ったのは、右のサイドでした。'
        short_only: true
      - voice: 松木玖生
        text: 今、サウサンプトンのサッカーを見ている人は分かると思うんですけど、
      - voice: 松木玖生
        text: 今季はあの役割を担うことがすごく多いんです。
      - voice: 松木玖生
        text: 周りの人は『なんでウイングやってるんだ』と言うかもしれないですけど、
      - voice: 松木玖生
        text: '**そこが今の自分の主戦場。**'
      - voice: 松木玖生
        text: そこでやれているんで、いいイメージでできるかなと思います
      - voice: 松木玖生
        text: 自分の特徴は1対1のところであったり、
      - voice: 松木玖生
        text: そういうシーンが多く見られると思う。
      - voice: 松木玖生
        text: そこでボールを奪い切ることだったり、
      - voice: 松木玖生
        text: 攻撃につなげることを意識してやっていければいい
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260923/2207963.html
      - https://web.gekisaka.jp/news/japan/detail/?459489-459489-fl
  - id: days
    heading: 出られなかった日々
    tier: 報道
    telop: 「難しい2年でしたけど、それが今に生きている」
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - サウサンプトンで試合に出られなかった時期のことも、自分から話しています。
      - voice: 松木玖生
        text: この2年間は本当にいろいろな経験をしたなというのが一番ですね。
      - voice: 松木玖生
        text: いろいろなポジションをやりましたし、
      - voice: 松木玖生
        text: サウサンプトンで出られない時期もあった。
      - voice: 松木玖生
        text: それを自分のエネルギーに変えられたからこそ今がある。
      - voice: 松木玖生
        text: 難しい2年でしたけど、それが今に生きていると思います
    sources:
      - https://www.soccer-king.jp/news/japan/national/20260923/2207963.html
      - https://web.gekisaka.jp/news/japan/detail/?459489-459489-fl
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: これを読んだ人が書いていたこと
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - voice: ネット民
        text: え、何、松木玖生はウイングバックなの？しかも堂安律と同じで逆足の右サイド
      - voice: ネット民
        text: 右じゃないだろ...
      - voice: ネット民
        text: 松木の良いところは　どのポジションに使っても最適解を出せる所　フィジカル的な話は分かりません
      - voice: ネット民
        text: 松木はずっと素晴らしい。先発の一番目に名前が書かれるべき選手だ
      - voice: ネット民
        text: 松木の日本代表招集、おめでとう。正直に言うと、今季の彼にはものすごく驚かされている。もともとかなり堅実な選手だったけど、選手の良さを引き出す監督のもとで、もう一段上がった
      - voice: ネット民
        text: 無理して松木を使う必要はないでしょ　、、まだ、実力に見合っていないと思いますが、、、
      - voice: ネット民
        text: 異国でのつらい体験・逆境をも、前を向く燃料に変える男なんだね。 強いメンタル・オープンマインドは、サムライブルー、 A代表向き。
      - voice: ネット民
        text: マルコスジョレンテみたいな化け方しないかなあ
      - voice: ネット民
        text: 松木にはチャントが必要だ！
      - voice: ネット民
        text: 松木玖生の代表ユニ買うか悩む
      - voice: ネット民
        text: サウサンプトンから日本代表へ。あいつにとって最高の瞬間だ。今季の入りを見れば当然の招集。さあ、何ができるか見せてこい、クリュウ
        short_voice: true
