    tier: 報道
    telop: シュレーダーSD「エルヴェディの穴を、埋められなかった」
    say:
      - text: ボルシアMGのシュレーダーSDは、数日前、ドイツ紙ビルトに板倉滉をかばう言葉を残していました。
        image: assets/images/20261124_itakura_sd_criticism/pair/01.jpg
      - voice: シュレーダーSD
        text: 彼はいい選手だし、これからもそうだ。
      - voice: シュレーダーSD
        text: 絶対に、見捨てたりはしない。
        cont: true
      - text: 板倉は今季、アヤックスからボルシアMGに戻ってきた選手。
        image: assets/images/20261124_itakura_sd_criticism/03_w.jpg
      - text: チームを離れたスイス代表、エルヴェディ。その守備の柱の代わりとして、期待されていました。
      - text: ところが22日、ドイツのテレビ番組でSDが口にしたのは、こんな言葉でした。
        image: assets/images/20261124_itakura_sd_criticism/pair/01.jpg
      - voice: シュレーダーSD
        text: 板倉は、エルヴェディの穴を埋められなかった。
        emph: true
      - voice: シュレーダーSD
        text: ここまでは、期待に応えていない。
        cont: true
      - voice: シュレーダーSD
        text: 本人も、それは分かっています。
        cont: true
      - voice: シュレーダーSD
        text: 彼とは、一緒に取り組んでいくしかありません。
        cont: true
      - text: 今月のハンブルク戦では板倉が退場して敗れ、チームはいま、リーグの一番下にいます。
        short_only: true
        image: assets/images/20261124_itakura_sd_criticism/01_w.jpg
