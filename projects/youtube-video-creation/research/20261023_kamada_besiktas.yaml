# 日付・場所: 現地10月22日（木）UEFAヨーロッパリーグ リーグフェーズ第3節。ベシクタシュのホーム（ゲキサカ「Tüpraş Stadyumu」／日刊「ボーダフォン・アリーナ」と表記が割れている。台本では会場名を言わない）。
