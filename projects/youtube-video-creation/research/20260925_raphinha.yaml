    tier: 未確認
    telop: 「10番似合ってる」と「フルで使われてて鬱」
    narrator: キャスター
    say:
      - voice: ネット民
        text: まじかよラフィーニャ10番かよ。張り切ってまうやんけ、なんしてんねんアンチェロッティ
        image: assets/images/20260925_raphinha2/01.jpg
      - voice: ネット民
        text: ラフィーニャ10番いいね似合ってる
      - voice: ネット民
        text: ラフィーニャは素晴らしい選手！　セレソンの10番を背負うのも納得！　ただ、個人的にはヴィニシウスに背負って欲しかった
      - voice: ネット民
        text: ラフィーニャみたいなタイプに10番は似合わない
      - voice: ネット民
        text: トップ下でもアシストをつけてしまう男ラフィーニャ
      - voice: ネット民
        text: お願いです。ハフィーニャを過重労働させないでください。しかし、交代したら負けてたかもしれないと思うとなんとも…
      - voice: ネット民
        text: なぜラフィーニャ叩かれてるのか分からん。叩くならトップ下で起用し9番やらせなかったアンチェロッティやろ
      - voice: ネット民
        text: どう考えてもハフィーニャ以外のやつらのカスっぷりのほうが酷かったわ
      - voice: ネット民
        text: セレソン全部ダメ。相手が豪州。牧草地で豪州戦。牧草地で豪州相手にひどい試合、しかも情けないW杯の後に
      - voice: ネット民
        text: ブラジル最大の失敗は、ラフィーニャでなくヴィニ中心にチームを作ったこと
      - voice: ネット民
        text: とりあえずラフィーニャ怪我しなくてよかった
        short_voice: true
