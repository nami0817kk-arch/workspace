    heading: ネットの反応
    tier: 未確認
    telop: 「10番似合う」と、ネイマール抜きで作れなかった代表への注文
    narrator: キャスター
    say:
      - voice: ネット民
        text: まじかよラフィーニャ10番かよ。張り切ってまうやんけ
      - voice: ネット民
        text: ららら、ラフィーニャ？！　新10番？！　マジですか？！
      - voice: ネット民
        text: ラフィーニャが次の10番とか激あつ
      - voice: ネット民
        text: セレソンの10番はラフィーニャしかいない！
      - voice: ネット民
        text: ラフィーニャがネイマールから10番引き継いでくれるなんて。10番似合う！
      - voice: ネット民
        text: うおおお！！　ラフィーニャがセレソンの10番！　こんな日が来るなんて！
      - voice: ネット民
        text: ラフィーニャが次の10番か。代表で無茶しないように
      - voice: ネット民
        text: ブラジルはハフィニャとジェズスで4年粘りたい
      - voice: ネット民
        text: そもそもネイマールはW杯まで2年以上もセレソンを離れていた。ネイマールなしのセレソンをしっかり作れずに、今更新しい10番とかいう論点がおかしいわ
      - voice: ネット民
        text: 正直今のバルセロナ強すぎてラリーガで1強だから、クレとしてはオモロでしかない。ラフィーニャも調子乗ってるし。バロンドールに選ばれなかったのは謎
