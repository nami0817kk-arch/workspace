sections:
  - id: what
    heading: 9月24日の発表
    tier: 報道
    telop: ブラジル連盟が背番号を発表。10番はラフィーニャ
    narrator: キャスター
    card:
      type: table
      title: 新しい背番号（オーストラリア戦・インド戦）
      columns: ['', '']
      rows:
        - [10, ラフィーニャ]
        - [11, エステヴァン]
        - [9, エンドリッキ]
        - [7, ヴィニシウス]
        - [1, ウーゴ・ソウザ]
    say:
      - 9月24日、ブラジルサッカー連盟が、オーストラリア戦とインド戦の背番号を発表しました。
      - "**10番は、ラフィーニャ**。ネイマールが着けてきた番号です。"
      - 11番はエステヴァン、9番はエンドリッキ、7番はヴィニシウス。
    sources:
      - https://www.cnnbrasil.com.br/esportes/futebol/selecao-brasileira/quem-e-o-novo-camisa-10-da-selecao-brasileira-confira-a-numeracao-completa/
      - https://www.lance.com.br/selecao-brasileira/nem-vini-jr-nem-estevao-saiba-que-e-o-novo-camisa-10-da-selecao.html
  - id: neymar
    heading: 脱いだ人の言葉
    tier: 報道
    telop: ネイマールは7月28日に代表を退くと言っていた
    narrator: キャスター
    say:
      - ネイマールは、ワールドカップのベスト16で敗れたあと、代表を退くことを口にしていました。
      - 7月28日、サントスでの試合のあと、はっきり言っています。
      - voice: ネイマールJr
        text: 代表での私の時間はもう過ぎた。歴史を作った。とても幸せだった。血を、人生を捧げた
      - voice: ネイマールJr
        text: いつも黄色のシャツのために戦ってきた。でも、もう望んでいないと思う
      - 代表で**130試合80得点**。その番号を、ラフィーニャが引き継ぎました。
    sources:
      - https://exame.com/esporte/neymar-confirma-aposentadoria-da-selecao-brasileira-apos-copa-do-mundo-de-2026/
  - id: rodri
    main: true
    heading: 同じ日に、ロドリが言ったこと
    tier: 報道
    telop: 「ラフィーニャが30人の候補に入っていないのは理解しがたい」
    narrator: キャスター
    say:
      - text: 'ブラジル代表の新しい背番号が発表され、ラフィーニャがネイマールの10番を引き継ぎました。同じ週、同僚のロドリが言ったことです。'
        short_only: true
      - 同じ週、バルセロナの同僚ロドリがスペインのラジオで、バロンドールの話をしました。30人の候補に、ラフィーニャは入っていません。
      - voice: ロドリ
        text: ペドリとラフィーニャは、疑いなくバロンドールにノミネートされるべきだ
      - voice: ロドリ
        text: ペドリは世界最高の選手の一人で、ラフィーニャは私を最も驚かせた選手だ
      - voice: ロドリ
        text: ラフィーニャが30人の候補に入っていないのは、理解しがたい
      - 前日の会見で、ヴィニシウスと並べて聞かれたアンチェロッティ監督は。
      - voice: アンチェロッティ
        text: 2人の状況は違う。ラフィーニャは自分のものではなかったポジションで素晴らしいことをしている。今はもう彼のポジションのようだ
      - voice: アンチェロッティ
        text: ヴィニは最高の状態ではないかもしれないが、2人とも将来の中心選手になるという確信がある
    sources:
      - https://www.cope.es/programas/el-partidazo-de-cope/entrevistas-de-juanma-castano/noticias/rodri-partidazo-cope-real-madrid-mostro-interes-primer-momento-20260923_3442533.html
      - https://www.cnnbrasil.com.br/esportes/futebol/selecao-brasileira/ancelotti-defende-vinicius-jr-e-exalta-momento-de-raphinha-espetacular/
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「10番似合う」と、ネイマール抜きで作れなかった代表への注文
    narrator: キャスター
    say:
      - voice: ネット民
        text: まじかよラフィーニャ10番かよ。張り切ってまうやんけ
      - voice: ネット民
        text: ららら、ラフィーニャ？！　新10番？！　マジですか？！
      - voice: ネット民
        text: ラフィーニャが次の10番とか激あつ
      - voice: ネット民
        text: セレソンの10番はラフィーニャしかいない！
      - voice: ネット民
        text: ラフィーニャがネイマールから10番引き継いでくれるなんて。10番似合う！
      - voice: ネット民
        text: うおおお！！　ラフィーニャがセレソンの10番！　こんな日が来るなんて！
      - voice: ネット民
        text: ラフィーニャが次の10番か。代表で無茶しないように
      - voice: ネット民
        text: ブラジルはハフィニャとジェズスで4年粘りたい
      - voice: ネット民
        text: そもそもネイマールはW杯まで2年以上もセレソンを離れていた。ネイマールなしのセレソンをしっかり作れずに、今更新しい10番とかいう論点がおかしいわ
      - voice: ネット民
        text: 正直今のバルセロナ強すぎてラリーガで1強だから、クレとしてはオモロでしかない。ラフィーニャも調子乗ってるし。バロンドールに選ばれなかったのは謎
        short_voice: true
