    heading: 脱いだ人の言葉
    tier: 報道
    telop: ネイマールは7月28日に代表を退くと言っていた
    narrator: キャスター
    say:
      - text: 'ブラジル代表の新しい背番号が発表され、ネイマールの10番をラフィーニャが引き継ぎました。'
        short_only: true
      - ネイマールは、ワールドカップのベスト16で敗れたあと、代表を退くことを口にしていました。
      - 7月28日、サントスでの試合のあと、はっきり言っています。
      - voice: ネイマールJr
        text: 代表での私の時間はもう過ぎた。歴史を作った。とても幸せだった。血を、人生を捧げた
      - voice: ネイマールJr
        text: いつも黄色のシャツのために戦ってきた。でも、もう望んでいないと思う
      - 代表で**130試合80得点**。その番号を、ラフィーニャが引き継ぎました。
    sources:
      - https://exame.com/esporte/neymar-confirma-aposentadoria-da-selecao-brasileira-apos-copa-do-mundo-de-2026/
