  topic: レアル・マドリード
  title: レアル・マドリード、無冠の季に史上最高の収入。その稼ぎが出ていく先は
  question: 世界でいちばん稼ぐクラブの収入は、どこへ出ていくのか
  lead: 1日に入ってくるお金が、およそ335万ユーロ。
  hook: 入ってきた分の行き先を、決算から追います。
  takeaway: レアル・マドリードは2025-26をリーグ2位・チャンピオンズリーグはベスト8・国王杯はベスト16の無冠で終えながら、営業収入は12億2130万ユーロでスポーツのクラブとして史上最高になった。前の季の11億8470万ユーロから増えたのはスタジアム3620万・マーケティング3280万・国内の放映権480万ユーロで、減ったのは親善試合と国際大会の3790万ユーロ。人件費は収入の46%で、欧州の連盟が2025-26から敷いた70%の上限に対して、選手団の費用6億1800万ユーロは収入の50.6%、上限までは2億3690万ユーロの余白がある。いちばん重いのはベルナベウで、改修に積んだ14億770万ユーロは1季の収入の1.15季ぶん、スタジアムが生む分だけなら3.9季ぶん。1試合あたりに直したスタジアム収入1910万ユーロは改修前の2.07倍。国と社会保険に納めた3億5480万ユーロは税引後の利益の13.5倍で、手元に残るのは収入の2.2%。借入の残高11億840万ユーロは2025-26に減った2330万ユーロのペースなら約48年かかり、全体の金利は公表されていない。次の数字は11月の総会で出る
