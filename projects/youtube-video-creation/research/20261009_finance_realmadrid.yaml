# クラブの財政：レアル・マドリード（10/9 金、シリーズ「クラブの財政」）。材料の控えは research/raw/20261009_finance_realmadrid_material.md。
# 軸は **UEFA のスクワッド・コスト・ルール（70%）とクラブ自身が出している比率**。
#   バルサ回（10/3）の軸「ラ・リーガの選手に使える上限」は主役にしない（この回では一度も出さない）。
#   バルサ回の「稼いでいるのに使えない」という語り口も、アルテタ回（10/8）の「◯倍になった」という締めも使わない。
#   この回は「稼ぎは世界の頂点、ただしその分がどこへ出ていくか」で通す。デロイトの順位表はバルサ回で出したので使わない。
# 数字はすべてクラブ自身の公表（realmadrid.com 2026-07-28 の発表と ANEXO の PDF、透明性のページの Budget 2025-2026 PDF）。
#   2024-25 の4本立ての実績（千ユーロ）→ 2025-26 の3本立て（363／319／539）への組み替えと増減は材料の §2-2 で検算済み
#   （326,8＋351,7＋506,2＝1.184,7 がクラブの表と一致）。TV と親善・国際大会への割り振り（+4,8／−37,9）は
#   ANEXO の地の文の増減率（+3%／−20%）を 2024-25 の実績に当てたこちらの計算。板には合算の内訳として出さず、語りで言う。
# **材料で「確かめられなかった」ものは使っていない**：デロイトの正確な総額／2025-26 の人件費の実額（46% の比率だけ言う。
#   562 は予算の数字なので台本には出さない）／借入 11億7000万ユーロ全体の金利と最終返済年（「公表されていません」と断る）／
#   2026-27 の予算（11月の総会で出る、とだけ言う）／本拠地の公式戦の総数（25 は使わない。リーグのホーム19試合だけで割る）。
# 単位：**板はすべて百万ユーロ**（line・waterfall・calc・表）。語りは億／万ユーロで通し、基礎DATAの1行で
#   「12億2130万ユーロ＝百万ユーロで1221.3」と一度だけ橋をかける。円は convert の板だけ（1ユーロ＝177円。ECB 2026-10-07 の 176,85 を丸めた値）。
# 成績（リーグ2位・CL ベスト8・国王杯ベスト16）は Wikipedia の二次情報なので、順位と敗退の段階までにとどめた。
# ネットの反応は置いていない（ブラウザの道具を使っていないので集めていない。バルサ回と同じ）。本人の言葉も引いていない。
# アルファベットは読み上げに出さない（UEFA → 「欧州の連盟」、VIP席 → 「特別席」。板の題にだけ UEFA と書いてある）。
# 写真は手元の2枚だけ：assets/backgrounds/stadium_レアルマドリード.png（外観、1920x1080）と _in.png（内部、1920x1080）。
#   **顔が入っていないので板が顔にかからない**（アルテタ回で顔の76%が隠れた件を踏まない）。入れ替えは1本1回（冒頭=外観 → 基礎DATAの1行目から内部）。
#   クレジットは assets/backgrounds/credits.json（CC の表示は概要欄に出る）。
# サムネは構図 number（直近はアルテタ回が face、バルサ回が classic）。横に広い写真＋伏せた数字。
# 本のあいだの重なり（variety）で消した言い回し：「およそ1.7倍になりました」（アルテタ回）、
#   「10億ユーロを初めて超えた」（バルサ回の『初めて10億ユーロを突破』）、「◯◯000万ユーロでした」（同）、
#   「もう1つあります」（シティ回）。残るのは数字の頭だけが重なる『12億』『14億』の2件（別の事実）。
