# 取材メモ（2026年10月20日）トッテナムのクルゼフスキ、526日ぶりに復帰。妻の手紙（ニュースのショート。見せ方 Y＝手紙の一言から始める）
# ケガの話なので、敬意を持った言い方にする。病名・期間は出典に書いてある範囲だけ（推測しない）。選手を小さく見せない。
# 取材: 2026-10-20。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261020_kulu_dm.txt（デイリー・メール）・_kulu_sky.txt（スカイの試合記事）・_spurs_cov_summary.json（ESPN）。
#   ・デイリー・メール マット・バーロウ記者（10/7 17:00 公開・10/19 10:25 更新）「The untold story of Dejan Kulusevski's 526 days of hell …」— 題材の元。
#       手紙は妻エルディナ（元ボスニア代表）がスウェーデン語で書き、全体練習に戻った日（9月1日）にSNSへ出した。記事が引いたのは**英語訳**。
#       英訳:'They said you might never play again' / 'They obviously don't know who you are.'（記事の地の文は「ケガから477日後の9月1日」）。
#       手紙の続き（英訳）: 'This is a story I will tell our daughters many times'／'How their father was told that he might never play football again – and yet refused to let anyone else write the end of his story.'
#       → **原文はスウェーデン語。読んだのは記事の英訳。台本の日本語は、その英訳からの自訳**（台本の中で「こちらで訳したもの」と断る）。手紙そのもの（SNS）は読めていない。
#   ・スカイスポーツ試合記事（10/19 22:00Z）「Tottenham 3-1 Coventry: Dejan Kulusevski returns to action as Spurs secure first Premier League win of the season」—
#       『85分、ファンの人気者クルゼフスキがベンチから復帰』『526日、膝のセットバック（setback）で離脱』（タイムラインは86分）。**出場の分は 85/86/87（ESPN）で食い違うので台本は分数を言わない（終盤）**。
#       今季のリーグ戦初勝利。トッテナムは勝ち点6で16位（コベントリーと同点、得失点差で上）。ESPN の試合 summary（401879257）で 3-1・87分にクドゥスと交代を確認。
#   ・デ・ゼルビ監督の『ファンのためにやった』は、スカイのライブブログの見出しだけで本文は読めていない → 使わない。
# 本人（クルゼフスキ）の言葉: 今回の復帰についての本人の言葉は、読めた記事には無い。**妻の手紙を「妻の言葉」として使い、本人の言葉は作らない**（台本で「本人の言葉ではない」と断る）。
#   → short_hook_quote は妻の手紙の一節（voice: エルディナ）。女性の声にするには config の voice_female に名前が要る（編集禁止のため報告）。
# ケガの病名・期間（デイリー・メールの範囲だけ）:
#   ・2024-25シーズンのパレス戦（ポステコグルー監督の終わりごろ。DMの『last season』は2025-26の降格争いのこと）で膝のお皿（kneecap）を痛めた。クラブは『膝のお皿（patella）のケガ』という基本の情報以外は確認していない。
#   ・手術。2025年のヨーロッパリーグ決勝には松葉づえと装具で。復帰の当初の見込みは去年12月 → 球を使う段階で膝に痛み → 1月に注射の治療 → 3月に本人が『小さな処置（a small intervention）』と呼ぶ関節の清掃。
#   ・スウェーデン代表のチーム医師ヴェルナー:『軟骨のケガはやっかいで、治しにくい。ましてストレスのかかる場所だ。まだ負荷に耐えるほど治っていない』（記事の引用）。記事の書き手は軟骨の損傷の可能性を指摘するが、病名の確定ではない → 台本はこの医師の言葉の範囲だけ、病名は言わない。
#   ・ワールドカップに出る機会を逃した。代表は45試合。その間にスパーズは監督4人・キャプテン3人・会長2人が入れ替わった（記事）。台本では使わない。
#   ・9月1日＝ケガから477日目、全体練習に戻った日。復帰の試合で526日（スカイ）。
# 自分で数えた比べ（見立て）: 526−477＝49日（全体練習に戻ってから試合に出るまで）。526日≒1年5か月あまり（526÷365＝1.44年）。デイリー・メールの『慎重さが合言葉』（Caution remains the watchword）をそのまま引く。
# 確度: 試合・復帰は 報道（スカイ・ESPN で一致）。手紙・ケガの経過は 報道（デイリー・メール単独。英訳からの自訳）。
# 反応: 0件。作らない。approve は --no-voices で。
