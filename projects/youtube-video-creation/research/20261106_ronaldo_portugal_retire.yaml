# 取材: 2026-11-06。python requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 出典で確かめたこと:
#   ・ESPN 2026-11-05 17:53Z（now.core.api.espn.com/v1/sports/news/49266866 で本文を全部読んだ）:
#       11/5（木）に Instagram の動画で代表引退を発表。23年。41歳。代表234試合146点（男子の最多得点・最多出場）。
#       声明（英訳）: "the day has come to hand back the number seven shirt of the national team that belongs to us all. I never felt it was exclusively mine"
#         "It was not an easy decision, because there are decisions that are not made solely with the head; they are also made with the heart."
#         "Goals come and go, trophies end up in museums, and records are eventually broken. But there is one thing that time can never erase: the place we hold in people's hearts."
#         "No captain walks alone and you're all part of my story."
#       前の代表期間に合宿を離れ、協会から30日の出場停止。出場時間をめぐってジェズス監督と衝突（監督が約束を破ったと非難）。チームメイトには謝ったが、監督には謝っていない。
#       翌日（11/6）にジェズス監督が、デンマーク・ウェールズとのネーションズリーグの招集を発表する。
#       クラブ（アル・ナスル）では続ける。通算985点（1000点まで15）。
#       記事は「10月4日のノルウェー戦で18年ぶりにベンチのまま」と書くが、ESPN の試合データでは、ロナウドがベンチのまま出なかったのは 9/27 のノルウェー戦（Ullevaal、2-1）。10/1・10/4 は登録外。→ 日付が食い違うので、この話は台本に入れない。
#   ・ESPN 試合データ（uefa.nations summary 401861044）: 2026-09-24 ポルトガル 1-0 ウェールズ（エスタディオ・ジョゼ・アルヴァラーデ）。ロナウドは先発し途中交代。これが代表の最後の試合。
#   ・A Bola 2026-11-05 14:02「Jorge Jesus quebra o silêncio sobre o adeus de Cristiano Ronaldo」（Canal 11 が撮った言葉。ポルトガル語の原文を読んだ）:
#       «Tudo isto é uma decisão dele. Nós já tivemos a oportunidade de falar antes da primeira convocatória sobre isto. Eu pedi a ele para continuar, para continuar comigo porque precisava que ele estivesse ao pé de mim, mas tenho de aceitar a decisão dele»
#       «Ele vai estar sempre no coração dos portugueses, na Seleção, e não há volta a dar porque ele será sempre uma referência do futebol português.»
#       → 台本の言葉は、この原文を私が日本語にしたもの。
#   ・Guardian（Jonathan Wilson の論評）: 合宿離脱の処分は255ユーロの罰金と30日の出場停止。→ 論評なので使わない。
# 自分で数えたもの: 通算985点のうち代表は146点。985 ÷ 146 ＝ 約6.7 → 約7点に1点が代表のゴール。代表は234試合で146点 → 1試合あたり約0.62点。
# 前の本との重なり: 20261002_ronaldo_walkout（合宿離脱）／20261008_ronaldo_statement（「監督は約束を破った」）／20261003_portugal_without／20261030_ronaldo_hattrick_985（985点）。
#   → 今回の初出: 代表引退そのもの・引退の声明・ジェズス監督の「残ってほしいと頼んだ」。離脱の経緯は1行だけ。985点はクラブの話としてではなく「7点に1点」の比べで使う。
# 本人の言葉: あり（Instagram の声明）。Y。
# 反応: 0件（作らない）。
