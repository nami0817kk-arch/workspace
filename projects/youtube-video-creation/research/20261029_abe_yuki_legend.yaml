# 先に宮本恒靖で作ったが、使える写真が最大960px（本編で2〜3倍、ショートで最大5.3倍に引き伸ばし）しか無く、調整役の指示で阿部勇樹に替えた。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は 英語版/日本語版 Wikipedia の成績表と試合記録、Goal.com・Jリーグ公式、自分で足した値だけ。
# **私生活（家族・レスターを離れた理由）は入れない。女子サッカーは入れない**。Jリーグは経歴の事実だけで、サムネの主役にしない。
#
# **重なりの確認（2026-10-29）**：scripts/・research/covered.yaml・research/posted.json を「阿部勇樹」で grep → 0件。
# **引退の確認**：Goal.com 2021-11-14 20:32「浦和レッズの元日本代表MF阿部勇樹が今季現役引退を発表『本当に幸せなサッカー人生でした』」（浦和の公式YouTubeの会見を伝える）。
#   Jリーグ公式 2022-09-07「阿部 勇樹氏の引退試合を開催【浦和】」の本人コメント「2021年シーズンで現役を引退しましたが」。英語版も「announced that he would retire from football at the end of the 2021 season」。→ **現役ではない**。
# **いまの立場**：日本語版「2022年シーズンより浦和レッズユースのコーチに就任」（2022-01-12 発表）。2026年のいまの役職は確かめられなかったので、台本は「2022年に」と時点で言う。
# **日本との接点**：全体が日本代表・W杯の話。基礎DATAの次に代表の節を置いた。
#
# **数字の出どころ**
# - 生年月日 1981-09-06 千葉県市川市（英語版・日本語版 infobox）→ 2026-10-29 で45歳、2010-06-14 で28歳、2010-08-26 で28歳。Goal.com「2021年9月に40歳の誕生日」と合う。
# - 日本代表 53試合3得点（2005〜2011）：英語版の年別 2005=5・2006=8(1)・2007=11(1)・2008=9・2009=8(1)・2010=9・2011=3。Goal.com「日本代表としても53キャップ」。
#   区切りは自分で足した：2005〜2009 = 41試合3得点、2010〜2011 = 12試合0得点。
#   デビュー 2005-01-29 カザフスタン戦（英語版）。2007年アジアカップ準決勝 7月25日 ハノイ サウジアラビアに2対3、阿部が得点（英語版の得点一覧・日本語版の出場一覧）。
# - 2010年W杯：日本語版「W杯本戦では終始アンカーとして全試合にスタメン出場。決勝トーナメント1回戦パラグアイ戦で中村憲剛と途中交代するまでフル出場を続けた」。
#   Goal.com「2010年の南アフリカ・ワールドカップでは4試合に出場」。結果はカメルーン1対0・オランダ0対1・デンマーク3対1・パラグアイ0対0（PK戦3対5）（英語版 2010 Group E・knockout stage、10/28 の松井の回で確かめた値と同じ）。交代の分は確かめられなかったので言わない。
#   それまでセンターバックで使われることが多かった（日本語版）。
# - クラブ（リーグ戦、英語版 infobox）：ジェフ千葉 214試合36得点（1998〜2006）、浦和 120試合14得点（2007〜2010）、レスター 52試合2得点（2010〜2012）、浦和 256試合25得点（2012〜2021）。浦和は合計 376試合39得点（自分で足した）。
#   J1初出場 1998-08-05 ガンバ戦、16歳333日で当時のJ1最年少（日本語版）。2003年にオシム監督が21歳で主将に（日本語版）。
#   レスター：2010-08-26 に3年契約、デビュー 2010-09-14 カーディフ戦 2対1、初得点 2011-05-07 イプスウィッチ戦 4対2（英語版）。当時のレスターはイングランド2部。
# - 引退の言葉（Goal.com 2021-11-14）「本当に幸せなサッカー人生でした。」「その差が僕にとって引退する合図なのかなと考えて決断させていただきました」。
#
# **入れなかったもの**：家族、レスター退団の理由、移籍金の推定額、「日本代表のMVPに挙げた」（日本語版だけ）、J1の連続出場などJリーグの記録、パラグアイ戦の交代の分。
# **写真**：Commons の Category:Yuki Abe から3枚（どれも2011年のレスター時代）。11 = Yuki Abe 7.05.2011.jpg（Yuya Shino、CC BY-SA 3.0、1322x1326）、
#   12 = Yuki Abe, Leicester City.jpg（Jon Candy、CC BY-SA 2.0、700x1280）、13 = Yuki Abe penalty shootout.jpg（Jon Candy、CC BY-SA 2.0、1920x1440。阿部は小さく写るので「その試合」とは言わない）。
#   代表時代・2010年W杯の写真は使えるものが無かった（行では「その試合の写真」と言わない）。代理店の写真は無し。
