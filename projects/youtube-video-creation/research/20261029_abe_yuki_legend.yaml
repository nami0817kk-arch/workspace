  say:
  - text: 元日本代表のミッドフィールダー、阿部勇樹。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: none
    short_only: true
  - text: 2010年の南アフリカ大会。阿部勇樹は28歳でした。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: none
  - text: 大会の前まで、代表では主にセンターバック。それが本番では、中盤の底に置かれます。
    card: none
    emph: true
  - text: 4人の最終ラインの前で、相手の攻めを最初に止める。それがアンカーの仕事です。
    card: none
    callword: 中盤の底
  - text: 初戦のカメルーン戦は、1対0の勝ち。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: {<<: *wccard, highlight_row: 0}
  - text: オランダ戦は0対1の負け。それでも強豪を相手に、許したのは1点だけでした。
    card: {<<: *wccard, highlight_row: 1}
  - text: デンマークには3対1で勝ち、日本は2勝1敗で決勝トーナメントへ進みます。
    card: {<<: *wccard, highlight_row: 2}
    emph: true
  - text: 決勝トーナメントの1回戦は、パラグアイと0対0。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: {<<: *wccard, highlight_row: 3}
  - text: 阿部勇樹は、中村憲剛と交代するまでピッチに立ち続けました。
    card: none
  - text: 日本はPK戦で敗れ、16強で大会を終えます。
    card: none
  - text: 4試合の失点は、合わせて2。1試合あたり0.5点に抑えました。
    card: none
    emph: true
