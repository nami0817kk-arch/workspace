  say:
  - text: 阿部勇樹の生まれは、1981年9月6日。千葉県の出身で、いま45歳です。
    image: assets/images/20261029_abe_yuki_legend/12.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: ポジションは守備的なミッドフィールダー。最終ラインにも入れる選手でした。
    card: {<<: *datacard, highlight_row: 1}
  - text: 日本代表の得点は3つ。守備の役目が多い選手としては、点も取りました。
    card: {<<: *datacard, highlight_row: 2}
  - text: 引退の発表は、2021年11月。40歳でした。
    card: {<<: *datacard, highlight_row: 5}
