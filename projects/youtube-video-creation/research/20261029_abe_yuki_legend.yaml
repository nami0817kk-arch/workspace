  say:
  - text: 阿部勇樹の代表歴は、ワールドカップの年を境に2つに分かれます。
    image: assets/images/20261029_abe_yuki_legend/13_w.jpg
    card: {<<: *jpncard, highlight_row: 3}
  - text: デビューは2005年1月、カザフスタン戦。23歳でした。
    card: {<<: *jpncard, highlight_row: 0}
  - text: 2009年までの5年で41試合。3つの得点は、すべてこの時期です。
    card: {<<: *jpncard, highlight_row: 0}
    emph: true
  - text: 2007年のアジアカップ準決勝では、サウジアラビアから1点。
    card: none
  - text: 試合は2対3の負けでした。
    card: none
  - text: このころは、主にセンターバックとしての出場でした。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: none
  - text: そして2010年。出場は9試合。そのうち4試合が、ワールドカップの本番です。
    card: {<<: *jpncard, highlight_row: 1}
