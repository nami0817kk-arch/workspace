  - text: 阿部勇樹の、数字の外にある話を。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 2003年にジェフへ来たオシム監督は、おとなしい21歳を、あえて主将にしました。
    card: {<<: *secretcard, highlight_row: 0}
  - text: 本人は当初、主将を務めるのが嫌で仕方なかったと伝えられています。
    card: none
  - text: それでも任されるうちに、フリーキックを自分で蹴り、前へ出ていくようになります。
    card: none
    emph: true
  - text: 2005年には、中盤の守りを受け持ちながら、リーグ戦で12得点。
    image: assets/images/20261029_abe_yuki_legend/11_w.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - text: 守る役目のまま点も取れる。その幅が、5年後の南アフリカにつながりました。
    card: none
