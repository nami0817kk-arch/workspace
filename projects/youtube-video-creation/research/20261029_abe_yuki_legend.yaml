  say:
  - text: 1998年8月、阿部勇樹は16歳で、Jリーグ1部のピッチに立ちます。
    image: assets/images/20261029_abe_yuki_legend/13_w.jpg
    card: {<<: *careercard, highlight_row: 0}
  - text: 当時の、いちばん若い出場の記録でした。
    card: none
  - text: 2003年、新しく来たオシム監督は、21歳の阿部勇樹を主将に指名しました。
    card: {<<: *careercard, highlight_row: 0}
    emph: true
  - text: 2007年に浦和へ移り、その年にアジアのクラブの頂点を決める大会を制します。
    card: {<<: *careercard, highlight_row: 1}
  - text: ワールドカップから2か月後の2010年8月。28歳で、イングランドへ渡りました。
    image: assets/images/20261029_abe_yuki_legend/13_w.jpg
    card: none
  - text: 行き先は、当時イングランド2部のレスター・シティ。3年の契約です。
    card: none
    callword: レスター
  - text: 2011年5月、イプスウィッチ戦で、イングランドでの初めてのゴール。
    card: none
    emph: true
  - text: チームも、4点を奪って勝ちました。
    card: none
  - text: レスターでのリーグ戦は、52試合2得点。2012年に、浦和へ戻ります。
    image: assets/images/20261029_abe_yuki_legend/13_w.jpg
    card: {<<: *careercard, highlight_row: 2}
  - text: 浦和では2017年に、その大会で2度目の優勝を味わいました。
    card: {<<: *careercard, highlight_row: 3}
