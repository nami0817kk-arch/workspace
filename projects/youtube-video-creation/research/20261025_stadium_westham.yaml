      <<: *id_oly
      highlight_row: 0
  - text: 五輪の間の収容は、8万人。
    image: assets/images/20261025_stadium_westham/04_w.jpg
    card: none
  - text: そのあとは、3分の1ほどの、2万5000から3万席に縮める計画でした。
    emph: true
    image: assets/images/20261025_stadium_westham/04_w.jpg
    card: none
  - text: 2011年2月11日、五輪公園を引き継ぐ会社が、ウェストハムを選びます。
