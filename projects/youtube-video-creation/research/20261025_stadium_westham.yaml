    card:
      <<: *id_tr
      highlight_row: 0
  - text: スロベニアのドムジャレに、3対0の勝ち。
    image: assets/images/20261025_stadium_westham/11_w.jpg
    card:
      <<: *id_tr
      highlight_row: 0
  - text: 工事が残っていて、収容は5万4000人。いまより8500人少ない数でした。
    image: assets/images/20261025_stadium_westham/11_w.jpg
    card:
      <<: *id_tr
      highlight_row: 0
  - text: 陸上のトラックは、そのまま残りました。
    emph: true
    image: assets/images/20261025_stadium_westham/02_w.jpg
    card: none
  - text: イギリスの陸上の団体が、毎年6月の終わりから7月末まで使う約束です。
    image: assets/images/20261025_stadium_westham/02_w.jpg
    card: none
  - text: 客席がピッチから遠い、という声が出ます。
    image: assets/images/20261025_stadium_westham/11_w.jpg
    card: none
  - text: 2019年4月、トラックの上を、えんじ色の覆いで隠しました。
    image: assets/images/20261025_stadium_westham/05_w.jpg
    card:
      <<: *id_tr
      highlight_row: 1
  - text: 2020年2月には、下の段に、新しいスタンドを入れる計画を出します。
    image: assets/images/20261025_stadium_westham/05_w.jpg
    card:
      <<: *id_tr
      highlight_row: 2
  - text: 多くの席が、4メートル以上、ピッチに近づきます。
    emph: true
    image: assets/images/20261025_stadium_westham/05_w.jpg
    card: none
  - text: 2022年4月6日、契約で6万人までだった収容を、引き上げると発表。
