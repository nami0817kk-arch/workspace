    image: assets/images/20261025_stadium_westham/02_w.jpg
    card: none
  - text: 2011年10月11日、決定は取り消されます。
    emph: true
    image: assets/images/20261025_stadium_westham/02_w.jpg
    card:
      <<: *id_oly
      highlight_row: 2
  - text: 競技場は公のものとして残し、借り手を探す形に、変わりました。
    image: assets/images/20261025_stadium_westham/02_w.jpg
    card: none
  - text: 翌2012年の夏、ここで五輪が開かれます。
    image: assets/images/20261025_stadium_westham/10_w.jpg
    card:
