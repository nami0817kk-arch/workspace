# スタジアム紹介シリーズ：ウェストハムの本拠地（ロンドン・スタジアム、10/25）。雛形は 10/24 フラムの回。
# 重なりの確認（2026-10-25）：scripts/・research/covered.yaml・research/posted.json に stadium_westham は無い。
#   kit_westham（10/21、ユニフォームとエンブレム）は紋章の回。アン・ブーリンの塔・紋章の話はこちらで言わない。
#   stadium_tottenham（10/19）は「昨季の平均でトッテナムを上回ったのはマンUとウェストハム」と1行だけ触れている。
# 今の立場：ウェストハムは 2025/26 プレミア18位で降格、2026/27 は2部（チャンピオンシップ）。
#   出典：PL公式ハンドブック2026/27 の 2025/26 順位表（控え research/raw/20261021_nufc_plhandbook.txt 32840行）、
#   ウィキペディア en "2026–27 West Ham United F.C. season"（控え research/raw/20261025_wh_wp_season2627.txt）。
# 軸：A＝昨季のプレミア平均6万2455人は20クラブで3位、収容に対する割合99.9％は20クラブで最も高い（ハンドブックの入場表、32912行）。
#     B＝五輪の陸上競技場が、なぜサッカーの本拠地になったのか。トラックが残った。
#     C＝2部に落ちた今季も、ホーム5試合の平均は6万882人。
# 収容・ピッチ（ウィキペディア en "London Stadium"、控え research/raw/20261025_wh_wp_london_stadium.txt）：
#   2022-04-06 にサッカーの収容を6万2500へ（全体は6万8013）／ピッチ105×68m／五輪の間は8万人／着工2008-05-22・完成2011年3月／
#   五輪後の計画は2万5000〜3万席の陸上競技場（25,000 to 30,000-seat）／2011-02-11 OPLC がウェストハムを選ぶ→2011-10-11 取り消し（トッテナムとレイトン・オリエントの裁判・国の補助の問題）／
#   2013-03-22 99年の賃借／2016-04-14 に全文が公開され年250万ポンド、警備・場内整理・暖房・芝の手入れ・コーナーフラッグは払わない／
#   2016-08-04 ドムジャレ戦3-0（工事中で5万4000に絞った）／プレミア初戦ボーンマス戦5万6977／
#   陸上の団体（UK Athletics）は50年、毎年6月最後の金曜から7月末まで使う／2019年4月 えんじ色の覆い25万ポンド／
#   2020年2月 下段に2つの新しいスタンド、多くの席を4メートル超ピッチへ近づける／ファンが遠いという専門家の声（Paul Fletcher）。
#   建設費の4億8600万ポンドは評論の一文（Rowan Moore）にあるだけなので言わない。
# 最多入場：ウィキペディア en "West Ham United F.C."（控え 20261025_wh_wp_club.txt）62,478 v リーズ 2023-05-21。
# 旧本拠地（ウィキペディア en "Boleyn Ground"、控え 20261025_wh_wp_boleyn.txt）：
#   1904〜2016／閉じたときの収容35,016／最後の試合2016-05-10 マンU戦3-2、入場34,907、この地で2398試合目／
#   最多42,322（1970-10-17 トッテナム戦、立ち見の時代）／2016-07-15 に4000万ポンドで売却が完了・住宅の開発／
#   2016-03-14 ジョン・ライオールの門を外し始める（新しい本拠地に移して据えるため）／記念のれんがの銘は新しい本拠地の小道に作り直された。
# 入場（PL公式の試合API、控え research/raw/20261024_pl_matches_all.json）：
#   2024/25 ホーム19試合＝合計1,186,819・平均62,464・最多62,476（2024-12-29 リヴァプール戦）・最少62,435（2024-12-09 ウルヴズ戦）→差41。
#   2025/26 はハンドブックの入場表：19試合・合計1,186,646・平均62,455・99.9％・最多62,474（アーセナル戦）。
#     API の18試合（アーセナル戦が欠ける）の最少は62,429（2026-01-06 フォレスト戦）→差45。
#   2023/24 は API に 64,472（マンU戦）という収容を超える値があり、使わない。
#   2025/26 の他クラブ（ハンドブック）：マンU 74,010／トッテナム 62,519／ウェストハム 62,455（3位）。割合はウェストハム99.9％が最高（ニューカッスル99.8、チェルシー・マンU99.7）。
# 今季（2部）のホーム（ウィキペディアの試合記録の wikitext、控え 20261025_wh_wp_season2627_wikitext.txt）：
#   8/22 チャールトン 62,264／9/1 ウルヴズ 59,113／9/5 ダービー 61,180／9/11 レクサム 59,712／10/9 QPR 62,140（10/24 サウサンプトン戦は記載なし）。
#   アウェー6試合は10,605（リンカーン）〜25,510（ボルトン）。
# 自分で引いた・割った：62,500÷35,016=1.785→約1.78倍／62,519-62,455=64／304,409÷5=60,882.0／62,455-60,882=1,573（2.52％）／
#   60,882-35,016=25,866／62,478-42,322=20,156。
#   2026/27 プレミアの収容（ハンドブック）で60,882を超えるのは マンU74,158・トッテナム62,850・リヴァプール61,276・マンC61,038 の4つ（アーセナル60,704は下）。
# 日本との接点（基礎の次の節）：
#   室伏広治 2012-08-05 ハンマー投げ銅 78m71（ウィキペディア ja "室伏広治"、en "Athletics at the 2012 Summer Olympics – Men's hammer throw"＝会場は Olympic Stadium、2004年の優勝者）。
#   田中将大 2019-06-29 ロンドンシリーズ第1戦に先発、ヤンキースが17-13で勝利。大リーグのヨーロッパ初の公式戦（ja "田中将大"、en "MLB London Series"）。
#   サッカーの日本人選手の縁は見つからなかったので、陸上と野球の2人だけ。降板の早さ（2/3回）は言わない。
# 言わなかったもの：オーナーへの抗議・ボイコット・2018年の乱入（人と処分の話）／所有会社の入れ替わり／建設費／ブーリン城とアン・ブーリン（kit_westham で話した）／女子チーム。
# 写真：assets/images/20261025_stadium_westham/（Commons、出典は credits.json）。人物は特定していない。
