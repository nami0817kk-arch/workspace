      - https://x.com/youriver0330/status/2103058300669739161
  - id: zero
    main: true
    heading: いないのは2クラブ
    tier: 報道
    telop: 0人はエルチェとラシンだけ
    narrator: キャスター
    card:
      type: table
      title: 0人のクラブと、最多のクラブ
      columns: [クラブ, 元バルサ, 昨季]
      rows:
        - [エルチェ, 0人, 1部]
        - [ラシン, 0人, 2部で優勝]
        - [デポルティーボ, 6人, 2部で2位]
    say:
      - text: 今季のラ・リーガ、元バルサの選手は17クラブに39人。
        short_only: true
      - 1人もいないのは、**エルチェ**と**ラシン・サンタンデール**の2つだけ。
      - エルチェは昨季、バルサからゴールキーパーのイニャキ・ペーニャと、エクトル・フォルトを借りていました。
      - ラシンは昨季2部で優勝し、14年ぶりに1部へ昇格したクラブ。
      - 同じく2部から昇格したデポルティーボは、逆に**6人**。いちばん多いクラブです。
    sources:
      - https://www.mundodeportivo.com/futbol/fc-barcelona/20260927/1004230965/laliga-tira-ex-barca-dos-equipos-pasado-cule.html
      - https://en.wikipedia.org/wiki/Racing_de_Santander
      - https://en.wikipedia.org/wiki/2025%E2%80%9326_Segunda_Divisi%C3%B3n
  - id: most
    heading: いちばん多いデポル
    tier: 報道
    telop: デポルティーボに6人
    narrator: キャスター
    card:
      type: table
      title: デポルティーボの元バルサ
      columns: [所属, 名前, 位置, 年齢]
      rows:
        - [デポルティーボ, マルク・カサド, MF, 23]
        - [デポルティーボ, オーバメヤン, FW, 37]
        - [デポルティーボ, アダマ・トラオレ, FW, 30]
        - [デポルティーボ, アルナウ・コマス, DF, 26]
        - [デポルティーボ, アドリア・アルティミラ, DF, 25]
        - [デポルティーボ, ルイスミ・クルス, FW, 25]
    say:
      - デポルティーボは、この夏だけで元バルサを3人取りました。
      - 1人はマルク・カサド。バルサから1年の期限付きで来ています。
      - 2人目はオーバメヤン。2022年の半年、バルサでプレーしました。
      - 3人目はアダマ・トラオレ。
      - ラ・マシア育ちで、2022年には期限付きでバルサに戻っていました。
      - 残る3人も、ラ・マシアかBチームにいた選手です。
      - デポルティーボの次に多いのは、ベティスとセルタ。4人ずつです。
      - ベティスは4人とも、バルサのトップで試合に出ています。
    sources:
      - https://www.mundodeportivo.com/futbol/fc-barcelona/20260927/1004230965/laliga-tira-ex-barca-dos-equipos-pasado-cule.html
      - https://en.wikipedia.org/wiki/Marc_Casad%C3%B3
      - https://en.wikipedia.org/wiki/Pierre-Emerick_Aubameyang
      - https://en.wikipedia.org/wiki/Adama_Traor%C3%A9_(footballer,_born_1996)
      - https://en.wikipedia.org/wiki/Real_Betis
  - id: madrid
    heading: マドリードの2強にも
    tier: 報道
    telop: ダービーの左サイドバックは2人ともラ・マシア育ち
    narrator: キャスター
    card:
      type: table
      title: マドリードの2強の元バルサ
      columns: [所属, 名前, 位置, 年齢]
      rows:
        - [アトレティコ, アレハンドロ・グリマルド, DF, 31]
        - [レアル・マドリード, マルク・ククレジャ, DF, 28]
    say:
      - マドリードの2強にも、1人ずついます。
      - アトレティコのグリマルドと、この夏レアル・マドリードに来たククレジャ。どちらもラ・マシア育ちです。
      - 2人とも、バルサではトップに定着できずに外へ出ました。
      - 9月20日のマドリード・ダービーでは、両チームの左サイドバックがこの2人でした。
      - アトレティコが2対1で勝った試合で、先制点はグリマルドの53分のPKでした。
    sources:
      - https://en.wikipedia.org/wiki/Alejandro_Grimaldo
      - https://en.wikipedia.org/wiki/Marc_Cucurella
      - https://www.espn.com/soccer/match/_/gameId/401882865
  - id: kubo
    heading: 久保のソシエダには3人
    tier: 報道
    telop: ソシエダの元バルサは3人
    narrator: キャスター
    card:
      type: table
      title: レアル・ソシエダの元バルサ
      columns: [所属, 名前, 位置, 年齢]
      rows:
        - [ソシエダ, 久保建英, MF, 25]
        - [ソシエダ, セルヒオ・ゴメス, MF, 26]
        - [ソシエダ, エクトル・フォルト, DF, 20]
    say:
      - text: 日本人のいるクラブにも。久保建英のレアル・ソシエダには、3人です。
        image: assets/images/20260921_kubo/01.jpg
      - 久保は2011年から4年、ラ・マシアにいました。
      - 未成年の国際移籍の決まりに反したとして、バルサが処分を受けました。
      - そのため久保は、2015年に日本へ戻っています。
      - もう1人は、セルヒオ・ゴメス。10歳からバルサの育成に8年いました。
      - そしてこの夏、昨季エルチェにいたエクトル・フォルトが来ました。ラ・マシアで10年育った20歳です。
    sources:
      - https://en.wikipedia.org/wiki/Takefusa_Kubo
      - https://en.wikipedia.org/wiki/Sergio_G%C3%B3mez_(footballer,_born_2000)
      - https://en.wikipedia.org/wiki/H%C3%A9ctor_Fort
      - https://www.mundodeportivo.com/futbol/fc-barcelona/20260927/1004230965/laliga-tira-ex-barca-dos-equipos-pasado-cule.html
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「両チームの左SBがラ・マシア出身か」
    narrator: キャスター
    say:
      - voice: ネット民
        text: アレハンドロ・グリマルド… マルク・ククレジャ… 両チーム左ＳＢがラ・マシア出身か。
        short_voice: true
      - voice: ネット民
        text: あ、てかグリマルドとククレジャこいつら 元バルサ組やん、 活躍すんなグリマルド決めたけど
      - voice: ネット民
        text: 流石ラマシア出身のグリマルド！
      - voice: ネット民
        text: ラマシアのグリマルド クレのジョナデビ わかってんなお前ら
      - voice: ネット民
        text: オーバメヤンは怪物だ。バルサも、ほかのクラブも、彼を手放したのが理解できない！
      - voice: ネット民
        text: オーバは別の銀河から来た選手だ
        cont: true
      - voice: ネット民
        text: ラマシア出身のフォルトとTAKEを一緒に出したらなにか反応が起きるのではないかと密かに期待してる
        short_voice: true
      - voice: ネット民
        text: もちろんアランブルみたいな強度は期待できないかもしれないけど、一緒に使ってみてほしいな…
        cont: true
        short_voice: true
