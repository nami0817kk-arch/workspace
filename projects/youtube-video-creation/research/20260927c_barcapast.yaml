sections:
  - id: count
    heading: 17クラブに39人
    tier: 報道
    telop: バルサにいた選手、17クラブに39人
    narrator: キャスター
    card:
      type: table
      title: ラ・リーガの元バルサ
      columns: [内訳, 人数]
      rows:
        - [いるクラブ, 17クラブ]
        - [選手, 39人]
        - [ラ・マシア育ち, 28人]
        - [Bかトップだけ, 11人]
    say:
      - text: 今季のラ・リーガで、バルサの育成かトップに一度でもいた選手は、**17クラブ**にいます。
        image: assets/images/20260927c_pair_grimaldo_cucurella/01.jpg
      - バルサを除く19クラブの登録選手の経歴を数えると、合わせて**39人**。
      - そのうち11人は、Bチームかトップにだけいた選手。
      - 残りの**28人**は、育成組織のラ・マシアを通ってきた選手です。
      - ラ・マシア育ちの多さには、ネットでもこんな声があります。
      - voice: ネット民
        text: レイナ、セスク、アルテタ、チアゴ、モッタ、イカルディ、アルバ、トラオレ、バルトラ、ベジェリン、
      - voice: ネット民
        text: ペドロ、オルモ、オナナ、Xシモンズ、ククレジャ、グリマルド、エリガルなど
        cont: true
      - voice: ネット民
        text: ラ・マシア出身で活躍してる選手なんて挙げれば山ほどいますよ。あなたが無知なだけ。
        cont: true
    sources:
      - https://www.mundodeportivo.com/futbol/fc-barcelona/20260927/1004230965/laliga-tira-ex-barca-dos-equipos-pasado-cule.html
      - https://barcauniversal.com/only-two-la-liga-clubs-have-no-player-with-a-barcelona-past-this-season
