  question: 前田大然は81分のあいだに何をして、イプスウィッチの試合はそのあとどう動いたのか
  takeaway: 前田大然は右サイドで先発し、81分までに4度チャンスに絡んだ。16分は落としからエンシソのミドル、24分は浮き球に抜け出しながらトラップで転倒、35分と36分は右を破ってクロス。75分にはエリア内で倒れたが主審はノーファウルと判断し、VARの介入も無くPKにはならなかった。前田が下がったのは81分で、そこからイプスウィッチが試合をひっくり返す。88分にワタラがエリアの外から左足、90分＋1分にオシェイがクラークのボールを頭で合わせて2対1。先制されたのは55分、セセニョンの左足だった。イプスウィッチはこれが今季3勝目で、3つとも90分以降に決勝点が入っている。前田の先発はリーグ戦では3試合ぶりだった
  opening_image: assets/images/20261011_maeda_ipswich/01_w.jpg
