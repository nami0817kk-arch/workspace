# 取材メモ（10/11 題材 ① maeda_ipswich、型は news、日本人枠）。**ショートだけ作る**（本編は作らない）。
# 効く一点：**前田大然は81分までに4度チャンスに絡み、75分にはエリア内で倒れたが笛は鳴らなかった**。
#   そこを①（main）に置いた。試合がひっくり返るのは、前田が下がった7分後と9分後。
# **前田本人の言葉は 10/11 10:00 時点で見つかっていない**（クラブ公式・ゲキサカ・サッカーキング・
#   The Guardian・本人のSNSを当たった）。無いまま作る。推測で書かない。
#   代わりに置いたのは**ゲーリー・オニール監督の試合後の言葉**（The Guardian の取材）。
# **スコアと得点者はプレミアリーグ公式まで辿った**（sdp-prem-prod … /v2/matches/2645251 と
#   同じ試合の commentary）。公式の記録はこうなっている:
#     55' Ryan Sessegnon  … left footed shot from outside the box to the bottom right corner following a corner
#     88' Abdoul Ouattara … left footed shot from outside the box to the bottom left corner
#     90'+1' Dara O'Shea  … header from very close range, assisted by Jack Clarke with a cross following a set piece
#     81' Sindre Egeli replaces Daizen Maeda（＝前田の交代は81分で確定）
#   会場 Portman Road / 入場者 29,445（公式）。先発の背番号は38、公式の区分は Midfielder。
# **数字の食い違い（必ず見る）**
#   ・逆転ゴールの時間：**プレミアリーグ公式は 90'+1'**。ゲキサカは「90+2分」、The Guardian は
#     「in the second minute of stoppage time」。**公式を採った**（台本もカードも 90分＋1）。
#   ・前田の位置：公式の区分は MF だが、サッカーキング・ゲキサカはどちらも「右ウイング」。
#     **台本では「右サイド」とだけ言う**（区分の違いを画面に出さない）。
# **PKにならなかった場面はゲキサカの記述だけが詳しい**（後半30分＝75分。セセニョンをかわして
#   エリア内に入り、後方からの接触で転倒。主審はノーファウル、VARの介入も無し）。
#   **「誤審だった」とは言わない。**判定の理由はどこにも出ていないので、起きたことだけを書く。
# **フルハムの話は見立ての1行だけ**にした（相手側の評価に寄せない）。
# 写真は Commons の1枚（File:Celtic-20240722-018.jpg、CC BY-SA 4.0 / Hameltion、2024年、
#   セルティックの練習着＋ビブス）。**いまはイプスウィッチだが、前田の顔がはっきり写った写真が
#   他に無い**（決まり「他に無ければ古いユニフォームでよい」）。
#   Commons の 3840x2560 を落として、**顔の位置から手で切った**（01_w は16:9・1955x1100で顔を上から1/3、
#   01_v は9:16・1068x1900で顔を上から18%）。縦版は**顔が上から6〜24%**に来るので、板（画面の11〜62%）と
#   ぶつからない。01_w_v は 01_v と同じ切り方（本編用の 01_w をショートで差し替えるため）。
#   **一度は別の Commons の写真（手を挙げた2023年のもの）で組んだが、`src/faces` が顔を
#   1つも見つけられず（preview4 が「冒頭に顔が1つも見つかりません」で ×）、この写真に替えた。**
#   切った絵は3枚とも開いて目で見た。
#   **ゲキサカと サッカーキング の記事写真は使っていない**：どちらも画像の中に「©Getty Images」が
#   焼き込まれていた（実際に開いて右下を拡大して確認。URLの警告では素通りする）。
# サムネ：構図 face（**ユーザーと相談して決める**。ここに書いたのは点検を通すための1案）。
# ネットの反応は集めていない（この回は反応なしで出す）。反応の節は無い。
# 数字の重なり対策：『81分』は①と②の頭だけ、『75分』は①だけ、『88分』『90分＋1』は②だけ、
#   『3勝』『7点差』は③だけ。
