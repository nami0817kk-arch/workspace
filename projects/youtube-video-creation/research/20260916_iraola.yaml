    heading: 何が起きたか
    tier: 報道
    telop: 中3日で0対0
    narrator: キャスター
    say:
      - リヴァプールが本拠地でフラムと0対0に終わりました。
      - 中3日です。その前の週の半ばに、チャンピオンズリーグでアトレティコ・マドリードに勝っていました。
      - アンドニ・イラオラ監督は、この試合の内容をはっきり認めました。
    official: false
    sources:
