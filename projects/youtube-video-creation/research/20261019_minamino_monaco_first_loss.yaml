# 南野拓実 の取材メモ（2026年10月19日・ショートだけ・**煽りの版**）
# 【煽りの版：何を足したか】（2026-10-19 指示。X の見せ方に煽りを重ねる）
#   足したのは題と冒頭1行（short_hook）の「まさかの」だけ。題の頭は「南野拓実」＝名前。【】の札は付けない。
#   事実・数字・発言は1字も変えていない：0対1／今季初黒星／リーグ戦4勝2分／2戦連続の先発／52分に交代／PKの1点、は下の出典どおり。
#   答えは伏せた：題は「何が起きたか（PKの1点で敗れた）」を言わない。
#   選手を小さく見せない：「まさか」の主語はモナコの初黒星。南野は「2戦連続の先発」と書く（交代と敗戦を結ぶ言い方・南野のせいに読める言い方はしない）。
#   煽りの強さ：想定・確率は作っていない。見立て（予想）は置いていない。
# 取材: 2026-10-19。requests（ブラウザUA）で原文を全部読んだ。
#   ・サッカーキング 2026-10-19「南野拓実は2戦連続スタメンで52分までプレー…モナコはPKの1点に沈み今季初黒星」
#     https://www.soccer-king.jp/news/world/fra/20261019/2218068.html （research/raw/20261019_b_sk.txt）
#   ・AS モナコ公式サイト（英語）試合レポート「Determined but unlucky as Monaco narrowly beaten in Lorient」（全文。research/raw/20261019_b_asm.txt）
#     https://www.asmonaco.com/en/news/determined-but-unlucky-as-monaco-narrowly-beaten-in-lorient
#   ・サッカーキング 2026-10-16「大ケガに苦しんだ南野拓実、298日ぶりに公式戦復帰！ ECL初陣で先発出場…」（見出しだけ。復帰の日付）
#     https://www.soccer-king.jp/news/world/ecl/20261016/2217264.html
# 資料間のずれ（台本では**分を言わない**）:
#   ・PKの時刻：SK本文「60分」・SK得点者欄「61分」・モナコ公式「61'」。→ 台本は「後半」とだけ言う。
#   ・SKは「後半開始早々の52分に途中交代」、モナコ公式の出場表は「Minamino (Diop, 52')」＝エダン・ディオプと交代。→ 52分・ディオプと言う。
#   ・「2戦連続の先発」：SK（ECL→リーグ戦）、モナコ公式も「second consecutive start after several months out」。一致。
#   ・**交代の理由は、SKにもモナコ公式にも書かれていない**。けがとは言わない。
# 自分で数えたもの: リーグ戦は4勝2分＝6試合無敗（SK）。今回が7試合目の初黒星。復帰は15日のECL、18日のリーグ戦＝3日で2試合連続の先発。
# 本人の言葉: 南野本人の言葉は、今回の記事にもモナコ公式の試合レポートにも無い（作らない）。SNSの投稿（10/16「まだ始まったばかり」）は別の記事で、今回は使わない。
# 反応: 探していない（0件。作らない）。
# 写真: 配信写真（Getty）は取り込まない。**AS モナコ公式サイトの試合フォト**（クラブ撮影）。
#   01 ロリアン戦（18日・右サイドでクロス）・02 ECL ソフィア戦（15日・復帰戦）・03 ロリアン戦（18日・ドリブル）。10/16 に使った Commons の写真は使い回していない。
#   元の写真は 842x561 と小さい（縦に切ると約3.4倍に伸びる。precheck の△が出ても、ほかに無い）。
