# 冨安健洋（クリスタル・パレス）の取材メモ（2026年10月20日・ショートだけ）。見せ方は B（写真を5枚で切り替え）
# 題材の元: topics_src num 5（フットボールトライブ 10/19 10:48。英『Roto Wire』18日の引用）。
# 読んだ出典（requests・ブラウザUAで本文。控え research/raw/20261020_tomiyasu_ft.txt）:
#   ・フットボールトライブ（https://football-tribe.com/japan/2026/10/19/360529/）: 18日のプレミア第7節ブライトン戦でもベンチ外。11月の日本代表に招集されない可能性が高まっているという。
#     9月20日のリーズ戦（第5節）でふくらはぎを負傷。9・10月の代表は招集辞退。リーズ戦以降、公式戦のピッチに立っていない。
#     Roto Wire（18日）: 「彼はまだコンディションが回復しきっていない。離脱期間が延長される」「ブライトン戦も欠場したことで、回復への道のりにさらなる後退が生じた。冨安は今シーズン2試合に先発出場しているものの、コンディション不良のため、コンスタントにプレーできていない」。
#     復帰の可否は「トレーニングの進捗状況次第」で、具体的な復帰時期には触れていない。11月中旬にブラジル戦・パラグアイ戦。上田綺世（足底筋膜の断裂）と同じく代表メンバーから外れるかもしれない、と記事が書く（→台本は上田に触れない）。
#   ・Roto Wire の原文は読んでいない（転載1本）→ 確度は「報道」止まり。台本は「英メディア」と出所を断る（媒体名は引用でないので言わない）。
# 10/15・10/17 の冨安のショートとの違い: 10/15 はリヨン戦の欠場（会見の言葉）、10/17 は18日のブライトン戦に出られるかの見通し（監督の言葉）。今回は**18日はベンチ外だった**という結果と、英メディアの「離脱期間が延長」。
#   監督の言葉・同行・「可能性はある」は繰り返さない。公式戦の欠場期間の長さ（下）が新しい点。
# 自分で数えたもの: 9月20日（リーズ戦）から10月18日（ブライトン戦）は28日＝4週間。この間、公式戦に出ていない（記事）。日付の差だけで、因果は言わない。
# 本人の言葉・クラブの発表: 無し（記事に無い）。Y にしない。作らない。反応: 0件（作らない）。
# 写真（B・縦5枚）: 配信写真は取り込まない。assets/images/20261020_tomiyasu_out_extended/
#   01（アヤックス時代・2026-04 Commons CC BY-SA, Hans Reefman。10/15 に使った写真）から縦の切り出し3枚（04・05・06）、02（パレス公式サイトの選手紹介 © クリスタル・パレス。10/17 に使った写真）の縦切り、03（Commons CC0, RC Lens - Arsenal 2023-10 の冨安）の縦切り。
#   全て目で見て本人（背番号18の青いアーセナルのジャケット・アヤックスのユニフォーム・パレスのトレーニングウェア）。**今日の写真ではなく、3枚の元は10/15・10/17 と同じ素材（切り出しは別）**。今季のパレスの写真は公式の1枚だけ。
#   Commons の他の冨安（2021-12 アーセナル、2019 アジアカップ）は小さい・遠い・顔が手で隠れるので使わない。
