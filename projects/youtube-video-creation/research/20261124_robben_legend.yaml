# アリエン・ロッベン（元オランダ代表FW、バイエルン10シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-24 用。8節（フック→基礎DATA→歩み→持ち味→あの試合→現役の終わり→マル秘話→見立て）。日本との接点は、2010年W杯の日本戦でベンチだったこと以外に一次情報で確かめられなかったので節を置かない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Arjen Robben の成績表・本文・Honours、2013 UEFA Champions League final、2012 UEFA Champions League final）と自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（結婚・家族・病気の話・ダイブの批判は台本に出さない）。
# **重なりの確認（2026-11-13）**：scripts/・covered.yaml・posted.json・research/2026111*_picks.txt を「ロッベン／Robben」で grep。主役の回は無し（カシージャス・ロナウジーニョの回に名前が出るだけ）。同じ日（11/24）の別シリーズに同名なし。
# **引退の確認**：Wikipedia「2019-07-04 引退を発表、2020-06-27 フローニンゲンに復帰、2021-07-15 に2度目で最後の引退を発表」→ 現役ではない（42歳）。
# **数字の出どころと自分で足した値**
# - バイエルン：公式戦 309試合144ゴール（成績表の合計）。シーズン別ゴール 09-10 23、10-11 13、11-12 19、12-13 13、13-14 21、14-15 19、15-16 7、16-17 16、17-18 7、18-19 6（合計144と一致）。オランダ代表 96試合37ゴール。サムネの表：バイエルン309/144＋オランダ代表96/37＝405試合181点（自分で足した値。ほかのクラブは除く）。
# - 決勝4敗：本文「fourth major cup final he had been on the losing side during the last two years (FIFA World Cup final, two Champions League finals and the DFB-Pokal)」。2010 CL決勝はインテルに0-2、2012 ドイツ杯決勝はドルトムントに2-5（2012 CL決勝のページ）。2010-07 W杯決勝はスペインに0-1。ロッベンは2010・2012 の CL決勝に先発（2012 CL決勝ページ）。
# - 主要タイトル（ブンデスリーガ・ドイツ杯・CL）は Honours から自分で数えた：09-10＝BL・ドイツ杯の2個、10-11・11-12＝0、12-13＝BL・ドイツ杯・CLの3個、13-14＝2、14-15＝1、15-16＝2、16-17＝1、17-18＝1、18-19＝2。合計14個（BL8・ドイツ杯5・CL1）。2009-12＝2個、2012-19＝12個。1年あたり 2÷3＝0.67、12÷7＝1.71（約2.6倍）。ゴール 55÷3＝18.3、89÷7＝12.7。
# - 2013-05-25 CL決勝（ウェンブリー）バイエルン2-1ドルトムント。マンジュキッチ60分（ロッベンとリベリーの連携）、ギュンドアンPK、ロッベン89分（残り1分、リベリーのヒールパスから左足）。UEFA 最優秀選手。バイエルンは4年で3度目の決勝・2010、2012は敗退。ドイツ勢どうしのCL決勝は初。「Mr Wembley」は本文。
# - 2012-05-19 CL決勝（アリアンツ・アレーナ）チェルシー1-1バイエルン、PK戦3-4。延長戦でドログバがリベリーを倒してPK、ロッベンのキックをチェフが止める。
# - 2019-05-18 フランクフルト戦5-1でリーグ最後のゴール・8回目のBL優勝、2019-05-25 ドイツ杯決勝ライプツィヒ3-0で5回目のドイツ杯。2017-10-10 代表引退。2015-02-21 パーダーボルン6-0で2ゴール＝対戦した全BLクラブから得点。2018 11回目の国内リーグ優勝でクライフ（10回）超え。2010 ドイツ年間最優秀選手＝4人目の外国人・初のオランダ人。2025-08 パデルの大会に出場（本文）。
# **本人の言葉**：取れていない。声の行は置かない。
# **入れなかったもの**：私生活・家族、病気の検査の話、ダイブの批判、2007年のスペイン移籍の経緯、チェルシー時代のケガの細部、2014年W杯の細部。
# **読みで怪しいもの**：アリエン・ロッベン、フローニンゲン、リベリー（リベリ）、ロベリー、マンジュキッチ、ギュンドアン、チェフ、パーダーボルン、ライプツィヒ、フランクフルト、ドルトムント、ウェンブリー、PSV、パデル。
