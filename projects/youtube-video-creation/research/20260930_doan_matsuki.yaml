    card:
      type: table
      title: 堂安律と松木玖生（ベネズエラ戦まで）
      columns: *dmcols
      rows: *dmrows
      highlight_row: 1
  - text: A代表に初めて呼ばれたのは、堂安が20歳、松木は23歳です。
    card:
      type: table
      title: 堂安律と松木玖生（ベネズエラ戦まで）
      columns: *dmcols
      rows: *dmrows
      highlight_row: 2
  - text: 初ゴールは2人ともウルグアイ戦。堂安は3試合目、松木は初戦でした。
    card:
      type: table
      title: 堂安律と松木玖生（ベネズエラ戦まで）
      columns: *dmcols
      rows: *dmrows
      highlight_row: 3
  - text: 違うのは入ったときのチーム。堂安の2018年は本田・香川が抜けた直後。
    card:
