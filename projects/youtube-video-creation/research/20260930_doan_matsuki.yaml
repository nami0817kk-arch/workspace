  takeaway: 堂安は20歳で代表に呼ばれて71試合、主将になるまで8年。松木は23歳で呼ばれて初戦で得点。どちらも左利きの右サイドで、代表初ゴールはウルグアイ戦。違うのは入ったときのチームで、中心の抜けた2018年と、主力のそろう今。堂安の言う「入ってくる難しさ」は、その差にある
