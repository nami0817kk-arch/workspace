sections:
- id: situation
  heading: 一夜明けの広島で
  tier: 報道
  telop: 主将の堂安律、初めて呼ばれた若手のことを聞かれて
  narrator: キャスター
  say:
  - text: 日本代表の主将、堂安律が、ベネズエラ戦の翌日の練習後に取材に応じました。
    image: assets/images/20260930_doan_matsuki/01_w.jpg
  - 話は、初めて呼ばれた若手のことに。
  - voice: 堂安律
    text: 今はある程度、中心選手がいる中で
  - voice: 堂安律
    text: 入ってくる難しさもあると思うし、
    cont: true
  - voice: 堂安律
    text: そこで堂々とプレーしている彼らは
    cont: true
  - voice: 堂安律
    text: すごいなと思いますね
    cont: true
  - text: 名前を挙げたのは、イングランド2部サウサンプトンの23歳、松木玖生。
    image: assets/images/20260930_pair_doan_matsuki/01.jpg
  - 24日のウルグアイ戦が代表デビュー。右のウイングバックに入りました。
  - 守りでは最後尾まで戻り、攻めでは前へ出るサイドの持ち場です。
  - 前半11分の先制点は、内側の堂安が走って相手を引きつけ、空いた所からでした。
  - 2人はいま、代表の合宿で同じ宿舎に寝泊まりしています。
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?459954-459954-fl
  - https://news.yahoo.co.jp/articles/c64314c27836ed38a11f92e04c4dd6cb993789ab
  - https://news.yahoo.co.jp/articles/9ac8f7f463733c218442afe74d1d66ca756f7791
- id: words
  main: true
  heading: 「メンタリティがすごい」
  tier: 報道
  telop: 「玖生とかは一緒に生活していてメンタリティがすごい」
  narrator: キャスター
  say:
  - text: 初招集でいきなり初ゴールの23歳、松木玖生。代表の合宿で毎日顔を合わせる主将、堂安律の見方です。
    short_only: true
  - voice: 堂安律
    text: 日本代表としてドンと構えていける選手が
  - voice: 堂安律
    text: 育っていってくれたらなと思っている。
    cont: true
  - voice: 堂安律
    text: 玖生とかは一緒に生活していて
    cont: true
  - voice: 堂安律
    text: メンタリティがすごいし、
    cont: true
  - voice: 堂安律
    text: 僕も教わるところがあると思う。
    cont: true
  - voice: 堂安律
    text: 非常に面白いし、興味がある
    cont: true
  - 同じ右サイドの左利き。でも堂安が見ていたのは、プレーより人柄でした。
  - voice: 堂安律
    text: 似てる選手が面白いなというのも
  - voice: 堂安律
    text: 人間としてあると思うので、
    cont: true
  - voice: 堂安律
    text: 玖生とかは面白いですね
    cont: true
  - その言葉を伝え聞いた松木本人は。
  - voice: 松木玖生
    text: 先輩方が自分が入りやすいように
  - voice: 松木玖生
    text: コミュニケーション取ってくれたので、
    cont: true
  - voice: 松木玖生
    text: 自分も馴染みやすく入れています。
    cont: true
  - voice: 松木玖生
    text: 自分はサッカー以外のところは、
    cont: true
  - voice: 松木玖生
    text: 落ち着いてるタイプだと思う
    cont: true
  sources:
  - https://web.gekisaka.jp/news/japan/detail/?459954-459954-fl
