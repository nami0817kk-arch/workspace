# 取材メモ（9/30 題材3）。起点はゲキサカ 9/29 の囲み取材（堂安律、ベネズエラ戦の翌日・広島）。
# 同じ取材の言葉を 報知・日刊・サンスポ・東スポ・CoCoKARAnext で突き合わせた（言い回しが少しずつ違う。台本はゲキサカの書き起こしに合わせた）。
# 松木本人の言葉は報知 9/29（堂安の言葉を伝え聞いて）。9/26 の練習後の言葉（サッカーキング）は題の出来事より前なので使っていない。
# 堂安の数字: 日本語版Wikipedia の代表個人成績（ベネズエラ戦まで71試合11得点。初出場 2018/9/11 コスタリカ戦、初得点 2018/10/16 ウルグアイ戦＝3試合目）。
#   フローニンゲンへの期限付き移籍は 2017/6/23 発表（19歳）。
# 松木の数字: 日本語版Wikipedia（青森山田高で第100回高校選手権優勝。2003/4/30 生まれ・室蘭。2024/7/30 サウサンプトンへ完全移籍しギョズテペへ期限付き＝21歳。FC東京で 2024 年に森重・小泉との3人体制でキャプテン＝20歳）。
# 「同じ宿舎」は堂安の「一緒に生活していて」の場面の説明（代表の合宿）。
# 松木の先制点が堂安のフリーランで空いた場所から生まれた話は、ゲキサカ 9/24 の試合後の記事（地の文）。
# （使っていない）チームキャプテンとして通算4戦全勝（3月のスコットランド・イングランド、9月のウルグアイ・ベネズエラ）はゲキサカ 9/29 の板倉の記事の地の文。
#   W杯（オランダ戦 2-2）は板倉がチームキャプテンの期間で、堂安はゲームキャプテン。数に入らない。
# 板倉が主将に堂安を推した話は同じ日の別の本（板倉の回）なので、ここでは触れない。
# 反応: Yahoo!ニュースのコメント欄（CoCoKARAnext・東スポの記事）から2件。全文。尺のためサンスポの1件（「どういうところがすごいのか…興味ある」）は外した。
#   外したもの: 「捏造記事で伊東選手が離脱」を含む投稿（事実の主張が入る）／宮本・森岡の年齢を挙げる投稿（森岡の年齢が合わない）／
#   フローニンゲンのウェイト話（裏が取れない逸話）／「上から目線」「偉そうに」（題の中身への声ではない）
