# 冨安健洋、ふくらはぎ。代表合流の3日前（2026-09-21）
#
# 材料は research/raw/20260921_tomiyasu.md。
#
# **軸は負傷と日本代表への影響。**同じ日のリーズ対パレスは別の回で扱うので、
# 試合そのものの中身には踏み込まない。
#
# **負傷の場面は、どの記事にも書かれていない。**分かるのは「前半のどこかで痛めて、
# ハーフタイムに退いた」まで。**「何分に」「どのプレーで」は言わない。**
# 現地の記者は逆に「試合中に足を気にする素振りは見せなかった」と書いている。
#
# **監督名は「サージュ」に統一**（媒体でサージュ／セージ／サージ／サジュの4通り）。
# 発言はクリスタル・パレス公式の英語原文から訳す（日本の4媒体で訳が違うため）。
#
# **出場記録は「公式戦5試合」**（サッカーキングと Sofascore が一致）。
# Wikipedia と fbref の数字は8月末時点の古い集計なので使わない。
format: news
voice_min: 40
slot: japan_5
date: "2026年9月21日"

people:
  - 冨安健洋

short_title: "冨安健洋、ふくらはぎ"

theme:
  id: tomiyasu_calf_japan
  league: england
  league_name: プレミアリーグ
