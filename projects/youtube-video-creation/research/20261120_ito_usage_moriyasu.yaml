#       event=401916336（パラグアイ戦、2026-11-17）日本 1-2 パラグアイ。45分に 伊東純也が 相馬勇紀 と交代（Substitution, Japan. Junya Ito replaces Yuki Soma）。相馬の先発位置は AM-L（4-2-3-1 の左の攻撃的MF）。
