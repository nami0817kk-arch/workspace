#     「左サイドでカットインさせながら、というよりも、やっぱり右サイドで起用した方が縦に行けるので、プレーしやすい」／「右サイドの方が慣れているというのはある」としつつ「コンディションが上がってきてないのかなと思う」／
#     「良い時の伊東純也ではない。でも、左サイドだとプレーしにくくなる」。記事は本職を右サイドと書く。
