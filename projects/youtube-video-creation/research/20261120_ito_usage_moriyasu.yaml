# 食い違い・確かめられなかったこと:
#   ・記事の末尾に「本人は2026年5月末のアイスランド戦で「左だからというよりも試合展開的に難しかった」などと分析」とあるが、出どころが書かれておらず確かめていない。→ 台本では使わない。
