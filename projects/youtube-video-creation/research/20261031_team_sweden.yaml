  - text: 2025年10月、トマソン監督が解任されます。
    card: none
  - text: 後任に就いたのが、グレアム・ポッター。10月20日のことです。
    card: none
  - text: ポッターは、スウェーデンのクラブ、エステルスンドの元監督です。
    card: none
  - text: 2011年から2018年まで、率いていました。
    card: none
  - text: 就任後の最初の2試合は、スイスに1対4の負けと、スロベニアと1対1。
    card: none
  - text: 初勝利は2026年3月、出場を争うプレーオフでした。
    card: none
    image: assets/images/20261031_team_sweden/pair_fw/01.jpg
  - text: ウクライナに3対1の勝ち。ギョケレスが、3点を取りました。
    emph: true
    card: none
  - text: 続くポーランド戦も3対2で勝ち、本大会の出場を決めました。
    card: none
  - text: ネーションズリーグは、ヨーロッパの代表が競うリーグ戦。W杯のあとは3勝1分け。
