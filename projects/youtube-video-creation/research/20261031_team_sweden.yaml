# 代表チーム紹介 スウェーデン代表（10/31 作成。固定シリーズ9「代表チーム紹介」。見本は 10/29 のベルギー代表 scripts/20261029_team_belgium.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **軸（2026-10-31）**：「W杯予選でグループ最下位だった国は、ポッター監督のもとで何が変わったのか」。答えは見立ての節（予選の最初の4試合〔トマソン監督〕と、ポッター監督の14試合を、1試合あたりの勝点・得点・失点で自分で割って比べる）。
# **日本との接点**：2026年W杯F組の最終戦（6/25、アーリントン）で1対1（前田大然56分／エランガ62分）。日本は2位、スウェーデンは3位で32強。基礎DATAの次の節に置いた。2002年5月の国立競技場の1対1、1936年ベルリン五輪の日本の3対2の勝ちも添える。
# **重なりの確認（2026-10-31）**：scripts/・research/covered.yaml・research/posted.json を grep。スウェーデン代表の「紹介」回（team_sweden）は無い。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ・ウルグアイ・ベルギー。scripts/20260926_sweden.md はルーマニア戦（9/25）のギョケレスの言葉のショートで、紹介ではない。
# ---- 確かめたこと（2026-10-31。WebFetch の要約は使わず、requests で Wikipedia の生の wikitext と、スウェーデン協会・FIFA の公式ページを読んだ）----
#  ・FIFAランク：34位（前回比＋3）。Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）で Sweden 34・変化 3。日本17位・ベルギー8位（同じ表）。FIFA 公式 inside.fifa.com/fifa-world-ranking/SWE の国別ページは「37th」（Last official update: 20 July 2026 の表示。ランキング一覧の側は 07 October 2026 更新）。つまり7月37位→10月34位と読めるが、FIFA 公式で34位の表示そのものは取れていない（JS の表）。**台本には「34位」と「7月の37位から」を書く。公開前に FIFA で34位を目で確かめたい。**点数は書かない。
#  ・W杯：出場13回（初出場は1934年。1930年は不参加）。最高は1958年の準優勝（自国開催。決勝でブラジルに2-5）。3位が1950年と1994年、4位が1938年（Sweden men's national football team の本文・infobox「World cup best = Runners-up (1958)」）。2018年は8強。2022年は予選プレーオフでポーランドに0-2で敗れ不出場（2022-03-29）。
#  ・2026年W杯（Sweden at the FIFA World Cup の表：4試合 1勝1分2敗 7得点10失点、32強）：6/14 グループF初戦 チュニジア5-1（アヤリ7分・90+6分、イサク30分、ギョケレス59分、スバンベリ84分／レキク43分）、6/20 オランダ1-5（エランガ59分／ブロッビー5・17分、ヤクポ47・54分、サマービル89分）、6/25 日本1-1（エランガ62分／前田56分）、6/30 32強 フランス0-3（MetLife、ムバッペ2点・バルコラ1点）。5-1は W杯1試合での得点の歴代2位（最多は1938年キューバ戦の8-0）。F組は1位オランダ・2位日本・3位スウェーデン。スウェーデンは「成績上位8つの3位」で32強へ（2026 FIFA World Cup Group F）。
#  ・自分で割った（検算した）：W杯4試合 7÷4=1.75・10÷4=2.50。
#  ・W杯予選（Group B。UEFA）：6試合 0勝2分4敗・4得点12失点・勝点2でグループ最下位（2025-09-05 スロベニア2-2、09-08 コソボ0-2、10-10 スイス0-2、10-13 コソボ0-1、11-15 スイス1-4、11-18 スロベニア1-1。Wikipedia の Group B の試合表を1試合ずつ集計）。うち最初の4試合（10/13まで）はトマソン監督：1分3敗で勝点1・2得点7失点（本文「after taking only 1 point in four matches」とも一致）。トマソン監督は2025-10-14 に協会が解任（最初の解任）。ポッターは2025-10-20 就任（スウェーデンサッカー協会の発表 svenskfotboll.se 2025/10/graham-potter-ny-forbundskapten で日付確認）。
#  ・ネーションズリーグ（Nations League B 2026-27 のスウェーデンの試合表）：9/25 ルーマニア2-1（ホーム・ソルナ。イサク20分、ギョケレス43分／マン29分）、9/28 ポーランド3-1（ホーム。ニーグレン8分、アヤリ64分、ギョケレス72分／シマンスキ43分）、10/2 ボスニア・ヘルツェゴビナ1-1（敵地ゼニツァ。ギョケレス61分／アライベゴビッチ80分）、10/5 ルーマニア1-0（敵地ブカレスト。ギョケレス13分）＝3勝1分け・7得点3失点。ギョケレスは4試合すべてで得点。次は 11/14 ボスニア（ホーム）、11/17 ポーランド（敵地ヴロツワフ）。
#  ・ポッター監督の記録：Graham Potter の Managerial statistics（match played 5 October 2026 まで）で Sweden 14試合 6勝4分4敗。試合表で自分でも集計：W 6（ウクライナ3-1・ポーランド3-2・チュニジア5-1・ルーマニア2-1・ポーランド3-1・ルーマニア1-0）／D 4（スロベニア1-1・ギリシャ2-2・日本1-1・ボスニア1-1）／L 4（スイス1-4・ノルウェー1-3・オランダ1-5・フランス0-3）。得点25・失点26（勝点22）。自分で割った：勝点 22÷14=1.57、得点 25÷14=1.79（1.7857）、失点 26÷14=1.86（1.857）。トマソン監督の予選4試合：勝点 1÷4=0.25、得点 2÷4=0.50、失点 7÷4=1.75。**3倍以上** は 1.79÷0.50=3.6倍。
#  ・ポッター：初勝利は2026-03-26 のW杯プレーオフ準決勝（ウクライナ3-1、ギョケレスのハットトリック：6・51・73分PK）。3-31 のプレーオフ決勝でポーランドに3-2（エランガ20分・ラーゲルビェルケ44分・ギョケレス88分）。契約は2026-03-12 に2030年まで延長（Graham Potter 本文）。スウェーデンのエステルスンドを 2011-01-24〜2018-06-11 に率いた（同記事の Managerial record の表）。
#  ・ユーロ：最高は1992年の4強（自国開催。infobox「Regional cup best = Semi-finals (1992)」）。2024年は予選で敗退（Janne Andersson の退任）。五輪：1948年ロンドンで金メダル（infobox）。
#  ・愛称：Blågult（The Blue and Yellow）＝青と黄色（infobox）。
#  ・主将：ヴィクトル・リンデロフ（名簿の印 captain）。1994-07-17=32歳、アストン・ヴィラ、DF、代表84試合3得点。副主将はイサク・ヒエン（アタランタ）。名簿の数字は「Caps and goals are correct as of 5 October 2026」。
#  ・名簿・年齢（2026-10-31 時点を生年月日から計算）：リンデロフ 1994-07-17=32（アストン・ヴィラ、DF）／ギョケレス 1998-06-04=28（アーセナル、FW、41試合25得点）／イサク 1999-09-21=27（リヴァプール、FW、63試合19得点。10/5 の名簿には「WD」の印があり、記事では怪我に触れない）／エランガ 2002-04-27=24（ニューカッスル、FW、34試合8得点。W杯で2点）／アヤリ 2003-10-06=23（ブライトン、MF、27試合6得点。W杯チュニジア戦で2点）／ベルグヴァル 2006-02-02=20（トッテナム、MF、18試合0得点）。
#  ・日本との対戦：2026-06-25（F組最終戦・AT&Tスタジアム、アーリントン、観衆70,137）1-1、前田大然56分／エランガ62分（Japan national football team results (2020–present)、Sweden men's national football team の試合表、スウェーデン協会 svenskfotboll.se/…/herr-vm-jpn-swe）。2002-05-25 国立競技場（キリンチャレンジカップ）1-1（Japan national football team results (2000–2009)）。1936年ベルリン五輪1回戦 日本3-2スウェーデン（Japan national football team records and statistics の五輪の表）。1995-06-10 ノッティンガム（アンブロカップ）2-2、1996-02-22 香港（旧正月カップ）1-1・PK4-5、1997-02-13 バンコク（キングスカップ）0-1（results 1990–1999）。**通算の勝敗は台本に書かない**：Japan national football team records and statistics の対戦表は「7試合 1勝4分2敗 9得点13失点」だが、results の各ページで確認できたのは6試合（8得点8失点）で、1試合が突き合わない（1950〜1980年代のページが取得できなかった）。
# ---- 言わないもの ----
#  ・怪我／出場停止（名簿の WD の印）／私生活／背番号／戦術の説明／監督の契約の金額／トマソン前監督の解任の事情（解任の事実だけ）／イブラヒモビッチの引退後の話。
