  say:
  - text: 見立てに入ります。スウェーデン代表の数字を、二人の監督で並べます。
    image: assets/images/20261031_team_sweden/pair_coach/01.jpg
    card: none
  - text: トマソン監督のW杯予選4試合と、ポッター監督の14試合です。
    card: none
  - text: 予選の4試合は勝点1。取った点は2、失った点は7でした。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: ポッター監督の14試合は、6勝4分け4敗。勝点は22。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 取った点は25、失った点は26です。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 1試合に直すと、得点は0.5点から1.79点へ。3倍以上に増えました。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 3
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 一方で失点は、1.75点から1.86点。ほとんど変わっていません。
    mark:
      kind: circle
      row: 1
      col: 4
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 点を取る力は上がったが、守りはそのまま。数字は、そう語っています。
    card: none
  - text: ワールドカップの4試合でも、7得点10失点。1試合で2.5点を失っています。
    card: none
    image: assets/images/20261031_team_sweden/pair_fw/01.jpg
  - text: 次は11月14日にホームでボスニア、17日に敵地でポーランドと戦います。
    card: none
  - text: 失点を減らせるのか。そこが、勝ち上がる国になれるかの分かれ目です。
    card: none
