    main: true
    heading: 何がある日か
    tier: 報道
    telop: 24日、ヴィラが7戦全勝のシティを迎える
    say:
      - text: 鈴木彩艶のアストン・ヴィラが、7戦全勝のマンチェスター・シティを迎えます。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
      - text: 試合は24日、日本時間の20時30分から、ヴィラ・パークで行われます。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
        card: none
      - text: シティは勝てば、プレミアリーグ史上3チーム目の開幕8連勝です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
        card: none
      - text: 一方のヴィラは昨季、シティにリーグ戦で2勝。5月には敵地で2対1と勝っています。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
        card: none
    official: false
    sources:
      - https://www.theguardian.com/football/2026/oct/23/premier-league-10-things-to-look-out-for-this-weekend
      - https://www.bbc.com/sport/football/articles/cwg7xvz8e8dpo

  - id: emery
    heading: エメリ監督の「ヴィラ2.0」
    tier: 報道
    telop: 夏に主力が抜け、序盤の4試合で勝ち点1。そこから立て直した
    say:
      - text: この日は、エメリ監督の就任からちょうど4年の日です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/02_w.jpg
      - text: 鈴木が加わったこの夏、ヴィラでは主力が次々と抜けました。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/02_w.jpg
        card: none
      - text: リーグ戦は、最初の4試合で勝ち点1でした。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/02_w.jpg
        card: none
      - text: そこから立て直し、ヨーロッパの大会では、ホームで12連勝中です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
        card: none
      - text: エメリ監督は、「土曜のシティ戦も、同じ雰囲気、同じエネルギーで」と話しています。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
        card: none
    official: false
    sources:
      - https://www.bbc.com/sport/football/articles/cwg7xvz8e8dpo

  - id: zion
    heading: マルティネスの後を継いだ鈴木
    tier: 報道
    telop: マルティネスの後を継いだ鈴木。落ち着いたプレーとパスの幅が評価されている
    say:
      - text: 抜けた主力の一人が、ゴールキーパーのエミリアーノ・マルティネスでした。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
      - text: その後を継いだのが、パルマから来た24歳の鈴木です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
        card: none
      - text: 現地では、落ち着いたプレーと、短いパスも長いパスも出せる幅が評価されています。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/02_w.jpg
        card: none
    official: false
    sources:
      - https://www.bbc.com/sport/football/articles/cwg7xvz8e8dpo

  - id: view
    viewpoint: true
    heading: 欧州王者の先発11人のうち、残ったのは何人か
    tier: 報道
    telop: EL決勝の先発11人のうち6人が退団。残ったのは5人
    say:
      - text: 見立てです。5月のヨーロッパリーグ決勝で先発したのは11人。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/02_w.jpg
        card: none
      - text: そのうち6人が、この夏にチームを離れました。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
        card: none
      - text: 残ったのは5人です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
        card: none
      - text: 半分以上が入れ替わったチームで、ゴールを守るのが鈴木です。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/03_w.jpg
        card: none
      - text: 開幕8連勝がかかるシティを、その鈴木がどう迎え撃つか。
        image: assets/images/20261024_suzuki_zion_villa_city_preview/05_w.jpg
        card: none
    official: false
    sources:
      - https://www.bbc.com/sport/football/articles/cwg7xvz8e8dpo
