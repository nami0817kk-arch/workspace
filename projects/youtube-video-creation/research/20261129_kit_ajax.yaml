# ユニフォームとエンブレムの歴史 アヤックス（11/21 作成、11/29 分）。エールディビジ。骨組みは 20261117_kit_realsociedad.yaml と 20261125_kit_psg の台本。
# 題の問い：アヤックスの紋章は、なぜ34年ぶりに1928年の形へ戻ったのか。白に赤い1本線のシャツは、どこから来たのか。
#   答え＝2024年11月17日にクラブが発表。125周年（2025年3月18日）に、長年ファンが願ってきた昔の紋章を「ファンと自分たちに返す」。「アヤックスのDNAに忠実なとき、いちばん強い」（CEO）。2025年7月1日から正式な紋章。
#   シャツ＝最初は黒に赤い帯 → 赤白の縦じまに黒パンツ（アムステルダムの旗の色）。1911年に1部へ上がると、スパルタ（ロッテルダム）が同じ服。規則で後から来た側が替え、白に太い赤の縦線・白パンツに。
# 選んだ理由：ユニフォームは大物の順。プレミア20・ラ・リーガ主要6・インテル・ユヴェントス・バイエルン・PSG が済み。ドルトムントは 11/27 のスタジアム（2日前）、ミランは 11/24 のクラブ紹介（5日前）、ナポリ・ローマ・マルセイユはスタジアム済みなので外した。
#   同じ日（11/29）のスタジアムは PSG（research/20261127_picks.txt）。アヤックスは直近30日では 11/2 の財政だけ（4週前。決算の話で、色・紋章は扱っていない）。
# 重なり確認（2026-11-21）：scripts/*kit_* にアヤックス無し。posted.json の題にアヤックス無し。PSG の回（11/25）が「アヤックスに似ているという説」に1行触れているが、別の問い。
# 取材：requests（Wikipedia API・クラブ公式の英語版）のみ。ブラウザは使っていない。
#   読んだ：en "AFC Ajax"（Crest and colours・Sponsorship・Kit suppliers）、en "History of AFC Ajax"（創立・1911年）、nl "AFC Ajax"（Ontstaan・Logo en shirt・Gouden Kampioenssterren・Shirtsponsor）、
#   クラブ公式 https://english.ajax.nl/articles/classic-ajax-logo-returns-permanently/ （2024-11-17。CEO メンノ・ヘーレンと理事長の言葉）。
# ---- 食い違い・断ったこと ----
#   ・11本の線の紋章の年：en 本文「1990年」、en の図説「1991–2025」、nl「1991年」「34年」。クラブ公式「34年ぶり」。→ 台本は1991年。
#   ・最初の黒いシャツと赤い帯：en のみ（nl に無い）。→ 台本は「とされます」。
#   ・赤白の縦じま→白に赤い1本線（1911年・スパルタと同じ服・規則）：en "AFC Ajax" と en "History of AFC Ajax" が一致。nl には無い。
#   ・名前の由来：en History「ギリシャの英雄アイアスにちなむ」。nl は 1894年の前身のクラブ（綴りの誤り）にも触れるが、台本は1900年の創立だけ言う。
#   ・1928年の紋章の作者：nl「正確な作者は不明。1925年の記念旗に先に出た」。→ 台本は「誰が描いたかは、分かっていません」。1991年の紋章のデザイナー名（nl）は言わない。
#   ・TDK：nl「最初の大きな胸の広告は日本の電機メーカー TDK（1982/83〜1990/91）」、en の表「1982–1991」。→ 台本は「1982年から」「9シーズン」。
#   ・Ziggo の始まり：en の表「2014–」、nl 本文「2015年1月1日から」。→ 台本と表は2015年。
#   ・アディダス：en「2000年から」、nl の表は 2026-27 まで続く。→ 今季で27シーズン目（2000-01〜2026-27）。
#   ・金の星：nl「星1つが国内リーグ優勝10回。2011年5月15日に30回目、2011-12から星3つ」。
#   ・1987年のカップウィナーズカップ優勝：en の Honours（1986–87）。胸の TDK の期間内。
# ---- 自分で数えた数 ----
#   創立 1900→2026＝126年。白に赤い1本線 1911→2026＝115年＝115/126≒約91%。英雄の顔の紋章 1928→2026＝98年＝98/126≒約78%。
#   11本の線の顔 1991→2025＝34年。1928年の形の紋章 1928→1991＝63年＋2025年7月から。TDK 9シーズン。アディダス 27シーズン目。ABNアムロ 1991→2008＝17年。
# ---- 日本との接点 ----
#   最初の大きな胸の広告が日本の TDK（nl・en の表）。それ以外は入れない（今の在籍選手の話はしない）。
# 言わなかったもの：スタジアム・選手・今季の成績・上場の話（11/2 の財政回）・1894年の前身のクラブ・デザイナー名・CEO の名前。
