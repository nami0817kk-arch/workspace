sections:
- id: crest_back
  main: true
  heading: アヤックスの紋章は、なぜ昔の顔に戻ったのか
  bg: assets/images/20261129_kit_ajax/p_arena_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2024年11月17日に発表。125周年に、1928年の紋章を戻す。2025年7月1日から正式な紋章。胸に戻るのは34年ぶり
  card: *crest
  say:
  - text: 今回はアヤックス。オランダ、アムステルダムのクラブです。
    image: assets/images/20261129_kit_ajax/p_arena_w.jpg
    card: none
  - text: ここから先は、11月21日時点の話です。
    image: assets/images/20261129_kit_ajax/p_arena_w.jpg
    card: none
  - text: 2025年7月1日、アヤックスの紋章が替わりました。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
  - text: 新しい紋章ではありません。1928年の、古い紋章です。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: シャツの胸に戻ったのは、34年ぶりでした。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
    emph: true
    callword: 34年ぶり
  - text: 発表は、2024年11月17日。クラブの社長は、こう話しました。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card:
      type: document
      label: アヤックス 社長（CEO）の言葉（2024年11月17日）
      paragraphs:
      - ファンの多くが、何年も前からこの願いを大切にしてきたことを、私たちは知っています。125周年は、昔の紋章をファンと私たち自身に返す、最高の機会だと考えました。
      - 歴史が示しているように、私たちはアヤックスのDNAに忠実なときに、いちばん強い。
      highlight:
      - 125周年
      - DNAに忠実
  - text: ファンの多くが、何年も前から、願ってきたことだ、と。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
  - text: 2025年3月18日は、クラブの125歳の誕生日でした。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
  - text: その節目に、紋章を、ファンと自分たちに返す、と。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
  - text: もう1つの理由は、「アヤックスらしさ」です。
    image: assets/images/20261129_kit_ajax/p_arena_w.jpg
    card: none
    emph: true
  - text: らしさを守るときが、いちばん強い。歴史がそう示した、と。
    image: assets/images/20261129_kit_ajax/p_arena_w.jpg
    card: none
