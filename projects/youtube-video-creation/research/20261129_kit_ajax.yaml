    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card:
      <<: *view
      highlight_row: 2
  - text: 126年で割ると、約78%です。
    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card:
      type: calc
      title: 英雄の顔が紋章にある割合（自分で割った）
      terms:
      - - 98年
        - 英雄の顔
      - - 126年
        - 創立から
      - - 約78%
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 11本の線の顔は、そのうちの34年でした。
    image: assets/images/20261129_kit_ajax/p_kit_w.jpg
    card:
      <<: *view
      highlight_row: 3
    mark:
      kind: circle
      row: 3
  - text: 描き方は替わっても、英雄の顔は、一度も消えていません。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
  - text: シャツは規則から生まれ、紋章はファンの願いで戻りました。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
    emph: true
