- id: face
  heading: 紋章の顔は誰で、どう描き替えられたのか
  bg: assets/images/20261129_kit_ajax/p_arena_w.jpg
  tier: 背景
  narrator: 解説
  telop: 紋章の顔はギリシャ神話の英雄アイアス。1928年に紋章へ。1991年に11本の線で描いた顔に替わり、34年続いた
  card: *crest
  say:
  - text: 紋章の顔は、ギリシャ神話の英雄です。
    image: assets/images/20261129_kit_ajax/p_flag_w.jpg
    card: none
  - text: 名前は、アイアス。オランダ語で読むと、アヤックス。
    image: assets/images/20261129_kit_ajax/p_flag_w.jpg
    card: none
    emph: true
  - text: トロイア戦争を戦った、ギリシャ側の英雄です。
    image: assets/images/20261129_kit_ajax/p_flag_w.jpg
    card: none
  - text: クラブの名前も、この英雄から取りました。
    image: assets/images/20261129_kit_ajax/p_flag_w.jpg
    card: none
  - text: 創立は、1900年3月18日。最初の紋章は、選手の絵でした。
    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: 1911年に、形を少し変えます。
    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 英雄の顔が入ったのは、1928年です。
    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card:
      <<: *crest
      highlight_row: 2
    emph: true
  - text: 誰が描いたかは、分かっていません。
    image: assets/images/20261129_kit_ajax/p_old_w.jpg
    card: none
  - text: 1991年、紋章は、線で描いた顔に替わります。
    image: assets/images/20261129_kit_ajax/p_kit_w.jpg
    card:
      <<: *crest
      highlight_row: 3
  - text: 顔を描く線は、11本だけ。
    image: assets/images/20261129_kit_ajax/p_kit_w.jpg
    card: none
    emph: true
    callword: 11本の線
  - text: サッカーの1チーム、11人を表す線です。
    image: assets/images/20261129_kit_ajax/p_kit_w.jpg
    card: none
  - text: この紋章が、34年続きました。
    image: assets/images/20261129_kit_ajax/p_kit_w.jpg
    card: none
  - text: 2021年から22年のシーズン、昔の紋章が一度だけ胸に戻ります。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card: none
  - text: そして2025年、正式な紋章として、戻りました。
    image: assets/images/20261129_kit_ajax/p_fans_w.jpg
    card:
      <<: *crest
      highlight_row: 4
