- id: rise
  heading: ミランから分かれたインテルは、どうやって1度も落ちないクラブになったのか
  tier: 背景
  telop: 1908年にミランから分かれて創立。1909年から1部。1964年と65年は欧州王者、2010年は3冠
  narrator: 解説
  main: true
  say:
  - text: 1908年3月9日。ミランの選手が、外国人をもっと入れたいと、クラブを出ます。
    image: assets/backgrounds/stadium_インテル_in.png
    card:
      type: table
      title: インテルの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 1908年
        - ミランから分かれて創立
      - - 1910年
        - 初めてのリーグ優勝
      - - 1964年
        - 欧州王者（翌年も）
      - - 1993-94年
        - 13位。降格圏まで1点
      - - 2010年
        - 欧州王者・3冠
  - 名前は「インテルナツィオナーレ」。国際、という意味です。
  - 1909年から1部に入り、1910年に、初めてのリーグ優勝。
  - text: 1922年は、2部に落ちかけます。ただ、2度の入れ替え戦に勝って、残りました。
    card: none
    image: assets/backgrounds/stadium_インテル.png
  - 1960年代は、アルゼンチン人のエレニオ・エレーラ監督の時代です。
  - 1964年と65年は、ヨーロッパ王者に2年続けてなりました。
  - 1993年から94年は、13位。降格圏まで、勝ち点1でした。
  - それでも、2部には落ちません。
  - そして2010年。チャンピオンズリーグの優勝を含む、イタリア初の3冠を取りました。
  sources:
  - https://en.wikipedia.org/wiki/Inter_Milan
  bg: assets/backgrounds/stadium_インテル_in.png
  official: false
- id: japan
  heading: 長友佑都はインテルで、どんな時間を過ごしたのか
  tier: 背景
  telop: 2011年1月にチェゼーナから期限付きで加入。リーグ戦170試合9得点、2018年まで
  narrator: 解説
  say:
  - text: インテルでプレーした日本人に、長友佑都がいます。
    image: assets/images/sa_inter_nagatomo_w/scene.jpg
    card:
      type: table
      title: インテルと日本
      columns:
      - 年
      - 出来事
      rows:
      - - 2011年
        - チェゼーナから加入
      - - 2011年
        - コッパ・イタリア優勝
      - - 2018年
        - ガラタサライへ期限付き
  - 2011年1月、チェゼーナから、期限付きでインテルに加わりました。
  - 東アジアの選手がインテルと契約するのは、初めてでした。
  - 初ゴールは3月。ジェノアに5対2で勝った試合でした。
  - text: インテルでのリーグ戦は、**170試合9得点**。
    card: none
    image: assets/backgrounds/stadium_インテル_in.png
  - 2018年に、トルコのガラタサライへ移りました。
  sources:
  - https://en.wikipedia.org/wiki/Y%C5%ABto_Nagatomo
  bg: assets/backgrounds/stadium_インテル_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: クラブの色は黒と青。夜空の色で、青はミランの赤と反対。紋章のへびはミラノの街の紋章にも出る
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - クラブの色
      - 黒と青
    - - 青を選んだ理由
      - ミランの赤の反対
    - - 紋章
      - へび（ビショーネ）
  say:
  - text: クラブの色は、黒と青です。
    image: assets/photos/sa/inter/inter_manager_20cfeaa3.jpg
  - 愛称の「ネラッズーリ」も、ここから来ています。
  - 黒と青は、夜空の色。創立した3月9日が、夜だったからです。
  - 青は、ミランの赤と反対の色として選ばれました。
  - 紋章のへびは、ビショーネ。ミラノの街の紋章にも出てくる、へびです。
  sources:
  - https://en.wikipedia.org/wiki/Inter_Milan
  bg: assets/backgrounds/stadium_インテル_in.png
  official: false
- id: episode
  heading: 2010年、インテルはなぜ、イタリアのクラブで唯一の3冠を取れたのか
  tier: 背景
  telop: 2009-10年、リーグ・カップ・欧州の3冠。決勝でバイエルンに2対0
  narrator: 解説
  card:
    type: table
    title: 2009年から10年のシーズン
    columns: &id001
    - ''
    - ''
    rows:
    - - リーグ
      - 2位ローマに勝ち点2差
  say:
  - text: 2009年から10年。監督は、ジョゼ・モウリーニョでした。
    image: assets/backgrounds/stadium_インテル_in.png
  - 夏には、エトーをバルセロナから、スナイデルをレアル・マドリードから迎えます。
  - text: チャンピオンズリーグは、16強でチェルシーに2戦とも勝ちます。
    card:
      type: table
      title: 2009年から10年のシーズン
      columns: *id001
      rows:
      - - カップ
        - 決勝でローマに1対0
  - 準決勝は、グアルディオラのバルセロナ。第2戦は、10人で戦い抜きました。
  - 決勝は、マドリードでバイエルンに2対0。ミリートが2ゴールです。
  - text: リーグは、ローマに2点差で優勝。カップも、決勝でローマに1対0で勝ちました。
    card:
      type: table
      title: 2009年から10年のシーズン
      columns: *id001
      rows:
      - - 欧州
        - 決勝でバイエルンに2対0
  - 3つとも取ったイタリアのクラブは、インテルだけです。
  sources:
  - https://en.wikipedia.org/wiki/Inter_Milan
  bg: assets/backgrounds/stadium_インテル_in.png
  official: false
