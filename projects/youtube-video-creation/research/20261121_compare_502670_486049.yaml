# 取材メモ（11/21 土、シリーズ「比べる」、key: compare_502670_486049）。フヴィチャ・クヴァラツヘリア（パリ・サンジェルマン・25歳）×ジェレミー・ドク（マンチェスター・シティ・24歳）。
# **情報の時点は 2026-11-12**。FotMob・DataMB は使っていない。数字は Transfermarkt の API（2026-11-12 取得。控え: research/raw/20261119_kvara_tm.json・20261119_doku_tm.json）。
#   Transfermarkt 番号：クヴァラツヘリア 502670・ドク 486049。player・market-value-history・performance-season（2023〜2026季）を2.5秒あけて取得。
# **選んだ理由**：同じ左ウイング（TM の位置が2人とも Left Winger）で、市場価値は 1億4000万€ と 7500万€。昨季の出場時間は 2908分 と 2962分（ほぼ同じ）、今季は 618分 と 541分（足切り450分は超えるが1000分に届かず、台本で標本が小さいと断る）。
#   ウイングは得点だけで比べにくいので、TM の「出ている間のチームの得点」（teamGoalsOnThePitchSum）のうち本人の得点＋アシストが占める割合を自分で計算して軸にする。クラブの公式戦だけ（代表戦は混ぜない）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて。クヴァラツヘリアは 10/17・10/22 に単独の回、ドクは単独の回なし。比べるの回には両者とも未登場。
#   同じ日（11/21）の picks（選手紹介 ヴィルツ・バイエルンのユニフォーム・ナポリのスタジアム・名波浩）とは人もクラブも重ならない。11/19 の比べる（クバルシ×ハイセン）とも重ならない。
#   **外した候補**：ドク×ゴードン（ゴードンは 2026年夏にバルセロナへ。11/19 のクバルシと同じクラブになる）・ユルディズ×クヴァラツヘリア（ユルディズは 26/27 の出場69分）・サリバ（出場0分）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：パリ・サンジェルマン（リーグ・アン。TM の現所属 583、2025-01-17〜）・マンチェスター・シティ（プレミアリーグ。TM の現所属 281、2023-08-24〜）。
# **使った数**（TM の performance-season の、クラブのトップチームの公式戦だけ。代表戦は混ぜない）
#   クヴァラツヘリア：23/24 ナポリ 45試合 3594分 11点9A／24/25 ナポリ 19試合 1291分 5点3A＋PSG 32試合 2325分 8点8A（合計 51試合 3616分 13点11A）／25/26 PSG 48試合 2908分 19点11A／26/27 PSG 11試合 618分 2点1A（先発8）
#   ドク：23/24 シティ 43試合 2171分 6点11A／24/25 シティ 41試合 2231分 8点9A／25/26 シティ 47試合 2962分 8点14A／26/27 シティ 10試合 541分 1点1A（先発6）
#   出ている間のチームの得点・失点（TM、90分あたりに自分で割った値）：クヴァラツヘリア 25/26 得点71・失点33／2908分 → 2.20・1.02、26/27 得点9・失点9／618分 → 1.31・1.31
#     ドク 25/26 得点79・失点31／2962分 → 2.40・0.94、26/27 得点11・失点12／541分 → 1.83・2.00
#   計算：絡んだ割合＝（得点＋アシスト）÷ 出ている間のチームの得点。クヴァラツヘリア 25/26 30÷71＝42.3％、26/27 3÷9＝33.3％／ドク 25/26 22÷79＝27.8％、26/27 2÷11＝18.2％。90分あたり 30×90÷2908＝0.93、3×90÷618＝0.44／22×90÷2962＝0.67、2×90÷541＝0.33。
# 市場価値（TM）：クヴァラツヘリア 2023-12 8000万€→2024-06 8000万→2024-12 8500万→2025-06 9000万→2025-12 9000万→2026-06 1億4000万（最高）／ドク 2023-12 6500万€→2024-05 6500万→2024-12 6000万→2025-05 5000万→2025-12 6500万→2026-06 7500万（最高）
# 経歴（Wikipedia 英語版）：クヴァラツヘリア 2025年1月17日にPSGが発表、移籍金は7000万€＋最大1000万€（報道）。PSGでCL2連覇、2026年3月からジョージア代表主将。ドク 2023年8月にレンヌからシティへ6500万€（報道）、2026年8月16日のコミュニティ・シールドでふくらはぎを痛め、9月20日に復帰（途中出場）。
# 写真：k1 Commons（PSG 24/25 のウォームアップ、CC。解像度が低い 624x882）・d2・d3 Commons（ベルギー代表 2026年、Bryan Berlin、CC BY-SA 4.0）。pair_a〜d は pairphoto。k2（2022、普段着）・d1（旧写真）は未使用。
