        - ["上田綺世", "後半34分に1点"]
        - ["リール", "リーグ戦で今季初黒星"]
    say:
      - ニースに1対2。リールはリーグ戦で今季初めての黒星でした。
      - 上田のゴールは、後ろから来たボールを**背中に当てて前へ流し**、左足でGKの股下を抜いたものです。
      - 移籍して4試合で**3ゴール**。数字だけ見れば、文句のつけようがありません。
    sources:
      - https://web.gekisaka.jp/news/world/detail/?459305-459305-fl
