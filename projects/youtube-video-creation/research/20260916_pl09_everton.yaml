sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称の由来は、村にあったキャンディ屋
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年"]
        - ["最初の名前", "St. Domingo's FC"]
        - ["改名", "1879年11月"]
        - ["愛称", "The Toffees（トフィーズ）"]
    say:
      - "このクラブの愛称は、**村のキャンディ屋**から来ています。"
      - 「トフィーズ」。エヴァートン村にあった、マザー・ノブレットのトフィー店だと伝わっています。
      - ほかにも呼び名があります。「ザ・ブルーズ」、そして「**科学の学校**」。
      - もうひとつ、「**人々のクラブ**」とも呼ばれます。
      - 創設は1878年。最初の名前は「セント・ドミンゴズ」でした。教会のチームです。
      - 1879年11月に、いまの名前へ変わりました。その土地の名前です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: move
    heading: 133年いた家を出た
    main: true
    tier: 背景
    telop: グディソン・パークから、ヒル・ディキンソンへ
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["1892年-2025年", "グディソン・パーク"]
        - ["2025-26年から", "ヒル・ディキンソン・スタジアム"]
        - ["収容人数", "52,888人"]
    say:
      - "**133年いた家を、去年出ました。**"
      - それまでいたのはグディソン・パーク。**1892年**からの本拠地です。
      - 新しい家は、ヒル・ディキンソン・スタジアム。2025年から26年のシーズンに開きました。
      - 収容人数は**5万2888人**。プレミアリーグでも大きいほうに入ります。
      - このクラブを離れてから、**12年近く**が経っていました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: record
    heading: 1部にいた年数
    tier: 背景
    telop: 1部で123シーズン。イングランドの記録
    narrator: キャスター
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1部在籍", "123シーズン（記録）"]
        - ["リーグ優勝", "9回（初優勝は1890-91年）"]
        - ["FAカップ", "5回（最後は1995年）"]
        - ["ヨーロッパ", "1985年のカップウィナーズカップ"]
    say:
      - 1部で戦ったのは**123シーズン**。イングランドの記録です。
      - 途切れずに1部にいた長さでは、2番目になります。
      - リーグ優勝は9回。最初は1890年から91年でした。
      - FAカップは5回で、最後が1995年です。
      - ヨーロッパのタイトルは1つ。1985年のカップウィナーズカップです。
      - 決勝でラピード・ウィーンを3対1で下しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: founding
    heading: 2つのリーグを作った側
    tier: 背景
    telop: フットボールリーグも、プレミアリーグも
    narrator: 解説
    card:
      type: table
      title: 創設メンバーだった2つ
      columns: ["", ""]
      rows:
        - ["1888年", "フットボールリーグ"]
        - ["1992年", "プレミアリーグ"]
        - ["その間", "104年"]
    say:
      - このクラブは、**2つのリーグの創設メンバー**です。
      - ひとつは1888年のフットボールリーグ。
      - もうひとつは1992年のプレミアリーグです。
      - 100年の間を空けて、どちらの始まりにもいました。
      - 今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: コールマンが引退。腕章はターコウスキーへ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "デイビッド・モイーズ"]
        - ["主将", "ジェームズ・ターコウスキー（CB・イングランド）"]
        - ["就任", "今季から。コールマンの引退を受けて"]
        - ["エース", "ティエルノ・バリー（FW・フランス）"]
        - ["今季", "4点でチーム最多"]
    say:
      - "**今季から腕章の持ち主が変わりました。**長く主将だったシェイマス・コールマンが引退したためです。"
      - 巻いているのはジェームズ・ターコウスキー。イングランド人のセンターバックです。
      - エースはティエルノ・バリー。フランス人のセンターフォワードで、今季4点。
      - 昨季は8点でチーム2番手でした。**去年の2番手が、今年の得点源に回ってきた**形です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 最後にリーグを制したとき、胸には日本企業の名前があった
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "9回（直近 1986-87）"]
        - ["FAカップ", "5回（直近 1994-95）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回（1984-85）"]
        - ["胸スポンサー", "NEC（1985年-1995年）"]
    say:
      - "**最後にリーグを制したとき、このクラブの胸には日本企業の名前がありました。**"
      - "1985年から1995年までの10年間、スポンサーは日本の**NEC**です。"
      - 1部優勝の直近は**1986年から87年**。ちょうど、その10年のあいだに入っています。
      - 39年前の、最後の頂点でした。
      - 獲ってきたのは1部優勝9回に、FAカップ5回。それにヨーロッパのタイトルが1つです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
