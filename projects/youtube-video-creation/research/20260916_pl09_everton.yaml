sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称の由来は、村にあったキャンディ屋
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年"]
        - ["最初の名前", "St. Domingo's FC"]
        - ["改名", "1879年11月"]
        - ["愛称", "The Toffees（トフィーズ）"]
    say:
      - アルファベット順では、9番目に来ます。
      - 創設は1878年。最初の名前は「セント・ドミンゴズ」でした。教会のチームです。
      - 1879年11月に、いまの名前へ変わりました。その土地の名前です。
      - 愛称は「トフィーズ」。**キャンディ**のことです。
      - 由来は、エヴァートン村にあった**マザー・ノブレットのトフィー店**だと伝わっています。
      - ほかにも呼び名があります。「ザ・ブルーズ」、そして「**科学の学校**」。
      - もうひとつ、「**人々のクラブ**」とも呼ばれます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: move
    heading: 133年いた家を出た
    main: true
    tier: 背景
    telop: グディソン・パークから、ヒル・ディキンソンへ
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["1892年-2025年", "グディソン・パーク"]
        - ["2025-26年から", "ヒル・ディキンソン・スタジアム"]
        - ["収容人数", "52,888人"]
    say:
      - このクラブは、去年**家を移しました。**
      - それまでいたのはグディソン・パーク。**1892年**からの本拠地です。
      - 133年です。
      - 新しい家は、ヒル・ディキンソン・スタジアム。2025年から26年のシーズンに開きました。
      - 収容人数は**5万2888人**。プレミアリーグでも大きいほうに入ります。
      - 監督はデイビッド・モイーズ。2025年1月に戻ってきました。
      - このクラブを離れてから、**12年近く**が経っていました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: record
    heading: 1部にいた年数
    tier: 背景
    telop: 123シーズン。イングランドで2番目に長い
    narrator: キャスター
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1部在籍", "123シーズン（記録）"]
        - ["リーグ優勝", "9回（初優勝は1890-91年）"]
        - ["FAカップ", "5回（最後は1995年）"]
        - ["ヨーロッパ", "1985年のカップウィナーズカップ"]
    say:
      - このクラブの数字で、いちばん重いのは在籍年数です。
      - 1部で戦ったのは**123シーズン**。イングランドの記録です。
      - 途切れずに1部にいた長さでは、2番目になります。
      - リーグ優勝は9回。最初は1890年から91年でした。
      - FAカップは5回で、最後が1995年です。
      - ヨーロッパのタイトルは1つ。1985年のカップウィナーズカップです。
      - 決勝でラピード・ウィーンを3対1で下しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: founding
    heading: 2つのリーグを作った側
    tier: 背景
    telop: フットボールリーグも、プレミアリーグも
    narrator: 解説
    card:
      type: table
      title: 創設メンバーだった2つ
      columns: ["", ""]
      rows:
        - ["1888年", "フットボールリーグ"]
        - ["1992年", "プレミアリーグ"]
        - ["その間", "104年"]
    say:
      - このクラブは、**2つのリーグの創設メンバー**です。
      - ひとつは1888年のフットボールリーグ。
      - もうひとつは1992年のプレミアリーグです。
      - 100年の間を空けて、どちらの始まりにもいました。
      - 今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝9回（直近 1986-87）、FAカップ5回（直近 1994-95）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "9回（直近 1986-87）"]
        - ["FAカップ", "5回（直近 1994-95）"]
        - ["リーグカップ", "0回（準優勝2回）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回（1984-85）"]
    say:
      - 数えると、大きなタイトルで**15個**あります。
      - 内訳は1部優勝9回、FAカップ5回、それにヨーロッパが1つです。
      - "ただし**リーグカップだけは、一度も獲っていません。**決勝には2度立っています。"
      - 1部優勝の直近は**1986年から87年**。39年前です。
      - 日本との関わりも、ひとつあります。スポンサーです。
      - "1985年から1995年までの10年間、胸にあったのは日本の**NEC**でした。"
      - "そして**最後のリーグ優勝は、その10年のあいだ**にあります。"
      - 1986年から87年。日本の企業の名を胸に付けて、このクラブは最後の頂点に立ちました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
