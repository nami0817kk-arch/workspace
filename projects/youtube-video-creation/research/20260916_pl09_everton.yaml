# プレミアリーグ20クラブ紹介 ⑨エヴァートン（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **写真は取れなかった。**新旧どちらのスタジアムも Wikimedia の検索で
# 出てこなかった（2026-09-16）。**エンブレムで作る。**
#
# 引きは**「133年いた家を、去年出た」**。ここが山場（@main）
#
# **2026-09-18 ユーザー指示で書き直した。**「アルファベット順では9番目」の行を消し、
# 各節の1行目をその節でいちばん引きの強い事実に入れ替えた。
# 優勝の節は「獲ったやつだけ」にし、リーグカップ0回の行と
# 「一度も獲っていない」の列挙を落として、NECと最後のリーグ優勝の話から入る形にした。
#
# **2026-09-18 ユーザー指示（もっと興味を引く形に）で、さらに足した。**
#   ・タイトルとサムネを「丸数字＋クラブ名＋そのクラブの引き」に変えた（20本とも同じ名札だった）
#   ・**宿敵（rival）**の節を足した。出て行った家からリヴァプールが生まれた話で、タイトルの引きもここ
#   ・**このクラブを語る3人（legends）**の節を足した（出典は英語版Wikipedia）
format: news
voice_min: 0
slot: premier_1
date: "2026年9月16日"

people:
  - エヴァートン

short_title: "エヴァートンとはどんなクラブか"

theme:
  id: pl_clubs_09_everton
  league: england
  league_name: プレミアリーグ
  kind: other
  topic: エヴァートン
  title: エヴァートン。出て行った家から宿敵が生まれた理由とは
  hook: リヴァプールとは、もとは同じ場所にいました。
  question: どんなクラブなのか

thumbnail:
  line1: 出た家から宿敵が生まれた
  line2: エヴァートン
  crest_main:
    - エヴァートン
  tags: []
  points: []

sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称の由来は、村にあったキャンディ屋
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年"]
        - ["最初の名前", "St. Domingo's FC"]
        - ["改名", "1879年11月"]
        - ["愛称", "The Toffees（トフィーズ）"]
    say:
      - "このクラブの愛称は、**村のキャンディ屋**から来ています。"
      - 「トフィーズ」。エヴァートン村にあった、マザー・ノブレットのトフィー店だと伝わっています。
      - ほかにも呼び名があります。「ザ・ブルーズ」、そして「**科学の学校**」。
      - もうひとつ、「**人々のクラブ**」とも呼ばれます。
      - 創設は1878年。最初の名前は「セント・ドミンゴズ」でした。教会のチームです。
      - 1879年11月に、いまの名前へ変わりました。その土地の名前です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: move
    heading: 133年いた家を出た
    main: true
    tier: 背景
    telop: グディソン・パークから、ヒル・ディキンソンへ
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["1892年-2025年", "グディソン・パーク"]
        - ["2025-26年から", "ヒル・ディキンソン・スタジアム"]
        - ["収容人数", "52,888人"]
    say:
      - "**133年いた家を、去年出ました。**"
      - それまでいたのはグディソン・パーク。**1892年**からの本拠地です。
      - 新しい家は、ヒル・ディキンソン・スタジアム。2025年から26年のシーズンに開きました。
      - 収容人数は**5万2888人**。プレミアリーグでも大きいほうに入ります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 空いた家を使うために、リヴァプールが作られた
    narrator: 解説
    card:
      type: table
      title: マージーサイド・ダービー
      columns: ["", ""]
      rows:
        - ["相手", "リヴァプール"]
        - ["1892年", "理事たちがアンフィールドを去る"]
        - ["その跡地に", "リヴァプールFCが作られた"]
        - ["初の公式戦", "1894年10月13日（エヴァートンが3-0）"]
    say:
      - 宿敵は**リヴァプール**。呼び名は**マージーサイド・ダービー**です。
      - そもそも、この2つは同じ場所から分かれたクラブです。
      - エヴァートンは1884年から、**アンフィールド**を本拠にしていました。
      - ところが1892年、会長で地主のジョン・ホールディングと、ほかの理事たちが対立します。
      - 理事たちはアンフィールドを去り、スタンリー・パークの反対側へ移りました。
      - 残されたホールディングは、**空いたアンフィールドを使うためにリヴァプールFCを作ります。**
      - つまり宿敵は、このクラブが空けた場所に生まれたクラブです。
      - 公式戦で初めて当たったのは**1894年10月13日**。エヴァートンが3対0で勝ちました。
      - プレミアリーグが始まってからは、**退場者がいちばん多いカード**でもあります。
      - そのリヴァプールは、**今季もプレミアリーグにいます。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Merseyside_derby
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 383得点のディーン、751試合のサウソール、シャープ
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ディクシー・ディーン", "433試合383得点（クラブ最多得点）"]
        - ["ネヴィル・サウソール", "751試合（クラブ最多出場）"]
        - ["グレアム・シャープ", "426試合159得点"]
    say:
      - まず**ディクシー・ディーン**。1925年から1937年まで、公式戦433試合で383得点です。
      - 注目してほしいのは1927年から28年。このシーズンだけで、リーグ戦**60得点**を挙げました。
      - イングランド1部の1シーズン最多得点で、**いまも破られていません。**
      - 次に**ネヴィル・サウソール**。1981年から1998年までのゴールキーパーです。
      - 公式戦751試合はクラブ最多出場。1984年から85年には、FWAの年間最優秀選手にも選ばれました。
      - 3人目は**グレアム・シャープ**。1980年から1991年で426試合159得点。
      - 1984年10月、アンフィールドでの唯一の得点を決めた人です。1970年以来の勝利でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Dixie_Dean
      - https://en.wikipedia.org/wiki/Neville_Southall
      - https://en.wikipedia.org/wiki/Graeme_Sharp
  - id: record
    heading: 1部にいた年数
    tier: 背景
    telop: 1部で123シーズン。イングランドの記録
    narrator: キャスター
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1部在籍", "123シーズン（記録）"]
        - ["リーグ優勝", "9回（初優勝は1890-91年）"]
        - ["FAカップ", "5回（最後は1995年）"]
        - ["ヨーロッパ", "1985年のカップウィナーズカップ"]
    say:
      - 1部で戦ったのは**123シーズン**。イングランドの記録です。
      - 途切れずに1部にいた長さでは、2番目になります。
      - リーグ優勝は9回。最初は1890年から91年でした。
      - FAカップは5回で、最後が1995年です。
      - ヨーロッパのタイトルは1つ。1985年のカップウィナーズカップです。
      - 決勝でラピード・ウィーンを3対1で下しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: founding
    heading: 2つのリーグを作った側
    tier: 背景
    telop: フットボールリーグも、プレミアリーグも
    narrator: 解説
    card:
      type: table
      title: 創設メンバーだった2つ
      columns: ["", ""]
      rows:
        - ["1888年", "フットボールリーグ"]
        - ["1992年", "プレミアリーグ"]
        - ["その間", "104年"]
    say:
      - このクラブは、**2つのリーグの創設メンバー**です。
      - ひとつは1888年のフットボールリーグ。
      - もうひとつは1992年のプレミアリーグです。
      - 100年の間を空けて、どちらの始まりにもいました。
      - 今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: コールマンが引退。腕章はターコウスキーへ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "デイビッド・モイーズ"]
        - ["主将", "ジェームズ・ターコウスキー（CB・イングランド）"]
        - ["就任", "今季から。コールマンの引退を受けて"]
        - ["エース", "ティエルノ・バリー（FW・フランス）"]
        - ["今季", "4点でチーム最多"]
    say:
      - "**今季から腕章の持ち主が変わりました。**長く主将だったシェイマス・コールマンが引退したためです。"
      - 巻いているのはジェームズ・ターコウスキー。イングランド人のセンターバックです。
      - エースはティエルノ・バリー。フランス人のセンターフォワードで、今季4点。
      - 昨季は8点でチーム2番手でした。**去年の2番手が、今年の得点源に回ってきた**形です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 最後にリーグを制したとき、胸には日本企業の名前があった
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "9回（直近 1986-87）"]
        - ["FAカップ", "5回（直近 1994-95）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回（1984-85）"]
        - ["胸スポンサー", "NEC（1985年-1995年）"]
    say:
      - "**最後にリーグを制したとき、このクラブの胸には日本企業の名前がありました。**"
      - "1985年から1995年までの10年間、スポンサーは日本の**NEC**です。"
      - 1部優勝の直近は**1986年から87年**。ちょうど、その10年のあいだに入っています。
      - 39年前の、最後の頂点でした。
      - 獲ってきたのは1部優勝9回に、FAカップ5回。それにヨーロッパのタイトルが1つです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Everton_F.C.
