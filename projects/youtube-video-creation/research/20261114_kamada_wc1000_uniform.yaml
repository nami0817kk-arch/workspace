# 出典で確かめたこと（2社の記事が合う）:
#   ・FIFAミュージアム（スイス・チューリヒ。2016年開館。サッカーキングは2016年2月）は13日、鎌田が2026年W杯北中米大会で着たユニフォームをコレクションに加えたと発表した。
#   ・収蔵されたのは6月20日のグループリーグ（グループF）第2戦、チュニジア戦で着たユニフォーム。この試合が1930年に始まったW杯の通算1000試合目にあたる（2社とも）。日本は鎌田の開始4分の先制点などで4-0（ゲキサカ：上田綺世の2得点、伊東純也のゴール）。
#   ・ユニフォームには記念の特別ステッカーが貼られ、背面には「原因不明の白いシミ」（ゲキサカ）／「白い染み」（サッカーキング）が残る。FIFAミュージアムはステッカーも、試合中に付いたとみられるシミも取り除かず、当時の状態のまま保存している（ゲキサカ）。サッカーキングは「サッカーの歴史を本来の姿のまま後世へ残す博物館の姿勢」と書く。
#   ・「原因不明」はゲキサカの語。シミが何かは、記事のどこにも書かれていない→台本は記事の範囲だけ（原因の推測は書かない）。
# ESPN（fifa.world, event=760449）で確かめたこと: Tunisia 0-4 Japan、キックオフ 2026-06-21T04:00Z＝現地6月20日夜（会場 Estadio BBVA）。得点: 4分 鎌田（アシスト 中村敬斗）、31分 上田（アシスト 板倉滉）、69分 伊東（アシスト 上田）、83分 上田（ヘディング。アシスト 佐野海舟）。上田2得点は記事と合う。
# 1000試合目の確認: 記事は2社とも「通算1000試合目」。ESPN の日程を6/11の開幕から日付順に数えると、この試合は2026年大会の36試合目。2022年大会までの通算964試合（一般に知られる数）に36を足すと1000で、記事と合う。台本には「2026年大会の36試合目」（ESPNの日程）までを書き、964は書かない。
# 食い違い: なし。ゲキサカの見出しの「メモリアル弾」は鎌田の4分の先制点のこと。ESPN で4分が試合の最初の得点だが、記事の語ではないので台本は「先制点」で通す。サッカーキング見出しの「歴史的一着」は、1着のユニフォームの意味。
