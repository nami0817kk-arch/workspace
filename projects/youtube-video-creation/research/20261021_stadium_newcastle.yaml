# スタジアム紹介シリーズ：ニューカッスルの本拠地（セント・ジェームズ・パーク、10/21）。雛形は 10/20 エティハドの回。
# 軸：A＝収容5万2729席はプレミア7位／B＝街の真ん中にあって動けなかった（借地・近隣の反対・1995年の移転案が1997年に断念→1998〜2000年に同じ場所で増築）。
# 収容：PL公式ハンドブック2026/27（Ground Capacity at start of the Season）から20クラブを再抽出して検算（取得2026-10-21）。
#   74,158(マンU) / 62,850(トッテナム) / 61,276(リヴァプール) / 61,038(シティ) / 60,704(アーセナル) / 52,769(エヴァートン) / 52,729(ニューカッスル) / 48,095(サンダーランド) / 40,044 / 37,633 / 36,887 / 32,609 / 32,176 / 31,212 / 30,294 / 28,107 / 25,194 / 24,983 / 17,250 / 12,357。
#   52,769-52,729=40／52,729-48,095=4,634／74,158-52,729=21,429（自分で引いた）。ピッチ 105×68m（同ハンドブック）。
# 昨季の入場（同ハンドブック 2025/26 表）：ニューカッスル 19試合 平均52,143 合計990,709 稼働率99.8%（ウェストハム99.9%に次いで20クラブ中2位）。
#   控え research/raw/20261021_nufc_plhandbook.txt。※最多入場は ハンドブック=52,253(サンダーランド戦) 対 PL公式試合API=52,514(エヴァートン戦) で割れるので台本では言わない。
# 今季の入場（PL公式試合API、ホーム4試合）：52,630 / 52,643 / 52,647 / 52,626。合計210,546、平均52,636.5。52,637÷52,729=99.8%。52,729-52,647=82。控え research/raw/20261021_nufc_matches_pl_api.json。
# 自分で数えた：52,339-36,610=15,729／52,729÷36,610=1.44／64.5-58=6.5／68,386（1930年・Wikipedia）に対し52,729は77%。
# 割れる点（台本で「割れる」と言った）：1998〜2000年の増築費 4600万ポンド(市の記録)/4200万(Wikipedia)／増築後の収容 52,339(市の記録)/52,143(Wikipedia)／
#   1995年の新競技場案 7万席(市の記録・カースル・リーズ)/5万5000席・6500万ポンド(Wikipedia・リーズ公園)／断念の年 1997(市の記録) 対 Wikipedia は1998年7月に増築許可。
#   言わなかった割れ：今のWikipediaの収容欄 52,719/52,750／クラブ公式サイトの建設費4300万ポンド（検索の要約にだけ出て本文は読めなかった）。
# 確度：持ち主＝Wikipediaの記載（ニューカッスル市）。歴史は市の遺産記録(sitelines.newcastle.gov.uk HER 9939)・Wikipedia＝背景。公式ハンドブックの数字＝報道止まりにしない（リーグ公式の資料）。
# 重なりを避けた：10/19 の「ニューカッスルのユニフォーム」回（エンブレム・ストライプ）、エティハド回のハンドブック順位表そのもの・転用工事、オールド・トラッフォード回の1948年8万3260、アンフィールド回の1.5倍・238席・572席。
# 読めなかった：newcastleunited.com の「History of our home」(404)。ブラウザ操作・JS実行は不使用（requests と WebFetch・WebSearch の題名とURLだけ）。
# 写真：assets/images/20261021_stadium_newcastle/（Commons、出典は credits.json）。01=空撮 02=内側（上段から）03以降=別の角度 05=2012年の試合中の客席。人物は特定していない。
