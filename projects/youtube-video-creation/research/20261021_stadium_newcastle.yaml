  say:
  - text: 競技場は、もとは、傾いた原っぱでした。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card: none
  - text: 最初に土地を借りたのは、1880年10月。ニューカッスル・レンジャーズです。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card:
      <<: *id_land
      highlight_row: 0
  - text: 北から南へ大きく傾き、肉屋が家畜を放していた、と市の記録は書きます。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card: none
  - text: 1892年、のちのユナイテッドが、借地を引き継ぎました。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_land
      highlight_row: 1
  - text: 1898年。近所の住民は、試合日の騒ぎを理由に、市へ追い出しを求めます。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_land
      highlight_row: 2
  - text: それでも1899年、市などの土地を、4エーカー足して借りました。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_land
      highlight_row: 3
  - text: 1922年、クラブは土地の買い取りを試みます。
    emph: true
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_land
      highlight_row: 4
  - text: 土地を共有する市民団体は売ると言い、市は、拒みました。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 買えないまま、1971年に、市が99年の借地を認めます。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_land
      highlight_row: 5
  - text: 持ち主は、いまも、ニューカッスル市とされます。
    emph: true
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  sources:
  - https://sitelines.newcastle.gov.uk/SMR/9939
  - https://en.wikipedia.org/wiki/St_James%27_Park
- id: blocked
  heading: なぜ、増築の許可は、何度も下りなかったのか
  bg: assets/images/20261021_stadium_newcastle/01_w.jpg
  tier: 背景
  telop: 1905年に収容6万人。1929年も1958年も許可が下りず、1967年の建て替え案は実らなかった
  narrator: 解説
  card: &id_blk
    type: timeline
    title: 増築が止まった年（ニューカッスル市の記録）
    rows:
