  - text: 1993年から95年、競技場は、全席の座席に作り直されました。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card: none
  - text: 費用は、2350万ポンド。収容は、3万6610席。
    emph: true
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card:
      <<: *id_move
      focus: 0
  - text: いまより、1万6119席少ない数です。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card:
      <<: *id_move
      focus: 0
  - text: それでも、年間席を待つ人が、2万人いました。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card:
      <<: *id_move
      focus: 1
  - text: そこで、新しい競技場を、近くの公園に建てる案が、出ます。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 市の記録は、7万席の案と書きます。ウィキペディアは、5万5000席です。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 場所は、リーズ公園。もとは、市民団体が持つ共有地、タウン・ムーアの一部でした。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 反対運動が起きます。公園の友の会と、ほかの市民団体です。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 集まった署名は、3万6000筆。当時の収容と、ほぼ同じ数です。
    emph: true
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_move
      focus: 2
  - text: この案は、1997年に、断念されました。
    emph: true
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card: none
