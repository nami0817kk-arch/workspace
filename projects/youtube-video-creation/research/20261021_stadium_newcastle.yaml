  - text: 大きく積み上がったのは、北側のリーズ・エンドと、西側のミルバーン・スタンドです。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 東側と、南のゴール裏は、客席が1層のままです。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: だから、上空から見ると、高さが、そろっていません。
    emph: true
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 北と西の屋根の張り出しは、64.5メートル。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: オールド・トラッフォードの58メートルより、6.5メートル長い。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: &id_roof
      type: calc
      title: 屋根の張り出しの差（自分で引いた）
      terms:
      - - 64.5m
        - ニューカッスル
      - - 58m
        - オールド・トラッフォード
      - - 6.5m
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 欧州で最長の張り出し、とウィキペディアは書きます。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 今季のハンドブックは、5万2729席です。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
