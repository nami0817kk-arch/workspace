    - - 1929年
      - 座席は5000、立ち見が4万8000
    - - 1958年
      - スタンドの許可が、また下りない
    - - 1967年
      - 全面建て替えの模型。実現せず
    - - 1973年
      - 東スタンドが完成。3400席
    focus: 1905年
    highlight_row: 0
  say:
  - text: 次は、増築の歴史です。1905年に、戻ります。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card: none
  - text: 1905年、競技場は、大きく建て替えられました。収容は、6万人。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card:
      <<: *id_blk
      highlight_row: 0
  - text: いまより、7271席多い数です。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card: none
  - text: 新しい西スタンドの座席は、4655席。ほかは、立ち見でした。
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card: none
  - text: 1929年。座席は5000で、屋根のない立ち見が、4万8000。
    emph: true
    image: assets/images/20261021_stadium_newcastle/05_w.jpg
    card:
      <<: *id_blk
      highlight_row: 1
  - text: 同じころ、東側の屋根と、ゴール裏の2階建て席は、許可が下りませんでした。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card: none
  - text: 1958年。スタンドの許可は、また下りません。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card:
      <<: *id_blk
      highlight_row: 2
  - text: クラブは、別の場所のゴスフォースへ移る案も、考えました。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card: none
  - text: 1967年。市と設計会社が、全面建て替えの模型を、発表します。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card:
      <<: *id_blk
      highlight_row: 3
  - text: 費用は、260万ポンド。実現しませんでした。
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: クラブが、借地の期間が短い土地に、投資したがらなかったからです。
    emph: true
    image: assets/images/20261021_stadium_newcastle/01_w.jpg
    card: none
  - text: 99年の借地が決まり、1973年、ようやく東スタンドが完成します。
    image: assets/images/20261021_stadium_newcastle/02_w.jpg
    card:
      <<: *id_blk
      highlight_row: 4
  sources:
  - https://sitelines.newcastle.gov.uk/SMR/9939
  - https://en.wikipedia.org/wiki/St_James%27_Park
