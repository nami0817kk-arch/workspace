- id: land
  heading: この土地は、誰のもので、クラブはどう使ってきたのか
  bg: assets/images/20261021_stadium_newcastle/01_w.jpg
  tier: 背景
  telop: 1880年に貸し出された原っぱ。1922年の買い取りは市が拒み、1971年に99年の借地
  narrator: 解説
  card: &id_land
