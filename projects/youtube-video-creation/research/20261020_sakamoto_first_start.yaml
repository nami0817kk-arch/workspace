# 坂元達裕の取材メモ（2026年10月20日・ショートだけ・見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-20。requests で原文を読んだ（research/raw/20261020_sak_*.txt）。
#   ・ゲキサカ 2026-10-20 05:58「トッテナムが待望の今季初白星で最下位脱出、コベントリー坂元達裕はプレミア初先発で好機演出も3連勝ならず」
#     https://web.gekisaka.jp/ （記事全文＋Opta の出場表）。坂元の部分: プレミア初先発・4-2-3-1の右サイドハーフ・最終ラインまで落ちて守備・
#     前半8分に右からカットインして左足クロス・10分にファンエバイクとのワンツーからPA中央で左足シュート（ブロック）・後半33分（=78分）までプレー。
#     「カラバオカップでは2試合連続スタメン、リーグ戦では第2節と前節の途中出場のみ。7試合目で初先発」。
#   ・ESPN の試合記録（summary event=401879257。research/raw/20261020_sakamoto_summary.json）：先発・右のアタッキングミッドフィールダー・78分にハマーと交代・
#     シュート1・被ファウル2・ファウル1。スコア 3-1（マディソン14分、ルドーニ49分、マーモウシュ58分、デイヴィス90+6分）と一致。
#   ・ランパード監督の言葉は ESPN の英語原文（research/raw/20261020_sak_espn_50222119.txt）。**英語原文を自分で訳した**ので台本で「英語の原文を訳した」と断る。
#     発言は試合全体への評価で、坂元個人への言葉ではない（坂元本人の言葉は無い）。
# 使わないもの:
#   ・ゲキサカの「3試合ぶりの黒星」は数が合わない（呼び出し元で確認済み）ので使わない。
#   ・ESPN の本文は「キンスキーが坂元のクロスを防いだ／ファン・デ・フェンがシュートを逸らした」と書くが、ゲキサカの「ブロック」と細部が違う。
#     台本は「クロス」「左足シュートはブロックされた」まで（ゲキサカ＋U-NEXT の投稿文と一致する範囲）。
#   ・トッテナム側の話（マディソン536日ぶり先発・クルゼフスキ復帰など）は同日の「トッテナム初勝利」の本が扱うので言わない。坂元の動きだけ。
# 10/19 以前の坂元のショート（10/19 ランパード監督の言葉＝試合前の内容）とは重ならない：今回は試合中の動きだけ。「出番が2試合」は言わない。
# 反応: 0件（探していない・作らない）。確度: 報道（ゲキサカ＋ESPN の試合記録で確かめた）。
# 写真: Commons CC0「File:Tatshurio Sakamoto.png」（968x1147・2024-11-02・MilesaMFC）1枚だけ。三通りの縦切り（_v）を行ごとに回す。子ども2人が写っている自撮りで、
#   縦切りには少年の顔が入る（寄っても外せない）。引き伸ばしは縦で 1.67倍・1.98倍・1.98倍。
