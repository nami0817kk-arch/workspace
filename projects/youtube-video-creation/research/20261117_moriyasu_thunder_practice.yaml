#           ゲキサカ 2026-11-16「森保J「最後の練習」中止が決定…雷雨に見舞われた森保監督「私らしいなと」」 https://web.gekisaka.jp/news/japan/detail/?463332-463332-fl
# 写真の出どころ（森保監督の写真。_pool.png を目で見て、伊東・別の選手・ウォーターマーク入りの1枚は外した）:
#   https://www.soccer-king.jp/news/japan/national/20261116/2228397.html
#   https://web.gekisaka.jp/news/japan/detail/?463291-463291-fl
#   https://web.gekisaka.jp/news/japan/detail/?463120-463120-fl
