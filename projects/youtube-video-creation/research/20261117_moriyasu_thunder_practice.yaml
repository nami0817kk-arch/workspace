# 出典で確かめたこと:
#   ・森保監督の発言（サッカーキング。字は変えない）:
#       「どう見てもすぐに天候が変わる感じでもないですし、今日練習をやるのは難しいかなと。取りやめて、違う方向でコンディション作りした方がベストかなと思ったので、切り替えてやります」
#       「ミーティングもしっかりとやれています。ピッチ上での練習もそうですけど、コミュニケーションを取っていて、基本的には予定としてスタメンは伝えているので、しっかりといい準備ができると思います」
#       「選手たちも『今できることをしっかりやって、明日の試合につなげよう』と言ってくれました。自然現象には勝てないので、今できることをいつものようにしっかりやっていきたい」
#   ・ゲキサカ: 16日夕、現地の練習施設で前日練習の予定。開始約1時間前に激しい雷雨。選手はいったん練習場に到着し、バスで待機したあと室内調整に変更。練習開始予定から30分が過ぎた午後5時半ごろ、
#       監督が自ら報道陣に中止を説明。雷雨は1時間以上続くとみられ、「ケガのリスクを考えてしないほうがいいと判断した」。見出し・本文とも「私らしいなと」と苦笑い（本文は「私らしいなと」で引用）。
#       過去のアクシデント（ゲキサカの整理）: 2018年9月の新体制初陣が北海道胆振東部地震で中止／新型コロナによる東京五輪延期／来年1〜2月のアジア杯延期。常々「想定外を想定内に」と口にしてきた。
#   ・サッカーキング: 中2日のパラグアイ戦に向け、練習は15日の一回のみ。ブラジル戦に先発した選手・長い時間プレーした選手は、48時間はあまり上げない方針なので今日の休みは良い。
#       （サッカーキング本文の冒頭に「11月17日に予定されていた…練習」と読める記述があったが、ゲキサカは16日夕の前日練習としており、16日が正しいと判断）
#   ・ESPN の試合データ: ブラジル戦 fifa.friendly event=401916337 は 2026-11-14 10:15 UTC。パラグアイ戦 event=401916336 は 2026-11-17 13:10 UTC＝日本時間 22:10（Scheduled）。
# 自分で数えたもの: ブラジル戦のキックオフからパラグアイ戦のキックオフまで 74時間55分（約75時間）。記事の「中2日」と一致。ゲキサカが挙げた過去のアクシデントは3つ。
# 前の本との重なり: 20261115_moriyasu_brazil_world_top／20261114_moriyasu_best_worst_game（ブラジル戦の評価）。→ 今回の初出: 練習中止の経緯と「自然現象には勝てない」「私らしいな」。
# 【言わないこと】大幅な入れ替えの話（別の回で扱う）／先発の予想／アジア杯延期の詳しい経緯。
# 本人の言葉: あり（森保一。サッカーキング・ゲキサカ）。Y。
