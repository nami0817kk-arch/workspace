# 代表チーム紹介 ブラジル代表（10/21 作成。固定シリーズ9「代表チーム紹介」の最初の1本）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **重なりの注意**：同じ題材を 2026-10-06 に公開済み（scripts/20261006_team_brazil.md、動画 HSa-DlmLm98、題「ブラジル代表ってどんなチーム？W杯で日本の先制をひっくり返した5度の王者」）。
#   この回は固定シリーズの型（7節）で作り直した別の組み立て。公開するか、別の国（アルゼンチン・フランス・スペイン）に替えるかはユーザーが決める。
# ---- 公式で確かめたこと（2026-10-20 取材。WebFetch・requests。検索のAI要約は根拠にしていない）----
#  ・FIFAランク：FIFA 公式（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain、2026-10-07）＝ブラジル6位（1つ下がる）、ポルトガルが5位、スペイン1位。点数は記載なし。次は11月18日。
#    FIFA のブラジルのページ（7/20 更新）は5位・1804.92点。→ 6位は FIFA の記事、点数は書かない。
#  ・日本との通算：JFA 対戦チーム情報（2025-10-09）＝13戦0勝2分11敗（5得点35失点）。JFA マッチレポート（2025-10-14）＝14度目で日本が3-2、通算1勝2分11敗。
#    JFA マッチレポート（2026-06-29 W杯ラウンド32）＝日本1-2ブラジル。→ 15戦1勝2分12敗。10/6 の JFA 対戦チーム情報（別セッションの控え）は 1勝12敗2分（9得点39失点）で一致（5+3+1=9、35+2+2=39）。
#  ・日本戦の中身：2025-10-14 東京スタジアム 44,920人、前半0-2、26分パウロ・エンリケ・32分マルティネッリ、後半52分南野・中村敬斗・71分上田。W杯ラウンド32 は前半29分に佐野海舟、56分カゼミーロ、後半アディショナルタイムにマルティネッリ。
#  ・全大会出場・優勝5度は史上最多・優勝年1958/62/70/94/2002：JFA（2025-10-09）。「ワールドカップで唯一、1930年の第1回大会から全22大会に参加」→ 2026年大会で23大会目。
#  ・日本との次の試合：JFA 2026年日程＝11/14（土）MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE、シンガポールナショナルスタジアム（キックオフ時刻の記載なし）。
#  ・9月の招集（ge.globo.com 2026-09-09）：26人、初招集8人、国内クラブ10人、W杯敗退後の最初の招集。ヴィニシウス・エンドリッキ（レアル）、ラフィーニャ（バルセロナ）、エストヴァン（チェルシー）、ブルーノ・ギマランイス・ガブリエウ・マガリャンイス（アーセナル）、マルキーニョス（PSG）。
# ---- ウィキペディア(en)の値（公式で確かめられていない。台本は「ウィキペディア」と断らず事実の言い方で、ただし下の数は検算した）----
#  ・1950 ウルグアイに1-2（引き分けでも優勝）、1954 の新ユニフォーム・白をやめた／1958 ペレ・自国の大陸の外で初優勝／1970 6戦全勝／1971–93 を「最初の空白」／2002 決勝は横浜でドイツに2-0・ロナウド2点／
#    2014 準決勝1-7／2022 準々決勝クロアチアに1-1からPK負け／2026 ベスト16でノルウェーに1-2・準々決勝に進めないのは1990年以来36年ぶり／アンチェロッティ就任（CBF 発表 2025-05-12、ウィキペディアは 5/26 就任）。
#  ・W杯2026 の試合：6/13 モロッコ1-1、6/19 ハイチ3-0、6/24 スコットランド3-0、6/29 日本2-1、7/5 ノルウェー1-2（10/6 の控えの FIFA 試合データと一致）。
#  ・日本との試合の古い所：2006 W杯 日本1-4、2013 コンフェデ杯 0-3、2022-06-06 親善 0-1（ネイマールのPK）。2020年以降は3戦（1勝2敗・4得点5失点）。
#  ・年齢：生年月日（ウィキペディア）から2026-10-20 時点で計算（ヴィニシウス 2000-07-12=26、ラフィーニャ 1996-12-14=29、エストヴァン 2007-04-24=19、ブルーノ 1997-11-16=28、ガブリエウ 1997-12-19=28、マルキーニョス 1994-05-14=32）。
# ---- 自分で数えた数（検算した）----
#  ・2019年まで 12戦：13戦（0勝2分11敗・5得点35失点）から2022年の0-1を除く＝0勝2分10敗・5得点34失点。1試合 得点0.4・失点2.8。
#  ・2020年から 3戦：1勝0分2敗（2022 0-1、2025 3-2、2026 1-2）・4得点5失点。1試合 得点1.3・失点1.7。3戦とも1点差。
#  ・優勝の空白：1970→1994＝24年。2002→2026＝24年。次の大会 2030 まで優勝がなければ 28年。
# ---- 言わないもの ----
#  ・ネイマールの代表引退（ウィキペディアだけ）／この秋の親善3試合の結果（ウィキペディア・FotMob）／スコア以外の主将の入れ替わり／背番号／日本の「初勝利」という言い切り（1996年のアトランタ五輪の試合は A マッチでないので、「国際Aマッチで1勝」と書く）。
# ---- 写真（assets/images/20261021_team_brazil/、出典は credits.json。Commons CC BY-SA 4.0、撮影者 Bryan Berlin・YantsImages。代理店・放送映像は使っていない）----
#  b01 アンチェロッティ、b02 マルキーニョス、b03 ラフィーニャ、b04 カゼミーロ、b06 集合写真、b07 アリソン、vini_wide2 ヴィニシウス。人名はファイル名の通り（背番号・腕章で確認）。
