- id: viewpoint
  viewpoint: true
  heading: 日本との差は縮まったのか。ブラジルは世界一に戻れるのか
  tier: 背景
  telop: 失点は2.8から1.7へ。優勝の空白は24年
  narrator: 解説
  card: &id_vp
    type: table
    title: 日本対ブラジル 2020年を境に（1試合あたり）
    columns:
