  say:
  - text: 見立てを、数字で2つ。まず、日本との差です。
    image: assets/images/20261021_team_brazil/b06_team.jpg
    card: *id_vp
  - text: 2019年までの12戦は、0勝2分10敗。1試合の失点は、2.8でした。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 2020年からの3戦は、1勝2敗。1試合の失点は、1.7に減りました。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 3
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 3戦とも、1点差です。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: ただ、日本が勝ったのは親善試合です。
    image: assets/images/20261021_team_brazil/b04_casemiro_w.jpg
    card: none
  - text: ワールドカップは、2006年も2026年も、ブラジルが勝っています。
    card: none
  - text: もう1つは、優勝のない年数です。
    image: assets/images/20261021_team_brazil/b02_marquinhos_w.jpg
    card: &id_vp2
      type: table
      title: 優勝のない年数
      columns:
      - 期間
      - 年数
      rows:
      - - 1970年から1994年
        - 24年
      - - 2002年から2026年
        - 24年
      - - 2030年まで続けば
        - 28年
  - text: 1970年から94年は、24年。2002年から今年まで、これも24年です。
    card:
      <<: *id_vp2
      highlight_row: 1
  - text: いまのブラジルは、前の空白と、同じ長さに並びました。
    card:
      <<: *id_vp2
      highlight_row: 1
  - text: 次のワールドカップは、2030年。
    card:
      <<: *id_vp2
      highlight_row: 2
  - text: そこで優勝できなければ、空白は28年。最長を更新します。
    card:
      <<: *id_vp2
      highlight_row: 2
  - text: 11月14日のシンガポールは、日本が縮めた差を、もう一度測る試合になります。
    image: assets/images/20261021_team_brazil/b01_ancelotti_w.jpg
