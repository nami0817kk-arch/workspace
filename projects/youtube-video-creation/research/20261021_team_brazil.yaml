- id: hook
  heading: 日本は、ブラジルと15回戦って何回勝ったのか
  main: true
  tier: 確定
  official: true
  telop: 日本は15戦で、国際Aマッチの勝ちは1回
  narrator: 解説
  say:
  - text: 日本はブラジルと15回戦って、国際Aマッチの勝ちは**1回**。2分け**12敗**です。
    image: assets/stats/tb_brazil_data_r1.png
    no_telop: true
    emph: true
  - text: ブラジルの勝ちは12回。日本の勝ちの、12倍です。
    image: assets/stats/tb_brazil_data_r1.png
    no_telop: true
  - text: 数えるのは、国際Aマッチだけ。五輪の試合は入れません。
    image: assets/stats/tb_brazil_data_r1.png
    no_telop: true
  - text: 次の試合は、11月14日。シンガポールです。
    image: assets/stats/tb_brazil_data_r1.png
    no_telop: true
  - text: 今年6月のワールドカップでも、決勝トーナメントの1回戦で当たりました。
    image: assets/stats/tb_brazil_data_r2.png
    no_telop: true
  - text: 結果は、日本の1対2の負け。後半のアディショナルタイムに、決勝点を決められました。
    image: assets/stats/tb_brazil_data_r2.png
    no_telop: true
  sources:
  - https://www.jfa.jp/samuraiblue/news/00035604/
  - https://www.jfa.jp/samuraiblue/news/00035627/
  - https://www.jfa.jp/samuraiblue/news/00036487/
  - https://www.jfa.jp/samuraiblue/schedule_result/2026.html
- id: data
  heading: ブラジル代表は、どんな数字を持つ国なのか
  tier: 確定
  official: true
  telop: ブラジル代表の基礎DATA
  narrator: 解説
  say:
  - text: ブラジル代表のフィファランクは**6位**。10月7日に出た、最新の順位です。
    image: assets/stats/tb_brazil_data0.png
    no_telop: true
  - text: ワールドカップの優勝は**5回**。1958年、62年、70年、94年、2002年。史上最多です。
    image: assets/stats/tb_brazil_data1.png
    no_telop: true
  - text: 監督は、イタリア人のアンチェロッティ。2025年5月に就任しました。
    image: assets/stats/tb_brazil_data4.png
    no_telop: true
  - text: 主将は、パリ・サンジェルマンのマルキーニョス。
    image: assets/stats/tb_brazil_data5.png
    no_telop: true
  - text: 愛称は、カナリーニョ。小さなカナリアという意味で、ほかにセレソンとも呼ばれます。
    image: assets/stats/tb_brazil_data6.png
    no_telop: true
  sources:
  - https://inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain
  - https://www.jfa.jp/samuraiblue/news/00035604/
  - https://en.wikipedia.org/wiki/Brazil_national_football_team
- id: history
  heading: ブラジルは、いつ頂点に立ち、いつ遠ざかったのか
  tier: 背景
  telop: 1950年の敗戦から、優勝5回。そして24年の空白
  narrator: 解説
  card: &id_histA
    type: timeline
    title: 優勝の時代
    rows:
    - - 1950年
      - 地元の決勝リーグで1対2。逆転負け
    - - 1958年
      - 初優勝。自国の大陸の外で初めて
    - - 1970年
      - 6戦全勝で3度目の優勝
    - - 1994年
      - 24年ぶりの優勝
    - - 2002年
      - 日韓大会で5度目。決勝は横浜
    focus: 1950年
  say:
  - text: ブラジルは、ワールドカップの第1回大会から、すべての大会に出ています。
    image: assets/images/20261021_team_brazil/b06_team.jpg
    card: none
  - text: 最初の転機は、1950年。地元開催の大会です。
    card:
      <<: *id_histA
      highlight_row: 0
  - text: 決勝リーグの最終戦。引き分けでも優勝でした。
    card:
      <<: *id_histA
      highlight_row: 0
  - text: ところが、ウルグアイに**1対2**で逆転されます。
    card:
      <<: *id_histA
      highlight_row: 0
  - text: この敗戦のあと、白だったユニフォームをやめ、黄色と緑に変わります。
    image: assets/images/20261021_team_brazil/b04_casemiro_w.jpg
    card: none
  - text: 1958年。スウェーデン大会で、ペレのいたブラジルが初優勝します。
    card:
      <<: *id_histA
      highlight_row: 1
  - text: 自分の大陸の外で優勝した、史上初の国です。
    card:
      <<: *id_histA
      highlight_row: 1
  - text: 1970年は、6戦全勝で3度目の優勝。史上最強のチームと、いまも言われます。
    card:
      <<: *id_histA
      highlight_row: 2
  - text: そのあと、優勝から遠ざかります。次の優勝は、1994年。**24年**あとです。
    emph: true
    card:
      <<: *id_histA
      highlight_row: 3
  - text: 2002年は、日本と韓国の共催大会。決勝は横浜でした。
    image: assets/images/20261021_team_brazil/b02_marquinhos_w.jpg
    card:
      <<: *id_histA
      highlight_row: 4
  - text: ドイツに2対0。ロナウドが2点を決めて、5度目の優勝です。
    card:
      <<: *id_histA
      highlight_row: 4
  - text: それから24年。ブラジルは、まだ6度目の優勝をしていません。
    emph: true
    card: &id_histB
      type: timeline
      title: 遠ざかった24年
      rows:
      - - 2014年
        - 自国開催の準決勝で、ドイツに1対7
      - - 2022年
        - 準々決勝でクロアチアにPK負け
      - - 2026年
        - ベスト16でノルウェーに1対2
      focus: 2014年
  - text: 2014年は、地元の準決勝で、ドイツに**1対7**。
    card:
      <<: *id_histB
      highlight_row: 0
  - text: ワールドカップで、いちばん大きな敗戦です。
    card:
      <<: *id_histB
      highlight_row: 0
  - text: 2022年は、準々決勝でクロアチアに、1対1からのPK戦で敗れました。
    card:
      <<: *id_histB
      highlight_row: 1
  - text: 2026年は、ベスト16でノルウェーに1対2の負け。
    card:
      <<: *id_histB
      highlight_row: 2
  - text: 準々決勝に進めなかったのは、1990年以来、36年ぶりです。
    card:
      <<: *id_histB
      highlight_row: 2
