  say:
  - text: アンチェロッティ監督は、前はレアル・マドリードを率いていた人です。
    image: assets/images/20261021_team_brazil/b01_ancelotti_w.jpg
    card: none
  - text: 6月のワールドカップは、グループを2勝1分けで通過。
    card:
      <<: *id_wc
      highlight_row: 0
  - text: ハイチとスコットランドには、どちらも3対0の勝ち。
    card: *id_wc
  - text: 5試合で10得点、失点は4。1試合の平均は、得点2.0、失点0.8。
    card: *id_wc
  - text: 決勝トーナメントは、日本に2対1の勝ち。次の試合が、ノルウェー戦でした。
    card:
      <<: *id_wc
      highlight_row: 4
  - text: 大会のあと、最初の招集は9月9日。26人のうち、8人が初めて呼ばれました。
    image: assets/images/20261021_team_brazil/b03_raphinha_w.jpg
    card: none
  - text: ブラジル国内のクラブからは、10人。監督は、次の世代を探す、と話しています。
    image: assets/images/20261021_team_brazil/b07_alisson_w.jpg
    card: none
  - text: 9月から10月は、親善試合が3つ。オーストラリアとインドが相手でした。
    card: none
  - text: そして次が、11月14日の、日本との試合です。
    image: assets/images/20261021_team_brazil/b06_team.jpg
    card: none
