sections:
  - id: what
    heading: 電話で伝えたこと
    tier: 報道
    telop: 初招集の発表前に、ジダンがムバッペへ電話した
    narrator: キャスター
    say:
      - フランス代表の新しい監督、ジネディーヌ・ジダン。
      - 初めての招集リストを出す前に、キリアン・ムバッペと**電話で個別に話しました**。
      - voice: ジダン
        text: ムバッペは私の主将になる。彼は攻撃の3つのポジションすべてでプレーできる
      - voice: ジダン
        text: 私個人としては、左の方が好みだ
      - 主将は4人決まりました。**1人目がムバッペ、2人目がデンベレ、3人目がラビオ、4人目がクンデ**です。並びは代表に入った順です。
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
  - id: left
    main: true
    heading: 左に置く
    tier: 報道
    telop: 代表の左ウイングで32試合21得点16アシスト
    narrator: 解説
    card:
      type: table
      title: ムバッペの左ウイング（代表）
      columns: ['', '']
      rows:
        - [試合, 32]
        - [得点, 21]
        - [アシスト, 16]
        - [最後の先発, 2024年ユーロ準決勝]
    say:
      - text: 'フランス代表の新しい監督ジダンが、初めての招集を出す前にムバッペへ電話し、主将を任せることと、左で使う考えを伝えました。'
        short_only: true
      - ムバッペがこの2年、レアル・マドリードでもフランス代表でも務めてきたのは**センターフォワード**でした。
      - ジダンが考えているのは、センターフォワードではなく**左ウイング**です。
      - 代表デビューの2017年3月25日から、ムバッペが左ウイングで出たのは**32試合**。**21得点16アシスト**です。
      - 左で先発した最後の公式戦は、**2024年のユーロ準決勝、スペイン戦**。真ん中はコロ・ムアニで、2対1で敗れて大会を去りました。
      - 火曜、ムバッペは**インフルエンザ**でクレールフォンテーヌの練習を1人だけ外れました。水曜の午前に戻り、ジダンのもとで初めて練習しています。
      - 金曜のトルコ戦は、ムバッペが左、**真ん中はウスマン・デンベレ**の見込みです。
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
  - id: around
    heading: 周りのこと
    tier: 報道
    telop: 主将は4人。火曜は本人だけ練習を外れた
    narrator: キャスター
    say:
      - ムバッペは守備の労を惜しむ、という言われ方をされてきました。それについて、ジダンははっきり否定しています。
      - voice: ジダン
        text: それは誤りだ
      - 自分がどういう監督かも、短く言い切りました。
      - voice: ジダン
        text: 私は競争者だ。それを選手たちに伝えたい
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
