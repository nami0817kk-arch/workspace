sections:
  - id: call
    main: true
    heading: 電話で言われたこと
    tier: 報道
    telop: 「ムバッペは私の主将になる」
    narrator: キャスター
    say:
      - text: 'フランス代表の新しい監督は、ジネディーヌ・ジダン。初めての招集をめぐる話です。'
        short_only: true
        image: assets/images/20260924_pair_zidane/01.jpg
      - フランス代表の新しい監督、ジネディーヌ・ジダン。名簿を出す前に、まずキリアン・ムバッペへ**電話をかけました**。
      - 1つめは、腕章の話です。
      - voice: ジダン
        text: ムバッペは私の主将になる。彼は攻撃の3つのポジションすべてでプレーできる
      - そしてもう1つ。どこで使うか、という話でした。
      - voice: ジダン
        text: 私個人としては、左の方が好みだ
      - ムバッペがこの2年、クラブでも代表でも務めてきたのは**センターフォワード**。真ん中です。
      - その真ん中ではなく、**左**。電話で伝えられたのは、この2つでした。
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
  - id: why
    heading: なぜ左なのか
    tier: 報道
    telop: 代表の左ウイングで32試合21得点16アシスト
    narrator: 解説
    card:
      type: table
      title: ムバッペの左ウイング（代表）
      columns: ['', '']
      rows:
        - [試合, 32]
        - [得点, 21]
        - [アシスト, 16]
        - [最後の先発, 2024年ユーロ準決勝]
    say:
      - "2017年の代表デビューから、ムバッペが左ウイングで出たのは**32試合**。**21得点16アシスト**です。"
      - 左で先発した最後の公式戦は、**2024年のユーロ準決勝、スペイン戦**。真ん中はコロ・ムアニ。フランスは2対1で敗れ、大会を去りました。
      - 金曜のトルコ戦は、ムバッペが左、**真ん中はウスマン・デンベレ**の見込みです。
      - 主将にはムバッペ。そのあとを任されるのが、**デンベレ、ラビオ、クンデ**の3人です。
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
  - id: around
    heading: 練習場で、もう1つ
    tier: 報道
    telop: 「守備をしない」という言われ方を、はっきり否定した
    narrator: キャスター
    say:
      - 火曜、ムバッペは**インフルエンザ**で代表の練習を1人だけ外れています。水曜の午前に戻り、ジダンのもとで初めて練習しました。
      - その練習の前後で、ジダンはもう1つ、言い切っています。ムバッペは守備の労を惜しむ、という言われ方についてです。
      - voice: ジダン
        text: それは誤りだ
      - 自分がどういう監督かも、短く言い切りました。
      - voice: ジダン
        text: 私は競争者だ。それを選手たちに伝えたい
    sources:
      - https://as.com/futbol/internacional/plan-zidane-para-mbappe-f202609-n/
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 左でいい、という声が多かった
    narrator: キャスター
    say:
      - voice: ネット民
        text: エムバペは左の方がいい。真ん中に置くと前線の全てのスペースを潰してしまうので邪魔になる
      - voice: ネット民
        text: 左に固定すれば、オリーセやデンベレがドリブルで真ん中のスペースに入りやすくなる
      - voice: ネット民
        text: マドリーでは、中のスペースを使いたいベリンガムやバルベルデの邪魔になってる
      - voice: ネット民
        text: エンバペに真ん中やらせると、どっちにしろ左に偏るから左ウイングが腐るんだよね
      - voice: ネット民
        text: 守備しないからなぁ。左サイドで守備しなかったら、相手の右のフルバックがフリーで攻撃参加してくるからな
      - voice: ネット民
        text: エンバペが左に入るなら、左のボランチとサイドバックには、カバーリングに長けた選手を配置したいな
      - voice: ネット民
        text: リーダーではない選手。昔と違ってトップが守備のスイッチになってるから、トップでは使いたくないんだろう
      - voice: ネット民
        text: アンリもセンターより、左ウイングのエリアを軸にプレーしてた方が全然良かった
      - voice: ネット民
        text: エンバペも左にいた方が、フランスの怖さがだせるだろうな
      - voice: ネット民
        text: 代表はこういった監督好みの使い方が出来るのが利点ですね
      - voice: ネット民
        text: エンバペは左以外ない。ジダンは絶対に上手く扱う
      - voice: ネット民
        text: ジダンが左サイドで最適解を見せたら、レアルでもヴィニとの最適解をいい加減に見つけないといけないよね
      - voice: ネット民
        text: 世界一の選手が、代表でもクラブでもベストポジションでプレー出来てないってのも皮肉なもんだなぁ
        short_voice: true
    sources:
