# 取材メモ（10/1 題材⑪ guardiola_letter、型は quote）。材料の控え: research/raw/20261001_guardiola_letter.md
# 主役はグアルディオラの手紙と、その言葉が何を意味するか。前日に「有罪の正式発表」の題材は×なので、判決の中身は1節（verdict）だけ。
# 事実の裏:
#   手紙: 9/30、本人が SNS に投稿（Guardian・Sky・beIN が全文を引用。Guardian と Sky は一字一句同じ）。
#     "I want every single Manchester City fan across the world to know I am here; more than ever. I am, always have been,
#     always will, be behind my club, my owner, my chairman, Ferran, the players, staff, Enzo [Maresca] and you, our unique
#     supporters. Let me be clear: we will get through this together. I love you all."
#     投稿先は Instagram／X と割れるので「SNS」とだけ言う。MARCA のスペイン語訳は「オーナー」が抜けている（使わない）。
#   認定: プレミアリーグ公式（9/29）。対象 2009-10〜2017-18 の9季。財務規則の重大な違反の告発はすべて有罪。
#     見せかけのスポンサー契約で、スポンサー料の残りをオーナー側（ADUG）が出していた。罰は別の審理。上訴は10月2日（金）まで。
#     金額は PL「£900m 超」と Sky「£830m」で割れるので言わない。告発の件数も言わない。
#   名前: オーナー＝シェイク・マンスール、会長＝ハルドゥーン・アル・ムバラク、フェラン＝ソリアーノ最高経営責任者
#     （Guardian「グアルディオラをイングランドに招いた人。2人はバルセロナで一緒に働いていた」）、エンツォ＝マレスカ監督（今夏から）。
#   バーンスタイン元会長（1998〜2003年）: Guardian の引用。
#   20冠: 英語版Wikipedia の Honours（リーグ6・FA杯3・リーグ杯5・シールド3・CL1・スーパー杯1・クラブW杯1）。Guardian・beIN も20。
#     監督は 2016-17〜2025-26 の10季。対象の9季と重なるのは 2016-17・2017-18 の2季（Guardian「最初の2季」）。
#     その2季のタイトルは 2017-18 のリーグ優勝（勝ち点100、最初のリーグ優勝）とリーグ杯の2つ。
#     対象の9季のシティのリーグ優勝は 2011-12（マンチーニ）・2013-14（ペジェグリーニ）・2017-18（グアルディオラ）の3回。
#     退任後は City Football Group のグローバル・アンバサダー（Guardian）。
#   2022年5月の発言: Sportskeeda（2022-05-08）・footballtransfers（2023-02-06、「5月7日」）・Sports Mole（2026-09-26）。
#     "I said to them: 'If you lie to me, the day after I am not here. I will be out and I will not be your friend any more.'"
#     題の出来事より前の発言だが、手紙の「ここにいる」が何を意味するかに答えるので入れる（見立ての節）。
# 反応: 海外2件（Bluesky）・日本1件（X、Yahoo!リアルタイム検索）。出どころと外したものは raw に控えた。
# 流れの点検（Claude が自分で読んだ。控え output/flow/20261001_guardiola_letter.md）で直したこと:
#   元会長の話から20冠へ飛ぶ → 「手紙を書いた本人も、この9季と無関係ではありません」を前に置いた／「同じ日」がどの日か曖昧 → 「一方、」に
#   「という中身」が分かりにくい → 「認定では、スポンサーが払うはずの額の一部を、オーナー側が出していました」／誰が認定したかを声で言う
#   「9季に入る」→「9季のあいだに取った」／「グループの大使」→「シティの親会社のグループで、大使」／リーグ優勝3回の2行を1行に
#   結びの「最初の優勝が認定の9季に入る人」は言い直しなので落とした。「2009-10季」「2017-18季」は読みが崩れる（kana で実測）ので声では年で言う
# 写真: 記事の写真は Guardian が PA、MARCA・Sky・beIN はクレジットが無く確かめられないので取り込まない。
#   Commons の 2023-10-04 ライプツィヒ対シティの会見の1枚（Steffen Prößdorf、CC BY-SA 4.0）。被写体の記載が無く portrait が
#   弾いたので手で取り、目で本人と確かめた。_w は頭が入る位置で 16:9 に切ったもの。
