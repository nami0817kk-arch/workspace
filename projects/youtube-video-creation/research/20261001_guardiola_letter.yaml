  narrator: キャスター
  say:
  - text: マンチェスター・シティが9月29日、プレミアリーグの財務規則の違反で有罪と認定されました。
    short_only: true
  - text: 今夏にシティを去ったグアルディオラが、その翌日、ファンに向けて言葉を投稿しました。
    image: assets/images/20261001_guardiola/01_w.jpg
  - voice: グアルディオラ
    text: 世界中のシティのファン一人ひとりに、知っておいてほしい。
  - voice: グアルディオラ
    text: 私はここにいる。今まで以上に。
    cont: true
  - voice: グアルディオラ
    text: 私はいまも、これまでも、これからも支え続ける。
    cont: true
  - voice: グアルディオラ
    text: 私のクラブを、オーナーを、会長を、フェランを、
    cont: true
  - voice: グアルディオラ
    text: 選手とスタッフを、エンツォを、
    cont: true
  - voice: グアルディオラ
    text: そして唯一無二のサポーターのみんなを。
    cont: true
  - voice: グアルディオラ
    text: はっきり言っておく。私たちは、一緒にこれを乗り越える。
    cont: true
  - voice: グアルディオラ
    text: みんなを愛している
    cont: true
