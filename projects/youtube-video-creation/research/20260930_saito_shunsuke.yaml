# 取材メモ（9/30 題材 key=saito_shunsuke）。起点は Football Tribe Japan 9/29 の記事。
# ■ 関心の元『Expected Birmingham』（xB）について
#   英国のサポーター個人（Substack の著作表示 Ryan Murphy、自己紹介「Football data, Blues bias.」）が書くデータ分析のニュースレター。
#   クラブの記者・公式ではない。記事一覧 142本（2025-11〜2026-09-27）と Notes を requests で全部読んだが、
#   齋藤俊輔（Saito）に触れた記事は無かった。ベネズエラ戦（9/28）当日の発信は X の投稿と思われるが、X は読めなかった。
#   → FT の「バーミンガムは…関心を示している」は、クラブの動きではなくブログ筆者の推しの可能性がある。確度は 未確認。
#   同じサイトは Westerlo の坂本一彩（2026-03-04）、フェリ（2026-04-18）も「候補」として書いている（獲得には至っていない）。
# ■ 本人の言葉の元『Het nieuwsblad』のインタビュー
#   nieuwsblad.be / gva.be は 403 で読めなかった。PressReader にある Gazet van Antwerpen 9/19 の記事
#   「Tegen Barcelona spelen, dat is een mooie challenge」（同じ Mediahuis 系）は、STVV 戦（9/20）の2日前に
#   木村誠二・坂本一彩・齋藤の3人がそろって取材を受けた記事らしいが、本文は読めなかった（403）。
#   検索の要約では「鎌田・伊東・遠藤の名を挙げたのは木村」とも読めた（未確認。AI要約なので根拠にしない）。
#   FT は齋藤の言葉としている。台本は FT の日本語訳のまま、齋藤の言葉として置く（要確認として報告）。
#   発言の時期は「代表デビュー（9/28）より前」までしか言えない（FT は「先日」、GvA は 9/19）。
#   題の出来事（9/29 の関心の報道）より前の発言だが、題そのもの（移籍志向）に答えるので例外として置く。
# ■ 数字
#   齋藤：FotMob（1611437）今季リーグ7試合すべて先発、518分、3得点0アシスト、評点7.32。25-26（1月加入）17試合1得点1アシスト 評点6.59。
#     得点は 8/30 ズルテ・ワレヘム戦（2-2、直接FK＝サッカーキング 8/31）と 9/5 メヘレン戦（0-4 勝、2得点）。契約は2029年6月まで。
#     ベルギーの一部の記事は「6試合4得点」と書くが、FotMob の試合記録ではゲンク戦の1点はオウンゴール（スメッツ）。3得点で数える。
#   バーミンガム：FotMob のチャンピオンシップ順位表（9/29 取得）8試合 2勝5分1敗 得失点+1 勝点11、24チーム中10位。
#   ベルギー→英国の日本人：英語版 Wikipedia の各選手の所属歴。
#     遠藤航 STVV 2018-20 → シュツットガルト 2019-23 → リヴァプール 2023
#     鎌田大地 STVV（期限付き）2018-19 → フランクフルト → ラツィオ 2023-24 → クリスタル・パレス 2024
#     三笘薫 ユニオン（ブライトンから期限付き）2021-22 → ブライトン
#     橋岡大樹 STVV 2021-24 → ルートン 2024（1部）
#     坂元達裕 オーステンデ 2022-23 → コヴェントリー 2023（当時2部）
#     （冨安 STVV→ボローニャ→アーセナル、鈴木彩艶 STVV→パルマ→ヴィラ もイタリア経由。表には載せない）
# ■ 9/29「新顔5人」の回では、齋藤のカットインのシュート2本と前半での交代に触れている。ここでは試合の中身は言わない。
