  - 2部のバーミンガム・シティが、関心を示しているというのです。
  - 伝えたのは、バーミンガムを応援する個人のデータ分析サイト。クラブの記者ではありません。
  - 左サイドの攻撃役、ウイングで、内側でもプレーできる。イングランドで通用する質がある、と紹介しました。
  - クラブ自身の動きは、まだ確かめられていません。
