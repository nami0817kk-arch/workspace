  takeaway: 齋藤が手本に挙げた鎌田と遠藤は、ベルギーからドイツを経て4〜5年でイングランド1部に届いた。ベルギーから英国へ直接渡った日本人は三笘・橋岡・坂元の3人で、坂元はバーミンガムと同じ2部だった。今季7試合3得点、173分に1点のペースが冬まで続くかで、近道を選べるかが決まる
