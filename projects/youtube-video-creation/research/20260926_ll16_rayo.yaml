  say:
  - 2011年の初め、クラブを持つ企業グループが経営に行き詰まります。
  - 選手たちは、シーズンのあいだずっと給料を受け取れませんでした。
  - text: ファンは寄付やシャツの売り上げを集め、働く人たちの給料に回しました。
    card:
      type: table
      title: 給料が出ないまま1部へ
      columns: *id003
      rows:
      - - 2011年5月
        - 8年ぶりの1部昇格
  - それでも2部で2位を守り、**8年**ぶりに1部へ戻りました。
  sources:
  - https://es.wikipedia.org/wiki/Rayo_Vallecano_de_Madrid
  - https://en.wikipedia.org/wiki/Rayo_Vallecano
  bg: assets/backgrounds/stadium_ラージョバジェカーノ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 前から奪う。安く集める。8年鳴らした秒読みの曲
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 前から奪いに行く
    - - 運営の型
      - 22人中7人が移籍金なし
    - - クラブの気質
      - 8年鳴らした秒読みの曲
  say:
  - text: サン・ホセ監督のチームは、前から奪いに行く。最初から最後まで、それが考え方だと話します。
    image: assets/photos/ll/rayo/rayo_manager_c03b3eca.jpg
  - ピッチの外は、安く集める型。
  - 昨シーズンの登録選手**22人**のうち、**7人**は移籍金なし。最も高くて**800万ユーロ**です。
  - しぶとさも気質。2003年の降格のあと、ゴールの曲を「ファイナル・カウントダウン」に。
  - 1部へ戻る秒読みのはずが、戻るまで**8年**。曲は今もゴールのたびに流れます。
  sources:
  - https://en.wikipedia.org/wiki/Rayo_Vallecano
  - https://www.marca.com/futbol/rayo/2026/09/19/benat-san-jose-descansaremos-justo-necesario.html
  - https://en.wikipedia.org/wiki/2025%E2%80%9326_Rayo_Vallecano_season
  - https://es.wikipedia.org/wiki/Rayo_Vallecano_de_Madrid
  bg: assets/backgrounds/stadium_ラージョバジェカーノ_in.png
  official: false
- id: episode
  heading: 85歳の女性の家賃
  tier: 背景
  telop: 家を追われた女性を、監督と選手が支えた
  narrator: 解説
  card:
    type: table
    title: 85歳の女性の家賃
    columns:
    - ''
    - ''
    rows:
    - - 2014年11月
      - 85歳の女性が家を追われる
    - - 監督と選手
      - 新しい家の家賃を払う
  say:
  - 2014年11月、バジェカスで**85歳**の女性が、50年以上住んだ家を追われました。
  - その日の練習で、パコ・ヘメス監督が選手に持ちかけたのは、彼女を助けることでした。
  - 監督と選手とクラブは、彼女の新しい家の家賃を払うと約束しました。
  sources:
  - https://es.wikipedia.org/wiki/Rayo_Vallecano_de_Madrid
  - https://en.wikipedia.org/wiki/Rayo_Vallecano
  bg: assets/backgrounds/stadium_ラージョバジェカーノ_in.png
  official: false
