- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 初めての欧州の決勝と、7試合7得点のエース
  narrator: キャスター
  say:
  - text: 昨シーズン、クラブ初の欧州の決勝へ。鎌田大地のいたクリスタル・パレスに**0対1**。
    image: assets/stats/ll_rayo_data_r1.png
    no_telop: true
  - text: 新しいサン・ホセ監督は、町を歩いたあと、こう話しました。
    image: assets/stats/ll_rayo_data_r2.png
    no_telop: true
  - voice: ベニャト・サン・ホセ
    text: 地区の空気も、ラージョらしさも、歴史も、全部が気に入った
    image: assets/stats/ll_rayo_data_r2.png
  - voice: ベニャト・サン・ホセ
    text: この監督であることが、とても誇らしい
    image: assets/stats/ll_rayo_data_r2.png
  - text: 今季は、エースのセルヒオ・カメージョが、**7試合**で**7得点**。
    image: assets/stats/ll_rayo_data_r2.png
    no_telop: true
  - text: そしてこのクラブは、反則の少ないチームとして出た大会で、
    image: assets/stats/ll_rayo_data_r3.png
    no_telop: true
  - text: ヨーロッパの**ベスト8**まで勝ち進んだことがあります。
    image: assets/stats/ll_rayo_data_r3.png
    no_telop: true
  - image: assets/stats/ll_rayo_data0.png
    text: 創立は**1924年**。プルデンシア・プリエゴという女性の家で生まれました。
    no_telop: true
  - image: assets/stats/ll_rayo_data1.png
    text: 愛称は「マタヒガンテス」、巨人殺し。1部の1年目に、ホームで強豪を次々と倒しました。
    no_telop: true
  - image: assets/stats/ll_rayo_data2.png
    text: ホームタウンはマドリードのバジェカス。人口**24万**ほどの、労働者の町です。
    no_telop: true
  - image: assets/backgrounds/stadium_ラージョバジェカーノ.png
    text: 本拠地はエスタディオ・デ・バジェカス。**1万4708人**が入り、片方のゴール裏は壁です。
  - image: assets/stats/ll_rayo_data4.png
    text: オーナーは**2011年**からラウル・マルティン・プレサ。会長も兼ねています。
    no_telop: true
  - image: assets/stats/ll_rayo_cups.png
    text: 1部、国王杯、スーペルコパの優勝は**0回**。ヨーロッパの大会でも、まだ優勝がありません。
    no_telop: true
  - image: assets/stats/ll_rayo_data6.png
    text: 最多出場は、17歳でデビューしたディフェンダーのコタ。**458試合**です。
    no_telop: true
  - image: assets/stats/ll_rayo_data7.png
    text: 直近のタイトルは、2017年から18年のシーズン。初めて2部で優勝しました。
    no_telop: true
  - image: assets/stats/ll_rayo_data8.png
    text: 昨季のリーグ戦は**8位**、勝ち点は**50**。クラブの最高順位に並びました。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Rayo_Vallecano
  - https://en.wikipedia.org/wiki/Template:2026%E2%80%9327_La_Liga_table
  - https://en.wikipedia.org/wiki/2026_UEFA_Conference_League_final
