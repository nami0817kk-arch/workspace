- id: history2
  heading: フェアプレーの枠で欧州へ
  tier: 背景
  telop: 2000年、フェアプレーの枠で欧州へ
  narrator: 解説
  card:
    type: table
    title: フェアプレーの枠で欧州へ
    columns: &id002
    - ''
    - ''
    rows:
    - - 1999-2000
      - 9位。一時は首位
    - - 欧州の切符
      - フェアプレーの枠
  say:
  - 1999年からのシーズン、**4節**のあいだ首位に立ち、最後は**9位**でした。
  - 順位では届かない欧州へ運んだのは、警告の少なさで選ばれるフェアプレーの枠です。
  - text: 初戦はアンドラのチームに、アウェーで**10対0**。フランスのボルドーも破ります。
    card:
      type: table
      title: フェアプレーの枠で欧州へ
      columns: *id002
      rows:
      - - 2000-01
        - ウエファカップ8強
  - 止めたのは、その年に準優勝したアラベスでした。
  sources:
  - https://en.wikipedia.org/wiki/Rayo_Vallecano
  - https://es.wikipedia.org/wiki/Rayo_Vallecano_de_Madrid
  - https://en.wikipedia.org/wiki/2000%E2%80%9301_UEFA_Cup
  bg: assets/backgrounds/stadium_ラージョバジェカーノ_in.png
  official: false
