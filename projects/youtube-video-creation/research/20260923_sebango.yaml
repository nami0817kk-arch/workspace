    tier: 報道
    telop: 6番は、湘南の後輩の田中聡へ
    narrator: 解説
    bg: assets/backgrounds/stock/stadium_night.mp4
    card:
      type: table
      title: 空いた番号と、継いだ人
      columns: ["", "前", "今回"]
      rows:
        - ["6番", "遠藤航", "田中聡"]
        - ["7番", "田中碧", "相馬勇紀"]
        - ["8番", "久保建英", "鈴木唯人"]
    say:
      - 代表を退いた遠藤航が、長く着けてきた**6番**。
      - 継いだのは**田中聡**。湘南ベルマーレの後輩です。
