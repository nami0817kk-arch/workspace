  - id: kubo
    main: true
    heading: 8番と7番は、誰の番号だったか
    tier: 報道
    telop: 久保の8番は南野の、田中碧の7番は三笘の番号だった
    narrator: 解説
    bg: assets/backgrounds/stock/stadium_night.mp4
    card:
      type: table
      title: ワールドカップで借りていた番号
      columns: ["", "本来の持ち主", "ワールドカップ"]
      rows:
        - ["7番", "三笘薫", "田中碧"]
        - ["8番", "南野拓実", "久保建英"]
    say:
      - text: 'ワールドカップで8番だった久保建英が、20番に戻りました。'
        short_only: true
      - voice: 久保建英
        text: 元々8番は今回だけって言ってたんで
      - 久保が長く着けてきたのは20番です。大会の8番は、南野拓実の番号を借りた形でした。
      - 田中碧も同じです。大会で着けた7番は三笘薫の番号で、田中は今回**17番**に戻りました。
      - 空いた7番は相馬勇紀、8番は鈴木唯人が着けます。
    sources:
      - https://news.yahoo.co.jp/articles/5fc3a54a3fb4cd23f28e408828b5bfa2b6374047
      - https://news.yahoo.co.jp/articles/226c032a520d462b9fd158d8ae03e4cc2c7651a6
  - id: voices
    heading: ネットの声
    tier: 未確認
    telop: 番号を見た人が書いていたこと
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - voice: ネット民
        text: ヤフコメさんたちはいろいろ理屈を付けてるけど、三笘・南野両選手が代表に戻ってきたときに、番号を戻しやすいような人選としか思えないですが。
      - voice: ネット民
        text: 相馬については三笘が復帰したら外れる前提なのがわかる。クラブでの活躍度が代表に影響するのが本当なら、久保より唯人が序列が上なのも当たり前。日本代表の背番号9が後藤なのは現時点では物足りない。
      - voice: ネット民
        text: 6番を聡が引き継ぐって…湘南サポにはたまらんよありがとう
      - voice: ネット民
        text: 田中聡「６」！！！
      - voice: ネット民
        text: 谷村は３１！！！！！
      - voice: ネット民
        text: 背番号はあえて前世代の選手に敬意を払い、同じポジションではない所に若手が入るのが、最近のルールやリスペクトな気がします。代表定着して欲しい期待や成長も加味した選択かなと感じてます。
      - voice: ネット民
        text: 久保の20への戻しは序列を表してるような措置で驚いた。周りとは違って自己評価は厳しいイメージだから本人の希望かな。相馬のレギュラーナンバーの7は違和感しかないけど相馬しか希望しなかったのか。三笘が戻ったら三笘になるだろうけど。
      - voice: ネット民
        text: 久保の20は衝撃だ。いつかは日本の10番を背負うと思っていたのだが。
      - voice: ネット民
        text: 鎌田が変わるかなとも思ったんだけど、本人あまりこだわりなさそうだからかな？6とか8とか空いたらつけるのかなと勝手に思ってたんだけどね。15が悪いわけじゃないが、さ。
      - voice: ネット民
        text: 佐野航大は前も19だったから変えなくても良かったのになあとは思う
      - voice: ネット民
        text: 久保も頑張れ！！てか背番号20に戻したんだね、
        short_voice: true
