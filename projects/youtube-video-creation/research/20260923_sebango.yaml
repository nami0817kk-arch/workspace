    say:
      - ワールドカップのあと、9月と10月に戦う4試合。その背番号が決まりました。
      - 遠藤航が代表を退き、番号が一つ空きました。続けて呼ばれた選手にも、番号が変わった人がいます。
      - 初めて呼ばれたのは、中野就斗が2、松木玖生が19、齋藤俊輔が29、谷村海那が31です。
