  title: ハル・シティの黒と琥珀、122年で2度だけ消えた。2度目の理由は
  question: 黒と琥珀を着てきたクラブが、なぜ2度だけ別の色を着たのか
  lead: 創立から縞を着つづけてきた、黒と琥珀のクラブ。
  hook: その色が消えた2度を見ます。
  takeaway: ハル・シティは1904年の創立から黒と琥珀を着ていて、その色を着ていなかったと確かめられるのは122年のうち2つの時期だけである。1つは1935年で、市の色の群青と白にキングストン・アポン・ハルの市の紋章を付けたが1季で戻した。2つ目は戦後で、1945年12月にクラブを買い取った側はオレンジと青と白を考えていたが、衣料の配給のために新しいシャツが手に入らず、水色のシャツを着た。英国の衣料の配給は1941年6月から1949年3月15日までの8年近く続いた仕組みで、1949年には琥珀色の無地に太い虎の頭を付けて2部へ戻っている。紋章は1935年に市のもの、1949年ごろに太い虎の頭、1970年代にいまにつながる虎の頭が使われ、2001年からは虎が一度も外れていない。2014年6月に紋章からクラブの名前が消え、2019年にサポーターの投票で形と中身を決め直して名前が戻った。柄では1960年代の琥珀に黒い横帯が「バナナ」と呼ばれて嫌われ、縞が戻った1975年に初めて白が入り、1992年の全面の虎の柄は史上最悪のシャツの1つと言われながら、のちにサポーターに受け入れられた。自分で数えると、紋章にクラブの名前が無かった5季は創立からの122年の4.1%で、その5季のうちプレミアリーグにいたのは2季、残る3季は2部だった。虎の頭は2001年から26季つづけて胸にあり、名前が無かった5季の5.2倍の長さになる
  opening_image: assets/images/20261011_kit_hull/01_w.png
