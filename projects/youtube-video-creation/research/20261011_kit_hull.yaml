# ユニフォームとエンブレムの歴史 第3回：ハル・シティ（10/11 公開）。
#
# **節の並びを、第1回（リヴァプール 10/9）・第2回（マンU 10/10）から1つ入れ替えた。**
#   あちら：①オープニング ②**エンブレムの年表（main）** ③色の歴史 ④胸スポンサーと用具メーカー ⑤見立て
#   こちら：①オープニング ②**色の歴史（main）** ③エンブレムの年表 ④柄の話 ⑤見立て
#   **理由は2つ。**
#   (a) 第2回の強い一点が「紋章から Football Club の文字が消えた」で、ハルの紋章の山場も
#       「2014年にクラブの名前が消え、2019年に戻った」なので、**2回続けて同じ形**になる。
#       審査の「続けて数本視聴した後、繰り返しのように感じられる」に正面から当たる。
#   (b) **このクラブだけの強い一点は色のほうにある**（服の配給で縞が作れず、水色を着た季）。
#   **④を「胸スポンサーと用具メーカー」から「柄の話」に替えたのも材料の都合**（下の「薄かったところ」）。
#
# 強い一点：**黒と琥珀を着ていなかったと確かめられるのは、122年のうち2つの時期だけ。**
#   1935-36 の群青と白（市の紋章つき、1季で戻した）と、戦後の水色。
#   **水色になった理由は服の配給**（新しい縞のシャツが手に入らなかった）。確度は**背景**。
#
# **材料の確度と、言わないと決めたもの**
#   **色の歴史は Historical Football Kits の本文が唯一の出どころ**（第1回・第2回でも使った専門の資料）。
#   クラブ公式にも Wikipedia 本文にも、この経緯は書かれていない。**だから台本は「とされています」の線を越えない。**
#   **1945年12月にクラブを買い取った人が「クラブの名前も変えようとした」ことは言わない**
#   （HFK にはあるが、クラブ紹介⑪が2013年の改名騒動を読み上げているので、名前の話は丸ごと外した）。
#   **水色を着ていた季の数は言わない**（HFK は「代わりに水色を着た」までで、何季かを書いていない。
#   季ごとの一覧は記号だけで色が分からず、数えられなかった）。
#   衣料の配給は 1941年6月開始・1949年3月15日終了（英国の配給の記事で裏取り）。**7年9か月**を「8年近く」と言った。
#   **紋章の変遷で年が確かめられたのは1935・1949年ごろ・1970年代・2001・2014・2019 の6つだけ。**
#   1998年ごろの意匠は資料が見つからないので年表に入れていない。
#   **アルファベットは読み上げに出さない**（紋章から消えたのは「クラブの名前」と言う。
#   板にも英字を書いていない）。**用具メーカーと胸スポンサーの金額は出していない**（下記）。
#
# **クラブ紹介⑪（2026-09-24 公開）と重ねない**
#   あちらが読み上げたのは「創立1904年」「愛称タイガース・黒と琥珀の縞模様」「本拠地と収容」
#   「2013年の改名騒動とイングランドサッカー協会の63.5%」「4部から5シーズンで1部へ（2008年）」
#   「ウィンダス・アシュビー・バームビー」「オーナーと監督」「守田英正」「今季の順位」。
#   **この回で使ったのは創立の1904年だけ**（色の年表の起点に要る）。
#   愛称・改名騒動の中身・63.5%・オーナーの名前・4部から5年・2008年という年・選手名・守田は**一度も出していない**。
#   「1部に上がった季、縦縞は1部でここだけだった」は**年を言わずに柄の話としてだけ**使った。
#
# **薄かったところ（無理に埋めていない）**
#   **④を第1回・第2回と同じ「胸スポンサーと用具メーカーの金額」にはできなかった。**
#   当たった先：クラブ公式（wearehullcity.co.uk の紋章とシャツの発表）・Wikipedia の
#   「Kit sponsors and manufacturers」節・HFK・スポンサー契約を扱う業界媒体・用具メーカーの発表。
#   **金額が1件も公表されていない。**胸スポンサーは会社名と季だけが分かり（2002年からの5季・2008-09・
#   2014-16・2016-19・いま）、「record deal」と書いた記事は本文に当たれなかった（403）。
#   第2回のような折れ線（1982年の10万ポンド→いまの6000万ポンド）は、ハルでは**1点も置けない**。
#   **用具メーカーの一覧も作れなかった**（1982年のアドミラル・90年代前半のマッチウィナーとペラーダ・
#   2014〜2023年のアンブロ・いまのオクセン、までは辿れたが、あいだが埋まらない）。
#   → **金の節は作らず、柄の節に替えた。**折れ線・増減の内訳の板も、置く数字が無いので使っていない。
#
# 写真は assets/backgrounds/ から assets/images/20261011_kit_hull/ へ写した2枚
#   （01_w＝本拠地の中／02_w＝ノース・スタンド側。どちらも Commons・CC BY-SA、credits.json も同じ場所）。
#   **assets/backgrounds/ のまま使うと、ショートが assets/stats/stadium_ハルシティ_v.png
#   （クラブ紹介⑪の基礎DATAの縦板）に化ける**（スタジアム紹介①で踏んだ穴）。
#   **シャツと紋章そのものの画像は使えない**（クラブの商標。手元にも無い）。
#
# 自分で数えた数（検算した）: 5 ÷ 122 = 0.04098 →「4.1%」／2001-02 から 2026-27 で 26季／
#   26 ÷ 5 = 5.2倍／名前が無かった5季のリーグは Prem・2部・Prem・2部・2部（プレミア2季・2部3季）。
#
# ネットの反応は入れない（シリーズの回。ブラウザの道具を使っていない）→ voice_min: 0。
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11「サムネは相談して決めよう」）。
#   ここに書いた thumbnail は案A（number）。B・C は報告に書いた。
#   **scene は使えない**（第1回・第2回がどちらも scene で、3回続く）。
