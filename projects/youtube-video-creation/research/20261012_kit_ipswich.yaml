      - - 1995年
        - ビールの会社。6季
      - - 2021年
        - 歌手のエド・シーラン
      - - 2025年
        - 地元のソフト会社ヘイロー
      focus: 2021年
  - text: 最初は、日本の電機会社のパイオニアでした。
    card: &id_chest_0
      type: timeline
      title: 胸に付いてきた広告
      rows: *rows_chest
      focus: 2021年
      highlight_row: 0
  - text: そのあとは、地元の名前が続きます。ラジオ局、化学の会社、ビールの会社。
    card: &id_chest_2
