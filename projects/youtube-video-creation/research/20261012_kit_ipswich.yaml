# ユニフォームとエンブレムの歴史 第12回：イプスウィッチ（10/12 公開）。材料の控えは research/raw/20261012_kit_ipswich.md。
# **取材メモはこの控えの外へ出ていない。** 一次情報（クラブ公式・企業の発表・BBC など）まで辿り、固有名詞・数字・年は原文で引き直した。
#
# ---- クラブ紹介⑫（2026-09-24 公開）と 10/11 の前田の回で読み上げた話は、一度も言い直していない ----
# あちらが読み上げたのは：
#   創立1878年／愛称トラクター・ボーイズ（自らを茶化した名）と「青いシャツからブルーズ」／ホームタウン（サフォーク）／
#   本拠地ポートマン・ロードと約3万人・1884年から同じ場所／オーナー（米投資グループ・2021年・3部から2年続けて昇格）／
#   優勝1回・FAカップ1回・ウエファカップ1回／プレミア最高位5位／2025年に降格・昨季2位で復帰／
#   1961-62の昇格1年目の優勝（ラムゼイ）・1981年UEFAカップ（AZに合計5-4）・ロブソン709試合／欧州のホーム31試合無敗／
#   名選手3人（マギルトン・ホランド・スチュワート）／オニール監督／登録28人／5試合2勝3敗・11位／前田は800万ポンド。
#   前田の回：フルハム戦2対1・81分交代・4度のチャンス・セセニョン・ワタラ・オシェイ。
# **この回で使ったのは「ブルーズ」でも「優勝の中身」でもなく、シャツの胸（広告・紋章・赤）だけ。**
#   UEFAカップは、紋章が戻った理由（クラブ公式の言葉）として「40年前の決勝の夜」と言う1行だけ。決勝の相手・スコアは言わない。
#   「サフォーク」は馬の品種名（サフォーク・パンチ）と、最後の1行の「サフォークの馬」だけ。地域の説明はしない。
#
# ---- 節の並び：リヴァプール（紋章→色→金→見立て）・マンU（紋章→色→金→見立て）・ハル（色→紋章→柄→見立て）と、3回続けて同じにしない ----
#   こちら：①オープニング ②**胸の広告（main）→ ③紋章 → ④足された赤 → ⑤見立て**
#   強い一点の型も、これまでと変えた：リヴァプール＝紋章の描き直しの回数／マンU＝文字が消えた／ハル＝色が消えた2度 に対し、
#   **こちらは「歌手のロゴが胸に付いた季、ホームのシャツがクラブ最多の売れ行き」＝クラブ自身が明かした売上の数字**。
#   紋章は「消えた」でなく「サポーターが選んで、25年ぶりに1季だけ戻った」の話にした。
#
# ---- 強い一点（クラブ公式 2022-06-09 の原文）----
#   「Last season saw the Club sell more home shirts than it has done in 15 years, including more than double the number that were sold for the 2020/21 campaign.」
#   → 15年で最多・前の季の2倍超。確度は確定（クラブ自身の発表）。
#
# ---- 材料の確度と、言わないと決めたもの ----
#   ・**用具メーカーの話は作らなかった**：1995〜2007年の年がクラブ紹介の資料どうしで食い違い（Core / Punch）、メーカー側の金額は1件も公表されていない。
#   ・**胸の広告の金額は、公表された2件だけ**：2001年（基本額400万ポンド／3年。成績の上積み最大300万は別）と2018年（約200万ポンド／3年半）。
#     2025年のヘイローは「クラブ史上最大」とクラブも会社も言うが、**金額は非公表**。2021年のシーランの契約額も非公表。**推測で埋めていない。**
#   ・2018年の契約の会社名は台本にも板にも出さない（賭けの会社。見立てに要るのは額と長さだけ）。
#   ・**2018年の期間は「3年半」を採る**（契約発表の原文。地元紙は「3年」と書く）。
#   ・**シーランが少数株主になったこと（2024年8月）は言わない**：シャツの話から離れる。女子チームの話も入れない（決まり）。
#   ・**今季の袖のロゴ（シーランの別のツアー）は言わない**：ファン向けサイトの地の文で、クラブの引用ではない。
#   ・**1972年より前の紋章は「市の紋章をもとにした図柄」までしか言わない**（Wikipedia は「1960年代半ばまで紋章なし」、HFK は「1930年代から市の紋章」で食い違う）。
#   ・**1888年・1936年の色の話は使わない**（HFK 単独で、引いている1888年の地元紙は手元に無い）。
#   ・赤を足した2018年と3部への降格は**並べて言うだけで、因果は言わない**。
#   ・ジョン・ギャミッジの言葉は、旧クラブ公式の文（whatsbehindthebadge.com が全文を写している）から訳した。**本人の死去には触れない。**
#   ・アルファベットは読み上げに出さない（Halo →「ヘイロー」、Umbro は言わない、FC は板にも書かない）。
#
# ---- 一次情報に届かなかったところ ----
#   1972年の公募の原文（旧クラブ公式のページ。web.archive.org が 429）→ whatsbehindthebadge.com の写しと Wikipedia で代用。
#   2026-27 のシャツの説明（クラブ公式ページは JS 描画で本文に届かない）→ ファン向けサイトの転載。**台本は「クラブの説明では」の線**。
#
# 自分で数えた数（検算した）: 400÷3＝133.3→約133万／200÷3.5＝57.1→約57万／57.1÷133.3＝0.43→4割強／
#   4÷1＝4倍／2026−1972＝54／2026−1878＝148／54÷148＝0.365→およそ3分の1／2020−1995＝25年
#
# 写真は assets/backgrounds/ から assets/images/20261012_kit_ipswich/ へ写した2枚（01_w＝本拠地の外観・紋章が写る／02_w＝スタンドの中）。
#   **assets/backgrounds/ のまま使うと、ショートが assets/stats/stadium_イプスウィッチ_v.png（クラブ紹介⑫の基礎DATAの縦板）に化ける**
#   （スタジアム紹介①で踏んだ穴）。縦版（01_w_v・02_w_v）は 608x1080 を切って 1080x1920 に伸ばした。どちらも Commons（CC BY-SA）、credits.json も同じ場所。
#   **シャツと紋章そのものの画像は使えない**（クラブの商標。手元にも無い）。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり（ショートの × は直していない）。
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11「サムネは相談して決めよう」）。ここに書いた thumbnail は点検用の1案。
