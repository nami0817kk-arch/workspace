  - text: 胸にビールの銘柄、アボット・エールが載っていた1枚です。
    card: *id_red_3
  - text: 縦縞は、赤と黒の横縞になりました。
    card: *id_red_3
  - text: 紋章も、あの頃のように、赤と黒で描かれています。
    card: *id_red_3
  - text: ホームは、夜の照明の下の試合がモチーフです。
    card: none
    image: assets/images/20261012_kit_ipswich/02_w.png
  - text: 照明のあいだの骨組みの模様が、生地に浮き出しています。
  - text: 骨組みは、ロブソンとラムゼイの名が付いた2つのスタンドのものです。
