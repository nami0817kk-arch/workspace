  question: イプスウィッチのシャツの胸に付いてきたものは、どう変わってきたのか
  lead: 青いシャツの胸に、馬を乗せたクラブ。
  hook: 広告、紋章、赤。胸に付いたものを順に見ます。
  takeaway: イプスウィッチの胸には2021年から4季つづけて、歌手エド・シーランのツアーのロゴが付いた。最初は1シーズンの契約で、ロゴが付いた最初の季にクラブはホームのシャツを15年でいちばん多く売り、前の季の2倍を超えた。2025年に胸は地元ストウマーケットのソフトウェア会社ヘイローへ渡り、クラブはこれを史上最大の契約と説明している（金額は非公表）。胸の広告は1981年のパイオニアが最初で、2001年の契約は基本額で3年400万ポンド（1年あたり約133万）、2018年は3年半でおよそ200万ポンド（約57万、2001年の4割強）。紋章の馬は1972年にサポーターズクラブの会計係の案が公募で選ばれ、1995年に描き直され、2020年に1972年の紋章が25年ぶりに1季だけ戻った。馬は1972年から54年、創立148年のおよそ3分の1、胸にいる。赤は1985年の広告の帯と2018年のホームで足されたが、その季にクラブは3部へ降格し、翌年のシャツでパンツの縁は青に戻った
  opening_image: assets/images/20261012_kit_ipswich/01_w.png
