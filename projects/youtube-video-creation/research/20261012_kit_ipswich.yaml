    emph: true
    card: &id_chest_5
      type: timeline
      title: 胸に付いてきた広告
      rows: *rows_chest
      focus: 2021年
      highlight_row: 5
  - text: 渡した先は、ヘイローというソフトウェアの会社。本社は、近くのストウマーケットです。
    card: *id_chest_5
  - text: シーランの言葉が、会社の発表に残っています。
    card: none
  # 原文（Halo の発表 2025-07-17）: I think the heart of the town should be on the front of the shirt.
  - voice: エド・シーラン
    text: 地元の会社が、いまイプスウィッチを支えているのは素晴らしい。
  - voice: エド・シーラン
    text: 町の中心が、シャツの胸にあるべきだと思います。
    cont: true
  - text: クラブは、これを史上最大の契約と説明しています。
    card: *id_chest_5
  - text: 金額は、公表されていません。
    card: *id_chest_5
