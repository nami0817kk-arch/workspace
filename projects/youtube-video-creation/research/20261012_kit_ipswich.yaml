  say:
  - text: イプスウィッチのシャツの胸には、歌手の公演ロゴが付いていました。
    short_only: true
    image: assets/images/20261012_kit_ipswich/01_w.png
  - text: 胸に付いたのは、会社ではなく、歌手の公演ロゴでした。
    emph: true
    image: assets/images/20261012_kit_ipswich/01_w.png
    card: *id_sales
  - text: ロゴが付いた最初の季、ホームのシャツは15年でいちばん売れました。
    card: *id_sales
  - text: 売れた数は、その前の季の2倍を超えています。
    card: *id_sales
  - text: どちらも、クラブがあとから明かした数字です。
    card: none
  - text: 歌手の名前は、エド・シーラン。地元に住む、クラブのファンです。
  - text: 2021年5月、胸の広告になると発表されました。
  - text: 胸にあったのは、数式の記号と、ツアーの文字だけ。
  - text: 足す、掛ける、割る。シーランのアルバムの題と同じ記号が並びます。
  - text: ロゴの意味を聞かれた本人は、こう答えました。
  # 原文（BBC 2021-05-06）: Asked what the logo on the front of the shirt means, he added: "All will be revealed in time."
  - voice: エド・シーラン
    text: すべては、いずれ明らかになります。
  - text: 契約は、ひとつの季だけのはずでした。
  - text: 2022年6月、クラブは翌季も続けると発表します。
  - text: その発表で、クラブはこのロゴを「マセマティクス・ツアー」のロゴと呼びました。
  - text: そのあとも、胸の広告主は歌手のままでした。
  - text: 歌手の前には、何が付いていたのか。広告が付いたのは、1981年からです。
