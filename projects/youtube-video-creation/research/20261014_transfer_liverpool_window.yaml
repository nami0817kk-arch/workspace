  question: 今夏のリヴァプールの移籍期間で、払った額と戻った額はどれだけ違い、その差し引きは世界で何番目なのか
  lead: この夏、払った額が戻った額を大きく上回ったクラブ。
  takeaway: リヴァプールが今夏に払った額は2億6460万ユーロで世界6番目だが、選手を売って戻った額が3120万ユーロしかなく、払った額の12%にとどまった。差し引きは2億3340万ユーロ（およそ413億円）で、今夏の世界で最も大きい。払ったのは5人で、バルコラ1億2500万、ジャケ6360万の2人で71%を占め、払った額の60%はバルコラとブルフマンスが決まった窓の最後の2日間に動いた。戻った額の96%はジョーンズ1人で、コナテ・サラー・ロバートソンの3人は移籍金が付いていない。移籍の直前の推定の市場価値と比べると、買った5人は合計1億8200万ユーロに対して約1.45倍を払い、売った5人は合計1億1300万ユーロに対して約0.28倍しか受け取っていない。夏の払った額と戻った額を5年並べると、戻った額は今年が最も少なく、2025年と2026年の差し引きの合計は4億9703万ユーロ（およそ879億円）。リヴァプールの発表文に額は書かれておらず、額はすべて報じられた移籍金の集計で、固定かボーナス込みかは公表されていない。冬の窓は2027年1月1日に開く
