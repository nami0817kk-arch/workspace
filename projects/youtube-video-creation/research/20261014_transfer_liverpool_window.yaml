  - text: その線より上にいる4人が、相場より高く払った側です。
    card:
      <<: *scat
      highlight: ジャケ
  - text: 相場との開きが倍率でいちばん大きいのが、リヴァプールが買った18歳のブルフマンス。
    emph: true
    card:
      <<: *scat
      highlight: ブルフマンス
  - text: 移籍の直前の市場価値は、400万ユーロ。
    card:
      <<: *scat
      highlight: ブルフマンス
  - text: 相場のおよそ8倍です。今季はヘンクに残ってプレーする、とクラブが発表しています。
    card:
      <<: *scat
      highlight: ブルフマンス
  - text: ンドゥクウェは、線の上にぴったり乗っています。
    card:
      <<: *scat
      highlight: ンドゥクウェ
