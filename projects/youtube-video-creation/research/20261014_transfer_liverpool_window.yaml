# 移籍の深掘り 第4回：リヴァプールの2026年夏（「1クラブの移籍期間」の回）。10/14 作成。
# 型は 10/11 の第2回（マンチェスター・シティ）と同じ「1クラブの移籍期間」。10/12 の第3回（アザール）は「1つの移籍」。
# 材料の控え（数字の根拠と読めたもの／読めなかったもの）はこのファイルの末尾のコメントに全部書いた。**材料から出ない。**
#
# **角度は「戻る金が細った夏」。**同じクラブを扱った回と切り口が重ならないようにしてある:
#   10/12「クラブの財政：リヴァプール」… **決算（2024-25 の売上・放映権・商業・人件費）**。この回は決算の数字を1つも使っていない。
#     読むのは**今夏の移籍期間の出入りだけ**（Transfermarkt の集計と、クラブの発表の日付）。
#   9/10「バルコラ」… デビュー戦の最高速。この回は**選手が何をしたか（速さ・出場・得点）に触れない**。
#   10/11「移籍の深掘り マンチェスター・シティ」… 同じ型だが、あちらは**払った額が世界一**、こちらは**差し引きが世界一**。
#     あちらの数字（シティの額）は使わない。名前も出さない。
#
# いちばん強い一点：**今夏、差し引き（払った額−戻った額）がいちばん大きかったのはリヴァプール**（2億3340万ユーロ）。
#   払った額は2億6460万ユーロで世界6番目なのに、戻ったのが3120万ユーロで払った額の12%だけだったため、差し引きでは世界で最も大きい。
#   確かめ方：世界の一覧で、差し引きが2億3340万以上になり得るのは支出が2億3340万以上のクラブだけ。そのクラブは上位6つだけで
#   （支出 526.20／407.48／366.35／313.00／300.20／264.60）、差し引きは −189.18／+40.32／−202.10／−33.90／+65.05／**−233.40**。
#   リヴァプールが最大。**自分で数え直して一致を確かめた。**
#
# **数字の確度。**移籍金は Transfermarkt の集計で、**確度は「報道」**:
#   - **リヴァプールのクラブ公式の発表文（liverpoolfc.com）に、額は1つも書かれていない。**加入5人（バルコラ・ジャケ・ムニョス・ブルフマンス・ンドゥクウェ）と
#     退団の発表（ジョーンズ・バイチェティッチ・コナテ・サラー・ロバートソン）の本文を全部読んで確かめた。台本は「クラブが発表した額」と一度も言わず、
#     ②で「クラブは発表していない」と声に出して断っている。
#   - **固定とボーナスの切り分けは公表されていない。**バルコラだけ、報道に「最大1億4500万ユーロ」（ボーナス込みの上限）がある（2媒体）。
#     集計は1億2500万ユーロ。**集計の額が固定だとは言わない**（②で「集計の額」「報じられた最大」と言い分けている）。
#   - 市場価値は Transfermarkt の**推定**であって値段ではない（⑤で断っている）。移籍の直前の値は Transfermarkt の移籍履歴の API で読んだ。
#   - 媒体名は台本に出さない（2026-09-21 の決まり）。出どころは各節の sources に置くだけ。
#
# **自分で数えた数**（すべて百万ユーロ。足し算で一致を確かめた）:
#   払った額（集計の夏）125.0+63.6+40.0+33.0+3.0＝264.60 ← Transfermarkt の世界の一覧・プレミアの一覧の264.60と一致／
#   戻った額 30.0+1.2＝31.20 ← 一覧の31.20と一致／差し引き 264.60−31.20＝233.40 ← 一覧の−233.40と一致／戻った割合 31.20÷264.60＝11.8%（台本は12%）／
#   上位2人 125.0+63.6＝188.6 → 188.6÷264.60＝71.3%（71%）／バルコラ1人 125.0÷264.60＝47.2%（47%）／
#   最後の2日（バルコラ8/31・ブルフマンス9/1）125.0+33.0＝158.0 → 158.0÷264.60＝59.7%（60%）／
#   ジョーンズ1人 30.0÷31.20＝96.2%（96%）／
#   買った5人の移籍直前の市場価値 90+55+30+4+3＝182.0 → 264.60÷182.0＝1.454（約1.45倍）、差 264.60−182.0＝82.6／
#   ブルフマンス 33.0÷4.0＝8.25（約8倍）／バルコラ 125÷90＝1.39、ジャケ 63.6÷55＝1.16、ムニョス 40÷30＝1.33、ンドゥクウェ 3÷3＝1.00（線の上は4人、ぴったり1人）／
#   売った5人の移籍直前の市場価値 35+4+45+22+7＝113.0 → 31.20÷113.0＝0.276（約0.28倍）／無償の3人 45+22+7＝74.0 → 74.0÷31.20＝2.37（約2.4倍）／
#   バルコラの最大 145−125＝20 → 20÷125＝16%／
#   夏の5年（払った額／戻った額／差し引き）2022 98.90／80.10／18.80、2023 172.00／60.70／111.30、2024 42.00／47.00／−5.00（黒字）、
#   2025 483.13／219.50／263.63、2026 264.60／31.20／233.40。2025+2026 の差し引き 263.63+233.40＝497.03／
#   264.60÷42.00＝6.30（2024年の夏の6.3倍）／5年の払った額の合計 1060.63（今年はその24.9%。台本では読まない）／戻った額は2026が5年で最少（31.20＜47.00）。
# 為替は ECB 参照相場の 2026-10-13＝1ユーロ176.91円（取れたいちばん新しい日。ECB の API で取った）。**どの日の為替かを必ず言う**。
#   2億3340万ユーロ × 176.91 ＝ 412.91億円 → 「およそ413億円」。4億9703万ユーロ × 176.91 ＝ 879.30億円 → 「およそ879億円」。
#
# 数字の重なり対策（別の節で同じ数字を読まない）：『2億6460万』『3120万』『2億3340万』『12%』『413億円』は①だけ（②以降は「払った額」「戻った額」で受ける。
#   ⑤⑥の板の上には数字が出るが読まない）。②の『71%』『47%』は②だけ、③の『60%』『1億5800万』は③だけ、④の『96%』は④だけ、
#   ⑤の『1.45倍』『0.28倍』『8倍』『7400万』は⑤だけ、⑥の『4億9703万』『879億円』『6.3倍』は⑥だけ。**題には金額を入れない**。
# 板：①waterfall と convert ②table（5行）と waterfall（バルコラの最大）③timeline（5行）と calc ④table（5行）⑤scatter（diagonal つき）と calc 2枚 ⑥line（2本）・convert・calc。
#   **versus・stats・verdict は使っていない**（この回は人の比べでも判定でもないため）。板を下ろす行には `card: none` を明示した。赤ペン（mark）は使っていない。
# 写真（10/14 取得）：Commons の CC BY-SA。バルコラ（2026年W杯のフランス代表、背番号12・BARCOLA の背中の写真で本人を確認）、アンフィールド2枚。出典は assets/images/20261014_transfer_liverpool_window/credits.json。旧メモ：**未取得**（thumbnail の photo・short_photo・opening_image は空のまま。ユーザーと相談して決める）。画面の下地は本拠地の実写の指定（assets/backgrounds/stadium_リヴァプール*.png）だけ。
#   **この worktree には assets/backgrounds の本拠地の実写が無い**（gitignore）ので、書き出す前に本体側から用意する必要がある（draft のヒントに出るはず）。
# 声：1件も無い（数字が主役の回。シリーズなので反応は集めていない。本人の言葉・他人の声も使っていない）。voice_min: 0。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは案A（構図 number、伏せるのは差し引きの世界順位 ●位）。
#   直近は 10/9 number・10/11 number・10/12 face なので、number だと「3回続き」ではないが10/11と同じ構図になる。
#   案B：scene（本拠地の全景、2行目「差し引きは世界で●●●●」）／案C：face（バルコラの横長の写真、2行目「世界で●位の差し引き」）。写真が取れてから決める。
