    card: *scat
  - text: 払ったのは、その約1.45倍。8260万ユーロ多く払った計算です。
    emph: true
    card: &calc_in
      type: calc
      title: 買った5人は相場の何倍か
      terms:
      - ['2億6460万ユーロ', 払った額]
      - ['1億8200万ユーロ', 直前の市場価値の合計]
