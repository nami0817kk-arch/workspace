- id: view
  viewpoint: true
  heading: 戻った額が、5年の夏でいちばん少なかった
  tier: 報道
  telop: 戻った額は5年で最少。この2年の夏の差し引きは合わせて4億9703万ユーロ
  narrator: 解説
  card: &years
    type: line
    title: 夏の移籍期間に払った額と戻った額（5年）
    unit: 百万ユーロ
    x: ['2022年', '2023年', '2024年', '2025年', '2026年']
    series:
    - [払った額, [98.9, 172.0, 42.0, 483.13, 264.6]]
    - [戻った額, [80.1, 60.7, 47.0, 219.5, 31.2]]
    focus: 戻った額
  say:
  - text: リヴァプールにとって、この夏が特別だったのかを、5年の夏で見ておきます。
    image: assets/images/20261014_transfer_liverpool_window/a05_road_w.jpg
    card: *years
  - text: 夏の移籍期間に払った額と、戻った額を、5年ぶん並べました。
    card: *years
  - text: 2024年の夏は、払った額が4200万ユーロ。プレミアで19番目の額でした。
    card:
      <<: *years
      highlight: '2024年'
  - text: この年は戻った額のほうが多く、差し引きはプラスでした。
    card:
      <<: *years
      highlight: '2024年'
  - text: 2025年は、払った額が4億8313万ユーロ。戻った額は2億1950万ユーロです。
    card:
      <<: *years
      highlight: '2025年'
  - text: そして、この夏。戻った額は、5年でいちばん少なくなりました。
    emph: true
    card:
      <<: *years
      highlight: '2026年'
  - text: 2025年と2026年の、2年の夏の差し引きを足すと、4億9703万ユーロです。
    emph: true
    card: &yen2
      type: convert
      title: この2年の差し引きを円に
      from: ['4億9703万', ユーロ, 2025年と2026年の夏の差し引き]
      to: [約879億, 円, 10月13日の為替]
      via: 1ユーロ＝176.91円
  - text: 同じ10月13日の為替で、およそ879億円です。
    card: *yen2
  - text: 払った額で見ても、この夏は2024年の夏の6.3倍に増えています。
    card: &calc_year
      type: calc
      title: この夏は2年前の何倍か
      terms:
      - ['2億6460万ユーロ', この夏]
      - ['4200万ユーロ', 2024年の夏]
      - [6.3倍, 2年での開き]
      ops: ['÷', ＝]
  - text: 買い物は大きく、戻る金は細い。この夏は、その形がはっきり出ました。
    image: assets/images/20261014_transfer_liverpool_window/a01_full_w.jpg
    card: none
  - text: 次の窓は、2027年1月1日に開きます。閉まるのは2月1日の23時です。
  - text: ンゲッサンが加わる日も、その1月1日です。
  sources:
  - https://www.transfermarkt.com/premier-league/einnahmenausgaben/wettbewerb/GB1/plus/1?ids=a&saison_id=2026&saison_id_bis=2026&w_s=s
  - https://www.transfermarkt.com/premier-league/einnahmenausgaben/wettbewerb/GB1/plus/1?ids=a&saison_id=2025&saison_id_bis=2025&w_s=s
  - https://www.transfermarkt.com/premier-league/einnahmenausgaben/wettbewerb/GB1/plus/1?ids=a&saison_id=2024&saison_id_bis=2024&w_s=s
  - https://www.premierleague.com/en/news/4664145/when-does-summer-2026-premier-league-transfer-window-open-and-close
  - https://data-api.ecb.europa.eu/service/data/EXR/D.JPY.EUR.SP00.A
#
# ─────────────── 以下は材料の控え（台本には出さない）。取った日 2026-10-14（JST）。使った道具は requests と WebFetch 相当の取得だけ。ブラウザ操作の道具は使っていない ───────────────
#
# 【一次情報まで辿れたこと】
#  ・クラブ公式（liverpoolfc.com）の発表文の本文と公開日（記事の published_time）：
#      加入 … ンドゥクウェ 2026-01-26／ジャケ（合意）2026-02-02・（加入完了）2026-07-01／ムニョス 2026-06-18／バルコラ 2026-08-31／ブルフマンス 2026-09-01／ンゲッサン 2026-09-04／アラウホ（貸し）2026-08-10
#      退団 … コナテ 2026-05-31／サラー 2026-03-24／ロバートソン 2026-04-09／ジョーンズ 2026-08-21／バイチェティッチ 2026-08-31／エリオット（バレンシアへ貸し）2026-09-01／R.ウィリアムズ 2026-05-25
#      → **どの発表文にも移籍金の額は書かれていない**（£・€・million・fee・add-on で全文検索して0件。ジャケの文の「feel」は誤検出）。
#      ブルフマンス：「ヘンクに戻り、2026-27シーズンはそこにとどまる」（発表文の原文）。ンゲッサン：「2026-27の残りをブレストでの貸し出し」（原文）。
#  ・プレミアリーグ公式：夏の窓は2026-06-15に開き、2026-09-01（火）23:00 BST に閉まる。冬の窓は2027-01-01に開き 2027-02-01 23:00 GMT に閉まる（premierleague.com の記事）。
#  ・トッテナム公式：ロバートソンは「リヴァプールとの契約の満了にともない7月1日に加わる」（原文）。
#  ・レアル・マドリード公式（2026-06-18）：コナテと「2030年6月30日まで4シーズン」で合意。額の記載なし。
#  ・欧州中央銀行（ECB）の参照相場（API）：2026-10-13＝1ユーロ176.91円（取れた最新）。2026-10-09＝177.34、10-12＝177.33。
#  ・Transfermarkt：クラブの移籍ページ（加入13件・退団11件の一覧、合計€269.60m／€31.20m）、世界の支出・収入の一覧（リヴァプール264.60／31.20／−233.40）、
#      プレミアの一覧（2022〜2026の夏）、各選手の移籍履歴 API（移籍日・移籍金・移籍直前の市場価値）。
#
# 【読んだが突き合わせて分かったこと（食い違い）】
#  ・**クラブの移籍ページの合計は€269.60m、世界の一覧は€264.60m。差の€5.00mは、ンゲッサン（サンテティエンヌ→）の移籍で、API では「isPending: true、日付 2027-01-01」。**
#    世界の一覧は未実行の移籍を夏に数えていない。この回は**世界の一覧に合わせて264.60**（ンゲッサンは③の末尾で別に言い、合計に入れていないと断っている）。
#    264.60で数えると差し引きは233.40で、10/11 の回で使った世界の一覧の数字（リヴァプール −233.40）と一致する。269.60で数えても −238.40 でやはり世界最大。
#  ・ブルフマンス（ヘンク→、€33.00m）は API で移籍日 2026-09-01、同日にヘンクへ貸し出し。移籍履歴に 2027-06-30 の「貸し出しの終わり」（pending）がある。
#
# 【一次情報まで辿れなかったこと／未確認】
#  ・**移籍金の額そのものは、どのクラブの発表にも無い。**額の出どころは Transfermarkt の集計だけ（確度「報道」）。固定・ボーナス・解除条項の切り分けは未確認。
#  ・**バルコラの「最大1億4500万ユーロ」**は報道（サッカーキング 2026-09-03、ウルトラ・サッカー）で、報道の元（記者の投稿・外国紙）までは辿れていない。**未確認**。
#    集計の1億2500万が固定かどうかも未確認（台本は固定とは言っていない）。
#  ・**英語版 Wikipedia のポンド表記**（バルコラ £106m・最大 £123m、ジャケ £55m・最大 £60m、ムニョス £34.5m、ブルフマンス £28.3m＋£1.7m の追加条項、ンドゥクウェ £2.6m、
#    ジョーンズ £25.7m・最大 £30m、バイチェティッチ £1.0m・最大 £1.3m、ンゲッサン £4.3m、アラウホ 買い取りオプション £47.1m）は**二次情報なので台本に使っていない**。
#    注の元の報道までは辿れなかった。**アラウホの買い取りの額はクラブの発表に無く、未確認**（台本に出していない）。
#  ・**サラーの行き先と「移籍金なし」**は Transfermarkt（無償）が根拠。トラブゾンスポルの公式ページは 403 で**読めなかった**。サラーが契約満了かどうかは**未確認**
#    （リヴァプールの発表は「合意のうえ退団」で、契約の期限は書いていない）。台本は「満了」と言っていない（満了と言うのはロバートソンだけ＝トッテナムの発表）。
#    ⑤の「契約が満了して出る選手には、もともと移籍金が付きません」は一般論で、サラーを含めて言っていない。
#  ・Transfermarkt の集計外のもの：アカデミーの選手の売却（ルカ・ステファンソン→ボルトン £0.7m など）、サミュエル・マルティネス（2027-28から加入、£0.75m と報じられた）は
#    Transfermarkt の一覧に無く、台本に使っていない。
#  ・日本語の表記の未確認：ブルフマンス（Lucca Brughmans）・ンドゥクウェ（Ifeanyi Ndukwe）・ンゲッサン（Djylian N'Guessan）は、既存の取材メモ
#    （20260908_transfer / 20261005_transfer_review）に合わせた姓だけの表記。名の読みは確認していない。draft の読みのヒントを見て辞書に足す。
#  ・「世界で」の範囲：Transfermarkt の世界の一覧に載るクラブでの比べ。載っていないクラブは見ていない。
