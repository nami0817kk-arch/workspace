- id: hook
  heading: ノルウェーは、28年ぶりのW杯で、何が起きたのか
  tier: 背景
  telop: 28年ぶりのW杯で、初のベスト8
  narrator: 解説
  main: true
  say:
  - text: ノルウェー代表。フィファランクは19位の国です。
    image: assets/stats/tb_norway_data_t.png
    short_only: true
    no_telop: true
  - text: 2026年のワールドカップで、ノルウェーは、初めてのベスト8に進みました。
    image: assets/stats/tb_norway_data_t.png
    no_telop: true
  - text: 出場は1998年以来、28年ぶりでした。
    image: assets/stats/tb_norway_data_r1.png
    no_telop: true
    emph: true
  - text: 6試合で13得点。そのうち7点を決めたのが、ハーランドです。
    image: assets/images/20261124_team_norway/b01_w.jpg
    no_telop: true
  - text: ベスト16の相手は、ブラジル。ハーランドが2点を決めて、2対1の勝ちでした。
    image: assets/images/20261124_team_norway/b04_w.jpg
    no_telop: true
  - text: 今回のノルウェーは、これまでと何が違ったのでしょうか。
    image: assets/stats/tb_norway_data_t.png
    no_telop: true
