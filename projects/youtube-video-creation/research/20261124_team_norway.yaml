- id: data
  heading: ノルウェー代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: ノルウェー代表の基礎DATA
  narrator: 解説
  say:
  - text: ノルウェーのフィファランクは、10月7日の発表で**19位**。日本は17位です。
    image: assets/stats/tb_norway_data0.png
    no_telop: true
  - text: ワールドカップの本大会は、これで4回目。最高成績は、ベスト8です。
    image: assets/stats/tb_norway_data1.png
    no_telop: true
  - text: 直近は2026年。イングランドに、延長で1対2の負けでした。
    image: assets/stats/tb_norway_data2.png
    no_telop: true
  - text: ヨーロッパ選手権は、2000年に1回だけ出場。1次リーグで敗退です。
    image: assets/stats/tb_norway_data3.png
    no_telop: true
  - text: 監督は、ストーレ・ソルバッケン。就任は、2020年12月です。
    image: assets/stats/tb_norway_data5.png
    no_telop: true
  - text: 主将はマルティン・ウーデゴール。ハーランドの65得点は、代表の歴代最多です。
    image: assets/stats/tb_norway_data6.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Norway_at_the_FIFA_World_Cup
  - https://en.wikipedia.org/wiki/Norway_national_football_team
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
