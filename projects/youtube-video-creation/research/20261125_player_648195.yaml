# エンソ・フェルナンデス（マンチェスター・シティ／アルゼンチン代表）の紹介。選手紹介の型（2026-11-25 公開分、シリーズ「有名選手の紹介」。key: player_648195）。情報の時点は 2026-11-13（クラブの試合は 11/7 のプレミアリーグ第11節まで）。
# **FotMob は使わない。**数字は Transfermarkt API（控え research/raw/20261113_enzo_*.json）、英語版 Wikipedia、移籍の報道（Sky Sports・Al Jazeera・マンチェスター・シティ公式、検索で確認）。
# **選んだ理由（2026-11-13）**：player_pool.py list の上位は紹介済み。pool の外で TM の市場価値が最も高い（1億2000万ユーロ）未出の選手。2026年9月1日にチェルシーからシティへ（報道で1億2500万ポンド）、1億ポンド超えの移籍金が2度かかった初の選手（Wikipedia）。ほかの候補：デンベレ（11/23 に使う）、サリバ（1億）、バルベルデ（9000万）、イサク（9000万）。
#   重なり：scripts/ を「エンソ」で grep → 紹介の回は0件（既出の mention のみ）。研究: research/2026111*_picks.txt に無い。同じ日（11/25）の別シリーズ：ユニフォーム＝パリ・サンジェルマンと重ならない。ほかの担当の 11/25 の題材は 20261123_picks.txt で確認（書いた時点で重なり無し）。
# **現役・今季はシティ（プレミアリーグ）**：TM の試合記録で 2026-11-07（ノッティンガム・フォレスト戦 78分）まで。
# **数字の軸**：TM の試合記録（トップチームだけ。リーベルの U20・予備チームは除く）。クラブ通算 298試合50点50アシスト：アルゼンチンの2クラブ（リーベル 53/12/10＋デフェンサ・イ・フスティシア 33/1/2）86/13/12、ベンフィカ 29/4/7、チェルシー 170/31/30（Wikipedia の 170/31 と一致）、シティ 13/2/1（938分）。チェルシーのシーズン別：22/23 22/0/2、23/24 40/7/4、24/25 53/9/17（クラブW杯7試合を含む）、25/26 54/15/7、26/27 1/0/0（8月。台本に出さない）。代表 51試合8点6アシスト（TM）。W杯2026：7試合2得点（エジプト戦・イングランド戦）。市場価値（TM）：2021-02 400万→2022-05 1500万→2022-09 2000万→2022-12 5500万→2023-03 8500万→2026-07 1億→2026-10 1億2000万（÷400万＝30、2021-02→2026-10＝5年8か月）。
# **入れなかったもの**：私生活・論争、W杯決勝の退場、本人の言葉の引用（一次の原文は確かめられず）。
# **確かめられなかった**：移籍金は報道で割れる（Sky・Al Jazeera 1億2500万ポンド、BeIN 1億4500万ユーロ）。チェルシーへの移籍金（約1億700万ポンド）は Wikipedia の記述。ベンフィカへの移籍金（1000万ユーロ＋追加800万）は Wikipedia。「1億ポンド超えが2度は初」は Wikipedia と報道の記述で、公式の確認は無い。W杯2026 のラウンド（エジプト戦＝16強、イングランド戦＝準決勝）は TM の日付と Wikipedia から。
# **写真**：Commons の Bryan Berlin 撮影（CC BY-SA 4.0）、2026年W杯のアルゼンチン代表戦。クラブ（シティ）姿の写真は取れなかった。

