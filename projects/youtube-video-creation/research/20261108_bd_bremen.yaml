  official: false
- id: golden
  heading: 2度落ちたブレーメンは、なぜ2度とも1年で1部に戻れたのか
  tier: 背景
  telop: 1980年と2021年に降格。どちらも翌年に昇格。1部は今季で62季目
  narrator: 解説
  main: true
  say:
  - text: ブレーメンは、1963年のブンデスリーガ創設から参加した16クラブの1つ。
    image: assets/backgrounds/stadium_ブレーメン.png
  - 初めて落ちたのは1980年。34試合で93失点し、17位でした。
  - text: 翌季は2部の北のリーグで42試合30勝。**97得点**で1位になり、1年で戻ります。
    card:
      type: table
      title: 2度の降格と復帰
      columns:
      - 季
      - 結果
      rows:
      - - 1979〜80年
        - 17位で降格
      - - 1980〜81年
        - 2部北で1位、昇格
      - - 2020〜21年
        - 17位で降格
      - - 2021〜22年
        - 2部で2位、昇格
  - text: その2部の季の途中、1981年4月に就いた監督が、オットー・レーハーゲルです。
    card: none
    image: assets/images/bd_bremen_pair_rehhagel/01.jpg
  - 14年の在任で、ブンデスリーガ優勝が2回、ドイツカップも2回。
  - 1992年には、ヨーロッパの大会でも優勝を果たします。
  - text: 2度目の降格は2021年。17位で、41年ぶりでした。
    image: assets/backgrounds/stadium_ブレーメン.png
  - 前の年も16位で入れ替え戦に回り、アウェーゴールの差で残っていました。
  - text: 2部での1季目、ニクラス・フュルクルクがリーグ戦**19得点**。
    image: assets/images/bd_bremen_pair_fullkrug/01.jpg
  - チームは2位に入り、また1年で戻ります。
  - 1部は、今季で62季目。同じ数を持つのは、バイエルンだけです。
  sources:
  - https://en.wikipedia.org/wiki/SV_Werder_Bremen
  - https://en.wikipedia.org/wiki/List_of_SV_Werder_Bremen_seasons
  - https://en.wikipedia.org/wiki/Otto_Rehhagel
  - https://en.wikipedia.org/wiki/Niclas_F%C3%BCllkrug
  bg: assets/backgrounds/stadium_ブレーメン_in.png
  official: false
