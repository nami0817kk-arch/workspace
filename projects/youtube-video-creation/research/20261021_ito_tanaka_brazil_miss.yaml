# 伊東純也 の取材メモ（2026年10月21日・ショートだけ）
# 取材: 2026-10-21。requests（ブラウザUA）で原文を全部読んだ。控え: research/raw/20261021_ft.txt
#   ・フットボールトライブ（日本語版）2026-10-21 08:57「田中碧に『ミスって思ってなかった』伊東純也が告白！日本代表OBは『取り上げないでほしい』と一部報道に注文」
#     https://football-tribe.com/japan/2026/10/21/360584/ 。**久保裕也氏の公式YouTubeチャンネルの対談動画（20日までに公開）の発言を文字にした記事**。動画本体は確かめていない
#     （YouTube を検索したが、この対談の動画は検索に出なかった）。→ 発言は「記事に書き起こされたもの」。確度は報道。
# 【題材の一覧の言葉を原文で引き直した点】
#   ・一覧は「伊東はベルギー1部ジェンク」と書いたが、記事は「ヘンク」。clubs.yaml の正式表記は「ゲンク」（aka にヘンク）。→ 台本は clubs.yaml に合わせて「ゲンク」。
#   ・一覧は「後半アディショナルタイムのボールロスト」。記事は「1-1で迎えた後半アディショナルタイム、田中のボールロストからブラジル代表FWガブリエウ・マルティネッリにゴールネットを揺らされた」。
#     試合の最終スコアは記事に無い（「ブラジル代表に敗れた」まで）。→ 台本は「敗れた」までで、スコア・日付は言わない。
#   ・「全部回収していた」は記事では「（ボールを）全部回収していたので」。**（ボールを）は記事の補足**。→ 台本は伊東の声に「全部回収していたので」だけを入れる。
#   ・記事の久保裕也氏の言葉「あれがあったからこそ、（ブラジル戦の）最後のところのミスを取り上げないでほしいと思いますけど」の **（ブラジル戦の）も記事の補足**。→ 声からは外す。
#     久保裕也氏は元日本代表（日本代表OB）。**久保建英とは別人**。台本は「久保裕也氏」と必ずフルネームで言う（建英と取り違えさせない）。
#   ・「一部報道に注文を付けている」は記事の地の文。どの報道かは記事に無い → 台本は「一部の報道に」とだけ言う。
#   ・記事は「試合後、田中はピッチ上で泣き崩れた」「W杯後しばらくメディア出演しなかった」とも書く。**泣き崩れた件は使わない**（題に関係が無く、本人を小さく見せかねない）。
#     メディア出演の件は見立ての節に1行だけ使う（記事の地の文。本人の言葉ではない）。
#   ・台本は田中のプレーを「ミス」と自分では呼ばず、事実としては「ボールロスト」（記事の語）と言う。「ミス」は伊東と久保氏の言葉の中にだけ出る。
# 本人の言葉: 伊東純也本人の言葉あり（記事の引用3つ）。久保裕也氏（対談の聞き手）の言葉あり。田中碧本人の言葉は無い → 作らない。
# 反応: 探していない（0件。作らない）。
# 前の本との重なり: 10/17〜10/20 の田中碧のショートは、リーズの契約延長・試合前の見立て・マンU戦1-1・地元紙の採点5点。どれも代表のブラジル戦には触れていない。
#   同日の「田中碧と手袋」の本とは、鈴木彩艶の名が出る点だけ共通（こちらは伊東が挙げた名前、あちらは監督の言葉の中の「鈴木」）。写真は別の組。
# 写真: 10/17〜10/20 に使ったリーズ公式の田中碧の写真・Commons の2025年フルハム戦の写真は使い回さない。伊東は所属がゲンクなので、リーグの話に寄せない。
