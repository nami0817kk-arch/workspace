- id: secret
  heading: 数字の外にある話。最初の取材相手と、4年を永遠と呼んだ理由
  tier: 確定
  official: true
  telop: 最初のインタビューは、ノエル・ギャラガー
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [2016年, シティでの最初のインタビューは、ノエル・ギャラガー]
    - [2012年, 4年で、バルセロナを離れる。疲れが理由]
    - [2012〜13年, ニューヨークで、1年の休養]
    - [2026年, 声明の最後に「オアシスが戻ってきた」]
    highlight_row: 0
    source: シティ公式・英語版Wikipedia
  say:
  - text: ひとつめは、2016年。シティの監督として、最初に受けたインタビューの話です。
    image: assets/images/20261021_manager_guardiola/04_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 相手は、マンチェスター出身のバンド、オアシスの、ノエル・ギャラガーでした。
    card: none
  - text: 本人は、声明で、こう振り返っています。
    image: assets/images/20261021_manager_guardiola/02_w.jpg
    card: none
  - voice: グアルディオラ
    text: 到着して、最初のインタビューの相手は、ノエル・ギャラガー。
  - voice: グアルディオラ
    text: 部屋を出ながら思いました。ノエルがいるのか。
  - voice: グアルディオラ
    text: これは、楽しくなる。
    cont: true
    pause: 0.6
  - text: 声明の締めくくりも、同じバンドの話です。
    image: assets/images/20261021_manager_guardiola/06_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  - voice: グアルディオラ
    text: 時が終わるのだから、喜んでください。
  - voice: グアルディオラ
    text: オアシスが、戻ってきたのですから。
    cont: true
    pause: 0.6
  - text: ふたつめは、2012年。去った理由です。
    image: assets/images/20261021_manager_guardiola/07_w.jpg
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 疲れが、いちばんの理由だと話しました。4年は、永遠のように感じたとも。
    card: none
  sources:
  - https://www.mancity.com/news/mens/pep-guardiola-official-announcement-63915039
  - https://en.wikipedia.org/wiki/Pep_Guardiola
