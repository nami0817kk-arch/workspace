- id: words
  heading: 本人は、去るときに、何を語ったのか
  tier: 確定
  official: true
  telop: 退任の声明と、最後の記者会見の言葉
  narrator: 解説
  card: &words_doc
    type: document
    label: グアルディオラの声明（2026年5月22日、訳）
    paragraphs:
    - 理由は聞かないでください。理由はありません。でも心の奥で、いまが自分の時だと分かっています。
    - 永遠のものはありません。もし永遠なら、私はここにいるでしょう。永遠に残るのは、感情と、人々と、思い出と、シティへの愛です。
    highlight:
    - いまが自分の時
    - 永遠に残るのは
  say:
  - text: 2026年5月22日。クラブの公式サイトに、グアルディオラの声明が載りました。
    image: assets/images/20261021_manager_guardiola/06_w.jpg
    card: none
  - text: 声明は、シティに残るものを、こう語っています。
    card: *words_doc
  - voice: グアルディオラ
    text: 永遠のものは、ありません。もし永遠なら、私はここにいます。
  - voice: グアルディオラ
    text: 永遠に残るのは、感情と、人々と、思い出と、シティへの愛です。
    cont: true
    pause: 0.5
  - text: 最後の試合の前の記者会見では、10年の変化を、こう語っています。
    image: assets/images/20261021_manager_guardiola/02_w.jpg
    card: none
  - voice: グアルディオラ
    text: 以前、ノエル・ギャラガーに言いました。
  - voice: グアルディオラ
    text: 私たちは、4連勝もできないチームだった。
    cont: true
  - voice: グアルディオラ
    text: それがいまは、4連覇です。
    cont: true
    cont: true
    pause: 0.6
  - text: 試合のあとの記者会見では、後任へのメッセージも、残しています。
    card: none
  - voice: グアルディオラ
    text: あなたらしくいてください。クラブは、無条件で支えてくれます。
    pause: 0.6
