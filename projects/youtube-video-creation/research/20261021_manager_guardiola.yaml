# 監督紹介：グアルディオラ（10/21 水、シリーズ「監督紹介」、key: manager_guardiola、型は news）。9節の型（2026-10-20 決定）。
# 最初の試作（サムネ案づくり専用）を、本編用に作り直したもの。
#
# **いまの立場（一次で確かめた）**
#   ○ マンチェスター・シティ公式（mancity.com）2026-05-22 11:10「Guardiola to step down after incredible decade as City Manager」
#       https://www.mancity.com/news/mens/pep-guardiola-official-announcement-63915039
#       「今夏、監督を退く」「2016年7月に加入。20の主要タイトルを獲り、クラブ史上最も成功した監督」「シティ・フットボール・グループのグローバル・アンバサダーとして関係を続ける
#       （技術的な助言、特定のプロジェクト）」。本人の声明（原文）：「And what a time we have had together. Don't ask me the reasons I'm leaving.
#       There is no reason, but deep inside, I know it's my time. Nothing is eternal, if it was, I would be here. Eternal will be the feeling, the people, the memories,
#       the love I have for my Manchester City.」「When I arrived, my first interview was with Noel Gallagher…」「Oasis are back again.」
#       内訳（クラブ公式）：プレミア6・リーグカップ5・FAカップ3・コミュニティ・シールド3・チャンピオンズリーグ1・UEFAスーパーカップ1・クラブW杯1＝20。
#   ○ シティ公式（試合記事）：最後の試合は 2026-05-24 のアストン・ヴィラ戦（2-1で敗戦。60,332人の観客、ノースの新スタンドは「The Pep Guardiola Stand」と名付けられた）。
#       https://www.mancity.com/news/mens/city-v-aston-villa-guardiola-stones-bernardo-last-game-63915228　2025-26 は FAカップとリーグカップを獲り、プレミアは2位。
#   ○ シティ公式（記録）：https://www.mancity.com/news/mens/pep-guardiola-manchester-city-stats-records-63915079
#       593試合（最後の試合で、シティの監督として最長のゲーム数＝マクドウォールの592を超えた）・416勝（約70%）／プレミア380試合で勝ち点865（1試合2.28、プレミア最多の10年）／
#       プレミア269勝（約70%。ファーガソン65.2%・クロップ62.5%・モウリーニョ59.2%・ヴェンゲル57.2%）／得点904・失点328（得失点差+576）／2017-18に勝ち点100（プレミア記録）。
#   ○ シティ公式（記者会見）2026-05-22・05-25：https://www.mancity.com/news/mens/pep-guardiola-final-press-conference-pre-aston-villa-63915053 ・
#       https://www.mancity.com/news/mens/pep-guardiola-manchester-city-final-press-conference-reaction-63915248
#       「ノエル・ギャラガーに、数年前に言った。私たちは4連勝もできないチームだった。いまは4連覇だ」「後任には、あなたらしくいなさい、クラブは無条件で支える、と伝える」
#       「クラブの別の役割で、決定は一切しない。日々の決定や脚光ではなく、裏側で関わりたい」
#   ○ シティ公式 2026-06-29：エンツォ・マレスカを後任に任命（3年契約、2029年夏まで）。https://www.mancity.com/news/mens/enzo-maresca-manchester-city-manager-63918331
#   → 題・語りは「前シティ監督」「2026年5月まで」。**退任は一次（クラブ公式）で確かめた。**
#
# **通算の数え方（台本とサムネをそろえる）**＝バルセロナBを除いたトップチーム。**英語版 Wikipedia「Pep Guardiola」Career statistics > Managerial（2026-05-24 時点）**
#   バルセロナ 247試合179勝47分21敗（勝率72.5%）／バイエルン 161試合121勝21分19敗（75.2%）／シティ 593試合416勝87分90敗（70.2%）＝**1001試合716勝155分130敗（71.5%）**。
#   優勝：Honours 欄 バルセロナ14（リーグ3・国王杯2・スーパーカップ3・CL2・UEFAスーパーカップ2・クラブW杯2）＋バイエルン7（ブンデス3・DFB杯2・UEFAスーパーカップ1・クラブW杯1）＋シティ20（クラブ公式）＝**41冠**。
#   裏取り：バルセロナ14冠＝スカイスポーツ「Pep's Barca years」（「14 trophies in four years」。同記事の試合数は246試合178勝で、Wikipediaより各1少ない）／
#   バイエルン7冠＝Bundesliga公式「Pep Guardiola: the Bayern Munich years」（「winning seven trophies in three seasons」）。
#   **バルセロナの試合数は出典で1試合ちがう（247か246）。台本では「約1000試合」ではなく板の数字（Wikipedia）を使い、食い違いは報告に書く。**
#   バルセロナ時代の期間 2008-12（4季）、バイエルン 2013-16（3季）、シティ 2016-26（10季）＝17季。
# **選手時代・基礎**：Wikipedia：1971-01-18 生まれ（カタルーニャのサンペドール）。バルセロナで1990-2001（リーグ戦263試合・全体382試合11得点）、スペイン代表47試合5得点、1992年バルセロナ五輪の金メダル（スペインU23）、1991-92に欧州カップ優勝。
#
# **歩みと転機（Wikipedia の監督歴の節。数字は読んで確かめた）**
#   2007-08 バルセロナB（3部で優勝し、昇格戦も勝って昇格）→ 2008 トップ就任（ロナウジーニョ・デコ・エトーを構想外と発表。エトーは結局残った）→ 2008-09 国内2冠＋チャンピオンズリーグ（スペイン勢初の3冠。37歳で、CL優勝チームの最年少監督）→
#   2009年 暦年で6冠（史上初）→ 2010-11 CL2度目 → 2012-04-27 退任表明（疲れが主な理由。4年は永遠のように感じた）→ ニューヨークで1年の休養 → 2013 バイエルン（ドイツ語で会見。ブンデス3連覇）→
#   2016 シティ（2016-17 は監督として初めて無冠）→ 2017-18 プレミア勝ち点100 → 2018-19 国内4冠（史上初）→ 2022-23 3冠（CL初優勝）→ 2023-12 クラブW杯でシティ初（本人は史上最多の4回）→
#   2024-25 無冠（監督として初めて4連敗）→ 2025-26 FAカップ・リーグカップ → 2026-05-22 退任発表。
# **戦術の色（実例の試合＝2009-05-02 レアル・マドリード 2-6 バルセロナ、ベルナベウ）**
#   ○ バルセロナ公式「Once años del 2-6 en el Santiago Bernabéu」（fcbarcelona.es、2020-05-02）：マドリードが先制（イグアイン）→ アンリとプジョルが5分のあいだに逆転 →
#       ピケがバルセロナでの公式戦初ゴールで6点目。「グアルディオラとメッシが、位置の入れ替えを決めた。右から真ん中の攻撃の位置、偽9番」。
#       **得点者の数（メッシ2・アンリ2）は公式で確かめていないので、台本に出さない。**
#   ○ 英語版 Wikipedia「Tactics」：ボール保持と、GKや守備陣からのつなぎ／奪われたら相手陣のなかで集団で奪い返す／形を変える（バルサ・バイエルンの4-3-3と3-4-3、2022-23のシティは3-2-2-3、ストーンズを中盤の役に）。
#
# **日本との接点**：2011年12月、日本（横浜・豊田）で開かれたクラブ・ワールドカップ。バルセロナは決勝でサントスに4-0（Wikipedia：同大会の開催都市・グアルディオラの節）。通算13個目のタイトル（16大会のうち）。
#   メッシが大会最優秀選手（Golden Ball）。**決勝の会場名は確かめていないので言わない。**
#
# **入れなかったもの**：私生活（家族・個人的な出来事）、年俸、代理人、法的な問題（シティの115件の訴え）、後任の評価、他の監督との優劣の話（クラブ公式の勝率の比べだけ、数字として使う）、
#   女子チームの話、日本人選手の話（グアルディオラとの直接の接点は見つからなかった）、Jリーグの話。
# **日本語名・読みで怪しいもの**：グアルディオラ、サンペドール、バルセロナ、バイエルン、ミュンヘン、ノエル・ギャラガー、オアシス、アンリ、プジョル、ピケ、イグアイン、メッシ、サントス、マレスカ、ストーンズ、ベルナベウ、マクドウォール。
#
