  takeaway: 5大リーグのリーグ戦だけで数えた1シーズンの最多得点は、2011-12のメッシの50点。リーグ・アンの記録は1970-71のスコブラルの44点、ブンデスリーガは2020-21のレヴァンドフスキの41点で、レヴァンドフスキは29試合しか出ていないため1試合あたり1.414となり、6つの記録で最も高い（メッシ1.351、スコブラル1.222）。90分あたりは1.498で、出場分の分かるメッシの1.377を上回る。同じ36点でもインモービレは14本がペナルティーキックで38.9%、イグアインは3本と伝えられていて差は11本。いまの試合数に置き直すと、ディーン58.5・メッシ51.4・レヴァンドフスキ48.1・スコブラル41.6で、点の数で上だったスコブラルが下に回る。チームの得点に占める割合はディーンが58.8%、ハーランドが38.3%で、スコブラル46.8%がメッシ43.9%を上回るように、得点の数が多い記録ほど比重が大きいとは限らない。今季はラフィーニャが7試合12点で90分あたり1.946、このままなら65.1という計算になる
