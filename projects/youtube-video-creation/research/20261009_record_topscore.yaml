# 取材メモ（10/9 金、シリーズ「記録の解説」、key: record_topscore、型は news）。
# 材料の控えは research/raw/20261009_record_topscore_material.md。**この控えの外へ出ていない。**
#
# 軸は「**得点の数だけでは順番が決まらない**」。
#   山場の頭に置く強い一点は、レヴァンドフスキの41点が**29試合**で取った数字で、
#   点の数では上のスコブラル44点・メッシ50点を、**1試合あたり（1.414 / 1.222 / 1.351）では上回る**こと。
# **流れの点検（2026-10-08、読み手は Claude の下請け）で見つけた誤りを直した**:
#   「5大リーグの1シーズン最多は44点（スコブラル）」と書いていたが、**5大リーグのリーグ戦の最多はメッシの50点**。
#   44点は「レヴァンドフスキの41点より上」でしかない。題・short_title・takeaway・サムネの伏せ字を全部直した。
# 直前2本と重ねないようにしたもの:
#   10/8 ペドロの回（引退・銀器25個・バルサ321試合99得点）… 「◯試合に1点の割合」「およそ9か月に1つ」の言い回しと
#     calc の「÷ ＝」の2段は使っていない（この回の calc は ÷ × ＝ の3段）。ペドロ・バルサの話は一度も出さない。
#   10/7 ケインの回（代表の最多出場）… 「歴代◯位」「同じ◯試合で比べる」の形は使わない。代表の話は出さない。
#   10/7 メッシの引退試合の回… メッシは 2011-12 のリーグ50点としてだけ出す。代表・引退の話はしない。写真も別の1枚にした。
#   10/7 トルシエの回と「順番が入れ替わります」が重なったので、言い回しを変えた。
# **枠を必ず付けたもの**（材料 §0・§7）:
#   表と語りは**リーグ戦だけ**で統一し、節の中で「リーグ戦だけで数えた」と声に出す。
#   全公式戦（メッシ73点）は後半に分け、「全公式戦では」と言ってから出す。暦年の91点は出さない。
#   プレミアリーグ（1992年〜）とイングランド1部は別の枠として、ディーン60点は時代の段で扱う。
#   ロセッティ36点はディヴィジオーネ・ナツィオナーレなので**表に入れず、1行だけ触れる**。
# **90分あたりを出していないもの**: スコブラル・イグアイン・ディーン（出場分が取れていない。材料 §2）。
#   出場分が取れたのは4つ（レヴァンドフスキ1.498／メッシ1.377／ハーランド1.167／インモービレ1.020）だけなので、
#   **90分あたりで「5つの記録のなかでいちばん高い」とは言わない**。比べるのは1試合あたり（6つそろう）。
#   板の注記も「90分あたりの得点」にとどめ、順位は書いていない。
# 言い切っていないもの: スコブラルのPKゼロ・イグアインのPK3本は「伝えられています」。
#   全公式戦の73点は「2000年以降では最多」までにして「史上最多」と言わない。
# 自分で計算した数（材料 §2・§6 に式と元の数字がある）: 90分あたり・1試合あたり・PKの割合・
#   いまの試合数への置き直し（60÷39×38=58.5／50÷37×38=51.4／41÷29×34=48.1／44÷36×34=41.6）・
#   チームの得点に占める割合・ラフィーニャの 12÷7×38=65.1。
# 今季の数字は research/scorers/2026-10-01.json の控えと突き合わせた（ラフィーニャ12点7試合555分、
#   鈴木唯人4点4試合323分、ハーランド5点5試合、マレン6点5試合、トーレスとブルナー4点）。10/8 取り直しでも順位は動いていない。
# 日本人（鈴木唯人）は今季の節で自然に触れるだけ。**題にもサムネにも出さない**（10-05 の決まり）。
# 反応は入れない（シリーズの回。ブラウザの道具を使っていないので集めていない）。本人の言葉も引いていない。
# アルファベットは読み上げに出さない（PK → 「ペナルティーキック」。板の題にだけ PK と書いてある）。
# 写真: メッシ（Commons CC BY-SA 4.0）とレヴァンドフスキ（Commons CC BY-SA 3.0）を tools/pairphoto.py で横に並べた1枚を
#   冒頭と前半に敷く（縦版 01_v.jpg がショート用）。後半は今季の話に合わせてラフィーニャ → 鈴木唯人 → ハーランドへ。
#   レヴァンドフスキの単体写真は元が 820x460 しかないので、全面に敷かず並べた1枚の右半分として使っている。
# サムネは構図 versus（記録の並びはこの構図、と CLAUDE.md にある）。同じ日の3本は number・scene・scene。
#   伏せるのは「1試合あたりで上は●●」＝レヴァンドフスキ。点の数は50と41でメッシが上なのに、
#   1試合あたりは1.351と1.414で逆になる、という伏せ方。作り込みの tint と rays は切った（右半分が赤く染まったため）。
