# 題材の元: サッカーキング 2026-11-04「30歳の坂元達裕が5年ぶりに日本代表復帰！　森保一監督が期待を口に『次のW杯でも十分…』」 https://www.soccer-king.jp/news/japan/national/20261104/2224360.html （全文）
# 出典で確かめたこと:
#   ・JFA は4日、シンガポール遠征の日本代表28人を発表。坂元達裕（コヴェントリー／イングランド）は2021年6月以来約5年ぶりの招集（サッカーキング）。
#   ・森保監督の言葉（サッカーキング、原文のまま。記事は鉤括弧で全文を引いている）:
#       「世界最高峰のリーグと言われているプレミアリーグでレギュラーの座を掴み、試合に出ているので、年齢的にはベテランの域ですが、目指すべきところで輝いて活躍しているということで招集しました。
#        今のコンディションを維持し、さらに経験値を上げていけば、次のワールドカップでも十分日本の戦力になると思います。
#        左利きの良さもありますし、攻守で本当にアグレッシブにプレーできる、日本が世界で戦うために必要なことを示してくれていると思うので、今回の活動で見させてもらえることは非常に楽しみです」
#       → 台本は読点・句点で行に分けた。言葉は1字も変えていない（「ですが、」の読点は原文どおり）。
#   ・年齢: 生年月日 1996-10-22（ja.wikipedia）から 2026-11-05 時点で30歳。前回の招集時（2021年6月）は24歳。日本代表の区分は JFA の MF/FW。
