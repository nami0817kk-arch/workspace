# 取材メモ（2026年10月19日）チェルシーGK エミリアーノ・マルティネス、顎の骨折で手術（ニュースのショート。見せ方 Y＝本人の一言から始める）
# 怪我の話なので、敬意を持った言い方にする。診断・離脱期間は出典の言葉のまま（強めない・推測しない）。
# 取材: 2026-10-19。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261019_emartinez_sk.txt・_gk.txt・_sk18.txt。
#   ・サッカーキング 10/18（2218021）「チェルシーの守護神E・マルティネス、顎の骨折で手術実施…約1カ月半の離脱か」— 題材の元。
#       17日エヴァートン戦（2-0）で相手DFブランスウェイトと空中で衝突、約10分の治療のあと担架で交代。『オレ』（アルゼンチン紙）によると
#       頭部CTと首・背中の検査は問題なし『模様』、顎の骨折が認められ手術が必要になった『ようだ』。『通常は6週間、長期化すれば2カ月ほどの離脱が見込まれる』
#       （サッカーキングの書き方。クラブの発表ではない）。トッテナム・リヴァプール・マンU戦と11月の代表ウィークは欠場へ。12月の復帰は『望まれる』（台本では言わない）。
#       本人の Instagram の日本語訳:「メッセージをくれたみんなへ。おかげさまで手術は順調に終わったよ。最も重要なことは勝利とクリーンシート。数週間後にまた会おう」
#   ・ゲキサカ 10/18 15:56（461304）「…頭部強打であご骨折…緊急搬送で即手術も『数週間で戻ります』」— アルゼンチン『Infobae』の伝え、『La Nación』が関係者に確認した情報として
#       顎の骨折で同日夜に手術と報道。インスタグラムに病室の写真を投稿し「…ありがとう。手術はうまくいきました。一番大事なのは、勝って無失点に抑えたこと。数週間で戻ります」。
#       ペンダースが代わりに出場して2-0で勝利。
#   ・サッカーキング 10/18（2217849）— 68分、エヴァートンMFデューズバリー＝ホールのクロスをキャッチに行き、ブランスウェイトと衝突。アロンソ監督は試合後
#       「脳震とうだったのは確かだが、それ以上のことはわからない」「意識のある状態でスタジアムを後にし、念のため病院で検査を受けている」。チームのリーグ戦初完封勝利。
# 本人の言葉の確度: 原文（スペイン語のはず）の Instagram は読めていない（Web検索でも見つからず）。日本語の2社（サッカーキング・ゲキサカ）の訳が
#   「手術はうまくいった／大事なのは勝利とクリーンシート（無失点）／数週間で戻る・会おう」で一致する。言い回しは2社で違うので、台本は2社が一致する意味だけを自訳で言い、
#   「日本語の報道からの訳で、原文そのままではない」と断る。「数週間」は本人の見通しで、クラブ・医師の発表ではない（台本で別に言う）。
# 言わないこと: 病名の推測（手術の方法・頭部の状態）、復帰日、12月の目標、脳震とうの有無（最初の診断は『脳震とう』だったが、のちの報道は検査で頭部に問題なしの『模様』。断定しない）。
# 自分で数えた比べ（見立て）: 第7節で初めてのリーグ戦完封（サッカーキング18日の『リーグ戦初完封勝利』）。本人の言葉『勝利とクリーンシート』と同じ話。
# 確度: 骨折・手術は 報道（オレ／ラ・ナシオン経由・クラブの発表は読んだ記事の範囲では無い）。本人のInstagramは 本人（日本語訳）。離脱期間は 報道（サッカーキングの見込み）。
# 反応: 0件。作らない。approve は --no-voices で。
