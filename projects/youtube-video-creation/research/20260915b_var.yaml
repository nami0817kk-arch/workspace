# ダービーのVAR担当者2人が、今週末の担当から外された（2026-09-15）
#
# **9/14 公開の「数時間後に審判団が認めた誤りとは？」の続き。**
# 誤りを認めただけでは終わらず、担当から外れるところまで来た
format: news
