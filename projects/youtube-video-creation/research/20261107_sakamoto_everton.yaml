# 題材の元: ゲキサカ 462653（11/7 06:55）「5年半ぶり代表復帰の坂元達裕は好守備、先制ゴール関与で魅せるも…コベントリーは逆転負け」（全文）。
# 出典で確かめたこと:
#   ・ESPN の試合データ（site.api.espn.com summary event=401879242、11/6 20:00 UTC キックオフ、ヒル・ディッキンソン・スタジアム）:
#       エヴァートン 3-1 コベントリー。52分 グボホ（コベントリー、ESPN は得点者のみ。アシストの記載なし）／56分 バリー（ヘディング、ミコレンコのクロス）／61分 バリー／81分 デューズバリー＝ホール（バリーの縦パス）。
#       坂元は先発（フォーメーション 4-2-3-1）、86分に交代（チョーナと交代）。ゲキサカの「後半41分」と一致。シュート1（枠内1）、ファウル2。
#   ・ゲキサカ: 坂元は前節サンダーランド戦でプレミア初ゴール、3試合連続先発 → 今節は4試合連続の先発（右サイドハーフ）。5年半ぶりに日本代表へ復帰。
#       前半36分 ルドニのパスで PA 右に入り、反転して右足（利き足と逆）でシュート → GK 正面。前半41分 右サイドでボールを奪い切りカウンターのスイッチ。
#       後半7分（ESPN の52分）、GK ラッシュワースのフィードを右の坂元がヘディングで制して攻撃開始 → PA 中央へ移動してグボホのパスを受け、左足でゴール前へ → グボホが押し込んで先制。
#       後半41分に交代。2連勝ならず。代表ウィークを挟んだ21日の次節はクリスタル・パレス戦。
#   ・CoventryLive 2026-11-06 選手採点・ライブ（全文を読んだ）: 36分 ルドニの絶妙なパスで坂元が右に抜けたが、ピックフォードの正面へ。40分 坂元がミコレンコの足元からボールを奪いルドニへ（ルドニのシュートはポストの外）。
#       52分 グボホは坂元とパス交換して押し込み、先制。（採点の個別の一文は誰のものか本文の並びから確定できないので使わない）
#   ・エヴァートン公式の試合レポート（evertonfc.com/news/2026/november/06/coventry-report/）にも、坂元の反転シュート（脚に当たってGKへ）と、グボホの先制ゴールの前の坂元とのパス交換の記述がある（英語）。
#   ・ESPN 順位表（eng.1、11/7 取得）: コベントリー 10試合 3勝7敗 勝ち点9 16位（試合前も16位）。エヴァートン 勝ち点16 5位。パレス 9試合 勝ち点7 18位。
# 自分で数えたもの: 坂元の先発4試合の出場時間 トッテナム戦78分 → フラム戦86分 → サンダーランド戦90分（フル）→ エヴァートン戦86分。4試合とも78分以上、最長は11/1 の90分。
#   （11/4 の本の見立ては「78→86→90 と延びた」。今回の86は延びではなく少し戻った数なので、「先発のたびに延びた」とは言わない）
