- id: view
  viewpoint: true
  heading: 見立て・1季目に強いコンテは、欧州の壁を越えられるのか
  tier: 背景
  telop: 7位、10位、10位のチームを、どれも1季目で優勝させた
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた（就任の前の季の順位と、1季目）
    columns: [クラブ, 前の季, 1季目]
    rows:
