    - [チェルシー（2016年）, 10位, 優勝]
    - [ナポリ（2024年）, 10位, 優勝]
    - [インテル（2019年）, 4位, 2位]
    highlight_row: 0
  say:
  - text: 見立てです。就任する前の季の順位と、コンテの1季目を並べました。
    image: assets/images/20261108_manager_conte/03_w.jpg
    card: *view_table
  - text: ユヴェントスは7位から、優勝。
    card:
      <<: *view_table
      highlight_row: 0
  - text: チェルシーは10位から、ナポリも10位から、どちらも1季目で優勝です。
    emph: true
    mark: {kind: circle, row: 2, col: 1}
    card:
      <<: *view_table
      highlight_row: 2
  - text: インテルだけは1季目が2位で、2季目に優勝しました。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 負けが続けば形を変える決断と、選手に答えを用意しておく準備。
    image: assets/images/20261108_manager_conte/01_w.jpg
    card: none
  - text: 沈んだチームを1季目から立て直せる理由は、そこにあると考えます。
    card: none
  - text: 一方で、チャンピオンズリーグでは、16強の先へ進んだのは1度だけです。
    card: none
  - text: 次の行き先は、まだ公式には出ていません。
    card: none
  - text: 次の仕事で、欧州の大会の壁を越えられるかに注目です。
