# 監督紹介：アントニオ・コンテ（11/8 日、シリーズ「監督紹介」、key: manager_conte、型は news）。9節の型（2026-10-20 決定）。見本は 20261106_manager_slot。
# 順：フック→基礎DATA→（日本との接点＝無し）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-05）**：既出12人（グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック・ベンゲル・ファーガソン・トゥヘル・ルイス・エンリケ・スロット）以外の大物。
#   ・シャビ・アロンソ（チェルシー監督）は大物だが、直近30日に covered.yaml でニュース3件（10/24 退場ゼロほか）、scripts/ でも 10/23 レバークーゼンのクラブ紹介・10/24 のチェルシーのニュースなど9本に名前が出る。外した。
#   ・ポステコグルーは日本との接点（横浜F・マリノス）が強いが、Jリーグの話が軸になり、大物の順でも後ろ。エメリ・マレスカ・ナーゲルスマンは直近の scripts に名前が複数出る。ジダンは 10/18 のレジェンドで出ている。
#   ・コンテ：イタリアのセリエAを3つの違うクラブで制した初めての監督（ユヴェントス・インテル・ナポリ）＋チェルシーでプレミア優勝。大物。
#   **重なりの確認（2026-11-05 に自分で）**：research/posted.json に「コンテ」0件、research/covered.yaml に0件。scripts/ は 10/17 の kvaratskhelia（クヴァラツヘリアの退団の経緯に1行）だけで、監督コンテを主役にした本は無い。
#   同じ 11/8 の他の担当（research/20261107_picks.txt）：代表＝クロアチア、クラブ紹介＝ブレーメン。人名・国（イタリア）は重ならない。
#   **日本との接点**：コンテが率いたチームに日本人選手は見当たらない（ユヴェントス2011-14・チェルシー・インテル2019-21（長友は2018年に離れている）・トッテナム・ナポリの在籍を英語版で確認）。日本代表との対戦も無い。→ 節は置かない（10/6 の決定どおり、無理に入れない）。
#
# **いまの立場**：無所属（前ナポリ監督）。
#   ○ 英語版 Wikipedia「Antonio Conte」（2026-11-05 版）本文：「his most recent managerial stint being at Serie A club Napoli」「At the end of the 2025–26 season … Conte left the club by mutual consent at the conclusion of the season」。
#   ○ イタリア語版（Aggiornato = 4 giugno 2026）：監督歴は「2024-2026 Napoli」で終わる。
#   ○ 検索（2026-11-05）：10月下旬の報道まで「次のクラブは未定」（ユヴェントス・マンU・イタリア代表のうわさ止まり）。**クラブの公式発表は見つからない**。英語版の infobox に「2026–」の空欄が残り、10月に匿名の書き換えと差し戻しが数回あった（うわさの書き込みと見て数えない）。
#     → 台本は「次のクラブは、まだ発表されていません」とだけ言う。うわさの名前は出さない。
#
# **通算（台本とサムネをそろえる）**＝英語版 Wikipedia「Managerial record by team and tenure」（updated match played 24 May 2026）：
#   アレッツォ 12試合1勝・15試合8勝／バーリ 67試合32勝／アタランタ 14試合3勝／シエナ 44試合22勝／ユヴェントス 151試合102勝34分15敗／イタリア代表 25試合14勝／チェルシー 106試合69勝17分20敗／インテル 102試合64勝23分15敗／トッテナム 76試合41勝12分23敗／ナポリ 91試合52勝22分17敗。Career total 703試合408勝165分130敗。
#   自分で足して一致（12+15+67+14+44+151+25+106+102+76+91＝703、1+8+32+3+22+102+14+69+64+41+52＝408）。下部組織は含まない（トップチームと代表だけ。アレッツォは2回の就任＝10チーム）。
#   勝率（自分で割った）：通算 58.0%、ユヴェントス 67.5%、チェルシー 65.1%、インテル 62.7%、ナポリ 57.1%、トッテナム 53.9%、イタリア代表 56.0%。
#   ※アレッツォ〜シエナの行に「citation needed」の札。上の大きなクラブの行と合計は出典つき。確度は 報道。
#   **ナポリは季ごとの表で突き合わせた**（英語版「2024–25 SSC Napoli season」「2025–26 …」の Overall record）：
#     2024-25：セリエA 24勝10分4敗（勝ち点 24×3+10＝82、インテルに1点差で優勝）・コッパ・イタリア 1勝1分1敗 → 41試合25勝11分5敗。
#     2025-26：セリエA 23勝7分8敗（2位、勝ち点76）・コッパ 0勝2分・スーペルコッパ 2勝（優勝）・CL 2勝2分4敗（リーグフェーズ敗退） → 50試合27勝11分12敗。
#     合計 91試合52勝22分17敗 ＝ 通算の表と一致。
#   タイトル（Honours・Manager）：セリエB 2008-09（バーリ）／セリエA 2011-12・12-13・13-14（ユヴェントス）・2020-21（インテル）・2024-25（ナポリ）＝5回／スーペルコッパ 2012・2013・2025-26／プレミアリーグ 2016-17・FA杯 2017-18（チェルシー）。
#
# **基礎**：1969-07-31 イタリア・レッチェ生まれ（2026-11-05 時点で57歳）。選手：MF。レッチェ（1985-91）→ユヴェントス（1991-2004）。英語版本文：1986-04-06 に16歳でセリエAデビュー。ユヴェントスで13季、公式戦418試合43得点、主将も務めた。CL 1995-96 優勝。イタリア代表20試合2得点、1994年W杯・EURO2000 で準優勝。
#
# **歩みの細部**（英語版本文と各季の記事）：
#   2006 アレッツォ（2部）で監督に。2007-08 途中からバーリ、2008-09 にセリエBで優勝して昇格。2009 アタランタ（翌年1月に辞任）。2010-11 シエナを1部へ昇格させる。
#   2011-05 ユヴェントス監督に。前の2季は7位・7位（英語版「2009–10」「2010–11 Juventus FC season」の league result）。1季目 2011-12 は38試合無敗（23勝15分、勝ち点84）で優勝＝20チーム38節になってから初の無敗優勝。2013-14 は勝ち点102（33勝）のセリエA記録。3連覇。
#   2014-08 イタリア代表。EURO2016 でベルギーに2-0、スペインに2-0、準々決勝でドイツとPK負け（1-1、PK 5-6）。
#   2016-07 チェルシー。前の季のチェルシーは10位（英語版「2015–16 Chelsea F.C. season」）。2016-17 プレミア優勝（30勝3分5敗、勝ち点93）。2018 FA杯優勝、7月に解任。
#   2019-05 インテル。2020-21 に11年ぶりのセリエA優勝、ユヴェントスの9連覇を止めた。
#   2021-11 トッテナム、2021-22 は4位でCL出場権。2023-03 合意で退任。
#   2024-06 ナポリ。前の季のナポリは10位（英語版「2023–24 SSC Napoli season」）。2024-25 に優勝＝3つの違うクラブでセリエAを制した初めての監督（英語版、The Athletic 2025-05-23 を出典に）。2025-12-22 スーペルコッパ優勝（リヤドでボローニャに2-0）。2025-26 は2位、2026-05 に合意で退任。
#   英語版：CL では16強を越えたのは1回だけ、という批判がある（見立てで公平に触れる）。
#
# **戦術の色**＝2016-17 のチェルシー（英語版「2016–17 Chelsea F.C. season」本文）：
#   9月24日 アーセナルに0-3（その前にリヴァプールにも負け、9月は勝ち点9のうち1）。→ 10月1日 ハル戦（アウェー）で 3-4-3 に変え、2-0（ウィリアン・コスタ）。後ろはケーヒル・ダビド・ルイス・アスピリクエタ、両脇にマルコス・アロンソとモーゼス。
#   リーグ13連勝（12月31日 ストーク戦で13、1月4日 トッテナムに負けて止まる）。11月5日 エヴァートンに5-0（シュート21本対1本）。英語版 Conte：実況のジョン・モットソンが「プレミアで見た最高の90分」と評した。
#   季の終わりに30勝（当時のプレミア最多）、勝ち点93。コンテは10・11・12月の月間最優秀監督＝3か月続けては史上初。
#   ユヴェントスでは 3-5-2 で、ピルロを後ろの司令塔に（英語版の Style of management）。
#
# **本人の言葉**：
#   ①2013年12月 ドバイ、グローブ・サッカー・アウォーズでの発言（FourFourTwo 2013-12-29「Great Italian tacticians influenced me, says Conte」。requests で本文を読んで確かめた）：
#     "I did not have Zinedine Zidane or Roberto Baggio's talent as a player, and I have played with both" / "my efforts and work-rate, my willingness to sacrifice fitness and humility made up for my lack of pure talent" / "As a manager, my first thought from day one was that I wanted to find solutions for my players when the ball reached them, as I could not."
#     "I want them to understand why we are doing certain things and why those things are useful."
#
# **マル秘話**（英語版の Style of management）：
#   ・ピルロの自伝：最初のあいさつで「このチームは2季続けて7位だ。どうかしている」。ピルロは「その一回の話で、私もユヴェントスも心をつかまれた」。
#   ・EURO2016、ボヌッチら選手は、話し出すと聞き入ってしまうコンテを「ゴッドファーザー」と呼んだ。（ボヌッチの名は読みが割れるので台本では「選手たち」）
#   ・チェルシーでは食堂の食事を絞り、試合の前の晩は選手をスタンフォード・ブリッジのそばのホテルに泊めた。
#   ・選手のころ：EURO2000 の初戦トルコ戦で、オーバーヘッドで得点（2-1）。
#
# **入れなかったもの**：シエナ時代の八百長の通報義務の処分（2016年に無罪。法的な問題は入れない決まり）、2023年の手術（病気）、家族・私生活、トッテナム退任前の会見の発言（選手を小さく見せる言葉）、チェルシーの解任の補償金、ブッフォンへの激高の逸話（言葉が荒い）、次の就任先のうわさ、1996年東京のインターコンチネンタル杯（けがで欠場＝けがの話）、FotMob・女子・ニュースの反応。
