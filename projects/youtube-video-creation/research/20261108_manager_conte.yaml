  say:
  - text: 本人の言葉です。2013年12月、ドバイでの授賞式で、こう話しています。
    image: assets/images/20261108_manager_conte/03_w.jpg
    card: *words_doc
  - voice: コンテ
    text: 選手のころの私には、
  - voice: コンテ
    text: ジダンやバッジョのような才能はありませんでした。
    cont: true
  - voice: コンテ
    text: 足りない才能は、努力と運動量、
    cont: true
  - voice: コンテ
    text: そして謙虚さで補っていました。
    cont: true
  - voice: コンテ
    text: 監督になって最初に考えたのは、
    cont: true
    image: assets/images/20261108_manager_conte/01_w.jpg
    card: none
  - voice: コンテ
    text: ボールが来たときの答えを、選手に用意することです。
    cont: true
  - voice: コンテ
    text: 私には、それができなかったからです。
    cont: true
    pause: 0.5
