    paragraphs:
    - 選手のころの私には、ジダンやバッジョのような才能はありませんでした。
    - 足りない才能は、努力と運動量、そして謙虚さで補っていました。
    - 監督になって最初に考えたのは、ボールが来たときの答えを、選手に用意することです。
