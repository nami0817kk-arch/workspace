# プレミアリーグ20クラブ紹介 ⑩フラム（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **⑥チェルシーの回で「フラムが断った」話を出している。**
# ここでも触れるが、**同じ説明は繰り返さない**（断られた側の話は向こうで済み）
#
# **2026-09-18 ユーザー指示で書き直した。**「アルファベット順では10番目」の行を消し、
# 各節の1行目をその節でいちばん引きの強い事実に入れ替えた。
# 優勝の節は「獲ったやつだけ」にし、「大きなタイトルはゼロ」「2度とも負けている」を落として、
# 2002年のインタートトカップと稲本潤一のハットトリックから入る形にした。
#
# **2026-09-18 ユーザー指示（もっと興味を引く形に）で、さらに直した。**
#   ・**稲本潤一のハットトリックを2番目の節へ前出しし、山場（@main）をここへ移した。**
#     引きは「5シーズン続けて、いる場所が変わった」から、この日本人の話に替えている
#   ・タイトルとサムネも稲本の引きにした（丸数字＋クラブ名＋引き）
#   ・**宿敵（rival）**と**このクラブを語る3人（legends）**の節を足した（出典は英語版Wikipedia）
#
# **2026-09-19 ユーザー指示（クラブの歴史はもう少しシンプルに）で、歴史の節を整理した。**
# 「2010年の決勝」（ヨーロッパリーグ準優勝。稲本の節に一行で残っている）を丸ごと落とし、
# 「5年続けて、いる場所が変わった」から昇格した年の内訳3行を落とした。**稲本潤一の節は触っていない。**
format: news
voice_min: 0
