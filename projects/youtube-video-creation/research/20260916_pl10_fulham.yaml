sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 日曜学校のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年9月"]
        - ["最初の名前", "Fulham St Andrew's Church Sunday School F.C."]
        - ["いまの名前", "1888年12月"]
        - ["愛称", "The Cottagers（コテジャーズ）"]
    say:
      - 創設は1879年9月。**教会の日曜学校のチーム**として始まりました。
      - 名前もそのままで、長い正式名称がついていました。
      - 短くなったのは1888年12月です。
      - ロンドンのプロクラブとしては、**2番目に古い**とされています。
      - いちばん古いのは、クリスタル・パレス。1861年です。
      - 愛称は「コテジャーズ」。**小屋に住む人**、という意味です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: titles
    heading: ヨーロッパを獲った日
    main: true
    tier: 背景
    telop: 決めたのは稲本潤一。決勝でハットトリック
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["インタートトカップ", "1回（2002年）"]
        - ["決勝のハットトリック", "稲本潤一（2002年8月27日）"]
        - ["FAカップ", "準優勝（1974-75）"]
        - ["ヨーロッパリーグ", "準優勝（2009-10）"]
    say:
      - "**稲本潤一**です。2002年8月27日、ロフタス・ロードでの第2レグでした。"
      - 12分、47分、50分。**ハットトリック**です。3対1、2試合合計5対3。
      - BBCは「稲本のハットトリックが、フラム初のヨーロッパのタイトルを決めた」と書いています。
      - 大会の名前はインタートトカップ。この優勝で、クラブはUEFAカップの出場権も取りました。
      - 稲本は2シーズンで58試合9得点を残しています。
      - 大きな決勝に立ったのは2度。1975年のFAカップと、2010年のヨーロッパリーグです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースがまだ決まらない。4人が2点ずつ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "アルバロ・アルベロア"]
        - ["主将", "トム・ケアニー（MF・スコットランド）"]
        - ["腕章", "2017年以降ずっと"]
        - ["エース", "今季は4人が2点ずつで並ぶ"]
        - ["昨季の上位2人", "どちらも退団"]
    say:
      - エースは、今季まだ決まっていません。**4人が2点ずつで並んでいます。**
      - 昨季の得点上位2人は、どちらもクラブを離れました。
      - 11点のハリー・ウィルソンはリーズへ、10点のラウール・ヒメネスも退団しています。
      - 主将はトム・ケアニー。スコットランド人の中盤です。
      - 2015年にこのクラブへ来て、**2017年以降ずっと腕章を巻いています。**
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 1.8マイル先のチェルシーとウェスト・ロンドン・ダービー
    narrator: 解説
    card:
      type: table
      title: ウェスト・ロンドン・ダービー
      columns: ["", ""]
      rows:
        - ["相手", "チェルシー"]
        - ["距離", "クレイヴン・コテージから1.8マイル"]
        - ["始まり", "1905年3月10日、チェルシー創設"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - サポーターが最大のライバルに挙げるのは、**チェルシー**です。
      - 呼び名は**ウェスト・ロンドン・ダービー**。
      - 相手の本拠地スタンフォード・ブリッジは、**フラム地区の中にあります。**
      - クレイヴン・コテージからは**1.8マイル**しか離れていません。
      - そして、その近さこそが因縁の始まりでした。
      - ガス・ミアーズはその競技場をフラムの本拠にしてもらおうとしましたが、賃料で折り合わず断られます。
      - そこで**1905年3月10日**、パブ「ライジング・サン」で自らチェルシーを作りました。
      - 2番手のライバルはQPR、3番手がブレントフォードです。
      - そのチェルシーは、**今季もプレミアリーグにいます。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 657試合のヘインズ、178得点のデイヴィス、コーエン
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ジョニー・ヘインズ", "657試合157得点（クラブ最多出場）"]
        - ["ゴードン・デイヴィス", "公式戦178得点（クラブ最多得点）"]
        - ["ジョージ・コーエン", "459試合。1966年W杯優勝"]
    say:
      - まず**ジョニー・ヘインズ**。1952年から1970年まで、657試合157得点です。
      - 「フラム史上最高の選手」と、広く見なされています。
      - 1961年、週給20ポンドの上限が撤廃されると、**週給100ポンドを受け取った最初の選手**になりました。
      - 次に**ゴードン・デイヴィス**。1978年から2期にわたって在籍し、公式戦178得点。
      - クラブ最多得点で、この数字はいまも破られていません。
      - 3人目は**ジョージ・コーエン**。1956年から1969年までの459試合。
      - "**1966年、ワールドカップ優勝メンバー**です。決勝では副主将を務めました。"
      - 在籍中にW杯優勝メダルを得た、唯一のこのクラブの選手です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Johnny_Haynes
      - https://en.wikipedia.org/wiki/George_Cohen
  - id: yoyo
    heading: 5年続けて、いる場所が変わった
    tier: 背景
    telop: 2017年から22年、毎年のように上がって落ちた
    narrator: 解説
    card:
      type: table
      title: 行ったり来たりの5年
      columns: ["", ""]
      rows:
        - ["2017年-2022年", "5シーズン続けて所属リーグが変わった"]
        - ["昇格", "3回"]
        - ["降格", "2回"]
    say:
      - 2017年から2022年にかけて、**5シーズン続けて所属するリーグが変わっています。**
      - 上がっては落ち、落ちてはまた上がる。落ち着かない時期でした。
      - 3回上がって、そのあいだに2回落ちた計算になります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: ground
    heading: 本拠地
    tier: 背景
    telop: 1938年、いまの収容の1.7倍が入った
    narrator: キャスター
    card:
      type: table
      title: クレイヴン・コテージ
      columns: ["", ""]
      rows:
        - ["使いはじめ", "1896年"]
        - ["収容人数", "28,107人"]
        - ["最多入場", "49,335人（1938年10月8日）"]
    say:
      - 本拠地には、**いまの収容の1.7倍**が入ったことがあります。
      - 1938年10月8日のミルウォール戦、**4万9335人**でした。
      - 場所はクレイヴン・コテージ。テムズ川のほとりにあります。
      - ここで戦い始めたのは**1896年**。130年前です。
      - いまの収容人数は2万8107人。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
