sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 日曜学校のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年9月"]
        - ["最初の名前", "Fulham St Andrew's Church Sunday School F.C."]
        - ["いまの名前", "1888年12月"]
        - ["愛称", "The Cottagers（コテジャーズ）"]
    say:
      - 創設は1879年9月。**教会の日曜学校のチーム**として始まりました。
      - 名前もそのままで、長い正式名称がついていました。
      - 短くなったのは1888年12月です。
      - ロンドンのプロクラブとしては、**2番目に古い**とされています。
      - いちばん古いのは、⑧で扱ったクリスタル・パレス。1861年です。
      - 愛称は「コテジャーズ」。**小屋に住む人**、という意味です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: yoyo
    heading: 5年続けて、いる場所が変わった
    main: true
    tier: 背景
    telop: 2017年から22年、毎年のように上がって落ちた
    narrator: 解説
    card:
      type: table
      title: 行ったり来たりの5年
      columns: ["", ""]
      rows:
        - ["2018年", "プレーオフ決勝を制して昇格"]
        - ["2020年", "ふたたびプレーオフ決勝で昇格"]
        - ["2021-22年", "チャンピオンシップ優勝で昇格"]
    say:
      - 2017年から2022年にかけて、**5シーズン続けて所属するリーグが変わっています。**
      - 上がっては落ち、落ちてはまた上がる。落ち着かない時期でした。
      - 2018年はプレーオフ決勝を勝って昇格。
      - 2020年も同じく、プレーオフ決勝からの昇格でした。
      - 2021年から22年は、チャンピオンシップを優勝しての昇格です。
      - 3回上がって、そのあいだに2回落ちた計算になります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: ground
    heading: 本拠地
    tier: 背景
    telop: 1938年、いまの収容の1.7倍が入った
    narrator: キャスター
    card:
      type: table
      title: クレイヴン・コテージ
      columns: ["", ""]
      rows:
        - ["使いはじめ", "1896年"]
        - ["収容人数", "28,107人"]
        - ["最多入場", "49,335人（1938年10月8日）"]
    say:
      - 本拠地には、**いまの収容の1.7倍**が入ったことがあります。
      - 1938年10月8日のミルウォール戦、**4万9335人**でした。
      - 場所はクレイヴン・コテージ。テムズ川のほとりにあります。
      - ここで戦い始めたのは**1896年**。130年前です。
      - いまの収容人数は2万8107人。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: europe
    heading: 2010年の決勝
    tier: 背景
    telop: ヨーロッパリーグの最初の決勝に立った
    narrator: 解説
    say:
      - ヨーロッパリーグという大会が始まった、その**最初の決勝**に立ったクラブです。
      - 2010年。世界に名前が知られたのは、このときでした。
      - 勝ち上がり方が、誰も予想しないものでした。
      - 決勝の相手はアトレティコ・マドリード。場所はハンブルクです。
      - 結果は1対2。**タイトルには、あと一歩届きませんでした。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースがまだ決まらない。4人が2点ずつ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "アルバロ・アルベロア"]
        - ["主将", "トム・ケアニー（MF・スコットランド）"]
        - ["腕章", "2017年以降ずっと"]
        - ["エース", "今季は4人が2点ずつで並ぶ"]
        - ["昨季の上位2人", "どちらも退団"]
    say:
      - エースは、今季まだ決まっていません。**4人が2点ずつで並んでいます。**
      - 昨季の得点上位2人は、どちらもクラブを離れました。
      - 11点のハリー・ウィルソンはリーズへ、10点のラウール・ヒメネスも退団しています。
      - 主将はトム・ケアニー。スコットランド人の中盤です。
      - 2015年にこのクラブへ来て、**2017年以降ずっと腕章を巻いています。**
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: ヨーロッパのタイトルを決めたのは、稲本潤一
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["インタートトカップ", "1回（2002年）"]
        - ["決勝のハットトリック", "稲本潤一（2002年8月27日）"]
        - ["FAカップ", "準優勝（1974-75）"]
        - ["ヨーロッパリーグ", "準優勝（2009-10）"]
    say:
      - "このクラブがヨーロッパで獲ったタイトルを決めたのは、**日本人**でした。"
      - "**稲本潤一**です。2002年のインタートトカップ、ロフタス・ロードでの第2レグ。"
      - 12分、47分、50分。**ハットトリック**でした。3対1、2試合合計5対3。
      - BBCは「稲本のハットトリックが、フラム初のヨーロッパのタイトルを決めた」と書いています。
      - 稲本は2シーズンで58試合9得点。この優勝で、クラブはUEFAカップの出場権も取りました。
      - 大きな決勝に立ったのは2度。1975年のFAカップと、2010年のヨーロッパリーグです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
