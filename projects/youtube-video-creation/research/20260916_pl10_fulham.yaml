sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 日曜学校のチームとして始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1879年9月"]
        - ["最初の名前", "Fulham St Andrew's Church Sunday School F.C."]
        - ["いまの名前", "1888年12月"]
        - ["愛称", "The Cottagers（コテジャーズ）"]
    say:
      - アルファベット順では、10番目に来ます。
      - 創設は1879年9月。**教会の日曜学校のチーム**として始まりました。
      - 名前もそのままで、長い正式名称がついていました。
      - 短くなったのは1888年12月です。
      - ロンドンのプロクラブとしては、**2番目に古い**とされています。
      - いちばん古いのは、⑧で扱ったクリスタル・パレス。1861年です。
      - 愛称は「コテジャーズ」。**小屋に住む人**、という意味です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: yoyo
    heading: 5年続けて、いる場所が変わった
    main: true
    tier: 背景
    telop: 2017年から22年、毎年のように上がって落ちた
    narrator: 解説
    card:
      type: table
      title: 行ったり来たりの5年
      columns: ["", ""]
      rows:
        - ["2018年", "プレーオフ決勝を制して昇格"]
        - ["2020年", "ふたたびプレーオフ決勝で昇格"]
        - ["2021-22年", "チャンピオンシップ優勝で昇格"]
    say:
      - このクラブには、落ち着かない時期がありました。
      - 2017年から2022年にかけて、**5シーズン続けて所属するリーグが変わっています。**
      - 上がっては落ち、落ちてはまた上がる。
      - 2018年はプレーオフ決勝を勝って昇格。
      - 2020年も同じく、プレーオフ決勝からの昇格でした。
      - 2021年から22年は、チャンピオンシップを優勝しての昇格です。
      - 3回上がって、そのあいだに2回落ちた計算になります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: ground
    heading: 本拠地
    tier: 背景
    telop: 1896年から同じ場所。収容28,107人
    narrator: キャスター
    card:
      type: table
      title: クレイヴン・コテージ
      columns: ["", ""]
      rows:
        - ["使いはじめ", "1896年"]
        - ["収容人数", "28,107人"]
        - ["最多入場", "49,335人（1938年10月8日）"]
    say:
      - 本拠地はクレイヴン・コテージ。テムズ川のほとりにあります。
      - ここで戦い始めたのは**1896年**。130年前です。
      - いまの収容人数は2万8107人。
      - いちばん人が入ったのは1938年10月8日、ミルウォール戦でした。
      - その日の入場者は**4万9335人**。いまの収容の1.7倍です。
      - 監督はアルバロ・アルベロア。今季の登録に日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: europe
    heading: 2010年の決勝
    tier: 背景
    telop: ヨーロッパリーグの最初の決勝に立った
    narrator: 解説
    say:
      - このクラブが世界に知られたのは、2010年です。
      - ヨーロッパリーグという大会が始まった、その**最初の決勝**に立ちました。
      - 勝ち上がり方が、誰も予想しないものでした。
      - 決勝の相手はアトレティコ・マドリード。場所はハンブルクです。
      - 結果は1対2。**タイトルには、あと一歩届きませんでした。**
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Fulham_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝0回、FAカップ0回（準優勝 1974-75）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "0回"]
        - ["FAカップ", "0回（準優勝 1974-75）"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "0回（EL準優勝 2009-10）"]
        - ["インタートトカップ", "1回（2002年）"]
    say:
      - 数えると、大きなタイトルは**ゼロ**です。
      - "決勝には2度立って、**2度とも負けています。**"
      - 1975年のFAカップ決勝と、2010年のヨーロッパリーグ決勝です。
      - ただし、ヨーロッパのタイトルが1つだけあります。2002年のインタートトカップです。
      - そして、その決勝で決めたのが日本人でした。
      - "**稲本潤一**です。2002年8月27日、ロフタス・ロードでの第2レグ。"
      - 12分、47分、50分。**ハットトリック**でした。3対1、2試合合計5対3。
      - BBCは「稲本のハットトリックが、フラム初のヨーロッパのタイトルを決めた」と書いています。
      - 稲本は2シーズンで58試合9得点。この優勝で、クラブはUEFAカップの出場権も取りました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
