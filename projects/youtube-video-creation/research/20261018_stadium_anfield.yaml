# スタジアム紹介シリーズ⑧：リヴァプールの本拠地（アンフィールド、10/18）。雛形は 10/17 オールド・トラッフォード回（research/20261017_stadium_oldtrafford.yaml）。
# 節の並び：オープニング → 基礎DATA(main・強い一点を頭に＝A) → エヴァートンの本拠地から（年表）→ コップの名（年表）→ イス席になるまで（年表）→ 収容の歩み（折れ線＋記録との差）→ 見立て（自分で数えた比べ）
# 軸：**A＝収容6万1276席はプレミア20クラブで3位（上の2つはマンチェスター・ユナイテッド 74,158 とトッテナム 62,850）と、B＝歴史（1884年の開場・エヴァートンの本拠地・コップ・立ち見からイス席へ・拡張）の両方。冒頭はA。**
#
# 強い一点：**収容 61,276人（今季のプレミア公式ハンドブック2026/27）はプレミア20クラブで3番目。1位マンU 74,158（差 12,882）、2位トッテナム 62,850（差 1,574）、4位シティ 61,038（下との差 238）。**
#   確度は**報道**（ハンドブックの数字から自分で並べ替え・引き算。クラブ公式 liverpoolfc.com の記事「New Anfield capacity confirmed ahead of 2024-25」も 61,276 と最多入場 61,905（1952）を書く＝確定の数字）。
#
# **自分で数えた・割った（20クラブの収容を、PL公式ハンドブック2026/27のPDF（2026-07-31版）の6〜25ページ「Ground Capacity at start of the Season」から全部抽出して検算した。取得 2026-10-18）**
#   上から：ユナイテッド 74,158／トッテナム 62,850／リヴァプール 61,276／マンチェスター・シティ 61,038／アーセナル 60,704／エヴァートン 52,769／ニューカッスル 52,729／サンダーランド 48,095／チェルシー 40,044／リーズ 37,633／
#   アストン・ヴィラ 36,887／コヴェントリー 32,609／ブライトン 32,176／フォレスト 31,212／イプスウィッチ 30,294／フラム 28,107／パレス 25,194／ハル 24,983／ブレントフォード 17,250／ボーンマス 12,357。合計 822,365（20ページ分。10/17 オールド・トラッフォード回と一致）。
#   74,158 − 61,276 = 12,882（1位との差）／62,850 − 61,276 = 1,574（2位との差）／61,276 − 61,038 = 238（4位との差）／61,276 − 60,704 = 572（3位と5位の差＝3〜5位の幅）／
#   1,574 ÷ 238 = 6.613 →「6.6倍」（2位と3位の差は、3位と4位の差の6.6倍）／822,365 ÷ 20 = 41,118.25、61,276 ÷ 41,118.25 = 1.490 →「1.5倍」／
#   61,905 − 61,276 = 629（立ち見の時代の最多入場は、今の収容より629人多い）／61,276 ÷ 32,176 = 1.9044 →「1.9倍」（次の本拠地戦 10/25 ブライトン）／61,276 ÷ 74,158 = 0.826。
#   2025-26 ホーム19試合の入場（PL公式の試合データ。sdp-prem-prod API の2025シーズン全38節から Liverpool がホームの19試合）：合計 1,147,390 ÷ 19 = 60,388.95 →「6万389人」／
#   60,388.95 ÷ 61,276 = 0.98552 →「98.6％」／最多 60,466（2025-12-27 ウルヴス）・最少 60,314（2026-04-25 パレス）→ 差 152／61,276 − 60,389 = 887（平均と収容の差）／19試合すべて 61,276 未満（最多でも 810 下）。
#   Wikipedia の「リーグ戦の最多は 60,466（2025-12-27 ウルヴス）」とPL公式データが一致。
#
# **重なりで外したもの**
#   クラブ紹介⑭リヴァプール（2026-09-20 公開）は「アンフィールドの土地を持つホールディング／エヴァートンが去った／スタジアムだけが残った／創立1892年／本拠地は約6万1000人・2024年に広げたばかり／試合前の YNWA は1960年代の初めから」を読んでいる。
#   この回は同じ筋（エヴァートン→1892）を通るが、**1884年の開場・1890-91年の優勝・1892年3月→6月3日→9月1日の日付・1907年の買い取り**は新しい中身。YNWA は「1963年」の1行と「シャンクリー・ゲイツ」の1行だけ。
#   ユニフォーム⑦（10/09）は炎のエンブレムとして**ヒルズボロの事実だけ2行**を読んでいる。財政（10/12）・移籍（10/14）の金額は**この回は言わない**（工事費・施工会社の破綻は事実の1行のみ、金額なし）。
#
# **ヒルズボロの扱い（CLAUDE.md「リヴァプールのヒルズボロには表を足さない」）**
#   **亡くなった人の数（97人）は一度も言わない。年表の行にも入れない（表に組まない）。強調（emph・callword）も付けない。**
#   台本は「事故が起きた」「リヴァプールのサポーターが亡くなった」「判事テイラー卿が調べた」「テイラー報告書が全席イス席を求めた」までの事実だけ。原因・責任の論評はしない。
#   読んだ原文：Hansard 1990-01-29（内務大臣の声明。「テイラー卿は中間報告で過密を取り上げた。ヒルズボロの原因だったから」「全席イス席へ向かう（all-seater）。Football Spectators Act 1989 s.11」）。
#   Commons Library・Wikipedia の「1994年までに」は台本に年を書かず、**アンフィールドのコップの最後の立ち見の試合 1994-04-30（クラブ公式）**を事実として言う。
#
# **確度の根拠・読めたものと読めなかったもの（取得 2026-10-18、requests のブラウザUA。ブラウザ操作・JS実行は使っていない）**
#   クラブ公式（liverpoolfc.com）で**原文が読めた**：
#     ・New Anfield capacity confirmed ahead of 2024-25（収容 61,276・最多入場 61,905＝1952年ウルヴス戦FAカップ・リーグ戦の最多 60,090 当時）
#     ・120 years ago today: The story of Anfield's famous Spion Kop begins（1906年の改築＝リーチ。コップ 132段・最大2万人。1906-09-01 ストーク戦 1-0・ジョー・ヒューイットが初ゴール。**名づけた人は不明とクラブが書く**＝「記者エドワーズ説は証拠が無い、サポーターが先に呼んだ説のほうが確からしい」。1928年に屋根・改築は別の建築家）
#     ・125 years on: The story of the Spion Kop（1928年に屋根・1977年に最大3万人が立ったと報じられた・1989年4月のヒルズボロとテイラー報告書→**最後の立ち見は 1994-04-30**・新コップは 12,850席・歌 YNWA は Gerry and the Pacemakers）
#     ・Liverpool FC celebrates its 134th birthday／133rd birthday（1892年3月に対立→6月3日に Board of Trade が認める→最初の試合は 9月1日 ロザラム・タウンに 7-1 の親善試合。命名は William E. Barclay）
#     ・legacy.liverpoolfc.com の「Video: How to access Anfield's new Main Stand」（2016-09-08。「54,000超」＝2016年のメインスタンド開場で収容が増えた）
#   **クラブ公式で読めなかった（404）**：Anfield Road Stand の歴史・Kenny Dalglish Stand の歴史・2016-17決算（54,074）・stadium-expansion の中身 → Wikipedia と StadiumDB で補い、**「とされます」の背景**にとどめた。
#     ケニー・ダルグリッシュ・スタンドの改名（2017-05-03 発表）は Wikipedia のみ。シャンクリー・ゲイツ（1982）と門の上の曲名も Wikipedia のみ。
#   StadiumDB（robots 許可）：開場の初戦（Everton 5-0 Earlestown）は StadiumDB が 1884-09-27、Wikipedia が 28日で**食い違う→日は言わず「9月」**。1907年のクラブによる土地の買い取り・1890-91の優勝・1963年 YNWA・2000年ごろ約4万5000人・
#     2002年以降の新スタジアム案が資金不足で実現せず・FSG が残す道を選んだ理由（コップの雰囲気）・2021-09〜2024 のアンフィールド・ロード拡張は StadiumDB。
#   **古い数字の食い違い**：新コップの席数は クラブ公式 12,850・Wikipedia 12,390。**クラブ公式の 12,850** を使う（日付違いの可能性。台本は「1万2850席」）。
#     メインスタンドの収容増は クラブ公式「54,000超」＋Wikipedia「+8,500席、54,074（2016-17決算のクラブ発表、Wikipedia の引用）」。**折れ線は「54,000超」（クラブ公式の原文）**。
#     2000年ごろ「約4万5000人」は StadiumDB（"around 45,000"）のみ。Wikipedia/他の 45,276 は原文を読めていないので**使わない**。折れ線では「約」。
#     メインスタンド開場日は クラブ公式 9/9・10 で割れる → **「2016年9月」**。
#   新スタジアム案（2002 スタンレー・パーク）は StadiumDB（資金不足）と Wikipedia（2004 許可・2006〜07 再設計）。**「2002年に案を出した」「実現しなかった」までを言う**。
#   工事費・施工会社の破綻：事実の1行（「施工会社が経営破綻して完成が遅れた」）。金額は言わない（確認できる一次が無い）。
#   **言わないと決めたもの**：コンサート・ラグビー・女子（女子サッカーは扱わない 2026-09-16）・ピッチが UEFA 基準より4メートル短い話・ヘイゼルの悲劇・Everton の新スタジアム・Taylor Swift の 6万2000人・アンフィールド・ロードの歩行者空間化。
#   ピッチ 縦101×横68メートルは PL公式ハンドブック2026/27 の Liverpool ページ（原文 "Length: 101 metres Width: 68 metres"）。
#   **次の本拠地戦**：PL公式データで 2026-10-25 ブライトン（PreMatch）。クラブ公式サイトでも 10/20 ビジャレアル（CL）の次に 10/25 ブライトン。台本は「次のプレミアの本拠地戦は10月25日」。
#
# 写真：assets/images/20261018_stadium_anfield/（credits.json 同梱。すべて Commons：01 内側の全景2024年5月＝CC0／02 試合日の全景（新メインスタンド）CC BY-SA 2.0／03 コップ側 CC BY-SA 2.0／04 アンフィールド・ロード側2024年5月 CC0／05 夜の試合2008年 CC BY-SA 2.0）。
#   人の顔が主役の写真は無い（観客は小さい）。透かしなし・代理店なし。10/17 の写真と重ならない。
# サムネは案を3つ出してユーザーに決めてもらう（2026-10-11）。ここに書いた thumbnail は**案1（暫定）**。
