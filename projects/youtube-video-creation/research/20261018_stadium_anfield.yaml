  takeaway: リヴァプールの本拠地、アンフィールドの収容は、今季の開幕時で6万1276人。プレミア20クラブで3番目に大きく、1位マンチェスター・ユナイテッド（7万4158人）とは1万2882席、2位トッテナム（6万2850人）とは1574席の差。4位マンチェスター・シティ（6万1038人）との差は238席で、2位と3位の差は、3位と4位の差の6.6倍にあたる。1884年にエヴァートンの本拠地として開き、1892年に対立でエヴァートンが去ったあと、空いた競技場でリヴァプールが生まれた。ゴールの裏の立ち見席コップは、1906年の改築でできた。1989年のヒルズボロの事故のあと、テイラー報告書が全席イス席を求め、立ち見のコップは1994年4月30日の試合が最後になった。収容は2000年ごろの約4万5000人から、2016年に5万4000人超、2024年に6万1276人へ広がり、1952年の最多入場（6万1905人）まで629席に迫った。昨季のリーグ戦ホーム19試合の平均入場は6万389人で、収容の98.6％。次のプレミアの本拠地戦は10月25日のブライトン戦で、その本拠地の収容は3万2176人。アンフィールドは1.9倍になる
  short_title: アンフィールド、プレミア3位の6万1276席
