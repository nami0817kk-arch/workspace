  - text: いまのコップの席数の約1.6倍。急な傾きが、丘に似ていました。
    card: none
  - text: 誰が名づけたのかは、はっきりしません。クラブも、確かな証拠は無いと書きます。
    card: none
  - text: 改築後の最初の試合は、1906年9月1日。ストーク・シティに1対0で勝ち。
    card:
      <<: *id_kop
      highlight_row: 1
  - text: この立ち見席の前で最初にゴールを決めたのは、ジョー・ヒューイットです。
    card: none
  - text: 1928年、屋根がつきます。声が響くのは、その屋根のおかげとも言われます。
    card:
      <<: *id_kop
      highlight_row: 2
  - text: 1963年、地元のバンドが歌った曲が、サポーターの歌になります。
    card:
      <<: *id_kop
      highlight_row: 3
  - text: 曲名は、「ユール・ネヴァー・ウォーク・アローン」です。
    card: none
  - text: 1977年のヨーロッパ・カップでは、最大3万人が立ったという報道があります。
    card:
      <<: *id_kop
      highlight_row: 4
  - text: 1982年、ビル・シャンクリー監督をたたえる門が、建ちました。
    card:
      <<: *id_kop
      highlight_row: 5
  - text: 門の上には、あの曲名が書かれています。
    card: none
  sources:
