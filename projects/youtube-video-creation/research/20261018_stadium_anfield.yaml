- id: seats
  heading: なぜ、立ち見のコップは、イス席に変わったのか
  bg: assets/images/20261018_stadium_anfield/01_w.jpg
  tier: 報道
  telop: テイラー報告書のあと、立ち見のコップは1994年4月30日の試合が最後に
  narrator: 解説
  card: &id_seats
    type: timeline
    title: 立ち見から、イス席へ
    rows: &rows_seats
    - - 1990年1月
      - テイラー報告書。全席イス席の方向へ
    - - 1992年9月1日
      - 2層になった新スタンドが開く
    - - 1994年4月30日
      - 立ち見のコップ、最後の試合
    - - 1998年
      - アンフィールド・ロード側に2層目
    - - 2017年
      - ケニー・ダルグリッシュ・スタンドに改名
    focus: 1994年4月30日
  say:
  - text: 1989年4月、ヒルズボロの競技場で、事故が起きました。
    image: assets/images/20261018_stadium_anfield/03_w.jpg
    card: none
  - text: リヴァプールのサポーターが、亡くなりました。
    card: none
  - text: 判事のテイラー卿が、原因を調べます。
    card: none
  - text: 1990年1月、テイラー卿の最終報告書が出ます。立ち見をなくす方向が示されました。
    card:
      <<: *id_seats
      highlight_row: 0
  - text: 1部と2部の競技場は、全席イス席にする。政府は、そう進めると表明しました。
    card:
      <<: *id_seats
      highlight_row: 0
  - text: アンフィールドでは1992年9月1日、ピッチ横のスタンドが2層になります。
    card:
      <<: *id_seats
      highlight_row: 1
  - text: 名前は、センテナリー・スタンド。リヴァプール最初の試合の、ちょうど100年後。
    card: none
  - text: 最後まで立ち見だったのが、コップです。
    card: none
  - text: 1994年4月30日。立ち見のコップでの、最後の試合が開かれます。
    card:
      <<: *id_seats
      highlight_row: 2
  - text: 相手はノーウィッチ。試合のあと、コップは壊されました。
    card:
      <<: *id_seats
      highlight_row: 2
  - text: 新しいコップは、イス席の1層。1万2850人が座れます。
    card:
      <<: *id_seats
      highlight_row: 2
  - text: 1998年には、もう一方のゴール裏、アンフィールド・ロード側に2層目。
    card:
      <<: *id_seats
      highlight_row: 3
  - text: 2017年、センテナリー・スタンドは、ケニー・ダルグリッシュの名に変わりました。
    card:
      <<: *id_seats
      highlight_row: 4
  sources:
  - https://api.parliament.uk/historic-hansard/commons/1990/jan/29/hillsborough-stadium-disaster-taylor
  - https://www.liverpoolfc.com/news/125-years-story-spion-kop
  - https://stadiumdb.com/stadiums/eng/anfield_road
  - https://en.wikipedia.org/wiki/Anfield
- id: growth
  heading: なぜ、約4万5000人の競技場は、6万1276人まで広がったのか
  bg: assets/images/20261018_stadium_anfield/01_w.jpg
  tier: 報道
  telop: 収容は2000年ごろの約4万5000人から、2016年に5万4000人超、2024年に6万1276人
  narrator: 解説
  card: &id_cap
    type: line
    title: 収容の歩み（約を含む）
    x: ['2000ごろ', '2016', '今季']
    series:
    - - 収容
      - [45000, 54000, 61276]
    unit: 人
    focus: 収容
    peak: true
  say:
  - text: 2000年ごろの収容は、約4万5000人。いまより約1万6000人少ない。
    image: assets/images/20261018_stadium_anfield/02_w.jpg
    card:
      <<: *id_cap
      highlight: '2000ごろ'
  - text: 2002年、クラブは、近くの公園に、新しいスタジアムを建てる案を出します。
    card: none
  - text: 建てる許可は出ましたが、資金が足りず、実現しませんでした。
    card: none
  - text: 2010年に、持ち主が代わります。新しい持ち主は、いまの場所に残す道を選びました。
    card: none
  - text: 理由の1つは、コップの雰囲気を、新しい競技場では作りにくいことでした。
    card: none
  - text: 最初は、メインスタンドです。2014年の終わりに、工事が始まります。
    card: none
  - text: 2016年9月、新メインスタンドが開き、収容は5万4000人を超えます。
    emph: true
    card:
      <<: *id_cap
      highlight: '2016'
  - text: 次は、アンフィールド・ロード側。2021年9月に着工しました。
    card: none
  - text: 途中で、施工会社が経営破綻し、完成は遅れました。
    card: none
  - text: 2024年、7000席ほどが増え、いまの形になりました。
    emph: true
    card:
      <<: *id_cap
      highlight: '今季'
  - text: 1952年の最多入場は、立ち見の時代の、6万1905人です。
    card: &id_rec
      type: stats
      title: 1952年の最多入場と、いまの収容
      items:
      - - '61905'
        - 人
        - 最多の入場（1952年）
      - - '61276'
        - 人
        - いまの収容
      - - '629'
        - 人
        - 最多のほうが多い人数（自分で引いた）
      focus: 0
  - text: いまの収容は、それより、629席少ないだけです。
    emph: true
    card:
      <<: *id_rec
      focus: 2
  - text: 全席イス席のまま、立ち見の時代の記録に迫りました。
    card: none
  sources:
  - https://www.liverpoolfc.com/news/new-anfield-capacity-confirmed-ahead-2024-25
  - https://legacy.liverpoolfc.com/news/stadium/234709-video-how-to-access-anfield-s-new-main-stand
  - https://stadiumdb.com/stadiums/eng/anfield_road
- id: view
  viewpoint: true
  heading: 見立て・3位の本拠地は、2位と4位のどちらに近いのか
  bg: assets/images/20261018_stadium_anfield/01_w.jpg
  tier: 報道
  telop: 2位との差は、4位との差の6.6倍。昨季の平均入場は収容の98.6％
  narrator: 解説
  card: &id_rank
    type: table
    title: 今季の収容、上位5クラブ（自分で並べた）
    columns: &cols_rank
    - 順位
    - クラブ
    - 収容
    rows: &rows_rank
    - - 1位
      - マンチェスター・U
      - 7万4158人
    - - 2位
      - トッテナム
      - 6万2850人
    - - 3位
      - リヴァプール
      - 6万1276人
    - - 4位
      - マンチェスター・C
      - 6万1038人
    - - 5位
      - アーセナル
      - 6万704人
  say:
  - text: 今季の収容を順に見ます。1位はマンチェスター・U。3位が、リヴァプール。
    image: assets/images/20261018_stadium_anfield/01_w.jpg
    emph: true
    mark:
      kind: circle
      row: 2
    card:
      type: table
      title: 今季の収容、上位5クラブ（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 2
  - text: 2位との差は、1574席。4位との差は、238席。
    card: &id_gap2
      type: calc
      title: 差と差の比べ（自分で割った）
      terms:
      - - 1574席
        - 2位との差
      - - 238席
        - 4位との差
      - - 6.6倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 2位との差は、4位との差の6.6倍。
    emph: true
    card: *id_gap2
  - text: 3位から5位までは、わずか572席の幅です。
    card:
      type: table
      title: 今季の収容、上位5クラブ（自分で並べた）
      columns: *cols_rank
      rows: *rows_rank
      highlight_row: 3
  - text: 実際の入場はどうか。昨季、ホーム19試合の平均は6万389人。
    card: &id_fill
      type: calc
      title: 昨季の平均入場と収容（自分で割った）
      terms:
      - - 6万389人
        - 昨季のホーム19試合の平均入場
      - - 6万1276人
        - 今季の開幕時の収容
      - - 98.6％
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 収容に対する割合は、98.6％。
    emph: true
    card: *id_fill
  - text: 最多は6万466人、最少は6万314人。差は、152人しかありません。
    card: none
  - text: 19試合のどれも、収容の数には届きませんでした。
    card: none
  - text: 平均と収容の差は887席。理由までは、読み取れていません。
    card: none
  - text: 次のプレミアの本拠地戦は、10月25日。相手は、ブライトンです。
    emph: true
    card: none
  - text: ブライトンの本拠地の収容は、3万2176人。
    card: &id_bha
      type: calc
      title: アンフィールドとブライトンの収容（自分で割った）
      terms:
      - - 6万1276人
        - アンフィールド
      - - 3万2176人
        - ブライトン
      - - 1.9倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: アンフィールドは、その1.9倍にあたります。
    card: *id_bha
  - text: 空っぽの競技場は、プレミア3位の器になりました。
    emph: true
    card: none
