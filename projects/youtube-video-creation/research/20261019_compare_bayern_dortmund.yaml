# **基準は 2026年10月17日の第6節を終えた時点**。2クラブとも6試合・4勝2分け・勝ち点14・まだ負けていない。
#   1位バイエルン（得失点差+17）、2位ドルトムント（+7）。**3位フライブルクは5試合で勝ち点13。10/18 22:30 JST のレバークーゼン戦が残っている。
#   勝てば16で首位が入れ替わる。公開前に順位を取り直すこと**（台本は「10月17日の試合を終えた時点」と時点を言う。題の「首位争い」はそのまま）。
# **ブリーフの「ブンデス優勝 34回と8回」は混在していた**：ドルトムントの8回はドイツ選手権の合計で、ブンデスリーガ（1963-64〜）は5回。
#   Transfermarkt（55/56・56/57・62/63 の3回がブンデスリーガ以前）と英語版Wikipedia（BVB「fifth Bundesliga title and eighth German championship」）で確認。
#   台本は「ブンデスリーガ 34と5」→「選手権を含めて 35と8」の2段で言う。
# 自分で割った値：1試合あたり 22÷6=3.67／11÷6=1.83（22÷11=2.0倍）、失点 5÷6=0.83／4÷6=0.67、得点÷失点 22÷5=4.4／11÷4=2.75、
#   5点以上の3試合（5・7・6）で18点＝18÷22=82%、無失点の試合 2と4（2倍）、ブンデスリーガ優勝 34÷5=6.8倍、収容人数の差 6,341（約8%）。
# 同じ数字・言い回しを避けた相手：10/12「ドルトムントとモナコ」（2対0から2対2・76分以降の得点・点を決めた人の数・最初の得点の分・先に失点した勝ち点）は使っていない。
#   ドルトムントの 11点・4失点は今回も出るが、**今回の軸は1試合あたり・無失点の試合・ブンデスリーガ以外のタイトル・本拠地**。
# 写真：すべて Wikimedia Commons（CC BY / CC BY-SA）。assets/images/20261019_compare_bayern_dortmund/credits.json に撮影者とライセンスを控えた。全部目で見て確認済み（人物のアップは無い）。
#   01=アリアンツ外観(Delso)／02=アリアンツ空撮(Tobias Alt)／03=アリアンツ内側 2012の試合(TomHarmsen)／04=ドルトムント南スタンド(Neundorf)／
#   05・06=ジグナル・イドゥナ・パルク空撮(Arne Müseler)／07=2021-22 バイエルン対ドルトムントのアリアンツ内側(UNTERMVIERENBERGE-2)／08=アリアンツ内側 試合前(Povysil.martin)。
#   bay_sq.jpg・bvb_sq.jpg は手元のエンブレムを明るい地に置いた対面カード用の正方形（権利は晴れていない＝引き受ける危険）。
