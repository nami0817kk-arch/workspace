      - text: バイエルンが34回。ドルトムントが5回です。
        card: {<<: *shelfcard, highlight_row: ブンデスリーガ}
      - text: 34を5で割ると、6.8倍。
        emph: true
        card: &titlecalc
          type: calc
          title: ブンデスリーガ優勝（バイエルンはドルトムントの）
          terms:
            - ['34回', バイエルン]
            - ['5回', ドルトムント]
            - ['6.8倍', 比]
          ops: ['÷', ＝]
      - text: ブンデスリーガの開幕は、1963年。それより前は、決勝で決める全国大会でした。
        image: assets/images/20261019_compare_bayern_dortmund/04_w.jpg
        card: {<<: *shelfcard, highlight_row: ドイツ王者の合計}
      - text: その大会も含めると、ドイツ王者は35回と8回。
        card: {<<: *shelfcard, highlight_row: ドイツ王者の合計}
      - text: バイエルンの1回は1932年。ドルトムントは、1956年、57年、63年です。
        card: {<<: *shelfcard, highlight_row: ドイツ王者の合計}
      - text: ドイツカップは、21回と5回。
        card: {<<: *shelfcard, highlight_row: ドイツカップ}
      - text: 欧州の頂点は、チャンピオンズリーグと、その前身の大会を合わせて数えます。
        image: assets/images/20261019_compare_bayern_dortmund/02_w.jpg
        card: {<<: *shelfcard, highlight_row: 欧州の頂点}
      - text: バイエルンは6回。ドルトムントは、1997年の1回です。
        card: {<<: *shelfcard, highlight_row: 欧州の頂点}
      - text: 2013年の決勝は、この2クラブの対戦でした。勝ったのは、バイエルンです。
        emph: true
        card: {<<: *shelfcard, highlight_row: 欧州の頂点}
      - text: カップウィナーズ杯は、かつてあった欧州の大会。1回ずつで並びます。
        card: {<<: *shelfcard, highlight_row: カップウィナーズ杯}
