      - *r4
      - *r5
      source: FotMob
  - text: ラージョ戦は2点1アシスト。10点満点の評点で、9.5をたたき出しました。
    emph: true
    card:
      <<: *recent_card
      highlight_row: 3
  - text: ところが9月25日、代表のトルコ戦。右足で決勝点を挙げた、その着地で左ひざを痛めます。
    image: assets/images/20261004_mbappe_face_w/01.jpg
    card:
      <<: *recent_card
      highlight_row: 0
  - text: 5分後に交代。代表を離れ、そこからの2試合を欠場しました。
    card: none
  - text: クラブの診断は、左ひざの裏側を伸ばしすぎたけが。復帰の時期は出していません。
    card: none
  - text: 手術は避けられた、という報道です。ただ同じ左ひざは、12月と3月にも痛めています。
    card: none
  - text: 次は現地10日、本拠地ベルナベウでのビジャレアル戦です。
    card: none
