- id: story
  heading: マル秘話
  tier: 報道
  telop: 8歳からの模型と、全額寄付した報酬
  narrator: 解説
  card:
    type: points
    title: エムバペの原点
    items:
    - 8歳のとき家族がくれたベルナベウの模型を、お披露目の会見に持ってきた
    - 2018年W杯の報酬（約5,700万円）を全額寄付。代表の報酬は以来受け取っていない
    - 母の手作りチェックシートで、授業を受けたか先生のサインをもらっていた
  say:
  - text: ここで数字を止めて、原点を2つ。
    image: assets/images/20261004_mbappe_spain_w/01.jpg
  - 1つ目は、レアルのお披露目会見に持ってきた、ベルナベウの模型。8歳のとき家族がくれたものです。
  - 持ち帰ると約束して、18年後に果たしました。いまのレアルについては、こう。
  - voice: エムバペ
    text: ここで幸せを感じなかった瞬間は一度もないよ
    pause: 0.6
  - 2つ目はお金の使い方。2018年のワールドカップの報酬、約5,700万円を全額寄付しました。
  - 代表の報酬は、それ以来ずっと受け取っていません。
  - 少年時代には、授業をちゃんと受けたか先生のサインをもらう、母の手作りのチェックシートがありました。
  - text: 育ったボンディの町には、彼を描いた壁画があります。「何でも可能な町」と添えて。
    pause: 0.5
