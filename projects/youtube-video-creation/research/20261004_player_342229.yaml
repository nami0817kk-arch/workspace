- id: hook
  heading: どんな選手か
  tier: 報道
  telop: ワールドカップ22点、史上いちばん決めた男
  narrator: キャスター
  say:
  - text: キリアン・エムバペ。ワールドカップで22試合22点、歴史上だれよりも多く決めた男です。
    image: assets/images/20261004_player_342229/01_w.jpg
  - text: 2026年の大会でも10点。史上初めて、2大会続けて得点王に輝きました。
    emph: true
  - 14歳のとき、レアル・マドリードに1週間招かれた少年。案内役は、当時クラブにいたジダンでした。
  - その場所でいま、背番号10を背負っています。9月、本人はきっぱりとこう語っています。
  - voice: エムバペ
    text: サッカーの歴史に名を刻みたいなら、
  - voice: エムバペ
    text: レアル・マドリーでプレーするべき
    cont: true
    pause: 0.5
  - 今季、シュートの数とドリブルは、同じ位置のフォワードの中で最上位。
  - 点を取ることに振り切ったこの形は、どう出来上がったのか。順に追っていきます。
  sources:
  - https://www.espn.com/soccer/story/_/id/49397919/kylian-mbappe-wins-golden-boot-2026-world-cup-lionel-messi-goalless-final
  - https://www.goal.com/en/lists/zinedine-zidane-kylian-mbappe-real-madrid-french-les-bleus/blt5ce4b4b305a42cf6
  - https://www.goal.com/jp/ニュース/2026-0918-real-madrid-mbppekil-inter-jp/bltd3689f32110e2d2e
