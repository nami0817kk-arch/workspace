  - text: 17歳62日の初ゴールは、あのアンリの最年少記録を塗り替える一撃でした。
    image: assets/stats/player_20261004_701154_value.png
    no_telop: true
    card:
      <<: *career_card
      highlight_row: 0
  - text: 市場価値の線も、モナコでの2年で一気に跳ね上がります。
    image: assets/stats/player_20261004_701154_value.png
    no_telop: true
    card:
      <<: *career_card
      highlight_row: 0
  - text: 2017年8月31日、最大1億8,000万ユーロでパリ・サンジェルマンへ。
    image: assets/images/20261004_mbappe_psg2019_w/01.jpg
    card:
      <<: *career_card
      highlight_row: 1
  - text: 翌年7月、ワールドカップ決勝でゴール。19歳207日、ペレ以来となる10代の得点です。
    emph: true
    card:
      <<: *career_card
      highlight_row: 1
  - text: パリで7季を戦い抜き、2024年6月、契約を満了してフリーでレアルへ。
    image: assets/images/20261004_mbappe_real2026/01.jpg
    card:
      <<: *career_card
      highlight_row: 2
  - text: 14歳で見学した場所に、26歳で帰ってきたんです。
    card:
      <<: *career_card
      highlight_row: 2
  - text: お披露目のベルナベウには、あの日の案内役ジダンも駆けつけていました。
    card:
      <<: *career_card
      highlight_row: 2
