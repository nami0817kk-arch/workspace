- id: view
  heading: ハーランドとの1点差と膝
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月11日、ビジャレアル戦
  say:
  - text: 終わりに、これからのエムバペを数字で。
    image: assets/images/20261004_mbappe_real2026/01.jpg
  - 比べる相手はハーランド。今季9試合で10点、773分。エムバペは9試合で9点、時間はほぼ同じ。
  - 1点差。2人の差は、いまは膝です。
  - バロンドール、世界最優秀選手の賞は10月26日に発表。候補に入っている本人の言葉です。
  - voice: エムバペ
    text: 昨季、僕より優れた選手はいなかった
    pause: 0.6
  - 膝の復帰は報道で10月10日前後。クラブの次の試合は10月11日、ビジャレアル戦です。
  - そこに間に合うか。そして10月25日のクラシコで、大一番の相性を変えられるかを見ます。
