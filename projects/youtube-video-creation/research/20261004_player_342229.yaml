  say:
  - text: 同じフォワードと並べたレーダーで、エムバペの形を見てみます。
    image: assets/stats/player_20261004_701154_radar.png
    no_telop: true
  - text: とがっているのは、得点とシュートの数。仕事をゴール前に絞り込んでいます。
    image: assets/stats/player_20261004_701154_radar.png
    no_telop: true
  - text: ボールを持つ場所も、相手ゴールの近く。色の濃いところが、それです。
    image: assets/stats/player_20261004_701154_heat.png
    no_telop: true
    card: none
  - text: 今季のドリブルは25回、エリアの中でのタッチは85回。どちらも同じ位置で最上位です。
    image: assets/images/20261004_mbappe_spain_w/01.jpg
  - text: シュートは41本、うち右足が32本。速攻からの10本も含めて、7点をもぎ取りました。
    image: assets/stats/player_20261004_701154_shots.png
    no_telop: true
  - text: 速さで裏へ抜けて、右足で仕留める。ワールドカップでは4アシストと、作る側にも回ります。
    image: assets/images/20261004_mbappe_sweden_wide/01.jpg
  - 弱みを挙げるなら、空中戦と守備。空中戦で競り勝ったのは、今季まだ1回です。
  - 守備の仕事も、比べた中ではいちばん少ない側。そのぶんの力を、点を取ることに注いでいます。
