- id: view
  heading: W杯22点とクラシコ1勝、大一番での点と勝ち
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月25日にクラシコ、26日にバロンドール発表
  say:
  - text: 最後に、大一番でのエムバペを、数字から読み解きます。
    image: assets/images/20261004_mbappe_real2025/01.webp
  - ワールドカップでは、出た試合と同じ数のゴールを3大会かけて積み上げました。
  - レアルでのクラシコ、バルセロナとの一戦でも6試合で6点。点はしっかり取っています。
  - text: ところがチームの勝ちは1度。残る5試合は敗れ、そのうち3つは決勝でした。
    emph: true
  - パリ時代のバルサ戦は、4試合6点で2勝。白いユニホームでは、点の数ほど勝ちがついてきていません。
  - 10月25日には、敵地カンプ・ノウでのクラシコ。
  - その翌日には、世界最優秀選手を選ぶバロンドールの発表が控えます。
  - 候補に名を連ねる本人は、9月にこう話しています。
  - voice: エムバペ
    text: 昨季、僕より優れた選手はいなかった
    pause: 0.6
  - まずはひざを治して、その舞台に立てるか。点と勝ちを一緒に持ち帰れるかに注目です。
