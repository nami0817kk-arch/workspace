- id: hook
  heading: どんな選手か
  tier: 報道
  telop: 14歳で見学したレアルに、26歳で来た
  narrator: キャスター
  say:
  - text: キリアン・エムバペ。ワールドカップで22試合22点、史上いちばん多く決めた選手です。
    image: assets/images/20261004_mbappe_face_w/01.jpg
  - 2026年の大会で10点。史上初めて、2大会続けて得点王になりました。
  - 14歳のとき、レアル・マドリードに1週間招かれました。案内役は、当時クラブにいたジダン。
  - そのジダンが今年7月にフランス代表の監督になり、9月の初陣でエムバペが決勝点を決めました。
  - レアルについて、本人は9月にこう言っています。
  - voice: エムバペ
    text: サッカーの歴史に名を刻みたいなら、
  - voice: エムバペ
    text: レアル・マドリーでプレーするべき
    cont: true
    pause: 0.5
  - 同じフォワードを100人並べると、シュートの数とドリブルは最上位、空中戦と守備は最下位。
  - この形がどう出来たのかを、数字と話で。
  sources:
  - https://www.fotmob.com/players/701154/kylian-mbappe
  - https://www.espn.com/soccer/story/_/id/49397919/kylian-mbappe-wins-golden-boot-2026-world-cup-lionel-messi-goalless-final
  - https://www.goal.com/en/lists/zinedine-zidane-kylian-mbappe-real-madrid-french-les-bleus/blt5ce4b4b305a42cf6
  - https://www.goal.com/jp/ニュース/2026-0918-real-madrid-mbppekil-inter-jp/bltd3689f32110e2d2e
