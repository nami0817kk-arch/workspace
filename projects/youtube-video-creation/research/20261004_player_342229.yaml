  say:
  - text: レアルの背番号10、エムバペ。開幕戦のハットトリックの夜、監督はこう語りました。
    short_only: true
    image: assets/images/20261004_player_342229/pair_mourinho/01.jpg
  - voice: モウリーニョ
    text: この男は信じられない。
  - voice: モウリーニョ
    text: レアル・マドリードで、歴史を作ることに飢えているように見える
    cont: true
    pause: 0.5
  - text: 今季ここまで、クラブの公式戦8試合で8点。719分の出場で、ほぼ90分に1点のペースです。
    image: assets/images/20261004_mbappe_real2026/02.jpg
    card: &recent_card
      type: table
      title: 直近5試合（代表を含む）
