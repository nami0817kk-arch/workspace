  say:
  - text: 同じフォワードと並べたレーダーで、エムバペの形を見ます。
    image: assets/stats/player_20261004_701154_radar.png
    no_telop: true
  - レーダーで見ると、得点とシュート数が頂点。空中戦と守備は、ほぼゼロです。
  - text: ボールを持つ場所は相手ゴールの近く。色の濃いところが、それです。
    image: assets/stats/player_20261004_701154_heat.png
    no_telop: true
  - 今季のドリブルは25回で最上位。ペナルティエリアの中でボールに触った回数も、85回で最上位。
  - text: 今季のシュートは41本、うち右足が32本。速攻からの10本を含めて、7点を取っています。
    image: assets/stats/player_20261004_701154_shots.png
    no_telop: true
  - つまり、速さで裏へ抜けて、右足で決める選手。作る側にも回り、ワールドカップでは4アシストでした。
  - 弱点は空中戦と守備。空中戦の勝ちは今季1回、守備の数字は同じFWの中で下から4番目です。
  - もう1つは左膝。去年12月、今年3月、そして9月と、同じ膝を痛めています。
  sources:
