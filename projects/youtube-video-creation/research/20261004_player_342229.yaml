  say:
  - text: レアルのエムバペ、27歳。ワールドカップ史上最多の22点を持つ右足が、今季もリーグ7試合で7点です。
    short_only: true
  - text: 今季はここまで9試合で9得点2アシスト、出場時間は779分。1点あたり86分。
    image: assets/images/20261004_mbappe_sweden_wide/01.jpg
  - ラ・リーガは7試合で7点2アシスト、チャンピオンズリーグは1試合で1点。
  - 直近5試合は5点2アシスト。ラージョ戦は2点1アシストで、評点は10点満点の9.5。
  - ただし9月20日のアトレティコ戦は枠内0本で、評点6.4。
  - 大一番の相性は、今季の宿題です。
  - 9月25日、ジダンの初陣で決勝点を決めた直後に左膝を痛めました。
  - 離脱は報道で10日から2週間です。
