  say:
  - text: キリアン・エムバペ、27歳。レアル・マドリードで最前線に立つ、センターフォワードです。
    image: assets/images/20261004_mbappe_real2025/01.webp
  - 生まれはパリ、育ちは郊外のボンディ。
  - 父は少年サッカーの指導者、母はハンドボール1部の選手でした。
  - 178センチの右利き。レアルとの契約は2029年まで残っています。
  - text: そして気になる市場価値。なんと、2億ユーロです。
    emph: true
  - この7月にまた上がって、自己最高の値を更新しました。
