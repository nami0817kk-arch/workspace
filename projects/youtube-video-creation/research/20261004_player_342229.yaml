  say:
  - text: エムバペの道はモナコから。16歳11か月でデビューしました。
    image: assets/images/20261004_mbappe_wc2018/01.jpg
  - 17歳62日で決めた初ゴールは、アンリの最年少記録を塗り替えています。
  - text: 市場価値の線は、モナコの2年で3500万ユーロまで跳ねました。
    image: assets/stats/player_20261004_701154_value.png
    no_telop: true
  - 2017年8月31日、最大1億8,000万ユーロでパリ・サンジェルマンへ。
  - 翌2018年7月15日、ワールドカップ決勝で得点。19歳207日は、ペレ以来の10代でした。
  - パリでは7年で256点、クラブ史上最多。2024年6月3日、契約満了でフリーのままレアルへ。
  - 14歳で見学した場所に、26歳で戻った形です。
  sources:
  - https://www.transfermarkt.com/kylian-mbappe/profil/spieler/342229
  - https://www.asmonaco.com/en/news/happy-birthday-kylian-mbappe
