    main: true
    heading: バイエルンに戻ったケインと、壇上の言葉
    tier: 報道
    telop: 練習場では職員の花道。壇上では古巣に感謝
    say:
      - text: 27日、ハリー・ケインがドイツに戻り、バイエルンの練習場へ。
        image: assets/images/20261028_kane_bayern_return/01_w.jpg
      - text: 職員が両側に並んで花道をつくり、「ハリー、ハリー」の大きな声で迎えました。
        image: assets/images/20261028_kane_bayern_return/01_w.jpg
      - voice: ケイン
        text: どこから話せばいいんだろう。一生忘れない夜になった。
        image: assets/images/20261028_kane_bayern_return/06_w.jpg
      - text: 前の晩はロンドンでバロンドールの授賞式。壇上で特に名前を挙げたのが、古巣でした。
        image: assets/images/20261028_kane_bayern_return/03_w.jpg
      - voice: ケイン
        text: トッテナムがなければ、今の僕は間違いなくいない。
        image: assets/images/20261028_kane_bayern_return/06_w.jpg
      - voice: ケイン
        text: 11歳から、あそこにいたんだ。
        cont: true
        image: assets/images/20261028_kane_bayern_return/03_w.jpg
      - voice: ケイン
        text: コーチたちの導きで、僕は夢を生きることができた。
        cont: true
        image: assets/images/20261028_kane_bayern_return/04_w.jpg
    official: false
    sources:
