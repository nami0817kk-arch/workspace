  - id: thanks
    heading: 壇上で名前を挙げた人たち
    tier: 報道
    telop: トッテナムの指導者3人と、イングランドの仲間
    say:
      - text: ケインがトッテナムを離れ、バイエルンへ移ったのは2023年のことです。
        image: assets/images/20261028_kane_bayern_return/03_w.jpg
      - text: 名前を挙げた指導者は3人。クリス・ラムジーとティム・シャーウッド。
        image: assets/images/20261028_kane_bayern_return/04_w.jpg
      - text: そして、親友の一人と呼んだライアン・メイソンです。
        image: assets/images/20261028_kane_bayern_return/03_w.jpg
      - text: 今年のワールドカップでは、主将としてイングランドを3位に導きました。
        image: assets/images/20261028_kane_bayern_return/05_w.jpg
      - voice: ケイン
        text: 完璧な1年ではなかった。でも、いい時間がたくさんあった。
        image: assets/images/20261028_kane_bayern_return/04_w.jpg
      - voice: ケイン
        text: この賞は、僕たちみんなのものだ。
        cont: true
        image: assets/images/20261028_kane_bayern_return/06_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50292020/harry-kane-tottenham-england-thomas-tuchel-ballon-dor

  - id: view
    viewpoint: true
    heading: 45年ぶりの受賞者を迎えたバイエルン
    tier: 報道
    telop: バイエルンの受賞者は4人目。前回は1981年
    say:
      - text: ここからは見立てです。
        image: assets/images/20261028_kane_bayern_return/01_w.jpg
      - text: 感謝を向けた先はトッテナム。それでも、いちばん沸いているのはバイエルンです。
        image: assets/images/20261028_kane_bayern_return/01_w.jpg
      - text: バイエルンの選手の受賞は、1981年のルンメニゲ以来、45年ぶり。
        image: assets/images/20261028_kane_bayern_return/06_w.jpg
        card: {type: timeline, title: バイエルンのバロンドール受賞者, rows: [[1970, ゲルト・ミュラー], [1972・76, ベッケンバウアー], [1980・81, ルンメニゲ], [2026, ハリー・ケイン]], focus: 2026}
      - text: ベッケンバウアー、ゲルト・ミュラー、ルンメニゲに続いて、4人目になりました。
        image: assets/images/20261028_kane_bayern_return/06_w.jpg
        card: {type: timeline, title: バイエルンのバロンドール受賞者, rows: [[1970, ゲルト・ミュラー], [1972・76, ベッケンバウアー], [1980・81, ルンメニゲ], [2026, ハリー・ケイン]], focus: 2026}
      - text: ドイツのクラブの選手としても、1996年以来の受賞。
        image: assets/images/20261028_kane_bayern_return/05_w.jpg
        card: none
      - text: 28日にはドイツカップのマクデブルク戦があります。
        image: assets/images/20261028_kane_bayern_return/01_w.jpg
      - text: そして31日のドルトムント戦で、ケインがトロフィーをファンに見せる予定です。
        image: assets/images/20261028_kane_bayern_return/04_w.jpg
