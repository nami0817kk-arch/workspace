#     ヘッドライナー（18日）は「佐藤はアギーレ監督の構想に含まれていない」「投資は失敗に終わる恐れがある。シーズン途中で移籍する可能性もある」「400万ユーロ（約7億4,000万円）を払ったが、今日ではその金額を正当化するのは難しい」と書く。
