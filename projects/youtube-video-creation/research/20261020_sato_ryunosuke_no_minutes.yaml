# 繰り返さない: 10/18 のバレンシア紹介（クラブの歴史・本拠地・トップチーム初の日本人・佐藤の言葉）の数字・言い回しは使わない。
# 自分で数えたもの: 開幕5試合のうち先発4（記事）→ 10月以降の出場は0（記事）。先発が続いた時期と、出番が無い時期が監督交代で分かれる、という並べ方だけ。因果は言わない。
# 本人の言葉・クラブの発表: 無し（記事に無い）。Y にしない。作らない。
# 反応: 0件。作らない。
# 写真: 配信写真（アフロスポーツ）は取り込まない。assets/images/20261020_sato_ryunosuke_no_minutes/ はバレンシアCF公式（valenciacf.com、©Valencia CF）の7月の入団時の記事の写真5枚（01・03・04・07、08は公式の入団バナー画像）。
#   全て目で見て本人（同じ顔。公式の入団記事の写真で、バナー noticasato の人物とも一致）。許諾は得ていない＝引き受ける危険。台本は「過去の写真」と断らないが credits.json に「入団時（2026年7月）」と控える。
