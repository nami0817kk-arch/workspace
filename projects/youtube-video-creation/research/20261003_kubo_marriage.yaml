  say:
  - text: 10代から注目を浴び続けてきた久保建英。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
  - text: ところが、その熱愛が報じられたことは一度もありません。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
  - text: それでもネットでは、何度も相手探しが起きてきました。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
  - text: 2019年ごろからは、インスタグラムでフォローしている、写真のポーズが似ている。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 0
  - text: そんな理由で、何人もの芸能人の名前が挙がりました。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 0
  - text: 2023年には、あるタレントがソシエダのユニホーム姿で観戦する動画を載せました。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 1
  - text: そこから、噂が広がります。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 1
  - text: この噂は、ワールドカップの年にも、観戦の様子から再び持ち上がりました。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 2
  - text: どの噂も、本人や相手が認めたことは無く、否定の言葉さえ出ないまま消えていきました。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
  - text: そして、その噂のどこにも、福原さんの名前はありませんでした。
    card:
      type: table
      title: ネットで噂が出たときの手がかり
      columns: [時期, 噂のきっかけ, 本人の言葉]
      rows: *rumor
      highlight_row: 3
  - text: 報告の文にも、出会いや交際の期間は書かれていません。
  - text: 噂を追う側が一度もつかめなかった答えを、2人は自分たちの言葉で明かしました。
  - text: 発表から3日後の5日には、国立でキリンカップの決勝が待っています。
