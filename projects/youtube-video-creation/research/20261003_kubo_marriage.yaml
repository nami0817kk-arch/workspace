    cont: true
  - voice: 久保建英
    text: 築いていきたいと思っております。
    cont: true
  - text: 福原さんは、子役の頃に「まいんちゃん」として親しまれた俳優です。
  - text: 発表の前の日、日本代表はエクアドルにPK戦で勝ち、キリンカップの決勝に進んだばかりでした。
  - text: 発表した2日は、代表の完全オフの日です。
