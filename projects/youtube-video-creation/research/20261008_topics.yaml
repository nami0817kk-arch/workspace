title: 10月8日の題材
lead: シリーズ6本はこちらで決めました。ニュースは16件から○×をお願いします
note: '<b>ニュースに○×を付けてください。</b>今日の本編10本は、シリーズ6本＋ニュース4本（日本人3・ほか1）の予定です。シリーズ（21〜26）はこちらで決めました。外したいものには×を、入れ替えたいときは予備（27・28）に○を付けてください。<br><b>写真の注意：</b>ニュース16件のうち14件は、記事の写真が代理店（Getty・アフロ・ロイター）の配信でした。○が付いたものは、代理店でない写真を別に探します。見つからなければ、その時点で知らせます。<br>欧州のリーグ戦は10/10〜12に再開します。書き出しが1本2〜3分に速くなったので、今日は時間に余裕があります。'
items:
- num: 21
  slot: シリーズ
  fmt: クラブ紹介
  head: ラ・リーガ紹介⑨エルチェ
  why: 9/26 に作った台本を、今日の数字・見立ての節・冒頭の強い一点に合わせて直して出す（デポルティーボの続き）
  src: 作り置き（20260926_ll09_elche）
