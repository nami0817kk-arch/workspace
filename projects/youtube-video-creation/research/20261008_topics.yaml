  head: 選手紹介⑧ジョアン・ネヴェス（パリ・サンジェルマン）
  why: 10/6 のベリンガムの回の終わりの画面で「明日は⑦ジョアン・ネヴェス」と予告していた（実際に出したのはヴィニシウス）。ここで出せば予告と合う。22歳、市場価値1.4億ユーロ
  src: 選手紹介の型（tools/player_intro.py）
- num: 23
  slot: シリーズ
  fmt: 数字で見る
  head: 得点王レース、代表ウィーク明けの5大リーグ
  why: 木曜の型。10/1 の控えと比べて先週からの動き（首位交代・独走・PK頼み・日本人）を出す。新しい板（散らばり図＝得点×期待値）の初回に向く
  src: tools/scorers.py（控えは 10/1）
- num: 24
  slot: シリーズ
  fmt: 1年前の噂
  head: 1年前の移籍の噂、本当になったのはどれか
  why: 2025年10月に出ていた移籍の噂を並べ、◎○△×で答え合わせ（新しい判定表の板が向く）。噂の出どころと、実際にどうなったかを原典で確かめる
  src: 1年前の報道（要調査）
- num: 25
  slot: シリーズ
  fmt: 移籍の答え合わせ
  head: 夏の高額移籍、3か月たっていちばん応えているのは誰か
  why: 10/5 に初回を出した型の続き。今回は「出場時間あたりの得点関与」で並べ替えるなど、前回と違う切り口にする（前回は10人の出場と得点）
  src: Transfermarkt（自分で数える）・前回の控え 20261005_transfer_review
