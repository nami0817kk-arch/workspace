- id: fall
  heading: 6回優勝したクラブが、3部へ
  tier: 背景
  telop: 6回優勝したクラブが、2018年には3部にいた
  narrator: 解説
  card:
    type: table
    title: 落ちて、戻るまで
    columns:
    - ''
    - ''
    rows:
    - - リーグ優勝
      - 6回（1892・1893・1895・1902・1913・1936）
    - - 1973年
      - 2部のクラブとしてFAカップ優勝。翌季は欧州へ
    - - 2018年
      - 3部へ。2年続けての降格
    - - 2022年
      - 2部へ昇格
    - - 2025年5月24日
      - プレーオフ決勝でシェフィールド・Uに2-1
    - - 3部から1部まで
      - 7年
    - - 2025-26年
      - 7位。53年ぶりのヨーロッパ（ヨーロッパリーグ）
  say:
  - 6回のうち3回が1890年代で、最後は1936年です。
  - 1973年には、**2部**のクラブとしてFAカップを獲りました。翌シーズンはヨーロッパにも出ています。
  - そのクラブが、2018年には**3部**にいました。2年続けて落ちた結果です。
  - この時期を追った配信番組が、『**サンダーランド・ティル・アイ・ダイ**』です。
  - 題の意味は、「死ぬまでサンダーランド」。
  - 2022年に2部へ戻り、2025年5月24日、プレーオフ決勝でシェフィールド・ユナイテッドを2対1で下します。
  - '**3部から1部まで、7年**でした。'
  - そして昨季は、7位に入りました。
  - 1973年以来、**53年ぶり**のヨーロッパ。今季はヨーロッパリーグに出ます。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  bg: assets/backgrounds/stadium_サンダーランド.png
- id: episode
  heading: イングランド銀行クラブ
  tier: 背景
  telop: 「イングランド銀行クラブ」の代償
  narrator: 解説
  card:
