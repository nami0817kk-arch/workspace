- id: data
  heading: サンダーランド 基礎DATA
  main: true
  tier: 背景
  telop: 1879年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_sunderland_data.png
    text: 創立は**1879年**。地元の先生たちが作ったチームが始まりです。
  - image: assets/stats/pl_sunderland_data.png
    text: 本拠地はスタジアム・オブ・ライト。**4万8095人**が入ります。
  - image: assets/stats/pl_sunderland_data.png
    text: オーナーはキリル・ルイ＝ドレフュス。株の64%を持っています。
  - image: assets/stats/pl_sunderland_data.png
    text: 1部リーグの優勝は**6回**。FAカップも2回獲っています。
  - image: assets/stats/pl_sunderland_data.png
    text: 1998年から99年には、勝ち点**105**。当時のリーグの最多記録でした。
  - image: assets/stats/pl_sunderland_data.png
    text: プレミアでの最高位は**7位**。2000年から01年、そして昨季の2025年から26年です。
  - image: assets/stats/pl_sunderland_data.png
    text: 愛称は「ブラック・キャッツ」。黒猫です。
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  bg: assets/backgrounds/stadium_サンダーランド.png
  official: false
- id: fall
  heading: 6回優勝したクラブが、3部へ
  tier: 背景
  telop: 6回優勝したクラブが、2018年には3部にいた
  narrator: 解説
  card:
    type: table
    title: 落ちて、戻るまで
    columns:
    - ''
    - ''
    rows:
    - - リーグ優勝
      - 6回（1892・1893・1895・1902・1913・1936）
    - - 1973年
      - 2部のクラブとしてFAカップ優勝
    - - 2018年
      - 3部へ。2年続けての降格
    - - 2025年5月24日
      - プレーオフ決勝でシェフィールド・Uに2-1
    - - 3部から1部まで
      - 7年
    - - 2025-26年
      - 7位。53年ぶりのヨーロッパ
  say:
  - 1部で**6回**も優勝しているクラブが、2018年には**3部**にいました。2年続けて落ちた結果です。
  - この時期のクラブを追った記録は、ネットフリックスの『**サンダーランド・ティル・アイ・ダイ**』になっています。
  - 6回の優勝は、1892年、93年、95年、1902年、1913年、そして1936年。19世紀の終わりには、イングランドで最も強いクラブのひとつでした。
  - 1973年には、**2部**のクラブだったサンダーランドがFAカップの決勝を勝っています。立役者はゴールキーパーのジミー・モンゴメリー、決勝点はイアン・ポーターフィールドでした。
  - 戻ってきたのは2025年5月24日。プレーオフ決勝でシェフィールド・ユナイテッドに2対1。**3部から1部まで、7年**でした。
  - そして昨季、2025年から26年はリーグ**7位**。
  - '**53年ぶり**に、ヨーロッパの舞台に出る権利を取っています。'
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
  bg: assets/backgrounds/stadium_サンダーランド.png
