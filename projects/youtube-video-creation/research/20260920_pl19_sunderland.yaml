    columns:
    - ''
    - ''
    rows:
    - - 戦後
      - 大金で選手を集める。あだ名「イングランド銀行クラブ」
    - - 1957年
      - 上限を超える給料。罰金5000ポンド
    - - 翌年
      - 68年で初めて1部から降格
  say:
  - 戦後まもなく、大金で選手を集め、「イングランド銀行クラブ」と呼ばれました。
  - 当時は選手の給料に上限がありました。ところが**1957年**、それを超える支払いが発覚します。
  - 5000ポンドの罰金。会長と役員3人が資格停止になりました。
  - その翌年、リーグに入って68年で初めて、1部から落ちました。
  sources:
  - https://en.wikipedia.org/wiki/Sunderland_A.F.C.
