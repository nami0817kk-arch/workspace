  question: 上田綺世はなぜ先発を外れ、56分から入って何をしたのか
  takeaway: 上田綺世はベンチから始まり、56分にオリヴィエ・ジルーと代わって1トップに入った。先発でなかった理由を、リールの監督は自分で説明している。3週間クラブに残っていた選手を先に使い、代表へ行った選手は休ませた、というもの。上田が入ったあとの34分で、リールに追加点は生まれなかった。74分には抜け出したところでオフサイドを取られ、80分に得たペナルティキックも、味方のオフサイドで取り消されている。守り切ったのは5分にバクワが決めた1点で、1対0。リールはこの節を4位で迎え、勝って勝ち点13。試合を終えた時点ではリーグの先頭だったが、同じ日の夜にモナコが14へ伸ばし、いまは1差の2位。2026年に入ってからのリーグ戦の無失点は11回で、これはリーグでいちばん多い側に並ぶ
  opening_image: assets/images/20261011_ueda_lille/01_w.jpg
