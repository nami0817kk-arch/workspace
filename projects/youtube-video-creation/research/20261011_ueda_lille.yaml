# 取材メモ（10/11 題材 ③ ueda_lille、型は news、日本人枠）。**ショートだけ作る**（本編は作らない）。
# 効く一点：**上田綺世が先発を外れた理由を、監督が自分で説明している**。
#   リール公式（試合後の談話、2026-10-10 19:43）のダビデ・アンチェロッティ監督の原文:
#     « Ma priorité était de faire jouer les joueurs qui sont restés ici pendant 3 semaine,
#       qui avaient beaucoup d'énergie. Et de faire reposer les internationaux. »
#     « Je ne suis pas satisfait du niveau de l'équipe avec le ballon, ça c'est sûr. »
#     « Mais si on est déçu quand on gagne, alors on sera tout le temps triste.
#       Il faut être satisfait pour les trois points »
#   https://www.losc.fr/actualites/2026-10-10/il-faut-etre-satisfait-pour-les-trois-points
#   訳は自分で起こした（フットメルカートやサッカーキングの訳は使っていない）。
# **キリンカップはリール公式が書いている**（2026-10-06）: 上田は代表ウィークの4試合で4得点、
#   決勝のニュージーランド戦（2対1）で先制点を決め、大会の最優秀選手に選ばれた。
# **上田本人の言葉は 10/11 10:00 時点で見つかっていない**（クラブ公式・サッカーキング・ゲキサカ・
#   フットメルカート・ル・プチ・リロワ・本人のSNSを当たった）。無いまま作る。推測で書かない。
# **数字の食い違い（必ず見る）**
#   ・上田の投入：**リール公式は56分**（« Hakon Haraldsson et Ayase Ueda (56') »）。サッカーキングも56分。
#     ところが**リーグ・アン公式のAPI（ma-api.ligue1.fr）は57分**。**クラブ公式の56分を採った**
#     （ユーザーの○にも56分と書かれている）。1分の差なので、台本では「56分」で通す。
#   ・相手の退場：**リーグ・アン公式もリール公式も61分**。サッカーキングは62分。**61分を採った**。
#   ・節の番号：**リーグ・アン公式は第6節**（game-week 6）。サッカーキングも第6節。
#     フットメルカートだけ「8e journée（第8節）」と書いているが、**これは誤り**。公式を採った。
#   ・先制点のアシスト：**リーグ・アン公式の記録ではアシスト無し**。リール公式とフットメルカートは
#     「タンギ・ニアンズーのロングパス」。サッカーキングは「タンギ・クアシ」と書いているが、
#     **クアシとニアンズーは別人**。台本ではアシストの名前を出していない（公式に無いので）。
# **瀬古歩夢の退場は、今日の別の回（20261011_seko_red）が扱う。**
#   こちらは「相手が1人退場して10人になった」とだけ言い、**名前も場面も出さない**（重なりを作らない）。
# **暫定首位の扱い**：リールが試合を終えた時点では勝ち点13で先頭。ただし**同じ日の夜にモナコが
#   引き分けて14**になり、**いまは1差の2位**。「首位」と言い切らず、そのまま順に話す。
#   リーグ・アン公式の第6節のデータでは、リールの**節の開始時点の順位は4位**（gameWeekStartingRank）。
#   いまの順位は FotMob の表（src.standings）で確認：1位モナコ 6試合14 / 2位リール 6試合13 / 3位リヨン 6試合11。
# **2026年に入ってからのリーグ戦の無失点11回（PSGと並んでリーグ最多）**はフットメルカートの記述。
# 写真は Le Petit Lillois の1枚（Ayase-Ueda-3-1.jpg、2048x1365、記事の表記「Photo : Le Petit Lillois /
#   Quentin Delcourt」）。**代理店ではない**（媒体の自前の撮影）。リールのビブス姿で顔が大きく写っている。
#   サッカーキング・ウルトラサッカーの写真は Getty 配信、リール公式とフットメルカートの写真は
#   ICON SPORT / MaxPPP の配信だったので、どれも使っていない。
#   facecrop で 01_w（16:9・2048x1152）と 01_v（9:16・768x1365）を切り、どちらも目で見た。
# サムネ：構図 scene（**ユーザーと相談して決める**。ここに書いたのは点検を通すための1案）。
# ネットの反応は集めていない。反応の節は無い。
# 数字の重なり対策：『56分』『34分』は①だけ、『5分』『77分』『80分』は②だけ、『13』『14』『11回』は③だけ。
