    heading: カップ戦の敗退で、改めて語られたこと
    tier: 報道
    telop: カラバオカップ4回戦、ボーンマスに0対3
    say:
      - text: 28日のカラバオカップ4回戦、ボーンマス対アストン・ヴィラ。ヴィラは0対3で敗れ、大会を去りました。
        image: assets/images/20261030_suzuki_villa_gk/01_w.jpg
      - text: 24日のシティ戦から、先発は9人を入れ替え。鈴木彩艶はベンチに入りましたが、出番はありませんでした。
      - text: ゴールを守ったのは、マルコ・ビゾット。複数の好セーブも見せていました。
        image: assets/images/20261030_suzuki_villa_gk/02_w.jpg
      - text: そのうえで現地のメディアは、鈴木について、加入して以来、素晴らしいプレーを見せていると評価しました。
      - text: 短い期間で、このチームで最も重要な選手の一人になった、とも。
        image: assets/images/20261030_suzuki_villa_gk/03_w.jpg
    official: false
    sources:
      - https://www.footballchannel.jp/2026/10/30/post1042725/

  - id: worry
    heading: 心配されているのは1月
    tier: 報道
    telop: 現地の見立て、アジアカップで5〜7試合の不在
    say:
      - text: 心配されているのは、来年1月のアジアカップです。
        image: assets/images/20261030_suzuki_villa_gk/01_w.jpg
      - text: 鈴木が日本代表として参加すれば、ヴィラは5試合から7試合ほど、鈴木を欠く可能性がある。これは現地メディアの見立てです。
      - text: その間、ビゾット1人に頼る状況が不安だと言います。
        image: assets/images/20261030_suzuki_villa_gk/02_w.jpg
      - text: 一方で、ビゾットが出場を重ねて調子を取り戻す可能性にも触れています。
      - text: 現地の提案は、1月の移籍市場で、経験豊富なゴールキーパーを期限付きで獲得することです。
        image: assets/images/20261030_suzuki_villa_gk/03_w.jpg
    official: false
    sources:
      - https://www.footballchannel.jp/2026/10/30/post1042725/

  - id: view
    viewpoint: true
    heading: 不在は何試合になるのか
    tier: 背景
    telop: アジアカップは2027年1月7日から2月5日
    say:
      - text: 見立てです。アジアカップは、1月7日から2月5日まで。日本の初戦は1月11日で、あと73日です。
        image: assets/images/20261030_suzuki_villa_gk/01_w.jpg
      - text: 現地の数えは5試合から7試合。日本が勝ち進むほど、決勝の2月5日に向けて不在は長くなります。
        emph: true
      - text: ただ、この大会を開くかどうかは、安全面から、11月中旬の理事会で最終決定される方針です。
        image: assets/images/20261030_suzuki_villa_gk/02_w.jpg
      - text: 備えが要るかどうかは、その決定を待つことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/10/30/post1042725/
