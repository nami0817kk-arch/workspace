sections:
- id: hook
  heading: スイスは、72年ぶりのベスト8で、何が変わったのか
  tier: 背景
  telop: 1954年以来72年ぶり。W杯ベスト8
  narrator: 解説
  main: true
  say:
  - text: スイス代表。フィファランクは12位の国です。
    image: assets/stats/tb_switzerland_data_t.png
    short_only: true
    no_telop: true
  - text: 2026年のワールドカップで、スイスはベスト8に進みました。
    image: assets/stats/tb_switzerland_data_t.png
    no_telop: true
  - text: 1954年以来、72年ぶりです。
    image: assets/stats/tb_switzerland_data_r1.png
    no_telop: true
    emph: true
  - text: 1994年のあと、スイスはベスト16で、5回負けてきました。
    image: assets/stats/tb_switzerland_data_r1.png
    no_telop: true
  - text: それを2026年は、コロンビアとのPK戦に勝って、越えました。
    image: assets/images/20261122_team_switzerland/b01_w.jpg
    no_telop: true
  - text: スイスは、なぜ今回、ベスト16を越えられたのでしょうか。
    image: assets/stats/tb_switzerland_data_t.png
    no_telop: true
