- id: data
  heading: スイス代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: スイス代表の基礎DATA
  narrator: 解説
  say:
  - text: スイスのフィファランクは、10月7日の発表で**12位**。日本は17位です。
    image: assets/stats/tb_switzerland_data0.png
    no_telop: true
  - text: ワールドカップは13回出場。最高は、ベスト8です。
    image: assets/stats/tb_switzerland_data1.png
    no_telop: true
  - text: 直近は2026年。アルゼンチンに、延長で1対3の負けでした。
    image: assets/stats/tb_switzerland_data2.png
    no_telop: true
  - text: ヨーロッパ選手権も、2020年と2024年が、ベスト8です。
    image: assets/stats/tb_switzerland_data3.png
    no_telop: true
  - text: 監督は、ムラト・ヤキン。2021年8月から指揮しています。
    image: assets/stats/tb_switzerland_data5.png
    no_telop: true
  - text: 主将はグラニト・シャカ。代表152試合は、歴代最多です。
    image: assets/stats/tb_switzerland_data6.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Switzerland_national_football_team
  - https://en.wikipedia.org/wiki/Switzerland_at_the_FIFA_World_Cup
  - https://en.wikipedia.org/wiki/Module:SportsRankings/data/FIFA_World_Rankings
