  - id: view
    viewpoint: true
    heading: 佐野海舟の交代、数字で見ると
    tier: 報道
    telop: 今季の交代3回は、どれも81分より後
    say:
      - text: 今季の3回の交代は、88分、81分、90分過ぎ。
        image: assets/images/20261028_sano_kaishu_bild/03_w.jpg
        card: none
      - text: 過去2年の1回と比べれば多くても、どれも試合の終盤でした。
        image: assets/images/20261028_sano_kaishu_bild/05_w.jpg
        card: none
      - text: リーグ戦では、先発から外れた試合がまだありません。
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
      - text: 見立てとしては、SDの言う高いハードルは、過去2年の佐野自身が作った基準です。
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
      - text: 次は日本時間31日午前4時半、アウェーのエルフェルスベルク戦です。
