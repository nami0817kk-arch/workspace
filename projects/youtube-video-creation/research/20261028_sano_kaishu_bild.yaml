sections:
  - id: what
    main: true
    heading: 2年で1回だった途中交代
    tier: 報道
    telop: 佐野海舟、今季の途中交代はすでに3回
    say:
      - text: マインツの日本代表、佐野海舟。
        short_only: true
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
      - text: 直前のリーグ戦、マインツはブレーメンに2対3で敗れました。
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
      - text: 佐野は先発し、90分を過ぎたところで交代しています。
        image: assets/images/20261028_sano_kaishu_bild/03_w.jpg
        card: none
      - text: 過去2年、佐野が途中で退いたのは、68試合でわずか1回です。
        image: assets/images/20261028_sano_kaishu_bild/05_w.jpg
        card: none
      - text: その途中交代が、今季はもう3回目になりました。
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
      - text: ドイツのビルトは、こう書いています。
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
      - text: 前シーズンのトップフォームにはない。
        voice: ビルト
        image: assets/images/20261028_sano_kaishu_bild/03_w.jpg
        card: none
      - text: マインツの強化責任者、ブンガートSDの言葉です。
        image: assets/images/20261028_sano_kaishu_bild/05_w.jpg
        card: none
      - text: 海舟が評価されるハードルは、
        voice: ブンガートSD
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
      - text: 今や信じられないほど高くなっている。
        voice: ブンガートSD
        cont: true
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
      - text: 背景にあるとされるのが、この夏の移籍話です。
        image: assets/images/20261028_sano_kaishu_bild/03_w.jpg
        card: none
      - text: クリスタル・パレスへの移籍が迫り、専用機まで用意されていました。
        image: assets/images/20261028_sano_kaishu_bild/05_w.jpg
        card: none
      - text: マインツは6000万ユーロを求め、3000万ユーロの申し出を断りました。
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
    official: false
    sources:
      - https://www.football-zone.net/archives/681113
      - https://www.football-zone.net/archives/671359
      - https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=401884757

  - id: cup
    heading: 火曜のドイツカップ
    tier: 報道
    telop: ドイツカップ2回戦、マインツは2部のボーフムに0対2
    say:
      - text: そして火曜のドイツカップ2回戦。
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
      - text: マインツは2部のボーフムに0対2で敗れ、大会を去りました。
        image: assets/images/20261028_sano_kaishu_bild/03_w.jpg
        card: none
      - text: 佐野は先発し、交代せずに90分を戦いました。
        image: assets/images/20261028_sano_kaishu_bild/05_w.jpg
        card: none
      - text: 川﨑颯太は、84分から入っています。
        image: assets/images/20261028_sano_kaishu_bild/01_w.jpg
        card: none
      - text: ボーフムには三好康児。63分から出場し、終盤は日本人3人が同じピッチにいました。
        image: assets/images/20261028_sano_kaishu_bild/04_w.jpg
        card: none
    official: false
    sources:
