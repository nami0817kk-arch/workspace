# 移籍の深掘り 第5回：ニューカッスルの2026年夏（「1クラブの移籍期間」の回）。10/16 作成。
# 材料の控え（数字の根拠・読めたもの／読めなかったもの）は research/raw/20261016_transfer_nufc_window.md。**材料から出ない。**
#
# **なぜニューカッスルか。**Transfermarkt の世界の一覧（2026年夏、支出の多い順）で、支出の1位マンチェスター・シティ（10/11 に出済み）、
#   2位チェルシー（同日のスタジアムの回）、3位トッテナム（同日の財政の回）を除くと、次が **4位ニューカッスル（3億1300万ユーロ）**。
#   5位アストン・ヴィラ（3億20万）、6位リヴァプール（10/14 に出済み）。プレミアの20クラブの一覧でも4位。**機械で並べ直して確かめた。**
#
# **角度：「3人の主力を売って、8人を買った夏」。**リヴァプール（12%しか戻らなかった）の対極で、払った額の89%が戻った。
#   あちらの数字は使わない。クラブ名も出さない。10/11 のシティ回で売り手として出た「ニコ・ゴンサレスの56.0」は、買い手側（この回）の1件として扱う。
#
# いちばん強い一点：**払った額は世界4番目なのに、差し引きは払った額の11%（3390万ユーロ）。戻った2億7910万の99%は、トナーリ・ブルーノ・ゴードンの3人。**
#
# **数字の確度。**移籍金は Transfermarkt の集計で **確度は「報道」**。
#   - **クラブ公式（newcastleunited.com）の発表文12件（加入8・退団3・貸し出し1）を全部読んだ。額は1つも書かれていない。**
#     うち4件（トゥーレ・ステウル・ホルニチェク・トナーリ）は「undisclosed（非公表）」と明記、残りは額への言及自体が無い。
#     台本は「クラブが発表した額」と言わず、②で断っている。
#   - 固定とボーナスの切り分けは公表されていない（②で断る）。
#   - 市場価値は Transfermarkt の推定で値段ではない（⑤で断る）。移籍の直前の値は Transfermarkt の移籍履歴 API の details.marketValue。
#   - 媒体名は台本に出さない。出どころは各節の sources。
#
# **自分で数えた数**（百万ユーロ。足し算で一致を確かめた）:
#   払った額 60.0+56.0+50.0+35.9+35.5+30.6+23.5+21.5＝313.00 ← 一覧の313.00と一致／戻った額 108.0+87.5+80.0+3.6（ヴォルテマーデの貸し出し料）＝279.10 ← 一覧と一致／
#   差し引き 313.00−279.10＝33.90 ← 一覧の−33.90と一致／戻った割合 279.1÷313.0＝89.2%（89%）／差し引き÷払った額 33.9÷313.0＝10.8%（11%）／
#   1人平均 313.0÷8＝39.125（3913万）／上位3人 60+56+50＝166.0 → 166÷313＝53.0%（53%）／
#   売った3人 108+87.5+80＝275.5 → 275.5÷279.1＝98.7%（99%）／
#   ブルーノの退団（8/8）より前に決まった5人（ジャウアン21.5・トゥーレ50.0・ステウル23.5・バンバ35.5・ホルニチェク30.6）＝161.1 → 161.1÷313＝51.5%（51%）／
#   あとの3人（デディッチ35.9・ニコ56.0・パルド60.0）＝151.9／最後の日のパルド 60÷313＝19.2%（19%）／
#   買った8人の移籍直前の市場価値 35+40+40+20+18+18+7+12＝190 → 313÷190＝1.647（約1.65倍）、差 123.0／ステウル 23.5÷7＝3.36（約3.4倍）／8人全員が斜めの線の上／
#   売った3人の市場価値 80+70+65＝215 → 275.5÷215＝1.281（約1.28倍）／
#   同じ位置の相場：今夏、プレミアの他の19クラブが「移籍金の数字が付いた」加入127人を、Transfermarkt の位置4群（GK・守備・中盤・攻撃）に分けた平均
#     GK 16.41(12人)／DF 24.86(38人)／MF 41.90(36人)／FW 27.93(41人)。ニューカッスルの平均 GK 26.05(2)・DF 35.9(1)・MF 38.33(3)・FW 55.0(2)。
#     倍率 1.59／1.44／0.92／1.97。8人を位置の平均で買えば 16.41×2+24.86+41.90×3+27.93×2＝239.25 → 313.0÷239.25＝1.308（約1.31倍）、差 73.75（7375万）／
#   平均年齢（Transfermarkt の移籍時の年齢）：出た3人 26+28+25＝79 → 26.3歳。入った8人 21+24+20+24+20+24+18+20＝171 → 21.4歳（21.375）／
#   夏の5年（払った額／戻った額／差し引き）2022 143.50／2.90／−140.60、2023 156.30／44.60／−111.70、2024 68.20／76.20／＋8.00、
#     2025 278.85／176.00／−102.85、2026 313.00／279.10／−33.90。5年で払った額が最多は今年、戻った額も今年（5年で毎年増えた）。
#     2022年の戻った割合 2.90÷143.50＝2.0%（2%）／最近の2年の戻った額 176.00+279.10＝455.10 → 455.1×177.06＝80,579百万円（約806億円）。
#   為替：ECB 参照相場 2026-10-15＝1ユーロ177.06円（取れた最新）。33.9百万×177.06＝6,002百万円（約60億円）。
# プレミア20クラブの差し引きの大きい順で、ニューカッスルは14番目（−33.90。13番目がサンダーランド−38.15）。
#
# 数字の重なり対策：『3億1300万』『2億7910万』『3390万』『89%』『11%』『60億円』『14番目』は①だけ／②は『3913万』『53%』『1億6600万』／
#   ③は『1億6110万』『51%』『19%』／④は『2億7550万』『99%』『1億800万』『8750万』『8000万』／⑤は『1億9000万』『1.65倍』『3.4倍』『2億1500万』『1.28倍』『2億3925万』『1.31倍』／
#   ⑥は『26.3歳』『21.4歳』『4億5510万』『806億円』『2%』。**題には金額を入れない**。
# 板：①waterfall と convert ②table（8行） ③timeline（6行）・calc・document ④table（5行）・document 2枚 ⑤scatter（diagonal つき）・calc 3枚・table ⑥line・table（赤ペン）・convert。
# 新しい見せ方：文書カード（公式発表の訳）3枚＋パルド発表の談話1枚＝計4枚／大見出し語 ②／紋章の差し込み ④の頭／赤ペン ⑥。
