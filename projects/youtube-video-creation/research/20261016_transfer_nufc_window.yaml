    - &i6 [ルカシュ・ホルニチェク, ブラガ, '30.6']
    - &i7 [ショーン・ステウル, アヤックス, '23.5']
    - &i8 [エワン・ジャウアン, ランス, '21.5']
  say:
  - text: 次は、ニューカッスルが払ったほうの8人です。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: none
    callword: 8人に払った夏
  - text: 移籍金が付いて加わったのは8人です。
    card: *inlist
  - text: いちばん高いのは、フェルナンデス・パルド。リールから6000万ユーロ。
    image: assets/images/20261016_transfer_nufc_window/b01_pardo_w.jpg
    emph: true
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: 0}
  - text: 次がニコ・ゴンサレス。マンチェスター・シティから5600万ユーロ。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: 1}
  - text: 3人目はトゥーレ。ホッフェンハイムから5000万ユーロ。
    image: assets/images/20261016_transfer_nufc_window/b02_toure_w.jpg
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: 2}
  - text: 上の3人だけで、払った額の53%です。
    emph: true
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: [0, 1, 2]}
  - text: 4人目からは、デディッチ、バンバ、ホルニチェクと続きます。
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: [3, 4, 5]}
  - text: 最後の2人は、18歳のステウルと、20歳のジャウアンです。
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: [6, 7]}
  - text: 額の裏づけは、クラブの発表にあるのでしょうか。
    card: *inlist
  - text: 8人の加入を知らせた文のうち、3人は「非公表」と明記しています。
    card: *inlist
  - text: トゥーレ、ステウル、ホルニチェクの3人です。
    card: {type: table, title: 払った額の大きい順（8人）, columns: ['選手', '前のクラブ', '百万ユーロ'], rows: [*i1, *i2, *i3, *i4, *i5, *i6, *i7, *i8], highlight_row: [2, 5, 6]}
  - text: 残る5人の文には、額の記載がありません。
    card: *inlist
  - text: 最初に決まった額か、条件で増える分を含むかも、分かっていません。
    card: *inlist
