#   ブルーノ・ギマランイス（2026-06-13 ブラジル対モロッコ、背番号8）、セント・ジェームズ・パーク空撮（CC BY-SA 3.0 de）。3人は Commons の構造化データ（depicts）で本人を確認し、顔を目でも確認。
#   トナーリ・ゴードン・ニコ・ゴンサレスは構造化データで本人と確かめられる写真が取れず**未取得**（その行は本拠地の写真を出す）。出典は assets/images/20261016_transfer_nufc_window/credits.json。
