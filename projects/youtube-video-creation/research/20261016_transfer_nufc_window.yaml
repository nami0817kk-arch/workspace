- id: view
  viewpoint: true
  heading: 払った額も戻った額も、5年でいちばん大きい夏だった
  tier: 報道
  telop: 払った額も戻った額も5年で最大。出た3人は平均26.3歳、入った8人は平均21.4歳
  narrator: 解説
  card: &years
    type: line
    title: 夏の移籍期間に払った額と戻った額（5年）
    unit: 百万ユーロ
    x: ['2022年', '2023年', '2024年', '2025年', '2026年']
    series:
    - [払った額, [143.5, 156.3, 68.2, 278.85, 313.0]]
    - [戻った額, [2.9, 44.6, 76.2, 176.0, 279.1]]
    focus: 戻った額
  say:
  - text: この夏が突出していたのか、過去5年のニューカッスルと比べます。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: *years
  - text: 5年分の夏について、払った額と戻った額を線にしました。
    card: *years
  - text: 払った額は、この夏が5年で最大。前の最大は、2025年の夏でした。
    emph: true
    card:
      <<: *years
      highlight: '2026年'
  - text: 戻った額は、2022年の夏は、払った額のわずか2%でした。
    card:
      <<: *years
      highlight: '2022年'
  - text: そこから毎年増えて、この夏は戻った額も5年で最大です。
    emph: true
    card:
      <<: *years
      highlight: '2026年'
  - text: 戻った額が払った額を上回ったのは、2024年の夏だけです。
    card:
      <<: *years
      highlight: '2024年'
  - text: では、何を売って、何を買ったのか。年齢で並べます。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: &age_table
      type: table
      title: 出た3人と、入った8人（移籍の時点の年齢）
      columns: ['', '人数', '平均年齢', '移籍金の平均（百万ユーロ）']
      rows:
      - ['出た3人', '3人', '26.3歳', '91.8']
      - ['入った8人', '8人', '21.4歳', '39.1']
  - text: 出た3人の平均年齢は、26.3歳です。
    card:
      <<: *age_table
      highlight_row: 0
  - text: 入った8人の平均年齢は、21.4歳でした。
    emph: true
    card:
      <<: *age_table
      highlight_row: 1
    mark: {kind: circle, row: 1, col: 平均年齢}
  - text: 1人あたりの移籍金は、出た側のほうが2倍以上です。
    card:
      <<: *age_table
      highlight_row: 0
  - text: 主力3人を売り、8人の若い選手で埋めた形が、はっきり出た夏です。
    card: *age_table
  - text: この形が実るかどうかは、これからの出場で決まります。
    card: none
  - text: 次に動けるのは、冬の窓。2027年1月1日から2月1日までです。
    card: none
