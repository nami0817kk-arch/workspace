- id: value
  heading: 市場価値より高く買い、高く売った。同じ位置の平均でも、買った側は高かった
  tier: 報道
  telop: 買った8人は市場価値の約1.65倍、売った3人は約1.28倍。同じ位置の平均の約1.31倍
  narrator: 解説
  card: &scat
    type: scatter
    title: 移籍の直前の推定の市場価値と、払った移籍金
    x: {label: 移籍の直前の市場価値, unit: 百万ユーロ}
    y: {label: 払った移籍金, unit: 百万ユーロ}
    points:
    - [フェルナンデス・パルド, 35, 60]
    - [ニコ・ゴンサレス, 40, 56]
    - [トゥーレ, 40, 50]
    - [デディッチ, 20, 35.9]
    - [バンバ, 18, 35.5]
    - [ホルニチェク, 18, 30.6]
    - [ステウル, 7, 23.5]
    - [ジャウアン, 12, 21.5]
    diagonal: 市場価値と同じ額
    focus: ステウル
  say:
  - text: ニューカッスルは高く買い、高く売ったのか。物差しを2つ使います。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: none
  - text: 1つ目は選手の市場価値。推定の評価で、実際の値段とは別物です。
    card: *scat
  - text: 買った8人の、移籍の直前の市場価値を合計します。
    card: *scat
  - text: 払った額は、その合計の約1.65倍です。
    emph: true
    card: &calc_in
      type: calc
      title: 買った8人は市場価値の何倍か
      terms:
      - ['3億1300万ユーロ', 払った額]
      - ['1億9000万ユーロ', 直前の市場価値の合計]
      - [約1.65倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: 図には、払った額が市場価値と同じになる、斜めの線を引きました。
    card:
      <<: *scat
      highlight: フェルナンデス・パルド
  - text: 8人全員が、その線より上にいます。
    emph: true
    card:
      <<: *scat
      highlight: ニコ・ゴンサレス
  - text: 市場価値との倍率がいちばん大きかったのは、18歳のステウル。
    card:
      <<: *scat
      highlight: ステウル
  - text: 市場価値は700万ユーロで、払ったのは約3.4倍です。
    card:
      <<: *scat
      highlight: ステウル
  - text: 売る側も、市場価値と比べます。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: none
  - text: 出た3人が受け取った額は、市場価値の合計の約1.28倍です。
    emph: true
    card: &calc_out
      type: calc
      title: 売った3人は市場価値の何倍か
      terms:
      - ['2億7550万ユーロ', 受け取った額]
      - ['2億1500万ユーロ', 直前の市場価値の合計]
      - [約1.28倍, 市場価値の何倍か]
      ops: ['÷', ＝]
  - text: 市場価値より高く買い、市場価値より高く売れた夏です。
    card: *calc_out
  - text: 2つ目の物差しは、同じ位置の選手の平均。
    card: &pos_table
      type: table
      title: 位置ごとの平均の移籍金（百万ユーロ）
      columns: ['位置', 'ニューカッスル', '他の19クラブ', '倍率']
      rows:
      - ['フォワード 2人', '55.0', '27.9', '約1.97倍']
      - ['ミッドフィールダー 3人', '38.3', '41.9', '約0.92倍']
      - ['ディフェンダー 1人', '35.9', '24.9', '約1.44倍']
      - ['ゴールキーパー 2人', '26.1', '16.4', '約1.59倍']
  - text: プレミアの他の19クラブで、今夏に移籍金が動いた加入127人の平均です。
    card: *pos_table
  - text: フォワードの2人は、他のクラブの平均の約2倍です。
    card:
      <<: *pos_table
      highlight_row: 0
  - text: ミッドフィールダーの3人だけが、平均を下回りました。
    card:
      <<: *pos_table
      highlight_row: 1
  - text: 8人を同じ位置の平均で買った場合と比べると、約1.31倍を払っています。
    emph: true
    card: &calc_pos
      type: calc
      title: 買った8人は同じ位置の平均の何倍か
      terms:
      - ['3億1300万ユーロ', 実際に払った額]
      - ['2億3925万ユーロ', 位置の平均で買った場合]
      - [約1.31倍, 平均の何倍か]
      ops: ['÷', ＝]
  - text: 平均は、移籍金の数字が付いた加入だけで数えています。
    card: *pos_table
