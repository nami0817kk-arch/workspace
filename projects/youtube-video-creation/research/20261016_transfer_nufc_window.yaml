  question: 今夏のニューカッスルの移籍期間で、払った額と戻った額はどれだけ違い、その差し引きはなぜ小さかったのか
  lead: この夏、世界で4番目に多く払ったクラブ。
  takeaway: ニューカッスルが今夏に払った額は3億1300万ユーロで世界4番目だが、選手を売って戻った額が2億7910万ユーロあり、払った額の89%が戻った。差し引きは3390万ユーロ（およそ60億円）で、プレミアの20クラブでは14番目の大きさ。払ったのは8人で、フェルナンデス・パルドら上の3人で53%。戻った額の99%はトナーリ・ブルーノ・ギマランイス・ゴードンの3人で、売った3人は直前の推定の市場価値の約1.28倍、買った8人は約1.65倍だった。同じ位置の今夏の平均で買えば2億3925万ユーロで、実際はその約1.31倍。ブルーノの退団までに5人（51%）、窓が閉まる9月1日にフェルナンデス・パルド（19%）が加わった。出た3人は平均26.3歳、入った8人は平均21.4歳。夏の払った額も戻った額も、5年で今年がいちばん多い。ニューカッスルの発表文に額は書かれておらず、額はすべて報じられた移籍金の集計で、固定かボーナス込みかは公表されていない。冬の窓は2027年1月1日に開く
