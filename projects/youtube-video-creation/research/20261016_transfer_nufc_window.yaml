- id: late
  heading: 補強の額の半分は、ブルーノが出る前に決まっていた
  tier: 報道
  telop: ブルーノの退団の8月8日までに5人。窓が閉まる9月1日に、最後の1人
  narrator: 解説
  card: &when
    type: timeline
    title: クラブが発表した主な動き
    rows:
    - ['5月29日', ゴードンのバルセロナ行きを発表]
    - ['6月10日', 最初の補強。ジャウアンが加入]
    - ['7月6日', トナーリがトッテナムへ]
    - ['8月8日', ブルーノがアーセナルへ]
    - ['8月26日', ニコ・ゴンサレスが加入]
    - ['9月1日', フェルナンデス・パルドが加入。窓が閉まる]
    focus: 8月8日
  say:
  - text: ブルーノが出るのを待たずに、補強は進んだのか。日付で見ます。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: none
  - text: 選手を獲得できる期間を「窓」と呼びます。夏は6月15日から9月1日まで。
    card: *when
  - text: ニューカッスルの主な動きを、発表の日付順に並べます。
    card: *when
  - text: 動きの最初は5月29日。ゴードンのバルセロナ行きの発表です。
    card:
      <<: *when
      highlight_row: 0
  - text: 補強の最初は6月10日。ゴールキーパーのジャウアンです。
    card:
      <<: *when
      highlight_row: 1
  - text: 7月6日にトナーリ、8月8日にブルーノが、チームを離れました。
    card:
      <<: *when
      highlight_row: [2, 3]
  - text: ブルーノが出る8月8日までに、5人の補強が決まっていました。
    emph: true
    image: assets/images/20261016_transfer_nufc_window/b03_bruno_w.jpg
    card: &calc_before
      type: calc
      title: ブルーノの退団までに決まった補強は、払った額の何割か
      terms:
      - ['1億6110万ユーロ', 8月8日までの5人]
      - ['3億1300万ユーロ', 払った額]
      - [約51%, 退団より前の割合]
      ops: ['÷', ＝]
  - text: 人数では8人のうち5人、額にすると、払った額の51%です。
    card: *calc_before
  - text: 残る3人は、ブルーノが出たあとに決まりました。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card:
      <<: *when
      highlight_row: [4, 5]
  - text: 9月1日。最後の1人は、窓が閉まる日の発表でした。
    emph: true
    image: assets/images/20261016_transfer_nufc_window/b01_pardo_w.jpg
    card:
      <<: *when
      highlight_row: 5
  - text: フェルナンデス・パルド。払った額の19%にあたります。
    card:
      <<: *when
      highlight_row: 5
  - text: 強化の責任者（スポーティングディレクター）が、最後の1人について話します。
    image: assets/images/20261016_transfer_nufc_window/a01_stadium_w.jpg
    card: &doc_wilson
      type: document
      label: ニューカッスル 公式発表（9月1日）強化の責任者の談話（訳）
      paragraphs:
      - 5月には、彼が私たちの本命でした。私たちはずっと、接触を続けてきました。
      - 窓が終わるいま、彼は、刷新されたニューカッスルの8人目の補強になります。
      - この1件には、たくさんの時間をかけました。
      highlight:
      - 本命
      - 8人目
  - text: 責任者は、この選手を、5月から本命だったと話します。
    card:
      <<: *doc_wilson
  - text: 接触を続け、窓の終わりに8人目として加わった、という説明です。
    card:
      <<: *doc_wilson
  - text: 補強は、ブルーノの退団を待たずに進み、最後の1人は、5月から本命だった選手でした。
    card: none
