# 受賞: リール公式サイト 2026-10-15 14:02「Les supporters ont élu Ayase Ueda "Dogue du mois" de septembre by Kleber. Une première pour l'attaquant international japonais.」
#   → サポーター投票・クラブ発表＝確定。「上田にとって初めて」はクラブ文面。賞の通称は「Dogue du mois」（リールの愛称ドーグ）。協賛 Kleber は台本では言わない。
# 公式Xの投稿（losc.fr に埋め込み）: 「Vous avez élu Ayase Ueda Dogue du mois de septembre by Kleber. Félicitations Ayase」→ 台本の「みなさんが…選びました。おめでとう、綺世」はこの訳（絵文字・協賛名は省いた）。
#   フットボールチャンネルの日本語訳は「皆さんが選ぶ、9月の月間最優秀Dogueに上田綺世が選ばれました」で少し違う → 原文（フランス語）から訳した。
# 3ゴール（フランス語の一次側で確かめた。日付は現地）:
#   9/3 トゥールーズ0-1リール（リーグ・アン第3節）: 73分、途中出場の上田が頭で決勝点（Radarfoot・Le Petit Lillois。リールデビュー戦）。
#   9/8 リール2-3ベティス（CLリーグフェーズ第1節）: 12分、頭で先制（losc.fr の公式レポート）。チームは逆転負け。
#   9/20 ニース2-1リール（リーグ・アン）: 79分、左足で1点を返す（Le Petit Lillois。ニースが0-2とリードしていた）。リールはリーグ戦初黒星。
# 資料間のずれ: 「9月の公式戦4試合で3ゴール」（サッカーキング・FOOTBALL ZONE）／「リーグ3試合で2ゴール＋CLベティス戦1ゴール」（フットボールチャンネル）→ 合わせて4試合3ゴールで一致。台本は「3ゴール」だけ言い、4試合目は言わない（試合名を確かめていない）。
#   サッカーキングは「フェイエノールトで今季4試合3ゴール1アシスト」とも書くが、9月の数字と取り違えやすいので使わない。
# 数えたもの（自分で）: 上田が出たリール加入後の公式戦6試合（Le Petit Lillois「三つのゴール、六試合」と一致）のリールの成績。
#   ゴールのあった3試合＝1勝（トゥールーズ）2敗（ベティス・ニース）／ゴールの無かった3試合＝2勝（トロワ9/13 2-0・ル・アーヴル10/10 1-0）1敗（アーセナル10/13 0-3）。
#   出場は losc.fr の各試合レポートの先発・交代で確認（トロワ戦は先発71分交代、ル・アーヴル戦は56分に途中出場、アーセナル戦は先発78分交代）。
#   ル・アーヴル戦の日付は losc.fr の記事URL（2026-10-10）。台本では日付を言わない。
# 本人のコメント: 受賞についての上田本人の言葉はどの記事にも無かった → 入れない。
# 2026-10-16 流れの点検の反映：比べを9月の4試合（トゥールーズ・ベティス・トロワ・ニース）に絞った。ル・アーヴル（10/10）・アーセナル（10/13）は10月なので外した。各ゴールの試合の結果（1-0勝・2-3負・1-2負）を@mainと3ゴールの節に入れた。
# 反応（ネット民）: 取れなかった。当たった先＝サッカーキング・FOOTBALL ZONE・フットボールチャンネルの記事、リール公式サイト、
#   「上田綺世 月間MVP 反応」の検索（5ch系まとめ・サカラボ・fever-antenna）。この受賞についての書き込みはまだ見つからなかった（検索に出るのは2025年のフェイエノールト時代のまとめのみ）。
