title: 11月18日のショート題材（Claude選）
lead: 昨夜の日本代表×パラグアイ（森保監督の最終戦、0-2の黒星）の試合後の言葉を中心に、日本人6本・海外4本を選びました。
note: 確認なしの運用（11/4〜）のため、Claude が選んだ結果です。日本人の題は 9〜17時の枠、海外は18時以降の枠。ヒットの条件（代表・W杯／本人の言葉）は各行に書きました。外した題：ルーニーの告白（心の健康の話で、動画向きでない）・スペインの連勝が止まった件（11/16に扱い済み）・UEFAのディアロ推薦（11/17のクロップ回の続報）・J・高校選手権・女子。
