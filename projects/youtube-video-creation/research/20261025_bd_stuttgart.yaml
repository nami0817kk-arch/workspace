- id: rise
  heading: 勝ち点33から73へ。1年で何が起きたのか
  tier: 背景
  telop: 2023年4月に監督交代。26試合で勝ち点20、残り8試合で13
  narrator: 解説
  card:
    type: table
    title: 2022-23から2023-24のリーグ戦
    columns: &id001
    - ''
    - ''
    rows:
    - - 2022-23 第26節まで
      - 26試合で勝ち点20
    - - 2022-23 残り8試合
      - 8試合で勝ち点13
  say:
  - 2023年4月3日、シュツットガルトは監督を代えます。
  - 来たのは、セバスティアン・ヘーネスでした。
  - それまでの26試合は勝ち点**20**。残りの8試合で13、合わせて**33**でした。
  - 16位で、2部の3位ハンブルクとの入れ替え戦へ。
  - text: 合計6対1で勝ち、1部に残ります。
    card:
      type: table
      title: 2022-23から2023-24のリーグ戦
      columns: *id001
      rows:
      - - 入れ替え戦
        - ハンブルガーSVに合計6対1
      - - 2023-24
        - 34試合で勝ち点73、2位
  - 翌シーズンは34試合で**23勝**。勝ち点**73**で、2位に入りました。
  - 前のシーズンから、勝ち点40の上積みです。
  - text: 点を取ったのはギラシ。リーグ戦**28得点**で、クラブの1シーズンの記録を作りました。
    image: assets/images/bd_stuttgart_guirassy/scene.jpg
  - 失点は、前のシーズンの57から**39**に減っています。
  sources:
  - https://en.wikipedia.org/wiki/2022%E2%80%9323_VfB_Stuttgart_season
  - https://en.wikipedia.org/wiki/2022%E2%80%9323_Bundesliga
  - https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/teams/134/schedule?season=2022
  - https://site.api.espn.com/apis/v2/sports/soccer/ger.1/standings?season=2023
  - https://en.wikipedia.org/wiki/Serhou_Guirassy
  bg: assets/backgrounds/stadium_シュツットガルト_in.png
  official: false
