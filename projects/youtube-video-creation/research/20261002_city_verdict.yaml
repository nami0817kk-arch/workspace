  question: シティのスポンサー料は誰が払っていて、罰はどこまで重くなるのか
  takeaway: これまでの勝ち点剥奪は、2023-24季のエヴァートンが1950万ポンドの超過で10から上訴で6、別の超過で2の計8。3450万ポンド超えたフォレストが4。シティがスポンサー料に見せかけた8億3000万ポンド余りは、物差しは違うがエヴァートンの最初の超過額の40倍を超え、罰の決まった表も無い。今季からの規則どおりなら上訴の結論は1月末までに出るが、そのときシーズンは半分を過ぎている。5戦全勝で首位を走る今季のうちに罰が決まるかどうかが、罰の重さと同じくらい、ほかの19クラブの順位を左右する
