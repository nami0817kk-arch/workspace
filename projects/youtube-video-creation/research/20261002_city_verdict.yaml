  title: マンC、すべての告発で有罪。スポンサー料を本当に出していたのは
  question: シティのスポンサー料は誰が払っていて、罰はどこまで重くなるのか
  takeaway: これまでの勝ち点剥奪は、上限を1950万ポンド超えたエヴァートンの6、3450万ポンド超えたフォレストの4。シティがスポンサー料に見せかけた8億3000万ポンド余りはその40倍を超え、プレミアには比べられる前例が無い。他クラブは2部に1季落とすだけでは足りないと言うが、上訴の結論は1月末の見込みで、そのときシーズンは半分を過ぎている。5戦全勝で首位を走る今季のうちに罰が決まるかどうかが、罰の重さと同じくらい、ほかの19クラブの順位を左右する
