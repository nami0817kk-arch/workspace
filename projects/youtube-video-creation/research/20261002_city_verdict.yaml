# 重ならないように: 10/1 公開の「グアルディオラの手紙」の中身は入れない（0行）。翌日のハーランド紹介があるのでハーランドの話も入れない。
#   9/30 の city_titles（判決前の「優勝が取り消されたら」）は使わない。
# 事実の裏（10/1 精査後）:
#   認定: プレミアリーグ公式（9/29）と、委員会の判断の黒塗り版（Core Decision、PL 公式が公開した PDF）。
#     対象 2009-10〜2017-18 の9季。告発は「100を超える個々の違反」を4つの大きな告発（1〜4）にまとめたもの。
#     財務の告発（1 正確な財務情報〈監督・選手の報酬の隠しを含む〉、2 UEFA の規則、3 PSR）はすべて有罪。
#     4 調査への非協力は 4(A)〜(D) のうち 4(B) だけ不成立＝4つのうち3つ（PL 公式の文言 "three of the four alleged breaches were upheld"）。
#     → 旧版の「すべての告発で有罪」は誤り（非協力の1つは不成立）。タイトル・サムネ1行目・節見出しを「財務の告発すべて有罪」に直した。
#     罰は同じ独立委員会が別の非公開の審理で決める。上訴の期限は 10月2日（金）（PL 公式）。
#   スポンサー料: 委員会の判断 72項 £949.94m／£119.25m／£830.69m（Sky の数字と一致）。優勝3季は判断の脚注8の季ごとの表から
#     2011/12・2013/14・2017/18 の合計 £359.98m／£43.0m（BBC の £360m／£43m と一致）。PL の「£900m 超」は言わない。
#   上訴: 9/29 にクラブが声明で "pursue the appeal avenues"、ソリアーノが職員向け動画で "Our lawyers will now file an appeal"。
#     **10/1 16時半（日本時間）の時点で提出は確かめられない**ので「表明」まで。
#     新しい3人の委員会（PL 公式）。今季からの規則で期限から12週＋30日 → 1月末まで（Guardian）。BBC は当てはまるか不明と書く → 声で「当てはまるかはまだはっきりしない」。
#   前例: エヴァートン 2023-24 は £19.5m 超過で 10→上訴で6（PL 公式 2023-11-17・2024-02-26）、同じ季に £16.6m 超過で さらに2（PL 公式 2024-04-08、上訴取り下げ）＝季で計8。
#     フォレスト 2023-24 に £34.5m 超過（上限 £61m）で 4（Guardian 2024、PL の上訴判断 PDF）。
#     「40倍を超える」は 830.69 ÷ 19.5 = 42.6。エヴァートンの「最初の超過額」と、シティの「スポンサー料に見せかけた額」で物差しが違うので、何と何を比べたかを声で言う。
#     シティ自身の PSR の超過額は判断に数字が無い（"by a very substantial amount" だけ）ので言わない。
#     罰の決まった表は無い（Sky）、委員会に広い裁量（PL 公式 "broad discretion"）。旧版の「規則に罰の上限は無く」「比べられる前例はありません」は言い方を直した／外した。
#     ユヴェントス 2006 は尺のため外した（財務の件でもない）。
#   今季: 5戦全勝・勝ち点15で首位、2位アーセナル12、3位ブライトン10（BBC の順位表 10/1 に再取得、research/standings/2026-09-28.json と一致）。
#     1月末までにシティのリーグ戦は 22〜23試合（BBC の日程）＝半分を過ぎる。
#   発言: マスターズ（PL 公式）、ソリアーノ（Guardian、職員向け動画。尺のため語りでまとめた）。
#     ポチェッティーノ（BBC 9/29。Yahoo 転載で原文を確認）とバーンスタイン（BBC 9/29）は、尺を3分半に収めるため節ごと外した（原文は raw に残した）。
# 反応: 海外1件（Bluesky）・日本1件（X、Yahoo!リアルタイム検索）。全文。@ATM_jpn は尺のため外した（raw に控え）。
# 写真: 記事の写真は BBC＝Getty、Guardian＝PA/Reuters/Getty/Alamy、Al Jazeera＝Reuters/AP、Sky＝クレジット無しで使わない。
#   エティハド・スタジアムの空撮（Commons、Arne Müseler、CC BY-SA 3.0 de）を 16:9 に切った _w。ポチェッティーノの並べ写真は節を外したので使わない。
#   ソリアーノは portrait が同名の彫刻家を取ってきたので捨てた（本人の自由な写真は無い）。
# サムネ: 1人が主役の回ではないのでエンブレム主役（crest_main）。伏せるのは「スポンサー料の9割近くはオーナーの金」（830.69÷949.94＝87.4%）。
