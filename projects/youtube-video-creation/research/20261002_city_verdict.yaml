# 取材メモ（10/2 公開、プレミアの題材）。key = city_verdict。型は news。材料の控え: research/raw/20261002_city_verdict.md
# ユーザー指示「シティの有罪の件にしたい」。9/29 の正式な認定と、その後（9/30〜10/1）の動き。
# 重ならないように: 10/1 公開の「グアルディオラの手紙」の中身は入れない（0行）。翌日のハーランド紹介があるのでハーランドの話も入れない。
#   9/30 の city_titles（判決前の「優勝が取り消されたら」）は使わない。前例のユヴェントスだけ、正式発表後の比べ方で使い直した。
# 事実の裏:
#   認定: プレミアリーグ公式（9/29）。対象 2009-10〜2017-18 の9季。財務規則の重大な違反の告発はすべて有罪（非協力は4つのうち3つ）。
#     罰は同じ独立委員会が別の非公開の審理で決める。上訴の期限は 10月2日（金）。告発の件数は報道で割れるので言わない。
#   スポンサー料の内訳は Sky が報告書から（£949.94m／£119.25m／£830.69m）。優勝3季の £360m／£43m は BBC。PL の「£900m 超」は言わない。
#   上訴: 9/29 にクラブが「上訴の道を進む」と表明。**10/1 15時（日本時間）の時点で提出は確かめられない**ので「表明」まで。
#     新しい3人の委員会。今季からの規則で期限から12週＋30日 → 1月末ごろ（Guardian）。シティが規則の当てはめを争う余地があるので「見込み」。
#   前例: エヴァートン £19.5m 超過で 10→6（PL 公式・Guardian）、フォレスト £34.5m 超過で 4（Guardian 2024）、
#     ユヴェントス 2006 は Serie B 降格・優勝2つ（2004-05 取り消し、2005-06 は最下位扱い）（英語版Wikipedia Calciopoli）。
#     「40倍を超える」は 830.69 ÷ 19.5 = 42.6。物差しが違うので、何と何を比べたかを声で言う。
#   今季: 5戦全勝・勝ち点15で首位、2位アーセナル12、3位ブライトン10（research/standings/2026-09-28.json、BBC 9/30）。
#   発言: マスターズ（PL 公式）、ソリアーノ（Guardian、職員向け動画）、ポチェッティーノ（The Athletic の取材を Football Today・City Xtra が引用）、
#     バーンスタイン（BBC 9/29。10/1 の回で引いた「役員は退くべき」とは別の発言）。
# 反応: 海外1件（Bluesky）・日本2件（X、Yahoo!リアルタイム検索）。全文。出どころと外したものは raw に控えた。
# 写真: 記事の写真は BBC＝Getty、Guardian＝PA/Reuters/Getty/Alamy、Al Jazeera＝Reuters/AP、Sky＝クレジット無しで使わない。
#   エティハド・スタジアムの空撮（Commons、Arne Müseler、CC BY-SA 3.0 de）を 16:9 に切った _w。ポチェッティーノは Commons（2025年、CC BY 4.0）を左、スタジアムを右に並べた1枚。
#   ソリアーノは portrait が同名の彫刻家を取ってきたので捨てた（本人の自由な写真は無い）。バーンスタインも写真なし。
# サムネ: 1人が主役の回ではないのでエンブレム主役（crest_main）。伏せるのは「スポンサー料の9割近くはオーナーの金」。
