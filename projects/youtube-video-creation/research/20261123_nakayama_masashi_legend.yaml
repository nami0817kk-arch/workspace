# 中山雅史（元日本代表 FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-23。型は 11/21 の福西崇史と同じ6節（「あの1年」＝1998年、「見立て」＝J1の点が集まった年）。
# **情報の時点は 2026-11-13。**年齢は出さない。いまの仕事（コーチ・監督）は言わない。私生活・法的な問題・女子サッカーは入れない。
# 題材を選んだ理由：引退した日本人の大物。J1年間36点・日本代表のW杯初ゴール。既出の国内レジェンドに無い（posted.json・covered.yaml・scripts/・picks で確認）。
# 数字の出どころ：日本語版 Wikipedia「中山雅史」（J1年別の表・代表年別の表。WebFetch の抽出で読んだもので原ページと一字ずつは突き合わせていない）。
# - J1年別 試合-得点：94 12-3、95 45-18、96 27-9、97 27-18、98 27-36、99 23-6、00 29-20、01 30-16、02 29-16、03 12-3、04 19-3、05 29-6、06 13-1、07 15-1、08 16-1、09 1-0、12(札幌) 1-0。足すと 355試合157点（表の通算と一致）。1998年以外＝328試合121点（自分で引いた）。
# - 代表 53試合21得点。年別を足して 53-21 と一致。1998年W杯ジャマイカ戦（6/26 リヨン、1対2）の得点は日本のW杯初ゴール（日本語版・英語版）。
# - 1998年36点・27試合・4試合連続ハットトリック（ギネス）：英語版（4/15〜29、4試合で16点）＋フットボールチャンネル（2022-01-15）で一致。MVP・得点王（1998・2000）・ベストイレブン（97・98・00・02）は日本語版・英語版で一致。
# - 2000年2月16日アジアカップ予選ブルネイ戦で3分3秒のハットトリック（英語版のみ。日本語版では確かめていない）。2000年の代表は7試合6点（日本語版の表）。
# - 引退：2012年12月4日に発表、最後のJ1は2012-11-24 横浜FM戦の途中出場（日本語版）。その後2015年に沼津で選手登録（0試合）。**2021年1月に沼津の選手登録を離れる（デイリー・Goal の見出しから。英語版は「2020年1月に引退」と書くが、53歳と合わず台本では年を言わない）。**
# - 「36点はいまも破られていない」は2022年のフットボールチャンネルの記述。2026年時点は確かめていない。台本は「J1の1年の最多」と言い切らず、1998年の事実だけを述べる。
