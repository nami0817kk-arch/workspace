  - id: words
    heading: 本人が言っていること
    main: true
    tier: 報道
    telop: 「もう一度、自分をリセットする必要がある」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 契約の日付ではなく、**本人がなぜ迷っているか**が芯
    card:
      type: quote
      title: スカローニ
      text: これほど大きなことが、またできるのか分からない
    say:
      - では、本人は何と言っているのか。
      - {voice: スカローニ, text: 考える必要を感じています}
      - {voice: スカローニ, text: これほど大きなことが、またできるのかどうか、もう分からないからです}
      - {voice: スカローニ, text: 続けるには、たくさんのことが必要です}
      - {voice: スカローニ, text: なにより、もう一度自分をリセットすることが}
      - 2026年の予定は最後まで務める。そのあとは「それで終わり」とも話しています。
      - 契約を全うして更新しない、と決めたという報道もあります。
      - ただし本人も連盟も、それを認めてはいません。
    official: false
    sources:
