    say:
      - リオネル・スカローニの契約が、今年の12月30日で切れます。残りは3か月半です。
      - そして、いったんは先が決まっていました。アルゼンチンのインフォバエはこう書いています。
      - {voice: インフォバエ, text: 2030年までの更新で、口約束の合意ができていた}
    official: false
