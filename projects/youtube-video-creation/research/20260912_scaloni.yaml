      - https://www.footmercato.net/a89112979108535397-argentine-cest-deja-le-bazar-apres-le-depart-de-lionel-messi

  - id: now
    heading: 交渉はいま、どうなっているか
    tier: 報道
    telop: 会長と代理人の面談が残っている
    narrator: キャスター
    say:
      - 交渉の状態については、こう書かれています。
      - {voice: インフォバエ, text: 懸念の領域に入っている。4日前までは楽観があったのに、空気が変わった}
      - 連盟はタピア会長と、スカローニの代理人マティアス・アルダオとの面談に望みをつないでいます。
      - 記事は、ひとつの兆しを挙げています。
      - スカローニの就任8年の節目に、タピア会長がSNSで何も出さなかった。
      - これが交渉の難しさの表れだと受け取られた、という書き方です。
      - もうひとつ、コーチ陣のワルテル・サムエルが、監督業を始めるために離れる可能性も出ています。
    official: false
    sources:
