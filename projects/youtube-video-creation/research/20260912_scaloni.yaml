# スカローニの契約が12月で切れる（2026年9月12日）
#
# **ボーナスの話は入れない**（2026-09-12 ユーザー指示）。
# **会長の資金洗浄の告発にも触れない。**人物への告発で、こちらで裏を取れない。
# 扱うのは**契約の話だけ**。
#
# 引きは**「口約束では2030年まで決まっていた」**。切れる話より、
# **いったん固まっていたものが動いた**ところが芯。ここが山場（@main）。
#
# **本人の言葉が取れた**（インフォバエ 9/9）。ここが軸になる。
# 「更新しない」と決めたという報道はあるが、**本人も連盟も認めていない**ので
# 「決まった」とは書かない。
#
# **タピア会長がSNSに何も出さなかった**という話は、記事が
# 「交渉難航の兆しと解釈された」と書いている。**解釈だと明記して引く。**
# こちらで「冷えている」と断定しない
format: news
# **人の発言は取れたが、多くはない回。**その分だけ下げる
