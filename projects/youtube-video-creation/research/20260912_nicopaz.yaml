# ニコ・パスがコモに残った理由を語った（2026年9月12日）
#
# Sky Sport Italia の取材をフットボール・イタリアが引いたもの。
# コモが 4-1 でライプツィヒに勝った直後（9月10日）。
#
# 引きは**「なぜ残ったのか」**。勝った話より、
# **本人が残留の理由を言い切ったこと**のほうが中身がある。ここが山場（@main）。
#
# **9/11 にコモの回を1本出している。**あれはファブレガスが
# 22歳と23歳の名前を挙げた話だった。**今回は本人の言葉が芯。**
#
# **レアルの買い戻し条項は「去年の夏から引き上げられている」までしか書かない。**
# 金額は記事に無い。こちらで数字を足さない。
#
# **マンマークしていた相手（27番）の名前は書かない。**記事に無い。
# 反応は入れない
