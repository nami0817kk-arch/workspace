  - id: view
    viewpoint: true
    heading: 9連勝の中身を数える
    tier: 背景
    telop: 9試合で39得点。レアルは9連勝で21得点
    say:
      - ヤマルの先制ゴールで始まった勝利で、バルセロナは開幕9連勝。クラブ史上初です。
      - レアル・マドリードが1968年から69年に作った、リーグの記録に並びました。
      - 見立てです。連勝の数は同じでも、中身が違います。
      - 9試合の得点は、バルセロナが39点。
      - クラブ公式によると、レアルは9連勝で21点でした。
      - 次は20日、パリ・サンジェルマン戦。
      - そして25日、相手はレアル・マドリード。クラシコです。
      - 勝てば、リーグ史上初の開幕10連勝になります。
    official: false
    sources:
