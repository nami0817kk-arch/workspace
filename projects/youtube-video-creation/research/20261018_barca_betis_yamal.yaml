sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 確定
    telop: ベティス2対5バルセロナ。10分にヤマルが先制
    say:
      - 17日のラ・リーガ第9節。バルセロナは、アウェーでベティスに5対2で勝ちました。
      - 10分、ヤマルがエリアの手前から左足を振り抜き、先制ゴールを決めました。
      - ベティスは前半のうちに追いつきますが、ロドリのヘディングで勝ち越し。
      - 後半は、ヤマルの折り返しからジェズスが決めました。
      - その後、ベティスのベルナルがヤマルに頭突きをして、退場になります。
      - バルセロナは、さらに2点を加えました。
    official: true
    sources:
      - https://www.fcbarcelona.com/en/football/first-team/news/4593638/betis-2-5-fc-barcelona-the-dream-start-continues
      - https://www.footballchannel.jp/2026/10/18/post1036356/
      - https://www.footballchannel.jp/2026/10/18/post1036461/

  - id: flick
    heading: フリック監督のヤマル評
    tier: 報道
    telop: フリック監督「いま世界でいちばんの選手」
    say:
      - ヤマルへの言葉です。
      - voice: ハンジ・フリック監督
        text: 先制点のゴールは、信じられないものでした。
      - voice: ハンジ・フリック監督
        text: 私にとっては、いま世界でいちばんの選手です。
        cont: true
    official: false
    sources:
