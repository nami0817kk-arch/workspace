# 取材: 2026-10-18。requests（ブラウザUA）で原文を読んだ。控えは research/raw/20261018_barca_*・flick_as・bernal_*・yamal_sakarabo。
#   ・FC Barcelona 公式（英語）「Betis 2-5 FC Barcelona: the dream start continues」「FC Barcelona equal record for best league start」— 全文読んだ。
#       試合の流れ・「全11試合に勝った」・レアル1968/69の「9戦9勝」・「39得点9失点」「レアルは21得点」（確定に近い一次。公式の記述）。
#   ・フットボールチャンネル 2026.10.18 05:20（題材の出典）— 全文読んだ。スペイン紙 Mundo Deportivo を引いてクラブ史上初の開幕9連勝・レアル（1968/69）の記録に並んだと伝える。
#   ・フットボールチャンネル 2026.10.18 08:15（ヤマルのゴールの描写）、サッカーキング（試合の描写）、ゲキサカ — 読んだ。
#   ・Marca「El Barça iguala el récord del Madrid」— 全文読んだ。1968-69のレアル（ミゲル・ムニョス監督）が9連勝のあと10節目に0-0（ポンテベドラ戦）。クラシコは25日（日）。
#   ・AS「Flick: “Lamine es ahora mismo el mejor jugador del mundo”」— 全文読んだ。DAZN LaLiga の試合直後の取材と記者会見の発言。
#   ・Marca「Facundo Bernal pide disculpas por su expulsión」— 全文読んだ。審判の報告書の文言と、ベルナル本人のSNSの謝罪の全文（スペイン語）。A Bola も同じ投稿を伝える。
#   ・ESPN の記事（Yamal 'Best in the world'）は開けなかった（bot 判定）。使っていない。
# 資料のずれ（台本では言わないか、ぼかした）:
#   ・時間：FC公式＝ベティスの同点は28分・ジェズスは53分前後／フットボールチャンネル・サッカーキング＝27分・51分（ジェズス。ヤマルのクロスのオフサイドを挟む）／エリック・ガルシア 62分 or 63分。
#     → 台本は10分（ヤマル）と80分前後（オルモ）だけ時間を言わず、「前半に1点ずつ」「後半」でぼかす。ヤマルの10分は全部一致。
#   ・ベルナルの退場：Marca は「54分」（審判の報告書）。台本は時間を言わず「後半の早いうち」。頭突きの回数は報告書で「2回」だが、台本では「頭突き」とだけ言う。
#   ・ヤマルのアシスト：ジェズスの3点目は FC公式・サッカーキングとも ヤマルの折り返しとして伝える。62分のゴールもセットプレー（ヤマルのFK）が起点（FC公式）。台本は「ジェズスの得点を折り返しで演出」だけ言う。
# 確度: 試合結果・得点者・連勝の数字は クラブ公式サイトの記述まで辿れた（確定）。Mundo Deportivo 経由の「クラブ史上初」は報道。フリックの発言は AS（報道）。ベルナルの謝罪は本人のSNS投稿をMarcaが全文で引いている（報道）。見立ては 背景。
# 数えた比べ（見立て）: レアルは1968/69の開幕9連勝で21得点（FC公式）。バルセロナは9試合で39得点・9失点（FC公式）。39÷21≒1.9倍。連勝の数は同じ。
#   次は20日 UEFAチャンピオンズリーグ PSG戦、25日 クラシコ（リーグ戦）。クラシコに勝てば 開幕10連勝（リーグ史上初）。
# 昨日（10/17）の flick_yamal_minutes（会見・出場時間）とは別の話（今回は試合そのもの）。数字（14得点・10連勝）は使わない。
