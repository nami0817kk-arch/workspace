    tier: 報道
    telop: ベルナル本人がSNSで謝罪
    say:
      - 退場になったベルナルは、試合のあと、自分の投稿で謝りました。
      - voice: ベルナル
        text: 普段は、こんなふうに反応しません。
      - voice: ベルナル
        text: あの場面では、自分を抑えるべきでした。
        cont: true
    official: false
