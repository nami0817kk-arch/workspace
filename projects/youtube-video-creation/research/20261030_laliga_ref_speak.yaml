# 取材メモ（2026年10月30日）ラ・リーガ、今節から審判が試合後に話す（ショートだけ・見せ方 X＝冒頭に強い一言）
# 取材: 2026-10-30。題材の元は 20261030_topics_src.yaml の 18（candidates[88]）。「対象の試合・方法・リーグの発表かを本文で確かめる」が条件。
#   マルカ「Los árbitros hablarán después de los partidos desde esta jornada」（marca.com/…/2026/10/29/arbitros-hablaran-despues-partidos-jornada.html、
#     29日23:19 CET。requests で本文を全部読んだ。本文は4段落と短い）:
#     ・今季の中継で、審判が試合の前にインタビューを受けるのは初めて（審判委員会 CTA が進め、権利を持つ局の記者が担当）。
#     ・ラ・リーガと CTA は、試合前に加えて試合後にも審判の声を聞けるようにする。「スペインサッカー史上初」。今週末から、「少なくとも2人」の審判。
#     ・DAZN が伝えたところでは、その1試合は日曜21時（サン・マメス）のアスレティック対レアル・ソシエダ。試合後は主審が話す。
#   AS「Los árbitros de LaLiga hablarán después de los partidos」（as.com/futbol/primera/…f202610-n/、29日23:50。requests で本文を全部読んだ）:
#     ・第11節（今週末）から。DAZN が確認した。対象は「放映権を持つ局」だけ。「試合終了の笛のあとに、1節につき審判1人だけ」。第11節はアスレティック対レアル・ソシエダの審判。
#     ・7月初めに、審判協会（AESAF）・ラ・リーガ・連盟が、1部・2部の審判が透明性を上げ、中継を良くすることで合意。見返りは「視聴覚ボーナス」。
#     ・今季の開幕から、審判は試合前の取材に出ている。マルティネス・ムヌエラはクラシコの前に DAZN に話し、報道の騒音から自分を切り離そうとしていると語った（記事の言い換え。原文の発言ではないので引用にしない）。
#     ・ラ・リーガは審判全体に50万ユーロの「ボーナスの枠」（bolsa）を出す。条件は2つ：「スペインサッカーの映像商品の価値を高めること」「審判の良い印象を守り育てること」（引用符つきの条件を自訳）。
#     ・すでに VAR 担当審判の公開と、毎週の番組（議論の判定を分析し、ミスを認めることもある）をやっている。近く審判の「インサイド」ドキュメンタリーの放送が見込まれている。
#   対象の試合・方法・リーグの発表か（確かめた結果）：
#     ・対象の試合＝アスレティック対レアル・ソシエダ（日曜 11月1日 現地21時、サン・マメス。第11節）。2紙で一致。
#     ・方法＝放映権を持つ局が、試合終了後に審判（主審）へ取材する。
#     ・リーグの発表か＝本文は「ラ・リーガと CTA が進める」と書くが、ラ・リーガ自身の発表文は引いていない。確認したのは DAZN（2紙とも）。→ 確度は「報道」。確定とは言わない。
#     ・2紙の食い違い：話す審判の数（マルカ「少なくとも2人」／AS「1節に1人だけ」）。台本では数を断定せず、食い違いを言う。
# 言わないこと: 審判の名前を「話す人」として挙げること（主審はまだ発表されていない。マルカの写真の人物＝ムヌエラ・モンテーロは記事で話すとは書かれていない）、
#   質問の中身・どこまで答えるか（本文に無い）、判定への影響の断定、他国リーグとの比較（読んでいない）、ボーナスの1人あたりの額（枠の総額のみ）、
#   日曜の試合の結果（未開催。結果が出る前の内容）。
# 重ならない確認: research/posted.json・covered.yaml・scripts/20261024〜20261029_* を「審判・主審・ホイッスル・ラ・リーガの審判」で grep。10/29 以前に審判の発言の題は無い（VAR 絡みの古い題だけ）。
# 本人の言葉: 無い → 型は X。
# 確度: 日程・対象の試合は報道（2紙一致）。ボーナスの額・条件は報道（AS）。人数は報道だが食い違う。見立てと「4つ目」の数え方は自分で数えたもの（背景）。
