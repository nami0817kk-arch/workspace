# カカ（元ブラジル代表MF）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-25。型は 10/24 のマルディーニと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Kaká の成績表・Honours・各大会ページ）・Reuters（2007-12-17、web.archive.org で本文確認）・globoesporte（2017-12-17 引退）・Guardian/Reuters（2017-12-17）・ESPN Deportes（2025-05-19）と、自分で足した値だけ。
# **私生活・宗教・法的な問題は入れない**（18歳のプールの事故と脊椎の骨折、信仰の話、家族、人道活動の話は入れない。Reuters の受賞の言葉も、聖書に触れる後半は使わず「夢」の前半だけ）。女子サッカーは入れない。
#
# **重なりの確認（10/25）**：scripts/・research/covered.yaml・research/posted.json を「kaka／カカ」で grep。カカが主役の回は無し（20261016_record_transfer_fee と 20261022_manager_ancelotti の本文に名前が出るだけ）。
# **引退の確認（一次情報に近いもの）**：globoesporte 2017-12-17「Kaká anuncia aposentadoria」（TV Globo の番組で本人が発表。「A minha palavra final é que o ciclo da minha carreira como jogador profissional se encerra aqui.」を requests で本文確認）＋ Guardian（Reuters 配信）2017-12-17「Kaká retires from football at age of 35」。最後の公式戦は 2017-10-15 のオーランド対コロンバス（0対1、英語版 Wikipedia）。→ **現役ではない（44歳）**。
# **いまの立場**：2025-05-19 の ESPN Deportes（Cazé TV のインタビューの紹介）で本人が「チームが私が助けになると思うなら、準備はできている」「2017年にやめてから準備してきた」と話し、ハーバードのスポーツビジネスの講座と CBF の指導者講習を受けたと説明。**アンチェロッティのスタッフ入りは報道止まりで、CBF・本人の発表は見つからない**（ポルトガル語の検索でも「正式な招待は無かった」と本人が答えた記事のみ）。2026年に企業の広告大使の報道（Boticário・BTG Pactual）はあるが、サッカーの役職ではないので入れない。台本は「2025年5月に準備はできていると話した→いまの役職は2026年10月の時点で確かめられていない」と言う。
# **日本との接点（台本の「日本」節）**：
#   - 2002年W杯：優勝メンバー。決勝は 2002-06-30 横浜国際総合競技場（2002 FIFA World Cup Final の記事）。**カカの出場は 6/13 韓国・水原のコスタリカ戦の25分のみ**（Kaká の記事。Group C の記事で会場＝Suwon を確認）。決勝は出ていないので「優勝メンバー」「決勝の舞台は横浜」とだけ言う。
#   - 2003-12-14 横浜：トヨタ杯（インターコンチネンタルカップ）ミラン対ボカ 1対1、PK戦で敗戦。カカは先発・77分交代（2003 Intercontinental Cup の記事のメンバー表）。
#   - 2007-12 クラブW杯（日本開催）：準決勝 12/13 横浜 浦和に1対0（得点はセードルフ）、決勝 12/16 横浜 ボカに4対2、カカは61分に得点。大会のゴールデンボール（2007 FIFA Club World Cup の記事）。出場は成績表の 2007-08 の「Other」（CWC 2試合1得点）。
#   - 2012-10-16 ポーランド・ヴロツワフの親善試合 日本0対4ブラジル。カカは4点目（Kaká の記事の代表ゴール一覧の29番目＝最後。年別の表でも2013年以降0点）。**確度は報道（JFA の試合記録は未確認）**。
#   - 日本で出た試合は3つ（2003年1・2007年2）。自分で数えた値。台本では数を言わない（W杯決勝は出ていないため、言うと混ざる）。
# **数字の出どころと自分で足した値**
# - 通算：英語版 Wikipedia の成績表。クラブ 654試合208点（サンパウロ 125/47＋期限付き 24/3、ミラン 270/95＋37/9、レアル 120/29、オーランド 78/25）。**季ごとの行を自分で足して 654・208 と一致を確認**。代表 92試合29点（年別の表を足して一致）。合計 746試合237点（自分で足した値）。サムネの表：ミラン 307/104、レアル 120/29、ほか2クラブ（サンパウロ149/50＋オーランド78/25）227/75、代表 92/29、合計 746/237。
# - 2007年バロンドール：2007-12-02 パリで発表、カカ 444点・C.ロナウド 277点・メッシ 255点（2007 Ballon d'Or の記事）。差の167点は自分で引いた値。「このあと10年はメッシとロナウドだけ」＝記事の「2018年にモドリッチが10年の独占を終わらせた」。
# - FIFA年間最優秀選手 2007：カカ 1047票・メッシ 504票・ロナウド 426票（Reuters 2007-12-17。本文に「他の2人の合計より多い」）。504＋426＝930 は自分で足した値。ペレの言葉「He's the complete player.」も同じ記事。カカの言葉「When I was young I dreamed of playing for Sao Paulo and playing just one game for the national team. That was it」も同じ記事（続く聖書の一文は使わない）。
# - 移籍金：ミランへ約850万ユーロ（記事は「reported €8.5 million」＝報道）、レアルへ 6700万ユーロ（2009-06-08 に両クラブが確認、と Wikipedia）。
# - 2006-07 CL：準決勝 第1戦 2007-04-24 オールド・トラッフォード ユナイテッド3対2ミラン（ロナウド5分、カカ22分・37分、ルーニー59分・90+1分）、第2戦 05-02 サン・シーロ ミラン3対0（カカ11分、セードルフ30分、ジラルディーノ78分）、合計5対3（2006–07 UEFA Champions League knockout stage の記事）。決勝 2対1 でカカは2点目をアシスト（Kaká の記事）。大会得点王10点（同）。
# - 見立て：ミラン（2003-04〜2008-09、6季）270試合95点、1季平均45.0試合、95÷270＝0.352（約2.8試合に1点）／レアル（2009-10〜2012-13、4季）120試合29点、平均30.0試合、約4.1試合に1点。**全部自分で割った値**。レアルの 2010-08-05 の左ひざの手術（クラブ発表、と Wikipedia）、2011-01-03 ヘタフェ戦で復帰、2011-12 ラ・リーガで9アシスト（Wikipedia）。
# - 2006-09-03 ロンドン（エミレーツ）のアルゼンチン戦 3対0 の3点目。途中出場、自陣からメッシを振り切って運んだ。本人が「最高のゴール」と見ている（BBC 2018 の記事、と Wikipedia）。**確度は報道**。
# - 2009-01 マンチェスター・シティの1億ポンド超の申し出（BBC 2009-01-13、と Wikipedia）→ 1/19 にミラン側がシティの撤退を発表。**確度は報道**。台本ではミランの会長の名前は出さない。
# - オーランド：MLS デビュー 2015-03-08 ニューヨーク・シティ戦でFKの同点弾、リーグ戦 75試合24点（Wikipedia）。
# **入れなかったもの**：私生活（家族・結婚・信仰・プールの事故）、2010年W杯の退場、広告大使、ミランの会長の名前、Time 100、SNS の人数。
# **日本語名・読みで怪しいもの**：カカ・ガマ・サンパウロ・インザーギ・セードルフ・ジラルディーノ・ルーニー・オールド・トラッフォード・サン・シーロ・ヴロツワフ・ボカ・オーランド・シティ・コロンバス・ヘタフェ・ペレ（audio_query で見る）。
