    main: true
    tier: 報道
    telop: 「ブルーノ・フェルナンデスには本当に失望した」
    narrator: 解説
    say:
      - {short_only: true, text: マンチェスター・ダービーの退場場面についての話です。}
      - そのうえで、名前を挙げました。
      - {voice: キャラガー, text: だが、ブルーノ・フェルナンデスには本当に失望した}
      - 何に失望したのかも、はっきり言っています。
      - {voice: キャラガー, text: サッカーには好きなことも嫌いなこともある。私が本当に嫌いなのは、倒れて怪我をしたふりをすることだ}
      - 身内びいきではない、という念の押し方もしていました。
      - {voice: キャラガー, text: ユナイテッドのファンはこう言うだろう。彼がユナイテッドの選手だからだ、外国人選手だからだ、と}
      - {voice: キャラガー, text: 5、6年前にこの番組で、トッテナム対エヴァートンの試合でハリー・ケインが同じことをしたときも、私は同じことを言った。受け入れられない}
      - {voice: キャラガー, text: あのブルーノの反応は認められない。足がかすっただけだった}
    official: false
    sources:
      - https://www.caughtoffside.com/2026/09/15/carragher-did-not-hold-back-in-his-criticism-man-united/
