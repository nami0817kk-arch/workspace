sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: セルティックから英2部バーンリーへ
    narrator: キャスター
    say:
      - 日本代表の旗手怜央が、セルティックからバーンリーへ完全移籍しました。
      - 発表は9月1日。移籍市場の最終日です。
      - 契約は2029年6月末までの3年。移籍金は公表されていません。
      - セルティックでは5シーズンすべてでリーグ優勝。191試合で33ゴール31アシストでした。
      - 移籍にあたって、旗手はクラブを通じてこうコメントしました。
      - {voice: 旗手怜央, text: これは僕にとって素晴らしい移籍です}
      - {voice: 旗手怜央, text: イングランドでプレーするのは初めてです}
      - {voice: 旗手怜央, text: でも、加入できるのは素晴らしいクラブですから}
      - {voice: 旗手怜央, text: 自分の経験と知識をロッカールームに持ち込みたい}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/34860/
      - https://www.footballchannel.jp/2026/09/02/post1002417/

  - id: twist
    heading: 直前まで別の話が進んでいた
    tier: 報道
    telop: 移動の許可まで出ていた
    narrator: 解説
    say:
      - ところが、この移籍にはひとつ前の段階があります。
      - イギリスの『トークスポーツ』が2日に伝えた話です。
      - バーンリー行きが決まる前、セルティックはブラックバーンと、旗手のレンタル移籍で合意していました。
      - 旗手本人には移動の許可も出ていたといいます。
      - ブラックバーンには、大橋祐紀と森下龍矢がいます。日本人3人がそろうはずでした。
      - そこからバーンリーが動いて、話がひっくり返ったことになります。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/34990/
      - https://www.soccer-king.jp/news/world/eng/20260903/2200110.html

  - id: debut
    heading: 新天地の初戦はどうだったか
    tier: 報道
    telop: デビュー戦で先制点をアシスト
    narrator: キャスター
    card:
      type: table
      title: チャンピオンシップ第5節 バーンリー 1-2 ブリストル・シティ
      columns: ["時間", "得点"]
      rows:
        - ["56分", "ラムジー（バーンリー）※旗手アシスト"]
        - ["82分", "ロブ・ディッキー（ブリストル）"]
        - ["90+1分", "平河悠（ブリストル）"]
    say:
      - デビューは9月5日、ホームでのブリストル・シティ戦でした。
      - 監督は先発を6人入れ替え、旗手を最初から使いました。
      - 56分、左からのクロスを受けた旗手が、右のラムジーへ横パス。
      - ラムジーが右足を振り抜いて先制します。
      - 旗手は63分までプレーしました。
      - しかし82分に追いつかれ、後半アディショナルタイムには平河悠に決められます。
      - 1対2。日本人対決は平河に軍配が上がりました。
      - 敗戦で厳しい採点が並ぶなか、現地紙は旗手に6点を付けています。
      - {voice: 現地メディア, text: 明らかに才能がある}
      - {voice: 現地メディア, text: 自陣で何度かボールを奪われる場面もあった}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/06/post1004943/
      - https://web.ultra-soccer.jp/news/all/35289/

  - id: club
    heading: 移った先はどんなチームか
    tier: 報道
    telop: 39歳ヴァーディも1年契約で加入
    narrator: 解説
    say:
      - バーンリーは1年でのプレミアリーグ復帰を目指しています。
      - ただ、ここまで5試合を戦って2分3敗。まだ勝てていません。
      - そのバーンリーが9月6日、もうひとり獲りました。
      - 39歳のジェイミー・ヴァーディです。レスターで13年、500試合200ゴールの男です。
      - {voice: ジェイミー・ヴァーディ, text: このクラブには確かな歴史があり、情熱的なファンもいる}
      - {voice: ジェイミー・ヴァーディ, text: 早くピッチに立って、チームが正しい方向へ進むサポートをしたい}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35375/
      - https://www.soccer-king.jp/news/world/eng/20260906/2201546.html

  - id: voices
    heading: この移籍をどう見ているか
    tier: 未確認
    telop: 書き込み50件から、移籍に触れたもの
    narrator: キャスター
    say:
      - まとめには、この移籍について50件の書き込みがありました。
      - そこから、行き先と評価に触れたものです。
      - {voice: ネット民, text: 拒否てエアーやろ}
      - {voice: ネット民, text: 西ハム行って昇格に賭ければ良かったのに}
      - {voice: ネット民, text: やっぱプレミア行きたいんだろうな}
      - {voice: ネット民, text: アメリカに行けばいいのに}
      - {voice: ネット民, text: 自分の能力を過信してるのでは}
      - {voice: ネット民, text: パフォーマンスに波があるという評価}
      - {voice: ネット民, text: 和製アルトゥール悪い意味で}
      - {voice: ネット民, text: あの試合だけなら、スターっぽかったw}
    official: false
    sources:
      - https://sakarabo.blog.jp/archives/1084444311.html
