      - {voice: ディアロ会長, text: 2025年2月に彼と会った}
      - {voice: ディアロ会長, text: デシャンの退任が発表された、すぐあとだ}
      - {voice: ディアロ会長, text: 少し秘密の会合だった}
      - {voice: ディアロ会長, text: いまいるチームを乱したくなかった}
      - {voice: ディアロ会長, text: パリで、内密に会った}
      - {voice: ディアロ会長, text: フランス代表を率いたいという巨大な意志を、まず確認したかった}
      - {voice: ディアロ会長, text: 途方もない提案をいくつも受けてきた人だ}
      - {voice: ディアロ会長, text: そのすべてを、フランス代表のために断ってきた}
      - その席で、ジダンが返した言葉です。
      - {voice: ジダン, text: 会長、私は勝ち方を知っています}
      - 会長はこう締めくくりました。
      - {voice: ディアロ会長, text: このアイコンに、レ・ブルーとの物語を続ける機会を与えられた}
      - {voice: ディアロ会長, text: それが私の誇りだ}
