title: 9月29日の題材
lead: 今夜の日本対ベネズエラ（広島、2対1）から6件、海外から8件。番号だけ振ってあります
note: <b>○×を付けてください。</b>9/29 の枠は 9:00〜17:30 に昨日までの9本（本編＋ショート）が予約済みで、次に空くのは 18:00 から。ショートは1日10本までの決まりなので、<b>明日足せるショートは1本だけ</b>（本編は制限なし）。多ければ 9/30 の朝に回します。ロマーノの投稿は、手元の Chrome が応答せず今回も読めていません。中身は記事の本文まで確かめてあります（試合の詳細はゲキサカの試合記録）。
items:
- num: 1
  slot: 日本人
  head: 上田綺世、ベネズエラ戦で同点弾と後半アディショナルタイムのPK弾。「勝ち切れたことに意味があった」
  why: '後半1分にケルシーに先制されたあと、4分に伊東純也のクロスから同点。90+6分のPKで逆転。ベネズエラの選手は判定に不満を爆発させたが、本人は「勝ち切れたことに意味があった」。所属のリールでもCLで得点しており、代表でも決めた。
    '
  src: ゲキサカ（9/28）
  url: https://web.gekisaka.jp/news/japan/detail/?459904-459904-fl
  fmt: news
- num: 2
  slot: 日本人
  head: 久保建英が倒された場面がノーファウル→ベネズエラのPK→VARの介入で日本のPK。終盤10人だった日本を救った「逆転VAR」
  why: '90+1分、久保がエリア内で倒されるも流され、直後のカウンターで鈴木淳之介が相手を倒してベネズエラにPKの判定。VARがオン・フィールド・レビューを促し、主審が判定を覆して日本のPKに。交代枠を使い切ったあとに渡辺剛が負傷し、日本は10人だった。退場者はいない。
    '
  src: Football ZONE（9/28）
  url: https://www.football-zone.net/archives/676136
  fmt: news
- num: 3
  slot: 日本人
  head: 5人がA代表デビュー。先発の熊坂光希は8分で右膝前十字靭帯の重傷、1年3か月ぶりの復帰戦だった
  why: '先発デビューは小久保玲央ブライアン（GK）・中野就斗・熊坂光希・齋藤俊輔、後半36分に谷村海那。熊坂は前半8分に負傷交代し、ゲキサカは右膝前十字靭帯の重傷と伝えている。中野は72分に交代。
    '
  src: ゲキサカ（9/28）
  url: https://web.gekisaka.jp/news/japan/detail/?459901-459901-fl
  fmt: news
- num: 4
  slot: 日本人
  head: 鎌田大地、腕章を巻いて経験の少ないチームを引っ張った。「これから日本を背負っていく選手たち、成長してほしい」
  why: 'ウルグアイ戦から先発を大幅に入れ替えた試合で主将。若手について「どんどん成長していってほしい」。試合後の言葉を主役にする回。
    '
  src: ゲキサカ（9/28）
  url: https://web.gekisaka.jp/news/japan/detail/?459905-459905-fl
  fmt: quote
- num: 5
  slot: 日本人
  head: 森保監督、上田のPK弾のあとファンへ「ハート」のポーズ。「日本人の魂にハートを送った」「10人でも切り替えてくれた」
  why: '熊坂の負傷と渡辺剛の負傷で数的不利になった試合を逆転した選手たちを「まさに日本人魂」と称賛。昨日の会見の回とは別の出来事。
    '
  src: ゲキサカ・サッカーキング（9/28）
  url: https://web.gekisaka.jp/news/japan/detail/?459903-459903-fl
  fmt: quote
- num: 6
  slot: 日本人
  head: レアル・ソシエダBの喜多壱也（21歳）、初ゴールの直後に2枚目の警告で退場。現地紙は「疑わしい退場処分」
  why: '9/26 のセウタ戦（1-3）で前半33分にセットプレーから先制点。後半21分にセンターサークルでの競り合いで2枚目。エル・ディアリオ・バスコは「ファウルではあるが、カードを出すほどではなかった」。
    '
  src: Football ZONE（9/27）
  url: https://www.football-zone.net/archives/675979
  fmt: news
  weak: true
- num: 7
  slot: プレミア
  head: リヴァプール、イサクに続いてガクポも負傷。オランダ代表のセルビア戦で17分に足首を痛めて交代
  why: 'イサクは「軽いけが」でスウェーデン代表を離れてクラブに戻ったばかり。前線の2人が同時に離脱の可能性。シャビのオランダ初勝利の回（9/28d）には交代の事実だけ触れている。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/eng/20260928/2210092.html
  fmt: news
- num: 8
  slot: プレミア
  head: イングランド代表のトゥヘル監督、ベリンガムについて「彼はそういう状況が好き」。怒りが好材料になるという見方
  why: '代表ウィークの会見での発言。レアルでの立場と合わせて、怒りをどう使う選手かを語った。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/eng/20260928/2210131.html
  fmt: quote
  weak: true
- num: 9
  slot: ラ・リーガ
  head: アトレティコのバエナ、マドリード・ダービー後の会見のモウリーニョを「駄々っ子そのもの」と批判
  why: '9/20 のダービー（アトレティコ2-1レアル）後のモウリーニョの会見が物議を醸し、代表ウィークにアトレティコのMFが反論した。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/esp/20260928/2210099.html
  fmt: quote
- num: 10
  slot: ラ・リーガ
  head: ラフィーニャ、8試合14得点。「今季は多くの記録を塗り替える雰囲気がある」。まずはロナウジーニョ超えへ
  why: '今季のバルセロナで開幕からの得点ペースがクラブ記録級。本人の言葉と、ロナウジーニョの数字との比較で作れる。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/esp/20260928/2210102.html
  fmt: news
- num: 11
  slot: その他
  head: ラツィオのパトリック、在籍11年244試合でUAE2部へ。移籍先で同僚になるのはバロテッリ
  why: 'ブラジル人DFがラツィオを離れ、UAEの2部へ。バロテッリと同じクラブになるという組み合わせが話の芯。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/ita/20260928/2210452.html
  fmt: news
  weak: true
- num: 12
  slot: その他
  head: ポルトガル代表で2戦連発のジョアン・フェリックス「CLで再びプレーしたい」。将来の欧州復帰を口にした
  why: 'サウジのアル・ナスルから代表に戻り、2試合続けて得点。ロナウドが出番なしだった試合（9/28d）とは別の切り口で、本人の言葉が主役。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/world_other/20260928/2210107.html
  fmt: quote
- num: 13
  slot: その他
  head: カーボベルデ代表の守護神、W杯で「時の人」になったあとの日常を明かす。「平穏が失われた」
  why: '2026年W杯で注目されたGKが、大会後の生活の変化を語った。小国の選手の裏側で、数字より話の回。
    '
  src: サッカーキング（9/28）
  url: https://www.soccer-king.jp/news/world/world_other/20260928/2210390.html
  fmt: quote
  weak: true
- num: 14
  slot: その他
  head: マンUのドルグ、ハムストリング負傷でデンマーク代表を離脱。ブルーノ・フェルナンデスもポルトガル代表から外れた
  why: 'マンUの負傷者が代表ウィークで重なった。ブルーノはスカイ・スポーツが「けがで代表を外れた」と伝えている（英語記事、未確認どまり）。
    '
  src: サッカーキング（9/28）・Sky Sports
  url: https://www.soccer-king.jp/news/world/world_other/20260928/2210094.html
  fmt: news
  weak: true
