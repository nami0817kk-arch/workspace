- num: 1
  slot: 日本人
  head: U-21日本代表、北朝鮮を1-0で破ってアジア大会4強。北朝鮮の監督は決勝点に「フェアプレーの精神にかなっていたのか」
  why: 'ンワディケ・ウチェ・ブライアン世雄の先制点を守り切った。相手監督がその得点に異議を唱えた、という見出し。

    大関友翔が、もうろうとした北朝鮮の選手を介抱してネットで話題、という小ネタもある。若い選手は顔写真が取れないことがある。

    '
  src: ゲキサカ（9/26）
  url: https://web.gekisaka.jp/news/japan/detail/?459818-459818-fl
  fmt: news
