- id: coaches
  heading: 35年で監督5人。なぜ代えずにいられたのか
  tier: 背景
  telop: 1991年から監督は5人。フィンケ16年、シュトライヒ12年
  narrator: 解説
  main: true
  card:
    type: table
    title: 1991年からのフライブルクの監督
    columns: &id001
    - 在任
    - 監督
    rows:
    - - 1991-2007
      - フォルカー・フィンケ
    - - 2007-2011
      - ロビン・ドゥット
  say:
  - 1978年秋から91年夏の13年で、フライブルクの監督はのべ**17人**。
  - 1991年からの35年は、5人です。
  - 流れを変えたのが、1991年に来たフォルカー・フィンケです。
  - 2年目に2部で優勝して1部へ。1部の2年目には、3位に入りました。
  - text: 2002年に2部へ落ちても、クラブはフィンケを代えません。
    card:
      type: table
      title: 1991年からのフライブルクの監督
      columns: *id001
      rows:
      - - '2011'
        - マルクス・ゾルク
      - - 2011-2024
        - クリスティアン・シュトライヒ
    image: assets/images/bd_freiburg_finke/scene_w.jpg
  - 翌年、2部で優勝して1部に戻りました。
  - フィンケは16年指揮し、のちに日本の浦和レッズでも監督を務めています。
  - text: 2011年の暮れ、残留争いの中で就いたのが、ユースを育ててきたシュトライヒです。
    image: assets/images/bd_freiburg_coaches/scene_w.jpg
  - 2015年には、勝ち点1の差で2部へ。それでも監督は代えません。
  - text: 翌年は2部で優勝し、また1年で戻りました。
    card:
      type: table
      title: 1991年からのフライブルクの監督
      columns: *id001
      rows:
      - - 2024-
        - ユリアン・シュスター
  - シュトライヒは12年あまり指揮。2022年には、ドイツカップの決勝へ導きました。
  - 後を継いだのは、そのアシスタントだったシュスターです。
  - その2年目、チームはヨーロッパリーグを勝ち上がり、決勝までたどり着きました。
  sources:
  - https://en.wikipedia.org/wiki/SC_Freiburg
  - https://en.wikipedia.org/wiki/Volker_Finke
  - https://en.wikipedia.org/wiki/Christian_Streich
  bg: assets/backgrounds/stadium_フライブルク_in.png
  official: false
