  say:
  - text: 1926年の開業のとき、入れたのは3万5000人でした。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 0
    image: assets/images/20261004_stadium_sansiro/03.jpg
  - text: こけら落としはミラノ・ダービー。インテルが6対3で勝ちました。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: ところが9年後の1935年、ミラノ市がこの競技場を買い取ります。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: 市はスタンドの切れ目をつなぎ、ぐるりと囲む形に広げました。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: 戦後の1955年には、スタンドの上に2層目が乗ります。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: 1980年、前の年に亡くなったメアッツァの名前が付けられました。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: そして1990年、W杯の開催に向けた大改修です。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 4
    image: assets/images/20261004_stadium_sansiro/04.jpg
  - text: スタンドを囲むように11本の円い塔を建て、3つの面に3層目を乗せました。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 4
  - text: 角に立つ4本の塔が、赤い梁の屋根を支えます。いまの姿の完成です。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 4
    emph: true
  - text: 改修のあとは8万5700席。そこから1万席ほど減って、いまの数になっています。
    card:
      type: table
      title: サン・シーロの歩み
      columns: *id003
      rows: *id004
      highlight_row: 4
