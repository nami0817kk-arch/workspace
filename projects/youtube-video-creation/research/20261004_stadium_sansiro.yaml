  - text: 100年のサン・シーロと新スタジアム。数字を並べると、違いが見えてきます。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
    image: assets/images/20261004_stadium_sansiro/07.jpg
  - text: まず席の数。7万5817から7万1500へ、4300席ほど減ります。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 1
  - text: それでも、高い料金の特別席は1万3000席以上を置く予定。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 2
  - text: 席を減らしてでも特別席を厚くする。クラブが稼ぐ力を上げる作りです。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 2
    emph: true
  - text: 持ち主も変わりました。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 3
  - text: 1935年から90年続いた市の持ち物が、クラブの手に戻ったのです。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 3
  - text: 変わらないものもあります。ライバル同士の同居は、新スタジアムでも続きます。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 3
  - text: 新スタジアムは9月30日、2032年の欧州選手権、ユーロの会場候補にも入りました。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 次の節目は、早ければ今月の終わり。完成予想図の発表が見込まれています。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 着工は2027年の後半、完成は2031年の予定。
    card:
      type: table
      title: いまのサン・シーロと新スタジアム
      columns: *id011
      rows: *id012
      highlight_row: 4
  - text: 100年目を迎えた舞台は、あと5年ほどで、隣の新しい家に役目を譲る見込みです。
