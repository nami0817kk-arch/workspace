  - voice: ミランとインテルの共同声明
    text: 新しいスタジアムと地区の再生は、
  - voice: ミランとインテルの共同声明
    text: ミラノの街と両クラブにとって、新しい章になる。
    cont: true
  - text: ミラノ市議会が売却を決めたのは、去年の9月30日。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 0
    image: assets/images/20261004_stadium_sansiro/06.jpg
  - text: 11時間を超える議論の末、採決は夜中の2時半ごろでした。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: 賛成24、反対20。わずか4票の差です。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 0
    emph: true
  - text: 値段は1億9700万ユーロ。周りの土地も含みます。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 1
  - text: そして11月5日、2つのクラブが一緒に作った会社が、市と契約を結びました。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: その日にまず7300万ユーロを払い、残りは分けて払います。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 4
  - text: 急いだのは、11月10日から2層目が文化財として守られる決まりだったため。
    card:
      type: table
      title: サン・シーロの売却
      columns: *id007
      rows: *id008
      highlight_row: 2
  - text: そうなると、取り壊しが難しくなる。その5日前の契約でした。
    card:
