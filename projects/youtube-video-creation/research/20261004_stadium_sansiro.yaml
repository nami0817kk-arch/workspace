  say:
  - text: 100年のあいだに、サン・シーロは世界の大舞台を何度も迎えてきました。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
    image: assets/images/20261004_stadium_sansiro/02.jpg
  - text: W杯は1934年と1990年の2大会。1990年は、開幕戦の舞台でした。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: その開幕戦で、前回王者のアルゼンチンがカメルーンに0対1で敗れています。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 欧州のクラブの頂点を決める決勝は、ここで4回行われました。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 1
  - text: 1965年はインテル自身が決勝に進み、本拠地で2年連続の欧州王者に。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 1
    emph: true
  - text: 2001年はバイエルン、2016年はレアル・マドリードが優勝。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 3
  - text: どちらも、PK戦までもつれた決勝でした。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 4
  - text: そして今年2月6日、冬のオリンピックの開会式がここで開かれました。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 5
    image: assets/images/20261004_stadium_sansiro/05.jpg
  - text: 客席にはおよそ6万1000人。サッカーの外でも、ミラノの顔になっています。
    card:
      type: table
      title: サン・シーロで開かれた大舞台
      columns: *id005
      rows: *id006
      highlight_row: 5
  - text: 一方で、来年のチャンピオンズリーグ決勝の開催地には選ばれませんでした。
    image: assets/images/20261004_stadium_sansiro/02.jpg
  - text: 建て替えの工事が決勝に響かないと、ミラノ市が約束できなかったためです。
