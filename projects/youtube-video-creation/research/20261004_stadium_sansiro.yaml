  question: 100年使われてきたサン・シーロは、ミランとインテルの持ち物になって何が変わるのか
  takeaway: サン・シーロは1926年にミランが建て、1935年からミラノ市が持ってきた。2025年11月5日、ミランとインテルが1億9700万ユーロで買い取り、90年ぶりにクラブの持ち物になった。隣に建てる予定の新スタジアムは7万1500席と今より約4300席少ないが、特別席を1万3000席以上置く。街の競技場から、2つのクラブが稼ぐための家に変わる。次の節目は10月末ごろの完成予想図の発表、着工は2027年後半、完成は2031年の予定で、いまのスタジアムは約9%を残して解体される計画
