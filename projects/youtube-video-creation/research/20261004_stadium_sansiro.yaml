    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
  - voice: インテルの声明
    text: 100年の歴史は、ミラノの街にも、
  - voice: インテルの声明
    text: 世界のサッカーにも影響を与えてきた。
    cont: true
  - text: 場所はミラノの西、サン・シーロ地区。地区の名前がそのまま呼び名です。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 座席は7万5817席。陸上のトラックを持たない、サッカーのための競技場です。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: 建てたのはミラン。インテルは1947年に移ってきました。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 街のライバル同士が1つの家を分け合う。欧州の名門では珍しい形です。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 正式な名前は、スタディオ・ジュゼッペ・メアッツァ。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 4
  - text: 1934年と1938年のW杯を制した、イタリア代表のストライカーの名前です。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 4
  - text: インテルを中心に、ミランでもプレーした、2つのクラブをつなぐ選手でした。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 4
  - text: そしてこの家の持ち主が、去年の秋に入れ替わりました。
    card:
      type: table
      title: サン・シーロの基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 5
