# 取材メモ（2026年11月4日）ヤマル、ムバッペを抜いてCLの10代の最多得点に（14点・37試合）。同じ試合でラフィーニャはバルサでのCL得点がレヴァンドフスキに並ぶ（ニュースのショート。見せ方 X＝冒頭1秒に強い一言）
# 取材: 2026-11-04。python requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない（記事を探すのに Google ニュースの RSS の見出し一覧だけ使った）。
# 読んだ出典:
#   ・ESPN 記事 50371754「Yamal breaks Mbappé's teenage Champions League goals record」（content.core.api.espn.com 経由で全部読んだ）
#       - バルサ 3-0 ヴィラの7分の得点で、CL史上もっとも得点した10代に。CL14点目。ムバッペの10代の得点は13（ムバッペはいまCL通算72点）。14点は37試合。
#       - 今季は公式戦15試合で13点・11アシスト。（ほかに、16歳83日でCL最年少先発・最年少で得点とアシスト・準決勝の最年少得点、など。今回は使わない）
#       - 「19歳の誕生日までに11点」と書くが、バルサ公式は「19歳の誕生日までに10点（ムバッペと同じ）」→ 食い違うので使わない。
#   ・FCバルセロナ公式「Lamine Yamal top Champions League scorer under 20 years of age」: 14点は20歳になる前の最多、ムバッペの13を上回った。37試合。**20歳になるのは来年7月**。
#   ・FCバルセロナ公式の試合記事「FC Barcelona 3-0 Aston Villa: Three goals, three points」: 7分のヤマル、52分・64分のラフィーニャ。ラフィーニャはバルサでの通算得点94でロナウジーニョに並んだ（今回は使わない）。4試合で勝ち点9。
#       ラフィーニャは試合後、テネリフェのヘスス・デ・ミゲル選手の死去を受けて「今日はサッカーの話をする日ではない」とだけ話した → 試合の話ではないので使わない。
#   ・Opta Analyst「Barcelona 3-0 Aston Villa Stats」: ヤマルが10代のCL最多得点（14）、ムバッペ（13）を更新。**ラフィーニャはバルサでのCL得点がレヴァンドフスキに並び、上はメッシ（120）とスアレス（25）だけ**。
#       → ラフィーニャのバルサでのCL得点は23（Opta の「23 goals, 14 assists」）＝レヴァンドフスキも23。
#   ・ESPN の試合データ（site.api.espn.com .../uefa.champions/summary?event=401915387）: 7分 ヤマル（左足、ゴール左下）、52分 ラフィーニャ（アシスト フェルミン）、64分 ラフィーニャ（アシスト カンセロ）。
# 食い違い: 7分の失点につながったパスを出したのは、ESPN と Opta は「ジョアン・ゴメス」、バルサ公式は「ブエンディア」。→ 台本は「相手のパス」とだけ言う。
# 鈴木彩艶: 相手のGK。別の本で扱うので、この本では名前も出さない。
# 本人の言葉: ヤマルの試合後の言葉は見つからなかった（バルサ公式の試合記事・記録の記事、ESPN、スペイン語の見出し一覧を当たった）。→ X。
# 自分で数えたもの: 37÷14＝2.64 → 約2.6試合に1点。20歳まで（来年7月）約8か月。ラフィーニャ23点＝レヴァンドフスキ23点、スアレス25点まで2点。
# 反応: 0件（X は道具の決まりで当たれず、Reddit は requests で 403。作らない。approve は --no-voices）。
# 写真: バルサ公式の試合のフォトギャラリー（クラブのカメラマン）から6枚。01・02 ヤマル、03・04 ヤマルとラフィーニャ（背中の名前で確認）、05 ラフィーニャ（主将マーク）、06 ラフィーニャ（試合の最優秀選手の盾）。02_w は頭が切れているので使わない。代理店ではない。
# 前の本との重なり: 20261024_yamal_mbappe_clasico_numbers（クラシコ前の数字の比べ）／20261027_yamal_kopa_cubarsi（コパ・トロフィー）／20261028_yamal_it_will_come（バロンドール3位の翌日の投稿）／20261023_raphinha_nine。
#   → バロンドール3位・コパは言わない。ムバッペとの比べは「CLの10代の得点」だけ（10/24 はリーグの数字）。ラフィーニャの「9番への変身」は繰り返さない。
