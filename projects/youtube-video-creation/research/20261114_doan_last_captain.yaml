# 出典で確かめたこと:
#   ・13日（ブラジル戦の前日）の取材対応。この日、12月30日に予定されていた親善試合の中止が発表され、シンガポールの2試合（14日ブラジル戦・17日パラグアイ戦）が森保監督の最後の指揮になった（ゲキサカ・サッカーキングが一致）。キャプテンは9月・10月に続いて堂安（ゲキサカ）。森保監督の言葉（サッカーキング）「キャプテンは継続して律にやってもらうということで、選手たちには伝えました」。ゲキサカの地の文: 北中米W杯でチームキャプテンを務めたのはDF板倉滉。
#   ・堂安の言葉（原文。ゲキサカ。字は変えていない。括弧は記者の補足。台本は読点で行に分けた）:
#       「(キャプテンが板倉)滉くんと言われていたところで僕も感情は変わらない。僕は誰よりもリスペクトしているし、誰よりも滉くんのチームへの思いが分かっている。例えば(昨年10月にキャプテンを務めた南野)拓実くんであっても、森保さんのために日本サッカーのためにという思いを持った選手が増えているので」
#       「森保監督になってから、日本代表が勝つことが当たり前になった。明日(のブラジル戦に)勝つんじゃないかと思っている人も、前より増えたと思う。そういう感覚にできたことが日本サッカーの発展だと思う」
#       「名前負けしない自分たちの土俵があるので、勝てる自信は大いにあります」
#       「(集大成が)もうちょい楽な試合やったらとか思う人もおそらく多いでしょうけど、僕たちをやる気にさせるミッションが来たなと思います。ゆるっと終わるのではなく、タフな2試合を乗り切って壁を乗り越えて終わる」
#   ・サッカーキングの地の文: 森保監督は2018年から日本代表を率い、通算111試合で76勝17分け18敗。来年3月からは大岩剛監督の就任が決定。76+17+18=111（合う）。勝った割合は 76÷111＝約68%（自分で割った）。
#   ・ESPN の確認: 今回の台本の事実はすべて記事の言葉と記録の数字で、ESPN で確かめる試合は無い（通算の111試合は ESPN では数えていない＝サッカーキングの数字。報道の札）。
# 食い違い: 堂安の言葉の書き起こしが2社で少し違う。ゲキサカ「日本代表が勝つことが当たり前になった」「僕たちをやる気にさせるミッションが来た」、サッカーキング「日本代表は勝つことが当たり前になった」「やる気にさせてくれるミッションが来た」。台本は主な出典のゲキサカの表記に統一した。サッカーキングの「ブラジル代表、パラグアイ代表と…決勝トーナメントに進出した」は、日本が両国と戦ったという意味ではないので台本に使わない。
# 前の本との重なり: 20261111_doan_asiacup_words（アジア杯延期・8年3か月・「最後じゃない気もする」・森保監督への感謝）。今回の初出: キャプテンを託されたこと、「勝つのが当たり前になった」「勝てる自信」「ミッション」の言葉、通算成績の数字。アジア杯・8年3か月・感謝の話は繰り返さない。
# 【言わないこと】ブラジル戦の結果・起用の予想／アジア杯の話／板倉・南野の評価（堂安の言葉の範囲だけ）。
