- id: rise
  heading: 4部まで落ちたアウクスブルクは、どうやって1部の常連になったのか
  tier: 背景
  telop: 2000年に4部へ。2011年に初の1部。2015年は過去最高の5位
  narrator: 解説
  main: true
  say:
  - text: 2000年。アウクスブルクは、3部のリーグで8位でした。
    image: assets/backgrounds/stadium_アウクスブルク_in.png
    card:
      type: table
      title: アウクスブルクの歩み
      columns:
      - 年
      - 出来事
      rows:
      - - 2000年
        - ライセンスが出ず4部へ
      - - 2002年
        - 4部で優勝、3部へ復帰
      - - 2006年
        - 3部で優勝、2部へ
      - - 2011年
        - 初めての1部
      - - 2015年
        - 5位、過去最高
  - ところが、お金の問題でライセンスが出ません。
  - スポンサーが約束した保証金は届かず、借金は180万マルク。4部へ落とされます。
  - text: 立て直したのは、地元の実業家ヴァルター・ザインシュ。
    card: none
    image: assets/images/bd_augsburg_rosenau2/scene.jpg
  - 会長になって、お金の管理から作り直しました。
  - 2002年に4部で優勝。2006年には3部で優勝して、23年ぶりの2部へ。
  - text: 2009年、新しいスタジアムが完成します。
    image: assets/backgrounds/stadium_アウクスブルク.png
  - 2011年、2部で2位に入り、クラブ史上初めての1部へ。
  - 10月15日、1部での初勝利。マインツに1対0でした。
  - 2シーズン目は、前半戦で勝ち点9。最終節にフュルトに3対1で勝ち、残りました。
  - text: そして2015年、過去最高の5位。翌年は、初めてヨーロッパの舞台に立ちます。
    image: assets/backgrounds/stadium_アウクスブルク_in.png
  - 32強でリヴァプールと当たり、合計0対1でした。
  sources:
  - https://en.wikipedia.org/wiki/FC_Augsburg
  bg: assets/backgrounds/stadium_アウクスブルク_in.png
  official: false
