sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: ラシン・サンタンデールに7-2。前半だけで4-1
    narrator: キャスター
    card:
      type: table
      title: この試合
      columns: ["", ""]
      rows:
        - ["スコア", "バルセロナ 7-2 ラシン・サンタンデール"]
        - ["前半", "4-1"]
        - ["ラフィーニャ", "3得点（67分にハットトリック）"]
        - ["カンセロ", "2得点"]
    say:
      - ラ・リーガの第6節、バルセロナがラシン・サンタンデールに7対2で勝ちました。
      - 前半だけで4対1です。
      - "ラフィーニャが**3得点**。ハットトリックは67分に達成しました。"
      - カンセロが2得点、ヤマルとジェズスがそれぞれ1点です。
      - 監督のハンジ・フリックは、カンセロ、ロドリ、ペドリ、ラフィーニャ、ヤマルを先発させています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012905/

  - id: record
    heading: なぜクラブ史上初なのか
    main: true
    tier: 報道
    telop: 過去3回、いずれも7試合目で止まっていた
    narrator: 解説
    card:
      type: table
      title: 開幕からの連勝
      columns: ["", ""]
      rows:
        - ["1929-30", "6連勝で止まる"]
        - ["1960-61", "6連勝で止まる"]
        - ["2018-19", "6連勝で止まる"]
        - ["2026-27", "7連勝。クラブ史上初"]
    say:
      - この勝利で、今季の公式戦は開幕から7連勝になりました。
      - "そして、これが**クラブの歴史ではじめて**です。"
      - 実は、6連勝までは過去にも3回ありました。
      - 1929年から30年。1960年から61年。そして2018年から19年。
      - "その3回とも、**7試合目で勝てませんでした。**"
      - "最初の6連勝から数えると、**96年**が経っています。"
      - その壁を、今季のチームが越えたことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012905/

  - id: numbers
    heading: 得点の数
    tier: 報道
    telop: リーグ6戦で28得点
    narrator: キャスター
    card:
      type: table
      title: ここまでの得点
      columns: ["", ""]
      rows:
        - ["リーグ6試合", "28得点"]
        - ["第5節終了時点", "5試合21得点・勝点15で首位"]
        - ["この試合", "7得点"]
        - ["1試合平均", "4.7得点"]
    say:
      - "リーグ戦6試合で、**28得点**。"
      - 第5節を終えた時点では、5試合21得点で勝ち点15、首位に立っていました。
      - そこにこの7点が乗った形です。
      - 1試合あたり**4.7得点**という数字も出ています。
      - 1試合で5点以上を取ったのは、今季これで**5度目**です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/17/post1012905/

