#   ・ヤマルの「2アシスト」… 得点1は確認できたが、アシスト数は記載なし
# **どちらも言わない。**
#
# 引きは**「6連勝どまりが3回あった」**。1929/30、1960/61、2018/19。
# そのどれもが7試合目で勝てなかった。ここが山場（@main）。
