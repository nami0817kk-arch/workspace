# ネイマール（2026年9月9日）。材料は research/material/dig_ネイマール.md
# サラーの差し替え（2026-09-09 ユーザー「サラーは別のに変える」）。
# **反応スレ（母数49件）はポーカーの話。**だから台本にもポーカーの節を置き、
# その流れで反応を読む。関係のない節に貼りつけない
format: news
# 事実の節が長い回。反応は最後にまとめて置く
voice_min: 20
slot: world
date: "2026年9月9日"

short_title: "ネイマールがサントスで休んでいる日数"

theme:
  id: neymar_fifth_injury
  league: other
  kind: other
  topic: ネイマール
  title: ネイマールに5度目の離脱、サントス復帰から続いている異変
  hook: また、途中で交代しました。
  question: 戻ってきてから、どれだけピッチを離れているのか

thumbnail:
  line1: 復帰してから5度目の負傷
  line2: 離脱した日数は ●●● 日超
  photo: "assets/photos/20260909_neymar/01.jpg"
