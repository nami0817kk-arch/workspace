sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 右大腿直筋の筋損傷
    narrator: キャスター
    say:
      - サントスのネイマールが、また負傷しました。
      - 9月3日、コパ・ド・ブラジル準々決勝のパルメイラス戦です。
      - 先発しましたが、筋肉系のトラブルで途中交代しました。
      - クラブが出したメディカルレポートの診断は「右大腿直筋の筋損傷」。
      - スペイン紙『アス』は、回復に4週から8週、最大2か月と報じています。
      - 試合は0対0。2戦合計0対3で、サントスは敗退しました。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35246/
      - https://www.soccer-king.jp/news/world/southamerica/20260905/2201013.html

  - id: count
    heading: 何度目の離脱なのか
    tier: 報道
    telop: 離脱日数は200日を超える
    narrator: 解説
    card:
      type: bars
      title: サントス復帰後のネイマール
      items:
        - {label: "コンディションによる離脱日数", value: 200}
      unit: 日超
    say:
      - 問題は、これが初めてではないことです。
      - 昨年1月にサントスへ戻ってから、コンディションの問題による離脱日数は200日を超えています。
      - 今回で5度目の大きな負傷。そのうち4度が筋肉系です。
      - サントスとの契約は今年12月末まで。
      - 度重なるケガもあって、来季どこにいるのかは分かっていません。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35246/
      - https://www.theworldmagazine.jp/20260905/01world/504662

  - id: retire
    heading: 代表にはもう戻らない
    tier: 報道
    telop: 通算130試合80ゴール
    narrator: キャスター
    say:
      - 7月末、ネイマールはブラジル代表からの引退を表明しています。
      - {voice: ネイマール本人, text: 代表での僕の物語はもう終わった}
      - {voice: ネイマール本人, text: ブラジル代表のために血も人生も捧げ、常に戦ってきた}
      - {voice: ネイマール本人, text: でも、もうこれ以上は望んでいない}
      - 代表通算は130試合で80ゴール58アシストでした。
      - 最後の試合は、北中米ワールドカップのラウンド16、ノルウェー戦です。
      - この大会での出場は2試合、合わせて37分だけでした。
      - それでもノルウェー戦のPKで、4大会での得点を記録。ペレに並ぶブラジル代表記録です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/07/30/post968961/
      - https://web.ultra-soccer.jp/news/all/30921/

  - id: poker
    heading: 休んでいるあいだの話
    tier: 背景
    telop: 欠場した日にポーカーの大会へ
    narrator: 解説
    say:
      - もう一つ、話題になった出来事があります。
      - ネイマールは「コンディション調整」を理由に、所属クラブの試合を欠場しました。
      - その同じ時期、ブラジル国内で開かれていたポーカーの大会に出場しています。
      - 復帰した試合では2得点。ゴールのあと、カードを配る動きで喜びました。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/30129/
      - https://web.ultra-soccer.jp/news/all/30514/

  - id: voices
    heading: これをどう見ているか
    tier: 未確認
    telop: 書き込み49件から
    narrator: キャスター
    say:
      - このポーカーの話には、掲示板のまとめに49件の書き込みがありました。
      - そこから、賛否の分かれたものを読み上げます。
      - {voice: ネット民, text: ギャンブルくらいエエやろに}
      - {voice: ネット民, text: サッカー以外なにもするなと}
      - {voice: ネット民, text: ボクサーに何十億も詰んだり正気じゃないね}
      - {voice: ネット民, text: サッカーじゃ騙せなくなったからポーカーか}
      - {voice: ネット民, text: 楽しんだもん勝ちみたいな事かな}
      - {voice: ネット民, text: このくらい楽しまないとな}
      - {voice: ネット民, text: 日本人に足りない考え方だわ}
      - {voice: ネット民, text: 一方日本人は人生は戦いと説いていた}
      - {voice: ネット民, text: 昔のネイマールは凄かったな}
    official: false
    sources:
      - https://footballnet.2chblog.jp/archives/59961229.html
