# 取材メモ（2026年10月18日）マンCの財務規則違反が他の35クラブに与えた影響の試算（ニュースのショート。見せ方 X＝冒頭1秒に強い一言。**煽りの版**）
# 【煽りの版：何を足したか】（2026-10-17 ユーザー指定。同じ画面どうしで煽りの有無を比べる）
#   足したのは題と冒頭1行（題の読み上げ）の煽り語だけ：「衝撃の試算」。出典の見出し（フットボールチャンネル）が使っている語で、題の中では「試算」を必ず添える。
#   冒頭の強い一言（short_hook_word）は「8億ポンド超の試算」。「試算」を外さない。
#   事実・数字は1字も変えていない：8億3800万ポンド超／トッテナム約1億1990万／ハル約9900万 ほか、すべて出典の表どおり。本文に煽る語は無い。
#   答えは伏せた：題は「最大の影響を受けたクラブ」を言わない（答えは本文の2つ目の節）。
#   人を貶す語は使っていない。想定は「見立て」と明記し、シティが控訴中であること・実際の損害や賠償額が確定したものではないことを、冒頭の節と見立ての節の2か所で言う。
#   確率・賠償の見通しは作っていない。
# 取材: 2026-10-18。requests（ブラウザUA）で原文を読んだ。
#   ・フットボールチャンネル 2026-10-17 11:30「マンCの財務規則違反、ライバル35クラブに総額約1760億円の影響か　英紙が衝撃の試算」の1ページ目・2ページ目（35クラブの表）を全部読んだ。
#     research/raw/ には保存していないが、本文は上の URL で再確認できる（2ページ目は /2/）。
#   ・元の BBC の試算・英紙 The Sun の記事そのものは読めていない（フットボールチャンネル経由）。
#     football365 の記事は「BBC Sport の分析による総額は約8億4400万ポンド」と書いており（検索結果の要約による。本文は取り出せなかった）、
#     フットボールチャンネルの「8億3800万ポンド超」とは数字が少し違う。**台本は、読んだフットボールチャンネルの数字だけを使う**。表の35行を自分で足すと 8億3890万ポンドで、
#     記事の「8億3800万ポンド超」と矛盾しない。
# 確かめたこと（フットボールチャンネル本文）:
#   ・プレミアリーグは9月29日、独立委員会がマンチェスター・シティの財務規則違反を認定したと発表。シティは不服として控訴している。
#   ・The Sun は現地時間16日、その違反が他の35クラブの収入に及ぼした可能性のある影響について、合計8億3800万ポンド超（約1760億円）との推計を報じた。
#   ・最大はトッテナムで約1億1990万ポンド（約251億8000万円）。
#   ・The Sun は BBC が発表した試算をもとに、2009/10〜2017/18シーズンにプレミアで戦った35クラブへの経済的影響を紹介。
#     考慮したのは、順位による賞金の差額、CLなど欧州カップの出場権、降格による収入減、国内カップ戦での影響。
#   ・トッテナムは、対象期間中にシティがCL出場権を獲得した一方、4度にわたってCL出場圏の一つ下の順位で終えた。欧州大会の賞金収入などを比べた結果。
#   ・2位ハル・シティ約9900万ポンド（2014/15と2016/17に18位で降格したことが大きな要因）、3位エヴァートン約6643万、4位スウォンジー約6313万、5位ニューカッスル約6048万。
#     リヴァプール6位5233万、チェルシー4576万、アーセナル3086万、マンチェスター・ユナイテッド1835万。
#   ・「これらはシティの存在によって他クラブの順位や大会出場状況が変わったと仮定した場合の試算であり、実際に発生した損害や賠償額が確定したわけではない。」
# 資料間のずれ: 題材の一覧は「トッテナムは約1.2億ポンド」。本文の表は1億1990万ポンドで、台本は表のとおり「約1億1990万ポンド」。
#   ハルの円換算は本文中が207億9000万円、表が207億9100万円。台本は円を言わない（ポンドだけ。総額と最大のトッテナムのみ円を添える）。
# 自分で数えた比べ（見立て）: 表の試算額（万ポンド）を足した。上位5クラブ＝11,990+9,900+6,643+6,313+6,048＝40,894 → 約4億900万ポンド＝全体83,890のうち48.7%（約半分）。
#   上位10クラブ＝62,161 → 74%。トッテナム11,990÷マンチェスター・ユナイテッド1,835＝6.5倍。
# 自分で割った: 8億3800万÷35＝約2394万→「平均で約2400万ポンド」（表の35行の平均も 83,890÷35＝約2,397万で同じ）。
# 本人の言葉: 無し（誰かの発言は使わない題材）。反応: 0件（この件への実在の書き込みは当たっていない。作らない）。approve は --no-voices で。
# 写真: 配信写真（Getty）は取り込まない。assets/images/20261018_city_ffp_35clubs_estimate/ は Commons の競技場の写真（人物は特定しない）。出典は credits.json。
