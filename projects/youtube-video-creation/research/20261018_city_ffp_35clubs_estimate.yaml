    telop: マンCの違反が、他の35クラブに与えた影響の試算
    say:
      - 9月29日、プレミアリーグの独立委員会が、シティの財務規則違反を認定しました。
      - シティは不服として、控訴しています。
      - 16日、イギリスの新聞が、その違反の影響を試算して伝えました。
      - 他の35クラブの収入への影響は、合計8億3800万ポンド超。
      - 1クラブあたりの平均は、約2400万ポンド。
      - 日本円で、総額約1760億円です。
      - 対象は、2009/10から2017/18シーズン。
      - その間にプレミアで戦った、35クラブです。
      - ただし、数字は試算です。実際に生じた損害や賠償額が、確定したものではありません。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/10/17/post1034052/
      - https://www.footballchannel.jp/2026/10/17/post1034052/2/

