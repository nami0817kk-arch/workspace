# 板倉滉 の取材メモ（2026年10月17日）
# 1本＝1テーマ。ショートだけ（no_main）。見せ方は G（切り抜き＋クラブ色の背景）。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・フットボールトライブ（2026-10-17「板倉滉、ブラジル戦に間に合う！“珍しい怪我”中殿筋断裂とは？復帰までの過程明らかに」。https://football-tribe.com/japan/2026/10/17/360459/）
#   ・フットボールトライブ（2026-10-16「上田綺世、ブラジル戦出場は絶望的…板倉滉も日本代表選外へ！冨安健洋は…」。https://football-tribe.com/japan/2026/10/16/360431/）
#   控えは research/raw/20261017_itakura_ft.txt・20261017_itakura_ft2.txt（html も同名）。
# **見出しと本文の食い違いの正体**（元データの注意を本文で読み直した）:
#   ・10/16 の記事: 板倉はクラブの診断で左中殿筋の筋繊維断裂。独 express は13日に「離脱期間を予測することも極めて難しい」と報じた。上田と同じく**ブラジル戦に招集されない可能性が高い**と書く。監督の言葉は無い。
#   ・10/17 の記事: ブレッシン監督のコメント（独『リーガインサイダー』が伝えたものを、この記事が引く＝二次の伝聞。原文は未読）が加わり、**「ブラジル戦までに復帰する見込みだという」「10月末、11月はじめに復帰する可能性が高い」「万全に近いコンディションで臨めそう」**と書く。
#   ・つまり「選外へ」は前日（監督の言葉が出る前）の見立て、「間に合う」は翌日の見立て。**どちらも記事の側の見通しで、ブラジル戦は監督の言葉に出てこない**。確かめられたのは、監督の言葉まで: 「今節は間に合わないだろう。回復の過程を見守り、来週か遅くとも再来週には復帰できるかどうかを見極める必要がある」。
#   ・台本では、監督の言葉（報道）と「間に合うという見方」（未確認＝記事側の見立て）を分ける。「間に合う」と言い切らない。軽度という記事の推測、診断の一般的な説明（記事の解説部分）は使わない。
# 日付: 18日＝ブンデスリーガ第6節（記事）。11日の第5節ケルン戦も欠場（10/16の記事）。ブラジル戦は11月14日（両記事で一致）。
# 自分で数えたこと: 監督が「見極める」時期とした「遅くとも再来週」の終わりを11月1日と数える（来週＝10/19〜25、再来週＝10/26〜11/1。月曜始まりで数えた）と、ブラジル戦（11/14）まで13日。復帰の日ではなく、監督が見極める期限としての数え方。
# 本人の言葉: 無し（記事に本人のコメントは無い。SNSは当たっていない＝ブラウザ禁止）。
# 反応: 0件。当たった先: NO FOOTY NO LIFE のトップ（板倉の記事なし）。検索（WebSearch）は新しい投稿に当たらず。Xは触っていない。作らない。
# 写真: 配信写真（AFLO・Getty）は取り込まない。Commons の Ko Itakura（Mtjonenfa、CC BY-SA 4.0、2026-01-11 アヤックス対テルスター。**アヤックス時代のユニフォーム**。他に最近の写真が無い）。01.jpg は Commons の cropped 版、02.jpg は元の写真。03_g_v.jpg は G、04〜07_v.jpg は B（02 の別の切り出し）。10/16 に使った写真ではない。
