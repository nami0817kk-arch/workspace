# 監督紹介：アンジェ・ポステコグルー（11/30 月、シリーズ「監督紹介」、key: manager_postecoglou、型は news）。9節（日本との接点＝横浜F・マリノスと古橋亨梧）。骨組みは 20261126_manager_allegri を写した。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→日本との接点→マル秘話→見立て。
#
# **題材の選び方（2026-11-21）**：既出22人以外から。トッテナムに17年ぶりのタイトル（2025 EL）、横浜F・マリノスを15年ぶりのJ1優勝へ。日本との接点がいちばん太い監督の1人。
#   **重なりの確認（2026-11-21）**：scripts/・posted.json・picks（1109〜1127）に、ポステコグルーを主題にした本は無い（scripts に名前が出るのは2本だけで、どちらも脇の言及）。
#   同じ日（11/30）の他担当の picks：セリエAのクラブ紹介はローマ。同じ担当の 11/28 はアモリム（同じ日ではない。台本の中でアモリムには触れない＝EL決勝の相手はクラブ名だけ）。
#
# **いまの立場**：アル・ナスル（サウジアラビア）監督。2026-07-03 就任、2年契約。ジョルジェ・ジェズスの後任（英語版 Wikipedia「Ange Postecoglou」、2026-11-21 に action=raw で読んだ。最終更新 2026-11-20）。
#   ○ アル・ナスルのリーグの足元：12試合 9勝1分2敗 勝ち点28、3位（ESPN の順位 API、2026-11-21 に取得）。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（2026-11-20 時点、全大会）。
#   **合計の行（806試合426勝154分226敗）は、行を足した数（807試合427勝151分229敗）と合わない**（アル・ナスルの行だけ更新されて、合計が古い）。**行を足した数を使う。**
#   行：サウス・メルボルン 160試合85勝／オーストラリアU20 34試合23勝（下部組織・年代別なので除く）／パナハイキ 33試合16勝／ウィットルシー 16試合2勝／ブリスベン・ロアー 84試合42勝／メルボルン・ヴィクトリー 32試合15勝／
#   オーストラリア代表 49試合22勝／横浜FM 161試合80勝28分53敗／セルティック 113試合83勝12分18敗／トッテナム 101試合47勝15分39敗／ノッティンガム・フォレスト 8試合0勝2分6敗／アル・ナスル 16試合12勝1分3敗。
#   **トップチーム（U20を除く）**：773試合404勝。勝率 404÷773＝52.3%。
#   セルティック 83÷113＝73.5%／横浜FM 80÷161＝49.7%／トッテナム 47÷101＝46.5%／アル・ナスル 12÷16＝75.0%。サムネの「ほか」は 382試合182勝（サウス・メルボルン・パナハイキ・ウィットルシー・ブリスベン・メルボルンV・豪州代表・フォレスト）。割合はすべて自分で割った。
#   監督のタイトル（トップチーム）14個＝NSL 2・オセアニアのクラブ選手権 1（サウス・メルボルン）／Aリーグ 優勝決定戦 2・レギュラーシーズン首位 1（ブリスベン）／アジアカップ 2015／J1 2019／スコットランドのリーグ 2・カップ 1・リーグ杯 2／EL 2024-25。
#
# **歩み**（英語版）：1965-08-27 アテネ近郊のネア・フィラデルフィア生まれ、1970年（5歳）に家族でメルボルンへ。選手はサウス・メルボルンで193試合（1984〜93）、監督はプスカシュ。27歳でひざのけがで引退。
#   2009-10 ブリスベン・ロアー、2010-11 に優勝＋36試合負けなし（オーストラリアの記録を更新）。2013-10 豪州代表、2015-01 アジアカップ初優勝。2018 横浜FM、2019 J1優勝（15年ぶり）。
#   2021-06 セルティック（欧州の大きなクラブを率いた初のオーストラリア人）、2022-23 国内3冠。2023-07 トッテナム、2025-05-21 EL決勝 1-0 マンチェスター・ユナイテッド（17年ぶりのタイトル、欧州のタイトルは1984年以来）、2025-06-06 解任（就任からちょうど2年）。
#   2025-09-09 ノッティンガム・フォレスト、8試合0勝、2025-10-18 チェルシー戦0-3の19分後に解任（在任39日）。2026-07-03 アル・ナスル。
# **戦術の色**＝2025 EL 決勝（スペイン・ビルバオ）1-0 マンチェスター・ユナイテッド、決めたのはブレナン・ジョンソン（Guardian 2025-05-21 の見出し）。
#   形：4-3-3。選手のころの監督プスカシュの4-3-3を土台に、サイドバックを内側に絞らせて攻めに加える（英語版、本人の話）。
#
# **本人の言葉**：2024-09-15、アーセナルに0-1で負けたあと（BBC Sport「I always win things in second year – Postecoglou」）：
#   “I'll correct myself – I don't usually win things, I always win things in my second year. Nothing's changed. I've said it now. I don't say things unless I believe them.”
#   2025-05-23 優勝パレードで（BBC Sport「Season three better than season two」）：“all the best TV series, season three is better than season two.”
# **2年目の検算（見立て）**：サウス・メルボルン（1996就任）1997-98 優勝／ブリスベン（2009-10途中から）2010-11 優勝／豪州代表（2013-10）2015-01 アジアカップ／横浜FM（2018）2019 J1／セルティック（2021）1年目から2冠、2年目に3冠／トッテナム（2023）2年目にEL。
#   2年目までいたクラブ・代表6つで、6つとも2年目にタイトル。フォレストは39日、アル・ナスルはいま1年目（2年契約なので、2年目が契約の最後の年）。
# **日本との接点**：横浜F・マリノス 2018〜2021-06。2019年に15年ぶりのJ1優勝（ABC News 2019-12-07）。セルティックでは古橋亨梧を獲った最初の年（2021-07-16 加入）、2021-12-19 リーグ杯決勝でヒバーニアンに2-1、2点とも古橋。
#   2023-02-26 リーグ杯決勝（対レンジャーズ 2-1）も古橋が2点。2022-23 シーズン、古橋はリーグ27点で得点王（英語版「Kyogo Furuhashi」）。
# **マル秘話**：父は1967年の軍事クーデターで仕事を失い、一家でオーストラリアへ。法律上の姓は「ポステコス」（10歳のときに両親が短くした）。「父が見て楽しめるチームを作るのが、いつも私の動機」（2018年の話。英語版）。
#
# **入れなかったもの**：私生活（結婚・家族の詳細）、パナハイキ・ウィットルシーの細部、Aリーグの得点など細かい数字、フォレストのオーナーの振る舞い（人を責める話）、ロナウドとの関係（確かめていない）、
#   アル・ナスルのACLの成績（確かめていない）、FotMob、女子、他の監督との優劣。前田大然・旗手怜央のセルティック加入の時期は今回確かめていないので入れない。
