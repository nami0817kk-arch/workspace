- id: japan
  heading: 横浜と古橋亨梧。ポステコグルーと日本は、どこでつながるのか
  tier: 報道
  telop: 2019年、横浜F・マリノスで15年ぶりのJ1優勝
  narrator: 解説
  card: &jp_table
    type: table
    title: ポステコグルーと日本
    columns: [いつ, 何があったか]
    rows:
    - [2019年, 横浜F・マリノスで15年ぶりのJ1優勝]
    - [2021年7月, セルティックに古橋亨梧が加入]
    - [2021年12月, リーグ杯決勝で古橋が2得点]
    - [2023年2月, リーグ杯決勝で古橋がまた2得点]
    highlight_row: 0
  say:
  - text: 日本との縁は、まず横浜です。
    image: assets/images/20261130_manager_postecoglou/03_w.jpg
    card:
      <<: *jp_table
      highlight_row: 0
  - text: ポステコグルーは、2018年に横浜F・マリノスの監督に。
  - text: 2年目の2019年に、リーグを制しました。
    emph: true
    card:
      <<: *jp_table
      highlight_row: 0
  - text: マリノスにとって、2004年以来のリーグ優勝でした。
    card: none
  - text: セルティックに移った最初の夏、古橋亨梧がチームに加わりました。
    card:
      <<: *jp_table
      highlight_row: 1
  - text: 2021年12月のリーグ杯決勝は、2対1。2点とも、古橋です。
    emph: true
    card:
      <<: *jp_table
      highlight_row: 2
  - text: 2023年2月、レンジャーズとのリーグ杯決勝でも、古橋が2点を決めました。
    card:
      <<: *jp_table
      highlight_row: 3
  - text: そのシーズン、古橋はリーグで27点。得点王になっています。
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Ange_Postecoglou
  - https://en.wikipedia.org/wiki/Kyogo_Furuhashi
  - https://www.abc.net.au/news/2019-12-07/ange-postecoglou-wins-j-league-with-yokohama-f-marinos/11777172
- id: secret
  heading: 数字に出ない話。ポステコグルーは、誰のためにチームを作るのか
  tier: 背景
  telop: 選手のころの監督はプスカシュ。父が見て楽しめるチームを
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [1970年, 5歳で家族とオーストラリアへ]
    - [選手のころ, 監督はハンガリーのプスカシュ]
    - [27歳, ひざのけがで、選手を終える]
    highlight_row: 0
  say:
  - text: では、ポステコグルーの、数字の外の話を。
    image: assets/images/20261130_manager_postecoglou/02_w.jpg
    card: none
  - text: 父は、ギリシャで仕事を失い、1970年に、家族でオーストラリアへ渡りました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 選手のころの監督は、ハンガリーの名選手、プスカシュ。父から話を聞いていた人でした。
    emph: true
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 27歳で、ひざのけがのため、選手を終えています。
    card:
      <<: *sec_table
      highlight_row: 2
  - text: 父と過ごした時間は、一緒にサッカーを見に行くときだけだった、と話しています。
    image: assets/images/20261130_manager_postecoglou/03_w.jpg
    card: none
  - text: 父が見て楽しめるチームを作ること。それが、いつも自分の動機だそうです。
    emph: true
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Ange_Postecoglou
- id: view
  viewpoint: true
  heading: 見立て・2年目の約束は、どこまで当たっているのか
  tier: 背景
  telop: 2年目までいた6つで、6つとも2年目にタイトル
  narrator: 解説
  card: &view_table
    type: verdict
    title: 2年目にタイトルを取ったか（自分で数えた）
    columns: [どこで, 判定, 2年目のタイトル]
    rows:
    - [サウス・メルボルン, ○, 1997-98 リーグ]
    - [ブリスベン・ロアー, ○, 2010-11 リーグ]
    - [オーストラリア代表, ○, 2015 アジアカップ]
    - [横浜F・マリノス, ○, 2019 J1]
    - [セルティック, ○, 2022-23 国内3冠]
    - [トッテナム, ○, 2024-25 EL]
    highlight_row: 0
  say:
  - text: 見立てです。2年目までいたクラブと代表を、数えてみました。
    image: assets/images/20261130_manager_postecoglou/03_w.jpg
    card: *view_table
  - text: ポステコグルーは、6つのうち6つで、2年目にタイトルを取っています。
    mark: {"kind": "circle", "row": 5, "col": 1}
    emph: true
    card:
      <<: *view_table
      highlight_row: 5
  - text: 言葉どおりの数字。ただ、2年目までいられなかったのが、フォレストの39日でした。
    card:
      <<: *view_table
      highlight_row: 5
  - text: アル・ナスルでは、16試合で12勝。勝率75.0%です。
    image: assets/images/20261130_manager_postecoglou/02_w.jpg
    emph: true
    card: none
  - text: セルティックのときを、上回る数字。
    card: none
  - text: リーグは、11月21日時点で、12試合を終えて勝ち点28。3位です。
    card: none
  - text: 契約は2年。約束の2年目は、契約の最後の年にあたります。
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Ange_Postecoglou
  - https://site.api.espn.com/apis/v2/sports/soccer/ksa.1/standings
