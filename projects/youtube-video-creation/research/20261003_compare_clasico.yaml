# 通算はクラブ公式（FC Barcelona 2026-05-12）と英語版Wikipedia・365Scores の「264試合 106-52-106」を主に使い、
# 1902年の大会を除く数え方（スペイン語版Wikipedia、263試合でレアル1勝リード）と親善試合込み（307試合）を並べる。
# El Diario NY の「バルサ107勝」は5/10の試合を二重に数えたものと見て使わない。
# 今季の数字は ESPN の順位表（FotMob と一致）と、ESPN の試合記録7試合ずつを自分で足したもの。
# 本人の言葉は入れていない。反応は5/10のクラシコの記事のコメント欄から2件（通算が並んだ夜の声）。久保の話は入れていない。
# 本編46秒までに誰かの言葉を出すため、通算の節を頭に置き、次のクラシコの日程は見立ての前に回した。
