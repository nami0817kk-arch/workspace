# クラブの財政：アストン・ヴィラ（10/20 火、シリーズ「クラブの財政」、key: finance_villa、型は news）。
#
# 軸は「**収入の6割超が『放映権』なのは、なぜか**」。デロイトの「放映権」の欄は、クラブの決算書では
#   ①プレミアリーグなどの放映権の分配（収入の約45%）＋②欧州の大会の分配（約19%）の合計だった（自分で足して、デロイトの額に一致することを確かめた）。
#   ・商業が小さい（収入の18%。デロイトの20クラブで最も低い）ので、放映権の割合が最も高くなる。
#   ・欧州の分配は、欧州カンファレンスリーグ準決勝→欧州チャンピオンズリーグ準々決勝で5.1倍。
#   ・決算書が挙げる最大のリスクは降格。放映権に寄る構造そのものが、資金の見通し（融資枠・親会社の支援）の前提になっている。
#   ・最終損益の黒字1703万ポンドは、子会社2社を同じ親グループの会社へ売った益1億1366万ポンドで出ている。
#   ★他の財政回の軸（バルサ＝使える上限／シティ＝判決／アルテタ＝契約／レアル＝スクワッド・コスト・ルール／PSG＝関連当事者取引／バイエルン＝株の持ち主／リヴァプール＝放映権／マンU＝償却・金融費用／
#     トッテナム＝優勝の年の赤字／シティ×アーセナル＝収入の差と給料の比率／チェルシー＝トッテナムとの差・赤字・人件費比率／インテル＝10位との差・給料を引いた残り）は繰り返さない。
#     リヴァプールの「放映権」の回とは、**割合の比べ（20クラブで最高）と、欧州の分配の内訳、決算の読み方（デロイトと決算書の対応）**で軸を分ける。
#   ★アルファベットは読み上げに出さない。選手名・移籍の話は言わない（**今夏の移籍の数字（支出・収入・収支）は使わない**。選手の売買益の額も言わない）。
#   ★女子チームの話は言わない（売却した子会社2社のうち、台本では倉庫施設の運営権の会社だけを名指しする。もう1社は「子会社2社」の中に含める）。
#
# **決算期**：6月30日決算。2024/25＝2025年6月期（Companies House に 2026-04-12 提出）。前の期は**13か月**（2024年6月30日まで）。
#   ・デロイトの集計は2024/25（2026-01-22 公表）。ヴィラの図：収入 2021 207／2022 211／2023 244／2024 310／**2025 450**（百万ユーロ）、DFML の順位 2022 20位／2023 21位／2024 18位／**2025 14位**。
#   ・クラブの2025/26 の決算書は**未提出**（提出履歴の最新は2025年6月期。2026-10-19 に確認）。
#
# **出どころ（読んだもの）**:
#   ○ **デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com）**：ランキング 14位アストン・ヴィラ（13位アトレティコ・15位ミラン）。クラブごとの図（e.infogram.com の図の中身）から：
#       ヴィラ 試合日・放映権・商業・給料（百万ユーロ）：2021 1・177・29・155.5／2022 26・146・39・162.4／2023 33・175・36・229／2024 52・215・43・299／**2025 80・287・83・318**。
#       給料÷収入 75・77・94・96・**71**（%）。ピッチ上：プレミア6位／欧州チャンピオンズリーグ準々決勝。（デロイトの注記：女子チームの収入は連結していない。）
#       本文：11〜20位の平均は、放映権が収入の49%（上位10は3分の1）。商業は上位10が48%、11〜20位が32%。11〜20位の平均収入404、上位10の平均837。
#       ★20クラブの図を全部読んで自分で割った：放映権の割合 1位ヴィラ63.8%／2位ウェストハム57.2%／3位ベンフィカ52.3%／4位インテル51.5%…最低バルセロナ24.9%。
#         商業の割合 最低ヴィラ18.4%（次いでベンフィカ25.4%・ウェストハム25.7%・インテル28.4%）…最高バイエルン53.6%。レアル・マドリードの商業594÷ヴィラ83＝7.2倍。
#         （シュツットガルトの図は放映権121・商業106・試合日70で、同じ形で読めた。）
#   ○ **Companies House の決算書（監査済み・いずれも画像のPDFを目で読んだ）**:
#       ・NSWE Sports Limited（05891280）グループ決算 2025年6月期（2026-04-12 提出）**＝デロイトが使った連結の収入**。
#           収入 **3億7807万ポンド**（前の期 13か月 2億7570万）。内訳（注4）：試合日 38.452／放映権（プレミア・EFLの分配）**170.717**／スポンサー 28.646／商業 70.021（選手の貸し出し料 7.863 を含む）／欧州（UEFAの分配）**70.232**（百万ポンド）。
#           前の期：28.009／170.718／21.895／41.383／13.690。KPI：プレミア6位（前 4位）・欧州CL準々決勝（前 欧州カンファレンスリーグ準決勝）・FAカップ準決勝・平均観客41,772。
#           営業損益（選手売買を除く）−41.346／最終損益 +17.033（税引前も同じ）。**子会社売却益 +113.664**（注9：2025年6月に子会社2社を NSWE Holding Limited＝NSWE UK Limited の子会社、へ売却。
#             売却額 75.0＋55.0＝130.0、純資産 3.336、偶発債務 13.0を引いて 113.664。うち1社はヴィラ・パークの倉庫施設の運営権の会社）。**関連当事者取引で、プレミアリーグが公正価値を審査**、売却契約に額の調整条項（注9）。
#           株式発行による現金流入 **94.0**（前の期 148.2）。純資産 321.1。人件費 273.4（前の期 256.8）。
#           取締役の報告（継続企業）：**ゴールドマン・サックスの融資枠が2027年7月まで**／親会社 **V Sports S.C.S.（ルクセンブルク）の継続的な財政支援**／降格の可能性は「remote」だが、降格なら選手売買の増加か「まだ約束されていない追加の株主支援」が要る／
#             これ以上の支出は資金確認なしに約束しない。戦略報告：ノース・スタンド再開発の計画承認、**2028年欧州選手権の前に完成予定**。主要リスク＝降格。
#       ・Aston Villa Football Club Limited（03375789）単体 2025年6月期：収入 3億5928万ポンド（内訳は上と同じ区分。商業 51.230）。単体の損益は使わない（グループの一部）。
#       ・Aston Villa FC Limited（02502822）単体：収入 3億1008万ポンドは「グループ会社との取引契約によって決まる」＝グループ内取引。**台本には使わない**。
#   ○ **ヨーロッパ中央銀行の参照相場（frankfurter 経由）**：2024-07-01〜2025-06-30 の日次の平均 1ユーロ＝0.8405ポンド（1ポンド＝1.1897ユーロ）。
#       ★検算：3億7807万×1.1897＝4億4980万ユーロ ≒ デロイト450。2億4095万（放映権170.717＋欧州70.232）×1.1897＝2億8665万 ≒ デロイトの放映権287。
#   × クラブ公式サイト（avfc.co.uk）の決算発表は読んでいない（決算書の原本が一次）。報道は使っていない。
#   × 2026年7月の動き（Companies House の提出履歴に、7月の増資・担保の登録、8月の担保の解除、ナセフ・サウィリス氏の支配株主の登録の終了〈7月7日〉がある）は、中身を読めていない。**台本では触れない**。
#   × ヴィラの決算書の「放映権」にある「成績配分」の仕組み（均等配分・施設料）は、プレミアリーグの公式資料を読めていない。**台本は決算書の注記の言い方（成績配分を含む）までに留める**。
#
# 自分で計算した数（コードで検算した）:
#   デロイト：450÷310＝+45.2%（+140）。放映権 287÷450＝63.8%（約64%）。商業 83÷450＝18.4%（約18%）。レアル商業 594÷83＝7.2倍。
#   決算書：(170.717＋70.232)＝240.949 → ÷378.068＝63.7%（約64%）。170.717÷378.068＝45.2%（約45%）。70.232÷378.068＝18.6%（約19%）。70.232÷13.690＝5.13倍（約5.1倍）。
#     240.949のうち欧州の分 70.232÷240.949＝29.2%（約3割）。残り（試合日・スポンサー・商業）378.068−240.949＝137.119（36.3%）。
#     欧州を引いた収入 378.068−70.232＝307.836 → 放映権 170.717÷307.836＝55.5%（約55%）。
#     17.033−113.664＝−96.631 →「9663万ポンドの赤字」（選手の売買の損益を含む。額は言わない）。
#   見立て：11〜20位の平均の商業割合 32% を450に掛けると 144 → 144−83＝61（約6100万ユーロ、試算）。
#
# **言い切っていないもの / 言わなかったもの**:
#   ・デロイトの「放映権」に欧州の分配が含まれるのは、決算書の合計との一致（換算レートの平均で検算）で確かめた。デロイトの定義文は読めていない。
#   ・プレミアの放映権が前の期と同額なのは、前の期が13か月だったことを断る。順位が4位から6位に下がったことは決算書のKPI。額の理由は言わない。
#   ・デロイトの試合日（80）と決算書の試合日（38.452 ポンド＝約46百万ユーロ）が違うのは、デロイトが商業の中の催し・飲食を試合日に入れているためと思われる（読めていない）。**この2つは並べない**。
#   ・子会社売却益の「公正な価格か」はプレミアリーグの審査次第（決算書の注記まで）。違反や不正の話はしない。
#
