# フヴィチャ・クヴァラツヘリア（パリ・サンジェルマン／ジョージア代表）の紹介。選手紹介の8節の型（2026-09-28）。
# 2026-10-17 の「シリーズ8本」の2枠目。**FotMob は使わない**（ユーザー決定 10/17）ので、雛形（player_intro.py の FotMob 部分）は使わず手で書いた。
# パーセンタイル・同じ位置との順位・レーダー・シュートマップは出さない。数字は基本の数と自分で割った90分あたり。
#
# **数字の出どころ**
# - Transfermarkt（API: /player/502670 の詳細・市場価値の推移・季ごとの大会別の出場）：生年月日・身長・契約・市場価値・季ごとの試合/得点/出場時間。
#   **アシストは使わない**：TM は22/23のセリエAで13（公式・Wikipedia は10）、25/26のCLで7（UEFA は6）と、公式より多く数える。
# - UEFA.com（Player of the Season 記事・CLの記録の記事）：25/26のCL 16試合・1,141分・10得点・6アシスト・走行124.17km・最高速度33.7km/h、
#   CL通算の相手別得点、「ノックアウト7試合連続で得点かアシスト」の最多記録、ジョージア人初の年間最優秀選手。
# - 英語版 Wikipedia（Career statistics／Honours／本文）：クラブ別・代表の試合と得点（クラブは2026-10-14、代表は2026-10-05時点）、優勝歴、主将就任（2026-03-24）、
#   ルスタヴィ移籍の経緯、2022年のバトゥミ経由。
# - ESPN（site.api.espn.com の試合記録・順位表）：直近の試合の出場・ゴール・アシスト・交代の時刻・スコア。セリエAの順位（22/23 ナポリ1位90点／23/24 10位53点／24/25 1位82点）。
# - Reuters（Flashscore 転載 2024-06-27・2025-01-11）：EURO2024 のポルトガル戦の本人の言葉、コンテの退団要求の発言。
# - AFP（SuperSport 転載 2025-01-17）：PSG 加入の発表、本人の言葉、報道の移籍金7000万ユーロ。
# - calciomercato.com（2025-01-18・2022-06-30）：PSG 公式発表の全文、ナポリが受け取る7000万ユーロ（分割）、年俸の報道（ナポリ170万・更新の提示400万・PSG900万、手取り）、代理人の言う2022年の移籍金1000万。
# - CBS Sports（2024-06-17）：代理人「チャンピオンズリーグに出るチームへ」、クラブ声明「非売品」。
# - Corriere della Sera 7 誌（Cronache della Campania 転載 2025-08）：デ・ラウレンティス会長の説明（FIFAの第17条）。**クラブ側の一方の言い分**として扱う。
# - Soccerway（2025-01-16 の別れの動画の全文）・Sky Sport（Italpress・Quotidiano 転載 2026-04-27）：本人の言葉。
# - 取材はブラウザの道具・JavaScript実行を使っていない（requests と WebFetch）。BBC・Ahram・Dhaka Tribune・UEFA本体は requests が弾かれ、UEFA は WebFetch で読んだ。
#
# **数字の食い違い・判断**
# - 25/26 のCLのアシスト：UEFA 6／TM・Nogomania 7。UEFA を採った（語りでは10得点を主に言い、アシストは言わない）。
# - 移籍金：PSG もナポリも公式には金額を出していない。「報道で7000万ユーロ（ボーナス別）」。Wikipedia は最大8000万。
# - 2022年の移籍金：本人の代理人が1000万と言った（calciomercato）。Wikipedia は1000〜1200万。「報道で1000万」。
# - 退団の理由は**本人が語っていない**（別れの動画で「いつかすべてを話す」と言ったまま）。伝わっているのは ①2024年6月に代理人が「CLのあるチームへ」と発言
#   ②契約更新が決まらなかった（コンテ） ③クラブ側は代理人が第17条を持ち出して迫ったと説明（会長）。どれも報道・一方の言い分なので、断定せず並べる。
# - 年俸は報道（手取り）。1,000万単位の私的な額なので、語りには「400万と900万」とだけ出す。
# - 「ジョージア人初のCL年間最優秀選手」：UEFA の記録の記事の記述。
# - 優勝の数「9つ」：Wikipedia の優勝歴から自分で数えた（リーグ・アン2・クープ・ドゥ・フランス1・トロフェ・デ・シャンピオン1・CL2・UEFAスーパーカップ2・インターコンチネンタルカップ1）。
#   ナポリ在籍中は22/23のスクデット1つ（24/25の優勝は退団の4か月後）。
# - 90分あたり：得点÷出場時間×90（出場時間は Transfermarkt、得点は Wikipedia と一致）。CL通算の出場時間は ナポリ22/23の700分＋23/24の672分、PSG 24/25の736分＋25/26の1,140分（UEFAは1,141分）＋26/27の24分。
#
# **入れなかったもの**：私生活（結婚・子ども）。ジョージアがW杯に出られなかった件（読んだ出典が無い）。ナポリの会長の「代理人が高い手数料を求めた」の部分（一方の言い分で、個人攻撃に近い）。
#   「クヴァラドーナ」の呼び名はフックで1度だけ。
#
# **日本語名・読みで怪しいもの**：フヴィチャ・クヴァラツヘリア（日本語版Wikipedia＝Wikidata の表記。報道では「クバラツヘリア」も）。ルスタヴィ・バトゥミ・ルビン・カザン・ロコモティフ・モスクワ・ミカウタゼ。
#
# 本人の言葉は5か所（自訳。原文は上の出典）：①フック「つらいけれど〜」「決め手はプロジェクト」②ナポリの別れ「家だった」「いつかすべてを話す」「ディエゴ」③ポルトガル戦「ロナウドのユニフォーム」「最高の日」「個人はいない」④ルイス・エンリケ「自由」「選択を誇りに」。
