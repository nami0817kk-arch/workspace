  - https://www.flashscore.com/news/soccer-euro-kvaratskhelia-celebrating-best-day-of-his-life-after-historic-win-and-ronaldo-shirt-swap/zoEM2KED
  - https://www.skysports.com/football/news/13157537/euro-2024-georgia-2-0-portugal-khvicha-kvaratskhelia-scores-as-willy-sagnols-side-reach-last-16
- id: view
  heading: ナポリの2年半と、PSGの1年9か月を数えると
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月26日、バロンドールの発表
  card:
    type: table
    title: ナポリとPSG、チャンピオンズリーグの比べ
    columns: [項目, ナポリ, PSG]
    rows: &cmp_rows
    - ['在籍', '2年半', '1年9か月']
    - ['優勝', '1つ', '9つ']
    - ['CLの試合', '17', '26']
    - ['CLの得点', '2', '13']
    - ['90分あたり', '0.13', '0.62']
    source: Wikipedia・Transfermarkt・UEFA
  say:
  - text: 最後に、ナポリとパリ・サンジェルマンを、同じ物差しで並べてみます。
    image: assets/images/20261017_kvaratskhelia/03_w.jpg
    card: &cmp_card
      type: table
      title: ナポリとPSG、チャンピオンズリーグの比べ
      columns: [項目, ナポリ, PSG]
      rows: *cmp_rows
      source: Wikipedia・Transfermarkt・UEFA
      highlight_row: 0
  - text: ナポリは2年半でスクデット1つ。パリ・サンジェルマンは1年9か月で9つ。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: ナポリも24/25に再びスクデット。勝ち点82、インテルに1点差。
    card: none
  - text: 欧州の舞台。ナポリは17試合2得点、パリは26試合で13得点。
    card:
      <<: *cmp_card
      highlight_row: 3
  - text: 90分あたりに直すと、0.13から0.62。およそ4.7倍です。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 4
    mark: {kind: circle, row: 4}
  - text: 本人は、パリを選んだ自分を、こう振り返ります。
    card: none
  - voice: クヴァラツヘリア
    text: ここに来たという、自分の決断を、誇りに思っています。
  - voice: クヴァラツヘリア
    text: パリでプレーできて、とても幸せです。
    cont: true
    pause: 0.6
  - text: 次の節目は、10月26日。ロンドンで、バロンドールが発表されます。
    image: assets/images/20261017_kvaratskhelia/08_w.jpg
    card: none
  - text: 候補30人のうち、パリ・サンジェルマンの選手が最多。彼も、その1人です。
    card: none
  - text: 去った理由が分かる日は、まだ先。選んだ道の結果は、もう数字に出ています。
    card: none
