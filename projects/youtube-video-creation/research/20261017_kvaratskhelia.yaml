- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: マラドーナの壁画と、ロナウドの写真
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['2025年1月', ナポリへの別れを、動画で語った]
    - ['2024年6月', 憧れの選手と、同じ試合に立った]
    source: 各報道
  say:
  - text: パリ・サンジェルマンのクヴァラツヘリア。数字の外に、2つの話があります。
    image: assets/images/20261017_kvaratskhelia/08_v.jpg
    short_only: true
    card: none
  - text: 1つ目は、ナポリの別れ。夜中に、マラドーナの壁画へ。
    image: assets/images/20261017_kvaratskhelia/07_w.jpg
    card: none
  - text: ディエゴとは、マラドーナのこと。壁画の前で、こう語りました。
    card: none
  - voice: クヴァラツヘリア
    text: ディエゴは、ナポリの人々の心の中で生きている。
  - voice: クヴァラツヘリア
    text: ここに来ると、その意味が、強く分かります。
    cont: true
    pause: 0.6
  - voice: クヴァラツヘリア
    text: ナポリは、僕の家でした。
  - voice: クヴァラツヘリア
    text: 来たときは、ほとんど誰も知らない少年でした。
    cont: true
  - voice: クヴァラツヘリア
    text: いまは大人として、多くの愛とスクデットを胸に、去ります。
    cont: true
    pause: 0.6
  - text: 2つ目は、憧れの選手の話。2024年6月、ヨーロッパ選手権です。
    image: assets/images/20261017_kvaratskhelia/08_w.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 1
  - text: 試合前、2013年の写真が広まります。ロナウドを囲む少年たちの中に、彼がいました。
    card:
      <<: *story_card
      highlight_row: 1
  - text: グループの最終戦。開始2分、決めたのはクヴァラツヘリア。
    image: assets/images/20261017_kvaratskhelia/02_w.jpg
    emph: true
    card: none
  - text: 2対0。初めての大舞台で、ジョージアは決勝トーナメントへ。試合後の、本人の言葉。
    card: none
  - voice: クヴァラツヘリア
    text: ロナウドのユニフォームを手に入れた。
  - voice: クヴァラツヘリア
    text: 次のラウンドにも進んだ。ジョージア人にとって、最高の日です。
    cont: true
  - voice: クヴァラツヘリア
    text: 個人の最優秀選手はいない。チームの力でした。
    cont: true
    pause: 0.6
  - text: 憧れの人と同じピッチで、国の歴史を動かした主将です。
    pause: 0.5
    card: none
  quotes_from:
  - https://it.soccerway.com/news/calcio-serie-a-parla-kvara-saluta-napoli-in-modo-criptico-e-stata-casa-mia-un-giorno-vi-raccontero-video/CnpntNl4
  - https://www.flashscore.com/news/soccer-euro-kvaratskhelia-celebrating-best-day-of-his-life-after-historic-win-and-ronaldo-shirt-swap/zoEM2KED
