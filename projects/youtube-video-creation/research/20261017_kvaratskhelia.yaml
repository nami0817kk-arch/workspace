  - text: 2019年にロシアのルビン・カザンへ。2季続けて、リーグの最優秀若手に選ばれます。
    card:
      <<: *career_card
      highlight_row: 2
  - text: 転機は2022年3月。ウクライナ侵攻で、ロシアの国外選手は契約を止められるように。
    image: assets/images/20261017_kvaratskhelia/05_w.jpg
    card: none
  - text: ジョージアのバトゥミへ。ルビンの3季で9得点。ここでは11試合で、8得点です。
    emph: true
    card:
      <<: *career_card
      highlight_row: 3
  - text: 7月、ナポリへ。代理人によれば、移籍金は1000万ユーロ。
    image: assets/images/20261017_kvaratskhelia/07_w.jpg
    card:
      <<: *career_card
      highlight_row: 4
  - text: 1年目。開幕のヴェローナ戦から、2試合で3得点。ナポリ史上初です。
    card:
      <<: *career_card
      highlight_row: 4
  - text: セリエAの最優秀選手に。ナポリはその年、リーグを制します。
    emph: true
    card:
      <<: *career_card
      highlight_row: 4
  - text: ファンはマラドーナにちなんで、こう呼びました。
    callword: クヴァラドーナ
    card: none
  - text: では、なぜ去ったのか。伝わっている話を、時間順に。
    card: &why_tl
      type: timeline
      title: 退団までの経緯（報道）
      rows:
      - ['2024年6月', 代理人「CLに出るチームへ」]
      - ['2025年1月11日', コンテ監督が退団の希望を認める]
      - ['2025年1月16日', 本人が別れの動画を公開]
      - ['2025年1月17日', PSGが加入を発表]
      focus: 0
      highlight_row: 0
  - text: まず2024年6月。代理人が、こう語ります。
    card: *why_tl
  - voice: マムカ・ジュゲリ
    text: 優先したいのは、チャンピオンズリーグに出るチームだ。
    emph: true
    pause: 0.5
  - text: ナポリは23/24を10位で終え、欧州の舞台に立てませんでした。
    card: none
  - text: 2025年1月11日、コンテ監督が、退団の希望を認めます。
    image: assets/images/20261017_kvaratskhelia/04_w.jpg
    card:
      <<: *why_tl
      highlight_row: 1
  - text: 更新は決まらず。報道では、手取りの提示はナポリ400万、パリは900万ユーロ。
    card: none
  - text: 会長は、代理人が国際サッカー連盟の第17条を持ち出した、と話します。
    card: none
  - text: 違約金を払えば契約を解除できる、という規則です。
    card: none
  - text: 伝わる理由は、2つ。欧州の舞台と、契約の更新です。
    card: none
  - text: 本人の言葉は、まだありません。一方の言い分と、報道だけです。
    emph: true
    card: none
  - text: 1月17日、パリ・サンジェルマンが発表。ジョージア人として、クラブ初の選手。
    card:
      <<: *career_card
      highlight_row: 5
  - text: 加入の日、本人は、こう話しました。
    card:
      <<: *career_card
      highlight_row: 5
  - voice: クヴァラツヘリア
    text: 決め手は、プロジェクトでした。
  - voice: クヴァラツヘリア
    text: クラブが目指すものも、僕に合っています。
    cont: true
  - voice: クヴァラツヘリア
    text: 選手との向き合い方も、同じです。
    cont: true
    pause: 0.6
