      focus: 0
  - text: 準決勝の前の、本人の言葉。
    image: assets/images/20261017_kvaratskhelia/04_w.jpg
    card: none
  - voice: クヴァラツヘリア
    text: ルイス・エンリケは、攻撃の選手に大きな自由をくれる。
  - voice: クヴァラツヘリア
