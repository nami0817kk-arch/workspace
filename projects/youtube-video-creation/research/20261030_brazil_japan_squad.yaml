# 取材メモ（2026年10月30日）ブラジル代表が日本戦（11/14）に向けた26人を発表。ニュースのショート。型 Y（アンチェロッティ監督の言葉）
# 取材: 2026-10-30。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。
#   ・サッカーキング 2026-10-30「ブラジル代表、11月の日本戦に臨むメンバー26名を発表！」（https://www.soccer-king.jp/news/japan/national/20261030/2222497.html 全文）:
#       CBFが29日、11月のシンガポール遠征の26人を発表。日本戦は11月14日（土）日本時間19時15分、シンガポール戦は17日（火）19時。
#       国内組は「クラブとの事前協議を経て、ダニーロ（ボタフォゴ）らブラジル国内組6名がメンバー入り」。アラン（マンC）ら5名が初招集。
#       名簿（所属つき）が全員分ある。
#   ・ゲキサカ 2026-10-30「森保Jとの再戦に臨むブラジル代表メンバー26人発表!!」（https://web.gekisaka.jp/news/japan/detail/?462063-462063-fl 全文）:
#       W杯ラウンド32の日本戦に出た選手のうち7人（先発 ヴィニシウス・ガブリエル・ドグラス・サントス・ブルーノ・ギマランイス・ラヤン、途中出場 ダニーロ・エンドリッキ）が招集。
#       初招集5人の年齢: アラン22歳（マンC）・マルロン・ゴメス22歳（シャフタール）・アリソン・サンターナ21歳（シャフタール）・ジョナタン・ジェズス22歳（クルゼイロ）・アンドレ・ルイス20歳（コリンチャンス）。
#       日本にとって昨年10月のキリンチャレンジ杯（3-2で日本の勝ち）、今年6月のW杯ラウンド32（1-2）に続き、1年間余りで3度目のブラジル戦。
#       9月に招集されたマルキーニョス（PSG）とジョアン・ペドロ（チェルシー）は負傷のため選外。
#   ・サッカーキング 2026-10-30「アンチェロッティ監督、日本戦へ『興味深く、厳しい試合になる』」（https://www.soccer-king.jp/news/japan/national/20261030/2222730.html 全文）:
#       26人のうち23歳未満が15人。監督は会見で「バランスが取れていて、非常に若いチームです。オリンピック世代の選手が9人、23歳未満の選手が15人います。将来を強く見据えたチームです」。
#       日本について「日本代表については、よく分かっています。非常に競争力があり、組織的なチームです。以前に日本で行った国際親善試合でも、ワールドカップでも、その力を示していました。
#       我々にとって興味深く、厳しい試合になるでしょう。勝利を目指して戦わなければならない相手です」。
#   ・サッカーキング 2026-10-30「ブラジル代表、11月の日本戦は主将マルキーニョス不在…」（https://www.soccer-king.jp/news/world/southamerica/20261030/2222726.html 全文）:
#       マルキーニョス（PSG）はブラジル代表のキャプテンで歴代6位の112キャップ。CLのバルセロナ戦で右太ももを負傷し途中交代していた。
#       首位フラメンゴのサムエウ・リーノらは招集見送り。9・10月の招集から外れた選手にペドロ（フラメンゴ）。
#   ・フットボールチャンネル 2026-10-30（https://www.footballchannel.jp/2026/10/30/post1042731/ 全文。ブラジルメディア『Terra』経由＝報道）:
#       監督「次の親善試合では、オーストラリア戦と同じような形になると思う。エンドリッキ、ラフィーニャ、ヴィニシウス……。複数のポジションでプレーできる選手がいることも考慮しなければならない」
#       「今後の試合でも、中盤3人という考え方を継続していく」。「マルキーニョス、ガブリエウ・マガリャンイス、ブルーノ・ギマランイス、ヴィニシウス、ラフィーニャ……。彼らは今後数年間、ブラジル代表の中心となる選手たちだ」。
#       ※記事は「29日の再戦」と書くが日付の意味が曖昧（9月の再戦のことと読める）。台本では使わない。
#   ・ESPN（content.core.api.espn.com 見出し・要約のみ。AP配信）: 「アンチェロッティは若さに大きく傾いた招集で代表の刷新を続ける」。
#   ・A Bola（ポルトガル語、本文冒頭を読んだ）: 見出し「アンチェロッティ、5人のデビューで驚かせる」。日本側の記事と同じ内容で、新しい事実は無かったので使っていない。
# 【自分で数えたもの（名簿の所属から）】26人の所属国: イングランド9（ガブリエウ・ブルーノ=アーセナル2、ジャイール・クーニャ=フォレスト、ヴィトール・レイス・アラン=マンC2、アンドレイ・サントス=マンU、ジョアン・ゴメス=ヴィラ、エステヴァン=チェルシー、ラヤン=ボーンマス）／
#   ブラジル国内6（ペドロ・モリスコ・アルトゥール・ディアス・ジョナタン・ジェズス・アンドレ・ルイス・ダニーロ・ガブリエウ・ボンテンポ）／スペイン3（ヴィニシウス・エンドリッキ・ラフィーニャ）／イタリア3（ルーカス・ペリ・カルロス・アウグスト・ウェズレイ）／
#   ウクライナ2（マルロン・ゴメス・アリソン・サンターナ）／サウジ1（ベント）／ロシア1（ドウグラス・サントス）／モナコ1（ヴァンデルソン）= 26。ポジション内訳 GK3・DF9・MF7・FW7。
#   「9月・10月は国内組が11人」は10/27 の本（ゲキサカ 10/26 の報道）の数字。今回の6人と比べるだけに使う（確度は報道止まり）。
# 確度: 26人の名簿・日本戦の日時・初招集5人は確定（CBF発表を日本の媒体が伝達。CBF公式サイトは見ていない→「確定」でなく報道扱いにとどめる）。監督の言葉は報道（会見の発言を日本の媒体が訳したもの。先発構想はTerra経由で報道止まり）。
# 【言わないこと】媒体名／「日本が勝てる」などの予想／ヴィニシウスらの個人成績／10/27 の本で言った「第36節」「フラメンゴ4人」の細部／9月の若手優先の発言／日本の初勝利の細部。
# 本人の言葉: アンチェロッティ監督の会見の言葉は実在（上）。選手の言葉は無い。→ 型 Y（監督の言葉）。
# 反応: 0件（作らない。approve は --no-voices）。
