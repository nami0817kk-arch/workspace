      - https://www.nottinghamforest.news/2026/02/02/nottingham-forest-miss-out-on-last-gasp-transfer-deadline-day-deal-for-20m-star/

  - id: summer
    heading: こじれた夏
    main: true
    tier: 報道
    bg: assets/backgrounds/sano_20260918.png
    telop: 「プレーしない」と自ら申し出て、論争になった
    narrator: 解説
    say:
      - {short_only: true, text: PSVの佐野航大が、断られた移籍についてオランダの専門誌に語った話です。}
      - NECのディレクターが、テレビ番組でこう話しました。
      - {voice: NECのディレクター, text: あと2試合はプレーすると、全員で取り決めていた。皆それを知っていた}
      - 8月8日、佐野のPSVへの移籍が発表されます。
      - その直前、チャンピオンズリーグ予選を控えたNECで、
      - "**佐野は自分から「プレーしない」と申し出て、遠征から離れていました。**"
      - {voice: 佐野航大, text: プレーできないと監督に伝えるのが、僕には信じられないほど難しかった。NECを愛しているから}
    official: false
