  - id: voices
    heading: あのとき、どう見られていたか
    tier: 未確認
    bg: assets/backgrounds/sano_20260918.png
    telop: 「プロとしての姿勢がない」
    narrator: キャスター
    say:
      - この夏、あの欠場が報じられたとき、どう見られていたか。
      - {voice: 現地サポ, text: 人間としての佐野には失望した。ようやくチャンピオンズリーグでプレーできるチャンスをつかんだ今の雇い主のために、オリンピアコス戦でプレーしないとは}
      - {voice: 現地サポ, text: プロとしての姿勢がない}
      - {voice: 現地サポ, text: 2連戦のあとなら出ていい、という取り決めがあった。それを守らなかったのは残念だ}
      - {voice: 現地サポ, text: それならTDに文句を言えばいい。初戦の当日に彼を売ったのは、そのTDだ}
      - 日本からも、多くの声が出ています。
      - {voice: ネット民, text: クラブレコードの移籍金を残してくれる選手に対して、どうして最後に裏切られたみたいな言い方をするのか不思議です}
      - {voice: ネット民, text: これだけ貢献してくれた佐野選手に対して、もっとリスペクトを持った対応をして、送り出して欲しかったです}
      - {voice: ネット民, text: これで佐野を責めるのはおかしいよ}
      - {voice: ネット民, text: 冬から数えて、今夏までいくつの移籍話がダメになったか。航大は今夏では最後のチャンスと思ったのだろう, short_voice: true}
      - {voice: ネット民, text: 怪我でもして破談になるのは絶対に避けたかったと思う, short_voice: true}
      - {voice: ネット民, text: 移籍金を置いていくのだから、お互い気持ちよく別れてほしい, short_voice: true}
