  - id: winter
    heading: 断られた冬
    tier: 報道
    bg: assets/backgrounds/sano_20260918.png
    telop: アヤックスとフォレストが出した金額を、NECが断った
    narrator: キャスター
    card:
      type: table
      title: 昨季の冬に届いた話
      columns: ["", ""]
      rows:
        - ["アヤックス", "1250万ユーロ＋出来高 → NECが拒否"]
        - ["ノッティンガム・フォレスト", "2000万ユーロ → NECが拒否"]
    say:
      - 佐野航大、22歳。本人がオランダの専門誌に、昨季の冬のことを語りました。
      - アヤックスが**1250万ユーロ**に出来高を付けて動き、所属していたNECはこれを断ります。
      - さらに市場の最終日、イングランドのノッティンガム・フォレストがさらに高い額を用意しました。
      - "**これも断られています。**"
      - 当時のことを、本人はこう振り返りました。
      - {voice: 佐野航大, text: あれはつらい時期でした。行きたかったのですが、できなかった}
      - {voice: 佐野航大, text: 冷静さを保ち、その決断を理解しようと努めました}
    official: false
    sources:
