  - id: now
    heading: そして9月17日
    tier: 確定
    bg: assets/backgrounds/sano_20260918.png
    telop: 兄弟そろっての招集が、正式に決まった
    narrator: キャスター
    say:
      - 自分の役割について、本人はこうも話しています。
      - {voice: 佐野航大, text: 6番としてプレーするのは最高です。ボールに多く触れるので}
      - {voice: 佐野航大, text: でも正直に言えば、それも単なる数字にすぎません。前に上がることもできるし、そうしたいとも思っている}
      - このインタビューの翌日、日本代表の31人が発表されました。
      - "**31人の中に、佐野航大と、兄の佐野海舟が並びました。**"
      - 兄弟がそろって代表に呼ばれたのは、2025年6月以来です。
      - 断られた冬から、揉めた夏を経て、いま代表の31人の中にいます。
    official: true
