# 佐野航大、断られた2000万ユーロ（2026-09-18）
#
# **昨日の回と重なるところを、全部外してある**（2026-09-18）。
# `20260917_sano.md`「佐野航大がW杯に選ばれなかったとき、何を思っていたか」が
# **同じVIのインタビュー**を使っていて、次のものは**昨日すでに読み上げ済み**:
#   ・「4年後には、兄と一緒に日本代表の中盤でW杯に立ちたいです。佐野と佐野」
#   ・PSV移籍／2031年までの契約／9月13日の移籍後初ゴール
#   ・兄の佐野海舟がマインツにいること／双子ではないこと
# **どれも使わない。**この回で出すのは、昨日に無かった3つだけ:
#   ①昨季の冬の破談（アヤックス1250万・フォレスト2000万）と「行きたかったができなかった」
#   ②夏の退団のこじれ（CL予選の自主辞退とNECディレクターの反発）
#   ③兄弟同時選出が**確定した**こと（昨日は「まだ発表されたわけではありません」だった）
#
# **見出しに釣られない。**Football Tribe は「でも正直に言えば…」と
# 「移籍したかったのですが…」を並べているが、**この2つは別の話**。
# 前者は**6番というポジション**の話、後者は**昨季の冬の破談**の話。
# くっつけると誤報になる。元記事（Voetbal International、9月16日、Marco Timmer）で確認した。
#
# **佐野は代表選出について何も語っていない。**インタビューは9月16日公開で、
# JFAの発表は17日。**発表の前日**。「選ばれてこう話した」とは書けない。
#
# 引きは**夏の退団のこじれ**（@main）。CL予選を自ら辞退し、NECのディレクターが
# 「約束が破られた」と反発した。本人は「NECを愛しているから」と話している。
#
# **Football Tribe の「昨2025年冬」は誤り。**正しくは2026年1〜2月。
# 台本では**「昨季の冬」**と書く。
#
# **Football Tribe は発言の後半2文を落としている。**全文は VI の原文から取る。
#
# **ボス監督本人の発言は無い。**蘭ESPNが「ボス監督の理想的なMF」と分析している
# だけで、本人の言葉ではない。**使わない。**
#
# **サムネはエンブレム2つ。**Commons に佐野航大の写真は無く、
# 同名の野球選手（佐野皓大）しか出てこない（被写体の照合が止めた）。
# 兄弟の話なので PSV とマインツを並べる
# **下地は本人の写真**（2026-09-18 ユーザー指摘「一瞬だけ背景が変わった」）。
# 写真は山場の節から出るので、それまでの節は下地が見えている。
# 既定は `stock/match_stadium.mp4` ＝**ヴォルフスブルクのスタジアム**で、
# LEDの看板にクラブ名が読める。既定も差し替えたが、この回は本人の写真を敷く
