title: 9月26日の題材（4回目）
lead: 16時までに出た見出しから15件
note: <b>○×を付けてください。</b>今日すでに出した題材（ジダンとムバッペ・イタリア・マンC・メッシ・FIFA）と、やめた題材（ロドリ・ククレジャ・スウェーデン）は入れていません。<br><br>ロマーノの投稿は、手元の Chrome に接続できず今回は読めませんでした。移籍の話はフィードから拾っています。<br><br>⑤⑦は<b>今夜の試合</b>なので、○なら試合のあとに作ります。<br><br>中身はまだ<b>見出しだけ</b>です。○が付いたものから記事本文で裏を取ります。
items:
- num: 1
  slot: 日本人
  head: 久保建英、4万人超えの観衆に「むしろブーイングをして」。異例の注文
  why: '「こっちの後押しをしてほしい」と前置きしたうえでの言葉、という見出し。**本人の言葉**がある。

    元記事はまだ当たっていない（まとめサイトの見出し）。

    '
  src: まとめサイト（9/26）
  url: https://footballnet.2chblog.jp/archives/60071103.html
  fmt: quote
- num: 2
  slot: 日本人
  head: 伊東純也「自覚はあまりない」。日本代表の歴代アシストで首位タイに並んだ本人の本音
  why: '歴代アシスト数で首位タイ。その記録について本人が語った、という見出し。**本人の言葉**がある。

    '
  src: Football Tribe（9/26）
  url: https://football-tribe.com/japan/2026/09/26/359729/
  fmt: quote
- num: 3
  slot: 日本人
  head: 田中碧、W杯のあと表で語らなかった理由。「ひとりで…」
  why: 'W杯後にメディアで話す場面が少なかったことを突っ込まれて、本人が答えた、という見出し。**本人の言葉**がある。

    '
  src: Football Tribe（9/26）
  url: https://football-tribe.com/japan/2026/09/26/359731/
  fmt: quote
- num: 4
  slot: 日本人
  head: 中国メディア「日本の勝利は運ではなく技術。我々には運の要素すらない」。ウルグアイ戦を見て
  why: '日本のウルグアイ戦を、中国の媒体が自国と比べて書いた、という見出し。**海外の反応**の回にできる。

    元記事はまだ当たっていない（まとめサイトの見出し）。

    '
  src: まとめサイト（9/26）
  url: https://footballnet.2chblog.jp/archives/60071136.html
  fmt: voices
- num: 5
  slot: 日本人
  head: U-21日本代表、今夜アジア大会の準々決勝で北朝鮮と。韓国紙は「悪縁のリターンマッチ」
  why: '3年前の対戦では日本の選手が殴られかけた相手、と韓国紙が注目、という見出し。勝てば準決勝でウズベキスタン。

    **今夜の試合なので、○なら試合のあとに作る。**若い選手は顔写真が取れないことがある。

    '
  src: フットボールチャンネル（9/26）
  url: https://www.footballchannel.jp/2026/09/26/post1019865/
  fmt: news
- num: 6
  slot: その他
  head: ヤマル「サッカーは機械的になった。でも僕のような選手には特別な火花がある」
  why: 'イングランド戦の前、英紙の単独インタビューで語った、という見出し。**本人の言葉**がある。

    '
  src: The Guardian（9/26）
