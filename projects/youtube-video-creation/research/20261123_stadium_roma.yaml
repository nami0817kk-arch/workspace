# スタジアム紹介シリーズ：ローマの本拠地（スタディオ・オリンピコ、11/23 予定）。雛形は 11/21 マルセイユの回。
# 題材の選び方（2026-11-13）：ラ・リーガ・プレミア20・ナポリ・サン・シーロ・マルセイユは済み。セリエAの大物でサン・シーロ以外の器としてローマ。同日 11/23 の他シリーズ（ユニフォーム＝ユヴェントス）と重ならない。外した候補：ドルトムント（Wikipedia の席・金額の数字が en・de で割れ、買い戻しの一次情報が取れなかった）、ユヴェントス（同日のユニフォームと重なる）、PSG（11/25 のユニフォームと重なる）。
# 選んだ理由：「持ち主でない器を1953年から使い続け、いま新しい器を建てる」という強い一点／新しい器の席（6万605）が去年の平均入場（6万1796）より少ないという、自分で引いた見立て。
# 重なりの確認：scripts/*stadium_*・posted.json・covered.yaml・research/*picks.txt に無し（grep 済み）。
# 一次情報の突き合わせ：en・it ウィキペディア（Stadio Olimpico）、en ウィキペディア（Stadio della Roma・2025-26 AS Roma season）、quotidiano.net 2007-05-10（工事計画の原文）、calcioefinanza 2026-09-29（許可の会議）、calcioefinanza（2025-26 の入場：ローマ平均は6万2000近く）。
#   開場1953-05-17 イタリア0-3ハンガリー（it）／1932 開場・1937 モレッティが広げて6万人（it）／1960 五輪開会式 8/25／1968 ユーロ決勝 1-1 → 再試合2-0／1987 世界陸上 ルイス9秒93／1990 工事 設計ヴィトッツィ・クレリチ・約8万5000席・屋根はテフロンの膜・88本のケーブル・屋根1600億リラ・全体2330億リラ（en 枠）・のちの分析で約4500億リラ（en 本文）／1990 W杯6試合・決勝 西ドイツ1-0アルゼンチン（ブレーメPK）／2007-08 工事：1672万ユーロ（税抜）・目的は2009欧州決勝の「5つ星エリート」・安全の工事385万6463ユーロは コーニ・ローマ・ラツィオで等分（quotidiano）／2009-05-27 決勝 バルセロナ2-0マンチェスター・U 6万2467人／所有 2004-02-03 に Coni Servizi へ、2019 に Sport e Salute に改称（en）／2025-26 ローマのホーム平均6万1796・最多6万7785（2025-12-29 ジェノア戦）・席7万634（en 2025-26 AS Roma season）。
#   ピエトララータ：2026-03 市議会が公共の利益を確認（44票中39票賛成、calcioefinanza ほか）、2026-09-28 許可の会議が賛成で終了、着工は2027年春予定、収容6万605席、開場は2030年予定（en 枠）、土地の使用権90年を申請。
#   食い違い（台本には入れない）：en は「1955年にオリンピコ」、枠は「1953-60 チェントミラ（10万人の競技場）」。1990年の費用は枠が2330億・本文が約4500億で「と伝えられます」にした。2008年改修前の席は quotidiano が80,120・en が約75,000。入場の最多記録は en が78,886（1974-05-12 ラツィオ対フォッジャ）。ピエトララータの費用は en の10.47億ユーロと報道の13億ユーロで割れるので台本に入れない。市議会の日付は en が2月・報道が3月。平均入場は en 6万1796、calcioefinanza は「6万2000近く」で矛盾しない。2008年の安全工事の等分は全体費用ではなく安全の工事分だけ。
#   写真：Commons。1959の絵はがき・屋根の骨組みは Public domain。
# 読みが割れる名前：オリンピコ／ピエトララータ／スポーツ・エ・サルーテ／モレッティ／ヴィトッツィ／クレリチ／ブレーメ／デル・デッビオ／ルドルフ／CONI。
