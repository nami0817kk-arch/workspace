- id: cost
  main: true
  heading: 優勝の年に、本業の赤字はなぜ2倍になったのか
  tier: 報道
  telop: 本業の損益は、2140万から4270万ポンドの赤字へ
  narrator: 解説
  card: &cost_wf
    type: waterfall
    title: パレスの本業の損益の動き（百万ポンド）
    unit: 百万ポンド
    start: [2023-24の本業の損益, -21.4]
    steps:
    - [収入, 6.0]
    - [人件費などの費用, -18.9]
    - [償却, -8.4]
    total: [2024-25の本業の損益, -42.7]
  say:
  - text: 鎌田のパレスは、初めてのタイトルの年に、本業の赤字が2倍になりました。
    short_only: true
    image: assets/images/20261108_finance_palace/07_w.jpg
    card: none
  - text: ここでの本業は、選手の売却を入れる前の損益のこと。
    image: assets/images/20261108_finance_palace/02_w.jpg
    card: none
  - text: 本業の赤字は、2140万から4270万ポンドに。ちょうど2倍です。
    emph: true
    card: *cost_wf
  - text: 収入の増えより、ずっと大きく膨らんだのが費用でした。
    card: *cost_wf
  - text: 人件費は、1億3240万から1億4550万ポンドへ。約1300万の増え。
    card:
      <<: *cost_wf
      highlight: 人件費などの費用
  - text: クラブの説明では、主な理由は、FAカップ優勝でスタッフに払った報奨です。
    image: assets/images/20261108_finance_palace/01_w.jpg
    card: none
  - text: 契約にあらかじめ決めてあった、勝ったときの上乗せです。
    card: none
  - text: カップ戦を勝ち進んで試合が増え、その分の費用もかかりました。
    card: none
  - text: 雇い主が払う税と、試合の日に雇う人の給料が上がったことも、挙げています。
    card: none
  - text: 費用は、選手の償却を別にしても、合わせて約1890万の増え。
    emph: true
    image: assets/images/20261108_finance_palace/06_w.jpg
    card: none
  - text: 償却とは、払った移籍金を契約の年数で割り、毎年の費用に回すもの。
    card: none
  - text: その償却も増えました。
    card: none
  - text: 4590万から、5400万ポンドへ。
    card:
      <<: *cost_wf
      highlight: 償却
  sources:
  - https://find-and-update.company-information.service.gov.uk/company/07270793/filing-history/MzUxMzkxNjM3NWFkaXF6a2N4/document?format=pdf&download=0
