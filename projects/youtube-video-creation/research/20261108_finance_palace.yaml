  say:
  - text: 使う数字は、2026年11月5日時点で出ている、パレスの最新の決算です。
    image: assets/images/20261108_finance_palace/04_w.jpg
    card: none
  - text: ロンドンのクリスタル・パレス。日本代表の鎌田大地と、冨安健洋がプレーしています。
    image: assets/images/20261108_finance_palace/07_w.jpg
    card: none
  - text: 鎌田は2024年の夏に、イタリアのラツィオから加わりました。
    card: none
  - text: その最初のシーズンに、パレスはFAカップで優勝します。
    image: assets/images/20261108_finance_palace/02_w.jpg
    card: none
  - text: 決勝はマンチェスター・シティに1対0。ゴールにつながる攻めには、鎌田も絡みました。
    card: none
  - text: クラブの発表では、創立から初めて手にした主要タイトルです。
    image: assets/images/20261108_finance_palace/01_w.jpg
    card: none
  - text: パレスの決算の1年は、7月から翌年の6月まで。
    card: none
  - text: 今回見るのは、2024年から25年の1年間です。
    image: assets/images/20261108_finance_palace/05_w.jpg
    card: none
  - text: 収入は、1億9530万ポンド。
    emph: true
    card: *rev_bars
  - text: 柱は、テレビの放映権。1億4230万ポンドあります。
    card: *rev_bars
  - text: 次がスポンサーと広告、試合の日の入場料が続きます。
    card: *rev_bars
  - text: 割合にすると、収入の約73%がテレビからのお金です。
    image: assets/images/20261108_finance_palace/06_w.jpg
    card: none
