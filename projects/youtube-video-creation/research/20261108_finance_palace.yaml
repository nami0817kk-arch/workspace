- id: view
  viewpoint: true
  heading: 見立て・パレスは、勝つほどお金が要るのか
  tier: 背景
  telop: 費用の増えは、優勝の賞金の約4.3倍。売った利益は、本業の赤字の約1.5倍
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（パレスの決算）
    columns: [比べ, 答え]
    rows:
    - [費用の増え ÷ 優勝の年の賞金, 約4.3倍]
    - [選手を売った利益 ÷ 本業の赤字, 約1.5倍]
    - [人件費 ÷ 収入（2024-25）, 約74%]
    highlight_row: 0
  say:
  - text: ここからは見立てです。決算の数字どうしを、割り算で比べます。
    image: assets/images/20261108_finance_palace/02_w.jpg
    card: none
  - text: 勝ったことで膨らんだ費用は、優勝の賞金の約4.3倍になります。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 優勝の賞金だけでは、勝ったことで増えた費用に届きませんでした。
    card: *view_table
  - text: 人件費は、収入の約70%から、約74%へ上がりました。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。赤字を広げたのは、勝ったことで増えた費用と、償却。
    image: assets/images/20261108_finance_palace/01_w.jpg
    card: none
  - text: 穴をふさいだのは、オリセたちの売却。その利益は、本業の赤字の約1.5倍です。
    emph: true
    card:
      <<: *view_table
      highlight_row: 1
  - text: 親会社も、この年に5000万ポンドの貸付を、帳消しにしています。
    image: assets/images/20261108_finance_palace/05_w.jpg
    card: none
  - text: さらに投資家から、3750万ポンドを新たに集めています。
    card: none
  - text: 会長のスティーブ・パリッシュは、決算でこう書いています。
    card: &chair_doc
      type: document
      label: クリスタル・パレス 会長の言葉（2024-25の年次報告、訳）
      paragraphs:
      - 競争力のあるチームを作りつつ、時が来れば、選手の価値を売却の利益に変える。
      - その利益は、チームを強くするために、全額を選手の獲得に回した。
      highlight: [売却の利益に変える]
  - text: 時が来れば選手を売って利益に変え、その利益は獲得に回す、と。
    card: *chair_doc
  - text: 売れる選手がいない年に、勝つほど増える費用を、パレスは何で埋めるのか。
    emph: true
    image: assets/images/20261108_finance_palace/08_w.jpg
    card: none
