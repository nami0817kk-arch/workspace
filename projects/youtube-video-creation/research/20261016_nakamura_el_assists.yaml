# 日本人選手 の取材メモ（2026年10月16日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 取材: 2026-10-16。requests（ブラウザUA）で原文を読んだ。フットボールチャンネル（2ページ）・サッカーキング（試合記事）・ゲキサカ（試合記事・中村のアシスト記事・鎌田のゴール記事・試合記録）。
#   控えは research/raw/20261016_nakamura_fc.txt・20261016_kamada_sk.txt・20261016_gekisaka_*.txt・20261016_nfnl_9422.txt。
# 日付・場所: 現地10月15日、グルパマ・スタジアム（リヨン）、ELリーグフェーズ第2節。リヨン3-2クリスタル・パレス（前半2-0）。FC・サッカーキング・ゲキサカの試合記録で一致。
# 得点: 8分トリッソ／45+2分ヌアマ（中村アシスト）／50分ピノ／76分シュルツ（中村が絡む）／81分鎌田（パレス）。3紙で一致。
# 資料間のずれ:
#   ・1本目のアシストの描写: FC「左サイドから送ったクロス」、サッカーキング「メラーのダイレクトパスで抜け出し、ボックス内へパス」、ゲキサカ「PA左まで運び右足で折り返し」→「左サイドから右足で折り返し」とだけ言う（ゲキサカ）。
#   ・2本目: FC「中村のシュートをシュルツが合わせた」、サッカーキング「折り返しに中村が合わせ、シュルツがバックヒール」、ゲキサカ「右サイドからのクロスにPA中央の中村が右足ダイレクト、シュルツがヒールで押し込んだ」→「中村が右足で合わせ、シュルツがヒールで押し込んだ」と言い、シュートともクロスとも言わない。
#   ・ナーティの表記: FC「ナルテイ」、サッカーキング「ノア・ナーティ」、ゲキサカ「N. Nartey」→ ナーティ。
# 仏メディア MadeInFOOT の採点・「試合の主役…」の言葉: フットボールチャンネルの訳。仏語原文は未読（MadeInFOOT のページは当たっていない）→ 媒体名は言わず「フランスのメディア」と言う。7点はヌアマ・ナーティと並んでチーム最高（FC）。
# 本人の試合後の言葉: FC・サッカーキング・ゲキサカのどれにも無かった → 入れない。フォンセカ監督の前日の会見（FC。会見の原文は未読）は「先発を明言」だけ使う。
# 反応: NO FOOTY NO LIFE（海外の反応まとめ・10/16。リヨンサポ中心のフォーラムの書き込みの日本語訳）から3件。匿名。元の言語の原文は未確認。切らずに全文。
#   当たった先: 上のまとめ1本のみ（X は個別URLが取れる題材ではないので当たっていない）。
# ELの得点関与の数え方: 前節（アンデルレヒト戦、ELデビュー）で初ゴール（ゲキサカ）＋今節2アシスト＝2試合で3つ。リヨンの今節3点のうち中村が絡んだのは2点（45+2分と76分）。自分で数えた。
# 写真: 配信写真は Getty / Icon Sport。取り込まない。assets/images/20261016_nakamura_el_assists/ は photopool と Commons で集めた。
