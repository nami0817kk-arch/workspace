# シリーズ本編8枠の題材候補（2026年10月17日・土）。名前の大きさ順（CLAUDE.md「シリーズの題材は、大物の名前に…」2026-10-16）
# 各枠に3候補、おすすめ順。**題材を決めるのはユーザー（○×）**。数字は手元の材料を読んだものだけ（読めなかったものは「要確認」と書いた）。
# 公開済みとの重なりは research/posted.json・scripts/ の series:・research/*.yaml で確かめた（10/1〜10/16 のシリーズ全部）。
title: 10月17日（土）シリーズ8枠の題材候補
lead: 8枠×3候補＝24件。各枠の1番目が名前の大きさ順のおすすめです（○は枠ごとに1つ）。
note: |
  **並べ方の物差し**：選手は Transfermarkt の市場価値（`player_pool`）、クラブは世界の収入順位・本拠地の大きさ・CL常連かどうか。軸は「2者の比べ」「順位」「答えを伏せた数字」。
  **同じ日にそろえる時の注意**（候補を選ぶ前に）：
  - 1枠目でレアル・マドリード（ll17）を選ぶ日は、記録の1番目（ロナウド×メッシの1試合あたり）と**ロナウド・レアルが重なる**。どちらかを2番目に替えるか、日をずらす。
  - 財政でシティを選ぶ日は、スタジアムの3番目（エティハド）を選ばない（同じクラブが同じ日に2本になる）。
  - 選手紹介と比べるで同じ人を同じ日に出さない（ヤマル・オリーズ・ハーランド・アルバレス・ペドリ・ヴィティーニャが比べる側に出る）。
  - クラブ紹介（ラ・リーガ）は残り6本（ll15〜ll20）。**1日1本だと10/19に出し切れず10/22まで**かかる。予定表（schedule_202610）は 10/17=ll17・10/18=ll18・10/19=ll19 で、ll15・ll16・ll20 の置き場が無い。2本出す日を作るかは決めてほしい。
  - ブンデスのクラブ紹介は材料が無い（research/bd_data は順位表・地図・クラブ一覧のみ、取材メモ・台本ゼロ）ので、今日の候補には入れていない。
