# アンドリー・シェフチェンコ（元ウクライナ代表FW、ミラン7シーズン・2004年バロンドール）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-22 用。8節（フック→基礎DATA→歩み→持ち味→あの試合→現役のあと→マル秘話→見立て）。日本との接点は一次情報で確かめられなかったので節を置かない。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Andriy Shevchenko、2003 UEFA Champions League final）・イタリア語版（リーグの内訳）と自分で足した値だけ。
# **私生活・法的な問題は入れない**。政治の話も入れない。
# **重なりの確認（2026-11-12）**：scripts/・covered.yaml・posted.json・research/2026111*_picks.txt を「シェフチェンコ／Shevchenko」で grep。主役の回は無し。同じ日の別シリーズに同名なし。
# **引退の確認**：Wikipedia「2012年に代表（ユーロ2012後）と現役を終えた」。現役ではない（50歳）。2024-01-25 ウクライナサッカー協会会長に選出（本文）。
# **数字の出どころと自分で足した値**
# - **ミランのゴール数は資料が割れる**（英語版：成績表173・本文175／all competitions）。台本・サムネは割れない**セリエAだけ**を使う：ミラン 208試合127点（1999-2006、英語版・イタリア語版が一致）。2008-09 のレンタル（18試合0点）は除く。ウクライナ代表 111試合48点（本文）。合計 319試合175点（自分で足した値：208+111、127+48）。サムネの表は「ミラン（セリエA）」「ウクライナ代表」「合計」。
# - ミランの主要タイトル5個（Honours）：CL 2002-03、コッパ・イタリア 2002-03、UEFAスーパー杯 2003、セリエA 2003-04、スーペルコッパ 2004。暦年で 2003＝3、2004＝2。1999〜2002＝0、2005〜2006＝0（自分で数えた。2005年CL決勝はリヴァプールに敗れた準優勝）。セリエA得点王 1999-2000・2003-04（各24点）。
# - 2003-05-28 CL決勝（オールド・トラッフォード、62,315人）ミラン0-0ユベントス（延長）、PK戦3-2。ディダが3本止める。シェフチェンコが最後のキック。9分のインザーギのゴールはオフサイド。シェフチェンコは先発してフル出場（試合ページのラインナップ）。**PKの順番は資料の表記が割れるので、「2対2で迎えた5人目」だけ書く（ミラン3本成功・ユベントス2本成功の合計から）。**
# - 2006年チェルシー移籍金 £30.8m（イングランドのクラブとして記録・本文）。ユーロ2012 スウェーデン戦2ゴール（ヘディング・本文）。1997-98 バルセロナ戦ハットトリック（4-0・本文）。2006年W杯は主将、準々決勝でイタリアに0-3（本文）。
# **本人の言葉**：取れていない。声の行は置かない。
# **入れなかったもの**：私生活・家族・政治（2012年の選挙）・2005年イスタンブール決勝のPK失敗（敗戦の事実のみ見立てで触れず）・ミランのゴール数の通算（資料が割れる）。
# **読みで怪しいもの**：アンドリー・シェフチェンコ（アンドリー／アンドリイ）、ディナモ・キーウ、ユベントス、インザーギ、ディダ、ジェノア、オールド・トラッフォード、カンプ・ノウ、スーペルコッパ、コッパ・イタリア。
