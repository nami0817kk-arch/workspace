  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_forest_data0.png
    text: 創立は**1865年**。本拠地はシティ・グラウンド、**3万1212人**が入ります。
    no_telop: true
  - image: assets/photos/pl/forest_owner_741d4568.jpg
    text: オーナーはギリシャの実業家エヴァンゲロス・マリナキス。2017年からクラブを持っています。
  - image: assets/stats/pl_forest_map.png
    text: ホームタウンはウェスト・ブリッジフォード。ノッティンガムの隣町です。
    no_telop: true
  - image: assets/stats/pl_forest_cups.png
    text: 1部リーグの優勝は**1回**。FAカップ2回、リーグカップ4回、そしてヨーロッパのタイトルを**2回**獲っています。
    no_telop: true
  - image: assets/stats/pl_forest_data6.png
    text: 1977年11月から翌年11月まで、リーグで**42試合負けなし**。1部で優勝したシーズンです。
    no_telop: true
  - image: assets/stats/pl_forest_last.png
    text: プレミアでの最高位は、1994年から95年の**3位**です。
    no_telop: true
  - image: assets/stats/pl_forest_data8.png
    text: 愛称は「トリッキー・トゥリーズ」。ほかに「ガリバルディス」「レッズ」とも呼ばれます。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
