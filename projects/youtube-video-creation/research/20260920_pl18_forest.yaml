  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_forest_data1.png
    text: 愛称は「トリッキー・トゥリーズ」。ユニフォームの赤から、「ガリバルディス」「レッズ」とも。
    no_telop: true
  - image: assets/stats/pl_forest_map.png
    text: ホームタウンはウェスト・ブリッジフォード。ノッティンガムの隣町です。
    no_telop: true
  - image: assets/backgrounds/stadium_ノッティンガムフォレスト_in.png
    text: いちばん古いクラブの本拠地は、シティ・グラウンド。**3万1212人**が入ります。
  - image: assets/photos/pl/forest_owner_741d4568.jpg
    text: オーナーはギリシャの実業家エヴァンゲロス・マリナキス。2017年からクラブを持っています。
  - image: assets/stats/pl_forest_cups.png
    text: 1部リーグの優勝は**1回**。FAカップ2回、リーグカップ4回。そしてチャンピオンズリーグを**2回**、スーパーカップを1回獲っています。
    no_telop: true
  - image: assets/stats/pl_forest_data6.png
    text: リーグで**42試合負けなし**という記録も持っています。1シーズンぶんの長さです。
    no_telop: true
  - image: assets/stats/pl_forest_last.png
    text: プレミアでの最高位は、1994年から95年の**3位**です。
    no_telop: true
