- id: clough
  heading: 上がって、ヨーロッパを獲って、そして落ちた
  tier: 背景
  telop: 2部から上がった翌シーズンに、1部で優勝した
  narrator: 解説
  card:
    type: table
    title: 上がって、落ちて、戻るまで
    columns:
    - ''
    - ''
    rows:
    - - 1977年
      - 2部から昇格（勝ち点52）
    - - 翌シーズン
      - 1部優勝
    - - 1979年・1980年
      - ヨーロッパカップ連覇
    - - 1977年11月から
      - リーグ42試合無敗
    - - 1993年
      - プレミア最初のシーズンに降格
    - - 2022年
      - 23年ぶりに1部へ（プレーオフ）
  say:
  - 2部から昇格した翌シーズンに、**1部で優勝したクラブ**です。
  - さらにその次から、ヨーロッパカップを**2年続けて**制しました。1979年と1980年です。
  - 昇格したのは1977年。勝ち点は**52**で、昇格したチームとしては**歴代5番目に少ない**数字でした。
  - この時代を作ったのが、ブライアン・クラフとピーター・テイラーです。
  - 1977年11月からは、リーグ戦で**42試合**負けませんでした。1シーズンぶんに相当する長さです。
  - そして1993年、**プレミアリーグの最初のシーズン**に降格します。クラフが指揮した18年も、そこで終わりました。
  - ヨーロッパを連覇したクラブが、**23年**のあいだ1部にいませんでした。戻ってきたのは2022年、プレーオフを勝ち上がっての昇格です。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Nottingham_Forest_F.C.
