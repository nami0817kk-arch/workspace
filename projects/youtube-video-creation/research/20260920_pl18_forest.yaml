  say:
  - 相手は**ダービー・カウンティ**。**イースト・ミッドランズ・ダービー**と呼ばれます。
  - 公式戦で初めて当たったのは1892年10月1日。レースコース・グラウンドで、フォレストが**3対2**で勝ちました。
  - 火が付いたのは1970年代の後半です。**ダービーで成功したブライアン・クラフが、フォレストの監督になった**ことがきっかけでした。
  - 2007年からは、この試合に**ブライアン・クラフ・トロフィー**が懸かっています。
  - 最初のトロフィー戦は2007年7月31日、プライド・パーク。**ダービーが2対0**で勝っています。
  - ただし、**今季のプレミアリーグに、ダービー・カウンティはいません。**リーグでこの一戦は組まれません。
  official: false
