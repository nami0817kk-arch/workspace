sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: 9か月ぶりに招集メンバー入り
    narrator: キャスター
    say:
      - モナコの南野拓実が、9か月ぶりに招集メンバーへ戻りました。
      - 相手はパリ・サンジェルマン。リーグ・アン第3節、9月4日の試合です。
      - モナコが前日に発表した招集メンバーは22人。そこに南野の名前がありました。
      - 南野が最後に公式戦へ出たのは、2025年12月21日のオセール戦です。
      - 前半に左膝を負傷し、担架で運ばれました。
      - 翌日、クラブが左膝前十字じん帯断裂と発表しています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/04/post1003899/
      - https://web.ultra-soccer.jp/news/all/35092/

  - id: cut
    heading: 当日のメンバーには入らなかった
    tier: 報道
    telop: 試合登録は20人。2人が外れる
    narrator: 解説
    say:
      - ところが、試合当日のメンバーに南野の名前はありませんでした。
      - 理由は人数です。
      - リーグ・アンの試合登録は、先発11人とリザーブ9人の合わせて20人と決まっています。
      - モナコが招集したのは22人でした。2人が外れることになります。
      - そのひとりが南野でした。
      - 現地メディアによると、8月の前半にはすでに練習へ合流していたものの、
      - 長期離脱明けということで、復帰までは慎重に進められてきたといいます。
      - 監督は8月末、復帰の時期についてこう話していました。
      - {voice: モナコ監督, text: プレイ時間を与える良い機会となる}
      - {voice: モナコ監督, text: 出場時間への対応力を見ていく}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35092/
      - https://www.theworldmagazine.jp/20260831/01world/503913

  - id: match
    heading: その試合はどう動いたか
    tier: 報道
    telop: PSG 1対2 モナコ、開幕3連勝
    narrator: キャスター
    card:
      type: table
      title: リーグ・アン第3節 パリ・サンジェルマン 1-2 モナコ
      rows:
        - ["31分", "マルキーニョス（PSG）"]
        - ["58分", "フラビオ・ナジーニョ（モナコ）"]
        - ["72分", "スタニス・イドゥンボ（モナコ）"]
    say:
      - 南野のいないモナコは、この試合をひっくり返しました。
      - 31分、コーナーキックの流れからマルキーニョスに先制されます。
      - 58分、ザカリアのクロスをフラビオ・ナジーニョがヘディングで押し込んで追いつきました。
      - 72分にはスタニス・イドゥンボが左足で決めて逆転。1対2でモナコの勝ちです。
      - モナコは開幕3連勝。5連覇中のPSGは、開幕から3試合勝てていません。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35189/
      - https://www.soccer-king.jp/news/world/fra/20260905/2200814.html

  - id: lastyear
    heading: 去年の同じカードでは
    tier: 背景
    telop: 昨季はPSG戦で決勝弾、月間MVP
    narrator: 解説
    say:
      - 去年の同じ顔合わせを覚えている人もいるかもしれません。
      - 2025年11月30日、リーグ・アン第14節のモナコ対PSG。
      - 決勝ゴールを決めたのは南野でした。左足で、2試合連続の得点です。
      - その月、南野はモナコの月間MVPに選ばれています。
      - 得票率は65パーセント。バログンとサリスを抑えての選出でした。
    official: false
    sources:
      - https://www.theworldmagazine.jp/20251130/01world/473761
      - https://www.theworldmagazine.jp/20251205/01world/474415

  - id: next
    heading: 次はいつになるか
    tier: 報道
    telop: 次節ストラスブール戦は9月12日
    narrator: キャスター
    say:
      - 次の試合は9月12日、敵地でのストラスブール戦です。
      - ヨーロッパ・カンファレンスリーグの登録メンバーにも、南野は入っています。
      - 日本人選手は16人が登録され、リーグフェーズの開幕は10月15日です。
      - 招集メンバー入りが発表されたとき、チームの同僚はこう書き込んでいました。
      - {voice: モナコの同僚, text: タキがメンバーに戻ってきた姿を見られて本当にうれしい}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/05/post1004562/
