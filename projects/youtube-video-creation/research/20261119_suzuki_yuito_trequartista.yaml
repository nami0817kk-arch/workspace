# 出典で確かめたこと:
#   ・ゲキサカ（地の文）: 鈴木唯人（フライブルク）はトップ下での初出場。パラグアイ戦は森保一監督のラストマッチ。14日のブラジル戦（3-2）は出場機会がなかった。次世代への継承役として、4バック導入後初めて起用された。
#       任された役目は、これまでの3-4-2-1のシャドーではなく、本職と言える4-2-3-1のトップ下。1トップにはチームメートのFW後藤啓介。チームが前半早々にセットプレーから失点し、パラグアイの強固な守備ブロックに攻撃が停滞。
#       鈴木唯は頻繁に中盤の低い位置まで下がり、MF佐野航大とのインサイドハーフのような関係でボールポゼッションを安定させようとしたが、後藤が孤立する結果になった。後半16分に途中交代。
#   ・鈴木唯人の言葉（ゲキサカ。字は変えない。台本は読点で行に分けた）:
#       「立ち上がりにすぐ失点して色々と難しかったけど、もう少し僕自身ができたこともあった。森保さんの最後の試合ですごく申し訳なかった」
#       「もう少し後藤選手の近くに居られれば良かったけど、クラブでやっているのは降りてボールを受けて、さばいて、また出ていくというのが結構多い。ただ今日は相手が引き込んで中を絞る形だったので、もう少し工夫して片方のサイドになるとか、もうちょっと打開策はあったと思う」
#       「うまく攻撃を活性化させながら、結局は最後のゴール前にも居ないといけないポジションだと思う」
#       「僕自身も個人としてもっともっとチームのプラスになるようなことができないといけない。また(所属先の)チームに戻ってから頑張れれば」
#   ・ESPN の試合データ（site.api.espn.com fifa.friendly summary event=401916336、2026-11-17 13:10 UTC）: Japan 1-2 Paraguay。2' Cáceres がコーナーからの流れで先制。Yuito Suzuki 先発、61' に Takefusa Kubo と交代（記事の「後半16分」＝45+16 で一致）。Keisuke Goto 先発・61' に Koki Ogawa と交代。Kodai Sano 先発・61' に Ao Tanaka と交代。
# 依頼文との違い: 依頼文は「もうちょっと打開策はあった」の一言だけ。実際は1-2のパラグアイ戦。台本は1-2とだけ言う。交代は後半16分（ESPN 61分）。
# 自分で数えたもの: 本人の言葉の中で、自分に向けた反省の言い方は3か所（「申し訳なかった」「打開策はあったと思う」「もっともっと…できないといけない」）。降りて受ける動きはクラブでも代表でも同じで、違ったのは相手の守り方、という言い方を本人がしている。
#   後藤・唯人・佐野航大の3人は、ESPN の交代記録でどれも61分に交代（同時）。→ 台本では「3人とも」とは言わない（本の主役は唯人。他の2人の評価は入れない）。
# 前の本との重なり: scripts/20261026_suzuki_yuito_bayern・20261111_suzuki_yui_freiburg・20261020_suzuki_yui_spurs_interest・20261106_goto_suzuki_freiburg と中身は別（今回はA代表のトップ下の言葉）。20261117_moriyasu_last_changes の「唯人と後藤に出場機会」は予告の1行だけ。同じ日の久保・堂安・田中・伊藤の本とは別の人の言葉。
# 【言わないこと】試合の経過（失点の細部・福田のゴール）／後藤・佐野の評価／本人を小さく見せる言い方（「孤立させた」と決めつけない。記事の「後藤が孤立する結果に」は地の文として一度だけ使う）。
