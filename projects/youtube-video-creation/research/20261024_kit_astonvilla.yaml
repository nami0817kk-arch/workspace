# ユニフォームとエンブレムの歴史 アストン・ヴィラ（10/24 作成）。雛形は 10/23 ブライトン回。
# 題の問い：ヴィラの紋章は、なぜ2022年に決めた丸から、2024年に盾へ戻ったのか（試合のシャツで丸は1シーズン）。
# 重なり確認（2026-10-23）：scripts/・research/covered.yaml の kit_*・research/posted.json を grep。ヴィラのユニフォーム回は無し（20261020_finance_villa は財政、20261011_stadium_villapark はスタジアム、別シリーズ）。
# 取材：requests（ブラウザ User-Agent）・WebFetch・WebSearch（URL探しと裏取り）。ブラウザ操作・JS実行・検索のAI要約を根拠にはしていない。
#   読んだ：ウィキペディア en "Aston Villa F.C."（Colours and badge／Kit manufacturers and sponsors／History／Records／Honours）、"Zion Suzuki"（冒頭）。
#   sportslogos.net 2023-09-27・2024-05-31（WebFetch 経由の要約。丸い紋章は2022年11月、投票はシーズンチケット保有者とクラブ会員、盾の案はガス灯に着想。2024-05-31 に盾を公表。黄ライオン・水色の盾・1874年・星＝1982年）。
#   クラブ公式 avfc.co.uk（2026/27ホームの発表 5/26・発売 5/28。本文は JS 描画で直接読めず、検索結果の要約のみ。「1960年代に着想」「ラグランの袖から離れた」はその要約）。
#   readastonvilla.com（ファンのサイト。全体クラレット・ポロ襟・胸広告なし。公式未確認なので台本で断る）。
#   読めなかった：historicalkits.co.uk（SSL エラー・WebFetch タイムアウト）。クラブ公式の2022年投票告知と2016年の紋章発表の原文（検索に出ず）。
# ---- 食い違い・断ったこと ----
#   ・初期のライオンと「Prepared」がいつから紋章にあったかは、ウィキペディア（1906年のプログラムが最古の記録）と個人サイト（1874年から）で割れる→台本に入れない。
#   ・2026/27ホームの袖・ストライプの色（水色／白）はサイト間で割れる→入れない。胸広告なしはファンのサイトのみ→「公式は確かめられなかった」と断る。
#   ・2026年のヨーロッパリーグ優勝が紋章の星に足されたかは確認できず→台本で断る。
#   ・製造元・スポンサー表はウィキペディアの表が結合セルで読みにくい→1974年アンブロ・1982/83ダベンポーツ・2008〜10エーコーンズ・2019/20袖・2024/25アディダスだけ使う（本文の文章で確認済み）。
# ---- 自分で数えた数 ----
#   2024年5月−2022年11月=18か月（1年半）。2026−1886=140年。2026−1874の創立から胸の広告1982まで=1982−1874=108年。
#   試合のシャツの紋章：2007/08〜2015/16=9、2016/17〜2022/23=7、2023/24=1、2024/25〜2026/27=3（今季まで）。合計20シーズン、4つ、平均5。1÷140（丸の1シーズン／色の140年）。
#   「1982年のシャツに広告が無い」は、最初の広告が1982/83（ウィキペディア）という文からの推論。
# ---- 日本との接点 ----
#   鈴木彩艶（2026年パルマから加入。ウィキペディア）。紋章が何代目かの形で第2節。
# ---- 写真（assets/images/20261024_kit_astonvilla/、出典は credits.json）----
