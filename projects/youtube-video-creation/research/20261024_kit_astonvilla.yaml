    card: none
  - text: その盾は、創立のガス灯の話に着想したもの、と伝わります。
    image: assets/images/20261024_kit_astonvilla/a03_trinity.jpg
    card: none
  - text: 創立は、1874年。ガス灯の下の話し合いで、サッカーをやると決めた、と言われます。
