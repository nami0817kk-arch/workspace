    card: none
  - text: でも、丸い紋章の出番は、短いものでした。
    image: assets/images/20261024_kit_astonvilla/a04_north.jpg
    emph: true
    card: none
  - text: 使うのは、試合のシャツと、練習着だけ。ほかの場所では、前の紋章が続きました。
    image: assets/images/20261024_kit_astonvilla/a04_north.jpg
    card: none
  - text: 着たのは、2023年からの、1シーズン。前の紋章は、7シーズンでした。
