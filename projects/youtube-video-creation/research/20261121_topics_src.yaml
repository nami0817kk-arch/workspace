title: 11月21日のショート題材
lead: 海外フィード約456件から10件をClaudeが選びました（日本人5件・海外5件）。取材で前提が崩れたら次点に差し替えます。
note: 土曜（21日）の朝11時に集めました。見出しからの選定で、本文は取材の段階で読みます。次点：佐野航大（PSV・古巣監督）、松木玖生（サウサンプトン監督契約延長）、サカの離脱4週間、トム・ブレイディのチェルシー出資、ヤマル（マルカ）。直近3日と同じ話は外しました（田中碧・鈴木彩艶・伊藤・ニコ・パス・マタ引退など）。
