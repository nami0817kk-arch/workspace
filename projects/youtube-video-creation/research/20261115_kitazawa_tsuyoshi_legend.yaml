  say:
  - text: 1997年10月14日の夜、北澤豪の電話が鳴ります。
    image: assets/images/20261115_kitazawa_tsuyoshi_legend/03_w.jpg
    card: none
    emph: true
  - text: 岡田武史からの、代表に戻ってほしいという連絡でした。
    card: none
  - voice: 北澤豪
    text: 岡田さんから連絡があって、
    card: none
  - voice: 北澤豪
    text: 『今、見てのとおりの状況で、
    card: none
    cont: true
  - voice: 北澤豪
    text: おまえを必要としている。
    card: none
    cont: true
  - voice: 北澤豪
    text: ただ、この状況だから、おまえに意志がないと厳しい。
    card: none
    cont: true
  - voice: 北澤豪
    text: 自分で判断してくれ』と言われて、
    card: none
    cont: true
  - voice: 北澤豪
    text: 『もちろん、行きますよ』って答えたんだ
    card: none
    emph: true
    cont: true
  - text: 日本代表は、加茂監督を解任したばかり。後任を引き受けたのが、岡田武史でした。
    card: none
  - text: 北澤豪は、8月から代表を離れていました。
    card: none
  - text: 代表に戻った北澤豪は、静岡のキャンプで、チームの空気をこう感じました。
    card: none
  - voice: 北澤豪
    text: 雰囲気が明らかに暗いし、会話もない。
    card: none
  - voice: 北澤豪
    text: まずはこの雰囲気を壊さないとダメだなと思った。
    card: none
    cont: true
  - text: 役割は、本人の言葉で、こう決まっていきます。
    card: none
  - voice: 北澤豪
    text: 攻撃のときはダイヤモンドの中盤のトップ下に、
    card: none
  - voice: 北澤豪
    text: 守備のときは左サイドに入ってくれと言われて、
    card: none
    cont: true
  - voice: 北澤豪
    text: 自分がトップ下をするなら、
    card: none
    cont: true
  - voice: 北澤豪
    text: そこにとどまっている理由はないなとか、
    card: none
    cont: true
  - voice: 北澤豪
    text: サイドの人数が足りなくなるなとか。
    card: none
    cont: true
  - text: 本人の言うヒデは中田英寿、モトは山口素弘のことです。
    card: none
  - voice: 北澤豪
    text: ヒデをどう生かすか、名波浩やモトにいかに前を向かせるか、
    card: none
  - voice: 北澤豪
    text: 自分のタイプを考えれば、当然求められることだな、と
    card: none
    emph: true
    cont: true
  - text: 11月16日、マレーシアのジョホールバル。
