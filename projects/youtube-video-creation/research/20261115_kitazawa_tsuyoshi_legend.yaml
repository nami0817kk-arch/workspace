# 北澤豪（元日本代表 MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-15。型は 11/13 の城彰二と同じ8節の変形（プレースタイルの節は「あの試合」の節の中で本人の言葉に置いた）。
# **情報の時点は 2026-11-12。**年齢は出さない。いまの仕事は言わない（日本サッカー協会などの役職・解説・障がい者サッカー連盟は入れない）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は日本語版 Wikipedia「北澤豪」の成績表・代表の年別表と出場表、英語版「1998 FIFA World Cup qualification (AFC)」、
#   Yahoo!スポーツナビ（飯尾篤史、集中連載「ジョホールバルの真実」(4)「ドーハ組、北澤豪がもたらしたもの」）の1・2頁だけ。
# **病気・私生活・法的な問題は入れない。**
# **題材を選んだ理由**：引退した日本人で、ドーハ（1993）とジョホールバル（1997）の両方に立った大物。国内レジェンドの既出（中田・俊輔・内田・川口・小野・稲本・遠藤・大久保・岡崎・松井・阿部・宮本・憲剛・奥寺・中澤・槙野・高原・城）に無く、
#   posted.json・covered.yaml・scripts/・picks のどこにも「北澤」は出ない。Commons に大きい写真が3枚ある（2010年・2018年・日本イタリアOB戦）。同じ日の別シリーズと人が重ならない。
# **引退の確認**：日本語版の成績表が2002年で終わり、「2002年出場機会を減らして引退を決断」「2003年6月21日に引退試合」（日本語版）。現役ではない。
# **ジョホールバルは城彰二（11/13）の回と同じ試合**。城の回は75分の同点ゴールの側、こちらは「先発し、延長前半0分に岡野と交代した側」。試合の表は出さず、岡田武史の電話からの1か月を主役にした。
# **候補から外したもの**：柳沢敦・名波浩・楢崎正剛・中山雅史・小笠原満男・福西崇史（Commons に使える大きな写真が無い。11/9〜11/13 の担当と同じ結果）、本田圭佑・香川真司・長友佑都（現役）、前園真聖（写真は多いが大物度で北澤・福田に劣る）。
# **数字の出どころ**
# - 1968-08-10・東京都町田市生まれ。MF（日本語版）。クラブ：本田技研 1987-91 51試合14得点、読売／東京ヴェルディ 1991-2002 285試合43得点、合計 336試合57得点（日本語版の表の合計と一致。JSL1 71-16＋J1 265-41）。
#   ※日本語版の本文は「Jリーグでは264試合41ゴール」「Aマッチ59試合」と書くが、成績表は J1 265試合・代表58試合3得点。**表の数字を採った**（本文との食い違いは報告に書く）。
# - 年別（J）：1993 35-6、1994 40-9、1995 40-11、1996 28-4、1997 29-1、1998 34-5、1999 28-4、2000 4-0、2001 23-0、2002 4-1。1990-91 JSL1 22試合10得点（得点王）。
# - 日本代表 58試合3得点（1991〜99年）。年別：1991 2-0、1992 11-1、1993 4-0、1994 7-1、1995 14-1、1996 5-0、1997 11-0、1998 3-0、1999 1-0。合計 58-3（足して一致）。
#   1992・95・97年＝36試合（11＋14＋11）＝約62%（36÷58）。ほかの6年＝22試合・1得点（22÷6＝約3.7）。
#   1992年アジアカップは5試合すべてに出場（日本語版の出場表の No.9〜13）。優勝は福田正博の項（日本語版・英語版）と英語版 Fukuda の Medal 欄で確認。
#   1993年ドーハ：北朝鮮戦（10/21 3-0）・韓国戦（10/25 1-0）に出場、最終戦イラク戦（10/28 2-2）は出番なし（日本語版）。
# - 1998年W杯：予選は戦い、本大会直前の合宿で三浦知良とともに外れた（日本語版）。選手を小さく見せる書き方は避け、事実だけ言う。
# - 決勝ゴール（日本語版）：1993 Jリーグカップ決勝（清水）、1994 Jリーグチャンピオンシップ第1戦（広島）、1997-01-01 天皇杯決勝（広島）。Jリーグ初ゴール＝1993年第2節ジェフ戦。
# - 引退：2002-07-27 清水戦が最後の得点。終盤に岡田武史（翌年マリノス監督就任が決定）からの移籍オファーを、ひざの不調で断り引退（日本語版）。引退試合 2003-06-21 国立競技場。
# - ジョホールバル（英語版 1998 FIFA World Cup qualification (AFC)）：1997-11-16、イラン2-3日本（延長・ゴールデンゴール）、岡野雅行118分。北澤は先発し「延長前半0分に岡野と交代」（Yahoo 記事の交代記録）。
# - 本人の言葉（Yahoo!スポーツナビ 2017-10-30、飯尾篤史。原文のまま）：①岡田武史からの電話（10月14日夜、8月以来の復帰要請）②静岡キャンプの雰囲気 ③トップ下・左サイドの役割。
#   **WebFetch の抽出で取った文面。原記事の画面と一字ずつ突き合わせてはいない**（報告に書く）。「ヒデ」「モト」は台本の地の文で中田英寿・山口素弘と言ってから引いた。名波は記事の「（浩）」を名波浩に開いた。
# **入れなかったもの**：キリンカップ1991の2得点（日本語版の本文と代表の年別表が食い違う）、ベストジーニスト賞、ウイイレの解説・テレビ・JFA 役職・障がい者サッカー連盟、フットサル代表、読売クラブ時代の人間関係の逸話（有料部分で確かめられない）、
#   ドーハで出番がなかったときの本人の言葉（Sportiva 有料部分で取れなかった）、カズ・ラモスとの関係の評価。
# **写真**：assets/images/20261115_kitazawa_tsuyoshi_legend/（Commons だけ）。01＝「Tsuyoshi Kitazawa on Feb 17, 2010.jpg」（Norio NAKAYAMA、CC BY-SA 2.0、2010-02-17、adidas のイベントでマイクを持つ姿）、
#   02＝「Kitazawa Tsuyoshi from "Goal! Goal! Goal!…" at Opening Ceremony of the Tokyo International Film Festival 2018」（Dick Thomas Johnson、CC BY 2.0、2018-10-25、縦長）、
#   03＝「Kazu Miura, Roberto Baggio and Tsuyoshi Kitazawa.jpg」の右の人（背番号8、赤いユニフォーム。2013年の日本・イタリアOB戦。CC BY 2.0）を切り出したもの。
#   いずれも現役時代ではない（台本は現役の話の行にも使う）。紋章の差し込みは 日本。
