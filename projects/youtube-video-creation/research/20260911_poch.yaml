# ポチェッティーノが9年前のプレミア優勝に異議（2026年9月10日）。ユーザー指示「2.3.4もお願い」
#
# **記事を開いて読んだ**（見出しだけで書かない）。スカイスポーツの単独インタビューと、
# UKメディアとの会見をPA経由でESPNが伝えたもの。発言はそちらから引いている。
#
# 引きは**「どのシーズンの話か」**。9年前の順位が今になって動くかもしれない、
# という筋で、賛否が真っ二つに割れる。
#
# **反応は入れない。**読める形のスレが無かった
format: news
voice_min: 40
slot: premier
date: "2026年9月10日"

# ハッシュタグに使う人の名前
people:
  - ポチェッティーノ
  - コンテ
  - ダニエル・レヴィ
  - トッド・ベーリー

short_title: "ポチェッティーノ「あの優勝は2位のものだ」"

theme:
  id: poch_2016_title
  league: england
  kind: other
  topic: トッテナム
  title: ポチェッティーノが9年前のプレミア優勝に異議。どのシーズンの話か
  hook: 「僕たちは1つ、優勝しているはずだった」。
  question: 9年前の順位が、いま動くかもしれないのはなぜか

thumbnail:
  line1: 9年前の優勝について
  line2: 「あれは ●●●● のものだ」
  # トッテナム時代の写真しか無いが、**この回はまさにその時代の話**なので噛み合う
  photo: "assets/photos/20260911_poch/01.jpg"
