# エクアドル代表の紹介（代表チームの紹介・初回）。10/1 キリンカップ準決勝（日産スタジアム）の相手。
# 来日メンバーは JFA の発表（jfa.jp samuraiblue/news/00036833、ゲキサカ 9/29 459987 も同じ）。対戦チーム情報（00036822）の FIFA25位・2勝2分・W杯の結果・南米予選5失点・2022年のPK失敗とも突き合わせた。位置と生年月日は Transfermarkt（英語版Wikipediaの代表メンバー表と一致）。年齢は 10/1 時点。
# FIFAランキングは FIFA 公式（api.fifa.com、2026-07-20 発表の回。9月の代表戦のあとの更新はまだ無い）。
# W杯と韓国戦の結果・数字は ESPN の試合記録（韓国戦：保持 40.7%、ロングボール 49本/25本、クロス 11本で成功1）。
# 南米予選の表は英語版Wikipedia（18試合 8勝8分2敗 得点14 失点5、勝点29は3点の減点後）。
# 日本との対戦は JFA の記録（samuraiblue.jp の代表TIMELINE と jfa.jp の試合ページ）。英語版Wikipediaの対戦成績（4試合2勝2分 得点5失点1）と一致。
# カイセド・インカピエ・オルドニェスはけがで今回のアジア遠征に入っていない（El Universo 9/23）。
# プラタとロドリゲスは韓国戦を欠場したが、日本戦の来日メンバーには入っている（出るかは分からないので書かない）。
# 本人・監督の言葉は使っていない。ネットの反応も置いていない（紹介ものは声なしで通す）。
