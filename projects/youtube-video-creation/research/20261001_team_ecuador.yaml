      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
  - text: 監督はアルゼンチン出身のマルセロ・ガジャルド、50歳。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
    image: assets/images/20261001_ecu_gallardo/01.jpg
  - text: 母国の名門リーベル・プレートを率いた人物で、9月に就任したばかり。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: 南米一のクラブを争うコパ・リベルタドーレスで、2度優勝しています。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: W杯は2大会続けての出場で、通算5回目。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
    image: assets/images/20261001_ecu_team/scene_w.jpg
  - text: 48か国が出た2026年の大会で、32か国の勝ち抜き戦まで進みました。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: W杯への南米予選は、10か国が18試合ずつ戦う総当たり。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: エクアドルはアルゼンチンに次ぐ2位で抜けました。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: この18試合で許したゴールは、たった5つ。10か国で最も少ない数です。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: 主力の多くは、欧州のクラブでプレーしています。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
