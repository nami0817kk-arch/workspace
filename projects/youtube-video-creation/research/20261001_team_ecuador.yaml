      rows: *id010
      highlight_row: 2
    image: assets/images/20261001_ecu_team/scene_w.jpg
  - text: 組み直した守備陣が、長いボールの競り合いにどう当たるか。
    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: そして、左から来るウイングをどう止めるか。そこが見どころです。
    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: 日本戦は、ガジャルド監督にとって2試合目。
