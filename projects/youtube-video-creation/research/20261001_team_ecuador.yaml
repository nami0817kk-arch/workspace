  say:
  - text: 10月1日、日産スタジアムで日本と戦うエクアドル代表。
    image: assets/images/20261001_ecu_team/scene_w.jpg
  - text: どんなチームなのかを、数字で見ていきます。
    card:
      type: table
      title: エクアドル代表の基礎DATA
      columns: *id001
      rows: *id002
  - text: 世界の国を試合の結果で並べた、フィファランキングでは25位。
