    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 0
  - text: W杯でも、4試合で2点。点の少なさは変わりませんでした。
    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 1
  - text: 点を取られにくい代わりに、たくさんは取らない。それが予選で見せた形です。
    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 1
  - text: その守りが、監督の替わった韓国戦では崩れました。
