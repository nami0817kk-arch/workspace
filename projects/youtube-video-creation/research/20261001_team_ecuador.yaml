      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: ロングボールは、後ろから前へ長く蹴るパスのことです。
    card:
      type: table
      title: 数字で見るエクアドルの形
      columns: *id009
      rows: *id010
      highlight_row: 2
  - text: 短いパスでつなぐより、前へ速く運ぶ。
