# チェルシーのオーナーが代わった日（2026-09-18）
#
# **ユーザー判断②**（2026-09-18）。もとは「作り直しではなく手入れだった」で
# 組んでいたが、**その発言への反応が英語で3件・日本語で0件**しか無かった。
# 同じ9/17に「ベーリーが株を売却、クリアレイクが完全掌握」という大きな話が出て、
# チェルシー界隈の会話が全部そちらに行っていた。**話題のあるほうへ寄せる。**
#
# 引きは**「中心が誰なのかがはっきりしているのは良いことだ」**（@main）。
#
# **数字が媒体で割れているものは出さない:**
#   ・売却後のクリアレイクの持ち株 … Sky は86.5%、insidersport は99.9%
#   ・2022年の買収額 … £2.3bn／£2.5bn／£4.25bn とばらばら
#   出せるのは**売却前の61.5%**（一致している）と、FT の**£950m**まで
#
# **サッカーキングの「ヴィス氏も12.8%売却」は英語圏の報道とクラブ公式に反する。**
# 公式は「ヴィスは重要な株主として残る」。**日本語ソースをそのまま引かない**
#
# **アロンソの発言は Sky の本文には無い。**AFP 配信の会見記事から取った。
# 会見の逐語録は公開されていないので、**「原文のまま」とは言わない**
#
# **表記はサッカーキングに合わせる**（ベハダ・エグバリ）。ゲキサカに記事は無かった
#
# **ベーリーの BlueCo 持ち分の扱いは一次情報が無い。**ストラスブールには触れない
format: news
