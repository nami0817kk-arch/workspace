    image: assets/stats/tb_belgium_data1.png
    no_telop: true
  - text: 日本とも、2018年のワールドカップで戦った相手です。
    image: assets/stats/tb_belgium_data_r2.png
    no_telop: true
  - text: 国の最高成績を残した8年前と、いまのベルギーは、何が違うのでしょうか。
    image: assets/stats/tb_belgium_data_t.png
