# 代表チーム紹介 ベルギー代表（10/29 作成。固定シリーズ9「代表チーム紹介」。見本は 10/28 のウルグアイ代表 scripts/20261028_team_uruguay.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **軸（2026-10-29）**：「2026年W杯で優勝したスペインが8試合で許した1点は、ベルギーが取った。それでも8強で止まった。3位だった2018年と何が違うのか」。答えは見立ての節（2018年の7試合と2026年の6試合の1試合あたりの得点・失点を自分で割って比べる）。
# **日本との接点**：2018年W杯の決勝トーナメント1回戦（ロストフ）で日本は2点を先に取り、2対3で逆転負け。2002年W杯の1次リーグでも2対2。通算6試合、日本から見て2勝2分2敗。基礎DATAの次の節に置いた。
# **重なりの確認（2026-10-29）**：scripts/・research/covered.yaml・research/posted.json を grep。ベルギー代表の「紹介」回（team_belgium）は無い。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ・ウルグアイ。covered.yaml・posted.json に「ベルギー代表」が主役の回は無い（9/26 のイタリア代表の試合の回の出典にイタリア対ベルギーの記事があるだけ）。
# ---- 確かめたこと（2026-10-29。WebFetch の要約は使わず、requests で Wikipedia の生の wikitext を読んだ）----
#  ・FIFAランク：8位（2026-10-07 発表）。Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）で Belgium 8・前回比0。日本は17位、スペイン1位、フランス3位（同じ表）。点数は書かない。
#  ・W杯：出場15回（1930年が初）。最高は2018年の3位（Belgium national football team の infobox「World cup best = Third place (2018)」）。1986年は4位（Belgium at the FIFA World Cup 本文）。
#  ・Belgium at the FIFA World Cup の表：2018年 3位・7試合6勝0分1敗・16得点6失点／2022年 1次リーグ・3試合1勝1分1敗・1得点2失点／2026年 準々決勝・6試合3勝2分1敗・14得点7失点。
#  ・自分で割った（検算した）：2018年 16÷7=2.29・6÷7=0.86・勝率 6÷7=86%／2026年 14÷6=2.33・7÷6=1.17・勝率 3÷6=50%。
#  ・2026年W杯の6試合（Belgium national football team の試合一覧）：6/15 エジプト1-1（ハニーのオウンゴール66分／アシュール19分）、6/21 イラン0-0、6/26 ニュージーランド5-1（トロサール28・50分、デ・ブライネ66分、ルカク86分、サーレマーケルス90+4分）、7/1 32強 セネガル3-2（延長。ルカク86分、ティーレマンス89分・120+5分PK）、7/6 16強 アメリカ4-1（デ・ケテラエル9・33分、ファナーケン57分、ルカク90+3分）、7/10 準々決勝 スペイン1-2（デ・ケテラエル41分／ファビアン30分・メリーノ88分）。
#  ・スペインは2026年W杯で優勝（7/19 決勝でアルゼンチンに勝利）。Spain at the FIFA World Cup の表で2026年は8試合7勝1分0敗・14得点1失点。本文「Belgium ... being the only team to score ... against the eventual champion in the entire tournament」とも一致。
#  ・ユーロ：最高は1980年の準優勝（infobox）。FIFAランク1位は2015年11月〜2016年3月と2018年9月〜2022年3月（infobox の FIFA max date）。
#  ・監督：マルク・ファン・ボメル。2026-07-24 に就任、前任はルディ・ガルシア（Mark van Bommel の記事本文、RBFA の発表を出典）。選手としてオランダ代表79試合10得点、2010年W杯準優勝（同じ記事の infobox・medal）。ベルギー代表で4試合2勝0分2敗・6得点5失点（同じ記事の監督成績の表）。
#  ・主将：ユーリ・ティーレマンス（名簿の印 captain。2025-09-03 に主将に、Reuters を出典）。代表93試合15得点、所属マンチェスター・ユナイテッド。副主将：ケヴィン・デ・ブライネ（vice-captain、127試合40得点、ナポリ）。名簿の数字は「Information correct as of 5 October 2026」。
#  ・愛称：Red Devils（オランダ語 De Rode Duivels）＝赤い悪魔（infobox）。
#  ・名簿・年齢：Wikipedia の Current squad と Recent call-ups（10月の名簿）。2026-10-29 時点の年齢（生年月日から計算）：ティーレマンス 1997-05-07=29（マンチェスター・ユナイテッド、MF）、デ・ブライネ 1991-06-28=35（ナポリ、MF）、クルトワ 1992-05-11=34（レアル・マドリード、GK、115試合）、ルカク 1993-05-13=33（フェネルバフチェ、FW、135試合94得点＝infobox の歴代最多得点）、デ・ケテラエル 2001-03-10=25（アタランタ、FW、39試合9得点）、ドク 2002-05-27=24（マンチェスター・シティ、FW、48試合7得点）。
#  ・W杯のあと（Nations League A。試合一覧で日付・スコア・得点者を確認）：9/25 イタリア0-2（ローマ。ゴッツ20分・ルケバキオ69分）／9/28 フランス0-1（ブリュッセル。オリーズ88分）／10/2 トルコ3-0（リエージュ。デ・ブライネ10・60分、ルカク76分）／10/5 フランス1-4（サン＝ドニ。ルケバキオ35分／ドゥエ77分・シェルキ81分・オリーズ88・90+1分）＝2勝2敗・6得点5失点。次は 11/12 トルコ（敵地）、11/15 イタリア（ブリュッセル）。
#  ・日本との対戦：国際Aマッチ6試合、日本から見て2勝2分2敗・11得点8失点（Japan national football team records and statistics の Head-to-head：BEL 1999–2018 6・2・2・2・11・8）。試合は Japan national football team results の各表：1999-06-03 キリンカップ 0-0（国立）／2002-06-04 W杯 2-2（埼玉）／2009-05-31 キリンカップ 4-0（国立）／2013-11-19 親善試合 3-2（ブリュッセル）／2017-11-14 親善試合 0-1（ブルッヘ）／2018-07-02 W杯16強 2-3（ロストフ）。ロストフの得点（2018 FIFA World Cup knockout stage）：原口元気48分・乾貴士52分／フェルトンゲン69分・フェライニ74分・シャドリ90+4分。
# ---- 言わないもの ----
#  ・怪我／出場停止（名簿の SUS の印）／私生活／背番号／戦術の説明／監督の契約の金額／ガルシア前監督の退任の事情。
