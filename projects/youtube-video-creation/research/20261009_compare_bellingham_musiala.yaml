  title: ベリンガムとムシアラを同じ日数で並べる。2人がそろって出ていた試合
  question: 同じ年に生まれた2人を同じ日数で切ると、数字のどこが違うのか
  lead: 同じ2003年生まれ。片方はイングランド、片方はドイツ。
  hook: 生まれてからの日数をそろえて、数字を並べ直します。
  takeaway: ベリンガムとムシアラは、イングランドの年代別代表で15試合、同じチームにいた（2016年12月〜2019年9月、アンダー15で4、アンダー16で9、アンダー17で2）。2018年11月の日本のアンダー15との試合には2人とも出て、ムシアラが1点を決めている。その3週間前、ムシアラはドイツのアンダー16としても2試合に出ていた。生後8502日＝どちらも23歳101日で切ると、出場は384と273、先発の割合は85.9%と63.4%、出場時間は2万9196分と1万5915分で147試合ぶんの差がある。得点は91と78だが、90分あたりに直すと0.28と0.44で1.57倍。ただしリーグの形が違い、昨季の1試合あたりの得点はラ・リーガがおよそ2.7点、ブンデスリーガがおよそ3.2点だった。チームが戦った時間のうち立っていたのはクラブで72.6%と46.8%、代表で54.3%と41.7%。怪我は8件193日31試合と24件501日83試合で、ムシアラは2025年の夏から33試合195日を続けて欠場している。市場価値は2022年11月9日の同じ更新で2人とも1億ユーロだったが、いまは1.6億ユーロと8000万ユーロでちょうど2.0倍。タイトル1つあたりの試合数は64.0と17.6で、ムシアラの16のうち5つは1分も出ていないため、クラブの出場だけを出場のある11で割り直すと21.4になる。次の物差しは10月15日とされるムシアラの復帰で、そこから出られた時間の割合がどう動くか
  opening_image: assets/images/20261009_cmp_pair/01.jpg
  bgm: assets/audio/bgm_calm.wav
