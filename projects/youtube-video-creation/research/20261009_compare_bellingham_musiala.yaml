      source: Transfermarkt の負傷の一覧
  - text: 件数は8件と24件、離脱した日数は193日と501日。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 1, source: Transfermarkt の負傷の一覧}
  - text: 欠場した試合は31試合と83試合です。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 2, source: Transfermarkt の負傷の一覧}
  - text: ムシアラは2025年の夏、足首の骨折にともなって腓骨を折りました。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 3, source: Transfermarkt の負傷の一覧}
  - text: そこから33試合、195日を続けて欠場。戻った試合でピッチにいたのは3分でした。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 3, source: Transfermarkt の負傷の一覧}
  - text: 今季の初めには、体調のために3試合を欠場しています。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 2, source: Transfermarkt の負傷の一覧}
  - text: ベリンガムのいちばん長い連続欠場は、今年2月からの9試合、49日。
    card: {type: table, title: 怪我で失ったもの（通算）, columns: [項目, ベリンガム, ムシアラ], rows: [*c0, *c1, *c2, *c3], highlight_row: 3, source: Transfermarkt の負傷の一覧}
  - text: クラブの発表では、左脚の筋肉の負傷でした。
  - text: そしてムシアラは、9月24日の代表戦のウォームアップで右の太ももを痛めています。
  - text: 先発の名前に入っていながら、ピッチに出られないまま退きました。
  sources:
