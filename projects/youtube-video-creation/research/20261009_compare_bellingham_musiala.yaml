  - text: 2022年11月9日の更新で、2人はそろって1億ユーロになりました。
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2022年11月', source: Transfermarkt の市場価値の推移}
  - text: 19歳のベリンガムと、19歳のムシアラ。ここまでは同じ高さでした。
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2022年11月', source: Transfermarkt の市場価値の推移}
  - text: その1年9か月前、進路を決めたときにムシアラが残した言葉です。
  - voice: ムシアラ
    text: ドイツのための心と、イングランドのための心がある。
    card: none
  - voice: ムシアラ
    text: どちらの心も、これからも打ち続ける。
    cont: true
    pause: 0.5
  - text: 線が離れていくのは、ここからです。
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2023年12月', source: Transfermarkt の市場価値の推移}
  - text: ベリンガムは1年あまりで1.8億ユーロへ。
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2023年12月', source: Transfermarkt の市場価値の推移}
  - text: ムシアラの最高額1.4億ユーロは、さらに1年あとでした。
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2024年12月', source: Transfermarkt の市場価値の推移}
  - text: いまは1.6億ユーロと8000万ユーロ。ちょうど2.0倍の開きです。
    emph: true
    card: {type: line, title: 推定の市場価値の歩み, unit: 億ユーロ, x: ['2022年11月', '2023年12月', '2024年12月', '2025年12月', '2026年10月'], series: [[ベリンガム, [1.0, 1.8, 1.8, 1.6, 1.6]], [ムシアラ, [1.0, 1.1, 1.4, 1.3, 0.8]]], focus: ムシアラ, highlight: '2026年10月', source: Transfermarkt の市場価値の推移}
  - text: もうひとつ、自分で割ってみた数があります。タイトル1つあたりの試合数です。
  - text: 通算の出場をタイトルの数で割ると、ベリンガムは64.0、ムシアラは17.6。
  - text: ただしムシアラの16のタイトルのうち5つは、その大会に1分も出ていません。
  - text: 出場のある11のタイトルで、クラブの試合だけを割り直すと21.4です。
    card: &calc
      type: calc
      title: 出場のあるタイトルで割り直す（ムシアラ）
      terms:
      - ['235試合', クラブの出場]
      - ['11', 出場のあるタイトル]
      - ['21.4試合', 1つあたり]
      ops: ['÷', '＝']
  - text: これは毎年のように勝つクラブに16歳からいた、というクラブの力の話です。
    card: *calc
  - text: 2人の優劣ではありません。
    card: *calc
  - text: 次の物差しは、10月15日とされているムシアラの復帰です。
  - text: そこから、出られる時間の割合がどこまで戻るか。
  - text: 同じ年に生まれた2人の線が、また近づくのかどうかが見えます。
