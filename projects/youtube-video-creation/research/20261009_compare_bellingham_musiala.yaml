# 取材メモ（10/9 金、シリーズ「比べる」、key: compare_bellingham_musiala、型は news）。
# 材料の控えは research/raw/20261009_compare_bellingham_musiala_material.md。**この控えの外へ出ていない。**
#
# 軸は「同じ2003年生まれの2人を、生後8502日（＝どちらも23歳101日）で切りそろえる」こと。
#   山場の頭に置く強い一点は、**2人がイングランドの年代別代表で15試合、同じチームにいた**こと
#   （2016-12〜2019-09、材料 9-1。10/6 のベリンガム紹介でも 9/11 のムシアラの回でも一度も出していない）。
# 既出を避けたもの（材料 0・0-B の表をそのまま守った）:
#   10/6 ベリンガム紹介… 背番号22の足し算・永久欠番・入団時の言葉・父マークの700点・16歳38日デビュー・
#     19歳で主将・1年目リーグ19点・プレースタイルのレーダー・10/3 クロアチア戦の1点3アシスト・
#     バロンドール・2025年夏の肩の手術の物語。どれも一度も出していない。移籍金にも触れていない。
#   9/11 ムシアラの回… 本人がSNSで公表した診断名・プレシーズンに倒れた場面・本人とコンパニとケインの言葉・
#     クラブの欧州通算900点目・「帰ってきた男」という筋。**病名は画面にも読み上げにも出していない。**
#     体調による欠場は「3試合」という数字としてだけ出し、こちらで深刻さを足していない。
#   10/2 エムバペ×ハーランド… PK抜き・26歳の誕生日まで・「誕生日の前日までの通算得点」の棒グラフ・
#     「早く頂点に着いた線と、いま頂点にいる線」の締め。言い回しも締め方も重ねていない。
#   10/4 ヤマル×メッシ… 19歳83日・デビュー年齢の表・「どの一歩も1年以上早い」。使っていない。
# **言い切っていないもの**:
#   どちらが上かは一度も言わない。90分あたりの差は「点の出方が違う」までにして、リーグの形（材料10節）を添えた。
#   アシストの数は Transfermarkt と FotMob で食い違う（ムシアラのバイエルンが46対38）ので**表にも語りにも入れていない**。
#   ベリンガムの2026年2月の負傷部位は「左脚の筋肉」までにした（「半腱筋」は二次情報だけ。材料11）。
#   ムシアラがドイツを選んだときの言葉は**英語版**（The Athletic の取材を Sky Sports が引用）から訳した。
#   ドイツ語の原文は kicker が 403 で読めず未確認なので使っていない。
#   タイトルの数は「クラブの力の話で、2人の優劣ではない」と節の中で声に出して添えた。
#   16冠のうち5つは1分も出ていないので、割り直しは**クラブの出場（235試合）だけ**を11で割ったと言ってある。
# 自分で計算した数（材料 2-A・6-D・7・9 に式と元の数字がある）:
#   90分あたり 91×90/29196=0.2805／78×90/15915=0.4411 と比 1.57倍、出場時間差 13281分＝147.6試合ぶん、
#   出場時間の割合 24894÷(381×90)=72.6%／13550÷(322×90)=46.8%／4302÷(88×90)=54.3%／2849÷(76×90)=41.7%、
#   235÷11=21.4、1.6億÷8000万=2.0倍。
# 数字の基準日はすべて **2026年10月8日**（イングランド対チェコまで反映）。
# 反応は入れていない（シリーズの回。ブラウザの道具を使っていないので集めていない）。
#   他人の声は、ムシアラが進路を決めたときの言葉2行だけ。**山場（main）には声を置いていない**
#   （置くと「ショートで16秒まで」に収まらず、強い一点を頭から押しのけるため）。
# 写真: ベリンガムは Commons の2026年6月（イングランド対ガーナ、CC BY-SA 4.0 / Bryan Berlin）、
#   ムシアラは Commons の2026年6月（エクアドル対ドイツ、CC BY-SA 4.0 / Bryan Berlin・YantsImages）。
#   **10/6 の回で使った9枚（real2026・birmingham・laureus・croatia・panama・ghana・espanyol・pair_tuchel・thumbfull）は
#   1枚も使っていない。**冒頭と見立ては tools/pairphoto.py で横に並べた1枚（縦版 01_v.jpg がショート用）。
# サムネは構図 versus（2人の比べはこの構図、と CLAUDE.md にある）。同じ日の他の本は number・scene・scene・versus。
#   伏せるのは「15試合を共にした●●代表」＝イングランド。作り込みの tint と rays は切ってある。
# **draft のヒントで直さずに残したもの**:
#   ①「出典12本のうち8本が transfermarkt」… この回は試合ごとの記録を自分で足して作った数字が芯なので、
#     出どころが1つに寄るのは中身のとおり。怪我と復帰は Bundesliga 公式、負傷部位は beIN、
#     ムシアラの言葉は Sky Sports、評点は FotMob と、別の出どころも当てている。
#   ②「ネットの反応が1件もありません」… シリーズの回で、ブラウザの道具を使わない約束なので集めていない。
#     声が1件も無い台本は通してよい（2026-09-28 の整理）。
#   ③「01_face.jpg が縦長」… これは **サムネ（versus の左）専用の切り抜き**で、本文にも冒頭にも使っていない
#     （冒頭は theme.opening_image の横並び1枚、本文は各節の image で横長を指定している）。preview4 の冒頭も横並びの1枚だった。
# **preview4 で残した △**: 山場（13.1秒）で、ムシアラの顎のすぐ下にテロップの帯が接する。
#   年表の板を右へ寄せる・顔を右に動かす、の両方を試したが、顔を右に寄せると今度は板が顔に26%かかって × になった。
#   帯が接するだけで顔は隠れていないので、この形にした。
# 写真のファイル: eng2026/01.jpg（元）→ 01_w.jpg（16:9）→ 01_r.jpg（表を左に置くので右を落としてベリンガムを右寄りに）
#   ・01_r_v.jpg（ショート用の縦）・01_face.jpg（サムネ用）。ムシアラ側も wide/01_w.jpg → 01_r.jpg。
#   横並びの1枚（cmp_pair/01.jpg）はベリンガム左・ムシアラ右。その縦版 01_v.jpg は **ムシアラが上**にしてある
#   （ベリンガムを上にすると、下に来たムシアラの顔にショートのテロップの帯がかかった）。
