# 取材メモ（2026年10月21日）中村敬斗の退場のあと、ニアカテが言ったこと（ニュースのショート。見せ方 X＝冒頭に事実の一言）
# 取材: 2026-10-21。requests（ブラウザUA）で本文を全部読んだ。
#   ・サッカーダイジェストWeb 2026-10-21（id=198739）: ニアカテが『GONES RADIO』で明かした言葉。謝罪「ムサ、ごめんよ」→「気にするな。…君のために、最後まで踏ん張ってみせる」。
#     ドレッシングルームに呼びに行った／「試合運営の責任者に許可を求めた」／「僕たちは一つのグループ。27人の仲間」。セネガル代表DF。
#   ・ゲキサカ 2026-10-19: 同じ件。訳が違う（「謝らなくていい。心配しないで。…君のために頑張る」）。フォンセカ監督の一体感のコメント。中村の赤紙はトゥエンテ時代の2019年9月15日以来。15日のELで2アシスト。
# 【食い違い・扱い】
#   ・ニアカテの言葉は2社で日本語訳が違う（原文は仏語/ラジオ）。→ **台本はサッカーダイジェストWebの訳を一字ずつそのまま**引く。ゲキサカの「君のために頑張る」は題には使わない。
#   ・ゲキサカは「上位5チームが勝ち点で並ぶ」、10/19 の台本は「4チーム」。→ **今回は順位の話をしない**。
#   ・「許可を求めた」「出してくれた」は サッカーダイジェスト。ゲキサカは「許可を得られた」。一致。
#   ・誰が呼んだか: ゲキサカ「チームメイトが呼び寄せた／呼んだ一人のDFニアカテ」、SD「ニアカテが呼びに行った」。→ 「ニアカテは呼びに行った」と言い、独り占めにしない（ゲキサカは「一人」）。
# 【前の本と重ねない】10/19「退場の場面・故意ではなかった・勝ち点14・PSG戦出場停止・本人とクラブの言葉は出ていない」。
#   → 今回は **同僚の言葉と行動・監督の一体感の言葉**。反則の細部・勝ち点・首位は言わない。出場時間と退場の分だけ1行。
# 本人（中村）の言葉: **無い**（謝ったことはニアカテの言葉の中だけ）。作らない。Y にしない（X）。
# 反応: 0件（作らない。SD の記事にあるネットの声は使わない）。
# 写真: 10/19 の4枚（ligue1.com © LFP Media、スタッド・ランス時代。ユーザーが再利用を許可）。目で見て4枚とも本人（ヘアバンド・17番）。透かし無し。「過去の写真」と台本で断らない。
