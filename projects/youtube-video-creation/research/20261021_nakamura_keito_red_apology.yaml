sections:
  - id: what
    main: true
    heading: 退場した中村に、ニアカテは何と言ったのか
    tier: 報道
    telop: 退場後、中村はニアカテに謝った
    say:
      - text: 18日に退場した中村敬斗に、セネガル代表DFのニアカテが声をかけました。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - text: 中村は61分に入って70分に退場。試合は、リヨンの2対1の勝ちでした。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: 彼がレッドカードを受けた時、
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - voice: ニアカテ
        text: 僕に『ムサ、ごめんよ』と謝罪してきたんだ。
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: 彼には『気にするな。自分たちのため、今シーズンの戦いのため、
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - voice: ニアカテ
        text: サポーターのため、そして君のために、
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: 最後まで踏ん張ってみせる』と伝えたよ。
        cont: true
        short_voice: true
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
    official: false
    sources:
      - https://www.soccerdigestweb.com/news/detail/id=198739
      - https://web.gekisaka.jp/news/world/detail/?461356-461356-fl
    quotes_from: ["サッカーダイジェストWeb https://www.soccerdigestweb.com/news/detail/id=198739"]

  - id: call
    heading: 勝ったあと、ニアカテは何をしたのか
    tier: 報道
    telop: 試合後、中村を歓喜の場へ呼びに行った
    say:
      - text: 2対1の勝ちのあと、ニアカテはロッカールームの中村を呼びに行きました。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: 試合運営の責任者に許可を求めたんだ。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - voice: ニアカテ
        text: 退場処分を受けた選手は
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: ピッチに出ることが認められない場合もあると知っていたからね。
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - voice: ニアカテ
        text: でも、彼は事情を理解し、許可を出してくれた。当然のことさ。
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: 僕たちは一つのグループなんだからね。27人の仲間なんだ。
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - text: フォンセカ監督も、チームの一体感に触れています。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: フォンセカ監督
        text: 選手はロッカーで強力な関係を築いている。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
    official: false
    sources:
      - https://www.soccerdigestweb.com/news/detail/id=198739
      - https://web.gekisaka.jp/news/world/detail/?461356-461356-fl
    quotes_from: ["サッカーダイジェストWeb https://www.soccerdigestweb.com/news/detail/id=198739", "ゲキサカ https://web.gekisaka.jp/news/world/detail/?461356-461356-fl"]

  - id: view
    viewpoint: true
    heading: 中村の退場のあと、リヨンの輪は何を見せたのか
    tier: 背景
    telop: レッドカードは2019年9月以来。3日前のELでは2アシスト
    say:
      - text: 見立てです。中村は15日のヨーロッパリーグで2アシスト。その3日後に退場しました。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - text: レッドカードは、トゥウェンテにいた2019年9月15日以来です。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - text: そのあとに出たのが、同僚の「君のために」という言葉と、呼びに行く行動でした。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - voice: ニアカテ
        text: レッドカードをもらうこともあれば、PKを外すこともある。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - voice: ニアカテ
        text: でも、その一方で、喜びを分かち合える瞬間も必ず訪れるんだ。
        cont: true
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
      - text: リヨンが今季好調な背景には、この団結力もあると伝えられています。
        image: assets/images/20261021_nakamura_keito_red_apology/01_w.jpg
        card: none
      - text: 次のリーグ戦はパリ・サンジェルマン戦で、中村は出場停止と伝えられています。
        image: assets/images/20261021_nakamura_keito_red_apology/02.jpg
        card: none
    official: false
    sources:
      - https://www.soccerdigestweb.com/news/detail/id=198739
      - https://web.gekisaka.jp/news/world/detail/?461356-461356-fl
    quotes_from: ["サッカーダイジェストWeb https://www.soccerdigestweb.com/news/detail/id=198739"]
