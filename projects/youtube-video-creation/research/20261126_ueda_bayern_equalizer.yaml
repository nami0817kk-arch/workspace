# 取材: 2026-11-26。WebFetch と requests（ブラウザUA）だけ。検索エンジンのAI要約・ブラウザの道具は使っていない。
# ESPN の試合データ（site.api.espn.com uefa.champions summary event=401915377、2026-11-25 20:00 UTC）: リール 2-1 バイエルン。
#   15分 ウパメカノ（CKのあと至近距離のヘディング、ビショフのクロス）／62分 上田（右足、エリア左から右下隅、エンゴイのスルーパス）／65分 パヴロヴィッチのオウンゴール。
#   上田は先発、77分にオナルと交代。伊藤洋輝はバイエルンの先発、76分にビンダーと交代。53分ライマー警告。
#   シュート: リール15本（枠内3）、バイエルン12本（枠内7）。ボール保持 バイエルン 64.8%。
# ゲキサカ 463977（11/26 06:52、全文）: スタメン復帰の上田は後半17分に同点弾、同32分に途中交代。伊藤は先発し後半31分まで。
#   足底筋膜断裂から復帰2戦目の上田は、後半1分にゴール前の競り合いからネットを揺らすが、VARの結果ファウルで取り消し。
#   後半17分、エンゴイのドリブルからペナルティエリア左へのパス、マークを外して受けた上田が右足でゴール右へ。今大会2得点目。
#   後半20分、カウンターからムバッペのシュートが左ポスト→跳ね返りがパブロビッチに当たってオウンゴール。リールは開幕5戦目で初白星、バイエルンは今大会初黒星。
#   次: リールは12月9日に敵地でシュツットガルト、バイエルンは12月8日にホームでスラビア・プラハ。
# フットボールチャンネル post1059200（11/26、全文）: 負傷離脱から43日ぶりの先発。9月20日のニース戦以来66日ぶりのクラブでの得点、公式戦4得点目。CLは9月8日のベティス戦以来の今季2得点目。
#   リールは今大会1分3敗の勝ち点1だった。10月13日のCLアーセナル戦で左足を負傷（足底筋膜断裂）、公式戦6試合を欠場。21日のリヨン戦で39日ぶりに復帰。
# サッカーキング 2231535（11/26、全文）: 47分、ウパメカノのクリアミスに上田が反応しキミッヒと競り合いながらネットを揺らすが、オンフィールドレビューで上田のファウル。
#   62分、エンゴイのドリブルからボックス内左へのパス→上田がファーサイドへ。65分 GKエゼルのスローからカウンター、エムバペのシュートが左ポスト→戻ったパヴロヴィッチに当たってゴール。「わずか3分間で逆転」。バイエルンはそれまで2勝2分。
# 日刊スポーツ（Yahoo 43c83785、11/26）: 後半開始早々、ウパメカノが頭でGKへ戻したボールを押し込んだが、VARでキミッヒの足を右足で蹴っていたとしてファウル。CL通算4点目。
# スポーティングニュース（Yahoo dd3640a3）: フェイエノールト時代の2025年1月にもCLのバイエルン戦で得点。
#   → ESPN（event 720341、2025-01-22）で確認: フェイエノールト 3-0 バイエルン、89分 上田（左足）。
# クラブ公式 losc.fr「LOSC-Bayern Munich : (2-1) : Renversants, les Dogues s'offrent un géant !」（11/25 22:50、全文）:
#   47分 上田の同点弾はVARで取り消し。62分 エンゴイから上田がファーのサイドネットへ。65分 エゼルの素早いリスタート→アンドレ→ムバッペ、ポスト→パヴロヴィッチがそらして自陣ゴールへ。
#   「2年前のレアル・マドリードに続き、欧州の巨人を倒した」。次はリーグ・アン、土曜にル・マン（敵地）。
# 食い違い:
#   ・取り消された場面の分: ゲキサカ・サッカーダイジェスト 46分（後半1分）、サッカーキング・クラブ公式 47分。→ 分は言わず「後半の立ち上がり」。
#   ・取り消しの経緯: サッカーキングは「ウパメカノのクリアミス」、日刊は「頭でGKへ戻したボール」。→ 経緯は言わず「競り合いでファウルがあったとして取り消し」（両方に共通）。
#   ・オウンゴールの起点: ゲキサカ・日刊「相手FKを防いだあと」、クラブ公式・サッカーキング「GKの素早いスロー・リスタート」。→ 「カウンターから」とだけ言う。
#   ・上田の交代: ESPN・ゲキサカ 77分、クラブ公式 76分。伊藤の交代: ESPN 76分、ゲキサカ 後半31分（76分）、日刊 後半32分。→ 交代の分は言わない（「後半途中まで」）。
#   ・CLのゴール数: 「今季2点目」（ゲキサカ・フットボールチャンネル）と「通算4点目」（日刊）は数え方の違い。→ 今季2点目だけを使う。
#   ・ESPN の取り消しの記録は無い（取り消しは報道各社とクラブ公式で一致）。
# 自分で数えたもの: 62分の同点から65分の勝ち越しまで3分（ESPN）。バイエルン相手のCLゴールは2025年1月（89分）に続いて2度目（ESPN 2試合）。
#   リールのCL: 1分3敗 → 1勝1分3敗。
# 前の本との重なり: 11/20 ueda_lille_stadium（本拠地）／11/22 ueda_lille_return（39日ぶり復帰・3本のシュート）。→ 今回の初出は復帰後初先発・初ゴール・取り消し・3分の逆転・伊藤との対決。「39日ぶり」「3本のシュート」は繰り返さない。
# 【言わないこと】上田の気持ち（本人の言葉なし）／取り消しの経緯の細部・分（食い違い）／交代の分／「ケインはバロンドール」等の背景。
# 本人の言葉: 見つからず（ゲキサカ・フットボールチャンネル・サッカーキング・日刊・サッカーダイジェスト・クラブ公式の試合記事、Yahoo の一覧を当たった。11/26 朝の時点で試合後コメントの記事は無い）。→ X。
# 写真: 3枚。01＝Le Petit Lillois（Quentin Delcourt）の試合記事の主写真、同点弾のあとハラルドソンと喜ぶ上田（今日。ショート用の縦は上田中心に切り直した）。02＝クラブ公式 losc.fr の試合記事の写真、頭に手を当てる上田（今日）。03＝Le Petit Lillois の先発発表記事の主写真（11/21 リヨン戦の背中、18 AYASE）。
