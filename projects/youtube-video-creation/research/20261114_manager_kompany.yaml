# 監督紹介：ヴァンサン・コンパニ（11/14 土、シリーズ「監督紹介」、key: manager_kompany、型は news）。9節の型。見本は 20261110_manager_emery、同日組の 20261112_manager_alonso。
# 順：フック→基礎DATA→日本との接点（2018年W杯 ベルギー対日本）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-11）**：既出14人（…エメリ）と、同じ11/12 の分のアロンソ以外の大物。
#   ・ジダン（10/03・10/18 と重なる）、森保一（10/06 に「監督の経歴」で本が出ている）は外した。
#   ・コンパニ：バイエルン監督。英語版 Wikipedia の冒頭で確認（is the head coach of Bundesliga club Bayern Munich）。「降格したバーンリーの監督が、翌年にバイエルンで優勝」という問いが立つ。
#   **重なりの確認（2026-11-11 に自分で）**：posted.json に kompany の本は無い。scripts/20261024_kompany_hospital.md はニュースのショート（練習中に倒れて病院へ）。
#   バイエルンは 10/11 財政・10/21 クラブ紹介で出ているが、クラブの話で監督の経歴は扱っていない。同じ 11/14 の他の担当（research/20261112_picks.txt）：財政＝リーズ、代表＝韓国。重ならない。
#   病気の話（10/24 のショート）は入れない。
#
# **いまの立場**：バイエルン・ミュンヘン監督（2024-05-29 から。2025-10-21 に契約を2029-06-30 まで延長）。
#   ○ 英語版 Wikipedia「Vincent Kompany」（2026-11-11 に読む）：「is the head coach of Bundesliga club Bayern Munich」「signed a new contract extension that will keep him at the club until 30 June 2029」。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of match played 28 October 2026）：
#   アンデルレヒト（2019年 選手兼任）4試合0勝2分2敗／アンデルレヒト（2020-08〜2022-06）92試合42勝32分18敗／バーンリー 96試合41勝24分31敗／バイエルン 124試合93勝19分12敗。
#   Total 316試合176勝77分63敗。自分で足して一致（4+92+96+124＝316、0+42+41+93＝176、2+32+24+19＝77、2+18+31+12＝63）。下部組織は無い。
#   アンデルレヒトは2つの就任期間を合算：96試合42勝（勝率 43.8%）。バーンリー 42.7%、バイエルン 75.0%、通算 55.7%（表の値と一致、自分で割って確認）。
#   ※バイエルンの試合数は 10/28 時点。以降の試合は含まない。台本の数字は「10月28日までの通算」と扱う（サムネの表の見出しに日付）。
#
# **歩み**（英語版本文）：
#   2019-05 マンチェスター・シティを離れ、古巣アンデルレヒトの選手兼監督に。2020-08-17 に引退して正式に監督（4季契約）。2021-22 はカップ決勝でヘントにPK負け、リーグ3位。
#   2022-06-14 バーンリー（降格直後のチャンピオンシップ）。2022-23 は勝点101（46試合で負け3）、チャンピオンシップ優勝・昇格。
#   2023-24 プレミアは19位、勝点24（クラブ最少）で降格。
#   2024-05-29 バイエルン（3年契約）。バーンリーへの補償金は報道で約1,020万ポンド。
#   2024-25 ブンデス優勝（5月4日決定。34試合で負け2）。2024-09 チャンピオンズリーグで ディナモ・ザグレブに9-2（CLの試合で8点を超えた初の監督）、3試合で20ゴール。
#   2025-26 スーパー杯（シュツットガルト）→ブンデス連覇（リーグ最多の122得点。就任から2季連続優勝は、グアルディオラ、フリック、ハッペルに続く4人目）→CLは準決勝でPSGに敗退→DFB杯決勝でシュツットガルトに3-0（6年ぶり）。2026年のスーパー杯も優勝（Honours）。
#
# **戦術の色**＝2024年9月 バイエルン 9-2 ディナモ・ザグレブ（英語版本文）。パスをつなぐ、ボールを持つスタイル。グアルディオラのシティに近い、とされる（Managerial style）。直接的で体の強さを使うディーチェのバーンリーとは大きく違う、とも。
#
# **日本との接点**：2018年ロシアW杯 決勝トーナメント1回戦 ベルギー 3-2 日本（ロストフ）。コンパニは決勝トーナメントで全時間に出場（英語版 Kompany: playing every minute in the knockout phase）。スコア・得点者は「2018 FIFA World Cup knockout stage」で確認。
#
# **本人の言葉**：Sports Mole 2026-02-19（バイエルンの会員向けイベントでの発言。requests で本文を読んだ。英語に訳された記事）：
#   "It's not exactly about tactics. It's about mentality, about always wanting to win everything, about treating every game as an important game..." / "The best manager I ever had was, without a doubt, Pep Guardiola. He expanded my understanding of football." / "You absorb something from each manager to write your own story."
# **マル秘話**（英語版 Personal life）：2018年にマンチェスター・ビジネス・スクールで MBA。フランス語・オランダ語・ドイツ語・英語を話す（イタリア語・スペイン語は中級）。2013年、ブリュッセルの若者のためにベルギー3部のクラブ「ブレード」を買った。
#
# **入れなかったもの**：10/24 の病院の件（病気）、父の政治・家族・家庭（私生活）、レストランの失敗、バーンリーの「未熟」と評した記事（監督を小さく見せる）、退場処分の件、FotMob・女子・ニュースの反応。
