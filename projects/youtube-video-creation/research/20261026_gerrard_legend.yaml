    - [2018〜21年, レンジャーズの監督]
    - [2021〜22年, アストン・ヴィラの監督]
    - [2023〜25年, サウジのアル・イテファクの監督]
    - [2026年10月, テレビの解説を続ける]
    focus: 0
    highlight_row: 0
  say:
  - text: ジェラードは引退の翌年、2017年に、リヴァプールの育成年代の指導を始めます。
    card: *id012
    image: assets/images/20261026_gerrard_legend/05_w.jpg
  - text: 2018年には、スコットランドのレンジャーズの監督に。
    card:
      type: timeline
      title: 引退のあと
      rows: *id013
      focus: 1
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/01_w.jpg
  - text: 3シーズン目の2020年から21年、リーグ戦38試合を1つも負けずに優勝。
    card:
      type: timeline
      title: 引退のあと
      rows: *id013
      focus: 1
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/02_w.jpg
    emph: true
  - {text: それまでは、宿敵セルティックが9シーズン続けて優勝していました。, card: none}
  - {text: 勝ち点は102、失点は13。ジェラードの、監督として初めてのリーグ優勝です。, card: none, image: assets/images/20261026_gerrard_legend/05_w.jpg}
  - text: そのあとはアストン・ヴィラ、サウジアラビアのアル・イテファクを率いました。
    card:
      type: timeline
      title: 引退のあと
      rows: *id013
      focus: 3
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/01_w.jpg
  - text: 2025年1月にイテファクを離れてからは、監督の職に就いていません。
    card:
      type: timeline
      title: 引退のあと
      rows: *id013
      focus: 4
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/02_w.jpg
  - {text: 2026年10月の時点では、テレビの解説を続けている、と本人が話しています。, card: none, image: assets/images/20261026_gerrard_legend/05_w.jpg}
