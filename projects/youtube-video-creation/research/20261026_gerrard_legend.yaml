# スティーヴン・ジェラード（元イングランド代表MF）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-26。型は 10/25 のカカと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→引退のあと→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Steven Gerrard の成績表・Honours・各大会ページ）・BBC（2016-11-24 引退、2025-10-11 レンジャーズ）・Liverpool Echo（2026-10-25）と、自分で足した値だけ。
# **私生活・法的な問題は入れない**（Wikipedia の Personal life・Legal problems の節は使わない）。女子サッカーは入れない。
#
# **重なりの確認（10/26）**：scripts/・research/covered.yaml・research/posted.json を「gerrard／ジェラード」で grep。ジェラードが主役の回は無し（20260911_macallister・20260916/20 のリヴァプール紹介・20261023_ibrahimovic_legend・20261024_maldini_legend の本文に名前が出るだけ）。
# **注意**：10/24 のマルディーニの回が、同じ 2005年CL決勝（イスタンブール）を「あの試合」にしている。こちらはジェラードの側（54分の頭の得点・60分のPKを得た場面・残ると決めた言葉）から語り、言い回しは重ねない。
# **引退の確認（一次情報に近いもの）**：BBC 2016-11-24「Steven Gerrard: Liverpool great retires after 19-year career」（本人の声明「I fulfilled my childhood dream by pulling on the famous red shirt of Liverpool.」を requests で本文確認）＋ Guardian 2016-11-24。最後の試合は 2016-11-06 の MLS プレーオフ、コロラド戦（PK戦で敗退、Wikipedia）。→ **現役ではない（46歳）**。
# **いまの立場**：監督は リヴァプールの育成（2017〜18）→ レンジャーズ（2018〜21、2020-21 リーグ無敗優勝）→ アストン・ヴィラ（2021〜22）→ アル・イテファク（2023-07〜2025-01-29 合意で退任、Wikipedia／Sky Sports）。2025-10-11 にレンジャーズへの復帰を断った（BBC 本文確認）。2026-10-25 の Liverpool Echo：2025年1月から監督の職に無く、TNT Sports の解説を務める。本人が Open Goal で「At the moment I am happy, I am doing TV with TNT. I have signed a new deal.」。バーンリーの監督の最有力という記事は**賭け屋のオッズの話なので台本に入れない**。台本は「2026年10月の時点で、監督の職には就いていない・テレビの解説を続けている」と時点を断る。
# **日本との接点（台本の「日本」節）**：
#   - 2002年W杯（日韓大会）：イングランドは出場したが、ジェラードは足の付け根の故障で辞退（Wikipedia International career）。
#   - 2004-06-01 マンチェスター（シティ・オブ・マンチェスター・スタジアム）：FAサマートーナメント イングランド1対1日本。ジェラードは先発・82分交代。得点はオーウェン22分、小野伸二53分（2004 FA Summer Tournament の記事のメンバー表）。大会はイングランドが得失点差で優勝＝ジェラードが代表で手にした唯一のタイトル（Steven Gerrard の記事）。
#   - 2005-12 FIFAクラブ世界選手権（日本開催）：準決勝 12/15 横浜国際総合競技場 サプリサに3対0（クラウチ2点、ジェラード32分）、決勝 12/18 横浜 サンパウロに0対1（ミネイロ27分）。大会の2位の選手の賞（シルバーボール）（2005 FIFA Club World Championship の記事）。出場は成績表 2005-06 の「Other」2試合1得点と一致。
# **数字の出どころと自分で足した値**
# - リヴァプール 710試合186点（BBC 2016-11-24 本文＋Wikipedia の成績表。**季ごとの行を自分で足して 710・186 と一致を確認**）。
# - LAギャラクシー 39試合5点（Wikipedia の季ごとの行 15/2・24/3 を自分で足した値。**Wikipedia の「Career total」の行は 749/190 で、行の和 749/191 と1点食い違う**（国内カップの得点の和が合わない）。台本ではギャラクシーの得点を言わない。サムネの表の合計は行の和）。
# - イングランド代表 114試合21点（BBC が114、21は Wikipedia の年別の表を自分で足した値）。W杯は 2006・2010・2014 の3大会。代表デビュー 2000-05-31 ウクライナ戦。
# - サムネの表：リヴァプール 710/186、LAギャラクシー 39/5、イングランド代表 114/21、合計 863/212（自分で足した値）。
# - リヴァプールのタイトル：FAカップ2（2001・2006）、リーグカップ3（2001・2003・2012）、CL1（2005）、UEFAカップ1（2001）、UEFAスーパーカップ1（2001）、コミュニティ・シールド1（2006）＝9（BBC「winning nine trophies」と一致）。
# - 2005年CL決勝：2005-05-25 イスタンブール、アタテュルク・オリンピック・スタジアム。マルディーニ1分、クレスポ39分・44分で前半0対3。ジェラード54分（リーセのクロスを頭）、シュミツェル56分、60分にジェラードがガットゥーゾに倒されてPK→シャビ・アロンソが止められた跳ね返りを決める。延長117分にドゥデクがシェフチェンコのシュートを2度止める。PK戦3対2。ジェラードは5人目の予定で蹴らず。試合の最優秀選手（2005 UEFA Champions League final の記事）。54分から60分＝6分は自分で引いた値。
# - 「How can I leave after a night like this?」（Wikipedia が BBC の記事を出典に引く。**確度は報道**）。
# - 2006年FAカップ決勝：2006-05-13 カーディフのミレニアム・スタジアム、ウェストハムと3対3（ジェラード54分・90+1分。2点目は約35ヤード＝約32メートルのボレー）、PK戦3対1（ジェラードは成功）。「ジェラード・ファイナル」。この2点で FAカップ・リーグカップ・UEFAカップ・CL の4つの決勝すべてで得点した唯一の選手に（Steven Gerrard の記事）。
# - チェルシーの誘い：2004年夏に2000万ポンドの申し出を断る。2005年7月5日に一度は契約延長の提示を断るが、翌6日に4年契約（Steven Gerrard の記事）。**確度は報道**。
# - 見立て（全部自分で足した・割った値。成績表の季ごとの行から）：1998-99〜2003-04（6季）240試合28点＝約8.6試合に1点／2004-05〜2009-10（6季）292試合104点＝約2.8試合に1点／2010-11〜2014-15（5季）178試合54点＝約3.3試合に1点。合計 710・186 と一致。いちばん多いのは 2008-09 の24点（44試合）。主将は 2003年10月から（Wikipedia）。
# - レンジャーズ 2020-21：38試合無敗、勝ち点102、失点13（Wikipedia）。
# **入れなかったもの**：私生活・家族・法的な問題、2014年4月のチェルシー戦のスリップ、ヴィラでの成績、賭け屋のオッズ、ゴシップ系の記事、2010年の日本戦（出場を一次情報で確かめられなかった）。
# **日本語名・読みで怪しいもの**：ジェラード・ウィストン・ホリエ・ベニテス・リーセ・シュミツェル・ガットゥーゾ・ドゥデク・シェフチェンコ・クレスポ・ミネイロ・サプリサ・アタテュルク・クラウチ・オーウェン・ギャラクシー・イテファク・レンジャーズ（audio_query で見る）。
