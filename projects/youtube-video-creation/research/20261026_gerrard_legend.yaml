- id: secret
  heading: ジェラード・ファイナルと、チェルシーの誘いには、何があったのか
  tier: 報道
  telop: 4つの決勝で得点、残った夏
  card: &id014
    type: table
    title: 知られざる、2つの話
    columns: [いつ, 何があったか]
    rows: &id015
    - [2006年5月, 終了間際の同点弾でFAカップ優勝]
    - [2004〜05年, チェルシーの誘いを断って残留]
    source: Wikipedia
    highlight_row: 0
  say:
  - text: まずは2006年5月、FAカップ決勝。相手はウェストハムです。
    card: *id014
    image: assets/images/20261026_gerrard_legend/01_w.jpg
    emph: true
  - text: 2対3で負けていた後半ロスタイム。約32メートルのボレーで同点に。
    card:
      type: table
      title: 知られざる、2つの話
      columns: [いつ, 何があったか]
      rows: *id015
      source: Wikipedia
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/02_w.jpg
  - {text: PK戦で勝ったこの試合は、ジェラード・ファイナルと呼ばれています。, card: none, image: assets/images/20261026_gerrard_legend/05_w.jpg}
  - {text: この2点で、ジェラードは4つの大会の決勝すべてで点を取った、ただ1人の選手に。, card: none, image: assets/images/20261026_gerrard_legend/01_w.jpg}
  - {text: FAカップ、リーグカップ、ウエファカップ、チャンピオンズリーグの4つです。, card: none}
  - text: もう1つは、2004年の夏。チェルシーが2000万ポンドで手を挙げます。
    card:
      type: table
      title: 知られざる、2つの話
      columns: [いつ, 何があったか]
      rows: *id015
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261026_gerrard_legend/02_w.jpg
    emph: true
  - text: 2005年7月には、契約延長の話がこじれ、一度は提示を断りました。
    card:
      type: table
      title: 知られざる、2つの話
      columns: [いつ, 何があったか]
      rows: *id015
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261026_gerrard_legend/05_w.jpg
  - {text: それでも翌日に、4年の契約を結んで残留しました。, card: none, image: assets/images/20261026_gerrard_legend/02_w.jpg}
  - {text: リヴァプールでのリーグ優勝1度は、よそでの何度もの優勝より重い。, card: none}
  - {text: 残った理由を、ジェラードはそう話しています。, card: none}
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/2006_FA_Cup_final', 'https://en.wikipedia.org/wiki/Steven_Gerrard']
