  - {text: 主将ジェラード。, short_only: true, card: none, image: assets/images/20261026_gerrard_legend/02_w.jpg}
  - {text: いちばん語られるのは、2005年のチャンピオンズリーグ決勝です。, short_only: true, card: none}
  - {text: 2005年5月25日、トルコのイスタンブール。相手はミランでした。, card: none, image: assets/images/20261026_gerrard_legend/01_w.jpg}
  - text: 前半だけで3点を失い、0対3で負けたまま折り返します。
    card: *id010
    image: assets/images/20261026_gerrard_legend/05_w.jpg
  - text: 54分。左からのクロスに、ジェラードが頭で合わせて、1点目。
    card:
      type: timeline
      title: 2005年 CL決勝 ミラン対リヴァプール
      rows: *id011
      focus: 1
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/02_w.jpg
    emph: true
  - text: 2分後の56分、シュミツェルの遠いシュートで、1点差。
    card:
      type: timeline
      title: 2005年 CL決勝 ミラン対リヴァプール
      rows: *id011
      focus: 2
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/01_w.jpg
  - text: 60分、ゴール前へ走り込んだジェラードが倒されて、PK。
    card:
      type: timeline
      title: 2005年 CL決勝 ミラン対リヴァプール
      rows: *id011
      focus: 3
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/05_w.jpg
  - {text: シャビ・アロンソのPKは止められますが、跳ね返りを決めて3対3の引き分けに。, card: none, image: assets/images/20261026_gerrard_legend/02_w.jpg, callword: 6分で同点}
  - text: 延長の117分には、キーパーのドゥデクが、至近距離のシュートを2度止めます。
    card:
      type: timeline
      title: 2005年 CL決勝 ミラン対リヴァプール
      rows: *id011
      focus: 4
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/01_w.jpg
  - text: PK戦を3対2で制して、リヴァプールはヨーロッパの王者に。
    card:
      type: timeline
      title: 2005年 CL決勝 ミラン対リヴァプール
      rows: *id011
      focus: 5
      highlight_row: 0
    image: assets/images/20261026_gerrard_legend/05_w.jpg
  - {text: 試合の最優秀選手は、ジェラード。その夜の言葉です。, card: none, image: assets/images/20261026_gerrard_legend/02_w.jpg}
  - {voice: ジェラード, text: こんな夜のあとで、どうして出ていけるだろう。, card: none, pause: 0.6}
