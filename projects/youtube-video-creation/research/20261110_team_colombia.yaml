  say:
  - text: 見立てです。日本とコロンビアの6試合を、2つに分けて数えます。
    image: assets/images/20261110_team_colombia/b04_fan2014_w.jpg
    card: none
  - text: 2018年をのぞく5試合で、日本が取った点は2点。2試合半に1点のペースです。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: ところが2018年の1試合だけで、日本は2点を取りました。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 点
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 2点とも、開始3分にコロンビアが10人になってからの点です。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 11人そろったコロンビアの守りから、日本はなかなか点を奪えていません。
    image: assets/images/20261110_team_colombia/b05_lorenzo2018_w.jpg
    card: none
  - text: その守りは、2026年のワールドカップでも崩れませんでした。5試合で、失点は1。
    mark:
      kind: circle
      row: 2
      col: 点
    card:
      <<: *id_vp
      highlight_row: 2
  - text: ただ、取った点も5試合で5点。2014年の12点の、半分にも届きません。
    card:
      <<: *id_vp
      highlight_row: 4
  - text: 16強のスイス戦は、120分を0対0の引き分け。PK戦で敗れて大会を去りました。
    image: assets/images/20261110_team_colombia/b03_depart_w.jpg
    card: none
  - text: 守りは崩れない。けれど、点が足りない。
    card: none
  - text: 2014年に、チームの12点のうち6点を取ったハメスは、もう代表にいません。
    image: assets/images/20261110_team_colombia/b06_james_w.jpg
    card: none
  - text: 11月のチリとの2連戦で、点を取るのは誰か。それが次の注目点です。
