# 代表チーム紹介 コロンビア代表（11/6 作成。固定シリーズ9「代表チーム紹介」。見本は 11/8 のクロアチア代表 scripts/20261108_team_croatia.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **選んだ理由**：日本がW杯で勝った、ただ1つの南米の国（Japan at the FIFA World Cup の試合表で、南米との対戦は1998アルゼンチン・2006ブラジル・2010パラグアイ・2014コロンビア・2018コロンビア・2026ブラジルの6試合、勝ちは2018年のコロンビア戦だけ）。同じ記事の本文「Japan became the first ever Asian nation to beat a side from South America」。日本とは国際Aマッチで6度（1勝1分4敗）、うちW杯で2度。代表チーム紹介は未出（scripts/・research/posted.json・research/covered.yaml を grep。コロンビアが主役の本は無い）。
# **外した候補**：イタリア（同じ11/10にブッフォンのレジェンド回 buffon_legend が picks にあり、イタリア代表の話と重なるので替えた。W杯3大会続けて予選敗退という強い軸はある）、韓国・オーストラリア（日本とW杯での対戦が無い）。
# **軸（2026-11-06）**：「日本は6度戦って1勝。その1勝は開始3分にコロンビアが10人になった試合で、ほかの5試合は2得点。コロンビアは2026年W杯でも5試合で失点1」。答えは見立ての節（自分で数えて割る）。
# ---- 確かめたこと（2026-11-06。requests で Wikipedia の生の wikitext を読んだ。WebFetch の要約は使っていない）----
#  ・FIFAランク：11位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026）。日本は17位。点数は書かない。
#  ・日本とコロンビアの全対戦（Japan national football team records and statistics「COL 2003 2023 6 1 1 4 4 9」）：2003-06-22 コンフェデ杯 0-1（サンテティエンヌ。Japan national football team results (2000–2009)）／2007-06-05 キリンカップ 0-0（埼玉）／2014-06-24 W杯1次リーグ 1-4（クイアバ）／2018-06-19 W杯1次リーグ 2-1（サランスク）／2019-03-22 親善 0-1（横浜。Japan national football team results (2010–2019)）／2023-03-28 キリンチャレンジ杯 1-2（大阪。三笘3分、ドゥラン33分、ボレ61分。Japan national football team results (2020–present)）。日本の得点は0+0+1+2+0+1=4、失点は1+0+4+1+1+2=9（表と一致）。
#  ・2014（2014 FIFA World Cup Group C の本文と試合の枠）：クアドラードのPK17分、岡崎45+1分（本田のクロスに頭）、ジャクソン・マルティネス55分・82分、ハメス90分。ハメスは後半から出て2アシスト1得点。日本は勝たなければ敗退の試合で、敗退。
#  ・2018（2018 FIFA World Cup Group H の本文）：3分、香川のシュートをカルロス・サンチェスが腕で止めてPK・一発退場。香川がPK（6分）。キンテロのFK（39分、跳んだ壁の下）。大迫が本田の左CKを頭で（73分）。「Japan became the first Asian team to beat a side from South America in the competition's history」。
#  ・→ 自分で数えた：日本の4得点のうち2点は2018年の1試合（相手が10人になったあと）。ほかの5試合では2得点（2014岡崎・2023三笘）で、0勝1分4敗。※ほかの5試合に退場があったかは確かめていないので「11人どうし」とは言わず「2018年をのぞく5試合」と言う。
#  ・監督：ネストル・ロレンソ（Néstor Lorenzo の記事）。アルゼンチン出身、1966-02-26生まれ。1990年W杯の決勝に選手として出場。2012〜2019年はペケルマン監督のもとでコロンビアのコーチ（infobox）→2014年・2018年のW杯はコーチ。2022年6月2日に監督就任（Colombia national football team の本文）、2026年7月23日に契約延長。
#  ・ロレンソのもとで28試合負けなし（ドイツ・スペインに初勝利）、2024年コパ・アメリカ準優勝（決勝でアルゼンチンに延長0-1、ラウタロ112分）。
#  ・W杯：Colombia at the FIFA World Cup の Overall record。出場7大会（1962・1990・1994・1998・2014・2018・2026）、最高は2014年の8強。2014は5試合12得点4失点、ハメスが6得点で得点王（Golden Boot）。2026は5試合3勝2分0敗5得点1失点（16強）。1990は16強（1962以来28年ぶり）。
#  ・2026年W杯（Colombia national football team の本文と試合の枠）：K組 ウズベキスタン3-1（ムニョス40・ディアス65・カンパス90+9）、DRコンゴ1-0（ムニョス76）、ポルトガル0-0で1位。32強 ガーナ1-0（アリアス14分、カンザスシティ）。16強 スイス0-0（延長、PK3-4。バンクーバー。D.サンチェスがバー、クーチョ・エルナンデスがコベルに止められた）。「Despite only conceding once across the entire World Cup」。
#  ・コパ・アメリカ：2001年に自国で優勝、6戦全勝・失点0（本文）。
#  ・ハメス・ロドリゲス：代表131試合31得点、国の歴代最多出場（スイス戦で更新）。2026年9月15日に代表引退。
#  ・主将：ダビンソン・サンチェス（infobox Captain、ガラタサライ、DF、1996-06-12、代表87試合＝Current squad、6 October 2026 時点）。
#  ・看板選手（年齢は2026-11-06時点、生年月日から計算。所属は各選手の記事の current_club）：ルイス・ディアス（バイエルン、FW、1997-01-13）29・79試合23得点（国の歴代4位。Top goalscorers の表）／ダビンソン・サンチェス 30／ダニエル・ムニョス（ノッティンガム・フォレスト、DF、1996-05-26）30・W杯2得点／ジョン・ルクミ（ユヴェントス、DF、1998-06-26）28／ジョン・アリアス（パルメイラス、MF、1997-09-21）29／ルイス・スアレス（スポルティング、FW、1997-12-02）28・2025年9月の予選ベネズエラ戦で4得点（6-3）。ディアスは9・10月の招集には入っていない（理由は確かめていないので言わない。「いまの招集」とは言わない）。
#  ・W杯のあと（Colombia national football team の 2026 の試合の枠）：9/26 メキシコ1-1（ボルティモア）、10/2 パラグアイ0-1（ハリソン）、10/6 ペルー2-0（マイアミ・ガーデンズ）。→1勝1分1敗。次は 11/13 チリ（カリ）、11/17 チリ（サンティアゴ）。
#  ・人口：52,695,952（2024年の推計。Colombia の infobox、DANE の推計）。
#  ・愛称：Los Cafeteros（The Coffee Growers）。
# ---- 言わないもの ----
#  ・1994年のエスコバルの件／麻薬の時代／怪我／私生活／戦術の説明／2024年決勝の観客の騒ぎ／ディアスの招集外の理由。
# ---- 写真（assets/images/20261110_team_colombia/、出典は credits.json）----
#  ・2026年6月4日の壮行式と出発（コロンビア大統領府の公式写真、パブリックドメイン）。2014年W杯 日本対コロンビアの日本のサポーター（paulisson miura、CC BY 2.0）。2018年W杯16強のロレンソ（当時コーチ）とD.サンチェス（Voltmetro、CC BY-SA 4.0）。2022年のハメス（jmmuguerza、CC BY-SA 3.0）。代理店・放送映像は使っていない。
#  ・基礎DATAの板の中身は research/raw/20261110_team_colombia_board.json（tools/clubdata.py で assets/stats/tb_colombia_data*.png を描いた）。
