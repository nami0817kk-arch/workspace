# 取材メモ（10/1 題材④ giroud_ueda、型は quote）。材料の控えは research/raw/20261001_giroud_ueda.md。
# 事実の裏:
#   引退の示唆: L'Équipe の大型インタビュー（web 9/29 18:32、紙面は誕生日の 9/30 付け）。原文は Foot Mercato・franceinfo で同じ
#     "comme joueur, je pense que c'est très probablement ma dernière saison. C'est pour ça que je profite de chaque instant"。
#   年齢: 1986年9月30日生まれで 9/30 に40歳（Qoly・サッカー批評の「39歳」は取材時点）。上田は1998年8月28日生まれの28歳。
#   上田・梅崎の件は L'Équipe の有料部分。**原文は読めていない。**Le Petit Lillois がフランス語を部分引用
#     （« Quand Ayase Ueda arrive, je lui demande s'il a trouvé une maison, on a parlé des Japonais avec qui je jouais à Grenoble »
#      « Je ne vais rien lâcher et lui donner du fil à retordre le week-end » « pour accompagner les autres »
#      « Il ne doit pas croire que je vais me satisfaire de ça »＝直近3試合のベンチスタートについて、笑いながら）。
#     梅崎の件は AllFootball の英訳と Qoly の日本語を突き合わせた（Qoly の「偶然」は英訳に無いので入れない）。
#   初ゴールの試合: 2007年2月26日 リーグ・ドゥ第26節 グルノーブル 2-1 ル・アーヴル（footballdatabase・grenoblefoot.info）。
#     62分ジルー途中出場／82分梅崎途中出場／85分同点／90+2分ジルー決勝点。AllFootball の英訳は「2月22日」で食い違う。
#     アシストは試合記録に欄が無く、ジルー本人の言葉が根拠。梅崎は大分から半年の期限付き（浦和ではない）。
#   リールの今季（FotMob、全公式戦、9/20 まで）: ジルー6試合268分1得点2アシスト／上田4試合271分3得点。
#     上田の加入後4試合は上田271分・ジルー115分。トゥールーズ・ベティス・トロワは2人の直接の交代。並んだのはニース戦の64分から。
#   代表: 上田は 9/24 ウルグアイ戦（60分過ぎから）1点、9/28 ベネズエラ戦（後半から）2点（JFA の試合報告）。
#     10/1 19:10 のエクアドル戦は台本を作った時点で試合前なので触れない。
#   ジルーの代表 137試合57得点（franceinfo）。リール1季目は11得点。
# 反応: Yahoo!ニュースのコメント欄から個人の投稿を頭から終わりまで3件。フランス語のファンの声は Bluesky で探して取れなかった。
# 写真: Le Petit Lillois の2枚（撮影 Quentin Delcourt、代理店ではない）。冒頭はジルーの 16:9（_w）、語る行からジルー（左）＋上田（右）の1枚。
