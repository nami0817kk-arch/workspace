- id: retire
  heading: たぶん最後のシーズン
  tier: 報道
  telop: ジルー「選手としては、たぶん今季が最後」
  narrator: キャスター
  say:
  - text: フランス1部リールのオリヴィエ・ジルーが、9月30日に40歳になりました。
    image: assets/images/20261001_giroud_ueda/01_w.jpg
  - フランス代表で137試合57得点、2018年のワールドカップを制したストライカーです。
  - 誕生日を前に受けたインタビューで、引退をほのめかしました。
  - voice: ジルー
    text: 来年もインタビューなら、喜んで受けるよ。
  - voice: ジルー
    text: でも選手としては、たぶん今季が最後のシーズンになると思う。
    cont: true
  - voice: ジルー
    text: だから、一瞬一瞬を楽しんでいるんだ
    cont: true
  quotes_from:
  - Foot Mercato https://www.footmercato.net/a3294031172986582651-losc-giroud-annonce-sa-probable-retraite
  sources:
