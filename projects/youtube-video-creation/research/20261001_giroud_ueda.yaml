- id: ueda
  main: true
  heading: ライバルに聞いた家のこと
  tier: 報道
  telop: ジルー「彼は、僕のプロ初ゴールをアシストしてくれた選手なんだ」
  narrator: キャスター
  say:
  - text: 40歳の誕生日を前に受けたインタビューで、リールのジルーが引退をほのめかしました。
    short_only: true
  - text: そのインタビューでジルーは、今季加わって出番を争う上田綺世のことも話しています。
    image: assets/images/20261001_pair_giroud_ueda/01.jpg
  - voice: ジルー
    text: 綺世が来たとき、家は見つかったかと聞いたんだ。
  - voice: ジルー
    text: グルノーブルで一緒にプレーした日本人の話もした
    cont: true
  - text: グルノーブルは、ジルーがプロになったクラブ。そこにいた日本人の1人が、梅崎司です。
  - voice: ジルー
    text: アーセナルの日本ツアーで、梅崎にも会ったよ。
  - voice: ジルー
    text: 彼は、僕のプロ初ゴールをアシストしてくれた選手なんだ
    cont: true
  - text: その初ゴールは2007年2月、フランス2部のル・アーヴル戦です。
    card:
      type: table
      title: グルノーブル 2-1 ル・アーヴル（2007年2月26日）
      columns: [分, 出来事]
      rows: &debut
      - ['62分', 'ジルーが途中出場']
      - ['82分', '梅崎司が途中出場']
      - ['85分', 'グルノーブルが同点']
      - ['90+2分', 'ジルーの決勝点']
  - text: 1点を追う62分に、20歳のジルーが途中から入ります。
    card:
      type: table
      title: グルノーブル 2-1 ル・アーヴル（2007年2月26日）
      columns: [分, 出来事]
      rows: *debut
      highlight_row: 0
  - text: 82分には、大分から期限付き移籍で来ていた梅崎も入りました。
    card:
      type: table
      title: グルノーブル 2-1 ル・アーヴル（2007年2月26日）
      columns: [分, 出来事]
      rows: *debut
      highlight_row: 1
  - text: 85分に追いつき、試合終了の間際。ジルーの決勝点が、プロで最初のゴールでした。
    card:
      type: table
      title: グルノーブル 2-1 ル・アーヴル（2007年2月26日）
      columns: [分, 出来事]
      rows: *debut
      highlight_row: 3
  - text: ただ、上田の世話を焼くだけではありません。
  - voice: ジルー
    text: ライバルだとしても、新しい環境に馴染むのは大事なことだ。
  - voice: ジルー
    text: 40歳だって、ほかの選手の付き添いでここにいるわけじゃない。
    cont: true
  - voice: ジルー
    text: 何ひとつ譲らないし、週末は彼をとことん手こずらせるつもりだ
    cont: true
  - text: ジルー自身は、ここ3試合ベンチからのスタート。そのことにも笑いながらこう話しました。
  - voice: ジルー
    text: それで僕が満足すると、監督に思われちゃ困るね
