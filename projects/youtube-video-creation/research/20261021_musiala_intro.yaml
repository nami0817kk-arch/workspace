- id: story
  heading: 数字の外にある話。あだ名と、チェルシー時代の友人
  tier: 背景
  telop: 「バンビ」と、オリーセ
  narrator: 解説
  say:
  - text: 数字の外側に、ムシアラらしい話が、2つあります。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: none
  - text: ひとつは、あだ名。2021年の欧州選手権で、サネが付けました。
    card: none
  - text: あだ名は、バンビ。若さと、穏やかな人柄から。本人は、もう卒業したと話します。
    emph: true
    image: assets/images/20261021_musiala_intro/q4/01_w.jpg
    card: none
  - text: もうひとつは、チェルシーの下部組織。そこで出会ったのが、オリーセです。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: none
  - text: いまは、同じバイエルンの仲間。ケガから戻って最初のアシストも、オリーセでした。
    card: none
  - text: 長いケガのあと、本人は、こう語っています。
    card: none
  - voice: ムシアラ
    text: ケガをすると、学ぶことが多いと思います。
  - voice: ムシアラ
    text: ふだん、どれだけ楽しんでいるか。
    cont: true
  - voice: ムシアラ
    text: どれだけサッカーを愛しているか。見えてきました。
    cont: true
    pause: 0.6
  quotes_from:
  - https://www.getfootballnewsgermany.com/2025/bayern-musiala-injury/
  sources:
  - https://en.wikipedia.org/wiki/Jamal_Musiala
  - https://www.getfootballnewsgermany.com/2025/bayern-musiala-injury/
