    source: Transfermarkt
  say:
  - text: 最後に、ムシアラの3つの季を並べます。24/25、25/26、そして今季。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: &cmp_card
      type: table
      title: ムシアラの比べ（バイエルンの全公式戦）
      columns: [項目, 24/25, 25/26, 今季]
      rows: *cmp_rows
      source: Transfermarkt
      highlight_row: 0
  - text: 出場時間は、61%の減少。ムシアラが立てた時間が、大きく減りました。
    emph: true
    image: assets/images/20261021_musiala_intro/q4/01_w.jpg
    card:
      <<: *cmp_card
      highlight_row: 0
    mark: {kind: circle, row: 0}
  - text: ゴールだけなら0.63から0.38。ただ、アシストは0.24から0.46です。
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: ゴールとアシストの合計は、0.87と0.84。ほとんど同じです。
    emph: true
    card:
      <<: *cmp_card
      highlight_row: 3
  - text: 一方、市場価値も、出場時間と同じ向きに、下っています。
    card:
      <<: *cmp_card
      highlight_row: 4
  - text: 今季は、まだ4試合と小さな数です。途中経過として、見てください。
    card: none
  - text: クラブの次の試合は、現地10月21日のアーセナル戦。ピッチに戻れるのか。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: none
