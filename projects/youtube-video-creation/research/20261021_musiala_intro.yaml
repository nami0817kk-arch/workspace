    title: ジャマル・ムシアラ 23歳
    items:
    - ['8000', 万ユーロ, 市場価値。10月2日付け。最高は1.4億]
    - ['0.87→0.84', 点, 90分あたりのゴール＋アシスト。24/25→25/26]
    - ['2988→1174', 分, クラブでの出場時間。24/25→25/26]
    focus: 0
  say:
  - text: バイエルンの10番、ムシアラ。市場価値は、ピークから4割、下がりました。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: &hook_stats
      type: stats
      title: ジャマル・ムシアラ 23歳
      items:
      - ['8000', 万ユーロ, 市場価値。10月2日付け。最高は1.4億]
      - ['0.87→0.84', 点, 90分あたりのゴール＋アシスト。24/25→25/26]
      - ['2988→1174', 分, クラブでの出場時間。24/25→25/26]
      focus: 0
  - text: ところが、90分あたりのゴールとアシストは、0.87から0.84。ほぼ横ばいです。
    emph: true
    image: assets/images/20261021_musiala_intro/q4/01_w.jpg
    card:
      <<: *hook_stats
      focus: 1
  - text: 減ったのは、ピッチに立った時間のほうです。
    card:
      <<: *hook_stats
      focus: 2
  - text: そして今季は、開幕から3試合を欠場。9月24日には、右の太ももを痛めました。
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card: none
  - text: それでも、9月10日、今季初ゴールを決めた夜。本人の言葉です。
    card: none
  - voice: ムシアラ
    text: 今日の感覚は、しばらく味わえていなかったものでした。
  - voice: ムシアラ
    text: 体は、いい状態です。
    cont: true
    pause: 0.5
