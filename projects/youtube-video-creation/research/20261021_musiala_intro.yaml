  say:
  - text: バイエルンのムシアラは、右太ももを痛め、17日まで欠場。今季は2得点1アシスト。
    image: assets/images/20261021_musiala_intro/q4/01_v.jpg
    short_only: true
    card: none
  - text: 今季のクラブの試合は、4試合で213分。2得点1アシストです。
    image: assets/images/20261021_musiala_intro/q4/01_w.jpg
    card: none
  - text: 開幕の3試合は欠場。初出場は、9月5日のシャルケ戦。途中から33分です。
    card: &recent_card
      type: table
      title: 今季のムシアラ（クラブの試合）
      columns: [日付, 相手, 出場, 結果]
      rows: *recent_rows
      source: Transfermarkt・ESPN
      highlight_row: 0
  - text: 9月10日、チャンピオンズリーグ初戦。後半2分に、今季初ゴール。5対0の快勝。
    emph: true
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card:
      <<: *recent_card
      highlight_row: 1
  - text: ケインも、このゴールを喜びました。
    card: none
  - voice: ハリー・ケイン
    text: 本当に、うれしい。彼にかかっていた重みが、取れたんです。
  - voice: ハリー・ケイン
    text: いまの彼は、すごくいい状態に見えます。
    cont: true
    pause: 0.5
  - text: 9月18日、ウニオン戦。今季初の90分で、1ゴール1アシスト。7対0の勝ち。
    image: assets/images/20261021_musiala_intro/q4/01_w.jpg
    card:
      <<: *recent_card
      highlight_row: 3
  - text: その6日後、9月24日。オランダ戦のウォームアップで、筋肉を痛めます。
    card: none
  - text: クロップ代表監督は、ムシアラとハフェルツが検査中だと話しました。
    card: none
  - voice: クロップ監督
    text: 2人とも、いま、検査を受けています。
  - voice: クロップ監督
    text: おそらく、今回の代表は、無理でしょう。
    cont: true
  - voice: クロップ監督
    text: できるだけ早く、戻ってほしいです。
    cont: true
    pause: 0.5
  - text: ドイツの報道では、右太ももの筋繊維の断裂です。代表の4試合を欠場しました。
    emph: true
    image: assets/images/20261021_musiala_intro/q1/01_w.jpg
    card:
      <<: *recent_card
      highlight_row: 4
  - text: クラブでも、10月10日から17日まで、3試合を欠場しています。
    card: none
  - text: 10月9日、コンパニ監督は、こう語りました。
    card: none
  - voice: コンパニ監督
    text: 挫折から戻ってくることは、それ自体が強さです。
    pause: 0.6
