# ジャマル・ムシアラ（バイエルン／ドイツ代表）の紹介。選手紹介の8節の型（2026-10-21、シリーズ「有名選手の紹介」）。key=musiala_intro
# **FotMob は使わない**（雛形 research/20261021_player_580195.yaml の武器・弱点・パーセンタイル・レーダー・シュートマップ・評点は全部捨てた）。
# 数字は Transfermarkt API（tmapi-alpha、各1回・8秒空け。控え research/raw/20261021_musiala_tm.json）と、自分で割った90分あたり。
#
# **重なり確認（2026-10-21）**
# - research/posted.json・covered.yaml：ムシアラの「どんな選手」紹介は無し。9/11「3試合ぶりに戻ったムシアラが決めた」（試合の回、40日前）、10/9「ベリンガムとムシアラを同じ日数で並べる」（比べる）のみ。
# - 10/9 が使った軸＝年代別で15試合を共にした／23歳101日でそろえた通算（273試合78得点）／出られた割合と怪我（腓骨骨折＝33試合195日の欠場・8件と24件）／2022年11月に2人とも1億ユーロ／
#   「ドイツのための心と、イングランドのための心」の言葉。→ **この回は使わない**。この回の軸は「市場価値が下がった16か月に、ペース（90分あたりのG+A）は落ちたのか」と、シーズンごとの出場時間。
#   骨折は経歴の1行だけ（日数・件数は言わない）。国籍選択の話・ベリンガムとの比べは入れない。
# - 10/21 バイエルンのクラブ紹介（20261021_bd_bayern.md）はムシアラをドイツ代表46試合で1回触れるだけ。同日ベリンガム（20261021_player_581678.md）の「点のペースの1年目との比べ」の形（stats の3項目・出られた割合の棒）は
#   言い回しの見本として読み、**同じ文は使っていない**。ただし「ペースは同じ？」という問い方がベリンガム回（得点ペース×半分）と近いので、この回は「ゴール＋アシスト」で組み、出場時間の減り方（61%減）を主役にした。
#
# **数字の出どころ**
# - Transfermarkt API：生年月日・身長・契約・市場価値の推移（最新 2026-10-02 の8000万ユーロ、最高 2024-12-20 の1.4億ユーロ）、季ごと・大会ごとの試合・得点・アシスト・出場分、試合ごとの出場状態（欠場＝injured）。
#   移籍・怪我の履歴のAPIは404で取れない。
# - 自分で数えたもの：クラブのトップチームの全公式戦（代表・Bayern II（3.Liga）は除く）。季ごと 20/21 37試合7得点1アシスト1304分／21/22 40・8・6・1983／22/23 47・16・16・3026／23/24 38・12・8・2860／24/25 44・21・8・2988／
#   25/26 24・5・6・1174／26/27 4・2・1・213。90分あたり（G+A）＝(得点+アシスト)×90÷出場分：0.55・0.64・0.95・0.63・0.87・0.84・1.27（今季は213分で小さい）。ゴールだけ：0.48・0.36・0.48・0.38・0.63・0.38・0.85。
#   アシスト／90分：24/25 8×90÷2988＝0.24、25/26 6×90÷1174＝0.46、今季 1×90÷213＝0.42。出場時間の減り：2988→1174＝−61%。
#   通算：バイエルン トップ 235試合71得点（上の234試合＋デビューした19/20の1試合）、ドイツ代表 46試合10得点（TM の代表戦。2021年3月〜2026年6月）、合計 281試合81得点。
#   10/9 の台本の「23歳101日で273試合78得点」に、その後の W杯4試合1得点・今季4試合2得点を足すと 281試合81得点で一致（Bayern II の8試合2得点は両方とも入れていない）。
#   市場価値の減り：1.4億（2024-12-20）→8000万（2026-10-02）＝−43%。市場価値は Transfermarkt の推定で、2026-05-27 に1億、10-02 に8000万の更新（どちらも欠場期間のあと）。
# - 今季の試合：Transfermarkt（9/5 シャルケ 0-0 33分／9/10 CL ボデ/グリムト 5-0 65分1G／9/13 エルフェルスベルク 2-1 25分／9/18 ウニオン・ベルリン 7-0 90分1G1A）。9/10 のゴールは ESPN で47分。
# - 怪我：ESPN（2026-09-24）＝ウォームアップ中の筋肉のケガ・MRI（クロップ代表監督の言葉）／90min.de（2026-10-09）＝右太ももの筋繊維の断裂（Muskelfaserriss）・代表4試合を欠場・復帰の期間は書かれていない。
#   TM の試合記録で、9/24〜10/4 の代表4試合と 10/10・10/13・10/17 のクラブ3試合が欠場。**病名は上の記事の言葉のまま**。小さく見せる言い方はしない。
# - 経歴・記録：英語版 Wikipedia（2026-10 取得。research/raw/20261021_musiala_wiki.txt）。→ 背景。クラブ公式（fcbayern.com）の2025-10 のインタビューは、Get German Football News が全文を訳して引いた英文を使った（公式ページは読めなかった）→ 報道。
#
# **入れなかったもの**：開幕前の体調の話（本人が公表した診断名は入れない。開幕3試合の欠場は日付だけ）、国籍選択・イングランドとの関係（10/9 の回）、ベリンガムとの比べ、年俸・代理人・私生活・家族の詳細、移籍金・契約の金額、
#   FotMob の指標すべて、他クラブの噂。
# **日本語名・読み**：ムシアラ／ジャマル・ムシアラ、シュトゥットガルト、エルフェルスベルク、ボデ/グリムト、ウニオン・ベルリン、バイエルン、ライプツィヒ、アウクスブルク、クロップ、コンパニ、ハンジ・フリック、オリーセ、ケイン、シャルケ、チェルシー。
#
# 本人・関係者の言葉は4か所（自訳。原文は上の出典）：①ムシアラ（9/10 ESPN）②ムシアラ（2025-10 fcbayern.com のインタビュー）③フリック（Wikipedia 引用）④コンパニ（90min.de 10/9）と⑤クロップ（ESPN 9/24）。
