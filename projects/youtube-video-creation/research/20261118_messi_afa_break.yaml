    tier: 報道
    telop: メッシ、AFAに名前と写真の商用利用の停止を求める書面を準備
    say:
      - text: メッシが、アルゼンチン協会に、名前と写真を商売に使うのをやめるよう求める。そう現地で報じられました。
      - text: 報じたのは、アルゼンチンの有力紙です。メッシの周辺の関係者への取材だといいます。
      - text: メッシ側は専門家に、書面を作らせたとされています。
        image: assets/images/20261118_messi_c/02_w.jpg
      - text: 求める内容は、名前、写真、販促物、映像を、お金を生む活動に使うのをすぐやめることです。
      - text: ただ、その書面がもう協会に届いたのかは、情報源によって食い違っています。
        image: assets/images/20261118_messi_afa_break/03_w.jpg
        emph: true
      - text: 書き上がって、送る準備ができた段階だと話す人もいます。
    official: false
    sources:
