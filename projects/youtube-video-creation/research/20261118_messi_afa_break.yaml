    heading: 報じられた、すれ違いの背景
    tier: 報道
    telop: W杯の広告と、10月の引退試合
    say:
      - text: 背景として、二つの出来事が伝えられています。
        image: assets/images/20261118_messi_afa_break/01_w.jpg
      - text: 一つめは、W杯のときの広告です。協会のスポンサーの会社が、メッシを使った大きな広告を出しました。
        image: assets/images/20261118_messi_afa_break/03_w.jpg
      - text: メッシには、別の企業との専属の契約がありました。メッシ側は、取引先に説明を迫られたといいます。
      - text: 二つめは、10月の代表引退試合、ベナン戦です。音や照明などの運営に、強い批判が出ました。
        image: assets/images/20261118_messi_afa_break/01_w.jpg
      - text: 運営の責任をめぐって、会場のクラブ、リーベル・プレートと協会の言い分が食い違ったとも伝えられています。
      - text: 協会の運営をめぐる疑惑の報道が続いています。
        image: assets/images/20261118_messi_c/02_w.jpg
      - text: そうした中で、メッシ側が自分の名前を守ろうとしている。それが報じた側の見方です。
