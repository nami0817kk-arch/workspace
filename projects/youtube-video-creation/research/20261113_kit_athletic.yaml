sections:
- id: stripes
  main: true
  heading: アスレティックの赤と白は、どこで買ってきたシャツなのか
  bg: assets/images/20261113_kit_athletic/p_team1923_w.jpg
  tier: 背景
  narrator: 解説
  telop: 1898年の創立から赤白は12年あと。1909年の冬、青白のシャツを探した学生が、帰りの港で赤白50枚を買った
  card: *stripes
  say:
  - text: 今回はアスレティック・ビルバオ。赤白のしまと、紋章と、シャツをめぐる事件の話です。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: クラブが生まれたのは、1898年。最初のシャツは、白一色でした。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *stripes
      highlight_row: 0
  - text: 1903年ごろ、青と白が半分ずつのシャツに替わります。
    image: assets/images/20261113_kit_athletic/p_team1923_w.jpg
    card: none
  - text: イングランドのブラックバーンと同じ形です。
    image: assets/images/20261113_kit_athletic/p_team1923_w.jpg
    card: none
  - text: 会員のモーゼルが、イギリスから持ち込んだものとされます。
    image: assets/images/20261113_kit_athletic/p_team1923_w.jpg
    card: none
  - text: 事件は、1909年のクリスマスに起きます。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *stripes
      highlight_row: 2
    emph: true
    callword: 1909年の事件
  - text: 青白のシャツが、汗と洗濯でくたびれていました。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: クラブは、イングランドで新しいシャツを買ってくる人を探します。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 選ばれたのは、ビルバオ出身の学生、エロルドゥイでした。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: マドリードで、鉱山の工学を学んでいました。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 頼まれたのは、青と白のシャツ50枚。マドリードの分家のぶんも含みます。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: ところがエロルドゥイは、買い物を最後の日まで残してしまいます。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 青と白のシャツは、見つかりませんでした。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 帰る船を待っていたのは、港町のサウサンプトン。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: そこで目にしたのが、地元クラブの、赤と白のしまのシャツでした。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
    emph: true
  - text: 赤と白は、ビルバオの港の旗と、同じ色です。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 手ぶらで帰るよりと、エロルドゥイは、50枚を買いました。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 届けられたシャツを、クラブは、ほとんどすぐに、新しい色に決めます。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 初めて着たのは、1910年1月9日の親善試合。0対2で負けています。
    image: assets/images/20261113_kit_athletic/p_team1923_w.jpg
    card:
      <<: *stripes
      highlight_row: 3
  - text: 正式な色になったのは、同じ年の11月13日。
    image: assets/images/20261113_kit_athletic/p_team1923_w.jpg
    card: none
  - text: 50枚の半分は、マドリードの分家へ渡りました。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: スペインで、赤と白のクラブは、1905年からのスポルティング・ヒホンだけでした。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: もう一つの説もあります。2023年の調べは、サンダーランドを挙げています。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 1913年からは、パンツが黒に決まりました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 本家のサウサンプトンが黒にしたのは、1950年です。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
    emph: true
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Athletic_Club
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
- id: crest
  heading: 橋と狼と木は、なぜ紋章に入っているのか
  bg: assets/images/20261113_kit_athletic/p_tifo_w.jpg
  tier: 背景
  narrator: 解説
  telop: 最初は青い輪にAとC。1922年に今の形のはじまり。1941年に名前が替わり、1972年に色と英語の名前が戻った
  card: *crest
  say:
  - text: 胸の紋章も、最初はずいぶん簡単なものでした。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *crest
      highlight_row: 0
  - text: AとCの2文字を重ねた、青い輪です。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 赤白のシャツに替えた1910年には、赤白の旗の形に。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *crest
      highlight_row: 1
  - text: 1913年には、ボールに旗を巻いた形になります。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *crest
      highlight_row: 2
  - text: いまの形の最初は、1922年です。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *crest
      highlight_row: 3
    emph: true
  - text: 中に入っているのは、町と県の、紋章でした。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 橋と教会は、ビルバオの町から。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *parts
      highlight_row: 0
  - text: 狼は、1300年にビルバオを築いた、ハロ家のしるしです。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *parts
      highlight_row: 1
  - text: 木と斜めの十字は、ビスカヤ県から。木は、ゲルニカの木と呼ばれます。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *parts
      highlight_row: 2
  - text: 1941年に、今の形が決まります。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *crest
      highlight_row: 4
  - text: ただ、そこに入った名前は、アトレティコ・ビルバオでした。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
    emph: true
  - text: 外国語のクラブ名が禁じられたため、とされます。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 色が付き、アスレティック・クラブの名前が戻ったのは、1972年です。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *crest
      highlight_row: 5
  - text: 2008年には、形が少しだけ整えられました。いまの形は、85年続いています。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
  - https://es.wikipedia.org/wiki/Athletic_Club
- id: ketchup
  heading: 縦のしまを捨てた「ケチャップのシャツ」は、なぜ消えたのか
  bg: assets/images/20261113_kit_athletic/p_fan_w.jpg
  tier: 背景
  narrator: 解説
  telop: 2004年、縦のしまを抽象的な形に替えた1枚。8月5日に初着用、会長は二度と使わないと決めた。2011年はバスクの旗の色
  card: *ketchup
  say:
  - text: 赤白を守ってきたアスレティックにも、大きな冒険がありました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: 2001年、クラブは、シャツを作る自前のブランドを持ちました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *ketchup
      highlight_row: 0
  - text: 2004年、ヨーロッパの大会に戻るのに合わせて、特別なシャツを頼みます。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 頼んだ相手は、バスクの芸術家、ダリオ・ウルサイです。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 出来上がったのは、縦のしまを、抽象的な形に替えた1枚でした。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *ketchup
      highlight_row: 1
    emph: true
    callword: 縦のしまが消えた
  - text: 8月5日の親善試合で、初めて着ました。試合は2対3で負けています。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: ファンの反発は強く、会長は、二度と使わないと決めます。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *ketchup
      highlight_row: 2
  - text: ついた愛称は、ケチャップのシャツ。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: それでも、この1枚は、アルティウム美術館の収蔵品に入りました。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card: none
  - text: 場所はビトリア。展示されたのは、2009年です。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *ketchup
      highlight_row: 3
  - text: もう一つの冒険は、2011年。バスクの旗にちなんだ、緑と白と赤のシャツです。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *ketchup
      highlight_row: 4
  - text: このシャツを着たのが、2012年のヨーロッパリーグ決勝。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *ketchup
      highlight_row: 5
    emph: true
  - text: 相手は、同じ赤白をまとう、アトレティコ・マドリードでした。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Athletic_Club
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
- id: chest
  heading: 胸の広告は、なぜ創立から110年なかったのか
  bg: assets/images/20261113_kit_athletic/p_bus_w.jpg
  tier: 背景
  narrator: 解説
  telop: 胸は創立から110年、広告なし。2008年に石油会社が初めて。2015年から銀行。作る会社は2023年からキャストア
  card: *chest
  say:
  - text: アスレティックの胸は、長いあいだ、まっさらでした。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card:
      <<: *chest
      highlight_row: 0
  - text: 広告を入れない、数少ない大きなクラブの一つだったのです。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card: none
  - text: 2004年から05年のヨーロッパの大会だけは、広告ではありません。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card: none
  - text: バスクの名前、エウスカディが、胸に入りました。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card: none
  - text: 初めての広告は、2008年。地元ビスカヤの石油会社、ペトロノールです。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *chest
      highlight_row: 1
    emph: true
    callword: 110年で初の広告
  - text: 創立から、110年がたっていました。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 額は、200万ユーロあまりとされます。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 2015年からは、銀行のクッチャバンクが、胸の専属になりました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *chest
      highlight_row: 2
  - text: 同じ年から、襟の内側に、バスクの旗の小さな印が付いています。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: シャツを作る会社も、移り変わってきました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card:
      <<: *maker
      highlight_row: 0
  - text: 1980年はアディダス。1990年代はカッパ。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card:
      <<: *maker
      highlight_row: 1
  - text: 2001年からは、クラブ自前のブランドで作りました。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card:
      <<: *maker
      highlight_row: 2
    emph: true
  - text: そのあと、ナイキ、ニューバランスと続き、2023年からはイギリスのキャストアです。
    image: assets/images/20261113_kit_athletic/p_bus_w.jpg
    card:
      <<: *maker
      highlight_row: 4
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Athletic_Club
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
- id: view
  viewpoint: true
  heading: 見立て・赤白の116年と、広告の18年
  bg: assets/images/20261113_kit_athletic/p_tifo_w.jpg
  tier: 背景
  narrator: 解説
  telop: 赤白は116年、黒いパンツは113年。胸の広告は110年なく、入ってから18年。長さは約6倍
  card: *view
  say:
  - text: アスレティックの赤白と胸を、数で並べます。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card: none
  - text: 赤と白のしまは、1910年から116年。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *view
      highlight_row: 0
  - text: 黒いパンツは、1913年から113年です。
    image: assets/images/20261113_kit_athletic/p_tifo_w.jpg
    card:
      <<: *view
      highlight_row: 1
  - text: 胸に広告が無かったのは、110年。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *view
      highlight_row: 2
  - text: 広告が入ってからは、18年です。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      <<: *view
      highlight_row: 3
    mark:
      kind: circle
      row: 3
  - text: 広告のない年月は、あった年月の、約6倍です。
    image: assets/images/20261113_kit_athletic/p_flag_w.jpg
    card:
      type: calc
      title: 胸に広告のなかった年月（自分で割った）
      terms:
      - - 110年
        - 広告なし
      - - 18年
        - 広告あり
      - - 約6倍
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 赤白は、買い物の失敗で手に入れた色でした。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
  - text: それでも、色と黒いパンツは100年以上、まっさらな胸は110年、守ってきました。
    image: assets/images/20261113_kit_athletic/p_fan_w.jpg
    card: none
    emph: true
  sources:
  - https://es.wikipedia.org/wiki/Historia_del_uniforme_del_Athletic_Club
  - https://en.wikipedia.org/wiki/Athletic_Bilbao
