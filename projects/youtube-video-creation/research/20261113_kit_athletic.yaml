# ユニフォームとエンブレムの歴史 アスレティック・ビルバオ（11/11 作成、11/13 分）。ラ・リーガの4本目。雛形は 11/11 アトレティコ回。
# 題の問い：赤白のしまのシャツは、どこで買ったのか。答え＝1909年の冬、ロンドン帰りの学生が、港町サウサンプトンで地元クラブの赤白を50枚買った、という話。
# 選んだ理由：指示書 20261109/20261112「ユニフォームはラ・リーガの続き」。済み：バルセロナ・レアル・アトレティコ。次の候補：ビルバオ・バレンシア・ビジャレアル・セビージャ・ベティス。
#   スタジアム担当（同じ11/13）と同じクラブにしない → research/20261112_picks.txt に先に1行書いた（スタジアム担当は セビージャ・ベティス・ソシエダ・ビジャレアル から選ぶ想定）。
#   外した候補：バレンシア（11/11 にスタジアムで出したばかり）、ビジャレアル（9/26 のクラブ紹介と近い）。
# 重なり確認（2026-11-11）：scripts/*kit_* にビルバオは無し。直近30日：20261109_stadium_athletic（2日前・スタジアム。本拠地の話だけ）。20260926_ll03_athletic（46日前・クラブ紹介＝30日の外）。
#   同じ赤白の由来の話は 11/11 のアトレティコ回が「分家」の側から言っている。この回は「本家」の側で、エロルドゥイの買い物・50枚を主にし、アトレティコの話は1行にとどめる。
#   この回では、本拠地の名前・サン・マメスの話は言わない（2日前のスタジアム回）。
# 今季のリーグ：en "2026–27 Athletic Bilbao season"（ラ・リーガ。「ラ・リーガ96季連続」）。
# 取材：requests だけ（Wikipedia API）。ブラウザ操作・JS実行は使っていない。クラブ公式は読んでいない。
#   読んだ：en "Athletic Bilbao"（Crest・Club colours）、es "Athletic Club"（Escudo・Indumentaria）、es "Historia del uniforme del Athletic Club"（Historia y evolución）、en "2026–27 Athletic Bilbao season"。
# ---- 食い違い・断ったこと ----
#   ・青白の最初のシャツ：en は 1902-03 季、es は 1903（コパ・デル・レイ初開催と同じ年）。→ 台本は「1903年ごろ」。寄付した人は es・en とも モーゼル（Juan Moser）。
#   ・赤白の由来：es・en とも、1909年のクリスマスに、エロルドゥイが青白を探して買えず、サウサンプトンの港で赤白50枚を買った、とする。
#     es は「最後の日まで買い物を残した」「ビルバオの港の旗と同じ色」と書く。en は「ビルバオ市の色と同じと気づいた」。→ どちらも「とされる」と言い、動機は es の2点だけ使う。
#     en は 2023年の調べでサンダーランド説もあるとする。→ 台本で「もう一つの説」として1行。
#   ・50枚の行方：es は「25枚はアスレティック、残りは祖父母の家に置き、1年後にマドリード支部へ」、en は「半分をアトレティコへ送った」。→ 「半分は、マドリードの分家へ」とだけ言う。
#   ・初着用：es「1910年1月9日、親善試合でスポルティング・イルンに0対2」。正式採用「1910年11月13日」。→ そのまま。
#   ・黒パンツ：es「1913年から黒を常用。サウサンプトンの黒パンツは1950年」。→ そのまま。
#   ・紋章：es・en とも 初代はAとCの青い輪、1910 に赤白の旗、1913 にボールを巻く旗、1922 が今の形の最初（en は「記録の初出1922」）、1941 に今の形（名前「アトレティコ・ビルバオ」）、1972 に色と英語名が戻る、2008 に形を少し変えた。
#     「アトレティコ・ビルバオ」の理由は en が「外国語の名前が禁じられた」と書く。→ 理由は言い切らず「禁じられたため、とされます」。
#   ・広告：es「2008年のペトロノールが、創立から110年で初めての広告。それ以前は 2004-05 UEFA杯の「エウスカディ」（制度の広告）」。en「200万ユーロあまり」。2015-16 から クッチャバンクが胸（es）。
#   ・シャツを作る会社：es「1980 アディダス（10年）、1990年代 カッパ（〜1998-99）、1999-2001 アディダス、2001 自前の100% Athletic（en は〜2009）、2009 アンブロ、2013-14〜 ナイキ、2017 ニューバランス、2023 キャストア」。
#     表は 1980・1991・2001・2013・2017・2023 の6行だけ。1991 は「1990年代」のカッパ（en の表は 1991–1999）。2009 のアンブロは表に入れず、本文で言わない。
#   ・ケチャップのシャツ：es「2004年、ダリオ・ウルサイ。8月5日、親善試合グローニンゲン戦（3対2で負け）。会長ラミクスが二度と使わないと決め、美術館 ARTIUM（ビトリア）の収蔵品、2009年に展示」。
#     「史上もっとも醜い20枚に入った」は感想なので言わない。
#   ・旗の色のシャツ：en「2011年、緑・白・赤。2012年ヨーロッパリーグ決勝（相手アトレティコ）で着た」。es は「緑の3枚目：2011-12 ほか」。→ 台本は en の言い方。決勝の結果は言わない。
#   ・パッチ：es の「2023年5月23日にマップのパッチ」は年が合わない記述があるので使わない。襟の小さな旗は es「2015-16 から」→ 使う。
# ---- 自分で数えた数 ----
#   赤白のしま：1910→2026＝116年。広告なし：1898→2008＝110年（es の「110年」と一致）。広告あり：2008→2026＝18年。110÷18＝6.1 → 約6倍。
#   黒パンツ：1913→2026＝113年。サウサンプトンの黒は1950年、ビルバオより37年あと。
#   紋章の今の形（1941）→2026＝85年。
# ---- 日本との接点 ----
#   見つけられなかった（日本の会社・日本人選手とシャツ・紋章のつながりは、読んだ資料に無い）。無理に入れない。
# 言わなかったもの：本拠地の名前（2日前のスタジアム回）／広告の金額以外の額／アトレティコの赤白の細かい話（2日前の回）／「史上もっとも醜い」の感想／フランコ政権への評価（名前を禁じられた事実だけ）。
# 写真：assets/images/20261113_kit_athletic/（credits.json）。Commons（CC BY-SA・CC0・Public domain）。代理店・放送映像・エンブレム画像は使っていない。
#   1923年の写真は撮影者不明のパブリックドメイン。バスの写真は Nationaal Archief（Anefo）の CC0（撮影年は未確認）。人物は特定していない。
