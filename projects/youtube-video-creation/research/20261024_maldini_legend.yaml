  say:
  - text: まず、ミランでの公式戦の得点は、33。27試合に1点の割合です。
    card:
      type: table
      title: マルディーニ ミランでの公式戦
      columns: [大会, 試合, 得点]
      rows:
      - [セリエA, '647', '29']
      - [コッパ・イタリア, '72', '1']
      - [ヨーロッパ, '161', '3']
      - [その他, '22', '0']
      - [合計, '902', '33']
      source: Wikipedia
      highlight_row: 4
    image: assets/images/20261024_maldini_legend/05_w.jpg
    emph: true
  - text: 左サイドバックですが、右利き。もとは右で、サッキ監督が左に回しました。
    card:
      type: table
      title: マルディーニの守備
      columns: [項目, 中身]
      rows: *id004
      source: Wikipedia
      highlight_row: 0
    image: assets/images/20261024_maldini_legend/a3_w.jpg
  - text: 持ち味の1つ目は、読み。相手の動きを、先に予測しました。
    card:
      type: table
      title: マルディーニの守備
      columns: [項目, 中身]
      rows: *id004
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261024_maldini_legend/a2_w.jpg
  - text: 2つ目は、位置取り。無理にタックルせず、立つ場所で、相手を抑えました。
    card:
      type: table
      title: マルディーニの守備
      columns: [項目, 中身]
      rows: *id004
      source: Wikipedia
      highlight_row: 1
    image: assets/images/20261024_maldini_legend/05_w.jpg
  - text: 晩年は、センターバック。経験と、空中戦と、タックルで守りました。
    card:
      type: table
      title: マルディーニの守備
      columns: [項目, 中身]
      rows: *id004
      source: Wikipedia
      highlight_row: 3
    image: assets/images/20261024_maldini_legend/a3_w.jpg
  - {text: イブラヒモビッチは、最も手ごわかった守備の選手に、マルディーニを挙げます。, card: none, image: assets/images/20261024_maldini_legend/01_w.jpg}
  - {voice: ズラタン・イブラヒモビッチ, text: 彼は、何もかも持っていた。完成されていて、強くて、賢かった。, card: none, pause: 0.6, image: assets/images/20261024_maldini_legend/06_w.jpg}
  quotes_from: ['https://www.gazzetta.it/Calcio/Ligue-1/05-06-2014/ibrahimovic-ronaldo-fenomeno-non-ci-sara-mai-giocatore-migliore-lui-80846175186.shtml']
  sources: ['https://en.wikipedia.org/wiki/Paolo_Maldini']
- id: match
