# パオロ・マルディーニ（元イタリア代表DF）の紹介。シリーズ「レジェンドの紹介（世界）」2026-10-24。型は 10/23 のイブラヒモビッチと同じ8節の変形（＋日本との接点の節）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（成績表・Honours・各大会ページ）・UEFA 試合記録（2005 決勝）・BBC・Guardian・FIGC 公式・Gazzetta と、自分で足した値だけ。
# **私生活・法的な問題は入れない。女子サッカーは入れない。**（父チェーザレは「40年前に同じ優勝カップを主将として掲げた」というサッカー上の事実だけ。サン・シーロの最後の日の一部ファンの抗議は入れない。ピルロの件の理由＝賭け会社の話も入れない）
#
# **引退の確認（一次情報に近いもの）**：英語版 Wikipedia＋BBC（2007-12-16 横浜の CWC 決勝後に「6月に引退」と話す→2008-06 にミランが契約を2009-06-30まで延長と発表）。最後の試合は 2009-05-31 セリエA最終節 フィオレンティーナ戦（ミラン 2-0）。→ **現役ではない（58歳）**。
# **いまの立場**：2018-08 ミランのスポーツディレクター→2019-06 テクニカルディレクター→2023-06-06 ミランが契約終了（BBC「sack」・クラブ声明）。**2026-07-11 に FIGC が「技術責任者（Direttore Tecnico）兼クラブ・イタリア会長（レオナルドが顧問）」の就任を公式発表（figc.it で本文確認）**。
#   Guardian 2026-07-27 は「Maldini and Leonardo resign … 16 days later」と報じる（見出し・本文とも「reportedly」。辞任の連盟側の公式発表は未確認）。英語版 Wikipedia は「辞任した」と断定。**それ以降（8〜10月）の立場は確かめられていない**ので、台本は「就任→16日後に辞任と報じられた→それ以降は確かめられていない」と言う。ピルロの件（賭け会社との関係）は入れない。
# **日本との接点（台本の「日本」節）**：国立競技場の世界一決定戦（インターコンチネンタルカップ）1989・1990・1993・1994、横浜 2003、横浜の CWC 2007（準決勝＝浦和 1-0、13日／決勝＝ボカ 4-2、16日）、日韓W杯 2002 の日本開催3試合（札幌・鹿島（茨城）・大分）。
#   出場の根拠：各大会の英語版 Wikipedia のスターティングメンバー表（1989 LB、1990 LB＝25分交代、1993 LB、1994 LB、2003 CB・主将、2007 決勝 LB・主将）＋成績表（2007-08 の「Other」に FIFA Club World Cup 2 試合）。準決勝の個別のメンバー表は未確認（成績表の2試合から）。2002W杯は本文の「4試合すべて出場」から。**合計「日本で10試合」は自分で足した値**（5+2+3）。
#   本人の言葉（BBC 2007-12 の英語を訳した）：「今日、成し遂げたことに心から満足している」「6月には、悔いなく、きっぱり引退する」（原文 “Today I truly feel satisfied with what I have achieved” / “In June I will absolutely retire without any regrets.”。BBC 記事は web.archive.org で本文確認）。
# **数字の出どころ・食い違いと台本での扱い**
# - 通算：英語版 Wikipedia の成績表 902試合33点（リーグ647/29・コッパ72/1・欧州161/3・その他22/0）。**25シーズン分の合計を自分で足して 902・33・リーグ647 と一致を確認**。代表 126試合7点（年別表）。
# - 出場の変化：1985-86〜1997-98（17〜29歳・13季）519試合／1998-99〜2008-09（30〜40歳・11季）382試合（自分で足した値。1984-85 の1試合は前半の13季に入れていない）。平均 39.9／34.7＝約13%減。最多 50試合＝1992-93。49試合＝2000-01 と 2002-03。
# - **最速ゴール**：英語版 Wikipedia は本文で「51秒」、記録欄で「50秒」と食い違う。UEFA 試合記録は「Maldini 1'」。台本は「1分もたたないうちに」と言う（秒数は言わない）。決勝の最年長得点者（36歳333日）は Wikipedia の記録欄のみ（台本は「最年長」まで）。
# - **「2005年の決勝を、キャリアで最悪の瞬間と呼んだ」**：英語版 Wikipedia の記述（2007年決勝の前の ESPN のインタビュー）。ESPN の原文は未確認なので、台本は「伝えられています」と言う。
# - **退場3回**：英語版 Wikipedia の記述のみ（出典の原文は未確認）。台本は断定の軽い言い方（「退場は3回でした」）だが、**確度は報道止まり**。
# - **イブラヒモビッチの言葉**：Gazzetta dello Sport 2014-06-05（Sports Illustrated のインタビューの紹介）が Maldini を「最もタフだった」と要約し、本人の言葉を「che aveva tutto, era completo, forte e intelligente」と引く。英語 Wikipedia の英訳と合わせて「彼は、何もかも持っていた。完成されていて、強くて、賢かった」と訳した（Gazzetta は原文のイタリア語で確認。SI の原文は未読）。
# - **PK戦の細部・個々のキッカー**は入れない。**1994年12月の日付**（Wikipedia 本文は 1 December 1994 とあるが、台本は日付を言わず「1994年」とだけ）。
# - 身長186cm：ミランの旧公式サイト（Wikipedia が引く）。ワールドサッカー誌の年間最優秀選手：ディフェンダーとして初（Wikipedia。原文の雑誌は未確認）。
# **入れなかったもの**：私生活（家族・子ども）、ミランのサポーターの抗議、ピルロとの件、背番号の話、ミラン・ホール・オブ・フェイム等の賞の羅列、ミラミ FC の共同オーナー。
# **日本語名・読みで怪しいもの**：マルディーニ・バッティスティーニ・クレスポ・シュミツェル・シャビ・アロンソ・タソッティ・バレージ・ウディネーゼ・アトレティコ・ナシオナル・ベレス・オールド・トラッフォード・チェーザレ・イル・カピターノ。（audio_query で見た：名前は割れない。**「サッキ」は「サッ/キ」と軽く割れる**。「2000-01」の形は「ゼロイチ」と読まれるので「2000年から2001年」と書いた）
