  - 1979年に始まったシーズン、リーグ戦で**32節**続けて負けなし。
  - 前のシーズンの終わりから数えると、**38試合**です。
  - text: ところが残り2節、セビージャに**1対2**で敗れます。
    card:
      type: table
      title: 1979年から80年のシーズン
      columns: *id001
      rows:
