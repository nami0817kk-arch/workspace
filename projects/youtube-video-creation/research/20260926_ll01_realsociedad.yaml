- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 走る。育てて売る。県ぐるみのクラブ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - よく走る
    - - 運営の型
      - 育てて売る
    - - クラブの気質
      - 県の5%が年間シート
  say:
  - text: マタラッツォ監督のチームは、よく走る。時速21キロを超えて走った距離は、リーグで**2番目**です。
    image: assets/photos/ll/realsociedad_manager_ab923e7e.jpg
  - ピッチの外は、育てて売る型。
  - オドリオソラは2018年、レアル・マドリードへ**3000万ユーロ**。今は戻っています。
  - スタンドは県ぐるみ。2022年の年間シートは**3万7584人**、県の人口の5パーセントを超えます。
  sources:
  - https://en.wikipedia.org/wiki/Real_Sociedad
  - https://www.realsociedad.eus/es/noticias/detalle/un-equipo-de-alta-velocidad
  - https://en.wikipedia.org/wiki/Real_Sociedad_Cantera
  - https://es.wikipedia.org/wiki/Real_Sociedad_de_F%C3%BAtbol
  bg: assets/backgrounds/stadium_レアルソシエダ_in.png
  official: false
