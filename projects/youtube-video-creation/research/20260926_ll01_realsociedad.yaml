- id: history
  heading: バスクの選手だけで
  tier: 背景
  telop: 長いあいだ、バスクの選手だけで戦った
  narrator: 解説
  card:
    type: table
    title: バスクの選手だけで
    columns:
    - ''
    - ''
    rows:
    - - 方針
      - バスクの選手だけ
    - - 同じ方針
      - アスレティック・ビルバオ
  say:
  - このクラブは長いあいだ、**バスクで生まれ育った選手**しか獲りませんでした。
  - 隣のアスレティック・ビルバオと同じ方針で、選手は自前で育てました。
  - その形のまま、1980年代の初めにスペインの頂点へ向かいます。
  sources:
  - https://en.wikipedia.org/wiki/Real_Sociedad
  - https://es.wikipedia.org/wiki/Historia_de_la_Real_Sociedad_de_F%C3%BAtbol
  bg: assets/backgrounds/stadium_レアルソシエダ_in.png
  official: false
