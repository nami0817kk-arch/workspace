  - リヴァプールから、アイルランド代表のジョン・オルドリッジを獲りました。
  - text: 数十年ぶりのバスク以外の選手で、移籍金は**100万ポンド**。
    card:
      type: table
      title: 1989年の転換
      columns: *id002
      rows:
      - - 1シーズン目
        - リーグ16得点
  - 1シーズン目に**16得点**。それでも、受け入れないファンがいました。
