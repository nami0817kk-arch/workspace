- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 久保建英と、4か月で国王杯を取った監督
  narrator: キャスター
  say:
  - text: 日本の**久保建英**は、ここで**5シーズン目**を迎えています。
    image: assets/stats/ll_realsociedad_data_r1.png
    no_telop: true
  - text: 率いるのは、アメリカ出身のマタラッツォ監督。こう話しています。
    image: assets/stats/ll_realsociedad_data_r2.png
    no_telop: true
  - voice: ペッレグリーノ・マタラッツォ
    text: もっと攻撃的なチームになりたい。野心はあるし、勝ちたいのは疑いようがない
    image: assets/stats/ll_realsociedad_data_r2.png
  - text: 就任から**4か月**で、国王杯を制しました。今季はヨーロッパリーグにも出ています。
    image: assets/stats/ll_realsociedad_data_r2.png
    no_telop: true
  - text: そしてこのクラブは、バスク出身の選手だけで、スペインの頂点に**2度**立っています。
    image: assets/stats/ll_realsociedad_data_r3.png
    no_telop: true
  - image: assets/stats/ll_realsociedad_data0.png
    text: 創立は**1909年**。その年の国王杯を制した面々が、クラブを作りました。
    no_telop: true
  - image: assets/stats/ll_realsociedad_data1.png
    text: 愛称は「チュリ・ウルディン」。バスク語で**白と青**。町の旗の色です。
    no_telop: true
  - image: assets/stats/ll_realsociedad_map.png
    text: ホームタウンはサン・セバスティアン。フランス国境まで**20キロ**の港町です。
    no_telop: true
  - image: assets/backgrounds/stadium_レアルソシエダ.png
    text: 本拠地はアノエタ。クラブの発表では、**4万人**が入ります。
  - image: assets/stats/ll_realsociedad_data4.png
    text: 会長は**2008年**からホキン・アペリバイ。クラブは株式会社の形です。
    no_telop: true
  - image: assets/stats/ll_realsociedad_cups.png
    text: 1部の優勝は**2回**。国王杯は**4回**、スーペルコパは**1回**。
    no_telop: true
  - image: assets/stats/ll_realsociedad_data6.png
    text: 最多出場は、センターバックのアルベルト・ゴリス。このクラブだけで**599試合**です。
    no_telop: true
  - image: assets/stats/ll_realsociedad_data7.png
    text: 直近のタイトルは昨季の国王杯。アトレティコと2対2のあと、ピーケー戦を**4対3**で制しました。
    no_telop: true
  - image: assets/stats/ll_realsociedad_last.png
    text: 昨季のリーグ戦は**10位**。勝ち点は**46**でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Real_Sociedad
  - https://en.wikipedia.org/wiki/2026–27_Real_Sociedad_season
