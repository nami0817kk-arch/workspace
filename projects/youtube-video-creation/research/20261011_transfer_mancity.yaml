      - ['4億190万ユーロ', 直前の市場価値の合計]
      - [約1.31倍, 相場の何倍か]
      ops: ['÷', ＝]
  - text: 斜めの線は、市場価値とちょうど同じ額を払った場合を表します。
    card:
      <<: *scat
      highlight: エンソ
  - text: その線より上にいる7人が、相場より高く買われた側です。
    card:
      <<: *scat
      highlight: エンソ
  - text: 下にいるのは2人だけ。17歳のモンガと、34歳のルリでした。
    card:
      <<: *scat
      highlight: モンガ
  - text: では、売るほうはどうだったのか。
    image: assets/backgrounds/stadium_マンチェスターシティ.png
    card: none
  - text: 移籍金が付いた8人の市場価値は、合わせて2億3800万ユーロ。
    card: &calc_out
      type: calc
      title: 売った8人は相場の何倍か
      terms:
      - ['3億3692万ユーロ', 8人ぶんの受け取り]
      - ['2億3800万ユーロ', 直前の市場価値の合計]
      - [約1.42倍, 相場の何倍か]
      ops: ['÷', ＝]
  - text: 受け取ったのは、その約1.42倍でした。
    emph: true
    card: *calc_out
  - text: 高く買ってはいますが、売るほうはもっと高く売っています。
    card: *calc_out
  - text: ただし市場価値は推定で、値段ではありません。物差しとして並べただけです。
    card: *calc_out
