  question: 今夏のマンチェスター・シティの移籍期間で、金はどこへ、どれだけ動いたのか
  lead: この夏、世界でいちばん選手に金を出したクラブ。
  hook: ただ、その半分以上は、窓が閉じる前に戻ってきています。
  takeaway: マンチェスター・シティが今夏に選手へ払った5億2620万ユーロは、世界のどのクラブより多い（2位チェルシーの4億748万ユーロの約1.29倍）。いまの為替でおよそ933億円。一方で選手を売って受け取った額が3億3702万ユーロあり、出した額の64%が同じ夏のうちに戻っている。払ったのは9人で、エンソ・フェルナンデス1億4500万、エリオット・アンダーソン1億3500万、アユーブ・ブアディ9500万の3人だけで3億7500万ユーロ＝全体の71%。売って金になったのは8人で、サヴィオ8770万、レインデルス6100万、ロドリ6000万の3人で62%を占める。移籍の直前に付いていた推定の市場価値と比べると、買った9人は合計4億190万ユーロに対して約1.31倍を払い、売った8人は合計2億3800万ユーロに対して約1.42倍を受け取っている。高く買ってはいるが、売るほうはもっと高く売っている。夏の支出を5年並べると1億4400万、2億4110万、2500万、2億680万、そして今年で、2024年の夏の21.0倍、5年の合計11億4310万ユーロの46%がこの夏ひとつに入っている。ただし差し引きの1億8918万ユーロ（およそ335億円）は今夏の世界で4番目で、1位は2億3340万ユーロのリヴァプール。そのリヴァプールとの試合が日本時間12日0時半に組まれている
