# 移籍の深掘り 第2回：マンチェスター・シティの2026年夏（「1クラブの移籍期間」の回）。10/11 公開。
# **「1つの移籍」と「1クラブの移籍期間」を使い分ける決まり。**10/9 の第1回は「1つの移籍」（ネイマール）だったので、
#   今回は「1クラブ」。並びは今夏の支出上位クラブからで、いちばん上がマンチェスター・シティ。
# 材料の控えは research/raw/20261011_transfer_mancity.md。**材料から出ない。**
#
# **角度は「窓全体の金の動き」。**同じ3人を扱った回と切り口が重ならないようにしてある:
#   10/5「移籍の答え合わせ」… エンソ・アンダーソン・ブアディの**出来**（出場時間・得点・評点）。
#     この回は**出場・得点・評点を1つも使っていない**。選手が何をしたかには触れない。
#   10/7「マンチェスター・シティの財政」… **判決・罰・前例の減点**。
#     この回は**規律の話を1行も入れていない**。扱うのは移籍金の出入りだけ。
#   10/10「city_around」「city_carrick」「city_maresca」… 人事と監督。重ならない。
#
# いちばん強い一点：**今夏、世界でいちばん金を出したクラブがマンチェスター・シティ**（5億2620万ユーロ）。
#   2位のチェルシー4億748万ユーロに対して約1.29倍。山場の節の頭に置いた。
#
# **数字の確度。**移籍金はすべて Transfermarkt の集計で、**確度は「報道」**:
#   - **固定の額とボーナスの切り分けは、どのクラブも公表していない。**だから台本でも
#     「この額が固定なのかボーナス込みなのかは公表されていません」と**声に出して断っている**（節②）。
#     クラブが発表した額ではないので「クラブが発表した」とは一度も言わない。
#   - 市場価値は Transfermarkt の**推定**であって値段ではない。節④で声に出して断っている。
#   - 媒体名は台本に出さない（2026-09-21 の決まり）。出どころは各節の sources に置くだけ。
#
# **自分で数えた数**（材料 3〜6 に式と元の数字がある。すべて百万ユーロ）:
#   上位3人 145+135+95＝375.0 → 375.0÷526.20＝71.3%／残る6人 70+37.5+25+11.7+3.5+3.5＝151.2／
#   1人あたり 526.20÷9＝58.47／売却上位3人 87.70+61.00+60.00＝208.70 → ÷337.02＝61.9%（台本は62%）／
#   337.02÷526.20＝64.0%／526.20−337.02＝189.18／
#   買った9人の移籍前の市場価値 100+110+80+55+20+15+15+6+0.9＝401.9 → 526.20÷401.9＝1.309（約1.31倍）、差 124.30／
#   売った8人の移籍前の市場価値 35+50+55+40+25+17+12+4＝238.0 → 336.92÷238.0＝1.416（約1.42倍）／
#   5年の夏の支出 144.00+241.10+25.00+206.80+526.20＝1143.10 → 526.20÷1143.10＝46.0%、526.20÷25.00＝21.0倍／
#   プレミア20クラブの今夏の支出の合計 4119.43 → 526.20÷4119.43＝12.8%（台本では読まない。材料の控えのみ）
# **3億3702万と3億3692万を言い分ける。**3億3702万は貸し出しの手数料10万ユーロを含む窓全体の収入、
#   3億3692万は**移籍金の付いた8人ぶん**。節④の割り算は8人ぶんのほう（市場価値も8人ぶんで足しているため）。
# 為替は ECB 参照相場の 2026-10-09＝1ユーロ177.34円（取れたいちばん新しい日）。**どの日の為替かを必ず言う**。
#   5億2620万ユーロ × 177.34 ＝ 933億1631万円 → 「およそ933億円」。
#   1億8918万ユーロ × 177.34 ＝ 335億4918万円 → 「およそ335億円」。
#
# 数字の重なり対策（別の節で同じ数字を読まない）：
#   『5億2620万ユーロ』は①だけ（④⑤は「払った額」「今年の夏」で受ける）。『3億3702万ユーロ』も①だけ。
#   『1億8918万ユーロ』は⑤だけ。『933億円』は①だけ、『335億円』は⑤だけ。**題には金額を入れない**。
# 板：①waterfall と convert ②table（9行）③table（8行）④scatter（diagonal つき）と calc 2枚 ⑤line と calc。
#   **versus は使っていない**（1つの節に20秒以上出せないうえ、この回は人の比べではないため）。
#   板を下ろす行には `card: none` を明示した（`card:` を消すだけでは前の板が残る）。
#   赤ペン（mark）は使っていない。
# 写真：3枚。エンソ・フェルナンデス（Commons「Enzo Fernandez Argentina v Egypt 7 July 2026-276.jpg」
#   CC BY-SA 4.0 / Bryan Berlin、2026年。**10/5 の回で使った -050 とは別の1枚**）＋
#   本拠地の実写2枚（assets/backgrounds の内と外。顔が無いので板が顔にかからない）。
#   **10/7 の財政の回で使った City of Manchester Stadium の3枚は1枚も使っていない。**代理店の写真は無し。
#   **エンソは冒頭（0:03 の顔）とサムネだけ。**最初は節②〜⑤にも敷いていたが、preview4 で
#   山場（13.1秒）と60秒の板が顔に100%かかったので、節①の2行目から本拠地の実写に替えた。
#   縦版（ショート用）は `01_w_v.jpg`（＝01_v.jpg と同じ切り）と、背景の `_v.png` 2枚を作った。
# 声：1件も無い（数字が主役の回。シリーズなので反応は集めていない）。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは案A（構図 number、伏せるのは933億円）。
#   伏せた答えは節①の読み上げに出てくる。10/9 が number、10/10 が scene と classic なので3回続きにはならない。
