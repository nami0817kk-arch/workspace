  - text: それでもレアルは、この16歳に大金を投じます。
    emph: true
    card:
      <<: *deal_card
      highlight_row: 3
  - text: 憧れの白いユニホームへの思いを、本人は2021年にこう明かしています。
    image: assets/images/20261007_player_371998/rso2026/01_w.jpg
