  - text: クラブの1点は8月26日、本拠地でのレアル・ソシエダ戦でした。
    card: *recent_card
  - text: 同じ試合では、エムバペの3点目もお膳立てしています。
    card: *recent_card
  - text: 9月29日の代表戦では、ペナルティーキックで1点。
    card:
      <<: *recent_card
      highlight_row: 1
  - text: 10点満点の評点は8.6。この5試合の中で、いちばんの出来でした。
    card:
      <<: *recent_card
      highlight_row: 1
  sources:
  - https://www.transfermarkt.com/vinicius-junior/profil/spieler/371998
  - https://www.fotmob.com/players/846033
  - https://www.realmadrid.com/en-US/news/football/first-team/reports/cronica-real-madrid-real-sociedad-jornada-1-liga-26-08-2026
- id: story
  heading: 「パスするな」と、初の有罪判決
  tier: 報道
  telop: ベンゼマとの関係、そしてバレンシアでの出来事
  narrator: 解説
  card:
    type: table
    title: ピッチの外の2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - [点が伸びないころ, ベンゼマの「パスするな」が報じられる]
    - [2023年5月, バレンシア戦で人種差別を受ける]
    - [2024年6月, 観客3人に有罪判決]
    source: スポルティーバ・AFPBB
  say:
  - text: 数字の外にも、ヴィニシウスを語るうえで外せない話があります。
    image: assets/images/20261007_player_371998/y2021/01.jpg
    card: &story_card
      type: table
      title: ピッチの外の2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: スポルティーバ・AFPBB
      highlight_row: 0
  - text: 点が伸びないころ、エースのベンゼマが味方に話した言葉が報じられました。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 「あいつにはパスするな」。
    card:
      <<: *story_card
      highlight_row: 0
  - text: それが21/22の季には、ベンゼマとの連係がレアルの得点源に変わります。
    card:
      <<: *story_card
      highlight_row: 0
  - text: もう1つは2023年5月、敵地でのバレンシア戦。人種差別的な行為を受けました。
    image: assets/images/20261007_player_371998/espanyol2026/01_v.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 翌年6月、裁判所は観客3人に執行猶予つきの禁錮8か月を言い渡します。
    card:
      <<: *story_card
      highlight_row: 2
  - text: スペインのサッカーで、人種差別をめぐる初めての有罪判決でした。
    card:
      <<: *story_card
      highlight_row: 2
  - text: 判決のあと、本人が自身の投稿に記した言葉です。
    card: none
  - voice: ヴィニシウス
    text: スペイン史上初のこの有罪判決は、
  - voice: ヴィニシウス
    text: 自分のためではなく、黒人の人々全員のためのものだ
    cont: true
    pause: 0.6
  sources:
  - https://sportiva.shueisha.co.jp/clm/football/wfootball/2023/05/12/fw_2/?page=2
  - https://sportiva.shueisha.co.jp/clm/football/wfootball/2023/05/12/fw_2/?page=3
  - https://www.afpbb.com/articles/-/3523639
  - https://www.soccer-king.jp/news/world/esp/20240611/1899653.html
- id: view
  heading: 今季の出足、過去4季の同じ時点と比べる
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 日本時間11日にビジャレアル戦、11月に日本戦
  card:
    type: table
    title: 10月5日時点のクラブの数字
    columns: [季, 試合, 得点, アシスト]
    rows: &pace_rows
    - ['22/23', '11', '7', '3']
    - ['23/24', '6', '2', '0']
    - ['24/25', '12', '4', '7']
    - ['25/26', '10', '5', '4']
    - ['26/27', '8', '1', '3']
    source: Transfermarkt（7月15日〜10月5日の公式戦を数えた）
  say:
  - text: 最後に、今季の出足を見立てます。比べるのは、過去4季の10月5日の時点です。
    image: assets/images/20261007_player_371998/rso2026/01_v.jpg
    card: &pace_card
      type: table
      title: 10月5日時点のクラブの数字
      columns: [季, 試合, 得点, アシスト]
      rows: *pace_rows
      source: Transfermarkt（7月15日〜10月5日の公式戦を数えた）
  - text: 昨季の同じ時点は、10試合で5点でした。
    card:
      <<: *pace_card
      highlight_row: 3
  - text: 今季は8試合で1点。点のペースは、4季のどれよりも落ちています。
    card:
      <<: *pace_card
      highlight_row: 4
  - text: ただ、ゴール期待値、つまりシュートの決まりやすさを足した数字では3.0。
    card:
      <<: *pace_card
      highlight_row: 4
  - text: 点になる形は、3点ぶん作れていることになります。
    card:
      <<: *pace_card
      highlight_row: 4
  - text: 23/24も、6試合で2点という出足でした。
    emph: true
    card:
      <<: *pace_card
      highlight_row: 1
  - text: その季は終わってみれば、自己最多の点に届いています。
    card:
      <<: *pace_card
      highlight_row: 1
  - text: 9月の会見で、モウリーニョ監督は次のように語りました。
    image: assets/images/20261007_player_371998/mourinho/01_w.jpg
    card: none
  - voice: モウリーニョ
    text: ヴィニシウスの最高の姿を皆が求めており、
  - voice: モウリーニョ
    text: その最高の姿が訪れるでしょう。
    cont: true
  - voice: モウリーニョ
    text: ただ、現時点ではまだ到達していません。
    cont: true
  - voice: モウリーニョ
    text: それでも、彼はこれまで以上に努力しているヴィニです
    cont: true
    pause: 0.5
  - text: 次は日本時間11日、本拠地でビジャレアルと戦います。
    image: assets/images/20261007_player_371998/city2026/01_w.jpg
  - text: 日本代表とは、11月にシンガポールで向き合います。
    image: assets/images/20261007_player_371998/wc94/01_w.jpg
  - 監督の言う「最高の姿」が、いつ戻ってくるのか。そこに注目です。
  sources:
  - https://www.transfermarkt.com/vinicius-junior/leistungsdatenverein/spieler/371998
  - https://www.fotmob.com/players/846033
  - https://www.realmadrid.com/ja-JP/news/football/first-team/press-conference/rueda-prensa-mourinho-pre-rm-rayo-j5-liga-11-09-2026
  - https://www.jfa.jp/samuraiblue/20261117/about.html
