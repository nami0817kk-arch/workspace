  - text: 11月14日、日本と戦うブラジルの背番号7。
    image: assets/images/20261007_player_371998/wc94/01_w.jpg
  - text: ヴィニシウス・ジュニオール。左から仕掛け続ける、レアルのウイングです。
    image: assets/images/20261007_player_371998/rso2026/01_w.jpg
