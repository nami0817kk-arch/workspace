# 一次情報（PSG 公式 psg.fr 2026-11-06 10:42Z「Paris Saint-Germain in Guinness World Records」。本文を全部読んだ。英語）:
#   「12 records」＝クラブとして7つ、選手個人で5つ（Foot Mercato は「Football 2027 の版に12個、うち集団7・個人5」）。内訳（PSG 公式の本文どおり）:
#     クラブ: ①フランス王者14回（1986〜2026。どのクラブより多い）／②1シーズンの勝ち点96（2015-16）／③36試合負けなし（2015年3月15日〜2016年2月20日）／
#             ④14連勝（2018年8月12日〜11月24日。2018-19）／⑤1部で敵地39試合負けなし（2023年2月26日〜2025年5月3日）／
#             ⑥CL決勝の最大点差＝2025年5月31日ミュンヘン、インテルに5-0／⑦CL 1大会の得点45（2025-26）
#     個人:  ⑧ドゥエ＝CL決勝で3つの得点関与（2得点1アシスト）／⑨ヴィティーニャ＝パス1,602本（記事は2025-26のCLの項に置く。Foot Mercato は「1大会」）／
#             ⑩クヴァラツヘリア＝決勝トーナメントの7試合連続で得点に関与（2026年2月25日〜5月6日。CLの記録）／⑪マルキーニョス＝リーグ・アン優勝11回（2014〜2026。どの選手より多い）／
#             ⑫ファビアン・ルイス＝1部で51試合負けなし（パリで2023年5月7日〜2025年4月25日）
#     「These 12 records mean PSG as a club and its players are all written into the Guinness World Records.」
#   Foot Mercato（フランスの報道、同日）の要約と内訳が一致（クラブ7＝決勝5-0・45得点・敵地39・36試合・14連勝・勝ち点96・14回／個人5＝クヴァラ・ヴィティーニャ・ドゥエ・ファビアン・ルイス・マルキーニョス）。
#   ギネス公式（guinnessworldrecords.com）の該当ページは見つけられなかった。確定の根拠はPSG公式（クラブの発表）。
# 自分で数えたもの: 12個＝クラブ7＋個人5。国内の記録（勝ち点・無敗・連勝・敵地無敗・優勝14・マルキーニョス・ファビアン）は7つ、CLの記録（決勝5-0・45得点・ドゥエ・ヴィティーニャ・クヴァラ）は5つ。
#   CLの5つは全部、2025年5月31日の決勝以降の記録（決勝・2025-26の大会・2026年2〜5月）。国内の7つは1986〜2026年にまたがる。
# 食い違い: ヴィティーニャの1,602本は、PSG 公式の本文だけでは「1大会」とは書かれていない。台本は「CLでパス1,602本」とだけ言い、「1大会」とは言わない。
