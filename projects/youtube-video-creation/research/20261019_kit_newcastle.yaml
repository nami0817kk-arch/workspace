# ユニフォームとエンブレムの歴史 ニューカッスル・ユナイテッド（10/19 作成。10/17 アーセナル・10/18 シティの次の回）。
# 題の問い：白黒の縞は、いつから、なぜ縦じまなのか。
# 軸：①縞の始まりの年は資料が一致する（1894年）。②由来の理由は資料で割れる（公式の年表は書かない／公式の読み物は2説／ウィキペディアは2軍の色と言い切る／研究サイトは「おそらく」）。
#    ③縦か横かの理由はどの資料にも無い。④エンブレムの変遷（公式の5段）と 2026-10-01 の新エンブレム発表（2027/28 から）。⑤胸の広告は公式で確かめた分だけ。
# 一次情報（newcastleunited.com 公式の本文）を requests のブラウザ User-Agent で読み、ウィキペディア(en)の本文・古いユニフォームの研究サイト（Historical Football Kits の
#   2012-06 のアーカイブ）と突き合わせた。2026-10-18 取材。ブラウザ操作なし。WebFetch 不使用。検索エンジンのAI要約は使っていない。
#   読んだ公式の頁：/en/uniteds-victorian-start-1881-1899（年表）・/en/club-crest（エンブレムの歴代）・/en/news/introducing-our-new-club-crest（2026-10-01）・
#   /en/news/our-club-crest-an-update（2026-08-02）・/en/news/updating-our-crest-together（2025-05-09）・/en/news/kits-a-brief-history（2024-06-05、読み物）・
#   /en/news/2025-26-newcastle-united-home-kit・/en/news/newcastle-united-and-adidas-unveil-2026-27-home-kit・/en/news/newcastle-united-unveils-2024-25-away-kit・
#   /en/news/newcastle-united-and-adidas-unveil-home-kit-for-2024-25-season・/en/news/knox-hydrate-front-of-shirt-partnership・
#   /en/news/unsilence-the-crowd-sela-donates-sponsorship-to-rnid-to-mark-unique-accessible-shirt-launch、
#   ほかにクラブ公式の旧サイトの記事（web.archive.org 2018-08 の「New kit: A closer look」2017-06-14、2010-12 の旧「Club Crest」頁）。
#
# ---- 一次情報で確かめたこと（年は公式の本文のまま）----
#   ・年表（1881-1899）：1881-11 に Stanley（クリケット部）が起こり、1882-10 に Newcastle East End へ。西側の West End は 1882。1892-05 に East End が West End の
#     資産（St. James' Park の賃借を含む）を引き継ぎ、1892-12-09 に Newcastle United の名前を採る。
#     「The team still played in the East End colours of red, but in 1894 they were replaced by the now famous black and white stripes.」← 縞の始まり＝1894年。理由は書いていない。
#   ・読み物「Kits: A brief history」（2024-06-05、くだけた口調の記事）：「Come 1894, the club decided to don the now-iconic black and white stripes.
#     Some say it was inspired by the colors of the coal mines that were the lifeblood of the city. Others reckon it was to make the players look slimmer.」
#     → 2説（炭鉱の色・細く見える）。**どちらも根拠は示されていない**。冗談めいた書き方なので、台本は「説」として紹介し、公式の見解とは言わない。
#     同じ記事は「1892年に赤いシャツに白いショーツで、couple of years だけ」と書く。
#   ・2025/26 ホーム（公式 2025-05-23）：「blending it seamlessly with our historic vertical stripes」← **公式が「縦じま」と書いている**（縞を縦と決めた理由は書いていない）。
#   ・2026/27 ホーム（公式 2026-06-10）：「a bold, disrupted stripe pattern」。アディダス。
#   ・2024/25 ホーム（公式 2024-06-07）：アディダスが戻る（1995-2010 も供給）。「draws inspiration from the classic 2002/03 adidas home kit」。
#   ・2024/25 アウェー（公式 2024-08-13）：「the classic navy and burgundy horizontal stripes」＝1995-96 の復刻。**横縞はアウェー**。
#   ・2017/18 ホーム（公式 2017-06-14）：プーマ、125周年（1892-12-09 の命名から125年）。「unbroken stripes on the front, back and arms」「red numbers」。胸の広告は FUN88。
#   ・エンブレム（公式 /en/club-crest）：1969-1976 市の紋章（「Our shirts first had the city's Coat of Arms emblazoned on them as early as 1911, but it was in 1969 that
#     the club finally adopted it as an official emblem」）／1976-1983 クラブ初の自前（城・川・カササギの円形、黒い外輪に名前）／1983-1988 NUFC の4文字の円形（「cult classic」）／
#     1988-現在 市の紋章の形に戻る（2頭の海馬・城・獅子・旗。内側の盾に縞、青いリボン）。2017/18 は125周年の金銀の特別版（現行をもとに）。近年は白または黒の単色版。
#   ・旧公式サイト（2010-12）：「the shield signifies the club's black'n'white striped shirt」← **盾が縞のシャツを表す**。
#   ・新エンブレム（公式 2026-10-01）：2年以上の聴取。3案の投票に 27,348 人。第1希望 C案 64.8%・B案 19.0%・A案 16.2%。**2027/28 シーズンのユニフォームから付く**。
#     現行は 1988 から（「38-year-old design」）。城・縞の盾・2頭の海馬（hippocampi）・獅子・旗・リボンは残す。
#     （2026-08-02 の記事：84% が「作り直しより手直し」、5分の4が現行の限界を認める、「no generic circular badge」「Retain the ribbon」）
#     **新しい絵の細部は、公式のこの記事に文章では書かれていない**（画像のみ）→ 台本は絵の細部に触れない。
#   ・胸の広告：Knox Hydrate は 2026-06-23 公式（2026/27 から3年）、Sela は 2024-04-11 公式が「front-of-shirt partner」と書く、Fun88 は 2017-06 公式、
#     最初の胸の広告は 2024 の読み物が「1980 年に Newcastle Brown Ale」と書く。ノーカット：Virgin Money・Wonga・NTL・Northern Rock は**公式で確かめていないので言わない**。
#
# ---- 食い違い（台本で断る／言わないもの。ここに残す）----
#   ・**縞の由来**：公式の年表＝書かない／公式の読み物＝2説（炭鉱の色・細く見える。根拠なし）／ウィキペディア＝「2軍の色を1軍が引き継いだ。前身のどちらとも結びつかない色だから選ばれた」と言い切る／
#     研究サイト（Historical Football Kits。Pioneers of the North 2009 に拠る）＝「1891年にできたアマチュアの2軍の色。**perhaps** 前身のどちらとも結びつかないから」と推量。
#     → 台本は**どれも断定しない**。「言い切る側」と「おそらくと書く側」の違いを言う。
#   ・**縞の始まりの年**：公式・ウィキペディア・研究サイトとも1894年で一致。台本は「一致する」と言う。
#   ・**市の紋章がシャツに付いた年**：公式＝「早くは1911年」「正式な採用は1969年」／ウィキペディア＝「1969年に初めて刺繍された」／研究サイト＝「1911年・1920年の決勝で付けた。リーグ戦は1969-70年から」。
#     → 台本は「年が違うのは数える試合が違うからかもしれない」と読みを断ったうえで、**年は公式の言い方（1911年が早い・1969年から76年が正式）に従う**。
#   ・**最初の胸の広告**：公式の読み物は「1980年にニューカッスル・ブラウン・エール」、ウィキペディアの表は 1980-86 が Newcastle Breweries（ブラウン・エールは 1990 から）。→ 台本は食い違いとして言う。
#   ・**縦じまの理由**：どの資料にも**書いていない**。公式が「縦じま」と呼ぶことだけ言える。
#   ・**ウィキペディアの記事内の食い違い**：本文は Sela を 2023-2026 と書き、表は 2025-26 を「スポンサー無し」とする。→ 台本はウィキペディアの年を使わない（Sela は公式の 2024-04 の記載だけ）。
#   ・**East End の赤白の縞の2枚目のシャツ**（ウィキペディア・1880年代なかば。サンダーランドと同じ色）：根拠が薄く、台本の本筋でもないので**言わない**。
#
# ---- 自分で数えた数（検算した）----
#   ・赤の期間：1892（ユナイテッドの命名）→1894＝2年。縞：1894→2026＝132年。132÷2＝66倍。
#   ・クラブの創立（公式「Founded 1881」）から 2026 までは 145年。そのうち縞は 132年（91%）。※台本では使わない（見立ては66倍だけ）。
#   ・エンブレム：1969–76＝7年、1976–83＝7年、1983–88＝5年、合計19年。現行 1988→2026＝38年。38÷19＝2。
#   ・投票：64.8＋19.0＋16.2＝100.0。64.8−19.0＝45.8ポイント。27,348人。
#
# ---- 言わないと決めたもの ----
#   ・サポーターの感情・Mike Ashley・PIF など所有の話（本題から外れる）、契約の額（クラブの発表に額が無い）、アウェー・サードの色の詳細、新エンブレムの絵の細部、女子チーム。
#   ・Virgin Money・Wonga・NTL・Northern Rock・Newcastle Breweries の年（公式で確かめていない。Newcastle Breweries はウィキペディアの表を断りとして出すだけ）。
#   ・名前を出さない人物：写真に写る選手・昔のチームの人々（ファイル名・記事から人は特定できるが、台本で名前を出さない）。
#
# ---- 一次情報に届かなかったところ ----
#   ・縞の由来の理由は、クラブの資料に書かれていない。研究サイトの根拠 Pioneers of the North（2009）の本文は読んでいない（二次）。
#   ・1894年のどの試合から縞を着たか・縞の幅や形は読んでいない。
#
# ---- 写真（assets/images/20261019_kit_newcastle/、出典は credits.json）。すべて取り込んだあと開いて見た（透かしなし・代理店の表記なし）。クラブ公式（権利は晴れていない＝引き受ける危険）----
#   n01〜n04 = 年表の画像（1888 ウェスト・エンド／1890年代 イースト・エンド／1895／1904-05）。人物の名前は出さない。
#   k01 = 2026/27 ホームの公式写真（選手2人、名前は出さない）、k02 = 2025/26 ホームの公式写真、k03 = ホームのシャツ胸のアップ（エンブレムのページ）。
#   c06 = 新エンブレム発表記事のメイン画像（暗い地）。c04/c05 = 1988 と 125周年のエンブレム。c11 = その2つを並べた自作板。c12〜c14 = 1969・1976・1983 のエンブレム1つずつを暗い地に置いた自作板
#   （元の画像が300pxなので 1.5〜1.6倍までに抑えた）。権利は晴れていない。
#   写真は **Getty 等の代理店は使っていない**（2026/27 ホームの記事には Getty の画像が混じっていたが、取らなかった）。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**（A=k01 選手2人／B=n03 1895年のチーム写真／C=k03 胸のアップ）。ここの thumbnail は点検用の案A。
