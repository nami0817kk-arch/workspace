    card:
      <<: *id_crest
      highlight_row: 2
  - text: 城と川と、愛称のカササギを描いた円形です。
    card:
      <<: *id_crest
      highlight_row: 2
  - text: 1983年は、エヌユーエフシーの4文字を丸く囲んだ形に替わります。
