    card:
      <<: *id_crest
      highlight_row: 3
  - text: 前の7年より短い、5年で終わりました。公式は、カルト的な人気と書きます。
    card:
      <<: *id_crest
      highlight_row: 3
  - text: 1988年、市の紋章をもとにした形へ、戻ります。
