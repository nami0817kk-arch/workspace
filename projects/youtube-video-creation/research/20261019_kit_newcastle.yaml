- id: view
  viewpoint: true
  heading: 見立て・縞は132年で赤の66倍。現行の紋章は前3つの2倍
  tier: 背景
  telop: 縞は132年、赤は2年で66倍。現行のエンブレムは38年で、前の3つの合計19年の2倍
  narrator: 解説
  card: &id_ratio
    type: calc
    title: 縞は、赤の何倍続いたか
    terms:
    - - 132年
      - 1894〜2026（縞）
    - - 2年
      - 1892〜94（赤）
    - - 66倍
      - 割った答え
    ops:
    - ÷
    - ＝
  say:
  - text: 最後に、年数を数えて比べます。
    image: assets/images/20261019_kit_newcastle/n04_1905_f.jpg
    card: none
  - text: まず、縞と、その前の赤です。
    card: none
  - text: ユナイテッドの名前になった1892年から、縞の1894年まで、赤は2年。
    card: *id_ratio
  - text: 縞は、1894年から2026年まで、132年。
    card: *id_ratio
  - text: 132を2で割ると、66。
    card: *id_ratio
  - text: 縞は、赤の66倍の長さを、着ています。
    emph: true
    card: *id_ratio
    mark:
      kind: circle
      item: 2
  - text: もう1つは、エンブレムです。
    image: assets/images/20261019_kit_newcastle/c11_1988.jpg
    card: none
  - text: いまの形は、1988年から2026年まで、38年。
    card: none
  - text: その前の3つは、7年、7年、5年。合わせて19年で、38年より短い。
    card: none
  - text: 38を19で割ります。
    card: &id_emb
      type: calc
      title: 現行のエンブレムは、前の3つの何倍続いたか
      terms:
      - - 38年
        - 1988〜2026
      - - 19年
        - 前の3つの合計
      - - 2倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 答えは2。現行の形は、前の3つの合計の、ちょうど2倍。
    emph: true
    card: *id_emb
  - text: いまの形で着るのは、あと今季だけ。
    image: assets/images/20261019_kit_newcastle/k03_home_stills.jpg
    card: none
  - text: 縞は132年。次の形でも、盾の中に残る、と公式は書いています。
    card: none
