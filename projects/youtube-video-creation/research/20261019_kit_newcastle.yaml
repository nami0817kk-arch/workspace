    card: none
  - text: ウィキペディアは、1969年に初めて刺繍された、と書きます。
    image: assets/images/20261019_kit_newcastle/c12_1969.jpg
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 研究サイトは、1911年はFA杯決勝だけ、リーグ戦は1969年から、と書きます。
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 年が違うのは、数える試合が違うから、と読めます。
