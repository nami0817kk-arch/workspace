  title: トルコがモンテッラを解任。連盟が同じ日に出した公告に並んでいたもの
  question: モンテッラはなぜ切られ、連盟が同じ日に出した公告には何が並んでいたのか
  takeaway: トルコサッカー連盟は2026年10月9日、公式サイトの公告でヴィンチェンツォ・モンテッラとの契約を継続しないと発表した。ただしこの公告は解任だけの文書ではなく、理事会が総会まで留任すること、辞任した2名の正理事の補充、事務総長の交代、事務次長の新任が同じ1枚に並んでいる。事務総長が辞表を出したのは10月5日、イタリアに1-3で負けた日で、審判委員会の委員長も10月4日に辞任していた。引き金になったのは2026-27ネーションズリーグAの4連敗で、4試合で2得点11失点、1試合2.75失点。2026年のワールドカップはすでに終わっており、トルコは出場して勝ち点3でグループ最下位だった。次に来るのは2027年のユーロ2028予選になる。モンテッラの在任は2023年9月21日から1,114日、3年18日で40試合21勝5分14敗。最後の4試合は全体の10%にすぎないが、3年ぶんの敗戦の28.6%がそこに入っている。解任の4日前、イタリア戦のあとの会見の見出しは「成長を続けて、我々が望む地点に到達する」だった。契約は2025年6月に2028年まで延長されており、そのとき会長は「近いうちにモンテッラをトルコ国籍にすることもできる」と言っていた。後任は発表されていない
  opening_image: assets/images/20261010_montella_out/06.jpg
