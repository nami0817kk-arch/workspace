# 取材メモ（10/10 題材 montella_out、型は news、その他枠）。材料の控えは research/raw/20261010_montella_out_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場の節を切り出す）。
# **一次情報はトルコサッカー連盟（TFF）公式の「Kamuoyuna Duyuru（公告）」2026年10月9日付**。
#   原文: "A Milli Takım Teknik Direktörümüz Sayın Vincenzo Montella ile devam etmeme kararı alınmıştır."
#   https://www.tff.org/default.aspx?pageID=285&ftxtID=51615
#   **この公告は解任だけの文書ではない**（材料 0）。同じ1枚に、理事会の留任、辞任した2名の正理事の補充、
#   事務総長の交代、事務次長の新任が並んでいる。**そこを①の切り口にした。報道はここを切り出していない。**
# **題材の前提の誤りを直した**（材料 2-5、5）：
#   **解任に「W杯予選」は関係ない。**2026年W杯は終わっていて、トルコは出場し、勝ち点3でグループ最下位。
#   引き金は **2026-27 ネーションズリーグA の4連敗**。次に来るのは2027年のユーロ2028予選。
#   台本では「W杯予選」という言葉を一度も使っていない。
# **ロマーノの投稿は確認できていない**（材料 8）ので、根拠は**連盟の公式発表**に置いた。記者の名前は出さない。
# **解任の4日前、最後の会見がTFF公式に残っている**（材料 3）。見出しは
#   「Gelişmeye Devam Ederek İstediğimiz Noktaya Geleceğiz（成長を続けて、我々が望む地点に到達する）」。
#   **その3日後に切られた**という形を②に置いた。
# 数字の食い違い（材料 7）の扱い：
#   ・解任の日付は **TFF公式の10月9日**（goal.com の「10月10日」は誤り）。
#   ・通算成績は **40試合21勝5分14敗**（Wikipedia と beIN Sports が一致）。「37試合」は採らない。
#   ・**違約金の約91万5000ユーロは報道の数字**で、TFF の公告には金額が書かれていない。④でそう言う。
#   ・W杯の敗退の言い方は**「勝ち点3でグループ最下位」の側に1つに決めた**（「最初に敗退した国」は混ぜない）。
#   ・後任は**発表されていない**。アルダ・トゥランの名前は**報道として**④で1度だけ触れ、断定しない。
#     トゥランの経歴（代表100試合以上）は裏を取っていないので**出さない**。
# 数字の重なり対策：『4試合』『2得点』『11失点』『2.75』は③だけ。『1,114日』『40試合』『1.70』は④だけ。
#   『91万5000ユーロ』も④だけ。
# 写真は記事の横長を先に当たった。02＝football-italia の og:image（ベンチで頬杖をついたモンテッラ、1200x800）。
#   facecrop は顔を見つけられなかったので `--center 0.52 --top 0` で手で切って 02_w / 02_v を作り、**目で見て確かめた**。
#   01（Commons、CC BY-SA 3.0 / Roberto Vicario、2012年、251x349）は**小さすぎて古いので使わない**。入れ替えは無し。
# サムネ：構図 number（最後の4試合が全敗）。
# ネットの反応は集めていない（材料の方針）。
