# ユニフォームとエンブレムの歴史 ノッティンガム・フォレスト（10/22 作成）。雛形は 10/21 ウェストハム回。
# 題の問い：フォレストの胸の木は、いつ、どうやって選ばれたのか（星2つは何を数えるのか）。
# 軸：①現行の紋章（木）は1973年の地元紙の公募で決まり、1974年に胸に付いた。応募800件超・優勝はデイヴィッド・ルイス・仕上げは当時の書記ケン・スメイルズ。クラフの発案という話は誤り（クラフの就任は1975-01-06）。
#    ②木の前は市の紋章（城をクラブの頭文字に替えた版）。付いた年は資料で割れる（ウィキペディア＝1947年／ユニフォーム史サイト＝1958年）。③赤＝1865年の集まりで「ガリバルディ・レッド」の房付き帽12個。④星2つ＝1979・1980の欧州王者（どちらも1対0）。⑤シャツの変遷と2026/27ホーム。
# 取材：2026-10-22。requests（ブラウザ User-Agent）とWebFetch。ブラウザ操作・JS実行・検索エンジンのAI要約は使っていない（WebSearch は題名とURLを探すのと、クラブ公式記事の裏取りのみ）。
#   読んだ：ウィキペディア en "Nottingham Forest F.C."／"History of Nottingham Forest F.C."／"Arsenal F.C."（Colours）／"Club Atlético Independiente"（色の節）。Historical Football Kits（historicalkits.co.uk、キット史の個人サイト。紋章の変遷と製造元）。クラブの公式ショップの商品説明（WebFetch、2026/27ホームシャツ）。
#   whatsbehindthebadge.com（個人ブログ。木が森・川の意味という説明は一次情報で確かめられず、台本に入れない）。
#   クラブ公式「Celebrating 50 years of The Tricky Tree」（nottinghamforest.co.uk/news/2023/april/14/…、2023-04-14）：サイトは表示時にAPIから本文を読む作りで、requests・WebFetch では本文が取れなかった（APIは認証が要るので触らない）。
#     本文の代わりに WebSearch の検索結果の要約で確かめた（2回、別の問い）：「2月にノッティンガム・ポスト紙が公募・応募800件超・4月にデイヴィッド・ルイス（コソールの若いデザイナー、ノッティンガム・ポリテクニックで働く）の案が優勝・当時の書記ケン・スメイルズと仕上げた・2023年4月に50周年、ルイスを招いて記念版を作った」。
#     **公式本文を自分の目で読めていない**ので、台本では「クラブは書く」と言い、確度は「報道」止まり。公開前に人が公式記事を開いて確かめる。
# ---- 一次情報・資料で確かめたこと（年は本文のまま）----
#   ・ウィキペディア(Forest)：1865年にClinton Armsで集まり（シンティの選手）、サッカーを選ぶ。同じ集まりで「twelve tasselled caps coloured 'Garibaldi Red'」を買うと決めた。クラブはシャツでなく帽子で区別した時代。
#     「The first club crest used by Forest was the city arms of Nottingham, which was first used on kits in 1947. The current club badge was introduced in 1974, following a competition in 1973 … winning design was by … David Lewis … The logo has been incorrectly reported as being the brainchild of manager Brian Clough. However, he did not arrive at the club until the following year. Forest have two stars above the club badge to commemorate its European Cup victories in 1979 and 1980.」
#     「1905 South America tour inspired Argentine club Independiente to adopt red」（Independiente の記事は採用を1908年とし、「Langone が Forest に熱中」説と「社会党の書記長が労働者の象徴として」説の2つを書く）。2026年8月に Marex が胸のスポンサーに確定（言わない＝一次情報で確かめていないため）。
#   ・ウィキペディア(History)：クラフ就任 1974ではなく **1975-01-06**（リーズの44日間のあと12週）。1979欧州杯決勝＝ミュンヘン・オリンピアシュタディオンでマルメに1対0（フランシスの後方での頭）、1980＝マドリード・サンティアゴ・ベルナベウでハンブルクに1対0（ロバートソン）。FA杯 1898・1959。
#   ・ユニフォーム史サイト：1958年に「大陸風」の新しいシャツと、ノッティンガム市の紋章の版（城をクラブの頭文字NFFCに替えた）／1949年の3部降格のころ「ロビン・フッドのような人物の風変わりな紋章」が数シーズン／1970年に紋章を直接刺繍／1974年3月ごろ新紋章／2008-09・2009-10は30周年で銀の刺繍の星／2015-16は150周年で深い赤に金の飾り・胸の広告なし／製造元：アディダス 1976-77〜1983-84、アンブロ 1984-85〜2010年代前半、アディダス 2012〜17、マクロン 2017〜23、アディダス 2023〜（年の区切りは資料により1年ずれる＝台本では「1970年代後半〜80年代前半」「2023年に復帰」までしか言わない）。
#   ・クラブの公式ショップ（2026/27 ホームシャツの商品説明）：「Inspired by the mist rising from the River Trent … tonal shades of red … Club crest … adidas」。
# ---- 食い違い（台本で断る）----
#   ・**市の紋章が胸に付いた年**：ウィキペディア＝1947年／ユニフォーム史サイト＝1958年の版（城をNFFCに替えた）。
#   ・**新紋章の年**：公募は1973年、胸に付いたのは1974年（ウィキペディア）／ユニフォーム史サイトは「1974年3月ごろ」。応募数はクラブ公式の要約で「800件超」、別の資料は855件→「800件を超える」と言う。
#   ・**ルイスの肩書**：クラブ公式の要約＝ポリテクニックで働く若いデザイナー／ウィキペディア＝グラフィックデザインの講師→「ポリテクニックで働くデザイナー」と言う。
#   ・言わなかったもの：星がいつ紋章に付いたか（確かめられず）／木が何を表すか（一次情報なし）／著作権登録のために替えたという説（二次情報のみ）／アーセナルへの赤シャツの贈り物（別の回で扱っているため重ねない）／スポンサー名・契約額／ブライアン・クラフの人柄。
# ---- 自分で数えた数 ----
#   2026-1974=52年（現行の紋章）。2026-1865=161年（赤）。52÷161=0.32（およそ3分の1）。1979-1974=5年・1980-1974=6年（木が付いて星2つがそろうまで）。1980-1979=1年で連覇。
# ---- 日本との接点 ----
#   調べたが無し（ウィキデータで日本代表歴のあるフォレスト所属選手は0。pl_data の登録選手にも日本人なし）。無理に入れない。
# ---- 写真（assets/images/20261022_kit_forest/、出典は credits.json）----
#   Commons の CC BY / CC BY-SA / 著作権切れのみ。シティ・グラウンド・ガリバルディの肖像（著作権切れ）・オリンピアシュタディオン・ベルナベウ。代理店の写真は使っていない。人物は特定していない。
#   エンブレムは assets/crests/ノッティンガムフォレスト.png・節の頭の差し込み assets/backgrounds/cut_ノッティンガムフォレスト.png（権利は晴れていない＝引き受ける危険）。
