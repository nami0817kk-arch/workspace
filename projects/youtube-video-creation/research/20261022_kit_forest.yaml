- id: view
  viewpoint: true
  heading: 見立て・胸の木は、赤と比べて、どれだけ長いのか
  bg: assets/images/20261022_kit_forest/f01_city_ground.jpg
  tier: 報道
  telop: 木は52年、赤は161年。木のおよそ3倍。星2つは、木が付いて6年でそろった
