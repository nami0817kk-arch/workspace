  - text: 当時の欧州一を決める、ヨーロピアンカップ。
    image: assets/images/20261022_kit_forest/f03_olympiastadion.jpg
    card: none
  - text: いまの欧州一の大会、その前の姿です。
    image: assets/images/20261022_kit_forest/f03_olympiastadion.jpg
    card: none
  - text: 1979年の決勝は、ミュンヘン。スウェーデンのマルメに、1対0の勝ち。
    image: assets/images/20261022_kit_forest/f03_olympiastadion.jpg
    card:
      <<: *id_stars
      highlight_row: 0
  - text: 決めたのは、フランシス。ロバートソンのクロスに、後ろから頭で合わせました。
    image: assets/images/20261022_kit_forest/f06_olympia_seats.jpg
    card: none
  - text: 1980年は、マドリード。ハンブルクに、また1対0の勝ち。
    image: assets/images/20261022_kit_forest/f04_bernabeu.jpg
    card:
      <<: *id_stars
      highlight_row: 1
  - text: 決めたのは、ロバートソン。バートルズとのパス交換から、決めました。
    image: assets/images/20261022_kit_forest/f04_bernabeu.jpg
    card: none
  - text: 2回の決勝は、どちらも、1点差の勝ちでした。
    emph: true
    image: assets/images/20261022_kit_forest/f04_bernabeu.jpg
    card: none
  - text: 木から最初の星まで、5年です。
    image: assets/images/20261022_kit_forest/f07_clough_stand.jpg
    card: &id_gap
      type: calc
      title: 木が付いてから、最初の星まで（自分で引いた）
      terms:
      - - 1979年
        - 最初の欧州王者
      - - 1974年
        - 木が胸に付いた年
      - - 5年
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 2つ目の星までは、6年です。
    image: assets/images/20261022_kit_forest/f07_clough_stand.jpg
    card: *id_gap
  - text: 2008/09と2009/10は、30周年の記念。
    image: assets/images/20261022_kit_forest/f05_main_stand.jpg
    card: none
  - text: 星が、銀の刺繍になりました。
    image: assets/images/20261022_kit_forest/f05_main_stand.jpg
    card: none
  - text: 星が紋章に付いた年は、調べた範囲では、確かめられませんでした。
    image: assets/images/20261022_kit_forest/f01_city_ground.jpg
    card: none
