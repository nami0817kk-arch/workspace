- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 5位の好発進と、降格圏から残した監督
  narrator: キャスター
  say:
  - text: 今シーズンは7試合を終えて、勝ち点**13**の5位です。
    image: assets/stats/ll_sevilla_data_r1.png
    no_telop: true
  - text: 率いるのは、3月に来たルイス・ガルシア監督。こう話しています。
    image: assets/stats/ll_sevilla_data_r2.png
    no_telop: true
  - voice: ルイス・ガルシア・プラサ
    text: 夢のような出だしだ。ただ、リーグはとても厳しい
    image: assets/stats/ll_sevilla_data_r2.png
  - text: 昨シーズンは残り5試合で、降格圏の18位。そこから3連勝で残しました。
    image: assets/stats/ll_sevilla_data_r2.png
    no_telop: true
  - text: 2005年には、100年の節目に作られた応援歌が、国内の売り上げで1位になりました。
    image: assets/stats/ll_sevilla_data_r3.png
    no_telop: true
  - text: そしてその歌ができた翌年から、ヨーロッパリーグを**7度**制しています。
    image: assets/stats/ll_sevilla_data_r3.png
    no_telop: true
  - image: assets/stats/ll_sevilla_data0.png
    text: 創立の日は、スコットランドの詩人をしのぶ夜。カフェに集まった若者たちが作りました。
    no_telop: true
  - image: assets/stats/ll_sevilla_data1.png
    text: 愛称はネルビオネンセス。本拠地のある、ネルビオン地区から来た呼び名です。
    no_telop: true
  - image: assets/stats/ll_sevilla_data2.png
    text: ホームタウンはセビリア。アンダルシア州の州都で、スペインで**5番目**に大きな町です。
    no_telop: true
  - image: assets/backgrounds/stadium_セビージャ.png
    text: 本拠地はラモン・サンチェス・ピスフアン。**4万3000人**あまりが入ります。
  - image: assets/stats/ll_sevilla_data4.png
    text: 会長はホセ・マリア・デル・ニド・カラスコ。クラブは株式会社で、株主が会長を選びます。
    no_telop: true
  - image: assets/stats/ll_sevilla_cups.png
    text: 1部優勝**1回**、国王杯**5回**、スーペルコパ**1回**。ヨーロッパリーグ**7回**、欧州スーパーカップ**1回**。
    no_telop: true
  - image: assets/stats/ll_sevilla_data6.png
    text: 最多出場は地元育ちのヘスス・ナバス。2024年までに、**705試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_sevilla_data7.png
    text: 直近のタイトルは2023年のヨーロッパリーグ。ローマとの決勝を、ピーケー戦で制しました。
    no_telop: true
  - image: assets/stats/ll_sevilla_data8.png
    text: 昨シーズンは**13位**。降格したマジョルカとは、勝ち点**1**の差でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Sevilla_FC
