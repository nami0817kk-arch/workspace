  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: history
  heading: 初代会長は副領事
  tier: 背景
  telop: 初代会長は、スコットランド生まれの副領事
  narrator: 解説
  card:
    type: table
    title: 初代会長
    columns:
    - ''
    - ''
    rows:
    - - 名前
      - エドワード・ジョンストン
    - - 仕事
      - 英国の副領事と船会社
    - - 運んだもの
      - セビリアのオレンジ
  say:
  - 初代会長は、スコットランド生まれのエドワード・ジョンストン。英国の副領事でした。
  - 本業は船会社で、セビリアの苦いオレンジを、スコットランドへ運んでいました。
  - 向こうでマーマレードの原料になる、あのオレンジです。
  sources:
  - https://en.wikipedia.org/wiki/Edward_F._Johnston
  - https://en.wikipedia.org/wiki/Sevilla_FC
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: history2
  heading: スペイン最初の公式戦
  tier: 背景
  telop: スペイン最初の公式戦に、2対0で勝つ
  narrator: 解説
  card:
    type: table
    title: 1890年3月8日
    columns: &id001
    - ''
    - ''
    rows:
    - - 相手
      - ウエルバのクラブ
    - - 笛を吹いた人
      - セビージャの会長
  say:
  - 創立の年の3月、ウエルバのクラブを招いて、スペインで最初の公式戦を行います。
  - 笛を吹いたのは、なんと自分たちの会長のジョンストン。
  - text: 左ウイングはパジャマのような服で現れて笑われ、その選手もゴールを決めました。
    card:
      type: table
      title: 1890年3月8日
      columns: *id001
      rows:
      - - 結果
        - 2対0で勝利
  - 結果は**2対0**。スペインのサッカーで、最初に勝ったチームになりました。
  sources:
  - https://en.wikipedia.org/wiki/First_official_football_match_in_Spain
  - https://en.wikipedia.org/wiki/Edward_F._Johnston
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: history3
  heading: ただ一度のリーグ優勝
  tier: 背景
  telop: 攻撃陣は「スツーカ」。1946年にリーグ優勝
  narrator: 解説
  card:
    type: table
    title: ただ一度のリーグ優勝
    columns:
    - ''
    - ''
    rows:
    - - 内戦のあと
      - 攻撃陣は「スツーカ」
    - - 4シーズンで
      - 216得点
    - - 1945-46
      - 初めてのリーグ優勝
  say:
  - 内戦のあと、攻撃陣はドイツの急降下爆撃機になぞらえて「スツーカ」と呼ばれます。
  - 4シーズンで**216得点**。バルセロナに、**11対1**で勝った試合もあります。
  - そして1945年から46年のシーズン、バルセロナを勝ち点1差でかわして初優勝。
  sources:
  - https://en.wikipedia.org/wiki/Sevilla_FC
  - https://es.wikipedia.org/wiki/Sevilla_F%C3%BAtbol_Club
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: history4
  heading: 決勝は7戦7勝
  tier: 背景
  telop: ヨーロッパリーグの決勝は、7戦7勝
  narrator: 解説
  card:
    type: table
    title: 決勝は7戦7勝
    columns: &id002
    - ''
    - ''
    rows:
    - - 2006年
      - 初優勝。ミドルズブラに4対0
    - - 2014〜16年
      - 大会ただ一つの3連覇
  say:
  - ヨーロッパの初タイトルは2006年。ミドルズブラに**4対0**で勝ちました。
  - 当時の名前はウエファカップ。クラブにとって、58年ぶりの主要タイトルでした。
  - text: 2014年からは、この大会でただ一つの**3連覇**。
    card:
      type: table
      title: 決勝は7戦7勝
      columns: *id002
      rows:
      - - 2023年
        - 7回目の優勝
  - 決勝に出た**7回**は、ひとつも負けていません。
  sources:
  - https://en.wikipedia.org/wiki/Sevilla_FC
  - https://en.wikipedia.org/wiki/2023_UEFA_Europa_League_final
  - https://en.wikipedia.org/wiki/UEFA_Europa_League
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 球際に強い。見つけて売る。アンダルシアの盟主
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 球際に強い
    - - 運営の型
      - 見つけて、売る
    - - クラブの気質
      - アンダルシアの盟主
  say:
  - text: ルイス・ガルシア監督のチームは、球際に強い。競り合いとボール奪取で、リーグの先頭です。
    image: assets/photos/ll/sevilla/sevilla_manager_46745b5c.jpg
  - ピッチの外は、見つけて売る型。
  - 強化部長だったモンチは、世界に**700人**を超えるスカウト網を作りました。
  - 移籍で出した利益は、およそ**2億ユーロ**です。
  - そしてアンダルシアの盟主。国際タイトルを持つのは、州でここだけです。
  sources:
  - https://en.wikipedia.org/wiki/Sevilla_FC
  - https://www.diariodesevilla.es/sevillafc/ecuacion-complica-sevilla-garcia-plaza-laliga_0_2008056663.html
  - https://en.wikipedia.org/wiki/Monchi
  - https://sevillafc.es/el-club/la-entidad/sevilla-fc
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
- id: episode
  heading: 100周年の歌
  tier: 背景
  telop: 100周年の歌が、シングル売り上げ1位に
  narrator: 解説
  card:
    type: table
    title: 100周年の歌
    columns: &id003
    - ''
    - ''
    rows:
    - - 2005年
      - 歌手エル・アレバトが作る
    - - 100年の数え方
      - 1905年の届け出から
  say:
  - text: 2005年、歌手のエル・アレバトが、クラブの100周年を祝う歌を作りました。
    image: assets/images/ll_sevilla_episode/scene.jpg
  - 100年は、クラブを役所に正式に届け出た1905年から数えたものです。
  - text: スペインのシングル売り上げで**1位**。サッカークラブの歌で、いちばん売れました。
    card:
      type: table
      title: 100周年の歌
      columns: *id003
      rows:
      - - 売り上げ
        - スペインのシングル1位
      - - 呼び名
        - お守りの歌
  - ファンのあいだでは、いまも「お守りの歌」と呼ばれています。
  - 発表の次のシーズンから、欧州のタイトルを重ねたためです。
  sources:
  - https://en.wikipedia.org/wiki/Sevilla_FC
  - https://es.wikipedia.org/wiki/Sevilla_F%C3%BAtbol_Club
  bg: assets/backgrounds/stadium_セビージャ_in.png
  official: false
