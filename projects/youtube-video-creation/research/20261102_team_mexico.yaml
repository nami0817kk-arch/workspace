  say:
  - text: 見立てに入ります。自国開催の3大会を、並べます。
    image: assets/images/20261102_team_mexico/b01_opening.jpg
    card: none
  - text: 1970年は4試合で2勝。6点取って、4点を失いました。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 1986年は5試合で3勝。6点取って、失点は2。
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 2026年は5試合で4勝。取った点は10、失った点は3。
    card:
      <<: *id_vp
      highlight_row: 2
  - text: 1試合あたりでは、得点は1.50、1.20、2.00。2026年がいちばん多い。
    mark:
      kind: circle
      row: 2
      col: 3
    card:
      <<: *id_vp
      highlight_row: 2
  - text: 失点も0.60。0.40の1986年に次ぐ少なさです。
    emph: true
    mark:
      kind: circle
      row: 2
      col: 4
    card:
      <<: *id_vp
      highlight_row: 2
  - text: その3失点は、すべて16強のイングランド戦でした。ほかの4試合は、無失点です。
    image: assets/images/20261102_team_mexico/b02_w/01.jpg
    card: none
  - text: 36分と38分に2点を取られ、60分にはPKで3点目。
    card: none
  - text: 2対3の負けで、アステカでのワールドカップ初黒星でした。
    card: none
  - text: 数字は過去最高でも、勝ち上がりは1試合で止まる。
    card: none
  - text: 8強に届かなかった理由は、あの1試合の3失点です。
    card: none
  - text: 次の確かめは、北中米のネーションズリーグ。準々決勝です。
    image: assets/images/20261102_team_mexico/pair_coach/01.jpg
    card: none
  - text: 11月14日にジャマイカ、17日に国内で戦います。
    card: none
  - text: 失点が止まるのか。そこが、マルケスのメキシコの最初の分かれ目です。
