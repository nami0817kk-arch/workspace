# 代表チーム紹介 メキシコ代表（11/2 作成。固定シリーズ9「代表チーム紹介」。見本は 10/29 のベルギー代表 scripts/20261029_team_belgium.md）。7節：フック→基礎DATA（板）→日本との関係（早い節へ）→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **軸（2026-10-31）**：「2026年W杯で自国開催のメキシコは5試合4勝・10得点3失点と、1大会の得点も勝利数も過去最多だった。それでも16強で止まり、1970年・1986年の8強に届かなかった。数字は過去最高なのに、なぜか」。答えは見立ての節（自国開催3大会の1試合あたりの得点・失点を自分で割って比べる。3失点は16強のイングランド戦だけ）。
# **日本との接点**：国際Aマッチ7試合、日本から見て1勝1分5敗（日本の勝ちは1996年のキリンカップ3対2だけ。2005年・2013年はコンフェデ杯で1対2）。もう1つ、2026年W杯でメキシコを率いたアギーレは2014〜15年の日本代表監督。基礎DATAの次の節に置いた。
# **重なりの確認（2026-10-31）**：scripts/・research/covered.yaml・research/posted.json を grep。メキシコ代表の「紹介」回・メキシコが主役の回は無い（scripts にメキシコが出るのは、ほかの回の脇の言及だけ）。代表チーム紹介の既出はエクアドル・ニュージーランド・ブラジル・ドイツ・スペイン・アルゼンチン・フランス・イングランド・ポルトガル・オランダ・ウルグアイ・ベルギー（11/2 の担当は 10/31 のスウェーデンと重ならない）。クロアチア代表は日本との対戦（2022年W杯16強でPK負け）で強いが、10/4 に「イングランド戦0対7」の本編・ショート（england_croatia）を出していて直近30日に重なるので外した。
# ---- 確かめたこと（2026-10-31。WebFetch の要約は使わず、requests で Wikipedia の生の wikitext を読んだ）----
#  ・FIFAランク：10位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026、Mexico 10・前回比0・1738.48）。日本は17位（同じ表）。**FIFA 公式の2026年10月分は取れなかった**（inside.fifa.com は2025年10月までの履歴しか返さず、ranking-overview の API は空）。点数は書かない。
#  ・W杯：1930年から出場（出場17大会＋2026年）。最高は1970年と1986年の8強（Mexico at the FIFA World Cup「Best Result」・Overall record の表）。**自国開催は1970・1986・2026年**（表で赤い枠）。
#  ・Mexico at the FIFA World Cup の表：1970年 8強・4試合2勝1分1敗・6得点4失点／1986年 8強・5試合3勝2分0敗・6得点2失点（準々決勝は西ドイツと0対0、PK戦1対4）／2026年 16強・5試合4勝0分1敗・10得点3失点。1994〜2018年の7大会はすべて16強（表）。2022年は1次リーグ敗退（1978年大会以来。Mexico national football team 2020s の本文）。本文「Since they finished in the quarter-finals in 1986, Mexico have failed to advance beyond the round of 16」。
#  ・自分で割った（検算した）：1970年 6÷4=1.50・4÷4=1.00／1986年 6÷5=1.20・2÷5=0.40／2026年 10÷5=2.00・3÷5=0.60。1大会の得点は表の最多が1998年の8（4試合）で、2026年の10が最多。勝利数は表の最多が1986年の3で、2026年の4が最多。
#  ・2026年W杯の5試合（Mexico national football team の試合一覧。16強は 2026 FIFA World Cup knockout stage で突き合わせ）：6/11 南アフリカ2-0（キニョネス9分・ヒメネス67分）、6/18 韓国1-0（ロモ50分）、6/24 チェコ3-0（M.チャベス55分、キニョネス61分、フィダルゴ90+4分）、6/30 32強 エクアドル2-0（キニョネス22分、ヒメネス31分）、7/5 16強 イングランド2-3（アステカ。ベリンガム36分・38分、ケイン60分PK／キニョネス42分、ヒメネス69分PK。イングランドは54分に退場者）。3失点はすべてイングランド戦、ほかの4試合は無失点。キニョネスが4点・ラウール・ヒメネスが3点（10点の中身）。
#  ・knockout stage の本文：メキシコがW杯の試合をアステカで落としたのは初めて、自国開催で8強に届かなかったのも初めて（1970年・1986年の大会に及ばなかった）。
#  ・監督：ラファエル・マルケス（Rafael Márquez の記事・Mexico national football team の Coaching staff、updated 28 August 2026）。2026年7月8日に就任（前任はアギーレ。アギーレの記事の Managerial statistics で Mexico 2024-07-22〜2026-07-07）。選手としてメキシコ代表147試合17得点（記事の表）、バルセロナでCL2度優勝（2005-06・2008-09。Honours）。監督としては4試合0勝2分2敗・2得点7失点（Managerial record、match played 6 October 2026）。
#  ・アギーレ：2026年9月23日からバレンシアの監督（記事本文）。2014年8月に日本代表の監督に就き、2015年アジアカップは1次リーグ3戦全勝（7得点0失点）で準々決勝UAE戦で敗退（記事の Japan 節）。
#  ・主将：ヨハン・バスケス（Current squad の印 captain。ジェノア、DF、1998-10-22=28歳、53試合3得点）。名簿の数字は「Caps and goals correct as of 6 October 2026」。2026-10-30 時点の年齢（生年月日から計算）：バスケス28、サンティアゴ・ヒメネス（ポルト、FW、2001-04-18）25・54試合6得点、ピネダ（モンテレイ、MF、1996-03-24）30・97試合12得点、フィダルゴ（ベティス、MF、1997-04-09）29、バルガス（アトレティコ・マドリード、MF、2005-08-05）21、キニョネス（アル・カーディシーヤ、FW、1997-03-24）29（Recent call-ups。最後の招集は2026年W杯）、ラウール・ヒメネス（1991-05-05）35。
#  ・愛称：El Tri / El Tricolor（infobox）。
#  ・W杯のあと（親善試合。Mexico national football team の試合一覧でスコア・場所を確認）：9/26 コロンビア1-1（ボルチモア。モラ62分／スアレス9分）、9/29 ペルー1-1（ニュージャージー）、10/3 アメリカ0-3（グレンデール）、10/6 チリ0-2（ロサンゼルス）＝0勝2分2敗・2得点7失点（マルケスの Managerial record と一致）。次は 11/14 ジャマイカ（キングストン）、11/17 メキシコ（グアダルーペ）＝CONCACAFネーションズリーグ A 準々決勝（2試合）。
#  ・日本との対戦：国際Aマッチ7試合、日本から見て1勝1分5敗・6得点11失点（Japan national football team records and statistics の Head-to-head：MEX 1996–2025 7・1・1・5・6・11）。試合は Japan national football team results の各表：1996-05-29 キリンカップ 3-2（福岡）／1998-05-31 親善試合 1-2（ローザンヌ）／2000-02-05 旧正月カップ 0-1（香港）／2005-06-16 コンフェデ杯 1-2（ハノーバー）／2013-06-22 コンフェデ杯 1-2（ベロオリゾンテ）／2020-11-17 親善試合 0-2（グラーツ）／2025-09-06 親善試合 0-0（オークランド）。
# ---- 言わないもの ----
#  ・怪我／出場停止（名簿の印）／私生活／背番号／戦術の説明／監督の契約の金額／アギーレの日本代表契約が終わった事情（事実の言い切りができないので、就任とアジアカップの成績だけ）／オチョアの代表引退（名簿の表記が曖昧）。
