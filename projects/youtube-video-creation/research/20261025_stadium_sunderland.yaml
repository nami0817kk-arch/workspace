    - いつまでも輝かせる
  say:
  - text: 建てているあいだは、正式な名前が無いままでした。
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card: none
  - text: 「ウェアサイド・スタジアム」や、「新しいローカー・パーク」と呼ばれていました。
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card: none
  - text: 名前の発表は、開場の日。アヤックスとの試合の、数時間前です。
    emph: true
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card: none
  - text: 名付けたのは、当時のボブ・マレー会長。命名式で、こう話しています。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: *id_name
  - text: 長い年月、ウェアマス炭鉱の坑夫たちは、デイビー・ランプを持ち歩いた。
    emph: true
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: *id_name
  - text: この名前は、その光の姿を、いつまでも輝かせる。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: *id_name
  - text: デイビー・ランプは、炭鉱で使われた、安全灯のことです。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: none
  - text: 本拠地のそばには、炭鉱の巻き上げ車輪も、置かれています。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: none
  - text: ただ、ファンの反応は、分かれました。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: ポルトガルのベンフィカの本拠地と、同じ名前に聞こえたからです。
    emph: true
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: マレーは、2017年に、こう答えています。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: &id_name2
      type: document
      label: ボブ・マレー　2017年のインタビュー（英文の引用を訳した）
      paragraphs:
      - ポルトガルのエスタディオ・ダ・ルスは、スタジアム・オブ・ライトではない。ルスという地域にちなんだ名前だ。
      - その名前の本拠地を持つクラブは、私たちだけだ。この地域の歴史から、私が名付けた。
      highlight:
      - 地域にちなんだ名前
      - 私たちだけ
  - text: ベンフィカの本拠地は、ルスという地域の名前。この名前の本拠地は、私たちだけだ、と。
    emph: true
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: *id_name2
  - text: いま、「オブ・ライト」は、練習場のアカデミー・オブ・ライトにも、使われています。
    image: assets/images/20261025_stadium_sunderland/01_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Stadium_of_Light
- id: view
  viewpoint: true
  heading: 見立て・4万8095席は、開場以来いちばんの埋まり方に、届くのか
  bg: assets/images/20261025_stadium_sunderland/01_w.jpg
  tier: 報道
  telop: 昨季の平均4万6704人は、開場以来の最高まで86人。今季は3試合で4万6946人
  narrator: 解説
  card: &id_view
    type: table
    title: ホームのリーグ戦の平均入場
    columns:
    - 区切り
    - 平均入場
    rows:
    - - 2000/01（プレミア）
      - 4万6790人（開場以来の最高）
    - - 2003/04（2部）
      - 2万7119人（開場以来の最低）
    - - 2018/19（3部）
      - 3万2156人
    - - 2025/26（プレミア）
      - 4万6704人
    - - 2026/27 ここまで 3試合
      - 4万6946人
    highlight_row: 0
  say:
  - text: では、この本拠地は、毎試合どれだけ埋まっているのか。
    emph: true
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: 開場以来、シーズン平均の最高は、2000/01の4万6790人です。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card:
      <<: *id_view
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: いちばん少なかったのは、2部にいた2003/04。2万7119人。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card:
      <<: *id_view
      highlight_row: 1
  - text: 3部にいた2018/19でも、平均は3万2156人。3部の記録でした。
    emph: true
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      <<: *id_view
      highlight_row: 2
  - text: 昨季、2025/26は、4万6704人。収容の97.1％です。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      <<: *id_view
      highlight_row: 3
  - text: 開場以来の最高まで、あと86人でした。
    emph: true
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      type: calc
      title: 最高の平均との差（自分で引いた）
      terms:
      - - 4万6790人
        - 2000/01の平均
      - - 4万6704人
        - 2025/26の平均
      - - 86人
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 今季は、ホームのリーグ戦3試合で、平均4万6946人。
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card:
      <<: *id_view
      highlight_row: 4
  - text: まだ3試合ですが、最高の平均を、156人上回っています。
    emph: true
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card: none
  - text: そして、2026年9月16日。ヨーロッパリーグの、オランダのアルクマール戦です。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: この本拠地で初めての、ヨーロッパの大会の公式戦でした。
    emph: true
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: 入場は4万5555人。結果は、1対0の勝利でした。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: クラブの欧州の大会は、ローカー・パーク時代の1973/74以来です。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card: none
  - text: 入場の記録は、2002年4月13日のリヴァプール戦。4万8353人。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card: none
  - text: いまの収容より、258人多い数字です。
    emph: true
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card: none
  - text: 開場から30シーズン目。平均の最高を塗り替えるかどうかが、今季の見どころです。
    image: assets/images/20261025_stadium_sunderland/01_w.jpg
    card: none
