- id: japan
  heading: なぜ、最初の候補地だった日産の工場のとなりに、建たなかったのか
  bg: assets/images/20261025_stadium_sunderland/01_w.jpg
  tier: 背景
  telop: 1992年、日産の工場のとなりに新しい本拠地の案。日産が正式に異議を出し、クラブはあきらめた
  narrator: 解説
  card: &id_jp
    type: timeline
