- id: roker
  heading: なぜ、100年近く使ったローカー・パークを、出なければならなかったのか
  bg: assets/images/20261025_stadium_sunderland/01_w.jpg
  tier: 背景
  telop: 1898年から1997年までの本拠地。最多7万5118人。全席座席にすると、席が大きく減った
  narrator: 解説
  card: &id_roker
