    focus: 1898年9月
    highlight_row: 0
  say:
  - text: 古い本拠地は、ローカー・パーク。1898年9月10日に開きました。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      <<: *id_roker
      highlight_row: 0
  - text: 1933年3月4日、FAカップの試合に、7万5118人が入っています。
    emph: true
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      <<: *id_roker
      highlight_row: 1
  - text: いまの本拠地の収容の、約1.56倍です。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      type: calc
      title: 旧本拠地の最多入場は、いまの収容の何倍か（自分で割った）
      terms:
      - - 7万5118人
        - 1933年の最多入場
      - - 4万8095人
        - いまの収容
      - - 1.56倍
        - 割った答え
      ops:
      - ÷
      - ＝
  - text: 1990年、スタジアムの安全を見直した、テイラー報告が出ます。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card:
      <<: *id_roker
      highlight_row: 2
  - text: 全部の席を、座席にすることが、求められました。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: 立ち見が中心のローカー・パークは、座席にすると、席が大きく減ります。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: まわりは住宅の道に囲まれ、広げる場所も、ありませんでした。
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: 最後のころの収容は、約2万2500人。いまの本拠地は、その約2.1倍です。
    emph: true
    image: assets/images/20261025_stadium_sunderland/02_w.jpg
    card: none
  - text: 1996/97が、最後のシーズン。クラブにとって、初めてのプレミアの季でした。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card:
      <<: *id_roker
      highlight_row: 3
  - text: お別れの試合のあと、名選手のチャーリー・ハーリーが、芝を掘り起こします。
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card: none
  - text: ピッチの真ん中の芝です。それは、新しい本拠地に植えられました。
    emph: true
    image: assets/images/20261025_stadium_sunderland/06_w.jpg
    card: none
  - text: 古いメインスタンドの鉄の格子も、いまの本拠地の駐車場の仕切りに、残っています。
    emph: true
    image: assets/images/20261025_stadium_sunderland/05_w.jpg
    card: none
  - text: このスタンドを設計したのは、建築家のアーチボルド・リーチ。
    image: assets/images/20261025_stadium_sunderland/05_w.jpg
    card: none
  - text: 跡地は住宅になり、道には「昇格」「時計のスタンド」といった名前が付きました。
    image: assets/images/20261025_stadium_sunderland/05_w.jpg
    card: none
