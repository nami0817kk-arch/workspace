    - - 1986年
      - 工場で最初の車、ブルーバード
    - - 1992年
      - 工場のとなりに新球場の案。日産が異議
    - - 1993年12月
      - ウェアマス炭鉱が閉山
    - - 1995年
      - 炭鉱の跡地が、第一の候補に
    - - 1997年7月
      - スタジアム・オブ・ライトが開場
    focus: 1992年
    highlight_row: 0
  say:
  - text: 次は、この本拠地の場所と、日本の会社の話です。
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card: none
  - text: 1990年代のはじめ、クラブは、古い本拠地を出て、新しい土地を探していました。
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card: none
  - text: 1984年、日産が、イギリスの工場の土地に、サンダーランドを選びました。
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card:
      <<: *id_jp
      highlight_row: 0
  - text: 1986年、その工場で、最初の車、ブルーバードが作られます。
    image: assets/images/20261025_stadium_sunderland/07_w.jpg
    card:
      <<: *id_jp
      highlight_row: 1
  - text: 古い本拠地を出ると決めたクラブが、最初に選んだ候補地は、この工場のとなりでした。
    emph: true
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card:
      <<: *id_jp
      highlight_row: 2
  - text: ファンは、その案を「北のウェンブリー」と呼びました。
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card: none
  - text: ところが、1992年に案が出ると、すぐに日産が、正式に異議を出します。
    emph: true
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card:
      <<: *id_jp
      highlight_row: 2
  - text: クラブは、この案を、あきらめました。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card: none
  - text: 次の候補は、1993年12月に閉山した、ウェアマス炭鉱の跡地。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card:
      <<: *id_jp
      highlight_row: 3
  - text: 1995年には、ここが、第一の候補になります。
    image: assets/images/20261025_stadium_sunderland/03_w.jpg
    card:
      <<: *id_jp
      highlight_row: 4
  - text: 古い本拠地から、わずか数百メートルの場所でした。
    image: assets/images/20261025_stadium_sunderland/01_w.jpg
    card: none
  - text: 日本の会社の異議が、本拠地を、炭鉱の跡へ向かわせたことになります。
    emph: true
    image: assets/images/20261025_stadium_sunderland/01_w.jpg
    card: none
  - text: 1997年7月30日、炭鉱の跡に、4万2000席で開場します。
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card:
      <<: *id_jp
      highlight_row: 5
  - text: 2000年には4万9000席へ。開場のときより、7000席多くなりました。
    image: assets/images/20261025_stadium_sunderland/04_w.jpg
    card: none
