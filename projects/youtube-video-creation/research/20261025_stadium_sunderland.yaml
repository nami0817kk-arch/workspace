# スタジアム紹介シリーズ：サンダーランドの本拠地（スタジアム・オブ・ライト、10/25）。雛形は 10/24 フラムの回。
# 重なりの確認（2026-10-25）：scripts/・research/covered.yaml・research/posted.json に stadium_sunderland は無い。
#   クラブ紹介⑲サンダーランド（2026-09-20 公開）は、本拠地を「炭鉱の跡地・紋章の輪は巻き上げ機」の1行と、収容4万8095の1行、EL初戦の1対0だけ。
#   名前の由来・日産・ローカー・パーク・入場の推移は言っていない。stadium_newcastle（10/21）は「8位はサンダーランド」の1行だけ。
# 今の立場：PL公式ハンドブック2026/27 の Club Directory にサンダーランドがある（控え research/raw/20261021_nufc_plhandbook.txt 1679〜1775行）。
#   2025/26 は7位（同 32829行）。2026/27 はプレミア2季目＋ヨーロッパリーグ（ウィキペディア en "2026–27 Sunderland A.F.C. season"、控え 20261025_sl_wp_season2627.txt）。
# 軸：A＝収容4万8095人はプレミア20クラブで8位（ハンドブック）。
#     B＝なぜ「光のスタジアム」か。炭鉱の跡地とデイビー・ランプ。その前に、日産の工場のとなりの案が日産の異議で消えた。
#     C＝昨季の平均4万6704人は、開場以来の最高（2000/01 の4万6790人）まで86人。今季は3試合で4万6946人。9/16 に開場以来初の欧州の公式戦。
# 収容・ピッチ（ハンドブック 1740〜1743行）：48,095／105×68m。ランキング：7位ニューカッスル 52,729／9位チェルシー 40,044／1位マンU 74,158。
#   自分で引いた・割った：52,729-48,095=4,634／48,095-40,044=8,051／48,095÷74,158=0.649＝約65％／49,000-48,095=905。
# 本拠地（ウィキペディア en "Stadium of Light"、控え research/raw/20261025_sl_wp_stadium.txt。元は公式の歴史本 Days ほか）：
#   開場 1997-07-30（アヤックスと0対0の親善）／開場時 42,000 → 2000年に北スタンド増築で 49,000／建設中は「ウェアサイド・スタジアム」「ニュー・ローカー・パーク」／
#   命名は 1997-07-30 の命名式、ボブ・マレー会長。言葉（引用）："For many years, miners at Wearmouth Colliery carried with them a Davy lamp as part of their working lives. Reflecting this tradition, the name allows the image of this light to shine forever."／
#   ベンフィカの本拠地と同じ名前だとファンの反応は割れた。マレーの2017年の言葉："The Estadio de Luz in Portugal isn't the Stadium of Light, it is named after the area – Luz. … We are the only club whose stadium has that name, and it was because of the history of the region that I named it"／
#   練習場 Academy of Light など「オブ・ライト」が広がった／
#   候補地：1992年に日産の工場のとなりの案（ファンは「北のウェンブリー」）→ 発表の直後に日産が正式に異議、クラブはあきらめた／1995年までに、1993年12月に閉山したウェアマス炭鉱の跡が第一候補。ローカー・パークから数百ヤード／
#   ローカー・パークのリーチの格子は西の駐車場の仕切りに使われている／
#   入場：最多 48,353（2002-04-13 リヴァプール戦）／シーズン平均の最高 46,790（2000/01、プレミア）／最低 27,119（2003/04、2部）／2018/19 は3部で 32,156、3部の記録。
#   割れる点：①収容はウィキペディア49,000・ハンドブック48,095・UEFA の試合データの capacity 48,707 → 台本はハンドブックで言い、増築後の4万9000と並べて「今季はそれより905少ない」とだけ言う。
#     ②日産の案の席数（4万8000／4万9000で記事どうしが割れる）→ 言わない。③広げられる上限（6万3000／6万4000／8万4000）→ 言わない。④費用（2300万／2400万ポンド）→ 言わない。
# 日産（ウィキペディア en "Nissan Motor Manufacturing UK"、控え 20261025_sl_wp_nmuk.txt）：1984年2月に英政府と工場の合意、翌月サンダーランドの土地を選ぶ／1986年7月に第1期が完成、最初の車はブルーバード。
# 旧本拠地（ウィキペディア en "Roker Park"、控え 20261025_sl_wp_roker.txt）：開場 1898-09-10／1929年 リーチ設計のメインスタンド／最多 75,118（1933-03-04 FAカップ）／
#   テイラー報告で全席座席にすると席が大きく減る・まわりが住宅の道で広げられない／最後のころの収容 約22,500／1996/97 が最後で、クラブ初のプレミアの季／
#   お別れの試合のあと、チャーリー・ハーリーがセンタースポットを掘り、新しい本拠地に植えた／跡地は住宅、道の名は Promotion Close・Clockstand Close など。
#   自分で割った：75,118÷48,095=1.56／48,095÷22,500=2.14。
# 入場（PL公式の試合API、控え research/raw/20261024_pl_matches_all.json）：
#   2025/26 はハンドブックの入場表（32910行）：19試合・平均46,704・合計887,382・97.1％・最多47,257（クリスタル・パレス戦）。
#   2026/27 ここまでのホーム3試合：8/30 フラム 46,781／9/12 アーセナル 46,861／10/10 ブライトン 47,196 → 合計140,838・平均46,946（10/25 のリーズ戦はまだ）。
#   自分で引いた：46,790-46,704=86／46,946-46,790=156／48,353-48,095=258。
# 欧州：UEFA の試合データ（matchId 2050062、控え research/raw/20261025_sl_uefa_2050062.json）2026-09-16 サンダーランド 1-0 AZ、入場 45,555、会場 Stadium of Light。
#   欧州の大会は 1973/74 以来（季の記事の本文）。本拠地の開場は1997年なので、この本拠地で初めての欧州の公式戦（親善のアヤックス戦・ユヴェントス戦は除く）。
# 日本との接点：日本人選手の在籍は無い（research/pl_data/japan.json の sunderland は空）。本拠地の場所を決めた話に、日産の異議がある → 基礎の次の節に置いた。別競技の縁ではない。
# 言わなかったもの：開場の式の来賓（王族）／ダイアナ元妃の名前に変える打診／オーナー・財政／女子チームの試合と記録／ラグビーとコンサートの記録／ダービーの勝敗。
# 読めなかった：クラブ公式の歴史ページ（safc.com）。ブラウザ操作・JS実行は不使用（requests のみ）。
# 写真：assets/images/20261025_stadium_sunderland/（Commons、出典は credits.json）。人物は特定していない。
