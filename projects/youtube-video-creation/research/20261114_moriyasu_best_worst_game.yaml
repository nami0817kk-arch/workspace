# 出典で確かめたこと:
#   ・13日、シンガポールで行われるブラジル戦（MIZUHO BLUE CHALLENGE THE KALLANG FOOTBALL SERIES SINGAPORE）に向けた前日練習後の取材。海外メディアが、今回の2連戦で退任する森保監督に「8年間で一番良かった試合、一番悪かった試合はどれか」と質問した（ゲキサカ）。
#   ・森保監督の言葉（原文。ゲキサカ。字は変えていない。台本は読点で行に分けた。原文の「ですか?」の?は台本では全角）:
#       「一番良かった試合ですか?どうですかね……」（地の文が「頭を悩ませつつ」）
#       「逆は覚えています」（先にワーストゲームを回答。地の文）
#       「なぜなら、準備の段階から、選手が思い切って、自信を持って戦える役割・戦術を監督としてうまく落とし込めず、選手たちが持っている力を発揮できずにホームで敗戦したことを覚えている」
#       「忘れることはできない」（地の文が「声を落とした」）
#       「いい試合は思い出さないことにしたい」（ベストゲームについては「なかなか言葉が出て来ず、最後に」）
#   ・同じ記者から「8年間でどういったレガシーを残せたか」と聞かれ、森保監督は選手層の広がりに意義を見出した（地の文）。原文:
#       「…一部の選手だけを指してベストオブベストではなく、選手層を広く日本代表として捉えていただけるようになったことだと思う。私自身、日本にはたくさんのいい選手がいると言い続け、選手層を厚くしながらより高い頂点を目指してチームづくりをすることをさせてもらえた。そこは自分がやるというより、そういう環境を許していただけた協会の方々がいるからだと思っている」
#   ・「ワーストゲーム」の試合: ゲキサカの地の文は「2021年9月にパナソニックスタジアム吹田で行われたカタールW杯アジア最終予選初戦のオマーン戦(●0-1)」。森保監督本人が「ワースト」という語を使ったのではなく、質問（一番悪かった試合）に答えて挙げた試合を、記事が“ワーストゲーム”と呼んでいる→台本は「一番悪かった試合を挙げました」と書き、断定しすぎない。
#   ・ESPN（fifa.worldq.afc, event=611303）: 2021-09-02 日本 0-1 オマーン、パナソニックスタジアム吹田。得点は88分にアル・サブヒ（オマーン）の1点のみ。記事の「2021年9月」「ホーム」「0-1」と合う。
#   ・退任: 記事は「この活動限りで退任」。日程は14日ブラジル戦、17日パラグアイ戦（シンガポール。取材メモ 20261113_maeda_pl_goal_words と同じ出どころ）。
# 食い違い: なし。記事の見出しは「忘れられない」だが、森保監督の原文の言葉は「忘れることはできない」→台本は原文のほうを使う。
# 前の本との重なり: 20261111_doan_asiacup_words（堂安が語った、森保監督との8年3か月・契約・最後の活動）。今回の初出: 森保監督本人が海外記者の質問に答えた言葉（悪かった試合＝オマーン戦の理由、ベストゲームは出てこなかったこと、残したもの）。堂安の言葉・8年3か月・契約更新の話は繰り返さない。
# 【言わないこと】14日ブラジル戦の結果・予想／後任の話／森保監督の戦績の評価。
# 本人の言葉: あり（森保一。ゲキサカ）。Y。
