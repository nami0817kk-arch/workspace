- id: hook
  heading: 日本に負けた4年前のスペインは、どこが違うのか
  main: true
  tier: 背景
  telop: W杯優勝2回。最後は今年7月。4年前は日本に負けた
  narrator: 解説
  say:
  - text: スペイン代表は、ワールドカップで**2回**優勝しています。
    image: assets/stats/tb_spain_data_r1.png
    no_telop: true
    emph: true
  - text: 最後の優勝は、今年の7月です。
    image: assets/stats/tb_spain_data_r1.png
    no_telop: true
  - text: 決勝の相手は、アルゼンチン。延長戦の末、1対0でした。
    image: assets/stats/tb_spain_data_r1.png
    no_telop: true
  - text: 8試合で、負けはなし。失点は、準々決勝の1点だけです。
    image: assets/stats/tb_spain_data_r1.png
    no_telop: true
  - text: ところが、前回の2022年大会。スペインは、日本に負けています。
    image: assets/stats/tb_spain_data_r2.png
    no_telop: true
  - text: 日本の2対1の勝ち。日本は、そのグループの1位でした。
    image: assets/stats/tb_spain_data_r2.png
    no_telop: true
  - text: スペインは2位で、決勝トーナメントに進みました。
    image: assets/stats/tb_spain_data_r2.png
    no_telop: true
  - text: 負けた次の大会で、世界一。何が変わったのでしょうか。
    image: assets/stats/tb_spain_data_r1.png
    no_telop: true
  sources:
  - https://inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain
  - https://www.jfa.jp/samuraiblue/schedule_result/2022.html
