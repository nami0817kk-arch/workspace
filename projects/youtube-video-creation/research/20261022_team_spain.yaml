#  ・日本の2022年の結果：JFA（https://www.jfa.jp/samuraiblue/schedule_result/2022.html）＝「12/1(木) FIFAワールドカップ カタール2022 ○2-1 スペイン ドーハ(カタール)／Khalifa International Stadium」。得点者と時間は Jリーグ公式サイトのサマリー（https://www.jleague.jp/news/article/24005/）＝モラタ11分・堂安律48分・田中碧51分、日本は勝点6でグループ首位。JFA の個別の試合ページは取れていない（20221201・20221202 の match_page は404）。
#  ・日本の2026年の日程と結果：JFA（https://www.jfa.jp/samuraiblue/schedule_result/2026.html）。スペインとの試合は無い。
