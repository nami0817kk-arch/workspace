#  ・2026年W杯（Wikipedia Spain national football team の試合一覧）：6/15 カーボベルデ0-0、6/21 サウジアラビア4-0、6/26 ウルグアイ1-0、7/2 ラウンド32 オーストリア3-0、7/6 ラウンド16 ポルトガル1-0（90+1分メリノ）、7/10 準々決勝 ベルギー2-1、7/14 準決勝 フランス2-0、7/19 決勝 アルゼンチン1-0（延長106分フェラン・トーレス、MetLife）＝8試合7勝1分・14得点1失点。
#  ・2022年W杯（2022 FIFA World Cup Group E、Spain at the FIFA World Cup）：11/23 コスタリカ7-0、11/27 ドイツ1-1、12/1 日本1-2、12/6 ラウンド16 モロッコ0-0（延長・PK0-3で敗退）＝4試合（PK戦を除く）1勝2分1敗・9得点3失点。「3大会連続の主要大会PK戦敗退」の記述も同記事（言わない）。
#  ・2014年グループ敗退、2018年ラウンド16でロシアに PK3-4（1-1）、2022年ラウンド16でモロッコにPK0-3。
#  ・ルイス・エンリケは2022年W杯ラウンド16のあとに退任、デ・ラ・フエンテが2022-12-08 に就任（Wikipedia Luis de la Fuente）。契約はEURO 2028 まで（2025年1月延長）。就任後に NL 2023・EURO 2024・W杯2026 を制し、3つとも獲った初の監督（記述。言わない）。
#  ・日本とスペインの国際Aマッチ：日本代表の試合記録（Wikipedia en、1990〜1999・2000〜2009・2010〜2019・2020〜）では 2001-04-25 コルドバ 親善 0-1（日本負け）と 2022-12-01 W杯 2-1 の2試合だけ。**JFA の通算対戦成績は取れていない**ので「1990年以降の記録で2試合」と言い、通算とは言わない。2001年の試合は Wikipedia のみ。
#  ・久保建英はレアル・ソシエダ所属（Takefusa Kubo の infobox）、オヤルサバルも同クラブ（Spain national football team の名簿 2026-10-06 時点）。
#  ・ネーションズリーグ2026-27（リーグA、Wikipedia の試合一覧）：9/26 イングランド2-3スペイン（ロンドン）、9/29 スペイン4-1クロアチア（セビリア）、10/3 スペイン3-1チェコ（オビエド）、10/6 クロアチア1-2スペイン（スプリト）＝4勝・12得点5失点。次は 11/12 チェコ戦（プラハ）、11/15 イングランド戦（マドリード）。
#  ・名簿・年齢：Wikipedia の代表名簿（2026-10-06 時点）。生年月日から2026-10-22 時点で計算（ロドリ 1996-06-22=30、ペドリ 2002-11-25=23、ヤマル 2007-07-13=19、オヤルサバル 1997-04-21=29、メリノ 1996-06-22=30、ウナイ・シモン 1997-06-11=29）。所属も同名簿（ロドリ・ペドリ・ヤマル＝バルセロナ、オヤルサバル＝レアル・ソシエダ、メリノ＝アーセナル、ウナイ・シモン＝アスレティック）。
#  ・愛称 La Roja（意味は「赤」。台本では意味だけ）。
# ---- 自分で数えた数（検算した）----
#  ・W杯の1試合あたり失点：2022年 3÷4=0.75、2026年 1÷8=0.125（0.13）。得点：2022年 9÷4=2.25、2026年 14÷8=1.75。
#  ・決勝トーナメントの得点：2022年は1試合（モロッコ戦120分）で0点、2026年は5試合で 3+1+2+2+1=9点（決勝は延長を含む）。
#  ・ネーションズリーグ4試合の失点 2+1+1+1=5（1試合1.25）、得点 3+4+3+2=12。
# ---- 言わないもの ----
#  ・無敗の試合数（10/3 のニュースの軸）／日本戦の通算（JFA 未確認）／戦術の説明／選手の怪我・私生活／背番号／五輪（A代表ではない）。
