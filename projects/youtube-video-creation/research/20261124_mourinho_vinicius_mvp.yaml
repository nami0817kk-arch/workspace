#   pair_mourinho＝モウリーニョ（左）＋ヴィニシウス（右）、pair_courtois＝クルトワ（左）＋ヴィニシウス（右）。ヴィニシウスの別の1枚（2026-93）は顔が検出できず外した。
#   記事の写真（ESPN・MARCA・Foot Mercato）は Getty か出どころ不明なので使っていない。一覧を目で見た: 本人、透かしなし。レアルのユニフォームの写真ではない。
#   ショートの冒頭用に 02_wc（ヴィニシウス・モウリーニョ・クルトワの縦写真を横に3枚並べた1枚。真ん中のモウリーニョがショートの冒頭に出る）を作った。Y の1行目の写真は shorts の縦版差し替え（_drop_boards）の後に入るので、横の写真を縦に切ると寄りすぎるため。
#   pair_mourinho・pair_courtois の縦版（01_v）は、下のヴィニシウスの顔がテロップにかからないよう手で組み直した。各 NN_w の隣に縦版 NN_w_v（= NN_v の写し）を置いた。
