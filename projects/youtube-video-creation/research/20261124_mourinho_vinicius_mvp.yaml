# 取材メモ（2026年11月24日）レアル・マドリードのモウリーニョ監督「ヴィニシウスは、試合のMVPである必要はない」。CL・PSV戦の前日会見（ニュースのショート。見せ方 Y＝モウリーニョ監督の言葉から始める）
# 取材: 2026-11-24。WebFetch と requests（ブラウザUA）だけ。検索AI要約・ブラウザの道具は使っていない。FotMob は使っていない。
# 題材の元: ESPN（Alex Kirkland、2026-11-23 14:39 UTC「Real Madrid's Mourinho: Vinícius Jr. 'doesn't have to be MVP' to deliver」、content API で全文）
#   ・ヴィニシウスは国内の試合で4試合の出場停止（"served a four-match domestic ban"）を終え、この数週間は夏の新加入ヤン・ディオマンデに先発の座を奪われていた。
#     土曜のセルタ戦（2-1）では途中出場で好印象、2点ともに関わった（"playing a part in both goals"）。モウリーニョはPSV戦で先発させると明言。夏に長期の新契約。26歳。
#   ・モウリーニョ（月曜の会見）: "I think he'll return to his maximum potential," ／ "He's young. Sometimes when players get close to 30, 32 or 33, they aren't able to maintain the ideal physical level." ／
#     "He's won everything. He's a very good boy, very empathetic, and that's fundamental." ／
#     10月10日のビジャレアル戦: "He scored what would have been a key goal, and then it was ruled out, and he was four games out. Maybe that interrupted his moment of growth, of confidence returning." ／
#     "Tomorrow he plays, and we all expect his best version ... But from my side there's no pressure. There's pressure to work hard -- as he's been doing -- and help the team. For me, if he gives everything, he doesn't have to be the man of the match."
#     → 見出しは 'MVP'、本文の言葉は "man of the match"。台本は「試合のMVP」と訳す（見出しと同じ語。中身は同じ）。
#   ・同じ日、クラブがエンドリックの負傷を発表: "diagnosed with a muscle injury in the adductor of his left leg" "His recovery will be monitored."（セルタ戦は19分の出場）
# MARCA（11/23「Rueda de prensa de Mourinho y Courtois, en directo」／「Mourinho y el calendario: ...plin plin」、requests で全文。スペイン語）:
#   ・モウリーニョのヴィニシウスの部分は ESPN と同じ中身（"Yo creo que volverá a su potencial máximo. Es joven ..." "Quizás se ha interrumpido un momento de crecimiento, de confianza ..."）。「MVP」の一文はMARCAの書き起こしには無い（ESPN にだけある）。
#   ・クルトワ（同じ会見）: "Todos nos apoyamos entre nosotros. No es que tengamos que estar cerca de él, es un chico feliz y hace autocrítica. La carrera es larga y no puedes ser siempre un 9 o 10 todas las temporadas. Los únicos que conozco así son Messi y Cristiano. ... tiene que estar libre. Necesitamos al mejor Vinicius"
#     （Foot Mercato「Real Madrid : Thibaut Courtois prévient Vinicius Jr」も同じ言葉をフランス語で）→ 台本の言葉は、このスペイン語を私が日本語にしたもの。
#   ・MARCA の生中継の頭に「miércoles, 21:00 h」とあるが、ESPN の日程は火曜 20:00 UTC（＝スペイン時間21時）。→ 食い違い。ESPN の日程を使う。
#   ・Foot Mercato の負傷記事は「déplacement du Real Madrid sur la pelouse du PSV」（敵地）と書くが、同じ Foot Mercato の招集の記事と ESPN は本拠地サンティアゴ・ベルナベウ。→ 本拠地。
# Foot Mercato「Ligue des Champions : le groupe du Real Madrid face au PSV dévoilé」: 招集外はエンドリック・メンディ・ロドリゴ・アセンシオ。ヴィニシウス・エムバペ・ベリンガム・クルトワは招集。
# ESPN の試合データ（esp.1 event=401882798、11/21 セルタ戦）: レアル 2-1 セルタ。6分 パブロ・ドゥラン（セルタ）／66分 ベリンガム（アシスト エムバペ）／85分 カルロス・エスピ。ヴィニシウスは57分に途中出場（記録上のアシストは無い）。エンドリックは71分に途中出場。
#   → 「2点ともに関わった」は ESPN の地の文。記録上のアシストではないので「関わったと報じられています」と言う。
# ESPN 順位表（uefa.champions、11/24 取得）: 1位パリ・サンジェルマン 4勝 勝ち点12、レアル 4試合4勝 勝ち点12（2位）／PSV 4試合1勝1分2敗 勝ち点4（24位）。
# ESPN scoreboard（uefa.champions 2026-11-24）: PSV Eindhoven at Real Madrid 20:00 UTC、Santiago Bernabéu（event 401915298）＝日本時間 11/25 5:00。
# 自分で数えたもの: 4試合4勝（12＝4×3）。
# 前の本との重なり: 20261011_vini_red・20261015_vinicius_ban（退場と出場停止の頃）、20261122_real_celta_mbappe_pk（セルタ戦。エムバペのPK失敗が主）、20261118_vinicius_hattrick_brazil。モウリーニョの「MVPでなくていい」は初出。セルタ戦の流れは繰り返さない。
# 流れの点検（Gemini）で「エンドリックの行が飛ぶ」と出たので、エンドリックの負傷は台本から外した（控えとして上に残す）。
# 【言わないこと】「彼を殺そうとしていた頃」の一節（意味が取りにくい）／30歳前後の選手の衰えの一般論の細部／カレンダー・給料の話／PSV の選手名／エンドリックの冬の移籍のうわさ。
# 本人の言葉: 題の人物はモウリーニョ監督。会見の言葉あり → Y。
# 反応: 0件（作らない。approve は --no-voices）。
