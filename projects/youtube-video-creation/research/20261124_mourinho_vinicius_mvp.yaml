    say:
      - voice: モウリーニョ監督
        text: 全力を出してくれるなら、試合のMVPである必要はない。
        emph: true
        image: assets/images/20261124_mourinho_vinicius_mvp/02_wc.jpg
      - text: レアル・マドリードのモウリーニョ監督が、ヴィニシウスについて話した言葉です。
        short_only: true
        image: assets/images/20261124_mourinho_vinicius_mvp/pair_mourinho/01.jpg
      - text: ヴィニシウスは10月に退場し、国内の試合で4試合の出場停止になりました。
        image: assets/images/20261124_mourinho_vinicius_mvp/03_w.jpg
      - text: その間に、夏に加わったディオマンデに、先発の座を奪われていました。
      - text: 21日のセルタ戦は57分から出場。2点のどちらにも関わったと報じられています。
        emph: true
      - text: 監督は、24日のPSV戦で彼を先発させると明かし、こう続けました。
        image: assets/images/20261124_mourinho_vinicius_mvp/pair_mourinho/01.jpg
      - voice: モウリーニョ監督
        text: 彼は、また最高の力を取り戻すと思います。
      - voice: モウリーニョ監督
        text: まだ若いのですから。
        cont: true
      - voice: モウリーニョ監督
        text: あの退場で、自信が戻りかけていた流れが、
        cont: true
      - voice: モウリーニョ監督
        text: 止まったのかもしれない。
        cont: true
      - voice: モウリーニョ監督
        text: 私からの重圧は、ありません。
        cont: true
      - voice: モウリーニョ監督
        text: 求めるのは、懸命に取り組んで、チームを助けることです。
        cont: true
