    narrator: キャスター
    say:
      - text: ベネズエラ戦の決勝PKの直後、森保監督がスタンドへハートを作りました。
        short_only: true
      - text: ベネズエラに2対1で勝った、9月28日の広島。
        image: assets/images/20260929_moriyasu/01.jpg
      - 後半アディショナルタイム6分、上田綺世のPK。
      - その直後、両手で作ったハートをスタンドへ。
      - 試合後、その意味をこう話しています。
      - voice: 森保一
        text: まさに日本人魂かなと思って。
      - voice: 森保一
        text: 苦しい時も粘り強く戦い、
        cont: true
      - voice: 森保一
        text: 最後までチーム一丸となって戦い抜くというところ。
        cont: true
      - voice: 森保一
        text: 勝利を諦めず戦った結果、PKを貰い勝てたということで。
        cont: true
      - voice: 森保一
        text: 日本人の皆さんの魂にハートを送りました
        cont: true
