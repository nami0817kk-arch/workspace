  - id: ten
    heading: 10人で得たPK
    tier: 報道
    telop: 「本当に粘り強くしっかり切り替えてくれて」
    narrator: キャスター
    card:
      type: table
      title: 日本 2-1 ベネズエラ（9月28日・広島）
      columns: ['', '']
      rows:
        - [前半8分, 熊坂光希が負傷交代]
        - [46分, ケルシー（ベネズエラ）]
        - [49分, 上田綺世]
        - [終盤, 渡辺剛が負傷。交代枠なく10人に]
        - [90+6分, 上田綺世（PK）]
    say:
      - 時間を戻します。前半8分、代表デビューの熊坂光希がけがで交代。
      - 後半開始26秒で失点し、その4分後に上田綺世が追いつきました。
      - 終盤には渡辺剛もけがでピッチを離れ、交代枠は使い切っていて10人に。
      - 残りの10分ほどを10人で戦い、その中でPKを得ています。
      - ベネズエラ側は判定に不満で、試合後も収まりませんでした。
      - 監督は、選手たちのことをこう話しました。
      - voice: 森保一
        text: 予期せぬ退場で我々が数的不利になりましたが、
      - voice: 森保一
        text: 選手たちは本当に粘り強くしっかり切り替えてくれて、
        cont: true
      - voice: 森保一
        text: 守備をしっかりしながら攻撃に移ることを忘れずに、
        cont: true
      - voice: 森保一
        text: ホームで勝ちたいという気持ちを出してくれたと思います
        cont: true
    sources:
