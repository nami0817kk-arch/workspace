  - id: view
    viewpoint: true
    heading: 見立て
    tier: 背景
    telop: 同点も決勝も、後半から入った選手の形
    narrator: 解説
    say:
      - 森保一監督の3期目は、就任から2戦2勝。
      - 言葉は選手全員へ。ただ、点に絡んだのは後半から入った選手でした。
      - 同点弾は伊東純也のクロスに上田綺世。24日のウルグアイ戦に続く2試合連続の形です。
      - 決勝PKも、途中出場の久保建英が倒されて得たものでした。
      - 先発には代表デビューが4人。前半は無得点で折り返しています。
      - 粘りは本物でも、先発組が点を取れなかった差は残りました。
    sources:
      - https://www.football-zone.net/archives/676062
