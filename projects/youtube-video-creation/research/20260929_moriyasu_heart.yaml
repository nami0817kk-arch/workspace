# 森保監督が、上田のPK弾のあとスタンドへ作ったハート。試合後に語った「送り先」（2026年9月29日）
#
# **本人の言葉が主役の回（quote）。**発言はサッカーキング（いちばん長く載せていた）に揃えた。
# ゲキサカは「全てにリスペクトして、日本人の魂にハートを送った」、
# フットボールゾーンは短い要約で、同じ発言の切り方違い。
#
# **昨日 9/28 に出した「会見の最後のお願い（堂安・塩貝）」の話は入れない。**
#
# **反応は3件、全部 Yahoo!ニュースのコメント欄（requests で読めた）。**
# 海外の声は、r/soccer の得点スレと試合スレ（RSS で読めた36件）を見たが、
# 中身は PK の判定（VAR で相手のPKが日本のPKに変わった）の話ばかりで、
# ハートにも監督の言葉にも触れた投稿が無かった。**海外の声は0件**。X は読めない。
# 見つかった反応はハートに対して冷ややかなものばかりで、好意的なものは
# 読めた範囲（各記事の先頭10件）には無かった。
