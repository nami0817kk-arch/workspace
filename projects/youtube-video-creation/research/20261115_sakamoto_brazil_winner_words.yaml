# 取材メモ（2026年11月15日）坂元達裕、5年半ぶりの代表復帰でブラジル撃破の初ゴール「苦しい時に100%でやり続けられる選手が上に行く」（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# 取材: 2026-11-15。requests（ブラウザUA）で本文を全文読み、site.api.espn.com で確かめた。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。FotMob は使っていない。
# 題材の元: ゲキサカ 2026-11-15 06:00（取材・文 竹内達也）「Jユース昇格逃し、大卒J2から地道にプレミア到達…ブラジル撃破の立役者・30歳坂元達裕が貫き続けた信念「苦しい時に100%でやり続けられる選手が上に行くんだと」」（全文） https://web.gekisaka.jp/news/japan/detail/?463211-463211-fl
#   サッカーキング 2026-11-15「「素直に嬉しい」」5年半の想いが最高の結果に、坂元達裕がブラジル撃破の代表初ゴール「積み上げたものがやっと形になった」」（全文） https://www.soccer-king.jp/news/japan/national/20261115/2227735.html
# 写真の出どころ（本人の写真を探すため。サッカーキングの写真は説明に Getty Images とあるので使っていない。2枚は 11/4・11/1 に取り込んだ Coventry 時代の写真の再利用＝他に今日の写真が取れなかった）:
#   https://web.gekisaka.jp/news/japan/detail/?463211-463211-fl
#   https://www.coventrytelegraph.net/sport/football/football-news/tatsuhiro-sakamoto-opens-up-premier-34849253
