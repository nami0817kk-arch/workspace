# 出典で確かめたこと:
#   ・ESPN の試合データ（fifa.friendly summary event=401916337、2026-11-14 10:15 UTC）: 日本 3-2 ブラジル。坂元は途中出場（72分に堂安律と交代）。90+1分 坂元達裕（右足、6ヤードボックス右からゴール左上。VAR確認）。
#   ・ゲキサカ: 2-2のまま劣勢が続いた後半アディショナルタイム1分、5年半ぶりに日本代表に帰ってきた30歳の坂元が決めた。佐野航大のミドルシュートが相手DFに当たって軌道が変わり、ペナルティエリア右でワンタッチシュートをゴール左隅へ。A代表初ゴールがブラジル撃破の決勝点。
#     経歴（ゲキサカ）: 中学はFC東京U-15むさし（U-18昇格はかなわず）→前橋育英高（全国高校選手権準優勝）→東洋大（関東大学リーグ2部から）→プロはJ2のモンテディオ山形から→セレッソ大阪（J1初挑戦とA代表初招集）→ベルギー・オーステンデ→イングランド・コベントリー（チャンピオンシップからプレミア昇格）。
#   ・坂元の言葉（原文。ゲキサカ。字は変えていない。括弧は記者の補足。台本は読点で行に分けた）:
#       「僕自身は派手な選手ではなく、プロになるまでも少しずつ階段を上ってきたタイプの選手なので、プロとして一番頑張らなきゃいけない時は苦しい時だった。苦しい時期にどう立ち直るか、どうやってその壁を乗り越えるかというところが、プロとして上に行くために一番大事なことだと思っている。ベルギー(オーステンデ)でも0-5、0-6、0-7で負ける試合を毎試合のように経験して、チームとして降格することにもなって、苦しい時間が長かったけど、そういう時に100%でやり続けられる選手が上に行くんだと、そう信じ続けて今までやってきたし、それが本当に形になって、いまここまで来られている」
#       「いつこぼれてきてもゴールを狙えるような立ち位置にいるようには常に意識しているし、僕自身ああいった形でのゴールはキャリアの中で多いので、そこ(ゴールが取れるポジション)に入れたことが良かったと思う」
#       「これで満足せずに、僕自身代表に定着するためには結果を残し続けなければいけない。まだまだ足りないと思いますし、課題も多いと思うので、しっかりと続けてやっていきたいです」
#   ・サッカーキング: 「5年以上ぶりに戻ってきて、大きな、大事な、チームとして絶対に勝ちたい試合に貢献することができたのは、僕自身すごく大きな自信になる」、「30歳になる年にプレミアの舞台にチャレンジできて、ゴールも決められて、こうやって代表にも戻ってこられてゴールも決められた。積み上げてきたものがやっと形になったという思いが強いです」。森保監督が最後の交代3枚で起用。
# 自分で数えたもの: 投入（72分）から決勝点（90+1分＝91分）まで19分。プレミア初ゴール（2026-10-31、ESPN 401879247）からこの代表初ゴール（11-14）まで14日。
# 食い違い: サッカーキング本文は「5年ぶり」「5年半ぶり」が混在。見出しは「5年半」。台本は「5年半ぶり」（ゲキサカの本文と一致）。ゲキサカ本文の「30歳」はサッカーキング「30歳になる年」と合う。
# 前の本との重なり: 20261104_sakamoto_pl_first_goal（プレミア初ゴール）、20261105_sakamoto_japan_return・20261111_sakamoto_return（代表復帰・森保監督の言葉）。今回の初出: ブラジル戦の決勝点・本人の信念の言葉・歩んだ階段。プレミア初ゴールの言葉は繰り返さない（日数の比べだけ使う）。
