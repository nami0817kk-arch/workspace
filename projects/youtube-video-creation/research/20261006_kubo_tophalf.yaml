# 取材メモ（10/6 題材 kubo_tophalf、型は quote）。材料の控え: research/raw/20261006_kubo_tophalf.md
# 主役は「トップ下」。キリンカップ決勝（10/5 国立、日本 2-1 ニュージーランド）で、久保建英が本職のトップ下に入って64分。
# 結婚の話は冒頭の語り2行まで（10/3 に結婚の回、10/4 にスペインとの差の回を出している）。
# 重ねないもの: 10/5 の「堂安の決勝ゴール」「上田の4試合4点」、同時に作る「中村敬斗の決勝点演出」。
#   試合の流れ・堂安の決勝点は言わない。「2年半ぶりの4バック」「15年ぶり」「シュート21本」も言わない。先制点は久保の関わりを1行だけ。
# 事実の裏:
#   位置と出場時間: JFA の試合記録 PDF（9/24・9/28・10/1・10/5）。位置はゲキサカ 460371（トップ下、近年はシャドー）、JFA 9/24 試合報告（堂安は右）、FotMob の並び（9/28 佐藤は右）、サッカーダイジェスト（10/1 右シャドー）。
#   触った場所: スポーツナビの個人スタッツ（データスタジアム）の「プレー数」。ATサード＝相手ゴールに近い3分の1。チームの割合は日本の全選手の和。
#   シュートは JFA（4試合とも0本）とスポーツナビ（1・0・1・1本）で割れるので使わない。
#   シュートにつながったパス4本は、スポーツナビのテキスト速報で前半1分・10分・44分・46分を数えた（少なくとも、の数）。
#   次の公式戦: FotMob（レアル・ソシエダ 8560）10/11 14:15 UTC ＝ 日本時間 23:15 ホームでデポルティーボ。クラブの主な位置は右のウイング（FotMob）。
# 反応: Yahoo!ニュース（ゲキサカの記事）のコメント欄から個人の投稿を頭から終わりまで3件。海外の声は取れていない。
# 写真: 01 ゲキサカ（©Kaoru WATANABE/GEKISAKA）。01_side_w は同じ写真を久保が右に寄るよう16:9に切ったもの（見立ての表と反応の箱が顔にかからないように）、01_side_w_v はその縦版。02 サッカーキング（写真＝金田慎平）はショートの写真 02_v だけ。代理店ではない。
