- id: center
  heading: 真ん中で受けると決めていた
  tier: 報道
  telop: 久保建英「ローテーションしないであそこで受けられたほうがチャンスになるので」
  narrator: キャスター
  say:
  - text: ここ最近の代表は最終ラインが3人の形で、久保の持ち場は右のシャドーでした。
  - text: シャドーは、最前線のフォワードのすぐ後ろに、2人並ぶ攻撃の選手です。
  - text: 右のシャドーでは、サイドへ流れる場面が増えていました。
  - text: この日は真ん中にとどまって、ボールを引き出そうとしていました。
  - text: まわりと持ち場を入れ替えながら攻める動きを、久保はローテーションと呼びます。
  - voice: 久保建英
    text: できるならローテーションしたくないなと
  - voice: 久保建英
    text: 思いながら試合に臨んで、
    cont: true
  - voice: 久保建英
    text: 実際には何度かしたけど、
    cont: true
  - voice: 久保建英
    text: ローテーションしないであそこで受けられたほうが
    cont: true
  - voice: 久保建英
    text: チャンスになるので
    cont: true
  - text: それでも先制点の場面では右へ流れ、ゴールライン際から中野就斗へ戻しています。
  - text: ただ、真ん中を固められて、うまくいかない場面もあったと振り返りました。
  - text: 動きが止まった状態を、久保はスタティックと言い表します。
  - voice: 久保建英
    text: スタティックになってもしょうがないので、
  - voice: 久保建英
    text: いい塩梅を見つけられたら
    cont: true
