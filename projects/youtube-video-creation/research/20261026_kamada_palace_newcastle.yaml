#       ※本文の「リーグ単独最多17失点」「2勝1分け4敗」は ESPN の順位表（8試合 2勝1分5敗・19失点）・BBC（8試合で5敗目・19失点）と食い違う → 数字は ESPN・BBC を使う。
#   ・ESPN 試合記録（site.api.espn.com summary event=401879254）: シュート パレス17・ニューカッスル10、枠内 4・2、支配率 52.6%・47.4%。得点 47分オスラ・58分バーンズ。鎌田は先発・交代なし、シュート1。
#     ESPN 順位表（eng.1 standings、26日朝）: パレス 8試合 2勝1分5敗 9得点19失点 勝ち点7 17位。失点2番目はイプスウィッチ16。18位フォレスト勝ち点6。
#     ESPN 記事: 試合終了の笛でホームの一部からブーイング。
#   ・パレス公式 試合レポート（https://www.cpfc.co.uk/news/match-reports/match-report-highlights-crystal-palace-newcastle-october-2026/）:
#       7分、マクニールが運んで横へ → 鎌田のシュートはゴール前を横切り（当たり損ね）、マテタに届きかけて外へ。前半はパレスの方が機会が多かった。
#   ・パレス公式 サージュ監督（https://www.cpfc.co.uk/news/first-team/sage-reacts-to-newcastle-defeat/）: "we missed 15 minutes in this game: the first 15 minutes in the second-half." 次はリーグカップ（カラバオ杯）でフラムとのアウェー（週の半ば）。
#   ・BBC（https://www.bbc.co.uk/sport/football/articles/c6kg5jmrzd2jo）: サージュは3年契約の4か月目。会見で "There is no noise inside the club." "The boos are normal because we don't have the result." "Inside, we are just really focused on solutions." 次のリーグ戦は土曜にトッテナムのアウェー。
