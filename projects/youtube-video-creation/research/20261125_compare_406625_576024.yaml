# 取材メモ（11/25 水、シリーズ「比べる」、key: compare_406625_576024）。ラウタロ・マルティネス（インテル・29歳）×フリアン・アルバレス（アトレティコ・マドリード・26歳）。
# **情報の時点は 2026-11-13**。FotMob・DataMB は使っていない。数字は Transfermarkt の API（2026-11-13 取得。控え: research/raw/20261123_laut_tm.json・20261123_alv_tm.json・*_profile.json）。
#   番号：ラウタロ 406625・アルバレス 576024。profile・market-value-history・performance-season（2023〜2026季）を2.5秒あけて取得。
# **選んだ理由**：同じアルゼンチン代表のセンターフォワード（TM の位置は2人とも Centre-Forward）、身長 1.74m と 1.70m、どちらも右利き。年齢は29歳と26歳（3歳差）。市場価値は 8500万€ と 1億1000万€（若いアルバレスが上）。
#   軸：クラブの公式戦の90分あたり得点を4季（23/24〜26/27）で並べる。ラウタロが4季中3季で上、アルバレスが上なのは 24/25 だけ。それなのに市場価値は逆（見立て）。今季の出場時間は 533分と734分（どちらも900分未満なので「小さな標本」と台本で断る）。代表戦は混ぜない（TM の clubId 3437 は代表）。
#   **当初は ハーランド×アルバレス で作ったが、同じ日（11/25）の選手紹介がエンソ・フェルナンデス（マンチェスター・シティ）で、シティが重なるため差し替えた**（ハーランドの下書きは捨てた）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて（ラウタロは 10/11 にマレン、アルバレスは比べるには未登場）。11/23 の比べる（ベリンガム×ヴィルツ）とは軸も人も別。
#   同じ日（11/25）の picks（パリ・サンジェルマンのユニフォーム・エンソ・フェルナンデス）とは人もクラブも重ならない。インテルは 11/19 のユニフォーム、アトレティコは 11/25 の他シリーズに無いことを picks で確認（公開前にもう一度）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：インテル（セリエA。TM の現所属 clubId 46、2018-07-04〜、主将）・アトレティコ・マドリード（ラ・リーガ。clubId 13、2024-08-12〜）。
# **使った数**（クラブのトップチームの公式戦だけ）
#   ラウタロ：23/24 44試合 3461分 27点7A／24/25 53試合 4076分 24点7A／25/26 41試合 2767分 22点6A／26/27 7試合 533分 6点1A
#   アルバレス：23/24 54試合 3480分 19点14A（シティ）／24/25 57試合 3967分 29点8A（アトレティコ）／25/26 49試合 3549分 20点9A／26/27 12試合 734分 2点3A
#   90分あたり得点（自分で割った値）：ラウタロ 0.70, 0.53, 0.72, 1.01／アルバレス 0.49, 0.66, 0.51, 0.25。得点＋アシスト：ラウタロ 0.88, 0.68, 0.91, 1.18／アルバレス 0.85, 0.84, 0.74, 0.61
# 市場価値（TM）：ラウタロ 最高 1億1000万€（2024-06）、2025-10 以降 8500万€（最新 2026-05-29）／アルバレス 最高 1億2000万€（2026-07-22）、2026-10-05 に 1億1000万€。
#   **確かめていない**：アルバレスの2024年8月の移籍金（台本では言わない）。アルバレスの23/24はシティ在籍（表の注には出さず、台本でも言わない）。「3歳若いことが値段に出ている」は見立て（市場価値の算定理由は確かめていない）。
# 写真：l1 Commons（アルゼンチン代表 vs エジプト 2026-07-07、Bryan Berlin、CC BY-SA 4.0）・l2 同（別コマ）・a1/a2 Commons（アルゼンチン代表 2026年7月、Bryan Berlin、CC BY-SA 4.0）。いずれも既存の取り込みの再利用（再ダウンロードなし）。**2人とも代表の姿のみ（インテル・アトレティコ姿の写真は探していない）**。ラウタロの 20261022_player_406625/q1 は子どもが写るため使っていない。pair_a=l1+a1、pair_b=l2+a2。
