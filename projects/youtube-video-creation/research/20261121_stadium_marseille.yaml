# スタジアム紹介シリーズ：マルセイユの本拠地（スタッド・ヴェロドローム、11/21 予定）。雛形は 11/17 ベティスの回。
# 題材の選び方（2026-11-12）：プレミア20・ラ・リーガの大物は済み。欧州7リーグのリーグ・アンの大物としてマルセイユ。11/21 の同日他シリーズ（ユニフォーム＝バイエルン、比べる＝クヴァラツヘリア(PSG)×ユルドゥズ、選手紹介＝ヴィルツ）と重ならない。PSG（パルク・デ・プランス）は比べるのクヴァラツヘリアと重なるので外した。
#   選んだ理由：ユーロ準決勝を3回開いた器（en ウィキペディア「初の欧州の会場」）／「1998年に屋根を外し、2014年にかけ直した」という強い一点／改修のたびの席と最多入場の比べで見立てが作れる。
#   重なりの確認：scripts/*stadium_*・posted.json・covered.yaml に無し（grep 済み）。picks は research/20261119_picks.txt。
# 一次情報の突き合わせ：en・fr ウィキペディア。開場1937-06-13 OM2-1トリノ／礎石1935-04-28／設計プロカン／当初35000／1960 OM本拠／1970-71 約55000／1985 走路撤去／1998 60031席・屋根撤去（fr：3億9190万フラン、設計ビュフィ）／2011-14 工事 2014-10-16 開き 67394席（4万2000→2013-08から4万8000は fr）／鉄骨5500t／2016ユーロ6試合・準決勝フランス2-0ドイツ 64078（fr）／1984 準決勝フランス3-2ポルトガル延長 54848／1998W杯 7試合／最多：2004-05-06 ニューカッスル 58897（en）・2025-04-19 モンペリエ 66312（en）。
#   金額：2010年の発表2億6700万（fr は「annoncé en 2010」）・会計検査院の見直し5億5100万（fr・複数の報道。ただし範囲が割れる：281.3M（工事費）・約350M（市の負担）・10.51億（総額・利払い含む）の記述あり。一次の検査院文書は未確認）→台本は「と伝えられます」。
#   食い違い（台本には入れない）：en は2011〜14に費用2億6700万のうち自己負担1.5億、fr は検査院5億5100万。en の1984年の席（4万2000＝ロッジ建設）と1985年の4万8000は fr の工事中の数字とぶつかる。最多入場は en の football record 66312（2025-04-19）、fr は欧州カップ最多65771（2025-09-30 OM対アヤックス）で別物。ラグビー最多は66818（fr）と66760（en）で割れる。ESPN の今季ホーム入場は0で使えない。
#   2026-07：BPCE グループが命名権（CEPAC ヴェロドローム）。台本は「別の銀行グループの名前」とだけ書き、読みの割れる固有名を避けた。
# 読みが割れる名前：ヴェロドローム／プロカン／ビュフィ／タピ／プラティニ／アレマ／ブイグ／トリノ（イタリア語読み）。
