  - id: missing
    heading: 名前が無かった選手
    main: true
    tier: 報道
    telop: 39歳のルイス・スアレス
    narrator: 解説
    say:
      - {short_only: true, text: 南米の強豪が、9月と10月の招集候補を出しました。}
      - 46人という数なら、たいていの名前は入ります。
      - 入っていなかったのが、39歳のルイス・スアレスでした。
      - 代表に戻るのではないか、と言われていた直後のことです。
      - リヴァプールに移ったロナルド・アラウホ、レアル・マドリードのフェデリコ・バルベルデ、ダルウィン・ヌニェスは入っています。
      - 監督を引き受けた元エースは、こうも話していたと伝えられています。
      - {voice: フォルラン監督, text: 戻りたいと望むなら大歓迎だ}
      - 扉は閉じていない、という言い方です。それでも今回は呼ばれませんでした。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35223/

