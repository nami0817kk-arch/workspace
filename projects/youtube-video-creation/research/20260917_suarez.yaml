# ウルグアイの46人に、スアレスの名前がなかった（2026-09-04 発表）
#
# **日本代表の回として出す。**9月24日に宮城で戦う相手の話で、
# しかも相手の監督はフォルラン。日本にとっては「初陣を受ける側」になる。
#
# 引きは**「復帰が噂されていたのに、名前が無い」**。ここが山場（@main）。
#
# **46人は暫定の候補。**最終メンバーではない。「落選」と書かない。
# 呼ばれなかったのは事実だが、ここから絞られる前の段階である
#
# **フォルランの「戻りたいと望むなら大歓迎だ」はサッカーダイジェストの記事。
# 報道どまりで扱う。**
#
# **ショート用の行にタイトルの語を入れない**（2026-09-17）。
# 「日本と戦うウルグアイ」で重なって draft に止められた
