        - ["10月6日", "インド"]
    say:
      - ウルグアイは今夏の大会で、グループステージを抜けられませんでした。
      - サウジアラビアと1対1、カーボベルデと2対2、スペインに0対1。
      - 3試合勝てず、勝ち点2で終わっています。
      - その立て直しを任されたのが、2010年の大会で最優秀選手に選ばれたディエゴ・フォルランです。
      - 監督としての最初の試合が、24日の宮城になります。
