# 田中碧のリーズ、ファルケ監督と2029年まで契約延長で大筋合意か の取材メモ（2026年10月17日・ショートだけ）
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。
#   ・サッカーキング 10/17「田中碧在籍のリーズ、ファルケ監督との契約延長で原則合意か」（本文を全部読んだ）。
#     元の報道は『ジ・アスレティック』。原文（NYT・有料）は403で読めない → 確度は「報道」。媒体名は言わず「イギリスのスポーツメディア」。
#   ・サッカーキング 9/11（エバンスMDの言葉）。原文は BBC Sport。Soccer News（soccernews.com）が BBC Sport の言葉を英語のまま載せていたので、
#     そちらの原文から訳した。Yorkshire Post（9/11）の英語の引用とも一致。
#   ・サッカーキング 10/10（アーセナル戦の試合記事）・10/11（採点）。4試合連続先発・次の試合の相手を確かめた。
#   控えは research/raw/20261017_tanaka_sk*.txt・20261017_farke_yp.txt・20261017_farke_sn.txt。
# 日付: 報道は10/17。エバンスMDの発言は 2026-09-11（BBC Sport）。
# 数字（記事どおり）: ファルケ49歳／2023年夏就任／23-24 昇格プレーオフ敗退／24-25 チャンピオンシップ優勝（プレミア復帰）／25-26 14位／今季 2勝3分け1敗の7位。
# 自分で数えた比べ: 就任2023年夏→2029年まで＝6年。就任から3シーズンを終えて今季が4シーズン目（Yorkshire Post も "starting his fourth season" と書いている）。
# 資料間のずれ: 記事は「原則合意」と「契約の構成は双方で大筋の合意」の両方を使う。台本は「原則合意」と「大筋の合意」を記事どおりに使い、「決まった」とは言わない。
#   英語圏の古い記事（9月）は「現行契約は2027年夏まで」と書く。サッカーキングは「今シーズン限り」。同じこと。2029年は英語の資料では確かめられなかった（アスレティック経由の報道のみ）。
# 本人の言葉: 田中碧・ファルケ監督本人の今回の言葉は、記事には無かった → 入れない。クラブ幹部（エバンスMD）の9月の言葉は、同じ契約延長についての発言なので使う。
# 反応: 当たった先は NO FOOTY NO LIFE（海外の反応まとめ）の最新の一覧のみ。この報道への反応記事はまだ無かった（10/17 の昼）。X は個別URLが取れる題材ではない。→ 反応は0件。
# 写真: 配信写真（Getty）は取り込まない。assets/images/20261017_tanaka_falke_2029/ はリーズ公式サイトの写真（06=試合後に拍手するファルケ監督、02=アーセナル戦の田中碧）。
