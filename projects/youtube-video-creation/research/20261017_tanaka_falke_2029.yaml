    viewpoint: true
    heading: ファルケ監督は、リーズで何を積み上げてきたか
    tier: 報道
    telop: 就任から3シーズン。2029年まで続けば6年
    say:
      - ファルケ監督の現行の契約は、今シーズン限りです。
      - 就任したのは、2023年の夏でした。
      - 1年目は2部の昇格プレーオフで敗れ、2年目は2部を制してプレミアに復帰しました。
      - 昨季は14位。今季は6試合で2勝3分け1敗、7位です。
      - 就任から3シーズンを終え、いまは4シーズン目です。
      - 2029年まで続けば、就任から6年になります。
      - 田中碧は、アーセナル戦まで、リーグ戦4試合連続で先発していました。
      - 次は18日、ホームでマンチェスター・ユナイテッドと戦います。
    official: false
