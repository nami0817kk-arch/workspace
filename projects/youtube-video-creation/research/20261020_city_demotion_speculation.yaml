# 取材メモ（2026年10月20日）シティの処分の見立て（ニュースのショート。見せ方 X＝冒頭1秒に弱い印の一言）
# **憶測の報道。確度は未確認。**記者の見立てであって、リーグの決定でも、クラブの発表でもない。「降格する」と言い切らない。題・冒頭・本文で憶測と断る。
# 取材: 2026-10-20。requests（ブラウザUA）で本文を全部読んだ。控え research/raw/20261020_city_dm_holt.txt（デイリー・メール原文）・_city_abola.txt（A Bola）・
#   _city_pl_statement.html（PL 声明 9/29）・_city_pl_appeal_stmt.html（PL 声明 10/2）。
#   ・デイリー・メール（19日公開）オリヴァー・ホルト「Insiders tell me Man City are set to face huge points deduction which will guarantee relegation - but they won't be sent down to League Two. And that seems fair, writes OLIVER HOLT」
#       **署名入りのコラム（意見記事）**。出所は "sources close to the process"（手続きに近い関係者）と "Soundings from insiders"（内部の打診）。記事の言葉:
#       ①「It is unlikely ... City will face a doomsday scenario of being expelled from the Premier League and forced to start again in League Two」（4部への追放は考えにくい）
#       ②「It is thought that the Premier League are pressing for City's punishment to be announced before the result of their appeal, which is unlikely to be decided before the end of January」（リーグは控訴の結果より前に処分を発表したい意向と『考えられている』。控訴の結論は1月末前は出にくい）
#       ③「Soundings from insiders suggest the most likely punishment is a swingeing points deduction which will ensure City's relegation to the Championship, plus a huge fine」（最も可能性が高いのは、シティの降格を確実にする重い勝ち点剥奪＋巨額の罰金）
#       ④「It is also possible that the punishment would include a further points deduction that would effectively confine City to the Championship for at least one more season」（さらに少なくとももう1季は2部に留める勝ち点剥奪も『ありうる』）
#       記事は「City were found guilty ... of the vast majority of 115 charges」と書く。**件数は使わない**（A Bola 115・Foot Mercato 114 と食い違い、PL の声明は件数を言わない）。
#       シティは今季リーグ戦7戦全勝、アーセナルは3点差（記事）。ESPN の順位表（試合記録、2026-10-19）でも シティ7勝・勝ち点21、アーセナル18。
#   ・A Bola（19日 14:19Z）は、上のコラムを引いて見出しで「Manchester City vai descer de divisão」（降格する）と**言い切っている**が、本文は「Segundo as fontes citadas pelo jornalista britânico, o cenário mais provável é...」で、
#       情報源は記者が引いた匿名の関係者。**見出しの言い切りは使わない**。
#   ・Foot Mercato・AS は本文を読めていない（検索で見つからず）。題材の一覧の記述（114件）は使わない。
# **公式の現状**（PL 公式で確認）:
#   ・9/29 PL 声明: 独立委員会は、財務規則違反の2009/10〜2017/18の9季について **財務の告発はすべて有罪、調査への非協力は4つのうち3つ** を認定（"three of the four alleged breaches were upheld"）。
#   ・10/2 PL 声明: シティが控訴（"Manchester City FC has appealed the decision of an independent Commission"）。控訴の委員会の審理は結果の公表が許されるまで非公開。
#       注記: 委員会は罰に **広い裁量（broad discretion）**。例は罰金・勝ち点の剥奪・ほかの競技上の罰（"fines, points deductions and other sporting sanctions"）。控訴の委員会は控訴を認める・退ける・命令を変えることができる。
#   ・**罰（処分の中身）は PL の公式発表に無い**（PL のニュースの一覧にも見当たらない。2026-10-20 確認）。デイリー・メールも「まだ処分は出ていない」前提で書く。
#   ・前例（PL 公式）: エヴァートン 10点 → 控訴で6点（2024-02-26）、フォレスト 4点（控訴は退けられ維持、2024-05-07）。台本はこの2つだけ。
# **この回で言わないこと**: 勝ち点を何点という数字（記事に無い・情報源の一覧にも無い）、確率、「降格する」、「4部（リーグ・ツー）」への追放が起きるような言い方（記者が『考えにくい』と書いた事実だけ）、シティを貶す語、
#   35クラブへの影響の試算（10/18 の回で出した）、財政の数字（10/17 の回）、エンブレムの話。
# 重ならないように: 10/2・10/3 の「判決・控訴」の回は件数・金額・告発の経緯を言った。この回は **処分の見立てと、いま決まっていること** に絞る。
# 本人の言葉: 無し（誰かの発言は使わない題材）。反応: 0件（作らない）。approve は --no-voices で。
# 確度: 見立て＝ **未確認**（デイリー・メール単独、匿名の関係者）。いま決まっていること＝ **確定**（PL 公式）。順位は試合記録。
