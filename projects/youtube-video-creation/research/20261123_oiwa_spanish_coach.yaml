  - id: why
    heading: 大岩剛監督の2チーム体制。なぜスペイン人なのか
    tier: 報道
    telop: スペインは今夏のW杯の優勝国。大岩監督と同じ4-3-3
    say:
      - text: 大岩監督は、2028年のロサンゼルス五輪を目指す若い世代の代表も兼ねます。
      - text: 二つの代表の活動が重なるとき、若い世代は羽田憲司コーチが監督代行として率います。
      - text: そのあいだ、A代表で大岩監督を支える参謀の役を、このスペイン人コーチが担う見込みです。
        image: assets/images/20261123_oiwa_spanish_coach/01_w.jpg
      - text: では、なぜスペインなのか。スペインは、今年の夏のワールドカップで優勝した国です。
      - text: ボールを持って攻めるサッカーの国。大岩剛監督も、それを目指しています。
      - text: 陣形、つまり選手の並べ方も、スペインと同じ4-3-3です。
    official: false
    sources:
      - https://www.nikkansports.com/soccer/japan/news/202611200001514.html
