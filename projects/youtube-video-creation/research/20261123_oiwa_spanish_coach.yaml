    say:
      - text: 見立てです。日本人の監督の下に外国籍のコーチが付くのは、1998年以来、29年ぶりになります。
        card: {type: table, title: 日本代表の外国籍コーチ, columns: [年, 監督, コーチの役割], rows: [[1998年, 岡田武史, フィジカル・GK（ブラジル人）], [2027年, 大岩剛, 戦術（調整中）]], highlight_row: 2}
      - text: 前は、フランスで開かれたワールドカップの、岡田監督のとき。
      - text: ブラジル人の、体づくりとキーパーの専門コーチでした。
      - text: 戦術を担う、大岩剛監督の右腕としての起用は、異例です。
