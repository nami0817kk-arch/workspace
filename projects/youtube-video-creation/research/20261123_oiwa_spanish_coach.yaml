    heading: 大岩剛監督の日本代表に加わるスペイン人コーチは、どんな人なのか
    tier: 報道
    telop: 大岩ジャパンにスペイン人コーチ入閣へ。最終調整
    say:
      - text: 来年3月から大岩剛監督が率いる日本代表に、スペイン人のコーチが加わる方向で、最終調整に入っています。
        image: assets/images/20261123_oiwa_spanish_coach/01_w.jpg
      - text: その人は、大岩監督が2025年の春に研修を受けたときの同僚です。
        card: {type: timeline, title: スペイン人コーチ入閣までの流れ, rows: [[2025年春, 大岩監督が欧州研修。ボーンマスで出会う], [2026年7月, 大岩監督のA代表兼任が決まる], [2026年10月下旬, 技術委員長が極秘で渡米し接触], [2027年3月, 大岩ジャパンが始動]], highlight_row: 0}
      - text: 研修先は、イングランドのクラブ、ボーンマス。戦術を専門にする人です。
        image: assets/images/20261123_oiwa_spanish_coach/04_w.jpg
      - text: いまはアメリカで指導していて、名前はまだ明かされていません。
      - text: 戦術を組み立て、それを言葉にして選手に落とし込むことに優れた人だといいます。
        image: assets/images/20261123_oiwa_spanish_coach/03_w.jpg
      - text: 今年7月、若い世代の代表を率いる大岩監督が、トップの日本代表も兼ねると決まりました。
        card: {type: timeline, title: スペイン人コーチ入閣までの流れ, rows: [[2025年春, 大岩監督が欧州研修。ボーンマスで出会う], [2026年7月, 大岩監督のA代表兼任が決まる], [2026年10月下旬, 技術委員長が極秘で渡米し接触], [2027年3月, 大岩ジャパンが始動]], highlight_row: 1}
      - text: その直後から、スペイン出身の指導者を探してきました。真っ先に思い浮かんだのが、この人でした。
        image: assets/images/20261123_oiwa_spanish_coach/01_w.jpg
      - text: そして大岩監督の強い要望を受けて、日本サッカー協会の技術委員長が動きます。
        card: {type: timeline, title: スペイン人コーチ入閣までの流れ, rows: [[2025年春, 大岩監督が欧州研修。ボーンマスで出会う], [2026年7月, 大岩監督のA代表兼任が決まる], [2026年10月下旬, 技術委員長が極秘で渡米し接触], [2027年3月, 大岩ジャパンが始動]], highlight_row: 2}
      - text: 10月下旬、極秘でアメリカへ渡り、本人に会いました。
        emph: true
        card: none
        image: assets/images/20261123_oiwa_spanish_coach/03_w.jpg
      - text: 二つの代表を兼ねる大岩監督の下で、A代表の参謀を担う見込みです。
        short_only: true
        image: assets/images/20261123_oiwa_spanish_coach/01_w.jpg
      - text: 戦術の右腕として外国籍のコーチが入れば、日本人監督の代表では29年ぶりです。
        short_only: true
    official: false
