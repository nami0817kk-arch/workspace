# クリスタル・パレス（冨安健洋）の取材メモ（2026年10月15日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-15。requests（ブラウザUA）で原文を読んだ。
#   サッカーキング・フットボールチャンネル2本（パレス側・リヨン側）、クリスタル・パレス公式（cpfc.co.uk の前日会見記事）、BBC Sport のパレスのチームページ。
# 一次情報: サージュ監督の発言は、クラブ公式の英語原文
#   「JP Mateta will not be here tomorrow. Dean Henderson, Takehiro Tomiyasu, Ben Chilwell too. … Everybody else is here and available.」
#   と、日本語の記事（サッカーキング）の訳が一致。BBC も「Mateta, Henderson, Tomiyasu and Ben Chilwell will not be involved」と書く。
#   公式の原文には、日本語の記事に無い一文（EL登録外の選手は遠征していない）が間にある → 日本語の記事の引用は切れていないが、間が1文抜けている。台本は日本語の記事の引用をそのまま使い、補わない。
# 冨安の怪我・欠場の理由: 記事に書いてある範囲だけ（ふくらはぎ。9/20リーズ戦で前半のみで交代、日本代表は不参加、10/11フォレスト戦は欠場）。診断名・復帰時期は書かない。
# 資料間のずれ: フットボールチャンネルは「9日のリーズ戦前日会見」と書くが、リーズ戦は9/20。フォレスト戦の前の会見の言葉（BBC）と読む。→ 日付を言わず「前の会見」とだけ言う。
# フォンセカ監督の発言は、フットボールチャンネル（リヨン公式サイトの会見紹介を訳したもの）の日本語。フランス語の原文は読んでいない。
# 反応（ネット民・海外のファン）: 取れなかった。まとめ4サイトのRSSと reactions --find で探したが、今日の話についての書き込みは無い（ヒットしたのは古いボローニャ時代のスレだけ）。作らない。→ 反応なしで報告する。
