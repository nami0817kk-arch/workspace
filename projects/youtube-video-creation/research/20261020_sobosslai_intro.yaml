- id: story
  heading: 数字の外にある話。父と、副キャプテンの仕事
  tier: 報道
  main: true
  telop: 父の練習と、ピッチの上で話す人
  narrator: 解説
  card:
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['3歳〜', 父が、コーチとして練習を始めた]
    - ['2026年8月', イラオラ監督が、副主将に選んだ]
    source: Bundesliga・リヴァプール公式
  say:
  - text: リヴァプールのソボスライ。今季は6試合1ゴール、昨季は36試合6ゴール。
    image: assets/images/20261020_sobosslai_intro/09_v.jpg
    short_only: true
    card: none
  - text: ひとつは、少年時代。父のゾルトは、元サッカー選手でした。
    image: assets/images/20261020_sobosslai_intro/01_w.jpg
    card: none
  - text: ライプツィヒに来たころ、本人は、こう語っています。
    image: assets/images/20261020_sobosslai_intro/04_w.jpg
    card: none
  - voice: ソボスライ
    text: 練習が終わっても、父は、僕を鍛え続けました。
  - voice: ソボスライ
    text: 僕は、いつも、みんなより多くやってきたんです。
    cont: true
  - voice: ソボスライ
    text: 父は、僕が育つうえで、いちばんの鍵でした。
    cont: true
    pause: 0.6
  - text: もうひとつは、いまの立場。8月、イラオラ監督が、副キャプテンに選びました。
    image: assets/images/20261020_sobosslai_intro/02_w.jpg
    card: none
  - text: 主将はファン・ダイク。副主将は、アリソンとゴメスと、ソボスライです。
    card: none
  - text: 副主将としての振る舞いを、本人は、こう語っています。
    card: none
  - voice: ソボスライ
    text: ロッカールームでは、あまり話さないかもしれません。
  - voice: ソボスライ
    text: そのための選手は、ほかにいます。
    cont: true
  - voice: ソボスライ
    text: 僕は、ピッチの上で、話したいんです。
    cont: true
    pause: 0.6
  - text: そのピッチを、ソボスライは、しばらく離れます。
    image: assets/images/20261020_sobosslai_intro/01_w.jpg
    card: none
    pause: 0.5
  quotes_from:
  - https://www.bundesliga.com/en/bundesliga/news/dominik-szoboszlai-5-things-on-rb-leipzig-s-new-attacker-haaland-rose-13971
