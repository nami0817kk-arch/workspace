  - text: 市場価値は1億ユーロ。リヴァプールのソボスライ、6月3日付けの過去最高です。
    image: assets/images/20261020_sobosslai_intro/02_w.jpg
    card: &hook_stats
      type: stats
      title: ドミニク・ソボスライ 25歳
      items:
      - ['1', 億ユーロ, 市場価値。6月3日付けで過去最高]
      - ['473', 分, 今季のプレミア。7試合のうち6試合]
      - ['1', ゴール, 開幕戦99分のPK]
      focus: 0
  - text: ところが今季のプレミアは、6試合で473分。ゴールは、たった1つ。
    emph: true
    image: assets/images/20261020_sobosslai_intro/11_w.jpg
    card:
      <<: *hook_stats
      focus: 1
  - text: 昨季は、36試合で3233分、6ゴール。今季は、まだ6試合です。
    card:
      <<: *hook_stats
      focus: 1
  - text: そして今季の1点は、開幕戦、99分に決めたPKでした。
    card:
      <<: *hook_stats
      focus: 2
  - text: さらに、10月17日のブレントフォード戦は、32分でピッチを離れています。
    image: assets/images/20261020_sobosslai_intro/07_w.jpg
    card: none
  - text: それでも本人は、足りないと言います。昨季のクラブ年間最優秀選手が、です。
    image: assets/images/20261020_sobosslai_intro/01_w.jpg
    card: none
  - voice: ソボスライ
    text: まだ上があります。満足したことは、ありません。
  - voice: ソボスライ
    text: 子どものころから、これで十分だと、思ったことがなかった。
    cont: true
    pause: 0.5
