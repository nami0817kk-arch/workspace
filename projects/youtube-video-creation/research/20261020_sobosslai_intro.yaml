      source: ESPN・Transfermarkt
  - text: 8月23日、開幕のニューカッスル戦。90分を回って、1対2で負けています。
    card:
      <<: *recent_card
      highlight_row: 0
  - text: 99分、ムニョスが倒されてPK。左上へ蹴り込み、土壇場の同点です。
    emph: true
    image: assets/images/20261020_sobosslai_intro/11_w.jpg
    card: none
  - voice: ソボスライ
    text: 主審の笛が、聞こえなかったんです。
  - voice: ソボスライ
    text: 敵が5万人。自分の声も聞こえない。
    cont: true
  - voice: ソボスライ
    text: だから、サッカーが好きなんです。
    cont: true
    pause: 0.5
  - text: 9月9日、チャンピオンズリーグ初戦。アトレティコ戦で同点ゴール。2対1の逆転勝ち。
    image: assets/images/20261020_sobosslai_intro/02_w.jpg
    card: none
  - text: 代表から戻ると、太もも裏に張り。シティ戦と、オーストリアのラスク戦を欠場します。
    image: assets/images/20261020_sobosslai_intro/01_w.jpg
    card:
      <<: *recent_card
      highlight_row: 5
  - text: 10月17日、ブレントフォード戦で戻りますが、32分で交代しました。
    image: assets/images/20261020_sobosslai_intro/07_w.jpg
    card:
      <<: *recent_card
      highlight_row: 6
  - text: 試合後、イラオラ監督は、愛称のドムで呼びながら、こう話しました。
    card: none
  - voice: イラオラ監督
    text: ドムが感じたのは、同じケガです。新しいケガではありません。
  - voice: イラオラ監督
    text: 治りきっていなかったのでしょう。もう少し、時間が必要です。
    cont: true
    pause: 0.5
  - text: 復帰の時期は、10月17日の時点で、示されていません。
    emph: true
    image: assets/images/20261020_sobosslai_intro/09_w.jpg
    card: none
