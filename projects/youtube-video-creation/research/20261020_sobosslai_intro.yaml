# ドミニク・ソボスライ（リヴァプール／ハンガリー代表）の紹介。選手紹介の8節の型（2026-10-20、シリーズ「有名選手の紹介」）。
# 見本は research/20261019_rogers_intro.yaml・20261018_wirtz_intro.yaml。**FotMob は使わない**。パーセンタイル・同じ位置との順位・レーダー・シュートマップは出さない。
# 数字は基本の数と自分で割った90分あたり。取材はブラウザの道具・JavaScript実行を使っていない（requests と WebSearch のURL探しだけ。検索のAI要約は使っていない）。
#
# **題材一覧の題案「市場価値1億ユーロ、リヴァプールの25歳に今季の数字で何が見えるか」の数字を一次で読み直した結果**
# - 市場価値：Transfermarkt API（tmapi-alpha /player/451276、2026-10-19 取得）の最新は **1億ユーロ、日付は 2026-06-03**（過去最高でもある。その前は 2026-03-09 も1億、2025-12-09 は8500万）。
#   → 題の「1億ユーロ」は合っている。ただし**10月に入っても更新が無い6月の値**なので、語りは「6月3日付け」と日付を付ける（Transfermarkt の推定）。
# - 年齢：25歳（2000-10-25 生まれ。10月25日に26歳になる）。
# - 今季の出場時間・得点：Transfermarkt の試合記録と ESPN の試合記録（site.api.espn.com）が一致。プレミア 6試合出場（7試合中）473分 1得点0アシスト。
#   **リーグ戦の1得点は開幕戦のPK**（ESPN：90分+9分「Penalty - Scored」。リヴァプール公式の試合記事は「99分」）。
#   プレミア公式の記録は読み直していない（一次の公式記録はリヴァプール公式のクラブ記事と ESPN の試合記録で代えた）。
#
# **数字の出どころ**
# - Transfermarkt API（各1回、8秒空けて取得。控えは research/raw/20261020_sobosslai_tm.json）：生年月日・身長・契約・市場価値の推移、季ごとの試合・得点・アシスト・出場時間、
#   試合ごとの出場分数・欠場の状態（injured）・シュート数（scoringAttempts）・PK得点。移籍の記録の取得（/transfer-history）は404で取れず、移籍金は Wikipedia の報道の記述に頼る（→ 報道・背景）。
# - ESPN（site.api.espn.com の試合記録 3試合：スコア・得点者・得点の分・交代の分とケガによる交代の記載）：ニューカッスル戦のPKは90+9分、ブレントフォード戦の交代は32分（ケガのため）。
# - リヴァプール公式（本文を読んだ）：新契約のインタビュー全文（7/17）・副主将のインタビュー・ニューカッスル戦の試合記事とソボスライの試合後の言葉・
#   ブレントフォード戦後のイラオラ監督の会見・シティ戦前の欠場の発表・ゴール・オブ・ザ・マンス（トッテナム戦）・アトレティコ戦の試合記事。→ 確定（クラブ公式の発表）。
# - Bundesliga公式（本文を読んだ、ライプツィヒ加入のころの記事）：父の指導・フェニクス・ゴールド・本人の言葉。→ 報道。
# - 英語版 Wikipedia（2026-10-17 更新まで）：経歴・移籍・代表歴・受賞・クラブ別のリーグ戦の試合と得点。→ 背景。
#
# **自分で数えたもの**
# - 通算：Wikipedia のリーグ戦（リーフェリング42試合16得点・ザルツブルク56試合16・ライプツィヒ62試合12・リヴァプール111試合16）＋代表69試合18得点
#   ＝ 340試合78得点（クラブはリーグ戦だけ、代表は全試合）。リヴァプールの111試合16得点は TM の記録（33+36+36+6試合、3+6+6+1得点）と一致。
# - 全公式戦（クラブのみ、代表は含めない。TM の大会ごとの記録を足した）の試合／得点／出場分：20/21（ザルツブルク）22／9／1657、21/22 ライプツィヒ 45／10／2127、22/23 ライプツィヒ 46／10／3710、
#   23/24 リヴァプール 45／7／2704、24/25 49／8／3430、25/26 53／13／4736、26/27 8／3／591。90分あたり得点＝得点×90÷出場分：0.49・0.42・0.24・0.23・0.21・0.25・0.46。
# - プレミアのリーグ戦の比べ：リヴァプール3季（23/24〜25/26）＝105試合・7841分・15得点・17アシスト・シュート198本（TM の記録）、PKでの得点0。
#   ゴール 15×90÷7841＝0.17、アシスト 17×90÷7841＝0.19、合計 32×90÷7841＝0.37、シュート 198×90÷7841＝2.27。
#   今季＝6試合・473分・1得点（PK）・0アシスト・シュート14本。ゴール 90÷473＝0.19、アシスト 0、合計 0.19、シュート 14×90÷473＝2.66。
#   出場できた時間の割合＝出場分÷（クラブのプレミア試合数×90）：23/24 2111÷3420＝62%、24/25 2497÷3420＝73%、25/26 3233÷3420＝95%、3季 7841÷10260＝76%、今季 473÷630＝75%。
#   合計 0.19÷0.37＝0.52（ほぼ半分）。
# - 市場価値の倍率：2017-07-02 の20万ユーロ → 2026-06-03 の1億ユーロ＝500倍。2023-10-09（リヴァプール加入直後）の7000万 → 1億＝約1.4倍。
# - 今季：クラブの公式戦8試合（プレミア6・チャンピオンズリーグ1・リーグカップ1）591分3得点（プレミアのPK、アトレティコ戦の同点ゴール、トッテナム戦の25ヤード）。
#   プレミアの7試合はリヴァプール3勝3分1敗（ニューカッスル2-2・フォレスト2-2・イプスウィッチ2-0・フラム0-0・ボーンマス1-0・シティ0-3・ブレントフォード2-1）。
#
# **入れなかったもの**：私生活（結婚・家族）、年俸・代理人、ハンガリー代表のすべての試合の数字、移籍金の媒体ごとの食い違い（ポンドとユーロ）、
#   代表ウィークの試合ごとの内容、チームの順位の話、他の選手との優劣の話、前任のスロット監督の評価。
# **日本語名・読みで怪しいもの**：ソボスライ（辞書は ドミニク・ソボスライ）、イラオラ、リーフェリング、ザルツブルク、ライプツィヒ、セーケシュフェヘールヴァール、
#   ニューカッスル、ノッティンガム・フォレスト、イプスウィッチ、ボーンマス、ブレントフォード、ラスク、ファン・ダイク、ムニョス、ゴメス、フェニクス・ゴールド、ゾルト。
#
# 本人・監督の言葉は6か所（自訳。原文は上の出典）：①フック（新契約のインタビュー）②歩んだ道（同）③今季（ニューカッスル戦後のインタビュー）④今季（イラオラ監督の会見）
#   ⑤数字の外・父（Bundesliga公式）⑥数字の外・副主将（副主将のインタビュー）。
