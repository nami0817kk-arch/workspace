  say:
  - text: 今季のクラブの公式戦は、8試合で591分、3得点。プレミアでは、6試合です。
    image: assets/images/20261020_sobosslai_intro/09_w.jpg
    card: &recent_card
      type: table
      title: プレミアの今季7試合（ソボスライ）
