      - - 55分
        - フランスが同点に追いつく
      - - 試合後
        - 1対1の引き分け
      focus: 0
      highlight_row: 0
    image: assets/images/20261120_roberto_carlos_legend/02_w.jpg
  - text: ゴールから、30メートル以上離れた位置です。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/03_w.jpg
  - text: 蹴るのは、ロベルト・カルロス。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/02_w.jpg
  - text: 左足で蹴ったボールは、ゴールの右へ大きく逸れます。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/03_w.jpg
  - text: ボールボーイが、思わずよけるほどでした。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/02_w.jpg
  - text: ところが、ボールは曲がって戻り、ゴールの中へ。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/03_w.jpg
    emph: true
  - text: フランスのゴールキーパー、バルテズは、立ったまま動けませんでした。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/02_w.jpg
  - text: のちに、史上最高のフリーキックと呼ばれるようになります。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/03_w.jpg
  - text: 試合は、55分にフランスが追いついて、1対1の引き分けでした。
    card:
      type: timeline
      title: 1997年6月3日 トゥルノワ・ド・フランス フランス戦
