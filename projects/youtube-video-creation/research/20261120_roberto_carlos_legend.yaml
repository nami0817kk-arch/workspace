  - text: ブラジルの相手は、開催国のフランス。
    card: none
    image: assets/images/20261120_roberto_carlos_legend/03_w.jpg
  - text: 前半21分。ブラジルが、フリーキックを得ます。
    card:
      type: timeline
      title: 1997年6月3日 トゥルノワ・ド・フランス フランス戦
      rows:
