# ロベルト・カルロス（元ブラジル代表DF、レアル・マドリード11シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-20 用。8節の変形（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Roberto Carlos 本文・Honours、1997 Tournoi de France、1998・2002 Intercontinental Cup、2002 FIFA World Cup final）と自分で足した値だけ。
# **私生活・法的な問題・ドーピング疑惑・差別事件は入れない**。
# **重なりの確認（2026-11-12）**：scripts/・research/covered.yaml・research/posted.json・research/2026111*_picks.txt を「ロベルト・カルロス／Roberto Carlos」で grep。主役の回は無し。同じ日（11/20）の別シリーズに同名なし（20261119_picks.txt）。
# **引退の確認**：Wikipedia「announced his retirement from playing at the age of 39 in 2012 ... briefly came out of retirement in 2015 (Delhi Dynamos 選手兼監督)」。→ 現役ではない（53歳）。
# **数字の出どころと自分で足した値**
# - 通算（サムネの表）：レアル 584試合71点（本文）、ブラジル代表 125試合11点（本文）、合計 709試合82点（自分で足した値）。ほかのクラブは除く。
# - 主要タイトル13個（Honours の Real Madrid）：La Liga 4（96-97・00-01・02-03・06-07）、スーペルコパ3（1997・2001・2003）、CL 3（97-98・99-00・01-02）、UEFAスーパー杯1（2002）、インターコンチネンタル2（1998・2002）＝13。暦年で割ると 1997〜2003＝12個、2004〜2006＝0個、2007＝1個（自分で数えた）。
# - 日本：1998-12-01 国立競技場 レアル2-1ヴァスコ・ダ・ガマ（ラウール83分、先発）／2002-06-30 横浜 W杯決勝 ブラジル2-0ドイツ（ロナウド67・79分、左ウイングバック先発）／2002-12-03 横浜 レアル2-0オリンピア（ロナウド14分・グティ84分、先発）。いずれも Wikipedia の試合ページのラインナップ。
# - 1997-06-03 リヨン、フランス1-1ブラジル。RC の FK は21分（試合ページ。距離は記事ごとに差があるので「30メートル以上」）、フランスの同点は55分（ケレール）。バルテズ・ボールボーイ・「史上最高のFK」・2010年の論文は本人記事の本文。
# - 退団発表 2007-03-09、最終節マジョルカ3-1で優勝、最後のゴールはレクレアティボ戦の追加時間の決勝点（本文）。
# - 2002-03 最終節ビルバオ戦（日付は本文に無いので書かない） FK（前半追加時間に2-1、試合は3-1）／1998-02 テネリフェ戦のボレー／2002年ナイキCM（ナカタ共演）：本文。
# **本人の言葉**：取れていない。声の行は置かない。
# **入れなかったもの**：私生活・家族・宗教・結婚、ドーピング疑惑、ロシアの差別事件、2006年W杯のアンリの失点、2007年のバイエルン戦の失点の細部（敗退の事実だけ）。
# **読みで怪しいもの**：ロベルト・カルロス、ヴァスコ・ダ・ガマ、パルメイラス、オリンピア、グティ、バルテズ、レクレアティボ、トゥルノワ・ド・フランス、シバススポル、デリー・ダイナモス、フェネルバフチェ、アンジ、テネリフェ、コパ・デル・レイ、マジョルカ、ビルバオ。
