- id: match
  heading: 1997年のフランス戦で、ロベルト・カルロスは何を決めたのか
  tier: 報道
  telop: 前半21分、曲がって戻ったFK
  main: true
  say:
  - text: ロベルト・カルロス。
    card: none
    short_only: true
