  say:
  - text: 2025年から26年、マインツはカンファレンスリーグに出ました。
    image: assets/backgrounds/stadium_マインツ.png
  - プレーオフは、ノルウェーのローゼンボリに合計5対3で勝ち。
  - リーグフェーズは6試合で4勝。フィオレンティーナにも2対1で勝ち。
  - text: ベスト16は、チェコのシグマ・オロモウツに合計2対0で勝ち。
    card:
      type: table
      title: 2025-26のカンファレンスリーグ
      columns: *id005
      rows:
      - - ベスト16
        - シグマ・オロモウツに合計2対0
      - - 準々決勝
        - ストラスブールに合計2対4
    image: assets/backgrounds/stadium_マインツ.png
  - ヨーロッパの大会で、ベスト16を勝ち抜いたのは、クラブで初めてです。
  - 準々決勝はフランスのストラスブール。ホームでは2対0で勝ちました。
  - しかし敵地で0対4。合計2対4の負けで終わりました。
  sources:
  - https://en.wikipedia.org/wiki/1._FSV_Mainz_05
  bg: assets/backgrounds/stadium_マインツ.png
