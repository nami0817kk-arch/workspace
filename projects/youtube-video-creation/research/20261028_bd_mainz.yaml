- id: coaches
  heading: クロップとトゥヘル。なぜマインツから名監督が出たのか
  tier: 背景
  telop: フランクが新しい守り方を持ち込み、クロップ、トゥヘルへ
  narrator: 解説
  main: true
  card:
    type: table
    title: マインツの監督（抜粋）
    columns: &id001
    - 在任
    - 監督
    rows:
    - - 1995-2000
      - ヴォルフガング・フランク
  say:
  - 1990年代、マインツは2部で残留を争っていました。
  - そこへヴォルフガング・フランク監督が、新しい守り方を持ち込みます。
  - 最後尾に余る選手、リベロを置かず、4人が横に並んで地域を守る形。
  - ドイツのクラブでは、早い採用でした。
  - text: その下でプレーしていたのが、ユルゲン・クロップです。
    card: none
    image: assets/images/bd_mainz_klopp/scene.jpg
  - text: 選手としては1990年から11年在籍。リーグ戦**325試合**に出ました。
    card:
      type: table
      title: マインツの監督（抜粋）
      columns: *id001
      rows:
      - - 2001-2008
        - ユルゲン・クロップ
  - 2001年2月、引退してすぐに監督へ。2004年、クラブを初めて1部に上げました。
  - 1部では予算もスタジアムもリーグでいちばん小さいなか、1年目は11位でした。
  - text: 2008年にドルトムントへ移り、そこでリーグ優勝を果たします。
    card:
      type: table
      title: マインツの監督（抜粋）
      columns: *id001
      rows:
      - - 2009-2014
        - トーマス・トゥヘル
  - text: 2009年に1部の監督を任されたのは、トーマス・トゥヘル。
    image: assets/images/bd_mainz_tuchel/scene.jpg
  - 前の1年は19歳以下のチームを率い、ドイツ王者にしていました。
  - text: 2010年から11年のシーズンは、開幕から7連勝。1部の開幕記録に並びました。
    card:
      type: table
      title: マインツの監督（抜粋）
      columns: *id001
      rows:
      - - 2025-
        - ウルス・フィッシャー
  - この年の5位は、いまもクラブの1部での最高順位です。
  - 2015年、トゥヘルもクロップと同じく、ドルトムントの監督に。
  - フランクの守り方を学んだ選手を監督にし、ユースの監督を1部へ引き上げる。
  - 内側から人を育てたことが、2人の出発点でした。
  sources:
  - https://en.wikipedia.org/wiki/1._FSV_Mainz_05
  - https://en.wikipedia.org/wiki/J%C3%BCrgen_Klopp
  - https://en.wikipedia.org/wiki/Thomas_Tuchel
  - https://en.wikipedia.org/wiki/Wolfgang_Frank
  bg: assets/backgrounds/stadium_マインツ.png
  official: false
