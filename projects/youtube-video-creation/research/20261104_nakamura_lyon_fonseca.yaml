# 取材メモ（2026年11月4日）中村敬斗のリヨン、フォンセカ監督がスポルティングへ（ニュースのショート。見せ方 X＝冒頭に強い一言）
# 取材: 2026-11-04（10時台 JST）。requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: サッカーキング 2026-11-03「中村敬斗在籍のリヨン、スポルティング行き迫るフォンセカ監督の後任はペップの元副官か」（全文。レキップの報道）。
# 出典で確かめたこと:
#   ・ESPN の試合データ（fra.1 summary event=401876418、11/1 16:15 UTC）: リヨン 2-0 アンジェ。
#       38分 ヌアマ（右足、アシスト トリソ）／86分 トリソのヘディング（"Assisted by Felix Bacher following a corner"）。
#       中村は先発で交代なし（＝フル出場）。ESPN の中村のアシストは 0（記録上のアシストはバッハー）。
#   ・サッカーキング 2026-11-02（2223786）: アンジェ戦でフル出場、「左コーナーキックからコランタン・トリッソのゴールをアシスト」。
#       現地メディア（Olympique & Lyonnais）が「洗練された仕事人」、先制点の「起点」、ファイナルサードのパス成功率87%。
#       → 記事は「加入後初アシスト」と書くが、ELで2アシスト（10/15 パレス戦、ESPN）があるので「初」は使わない。
#       → アシストの数は記録（ESPN はバッハー）と報道で食い違うので、台本は「中村の左コーナーキックから」とだけ言う。アシストとは言わない。
#   ・Football ZONE 682363: 「今季リーグ戦初先発でアシスト」「後半41分には左コーナーキックのキッカーに立って追加点を導いた」。→ リーグ戦初先発は ESPN の各試合でも確かめた（下）。
#   ・Olympique & Lyonnais 411769（11/1 試合の採点）: 中村は「先制点につながる場面の起点。中央で起点になってから、左のアブネルへ展開」。34分の突破。
#   ・Olympique & Lyonnais 411803（11/2）: アンジェ戦がフォンセカ監督のリヨンでの最後の試合。2点目のあと、先発の11人全員がベンチへ向かい監督の腕に飛び込んだ。
#       日曜に選手たちへ（長くはいないと）伝えた。行き先はスポルティングとの契約。
#   ・Olympique & Lyonnais 411773（11/1 試合後の会見）: フォンセカ監督 "J'aime beaucoup ce groupe, nous avons une connexion très forte.
#       C'était seulement l'émotion d'une personne qui aime beaucoup ses joueurs."（2点目の喜び方を聞かれて）／去就は「正直、分からない」。
#       → 台本の言葉は、このフランス語を私が日本語にしたもの（ce groupe は「このチーム」と訳した）。語順はなぞらず、日本語として通るように直した。
#   ・Olympique & Lyonnais 411856（11/2）: 月曜に練習場で選手に別れを伝えた（RMC の報道を引用）。クラブの正式発表はまだ。
#   ・Olympique & Lyonnais 411811（11/2）: リヨンでの47勝目が最後の勝利。契約は2027年6月まで。リヨンは3位（勝ち点17）。
#       ESPN 順位表（11/4 取得）: 1位PSG 20、2位リール 18、3位リヨン 17（9試合）。
#       ※サッカーキングの「勝ち点14の5位」はアンジェ戦の前の数字なので使わない。
#   ・A Bola 2026-11-03 18:24「Paulo Fonseca já está em Lisboa para assinar pelo Sporting」: 火曜（3日）の夜にリスボンの空港に到着。リヨンを離れルイ・ボルジェスの後任に。
#       言葉 "Depois teremos tempo de falar. … Sporting fez-me mudar de ideias quanto a um regresso a Portugal? Claro." 水曜に契約・お披露目の見込み。
#       → 台本では「3日の夜にリスボンに着いた」事実だけ使う。言葉は短い挨拶なので使わない（題に答えない）。
#   ・Record（ポルトガル）見出し: 「Paulo Fonseca chega hoje: treinador vai assinar até 2030」→ 契約年数は見出しだけなので使わない。
#   ・Olympique & Lyonnais 411947（11/3）: 暫定でコーチのジョルジェ・マシエル氏が、5日のEL ソシエダ戦と9日のブレスト戦を指揮する。
#   ・後任: サッカーキング（レキップ）／Olympique & Lyonnais 411800（A Bola）: カルロス・ビセンス氏（43歳）が有力。
#       2021-22季から2025年6月までグアルディオラ監督のもとでシティのトップチームのコーチ。2025年7月から今年10月までブラガの監督。→ 報道。
#   ・ESPN scoreboard 2026-11-05: Lyon at Real Sociedad（EL、レアレ・アレナ）。→ 久保建英との日本人対決は1行だけ（別の本で久保を扱う）。
#   ・確度: 監督の退団・スポルティング行きは報道（11/4 10時 JST 時点でリヨン・スポルティングの正式発表は見つからない）。
#       公開前に正式発表が出ていれば tier を確定にし、「報じられています」を直す。
# 自分で数えたもの（ESPN の各試合の交代時刻。90分までで数えた。追加時間は入れない）:
#   リーグ戦の中村: パリFC戦 75分から15分／レンヌ戦 79分から11分／ランス戦 60分から30分／ニース戦 61分から70分の退場まで9分 → 途中出場4試合で計65分。
#   アンジェ戦 先発・交代なしで90分。→ 1試合で、それまでの4試合を足した65分を超えた。（ELは別。ELは3試合とも先発）
# 前の本との重なり: scripts/20261010_lyon_nakamura（リヨンでの出場時間「3試合を足しても56分」）／20261016 ELで2アシスト／20261019〜1023 退場・謝罪・処分。
#   → 今回の初出: 監督の退団・リーグ戦初先発の90分・2点目のCK・監督の試合後の言葉・暫定監督・後任候補。
#   出場時間の数え方は10/10と同じ型だが、数字は4試合65分→初先発90分に更新した新しい比べ。退場の話は繰り返さない。
# 本人の言葉: 無い。中村本人の発言（試合後・SNS）は、サッカーキング・Football ZONE（クラブ公式Xの喜ぶ映像の記事のみ）・ゲキサカ・Olympique & Lyonnais で見つからない。
#   フォンセカ監督の中村評も見つからない（試合後の言葉は選手全体への言葉）。→ X。
# 反応: 0件。Olympique & Lyonnais のコメント欄に中村を挙げた投稿が2件あったが、どちらも投稿の前半か後半が別の話（アジアカップ・他の選手）なので使わない。
