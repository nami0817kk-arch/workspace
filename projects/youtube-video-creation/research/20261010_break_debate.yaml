- id: cost
  heading: 20クラブのうち、17クラブがけが人を抱えて戻った
  tier: 報道
  telop: プレミアで無事だったのは3クラブだけ。アーセナルは6人が離脱して戻ってきた
  narrator: キャスター
  card: &hurt
    type: table
