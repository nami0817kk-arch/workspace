- id: view
  viewpoint: true
  heading: 「3週間」と「16日」がずれている理由
  tier: 背景
  telop: 現場が数えているのはクラブの試合の間隔。それなら19日で、約2.7週間になる
  narrator: 解説
  card: &gap
    type: calc
    title: どこからどこまでを数えるか
    terms:
    - - '19'
      - クラブの試合の間隔
    - - '7'
      - 1週間の日数
    - - '2.7'
      - 週にすると
    ops:
    - ÷
    - ＝
  say:
  - text: シメオネは「3週間の中断」と言いました。制度の上では16日です。
    card: *gap
  - text: 数え方が違います。現場が数えているのは、クラブの試合と試合の間隔です。
    card: *gap
  - text: 9月20日の試合から10月9日の試合まで19日。約2.7週間になります。
    card: *gap
    emph: true
  - text: つまり誇張ではなく、監督が立っている場所からはそう見えるということです。
    card: none
    image: assets/images/20261010_break_flick/03.png
  - text: もうひとつ、フリックは制度を批判しながら、代表の監督は褒めています。
    card: &praise
      type: points
      title: フリックが分けて話していたこと
      items:
      - 仕組みは「最善のやり方ではない」
      - 代表の監督は「完璧だ。出場時間を管理してくれた」
      - 自分には変えられない、受け入れるしかない
  - voice: フリック
    text: 彼が私の選手たちにしていることも評価している。完璧だ。
    card: *praise
  - text: 代表が悪い、という話にはしていません。仕組みが削っている、という立て方です。
    card: *praise
  - text: そして同じ16日間が、あと4回来ます。
  - text: 今年を入れれば、5回目までが決まっている計算です。
    card: none
    emph: true
