  say:
  - text: フリックの言葉だけでなく、数のほうも残っています。
    card: *hurt
  - text: 20クラブのうち17クラブが、誰かをけがで失って戻ってきました。
    card:
      <<: *hurt
      highlight_row: 4
    emph: true
  - text: 無事だったのはフルアム、ノッティンガム・フォレスト、イプスウィッチの3つだけ。
    card:
      <<: *hurt
      highlight_row: 4
  - text: いちばん多かったアーセナルは6人。リヴァプールが4人と続きます。
    card:
      <<: *hurt
      highlight_row: 0
  - text: そのリヴァプールは17人を送り出し、その17人が合わせて51試合に出ています。
