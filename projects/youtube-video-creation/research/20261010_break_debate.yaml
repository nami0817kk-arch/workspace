# 取材メモ（10/10 題材 break_debate、型は news、その他枠）。材料の控えは research/raw/20261010_break_debate_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場の節を切り出す）。
# **題材の前提の誤りを2つ直して使っている**（材料 0）：
#   ① **2人は同じ会見で話していない。**フリックは10月9日のヘタフェ戦前の会見、
#      シメオネは同じ10月9日のアラベス戦前の会見。**別々の会見**で、互いに相手に言及していない。
#      台本では「同じ日に、別々の会見で」と**必ず言う**。②の見出しにも「別々の会見」と入れた。
#   ② **2人とも「見直すべきだ」とは言っていない。**原文は
#      シメオネ「habría que valorarlo（評価すべきだろう）」「ojalá hablen algún día con los jugadores」、
#      フリック「Debemos reflexionar si era necesario que jugase en Australia」「No es la mejor manera」。
#      **2人の言葉はそのまま引き、「近いことを言った」という受けはこちらの言葉として別に置く。**
# フリックの会見は**英語で行われ、スペインの媒体がスペイン語に訳して出している**（材料 2 の但し書き）。
#   英語の原文は取れていないので、**訳の形から日本語にした**ことが分かるよう、②で「英語で答えた」と言っている。
# **「3万キロ」は Libertad Digital の表記にだけある**（材料 7-1）ので使わず、
#   FútbolFantasy の「何千キロも」の形に揃えた。**どちらを採ったかはここに残す。**
# シメオネの英語訳はファンのアカウントのもの（材料 3-2）なので**使っていない**。
#   新華社にだけある「ほとんどが4試合、何人かは3試合」（材料 7-2）も**使っていない**。
# **離脱した選手の総数はどの媒体も出していない**（材料 8）。だから③はクラブ単位・リーグ単位の数字だけにした。
#   **PSVの17人は使っていない**（同じ日の psv_sano で使うため。材料 7 の指示どおり、こちらは
#   UEFA・フリック・シメオネを軸にして、リヴァプールとプレミアの集計で受ける）。
# 数字の重なり対策：『16日間』『55』『54』は①だけ。『20クラブ』『17クラブ』『6人』『51試合』は③だけ。
#   『19日』『2.3週間』『4回』は④だけ。
# 写真は Commons の2枚。フリック＝File:2022 Hansi Flick (cropped).jpg（CC BY-SA 4.0 / Steffen Prößdorf、2022年）、
#   シメオネ＝File:25th Laureus World Sports Awards …(cropped).jpg（CC BY-SA 4.0 / Barcex、2024年）。
#   **会見の写真は記事から取れなかった**（スペインの媒体の og:image は当たったが人物が別だった）ので、この2枚で通す。
#   本文の下地はフリックの1枚で通し、シメオネの節で1回だけ入れ替える（入れ替えは1回）。
# サムネ：構図 versus（2人を左右に並べる。別々の会見で近いことを言った、という題に合う）。
# ネットの反応は集めていない（材料の方針）。
