  say:
  - text: 今年から16日間に延びた代表ウィークに、スペインの監督たちが口を開きました。
    short_only: true
  - voice: シメオネ
    text: 競技の面では、連続性が壊れる。
    emph: true
    card: *pressers
    image: assets/images/20261010_break_simeone/02.jpg
  - voice: シメオネ
    text: いつか選手たちと話して、この最初の経験を評価してほしい。
    cont: true
  - text: アトレティコ・マドリードのシメオネ。アラベス戦の前日の会見です。
    card:
      <<: *pressers
      highlight_row: 0
  - voice: シメオネ
    text: 人々は彼らの最高の姿を求めている。
    card: none
  - voice: シメオネ
    text: そしてその場面が起きることは、どんどん遠ざかっている。
    cont: true
    card: none
  - voice: シメオネ
    text: 経済的に代表チームに都合がいいのは明らかだが、
    cont: true
    card:
      <<: *pressers
      highlight_row: 0
  - voice: シメオネ
    text: 選手たちと話して評価すべきだろう。
    cont: true
    card: none
  - voice: シメオネ
    text: プレーしているのは彼らなのだから。
    cont: true
    card:
      <<: *pressers
      highlight_row: 0
  - text: 同じ日、バルセロナのフリックはヘタフェ戦の前の会見で答えています。
    card:
      <<: *pressers
      highlight_row: 1
    image: assets/images/20261010_break_flick/03.png
  - voice: フリック
    text: オーストラリアでプレーする必要があったのか、
    card:
      <<: *pressers
      highlight_row: 1
  - voice: フリック
    text: 何千キロも移動する必要があったのか、我々は考えるべきだ。
    cont: true
    card: none
  - voice: フリック
    text: これは受け入れなければならない状況だ。
    card:
      <<: *pressers
      highlight_row: 1
  - voice: フリック
    text: いつも増えていくばかりだから。
    cont: true
    card:
      <<: *pressers
      highlight_row: 1
  - voice: フリック
    text: 最善のやり方ではない。私には変えられない。
    cont: true
    card: none
  - text: 2人は対談したわけではなく、互いに相手の名前も出していません。
    card: none
  - text: 別々の場所で、近いことを言った。そういう1日でした。
    card: none
    emph: true
