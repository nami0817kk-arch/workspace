  - text: 1人あたり3試合。上位のクラブほど重く受けることになります。
    card: *lfc
  - voice: ニコ・コヴァチ
    text: 2週間から2週間半、勢いがまったく無い状態で過ごす。
    card: none
  - voice: ニコ・コヴァチ
    text: そういう問題もある。
    cont: true
    card: none
  - voice: ニコ・コヴァチ
    text: ある意味、我々は全員いまゼロから始めている。
    cont: true
    card: none
