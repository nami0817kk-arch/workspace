  topic: 代表ウィーク
  title: 16日間つづいた代表ウィーク。2人の監督が同じ日に口にしたこと
  question: 今年の代表ウィークは何が変わり、現場の監督は何と言ったのか
  takeaway: 2026年から、9月と10月に分かれていた代表ウィークが1つにまとまり、9月21日から10月6日までの16日間に最大4試合が入る形になった。10月の窓は無くなり、この仕組みは2030年まで決まっている。10月8日にベルリンで開かれたUEFAの非公開の会合では、加盟55連盟のうちこの運用を擁護したのはアゼルバイジャン1つだけだった。翌9日、バルセロナのフリックはヘタフェ戦の前日会見で「オーストラリアでプレーする必要があったのか、我々は考えるべきだ」「最善のやり方ではない。私には変えられない」と話し、同じ日にアトレティコ・マドリードのシメオネはアラベス戦の前日会見で「競技の面では、連続性が壊れる」「選手たちと話して評価すべきだろう」と話した。別々の会見で、近いことを言った形になる。実際にプレミアリーグでは20クラブのうち17クラブが誰かをけがで失い、無事だったのはフルアム、ノッティンガム・フォレスト、イプスウィッチの3クラブだけだった。制度上は16日だが、クラブの試合の間隔で数えると19日あり、シメオネの言う3週間に近い
  opening_image: assets/images/20261010_break_flick/03.png
