      - 別の番組では、もっと厳しい言い方が出ました。
      - {voice: アルゼンチンのテレビ, text: 75歳になってバーでコーヒーを飲みながら、自慢し続けるタイプだ}
      - レジェンドのマリオ・ケンペスと比べる形で、敬意の欠如も指摘されました。
      - 言われた側のレヴァンドフスキは、歴代の得点ランキングで7位。チャンピオンズリーグの通算得点では歴代3位です。
