  - id: criticism
    heading: 批判が出たのは、どこからか
    main: true
    tier: 報道
    telop: アルゼンチンのESPNから
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 口論ではなく、**母国が自国の選手を叱っている**ところが芯
    card:
      type: quote
      title: マリアーノ・クロス（ESPN）
      text: 個人の実績を比べる話ではない。チームで勝つものだ
    say:
      # **ショートは山場の節だけを切り出すので、試合と口論もここに入れる**
      # （2026-09-12 ユーザー「ショートでも、試合がありそこで口論したことと、
      # 各社が猛烈に批判していることを述べて」）
      - インテル・マイアミ対シカゴ・ファイアーの試合。デ・パウルとレヴァンドフスキが、ピッチの上で口論になりました。
      - デ・パウルは、こう言い返しました。
      - {voice: デ・パウル, text: お前はいったい誰なんだ、バカ野郎}
      - {voice: デ・パウル, text: 俺はコパ・アメリカを2回、ワールドカップを1回優勝している}
      - 批判が出たのは、相手の国からではありません。母国アルゼンチンの各社が、そろって厳しく書きました。
      - ESPNの批評家、マリアーノ・クロスです。
      - {voice: マリアーノ・クロス, text: レヴァンドフスキはサッカー界のアイコンだ}
      - {voice: マリアーノ・クロス, text: 彼のキャリアは素晴らしいもので、デ・パウルのキャリアも立派ではあるが、それとは違う}
      # **ここで語りを1行はさむ**（2026-09-12）。ショートの尺詰めは
      # 「締めのかたまりの手前」から落とすので、はさまないと
      # **デ・パウルの発言が真っ先に消える**（実際に消えた）
      - そのうえで、比べること自体を否定しました。
      - {voice: マリアーノ・クロス, text: 個人の実績を比べる話ではない。チームで勝つものだ}
      - {voice: マリアーノ・クロス, text: 控え選手でもワールドカップ王者になれる}
    official: false
    sources:
