# デ・パウルのレヴァンドフスキへの発言と、母国メディアの批判（2026年9月12日）
#
# **出どころは theWORLD（日本語）。**アルゼンチンのESPN放送での批評を引いている。
# **こちらは原語まで辿れていない。**「theWORLD が伝えた」形で置く。
#
# 引きは**「批判しているのが母国のメディアだ」**。口論そのものより、
# **アルゼンチン側が自国の選手を叱っている**ところが芯。ここが山場（@main）。
#
# **デ・パウルを悪者にする書き方にしない。**言ったことは事実として置き、
# 評価は批評家の言葉に任せる。**こちらが「無礼だ」とは書かない。**
#
# **暴言の部分は、そのまま引く**（途中で切らない決まり）。
# ただし**繰り返さない。**1回だけ置く。
# **置き場所は山場の節**（2026-09-12 ユーザー「何を言ったのかもショートに」）。
# ショートは山場の節しか切り出さないので、what 節に置くと発言が入らない。
#
# **数字は記事どおり。**レヴァンドフスキは歴代得点7位、CL歴代3位
