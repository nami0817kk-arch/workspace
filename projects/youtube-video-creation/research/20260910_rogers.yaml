# モーガン・ロジャースが後半から4アシスト（2026年9月10日）。
# ユーザー指示「01のモーガン・ロジャース」
#
# **ロマーノの投稿で今日いちばん反応が大きかった**（7.4万いいね・170万表示）。
# 日本語メディアはまだ試合結果しか書いていない。
#
# 引きは**「最優秀選手に選ばれたのは誰か」**。4アシストという数字より、
# 本人が笑いながら「それは犯罪だろ」と言っているところが効く。
#
# **反応は入れない。**読める形のスレが無かった
format: news
# 本人の一言が主役の回。試合の描写が要るので割合は下げる
voice_min: 5
slot: premier
date: "2026年9月10日"

# ハッシュタグに使う人の名前
people:
  - モーガン・ロジャース
  - コール・パーマー
  - ペドロ・ネト
  - ウェルベック
  - バルコ
  - 田中碧

short_title: "4アシストしたのに、最優秀は別の人"

theme:
  id: rogers_four_assists
  league: england
  kind: other
  topic: チェルシー
  title: モーガン・ロジャースが後半から出て4アシスト。最優秀選手に選ばれたのは誰か
  hook: 0対2で折り返した試合でした。
  question: 4アシストした選手ではなく、誰が選ばれたのか

thumbnail:
  line1: 後半から出て4アシスト
  line2: 最優秀は ●●●●●
  photo: "assets/photos/20260910_rogers/01.jpg"
  tags: [チェルシー, リーズ]
  points:
    - 0対2から7分で逆転
    - 最後は6対3

sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: チェルシー 6対3 リーズ
    narrator: キャスター
    card:
      type: table
      title: カラバオ・カップ3回戦 チェルシー 6-3 リーズ
      columns: ["時間", "得点者"]
      rows:
        - ["23分", "ムハレモヴィッチ（リーズ）"]
        - ["48分", "アーロンソン（リーズ）"]
        - ["53分", "パーマー（PK／チェルシー）"]
        - ["55分", "パーマー（チェルシー）"]
        - ["60分", "ペドロ・ネト（チェルシー）"]
        - ["65分", "ウェルベック（チェルシー）"]
        - ["75分", "カルヴァート・ルーウィン（リーズ）"]
        - ["80分", "バルコ（チェルシー）"]
        - ["90+4分", "ウェルベック（チェルシー）"]
    say:
      - 9日のカラバオ・カップ3回戦、チェルシーがリーズを6対3で下しました。
      - ただ、前半に決めたのはリーズです。23分、コーナーキックからムハレモヴィッチがヘディングで先制しました。
      - 48分にはアーロンソンが決めて0対2。チェルシーは2点を追う展開になります。
      - チェルシーは後半の頭から4枚替えを敢行しました。その中にコール・パーマーとモーガン・ロジャースがいます。
      - リーズの日本代表、田中碧は67分から途中出場しました。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35753/
      - https://x.com/FabrizioRomano/status/2097814422613889350

  - id: four
    heading: 7分間で何が起きたか
    tier: 報道
    telop: 53分から60分で2点差をひっくり返す
    narrator: 解説
    card:
      type: bars
      title: モーガン・ロジャースがこの試合で関わったゴール
      items:
        - {label: "アシスト", value: 4}
        - {label: "出場した時間（分）", value: 45}
      unit: 回・分
    say:
      - ここからが本題です。53分にパーマーがPKを決めて1点を返すと、ここから7分間で試合がひっくり返ります。
      - 55分、スローインで投げ込まれたボールを、ロジャースが相手を背負ったまま腰で落としました。
      - そこにパーマーが走り込んで左足で流し込み、2対2の同点。
      - 60分にはパーマーの縦パスをロジャースが繋ぎ、ペドロ・ネトが左足で勝ち越します。
      - わずか7分間での逆転でした。
      - ロジャースはここで止まりません。65分、右サイドを突破して折り返し、ウェルベックが決めて4対2。
      - 80分にも折り返しからバルコが左足を振り抜いて5点目。
      - 後半の45分だけで、4アシストです。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35753/
      - https://x.com/FabrizioRomano/status/2097814422613889350

  - id: motm
    heading: それで、最優秀選手は誰だったか
    tier: 報道
    telop: 「それは犯罪だろ」
    narrator: 解説
    say:
      - 試合の最優秀選手に選ばれたのは、コール・パーマーでした。
      - それを聞いたロジャースが、スカイスポーツに笑いながらこう返しています。移籍情報の記者ファブリツィオ・ロマーノが伝えました。
      - {voice: モーガン・ロジャース, text: おいおい、それは犯罪だろ}
      - {voice: モーガン・ロジャース, text: 俺は4アシストしたんだぞ}
      - {voice: モーガン・ロジャース, text: あいつはPKを1本決めただけじゃないか}
      - 実際にはパーマーは2得点していますが、そのうち1本はPKでした。
      - 冗談としてのやり取りですが、後半だけで4アシストした側の言い分としては分かります。
    official: false
    sources:
      - https://x.com/FabrizioRomano/status/2097814422613889350
      - https://web.ultra-soccer.jp/news/all/35753/
