# 監督紹介：クロップ（10/24 土、シリーズ「監督紹介」、key: manager_klopp、型は news）。9節の型（2026-10-20 決定）。見本は 20261023_manager_mourinho。
# 順：フック→基礎DATA→**日本との接点（基礎DATAの次）**→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-24 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。クロップを主題にした「人物紹介」は無し。
#   クロップの名前が出る既存の本は、ニュース（9/16・9/18 ドイツ代表の初招集44人、9/25 初陣の1対1、9/27 ヴィルツ擁護のquote、9/28 ギリシャに初黒星）で、題材は別。
#   ドイツ代表の4試合（9/24〜10/4）のうち、9/24 と 9/27 の2試合は既存のニュースが扱った。この回は「人物の経歴・勝率・戦術の色」で、試合の中身には入らない（結果の一覧だけ）。
#
# **いまの立場（一次情報で確かめた。依頼文の「レッドブルのグローバル・フットボール統括」は古い。変わっていた）**
#   ○ DFB（ドイツサッカー連盟）公式 2026-07-24「Jürgen Klopp als Bundestrainer vorgestellt」
#       https://www.dfb.de/news/juergen-klopp-als-bundestrainer-vorgestellt （控え research/raw/20261024_dfb_juergen-klopp-als-bundestrainer-vorgestellt.txt）
#       「59歳のクロップは、今日、フランクフルトのDFBキャンパスで4年契約に署名。EURO 2028 と 2030年ワールドカップへ導く」「2026年8月15日にナーゲルスマンの後任に就く。
#        ナーゲルスマンは、ワールドカップでパラグアイに敗れたあと 7月3日に辞任」「コーチ：クラヴィーツ、リンデルス、ベンダー」。
#   ○ DFB 公式 2026-07-24「DFB und Red Bull treffen Vereinbarung」：クロップは Red Bull の「Head of Global Soccer」から**早めに**移る。クロップ本人（上の記事）「ここ1年半、レッドブルで…」。
#   ○ DFB 公式 2026-07-24（会見）「Klopp: Erfolgreicher Fußball kann ein Land verändern」（控え research/raw/20261024_dfb_klopp-ein-neustart-fuer-alle-die-bock-haben.txt）
#   ○ DFB 公式 2026-09-24「Klopp: Ich war mit der gezeigten Leidenschaft sehr zufrieden」：現在もバンデストレーナー。
#   ○ 英語版 Wikipedia「Jürgen Klopp」（2026-10-04 までの試合を反映。控え research/raw/20261024_klopp_wiki.txt）：ドイツ代表 2026-08-15〜現在 4試合 1勝2分1敗。
#   → 題・語りは「ドイツ代表監督」。依頼文の「レッドブル統括」は、**直前の肩書き**として1行だけ入れる（2024年にリヴァプールを退任→約1年半レッドブル→7月に代表）。
#
# **通算の数え方（台本とサムネをそろえる）**＝クラブ・代表のトップチームの全公式戦。**英語版 Wikipedia「Jürgen Klopp」Managerial statistics（updated: match played 4 October 2026）を自分で足し直した。**
#   行（試合・勝・分・敗）：マインツ 270・109・78・83／ドルトムント 319・180・69・70／リヴァプール 491・299・109・83／ドイツ代表 4・1・2・1。
#   **合計 1084試合 589勝 258分 237敗（勝率 54.3%）。Wikipedia の合計欄 1084・589・258・237 と一致。各行は 勝＋分＋敗＝試合 で一致。**
#   勝率：マインツ 40.4%／ドルトムント 56.4%／リヴァプール 60.9%／クラブ3つの合計 1080試合 588勝＝54.4%。
#   ※Wikipedia の注：Kicker はドルトムントの出場停止中の2試合（2013-14 CL の2勝）を数えない。The Analyst の数字を採っている（319試合）。台本は Wikipedia の表のまま。
#   優勝（Wikipedia Honours の「Manager」欄。インタートト杯に当たる大会は無い。スーパー杯・コミュニティ・シールドは数える＝モウリーニョと同じ数え方）：
#     ドルトムント5（ブンデスリーガ 2010-11・2011-12／DFBポカール 2011-12／DFLスーパー杯 2013・2014）／
#     リヴァプール8（プレミア 2019-20／FAカップ 2021-22／リーグ杯 2021-22・2023-24／コミュニティ・シールド 2022／CL 2018-19／UEFAスーパー杯 2019／クラブW杯 2019）＝**13冠**。
#     マインツの「2部3位での昇格（2003-04）」は優勝に数えない。
#     種類別：リーグ3（BL2・PL1）／国内カップ4（ポカール1・FA杯1・リーグ杯2）／国内スーパー杯・シールド3（DFL2・シールド1）／欧州・世界3（CL・UEFAスーパー杯・クラブW杯）＝13。
#     ※Wikipedia 本文は「2008年のドイツ・スーパー杯でバイエルンを破り最初のタイトル」と書くが、Honours 欄には 2008 が無い（本文と欄が食い違う）。**台本は Honours 欄の13冠を使い、2008 は言わない。報告に書く。**
#   リーグ優勝：ドイツ（2010-11・2011-12）＋イングランド（2019-20）＝2か国で3度。
#   CL決勝：2013（ドルトムント、バイエルンに1-2）・2018（リヴァプール）・2019（優勝）・2022（リヴァプール）＝4度進み、優勝は1度。
# **選手時代・基礎**：Wikipedia：1967-06-16 生まれ（シュトゥットガルト、育ちは黒い森のグラッテン村）。マインツ 1990〜2001（最初はFW、1995年からDF）。1995年にフランクフルトのゲーテ大学でスポーツ科学の学位。
#   マインツの歴代最多得点（通算56、リーグ52）で引退。コーチングライセンスの勉強に、毎週ケルンへ通った（エーリヒ・ルーテメラー）。
#
# **日本との接点（一次で確かめた範囲）**
#   ○ 英語版 Wikipedia「Shinji Kagawa」の出場表：ドルトムント 2010-11 ブンデスリーガ 18試合8得点、2011-12 31試合13得点＝**2シーズンで49試合21得点**。2シーズンともドルトムントの優勝（Honours 欄）。クロップの在任中（2008〜15）。
#   ○ 英語版 Wikipedia「2012 DFB-Pokal final」：2012-05-12 ベルリン、ドルトムント 5-2 バイエルン。香川 3分、フンメルス 41分（PK）、レヴァンドフスキ 45+1・58・81分。→ 香川が先制点。
#   ○ 英語版 Wikipedia「Takumi Minamino」：リヴァプール 2020〜2022（クロップの在任中）。「Wataru Endo」：2023-08-18 にリヴァプール加入（クロップ最後のシーズン 2023-24）。
#   × 香川と南野・遠藤の詳しい出場数は台本に入れない（香川の通算以外）。
#
# **戦術の色（実例の試合＝2019-05-07 CL準決勝第2戦、リヴァプール 4-0 バルセロナ（合計 4-3））**
#   ○ ESPN の試合記録（site.api.espn.com uefa.champions summary?event=538699、控え research/raw/20261024_klopp_lfc_barca_summary.json）：アンフィールド（52,212人）。
#       7分オリギ／54分・56分ウェイナルドゥム（ハーフタイムにロバートソンと交代で入った）／79分オリギ（アレクサンダー＝アーノルドのコーナーから）。
#       支配率 リヴァプール42.7%・バルセロナ57.3%、シュート 13対8、枠内 7対5、コーナー 7対6。サラーとフィルミーノは出場していない（先発にも途中交代にも名前が無い）。
#       第1戦（2019-05-01 カンプ・ノウ）は バルセロナ 3-0 リヴァプール（ESPN scoreboard 2019-05-01）。
#   ○ クロップ本人（DFB 2026-07-24 会見）：「Mehr Aufwand betreiben, mehr Intensität auf dem Platz – das ist schon mein Plan. Gegenpressing und eine stabile Ordnung werden auch wichtige Themen sein.」
#   ○ 英語版 Wikipedia「Tactics」：ゲーゲンプレッシング（ボールを失った直後に、下がらずすぐ奪い返しにいく）・速さと組織と体力と規律・自分のチームを「ヘヴィメタル」と呼ぶ・感情の大切さ。
#   ※リヴァプールの具体的な走行距離・プレス回数は一次で確かめられなかったので入れない。
# **本人の言葉（DFB の公式記事。自訳。原文は出典）**：
#   ①2026-07-24 会見：「Mein erstes Ziel ist, dass wir besser Fußball spielen.」
#   ②同「Ich habe dreimal erlebt, wie erfolgreicher Fußball eine Stadt verändern kann. Und erfolgreicher Fußball kann auch ein Land verändern.」
#   ③2026-09-24 DFB「Klopp: Ich war mit der gezeigten Leidenschaft sehr zufrieden」（オランダ戦 1-1 のあと）：「Wir können besser und mehr Fußball spielen.」
#   ④2026-07-24 会見「Heute ist für alle, die Bock darauf haben, ein Neustart.」（フックで使う）
# **ドイツ代表の4試合（Wikipedia「Germany national football team results (2020–present)」。UEFA のレポートURL付き）**
#   9/24 オランダ 1-1 ドイツ（ゲーク90+2・ンメチャ32）／9/27 ドイツ 0-1 ギリシャ（クルベリス74）／10/1 ドイツ 2-0 セルビア（ビショフ39・ヴィルツ61）／10/4 ギリシャ 0-0 ドイツ。3得点2失点。
#   次：11/13 セルビア戦（ベオグラード、UEFA の決定で無観客＝DFB 発表）／11/16 ドイツ対オランダ（ベルリン）。
#
# **マインツの始まり**：Wikipedia：2001-02-27、解任されたクラウツンの後任に。翌日の試合 1-0 デュースブルク。最初の7試合で6勝。14位で降格を最終節の前に避けた。2003-04 に3位で昇格（2004年）。
#   2004-05 初のトップリーグ：予算もスタジアムもリーグ最小で11位。2008年に退任（クラブ最長の在任）。
#
# **入れなかったもの**：私生活・家族・政治的な発言、年俸・契約金・補償金（レッドブルへの100万ユーロ等）、法的な問題、退任・解任の経緯の評価（「退任した」と年だけ）、他の監督との優劣、
#   審判への抗議・退場・罰金、アシスタントの内紛（ブヴァチ）、ワールドカップ敗退の評価（ナーゲルスマンの辞任は事実の一行のみ）、女子チーム、Jリーグ、報道・SNS の反応、
#   ドイツ代表の4試合の中身（既存のニュースが扱った）、2008年のスーパー杯。
# **日本語名・読みで怪しいもの**：クロップ、シュトゥットガルト、マインツ、ドルトムント、リヴァプール、ブンデスリーガ、ポカール、ゲーゲンプレッシング、ヘヴィメタル、ウェイナルドゥム、オリギ、アレクサンダー＝アーノルド、
#   サラー、フィルミーノ、アンフィールド、バルセロナ、香川真司、南野拓実、遠藤航、レヴァンドフスキ、フンメルス、ナーゲルスマン、クラウツン、デュースブルク、ベオグラード。
