- id: style
  heading: クロップのサッカーは、2019年のアンフィールドで、何を見せたのか
  tier: 報道
  telop: 戦術の色。2019年5月7日、リヴァプール 4-0 バルセロナ
  narrator: 解説
  card: &style_stats
    type: stats
    title: 2019年5月7日 チャンピオンズリーグ準決勝・第2戦
    items:
    - ['4', 対0, この試合は、リヴァプールの勝ち]
    - ['4', 対3, 2試合の合計も、リヴァプールの勝ち]
    focus: 1
  say:
  - text: 2019年5月7日、リヴァプールの本拠地アンフィールドで見ます。
    image: assets/images/20261024_manager_klopp/05_w.jpg
    card: *style_stats
  - text: チャンピオンズリーグ準決勝の第2戦。第1戦は、バルセロナが3対0でした。
    card: *style_stats
  - text: クロップのリヴァプールが、4対0の勝ち。合計4対3で、決勝へ。
    emph: true
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card: *style_stats
  - text: この日、サラーとフィルミーノは、出場していません。
    card: none
  - text: 7分にオリギが先制。ハーフタイムに入ったウェイナルドゥムが、連続ゴール。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card: none
  - text: ボール支配率は、リヴァプールが42.7%、バルセロナが57.3%。
    card: &style_poss
      type: stats
      title: 2019年5月7日 リヴァプール 4-0 バルセロナ
      items:
      - ['42.7', '%', リヴァプールの支配率]
      - ['13', 対8, シュートの数]
      - ['7', 対5, 枠内シュートの数]
      focus: 1
  - text: それでもシュートは、13本対8本。枠内も、7本対5本でした。
    emph: true
    card:
      <<: *style_poss
      focus: 2
  - text: 4点目は79分。アレクサンダー＝アーノルドのコーナーから、オリギが決めました。
    image: assets/images/20261024_manager_klopp/05_w.jpg
    card: none
  - text: 特徴の1つ目は、ゲーゲンプレッシング。ボールを失った直後に、すぐ奪い返します。
    emph: true
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card: &style_doc
      type: document
      label: 英語版Wikipediaの要約（訳）
      paragraphs:
      - ゲーゲンプレッシング。ボールを失った直後に、下がらず、すぐ奪い返しにいく。
      - 速さ、組織、体力、そして規律が要る。
      - 自分のサッカーを、本人は「ヘヴィメタル」と呼ぶ。感情の大切さを、何度も語っている。
      highlight:
      - すぐ奪い返しにいく
      - 規律
      - ヘヴィメタル
  - text: 2つ目は、速さと組織。3つ目は、感情。自分のサッカーを、ヘヴィメタルと呼びます。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card: *style_doc
  - text: 就任会見でも、ゲーゲンプレッシングと安定した守りを挙げました。
    card: none
  sources:
  - https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/summary?event=538699
