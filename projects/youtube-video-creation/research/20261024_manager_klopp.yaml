- id: secret
  heading: 数字の外にある話。現役のころから、監督の勉強を始めていた
  tier: 背景
  telop: 現役時代に学位とライセンスの勉強。マインツの監督は翌日から
  narrator: 解説
  card: &sec_table
    type: table
    title: 数字の外にある話
    columns: [いつ, 何があったか]
    rows:
    - [1990〜2001年, マインツの選手。歴代最多の56得点]
    - [1995年, FWからDFへ。大学でスポーツ科学の学位]
    - [現役のころ, 毎週ケルンへ通い、指導者の資格の勉強]
    - [2001年2月, 解任された監督の後任に。翌日に1対0]
    highlight_row: 0
    source: 英語版Wikipedia
  say:
  - text: ここから、数字の外の話。クロップの監督の勉強は、現役のころに始まっていました。
    image: assets/images/20261024_manager_klopp/02_w.jpg
    card:
      <<: *sec_table
      highlight_row: 0
  - text: マインツの選手として、通算56得点。クラブの歴代最多で、引退しました。
    card:
      <<: *sec_table
      highlight_row: 0
  - text: 1995年、FWからDFに替わった年に、スポーツ科学の学位を取ります。
    image: assets/images/20261024_manager_klopp/05_w.jpg
    card:
      <<: *sec_table
      highlight_row: 1
  - text: 指導者の資格の勉強に、毎週、ケルンまで通いました。
    card:
      <<: *sec_table
      highlight_row: 2
  - text: そして2001年2月、解任された監督の翌日に、マインツの指揮を執ります。
    emph: true
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card:
      <<: *sec_table
      highlight_row: 3
  sources:
  - https://en.wikipedia.org/wiki/J%C3%BCrgen_Klopp
- id: view
  viewpoint: true
  heading: 見立て・勝率は率いるたびに上がった。代表の4試合は、そこにどうつながるのか
  tier: 背景
  telop: マインツ40.4%、ドルトムント56.4%、リヴァプール60.9%。代表は1勝2分け1敗
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で数えてみた
    columns: &view_cols [比べ, 答え]
    rows: &view_rows
    - [マインツ（270試合）の勝率, 40.4%]
    - [ドルトムント（319試合）の勝率, 56.4%]
    - [リヴァプール（491試合）の勝率, 60.9%]
    - [ドイツ代表の4試合, 1勝2分け1敗（3得点2失点）]
    highlight_row: 0
  say:
  - text: 見立てです。クロップの勝率を、率いた順に並べます。
    image: assets/images/20261024_manager_klopp/05_w.jpg
    card: *view_table
  - text: マインツは、270試合で40.4%。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card:
      <<: *view_table
      highlight_row: 0
  - text: ドルトムントは56.4%、リヴァプールは60.9%。率いるたびに、上がりました。
    emph: true
    mark: {kind: circle, row: 2, col: 1}
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card:
      <<: *view_table
      highlight_row: 2
  - text: ドイツ代表の4試合は、欧州の代表の大会、ネーションズリーグ。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 結果は、1勝2分け1敗。3点を取って、2点を許しています。
    emph: true
    card:
      <<: *view_table
      highlight_row: 3
  - text: 9月24日、オランダ戦は、1対1の引き分け。27日、ギリシャ戦は、0対1の負け。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card: none
  - text: 10月1日は、セルビアに2対0の勝ち。4日は、ギリシャと0対0の引き分けです。
    card: none
  - text: 次の試合は、11月13日のベオグラードと、16日のベルリン。
    image: assets/images/20261024_manager_klopp/02_w.jpg
    card: none
  - text: 13日のセルビア戦は、欧州サッカー連盟の決定で、観客を入れずに行われます。
    card: none
  - text: クラブ3つの通算は、1080試合で勝率54.4%。代表は、まだ4試合です。
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card: none
  - text: 次の2試合が、その続きの目安になります。
    emph: true
    card: none
