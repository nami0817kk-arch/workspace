- id: words
  heading: 本人は、目標とこれからを、どう語っているのか
  tier: 報道
  telop: 7月24日の就任会見と、9月24日のオランダ戦のあと
  narrator: 解説
  card: &words_doc
    type: document
    label: クロップの言葉（2026年7月・9月、訳）
    paragraphs:
    - 私の最初の目標は、もっと良いサッカーをすることです。
    - 成功するサッカーは、国も変えられます。
    - 私たちは、もっと良く、もっと多く、サッカーができる。
    highlight:
    - もっと良いサッカー
    - 国も変えられます
    - もっと多く
  say:
  - text: 本人の言葉を聞きます。7月24日の就任会見は、目標の話です。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card: *words_doc
  - voice: クロップ
    text: 私の最初の目標は、もっと良いサッカーをすることです。
  - voice: クロップ
    text: そのために、持っているものを全部出します。
    cont: true
    pause: 0.5
  - text: 同じ会見で、街の話もしました。
    image: assets/images/20261024_manager_klopp/02_w.jpg
    card: *words_doc
  - voice: クロップ
    text: 成功するサッカーが街を変えるのを、私は3度、見ました。
  - voice: クロップ
    text: 成功するサッカーは、国も変えられます。
    cont: true
    pause: 0.5
  - text: もう1つは、9月24日。オランダ戦のあとの言葉です。
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card: *words_doc
  - voice: クロップ
    text: 私たちは、もっと良く、もっと多く、サッカーができる。
    pause: 0.5
