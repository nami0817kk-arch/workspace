      focus: 2
  - text: 2019-20は、クラブ初のプレミアリーグ優勝。勝ち点99は、クラブ記録です。
    image: assets/images/20261024_manager_klopp/05_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: 2022年はFAカップとリーグカップ、2024年にもリーグカップ。
    image: assets/images/20261024_manager_klopp/04_w.jpg
    card:
      <<: *career_tl
      focus: 2
  - text: そして今年、ドイツ代表の監督に就きました。
    image: assets/images/20261024_manager_klopp/01_w.jpg
    card: none
