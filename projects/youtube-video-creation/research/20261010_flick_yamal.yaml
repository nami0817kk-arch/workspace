  title: フリックがヤマルに付けた条件。「今まだそうでないとしても」
  question: フリックはヤマルの何を見て、どういう言い方で「世界最高になる」と言ったのか
  takeaway: フリックは2026年10月9日、ヘタフェ戦の前日会見で英語の質問に答え、ヤマルについて「彼は世界最高の選手になる。今まだそうでないとしても、私はもうそこに近いと思う」と話した。ただし言い切ってはおらず、「この態度、このメンタリティーを続けて、練習して、毎日よくなり続けるなら、100パーセントそうなる」と条件を付けている。褒めたのは出来ではなく態度のほうだった。フリックが挙げたのはクラブでの最初の8試合と代表で、9月26日のウェンブリーでのイングランド戦はスタンドから生で見ていたと言っている。その代表ウィークでヤマルは4試合281分に出て4得点1アシスト。70分に1点のペースで、スペインが取った12点のうち5点に絡んだ。一方でフリックは「60分や70分で下がったら、たぶん彼は嬉しくない。でも彼にとってはそれが完璧なんだ」とも言っているが、今季のラ・リーガでヤマルは1試合平均83分出ていて、監督が口にした数字より13分から23分長い。クラブと代表を足すと今季は12試合12得点7アシストになる
  opening_image: assets/images/20261010_flick_yamal_pair/01.jpg
