# 取材メモ（10/10 題材 flick_yamal、型は news、ラ・リーガ枠）。材料の控えは research/raw/20261010_flick_yamal_material.md。
# **ショートだけ作る**（台本は1本。`short` が山場の節を切り出す）。
# **10/2 にヤマルの選手紹介を出している**（research/20261002_player_937958.yaml）。
#   材料の「0.」の**使ってはいけないもの一覧**をそのまま守った。この回で使っていないもの：
#   メッシに抱かれた赤ん坊の写真／10代でユーロとW杯を両方獲った話／基礎DATA（生年月日・身長・契約・背番号）／
#   歩んできた道（15歳290日のデビュー等）／プレースタイルの図（レーダー・シュートマップ・ヒートマップ）／
#   季ごとの通算の表／マル秘話（304・ネイマール・背番号の変遷）／9月のバロンドール発言／エムバペとの比較。
#   **市場価値も出していない。**
# **この回で新しいのは4つだけ**（材料 0）。そこに寄せた：
#   ①フリックが 2026-10-09 の会見で語った言葉 ②代表の4試合で4得点
#   ③「60分や70分」という使い方の考えと、実際の出場時間とのずれ ④フリックがウェンブリーのスタンドで見ていたこと
# 10/2 で読んだ「9試合9得点6アシスト」の**続きとして**「12試合12得点7アシスト」を出している（材料 6-4 の指示）。
# **フリックの会見は英語で行われ、スペインの媒体がスペイン語に訳して出している**（材料 1・7-1）。
#   英語の原文（録音の書き起こし）は取れていないので、**いちばん詳しいスペイン語の形から日本語にし、
#   「英語で答えた」と台本の中で言う**。beIN Sports の英語訳とは文の切り方が違うので、混ぜていない。
# **ヤマル本人の反応は 10/10 10:00 時点で無い**（材料 4・8）。だから本人の言葉は1つも置いていない。
# **ヘタフェ戦はまだ行われていない**（現地10/10 18:30、日本時間11日1:30）。結果に触れていない。
# 数字の食い違い（材料 7-3）：ウェンブリーの試合は **ESPN の「イングランド 2-3 スペイン」** の形を採った。
# バロンドールの発表日は 10/2 で読み上げ済みなので、**この回の時点の「16日後」という形だけ**にした（材料 5）。
# 数字の重なり対策：『4得点』『281分』『70分に1点』は②だけ。『83分』『13分』『23分』は③だけ。
#   『12試合』『12得点』『7アシスト』『16日』は④だけ。
# 写真は **語る人（左）＋主役（右）の2枚並べ**（tools/pairphoto.py）。左＝フリック（Commons、CC BY-SA 4.0 /
#   Steffen Prößdorf、2022年）、右＝ヤマル（スペイン代表、1920x2562）。**ショート用の縦版（01_v.jpg）も同時に書かれる**。
#   beIN Sports の記事の og:image（フリックとヤマルが並んで写った1枚）も当たったが、**横長1枚をショートで縦に切ると
#   2人の間の客席だけが映った**（下見で実際にそうなった）ので、2枚並べに替えた。
#   代表の節だけ 20261002_yamal_spain2025_w/01.jpg（スペイン代表のユニフォーム、1920x1080）に入れ替える。**入れ替えは1回**。
# サムネ：構図 classic（写真＋下の帯に2行）。10/10 は face・number・versus が出ているので、ここは classic に寄せた。
# ネットの反応は集めていない（材料の方針）。
