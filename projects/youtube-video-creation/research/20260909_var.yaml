sections:
  - id: what
    heading: 何が起きたか
    tier: 報道
    telop: PKが与えられなかった場面
    narrator: キャスター
    say:
      - プレミアリーグが、自分たちの誤審を認めました。イギリスの『BBC』が9日に伝えています。
      - 対象は8月31日の第2節、アストン・ヴィラ対アーセナルです。
      - 試合はブカヨ・サカのゴールで、アーセナルが1対0で勝ちました。
      - 問題は後半アディショナルタイムでした。
      - ブルーノ・ギマランイスがボックス内へ抜け出したところ、ヴィラのイアン・マートセンがシュートを阻もうとスライディング。
      - 主審のジャレッド・ジレットは、PKを与えませんでした。
      - VARのジェームズ・ベルも確認しましたが、判定は覆っていません。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007766/
      - https://www.footballchannel.jp/2026/09/09/post1006998/

  - id: verdict
    heading: 検証チームの結論
    tier: 報道
    telop: 5人の採決は5対0
    narrator: 解説
    card:
      type: bars
      title: KMI判定検証チームの採決
      items:
        - {label: "ピッチ上の判定は誤り", value: 5}
        - {label: "判定は正しかった", value: 0}
      unit: 人
    say:
      - プレミアリーグには、主要な判定を独立して評価するKMI判定検証チームがあります。
      - 5人による採決の結果は、5対0。ピッチ上の判定は誤りであり、VARも介入すべきだった、という結論でした。
      - {voice: 検証チーム, text: マートセンによるギマランイスへの危険なチャレンジに対して}
      - {voice: 検証チーム, text: ピッチ上でPKが与えられるべきだった}
      - {voice: 検証チーム, text: 攻撃側の選手の軸足には明確な接触があり}
      - {voice: 検証チーム, text: マートセンはボールには触れていなかった}
      - さらに、退場についても踏み込んでいます。
      - {voice: 検証チーム, text: このチャレンジは危険なものだったため}
      - {voice: 検証チーム, text: 2枚目のイエローカードが提示されるべきだった}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007766/
      - https://web.ultra-soccer.jp/news/all/35631/

  - id: why
    heading: なぜVARは入らなかったのか
    tier: 報道
    telop: 「介入には高い基準を維持する」
    narrator: 解説
    say:
      - リーグは、VARが入る基準についても説明しています。
      - {voice: プレミアリーグ, text: フットボール・プリンシプルの一つは}
      - {voice: プレミアリーグ, text: VARが介入する際に高い基準を維持することだ}
      - {voice: プレミアリーグ, text: VARはプレーを再び審判するためのものではない}
      - {voice: プレミアリーグ, text: 主観的な判定に介入するには明確な証拠が必要となる}
      - そのうえで、この場面は基準を満たしていた、と認めました。
      - {voice: プレミアリーグ, text: 危険なチャレンジによって}
      - {voice: プレミアリーグ, text: ピッチ上でPKが与えられるべきだった}
      - {voice: プレミアリーグ, text: VARが介入するための基準も満たしていたと判断された}
      - {voice: プレミアリーグ, text: VARは明らかな誤りがあったとして}
      - {voice: プレミアリーグ, text: オンフィールドレビューを推奨するべきだった}
      - 勝ったのはアーセナルでした。それでも、判定そのものは誤りだったことになります。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007766/
      - https://web.ultra-soccer.jp/news/all/35631/
