        image: assets/images/20261126_bruno_sporting_double/06_w.jpg
      - text: その2分後、エリアの外から左足でシュート。
        image: assets/images/20261126_bruno_sporting_double/05_w.jpg
      - text: ボールは芝のくぼみで跳ねてキーパーの頭を越え、マンUが逆転します。
        emph: true
      - text: しかし80分、マンUのキーパー、ラメンスがクロスに触りきれず、スアレスに押し込まれます。
        image: assets/images/20261126_bruno_sporting_double/07_w.jpg
      - text: 終了間際には、マンUのティーレマンスが2枚目のイエローカードで退場。
        image: assets/images/20261126_bruno_sporting_double/04_w.jpg
      - text: 試合は2対2の引き分けに終わりました。
        image: assets/images/20261126_bruno_sporting_double/06_w.jpg
