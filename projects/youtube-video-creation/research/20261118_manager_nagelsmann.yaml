# 監督紹介：ユリアン・ナーゲルスマン（11/18 水、シリーズ「監督紹介」、key: manager_nagelsmann、型は news）。9節の型。見本は 20261114_manager_kompany。
# 順：フック→基礎DATA→日本との接点（2023年9月 ドイツ1-4日本とフリック解任）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-12）**：既出16人（…アロンソ・コンパニ）以外の大物から。ポチェッティーノ（11/16）と別の人。
#   ・ジダン・森保一・アッレグリ・インザーギ・マレスカは 11/16 の指示の選び方のとおり外した。
#   ・ナーゲルスマン：ブンデス最年少の監督→バイエルン→ドイツ代表。2026年7月に代表を辞任した人物で、「退任した監督も扱ってよい」（2026-10-20 ユーザー）。
#   **重なりの確認（2026-11-12 に自分で）**：scripts/ に「監督紹介」の本は無い（名前が出るのはクラブ紹介 hoffenheim・leipzig、トゥヘルの回、選手紹介のみ）。
#     同じ 11/18 の他の担当（research/20261115_picks.txt）：財政＝セルティック。ホッフェンハイム・ライプツィヒ・バイエルンの同日のクラブ紹介が出ていないかは、仕上げ時にもう一度見る。
#
# **いまの立場**：2026-07-03 にドイツ代表の監督を辞任（DFB が発表）。そのあとの就任先は、2026-11-12 時点で確かめられていない。
#   ○ DW「The downfall: Julian Nagelsmann out as Germany coach」（2026-07-03、2026-11-12 に requests で本文を読んだ）：「DFBとナーゲルスマンが袂を分かった」「3年足らずで、契約（2028年のEUROまで）の途中で辞めた」。
#   ○ 英語版 Wikipedia「Julian Nagelsmann」冒頭（2026-11-12）：「most recently the manager of the Germany national team」「He stepped down in July 2026」。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of match played 29 June 2026）。
#   ホッフェンハイム 136試合55勝43分38敗／ライプツィヒ 95試合54勝22分19敗／バイエルン 84試合60勝14分10敗／ドイツ代表 37試合23勝7分7敗。
#   Total 352試合192勝86分74敗。**自分で足して一致**（136+95+84+37＝352、55+54+60+23＝192、43+22+14+7＝86、38+19+10+7＝74）。勝率 192÷352＝54.5%。下部組織の試合は含まない。
#   勝率（自分で割って確認）：ホッフェンハイム 40.4%、ライプツィヒ 56.8%、バイエルン 71.4%、ドイツ代表 62.2%（表の値と一致）。バイエルンとドイツ代表の差 9.2 ポイント。
#   ※DW は「37試合で23勝、負けは8」と書く（Wikipedia は負け7。PK 負けの数え方の差と見られる）。台本は「23勝」だけ使い、負けの数は言わない。
#
# **歩み**（英語版本文・DW）：2015-10-27 ホッフェンハイムの次期監督に決まり、2016-02 に前任の辞任で早めに就任（28歳、ブンデス最年少）。17位のチームが残留（入れ替え戦圏の1つ上）。2016-17 は4位、2017-18 は3位。
#   2019 ライプツィヒ（2019-20 は3位・CL準決勝＝ラウンド16でトッテナム、準々決勝でアトレティコ、準決勝でPSGに0-3。DW「CL準決勝に進んだ最年少の監督」）。2020-21 は2位、ドイツ杯決勝でドルトムントに1-4。
#   2021-07 バイエルン（2021 スーパー杯、2021-22 ブンデス優勝＝残り3試合で決定、2022 スーパー杯）。2023-03-24 に解任（首位ドルトムントと勝ち点1差）。在任20か月。
#   2023-09-22 ドイツ代表監督（フリックの後任）。EURO2024 は準々決勝でスペインに1-2（延長）。2025 ネーションズリーグ4強。2026 W杯はグループ首位通過→ラウンド32でパラグアイに 1-1（PK 3-4）。
#
# **戦術の色**＝2019-20 ライプツィヒのCL（英語版本文）。tactically flexible・frequent changes of formation・possession-oriented・aggressive pressing after turnovers (gegenpressing)。
#
# **日本との接点**：2023-09-09 親善試合 ドイツ 1-4 日本（ヴォルフスブルク）。ドイツ：サネ19分／日本：伊東純也11分・上田綺世22分・浅野拓磨90分・田中碧90+2分。
#   英語版「Germany national football team results (2020–present)」で確認。翌 2023-09-10 にフリックが解任（代表監督として史上初の解任。英語版「Hansi Flick」）、2023-09-22 にナーゲルスマンが就任。
#   ※この試合の監督はフリック。ナーゲルスマンは試合に関わっていない。台本は「就任の直前」「後任」と書く。
#
# **本人の言葉**：2026-07-03 辞任の声明（DW が引用）。原文：“This decision was anything but easy for me… After such a bitter disappointment, the team deserves the chance for a fresh start without any baggage… A special thank you also goes to the fans. You carried us, you trusted us, and you gave us energy, even during difficult times. I am truly sorry and deeply saddened that we let you down and were unable to give you more nights of football excitement at this World Cup. You deserved so much more!”
#   別：Süddeutsche Zeitung での発言（DW が引用）：“30% of coaching is tactics, 70% social competence.”
# **マル秘話**（英語版 Early life・Personal life）：膝と半月板の大けがが2度重なり、20歳で現役を終えた（プロの試合は無し）。2008年前半、アウクスブルクのセカンドチームの監督だったトゥヘルの補佐（スカウト）。経営学を4学期学んでスポーツ科学へ。
#   子どものころはアイスホッケーも。2017年、Common Goal に給料の1%を寄付すると約束。バイエルンは移籍補償金として約2500万ユーロを払ったと報じられた。
#
# **入れなかったもの**：結婚・別れ・交際（私生活）、バイエルンの選手との不和・ノイアーの件の詳細（監督を小さく見せる）、ベンチの振る舞いの批判、FotMob・女子・ニュースの反応。
