  say:
  - text: 締めくくりに、イゴール・チアゴの昨季と今季を、同じ物差しで並べます。
    image: assets/images/20261101_player_739443/w1/01_w.jpg
    card:
      <<: *view_card
      highlight_row: 0
  - text: 出場時間は、昨季の3287分に対して、今季はここまで713分。
    card:
      <<: *view_card
      highlight_row: 1
  - text: 90分あたりの得点は、昨季の0.6点から、今季は0.13点です。
    card:
      <<: *view_card
      highlight_row: 3
    emph: true
    mark:
      kind: circle
      row: 3
  - text: 一方、90分あたりのシュートは、2.30本と2.27本。
    card:
      <<: *view_card
      highlight_row: 4
  - text: 打つ回数は、ほとんど変わっていません。
    card:
      <<: *view_card
      highlight_row: 4
  - text: 差が出ているのは、枠に飛んだ割合です。昨季は51%、今季は22%。
    card:
      <<: *view_card
      highlight_row: 5
  - text: 打つ場面は作れているので、あとは枠に飛ぶ数が戻るかどうか。
    card: none
  - text: 数字は10月30日時点で、8試合の話です。
    card: none
  - text: 次は10月31日、ホームでのノッティンガム・フォレスト戦。
    card: none
  - text: 昨季の開幕戦で、ブレントフォード初ゴールを決めた相手です。
