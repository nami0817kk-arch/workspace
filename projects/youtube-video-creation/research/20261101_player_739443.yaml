  say:
  - text: ブレントフォードの9番、チアゴ。今季ここまでの中身を見ます。
    image: assets/images/20261101_player_739443/w1/01_w.jpg
    card: none
    short_only: true
  - text: 今季のプレミアは、ここまで8試合に出場。昨季は同じ8試合で5得点でした。
    image: assets/images/20261101_player_739443/a1/01_w.jpg
    card: none
  - text: 今季の得点は、9月18日、ホームのチェルシー戦の1点。3対0の勝利でした。
    card:
      <<: *season_card
      highlight_row: 0
  - text: 10月17日のリバプール戦と、25日のハル・シティ戦で、アシスト。
    card:
      <<: *season_card
      highlight_row: 0
  - text: リーグカップでは、3試合で2得点。
    card:
      <<: *season_card
      highlight_row: 1
  - text: 8月25日のバーミンガム戦と、10月28日のサンダーランド戦で、1点ずつです。
    card: none
  - text: 合わせて、今季は3得点、2アシスト。
    image: assets/images/20261101_player_739443/a1/01_w.jpg
    card: none
  - text: リーグ戦の得点は、昨季の同じ時点の5分の1です。
    image: assets/images/20261101_player_739443/a1/01_w.jpg
    card: none
    emph: true
