title: どのシリーズを出すか（2026年9月28日）
lead: 収益化の柱＝本編の視聴時間と登録者。手元の数字で、伸びる型と審査に強い型を重ねた
legend: false
labels: ["○ 出す", "△ 保留", "✖ 出さない"]
note: |
  <b>手元の数字（9/28、分析の遅れを避けて 9/24 以前の公開分）</b><br>
  ・ニュース本編 201本：再生の中央値42回、視聴時間は1本0.84時間。<b>日本人の回は1本1.44時間で、それ以外（0.36時間）の4倍</b>。視聴時間の上位2本は松木31時間・中村25時間<br>
  ・プレミア紹介の本編：再生の中央値87〜127回で、ニュース本編の2〜3倍。視聴時間は分析の遅れでまだ測れない<br>
  ・検索で来る言葉の上位5語のうち4語が日本人選手名（中村敬斗・久保・鎌田・上田）<br>
  ・参考チャンネルは順位表・ランキングの動画が17%を占め、6.7万〜22万回。こちらは0本<br>
  ・語りだけのショート（ハーランドの記録2,565回・トッテナム2,583回）も、反応中心の回と同じだけ見られている<br>
  <b>共通の作り</b>：本編4〜6分（視聴時間を積む）、他人の声は半分まで、自作の表・板が主役、見立ての節あり、シリーズごとの再生リスト（自動）、題に人名かクラブ名。<b>○△✖を押してください。</b>
items:
- num: 1
  slot: 週1
  fmt: 推し
  head: 欧州組の1週間（日本人選手の週報）。毎週月曜、10人前後の出場時間・得点・評価を表にし、3人を数字で掘る。5〜6分
  why: '登録者と視聴時間の両方に効く柱。日本人の回は視聴時間が4倍、検索は名前で来る。出場時間・得点は自分で数える（Transfermarkt の試合記録・リーグ公式）ので、審査の「独自に数えて比べる」にいちばん合う。毎週同じ選手を追うので、続けて見る理由になる。写真は Commons と記事の写真。
    '
- num: 2
  slot: 毎日1本
  fmt: 決定済み
  head: クラブ紹介（欧州7リーグ）。ラ・リーガ20本の次はブンデスリーガ18、セリエA20、リーグ・アン18、エールディビジ18、ポルトガル18。4〜5分
  why: '他人の声0・自作の板・「◯◯ってどんなクラブ？」の検索に長く効く。プレミア20本は本編の再生がニュースの2〜3倍。1日1本ずつ出せば、7リーグで約130本、半年分の柱になる。年に1回、数字を更新して出し直せる。
    '
- num: 3
  slot: 週1
  fmt: 推し
  head: 5大リーグの順位表と「今週の1つ」。節が終わった翌日に、5リーグの順位表を自作の板で出し、表から1つ話を拾う。4〜5分
  why: '参考チャンネルが例外なく出していて毎回伸びる型（プレミア3節の順位表6.7万回、J1は10万回）。数字だけで作れ、写真が要らないので権利の危険がゼロ。`standings` の道具は既にある。5リーグを1本にまとめて尺を作り、視聴時間を積む。
    '
- num: 4
  slot: 週1
  fmt: 推し
  head: 仕組みの解説（規定・制度）。ネーションズリーグの階層、マンCの114件と収支規定、CLの新方式、レンタルと買い取り条項、登録期限、労働許可…。3〜4分
  why: 'チャンネル名の「理由」そのもの。全部が自作の図と語りで、審査にいちばん強い。「リーグBって何？」は視聴者も同じ疑問を持つ。ニュースの回から「この仕組みの解説はこちら」と再生リストでつなげる。古くならないので、視聴時間が積み上がる。
    '
- num: 5
  slot: 週1
  fmt: 推し
  head: 数字で見るランキング。1テーマを横断で数える（移籍金の回収、各クラブの年齢構成、日本人選手の出場時間、人件費、走行距離…）。3〜4分
  why: '参考のトリベラは「人件費ランキング」で22万回。ハーランドの記録のショートは語りだけで2,565回。`statboard` で自作でき、写真が要らない。数える手間はあるが、それが独自性になる。
    '
- num: 6
  slot: 隔週
  fmt: 案
  head: 10年前の今日（歴史の1日）。日本人選手や欧州の名場面を、当時の数字と一緒に振り返る。3分
  why: '古い出来事は Commons の自由に使える写真が多く、権利に強い。古くならない。ただし当たりが読みにくいので、まず隔週で試す。
    '
- num: 7
  slot: 出さない
  fmt: 案
  head: 監督の戦術の型シリーズ
  why: '9月16日に「戦術の節は入れない」と決めている。ここでは提案だけ書き、推さない。
    '
- num: 8
  slot: 組み方
  fmt: 推し
  head: 1日の中の置き方：毎日「クラブ紹介1本」＋週に「週報・順位表・解説・ランキング」を1本ずつ（月・火・水・木）。ニュースの枠は今のまま（本数は減らさない決定のまま）
  why: '曜日で固定すると、続けて見る人に予定が伝わり、こちらも取材の段取りが組める。シリーズはそれぞれ別の再生リストに自動で入る。
    '
- num: 9
  slot: 試合日
  fmt: 追加案
  head: 数字で振り返る注目試合。土日月の試合から1日1〜2試合、スタッツの表（シュート・支配率・xG・走行距離）で「なぜその結果か」を語る。3分
  why: '試合結果の枠は既にあるが、反応中心だった。表を自作して数字で語る形にすれば審査に強い。写真が要らない。日本人が出た試合を優先する。
    '
- num: 10
  slot: 選手1人1本
  fmt: 追加案
  head: 日本人選手「今季の軌跡」。欧州組1人につき1本、今季の出場・得点・評価をここまでの表で。30人で30本、冬と春に出し直す。3〜4分
  why: '検索は名前で来る。1人1本なら「久保建英 今季」のような検索に長く効く。週報（1）の材料をそのまま使えるので手間が少ない。
    '
- num: 11
  slot: 毎週
  fmt: 追加案
  head: 得点王・アシスト王レース（5大リーグ）。毎週、上位10人の表と、動いた人を1人掘る。2〜3分
  why: '順位表（3）と同じ型で、数字だけで作れる。ハーランドやケイン、日本人が入れば名前で検索に乗る。
    '
- num: 12
  slot: クラブ1つ1本
  fmt: 追加案
  head: クラブの財政（売上・人件費・移籍収支）。公開されている決算と Deloitte の数字で1クラブ1本。20クラブ×リーグ。3分
  why: 'トリベラの人件費ランキングは22万回。数字だけで写真が要らず、古くならない。クラブ紹介（2）の再生リストにつなげられる。
    '
- num: 13
  slot: 監督1人1本
  fmt: 追加案
  head: 監督の経歴（戦術には触れない）。どこで何勝したか、タイトル、契約、前任との比較。7リーグで約130人。3分
  why: '9/16 の「戦術の節は入れない」は守る。経歴と数字だけの型。Commons の写真が多く、権利に強い。クラブ紹介の材料（faces.json）が使える。
    '
- num: 14
  slot: 試合の前
  fmt: 追加案
  head: 日本人選手の「次の相手」。久保・三笘・鎌田らの次の対戦相手を、クラブ紹介の材料で3分に。試合の2日前
  why: '検索の名前とクラブ紹介の材料を掛け合わせる。クラブ紹介（2）を作った分だけ、ここが軽くなる。
    '
- num: 15
  slot: 隔週
  fmt: 追加案
  head: 1年前の噂はどうなったか（検証）。1年前の移籍の噂を並べて、実際にどうなったかを表で。3分
  why: '噂を扱っても、こちらの検証が主役になる形。ニュースの控え（research/）が1年分たまれば材料は手元にある。
    '
- num: 16
  slot: 月1
  fmt: 追加案
  head: 日本人選手の月間まとめ（出場時間・得点のランキング）。月初に1本。4〜5分
  why: '週報（1）の月版。月の区切りで検索が立つ（「日本人 9月 海外」）。表だけで作れる。
    '
- num: 17
  slot: 隔週
  fmt: 追加案
  head: 若手の数字（U-21の出場時間・市場価値の動き）。7リーグから10人を表で。3分
  why: '若手は他所が追いにくく、数字で語れば独自性が出る。写真は少ないが、表が主役なので要らない。
    '
- num: 18
  slot: 大会ごと
  fmt: 追加案
  head: 欧州カップ（CL・EL・カンファレンス）の対戦相手紹介。日本人や日本で知られたクラブの相手を、クラブ紹介の型で。3分
  why: '試合の前日に出せば見られる。クラブ紹介（2）の道具がそのまま使える（他リーグのクラブも板で作れる）。
    '
- num: 19
  slot: 週1
  fmt: 追加案
  head: スタジアム紹介（収容・築年・改修・アクセス）。Commons の写真が豊富で、権利に強い。3分
  why: 'クラブ紹介の「本拠地」の節を独立させた型。古くならず、写真の心配が無い。
    '
- num: 20
  slot: 組み方
  fmt: 推し
  head: 1日10本の組み方（本編の数）。毎日「クラブ紹介1・日本人ニュース3・試合の数字1（試合日）・曜日のシリーズ1（週報／順位表／解説／ランキング／得点王）・ほかのニュース3〜4」
  why: 'シリーズが毎日2本、ニュースが7〜8本。ショートは本編ごとに1本なので、ショートは1日10本の上限内に収まる。追加案（9〜19）は、曜日の枠か「ほかのニュース」の枠に入れ替えで入れる。
    '
- num: 21
  slot: 選手1人1本
  fmt: 推し
  head: 有名選手の紹介（ユーザー案）。1人4〜5分。一言 → 基礎DATA（板：生年月日・身長・位置・クラブ歴・代表・タイトル・市場価値）→ 歩み（表）→ 数字で見る（季ごとの出場と得点のグラフ）→ 逸話1つ → 本人の言葉（半分まで）→ 今季 → 見立て
  why: 'クラブ紹介と同じ作り（自作の板・表・グラフ）で、名前の検索に長く効く（ハーランド・ムバッペ・ヤマル・メッシ…）。有名選手ほど Commons に自由に使える写真が多く、権利に強い。順番は「5大リーグの各クラブの看板選手（約100人）→ 日本人の欧州組（約30人）→ バロンドール候補」。数字は Wikipedia の infobox（クラブごとの出場・得点）と Transfermarkt（市場価値・今季）から自分で拾う。同じ型が続かないよう、位置（GK／DF／MF／FW）で節の中身を変え、見立てを必ず置く。監督の経歴（13）と合わせて「人物紹介」の再生リストにまとめられる。
    '
