# 取材メモ（11/29 日、シリーズ「比べる」、key: compare_108390_105470）。ティボー・クルトワ（レアル・マドリード・34歳）×アリソン（リバプール・34歳）。
# **情報の時点は 2026-11-21**。FotMob・DataMB は使っていない。数字は Transfermarkt の API（2026-11-21 取得。控え: research/raw/20261129_courtois_*.json・20261129_alisson_*.json）。
#   番号：クルトワ 108390・アリソン 105470。profile・market-value-history・performance-season（2023〜2026季）・performance-game（全試合。2.5秒あけて取得）。
# **選んだ理由**：比べるで初めてのGKの回。2人とも1992年生まれの34歳（クルトワ 5月11日・アリソン 10月2日）、2018年夏に今のクラブへ（TM の clubAssignments：クルトワ start 2018-08-09、アリソン 2018-07-19）、市場価値も同じ1500万€（2026-06）。
#   2022年のCL決勝（2022-05-28、レアル 1-0 リバプール、クルトワが9セーブで試合の最優秀選手、アリソンはリバプールの先発GK）は Wikipedia「2022 UEFA Champions League final」で確認。
#   軸：セーブ率＝セーブ÷（セーブ＋失点）を自分で計算（試合ごとの scoringGoalkeeperSaves と opponentGoalsOnThePitch を、クラブの公式戦で出場した試合だけ季ごとに合計。代表戦は isNationalGame で除外）。失点には PK・オウンゴールも入る（板の注に式だけ出す）。
#     23/24 はクルトワが左ひざ前十字じん帯（2023-08）と右ひざ半月板（2024-03）のけがで5試合だけ（Wikipedia「Thibaut Courtois」、復帰 2024-05-04）なので折れ線から外した。
#   無失点＝90分以上出場して失点0の試合（自分で数えた）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。GK の比べるは初めて。2人とも比べる・選手紹介に未登場（アリソンは 11/8 の鈴木彩艶のニュースに名前のみ。台本では触れない）。
#   同じ日（11/29）の picks（選手紹介ロドリ＝バルセロナ・スタジアム PSG・ユニフォーム アヤックス）と人もクラブも重ならない。公開前にもう一度。
#   日本との接点：入れない（鈴木彩艶の報道は使わない）。
# **2人とも今季も欧州7リーグの1部**：レアル・マドリード（ラ・リーガ。clubId 418）・リバプール（プレミアリーグ。clubId 31）。
# **使った数**（クラブのトップチームの公式戦だけ。試合・出場時間・失点・セーブ・無失点）
#   クルトワ：21/22 52試合 失点46 セーブ154 率77.0%／22/23 49 49 154 75.9%／23/24 5試合 0 19／24/25 53試合 4830分 失点63 無失点17 セーブ165 72.4%／25/26 45試合 4005分 43 17 132 75.4%／26/27 15試合 1350分 16 4 51 76.1%
#   アリソン：21/22 54試合 失点41 セーブ99 70.7%／22/23 47 59 130 68.8%／23/24 32 32 95 74.8%／24/25 35試合 3169分 33 12 104 75.9%／25/26 35試合 3116分 37 13 77 67.5%／26/27 14試合 1260分 20 4 34 63.0%
#   90分あたり失点（25/26）：クルトワ 0.97・アリソン 1.07
# 市場価値（TM）：クルトワ 最高 7500万€（2020-10）→ 2024-12 2500万 → 2026-06-05 1500万／アリソン 最高 9000万€（2019-12）→ 2020-10 8000万 → 2024-12 2500万 → 2026-06-03 1500万。
#   **確かめていない**：セーブ数は TM の試合データ（Opta 等の公式値と突き合わせていない）。セーブ率の定義はこちらで決めたもの（被枠内シュートを使う一般のセーブ率とは少し違う）。「年齢が値段をそろえている」は見立て。
# 写真：c1・c2 Commons（Belgium v USA 6 July 2026、Bryan Berlin、CC BY-SA 4.0。c1 は左端の灰色の帯を200px切った）・a1・a2 Commons（Brazil v Morocco 13 June 2026、Bryan Berlin、CC BY-SA 4.0）。**2人とも代表の姿のみ**（クラブ姿は探していない。アリソンはリバプールのCC0写真（Timmy96）もあるが私服寄りなので使わなかった）。pair_a=c1+a1、pair_b=c2_v+a2_v。
