# 取材メモ（2026年11月5日）ロス世代の塩貝健人ら、日本代表の今回の28人から外れる。森保監督が会見で語った「1チーム2カテゴリ」（ニュースのショート。見せ方 Y＝森保監督の言葉から始める）
# 取材: 2026-11-05。requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 読んだ出典:
#   ・ゲキサカ 2026-11-04 19:07（462520）「ロス世代・塩貝健人ら落選、小杉啓太らアジア大会組も抜擢なし…森保→大岩ジャパンの「1チーム2カテゴリ」強化策」（全文）
#       - 森保一監督が4日、シンガポール遠征の招集28人を発表。ロス五輪世代で選ばれたのは後藤啓介（フライブルク）のみ。
#         9月・10月シリーズに選ばれていた塩貝健人（ボルフスブルク）・齋藤俊輔（ウェステルロー）・佐藤龍之介（バレンシア）は選外。小杉啓太（フランクフルト）らアジア競技大会メンバーの抜擢もなし。
#       - 会見で森保監督は、東京五輪代表を率いていた頃のテーマ「1チーム2カテゴリ」を久々に用いた。招集されなかった選手は今月、大岩剛監督（次期日本代表監督）が率いる五輪世代の代表（スペイン・エジプト遠征）に招集されることを示唆。
#       - 森保監督の言葉（会見。記事の日本語どおり）:
#           「私が2チームの監督をしているわけではないが、1チーム2カテゴリというこれまでやってきた、A代表と大岩ジャパン、…の五輪チームとどうやって選手にうまく経験してもらいながら、両チームとも勝利を目指す、そして未来の強化につなげるかというところを今回の活動は考えた」
#           「9月・10月の活動から五輪年代の選手…が継続して選ばれていないところはお気づきだと思うが、A代表で経験してもらうことがベストだと思った時にはこちらに来てもらいながら、今回は…スペインやエジプトという世界的強豪と対戦できるので、どちらが選手の経験値が上がるか、どちらがレベルアップにつながるかを考えながらA代表のベストということでメンバー編成をさせていただいた」
#           選外の選手の扱いは「大岩監督に聞いていただければ」と明言を避けた。
#           「次に大岩監督がチームを見る時に、若手から経験のある選手を含めて、この活動も見ていただきながらチームづくりにつなげてもらえるようなメンバーだと思っている」
#       - 記事の地の文（記者の見立て）: 後藤のみ継続招集、出場機会のない佐藤や欧州5大リーグ外の齋藤と塩貝は招集せず、五輪世代の代表でのチーム作りに専念する道を選んだ「ようだ」。→ 森保監督は塩貝の名前を挙げて説明したわけではない。台本は「報道」として扱う。
#       - 五輪世代の代表の発表は今月6日の予定。
#   ・ゲキサカ 462496「森保Jシンガポール遠征メンバー発表!!」（見出しと本文冒頭のみ。福田師王の初招集・塩貝は選外）。
#   ・サッカーキング 2026-11-03（2224151）「アジアカップ延期でロス五輪予選と異例の日程重複…大岩剛監督の兼任体制、選手招集にも影響か」（全文）:
#       来年3月から大岩剛監督がA代表の指揮官に就任することで内定。A代表に後藤啓介・塩貝健人らロス世代の選手がいるので、アジア杯延期後の招集に影響の可能性（記者の見立て）。→ 台本は「就任の予定と報じられている」まで。
#   ・サッカーキングの森保会見記事は2本（2224357／2224344）あるが、塩貝の話は載っていなかった（見出しから判断。本文は読んでいない＝アジア杯延期の話）。
# 食い違い: 記事間で数字の食い違いなし（28人・後藤のみ・塩貝／齋藤／佐藤が選外は、ゲキサカ2本とサッカーキングで一致）。
# 自分で数えたもの: 選外の3人（塩貝・齋藤・佐藤）と継続の1人（後藤）。「4人→1人」とは言わない（前回に後藤のほかにもロス世代がいたかは記事に無い）。
# 本人の言葉: 森保一監督（ゲキサカ。会見の発言）。Y。塩貝本人の言葉は今回なし（本人のコメントは見つからなかった）。
# 前の本との重なり: scripts/20261104_japan_squad_brazil_paraguay（福田師王。選ばれなかった選手の表に塩貝あり）・20261104_asiancup_delay_moriyasu（アジア杯延期・森保監督の最後の指揮）・20261029_shiogai_goto_pokal（塩貝2発）。
#   → 今回の初出は「森保監督が語った『1チーム2カテゴリ』の説明」。福田師王・アジア杯延期・森保監督の退任・塩貝のポカールの話は入れない。
# 扱いの注意: 五輪世代の代表（育成年代）は、題の答えに必要な一言だけ（大岩監督が率いる五輪世代の代表、今月6日発表）。試合・選手の紹介はしない。
