- id: view
  heading: 27歳の誕生日までに並ぶか
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 並べて見える、点の取り方の違い
  say:
  - text: 並べて開いていたのは、点の数ではなく、アシストと出場時間でした。
    image: assets/images/20261002_cmp_pair/01.jpg
  - ハーランドは、エムバペより少ない出場で、ほぼ同じ数の点に届いています。
  - エムバペは19歳で値段の天井に届き、得点の半分近い数のアシストを添えてきました。
  - どちらを重く見るかで、評価は入れ替わります。数字はその両方を示しています。
  - 次の区切りは、ハーランドの27歳の誕生日、来年の7月21日。
  - 比べる相手は、エムバペが27歳の誕生日までに積んだ410点。
  - ハーランドは、26歳までの数に今季の10点を足して、いま369点。
  - あと41点で並びます。ハーランドの昨年10月から今年7月までは43点。
