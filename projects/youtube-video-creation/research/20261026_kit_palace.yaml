sections:
- id: eagle
  main: true
  heading: クリスタル・パレスの紋章の鷲は、どこから来たのか
  bg: assets/images/20261026_kit_palace/k01_kamada.jpg
  tier: 背景
  narrator: 解説
  telop: 鷲は1973年から。監督アリソンが、ポルトガルのベンフィカの鷲に倣った
  card: *eagle
  say:
  - text: 今回は、クリスタル・パレスの、胸の紋章です。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
    emph: true
  - text: 真ん中には、大きな鷲。愛称も、イーグルス。鷲たち、です。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: でも、この鷲が来たのは、1973年。それより前の紋章に、鷲はいません。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *eagle
      highlight_row: 2
    emph: true
  - text: それまでの愛称は、グレイジャーズ。ガラス職人、という意味でした。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *eagle
      highlight_row: 1
  - text: クラブの名前のもとになった、ガラスの建物から来た呼び名です。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: 変えたのは、1973年に来た監督、マルコム・アリソン。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: 古くて地味な印象を、新しくしたかった、と当時の新聞は書いています。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      <<: *eagle
      highlight_row: 2
  - text: 手本にしたのは、ポルトガルのベンフィカ。愛称は、鷲を意味する、アギアス。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      <<: *eagle
      highlight_row: 2
    emph: true
  - text: こうして愛称は、イーグルスに。紋章は、ボールをつかんだ鷲になりました。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: 1987年には、鷲と、ガラスの建物を、1つの紋章にまとめます。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *eagle
      highlight_row: 3
  - text: 2013年の紋章は、ファンの1人の案を、デザイナーと仕上げたもの。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *eagle
      highlight_row: 4
  - text: 前の年には、6つの案で投票もしましたが、はっきりした1位は出ていません。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: いまも、ホームの試合の前には、本物の鷲が、スタジアムの端から端へ飛びます。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
    emph: true
  - text: 2010年から続く、習わし。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  sources:
  - https://web.archive.org/web/20140107072737/http://www.standard.co.uk/sport/football/facelift-for-crystal-palaces-benfica-eagle-7593041.html
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - https://web.archive.org/web/20131113145227/http://www.yourlocalguardian.co.uk/news/10404267.Crystal_Palace_unveils_new_football_club_crest/
  - https://www.historicalkits.co.uk/Crystal_Palace/Crystal_Palace.htm
- id: japan
  heading: 鎌田大地が胸に付けた鷲は、いくつ目か
  bg: assets/images/20261026_kit_palace/k01_kamada.jpg
  tier: 背景
  narrator: 解説
  telop: 鎌田はフランクフルト・ラツィオ・パレスと、3クラブ続けて胸に鷲。胸の広告には1993〜99年、日本のTDK
  card: *kamada
  say:
  - text: 日本との接点は、鎌田大地です。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: 2024年7月1日、ラツィオとの契約を終えて、パレスへ。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: フランクフルトのときの監督、グラスナーと、また組みました。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: クラブ公式の紹介に、こんな一文があります。鷲を着るという、長い伝統を、続けている。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *kamada
      highlight_row: 2
    emph: true
  - text: ドイツで長くいた、アイントラハト・フランクフルト。愛称はアドラー。鷲です。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *kamada
      highlight_row: 0
  - text: 次のイタリア、ラツィオ。紋章は、金色の鷲。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *kamada
      highlight_row: 1
  - text: そして、パレス。3つのクラブ続けて、胸に鷲がいます。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *kamada
      highlight_row: 2
    emph: true
  - text: その鷲を胸に、鎌田はパレスで、タイトルを取ります。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: 2025年5月17日、イングランドのカップ戦、FAカップの決勝。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: パレスは、マンチェスター・シティに、1対0で勝ちます。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: 鎌田は、90分、ピッチに立ちました。パレスが初めて取った、大きなタイトルです。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
    emph: true
  - text: 今季は、日本代表の冨安健洋も、パレスに加わりました。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: もう1つの縁は、シャツの胸。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: 1993年から1999年まで、胸の広告は、ティーディーケーでした。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
    telop: 1993年から1999年まで、胸の広告は、TDKでした
  - text: カセットテープでも知られた、日本の会社。本社は、東京。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: この6年の間に、パレスは、プレミアリーグに2度上がっています。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  sources:
  - https://www.cpfc.co.uk/news/announcement/daichi-kamada-signs-for-crystal-palace/
  - https://www.cpfc.co.uk/teams/first-team/midfielder/daichi-kamada
  - https://en.wikipedia.org/wiki/Eintracht_Frankfurt
  - https://en.wikipedia.org/wiki/SS_Lazio
  - https://www.cpfc.co.uk/news/announcement/palace-sign-takehiro-tomiyasu/
  - https://en.wikipedia.org/wiki/TDK
- id: colours
  heading: 赤と青の縞は、最初からの色だったのか
  bg: assets/images/20261026_kit_palace/f02_parade.jpg
  tier: 背景
  narrator: 解説
  telop: 長い時代の色は、えんじと水色。1938年の白、1964年の全身白を経て、1973年に赤と青の縞
  card: *colours
  say:
  - text: では、シャツの色。いまのホームは、赤と青の縦縞です。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: この縞も、1973年のアリソンが決めたもの。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card: none
  - text: ウィキペディアによれば、手本はバルセロナ。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      <<: *colours
      highlight_row: 4
    emph: true
  - text: その前の長い時代、パレスの色は、えんじと水色でした。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *colours
      highlight_row: 0
  - text: 1905年、プロのクラブができます。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: 立ち上げに加わったのが、エドマンド・グッドマン。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: アストン・ヴィラで、働いていた人です。ヴィラの色も、えんじと水色。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: ただ、クラブの議事録に残る言葉は、カーディナル、深い赤と、青。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      <<: *colours
      highlight_row: 0
  - text: 色の呼び名は、記録で割れます。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: 1938年には、白いシャツに、黒いパンツ。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *colours
      highlight_row: 1
  - text: 1964年には、上から下まで、真っ白。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *colours
      highlight_row: 2
  - text: その2年ほど前に、親善試合をした、レアル・マドリードに倣った、と言われます。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
    emph: true
  - text: 1966年、えんじと水色に戻り、1973年、赤と青の縞へ。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *colours
      highlight_row: 4
  - text: 2005年は、創立100年の記念の年。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: 1971年ごろの、えんじと青と白のシャツを、もう一度着ています。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - https://www.historicalkits.co.uk/Crystal_Palace/Crystal_Palace.htm
- id: building
  heading: 紋章のガラスの建物は、いま、どこにあるのか
  bg: assets/images/20261026_kit_palace/p01_palace.jpg
  tier: 背景
  narrator: 解説
  telop: 水晶宮は1936年に焼け落ちた。紋章に入ったのは、その19年あとの1955年
  card: *building
  say:
  - text: 鷲の後ろにある、ガラスの建物。これが、クリスタル・パレス。水晶宮です。
    image: assets/images/20261026_kit_palace/p01_palace.jpg
    card: none
  - text: もとは、ロンドン万博の建物。それを、ロンドンの南に移して建て直しました。
    image: assets/images/20261026_kit_palace/p01_palace.jpg
    card: none
  - text: 鉄とガラスでできた、巨大な建物です。
    image: assets/images/20261026_kit_palace/p01_palace.jpg
    card: none
    emph: true
  - text: 建物を持つ会社は、1857年、ここでクリケットのクラブも作っています。
    image: assets/images/20261026_kit_palace/p01_palace.jpg
    card:
      <<: *building
      highlight_row: 1
  - text: ところが、1936年11月30日の夜。
    image: assets/images/20261026_kit_palace/p02_palace_close.jpg
    card: none
  - text: 水晶宮は、火事で、焼け落ちます。
    image: assets/images/20261026_kit_palace/p02_palace_close.jpg
    card: none
    emph: true
  - text: 建物の正面が、初めてクラブの紋章になったのは、1955年。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: 焼けて、19年あとのことでした。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *building
      highlight_row: 1
    emph: true
  - text: 1964年に、紋章はいったんシャツから消え、1987年、鷲と並んで戻ります。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *building
      highlight_row: 3
  - text: 2022年には、紋章の年を、1905から1861に替えました。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *building
      highlight_row: 4
  - text: クラブの説明では、1861年に、そのクリケットの仲間が作ったチームが始まり。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  - text: ただ、いまのクラブと、そのチームのつながりには、異を唱える研究もあります。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card: none
  sources:
  - https://www.cpfc.co.uk/news/announcement/crystal-palace-football-club-release-new-1861-crest-for-badge-to-honour-footballing-history/2022-06-18/
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
  - https://www.historicalkits.co.uk/Crystal_Palace/Crystal_Palace.htm
  - https://commons.wikimedia.org/wiki/File:Crystal_Palace_fire_1936.jpg
- id: view
  viewpoint: true
  heading: 見立て・鷲と縞は53年、胸の会社は16社。何が残り、何が替わったのか
  bg: assets/images/20261026_kit_palace/k01_kamada.jpg
  tier: 背景
  narrator: 解説
  telop: 鷲と縞は53年。胸の会社は43年で16社、平均2.7年。TDKの6年は平均の2倍あまり
  card: *view
  say:
  - text: パレスの鷲と縞、そして胸の広告。続いた長さを、並べてみます。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
    emph: true
  - text: 鷲と、赤と青の縞は、どちらも1973年から。53年です。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *view
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: 一方、胸の会社は、1983年から43年で、16社。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: 今季からは、アメリカのソフトウェア会社、テンポラル。
    image: assets/images/20261026_kit_palace/k02_kamada_gold.jpg
    card:
      <<: *view
      highlight_row: 3
  - text: 43を16で割ると、およそ2.7。1社あたり、3年に届きません。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      type: calc
      title: 胸の会社1社の平均（自分で割った）
      terms:
      - - 43年
        - 1983年から
      - - 16社
        - 胸の会社
      - - 約2.7年
        - 割った答え
      ops:
      - ÷
      - ＝
    emph: true
  - text: 日本のティーディーケーは、6年。平均の、2倍あまりです。
    image: assets/images/20261026_kit_palace/f02_parade.jpg
    card:
      type: calc
      title: TDKは平均の何倍か（自分で割った）
      terms:
      - - 6年
        - TDK
      - - 約2.7年
        - 胸の会社の平均
      - - 約2.2倍
        - 割った答え
      ops:
      - ÷
      - ＝
    telop: 日本のTDKは、6年。平均の、2倍あまりです
  - text: そして、鷲と縞の53年。これは、2.7年の、およそ20倍です。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card:
      <<: *view
      highlight_row: 1
  - text: 紋章の水晶宮は、焼けてから90年。建物はもう無いのに、胸には残っています。
    image: assets/images/20261026_kit_palace/p01_palace.jpg
    card:
      <<: *view
      highlight_row: 2
    emph: true
  - text: 胸の広告は数年で替わり、鷲と、焼けた建物は、半世紀を超えて残る。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
  - text: その鷲を、いま、3つ目のクラブで着ているのが、鎌田大地です。
    image: assets/images/20261026_kit_palace/k01_kamada.jpg
    card: none
    emph: true
  sources:
  - https://en.wikipedia.org/wiki/Crystal_Palace_F.C.
