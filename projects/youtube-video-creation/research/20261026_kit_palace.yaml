# ユニフォームとエンブレムの歴史 クリスタル・パレス（10/26 作成）。雛形は 10/25 エヴァートン回。
# 題の問い：クリスタル・パレスの紋章の鷲は、どこから来たのか。
# 重なり確認（2026-10-26）：scripts/・research/covered.yaml の kit_*・research/posted.json を grep。パレスのユニフォーム回は無し
#   （20261023_stadium_palace はスタジアム、20260920_pl08_palace はクラブ紹介、20261008_palace_ranking・20261019_kamada_palace_brighton はニュース。いずれも別シリーズ）。
# 今季のリーグ：ウィキペディア en "2026–27 Premier League" の20クラブにクリスタル・パレスがある（プレミアの1部）。
# 取材：requests（ブラウザ User-Agent）だけ。ブラウザ操作・JS実行・検索のAI要約を根拠にはしていない。
#   読んだ：ウィキペディア en "Crystal Palace F.C."（Colours and crest／Kit manufacturers and sponsors／Mascots）、"Daichi Kamada"、"TDK"、
#     "Eintracht Frankfurt"・"SS Lazio"（どちらも紋章が鷲）、"2026–27 Crystal Palace F.C. season"（冨安の加入）。
#   クラブ公式：鎌田の加入 2024-07-01、鎌田の選手ページ（"continues a long tradition of wearing Eagles"、FAカップ決勝で90分、背番号18）、
#     冨安の加入 2026-08-07（背番号17）、1861年の紋章 2022-06-18（1905→1861、建物は1936年に焼失＝歴史家マニングの言葉）、
#     テンポラル 2026-05-21（2026/27 から胸の広告）。
#   イブニング・スタンダード 2012-03-27（web.archive）：アリソン（1973〜76）がベンフィカの鷲（アギアス）に倣い、グレイジャーズ→イーグルス。
#     えんじと水色との68年の縁を終わらせ、赤と青の縞に。6案からファン投票。キャラ（本物の鷲）がピッチを飛ぶ。
#   クロイドン・ガーディアン 2013-05-08（web.archive）：新しい紋章。前年の投票ははっきりした1位が出ず、ファンの1人がデザイナーと描いた。
#     塔・ガラスの建物・鷲を残し、創立の年を足した。
#   Historical Football Kits（HFK。ファンの資料サイトだが典拠を明記）：1905-07-05 の議事録「Cardinal and Blue jerseys」、
#     1935-36 に頭文字の刺繍、1955 に水晶宮の正面の紋章、1964 全身白、1972 丸い紋章（Glaziers）、1987 新しい紋章、2013-14 から新紋章、
#     2022 に 1861 へ。1861 の系譜には Metcalf と Nicholson の反論がある、とも書く。
# ---- 食い違い・断ったこと ----
#   ・1905年の色：ウィキペディアは「えんじと水色（Villa の Goodman の縁）」、HFK は議事録の「cardinal（深い赤）と青」、
#     クラブ公式の歴史家マニングの言葉は「1905年に赤と青」→台本では「ウィキペディアはえんじと水色、議事録の言葉はカーディナルと青。呼び名は記録で割れる」と両方言う。
#   ・2013年の紋章：ウィキペディアは「2012年に更新」、スタンダード（2012-03）は投票、クロイドン・ガーディアン（2013-05）と HFK は2013年発表・2013/14 から
#     →「2013年」と言う。2012年の投票の勝った案が使われたかは割れる→「前の年の投票では、はっきりした1位が出なかった」だけ言う。
#   ・1973年の縞の手本：バルセロナはウィキペディアだけ（スタンダードは触れない）→「ウィキペディアによれば」と付ける。
#   ・1964年の全身白：ウィキペディア「レアル・マドリードに倣った」、HFK「そう思われることが多い」→「倣った、と言われます」。
#   ・「クラブ初の日本人選手」はウィキペディアだけで、クラブ公式の加入記事の本文に見当たらない→今回は言わない（10/23 スタジアム回でも使用済み）。
#   ・鎌田の出場数はクラブのページの中で割れる（25/26 が本文46、表30）→出場数は言わない。
#   ・建物の万博の年（1851）はこの回の出典で確かめていない→年は言わず「ロンドン万博の建物」とだけ（HFK "former Great Exhibition building"）。
#   ・いまの紋章の鷲がボールをつかんでいるかは確かめていない→1973年の紋章（ウィキペディア：eagle holding a ball）だけに言う。
# ---- 自分で数えた数 ----
#   2026−1973=53年（鷲・赤と青の縞）。1973−1905=68年（スタンダードの「68年」と一致）。1955−1936=19年。2026−1936=90年。
#   胸の会社（ウィキペディアの一覧）：レッド・ローズ・トップスコア・AVR・アンドリュー・コープランド・フライ・ヴァージン・チューリップ・TDK・チャーチル・
#     GAC・ネッテラー・マンション・マンベットX・W88・シンチ・NET88・テンポラル＝16社。1983年から 2026−1983=43年、43÷16≒2.7年。
#   TDK は 1993〜1999＝6年。6÷2.7≒2.2倍。いちばん長いのは GAC（2006〜14、8年）→TDK を「いちばん」とは言わない。
#   53÷2.7≒19.6→「およそ20倍」。
# ---- 日本との接点 ----
#   鎌田大地（2024-07-01 加入、背番号18、クラブ公式の紹介「鷲を着る長い伝統を続けている」＝フランクフルト・ラツィオ・パレスの3クラブとも紋章が鷲）。
#   冨安健洋（2026-08-07 加入、背番号17）。胸の広告 TDK（1993〜1999、東京の電機メーカー）。第2節に置いた。女子チームの話は入れていない。
# ---- 写真（assets/images/20261026_kit_palace/、出典は credits.json）----
#   Commons の CC・CC0 のみ（鎌田2枚＋サムネ用の切り出し・水晶宮1枚から2つの切り出し・パレード）。代理店・放送映像なし。
#   1936年の火事の写真（PD）と1854年の水晶宮・FAカップ優勝の表彰台は、元が小さく1.6倍を超えて引き伸ばすので使わなかった。
#   10/23 スタジアム回の写真とは別のファイル。エンブレム画像は使っていない。
