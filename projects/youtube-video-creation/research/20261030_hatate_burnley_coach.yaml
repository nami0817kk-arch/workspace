#     指導者としてローザンヌ・スポルト・ルツェルン、バーゼルで2024-25にリーグと国内カップの2冠、直近はCSKAモスクワ。旗手は今夏の移籍市場最終日にセルティックから加入、リーグ戦8試合1ゴール2アシスト。
#   ・サッカーキング 2220791（2026-10-25）解任の記事。「後任は未定」。ヘイエン氏はベルギー出身、ブルッヘ・ゲンクを率いた。リンカーン戦の逆転負けが「決め手」。同じく8試合1ゴール2アシスト。
#   ・サッカーキング 2215281（2026-10-11）旗手の初ゴールの試合（ワトフォード戦4-0、今季初勝利）。旗手は2試合連続先発。今季の唯一の1勝がこの試合（10/25 の1勝5分6敗と突き合わせ）。
#   ・ESPN scoreboard（eng.2, 2026-10-31）で、次の試合はポーツマス戦（バーンリーのホーム）、キックオフは現地31日（土）。時刻は言わない。
#   ・バーンリー公式のセレスティーニ発表ページは JS 描画で本文が読めなかった → 公式の文面は引かない。確度は報道（サッカーキング1社＋ESPN日程）。
# 資料間のずれ: 旗手の出場数が 10/11 の記事は「公式戦5試合」、10/25・10/29 は「リーグ戦8試合」。新しい10/29 の「リーグ戦8試合・1G2A」を使う（12試合のうち8試合）。
# 言わないこと: 新監督の戦術・旗手の起用方針（どこにも語られていない）、ヘイエン前監督の中身の評価、見出しに無い順位の動き、キックオフ時刻、公式の文面。
#   「忘れ去られた」「低迷」などの小さく見せる言い方・煽る言い方は使わない。「去年」「昨季」（辞書で「さっき」）は使わない。
# 本人の言葉: **無い**（今回の記事に旗手のコメントは無く、新監督の就任に旗手が触れた記事も見つからない）→ 型は X。
# 反応: 探していない（0件。作らない。承認は --no-voices）。
# 重なり: 10/15 の旗手の本（初ゴール・ワトフォード戦）と同じ「旗手」だが話が違う（そちらは試合、こちらは監督交代）。ワトフォード戦は1行だけ。ヘイエン氏の「まだ1勝」の発言は引かない。
