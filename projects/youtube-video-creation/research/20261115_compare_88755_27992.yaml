# **選んだ理由**：2025年夏に、同じく移籍金なしでセリエAへ移った35歳と41歳の中盤。昨季の出場時間は 1360分 と 2864分（2倍以上の差）、点に絡んだ数は 9 と 5。
#   「どちらが時間を使い、どちらが速く絡んだか」で軸が立つ（自分で割る）。2人ともクラブの公式戦だけで数える（代表戦は混ぜない）。
#   重なり：scripts/*compare*・posted.json・covered.yaml・picks を grep。この2人の組は初めて。デ・ブライネ・モドリッチとも比べるの回には未登場。
#   同じ日（11/15）の picks には人名の重なり無し。11/17 の比べる（ロドリ×アンダーソン）とも人もクラブも重ならない。
#   **外した候補**：サラー（TM の現所属がトラブゾンスポルでトップ7リーグ外）・ベリンガム×ライス（別の相手と比較済み）・ヤマル×ユルドゥズ（ヤマルが10/20・10/22 に登場済み）。
#   日本との接点：無し（入れない）。
# **2人とも今季も欧州7リーグの1部**：ナポリ（セリエA。TM の現所属 6195、2025-07-01〜）・ミラン（セリエA。TM の現所属 5、2025-07-14〜）。契約は2人とも 2027-06-30 まで。
# **使った数**（TM の performance-season の、クラブのトップチームの公式戦だけ。代表戦は混ぜない。試合・出場時間・得点・アシスト）
#   デ・ブライネ：23/24 シティ 26試合 1750分 6点18A／24/25 シティ 40試合 2391分 6点8A／25/26 ナポリ 21試合 1360分 5点4A（うちPK 3点）／26/27 ナポリ 15試合 983分 4点2A（11月12日時点）
#   モドリッチ：23/24 レアル 46試合 2243分 2点8A／24/25 レアル 63試合 2985分 4点9A／25/26 ミラン 37試合 2864分 2点3A（PK 0点）／26/27 ミラン 13試合 802分 0点2A
#   25/26 セリエAの先発：デ・ブライネ 13（18試合）・モドリッチ 32（34試合）。26/27 の先発（全大会）：デ・ブライネ 10・モドリッチ 8。
#   計算：25/26 1つ絡むまで 1360÷9＝151.1／2864÷5＝572.8。PKを除く 1360÷6＝226.7／2864÷5＝572.8。26/27 1つ絡むまで 983÷6＝163.8／802÷2＝401。出場時間の比 2864÷1360＝2.1。
# 市場価値（TM）：デ・ブライネ 2023-06 7000万€→2024-05 5000万→2024-12 3500万→2025-05 2000万→2025-12 1500万→2026-05 800万（最高 1億5000万€ は2019-12）／モドリッチ 2023-06 1000万→2024-06 600万→2024-12 500万→2025-06 400万→2025-12 400万→2026-05 350万（最高 5500万€ は2015-01）
# 経歴（Wikipedia 英語版）：デ・ブライネ 2025年6月12日にナポリが発表、移籍金なし。2025年10月25日のインテル戦（3-1）でPKのあとにハムストリングを痛め、2026年3月6日のトリノ戦に交代で戻った。
