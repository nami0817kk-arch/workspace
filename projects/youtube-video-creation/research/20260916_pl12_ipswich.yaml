sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称は「トラクター・ボーイズ」
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年10月16日"]
        - ["プロ化", "1936年"]
        - ["愛称", "The Blues／The Tractor Boys"]
        - ["収容人数", "30,056人"]
    say:
      - "このクラブは、自分たちのことを「**トラクター・ボーイズ**」と呼びます。"
      - 農業が盛んな土地で、**自分たちで自分たちを茶化した**呼び名です。
      - もうひとつ「ザ・ブルーズ」とも呼ばれます。こちらはユニフォームの色です。
      - 創設は1878年10月16日。プロになったのは**1936年**で、58年かかっています。
      - 本拠地はポートマン・ロード。収容は3万56人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  - id: champion
    heading: 上がった年に、優勝した
    main: true
    tier: 背景
    telop: 1961-62年。率いたのはアルフ・ラムゼイ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1961-62年", "1部初挑戦で優勝"]
        - ["1981年", "UEFAカップ優勝（AZに5-4）"]
    say:
      - "**1部に上がった、その最初のシーズンに優勝しました。**1961年から62年のことです。"
      - 率いていたのはアルフ・ラムゼイ。のちにイングランド代表を率いる監督です。
      - 1981年にはUEFAカップを制しました。決勝は2試合の合計で、AZに5対4です。
      - この時期に指揮していたのがボビー・ロブソン。1969年から82年まで、**709試合**を指揮しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: セルティックから来た前田大然がいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ゲイリー・オニール"]
        - ["主将", "ダラ・オシェイ（CB・アイルランド）"]
        - ["エース", "ジャック・クラーク（FW・イングランド）"]
        - ["昨季", "16点でチーム得点王"]
        - ["日本人選手", "前田大然（背番号38）"]
    say:
      - このクラブには、**前田大然**がいます。
      - セルティックから今年7月に来たばかりで、まだ得点はありません。
      - 監督はゲイリー・オニール。
      - 主将はダラ・オシェイ。ダブリン生まれの、アイルランド代表センターバックです。
      - 2024年にバーンリーから来て、**昇格を決めたシーズンの前に主将に指名**されました。
      - エースはジャック・クラーク。昨季ひとりで**16点**を挙げた左ウイングです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ノリッジとのイースト・アングリアン・ダービー
    narrator: 解説
    card:
      type: table
      title: イースト・アングリアン・ダービー
      columns: ["", ""]
      rows:
        - ["相手", "ノリッジ・シティ"]
        - ["初対戦", "1902年11月15日（0-1）"]
        - ["プロ同士の初戦", "1939年9月2日（1-1）"]
        - ["今季", "相手はプレミアリーグにいない"]
    say:
      - 宿敵は**ノリッジ・シティ**です。
      - 呼び名は**イースト・アングリアン・ダービー**。2つの州の名前から来ています。
      - 初めて当たったのは**1902年11月15日**。どちらもまだアマチュアでした。
      - 舞台はノーフォーク＆サフォーク・リーグ。結果は0対1で、ノリッジが勝っています。
      - 完全なプロ同士のリーグ戦になったのは**1939年9月2日**。
      - 3部南地区、ポートマン・ロードでの1対1の引き分けでした。
      - ただしノリッジは、**今季のプレミアリーグにはいません。**
      - この一戦が戻るには、どちらかが動く必要があります。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/East_Anglian_derby
  - id: legends
    heading: このクラブを語る3人
    tier: 背景
    telop: 741試合のミルズ、259得点のクロフォード、ウォーク
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ミック・ミルズ", "公式戦741試合（クラブ記録）"]
        - ["レイ・クロフォード", "公式戦通算259得点"]
        - ["ジョン・ウォーク", "欧州カップ戦で単季14得点"]
    say:
      - まず**ミック・ミルズ**。1966年から1982年まで、公式戦741試合。クラブの記録です。
      - 1971年から主将を務め、FAカップとUEFAカップの両方を掲げました。
      - 次に**レイ・クロフォード**。2期に分かれて在籍し、公式戦通算259得点です。
      - 1部を制した年には**33得点**を挙げ、リーグの得点王になっています。
      - 3人目は**ジョン・ウォーク**。1980年から81年、ヨーロッパで**14得点**を決めました。
      - 当時の欧州カップ戦で、1シーズンの最多記録に並ぶ数字です。
      - 決勝のAZ戦では、2試合とも得点しています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Mick_Mills
      - https://en.wikipedia.org/wiki/Ray_Crawford_(footballer)
      - https://en.wikipedia.org/wiki/John_Wark
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: ヨーロッパを獲った年、胸には日本企業の名前があった
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "1回（1961-62）"]
        - ["FAカップ", "1回（1977-78）"]
        - ["ヨーロッパ", "UEFAカップ1回（1980-81）"]
        - ["胸スポンサー", "パイオニア（1981年-1985年）"]
    say:
      - "**ヨーロッパを獲った年、このクラブは日本企業の名前を胸に付けていました。**"
      - "1981年、契約した相手は日本の**パイオニア**。クラブ史上はじめての公式スポンサーです。"
      - 契約は1985年まで。ポートマン・ロードのスタンドは、1999年まで「パイオニア・スタンド」と呼ばれていました。
      - 獲ってきたのは3つ。1961年から62年の1部優勝、1978年のFAカップ、そして1981年のUEFAカップです。
      - そのクラブに、いま**前田大然**がいます。
      - 前はセルティックで、公式戦133試合44得点。日本代表でも30試合5得点です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
