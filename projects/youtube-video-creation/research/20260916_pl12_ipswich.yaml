sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称は「トラクター・ボーイズ」
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年10月16日"]
        - ["プロ化", "1936年"]
        - ["愛称", "The Blues／The Tractor Boys"]
        - ["収容人数", "30,056人"]
    say:
      - アルファベット順では、12番目に来ます。
      - 創設は1878年10月16日。プロになったのは**1936年**で、58年かかっています。
      - 愛称は2つ。ひとつは「ザ・ブルーズ」、ユニフォームの色です。
      - もうひとつが「**トラクター・ボーイズ**」。
      - このあたりは農業が盛んな土地で、**自分たちで自分たちを茶化した**呼び名です。
      - 本拠地はポートマン・ロード。収容は3万56人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  - id: champion
    heading: 上がった年に、優勝した
    main: true
    tier: 背景
    telop: 1961-62年。率いたのはアルフ・ラムゼイ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1961-62年", "1部初挑戦で優勝"]
        - ["1978年", "FAカップ優勝（アーセナルに勝利）"]
        - ["1981年", "UEFAカップ優勝（AZに5-4）"]
    say:
      - このクラブには、ほかであまり聞かない記録があります。
      - 1961年から62年。**1部に上がった、その最初のシーズンに優勝しました。**
      - 率いていたのはアルフ・ラムゼイ。のちにイングランド代表を率いる監督です。
      - タイトルはほかにもあります。
      - 1978年、ウェンブリーでアーセナルを下してFAカップ。**クラブ唯一のFAカップ**です。
      - 1981年にはUEFAカップを制しました。決勝は2試合の合計で、AZに5対4です。
      - この時期に指揮していたのがボビー・ロブソン。1969年から82年まで、**709試合**を指揮しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はダラ・オシェイ
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ゲイリー・オニール"]
        - ["主将", "ダラ・オシェイ（CB・アイルランド）"]
        - ["エース", "ジャック・クラーク（FW・イングランド）"]
        - ["昨季", "16点でチーム得点王"]
        - ["日本人選手", "前田大然（背番号38）"]
    say:
      - 監督はゲイリー・オニールです。
      - 主将はダラ・オシェイ。ダブリン生まれの、アイルランド代表センターバックです。
      - 2024年にバーンリーから来て、**昇格を決めたシーズンの前に主将に指名**されました。
      - エースはジャック・クラーク。昨季ひとりで**16点**を挙げた左ウイングです。
      - そして、このクラブには**前田大然**がいます。
      - セルティックから今年7月に来たばかりで、まだ得点はありません。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: back
    heading: 22年ぶりに戻ってきた
    tier: 背景
    telop: 3部から2年続けて上がった
    narrator: 解説
    card:
      type: table
      title: 落ちて、戻るまで
      columns: ["", ""]
      rows:
        - ["離れた期間", "22年"]
        - ["最も低いとき", "3部"]
        - ["2023年・2024年", "2年続けて昇格"]
        - ["続けて昇格", "イングランドで5チーム目"]
    say:
      - 優勝したクラブも、長く沈むことがあります。
      - イプスウィッチは1部を離れ、**22年**帰ってきませんでした。
      - 3部にまで落ちています。
      - そこから2023年、2024年と**2年続けて昇格**しました。
      - 3部から2部へ、2部から1部へ。続けて上がったのは、イングランドで**5チーム目**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝1回（1961-62）、FAカップ1回（1977-78）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "1回（1961-62）"]
        - ["FAカップ", "1回（1977-78）"]
        - ["リーグカップ", "0回"]
        - ["ヨーロッパ", "UEFAカップ1回（1980-81）"]
    say:
      - 数えると、大きなタイトルは**3つ**です。
      - 1961年から62年の1部優勝、1978年のFAカップ、1981年のUEFAカップ。
      - "**1978年のFAカップ以来、タイトルがありません。**"
      - そのクラブに、いま**前田大然**がいます。
      - 前はセルティックで、公式戦133試合44得点。日本代表でも30試合5得点です。
      - スポンサーの話も、日本と関わります。
      - "1981年、このクラブは日本の**パイオニア**と契約しました。クラブ史上はじめての公式スポンサーです。"
      - 契約は1985年まで。ポートマン・ロードのスタンドは、1999年まで「パイオニア・スタンド」と呼ばれていました。
      - "**UEFAカップを獲った1981年のイプスウィッチは、日本企業の名前を胸に付けていた**ことになります。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
