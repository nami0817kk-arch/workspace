sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称は「トラクター・ボーイズ」
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1878年10月16日"]
        - ["プロ化", "1936年"]
        - ["愛称", "The Blues／The Tractor Boys"]
        - ["収容人数", "30,056人"]
    say:
      - アルファベット順では、12番目に来ます。
      - 創設は1878年10月16日。プロになったのは**1936年**で、58年かかっています。
      - 愛称は2つ。ひとつは「ザ・ブルーズ」、ユニフォームの色です。
      - もうひとつが「**トラクター・ボーイズ**」。
      - このあたりは農業が盛んな土地で、**自分たちで自分たちを茶化した**呼び名です。
      - 本拠地はポートマン・ロード。収容は3万56人です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.

  - id: champion
    heading: 上がった年に、優勝した
    main: true
    tier: 背景
    telop: 1961-62年。率いたのはアルフ・ラムゼイ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1961-62年", "1部初挑戦で優勝"]
        - ["1978年", "FAカップ優勝（アーセナルに勝利）"]
        - ["1981年", "UEFAカップ優勝（AZに5-4）"]
    say:
      - このクラブには、ほかであまり聞かない記録があります。
      - 1961年から62年。**1部に上がった、その最初のシーズンに優勝しました。**
      - 率いていたのはアルフ・ラムゼイ。のちにイングランド代表を率いる監督です。
      - タイトルはほかにもあります。
      - 1978年、ウェンブリーでアーセナルを下してFAカップ。**クラブ唯一のFAカップ**です。
      - 1981年にはUEFAカップを制しました。決勝は2試合の合計で、AZに5対4です。
      - この時期に指揮していたのがボビー・ロブソン。1969年から82年まで、**709試合**を指揮しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.

  - id: japan
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本人選手がいます。前田大然
    narrator: キャスター
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "ゲイリー・オニール（2026年6月23日就任）"]
        - ["日本人選手", "前田大然（背番号38）"]
    say:
      - このクラブには、日本人選手がいます。**前田大然**です。
      - 登録は前線で、背番号は38。
      - 監督はゲイリー・オニール。2026年6月23日に就任しました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.

  - id: back
    heading: 22年ぶりに戻ってきた
    tier: 背景
    telop: 3部から2年続けて上がった
    narrator: 解説
    say:
      - 優勝したクラブも、長く沈むことがあります。
      - イプスウィッチは1部を離れ、**22年**帰ってきませんでした。
      - 3部にまで落ちています。
      - そこから2023年、2024年と**2年続けて昇格**しました。
      - 3部から2部へ、2部から1部へ。続けて上がったのは、イングランドで**5チーム目**です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Ipswich_Town_F.C.
