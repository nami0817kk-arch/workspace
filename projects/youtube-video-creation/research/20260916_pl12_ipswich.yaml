# プレミアリーグ20クラブ紹介 ⑫イプスウィッチ・タウン（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**前田大然（背番号38）。
#
# 引きは**「1部に上がった最初の年に、そのまま優勝した」**。ここが山場（@main）。
# 率いていたのは、のちにW杯を獲る監督
#
# **2026-09-18 ユーザー指示で書き直した。**「アルファベット順では12番目」の行を消し、
# 各節の1行目をその節でいちばん引きの強い事実に入れ替えた。
# 優勝の節は「獲ったやつだけ」にし、「数えると3つ」「1978年以来タイトルがありません」と
# リーグカップ0回の行を落として、1981年のUEFAカップとパイオニアの話から入る形にした。
#
# **2026-09-18 ユーザー指示（もっと興味を引く形に）で、さらに足した。**
#   ・タイトルとサムネを「丸数字＋クラブ名＋引き」に変え、**前田大然を頭に出した**
#   ・**宿敵（rival）**の節を足した。ノリッジとのイースト・アングリアン・ダービー
#     （相手は今季のプレミアにいない、と断る）
#   ・**このクラブを語る3人（legends）**の節を足した（出典は英語版Wikipedia）
#
# **2026-09-19 ユーザー指示（クラブの歴史はもう少しシンプルに）で、歴史の節を整理した。**
# 「22年ぶりに戻ってきた」（2023・2024の連続昇格、3部まで落ちた22年）を丸ごと落とし、
# 「上がった年に、優勝した」から優勝の節と重なる1978年のFAカップの2行を落とした。**前田大然の行は残している。**
format: news
