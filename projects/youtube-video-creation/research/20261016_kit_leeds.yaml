- id: crest
  heading: 紋章は、いつ何に替わってきたのか
  tier: 背景
  telop: 紋章の絵は1964年から10種類。フクロウ、スマイリー、バラ、盾と替わってきた
  narrator: 解説
  card: &id_crest
    type: timeline
    title: 胸の紋章の変遷
    rows: &rows_crest
    - - 1934年
      - リーズ市の紋章をシャツに
    - - 1961年〜
      - 白いシャツに替わり、紋章なし
    - - 1964年
      - フクロウの紋章が付く
    - - 1973年
      - L・Uの丸字「スマイリー」
    - - 1984年
      - 白いバラとボールの紋章
    - - 2019年
      - 100周年の紋章
    focus: 1964年
  say:
  - text: 次は、胸に付く紋章の歴史です。
    image: assets/backgrounds/cut_リーズ.png
    card: none
  - text: 最初の紋章は1934年。リーズ市の紋章を、そのまま使いました。
    image: assets/images/20261016_kit_leeds/c01_1965_w.jpg
    card:
      <<: *id_crest
      highlight_row: 0
  - text: これは数えず、専用の紋章が付いた1964年から数えます。
    card:
      <<: *id_crest
      highlight_row: 0
  - text: 白いシャツへ替わると、胸の紋章はしばらく外れます。
    card:
      <<: *id_crest
      highlight_row: 1
  - text: 1964年、フクロウが付きました。市の紋章に3羽いる鳥です。
    emph: true
    card:
      <<: *id_crest
      highlight_row: 2
  - text: 1971年に斜めのエルユーエフシーの字、73年に丸字の「スマイリー」。
    card:
      <<: *id_crest
      highlight_row: 3
  - text: 1976年に色を反転、77年に円で囲み、80年にクジャクを入れます。
    card:
      <<: *id_crest
      highlight_row: 3
  - text: ここまでで6種類。1984年に、白いバラとボールが付きます。
    image: assets/images/20261016_kit_leeds/c02_1966_w.jpg
    card:
      <<: *id_crest
      highlight_row: 4
  - text: 98年に盾の形になり、99年には、ボールが戻ります。
    card:
      <<: *id_crest
      highlight_row: 4
  - text: そして2019年、100周年の紋章に替わります。
    card:
      <<: *id_crest
      highlight_row: 5
  sources:
  - https://en.wikipedia.org/wiki/Leeds_United_F.C.
  - https://www.historicalkits.co.uk/Leeds_United/Leeds_United.htm
  - https://web.archive.org/web/20190801id_/https://www.leedsunited.com/news/club/25148/2019-20-centenary-home-kit-launched
- id: deal
  heading: 作り手と胸のスポンサーは、クラブ史上初と史上最大の契約をどう発表したのか
  tier: 確定
  official: true
  telop: 2020年、アディダスはクラブ史上初。胸のスポンサーのエスビーオートップは史上最大の商業契約と、クラブが発表
  narrator: キャスター
  card: &id_deal
    type: table
    title: 作り手と胸の広告、クラブの発表
    columns: &cols_deal
    - いつ
    - 誰が
    - クラブの言葉
    rows: &rows_deal
    - - 1973-74
      - アドミラル
      - 名前が見えるシャツ
    - - 2015年6月
      - カッパ
      - 5年契約
    - - 2020年7月
      - アディダス
      - 史上初・新記録
    - - 2020年8月
      - エスビーオートップ
      - 史上最大の商業契約
    - - 2024年5月
      - レッドブル
      - 胸に付く・出資も
    highlight_row: 2
  say:
  - text: 次は、シャツの作り手と、胸のスポンサーの話です。
    image: assets/images/20261016_kit_leeds/c05_2023_w.jpg
    card: *id_deal
  - text: 1973-74、1部で初めて、作り手の名前が見えるシャツを着たのがリーズ。
    card:
      <<: *id_deal
      highlight_row: 0
  - text: 作り手とは、シャツを作るメーカーのことです。
    card:
      <<: *id_deal
      highlight_row: 0
  - text: 作ったのはアドミラル。ファンが買う同じ形のシャツも、ここから広がったと言われます。
    card:
      <<: *id_deal
      highlight_row: 0
  - text: 2015年6月、クラブはカッパとの5年契約を発表します。
    card:
      <<: *id_deal
      highlight_row: 1
  - text: 練習着や下部組織の分も含み、額は出ていません。
    card:
      <<: *id_deal
      highlight_row: 1
  - text: 2020年7月21日、アディダスが、公式のシャツの作り手になります。
    image: assets/images/20261016_kit_leeds/c03_2019_w.jpg
    card:
      <<: *id_deal
      highlight_row: 2
  - text: アディダスと組むのは、クラブの歴史で初めてと発表されました。
    emph: true
    callword: クラブ史上初
    card: none
  - text: 試合用と練習用を、5年にわたって作る契約です。
    card:
      <<: *id_deal
      highlight_row: 2
  - text: クラブは「新記録の契約」と呼び、額は出ていません。
    card:
      <<: *id_deal
      highlight_row: 2
  - text: 胸のスポンサーは、2020年8月10日、エスビーオートップに決まりました。
    image: assets/images/20261016_kit_leeds/c05_2023_w.jpg
    card:
      <<: *id_deal
      highlight_row: 3
  - text: クラブの発表は、これを「クラブ史上最大の商業契約」としています。
    card:
      <<: *id_deal
      highlight_row: 3
  - text: お金を生む契約のなかで最大、という言い方です。
    card:
      <<: *id_deal
      highlight_row: 3
  - text: 2024年5月30日には、レッドブルが、次のシーズンから胸に付くと発表します。
    card:
      <<: *id_deal
      highlight_row: 4
  - text: この契約には、クラブの株の一部を持つ出資も含まれます。
