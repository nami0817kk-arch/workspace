- id: crest18
  main: true
  heading: 新しい紋章を出した翌日、クラブは何と言ったのか
  tier: 確定
  official: true
  telop: 2018年1月、新しい紋章の案を出した翌日に、サポーターとの協議を延ばすと声明。取り下げとは書いていない
  narrator: キャスター
  card: &id_doc
    type: document
    label: リーズ・ユナイテッド公式声明「紋章の協議」（2018年1月25日）の訳
    paragraphs:
    - 昨日公開した新しい紋章の案に、サポーターの皆さんが意見を寄せてくれたことに感謝します。
    - 寄せられた意見の数と深さは、このクラブへの皆さんの情熱の強さを、あらためて示しました。
    - 現在の取締役会はクラブの預かり手にすぎず、サポーターはいつも中心にいます。皆さんの声は聞き届けられます。
    - 新しい時代を象徴する紋章に変えたいという声を、十分に調べました。ただ、サポーターとの協議を延ばす必要も理解しています。誰もが誇れる姿を、皆さんと一緒につくります。
    - サポーターが関われる方法は、来週お知らせします。
    highlight:
    - 協議を延ばす
    - 来週
