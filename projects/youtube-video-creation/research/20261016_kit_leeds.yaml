  say:
  - text: まずは、シャツの色です。
    image: assets/images/20261016_kit_leeds/c01_1965_w.jpg
    card: *id_colour
  - text: いまは白のクラブですが、創立のころは別の色でした。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: ハダースフィールド・タウンの、青と白の縞をまねたものです。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: 縞をまねた理由として、こう伝えられます。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: そのクラブの会長が、リーズとの合併を狙っていたため、と。
    card:
      <<: *id_colour
      highlight_row: 0
  - text: そのあとは、青と金の半々、金のシャツに青い袖と替わります。
    card:
      <<: *id_colour
      highlight_row: 1
  - text: 全身が白になったのは、1961-62のシーズンです。
    emph: true
    image: assets/images/20261016_kit_leeds/c02_1966_w.jpg
    card:
      <<: *id_colour
      highlight_row: 2
  - text: レアル・マドリードにならった、と伝えられています。
    card:
      <<: *id_colour
      highlight_row: 2
