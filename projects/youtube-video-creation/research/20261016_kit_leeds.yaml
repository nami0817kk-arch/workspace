# ユニフォームとエンブレムの歴史 リーズ・ユナイテッド（10/16 公開予定。プレミア⑬）。
# 一次情報（クラブ公式の声明・発表）まで辿り、固有名詞・数字・年は原文で引き直した。
# 2026-10-16 取材。取材はブラウザ操作なし（requests と WebFetch のみ）。
#
# ---- 節の並び（チェルシー=契約→紋章→色→広告→見立て、と重ねない）----
#   こちら：①**紋章の案を出した翌日の声明（main）→ ②紋章の変遷 → ③白の始まり → ④作り手と胸の広告 → ⑤見立て**
#   強い一点の型：**クラブの声明の原文**（2018年1月25日）。新しい紋章の案を公開した翌日に「協議を延ばす」と出した。
#   （リヴァプール＝描き直しの回数／マンU＝文字が消えた／ハル＝色が消えた2度／イプスウィッチ＝売上／チェルシー＝払った違約金）
#
# ---- 強い一点（原文）----
#   リーズ公式 2018-01-25「Club Statement: Crest Consultation」（web.archive.org の保存。元は leedsunited.com/news/club-news/22927/）
#     「thank our supporters for their feedback on the proposed new crest released yesterday」＝公開は前日（2018-01-24）。
#     「we also appreciate the need to extend the consultation with supporters」／「We will release further information on how supporters can get involved in the process next week」
#     **「取り下げ」「撤回」とは書いていない**。台本も「協議を延ばす」と言い、取り下げたとは言わない。
#   リーズ公式 2019-07-09「2019/20 centenary home kit launched」：金色の「centenary crest」を刺繍。Paul Bell「the all new centenary crest on the shirt and shorts」。
#
# ---- 食い違い（台本では言わない。ここに残す）----
#   ・**新しい紋章の案の公開日**：en.wikipedia・愛好家サイト（historicalkits）は「2018年2月」と書く／**クラブ公式の声明は 1/25 付で「昨日公開」**＝1/24。
#     → **台本は「2018年1月」**（公式に従う）。署名の数（「2時間で1万6000人」）は愛好家サイト単独の記述で原文に当たれなかった → **言わない**。
#   ・**創立期の最初のシャツ**：HFK は「1919-20 は黒と白の縞」、Wikipedia は「最初のシャツはハダースフィールドの青と白の縞」。
#     → **台本は「創立のころ、青と白の縞を着た時期がある」まで**。年は言わない。
#   ・**アドミラルの1973年**：Wikipedia(Admiral Sportswear) は「1973-74 シーズンにリーズが1部で最初の“名前が見えるシャツ”を着た」と書くが、作り手名を直接は書かない。
#     HFK は「1973年12月から Admiral」。→ 台本は「作り手の名前が見えるシャツ」「作ったのはアドミラル」を背景として言い、**確度は背景（愛好家サイトと Wikipedia）**。
#   ・**紋章の種類の数え方**：Wikipedia(Leeds United F.C. の Badge 節) の年表（1964・71・73・76・77・80・84・98・99・2019）を**そのまま数えた**。
#     1999 の「バラの中にボールを足した」微修正と 1971 の「斜めの LUFC 字」を1種類に数えるかは分かれる → 見立てで「10種類」と言うが、**数え方は取材メモにここで残す**。
#     2019 は愛好家サイトの「100周年の改定版」。クラブ公式（2019-07-09）は「金色の100周年の紋章」としか書かない。
#
# ---- 言わないと決めたもの ----
#   ・**契約の額**：カッパ（2015）・アディダス（2020・2024延長）・SBOTOP・レッドブルとも、クラブの発表に**額が無い**。推測で埋めていない。
#     Companies House（Leeds United Football Club Limited 06233875）の 2023〜2025年6月期の決算書は**画像のスキャンで、文字が取れなかった**（OCR の道具が手元に無い）→ **額は言わない**。
#   ・**賭けの会社**（SBOTOP は「スポーツベッティングのブランド」とクラブが書く）の中身には踏み込まない。名前と「最大の商業契約」というクラブの言葉だけ。
#   ・**32Red（2016〜2020年の胸）・BOXT・Wish・JD・パリマッチ・ケーチャットの年**：Wikipedia と club の個別発表で確かめたが、胸と袖が混ざるので**年表に入れない**（BOXT は2026-10-07 に9年目の更新を公式が発表）。
#   ・女子チーム・育成年代の話は入れない（決まり）。
#   ・Macron との契約争い（2015）は愛好家サイト単独 → 言わない。
#
# ---- 一次情報に届かなかったところ ----
#   ・紋章の変遷（1934・64・73・76・77・80・84・98・99）は **Wikipedia と historicalkits**（群の外＝未確認〜背景止まり）。クラブ公式の歴史ページは404で取れなかった。
#   ・白の始まり（1961-62）と「レアル・マドリードにならった」は Wikipedia が **mightyleeds.co.uk（愛好家サイト）** を出典に書く。Wikipedia 自身が「Revie の就任は1961年3月」と併記する矛盾あり → 「と伝えられています」で言う。
#   ・1973-74 の「1部で初の名前が見えるシャツ」は Wikipedia(Admiral Sportswear)。
#   ・アディダスの延長（2024-10-30）の**期間はクラブ発表に無い**。
#
# ---- 自分で数えた数（検算した）----
#   ・紋章の種類：1964〜1983年に始まったもの＝1964・1971・1973・1976・1977・1980 の6つ／期間 1983−1964+1 ＝20年／20 ÷ 6 ＝ 3.33 → 3.3年に1つ
#     1984〜2025年に始まったもの＝1984・1998・1999・2019 の4つ／期間 2025−1984+1 ＝42年／42 ÷ 4 ＝ 10.5年に1つ
#     10.5 ÷ 3.33 ＝ 3.15 → 「約3倍」。全体では 1964〜2019 の10種類。
#   ・白：1961-62 から 2026 まで 2026 − 1961 ＝ 65年。
#   ・アディダス（2020-07-21）→ SBOTOP（2020-08-10）：7月の残り10日＋8月10日 ＝ 20日。
#   ・2018-01-24（公開）→ 2019-07-09（新しい紋章が胸に）＝ 約17か月半 → 「1年半後」。
#
# 写真：assets/images/20261016_kit_leeds/ の4枚。Wikimedia Commons（CC0 / CC BY / CC BY-SA）。出典は同じフォルダの credits.json。
#   c01=1965年のオランダ代表との試合（CC0 Anefo）／c02=1966年のオランダ DWS との試合（CC0 Anefo）／
#   c03=2019年10月5日 ミルウォール対リーズ（スコアボードに MIL・LUFC。左がリーズの円陣・白）／
#   （c04=2018年10月の夜の写真は 1440px で縦に引き伸ばしすぎるため外した）／c05=2023年8月 エランド・ロード外観（ヒセンスの看板）。
#   **クラブのエンブレム画像は assets/crests/リーズ.png（権利は晴れていない＝引き受ける危険。cutaway と同じ扱い）**。
#   愛好家サイトの過去のキットの画像は使っていない。
#
# ネットの反応は入れない（voice_min: 0）。シリーズの回にショートは作らない決まり。
# **サムネは案を3つ出してユーザーに決めてもらう**（2026-10-11）。ここの thumbnail は点検用の1案。
