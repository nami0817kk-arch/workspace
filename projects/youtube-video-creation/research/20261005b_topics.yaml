title: 10月5日の題材（残り2枠）
lead: 日本人1本・ほか1本。朝に集め直した12件から選んでください
note: '<b>○を2つ付けてください</b>（日本人の枠から1つ、その他の枠から1つ）。すでに決まっているのは、堂安・鈴木彩艶・シリーズ6本の計8本です。見出しと記事の冒頭まで見ています。○が付いたものから本文と出典を確かめて台本にします。<br>キリンカップ決勝（31）は今夜19:30キックオフなので、作るのは試合のあと（公開は22時以降）になります。'
items:
- num: 31
  slot: 日本人
  fmt: news
  head: キリンカップ決勝 日本対ニュージーランドの結果（今夜19:30、国立）
  why: 9月からの4連戦の締め。試合のあとに作る。堂安・鈴木彩艶・NZ紹介の3本の続きになる
  src: JFA・ゲキサカ（試合後）
- num: 32
  slot: 日本人
  fmt: quote
  head: 伊東純也、3試合すべて途中出場で、ポジションは毎回違う。「どのポジションでも自分の強みを出せる」
  why: NZ戦は「対南米とは違う試合に。先取点が大事」とも。役割の変化を数字（出場時間・位置）で見せられる
  src: ゲキサカ・サッカーキング（10/4）
  url: https://web.gekisaka.jp/news/japan/detail/?460313-460313-fl
