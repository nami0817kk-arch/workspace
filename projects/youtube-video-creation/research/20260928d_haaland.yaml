  - id: why
    heading: 押していたのに
    tier: 報道
    telop: 支配率62%、シュート22本。それでも1点
    narrator: キャスター
    card:
      type: table
      title: ノルウェー 1-2 ポルトガル
      columns: ['', ノルウェー, ポルトガル]
      rows:
        - [ボール支配率, 62%, 38%]
        - [シュート, 22本, 12本]
        - [枠内シュート, 6本, 4本]
    say:
      - では、なぜ負けたのか。支配率は62%、シュートは22本。ポルトガルの12本のほぼ倍です。
      - text: ハーランドひとりで8本を打ち、枠に飛んだのは4本。決まったのは1本です。
        card:
          type: table
          title: この試合のハーランド
          columns: ['', '']
          rows:
            - [シュート, 8本]
            - [枠内, 4本]
            - [得点, 1点]
      - 前半の決定機は、ポルトガルのGKディオゴ・コスタと、シティの同僚ルベン・ディアスに止められました。
      - そして同点直後、ノルウェーのGKニーランのパスがゴンサロ・ラモスに渡り、ループで決められます。
      - その直後にもニーランのミスからラモスが決めましたが、これはオフサイドで取り消されています。
      - 押しながら決めきれず、GKのミスで決まった試合でした。
    sources:
      - https://www.espn.com/soccer/match/_/gameId/401861073
      - https://www.vg.no/sport/i/6qLWlQ/landslaget-norge-portugal
      - https://www.goal.com/en/lists/norway-portugal-erling-haaland-goncalo-ramos-orjan-nyland-nations-league/blt4bcba2b30816c7e6
  - id: next
    heading: 1週間後に再戦
    tier: 報道
    telop: 次は敵地でウェールズ、そしてポルトガルと再戦
    narrator: キャスター
    say:
      - 順位は、2連勝のポルトガルが勝ち点6で首位。ノルウェーは勝ち点3で2位です。
      - 次は木曜にウェールズ、日曜にはポルトでポルトガルとの再戦。どちらもアウェーです。
      - 問われるのは、ハーランドたちが敵地で、押している時間に決めきれるかどうか。
      - text: 監督のソルバッケンは、この負けでも自信を崩していません。
        image: assets/images/20260928d_pair_solbakken/01.jpg
      - voice: ストーレ・ソルバッケン
        text: 私たちは、どこでも、いつでも、
      - voice: ストーレ・ソルバッケン
        text: どんな相手にも勝てるチームになった
        cont: true
