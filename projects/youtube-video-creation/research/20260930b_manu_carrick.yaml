# 取材メモ（9/30 昼の題材 manu_carrick）。起点は Daily Mail の2本（THE AUDIT 9/29、マズラウィ負傷 9/29）。
# 事実の裏:
#   リーグ5試合の結果: ESPN の日程API（teams/360/schedule, season=2026）と FotMob の試合記録で一致。
#     8/22 ハル(A) 0-2／8/30 イプスウィッチ(H) 5-2／9/6 エヴァートン(A) 2-2／9/13 マンC(H) 0-1／9/20 フルアム(A) 1-1 → 1勝2分2敗、勝ち点5、得失点 8-8。
#   「最悪の出だし」の中身: マンU自身のプレミア時代（1992-93〜）で5試合の勝ち点として**2014-15と並ぶ最少**（Sky「joint-fewest…also 5 in 2014-15」、
#     ESPN「worst start since 2014」。9/21 の取材 research/raw/20260921_manu.md）。Daily Mail は「worst return」と書くが「並ぶ」を採る。
#     **今季の20クラブの中では12位で、最悪ではない**（FotMob の順位表。最下位はトッテナム・フルアムの勝ち点2）。だから「プレミア最悪」とは言わない。
#   ハル・イプスウィッチは昇格組（Daily Mail 16170163）。エヴァートン戦: ムベウモ46分・ジョージ83分・シェシュコ88分・メイトランド＝ナイルズ90分（FotMob）。
#   xG（FotMob の試合ごとの値、作った/与えた）: ハル 1.83/1.01、イプスウィッチ 4.77/2.06、エヴァートン 0.69/1.01、マンC 1.00/1.10、フルアム 1.60/1.62。
#     合計 9.89/6.80。イプスウィッチ戦を除く4試合は 5.12/4.74 で、実際は3得点6失点。
#   キャリックの経緯: 2026-01-13 にアモリムの後任として復帰（昨季終了まで）、3位でCL出場権、5/22 に2028年までの契約（Wikipedia の Michael Carrick。Daily Mail とも一致）。
#   リーグカップ: 9/16 ブライトンに2-3で3回戦敗退（9/17 の回で扱った。ここでは1行だけ）。
#   マズラウィ: 9/29 モロッコ 2-0 レソト（アフリカ・ネーションズカップ予選）の68分、タックルで着地を誤り腰を押さえて交代、ハキミと交代（Daily Mail 16170163）。
#     ショーが3試合で離脱したあと、ドルグとマズラウィが左サイドバックに入った（Daily Mail 16166139）。
#   ブルーノ: ウェールズ戦で途中交代、ノルウェー戦の前に代表を離脱。ジェズス監督「complicated」、すねの問題（Daily Mail 16170163）。
#   ラッシュフォード・メイヌー: フルアム戦の軽傷でイングランド代表を辞退。シェシュコ・アマド・ドルグも離脱中（同）。
#   シェシュコ: すねの痛みで準備期間を全休、2試合先発して再発。本職のセンターフォワード不在でクーニャが偽の9番（Daily Mail 16166139）。
#   次の日程: 10/10 トッテナム(H)、その後アトレティコ(A・CL)、リーズ(A)、コモ(A)（Daily Mail 16166139・16170163、ESPN 9/21 も 10/10 トッテナム）。
#   「重圧」は論評: 見出しで言っているのは英国の報道（Daily Mail の THE AUDIT「under pressure」）。ファンのブーイングはブライトン戦のあとと、
#     フルアム戦でメイヌーを下げたとき（Daily Mail 16166139）。ネビルの批判は 9/21 の回で扱ったので1行だけ・発言は引かない。解任は予想しない。
#   9/30 流れの点検で直した: 「重圧」とブーイング（タブロイド1本・試合が曖昧）は外した。センターフォワードは DM 16166139「without a conventional striker」「Cunha…false nine」に合わせて言い方を弱めた。
#     失点の側: ハル（期待値1.01で2失点）・エヴァートン（1.01で2失点）。フルアムの1失点はオウンゴール。けが人の節は見立ての終わりに2行で畳んだ。
#   キャリックの「ばかげている」（進退の憶測に）は日付が取れなかったので使わない。
# 本人の言葉: Daily Mail 16166139 の2つ。9/6 エヴァートン戦のあと "It's not that bad… we'll be fine" と、
#   その10日後（9/16 ブライトン戦のあと）"It feels bad at the moment… pretty quickly"。同じ日の "We can't accept that as a group" は
#   9/17 の回の「受け入れられるものではなかった」と重なるので使わない。
# 以前のマンUの回（9/11 サバ戦・9/17 ブライトン戦・9/21 ネビル・9/24 決算）と同じ文は言わない。
