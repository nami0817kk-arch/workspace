# 佐野航大のミドル弾と、「ボールのおかげ」という指摘（2026-09-13 の試合）
#
# **褒めて終わらない回。**移籍後初ゴールは事実。そのうえで、元オランダ代表が
# 「新しい公式球のせいでもある」と言っている。**両方そのまま並べる。**
#
# 引きは**「あのゴールは、ボールのおかげなのか」**。ここが山場（@main）。
#
# **ユーザーが以前に名前を挙げた選手**（2026-09-15「佐野航大あたりはアジアカップに
# 絡んで来そう」）。9/17 に出す森保の回でも、反応に「佐野航大が見たかった」がある
