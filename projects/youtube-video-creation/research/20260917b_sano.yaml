    say:
      - エールディヴィジ第6節、PSV対スパルタ・ロッテルダムです。
      - 39分、ペナルティエリアの手前でパスを受けた佐野航大が、右足を振り抜きました。
      - 強烈なシュートはゴール右下の隅に突き刺さり、**逆転ゴール**になりました。
      - PSVはこの試合を**4対1**で勝ち、リーグ戦5連勝です。
      - 佐野はこれで**5試合続けて先発フル出場**。移籍後はじめての得点でした。
