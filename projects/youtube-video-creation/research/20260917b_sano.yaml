    main: true
    tier: 報道
    telop: 「新しいボールは、とても気持ちよく打てる」
    narrator: 解説
    say:
      - {short_only: true, text: PSVの佐野航大が、移籍後初ゴールを決めました。}
      - このゴールについて、元オランダ代表の選手が別の見方を示しました。
      - まず、止められなかったゴールキーパーに触れています。
      - {voice: 元オランダ代表, text: もちろん、彼はあのボールを止めなければならなかった}
      - {voice: 元オランダ代表, text: それは本人も分かっているだろう}
      - そのうえで、こう続けました。
      - {voice: 元オランダ代表, text: しかし、新しいエールディヴィジのボールは、とても気持ちよくシュートを打てるボールなんだ}
      - 理由も説明しています。
      - {voice: 元オランダ代表, text: ボールが比較的軽いので、足から速く離れると選手たちは言っています}
      - {voice: 元オランダ代表, text: あまり力を加えなくても速いボールを蹴ることができる}
      - {voice: 元オランダ代表, text: さらに、本当にブレるボールでもあります}
      - オランダの『VoetbalPrimeur』が13日に伝えました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/14/post1010928/

