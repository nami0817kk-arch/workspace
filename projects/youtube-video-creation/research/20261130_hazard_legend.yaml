# エデン・アザール（元ベルギー代表FW、チェルシー7シーズン）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-30 用。9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt 不使用**。数字は英語版 Wikipedia（Eden Hazard の成績表・本文・Honours、2019 UEFA Europa League final、2018 FIFA World Cup knockout stage）と自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（家族・兄弟の話・体重の話・監督との関係・「ハンバーガー」の件・ボールボーイの件・クラブ経営の件は台本に出さない）。レアル時代は「ケガ」と事実だけにし、選手を小さく見せる言い方をしない。
# **重なりの確認（2026-11-21）**：scripts/・covered.yaml・posted.json・research/20261109〜20261127_picks.txt を「アザール／Hazard」で grep。主役の回は 20261012_transfer_single（レアル移籍の発表文と移籍金の回。49日前）だけで、選手紹介・レジェンドの回は無し。この回は移籍金に触れず、チェルシーの7年と2018年W杯の日本戦で組む。同じ日（11/30）の別シリーズはローマ・ポステコグルー監督など（20261127_picks.txt）で重ならない。自分の担当の 11/28 はベイル（重ならない）。
# **引退の確認**：Wikipedia「On 10 October 2023, Hazard announced his decision to retire from professional football at age 32」→ 現役ではない（35歳）。代表は 2022-12-07 に引退。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：リール 194試合50ゴール、チェルシー 352試合110ゴール、レアル・マドリード 76試合7ゴール。ベルギー代表 126試合33ゴール。サムネの表：リール194/50＋チェルシー352/110＋ベルギー代表126/33＝672試合193点（自分で足した値。レアルは除く）。
# - チェルシーのシーズン別ゴール（全大会）：12-13 13、13-14 17、14-15 19、15-16 6、16-17 17、17-18 17、18-19 21（合計110と一致）。最初の6季＝89点（÷6＝14.8）、最後の2018-19＝21点（7季で最多）。21÷14.8＝1.42→約1.4倍。2018-19のプレミアのアシスト15（本文「His tally of 15 assists ... Playmaker of the Season」）。2018-12-26 ワトフォード戦でチェルシー100点目（本文）。
# - 2019-05-29 EL決勝（バクー、オリンピック・スタジアム、観客51,370）チェルシー4-1アーセナル。ジルー49分、ペドロ60分（アザールのパス）、アザール65分PK・72分（ジルーのパス）、イウォビ69分。アザールは最優秀選手、89分に交代。試合後にチェルシーを離れたい意向を話した（本文）→チェルシーでの最後の試合。
# - 2018-07-02 W杯 決勝トーナメント1回戦（ロストフ・アリーナ、観客41,466）ベルギー3-2日本。原口48分、乾52分、フェルトンゲン69分、フェライニ74分（アザールのクロスから頭）、シャドリ90+4分。アザールはこの試合の最優秀選手（本文「For his second consecutive game, Hazard was once again voted man of the match」）。2点差を90分以内に逆転したのは1966年以来（knockout stage の本文）。ベルギーは3位、アザールは大会2番目の選手（シルバーボール）。
# - ドリブル：プレミアの7年で試み1,441・成功909は、リーグで最多（本文）。909÷1,441＝63%。2018年W杯ブラジル戦でドリブル10回すべて成功（1966年以降のW杯の1試合の記録）。
# - タイトル：リーグ・アン・フランス杯 2010-11（リール）、プレミア 2014-15・2016-17、FAカップ 2017-18（決勝のPKが決勝点）、リーグ杯 2014-15、EL 2012-13・2018-19、ラ・リーガ 2019-20・2021-22、CL 2021-22（ベンチ）。個人：2014-15 PFA年間最優秀選手・FWA年間最優秀選手・プレミア年間最優秀選手。チェルシーの年間最優秀選手 4回。リーグ・アン年間最優秀選手 2010-11・2011-12。
# - マル秘話：2014年10月までPKを16本蹴って16本成功（本文、欧州で15本以上蹴って全部決めたのはただ1人）。2018年W杯ブラジル戦のドリブル10回すべて成功。2018-19にチェルシーのクラブ表彰をすべて受けた、クラブ史上ただ1人（本文）。
# **本人の言葉**：取れていない（加入時の言葉はクラブ公式の引用だが、元の記事を開いて確かめていないので置かない）。声の行は置かない。
# - 2012-12-16 クラブW杯決勝（横浜）コリンチャンス戦：Commons「File:Eden Hazard.jpg」（Eden Hazard in 2012、撮影日 2012-12-16、相手はコリンチャンスの白い服）と「Chelsea FC 2012 Club World Cup Final starting XI」に本人がいるので「決勝に立った」とだけ言う（得点・時間は言わない）。
# **入れなかったもの**：私生活・家族・兄弟、体重の話、監督との関係、2011年の「ハンバーガー」の件、2013年のボールボーイの件、移籍金の額（10/12の回で扱った）、レアルでの出場の少なさの細部。
# **読みで怪しいもの**：エデン・アザール、ラ・ルヴィエール、リール、リーグ・アン、チェルシー、ロストフ、原口元気、乾貴士、柴崎岳、フェルトンゲン、フェライニ、シャドリ、クルトワ、バクー、ジルー、ペドロ、イウォビ、ツェフ（チェフ）、ワトフォード、ラ・リーガ。
