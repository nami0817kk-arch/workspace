# 小笠原満男（元日本代表 MF）の紹介。シリーズ「レジェンドの紹介（日本）」2026-11-19。型は 11/17 の福田正博と同じ8節の変形（「あの試合」＝2001年の元日の天皇杯決勝とチャンピオンシップ、「見立て」＝点の時期と優勝の時期）。
# **情報の時点は 2026-11-12。**年齢は出さない。いまの仕事は言わない（鹿島のアカデミー関係は入れない）。私生活・法的な問題・女子サッカーは入れない。
# **題材を選んだ理由**：引退した日本人の大物。鹿島のJ1優勝7回・ACL優勝（2018）・メッシーナ・2002年W杯。既出の国内レジェンド（奥寺・中澤・槙野・高原・城・北澤・福田ほか）に無い（posted.json・covered.yaml・scripts/・picks で確認）。
# **引退の確認**：日本語版「2018年12月27日、2018シーズン限りでの現役引退を発表」。
# **数字の出どころ（すべて日本語版 Wikipedia「小笠原満男」の表を WebFetch の抽出で読んだもの。原ページと一字ずつは突き合わせていない）**
# - J1（鹿島）年別 試合-得点：1998 5-0、99 15-4、00 28-3、01 24-7、02 27-4、03 27-7、04 28-7、05 30-11、06 20-3、07 14-4、08 24-5、09 32-3、10 33-3、11 31-1、12 31-2、13 33-2、14 33-2、15 29-1、16 30-0、17 17-0、18 14-0。足すと 525-69（表の通算と一致。自分で足し直した）。
#   前半 1998〜2005＝184試合43点、後半 2006〜2018＝341試合26点（自分で束ねた。184+341=525、43+26=69）。メッシーナ（セリエA）6試合1得点。
# - 日本代表 55試合7得点（2002〜2010年）。年別：2002 8-0、03 8-0、04 12-2、05 15-4、06 10-1、10 2-0（足すと 55-7）。2002年W杯チュニジア戦は6分間の出場。2004年アジアカップ優勝（タイトル欄）。
# - タイトル：J1 1998・2000・2001・2007・2008・2009・2016 の7回、天皇杯 2000 ほか、ACL 2018。2000年はJ1・ナビスコ・天皇杯が同じ年（自分で表から読んだ）。MVP 2009。チャンピオンシップMVP 2000・2001。
# - 2001-01-01 天皇杯決勝 対清水 3-2：先制FK、延長前半のVゴールとなるボレー。AFC月間最優秀ゴール賞。2001年チャンピオンシップ対磐田：延長の直接FKでVゴール、リーグ連覇。
# - 2005年にレッチェから誘い（鹿島が優勝争い中で断った）。2006年8月メッシーナへ期限付き、10/21 エンポリ戦で初ゴール。2007年7月復帰、7/15 ナビスコ杯広島戦（323日ぶりの公式戦）。
# - 2008年9月20日柏戦で左ひざ半月板と前十字靱帯、全治10か月。2009年 J1 32試合・MVP。2011年3月に岩手で5日間の支援、5/31「東北人魂を持つJ選手の会」。2016年はプロ入り後初のリーグ戦無得点。2018年ACL優勝、昌子源からトロフィーを譲られた。
# **本人の言葉は取れていない**（Wikipedia の抽出に出典つきの引用が無い。台本は本人の言葉なしで組んだ）。
# **写真**：Commons「Kashima Antlers lifted 2018 ACL trophy.jpg」（CC BY 4.0, Mehdi Bolourian, 2018, 1050x634）。トロフィーを掲げる中央の背番号40を本人とみなして切った（被写体は番号とカテゴリ「Mitsuo Ogasawara」から。顔の識別はしていない）。01_w（全体）・02_w（寄り）・01_v（縦）。ほかに Commons の本人写真は 152x297 の1枚しか無く使えない。
