- id: view
  heading: 奪う役から作る役へ。5季の変わり方を数える
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: 10月14日、アーセナル対リール
  card:
    type: table
    title: プレミアリーグでの5季（リーグ戦のみ）
    columns: [シーズン, インターセプト, 決定機の演出]
    rows: &pace_rows
    - ['21/22', '63', '2']
    - ['22/23', '63', '3']
    - ['23/24', '44', '9']
    - ['24/25', '25', '16']
    - ['25/26', '37', '17']
    source: プレミアリーグ公式（こちらで並べた）
  say:
  - text: 最後に、リーグ戦だけの数字を5季ぶん並べてみます。
    image: assets/images/20261011_player_357662/eng2026c/01_w.jpg
    card: &pace_card
      type: table
      title: プレミアリーグでの5季（リーグ戦のみ）
      columns: [シーズン, インターセプト, 決定機の演出]
      rows: *pace_rows
      source: プレミアリーグ公式（こちらで並べた）
      highlight_row: 0
  - text: ライスが相手のパスを断ち切った回数は、63から37へ。
    card:
      <<: *pace_card
      highlight_row: 4
  - text: 代わりに、味方の決定機を作った数が2から17へ。
    emph: true
    card:
      <<: *pace_card
      highlight_row: 4
  - text: 5年で8.5倍です。奪う役から、作る役へ寄ってきました。
    card: &calc_card
      type: calc
      title: 決定機の演出、5年の伸び
      terms:
      - ['17', 25/26のリーグ戦]
      - ['2', 21/22のリーグ戦]
      - ['8.5倍', 5年での伸び]
      ops: ['÷', '＝']
  - text: 今季もその向きのまま。リーグの6試合はすべて先発です。
    card: *calc_card
    mark: {kind: circle, item: 2}
  - text: 点を取る役は、この先も彼の主な仕事ではないはずです。
    image: assets/images/20261011_player_357662/eng2026c/01_w.jpg
    card: none
  - text: それでも、前へ通す1本では代わりが見当たりません。
  - text: 次の試合は10月14日。チャンピオンズリーグでリールと戦います。
  - text: 列を何本破り、そこから何が生まれるか。そこを数えます。
  sources:
  - https://www.premierleague.com/players/15202/declan-rice/stats
