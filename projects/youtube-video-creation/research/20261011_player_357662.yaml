  - text: 決まりやすさを足したゴール期待値は0.12。遠くから狙った数です。
    image: assets/stats/player_20261011_654096_shots.png
    no_telop: true
  - text: 相手のエリアの中で触った回数も、今季のリーグで4回。
    image: assets/images/20261011_player_357662/eng2026c/01_w.jpg
