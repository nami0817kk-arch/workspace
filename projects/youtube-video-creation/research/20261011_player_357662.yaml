# デクラン・ライス（アーセナル）の紹介。8節の型（2026-09-28）を、ペドリ（research/20261009_player_683840.yaml）の形にそろえた。
# 雛形は tools/player_intro.py 357662。材料は research/raw/20261011_rice_material.md（604行）。
# 数字は FotMob（654096）・プレミアリーグ公式（選手id 15202）・英語版Wikipedia・Transfermarkt（市場価値の推移）。
#
# **鍵の付け方**：指示は「20261011_player_<FotMobの番号>」だったが、「既存の回の鍵の付け方に合わせる」ほうを採って
#   **Transfermarkt の番号（357662）** にした。ペドリ 683840・ネヴェス 670681・ヴィニシウス 371998 はどれも
#   Transfermarkt の番号で、`tools/player_intro.py <TM番号>` がこの名前でファイルを書く。
#   FotMob の番号（654096）は板のファイル名に入っている。
#
# **この回で避けたもの（ユーザー指示）**
# - **アーセナルというクラブの話をしない。**10/8 に財政（アルテタ）、10/10 に本拠地を出しているので、
#   クラブの歴史・財政・本拠地・オーナー・観客数・「22年ぶりの優勝のクラブ側の意味」は1行も入れていない。
#   クラブ名が出るのは「どこに所属しているか」「移籍の相手」「次の試合の主語」だけ。
#   カンファレンスリーグ優勝も**本人が主将として掲げた話**にして、クラブ側の年数（1965年以来）は言っていない。
# - **9/13 の `rice_workload` と同じ発言を使わない。**あの回はサッカーキングが伝えたガーディアンの記事から
#   「100パーセントの状態ではない」「ハムストリングの神経系」「毎シーズン60試合近く」「調子が良くて」の4つを引いている。
#   **この回ではその記事を出典にも使っていない。**出場数の話も、あの回の「昨季55試合・4,456分」ではなく
#   季ごとの表の中の1行（25/26 の55試合）にとどめた。
#
# **過去5シーズンの表は、雛形（Transfermarkt）から FotMob のクラブだけの数字に差し替えた。**
#   雛形は「代表を含む全公式戦」として 57/63/62/65/64 を出すが、FotMob のクラブ数（50/50/51/52/55）との差が
#   21/22 だけ7試合で、同じ期間の代表の試合数（13前後）と合わない。**出どころをまたいだ足し算の裏が取れなかった**ので、
#   **1つの出どころ（FotMob のクラブ公式戦）で通した**。出場時間の列は、全公式戦ぶんが無料では取れない
#   （FotMob の試合一覧APIは400、FBref は403、Transfermarkt は WebFetch 拒否）ので外し、採点の列に替えた。
#
# **今季（26/27）の数字はクラブだけ。**FotMob はワールドカップ2026（6〜7月）を 26/27 の季に入れているが、
#   日本で「今季」と言えば8月からのことなので、W杯は**マル秘話の節で別に**扱って混ぜていない。
#
# **数字の食い違い（材料 §8。読み上げは片方だけにして、表に添え書きで断る）**
# - 市場価値：Transfermarkt 1.2億ユーロ ／ FotMob 1億120万ユーロ。読み上げは1.2億、表に添え書き。
# - 身長：英語版Wikipedia・Wikidata 188cm ／ FotMob 185cm。**188センチ**にした（2つが一致するほう）。
# - ポジション：Transfermarkt は「セントラルMF」、FotMob の主位置は「守備的MF」（直近の内訳 DM43／CM16／RB1）。
#   表は**守備的MF**にして、語りで「中盤の底」と言う。
# - キャリア通算：英語版Wikipedia の "Career total" 413試合は**ウェストハムU23の3試合を含む**。
#   トップチームだけなら **411試合36得点**（ウェストハム245/15＋アーセナル166/21、10月10日時点）。こちらを使う。
# - レアル・マドリード戦の1点目：**ゲキサカだけ47分**と書いている。11v11・Sky Sports・CNN はすべて**58分**。58分を使う。
# - 移籍金：固定1億ポンド＋出来高500万ポンドで各社一致。**円換算は媒体で違う**（190億円／182億＋9億）ので円は言わない。
# - 代表：イングランド80試合8得点は**2026年7月18日時点**（Wikipedia）。アイルランド3試合0得点（2018年、すべて親善試合）。
#   通算の表の題を「2026年10月」にして、語りでは日付を言わずに表で見せる。
#
# **入れなかった材料**
# - 年俸・新契約の週給（交渉中の数字。材料 §8）。
# - 2015年のSNSの書き込みと謝罪（政治に触れる。材料 §4-8）。
# - 背番号41の由来（用具係にもらった話。**背番号は埋め草**という 2026-09-10 の決まりに当たるので外した）。
# - スーネス／スコールズの批評（**発言の年が特定できない**・二次媒体のまとめ。材料 §2-5）。
# - エンケティアと「同じ日に放出」説（材料が誤りだと指摘している。材料 §3-1）。
# - 交際相手への中傷に応えた一言（私人の話なので入れない）。
#
# **パーセンタイルを数として読まない**（10/01 の指摘）。棒グラフとレーダーは**同じ6軸**にそろえ
#   （チャンス創出92・ボールタッチ87・空中戦71・シュート数54）、板と読み上げが食い違わないようにした。
#   雛形が出した「得点 0」は**今季の得点が0だからパーセンタイルも0**になっているだけなので棒から外した。
#   本数を言う行には必ず期間（「今季のリーグで」）を付けている。
#
# **板の出典の焼き込みを消した。**`tools/fotmob_player.py` の市場価値の板だけ「Transfermarkt」が右下に残っていた
#   （2026-10-08 にレーダー・シュートマップ・ヒートマップからは消したが、この板が漏れていた）。同じ決まりで消した。
#
# **写真は時期ごとに4つ**（材料 §6 の推しの順）。2017年のウェストハム（18歳、41番が写る）→
#   2023年6月のプラハ（カンファレンスリーグ決勝の夜）→ 2023年10月のアーセナル（顔のアップ、CC0）→
#   2026年のイングランド代表（ガーナ戦・パナマ戦）。**同じ選手を横に並べていない。スタジアムの写真は出していない。**
#   Commons の「2024 Emirates Cup - Declan Rice.jpg」は**画面のほとんどがスタンドで顔が分からない**ので外した。
#   2022年W杯の1枚は 230x384 で小さすぎる。**アーセナル在籍中の試合写真は Commons にほとんど無い**ので、
#   アーセナル期は 902x914 の1枚（表のある節は縦のまま、表の無い節は 16:9 に切った `01_w.jpg`）で通している。
#
# **本人の言葉は3つ**（どれも W杯の負荷の話ではない）
#   ①14歳でチェルシーを離れたこと（footballista の訳をそのまま）
#   ②代表を変えた決断（2019年3月1日、London Football Awards。自訳）
#   ③レアル・マドリード戦のあと（ゲキサカの訳をそのまま）
