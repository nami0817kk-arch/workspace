- id: story
  heading: 緑のユニフォームと、134秒のゴール
  tier: 報道
  main: true
  telop: 2018年の3試合と、2026年7月18日
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['2018年', アイルランドの代表として3試合]
    - ['2026年7月18日', ワールドカップで主将、134秒で得点]
    source: 英語版Wikipedia
  say:
  - text: アーセナルのデクラン・ライス。数字の外に、2つの話があります。
    short_only: true
    image: assets/images/20261011_player_357662/eng2026b/01.jpg
    card: none
  - text: いまはイングランドの代表。でも、別の色を着ていました。
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 英語版Wikipedia
      highlight_row: 0
  - text: 2018年、アイルランドの代表として3試合。初めての代表でした。
    card: *story_card
  - text: 代表を変えると決めたとき、本人はこう言いました。
    card: *story_card
  - voice: ライス
    text: キャリアでこれまでに下した中で
  - voice: ライス
    text: いちばん難しい決断だった
    cont: true
    pause: 0.6
  - text: 資格の元は、父方の祖父母。アイルランドのコーク州の出身です。
    card: none
  - text: 2019年2月13日に表明、3月5日に国際サッカー連盟が認めます。
  - text: 3月22日、チェコ戦の63分から代表デビューを果たしました。
  - text: この2つの代表を行き来したのは、1890年代以来のことです。
    emph: true
    card: *story_card
  - text: もう1つは、2026年7月18日、マイアミでの話です。
    image: assets/images/20261011_player_357662/eng2026d/01.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: ワールドカップの3位決定戦、相手はフランスでした。
    card:
      <<: *story_card
      highlight_row: 1
  - text: この試合で、ライスはワールドカップで初めて主将を務めます。
    card:
      <<: *story_card
      highlight_row: 1
  - text: そしてキックオフから134秒。いきなり先制点を決めました。
    emph: true
    card:
      <<: *story_card
      highlight_row: 1
  - text: イングランド代表のワールドカップの得点では、1982年に次ぐ速さ。
    card:
      <<: *story_card
      highlight_row: 1
  - text: アシストも記録して、試合は6対4の勝ちでした。
    card:
      <<: *story_card
      highlight_row: 1
