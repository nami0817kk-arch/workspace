# プレミアリーグ20クラブ紹介 ③アストン・ヴィラ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**鈴木彩艶が今夏パルマから加入している。
# ここは視聴者がいちばん知りたいところなので、節のうしろではなく前に出す。
#
# **収容人数は2つの数字がある。**クラブの記事は43,205人、今季の一覧は36,887人
# （改修のため減っているとみられる）。**クラブの記事の数字を使い、断定しない。**
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では3番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「数えると21個」と「プレミアでは一度も獲っていない」をやめ、獲ったものだけにした。
#
# **見てもらえる形にした**（2026-09-18 ユーザー指示「もっと見てる人の興味や
# 関心を引き立てる内容にしてください」）。
#   ・題とサムネをクラブごとの引きに変えた（20本とも同じ題で並んでいたため）
#   ・**宿敵**（セカンド・シティ・ダービー。1982年の0対3）と
#     **レジェンド3人**（エイトケン／ウォーカー／ウィズ）の節を足した
#
# **歴史の節を短くした**（2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」）。
#   ・「歩んできた道」を9行→6行。1930-31年の1シーズン128得点と、
#     「1部優勝7回・直近1981年」（獲ってきたものの節と重なる）を落とし、
#     1888年のリーグ創設と1982年の欧州制覇の2つに絞った（カードも同様）
