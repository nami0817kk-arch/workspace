    say:
      - "**ラグビーは少し荒っぽすぎる。**だからアソシエーション・フットボールをやろう。"
      - そう決めた4人が作ったクラブです。決めたことが、そのまま記録に残っています。
      - ジャック・ヒューズ、フレデリック・マシューズ、ウォルター・プライス、ウィリアム・スキャッターグッド。
      - 創設は1874年11月21日。バーミンガムのハンズワースにある、礼拝堂の仲間でした。
      - 名前は、その礼拝堂から取られました。ウェスレアン・チャペルの名を冠した集まりです。
      - 愛称は「ヴィランズ」、そして「ライオンズ」です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
