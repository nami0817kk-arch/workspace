# プレミアリーグ20クラブ紹介 ③アストン・ヴィラ（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# **日本人選手がいるクラブ。**鈴木彩艶が今夏パルマから加入している。
# ここは視聴者がいちばん知りたいところなので、節のうしろではなく前に出す。
#
# **収容人数は2つの数字がある。**クラブの記事は43,205人、今季の一覧は36,887人
# （改修のため減っているとみられる）。**クラブの記事の数字を使い、断定しない。**
