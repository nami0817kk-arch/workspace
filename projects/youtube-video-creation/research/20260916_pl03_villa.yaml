    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースがまだいない。5人が1点ずつで並んでいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ウナイ・エメリ"]
        - ["主将", "ジョン・マッギン（MF・スコットランド）"]
        - ["エース", "今季は5人が1点ずつで並ぶ"]
        - ["昨季の得点王", "ワトキンス21点。今夏に退団"]
        - ["日本人選手", "鈴木彩艶（GK・背番号1）"]
    say:
      - 今季のヴィラには、エースと呼べる選手がまだ決まっていません。
      - "**5人が1点ずつで並んでいる**からです。"
      - 昨季21点を挙げたオリー・ワトキンスは、今夏クラブを離れました。
      - 監督はウナイ・エメリです。
      - 主将はジョン・マッギン。スコットランド代表の中盤です。
      - そのなかで、いちばん名前が挙がっているのが日本人です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
