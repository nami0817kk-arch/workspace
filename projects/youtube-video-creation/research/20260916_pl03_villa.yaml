sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1874年創設。ラグビーは荒すぎる、と始まった
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1874年11月21日"]
        - ["愛称", "The Villans／The Lions"]
        - ["本拠地", "ヴィラ・パーク"]
        - ["収容人数", "43,205人"]
    say:
      - アルファベット順では、3番目に来るクラブです。
      - 創設は1874年11月21日。バーミンガムのハンズワースにある、礼拝堂の仲間が作りました。
      - 名前は、その礼拝堂から取られました。ウェスレアン・チャペルの名を冠した集まりです。
      - 作ったのは4人。ジャック・ヒューズ、フレデリック・マシューズ、ウォルター・プライス、ウィリアム・スキャッターグッド。
      - この4人が決めたことが、記録に残っています。
      - "**ラグビーは少し荒っぽすぎる。**だからアソシエーション・フットボールをやろう、と。"
      - 愛称は「ヴィランズ」、そして「ライオンズ」です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.

  - id: japan
    heading: 今季の顔ぶれ
    main: true
    tier: 報道
    telop: 日本人選手がいます。鈴木彩艶
    narrator: 解説
    card:
      type: table
      title: 今季の陣容
      columns: ["", ""]
      rows:
        - ["監督", "ウナイ・エメリ"]
        - ["主将", "ジョン・マッギン"]
        - ["日本人選手", "鈴木彩艶（GK）"]
        - ["加入元", "パルマ／2,560万ポンド"]
    say:
      - このクラブには、日本人選手がいます。
      - ゴールキーパーの**鈴木彩艶**です。
      - 今夏、イタリアのパルマから**2560万ポンド**で加入しました。
      - 監督はウナイ・エメリ。主将はジョン・マッギンです。
      - 今夏の出入りは、けた違いでした。
      - 出ていったほうでは、モーガン・ロジャーズがチェルシーへ**1億1700万ポンド**。
      - オリー・ワトキンスはアル・ヒラルへ5000万ポンド、エミリアーノ・マルティネスもチェルシーへ移りました。
      - 入ってきたのは、フライブルクからヨハン・マンザンビが5200万ポンド、パリ・サンジェルマンからイブラヒム・ムバイエが4700万ポンド。
      - チェルシーからニコラ・ジャクソン、バイエルンからレオン・ゴレツカも加わっています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Aston_Villa_F.C._season

  - id: ground
    heading: 本拠地
    tier: 背景
    telop: ヴィラ・パーク。収容4万3205人
    narrator: キャスター
    say:
      - {image: "assets/images/pl_villa/scene.jpg",
         text: 本拠地はヴィラ・パーク。バーミンガムにあります。}
      - {image: "assets/images/pl_villa/scene.jpg",
         text: 収容人数は4万3205人とされています。}
      - {image: "assets/images/pl_villa/scene.jpg",
         text: 今季の一覧では3万6887人となっていて、数字が2つあります。}
      - {image: "assets/images/pl_villa/scene.jpg",
         text: 改修の影響とみられますが、断定できる材料がないので両方を出しておきます。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Premier_League

  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: リーグそのものを作ったクラブ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1888年", "ヴィラの重役がフットボールリーグを創設"]
        - ["1930-31年", "1シーズン128得点。いまも1部の記録"]
        - ["1982年", "ヨーロッパカップ優勝（バイエルンに1-0）"]
        - ["2025-26年", "ヨーロッパリーグ優勝。30年ぶりのタイトル"]
    say:
      - このクラブは、リーグそのものを作った側にいます。
      - 1888年、ヴィラの重役だったウィリアム・マクレガーが、**世界で初めてのフットボールリーグ**を立ち上げました。
      - ヴィラは、その創設メンバーの1つです。
      - 1部での優勝は7回。ただし、いちばん新しいのが1980年から81年です。
      - 1930年から31年のシーズンには、**1シーズンで128得点**を挙げました。1部の記録として、いまも残っています。
      - 1982年には、イングランドのクラブとして**4番目**にヨーロッパカップを勝ち取りました。
      - 決勝の相手はバイエルン・ミュンヘン。ロッテルダムで1対0でした。
      - そして昨季、2025年から26年。ヨーロッパリーグで優勝します。
      - フライブルクを3対0で下しての戴冠で、**30年ぶりのタイトル**でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
