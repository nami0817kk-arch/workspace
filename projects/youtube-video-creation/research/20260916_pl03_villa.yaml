  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: リーグそのものを作ったクラブ
    narrator: 解説
    card:
      type: table
      title: 残してきた記録
      columns: ["", ""]
      rows:
        - ["1888年", "ヴィラの重役がフットボールリーグを創設"]
        - ["1982年", "ヨーロッパカップ優勝（バイエルンに1-0）"]
        - ["2025-26年", "ヨーロッパリーグ優勝。30年ぶりのタイトル"]
    say:
      - このクラブは、リーグそのものを作った側にいます。
      - 1888年、ヴィラの重役だったウィリアム・マクレガーが、**世界で初めてのフットボールリーグ**を立ち上げました。
      - ヴィラは、その創設メンバーの1つです。
      - 1982年には、イングランドのクラブとして**4番目**にヨーロッパカップを勝ち取りました。決勝の相手はバイエルン・ミュンヘン。ロッテルダムで1対0でした。
      - そして昨季、2025年から26年。ヨーロッパリーグで優勝します。
      - フライブルクを3対0で下しての戴冠で、**30年ぶりのタイトル**でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: ヨーロッパを制した直後に、0対3で敗れた相手
    narrator: 解説
    card:
      type: table
      title: セカンド・シティ・ダービー
      columns: ["", ""]
      rows:
        - ["相手", "バーミンガム・シティ"]
        - ["1879年9月27日", "最初の対戦。相手が1-0"]
        - ["1982年", "欧州制覇の直後、敵地で0-3"]
        - ["通算", "126試合／ヴィラ57勝・31分・38敗"]
        - ["今季", "バーミンガムはプレミアリーグにいない"]
    say:
      - "宿敵はバーミンガム・シティ。呼び名は**セカンド・シティ・ダービー**です。"
      - 最初に当たったのは1879年9月27日の親善試合でした。
      - 当時スモール・ヒースと名乗っていた相手が、1対0で勝っています。
      - いちばん語り草になっているのは1982年です。
      - ヴィラがヨーロッパの頂点に立った、その直後のことでした。
      - "敵地セント・アンドリュースで、バーミンガムが**3対0**で勝ちます。"
      - 2002年には15年ぶりにリーグで再会し、こちらも相手が3対0と2対0で連勝しました。
      - 決め手になったのは、ヴィラのゴールキーパー、ペーター・エンケルマンのミスです。
      - 通算は126試合でヴィラの57勝、31分け、38敗。2018年から19年が終わった時点の数字です。
      - 最後に当たったのは2019年3月10日。ジャック・グリーリッシュの得点で、ヴィラが1対0で勝ちました。
      - そのバーミンガムは、今季のプレミアリーグにいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Second_City_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 1982年の決勝、たった1点を決めた選手
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ピーター・ウィズ", "182試合74得点／1982年決勝の得点者"]
        - ["チャーリー・エイトケン", "660試合。クラブ史上最多出場"]
        - ["ビリー・ウォーカー", "531試合244得点。クラブ史上最多得点"]
    say:
      - "1982年の決勝でバイエルンから**唯一の1点**を奪ったのが、ピーター・ウィズです。"
      - 在籍は1980年から85年。182試合で74得点でした。
      - その前の年、1980年から81年にはリーグ優勝も味わっています。
      - "出場の記録を持つのはチャーリー・エイトケン。1961年から76年で**660試合**です。"
      - ウェスト・ミッドランズのクラブ全体を見ても、いちばん多い出場数になります。
      - 得点の記録はビリー・ウォーカー。1919年から34年に531試合244得点。
      - 内訳はリーグで214点、FAカップで30点。出場数でも歴代2位です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Peter_Withe
      - https://en.wikipedia.org/wiki/Charlie_Aitken_(footballer,_born_1942)
      - https://en.wikipedia.org/wiki/List_of_Aston_Villa_F.C._records_and_statistics
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: ヨーロッパの頂点に、1982年に立っている
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "7回（直近 1981年）"]
        - ["FAカップ", "7回（直近 1957年）"]
        - ["リーグカップ", "5回（直近 1996年）"]
        - ["ヨーロッパ", "欧州カップ1回（1982）／EL1回（2026）"]
    say:
      - "ヨーロッパの頂点に、このクラブは**1982年**に立っています。"
      - "昨季、2026年には**ヨーロッパリーグ**も獲りました。"
      - 国内では1部優勝7回、FAカップ7回、リーグカップ5回。
      - 今季はチャンピオンズリーグに出ています。
      - その舞台に、いま鈴木彩艶が立っています。そこが今季の見どころです。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
