  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: ラグビーは少し荒っぽすぎる。そう決めた4人が作った
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1874年11月21日"]
        - ["愛称", "The Villans／The Lions"]
        - ["本拠地", "ヴィラ・パーク"]
        - ["収容人数", "43,205人"]
    say:
      - "**ラグビーは少し荒っぽすぎる。**だからアソシエーション・フットボールをやろう。"
      - そう決めた4人が作ったクラブです。決めたことが、そのまま記録に残っています。
      - ジャック・ヒューズ、フレデリック・マシューズ、ウォルター・プライス、ウィリアム・スキャッターグッド。
      - 創設は1874年11月21日。バーミンガムのハンズワースにある、礼拝堂の仲間でした。
      - 名前は、その礼拝堂から取られました。ウェスレアン・チャペルの名を冠した集まりです。
      - 愛称は「ヴィランズ」、そして「ライオンズ」です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Aston_Villa_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: エースがまだいない。5人が1点ずつで並んでいる
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ウナイ・エメリ"]
        - ["主将", "ジョン・マッギン（MF・スコットランド）"]
        - ["エース", "今季は5人が1点ずつで並ぶ"]
        - ["昨季の得点王", "ワトキンス21点。今夏に退団"]
        - ["日本人選手", "鈴木彩艶（GK・背番号1）"]
    say:
      - 今季のヴィラには、エースと呼べる選手がまだ決まっていません。
      - "**5人が1点ずつで並んでいる**からです。"
      - 昨季21点を挙げたオリー・ワトキンスは、今夏クラブを離れました。
      - 監督はウナイ・エメリです。
      - 主将はジョン・マッギン。スコットランド代表の中盤です。
      - そのなかで、いちばん名前が挙がっているのが日本人です。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
