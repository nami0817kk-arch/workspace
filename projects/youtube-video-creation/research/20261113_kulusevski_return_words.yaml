# 取材メモ（2026年11月13日）クルゼフスキ、526日の離脱を振り返る。「人にがっかりした。でも、すべてを許さなければ」（ニュースのショート。見せ方 Y＝本人の言葉から始める）
# ケガの話なので、敬意を持った言い方にする。病名・期間は出典に書いてある範囲だけ。選手を小さく見せない。**依頼の題の「トッテナムに言及」は言い過ぎ**（下の食い違い）。
# 取材: 2026-11-13。WebFetch と python requests（ブラウザUA）と site.api.espn.com で確かめた。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。FotMob は使っていない。
# 出典で確かめたこと:
#   ・ミラー（mirror.co.uk, フェリックス・キース記者, 2026-11-11 12:19。requests で全文を読んだ。控え research/raw/20261113_kulu_mirror.txt）「Dejan Kulusevski aims pointed criticism at Tottenham over 526-day injury lay-off」。
#       本人の言葉（スウェーデン代表に約2年ぶりに戻り、スウェーデンの記者に語った。**ミラーが載せた英語訳。スウェーデン語の原文は読めていない**）:
#         "I have been disappointed in people during this period but at the same time I have to forgive everything."
#         "It is also written in the Bible. That is how I have moved on. It is difficult for all people. Unfortunately, we look after our own interests first, often. It has been a tough period because sometimes you wish you had received more help and such."
#         "But at the same time I understand that we are all part of a business. I have moved on and I love being at the club. I received a very good welcome when I came back."
#         "We did what we thought was best and it didn't work. After that we had to try another operation."
#         "I had to sit all summer and talk to other doctors about having another operation. It would be a knee transplant. That I had replaced my knee with someone else's." / "Then I said no: ... if I have pain when I play, I have to play with pain. I trained and tried to live like a normal person. I trusted that it would work out. So far I've been right."
#       ミラーの地の文: 「トッテナムの扱いについて謎めいた批判（cryptic criticism）」。**本人は誰のことかを言っていない。トッテナムはコメントを控えた（declined to comment）。**
#       今季クラブでは途中出場だけ。スウェーデン代表のグレアム・ポッター監督: 「トッテナムと連絡を取っている…大事なのは、彼がここにいること」（"the most important thing for us is that he is here"）。
#   ・Foot Mercato（a7179870…, 2026-11-12 17:42。requests で全文を読んだ）: 見出しは「クルセフスキがトッテナムを批判」だが、本文は「何人かにがっかりした」とミラー経由で伝えるだけ。
#       2025年5月11日のクリスタル・パレス戦で膝を負傷→復帰まで526日。コヴェントリー戦（3-1）の「le 19 octobre dernier」で復帰（年は書かれない）。**見出しが本人の言葉より強い。**
#   ・ESPN（試合 401879257, 10/19）: トッテナム 3-1 コヴェントリー。終盤（87分）にクドゥスと交代で出場。前の取材メモ 20261020_kulusevski_return で確認済み。5/11 + 526日 = 10/19（自分で数えた。合う）。
#   ・ESPN uefa.nations: スウェーデンの次は 11/14 19:45Z（日本時間15日 4:45）対ボスニア・ヘルツェゴビナ、フレンズ・アリーナ（401861166）。グループB4の順位（11/13 取得）: スウェーデン 4試合 勝ち点10で首位。
#       **クルゼフスキがこの代表ウィークの試合に出たかは未確認（14日の試合はまだ）。台本は「呼ばれている」までしか言わない。**
# 食い違い: ①題の「トッテナムに言及」→ ミラーも Foot Mercato も本人はクラブ名を出していない。ミラーの解釈（批判）と本人の言葉（「人」への失望＋許す＋クラブが大好き）は温度が違う → 台本は本人の言葉を並べ、「誰のことかは語っていない」「クラブはコメントを控えた」と言う。批判とは言わない。
#   ②「526日ぶりの復帰」は10/19の試合（コヴェントリー戦）で、今回の話の場面ではない。今回は代表に戻った場面。③Foot Mercato は復帰を「ce 19 octobre dernier」とだけ書く（年なし）→ ESPN の試合データの年を使う。
# 前の本との重なり: 20261020_kulusevski_return（526日・妻の手紙・コヴェントリー戦の復帰）。今回の初出: 代表に約2年ぶりに戻った場での本人の言葉（人への失望と許し、膝の移植の話）とポッター監督の言葉。妻の手紙・復帰戦の中身は繰り返さない。
# 本人の言葉: あり（ミラー経由の英訳）。Y。
# 反応: 0件（作らない。approve は --no-voices）。
