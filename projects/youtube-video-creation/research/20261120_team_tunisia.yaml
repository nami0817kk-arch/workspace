  say:
  - text: 見立てです。W杯の数字を、フランスに勝った2022年と見比べます。
    image: assets/images/20261120_team_tunisia/b02_w.jpg
    card: none
  - text: 2022年は、1勝1分け1敗。得点1、失点1で、勝ち点4でした。
