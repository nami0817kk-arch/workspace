- id: data
  heading: チュニジア代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: チュニジア代表の基礎DATA
  narrator: 解説
  say:
  - text: チュニジアのフィファランクは、10月7日の発表で**61位**。日本は17位です。
    image: assets/stats/tb_tunisia_data0.png
    no_telop: true
  - text: ワールドカップは7回出場。いちばん上は、1978年の9位です。
    image: assets/stats/tb_tunisia_data1.png
    no_telop: true
  - text: 直近は2026年。スウェーデン、日本、オランダに3連敗でした。
    image: assets/stats/tb_tunisia_data2.png
    no_telop: true
  - text: アフリカネイションズカップは、2004年に優勝。
    image: assets/stats/tb_tunisia_data3.png
    no_telop: true
  - text: 監督は、7月に就任したシャアバニ。契約は2030年までです。
    image: assets/stats/tb_tunisia_data5.png
    no_telop: true
  - text: 主将はフェルジャニ・サッシ。カタールのアルガラファの所属です。
    image: assets/stats/tb_tunisia_data6.png
    no_telop: true
