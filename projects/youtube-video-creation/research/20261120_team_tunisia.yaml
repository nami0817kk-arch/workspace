  - text: W杯7回の通算は、21試合で3勝5分け13敗。16得点で、38失点です。
    image: assets/images/20261120_team_tunisia/b03_w.jpg
    card: none
  - text: 1試合あたりに直すと、取る点は0.8、取られる点は1.8。
    card: none
  - text: 勝った3試合も、点差は1点か2点。大勝は、一度もありません。
    card: none
  - text: 新しいシャアバニ監督の契約は、2030年まで。次のW杯は、2030年です。
    image: assets/images/20261120_team_tunisia/b05_w.jpg
    card: none
  - text: 次のW杯で、チュニジアが点を取れる国に変われるか。そこが注目点です。
    card: none
