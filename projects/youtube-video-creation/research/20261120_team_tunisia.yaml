  heading: チュニジアは、W杯で何度でも、なぜグループで止まるのか
  tier: 背景
  telop: W杯7回、決勝トーナメントは0回
  narrator: 解説
  main: true
  say:
  - text: チュニジア代表。フィファランクは61位の国です。
    image: assets/stats/tb_tunisia_data_t.png
    short_only: true
    no_telop: true
  - text: 2026年のワールドカップで、チュニジアは3戦全敗でした。
    image: assets/stats/tb_tunisia_data_t.png
    no_telop: true
  - text: W杯で1つも勝ち点が取れなかったのは、チュニジアで初めてです。
    image: assets/stats/tb_tunisia_data_r1.png
    no_telop: true
  - text: 得点は2、失点は12。
    image: assets/stats/tb_tunisia_data_r1.png
    no_telop: true
    emph: true
  - text: その4年前の2022年は、フランスに1対0で勝っています。
    image: assets/images/20261120_team_tunisia/b01_w.jpg
    no_telop: true
  - text: W杯は7回出て、勝ちは3つ。決勝トーナメントには、まだ一度も進めていません。
    image: assets/images/20261120_team_tunisia/b01_w.jpg
    no_telop: true
  - text: 勝ち星があっても、次のラウンドに進めないのは、なぜでしょうか。
    image: assets/stats/tb_tunisia_data_t.png
    no_telop: true
