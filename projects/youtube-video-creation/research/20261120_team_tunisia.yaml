  say:
  - text: 2026年のW杯は、グループ敗退。スウェーデンに、1対5の負けで始まりました。
    image: assets/images/20261120_team_tunisia/b01_w.jpg
    card: none
  - text: 2戦目は日本に0対4、3戦目はオランダに1対3。3戦全敗です。
    card: none
  - text: 初戦のあと、サブリ・ラムーシ監督は解任されました。
    image: assets/images/20261120_team_tunisia/b05_w.jpg
    card: none
  - text: 7月の終わりに、モイン・シャアバニが新しい監督になりました。
    card: none
  - text: エスペランスを、アフリカのクラブ王者に2回導いた監督です。
    image: assets/images/20261120_team_tunisia/b03_w.jpg
    card: none
  - text: 代表の監督は、初めてです。
    card: none
  - text: 9月から、アフリカネイションズカップの予選が始まりました。
