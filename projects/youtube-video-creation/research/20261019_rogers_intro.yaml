# モーガン・ロジャーズ（チェルシー／イングランド代表）の紹介。選手紹介の8節の型（2026-10-19、シリーズ「有名選手の紹介」）。
# 見本は research/20261018_wirtz_intro.yaml。**FotMob は使わない**。パーセンタイル・同じ位置との順位・レーダー・シュートマップは出さない。
# 数字は基本の数と自分で割った90分あたり。取材はブラウザの道具・JavaScript実行を使っていない（requests と WebSearch のURL探しだけ。検索のAI要約は使っていない）。
#
# **題材一覧の題案「1億3800万ユーロでヴィラからチェルシーへ移った」を直した点（言い切らない形に）**
# - 移籍金は**クラブが公表していない**。チェルシー公式（chelseafc.com/…/morgan-rogers-signs-for-chelsea、本文を読んだ）は契約が2033年までとだけ書き、金額は無い。
#   金額は Press Association（Irish Examiner 掲載の本文を読んだ）が「ヴィラが1億1700万ポンド（1億3750万ユーロ）の入札を受け入れた」、
#   Sky Sports が「1億1700万ポンドで合意」、Express & Star（PA）が「ヴィラは英国記録の1億1700万ポンドでの売却を確認」と書く。→ **報道**。
#   **1億3800万ユーロは Transfermarkt が円換算でなくユーロ換算した記録**（API /transfer/6445546 の fee 138,000,000 EUR）で、元の報道はポンド。
#   題・語りは**ポンドで「報道」と添える**。ユーロは使わない（為替で数字が変わる）。
# - 市場価値：題材一覧は「€110M」だったが、API の最新は **2026-10-07 付けで €120M**（その前は 07-22 の 110、06-03 の 90）。
#   移籍の記録に付く市場価値は 90M。→ 語りは「10月7日に1億2000万ユーロ。移籍の直前は9000万」と日付を付ける（Transfermarkt の推定）。
# - 年齢：24歳（2002-07-26 生まれ。チェルシー公式の発表文は「23歳」＝発表の時点）。
#
# **数字の出どころ**
# - Transfermarkt API（tmapi-alpha。profile・market-value-history・performance-season 2021〜2026・performance-game 2025/2026・/transfer/6445546。
#   各1回、8秒空けて取得。控えは research/raw/20261019_rogers_tm_a.json・_tm_b.json）：生年月日・身長・契約・市場価値の推移、
#   季ごとの試合・得点・アシスト・出場時間、今季の試合ごとの出場分数。
#   **アシストの食い違い**：24/25 のヴィラ全大会は TM 16、Wikipedia は15。→ 比べは**プレミアのリーグ戦だけ**（24/25 は 8G 11A、25/26 は 10G 7A、
#   Wikipedia のリーグ戦の得点8・10と一致。**チェルシー公式の「ヴィラでプレミア85試合に絡んだゴール40」＝21G＋19A（TM：23/24 の 3G1A＋8G11A＋10G7A）と一致**）。
#   リーグカップのリーズ戦（9/9）は TM が3アシスト、Wikipedia は「4ゴールを演出」。→ **TM の3**を使う。
# - ESPN（site.api.espn.com の試合記録 7試合：スコア・得点者・得点の分・交代の分・イエロー）：4得点の分（フルアム41分・アーセナル2分・ハル7分・ボーンマス3分）、
#   アシスト（ブライトン戦14分のネトのゴール）、チェルシーの7試合は4勝1分2敗。
# - 英語版 Wikipedia（2026-10-17 更新。クラブは10/17まで、代表は10/6まで）：経歴・ローン・受賞・クラブ別の試合と得点（合計241試合51得点＋代表26試合2得点）・プレースタイル。→ 背景。
# - Chelsea 公式サイト（本文を読んだ）：加入の発表・7月27日のアロンソ監督の記者会見・9月4日のアロンソ監督の話・ロジャーズの加入時の言葉・背番号17。→ 報道（クラブ公式の発表。金額は無い）。
# - Sky Sports（本文を読んだ）：1億1700万ポンドで合意・イギリス人選手の最高額・チェルシーのクラブ記録・アンダーソンの1億1600万ポンド・欧州の大会に出ない。
#   ロジャーズのインタビュー（パーマーとの違い、値段への考え）。→ 報道。
# - BBC（本文を読んだ）：ハラス・ホークスの会計担当ブライアン・ウィルクスの話（6歳・62ゴール・8歳末にウェスト・ブロムウィッチがスカウト）、ロジャーズ本人の言葉（年上の子との試合）。→ 報道。
# - Independent（2025-03-19、本文を読んだ）：エメリ監督の叱り方、「EFLでの試合が必要だった」、ベリンガムとのつきあい。→ 報道。
# - Press Association／Express & Star：ヴィラは英国記録の1億1700万ポンド、ヴィラ初年度の初期金額800万ポンド、ヴィラの優勝は30年ぶりのタイトル。→ 報道。
#
# **自分で数えたもの**
# - 90分あたり＝数÷出場時間×90。全公式戦（クラブの試合だけ、代表は含めない）の得点／90分：
#   22/23 ブラックプール 1÷1278×90=0.07／23/24 ミドルズブラ 7÷1842×90=0.34／23/24 ヴィラ 3÷980×90=0.28／24/25 ヴィラ 14÷4496×90=0.28／
#   25/26 ヴィラ 14÷4564×90=0.28／26/27 チェルシー 4÷726×90=0.50。出場分は TM の performance-season（大会ごとの合計）を足した。試合・得点は Wikipedia の表と一致。
# - 通算：Wikipedia（10/17まで）ヴィラ125試合31得点、チェルシー9試合4得点、ほかの貸し出し・ミドルズブラ・シティU21・WBAなど 241−125−9＝107試合、51−31−4＝16得点、
#   代表26試合2得点（10/6まで）。合計 267試合53得点。（ほかの107試合は、ユース年代のU21戦6試合1得点を含む。）
# - 見立ての比べ（プレミアのリーグ戦のみ）：ヴィラ 24/25＋25/26＝74試合・6416分・18得点・18アシスト → ゴール 18×90÷6416＝0.25、アシスト 0.25、合計 0.50。
#   チェルシー 7試合・613分・4得点・1アシスト → ゴール 4×90÷613＝0.59、アシスト 0.15、合計 0.73。ゴールは 0.5873÷0.2525＝2.3倍。
# - 市場価値の倍率：2023-06-01 の180万ユーロ → 2026-10-07 の1億2000万ユーロ＝約67倍。
# - 移籍金の倍率：ヴィラ初年度の報道の初期金額800万ポンド → チェルシー1億1700万ポンド＝14.6倍（約15倍）。ただしヴィラの800万は条件次第で最大1500万ポンドと報じられた（Wikipedia）。
# - 4得点の分：41・2・7・3分。4つのうち3つは開始7分以内（ESPN の得点の時刻）。
# - 今季：9試合・726分（プレミア7試合613分 4G1A、リーグカップ2試合113分 0G3A）。
#
# **入れなかったもの**：私生活（家族・交際）、父・代理人、ヴィラの移籍金の媒体ごとの食い違い（800万／1600万ポンドは報道に幅がある）、マンチェスター・シティの転売益、
#   ワールドカップの試合ごとの出場数（Sky は5、Flashscore は6、TM は7で割れる）、「ロナウド・ルーニーに似ている」の比較、チェルシーの順位の話。
# **日本語名・読みで怪しいもの**：ヘイルズオーウェン、ハラス・ホークス、ウェスト・ブロムウィッチ、リンカーン、ブラックプール、ミドルズブラ、ボーンマス、フライブルク、
#   セルティック、シャビ・アロンソ、ウナイ・エメリ、コール・パーマー、エリオット・アンダーソン、モイセス・カイセド、ブライアン・ウィルクス。
#
# 本人の言葉は6か所（自訳。原文は上の出典）：①フック（Sky）②移籍の節（Chelsea公式）③プレースタイル（Sky）④⑤数字の外の話（BBC・Independent）⑥見立て（Sky）。
