- id: story
  heading: 数字の外にある、2つの話
  tier: 報道
  main: true
  telop: 少年クラブの62ゴールと、エメリ監督の叱り方
  narrator: 解説
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['6歳〜', 少年クラブの2シーズン目に、62ゴール]
    - ['ヴィラ時代', 最高の試合の日も、20分のミスを叱られた]
    source: 各報道
  say:
  - text: チェルシーのロジャーズ、今季プレミアで4ゴール。昨季は10。数字の外の話を2つ。
    image: assets/images/20261019_rogers/02_v.jpg
    short_only: true
    card: none
  - text: 1つ目は、少年時代。地元の少年クラブの、会計担当の話です。
    image: assets/images/20261019_rogers/02_w.jpg
    card: none
  - text: 8歳以下のチームの2シーズン目に、62ゴール。
    card: none
  - text: 8歳の終わりに、ウェスト・ブロムウィッチが迎えに来ました。
    card: none
  - text: そのあとは、貸し出しを重ねる遠回り。本人は、こう語っています。
    image: assets/images/20261019_rogers/06_w.jpg
    card: none
  - voice: ロジャーズ
    text: すぐに頂点へ行ける人もいる。
  - voice: ロジャーズ
    text: でも僕には、下部リーグでの試合が必要でした。
    cont: true
  - voice: ロジャーズ
    text: 苦しい時期を通って、自分を知る必要があったんです。
    cont: true
    pause: 0.6
  - text: 2つ目は、ヴィラのエメリ監督の話。2025年3月、加入から14か月のころです。
    image: assets/images/20261019_rogers/07_w.jpg
    card: &story_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: 各報道
      highlight_row: 1
  - text: 試合のあと、監督は、たった1つのプレーを指摘するそうです。
    card:
      <<: *story_card
      highlight_row: 1
  - voice: ロジャーズ
    text: 最高の試合をした日でも、20分の小さなプレーで、叱られます。
  - voice: ロジャーズ
    text: 僕はいい試合だったと思って、むしゃくしゃして帰る。
    cont: true
  - voice: ロジャーズ
    text: でも、あの人は、いつも最高を引き出してくれます。
    cont: true
    pause: 0.6
  - text: 叱られた日々を、本人は、変えたくないと言います。
    image: assets/images/20261019_rogers/06_w.jpg
    card: none
    pause: 0.5
  quotes_from:
  - https://www.bbc.com/news/articles/c75y7575nxwo
  - https://www.independent.co.uk/sport/football/morgan-rogers-england-tuchel-emery-bellingham-henderson-b2717926.html
  sources:
