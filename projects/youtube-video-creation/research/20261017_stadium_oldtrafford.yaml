# スタジアム紹介シリーズ⑦：マンチェスター・ユナイテッドの本拠地（オールド・トラッフォード、10/17）。雛形は 10/16 チェルシー回（research/20261016_stadium_chelsea.yaml）・10/14 ブライトン回。
# 節の並び：オープニング → 基礎DATA(main・強い一点を頭に＝A) → 開場（年表＋数字3つ）→ 空襲と借りた競技場（年表）→ 収容の歩み（折れ線）→ 次の計画（年表）→ 見立て（自分で数えた比べ）
# 軸：**A＝収容7万4158席はプレミア20クラブで最大（2位トッテナムとの差 1万1308席）と、B＝歴史（1910年の開場・1941年の空襲・1949年の復帰・収容の推移）の両方。冒頭はA。**
#
# 強い一点：**収容 74,158人（今季開幕時のプレミア公式ハンドブック2026/27）はプレミア20クラブで最大。2位トッテナム 62,850 との差は 11,308席。**
#   確度は**報道**（公式ハンドブックの数字から自分で引き算。開場の日付・設計者・愛称はクラブの公式（ir.manutd.com）。ただし ir.manutd.com の「現在の収容 75,454」は2016/17年のまま古いので使わない）。
#
# **自分で数えた・割った（20クラブの収容を PL公式ハンドブック2026/27 の各クラブのページ「Ground Capacity at start of the Season」から全部抽出して検算した）**
#   上から：ユナイテッド 74,158／トッテナム 62,850／リヴァプール 61,276／マンチェスター・シティ 61,038／アーセナル 60,704／エヴァートン 52,769／ニューカッスル 52,729／サンダーランド 48,095／チェルシー 40,044／リーズ 37,633／
#   アストン・ヴィラ 36,887／コヴェントリー 32,609／ブライトン 32,176／フォレスト 31,212／イプスウィッチ 30,294／フラム 28,107／パレス 25,194／ハル 24,983／ブレントフォード 17,250／ボーンマス 12,357。合計 822,365。
#   74,158 − 62,850 = 11,308（1位と2位の差）／62,850 − 61,276 = 1,574（2位と3位の差）→ 11,308 ÷ 1,574 = 7.184 →「7.2倍」／
#   61,276 − 60,704 = 572（3位〜5位の幅）／822,365 ÷ 20 = 41,118.25、74,158 ÷ 41,118.25 = 1.8035 →「1.8倍」／
#   ボーンマス 12,357：11,308 ÷ 12,357 = 0.915（差だけでボーンマスの本拠地の9割あまり）、74,158 ÷ 12,357 = 6.0013 →「6.0倍」／
#   2025-26 ホーム19試合の入場（PL公式の試合データ、2025年シーズンの全38節を引いた）：合計 1,405,516 ÷ 19 = 73,974.53 →「7万3975人」／73,974.53 ÷ 74,158 = 0.99753 →「99.8％」／
#   最多 74,257（2025-08-30 バーンリー）・最少 73,475（2025-08-17 アーセナル）→ 差 782 = 782 ÷ 74,158 = 1.05％ →「1.1％」／
#   83,260 − 74,158 = 9,102（メイン・ロードの記録は、今の収容より 9102人多い）／76,212 − 74,158 = 2,054（2007年の収容から、今季まで）／100,000 ÷ 74,158 = 1.348 →「1.35倍」／1941 → 1959 = 18年。
#
# **重なりで外したもの**
#   クラブ紹介⑯マンチェスター・ユナイテッド（2026-09-20 公開）は「収容7万4158人。20クラブでいちばん大きなスタジアム」「本拠地はオールド・トラッフォード。1910年から使っています」だけを読んでいる。
#   この回は同じ数字が主役（収容）なので外せないが、**1910年の経緯・空襲・借りた競技場・収容の推移は新しい中身**。
#   財政⑧（2026-10-14）は「設備に8590万ポンド。うち6350万ポンドは新スタジアムの計画の土地」を読んでいる。**この回は金額を言わない**（新スタジアムは年表の1節だけ）。
#   ユニフォーム⑦（10-10）・クラブ紹介の「ホームタウン」の話は入れない。
#
# **言わないと決めたもの**
#   **女子（女子チームの本拠地入り・2022年女子EURO開幕戦・女子W杯2035の候補地）は扱わない**（2026-09-16 指示）。
#   **建設費の金額（1910年当時の6万ポンド・追加3万ポンド）は言わない**：Wikipedia の Old Trafford 記事は「土地を入れて総額6万ポンド、10万人にするにはあと3万ポンド」、
#     同じ Wikipedia の Manchester United 記事は「土地代が約6万ポンド、建設の予算が3万ポンド」と書いていて**食い違う**。どちらが正しいかは確かめられていない。
#     台本は「資金の都合で収容が約8万人に縮められた」まで（二つの記事が一致する）。
#   **ヒルズボロの犠牲者の数・内容**は言わない（「事故を受けて1990年にテイラー報告書が出た」まで）。
#   **新スタジアム：収容104,000（総席）・2030-31の入居・国民の祝い・命名権・旧スタジアムの行き先（女子とアカデミーに転用）は言わない**。
#     ファンのブログ（Stretty News）に「旧スタジアムは取り壊さない」とあったが、Architects' Journal（2026-06-22）は「旧スタジアムをどうするかははっきりしない」と書く。**はっきりしない、までを言う。**
#     「2030-31の入居をめざす」は Wikipedia の New Trafford Stadium 記事のみ（クラブの原文を読めていない）。**台本には書かない**。
#   **クラブ公式（manutd.com）の記事は全て 404 / JS で読めなかった**（取得 2026-10-17）。公式として読めたのは ir.manutd.com（投資家向け・歴史）と PL公式ハンドブック。
#   **FIFA の記事（inside.fifa.com）**は空襲の日付（1940-12-22 と 1941-03-11）と「リーグ戦が開かれない期間はおよそ10年」を確かめるのに使った。
#   「メイン・ロードを借りた年」は Wikipedia の記事どうしで食い違う（Old Trafford 記事は「1941〜1949」、History of Manchester United 1945–1969 記事は「1945〜1949」）。**台本は年を言わない。**
#   メイン・ロードの借り賃（1年5000ポンド＋入場料の一部）は Wikipedia（Maine Road・Old Trafford 記事）、借金1万5000ポンドは Wikipedia と FIFA。**「とされます」にとどめる**（一次の原文は読めていない）。
#   戦後の再建補償金（4800ポンド・1万7478ポンド）は Wikipedia のみ。**言わない。**
#   1948年1月17日の 83,260（ユナイテッド対アーセナル 1-1、メイン・ロード）は Guinness World Records の記録ページの原文で確かめた（本文が読めた）。Wikipedia の1947-48シーズン記事には「81,962」とあり食い違うが、
#     Guinness と Maine Road 記事・mufcinfo は 83,260 で一致。**台本は 83,260（Guinness）。**
#   1939年の 76,962（ウルヴス対グリムズビー、FAカップ準決勝）は 11v11 の試合記録・Wolves Complete History・Wikipedia で一致。
#   2007-03-31 の 76,098（ブラックバーン戦、7万6212席のうち空席114）は Wikipedia と mufcinfo。「全席イス席になってからの最多」までを言う（**プレミアリーグ全体の最多ではない**。Guinness は 83,222＝2018年のウェンブリーと記す）。
#   収容の歩み（約8万→5万6385→約4万4000→約5万8000→約6万8000→約7万6000）は ir.manutd.com の原文（「approximately」を含む）。**折れ線の値は「約」**で、台本も「約」を付ける。
#   「76,212」（2007年の席数）と「2009年の 75,957」は Wikipedia のみ。**2054席の減り方の理由は確かめられていない**（Wikipedia は2016年の車いす席の改修が約3000席の減につながると見込むが、公式の説明を読めていない）。台本は「理由は確かめられていません」。
#   「デイヴィス会長が土地を決め費用を出した」「J・J・ベントレー書記の提案で約8万人に縮めた」「ターンブルが初ゴール」「記者の評」は Wikipedia の Old Trafford 記事のみ。**背景**。
#   1911年のFAカップ決勝の再試合（58,000人）は Wikipedia のみ。
#   新スタジアム計画：2024年の幹部の推奨（新築は約20億ポンド、改修は10〜12億ポンドで工事中は収容が減る）・2026-06-22 の土地取得（約350メートル、約10ヘクタール、インデュレント）は Architects' Journal（建築の専門誌・2026-06-22）、
#     設計はフォスター・アンド・パートナーズと進める（2026-09）は StadiumDB のニュース。2025年3月に約10万席の案を公開は Wikipedia と StadiumDB。**すべて報道**。「収容10万席」は「約」を付ける。
#
# 写真：assets/images/20261017_stadium_oldtrafford/（credits.json 同梱。すべて Commons の CC BY-SA。5枚：01 試合中の内側／02 空撮／03 外観／04 西側（ストレトフォード・エンド）／05 南側スタンド）。
#   下地として手元にあった stadium_マンチェスターユナイテッド_in.png（Commons: Tom Morrison 原版 1024x768 を 1920 へ拡大していた）は**引き伸ばしが1.9倍で使えない**ので、別の写真に替えた。
#   1920年代の空撮（Commons: Old trafford stadium 1920s.jpg、PD、919x567）は引き伸ばしが2.09倍になるので使わない。
# サムネは案を3つ出してユーザーに決めてもらう（2026-10-11）。ここに書いた thumbnail は案1（Aだけ）。案2（Bだけ：1行目「マンU本拠地、10年の空白」2行目「借りた競技場に8万3260人」吹き出し「1941年の空襲」写真04）・
#   案3（A+B：1行目「マンU本拠地、最大7万4158席」2行目「最多は借りた競技場の8万3260人」吹き出し「空襲で壊れた」「2位と1万1308席差」写真01）。絵は output/thumb_samples/20261017_stadium_oldtrafford_案*.png。
