  - text: 世界記録を集めるギネスが、イングランド1部の1試合の最多として記録しています。
    card: *id_mr
  - text: いまの収容より、9102人多い数字です。
    emph: true
    card:
      <<: *id_mr
      focus: 2
  - text: 1949年8月24日、本拠地へ戻ります。ボルトンに3対0の勝ち。4万1748人。
    card:
      <<: *id_war
      highlight_row: 3
  - text: リーグ戦を本拠地で開けなかったのは、10年近く。
    card:
      <<: *id_war
      highlight_row: 3
  - text: 戻ったときは屋根もなく、照明は1957年、全部の屋根は1959年でした。
    card:
      <<: *id_war
      highlight_row: 5
  - text: 壊れてから、18年かかりました。
    emph: true
    card: none
