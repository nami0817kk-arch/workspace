- id: plan
  heading: 7万4158席の次は、どんな計画なのか
  tier: 報道
  telop: 2024年に新築を勧め、2026年6月に約350メートル先の土地を買った
  narrator: 解説
  card: &id_plan
    type: timeline
    title: 新しいスタジアムの計画の歩み
    rows: &rows_plan
    - - 2024年
      - 幹部が、建て直しでなく、新築を勧める
    - - 2025年3月
      - 約10万席の新スタジアムの案を公開
    - - 2026年6月
      - 約350メートル先の土地を買う
    focus: 2026年6月
  say:
  - text: 2024年、クラブの幹部は、いまの本拠地ではなく、新築を勧めました。
    image: assets/images/20261017_stadium_oldtrafford/03_w.jpg
    card:
      <<: *id_plan
      highlight_row: 0
  - text: いまの競技場を直す費用は、10億から12億ポンドの見込み。
    card:
      <<: *id_plan
      highlight_row: 0
  - text: 新築は約20億ポンド。直すあいだは、収容が減る見込みでもありました。
    card: none
  - text: 2025年3月、約10万席の新スタジアムの案が公開されます。
    card:
      <<: *id_plan
      highlight_row: 1
  - text: 描いたのは、イギリスの建築事務所、フォスター・アンド・パートナーズです。
    card:
      <<: *id_plan
      highlight_row: 1
  - text: 2026年6月、約350メートル先の土地を、クラブが買いました。
    emph: true
    card:
      <<: *id_plan
      highlight_row: 2
  - text: 約10万席の計画どおりなら、いまの収容の1.35倍です。
    card: none
  - text: いまの競技場をどうするかは、はっきりしていません。
    emph: true
    card:
      <<: *id_plan
      highlight_row: 2
