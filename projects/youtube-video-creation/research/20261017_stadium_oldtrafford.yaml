  takeaway: マンチェスター・ユナイテッドの本拠地、オールド・トラッフォードの収容は、今季の開幕時で7万4158人。プレミア20クラブで最大で、2位トッテナム（6万2850人）との差は1万1308席。2位と3位の差（1574席）の7.2倍で、20クラブの平均（4万1118席）の1.8倍にあたる。1910年に開いたときは、設計の10万人から資金の都合で約8万人に縮められた。1941年の空襲でメインスタンドなどが壊れ、リーグ戦を本拠地で開けない期間は10年近く続いた。そのあいだ借りたメイン・ロードでは1948年に8万3260人が入り、ギネスがイングランド1部の1試合の最多として記録している。1990年のテイラー報告書で全席イス席に替えた1992年に、収容は約4万4000人まで落ち、2006年に約7万6000人まで戻した。昨季のリーグ戦ホーム19試合の平均入場は7万3975人で、収容の99.8％にあたる。次の本拠地戦は10月25日のボーンマス戦で、その本拠地の収容は1万2357人。オールド・トラッフォードは6.0倍になる
