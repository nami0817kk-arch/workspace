- id: capacity
  heading: なぜ、約8万人の器は、4万4000人まで小さくなったのか
  tier: 報道
  telop: 収容は約8万人から、1992年に約4万4000人へ。2006年に約7万6000人
  narrator: 解説
  card: &id_cap
    type: line
    title: 収容の歩み（クラブの公表。約を含む）
    x: ['1910', '1985', '1992', '1996', '2000', '2006', '今季']
    series:
    - - 収容
      - [80000, 56385, 44000, 58000, 68000, 76000, 74158]
    unit: 人
    focus: 収容
    peak: true
  say:
  - text: 戦後は、改修のたびに収容が減り、1985年には5万6385人でした。
    image: assets/images/20261017_stadium_oldtrafford/04_w.jpg
    card:
      <<: *id_cap
      highlight: '1985'
  - text: 1990年、ヒルズボロの事故を受け、安全を見直すテイラー報告書が出ます。
    card:
      <<: *id_cap
      highlight: '1985'
  - text: 1部と2部のスタンドは、すべてイス席にする。政府が、そう求めました。
    card: none
  - text: 立ち見を全部イス席に替えると、収容は約4万4000人まで落ちます。
    emph: true
    card:
      <<: *id_cap
      highlight: '1992'
  - text: 1985年より約1万2000人少なく、クラブの歴史でいちばん少ない数でした。
    card:
      <<: *id_cap
      highlight: '1992'
  - text: 1995年、できて30年の北スタンドを壊し、3層の新しいスタンドを建てました。
    card: none
  - text: 約2万5500席。完成した1996年は、1992年より約1万4000人増えました。
    card:
      <<: *id_cap
      highlight: '1996'
  - text: 2000年には、東スタンドに2層目。続いて、西スタンドにも2層目です。
    card:
      <<: *id_cap
      highlight: '2000'
  - text: 収容は、6万8217人。イギリスで、いちばん大きなクラブの本拠地になりました。
    emph: true
    card:
      <<: *id_cap
      highlight: '2000'
  - text: 2005年7月から2006年5月、北西と北東の角にも、2層目を足します。
    card: none
  - text: 約8000席が増え、収容は、約7万6000人になりました。
    card:
      <<: *id_cap
      highlight: '2006'
  - text: 2007年3月31日、ブラックバーン戦に、7万6098人が入ります。
    card:
      <<: *id_cap
      highlight: '2006'
  - text: 7万6212席で、空きは114席だけ。全席イス席になってからの最多です。
    emph: true
    card: none
  - text: いまの収容は、2007年当時より、2054席少なくなりました。
    card:
      <<: *id_cap
      highlight: '今季'
  - text: この2054席の理由は、確認できていません。
    emph: true
    card:
      <<: *id_cap
      highlight: '今季'
