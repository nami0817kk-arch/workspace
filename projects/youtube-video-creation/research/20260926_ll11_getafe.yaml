  - text: ハビエル・カスケロは、**30歳**で加わった中盤。すぐに先発に定着しました。
    image: assets/photos/ll/getafe/getafe_legend_34a0af96.jpg
  - ヨーロッパで8強に進んだシーズンは、公式戦**50試合**で**8得点**。
  - リーグ戦で**190試合21得点**。**36歳**になるまで、このクラブで戦いました。
  sources:
