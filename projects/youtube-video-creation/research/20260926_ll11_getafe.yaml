- id: history2
  heading: サン・パチョンの日
  tier: 背景
  telop: 2004年、最終節の5点で初めて1部へ
  narrator: 解説
  card:
    type: table
    title: 2004年6月19日
    columns: &id001
    - ''
    - ''
    rows:
    - - 相手
      - テネリフェ（敵地）
    - - 結果
      - 5対3で勝利
  say:
  - 2004年6月、2部の最終節。勝てば、初めての1部です。
  - 敵地のテネリフェで**5対3**の勝ち。セルヒオ・パチョンが、**5点**すべてを決めました。
  - text: マドリード州では、市の外のクラブとして初めての1部です。
    card:
      type: table
      title: 2004年6月19日
      columns: *id001
      rows:
      - - 得点
        - セルヒオ・パチョンが5点
  - この日は、いまも「サン・パチョン」と呼ばれています。
  sources:
  - https://en.wikipedia.org/wiki/Getafe_CF
  - https://en.wikipedia.org/wiki/Sergio_Pach%C3%B3n
  - https://www.marca.com/futbol/getafe/2024/06/19/66731350ca4741984b8b45a4.html
  bg: assets/backgrounds/stadium_ヘタフェ_in.png
  official: false
- id: history3
  heading: 2年続けて決勝へ
  tier: 背景
  telop: バルサに4対0。2年続けて国王杯の決勝へ
  narrator: 解説
  card:
    type: table
    title: 国王杯の2年
    columns: &id002
    - ''
    - ''
    rows:
    - - 2007年 準決勝
      - バルサに2対5、4対0
    - - 2007年 決勝
      - セビージャに0対1
  say:
  - 2007年の国王杯の準決勝。1戦目は、敵地でバルセロナに**2対5**の負け。
  - この試合でメッシは、マラドーナの伝説のゴールに似た一撃を決めています。
  - text: ところがホームの2戦目は**4対0**の勝ち。合計でひっくり返し、初めての決勝へ。
    card:
      type: table
      title: 国王杯の2年
      columns: *id002
      rows:
      - - 2008年 決勝
        - バレンシアに1対3
  - 決勝はセビージャに**0対1**で敗戦。翌年もバレンシアとの決勝に敗れました。
  sources:
  - https://en.wikipedia.org/wiki/2007_Copa_del_Rey_final
  - https://en.wikipedia.org/wiki/2008_Copa_del_Rey_final
  - https://en.wikipedia.org/wiki/Lionel_Messi
  bg: assets/backgrounds/stadium_ヘタフェ_in.png
  official: false
- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 荒々しく、しぶとい。やりくり上手で型破り
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 荒々しく、しぶとい
    - - 運営の型
      - 少ない戦力でやりくり
    - - クラブの気質
      - 型破りな宣伝
  say:
  - text: ボルダラス監督のサッカーは、荒々しく、しぶとい。
    image: assets/photos/ll/getafe/getafe_manager_b5e6eb46.jpg
  - 口ぐせの「これがサッカーだ、パパ」は、スタンドの決まり文句になりました。
  - 昨シーズンの失点は**38**。少ないほうから、リーグで3番目でした。
  - ピッチの外は、限られた戦力でやりくりする型。
  - 昨シーズンは、選手**13人**で開幕を迎えました。
  - 宣伝は型破り。**2015年**には、スタジアムで出会うためのアプリまで作りました。
  sources:
  - https://en.wikipedia.org/wiki/Getafe_CF
  - https://www.marca.com/futbol/getafe/2026/09/26/decada-futbol-papa.html
  - https://en.wikipedia.org/wiki/Jos%C3%A9_Bordal%C3%A1s
  - https://www.marca.com/futbol/getafe/2026/05/23/bordalas-vuelve-getafe-regresa-europa.html
  - https://www.marca.com/2015/10/15/futbol/equipos/getafe/1444939561.html
  bg: assets/backgrounds/stadium_ヘタフェ_in.png
  official: false
- id: episode
  heading: 10人の120分
  tier: 背景
  telop: 10人で延長へ。最後の5分で追いつかれた
  narrator: 解説
  card:
    type: table
    title: 2008年 ヨーロッパの準々決勝
    columns: &id003
    - ''
    - ''
    rows:
    - - 相手
      - バイエルン
    - - ホームの2戦目
      - 延長で3対1から3対3
  say:
  - text: 2008年、ヨーロッパの大会の準々決勝。相手はバイエルンでした。
    image: assets/images/ll_getafe_episode/scene.jpg
  - 1戦目は、敵地で**1対1**の引き分けでした。
  - ホームの2戦目は、開始早々に1人が退場。それでも延長で**3対1**、勝ちが見えていました。
  - text: ところが**115分**と**120分**に、バイエルンのトニが2点。アウェーゴールの差で敗れました。
    card:
      type: table
      title: 2008年 ヨーロッパの準々決勝
      columns: *id003
      rows:
      - - 結果
        - アウェーゴールの差で敗退
  - 試合後、バイエルンのキーパー、カーンはこう話しました。
  - 「今夜のことは信じられない。40年で、こんな経験は無かった」
  sources:
  - https://en.wikipedia.org/wiki/Getafe_CF
  - https://en.wikipedia.org/wiki/2007%E2%80%9308_UEFA_Cup_knockout_stage
  - http://www.elmundo.es/elmundodeporte/2008/04/11/futbol/1207865743.html
  - https://en.wikipedia.org/wiki/Oliver_Kahn
  - https://en.wikipedia.org/wiki/Luca_Toni
  bg: assets/backgrounds/stadium_ヘタフェ_in.png
  official: false
