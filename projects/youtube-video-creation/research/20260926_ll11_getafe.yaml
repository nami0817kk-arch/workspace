    no_telop: true
  - image: assets/stats/ll_getafe_data1.png
    text: 愛称は「アスロネス」。濃い青のことで、工場の作業着の色から、とも言われます。
    no_telop: true
  - image: assets/backgrounds/stadium_ヘタフェ.png
    text: 本拠地はコリセウム。いまは改修中で、完成すると**1万8500人**ほどが入ります。
  - image: assets/stats/ll_getafe_cups.png
    text: 1部の優勝は**0回**。国王杯もヨーロッパも、まだ手にしていません。
    no_telop: true
  - image: assets/stats/ll_getafe_data8.png
    text: 昨シーズンは**7位**。それでも得点は、リーグで**2番目**に少ない数でした。
    no_telop: true
