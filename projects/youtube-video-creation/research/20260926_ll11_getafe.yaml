    no_telop: true
  - text: 通算**10シーズン目**のボルダラス監督。クラブを2度ヨーロッパへ導いた、初めての人です。
    image: assets/stats/ll_getafe_data_r2.png
    no_telop: true
  - text: '**2008年**には、あのバイエルンを10人で延長の最後まで追い詰めました。'
    image: assets/stats/ll_getafe_data_r3.png
    no_telop: true
  - text: 相手のキーパー、カーンは「今夜のことは信じられない」と話しました。
    image: assets/stats/ll_getafe_data_r3.png
    no_telop: true
  - image: assets/stats/ll_getafe_data0.png
