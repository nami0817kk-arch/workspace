- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 2020年以来の欧州と、10シーズン目の監督
  narrator: キャスター
  say:
  - text: ヨーロッパは**2020年**以来。パルチザンを合計**4対3**で破りました。
    image: assets/stats/ll_getafe_data_r1.png
    no_telop: true
  - text: 通算**10シーズン目**のボルダラス監督は、こう話します。
    image: assets/stats/ll_getafe_data_r2.png
    no_telop: true
  - voice: ホセ・ボルダラス
    text: 選手たちは、とてつもない努力をしている
    image: assets/stats/ll_getafe_data_r2.png
  - voice: ホセ・ボルダラス
    text: 多くの選手が、ぎりぎりの力でピッチに立っている
    image: assets/stats/ll_getafe_data_r2.png
  - text: '**2008年**には、あのバイエルンを10人で延長の最後まで追い詰めました。'
    image: assets/stats/ll_getafe_data_r3.png
    no_telop: true
  - image: assets/stats/ll_getafe_data0.png
    text: 前のクラブが借金で解散した**1週間後**に、今のクラブが生まれました。
    no_telop: true
  - image: assets/stats/ll_getafe_data1.png
    text: 愛称は「アスロネス」。濃い青のことで、工場の作業着の色から、とも言われます。
    no_telop: true
  - image: assets/stats/ll_getafe_data2.png
    text: ホームタウンは、マドリードの中心から南へ**13キロ**のヘタフェです。
    no_telop: true
  - image: assets/backgrounds/stadium_ヘタフェ.png
    text: 本拠地はコリセウム。いまは改修中で、完成すると**1万8500人**ほどが入ります。
  - image: assets/stats/ll_getafe_data4.png
    text: オーナーは**2002年**からアンヘル・トーレス。町長に頼まれて、クラブを買いました。
    no_telop: true
  - image: assets/stats/ll_getafe_cups.png
    text: 1部も国王杯も、まだ優勝がありません。ヨーロッパのタイトルも無し。
    no_telop: true
  - image: assets/stats/ll_getafe_data6.png
    text: 最多出場は、キーパーのペドロ・カバジェロで**335試合**。今の主将ジェネが迫ります。
    no_telop: true
  - image: assets/stats/ll_getafe_data7.png
    text: 直近のタイトルは、**1998年**から99年のシーズン、当時の3部リーグの優勝。
    no_telop: true
  - image: assets/stats/ll_getafe_data8.png
    text: 昨シーズンは**7位**。得点**32**は、リーグで2番目に少ない数でした。
    no_telop: true
  sources:
