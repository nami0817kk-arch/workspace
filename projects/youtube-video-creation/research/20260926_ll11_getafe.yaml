# ラ・リーガ20クラブ紹介 ⑪ヘタフェ（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/getafe*.json と旧台本 -
# 2026-10-11 に出すために直した（⑧デポルティーボ・⑨エルチェと同じ直し方）:
#   ・「今季のここまで」を見立ての節にした（自分で数えた1試合あたりの表＋計算の板）。
#     昨季38試合と今季7試合を1試合あたりに直すと、失点は1.00で同じ・得点は0.84→0.57（0.68倍）。
#     数字は research/ll_data/last_season.json（昨季 7位・勝ち点51・得点32・失点38）と
#     standings.json（第7節終了 11位・勝ち点8・得点4・失点7）から自分で割った
#   ・基礎DATAの読み上げを9行→5行に減らした（創立・愛称・本拠地・優勝ゼロ・昨季の順位。
#     残りの4項目は板の右の一覧に出たまま読まない。2026-10-06 ⑩）
#   ・監督の言葉（Marca 2026-09-20 マラガ戦のあと）を基礎DATAから「今季の監督」の節へ移した
#     （2026-10-06「シリーズの本人の言葉は、話の流れで置くべき節に置く」）
#   ・板を3つ入れ替えた（2026-10-07〜08 ⑪⑬⑭）:
#     7部からの出発＝timeline（年表）／2年続けて決勝へ＝waterfall（2戦合計の得失点差）／
#     10人の120分＝stats（数字3つ）。板を下ろす行は card: none を明示した（2026-10-10）
#   ・主役（ヘタフェ）の名前が一度も出ない節が11あったので、各節に入れた
#   ・写真を2枚取り直した（どちらも引き伸ばしが1.6倍を超えていた）:
#     監督 471x793→620x700（Commons の切っていない原版 José Bordalás 2019.jpg から切り出し）、
#     逸話の場面 1077x734→1280x960（File:Getafe0-0Lega2018.jpg。コリセウムの試合中）。
#     カスケロの写真は Commons に 231x341 しか無く、4.16倍になるので**写真を出さない**（表だけ）
#   ・出典は画面に出さない決まり（2026-10-08）に合わせ、板に出典の行は入れていない
