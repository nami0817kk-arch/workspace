#   一覧で「紹介ゼロ」の中で市場価値が最も高いのは、モイセス・カイセド（1億ユーロ、21位。TM 2026-06-03 の値）。次点は ユルドゥズ 7500万・バストーニ 6500万。
#   research/posted.json・covered.yaml・scripts/ の全部を「カイセド」で検索：**題名に入った台本は0本**。scripts/20261019_rogers_intro.md（チェルシーのロジャーズ）にチェルシーの文脈は出るが、人も数字も別。
#   → 現役（2026-10-17 のエバートン戦に90分出場。TM の試合記録）。女子・Jリーグでもない。
# - **数字の軸は新しい**：「チェルシーでの得点が1→2→5（全公式戦）」「シュート19→27→40本、枠内6→5→13本」「出場時間はほぼ同じ（3899→4289→4169分）」「パスと成功率・タックルはほぼ変わらない」「ブライトン最後の年（22/23）のシュートは90分あたり0.86で、25/26 と同じ」。
#
# **日本との接点（あり）**：ブライトンの 2022/23 に、カイセドの出場43試合のうち **38試合で三笘薫も出場**（TM の試合記録の gameId を両者で突き合わせた。控え research/raw/20261023_mitoma_tm.json）。この季、カイセドはクラブの年間最優秀選手と選手間投票の賞（英語版 Wikipedia）。
#   2026年W杯でエクアドルは日本と当たっていない（グループはコートジボワール・キュラソー・ドイツ）。ほかの接点は確かめられていないので入れていない。
