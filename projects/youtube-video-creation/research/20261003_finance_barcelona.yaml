  say:
  - text: なぜ、バルセロナはここまで苦しんだのか。始まりは2021年の夏です。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
    image: assets/images/20261003_finance_barcelona/pair_laporta/01.jpg
  - text: 就任したばかりのラポルタ会長は、こう話しました。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
  - voice: ジョアン・ラポルタ
    text: 財政と経済の状況は、劇的で、とても心配なものです。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
  - text: その11日前の8月5日、クラブはメッシと契約を結び直せないと発表していました。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
  - text: 両者は合意していました。止めたのは、リーグの登録の規則でした。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
    emph: true
  - text: その年度の赤字は、4億8100万ユーロ。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 0
  - text: 会長が明かした負債の総額は、13億5000万ユーロでした。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 1
  - text: 選手たちへの給料は、収入の103%。稼いだ以上を払っていたのです。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 2
  - text: そこでクラブは、先の収入を前もって売る「レバー」、てこに手を出します。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
  - text: 2022年の夏、リーグ戦の放映権の4分の1を25年分、投資会社へ。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 最初の10%だけで、2億750万ユーロが入りました。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 3
  - text: 映像を作る子会社の49%も、2社に1億ユーロずつで売っています。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 4
  - text: 2025年1月には、新スタジアムの特別席475席を30年分売りました。
    card:
      type: table
      title: 2021年の危機と、切り売りしたもの
      columns: *id003
      rows: *id004
      highlight_row: 5
