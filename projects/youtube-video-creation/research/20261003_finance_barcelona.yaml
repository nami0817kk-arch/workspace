  takeaway: バルセロナの収入は2024-25年度に世界2位（9億7500万ユーロ）でも、ラ・リーガの選手に使える上限は今季5億8277万ユーロで、レアル・マドリードより2億5002万ユーロ少ない。上限は収入から選手以外の出費を引いて決まり、2022年に売った放映権の4分の1は25年間ほかへ渡る。それでも上限の差は5年前の6億4122万ユーロから半分以下に縮み、1対1のルールにも戻った。次の公表は冬の移籍市場のあと（今年は3月3日）、スタジアムは来年3月にVIP席、夏に屋根の工事が続く
