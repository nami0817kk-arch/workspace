  say:
  - text: では、スペインの「上限」とはどんな仕組みなのか。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
  - text: ラ・リーガは毎年、クラブごとにこの上限の額を公表します。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
  - text: 見込みの収入から、選手以外にかかるお金を引いた残りが上限です。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
  - text: 上限を超えたクラブは、減らした費用の半分ほどしか補強に回せません。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
  - text: 内側なら、浮いたお金はそのまま使える。これが「一対一のルール」です。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
  - text: メッシが去った2021年の夏、バルセロナの上限は9794万ユーロでした。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 冬には、マイナスにまで落ち込みます。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 0
  - text: 切り売りした翌年は、なんと6億5643万ユーロに跳ね上がりました。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 1
    emph: true
  - text: でも売ったお金は1回きり。翌年は2億7003万ユーロまで下がります。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 2
  - text: そしてこの9月、5億8277万ユーロ。5年でおよそ6倍です。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 5
  - text: リーグの幹部は、バルサが一対一のルールに戻ったと話したと報じられています。
    card:
      type: table
      title: バルセロナの「選手に使える上限」（夏の公表）
      columns: *id005
      rows: *id006
      highlight_row: 5
