- id: stadium
  heading: 新しいカンプ・ノウ
  tier: 報道
  official: true
  telop: 909日ぶりの本拠地。完成すれば約10万5000人
  narrator: 解説
  card:
    type: table
    title: 新しいカンプ・ノウ
    columns: &id007
    - 時期
    - 出来事
    rows: &id008
    - - 2023年4月
      - 改修の資金 14億5000万ユーロを確保
    - - 2023年5月28日
      - 改修前の最後の試合
    - - 2025年11月22日
      - 909日ぶりに帰還（4万5157人）
    - - 2026年3月10日
