- id: abonos
  main: true
  heading: 年間シートの値段の見直し
  tier: 報道
  telop: 副会長「スタジアムが完成したら見直す」
  narrator: キャスター
  card:
    type: table
    title: 年間シートとスタジアムの収入
    columns: &id009
    - 項目
    - 内容
    rows: &id010
    - - 2023年の一部の席
      - 年180〜200ユーロ
    - - 値上げ
      - まだ決まっていない
    - - 今季のスタジアム収入（予算）
      - 2億8500万ユーロ（前年比27%増）
  say:
  - text: バルセロナが、年間シートの値段の見直しを口にしました。
    image: assets/images/20261003_finance_barcelona/pair_fort/01.jpg
    short_only: true
  - text: 新しいカンプ・ノウの年間シートについて、副会長のエレナ・フォルトが語りました。
    image: assets/images/20261003_finance_barcelona/pair_fort/01.jpg
  - voice: エレナ・フォルト
    text: スタジアムが完成したら、見直しを考えなければならない。
  - voice: エレナ・フォルト
    text: 私たちは、ずっとそう言ってきました。
    cont: true
  - voice: エレナ・フォルト
    text: 前は、屋根の下の席がいちばん高かった。雨にぬれないからです。
    cont: true
  - voice: エレナ・フォルト
    text: これからはスタジアム全体が屋根に覆われます。
    cont: true
  - voice: エレナ・フォルト
    text: 良くなるところも、たくさんあります。
    cont: true
  - voice: エレナ・フォルト
    text: だから、どう並べ直すかを見ていくことになります。
    cont: true
  - text: フォルトによると、2023年には年に180ユーロから200ユーロの席もありました。
    card:
      type: table
      title: 年間シートとスタジアムの収入
      columns: *id009
      rows: *id010
      highlight_row: 0
  - voice: エレナ・フォルト
    text: それは、どんな状況でも、まったく市場から外れた値段です。
  - voice: エレナ・フォルト
    text: このクラブは、会員が家族の集まりだとよく分かっています。
  - voice: エレナ・フォルト
    text: だから並べ直すときは、必ず釣り合いを取ります。
    cont: true
  - text: 値上げは、まだ決まっていません。クラブがいま急ぐのは、別の工事です。
    emph: true
    card:
      type: table
      title: 年間シートとスタジアムの収入
      columns: *id009
      rows: *id010
      highlight_row: 1
  - voice: エレナ・フォルト
    text: いま集中すべきは、特別席の仕上げです。
  - voice: エレナ・フォルト
    text: 資金づくりを助けてくれるのは、その席だからです。
    cont: true
  - text: 今季の予算で、スタジアムの収入は2億8500万ユーロ。前の年より27%多い見込みです。
    card:
      type: table
      title: 年間シートとスタジアムの収入
      columns: *id009
      rows: *id010
      highlight_row: 2
  quotes_from:
  - ElNacional.cat https://www.elnacional.cat/es/deportes/barca-abre-puerta-subir-precio-abonos-cuando-spotify-camp-nou-este-terminado_1704511_102.html
