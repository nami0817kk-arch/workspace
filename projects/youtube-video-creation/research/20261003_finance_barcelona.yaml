# クラブの財政：バルセロナ（10/3 土、シリーズ「クラブの財政」）。材料の控えは research/raw/20261003_finance_barcelona.md。
# 選手に使える上限は、ラ・リーガの公表（千ユーロ単位の表。2021/22〜2026/27 の6季ぶんを PDF・画像で読んだ）。夏の数字で並べる。
#   2025/26 のファイルはページ上の札が「2026/27」だが中身は SEASON 2025-2026（冬 2026-03-03 公表）。2026/27 夏は 2026-09-10。
# 上限を超えたクラブの決まりは NEP 2024 第100条（減らした費用の50%まで。2024/25・2025/26 は経過規定で60%、上限の5%以上の選手は70%）→「半分ほど」。
# 1対1に戻ったのは報道（ElNacional 9/10、ラ・リーガの Javier Gómez の話）。台本は「リーグは…明かしました」。
# 2021年の危機はクラブの発表（メッシ 8/5、ラポルタ 8/16、決算 10/6）。放映権は1回目の10%の額（2億750万）だけクラブが公表。2回目の15%の額は報道で割れるので言わない。
# バルサ・スタジオの49%（2億ユーロ）と VIP席（1億ユーロ）は報道。2025/26 の収入10億6000万・純負債6億700万は総会の報道（EFE）。クラブは「初めて10億ユーロ超え」まで。
# 収入の順位はデロイト（2026-01-22、2024/25 年度。バルサ €975m 2位、レアル「close to €1.2bn」1位）。レアルの細かい額は書かない（約12億）。
# スタジアム：融資 14億5000万（クラブ 2023-04-24）、最後の試合 2023-05-28、帰還 2025-11-22（クラブ、4-0、45,157人、909日）、
#   1C の許可 2026-03-10（62,652人、報道）、屋根は 2027年夏・第3層は早くて 2027年4〜5月・VIP席 2027年3月（報道 9/30）、完成時 約10万5000人（クラブ）。
# 年間シート：副会長エレナ・フォルトの BTV の取材（10/2 ElNacional・Crónica Global）。値上げは決まっていない（ElNacional の地の文）。発言は訳して全文に近い形で引く。
# 反応（ネットの声）は置いていない（ブラウザ不可で集めていない）。本人の言葉はラポルタ（2021）とフォルト（10/2）。
# 写真は Commons：05 ラポルタ（2025、CC BY 4.0）、06 フォルト（2024、カタルーニャ州政府・表示）、02 改修前の最後の試合（2023-05-28、CC BY-SA 4.0）、
#   03 工事中の外観（2025-07-18、CC BY-SA 4.0）、04 工事の始まり（2023-08、CC BY 4.0、未使用）。pair_fort はフォルト＋02 を並べた1枚。
