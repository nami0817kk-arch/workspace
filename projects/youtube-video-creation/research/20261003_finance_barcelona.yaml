  say:
  - text: お金の話の真ん中にあるのが、バルセロナの本拠地カンプ・ノウの大改修です。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
    image: assets/images/20261003_finance_barcelona/02.jpg
  - text: 2023年4月、クラブは20の投資家と14億5千万ユーロの融資で合意。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 0
  - text: 5月28日のマジョルカ戦を最後に、スタジアムは工事に入りました。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 1
  - text: 戻ってきたのは2025年11月22日。909日ぶりの本拠地でした。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 2
    emph: true
    image: assets/images/20261003_finance_barcelona/03.jpg
  - text: アスレティック・ビルバオに4対0で勝ち、4万5157人が見届けました。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 2
  - text: 今年の3月には、6万2652人まで入れるようになりました。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 3
  - text: すべて終われば、席はいまの1.7倍近くまで増えます。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 5
  - text: 融資は、完成後に年約2億4700万ユーロと見込むスタジアムの収入で返します。
    card:
      type: table
      title: 新しいカンプ・ノウ
      columns: *id007
      rows: *id008
      highlight_row: 5
