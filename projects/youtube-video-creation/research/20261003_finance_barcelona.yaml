- id: view
  heading: 世界2位の収入と、使える額の差
  tier: 背景
  viewpoint: true
  telop: レアルとの上限の差は、5年で半分以下に
  narrator: 解説
  card:
    type: table
    title: 収入と「選手に使える上限」（ユーロ）
    columns: &id011
    - 項目
    - バルセロナ
    - レアル・マドリード
    rows: &id012
    - - 世界の収入（2024-25）
      - 2位 9億7500万
      - 1位 約12億
    - - 上限（2021-22 夏）
      - 9794万
      - 7億3916万
    - - 上限（2026-27 夏）
      - 5億8277万
      - 8億3279万
    - - 上限の差
      - 6億4122万 → 2億5002万
      - ''
  say:
  - text: 世界2位の稼ぎがあるバルセロナが、なぜ補強に苦しんできたのか。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
    image: assets/images/20261003_finance_barcelona/03.jpg
  - text: 比べられる最新の2024-25年度で、収入は9億7500万ユーロ。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: 1位のレアル・マドリードは、約12億ユーロでした。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
      highlight_row: 0
  - text: ところが選手に使える上限は、マドリードの8億3279万ユーロに届きません。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
      highlight_row: 2
  - text: 上限は、収入から選手以外の出費を引いた残り。稼いでも、出ていく額が大きければ増えません。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
  - text: しかも2022年に売った放映権の取り分は、この先も毎年、投資会社へ流れます。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
  - text: ただ、差は縮んでいます。5年前、上限の差は6億4122万ユーロありました。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
      highlight_row: 1
  - text: それがいまは2億5002万ユーロ。半分以下になりました。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
      highlight_row: 3
    emph: true
  - text: 次の上限は、冬の移籍市場のあとに公表されます。今年は3月3日でした。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
  - text: スタジアムは来年3月に特別席、早ければ4月か5月に最上段の席が開く見込み。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
  - text: 席が増え、値段が並べ直されるほど、上限が上がる余地も広がります。
    card:
      type: table
      title: 収入と「選手に使える上限」（ユーロ）
      columns: *id011
      rows: *id012
