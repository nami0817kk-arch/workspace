  say:
  - text: スペインの名門バルセロナ。昨シーズンの収入は、初めて10億ユーロを突破。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 0
    image: assets/images/20261003_finance_barcelona/03.jpg
  - text: 世界のクラブの稼ぎでも、2024-25年度は堂々の2位です。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 1
  - text: なのにこの5年、バルサは「お金が無くて選手を登録できない」と言われ続けてきました。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
    emph: true
  - text: 選手に使えるお金には、ラ・リーガが決めた上限があります。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 2
  - text: 手元のお金を差し引いた借金は、6億700万ユーロ残っています。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 3
  - text: そして本拠地カンプ・ノウは、いまも大改修の途中です。
    card:
      type: table
      title: バルセロナのお金の基礎DATA
      columns: *id001
      rows: *id002
      highlight_row: 4
