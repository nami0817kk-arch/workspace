# クラブの財政：アイントラハト・フランクフルト（10/29 木、シリーズ「クラブの財政」、key: finance_frankfurt、型は news）。
#
# 題材の選び方：デロイト Football Money League 2026（2024/25）の順で、財政の回をまだ出していないクラブ。
#   1〜19位は既出（19位ベンフィカは 10/28）。20位ウェストハムは今季2部（10/25 に確認済み）で扱わない。21位ガラタサライはトルコ（欧州7リーグの外）。
#   → 22位アイントラハト・フランクフルト（2億6990万ユーロ）。
#   重なりの確認（10/28）：scripts/*finance_* に frankfurt は無い。research/posted.json の frankfurt は 20261024_bd_frankfurt（ブンデスのクラブ紹介）だけ。
#     covered.yaml は doan_frankfurt（堂安のニュース）と bd_frankfurt（クラブ紹介）。クラブ紹介の台本に収入・損益の数字は無い（grep で「収入・ユーロ・デロイト・赤字・黒字」0件）。
#     ★10/24 のクラブ紹介と5日違いで同じクラブ。財政の数字は使っていないので重なりは中身では無いが、報告に書く。
#   ★今季も1部：英語版 Wikipedia「2026–27 Eintracht Frankfurt season」の infobox「league = [[Bundesliga]]」「league result = 14th」、
#     本文「In addition to the domestic league, Eintracht Frankfurt is also participating in this season's edition of the DFB-Pokal.」（ヨーロッパの大会には出ていない）
#
# 軸は「**チャンピオンズリーグ出場を決めた年に、なぜ最終の損益が赤字になったのか**」。
#   答え：出場を決めた（ブンデス3位）＋ヨーロッパリーグ準々決勝に対する選手のボーナスを2024-25に払い、人件費が25.4%増の1億7730万ユーロ。
#     一方、チャンピオンズリーグの収入は次の 2025-26 に入る（財務担当役員の会見、ヘッセン放送の報道）。収入は3億8910万ユーロで前の年（過去最高）とほぼ同じ。
#   ★他の財政回（10/28 ベンフィカ＝本業の黒字、10/27 シュツットガルト＝伸び率と放映権の内訳）と軸を重ねない。主役は「出場の決定とお金の入る年のずれ」。
#   ★日本との接点：2024-25 の決算の数字には無い（堂安律の加入は 2025-26）。無理に入れない（10/6 の決定）。
#   ★選手の名前は、ヘッセン放送が書いた次の年の大型の売却（エキティケのリヴァプールへの移籍）1つだけ。監督の話・女子の話はしない。
#   ★アルファベット（AG・UEFA・CL）は読み上げに出さない。「サッカー部門の会社」と言う。
#
# **決算期**：アイントラハト・フランクフルト・フースバルAG（サッカー部門の会社）は7月〜6月。デロイトの 2024/25 と同じ期間。
#   クラブの「収入」は選手の移籍の収入を含む。デロイトは移籍を含めない → 389.1−118.6＝270.5 で、デロイトの269.9とほぼ同じ（差0.6は数え方の違い。台本では「ほぼ同じ」まで）。
#
# **出どころ（読んだもの）**
#   ○ デロイト Football Money League 2026（2024/25）一次ページ（deloitte.com UK、2026-10-28 に requests で本文を取得）
#       https://www.deloitte.com/uk/en/services/financial-advisory/analysis/deloitte-football-money-league.html
#       「Ranking 21-30 ... 21 Galatasaray 273.6 / 22 Eintracht Frankfurt 269.9 / 23 Brighton & Hove Albion 238.7 ...」
#       上位20：3. Bayern Munich、12. Borussia Dortmund、18. VFB Stuttgart（ドイツのクラブ）→ フランクフルトはドイツで4番目。シュツットガルトは €296.3m（10/27 の取材メモ）。
#   ○ クラブ公式「The 2024/25 financial statement」（2025-10-30、en.eintracht.de、requests で本文を取得）
#       https://en.eintracht.de/news/die-finanzdaten-2024-25-172834
#       「achieved total revenue of €389.1 million in the 2024/25 season, sustaining the level of 2023/24. Last year saw record turnover of €390.5 million posted.」
#       「transfer revenues of €118.6 million along with participation in the UEFA Europa League once again played a key role」
#       「The Europa League was largely responsible for the 16.5 percent increase in media revenues to €107.9 million」「matchday revenues also increased by 15.4 percent to €57.8 million」
#       収入の表：Transfers 118.6／Media rights 107.9／Sponsorship & marketing 75.8／Matchday 57.8／Merchandising 23.5／Other 5.4
#       「Expenditure, including financial results and taxes, rose by just over nine percent to €397.5 million.」
#       「Personnel spending in particular rose by 25.4 percent to €177.3 million, mainly due to the payment of contractually agreed bonuses to the men’s first team for reaching the quarter-finals of the Europa League and qualifying for the UEFA Champions League by finishing third in the Bundesliga table. The personnel expenditure ratio ... at 45.6 percent」
#       「depreciation jumped by 34 percent to €46.0 million」「Despite the net loss for the year of €8.3 million, equity rose significantly from €51.7 million to €69 million due to the successful increase in capital.」
#       「Financial debt rose by around five percent from €68.2 million to €71.8 million」
#   ○ クラブ公式「The 2023/24 financial statement」（2024-10-31）https://en.eintracht.de/news/die-finanzdaten-2023-24-162861
#       「record turnover again in the 2023/24 season: €390.5 million, beating the €310.2 million from the 2022/23 campaign」「record transfer fees totalling €143.2 million」
#       「media rights ... after €140.5 million in 2022/23, they amounted to €92.6 million」「expenditure ... rose by 24.3 percent from €292.6 million (2022/23) to €363.6 million (2023/24)」
#       「personnel expenses rose by a further 18.2 percent to €141.4 million, the staff cost ratio of 39 percent」「Equity rose from €24.7 million to €51.6 million due to the profit」
#   ○ クラブ公式「The 2022/23 financial figures」（2023-09-15）https://en.eintracht.de/news/die-finanzdaten-2022-23-153135
#       「record turnover of €310.2 million」「a post-tax profit of €17.6 million was recorded」「Media rights (€140.5 million/45 per cent)」「Transfers (€15.8/5 per cent)」「participation in the Champions League」
#   ○ ヘッセン放送（hessenschau.de、2025-10-30、dpa の配信を含む）https://www.hessenschau.de/sport/fussball/eintracht-frankfurt/champions-league-beschert-eintracht-frankfurt-millionen-verlust-v1,eintracht-bilanz-102.html
#       「Weil sich Eintracht Frankfurt in der vergangenen Saison für die Champions League qualifiziert hat, weist das Gesamtergebnis der Hessen für 2024/25 einen Verlust von 8,3 Millionen Euro aus.」
#       「"Ohne den Einzug in die Champions League hätten wir ein positives Ergebnis gehabt. Aber darüber hätte sich niemand gefreut, wenn wir die Königsklasse verpasst hätten"」（財務担当役員ユリアン・ツァムベルク）
#       「Die Einnahmen aus der Königsklasse, gerechnet wird mit etwa 50 bis 60 Millionen Euro, fließen allerdings erst in dieser Saison auf das Konto der Hessen.」
#       「Und weil im Mai auch noch die nicht ganz unumstrittene Kapitalerhöhung von 25,7 Millionen Euro umgesetzt wurde」（増資は2025年5月・2570万ユーロ）
#       「Der 95-Millionen-Euro-Transfer des Franzosen zum FC Liverpool wird erst in der Bilanz für diese Saison erfasst.」
#   ○ 英語版 Wikipedia「2026–27 Eintracht Frankfurt season」（上の引用）
#   × 確かめられなかったもの：2025-26 の決算（10/28 時点で発表を見つけられなかった。例年10月末に発表）、ボーナスの額そのもの、
#     デロイトの前の年（2023-24）のフランクフルトの額と順位、2022-23 の人件費。どれも台本に入れない。
#
# 自分で計算した数（検算済み）
#   移籍を除く収入：389.1−118.6＝270.5（デロイト269.9と0.6差）✓
#   内訳の合計：118.6+107.9+75.8+57.8+23.5+5.4＝389.0 ✓（丸め）
#   移籍の割合：118.6÷389.1＝30.5%→約3割 ／ 前の年 143.2÷390.5＝36.7%→約37%
#   2023-24 の最終損益：390.5−363.6＝26.9（純資産 24.7→51.6 の +26.9 と一致）✓
#   2024-25：389.1−397.5＝−8.4（発表は −8.3。丸め）✓
#   人件費の増え：177.3−141.4＝35.9 → 赤字 8.3 の 35.9÷8.3＝4.3倍（「4倍を超える」）✓
#   人件費の伸び 35.9÷141.4＝25.4% ✓
#   費用の伸び 397.5÷363.6＝1.093 → 9.3%（「just over nine percent」）✓
#   放映権：前の年 107.9÷1.165＝92.6 ✓。2022-23（チャンピオンズリーグに出た年）140.5 との差 140.5−107.9＝32.6
#   シュツットガルトとの差：296.3−269.9＝26.4（2640万ユーロ）
#   ベンフィカ（283.4）との差 283.4−269.9＝13.5 → 使わない（ポルトガル）
#
# 写真：assets/images/20261029_finance_frankfurt/（Commons、出典は credits.json）。01 外観（上から）、02 ヨーロッパリーグの夜（2018 マルセイユ戦）、03 空撮（森の中）、04 メインスタンド、05 ゴール裏のマフラー、06 内部のパノラマ。
#   10/24 のクラブ紹介と前の背景で使った「Deutsche bank park.jpg」「Waldstadion match ... Wolfsburg」は避けた。
