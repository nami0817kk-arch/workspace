  heading: 見立て・フランクフルトの赤字は、チャンピオンズリーグの前払いだったのか
  tier: 背景
  telop: 人件費の増え3590万ユーロは、赤字の4倍超。人件費の比率は39%から45.6%へ
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（サッカー部門の会社の決算）
    columns: [比べ, 答え]
    rows:
    - [人件費の増え ÷ 赤字, 4倍超]
    - [人件費 ÷ 収入（前の年は39%）, 45.6%]
    - [収入のうち移籍（前の年は約37%）, 約3割]
    highlight_row: 0
  say:
  - text: ここからは見立てです。フランクフルトの決算の数字を、自分で割ってみます。
    image: assets/images/20261029_finance_frankfurt/05_w.jpg
    card: none
  - text: 人件費の増えは、3590万ユーロ。赤字の額の、4倍を超えます。
    emph: true
    mark:
      kind: circle
      row: 0
      col: 1
    card: *view_table
  - text: 収入に対する人件費の割合は、前の年の39%から、45.6%に上がりました。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 収入のうち移籍の分は、前の年の約37%から、約3割に下がっています。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 題への答えです。
    image: assets/images/20261029_finance_frankfurt/01_w.jpg
    card: none
  - text: 出場を決めたボーナスは、この年に払い、出場で入るお金は、次の年に入る。
    emph: true
    card: none
  - text: そのずれが、赤字の大きな理由でした。
    card: none
  - text: 報道では、チャンピオンズリーグの収入は、5000万から6000万ユーロの見込み。
    image: assets/images/20261029_finance_frankfurt/02_w.jpg
    card: none
  - text: エキティケのリヴァプールへの移籍の9500万ユーロも、次の年の決算に入ります。
    card: none
  - text: 前払いが、次の決算で取り返せるのか。ここが見どころです。
    card: none
  sources:
