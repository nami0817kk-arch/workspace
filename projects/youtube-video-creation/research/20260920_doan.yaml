      - "ニアに走り込んだ堂安が、最初のタッチで**1人をかわします**。"
      - そのままゴールキーパーを引きつけ、横へ。エブヌタリブが誰もいないゴールへ流し込みました。
      - 堂安にとっては、今季初めてのアシストです。
