    bg: assets/backgrounds/doan_20260920.png
    telop: 走りながら、右足で合わせた
    narrator: キャスター
    say:
      - {short_only: true, text: フライブルクの日本人が、後半すぐに追いつきました。}
      - フランクフルトが2対1でリードして折り返した後半、48分でした。
      - 左サイドから、緩やかなクロスが入ります。
      - "ファーサイドでフリーになっていた鈴木唯人が、**走りながら右足のダイレクトボレー**。"
      - 開幕節のハットトリック以来、3試合ぶりの得点で、今季4点目になりました。
      - フライブルクはこの引き分けで、バイエルンと勝ち点で並びながら得失点差で首位を明け渡しています。
