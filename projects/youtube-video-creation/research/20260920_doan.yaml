  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
    bg: assets/backgrounds/doan_20260920.png
    telop: 「簡単に撃ってるけど、かなり難しい」
    narrator: キャスター
    say:
      - {short_only: true, text: このゴールを見た人たちの声です。}
      - {voice: ネット民, text: このボレー、簡単に撃ってるけどかなり難しい, short_voice: true}
      - {voice: ネット民, text: 素晴らしいボレーだったな。鈴木唯人は本当良いタイミングでエリア内に入ってくるわ}
      - {voice: ネット民, text: ここぞってところで決めてくれるその決定力と、後半この人が前向いてボール受けたらドリブルで畳みかけられる畏怖があった}
      - {voice: ネット民, text: 推進力のあるドリブルと無駄なロストが少ないのがいいよな}
      - {voice: ネット民, text: ドリブルの推進力の他に、田中碧みたいな嗅覚も併せ持っていたようだな}
      - {voice: ネット民, text: 代表でレギュラーで見たい選手の1人}
      - {voice: ネット民, text: やっぱキック精度と質だよね}
      - {voice: ネット民, text: 覚醒してるねぇ}
      - {voice: ネット民, text: ブンデスでは唯人に海舟、そして田中聡。中盤ヤバすぎ}
      - {voice: ネット民, text: 対照的に、アシストしたけど停滞気味の堂安}
      - {voice: ネット民, text: 三笘が稼働できず久保が大きく調子を崩している今が最大のチャンスだ。がんばれ唯人}
      - {voice: ネット民, text: 代表でもスタメンで見たいね。シャドーなら右左関係なくハマるだろう}
      - {voice: ネット民, text: のってますねー。かなり調子がいい。代表でもこの勢いでいけばスタメン確保もありえるかも}
      - {voice: ネット民, text: ワールドカップのブラジル戦に出してほしかったなぁ}
      - {voice: ネット民, text: 次のW杯が楽しみだ}
      - {voice: ネット民, text: これからW鈴木の時代だね, short_voice: true}
    official: false
    sources:
