# ウスマン・デンベレ（パリ・サンジェルマン／フランス代表）の紹介。選手紹介の型（2026-11-23 公開分、シリーズ「有名選手の紹介」。key: player_288230）。情報の時点は 2026-11-13（クラブの試合は 11/7 のリーグ・アン第10節まで）。
# **FotMob は使わない。**数字は Transfermarkt API（控え research/raw/20261113_dembele_*.json）、英語版 Wikipedia、けがの報道（ESPN・parisfans ほか、検索で確認）。
# **選んだ理由（2026-11-13）**：player_pool.py list の上位は紹介済みで、pool の外で未出の大物を探した。TM の市場価値1億ユーロ・2025年バロンドール受賞者。ほかの候補：エンソ・フェルナンデス（11/25 に使う）、サリバ（アーセナル、1億）、バルベルデ（9000万）、ラフィーニャ（7000万）。サラーは TM のクラブが449番でリヴァプールでないので外した。
#   重なり：scripts/ を「デンベレ」で grep → 9月の news 回（20260909_dembele ほか）だけで、シリーズの紹介は0件。同じ日（11/23）の別シリーズ（ユニフォーム＝ユヴェントス）と重ならない。11/25 のユニフォームがパリ・サンジェルマンなので、デンベレは 11/23 に置いた。
# **現役・今季もリーグ・アン**：TM の試合記録で 2026-11-07 まで（10/20 のCLバルセロナ戦で20分で交代、以降4試合欠場＝けが）。
# **数字の軸**：TM の試合記録（トップチームだけ。レンヌの二軍 FR5B は除く）。クラブ通算 409試合127点116アシスト：レンヌ 29/12/5、ドルトムント 50/10/21、バルセロナ 185/40/42、PSG 145/65/48（Wikipedia の PSG 145/65 と一致）。PSG のシーズン別：23/24 42/6/15、24/25 53/35/16（クラブW杯4試合を含む）、25/26 40/20/11、26/27 10/4/6（473分）。90分あたりの得点＋アシスト：バルセロナ 82÷10948分×90＝0.67、パリ 113÷9017×90＝1.13、今季 10÷473×90＝1.90、昨季 31÷2200×90＝1.27。代表 71試合13点7アシスト（TM）。市場価値（TM）：2017-06 3300万→2019-02 1億2000万（最高）→2021-12 3000万→2023-06 6000万→2025-10 1億→2026-06 1億。
# **入れなかったもの**：家族・信仰・私生活、本人の言葉の引用（一次の原文は確かめられず）。
# **確かめられなかった**：バルセロナの移籍金1億500万＋追加報酬4000万は Wikipedia の記述（報道で金額が割れる）。10/20 のけがの中身（左ハムストリング／太ももの筋損傷）はクラブの発表でなく報道。復帰時期は 11/13 時点で未発表（検索で確認）。2025年CL決勝の本人の活躍の中身は台本に出さない。W杯のフランス4位は TM の試合記録と Wikipedia。
# **写真**：Commons の Bryan Berlin 撮影（CC BY-SA 4.0）、2026年W杯のフランス代表戦の4枚。クラブ（PSG）姿の写真は取れなかった。

