sections:
  - id: what
    main: true
    heading: 謝ったのは、どんな発言だったのか
    tier: 報道
    telop: 番組の前の取材で、好きな自分のネットミームを聞かれた
    say:
      - text: 発端は、フランスのネットの対談番組に出る前に受けた、取材の動画です。
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
      - text: 好きな自分のネットミームを聞かれ、ムバッペは、ある男の動画を挙げました。
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
      - text: その男を、中国の独裁者だったと思う、と言っています。
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
      - text: 映っていたのは、中国の建国の指導者、毛沢東の体に、顔を合わせた画像です。
        image: assets/images/20261028_mbappe_china_apology/01_w.jpg
      - text: この動画が、ネットで広まりました。
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50295111/real-madrid-kylian-mbappe-chinese-brands-dictator-comment
      - https://web.gekisaka.jp/news/world/detail/?461936-461936-fl

  - id: apology
    heading: ムバッペは、どんな言葉で謝ったのか
    tier: 報道
    telop: ムバッペがSNSで謝罪の声明
    say:
      - text: 27日、ムバッペは自分の公式のアカウントに、謝罪の声明を載せました。
        card: none
        image: assets/images/20261028_mbappe_china_apology/01_w.jpg
      - voice: ムバッペ
        text: 最近の取材で、自分の画像に反応しました。
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
      - voice: ムバッペ
        text: あの発言は、配慮を欠いていました。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
      - voice: ムバッペ
        text: 中国の多くの人たち、世界中の中国系の人たちを、
        cont: true
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
      - voice: ムバッペ
        text: 傷つけたと、いまは分かっています。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
      - voice: ムバッペ
        text: 私の言葉で気分を害したすべての方に、おわびします。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
      - voice: ムバッペ
        text: 決して、そのつもりはありませんでした。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
      - voice: ムバッペ
        text: 中国の人々と、その歴史に、深い敬意を持っています。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/01_w.jpg
      - voice: ムバッペ
        text: 心から、申し訳なく思っています。
        emph: true
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50295111/real-madrid-kylian-mbappe-chinese-brands-dictator-comment
      - https://web.gekisaka.jp/news/world/detail/?461936-461936-fl

  - id: brands
    heading: 契約を終えたのは、どの会社か
    tier: 報道
    telop: 中国の3社が、ムバッペとの契約を終えると発表
    say:
      - text: 同じ27日、中国の3社が、ムバッペとの契約を終えると発表しました。
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
        card: &brands {type: table, title: 契約を終えると発表した3社, columns: [会社, 何の会社], rows: [[ドンポン, 飲料], [モンニウ（蒙牛）, 乳業], [ミルクグラウンド, チーズ]], highlight_row: 0}
      - text: 飲料のドンポン、乳業のモンニウ、チーズのミルクグラウンドです。
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
        card: {<<: *brands, highlight_row: 2}
      - text: 3社とも、国民感情を傷つける言動に反対する、という似た文面でした。
        image: assets/images/20261028_mbappe_china_apology/01_w.jpg
        card: none
      - text: 理由を具体的に挙げた会社はありません。発表は、動画が広まったあとでした。
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
      - text: 交流サイトのレッドノートも、別に発表しています。
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
      - text: 2024年末に終わった契約の、宣伝の素材を消すとしています。
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50295111/real-madrid-kylian-mbappe-chinese-brands-dictator-comment

  - id: laliga
    heading: ラ・リーガは、何と言ったのか
    tier: 報道
    telop: ラ・リーガも声明で謝罪
    say:
      - text: ムバッペの発言について、ラ・リーガも同じ日に声明を出しました。
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
      - voice: ラ・リーガ
        text: 発言は、個人としてのものです。
        image: assets/images/20261028_mbappe_china_apology/01_w.jpg
      - voice: ラ・リーガ
        text: ラ・リーガを代表するものではありません。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/04_w.jpg
      - voice: ラ・リーガ
        text: リーグと、すべてのクラブを代表して、おわびします。
        cont: true
        image: assets/images/20261028_mbappe_china_apology/02_w.jpg
      - text: クラブや選手と、ほかの文化を尊重するための取り組みを進める、としています。
        image: assets/images/20261028_mbappe_china_apology/03_w.jpg
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/50295111/real-madrid-kylian-mbappe-chinese-brands-dictator-comment
