  say:
  - text: 大久保嘉人の生まれは、1982年6月9日。福岡県の出身で、いま44歳です。
    image: assets/images/20261026_okubo_yoshito_legend/06.jpg
    card: {<<: *datacard, highlight_row: 0}
  - text: 欧州では、スペインのマジョルカと、ドイツのヴォルフスブルクでプレーしました。
    card: {<<: *datacard, highlight_row: 2}
  - text: ドイツでは、ブンデスリーガ優勝のメンバーに名を連ねています。
    card: {<<: *datacard, highlight_row: 4}
  - text: 日本のリーグでは、J1で通算191得点。いまも歴代最多の記録です。
    image: assets/images/20261026_okubo_yoshito_legend/03_w.jpg
    card: none
    emph: true
  - text: 引退は2021年限り。最後のクラブは、プロの始まりと同じセレッソ大阪でした。
    image: assets/images/20261026_okubo_yoshito_legend/06.jpg
    card: {<<: *datacard, highlight_row: 7}
