- id: after
  heading: 引退した大久保嘉人は、いま、どこで何をしているのか
  tier: 報道
  telop: 引退のあと、ふたたびスペインへ
  card: &aftercard
    type: timeline
    title: 最後の1年と、引退のあと
    rows:
    - - 2021年1月
      - 15年ぶりにセレッソ大阪へ
    - - 2021年11月19日
      - シーズン限りでの引退を発表。39歳
    - - 2025年9月
      - アルビレックス新潟バルセロナのクラブディレクター
    focus: 2
    highlight_row: 0
  say:
  - text: 2021年、大久保嘉人は、15年ぶりにセレッソ大阪へ戻ります。
    image: assets/images/20261026_okubo_yoshito_legend/01_w.jpg
    card: {<<: *aftercard, highlight_row: 0}
  - text: 11月19日、そのシーズン限りで引退すると、クラブが発表します。39歳でした。
    card: {<<: *aftercard, highlight_row: 1}
  - text: クラブが出したコメントには、こうあります。
    image: assets/images/20261026_okubo_yoshito_legend/02_w.jpg
    card: none
  - voice: 大久保嘉人
    text: 苦しいことが一番多かったかもしれません。
    card: none
  - voice: 大久保嘉人
    text: しかしそれが自分を強くしてくれたと思っています。
    card: none
    cont: true
  - text: そしていま。2025年9月から、新しい肩書きがあります。
    image: assets/images/20261026_okubo_yoshito_legend/07_w.jpg
    card: {<<: *aftercard, highlight_row: 2}
  - text: アルビレックス新潟バルセロナの、クラブディレクターです。
    card: {<<: *aftercard, highlight_row: 2}
  - text: 日本の若い選手が、スペインでサッカーと語学を学ぶ場です。
    card: {<<: *aftercard, highlight_row: 2}
  - text: 20年前に自分が戦った国で、次の世代を支えています。
    card: none
    emph: true
  quotes_from:
  - https://www.cerezo.jp/news/2021-1119-1800/
  sources:
  - https://www.cerezo.jp/news/2021-01-09-12-01/
  - https://www.cerezo.jp/news/2021-1119-1800/
  - https://www.fcjurong.com/en/news/44451/
- id: secret
  heading: サプライズの代表入りと、久保竜彦の一言には、何があったのか
  tier: 報道
  telop: 2年ぶりの代表と「一番スゴい」FW
  card: &secretcard
    type: table
    title: 数字の外にある、2つの話
    columns:
    - いつ
    - 何があったか
    rows:
    - - 2014年
      - 2年以上ぶりに、W杯のメンバーへ
    - - 2017年
      - 久保竜彦が「一番スゴい」と語る
    source: JFA・週プレNEWS
    highlight_row: 0
  say:
  - text: 大久保嘉人の、数字の外にある話を、2つ。
    image: assets/images/20261026_okubo_yoshito_legend/03_w.jpg
    card: {<<: *secretcard, highlight_row: 0}
  - text: 1つ目は、2014年5月12日。ブラジル大会の日本代表が発表されます。
    card: {<<: *secretcard, highlight_row: 0}
  - text: FWの欄に、大久保嘉人の名前がありました。
    image: assets/images/20261026_okubo_yoshito_legend/04_w.jpg
    card: none
  - text: それまでの最後の代表戦は、2012年2月のアイスランド戦。
    card: none
  - text: 2年以上、呼ばれていなかった選手です。
    card: none
    emph: true
  - text: 6月のザンビア戦では、2008年以来の代表ゴールを決めました。
    card: none
  - text: 2つ目は、元日本代表のFW、久保竜彦の言葉です。
    image: assets/images/20261026_okubo_yoshito_legend/03_w.jpg
    card: {<<: *secretcard, highlight_row: 1}
  - text: 2017年のインタビューで、こう振り返っています。
    card: none
  - text: 一緒にプレーしたFWで、いちばんすごいと思ったのは大久保嘉人だった、と。
    image: assets/images/20261026_okubo_yoshito_legend/01_w.jpg
    card: none
    emph: true
  - text: 理由は、体の使い方。「猫っていうか、チーターっていうか」と表しました。
    card: none
  quotes_from:
  - https://wpb.shueisha.co.jp/news/sports/20170509-84395/
  sources:
  - https://www.jfa.jp/news/00000776/
  - https://en.wikipedia.org/wiki/Yoshito_%C5%8Ckubo
  - https://ja.wikipedia.org/wiki/%E5%A4%A7%E4%B9%85%E4%BF%9D%E5%98%89%E4%BA%BA
  - https://wpb.shueisha.co.jp/news/sports/20170509-84395/
- id: view
  heading: 点が出ない時期のあと、大久保嘉人はどう取り返したのか
  tier: 背景
  telop: 最初の19試合は0点、その後41試合で6点
  viewpoint: true
  card: &viewcard
    type: table
    title: 点が出ない時期と、そのあと
    columns:
    - 場面
    - 出なかった時期
    - そのあと
    rows:
    - - 日本代表
      - 最初の19試合で0点
      - 41試合で6点
    - - マジョルカ
      - 勝ち点11差の下位
      - 残り3試合で2点
    - - 2014年
      - 2年以上呼ばれず
      - ザンビア戦でゴール
    source: Wikipedia・日刊スポーツ
    highlight_row: 0
  say:
  - text: 大久保嘉人の歩みを、点が出なかった時期と、そのあとで比べます。
    image: assets/images/20261026_okubo_yoshito_legend/06.jpg
    card: {<<: *viewcard, highlight_row: 0}
  - text: 日本代表は、最初の19試合で0得点。
    card: {<<: *viewcard, highlight_row: 0}
  - text: それが2007年からの41試合では、6得点。およそ7試合に1点です。
    card: {<<: *viewcard, highlight_row: 0}
    emph: true
    mark:
      kind: circle
      row: 0
      col: そのあと
  - text: マジョルカでは、勝ち点11差の下位から、残り3試合で2得点。
    card: {<<: *viewcard, highlight_row: 1}
  - text: 2014年は、2年以上呼ばれなかったあとに、ワールドカップ直前の試合でゴール。
    image: assets/images/20261026_okubo_yoshito_legend/03_w.jpg
    card: {<<: *viewcard, highlight_row: 2}
  - text: 本人の言葉どおり、苦しい時期の多い20年でした。
    image: assets/images/20261026_okubo_yoshito_legend/01_w.jpg
    card: none
  - text: それでも、点が出ない時期のあとに、次の場所で取り返す。
    card: none
  - text: それが、大久保嘉人というFWでした。
    card: none
