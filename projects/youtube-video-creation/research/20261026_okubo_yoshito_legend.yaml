# 大久保嘉人（元日本代表FW）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-26。型は 10/25 の遠藤保仁と同じ8節。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は セレッソ大阪公式・JFA公式・日刊スポーツ（当時の記事）・日本語/英語版 Wikipedia の成績表と試合記録、自分で足した値だけ。
# **私生活（家族・結婚・移住）は入れない。女子サッカーは入れない。病気・怪我・法的な問題（退場・暴言）は入れない**。Jリーグは経歴の事実（所属・期間・J1通算の記録）だけで、Jリーグそのものを題材にしない。
#
# **重なりの確認（2026-10-26）**：scripts/・research/covered.yaml・research/posted.json を「大久保」「okubo」「中澤」「nakazawa」で grep。
#   出てくるのは 2026-09-29 の **小久保玲央ブライアン（kokubo）**（別人）だけ。大久保嘉人の回は無い。直近の中田英寿・長谷部誠・中村俊輔・内田篤人・川口能活・小野伸二・稲本潤一・遠藤保仁とも別人。
# **引退の確認（一次情報）**：セレッソ大阪公式「大久保 嘉人選手 現役引退のお知らせ」（cerezo.jp/news/2021-1119-1800/、2021-11-19）
#   「大久保 嘉人 選手が、2021シーズン限りで現役を引退することになりました」。→ **現役ではない**。AFC公式（2021-11-20）も同じ。
# **いまの立場**：FC Jurong（運営 NSG Global）公式 2025-09-01「Yoshito Okubo Appointed as Club Director of Albirex Niigata Barcelona」
#   ＝2025–26シーズンから、留学プログラム「アルビレックス新潟バルセロナ」のクラブディレクター。プログラムは「football, language learning, and daily life overseas」。
# **日本との接点**：全体が日本代表・W杯の話（代表60試合、W杯は2010・2014）。
#
# **数字の出どころと台本での扱い**
# - **日本代表 60試合6得点**：英語・日本語 Wikipedia（jfootball-db 引用）、AFC公式「60 caps」、日刊スポーツ 2021-11-20「国際Aマッチ通算60試合6得点」。
#   年別（英語版）2003=14・2004=3・2005=2・2006=0・2007=2・2008=12・2009=9・2010=11・2011=0・2012=1・2013=0・2014=6 の合計 60、得点 0+0+0+0+2+3+0+0+0+0+0+1=6 を自分で確認。
#   区切り（自分で足した）：2003〜05 = 19試合0得点、2007〜10 = 34試合5得点、2012〜14 = 7試合1得点。2007年以降 = 41試合6得点 → 41÷6＝6.8 →「およそ7試合に1点」。
#   初ゴール 2007-10-17 エジプト戦（2得点）＝21試合目（19＋2007年8月のカメルーン戦＝20、エジプト戦＝21。日本語 Wikipedia の「21試合目」と一致）。
#   代表デビュー 2003-05-31 韓国戦（日刊スポーツのプロフィル）。最後の得点前は 2008-11-13 シリア戦、次が 2014-06-06 ザンビア戦（英語 Wikipedia の得点一覧）。
# - **W杯**：2006年は落選（日本語 Wikipedia）。2010年は4試合すべて先発（英語 Wikipedia の Group E / knockout stage の先発表：カメルーン戦 CF、オランダ・デンマーク・パラグアイ戦 LW）。
#   2014年はメンバー発表 2014-05-12（JFA公式 news/00000776 の FW 欄に「大久保 嘉人（川崎フロンターレ）」）。本大会は3試合（コートジボワール 67分から、ギリシャ・コロンビア先発。英語 Wikipedia Group C）。W杯の得点は0なので言わない。
#   2012年2月のアイスランド戦以来の選出（日本語 Wikipedia、年別の 2012=1・2013=0 と合う）→「2年以上、呼ばれていなかった」。
# - **マジョルカ**：期限付き移籍の決定 2004-11-08、スペイン初戦 2005-01-09 デポルティーボ戦で1得点1アシスト（日刊スポーツ「大久保嘉人プロフィル」）。試合は2対2（英語 Wikipedia 2004–05 La Liga の結果表 MLL–RCD 2–2）。
#   残留争い（日刊スポーツ大阪版 2005-05-31「マジョルカ奇跡的残留、大久保も残留濃厚」）：4月10日のサラゴサ戦の負けでレバンテと勝ち点11差 → 以後7試合4勝3分け → 最後の3試合に大久保が先発（最終節は79分までプレー、ベティスと1対1）→ レバンテが負けて17位で残留。
#   残り3試合のうち2試合の得点（アスレティック戦・デポルティーボ戦）は日本語 Wikipedia（日刊の「3戦連発はならなかった」と合う）。スコアは英語 Wikipedia の結果表 MLL–ATH 4–3、RCD–MLL 0–3。
#   最終の勝ち点：マジョルカ 10勝9分＝39、レバンテ 9勝10分＝37（英語 Wikipedia の順位表から自分で計算）。差は2。
#   スペイン通算 39試合5得点（日本語・英語 Wikipedia。2004-05 は13試合3得点で日刊のプロフィルと一致）。
# - **ヴォルフスブルク**：2009年1月に加入、リーグ戦9試合0得点（英語 Wikipedia）。2008–09 はクラブ初のリーグ優勝（英語 Wikipedia 2008–09 Bundesliga「secured their first national title」）。長谷部誠も同じチーム（日本語 Wikipedia）。2009年6月に神戸へ戻る。
# - **J1通算 474試合191得点**：セレッソ大阪公式の引退の知らせ（一次情報）。歴代最多は日刊スポーツ 2021-11-20。**Jリーグの話は、この1行だけ**（経歴の事実）。
# - **アテネ五輪 3試合2得点**：日刊スポーツのプロフィル「３試合で２得点」。高校三冠・インターハイと選手権の得点王：同プロフィル。アジア年間最優秀ユース選手（2003）：同プロフィル・FIFA。
# - **本人の言葉**：①日刊スポーツ大阪版 2005-05-31 の残留直後の談話（記事の（残留は）は記者の補いなので外し、残りは原文のまま）。②セレッソ大阪公式の引退コメント（一次情報）から1文を原文のまま。
# - **久保竜彦の言葉**：週プレNEWS 2017-05-09（本文を requests で読んで一字一句確認）「一緒にやったＦＷで一番スゴいと思ったのが嘉人でした。猫っていうか、チーターっていうか、体の使い方がうまい。」
# - 年齢：1982-06-09 生まれ → 2026-10-26 で44歳、2021-11-19 で39歳（日刊も39歳）、2005-01-09 で22歳。
#
# **入れなかったもの**：家族・結婚・スペインへの移住（私生活）、退場・暴言・ベッカムとの小競り合い（日刊のやんちゃアラカルト）、怪我、テレビ出演、J1の3年連続得点王の中身（Jリーグを題材にしない）、マガト監督とのいきさつ（Number の記事のみ）。
# **写真がマジョルカ・ヴォルフスブルク時代のものは取れなかった**（Commons に無し、記事の写真は代理店か小さい）。台本ではその時代の行に別の時期の写真を敷く。
# **日本語名・読みで怪しいもの**（audio_query で確認）：大久保嘉人＝オオクボヨシト（○）、苅田町＝カンダマチ（○、台本では使わない）、マジョルカ（○）、ヴォルフスブルク（○）、デポルティーボ・ラ・コルーニャ（区切れるが音は正しい）、レバンテ（○）、クーペル（○）、アルビレックス新潟バルセロナ（○）、嘉人（ヨシト○）。
