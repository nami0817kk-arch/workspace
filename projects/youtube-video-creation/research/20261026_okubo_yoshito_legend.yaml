  - text: 4月10日、サラゴサに負けた時点で、レバンテとの勝ち点の差は11。
    card: {<<: *mllcard, highlight_row: 1}
    emph: true
  - text: そこから最後までの7試合、マジョルカは4勝3分けで、1度も負けません。
    card: none
  - text: その最後の3試合、クーペル監督は、大久保を先発に選びます。
    image: assets/images/20261026_okubo_yoshito_legend/02_w.jpg
    card: none
  - text: アスレティック・ビルバオ戦は、4対3の勝ち。大久保がゴールを決めます。
    image: assets/images/20261026_okubo_yoshito_legend/04_w.jpg
    card: {<<: *mllcard, highlight_row: 3}
  - text: 次のデポルティーボ戦も、3対0の勝ち。2試合続けてのゴールでした。
    card: none
    emph: true
  - text: 最終節は、ベティスと1対1の引き分け。
    image: assets/images/20261026_okubo_yoshito_legend/02_w.jpg
    card: none
  - text: 同じ時間、残留を争うレバンテが負けます。
    card: none
  - text: マジョルカは17位で、1部に残りました。勝ち点39と37、差は2でした。
    image: assets/images/20261026_okubo_yoshito_legend/04_w.jpg
    card: {<<: *mllcard, highlight_row: 5}
    callword: 1部残留
    emph: true
