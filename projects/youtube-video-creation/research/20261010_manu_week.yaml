# 取材メモ（10/10 題材 manu_week＝題材一覧の⑪「キャリックとマンUにとって大きな1週間」、型は news、プレミア枠）。
# **同じ日の 20261010_city_carrick と軸を分けている。**
#   city_carrick ＝ 9月29日の判定についてキャリックが語ったこと（判定・9季・控訴の期限・剥奪）。
#   この本 ＝ **今週の2試合と、いまの順位と、間に合わない選手**。
#   判定・控訴・剥奪・9季・5,252日の話は一行も入れない。会見から引くのも「すねの痛みの見通し」だけにした
#   （判定についての発言は city_carrick に置いてあるので、この本では引かない）。
#   読み上げの言い回しも突き合わせて、10字以上そのまま重なるものが無いことを確かめた。
# 事実の土台はすべて報道・公式の表から取った。検索の要約は根拠にしていない:
#   ・ESPN（Rob Dawson、10月9日17:30 ET）＝セシュコの発言2つ、ドルグ・マズラウイ・バレバの状態、
#     セシュコがトッテナム戦に出られないこと、フラム戦（1-1）も欠場していたこと
#   ・ESPN の試合前情報（国際試合明け）＝トッテナム戦に欠ける3人の確認
#   ・ESPN の順位表（2026-27、5試合終了時点）＝順位・勝ち点・得点・失点・得失点差
#   ・ESPN の順位表（2025-26 最終）＝ユナイテッドは3位で勝ち点71
#   ・ESPN の日程と結果＝10月10日トッテナム、10月13日アトレティコ、9月10日サバフ戦0-4、
#     8月1日のアトレティコとの親善試合1-2
#   ・ESPN の10月13日の欧州の組み合わせ＝「アトレティコ・マドリード 対 マンチェスター・ユナイテッド」＝**敵地**
# **使わないと決めたもの**:
#   ・キャリックの年齢・就任の時期・契約の長さ（当たったのが検索結果の要約だけで、記事の原文に辿れなかった）
#   ・会場の名前（スポンサー名の入った呼び名なので「敵地マドリード」までにした）
#   ・「批判」「解任」に当たる言葉（当たった記事のどれにも本人の言葉として無い。評論家の見立ては引かない）
#   ・サバフの国名（結果の表に国が書かれていないので「初戦」までにした）
# 1試合あたりの数字（1.86・5試合で9の目安・6試合で11の目安・4倍・中2日・4日で2試合）は、
#   上の表の数字からこの回で自分で割った。報道の中の計算を写したものではない。
# **板について**：山場（week）は発言が続く区間なので、行ごとに分けた表を置いて `highlight_row` を動かす。
#   いちばん強い1行（「いまの時点ではまだはっきりしない」）だけ板を外して顔にする。
#   節に `card:` を書くと全行へ展開されて行の `card: none` が効かないので、**節の card は置かず、行ごとに書いた**。
# 写真は Commons の CC0（Timmy96、2025年。Wikidata が本人の画像として挙げている1枚）。
#   記事の写真を先に当たったが、**ショートに敷ける高さ1200px以上のものが無かった**
#   （ESPN の og:image は 1296x729、Read Man Utd は 1200x882。どちらも9:16に切ると2.0倍を超える）。
#   さらに ESPN の og:image は**キャリックではなく選手が写っていた**ので取り込んでいない。
#   この1枚はミドルズブラ時代の服装だが、[[写真の決まり]]の「他に無ければそのまま使う」に当たる。
#   切るのは手でやらず facecrop.py（01_w＝16:9・01_v＝9:16）。どちらも開いて目で見た。
#   代理店（Getty・AFLO・AFP・ロイター・IMAGO・AP・PA・EPA・共同）のものは1枚も取り込んでいない。
# ネットの反応は集めていない（この題材で実在する投稿を当たっていないため、作らない）。
