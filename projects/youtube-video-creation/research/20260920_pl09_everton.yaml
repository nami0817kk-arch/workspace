  say:
  - 1927年から28年のシーズン、ディクシー・ディーンがリーグ戦だけで**60ゴール**を決めました。
  - 1部リーグの、1シーズンの得点記録です。
  - 100年近くたったいまも、破られていません。
  sources:
  - https://en.wikipedia.org/wiki/Everton_F.C.
