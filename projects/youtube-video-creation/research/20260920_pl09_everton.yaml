  - text: ネヴィル・サウスオールは1981年、ベリーから**15万ポンド**で来たウェールズ人キーパーです。
    image: assets/photos/pl/everton_legend_721f5e76.jpg
  - 1985年、1部優勝とヨーロッパのカップの**2冠**。記者が選ぶ年間最優秀選手にもなりました。
  - リーグ戦**578試合**はいまもクラブ記録。ウェールズ代表でも92試合、長く国の最多でした。
  sources:
