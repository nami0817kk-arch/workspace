  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_everton_data.png
    text: 創立は**1878年**。リヴァプールのスタンリー・パークで生まれたクラブです。
  - image: assets/stats/pl_everton_data.png
    text: 昨季、2025年から26年に新しいスタジアムへ移りました。**5万2769人**が入ります。
  - image: assets/stats/pl_everton_data.png
    text: オーナーはアメリカの実業家ダン・フリードキン。2024年12月からクラブを持っています。
  - image: assets/stats/pl_everton_data.png
    text: 1部リーグの優勝は**9回**。FAカップは5回、ヨーロッパのタイトルも1回あります。
  - image: assets/stats/pl_everton_data.png
    text: 直近のタイトルは、1994年から95年のFAカップです。
  - image: assets/stats/pl_everton_data.png
    text: 1927年から28年には、ディキシー・ディーンが1シーズンで**60得点**。いまもイングランドの記録です。
  - image: assets/stats/pl_everton_data.png
    text: 愛称は「トフィーズ」。村にあったキャンディ屋から来ています。
