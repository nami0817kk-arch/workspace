- id: move
  heading: 133年いた家を出た
  tier: 背景
  telop: グディソン・パークから、ヒル・ディキンソンへ
  narrator: 解説
  card:
    type: table
    title: 本拠地
    columns:
    - ''
    - ''
    rows:
    - - 1884年-1892年
      - アンフィールド
    - - 1892年-2025年
      - グディソン・パーク
    - - 2025-26年から
      - ヒル・ディキンソン・スタジアム
  say:
  - '**133年いた家を、去年出ました。**'
  - その家、グディソン・パークは古く、席を増やせなくなっていました。
  - そこに入ったのは**1892年**。それまではアンフィールドにいました。
  - 地主と家賃でもめて出ていき、残った地主が作ったのがリヴァプールです。
  - 新しい家は、川沿いのドックに建てたヒル・ディキンソン・スタジアム。名前は地元の法律事務所です。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Everton_F.C.
  - https://en.wikipedia.org/wiki/Hill_Dickinson_Stadium
