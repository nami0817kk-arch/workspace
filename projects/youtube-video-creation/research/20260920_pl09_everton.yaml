- id: data
  heading: エヴァートン 基礎DATA
  main: true
  tier: 背景
  telop: 1878年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_everton_data0.png
    text: 創立は**1878年**。街の公園、スタンリー・パークで生まれたクラブです。
    no_telop: true
  - image: assets/stats/pl_everton_data1.png
    text: 愛称は「トフィーズ」。エヴァートン村にあったキャンディ屋から来ています。
    no_telop: true
  - image: assets/stats/pl_everton_map.png
    text: ホームタウンは、港の街リヴァプール。
    no_telop: true
  - image: assets/backgrounds/stadium_エヴァートン_in.png
    text: 本拠地はヒル・ディキンソン・スタジアム。**5万2769人**が入ります。
  - image: assets/stats/pl_everton_data4.png
    text: オーナーはアメリカの実業家ダン・フリードキン。2024年12月からクラブを持っています。
    no_telop: true
  - image: assets/stats/pl_everton_cups.png
    text: 1部リーグの優勝は**9回**。次いでFAカップが5回、カップウィナーズカップが1回です。
    no_telop: true
  - image: assets/stats/pl_everton_data7.png
    text: 直近のタイトルは、1994年から95年のFAカップです。
    no_telop: true
  - image: assets/stats/pl_everton_last.png
    text: 昨季は**13位**。勝ち点は49でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Everton_F.C.
