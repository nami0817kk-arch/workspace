  say:
  - 2002年、3つの大会で2位でした。
  - リーグは、5点差の首位から、2連敗で抜かれます。
  - ドイツカップ決勝は、シャルケに2対4。
  - 4日後のチャンピオンズリーグ決勝は、レアル・マドリードに1対2。
  - text: この年のあだ名が、英語で「ネバークーゼン」。あと一歩で届かない、という意味です。
    card:
      type: table
      title: 2002年のレバークーゼン
      columns: *id001
      rows:
      - - チャンピオンズリーグ決勝
        - レアル・マドリードに1対2
      - - W杯決勝（横浜）
        - 先発22人のうち4人が所属
  - text: その夏のワールドカップは、日本と韓国で。決勝の会場は、横浜でした。
    image: assets/images/bd_leverkusen_yokohama/scene.jpg
  - 決勝に先発した22人のうち、4人がレバークーゼンの選手でした。
  - ブラジルのルシオと、ドイツのラメロウ、シュナイダー、ノイヴィル。
  - text: 日本の細貝萌も、このクラブの選手でした。2012-13は、リーグ戦17試合。
    image: assets/photos/bd/leverkusen/leverkusen_japan_49494d14.jpg
