  say:
  - 2023-24は、開幕のライプツィヒ戦、3対2の勝ちで始まります。
  - そこから最後まで、一度も負けませんでした。
  - text: 4月14日、第29節。ブレーメンに5対0で、初優勝を決めます。
    image: assets/images/bd_leverkusen_title/scene.jpg
  - 創立から**120年**で、初めての優勝でした。
  - text: 最終節も勝って、ブンデスリーガ史上初の、無敗優勝です。
    card:
      type: table
      title: 2023-24のブンデスリーガ
      columns: *id003
      rows:
      - - 得点と失点
        - 89得点、24失点
      - - 優勝を決めた日
        - 4月14日、第29節
  - 28勝6分け。勝ち点は**90**で、前の年より**40**多い数字でした。
  - 公式戦の無敗は**51試合**。ベンフィカの48を超える、欧州の記録です。
  - 止まったのは、ヨーロッパリーグ決勝。3日後のドイツカップ決勝には勝ち、2冠でした。
  sources:
