  - id: flash
    heading: 試合直後の説明
    tier: 報道
    telop: 「試合が決めたことだ」
    narrator: キャスター
    say:
      - 試合直後、ジェズス監督はこう説明しました。
      - voice: ジョルジェ・ジェズス
        text: 試合が決めたことだ。残り25分、プレスをかけられるフレッシュな選手が必要だった
      - voice: ジョルジェ・ジェズス
        text: 技術的にはクリスティアーノの質は無いかもしれないが、ゴンサロが守備のスピードをくれると分かっていた
    sources:
      - https://sapo.pt/artigo/jorge-jesus-a-substituicao-do-ronaldo-foi-o-que-o-jogo-ditou-6ab59137c5a3f84d7f311de9
      - https://www.record.pt/internacional/competicoes-de-selecoes/liga-das-nacoes/detalhe/jesus-gostou-do-que-viu-e-explica-substituicao-de-ronaldo-precisavamos-de-alguem-fresquinho-para-pressionar
  - id: presser
    main: true
    heading: 会見では違った
    tier: 報道
    telop: 「前から計画していた」
    narrator: キャスター
    say:
      - text: 'ジェズス監督は、ロナウドを交代させた理由を試合直後、「試合が決めたことだ」と説明していました。'
        short_only: true
      - そのあとの会見では、前から決めていたと言い直しています。
      - voice: ジョルジェ・ジェズス
        text: 残り25分でロナウドを下げたのは、フレッシュな選手がいることが大事だと思ったからだ
      - voice: ジョルジェ・ジェズス
        text: クリスはもう少し、あと5分、長くて10分は出られたのも分かっていた
      - voice: ジョルジェ・ジェズス
        text: 試合中に下げるつもりで、それは前から計画していた
      - voice: ジョルジェ・ジェズス
        text: ゴンサロならそれができると分かっていた。技術面で失うものはあっても、別の局面で得るものがあった
    sources:
      - https://www.record.pt/internacional/competicoes-de-selecoes/liga-das-nacoes/detalhe/conferencia-de-imprensa-de-jorge-jesus-em-direto
      - https://www.abola.pt/video/jorge-jesus-ja-tinha-planeado-tirar-cristiano-ronaldo-do-jogo-2026092422411377570
  - id: neves
    heading: 味方の言葉と、本人の投稿
    tier: 報道
    telop: ネヴェス「ゴールは出てくる」
    narrator: キャスター
    say:
      - 同じ67分に交代したルベン・ネヴェスは、こう庇いました。
      - voice: ルベン・ネヴェス
        text: クリスティアーノのことは知ってるだろう。点を取れない時は、取った時と同じではない
      - voice: ルベン・ネヴェス
        text: 素晴らしい仕事をしたし、彼を通じてチャンスを作れた。ゴールは出てくる
      - ロナウド本人は試合のあと、一言だけ投稿しています。
      - voice: ロナウド
        text: 最初の一歩は踏み出した。行こう、ポルトガル
    sources:
      - https://www.record.pt/internacional/competicoes-de-selecoes/liga-das-nacoes/detalhe/ruben-neves-exibicao-foi-boa-foram-dois-dias-de-treino-e-e-dificil-colocar-as-ideias-em-pratica
      - https://www.record.pt/futebol/selecoes/detalhe/cristiano-ronaldo-destaca-primeiro-passo-apos-triunfo-diante-do-pais-de-gales
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「ポルトガルの三浦カズ」と「オフザボールは現役トップ」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 結局先発だね。CFがいないなら、ユーロまでの間に色々試して最適解を模索しないといけない時期なのに
      - voice: ネット民
        text: 採点5.8は草。もう潔く譲った方がいいよ。ポルトガルのファンが可哀想
      - voice: ネット民
        text: ポルトガルの三浦カズ
      - voice: ネット民
        text: ロナウドいなくなるとチャンスなくなるもん
      - voice: ネット民
        text: 点こそなかったけど、全然良かったな。オフザボールの動きが現役の中でもトップクラス
      - voice: ネット民
        text: 今日のポルトガル戦をフルで見ずに数字だけ見てロナウド批判してる奴はあほ
      - voice: ネット民
        text: ロナウドがもう全然やれてないのは分かってる。でも彼抜きの20数分を見たら、同じかむしろ悪かった
      - voice: ネット民
        text: スタジアムにいた友達が、ロナウドが決められなくて泣いてる子がいたと言ってる。この効果はまだ生きてる
      - voice: ネット民
        text: 代表を見るたびに後悔する。でも馬鹿なのは俺だ
      - voice: ネット民
        text: ロナウドが決めると思ってた。決めなかったけどw
      - voice: ネット民
        text: 得点が取れなくなったロナウド、ついにオフザボールのみで持ち上げられ始める
      - voice: ネット民
        text: 君が一生涯費やしてロナウドを批判しても、彼がgoatという事実には抗えない
