    say:
      - ポルトガルがウェールズに1対0で勝ちました。ジェズス監督の、ポルトガル代表監督としての初陣です。
      - 1点は22分のジョアン・フェリックス。
      - ロナウドは**シュート7本**で0点。49分にゴール前で外し、59分に流し込んだゴールは、オフサイドで取り消し。
      - そして**67分**、ゴンサロ・ラモスと交代。拍手を受けて下がりました。
