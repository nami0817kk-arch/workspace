#   ・質問「Karim Benzema a été Ballon d’Or en 2022, Harry Kane a été Ballon d’Or en 2026 … Trouvez-vous des similitudes entre vous et Karim Benzema ?」
#   ・ケインの答え（原文）: "Karim est un joueur incroyable. J’ai toujours été un grand admirateur du joueur. Ce qu’il a accompli au Real Madrid en 2022 était vraiment impressionnant. Il a cette capacité à descendre au milieu de terrain et à jouer presque comme un numéro 10, à dicter le jeu, tout en arrivant dans la surface au moment idéal."
#       "… en termes d’intelligence de jeu, de capacité à trouver des espaces et d’envie d’aider les joueurs autour de nous, je vois clairement beaucoup de similitudes dans notre football. Tous les deux, nous avons démontré qu’il n’est pas toujours nécessaire d’être dans la surface pour marquer des buts. En ce qui me concerne, j’ai plus d’occasions lorsque je descends plus bas, car je ne suis pas marqué de près."
#       "… La saison dernière a été le meilleur exemple : j’ai marqué 73 buts …"
#       「…つの目のバロンドールは？」への答え: "j’adorerais remporter un autre Ballon d’Or … il y a encore de nombreux trophées que j’aimerais remporter, comme la Ligue des champions avec le Bayern et, évidemment, un titre avec l’Angleterre."
