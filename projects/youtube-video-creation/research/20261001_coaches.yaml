  say:
  - text: 名波浩は、代表67試合で9得点。日本が初めて出た1998年のワールドカップで、10番を付けました。
    image: assets/images/20261001_coaches_trio/01.jpg
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 0
  - text: 左足で長短のパスを配る司令塔で、2000年のアジアカップでは大会の最優秀選手に選ばれています。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 0
  - text: 中村俊輔は、代表98試合で24得点。ワールドカップは2006年と2010年に出ています。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 1
  - text: 左足のフリーキックの名手です。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 1
  - text: チャンピオンズリーグでも、マンチェスター・ユナイテッドから直接決めています。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 1
  - text: 長谷部誠は、代表114試合。ワールドカップは3大会とも、主将として出ました。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 2
  - text: フランクフルトでは2016年から、中盤より一列後ろ、3人で組む守りの真ん中にも立ちました。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 2
  - text: ドイツ1部での384試合は、アジアの選手でいちばん多い数字です。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 2
  - text: 新しい持ち場は、3人が現役で立っていた場所とそのまま重なります。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
  - text: 流れの中の攻めは司令塔だった名波に。止まったボールから始まるセットプレーは、左足の名手の中村に。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
  - text: そして守備は、3人の中でただ一人、いちばん後ろの真ん中で守った長谷部に任されました。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 2
  - text: いまの日本代表も、守りは3人で組みます。長谷部はその形を、いちばん後ろから知っています。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
      highlight_row: 2
  - text: ただ、マンツーマンの守りは、1度入れ替わられると、そのまま危ない場面につながります。
    card:
      type: table
      title: 3人の現役時代（日本代表）
      columns: [名前, 試合, 得点, ワールドカップ]
      rows: *career
  - text: その賭けをどう整えるかが、長谷部の持ち場です。
    card:
