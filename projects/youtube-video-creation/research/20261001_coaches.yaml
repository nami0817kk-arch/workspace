  say:
  - text: 日本代表のコーチの持ち場が、この9月から変わりました。守備を見るのは長谷部誠コーチです。
    short_only: true
  - text: 9月28日のベネズエラ戦。交代を使い切ったあとの後半41分、渡辺剛が痛めて退き、10人に。
    image: assets/images/20261001_coaches_pair_moriyasu/01.jpg
    card:
      type: table
      title: ベネズエラ戦の終盤（9月28日）
      columns: [時間, 出来事]
      rows: *night
      highlight_row: 1
  - text: 試合中、長谷部コーチがボードを持って、監督と話す場面がありました。
  - voice: 森保一
    text: 直近の試合で10人になった時は
  - voice: 森保一
    text: 長谷部コーチがどうしますかと尋ねてきた。
    cont: true
  - voice: 森保一
    text: 私の中ではすでにプランはあったが、
    cont: true
  - voice: 森保一
    text: 確認ということで持ってきてくれた
    cont: true
  - text: 長谷部が案を出して監督が認めるのか、2人で見ながら相談して決めるのか。
  - text: 会見でそう聞かれ、監督は「後者です」と答えています。
  - text: ボードを持っていくのは、長谷部だけの仕事でもないと言います。
  - voice: 森保一
    text: 気付いた人が持ってきてくれて、
  - voice: 森保一
    text: より伝達しやすいように準備をしてくれたもの
    cont: true
  - text: 日本は後ろの守りを3人から4人に組み直し、10人のまま、終了間際のPKで2対1と勝ち越しました。
