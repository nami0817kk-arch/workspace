# 取材メモ（10/1 の題材 6）。起点は 9/30 の森保監督の会見（エクアドル戦の前日、日産スタジアム）。材料の控えは research/raw/20261001_coaches.md。
# この動画はエクアドル戦（10/1 19:10）の前に公開する。試合の結果は書かない。
# 事実の裏:
#   持ち場: ゲキサカの会見要旨（460050）の森保監督の答えを原文のまま引く。日刊スポーツも同じ答え（齊藤・前田の「守備と攻撃」の順だけ逆）。
#     どちらがどちらを支えるかは言い切らず「2人は支えに回る」まで。
#   替えた時期: 9/17 のメンバー発表（スポニチ・中日）。W杯までは守備が齊藤俊秀、セットプレーの攻撃が前田遼一。
#   就任: 名波 2023年（JFA 2023-01-17）／長谷部 2024年（最終予選から。JFA のスタッフ紹介）／中村 2026年4月16日（JFA）。
#   年齢は JFA の生年月日から 2026-10-01 時点で計算（名波 1972-11-28＝53／長谷部 1984-01-18＝42／中村 1978-06-24＝48）。
#   10人: ゲキサカのテキスト速報。後半36分に10人目の交代で枠を使い切り、後半41分に渡辺剛がアクシデントで退く（退場ではない）。
#     2-1 は後半45分+6 の上田のPK。PKの中身（VAR）は 9/29 の別の回と重ねないので言わない。10人からの並び（中村敬斗のSB）も 9/30 の回で扱ったので言わない。
#   「ボードを持って監督と話している場面」は会見の問いの言葉。10人の場面と結びつけたのは監督の答え（「確認ということで持ってきてくれた」）。
#   現役時代: 名波 67試合9得点（JFA 00031440）、1998年W杯で10番・全試合先発、2000年アジア杯 MVP（ja.wikipedia）。
#     中村 98試合24得点・W杯2006/2010（日経＝共同、フットボールチャンネル）、FKの名手（日経）。CLでマンチェスター・ユナイテッドからFK（en.wikipedia、2006年）。
#     長谷部 114試合2得点（サッカーキング 2024-09-11）、W杯3大会とも主将（サッカーキング 2018-07-03）、
#     2016年10月28日のボルシアMG戦から3バックの真ん中（Number Web）、ブンデス384試合はアジアの選手で最多（フットボールゾーン）。
#   使わない: 主将81試合（ja.wikipedia だけ）、中村のJ1のFK最多（資料で数が揺れる）、W杯の試合数。
# 鎌田大地は 9/30 に別の回で扱ったので、長谷部の守りの難しさを言う1か所だけ（ゲキサカ 460061）。
# 写真: 記事の写真を先に当てた。代理店のものは無い（目で透かしを見た）。
#   森保＝日刊スポーツ（9/30 会見、撮影・足立雅史）／長谷部＝サッカーキング（2026-05 のインタビュー）／名波＝サッカーキング（2026-05）／
#   中村＝ゲキサカ（2026-03 ハムデン・パーク、©Koki NAGAHAMA/GEKISAKA。上半身を切り出した 02）／鎌田＝ゲキサカ（9/30 練習、©Kaoru WATANABE/GEKISAKA）。
#   冒頭は長谷部の 01_w（頭が入る 16:9）。語る人の行は語る人（左）＋長谷部（右）の2枚並べ。3人の話は3枚並べ（trio）。
# 反応: Yahoo!ニュースのコメント欄（日刊スポーツ・スポニチの記事）から、個人の投稿を頭から終わりまで。海外の反応は見つからなかった（0件）。
