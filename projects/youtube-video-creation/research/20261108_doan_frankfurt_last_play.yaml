#       堂安は先発。64分にイリチェヴィッチと交代（ESPN）。前半のシュートは3本（4分・ブロック／5分・枠の外／27分・ブロック）で枠内0。ファウル2。
#   ・サッカーキング本文: 堂安は右サイドのアタッカーで先発。ブルカルトの同点弾は「ヒールキック」、交代は「63分」、PKの獲得は「72分」。
#   ・食い違い: ①交代は 63分（サッカーキング）対 64分（ESPN）→ 台本は分で言わず「後半の途中」。②同点弾は サッカーキング「ヒールキックで押し込む」、ESPN は「右足」とだけ→ 台本は蹴り方を言わない。
#       ③前半の同点弾は サッカーキング 45+1分、ESPN 45分 → 「前半の終わり」。④PKの得点は サッカーキング本文 72分／得点者の欄 73分（記事内でも食い違う）、ESPN 73分 → 「後半」。
#   ・ESPN 順位表（ger.1 standings、11/8 朝）: フランクフルト 9試合3勝3分3敗・勝ち点12・9位（試合前は8試合3勝2分3敗＝記事と一致）。
#   ・日本代表: サッカーキング 2026-11-04（2224321）の招集28人に堂安律（フランクフルト）。14日のブラジル戦（シンガポール）。
#   ・次のリーグ戦: 11月21日（土）ホームでホッフェンハイム（ESPN scoreboard。サッカーキングも「次節21日、町田浩樹所属のホッフェンハイム」）。
# 自分で数えたもの: 引き分けで勝ち点1を加えて12（ESPN の順位表）。フランクフルトは後半の73分から10人になったのは75分（退場）から。同点弾までの時間は 90+3分。
# 前の本との重なり: scripts/20261017_doan_kosugi_koeln_aori ほか堂安の過去の回。今回の初出は「ラストプレーの同点弾」と「堂安の前半のシュート3本・後半の交代」。
# 本人の言葉: 無い（試合後の堂安のコメントは、サッカーキング・ゲキサカ・ESPN のどこにも11/8 朝の時点で見つからなかった）。X。
