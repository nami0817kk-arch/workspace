        - ["買い取り", "550万ユーロ（約10億円）"]
        - ["9月12日", "アタランタ戦の68分から出場"]
    say:
      - カリアリ対アタランタ。菅原由勢がセリエAで初めてピッチに立った試合です。
      - 菅原が加入したのは9月1日でした。サウサンプトンからの期限付き移籍で、買い取りの金額はおよそ10億円と報じられています。
      - 26歳の菅原は、カリアリにとってクラブの歴史で初めての日本人選手になります。
      - そのデビューが、加入から12日目のアタランタ戦でした。
      - 送り出されたのは68分。チームが2対1でリードし、それを守り切りたい場面での投入です。
      # **試合の出来も載せる**（2026-09-13 ユーザー指示）
      - 菅原は残りの20分あまりを守り切りました。カリアリはこの勝利で、暫定4位に上がっています。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/13/post1009923/

