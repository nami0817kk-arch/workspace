    image: assets/images/20261025_team_england/e01_kane_pan_w.jpg
    card: none
  - text: ワールドカップの決勝で、初めてのハットトリックでした。
    emph: true
    card: none
  - text: 次は24年後の1990年。西ドイツと1対1、PK戦に3対4で敗れました。
    card:
      <<: *id_histA
      highlight_row: 1
  - text: 3位決定戦もイタリアに1対2の負け。4位に終わりました。
    card:
      <<: *id_histA
      highlight_row: 1
  - text: 2018年は、クロアチアと準決勝。延長の末、1対2の負け。
    card:
      <<: *id_histA
      highlight_row: 2
  - text: このときも3位決定戦はベルギーに0対2の負けで、4位でした。
    image: assets/images/20261025_team_england/e07_bell_gha_w.jpg
    card: none
  - text: 2026年は、アルゼンチンに1対2の負け。
    emph: true
    card:
      <<: *id_histA
      highlight_row: 3
  - text: それでも3位決定戦はフランスに6対4で勝って、3位になりました。
    image: assets/images/20261025_team_england/e03_saka_pan_w.jpg
    card: none
