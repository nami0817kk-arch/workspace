# 代表チーム紹介 イングランド代表（10/25 作成。固定シリーズ9「代表チーム紹介」。見本は 10/24 のフランス代表 scripts/20261024_team_france.md）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **軸（2026-10-25）**：「2026年W杯でイングランドは8試合20得点・3位、60年ぶりのメダル。それでも準決勝で敗れた。何が足りなかったのか」。答えは見立ての節（準決勝の負け方＝先制してから逆転された2018・2026、4大会の1試合の得点と失点）。
# **重なりの確認（2026-10-25）**：scripts/・research/covered.yaml・research/posted.json を grep。イングランド代表の「紹介」回（team_england）は無い。scripts/20261004_england_croatia.md は試合の news で別題。covered.yaml の eng_spa_nations（9/27 スペイン戦）・record_kane（10/6・10/7 ケインの最多出場）は試合・記録のニュースで別題（紹介ものではない）。直近30日にイングランド代表を主役にした紹介ものは無い（10/24 の team_france は3位決定戦の相手として名前が出るだけ）。
# ---- 確かめたこと（2026-10-25。WebFetch の要約は使わず、requests／curl で生の値を読んだ。検索のAI要約は根拠にしていない）----
#  ・FIFAランク：4位（2026-10-07 発表）。Wikipedia の Module:SportsRankings/data/FIFA World Rankings（updated 7 October 2026）＝England 4・前回から変化0。FIFA 公式の記事（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain）は 1スペイン・2アルゼンチン・3フランス・5ポルトガル（2つ上げ）・6ブラジル・7モロッコ・トップ10の出入り無しと書き、4位の国名は書いていない＝Wikipedia の値と矛盾しない。FIFA 公式の国別ページ（inside.fifa.com/fifa-rankings/world-ranking/ENG）は 2026-07-20 時点の 4位。**10月の4位を FIFA の表そのもので見たわけではない**（API は 10月の dateId で空を返した）。点数は書かない。次の発表は11月18日。
#  ・W杯の成績（Wikipedia en の England at the FIFA World Cup の生の表）：出場17回、優勝1回（1966年、自国開催。決勝は西ドイツに延長4-2、ハーストが3点＝W杯の決勝で初めてのハットトリック）、2026年3位（3位決定戦はフランスに6-4。1966年以来の最高成績で、優勝以来初めてのメダル。大会20得点はイングランドの1大会の最多で、フランスと並んで大会最多）、4位 1990・2018。
#  ・準決勝（同じ表の By match。スコアと分は各大会の knockout stage の記事の football box）：1966 ポルトガルに2-1（ボビー・チャールトン2点）／1990 西ドイツと延長1-1、PK戦3-4（ブレーメ60分・リネカー80分）、3位決定戦はイタリアに1-2／2018 クロアチアに延長1-2（トリッピアー5分／ペリシッチ68分・マンジュキッチ109分）、3位決定戦はベルギーに0-2／2026 アルゼンチンに1-2（ゴードン55分／エンソ・フェルナンデス85分・ラウタロ・マルティネス90+2分）。
#  ・2026年W杯の8試合（England at the FIFA World Cup の試合一覧と、ESPN の scoreboard／summary API で日付・スコア・得点者を突き合わせた）：6/17 クロアチア4-2（ケイン12分PK・42分、ベリンガム47分、ラッシュフォード85分）／6/23 ガーナ0-0／6/27 パナマ2-0（ベリンガム62分・ケイン67分）／7/1 ラウンド32 コンゴ民主共和国2-1（ケイン75・86分）／7/5（現地。ESPN は 7/6 01:00Z）ラウンド16 メキシコ3-2（ベリンガム36・38分、ケイン60分PK）／7/11 準々決勝 ノルウェー延長2-1（ベリンガム45+2・93分）／7/15 準決勝 アルゼンチン1-2／7/18 3位決定戦 フランス6-4（ライス3分・コンサ18分・サカ37・45+1・87分PK・ベリンガム90+8分）＝8試合6勝1分1敗・20得点12失点。得点者：ベリンガム7・ケイン6・サカ3・ラッシュフォード・ゴードン・ライス・コンサ各1（en_wc の 2026 の行と一致）。無失点はガーナ戦とパナマ戦の2試合。ノックアウトの5試合はすべて失点（1・2・1・2・4）。
#  ・自分で割った数（検算した。PK戦は除く。延長の得点は含む）：1試合あたり 1966年 得点11÷6=1.83・失点3÷6=0.50／1990年 8÷7=1.14・6÷7=0.86／2018年 12÷7=1.71・8÷7=1.14／2026年 20÷8=2.50・12÷8=1.50（Overall record の表）。準決勝でリードしていた時間：2018年は5分〜68分＝63分、2026年は55分〜85分＝30分。
#  ・EURO：準優勝2回。2020年決勝はイタリアと1-1、PK戦で敗れる（ウェンブリー）。2024年決勝はスペインに1-2（England national football team の本文）。
#  ・監督：トーマス・トゥヘル（ドイツ人）。FA が 2024-10-16 に発表、2025-01-01 から（England national football team の本文と infobox）。
#  ・主将：ハリー・ケイン（infobox・名簿の captain）。所属バイエルン。代表125試合91得点（名簿の注記「Caps and goals are correct as of 6 October 2026」）。最多出場はシルトンと並ぶ125（infobox の Most caps に2人）、得点91は最多（Top scorer）。10/6 のチェコ戦でケインが2点（ESPN）。
#  ・愛称：The Three Lions。連盟：The Football Association（UEFA）。
#  ・名簿・年齢：Wikipedia の Current squad（ネーションズリーグ 9〜10月の22人）と各選手の記事の infobox（いまのクラブ）。生年月日から 2026-10-25 時点で計算：ケイン 1993-07-28=33（バイエルン、FW）、ベリンガム 2003-06-29=23（レアル・マドリード、MF）、サカ 2001-09-05=25（アーセナル、FW）、ゴードン 2001-02-24=25（バルセロナ、2026–。FW）、グエイ 2000-07-13=26（マンチェスター・シティ、2026–。DF）、ピックフォード 1994-03-07=32（エヴァートン、GK）。
#  ・W杯のあと（England national football team results 2020–present と ESPN の scoreboard／summary で日付・スコア・得点者を確認）：ネーションズリーグ 9/26 スペイン2-3（ウェンブリー。ゴードン36分・ケイン40分）／9/29 チェコ2-0（プラハ。ゴードン47分・ケイン69分）／10/3 クロアチア7-0（リエカ。ケイン2・サカ2・ベリンガム・ゴードン・ロジャーズ）／10/6 チェコ3-0（ウェンブリー。オウンゴール・ケイン2）＝4試合3勝1敗・14得点3失点、ケイン6点・ゴードン3点。次は 11/12 クロアチア（ウェンブリー）、11/15 スペイン（マドリード）。
#  ・日本との対戦：日本代表の試合記録（Wikipedia en の Japan national football team results 1990–1999・2000–2009・2010–2019・2020–present の生の表を ENG で拾った）。1995-06-03 ウェンブリー アンブロカップ 1-2／2004-06-01 マンチェスター 親善（FA Summer Tournament）1-1／2010-05-30 グラーツ（オーストリア）親善 1-2／2026-03-31 ウェンブリー 親善（Kirin World Challenge 2026）1-0＝4試合1勝1分2敗・4得点5失点（検算した）。得点者：1995 アンダートン48分・プラット88分PK／井原正巳62分（Umbro Cup の記事の football box。88分のPKは柱谷のハンドで退場のあと）／2004 オーウェン22分／小野伸二53分（England results 2000–2019 の football box）／2010 田中マルクス闘莉王7分／闘莉王72分・中澤佑二83分のオウンゴール（同）／2026 三笘薫23分（jp20 の football box と ESPN）。JFA の年別ページ：2026年「4/1（日本時間）KIRIN WORLD CHALLENGE 2026 ○1-0 イングランド ロンドン／ウェンブリー・スタジアム」、2010年「2010/05/30 国際親善試合 ●1-2 イングランド UPCアレナ」で確認。2004年の JFA ページは 404、1995年は見ていない。**JFA の通算対戦成績は取れていない**ので「1990年以降の記録で4試合」と言い、通算とは言わない。「日本が初勝利」とは言い切らない（「勝利」と書く）。
# ---- 言わないもの ----
#  ・背番号／私生活／怪我（ライスが今回の名簿にいない理由を含む）／監督の契約／戦術の説明／日本戦の通算（JFA 未確認）／クアンサーの退場と処分の騒動／選手を小さく見せる言い方。
