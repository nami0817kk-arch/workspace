title: 9月26日の題材（追加）
lead: 朝7時までの12時間に出た見出しから14件
note: '<b>○×を付けてください。</b>夜のうちに出た話です。午前0時に出した18件（マンC・メッシ・FIFA・ジダン・イタリアを選んだもの）とは別の一覧です。<br><br>

  <b>ジダンとイタリアは取材中</b>（フランスはトルコに1-0でムバッペが負傷交代、イタリアはベルギーに0-2）。ここには入れていません。<br><br>

  中身はまだ<b>見出しだけ</b>です。○が付いたものから記事本文で裏を取ります。ロマーノの X は今も読めません。

  '
