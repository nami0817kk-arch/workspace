  slot: 日本人
  head: 久保建英、ソシエダでベンチが続く。スペイン紙「過去最低の久保」「日本代表での発言は軽率だ」
  why: 'スペイン紙が、ソシエダでの久保の立場を「非常に厳しい」と書き、代表での発言まで批判した、という見出し。

    **久保は日本で一番検索される名前**の一つ。代表での発言が何だったかは、記事で確かめる。

    '
