# 取材メモ（2026年10月27日）アジア杯の日程が確定、日本の初戦は1月11日インドネシア戦。それでも開催は「現時点で簡単じゃない」（宮本会長）。ニュースのショート。見せ方 Y＝宮本会長の一言から始める
# 取材: 2026-10-27。requests（ブラウザUA）で本文を読んだ。検索エンジンのAI要約は事実に使っていない（URL探しにだけ使った）。
#   ・ゲキサカ 2026-10-26 https://web.gekisaka.jp/news/japan/detail/?461878-461878-fl （全文読んだ）:
#       AFCと大会組織委員会が26日、来年1〜2月にサウジアラビアで開くアジアカップの試合日程を発表。キックオフ時間・会場が確定。
#       27年1月7日、リヤドのキング・ファハド・スポーツシティ・スタジアム（7万2000人）でサウジアラビア対パレスチナの開幕戦。
#       24チームのGLは1月20日に終了、2日後にラウンド16。準々決勝1/28・29、準決勝2/1・2、決勝2/5（キング・ファハド）。
#       日本はF組（大会2連覇中のカタール・タイ・インドネシア）。組み合わせは今年5月に決定済み。
#       日本の日程: 01/11 vsインドネシア［ジッダ／プリンス・アブドゥラー］、01/16 vsタイ［リヤド／アルシャバーブ］、01/20 vsカタール［リヤド／キングサウード大学］。
#         キックオフは「19:30KO」と書かれているが、現地時間か日本時間かが本文に無い → 時刻は言わない。
#       リヤドの国際空港がフーシ派の攻撃を受け、多くの死傷者。開催可否は11月中旬にバンコクの理事会で最終決定する方針（23日、田嶋名誉会長）。
#   ・ゲキサカ 2026-10-23 https://web.gekisaka.jp/news/japan/detail/?461641-461641-fl （全文読んだ。宮本会長の言葉はここから）:
#       23日、東京都内のAFC臨時総会のあと、宮本恒靖会長が取材に応じた。
#       「報道で知る限りではやっぱり安全ではない。現時点では開催は簡単じゃないと思っている」
#       「一番は安全面。(延期など)仮定の話はあまりできないので、とにかく安全面のところを大切に考えていきたい」
#       「大会が開催されても、日本が不参加を決めることもあるか」には「この場所ではなかなかお伝えできない。いろんなことを考えて決めないといけないし、安全面は最優先されること」。
#       サウジの幹部と面談：「彼らが一番考えているのは選手、サポーターの皆さん、大会に参加する人たちの安全だと言っていた。…」
#       外務省が22日、リヤド・ジッダ・アルコバールの危険レベルを「2」不要不急の渡航中止から「3」渡航中止勧告に引き上げ。宮本会長は「大切な一つの判断材料」。
#       リヤドには大会最多の5会場。AFCのサルマン会長は、サウジ開催が難しい場合、代替地ではなく1年延期の可能性も示唆。森保監督はアジア杯までが任期。
#   ・ゲキサカ 2026-10-23 https://web.gekisaka.jp/news/japan/detail/?461634-461634-fl （田嶋名誉会長。背景の確認だけ。台本には出さない）
#   ・フットボールゾーン（23日、題材の一覧に出ていた記事）は URL を見つけられず読んでいない → 言葉はゲキサカの書き起こしで引く（「最優先は安全面です」の形は使わない）。
# 自分で数えたこと: 10月27日 → 1月11日 は 76日。11月中旬（15日として）→ 開幕1月7日 は 53日（「50日ほど」と言う）。日本の3試合のうち2試合がリヤド。
# 【言わないこと】媒体名／キックオフの時刻（現地か日本か不明）／田嶋名誉会長の言葉（今回の主役は宮本会長）／「日本が不参加」の推測（会長は答えていない）／死傷者の数（本文に無い）。
