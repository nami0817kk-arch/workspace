  - text: 日本時間の7日朝、ブエノスアイレスのモヌメンタル競技場。
    image: assets/images/20261007_messi_farewell/01_w.jpg
    card: none
  - text: 前半10分、審判が試合を止め、満員のスタンドが拍手を送りました。
    card: none
  - text: ただ前半は、メッシのシュートが何度も阻まれ、点が入らないまま折り返します。
    image: assets/images/20261007_messi_farewell/03_w.jpg
    card: none
  - text: スカローニ監督は、前半の硬さをこう話しています。
    image: assets/images/20261007_messi_farewell/pair_scaloni/01.jpg
    card: none
  - voice: スカローニ監督
    text: 仲間たちも緊張していて、
    image: assets/images/20261007_messi_farewell/pair_scaloni/01.jpg
    card: none
  - voice: スカローニ監督
    text: どのプレーを選べばいいか分からなかった。
    cont: true
    image: assets/images/20261007_messi_farewell/pair_scaloni/01.jpg
    card: none
  - text: 試合が動いたのは、後半の立ち上がり。
    image: assets/images/20261007_messi_farewell/03_w.jpg
    card:
      type: table
