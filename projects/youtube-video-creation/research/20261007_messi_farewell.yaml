- id: message
  main: true
  heading: 去り際に残した「つらい時期」の言葉
  tier: 報道
  telop: メッシ「つらい時期は、きっと来る。そのときこそ支えないといけない」
  narrator: キャスター
  say:
  - text: アルゼンチン代表を引退するメッシが、最後の試合のあとマイクを握りました。
    short_only: true
    image: assets/images/20261007_messi_farewell/02_w.jpg
  - text: そして最後に、こう続けました。
    image: assets/images/20261007_messi_farewell/02_w.jpg
  - voice: メッシ
    text: つらい時期は、きっと来る。
  - voice: メッシ
    text: この何年かでやってきたことは、普通じゃないからだ。
    cont: true
  - voice: メッシ
    text: そういうときこそ、僕らが今まで以上に支えないといけない。
    cont: true
  - voice: メッシ
    text: 大きな目標には、強くて、まとまったグループが要る。
    cont: true
  - text: 言葉だけではありません。この夜、メッシはピッチでも次の世代にボールを渡しました。
    image: assets/images/20261007_messi_farewell/03_w.jpg
  - text: 2つ目のアシストの相手は、ニコ・パスです。
  - text: ニコ・パスの代表デビューは2年前、同じモヌメンタル。
  - text: その試合で、メッシのゴールをアシストしていました。
  - text: あの日もらったパスを、メッシは最後の夜に返したのです。
  quotes_from:
  - TyC Sports https://www.tycsports.com/seleccion-argentina/seleccion-argentina-lionel-messi-discurso-despedida-amistoso-benin-id764663.html
