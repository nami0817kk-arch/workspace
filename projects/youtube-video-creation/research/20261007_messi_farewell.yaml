  - text: 左足でゴールの上隅へ。7月のワールドカップ以来、3か月ぶりの代表126点目です。
    card:
      type: table
      title: ベナン戦の3点（10月6日・モヌメンタル）
      columns: [時間, 得点, メッシ]
      rows: *goals
      highlight_row: 2
