- id: words
  heading: スピーチの最初は父のこと
  tier: 報道
  telop: メッシ「まず思い浮かぶのは、親父のことだ」
  narrator: キャスター
  say:
  - text: 試合のあと、ピッチの真ん中に立ったメッシ。最初に口にしたのは、父のことでした。
    image: assets/images/20261007_messi_farewell/02_w.jpg
  - voice: メッシ
    text: 今日は、何かを言うのが難しい。いろんな思いが押し寄せてくる。
  - voice: メッシ
    text: まず思い浮かぶのは、親父のことだ。
    cont: true
  - text: 父のホルヘさんは8月8日に、68歳で亡くなっています。
  - text: メッシが代表からの引退を発表したのは、その23日後でした。
  - voice: メッシ
    text: もうここに来られないのは、本当につらい。
  - voice: メッシ
    text: 代表でプレーするのは、いちばん素敵なことだから。
    cont: true
  - voice: メッシ
    text: 今日はきっと、キャリアでいちばん悲しい日だ。
  - voice: メッシ
    text: でもこれからは、そっち側で、みんなと一緒に、
    cont: true
  - voice: メッシ
    text: この子たちを支えていく。
    cont: true
  quotes_from:
  - TyC Sports https://www.tycsports.com/seleccion-argentina/seleccion-argentina-lionel-messi-discurso-despedida-amistoso-benin-id764663.html
  sources:
