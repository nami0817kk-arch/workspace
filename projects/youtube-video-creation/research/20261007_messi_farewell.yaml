  takeaway: メッシは代表最後の試合で3点すべてに絡み、2本目のアシストは2年前のデビュー戦で自分にアシストしたニコ・パスへ渡った。21年を時期で割ると、1試合あたりの得点は最初の6年の0.28に対して最後の4年は0.78で、21年でいちばん高い。ワールドカップの21点のうち15点は最後の2大会。点を取り続けている時期に代表を離れ、最後のスピーチでは「つらい時期は必ず来る。そのときこそ支えてほしい」と、次の世代への言葉を残した
