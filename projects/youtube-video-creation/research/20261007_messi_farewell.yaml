  - text: メッシのコーナーキックを、オタメンディが押し込みます。
    card:
      type: table
      title: ベナン戦の3点（10月6日・モヌメンタル）
      columns: [時間, 得点, メッシ]
      rows: *goals
      highlight_row: 0
  - text: 後半16分、メッシのパスを、入ったばかりのニコ・パスが左足で決めます。
    card:
      type: table
      title: ベナン戦の3点（10月6日・モヌメンタル）
      columns: [時間, 得点, メッシ]
      rows: *goals
      highlight_row: 1
  - text: そして後半26分、メッシがペナルティーキックを蹴ります。
    card:
