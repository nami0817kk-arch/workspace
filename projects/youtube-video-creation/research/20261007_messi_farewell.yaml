# 取材メモ（10/7 題材 messi_farewell、型は news。本人の言葉を厚めに）。材料の控え: research/raw/20261007_messi_farewell.md
# 9/30 の「メッシの10番をどうするか」（20260930b_messi_farewell）と重ねない: 10番の扱い・タピア会長の発表・「2位の2倍」の比べは言わない。
# 10/4 の「ヤマルとメッシを同じ19歳で」とも重ねない: 19歳の数字・バルサの話は入れない。
# 事実の裏:
#   スコアと得点: ESPN の試合データ（event 401921408）。オタメンディは ESPN 48'・TyC 47'・La Nación「後半2分」で割れるので「後半の立ち上がり」。
#   パス 61'（59' に入って2分。Clarín「apenas necesitó 120 segundos」）、メッシ PK 71'（La Nación「A los 26 minutos」）。
#   メッシは交代なしの90分（ESPN の名簿に subbedOut 無し）。10分の拍手・前半の決定機3度・審判がボールを手渡し: La Nación。8万5000人: Infobae。
#   126点目は 7/7 W杯エジプト戦の125点目以来（英語版 Wikipedia の得点一覧）。
#   パスの代表デビュー 2024-10-15 モヌメンタルのボリビア戦でメッシにアシスト（英語版 Wikipedia「Nico Paz」・メッシの得点一覧）。
#   スピーチ: TyC Sports の全文起こし（Infobae・La Nación・Clarín と突き合わせ）。父ホルヘさん 8/8 に68歳で死去（Infobae・La Nación・Wikipedia）、代表引退の発表 8/31。
#   監督: Infobae の会見記事。
#   時期ごとの表とW杯の表は、英語版 Wikipedia の年別表と RSSSF の1試合ずつの表から自分で足した（208試合126点で一致）。ロナウドのW杯27試合は Olé。
# 前日の「きっと恋しくなる特別な瞬間」（サッカーキング・ゲキサカ 10/6）は、題の出来事より前の言葉なので入れない。
# 反応: X の個人2件（Yahoo!リアルタイム検索 → fxtwitter で全文）、Mastodon の個人1件（スペイン語を訳した）。
# 写真: La Nación の速報の自社カメラマン（Aníbal Greco - LA NACION）3枚。代理店（AFP・REUTERS・AP・Getty）は取り込んでいない。
#   監督の行は 9/30 に使った Commons のスカローニ（Bryan Berlin）と今回の 01 を並べた pair_scaloni。
#   見立ての節は Commons の W杯エジプト戦 -245（Bryan Berlin、CC BY-SA。9/30 の -226 とは別の1枚）を左を空けて切った wc/01（表が顔にかからない）。
