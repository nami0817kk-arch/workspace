# 食い違い: なし（遠藤保仁の672試合・西川の673試合は記事のみ。J1全体の通算数は ESPN では確かめられないので、台本は記事の記述として扱い、「歴代単独トップ」の数字は出典どおり）。
# 前の本との重なり: 鈴木彩艶の回（20261107_suzuki_best_save_nominee・20261108_suzuki_liverpool_candidate・20261111_suzuki_yui_freiburg など）はいずれも別の内容（ヴィラでの活躍・唯人の移籍）。西川の記録は scripts・covered.yaml に無い（grep 済み）。
