#   ・ESPN（jpn.1 summary event=401877554）: 2026-11-08 05:00 UTC（日本時間 14:00）、ヴィッセル神戸 2-2 浦和レッズ。西川周作は先発（rosters の starter=True）。記事の「第14節・神戸戦」と一致。
#   ・鈴木は浦和の公式SNSでも祝福していたが、改めて問われて答えた（サッカーキング。代表活動での取材）。鈴木の言葉（原文。字は変えていない。台本は読点で行に分けた）:
#       「もう素晴らしいの一言ですね。彼のメンタリティ、マインドセットの素晴らしさは知っていますし、そういった影響もあって感情をコントロールしながら、メンタリティを保ちながらできていると思います。常に尊敬する選手であり続けるなと思います」
#       「（鈴木の）ゲームも見てくれているみたいです。コミュニケーションは取っています」（括弧は記者の補足。台本は「ゲームも見てくれているみたいです」「コミュニケーションは取っています」に分けて引く）
#   ・サッカーキングの地の文: 鈴木は2023年に浦和からシント・トロイデンへ移り、パルマ・カルチョ、アストン・ヴィラと着実にステップアップ。海外へ渡って約3年たっても、2人の師弟関係は続いている。浦和時代の先輩・後輩。
#   ・サッカーキング 2225629（11/8）: 西川は40歳（今年6月）、大分の下部組織出身、2005年7月の横浜FM戦でJ1初出場、2010年広島、2014年から浦和。プロ22年目。会場は国立競技場（MUFGスタジアム）。
