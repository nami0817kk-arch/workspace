      <<: *japan_card
      highlight_row: 0
  - text: ブラジルは、自陣でパスを回して、攻め筋を探っていました。
    card: none
  - text: 佐野は、センターサークルの近くで間合いを詰め、横パスを読んでカット。
    image: assets/images/20261113_player_643574/02_w.jpg
    card: none
    emph: true
  - text: そのままボールを運んで、ペナルティエリアの外から、右足でゴール左下へ。
    card:
      <<: *japan_card
      highlight_row: 0
  - text: 運んでいるあいだ、最初に考えていたのは、上田綺世へのパスでした。
    image: assets/images/20261113_player_643574/01_w.jpg
    card: none
  - text: けれども、ブラジルのセンターバックが、上田の動きを警戒して、寄せるのをやめた。
    card: none
  - text: それで、シュートに変えたそうです。
    card: none
  - text: 日本は後半に2点を許し、ブラジルの2対1の勝ち。
    image: assets/images/20261113_player_643574/08_w.jpg
    card:
      <<: *japan_card
      highlight_row: 2
  - text: A代表で、佐野の最初のゴールでした。
    image: assets/images/20261113_player_643574/08_w.jpg
    card:
      <<: *japan_card
      highlight_row: 2
