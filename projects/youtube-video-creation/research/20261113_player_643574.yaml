# 佐野海舟（マインツ／日本代表）の紹介。選手紹介の8節の型（2026-11-13 公開分、シリーズ「有名選手の紹介」。key: player_643574）。情報の時点は 2026-11-11（クラブの試合は 11/7 のマインツ対バイエルン戦まで）。
# **FotMob は使わない。**数字は Transfermarkt API の試合記録（控え research/raw/20261113_sano_tm.json）、英語版・日本語版 Wikipedia（控え research/raw/20261113_sano_wiki_*.wikitext）、自分で数えたもの。
# **選んだ理由・重なり確認（2026-11-11）**：player_pool.py list で紹介を出していない上位は 26 ヌメチャ・30 カマラ・32 佐野海舟・33 ファン・ヘッケ。11/14 に日本代表がブラジルと再戦する（11/4 の指示書・JFA 発表）ので、日本代表・W杯に絡む話（ヒットの条件）の佐野を推した。
#   外した候補：ヌメチャ（11/7 のシュロッターベックと同じドルトムント。日本との縁が無い）／カマラ（今季13試合2点で題が弱い）。
#   重なり：紹介は 0 件（scripts/ を「佐野海舟」で grep）。ただしニュースが 10/28（SDの話）・11/8（バイエルン戦）・11/11（ブラジル再戦の本人の言葉）と直近3本ある。
#   → 11/11 のニュースが使った本人の言葉（「そのゴールで知ってくれるのは嬉しい」）・途中交代の数え方（10/28）は使わない。W杯のゴールは「どう奪ったか」（Number の7月のインタビュー）に絞る。
# **現役・今季もブンデス1部**：TM の試合記録で 2026-11-07 のブンデスリーガ第9節（マインツ 1-2 バイエルン）まで先発90分。英語版 Wikipedia も current club = Mainz 05・背番号6。
# **数字の軸**：通算（TM と英語版 Wikipedia の年別表。11/7 まで）：町田（2019〜22）119試合8点（英語版 Wikipedia の年別 0・1・6・1）／鹿島（2023〜24）58試合1点／マインツ（2024〜）TM で 36＋48＋11＝95試合2点／日本代表19試合1点（英語版 Wikipedia、10/5 まで。その後は未出場）→ 291試合12点。
#   マインツの内訳（TM）：24/25 36試合0点、25/26 48試合2点（9/20 ブンデス、4/9 カンファレンスL）、26/27 11試合0点。英語版 Wikipedia（10/30 まで）は 36＋47＋10＝93。TM は予選2試合を数えるので差が出る。台本は TM の 95 を使い、「11月7日まで」と添える。
#   市場価値（TM）：2019-06 2.5万ユーロ（町田）→ 2024-06 150万（鹿島）→ 2025-03 1700万 → 2025-06 2000万 → 2026-05 4000万 → 2026-07 5000万（最高）→ 2026-10 4000万（いま）。5000÷150＝33.3 で「およそ33倍」。
# **ブンデス1年目（24/25）の数字**：ドイツ誌 kicker の集計を Goal.com 日本版（2025-05-26）が紹介：走行距離 394km（リーグトップ）・デュエル勝利 209回（最多）・インターセプト 65回（最多）・スプリント 764回（最多）・空中戦勝利 162回（3位）・最高時速 34.42km（3位）・イエロー 3枚。台本は媒体名を出さない。
# **名前・幼少期**：ゲキサカ 2019-01-17（名は父が好きな勝海舟に由来、中学で回収に特化）／Number Web 2023-11-24（最初は「龍馬」の予定、祖父の言葉で勝海舟、下駄、父の理由、米子北の恩師の言葉）。
# **マインツの獲得の経緯**：ハイデルSD（Bild 取材。theWORLD 2025-05-22 が伝えた）「ある代理人が別のフォワードを推してきていた。それで私は試合のビデオを見たのだが、その時すぐにカイシュウのことが気になった」。
# **ブラジル戦（2026-06-29、ヒューストンの NRG スタジアム）**：ESPN の試合データ（11/11 取材の控え 20261111_sano_brazil_rematch.yaml に記録済み）で 29分 佐野（枠の外から右足、ゴール左下）／56分 カゼミーロ／90+5分 ブラジルの勝ち越し（英語版 Wikipedia の引用元の見出しでマルティネッリ）。ブラジル 2-1 日本。
#   Number Web 2026-07-23（ミムラユウスケ。W杯直後の単独インタビュー）：ダニーロの横パスを読んでカット。当初は上田綺世へのパスを考えていたが、ブラジルのCB2人が上田の動きを警戒して寄せを緩めたのでシュートに変えた。本人の言葉は 2〜3ページ目から原文のまま。
#   W杯の佐野（TM）：6/14 オランダ戦（2-2）90分先発、6/21 チュニジア戦（4-0）90分先発でアシスト1、6/25 は出場なし（ベンチ入り）、6/29 ブラジル戦 90分先発で1得点。
# **入れなかったもの**：2024年夏から2025年春の代表の話（私生活・法的な問題は入れない決まり）、結婚、身長以外の私的な事情、10/28 の途中交代の話（直近のニュースと重なる）、「エンゴロ・カンテが理想」（出典の本文が読めなかった）、J2の「ボール奪取回数1位」（元のサイトを開けていない）。
