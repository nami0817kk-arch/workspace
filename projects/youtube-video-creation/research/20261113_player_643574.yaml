- id: origin
  heading: 「海舟」という名前と、下駄で走った少年時代には、どんな理由があったのか
  tier: 背景
  telop: 名前の由来と、下駄
  narrator: 解説
  say:
  - text: 海舟という名前は、幕末の偉人、勝海舟から来ています。
    image: assets/images/20261113_player_643574/08_w.jpg
    card: none
  - text: 父は最初、坂本龍馬にちなんで「龍馬」とつけるつもりでした。
    card: none
  - text: ところが祖父が、短命で終わった偉人より、長い人生を送ってほしいと言った。
    image: assets/images/20261113_player_643574/02_w.jpg
    card: none
  - text: そこで、龍馬の師匠だった勝海舟の名前になったそうです。
    card: none
  - text: 津山市で生まれた佐野は、小さいころ、運動靴ではなく下駄で走り回っていました。
    image: assets/images/20261113_player_643574/01_w.jpg
    card: none
    emph: true
  - text: 父の考えで、足を正しくつく感覚を、体に覚えさせるためでした。
    card: none
  - text: 高校の恩師は、佐野の足の裏を初めて見て、その分厚さに驚いたといいます。
    image: assets/images/20261113_player_643574/04_w.jpg
    card: none
  quotes_from: []
  sources:
  - https://number.bunshun.jp/articles/-/859681
  - https://web.gekisaka.jp/news/jleague/detail/?264398-264398-fl
