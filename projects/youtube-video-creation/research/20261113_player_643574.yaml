  say:
  - text: 中学のころの佐野は、あまり目立つタイプではなかったと話しています。
    image: assets/images/20261113_player_643574/01_w.jpg
    card:
      <<: *career_card
      focus: '2007'
  - text: そこでプレーを見直し、セカンドボールの回収と、インターセプトに絞りました。
    card:
      <<: *career_card
      focus: '2007'
  - text: 進んだのは山陰の名門、米子北高校。そこから二部のFC町田ゼルビアへ。
    image: assets/images/20261113_player_643574/08_w.jpg
    card:
      <<: *career_card
      focus: '2019'
  - text: 2023年に鹿島アントラーズへ移り、J1で27試合に出ました。
    card:
      <<: *career_card
      focus: '2023'
  - text: そして2024年の7月、ドイツのマインツへ。4年契約でした。
    image: assets/images/20261113_player_643574/02_w.jpg
    card:
      <<: *career_card
      focus: '2024'
    emph: true
  - text: マインツが佐野を見つけたきっかけは、別の選手のビデオでした。
    image: assets/images/20261113_player_643574/04_w.jpg
    card: none
  - text: マインツのスポーツディレクター、ハイデルは、こう振り返っています。
    card: none
  - text: 代理人が、別のフォワードを売り込んできた。
    image: assets/images/20261113_player_643574/08_w.jpg
    card: none
  - text: ところが、その試合の映像を見ると、すぐに佐野のことが気になった。
    card: none
  - text: スカウトに分析させたら、全員が魅了されていた、と。
    card: none
