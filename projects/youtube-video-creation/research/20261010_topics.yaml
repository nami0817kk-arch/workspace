title: 10月10日の題材
lead: 候補663件と昨夜の試合4つ、ロマーノの投稿から31件
note: "\n  <b>ロマーノを読みました（10/10 朝）。今日は移籍の話がほとんど無く、会見の言葉ばかりです。</b>\n  そのかわり<b>マンチェスター・シティの判決に各クラブの監督が何を言ったか</b>がほぼ全員ぶん揃っていました（㉒〜㉖）。\n  <b>日本人選手の投稿は1件もありませんでした。</b><br><br>\n  <b>いま ○ は6件</b>（①②⑤⑧⑪⑲）。<b>ショート10本に4件足りません。</b>㉒〜㉛から足してください。<br>\n\
  \  <b>⑤と⑪はどちらもキャリック</b>です。2本に割ると「続けて見ると繰り返しに感じる」に当たるので、\n  <b>1本にまとめる</b>か、どちらかを落とすのが良いと思います。<br>\n  ロマーノの投稿は<b>移籍情報の記者による投稿</b>として扱い、クラブ公式の発表とは混ぜません。\n"
