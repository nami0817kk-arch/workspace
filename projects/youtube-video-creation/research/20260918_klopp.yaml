# クロップが呼んだ44人と、その使い方（2026-09-18）
#
# **人数そのものではなく、使い方が山場。**44人を2つに割って、
# 最初の2試合を24人で戦い、終わったら大半が帰って20人が入れ替わる。
# ネーションズリーグは試合ごとに23人を出せばよいので、これが成り立つ。
#
# 引きは**「44人を呼んで、全員を同時には使わない」**。ここが @main。
#
# **W杯の敗退ラウンドには触れない。**ゲキサカは「ラウンド16」、
# ESPN は "round-of-32"（パラグアイにPK負け）と書いていて、**同じ試合なのに
# 食い違っている**。確かめられないので「敗退」までにする。
#
# **クロップの発言は全部が英訳経由**（ESPN が DW.com / Bundesliga.com から引いている）。
# ドイツ語の原文は手元に無いので、**原文のまま**とは言わない。
#
# **初招集11人のうち、ゲキサカが名指ししているのは6人だけ。**
# 残り5人は一覧の印から拾ったもの。画面に出すのは名指しされた6人にとどめる。
#
# **自分のチャンネルの過去回には触れない。**日本代表31人は事実として並べるだけで、
# 「昨日お伝えした」とは言わない
format: news
voice_min: 25
