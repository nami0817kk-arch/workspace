sections:
  - id: announce
    heading: 何が発表されたか
    tier: 報道
    telop: ドイツサッカー連盟が17日、44人を発表
    narrator: キャスター
    card:
      type: table
      title: 4試合の日程
      columns: ["", ""]
      rows:
        - ["9月24日", "オランダ戦（アウェー）"]
        - ["9月27日", "ギリシャ戦（ホーム）"]
        - ["10月1日", "セルビア戦（ホーム）"]
        - ["10月4日", "ギリシャ戦（アウェー）"]
    say:
      - ドイツサッカー連盟が17日、**ネーションズリーグ**に臨む代表メンバーを発表しました。
      - 選ばれたのは**44人**。連盟の発表は、いつもの形ではありませんでした。
      - クロップにとっては、代表監督としての初陣です。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?459035-459035-fl

  - id: how
    heading: 44人をどう使うのか
    tier: 報道
    telop: 24人で2試合を戦い、そこで20人が入れ替わる
    narrator: 解説
    card:
      type: table
      title: 44人の割り方
      columns: ["", ""]
      rows:
        - ["最初の2試合", "24人"]
        - ["後半の2試合", "20人が加わる"]
        - ["1試合に出せる", "23人"]
    say:
      - "**44人を、同時には使いません。**"
      - 本人は、会見でこう説明しました。
      - {voice: クロップ, text: できるだけ多くの選手を知りたい}
      - {voice: クロップ, text: AチームもBチームもない}
      - {voice: クロップ, text: スコッドは、ピッチの上でも、人間性と経験の面でも筋が通るように組んだ}
      - 最初の2試合を戦うのは**24人**。その2試合が終わった時点で、**20人が加わります**。
      - ネーションズリーグは、各試合の前日までに**23人**のリストを出せばよいためです。
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?459035-459035-fl
      - https://www.espn.com/soccer/story/_/id/49962961/jurgen-klopp-names-two-squads-44-players-first-games-germany-manager

  - id: newcomers
    heading: 初めて呼ばれた人たち
    main: true
    tier: 報道
    telop: 11人が初招集。トップリーグで数試合しか出ていない選手もいる
    narrator: キャスター
    # **選手を何人も挙げる節は表で出す**（2026-09-18 ユーザー指示）。
    # 所属・名前・ポジション・年齢の4列。名前だけ並べても
    # 「どこの誰で、何歳の、どの位置の選手か」が残らない。
    # **年齢は生年月日から計算した**（記事の「◯歳」はいつ時点か分からない）。
    # 6人とも所属クラブの公式サイトで生年月日を確かめてある
    card:
      type: table
      title: 初招集（オランダ戦・ギリシャ戦の名簿から）
      columns: ["所属", "名前", "位置", "年齢"]
      rows:
        - ["フランクフルト", "エブヌタリブ", "FW", "23"]
        - ["ホッフェンハイム", "コンテ", "MF", "23"]
        - ["フライブルク", "エンゲルハルト", "MF", "25"]
        - ["フライブルク", "ローゼンフェルダー", "DF", "23"]
        - ["フライブルク", "トロイ", "DF", "25"]
        - ["アウクスブルク", "ベーレンス", "DF", "21"]
    say:
      - {short_only: true, text: クロップ体制で初めてのドイツ代表メンバーが発表されました。44人が呼ばれています。}
      - 選んだ本人は、こう言っています。
      - {voice: クロップ, text: 驚かせることになる選手が何人かいるが、我々は彼らに何かを見ていて、その成長に寄り添いたい}
      - はじめて呼ばれたのは11人。まず、オランダ戦とギリシャ戦の名簿に入った6人です。
      - フランクフルトの**ユネス・エブヌタリブ**、23歳のフォワード。5日前に誕生日を迎えたばかりです。
      - ホッフェンハイムの**バンバセ・コンテ**、23歳のミッドフィールダー。
      - フライブルクからは3人。25歳のミッドフィールダー**ヤニク・エンゲルハルト**。
      - センターバックの**マックス・ローゼンフェルダー**が23歳、サイドバックの**フィリップ・トロイ**が25歳。
      - そしてアウクスブルクの**ヘネス・ベーレンス**。**21歳**の左サイドバックで、この6人ではいちばん若い。
      - "**トップリーグでほんの数試合しか出ていない**選手もいます。"
    official: false
    sources:
      - https://web.gekisaka.jp/news/world/detail/?459035-459035-fl
      - https://www.espn.com/soccer/story/_/id/49962961/jurgen-klopp-names-two-squads-44-players-first-games-germany-manager

  - id: out
    heading: 入らなかった人たち
    tier: 報道
    telop: ウンダフとサネが外れ、ゴールはテア・シュテーゲンに
    narrator: 解説
    say:
      - 44人も呼んで、なお入らなかった名前もあります。
      - ワールドカップで3得点の**デニズ・ウンダフ**と、代表80試合の**レロイ・サネ**が外れました。
      - ゴールマウスは、マヌエル・ノイアーの引退を受けて**テア・シュテーゲン**が背負います。
      - {voice: クロップ, text: マルク・アンドレのことは長く知っている。経験の量がちょうどいい}
      - {voice: クロップ, text: ボールを扱えるGKであり、シュートストップも優秀だ}
      - 同じ時期の日本代表は31人、初招集は4人でした。
    official: false
    sources:
      - https://www.espn.com/soccer/story/_/id/49962961/jurgen-klopp-names-two-squads-44-players-first-games-germany-manager
      - https://web.gekisaka.jp/news/world/detail/?459035-459035-fl

  - id: voices
