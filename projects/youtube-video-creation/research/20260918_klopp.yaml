      - {voice: 海外のファン, text: クロップに関しては、例の理由でもうかなり色眼鏡で見てしまっている。でも今回は文句のつけどころがない}
      - {voice: 海外のファン, text: ウンダフを考慮しないのは完全に言語道断だ。ウンダフは今季ここまで公式戦4点関与}
      - {voice: 海外のファン, text: バウマンの扱われ方は少し悲しい。好セーブでW杯に連れて行ってくれたのに、今度は招集すらされない}
