# 遠藤航が、出られなかったワールドカップについて語った（2026年9月12日）
#
# **出どころはテレビ番組。**テレビ東京系「サッカー遠藤航『まだ見ぬ世界へ』
# 未来をつくる子どもたち～」（9月12日放送）を、スポニチアネックスが伝えたもの。
# **番組の中の言葉であることを必ず言う。**会見の発言ではない。
#
# 引きは**「キャプテンでもあったので」**。出られなかった事実より、
# **主将だった人が、その立場ごと失ったこと**が芯。ここが山場（@main）。
#
# **けがの程度をこちらで診断しない。**「2月に左足を負傷し、甲の靱帯手術」
# 以上のことは書かない。
#
# **代表引退の理由を推測しない。**記事は経緯を並べているだけで、
# 「けがが理由で引退した」とは書いていない。**順番をそのまま置く。**
#
# **本人を気の毒がる書き方にしない。**本人が「それが現実」と言い切っているので、
# その言葉のままで終わる
format: quote
# **引ける発言が3つの回。**番組の一部なので、その分だけ下げる
voice_min: 25
slot: japan
date: "2026年9月12日"

people:
  - 遠藤航

short_title: "遠藤航がW杯を振り返る"

theme:
  id: endo_worldcup
  league: england
  kind: other
  topic: リヴァプール
  title: 日本代表キャプテン遠藤航、ワールドカップを振り返る
  hook: 代表メンバーには選ばれていました。現地に入ったあとで、チームを離れます。
  question: 主将だった人は、何を失ったのか

thumbnail:
