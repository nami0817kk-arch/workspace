sections:
  - id: what
    heading: 何が起きていたのか
    tier: 報道
    telop: 選ばれてから、離脱まで
    narrator: キャスター
    card:
      type: table
      title: 2026年の遠藤航
      columns: ["", ""]
      rows:
        - ["2月", "リーグ戦で左足を負傷。甲の靱帯を手術"]
        - ["5月", "アイスランド戦で実戦復帰"]
        - ["W杯", "メンバーに選ばれ、現地入り後に離脱"]
        - ["その後", "代表引退を表明"]
    say:
      - 遠藤航が、ワールドカップについて語りました。
      - 今年2月、リーグ戦で左足を負傷し、甲の靱帯を手術しています。
      - 5月のアイスランド戦で実戦に戻り、代表メンバーにも選ばれました。
      - ただ、現地に入ったあとでチームを離れます。そしてその後、代表からの引退を表明しました。
    official: false
    sources:
      - https://news.yahoo.co.jp/articles/0ce363d094fc9e6da0861ec4717dd19990648620
      - https://www.footballchannel.jp/2026/08/10/post974145/

  - id: words
    heading: 本人が語ったこと
    main: true
    tier: 報道
    telop: 「キャプテンでもあったので」
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 出られなかった事実ではなく、**主将だった人がその立場ごと失ったこと**が芯
    card:
      type: quote
      title: 遠藤航
      text: 自分は日本代表のキャプテンでもあったので、本当に出たかった
    say:
      - 9月12日に放送されたテレビ東京系の番組で、本人がこう話しています。
      - {voice: 遠藤航, text: 全ての選手がワールドカップでプレーしたいはずです}
      - {voice: 遠藤航, text: 自分は日本代表のキャプテンでもあったので、本当に出たかった}
      - そのうえで、こう続けました。
      - {voice: 遠藤航, text: でもそれが現実で、自分には何もできなかった}
      # **ショートは山場の節だけを切り出すので、引退まで入れる**
      # （2026-09-12 ユーザー「ショートの最後に、代表引退したことまでつけて」）
      - そしてこのあと、遠藤は日本代表からの引退を表明しました。
    official: false
    sources:
      - https://news.yahoo.co.jp/articles/0ce363d094fc9e6da0861ec4717dd19990648620
      - https://www.footballchannel.jp/2026/08/10/post974145/

  - id: back
    heading: リヴァプールでの、いま
    tier: 報道
    telop: 8月9日にセンターバックで復帰
    narrator: キャスター
    say:
      - 33歳。2023年の夏に、シュツットガルトから加入した選手です。
      - 昨シーズンは、けがの影響もあって公式戦12試合にとどまりました。
      - 実戦に戻ったのは8月9日。アンフィールドでのプレシーズン、モナコ戦です。
      - 後半の45分間、本職のボランチではなく、センターバックで出ました。組んだ相手はファン・ダイクです。
      - 現地の評価は、こうでした。
      - {voice: This Is Anfield, text: 即座にインパクトを与えた}
      - {voice: Anfield Index, text: 時折心配な場面はあったものの、競争力があり頼もしかった}
      - {voice: Rousing The Kop, text: センターバックで安定したプレーを見せた}
      - 採点はどちらも5点。復帰後の練習については、こう話しています。
      - {voice: 遠藤航, text: きついですけど、懐かしい感覚というか、これを求めていたというか}
    official: false
    sources:
      - https://news.yahoo.co.jp/articles/0ce363d094fc9e6da0861ec4717dd19990648620
      - https://www.footballchannel.jp/2026/08/10/post974145/
