# 取材メモ（10/11 土、シリーズ「比べる」、key: compare_malen_lautaro、型は news）。
# 材料の控えは research/raw/20261011_compare_malen_lautaro.md。**この控えの外へ出ていない。**
#
# **「比べる」の3つ（選手／クラブ／同じ年齢）のうち「選手」で組んだ。**人選は市場価値の一覧
#   （`player_pool.py list --count 31`）の14位ラウタロ・28位マレンで、どちらもセンターフォワード。
#   軸は「セリエAの得点ランキングで1位と2位に並ぶ2人を、得点ではなくシュートの中身で並べ直す」こと。
#   山場の頭に置く強い一点は、**3週間前（9月19日）の ローマ対インテル に2人とも先発していた**こと。
#   その試合でラウタロが2点、マレンは0点。それでも得点の順番は動いていない。
#
# **重なりの確認（直近30日、research/posted.json の題と research/covered.yaml を人名・クラブ名で引いた）**:
#   ローマ 0件／マレン 0件／ラウタロ 0件（最後は 2026-09-07 の inter_napoli ＝34日前で窓の外）。
#   **インテルだけ1件**（2026-09-15 inter_udinese_comeback「インテルが0対2から」。主役はバレッラで、
#   ラウタロもマレンも出てこない）。**ユーザーに報告して、外すかどうかは判断してもらう。**
#   同じ日の他の枠（マンC・ヴィラ・ハルシティ・バイエルン・ヘタフェ・アーセナル）とは重ならない。
#   PSG の選手は使っていない（10/9 ネイマール・10/10 PSG の財政と3日続きにしない）。
# **10/9 の「ベリンガム×ムシアラ」と型を重ねない**ようにした:
#   ・「生後◯日でそろえる」という切り口は**使っていない**（2日前に使ったばかり）
#   ・題の形も変えた（10/9 は「AとBを同じ日数で並べる。2人がそろって出ていた試合」）
#   ・怪我の一覧・年表（timeline）・市場価値の線も使っていない（線は**節ごとの得点の積み上がり**にした）
#
# **数字はすべて自分で数えた。**Transfermarkt の1試合ずつの記録（tmapi の performance-game、season=2026）を足したもの。
#   **クラブの公式戦だけ**（代表戦 isNationalGame と親善試合 FS は除く）。基準は **2026年10月11日の朝**＝セリエA第5節まで。
#   マレン: 6試合6先発 432分 6得点 1アシスト、シュート24本・枠内10本（セリエA5試合345分6点／CL1試合87分1アシスト）
#   ラウタロ: 出場5試合5先発 414分 4得点 1アシスト、シュート26本・枠内7本（第4節はベンチで出番なし。セリエA4試合324分4点）
#   自分で割った数: 6×90÷432＝1.25／4×90÷414＝0.8696（0.87）／1.25÷0.87＝1.44倍／
#     10÷24＝41.7%／7÷26＝26.9%／41.7−26.9＝14.8ポイント（小数から引くと14.7。**台本は14.7**）／
#     6÷10＝0.60／4÷7＝0.571（0.57）／24÷6＝4.0本／26÷4＝6.5本／432÷6＝72.0分／414÷5＝82.8分／
#     8500万÷5500万＝1.545（約1.55倍）／3000万ユーロ×177.34＝53億2020万円（約53億円）
#   セリエAの節ごとの積み上げ（得点）: マレン 3・5・5・6・6 ／ ラウタロ 0・0・2・2・4。
#     開幕2試合は5点と0点、直近3試合は1点と4点。**向きが入れ替わっている**のが見立て。
#   **食い違いの控え**: 10/1 に取った得点ランキングの控え（research/scorers/2026-10-01.json）はラウタロのセリエAを
#     「4試合323分」としている。tmapi の1試合ずつを足すと **324分**。1分の差なので**こちらの数え（324分）に揃えた**。
#     マレンの345分は両方で一致。
# **言い切っていないもの**: どちらが上かは一度も言わない。枠内1本あたりの得点（0.60と0.57）は
#   「ほとんど同じ」までにして、差を作っているのは「その手前」と言うに留めた。評点は使っていない
#   （tmapi の grade がセリエAでは null で、自分で確かめられないため）。
#   9月19日の試合は、2人の出場分・得点・シュートだけを使い、試合の流れや他の選手には触れていない。
# 板：①versus（3行だけ。20秒を超えないように**4行目から stats に替えた**）②table（6行）③table（4行）と calc
#   ④line（2本）と convert。**`card: none` は明示してある**（`card:` の行を消すだけでは前の板が残る）。
#   赤ペン（mark）は使っていない。
# 写真：Commons の2枚だけ。マレン（File:DONYELL MALEN – 2023.08.12 (02).jpg、CC BY-SA 4.0 / Sandro Halank、2023年）、
#   ラウタロ（File:Lautaro Martinez Argentina v Spain 19 July 2026-263.jpg、CC BY-SA 4.0 / Bryan Berlin、2026年）。
#   冒頭と見立ては `tools/pairphoto.py --focus 0.26` で横に並べた1枚（頭が上端で切れるのを和らげた）。
#   **マレンの元は785px幅**なので 16:9 へ引き伸ばす `widecrop` は作っていない（1.6倍を超える）。
#   節③の下地は、横長のマレン（Commons「2021-11-06 … RB Leipzig - Borussia Dortmund 1DX 1664 by Stepro.jpg」
#   CC BY-SA 4.0 / Steffen Prößdorf、2021年、3354×2236）。代理店の写真は無し。
#   **残った × はショートだけ**：縦に2人を上下で割ると、下に来たほうの顔に字幕の帯がかかる（59%）。
#   2人とも顔の寄った写真なので、上下を入れ替えても同じところに当たる。
#   **シリーズの回にショートは作らない決まり（2026-10-10）**なので、ここは直していない。本編は ✓ と △ だけ。
# 声：1件も無い（シリーズの回。ブラウザの道具を使わない約束なので反応は集めていない）。
# サムネ：**ユーザーと相談して決める。**ここに書いてあるのは案A（構図 versus、伏せるのは「同じ試合」）。
#   伏せた答えは節①の読み上げに出てくる。10/9 が versus・number、10/10 が scene と classic。
