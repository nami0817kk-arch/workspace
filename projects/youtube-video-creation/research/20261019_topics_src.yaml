title: 10月19日の題材（ショート）
lead: 今日は月曜で、日曜の試合結果が中心です。日本人は10件、続いて欧州の大きい話を20件（弱い印は8件）。
note: '今日は月曜（19日）。日曜（18日）の試合結果が一覧の中心で、今日の試合はセリエAのパルマ対トリノ、プレミアのトッテナム対コベントリーなど少数です（CLの夜は火曜）。


  昨日の日曜の試合は新しい題材として入れました：リーズ対マンU（1-1。田中碧が81分まで先発＝日本人2番、ネビルの発言＝プレミア14番）、レアル対セビージャ、アーセナル対フォレスト、ブライトン対パレス、ミラン対アタランタ、ユベントス対ラツィオ ほか。


  日本人本人の言葉が取れたのは0件です（久保・田中碧・宇野・南野・後藤・鎌田・前田の記事に本人の言葉は無し）。坂元はランパード監督の言葉で、本人の言葉ではありません。外国人では、E・マルティネス（本人のInstagram）、アムラバト、ガットゥーゾ、ブレーメルなどの言葉が取れています。


  日本人は10件に届きました。ただし鈴木唯人・上田・鎌田・前田の4件は弱い印です（出典1本・転載・続報）。三笘・冨安は18日メンバー外、旗手など欧州7リーグの外（セルティック）、福田師王（独2部）は除外、中村（リヨン）は日本人か取得物で確認できず外しています。


  ロマーノなど移籍記者のXは読めませんでした。移籍の話は、コリエレ・デロ・スポルト（ラビオ）・フースバル・ニュース（鈴木唯人）・RNEでの会長発言（ラモス）として、媒体の報道で入れています（どれもクラブの発表は無い）。


  10/15〜10/18 に出した題材と重なる続報（上田・鎌田・前田・マンU・ナポリ・ミラン）は弱い印を付けました。

  取得で読めなかった点：ガゼッタ・マルカ・ASの本文（見出しのみ）、ロマーノ等のX、kicker（403）。ウニオン対ドルトムントは0-0で日本人の出場無しのため外しました。

  今日19日の試合（トッテナム対コベントリー＝坂元、パルマ対トリノ）は試合後に作る決まりです。'
