# ベティスとエムバペ兄弟（2026年9月9日）。ネイマールの差し替え
# （2026-09-09 ユーザー「ネイマールの台本はng」「他を探して」）。
# **Xも見た**（ユーザー指示）。ロマーノ（accounts: の tier 確定）が
# 「Huge away win for Real Betis with Marc Bartra's brace!」と投稿していて、
# 記事の内容と一致する。
# **反応は入れない。**`reactions --find` で探したが、この試合のスレは
# 上田綺世のゴールの話で、ベティス側の話ではなかった
format: news
# 4日間の出来事を順に追う回。地の文が長いので下限を下げる
voice_min: 10
slot: world
date: "2026年9月9日"

short_title: "ベティスがエムバペ兄弟を4日で連破した話"

theme:
  id: betis_mbappe_brothers
  league: other
  kind: match
  topic: ベティス
  title: エムバペ兄弟が4日で2敗。同じ相手に何が起きたのか
  hook: 4日のあいだに、2つの試合がありました。
  question: ベティスにとって、この勝利は何年ぶりだったのか

thumbnail:
  line1: エムバペ兄弟が4日で2敗
  line2: ベティスのCL勝利は ●● 年ぶり
  photo: "assets/photos/20260908_mbappe/01.jpg"
  tags: [エムバペ, ベティス]
