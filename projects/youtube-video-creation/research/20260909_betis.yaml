sections:
  - id: madrid
    heading: まず兄のほうから
    tier: 報道
    telop: 後半AT、PKを止められる
    narrator: キャスター
    say:
      - 9月4日、ラ・リーガ第4節。ベティスがホームにレアル・マドリードを迎えました。
      - 試合終盤、トロイ・パロットのゴールでベティスが先制します。
      - 1点リードのまま迎えた後半アディショナルタイム、レアルにPKが与えられました。
      - キッカーはキリアン・エムバペ。
      - しかし、ベティスのGKアルバロ・バジェスがこのシュートを止めます。
      - 土壇場で追いつかれず、ベティスが1対0で勝ちました。レアルは今季初黒星です。
      - 試合のあと、レアルのモウリーニョ監督がスペイン紙『アス』にこう話しています。
      - {voice: モウリーニョ, text: ベティスにおめでとうと言いたい}
      - {voice: モウリーニョ, text: 彼らは引き分け狙いで戦い、見事に大当たりを引き当てた}
      - {voice: モウリーニョ, text: 私のベンチの目の前で「死んだ」かのように振る舞っていた選手}
      - {voice: モウリーニョ, text: 救急車が来るのかと思ったが、結局救急車は来なかったね}
      - PKを外したエムバペについては、こう言って庇いました。
      - {voice: モウリーニョ, text: 誰かがPKを蹴る時、それはチーム全員で挑んでいることと同じだ}
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35253/
      - https://www.soccer-king.jp/news/world/esp/20260905/2200990.html

  - id: lille
    heading: その4日後、今度は弟
    tier: 報道
    telop: リール 2対3 ベティス
    narrator: キャスター
    card:
      type: table
      title: CLリーグフェーズ第1節 リール 2-3 ベティス
      columns: ["時間", "できごと"]
      rows:
        - ["12分", "上田綺世が先制（エタン・エムバペのアシスト）"]
        - ["ー", "バルトラの2ゴールでベティスが追いつく"]
        - ["53分", "パロットのゴールでベティスが逆転"]
        - ["56分", "エタン・エムバペが肘打ちで退場"]
    say:
      - 9月8日、チャンピオンズリーグ・リーグフェーズの第1節。
      - ベティスはリールの本拠地に乗り込みました。相手にいたのは弟のエタン・エムバペです。
      - エタンは序盤から効いていました。12分、上田綺世の先制ゴールをアシストします。
      - ベティスは2度リードを許しながら、マルク・バルトラの2ゴールで追いつきました。
      - 53分、パロットのゴールでついに逆転します。
      - そして56分。エタン・エムバペが、ベティスのDFナタンへの肘打ちで退場になりました。
      - 数的不利になったリールは、そのまま3対2で敗れています。
    official: false
    sources:
      - https://web.ultra-soccer.jp/news/all/35634/
      - https://www.footballchannel.jp/2026/09/09/post1006998/

  - id: record
    heading: この勝利の重み
    tier: 報道
    telop: CLの前の勝利は2005年11月1日
    narrator: 解説
    card:
      type: bars
      title: ベティスのCL勝利のあいだ
      items:
        - {label: "前の勝利（2005年11月1日）から", value: 21}
      unit: 年
    say:
      - ベティスがチャンピオンズリーグで最後に勝ったのは、2005年11月1日でした。
      - 相手はチェルシー。ホームで1対0の勝利です。
      - そこから20年以上、この舞台での白星から遠ざかっていました。
      - 約21年ぶりの勝利を、エムバペ兄弟との連戦の先で手にしたことになります。
      - 移籍情報で知られるファブリツィオ・ロマーノも、試合の直後にこう書いています。
      - {voice: ロマーノ, text: レアル・ベティスの見事なアウェイ勝利}
      - {voice: ロマーノ, text: マルク・バルトラの2ゴールだ}
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/09/post1007364/
      - https://x.com/FabrizioRomano
