# 「時間の割合」は、加入してからクラブが戦った公式戦の時間のうち、ピッチにいた時間。どちらが上かは言い切らない。
# 前の日までの回（10/3 バルセロナの財政、10/4 エムバペ紹介）とは重ねない。バルセロナのゴードン（11位）は入れていない。
