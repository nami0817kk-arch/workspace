  - text: 夏の移籍で、移籍金が高かった上位の選手。新しいクラブでの数字です。
    short_only: true
  - text: 1位は、チェルシーからシティへ移ったエンソ・フェルナンデス。
    image: assets/images/20261005_transfer_review/pair_enzo_rogers/01.jpg
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 0, source: Transfermarkt}
  - text: 額は1億4500万ユーロ。加入は移籍市場の締め切り日、9月1日でした。
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 0, source: Transfermarkt}
  - text: そこから5試合のうち4試合に先発して338分。時間の割合は75%。
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 0, source: Transfermarkt}
  - text: チャンピオンズリーグでアシスト、リーグ戦では初ゴールも決めました。
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 0, source: Transfermarkt}
  - text: 2位は、ヴィラからチェルシーへ移ったモーガン・ロジャーズ。
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 1, source: Transfermarkt}
  - text: 7試合すべてに出て、時間の割合は88%。
    emph: true
    card: {type: table, title: 移籍金1〜5位（10月4日までの公式戦）, columns: [選手（移籍先）, 移籍金, 出場, 時間の割合, 得点, アシスト], rows: *t1, highlight_row: 1, source: Transfermarkt}
