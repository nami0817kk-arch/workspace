title: 9月28日の題材（3回目）
lead: 移籍の話と、騒動になっている話を中心に6件
note: <b>○×を付けてください。</b>いまは代表ウィークなので、クラブの試合が無く、見出しの数そのものが少なめです。今夜の欧州の代表戦（ドイツ対ギリシャ、オランダ対セルビア、スペイン対クロアチアなど）の結果が明日の朝に出そろうので、<b>朝にもう一度集めます</b>。中身はまだ<b>見出しだけ</b>です。
