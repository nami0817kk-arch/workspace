    image: assets/images/20261021_bellingham_intro/panama088/01_w.jpg
    card:
      <<: *past_card
      highlight_row: 3
  - text: そしてレアルの1年目が0.57。8シーズンのなかで、最高です。
    emph: true
    image: assets/images/20261021_bellingham_intro/roma_MJ14006/01_w.jpg
    card:
      <<: *past_card
      highlight_row: 4
  - text: そのあとは0.28、0.26。今季は0.31で、少し戻りました。
    card:
      <<: *past_card
      highlight_row: 7
  - text: 続いて、通算です。レアルでは151試合で49得点、90分あたり0.37。
    image: assets/images/20261021_bellingham_intro/ghana182/01_w.jpg
    card: &total_card
      type: table
      title: ベリンガム 通算（クラブとイングランド代表）
      columns: [所属, 試合, 得点]
      rows: [*t1, *t2, *t3, *t4, *t5]
      source: Transfermarkt
      highlight_row: 2
  - text: ドルトムントは132試合24得点で0.21。バーミンガムは44試合4得点でした。
    card:
      <<: *total_card
      highlight_row: 1
  - text: イングランド代表は、60試合で14得点。0.29です。
    image: assets/images/20261021_bellingham_intro/panama111/01_w.jpg
    card:
      <<: *total_card
      highlight_row: 3
  - text: すべて足すと、387試合で91得点。90分あたり0.28になります。
    emph: true
    card:
      <<: *total_card
      highlight_row: 4
