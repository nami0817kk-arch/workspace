  say:
  - text: 最後に、ベリンガムの数字を、レアルの1年目と今季で並べます。
    image: assets/images/20261021_bellingham_intro/laureus/01_w.jpg
    card: &cmp_card
      type: table
      title: レアルの1年目と、今季（クラブの全公式戦）
      columns: [項目, 23/24（42試合）, 26/27（11試合）]
      rows: *cmp_rows
      source: Transfermarkt
      highlight_row: 0
  - text: 今季はまだ序盤。途中経過として、見てください。
    card: none
  - text: 得点のペースは、0.57から0.31。ほぼ半分です。
    emph: true
    image: assets/images/20261021_bellingham_intro/panama111/01_w.jpg
    card:
      <<: *cmp_card
      highlight_row: 0
    mark: {kind: circle, row: 0}
  - text: ところがシュートは、ほぼ同じ。打つ数は、変わっていません。
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: 違うのは、決まる割合。24%から13%へ。
    emph: true
    image: assets/images/20261021_bellingham_intro/ghana182/01_w.jpg
    card:
      <<: *cmp_card
      highlight_row: 2
  - text: ゴールの枠に飛んだ割合も、49%から39%に。
    card:
      <<: *cmp_card
      highlight_row: 3
  - text: 出場時間は、87分と79分。近い長さです。
    card:
      <<: *cmp_card
      highlight_row: 4
  - text: つまり変わったのは、出番ではなく、打ったシュートが決まる割合です。
    image: assets/images/20261021_bellingham_intro/panama111/01_w.jpg
    card: none
  - text: 次は、日本時間22日の午前4時、チャンピオンズリーグのライプツィヒ戦。
    card: none
  - text: そして25日、日本時間26日の午前5時から、バルセロナの本拠地でクラシコです。
    image: assets/images/20261021_bellingham_intro/roma_AV15449/01_w.jpg
    card: none
  - text: クラシコで点を取った3試合は、3つとも勝ち。
    card: none
  - text: 取れなかった7試合は、1勝だけ。その続きが、出るのか。
    card: none
