  say:
  - text: レアルとバルセロナの対戦、クラシコ。ベリンガムは、これまで10回出ています。
    image: assets/images/20261021_bellingham_intro/panama111/01_w.jpg
    card: none
  - text: 点を取ったのは3試合。その3つとも、レアルが勝っています。
    emph: true
    card: &clasico_card
      type: table
      title: ベリンガムが得点したクラシコ
      columns: [日付, 会場, 得点, 結果]
      rows: *clasico_rows
      source: Transfermarkt・Wikipedia
  - text: 2023年10月28日、敵地で2対1の勝ち。ベリンガムが2得点。
    image: assets/images/20261021_bellingham_intro/panama088/01_w.jpg
    card:
      <<: *clasico_card
      highlight_row: 0
  - text: 2点目は、追加時間の決勝点でした。
    card:
      <<: *clasico_card
      highlight_row: 0
  - text: 試合後、アンチェロッティ監督は、ベリンガムの得点の見通しを、こう話しました。
    card: none
  - voice: アンチェロッティ監督
    text: 20点から25点には、簡単に届くよ。
    pause: 0.5
  - text: その季の得点は、全公式戦で23。20点から25点の幅に、収まりました。
    emph: true
    image: assets/images/20261021_bellingham_intro/laureus/01_w.jpg
    card: none
  - text: 2024年4月21日、本拠地で3対2。追加時間に、また決勝点。
    image: assets/images/20261021_bellingham_intro/roma_AV15449/01_w.jpg
    card:
      <<: *clasico_card
      highlight_row: 1
  - text: そして2025年10月26日、本拠地で2対1。この日も、決勝点でした。
    card:
      <<: *clasico_card
      highlight_row: 2
  - text: 残る7試合は、1勝6敗。ベリンガムの得点は、その中にはありません。
    image: assets/images/20261021_bellingham_intro/ghana182/01_w.jpg
    card: none
