- id: view
  heading: 25日のクラシコまでに、ベリンガムの数字は何を見せるのか
  tier: 背景
  viewpoint: true
  narrator: 解説
  telop: レアルの1年目と、今季
  card:
    type: table
    title: レアルの1年目と、今季（クラブの全公式戦）
    columns: [項目, 23/24（42試合）, 26/27（11試合）]
    rows: &cmp_rows
