    say:
      - text: '25分しか出られないまま契約が切れたジンチェンコに、マンチェスター・ユナイテッド移籍の話が出ました。'
        short_only: true
      - "**9月16日**。「マンチェスター・ユナイテッドが代理人と接触した」と伝えられました。"
      - 本人はフリーでの加入に前向きだ、とも。ただし、クラブからも本人からも、何も出ていません。
      - 返ってきたのは、こういう声でした。
      - voice: ネット民
        text: 「ジンチェンコはマンチェスター・ユナイテッド移籍の用意がある」。ただしマンチェスター・ユナイテッドの方に、ジンチェンコを受け入れる用意がない
      - こう言われるまでに、何があったか。
      - 今年1月、アーセナルから**アヤックス**へ。ところが**2月14日、2試合目で前十字靭帯を断裂**します。
      - アヤックスでの出場は、**合わせて25分**でした。
      - この怪我で、ワールドカップ予選の最終盤を欠場します。
      - "**ウクライナはスウェーデンに1対3で敗れ、本大会を逃しました**。"
      - 6月末で契約は切れます。**それから3か月**、どこにも所属していません。
      - 膝を痛めた日から数えると、**7か月**です。
      - まだ**29歳**です。マンチェスター・シティでは**4回のリーグ優勝**に加わり、アーセナルでも**2位を2度**経験しました。
