# 取材メモ（2026年10月24日）前田大然、後半28分から投入。イプスウィッチ 1-1 フォレスト（ニュースのショート。見せ方 B＝写真を切り替え）
# 取材: 2026-10-24。requests（ブラウザUA）で本文を全部読んだ。
#   ・ゲキサカ 10/24 05:58「前田大然は後半途中出場から攻守奮闘も…」：3試合ぶりのベンチスタート、後半28分に3枚目の交代で投入、右サイドハーフ、
#     守備時は最終ラインまで戻って5バックの一角、攻撃時は最前線まで走り裏を突く、後半38分に中盤のプレスからカウンターのスイッチ（ゴールにはつながらず）。
#     イプスウィッチは試合前 3勝4敗・勝ち点9・10位、フォレストは19位で3連敗中。得点：前半13分ネコ・ウィリアムズ（フォレスト）、41分エンシソ（イプスウィッチ）。
#   ・クラブ公式（itfc.co.uk）試合レポート：先発・交代 "Fatawu (Maeda, 73')"（＝後半28分と一致）、観衆29,198、追加時間8分、後半6分にディオプがVARで警告止まり。
#   ・クラブ公式「Gary proud of hard-fought draw」：オニール監督の会見。**前田の名前は出てこない**。後半の早い時間に「より安全に、より直接的に」戦い方を切り替えたと話している。
#     → 監督の言葉は試合全体の総括（「厳しい相手、厳しい条件」「いい勝ち点1」）だけ引く。「より安全に」は**引かない**：イプスウィッチ・スターの記者評は前田らの交代を「攻撃的」と書いており、前田の投入と結びつくように読めるため。
#   ・EADT（Alex Jones の採点）：前田 6点「Ran his socks off, added defensive solidity but had little to work with in an attacking sense」。途中出場のクラーク・前田・マトゥシワ・アクポムはそろって6点。
#   ・イプスウィッチ・スター（Stuart Watson の試合評）：交代は「attack-minded」、前田も投入された一人。
# 本人（前田）の言葉：取れていない（ゲキサカ・クラブ公式に無い）。作らない。監督の言葉は前田についてではないので Y にはしない → B。
# 反応：作らない（0件）。
# 確度：結果・交代時刻はクラブ公式で 確定。前田の役割の描写は 報道（ゲキサカ）。勝ち点10は自分で数えた（9＋1）。
# 【前の本と重ねない】10/18 初ゴール／10/19 現地メディアの評価／10/21 オニール監督の使い方（シャドー・ウイング）。今回は「この試合で何を任されたか」。
#   初ゴールは「前節ゴールを決めた」と1語だけ（ゲキサカ本文の言い方）。シャドー・「純粋なウイング」は言わない。
# 写真：今日の試合の前田の写真は、代理店でない先から取れなかった。ゲキサカ主写真は ©Getty の透かし（落とした）、クラブ公式の試合レポート主写真はエンシソ（別人）、
#   地元紙の写真はディオプ・エンシソ・主審。クラブ公式のシティ戦ギャラリー（mdi_*）は S3 の取得が時間切れ。→ **10/19 と同じ Commons の5枚（2023〜24年のセルティック時代と日本代表）を使い回している**。
