  heading: 2006年のワールドカップ決勝で、ブッフォンは何を止めたのか
  tier: 報道
  main: true
  telop: 延長104分、ジダンのヘディング
  card: &mt
    type: timeline
    title: 2006年7月9日 W杯決勝 フランス戦
    rows: &mtr
    - [7分, ジダンのPKで先制される]
    - [19分, マテラッツィが追いつく]
    - [104分, ジダンのヘディングを止める]
    - [PK戦, 5対3で世界一]
    focus: 0
    highlight_row: 0
  say:
  - {text: ジャンルイジ・ブッフォン。, short_only: true, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - {text: ワールドカップの決勝で、世界一を守った1つのセーブがあります。, short_only: true, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - {text: 2006年7月9日、ドイツのベルリン。ワールドカップの決勝、相手はフランスです。, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - text: 7分、ジダンのPK。この大会でブッフォンが取られた、2点目の失点でした。
    card: *mt
    image: assets/images/20261110_buffon_legend/12_w.jpg
  - text: 19分、マテラッツィのゴールで、イタリアが追いつきました。
    card:
      type: timeline
      title: 2006年7月9日 W杯決勝 フランス戦
      rows: *mtr
      focus: 1
      highlight_row: 0
    image: assets/images/20261110_buffon_legend/12_w.jpg
  - {text: そのまま延長に入った104分、右からのクロスに、ジダンが頭で合わせます。, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - {text: 高く跳び上がったブッフォンが、そのボールを、クロスバーの外へ逃がします。, short_only: true, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg, emph: true}
  - text: 強いヘディングを、ブッフォンは跳んで、指先でバーの上にはじき出しました。
    main_only: true
    card:
      type: timeline
      title: 2006年7月9日 W杯決勝 フランス戦
      rows: *mtr
      focus: 2
      highlight_row: 0
    image: assets/images/20261110_buffon_legend/09_w.jpg
    emph: true
    callword: 104分
  - {text: ブッフォンはのちに、これがキャリアでいちばん大事なセーブだったと話しています。, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - text: 決着はPK戦。イタリアが5対3で制して、世界一に。
    card:
      type: timeline
      title: 2006年7月9日 W杯決勝 フランス戦
      rows: *mtr
      focus: 3
      highlight_row: 0
    image: assets/images/20261110_buffon_legend/12_w.jpg
  - {text: 大会の7試合で失点は2。1試合あたり0.29点です。, card: none, image: assets/images/20261110_buffon_legend/12_w.jpg}
  - {text: しかも2点とも、流れの中から決められた失点ではありません。, card: none}
  - {text: 大会でいちばんのゴールキーパーの賞も、ブッフォンが手にしました。, card: none, image: assets/images/20261110_buffon_legend/07_w.jpg}
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/2006_FIFA_World_Cup_final', 'https://en.wikipedia.org/wiki/Gianluigi_Buffon']
- id: after
  heading: ブッフォンは、どんな記録を残して現役を終えたのか
  tier: 報道
  telop: 2つの出場記録と、45歳の引退
  card: &af
    type: timeline
    title: 記録と、現役の終わり
    rows: &afr
    - [2013年10月, 代表の出場でイタリア1位に]
    - [2020年7月, セリエAの出場記録を更新]
    - [2023年8月, 45歳で引退]
    focus: 0
    highlight_row: 0
  say:
  - text: 2013年10月、ブッフォンは137試合目の代表戦で、カンナバーロを抜きます。
    card: *af
    image: assets/images/20261110_buffon_legend/05_w.jpg
  - {text: イタリア代表で、いちばん多く試合に出た選手になりました。, card: none}
  - {text: 代表を退いたのは2018年。40歳まで、出場の数を伸ばし続けました。, card: none, image: assets/images/20261110_buffon_legend/06_w.jpg}
  - text: 2020年7月には、セリエAで648試合目。マルディーニの記録を抜きました。
    card:
      type: timeline
      title: 記録と、現役の終わり
      rows: *afr
      focus: 1
      highlight_row: 0
    image: assets/images/20261110_buffon_legend/03_w.jpg
  - {text: 最後のパルマでの2シーズンを経て、2023年8月、45歳で現役を終えます。, card: none, image: assets/images/20261110_buffon_legend/04_w.jpg}
  - text: 引退の日、ブッフォンが残した言葉です。
    card:
      type: timeline
      title: 記録と、現役の終わり
      rows: *afr
      focus: 2
      highlight_row: 0
    image: assets/images/20261110_buffon_legend/07_w.jpg
  - {voice: ブッフォン, text: これでおしまい。みんなは、僕にすべてをくれた。, card: none, pause: 0.6, image: assets/images/20261110_buffon_legend/07_w.jpg}
  - {voice: ブッフォン, text: 僕も、すべてを捧げた。一緒に、成し遂げたんだ。, card: none, cont: true}
  quotes_from: ['https://www.bbc.com/sport/football/66378584']
  sources: ['https://www.bbc.com/sport/football/66378584', 'https://en.wikipedia.org/wiki/Gianluigi_Buffon']
- id: secret
  heading: ブッフォンには、どんな意外な話があるのか
  tier: 報道
  telop: 中盤の少年、スーパーマン、そして初めての賞
  card: &sc
    type: table
    title: 知られざる、3つの話
    columns: [いつ, 何があったか]
    rows: &scr
    - [少年時代, 最初は中盤の選手だった]
    - [19歳ごろ, スーパーマンのシャツ]
    - [2017年, GKで初めてリーグの最優秀選手]
    highlight_row: 0
  say:
  - {text: ブッフォンにまつわる、意外な話を3つ紹介します。, card: none, image: assets/images/20261110_buffon_legend/02_w.jpg}
  - text: 1つ目。パルマの下部組織では、最初は中盤の選手でした。
    card: *sc
    image: assets/images/20261110_buffon_legend/04_w.jpg
  - {text: 憧れたのは、1990年のワールドカップで見た、カメルーンのGKエンコノ。, card: none}
  - {text: ゴールキーパーに移ると、わずか2週間でチームの1番手になりました。, card: none, image: assets/images/20261110_buffon_legend/04_w.jpg}
  - text: 2つ目。パルマ時代、インテルのロナウドのPKを止めたときのこと。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      highlight_row: 1
    image: assets/images/20261110_buffon_legend/11_w.jpg
  - {text: ブッフォンは、ユニフォームの下に着ていたシャツを見せます。, card: none}
  - {text: 描かれていたのは、スーパーマン。それが、あだ名になりました。, card: none, image: assets/images/20261110_buffon_legend/11_w.jpg, emph: true}
  - text: 3つ目。2017年、GKとして初めて、セリエAの年間最優秀選手に。
    card:
      type: table
      title: 知られざる、3つの話
      columns: [いつ, 何があったか]
      rows: *scr
      highlight_row: 2
    image: assets/images/20261110_buffon_legend/07_w.jpg
  quotes_from: []
  sources: ['https://en.wikipedia.org/wiki/Gianluigi_Buffon']
