# ジャンルイジ・ブッフォン（元イタリア代表GK）の紹介。シリーズ「レジェンドの紹介（世界）」2026-11-10。型は 11/8 ルーニーと同じ9節（フック→基礎DATA→日本との接点→歩み→持ち味→あの試合→記録と現役の終わり→マル秘話→見立て）。
# **FotMob・DataMB・FBref・Sofascore・Transfermarkt は不使用**。数字は英語版 Wikipedia（Gianluigi Buffon の成績表・本文・Records、2006 FIFA World Cup final、2002 FIFA World Cup Group G、2013 FIFA Confederations Cup Group A）、BBC 2023-08-02 の引退の記事と、自分で足した・割った値だけ。
# **私生活・法的な問題は入れない**（2000年の卒業証書の件・2006年の賭けの捜査・家族・結婚・病気は使わない）。2006年のクラブの降格は「処分で2部へ」とだけ言う（不正の中身・ブッフォン本人の捜査は言わない）。引退後の代表の役職は言わない（2026-04 に退任。いまの肩書きは台本で言わない）。
#
# **重なりの確認（2026-11-06）**：scripts/・research/covered.yaml・research/posted.json を「ブッフォン／Buffon」で grep。主役の回は無し（10/10 の代表出場数の回 scripts/20261010_record_caps.md にイタリアの1位として名前と176試合が出るだけ）。レジェンド既出（ジダン・ロナウジーニョ・シャビ・イニエスタ・ベッカム・ロナウド・アンリ・イブラヒモビッチ・マルディーニ・カカ・ジェラード・ドログバ・ピルロ・トッティ・カシージャス・デル・ピエロ・トーレス・ルーニー）と重ならない。research/20261109_picks.txt（11/9〜11/11 のスタジアム・ユニフォームはビルバオ・レアル・バレンシア・アトレティコ）とも重ならない。
# **引退の確認（一次情報に近いもの）**：BBC Sport「Gianluigi Buffon: Italy legend retires aged 45」（2023-08-02、https://www.bbc.com/sport/football/66378584 を requests で取得）。本文「Former Italy goalkeeper and World Cup winner Gianluigi Buffon has retired from football aged 45」、本人のSNS投稿の引用「That's all folks. You gave me everything. I gave you everything. We did it together.」、パルマ会長の談話。Wikipedia「On 2 August 2023 ... announced his retirement」、最後の試合は 2023-05-30 の2部昇格プレーオフ準決勝の第1戦。→ **選手としては現役ではない（48歳）**。
# **日本との接点**：①1993年、日本開催の U-17 世界選手権にイタリアの U-17 で参加（Wikipedia「took part at the 1993 FIFA U-17 World Championship in Japan」。出場試合数は確かめていないので「加わった」とだけ言う）。②2002年W杯、イタリアの1次リーグは日本で3試合：6/3 札幌ドーム エクアドルに2-0、6/8 カシマスタジアム クロアチアに1-2、6/13 大分 メキシコと1-1（Wikipedia「2002 FIFA World Cup Group G」）。ブッフォンは大会の全時間に出場、エクアドル戦は無失点（Wikipedia 本人の記事「played every minute」「keeping a clean sheet in the opening match against Ecuador」）。③2013-06-19 コンフェデ杯（ブラジル・レシフェ）日本に4-3。ブッフォンはキャプテンで先発（試合表）。日本は本田のPK21分・香川33分で2-0、イタリアはデ・ロッシ41分・オウンゴール50分・バロテッリのPK52分で逆転、岡崎69分で3-3、ジョビンコ86分で4-3（Wikipedia「2013 FIFA Confederations Cup Group A」）。
# **数字の出どころと自分で足した値**
# - 成績表（Wikipedia、公式戦）：パルマ1期目 220試合＋2期目 45試合＝265、ユヴェントス1期目 656＋2期目 29＝685（Wikipedia の Records「685, behind Del Piero 705」と一致）、パリ・サンジェルマン 25。Career total 975（265+685+25＝975 と一致）。イタリア代表 176試合。クラブと代表の合計 1,151試合（自分で足した値：975+176。Wikipedia の冒頭「over 1,150 professional career appearances」と合う）。**年代別代表は含めない**。
# - セリエA 657試合はリーグの歴代1位（Wikipedia の Records、BBC 2023-08-02「a record 657 appearances in the Italian top flight」）。2020-07-04 トリノ戦で648試合目、マルディーニの647を抜く（Wikipedia）。
# - 代表176試合はGKで世界1位、イタリア代表でも1位（Wikipedia の冒頭、BBC「the most-capped goalkeeper of all time with 176 appearances for Italy」）。2013-10-11 デンマーク戦で137試合目、カンナバーロを抜いてイタリア1位（Wikipedia）。2018年、W杯の出場を逃したあと代表を退く（BBC）。
# - 1995-11-19、17歳295日でセリエAデビュー（パルマ、監督スカーラ）。1991年にパルマの下部組織へ（13歳）。1998-99 にUEFAカップ・コッパ・イタリア。2001-07-03 ユヴェントスへ、GKとして当時の世界最高の移籍金（金額は言わない）、ユヴェントスで最初の2季に連続でリーグ優勝（Wikipedia）。
# - 2006-07、ユヴェントスは2部（セリエB）。ブッフォンは37試合に出て、2部優勝で1季で1部へ（成績表と本文）。2006-09-09 リミニ戦（1-1）が2部の初戦（Commons の写真の説明）。
# - 2018-19 パリ・サンジェルマン（リーグ優勝）、2019 ユヴェントスへ戻る、2021-06 パルマへ（当時2部）。
# - 2016年：セリエAで974分連続無失点、リーグの記録（それまでの記録はロッシの929分）。2016-03-20 トリノ戦で更新、ベロッティのPKで止まる（Wikipedia）。974÷90＝10.8→「およそ11試合分」。
# - 2006年W杯：7試合で2失点（W杯の記録）、無失点5試合、ヤシン賞（大会の最優秀GK）。2失点はどちらも流れの中ではない（アメリカ戦のオウンゴール、決勝のジダンのPK）（Wikipedia）。
# **山場**：2006-07-09 W杯決勝、ベルリン、フランス戦。7分ジダンのPK、19分マテラッツィで1-1、延長104分にサニョルのクロスからのジダンのヘディングを、ブッフォンが指先でバーの上へ。本人がのちに「キャリアでいちばん大事なセーブ」と話した（Wikipedia の本人の記事。語りで紹介するだけで、声の引用にはしない）。PK戦5-3、トレゼゲのキックがバーに当たって外れる、最後はグロッソ（Wikipedia の決勝の記事）。ジダンの退場の件は言わない（ジダンを小さく見せない）。
# **本人の言葉**：2023-08-02 引退の日のSNS投稿（BBC が引用）「That's all folks. You gave me everything. I gave you everything. We did it together.」
# **マル秘話**：①パルマの下部組織では最初は中盤の選手。1990年W杯のカメルーンのGKエンコノに憧れてGKへ、2週間で下部組織の正GKに。②1997-98、インテルのロナウドのPKを止め、ユニフォームの下のスーパーマンのシャツを見せた→あだ名「スーパーマン」。③2017年、GKとして初めてセリエAの年間最優秀選手（Wikipedia）。
# **見立て（自分で足した・割った値）**：成績表の季ごと（公式戦）。1995-96〜2007-08 の13季：9+28+46+51+43+43（パルマ220）＋45+48+39+48+24+40+35（ユヴェントス279）＝499試合、1季38.4。2008-09〜2022-23 の15季：30+35+17+35+44+48+47+44+43+34＋25＋15+14＋26+19＝476試合、1季31.7。合計975と一致。代表は年ごと：1997〜2007年 80試合、2008〜2018年 96試合（合計176と一致）。30歳になった2008年を境に、前 499+80＝579、後 476+96＝572。後ろの割合 572÷1151＝49.7%→ほぼ半分。ユヴェントスの7連覇（2011-12〜2017-18、ブッフォン33〜40歳）の7季は 35+44+48+47+44+43+34＝295試合、1季42.1（最初の13季の38.4より多い）。
# **入れなかったもの**：卒業証書の件・賭けの捜査・家族・結婚・病気、移籍金の金額、2010年W杯のけが、PSG退団の経緯、引退後の代表の役職と退任、2026年W杯予選の話、ジダンの退場、U-17世界選手権の試合数、ESPN・AS のセーブの順位。
# **読みで怪しいもの**：ブッフォン、ジャンルイジ、パルマ、ユヴェントス、パリ・サンジェルマン、カッラーラ、トスカーナ、エンコノ、マテラッツィ、ジダン、トレゼゲ、グロッソ、サニョル、カンナバーロ、マルディーニ、ジョビンコ、デ・ロッシ、バロテッリ、本田圭佑、香川真司、岡崎慎司、札幌、鹿島、大分、レシフェ、コンフェデレーションズカップ、ヤシン賞、セリエA。「最多」「最年少」は使わず言い換える。「2006-07」のような書き方はしない。
