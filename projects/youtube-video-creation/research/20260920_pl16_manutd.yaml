  heading: 解散寸前で生まれた名前
  tier: 背景
  telop: 借金2670ポンド、解散命令から
  narrator: 解説
  card:
    type: table
    title: 解散寸前で生まれた名前
    columns:
    - ''
    - ''
    rows:
    - - 1902年1月
      - 借金2670ポンド。解散の命令
    - - 主将スタッフォード
      - 実業家4人が500ポンドずつ出資
    - - 1902年4月24日
      - マンチェスター・ユナイテッド誕生
  say:
  - '**1902年**1月、まだニュートン・ヒースだったクラブは、2670ポンドの借金で解散の命令を受けました。'
  - いまのお金でおよそ28万ポンド、日本円で数千万円の借金です。
  - 主将のハリー・スタッフォードが、地元の実業家を4人見つけます。
  - 4人が500ポンドずつ出資し、クラブの経営を引き受けました。
  - その年の4月24日、マンチェスター・ユナイテッドという名前が生まれました。
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
