  telop: 1878年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_manutd_data0.png
    text: 創立は**1878年**。ニュートン・ヒースという名前で始まり、1902年に今の名前になりました。
    no_telop: true
  - image: assets/backgrounds/stadium_マンチェスターユナイテッド_in.png
    text: 本拠地はオールド・トラッフォード。**7万4158人**が入る、プレミアで一番大きなスタジアムです。
  - image: assets/stats/pl_manutd_map.png
    text: ホームタウンはマンチェスター。グレーター・マンチェスターです。
    no_telop: true
  - image: assets/photos/pl/manutd_owner_3345c4b8.jpg
    text: オーナーはアメリカのグレイザー家。2024年からは、INEOSのラトクリフ氏も出資しています。
  - image: assets/stats/pl_manutd_data4.png
    text: 1部リーグの優勝は**20回**。FAカップは13回、チャンピオンズリーグは3回獲っています。
    no_telop: true
  - image: assets/stats/pl_manutd_data5.png
    text: 直近のタイトルは、2023年から24年のFAカップです。
    no_telop: true
  - image: assets/stats/pl_manutd_data6.png
    text: 2021年2月には、サウサンプトンに**9対0**。プレミアで最も大きな点差の勝利に並ぶ記録です。
    no_telop: true
  - image: assets/stats/pl_manutd_data8.png
    text: 愛称は「レッド・デビルズ」。赤い悪魔です。
    no_telop: true
