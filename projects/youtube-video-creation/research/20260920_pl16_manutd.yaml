- id: munich
  heading: 1958年2月6日
  tier: 背景
  telop: ミュンヘンでの事故と、その10年後
  narrator: 解説
  card:
    type: table
    title: 事故から、頂点まで
    columns:
    - ''
    - ''
    rows:
    - - 1958年2月6日
      - ミュンヘンでの航空機事故。23人が亡くなる
    - - うち選手
      - 8人
    - - 1968年
      - ヨーロッパカップ優勝。イングランド勢で初
  say:
  - text: 1958年2月6日。ヨーロッパの試合の帰り、給油に立ち寄ったミュンヘンでした。
    image: assets/images/pl_manutd_story/scene.jpg
  - チームを乗せた飛行機が墜落し、亡くなったのは**23人**。そのうち**8人**が選手でした。
  - 生き残ったバズビー監督とボビー・チャールトンが、チームを作り直していきます。
  - そして**10年後**の1968年。ヨーロッパカップ、いまのチャンピオンズリーグの決勝です。
  - ベンフィカを4対1で下し、**イングランドのクラブとして初めて**ヨーロッパの頂点に立ちました。
  - チャールトンはこの決勝で2点を決め、主将として優勝杯を掲げました。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  - https://en.wikipedia.org/wiki/Bobby_Charlton
  bg: assets/backgrounds/stadium_マンチェスターユナイテッド.png
- id: episode
  heading: 解散寸前で生まれた名前
  tier: 背景
  telop: 借金2670ポンド、解散命令から
  narrator: 解説
  card:
    type: table
    title: 解散寸前で生まれた名前
    columns:
    - ''
    - ''
    rows:
    - - 1902年1月
      - 借金2670ポンド。解散の命令
    - - 主将スタッフォード
      - 実業家4人が500ポンドずつ出資
    - - 1902年4月24日
      - マンチェスター・ユナイテッド誕生
  say:
  - text: '**1902年**1月、まだニュートン・ヒースだったクラブは、2670ポンドの借金で解散の命令を受けました。'
    image: assets/images/pl_manutd_episode/scene.jpg
  - いまのお金でおよそ28万ポンド、日本円で数千万円の借金です。
  - 主将のハリー・スタッフォードが、地元の実業家を4人見つけます。
  - 4人が500ポンドずつ出資し、クラブの経営を引き受けました。
  - その年の4月24日、マンチェスター・ユナイテッドという名前が生まれました。
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
  bg: assets/backgrounds/stadium_マンチェスターユナイテッド.png
  official: false
