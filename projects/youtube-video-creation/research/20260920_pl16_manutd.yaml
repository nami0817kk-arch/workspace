  telop: 1878年創立
  narrator: 解説
  say:
  - short_only: true
    text: このクラブの、基本のデータです。
  - image: assets/stats/pl_manutd_data.png
    text: 創立は**1878年**。ニュートン・ヒースという名前で始まり、1902年に今の名前になりました。
  - image: assets/stats/pl_manutd_data.png
    text: 本拠地はオールド・トラッフォード。**7万4158人**が入る、プレミアで一番大きなスタジアムです。
  - image: assets/stats/pl_manutd_data.png
    text: オーナーはアメリカのグレイザー家。2024年からは、INEOSのラトクリフ氏も出資しています。
  - image: assets/stats/pl_manutd_data.png
    text: 1部リーグの優勝は**20回**。FAカップは13回、チャンピオンズリーグは3回獲っています。
  - image: assets/stats/pl_manutd_data.png
    text: 直近のタイトルは、2023年から24年のFAカップです。
  - image: assets/stats/pl_manutd_data.png
    text: 2021年2月には、サウサンプトンに**9対0**。プレミアで最も大きな点差の勝利に並ぶ記録です。
  - image: assets/stats/pl_manutd_data.png
    text: 愛称は「レッド・デビルズ」。赤い悪魔です。
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
