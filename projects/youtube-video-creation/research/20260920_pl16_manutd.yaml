- id: data
  heading: マンチェスター・ユナイテッド 基礎DATA
  main: false
  tier: 背景
  telop: 1878年創立
  narrator: 解説
  say:
  - image: assets/stats/pl_manutd_data0.png
    text: 創立は**1878年**。鉄道の操車場で働く人たちの、ニュートン・ヒースというチームでした。
    no_telop: true
  - image: assets/stats/pl_manutd_data1.png
    text: 愛称は「レッド・デビルズ」。赤い悪魔です。
    no_telop: true
  - image: assets/stats/pl_manutd_map.png
    text: ホームタウンは、マンチェスターです。
    no_telop: true
  - image: assets/backgrounds/stadium_マンチェスターユナイテッド_in.png
    text: 本拠地はオールド・トラッフォード。1910年から使っています。
  - image: assets/photos/pl/manutd_owner_3345c4b8.jpg
    text: オーナーはアメリカのグレイザー家。2024年からは、イネオスという会社のラトクリフ氏も出資しています。
  - image: assets/stats/pl_manutd_cups.png
    text: 1部リーグの優勝は**20回**。FAカップは13回、チャンピオンズリーグは3回獲っています。
    no_telop: true
  - image: assets/stats/pl_manutd_cups.png
    text: ヨーロッパリーグ1回、カップウィナーズカップ1回、スーパーカップ1回、クラブワールドカップは2回です。
    no_telop: true
  - image: assets/stats/pl_manutd_data6.png
    text: 2021年2月には、サウサンプトンに**9対0**。プレミアで最も大きな点差の勝利に並ぶ記録です。
    no_telop: true
  - image: assets/stats/pl_manutd_data7.png
    text: 直近のタイトルは、2023年から24年のFAカップ。
    no_telop: true
  - image: assets/stats/pl_manutd_last.png
    text: 昨季は**3位**。勝ち点は71でした。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Manchester_United_F.C.
