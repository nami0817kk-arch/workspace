#       22分 セットプレーからラヴィヒ。32分 ヘイマンスのスルーパス→伊東のクロス→ドゥロシンミが右足（今季4アシスト）。伊東は60分にメディナと交代。90+ 分スメッツ退場。
#       ゲンクは開幕11試合で勝ち点15の7位、リーグ戦2連敗中だった。クラブは10日にジェス・トルップ監督の解任を発表、17日にティミー・シモンズ氏の就任が決まり、今節が初戦。勝ち点18で暫定6位。
