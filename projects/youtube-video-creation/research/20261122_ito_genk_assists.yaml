#       シモンズ監督の試合後の記者会見（原文）: "Die one second reaction vond ik knap om te zien bij iedereen. Ook bij Ito en Adedeji-Sternberg, die het niet altijd gewoon zijn om in balverlies terug te lopen en te verdedigen. Nu heb ik ze zien verdedigen met slidings, dat maakt me als trainer heel trots."
#       "Ik heb een team gezien dat meteen zijn stempel wou drukken … Nu komt de Limburgse derby, een van dé matchen van het seizoen van deze club. Die willen we ook winnen."
#       → 台本の言葉は、この原文を私が日本語にしたもの（語順はなぞらず日本語として通るように直した）。「one second reaction」＝ボールを失ったら1秒以内に反応する、というチームの決まり（選手のラヴィヒ＝Ravych も同じことを言っている）。
#   ・Voetbalkrant 2026-11-21 の試合記事（オランダ語）: 「Na nul op zes」＝直前の2試合は勝ち点0（2連敗）。10分は伊東が一度ボールを止め損ねたあと、もう一度時間をもらってクロス→ヘイネン。30分すぎは伊東がドゥロシンミの得点の出し手。伊東とアデデジ＝スターンバーグは60分に交代。
