# 取材メモ（2026年10月17日）チェルシー主将リース・ジェームズ、ひざの手術（ニュースのショート。見せ方 Y＝本人の一言から始める。発言は監督）
# 怪我の話なので、敬意を持った言い方にする。離脱期間・手術の部位は出典の言葉のまま（強めない）。
# 取材: 2026-10-17。requests（ブラウザUA）で原文を読んだ。控えは research/raw/20261017_james_*・20261017_chelsea_*。
#   ・Chelsea 公式「Injury update: Reece James」（10/16）— クラブの発表文。全文を読んだ。「successful minor knee surgery」。期間は書かれていない。
#   ・Chelsea 公式「Xabi Alonso on managing 'emotional' away games…」「Alonso: We have a good mix of personalities and leaders here」— 同じ会見の公式記事。
#       「15 goals scored in our opening six top-flight games」、「James set for a spell on the sidelines」。
#   ・Sky Sports（10/16）— 会見のアロンソの発言を英語で載せている。全文を読んだ。「around three months」「out until 2027」は Sky の『it is understood』『our understanding』（報道）。
#       アロンソ本人は「We don't set timelines, but he will be out for several weeks」。期間を区切っていない。
#   ・The Guardian（10/16）— 『faces up to the absence of Reece James for three months after knee surgery』。守備は『joint-worst defensive record』。無失点の発言も載せている。本文を全部読んだ。
#   ・サッカーキング（10/16 2217427）— クラブ発表の日本語。『軽度の手術』『復帰時期は未定』。今季はプレミア4試合・カラバオ2試合に出場。10日のボーンマス戦は欠場。
# 発言（英語の原文のまま訳した。言い換えない）:
#   「We wanted to be cautious and wait to know the result of the tests, but now the surgery has gone well and has been successful. Keep supporting him.」（Sky）
#       → 冒頭に出す発言は『but now…』以降の2文（『でも』は落とした。残した部分は原文の文）。
#   「We don't set timelines, but he will be out for several weeks.」（Sky）
#   「You need a lot of clean sheets to win trophies. But you [also] need to score a lot of goals.」（Guardian。ジェームズ個人の話ではなく、チームの課題として話した発言。ジェームズの怪我の原因や影響とは言っていない）
# 冒頭に出す発言（short_hook_quote）: 「いま、手術はうまくいき、成功しました。／彼を応援し続けてください。」
# 確度: クラブの発表（手術・軽度・成功・期間なし）は 確定。アロンソの発言・約3か月・年明けは 報道。見立ての節は 背景。
# 日付: クラブの発表は10/16朝（Guardian『Chelsea announced on Friday morning』）。会見は10/16。エバートン戦は17日（土）昼（現地）。
# 自分で数えた比べ（見立て）: プレミア6試合で15得点 → 15÷6＝2.5点（クラブ公式の『15 goals in six games』）。守備は Guardian の『joint-worst』（失点数は自分で数えていない。言わない）。
#   ジェームズの出場試合数（4/6）は台本に入れない（欠場の多さを強調する言い方になり、題にも答えないため）。出られなかった2試合の勝敗も比べない。
# 昨日（10/16）の『チェルシーの今夏の移籍』のシリーズ回とは別の話。数字（移籍金・順位）は使わない。
# 反応: 取れなかった。まとめ4サイト（ジェームズ チェルシー／リース・ジェームズ／ジェームズ 手術／チェルシー 主将）を --find で探した。今回の手術への書き込みは無い
#   （『公開練習を欠席』の記事は書き込みが読めない。別人の手術の記事だけ）。X は使っていない。→ 0件。approve は --no-voices で。
# 写真: Chelsea 公式サイト（chelseafc.com）の記事の主写真。ジェームズ（背番号24・キャプテンマーク）と、アロンソ監督（練習中・真剣な顔）。
#   アロンソの笑顔の写真は怪我の話に合わないので外した。公式サイトの写真は配信写真由来の可能性があり、透かしは見えなかった。出典は credits.json。
