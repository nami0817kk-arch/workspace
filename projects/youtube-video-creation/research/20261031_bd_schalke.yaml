- id: golden
  heading: ドイツ王者7回。なぜシャルケは、9年で6回も勝てたのか
  tier: 背景
  telop: 1934年から42年の9年で優勝6回。最後の優勝は1958年
  narrator: 解説
  main: true
  say:
  - 1904年、シャルケは高校生たちの手で生まれました。
  - 選手もファンも、多くは炭鉱で働く人たちでした。
  - text: 1928年には、自分たちの球場グリュックアウフ・カンプフバーンを建てます。
    image: assets/images/bd_schalke_golden/scene.jpg
  - 武器は「クライゼル」。短く速いパスで相手を振り回す、こまのような形です。
  - text: 1934年、ニュルンベルクを2対1で破り、初めてのドイツ王者に。
    card:
      type: table
      title: シャルケのドイツ王者
      columns:
      - 年
      - 結果
      rows:
      - - '1934'
        - 初優勝
      - - '1935'
        - 連覇
      - - '1937'
        - 優勝
      - - '1939'
        - 優勝
      - - '1940'
        - 優勝
      - - '1942'
        - 優勝
      - - '1958'
        - 7回目
  - 翌1935年は、シュトゥットガルトに6対4で勝って連覇です。
  - text: 9年で6回。中心にいたのが、エルンスト・クツォラです。
    card: none
    image: assets/images/bd_schalke_pair_kuzorra/01.jpg
  - 最後の優勝は1958年。ハンブルガーSVを3対0で破りました。
  - 1963年に始まったブンデスリーガでは、まだ優勝がありません。
  - 2位は**7回**。最初が1972年で、いちばん新しいのが2018年です。
  sources:
  - https://en.wikipedia.org/wiki/FC_Schalke_04
  - https://en.wikipedia.org/wiki/Ernst_Kuzorra
  bg: assets/backgrounds/stadium_シャルケ_in.png
  official: false
