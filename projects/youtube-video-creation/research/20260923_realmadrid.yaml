    telop: 「発言のたびにレアル・マドリードをおとしめ、攻撃し続けることを容認できない」
    narrator: キャスター
    bg: assets/backgrounds/stock/stadium_night.mp4
    say:
      - text: '「陰謀だ」と書いたリーガのテバス会長に、レアル・マドリードが公式の声明で答えました。'
        short_only: true
      - 同じ日の午後、クラブは公式サイトに声明を出しました。全文です。
      - voice: レアル・マドリード
        text: ラ・リーガのハビエル・テバス・メドラーノ会長の発言を受け、レアル・マドリードは次のことを表明する
      - voice: レアル・マドリード
        text: 我々のクラブは、ラ・リーガの会長がその制度上の立場を使い、発言のたびにレアル・マドリードをおとしめ、攻撃し続けることを容認できないと考える
      - voice: レアル・マドリード
        text: 直近の発言はとりわけ重大で理解しがたく、責任ある運営者にふさわしくない。デジタル媒体の独立した記者の記事にコメントする形で行われたからだ
      - voice: レアル・マドリード
        text: それなのに我々のクラブに向かって反応し、しかも我々のスポーツ戦略まで論評している。まったくの見当違いで、無責任だ
    sources:
