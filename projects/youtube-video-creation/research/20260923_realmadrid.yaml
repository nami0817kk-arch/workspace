      - モウリーニョ監督は会見で、退場になるべきだった場面を印刷して見せています。
      - レアルは2023年から、審判委員会の元副委員長ネグレイラ氏への支払いをめぐってバルセロナを訴えています。
      - 2日後の22日の朝。リーガのテバス会長が、この件を扱ったある記事に反応する形で、自分のXに書きました。
