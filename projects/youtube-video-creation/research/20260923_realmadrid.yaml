      - voice: テバス会長
        text: レアル・マドリードの会長もまた、そうではない
      - voice: テバス会長
        text: あるクラブの利益を守ることは、そのクラブの言い分を引き受けることではない
      - voice: テバス会長
        text: そして全員を代表することは、最も力のある者に従うことでもない
