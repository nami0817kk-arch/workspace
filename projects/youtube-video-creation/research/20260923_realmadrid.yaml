        text: 自分の職の性質を理解する人物が必要だ
      - voice: レアル・マドリード
        text: ラ・リーガの会長は大会の所有者ではなく、大会を構成し、その運営を託しているクラブに仕える運営者だからだ
      - voice: レアル・マドリード
        text: クラブが必要としているのは、この使命に誠実に仕える人物である
      - つまり、会長は代わるべきだ、というのがクラブの言い分です。
