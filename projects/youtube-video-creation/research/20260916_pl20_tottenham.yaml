sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 学校の生徒たちが1882年に作った
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1882年9月5日（Hotspur F.C.）"]
        - ["改名", "1884年4月"]
        - ["愛称", "Spurs／the Lilywhites"]
        - ["エンブレム", "ボールの上に立つ雄鶏"]
    say:
      - このクラブを作ったのは、**学校に通う少年たち**でした。創設は1882年9月5日。
      - 最初の名前は「ホットスパー」だけ。いまの形になったのは1884年4月です。
      - 愛称は「スパーズ」、そして「リリーホワイツ」。
      - エンブレムは、**ボールの上に立つ雄鶏**です。
      - 添えられているラテン語は「アウデレ・エスト・ファセレ」。
      - "**あえてやることが、成すことである。**そういう意味です。"
      - 本拠地はクラブと同じ名を冠したスタジアム。収容は**6万2850人**です。
      - 2019年から使っています。それまではホワイト・ハート・レーンでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: cup1901
    heading: リーグに入らないまま、FAカップを獲った
    main: true
    tier: 背景
    telop: 1901年。これ以降、同じ例はない
    narrator: 解説
    card:
      type: table
      title: 最初に立てた記録
      columns: ["", ""]
      rows:
        - ["1901年", "リーグ外のクラブとしてFAカップ優勝"]
        - ["以降", "同じ例は1つもない"]
        - ["1961年", "20世紀で最初の2冠"]
        - ["1963年", "カップウィナーズカップ。英国勢で初"]
        - ["1972年・1984年", "UEFAカップ。2種類目も英国勢で初"]
        - ["2025年", "ヨーロッパリーグ。欧州は4つ目"]
    say:
      # 2026-09-22 流れの点検。「リーグ外」の意味を先に立てる（順番を入れ替え）。
      # カップウィナーズカップに一言、UEFA→ウエファ、冒頭の「ヨーロッパ4回」を
      # 本文で数え切る（1984年のUEFAカップと2025年のヨーロッパリーグ）
      - 1888年に、フットボールリーグができました。
      - それ以来、リーグの外のクラブがFAカップを獲った例は、ひとつだけ。
      # 2026-09-22 2回目。「ひとつだけ」と「並ぶ例がありません」が続けて同じことだったので後半を年だけに
      - "それが1901年のトッテナム。**リーグに属していないまま**の優勝で、125年前のことです。"
      - "1961年には、リーグとカップの両方を獲りました。**20世紀で最初の2冠**です。"
      - "**イギリスのクラブで、ヨーロッパのタイトルを最初に獲ったのもトッテナム**でした。"
      - 1963年のカップウィナーズカップ。国内カップの王者どうしで争った、いまは無い大会です。
      - 1972年にはウエファカップも獲りました。
      - 種類の違うヨーロッパのタイトルを2つ獲ったのも、イギリス勢では最初でした。
      # 2026-09-22 2回目。基礎DATAの「直近のタイトル」の行を落としたので、ここで年を言う
      - ウエファカップは1984年にも獲りました。
      - "そして2025年のヨーロッパリーグで、ヨーロッパのタイトルは**4つ**になりました。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: アーセナルとの、ノース・ロンドン・ダービー
    narrator: 解説
    card:
      type: table
      title: ノース・ロンドン・ダービー
      columns: ["", ""]
      rows:
        - ["1913年", "アーセナルがハイベリーへ移転"]
        - ["距離", "ホワイト・ハート・レーンから4マイル"]
        - ["1919年の投票", "アーセナル18票／トッテナム8票"]
        - ["結果", "1部に選ばれたのはアーセナル"]
        - ["今季", "相手もプレミアリーグにいる"]
    say:
      - "相手は**アーセナル**。**ノース・ロンドン・ダービー**です。"
      - 始まりは1913年。アーセナルが、プラムステッドのマナー・グラウンドからハイベリーへ移ってきました。
      - "トッテナムの本拠地から、わずか**4マイル**の場所です。"
      - 決定的になったのは1919年でした。1部を2つ広げることになり、どのクラブを入れるかが**投票**で決まります。
      - "アーセナルが**18票**、トッテナムが**8票**。選ばれたのはアーセナルでした。"
      - このときの票は、ほかにバーンズリーが5、ウルヴァーハンプトンが4、ノッティンガム・フォレストが3、バーミンガムが2、ハル・シティが1と割れています。
      - "相手は**今季もプレミアリーグにいます。**"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/North_London_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: グリーヴス、ブランチフラワー、ケイン
    narrator: キャスター
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "残した数字"]
      rows:
        - ["ジミー・グリーヴス", "公式戦381試合268得点"]
        - ["ダニー・ブランチフラワー", "公式戦382試合21得点"]
        - ["ハリー・ケイン", "プレミアリーグ317試合213得点"]
    say:
      - 名前を挙げるなら、この3人です。
      - ジミー・グリーヴス。1961年から1970年。公式戦381試合で268得点、ハットトリック15回はクラブ記録です。
      - "在籍中に1部の得点王を**6回**。長いあいだ、クラブ史上いちばん多く点を取った選手でした。"
      - ダニー・ブランチフラワー。1954年から1964年、公式戦382試合21得点。
      - さきほどの1961年の2つのタイトルは、この選手が腕章を巻いていたときのものです。
      - "ハリー・ケイン。2009年から2023年。プレミアリーグ317試合で**213得点**です。"
      - 2023年2月5日、通算**267得点**目でグリーヴスを抜き、記録が入れ替わりました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Jimmy_Greaves
      - https://en.wikipedia.org/wiki/Danny_Blanchflower
      - https://en.wikipedia.org/wiki/Harry_Kane
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 日本代表の高井幸大が所属している
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["日本人選手", "高井幸大（DF・日本／2030年まで）"]
        - ["監督", "ロベルト・デ・ゼルビ"]
        - ["主将", "ファン・デ・フェン（CB・オランダ／25歳）"]
        - ["エース", "リシャルリソン（FW・ブラジル）"]
        - ["今季", "リーグの得点はまだゼロ"]
    say:
      - "日本代表の**高井幸大**が、2025年7月に加入しています。川崎フロンターレからで、2030年までの契約です。"
      - いまはベルギーのシント＝トロイデンへレンタルに出ています。
      - "そのシント＝トロイデンは、**日本のDMM.comが2017年から全株を持っているクラブ**です。"
      - トッテナムの選手が、日本企業の持つクラブでプレーしている、という形になっています。
      - "エースのリシャルリソンは、**今季、リーグでの得点がまだゼロ**です。"
      - ブラジル代表のフォワードで、昨季は12点でした。
      - 主将はミッキー・ファン・デ・フェン。25歳のオランダ人センターバックです。
      - 長く主将だったクリスティアン・ロメロが今夏いなくなり、引き継ぎました。
      - 最初の1点が誰から出るか。そこが今のトッテナムの見どころです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝の直近は1960年から61年。65年前
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "2回（直近 1960-61）"]
        - ["FAカップ", "8回（直近 1990-91）"]
        - ["リーグカップ", "4回（直近 2007-08）"]
        - ["ヨーロッパ", "CWC1回／UEFAカップ・EL3回"]
        - ["2025年", "ヨーロッパリーグ優勝。17年ぶりのタイトル"]
    say:
      - "1部優勝は**2回**。**直近は1960年から61年で、65年前**になります。"
      - FAカップは**8回**、リーグカップは**4回**。
      - ヨーロッパはカップウィナーズカップが1回、UEFAカップとヨーロッパリーグが**3回**。1972年、1984年、そして2025年です。
      - "その2025年のヨーロッパリーグが、**17年ぶり**のタイトルでした。決勝でマンチェスター・ユナイテッドに1対0です。"
      - これで20クラブです。お付き合いいただき、ありがとうございました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
