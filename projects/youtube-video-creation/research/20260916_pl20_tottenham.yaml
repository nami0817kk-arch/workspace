  title: トッテナム・ホットスパー。リーグの外から、FAカップを獲った唯一の年とは
  question: どんなクラブなのか
  # 2026-09-22 流れの点検。タイトル→つかみ→入口の3行が全部「高井がいる」だった。
  # つかみに中身（いつ・どこから）を置く。加入は今季の顔ぶれの節と高井の記事で裏を取った
  hook: 高井幸大は、2025年の夏に川崎フロンターレから来ました。

