# プレミアリーグ20クラブ紹介 ⑳トッテナム・ホットスパー（2026-09-16）
#
# **20クラブの最後。**見本（①ボーンマス）と同じ型で、節は4つ。
# 戦術の節は入れない（2026-09-16 ユーザー決定）。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 引きは**「学校の生徒が作ったクラブが、リーグ外のままFAカップを獲った」**。
# ここが山場（@main）。1888年以降、リーグ外での優勝はこの1回だけ
#
# 2026-09-18 ユーザー指示で書き直した。①「アルファベット順では20番目」を削除し、
# 「最後のクラブ」だけを1行目の引きに残した。②各節の1行目を、その節でいちばん
# 引きの強い事実に入れ替え。③優勝の節は「数えると18個」をやめ、65年の空白から入る
#
# 2026-09-18 追記。①タイトルとサムネを、20本で同じ文面からクラブごとの引きに変えた。
# ②宿敵の節（ノース・ロンドン・ダービー）と「このクラブを語る選手」の節を足した。
# ③高井幸大を最終節の末尾から今季の顔ぶれの1行目へ前出しし、theme.hook にも置いた
#
# 2026-09-19 ユーザー指示「クラブの歴史はもう少しシンプルに」。歴史の節を
# 4節19行 → 2節10行にした。**「ヨーロッパでの最初」は山場の節へ、「17年ぶりの
# タイトル」は「獲ってきたもの」へ1行にまとめた**（節としては落とした）。
# 落としたできごとは「このクラブが最初に名を残した記録です」の言い直しと、
# 2025年の決勝の前に置いていた「記録を持つクラブでも勝てない時期は続きます」の1行
format: news
