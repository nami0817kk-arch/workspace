sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 学校の生徒たちが1882年に作った
    narrator: キャスター
    card:
      type: table
      title: クラブの成り立ち
      columns: ["", ""]
      rows:
        - ["創設", "1882年9月5日（Hotspur F.C.）"]
        - ["改名", "1884年4月"]
        - ["愛称", "Spurs／the Lilywhites"]
        - ["エンブレム", "ボールの上に立つ雄鶏"]
    say:
      - アルファベット順では、20番目。最後のクラブです。
      - 創設は1882年9月5日。作ったのは**学校に通う少年たち**でした。
      - 最初の名前は「ホットスパー」だけ。いまの形になったのは1884年4月です。
      - 愛称は「スパーズ」、そして「リリーホワイツ」。
      - エンブレムは、**ボールの上に立つ雄鶏**です。
      - 添えられているラテン語は「アウデレ・エスト・ファセレ」。
      - "**あえてやることが、成すことである。**そういう意味です。"
      - 本拠地はクラブと同じ名を冠したスタジアム。収容は**6万2850人**です。
      - 2019年から使っています。それまではホワイト・ハート・レーンでした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: cup1901
    heading: リーグに入らないまま、FAカップを獲った
    main: true
    tier: 背景
    telop: 1901年。これ以降、同じ例はない
    narrator: 解説
    card:
      type: table
      title: 最初に立てた記録
      columns: ["", ""]
      rows:
        - ["1901年", "リーグ外のクラブとしてFAカップ優勝"]
        - ["以降", "同じ例は1つもない"]
        - ["1961年", "20世紀で最初の2冠"]
    say:
      - このクラブが最初に名を残したのは1901年です。
      - FAカップを獲りました。そのとき、**リーグには属していませんでした。**
      - 1888年にフットボールリーグができて以降、**リーグ外のクラブが優勝したのは、これだけ**です。
      - 125年経っても、並ぶ例がありません。
      - 1961年には、リーグとカップの両方を獲りました。
      - "**20世紀で最初の2冠**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: europe
    heading: ヨーロッパでの最初
    tier: 背景
    telop: 1963年、イギリス勢で初めて欧州のタイトルを獲った
    narrator: キャスター
    card:
      type: table
      title: ヨーロッパの記録
      columns: ["", ""]
      rows:
        - ["1963年", "カップウィナーズカップ。英国勢で初"]
        - ["1972年", "UEFAカップ。2種類目も英国勢で初"]
        - ["2025年", "ヨーロッパリーグ優勝"]
    say:
      - 1963年、カップウィナーズカップを制しました。
      - "**イギリスのクラブが、ヨーロッパのタイトルを獲った最初の例**です。"
      - 1972年にはUEFAカップも獲りました。
      - 種類の違うヨーロッパのタイトルを2つ獲ったのも、イギリス勢では最初でした。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: recent
    heading: 17年ぶりのタイトル
    tier: 背景
    telop: 2025年、ヨーロッパリーグ決勝でユナイテッドに1-0
    narrator: 解説
    card:
      type: table
      title: 2025年のヨーロッパリーグ
      columns: ["", ""]
      rows:
        - ["空白", "17年"]
        - ["決勝の相手", "マンチェスター・ユナイテッド"]
        - ["結果", "1-0"]
    say:
      - 記録を持つクラブでも、勝てない時期は続きます。
      - トッテナムは**17年**、タイトルから遠ざかっていました。
      - 終わったのは2025年です。ヨーロッパリーグの決勝でした。
      - 相手はマンチェスター・ユナイテッド。1対0で勝っています。

    official: false
    sources:
      - https://en.wikipedia.org/wiki/Tottenham_Hotspur_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はファン・デ・フェン
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ロベルト・デ・ゼルビ"]
        - ["主将", "ファン・デ・フェン（CB・オランダ／25歳）"]
        - ["エース", "リシャルリソン（FW・ブラジル）"]
        - ["昨季", "リーグ11点・全12点"]
        - ["今季", "リーグの得点はまだゼロ"]
    say:
      - 主将はミッキー・ファン・デ・フェン。25歳のオランダ人センターバックです。
      - 長く主将だったクリスティアン・ロメロが今夏いなくなり、引き継ぎました。
      - エースはリシャルリソン。ブラジル代表のフォワードで、昨季は12点。
      - ただし**今季、リーグでの得点はまだゼロ**です。
      - 最初の1点が誰から出るか。そこが今のトッテナムの見どころです。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝2回（直近 1960-61）、FAカップ8回（直近 1990-91）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "2回（直近 1960-61）"]
        - ["FAカップ", "8回（直近 1990-91）"]
        - ["リーグカップ", "4回（直近 2007-08）"]
        - ["ヨーロッパ", "CWC1回／UEFAカップ・EL3回"]
    say:
      - 数えると、大きなタイトルで**18個**です。
      - 1部優勝2回、FAカップ8回、リーグカップ4回。
      - ヨーロッパはカップウィナーズカップが1回、UEFAカップとヨーロッパリーグが**3回**。
      - 1972年、1984年、そして2025年です。
      - "ただし**1部優勝の直近は1960年から61年**。65年前になります。"
      - 最後に、日本との関わりを1つ。
      - "日本代表の**高井幸大**が、このクラブの選手です。"
      - 2025年7月、川崎フロンターレから2030年までの契約で加わりました。
      - いまはベルギーのシント＝トロイデンへレンタルに出ています。
      - "そのシント＝トロイデンは、**日本のDMM.comが2017年から全株を持っているクラブ**です。"
      - トッテナムの選手が、日本企業の持つクラブでプレーしている、という形になっています。
      - これで20クラブです。お付き合いいただき、ありがとうございました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
