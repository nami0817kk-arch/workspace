  - id: minutes
    main: true
    heading: 今季は10分だけ
    tier: 報道
    telop: 公式戦7試合で出場10分
    narrator: キャスター
    card:
      type: table
      title: 伊藤洋輝の今季（バイエルン）
      columns: [大会, 出場]
      rows:
        - [ブンデスリーガ, 0分]
        - [チャンピオンズリーグ, 10分]
        - [ドイツ杯, 0分]
        - [スーパーカップ, 0分]
    say:
      - text: 日本代表のセンターバック、伊藤洋輝。バイエルンが冬に売ることを考えている、と報じられました。
        short_only: true
      - 今季、バイエルンの公式戦は7試合。伊藤は、すべてベンチには入っています。
      - それでも出たのは、チャンピオンズリーグの1試合、80分からの**10分**だけ。
      - ブンデスリーガでは、まだ1分も出ていません。
      - センターバックは、ウパメカノとターが先発で、キム・ミンジェが3番手。
      - 伊藤は4番手と見られています。
    sources:
      - https://tmapi-alpha.transfermarkt.technology/player/353892/performance-game?season=2026
      - https://www.goal.com/de/meldungen/kein-grosses-thema-christoph-freund-widerspricht-max-eberl-bei-angeblichem-transferkandidat-des-fc-bayern/blt2b198d1c2c58209c
      - https://www.4-4-2.com/bundesliga/fc-bayern-munchen/fc-bayern-hiroki-ito-entscheidung-getroffen/
  - id: past
    heading: 2年で重なったけが
    tier: 報道
    telop: 移籍金2350万ユーロ、契約は2028年まで
    narrator: キャスター
    say:
      - 伊藤は2024年の夏、シュツットガルトから**2350万ユーロ**で加入しました。
      - ところが、その夏の練習試合で足の甲の骨を折ります。
      - それからも、同じ場所のけがが続きました。
      - 日本代表では、9月24日のウルグアイ戦に先発し、最後まで出ています。
    sources:
      - https://www.transfermarkt.de/hiroki-ito/verletzungen/spieler/353892
      - https://news.at-s.com/article/2063014
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「冬に移籍できるなら試合でれるとこに」
    narrator: キャスター
    say:
      - voice: ネット民
        text: 伊藤洋輝ほんとクラブで試合にでれてないの勿体ないな､､､ほんといい選手なのに。
        short_voice: true
      - voice: ネット民
        text: 冬に移籍できるなら試合でれるとこに移籍してほしいな
        cont: true
        short_voice: true
      - voice: ネット民
        text: 伊藤洋輝はバイエルンを出るべきなのでは？
      - voice: ネット民
        text: 試合に出ないとドンドン試合勘も錆び付いていく。
      - voice: ネット民
        text: 絶対王者のバイエルンだと、毎年スーパーな新加入選手も居るし、実績のない状態だと調子が戻って来るまで待ってもらえない。
        cont: true
      - voice: ネット民
        text: ここはスパッと切り替えて試合に出れるクラブに移籍するのがいいと思うのですが・・・
        cont: true
      - voice: ネット民
        text: トップチームのCBはウパメカノ、ター、ミンジェしかいなくない？そんな状態で伊藤を売ることはできんわな
      - voice: ネット民
        text: 上振れも少ないけど下振れもなく、良くも悪くも堅実という感じで大崩れはしないし。
        cont: true
      - voice: ネット民
        text: 伊藤洋輝が移籍？誤植か…しかし久保建英は序列下がったとか心配されてるのに同じ日本代表なのに伊藤洋輝の方は誰も心配してない…
      - voice: ネット民
        text: 今季は明らかに序列落ちの1試合出場 10数分しかプレーしてないのよ
        cont: true
      - voice: ネット民
        text: 日本のDFの要なのに不思議なくらい無視されてるの怖いわ
        cont: true
