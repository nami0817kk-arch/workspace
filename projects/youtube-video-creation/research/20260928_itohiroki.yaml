sections:
  - id: report
    heading: 冬に手放す考え
    tier: 報道
    telop: バイエルン、伊藤を冬に売却する考えと報道
    narrator: キャスター
    say:
      - text: 日本代表のセンターバック、伊藤洋輝。
        image: assets/images/20260928_ito_geki/01.jpg
      - 所属するバイエルンが、冬の移籍市場で手放すことを考えている、とドイツで報じられました。
      - 1月に合うオファーが来なければ、契約が残り1年になる来年の夏に売る、という見方です。
      - 契約は2028年の6月までです。
      - クラブの発表ではありません。
      - text: 9月の初めには、クラブのスポーツディレクター、フロイントがこう話していました。
        image: assets/images/20260928_pair_freund_ito/01.jpg
      - voice: クリストフ・フロイント
        text: 伊藤洋輝について、急を要する動きはない。洋輝はうちに残るという前提で計画している
      - text: その3週間後に、この報道です。
        image: assets/images/20260928_ito_geki/01.jpg
    sources:
      - https://www.kicker.de/fuenf-bayern-profis-im-fokus-der-stand-bei-ito-boey-und-co-1255634/artikel
      - https://www.fussballtransfers.com/a5843758260632671537-bericht-bayern-beschliesst-ito-verkauf
