      - text: 絡んだ点の数は8と9。昨季の8つの差は、1つまで縮まりました。
        image: assets/images/20261109_compare_406635_607223/pair_b/01.jpg
        card: none
      - text: 昨季とは逆に、今季はフォーデンのほうが、約12分速く点に絡んでいます。
        image: assets/images/20261109_compare_406635_607223/pair_c/01.jpg
        card: none
    sources:
