#   市場価値はフォーデンが 2024-05 の 1億5000万€（最高）から 6500万€、シェルキは 2025-06 の 4500万€ から 1億1000万€（最高）。2026年に入って逆転。比べる軸が立つ。
#   重なり：scripts/*compare*・posted.json・covered.yaml・scripts/2026100[7-9]〜202611* を grep。フォーデンは直近30日に名前すら無い。シェルキは試合ニュースで名前が出るだけ（10/29 ブライトン戦のPKの回など）。2人の比べ・選手紹介は無い。
#   picks（research/20261109_picks.txt）：11/9 の選手紹介はヴシュコヴィッチ、スタジアムはサン・マメス、ユニフォームはレアル。人名は重ならない。
#   **外した候補**：デ・ブライネ×モドリッチ（モドリッチは 11/8 のクロアチア代表の回の主役級）・エンソ×マック・アリスター（10/23 アルゼンチン代表の回の看板選手）・ギョケレシュ×セシュコ（セシュコの今季は206分で 450分に届かない）・
#   サラー／レオン（今季はトルコ＝扱う7リーグの外。11/7 の担当の控え）・クヴァラツヘリア（長期離脱。11/7 の担当の控え）・エキティケ（今季0分）。
# **2人とも今季も扱うリーグの1部**：シティ（プレミア）。ESPN の日程で確かめた（research/raw/20261109_mancity_espn_schedule.json）。
#   **注意**：11/7（日本時間11/8 2:30）にアウェーのフォレスト戦がある。公開（11/9）の時点では1試合ぶん古い。台本は「11月6日までの数字」と言い、次の試合の日程は言わない。
# **使った数**（TM の performance-season。クラブのトップチームの公式戦＝リーグ・CL・FAカップ・リーグカップ・コミュニティシールド・スーパーカップ・クラブW杯。**代表戦・五輪・ユースは混ぜない**）
#   フォーデン：23/24 53試合 4276分 27点13A（GB1 35/2871/19/8・CL 8/684/5/3・FAC 5/436/2/1・KLUB 2/146/1/1・USC 1/90・GBCS 1/32・CGB 1/17）
