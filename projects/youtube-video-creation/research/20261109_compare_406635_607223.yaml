    say:
      - text: 見立てです。昨季は、シェルキが約65分速く点に絡み、市場価値も上回りました。
        image: assets/images/20261109_compare_406635_607223/c1/01_b.jpg
        card: {<<: *viewcard, highlight_row: 昨季に1つ絡むまで}
      - text: 今季は、その前後が入れ替わりました。
        mark: {kind: circle, row: 1}
        image: assets/images/20261109_compare_406635_607223/f2/01_b.jpg
        card: {<<: *viewcard, highlight_row: 今季に1つ絡むまで}
      - text: 今季のフォーデンは、2023年から24年の季の約107分より、約16分速いペース。
        emph: true
        image: assets/images/20261109_compare_406635_607223/f3/01_w.jpg
        card: none
      - text: 一方で市場価値は、いまもシェルキが上。
        image: assets/images/20261109_compare_406635_607223/c1/01_b.jpg
        card: {<<: *viewcard, highlight_row: いまの市場価値}
      - text: 点に絡む速さと値段の並びが、別々の向きに動く2人。この先も注目です。
        image: assets/images/20261109_compare_406635_607223/pair_c/01.jpg
        card: none
