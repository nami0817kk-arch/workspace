  - id: view
    heading: 見立て・昨季の65分差は、今季どこまで縮んだのか
    tier: 背景
    viewpoint: true
    narrator: 解説
    telop: 数字の違いが示すもの
    card: &viewcard
      type: duel
      left: {name: フォーデン, club: マンC, photo: assets/images/20261109_compare_406635_607223/f1/01_sq.jpg, color: "#6cabdd"}
      right: {name: シェルキ, club: マンC, photo: assets/images/20261109_compare_406635_607223/c1/01_sq.jpg, color: "#e8b400"}
      rows:
