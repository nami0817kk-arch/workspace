  - https://www.fcbarcelona.com/en/card/2214377/leo-messi
- id: view
  viewpoint: true
  heading: 見立て・同じ9シーズンに絞ると、差はどう縮むのか
  tier: 背景
  telop: 全体の差は0.17。同じ9シーズンなら0.04。リーグ戦は1.07と1.06
  narrator: 解説
  card: &view_table
    type: table
    title: 1試合あたりの得点（自分で数えた）
    columns:
    - 数える範囲
    - ロナウド
    - メッシ
    rows:
    - - クラブでの全シーズン
      - '1.03'
      - '0.86'
    - - メッシの最初の4シーズンを除く
      - '1.03'
      - '0.94'
    - - 同じ9シーズン（2009-10〜）
      - '1.03'
      - '0.99'
    - - 同じ9シーズンのリーグ戦
      - '1.07'
      - '1.06'
    note: 全大会。同じ9シーズンは2009-10から2017-18まで
  say:
  - text: 最後に、数える期間をそろえて、数え直します。
    image: assets/images/20261017_messi/03.jpg
    card: none
  - text: 1つ目は、在籍した全シーズン。1.03と0.86です。
    image: assets/backgrounds/pitch.png
    card:
      <<: *view_table
      highlight_row: 0
  - text: メッシは17歳で、トップチームに出始めました。
    card: none
    image: assets/images/20261017_messi/04_w.jpg
  - text: その最初の4シーズンは、110試合で42点です。
    image: assets/backgrounds/pitch.png
    card:
      <<: *view_table
      highlight_row: 1
  - text: この4シーズンを除くと、668試合で630点。0.94になります。
    card:
      <<: *view_table
      highlight_row: 1
  - text: 2つ目は、ロナウドと同じ9シーズン、2009-10から2017-18です。
    card:
      <<: *view_table
      highlight_row: 2
  - text: 2人は、同じ時期に、同じラ・リーガでプレーしていました。
    card:
      <<: *view_table
      highlight_row: 2
  - text: メッシは、この9シーズンで476試合472点。割ると0.99です。
    card: &view_calc
      type: calc
      title: メッシの同じ9シーズン（自分で割った）
      terms:
      - ['472点', 2009-10から2017-18の得点]
      - ['476試合', 同じ9シーズンの試合数]
      - ['0.99', 1試合あたり]
      ops: ['÷', ＝]
    emph: true
  - text: ロナウドの1.03との差は、0.04まで縮みます。
    card:
      <<: *view_table
      highlight_row: 2
    mark: {kind: circle, row: 2, col: メッシ}
  - text: 得点そのものは、この9シーズンだと、メッシがロナウドより21点多くなります。
    card: *view_calc
  - text: リーグ戦だけなら、1.07と1.06。ほぼ同じ数字です。
    card:
      <<: *view_table
      highlight_row: 3
    emph: true
  - text: 全体の差は約0.17。そのうち約0.13は、期間をそろえると消えます。
    card: *view_table
  - text: 差の大部分は、数える期間の違いから来ています。
    card: *view_table
    emph: true
  - text: どの数え方でも、1試合あたりはロナウドが上。
    card: *view_table
  - text: メッシは17シーズンかけて、1試合に0.86点を積み上げました。
    image: assets/images/20261017_messi/01_w.jpg
    card: none
  - text: 総数ならメッシ、率ならロナウド。物差しで、景色が変わります。
    card: none
  sources:
