# 取材メモ（10/17 土、シリーズ「記録の解説」、key: record_ronaldo_messi、型は news）。
# ロナウドのレアル・マドリード × メッシのバルセロナを、クラブでの得点を**1試合あたり**に直して比べる。
#
# ★**物差し（冒頭で言う）**：「クラブの**全大会の公式戦**の得点 ÷ 試合数」。リーグ・国王杯・ヨーロッパの大会・スーパーカップ等を全部足す。
#
# ★**数字の出どころ（2026-10-17 に原文を読み直した）**
#   ・ロナウド（クラブ公式 realmadrid.com 英語版・スペイン語版の「Football legends」ページ。原文を読んだ）：
#       **438 competitive appearances / 451 goals**（312 LaLiga・105 Champions League・22 Copa del Rey・6 Club World Cup・4 Supercopa de España・2 UEFA Super Cup）。
#       公式は「averaging over a goal a game」と書く。9シーズン、1シーズン最多 61、CL 105。
#       **指示の「450得点」とは1点違う**：英語版ウィキペディアの一覧は 438試合450得点（リーグ311）。クラブ公式は451（リーグ312）。
#       AP などの報道は 451/438。**台本はクラブ公式の451を使い、450との食い違いを1か所で断る**（どちらでも1試合あたり 1.03）。
#   ・メッシ（クラブ公式 fcbarcelona.com の選手ページ「Leo Messi」。原文を読んだ）：**778 appearances / 672 goals**、
#       リーグ 474点・520試合、タイトル 35（CWC3・CL4・UEFAスーパーカップ3・リーグ10・国王杯7・スペイン・スーパーカップ8）。
#       公式は「Top goalscorer in a season in official competition (73 goals in 2011/12)」。AP 配信（2021-08）も 672/778、リーグ 474/520。
#   ・**大会別の「試合数」**はクラブ公式ページに無いので、英語版ウィキペディアの Career statistics の表を読んだ
#       （ロナウド：リーグ292・国王杯30・欧州101・その他15＝438。メッシ：リーグ520・国王杯80・欧州149・その他29＝778。合計は両方クラブ公式と一致）。
#       **シーズンごとの得点**もウィキペディアの表（ロナウドの合計は450、メッシは672）。確度は 報道。
#   ・Transfermarkt：試した（leistungsdatenverein）が、取得した本文にレアルの行が出なかった（動的読み込み）。連続取得はしていない。**使っていない**。
#   ・BBC：WebSearch が BBC を引けず、2018年・2021年の記事は見つからなかった。**BBC の原文は読めていない**（言っていない）。UEFA の公式ページも読んでいない。
#
# ★**自分で数えたもの（コードで検算済み）**
#   1試合あたり：ロナウド 451÷438＝1.0297（約1.03）／メッシ 672÷778＝0.8638（約0.86）。比 1.19倍。（450÷438＝1.0274＝1.03）
#   大会別（得点÷試合）：リーグ 312÷292＝1.07（Wikipediaの311なら1.065）、474÷520＝0.91／CL 105÷101＝1.04、120÷149＝0.81／国王杯 22÷30＝0.73、56÷80＝0.70／その他 12÷15＝0.80、22÷29＝0.76。
#     4つとも ロナウドが上。差が大きいのは CL（約0.23）、リーグ（約0.16）。
#   在籍：ロナウド 9シーズン（2009-10〜2017-18。入団24歳）／メッシ 17シーズン（2004-05〜2020-21。トップに出始めたのは17歳）。
#   メッシの最初の4シーズン（2004-05〜2007-08）：110試合42点（9+25+36+40、1+8+17+16）。これを除くと 668試合630点＝0.943。
#   **同じ9シーズン（2009-10〜2017-18。2人は同じラ・リーガにいた）**：メッシ 476試合472点＝0.992（ロナウド 438試合451点＝1.030）。差は約0.04（比1.04倍）。
#     同9シーズンのリーグ戦：メッシ 309試合329点＝1.065、ロナウド 1.065〜1.069（312÷292）。**ほぼ同じ**。
#     全体の差（1.030−0.864＝0.166）のうち、期間をそろえると 0.128 が消える（残り0.038）。
#   50点以上のシーズン：ロナウド 6（2010-11〜2015-16。9シーズン中）／メッシ 6（17シーズン中。2010-11・11-12・12-13・14-15・16-17・18-19）。
#   タイトル：ロナウド 16（4+3+3+2+2+2）／メッシ 35。1シーズンあたり 16÷9＝1.78、35÷17＝2.06。
#   得点の総数の差 672−451＝221、試合数の差 778−438＝340。
#   ※「メッシが451点に届くのは何試合目か」のような割り戻しは言っていない（仮定の数字になるため）。
#
# **言い切っていないもの**：大会別の試合数は Wikipedia のみ（クラブ公式に無い）。ロナウドのシーズン別得点は450基準（451との1点の出どころは不明）。
#   タイトルの個数はクラブ公式のリスト（カタルーニャのカップは数えない。バルサ公式は「35」と書く）。
#   「どちらが上か」は数字で言うが、**強み・弱みの価値判断はしていない**。メッシの若い時期は「小さく見せる」言い方を避け、「17歳で出始めた」と事実で言う。
# 反応・本人の言葉は入れない（voice_min: 0）。ブラウザの道具・JavaScript は使っていない（requests と WebSearch のみ）。
#
# ★写真（目で見た）：
#   ロナウド：Commons の File:Cristiano Ronaldo (163461621).jpeg（CC BY 3.0、Oleg Dubyna。2015年11月、CLのシャフタール戦、レアルの白いユニフォーム。横にナチョ）。
#     01_w（1920x1080）・01_v。もう1枚 File:...(163461623).jpeg（同じ試合の横顔。**500px の透かしが左下にあるので、透かしの無い右側を 02_w（1200x675）に切った**。1.6倍まで）。
#     クラブ公式（realmadrid.com）の写真は小さな顔写真（550x650）しか取れず使っていない。**2015年と古い（ほかに使える高解像度の写真が取れなかった）。**
#   メッシ：FCバルセロナ公式サイトの写真5枚（クラブ公式。代理店の透かしなし）。01＝2009年のゴール後のキス（01_w 1600x900）、02＝2009-10の笑顔（02_w、3106px）、
#     03＝2013-14（顔検出できず、そのまま）、04＝若い頃の喜び、05＝3つのトロフィー（2009）、06＝2020-21。
#   2人を並べた pair（assets/images/20261017_pair/01.jpg）：レアルの白とバルサの赤青。
