# 代表チーム紹介 アルゼンチン代表（10/23 作成。固定シリーズ9「代表チーム紹介」。見本は 10/22 のスペイン代表）。7節：フック→基礎DATA（板）→歴史と転機（年表）→看板選手（表）→日本との関係→いまのチーム→見立て。
# **軸（2026-10-23）**：「2022年に優勝し、2026年に準優勝。数字では何が違ったのか」。10/7 のメッシ引退の回（scripts/20261007_messi_farewell.md）・スカローニの契約の回（9/12）とは重ねない（紹介ものではない）。
# **重なりの確認（2026-10-23）**：research/posted.json・covered.yaml にアルゼンチン代表の紹介は無い（covered は 9/12 スカローニ契約・9/26 メッシ最後の代表戦の一枚の2本。ニュース）。scripts/ に team_argentina は無い。直近30日に人名・クラブ名が重なる紹介ものは無い（ロメロ・エンソ等の選手紹介も無し）。
# ---- 確かめたこと（2026-10-23。WebFetch・requests。検索のAI要約は根拠にしていない）----
#  ・FIFAランク：FIFA 公式（inside.fifa.com/en/news/coca-cola-mens-world-ranking-october-2026-portugal-spain、2026-10-07）＝1位スペイン・2位アルゼンチン・3位フランス（10/22 のスペイン回で確認済み）。点数は書かない。
#  ・日本との対戦：日本代表の試合記録（Wikipedia en の Japan national football team results 1990–1999・2000–2009・2010–2019・2020–present の生の表を ARG で拾った。WebFetch の要約は2010年を「負け」と誤っていたので使わず、生の表を読んだ）。2010-10-08 のスコアは JFA（https://www.jfa.jp/samuraiblue/schedule_result/2010.html）の「○1-0」でも確認した。
#     1992-05-31 東京 キリンカップ 0-1／1995-01-08 リヤド キング・ファハド杯 1-5／1998-06-14 トゥールーズ W杯 0-1／2002-11-20 埼玉 親善 0-2／2003-06-08 大阪 キリンカップ 1-4／2004-08-18 静岡 親善 1-2／2010-10-08 埼玉 親善 1-0。＝7試合1勝6敗・4得点15失点（検算した）。2010年以降、2026-10-06 までに日本対アルゼンチンの試合は無い（2010–2019・2020–present の表に ARG は2010年の1行だけ）。**JFA の通算対戦成績は取れていない**ので「1990年以降の記録で7試合」と言い、通算とは言わない。1998年のアルゼンチンの得点はバティストゥータ（Wikipedia 1998 Group H の記述。分は言わない）。2010年の得点者・2022年大会との関係は言わない。
#  ・W杯の成績（Wikipedia en の Argentina at the FIFA World Cup の生の表）：優勝 1978（決勝オランダ3-1）・1986（西ドイツ3-2）・2022（フランス3-3、PK4-2）、準優勝 1930（ウルグアイ2-4）・1990（西ドイツ0-1）・2014（ドイツ延長0-1）・2026（スペイン延長0-1）。決勝は7回。2022年の決勝のアルゼンチンの得点者はメッシ2・ディ・マリア1。決勝の主将は 1986 マラドーナ、2014・2022・2026 メッシ。2014 準決勝はオランダと0-0（延長）PK4-2。
#  ・2022年W杯（7試合）：サウジアラビア1-2、メキシコ2-0、ポーランド2-0、R16オーストラリア2-1、QFオランダ2-2（延長）PK4-3、SFクロアチア3-0、決勝フランス3-3（延長）PK4-2＝15得点8失点（PK戦を除く）、延長にもつれたのは2試合でどちらもPK戦で勝ち。決勝トーナメント4試合＝10得点6失点。
#  ・2026年W杯（8試合）：アルジェリア3-0、オーストリア2-0、ヨルダン3-1、R32カーボベルデ3-2（延長）、R16エジプト3-2、QFスイス3-1（延長）、SFイングランド2-1、決勝スペイン0-1（延長）＝19得点8失点、7勝1敗。延長は3試合（2勝1敗）、PK戦は無し。決勝トーナメント5試合＝11得点7失点。
#  ・自分で割った数：1試合あたり 2022年 得点15÷7=2.14・失点8÷7=1.14／2026年 得点19÷8=2.38（2.375）・失点8÷8=1.00。
#  ・W杯後の親善試合（Wikipedia en の Argentina results 2020–present）：2026-09-30 ボリビア4-0、10-03 ブルキナファソ7-0、10-06 ベナン3-0＝3試合14得点0失点。会場・得点者は言わない。次の試合の日程は取れていない（表に10/6 のあとの行が無い）ので言わない。
#  ・メッシ：2026-10-06 に代表引退（Wikipedia en の Lionel Messi）。代表の最多出場208試合・最多得点126（Argentina national football team の infobox・名簿 2026-10-03 時点）。主将はクリスティアン・ロメロ（同 infobox）。監督はリオネル・スカローニ、2018年から（Wikipedia en。契約の話は言わない）。コパ・アメリカの優勝は「最多の16回」（同）。愛称ラ・アルビセレステ＝白と空色。
#  ・名簿・年齢：Wikipedia の代表名簿（2026-10-03 時点）。生年月日から2026-10-23 時点で計算（ロメロ 1998-04-27=28、エミリアーノ・マルティネス 1992-09-02=34、エンソ・フェルナンデス 2001-01-17=25、マック・アリスター 1998-12-24=27、フリアン・アルバレス 2000-01-31=26、ラウタロ・マルティネス 1997-08-22=29）。所属も同名簿（ロメロ・アルバレス＝アトレティコ・マドリード、E・マルティネス＝チェルシー、エンソ＝マンチェスター・シティ、マック・アリスター＝リヴァプール、ラウタロ＝インテル）。
# ---- 言わないもの ----
#  ・背番号／私生活／メッシの引退の理由／監督の契約／戦術の説明／日本戦の通算（JFA 未確認）／次の試合の日程／選手の怪我／ジャージの話。
