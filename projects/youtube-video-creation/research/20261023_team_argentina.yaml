        - 3試合
        - 延長で2勝1敗
  - text: 2022年は、4試合のうち2試合が延長で、どちらもPK戦に勝ちました。
    card:
      <<: *id_vp2
      highlight_row: 0
  - text: 2026年は、5試合のうち3試合が延長。2試合は勝ち、決勝は0対1でした。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 3
    card:
      <<: *id_vp2
      highlight_row: 1
  - text: 数字の上では、2026年のアルゼンチンも、2022年と同等か、それ以上でした。
    image: assets/images/20261023_team_argentina/a04_messi2_w.jpg
    card: none
  - text: 優勝と準優勝を分けたのは、平均の数字ではなく、決勝の延長の1失点でした。
    card: none
  - text: 確かめるのは、メッシが代表を退いたあとの、これからの公式戦です。
