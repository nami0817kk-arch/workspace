  say:
  - text: 見立てに入ります。比べる数字は2つ。まず、2つの大会の全体を見ます。
    card: *id_vp
  - text: 2022年は、7試合で15得点8失点。1試合の平均は、得点2.14、失点1.14。
    card:
      <<: *id_vp
      highlight_row: 0
  - text: 2026年は、8試合で19得点8失点。得点は2.38、失点は1.00です。
    emph: true
    mark:
      kind: circle
      row: 1
      col: 2
    card:
      <<: *id_vp
      highlight_row: 1
  - text: 平均で見れば、2026年のほうが、得点は多く、失点は少ない大会でした。
    emph: true
    card: none
  - text: 次は、決勝トーナメントの延長戦。
    image: assets/images/20261023_team_argentina/a09_egypt_w.jpg
    card: &id_vp2
      type: table
      title: 決勝トーナメントのアルゼンチン
      columns:
