    card:
      <<: *id_nw
      highlight_row: 1
  - text: 10月6日は、ベナンに3対0の勝ちでした。
    image: assets/images/20261023_team_argentina/a01_messi_w.jpg
    card:
      <<: *id_nw
      highlight_row: 2
  - text: メッシにとっては、これが代表の最後の試合でした。
    emph: true
    card: none
  - text: 3試合で14得点。1試合の平均は4.7点で、失点は0。
    card: *id_nw
  - text: メッシが退いたあとも、率いるのはスカローニ監督。主将はロメロです。
    image: assets/images/20261023_team_argentina/a03_scaloni_w.jpg
    card: none
