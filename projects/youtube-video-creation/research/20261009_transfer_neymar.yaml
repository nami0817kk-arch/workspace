      type: calc
      title: 1試合あたりの違約金
      terms:
      - ['2億2200万ユーロ', 違約金]
      - ['173試合', パリでの出場]
      - ['約128万3000ユーロ', 1試合あたり]
      ops: ['÷', ＝]
  - text: 1試合あたり、およそ128万3000ユーロ。
    card: *after_calc
  - text: 1ゴールあたりなら、およそ188万1000ユーロです。
    card: *after_calc
  - text: 2017年8月3日の為替、1ユーロ130円91銭で円に直すと、
    card: &after_then
      type: convert
      title: 1試合あたりを円に（移籍の当日の為替）
      from: ['128万3000', ユーロ, 1試合あたり]
      to: ['約1億6800万', 円, 2017年8月3日]
      via: 1ユーロ＝130.91円
  - text: 1試合で、およそ1億6800万円になります。
    card: *after_then
  - text: いまの為替、1ユーロ176円85銭なら、
    card: &after_now
      type: convert
      title: 1試合あたりを円に（いまの為替）
      from: ['128万3000', ユーロ, 1試合あたり]
      to: ['約2億2700万', 円, 2026年10月7日]
      via: 1ユーロ＝176.85円
  - text: 同じ1試合が、およそ2億2700万円に変わります。
    card: *after_now
  - text: 本人の値段はその後も動きます。2023年、アル・ヒラルへ9000万ユーロ。
    card: none
  - text: 2025年にサントスへは、移籍金なしで戻りました。
  - text: もう1つ、2017年の払い方そのものが、いまもフランスで調べられています。
  - text: 本人がバルセロナに払い、クラブがそれを本人に戻す形でした。
  - text: この戻しが給与の前払いにあたれば、税と社会保険料がかかります。
  - text: 給与から先に引かれる税は40%。8800万ユーロが払われずに済んだとされ、
  - text: フランスの金融検察が2020年から調べています。結論は、まだ出ていません。
