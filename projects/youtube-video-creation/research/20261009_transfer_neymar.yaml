# 2026-10-08 流れの点検（output/flow/20261009_transfer_neymar.md）を反映。
#   事実の誤りは無かった（割り算・倍率・換算はすべて材料と一致）。直したのは流れと言い回し：
#   ②に2位の額（1億8000万ユーロ）を入れた（「4200万の差」が耳で出せなかった）／
#   「違約金」「連帯貢献金」「供託」「源泉徴収」「パルク・デ・プランス」「ヨーロッパの財務の決まり」に一言の説明を足した／
#   「1年以内に契約すれば」の主語の入れ替わりを直した／④の為替からその後の移籍へのつなぎを足した／
#   「いまもそこにいます」は⑤と同じなので落とした／④から⑤へ話が戻ることを言う言葉を足した／
#   ⑤の「5人ではなく5件です」の行を落とした（表の数え方の但し書きで、聞くと逆に混乱する）。
# 移籍の深掘り 第1回：ネイマール バルセロナ → パリ・サンジェルマン（2017年）。10/9 公開。
# 材料の控えは research/raw/20261009_transfer_neymar_material.md。**材料から出ない。**
# **このシリーズ（毎日の枠8）の1本目。節の並びがこれから何十本ぶんの雛形になる。**
#   ①オープニング（一言→題→引き）②金額の中身（main・頭に強い一点・waterfall・読み上げは5行）
#   ③どう払ったか（この回の芯・勅令1006/1985 第16条・timeline）④その後どうなったか（calc と convert）
#   ⑤見立て（歴代上位の table ＋ calc。市場に何をしたか）
# いちばん強い一点：2億2200万ユーロはいまも歴代1位で、2位のエムバペ1億8000万に9年たっても抜かれていない。
# **クラブが公表した額と、報じられただけの額を言い分ける**（材料 0 の表）:
#   クラブ公表＝違約金 2億2200万ユーロ（バルセロナ公式 2017-08-03 と同クラブの決算）。
#   報じられた額＝パリ・サンジェルマンの支出 2億5200万ユーロ（代理人2人に1070万ずつ、連帯貢献金870万）。
#   **パリ・サンジェルマンは内訳を一度も公表していない**ので「クラブが発表した」とは言わない。板にも「報道」と書く。
# **仏金融検察の捜査は「捜査中」までしか言わない**（材料 2-3 の注意）。脱税と断定しない。確度は④の「報道」に置く。
#   ④で読むのは「給与の前払いにあたるのではないか」「源泉徴収40%＝8800万ユーロが払われずに済んだとされる」
#   「2020年から調べている」「結論はまだ出ていない」の4点まで。政治家の名前は出さない。
# スペインの税（IRPF）は、2017年当時どちらの扱いだったかを確定できなかった（材料 2-4）ので**台本に出さない**。
# 2600万ユーロの更新ボーナスの裁判（材料 1-3）は違約金の内訳ではないので**入れない**。年俸も使わない（公式が無い）。
# 為替は ECB 参照相場。2017-08-03＝1ユーロ130.91円、2026-10-07＝176.85円。**どちらの為替かを必ず言う**（④の換算の板2枚）。
#   1ドル換算は使わない（当時の各紙が $262m/$263m/$257m で食い違う）。⑤の FIFA の 63億7000万ドルは FIFA 自身の単位なのでそのまま。
# 自分で割った数：2億2200万 ÷ 173試合 ＝ 約128万3000ユーロ／2億2200万 ÷ 118ゴール ＝ 約188万1000ユーロ／
#   222 ÷ 105（ポグバ）＝ 約2.11倍／180 ÷ 222 ＝ 81%／400（デンベレの条項）÷ 222 ＝ 約1.8倍／
#   128万3000 × 130.91 ＝ 約1億6800万円／128万3000 × 176.85 ＝ 約2億2700万円。
# ⑤の表は **4位が1億4500万ユーロで2件並ぶ**ので「上位5人」と言わず「上位5件」と読む（材料 5 の注）。
#   Transfermarkt の額は成功報酬の達成分を含むので「報じられた額」と言う（デンベレはバルサ公式が1億500万＋成功報酬）。
# 数字の重なり対策（別の節で同じ数字を読まない）：『2億2200万ユーロ』は②だけ。③④⑤では「違約金」「2017年に付いた値段」で受ける。
#   『1億8000万ユーロ』は②だけ（⑤は「81%」で受ける）。『173試合』『118ゴール』は④だけ。
#   **題には金額を入れない**（題と節で同じ数字を読むと draft が止まる）。
# 板：②waterfall（違約金＋内訳）③timeline（6行）④stats・calc・convert2枚 ⑤table・calc。書き込み（赤ペン）は使っていない。
# 写真：Commons の2枚だけ。01（CC BY-SA 2.0 / Balkan Photos、2018年、パリ・サンジェルマン時代の試合前）＋ facecrop の 01_w / 01_v。
#   **板の下地はカンプ・ノウの客席**（assets/backgrounds/stadium_バルセロナ_in.png。顔が無いので板が顔にかからない）。
#   入れ替えは1回（①②＝01_w → ③以降＝カンプ・ノウ）。代理店の写真は使っていない。サントスのエンブレムは手元に無いので出さない。
#   **見逃し**：01_w は本人が遠く、顔が約124px。冒頭の顔の判定（facecheck）で「顔なし」と出るかもしれない。preview4 で見ること。
# 声：テバス（リーガ会長）の1件だけ。山場の節に声は無いが、シリーズの回なので本編の46秒の決まりは見ない。
# サムネ：構図 number（2億2200万ユーロの数字が主役）。10/8 のリヴァプールが scene、それ以外は classic なので3回続きにならない。
