  say:
  - text: ネイマールは、ここから6シーズンをパリで過ごします。
    card: *after_board
  - text: 公式戦173試合で118ゴール。1シーズンあたり29試合、20ゴールの計算です。
    card: *after_board
  - text: 獲ったタイトルは13。ただし、チャンピオンズリーグはありません。
    emph: true
    card: *after_board
  - text: クラブがこの移籍で狙っていたのが、まさにその大会でした。
    card: *after_board
  - text: 違約金を、出場した試合の数で割ってみます。
