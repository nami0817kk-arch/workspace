- id: how
  heading: 払ったのは、クラブではなく本人だった
  tier: 確定
  official: true
  telop: スペインの勅令1006号 第16条。選手が自分の意思で契約を切り、補償金を自分で払う
  narrator: 解説
  card: &how_board
    type: timeline
    title: 2017年8月、決着までの3日間
    rows:
    - ['8月2日', 本人が退団を通告。クラブは「全額を先に預けよ」]
    - ['8月3日 午前', 弁護士がリーグ本部へ。リーグが受け取りを拒否]
    - ['8月3日 午後', バルセロナのオフィスで直接支払い。クラブが受領を公表]
    - ['8月3〜4日', 移籍証明書がフランスへ。5年契約を発表]
    - ['8月4日', パルク・デ・プランスで入団会見]
    focus: '8月3日 午後'
  say:
  - text: では、その金はどうやって動いたのでしょうか。
    image: assets/backgrounds/stadium_バルセロナ_in.png
    card: none
  - text: 鍵は、スペインの勅令1006号です。
    card: none
  - text: 1985年に決まった、プロ選手の働き方の決まりです。
    card: *how_board
  - text: その第16条に、こう書いてあります。
    card: *how_board
  - text: 選手は、自分の意思で契約を終わらせられる。
    card:
      <<: *how_board
      highlight_row: 0
  - text: そのときクラブには、補償金を受け取る権利がある。
    card:
      <<: *how_board
      highlight_row: 2
  - text: 額は、先に取り決めてあればその額です。
    card:
      <<: *how_board
      highlight_row: 0
  - text: つまり払うのは選手本人。クラブ同士の売り買いではありません。
    emph: true
    card:
      <<: *how_board
      highlight_row: 2
  - text: 選手が1年以内に別のクラブと契約すれば、そのクラブが保証人になります。
    card:
      <<: *how_board
      highlight_row: 3
  - text: だからバルセロナには、断ることも値を上げることもできません。
    emph: true
    card: *how_board
  - text: ネイマールが退団を伝えたのは、2017年8月2日の朝でした。
    card:
      <<: *how_board
      highlight_row: 0
  - text: クラブは、7月1日時点の違約金を全額、先に預けよと答えます。
    card:
      <<: *how_board
      highlight_row: 0
  - text: 翌3日の午前、弁護士がマドリードのリーグ本部へ向かいます。
    card:
      <<: *how_board
      highlight_row: 1
  - text: ところが、リーグが受け取りを拒みました。
    card:
      <<: *how_board
      highlight_row: 1
  - voice: ハビエル・テバス
    text: リーグに属さないクラブが、我々の決まりを使おうとするなら、
  - voice: ハビエル・テバス
    text: その金は受け取りません。
    cont: true
  - text: 挙げた理由は、支出を収入の範囲に収める欧州の決まりへの疑いでした。
    card:
      <<: *how_board
      highlight_row: 1
  - text: それでも移籍は止まりません。
    card:
      <<: *how_board
      highlight_row: 2
  - text: 勅令の権利は、選手とクラブのあいだのものだからです。
    card:
      <<: *how_board
      highlight_row: 2
  - text: 同じ日の午後、弁護士はバルセロナのオフィスへ行き、直接払いました。
    card:
      <<: *how_board
      highlight_row: 2
  - text: クラブは受領を認め、資料をヨーロッパの連盟へ出す、と書き添えました。
    card:
      <<: *how_board
      highlight_row: 2
  - text: 翌4日、本拠地パルク・デ・プランスで入団会見が開かれます。
    card:
      <<: *how_board
      highlight_row: 4
