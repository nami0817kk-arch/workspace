  title: ネイマール、9年たっても誰も超えない移籍金。バルセロナが交渉できなかった事情
  question: ネイマールの移籍金は、誰が誰に、どうやって払われたのか
  lead: サッカーの歴史で、いちばん高く売れた選手。
  hook: ただ、その額をバルセロナと話し合った人は、ひとりもいません。
  takeaway: ネイマールの移籍金2億2200万ユーロは、2017年から9年たったいまも歴代1位のままで、2位のエムバペ1億8000万ユーロに4200万ユーロの差を付けている。バルセロナが公表しているのはこの違約金だけで、代理人2人への手数料と連帯貢献金を足した2億5200万ユーロは報じられた額。払い方はクラブ同士の売買ではなく、スペインの勅令1006/1985 第16条にある「選手が自分の意思で契約を切り、補償金を自分で払う」形で、新しいクラブは連帯保証人として後ろに立つだけだった。だからバルセロナには断ることも値を上げることもできず、8月3日の午前にリーグが受け取りを拒んでも移籍は止まらなかった。パリ・サンジェルマンでの6シーズンは173試合118ゴールでタイトルは13、ただし移籍の目的だったチャンピオンズリーグだけが無い。違約金を出場試合で割ると1試合あたり約128万3000ユーロで、2017年8月3日の為替なら約1億6800万円、いまの為替なら約2億2700万円。前の世界記録ポグバの1億500万ユーロから一度に約2.11倍へ跳ね、翌年のエムバペはその81%、22日後にバルセロナが新加入選手に付けた違約金条項は約1.8倍の4億ユーロになった。払い方をめぐってはフランスの金融検察が2020年から調べていて、結論はまだ出ていない
