  say:
  - text: この1件は、市場そのものを押し上げました。
    card: *view_table
  - text: 歴代の移籍金を並べると、上位5件のうち4件は、このあとの出来事です。
    card: *view_table
  - text: ネイマールの前の世界記録は、1年前のポグバが持っていました。
    card: &view_calc
      type: calc
      title: 世界記録は一度に何倍になったか
      terms:
      - ['2億2200万ユーロ', 2017年 ネイマール]
      - ['1億500万ユーロ', 2016年 ポグバ]
      - [約2.11倍, 上がった幅]
      ops: ['÷', ＝]
  - text: その額で割ると約2.11倍。世界記録が、一度に2倍を超えました。
    emph: true
    card: *view_calc
  - text: 翌年のエムバペでも、ネイマールの81%の額でした。
    card: *view_calc
  - text: 違約金の条項そのものも、上がりました。
    card: *view_table
  - text: この移籍の22日後、バルセロナが新加入選手に付けた条項は4億ユーロ。
    card: *view_table
  - text: ネイマールに付いていた額の、およそ1.8倍です。
    card: *view_table
  - text: 2017年に世界で動いた移籍金は、過去最高を更新します。
    card: *view_table
  - text: 前の年より32.7%多い、およそ64億ドル。
    card: *view_table
  - text: 1件の移籍で説明できる増え方ではありません。
    card: *view_table
  - text: ただ、その年のいちばん前にいたのが、この移籍でした。
    card: *view_table
  - text: ネイマールはいまサントスにいて、契約は2026年12月31日まで。
    card: *view_table
  - text: 延長に向けた話し合いが、すでに始まっているそうです。
    card: *view_table
  - text: 一方、2017年に付いた値段のほうは、9年動いていません。
    emph: true
    card: *view_table
  sources:
  - https://www.transfermarkt.com/statistik/transferrekorde
  - https://inside.fifa.com/transfer-system/media-releases/fifa-global-transfer-market-report-a-new-dimension-in-transfer-spendin-2927376
  - https://www.fcbarcelona.com/en/football/first-team/news/748188/ousmane-dembele-fc-barcelonas-new-signing
  - https://www.espn.com/soccer/story/_/id/47533505/neymar-signs-santos-renewal-2026-world-cup
