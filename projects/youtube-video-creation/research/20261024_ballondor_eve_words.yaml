# 取材メモ（2026年10月24日）バロンドール発表（26日・月曜）の前に、候補が語った言葉（ニュースのショート。見せ方 Y＝ヤマルの実在の発言から始める）
# 予想は書かない（受賞者は未発表。ESPN の予測市場の数字も入れない）。本人の言葉は BBC が引いた英語を訳した。言い換えない。
# 取材: 2026-10-24。BBC 本文を requests で全部読んだ。控え research/raw/20261024_ballondor_eve_bbc.txt。
#   ・BBC Sport（2026-10-23 06:06 UTC）「A Ballon d'Or campaign as fierce off the pitch as on it」
#       ヤマル: will not "beg for anything"（『何かを乞うことはしない』）。賞は得点王だけに与えるものではない、と示した（間接話法。カギ括弧にしない）。
#       ルイス・エンリケ: "bored of the Ballon d'Or"。PSG は過去最多の10人が候補（record 10 PSG players on the shortlist）。
#       デンベレとクヴァラツヘリアは BBC Sport に互いを推した。デンベレ: "We can cut it in two"（joked）"Honestly, he deserves it, the season he had was exceptional."
#         クヴァラツヘリア: "Of course it's him!"。デンベレは 2025 年の受賞者（写真の説明文）。
#       ムバッペ: "I always think I'm the best but everyone has their own opinion ... Of course, this year could be good for me to win the Ballon d'Or - but journalists vote."
#       投票は締め切り済みで、受賞者はすでに決まっている（The deadline has passed. The winner has already been chosen.）。
#   ・日程: 授賞式は月曜、ロンドン・パラディアム（ESPN 10/21、控え research/raw/20261022_ballondor_espn_story.txt）。月曜＝26日。
# 10/22『ムバッペが語ったバロンドールの条件』（20261022_ballondor_three）との重なり:
#   ムバッペの『普通の選手には与えない』（BBC にも同じ発言がある）は使わない。今回は『いつも自分が最高だと思っている』の別の発言だけ。
#   ヤマルの『僕とムバッペが世界一』・ケインの発言・『FIFAランク上位100か国の記者』の説明・優勝の数の比べ、は使わない。写真も 10/16〜10/24 の本と重ならないものにした。
# 使わなかったもの: ケイン（今回は3人に絞る）。エーベルルの『キャンペーンを張らない人たち』（ケインの推しで別の話）。パパンの『自分、自分、自分』（ムバッペを小さく見せる言い方）。
#   デコの『大スキャンダル』（ラフィーニャ・ペドリの落選の話で別筋）。ESPN の予測市場（予想に当たる）。
# 反応: 取らない。ネットの反応は集めていない（作らない）。approve は --no-voices で。
