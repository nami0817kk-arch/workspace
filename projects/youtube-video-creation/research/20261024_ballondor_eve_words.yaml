      - text: 初めての受賞を狙うムバッペは、もっとはっきり語りました。
        image: assets/images/20261024_ballondor_eve_words/04_w.jpg
      - voice: ムバッペ
        text: 僕はいつも、自分が最高だと思っています。
        image: assets/images/20261024_ballondor_eve_words/07_w.jpg
      - voice: ムバッペ
        text: でも、意見は人それぞれです。
        cont: true
        image: assets/images/20261024_ballondor_eve_words/04_w.jpg
      - voice: ムバッペ
        text: もちろん、今年は取れるかもしれません。
