sections:
- id: hook
  heading: エジプトは、2026年のW杯で何を変えたのか
  tier: 背景
  telop: W杯で7試合勝てなかった国が、ベスト16へ
  narrator: 解説
  main: true
  say:
  - text: エジプト代表。フィファランクは26位の国です。
    image: assets/stats/tb_egypt_data_t.png
    short_only: true
    no_telop: true
  - text: エジプトが初めてW杯に出たのは、1934年です。
    image: assets/stats/tb_egypt_data_t.png
    no_telop: true
  - text: そこから2018年まで、W杯で7試合。一度も勝てませんでした。
    image: assets/stats/tb_egypt_data_t.png
    no_telop: true
    emph: true
  - text: それが2026年、ニュージーランドに3対1。初出場から92年目の、初勝利でした。
    image: assets/stats/tb_egypt_data_r1.png
    no_telop: true
  - text: さらに、決勝トーナメントの最初の試合も勝ち抜いて、ベスト16に進みました。
    image: assets/images/20261130_team_egypt/b02_w.jpg
    no_telop: true
  - text: 勝てなかったエジプトは、2026年に何が変わったのでしょうか。
    image: assets/images/20261130_team_egypt/b01_w.jpg
    no_telop: true
