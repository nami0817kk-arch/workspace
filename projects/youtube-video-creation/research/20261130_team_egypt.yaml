- id: data
  heading: エジプト代表は、どんな数字を持つ国なのか
  tier: 背景
  telop: エジプト代表の基礎DATA
  narrator: 解説
  say:
  - text: エジプトのフィファランクは、11月18日の発表で**26位**。日本は17位です。
    image: assets/stats/tb_egypt_data0.png
    no_telop: true
  - text: W杯は4回目。最高成績は、2026年のベスト16です。
    image: assets/stats/tb_egypt_data1.png
    no_telop: true
  - text: W杯の通算は12試合で、1勝5分け6敗。
    image: assets/stats/tb_egypt_data4.png
    no_telop: true
  - text: アフリカ選手権は、優勝7回。アフリカの国で最多です。
    image: assets/stats/tb_egypt_data3.png
    no_telop: true
  - text: 監督は、11月に就任したアリ・マヘル。
    image: assets/stats/tb_egypt_data5.png
    no_telop: true
  - text: 主将はサラー。代表で最も多くのゴールを決めてきた選手です。
    image: assets/stats/tb_egypt_data6.png
    no_telop: true
