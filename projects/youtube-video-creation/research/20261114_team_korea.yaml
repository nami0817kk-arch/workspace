  - text: ソン・フンミンは、この4試合のうち3試合でゴールを決めています。
    image: assets/images/20261114_team_korea/b06_son2022_w.jpg
    card: none
  - text: 11月は、サウジアラビアとカタールと、親善試合で戦います。
    image: assets/images/20261114_team_korea/b01_son2018_w.jpg
    card: none
  - text: 来年1月のアジアカップは、イエメン、ベトナム、アラブ首長国連邦と同じ組です。
    card: none
