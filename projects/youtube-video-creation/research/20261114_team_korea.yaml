# 代表チーム紹介 韓国代表（11/11 作成。固定シリーズ9「代表チーム紹介」。見本は 11/12 のイタリア代表 scripts/20261112_team_italy.md と 11/10 のコロンビア代表）。7節：フック→基礎DATA（板）→日本との関係→歴史と転機（年表）→看板選手（表）→いまのチーム→見立て。
# **選んだ理由**：日本との対戦が82試合と最も多く、日本から見て40回以上負けた相手。最初の50試合は7勝11分け32敗、あとの32試合は10勝12分け10敗の五分で、2021年以降は日本の3連勝（7得点0失点）という、数えて割ると軸になる数字がある。代表チーム紹介は未出（scripts/・research/posted.json・research/covered.yaml を grep。韓国代表が主役の本は無い。韓国の名前は日本人選手や他シリーズの台本に出るだけ）。
# **外した候補**：イタリア（11/12 の別本として作る）、アメリカ・セネガル・モロッコ・スイス・デンマーク（日本との接点が韓国ほど強くない）、インドネシア・タイ（2027年アジアカップ組。大物ではない）。
# **軸**：「日本は40回以上負けた相手と、なぜいまは五分なのか」。答えは見立ての節（自分で数えて割る）。
# ---- 確かめたこと（2026-11-11。requests で Wikipedia の生の wikitext を読んだ。WebFetch の要約は使っていない）----
#  ・FIFAランク：32位（Module:SportsRankings/data/FIFA World Rankings、updated 7 October 2026）。日本は17位。点数は書かない。
#  ・日本との全対戦（Japan–South Korea football rivalry の Men's matches の表。updated 15 July 2025）：82試合。日本17勝・韓国42勝・23分け（アジアの大会・アジア大会などで日本協会が数えない3試合を含む。日本協会の数え方は Japan national football team records and statistics の表で79試合16勝23分け40敗）。→題・語りでは「40回以上」「82試合・17勝23分け42敗」と言い、どちらの数え方でも成り立つ形にした。
#  ・→自分で数えた（82試合の表を1試合ずつ集計。/tmp 側のスクリプトで検算）：最初の50試合（1954〜1991）7勝11分け32敗＝記事の本文「South Korea overwhelmingly led the first 50 matches with 32 wins, 11 draws and 7 losses」と一致。あとの32試合（1992〜2025）10勝12分け10敗。2021・2022・2025の3試合は日本の3連勝、3-0・3-0・1-0で7得点0失点。
#  ・最初の対戦：1954-03-07 W杯予選 日本1-5韓国（東京・明治神宮外苑競技場）。3-14 韓国2-2日本。1993-10-25 W杯予選 日本1-0韓国（ドーハ）、ただし最終戦のイラク戦が2-2で日本は敗退（「ドーハの悲劇」。本文）。1997-11-01 W杯予選 韓国0-2日本（ソウル、名波1分・ロペス37分）。2011-01-25 アジアカップ 2-2（PK 3-0で日本）。2011-08-10 札幌 3-0（香川2・本田）。2021-03-25 横浜 3-0。2022-07-27 東アジア選手権 3-0。2025-07-15 東アジア選手権 韓国0-1日本（ジャーメイン）。「Jリーグ設立後の1990年代初めからほとんど互角」（本文）。EAFF の大会は両国とも国内組が中心（本文）。
#  ・韓国：W杯12回出場・1986〜2026の11大会連続はアジア最多、最高は2002年4位（Korea national football team の冒頭・South Korea at the FIFA World Cup）。アジアカップ優勝1956・1960、準優勝1972・1980・1988・2015（infobox・メダル欄）。2002は日韓共催：ポーランドに勝ってW杯初勝利、1次リーグ1位、16強イタリアに延長2-1、8強スペインにPK、準決勝ドイツに0-1、3位決定戦トルコに2-3。「Most Entertaining Team」賞を受けた。2015の決勝は延長でオーストラリアに1-2。応援団 Red Devils は1995年結成。愛称 Tigers of Asia。
#  ・2026年W杯（A組。South Korea national football team の試合の枠・2026 FIFA World Cup Group A）：6/11 チェコ2-1（黄仁範67分・呉賢揆80分、グアダラハラ）／6/18 メキシコ0-1／6/24 南アフリカ0-1。A組3位、1勝0分2敗2得点3失点。1次リーグ敗退。
#  ・監督：ロベルト・モレノ（スペイン出身、暫定。Korea national football team の coaching staff、updated 10 September 2026。KFA が暫定監督にモレノを選任した旨の出典）。前の監督（ホン・ミョンボ）が離れた理由は確かめていないので言わない。主将ソン・フンミン（infobox。151試合59得点＝歴代最多出場・最多得点、10月6日時点）。
#  ・W杯のあと（試合の枠）：9/24 エクアドル3-0（呉賢揆54分・ソン58分・李東炯86分）／9/28 ウルグアイ1-4（ソン80分）／10/2 ベネズエラ0-0／10/6 ウズベキスタン2-0（ソン6分・呉世勲60分）。→2勝1分1敗6得点4失点、ソンは4試合のうち3試合で得点。11/13 サウジアラビア、11/17 カタール（親善試合、ドーハ）。アジアカップ2027 Group E：1/10 イエメン（ジッダ）、ベトナム、1/20 UAE。
#  ・11月の招集メンバー（Current squad、caps・goals は2026-10-06時点）：キム・スンギュ（FC東京、GK、92試合）、オ・セフン（清水エスパルス、FW）など日本のクラブの選手が2人。看板選手（年齢は2026-11-11時点、生年月日から計算）：ソン・フンミン（ロサンゼルスFC、FW、1992-07-08）34・151試合59得点／キム・ミンジェ（バイエルン、DF、1996-11-15）29・85試合4得点／イ・ガンイン（アトレティコ・マドリード、MF、2001-02-19）25・53試合11得点／ファン・ヒチャン（シャルケ、MF、1996-01-26）30・85試合17得点／ファン・インボム（ポルト、MF、1996-09-20）30・78試合7得点／呉賢揆（ベシクタシュ、FW、2001-04-12）25・34試合8得点。
# ---- 言わないもの ----
#  ・ホン・ミョンボ前監督の退任の理由／歴史問題・政治の話／戦術の説明／怪我・私生活／審判への不満／2002年の判定をめぐる議論。
# ---- 写真（assets/images/20261114_team_korea/、出典は credits.json）----
#  ・2018年W杯 韓国対メキシコの2枚（soccer.ru のタグ。CC BY-SA 4.0 と記憶＝要確認）。2010年東アジア選手権 日本対韓国（yoppy、CC BY 2.0、遠景）。2026年6月24日 試合前の国旗（Balaenicactus、CC0）。ソン・フンミンの2枚（Ujishadow、CC BY-SA 4.0）。代理店・放送映像は使っていない。
#  ・基礎DATAの板の中身は research/raw/20261114_team_korea_board.json（tools/clubdata.py で assets/stats/tb_korea_data*.png を描いた）。
