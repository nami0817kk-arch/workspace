- id: hook
  heading: 日本の勝ち負けは、なぜ半分ずつになったのか
  main: true
  tier: 背景
  telop: 日本がいちばん負けた相手は、韓国
  narrator: 解説
  say:
  - text: アジアの強豪、韓国代表。フィファランクは32位の国です。
    short_only: true
    image: assets/stats/tb_korea_data_t.png
    no_telop: true
  - text: 日本がいちばん多く負けている相手は、韓国です。
    image: assets/stats/tb_korea_data_t.png
    no_telop: true
  - text: 戦ったのは82試合。日本から見て、17勝23分け42敗。
    image: assets/stats/tb_korea_data_r1.png
    no_telop: true
  - text: ところが、最初の50試合は7勝32敗。あとの32試合は、**10勝12分け10敗**。
    image: assets/stats/tb_korea_data_r1.png
    no_telop: true
    emph: true
  - text: 2021年からの3試合は、日本の3連勝。
    image: assets/images/20261114_team_korea/b03_japankorea2010_w.jpg
    no_telop: true
  - text: 日本は、ここまで負けを重ねた相手と、なぜ互角に戦えるようになったのでしょうか。
    image: assets/stats/tb_korea_data_t.png
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/Japan%E2%80%93South_Korea_football_rivalry
  - https://en.wikipedia.org/wiki/Japan_national_football_team_records_and_statistics
