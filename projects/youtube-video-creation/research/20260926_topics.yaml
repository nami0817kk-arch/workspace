    slot: ロマーノ
    head: ロマーノが明かした「Here we go 寸前で破談した3件」。ケシエ、カマラ、ボニフェイス
    why: |
      ケシエ→ユベントス、L.カマラ→チェルシー、ボニフェイス→ミラン。ロマーノ「契約にサインするのは記者ではない」。
      **ロマーノ本人の X は読めなかった**（Chrome の接続が落ちている）。これはイタリア紙の引用。9/24。
