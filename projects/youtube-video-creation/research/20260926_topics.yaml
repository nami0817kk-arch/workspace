    slot: その他
    head: 欧州4大リーグがFIFAに共同声明。「会長は搾取的な考えを推し進めてきた」
    why: |
      プレミア・ブンデス・ラ・リーガ・セリエAが共同で、FIFAの意思決定と商業部門の分離などを要求。
      2027年3月の会長選の候補に改革案の公表を求めた。**話が硬く、顔の写真が作りにくい。**
    src: Sky Sports（9/25）
    url: https://www.skysports.com/football/news/13591689/fifa-gianni-infantino-exploitative-ideas-criticised-as-premier-league-bundesliga-laliga-and-serie-a-unite-to-call-for-reform
