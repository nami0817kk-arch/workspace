    slot: その他
    head: アモリム、マンUの「散髪男」に「ごめんね」。5連勝まで髪を切らないと誓ったファン
    why: |
      「マンUが5連勝するまで髪を切らない」ファン、フランク・イレットにポルトガルで会い、髪を指さして "sorry about that!"。
      **アモリムはマンUで63試合25勝、5連勝は一度も無かった**（今はミラン監督）。軽い話。
    src: Football Italia（9/25）
