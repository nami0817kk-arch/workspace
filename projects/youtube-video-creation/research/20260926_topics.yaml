    slot: ラリーガ
    head: バイエルンがダニ・オルモを狙う。バルサでは今季先発3試合、評価額7000万ユーロ
    why: |
      W杯優勝メンバーのオルモ（28歳）。**今季バルサでは先発3試合**。ムシアラやオリーセが引き抜かれた場合の
      候補として、1月の獲得を検討という報道。報じたのは Sky Sports。
