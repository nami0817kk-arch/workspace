    heading: 二人が話している場面は、少し違う
    tier: 報道
    telop: 見立て：ブルーノは守り方の方針、監督は後半の試みと走る量
    say:
      - 見立てです。ブルーノは、守り方の方針を語りました。
      - 監督は、後半の試みと走る量を語っています。
      - 二人が話している場面は、少し違います。
      - マンUはこれで、公式戦7試合連続で勝てていません。
      - 次は25日、ホームでボーンマスと戦います。
