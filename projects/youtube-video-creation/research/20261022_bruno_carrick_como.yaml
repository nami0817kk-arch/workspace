sections:
  - id: what
    main: true
    heading: 何が起きたか
    tier: 報道
    telop: コモ戦のあと、主将ブルーノが守り方について語った
    say:
      - 21日、チャンピオンズリーグでコモに1対4で敗れたマンチェスター・ユナイテッド。
      - 試合後、主将のブルーノ・フェルナンデスは、守り方の話をしました。
      - voice: ブルーノ・フェルナンデス
        text: マンツーマンでプレスをかけず、ある程度のスペースを与えて、
        short_voice: true
      - voice: ブルーノ・フェルナンデス
        text: 相手に持たせるのは、スタッフの判断だった。
        cont: true
      - voice: ブルーノ・フェルナンデス
        text: 時にはもっと勇敢になって、
        cont: true
      - voice: ブルーノ・フェルナンデス
        text: リスクを冒して高い位置からプレスをかける必要がある。
        cont: true
      - 監督の戦術が間違っていたのか、と聞かれたブルーノの返事です。
      - voice: ブルーノ・フェルナンデス
        text: それは監督とスタッフが判断することだ。
      - voice: ブルーノ・フェルナンデス
        text: 私が判断することではない。
        cont: true
    official: false
    sources:
      - https://www.footballchannel.jp/2026/10/22/post1038099/
      - https://www.theguardian.com/football/2026/oct/21/michael-carrick-bruno-fernandes-manchester-united-como-champions-league

  - id: reply
    heading: キャリック監督の答え
    tier: 報道
    telop: ブルーノの発言を聞かれた監督「走らなければ勝てない」
    say:
      - ブルーノの発言は、試合後にキャリック監督にも伝えられました。
      - voice: キャリック監督
        text: 実際、後半には部分的にマンツーマンでプレスをかけたが、
        short_voice: true
      - voice: キャリック監督
        text: そこから失点した。
        cont: true
      - voice: キャリック監督
        text: どんなシステムや戦術でプレーしても、
        cont: true
      - voice: キャリック監督
        text: 前にも後ろにも走らなければ、勝つことはできない。
        cont: true
      - voice: キャリック監督
        text: 悔しいし、苛立っている。それ以上に、本当に怒っている。
        cont: true
    official: false
