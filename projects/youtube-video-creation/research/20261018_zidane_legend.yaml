- id: match
  heading: 1998年7月12日、決勝の夜に何があったのか
  tier: 報道
  main: true
  telop: 1998年7月12日、ワールドカップ決勝
  narrator: 解説
  card:
    type: table
    title: 1998年ワールドカップ決勝（大会の公式記録）
    columns:
    - 項目
    - 内容
    rows: &match_rows
    - - 日付・会場
      - 1998年7月12日・スタッド・ド・フランス
    - - 対戦
      - フランス 対 ブラジル
    - - 結果
      - 3対0（前半2対0）
    - - ジダン
      - 27分と前半ロスタイムにヘディング
    - - 3点目
      - プティ（試合終了間際）
    source: 大会組織委員会の公式記録
  say:
  - text: ジダンは、フランス代表を、1998年のワールドカップ優勝へ導きました。
    short_only: true
    card: none
  - text: ジダンを象徴する1試合は、1998年のワールドカップ決勝です。
    image: assets/images/20261018_zidane_legend/z98_ballon_w.jpg
    card: &match_card
      type: table
      title: 1998年ワールドカップ決勝（大会の公式記録）
      columns: [項目, 内容]
      rows: *match_rows
      source: 大会組織委員会の公式記録
      highlight_row: 0
  - text: 相手は、前回王者のブラジル。開催国のフランスが迎え撃ちます。
    card:
      <<: *match_card
      highlight_row: 1
  - text: ただ、この大会のジダンは、まだ1点も取っていませんでした。
    emph: true
    card: none
  - text: グループリーグのサウジアラビア戦で退場。続く試合を、欠場しました。
    card: none
  - text: 前半27分。コーナーキックに、頭で合わせます。
    image: assets/images/20261018_zidane_legend/z02_volley_w.jpg
    emph: true
    card:
      <<: *match_card
      highlight_row: 3
  - text: 前半のロスタイム。もう一度コーナーから、ヘディング。
    card:
      <<: *match_card
      highlight_row: 3
  - text: ゴールの時間は、大会の公式記録に従いました。記録によって、1分ほど違います。
    card: none
  - text: この2本目のコーナーは、ジダンが蹴る予定でした。
    card: none
  - text: けれど、チームメートのジョルカエフが、のちにこう明かしています。
    card: none
  - voice: ジョルカエフ
    text: いや、これは俺が蹴る。
  - voice: ジョルカエフ
    text: お前は、ゴール前にいてくれ。
    cont: true
    pause: 0.6
  - text: フランスは前半を2点リード。終了間際に、プティが3点目です。
    card:
      <<: *match_card
      highlight_row: 2
  - text: 3対0の勝ち。フランスにとって、初めてのワールドカップ優勝です。
    emph: true
    card: none
  - text: 街には「ジズーを大統領に」の落書きが、広がりました。
    card: none
  - text: のちにジダンは、あの夜を、こう振り返ります。
    card: none
  - voice: ジダン
    text: 僕らは、何も持たずに来た家族でした。
  - voice: ジダン
    text: それが、あらゆる種類のフランス人から、
    cont: true
  - voice: ジダン
    text: 敬意を向けられるようになった。
    cont: true
    pause: 0.6
