  say:
  - text: ジダンは、1972年6月23日、マルセイユの生まれです。
    image: assets/images/20261018_zidane_legend/z13_portrait_w.jpg
    card: &data_card
      type: table
      title: ジネディーヌ・ジダン
      columns: [項目, 内容]
      rows: *bdata
      source: Transfermarkt・Wikipedia
      highlight_row: 0
  - text: 育ったのは、北部のラ・カステラーヌ。団地が建ち並ぶ街です。
    card:
      <<: *data_card
      highlight_row: 2
  - text: 攻撃的ミッドフィルダー。所属したクラブは、カンヌ、ボルドー、ユヴェントス、レアル。
    card:
      <<: *data_card
      highlight_row: 4
  - text: そしてワールドカップと欧州選手権を、1回ずつ制しています。
    emph: true
    card:
      <<: *data_card
      highlight_row: 5
