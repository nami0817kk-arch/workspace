- id: story
  heading: ジダンが掃除係から始めた理由と、決勝のあとの控室
  tier: 報道
  telop: マル秘話 カンヌの掃除係と、控室の「ごめん」
  narrator: 解説
  card:
    type: table
    title: マル秘話
    columns: [いつ, 何があったか]
    rows: &story_rows
    - ['カンヌに入った頃', 最初の数週間は、掃除係だった]
    - ['2006年7月', 決勝のあと、控室で仲間に謝った]
    source: The Observer・ESPN
  say:
  - text: マル秘話を2つ。まずは、カンヌに入った頃の話です。
    image: assets/images/20261018_zidane_legend/z13_portrait_w.jpg
    card: &story_card
      type: table
      title: マル秘話
      columns: [いつ, 何があったか]
      rows: *story_rows
      source: The Observer・ESPN
      highlight_row: 0
  - text: ジダンは、すぐに手が出る少年だったと、最初のコーチは語ります。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 相手の選手に、育ちをからかわれて、殴ってしまいます。
    card:
      <<: *story_card
      highlight_row: 0
  - text: 罰として、最初の数週間は、掃除が主な仕事でした。
    emph: true
    card:
      <<: *story_card
      highlight_row: 0
  - text: のちに本人は、育った街について、こう言っています。
    card: none
  - voice: ジダン
    text: 難しい街の出身で、運がよかった。
  - voice: ジダン
    text: サッカーだけでなく、人生を教えてくれるから。
    cont: true
    pause: 0.6
  - text: 2つ目は、2006年の決勝のあとです。
    image: assets/images/20261018_zidane_legend/z06_final_w.jpg
    card:
      <<: *story_card
      highlight_row: 1
  - text: 延長戦で退場したジダンは、そのまま現役を終えました。
    card:
      <<: *story_card
      highlight_row: 1
  - text: ところが翌日、大会の最優秀選手、ゴールデンボールに選ばれます。
    card: none
  - text: のちに、スペインの新聞に、こう語っています。
    card: none
  - voice: ジダン
    text: もちろん、自分を責めています。
  - voice: ジダン
    text: サッカーに、ファンに、チームに、謝ります。
    cont: true
  - voice: ジダン
    text: 試合のあと、控室で、みんなに言いました。
    cont: true
  - voice: ジダン
    text: 許してくれ。何も変わらないけど、みんな、ごめん、と。
    cont: true
    pause: 0.6
