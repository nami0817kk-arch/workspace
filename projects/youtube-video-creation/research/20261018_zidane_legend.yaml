- id: style
  heading: ジダンのプレーは、何がすごかったのか
  tier: 報道
  telop: 吸いつくタッチと、決勝のボレー
  narrator: 解説
  card:
    type: table
    title: ジダンの通算（クラブはリーグ戦）
    columns:
    - 所属
    - 試合
    - 得点
    rows: &total_rows
    - [カンヌ, '61', '6']
    - [ボルドー, '139', '28']
    - [ユヴェントス, '151', '24']
    - [レアル・マドリード, '155', '37']
    - [クラブ計, '506', '95']
    - [フランス代表, '108', '31']
    source: Wikipedia・Transfermarkt
  say:
  - text: ジダンの武器は、ボールを扱う技術。吸いつくようなタッチでした。
    image: assets/images/20261018_zidane_legend/z02_volley_w.jpg
    card: none
  - text: 回りながらボールを運ぶ「ルーレット」が、代名詞です。
    card: none
  - text: フランス代表を率いたジャケ監督は、こう評しました。
    card: none
  - voice: ジャケ
    text: 彼には、内なるビジョンがある。
  - voice: ジャケ
    text: ボールを、思いのままに操れる。
    cont: true
    pause: 0.6
  - text: 2002年、チャンピオンズリーグ決勝。レアル加入の1年目です。
    card: none
  - text: 前半の終わりぎわ、左足のボレー。これが決勝点でした。
    emph: true
    card: none
  - text: 次に、通算の数字です。クラブのリーグ戦は、506試合95得点。
    image: assets/images/20261018_zidane_legend/z06_final_w.jpg
    card: &total_card
      type: table
      title: ジダンの通算（クラブはリーグ戦）
      columns: [所属, 試合, 得点]
      rows: *total_rows
      source: Wikipedia・Transfermarkt
      highlight_row: 4
  - text: リーグ戦で、レアルは37点。カンヌの6点を、大きく超えます。
    card:
      <<: *total_card
      highlight_row: 3
  - text: フランス代表では、108試合で31得点を挙げました。
    emph: true
    card:
      <<: *total_card
      highlight_row: 5
  - text: タイトルも数えます。フランス代表で、2つ。
    image: assets/images/20261018_zidane_legend/z98_ballon_w.jpg
    card: &title_stats
      type: stats
      title: ジダンが選手として獲ったもの
      items:
      - ['2', つ, フランス代表のタイトル]
      - ['6', つ, レアルでのタイトル（クラブ公式）]
