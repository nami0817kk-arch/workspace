    - ['2025年9月', ユヴェントスの殿堂入り]
    - ['2026年7月', フランス代表の監督に決まる]
    focus: 4
    highlight_row: 4
  say:
  - text: ジダンの現役最後の試合は、2006年のワールドカップ決勝でした。
    image: assets/images/20261018_zidane_legend/z06_final_w.jpg
    card: &now_tl
      type: timeline
      title: 引退から、いままで
      rows:
      - ['2006年7月', ワールドカップ決勝で引退]
      - ['2016年1月', レアルの監督に。CL3連覇]
      - ['2021年5月', レアルを去る]
      - ['2025年9月', ユヴェントスの殿堂入り]
      - ['2026年7月', フランス代表の監督に決まる]
      focus: 4
      highlight_row: 0
  - text: 次の舞台は、ベンチです。2016年1月、レアルの監督に。
    image: assets/images/20261018_zidane_legend/z18_coach_w.jpg
    card:
      <<: *now_tl
      highlight_row: 1
  - text: 就任の年から、チャンピオンズリーグを3連覇。監督として、初めてでした。
    emph: true
    card:
      <<: *now_tl
      highlight_row: 1
  - text: 2021年5月、レアルを去ります。
    card:
      <<: *now_tl
      highlight_row: 2
  - text: 2025年9月、ユヴェントスが殿堂を作り、最初の50人に名前がありました。
    card:
      <<: *now_tl
      highlight_row: 3
  - text: そして2026年7月28日。決勝の2発から、28年後です。
    emph: true
    card:
      <<: *now_tl
      highlight_row: 4
  - text: フランス連盟が、新しい監督を発表。デシャン前監督の後任で、任期は4年です。
    card: none
  - text: 初陣は9月25日、トルコ戦。ムバッペのゴールで、1対0の勝ち。
    card: none
  - text: ここまで4試合を戦って、3勝1分けです。
    card: none
