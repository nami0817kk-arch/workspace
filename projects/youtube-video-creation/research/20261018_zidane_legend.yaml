      focus: 0
  - text: それが、ジダンの、大会で初めてのゴールでした。
    emph: true
    card: *hook_stats
  - text: ジネディーヌ・ジダン、54歳。かつての名司令塔です。
    card: *hook_stats
  - text: いまは、フランス代表の監督。今年7月に決まりました。
    image: assets/images/20261018_zidane_legend/z18_coach_w.jpg
    card:
      <<: *hook_stats
      focus: 2
  - text: 選手で世界最優秀選手に3回。監督でチャンピオンズリーグ3連覇。
    card:
      <<: *hook_stats
      focus: 1
  - text: 就任会見で、本人はこう話しました。
    card: none
  - voice: ジダン
    text: フランス代表。それが、僕のやりたかった唯一のことでした。
  - voice: ジダン
    text: ある意味、夢でした。
    cont: true
    pause: 0.5
  - text: その歩みを、順に追います。
    card: none
