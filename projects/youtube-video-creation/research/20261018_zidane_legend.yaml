# ジネディーヌ・ジダン（元フランス代表・現フランス代表監督）の紹介。シリーズ「レジェンドの紹介」の試験1本目（2026-10-17 ユーザー決定）。
# 引退した選手向けの8節の型：①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（＋通算の表） ⑤あの試合 ⑥引退後・いま ⑦マル秘話 ⑧見立て。
# **FotMob は使わない**。レーダー・シュートマップ・パーセンタイルは出さない。数字は基本の数と、自分で割った1試合あたり。Transfermarkt は2ページだけ（プロフィールの確認。成績表は JS で読めなかった）。
#
# **数字・出来事の出どころ（読んだもの）と確度**
# - AFP 配信（Le Quotidien／L'essentiel 2026-07-28、franceinfo la1ere 2026-07-28）：フランス代表監督の発表（28日）、任期4年、デシャンの後任、本人の言葉「L'équipe de France, c'est la seule chose que je voulais faire」「C'est une continuité, quelque part un rêve」「refusées pour l'équipe de France」、
#   CL3連覇は監督として「inédit」、代表108試合。→ 報道。FFF 公式（fff.fr）は 403 で読めなかった。
# - ESPN（site.api.espn.com の試合記録）：フランス代表の4試合（9/25 トルコ 1-0 ・9/28 ベルギー 1-0 ・10/2 イタリア 1-1 ・10/5 ベルギー 4-1）、ムバッペ54分、次の日程（11/12 イタリア戦・11/15 トルコ戦）。
#   決勝の得点者の時刻（1998・2002・2006）も突き合わせた（下の食い違いを見よ）。→ 報道（統計の出どころ）。
# - 大会組織委員会の公式記録 france98.com（Wayback 2001-04-14 保存）：1998年決勝 ブラジル0-3フランス、ジダン27分と前半ロスタイム、プティ。→ 確定（大会の公式記録）。
# - Real Madrid 公式（realmadrid.com 殿堂の頁・fr）：公式戦227試合49得点、6タイトル、2001年7月加入、加入時の言葉「Je voulais gagner la Coupe d'Europe, et je voulais le faire avec le Real Madrid」。→ 確定。
# - Girondins 公式（girondins.com 2026 誕生日の記事）：ボルドー4季179試合13アシスト39得点、1995/96 インタートト・UEFAカップ決勝。→ 確定。
# - Juventus 公式（juventus.com/hall-of-fame）：殿堂の最初の50人に Zidane。日付は Inside World Football 2025-09-11 と club の記事（2025-09-09 付とされる）。→ 確定（名簿）／報道（日付）。
# - The Observer 2004-04-04（Andrew Hussey「ZZ top」。Guardian のアーカイブ）：本人の言葉（父・ラ・カステラーヌ・98年の「何も持たない家族」）、ジャケの評、カンヌの掃除係。→ 報道。
# - ESPN Soccernet 2010-03-01（Wayback）：El País に答えた本人の言葉（2006年の決勝のあと）。→ 報道。
# - Goal.com 2014-11-12（Wayback）：マラドーナについての本人の言葉。→ 報道。
# - FourFourTwo（Yahoo Sports 配信 2026-06-27）：ジョルカエフの回想（1998決勝の2本目のコーナー）。→ 報道。記事は決勝のスコアを「3-1」と誤記している（実際は3-0）ので、逸話だけを使い数字は使わない。
# - Transfermarkt（プロフィール1ページ）：1972-06-23・マルセイユ・1.85m・代表108試合31得点・現職＝フランス代表監督。→ 報道。
# - 英語版 Wikipedia（本文・Honours・Career statistics）：上の出典で確かめられないものの背景（2006年決勝の経緯、出場停止、ゴールデンボール、ルーレット、受賞歴）。→ 背景。
# - クラブ別のリーグ戦の試合・得点は、英・西・仏の3つの Wikipedia が一致（61/6・139/28・151/24・155/37）。**全大会の試合数は出典で割れる**ので表には出さない（食い違いを見よ）。
#
# **食い違いと台本での扱い**
# - 1998年決勝の得点の時刻：大会公式記録＝ジダン27分・前半ロスタイム（記録上は46分の表記）／英語版 Wikipedia＝27分・45+1分／ESPN＝28分・45+2分。プティは公式記録「92分」・Wikipedia 90+3分・ESPN 90+1分。
#   → 台本は大会公式記録の27分と「前半のロスタイム」に従い、「記録によって1分ほど違います」と断る。プティの時刻は言わず「試合終了間際」とする。
# - ジダンの全大会の試合数：レアル＝英Wikipedia の表の合計230／季の合計231／西Wikipedia 227／クラブ公式227。ユヴェントス＝214と212。カンヌ＝71と70。→ 表はリーグ戦だけ（3つの Wikipedia が一致）、全大会はクラブ公式のある2つ（ボルドー179/39・レアル227/49）だけ語る。
# - 2006年決勝で侮辱された家族：本人は2010年に「母」と語る（ESPN）／英語版 Wikipedia は「姉妹」（マテラッツィの発言として後に明かされた）。→ 台本では誰が何を言ったかに触れない。本人の謝罪の言葉（控室）だけを使う。
# - 退場の回数：英Wikipedia 14回／仏Wikipedia 16回。→ 言わない。
# - プロデビューの年齢：Wikipedia の日付（1989-05-18）からは16歳／Real Madrid 公式は「17歳でカンヌのトップ」。→ 年齢は言わず「1989年、まだ10代」。
# - 凱旋のシャンゼリゼの人数：ジダンの記事「100万人超」／決勝の記事「数十万人」。→ 人数は言わない。
# - 1998決勝の最初のコーナーの側：ジョルカエフは「左がプティ、右がジダン」と言い、Wikipedia は「プティが右から」。→ 側は言わない。
# - 就任の効力：英Wikipedia＝契約は9月1日から／search の要約は8月1日（未確認）。FFF 公式が読めない。→ 発表日（7月28日）だけ言う。
# - 移籍金：クラブ公式は金額を出さない。Wikipedia は1500億リラ＝約7750万ユーロ（当時の世界記録）。→ 「当時の世界最高額」とだけ言い、金額は出さない（為替で変わる）。
# - ESPN の2002年決勝は会場が BayArena になっている（実際はグラスゴーのハムデン・パーク）→ 会場は言わない。
#
# **自分で数えた比べ（見立て）**
# - CL決勝：選手＝1997（ユヴェントス 1-3 ドルトムント）負け・1998（0-1 レアル）負け・2002（レアル 2-1 レバークーゼン）勝ち＝3回で1勝2敗。監督＝2016（アトレティコにPK戦）・2017（ユヴェントスに4-1、ESPN）・2018（リバプールに3-1）＝3回で3勝。
# - 国内リーグ優勝：選手＝セリエA 1996-97・97-98＋リーガ 2002-03＝3回／監督＝リーガ 2016-17・2019-20＝2回。
# - 1試合あたりの得点（リーグ戦）：カンヌ 6÷61＝0.10／ボルドー 28÷139＝0.20／ユヴェントス 24÷151＝0.16／レアル 37÷155＝0.24。フランス代表 31÷108＝0.29（親善試合を含む全試合）。
# - 通算：クラブのリーグ戦 61+139+151+155＝506試合・6+28+24+37＝95得点。
# - 今季（フランス代表監督として）4試合：9/25 トルコ 1-0 ・9/28 ベルギー 1-0 ・10/2 イタリア 1-1 ・10/5 ベルギー 4-1＝3勝1分。
# - 決勝の2発から28年：1998年7月→2026年7月。
#
# **入れなかったもの**：私生活（結婚・子ども）、カタール大使の件、「ブラックバーンのオーナーの発言」「ニューカッスルに断られた」（古い逸話で出典が代理人談・Wikipedia 経由のみ）、
#   エリヌー家に預けられた話（Wikipedia の注の出典＝Observer を読んだが載っていなかった）、マテラッツィへの謝罪拒否（相手のある話で、控室の謝罪だけに絞る）、赤いカード回数。
#
# **日本語名・読みで怪しいもの**：ジネディーヌ・ジダン（Wikidata の日本語ラベル）。ジョルカエフ・プティ・ジャケ・デシャン・ソラリ・スタッド・ド・フランス・ラ・カステラーヌ・ムバッペ（kana 辞書は「エムバペ」）。
