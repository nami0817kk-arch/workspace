  say:
  - text: 始まりは、団地の広場。5歳で、仲間とボールを蹴り始めます。
    image: assets/images/20261018_zidane_legend/z13_portrait_w.jpg
    card: &career_card
      type: table
      title: 歩んできた道
      columns: [時期, 所属, できごと]
      rows: *career_rows
      source: クラブ公式・Wikipedia
      highlight_row: 0
  - text: 憧れたのは、1986年のマラドーナ。本人は、こう語ります。
    card:
      <<: *career_card
      highlight_row: 0
  - voice: ジダン
    text: 彼は、影響を与えたわけじゃない。
  - voice: ジダン
    text: でも、僕の心に、跡を残した。特に1986年。驚異的だった。
    cont: true
    pause: 0.6
  - text: カンヌで、1989年にプロデビュー。まだ10代でした。
    card:
      <<: *career_card
      highlight_row: 1
  - text: 1992年、ボルドーへ。4季で、179試合39得点です。
    card:
      <<: *career_card
      highlight_row: 2
  - text: 1996年、ユヴェントスへ。セリエAで、2回優勝します。
    card:
      <<: *career_card
      highlight_row: 3
  - text: ただ、チャンピオンズリーグの決勝は、2回続けて敗れます。
    emph: true
    card:
      <<: *career_card
      highlight_row: 3
  - text: 転機は2001年。当時の世界最高額の移籍金で、レアルへ。本人の言葉です。
    image: assets/images/20261018_zidane_legend/z02_solari_w.jpg
    card:
      <<: *career_card
      highlight_row: 4
  - voice: ジダン
    text: ヨーロッパ王者に、なりたかった。
  - voice: ジダン
    text: それを、レアル・マドリードで、やりたかったんだ。
    cont: true
    pause: 0.6
