  why: 代表ウィークの代表紹介（10/1 のエクアドルと同じ型）。W杯2026で3点を取ったMF、イギリス出身で育成に15年かかわった監督、日本との対戦成績。19:30 のキックオフ前に出す
  src: ゲキサカ（NZ監督・前田大然の記事）・JFA
