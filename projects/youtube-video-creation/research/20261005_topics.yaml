  fmt: 監督の経歴
  head: ジョルジェ・ジェズス、ロナウドと向き合うポルトガル代表監督の歩み
  why: ベンフィカ・フラメンゴ・アル・ヒラルで頂点に立った72歳。ロナウドの合宿離脱の真ん中にいる人。ポルトガル対ノルウェーの結果も入れて、試合のあとに出す
  src: 各国の報道（10/4）
