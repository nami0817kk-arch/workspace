title: 10月5日の題材
lead: シリーズ6本は決めました。ニュースは14件から○×をお願いします
note: '<b>ニュースに○×を付けてください。</b>今日の本編10本は、シリーズ6本＋ニュース4本（日本人3・ほか1）の予定です。シリーズの6本（21〜26）はこちらで決めました。外したいものがあれば×を付けてください。ニュースの中身は見出しと記事の冒頭まで見ています。○が付いたものから本文と出典を確かめます。<br>今夜は2試合あります。<b>キリンカップ決勝の日本対ニュージーランド（19:30、国立）</b>と、<b>ポルトガル対ノルウェー（日本時間 5日 3:45）</b>です。どちらも試合のあとに作ります。'
