- id: birth
  heading: 前のクラブは、解散させられた
  tier: 背景
  telop: 1919年、リーズ・シティの代わりに作られた
  narrator: 解説
  card:
    type: table
    title: クラブの成り立ち
    columns:
    - ''
    - ''
    rows:
    - - 創設
      - 1919年10月17日
    - - 理由
      - リーズ・シティが強制的に解散
    - - 同じ日
      - リーズ・シティの選手16人が競売に
  say:
  - ほかより遅い生まれには、理由があります。
  - '**この街には、すでに別のクラブがありました。**リーズ・シティです。'
  - そのクラブが、リーグから**強制的に解散させられました。**
  - 第一次世界大戦中に、選手へ不正な支払いをしていたという疑いでした。
  - 1919年**10月17日**、リーズのホテルで選手16人が競売にかけられました。
  - 9つのクラブが、合わせて9250ポンドで買っていきました。
  - 同じ日、集まったサポーターが新しいクラブを作ると決めます。それがリーズ・ユナイテッドです。
  official: false
  sources:
  - https://en.wikipedia.org/wiki/Leeds_United_F.C.
  - https://en.wikipedia.org/wiki/Leeds_City_F.C.
  bg: assets/backgrounds/stadium_リーズ.png
