      - 昨季14位。2年目の挑戦
  say:
  - 日本代表の中盤、田中碧が、ここでリーグ戦**74試合**、8得点を挙げています。
  - エランド・ロードに銅像が立つ主将、ビリー・ブレムナーは、首位を奪われた夜にこう言いました。
  - voice: ビリー・ブレムナー
    text: 「だが、我々は戦い続ける。間違いなく、まだ終わってはいない」
  - 今季はまだ負けていません。開幕から**5試合**、負けなしの5位です。
  - 昇格1年目の昨季は**14位**で残留。2年目の今季は、監督4年目のファルケが率います。
  sources:
