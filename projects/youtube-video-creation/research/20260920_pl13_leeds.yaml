  say:
  - short_only: true
    text: 田中碧の所属クラブを、基本のデータで見ていきます。
  - image: assets/stats/pl_leeds_data0.png
    text: 創立は**1919年**。本拠地には**3万7633人**が入ります。
    no_telop: true
  - image: assets/stats/pl_leeds_data3.png
    text: オーナーは、アメリカンフットボールの49ersにつながる投資グループ。2023年に完全に買い取りました。
    no_telop: true
  - image: assets/stats/pl_leeds_data.png
    text: 1部リーグの優勝は**3回**。FAカップとリーグカップが1回ずつ、ヨーロッパのフェアーズカップを2回獲っています。
    no_telop: true
  - image: assets/stats/pl_leeds_data5.png
    text: 直近のタイトルは2024年から25年の2部優勝です。
    no_telop: true
  - image: assets/stats/pl_leeds_data6.png
    text: 1968年から69年にかけては、**34試合続けて負けなし**。いまも破られていないクラブ記録です。
    no_telop: true
