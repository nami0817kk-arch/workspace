title: 10月3日の題材（朝）
lead: 今朝の新しい話と、昨夜の保留を合わせて13件
note: <b>○×を付けてください。</b>今日のニュースは久保の結婚（公開済み）のほかに、日本人2本・ほか1本（本編＋ショート）。「朝の新着」の印が今朝に入った話か、中身を足した話です。中身は記事の本文まで確かめてあります。まとめサイトの書き足しは外しました（三笘の「6クラブ」、板倉の「ボルシアMG行き拒否」は元の記事では監督の話）。
items:
- slot: 日本人
  head: U-21日本代表、今夜19:30にアジア大会決勝の日韓戦。韓国紙は「やりすぎだ」と大会運営に怒り
  why: '決勝は10/3（土）19:30、豊田スタジアム。韓国は4連覇がかかり、日本は勝てば16年ぶりの優勝（韓国には2大会続けて1-2で負けている）。準決勝はウズベキスタンにPK戦9-8。前日の10/2、豊田スタジアムでの公式練習が芝の状態を理由に中止になり、代わりの練習場も「芝の状態が最悪」と韓国のスポーツ朝鮮が批判（見出しは「日本はサッカーで勝つために心に決めたのか」の疑問形。本文は組織委員会の運営への批判）。韓国のイ・ミンソン監督「アウェイだから起きること。それも乗り越えるべき部分だ」。大岩監督「悔しい思いをしっかりとぶつけたい」。試合の前に出す予告の回

    '
  src: スポーツ朝鮮・ゲキサカ・Goal（9/30〜10/2）
  url: https://sports.news.nate.com/view/20261002n18497
  fmt: news
  new: 朝の新着
  num: 1
- slot: 日本人
  head: 鈴木唯人、フライブルクで開幕4戦4発、代表では新しい背番号8。鎌田「ドイツで確実にトップタレントの一人。時間の問題」
  why: 'エクアドル戦は左のシャドーで先発、A代表5回目の先発。日本のシュート6本のうち2本。後半1分、久保の差し込みに合わせたがトラップが流れた。本人「ああいうシーンにいられるのが間違いなく良いこと」「ドイツで充実しているんで、自信を持って積み重ねていければ、何の問題もない」 '
  src: サッカーキング・ゲキサカ（10/1〜2）
  url: https://www.soccer-king.jp/news/japan/national/20261002/2212061.html
  fmt: quote
  num: 2
