  head: フランス1-1イタリア。オリーズが25メートルのFKで先制も、ジダン監督の初陣からの3連勝は止まる
  why: '10/2、スタッド・ドゥ・フランス。55分にオリーズのFKがクロスバーの下を叩いて先制（前節ベルギー戦の決勝点に続く2戦連発）。68分にバストーニがダ・クーニャのミスを奪って同点（こちらも2戦連発）。85分ごろウパメカノが2枚目の警告で退場。ジダン監督は1-0、1-0のあと2勝1分。「選手たちには残念だ。もっと勝ちに値した」「正直、戦い方を誇りに思う」。オリーズの試合後の言葉は見つからない。オリーズ紹介（シリーズ）の回と同じ日になる

    '
  src: ESPN・AP・サッカーキング（10/2〜3）
  url: https://www.espn.com/soccer/story/_/id/50086165/
  num: 9
- slot: その他
