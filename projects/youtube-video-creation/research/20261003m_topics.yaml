  head: 渡辺剛、ベネズエラ戦の終盤に痛めて代表を離脱。フェイエノールトは10/10のAZ戦に間に合うことを願う
  why: オランダのVIは「脚の負傷」、FR12は「海外の媒体によると膝、公式には確認されていない」。JFAは種類も期間も出していない。代わりに望月ヘンリー海輝を招集
