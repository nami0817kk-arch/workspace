  head: 三笘薫、来夏の契約満了でフリー移籍の可能性。デ・ゼルビのトッテナムとリヴァプールが様子見と英サイト
  why: '契約は2027年6月30日まで、延長の話は止まっている（TEAMtalk 10/2、移籍の噂を独自に流すサイト）。名前が出たのはトッテナム（デ・ゼルビ監督）とリヴァプール（川崎時代から評価）、バイエルンも。5月のハムストリングのけがで1月の需要は弱く、来夏のフリー移籍の見込みが高まる、という書き方。ヒュルツェラー監督は「すぐに選択肢になる」と復帰を待つ。まとめサイトの「6クラブ」「フリー移籍へ！」は元の記事より言い過ぎ

    '
  src: TEAMtalk・theScore（10/1〜2）
  url: https://www.teamtalk.com/news/de-zerbi-seeking-kaoru-mitoma-tottenham-reunion-brighton-contract-talks-stall
  fmt: news
  weak: true
  new: 朝の新着
