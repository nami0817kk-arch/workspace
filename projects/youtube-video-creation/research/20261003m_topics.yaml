  fmt: news
  head: レヴァンドフスキ、38歳でハットトリック。ロナウドの記録を抜き、ネーションズリーグ最年長
  why: '10/2、ポーランド6-0ルーマニア。24分（PK）、47分、86分。38歳42日はネーションズリーグ最年長のハットトリック（それまではロナウドの34歳120日）。代表で7回目のハットトリック、代表通算170試合92得点

    '
  src: World Soccer Talk・Flashscore（10/2〜3）
  url: https://www.flashscore.com/news/soccer-nations-league-poland-romania-report-october-2-2026/zoVeX6n2/
  num: 10
- slot: その他
  head: ロナウド抜きのポルトガル、4-2で3連勝。ポルトの空港ではファン同士が言い争って警察が入り、連盟は歩み寄りを探る
  why: 'カンセロ、ゴンサロ・ラモス、ヴィティーニャ、ジョアン・フェリックスが得点、ブルーノが2アシストで主将、7番はレオン。10/2にポルトに着くと、空港で観客がジェズス監督に「エゴはエッフェル塔の大きさ」と叫び、ロナウドに不満の客と言い争いになって警察が割って入った。連盟（プロエンサ会長）は2人の「歩み寄りの場」を探っている（A Bola）。代表の各SNSは合計で200万近く減り、ジェズス個人も10万近く減、ロナウドは増えた。ジェズス「次の試合のあとで、この件は逃げずに話す」。次は10/4のノルウェー戦。今日のロナウドの回の続き

    '
  src: ESPN・A Bola・Observador・ロマーノ（X）（10/1〜2）
  url: https://www.abola.pt/noticias/fpf-tenta-consenso-entre-jesus-e-ronaldo-para-que-a-historia-do-capitao-na-selecao-nao-acabe-assim-2026100212101701560
  fmt: news
  num: 11
- slot: その他
  head: マンC、正式に控訴「クラブは無実」。告発のきっかけを作った内部告発者は、証人保護を打ち切られ国外へ
  why: '10/1の19時に控訴。声明「判断には法・原則・事実の明らかな誤りがある」「無実で、反論の余地のない証拠がある」。控訴は3人の独立した委員会が審理し、12週以内（クリスマス前の週まで）に終える決まり、判断は審理後30日以内。処分を決める聴聞は別で、日程は未定。Bloomberg によるとUAE側が英政府に、判決が今後の大型投資に響きかねないと伝えた（話した人の名前は出ていない）。官邸報道官「誰かがルールの上にいるということはありえない」。トゥヘル監督「シティの選手は準備ができている」。今日のマンCの回の続き。きっかけは2018年にFootball Leaksの資料をドイツの雑誌に渡したルイ・ピント。有罪の判定の数時間後にポルトガルの証人保護を10/10で打ち切ると伝えられ、本人は国を出ると表明（弁護団「2020年以来いちばん無防備」、4月にリスボンで暴行を受けた）（Guardian）

    '
  src: Sky Sports・ESPN・Daily Mail（Bloomberg 経由）（10/2）
  url: https://www.skysports.com/football/news/11661/13593606/man-city-lodge-appeal-premier-league-club-contest-guilty-verdict-of-independent-commission
  fmt: news
  new: 朝の新着
  num: 12
- slot: その他
  head: デンベレ、ムバッペとの「選ばれし者」論争に「SNSでのちょっとした小競り合い」。バロンドールには「自分を売り込まない」
  why: 'ムバッペが「自分は常に選ばれし者と見られてきた」と語り、デンベレが9/14に「選ばれし者だったことはない」と返していた。今回「何もなかった」「食事の席も隣だ」。フランス・フットボールに投票者を説得する材料を求められ「決めるのは向こうだ」。バロンドールの発表は10/26 '
  src: franceinfo・Maxifoot・ロマーノ（X）（10/1）
  url: https://www.franceinfo.fr/sports/foot/ousmane-dembele/ce-sont-des-petites-gueguerres-sur-les-reseaux-sociaux-ousmane-dembele-evacue-une-eventuelle-tension-avec-kylian-mbappe-en-vue-du-ballon-d-or_8218540.html
  fmt: quote
