sections:
- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 通算100得点のエースと、1部が初めての監督
  narrator: キャスター
  say:
  - text: クロアチア代表のブディミルは9月、1部通算**100得点**に届きました。
    image: assets/stats/ll_osasuna_data_r1.png
    no_telop: true
  - text: '**5連敗**で終えた昨シーズン。1部が初めてのラミス新監督は、こう求めます。'
    image: assets/stats/ll_osasuna_data_r2.png
    no_telop: true
  - voice: ルイス・ミゲル・ラミス
    text: 前に出るのは一歩ではなく三歩だ。一歩で済む状況ではない
    image: assets/stats/ll_osasuna_data_r2.png
  - text: オサスナは**1977年**まで3部。そこから**9シーズン**後の**1985年**、ヨーロッパの舞台へ。
    image: assets/stats/ll_osasuna_data_r3.png
    no_telop: true
  - image: assets/stats/ll_osasuna_data0.png
    text: 創立は**1920年**。「オサスナ」は、バスク語で「健康」という意味です。
    no_telop: true
  - image: assets/stats/ll_osasuna_data1.png
    text: 愛称は「ロス・ロヒージョス」。スペイン語で「小さな赤たち」。
    no_telop: true
  - image: assets/stats/ll_osasuna_data2.png
    text: ホームタウンはパンプローナ。7月の牛追い祭りで、世界に知られる町です。
    no_telop: true
  - image: assets/backgrounds/stadium_オサスナ.png
    text: 本拠地はエル・サダール。**1967年**に開き、**2万3576人**が入ります。
  - image: assets/stats/ll_osasuna_data4.png
    text: 会長は**2014年**からルイス・サバルサ。株式会社ではなく、会員が持つクラブです。
    no_telop: true
  - image: assets/stats/ll_osasuna_cups.png
    text: 1部も国王杯もスーペルコパも、優勝はまだありません。
    no_telop: true
  - image: assets/stats/ll_osasuna_data6.png
    text: 最多出場は、ナバラ生まれの中盤パチ・プニャル。このクラブで**513試合**です。
    no_telop: true
  - image: assets/stats/ll_osasuna_data7.png
    text: 直近のタイトルは、2018年から19年のシーズンの2部優勝。勝ち点は**87**でした。
    no_telop: true
  - image: assets/stats/ll_osasuna_data8.png
    text: 昨シーズンのリーグ戦は**17位**。勝ち点42で3チームが並び、直接対決の差で残りました。
    no_telop: true
  sources:
  - https://en.wikipedia.org/wiki/CA_Osasuna
  - https://en.wikipedia.org/wiki/Template:2026%E2%80%9327_La_Liga_table
  - https://www.osasuna.es/cronica-osasunarayo-2026/27
  - https://www.osasuna.es/rueda-prensa-osasuna-rayo-2026-27
