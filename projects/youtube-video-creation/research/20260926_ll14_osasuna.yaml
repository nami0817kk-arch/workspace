  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
- id: history
  heading: 3部からヨーロッパへ
  tier: 背景
  telop: 2部と3部を行き来した時代から、欧州の舞台へ
  narrator: 解説
  card:
    type: table
    title: 3部からヨーロッパへ
    columns: &id001
    - ''
    - ''
    rows:
    - - 1976-77
      - 3部で優勝して昇格
    - - 1980年
      - 17年ぶりに1部へ
  say:
  - 1970年代のオサスナは、2部と3部を行き来していました。
  - 1977年に3部を抜けると、**1980年**には17年ぶりに1部へ戻ります。
  - text: '**1985年**、前のシーズンの6位で、初めてヨーロッパの大会に出場。'
    card:
      type: table
      title: 3部からヨーロッパへ
      columns: *id001
      rows:
      - - 1985年
        - 初めてのヨーロッパの大会
  - 1回戦では、スコットランドのレンジャーズを合計**2対1**で破りました。
  sources:
  - https://en.wikipedia.org/wiki/CA_Osasuna
  - https://es.wikipedia.org/wiki/Historia_del_Club_Atl%C3%A9tico_Osasuna
  - https://en.wikipedia.org/wiki/1985%E2%80%9386_UEFA_Cup
  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
- id: history2
  heading: 4位と、予選の壁
  tier: 背景
  telop: 2006年、4位。初めて最高峰の大会へ
  narrator: 解説
  card:
    type: table
    title: 4位と、予選の壁
    columns: &id002
    - ''
    - ''
    rows:
    - - 2005-06
      - リーグ4位。クラブ最高に並ぶ
    - - 監督
      - ハビエル・アギーレ
  say:
  - 2006年、いまバレンシアを率いるアギーレ監督のもとで、リーグ**4位**。
  - 5位のセビージャとは勝ち点が同じで、2チームの対戦成績で上回りました。
  - text: 初めてのチャンピオンズリーグは、予選からの出場。
    card:
      type: table
      title: 4位と、予選の壁
      columns: *id002
      rows:
      - - 予選
        - ハンブルクにアウェーゴールの差
  - ハンブルクとは2試合とも引き分け、アウェーゴールの差で敗れます。
  sources:
  - https://en.wikipedia.org/wiki/CA_Osasuna
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_Osasuna
  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
- id: history3
  heading: ヨーロッパの4強
  tier: 背景
  telop: 2007年、欧州で4強
  narrator: 解説
  card:
    type: table
    title: ヨーロッパの4強
    columns: &id003
    - ''
    - ''
    rows:
    - - 準々決勝
      - レバークーゼンに敵地で3対0
  say:
  - 予選で敗れて回ったのは、いまのヨーロッパリーグにあたる大会です。
  - 準々決勝では、ドイツのレバークーゼンに、敵地で**3対0**。
  - text: 準決勝はセビージャ。ホームで勝ったものの、敵地で**0対2**と敗れました。
    card:
      type: table
      title: ヨーロッパの4強
      columns: *id003
      rows:
      - - 準決勝
        - セビージャにホーム1対0、敵地0対2
  - セビージャは、そのまま優勝しています。
  sources:
  - https://en.wikipedia.org/wiki/2006%E2%80%9307_UEFA_Cup_knockout_stage
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_Osasuna
  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
- id: finals
  heading: 2度の決勝
