  say:
  - text: マスコットのロヒージョは**2002年**、新しい会長に工事現場のコンテナへ捨てられました。
    image: assets/images/ll_osasuna_episode/scene.jpg
  - '**14年**後、町のあちこちのコンテナに、「戻りたい」と書いた腕が現れます。'
  - 翌日の試合前、ピッチの真ん中に置かれたコンテナから、ロヒージョが出てきました。
  sources:
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_Osasuna
  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
