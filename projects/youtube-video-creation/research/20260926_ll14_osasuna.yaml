  telop: シーズン途中の監督交代と、古巣に戻る監督
  narrator: キャスター
  say:
  - text: オサスナは10月12日、ラミス監督が退くことになりました。
    image: assets/stats/ll_osasuna_data_r1.png
    no_telop: true
  - text: 後任は、古巣に戻るハゴバ・アラサテ。会見で、こう話しました。
    image: assets/stats/ll_osasuna_data_r2.png
    no_telop: true
  - voice: ハゴバ・アラサテ
    text: オサスナは私を必要としていると感じます。力になれると感じます
    image: assets/stats/ll_osasuna_data_r2.png
  - text: アラサテは、2018年から6年間、このクラブを率いた監督です。
    image: assets/stats/ll_osasuna_data_r2.png
    no_telop: true
  - text: それまでの開幕8試合は、**2勝2引き分け4敗**で**16位**でした。
    image: assets/stats/ll_osasuna_data_r1.png
    no_telop: true
  - text: オサスナは**1976年**から77年のシーズンに3部。その**9シーズン**後に、ヨーロッパへ。
    image: assets/stats/ll_osasuna_data_r3.png
    no_telop: true
  - image: assets/stats/ll_osasuna_data0.png
    text: 創立は**1920年**。「オサスナ」は、バスク語で「健康」という意味です。
    no_telop: true
  - image: assets/stats/ll_osasuna_data1.png
    text: 愛称は「ロス・ロヒージョス」。スペイン語で「小さな赤たち」。
    no_telop: true
  - image: assets/backgrounds/stadium_オサスナ.png
    text: 本拠地は、ナバラ州パンプローナのエル・サダール。
  - '**1967年**開場で、**2万3576人**が入ります。'
  - image: assets/stats/ll_osasuna_data7.png
    text: 直近のタイトルは、2018年から19年のシーズンの2部優勝。1部の優勝は、まだありません。
    no_telop: true
  - image: assets/stats/ll_osasuna_data8.png
    text: 昨シーズンのリーグ戦は**17位**。勝ち点42で3チームが並び、互いの対戦成績で上だったオサスナが残りました。
    no_telop: true
