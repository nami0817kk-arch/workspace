  say:
  - 国王杯では、**2度**決勝に進んでいます。
  - '**2005年**はベティスに、延長の末**1対2**で敗れました。'
  - '**2023年**はレアル・マドリードに、また**1対2**で敗れます。'
  sources:
  - https://en.wikipedia.org/wiki/2005_Copa_del_Rey_final
