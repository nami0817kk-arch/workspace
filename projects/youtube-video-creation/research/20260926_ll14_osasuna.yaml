# ラ・リーガ20クラブ紹介 ⑭オサスナ（2026-09-20 ヴィラの見本の形で作り直し）
# tools/plbuild.py で組み立て。材料は research/ll_data/osasuna*.json と旧台本 -
# 2026-10-16 に直した（plbuild を回し直したうえで、今季のここまでを手で見立ての節にした）:
#   ・10/12 にラミス監督が退き、ハゴバ・アラサテが復帰（2029年6月まで）。クラブ公式 osasuna.es の 10/12 発表・10/13 就任会見・10/15 練習記事で確認。
#     いま見る理由・今季の監督・特徴の1行目・サムネの文字を差し替え（ブディミルの通算100得点と「5連敗」の行は落とした）
#   ・今季の結果は ESPN scoreboard（research/ll_data/results.json、10/16 取得）。第8節まで 2勝2分4敗・8得点18失点・勝ち点8・16位。
#     Wikipedia の表（Template:2026–27 La Liga table、10/16 取得）の20クラブの勝敗・得点・失点・勝ち点と、results.json から自分で数えた値が全部一致。
#     research/ll_data/standings.json も第8節の表に更新（plbuild の順位・勝ち点はここから）
#   ・自分で数えた数字: 失点18＝ホーム4試合3（0-0 Levante・1-0 Getafe・0-2 Espanyol・1-1 Rayo）＋アウェー4試合15（2-1 Celta・2-5 Alavés・0-4 Atlético・2-5 Betis）。
#     ホーム 2得点3失点・勝ち点5、アウェー 6得点15失点・勝ち点3。1試合の失点 18÷8=2.25。昨季 50÷38=1.32（last_season.json）。
#     今季の1部の平均 241得点÷78試合÷2=1.54（results.json の全78試合）。2.25÷1.54=約1.46、2.25÷1.32=約1.7。降格圏の18位エルチェは勝ち点6（8-6=2差）
#   ・初陣: 10/18（日曜）14:00 エル・サダール、ラシン戦（クラブ公式 2026-10-15 の練習記事）
#   ・**未確認**: アラサテの256試合は英語版の監督成績表とクラブ公式（256 partidos）で一致。「2018年から6年間」は英語版の表（2018-06-20〜2024-06-30）。
#     アラサテの戦い方（プレーの型）を述べた出典は見つからず、特徴の1行目は本人の会見の言葉だけにした
# 2026-10-16 流れの点検の指摘で直した: 本拠地の街（ナバラ州パンプローナ）を基礎DATAに／今季の監督を特徴の前へ／アウェーゴール・予選・UEFAカップ・国王杯・降格圏・欧州選手権の説明／「腕」の言い直し／セビージャ同点の行を削除
