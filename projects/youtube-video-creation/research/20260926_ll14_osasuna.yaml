- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 守りから入る。地元で育てる。改修も投票で
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 守りから入る
    - - 運営の型
      - ナバラの100超のクラブと
    - - クラブの気質
      - 改修案も投票で決める
  say:
  - text: ラミス監督は、守りから入る監督。前のチームは、2部で失点がいちばん少なかった。
    image: assets/photos/ll/osasuna/osasuna_manager_10fb4485.jpg
  - ピッチの外は、地元で育てる型。
  - ナバラ州の**100**を超えるクラブと手を組んで、選手を育てています。
  - スタジアムの改修案も、会員の投票で選びました。投票率は**75**パーセントです。
  sources:
  - https://en.wikipedia.org/wiki/CA_Osasuna
  - https://www.osasuna.es/luis-miguel-ramis-nuevo-entrenador-de-osasuna
  - https://es.wikipedia.org/wiki/Club_Atl%C3%A9tico_Osasuna
  - https://www.osasuna.es/historia-de-el-sadar
  bg: assets/backgrounds/stadium_オサスナ_in.png
  official: false
