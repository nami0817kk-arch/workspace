# 長谷部誠（元日本代表）の紹介。シリーズ「レジェンドの紹介（日本）」2026-10-19。型は 10/18 の中田英寿（20261018_nakata_legend.yaml）と同じ8節。
# ①フック ②基礎DATA ③歩んできた道と転機 ④プレースタイル（＋通算の表）⑤「あの試合」＝2022-05-18 ヨーロッパリーグ決勝 ⑥引退後・いま ⑦マル秘話2つ ⑧見立て。
# **FotMob・DataMB・FBref・Sofascore 等は不使用**。パーセンタイル・レーダー・シュートマップは出さない。数字は基本の数と、自分で割った値だけ。
# **引退後の私生活・法的な問題は入れない**（家族・結婚・CM・事業は不使用）。
#
# **ブンデスリーガの出場数（384）の確かめ**（brief の指定：380と384に割れている）
# - 英語版 Wikipedia の本文「including 380 matches」は、アイントラハト公式（引退発表 2024-04-17）の「over 380 outings」の丸めた数。
#   その同じ公式記事に「383 appearances as of 17 April」とある（en.eintracht.de/news/makoto-hasebe-verkuendet-karriereende-158181/ ＝フランクフルト公式。読んだ）。
# - その後、最終節（2024-05-18 ライプツィヒ戦、2対2）で長谷部は試合終了間際に交代出場（sport1.de 2024-05-18「Sekunden vor Spielende eingewechselt」。読んだ）＝383＋1＝**384**。
# - リーグ公式 bundesliga.com：選手ページの 2023/24 は Appearances 8。bundesliga.de（2024-04-17）は「bislang sieben Einsätze in dieser Spielzeit」＝7＋1＝8 で整合（読んだ）。
#   bundesliga.com の日本語記事（2020-06-08）は、ヴォルフスブルクでリーグ通算135試合、2020-06-06 に309試合目でアジア人最多（チャ・ボングン308）。
# - 日本語版・英語版 Wikipedia の成績表（浦和149/12、ヴォルフスブルク135/5、ニュルンベルク14/0、フランクフルト235/2＝ブンデス384/7）、サッカーキング 2024-05-24（引退会見・全シーズン表つき）も 384。
# → **384を使う**（出典：アイントラハト公式の383＋最終節の出場。表の積み上げと一致）。380と言う記述は丸めた数。語りでは「約」を付けない。
#
# **数字の出どころ（読んだもの）**
# - 日本語版・英語版 Wikipedia「長谷部誠」（経歴・成績表・タイトル・個人賞・エピソード。生年月日・位置・身長）。
# - アイントラハト公式（引退発表）、bundesliga.com/bundesliga.de（引退・40歳・初出場の記事）、JFA 公式スタッフページ（長谷部 誠：SAMURAI BLUE コーチ。2024年〜）。
# - サッカーキング：2018-07-03（代表引退のインスタ全文。フットボールチャンネル 2018-07-03 と一致）、2020-04-09（ブンデスのフェアプレー選手ランキング。kicker日本語版の数字）、
#   2022-05-19（EL決勝・小野伸二以来20年ぶり・58分から出場）、2024-04-17、2024-05-24（引退会見）、2024-05-24（カズへの報告）、2025-10-05（コーチ就任の経緯・担当は守備）、
#   2026-01-20（フランクフルトを一時離脱）、2026-09-17（森保監督：コーチ陣の役割変更）。Goal.com 2018-11-26（マガトの言葉）、Goal.com 2022-05-19（地元紙の評価）。
# - UEFA 公式の決勝記録は読み込めなかった（タイムアウト）。EL決勝の記録は英語版 Wikipedia「2022 UEFA Europa League final」（UEFAのフルタイム資料を出典に引いている）で確認：
#   1–1（延長）・PK5–4、レンジャーズ得点 アリボ57分、フランクフルト得点 ボレ69分、長谷部は58分にトゥタに代わって出場、ローデが90分に交代、PK：（Lenz・Hrustic・Kamada・Kostić・Borré が成功、ラムジーが失敗）、観衆38,842。
# - 検索エンジンのAI要約は使っていない（URLを探すのに使っただけ。本文は requests で読んだ）。ブラウザ操作の道具・JavaScript実行は使っていない。
#
# **数字の食い違い・判断（台本での扱い）**
# - ブンデスの出場数：上のとおり 384。380は丸め。
# - EL決勝の長谷部の交代：アイントラハト公式は「57分」、UEFA資料系（Wikipedia）・サッカーキング・Goal は「58分」。**58分を使う**（先制は57分、その直後）。
# - ボレの同点弾：サッカーキングは67分、Wikipedia（UEFA資料）・Goal は69分。語りでは分を言わず「同点」だけ。表も「同点ゴール」に分を付けない。
# - フランクフルトでの出場数：アイントラハト公式（2024-04-17）は「公式戦303試合・2万4606分」。Wikipedia の表の通算も303。最終節の1試合が入るか不明なので、語りは「2024年4月の時点で」と断る。1試合平均は 24606÷303＝約81分（自分で割った）。
# - bundesliga.de（2024-04-17）に「303 Bundesliga-Spiele für die SGE」とあるが、フランクフルトでのリーグ戦は 235（Wikipedia 表）。公式戦の数の書き間違いとみて使わない。
# - bundesliga.com 日本語記事（2020）の「2011年8月」のGK登板は、日本語・英語版 Wikipedia の「2011年9月17日（第6節 ホッフェンハイム戦）」と食い違う。**9月17日を使う**（第6節の日付と合う）。
# - 日本代表 114試合2得点（JFA・サッカーキング・Wikipedia 一致）。「歴代7位」は2024年時点なので語りでは使わない。主将の試合数81は日本語版 Wikipedia のみなので使わない。
# - 外国人選手の歴代順位：サッカーキング 2024-04-17 は383試合で3位（ピサーロ・レヴァンドフスキに次ぐ）、日本語版 Wikipedia は384でレヴァンドフスキと並ぶ2位タイ、と食い違う。**順位は言わない**。
# - アジア人最多：複数の出典で一致（bundesliga.com 日本語記事・サッカーキング・Wikipedia）。「アジア人で最多」と言う。
# - 「守備コーチ」：JFA は「コーチ」。サッカーキング 2025-10-05「斉藤俊秀コーチとともに主に守備面」、森保監督 2026-09-17「長谷部コーチに守備のオープンプレーを任せたり」。語りは「守備を任される」「守備のオープンプレーを担当」と言い、肩書きは「コーチ」。
# - 2026年のワールドカップの結果には触れない（brief の範囲外・確かめていない）。
# - ホッフェンハイム戦の「日本人初のGK」は Wikipedia のみで確かめられないので言わない。
#
# **入れなかったもの**：移籍金・年俸・家族・結婚・CM・事業・著書の販売数や寄付（日本語版 Wikipedia のみ）・Transfermarkt の数字・Instagram 原文（読めず。サッカーキングとフットボールチャンネルの引用が一致）・
#   Eintracht 公式インタビューの鎌田へのPK譲りの言葉（日本語は訳文なので引用にせず、間接で言う）・「ソルジャー」（コバチの言葉。kicker.town が読めなかった）。
# **日本語名・読みで怪しいもの**：長谷部誠・藤枝・ヴォルフスブルク・ニュルンベルク・アイントラハト・フランクフルト・ホッフェンハイム・マガト・レンジャーズ・トゥタ・ボレ・トラップ・ラムジー・
#   ローデ・鎌田大地・斉藤俊秀・森保一・小野伸二・岡崎慎司・三浦知良・鈴木啓太・ライプツィヒ・ヒッツ・リベロ・オープンプレー。
# 本人の言葉は：①インスタグラム2018-07-03（日本語。サッカーキング・フットボールチャンネルの引用が一致）②引退会見 2024-05-24（日本語。サッカーキングの引用）③コーチ就任の取材 2025-10-05（日本語。サッカーキング）。
#   ほかの人の言葉：マガト（ドイツのテレビ番組での発言。Goal の訳）、森保監督（記者会見。サッカーキング）、岡崎慎司（X。サッカーキングの引用）。
