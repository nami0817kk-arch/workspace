  - text: 2006年にJ1で優勝。2007年は、アジアのクラブ王者にもなります。
    card:
      <<: *career_card
      highlight_row: 0
  - text: 2008年1月、ドイツのヴォルフスブルクへ。2月2日、ブンデスリーガ初出場です。
    card:
      <<: *career_card
      highlight_row: 1
  - text: 指揮官は、厳しい練習で“鬼軍曹”と呼ばれたマガト。のちに、こう語ります。
    card: none
  - voice: フェリックス・マガト
    text: 彼に関して最も印象に残っているのは、
  - voice: フェリックス・マガト
    text: 半年間でドイツ語を学んだことだ。
    cont: true
    pause: 0.5
  - text: 加入2年目、ヴォルフスブルクが初のリーグ優勝。長谷部は25試合に出ました。
    emph: true
    card:
      <<: *career_card
      highlight_row: 1
  - text: 2013年、ニュルンベルクへ。チームは、2部へ降格します。
    card:
      <<: *career_card
      highlight_row: 2
  - text: 2014年、フランクフルトへ。1年目に、自己最多の33試合に出場します。
    card:
      <<: *career_card
      highlight_row: 3
  - text: 転機は2016年10月。守備ラインの真ん中、リベロへの転向です。
    card:
      <<: *career_card
      highlight_row: 3
