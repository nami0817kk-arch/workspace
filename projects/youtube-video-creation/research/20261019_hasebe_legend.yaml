  say:
  - text: 浦和の長谷部誠は、繊細なボールタッチで、中盤の底から攻めを組み立てる司令塔でした。
    image: assets/images/20261019_hasebe_legend/02_w.jpg
    card: &role_card
      type: table
      title: どこで、何を任されたか
      columns: [クラブ, 任された位置]
      rows: *role_rows
      source: Wikipedia・各報道
      highlight_row: 0
  - text: ドイツでは、右サイドハーフや右サイドバックも。どこでも使える選手になります。
    card:
      <<: *role_card
      highlight_row: 1
  - text: フランクフルトでは、ボランチから、最終ラインの要へ。
    card:
      <<: *role_card
      highlight_row: 2
  - text: 強みの1つは、反則の少なさ。
    card: none
  - text: 2019-20シーズン、25節までの1410分で、反則はわずか4回。
    emph: true
    card: none
  - text: 353分に1回のペース。専門誌の1位で、2位の289分を大きく離しました。
    card: none
  - text: フランクフルトでは、2024年4月までに303試合。
    card: none
  - text: 2万4606分で、1試合あたり約81分です。
    card: none
  - text: 数字では、リーグ戦で通算533試合19得点。内訳は、表のとおりです。
    emph: true
