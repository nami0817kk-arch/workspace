- id: match
  heading: 2022年5月18日、38歳の長谷部誠は、決勝のピッチで何をしたのか
  tier: 報道
  main: true
  telop: 0対1からの、ヨーロッパリーグ決勝
  card:
    type: stats
    title: ヨーロッパリーグ決勝（2022年5月18日）
    items:
    - ['42', 年ぶり, フランクフルトのヨーロッパのタイトル]
    - ['58', 分, 長谷部が交代で入る]
    - ['38', 歳, 長谷部の年齢（4か月）]
    focus: 1
  say:
  - text: 長谷部誠の最も大きな試合は、2022年5月18日。ヨーロッパリーグ決勝。
    image: assets/images/20261019_hasebe_legend/02_w.jpg
    short_only: true
    card: none
  - text: 欧州で2番目の大会。相手はレンジャーズ。勝てば、42年ぶりの欧州タイトルです。
    card: &match_stats
      type: stats
      title: ヨーロッパリーグ決勝（2022年5月18日）
      items:
      - ['42', 年ぶり, フランクフルトのヨーロッパのタイトル]
      - ['58', 分, 長谷部が交代で入る]
      - ['38', 歳, 長谷部の年齢（4か月）]
      focus: 0
  - text: 57分、レンジャーズに先制されます。
    card: &match_tl
      type: timeline
      title: 2022年5月18日 ヨーロッパリーグ決勝
      rows:
      - ['57分', レンジャーズが先制]
      - ['58分', 長谷部が交代で入る]
      - ['同点', ボレのゴール。1対1]
      - ['120分', 延長でも決着せず]
      - ['PK戦', 5対4でフランクフルト]
      focus: 1
      highlight_row: 0
  - text: その1分後。負傷したトゥタに代わって、38歳の長谷部がピッチに入ります。
    emph: true
    card:
      <<: *match_tl
      highlight_row: 1
  - text: 地元の新聞は、「いつもの長谷部のように」守備に安定感をもたらした、と評価しました。
    card: none
  - text: ボレが決めて、同点。延長に入っても、決着がつきません。
    card:
      <<: *match_tl
      highlight_row: 3
  - text: PK戦。長谷部は監督に、蹴る準備はできているかと聞かれました。
    card:
      <<: *match_tl
      highlight_row: 4
  - text: 「もちろん」と答えましたが、蹴る順番は、もう決まっていました。
    card: none
  - text: 隣で蹴りたがっていた鎌田大地に、譲ったと言います。
    card: none
  - text: 鎌田は3人目で成功。GKトラップが、4人目のラムジーを止めます。
    card:
      <<: *match_tl
      highlight_row: 4
  - text: 最後はボレが決め、PK戦を5対4で制して、ヨーロッパの頂点に立ちました。
    emph: true
    card:
      <<: *match_tl
      highlight_row: 4
  - text: 日本人がこのタイトルを手にするのは、2002年の小野伸二以来、20年ぶりでした。
    card: none
  quotes_from:
  - https://www.soccer-king.jp/news/world/el/20220519/1649812.html
  sources:
  - https://en.wikipedia.org/wiki/2022_UEFA_Europa_League_final
  - https://www.soccer-king.jp/news/world/el/20220519/1649812.html
