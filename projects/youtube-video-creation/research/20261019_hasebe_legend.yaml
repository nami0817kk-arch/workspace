- id: after
  heading: 代表を去った長谷部誠は、いま何をしているのか
  tier: 報道
  telop: 引退のあと、指導者へ
  card:
    type: timeline
    title: 引退のあと
    rows:
    - ['2018年7月', 日本代表からの引退を表明]
    - ['2024年5月', 現役を引退（40歳）]
    - ['2024年夏', フランクフルトU-21のコーチに]
    - ['2024年9月', 日本代表のコーチに加わる]
    - ['2026年9月', 守備のオープンプレーを担当]
    focus: 4
    highlight_row: 0
  say:
  - text: 2018年7月3日。ベルギーに敗れた翌日、長谷部は代表からの引退を表明します。
    image: assets/images/20261019_hasebe_legend/02_w.jpg
    card: &after_tl
      type: timeline
      title: 引退のあと
      rows:
      - ['2018年7月', 日本代表からの引退を表明]
      - ['2024年5月', 現役を引退（40歳）]
      - ['2024年夏', フランクフルトU-21のコーチに]
      - ['2024年9月', 日本代表のコーチに加わる]
      - ['2026年9月', 守備のオープンプレーを担当]
      focus: 4
      highlight_row: 0
  - text: 2024年5月18日。最終節のライプツィヒ戦、終了間際にピッチへ。
    card:
      <<: *after_tl
      highlight_row: 1
  - text: 40歳と121日。フランクフルトで、最も年上の出場でした。
    card:
      <<: *after_tl
      highlight_row: 1
  - text: 6日後の引退会見。自分は目立つ選手ではなかった、と本人は言います。
    card: none
  - voice: 長谷部誠
    text: 目立つような発言をするわけでもない選手が、
    image: assets/images/20261019_hasebe_legend/05_w.jpg
  - voice: 長谷部誠
    text: ここまでのキャリアを築けて
    cont: true
  - voice: 長谷部誠
    text: 多くのタイトルも手にすることができた。
    cont: true
    pause: 0.5
  - text: 引退後は、フランクフルトのU-21で、アシスタントコーチに。
    card:
      <<: *after_tl
      highlight_row: 2
  - text: 同じ年の9月には、日本代表のコーチにも加わります。
    card:
      <<: *after_tl
      highlight_row: 3
  - text: きっかけは、森保監督との食事でした。
    card:
      <<: *after_tl
      highlight_row: 3
  - text: 担当は、もう1人のコーチと並んで、主に守備です。
    card:
      <<: *after_tl
      highlight_row: 3
  - text: 2026年9月。森保監督は、役割を変えたと明かします。
    card:
      <<: *after_tl
      highlight_row: 4
  - text: オープンプレーとは、セットプレー以外の、試合の流れの中のプレーのことです。
    card: none
  - voice: 森保監督
    text: 長谷部コーチに守備のオープンプレーを任せたり、
  - voice: 森保監督
    text: 前田コーチがセットプレーの攻撃を担ってくれていたところを、
    cont: true
  - voice: 森保監督
    text: 中村俊輔コーチにやってもらうなど、
    cont: true
  - voice: 森保監督
    text: 役割をいくつか変えています。
    cont: true
    pause: 0.6
  - text: 日本代表の守りを見ているのが、いまの長谷部コーチです。
    card: none
  quotes_from:
  - https://www.soccer-king.jp/news/japan/national/20240524/1893795.html
  - https://www.soccer-king.jp/news/japan/national/20251005/2071750.html
  - https://www.soccer-king.jp/news/japan/national/20260917/2205937.html
  sources:
  - https://www.soccer-king.jp/news/japan/national/20180703/788705.html
  - https://www.soccer-king.jp/news/world/ger/20240417/1882304.html
  - https://www.soccer-king.jp/news/japan/national/20240524/1893795.html
  - https://www.soccer-king.jp/news/japan/national/20251005/2071750.html
  - https://www.soccer-king.jp/news/japan/national/20260120/2116942.html
  - https://www.soccer-king.jp/news/japan/national/20260917/2205937.html
  - https://www.sport1.de/news/fussball/bundesliga/2024/05/im-zeichen-des-abschieds-frankfurt-sichert-platz-sechs
  - https://jfa.jp/national_team/staff/HASEBE_Makoto.html
- id: secret
  heading: 数字の外にある、2つの話
  tier: 報道
  telop: ゴールを守った日と、カズへの報告
  card:
    type: table
    title: 数字の外にある、2つの話
    columns: [いつ, 何があったか]
    rows: &secret_rows
    - ['2011年9月', GKとして、ゴールを守る]
    - ['2024年5月', 三浦知良さんに、引退を報告]
    source: Wikipedia・サッカーキング
  say:
  - text: 1つ目は、2011年9月17日、ホッフェンハイム戦。
    image: assets/images/20261019_hasebe_legend/05_r.jpg
    card: &secret_card
      type: table
      title: 数字の外にある、2つの話
      columns: [いつ, 何があったか]
      rows: *secret_rows
      source: Wikipedia・サッカーキング
      highlight_row: 0
  - text: ヴォルフスブルクのGKが、一発退場。交代の枠は、すでに使い切っていました。
    card: none
  - text: ゴールの前に立ったのは、右サイドバックの長谷部。
    card: none
  - text: 最後の9分間。正確なロングフィードを出し、クロスにも飛び出しました。
    card: none
  - text: 失点は85分の1点だけ。試合は、1対3の負けでした。
    card: none
  - text: 2つ目は、引退の報告。いちばん言いづらかった相手は、三浦知良さんだったそうです。
    card:
      <<: *secret_card
      highlight_row: 1
  - voice: 長谷部誠
    text: 認めないと言われるかと思ったけど、
  - voice: 長谷部誠
    text: そんなことを言えるわけがないと言われました。
    cont: true
    pause: 0.5
  quotes_from:
  - https://www.soccer-king.jp/news/world/ger/20240524/1893868.html
  sources:
  - https://en.wikipedia.org/wiki/Makoto_Hasebe
  - https://ja.wikipedia.org/wiki/%E9%95%B7%E8%B0%B7%E9%83%A8%E8%AA%A0
  - https://www.soccer-king.jp/news/world/ger/20240524/1893868.html
- id: view
  heading: 浦和のJ1とブンデスリーガ、得点と試合数を並べると
  tier: 背景
  viewpoint: true
  telop: 12試合に1点から、55試合に1点へ
  card:
    type: table
    title: 浦和（J1）とブンデスリーガの比べ
    columns: [項目, 浦和（J1）, ブンデスリーガ]
    rows: &cmp_rows
    - ['在籍', '6年', '16年']
    - ['試合', '149', '384']
    - ['得点', '12', '7']
    - ['1点までの試合', '約12', '約55']
    source: Wikipedia
  say:
  - text: 最後に、長谷部誠のリーグ戦を、浦和とブンデスリーガに分けて数えます。
    image: assets/images/20261019_hasebe_legend/02_w.jpg
    card: none
  - text: 浦和のJ1は、149試合で12得点。点を取るペースは、12試合に1点ほど。
    emph: true
    card: &cmp_card
      type: table
      title: 浦和（J1）とブンデスリーガの比べ
      columns: [項目, 浦和（J1）, ブンデスリーガ]
      rows: *cmp_rows
      source: Wikipedia
      highlight_row: 3
    mark: {kind: circle, row: 3, col: 1}
  - text: ブンデスリーガは、384試合で7得点。こちらは、55試合に1点ほどです。
    card:
      <<: *cmp_card
      highlight_row: 2
  - text: 点を取るペースは4倍以上遅くなり、出場した試合は2.6倍に増えました。
    card:
      <<: *cmp_card
      highlight_row: 1
  - text: しかも、384試合のうち235試合、6割は、30歳から過ごしたフランクフルトです。
    card: none
  - text: 点を取る司令塔は、長い時間をかけて、守りの要になりました。
    image: assets/images/20261019_hasebe_legend/05_w.jpg
    card: none
  - text: 2018年に「サポーター」と書いた人は、いま、日本代表の守りを教える側にいます。
    image: assets/images/20261019_hasebe_legend/05_w.jpg
    card: none
