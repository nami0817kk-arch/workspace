    highlight_row: 0
  say:
  - text: 旧スタジアムは、1913年から100年。スペインでいちばん古いスタジアムでした。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card: none
  - text: 古さと熱い声援から、付いた呼び名は「大聖堂」です。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card: none
  - text: 新しい器は、そのすぐ隣、見本市の跡地に建てられます。最初の石は2010年5月。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card:
      <<: *id_reb
      highlight_row: 0
  - text: 建て方は、変わっていました。まず、4分の3だけを建てて、そこへ引っ越します。
    emph: true
    image: assets/images/20261109_stadium_athletic/06_w.jpg
    card: none
  - text: 古い器を壊し、その跡地に、最後の1辺のスタンドを建てました。
    image: assets/images/20261109_stadium_athletic/06_w.jpg
    card: none
  - text: 旧スタジアムの最後の試合から102日。2013年9月16日に、新しい器が開きます。
    image: assets/images/20261109_stadium_athletic/03_w.jpg
    card:
      <<: *id_reb
      highlight_row: 2
  - text: 最初の試合はセルタ戦、3対2の勝ちでした。
    image: assets/images/20261109_stadium_athletic/03_w.jpg
    card: none
  - text: 全部の席がそろったのは、2014年8月のナポリ戦。4万9017人が入りました。
    image: assets/images/20261109_stadium_athletic/05_w.jpg
    card:
      <<: *id_reb
      highlight_row: 3
  - text: 総工費は、2億1100万ユーロ。半分あまりを、国や県、市などが出しています。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card: none
