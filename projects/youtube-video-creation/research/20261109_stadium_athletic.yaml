# スタジアム紹介シリーズ：アスレティック・ビルバオの本拠地（サン・マメス、11/9 予定）。雛形は 11/7 ベルナベウの回。
# 題材の選び方（2026-11-06）：指示書 20261109 の「ラ・リーガの続き・大きいクラブから」の先頭（ビルバオのサン・マメス）。
#   重なりの確認：scripts/*stadium_* にサン・マメス・アスレティックは無し。covered.yaml・posted.json にも stadium_athletic は無い。
#   直近30日のアスレティックの本は無い（クラブ紹介 ll03 は 9/26 で30日の外。軸は「世界王者を3人」でスタジアムではない）。
#   picks（research/20261109_picks.txt）：同じ 11/9 のユニフォームはレアル・マドリード。重ならない。
# 今季のラ・リーガ所属（一次情報）：ESPN の esp.1 2026-27 の日程（teams/93/schedule?season=2026）にホーム6試合、会場は San Mamés。
#   今季は欧州の大会に出ていない（Cadena SER 2026-09-28：会計の説明で「欧州の大会が無い」）。
# 胸像と花の習わし：
#   ピチチ（Rafael Moreno Aranzadi、1892-05-23〜1922-03-01）。アスレティックで89試合83点（ウィキペディア en・AS 2022-03-02）。国王杯優勝4度（1914・15・16・21、AS）。
#   旧スタジアムの最初のゴール（1913年8月、ウィキペディア en）。1926年に胸像（ABC 2013-09-17・ウィキペディア en）。
#   初めて来たチームの主将が花を置く。始まりは1927年1月1日、ハンガリーのMTKが即興で（AS 2022-03-02）。
#   得点王の賞の名前（マルカが1953年に始めた。ウィキペディア en・ABC）。台本は「得点王に贈られる賞の名前」まで。
#   新しい器では選手の通路の入口（ABC 2013-09-17・AS 2022）。
#   2025-09-16 CL アーセナル戦、主将ガブリエウ・マガリャンイスが花を置いた。アーセナルは初めてサン・マメスへ（Deia 2025-09-16）。
#   亡くなった理由（病気）は言わない。「29歳で亡くなった」まで。
# 新しい器（ウィキペディア en・es）：2006年3月承認／2010年5月26日 最初の石／4分の3を建てて移り、旧スタジアムを壊して最後の1辺を跡地に。
#   旧スタジアムの最後の試合（2013-06-05）から102日で、2013-09-16 開場（セルタ戦3対2、3万3000人、仮の収容3万5686）。
#   全部の席がそろった最初の試合は2014-08-27 CL予選 ナポリ戦3対1、4万9017人。収容5万3331。
#   総工費2億1100万ユーロ、52.6％は公の機関（en）。旧スタジアムは1913年から、スペインで最も古いスタジアムで「大聖堂」と呼ばれた（en 旧スタジアムの項）。
#   旧スタジアムの屋根のアーチは練習場レサマへ（en）。
# 屋根と大舞台（ウィキペディア en・es）：屋根を延ばす工事 1260万ユーロ（クラブだけで負担）、2016-11-20 ビジャレアル戦で完成。2015-11-05 世界建築フェスティバルの最優秀スポーツ建築。
#   Euro2020 の会場→感染症の流行で外れ、UEFA は代わりに 2025年のEL決勝などを割り当てた（en・es）。2025-05-21 EL決勝 トッテナム1対0マンチェスター・ユナイテッド、4万9224人（ウィキペディア en の決勝の項）。
#   ラグビーの欧州の決勝 2018年 5万2282人、2026年 5万2327人が最多（en）。
# 見立て（Mundo Deportivo 2026-09-30・Cadena SER 2026-09-28）：
#   平均の入場：2014-15 3万8727／2017-18 3万6898（新しい器で最少）／2022-23 4万3703／2024-25 4万8459（最多）／2025-26 4万8394／今季最初の4試合 4万8095（MD）。
#   2025-26 ÷ 5万3331 ＝ 90.7％。2017-18 → 2025-26 で 1万1496人増、約31％増（自分で計算）。
#   会員になるのを待つ人：「1万1000人あまり」（SER）「約1万1000人」（MD）。
#   計画：最大2440席を足し、約5万6000席に（SER。MD の 5万6008 は 5万3331＋2440 と合わないので言わない）。工事は今季が終わってから。2440 ÷ 1万1000 ＝ 22％（自分で計算）。
# 日本との接点（サッカーの縁）：2026-11-01 アスレティック2対1レアル・ソシエダ（サン・マメス）、久保建英が75分から出場（ESPN の試合記録 event=401882826）。
# 言わなかったもの：ピチチの死因／EUの調査の話／2035年ラグビーW杯の招致／招待席の取りやめ（1019席）。
