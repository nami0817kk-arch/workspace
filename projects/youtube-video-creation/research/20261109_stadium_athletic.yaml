  - text: クラブは今季のあと、最大2440席を足して、およそ5万6000席にする計画です。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card:
      type: stats
      title: 足りない席と、足す席
      items:
      - - '11000'
        - 人
        - 会員を待つ人（およそ）
      - - '2440'
        - 席
        - 足す席（最大）
      - - '22'
        - ％
        - 待つ人に対する割合
      focus: 1
  - text: 足す席は、待っている人の22％ぶん。5人に1人あまりにしか届きません。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card: none
  - text: 花を置く習わしが100年続く大聖堂は、席の足りなさを、どこまで埋められるのか。
    emph: true
