  say:
  - text: ピチチは、ビルバオ生まれの点取り屋です。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card: none
  - text: 1913年8月、旧スタジアムの初戦で、最初のゴールを決めたのがピチチでした。
    emph: true
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card:
      <<: *id_hist
      highlight_row: 0
  - text: アスレティックひと筋で、89試合83点。国王杯を4度、勝ち取りました。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card: none
  - text: 1922年、29歳の若さで亡くなります。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card:
      <<: *id_hist
      highlight_row: 1
  - text: 1926年、旧スタジアムに、ピチチの胸像が置かれました。
    image: assets/images/20261109_stadium_athletic/07_w.jpg
    card:
      <<: *id_hist
      highlight_row: 2
  - text: 花を置く習わしを始めたのは、ハンガリーのクラブ、エムティーケーでした。
    image: assets/images/20261109_stadium_athletic/07_w.jpg
    card: none
  - text: 1927年の元日、その場の思いつきで、胸像に花を手向けたのが最初です。
    emph: true
    image: assets/images/20261109_stadium_athletic/07_w.jpg
    card:
      <<: *id_hist
      highlight_row: 3
  - text: 得点王の賞にピチチの名が付いたのは、1953年。スペインのスポーツ紙が始めました。
    image: assets/images/20261109_stadium_athletic/08_w.jpg
    card: none
  - text: 2013年、新しい器に移るときも、胸像は一緒に運ばれました。
    image: assets/images/20261109_stadium_athletic/05_w.jpg
    card:
      <<: *id_hist
      highlight_row: 4
