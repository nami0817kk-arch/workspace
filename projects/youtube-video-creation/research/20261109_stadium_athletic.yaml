  say:
  - text: 開いたあと、ファンから出た不満は、屋根でした。
    image: assets/images/20261109_stadium_athletic/03_w.jpg
    card: none
  - text: 雨の多いビルバオで、屋根がすべての席を覆っていなかったのです。
    image: assets/images/20261109_stadium_athletic/03_w.jpg
    card: none
  - text: 2016年、クラブは1260万ユーロを自分で出して、屋根を延ばします。
    emph: true
    image: assets/images/20261109_stadium_athletic/04_w.jpg
    card:
      <<: *id_ev
      highlight_row: 1
  - text: その前の年には、世界の建築の祭典で、最も優れたスポーツの建物に選ばれていました。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card:
      <<: *id_ev
      highlight_row: 0
  - text: 2020年のヨーロッパ選手権でも、試合の会場に選ばれていました。
    image: assets/images/20261109_stadium_athletic/02_w.jpg
    card: none
  - text: ところが、感染症の流行で外れ、代わりにヨーロッパリーグの決勝が回ってきます。
    image: assets/images/20261109_stadium_athletic/05_w.jpg
    card: none
  - text: 2025年5月、トッテナムがマンチェスター・ユナイテッドを1対0で破りました。
    image: assets/images/20261109_stadium_athletic/05_w.jpg
    card:
      <<: *id_ev
      highlight_row: 3
  - text: いちばん多く入ったのは、ラグビーでした。
    image: assets/images/20261109_stadium_athletic/01_w.jpg
    card: none
  - text: 2026年5月、ヨーロッパのクラブの決勝に、5万2327人が集まりました。
    image: assets/images/20261109_stadium_athletic/01_w.jpg
    card:
