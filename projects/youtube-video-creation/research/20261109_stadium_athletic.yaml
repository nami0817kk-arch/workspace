- id: rebuild
  heading: 新しいサン・マメスは、なぜ古い器のすぐ隣に建ったのか
  bg: assets/images/20261109_stadium_athletic/02_w.jpg
  tier: 背景
  telop: 4分の3を建てて引っ越し、古い器を壊して最後の1辺を跡地に建てた
  narrator: 解説
