# 記録の解説：連勝（10/11 日、シリーズ「記録の解説」、key: record_streak、型は news）。
#
# 軸は「**リーグ戦の連勝は、その季の試合数に縛られる**」。
#   主役は**ベンフィカの29連勝**（ポルトガル1部、1972年4月9日〜1973年3月11日。2つの季にまたがる）。
#
# **使えないと言われているもの**（10/11 の指示）:
#   代表の無敗（10/3〜10/4 スペイン代表41試合）・**バルセロナの開幕連勝**（9/27）・**日本代表**（10/6〜10/7）。
#   **バイエルン**（同じ日の①が財政バイエルンなので、ブンデスリーガの19連勝は**一度も出していない**）。
#   だから③の比べの表は**ポルトガル・イングランド・イタリアの3つだけ**にした（ドイツを入れると
#   バイエルンになる）。表の題も「ほかのリーグで続いた連勝」で、「各国の記録の一覧」とは言っていない。
#
# 直前2本と重ねないようにしたもの:
#   10/9（1シーズン最多得点）… レヴァンドフスキ・メッシは**出さない**。
#     「点の数だけでは順番が決まらない」「◯試合あたりでは上回る」「順番が入れ替わる」は使わない。
#   10/10（代表の通算出場）… ロナウド・ソー・チンアン・1年あたりに直す・大陸ごとの比べは**出さない**。
#     「1年あたりに直すと先頭が変わる」の形は使わず、こちらは「**季の試合数で割る**」にした。
#   **10/10 と同じ写真を使わない**：10/10 は File:LuzLissabon.jpg（スタジアムの中）を
#     「ポルトガル代表」の下地にしていた。こちらは**別のファイル**（File:Estadio Benfica April 2013-1.jpg、
#     外から見た全景。CC BY-SA 3.0 / Alvesgaspar）を 10/11 に取り直した。
#     ※**いまの本拠地は2003年に開いた建物**で、29連勝を積んだ時代のものではない。
#       だから台本では「この場所で」とは**一度も言っていない**（下地として敷くだけ）。
#
# ★**自分で数えた所**（試合の一覧から1試合ずつ数えた。材料は英語版 Wikipedia の季ごとの記事）:
#   1971-72 の最後の6試合（4/9 アトレチコ5-1、4/16 レイションイス0-1、5/7 アカデミカ3-1、
#     5/14 ギマランイス1-3、5/21 スポルティング2-1、5/28 ファレンセ2-5）→ **6連勝**、得点19・失点6。
#   1972-73 の開幕23試合は**23連勝**（24試合目の4/1 ポルト戦が2対2）。得点76・失点10。
#   合わせて **29連勝・95得点・16失点・無失点15試合**（0失点は 1972-73 で14試合＋1972-73 の前の
#     4/16 レイションイス戦の1試合）。1試合あたり 95÷29＝3.28点、16÷29＝0.55点。
#   季の試合数で割った値：29÷30＝96.7%、18÷38＝47.4%、17÷38＝44.7%、29÷38＝76.3%。
#     96.7−47.4＝**49.3ポイント**。
#   勝ち点は当時2点制（1971-72 は26勝3分で55、1972-73 は28勝2分で58。どちらも計算が合う）。
#
# **一次情報まで辿れた所と、辿れなかった所**（正直に分ける）:
#   ○ **マンチェスター・シティの18連勝**は、**プレミアリーグの公式サイトの記事**で
#     「8月26日（ボーンマス戦）から12月27日（ニューカッスル戦）までの18連勝」と確かめた。
#   △ **インテルの17連勝**は、クラブ公式の記録ページには連勝の数字が無かった（出ているのは
#     97勝点・30勝7分1敗・80得点34失点と「2006年9月〜2007年4月の31試合無敗」）。
#     試合の一覧から**8試合目（2006年10月25日 リボルノ戦）から24試合目まで**が勝ちで、
#     25試合目（ウディネーゼ戦）が引き分けであることを自分で数えて確かめた。
#   △ **ベンフィカの29連勝**は、リーグ（ligaportugal.pt）にもクラブ（slbenfica.pt）にも
#     その頁を見つけられなかった（どちらも該当のURLが404）。**試合の一覧から自分で数えた**のが根拠で、
#     台本では「ヨーロッパの記録」と**言い切っていない**（「いまも破られていないとされています」の形）。
#
# **出していないもの**:
#   当時の得点王の数字（10/9 の回と重なるため、個人の得点は1つも出していない）。
#   ベンフィカの監督・選手の名前（個人に寄せない）。優勝回数・欧州の成績。
# **止まった日の節（③）について**（2026-10-11 追記）:
#   1973年4月1日、エスタディオ・ダス・アンタスでポルトと2対2。得点は 15分 ネネ、26分 エレディア、
#   57分 エウゼビオ、86分 フラヴィオ（**ペナルティーキック**）。季の記事に
#   「controversial late penalty」とあるので、語りは「この判定をめぐっては、いまも異論が伝えられています」
#   までにして、**主審の名前は出していない**（1973年の判定で個人を名指ししない）。
#   そのあと: 残り6試合は5勝1分で、この季はリーグ戦1敗もしていない。
#   ただし1週間後の4月8日、カップ戦でレイションイスに0対2で敗れ、**1年と13日＝378日**の国内無敗が終わった。
#   378日は 1972-03-26 → 1973-04-08 を自分で数えた値（季の記事の「one year and 13 days」と一致）。
#   ★**エウゼビオの得点数とゴールデンシューの話は出していない**（10/9 が1シーズン最多得点の回）。
#     出したのは「4月1日の試合で1点決めた」ことだけ。
#   対戦相手の羅列はしていない（名前が並ぶだけで何も残らないため）。
#   止めた相手の立ち位置も足した: ポルトはこの季**4位・勝ち点37**（ベンフィカ58との差は21）。
#   ベンフィカが落とした勝ち点は60中2で、**片方がこの試合**（計算して確かめた）。
#   ④には比べる2クラブの季の形を足した: シティ 2017-18 は**勝ち点100**（プレミアの公式記事で確認）、
#   インテル 2006-07 は**勝ち点97**（クラブ公式の記録頁で確認）。
#   ②の年表は4行（3/26・4/9・5/28・3/11）にして、止まった話は③に全部移した。
#
# 反応は入れない（シリーズの回。ブラウザの道具を使っていないので集めていない）。
# **本人の言葉は1つも無い**（1972年の試合なので取材できていない）。だから voice_min: 0。
#
# 写真は2枚、入れ替えは1本1回（冒頭＝ベンフィカの本拠地 → ③の節からマンチェスター・シティの本拠地）。
#   ③でイングランドとイタリアの記録を並べるので、そこで替えると画面と話が合う。
# アルファベットは読み上げに出さない。
# サムネは構図 scene（同じ日のもう1本＝財政バイエルンは number なので、2本で構図が違う）。
#   **ユーザーと相談して決める**ので、ここに書いたのは案A。案B・Cは報告に出す。
