  takeaway: ベンフィカはポルトガル1部で29連勝している。1972年4月9日から1973年3月11日までで、2つの季にまたがる。当時の1季は30試合しかなく、29はその96.7%にあたる長さ。内訳は1971-72の最後の6試合と、1972-73の開幕23試合。23勝目の1973年3月11日に、7試合を残して優勝が決まっている。止まったのは3週間後の4月1日、ポルトの本拠地アンタスでの2対2。15分にネネ、57分にエウゼビオが決めて1対2としたが、26分にエレディア、86分にペナルティーキックからフラヴィオが決めて追いつかれた。止まっても順位は動かず、残り6試合を5勝1分で終えてこの季は1敗もしていない。ただし1週間後の4月8日、カップ戦でレイションイスに0対2で敗れ、1年と13日＝378日続いた国内の無敗が終わった。1972-73は30試合28勝2分で、1敗もしていない。29試合で95得点16失点、15試合は相手に点を与えておらず、1試合あたりの得点は3.28、失点は0.55。止めたポルトはこの季を4位・勝ち点37で終えており、ベンフィカとの差は21。ベンフィカがこの季に落とした勝ち点は2つだけで、片方がこの日のもの。連勝が始まった1971-72もベンフィカの優勝で、26勝3分1敗だった。ほかのリーグで続いた連勝は、イングランドがマンチェスター・シティの18（2017年8月26日から12月27日、その季は勝ち点100で優勝）、イタリアがインテルの17（2006年10月25日から2007年2月25日、勝ち点97で優勝）で、どちらも1季38試合。同じ割り方だと18は47.4%、17は44.7%で、ベンフィカの96.7%とは49.3ポイントの差がある。いまの38試合のリーグで29連勝すると76.3%にあたり、1季の4分の3を勝ち続けることになる
  opening_image: assets/backgrounds/stadium_ベンフィカ.png
short_title: ベンフィカの29連勝は2つの季をまたいでいた。止めたのは86分の1点
