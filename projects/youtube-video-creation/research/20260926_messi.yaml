      - メッシのアルゼンチン代表での最後の試合は、10月6日。ブエノスアイレスのモヌメンタルで、相手はベナンです。
      - 代表208試合目。8万5千人の入るスタジアムのチケットは、**2時間足らず**で売り切れました。
