  - id: kit
    main: true
    heading: 最後のユニフォーム
    tier: 報道
    telop: アディダスのロゴの場所に、メッシの「M」
    narrator: キャスター
    say:
      - text: 'メッシのアルゼンチン代表の最後の試合は、10月6日のベナン戦です。'
        short_only: true
      - その試合で着るユニフォームが公開されました。胸から背中まで、国旗の真ん中にある「5月の太陽」が大きく入っています。
      - いつもアディダスのロゴがある場所に、**メッシの「M」**。紋章と名前と10番は金色です。
      - メッシ本人は、背中側だけを先に見せて、こう書きました。
      - voice: リオネル・メッシ
        text: 最後の試合。一生もののユニフォーム
      - この試合を引退の場にと説得したのは、スカローニ監督でした。
      - voice: リオネル・スカローニ
        text: 称えるなら、今やらなければならない。今しかない、先のことは分からないと、全力で説得した
      - 長く一緒に戦ってきたデ・パウルは。
      - voice: ロドリゴ・デ・パウル
        text: 誰よりもそれに値する。楽しんで、泣こう
    sources:
      - https://www.cronica.com.ar/sociedad/la-afa-presento-la-camiseta-especial-que-usara-messi-en-su-partido-despedida-ante-benin/
      - https://www.iprofesional.com/actualidad/465239-como-sera-la-camiseta-de-messi-para-su-despedida-de-argentina
      - https://www.infobae.com/deportes/2026/09/21/el-video-que-compartio-messi-sobre-su-despedida-en-la-seleccion-argentina-las-pistas-que-dio-de-la-camiseta/
      - https://noticiasargentinas.com/deportes/rodrigo-de-paul-sobre-la-despedida-de-messi-de-la-seleccion---vamos-a-disfrutar-y-a-llorar-_a6aac7a154269eea8e125431e
  - id: voices
    heading: ネットの反応
    tier: 未確認
    telop: 「19分で売り切れて泣いた」と「NHKでフルにやっていい案件」
    narrator: キャスター
    say:
      - voice: ネット民
        text: メッシの代表最後のユニ、19分で売り切れて泣いた…
      - voice: ネット民
        text: たまたまアプリ開いたらメッシの最後のユニフォームが発売してた。10分後に再度確認したら全サイズsold outしてた
      - voice: ネット民
        text: 最後の一枚買いたかったけど無理そうなんで、このお金はそのままニコパスの10番のユニの資金にします。グラシアスメッシ！
      - voice: ネット民
        text: ま、まぁメッシ最後のW杯ユニ持ってるしー。全然いいしー。買えなくて悔しいとかないしー
      - voice: ネット民
        text: このユニフォーム100年後の値段エグそう。交換やプレゼントはせずにメッシ自身で保管するのかな
      - voice: ネット民
        text: ユニフォームを燃やされるほど代表で憎まれた過去があったのを想うと、こんなフィナーレは泣けてくる
      - voice: ネット民
        text: メッシはバルサでの退団セレモニーなかったから是非盛大にやって欲しい
      - voice: ネット民
        text: なぜブラジル、ポルトガル、ドイツじゃないのか…聞いたことない国だし
      - voice: ネット民
        text: NHKでフルにやっていい案件です
      - voice: ネット民
        text: 1時間半ネットの列に並んで入れたら、メッシの最後の試合のチケットはもうなかった
      - voice: ネット民
        text: メッシの引退試合のチケットを取るために大学を休んだのに、午後ずっと「待ち時間1時間以上」と出続けた
      - voice: ネット民
        text: サッカーの一部が死ぬみたいだ。この天才の爪の先に届く者すら、もう出てこない
      - voice: ネット民
        text: 全部ありがとう、レオ。僕らに借りなんて何もない
        short_voice: true
