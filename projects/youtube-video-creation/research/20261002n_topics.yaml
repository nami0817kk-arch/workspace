title: 10月2日の題材（ニュース4枠）
lead: 昨夜のエクアドル戦（0-0、PK戦5-4で日本が決勝へ）とロナウドの代表離脱など16件
note: '<b>○×を付けてください。</b>今日のニュースは日本人3本・ほか1本（本編＋ショート）。日本代表の決勝は<b>10/5（月）19:30 国立、相手はニュージーランド</b>（JFA公式の日程）。中身は記事の本文と JFA の試合記録まで確かめてあります。ロマーノの投稿は X の本人のページから読みました。'
items:
- num: 1
  slot: 日本人
  head: 日本、エクアドルと0-0からPK戦5-4で決勝へ。鈴木彩艶が3人目を止め、5人全員が成功
  why: '90分は0-0（シュート日本6・エクアドル5）。先発は3-4-2-1で、谷村海那がA代表初先発、上田綺世は後半から。PK戦は上田→鎌田→伊藤洋輝→相馬→前田の5人全員が成功、鈴木彩艶がカスティジョを止めた。A代表のPK戦勝利は2011年アジア杯の韓国戦以来15年ぶり（ゲキサカ）。森保監督「W杯基準で今日の試合をできたことがチームの成長につながる」。観客65,012人。もう一方の準決勝はニュージーランドがパナマにPK戦で勝ち、10/5の決勝の相手に
    '
  src: JFA 公式の試合記録・ゲキサカ・日刊スポーツ・サッカーキング（10/1）
  url: https://www.jfa.jp/national_team/samuraiblue/kirincupsoccer_2026/schedule_result/pdf/m02.pdf
  fmt: news
- num: 2
  slot: 日本人
  head: 堂安律「間違いなく世界一のキーパーになる」。鈴木彩艶のPKストップと、久保が明かした「チームではもっとえぐいキック」
  why: '堂安「ボールを置いた瞬間に圧というのは重要になってくる。あとはもう彼の能力」。鈴木本人「ゴールを守ることが常に僕の中では1番の優先順位」「先に動くことを意識」。サッカーダイジェストの採点は鈴木7で最高タイ。月間MVPの回（10/1）と重なるので、PK戦の話に絞る
    '
  src: サッカーダイジェスト・ゲキサカ（10/1〜2）
  url: https://www.soccerdigestweb.com/news/detail/id=197909
  fmt: quote
- num: 3
  slot: 日本人
  head: 塩貝健人、PK戦の7番手で出番なし。森保監督に「俺PK下手そうですか」
  why: '86分に入って2トップの左。PK戦は7番目に指名され、蹴る番は来なかった。本人「(練習で)外したことはないので蹴りたかった」「次、国立で決めたい」。蹴る順は中村俊輔コーチの案（コーチの回と近い）
    '
  src: ゲキサカ・サッカーダイジェスト（10/2）
  url: https://web.gekisaka.jp/news/japan/detail/?460143-460143-fl=
  fmt: quote
  weak: true
- num: 4
  slot: 日本人
  head: 久保建英、W杯以来の代表先発。PKは「最近上手くなってるんで」
  why: '今回のシリーズで初先発、67分に交代。13分にエストゥピニャンに倒されてFK。本人「ゴールを決められれば良かったけど満足はいく出来」「ホームのほうが勝率が高いのは本当なんだなと改めて感じました」。久保の今季（クラブの数字）の回とは別の、代表の話になる
    '
  src: ゲキサカ（10/1）
  url: https://web.gekisaka.jp/news/japan/detail/?460128-460128-fl=
  fmt: quote
- num: 5
  slot: 日本人
  head: 瀬古歩夢、3試合続けて先発。プレミアのアングロのユニフォームが破れた肉弾戦
  why: '80分ごろ、競り合いでサンダーランドのアングロのシャツが破れた。本人「前半ちょっと自分が20番(アングロ)に食いつきすぎて背後を取られるシーンが多々あった」「後半修正できた」。採点6.5
    '
  src: ゲキサカ・Football ZONE（10/2）
  url: https://web.gekisaka.jp/news/japan/detail/?460141-460141-fl=
  fmt: quote
- num: 6
  slot: 日本人
  head: 鎌田大地、途中から3つの役割とPK成功。「南米に3連勝、これは間違いなく普通じゃない」
  why: '67分に左のシャドー、79分にボランチ、86分にアンカーへ。PK戦は2人目で成功（本人「軸足がずれてしまった。ああいうのは入れば良い」）。鎌田の9月の回とは別の、この試合の話
    '
  src: ゲキサカ・スポーツ報知（10/1〜2）
  url: https://web.gekisaka.jp/news/japan/detail/?460145-460145-fl=
  fmt: quote
- num: 7
  slot: 日本人
  head: 前田大然、PK戦の5人目で決着。イプスウィッチの同僚は「彼は人間じゃない」
  why: '本人「僕は駆け引きとかできないんで、とにかく思い切り蹴るというだけ」。今夏セルティックからイプスウィッチへ、リーグ5試合で得点・アシスト無し。デイヴィス "He''s not human, I tell you"（9/29、地元サイト）
    '
  src: ゲキサカ・サッカーダイジェスト（10/1〜2）
  url: https://web.gekisaka.jp/news/japan/detail/?460131-460131-fl=
  fmt: quote
- num: 8
  slot: 日本人
  head: 相手から見た日本。エクアドルGK「伊東純也が入った瞬間、観客が沸いた」、韓国紙は「PK戦で辛勝」
  why: 'ガジャルド監督「欧州のビッグクラブに所属する優れた選手が揃っている」。GKガリンデス（39歳）は印象に残った選手に伊東。韓国OSENは「韓国は3-0で大勝、日本は0-0の末PK戦で辛勝」。エクアドルの新聞は「約70分間、真のストライカー不在」。海外の新聞の元記事は未確認（サッカーダイジェストの訳）
    '
  src: サッカーダイジェスト（10/1〜2）
  url: https://www.soccerdigestweb.com/news/detail/id=197922
  fmt: news
- num: 9
  slot: 日本人
  head: 主将・堂安律、主将の試合は5戦全勝でも「ブラジルとの敗戦を忘れることはない」
  why: '堂安「『代表に調整の試合なんてない』と(吉田)麻也くんや(長友)佑都くんが常に言っていた」「全部勝ってるみたいに言われるのはちょっと違う」
    '
  src: ゲキサカ（10/1）
  url: https://web.gekisaka.jp/news/japan/detail/?460136-460136-fl=
  fmt: quote
  weak: true
- num: 10
  slot: 日本人
  head: 佐野海舟、採点は最高タイの7。それでも「判断を早く、質を高く」
  why: '本人「オープンな展開になる時間が多かった」「もう少し判断を早く、そして質を高くやらないといけない」
    '
  src: ゲキサカ（10/2）
  url: https://web.gekisaka.jp/news/japan/detail/?460142-460142-fl=
  fmt: quote
  weak: true
- num: 11
  slot: その他
  head: クリスティアーノ・ロナウド、ポルトガル代表の合宿を離脱。監督の会見に反発、処分は最長6か月の可能性
  why: '2試合続けて先発を外され、ジョルジェ・ジェズス監督の会見のあと、連盟の会長と話して合宿を離れたとインスタで表明。「時が来たらポルトガルの人々に真実を話す」。ポルトガルはロナウド抜きでデンマークに勝った。処分（1〜6か月）はポルトガルの報道を英紙が伝えたもので未確定。ロマーノはヴィティーニャの「その話からは離れている」を投稿
    '
  src: ESPN・Daily Mail・ロマーノ（X）（10/1〜2）
  url: https://www.espn.com/soccer/story/_/id/50075485/cristiano-ronaldo-long-history-rows-coaches
  fmt: news
- num: 12
  slot: ラ・リーガ
  head: メッシ、スペイン2部エルデンセを買収。スペインで2つ目、プロのクラブは初
  why: 'クラブが10/1に発表（国の承認待ち）。今年すでに5部のコルネリャを買っている。ウルグアイのクラブにもスアレスと関わる
    '
  src: ESPN（10/2）
  url: https://www.espn.com/soccer/story/_/id/50078076/lionel-messi-completes-purchase-second-spanish-club
  fmt: news
- num: 13
  slot: ラ・リーガ
  head: レアル・マドリード、バルサの審判委員への支払い問題で「5万ページ」の資料をUEFAへ
  why: 'バルサが2001〜2018年に元審判委員会副会長ネグレイラ側へ840万ユーロを払った件。レアルは「極めて重大な証拠」、UEFAは「相当な量」として調べると発表。バルサは「新しい手続きは始まっていない」と反論。クラシコの前
    '
  src: BBC（10/1）
  url: https://www.bbc.co.uk/sport/football/articles/cwddvdq3pzego
  fmt: news
- num: 14
  slot: その他
  head: ジダン監督、20年前の頭突き以来のイタリア戦。「後悔ではない。誇りには思っていない」
  why: '今夜（10/2）のネーションズリーグ、フランス対イタリア。ジダンは監督就任から2戦2勝で、初めての本拠地の試合。2006年W杯決勝のマテラッツィへの頭突きについて「後悔ではない。自分のキャリアの一部」
    '
  src: ESPN（10/2）
  url: https://www.espn.com/soccer/story/_/id/50077965/france-italy-zinedine-zidane-world-cup-final-headbutt
  fmt: quote
- num: 15
  slot: その他
  head: ハーランド、ポニーテールを描いた広告でノルウェーの航空会社を提訴
  why: 'W杯の間にハーランドの髪型を描いた飛行機の画像を使われ、マーケティング法違反で訴えた。10/9に裁判前の協議。航空会社「なぜ訴えられたのか分からない」。今日のハーランド紹介と同じ日になる
    '
  src: Daily Mail（VG 経由）（10/1）
  url: https://www.dailymail.com/sport/football/article-16176613/Erling-Haaland-SUING-Norwegian-airline
  fmt: news
  weak: true
- num: 16
  slot: その他
  head: クロップ監督、ドイツ代表で初勝利。ヴィルツが無得点の流れを止める
  why: 'セルビアに2-0。就任から3試合目で初勝利。クロップ「これで動画を作るよ」
    '
  src: kicker・Sky Sports（10/1）
  url: https://www.kicker.de/klopp-schwaermt-nach-serbien-spiel-damit-machen-wir-ein-video-1257690/artikel
  fmt: quote
  weak: true
