#   BBC Sport 2026-11-12 選手採点（Sami Mokbel「Kane scores winner but who else made an impression?」） https://www.bbc.co.uk/sport/football/articles/c64gnd7vd912o
#   Marca 2026-11-12「Harry Kane, récord y clasificación」（試合の記事。ケインの言葉は無い） https://www.marca.com/futbol/nations-league/cronica/2026/11/12/harry-kane-record-clasificacion.html
