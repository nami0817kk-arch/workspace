#   https://commons.wikimedia.org/wiki/File:Harry_Kane_England_v_Panama_27_June_26-141.jpg
# 出典で確かめたこと:
#   ・BBC（試合前）: 11年前の2015年に21歳でデビュー。12日のクロアチア戦（ウェンブリー）が126試合目で、ピーター・シルトン（GK、1970〜90年に125試合）を抜き、イングランド男子の歴代最多出場。試合前にウィリアム王子とシルトンから額入りの特別なシャツを受け取った。
#   ・BBC（ライブ記事）: ケインは33歳。ケインは試合前にバロンドールのトロフィーを掲げた（2026年のバロンドール）。PKで決めたのは代表92点目。
#   ・Marca: 試合前にバロンドールを観客に見せ、126試合の記録で表彰された。シルトンが126の背番号入りのシャツを手渡した。
#   ・ESPN（uefa.nations summary event=401861150, 2026-11-12 19:45Z、ウェンブリー）: イングランド 2-1 クロアチア。24分 モーガン・ロジャーズ（アシスト ベリンガム）／59分 ペタル・スチッチ（クロアチア。コーナーから）／64分 ケイン PK（右足、中央）。ケインは先発。
#       BBC：PKはクアンサがスモルチッチに引っ張られて得たもの。VAR確認のあと、ケインはボールを真ん中に蹴り込んだ。
#   ・BBC：この勝利でイングランドは来年のネーションズリーグ準々決勝進出が決まった。日曜（15日）にグループ3の首位スペインとの試合で、勝てば首位に立つ。
#   ・ESPN の順位（uefa.nations standings, グループA3, 2026-11-13 取得）: スペイン 5試合5勝 勝ち点15（得失点差+9）／イングランド 5試合4勝1敗 勝ち点12（+12）。日程（scoreboard dates=20261115）: 11/15 19:45Z スペイン対イングランド（ESPN 表記 England at Spain）。
#   ・本人の言葉（ITV の試合直後の取材。BBC ライブ記事の書き起こし＝英語。台本は私が日本語にしたもの。ITV の映像は見ていない）:
#       "An incredible gesture, reception at the start of the game. Once the game starts, it's about getting the win, getting the three points."
#       "I missed my last one for Bayern, so I think it's always important to try and bounce back with the next one. Try to not miss two in a row but executing. I practiced yesterday like I always do and it's just about going out there and doing it out on the pitch."
#       "It's the perfect opportunity now on Sunday to try and prove ourselves."
#   ・トゥヘル監督の言葉（ITV。BBC ライブ記事）: "We got the job done and it was important because it was a special occasion for Harry [Kane] and he scored the winner, so perfect evening."
# 食い違い: ①Marca の関連見出し（記事内のリンク）に「Kane agranda su leyenda con un doblete」とあるが、記事本文・BBC・ESPN とも得点はPK1点のみ（ESPN の試合記録はケインの得点1）→ 1点で書く。「2得点」は使わない（10/6 のチェコ戦の見出しと取り違えやすい）。
#   ②Marca は「クロアチアの同点の3分後にクアンサがPKを得た」と書くが、ESPN の分はスチッチ59分・ケイン64分（BBC は5分後）→ 分は ESPN に合わせ、「3分後」は使わない。
#   ③本人の言葉は英語の書き起こしだけ。日本語は私の訳で、2回目の PK の言葉（「2回続けて外さないように」）は語順をなぞらず意味で訳した。
# 前の本との重なり: 20261007_record_kane（125試合に並んだ夜に2得点）、20261106_kane_bayern_2029、20261027_kane_ballon_dor。今回の初出: 126試合目での更新と、その夜の決勝PK・本人の言葉。10/6 のチェコ戦・バロンドール・バイエルンとの契約は繰り返さない。
# 【言わないこと】2得点（誤り）／バイエルンの前のPKを外した試合の中身（本人の言葉の中だけ）／今後100点の目標（BBC の映像見出しのみで本文を読んでいない）／スペイン戦の予想／クロアチアの4連敗など相手側の話。
