# 取材: 2026-11-13。requests（ブラウザUA）で BBC・Marca の本文を全文読み、ESPN（site.api.espn.com）で試合と順位を確かめた。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。FotMob は使っていない。
