# スタジアム紹介シリーズ：バルセロナの本拠地（スポティファイ・カンプ・ノウ、11/5 予定）。雛形は 11/1 アトレティコの回。
# 題材の選び方（2026-11-04）：プレミアの並びを出し終え、11/1 にアトレティコを出した。続きはラ・リーガの大きなクラブ。
#   候補はレアル・マドリード（ベルナベウ）とバルセロナ（カンプ・ノウ）。
#   レアル＝直近30日にクラブ紹介 ll17（10/17 公開）・財政 finance_realmadrid（10/9）・finance_real_barca（10/18）と3本出している。
#     しかも改装後の収容が公式で取れない（11/1 の取材メモの控え：ラ・リーガ 8万3186〜8万4000、招致書類 7万8297、会長「8万人前後」）。→ 後ろへ回す。
#   バルセロナ＝直近30日は finance_real_barca（10/18、財政の比べ）だけ。クラブ紹介 ll05 は 9/26 で30日の外。
#     11/1 の控えは「収容が毎月動く」として外したが、2026年3月10日の段階1Cの許可で 6万2652 になり、9月16日時点でも同じ（beIN が RAC1 を引いて）。数字が言えるようになったので選ぶ。
#   重なりの確認：scripts/*stadium_* にバルセロナ・カンプ・ノウは無し。covered.yaml・posted.json にも stadium_barcelona は無い。
#     11/4 のショート「鈴木彩艶、カンプ・ノウでCL初黒星」（suzuki_barca_cl）と会場が同じ。この回では見立ての節で1行だけ触れ、試合の中身（枠内のシュート等）は言わない。
#   picks（research/20261105_picks.txt）：他の担当はフラム・トーレス・バリオス（アトレティコ）・ハキミとアレクサンダー＝アーノルド・奥寺・スロット・ブライトン・ハンブルガーSV・パラグアイ。バルセロナと重ならない。
# 今季のラ・リーガ所属（一次情報）：ESPN の ラ・リーガ（esp.1）2026-27 のバルセロナの日程（teams/83/schedule?season=2026）に 8/23〜10/31 の11試合。会場はスポティファイ・カンプ・ノウ。
# 収容（一次・それに近いもの）：
#   段階1A 2025年10月17日 2万5991（メインスタンドと南のゴール裏。クラブの声明 4384109、ウィキペディア en）
#   段階1B 2025年11月17日 4万5401（ウィキペディア en、クラブの声明）／再開の試合 2025年11月22日 アスレティック 4対0、入場 4万5157（クラブの試合記事 4407322）
#   段階1C 2026年3月10日 6万2652（ウィキペディア en。クラブの声明「the capacity of the Spotify Camp Nou is extended to 62,652」を検索の結果で確認）。北のゴール裏は3層のうち2層が閉じたまま
#   2026年9月16日時点でも 6万2652（beIN、RAC1 を引いて。「2027年の初めに7万〜7万2000」はクラブの予定で確定ではないので台本では言わない）
#   改装前 9万9354（ウィキペディア en・es の当時の収容）。開場時 10万6146、1982年W杯に向けて 12万1401。最多入場 12万（1986年3月5日 ユヴェントス戦）
#   計算：62652÷99354=0.6306＝約63％／99354-62652=36702／105000-62652=42348
# 費用：2014年の計画で約6億ユーロ（2017〜2021年の予定）。2020年10月に 7億2500万＋金融費用9000万。2021年10月に代議員総会が15億まで、12月に会員投票で承認。
#   2026年9月19日の代議員総会で 5億1000万を追加承認（うち3億が完成のため）。見積りの総額は約20億ユーロ（ウィキペディア en・3cat・livescore/goal）。20億÷6億＝約3.3倍
# 歩み（ウィキペディア en・es）：1954年3月28日着工、1957年9月24日開場（メルセの日）。1982年W杯の開幕戦（アルゼンチン0対1ベルギー、9万5000人）。1989年欧州杯決勝、1992年五輪の決勝、1999年CL決勝（マンU 2対1 バイエルン）。
#   2007年9月18日 ノーマン・フォスターの案（10万5000・2億5000万ユーロ・2011-12季に完成予定）→ 2008年の金融危機で遅れ、2010年6月30日のロセイ会長の就任で終わる。
#   2014年1月 理事会が新築ではなく改装を選ぶ（エスパイ・バルサ、10万5000）→ 2014年4月 会員投票で承認。
#   2016年3月8日 日本の設計事務所、日建設計（Nikken Sekkei）とピンセル（Pascual i Ausió）の案が国際設計競技で選ばれる（en・es 一致）。2023年初めにトルコの Limak が元請け、日建設計は「デザインの守り手」として残る。
#   2023年6月1日 工事開始。2023-24・2024-25 はモンジュイックの五輪スタジアム。2025-26 は最初の7試合をヨハン・クライフ・スタジアムと五輪スタジアムで。
# これから（3cat 2026-09-19、会計責任者フェラン・オリベの総会での発言）：「5月に最後の試合が終わると屋根の取り付けを始める」「戻るのは2028年1月に決めた」「9万5000人で戻れば必要な収入が得られる」。
#   最終の10万5000は2028-29季の前（ウィキペディア en。3cat は「2028年夏」）。台本では「2028年の夏ごろ」は言わず「2028-29季の前」と言う。
#   2029年のCL決勝（2029年6月2日）の会場に決定：UEFA 2026年9月15日（ウィキペディア en・beIN）。
# 入場（ESPN の試合記録・ラ・リーガ 2026-27、ホーム6試合。控え scratchpad の cn）：
#   8/27 アスレティック 5万9326（2対0）／8/31 ラージョ 5万7768（5対2）／9/16 ラシン 5万568（7対2）／10/10 ヘタフェ 5万9465（3対0）／10/25 レアル・マドリード 6万2055（1対2）／10/31 アラベス 5万3523（6対1）
#   合計34万2705・平均5万7117.5＝収容の91.2％。レアル戦 62055÷62652=0.9905＝99.0％、満員まで 597。
#   CL 11/3 アストン・ヴィラ 5万2662（3対0。ESPN 20:00Z＝現地21時、日本時間4日早朝）。9/9 フェイエノールト戦は ESPN の入場が0（記録なし）なので使わない。
# 日本との接点（サッカーの縁）：①設計は日本の日建設計（建物の縁。選手の縁ではないので、歩みの1行として言う。「日本との接点」として節は立てない）
#   ②11/3 のCLでアストン・ヴィラの鈴木彩艶がこの本拠地のゴールを守った（11/4 のショートと会場が同じ。見立てで1行）。
# 言わなかったもの：命名権の金額（報道の推定のみ）／2027年の初めに7万〜の予定（RAC1 の報道で確定ではない）／ベルナベウとの大きさの比べ（ベルナベウの収容が公式で取れない）／コンサート／女子の入場記録（女子は扱わない）／フェイエノールト戦の入場。
# 写真：assets/images/20261105_stadium_barcelona/（credits.json）。5枚とも Commons（CC0・CC BY・CC BY-SA）。2026年の内観（Camp nou 2026.png）は 429 で取れなかった。
