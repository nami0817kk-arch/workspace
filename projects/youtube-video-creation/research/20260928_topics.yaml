title: 9月28日の題材
lead: 9/27 の21時半までに出た見出しから14件
note: <b>○×を付けてください。</b>明日は9:00〜10:30にマンCの2本（本編・ショート）が入っているので、空いているのは10:30のあとです。<br><br>①は、午後に「元の記事が無い」として外した、堂安と塩貝の「大喧嘩」の噂の続きです。今日の会見で森保監督と本人たちが否定したので、<b>否定した側の言葉</b>として入れています。噂の中身と、配信した人の名前は扱いません。<br><br>日本代表のベネズエラ戦（③）は<b>明日の夜</b>です。決まりどおり、試合の後に作ります。今夜ある欧州の代表戦（ドイツ対ギリシャ、オランダ対セルビアなど）の結果は、朝にもう一度集めて足します。クロップとヴィルツの回（午後の⑧）は、ドイツ対ギリシャの結果を入れて明日お見せします。<br><br>ロマーノの投稿は今回も読めませんでした。中身はまだ<b>見出しだけ</b>です。
items:
- num: 1
  slot: 日本人
  head: 森保監督が会見で異例のお願い「選手が傷つくような配信はやめてもらいたい」。堂安「逆にちょっとかわいそう」、塩貝「律くんとは普通に話すし、すごくリスペクト」
  why: '一部の動画配信で流れた「代表の中で揉めた」という話を、監督と当の2人が公の場で否定した、という記事。**本人たちの言葉**がある。
    '
  src: ゲキサカ・サッカーキング・フットボールチャンネル（9/27）
  url: https://web.gekisaka.jp/news/japan/detail/?459845-459845-fl
