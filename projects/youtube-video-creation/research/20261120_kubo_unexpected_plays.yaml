# **誰の発言か（依頼文の確認事項）: 久保本人ではない。日本代表OBの田中マルクス闘莉王さんが、2026-11-19 に自分の YouTube（闘莉王TV）でパラグアイ戦を採点する中で語った久保評。**
#   見出しの「意外だった」「難しい」は闘莉王の言葉。記事本文: 「所属先でプレーしていないと、なかなかコンディションが上がってこないし難しい。この2026-11-17 のこの2試合でのパフォーマンスは意外だった。…」
#   一次を探した: YouTube の動画（闘莉王TV）題名「「キレがヤバすぎる！ボールを持てば何かが起きる」パラグアイ戦敗北もエース久保を大絶賛！ソシエダで不遇も復活に太鼓判」（https://www.youtube.com/watch?v=Q_TGbz4hWfI 、検索結果で確認。題名に「ボールを持てば何かが起きる」とソシエダの話がある）。動画の音声・文字起こしは読んでいない＝発言の字句はトリベラ記事の引用に頼る。→ 台本は「闘莉王さんは〜と話しました」の伝聞で、voice: は使わない（本人の声ではない）。
# 出典で確かめたこと:
#   ・ESPN の試合データ（site.api.espn.com fifa.friendly summary）:
#       ブラジル戦（event=401916337、2026-11-14）: 日本 3-2 ブラジル。15分 久保建英の先制ゴール（アシスト 堂安律）。久保は先発で62分に佐野海舟と交代。
#       パラグアイ戦（event=401916336、2026-11-17）: 日本 1-2 パラグアイ。久保は61分に鈴木唯人と交代で途中出場。85分 福田師王のヘディング（セットプレーから）。
#       福田のゴールが久保のFKから（GKが弾いたこぼれ球）: 11/18 の取材メモ（20261118_fukuda_debut_goal_words）で サッカーキング・ゲキサカの本文から確認済み。トリベラ記事も同じ。
#   ・ESPN のレアル・ソシエダの日程（esp.1 teams/89/schedule、全12試合のうち記録のある試合）と各試合の出場記録: 久保は 先発5試合（8/21・8/26・9/3・10/18・11/8）／途中出場3試合（8/29・9/13・11/1）／出場なし4試合（9/7・9/20・10/11・10/25）。→ 自分で数えた。
# 食い違い（台本では使わない）:
#   ・トリベラ記事は「ゴールこそなかった」「ブラジル戦で…シュートは惜しくも外れた」と書くが、ESPN ではブラジル戦で久保が15分に決めている（11/15 の本で扱い済み）。記事の「ゴールこそなかった」はパラグアイ戦の話と読み、台本は ESPN に合わせる。ブラジル戦の外れたシュートの話は使わない。
#   ・記事は「所属先で出場機会を得られていない」とするが、ESPN では 12試合中 先発5・途中出場3。闘莉王さんが言う「試合に出ていない」は「先発が減っている」の意味に近い。台本は闘莉王さんの言葉を伝聞で引き、数字は ESPN の数え方を別に出す（闘莉王さんの言葉の裏づけとは言わない）。
# 前の本との重なり: 20261115_kubo_brazil_goal_words（久保本人の先制点の言葉）、20261118_kubo_moriyasu_words（久保の森保監督との過去）、20261118_fukuda_debut_goal_words（福田の初ゴール、久保のFKは1行）。→ 今回の初出は「闘莉王さんの久保評」と「ソシエダでの出場の数え方」。久保のFK・先制点は1行だけ。
# 【言わないこと】久保本人の発言として読む／「久保はソシエダで出ていない」と言い切る／ブラジル戦の外れたシュート／鈴木唯人ら他の選手への評価（記事は「格の違い」と書くが、闘莉王さんの発言として確かめられない）。
# 本人の言葉: 無し（久保本人ではなく闘莉王さんの言葉）。X。
