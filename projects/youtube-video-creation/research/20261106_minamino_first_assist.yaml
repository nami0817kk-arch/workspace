# 取材メモ（2026年11月6日）南野拓実、大ケガからの復帰後初アシスト＆初のフル出場。モナコはECL3連勝（ニュースのショート。見せ方 X＝強い一言を冒頭に）
# 取材: 2026-11-06。requests（ブラウザUA）で本文を全文読んだ。検索エンジンのAI要約は使っていない。ブラウザの道具は使っていない。
# 題材の元: サッカーキング 2026-11-06「南野拓実、復帰後初アシスト記録＆フル出場！…モナコがノアシェランに完勝しECL3連勝」（全文）。
# 出典で確かめたこと:
#   ・ESPN の試合データ（site.api.espn.com uefa.europa.conf summary event=401915824、11/5 20:00 UTC キックオフ）:
#       モナコ 2-0 ノアシェラン。33分 デトゥルベ（アシスト 南野拓実）／90+1分 アブリーヌ（アシスト デトゥルベ、カウンター）。
#       南野は先発で交代なし（＝フル出場）。シュート3・アシスト1・オフサイド1。
#   ・ゲキサカ 462607・462604（全文）: 右サイドハーフで先発。前半33分、テゼのワンタッチのスルーパスに反応してゴールエリア右へ抜け出し、
#       ファーへ流れたボールをデトゥルベが押し込んだ。復帰後4試合目で初アシスト。公式戦のアシストは昨年10月19日のリーグ・アン第8節アンジェ戦以来、約1年ぶり。
#       後半、ヘディングでネットを揺らしたがオフサイド（幻のゴール。昨年11月のパリSG戦以来の得点にはならず）。
#       復帰後の出場は最長59分だった → この日は交代なしの90分。ECLは開幕2連勝で迎えた一戦（→3連勝）。
#       ケガは昨年12月21日 フランス国内杯オセール戦の左膝前十字靱帯断裂、10月15日 ECL第1節CSKAソフィア戦で公式戦復帰。
#   ・ASモナコ公式 試合の記録（compte rendu）: 「trois sur trois en Ligue Conférence」（ECL3戦3勝）。33分 南野のクロスをデトゥルベが押し込む。
#       デトゥルベはモナコでの初得点。51分 南野のヘディングはオフサイドで取り消し。87分 南野のボレーは相手GKが止めた。
#       → 取り消しの分は、クラブ51分／サッカーキング52分／ゲキサカ「後半7分」で食い違う。台本では分を言わない（「後半」とだけ言う）。
#       → 33分の場面は、サッカーキング「折り返し」、ゲキサカ「シュート性のボール」、クラブ「クロス（Centre）」。台本は「送ったボール」とだけ言う。
#   ・ASモナコ公式 フィリペ・ルイス監督の試合後の言葉（フランス語。全文を読んだ）:
#       "Mais quand vous vous approchez, vous avez besoin de joueurs capables d'être dangereux, de tenter, et de faire des déplacements de manière verticale,
#        comme l'a très bien fait Taki' (Minamino), qui a très bien attaqué les espaces."
#       → 台本の言葉は私が日本語にしたもの。「Taki'」はクラブが括弧で（Minamino）と添えているので、台本では「南野」と書く。中身は変えていない。
# 自分で数えたもの: 復帰後の出場の最長 59分（ゲキサカ）→ この日 90分。復帰後の最初の3試合のアシストは0（「4試合目で初アシスト」から）。
# 本人の言葉: 無し（ゲキサカ2本・サッカーキング・クラブ公式・Detourbet と Mawissa の試合後の言葉の記事を当たった。南野本人の試合後の言葉は見つからなかった）。→ X。
# 写真: assets/images/20261106_minamino_assist/（credits.json）。ASモナコ公式の試合の記録に載った、この試合の写真（842x561）。02＝デトゥルベとのハイタッチ（笑顔）、03＝ドリブル、04＝ボレー、05＝アシスト後に喜ぶ背中（18番）。
#   サッカーキング・ゲキサカの写真は全部 Getty（キャプション・透かし）なので使わない。photopool が最初に置いた assets/images/20261106_minamino_first_assist/ の3枚は Getty なので使わない（消したいが、消す操作が止められたので残してある）。
#   01.jpg は portrait が拾った2015年ザルツブルク時代の Commons 写真で、使わない。
