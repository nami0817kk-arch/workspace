    image: assets/images/20261027_stadium_forest/03_w.jpg
    card:
      <<: *id_name
      highlight_row: 3
  - text: 4万9946人です。
    image: assets/images/20261027_stadium_forest/03_w.jpg
    card:
      <<: *id_name
      highlight_row: 3
  - text: いまの収容の、約1.6倍。まだ立ち見の客席が多かった頃の記録でした。
    image: assets/images/20261027_stadium_forest/03_w.jpg
