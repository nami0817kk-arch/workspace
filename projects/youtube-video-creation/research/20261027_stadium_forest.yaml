    image: assets/images/20261027_stadium_forest/04_w.jpg
    card: none
  - text: 昨季のホームのリーグ戦は、平均3万473人。収容の99.1％です。
    image: assets/images/20261027_stadium_forest/04_w.jpg
    card:
      <<: *id_view
      highlight_row: 0
    mark:
      kind: circle
      row: 0
  - text: 今季のホーム4試合は、平均3万746人。収容の98.5％です。
    image: assets/images/20261027_stadium_forest/04_w.jpg
    card:
      <<: *id_view
      highlight_row: 1
  - text: 2026年9月16日、ラッシュクリフ区の計画委員会が、本拠地の拡張を認めました。
    image: assets/images/20261027_stadium_forest/02_w.jpg
    card: none
  - text: メインのピーター・テイラー・スタンドを建て直し、トレント・エンドの両隅も埋める。
    image: assets/images/20261027_stadium_forest/02_w.jpg
    card: none
  - text: これで、約4万5000席になります。
    image: assets/images/20261027_stadium_forest/02_w.jpg
    card:
      <<: *id_view
      highlight_row: 2
  - text: 今季の収容の順位に当てはめると、チェルシーを抜いて9番目。
    image: assets/images/20261027_stadium_forest/02_w.jpg
    card: none
  - text: さらにブライアン・クラフ・スタンドも広げれば、約5万2500席。
    emph: true
    image: assets/images/20261027_stadium_forest/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 3
  - text: こちらは、まだ大まかな許可の段階。細かい審査は、これからです。
    image: assets/images/20261027_stadium_forest/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 3
  - text: これなら、サンダーランドも抜いて、8番目に入ります。
    image: assets/images/20261027_stadium_forest/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 3
  - text: 5万2500席なら、1967年のあの入場を、2554人上回る計算。
    emph: true
    image: assets/images/20261027_stadium_forest/01_w.jpg
    card:
      type: calc
      title: 最終の計画と、1967年の入場（自分で引いた）
      terms:
      - - 5万2500席
        - 最終の計画
      - - 4万9946人
        - 1967年の入場
      - - 2554人
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 市の外の「シティ」は、川沿いのまま、どこまで大きくなれるのか。
    image: assets/images/20261027_stadium_forest/01_w.jpg
    card: none
