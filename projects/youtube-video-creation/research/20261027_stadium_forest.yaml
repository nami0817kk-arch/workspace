# スタジアム紹介シリーズ：ノッティンガム・フォレストの本拠地（シティ・グラウンド、10/27 19:00 予定）。雛形は 10/26 リーズの回。
# 重なりの確認（2026-10-26）：scripts/*stadium_* は18本（ボーンマス・エミレーツ・ヴィラ・ブレントフォード・ブライトン・チェルシー・オールド・トラッフォード・アンフィールド・
#   トッテナム・エティハド・ニューカッスル・エヴァートン・パレス・フラム・サンダーランド・ウェストハム・リーズ・サン・シーロ）。フォレスト無し。covered.yaml・posted.json にも stadium_forest は無い。
#   クラブ紹介⑱フォレスト（2026-09-20）とユニフォーム kit_forest（10/22）は別シリーズ。
# 今季のプレミア所属（一次情報）：ESPN の順位（2026-27 English Premier League）にノッティンガム・フォレスト 18位・8試合6点。PL公式の試合API でも今季のリーグ戦8試合。
#   残りの未出は ハル・イプスウィッチ・フォレスト・コヴェントリー。大物（欧州カップ2度）のフォレストを選んだ。
# 収容（PL公式ハンドブック2026/27 の Club Directory: Nottingham Forest、控え research/raw/20261021_nufc_plhandbook.txt 1621〜1624行）：31,212・ピッチ 105×68m。所在地 Pavilion Road, West Bridgford。
#   20クラブの並び（同じハンドブック）：13位ブライトン 32,176／14位フォレスト 31,212／15位イプスウィッチ 30,294／1位マンU 74,158。8位サンダーランド 48,095・9位チェルシー 40,044。
#   自分で引いた・割った：32,176-31,212=964／31,212-30,294=918／31,212÷74,158=0.421＝約42％／49,946÷31,212=1.600／45,000-31,212=13,788／52,500-31,212=21,288／52,500-49,946=2,554。
#   4万5000席なら チェルシー 40,044 より上でサンダーランド 48,095 より下＝9番目。5万2500席なら サンダーランドより上でニューカッスル 52,729 より下＝8番目（自分で並べた）。
# 本拠地の歴史（ウィキペディア en "City Ground"、控え scratchpad の wp_cityground.txt）：
#   トレント川のほとり、ウェスト・ブリッジフォード。メドウ・レーン（ノッツ・カウンティ）まで300ヤード（約270m）。プロの本拠地どうしでイングランドでいちばん近い。英国ではダンディーのタナダイスとデンズ・パークに次ぐ2番目。
#   フォレストは1865年創立。シティ・グラウンドは7番目の本拠地（1898年から）。
#   1897年7月、市になったのを記念して旧本拠地タウン・グラウンドをシティ・グラウンドと改名。新しい市議会は建物を建てるため借地を打ち切り、川の南の土地を差し出した。
#   その土地は1551年2月21日、エドワード6世の勅許で町に与えられた土地。地代でトレント橋を保つためのもの。
#   1898年9月3日、ブラックバーン戦で正式に開場（1万5000人）。1922年、楕円のゴールポストを初めて使った。1980年8月、欧州カップ連覇などの時代の収益で250万ポンドのスタンド（のちのブライアン・クラフ・スタンド）。
#   最多入場 49,946（1967年10月28日、マンU戦。インフォボックス）。1935年に7000ポンドで買う話を断る。1964年に50年の借地（年750ポンド）。
#   2019年に市から借地を250年延長。2024年2月に地代でもめ、クラブは移転案の再開を口にした。2024年7月、市が土地をクラブに売ることに同意。
# ラッシュクリフ区（一次情報）：区の発表「Forest … are proud they call Rushcliffe home」。区の計画委員会が審査（2026-09-16 の会議の告知）。
# 拡張（Building 2026-09-25、VAVEL 2026-09-16、ウィキペディア）：2026年9月16日、ラッシュクリフ区の計画委員会が承認。
#   ピーター・テイラー・スタンドの建て直し＋トレント・エンドの角を埋める＝約4万5000席（本申請）。ブライアン・クラフ・スタンドは大まかな許可（outline）で＋7500＝約5万2500席。
#   本申請への意見は賛成882件・反対19件（Building）。費用・完成年は記事で食い違うので言わない。
# 入場：2025/26 はハンドブックの入場表（32911行）：19試合・平均30,473・99.1％・最多31,013（フラム戦）。順位は16位。
#   2026/27 ホーム4試合（PL公式API）：8/22 30,739／9/5 30,686／9/19 30,666／10/18 30,893 → 合計122,984・平均30,746（収容の98.5％）。
# 言わなかったもの：ヒルズボロ／女子チーム／コンサート・ラグビー／オーナーの名前／今季の勝敗／移転案の候補地の細部／費用と完成年（食い違い）。
# 日本との接点：本拠地には見当たらず（無理に入れない）。
