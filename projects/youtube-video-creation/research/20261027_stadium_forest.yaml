  say:
  - text: 名前の「シティ」は、市という意味です。
    image: assets/images/20261027_stadium_forest/05_w.jpg
    card: none
  - text: 1897年、ノッティンガムは、市になりました。
    image: assets/images/20261027_stadium_forest/05_w.jpg
    card:
      <<: *id_name
      highlight_row: 0
  - text: それを祝って、当時の本拠地タウン・グラウンドは、名前をシティ・グラウンドに。
    image: assets/images/20261027_stadium_forest/05_w.jpg
    card:
      <<: *id_name
      highlight_row: 0
  - text: ところが、できたばかりの市議会は、その土地に建物を建てると決めます。
    image: assets/images/20261027_stadium_forest/05_w.jpg
    card: none
  - text: フォレストの借地は、打ち切られました。
    image: assets/images/20261027_stadium_forest/05_w.jpg
    card: none
  - text: 代わりに市が差し出したのが、トレント川の南側の土地でした。
    emph: true
    image: assets/images/20261027_stadium_forest/08_w.jpg
    card: none
  - text: 1898年9月3日、ブラックバーン戦で正式に開場。1万5000人が入りました。
    image: assets/images/20261027_stadium_forest/08_w.jpg
    card:
      <<: *id_name
      highlight_row: 1
  - text: 新しい本拠地も、名前は、シティ・グラウンドのままでした。
    image: assets/images/20261027_stadium_forest/08_w.jpg
    card: none
  - text: ただ、川の南は、ウェスト・ブリッジフォード。ノッティンガム市の外でした。
    emph: true
    image: assets/images/20261027_stadium_forest/07_w.jpg
    card: none
  - text: いまも、ここは市ではなく、隣のラッシュクリフ区。
    image: assets/images/20261027_stadium_forest/07_w.jpg
    card: none
  - text: 「シティ」は、市の外に立っているんです。
    image: assets/images/20261027_stadium_forest/07_w.jpg
    card: none
  - text: 1922年には、ここで初めて、楕円の形のゴールポストが使われました。
    image: assets/images/20261027_stadium_forest/03_w.jpg
    card:
      <<: *id_name
      highlight_row: 2
