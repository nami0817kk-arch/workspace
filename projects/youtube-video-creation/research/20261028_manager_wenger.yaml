  say:
  - text: ここで、ベンゲル本人の言葉。まず、日本について。
    image: assets/images/20261028_manager_wenger/04_w.jpg
    card: *words_doc
  - voice: ベンゲル
    text: 日本には、ヨーロッパが失ってしまった美しいものがある。
  - voice: ベンゲル
    text: 人生を良くしてくれる、美しいものだ。
    cont: true
    pause: 0.5
  - text: もう1つは2003年の夏、優勝を逃したあと選手たちに向けた言葉です。
    image: assets/images/20261028_manager_wenger/03_w.jpg
    card: *words_doc
  - voice: ベンゲル
    text: そう言ったのは、君たちならできると思ったからだ。
  - voice: ベンゲル
    text: でも、本気で望まなければならない。
    cont: true
    pause: 0.5
  - text: その季、アーセナルは本当に1度も負けませんでした。
    image: assets/images/20261028_manager_wenger/01_w.jpg
    card: none
