# 監督紹介：ベンゲル（10/28 水、シリーズ「監督紹介」、key: manager_wenger、型は news）。9節の型（2026-10-20 決定）。見本は 20261027_manager_flick。
# 順：フック→基礎DATA→日本との接点（基礎DATAの次）→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **重なりの確認（2026-10-28 に自分で）**：scripts/・research/covered.yaml・research/posted.json を grep。
#   ベンゲル／ヴェンゲル／Wenger は posted.json・covered.yaml に 0件。scripts は脇役として名前が出るだけ（アーセナルのクラブ紹介・エミレーツ・アルテタ・アンリ・稲本のレジェンド・トルシエ・グアルディオラ・シメオネ）。
#   既出の監督紹介：グアルディオラ・アンチェロッティ・モウリーニョ・クロップ・シメオネ・アルテタ・フリック。ルイス・エンリケは 10/26 にショートがあるので避けた。
#   10/24 の「稲本潤一」レジェンドとは、稲本の名前を1行出すだけ（アーセナルに来た日本人3人の1人）。稲本の話はしない。
#
# **いまの立場（確かめた）**：退任した監督（2026-10-20 決定「退任した監督も扱ってよい」）。
#   ○ 英語版 Wikipedia「Arsène Wenger」（控え research/raw/20261028_wenger_wiki.txt・_plain.txt、2026-10-28 取得）：
#     infobox office = Chief of Global Football Development of FIFA、term_start 13 November 2019（後任の記載なし＝現職）。冒頭「has been serving as FIFA's Chief of Global Football Development since 2019」。
#     「He stepped down as Arsenal manager in 2018 and retired from club management.」
#   × FIFA 公式のページは当たっていない（requests で読める形のページが見つからなかった）。
#
# **通算（台本とサムネをそろえる）**＝英語版 Wikipedia「Managerial statistics」（Soccerbase、match played 13 May 2018。名古屋は J リーグのデータサイト）：
#   ナンシー 114試合 33勝30分51敗／モナコ 349試合 169勝105分75敗／名古屋グランパスエイト 87試合 49勝4分34敗／アーセナル 1235試合 707勝280分248敗
#   ＝合計 1785試合 958勝 419分 408敗。勝率（自分で割った）：合計 958/1785＝53.7%、ナンシー 28.9%、モナコ 48.4%、名古屋 56.3%、アーセナル 57.2%。
#   ※当時の J リーグは引き分けが無い（延長・PK で決着。Wikipedia の注記）→ 名古屋の勝率は、ほかと同じ物差しではない。台本では名古屋の勝率を比べに使わない。
#   優勝（Wikipedia Honours「Manager」）：モナコ 2（1部 1987-88、フランス杯 1990-91）／名古屋 2（天皇杯 1995、スーパーカップ 1996）
#     ／アーセナル 17（プレミアリーグ 1997-98・2001-02・2003-04、FAカップ 7回 1997-98・2001-02・2002-03・2004-05・2013-14・2014-15・2016-17、チャリティ／コミュニティ・シールド 7回）＝21。
#   FAカップ7回は「the competition's most successful manager」（Wikipedia 冒頭）→ 台本は「いちばん多い」。
#   最初の8季（1996-97〜2003-04）：リーグ優勝3・FAカップ3（98・02・03）。残り14季（2004-05〜2017-18）：リーグ優勝0・FAカップ4（05・14・15・17）（自分で数えた）。
#
# **基礎**：1949-10-22 フランス・ストラスブール生まれ（77歳）。MF。ストラスブール大学で経済を学ぶ。愛称「ル・プロフェッスール（教授）」。1981年に監督の資格。
#   1984 ナンシー → 1987 モナコ → 1995 名古屋 → 1996-10-01 アーセナル（就任発表 9月22日）→ 2018-05 退任 → 2019-11-13 FIFA。
#   アーセナルの在任 22年は、プレミアリーグの監督で最も長い（Wikipedia 冒頭）。
#
# **日本との接点（一次で確かめた範囲。サッカーの縁だけ）**＝英語版 Wikipedia「1994–1996: Nagoya Grampus Eight」節：
#   ・1994年12月、トヨタが主に持つ名古屋グランパスエイトの監督に（2年契約）。前の季、名古屋は J リーグの最下位。
#   ・シーズン中の休みにフランスのヴェルサイユで合宿 → 続く27試合で17勝。1995年 J リーグ最優秀監督（ストイコビッチが選手の賞）。
#   ・1996年1月 天皇杯（サンフレッチェ広島を破る）＝クラブ初のタイトル。2か月後スーパーカップ（横浜マリノスに 2-0）。
#   ・1996年8月28日が最後の試合。ファンに日本語でお礼の言葉。2013年にアーセナルを連れて名古屋と親善試合（「a decade later」＝2003年の10年後）。
#   ・食事：「日本での暮らしに影響を受けた」。ゆでた野菜・魚・ご飯（Wikipedia「Preparation」節の引用）→ アーセナルに栄養士を入れた。
#   ・アーセナルの日本人：稲本潤一（2001〜02、期限付き。Wikipedia「Junichi Inamoto」infobox）・宮市亮（2010年の練習参加ののち加入。Wikipedia「Ryo Miyaichi」）・浅野拓磨（2016〜19。Wikipedia「Takuma Asano」infobox）。どれもベンゲルの在任中。
#
# **戦術の色**（Wikipedia「Tactics」節）：就任のときの言葉「real, modern football. That means compact lines, of zones, of quick, coordinated movements with a good technique.」。
#   4-4-2 を好む（"no other formation is as efficient in covering space"）。実例の試合＝2004年3月のポーツマス戦 5-1。
#   「the magnificently fluid Ajax of the early 70s」になぞらえられ、相手のサポーターが立って拍手（Wikipedia）。※大会名・得点者は確かめていないので言わない。
#   2003-04（英語版 Wikipedia「2003–04 Arsenal F.C. season」、控え research/raw/20261028_arsenal_2003_04_wiki.txt）：リーグ 26勝12分0敗＝無敗優勝。勝ち点 90（26×3＋12、自分で数えた）。
#   無敗の優勝はプレストン以来115年ぶり（Wikipedia）。リーグ49試合無敗は 2004-10-24 のマンチェスター・ユナイテッド戦（0-2）で止まる。イングランドの記録。
# **本人の言葉（自訳。原文は Wikipedia の本文の引用）**：
#   ①日本について「It has beautiful things that we have lost in Europe, beautiful things that make life good.」
#   ②2003年夏、前の季に「無敗で終える」と言って優勝を逃したあと、選手に「Look, I said that because I think you can do it. But you must really want it,」
# **マル秘話**：最後のホームゲーム 2018-05-06 バーンリーに 5-0、無敗優勝の金のトロフィーの複製を贈られる／2023年7月、そのトロフィーを掲げた像がエミレーツの外に／2006 CL決勝でバルセロナに 1-2、UEFAの3大会すべての決勝で敗れた唯一の監督。
#
# **入れなかったもの**：家族・私生活・父の戦争の話、ファーガソンとの口論・ピザ事件・罰金、退任の経緯への批判、契約の金額、ニュースの反応、女子、Jリーグの今の話（名古屋の話はベンゲルの経歴として1995〜96年だけ）。
