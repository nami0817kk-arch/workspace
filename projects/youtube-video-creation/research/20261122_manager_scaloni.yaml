    image: assets/images/20261122_manager_scaloni/01_w.jpg
    card: *view_table
  - text: 取った点は231点。1試合では、2.16点です。
    card:
      <<: *view_table
      highlight_row: 3
  - text: 取られた点は57点。1試合では、0.53点。
    emph: true
    mark: {kind: circle, row: 4, col: 2}
    card:
      <<: *view_table
      highlight_row: 4
  - text: 取る点の、4分の1しか取られていません。
    image: assets/images/20261122_manager_scaloni/01_w.jpg
    emph: true
    card:
      <<: *view_table
      highlight_row: 4
  - text: 負けにくさの中身は、その差にあります。
    card: none
  - text: 契約は、2026年12月まで。
    card: none
  - text: 2028年までの更新で合意と報じられていて、次の2年がどう始まるのか、注目です。
    image: assets/images/20261122_manager_scaloni/01_w.jpg
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Lionel_Scaloni
