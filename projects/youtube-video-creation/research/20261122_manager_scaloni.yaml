# 監督紹介：リオネル・スカローニ（11/22 日、シリーズ「監督紹介」、key: manager_scaloni、型は news）。8節（日本との接点は無し）。見本は 20261118_manager_nagelsmann。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-12）**：既出18人以外の大物から。W杯優勝1回・コパ2回の現役のアルゼンチン代表監督。契約更新の話が動いている（いま見る理由）。
#   **重なりの確認（2026-11-12 に自分で）**：scripts/ に「監督紹介」でスカローニを主題にした本は無い。ニュースでは 2026-09-12「スカローニの契約が12月で切れる」（scaloni_contract）と 09-30（メッシの10番）があるが、
#     台本では過去回に触れない（決まり）。同じ 11/22 の他担当（20261119_picks.txt）：代表＝スイス、レジェンド（世界）＝シェフチェンコ。同じ人・国は無し。
#     ※アルゼンチン代表の回が将来出るときは、この回と重ねないこと。
#
# **いまの立場**：現職のアルゼンチン代表監督（2018年就任）。契約は 2026年12月まで（covered.yaml の 9/12 の回、Infobae）。
#   ○ 英語版 Wikipedia「Lionel Scaloni」（2026-11-12 に action=raw で読んだ）：「the head coach of the Argentina national team」。2026 W杯決勝（0-1 スペイン、延長）のあとタピア会長が留任を支持。
#   ○ 2026-10-21〜22 の報道（WebSearch：Tribuna・Yahoo Sports・Football Today ほか）：AFA と合意、2年契約（2028年）＋2030年W杯までの延長の選択肢。**署名は確かめられていない**（La Nación「あとは署名だけ」と dpa が報じた、まで）。台本は「報道」で、「合意したと報じられている」。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of match played 6 October 2026）。**アルゼンチン代表（トップチーム）のみ**：107試合79勝18分10敗、231得点57失点（得失点差+174）。
#   U-20（6試合4勝1分1敗）は除く。勝率 79÷107＝73.8%、引き分け 16.8%、負け 9.3%。10÷107 で約10.7試合に1度しか負けない。1試合平均 2.16点・0.53失点。
#   ※前日（11/12）時点で 10/6 より後に試合があったかは確かめていない。台本は「10月6日まで」。
#
# **歩み**（英語版本文）：2016-10 セビージャでサンパオリのコーチ補佐 → 2017 サンパオリの代表補佐 → 2018 U-20 監督 → 2018-08 アイマールとともに暫定監督、2018-11 正式。
#   マラドーナが「交通整理もできない」と批判（英語版）。2019 コパ・アメリカ3位。契約を2022年まで延長。2021 コパ・アメリカ優勝（ブラジルに1-0、28年ぶりのタイトル）。2022 フィナリッシマ（イタリアに3-0、ウェンブリー）。
#   2022 W杯：初戦サウジに1-2（36戦不敗が止まる）→ メキシコ2-0・ポーランド2-0 → 豪2-1 → オランダ（PK）→ クロアチア3-0 → 決勝フランス 3-3（PK4-2）で優勝。2024 コパ優勝（コロンビアに1-0、延長）。
#   2026 W杯：グループ（アルジェリア・オーストリア・ヨルダン）3勝 → カーボベルデ3-2・エジプト3-2 → スイス3-1（延長）→ 準決勝イングランド（先に失点、終盤に2点）→ 決勝スペインに0-1（延長）。
#   **史上初：3つの主要な国際大会を続けて制した監督**（英語版）。
#
# **戦術の色**＝2024 コパ決勝（英語版）：延長前半の97分に、ラウタロ・マルティネス、パレデス、ロ・チェルソの3人を同時に投入。112分、ラウタロが決勝点（コロンビアに1-0）。交代が評価された。
#   チームづくり：結束・率直な意思疎通・役割の明確化（英語版）。呼び名「スカロネタ」（国内のメディアが付けた）。最も尊敬する監督はアンチェロッティ（本人談、英語版）。
#
# **日本との接点**：無し（入れない）。
#
# **本人の言葉**：2026-07-19 の決勝のあと（Al Jazeera／Reuters 2026-07-20、2026-11-12 に WebFetch で読んだ）。原文：“They deserved the victory. That's reality. We need to accept it.”
#   “So in order to continue, you need a great deal of things, especially resetting your mind, rebooting.”／“I will see out my contract, and I feel the need to think.”／“I will talk to the president.”
#   ※原語はスペイン語の会見で、英語訳からの重訳。
# **マル秘話**（英語版）：イタリアのマルケ州アスコリ・ピチェーノに祖先。アルゼンチンとイタリアの二重国籍。2006年1月31日、ウェスト・ハムへレンタル、FAカップ決勝でPK負け。2006 W杯代表で出番はメキシコ戦の1試合（延長に勝利）。
#   2019年4月、マヨルカで自転車に乗っていて車にはねられた（数時間で退院）。2024年、故郷プハトに通りに名前が付いた。
#
# **入れなかったもの**：私生活（結婚・家族）、メッシの引退・10番の話、AFA 会長の疑惑、ボーナスの話、FotMob・女子・ニュースの反応、他の代表監督との優劣。
