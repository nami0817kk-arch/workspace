  - id: mourinho
    heading: モウリーニョ監督は、エンドリッキをどう見ているのか
    tier: 確定
    telop: モウリーニョ監督「レアルには彼が必要」
    say:
      - text: 一方、モウリーニョ監督は20日の会見で、エンドリッキの去就をこう話しました。
        image: assets/images/20261126_endrick_milan_70m/06_w.jpg
      - voice: モウリーニョ監督
        text: エンドリッキのことは大好きです。
        image: assets/images/20261126_endrick_milan_70m/06_w.jpg
      - voice: モウリーニョ監督
        text: でも私にとっては、エンドリッキより、
        image: assets/images/20261126_endrick_milan_70m_m/01_w.jpg
      - voice: モウリーニョ監督
        text: レアル・マドリードのほうが大事です。
        cont: true
      - voice: モウリーニョ監督
        text: つまり、レアルには彼が必要だということです。
        image: assets/images/20261126_endrick_milan_70m/06_w.jpg
        cont: true
        emph: true
      - voice: モウリーニョ監督
        text: クラブの上の人たちが違う決断をするなら、それは尊重します。
        image: assets/images/20261126_endrick_milan_70m_m/01_w.jpg
      - text: 冬の移籍市場では、同じ力のフォワードは取れない。それが監督の考えだそうです。
    official: true
    quotes_from: [Real Madrid CF]
    sources:
