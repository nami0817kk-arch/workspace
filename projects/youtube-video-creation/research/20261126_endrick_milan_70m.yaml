    tier: 報道
    telop: ミランがおよそ7000万ユーロのオファー、と報道
    say:
      - text: ミランが7000万ユーロを用意、と報じられたレアルのエンドリッキ。その前の週、こう話していました。
      - voice: エンドリッキ
        text: 出場時間は、モウリーニョ監督が決めることだと思います。
        image: assets/images/20261126_endrick_milan_70m/05_w.jpg
      - voice: エンドリッキ
        text: いつでもレアルを助ける準備はできています。
        image: assets/images/20261126_endrick_milan_70m/05_w.jpg
        emph: true
      - voice: エンドリッキ
        text: 世界でいちばん大きなクラブですから。
        cont: true
      - voice: エンドリッキ
        text: ここで一生を過ごして、チームを助けたいです。
        image: assets/images/20261126_endrick_milan_70m_c/01_w.jpg
      - text: レアルで出番が限られる20歳に、ミランは正式なオファー。1月の移籍を狙っている、と報じられています。
        image: assets/images/20261126_endrick_milan_70m_c/01_w.jpg
      - text: ミランはすでに、本人にもこの話を伝えたといいます。
      - text: 代理人たちも今週、マドリードに来て話し合う予定です。
        image: assets/images/20261126_endrick_milan_70m/05_w.jpg
