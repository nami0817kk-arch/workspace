sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 1886年創設、愛称は「ガナーズ」
    narrator: キャスター
    card:
      type: table
      title: アーセナル
      columns: ["", ""]
      rows:
        - ["創設", "1886年10月"]
        - ["愛称", "The Gunners（ガナーズ）"]
        - ["本拠地", "エミレーツ・スタジアム"]
        - ["収容人数", "60,704人"]
    say:
      - 2番目はアーセナルです。
      - 創設は1886年の10月。最初の名前は「ダイアル・スクエア」でした。
      - 作ったのは、ウーリッジにあった王立兵器工場で働く人たちです。
      - 翌1887年の1月までに「ロイヤル・アーセナル」へ改名します。
      - 1893年には「ウーリッジ・アーセナル」。そこからいまのアーセナルになりました。
      - 愛称は「ガナーズ」。**砲手**という意味です。
      - エンブレムに大砲が描かれているのも、兵器工場で生まれたクラブだからです。
      - サポーターは自分たちを「グーナーズ」と呼びます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.

  - id: ground
    heading: 本拠地
    main: true
    tier: 背景
    telop: 収容60,704人。ハイベリーから2006年に移った
    narrator: 解説
    say:
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 本拠地はエミレーツ・スタジアム。ロンドン北部のイズリントンにあります。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 収容人数は**6万704人**。プレミアリーグでも指折りの大きさです。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 移ってきたのは2006年でした。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: それまでの93年間、アーセナルはハイベリーで戦っていました。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.

  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 監督はアルテタ。日本人選手はいません
    narrator: キャスター
    card:
      type: table
      title: 今季のアーセナル
      columns: ["", ""]
      rows:
        - ["監督", "ミケル・アルテタ"]
        - ["主将", "マルティン・ウーデゴール"]
        - ["得点源", "サカ（リーグ3点）／ウーデゴール（全4点）"]
        - ["日本人選手", "なし"]
    say:
      - 監督はミケル・アルテタ。主将はマルティン・ウーデゴールです。
      - 今夏は、出ていったほうが目を引きました。
      - ガブリエル・マルティネッリがアル・ヒラルへ、**6000万ポンド**。
      - ガブリエウ・ジェズスはバルセロナ、レアンドロ・トロサールはベシクタシュへ移っています。
      - 入ってきたのは5人です。
      - ニューカッスルからブルーノ・ギマランイス、**7500万ポンド**。
      - アストン・ヴィラからエズリ・コンサ、5100万ポンド。
      - レヴァークーゼンからピエロ・インカピエ、3450万ポンド。
      - クラブ・ブルージュからクリストス・ツォリス、3400万ポンド。
      - ゴールキーパーのイラン・ムスリエは、所属クラブのない状態から加入しました。
      - ここまでの得点は、リーグではブカヨ・サカが3点。すべての大会ではウーデゴールが4点で最多です。
      - そして、日本人選手はいません。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
      - https://en.wikipedia.org/wiki/2026%E2%80%9327_Arsenal_F.C._season

  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 22年ぶりのリーグ制覇は、2026年5月19日
    narrator: 解説
    card:
      type: table
      title: アーセナルの記録
      columns: ["", ""]
      rows:
        - ["1893年", "南イングランド勢で初のフットボールリーグ加盟"]
        - ["2003-04年", "無敗優勝。連続無敗49試合はイングランド記録"]
        - ["2026年5月19日", "14回目のリーグ優勝（22年ぶり）"]
    say:
      - アーセナルは1893年、**南イングランドのクラブとして初めて**フットボールリーグに加わりました。
      - 1部に居続けている年数は105年を超え、いまも続いています。イングランドで最も長い記録です。
      - 語り継がれているのは、2003年から2004年のシーズンです。
      - リーグ戦を1つも負けずに優勝しました。「**無敗**」と呼ばれるチームです。
      - この前後にまたがる連続無敗は**49試合**。イングランドの1部での最長記録です。
      - ただ、そこからリーグ優勝は遠ざかりました。
      - 次の優勝は**2026年5月19日**。クラブ14回目で、**22年ぶり**でした。
      - FAカップは**14回**優勝していて、これはイングランドのどのクラブよりも多い数です。
      - 獲得したタイトルの数では、イングランドで3番目に多いクラブとされています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
