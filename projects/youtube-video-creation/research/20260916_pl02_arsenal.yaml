    heading: 本拠地
    main: true
    tier: 背景
    telop: 93年間、アーセナルはハイベリーで戦っていた
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["エミレーツ・スタジアム", "2006年から"]
        - ["収容人数", "60,704人"]
        - ["その前", "ハイベリー（93年間）"]
    say:
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: アーセナルは93年間、ハイベリーというスタジアムで戦っていました。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: いまの本拠地、エミレーツ・スタジアムに移ってきたのは2006年です。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 場所はロンドン北部のイズリントンです。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 収容人数は**6万704人**。プレミアリーグでも指折りの大きさです。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 22年ぶりのリーグ優勝を押し上げた得点
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ミケル・アルテタ"]
        - ["主将", "マルティン・ウーデゴール（MF・ノルウェー）"]
        - ["副主将", "ブカヨ・サカ"]
        - ["エース", "ヴィクトル・ギェケレシュ（FW・スウェーデン）"]
        - ["昨季", "リーグ14点・全21点"]
    say:
      - "**22年ぶりのリーグ優勝を押し上げたのは、この選手の得点でした。**"
      - エースはヴィクトル・ギェケレシュ。スウェーデン代表のセンターフォワードです。
      - 昨季はリーグで14点、すべての大会では**21点**。
      - 監督はミケル・アルテタです。
      - 主将はマルティン・ウーデゴール。ノルウェー代表の中盤です。副主将はブカヨ・サカ。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 2003-04年、リーグ戦を1つも負けずに優勝した
    narrator: 解説
    card:
      type: table
      title: アーセナルの記録
      columns: ["", ""]
      rows:
        - ["1893年", "南イングランド勢で初のフットボールリーグ加盟"]
        - ["2003-04年", "無敗優勝。連続無敗49試合はイングランド記録"]
        - ["2026年5月19日", "14回目のリーグ優勝（22年ぶり）"]
    say:
      - 語り継がれているのは、2003年から2004年のシーズンです。
      - リーグ戦を1つも負けずに優勝しました。「**無敗**」と呼ばれるチームです。
      - この前後にまたがる連続無敗は**49試合**。イングランドの1部での最長記録です。
      - ただ、そこからリーグ優勝は遠ざかりました。
      - 次の優勝は**2026年5月19日**。クラブ14回目で、**22年ぶり**でした。
      - アーセナルは1893年、**南イングランドのクラブとして初めて**フットボールリーグに加わりました。
      - 1部に居続けている年数は105年を超え、いまも続いています。イングランドで最も長い記録です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: FAカップ14回は、イングランドのどのクラブよりも多い
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "14回（直近 2025-26）"]
        - ["FAカップ", "14回（直近 2019-20）"]
        - ["リーグカップ", "2回（直近 1992-93）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回／フェアーズカップ1回"]
    say:
      - FAカップを**14回**。これはイングランドのどのクラブよりも多い数です。
      - 1部優勝も14回。いちばん新しいのは昨季、2025年から26年です。
      - リーグカップが2回。
      - ヨーロッパでは、1993年から94年のカップウィナーズカップ。
      - フェアーズカップも1回、手にしています。
      - "獲得したタイトルの数では、**イングランドで3番目に多いクラブ**とされています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
