# プレミアリーグ20クラブ紹介 ②アーセナル（2026-09-16）
#
# **見本（①ボーンマス）と同じ型。**節は4つで、戦術の節は入れない
# （2026-09-16 ユーザー決定）。書き出しは1クラブずつ分けて、あとで結合する。
#
# **この回だけ、いつもの決まりを外している**（2026-09-15 ユーザー判断）。
#   ・1本1テーマ → 20クラブ＝20テーマ
#   ・他人の声が4割以上 → 紹介ものなので 0
#   ・尺は3分半まで
#
# 事実はすべて英語版 Wikipedia の本文から。**推測で埋めない。**
# 創設年・収容人数・移籍金は記事の表記のまま。
#
# **写真は「エミレーツ・スタジアムの外観」1枚。**人物は特定していないので、
# 特定の試合の写真だとは書かない
#
# **2026-09-18 ユーザー指示で書き直した**（「全体的に視聴者が見たがる内容にして、
# タイトルもとったやつだけで良い」）。①「アルファベット順では2番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「数えると32個」とCLを獲っていない話をやめ、獲ったものだけにした。
#
# **見てもらえる形にした**（2026-09-18 ユーザー指示「もっと見てる人の興味や
# 関心を引き立てる内容にしてください」）。
#   ・題とサムネをクラブごとの引きに変えた（20本とも同じ題で並んでいたため）
#   ・**宿敵**（ノース・ロンドン・ダービー。1919年の投票）と
#     **レジェンド3人**（アンリ／アダムス／ベルカンプ）の節を足した
