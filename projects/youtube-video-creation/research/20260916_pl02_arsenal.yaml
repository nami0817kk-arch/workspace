      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: それまでの93年間、アーセナルはハイベリーで戦っていました。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 主将はマルティン・ウーデゴール
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ミケル・アルテタ"]
        - ["主将", "マルティン・ウーデゴール（MF・ノルウェー）"]
        - ["副主将", "ブカヨ・サカ"]
        - ["エース", "ヴィクトル・ギェケレシュ（FW・スウェーデン）"]
        - ["昨季", "リーグ14点・全21点"]
    say:
      - 監督はミケル・アルテタです。
      - 主将はマルティン・ウーデゴール。ノルウェー代表の中盤です。副主将はブカヨ・サカ。
      - エースはヴィクトル・ギェケレシュ。スウェーデン代表のセンターフォワードです。
      - 昨季はリーグで14点、すべての大会では**21点**。
      - "**22年ぶりのリーグ優勝を、この人の得点が押し上げました。**"
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 22年ぶりのリーグ制覇は、2026年5月19日
    narrator: 解説
    card:
      type: table
      title: アーセナルの記録
      columns: ["", ""]
      rows:
        - ["1893年", "南イングランド勢で初のフットボールリーグ加盟"]
        - ["2003-04年", "無敗優勝。連続無敗49試合はイングランド記録"]
        - ["2026年5月19日", "14回目のリーグ優勝（22年ぶり）"]
    say:
      - アーセナルは1893年、**南イングランドのクラブとして初めて**フットボールリーグに加わりました。
      - 1部に居続けている年数は105年を超え、いまも続いています。イングランドで最も長い記録です。
      - 語り継がれているのは、2003年から2004年のシーズンです。
      - リーグ戦を1つも負けずに優勝しました。「**無敗**」と呼ばれるチームです。
      - この前後にまたがる連続無敗は**49試合**。イングランドの1部での最長記録です。
      - ただ、そこからリーグ優勝は遠ざかりました。
      - 次の優勝は**2026年5月19日**。クラブ14回目で、**22年ぶり**でした。
      - FAカップは**14回**優勝していて、これはイングランドのどのクラブよりも多い数です。
      - 獲得したタイトルの数では、イングランドで3番目に多いクラブとされています。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: 1部優勝14回（直近 2025-26）、FAカップ14回（直近 2019-20）
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "14回（直近 2025-26）"]
        - ["FAカップ", "14回（直近 2019-20）"]
        - ["リーグカップ", "2回（直近 1992-93）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回／フェアーズカップ1回"]
    say:
      - 獲ってきたものを数えると、大きなタイトルで**32個**あります。
      - 1部優勝が14回。いちばん新しいのは昨季、2025年から26年です。
      - FAカップも14回。リーグカップが2回。
      - ヨーロッパでは、1993年から94年のカップウィナーズカップ。
      - "ただし、**チャンピオンズリーグだけが、まだありません。**"
      - 決勝には2度立っています。2005年から06年と、昨季です。
      - 2026年5月30日、ブダペストでの決勝。相手はパリ・サンジェルマンでした。
      - 延長でも1対1で、PK戦を4対3で落としています。
      - "22年ぶりにリーグを獲ったクラブに、**残っているのはこれひとつ**です。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
