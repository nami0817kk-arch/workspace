# タイトルもとったやつだけで良い」）。①「アルファベット順では2番目」の行を削除。
# ②各節の1行目を、その節でいちばん引きの強い事実に入れ替えた（並べ替えのみ）。
# ③優勝の節は「数えると32個」とCLを獲っていない話をやめ、獲ったものだけにした。
