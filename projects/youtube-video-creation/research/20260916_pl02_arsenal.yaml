sections:
  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称は「ガナーズ」。砲手という意味
    narrator: キャスター
    card:
      type: table
      title: アーセナル
      columns: ["", ""]
      rows:
        - ["創設", "1886年10月"]
        - ["愛称", "The Gunners（ガナーズ）"]
        - ["本拠地", "エミレーツ・スタジアム"]
        - ["収容人数", "60,704人"]
    say:
      - "エンブレムに描かれている**大砲**は、飾りではありません。"
      - "作ったのが、ウーリッジの**王立兵器工場で働く人たち**だったからです。"
      - 愛称の「ガナーズ」も、砲手という意味です。
      - 創設は1886年の10月。最初の名前は「ダイアル・スクエア」です。
      - 翌1887年の1月までに「ロイヤル・アーセナル」へ改名します。
      - 1893年には「ウーリッジ・アーセナル」。そこからいまのアーセナルになりました。
      - サポーターは自分たちを「グーナーズ」と呼びます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: ground
    heading: 本拠地
    main: true
    tier: 背景
    telop: 93年間、アーセナルはハイベリーで戦っていた
    narrator: 解説
    card:
      type: table
      title: 本拠地
      columns: ["", ""]
      rows:
        - ["エミレーツ・スタジアム", "2006年から"]
        - ["収容人数", "60,704人"]
        - ["その前", "ハイベリー（93年間）"]
    say:
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: アーセナルは93年間、ハイベリーというスタジアムで戦っていました。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: いまの本拠地、エミレーツ・スタジアムに移ってきたのは2006年です。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 場所はロンドン北部のイズリントンです。}
      - {image: "assets/images/pl_arsenal2/scene.jpg",
         text: 収容人数は**6万704人**。プレミアリーグでも指折りの大きさです。}
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: season
    heading: 今季の顔ぶれ
    tier: 報道
    telop: 22年ぶりのリーグ優勝を押し上げた得点
    narrator: キャスター
    card:
      type: table
      title: 今季の顔ぶれ
      columns: ["", ""]
      rows:
        - ["監督", "ミケル・アルテタ"]
        - ["主将", "マルティン・ウーデゴール（MF・ノルウェー）"]
        - ["副主将", "ブカヨ・サカ"]
        - ["エース", "ヴィクトル・ギェケレシュ（FW・スウェーデン）"]
        - ["昨季", "リーグ14点・全21点"]
    say:
      - "**22年ぶりのリーグ優勝を押し上げたのは、この選手の得点でした。**"
      - エースはヴィクトル・ギェケレシュ。スウェーデン代表のセンターフォワードです。
      - 昨季はリーグで14点、すべての大会では**21点**。
      - 監督はミケル・アルテタです。
      - 主将はマルティン・ウーデゴール。ノルウェー代表の中盤です。副主将はブカヨ・サカ。
    official: false
    sources:
      - https://www.premierleague.com/en/news/4706912
  - id: history
    heading: 歩んできた道
    tier: 背景
    telop: 2003-04年、リーグ戦を1つも負けずに優勝した
    narrator: 解説
    card:
      type: table
      title: アーセナルの記録
      columns: ["", ""]
      rows:
        - ["1893年", "南イングランド勢で初のフットボールリーグ加盟"]
        - ["2003-04年", "無敗優勝。連続無敗49試合はイングランド記録"]
        - ["2026年5月19日", "14回目のリーグ優勝（22年ぶり）"]
    say:
      - 語り継がれているのは、2003年から2004年のシーズンです。
      - リーグ戦を1つも負けずに優勝しました。「**無敗**」と呼ばれるチームです。
      - この前後にまたがる連続無敗は**49試合**。イングランドの1部での最長記録です。
      - ただ、そこからリーグ優勝は遠ざかりました。
      - 次の優勝は**2026年5月19日**。クラブ14回目で、**22年ぶり**でした。
      - アーセナルは1893年、**南イングランドのクラブとして初めて**フットボールリーグに加わりました。
      - 1部に居続けている年数は105年を超え、いまも続いています。イングランドで最も長い記録です。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
  - id: rival
    heading: 宿敵
    tier: 背景
    telop: 始まりは、4マイル先への引っ越しだった
    narrator: 解説
    card:
      type: table
      title: ノース・ロンドン・ダービー
      columns: ["", ""]
      rows:
        - ["相手", "トッテナム・ホットスパー"]
        - ["1913年", "ハイベリーへ移転。相手の本拠地まで4マイル"]
        - ["1919年", "1部拡大の投票。アーセナル18票・トッテナム8票"]
        - ["今季", "トッテナムもプレミアリーグにいる"]
    say:
      - "宿敵はトッテナム・ホットスパー。呼び名は**ノース・ロンドン・ダービー**です。"
      - 始まりは1913年。アーセナルがプラムステッドのマナー・グラウンドから、ハイベリーへ移りました。
      - "移った先は、相手の本拠地ホワイト・ハート・レーンから**わずか4マイル**の場所でした。"
      - 決定的になったのは1919年です。
      - 第一次大戦のあと、1部が2枠ひろがることになり、どのクラブを上げるかの投票が行われました。
      - "アーセナルが**18票**。トッテナムは**8票**でした。"
      - ほかはバーンズリーが5票、ウルヴァーハンプトンが4票、ノッティンガム・フォレストが3票、バーミンガムが2票、ハル・シティが1票。
      - こうしてアーセナルが1部に選ばれます。ここから本物の因縁になりました。
      - そのトッテナムは、今季もプレミアリーグにいます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/North_London_derby
  - id: legends
    heading: このクラブを語る選手
    tier: 背景
    telop: 公式戦228得点。クラブ史上最多の点取り屋
    narrator: 解説
    card:
      type: table
      title: このクラブを語る3人
      columns: ["選手", "数字"]
      rows:
        - ["ティエリ・アンリ", "公式戦228得点。クラブ史上最多"]
        - ["トニー・アダムス", "669試合。21歳から14年間の主将"]
        - ["デニス・ベルカンプ", "423試合120得点"]
    say:
      - 得点の記録を持っているのは、ティエリ・アンリです。
      - "在籍は1999年から2007年、そして2012年。公式戦で**228得点**を挙げました。"
      - 2005年10月17日のスパルタ・プラハ戦で2点を決め、イアン・ライトの185得点を抜いています。
      - 1世紀以上ぶりの無敗優勝で中心にいたのも、この選手でした。
      - その年は公式戦39得点。ヨーロッパ・ゴールデンシューを受け取っています。
      - "守りの側の顔はトニー・アダムスです。1983年から2002年まで、**669試合**。"
      - 1988年1月1日、21歳で主将になり、そのまま14年つとめました。
      - 3つの異なる年代で、優勝チームの腕章を巻いています。
      - もう1人がデニス・ベルカンプ。1995年から2006年に423試合120得点。
      - ヴェンゲル監督が攻撃の起点に据えた選手で、リーグ3回とFAカップ3回を手にしました。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Thierry_Henry
      - https://en.wikipedia.org/wiki/Tony_Adams
      - https://en.wikipedia.org/wiki/Dennis_Bergkamp
  - id: titles
    heading: 獲ってきたもの
    tier: 背景
    telop: FAカップ14回は、イングランドのどのクラブよりも多い
    narrator: キャスター
    card:
      type: table
      title: 獲ってきたもの
      columns: ["", ""]
      rows:
        - ["1部優勝", "14回（直近 2025-26）"]
        - ["FAカップ", "14回（直近 2019-20）"]
        - ["リーグカップ", "2回（直近 1992-93）"]
        - ["ヨーロッパ", "カップウィナーズカップ1回／フェアーズカップ1回"]
    say:
      - FAカップを**14回**。これはイングランドのどのクラブよりも多い数です。
      - 1部優勝も14回。いちばん新しいのは昨季、2025年から26年です。
      - リーグカップが2回。
      - ヨーロッパでは、1993年から94年のカップウィナーズカップ。
      - フェアーズカップも1回、手にしています。
      - "獲得したタイトルの数では、**イングランドで3番目に多いクラブ**とされています。"
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Premier_League
