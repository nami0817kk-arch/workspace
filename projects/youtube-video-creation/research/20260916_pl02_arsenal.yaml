  - id: name
    heading: 名前と愛称
    tier: 背景
    telop: 愛称は「ガナーズ」。砲手という意味
    narrator: キャスター
    card:
      type: table
      title: アーセナル
      columns: ["", ""]
      rows:
        - ["創設", "1886年10月"]
        - ["愛称", "The Gunners（ガナーズ）"]
        - ["本拠地", "エミレーツ・スタジアム"]
        - ["収容人数", "60,704人"]
    say:
      - "エンブレムに描かれている**大砲**は、飾りではありません。"
      - "作ったのが、ウーリッジの**王立兵器工場で働く人たち**だったからです。"
      - 愛称の「ガナーズ」も、砲手という意味です。
      - 創設は1886年の10月。最初の名前は「ダイアル・スクエア」です。
      - 翌1887年の1月までに「ロイヤル・アーセナル」へ改名します。
      - 1893年には「ウーリッジ・アーセナル」。そこからいまのアーセナルになりました。
      - サポーターは自分たちを「グーナーズ」と呼びます。
    official: false
    sources:
      - https://en.wikipedia.org/wiki/Arsenal_F.C.
