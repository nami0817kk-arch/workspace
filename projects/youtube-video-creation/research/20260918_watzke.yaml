  - id: three
    heading: 挙げた三つ
    main: true
    tier: 報道
    bg: assets/backgrounds/watzke_20260918.png
    telop: 平和賞、バログン、投資家案
    narrator: キャスター
    say:
      - {short_only: true, text: ドルトムント会長が、FIFA会長の退陣を求めました。}
      - 一つ目は、トランプ大統領へ贈った「FIFA平和賞」。
      - {voice: ヴァツケ, text: 自分で創設し、自分で決めた。狂気の沙汰だ}
      - 二つ目は、バログンの出場停止が取り消されたこと。
      - {voice: ヴァツケ, text: 大統領がFIFA会長に電話をかけ、処分が即座に取り消される。あっていいはずがない}
      - 三つ目は、ワールドカップの権利を投資家に売る計画。
      - {voice: ヴァツケ, text: 完全に正気じゃない。FIFAの副会長も評議会も、何も知らなかった}
      - {voice: ヴァツケ, text: ワールドカップは、放っておいても売れる。なぜ投資家が要るんだ}
      - そして、重ねて問われて答えたのが、この一言でした。
      - {voice: ヴァツケ, text: 彼は去るべきだ、何の条件もなく}
    official: false
    sources:
      - https://www.presseportal.de/pm/153584/6354275
      - https://www.kicker.de/watzke-ueber-infantino-er-sollte-weg-ohne-wenn-und-aber-1253659/artikel

  - id: around
    heading: 一人ではない
    tier: 報道
    bg: assets/backgrounds/watzke_20260918.png
    telop: ドイツ連盟の会長も、イングランドFAの会長も
    narrator: 解説
    say:
      - 声を上げているのは、ヴァツケだけではありません。
      - ドイツサッカー連盟の会長は、こう話しています。
      - {voice: ドイツ連盟の会長, text: ジャンニ・インファンティーノとの、このFIFA指導部との信頼関係は、当然ながら壊れている}
      - イングランド協会の会長は、書簡で文書の開示を求めました。
      - フランス、イタリア、オランダの協会も、反対の立場を取っています。
      - 一方の会長本人は、退く気配を見せていません。
      - "**2027年3月の再選に、立候補する意向を表明しています。**"
    official: false
    sources:
      - https://www.kicker.de/watzke-ueber-infantino-er-sollte-weg-ohne-wenn-und-aber-1253659/artikel
      - https://www.espn.com/soccer/story/_/id/49964525/fa-chief-demands-gianni-infantino-releases-fifa-documents-private-equity-proposal-folarin-balogun-decision

  # **この発言そのものへの反応は、事実上存在しない**（2026-09-18 に確かめた）。
  #   日本語 0件（この発言を報じた日本語記事が1本も出ていない）
  #   ドイツ語 4件、うち2件は**ノイエンドルフ批判**でヴァツケの話ではない
  #   英語 1件は7月の別件
  # **だから「ヴァツケへの反応」としては出さない。**代わりに、
  # ヴァツケが求めていること（会長の退陣）そのものをめぐる、実在する声を置く。
  # 語りで**「この発言への反応ではない」と断る**。reddit と X は読めなかった
  - id: voices
    heading: 会長の座をめぐって荒れている
    tier: 未確認
    bg: assets/backgrounds/watzke_20260918.png
    telop: 「インファンティーノ会長は辞任を」
    narrator: キャスター
    say:
      - {short_only: true, text: ドルトムント会長のヴァツケが、FIFA会長の退陣を求めた話です。}
      - この発言そのものへの反応は、まだほとんど出ていません。ただ、会長の座をめぐる声は以前から出ています。
      - {voice: ネット民, text: 今年のW杯も、米国のレッドカード処分が延期されたり、決勝のハーフタイムがありえないくらい長かったりと滅茶苦茶にされた}
      - {voice: ネット民, text: 挙句インファンティーノが将来まで売り渡しそうになった。どれも経済規模拡大の夢に魂を売ってしまったツケだと思う}
      - {voice: ネット民, text: コレがまた組織の私物化じゃないの？}
      - {voice: ネット民, text: このオンライン署名に賛同をお願いします。「インファンティーノ会長は辞任を。世界のサッカーファンがFIFA改革を求めています」}
      - 一方で、こういう声もあります。
      - {voice: 海外のファン, text: そんなのは嘘だ。加盟国に提示して承認にかけるつもりの提案を持っていただけで、何ひとつ確定してなどいなかった}
      - {voice: 海外のファン, text: ドイツサッカー連盟もようやく、会長を批判しても安全だと感じられるようになったわけだ, short_voice: true}
      - {voice: 海外のファン, text: ただし早すぎる抜け駆けは絶対にしない、大会を招致したいからな, short_voice: true}
    official: false
