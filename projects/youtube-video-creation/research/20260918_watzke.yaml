# ヴァツケが、インファンティーノに去れと言った（2026-09-18）
#
# **これは quote の型。**中身のほとんどが1人の発言で、3つの理由が順に並ぶ。
# 事実は最初の30秒（誰が・どこで・何と言ったか）、あとは言葉を読む。
#
# 引きは**「3つのことが起きた。あれは度が過ぎていた」**から始まる並び。
#
# **W杯の開催地・回数・日程・クラブW杯には触れない。**記事に無い。
# ヴァツケが挙げたのは**3点だけ**（平和賞・バログン・投資家案）
#
# **英語mediaの裏は取れていない。**kicker とフェスティバル主催側のリリースは
# 同じ登壇の同じ発言なので、**独立した2系統ではない**。だから確度は「報道」まで。
# 批判の対象になっている事実のほう（投資家計画・バログンの処分取り消し・
# FA会長の文書要求）は ESPN でも確認できている
#
# **「läuft wie geschnitten Brot」は慣用句。**直訳すると意味が通らないので
# 「放っておいても売れる」と訳す
#
# **フィーゴの「He should go. Now.」は使わない。**8月5日の別件で、言葉が似ている
# ぶん混ざる。**同じ日の話だけにする**
# **下地は本人の写真**（2026-09-18 ユーザー指摘「一瞬だけ背景が変わった」）
