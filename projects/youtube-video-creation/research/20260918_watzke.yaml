      title: ハンス＝ヨアヒム・ヴァツケ（67）の肩書
      items:
        - ボルシア・ドルトムント会長
        - UEFA執行委員会メンバー
        - ドイツサッカー連盟 副会長
        - ブンデスリーガ リーグ会長
    say:
      - 話しているのは、ハンス＝ヨアヒム・ヴァツケ、67歳。
      - ボルシア・ドルトムントの会長であり、**UEFAの執行委員**、ドイツサッカー連盟の副会長、ブンデスリーガのリーグ会長でもあります。
      - 17日、ベルリンで開かれた催しに登壇し、FIFA会長について話しました。
      - 切り出しは、こうです。
      - {voice: ヴァツケ, text: 起きた三つのこと、あれは度が過ぎていた}
