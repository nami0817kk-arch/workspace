  bg: assets/images/20261028_stadium_coventry/01_w.jpg
  tier: 報道
  telop: 持ち主は市と慈善団体、ラグビーのワスプス、フレイザーズ・グループ。2025年8月、クラブが買い取る
  narrator: 解説
  card: &id_owner
    type: timeline
    title: 本拠地の持ち主（ウィキペディア・インディペンデント）
    rows:
    - - 2005年
      - 市と慈善団体の会社。クラブは借り手
    - - 2014年
      - ラグビーのワスプスが買う
    - - 2022年11月
      - フレイザーズ・グループの物に
    - - 2025年8月
      - クラブが買い取る
    focus: 2025年8月
    highlight_row: 0
  say:
  - text: では、この本拠地の持ち主は、どう替わってきたのか。
    image: assets/images/20261028_stadium_coventry/05_w.jpg
    card: none
  - text: 開いたときの持ち主は、コヴェントリー市と、地元の慈善団体が半分ずつ持つ会社でした。
    image: assets/images/20261028_stadium_coventry/05_w.jpg
    card:
      <<: *id_owner
      highlight_row: 0
  - text: クラブは、借り手。家賃は年120万ポンドで、試合の日の売上は入りませんでした。
    emph: true
    image: assets/images/20261028_stadium_coventry/05_w.jpg
    card: none
  - text: 2013年、家賃でもめて、クラブは出ていきます。
    image: assets/images/20261028_stadium_coventry/08_w.jpg
    card: none
  - text: 1年あまり、隣の町ノーサンプトンで戦いました。
    image: assets/images/20261028_stadium_coventry/08_w.jpg
    card: none
  - text: 2014年9月に戻ると、その2か月のうちに、ラグビーのワスプスが本拠地を買います。
    image: assets/images/20261028_stadium_coventry/08_w.jpg
    card:
      <<: *id_owner
      highlight_row: 1
  - text: 2019年には、そのワスプスともめて、また出ていきます。
    image: assets/images/20261028_stadium_coventry/08_w.jpg
    card: none
  - text: 2季のあいだ、バーミンガムで戦いました。
    image: assets/images/20261028_stadium_coventry/08_w.jpg
    card: none
  - text: 2022年、そのワスプスが経営に行き詰まります。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: none
  - text: 本拠地は、フレイザーズ・グループの物になりました。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card:
      <<: *id_owner
      highlight_row: 2
  - text: そして2025年8月23日。クラブが、本拠地を買い取りました。
    emph: true
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card:
      <<: *id_owner
      highlight_row: 3
  - text: ここで最初の公式戦をしてから、ちょうど20年の日でした。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: none
  - text: オーナーのダグ・キングは、こう話しています。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: none
  - text: 今日は、このクラブにとって決定的な日だ。
    voice: ダグ・キング
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: &id_king
      type: document
      label: ダグ・キング（2025年8月、本拠地の買い取りで）
      paragraphs:
      - 今日は、このクラブにとって決定的な日だ。
      - あまりに長いあいだ、本拠地を誰が持つのかという問題が、クラブの将来に影を落としてきた。
      highlight:
      - 決定的な日
      - 本拠地を誰が持つのか
  - text: あまりに長いあいだ、本拠地を誰が持つのかという問題が、
    voice: ダグ・キング
    cont: true
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: *id_king
  - text: クラブの将来に影を落としてきた。
    voice: ダグ・キング
    cont: true
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: *id_king
