# スタジアム紹介シリーズ：コヴェントリー・シティの本拠地（コヴェントリー・ビルディング・ソサエティ・アリーナ、10/28 19:00 予定）。雛形は 10/27 フォレストの回。
# 重なりの確認（2026-10-28）：scripts/*stadium_* は19本（サン・シーロ・ボーンマス・エミレーツ・ヴィラ・ブレントフォード・ブライトン・チェルシー・オールド・トラッフォード・アンフィールド・
#   トッテナム・エティハド・ニューカッスル・エヴァートン・パレス・フラム・サンダーランド・ウェストハム・リーズ・フォレスト）。コヴェントリー無し。covered.yaml・posted.json にも stadium_coventry は無い。
#   クラブ紹介⑦コヴェントリー（posted.json 20260920_pl07_coventry、公開 2026-09-24＝34日前。30日の外）は別シリーズ。そちらは「4部から25年」とノーサンプトン通い（往復113キロ）が軸。
#   この回は本拠地の名前・持ち主・旧本拠地が軸で、ノーサンプトンは1行だけにした。トッテナムの回（10/19）は収容の比べにコヴェントリーの数字を1行使っただけ。
# 今季のプレミア所属（一次情報）：ESPN の順位（2026-27 English Premier League）にコヴェントリー・シティ 19位・8試合・勝ち点6。PL公式の試合API でも今季のリーグ戦8試合（第1〜8節）。
# 収容（PL公式ハンドブック2026/27 の Club Directory: Coventry City、控え research/raw/20261021_nufc_plhandbook.txt 637〜700行）：32,609・ピッチ 105×68m。所在地 Jimmy Hill Way, Coventry CV6 6GE。
#   20クラブの並び（同じハンドブック）：11位アストン・ヴィラ 36,887／12位コヴェントリー 32,609／13位ブライトン 32,176／1位マンU 74,158。
#   自分で引いた・割った：36,887-32,609=4,278／32,609-32,176=433／32,609÷74,158=0.4397＝約44％／51,455÷32,609=1.578＝約1.6倍／45,000-32,609=12,391。
# 本拠地の歴史（ウィキペディア en "Coventry Building Society Arena"、控え scratchpad の cov/arena.txt）：
#   フォールズヒルのガス工場の跡地。1997年に移転を決定。1999年春に4万5000席の計画が許可（完成は2001年8月の予定）。当初の案は開閉式の屋根と、動かせるピッチ。
#   2001年5月の1部からの降格・業者の撤退・2006年W杯の招致の失敗で縮小し、2002年夏に3万2500席の計画に。完成は予定より4年遅れ。
#   名前：2004年8月4日にジャガー・アリーナと発表（2015年まで最大700万ポンド）→ 2004年12月17日に取り消し。2005年4月26日にリコー（報道で1000万ポンド）。
#     2012年の五輪では「シティ・オブ・コヴェントリー・スタジアム」（命名権の名が使えないため）。2021年5月5日にコヴェントリー・ビルディング・ソサエティ・アリーナへの改名を発表（10年の契約）。
#   最初の公式戦：2005年8月20日、QPR に3対0（安全のため2万3012人に絞った）。
#   持ち主：アリーナ・コヴェントリー社（ACL＝コヴェントリー市議会とアラン・エドワード・ヒッグス慈善団体が半分ずつ）、クラブは借り手。家賃は年120万ポンドで試合日の売上は入らない。
#   2013年3月にクラブは退去、ノーサンプトン・タウンのシックスフィールズで1年あまり。2014年9月5日、ジリンガム戦で戻る。その2か月以内にラグビーのワスプスが ACL の両方の持ち分を買う。
#   2019年、ワスプスともめて再び退去、バーミンガム・シティのセント・アンドリューズで2季。2021年3月10日に10年の契約で戻る。
#   2022年10月17日にワスプスの持ち株会社が経営破綻（管理手続き）、11月17日に本拠地はフレイザーズ・グループ（マイク・アシュリー）の物に。2023年4月28日に5年の使用契約。
#   2025年8月23日、クラブが本拠地を買い終えたと発表。最初の公式戦からちょうど20年。
# オーナーの言葉（The Independent、PA）：Doug King "Today is a defining day for Coventry City Football Club. For too long the question of stadium ownership has cast uncertainty over our future"。
#   同じ記事は収容を 29,109 と書くが、台本の収容はハンドブックの 32,609 だけを使う。
# 旧本拠地（ウィキペディア en "Highfield Road"）：1899年から106年。2005年4月30日の最後の試合はダービーに6対2。イングランドのリーグで初めての全席の椅子のスタジアム（ジミー・ヒルの方針）。
#   いちばん多い入場 51,455（1967年、ウルヴァーハンプトン戦）。閉じたときの収容 23,489。2006年2〜3月に取り壊し、住宅地に。ピッチの場所は芝に戻した。
# 入場（PL公式の試合API、2026/27 の第2・4・6・8節）：8/29 ハル 31,239／9/13 ブライトン 31,492／10/12 ニューカッスル 30,811／10/24 フラム 31,449
#   → 合計124,991・平均31,248（31,247.75）＝収容の95.8％。いちばん多いブライトン戦でも 32,609-31,492=1,117 届かない。次の本拠地戦は 10/31 のサンダーランド戦（同じAPI、第9節）。
#   比べ：フォレストの今季ホーム4試合は平均30,746・98.5％（10/27 の回の控え。同じAPI）。
# 日本との接点（サッカーの縁）：坂元達裕。2023年7月10日にコヴェントリーと3年契約（クラブ公式 ccfc.co.uk、ウィキペディア）。2023年11月25日のミルウォール戦（アウェー、3対0）で
#   クラブでの初得点、14試合目（BBC 2023-11-27）。2025年4月7日に2年の新契約（BBC）。今季で4季目。リーグ戦109試合18得点（ウィキペディアの infobox、2026年10月13日時点）。
# 言わなかったもの：女子の試合（五輪の初戦・入場の記録の1位）／ラグビーの記録／コンサート／ホテルとカジノの細部／家賃の訴訟の細部／ワスプスの破綻の中身／今季の勝敗の中身。
#   本拠地での最多入場（ウィキペディアは女子の代表戦 32,128 を1位に載せる）は使わない。コヴェントリーの試合での最多も、記事の時点が古いので言わない。
# 写真：assets/images/20261028_stadium_coventry/（Commons、出典は credits.json）。人物は特定していない。07_w はカジノの広告に子どもの絵があるので使わない。
