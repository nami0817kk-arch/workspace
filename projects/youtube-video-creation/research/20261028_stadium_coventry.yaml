  say:
  - text: では、買い取った本拠地は、毎試合どれだけ埋まっているのか。
    emph: true
    image: assets/images/20261028_stadium_coventry/01_w.jpg
    card: none
  - text: 今季のホーム4試合で、いちばん入ったのはブライトン戦。3万1492人でした。
    image: assets/images/20261028_stadium_coventry/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 1
  - text: 4試合の平均は、3万1248人。収容の95.8％です。
    image: assets/images/20261028_stadium_coventry/01_w.jpg
    card:
      <<: *id_view
      highlight_row: 4
    mark:
      kind: circle
      row: 4
  - text: 同じプレミアのフォレストは、今季のホーム4試合で98.5％。
    image: assets/images/20261028_stadium_coventry/03_w.jpg
    card: none
  - text: コヴェントリーには、まだ空きがあります。
    image: assets/images/20261028_stadium_coventry/03_w.jpg
    card: none
  - text: いちばん入ったブライトン戦でも、満員まで1117席、届いていません。
    emph: true
    image: assets/images/20261028_stadium_coventry/03_w.jpg
    card:
      type: calc
      title: 満員まで、あと何席か（自分で引いた）
      terms:
      - - 3万2609席
        - いまの収容
      - - 3万1492人
        - ブライトン戦
      - - 1117席
        - 引いた答え
      ops:
      - −
      - ＝
  - text: 最初の計画の4万5000席と比べると、1万2391席の差です。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: none
  - text: 次の本拠地戦は、現地時間の10月31日。相手は、サンダーランドです。
    image: assets/images/20261028_stadium_coventry/02_w.jpg
    card: none
  - text: 20年かけて自分の物にした本拠地を、プレミアの季で埋めきれるのか。
    image: assets/images/20261028_stadium_coventry/01_w.jpg
    card: none
