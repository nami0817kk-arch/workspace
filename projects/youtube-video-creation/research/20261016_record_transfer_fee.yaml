- id: view
  viewpoint: true
  heading: 見立て・物価で直すと、世界記録はどう変わるか
  tier: 背景
  telop: ベイルは、物価で直すとロナウドを上回らない。ポグバは条件分を足すと、わずかに上回る
  narrator: 解説
  card: &real_line
    type: line
    title: 世界記録の額（百万ポンド）
    x: ['1990', '1996', '2000', '2001', '2009', '2013', '2016', '2017']
    series:
    - [当時の額, [8, 15, 37, 45.6, 80, 85.3, 89.3, 200]]
    - [2025年の物価, [19.8, 30.2, 70.4, 85.7, 127.9, 119.9, 122.7, 267.7]]
