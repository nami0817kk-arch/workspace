- id: scale
  heading: 記録の額は、どこまでが公式の数字なのか
  tier: 報道
  telop: 公式で額が確かめられたのは2件。ポンドとユーロで、更新の順が変わる
  narrator: 解説
  card: &scale_table
    type: table
    title: 記録の額と、出どころ
    columns: &scale_cols
    - 移籍
    - 額
    - 出どころ
    rows: &scale_rows
    - - ネイマール 2017
      - 2億2200万ユーロ
      - バルセロナ公式
    - - ポグバ 2016
      - 1億500万ユーロ
      - ユヴェントス公式
    - - ベイル 2013
      - 8530万ポンド
      - 報道
    - - ロナウド 2009
      - 8000万ポンド
      - 報道
    - - ジダン 2001
      - 4560万ポンド
      - 報道
  say:
  - text: ここまでの額は、報じられた数字です。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: *scale_table
  - text: 51件のうち、公式に確かめられた額は、どれでしょうか。
    card: *scale_table
  - text: 公式に確かめられたのは、2件だけです。
    card:
      <<: *scale_table
      highlight_row: 0
  - text: ネイマールは、バルセロナが声明を出しました。額は、さきほどの数字どおりです。
    card:
      <<: *scale_table
      highlight_row: 0
  - text: ポール・ポグバは2016年、ユヴェントスからマンチェスター・ユナイテッドへ。
    card:
      <<: *scale_table
      highlight_row: 1
  - text: 額は、ユヴェントスが発表しています。1億500万ユーロです。
    card:
      <<: *scale_table
      highlight_row: 1
  - text: 条件を満たせば500万ユーロ増える、とも発表にありました。
    card:
      <<: *scale_table
      highlight_row: 1
  - text: ほかの3人の額は、報じられたものです。
    card:
      <<: *scale_table
      highlight_row: 2
  - text: ガレス・ベイルは2013年、トッテナムからレアル・マドリードへ。
    card:
      <<: *scale_table
      highlight_row: 2
  - text: クリスティアーノ・ロナウドは、2009年にマンチェスター・ユナイテッドから。
    card:
      <<: *scale_table
      highlight_row: 3
  - text: 行き先は、レアル・マドリード。額は約8000万ポンド、報道です。
    card:
      <<: *scale_table
      highlight_row: 3
  - text: ジダンは4560万ポンドとします。
    card:
      <<: *scale_table
      highlight_row: 4
  - text: 報道には、少し高い4660万ポンドの額もあります。
    card:
      <<: *scale_table
      highlight_row: 4
  - text: 公式かどうかとは別に、通貨でも、記録の順が変わります。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - text: カカは2009年に、ミランを離れてレアルへ。5600万ポンドです。
    card: &cur_table
      type: table
      title: 同じ移籍を、ポンドとユーロで並べる（百万）
      columns: [選手, ポンド, ユーロ]
      rows: &cur_rows
      - - ジダン 2001
        - '45.6'
        - '77.5'
      - - カカ 2009
        - '56'
        - '67'
      - - ロナウド 2009
        - '80'
        - '94'
      highlight_row: 1
      note: ポンドは BBC、ユーロは Wikipedia の一覧の換算
  - text: ポンドでは、ジダンを超えた記録でした。
    card:
      <<: *cur_table
      highlight_row: 1
  - text: ところがユーロだと、約6700万。ジダンの約7750万に届きません。
    emph: true
    card:
      <<: *cur_table
      highlight_row: 1
    mark:
      kind: circle
      row: 1
      col: 2
  - text: 同じ移籍が、ポンドでは記録で、ユーロでは記録になりません。
    card:
      <<: *cur_table
      highlight_row: 1
  - text: 次の見立てでは、物差しをポンドに固定して、物価も直します。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
