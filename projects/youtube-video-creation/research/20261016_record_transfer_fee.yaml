  hook: 世界記録は、どう積み上がってきたのでしょうか。
  takeaway: 移籍金の世界記録を更新した移籍は、数えると51件。いまの記録は2017年のネイマール、バルセロナからパリ・サンジェルマンへの2億2200万ユーロ（バルセロナ公式）で、9年破られていない。これは1932年からの17年に次ぐ歴代2位の長さ。物差しは、報じられた総額をポンドで数える（ボーナスの達成分は足さない）。ポグバは1億500万ユーロ、条件を満たせば500万ユーロ増えるとユヴェントスが公式に発表している。ジダンは4560万ポンド（BBC）で、別の一覧は4660万ポンドと食い違う。カカはポンドでは5600万で記録だが、ユーロでは約6700万でジダンの約7750万に届かない。物価で直すと、2025年の物価で、ロナウド（2009年）は約1億2790万ポンド、ベイルは約1億1990万、ポグバは約1億2270万。名前の上の記録だったベイルとポグバは、条件分を足さない額なら、実質ではロナウドを上回っていない（ポグバに条件の500万ユーロを足すと約1億2860万ポンドで、わずかに上回る）。ネイマールは約2億6770万ポンドでロナウドの約2.1倍。1990年のバッジョから額面で25倍、物価を直すと約13.5倍。今夏の最高額（エンソ・フェルナンデス、約1億2500万ポンド）に対し、ネイマールの物価を直す前の額は約1.6倍、物価を直した額は約2.1倍。
