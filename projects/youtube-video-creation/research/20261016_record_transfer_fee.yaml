# 記録の解説：移籍金の世界記録（10/16 金、シリーズ「記録の解説」、key: record_transfer_fee、型は news）。
#   記録の種類の並び：得点（10/9）・出場（10/10）・連勝（10/11）・最年少（10/12）・連続無敗（10/14）→ **移籍金**。
#
# 軸は「**ネイマールの世界記録は、9年破られていない。これは歴代2位の長さ。物価で直すと、名前の上の記録2つは実は記録でなかった**」。
#   10/9「移籍の深掘り：ネイマール」は**払い方の仕組み**（違約金・税）の回。今回は**記録の歴史（更新の間隔と物差し）**で、角度が違う。
#   10/9 で読んだ数字（2位エムバペ1億8000万・81%・ポグバに対し約2.11倍・FIFAの63億7000万ドル・源泉徴収・代理人手数料）は**使っていない**。
#   使う重なり：ネイマール 2億2200万ユーロ・バルセロナ公式（2017-08-03）＝10/9 でも読んだ**基礎の事実**。本編どうしで同じ文は言い換えてある。
#   10/12 アザール（レアルが払った額の確度の回）・10/11 マンC・10/14 リヴァプールとは人も題材も重ならない（ジダン・カカ・ロナウド・ベイルはこの回が初）。
#
# ★**物差し（冒頭で言い、1つに決めた）**：「**報じられた総額を、ポンドで数える**。ボーナスの達成分は足さない。クラブが額を発表した移籍は、その額と照らす」。
#   なぜポンドか：BBC・Wikipedia の世界記録の年表が**1893年から2017年までポンドで通っている**唯一の連続した物差しのため。
#   ユーロ建て・リラ建ての移籍は、当時の報道のポンド額（BBC）を使う。ユーロだと記録の順が変わる例（カカ）は③で断って見せる。
#
# ★**クラブの公式発表まで辿れた額（2件）**
#   ・ネイマール 2億2200万ユーロ：**バルセロナ公式の声明**（fcbarcelona.com/en/football/first-team/news/748497、2017-08-03、原文を読んだ）
#     「ネイマールの代理人が午後に事務所へ来て、**222 million euros** を本人の名で払った。契約の一方的解除に関して」。
#     ＝違約金の支払いで、「移籍金の額をクラブが発表した」型ではないが、**額はクラブ公式が認めている**（10/9 の取材で決算でも確認済み）。
#   ・ポグバ 1億500万ユーロ：**ユヴェントス公式の発表（2016-08-09、PDF を読んだ）**「**€105 million**、2会計年度で支払い。
#     **所定の条件を満たすと€5 million 増える**。経済効果はソリダリティ・補助費用を除き約€72.6 million のプラス」。**マンU側は額を公表していない**（検索の要約。原文未確認）。
#     物差しは「ボーナス達成分を足さない」ので**ポグバは1億500万ユーロで数える**（上限の1億1000万は使わない）。
#   ・ロナウド（2009）：マンU公式サイトが「£80million の無条件のオファーを受けた」と出した、という検索の要約はあるが、**原文は開けていない**。台本は「報じられた」。
#   ・ジダン（2001）：ユヴェントス・レアルの公式文書は**見つけられなかった**。額は「**約1500億リラ**」と報道（イタリアの記事。検索で見つけた要約。原文未確認）。
#     **1500億 ÷ 1936.27（リラ／ユーロの固定相場）＝約7747万ユーロ**で、Wikipedia の7750万ユーロと一致（自分で割った）。1936.27 は欧州の固定換算率（原文は開けていない。既知の値）。
#
# ★**食い違う額は両方書いた**
#   ・ジダン（ポンド）：BBC（2013-09-01）**4560万**／Wikipedia の年表 **4660万**／Wikipedia の上位50 **4620万**。台本は BBC の4560万に統一し、100万の差を③で断る。
#   ・ベイル：BBC **8530万**／Wikipedia の年表 **8600万**／上位50 **8530万**。台本は8530万。
#   ・ネイマール（ポンド）：Wikipedia の年表・上位50は **2億**、同じ頁の本文は「各紙の換算で**1億9800万**」と書く。台本は2億（物価の計算に使う）で、1億9800万でも結論は変わらない（下の確かめ）。
#   ・ポグバ：マンU側報道 8930万ポンド（Wikipedia 上位50）／年表は8900万。台本は8930万。
#
# ★**自分で数えた所**（Wikipedia「List of most expensive association football transfers」の年表を機械で数えた＋手計算）
#   ・世界記録の一覧の件数：**51件**（1893 グローヴス〜2017 ネイマール）。年の差：1932→1949＝**17年**（最長。フェレイラ。Wikipedia本文も「最長」と書く）、
#     2001→2009＝**8年**、1905→1913＝**8年**、1896→1903＝7年、1976→1982＝6年、1914→1920＝6年。それ以外は5年以下。
#     ネイマール 2017-08-03 → 今日 2026-10-16＝**9年2か月**。年の差でも日付でも、**8年（ジダン→カカは約7年11か月、コモン→シェアは約7年11か月）を超える**。
#     → 「**1949年以降でいちばん長い／歴代2位**」。注意：Wikipedia の年表は**年だけ**で、1905→1913、2001→2009は日付で確かめていない。
#     BBC の記事（2013）は「ジダンの記録は8年破られなかった」と書き、Wikipedia 本文も「ジダンの8年は1940年代以来最長」と書く。
#   ・1893年の100ポンド（グローヴス）→ ネイマール約2億ポンド＝**200万倍**（200,000,000÷100）。1893→2017＝**124年**。
#   ・1990年のバッジョ（800万ポンド）〜2017年のネイマール：年表に**17件、更新は16回**。27年÷16＝約**1.7年に1回**。2017年以降は**0回（9年）**。
#   ・物価で直す（**英国の消費者物価指数 CPI、2015年＝100、年平均、ONS系列 D7BT**。取得：ons.gov.uk/generator?format=csv&uri=/economy/inflationandpriceindices/timeseries/d7bt/mm23、2026-10-16。
#     CPI は1988年から。2025年＝138.4）。**式：当時のポンド × 138.4 ÷ その年の指数**。指数：1990＝55.9、1997＝70.1、2000＝72.7、2001＝73.6、2009＝86.6、2013＝98.5、2016＝100.7、2017＝103.4。
#       ジダン 45.6×138.4÷73.6＝85.7／カカ 56×138.4÷86.6＝89.5／ロナウド 80×138.4÷86.6＝127.9／ベイル 85.3×138.4÷98.5＝119.9／
#       ポグバ 89.3×138.4÷100.7＝122.7／ネイマール 200×138.4÷103.4＝267.7（百万ポンド）。
#     → **ベイル（119.9）もポグバ（122.7）も、物価を直すと2009年のロナウド（127.9）より低い**。名前の上の記録2つは、実質では記録でなかった。
#     **確かめ（2026-10-16 に直した）：ポグバに条件の500万ユーロを足すと110百万ユーロ→93.55百万ポンド（89.3÷105=0.8505）→×138.4÷100.7＝128.6 でロナウドの127.9を約0.5%上回る。台本は「少し動かしても結論は変わらない」と言わず、この点を正直に言う。ベイルは8600万でも120.8で届かない。**
#     **（以前の）確かめ（結論が変わらないか）**：ベイルを8600万（Wikipedia年表）にすると 120.9、ポグバを8900万にすると 122.3。どちらもロナウドの127.9に届かない。
#     ロナウドの8000万ポンド（BBC・Wikipedia一致）を動かす理由は無い。ネイマールを1億9800万にしても 265.0 でロナウドの約2.07倍。
#     ネイマール 267.7÷127.9＝**約2.09倍**。実質の記録がロナウドからネイマールまで動かなかった期間＝2009→2017＝**8年**。
#   ・バッジョ（1990）→ネイマール：額面 200÷8＝**25倍**、物価を直すと (200÷103.4)÷(8÷55.9)＝**約13.5倍**（式は 25×55.9÷103.4）。
#   ・次に起きること：Wikipedia 上位50（2026-09-01更新）の**今夏の最高は エンソ・フェルナンデス（チェルシー→マンC）1億4580万ユーロ**。
#     記録 222÷145.8＝約1.52倍（ユーロ）。**台本は2つ言う：額面 200÷125＝1.6倍／物価を直した 267.7÷125＝約2.14倍（今夏の額は今の額なので直さない）。****台本は節の物差しに合わせポンドで言う：Wikipedia 上位50のポンド額 200÷125＝1.6倍**。**予想はしない**。
#     ※10/9 の取材メモ（Transfermarkt）ではエンソは145.0。Wikipedia は145.8。**食い違いは「約1億4600万」と丸めて言う**。
#
# **辿れなかったもの（言い切っていない）**
#   × ジダン・カカ・ロナウド・ベイルの**クラブ公式発表の原文**（額が載っているか不明）。台本は「報じられた」。
#   × カカのユーロ 6700万は Wikipedia 本文のみ（ミラン公式・他紙の原文は未確認）。台本は「Wikipedia の換算では」と断らず、**表の注に出どころを書く**。
#   × 1893〜1990年の個々の額は Wikipedia 年表と BBC の写真説明（コモン1000ポンド・ジャック1万890・スアレス15万2000・サヴォルディ120万・マラドーナ300万と500万）。
#     BBC の写真説明で **コモン・ジャック・サヴォルディ・マラドーナ・ジダン・カカ・ロナウド**は一致を確かめた。グローヴス100ポンドとフェレイラ2万3000ポンドは Wikipedia のみ。
#   × 物価指数は**英国のもの**。スペイン・イタリアのクラブ間の移籍にも英国の物価を当てている（ポンドで数える物差しのため。台本で断る）。年平均で、取引の月は見ていない。
#   × 「記録を更新した移籍は51件」は **Wikipedia の一覧の件数**で、公式の数ではない。台本は「一覧に51件」と言う。
#   × ネイマールの移籍金の額の内訳（代理人など）は触れない（10/9 の回）。
#
# 他人の声は使わない。voice_min: 0。反応は集めていない。ブラウザの道具・JavaScript は使っていない（requests と WebFetch／WebSearch のみ）。
# アルファベットは読み上げに出さない（ポンド・ユーロ・リラは書き下す）。
#
# ★写真：assets/images/20261016_record_transfer_fee/neymar/01.jpg（Commons の File:Neymar PSG.jpg、CC BY-SA 2.0、Antoine Dellenbach、2017年）。
#   パリ・サンジェルマンの入団披露で、背番号入りの「NEYMAR JR」のシャツを持つ本人。目で確かめた。顔の切り出し（01_w／01_v）は facecrop で作り、頭と顎が入っているのを目で見た。
#   1578px幅なので、サムネ・本編の冒頭は 1920px に対し約1.22倍（1.6倍以内）。
#   ほかの人（ジダン・カカ・ロナウド・ベイル）の写真は、時代の合うものが取れなかったので出さない（ロナウド 2026年・ジダン 2015年・ベイル 2008年（148px）は不採用）。
# サムネ：下の案A〜C（ユーザーが選ぶ）。ここには案Aを入れてある。
