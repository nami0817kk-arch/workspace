    note: 年ごとの最高額。年の間隔は一定ではない
  say:
  - text: 最後に、物価を直して数えます。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: *real_line
  - text: 昔の1ポンドは、いまの1ポンドより、買えるものが多かったからです。
    card: *real_line
  - text: イギリスの物価は、2009年から2025年で、約1.6倍になりました。
    card: &real_table
      type: table
      title: 物価で直した世界記録（百万ポンド）
      columns: [移籍, 当時, 2025年の物価で]
      rows: &real_rows
      - - ジダン 2001
        - '45.6'
        - '85.7'
      - - カカ 2009
        - '56'
        - '89.5'
      - - ロナウド 2009
        - '80'
        - '127.9'
      - - ベイル 2013
        - '85.3'
        - '119.9'
      - - ポグバ 2016
        - '89.3'
        - '122.7'
      - - ネイマール 2017
        - '200'
        - '267.7'
      highlight_row: 2
      note: 英国の消費者物価指数（2015年＝100、年平均）。2025年は138.4
  - text: だから、2009年の額には、約1.6倍を掛けます。
    card:
      <<: *real_table
      highlight_row: 2
  - text: ロナウドの額は、約1億2790万ポンドになります。
    card:
      <<: *real_table
      highlight_row: 2
  - text: ベイルの8530万ポンドは、約1.4倍の、1億1990万ポンド。
    card:
      <<: *real_table
      highlight_row: 3
  - text: ポグバは、ポンドに直した8930万ポンドが、約1.37倍で1億2270万ポンド。
    card:
      <<: *real_table
      highlight_row: 4
  - text: 当時は世界記録でした。けれど、いまの物価では、ロナウドを下回ります。
    emph: true
    card:
      <<: *real_table
      highlight_row: 2
    mark:
    - {kind: circle, row: 3, col: 2}
    - {kind: circle, row: 4, col: 2}
  - text: ただし、ポグバに条件の分を足すと、約1億2860万ポンドになります。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - text: ロナウドを、わずかに上回ります。
    card: none
  - text: ベイルは、別の報道の8600万ポンドでも、届きません。
    card: none
  - text: つまり、条件分を足さなければ、記録は、ロナウドからネイマールまで動きません。
    card:
      <<: *real_table
      highlight_row: 2
  - text: ネイマールは約2億6770万ポンド。ロナウドの、約2.1倍です。
    emph: true
    card:
      <<: *real_table
      highlight_row: 5
  - text: ポグバの条件分を足しても、ネイマールは、ロナウドの約2.1倍のままです。
    emph: true
    card:
      <<: *real_table
      highlight_row: 5
  - text: ロベルト・バッジョは1990年、フィオレンティーナからユヴェントスへ。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - text: 約800万ポンドの記録でした。ネイマールは、その25倍です。
    card: &real_calc
      type: calc
      title: バッジョ（1990年）からネイマール（2017年）まで（自分で割った）
