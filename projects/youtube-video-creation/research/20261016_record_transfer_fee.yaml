      - - 13.5倍
        - 物価を直した倍率
      ops:
      - →
  - text: 物価を直すと、約13.5倍です。
    emph: true
    card: *real_calc
  - text: では、いまの記録に、今夏の最高額はどこまで近いのでしょうか。
    image: assets/backgrounds/stadium_レアルマドリード.png
    card: none
  - text: 今夏の最高額は、エンソ・フェルナンデスの約1億2500万ポンド。
    card: none
  - text: チェルシーからマンチェスター・シティへ。物価を直さない、いまの額です。
    card: &next_calc
