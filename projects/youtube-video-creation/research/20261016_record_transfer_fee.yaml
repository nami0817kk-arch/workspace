    card: *next_calc
  - text: 2017年の額を物価で直すと、約2億6770万ポンド。
    card: none
  - text: 今夏の最高額と比べると、約2.1倍です。
    emph: true
    card:
      type: calc
      title: 物価を直したネイマールは、今夏の最高額の何倍か（自分で割った）
