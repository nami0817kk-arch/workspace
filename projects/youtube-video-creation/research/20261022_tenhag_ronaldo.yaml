# 取材メモ（2026年10月22日）テン・ハフ氏、マンU時代のロナウドを語る（ニュースのショート。見せ方 B＝写真を切り替え）
# 取材: 2026-10-22。requests（ブラウザUA）で原文を読んだ。
#   ・サッカーキング 2026-10-21「テン・ハフ氏、マンU指揮時のC・ロナウドを批判…」（本文を全部読んだ。BBC・アスレティックを引く日本語の孫引き。研究メモ: 題材の一覧の出典）
#   ・GOAL（英語版）2026-10-20 17:41「“He let the team down”: Erik ten Hag's scathing assessment…」（アスレティックのインタビューを引く。発言の英語を確かめた。アスレティックがロナウド側にも伝えたが返答なし、の記述はここ）
#   ・Yahoo Sports（英語）「Erik ten Hag reveals why Cristiano Ronaldo was 'not capable' of pressing…」（同じインタビューの発言の英語。最後の発言までここで確かめた）
#   ・Sky Sports の本文は URL を特定できず読めていない（題材の一覧は出典に挙げていたが、同じ発言を上の3つで確かめたので足りる）。アスレティックの原文は有料で未読。BBC も本文は読めていない。
# 発言の訳: 英語の原文（GOAL・Yahoo）から訳した。日本語はサッカーキングの訳と意味が一致することを確かめた。言い換えていない。
#   "He let the team down, and he let me down, because we planned with him."
#   "Obviously, he's one of the best in football history. I respected him a lot. But at that time, as a manager, I had to make a rational decision and keep the players I admire in."
#   "He ran neither in possession nor out of possession. The reason was because he didn't prepare himself."
#   "Every top team has to embrace the top player, but the top player has to work for the team."
#   "He was telling the players, 'Save your legs at the training.'"
# 【題材の一覧の言葉を原文で引き直した点】
#   ・一覧の「我々は彼を組み込んだ計画を立てていた」は原文 "we planned with him"（Yahoo）/ "we had planned with him"（GOAL）。台本は「我々は彼を組み込んだ計画を立てていたからだ」のサッカーキングの訳に合わせた。
#   ・一覧の「メイヌーは『特別な選手』と評価」は、今回読んだ3つの本文には無かった（確かめられていない）。台本に入れない。
#   ・一覧の「30日の出場停止処分」は代表チーム（ポルトガル）の話。GOAL に載っているが、この題材とは別の話。入れない。
#   ・Yahoo は「トレーニングで心拍が上がらなかった」「走る3周のうち2周」などテン・ハフ氏の説明を書くが、引用符の外の記者の要約。台本に入れない。
# 【断りを入れる点（brief の指示）】
#   ・ロナウドは現在サウジアラビアのアル・ナスルでプレー（GOAL: 契約は2027年夏まで）。話は2022年当時のマンU時代。→ 台本で「いまの話ではなく2022年の話」と言う。7リーグ外の選手の古い話であることを断る。
#   ・ロナウド本人を貶さない。テン・ハフ氏の言葉の紹介にとどめ、「テン・ハフ氏の側の見方」と言う。「史上最高の選手の一人」と評した発言も入れる。アスレティックが本人側に伝えたが返答なし（GOAL）。
#   ・当時の経緯（2022年10月のトッテナム戦で途中出場を拒否 → チェルシー戦でメンバー外 → 11月に双方合意で契約解除）はサッカーキングの記述。ロナウド側の言い分（当時のインタビュー）は別に伝えられているが、今回は入れない。
# 自分で数えたもの（見立て）:
#   ・テン・ハフ氏の就任は2022年7月、ロナウドの契約解除は2022年11月（サッカーキング）。同じチームにいた期間は約4か月（GOAL も four months）。
#   ・語られたのは2026年10月。契約解除から約4年（2022年11月→2026年10月）。テン・ハフ氏がユナイテッドを去った2024年10月からも2年。
#   ・「当時36歳」とサッカーキングは書くが、ロナウドの生年月日からの計算と合わないので年齢は言わない。
# 本人の言葉の有無: テン・ハフ氏の言葉は実在（アスレティックのインタビュー）。ロナウド本人の今回の言葉は無い（返答なし）。入れない。
# 反応: 当たっていない（今回の発言への投稿・書き込みは取り出していない）。作らない。0件。approve は --no-voices で。
# 前の本との重なり: scripts/20261017_record_ronaldo_messi・20261021_ronaldo_r9_legend は別の話（記録・ブラジルのロナウド）。ユナイテッド時代の確執の話は未扱い（covered.yaml・posted.json に「テン・ハフ」は無し）。
# 写真: Wikimedia Commons（CC BY-SA 4.0 / 3.0）。マンU対ブライトン（2022-08-07）などの試合写真から、背番号と名前の入った場面で本人を確かめた。代理店・報道写真は使っていない。
#   記事の主写真（Getty）は使わない。今日の記事に使える今日の写真は無い。
