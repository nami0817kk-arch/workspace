# 堂安律と佐野海舟の日本人対決（2026年9月13日の試合／9月14日に出す）
#
# **軸は「日本人対決」**（2026-09-13 ユーザー指示「佐野との日本人対決として作成」）。
# 堂安ひとりの回ではなく、**同じピッチに立った3人の日本人**の話にする。
#
# 引きは**「勝ったのは、点を取っていないほう」**。
# 芯は**堂安が2つの得点の起点になり、佐野のチームが負けた**こと。ここが山場（@main）。
#
# **発言は1件も取れていない**（どの記事にも鉤括弧が無い）。
#
# **佐野を落として書かない。**フル出場していて、67分にはペナルティエリアへ入っている。
# 記事に書かれていること以上の評価をこちらで足さない
