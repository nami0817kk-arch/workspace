  - id: split
    heading: 分けたのはどこか
    main: true
    tier: 報道
    telop: 2つの得点の起点に、堂安がいた
    narrator: 解説
    # **ここが山場。**ショートはこの節を切り出す。
    # 点を取ったのは別の選手。**得点の手前に誰がいたか**が芯
    card:
      type: table
      title: 堂安律が絡んだ2つのゴール
      columns: ["", ""]
      rows:
        - ["9分（先制点）", "自陣でボールを奪う → ブルカルトが抜け出す → ウズンが決める"]
        - ["60分（3点目）", "右から持ち込んで引きつける → ゲッツェ → クロスをウズンが押し込む"]
    say:
      - マインツ対フランクフルト。堂安律と佐野海舟の日本人対決です。
      - どちらも点は取っていません。分かれたのは、得点の手前にいたかどうかでした。
      - 9分の先制点。始まりは堂安が自陣でボールを奪ったところです。そこからブルカルトが抜け出し、ウズンが決めました。
      - 60分の3点目。堂安が右サイドから持ち込み、相手を引きつけてゲッツェへ渡します。そのクロスを、ウズンが押し込みました。
      - 守備から1つ、仕掛けから1つ。どちらの得点も、堂安が起点になっています。
      - 試合は3対1。フランクフルトが今シーズンのリーグ戦で初めて勝ちました。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/13/post1009893/
      - https://www.soccer-king.jp/news/world/ger/20260913/2204239.html

  - id: other
    heading: もう2人はどうだったか
    tier: 報道
    telop: 67分、小杉と佐野が向き合った
    narrator: キャスター
    card:
      type: table
      title: 3人が絡んだ場面
      columns: ["", ""]
      rows:
