        - ["55分", "小杉が攻め上がり、ペナルティエリアでシュート"]
        - ["67分", "ペナルティエリアへ入った佐野に、小杉が対応"]
    say:
      - 堂安は6分にもシュートを打っていて、これはポストを直撃しました。
      - 小杉啓太は55分、攻め上がってペナルティエリアの中でシュートを放っています。
      - その小杉と佐野海舟が向き合ったのが67分。ペナルティエリアへ入ってきた佐野に、小杉が対応しました。
      - 日本人どうしが直接ぶつかった場面です。
    official: false
    sources:
      - https://www.footballchannel.jp/2026/09/13/post1009893/

  - id: voices
    heading: 見ていた人が書いていたこと
    tier: 未確認
