      - {voice: ネット民, text: 律の守備、スライディングは凄かった。どこから走って来たん？って、55分のところから何度も巻き戻して見たわ}
      - {voice: ネット民, text: 解説さんが、おぉ、見事、堂安って言ってたよ}
      - {voice: ネット民, text: その少し後の佐野さんのボール回収も素晴らしかった}
      - {voice: ネット民, text: 先制点は堂安の守備から始まり、3点目にも絡んでいるのがいいですよね}
      - {voice: ネット民, text: ゴールやアシストだけじゃなく、得点につながるところで存在感を出しているのが嬉しいです}
      - {voice: ネット民, text: 佐野海舟、プレーの幅がどんどん増えてる。横パスをスルーして、前に飛び出してる。最後は小杉に止められちゃったけど、アンカーなのにブラジルのアタッカーっぽい抜け出し方。上手いね}
      - {voice: ネット民, text: この試合は小杉が勝ったけど、次は佐野海舟がやり返すぜ}
