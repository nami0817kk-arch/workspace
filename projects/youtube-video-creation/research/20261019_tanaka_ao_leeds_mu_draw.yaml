# 田中碧 の取材メモ（2026年10月19日・ショートだけ）。**試合の結果**を軸にする（10/18 の田中の回は試合前の見立て）。
# 取材: 2026-10-19。requests（ブラウザUA）で原文を全部読んだ。
#   ・サッカーキング 2026-10-18「マンU、ムベウモ先制弾もリーズとドローで6戦未勝利に…先発出場の田中碧は81分までプレー」
#     https://www.soccer-king.jp/news/world/eng/20261018/2218066.html （research/raw/20261019_a_sk.txt）
#   ・リーズ公式サイト（leedsunited.com）試合記録「Leeds United draw 1-1 with Manchester United at Elland Road」
#     https://www.leedsunited.com/en/news/leeds-united-draw-1-1-with-manchester-united-at-elland-road
#   ・リーズ公式サイト ファルケ監督の試合後の言葉（英語・全文を読んだ。research/raw/20261019_leeds_farke2.txt）
#     https://www.leedsunited.com/en/news/daniel-farkes-solitary-criticism-after-leeds-uniteds-1-1-draw-with-manchester-united
#   ・サッカーキング 2026-10-10「…アーセナルが無敗のリーズを撃破！…田中碧は71分まで出場」（見出しだけ。前節の出場時間）
#     https://www.soccer-king.jp/news/world/eng/20261010/2215180.html
# 資料間のずれ（台本では**分を言わない／ぼかす**）:
#   ・同点弾の時刻：SK本文「51分」・SK得点者欄「56分」・リーズ公式の試合記録「51'」。→ 台本は「後半の立ち上がり」とだけ言う。
#   ・田中の交代：SK「81分」・リーズ公式の出場表「Tanaka (Longstaff 80')」。→ 台本は「80分すぎまで」と言う（81分とも80分とも言い切らない）。
#   ・「6戦未勝利」：SKの見出し。本文は「ここまで6試合を戦ってわずか1勝」「直近では公式戦5試合勝利から遠ざかっている」。→ 台本は「公式戦6試合、勝ちがありません」（5試合＋今回のドロー）と言う。
# 自分で数えた比べ: 田中の出場は前節（10/10 アーセナル戦）71分まで → 今回は80分すぎまで。前節より延びた（引き算の数字は言わない）。
# 本人の言葉: 田中碧本人の言葉は記事にもリーズ公式にも無い（作らない）。ファルケ監督の試合後の言葉は英語の原文を訳した（田中への言及は無い）。
# 反応: 探していない（0件。作らない）。
# 写真: 配信写真（Getty）は取り込まない。**リーズ公式サイトの記事内写真**（田中が写るもの4枚。leedsunited.com の各記事のヒーロー写真）。
#   01 アーセナル戦（10月）・02 ニューカッスル戦（9月・得点を喜ぶ場面）・03 日本代表（9月ベネズエラ戦）・04 日本代表（6月スウェーデン戦・谷口と）。
#   今日の試合の田中の写真はリーズ公式にも見つからなかった。10/18 に使った Commons の写真は使い回していない。
