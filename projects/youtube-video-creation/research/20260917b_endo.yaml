  - id: said
    heading: 監督が挙げた理由
    main: true
    tier: 報道
    telop: 「プレシーズンの多くを逃した」
    narrator: 解説
    say:
      - {short_only: true, text: リヴァプールの遠藤航について、監督が話しました。}
      - フラム戦のあと、アンドニ・イラオラ監督が遠藤について聞かれました。
      - {voice: イラオラ監督, text: ワタはプレシーズンの多くを逃したため、まだ本調子ではない}
      - ただ、突き放してはいません。
      - {voice: イラオラ監督, text: 非常に良いトレーニングを積んでいる}
      - そのうえで、こう続けました。
      - {voice: イラオラ監督, text: 問題は、彼のポジションに多くの競合選手がいることだ}
      - 名前も挙がりました。フラーフェンベルフ、マック・アリスター、ソボスライ。
      - いま出場時間を与えているのは、この選手たちだ、という説明です。
    official: false
    sources:
      - https://football-tribe.com/japan/2026/09/13/359182/

  - id: winter
    heading: 冬に動くのか
    tier: 未確認
