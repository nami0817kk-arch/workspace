      - 4月には、レギュラーとして出場するために退団を認めてほしいと申し入れた、と報じられました。
      - クラブ側は「彼の決定を尊重する」と応じた、という書かれ方です。
      - 6月には残留、7月には合意、8月には構想外。**報道は行ったり来たりしています。**
      - どれも裏は取れていません。**決まったこととして扱えるものは、いまのところありません。**
