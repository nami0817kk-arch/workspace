    say:
      - 現地時間3日、ヨーロッパサッカー連盟が各クラブの登録メンバーを公開しました。
      - リヴァプールの**25人**に、遠藤航の名前はありませんでした。
      - 同じく外れたのが、イタリア代表のフェデリコ・キエーザです。
      - 代わりに中盤で入ったのは、下部組織出身で**21歳**のジェームズ・マコネルでした。
      - これで遠藤は、チャンピオンズリーグのリーグフェーズ**8試合**に出られません。
