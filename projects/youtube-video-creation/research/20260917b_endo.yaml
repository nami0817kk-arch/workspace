# 遠藤航に、イラオラ監督が説明した（2026-09-13 の発言）
#
# **9/15 朝に出した「4試合続けて出番なし」の続き。**あちらは出番の話、
# こちらは**監督が理由をどう説明したか**と、CL登録から外れた事実。
#
# 引きは**「本調子ではない、と監督が言った」**。ここが山場（@main）。
#
# **移籍が決まったとは書かない。**「今冬に移籍か」という見出しは出ているが、
# 裏が取れていない。**出すのは監督の言葉と、登録メンバーという事実だけ。**
#
# **反応はこの題材のスレが無い。**取れたのはテレビ番組の話で、中身が違う。
# 入れない
