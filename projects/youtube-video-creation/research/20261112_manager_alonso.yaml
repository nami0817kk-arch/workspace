# 監督紹介：シャビ・アロンソ（11/12 木、シリーズ「監督紹介」、key: manager_alonso、型は news）。9節のうち「日本との接点」は無いので8節。見本は 20261110_manager_emery。
# 順：フック→基礎DATA→歩みと転機→戦術の色（実例の試合1つ）→数字で見る→本人の言葉→マル秘話→見立て。
#
# **題材の選び方（2026-11-11）**：既出14人（…エメリ）以外の大物。
#   ・ジダンは 10/03 の「監督の経歴」・10/18 のレジェンドで出ている。森保一は 10/06 に「監督の経歴」で勝率の本を出している。どちらも重なるので外した。
#   ・ナーゲルスマン・ポチェッティーノ・インザーギは今季の欧州7リーグの監督ではない／立場が動いているので後ろへ。
#   ・アロンソ：チェルシー監督（2026-07-01 就任）。英語版 Wikipedia の冒頭で確認。11/6 のエメリの指示書は「10/23 のレバークーゼンのクラブ紹介で無敗優勝の話を出している」ので外していたが、
#     監督の経歴として1本にまとめるのは別の角度（通算・転機・チェルシーでの今）。重なりは下に書く。日本との接点は無いので入れない。
#   **重なりの確認（2026-11-11 に自分で）**：research/posted.json の build 名に alonso の監督紹介は無い。scripts/20260918_alonso.md（チェルシーのオーナー交代の日の発言）・
#   20261024_alonso_chelsea_no_reds（退場ゼロ）はニュースのショート。20261023 のレバークーゼンのクラブ紹介は「無敗優勝」を1節で扱う。→ 今回は通算の数字・5つの職場の歩み・チェルシーでの今の数字で組み、
#   無敗優勝は「フック」と「戦術の色」に絞って、クラブ紹介の文の言い回しは使わない。
#   同じ 11/12 の他の担当（research/20261112_picks.txt）：クラブ紹介＝ウニオン・ベルリン、財政＝ブレントフォード、代表＝韓国（team_korea）、レジェンド＝ラウール。重ならない。
#
# **いまの立場**：チェルシー監督（2026年7月1日から、4年契約）。
#   ○ 英語版 Wikipedia「Xabi Alonso」（2026-11-11 に読む）：「is the manager of Premier League club Chelsea」「On 17 May 2026, Premier League club Chelsea appointed Alonso ... four-year contract, starting from 1 July 2026」。
#   ○ 初勝利：2026-08-24 フラム戦（クレイヴン・コテージ）3-2。
#
# **通算（台本とサムネをそろえる）**＝英語版「Managerial statistics」（As of match played 8 November 2026）：
#   レアル・ソシエダB 98試合40勝23分35敗／レバークーゼン 140試合88勝33分19敗（306得点149失点）／レアル・マドリード 34試合24勝4分6敗（72得点38失点）／チェルシー 13試合7勝2分4敗（28得点20失点）。
#   Career Total 285試合159勝62分64敗（546得点327失点）。自分で足して一致（98+140+34+13＝285、40+88+24+7＝159、23+33+4+2＝62、35+19+6+4＝64、得点 140+306+72+28＝546、失点 120+149+38+20＝327）。下部組織はソシエダBのみ（B チーム）。
#   勝率（自分で割った。表の値と一致）：ソシエダB 40.8%、レバークーゼン 62.9%、マドリード 70.6%、チェルシー 53.8%、通算 55.8%。
#   1試合あたりの失点（自分で割った）：レバークーゼン 149÷140＝1.06、マドリード 38÷34＝1.12、チェルシー 20÷13＝1.54。得点：レバークーゼン 306÷140＝2.19、マドリード 72÷34＝2.12、チェルシー 28÷13＝2.15。
#   ※サムネの表はソシエダBを含む4チーム（B チームも「監督」としての試合）。
#
# **歩み**（英語版本文）：
#   2018 レアル・マドリードU14のコーチ。2019-06 ソシエダB 監督。2年目の2021-05-22 昇格プレーオフでアルヘシラスに勝ち、2部へ（クラブは1961-62以来）。2022年、クラブは2部から降格。
#   2022-10-05 レバークーゼン監督（前のセオアネの後、8試合を終えて18クラブ中17位）。2022-23 は6位。2023-24 は 28勝6分け0敗、勝点90、89得点24失点、16試合無失点、10連勝、クラブ初のブンデス優勝（2024-04-14 に5試合を残して決定）。
#   33試合負けなしでバイエルンの32を超え（2024年2月）、2024-05-09 にヨーロッパ記録の49試合負けなし（ベンフィカの48を抜く）、51試合まで伸ばして EL 決勝でアタランタに0-3。DFB杯もクラブ初以来の優勝（カイザースラウテルン1-0）。
#   2025-05 退任発表。2025-06 レアル・マドリード（3年契約）。2026-01-12 に、スペイン・スーパーカップ決勝でバルセロナに2-3で負けた翌日、双方の合意で退任。7か月。
#   2026-05-17 チェルシー発表、2026-07-01 就任。
#
# **戦術の色**＝2024年4月14日 レバークーゼン 5-0 ヴェルダー・ブレーメン（英語版本文：5試合を残してクラブ初のブンデス優勝）。
#   形は3-4-3。「最初の11試合でオープンプレー（流れの中）からの失点は5」（英語版本文）。深い位置のゲームメーカーに（ジャカ）、ウイングバックの幅。奪われたらすぐ戻して前線で奪い返す（Style of management の節）。
#
# **基礎**：1981-11-25 スペイン・サン・セバスティアン生まれ（2026-11-11 時点で44歳）。選手：レアル・ソシエダ→2004 リヴァプール（初年度に CL 優勝）→2009 レアル・マドリード→2014 バイエルン。スペイン代表114試合。2010年W杯優勝、EURO 2008・2012優勝。2017年に引退。
# **影響を受けた監督**（英語版 Style of management）：グアルディオラ、アンチェロッティ、モウリーニョ、ベニテス、デル・ボスケ。
#
# **本人の言葉**：チェルシー公式サイト「Every word from Xabi Alonso's first interview as Chelsea manager」（requests で本文を読んだ。2026年夏、プレシーズン初日の前日）：
#   "The structure is great, but you need to give soul, you need to give purpose, you need to bring good work, good energy, positiveness" / "this is all about the human connections, for them to feel good. And when you feel good, normally you perform well."
#   "I've been there, at Stamford Bridge - mostly on the other side".
# **マル秘話**（英語版 Personal life）：アーセナルのアルテタとは、サン・セバスティアンの同じ通りで育った隣人。のちリヴァプールでも近くに住み、アロンソがエバートン移籍を勧めた。幼いころからリヴァプールのファンと自称（2011年のタイムズ）。
#
# **入れなかったもの**：マドリードでのヴィニシウスとの不和（選手・監督を小さく見せる）、妻・子（私生活）、FotMob・女子・ニュースの反応、マドリード退任の「失敗」という語り。日本との接点（無い。サッカーの縁でも見つからなかった）。
