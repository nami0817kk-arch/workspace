- id: view
  viewpoint: true
  heading: 見立て・得点は同じ水準。チェルシーで足りない数字は何か
  tier: 背景
  telop: 1試合あたりの失点。レバークーゼン1.06、チェルシー1.54
  narrator: 解説
  card: &view_table
    type: table
    title: 自分で割ってみた（アロンソの1試合あたり）
    columns: [チーム, 得点, 失点]
    rows:
    - [レバークーゼン, '2.19', '1.06']
    - [マドリード, '2.12', '1.12']
    - [チェルシー, '2.15', '1.54']
    highlight_row: 2
  say:
  - text: 見立てです。アロンソのチームの、1試合あたりの得点と失点を割りました。
    image: assets/images/20261112_manager_alonso/08_w.jpg
    card: *view_table
  - text: 得点は、レバークーゼンが2.19、チェルシーが2.15。ほぼ同じです。
    card:
      <<: *view_table
      highlight_row: 0
  - text: 一方、失点はレバークーゼンの1.06に対して、チェルシーは1.54。
    emph: true
    mark: {kind: circle, row: 2, col: 2}
    card:
      <<: *view_table
      highlight_row: 2
  - text: チェルシーはまだ13試合で、7勝2分け4敗。勝率は53.8%です。
    image: assets/images/20261112_manager_alonso/10_w.jpg
    card: none
  - text: レバークーゼンでも、1年目は8試合を終えて17位から始まりました。
    card: none
  - text: 守りの数字がどこまで近づくかが、チェルシーでの最初の見どころだと考えます。
    image: assets/images/20261112_manager_alonso/09_w.jpg
    card: none
  - text: リヴァプール、マドリード、バイエルンで見た景色を、監督としてどう持ち込むか。
    card: none
  - text: 次の試合に注目です。
    card: none
  sources:
  - https://en.wikipedia.org/wiki/Xabi_Alonso
