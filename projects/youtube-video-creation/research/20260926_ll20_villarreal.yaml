- id: data
  heading: いま見る理由と基礎DATA
  main: true
  tier: 背景
  telop: 2年続けて欧州の最高峰。新監督はイニゴ・ペレス
  narrator: キャスター
  say:
  - text: 今季は2シーズン続けて、チャンピオンズリーグで戦います。
    image: assets/stats/ll_villarreal_data_r1.png
    no_telop: true
  - text: 就任したばかりのイニゴ・ペレス監督は、こう話しました。
    image: assets/stats/ll_villarreal_data_r2.png
    no_telop: true
  - voice: イニゴ・ペレス
    text: チャンピオンズリーグで指揮をとれるのは、とてもうれしい。ずっと見てきた大会だ
    image: assets/stats/ll_villarreal_data_r2.png
  - text: そしてこのクラブは、人口**5万**ほどの町から、ヨーロッパの大会を制しています。
    image: assets/stats/ll_villarreal_data_r3.png
    no_telop: true
  - image: assets/stats/ll_villarreal_data0.png
    text: 創立は**1923年**。入場料は男性が半ペセタで、女性は無料でした。
    no_telop: true
  - image: assets/stats/ll_villarreal_data1.png
    text: 愛称は「黄色い潜水艦」。**1967年**の昇格を、ビートルズの曲で祝ったのが始まりです。
    no_telop: true
  - image: assets/stats/ll_villarreal_data2.png
    text: ホームタウンはビジャレアル。人口**5万3623人**、タイル作りが盛んな町です。
    no_telop: true
  - image: assets/backgrounds/stadium_ビジャレアル.png
    text: 本拠地はエスタディオ・デ・ラ・セラミカ。クラブの発表では、**2万3173人**が入ります。
  - image: assets/stats/ll_villarreal_data4.png
    text: オーナーは**1997年**からフェルナンド・ロイグ。陶磁器の会社も持つ実業家です。
    no_telop: true
  - image: assets/stats/ll_villarreal_cups.png
    text: 1部も国王杯も、優勝はまだ**0回**。ヨーロッパリーグ**1回**、インタートトカップ**2回**。
    no_telop: true
  - image: assets/stats/ll_villarreal_data6.png
    text: 最多出場は、中盤のマヌ・トリゲロス。このクラブで**477試合**に出ました。
    no_telop: true
  - image: assets/stats/ll_villarreal_data7.png
    text: 直近のタイトルは、**2021年**のヨーロッパリーグです。
    no_telop: true
  - image: assets/stats/ll_villarreal_data8.png
    text: 昨季のリーグ戦は**3位**。勝ち点は**72**でした。
    no_telop: true
