- id: features
  heading: このクラブの特徴
  tier: 背景
  telop: 支配する。売っても崩れない。町ぐるみのクラブ
  narrator: 解説
  card:
    type: table
    title: このクラブの特徴
    columns:
    - ''
    - ''
    rows:
    - - プレーの色
      - 試合を支配して攻める
    - - 運営の型
      - 主力を売っても崩れない
    - - クラブの気質
      - 町の3分の1が年間シート
  say:
  - text: イニゴ・ペレス監督のチームは、試合を支配して攻める。課題は決め切ること、と本人。
    image: assets/photos/ll/villarreal/villarreal_manager_1c383d6e.jpg
  - ピッチの外は、主力を売っても崩れない型。
  - 昨シーズンの前、中盤のバエナを**4200万ユーロ**でアトレティコへ売りました。
  - それでも終わってみれば、そのアトレティコより上でした。
  - スタンドは町ぐるみ。年間シートは**1万9000人**を超え、町の人口の3分の1より多い数です。
  sources:
  - https://en.wikipedia.org/wiki/Villarreal_CF
  - https://villarrealcf.es/inigo-perez-el-triunfo-nos-va-a-venir-muy-bien-para-el-paron/
  - https://en.wikipedia.org/wiki/2025%E2%80%9326_Atl%C3%A9tico_Madrid_season
  - https://villarrealcf.es/mas-de-19-000-razones-para-luchar/
  bg: assets/backgrounds/stadium_ビジャレアル_in.png
  official: false
