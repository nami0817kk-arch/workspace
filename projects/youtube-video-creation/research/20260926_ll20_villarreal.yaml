    image: assets/images/ll_villarreal_episode/scene.jpg
  - 欲しかったのは白いシャツと黒いパンツ。店にどちらも無く、あったのは黄色だけ。
  - 黄色いシャツはそのまま定着し、いまは上下とも黄色です。
