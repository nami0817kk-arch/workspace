# ブンデス の取材メモ（2026年10月16日）
# 1本＝1テーマ。まとめではなく、1つの話を掘る
# 埋めたら python -m src.cli draft このファイル で台本になる
# 取材: 2026-10-16。requests（ブラウザUA）と WebFetch で原文を読んだ。Sky Sports 本文（requests で取り出した全段落。raw/20261016_kane_sky.html）・
#   fcbinside（ドイツのバイエルン系ニュース。BILD のファルク記者のポッドキャストの内容を引く記事・ロマーノがスカイのブリッジ記者を引いたと書く記事）・
#   t-online（dpa 配信）・theWORLD（10/6）。クラブ公式（fcbayern.com）はタイムアウトで読めなかった。ロマーノ本人の投稿は個別URLが取れず読んでいない（fcbinside 経由の孫引きだけ）。
# 原文（Sky Sports）: 2026-10-15 16:23 UTC 公開（17:38 UTC 更新）、Michael Bridge 記者。
#   「Harry Kane has agreed a new deal in principle with Bayern Munich until the summer of 2029.」
#   「It's understood the Bundesliga club are now finalising the paperwork on his contract extension.」
#   → 台本はこの2文の範囲で書く。年俸・ボーナス・解除条項の数字は Sky に無い → 台本に入れない。
# どこまでが確定か:
#   確定＝無し。クラブ（バイエルン）の公式発表は 10/15 時点でまだ（fcbinside「Eine offizielle Bestätigung des FC Bayern steht weiterhin aus」、t-online も「Medienberichten zufolge」）。
#   報道＝Sky の「原則合意（in principle）・書類を詰めている」、BILD ファルク記者「契約期間で合意」。確度は 報道。
#   「基本合意」の訳: in principle＝原則として合意。契約書への署名は済んでいない。台本は「基本合意」と言い、署名はまだと添える。
#   「基本合意」の報道自体は 10/6 から出ている（theWORLD 10/6 17:50 JST が、ドイツのプレッテンベルク氏を引いて「2029年夏までの新契約で原則合意」）。今回の Sky は、その続きで「書類を詰めている段階」まで進んだ報道。
# 資料間のずれ・数字:
#   Sky 10/15「バイエルン移籍後 156試合で154ゴール」。theWORLD 10/6 は「154試合で152ゴール」→ 2試合2ゴール増えて一致。台本は Sky の数字。
#   昨季「代表を含めて73ゴール・65試合」（Sky）。題材一覧の「72〜73」は媒体差。台本では使わない。
#   ブンデス100ゴール: Sky「98試合で到達。前の記録のディーター・ミュラーより31試合速い」。ミュラーの試合数は 98+31=129試合（自分で足した。Sky は 129 とは書いていない）。
#   t-online（dpa）「100ゴールではなく101ゴール」と書く → Sky の「100ゴール到達」の時点と今の差。台本は 100 の到達だけ言う。
#   現行契約: fcbinside（BILD 系）「2027年夏まで」・t-online「契約は夏に切れるはずだった」・theWORLD「2027年夏まで」→「2027年夏まで」で一致。Sky 本文には書いていない。
#   期限: Sky「summer of 2029」。fcbinside（ロマーノ経由）「2029年6月」→ 台本は「2029年の夏まで」。
# 発言: BILD の Christian Falk 記者（ポッドキャスト「Bayern Insider」、10/15 朝）。fcbinside が引いた原文（ドイツ語）を訳した。ポッドキャストの音声そのものは聞いていない。
#   「Ich habe gehört, es gibt tatsächlich jetzt eine Einigung bei dem Hauptknackpunkt der Vertragslaufdauer」→「契約期間という最大の争点で、いま合意があると聞いている」
#   「Jetzt geht's nur um Details」→「いまは細部だけの話だ」（細部は肖像権・マーケティング権＝Bild- und Vermarktungsrechte。fcbinside の説明）。
#   「Sie wollen vor der Ballon-d'Or-Verleihung den Vertrag fix machen」→「バロンドール授賞式の前に契約を固めたい」（授賞式は 10/26）。
# 本人（ケイン）のコメント: この件についての新しい発言は Sky・fcbinside・t-online のどれにも無い → 入れない（9/24 の「かなり良い状態だ」は契約の話ではないので使わない）。
# 反応（ネット民）: 取れなかった。当たった先＝日本語の検索（ケイン バイエルン 契約延長 反応・サカラボ・nofootynolife・footballnet）、Yahoo!ニュースの記事（コメント欄は本文に出ない）、
#   Sky・fcbinside・t-online の記事。この件についての書き込みの記事は見つからなかった。X は読まない決まり。→ 作らない。approve は --no-voices "反応が見つからなかった" で通す。
# 写真: 10/14 のケインの回は assets/images/kane_a/01.jpg（Commons・イングランド対ガーナ）。→ 今日は別の写真にする（assets/images/20261016_kane_bayern_extension/）。
