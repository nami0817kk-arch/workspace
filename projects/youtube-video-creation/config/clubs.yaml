# クラブ名の別名辞書。
#
# 見出しは英語・現地語・日本語・略称が入り混じる。
# "Spurs" と "トッテナム"、"Man City" と "マンチェスター・シティ" が
# 同じクラブだと分かっていないと、
#   ・ビッグクラブの判定（日本語表記しか見ていない）
#   ・同じ話題のまとめ（英語記事と日本語記事が別件になる）
#   ・リーグの割り当て（手で埋めるしかない）
# を取りこぼす。
#
#   canonical … 台本で使う日本語表記。これが topic のもとになる
#   league    … 候補の league を埋めるのに使う
#   big       … scoring.big_club の判定に使う
#   aka       … 見出しに出る書き方。長いものから順に照合する
#
# 注意: 短すぎる別名は書かない。"Madrid" はレアルにもアトレティコにも当たり、
#       "Milan" は Inter Milan にも当たる。"AFC" は AFC Bournemouth に当たる。
#       曖昧なものは入れないこと。
clubs:
