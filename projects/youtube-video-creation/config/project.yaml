# プロジェクト全体の設定。台本ごとに変えたい値はここを編集する。

video:
  width: 1920
  height: 1080
  fps: 30
  # 空にすると環境から日本語フォントを自動検出する
  font: ""
  # false にすると立ち絵を出さず、見出しを大きく置くニュース風の画面になる
  # 立ち絵は出さない。2026-09-03 に掛け合いへ変える判断をしたが、
  # 立ち絵を出すと巨大な仮素材が移籍カードに重なり、画面が悪くなった（実測）。
  # 掛け合いは「2人が交互に話す声」と話者バッジで表す
  show_characters: false
  # 2026-09-07: 74 -> 100。参考チャンネルの見出しは画面幅の6〜7%あり、
  # 74px（1920幅の3.9%）では並べたときに明らかに細く見えた。
  # balanced_wrap は行数を保ったまま狭い幅で折り返すので、幅を埋めるには
  # 折り返しではなく文字を大きくするしかない
  headline_size: 100
  # 冒頭の登録カードに出すチャンネル名（2026-09-08）。参考チャンネルは
  # 0.5〜2.5秒にチャンネル名と登録ボタンのカードを出し、読み上げでは頼まない
  channel_name: 海外サッカーの理由
  accent: "#3ea6ff"          # 見出し左のアクセント帯の色
  # news=報道テロップ風（速報フラグ＋見出しプレート＋ティッカー）
  # band=写真＋黄色帯＋赤帯 / clean=文字組みだけ
  # 2026-09-07: news → band。参考チャンネルの**最高再生2本**（64万回・25万回）を
  # 実際に見たら、どちらも蛍光イエローの帯1枚に黒＋赤の2行で、上に書き込みの
  # 断片が白い小窓で乗っていた。news（報道番組ふうの下帯）は一覧で沈む
  thumbnail_style: "band"
  telop_size: 58
  name_size: 40
  title_size: 72
  background: "assets/backgrounds/default.png"

voicevox:
  # 代弁に使う声の候補。**代弁する人ごとに声が変わる**（2026-09-05 のユーザー判断）。
  # 名前から選ぶので、同じ人はいつも同じ声になる（動画をまたいでも変わらない）。
  #
  # 話者ごとに「ノーマル」を1つずつ。同じ人の別スタイル（あまあま/ツンツン等）を
  # 混ぜると、聞き分けられず**別人だと分からない**。
  # キャスター(2) と 解説(13) は読み手なので候補から外す。
  # 代弁に使う声。**男の人には男性の声を当てる**（2026-09-07 ユーザーの指示）。
  # 話者はほぼ全員が男性（選手・監督・解説者）なので、**既定は男性のプール**。
  # 女性と分かっている人だけ voice_female に名前を書く。
  #
  # 男女は VOICEVOX の全40キャラを1文ずつ喋らせて、**基本周波数を実測して**分けた
  # （2026-09-07。男性は110〜175Hz、女性は205Hz以上できれいに分かれた）。
  # 13番（青山龍星）は男性だが「解説」が使っているので、プールには入れない
  voice_pool: [99, 52, 11, 21, 53, 51, 67, 100]
  voice_pool_female: [3, 8, 9, 10, 14, 16, 20, 23, 29, 43, 46, 47, 54, 55]

  # 女性の話者。ここに名前がある人だけ voice_pool_female から選ぶ
  voice_female: []

  # **使わない声**（2026-09-07 ユーザーの指示）。42番＝ちび式じいは老人の声で、
  # メッシとモウリーニョがこの声で喋っていた。プールに入れ直したら config が止める
  voice_banned: [42]

  # **匿名の群衆は行ごとに声が変わる**（2026-09-07）。「ネット民」が20件つづけて
  # 同じ声だと、一人の独白に聞こえる。発言の文字から選ぶので、同じ発言はいつも同じ声
  # voices の型（2026-09-08）で使う名前もここに。現地サポ／海外のファン は
  # 匿名の集まりなので、1件ごとに声が変わってよい
  voice_crowd: [ネット民, 現地サポ, 海外のファン]

  # 名前ごとの決め打ち。ハッシュが衝突したときの逃げ道（review が衝突を見つける）。
  # **男性の声は8つしかない**ので、よく出る名前は先に決めておく
  voice_fixed:
    ネット民: 52        # 雀松朱司。落ち着いた男性。匿名の書き込みを読む
    メッシ: 67          # 栗田まろん。若い男性
    モウリーニョ: 21     # 剣崎雌雄。低い男性
    グアルディオラ: 53   # 麒ヶ島宗麟
    # **ここに足しすぎない。**固定するたびに、匿名の反応が選べる声が減る。
    # 2026-09-08 に3人足したら群衆に残る声が1つになり、独白に聞こえた
    # （tests/test_config.py が止めた）。衝突は話者名を変えて逃がす

  # auto = VOICEVOXアプリ(ENGINE)があればそれを使い、無ければローカルのCOREで合成する
  backend: "auto"          # auto / engine / core / silent
  url: "http://127.0.0.1:50021"
  core_dir: "vendor/voicevox"
  timeout: 60
  # 行と行のあいだに入る既定の無音（秒）
  pause: 0.35
  # 匿名の反応（voice_crowd の話者）だけ詰める（2026-09-08）。参考は反応1件3秒台
  pause_crowd: 0.15

# BGM・効果音。assets/audio/ の音源は init-assets で生成される仮素材。
audio:
  bgm: "assets/audio/bgm_loop.wav"   # 空文字にするとBGMなし
  bgm_gain: -22                      # BGMの音量(dB)
  bgm_fade: 2.0                      # 開始/終了のフェード秒
  duck: true                         # 喋っている間だけBGMを下げる
  duck_ratio: 8
  se_gain: -8                        # 効果音の音量(dB)
  scene_se: ""                       # シーン頭に鳴らす効果音（例: assets/audio/se_whoosh.wav）
  loudness_target: -14               # 仕上がりの音圧(LUFS)。YouTubeの基準。0で無効

# 画面の動き。切ると静止画の切り替えだけになる（書き出しは速い）
motion:
  enabled: true
  fps: 30
  telop_in: 0.55       # テロップとカードが出るときのアニメ秒。
                       # 0.18 では出た瞬間に止まって見えた（2026-09-05）
  speaker_pop: 0.16    # 話者が切り替わるときの立ち絵のバウンド秒
  scene_fade: 0.32     # シーン転換にかける秒数
  scene_transition: "dip"   # dip=一度黒に落とす / crossfade=前後を直接混ぜる
  background_zoom: 1.12     # 静止画背景をゆっくり寄せる。1.0 にすると止まったまま

# 冒頭と章の変わり目に出すタイトルカード。0 にすると出さない
titles:
  # 2026-09-07: 0 にした。伸びている参考チャンネルは0秒目から本編が始まっていて、
  # こちらは2.6秒ぶん静止したカードを見せていた（ショートは先に外して効果を確認済み）。
  # タイトルの文言は最初のテロップと同じで、見せている情報も重複していた。
  intro: 0.0           # 冒頭のタイトル（秒）
  # 2026-09-10: 0 にした（ユーザー指摘「章が変わる時、何か差し込んでますな？」）。
  # 章のカードは**無音の静止画**で、出しているのは節の見出しと「3 / 5」という
  # 内部の通し番号。**見出しはその節のあいだ左上に出ているので中身が重複**しており、
  # 通し番号は視聴者に意味がない。1本あたり 1.4秒×(節の数-1)＝4〜6秒を使っていた。
  # 冒頭のカードは 2026-09-07 に同じ理由で 0 にしてある
  chapter: 0.0         # 章タイトル（秒）
  outro: 3.0           # 最後のカード（秒）
  fade: 0.32           # 出入りのフェード（秒）

# 話者定義。style_id は VOICEVOX の「スタイルID」。
#   `python -m src.cli speakers` で ENGINE から一覧を取得できる。
cast:
  # ニュース向け。立ち絵なしのレイアウトではこちらを使う
  キャスター:
    key: anchor
    aliases: [caster, anchor]
    style_id: 2        # 四国めたん / ノーマル
    speed: 1.02
    pitch: 0.0
    intonation: 1.0
    position: none
    color: "#3ea6ff"
  解説:
    key: analyst
    aliases: [analyst, 記者]
    style_id: 13       # 青山龍星 / ノーマル
    speed: 1.0
    pitch: 0.0
    intonation: 1.0
    position: none
    color: "#f0c419"

  # ゆっくり実況向け（show_characters: true のとき）
  霊夢:
    key: reimu
    aliases: [れいむ, reimu]
    style_id: 2        # 四国めたん / ノーマル
    speed: 1.05
    pitch: 0.0
    intonation: 1.1
    position: left
    color: "#e2495a"
  魔理沙:
    key: marisa
    aliases: [まりさ, marisa]
    style_id: 3        # ずんだもん / ノーマル
    speed: 1.05
    pitch: -0.02
    intonation: 1.2
    position: right
    color: "#f0c419"
  ナレーター:
    key: narrator
    aliases: [ナレ, narrator, N]
    style_id: 13       # 青山龍星 / ノーマル
    speed: 1.0
    pitch: 0.0
    intonation: 1.0
    position: none
    color: "#8ab4f8"
