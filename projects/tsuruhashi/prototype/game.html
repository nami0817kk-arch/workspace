<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つるはし採掘</title>
<style>
:root{
  --bg:#f4efe6; --panel:#fffaf2; --panel2:#f1e7d6; --ink:#2b2118; --muted:#7a6a58; --line:#e0d3bf;
  --accent:#d9861c; --accent-ink:#fff; --accent-soft:#fbe6c4; --good:#2f8f5b; --bad:#b8452e;
  --ad:#5b4bc4; --ad-ink:#fff; --ad-soft:#e7e3fb; --sky1:#8fd0f5; --sky2:#e3f4ff; --grass:#5fae4a; --shadow:0 2px 0 rgba(60,40,20,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120f; --panel:#221d18; --panel2:#2c251e; --ink:#f3e9dc; --muted:#b2a08b; --line:#3a3128;
    --accent:#f0a33a; --accent-ink:#1d140a; --accent-soft:#3b2a14; --good:#5cc98c; --bad:#f07a5f;
    --ad:#a79bff; --ad-ink:#16122e; --ad-soft:#2a2545; --sky1:#0c1430; --sky2:#27335c; --grass:#3f7a33; --shadow:0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120f; --panel:#221d18; --panel2:#2c251e; --ink:#f3e9dc; --muted:#b2a08b; --line:#3a3128;
  --accent:#f0a33a; --accent-ink:#1d140a; --accent-soft:#3b2a14; --good:#5cc98c; --bad:#f07a5f;
  --ad:#a79bff; --ad-ink:#16122e; --ad-soft:#2a2545; --sky1:#0c1430; --sky2:#27335c; --grass:#3f7a33; --shadow:0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:480px;margin:0 auto;padding:10px 16px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:40px}
.brand{font-size:11px;color:var(--muted);letter-spacing:.08em}
.brand b{color:var(--accent);font-weight:800}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}
.dev{position:fixed;top:10px;right:10px;z-index:30;font-size:11px;padding:6px 9px;border-radius:999px;border:1px dashed var(--muted);
  background:var(--panel);color:var(--muted);box-shadow:var(--shadow)}
.dev:active{transform:translateY(1px)}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;margin:8px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
.stat .k{font-size:10px;color:var(--muted)}
.stat .v{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.ore .v{font-size:20px;color:var(--accent)}
.stage{position:relative;border-radius:16px;overflow:hidden;height:340px;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 1px var(--line), var(--shadow)}
.stage canvas{display:block;width:100%;height:100%}
.chip{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:4px 8px;font-size:11px;pointer-events:none;max-width:60%}
.chip b{font-size:12px}
.hpbar{height:5px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:4px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:#ffd166;border-radius:3px}
.boostchip{position:absolute;top:8px;right:22px;background:var(--ad);color:var(--ad-ink);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:800;pointer-events:none;display:none}
.lockmsg{position:absolute;left:8px;right:22px;bottom:8px;background:rgba(20,16,12,.78);color:#ffe3b0;border-radius:10px;padding:6px 10px;font-size:12px;pointer-events:none;display:none;line-height:1.4}
.hint{position:absolute;left:0;right:14px;bottom:44%;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;transition:opacity .6s}
.adrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.adbtn{border:0;border-radius:12px;padding:8px 10px;background:var(--ad-soft);color:var(--ad);font-weight:800;font-size:13px;text-align:left;line-height:1.3;box-shadow:var(--shadow)}
.adbtn small{display:block;font-weight:500;font-size:10px;opacity:.85}
.adbtn:disabled{opacity:.55;cursor:default}
.adbtn .tri{display:inline-block;width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:5px;vertical-align:1px}
.zukanbtn{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);font-size:13px;font-weight:800;text-align:left;line-height:1.3}
.zukanbtn small{display:block;font-weight:500;font-size:10px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 0;font-weight:800;font-size:13px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tabs .dot{position:absolute;top:5px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--bad);display:none}
.panel{margin-top:8px}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.card .ic{flex:0 0 44px;height:44px;border-radius:10px;background:var(--panel2);display:grid;place-items:center}
.card .body{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:14px}
.card .nm span{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.card .ds{font-size:11px;color:var(--muted)}
.buy{flex:0 0 auto;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:7px 10px;min-width:84px;font-size:12px;line-height:1.25;box-shadow:var(--shadow)}
.buy small{display:block;font-size:10px;font-weight:500}
.buy:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.buy.flash{animation:flash .25s}
@keyframes flash{50%{transform:scale(1.06)}}
.note{font-size:11px;color:var(--muted);margin:2px 2px 8px}
.need{color:var(--bad);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;min-width:0;position:relative}
.cell .nm{font-size:10px;font-weight:800;line-height:1.25;margin-top:2px;word-break:break-all}
.cell .cnt{font-size:9px;color:var(--muted)}
.cell.unk .nm{color:var(--muted);font-weight:500}
.cell .rar{position:absolute;top:3px;right:5px;font-size:9px;color:var(--accent);font-weight:800}
.cell.new{box-shadow:0 0 0 2px var(--accent)}
.layerhead{font-size:12px;font-weight:800;margin:10px 2px 5px;display:flex;align-items:center;gap:6px}
.layerhead i{width:12px;height:12px;border-radius:3px;display:inline-block}
.foot{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.foot button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 9px;font-size:11px;color:var(--muted)}
.toastwrap{position:fixed;left:0;right:0;top:52px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:25;pointer-events:none;padding:0 16px}
.toast{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px;width:100%;
  animation:tin .35s ease-out both}
.toast .t1{font-size:10px;color:var(--accent);font-weight:800}
.toast .t2{font-size:14px;font-weight:800}
.toast .t3{font-size:10px;color:var(--muted)}
.toast.out{animation:tout .4s ease-in both}
@keyframes tin{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,8,5,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:18px;padding:18px 16px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:tin .3s ease-out both}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .big{font-size:26px;font-weight:800;color:var(--accent);margin:6px 0}
.sheet p{margin:4px 0;font-size:13px}
.sheet .sub{font-size:11px;color:var(--muted)}
.sheet .row{display:grid;gap:8px;margin-top:14px}
.sheet .ok{border:0;border-radius:12px;padding:11px;font-weight:800;background:var(--panel2)}
.sheet .x2{border:0;border-radius:12px;padding:11px;font-weight:800;background:var(--ad);color:var(--ad-ink)}
.sheet .x2 small{display:block;font-weight:500;font-size:10px;opacity:.85}
.finds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.finds span{font-size:11px;background:var(--accent-soft);border-radius:8px;padding:2px 7px}
@media (prefers-reduced-motion: reduce){
  .toast,.sheet,.buy.flash{animation:none}
  .hint{transition:none}
}
/* ---- v2 で足した部品 ---- */
.sheet .x2:disabled{opacity:.45;cursor:default}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.genbadge{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-top:6px}
.tabs button{font-size:12px}
.vein{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;border-radius:50%;background:radial-gradient(circle,#fff6c4 0,#ffd166 35%,rgba(255,209,102,0) 70%);
  color:#4a2f00;font-weight:800;font-size:12px;display:none;z-index:5;animation:veinp 1s ease-in-out infinite}
@keyframes veinp{50%{transform:scale(1.12)}}
.frag{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 2px 2px;font-size:12px}
.frag b{font-size:13px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:800;color:var(--ink)}
.mini:disabled{opacity:.5;cursor:default}
.mini.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setl{font-size:11px;color:var(--muted);margin:4px 2px 0}
.setl.on{color:var(--good);font-weight:800}
.hintl{font-size:11px;color:var(--accent);margin:2px 2px 0}
.sec{font-size:13px;font-weight:800;margin:14px 2px 6px}
.hist{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist th,.hist td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:11px;color:var(--muted);font-weight:500}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
.ach.done{border-color:var(--good);color:var(--good);font-weight:800}
.ach.no{color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;gap:6px}
.creed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.copt{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px;text-align:left;font-size:12px;line-height:1.4}
.copt b{display:block;font-size:14px}
.copt .g{color:var(--good)} .copt .x{color:var(--bad)}
.copt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sheet.wide{max-width:420px;max-height:88vh;overflow:auto}
.cardnote{font-size:12px;color:var(--muted);margin:2px 0}
.big2{font-size:20px;font-weight:800;color:var(--accent)}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent)}
.cell .nm{font-size:11px}
@media (prefers-reduced-motion: reduce){ .vein{animation:none} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app">
  <header>
    <div>
      <div class="brand"><b>つるはし社</b> の放置採掘</div>
      <h1>つるはし採掘</h1>
    </div>
    <div class="genbadge" id="genBadge">初代</div>
  </header>

  <div class="stats">
    <div class="stat ore"><div class="k">鉱石</div><div class="v" id="sOre">0</div></div>
    <div class="stat"><div class="k">深さ</div><div class="v" id="sDepth">0m</div></div>
    <div class="stat"><div class="k">仲間の力／秒</div><div class="v" id="sDps">0</div></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="地層の断面。仲間が掘り進める"></canvas>
    <div class="chip"><b id="cLayer">第1層 表土</b> <span id="cDepth"></span><div class="hpbar"><i id="cHp"></i></div></div>
    <div class="boostchip" id="boostChip">採掘×2 5:00</div>
    <div class="lockmsg" id="lockMsg"></div>
    <div class="hint" id="hint">仲間が掘ります。鉱石で強くしよう</div>
    <button class="vein" id="vein" type="button" aria-label="鉱脈をたたく">鉱脈！</button>
  </div>

  <div class="adrow">
    <button class="adbtn" id="adBoost" type="button"></button>
    <button class="zukanbtn" id="zukanJump" type="button">図鑑 <span id="zCount">0</span>/50<small id="zBonus">1種ごとに鉱石+5%</small></button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="tool">道具<span class="dot" id="dotTool"></span></button>
    <button role="tab" aria-selected="false" data-tab="crew">仲間<span class="dot" id="dotCrew"></span></button>
    <button role="tab" aria-selected="false" data-tab="book">図鑑<span class="dot" id="dotBook"></span></button>
    <button role="tab" aria-selected="false" data-tab="co">社<span class="dot" id="dotCo"></span></button>
  </div>
  <div class="panel" id="pTool"></div>
  <div class="panel" id="pCrew" hidden></div>
  <div class="panel" id="pBook" hidden></div>
  <div class="panel" id="pCo" hidden></div>

  <div class="foot">
    <span id="footName">試作品 ／ つるはし社</span>
    <button type="button" id="devSkip" hidden>+1時間進める（試作用）</button>
  </div>
</div>

<div class="toastwrap" id="toasts"></div>

<div class="modal" id="offModal" role="dialog" aria-modal="true" aria-labelledby="offTitle">
  <div class="sheet">
    <h2 id="offTitle">おかえりなさい</h2>
    <p id="offWhen" class="sub"></p>
    <p id="offText"></p>
    <div class="big" id="offOre"></div>
    <div id="offExtra"></div>
    <div class="row">
      <button class="x2" id="offX2" type="button"></button>
      <button class="ok" id="offOk" type="button">受け取る</button>
    </div>
  </div>
</div>

<div class="modal" id="rbModal" role="dialog" aria-modal="true" aria-labelledby="rbTitle">
  <div class="sheet wide">
    <h2 id="rbTitle">代替わり</h2>
    <div id="rbBody"></div>
    <div class="row">
      <button class="x2" id="rbGo" type="button">代替わりする</button>
      <button class="ok" id="rbCancel" type="button">やめておく</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ================= アプリとのつなぎ（ブラウザでは何もしない） =================
const APP = (typeof window !== 'undefined' && window.__TSURU_APP) || null;
function appPost(o){ try { window.TsuruApp.postMessage(JSON.stringify(o)); } catch (e) {} }
// 保存先。アプリでは WebView の localStorage が消えることがあるので、アプリ側に預ける
const TStore = (() => {
  const mem = APP ? (APP.store || {}) : null; let timers = {};
  return {
    get(k){ if (mem) return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ v = String(v); if (mem) { mem[k] = v; clearTimeout(timers[k]); timers[k] = setTimeout(() => appPost({ type:'store', k, v:mem[k] }), 250); return; } try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ if (mem) { delete mem[k]; clearTimeout(timers[k]); appPost({ type:'store', k, v:null }); return; } try { localStorage.removeItem(k); } catch (e) {} },
    flush(){ if (!mem) return; for (const k in timers) { clearTimeout(timers[k]); if (Object.prototype.hasOwnProperty.call(mem, k)) appPost({ type:'store', k, v:mem[k] }); } timers = {}; },
  };
})();
/*ENGINE-START*/
// ===== つるはし採掘のエンジン（画面を持たない。tool/sim.js もここだけを読む） =====
let NOW = () => Date.now();
let RNG = Math.random;
const LAYER_LEN = 40;                 // 1層 = 40m（1m = 1ブロック）
const NLAYER = 10;
const MAX_DEPTH_LAYERED = LAYER_LEN * NLAYER;
// その層へ抜ける岩盤に必要なつるはしLv（REQ[k] = k層目の底の岩盤）
const REQ = [0, 18, 38, 58, 78, 98, 120, 142, 164, 186];
const SIDE = 0.8;
const OFFLINE_CAP_H = 8;
const CRIT_P = 0.08, CRIT_X = 5;
const DROP_P = 0.12;
// 採掘の倍率：広告を見るたびに ×2→×3→×4→×5。見るたびに残りは5分に戻り、切れたら ×1（2026-10-03 ユーザー指示「広告はさらに×」）
const BOOST_SEC = 300, BOOST_LV_MAX = 4;
const REBIRTH_DEPTH = 240;            // 6層の底で代替わりできる
const ENV = (globalThis.process && process.env) || {};   // tool/sim.js で数値を試すときだけ使う
const HP_G = +(ENV.HP_G || 1.094), ORE_G = +(ENV.ORE_G || 1.072);
const isBed = d => d > 0 && d % LAYER_LEN === 0 && d / LAYER_LEN < NLAYER;
const isRoom = d => d % LAYER_LEN === LAYER_LEN / 2 && d < MAX_DEPTH_LAYERED;
const bandOf = d => d % LAYER_LEN >= LAYER_LEN - 8;   // ★★が出る、層の終わり近く
const HP0 = +(ENV.HP0 || 10);
const baseHp = d => HP0 * Math.pow(HP_G, d);
const oreRaw = d => 1.5 * Math.pow(ORE_G, d);
const layerIdxForDepth = d => Math.min(NLAYER - 1, Math.floor(d / LAYER_LEN) - (isBed(d) ? 1 : 0));
// つるはしは仲間の力の倍率（1Lv ごとに+2%、10Lv ごとに1.15倍）。プレイヤーはたたかない（2026-10-03 ユーザー指示「クリックは不要」）
const PK_A = +(ENV.PK_A || 0.02), PK_B = +(ENV.PK_B || 1.15), CREW_K = +(ENV.CREW_K || 2);
const pickMul = l => (1 + PK_A * (l - 1)) * Math.pow(PK_B, Math.floor(l / 10));
const PICK_TIER = [
  ['石頭のつるはし', '#9a958c'], ['鉄のつるはし', '#b9c2cc'], ['鋼のつるはし', '#e4ebf2'], ['黒鉄のつるはし', '#4d525e'],
  ['水晶のつるはし', '#b89cff'], ['紅蓮のつるはし', '#ff6a2a'], ['古代のつるはし', '#f2c43d'], ['湖底のつるはし', '#3fc1c9'],
  ['菌糸のつるはし', '#8bd17c'], ['巨骨のつるはし', '#efe6d0'], ['星核のつるはし', '#ff9ee8'], ['白金のつるはし', '#e5e4e2'],
  ['翠玉のつるはし', '#2ecc71'], ['蒼玉のつるはし', '#3f7fe0'], ['黒曜のつるはし', '#2a2633'], ['陽光のつるはし', '#ffcc33'],
  ['月光のつるはし', '#cfd8ff'], ['極光のつるはし', '#7ff0c8'], ['虹のつるはし', '#ff8fd1'], ['伝説のつるはし', '#7ff0ff'],
];
const tierOf = l => Math.min(PICK_TIER.length - 1, Math.floor(l / 10));

const WK = [

function normalize(o){
  const S = Object.assign(fresh(), o || {});
  if (!Array.isArray(S.w)) S.w = [];
  while (S.w.length < WK.length) S.w.push(0);
  if (!S.w.some(n => n > 0)) S.w[0] = 1;
  if (!Array.isArray(S.frag)) S.frag = [];
  while (S.frag.length < LAYERS.length) S.frag.push(0);
  S.st = Object.assign(fresh().st, S.st || {});
  if (!Array.isArray(S.creed)) S.creed = [];
  if (!Array.isArray(S.history)) S.history = [];
  if (!S.roomEver || typeof S.roomEver !== 'object') S.roomEver = {};
  return S;
}

// ================= 倍率 =================
const speciesCountOf = st => Object.keys(st.found).length;
function setsDone(st){
  const out = [];
  for (let L = 0; L < NLAYER; L++) if (itemsOf(L).every(it => st.found[it.id])) out.push(L);
  return out;
}
// 倍率は社訓・名声・図鑑の数だけで決まるので、それが変わるまで覚えておく
const MODS_CACHE = new WeakMap();
function mods(st){
  const sig = st.creed.join(',') + '|' + st.fame + '|' + speciesCountOf(st);
  const c = MODS_CACHE.get(st);
  if (c && c.sig === sig) return c.m;
  const m = calcMods(st);
  MODS_CACHE.set(st, { sig, m });
  return m;
}
function calcMods(st){
  const m = { human:1, machine:1, pick:1, hire:1, crew:1, crewOn:1, ore:1, critP:CRIT_P, critX:CRIT_X, drop:DROP_P, side:SIDE, bedHp:1,
    off:OFFLINE_CAP_H, wkGrow:1.15, pickCost:1, room2:false, fame:1, book:0.05 };
  st.creed.forEach((c, i) => {
    if (!c || !CREEDS[i]) return;
    const f = CREEDS[i][c].f;
    if (f.human) m.human *= f.human; if (f.machine) m.machine *= f.machine; if (f.crew) m.crew *= f.crew; if (f.crewOn) m.crewOn *= f.crewOn;
    if (f.ore) m.ore *= f.ore; if (f.critX) m.critX = f.critX; if (f.critP) m.critP *= f.critP;
    if (f.critOff) m.critP = 0;
    if (f.dropAdd) m.drop += f.dropAdd; if (f.bedHp) m.bedHp *= f.bedHp; if (f.sideMul) m.side *= f.sideMul;
    if (f.offAdd) m.off += f.offAdd; if (f.wkGrow) m.wkGrow = f.wkGrow; if (f.pickCost) m.pickCost *= f.pickCost;
    if (f.room2) m.room2 = true; if (f.fame) m.fame *= f.fame; if (f.bookHalf) m.book /= 2;
  });
  const crit0 = m.critP;
  setsDone(st).forEach(L => {
    const s = SETS[L];
    if (s.k === 'hire') m.hire *= 1 - s.v; else if (s.k === 'pick') m.pick *= 1 + s.v; else if (s.k === 'crew') m.crew *= 1 + s.v; else if (s.k === 'ore') m.ore *= 1 + s.v;
    else if (s.k === 'crit') { if (crit0 > 0) m.critP += s.v; } else if (s.k === 'side') m.side += s.v; else if (s.k === 'drop') m.drop += s.v;
    else if (s.k === 'off') m.off += s.v; else if (s.k === 'fame') m.fame *= 1 + s.v;
  });
  const fm = fameMul(st.fame);
  m.crew *= fm; m.ore *= (1 + m.book * speciesCountOf(st));
  return m;
}
const fameMul = f => 1 + 0.1 * f;
const hpOf = (st, d, M) => isBed(d) ? baseHp(d) * 12 * (M || mods(st)).bedHp : baseHp(d);
const oreOf = (st, d, M) => Math.ceil(oreRaw(d)) * (isBed(d) ? 5 : 1) * (M || mods(st)).ore;
const pickCost = (st, l) => Math.ceil(12 * Math.pow(1.15, l - 1) * mods(st).pickCost);
const wkCost = (st, i, n, M) => { M = M || mods(st); return Math.ceil(WK[i].cost * Math.pow(M.wkGrow, n) * M.hire); };
const HUMAN = 3;   // 0〜2 が人の坑夫、3 から先が機械
const crewBase = (st, M) => st.w.reduce((a, n, i) => a + n * WK[i].dps * (i < HUMAN ? M.human : M.machine), 0) * CREW_K;
const pickBoost = (st, M) => pickMul(st.pick) * (M || mods(st)).pick;
const crewDps = (st, on, M) => { M = M || mods(st); return crewBase(st, M) * pickBoost(st, M) * M.crew * (on ? M.crewOn : 1); };
const boostOn = st => NOW() < st.boostUntil;
const boostMul = st => boostOn(st) ? 1 + (st.boostLv || 1) : 1;
const locked = st => isBed(st.depth) && st.pick < REQ[st.depth / LAYER_LEN];
const reqAt = d => REQ[d / LAYER_LEN];

// ================= 採掘 =================
function pickItem(st, d, M){
  const li = layerIdxForDepth(d);
  let L = li;
  if (li > 0 && RNG() < 0.25) L = Math.floor(RNG() * li);
  const band = L === li && (bandOf(d) || isBed(d));
  const pool = itemsOf(L).filter(it => it.r !== 'l' || band);
  const w = it => it.r === 'l' ? 4 : RAR[it.r].w;
  let tot = pool.reduce((a, it) => a + w(it), 0), x = RNG() * tot;
  for (const it of pool) { x -= w(it); if (x <= 0) return it; }
  return pool[pool.length - 1];
}
function gainItem(st, it, out, fx, how){
  const isNew = !st.found[it.id];
  st.found[it.id] = (st.found[it.id] || 0) + 1;
  if (!isNew) st.frag[it.L]++;
  if (out) out.finds.push(it.id);
  if (fx) fx.find(it, isNew, how);
  return isNew;
}
function rollDrop(st, d, forced, out, fx, M){
  if (!forced && RNG() >= M.drop) return;
  gainItem(st, pickItem(st, d, M), out, fx);
}
// 宝の部屋：初めて開けたときはその層の未発見（★★以外）を1つ。2回目からと、未発見がないときはかけら3つ
function openRoom(st, d, out, fx, M){
  const L = layerIdxForDepth(d);
  const n = M.room2 ? 2 : 1;
  const first = !st.roomEver[d];
  st.roomEver[d] = 1;
  for (let k = 0; k < n; k++) {
    const unk = first ? itemsOf(L).filter(it => !st.found[it.id] && it.r !== 'l') : [];
    if (unk.length) gainItem(st, unk[Math.floor(RNG() * unk.length)], out, fx, 'room');
    else { st.frag[L] += 3; if (fx) fx.frag(L, 3); }
  }
}
// dmg を与える。out は集計、fx は演出（留守の計算では null）
function applyDamage(st, dmg, out, fx){
  let guard = 0, M = mods(st);
  while (dmg > 1e-9 && guard++ < 20000) {
    if (locked(st)) {
      const pd = st.depth - 1, php = hpOf(st, pd, M);
      const g = dmg / php * oreOf(st, pd, M) * M.side;
      st.ore += g; st.total += g; if (out) out.ore += g;
      st.side += dmg;
      let n = Math.floor(st.side / php); st.side -= n * php;
      n = Math.min(n, 40);
      for (let k = 0; k < n; k++) rollDrop(st, pd, false, out, fx, M);
      if (fx) fx.side(g);
      return;
    }
    const need = hpOf(st, st.depth, M) - st.dmg;
    if (dmg >= need) {
      dmg -= need; st.dmg = 0;
      const d = st.depth, jack = RNG() < M.critP, g = oreOf(st, d, M) * (jack ? M.critX : 1);
      if (jack) st.st.crits++;
      st.ore += g; st.total += g; if (out) { out.ore += g; out.meters++; }
      st.depth++; st.st.blocks++;
      if (isBed(d)) st.st.beds++;
      if (st.depth > st.genDepth) st.genDepth = st.depth;
      if (st.depth > st.best) st.best = st.depth;
      if (fx) fx.brk(d, g, jack);
      const before = speciesCountOf(st);
      if (isRoom(d) && !st.room[d]) { st.room[d] = 1; openRoom(st, d, out, fx, M); }
      rollDrop(st, d, isBed(d), out, fx, M);
      if (speciesCountOf(st) !== before) M = mods(st);
    } else { st.dmg += dmg; dmg = 0; }
  }
}

function simulateAway(st, sec){
  const s2 = JSON.parse(JSON.stringify(st));

  const dps = crewDps(s2, false);
  const boostLeft = Math.max(0, Math.min(sec, (st.boostUntil - (NOW() - sec * 1000)) / 1000));
  const total = dps * (sec + boostLeft * (boostMul(st) - 1));
  const steps = 60;
  for (let i = 0; i < steps; i++) applyDamage(s2, total / steps, out, null);
  out.stuck = locked(s2);

  return out;
}

function buildBook(){
  const M = mods(S);
  let h = `<div class="note">1種そろうごとに鉱石が${Math.round(M.book * 100)}%ずつ増えます。同じ物はその層の「かけら」になり、売るか、鑑定でまだ見ていない物と換えられます。図鑑は代替わりしても残ります。</div>`;
  const done = setsDone(S);
  for (let L = 0; L < NLAYER; L++) {
    const reached = S.best >= L * LAYER_LEN;
    const its = itemsOf(L);
    h += `<div class="layerhead"><i style="background:${LAYERS[L].block}"></i>第${L + 1}層 ${reached ? LAYERS[L].name : '？？？'}<span style="color:var(--muted);font-weight:500">（${L * LAYER_LEN}m〜）</span></div><div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr))">`;
    for (const it of its) {
      const n = S.found[it.id] || 0;
      const isNew = n && !S.seen[it.id];
      h += n
        ? `<div class="cell${isNew ? ' new' : ''}" title="${esc(it.desc)}"><span class="rar">${RAR[it.r].label}</span>${iconSvg(it, 30)}<div class="nm">${it.name}</div><div class="cnt">${n}個</div></div>`
        : `<div class="cell unk"><span class="rar">${RAR[it.r].label}</span>${iconSvg(it, 30, true)}<div class="nm">？？？</div><div class="cnt">&nbsp;</div></div>`;
    }
    h += `</div>`;
    if (reached) {
      const ac = appraiseCost(S, L), f = S.frag[L];
      h += `<div class="frag">かけら <b>${f}</b>
        <button class="mini" type="button" data-sell="${L}" ${f ? '' : 'disabled'}>1つ売る +${fmt(fragPrice(S, L))}</button>
        ${ac != null ? `<button class="mini acc" type="button" data-appr="${L}" ${f >= ac ? '' : 'disabled'}>鑑定する（かけら${ac}）</button>` : ''}</div>`;
      const lit = its.find(it => it.r === 'l');
      if (!S.found[lit.id]) h += hintShown(S, L)
        ? `<div class="hintl">手がかり：★★は ${L * LAYER_LEN + LAYER_LEN - 8}〜${(L + 1) * LAYER_LEN}m（層の終わり近く）でだけ出る</div>`
        : `<div class="hintl" style="color:var(--muted)">この層の★を2つそろえると、★★の手がかりが分かる</div>`;
    }
    h += `<div class="setl${done.includes(L) ? ' on' : ''}">${done.includes(L) ? '✓ ' : ''}5種そろうと：${SETS[L].label}</div>`;
  }
  $('pBook').innerHTML = h;
  $('pBook').querySelectorAll('[data-sell]').forEach(b => b.addEventListener('click', () => {
    const L = +b.dataset.sell, g = sellFrag(S, L);
    if (g) { sfx('buy'); floatText(cx(), rowY(S.depth) - 30, '+' + fmt(g), '#ffd166', 18); buildBook(); updateUI(); save(); }
  }));
  $('pBook').querySelectorAll('[data-appr]').forEach(b => b.addEventListener('click', () => {
    const before = setsDone(S).length;
    const it = appraise(S, +b.dataset.appr, FX);
    if (it) { afterFind(before); buildBook(); updateUI(); save(); }
  }));
}

// 社（代替わり・社訓・社史・実績・設定）
let resetArm = 0;
function buildCo(){
  const g = fameGain(S), can = canRebirth(S);
  const fm = fameMul(S.fame), fm2 = fameMul(S.fame + g);
  let h = `<div class="card" style="display:block">
    <div class="nm">${genName(S.gen)}社長</div>
    <div class="cardnote">この代の最深 ${S.genDepth}m ／ これまでの最深 ${S.best}m</div>
    <div class="cardnote">名声 <b>${fmt(S.fame)}</b>（仲間の力 ×${fm.toFixed(1)}）</div>`;
  if (can) {
    h += `<div style="margin-top:8px">代替わりすると <span class="big2">名声 +${fmt(g)}</span><div class="cardnote">力は ×${fm.toFixed(1)} → ×${fm2.toFixed(1)}。深さ・つるはし・仲間・鉱石は最初に戻り、図鑑・かけら・名声・社史は残ります。深く掘ってから譲るほど、名声は多くなります。</div></div>
      <button class="buy" id="rbOpen" type="button" style="margin-top:8px;width:100%">代替わりを考える</button>`;
  } else {
    const p = Math.min(1, S.genDepth / REBIRTH_DEPTH);
    h += `<div class="cardnote" style="margin-top:6px">${REBIRTH_DEPTH}m（第6層の底）に着くと、会社を次の代に譲れます（代替わり）。</div><div class="prog"><i style="width:${(p * 100).toFixed(1)}%"></i></div>`;
  }
  h += `</div>`;
  // 社訓
  h += `<div class="sec">社訓</div>`;
  if (!S.creed.filter(Boolean).length) h += `<div class="note">代替わりのたびに1組ずつ増え、組ごとにどちらか1つを選びます。選び直せるのは次の代替わりのときです。</div>`;
  else h += S.creed.map((c, i) => c ? `<div class="card"><div class="body"><div class="nm">${CREEDS[i][c].n}</div><div class="ds"><span style="color:var(--good)">${CREEDS[i][c].g}</span> ／ <span style="color:var(--bad)">${CREEDS[i][c].b}</span></div></div></div>` : '').join('');
  // 社史
  h += `<div class="sec">社史</div>`;
  if (!S.history.length) h += `<div class="note">代替わりすると、その代の記録がここに残ります。</div>`;
  else h += `<table class="hist"><tr><th>代</th><th>最深</th><th>図鑑</th><th>名声</th><th>期間</th></tr>` +
    S.history.map(r => `<tr><td>${genName(r.gen)}</td><td>${r.depth}m</td><td>${r.species}</td><td>+${fmt(r.fame)}</td><td>${fmtDur((r.end - r.start) / 1000)}</td></tr>`).join('') + `</table>`;
  // 実績
  const na = Object.keys(S.ach).length;
  h += `<div class="sec">実績 ${na}/${ACH.length}</div><div class="achs">` +
    ACH.map(a => `<div class="ach ${S.ach[a.id] ? 'done' : 'no'}">${S.ach[a.id] ? '✓ ' : ''}${a.n}</div>`).join('') + `</div>`;
  // 設定
  h += `<div class="sec">設定</div><div class="setrow">
    <button class="mini" type="button" id="soundBtn">音：${S.sound ? 'あり' : 'なし'}</button>
    <button class="mini" type="button" id="hapBtn">振動：${S.haptic ? 'あり' : 'なし'}</button>
    <button class="mini" type="button" id="themeBtn">表示：${({ auto:'自動', light:'明るい', dark:'暗い' })[S.theme]}</button>
  </div>`;
  if (APP) h += `<div class="sec">広告</div><div class="setrow">
    ${APP.adFree ? '<span class="note">広告を消しています。動画を見ずに効果を受け取れます。</span>' : `<button class="mini acc" type="button" id="buyBtn">広告を消す${APP.price ? '（' + esc(APP.price) + '）' : ''}</button>`}
    <button class="mini" type="button" id="restoreBtn">購入を復元</button></div>`;
  h += `<div class="sec">記録</div><div class="setrow"><button class="mini" type="button" id="resetBtn">記録をすべて消す</button></div>`;
  if (APP && APP.credits) h += `<div class="note" style="margin-top:10px">${esc(APP.credits)}</div>`;
  $('pCo').innerHTML = h;
  if ($('rbOpen')) $('rbOpen').addEventListener('click', openRebirth);
  $('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); sfx('ui'); buildCo(); });
  $('hapBtn').addEventListener('click', () => { S.haptic = !S.haptic; save(); haptic('light'); buildCo(); });
  $('themeBtn').addEventListener('click', () => { S.theme = ({ auto:'light', light:'dark', dark:'auto' })[S.theme]; applyTheme(); save(); buildCo(); });
  if ($('buyBtn')) $('buyBtn').addEventListener('click', () => appPost({ type:'buy' }));
  if ($('restoreBtn')) $('restoreBtn').addEventListener('click', () => appPost({ type:'restore' }));
  $('resetBtn').addEventListener('click', e => {
    if (Date.now() - resetArm < 3000) {
      TStore.set(BAK, JSON.stringify(S));
      const keep = { sound:S.sound, haptic:S.haptic, theme:S.theme };
      S = Object.assign(fresh(), keep); camY = -4; parts.length = 0; floats.length = 0; resetArm = 0;
      buildPanels(); setTab('tool'); save(); setTimeout(() => banner(0), 300); return;
    }
    resetArm = Date.now(); e.target.textContent = 'もう一度押すと、代替わりも図鑑も消えます';
    setTimeout(() => { if (Date.now() - resetArm >= 3000 && $('resetBtn')) $('resetBtn').textContent = '記録をすべて消す'; }, 3100);
  });
}

let tab = 'tool';

}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { setTab(b.dataset.tab); sfx('ui'); }));
$('zukanJump').addEventListener('click', () => { setTab('book'); $('pBook').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });

function nextReq(){
  const nextBed = (Math.floor(S.depth / LAYER_LEN) + (isBed(S.depth) ? 0 : 1)) * LAYER_LEN;
  const k = nextBed / LAYER_LEN;
  if (k < 1 || k >= NLAYER) return null;
  return { at: nextBed, lv: REQ[k], k };
}
let lastBook = -1, coSeen = 0, lastFrag = '';

  const M = mods(S);
  $('sOre').textContent = fmt(S.ore);
  $('sDepth').textContent = S.depth + 'm';
  $('sDps').textContent = fmt(crewDps(S, true, M) * boostMul(S));
  $('genBadge').textContent = genName(S.gen) + (S.fame ? `・名声${fmt(S.fame)}` : '');
  const li = layerIdxForDepth(S.depth);
  $('cLayer').textContent = isBed(S.depth) ? '岩盤' : isRoom(S.depth) && !S.room[S.depth] ? '宝の部屋' : `第${li + 1}層 ${LAYERS[li].name}`;
  $('cDepth').textContent = S.depth + 'm';
  $('cHp').style.width = Math.max(0, 100 - S.dmg / hpOf(S, S.depth, M) * 100).toFixed(1) + '%';

  $('pickBuy').innerHTML = `強くする<small>${fmt(c)} 鉱石</small>`;
  $('pickBuy').disabled = S.ore < c;
  const nr = nextReq();
  $('pickNote').innerHTML = nr
    ? `次の岩盤（${nr.at}m）を割るには <b class="${S.pick < nr.lv ? 'need' : ''}">Lv${nr.lv}</b> が必要${S.pick >= nr.lv ? '（足りています）' : ''}`
    : '岩盤はもうありません。どこまでも掘り進めます。';
  $('dotTool').style.display = S.ore >= c ? 'block' : 'none';
  let anyCrew = false;
  WK.forEach((w, i) => {
    const cc = wkCost(S, i, S.w[i], M);
    // まだ手の届かない仲間は、一つ前を雇うまで伏せる
    $('wC' + i).style.display = i === 0 || S.w[i] || S.w[i - 1] ? '' : 'none';
    $('wN' + i).textContent = S.w[i] ? `${S.w[i]}人` : '';
    const b = $('wB' + i); b.innerHTML = `雇う<small>${fmt(cc)} 鉱石</small>`; b.disabled = S.ore < cc;
    if (S.ore >= cc) anyCrew = true;
  });
  $('crewNote').textContent = `仲間は画面を閉じている間も掘り続けます（最大${M.off}時間）。`;
  $('dotCrew').style.display = anyCrew ? 'block' : 'none';
  const sc = speciesCountOf(S);
  $('zCount').textContent = sc;
  $('zBonus').textContent = `鉱石 +${Math.round(sc * M.book * 100)}%（1種ごとに+${Math.round(M.book * 100)}%）`;
  $('dotBook').style.display = ITEMS.some(it => S.found[it.id] && !S.seen[it.id]) || LAYERS.some((x, L) => { const a = appraiseCost(S, L); return a != null && S.frag[L] >= a; }) ? 'block' : 'none';
  const fk = S.frag.join(',');
  if (tab === 'book' && (force || lastBook !== sc || lastFrag !== fk)) buildBook();
  lastBook = sc; lastFrag = fk;
  $('dotCo').style.display = canRebirth(S) && fameGain(S) >= Math.max(1, S.fame * 0.5) || Object.keys(S.ach).length > coSeen ? 'block' : 'none';
  // 岩盤
  const lm = $('lockMsg');
  if (locked(S)) {
    lm.style.display = 'block';
    lm.innerHTML = `<b>岩盤！</b> つるはし <b>Lv${reqAt(S.depth)}</b> で割れる（今 Lv${S.pick}）<br>それまで仲間は横掘りで鉱石を集めています`;
  } else lm.style.display = 'none';
  // 広告
  const bc = $('boostChip'), ab = $('adBoost');
  if (boostOn(S)) {
    const r = Math.ceil((S.boostUntil - NOW()) / 1000);
    bc.style.display = 'block'; bc.textContent = `採掘×${boostMul(S)} ${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`;
  } else bc.style.display = 'none';
  const cur = boostMul(S), nx = boostNext(S);
  ab.disabled = !!pendingAd;
  ab.innerHTML = pendingAd ? '<span class="tri"></span>動画を読み込んでいます…<small>しばらくお待ちください</small>'
    : !boostOn(S) ? adLabel('採掘×2を5分', '続けて見るほど倍率が上がる（×5まで）')
    : nx > cur ? adLabel(`採掘×${nx}に上げる`, `いま×${cur}。見ると残りが5分に戻る`)
    : adLabel(`採掘×${cur}を5分に戻す`, '最大の×5です');
}

function onBuyPick(){
  if (!buyPick(S)) return;
  const tierUp = S.pick % 10 === 0;
  sfx(tierUp ? 'tier' : 'buy'); haptic(tierUp ? 'success' : 'light');
  flash($('pickBuy'));
  if (tierUp && tierOf(S.pick) === S.pick / 10) { toast('つるはしが進化', PICK_TIER[tierOf(S.pick)][0], `仲間の力 ×${PK_B}（合わせて ×${pickBoost(S).toFixed(2)}）`, pickIcon(S.pick)); fxRing(); }
  else if (tierUp) { toast('つるはしの節目', `Lv${S.pick}`, `仲間の力 ×${PK_B}（合わせて ×${pickBoost(S).toFixed(2)}）`, pickIcon(S.pick)); fxRing(); }
  if (isBed(S.depth) && S.pick === reqAt(S.depth)) floatText(cx(), rowY(S.depth) + 16, '割れる！', '#ffd166', 22);

}
function onBuyWorker(i){

  sfx('buy'); haptic('light'); flash($('wB' + i));

function flash(el){ if (reduced) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function haptic(k){ if (!S.haptic) return; if (APP) { appPost({ type:'haptic', k }); return; } try { if (navigator.vibrate) navigator.vibrate(k === 'success' ? [18, 40, 18] : k === 'heavy' ? 30 : 8); } catch (e) {} }

// ================= トースト =================
// 一度に1枚だけ。たまったら順に出す（待たせるのは4件まで）
const toastQ = []; let toastBusy = false;
function toast(t1, t2, t3, icon){
  toastQ.push({ t1, t2, t3, icon });
  if (toastQ.length > 4) toastQ.splice(0, toastQ.length - 4);
  if (!toastBusy) nextToast();
}
function nextToast(){
  const q = toastQ.shift();
  if (!q) { toastBusy = false; return; }
  toastBusy = true;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${q.icon || ''}<div><div class="t1">${q.t1}</div><div class="t2">${q.t2}</div><div class="t3">${q.t3 || ''}</div></div>`;
  $('toasts').appendChild(el);
  const stay = toastQ.length ? 1300 : 2300;
  setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); nextToast(); }, 380); }, stay);
}
// 何か見つけたあと：層の組と★★の手がかり
let hintKnown = null;
function afterFind(setsBefore){
  const now = setsDone(S);
  if (now.length > setsBefore) { const L = now[now.length - 1]; toast('層の組がそろった', `第${L + 1}層 ${LAYERS[L].name}`, SETS[L].label); sfx('tier'); haptic('success'); }
  const hk = LAYERS.map((x, L) => hintShown(S, L) && !S.found[itemsOf(L).find(it => it.r === 'l').id]);
  if (hintKnown) hk.forEach((v, L) => { if (v && !hintKnown[L]) toast('★★の手がかり', `第${L + 1}層の終わり近く`, `${L * LAYER_LEN + LAYER_LEN - 8}〜${(L + 1) * LAYER_LEN}m で出る`); });
  hintKnown = hk;
}

// ================= おかえり =================
let pendingAway = null;
function checkAway(){
  if (pendingAway || rbOpen) return;
  const a = awaySeconds(S, NOW());
  if (a.raw < 0) { S.last = NOW(); return; }      // 時計が戻っていた
  if (a.raw > 60) showAway(a.sec, a.capped, false);
}
function showAway(sec, capped, isDev){
  const r = simulateAway(S, sec);
  pendingAway = r;
  $('offTitle').textContent = isDev ? '1時間進めました（試作用）' : 'おかえりなさい';
  $('offWhen').textContent = isDev ? '留守にしていたのと同じ計算です' : `留守の間 ${fmtDur(sec)}${capped ? `（上限の${mods(S).off}時間まで数えました）` : ''}`;
  const extra = $('offExtra');
  if (crewDps(S, false) === 0) {
    $('offText').textContent = '仲間がいないので、誰も掘っていませんでした。';
    $('offOre').textContent = '0 個';
    extra.innerHTML = '<p class="sub">「仲間」で見習い坑夫を雇うと、閉じている間も掘り進めます。</p>';
    $('offX2').style.display = 'none';
  } else {
    $('offText').innerHTML = r.meters > 0 ? `仲間が <b>${r.meters}m</b> 掘り進んで、鉱石を掘りました` : `仲間は岩盤の前で横掘りを続けて、鉱石を集めました`;
    $('offOre').textContent = `${fmt(r.ore)} 個`;
    const uniq = [...new Set(r.finds)];
    let h = '';
    if (r.stuck) h += `<p class="sub">岩盤で止まり、途中から横掘りしていました（つるはし Lv${reqAt(r.state.depth)} が必要）</p>`;
    if (uniq.length) {
      const news = uniq.filter(id => !S.found[id]);
      h += `<p class="sub">見つけた物 ${r.finds.length}個${news.length ? `（図鑑に新しく ${news.length}種）` : ''}</p><div class="finds">` +
        uniq.map(id => `<span>${ITEM_BY_ID[id].name}${news.includes(id) ? ' 新' : ''}</span>`).join('') + '</div>';
    }
    extra.innerHTML = h;
    $('offX2').style.display = r.ore > 0 ? 'block' : 'none';
    $('offX2').innerHTML = adFree() ? '2倍で受け取る<small>広告なしで受け取れます</small>' : APP ? '2倍で受け取る<small>動画広告を見る</small>' : '2倍で受け取る<small>本番は動画広告（試作は即効果）</small>';
  }
  $('offModal').classList.add('on');
}
function claimAway(mult){
  const r = pendingAway; pendingAway = null;
  $('offModal').classList.remove('on');
  if (!r) return;
  const before = speciesCountOf(S), setsB = setsDone(S).length;
  const beforeDepth = S.depth;
  S = claimAwayState(S, r, mult);
  camY = Math.max(camY, S.depth - 6);
  const gained = speciesCountOf(S) - before;
  if (r.ore > 0) { sfx('find'); floatText(cx(), rowY(S.depth) - 40, '+' + fmt(r.ore * mult), '#ffd166', 24); burst(cx(), rowY(S.depth), 30, LAYERS[layerIdxForDepth(S.depth)].speck, 1.4); }
  if (gained > 0) toast('図鑑に登録', `新しく ${gained}種`, '「図鑑」で確かめよう');
  afterFind(setsB);
  if (layerIdxForDepth(S.depth) !== layerIdxForDepth(beforeDepth)) banner(layerIdxForDepth(S.depth));
  updateUI(true); save();
}
$('offOk').addEventListener('click', () => { claimAway(1); sfx('ui'); });
$('offX2').addEventListener('click', () => {
  if (!pendingAway) return;
  const r = pendingAway;
  // 動画を見ている間に閉じられても、留守の分は失わない（受け取りは見終えたときに2倍で）
  withAd('away', () => { if (pendingAway === r) claimAway(2); });
});
$('devSkip').addEventListener('click', () => { if (pendingAway) return; S.last = NOW() - 3600e3; showAway(3600, false, true); });
$('adBoost').addEventListener('click', () => {
  if (pendingAd) return;
  withAd('boost', () => {
    startBoost(S);
    sfx('tier'); toast(`採掘×${boostMul(S)}`, `5分間 すべての採掘が${boostMul(S)}倍`, boostMul(S) < 1 + BOOST_LV_MAX ? '5分のうちにもう一度見ると、さらに上がる' : '最大の×5'); fxRing();
    updateUI();
  });
});

// ================= 代替わり =================
let rbOpen = false, rbChoice = [], rbArm = 0;
function openRebirth(){
  if (!canRebirth(S)) return;
  rbOpen = true; rbArm = 0;
  const slots = creedSlots(S.gen);
  rbChoice = []; for (let i = 0; i < slots; i++) rbChoice[i] = S.creed[i] || null;
  renderRebirth();
  $('rbModal').classList.add('on');
}

let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function sfx(kind){
  if (!S.sound) return;
  const a = ac(); if (!a) return;
  if (a.state === 'suspended') a.resume();
  const t = a.currentTime;
  const noise = (dur, freq, q, gain) => {
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
  };
  const tone = (f0, f1, dur, gain, type, delay) => {
    const o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine';
    const st = t + (delay || 0);
    o.frequency.setValueAtTime(f0, st); o.frequency.exponentialRampToValueAtTime(f1, st + dur);
    g.gain.setValueAtTime(gain, st); g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
    o.connect(g); g.connect(a.destination); o.start(st); o.stop(st + dur + 0.02);
  };
  if (kind === 'hit') { noise(0.07, 1800 + Math.random() * 900, 1.2, 0.5); tone(220 + Math.random() * 40, 90, 0.06, 0.18, 'triangle'); }
  else if (kind === 'crit') { noise(0.1, 2600, 1, 0.6); tone(880, 440, 0.12, 0.12, 'square'); }
  else if (kind === 'clank') { tone(1900, 1700, 0.18, 0.12, 'square'); tone(2600, 2500, 0.2, 0.06, 'sine'); }
  else if (kind === 'break') { noise(0.22, 500, 0.8, 0.9); tone(140, 50, 0.2, 0.3, 'sine'); }
  else if (kind === 'bed') { noise(0.5, 300, 0.6, 1.0); tone(90, 35, 0.5, 0.45, 'sine'); }
  else if (kind === 'find') { [0, 0.08, 0.16].forEach((d, i) => tone([784, 988, 1319][i], [784, 988, 1319][i] * 1.01, 0.25, 0.12, 'triangle', d)); }
  else if (kind === 'rare') { [0, 0.07, 0.14, 0.21].forEach((d, i) => tone([659, 880, 1109, 1568][i], [659, 880, 1109, 1568][i], 0.35, 0.12, 'triangle', d)); }
  else if (kind === 'vein') { [0, 0.05, 0.1].forEach((d, i) => tone([1046, 1318, 1568][i], [1046, 1318, 1568][i], 0.12, 0.1, 'sine', d)); noise(0.12, 3000, 1, 0.3); }
  else if (kind === 'buy') { tone(520, 780, 0.09, 0.1, 'triangle'); }
  else if (kind === 'tier') { tone(392, 784, 0.25, 0.12, 'triangle'); tone(588, 1176, 0.3, 0.08, 'sine', 0.06); }
  else if (kind === 'ui') { tone(700, 700, 0.03, 0.05, 'sine'); }
}

// 仲間は雇った人数だけ描く（2026-10-03 ユーザー指示「×でやるのではなく人をちゃんと増やす」）。
// 増えたら竪坑に足場を段々に組んで上の段へ並べる。一度に描くのは CREW_CAP 人まで（種類ごとの割合は保つ）
const CREW_PER = [0.95, 0.75, 1.3, 0.12, 0.5, 0.9, 0.2];
const CREW_CAP = 100, ROW_GAP = 26, ROWS_MAX = 6, ZMIN = 0.6, GAP_H = 14, GAP_M = 30;   // 横幅は最大 1/ZMIN 倍。超えたら足場の段を足す。人は少し重なって並ぶ
let crewLay = null, crewKey = '';
function crewAlloc(){
  const tot = S.w.reduce((a, b) => a + b, 0);
  if (tot <= CREW_CAP) return S.w.slice();
  // 雇っている種類は必ず1人は描き、残りを人数の割合で配る
  const out = S.w.map(n => n ? 1 : 0);
  let room = CREW_CAP - out.reduce((a, b) => a + b, 0);
  const rest = S.w.map((n, i) => Math.max(0, n - out[i])), rt = rest.reduce((a, b) => a + b, 0);
  rest.forEach((n, i) => { const k = Math.min(n, Math.floor(room * n / rt)); out[i] += k; });
  return out;
}
function layoutCrew(){
  const key = S.w.join(',') + '|' + W;
  if (key === crewKey && crewLay) return crewLay;
  crewKey = key;
  const alloc = crewAlloc();
  // 機械は床に、人は床の残りと足場に。並びは種類が混ざるように hash で散らす
  const machines = [], humans = [];
  alloc.forEach((n, i) => { for (let k = 0; k < n; k++) (i >= HUMAN ? machines : humans).push({ i, k }); });
  const mix = a => a.map(f => ({ f, h: hash(f.i * 7919 + f.k * 104729) })).sort((a, b) => a.h - b.h).map(o => o.f);
  const queue = mix(machines).concat(mix(humans));
  // まず床1段に並べきれる幅まで竪坑を広げる
  const wOf = f => f.i >= HUMAN ? GAP_M : GAP_H;
  const need = queue.reduce((a, f) => a + wOf(f), 0) + 32 + 52;
  const b0 = baseSW(), sw = Math.max(b0, Math.min(b0 / ZMIN, need)), figs = [];
  let q = 0;
  // 真ん中（社長）から左右へ交互に並べる。並びきらなければ上の段へ
  for (let row = 0; row < ROWS_MAX && q < queue.length; row++) {
    const sc = 0.72 * Math.pow(0.88, row), g = sc / 0.72, edge = sw / 2 - 12;
    let rc = row === 0 ? 24 : 0, lc = -rc, side = 1;
    while (q < queue.length) {
      const f = queue[q], big = f.i >= HUMAN;
      if (big && row > 1) { q++; continue; }                  // 機械は上の足場に載せない
      const w = (big ? GAP_M : GAP_H) * g;
      const fits = sd => sd > 0 ? rc + w <= edge : lc - w >= -edge;
      if (!fits(side)) { side = -side; if (!fits(side)) break; }
      const x = side > 0 ? rc + w / 2 : lc - w / 2;
      if (side > 0) rc += w; else lc -= w;
      figs.push({ i: f.i, dx: x, row, sc: big ? sc * 1.1 : sc, face: x < 0 ? 1 : -1, ph: (hash(f.i * 31 + f.k * 977) % 1000) / 1000 * (CREW_PER[f.i] + 0.25), lt: 0 });
      side = -side; q++;

  return crewLay;
}
function drawCrew(dt, fy){

      ctx.fillStyle = '#5a3d22'; for (let x = sx + 10; x < sx + sw - 10; x += 60) ctx.fillRect(x, y + 4, 3, ROW_GAP - 4);

function swingAngle(t, per){
  const up = -2.3, down = 0.75;

  if (t < hit + back) { const k = (t - hit) / back; return down + (up - down) * (1 - Math.pow(1 - k, 3)); }
  return up;
}

  ctx.fillStyle = '#9ad4ff'; ctx.fillRect(-12, -23, 8, 6);
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-11, -5, 5, 0, 7); ctx.arc(3, -5, 5, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(8, -12); ctx.rotate(0.9);
  ctx.fillStyle = '#c7ced8'; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(22, 0); ctx.lineTo(0, 7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.2;
  for (let k = 0; k < 3; k++) { const px = ((t * 60 + k * 7) % 21); ctx.beginPath(); ctx.moveTo(px, -7 * (1 - px / 22)); ctx.lineTo(px + 3, 7 * (1 - (px + 3) / 22)); ctx.stroke(); }
  ctx.restore(); ctx.restore();
}
function drawRobot(x, y, face, ang, sc){
  ctx.save(); ctx.translate(x, y); ctx.scale(face * sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#555'; ctx.fillRect(-8, -10, 6, 10); ctx.fillRect(2, -10, 6, 10);
  ctx.fillStyle = '#58b7c9'; roundRect(-12, -36, 24, 26, 6); ctx.fill();
  ctx.fillStyle = '#123'; roundRect(-8, -31, 16, 8, 4); ctx.fill();
  ctx.fillStyle = '#7ff0ff'; ctx.beginPath(); ctx.arc(3, -27, 2.4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#58b7c9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(0, -42); ctx.stroke();
  ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(0, -43, 2, 0, 7); ctx.fill();
  drawPick(4, -22, ang, 20, '#7ff0ff', 0.9);
  ctx.restore();
}
function drawCart(x, y, face, t, sc){
  ctx.save(); ctx.translate(x, y); ctx.scale(face * sc, sc);
  const bob = Math.sin(t * 6) * 1.2;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 17, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c98a3a'; ctx.beginPath(); ctx.moveTo(-16, -22 + bob); ctx.lineTo(16, -22 + bob); ctx.lineTo(12, -6); ctx.lineTo(-12, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a7f6f'; for (let k = -12; k <= 8; k += 7) { ctx.beginPath(); ctx.arc(k + 2, -23 + bob, 4, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-8, -4, 4, 0, 7); ctx.arc(8, -4, 4, 0, 7); ctx.fill();
  ctx.restore();
}
function drawShield(x, y, face, t, sc){
  ctx.save(); ctx.translate(x, y); ctx.scale(face * sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6f7b8a'; roundRect(-22, -26, 28, 24, 5); ctx.fill();
  ctx.fillStyle = '#e0b23a'; ctx.fillRect(-22, -10, 28, 3);
  ctx.save(); ctx.translate(12, -14); ctx.rotate(reduced ? 0 : t * 5);
  ctx.fillStyle = '#e0b23a'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();

  for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke(); }

let tAll = 0;
function draw(dt){
  tAll += dt;
  const tz = layoutCrew().z;
  Z = reduced ? tz : Z + (tz - Z) * Math.min(1, dt * 3);
  VW = W / Z; VH = H / Z;
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, 0, 0);
  const target = S.depth;
  camY = reduced ? target : camY + (target - camY) * Math.min(1, dt * 7);
  let ox = 0, oy = 0;
  if (shakeT > 0) { ox = (Math.random() - 0.5) * 7 * shakeT / 0.3; oy = (Math.random() - 0.5) * 7 * shakeT / 0.3; }
  ctx.save(); ctx.translate(ox, oy);
  const g = ctx.createLinearGradient(0, rowY(-8), 0, rowY(0));
  g.addColorStop(0, sky1); g.addColorStop(1, sky2);
  ctx.fillStyle = g; ctx.fillRect(-10, -10, VW + 20, VH + 20);
  const top = Math.floor(camY - baseY() / R) - 1, bot = Math.ceil(camY + (VH - baseY()) / R) + 1;
  if (top < 0) drawSurface();
  const sw = shaftW(), sx = cx() - sw / 2;
  for (let m = Math.max(0, top); m <= bot; m++) {
    const y = rowY(m), li = layerIdxForDepth(m), L = LAYERS[li], bed = isBed(m);
    const room = isRoom(m) && !S.room[m];
    ctx.fillStyle = bed ? '#2c2c33' : L.wall; ctx.fillRect(-10, y, VW + 20, R + 0.6);
    for (let c = 0; c < Math.ceil((VW + 20) / 16); c++) {
      const h = hash(m * 7919 + c * 131);
      if (h % 4 !== 0) continue;
      const px = c * 16 + (h >>> 3) % 12 - 6, py = y + ((h >>> 8) % (R - 6)) + 2, s = 2 + (h >>> 12) % 3;
      if (px > sx - 2 && px < sx + sw + 2 && m < S.depth) continue;
      ctx.fillStyle = bed ? '#4a4a55' : L.speck;
      if (L.glow && !bed) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tAll * 2 + h % 7); }
      ctx.fillRect(px, py, s, s);
      ctx.globalAlpha = 1;
    }
    if (bed) {
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 3;
      for (let x = -R; x < VW + R; x += 12) { ctx.beginPath(); ctx.moveTo(x, y + R); ctx.lineTo(x + R, y); ctx.stroke(); }
    }
    if (m < S.depth) {
      ctx.fillStyle = L.hollow; ctx.fillRect(sx, y - 0.3, sw, R + 0.9);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(sx, y - 0.3, 6, R + 0.9); ctx.fillRect(sx + sw - 6, y - 0.3, 6, R + 0.9);
      if (m % 5 === 0) {
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(sx + 2, y, 5, R); ctx.fillRect(sx + sw - 7, y, 5, R);
        ctx.fillStyle = '#7d5a35'; ctx.fillRect(sx, y, sw, 4);
      }
    } else if (m === S.depth) {
      const hitOff = blockHitT < 0.08 && !reduced ? (Math.random() - 0.5) * 3 : 0;
      ctx.save(); ctx.translate(hitOff, 0);
      ctx.fillStyle = bed ? '#3a3a44' : L.block; ctx.fillRect(sx, y, sw, R);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(sx, y, sw, 3);
      if (bed) {
        ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 4;
        for (let x = sx; x < sx + sw; x += 14) { ctx.beginPath(); ctx.moveTo(x, y + R); ctx.lineTo(x + 14, y + 3); ctx.stroke(); }
        ctx.fillStyle = '#8a8a99'; for (let x = sx + 10; x < sx + sw; x += 40) { ctx.beginPath(); ctx.arc(x, y + R / 2, 2.5, 0, 7); ctx.fill(); }
      }
      if (room) drawRoomGlow(sx, y, sw);
      const r = S.dmg / hpOf(S, m);
      if (r > 0.02) {
        ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
        const n = Math.min(9, Math.ceil(r * 9));
        for (let k = 0; k < n; k++) {
          const h = hash(m * 31 + k * 977);
          let px = sx + 16 + (h % Math.max(1, (sw - 32))), py = y + 2;
          ctx.beginPath(); ctx.moveTo(px, py);
          for (let s = 0; s < 4; s++) { const hh = hash(h + s * 17); px += ((hh % 17) - 8); py += (R - 4) / 4; ctx.lineTo(px, py); }
          ctx.stroke();
        }
      }
      ctx.restore();
    } else {
      ctx.fillStyle = bed ? '#34343c' : shade(L.block, -0.12); ctx.fillRect(sx, y, sw, R);
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(sx, y, sw, 1);
      for (let c = 0; c < 6; c++) { const h = hash(m * 313 + c * 71); if (h % 3) continue; ctx.fillStyle = bed ? '#4a4a55' : L.speck; ctx.globalAlpha = 0.8; ctx.fillRect(sx + 8 + (h >>> 4) % (sw - 16), y + 4 + (h >>> 9) % (R - 10), 3, 3); ctx.globalAlpha = 1; }
      if (room) drawRoomGlow(sx, y, sw);
    }
    if (m % 5 === 0 && m > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = `700 ${(10 / Z).toFixed(1)}px "M PLUS Rounded 1c", sans-serif`; ctx.textAlign = 'left';
      ctx.fillText(m + 'm', 5 / Z, y + 12 / Z);
    }
  }
  if (S.depth > 8) {
    const lx = cx(), ly = rowY(S.depth) - 30;
    const rg = ctx.createRadialGradient(lx, ly, 20, lx, ly, Math.max(VW, VH) * 0.75);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, `rgba(0,0,0,${Math.min(0.55, 0.15 + S.depth / 400)})`);
    ctx.fillStyle = rg; ctx.fillRect(-10, -10, VW + 20, VH + 20);
  }
  // 仲間
  const fy = rowY(S.depth);
  drawCrew(dt, fy);
  swingT += dt;
  const pang = swingT < 0.4 ? swingAngle(swingT, 1) : -2.3 + Math.sin(tAll * 2.2) * 0.06;
  drawPerson(cx(), fy, 1, '#f2c230', 1, pang, PICK_TIER[tierOf(S.pick)][1], true);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    ctx.globalAlpha = Math.min(1, p.life / 0.3);
    if (p.spark) { ctx.strokeStyle = p.c; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt;
    if (p.t > 1.4) { pops.splice(i, 1); continue; }
    const k = Math.min(1, p.t / 0.35), y = p.y - 20 - 50 * (1 - Math.pow(1 - k, 3));
    ctx.globalAlpha = p.t > 1 ? (1.4 - p.t) / 0.4 : 1;
    const rr = ctx.createRadialGradient(p.x, y, 2, p.x, y, 34);
    rr.addColorStop(0, 'rgba(255,240,180,.9)'); rr.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = rr; ctx.beginPath(); ctx.arc(p.x, y, 34, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(p.x - 16, y - 16); ctx.scale(0.8, 0.8);
    ctx.fillStyle = p.it.color; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5;
    ctx.fill(pathOf(p.it.shape), 'evenodd'); ctx.stroke(pathOf(p.it.shape));
    ctx.restore(); ctx.globalAlpha = 1;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.life -= dt;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    f.y -= 38 * dt;
    ctx.globalAlpha = Math.min(1, f.life / 0.4);
    ctx.font = `800 ${(f.size / Math.sqrt(Z)).toFixed(1)}px "M PLUS Rounded 1c", sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 3.5 / Math.sqrt(Z); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sideShowT += dt;
  if (sideShowT > 1 && sideAcc > 0) { floatText(cx() - 60, rowY(S.depth) - 30, '横掘り +' + fmt(sideAcc), '#ffe3a3', 13); sideAcc = 0; sideShowT = 0; }
  if (ringT < 0.8) {
    ringT += dt;
    const k = ringT / 0.8;
    ctx.strokeStyle = `rgba(255,209,102,${1 - k})`; ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(cx() * Z, (fy - 25) * Z, 20 + k * 90, 0, 7); ctx.stroke();
  }
  if (boostOn(S)) { ctx.strokeStyle = `rgba(167,155,255,${0.45 + 0.25 * Math.sin(tAll * 5)})`; ctx.lineWidth = 2 + 2 * boostMul(S) / 2; ctx.strokeRect(2, 2, W - 4, H - 4); }
  if (bannerT < 2.6) {
    bannerT += dt;
    const a = bannerT < 0.3 ? bannerT / 0.3 : bannerT > 2 ? (2.6 - bannerT) / 0.6 : 1;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H * 0.2, W - MAP_W, 58);
    ctx.textAlign = 'center'; ctx.fillStyle = LAYERS[bannerL].speck; ctx.font = '800 12px "M PLUS Rounded 1c", sans-serif';
    ctx.fillText(bannerL === 0 ? `つるはし社 ${genName(S.gen)} 採掘はじめ` : `${bannerL * LAYER_LEN}m 到達`, (W - MAP_W) / 2, H * 0.2 + 20);
    ctx.fillStyle = '#fff'; ctx.font = '800 22px "M PLUS Rounded 1c", sans-serif';
    ctx.fillText(`第${bannerL + 1}層 ${LAYERS[bannerL].name}`, (W - MAP_W) / 2, H * 0.2 + 46);
    ctx.globalAlpha = 1;
  }

  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);

}
function drawRoomGlow(sx, y, sw){
  const a = reduced ? 0.7 : 0.55 + 0.35 * Math.sin(tAll * 3);
  ctx.strokeStyle = `rgba(255,209,102,${a})`; ctx.lineWidth = 3; ctx.strokeRect(sx + 2, y + 2, sw - 4, R - 4);
  ctx.fillStyle = `rgba(255,209,102,${a * 0.9})`;
  const bx = sx + sw / 2;
  ctx.beginPath(); ctx.moveTo(bx - 12, y + R - 8); ctx.lineTo(bx - 12, y + 14); ctx.quadraticCurveTo(bx, y + 4, bx + 12, y + 14); ctx.lineTo(bx + 12, y + R - 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(80,50,0,.6)'; ctx.fillRect(bx - 12, y + 16, 24, 2); ctx.fillRect(bx - 2, y + 16, 4, 7);
}
function crewHit(i, fx0, face){
  const x = fx0 + face * 14, y = rowY(S.depth);
  if (locked(S)) sparks(x, y, reduced ? 1 : 3);
  else burst(x, y, i === 2 ? 8 : 3, LAYERS[layerIdxForDepth(S.depth)].block, i === 2 ? 1 : 0.6);
  if (i === 2 && !reduced && !locked(S)) { shakeT = Math.max(shakeT, 0.06); burst(x, y, 4, '#ffb347', 1); }
}
function drawSurface(){
  const y0 = rowY(0);
  if (dark) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 26; i++) { const h = hash(i * 97 + 5); ctx.fillRect(h % Math.floor(VW), y0 - 20 - (h >>> 8) % 240, 1.5, 1.5); }
    ctx.fillStyle = '#f3ecc8'; ctx.beginPath(); ctx.arc(VW - 60, y0 - 150, 14, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255,236,150,.9)'; ctx.beginPath(); ctx.arc(VW - 62, y0 - 150, 18, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const cxl = ((tAll * 6) % (VW + 120)) - 60;
    ctx.beginPath(); ctx.arc(cxl, y0 - 120, 12, 0, 7); ctx.arc(cxl + 14, y0 - 124, 15, 0, 7); ctx.arc(cxl + 30, y0 - 118, 11, 0, 7); ctx.fill();
  }
  ctx.fillStyle = dark ? '#1c2748' : '#b8dcc0';
  ctx.beginPath(); ctx.moveTo(-10, y0);
  for (let x = -10; x <= VW + 10; x += 20) ctx.lineTo(x, y0 - 30 - 18 * Math.sin(x * 0.02) - 10 * Math.sin(x * 0.05));
  ctx.lineTo(VW + 10, y0); ctx.fill();
  ctx.fillStyle = grass; ctx.fillRect(-10, y0 - 7, VW + 20, 8);
  const bx = 18, by = y0 - 7;
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(bx + 8, by - 32, 4, 32); ctx.fillRect(bx + 58, by - 32, 4, 32);
  ctx.fillStyle = '#f5e6c8'; roundRect(bx, by - 50, 70, 24, 4); ctx.fill();
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#6b3d14'; ctx.font = '800 12px "M PLUS Rounded 1c", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('つるはし社', bx + 35, by - 33);
  const sw = shaftW(), sx = cx() - sw / 2;
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx + sw - 10, y0 - 7); ctx.lineTo(sx + sw - 30, y0 - 56); ctx.lineTo(sx + sw + 10, y0 - 56); ctx.lineTo(sx + sw - 10, y0 - 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(40,30,20,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx + sw - 10, y0 - 56); ctx.lineTo(sx + sw - 10, rowY(S.depth) - 60); ctx.stroke();
}
function drawMap(){
  const x = W - MAP_W, total = MAX_DEPTH_LAYERED, h = H - 16;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x, 0, MAP_W, H);
  for (let l = 0; l < NLAYER; l++) {
    ctx.fillStyle = S.best >= l * LAYER_LEN ? LAYERS[l].block : '#333';
    ctx.fillRect(x + 4, 8 + h * l * LAYER_LEN / total, MAP_W - 8, h * LAYER_LEN / total - 1);
  }
  const mark = (d, col) => { const my = 8 + h * Math.min(total, d) / total; ctx.fillStyle = col; ctx.fillRect(x + 2, my - 1, MAP_W - 4, 2); return my; };
  if (S.best > S.depth) mark(S.best, 'rgba(255,255,255,.5)');
  const my = mark(S.depth, '#ffd166');
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.moveTo(x + 1, my - 4); ctx.lineTo(x + 6, my); ctx.lineTo(x + 1, my + 4); ctx.fill();
}

// ================= ループ =================
let lastFrame = performance.now(), uiT = 0, saveT = 0, achT = 0, lastLayer = -1;
function frame(now){
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  // 止まっていた（裏に回っていた）なら留守として数える
  if (dt > 60 && !pendingAway) { checkAway(); dt = 0; }
  dt = Math.min(dt, 0.1);
  if (!pendingAway && !rbOpen) {
    const setsB = setsDone(S).length, spB = speciesCountOf(S);
    tick(S, dt, FX);
    bossSwing(dt);
    if (speciesCountOf(S) !== spB) afterFind(setsB);
    // 鉱脈
    if (veinLeft > 0) { veinLeft -= dt; if (veinLeft <= 0) veinEl.style.display = 'none'; }
    else if ((veinNext -= dt) <= 0) { veinNext = 90 + Math.random() * 60; if (S.depth > 0) showVein(); }
  }
  draw(dt);
  uiT += dt; saveT += dt; achT += dt;
  if (uiT > 0.2) { uiT = 0; updateUI(); }
  if (achT > 2) {
    achT = 0;
    for (const a of checkAch(S)) { toast('実績', a.n, `実績 ${Object.keys(S.ach).length}/${ACH.length}`); }
    if (tab === 'co' && !rbOpen) buildCoLight();
  }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
// 社の画面は、代替わりの数字だけ追いかける（ボタンを作り直すと押しにくい）
let coKey = '';
function buildCoLight(){ const k = canRebirth(S) + ':' + fameGain(S) + ':' + S.genDepth + ':' + Object.keys(S.ach).length; if (k !== coKey) { coKey = k; buildCo(); } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); TStore.flush(); }
  else { lastFrame = performance.now(); checkAway(); }
});
window.addEventListener('pagehide', () => { save(); TStore.flush(); });
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readSky); } catch (e) {} }

// 起動
const had = load();
applyTheme();
if (!APP) { $('devSkip').hidden = false; } else { $('footName').textContent = 'つるはし社'; }
camY = S.depth > 0 ? S.depth : -4;
if (S.depth > 0) $('hint').style.opacity = '0'; else setTimeout(() => { $('hint').style.opacity = '0'; }, 5000);
resize(); buildPanels(); updateUI(true);
hintKnown = LAYERS.map((x, L) => hintShown(S, L) && !S.found[itemsOf(L).find(it => it.r === 'l').id]);
coSeen = Object.keys(S.ach).length;
if (loadBroken) toast('お知らせ', '保存が壊れていたので、少し前の記録から戻しました', '');
if (had) checkAway();
if (!had) setTimeout(() => banner(0), 400);
requestAnimationFrame(frame);
})();
