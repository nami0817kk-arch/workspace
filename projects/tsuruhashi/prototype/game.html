<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つるはし採掘</title>
<style>
:root{
  --bg:#efe6d6; --panel:#fffaf1; --panel2:#f3e8d5; --ink:#2b2118; --muted:#6f604f; --line:#e1d2ba;
  --accent:#c8740f; --accent2:#e8932a; --accent-ink:#fff; --accent-soft:#fbe6c4; --good:#2a7d4f; --bad:#b03d26;
  --ad:#5646c2; --ad2:#7a66e8; --ad-ink:#fff; --ad-soft:#e8e4fb; --sky1:#8fd0f5; --sky2:#e3f4ff; --grass:#5fae4a;
  --hud:#2b2118; --hud-ink:#fff4dc; --shadow:0 2px 0 rgba(60,40,20,.14); --lift:0 6px 18px rgba(60,40,20,.16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120f; --panel:#221d18; --panel2:#2c251e; --ink:#f3e9dc; --muted:#b9a892; --line:#3a3128;
    --accent:#f0a33a; --accent2:#f6b85c; --accent-ink:#1d140a; --accent-soft:#3b2a14; --good:#5cc98c; --bad:#f07a5f;
    --ad:#a79bff; --ad2:#c2b8ff; --ad-ink:#16122e; --ad-soft:#2a2545; --sky1:#0c1430; --sky2:#27335c; --grass:#3f7a33;
    --hud:#0d0b09; --hud-ink:#fff4dc; --shadow:0 2px 0 rgba(0,0,0,.35); --lift:0 6px 18px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120f; --panel:#221d18; --panel2:#2c251e; --ink:#f3e9dc; --muted:#b9a892; --line:#3a3128;
  --accent:#f0a33a; --accent2:#f6b85c; --accent-ink:#1d140a; --accent-soft:#3b2a14; --good:#5cc98c; --bad:#f07a5f;
  --ad:#a79bff; --ad2:#c2b8ff; --ad-ink:#16122e; --ad-soft:#2a2545; --sky1:#0c1430; --sky2:#27335c; --grass:#3f7a33;
  --hud:#0d0b09; --hud-ink:#fff4dc; --shadow:0 2px 0 rgba(0,0,0,.35); --lift:0 6px 18px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
@media (min-width:560px){ body{background:repeating-linear-gradient(135deg,rgba(0,0,0,.035) 0 12px,transparent 12px 24px),var(--bg)} .app{box-shadow:0 0 40px rgba(0,0,0,.18)} }
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden;line-height:1.5;font-size:14px;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
[hidden]{display:none!important}

/* ---- 1画面の骨組み（上の帯・採掘の絵・操作の欄・タブ） ---- */
.app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px 6px;background:var(--hud);color:var(--hud-ink)}
.hud .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hud .brand{font-size:12px;font-weight:800;color:#f6b85c;letter-spacing:.06em}
.hud .gen{font-size:12px;color:#d9c8ad;white-space:nowrap}
.hud .ore{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.hud .ore b{font-size:24px;font-weight:800;color:#ffd166;white-space:nowrap;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hud .ore small{font-size:12px;color:#d9c8ad}
.iconbtn{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:var(--hud-ink);display:grid;place-items:center}
.iconbtn:active{background:rgba(255,255,255,.2)}
.substats{flex:0 0 auto;display:flex;justify-content:space-between;gap:8px;padding:0 12px 8px;background:var(--hud);color:#d9c8ad;font-size:12px}
.substats b{color:var(--hud-ink);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}

.stage{flex:0 0 auto;position:relative;height:clamp(280px,46dvh,440px);overflow:hidden;background:#000;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:100%}
.chip{position:absolute;top:8px;left:8px;background:rgba(15,10,6,.72);color:#fff;border-radius:12px;padding:5px 10px;font-size:12px;pointer-events:none;max-width:62%;backdrop-filter:blur(2px)}
.chip b{font-size:14px}
.hpbar{height:5px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:4px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:#ffd166;border-radius:3px}
.boostchip{position:absolute;top:8px;right:22px;background:linear-gradient(135deg,#5646c2,#7a66e8);color:#fff;border-radius:12px;padding:5px 10px;font-size:14px;font-weight:800;pointer-events:none;display:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.goal{position:absolute;left:8px;right:22px;bottom:8px;background:rgba(15,10,6,.78);color:#ffe9c2;border-radius:12px;padding:6px 10px;font-size:12px;pointer-events:none;line-height:1.35}
.goal b{color:#fff}
.goal .need{color:#ff9b80}
.goal .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:5px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,#f6b85c,#ffd166);border-radius:3px;transition:width .3s}
.goal.lock{background:rgba(70,20,12,.85)}
.goal.lock .bar i{background:linear-gradient(90deg,#ff7b54,#ffb347)}
.hint{position:absolute;left:0;right:14px;top:42%;text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;transition:opacity .8s}
.vein{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:0;border-radius:50%;background:radial-gradient(circle,rgba(255,246,196,.95) 0,rgba(255,209,102,.6) 38%,rgba(255,209,102,0) 70%);
  color:#3a2400;font-weight:800;font-size:12px;display:none;z-index:5;animation:veinp 1s ease-in-out infinite;padding:0;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.vein span{margin-top:-4px;text-shadow:0 0 4px #fff6c4}
@keyframes veinp{50%{transform:scale(1.12)}}
.toastwrap{position:absolute;left:0;right:14px;top:50px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;padding:0 10px}
.toast{background:rgba(255,250,241,.96);color:#2b2118;border:2px solid var(--accent2);border-radius:14px;padding:5px 12px 5px 8px;display:flex;align-items:center;gap:8px;box-shadow:var(--lift);max-width:300px;animation:tin .35s ease-out both}
.toast svg{width:32px;height:32px;flex:0 0 32px}
.toast .t1{font-size:12px;color:#a35d08;font-weight:800;line-height:1.3}
.toast .t2{font-size:14px;font-weight:800;line-height:1.3}
.toast .t3{font-size:12px;color:#6f604f;line-height:1.3}
.toast.out{animation:tout .4s ease-in both}
.toast.k-book{border-color:#e3b23c;background:linear-gradient(180deg,#fffaf1,#fff1cf)}
.toast.k-ach{border-color:#2a7d4f}
.toast.k-ach .t1{color:#1f6a40}
.toast.k-set{border-color:#a77bff}
.toast.k-set .t1{color:#6a45c8}
.toast.k-ad{border-color:#5646c2}
.toast.k-ad .t1{color:#4a3cb0}
@keyframes tin{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}

.adbar{flex:0 0 auto;padding:8px 12px 0}
.adbtn{width:100%;border:0;border-radius:14px;padding:9px 12px;background:linear-gradient(135deg,#5646c2,#7a66e8);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;text-align:left;line-height:1.25;box-shadow:0 3px 0 rgba(40,30,110,.35)}
.adbtn small{display:block;font-weight:500;font-size:12px;opacity:.92}
.adbtn .play{flex:0 0 32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.adbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(40,30,110,.35)}
.adbtn:disabled{opacity:.6;cursor:default}

.panelwrap{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 12px;overscroll-behavior:contain}
.tabs{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:5px 0 3px;font-weight:800;font-size:12px;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tabs .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:9px;height:9px;border-radius:5px;background:var(--bad);display:none;box-shadow:0 0 0 2px var(--panel)}

/* ---- 操作の欄 ---- */
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px}
.phead h2{margin:0;font-size:15px}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:800;color:var(--muted);min-width:44px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.card .ic{flex:0 0 48px;height:48px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}
.card .body{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:15px}
.card .nm span{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.card .ds{font-size:12px;color:var(--muted);line-height:1.4}
.card .ds b{color:var(--ink)}
.card.pick{border:2px solid var(--accent2);background:linear-gradient(180deg,var(--panel),var(--accent-soft))}
.card.pick .ic{flex-basis:56px;height:56px}
.buy{flex:0 0 auto;border:0;border-radius:12px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);font-weight:800;padding:7px 10px;min-width:92px;font-size:14px;line-height:1.25;box-shadow:0 3px 0 rgba(120,60,0,.35)}
.buy small{display:block;font-size:12px;font-weight:500}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,60,0,.35)}
.buy:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.buy.flash{animation:flash .25s}
.buy{position:relative}
.buy.rec::before{content:"おすすめ";position:absolute;top:-9px;right:-4px;background:#2a7d4f;color:#fff;font-size:12px;font-weight:800;line-height:1;padding:3px 6px;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
@keyframes flash{50%{transform:scale(1.07)}}
.mile{height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
.mile i{display:block;height:100%;background:var(--accent2)}
.note{font-size:12px;color:var(--muted);margin:2px 2px 8px}
.need{color:var(--bad);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;min-width:0;position:relative}
.cell .nm{font-size:12px;font-weight:800;line-height:1.25;margin-top:2px;word-break:break-all}
.cell .cnt{font-size:12px;color:var(--muted)}
.cell.unk .nm{color:var(--muted);font-weight:500}
.cell .rar{position:absolute;top:2px;right:4px;font-size:12px;color:var(--accent);font-weight:800}
.cell.new{box-shadow:0 0 0 2px var(--accent2)}
.cell.r-r:not(.unk){border-color:#e3b23c;background:linear-gradient(180deg,var(--panel),rgba(242,196,61,.12))}
.cell.r-l:not(.unk){border-color:#a77bff;background:linear-gradient(180deg,var(--panel),rgba(167,123,255,.14))}
.cell.btn{cursor:pointer}
.lsec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.lsec.locked{opacity:.75}
.layerhead{font-size:14px;font-weight:800;margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.layerhead i{width:14px;height:14px;border-radius:4px;display:inline-block}
.layerhead .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.frag{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 2px 2px;font-size:13px}
.frag b{font-size:15px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;color:var(--ink)}
.mini:disabled{opacity:.5;cursor:default}
.mini.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setl{font-size:12px;color:var(--muted);margin:6px 2px 0}
.setl.on{color:var(--good);font-weight:800}
.hintl{font-size:12px;color:var(--accent);margin:4px 2px 0}
.sec{font-size:15px;font-weight:800;margin:16px 2px 8px}
.hist{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist th,.hist td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:12px;color:var(--muted);font-weight:500}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}
.ach.done{border-color:var(--good);color:var(--good);font-weight:800}
.ach.no{color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;gap:6px}
.creed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.copt{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px;text-align:left;font-size:12px;line-height:1.4}
.copt b{display:block;font-size:15px}
.copt .g{color:var(--good)} .copt .x{color:var(--bad)}
.copt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cardnote{font-size:13px;color:var(--muted);margin:2px 0}
.big2{font-size:22px;font-weight:800;color:var(--accent)}
.prog{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent2)}
.finds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.finds span{font-size:12px;background:var(--accent-soft);border-radius:8px;padding:2px 7px}

/* ---- シート（おかえり・代替わり・設定・図鑑の1種） ---- */
.modal{position:fixed;inset:0;background:rgba(10,8,5,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:20px;padding:18px 16px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:tin .3s ease-out both;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .big{font-size:28px;font-weight:800;color:var(--accent);margin:6px 0}
.sheet p{margin:4px 0;font-size:14px}
.sheet .sub{font-size:12px;color:var(--muted)}
.sheet .row{display:grid;gap:8px;margin-top:14px}
.sheet .ok{border:0;border-radius:12px;padding:12px;font-weight:800;background:var(--panel2)}
.sheet .x2{border:0;border-radius:12px;padding:11px;font-weight:800;background:linear-gradient(135deg,#5646c2,#7a66e8);color:#fff}
.sheet .x2 small{display:block;font-weight:500;font-size:12px;opacity:.9}
.sheet .x2:disabled{opacity:.45;cursor:default}
.sheet.wide{max-width:420px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:0}
.itembig{display:flex;gap:12px;align-items:center;margin:6px 0 4px}
.itembig .ic{flex:0 0 72px;height:72px;border-radius:16px;background:var(--panel2);display:grid;place-items:center}

/* ---- 案内の吹き出し・代替わりの演出・数字の跳ね ---- */
.coach{position:fixed;z-index:30;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:12px;max-width:260px;background:#2b2118;color:#fff4dc;border:2px solid #f6b85c;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:800;line-height:1.4;box-shadow:var(--lift);pointer-events:none;animation:coachb 1.6s ease-in-out infinite}
.coach small{display:block;font-weight:500;color:#d9c8ad;font-size:12px}
.coach::after{content:"";position:absolute;bottom:-9px;left:var(--ax,30px);border:8px solid transparent;border-bottom:0;border-top-color:#f6b85c}
@keyframes coachb{50%{transform:translateY(-4px)}}
.cere{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 40%,rgba(74,52,32,.96),rgba(13,9,6,.98));color:#fff4dc;text-align:center;animation:cerein .5s ease-out both}
.cere .logo{width:110px;height:110px;animation:cerelogo 1.2s ease-out both}
.cere .g1{font-size:14px;letter-spacing:.3em;color:#f6b85c;font-weight:800}
.cere .g2{font-size:32px;font-weight:800;text-shadow:0 3px 0 #000}
.cere .g3{font-size:18px;font-weight:800;color:#ffd166}
.cere .g4{font-size:12px;color:#d9c8ad}
.cere.out{animation:cereout .5s ease-in both}
@keyframes cerein{from{opacity:0}}
@keyframes cereout{to{opacity:0}}
@keyframes cerelogo{0%{transform:scale(.4) rotate(-40deg);opacity:0}60%{transform:scale(1.1) rotate(6deg);opacity:1}100%{transform:none}}
.hud .ore b.pop{animation:orepop .35s ease-out}
@keyframes orepop{40%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){ .coach,.cere,.cere .logo,.hud .ore b.pop{animation:none} }
/* ---- 起動画面 ---- */
.title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 35%,#4a3420 0,#1c140d 60%,#0d0906 100%);color:#fff4dc;text-align:center;padding:24px;transition:opacity .5s}
.title.hide{opacity:0;pointer-events:none}
.title .logo{width:132px;height:132px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.title .co{font-size:14px;letter-spacing:.3em;color:#f6b85c;font-weight:800}
.title h1{margin:0;font-size:36px;font-weight:800;letter-spacing:.06em;text-shadow:0 3px 0 #000}
.title .go{margin-top:10px;border:0;border-radius:999px;padding:13px 42px;font-size:18px;font-weight:800;background:linear-gradient(180deg,#f6b85c,#c8740f);color:#2b1700;box-shadow:0 4px 0 #6b3d08}
.title .go:active{transform:translateY(3px);box-shadow:0 1px 0 #6b3d08}
.title .tip{font-size:13px;color:#d9c8ad;max-width:300px}
@media (prefers-reduced-motion: reduce){
  .toast,.sheet,.buy.flash,.vein{animation:none}
  .hint,.title{transition:none}
  .goal .bar i{transition:none}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="who"><span class="brand">つるはし社</span><span class="gen" id="genBadge">初代</span></div>
    <div class="ore" aria-label="鉱石">
      <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 24 Q10 12 20 12 Q32 10 32 22 Q30 32 18 30 Q8 32 8 24Z" fill="#ffd166" stroke="#7a4d10" stroke-width="2"/><path d="M14 18 l4 -3 l3 3" stroke="#fff6c4" stroke-width="2" fill="none"/></svg>
      <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.05"><b id="sOre">0</b><small id="sRate">+0／秒</small></span>

const fresh = () => ({

function normalize(o){
  const S = Object.assign(fresh(), o || {});
  if (!Array.isArray(S.w)) S.w = [];
  while (S.w.length < WK.length) S.w.push(0);

// ================= 倍率 =================
const speciesCountOf = st => Object.keys(st.found).length;
function setsDone(st){
  const out = [];
  for (let L = 0; L < NLAYER; L++) if (itemsOf(L).every(it => st.found[it.id])) out.push(L);
  return out;
}
// 倍率は社訓・名声・図鑑の数だけで決まるので、それが変わるまで覚えておく
const MODS_CACHE = new WeakMap();
function mods(st){
  const sig = st.creed.join(',') + '|' + st.fame + '|' + speciesCountOf(st);
  const c = MODS_CACHE.get(st);
  if (c && c.sig === sig) return c.m;
  const m = calcMods(st);
  MODS_CACHE.set(st, { sig, m });
  return m;
}
function calcMods(st){
  const m = { human:1, machine:1, pick:1, hire:1, crew:1, crewOn:1, ore:1, critP:CRIT_P, critX:CRIT_X, drop:DROP_P, side:SIDE, reqMul:1,
    off:OFFLINE_CAP_H, wkGrow:1.15, pickCost:1, room2:false, fame:1, book:0.05 };
  st.creed.forEach((c, i) => {
    if (!c || !CREEDS[i]) return;
    const f = CREEDS[i][c].f;
    if (f.human) m.human *= f.human; if (f.machine) m.machine *= f.machine; if (f.crew) m.crew *= f.crew; if (f.crewOn) m.crewOn *= f.crewOn;
    if (f.ore) m.ore *= f.ore; if (f.critX) m.critX = f.critX; if (f.critP) m.critP *= f.critP;
    if (f.critOff) m.critP = 0;
    if (f.dropAdd) m.drop += f.dropAdd; if (f.reqMul) m.reqMul *= f.reqMul; if (f.sideMul) m.side *= f.sideMul;
    if (f.offAdd) m.off += f.offAdd; if (f.wkGrow) m.wkGrow = f.wkGrow; if (f.pickCost) m.pickCost *= f.pickCost;
    if (f.room2) m.room2 = true; if (f.fame) m.fame *= f.fame; if (f.bookHalf) m.book /= 2;
  });
  const crit0 = m.critP;
  setsDone(st).forEach(L => {
    const s = SETS[L];
    if (s.k === 'hire') m.hire *= 1 - s.v; else if (s.k === 'pick') m.pick *= 1 + s.v; else if (s.k === 'crew') m.crew *= 1 + s.v; else if (s.k === 'ore') m.ore *= 1 + s.v;
    else if (s.k === 'crit') { if (crit0 > 0) m.critP += s.v; } else if (s.k === 'side') m.side += s.v; else if (s.k === 'drop') m.drop += s.v;
    else if (s.k === 'off') m.off += s.v; else if (s.k === 'fame') m.fame *= 1 + s.v;
  });
  const fm = fameMul(st.fame);
  m.crew *= fm; m.ore *= (1 + m.book * speciesCountOf(st));
  return m;
}
const fameMul = f => 1 + 0.1 * f;
// 岩盤は Lv が届けばすぐ割れる（固さは普通のブロックと同じ）。待ちは Lv の関門だけ（2026-10-03「掘れなくなる時がある」）
const hpOf = (st, d, M) => baseHp(d);
const oreOf = (st, d, M) => Math.ceil(oreRaw(d)) * (isBed(d) ? 5 : 1) * (M || mods(st)).ore;
const pickCost = (st, l) => Math.ceil(12 * Math.pow(1.15, l - 1) * mods(st).pickCost);
const wkCost = (st, i, n, M) => { M = M || mods(st); return Math.ceil(WK[i].cost * Math.pow(M.wkGrow, n) * M.hire); };
const HUMAN = 3;   // 0〜2 が人の坑夫、3 から先が機械
const crewBase = (st, M) => st.w.reduce((a, n, i) => a + n * WK[i].dps * (i < HUMAN ? M.human : M.machine), 0) * CREW_K;
const pickBoost = (st, M) => pickMul(st.pick) * (M || mods(st)).pick;
const crewDps = (st, on, M) => { M = M || mods(st); return crewBase(st, M) * pickBoost(st, M) * M.crew * (on ? M.crewOn : 1); };
const boostOn = st => NOW() < st.boostUntil;
const boostMul = st => boostOn(st) ? 1 + (st.boostLv || 1) : 1;
const reqAt = (d, st) => Math.ceil(REQ[d / LAYER_LEN] * mods(st).reqMul);
const locked = st => isBed(st.depth) && st.pick < reqAt(st.depth, st);

// ================= 採掘 =================
function pickItem(st, d, M){
  const li = layerIdxForDepth(d);
  let L = li;
  if (li > 0 && RNG() < 0.25) L = Math.floor(RNG() * li);
  const band = L === li && (bandOf(d) || isBed(d));
  const pool = itemsOf(L).filter(it => it.r !== 'l' || band);
  const w = it => it.r === 'l' ? 4 : RAR[it.r].w;
  let tot = pool.reduce((a, it) => a + w(it), 0), x = RNG() * tot;
  for (const it of pool) { x -= w(it); if (x <= 0) return it; }
  return pool[pool.length - 1];
}
function gainItem(st, it, out, fx, how){
  const isNew = !st.found[it.id];
  st.found[it.id] = (st.found[it.id] || 0) + 1;
  if (!isNew) st.frag[it.L]++;
  if (out) out.finds.push(it.id);
  if (fx) fx.find(it, isNew, how);
  return isNew;
}
function rollDrop(st, d, forced, out, fx, M){
  if (!forced && RNG() >= M.drop) return;
  gainItem(st, pickItem(st, d, M), out, fx);
}
// 宝の部屋：初めて開けたときはその層の未発見（★★以外）を1つ。2回目からと、未発見がないときはかけら3つ
function openRoom(st, d, out, fx, M){
  const L = layerIdxForDepth(d);
  const n = M.room2 ? 2 : 1;
  const first = !st.roomEver[d];
  st.roomEver[d] = 1;
  for (let k = 0; k < n; k++) {
    const unk = first ? itemsOf(L).filter(it => !st.found[it.id] && it.r !== 'l') : [];
    if (unk.length) gainItem(st, unk[Math.floor(RNG() * unk.length)], out, fx, 'room');
    else { st.frag[L] += 3; if (fx) fx.frag(L, 3); }
  }
}
// dmg を与える。out は集計、fx は演出（留守の計算では null）
function applyDamage(st, dmg, out, fx){
  let guard = 0, M = mods(st);
  while (dmg > 1e-9 && guard++ < 20000) {
    if (locked(st)) {
      const pd = st.depth - 1, php = hpOf(st, pd, M);
      const g = dmg / php * oreOf(st, pd, M) * M.side;
      st.ore += g; st.total += g; if (out) out.ore += g;
      st.side += dmg;
      let n = Math.floor(st.side / php); st.side -= n * php;
      n = Math.min(n, 40);
      for (let k = 0; k < n; k++) rollDrop(st, pd, false, out, fx, M);
      if (fx) fx.side(g);
      return;
    }
    const need = hpOf(st, st.depth, M) - st.dmg;
    if (dmg >= need) {
      dmg -= need; st.dmg = 0;
      const d = st.depth, jack = RNG() < M.critP, g = oreOf(st, d, M) * (jack ? M.critX : 1);
      if (jack) st.st.crits++;
      st.ore += g; st.total += g; if (out) { out.ore += g; out.meters++; }
      st.depth++; st.st.blocks++;
      if (isBed(d)) st.st.beds++;
      if (st.depth > st.genDepth) st.genDepth = st.depth;
      if (st.depth > st.best) st.best = st.depth;
      if (fx) fx.brk(d, g, jack);
      const before = speciesCountOf(st);
      if (isRoom(d) && !st.room[d]) { st.room[d] = 1; openRoom(st, d, out, fx, M); }
      rollDrop(st, d, isBed(d), out, fx, M);
      if (speciesCountOf(st) !== before) M = mods(st);
    } else { st.dmg += dmg; dmg = 0; }
  }
}
// 開いている間の1フレーム
function tick(st, dt, fx){
  const d = crewDps(st, true) * boostMul(st) * dt;
  if (d > 0) applyDamage(st, d, null, fx);
}
// 留守の計算（st は書き換えない。結果の state を返す）
function simulateAway(st, sec){
  const s2 = JSON.parse(JSON.stringify(st));
  const out = { ore:0, meters:0, finds:[], sec, stuck:false };
  const dps = crewDps(s2, false);
  const boostLeft = Math.max(0, Math.min(sec, (st.boostUntil - (NOW() - sec * 1000)) / 1000));
  const total = dps * (sec + boostLeft * (boostMul(st) - 1));
  const steps = 60;
  for (let i = 0; i < steps; i++) applyDamage(s2, total / steps, out, null);
  out.stuck = locked(s2);
  out.state = s2;
  return out;
}
// 留守の秒数（時計が戻っていたら0、上限で切る）
function awaySeconds(st, now){
  const raw = (now - (st.last || now)) / 1000;
  const cap = mods(st).off * 3600;
  return { sec: Math.max(0, Math.min(raw, cap)), capped: raw > cap, raw };
}
// 留守の結果を受け取る（mult=2 は広告）
function claimAwayState(st, r, mult){
  const keep = { pick:st.pick, w:st.w, boostUntil:st.boostUntil, boostLv:st.boostLv, sound:st.sound, haptic:st.haptic, theme:st.theme, seen:st.seen,
    creed:st.creed, fame:st.fame, gen:st.gen, history:st.history, ach:st.ach, notifAsked:st.notifAsked };
  const ns = Object.assign(r.state, keep);
  if (mult > 1) { ns.ore += r.ore * (mult - 1); ns.total += r.ore * (mult - 1); }
  return ns;
}
// 鉱脈：開いている間だけ出る。たたくと今の採掘45秒ぶんの鉱石
function veinReward(st){
  const M = mods(st);
  const d = locked(st) ? st.depth - 1 : st.depth;
  const rate = crewDps(st, true, M) / hpOf(st, d, M) * oreOf(st, d, M);
  return Math.max(10, rate * 45);
}
function claimVein(st){ const g = veinReward(st); st.ore += g; st.total += g; st.st.veins++; return g; }
// かけら
const fragPrice = (st, L) => Math.ceil(oreRaw(Math.max(st.depth, L * LAYER_LEN + 1)) * 3 * mods(st).ore);
function sellFrag(st, L){ if (st.frag[L] <= 0) return 0; const g = fragPrice(st, L); st.frag[L]--; st.ore += g; st.total += g; st.st.sold++; return g; }
function appraiseCost(st, L){
  const unk = itemsOf(L).filter(it => !st.found[it.id]);
  if (!unk.length) return null;
  return unk.some(it => it.r !== 'l') ? APPRAISE_COST : APPRAISE_COST_L;
}
function appraise(st, L, fx){
  const c = appraiseCost(st, L);
  if (c == null || st.frag[L] < c) return null;
  const unk = itemsOf(L).filter(it => !st.found[it.id]);
  const pool = unk.some(it => it.r !== 'l') ? unk.filter(it => it.r !== 'l') : unk;
  const it = pool[Math.floor(RNG() * pool.length)];
  st.frag[L] -= c; st.st.appraise++;
  gainItem(st, it, null, fx, 'appraise');
  return it;
}
// 層の★がそろうと、★★の手がかりが出る
const hintShown = (st, L) => itemsOf(L).filter(it => it.r === 'r').every(it => st.found[it.id]);

// ================= 買う =================
function buyPick(st){
  const c = pickCost(st, st.pick);
  if (st.ore < c) return false;
  st.ore -= c; st.pick++;
  return true;
}
function buyWorker(st, i){
  const c = wkCost(st, i, st.w[i]);
  if (st.ore < c) return false;
  st.ore -= c; st.w[i]++;
  return true;
}
// まとめ買い：n 個ぶんの値段（等比の和）。want='max' は買えるだけ（買えないときは1個ぶんの値段）
function bulk(c0, g, ore, want){
  let n = want;
  if (want === 'max') n = Math.max(1, Math.floor(Math.log(1 + ore * (g - 1) / c0) / Math.log(g)));
  let cost = Math.ceil(c0 * (Math.pow(g, n) - 1) / (g - 1));
  if (want === 'max' && n > 1 && cost > ore) { n--; cost = Math.ceil(c0 * (Math.pow(g, n) - 1) / (g - 1)); }
  return { n, cost };
}
const pickBulk = (st, want) => bulk(pickCost(st, st.pick), 1.15, st.ore, want);
const wkBulk = (st, i, want, M) => { M = M || mods(st); return bulk(wkCost(st, i, st.w[i], M), M.wkGrow, st.ore, want); };
function buyPickN(st, want){ const b = pickBulk(st, want); if (st.ore < b.cost) return 0; st.ore -= b.cost; st.pick += b.n; return b.n; }
function buyWorkerN(st, i, want){ const b = wkBulk(st, i, want); if (st.ore < b.cost) return 0; st.ore -= b.cost; st.w[i] += b.n; return b.n; }
// 開いている間の鉱石の入り（毎秒）。「あと何秒で買えるか」に使う
function oreRate(st){
  const M = mods(st), lk = locked(st), d = lk ? st.depth - 1 : st.depth;
  const r = crewDps(st, true, M) * boostMul(st) / hpOf(st, d, M) * oreOf(st, d, M);
  return lk ? r * M.side : r * (1 + M.critP * (M.critX - 1));
}
function startBoost(st){
  const now = NOW();
  st.boostLv = boostOn(st) ? (st.boostLv || 1) + 1 : 1;
  st.boostAt = now;
  st.boostUntil = now + BOOST_SEC * 1000;
  st.st.ads++;
}
// 次に見たときの倍率（上限なら今のまま、時間だけ5分に戻る）
const boostNext = st => 1 + (boostOn(st) ? (st.boostLv || 1) + 1 : 1);
// 動画なしで押したとき、次に押せるまでの秒数
const boostWait = st => Math.max(0, Math.ceil(((st.boostAt || 0) + BOOST_GAP * 1000 - NOW()) / 1000));

// ================= 代替わり =================
const canRebirth = st => st.genDepth >= REBIRTH_DEPTH;
let FAME_A = +(ENV.FAME_A || 5), FAME_B = +(ENV.FAME_B || 1.03);
function fameGain(st){
  if (!canRebirth(st)) return 0;
  return Math.floor(FAME_A * Math.pow(FAME_B, st.genDepth - REBIRTH_DEPTH) * mods(st).fame);
}
// 次の代で選べる社訓の組の数
const creedSlots = gen => Math.min(CREEDS.length, gen);
function rebirth(st, creed){
  const g = fameGain(st);
  if (!g) return false;
  st.history.push({ gen:st.gen, depth:st.genDepth, fame:g, species:speciesCountOf(st), start:st.genStart, end:NOW(), creed:st.creed.slice() });
  st.fame += g; st.gen++;
  Object.assign(st, { ore:0, depth:0, dmg:0, side:0, pick:1, w:startCrew(), room:{}, genDepth:0, genStart:NOW() });
  st.creed = (creed || st.creed).slice(0, creedSlots(st.gen - 1));
  return g;
}

// ================= 実績（30） =================
const ACH = [
  ...[40, 80, 120, 160, 200, 240, 280, 320, 360, 400].map((d, i) => ({ id:'d' + d, n:`${d}m に到達`, t:st => st.best >= d, g:i, p:st => [st.best, d] })),

  { id:'c100', n:'大当たりを100回', t:st => st.st.crits >= 100 },
  { id:'v10',  n:'鉱脈を10回', t:st => st.st.veins >= 10 },
  { id:'a1',   n:'はじめての鑑定', t:st => st.st.appraise >= 1 },

function gearPath(){
  let s = '';
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2, r = i % 2 ? 12 : 17;
    const a2 = (i + 1) / 16 * Math.PI * 2;
    const p = (ang, rr) => (20 + Math.cos(ang) * rr).toFixed(1) + ' ' + (20 + Math.sin(ang) * rr).toFixed(1);
    s += (i ? 'L' : 'M') + p(a, r) + 'L' + p(a2 - 0.001, r);
  }
  return s + 'Z M20 14a6 6 0 1 0 .01 0Z';
}
function starPath(){
  let s = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7 : 17; s += (i ? 'L' : 'M') + (20 + Math.cos(a) * r).toFixed(1) + ' ' + (21 + Math.sin(a) * r).toFixed(1); }
  return s + 'Z';
}

function fmt(n){
  if (!isFinite(n)) return '∞';
  n = Math.floor(n);
  if (n < 1e4) return n.toLocaleString('ja-JP');
  if (n >= 1e52) return n.toExponential(2);
  for (const [u, v] of UNITS) if (n >= v) { const x = n / v; return (x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : Math.floor(x).toLocaleString('ja-JP')) + u; }
  return String(n);
}
function fmtDur(sec){
  sec = Math.round(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + '日' + (h ? h + '時間' : '');
  if (h) return h + '時間' + (m ? m + '分' : '');
  if (m) return m + '分';
  return sec + '秒';
}

function updateGoal(){

    const req = reqAt(S.depth, S);
    // Lv が届くまでの鉱石と、今の入りから「約何分」
    const need = bulk(pickCost(S, S.pick), 1.15, 0, req - S.pick).cost, r = oreRate(S);
    const eta = S.ore >= need ? '今すぐ強くできる' : r > 0 ? `約${fmtDur(Math.max(1, (need - S.ore) / r))}` : '';
    txt = `<b>岩盤！</b> <span class="need">Lv${req}</span> で割れる（あと${req - S.pick}Lv・${eta}）`;
    p = S.pick / req;
  } else if (nr) {
    const start = (nr.k - 1) * LAYER_LEN;
    txt = `次の岩盤 <b>${nr.at}m</b> まで${nr.at - S.depth}m・必要 <b class="${S.pick < nr.lv ? 'need' : ''}">Lv${nr.lv}</b>${S.pick >= nr.lv ? ' ✓' : `（いま${S.pick}）`}`;

    if (per > 30) txt += `<br>このブロックあと${fmtDur(per)}・<b>仲間を雇うと速くなる</b>`;
    p = (S.depth - start) / LAYER_LEN;

    txt = canRebirth(S) ? `岩盤はもうありません。深く掘るほど代替わりの名声が増えます（いま +${fmt(fameGain(S))}）` : '岩盤はもうありません。どこまでも掘り進めます';
    p = (S.depth % LAYER_LEN) / LAYER_LEN;
  }
  if (txt !== g._t) { $('goalTxt').innerHTML = txt; g._t = txt; }
  $('goalBar').style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(1) + '%';
}

// 地上の空は端末の時刻で変わる（朝焼け・昼・夕焼け・夜）。暗い表示のときはいつも夜

let dispOre = 0, lastOreTxt = '', popBase = 0, coachT = 0;
