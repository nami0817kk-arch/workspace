{# ADSENSE_CLIENT が空のあいだは何も出さない。
   プレースホルダの <ins> を置いたままだと、中身の無い点線の箱が
   全ページに並ぶだけで、広告審査にも読者にも損しかない。 #}
{% if ADSENSE_CLIENT %}
<div class="ad-slot">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ ADSENSE_CLIENT }}" data-ad-slot="0000000000" data-ad-format="auto"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
